s predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives."}, "answer": "B-A-C", "hint": {"given": "신경 임플란트로 파킨슨병 같은 뇌 질환을 치료, AI 도움으로 뇌 부위를 전기 자극", "A": "환자가 다리를 움직이려 생각하면 AI가 신호를 다리로 보냄, 팔을 잃은 사람도 같은 원리의 의수 사용", "B": "또한 마비 환자가 '디지털 브릿지'로 다시 걸을 수 있음", "C": "의료에서의 성공이 다른 산업으로 퍼지고 20~30년 안에 상용화될 것"}, "clues": [["In addition", "(B)의 '또한' = 주어진 글의 파킨슨병 예시에 두 번째 예시(마비 환자)를 더함"], ["When they think about moving their legs", "(A)의 they = (B)의 마비 환자(paralyzed people), 다시 걷는 원리 설명"], ["Similarly ... the same mechanism", "(A)의 '같은 원리' = 바로 앞 다리 신호 전달 방식"], ["The success of AI-powered neural implants in health care", "(C) = 앞의 의료 사례들(파킨슨병·마비·의수)을 '의료에서의 성공'으로 묶고 다른 산업으로 넘어감"]], "flow": ["예시 1: 파킨슨병 치료(뇌 전기 자극)", "예시 2: 마비 환자가 디지털 브릿지로 다시 걸음", "원리: 생각하면 AI가 신호를 다리로, 의수도 같은 원리", "의료에서의 성공이 다른 산업으로, 일상도 바뀔 것"]}, {"id": "g1_geumcheon_L4-2", "src": "g1_geumcheon_L4.txt", "label": "4과 의료 분야 활용", "type": "insert", "sentence": "When they think about moving their legs, the AI analyzes the brain signals and sends them to their legs through the implants.", "segs": ["For instance, neural implants are used to treat brain disorders like Parkinson's disease.", "These implants electrically stimulate targeted regions of the brain at the right time with the help of AI to restore normal brain activity.", "In addition, paralyzed people can have the ability to walk again with the help of a “digital bridge” between two implants inserted into their brain and spine.", "Similarly, those who have lost their arms can use artificial arms operated by the same mechanism.", "The success of AI-powered neural implants in health care is also expected to spread to other industries.", "Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives."], "answer": 3, "clues": [["they ... their legs", "they = 바로 앞 문장의 마비 환자(paralyzed people), 다리를 움직이는 사람"], ["the implants", "the implants = 앞 문장의 뇌와 척추에 넣은 두 임플란트"], ["Similarly ... the same mechanism", "뒤 문장의 '같은 원리'가 가리킬 원리 설명이 빠지면 흐름이 끊김"]], "flow": ["파킨슨병 같은 뇌 질환 치료", "AI 도움으로 뇌 부위를 전기 자극", "마비 환자: 디지털 브릿지로 다시 걸음", "원리: 생각 → AI가 신호 분석 → 다리로 전달", "팔을 잃은 사람도 같은 원리의 의수 사용", "의료에서의 성공이 다른 산업으로", "20~30년 안에 상용화, 일상이 크게 바뀜"]}, {"id": "g1_geumcheon_L4-3", "src": "g1_geumcheon_L4.txt", "label": "4과 미래 전망", "type": "order", "given": "The success of AI-powered neural implants in health care is also expected to spread to other industries. Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives.", "parts": {"A": "There is also great potential for memory-enhancing brain implants, similar to computer memory chips. Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.", "B": "We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories.", "C": "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds. This could enable us to play games, type social media messages, and stream music simply by thinking."}, "answer": "C-A-B", "hint": {"given": "의료에서의 성공이 다른 산업으로 퍼지고 20~30년 안에 상용화될 것", "A": "기억을 강화하는 뇌 임플란트도 가능, 기억을 저장·강화하고 클라우드에 올리고 내려받음", "B": "기억을 SNS 피드처럼 넘겨 보고, 공유하고, 백업할 수 있음", "C": "예를 들어 마음을 읽는 소프트웨어를 뇌에 설치, 생각만으로 게임·메시지·음악"}, "clues": [["For example", "(C)의 '예를 들어' = 주어진 글의 '일상을 크게 바꿀 것'의 첫 예시"], ["There is also", "(A)의 also = (C)의 마음 읽는 소프트웨어에 이어 두 번째 가능성(기억 임플란트)을 더함"], ["our memories", "(B)의 기억 이야기 = (A)의 '기억을 저장·강화하는 장치(Such devices)'가 있어야 가능한 일"]], "flow": ["의료에서 성공한 기술이 다른 산업으로 퍼지고 일상을 바꿀 것", "예시 1: 마음 읽는 소프트웨어, 생각만으로 게임·메시지", "예시 2: 기억 강화 임플란트, 기억을 클라우드에", "기억을 SNS 피드처럼 보고 공유·백업"]}, {"id": "g1_geumcheon_L4-4", "src": "g1_geumcheon_L4.txt", "
