var DATA={"meta": {"sch": "jusung-go1", "src": "common/sx-data-2610.js", "dir": "mock", "pidx": 6, "lesson": "26년 10월 31번", "title": "", "label": "", "page": "yoyak-2610-31"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "Star Trek을 경제학으로 보면 곧 다가올 세계가 보인다. 고전 경제학은 늘 부족하다는 [[notion|개념]]에서 출발한다.", "en": ["Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "All of classical economics is based on the notion that there isn't usually enough of anything to give everyone everything they want or need."], "kos": ["Star Trek의 세계를 경제학적 관점을 통해 바라보는 사람은 거의 없을지 모르지만, 그렇게 하는 것이 곧 우리에게 닥칠지도 모르는 세계를 들여다볼 수 있는 창을 제공한다.", "고전 경제학 전체는 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 제공하기에는 대체로 어떤 것이든 충분하지 않다는 개념에 기초하고 있다."]}, {"tag": "본문 3번", "ns": [3], "line": "그래서 시장과 [[pricing|가격 책정]]으로 자원을 가장 이익이 큰 곳에 [[allocate|배분한다]].", "en": ["Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit."], "kos": ["그 때문에 우리는 그러한 재화와 서비스 및 자원을 그것들이 가장 큰 이익을 낳을 수 있는 곳에 배분하기 위해 시장과 가격 책정을 이용한다."]}, {"tag": "본문 4~5번", "ns": [4, 5], "line": "Star Trek에는 부족함이 별로 없다. 기술이 음식을 [[reproduce|복제하고]], 수 광년 너머로 [[communicate|의사소통하게]] [[allowed|해 주었다]].", "en": ["In Star Trek, however, there isn't much scarcity.", "Technology has allowed that society to reproduce any food they want, transport themselves thousands of miles in the blink of an eye, communicate over light-years, and travel among the stars."], "kos": ["그러나 Star Trek에서는 희소성이 별로 없다.", "기술은 그 사회가 그들이 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 그들 자신을 수천 마일 이동시키며, 수광년의 거리를 넘어 의사소통하고, 별들 사이를 여행할 수 있게 해 왔다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "모든 사람이 [[prosperity|풍요]]에 [[participate|참여할]] 수 있게 교육받았고, 모두가 탐험가, 연구원, 예술가 같은 일을 한다.", "en": ["All of humanity in that world has been fully educated so that they can participate in this prosperity.", "Everyone is an explorer, researcher, engineer, artist, doctor, or counselor."], "kos": ["그 세계의 모든 인류는 이러한 풍요로움에 참여할 수 있도록 충분히 교육을 받아 왔다.", "모든 사람은 탐험가, 연구원, 기술자, 예술가, 의사 또는 상담사이다."]}, {"tag": "본문 8번", "ns": [8], "line": "생성형 AI는 우리 사회의 많은 [[dimensions|측면]]도 그만큼 [[abundant|풍요롭게]] 만들 수 있다.", "en": ["Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant."], "kos": ["생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워질 수 있게 할 잠재력을 지니고 있다."]}], "story": [{"a": "notion", "form": "notion", "n": 2, "sq": 1, "sum": "rests on the [[idea]]", "hook": "충분하지 않다는 개념에 기초한다는 문장의 notion(개념) → 요약문에서는 idea(생각)로 바꿨어요.", "b": "idea", "k": "개념 → 생각", "en": "All of classical economics is based on the notion that there isn't usually enough of anything to give everyone everything they want or need.", "ko": "고전 경제학 전체는 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 제공하기에는 대체로 어떤 것이든 충분하지 않다는 개념에 기초하고 있다."}, {"a": "pricing", "form": "pricing", "n": 3, "sq": 1, "sum": "markets and [[prices]]", "hook": "시장과 가격 책정을 이용한다는 문장의 pricing(가격 책정) → 요약문에서는 price(가격)로 바꿨어요.", "b": "price", "k": "가격 책정 → 가격", "en": "Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.", "ko": "그 때문에 우리는 그러한 재화와 서비스 및 자원을 그것들이 가장 큰 이익을 낳을 수 있는 곳에 배분하기 위해 시장과 가격 책정을 이용한다."}, {"a": "allocate", "form": "allocate", "n": 3, "sq": 1, "sum": "used to [[distribute]] them", "hook": "자원을 가장 이익이 큰 곳에 배분한다는 문장의 allocate(배분하다) → 요약문에서는 distribute(나누어 주다)로 바꿨어요.", "b": "distribute", "k": "배분하다 → 나누어 주다", "en": "Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.", "ko": "그 때문에 우리는 그러한 재화와 서비스 및 자원을 그것들이 가장 큰 이익을 낳을 수 있는 곳에 배분하기 위해 시장과 가격 책정을 이용한다."}, {"a": "allow", "form": "allowed", "n": 5, "sq": 2, "sum": "technology [[lets]] people", "hook": "기술이 그 사회가 ~하게 해 왔다는 문장의 allow(~하게 해 주다) → 요약문에서는 let(~하게 하다)으로 바꿨어요.", "b": "let", "k": "~하게 해 주다 → ~하게 하다", "en": "Technology has allowed that society to ated so that they can participate in this prosperity.", "ko": "그 세계의 모든 인류는 이러한 풍요로움에 참여할 수 있도록 충분히 교육을 받아 왔다."}, {"a": "dimension", "form": "dimensions", "n": 8, "sq": 3, "sum": "many [[areas]] of our society", "hook": "우리 사회의 많은 측면이라는 문장의 dimension(측면) → 요약문에서는 area(분야)로 바꿨어요.", "b": "area", "k": "측면 → 분야", "en": "Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant.", "ko": "생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워질 수 있게 할 잠재력을 지니고 있다."}, {"a": "abundant", "form": "abundant", "n": 8, "sq": 3, "sum": "just as [[plentiful]]", "hook": "마찬가지로 매우 풍요로워진다는 문장의 abundant(풍부한) → 요약문에서는 plentiful(풍부한)로 바꿨어요.", "b": "plentiful", "k": "풍부한 → 풍부한", "en": "Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant.", "ko": "생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워질 수 있게 할 잠재력을 지니고 있다."}], "passage": [{"n": 1, "en": "Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "ko": "Star Trek의 세계를 경제학적 관점을 통해 바라보는 사람은 거의 없을지 모르지만, 그렇게 하는 것이 곧 우리에게 닥칠지도 모르는 세계를 들여다볼 수 있는 창을 제공한다."}, {"n": 2, "en": "All of classical economics is based on the notion that there isn't usually enough of anything to give everyone everything they want or need.", "ko": "고전 경제학 전체는 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 제공하기에는 대체로 어떤 것이든 충분하지 않다는 개념에 기초하고 있다."}, {"n": 3, "en": "Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.", "ko": "그 때문에 우리는 그러한 재화와 서비스 및 자원을 그것들이 가장 큰 이익을 낳을 수 있는 곳에 배분하기 위해 시장과 가격 책정을 이용한다."}, {"n": 4, "en": "In Star Trek, however, there isn't much scarcity.", "ko": "그러나 Star Trek에서는 희소성이 별로 없다."}, {"n": 5, "en": "Technology has allowed that society to reproduce any food they want, transport themselves thousands of miles in the blink of an eye, communicate over light-years, and travel among the stars.", "ko": "기술은 그 사회가 그들이 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 그들 자신을 수천 마일 이동시키며, 수광년의 거리를 넘어 의사소통하고, 별들 사이를 여행할 수 있게 해 왔다."}, {"n": 6, "en": "All of humanity in that world has been fully educated so that they can participate in this prosperity.", "ko": "그 세계의 모든 인류는 이러한 풍요로움에 참여할 수 있도록 충분히 교육을 받아 왔다."}, {"n": 7, "en": "Everyone is an explorer, researcher, engineer, artist, doctor, or counselor.", "ko": "모든 사람은 탐험가, 연구원, 기술자, 예술가, 의사 또는 상담사이다."}, {"n": 8, "en": "Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant.", "ko": "생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워질 수 있게 할 잠재력을 지니고 있다."}], "questions": [{"id": 1, "summary": "Looking at Star Trek through economics shows a world that may come soon, while classical economics rests on the (A) that resources are limited, so markets and prices are used to (B) them where they bring the most benefit.", "ko": "Star Trek을 경제학으로 보면 곧 다가올지도 모르는 세계가 보이는데, 고전 경제학은 자원이 한정되어 있다는 <b>(A) 생각</b>에 기초하므로, 시장과 가격을 이용해 자원을 가장 큰 이익을 낳는 곳에 <b>(B) 나누어 준다</b>.", "opts": [["idea", "waste"], ["doubt", "distribute"], ["doubt", "waste"], ["idea", "distribute"], ["joke", "hide"]], "optko": ["생각 – 낭비하다", "의심 – 나누어 주다", "의심 – 낭비하다", "생각 – 나누어 주다", "농담 – 숨기다"], "ans": 3, "wrong": ["waste(낭비하다)가 틀려요. 본문은 시장과 가격 책정으로 자원을 가장 큰 이익이 나는 곳에 배분한다(allocate)고 해요.", "doubt(의심)가 틀려요. 고전 경제학은 모두에게 줄 만큼 충분하지 않다는 개념(notion)에 기초해요. 의심하는 게 아니라 그렇게 믿고 출발해요.", "둘 다 틀려요. 고전 경제학은 그 생각을 의심하는 게 아니라 그 위에 서 있고, 자원은 낭비하는 게 아니라 배분해요.", null, "둘 다 틀려요. 농담(joke)이 아니라 경제학의 기본 개념이고, 자원을 숨기는(hide) 게 아니라 나누어 줘요."], "evid": [{"n": 1, "hl": ["provides a window into a world that might soon be upon us"]}, {"n": 2, "hl": ["based on the notion that there isn't usually enough of anything"]}, {"n": 3, "hl": ["we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit"]}], "swaps": [["notion", "idea", "개념 → 생각"], ["pricing", "price", "가격 책정 → 가격"], ["allocate", "distribute", "배분하다 → 나누어 주다"]], "swapnote": "notion(개념)은 idea(생각)로, pricing(가격 책정)은 prices(가격)로, allocate(배분하다)는 distribute(나누어 주다)로 바뀌었어요. there isn't enough(충분하지 않다)는 resources are limited(자원이 한정되어 있다)로 풀었어요.", "use": [{"w": "idea", "ex": "The idea that the Earth is flat is wrong.", "ko": "지구가 평평하다는 생각은 틀렸다.", "wk": "생각, 개념", "hk": "생각"}, {"w": "distribute", "ex": "The teacher will distribute the books.", "ko": "선생님이 책을 나눠 줄 것이다.", "wk": "나누어 주다, 배분하다", "hk": "나눠 줄"}], "flow": "본문 1번에서 Star Trek을 경제학으로 보면 곧 닥칠지도 모르는 세계가 보인다고 하고, 2번에서 고전 경제학은 모두에게 줄 만큼 충분하지 않다는 개념에 기초한다고 해요. 3번에서 그래서 시장과 가격으로 자원을 가장 이익이 큰 곳에 배분한다고 해요.", "jd": [["Looking at Star Trek through economics", "Star Trek을 경제학으로 보는 것은"], ["shows a world that may come soon,", "곧 다가올지도 모르는 세계를 보여 준다,"], ["while classical economics rests on the [[idea]]", "한편 고전 경제학은 [[생각]]에 기초한다"], ["that resources are limited,", "자원이 한정되어 있다는,"], ["so markets and prices are used to [[distribute]] them", "그래서 시장과 가격은 그것들을 [[나누어 주는]] 데 이용된다"], ["where they bring the most benefit.", "그것들이 가장 큰 이익을 가져오는 곳에."]], "fc": [["본문 1~2번", "충분하지 않다는 생각에서 출발", "고전 경제학은 모두에게 줄 만큼 충분하지 않다는 {{notion|개념}}에 기초해요."], ["본문 3번", "그래서 시장과 가격으로 나눈다", "시장과 {{pricing|가격 책정}}으로 자원을 가장 이익이 큰 곳에 {{allocate|배분해요}}."], ["정답 포인트", "{{notion|개념}} = {{idea|생각}}, {{allocate|배분하다}} = {{distribute|나누어 주다}}", "본문 단어가 쉬운 말로 바뀌어 나와요."]], "evid_full": [{"en": "Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "ko": "Star Trek의 세계를 경제학적 관점을 통해 바라보는 사람은 거의 없을지 모르지만, 그렇게 하는 것이 곧 우리에게 닥칠지도 모르는 세계를 들여다볼 수 있는 창을 제공한다.", "hl": ["provides a window into a world that might soon be upon us"], "hlko": ["곧 우리에게 닥칠지도 모르는 세계를 들여다볼 수 있는 창을 제공한다"], "n": 1}, {"en": "All of classical economics is based on the notion that there isn't usually enough of anything to give everyone everything they want or need.", "ko": "고전 경제학 전체는 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 제공하기에는 대체로 어떤 것이든 충분하지 않다는 개념에 기초하고 있다.", "hl": ["based on the notion that there isn't usually enough of anything"], "hlko": ["대체로 어떤 것이든 충분하지 않다는 개념에 기초하고 있다"], "n": 2}, {"en": "Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.", "ko": "그 때문에 우리는 그러한 재화와 서비스 및 자원을 그것들이 가장 큰 이익을 낳을 수 있는 곳에 배분하기 위해 시장과 가격 책정을 이용한다.", "hl": ["we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit"], "hlko": ["우리는 그러한 재화와 서비스 및 자원을 그것들이 가장 큰 이익을 낳을 수 있는 곳에 배분하기 위해 시장과 가격 책정을 이용한다"], "n": 3}]}, {"id": 2, "summary": "In Star Trek, technology lets people (A) any food they want and (B) with one another across light-years, so there is little scarcity.", "ko": "Star Trek에서는 기술 덕분에 사람들이 원하는 어떤 음식이든 <b>(A) 그대로 만들어 내고</b> 수 광년을 넘어 서로 <b>(B) 이야기할</b> 수 있어서, 희소성이 거의 없다.", "opts": [["copy", "fight"], ["copy", "talk"], ["lose", "talk"], ["lose", "fight"], ["waste", "argue"]], "optko": ["그대로 만들어 내다 – 싸우다", "그대로 만들어 내다 – 이야기하다", "잃다 – 이야기하다", "잃다 – 싸우다", "낭비하다 – 말다툼하다"], "ans": 1, "wrong": ["fight(싸우다)가 틀려요. 본문은 기술 덕분에 수 광년을 넘어 의사소통한다(communicate)고 해요.", null, "lose(잃다)가 틀려요. 기술은 원하는 어떤 음식이든 복제하게(reproduce) 해 줘요. 음식을 잃는 게 아니에요.", "둘 다 틀려요. 음식을 잃는 게 아니라 복제하고, 서로 싸우는 게 아니라 의사소통해요.", "둘 다 틀려요. 음식을 낭비하는(waste) 이야기도, 말다툼하는(argue) 이야기도 없어요. 기술이 풍요를 만든다는 이야기예요."], "evid": [{"n": 4, "hl": ["there isn't much scarcity"]}, {"n": 5, "hl": ["Technology has allowed that society", "reproduce any food they want", "communicate over light-years"]}], "swaps": [["allow", "let", "~하게 해 주다 → ~하게 하다"], ["reproduce", "copy", "복제하다 → 그대로 만들어 내다"], ["communicate", "talk", "의사소통하다 → 이야기하다"]], "swapnote": "allow(~하게 해 주다)는 let(~하게 하다)으로, reproduce(복제하다)는 copy(그대로 만들어 내다)로, communicate(의사소통하다)는 talk(이야기하다)로 바뀌었어요.", "use": [{"w": "copy", "ex": "This machine can copy any picture.", "ko": "이 기계는 어떤 그림이든 복사할 수 있다.", "wk": "복사하다, 그대로 만들어 내다", "hk": "복사할"}, {"w": "talk", "ex": "We talk on the phone every night.", "ko": "우리는 매일 밤 전화로 이야기한다.", "wk": "이야기하다, 소통하다", "hk": "이야기한다"}], "flow": "본문 4번에서 Star Trek에는 희소성이 별로 없다고 하고, 5번에서 그 이유로 기술이 음식을 복제하고, 순식간에 이동하고, 수 광년 너머로 의사소통하고, 별 사이를 여행하게 해 준다고 해요.", "jd": [["In Star Trek,", "Star Trek에서는,"], ["technology lets people [[copy]] any food they want", "기술 덕분에 사람들이 원하는 어떤 음식이든 [[그대로 만들어 낸다]]"], ["and [[talk]] with one another across light-years,", "그리고 수 광년을 넘어 서로 [[이야기한다]],"], ["so there is little scarcity.", "그래서 희소성이 거의 없다."]], "fc": [["본문 4번", "Star Trek에는 부족함이 없다", "Star Trek에는 {{scarcity|희소성}}이 별로 없어요."], ["본문 5번", "기술이 다 해 준다", "기술이 음식을 {{reproduce|복제하고}} 수 광년 너머로 {{communicate|의사소통하게}} 해 줘요."], ["정답 포인트", "{{reproduce|복제하다}} = {{copy|그대로 만들어 내다}}, {{communicate|의사소통하다}} = {{talk|이야기하다}}", "같은 뜻의 다른 단어예요."]], "evid_full": [{"en": "In Star Trek, however, there isn't much scarcity.", "ko": "그러나 Star Trek에서는 희소성이 별로 없다.", "hl": ["there isn't much scarcity"], "hlko": ["희소성이 별로 없다"], "n": 4}, {"en": "Technology has allowed that society to reproduce any food they want, transport themselves thousands of miles in the blink of an eye, communicate over light-years, and travel among the stars.", "ko": "기술은 그 사회가 그들이 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 그들 자신을 수천 마일 이동시키며, 수광년의 거리를 넘어 의사소통하고, 별들 사이를 여행할 수 있게 해 왔다.", "hl": ["Technology has allowed that society", "reproduce any food they want", "communicate over light-years"], "hlko": ["기술은 그 사회가", "그들이 원하는 어떤 음식이든 복제하고", "수광년의 거리를 넘어 의사소통하고"], "n": 5}]}, {"id": 3, "summary": "Everyone in Star Trek is well educated so that they can (A) the wealth of that world, and generative AI may make many areas of our society just as (B).", "ko": "Star Trek의 모든 사람은 그 세계의 풍요를 <b>(A) 함께 누릴</b> 수 있도록 잘 교육받았고, 생성형 AI는 우리 사회의 많은 분야도 꼭 그만큼 <b>(B) 풍부하게</b> 만들 수 있다.", "opts": [["share", "poor"], ["avoid", "plentiful"], ["avoid", "poor"], ["fear", "empty"], ["share", "plentiful"]], "optko": ["함께 누리다 – 가난한", "피하다 – 풍부한", "피하다 – 가난한", "두려워하다 – 텅 빈", "함께 누리다 – 풍부한"], "ans": 4, "wrong": ["poor(가난한)가 틀려요. 본문은 생성형 AI가 우리 사회의 많은 측면을 마찬가지로 매우 풍요롭게(abundant) 할 잠재력이 있다고 해요.", }
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../yoyak.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
