<script>
var DATA={"meta": {"sch": "jusung-go1", "src": "common/sx-data-2610.js", "dir": "mock", "pidx": 1, "lesson": "26년 10월 22번", "title": "", "label": "", "page": "yoyak-2610-22"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "시간에 대한 인식은 자연의 기본 [[properties|속성]]도, 개인의 심리 현상도 아니다.", "en": ["Sociologists argue that our perception and usage of time are not just basic properties of nature, like a clock ticking away in the background, nor are they simply psychological phenomena of individual experience."], "kos": ["사회학자들은 시간에 대한 우리의 인식과 시간 사용이 배경에서 째깍거리며 흘러가는 시계처럼 단순히 자연의 기본적인 속성도 아니고, 단순히 개인적 경험의 심리적 현상도 아니라고 주장한다."]}, {"tag": "본문 2번", "ns": [2], "line": "시간을 이해하는 방식은 [[tradition|전통]]과 문화적 기준에 의해 [[shaped|형성된다]].", "en": ["Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms."], "kos": ["오히려 우리가 시간을 인식하고 이해하는 방식은 상당한 정도로 전통과 문화적 기준에 의해 형성된다."]}, {"tag": "본문 3번", "ns": [3], "line": "한 책이 [[demonstrates|보여 준다]]. 시간의 [[fundamental|기본]] 단위인 일주일도 문화마다 [[varies|다른]] 사회적 발명품이다.", "en": ["Eviatar Zerubavel's work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life."], "kos": ["Eviatar Zerubavel의 저서인 The Seven Day Circle: The History and Meaning of the Week는 어떻게 시간의 기본 단위인 일주일이 사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서 문화마다 다른 사회적 발명품인지를 보여 준다."]}, {"tag": "본문 4~7번", "ns": [4, 5, 6, 7], "line": "왜 9시부터 5시까지 일할까? 왜 주말엔 쉴까? 왜 월말에 돈을 낼까? 왜 65세에 은퇴할까?", "en": ["Why do we consider a nine-to-five job routine?", "Why don't many of us work on the weekends?", "Why do we usually pay our bills at the end of the month?", "Why is the retirement age sixty-five?"], "kos": ["왜 우리는 9시부터 5시까지 일하는 직업을 일상적인 것으로 여기는가?", "왜 우리 중 많은 사람은 주말마다 일하지 않는가?", "왜 우리는 대개 월말에 고지 금액을 납부하는가?", "왜 은퇴 연령은 65세인가?"]}, {"tag": "본문 8번", "ns": [8], "line": "이런 숫자와 [[patterns|양식]]은 자연이 정한 게 아니라, 우리가 [[internalize|내면화해]] 정상이라 받아들인 사회적 창조물이다.", "en": ["These numbers and patterns aren't really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and come to accept as “normal.”"], "kos": ["이러한 숫자와 양식은 실제로 자연이나 인간의 어떤 본질적인 특성에 의해 좌우되는 것이 아니라, 오히려 우리가 내면화하여 결국 ‘정상적인 것’으로 받아들이게 된 사회적 창조물이다."]}], "story": [{"a": "property", "form": "properties", "n": 1, "sq": 1, "sum": "a basic [[feature]] of nature", "hook": "자연의 기본적인 속성이 아니라는 문장의 property(속성) → 요약문에서는 feature(특성)로 바꿨어요.", "b": "feature", "k": "속성 → 특성", "en": "Sociologists argue that our perception and usage of time are not just basic properties of nature, like a clock ticking away in the background, nor are they simply psychological phenomena of individual experience.", "ko": "사회학자들은 시간에 대한 우리의 인식과 시간 사용이 배경에서 째깍거리며 흘러가는 시계처럼 단순히 자연의 기본적인 속성도 아니고, 단순히 개인적 경험의 심리적 현상도 아니라고 주장한다."}, {"a": "shape", "form": "shaped", "n": 2, "sq": 1, "sum": "largely [[formed]] by", "hook": "전통과 문화적 기준에 의해 형성된다는 문장의 shape(형성하다) → 요약문에서는 form(형성하다)으로 바꿨어요.", "b": "form", "k": "형성하다 → 형성하다", "en": "Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.", "ko": "오히려 우리가 시간을 인식하고 이해하는 방식은 상당한 정도로 전통과 문화적 기준에 의해 형성된다."}, {"a": "tradition", "form": "tradition", "n": 2, "sq": 1, "sum": "by [[custom]] and cultural norms", "hook": "전통과 문화적 기준이라는 문장의 tradition(전통) → 요약문에서는 custom(관습)으로 바꿨어요.", "b": "custom", "k": "전통 → 관습", "en": "Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.", "ko": "오히려 우리가 시간을 인식하고 이해하는 방식은 상당한 정도로 전통과 문화적 기준에 의해 형성된다."}, {"a": "demonstrate", "form": "demonstrates", "n": 3, "sq": 2, "sum": "Zerubavel's book [[shows]]", "hook": "제루바벨의 책이 보여 준다는 문장의 demonstrate(보여 주다) → 요약문에서는 show(보여 주다)로 바꿨어요.", "b": "show", "k": "보여 주다 → 보여 주다", "en": "Eviatar Zerubavel's work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.", "ko": "Eviatar Zerubavel의 저서인 The Seven Day Circle: The History and Meaning of the Week는 어떻게 시간의 기본 단위인 일주일이 사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서 문화마다 다른 사회적 발명품인지를 보여 준다."}, {"a": "fundamental", "form": "fundamental", "n": 3, "sq": 2, "sum": "a [[core]] unit of time", "hook": "시간의 기본적인 단위라는 문장의 fundamental(기본적인) → 요약문에서는 core(기본의)로 바꿨어요.", "b": "core", "k": "기본적인 → 기본의", "en": "Eviatar Zerubavel's work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.", "ko": "Eviatar Zerubavel의 저서인 The Seven Day Circle: The History and Meaning of the Week는 어떻게 시간의 기본 단위인 일주일이 사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서 문화마다 다른 사회적 발명품인지를 보여 준다."}, {"a": "vary", "form": "varies", "n": 3, "sq": 2, "sum": "is [[different]] across cultures", "hook": "문화마다 다르다는 문장의 vary(서로 다르다) → 요약문에서는 different(다른)로 바꿨어요.", "b": "different", "k": "서로 다르다 → 다른", "en": "Eviatar Zerubavel's work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.", "ko": "Eviatar Zerubavel의 저서인 The Seven Day Circle: The History and Meaning of the Week는 어떻게 시간의 기본 단위인 일주일이 사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서 문화마다 다른 사회적 발명품인지를 보여 준다."}, {"a": "pattern", "form": "patterns", "n": 8, "sq": 3, "sum": "accept these [[practices]] as normal", "hook": "이러한 숫자와 양식이라는 문장의 pattern(양식) → 요약문에서는 practice(관행)로 바꿨어요.", "b": "practice", "k": "양식 → 관행", "en": "These numbers and patterns aren't really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and come to accept as “normal.”", "ko": "이러한 숫자와 양식은 실제로 자연이나 인간의 어떤 본질적인 특성에 의해 좌우되는 것이 아니라, 오히려 우리가 내면화하여 결국 ‘정상적인 것’으로 받아들이게 된 사회적 창조물이다."}, {"a": "internalize", "form": "internalize", "n": 8, "sq": 3, "sum": "We [[absorb]] social creations", "hook": "우리가 내면화하는 사회적 창조물이라는 문장의 internalize(내면화하다) → 요약문에서는 absorb(받아들이다)로 바꿨어요.", "b": "absorb", "k": "내면화하다 → 받아들이다", "en": "These numbers and patterns aren't really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and come to accept as “normal.”", "ko": "이러한 숫자와 양식은 실제로 자연이나 인간의 어떤 본질적인 특성에 의해 좌우되는 것이 아니라, 오히려 우리가 내면화하여 결국 ‘정상적인 것’으로 받아들이게 된 사회적 창조물이다."}], "passage": [{"n": 1, "en": "Sociologists argue that our perception and usage of time are not just basic properties of nature, like a clock ticking away in the background, nor are they simply psychological phenomena of individual experience.", "ko": "사회학자들은 시간에 대한 우리의 인식과 시간 사용이 배경에서 째깍거리며 흘러가는 시계처럼 단순히 자연의 기본적인 속성도 아니고, 단순히 개인적 경험의 심리적 현상도 아니라고 주장한다."}, {"n": 2, "en": "Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.", "ko": "오히려 우리가 시간을 인식하고 이해하는 방식은 상당한 정도로 전통과 문화적 기준에 의해 형성된다."}, {"n": 3, "en": "Eviatar Zerubavel's work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.", "ko": "Eviatar Zerubavel의 저서인 The Seven Day Circle: The History and Meaning of the Week는 어떻게 시간의 기본 단위인 일주일이 사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서 문화마다 다른 사회적 발명품인지를 보여 준다."}, {"n": 4, "en": "Why do we consider a nine-to-five job routine?", "ko": "왜 우리는 9시부터 5시까지 일하는 직업을 일상적인 것으로 여기는가?"}, {"n": 5, "en": "Why don't many of us work on the weekends?", "ko": "왜 우리 중 많은 사람은 주말마다 일하지 않는가?"}, {"n": 6, "en": "Why do we usually pay our bills at the end of the month?", "ko": "왜 우리는 대개 월말에 고지 금액을 납부하는가?"}, {"n": 7, "en": "Why is the retirement age sixty-five?", "ko": "왜 은퇴 연령은 65세인가?"}, {"n": 8, "en": "These numbers and patterns aren't really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and come to accept as “normal.”", "ko": "이러한 숫자와 양식은 실제로 자연이나 인간의 어떤 본질적인 특성에 의해 좌우되는 것이 아니라, 오히려 우리가 내면화하여 결국 ‘정상적인 것’으로 받아들이게 된 사회적 창조물이다."}], "questions": [{"id": 1, "summary": "Sociologists say that how we see and use time is largely (A) by (B) and cultural norms, rather than being a basic feature of nature or personal psychology.", "ko": "사회학자들은 우리가 시간을 보고 쓰는 방식이 자연의 기본적인 특성이나 개인의 심리라기보다는 대체로 <b>(B) 관습</b>과 문화적 기준에 의해 <b>(A) 형성된다</b>고 말한다.", "opts": [["formed", "instinct"], ["hidden", "custom"], ["hidden", "instinct"], ["measured", "weather"], ["formed", "custom"]], "optko": ["형성된 – 본능", "숨겨진 – 관습", "숨겨진 – 본능", "측정되는 – 날씨", "형성된 – 관습"], "ans": 4, "wrong": ["instinct(본능)가 틀려요. 본능은 타고나는 것, 곧 자연 쪽이에요. 본문은 시간 감각이 전통(tradition)과 문화적 기준으로 만들어진다고 해요.", "hidden(숨겨진)이 틀려요. 본문은 시간을 이해하는 방식이 전통과 문화적 기준에 의해 형성된다(shaped)고 해요.", "둘 다 틀려요. 숨겨지는 게 아니라 형성되고, 본능이 아니라 전통이 만들어요.", "둘 다 틀려요. 날씨(weather)로 측정된다(measured)는 이야기는 본문에 없어요. 시간 감각은 전통과 문화로 형성돼요.", null], "evid": [{"n": 1, "hl": ["not just basic properties of nature", "nor are they simply psychological phenomena of individual experience"]}, {"n": 2, "hl": ["shaped by tradition and cultural norms"]}], "swaps": [["shape", "form", "형성하다 → 형성하다"], ["tradition", "custom", "전통 → 관습"], ["property", "feature", "속성 → 특성"]], "swapnote": "shaped(형성된)는 formed(형성된)로, tradition(전통)은 custom(관습)으로 바뀌었어요. 시간 감각은 자연이 아니라 사회가 만든다는 게 핵심이에요.", "use": [{"w": "formed", "ex": "Ice is formed when water gets cold.", "ko": "물이 차가워지면 얼음이 형성된다.", "wk": "형성된", "hk": "형성된다"}, {"w": "custom", "ex": "Bowing is a Korean custom.", "ko": "절하는 것은 한국의 관습이다.", "wk": "관습", "hk": "관습"}], "flow": "본문 1번에서 사회학자들은 시간 인식과 사용이 자연의 기본 속성도, 개인의 심리 현상도 아니라고 하고, 2번에서 오히려 전통과 문화적 기준이 그것을 크게 형성한다고 해요.", "jd": [["Sociologists say", "사회학자들은 말한다"], ["that how we see and use time", "우리가 시간을 보고 쓰는 방식이"], ["is largely [[formed]] by [[custom]] and cultural norms,", "대체로 [[관습]]과 문화적 기준에 의해 [[형성된다고]],"], ["rather than being a basic feature of nature or personal psychology.", "자연의 기본적인 특성이나 개인의 심리라기보다는."]], "fc": [["본문 1번", "시간은 자연의 속성이 아니다", "시간 감각은 자연의 기본 {{property|속성}}도, 개인의 심리 현상도 아니에요."], ["본문 2번", "전통과 문화가 만든다", "시간을 이해하는 방식은 {{tradition|전통}}과 문화적 기준이 {{shape|만들어 내요}}."], ["정답 포인트", "{{shape|형성하다}} = {{form|형성하다}}, {{tradition|전통}} = {{custom|관습}}", "본문 단어가 다른 말로 바뀌어 나와요."]], "evid_full": [{"en": "Sociologists argue that our perception and usage of time are not just basic properties of nature, like a clock ticking away in the background, nor are they simply psychological phenomena of individual experience.", "ko": "사회학자들은 시간에 대한 우리의 인식과 시간 사용이 배경에서 째깍거리며 흘러가는 시계처럼 단순히 자연의 기본적인 속성도 아니고, 단순히 개인적 경험의 심리적 현상도 아니라고 주장한다.", "hl": ["not just basic properties of nature", "nor are they simply psychological phenomena of individual experience"], "hlko": ["단순히 자연의 기본적인 속성도 아니고", "단순히 개인적 경험의 심리적 현상도 아니라고"], "n": 1}, {"en": "Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.", "ko": "오히려 우리가 시간을 인식하고 이해하는 방식은 상당한 정도로 전통과 문화적 기준에 의해 형성된다.", "hl": ["shaped by tradition and cultural norms"], "hlko": ["전통과 문화적 기준에 의해 형성된다"], "n": 2}]}, {"id": 2, "summary": "Zerubavel's book shows that the week, a (A) unit of time, is a social invention that is (B) across cultures.", "ko": "제루바벨의 책은 시간의 <b>(A) 기본</b> 단위인 일주일이 문화마다 <b>(B) 다른</b> 사회적 발명품이라는 것을 보여 준다.", "opts": [["core", "identical"], ["core", "different"], ["minor", "different"], ["minor", "identical"], ["natural", "fixed"]], "optko": ["기본의 – 똑같은", "기본의 – 다른", "사소한 – 다른", "사소한 – 똑같은", "자연의 – 고정된"], "ans": 1, "wrong": ["identical(똑같은)이 틀려요. 본문은 일주일이 문화마다 다르다(varies across cultures)고 해요.", null, "minor(사소한)가 틀려요. 본문은 일주일을 시간의 기본적인(fundamental) 단위라고 해요.", "둘 다 틀려요. 일주일은 사소한 단위가 아니라 기본 단위이고, 문화마다 똑같은 게 아니라 달라요.", "둘 다 틀려요. 일주일은 자연의(natural) function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;

  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';

  });

  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+(EVK[String(q.id)]||q.evid_full.map(function(e){return [e.n]})).map(function(e){return e[0]+'번'}).join(', ')+'</p>';
    var EVS=EVK[String(q.id)];
    if(EVS)EVS.forEach(function(e){h+='<div class="ev"><div class="kk"><b class="evn">'+e[0]+'번</b> '+e[1]+'</div></div>'});
    else q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button><button class="btn sec" data-a="home">목록으로</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';

  h+='<button class="btn pri" data-a="sw">바꿔 말하기 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';

}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';

  h+='<div class="card"><ul class="wl">';

function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';

  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}

var EVK={
'1':[[1,'시간 인식은 자연의 기본 <b>속성</b>(properties)도, 개인 심리 현상도 아님'],[2,'시간 이해 방식은 <b>전통</b>(tradition)과 문화적 기준이 <b>형성</b>(shaped)']],
'2':[[3,'일주일은 시간의 <b>기본</b>(fundamental) 단위이자 문화마다 <b>다른</b>(varies) 사회적 발명품']],
'3':[[4,'9시~5시 직업을 일상으로 여기는 이유'],[7,'은퇴 연령이 65세인 이유'],[8,'이 숫자와 <b>양식</b>(patterns)은 사회적 창조물, 우리가 <b>내면화</b>(internalize)해 ‘정상’으로 받아들임']]
};
var REL={
shape:{bj:'시간을 이해하는 방식은 전통과 문화적 기준에 의해 <b>형성</b>(shaped)',s:[['mold','틀을 만들다']],a:[],tr:'shape를 모양으로만 외우면 놓침, 여기서는 동사 형성하다'},
tradition:{bj:'<b>전통</b>(tradition)과 문화적 기준이 시간 이해 방식을 만듦',s:[['convention','관습']],a:[],tr:'habit(개인의 습관)은 사회적 관습이 아니라 오답'},
property:{bj:'자연의 기본 <b>속성</b>(properties)도 아님',s:[['attribute','속성'],['characteristic','특성']],a:[],tr:'property는 재산이 먼저 떠오르지만 여기서는 속성'},
fundamental:{bj:'시간의 <b>기본</b>(fundamental) 단위인 일주일',s:[['basic','기본의'],['essential','필수적인']],a:[['superficial','피상적인']],tr:'core(핵심의)와 같은 계열, 기본의 뜻으로 연결'},
vary:{bj:'일주일은 문화마다 <b>서로 다른</b>(varies) 사회적 발명품',s:[['differ','서로 다르다']],a:[],tr:'vary는 변하다보다 서로 다르다에 가까움'},
demonstrate:{bj:'일주일이 사회적 발명품임을 <b>보여 줌</b>(demonstrates)',s:[['illustrate','보여 주다'],['prove','증명하다']],a:[['disprove','반증하다']],tr:'demonstrate는 시위하다 뜻도 있는 다의어, 여기서는 보여 주다'},
internalize:{bj:'우리가 <b>내면화</b>(internalize)해 ‘정상’으로 받아들임',s:[['take in','받아들이다']],a:[],tr:'어려운 단어라 뒤의 accept(받아들이다)로 뜻을 잡음'},
pattern:{bj:'이 숫자와 <b>양식</b>(patterns)은 사회적 창조물',s:[],a:[],tr:'pattern은 무늬보다 여기서는 생활 양식, practice는 관행'}
};
function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';

  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
