</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "공통영어2 3과 · 23단어", "key": "geumcheon-go1:yk:L3", "sec": 0, "pass": [{"label": "3과 ① 도슨트 인사와 Bill Traylor의 삶", "sents": [{"en": "Welcome to the Dream Art Gallery!", "ko": "드림 아트 갤러리에 오신 것을 환영합니다!"}, {"en": "I'm Isabel Williams, the docent for the From Shadows to Spotlights exhibit.", "ko": "저는 〈그림자에서 빛으로〉 전시회의 도슨트 Isabel Williams입니다."}, {"en": "Today, you're going to meet three amazing artists who never gave up on their art, despite challenges in their lives.", "ko": "오늘 여러분은 인생의 역경에도 불구하고 예술을 결코 포기하지 않았던 세 명의 놀라운 예술가를 만나게 됩니다."}, {"en": "Each artist has a unique painting style and story that has made their work highly valued.", "ko": "각 예술가에게는 작품을 높이 평가받게 만든 독특한 화풍과 이야기가 있습니다."}, {"en": "Let's explore each artist's life and artwork.", "ko": "각 예술가의 삶과 작품을 함께 살펴봅시다."}, {"en": "The first artist we're going to examine is Bill Traylor.", "ko": "첫 번째로 살펴볼 예술가는 Bill Traylor입니다."}, {"en": "Traylor was born into slavery in the U.S. in 1853 and spent his early life working on a cotton farm in Alabama.", "ko": "Traylor는 1853년 미국에서 노예로 태어나 앨라배마의 목화 농장에서 일하며 어린 시절을 보냈습니다."}, {"en": "Although he became a free man after the American Civil War, he still had to face racial discrimination, working for very low wages on the farm.", "ko": "그는 미국 남북전쟁 이후 자유의 몸이 되었지만, 농장에서 아주 낮은 임금을 받고 일하며 여전히 인종차별을 겪어야 했습니다."}, {"en": "Later, when he was around 70 years old, Traylor moved to the city of Montgomery, Alabama, where he found a job in a factory.", "ko": "이후 70세 무렵 Traylor는 앨라배마주 몽고메리시로 이주해 그곳 공장에서 일자리를 얻었습니다."}, {"en": "It wasn't until he was 85 years old and became too ill to work that he turned to drawing to express his life experiences.", "ko": "85세가 되어 몸이 너무 아파 일할 수 없게 된 후에야 그는 자신의 인생 경험을 표현하려고 그림을 시작했습니다."}]}, {"label": "3과 ② Traylor의 작품과 Maud Lewis의 삶", "sents": [{"en": "Now, we're going to look at some of his paintings, starting with Mean Dog and Man and Large Dog.", "ko": "이제 〈비열한 개〉와 〈남자와 큰 개〉를 시작으로 그의 그림 몇 점을 살펴보겠습니다."}, {"en": "Traylor had a strong fear of dogs because they had often been used on farms to watch and hunt slaves.", "ko": "Traylor는 개를 몹시 두려워했는데, 농장에서 개가 노예를 감시하고 사냥하는 데 자주 쓰였기 때문입니다."}, {"en": "His fear of dogs is expressed strongly in these pieces.", "ko": "이 작품들에는 개에 대한 그의 두려움이 강하게 드러나 있습니다."}, {"en": "In contrast, Woman with Purse and Man with Umbrella portrays the free lives of African Americans that he observed on the streets of Montgomery.", "ko": "이와 대조적으로 〈핸드백을 든 여인과 우산을 든 남자〉는 그가 몽고메리 거리에서 본 아프리카계 미국인들의 자유로운 삶을 그립니다."}, {"en": "Using simple shapes and colors, Traylor captured complex moments in American history from slavery to freedom.", "ko": "Traylor는 단순한 형태와 색으로 노예 제도에서 자유에 이르는 미국 역사의 복잡한 순간들을 담아냈습니다."}, {"en": "As a result, he's now considered an important figure in American folk art.", "ko": "그 결과, 그는 오늘날 미국 민속 예술의 중요한 인물로 여겨집니다."}, {"en": "Next, we have Maud Lewis, a renowned artist known for her heart-warming paintings.", "ko": "다음은 마음이 따뜻해지는 그림으로 알려진 유명 예술가 Maud Lewis입니다."}, {"en": "Born in a small Canadian town in 1903, Lewis suffered from physical weaknesses such as distorted shoulders and fingers.", "ko": "1903년 캐나다의 작은 마을에서 태어난 Lewis는 기형적인 어깨와 손가락 같은 신체적 약점으로 고통받았습니다."}, {"en": "This limited her mobility and caused her to drop out of school.", "ko": "이것 때문에 그녀는 움직이기 어려웠고 학교도 그만두게 되었습니다."}, {"en": "To make a living, she began to paint and sell Christmas cards.", "ko": "생계를 위해 그녀는 크리스마스카드를 그려 팔기 시작했습니다."}, {"en": "When her parents passed away, Lewis went to live with her aunt in Digby, Nova Scotia, where she met her future husband, Everett Lewis.", "ko": "부모님이 돌아가신 후 Lewis는 노바스코샤주 딕비의 이모 집으로 가서 살았고, 그곳에서 미래의 남편 Everett Lewis를 만났습니다."}, {"en": "After marrying, the couple spent the rest of their lives there, and Lewis continued to paint.", "ko": "결혼 후 부부는 그곳에서 여생을 보냈고, Lewis는 계속 그림을 그렸습니다."}]}, {"label": "3과 ③ Lewis의 작품과 Anna Ancher의 삶", "sents": [{"en": "She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor.", "ko": "그녀는 〈딕비 항구의 가장자리〉 같은 그림에서 딕비의 풍경을 자주 그렸습니다."}, {"en": "Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style.", "ko": "그녀의 작품은 밝고 선명한 유화물감과 단순한 형태를 섞어 써서 독창적이고 혁신적인 스타일을 만들어 냈습니다."}, {"en": "Although her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "ko": "신체적 제약 때문에 작은 오두막에 갇혀 지냈지만, 그녀의 재능과 상상력은 끝이 없었습니다."}, {"en": "In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field.", "ko": "〈빨간 썰매〉에는 특별한 겨울 풍경에 붉은 단풍잎이 등장하고, 〈한 쌍의 소〉에는 꽃밭에 서 있는 장식된 소들이 그려져 있습니다."}, {"en": "With these features, Lewis' paintings create a magical quality, like that of a fairy tale.", "ko": "이런 특징 덕분에 Lewis의 그림은 마치 동화 같은 마법적인 느낌을 줍니다."}, {"en": "As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies.", "ko": "그녀의 그림이 점점 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고, 나중에 책과 영화로도 만들어졌습니다."}, {"en": "Maud Lewis expressed her love for the world through her paintings and became an iconic figure in Canadian folk art.", "ko": "Maud Lewis는 그림으로 세상에 대한 사랑을 표현했고 캐나다 민속 예술의 상징적인 인물이 되었습니다."}, {"en": "Now let's take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark.", "ko": "이제 이번 전시의 마지막 예술가, 덴마크 출신의 유명 화가 Anna Ancher를 살펴봅시다."}, {"en": "When observing her paintings, you may notice a common theme—they all feature female figures.", "ko": "그녀의 그림을 보면 공통된 주제를 알아챌지도 모르는데, 그림마다 모두 여성 인물이 등장한다는 점입니다."}, {"en": "Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school.", "ko": "1859년 덴마크 스카겐에서 태어난 그녀는 나중에 사립 회화 학교에 다니려고 코펜하겐으로 이주했습니다."}, {"en": "After that, she even studied abroad in Paris, which was unusual for women at the time.", "ko": "그 후 그녀는 파리 유학까지 했는데, 이는 당시 여성에게는 드문 일이었습니다."}, {"en": "Thanks to her mother's encouragement, she was able to take advantage of these opportunities.", "ko": "어머니의 격려 덕분에 그녀는 이런 기회들을 활용할 수 있었습니다."}]}, {"label": "3과 ④ Ancher의 작품과 투어 마무리", "sents": [{"en": "Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties.", "ko": "결혼 후에도 Ancher는 기혼 여성은 집안일에만 집중해야 한다는 사회적 압력에 맞서며 그림을 계속 그렸습니다."}, {"en": "Ancher differed from other artists of that era, who depicted women as still life subjects.", "ko": "Ancher는 여성을 정물화 소재처럼 그렸던 당시의 다른 예술가들과 달랐습니다."}, {"en": "In contrast, she showcased them as active participants in everyday tasks, as seen in her works The Maid in the Kitchen and Sewing Fisherman's Wife.", "ko": "이와 대조적으로, 그녀는 〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉에서 볼 수 있듯 여성을 일상의 일에 적극적으로 참여하는 사람으로 보여 주었습니다."}, {"en": "She also skillfully explored light and color, contributing to the rich Impressionist movement in Denmark.", "ko": "그녀는 또한 빛과 색을 능숙하게 탐구해 덴마크의 풍부한 인상주의 운동에 기여했습니다."}, {"en": "In her painting Sunlight in the Blue Room, the reflection of the sunlight on the blue wall is stunningly portrayed.", "ko": "그녀의 작품 〈푸른 방의 햇빛〉에는 푸른 벽에 반사되는 햇빛이 눈부시게 아름답게 그려져 있습니다."}, {"en": "Ancher challenged the conventional roles of women in the 20th century and displayed her exceptional artistic talent.", "ko": "Ancher는 20세기 여성의 전통적인 역할에 도전하며 뛰어난 예술적 재능을 보여 주었습니다."}, {"en": "Her paintings continue to amaze us to this day.", "ko": "그녀의 그림은 오늘날까지도 우리를 놀라게 합니다."}, {"en": "Thank you for joining this guided tour, and I hope my explanations have aided you in appreciating these paintings.", "ko": "이번 가이드 투어에 함께해 주셔서 감사드리며, 제 설명이 그림 감상에 도움이 되었기를 바랍니다."}, {"en": "Please take some time to further explore the exhibition.", "ko": "시간을 내어 전시를 더 둘러보시기 바랍니다."}]}], "items": [{"id": "g1gc3-01", "p": 0, "s": 2, "w": "challenges", "h": "challenge", "pos": "명", "m": "어려움, 역경", "form": "명사 challenge의 복수형", "syn": [["difficulty", "어려움"], ["hardship", "고난, 역경"]], "ant": [["comfort", "편안함"]], "trap": [["objection", "이의 제기, 반대", "challenge의 다른 뜻 '이의 제기'와 비슷한 말"]], "dis": [["purpose", "목적"]], "other": [["도전, 도전 과제", "Learning a new language is a big challenge.", "새 언어를 배우는 것은 큰 도전이다."]], "tip": "본문 challenges(역경) → 시험에서 difficulties·hardships로 바뀔 수 있음, '도전'으로만 외우면 해석 어색", "story": "인생의 역경에도 예술을 포기하지 않은 세 예술가 소개에서 나온 단어"}, {"id": "g1gc3-02", "p": 0, "s": 3, "w": "valued", "h": "value", "pos": "동", "m": "높이 평가하다, 소중히 여기다", "form": "동사 value의 과거분사형 (made + 목적어 + valued: 평가받게 만든)", "syn": [["appreciate", "높이 평가하다"], ["prize", "소중히 여기다"]], "ant": [["underestimate", "과소평가하다"]], "trap": [["assess", "(값·가치를) 감정하다, 매기다", "value의 다른 뜻 '(돈으로) 값을 매기다'와 비슷한 말"]], "dis": [["repair", "고치다"]], "other": [["(돈으로) 값을 매기다", "The house was valued at one million dollars.", "그 집은 백만 달러로 값이 매겨졌다."]], "tip": "highly valued(높이 평가받는) = highly appreciated, 가격 매기기 아님", "story": "독특한 화풍과 이야기로 작품이 높이 평가받는다는 도슨트 소개에서 나온 단어"}, {"id": "g1gc3-03", "p": 0, "s": 6, "w": "spent", "h": "spend", "pos": "동", "m": "(시간을) 보내다", "form": "동사 spend의 과거형", "syn": [["pass", "(시간을) 보내다"]], "ant": [], "trap": [["pay", "(돈을) 내다, 지불하다", "spend의 다른 뜻 '(돈을) 쓰다'와 비슷한 말"], ["consume", "소비하다, 써 버리다", "spend의 다른 뜻 '(돈·물건을) 써 버리다'와 비슷한 말"]], "dis": [["forget", "잊다"], ["borrow", "빌리다"]], "other": [["(돈을) 쓰다", "I spent all my money on snacks.", "나는 간식에 돈을 다 써 버렸다."]], "tip": "spend + 시간 + -ing(~하며 시간을 보내다) 구조, 이 문장의 spend는 돈 아닌 시간", "story": "Traylor가 목화 농장에서 일하며 어린 시절을 보낸 얘기에서 나온 단어"}, {"id": "g1gc3-04", "p": 0, "s": 7, "w": "still", "h": "still", "pos": "부", "m": "여전히, 그런데도", "form": "", "syn": [["nevertheless", "그럼에도 불구하고"]], "ant": [["no longer", "더 이상 ~않는"]], "trap": [["quietly", "조용히, 가만히", "still의 다른 뜻 '가만히, 움직이지 않고'(sit still)와 비슷한 말"]], "dis": [["rarely", "드물게"], ["early", "일찍"]], "other": [["가만히 있는, 정지한", "Please sit still.", "가만히 앉아 있어."]], "tip": "Although(비록 ~지만)와 짝을 이루는 still = 그런데도 여전히, ④ 지문 still life(정물)의 still은 '정지한'", "story": "자유의 몸이 됐지만 여전히 인종차별을 겪은 Traylor 얘기에서 나온 단어"}, {"id": "g1gc3-05", "p": 0, "s": 7, function setWrong(k,bad){var w=wrongs(),i=w.indexOf(k);if(bad&&i<0)w.push(k);if(!bad&&i>=0)w.splice(i,1);sset('wrong',w)}
function speak(w){try{var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
var S=null;
function home(){S=null;clearInterval(TM);var w=wrongs(),pv=sget('prac',null),px=sget('real',null),ex=sget('exam',null);
 var h='<h1 lang="ko">'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 h+='<button class="mcard" onclick="startPrac(0)"><b>관계 지도 연습</b><span>'+(pv?('이어서 · '+(pv.i+1)+' / '+pv.q.length):'한 문제씩 풀고 · 바로 지도로 확인')+'</span></button>';
 if(w.length)h+='<button class="chipb" onclick="startPrac(1)">틀린 '+w.length+'개만 다시</button>';
 h+='<button class="mcard" onclick="startReal()"><b>실전 예행연습</b><span>'+(px?('이어서 · '+(px.i+1)+' / '+px.q.length):'시험처럼 한번에 · 틀린 것만 다시')+'</span></button>';
 h+='<button class="mcard" onclick="startExam()"><b>시험</b><span>'+(ex&&ex.done?('응시 완료 · '+ex.score+' / '+ex.q.length):'1회 · 타임어택'+(IT.length>25?' · 25문제':''))+'</span></button>';
 h+='<div class="small" style="margin:14px 4px">'+IT.length+'단어 · 틀린 단어 '+w.length+'개</div>';
 if(ex&&ex.done)h+='<button class="go sec" id="rx" onclick="twoTap(this,resetExam)">시험 기록 지우기</button>';
 $('app').innerHTML=h;window.scrollTo(0,0)}
function twoTap(b,f){if(b.getAttribute('data-a')){f();return}b.setAttribute('data-a',1);b.textContent='한 번 더 누르면 지워져요';setTimeout(function(){if(b){b.removeAttribute('data-a');b.textContent='시험 기록 지우기'}},2500)}
function resetExam(){sdel('exam');home()}
/* 관계 지도 연습 */
function startPrac(only){var pv=sget('prac',null);if(!only&&pv){S=pv;S.mode='prac'}else{var ks=only?shuf(wrongs()):shuf(IT.map(function(x,i){return i}));S={mode:'prac',only:!!only,i:0,q:ks.map(mk)}}rPrac()}
function qCard(q,interactive){var it=IT[q.k],s=sent(it),o=optsOf(it);
 var h='<div class="card"><div class="src">'+esc(D.pass[it.p].label)+'</div><div class="sen" lang="en" translate="no">'+under(s.en,it.w)+'</div>';
 if(q.rev)h+='<div class="ko">'+esc(s.ko)+'</div>';
 h+='<div class="q">밑줄 친 단어와 바꿔 쓸 수 있는 것 모두</div>';
 if(!q.rev){h+='<div class="opts">';q.o.forEach(function(oi){var x=o[oi];h+='<button class="opt'+(q.sel[oi]?' sel':'')+'" lang="en" translate="no" '+(interactive?'onclick="tg('+oi+')"':'')+'>'+esc(x.w)+'</button>'});h+='</div>'}
 return h+'</div>'}
function tg(oi){var q=S.q[S.i];q.sel[oi]=!q.sel[oi];save();(S.mode=='prac'?rPrac:rReal)()}
function save(){if(S.mode=='prac'&&!S.only)sset('prac',S);if(S.mode=='real')sset('real',S);if(S.mode=='exam')sset('exam',S)}
function anySel(q){for(var k in q.sel)if(q.sel[k])return true;return false}
function topBar(t){var n=S.q.length;return '<div class="top"><b>'+t+'</b><span>'+(S.i+1)+' / '+n+'</span><button class="hb" onclick="home()">처음으로</button></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div>'}
function rPrac(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.only?'틀린 것 다시':'관계 지도 연습');
 if(!q.rev){h+=qCard(q,true)+'<button class="go" '+(anySel(q)?'':'disabled')+' onclick="chk()">확인</button>'}
 else{var ok=isOK(q);h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답':'오답')+'</div>'+qCard(q,false)+mapCard(q)+'<button class="go" onclick="nxt()">'+(last?'결과 보기':'다음 문제')+'</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(q.rev)setTimeout(drawAll,30)}
function chk(){var q=S.q[S.i];q.rev=true;var ok=isOK(q);if(S.only){if(ok){q.ok=1}setWrong(q.k,!ok)}else setWrong(q.k,!ok);save();rPrac()}
function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}
/* 관계 지도 */
function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}
function mapCard(q){var it=IT[q.k],o=optsOf(it),st=function(i){var x=o[i],s=!!q.sel[i];if(x.g=='syn')return s?['맞힘','g']:['놓침','b'];return s?['잘못 고름','b']:['',''];};
 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);
  else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';
 if(it.story)h+='<div class="post"><small>본문 기억</small>'+esc(it.story)+'</div>';
 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
</script><a href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#1d4ed8;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
