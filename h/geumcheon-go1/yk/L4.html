</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "공통영어2 4과 · 25단어", "key": "geumcheon-go1:yk:L4", "sec": 0, "pass": [{"label": "4과 ① 신경 임플란트와 의료 활용", "sents": [{"en": "Neuroscience has a long history of exploring treatments for disorders of the nervous system, including the brain and spinal cord.", "ko": "신경과학은 뇌와 척수를 포함한 신경계 질환의 치료법을 탐구해 온 오랜 역사를 가지고 있다."}, {"en": "Traditionally, researchers have studied various functions of neural implants, which are medical devices like computer chips that can be implanted in the nervous system.", "ko": "전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔는데, 이것은 신경계에 이식할 수 있는 컴퓨터 칩 같은 의료 기기이다."}, {"en": "But here's the exciting part: with the rapid advancement of artificial intelligence (AI), researchers have begun to integrate AI into neural implants.", "ko": "그런데 흥미로운 점이 있다. 인공지능(AI)이 빠르게 발전하면서 연구자들이 신경 임플란트에 AI를 결합하기 시작했다는 것이다."}, {"en": "In this post, we'll examine the incredible benefits of AI-powered neural implants, their amazing potential for the future, and the ethical concerns surrounding them.", "ko": "이 글에서는 AI 기반 신경 임플란트의 놀라운 장점과 미래의 엄청난 잠재력, 그리고 이를 둘러싼 윤리적 우려를 살펴볼 것이다."}, {"en": "First, let's explore how this fascinating technology has been applied.", "ko": "먼저 이 매력적인 기술이 어떻게 활용되어 왔는지 살펴보자."}, {"en": "The AI-powered neural implant has shown great promise in medical applications, offering solutions to a range of problems.", "ko": "AI 기반 신경 임플란트는 다양한 문제의 해결책을 내놓으며 의료 분야에서 큰 가능성을 보여 주었다."}, {"en": "For instance, neural implants are used to treat brain disorders like Parkinson's disease.", "ko": "예를 들어, 신경 임플란트는 파킨슨병 같은 뇌 질환을 치료하는 데 쓰인다."}, {"en": "These implants electrically stimulate targeted regions of the brain at the right time with the help of AI to restore normal brain activity.", "ko": "이 임플란트는 정상적인 뇌 활동을 되살리기 위해 AI의 도움을 받아 알맞은 때에 뇌의 목표 부위를 전기로 자극한다."}, {"en": "In addition, paralyzed people can have the ability to walk again with the help of a “digital bridge” between two implants inserted into their brain and spine.", "ko": "또한 마비 환자들은 뇌와 척추에 넣은 두 임플란트 사이의 '디지털 다리' 덕분에 다시 걸을 수 있다."}, {"en": "When they think about moving their legs, the AI analyzes the brain signals and sends them to their legs through the implants.", "ko": "환자가 다리를 움직이려고 생각하면 AI가 뇌 신호를 분석해 임플란트를 통해 다리로 보낸다."}, {"en": "Similarly, those who have lost their arms can use artificial arms operated by the same mechanism.", "ko": "마찬가지로 팔을 잃은 사람들도 같은 원리로 움직이는 인공 팔을 사용할 수 있다."}]}, {"label": "4과 ② 미래 전망: 생각 조작과 기억", "sents": [{"en": "The success of AI-powered neural implants in health care is also expected to spread to other industries.", "ko": "의료 분야에서 거둔 AI 기반 신경 임플란트의 성공은 다른 산업으로도 퍼질 것으로 예상된다."}, {"en": "Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives.", "ko": "일부 미래학자들은 이 임플란트가 앞으로 20~30년 안에 상용화되어 우리의 일상을 크게 바꿀 것이라고 예측한다."}, {"en": "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds.", "ko": "예를 들어, 신경 임플란트 기술이 발전하면 우리의 생각을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다."}, {"en": "This could enable us to play games, type social media messages, and stream music simply by thinking.", "ko": "이것 덕분에 우리는 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍할 수 있을지도 모른다."}, {"en": "There is also great potential for memory-enhancing brain implants, similar to computer memory chips.", "ko": "컴퓨터 메모리 칩과 비슷한, 기억력을 높여 주는 뇌 임플란트도 큰 잠재력이 있다."}, {"en": "Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.", "ko": "이런 장치가 있으면 기억을 저장하고 강화할 수 있으며, 디지털 클라우드를 이용해 기억을 올리고 내려받을 수도 있을 것이다."}, {"en": "We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories.", "ko": "우리는 소셜 미디어 피드처럼 기억을 훑어보고, 인생에서 가장 좋았던 순간을 생생하게 떠올리고, 다른 사람과 기억을 나누고, 가장 소중한 기억을 백업할 수 있을 것이다."}, {"en": "Finally, AI-powered neural implants would revolutionize the way our brains work.", "ko": "마지막으로, AI 기반 신경 임플란트는 우리 뇌가 작동하는 방식을 혁명적으로 바꿀 것이다."}, {"en": "The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants.", "ko": "뇌의 역할은 정보를 배우고 저장하는 것에서 임플란트가 주는 방대한 데이터를 처리하는 것으로 바뀔 것이다."}, {"en": "Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas.", "ko": "우리는 정보를 단순히 외우는 대신 지식을 내려받고, 창의력을 발휘해 그것을 해석하고, 새로운 아이디어를 만들어 낼 수 있을 것이다."}]}, {"label": "4과 ③ 윤리적 문제", "sents": [{"en": "Before we can fully embrace the era of AI-powered neural implants, many tricky ethical issues should be addressed.", "ko": "AI 기반 신경 임플란트의 시대를 완전히 받아들이기 전에 많은 까다로운 윤리적 문제들이 해결되어야 한다."}, {"en": "The integration of AI technology with the human brain raises concerns about what it means to be human.", "ko": "AI 기술과 인간의 뇌를 결합하는 것은 인간이란 무엇인가에 대한 우려를 낳는다."}, {"en": "Our brains are believed to be central to our identity, existence, and value as human beings.", "ko": "우리의 뇌는 인간으로서의 정체성, 존재, 가치의 중심이라고 여겨진다."}, {"en": "However, an over-reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between.", "ko": "그러나 기술에 지나치게 의존하면 자연스러운 발달이 늦어지고, 우리가 인간인지 AI인지 아니면 그 중간인지 혼란이 생길 수 있다."}, {"en": "Another critical issue is privacy.", "ko": "또 다른 중요한 문제는 사생활(프라이버시)이다."}, {"en": "There's a risk that organizations or hackers could access personal data without permission through AI-connected implants.", "ko": "기관이나 해커가 AI와 연결된 임플란트를 통해 허락 없이 개인 정보에 접근할 위험이 있다."}, {"en": "This means that our thoughts, emotions, and behaviors could be controlled by hackers.", "ko": "이는 우리의 생각, 감정, 행동이 해커에게 조종당할 수 있다는 뜻이다."}, {"en": "There's an additional risk that this technology could lead to even greater social inequality, given that it may not be available to all due to its high cost.", "ko": "또한 이 기술은 비용이 비싸 모두가 이용하지 못할 수 있다는 점에서 사회적 불평등을 더 키울 수 있다는 추가 위험도 있다."}, {"en": "Such unequal access to the technology could intensify the division between those who can afford the implants and those who cannot.", "ko": "이런 불평등한 기술 접근은 임플란트를 살 수 있는 사람과 그렇지 못한 사람 사이의 분열을 더 심하게 만들 수 있다."}]}], "items": [{"id": "g1gc4-01", "p": 0, "s": 0, "w": "disorders", "h": "disorder", "pos": "명", "m": "장애, 질환", "form": "명사 disorder의 복수형 (여러 질환이라 -s)", "syn": [["illness", "질병"], ["disease", "질병"], ["condition", "(건강) 상태, 질환"]], "ant": [], "trap": [["mess", "엉망, 혼란", "disorder의 다른 뜻 '무질서, 혼란'과 비슷한 말"]], "dis": [["reward", "보상"]], "other": [["무질서, 혼란", "The room was in disorder.", "방이 엉망이었다."]], "tip": "disorder = 질환 / 무질서, condition도 '조건·질환' 다의어", "story": "신경과학이 뇌·척수 질환 치료법을 연구해 온 역사에서 나온 단어"}, {"id": "g1gc4-02", "p": 0, "s": 1, "w": "various", "h": "various", "pos": "형", "m": "다양한, 여러 가지의", "form": "", "syn": [["diverse", "다양한"], ["different", "여러 가지의, 다른"]], "ant": [["identical", "동일한"]], "trap": [], "dis": [["noisy", "시끄러운"], ["guilty", "죄책감 드는"]], "other": [], "tip": "various = diverse = a variety of, 바꿔 쓰기 단골", "story": "연구자들이 신경 임플란트의 여러 기능을 연구해 온 부분에서 나온 단어"}, {"id": "g1gc4-03", "p": 0, "s": 1, "w": "functions", "h": "function", "pos": "명", "m": "기능", "form": "명사 function의 복수형 (various 뒤라 -s)", "syn": [["role", "역할"], ["use", "용도"]], "ant": [], "trap": [["event", "행사", "function의 다른 뜻 '행사, 의식'과 비슷한 말"]], "dis": [["rumor", "소문"], ["prize", "상"]], "other": [["행사, 의식", "We went to a social function.", "우리는 사교 행사에 갔다."]], "tip": "function = 기능 / 행사, 동사로는 '작동하다'", "story": "연구자들이 신경 임플란트의 여러 기능을 연구해 온 부분에서 나온 단어"}, {"id": "g1gc4-04", "p": 0, "s": 2, "w": "rapid", "h": "rapid", "pos": "형", "m": "빠른", "form": "", "syn": [["quick", "빠른"]], "ant": [["slow", "느린"], ["gradual", "점진적인"]], "trap": [], "dis": [["honest", "정직한"], ["sleepy", "졸린"]], "other": [], "tip": "rapid ↔ gradual, 변화 속도 묘사 단골", "story": "AI의 빠른 발전으로 임플란트에 AI를 접목하기 시작한 부분에서 나온 단어"}, {"id": "g var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='yk:'+D.key;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sget(k,d){try{var v=localStorage.getItem(KEY+':'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(KEY+':'+k,JSON.stringify(v))}catch(e){}}
function sdel(k){try{localStorage.removeItem(KEY+':'+k)}catch(e){}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function sent(it){return D.pass[it.p].sents[it.s]}
function under(en,w){var i=en.indexOf(w);if(i<0){var re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),m=re.exec(en);if(!m)return esc(en);i=m.index;w=m[0]}var pre=en.slice(0,i).replace(/(^|\s)(a|an|A|An)\s$/,function(m,a,b){return a+(b[0]=='A'?'A(n)':'a(n)')+' '});return esc(pre)+'<u>'+esc(w)+'</u>'+esc(en.slice(i+w.length))}
function optsOf(it){var o=[];it.syn.forEach(function(x){o.push({w:x[0],m:x[1],g:'syn'})});it.ant.forEach(function(x){o.push({w:x[0],m:x[1],g:'ant'})});it.trap.forEach(function(x){o.push({w:x[0],m:x[1],g:'trap',r:x[2]})});it.dis.forEach(function(x){o.push({w:x[0],m:x[1],g:'dis'})});return o}
function mk(idx){return {k:idx,o:shuf(optsOf(IT[idx]).map(function(x,i){return i})),sel:{},rev:false}}
function isOK(q){var it=IT[q.k],o=optsOf(it);for(var i=0;i<o.length;i++){var s=!!q.sel[i];if(s!==(o[i].g=='syn'))return false}return true}
function wrongs(){return sget('wrong',[])}
function setWrong(k,bad){var w=wrongs(),i=w.indexOf(k);if(bad&&i<0)w.push(k);if(!bad&&i>=0)w.splice(i,1);sset('wrong',w)}
function speak(w){try{var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
var S=null;
function home(){S=null;clearInterval(TM);var w=wrongs(),pv=sget('prac',null),px=sget('real',null),ex=sget('exam',null);
 var h='<h1 lang="ko">'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 h+='<button class="mcard" onclick="startPrac(0)"><b>관계 지도 연습</b><span>'+(pv?('이어서 · '+(pv.i+1)+' / '+pv.q.length):'한 문제씩 풀고 · 바로 지도로 확인')+'</span></button>';
 if(w.length)h+='<button class="chipb" onclick="startPrac(1)">틀린 '+w.length+'개만 다시</button>';
 h+='<button class="mcard" onclick="startReal()"><b>실전 예행연습</b><span>'+(px?('이어서 · '+(px.i+1)+' / '+px.q.length):'시험처럼 한번에 · 틀린 것만 다시')+'</span></button>';
 h+='<button class="mcard" onclick="startExam()"><b>시험</b><span>'+(ex&&ex.done?('응시 완료 · '+ex.score+' / '+ex.q.length):'1회 · 타임어택'+(IT.length>25?' · 25문제':''))+'</span></button>';
 h+='<div class="small" style="margin:14px 4px">'+IT.length+'단어 · 틀린 단어 '+w.length+'개</div>';
 if(ex&&ex.done)h+='<button class="go sec" id="rx" onclick="twoTap(this,resetExam)">시험 기록 지우기</button>';
 $('app').innerHTML=h;window.scrollTo(0,0)}
function twoTap(b,f){if(b.getAttribute('data-a')){f();return}b.setAttribute('data-a',1);b.textContent='한 번 더 누르면 지워져요';setTimeout(function(){if(b){b.removeAttribute('data-a');b.textContent='시험 기록 지우기'}},2500)}
function resetExam(){sdel('exam');home()}
/* 관계 지도 연습 */
function startPrac(only){var pv=sget('prac',null);if(!only&&pv){S=pv;S.mode='prac'}else{var ks=only?shuf(wrongs()):shuf(IT.map(function(x,i){return i}));S={mode:'prac',only:!!only,i:0,q:ks.map(mk)}}rPrac()}
function qCard(q,interactive){var it=IT[q.k],s=sent(it),o=optsOf(it);

 if(q.rev)h+='<div class="ko">'+esc(s.ko)+'</div>';

 if(!q.rev){h+='<div class="opts">';q.o.forEach(function(oi){var x=o[oi];h+='<button class="opt'+(q.sel[oi]?' sel':'')+'" lang="en" translate="no" '+(interactive?'onclick="tg('+oi+')"':'')+'>'+esc(x.w)+'</button>'});h+='</div>'}
 return h+'</div>'}
function tg(oi){var q=S.q[S.i];q.sel[oi]=!q.sel[oi];save();(S.mode=='prac'?rPrac:rReal)()}
function save(){if(S.mode=='prac'&&!S.only)sset('prac',S);if(S.mode=='real')sset('real',S);if(S.mode=='exam')sset('exam',S)}
function anySel(q){for(var k in q.sel)if(q.sel[k])return true;return false}
function topBar(t){var n=S.q.length;return '<div class="top"><b>'+t+'</b><span>'+(S.i+1)+' / '+n+'</span><button class="hb" onclick="home()">처음으로</button></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div>'}
function rPrac(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.only?'틀린 것 다시':'관계 지도 연습');
 if(!q.rev){h+=qCard(q,true)+'<button class="go" '+(anySel(q)?'':'disabled')+' onclick="chk()">확인</button>'}
 else{var ok=isOK(q);h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답':'오답')+'</div>'+qCard(q,false)+mapCard(q)+'<button class="go" onclick="nxt()">'+(last?'결과 보기':'다음 문제')+'</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(q.rev)setTimeout(drawAll,30)}
function chk(){var q=S.q[S.i];q.rev=true;var ok=isOK(q);if(S.only){if(ok){q.ok=1}setWrong(q.k,!ok)}else setWrong(q.k,!ok);save();rPrac()}
function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}
/* 관계 지도 */
function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}
function mapCard(q){var it=IT[q.k],o=optsOf(it),st=function(i){var x=o[i],s=!!q.sel[i];if(x.g=='syn')return s?['맞힘','g']:['놓침','b'];return s?['잘못 고름','b']:['',''];};
 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);
  else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';
 if(it.story)h+='<div class="post"><small>본문 기억</small>'+esc(it.story)+'</div>';
 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
</script><a href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#1d4ed8;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
