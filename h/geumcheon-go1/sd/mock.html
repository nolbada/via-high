sychological phenomena of individual experience.", "ko": "사회학자들은 시간에 대한 우리의 인식과 시간 사용이 배경에서 째깍거리는 시계처럼 단순히 자연의 기본 속성도 아니고, 단순히 개인 경험의 심리 현상도 아니라고 주장한다."}, {"en": "Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.", "ko": "오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다."}, {"en": "Eviatar Zerubavel’s work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.", "ko": "Eviatar Zerubavel의 저서 The Seven Day Circle: The History and Meaning of the Week는 시간의 기본 단위인 일주일이 문화마다 다른 사회적 발명품이며, 사람들이 활동과 삶의 리듬을 짜는 방식에 영향을 준다는 것을 보여 준다."}, {"en": "Why do we consider a nine-to-five job routine?", "ko": "왜 우리는 9시부터 5시까지 일하는 것을 일상으로 여기는가?"}, {"en": "Why don’t many of us work on the weekends?", "ko": "왜 우리 중 많은 사람은 주말에 일하지 않는가?"}, {"en": "Why do we usually pay our bills at the end of the month?", "ko": "왜 우리는 대개 월말에 고지서 금액을 내는가?"}, {"en": "Why is the retirement age sixty-five?", "ko": "왜 은퇴 연령은 65세인가?"}, {"en": "These numbers and patterns aren’t really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and come to accept as “normal.”", "ko": "이러한 숫자와 양식은 실제로 자연이나 인간의 어떤 본질적 특성이 정한 것이 아니라, 우리가 내면화해 결국 '정상'으로 받아들이게 된 사회적 창조물이다."}], "chunks": [[0, 0], [1, 1], [2, 6], [7, 7]], "ex": [{"head": "Sociologists argue that", "clue": ["not just", "nor are they"], "core": "시간 = 자연의 속성 X, 개인 심리 X", "why": "글의 출발: 시간은 자연 것도 개인 마음 것도 아니라는 부정 두 번"}, {"head": "Instead, how we perceive", "clue": ["Instead,", "tradition and cultural norms"], "core": "오히려 전통과 문화가 시간 인식을 만듦", "why": "Instead(오히려) = 앞의 'A도 B도 아님'을 받아 진짜 답(전통·문화) 제시"}, {"head": "Eviatar Zerubavel’s work,", "clue": ["the week", "a social invention", "varies across cultures"], "core": "일주일도 문화마다 다른 사회적 발명품", "why": "전통·문화가 시간을 만든다는 주장의 증거 → 학자의 책으로 일주일 예시"}, {"head": "Why do we consider", "clue": ["a nine-to-five job"], "core": "왜 9시~5시 근무가 당연?", "why": "일주일 다음, 우리 생활 속 시간 습관을 질문으로 하나씩 꺼냄"}, {"head": "Why don’t many of", "clue": ["on the weekends"], "core": "왜 주말엔 일 안 함?", "why": "앞 질문에 이어 Why로 시작하는 질문 행진 계속"}, {"head": "Why do we usually", "clue": ["at the end of the month"], "core": "왜 월말에 요금 납부?", "why": "Why 질문 계속 → 이번엔 한 달 단위"}, {"head": "Why is the retirement age sixty-five?", "clue": ["sixty-five"], "core": "왜 은퇴는 65세?", "why": "Why 질문 마지막 → 인생 단위(65세)까지"}, {"head": "These numbers and patterns", "clue": ["These numbers and patterns", "social creations", "“normal.”"], "core": "이 숫자·양식 = 자연 X, 사회가 만들어 '정상'이 된 것", "why": "These numbers and patterns(이 숫자와 양식) = 앞 질문의 9시~5시·주말·월말·65세 → 질문들의 답으로 마무리"}], "postit": "시간 = 자연 X·개인 심리 X → 전통·문화가 만듦 → 일주일 예시 + 9to5·주말·월말·65세 질문 → 다 사회가 만든 '정상'", "cex": [{"core": "시간은 자연 속성도 개인 심리도 아님", "why": "글의 출발: not ~ nor(~도 아니고 ~도 아니다)로 시간에 대한 흔한 생각 두 가지를 부정"}, {"core": "시간 인식은 전통과 문화가 만듦", "why": "Instead(오히려) = 앞의 'A도 B도 아님'을 받아 진짜 답(전통·문화) 제시"}, {"core": "일주일은 사회적 발명품 + 생활 속 시간 습관 질문들", "why": "demonstrates(보여 준다) → 전통·문화가 만든다는 증거로 일주일 책 소개, 이어 생활 속 Why(왜) 질문들"}, {"core": "그 숫자·양식은 사회가 만들어 '정상'이 된 것", "why": "These numbers and patterns(이 숫자와 양식) = 앞 질문들의 9시~5시·주말·65세 → 질문들의 답으로 마무리"}]}, {"id": "mock_2610_g1-23", "label": "26년 10월 23번 내부 고발자 보호", "sents": [{"en": "In recent years, the number of illegal actions in particular at the corporate level has grown, or at least the number of cases that came to light increased.", "ko": "최근 몇 년 동안 특히 기업 차원의 위법 행위가 늘었거나, 적어도 세상에 드러난 사건의 수가 늘었다."}, {"en": "Such misconduct has often only been exposed because brave informants have risked a great deal in order to put an end to it.", "ko": "그러한 위법 행위는 용기 있는 제보자들이 그것을 끝내려고 큰 위험을 무릅썼기 때문에 비로소 드러난 경우가 많았다."}, {"en": "Hence, it is no surprise that whistleblower protection has come into focus.", "ko": "따라서 내부 고발자 보호가 주목받게 된 것은 놀라운 일이 아니다."}, {"en": "If violations of law and order go undetected and unpunished for years because employees of a company fear to report illegal activities for fear of reprisals or consequences, it can have several negative effects.", "ko": "기업 직원들이 보복이나 불이익이 두려워 위법 행위 신고를 꺼려서 법과 질서의 위반이 여러 해 동안 적발되지도 처벌받지도 않는다면, 여러 가지 부정적인 영향이 생길 수 있다."}, {"en": "It can harm the company itself, but also third-parties, the economy in general, the general public, and even the rule of law could be affected.", "ko": "그것은 기업 자체에 해를 끼칠 수 있을 뿐 아니라, 제삼자, 경제 전반, 일반 대중, 심지어 법치주의까지 영향을 받을 수 있다."}, {"en": "Protecting those who would assist in reducing unlawful or even criminal behaviour has two main functions: Protecting the individual’s actions as well as protecting the public good.", "ko": "위법하거나 심지어 범죄인 행위를 줄이는 데 도움을 주려는 사람들을 보호하는 것에는 두 가지 주요 기능이 있다. 바로 그 개인의 행위를 보호하는 것과 공익을 보호하는 것이다."}, {"en": "A well-balanced whistleblower protection may have positive effects on both of these.", "ko": "균형이 잘 잡힌 내부 고발자 보호는 이 두 가지 모두에 긍정적인 영향을 줄 수 있다."}], "chunks": [[0, 0], [1, 1], [2, 4], [5, 6]], "ex": [{"head": "In recent years,", "clue": ["illegal actions", "came to light"], "core": "기업 위법 행위 증가(적어도 드러난 건수 증가)", "why": "글의 출발: 기업의 위법 행위가 늘고 많이 드러남"}, {"head": "Such misconduct has often", "clue": ["Such misconduct", "brave informants"], "core": "그 위법 행위는 용감한 제보자 덕에 드러남", "why": "Such misconduct(그러한 위법 행위) = 앞의 illegal actions → 어떻게 드러났나(came to light) 설명"}, {"head": "Hence, it is no surprise", "clue": ["Hence,", "whistleblower protection"], "core": "그래서 내부 고발자 보호가 주목받음", "why": "Hence(따라서) = 제보자가 큰 위험을 무릅썼으니 → 그들을 보호하자는 관심"}, {"head": "If violations of law and", "clue": ["fear of reprisals", "negative effects"], "core": "보복이 두려워 신고 못 하면 → 나쁜 영향", "why": "보호가 왜 필요한지 → 보호가 없어 신고를 못 하는 경우를 가정(If)"}, {"head": "It can harm the company", "clue": ["It can harm", "but also third-parties"], "core": "회사만 X, 제삼자·경제·대중·법치까지 피해", "why": "It(그것) = 앞의 신고 못 해서 생기는 상황 → several negative effects(여러 나쁜 영향)를 하나씩 나열"}, {"head": "Protecting those who", "clue": ["Protecting those who", "two main functions"], "core": "제보자 보호의 두 기능: 개인 행위 보호 + 공익 보호", "why": "피해 나열 뒤 → 그래서 제보자를 보호하면 무엇을 지키는지 정리"}, {"head": "A well-balanced whistleblower", "clue": ["whistleblower protection", "both of these"], "core": "균형 잡힌 보호는 둘 다에 좋은 영향", "why": "both of these(이 둘 모두) = 앞의 개인 행위 + 공익 → 마무리"}], "postit": "기업 위법 증가 → 용감한 제보자 덕에 드러남 → 그래서 보호 주목 + 신고 못 하면 사회 전체 피해 → 보호 = 개인·공익 둘 다 지킴", "cex": [{"core": "기업 위법 행위 증가(드러난 건수 증가)", "why": "글의 출발: 최근 기업 차원의 위법 행위가 늘고 많이 드러났다는 현상 제시"}, {"core": "위법 행위는 용감한 제보자 덕에 드러남", "why": "Such misconduct(그러한 위법 행위) = 앞의 illegal actions(위법 행위) → 어떻게 드러났는지 설명"}, {"core": "그래서 내부 고발자 보호 주목, 신고 못 하면 피해 확산", "why": "Hence(따라서) = 제보자가 큰 위험을 무릅썼으니 → 보호에 관심, If(만약)로 신고 못 할 때의 피해"}, {"core": "제보자 보호의 두 기능: 개인 행위 + 공익", "why": "피해 나열 뒤 → Protecting those(그들을 보호하는 것)로 보호가 지키는 두 가지를 정리해 마무리"}]}, {"id": "mock_2610_g1-24", "label": "26년 10월 24번 목표에 대한 환상", "sents": [{"en": "Unfortunately, sometimes the idea of a goal is disconnected from the daily reality of what it will take to achieve it.", "ko": "안타깝게도 목표에 대한 생각은 때때로 그것을 이루는 데 필요한 일상의 현실과 동떨어져 있다."}, {"en": "We fall in love with the idea of a goal, pushing out of mind how different our day-to-day will need to be for us to make it happen.", "ko": "우리는 목표라는 생각과 사랑에 빠져, 그것을 실현하려면 하루하루가 얼마나 달라져야 하는지를 생각에서 밀어낸다."}, {"en": "In fact, research even suggests that positive fantasies about our future can lead us to put less effort into our goals because our fantasies provide us with a false and premature sense of accomplishment.", "ko": "실제로 연구는 심지어 미래에 대한 긍정적인 환상이 거짓되고 때 이른 성취감을 주기 때문에 우리가 목표에 노력을 덜 기울이게 만들 수 있다고 시사한다."}, {"en": "We romanticize a goal — falling in love with the idea of a change.", "ko": "우리는 목표를 낭만화한다. 즉, 변화라는 생각과 사랑에 빠진다."}, {"en": "In the process, we gloss over the intricacies and challenges of integrating a complex new behavior into our life.", "ko": "그 과정에서 우리는 복잡한 새 행동을 삶에 녹여 넣는 일의 복잡함과 어려움을 얼버무리고 넘어간다."}, {"en": "As one study nicely summed it up, fantasizing about a positive future “seduces a person to mentally enjoy the desired future in the here and now” — and because we don’t reflect on why our fantasy is not yet our future, “a necessity to act is not induced.”", "ko": "한 연구가 잘 요약했듯이, 긍정적인 미래를 상상하는 것은 \"사람을 현혹해 원하는 미래를 지금 여기서 머릿속으로 즐기게 하고\", 우리는 환상이 왜 아직 미래가 되지 않았는지 돌아보지 않기 때문에 \"행동해야 할 필요가 생기지 않는다.\""}], "chunks": [[0, 0], [1, 1], [2, 4], [5, 5]], "ex": [{"head": "Unfortunately, sometimes the idea", "clue": ["disconnected from the daily reality"], "core": "목표라는 생각 ≠ 이루는 데 필요한 일상의 현실", "why": "글의 출발: 목표 생각과 현실이 따로 논다는 문제 제기"}, {"head": "We fall in love", "clue": ["the idea of a goal", "day-to-day"], "core": "목표 생각에 빠져 하루하루가 달라져야 한다는 건 외면", "why": "the idea of a goal(목표라는 생각)을 그대로 받고, daily reality(일상 현실) → day-to-day(하루하루)로 풀어 줌"}, {"head": "In fact, research", "clue": ["In fact,", "positive fantasies", "less effort"], "core": "긍정적 환상 → 가짜 성취감 → 노력 덜 함", "why": "In fact(실제로) = 앞의 '사랑에 빠져 현실 외면'을 연구로 뒷받침 → 노력까지 줄어듦"}, {"head": "We romanticize a goal", "clue": ["romanticize", "falling in love with the idea"], "core": "우리는 목표를 낭만화함(변화라는 생각과 사랑)", "why": "앞의 fall in love with the idea를 다시 꺼내 romanticize(낭만화하다)로 정리"}, {"head": "In the process,", "clue": ["In the process,", "gloss over"], "core": "그 과정에서 새 행동의 복잡함·어려움을 대충 넘김", "why": "In the process(그 과정에서) = 낭만화하는 과정 → 그동안 놓치는 것"}, {"head": "As one study nicely", "clue": ["As one study", "seduces", "a necessity to act is not induced"], "core": "환상 = 지금 머릿속으로 미래를 즐기게 함 → 행동할 필요 안 생김", "why": "As one study summed it up(한 연구가 요약했듯) = 앞 내용 전체를 연구 인용으로 마무리"}], "postit": "목표 생각 ≠ 현실 → 사랑에 빠져 외면 → 연구: 가짜 성취감·노력↓, 낭만화하며 어려움 대충 → 결론: 행동할 필요 안 생김", "cex": [{"core": "목표라는 생각과 일상 현실의 단절", "why": "글의 출발: Unfortunately(불행히도)로 목표 생각과 현실이 따로 논다는 문제 제기"}, {"core": "목표 생각에 빠져 바뀌어야 할 일상은 외면", "why": "the idea of a goal(목표라는 생각) 반복 + daily reality(일상 현실) → day-to-day(하루하루)로 풀어 줌"}, {"core": "환상의 가짜 성취감 → 노력 감소, 어려움은 대충 넘김", "why": "In fact(실제로) = 앞의 '사랑에 빠져 현실 외면'을 연구로 뒷받침 → 낭만화하며 어려움도 대충 넘김"}, {"core": "환상은 미래를 지금 즐기게 해 행동 필요를 없앰", "why": "As one study summed it up(한 연구가 요약했듯) = 앞 내용 전체를 연구 인용으로 마무리"}]}, {"id": "mock_2610_g1-29", "label": "26년 10월 29번 불멸 해파리와 인간 노화", "sents": [{"en": "Since hydra and the immortal jellyfish don’t exhibit obvious signs of aging, they are often called biologically immortal.", "ko": "히드라와 불멸의 해파리는 뚜렷한 노화 징후를 보이지 않기 때문에 흔히 생물학적으로 불멸이라고 불린다."}, {"en": "This doesn’t mean they don’t die.", "ko": "이것이 그것들이 죽지 않는다는 뜻은 아니다."}, {"en": "Nor does it even mean that they cannot die of biological causes.", "ko": "심지어 생물학적 원인으로 죽을 수 없다는 뜻도 아니다."}, {"en": "But, unlike most every animal, their likelihood of dying does not increase with age.", "ko": "하지만 거의 모든 동물과 달리, 그것들이 죽을 가능성은 나이가 들어도 커지지 않는다."}, {"en": "Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.", "ko": "히드라와 불멸의 해파리 같은 종은 노화 과정을 이기는 방법에 대한 단서를 줄지도 모르기 때문에 노화학자들을 흥분시킨다."}, {"en": "But their property of being able to regenerate entire body parts, or even a whole organism, makes them more similar to trees than to us.", "ko": "하지만 신체 부위 전체나 심지어 생물체 하나를 통째로 재생할 수 있는 그것들의 특성은 그것들을 우리보다 나무에 더 가깝게 만든다."}, {"en": "Although we may learn some fascinating things about their lack of apparent aging, it is not at all clear how relevant those findings will be to human aging.", "ko": "비록 그것들에게 뚜렷한 노화가 없다는 점에 대해 흥미로운 사실을 알게 될 수도 있지만, 그 발견들이 인간의 노화와 얼마나 관련이 있을지는 전혀 분명하지 않다."}, {"en": "Sometimes biology is universal, especially if it relates to fundamental mechanisms.", "ko": "때때로 생명 현상은 보편적인데, 특히 근본적인 메커니즘과 관련될 때 그렇다."}, {"en": "But in other cases, even discoveries in rats or mice, which are mammals and biologically much closer to us, are difficult to translate into humans.", "ko": "하지만 다른 경우에는, 포유류이고 생물학적으로 우리와 훨씬 가까운 쥐나 생쥐에서의 발견조차도 인간에게 적용하기 어렵다."}, {"en": "It may be a very long time before any findings gained from hydra or jellyfish are useful to us.", "ko": "히드라나 해파리에게서 얻은 발견이 우리에게 쓸모 있어지기까지는 아주 오랜 시간이 걸릴지도 모른다."}], "chunks": [[0, 0], [1, 2], [3, 3], [4, 5], [6, 9]], "ex": [{"head": "Since hydra and", "clue": ["biologically immortal"], "core": "히드라·불멸 해파리 = 노화 징후 없음 → '생물학적 불멸'", "why": "글의 출발: '생물학적으로 불멸'이라는 별명 소개"}, {"head": "This doesn’t mean", "clue": ["This doesn’t mean"], "core": "그렇다고 안 죽는 건 아님", "why": "This(이것) = 앞의 '불멸이라고 불림' → 오해 바로잡기 시작"}, {"head": "Nor does it", "clue": ["Nor does it even mean"], "core": "생물학적 원인으로 못 죽는다는 뜻도 아님", "why": "Nor(~도 아니다) = 앞의 '~라는 뜻은 아님'에 하나 더 부정"}, {"head": "But, unlike most", "clue": ["But, unlike most every animal,", "does not increase with age"], "core": "하지만 나이 들어도 죽을 확률이 안 커짐", "why": "But(하지만) = 아니라는 말 두 번 뒤 → 그럼 진짜 특별한 점은 이것"}, {"head": "Species such as", "clue": ["excite gerontologists", "defeat the aging process"], "core": "노화학자들이 흥분: 노화를 이길 단서 기대", "why": "나이 들어도 죽을 확률이 그대로인 특징 → 그래서 노화 연구자들이 관심"}, {"head": "But their property", "clue": ["But their property", "more similar to trees than to us"], "core": "하지만 몸 전체 재생 능력 때문에 우리보다 나무와 비슷", "why": "But(하지만) = 앞의 기대에 찬물 → 우리와 너무 다른 동물"}, {"head": "Although we may", "clue": ["Although", "how relevant those findings will be"], "core": "흥미로운 발견이 있어도 인간 노화와 얼마나 관련 있을지 불분명", "why": "우리보다 나무와 비슷 → 그러니 인간에게 쓸모 있을지 의문"}, {"head": "Sometimes biology is universal,", "clue": ["Sometimes biology is universal"], "core": "때로는 생명 현상이 보편적임(근본 메커니즘일 때)", "why": "불분명하다는 말을 공정하게 따짐 → 통하는 경우부터 인정"}, {"head": "But in other cases,", "clue": ["But in other cases,", "rats or mice", "difficult to translate into humans"], "core": "하지만 우리와 가까운 쥐 연구조차 인간 적용 어려움", "why": "Sometimes(때로는) ↔ But in other cases(하지만 다른 경우엔) 짝 → 안 통하는 경우"}, {"head": "It may be a very long", "clue": ["hydra or jellyfish", "a very long time"], "core": "해파리 발견이 사람에게 쓸모 있으려면 아주 오래 걸릴 수도", "why": "쥐도 어려운데 해파리는 더 멀다 → 결론"}], "postit": "'생물학적 불멸' 별명 → 안 죽는 건 아님 → 나이 들어도 죽을 확률 그대로 → 노화학자 기대 vs 나무와 비슷 → 인간 적용은 아주 먼 얘기", "cex": [{"core": "노화 징후 없는 히드라·해파리 = '생물학적 불멸'", "why": "글의 출발: 히드라·불멸 해파리가 '생물학적 불멸'로 불린다는 소개"}, {"core": "불멸이라 해도 안 죽는다는 뜻은 아님", "why": "This(이것) = 앞의 '불멸이라 불림' → Nor(~도 아니다)로 오해를 두 번 바로잡음"}, {"core": "특별한 점: 나이 들어도 죽을 확률이 그대로", "why": "But(하지만) = 아니라는 말 두 번 뒤 → 그럼 진짜 특별한 점은 이것"}, {"core": "노화 연구자들의 기대, 하지만 나무에 더 가까움", "why": "확률 그대로인 특징 → 그래서 gerontologists(노화학자들)가 흥분, But(하지만)으로 찬물"}, {"core": "인간 노화에 쓸모 있으려면 아주 오래 걸릴 수도", "why": "나무와 더 비슷 → relevant(관련 있는)할지 불분명, Sometimes(때로는)·But in other cases(다른 경우엔)로 결론"}]}, {"id": "mock_2610_g1-30", "label": "26년 10월 30번 발전소 보조금의 문제", "sents": [{"en": "Subsidies, taxes, and regulations can all lead to power plants that pollute less by switching away from coal.", "ko": "보조금, 세금, 규제는 모두 석탄에서 벗어나 오염을 덜 일으키는 발전소로 이어질 수 있다."}, {"en": "In all cases, profits can be higher from making the transition, even taking the related costs into account.", "ko": "모든 경우에, 관련 비용까지 고려해도 그 전환으로 얻는 이익이 더 클 수 있다."}, {"en": "The power plants prefer subsidies over regulations or taxes.", "ko": "발전소들은 규제나 세금보다 보조금을 선호한다."}, {"en": "The reason is obvious.", "ko": "이유는 뻔하다."}, {"en": "They prefer to receive money from the government rather than pay the costs themselves.", "ko": "그들은 비용을 직접 내기보다 정부로부터 돈을 받는 쪽을 선호한다."}, {"en": "But the “expansion” of their opportunity set through subsidies has to be matched by the contraction of the opportunity set of others.", "ko": "그러나 보조금을 통한 그들의 기회 집합의 '확대'는 다른 사람들의 기회 집합의 축소로 맞춰져야 한다."}, {"en": "The electricity companies’ “freedom” is increased at the expense of the ordinary individual, who must suffer from increased taxation to pay for the subsidy.", "ko": "전력 회사들의 '자유'는 일반 개인을 희생시켜 늘어나는데, 이들은 보조금을 대기 위해 늘어난 세금으로 고통받아야 한다."}, {"en": "Moreover, from the perspective of pure efficiency, the subsidy distorts the economy because the electricity company is not facing the full costs of what it does, even if it is successful in limiting emissions.", "ko": "게다가 순수한 효율성의 관점에서 보면, 보조금은 전력 회사가 배출량을 줄이는 데 성공하더라도 자기가 하는 일의 전체 비용을 마주하지 않기 때문에 경제를 왜곡한다."}, {"en": "Indeed, electricity prices may end up lower than they should be and electricity consumption higher, which will worsen global warming, even though the emissions per unit of electricity have been reduced.", "ko": "실제로 전기 가격은 마땅한 수준보다 낮아지고 전기 소비는 많아질 수 있으며, 그러면 전기 단위당 배출량이 줄었더라도 지구 온난화는 더 악화될 것이다."}], "chunks": [[0, 1], [2, 2], [3, 4], [5, 6], [7, 8]], "ex": [{"head": "Subsidies, taxes, and regulations", "clue": ["Subsidies, taxes, and regulations", "pollute less"], "core": "보조금·세금·규제 모두 발전소 오염을 줄일 수 있음", "why": "글의 출발: 오염 줄이는 세 가지 방법 소개"}, {"head": "In all cases,", "clue": ["In all cases,", "the transition"], "core": "어느 방법이든 전환하면 이익이 더 클 수 있음", "why": "In all cases(모든 경우에) = 앞의 세 방법 모두 → 전환(transition) = switching away from coal"}, {"head": "The power plants prefer subsidies", "clue": ["prefer subsidies over regulations or taxes"], "core": "발전소는 세 가지 중 보조금을 제일 좋아함", "why": "세 방법이 다 된다 했으니 → 그중 발전소가 고르는 것은 보조금"}, {"head": "The reason is obvious.", "clue": ["The reason is obvious."], "core": "이유는 뻔함", "why": "The reason(그 이유) = 앞의 '보조금 선호'의 이유 → 바로 뒤에 설명"}, {"head": "They prefer to", "clue": ["receive money from the government", "pay the costs themselves"], "core": "직접 비용 내기보다 정부 돈 받는 게 좋음", "why": "The reason is obvious 바로 다음 → 그 뻔한 이유를 풀어 줌"}, {"head": "But the “expansion”", "clue": ["But", "“expansion”", "contraction"], "core": "하지만 발전소 기회가 늘면 다른 사람 기회는 줄어듦", "why": "But(하지만) = 발전소 입장(돈 받아 좋음)에 반론 → their(그들) = 발전소"}, {"head": "The electricity companies’ “freedom”", "clue": ["“freedom”", "the ordinary individual", "increased taxation"], "core": "발전소 '자유'↑ = 일반 개인 세금↑", "why": "앞의 '다른 사람들의 축소' = 세금 내는 일반 개인으로 구체화"}, {"head": "Moreover, from the", "clue": ["Moreover,", "distorts the economy", "full costs"], "core": "게다가 전체 비용을 안 내니 경제 왜곡", "why": "Moreover(게다가) = 개인 피해에 이어 두 번째 문제(효율성) 추가"}, {"head": "Indeed, electricity prices", "clue": ["Indeed,", "lower", "worsen global warming"], "core": "전기값↓ 소비↑ → 오히려 지구 온난화 악화", "why": "Indeed(실제로) = 경제 왜곡이 어떻게 나타나는지 구체적 결과로 마무리"}], "postit": "세 방법 다 오염↓ → 발전소는 보조금 선호 → 이유: 돈 받으니까 → 하지만 개인 세금↑ → 게다가 경제 왜곡·온난화 악화", "cex": [{"core": "보조금·세금·규제 모두 오염 감소와 이익 가능", "why": "글의 출발: 석탄을 떠나게 하는 세 가지 방법과 In all cases(모든 경우에) 이익 가능"}, {"core": "발전소는 셋 중 보조금을 선호", "why": "세 방법이 다 된다 했으니 → prefer subsidies(보조금을 선호함)로 그중 발전소가 고르는 것 제시"}, {"core": "이유: 직접 비용 대신 정부 돈을 받고 싶어서", "why": "The reason(그 이유) = 앞의 '보조금 선호'의 이유 → 바로 뒤에 풀어 줌"}, {"core": "발전소 기회 확대 = 일반 개인 세금 부담", "why": "But(하지만) = 발전소 입장(돈 받아 좋음)에 반론 → their(그들) = 발전소, 피해는 일반 개인"}, {"core": "보조금은 경제를 왜곡해 오히려 온난화 악화", "why": "Moreover(게다가) = 개인 피해에 이어 두 번째 문제(효율성) 추가 → Indeed(실제로)로 결과 마무리"}]}, {"id": "mock_2610_g1-31", "label": "26년 10월 31번 스타트렉과 풍요", "sents": [{"en": "Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "ko": "Star Trek의 세계를 경제학의 눈으로 보는 사람은 거의 없겠지만, 그렇게 하면 곧 우리에게 닥칠지도 모르는 세계를 들여다보는 창이 생긴다."}, {"en": "All of classical economics is based on the notion that there isn’t usually enough of anything to give everyone everything they want or need.", "ko": "고전 경제학 전체는 모든 사람에게 원하거나 필요한 모든 것을 줄 만큼 대개 어떤 것도 충분하지 않다는 생각에 기초한다."}, {"en": "Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.", "ko": "그 때문에 우리는 재화와 서비스, 자원을 가장 큰 이익을 낼 수 있는 곳에 배분하려고 시장과 가격 책정을 이용한다."}, {"en": "In Star Trek, however, there isn’t much scarcity.", "ko": "그러나 Star Trek에서는 희소성이 별로 없다."}, {"en": "Technology has allowed that society to reproduce any food they want, transport themselves thousands of miles in the blink of an eye, communicate over light-years, and travel among the stars.", "ko": "기술 덕분에 그 사회는 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 수천 마일을 이동하고, 수 광년 너머와 소통하고, 별들 사이를 여행할 수 있게 되었다."}, {"en": "All of humanity in that world has been fully educated so that they can participate in this prosperity.", "ko": "그 세계의 모든 인류는 이 풍요에 참여할 수 있도록 충분히 교육받았다."}, {"en": "Everyone is an explorer, researcher, engineer, artist, doctor, or counselor.", "ko": "모든 사람이 탐험가, 연구원, 기술자, 예술가, 의사, 또는 상담사이다."}, {"en": "Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant.", "ko": "생성형 AI는 우리 사회의 많은 측면도 마찬가지로 매우 풍요로워지게 할 잠재력을 지니고 있다."}], "chunks": [[0, 0], [1, 2], [3, 4], [5, 6], [7, 7]], "ex": [{"head": "Few people may view", "clue": ["through an economic lens", "a world that might soon be upon us"], "core": "스타트렉을 경제학으로 보면 곧 올 미래가 보임", "why": "글의 출발: 스타트렉을 경제의 눈으로 보자는 제안"}, {"head": "All of classical economics", "clue": ["classical economics", "isn’t usually enough"], "core": "고전 경제학 = 늘 모자라다는 전제", "why": "스타트렉과 비교할 기준부터 → 지금의 경제학(늘 부족함)"}, {"head": "Because of that,", "clue": ["Because of that,", "allocate"], "core": "그래서 시장·가격으로 나눠 줌", "why": "Because of that(그 때문에) = 앞의 '늘 부족함' → 그래서 나눠야 함"}, {"head": "In Star Trek,", "clue": ["however,", "isn’t much scarcity"], "core": "하지만 스타트렉엔 부족함이 거의 없음", "why": "however(그러나) = 앞의 '늘 부족함'과 정반대 → 이제 스타트렉 이야기"}, {"head": "Technology has allowed", "clue": ["that society", "reproduce any food"], "core": "기술로 음식 복제·순간 이동·우주 여행", "why": "that society(그 사회) = 앞의 Star Trek 세계 → 부족함이 없는 이유(기술)"}, {"head": "All of humanity", "clue": ["in that world", "this prosperity"], "core": "그 세계 사람 모두 교육받아 풍요에 참여", "why": "this prosperity(이 풍요) = 앞의 기술로 뭐든 되는 상태 → 사람 쪽 이야기로 넘어감"}, {"head": "Everyone is an", "clue": ["Everyone is"], "core": "모두가 탐험가·연구원·예술가·의사…", "why": "앞의 '모든 인류가 충분히 교육받음'의 결과 → 모두가 전문가"}, {"head": "Generative AI has", "clue": ["Generative AI", "our own society", "similarly"], "core": "생성형 AI가 우리 사회도 그렇게 풍요롭게 만들 수 있음", "why": "similarly(마찬가지로) = 스타트렉처럼 → 첫 문장의 '곧 올 미래'로 돌아와 마무리"}], "postit": "스타트렉을 경제로 보기 → 현재: 늘 부족 → 시장·가격 배분 → 스타트렉: 부족 없음(기술) → 모두 교육·전문가 → 생성형 AI도 그렇게", "cex": [{"core": "스타트렉을 경제학으로 보면 곧 올 미래가 보임", "why": "글의 출발: 스타트렉 세계를 경제의 눈으로 보자는 제안"}, {"core": "고전 경제학은 부족 전제 → 시장·가격으로 배분", "why": "비교 기준 먼저 → All of classical economics(고전 경제학 전체)는 '늘 부족함' 전제, 그래서 시장으로 배분"}, {"core": "스타트렉엔 부족함이 거의 없음(기술 덕분)", "why": "however(그러나) = 앞의 '늘 부족함'과 정반대 → that society(그 사회)의 기술로 이유 설명"}, {"core": "모든 사람이 교육받아 풍요에 참여", "why": "this prosperity(이 풍요) = 앞의 기술로 뭐든 되는 상태 → 이번엔 사람 쪽 이야기"}, {"core": "생성형 AI가 우리 사회도 그렇게 풍요롭게 할 수 있음", "why": "similarly(마찬가지로) = 스타트렉처럼 → 첫 문장의 '곧 올 미래'로 돌아와 마무리"}]}, {"id": "mock_2610_g1-32", "label": "26년 10월 32번 들었음을 보여 줘야 경청", "sents": [{"en": "People, whether customers or otherwise, want to feel heard.", "ko": "사람들은 고객이든 아니든 경청받고 있다고 느끼고 싶어 한다."}, {"en": "When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "ko": "누군가 고객 센터에 전화하거나, 관리자와 이야기하게 해 달라고 하거나, 마음에 걸리는 일을 품고 여러분의 사무실에 올 때, 그들은 누군가가 자신의 걱정을 듣고 해결해 줄 것처럼 느끼고 싶어 한다."}, {"en": "But for someone to feel heard, three things have to happen.", "ko": "그러나 누군가가 경청받는다고 느끼려면 세 가지가 이루어져야 한다."}, {"en": "First, they have to feel like the other person paid attention to what they said.", "ko": "첫째, 그들은 상대방이 자신의 말에 주의를 기울였다고 느껴야 한다."}, {"en": "Second, they have to feel like the other person understood what they said.", "ko": "둘째, 그들은 상대방이 자신의 말을 이해했다고 느껴야 한다."}, {"en": "And third, the other person has to demonstrate that they listened.", "ko": "그리고 셋째, 상대방은 자신이 들었다는 것을 보여 줘야 한다."}, {"en": "This last part is key.", "ko": "이 마지막 부분이 핵심이다."}, {"en": "Imagine talking to someone who provided no response.", "ko": "아무 반응도 보이지 않는 사람과 이야기한다고 상상해 보라."}, {"en": "They might have attended to everything we said.", "ko": "그들은 우리가 한 말 모두에 주의를 기울였을지도 모른다."}, {"en": "They might even have understood it completely.", "ko": "그들은 심지어 그것을 완전히 이해했을지도 모른다."}, {"en": "But without some sort of outward signal that indicates they listened, it’s impossible to know whether or not they actually did.", "ko": "그러나 들었다는 것을 보여 주는 어떤 외적인 신호가 없다면, 그들이 실제로 들었는지 아닌지 알 수가 없다."}], "chunks": [[0, 1], [2, 4], [5, 6], [7, 9], [10, 10]], "ex": [{"head": "People, whether customers or", "clue": ["want to feel heard"], "core": "사람들은 경청받는다고 느끼고 싶어 함", "why": "글의 출발: 사람들의 바람(경청받기)"}, {"head": "When someone calls", "clue": ["customer service", "listening to their concerns"], "core": "고객 센터·관리자·사무실: 내 걱정을 들어 주길 원함", "why": "앞의 바람을 구체적 장면(고객 센터·관리자·사무실)으로 보여 줌"}, {"head": "But for someone to", "clue": ["But", "three things have to happen"], "core": "하지만 그렇게 느끼려면 세 가지 필요", "why": "But(그러나) = 바라는 것만으론 안 되고 → 조건 세 가지 예고"}, {"head": "First, they have", "clue": ["First,", "paid attention to"], "core": "첫째, 상대가 내 말에 주의를 기울였다고 느껴야 함", "why": "three things(세 가지)의 첫 번째"}, {"head": "Second, they have", "clue": ["Second,", "understood"], "core": "둘째, 상대가 내 말을 이해했다고 느껴야 함", "why": "First 다음 Second"}, {"head": "And third, the other", "clue": ["And third,", "demonstrate that they listened"], "core": "셋째, 상대가 들었다는 걸 보여 줘야 함", "why": "Second 다음 And third → 세 가지 중 마지막"}, {"head": "This last part is key.", "clue": ["This last part"], "core": "이 마지막(보여 주기)이 핵심", "why": "This last part(이 마지막 부분) = 바로 앞의 셋째(들었음을 보여 주기)"}, {"head": "Imagine talking to", "clue": ["no response"], "core": "반응 없는 사람과 대화한다고 상상해 보기", "why": "마지막이 왜 핵심인지 → 반응 없는 상황을 상상시킴"}, {"head": "They might have", "clue": ["They might have attended to"], "core": "그 사람은 다 주의 깊게 들었을 수도 있음", "why": "They(그들) = 앞의 반응 없는 someone → 첫째 조건(주의)은 했을 수도"}, {"head": "They might even", "clue": ["They might even", "understood"], "core": "심지어 완전히 이해했을 수도 있음", "why": "even(심지어) = 앞의 '들었을 수도'보다 한 단계 더 → 둘째 조건(이해)까지"}, {"head": "But without some", "clue": ["But without", "outward signal"], "core": "하지만 겉으로 보이는 신호 없으면 들었는지 알 수 없음", "why": "But(그러나) = 들었을 수도·이해했을 수도를 뒤집음 → 셋째(보여 주기)가 핵심인 이유로 마무리"}], "postit": "경청받고 싶음 → 조건 셋: 주의·이해 → 셋째 보여 주기 = 핵심 → 반응 없는 사람 상상(들었을 수도·이해했을 수도) → 신호 없으면 알 수 없음", "cex": [{"core": "사람들은 경청받는다고 느끼고 싶어 함", "why": "글의 출발: 사람들의 바람(경청받기)을 고객 센터·사무실 장면으로 보여 줌"}, {"core": "경청받는다 느끼는 세 조건 중 첫째 주의·둘째 이해", "why": "But(그러나) = 바라는 것만으론 안 됨 → three things(세 가지) 예고 후 First·Second"}, {"core": "셋째 조건(들었음을 보여 주기)이 핵심", "why": "Second 다음 And third(그리고 셋째) → This last part(이 마지막 부분)가 핵심이라고 강조"}, {"core": "반응 없는 사람도 듣고 이해했을 수는 있음", "why": "마지막이 왜 핵심인지 → Imagine(상상해 보라)으로 반응 없는 상황, They might(~했을 수도)"}, {"core": "겉으로 신호가 없으면 들었는지 알 수 없음", "why": "But(그러나) = 들었을 수도·이해했을 수도를 뒤집음 → 셋째(보여 주기)가 핵심인 이유로 마무리"}]}, {"id": "mock_2610_g1-33", "label": "26년 10월 33번 장소는 경험의 매개체", "sents": [{"en": "The very fact that all of our experiences “take place” in a physical space makes the space inseparable from what defines it, from the event that took place in it.", "ko": "우리의 모든 경험이 물리적 공간에서 ‘일어난다’는 바로 그 사실은, 그 공간을 그것을 규정하는 것, 즉 그 안에서 일어난 사건과 분리될 수 없게 만든다."}, {"en": "The tree and the ground beneath are inseparable from what took place there.", "ko": "그 나무와 그 아래의 땅은 그곳에서 일어난 일과 분리될 수 없다."}, {"en": "This intertwining of space, place, and experience challenges the idea of place as passive backdrop.", "ko": "공간, 장소, 경험의 이러한 뒤얽힘은 장소를 수동적 배경으로 보는 생각에 이의를 제기한다."}, {"en": "If place and space are central to the very heart of experience, we must accept the possibility that the spatial framework is the medium of all experiences—actions, thoughts, memories, and feelings of every place—not merely a background or context exterior to experience (as commonly supposed).", "ko": "장소와 공간이 경험의 핵심 중의 핵심이라면, 우리는 공간적 틀이 (흔히 생각하듯) 경험 바깥의 배경이나 상황에 그치는 것이 아니라, 모든 장소에서의 행동·생각·기억·감정, 즉 모든 경험의 매개체일 가능성을 받아들여야 한다."}, {"en": "Belgian literary critic Georges Poulet made the point elegantly, writing of the space created in Marcel Proust’s great novel In Search of Lost Time:", "ko": "벨기에의 문학 평론가 Georges Poulet는 Marcel Proust의 위대한 소설 In Search of Lost Time에서 창조된 공간에 대해 이렇게 쓰며 그 점을 멋지게 표현했다."}, {"en": "“Beings surround themselves with the places where they find themselves, the way one wraps oneself up in a garment that is at one and the same time a disguise and a characterization.", "ko": "“존재들은 자신이 놓인 장소들로 스스로를 둘러싸는데, 이는 마치 변장이자 동시에 자신을 드러내는 특징이기도 한 옷으로 몸을 감싸는 것과 같다."}, {"en": "Without places, beings would be only abstractions.”", "ko": "장소가 없다면, 존재들은 단지 추상적인 것에 불과할 것이다.”"}], "chunks": [[0, 1], [2, 2], [3, 3], [4, 6]], "ex": [{"head": "The very fact that all", "clue": ["take place", "inseparable"], "core": "경험은 늘 어떤 공간에서 '일어남(take place)' → 공간과 사건은 떼어 놓을 수 없음", "why": "글의 출발: 경험이 공간에서 일어난다는 사실 → 공간·사건 분리 불가"}, {"head": "The tree and the ground", "clue": ["inseparable", "there"], "core": "그 나무와 땅도 거기서 일어난 일과 한 몸", "why": "inseparable(분리 불가) 반복 → 앞 문장 주장을 '나무와 땅'으로 구체화"}, {"head": "This intertwining of space,", "clue": ["This intertwining", "passive backdrop"], "core": "이 뒤얽힘 → '장소 = 가만히 깔린 배경'이라는 생각에 반기", "why": "This intertwining(이 뒤얽힘) = 앞의 '공간·사건 분리 불가' 두 문장을 한 단어로 받음"}, {"head": "If place and space are", "clue": ["central to the very heart of experience", "the medium", "not merely a background"], "core": "장소는 경험의 매개체, 그냥 배경 아님", "why": "passive backdrop(수동적 배경)에 반기 → '그럼 뭔데?'의 답: medium(매개체), not merely a background(그냥 배경 아님)"}, {"head": "Belgian literary critic Georges Poulet", "clue": ["made the point elegantly"], "core": "평론가 풀레가 이 주장을 멋지게 표현함", "why": "made the point(그 점을 말함) = 앞에서 펼친 '장소는 매개체' 주장 → 이제 권위자 인용으로 마무리"}, {"head": "“Beings surround themselves with", "clue": ["Beings", "garment"], "core": "존재는 장소를 옷처럼 두르고 삶", "why": "앞 문장이 콜론(:)으로 끝남 → 바로 풀레의 인용문 시작"}, {"head": "Without places, beings would", "clue": ["Without places", "abstractions"], "core": "장소 없으면 존재는 추상일 뿐", "why": "따옴표 안 인용이 이어짐 → garment(옷) 비유 뒤 '장소 없으면 추상'으로 결론, 닫는 따옴표로 글 끝"}], "postit": "경험은 공간에서 일어남 → 분리 불가(나무·땅) → 이 뒤얽힘이 '수동적 배경' 반박 → 장소 = 매개체 → 풀레 인용: 장소 없으면 추상", "cex": [{"core": "경험이 일어나는 공간은 그 사건과 분리 불가", "why": "글의 출발: 경험이 take place(일어나다)하는 공간 → 나무와 땅도 사건과 한 몸"}, {"core": "장소 = 수동적 배경이라는 생각에 반기", "why": "This intertwining(이 뒤얽힘) = 앞의 '공간·사건 분리 불가' 두 문장을 한 단어로 받음"}, {"core": "장소는 모든 경험의 매개체, 단순 배경 아님", "why": "passive backdrop(수동적 배경) 반박 → 답은 medium(매개체), not merely a background(단순 배경 아님)"}, {"core": "풀레의 인용: 장소 없으면 존재는 추상일 뿐", "why": "made the point(그 점을 말함) = 앞의 '장소는 매개체' 주장 → 권위자 인용으로 마무리"}]}, {"id": "mock_2610_g1-34", "label": "26년 10월 34번 단순화 가정과 유용한 모델", "sents": [{"en": "No matter how you choose to delineate your evolutionary system of interest—let’s say it’s cell phones—there will be some things that your model just needs to take as a given, such as the fact that new ideas emerge at particular times.", "ko": "여러분이 관심을 두는 진화 시스템(예를 들어 휴대 전화)의 경계를 어떻게 정하든, 새로운 아이디어가 특정 시기에 출현한다는 사실처럼 여러분의 모델이 그냥 주어진 것으로 받아들여야 하는 것들이 있을 것이다."}, {"en": "Indeed, all models must make simplifying assumptions of this nature.", "ko": "실제로 모든 모델은 이런 성격의 단순화 가정을 세워야 한다."}, {"en": "When Wallace and Darwin presented their verbal model of biological evolution, there was little knowledge of how variation generation and inheritance worked.", "ko": "Wallace와 Darwin이 생물학적 진화에 대한 언어적 모델을 제시했을 때, 변이 생성과 유전이 어떻게 작동하는지는 거의 알려져 있지 않았다."}, {"en": "They just took as a given that these things happened somehow.", "ko": "그들은 이런 일들이 어떻게든 일어난다는 것을 그냥 주어진 것으로 받아들였다."}, {"en": "Even at the finest level of detail, we need simplifying assumptions.", "ko": "가장 미세한 세부 수준에서조차 우리는 단순화 가정이 필요하다."}, {"en": "Physicists, for example, must take as a given the mass and charge of fundamental particles.", "ko": "예를 들어, 물리학자들은 기본 입자의 질량과 전하를 주어진 것으로 받아들여야 한다."}, {"en": "In a model of atomic bonds, physicists don’t attempt to explain why electrons have their particular mass and charge, they just accept the measured values and move on.", "ko": "원자 결합 모델에서 물리학자들은 전자가 왜 그런 질량과 전하를 갖는지 설명하려 하지 않고, 그냥 측정된 값을 받아들이고 넘어간다."}, {"en": "The key point is that we can build useful models at one level of analysis without a complete accounting of what’s happening at all other levels.", "ko": "핵심은 다른 모든 수준에서 일어나는 일을 완전히 설명하지 않고도 한 분석 수준에서 유용한 모델을 만들 수 있다는 것이다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 6], [7, 7]], "ex": [{"head": "No matter how you choose", "clue": ["take as a given"], "core": "어떤 모델이든 '그냥 주어진 것'으로 받아들일 부분이 있음", "why": "글의 출발: 모델엔 take as a given(당연하게 받아들이는) 부분이 꼭 있음"}, {"head": "Indeed, all models must", "clue": ["Indeed", "of this nature"], "core": "모든 모델은 단순화 가정이 필수", "why": "Indeed(실제로) + of this nature(이런 성격의) =  뿐", "why": "Thus(따라서) = '소리도 뇌에서 생김'의 결론 → 고막 전엔 그냥 분자 교란"}, {"head": "We can measure that disturbance", "clue": ["that disturbance", "until it hits a brain"], "core": "측정은 가능해도 뇌에 닿기 전엔 소리 아님", "why": "that disturbance(그 교란) = 앞 문장 끝의 the disturbance of molecules(분자의 교란)"}, {"head": "You may have heard the", "clue": ["the old philosophical riddle", "If a tree falls in the forest"], "core": "유명한 수수께끼: 아무도 없는 숲에서 쓰러진 나무는 소리를 낼까?", "why": "'뇌에 닿아야 소리'라는 원리를 시험하는 질문 등장 → 쓰러지는 나무 수수께끼"}, {"head": "No, because sound is a", "clue": ["No", "a psychological concept"], "core": "답: 아니다, 소리는 뇌가 만든 심리적 개념", "why": "No(아니다) = 바로 앞 수수께끼 질문(쓰러지는 나무가 소리를 내는가?)에 대한 대답"}, {"head": "That tree will disturb molecules", "clue": ["That tree", "has not made sound"], "core": "그 나무는 분자만 흔들 뿐, 아무도 못 들으면 소리 아님", "why": "That tree(그 나무) = 수수께끼 속 쓰러진 나무 → 답을 다시 확인하며 끝"}], "postit": "소리 = 분자 흔드는 움직임 → 뉴턴: 색은 뇌에서, 소리도 같음 → 고막 전엔 교란일 뿐 → 나무 수수께끼 → No, 심리적 개념 → 그 나무는 소리 못 냄", "cex": [{"core": "소리의 시작 = 분자를 흔드는 움직임", "why": "글의 출발: 소리는 매질 분자를 흔드는 motion(움직임)에서 시작"}, {"core": "색처럼 소리도 뇌에서 생김", "why": "빛 이야기로 잠시 이동 → The same is true of sound(소리도 마찬가지)로 다시 소리로"}, {"core": "뇌에 닿기 전엔 분자 교란일 뿐, 소리 아님", "why": "Thus(따라서) = '소리도 뇌에서 생김'의 결론 → 고막 전엔 그냥 disturbance(교란)"}, {"core": "숲속 나무 수수께끼의 답: 소리는 뇌의 산물", "why": "'뇌에 닿아야 소리' 원리를 시험하는 riddle(수수께끼) 등장 → No(아니다)로 답"}, {"core": "아무도 못 들으면 쓰러진 나무도 소리 아님", "why": "That tree(그 나무) = 수수께끼 속 쓰러진 나무 → 답을 다시 확인하며 끝"}]}, {"id": "mock_2610_g1-37", "label": "26년 10월 37번 대면 협업과 원격 협업의 틈", "sents": [{"en": "When people are collaborating face to face, they can easily see each other and the range of different communication cues being used, so the task space is a subset of the communication space.", "ko": "사람들이 대면하여 협업할 때는 서로의 모습과 사용되는 다양한 의사소통 단서들을 쉽게 볼 수 있어서, 작업 공간이 의사소통 공간의 부분 집합이 된다."}, {"en": "Ishii, a professor at the MIT Media Lab, describes this as seamless communication because there is no functional separation between the task and communication space.", "ko": "MIT Media Lab의 교수인 Ishii는 작업 공간과 의사소통 공간 사이에 기능적 분리가 없기 때문에 이를 이음새 없는 의사소통이라고 묘사한다."}, {"en": "However, when people are working remotely, the task space is often separated from the communication space.", "ko": "그러나 사람들이 원격으로 작업할 때는 작업 공간이 흔히 의사소통 공간과 분리된다."}, {"en": "For example, when video conferencing, people may have the face of their collaborator on one screen, while looking at a shared document on another.", "ko": "예를 들어, 화상 회의를 할 때 사람들은 한 화면에는 협업자의 얼굴을 띄우고, 다른 화면에서는 공유 문서를 보고 있을 수 있다."}, {"en": "In this case, it is impossible to see many of the remote collaborator’s communication cues at the same time as looking at the task space.", "ko": "이 경우, 작업 공간을 보면서 동시에 원격 협업자의 많은 의사소통 단서들을 보는 것은 불가능하다."}, {"en": "So, there is an artificial seam between the communication space and task space.", "ko": "그래서 의사소통 공간과 작업 공간 사이에 인위적인 틈이 생긴다."}, {"en": "This is the type of impact of remote communication technology that needs to be predicted through communication models.", "ko": "이것은 의사소통 모델을 통해 예측될 필요가 있는 원격 의사소통 기술의 영향의 한 유형이다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 5], [6, 6]], "ex": [{"head": "When people are collaborating face", "clue": ["face to face", "a subset of the communication space"], "core": "대면 협업: 작업 공간이 소통 공간 안에 쏙 들어감", "why": "글의 출발: 얼굴 보고 협업 → 작업 공간 ⊂ 소통 공간"}, {"head": "Ishii, a professor at the", "clue": ["this", "seamless communication"], "core": "이시이 교수: 이걸 '이음새 없는(seamless) 소통'이라 부름", "why": "this(이것) = 앞 문장의 대면 협업 상태 → 이름 붙이기"}, {"head": "However, when people are working", "clue": ["However", "remotely", "separated"], "core": "원격 작업: 작업 공간과 소통 공간이 갈라짐", "why": "However(그러나) → 대면(seamless)과 반대인 원격(separated, 분리됨)으로 전환"}, {"head": "For example, when video conferencing,", "clue": ["For example", "on one screen", "on another"], "core": "예: 한 화면엔 동료 얼굴, 다른 화면엔 공유 문서", "why": "For example(예를 들어) = 앞의 '원격 시 공간 분리'를 화상 회의 두 화면으로 보여 줌"}, {"head": "In this case, it is", "clue": ["In this case", "at the same time"], "core": "이때 문서 보면서 동료 신호를 동시에 보기 불가", "why": "In this case(이 경우) = 바로 앞 두 화면 상황"}, {"head": "So, there is an artificial", "clue": ["So", "an artificial seam"], "core": "그래서 소통과 작업 사이에 인위적인 틈(seam) 생김", "why": "So(그래서) → 결과 정리 / seam(틈)은 앞의 seamless(틈 없는)와 정반대"}, {"head": "This is the type of", "clue": ["This", "remote communication technology"], "core": "이런 영향은 소통 모델로 예측해야 함", "why": "This(이것) = 앞의 '인위적인 틈' → 원격 기술의 영향으로 마무리"}], "postit": "대면: 작업 ⊂ 소통 → seamless(틈 없음) → However 원격: 분리 → 예: 화면 두 개 → 동시에 못 봄 → So 인위적 틈 → 소통 모델로 예측 필요", "cex": [{"core": "대면 협업: 작업 공간이 소통 공간 안에 포함", "why": "글의 출발: face to face(얼굴을 맞대고) 협업 → 작업 공간 ⊂ 소통 공간"}, {"core": "이시이 교수의 이름 붙이기: 이음새 없는 소통", "why": "this(이것) = 앞 문장의 대면 협업 상태 → seamless(이음새 없는)라는 이름 붙임"}, {"core": "원격 작업: 작업 공간과 소통 공간의 분리", "why": "However(그러나) → 대면과 반대인 원격, For example(예를 들어)로 화상 회의 두 화면 예시"}, {"core": "문서와 동료 신호를 동시에 못 봐 인위적 틈 생김", "why": "In this case(이 경우) = 앞의 두 화면 상황 → So(그래서)로 seam(틈), seamless와 정반대"}, {"core": "이런 영향은 소통 모델로 예측해야 함", "why": "This(이것) = 앞의 '인위적인 틈' → 원격 기술의 영향으로 정리하며 마무리"}]}, {"id": "mock_2610_g1-38", "label": "26년 10월 38번 반복이 만드는 착각적 진실", "sents": [{"en": "In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false.", "ko": "1977년, 심리학자 Lynn Hasher와 David Goldstein은 한 그룹의 대학생들에게 60개의 잡학 상식 진술문이 참인지 거짓인지 얼마나 확신하는지 물었다."}, {"en": "The students were asked to evaluate the sixty statements three times, at two-week intervals.", "ko": "학생들은 그 60개의 진술문을 2주 간격으로 세 번 평가하도록 요청받았다."}, {"en": "Crucially, only twenty of the statements were repeated each time; the other forty were new.", "ko": "결정적으로, 그중 20개만 매번 반복되었고 나머지 40개는 새로운 것이었다."}, {"en": "The researchers then compared the ‘truth-ratings’ of the repeated versus non-repeated statements.", "ko": "그런 다음 연구자들은 반복된 진술문과 반복되지 않은 진술문의 ‘진실성 평가’를 비교했다."}, {"en": "What they found was astonishing.", "ko": "그들이 알아낸 것은 놀라웠다."}, {"en": "Regardless of whether the statement was true or order.forEach(function(k){var tx=utext(units[k]);h+='<div class="card mv" data-k="'+k+'" lang="en" translate="no">'+(lv==2?cardTx(tx):esc(tx))+'</div>'});
h+='</div></div><button class="btn go" id="sb" onclick="submit()">제출</button><div id="res"></div>';
h+=foot();$('v').innerHTML=h;bind()}
function cardTx(tx){var w=tx.split(' ');if(w.length<=8)return esc(tx);return '<span class="sh">'+esc(w.slice(0,7).join(' '))+' …</span><span class="fl">'+esc(tx)+'</span>'}
function foot(){return '<div class="foot"><button class="btn sec" onclick="list()">목록으로</button></div>'}
var locked=false;
function bind(){locked=false;var bx=$('bx');Array.prototype.forEach.call(bx.children,function(c){c.addEventListener('pointerdown',down)})}
var dg=null,ph=null,oy=0,sy=0,pc=null,px=0,py=0,pid=0;
function down(e){if(locked)return;pc=e.currentTarget;px=e.clientX;py=e.clientY;pid=e.pointerId;e.preventDefault();try{pc.setPointerCapture(e.pointerId)}catch(x){}
pc.addEventListener('pointermove',move);pc.addEventListener('pointerup',up);pc.addEventListener('pointercancel',up)}
function start(e){var c=pc,r=c.getBoundingClientRect();dg=c;oy=py-r.top;
ph=document.createElement('div');ph.className='card ph';ph.style.height=r.height+'px';c.parentNode.insertBefore(ph,c);
c.classList.add('drag');c.style.position='fixed';c.style.left=r.left+'px';c.style.width=r.width+'px';c.style.top=r.top+'px'}
function move(e){if(!pc)return;e.preventDefault();if(!dg){if(Math.abs(e.clientY-py)+Math.abs(e.clientX-px)<7)return;start(e)}
dg.style.top=(e.clientY-oy)+'px';
var bx=$('bx'),y=e.clientY,ch=Array.prototype.filter.call(bx.children,function(n){return n!==dg&&n!==ph}),put=null;
for(var i=0;i<ch.length;i++){var r=ch[i].getBoundingClientRect();if(y<r.top+r.height/2){put=ch[i];break}}
if(put)bx.insertBefore(ph,put);else bx.appendChild(ph);
if(e.clientY<60)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,12)}
function up(e){var c=pc;if(!c)return;pc=null;c.removeEventListener('pointermove',move);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);
if(!dg){if(e.type==='pointerup'&&c.querySelector('.fl'))c.classList.toggle('op');return}
dg=null;c.classList.remove('drag');c.style.position='';c.style.left='';c.style.top='';c.style.width='';ph.parentNode.insertBefore(c,ph);ph.remove();ph=null}
function submit(){if(locked)return;locked=true;var p=P[cur],bx=$('bx'),cs=bx.children,ok=0,n=cs.length;
for(var i=0;i<n;i++){var k=+cs[i].getAttribute('data-k'),g=(k==i+1);if(g)ok++;cs[i].classList.add(g?'ok':'ng');cs[i].classList.remove('mv');cs[i].insertAdjacentHTML('beforeend','<span class="mk">'+(g?'O':'X')+'</span>')}
var all=ok==n;if(all){st[p.id]=st[p.id]||{};if(lv==1)st[p.id][1]=1;else{st[p.id]['2_'+hp]=1;if(halves(p).length==1)st[p.id][2]=1}save()}
$('sb').style.display='none';
var h='<div class="band '+(all?'ok':'ng')+'">'+(all?'정답':'다시 확인')+'<small>'+n+'개 중 '+ok+'개 제자리</small></div>';
h+='<div class="exh">이 순서로 기억하기</div>';
var cs2={};units.forEach(function(u,ui){if(ui>0)cs2[u[0]]=1});
if(lv==1){p.chunks.forEach(function(c,ci){var cx=(p.cex&&p.cex[ci])||p.ex[c[0]];h+='<div class="ex ch"><span class="no">'+(ci+1)+'</span>'+(ci==0?'<span class="ck">시작</span>':'');for(var i=c[0];i<=c[1];i++){var s=p.sents[i];h+='<div class="en" lang="en" translate="no">'+mark(s.en,i==c[0]?p.ex[i]:{head:p.ex[i].head,clue:[]})+'</div><div class="ko">'+esc(s.ko)+'</div>'}h+=(cx.core?'<div class="core">'+esc(cx.core)+'</div>':'')+(cx.why?'<div class="why">'+esc(cx.why)+'</div>':'')+'</div>'})}else{var rg=halves(p)[hp];p.sents.forEach(function(s,i){if(i<rg[0]||i>rg[1])return;var x=p.ex[i];h+='<div class="ex'+(lv==1&&cs2[i]?' cb':'')+'"><span class="no">'+(i+1)+'</span>'+(i==rg[0]?'<span class="ck">시작</span>':'')+'<div class="en" lang="en" translate="no">'+mark(s.en,x)+'</div><div class="ko">'+esc(s.ko)+'</div>'+(x.core?'<div class="core">'+esc(x.core)+'</div>':'')+(x.why?'<div class="why">'+esc(x.why)+'</div>':'')+'</div>'});}
h+='<div class="post"><small>이 순서 이렇게 외우자</small>'+esc(p.postit)+'</div>';
var hs2=halves(p);h+='<button class="btn go" onclick="open_('+cur+','+lv+','+hp+')">다시 섞기</button>';
if(lv==1)h+='<button class="btn sec" onclick="open_('+cur+',2,0)">'+(hs2.length>1?'2단계 앞으로':'2단계 문장으로')+'</button>';
else if(hp+1<hs2.length)h+='<button class="btn sec" onclick="open_('+cur+',2,'+(hp+1)+')">2단계 뒤로</button>';
else if(cur+1<P.length)h+='<button class="btn sec" onclick="open_('+(cur+1)+',1)">다음 지문</button>';
$('res').innerHTML=h}
function mark(en,x){var hd=x.head||'',a=en,b='';if(hd&&en.indexOf(hd)==0){a=en.slice(0,hd.length);b=en.slice(hd.length)}else{a='';b=en}
var r=esc(b);(x.clue||[]).forEach(function(c){var t=esc(c);if(!t)return;var i=r.indexOf(t);if(i>=0&&r.lastIndexOf('<',i)<=r.lastIndexOf('>',i))r=r.slice(0,i)+'<span class="cl">'+t+'</span>'+r.slice(i+t.length)});
return (a?'<span class="hd">'+esc(a)+'</span>':'')+r}
list();
