y life working on a cotton farm in Alabama.", "ko": "Traylor는 1853년 미국에서 노예로 태어나 앨라배마의 목화 농장에서 일하며 어린 시절을 보냈습니다."}, {"en": "Although he became a free man after the American Civil War, he still had to face racial discrimination, working for very low wages on the farm.", "ko": "그는 미국 남북전쟁 이후 자유의 몸이 되었지만, 농장에서 아주 낮은 임금을 받고 일하며 여전히 인종차별을 겪어야 했습니다."}, {"en": "Later, when he was around 70 years old, Traylor moved to the city of Montgomery, Alabama, where he found a job in a factory.", "ko": "이후 70세 무렵 Traylor는 앨라배마주 몽고메리시로 이주해 그곳 공장에서 일자리를 얻었습니다."}, {"en": "It wasn't until he was 85 years old and became too ill to work that he turned to drawing to express his life experiences.", "ko": "85세가 되어 몸이 너무 아파 일할 수 없게 된 후에야 그는 자신의 인생 경험을 표현하려고 그림을 시작했습니다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 3], [4, 4]], "ex": [{"head": "The first artist we're going", "clue": ["The first artist"], "core": "첫 번째 예술가 = Bill Traylor", "why": "글의 출발: 세 예술가 중 첫 번째(The first) 소개"}, {"head": "Traylor was born into slavery", "clue": ["born into slavery", "1853"], "core": "1853년 노예로 태어나 목화 농장에서 일함", "why": "이름 소개 다음 → 태어남(born)부터 인생 이야기 시작"}, {"head": "Although he became a free", "clue": ["a free man", "still"], "core": "남북전쟁 후 자유인, 그래도 인종차별·저임금", "why": "노예(slavery) 다음 → 자유의 몸(a free man), 그래도 still(여전히) 힘든 삶"}, {"head": "Later, when he was around", "clue": ["Later", "around 70 years old"], "core": "70세 무렵 몽고메리 이주, 공장 취직", "why": "Later(이후) + 70세 → 농장 시절 다음 시간 순서"}, {"head": "It wasn't until he was", "clue": ["85 years old", "turned to drawing"], "core": "85세에 아파서야 그림 시작", "why": "70세(앞) → 85세 = 시간 순서 마지막, 드디어 그림 시작"}], "postit": "첫 번째 예술가 → 1853 노예 출생 → 자유인 but 차별 → 70세 이주 → 85세 그림 시작"}, {"id": "g1_geumcheon_L3-p3", "label": "3과 ③ Bill Traylor의 작품", "sents": [{"en": "Now, we're going to look at some of his paintings, starting with Mean Dog and Man and Large Dog.", "ko": "이제 〈비열한 개〉와 〈남자와 큰 개〉를 시작으로 그의 그림 몇 점을 살펴보겠습니다."}, {"en": "Traylor had a strong fear of dogs because they had often been used on  there = 딕비, continued(계속) = 앞에서 그림 시작"}], "postit": "두 번째 예술가 → 1903 출생·신체 장애 → 중퇴 → 생계용 카드 그림 → 딕비 이사·남편 → 결혼 후 계속 그림"}, {"id": "g1_geumcheon_L3-p5", "label": "3과 ⑤ Maud Lewis의 작품", "sents": [{"en": "She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor.", "ko": "그녀는 〈딕비 항구의 가장자리〉 같은 그림에서 딕비의 풍경을 자주 그렸습니다."}, {"en": "Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style.", "ko": "그녀의 작품은 밝고 선명한 유화물감과 단순한 형태를 섞어 써서 독창적이고 혁신적인 스타일을 만들어 냈습니다."}, {"en": "Although her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "ko": "신체적 제약 때문에 작은 오두막에 갇혀 지냈지만, 그녀의 재능과 상상력은 끝이 없었습니다."}, {"en": "In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field.", "ko": "〈빨간 썰매〉에는 특별한 겨울 풍경에 붉은 단풍잎이 등장하고, 〈한 쌍의 소〉에는 꽃밭에 서 있는 장식된 소들이 그려져 있습니다."}, {"en": "With these features, Lewis' paintings create a magical quality, like that of a fairy tale.", "ko": "이런 특징 덕분에 Lewis의 그림은 마치 동화 같은 마법적인 느낌을 줍니다."}, {"en": "As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies.", "ko": "그녀의 그림이 점점 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고, 나중에 책과 영화로도 만들어졌습니다."}, {"en": "Maud Lewis expressed her love for the world through her paintings and became an iconic figure in Canadian folk art.", "ko": "Maud Lewis는 그림으로 세상에 대한 사랑을 표현했고 캐나다 민속 예술의 상징적인 인물이 되었습니다."}], "chunks": [[0, 1], [2, 4], [5, 5], [6, 6]], "ex": [{"head": "She often depicted the Digby", "clue": ["the Digby landscapes"], "core": "딕비 풍경을 자주 그림", "why": "글의 출발: 그녀가 살던 딕비의 풍경 그림부터"}, {"head": "Her artwork used a mixture", "clue": ["Her artwork"], "core": "밝은 유화물감 + 단순한 형태 = 독창적 스타일", "why": "풍경 그림(앞) 다음 → 그 그림의 화풍(물감·형태) 설명"}, {"head": "Although her physical limitations confined", "clue": ["Although", "physical limitations", "limitless"], "core": "몸은 작은 오두막에 갇혔지만 상상력은 무한", "why"  the 20th century and displayed her exceptional artistic talent.", "ko": "Ancher는 20세기 여성의 전통적인 역할에 도전하며 뛰어난 예술적 재능을 보여 주었습니다."}, {"en": "Her paintings continue to amaze us to this day.", "ko": "그녀의 그림은 오늘날까지도 우리를 놀라게 합니다."}, {"en": "Thank you for joining this guided tour, and I hope my explanations have aided you in appreciating these paintings.", "ko": "이번 가이드 투어에 함께해 주셔서 감사드리며, 제 설명이 그림 감상에 도움이 되었기를 바랍니다."}, {"en": "Please take some time to further explore the exhibition.", "ko": "시간을 내어 전시를 더 둘러보시기 바랍니다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 7]], "ex": [{"head": "Ancher differed from other artists", "clue": ["differed from", "still life subjects"], "core": "다른 화가들은 여성을 정물처럼 그림", "why": "글의 출발: 당시 다른 화가들과 달랐다(differed)는 점부터"}, {"head": "In contrast, she showcased them", "clue": ["In contrast", "them", "active participants"], "core": "반대로 여성을 일하는 적극적 주인공으로", "why": "In contrast(대조적으로): 정물(가만히) ↔ 적극적 참여자, them = 앞의 women"}, {"head": "She also skillfully explored light", "clue": ["also", "light and color"], "core": "빛과 색 탐구, 덴마크 인상주의에 기여", "why": "also(또한) = 여성 묘사에 이어 두 번째 업적(빛과 색) 추가"}, {"head": "In her painting Sunlight in", "clue": ["the sunlight"], "core": "〈푸른 방의 햇빛〉: 벽에 비친 햇빛", "why": "빛(light) 탐구(앞)의 실제 예 = 햇빛 그림"}, {"head": "Ancher challenged the conventional roles", "clue": ["challenged the conventional roles"], "core": "여성의 전통적 역할에 도전 + 뛰어난 재능", "why": "두 업적(여성 역할 + 빛·색 재능)을 모아 정리 → 작품 설명 다음"}, {"head": "Her paintings continue to amaze", "clue": ["to this day"], "core": "오늘날까지 감동을 주는 그림", "why": "정리(앞) 다음 → to this day(오늘날까지) 이어지는 평가, Ancher 이야기 끝"}, {"head": "Thank you for joining this", "clue": ["Thank you", "these paintings"], "core": "투어 참여 감사 인사", "why": "세 예술가 설명이 모두 끝난 뒤 → 투어 마무리 감사 인사"}, {"head": "Please take some time to", "clue": ["further explore"], "core": "전시 더 둘러보기 권유", "why": "감사 인사 다음 → further(더) 둘러보라는 마지막 한마디"}], "postit": "남들은 여성=정물 → 대조: 일하는 여성 → 또한 빛·색 → 푸른 방의 햇빛 → 전통 역할 도전 → 오늘날까지 감동 → 감사 인사 → 더 둘러보기"}]};

function list(){var h='';P.forEach(function(p,i){var d=st[p.id]||{};h+='<div class="row" onclick="open_('+i+',1)"><div><b translate="no">'+esc(p.label)+'</b><div class="n">'+p.sents.length+'문장</div></div><div class="dots"><span class="dot'+(d[1]?' on':'')+'">1단계</span><span class="dot'+(d[2]?' on':'')+'">2단계</span></div></div>'});
$('v').innerHTML='<h1>'+esc(DATA.t)+'</h1><div class="sub">'+esc(DATA.s)+'</div>'+h;window.scrollTo(0,0)}
var cur,lv,order,units;
function shuffle(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t}return b}
function mkUnits(p,l){if(l==1)return p.chunks.map(function(c){return [c[0],c[1]]});return p.sents.map(function(s,i){return [i,i]})}
function open_(i,l){cur=i;lv=l;var p=P[i];units=mkUnits(p,l);var mv=[];for(var k=1;k<units.length;k++)mv.push(k);
var o;do{o=shuffle(mv)}while(mv.length>1&&o.join()==mv.join());order=o;draw();window.scrollTo(0,0)}
function utext(u){var p=P[cur],a=[];for(var k=u[0];k<=u[1];k++)a.push(p.sents[k].en);return a.join(' ')}
function draw(){var p=P[cur];var h='<div class="top"><button class="back" onclick="list()">목록</button></div><div class="lab" translate="no">'+esc(p.label)+'</div>';
h+='<div class="seg"><button class="'+(lv==1?'on':'')+'" onclick="open_('+cur+',1)">1단계 덩어리</button><button class="'+(lv==2?'on':'')+'" onclick="open_('+cur+',2)">2단계 문장</button></div>';
h+='<div class="card fix" lang="en" translate="no">'+esc(utext(units[0]))+'</div><div id="bx">';
order.forEach(function(k){h+='<div class="card mv" data-k="'+k+'" lang="en" translate="no">'+esc(utext(units[k]))+'</div>'});
h+='</div><button class="btn go" id="sb" onclick="submit()">제출</button><div id="res"></div>';
h+=foot();$('v').innerHTML=h;bind()}
function foot(){return '<div class="foot"><button class="btn sec" onclick="list()">목록으로</button></div>'}
var locked=false;
function bind(){locked=false;var bx=$('bx');Array.prototype.forEach.call(bx.children,function(c){c.addEventListener('pointerdown',down)})}
var dg=null,ph=null,oy=0,sy=0;
function down(e){if(locked)return;var c=e.currentTarget;e.preventDefault();var r=c.getBoundingClientRect();dg=c;oy=e.clientY-r.top;
ph=document.createElement('div');ph.className='card ph';ph.style.height=r.height+'px';c.parentNode.insertBefore(ph,c);
c.classList.add('drag');c.style.position='fixed';c.style.left=r.left+'px';c.style.width=r.width+'px';c.style.top=r.top+'px';
try{c.setPointerCapture(e.pointerId)}catch(x){}
c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)}
function move(e){if(!dg)return;e.preventDefault();dg.style.top=(e.clientY-oy)+'px';
var bx=$('bx'),y=e.clientY,ch=Array.prototype.filter.call(bx.children,function(n){return n!==dg&&n!==ph}),put=null;
for(var i=0;i<ch.length;i++){var r=ch[i].getBoundingClientRect();if(y<r.top+r.height/2){put=ch[i];break}}
if(put)bx.insertBefore(ph,put);else bx.appendChild(ph);
if(e.clientY<60)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,12)}
function up(e){if(!dg)return;var c=dg;dg=null;c.removeEventListener('pointermove',move);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);
c.classList.remove('drag');c.style.position='';c.style.left='';c.style.top='';c.style.width='';ph.parentNode.insertBefore(c,ph);ph.remove();ph=null}
function submit(){if(locked)return;locked=true;var p=P[cur],bx=$('bx'),cs=bx.children,ok=0,n=cs.length;
for(var i=0;i<n;i++){var k=+cs[i].getAttribute('data-k'),g=(k==i+1);if(g)ok++;cs[i].classList.add(g?'ok':'ng');cs[i].classList.remove('mv');cs[i].insertAdjacentHTML('beforeend','<span class="mk">'+(g?'O':'X')+'</span>')}
var all=ok==n;if(all){st[p.id]=st[p.id]||{};st[p.id][lv]=1;save()}
$('sb').style.display='none';
var h='<div class="band '+(all?'ok':'ng')+'">'+(all?'정답':'다시 확인')+'<small>'+n+'개 중 '+ok+'개 제자리</small></div>';
h+='<div class="exh">이 순서로 기억하기</div>';
var cs2={};units.forEach(function(u,ui){if(ui>0)cs2[u[0]]=1});
p.sents.forEach(function(s,i){var x=p.ex[i];h+='<div class="ex'+(lv==1&&cs2[i]?' cb':'')+'"><span class="no">'+(i+1)+'</span>'+(i==0?'<span class="ck">시작</span>':'')+'<div class="en" lang="en" translate="no">'+mark(s.en,x)+'</div><div class="ko">'+esc(s.ko)+'</div>'+(x.core?'<div class="core">'+esc(x.core)+'</div>':'')+(x.why?'<div class="why">'+esc(x.why)+'</div>':'')+'</div>'});
h+='<div class="post"><small>이 순서 이렇게 외우자</small>'+esc(p.postit)+'</div>';
h+='<button class="btn go" onclick="open_('+cur+','+lv+')">다시 섞기</button>';
if(lv==1)h+='<button class="btn sec" onclick="open_('+cur+',2)">2단계 문장으로</button>';
else if(cur+1<P.length)h+='<button class="btn sec" onclick="open_('+(cur+1)+',1)">다음 지문</button>';
$('res').innerHTML=h}
function mark(en,x){var hd=x.head||'',a=en,b='';if(hd&&en.indexOf(hd)==0){a=en.slice(0,hd.length);b=en.slice(hd.length)}else{a='';b=en}
var r=esc(b);(x.clue||[]).forEach(function(c){var t=esc(c);if(!t)return;var i=r.indexOf(t);if(i>=0&&r.lastIndexOf('<',i)<=r.lastIndexOf('>',i))r=r.slice(0,i)+'<span class="cl">'+t+'</span>'+r.slice(i+t.length)});
return (a?'<span class="hd">'+esc(a)+'</span>':'')+r}
list();
</script></body></html>
