</style></head><body class="notranslate"><div class="wrap" id="v"></div><script>var DATA={"t": "교과서 4과 순서 다지기", "s": "공통영어2 4과 · 지문 3개", "k": "geumcheon-go1:sd:L4", "p": [{"id": "g1_geumcheon_L4-p1", "label": "4과 ① 신경 임플란트와 의료 활용", "sents": [{"en": "Neuroscience has a long history of exploring treatments for disorders of the nervous system, including the brain and spinal cord.", "ko": "신경과학은 뇌와 척수를 포함한 신경계 질환의 치료법을 탐구해 온 오랜 역사를 가지고 있다."}, {"en": "Traditionally, researchers have studied various functions of neural implants, which are medical devices like computer chips that can be implanted in the nervous system.", "ko": "전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔는데, 이것은 신경계에 이식할 수 있는 컴퓨터 칩 같은 의료 기기이다."}, {"en": "But here's the exciting part: with the rapid advancement of artificial intelligence (AI), researchers have begun to integrate AI into neural implants.", "ko": "그런데 흥미로운 점이 있다. 인공지능(AI)이 빠르게 발전하면서 연구자들이 신경 임플란트에 AI를 결합하기 시작했다는 것이다."}, {"en": "In this post, we'll examine the incredible benefits of AI-powered neural implants, their amazing potential for the future, and the ethical concerns surrounding them.", "ko": "이 글에서는 AI 기반 신경 임플란트의 놀라운 장점과 미래의 엄청난 잠재력, 그리고 이를 둘러싼 윤리적 우려를 살펴볼 것이다."}, {"en": "First, let's explore how this fascinating technology has been applied.", "ko": "먼저 이 매력적인 기술이 어떻게 활용되어 왔는지 살펴보자."}, {"en": "The AI-powered neural implant has shown great promise in medical applications, offering solutions to a range of problems.", "ko": "AI 기반 신경 임플란트는 다양한 문제의 해결책을 내놓으며 의료 분야에서 큰 가능성을 보여 주었다."}, {"en": "For instance, neural implants are used to treat brain disorders like Parkinson's disease.", "ko": "예를 들어, 신경 임플란트는 파킨슨병 같은 뇌 질환을 치료하는 데 쓰인다."}, {"en": "These implants electrically stimulate targeted regions of the brain at the right time with the help of AI to restore normal brain activity.", "ko": "이 임플란트는 정상적인 뇌 활동을 되살리기 위해 AI의 도움을 받아 알맞은 때에 뇌의 목표 부위를 전기로 자극한다."}, {"en": "In addition, paralyzed people can have the ability to walk again with the help of a “digital bridge” between two implants inserted into their brain and spine.", "ko": "또한 마비 환자들은 뇌와 척추에 넣은 두 임플란트 사이의 '디지털 다리' 덕분에 다시 걸을 수 있다."}, {"en": "When they think about moving their legs, the AI analyzes the brain signals and sends them to their legs through the implants.", "ko": "환자가 다리를 움직이려고 생각하면 AI가 뇌 신호를 분석해 임플란트를 통해 다리로 보낸다."}, {"en": "Similarly, those who have lost their arms can use artificial arms operated by the same mechanism.", "ko": "마찬가지로 팔을 잃은 사람들도 같은 원리로 움직이는 인공 팔을 사용할 수 있다."}], "chunks": [[0, 1], [2, 4], [5, 7], [8, 10]], "half": 5, "ex": [{"head": "Neuroscience has a long history", "clue": ["a long history"], "core": "신경과학 = 신경계 질환 치료를 오래 연구", "why": "글의 출발: 신경과학의 오랜 역사라는 큰 배경부터"}, {"head": "Traditionally, researchers have studied various", "clue": ["Traditionally", "neural implants"], "core": "전통적 연구 대상 = 신경 임플란트(이식형 칩)", "why": "Traditionally(전통적으로) = 옛날 방식 소개, neural implants(신경 임플란트) 첫 등장"}, {"head": "But here's the exciting part:", "clue": ["But", "integrate AI"], "core": "새로운 점 = 신경 임플란트에 AI 결합", "why": "But(그런데): 전통 연구 ↔ 새로운 흥미로운 변화(AI 결합)"}, {"head": "In this post, we'll examine", "clue": ["In this post", "benefits", "potential", "ethical concerns"], "core": "이 글 순서 예고: 장점 → 잠재력 → 윤리 문제", "why": "AI 임플란트 소개(앞) 다음 → 이 글에서 다룰 내용 3가지 예고"}, {"head": "First, let's explore how this", "clue": ["First", "this fascinating technology"], "core": "먼저 활용 사례부터", "why": "First(먼저) = 예고한 3가지 중 첫 번째 시작, this technology = AI 임플란트"}, {"head": "The AI-powered neural implant has", "clue": ["medical applications"], "core": "AI 임플란트, 의료 분야에서 큰 가능성", "why": "First, let's explore(앞) = 활용부터 보자 → 그 첫 답 = 의료 분야 활용"}, {"head": "For instance, neural implants are", "clue": ["For instance", "Parkinson's disease"], "core": "예1: 파킨슨병 같은 뇌 질환 치료", "why": "For instance(예를 들어) = 앞의 '의료 분야 가능성'의 첫 번째 예"}, {"head": "These implants electrically stimulate targeted", "clue": ["These implants"], "core": "AI 도움으로 뇌 부위를 제때 전기 자극", "why": "These implants(이 임플란트) = 앞에서 파킨슨병 치료에 쓴 임플란트"}, {"head": "In addition, paralyzed people can", "clue": ["In addition", "digital bridge"], "core": "예2: 마비 환자, 디지털 다리로 다시 걷기", "why": "In addition(게다가) = 파킨슨병 예에 이어 두 번째 예 추가"}, {"head": "When they think about moving", "clue": ["they", "their legs", "the implants"], "core": "걸으려는 생각 → AI가 뇌 신호 분석 → 다리로 전달", "why": "they = 앞의 마비 환자, the implants = 뇌·척추의 두 임플란트 → 디지털 다리의 작동 원리"}, {"head": "Similarly, those who have lost", "clue": ["Similarly", "the same mechanism"], "core": "예3: 팔 잃은 사람도 같은 원리로 인공 팔", "why": "Similarly(마찬가지로) + the same mechanism(같은 원리) = 앞의 다리 작동 원리를 받음"}], "postit": "신경과학의 역사 → 전통: 신경 임플란트 → But AI 결합 → 글 예고(장점·잠재력·윤리) → 먼저 활용 → 의료 분야 → 예1 파킨슨병·뇌 자극 → 예2 마비 환자 디지털 다리 → 예3 인공 팔", "cex": [{"core": "신경계 치료를 연구해 온 신경과학과 신경 임플란트", "why": "글의 출발: Neuroscience has a long history(신경과학의 오랜 역사) → 신경계 치료 연구 소개"}, {"core": "AI 결합 신경 임플란트, 장점·잠재력·윤리 예고", "why": "But here's the exciting part(그런데 흥미로운 점은) → 전통 연구 ↔ AI 결합이라는 새 변화"}, {"core": "파킨슨병 치료: AI가 뇌 부위를 제때 전기 자극", "why": "First, let's explore(먼저 살펴보자) → medical applications(의료 활용)가 첫 활용 분야"}, {"core": "디지털 다리로 마비 환자 보행, 같은 원리의 인공 팔", "why": "In addition(게다가) → 파킨슨병 치료에 이은 두 번째 예, 마비 환자 보행"}]}, {"id": "g1_geumcheon_L4-p2", "label": "4과 ② 미래 전망: 생각 조작과 기억", "sents": [{"en": "The success of AI-powered neural implants in health care is also expected to spread to other industries.", "ko": "의료 분야에서 거둔 AI 기반 신경 임플란트의 성공은 다른 산업으로도 퍼질 것으로 예상된다."}, {"en": "Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives.", "ko": "일부 미래학자들은 이 임플란트가 앞으로 20~30년 안에 상용화되어 우리의 일상을 크게 바꿀 것이라고 예측한다."}, {"en": "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds.", "ko": "예를 들어, 신경 임플란트 기술이 발전하면 우리의 생각을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다."}, {"en": "This could enable us to play games, type social media messages, and stream music simply by thinking.", "ko": "이것 덕분에 우리는 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍할 수 있을지도 모른다."}, {"en": "There is also great potential for memory-enhancing brain implants, similar to computer memory chips.", "ko": "컴퓨터 메모리 칩과 비슷한, 기억력을 높여 주는 뇌 임플란트도 큰 잠재력이 있다."}, {"en": "Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.", "ko": "이런 장치가 있으면 기억을 저장하고 강화할 수 있으며, 디지털 클라우드를 이용해 기억을 올리고 내려받을 수도 있을 것이다."}, {"en": "We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories.", "ko": "우리는 소셜 미디어 피드처럼 기억을 훑어보고, 인생에서 가장 좋았던 순간을 생생하게 떠올리고, 다른 사람과 기억을 나누고, 가장 소중한 기억을 백업할 수 있을 것이다."}, {"en": "Finally, AI-powered neural implants would revolutionize the way our brains work.", "ko": "마지막으로, AI 기반 신경 임플란트는 우리 뇌가 작동하는 방식을 혁명적으로 바꿀 것이다."}, {"en": "The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants.", "ko": "뇌의 역할은 정보를 배우고 저장하는 것에서 임플란트가 주는 방대한 데이터를 처리하는 것으로 바뀔 것이다."}, {"en": "Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas.", "ko": "우리는 정보를 단순히 외우는 대신 지식을 내려받고, 창의력을 발휘해 그것을 해석하고, 새로운 아이디어를 만들어 낼 수 있을 것이다."}], "chunks": [[0, 1], [2, 3], [4, 6], [7, 9]], "half": 4, "ex": [{"head": "The success of AI-powered neural", "clue": ["The success", "in health care", "other industries"], "core": "의료에서의 성공 → 다른 산업으로 확산 예상", "why": "글의 출발: 의료(앞 단락) 성공을 받아 미래·다른 산업으로 넘어감"}, {"head": "Some futurists predict that these", "clue": ["these implants", "20 to 30 years"], "core": "20~30년 안에 상용화, 일상 크게 변화", "why": "these implants(이 임플란트) = 앞 문장의 AI 신경 임플란트, 확산 예상 → 구체적 예측"}, {"head": "For example, advances in neural", "clue": ["For example", "read our minds"], "core": "예: 생각 읽는 소프트웨어를 뇌에 설치", "why": "For example(예를 들어) = '일상이 크게 바뀜'의 구체적 예"}, {"head": "This could enable us to", "clue": ["This", "simply by thinking"], "core": "생각만으로 게임·메시지·음악", "why": "This(이것) = 앞의 생각 읽는 소프트웨어 → 그걸로 할 수 있는 일"}, {"head": "There is also great potential", "clue": ["also", "memory-enhancing brain implants"], "core": "기억력 높이는 뇌 임플란트도 큰 잠재력", "why": "also(또한) = 생각 조작(앞)에 이어 두 번째 미래 가능성(기억)"}, {"head": "Such devices would allow us", "clue": ["Such devices", "memories"], "core": "기억 저장·강화, 클라우드로 업·다운로드", "why": "Such devices(그러한 장치) = 앞의 기억력 향상 임플란트"}, {"head": "We could look through our", "clue": ["our memories", "like a social media feed"], "core": "기억을 피드처럼 보고 공유·백업", "why": "업·다운로드한 기억(앞)으로 할 수 있는 일 = 피드처럼 보기·공유·백업"}, {"head": "Finally, AI-powered neural implants would", "clue": ["Finally", "the way our brains work"], "core": "마지막 변화: 뇌의 작동 방식 혁명", "why": "Finally(마지막으로) = 생각 조작·기억에 이은 마지막 변화"}, {"head": "The role of the brain", "clue": ["The role of the brain", "shift from"], "core": "뇌의 역할: 저장 → 데이터 처리", "why": "the way our brains work(앞)를 구체적으로 = 뇌의 역할이 바뀜"}, {"head": "Instead of simply memorizing information,", "clue": ["Instead of", "memorizing"], "core": "외우기 대신 지식 다운로드·해석·새 아이디어", "why": "Instead of memorizing(외우는 대신) = 앞의 learning and storing(저장)에서 벗어난 모습"}], "postit": "의료 성공 → 다른 산업 확산·20~30년 → 예: 생각 읽는 소프트웨어 → 생각만으로 게임·메시지 → 또한 기억 임플란트 → 저장·클라우드 → 피드처럼 보기 → 마지막: 뇌 작동 혁명 → 외우기 대신 창의", "cex": [{"core": "의료 성공의 산업 확산, 20~30년 내 상용화 예측", "why": "글의 출발: The success ~ in health care(의료 분야 성공) → also expected to spread(확산 예상)"}, {"core": "생각 읽는 소프트웨어로 생각만으로 게임·메시지·음악", "why": "For example(예를 들어) → '일상이 크게 바뀜'의 첫 예, 생각 읽는 소프트웨어"}, {"core": "기억 강화 임플란트: 저장·업로드·공유·백업", "why": "There is also great potential(또한 큰 잠재력) → 생각 조작에 이은 두 번째 가능성"}, {"core": "뇌의 역할 혁명: 저장 대신 데이터 처리와 창의", "why": "Finally(마지막으로) → 생각 조작·기억에 이은 마지막 변화"}]}, {"id": "g1_geumcheon_L4-p3", "label": "4과 ③ 윤리적 문제", "sents": [{"en": "Before we can fully embrace the era of AI-powered neural implants, many tricky ethical issues should be addressed.", "ko": "AI 기반 신경 임플란트의 시대를 완전히 받아들이기 전에 많은 까다로운 윤리적 문제들이 해결되어야 한다."}, {"en": "The integration of AI technology with the human brain raises concerns about what it means to be human.", "ko": "AI 기술과 인간의 뇌를 결합하는 것은 인간이란 무엇인가에 대한 우려를 낳는다."}, {"en": "Our brains are believed to be central to our identity, existence, and value as human beings.", "ko": "우리의 뇌는 인간으로서의 정체성, 존재, 가치의 중심이라고 여겨진다."}, {"en": "However, an over-reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between.", "ko": "그러나 기술에 지나치게 의존하면 자연스러운 발달이 늦어지고, 우리가 인간인지 AI인지 아니면 그 중간인지 혼란이 생길 수 있다."}, {"en": "Another critical issue is privacy.", "ko": "또 다른 중요한 문제는 사생활(프라이버시)이다."}, {"en": "There's a risk that organizations or hackers could access personal data without permission through AI-connected implants.", "ko": "기관이나 해커가 AI와 연결된 임플란트를 통해 허락 없이 개인 정보에 접근할 위험이 있다."}, {"en": "This means that our thoughts, emotions, and behaviors could be controlled by hackers.", "ko": "이는 우리의 생각, 감정, 행동이 해커에게 조종당할 수 있다는 뜻이다."}, {"en": "There's an additional risk that this technology could lead to even greater social inequality, given that it may not be available to all due to its high cost.", "ko": "또한 이 기술은 비용이 비싸 모두가 이용하지 못할 수 있다는 점에서 사회적 불평등을 더 키울 수 있다는 추가 위험도 있다."}, {"en": "Such unequal access to the technology could intensify the division between those who can afford the implants and those who cannot.", "ko": "이런 불평등한 기술 접근은 임플란트를 살 수 있는 사람과 그렇지 못한 사람 사이의 분열을 더 심하게 만들 수 있다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 8]], "half": 4, "ex": [{"head": "Before we can fully embrace", "clue": ["ethical issues"], "core": "시대를 받아들이기 전에 윤리 문제 해결 필요", "why": "글의 출발: 장점 다음 → 해결해야 할 윤리 문제(ethical issues) 예고"}, {"head": "The integration of AI technology", "clue": ["The integration", "what it means to be human"], "core": "문제1: 인간이란 무엇인가에 대한 우려", "why": "윤리 문제(앞)의 첫 번째 = 인간다움에 대한 우려"}, {"head": "Our brains are believed to", "clue": ["Our brains", "identity"], "core": "뇌 = 인간 정체성·존재·가치의 중심", "why": "what it means to be human(앞) → 왜 걱정인지, 뇌가 인간의 중심이기 때문"}, {"head": "However, an over-reliance on technology", "clue": ["However", "over-reliance", "human, AI, or something in between"], "core": "그러나 기술 과의존 → 인간인지 AI인지 혼란", "why": "However(그러나): 뇌 = 인간의 중심 ↔ 기술 의존으로 그 중심이 흔들림"}, {"head": "Another critical issue is privacy.", "clue": ["Another critical issue", "privacy"], "core": "문제2: 사생활(프라이버시)", "why": "Another(또 다른) = 첫 번째 문제(인간다움) 다음의 두 번째 문제"}, {"head": "There's a risk that organizations", "clue": ["a risk", "hackers"], "core": "기관·해커가 허락 없이 개인 정보에 접근할 위험", "why": "privacy(앞)의 구체적 위험 = 개인 정보 유출"}, {"head": "This means that our thoughts,", "clue": ["This means", "hackers"], "core": "생각·감정·행동까지 해커가 조종 가능", "why": "This means(이는 ~라는 뜻) = 앞의 해커 접근 위험의 더 무서운 의미"}, {"head": "There's an additional risk that", "clue": ["an additional risk", "social inequality", "high cost"], "core": "문제3: 비싼 비용 → 사회적 불평등", "why": "an additional risk(추가 위험) = 앞의 a risk(정보 유출)에 하나 더 얹음"}, {"head": "Such unequal access to the", "clue": ["Such unequal access"], "core": "살 수 있는 사람 vs 없는 사람 분열 심화", "why": "Such unequal access(그런 불평등한 접근) = 앞의 '모두가 이용 못함'"}], "postit": "윤리 문제 예고 → ①인간다움: 뇌=정체성 but 과의존 혼란 → ②사생활: 해커 접근 → 생각까지 조종 → ③비용: 불평등·분열", "cex": [{"core": "받아들이기 전 윤리 문제, 인간다움에 대한 우려", "why": "글의 출발: Before we can fully embrace(완전히 받아들이기 전에) → ethical issues(윤리 문제) 예고"}, {"core": "뇌 = 정체성의 중심, 기술 과의존 시 인간·AI 혼란", "why": "Our brains(우리의 뇌) → 인간다움 우려의 이유, 뇌는 정체성의 중심"}, {"core": "사생활 문제: 해커의 개인 정보 무단 접근 위험", "why": "Another critical issue(또 다른 중요 문제) → 인간다움에 이은 두 번째 문제, 사생활"}, {"core": "생각·감정 조종 위험, 비싼 비용으로 불평등 심화", "why": "This means(이는 ~라는 뜻) = 해커가 개인 정보에 접근한다는 것의 의미"}]}]};

function down(e){if(locked)return;pc=e.currentTarget;px=e.clientX;py=e.clientY;pid=e.pointerId;e.preventDefault();try{pc.setPointerCapture(e.pointerId)}catch(x){}
pc.addEventListener('pointermove',move);pc.addEventListener('pointerup',up);pc.addEventListener('pointercancel',up)}
function start(e){var c=pc,r=c.getBoundingClientRect();dg=c;oy=py-r.top;
ph=document.createElement('div');ph.className='card ph';ph.style.height=r.height+'px';c.parentNode.insertBefore(ph,c);
c.classList.add('drag');c.style.position='fixed';c.style.left=r.left+'px';c.style.width=r.width+'px';c.style.top=r.top+'px'}
function move(e){if(!pc)return;e.preventDefault();if(!dg){if(Math.abs(e.clientY-py)+Math.abs(e.clientX-px)<7)return;start(e)}
dg.style.top=(e.clientY-oy)+'px';
var bx=$('bx'),y=e.clientY,ch=Array.prototype.filter.call(bx.children,function(n){return n!==dg&&n!==ph}),put=null;
for(var i=0;i<ch.length;i++){var r=ch[i].getBoundingClientRect();if(y<r.top+r.height/2){put=ch[i];break}}
if(put)bx.insertBefore(ph,put);else bx.appendChild(ph);
if(e.clientY<60)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,12)}
function up(e){var c=pc;if(!c)return;pc=null;c.removeEventListener('pointermove',move);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);
if(!dg){if(e.type==='pointerup'&&c.querySelector('.fl'))c.classList.toggle('op');return}
dg=null;c.classList.remove('drag');c.style.position='';c.style.left='';c.style.top='';c.style.width='';ph.parentNode.insertBefore(c,ph);ph.remove();ph=null}
function submit(){if(locked)return;locked=true;var p=P[cur],bx=$('bx'),cs=bx.children,ok=0,n=cs.length;
for(var i=0;i<n;i++){var k=+cs[i].getAttribute('data-k'),g=(k==i+1);if(g)ok++;cs[i].classList.add(g?'ok':'ng');cs[i].classList.remove('mv');cs[i].insertAdjacentHTML('beforeend','<span class="mk">'+(g?'O':'X')+'</span>')}
var all=ok==n;if(all){st[p.id]=st[p.id]||{};if(lv==1)st[p.id][1]=1;else{st[p.id]['2_'+hp]=1;if(halves(p).length==1)st[p.id][2]=1}save()}
$('sb').style.display='none';
var h='<div class="band '+(all?'ok':'ng')+'">'+(all?'정답':'다시 확인')+'<small>'+n+'개 중 '+ok+'개 제자리</small></div>';
h+='<div class="exh">이 순서로 기억하기</div>';
var cs2={};units.forEach(function(u,ui){if(ui>0)cs2[u[0]]=1});
if(lv==1){p.chunks.forEach(function(c,ci){var cx=(p.cex&&p.cex[ci])||p.ex[c[0]];h+='<div class="ex ch"><span class="no">'+(ci+1)+'</span>'+(ci==0?'<span class="ck">시작</span>':'');for(var i=c[0];i<=c[1];i++){var s=p.sents[i];h+='<div class="en" lang="en" translate="no">'+mark(s.en,i==c[0]?p.ex[i]:{head:p.ex[i].head,clue:[]})+'</div><div class="ko">'+esc(s.ko)+'</div>'}h+=(cx.core?'<div class="core">'+esc(cx.core)+'</div>':'')+(cx.why?'<div class="why">'+esc(cx.why)+'</div>':'')+'</div>'})}else{var rg=halves(p)[hp];p.sents.forEach(function(s,i){if(i<rg[0]||i>rg[1])return;var x=p.ex[i];h+='<div class="ex'+(lv==1&&cs2[i]?' cb':'')+'"><span class="no">'+(i+1)+'</span>'+(i==rg[0]?'<span class="ck">시작</span>':'')+'<div class="en" lang="en" translate="no">'+mark(s.en,x)+'</div><div class="ko">'+esc(s.ko)+'</div>'+(x.core?'<div class="core">'+esc(x.core)+'</div>':'')+(x.why?'<div class="why">'+esc(x.why)+'</div>':'')+'</div>'});}
h+='<div class="post"><small>이 순서 이렇게 외우자</small>'+esc(p.postit)+'</div>';
var hs2=halves(p);h+='<button class="btn go" onclick="open_('+cur+','+lv+','+hp+')">다시 섞기</button>';
if(lv==1)h+='<button class="btn sec" onclick="open_('+cur+',2,0)">'+(hs2.length>1?'2단계 앞으로':'2단계 문장으로')+'</button>';
else if(hp+1<hs2.length)h+='<button class="btn sec" onclick="open_('+cur+',2,'+(hp+1)+')">2단계 뒤로</button>';
else if(cur+1<P.length)h+='<button class="btn sec" onclick="open_('+(cur+1)+',1)">다음 지문</button>';
$('res').innerHTML=h}
function mark(en,x){var hd=x.head||'',a=en,b='';if(hd&&en.indexOf(hd)==0){a=en.slice(0,hd.length);b=en.slice(hd.length)}else{a='';b=en}
var r=esc(b);(x.clue||[]).forEach(function(c){var t=esc(c);if(!t)return;var i=r.indexOf(t);if(i>=0&&r.lastIndexOf('<',i)<=r.lastIndexOf('>',i))r=r.slice(0,i)+'<span class="cl">'+t+'</span>'+r.slice(i+t.length)});
return (a?'<span class="hd">'+esc(a)+'</span>':'')+r}
list();
