s, which was unusual for women at the time.", "Thanks to her mother's encouragement, she was able to take advantage of these opportunities."], "kos": ["그 후 그녀는 파리에서 유학까지 했는데, 그것은 당시 여성들에게 드문 일이었다.", "어머니의 격려 덕분에 그녀는 이러한 기회를 활용할 수 있었다."]}, {"tag": "본문 13번", "ns": [13], "line": "결혼 후에도 집안일만 하라는 압력에 [[objecting|반대하며]] 그림을 계속 그렸다.", "en": ["Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties."], "kos": ["결혼 후에도 Ancher는 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며 그림을 계속 그렸다."]}], "story": [{"a": "depict", "form": "depicted", "n": 1, "sq": 1, "sum": "Maud Lewis often [[portrayed]] the scenery of Digby", "hook": "딕비 풍경을 그림으로 자주 그렸다는 문장의 depicted(묘사했다) → 요약문에서는 portrayed(묘사했다, 그렸다)로 바뀌었어요.", "b": "portray", "k": "묘사하다 → 묘사하다, 그리다", "en": "She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor.", "ko": "그녀는 〈딕비 항구의 가장자리〉와 같은 그림에서 딕비의 풍경을 자주 묘사했다."}, {"a": "original", "form": "original", "n": 2, "sq": 2, "sum": "to create a [[unique]] style", "hook": "밝고 단순한 그림이 만든 스타일을 말하는 문장의 original(독창적인) → 요약문에서는 unique(독특한)로 바뀌었어요.", "b": "unique", "k": "독창적인 → 독특한", "en": "Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style.", "ko": "그녀의 작품은 밝고 선명한 유화물감의 혼합과 단순한 형태를 사용하여 독창적이고 혁신적인 스타일을 만들어 냈다."}, {"a": "limitation", "form": "limitations", "n": 3, "sq": 1, "sum": "her physical [[restrictions]] kept her in a small house", "hook": "몸이 불편해 작은 오두막에 갇혔다는 문장의 limitations(제약) → 요약문에서는 restrictions(제약)로 바뀌었어요.", "b": "restriction", "k": "제약 → 제약, 한계", "en": "Although her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "ko": "비록 신체적 제약들은 그녀를 작은 오두막집에 가두었지만 그녀의 재능과 상상력은 둘 다 무한했다."}, {"a": "magical", "form": "magical", "n": 5, "sq": 2, "sum": "[[enchanting]] qualities like a fairy tale", "hook": "동화처럼 마법 같다는 문장의 magical(마법 같은) → 요약문에서는 enchanting(매혹적인)으로 바뀌었어요.", "b": "enchanting", "k": "마법 같은 → 마음을 사로잡는, 매혹적인", "en": "With these features, Lewis' paintings create a magical quality, like that of a fairy tale.", "ko": "이러한 특징을 통해 Lewis의 그림은 마치 동화의 그것과 같은, 마법 같은 특성을 만들어 낸다."}, {"a": "popularity", "form": "popularity", "n": 6, "sq": 3, "sum": "slowly gained [[fame]]", "hook": "그림이 점점 알려졌다는 문장의 popularity(인기) → 요약문에서는 fame(명성)으로 바뀌었어요.", "b": "fame", "k": "인기 → 명성", "en": "As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies.", "ko": "그녀의 그림이 점차 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고 나중에 책과 영화로 만들어졌다."}, {"a": "inspire", "form": "inspired", "n": 6, "sq": 3, "sum": "her story [[motivated]] many people", "hook": "이야기가 많은 사람의 마음을 움직였다는 문장의 inspired(영감을 주었다) → 요약문에서는 motivated(동기를 주었다)로 바뀌었어요.", "b": "motivate", "k": "영감을 주다 → 동기를 주다", "en": "As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies.", "ko": "그녀의 그림이 점차 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고 나중에 책과 영화로 만들어졌다."}, {"a": "theme", "form": "theme", "n": 9, "sq": 5, "sum": "a common [[subject]] of female figures", "hook": "그림마다 여성이 나온다는 문장의 theme(주제) → 요약문에서는 subject(주제, 소재)로 바뀌었어요.", "b": "subject", "k": "주제 → 주제, 소재", "en": "When observing her paintings, you may notice a common theme —they all feature female figures.", "ko": "그녀의 그림을 보면 여러분은 공통적인 주제를 알아차릴지도 모르는데, 그건 바로 그림에 모두 여성 인물이 등장한다는 점이다."}, {"a": "unusual", "form": "unusual", "n": 11, "sq": 4, "sum": "which was [[rare]] for women at the time", "hook": "당시 여성의 파리 유학이 드문 일이었다는 문장의 unusual(흔치 않은) → 요약문에서는 rare(드문)로 바뀌었어요.", "b": "rare", "k": "드문 → 드문, 흔치 않은", "en": "After that, she even studied abroad in Paris, which was unusual for women at the time.", "ko": "그 후 그녀는 파리에서 유학까지 했는데, 그것은 당시 여성들에게 드문 일이었다."}, {"a": "encouragement", "form": "encouragement", "n": 12, "sq": 4, "sum": "Thanks to her mother's [[support]]", "hook": "어머니가 용기를 북돋워 줬다는 문장의 encouragement(격려) → 요약문에서는 support(지지)로 바뀌었어요.", "b": "support", "k": "격려 → 지지", "en": "Thanks to her mother's encouragement, she was able to take advantage of these opportunities.", "ko": "어머니의 격려 덕분에 그녀는 이러한 기회를 활용할 수 있었다."}, {"a": "object", "form": "objecting", "n": 13, "sq": 5, "sum": "[[resisting]] the pressure to do only housework", "hook": "집안일만 하라는 압력에 반대했다는 문장의 objecting(반대하며) → 요약문에서는 resisting(맞서며)으로 바뀌었어요.", "b": "resist", "k": "반대하다 → 맞서다, 저항하다", "en": "Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties.", "ko": "결혼 후에도 Ancher는 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며 그림을 계속 그렸다."}], "passage": [{"n": 1, "en": "She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor.", "ko": "그녀는 〈딕비 항구의 가장자리〉와 같은 그림에서 딕비의 풍경을 자주 묘사했다."}, {"n": 2, "en": "Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style.", "ko": "그녀의 작품은 밝고 선명한 유화물감의 혼합과 단순한 형태를 사용하여 독창적이고 혁신적인 스타일을 만들어 냈다."}, {"n": 3, "en": "Although her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "ko": "비록 신체적 제약들은 그녀를 작은 오두막집에 가두었지만 그녀의 재능과 상상력은 둘 다 무한했다."}, {"n": 4, "en": "In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field.", "ko": "〈빨간 썰매〉에는 붉은 단풍잎이 특별한 겨울 풍경에 등장하고, 〈한 쌍의 소〉에는 꽃밭에 서 있는 장식된 소들을 보여 준다."}, {"n": 5, "en": "With these features, Lewis' paintings create a magical quality, like that of a fairy tale.", "ko": "이러한 특징을 통해 Lewis의 그림은 마치 동화의 그것과 같은, 마법 같은 특성을 만들어 낸다."}, {"n": 6, "en": "As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies.", "ko": "그녀의 그림이 점차 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고 나중에 책과 영화로 만들어졌다."}, {"n": 7, "en": "Maud Lewis expressed her love for the world through her paintings and became an iconic figure in Canadian folk art.", "ko": "Maud Lewis는 그림을 통해 세상에 대한 사랑을 표현했고 캐나다 민속 예술의 상징적인 인물이 되었다."}, {"n": 8, "en": "Now let's take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark.", "ko": "이제 이번 전시의 마지막 예술가, 덴마크 출신의 유명 화가 Anna Ancher를 살펴보자."}, {"n": 9, "en": "When observing her paintings, you may notice a common theme —they all feature female figures.", "ko": "그녀의 그림을 보면 여러분은 공통적인 주제를 알아차릴지도 모르는데, 그건 바로 그림에 모두 여성 인물이 등장한다는 점이다."}, {"n": 10, "en": "Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school.", "ko": "1859년 덴마크 스카겐에서 태어난 그녀는 나중에 사립 회화 학교에 다니기 위해 코펜하겐으로 이주했다."}, {"n": 11, "en": "After that, she even studied abroad in Paris, which was unusual for women at the time.", "ko": "그 후 그녀는 파리에서 유학까지 했는데, 그것은 당시 여성들에게 드문 일이었다."}, {"n": 12, "en": "Thanks to her mother's encouragement, she was able to take advantage of these opportunities.", "ko": "어머니의 격려 덕분에 그녀는 이러한 기회를 활용할 수 있었다."}, {"n": 13, "en": "Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties.", "ko": "결혼 후에도 Ancher는 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며 그림을 계속 그렸다."}], "questions": [{"id": 1, "summary": "Maud Lewis often (A) the scenery of Digby in her paintings, but her physical (B) kept her in a small house.", "ko": "Maud Lewis는 그림에서 딕비의 풍경을 자주 <b>(A) 묘사했지만</b>, 신체적 <b>(B) 제약</b> 때문에 작은 집에 갇혀 지냈다.", "opts": [["portrayed", "advantages"], ["ignored", "restrictions"], ["portrayed", "restrictions"], ["ignored", "abilities"], ["imagined", "talents"]], "optko": ["묘사하다 – 장점", "무시하다 – 제약", "묘사하다 – 제약", "무시하다 – 능력", "상상하다 – 재능"], "ans": 2, "wrong": ["advantages(장점)가 틀려요. 몸이 불편해서 작은 오두막에 갇혔다고 했으니 장점이 아니라 제약이에요.", "ignored(무시하다)가 틀려요. 그녀는 딕비의 풍경을 무시한 게 아니라 자주 그렸어요(depict).", null, "둘 다 틀려요. 풍경을 무시했다는 말도, 능력 때문에 갇혔다는 말도 본문에 없어요.", "둘 다 틀려요. 상상해서 그린 게 아니라 실제 딕비 풍경을 그렸고, talents(재능)는 갇힌 이유가 아니에요."], "evid": [{"n": 1, "hl": ["depicted the Digby landscapes"]}, {"n": 3, "hl": ["physical limitations confined her function jget(k,d){try{var v=JSON.parse(LS.getItem(k));return v==null?d:v}catch(e){return d}}
function jset(k,v){try{LS.setItem(k,JSON.stringify(v))}catch(e){}}
var NOTES=jget(K_NOTE,{}), PR=jget(K_PROG,{a:{}}), SRV={}, SRC='요약문 완성', PUSHED=jget('vhvs:'+SCH,{});
if(!PR.a)PR={a:{}};
var view='home', cur=0, filt='all', curQ=0;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var CN='①②③④⑤';
var WRE=/[A-Za-z][A-Za-z'’\-]*[A-Za-z]|[A-Za-z]/g;
function words(t){
  var out='',last=0,m;WRE.lastIndex=0;
  while((m=WRE.exec(t))){
    out+=esc(t.slice(last,m.index));
    var key=m[0].toLowerCase().replace(/’/g,"'");
    if(G[key]){out+='<span class="w'+(NOTES[G[key][0].toLowerCase()]?' got':'')+'" data-k="'+esc(key)+'">'+esc(m[0])+'</span>'}
    else out+=esc(m[0]);
    last=m.index+m[0].length;
  }
  return out+esc(t.slice(last));
}
function mk(t){return esc(t).replace(/\{\{([^|}]+)\|([^}]+)\}\}/g,function(m,e,k){return '<mark>'+e+'</mark>(<mark>'+k+'</mark>)'})}
function hlp(t){
  var o=esc(t);
  o=o.replace(/([A-Za-z][A-Za-z' ]*[A-Za-z])\(([가-힣][가-힣 ,·]*)\)/g,'<mark>$1</mark>(<mark>$2</mark>)');
  o=o.replace(/([가-힣]+)\(([A-Za-z][A-Za-z' ]*[A-Za-z])\)/g,'<mark>$1</mark>(<mark>$2</mark>)');
  return o;
}
function useEx(u){
  var re=new RegExp('\\b'+u.w+'\\w*','i');
  return u.ex.split(new RegExp('('+re.source+')','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('');
}
function richKo(t,hl){
  var pos=[];(hl||[]).forEach(function(h){var i=t.indexOf(h);if(i>=0)pos.push([i,i+h.length])});
  pos.sort(function(a,b){return a[0]-b[0]});
  var c=0,o='';
  pos.forEach(function(p){if(p[0]<c)return;o+=esc(t.slice(c,p[0]))+'<mark>'+esc(t.slice(p[0],p[1]))+'</mark>';c=p[1]});
  return o+esc(t.slice(c));
}
function rich(t,hl){
  if(!hl||!hl.length)return words(t);
  var pos=[];hl.forEach(function(h){var i=t.indexOf(h);if(i>=0)pos.push([i,i+h.length])});
  pos.sort(function(a,b){return a[0]-b[0]});
  var c=0,o='';
  pos.forEach(function(p){if(p[0]<c)return;o+=words(t.slice(c,p[0]))+'<mark>'+words(t.slice(p[0],p[1]))+'</mark>';c=p[1]});
  return o+words(t.slice(c));
}
function sumHtml(q,done){
  var o='';
  q.summary.split(/(\(A\)|\(B\))/).forEach(function(p){
    if(p==='(A)'||p==='(B)'){
      if(done)o+='<span class="fill">'+words(q.opts[q.ans][p==='(A)'?0:1])+'</span>';
      else o+='<span class="blank">'+p+'</span>';
    }else o+=words(p);
  });
  return o;
}
function nNotes(){return Object.keys(NOTES).length}
function firstOpen(){for(var i=0;i<Qs.length;i++)if(PR.a[Qs[i].id]===undefined)return i;return -1}
function doneCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]!==undefined)n++});return n}
function okCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]===q.ans)n++});return n}
function hideSheet(){$('sheet').className=''}
var histPushed=false;
function go(v,i){
  if(i!==undefined)cur=i;
  if(v==='home'&&view!=='home'&&histPushed){histPushed=false;try{history.back();return}catch(e){}}
  if(v!=='home'&&view==='home'){try{history.pushState({v:v},'');histPushed=true}catch(e){}}
  view=v;hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)
}
window.addEventListener('popstate',function(){histPushed=false;view='home';hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)});
function sayBtn(){return ''}


/* 단어 누르기: 뜻을 보여 주고 단어노트에 자동으로 담는다 */
function tapWord(key){
  var g=G[key];if(!g)return;
  var lem=g[0],id=lem.toLowerCase();
  var n=NOTES[id]||{l:lem,k:g[1],c:0,t:0};
  n.c=(n.c||0)+1;n.t=Date.now();n.q=curQ;NOTES[id]=n;jset(K_NOTE,NOTES);
  if(!PUSHED['w:'+id]){PUSHED['w:'+id]=1;jset('vhvs:'+SCH,PUSHED);try{WN.add([{w:lem,m:g[1],src:SRC,how:'탭',ask:true}])}catch(e){}}
  $('sw').textContent=key.toLowerCase()===id?lem:key+'  →  '+lem;
  $('sl').textContent=g[1];
  $('sn').textContent='단어노트에 담았어요 (지금 '+nNotes()+'개)';
  $('sheet').className='on';
  document.querySelectorAll('.w[data-k]').forEach(function(e){var gg=G[e.getAttribute('data-k')];if(gg&&gg[0].toLowerCase()===id)e.classList.add('got')});
}
document.addEventListener('click',function(e){
  var w=e.target.closest&&e.target.closest('.w');
  if(w){e.stopPropagation();tapWord(w.getAttribute('data-k'));return}
  if(!(e.target.closest&&e.target.closest('#sheet')))hideSheet();
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');
  else if(act==='q')go('q',+v);
  else if(act==='pick')pick(+v);
  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}



function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){return (DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}})}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../index.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">밑줄 단어를 누르면 뜻이 나와요. 번호를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';

    var cls='opt'+(done?' lock':'');

    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+words(o[0])+'<span class="dash">–</span>'+words(o[1])+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });

  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;

  var h='<div class="top"><button class="back" data-a="home">목록</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';

  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}

function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});

  });

function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
