<style>

<script>
var D={"secs": [{"no": 1, "id": "z1", "sents": [{"n": 1, "mk": "Welcome to the Dream Art Gallery!", "en": "Welcome to the Dream Art Gallery!", "ko": "드림 아트 갤러리에 오신 것을 환영한다!"}, {"n": 2, "mk": "I'm Isabel Williams, the docent for the From Shadows to Spotlights exhibit.", "en": "I'm Isabel Williams, the docent for the From Shadows to Spotlights exhibit.", "ko": "나는 〈그림자에서 빛으로〉 전시회의 도슨트인 Isabel Williams이다."}, {"n": 3, "mk": "Today, you're going to meet three amazing artists who never [1|gave up on] [3|their] art, [2|despite challenges in their lives].", "en": "Today, you're going to meet three amazing artists who never gave up on their art, despite challenges in their lives.", "ko": "오늘은 인생의 역경에도 불구하고 결코 예술을 포기하지 않았던 세 명의 놀라운 예술가들을 만나 보려고 한다."}, {"n": 4, "mk": "Each artist has a unique painting style and story that [4|has made their work highly valued].", "en": "Each artist has a unique painting style and story that has made their work highly valued.", "ko": "각 예술가에게는 독특한 화풍과 그들의 작품을 높이 평가받게 만들어 준 이야기가 있다."}, {"n": 5, "mk": "Let's explore each artist's life and artwork.", "en": "Let's explore each artist's life and artwork.", "ko": "각 예술가의 삶과 작품을 함께 살펴보자."}, {"n": 6, "mk": "The first artist [5|we're going to examine] is Bill Traylor.", "en": "The first artist we're going to examine is Bill Traylor.", "ko": "첫 번째로 살펴볼 예술가는 Bill Traylor이다."}, {"n": 7, "mk": "Traylor was [6|born into] slavery in the U.S. in 1853 and [6|spent his early life working] on a cotton farm in Alabama.", "en": "Traylor was born into slavery in the U.S. in 1853 and spent his early life working on a cotton farm in Alabama.", "ko": "Traylor는 1853년 미국에서 노예로 태어나 앨라배마의 목화 농장에서 일하며 어린 시절을 보냈다."}, {"n": 8, "mk": "[7|Although he became a free man] [7|after the American Civil War], he still had to face racial discrimination, [8|working for very low wages on the farm].", "en": "Although he became a free man after the American Civil War, he still had to face racial discrimination, working for very low wages on awing이 ‘그림으로 눈을 돌렸다’라는 뜻이다. 이때 to는 전치사라서 뒤에 drawing(그림 그리기)이 왔고, 뒤의 to express는 ‘표현하기 위해’(목적)라는 to부정사이다.", "n": ["turn to ~ = ① ~로 눈을 돌리다 ② ~로 변하다 ③ ~에게 의지하다", "turned to drawing to express ~ = ~을 표현하려고 그림으로 눈을 돌렸다"], "q": "turned to drawing에서 turn to의 뜻은?", "a": "~로 눈을 돌리다 (그림으로 눈을 돌렸다). to는 전치사라서 drawing이 왔다.", "p": "turned to"}]}, {"no": 2, "id": "z2", "sents": [{"n": 11, "mk": "Now, we're going to look at some of his paintings, starting with Mean Dog and Man and Large Dog.", "en": "Now, we're going to look at some of his paintings, starting with Mean Dog and Man and Large Dog.", "ko": "이제 〈비열한 개〉와 〈남자와 큰 개〉를 시작으로 그의 그림 몇 점을 살펴보겠다."}, {"n": 12, "mk": "Traylor had a strong fear of dogs [1|because] [2|they] [3|had often been used on farms to watch and hunt slaves].", "en": "Traylor had a strong fear of dogs because they had often been used on farms to watch and hunt slaves.", "ko": "Traylor는 개가 농장에서 노예를 감시하고 사냥하는 데 자주 사용되었기 때문에 개에 대한 두려움이 컸다."}, {"n": 13, "mk": "[4|His fear of dogs is expressed] strongly in these pieces.", "en": "His fear of dogs is expressed strongly in these pieces.", "ko": "이 작품들에는 개에 대한 그의 두려움이 강하게 표현되어 있다."}, {"n": 14, "mk": "[5|In contrast], Woman with Purse and Man with Umbrella portrays the free lives of African Americans that he observed on the streets of Montgomery.", "en": "In contrast, Woman with Purse and Man with Umbrella portrays the free lives of African Americans that he observed on the streets of Montgomery.", "ko": "이와 대조적으로 〈핸드백을 든 여인과 우산을 든 남자〉는 몽고메리 거리에서 그가 관찰한 아프리카계 미국인의 자유로운 삶을 묘사한다."}, {"n": 15, "mk": "[6|Using simple shapes and colors], Traylor captured complex moments in American history from slavery to freedom.", "en": "Using simple shapes and colors, Traylor captured complex moments in American history from slavery to freedom.", "ko": "Traylor는 단순한 형태와 색채를 사용하여 노예 제도에서 자유에 이르는 미국 역사의 복잡한 순간을 포착했다."}, {"n": 16, "mk": "[5|As a result], he's now [7|considered an important figure] in American folk art.", "en": "As a result, he's now considered an important figure in American folk art.", "ko": "그 결과, 그는 현재 미국 민속 예술의 중요한 인물로 여겨지고 있다."}, {"n": 17, "mk": "Next, we have Maud Lewis, a [8|renowned] artist [8|known for] her heart-warming paintings.", "en": "Next, we have Maud Lewis, a renowned artist known for her heart-warming paintings.", "ko": "다음은 마음이 따뜻해지는 그림으로 알려진, 유명 예술가 Maud Lewis이다."}, {"n": 18, "mk": "[9|Born in a small Canadian town in 1903], Lewis [10|suffered from] physical weaknesses [10|such as] distorted shoulders and fingers.", "en": "Born in a small Canadian town in 1903, Lewis suffered from physical weaknesses such as distorted shoulders and fingers.", "ko": "1903년 캐나다의 작은 마을에서 태어난 Lewis는 기형적인 어깨와 손가락과 같은 신체적 약점으로 고통받았다."}, {"n": 19, "mk": "[11|This] limited her mobility and [12|caused her to drop out of school].", "en": "This limited her mobility and caused her to drop out of school.", "ko": "이것은 그녀의 이동성을 제한했고 그녀가 학교를 중퇴하도록 만들었다."}, {"n": 20, "mk": "To make a living, she began to paint and sell Christmas cards.", "en": "To make a living, she began to paint and sell Christmas cards.", "ko": "생계를 위해 그녀는 크리스마스카드를 그려서 팔기 시작했다."}, {"n": 21, "mk": "When her parents passed away, Lewis went to live with her aunt in Digby, Nova Scotia, [13|where she met her future husband], Everett Lewis.", "en": "When her parents passed away, Lewis went to live with her aunt in Digby, Nova Scotia, where she met her future husband, Everett Lewis.", "ko": "부모님이 돌아가신 후 Lewis는 이모와 함께 살기 위해 노바스코샤주 딕비로 갔고, 그곳에서 미래의 남편인 Everett Lewis를 만났다."}, {"n": 22, "mk": "[14|After marrying], the couple spent the rest of their lives there, and Lewis continued to paint.", "en": "After marrying, the couple spent the rest of their lives there, and Lewis continued to paint.", "ko": "결혼 후 부부는 여생을 그곳에서 보냈고 Lewis는 계속해서 그림을 그렸다."}], "items": [{"t": "접속사 because + 절 : ~ 때문에", "c": "k", "x": "because(~ 때문에)는 접속사라서 뒤에 they had often been used처럼 주어와 동사가 있는 절이 온다. 명사만 올 때는 because of나 due to를 쓴다. 이 문장은 ‘개가 노예를 감시하고 사냥하는 데 자주 쓰였기 때문에’ 두려움이 컸다는 이유를 말한다.", "n": ["because + 주어 + 동사 = ~ 때문에", "because of / due to + 명사(구) = ~ 때문에"], "q": "because 뒤에는 어떤 모양이 오는가? 명사만 올 때는 무엇을 쓰는가?", "a": "주어 + 동사가 있는 절. 명사(구)만 오면 because of / due to를 쓴다.", "p": "because"}, {"t": "they = dogs (개들)", "c": "o", "x": "because they had ...의 they는 바로 앞의 dogs(개들)를 가리킨다. 사람이 아니라 ‘개들’이 농장에서 이용됐다는 뜻이다.", "n": ["they = dogs", "대명사 → 앞에서 누구(무엇)인지 찾기"], "q": "because they had often been used의 they는 누구(무엇)인가?", "a": "개들 (dogs)", "p": "they"}, {"t": "had been used : 과거완료 수동태 · be used + to부정사", "c": "b", "x": "had been used는 had + been + p.p.로 ‘(그전부터) 이용되어 왔다’라는 뜻이다. 두려움을 느낀 때보다 더 이전의 일이라서 과거완료를 쓴다. used to watch and hunt는 ‘감시하고 사냥하는 데 사용되었다’라는 뜻이다. (be used to + -ing는 ‘~에 익숙하다’로 뜻이 다르다.)", "n": ["had been p.p. = (그전부터) ~되어 왔다 (과거완료 수동태)", "be used + to부정사 = ~하는 데 사용되다"], "q": "had often been used는 어떤 시제이고 무슨 뜻인가?", "a": "과거완료 수동태 — (그전부터) 자주 이용되어 왔다", "p": "had often been used on farms to watch and hunt slaves"}, {"t": "수동태 + 수일치 : His fear ... is expressed", "c": "b", "x": "His fear of dogs is expressed에서 주어는 fear(두려움, 단수)라서 동사가 is이다. of dogs는 fear를 꾸미는 말이라서 dogs(복수)를 보고 are를 쓰면 안 된다. 두려움은 ‘표현되는’ 쪽이라서 is expressed(표현된다)처럼 be동사 + 과거분사의 수동태이다.", "n": ["주어 찾기: 수식어(of dogs)를 건너뛰고 fear", "be동사 + p.p. = ~되다 (수동태)"], "q": "His fear of dogs ___ expressed strongly에서 is/are 중 무엇이고 왜인가?", "a": "is — 주어가 단수 fear이고 of dogs는 수식어이다.", "p": "His fear of dogs is expressed"}, {"t": "In contrast · As a result", "c": "g", "x": "In contrast는 ‘이와 대조적으로, 그에 반해서’(=By contrast)이다. 앞 내용과 반대되는 내용이 이어질 때 쓴다. As a result는 ‘그 결과’라는 뜻이다. 앞의 일이 원인일 때 결과를 이끈다.", "n": ["in contrast = 그에 반해서, 이와 대조적으로", "as a result = 그 결과"], "q": "In contrast와 As a result는 각각 무슨 뜻인가?", "a": "In contrast = 이와 대조적으로 / As a result = 그 결과", "p": "In contrast … As a result"}, {"t": "분사구문 Using ~ : ~을 사용하여", "c": "b", "x": "Using simple shapes and colors, Traylor captured ...는 ‘단순한 형태와 색채를 사용하여, Traylor는 ... 포착했다’라는 뜻이다. As he used ...(그가 ~을 사용했기 때문에)에서 접속사와 주어를 빼고 -ing를 붙인 분사구문이다. 주어가 주절과 같은 Traylor라서 생략된다. from slavery to freedom은 ‘노예 제도에서 자유까지’(from A to B)이다.", "n": ["Using ~, 주어 + 동사 = ~을 사용하여, …했다", "from A to B = A에서 B까지"], "q": "Using simple shapes and colors의 의미상 주어는 누구인가?", "a": "Traylor (주절의 주어와 같아서 생략)", "p": "Using simple shapes and colors"}, {"t": "A be considered (as[to be]) B : A가 B로 여겨진다", "c": "b", "x": "he's now considered an important figure에서 he's는 he is이다. be considered B는 ‘B로 여겨지다’라는 수동태이다. consider A (as[to be]) B(A를 B로 여기다)를 수동으로 바꾼 모양이다. figure는 여기서 ‘인물’이고, ‘수치, 숫자’라는 뜻도 있다.", "n": ["A be considered (as[to be]) B = A가 B로 여겨지다", "figure = ① 인물 ② 수치·통계 ③ 숫자"], "q": "he's now considered an important figure는 무슨 뜻인가?", "a": "그는 이제 중요한 인물로 여겨진다 (be considered B)", "p": "considered an important figure"}, {"t": "renowned · known for ~", "c": "g", "x": "renowned는 ‘유명한’이에요(=famous). known for ~는 ‘~로 유명한, 알려진’라는 뜻이다. known for her heart-warming paintings는 앞의 artist를 뒤에서 꾸민다. ‘마음이 따뜻해지는 그림으로 알려진 예술가’처럼 뒤에서 앞으로 해석한다.", "n": ["renowned = 유명한", "known for ~ = ~로 유명한 (뒤에서 명사를 꾸밈)"], "q": "a renowned artist known for her heart-warming paintings는 어떻게 해석하는가?", "a": "마음이 따뜻해지는 그림으로 알려진 유명한 예술가", "p": "renowned … known for"}, {"t": "분사구문 Born ~ : ~에서 태어나서", "c": "b", "x": "Born in a small Canadian town in 1903, Lewis suffered ...는 ‘캐나다의 작은 마을에서 태어난 Lewis는 ... 고통받았다’라는 뜻이다. As she was born ...(그녀가 ~에서 태어났기 때문에)에서 접속사와 주어를 빼고 Being도 생략한 분사구문이다. Lewis는 ‘태어남을 당하는’ 쪽이라서 과거분사 Born을 쓴다.", "n": ["Born ~, 주어 + 동사 = ~에서 태어나서, …했다", "수동의 분사구문 → 과거분사"], "q": "Born in a small Canadian town에서 Born이 과거분사인 이유는?", "a": "Lewis가 ‘태어나진’ 수동의 뜻이라서 (As she was born ~의 줄임)", "p": "Born in a small Canadian town in 1903"}, {"t": "suffer from ~ · such as ~", "c": "g", "x": "suffer from ~은 ‘~에 시달리다, ~로 고통받다’라는 뜻이다. such as ~는 ‘~와 같은’이라는 뜻으로 예를 들 때 쓴다. physical weaknesses such as distorted shoulders and fingers는 ‘기형적인 어깨와 손가락과 같은 신체적 약점’라는 뜻이다. distorted는 ‘뒤틀린, 기형의’라는 뜻이다.", "n": ["suffer from ~ = ~로 고통받다", "such as ~ = ~와 같은 (예시)"], "q": "suffered from physical weaknesses such as ~는 어떻게 해석하는가?", "a": "~와 같은 신체적 약점으로 고통받았다", "p": "suffered from … such as"}, {"t": "This = 앞 문장의 내용", "c": "o", "x": "This limited her mobility에서 This는 바로 앞 문장의 내용 전체, 즉 Lewis가 기형적인 어깨와 손가락 같은 신체적 약점으로 고통받은 것을 가리킨다. 이렇게 앞 문장 전체를 받을 때도 This를 쓴다.", "n": ["This = 앞 문장의 내용 (신체적 약점으로 고통받은 것)", "This limited her mobility = 이것이 그녀의 이동성을 제한했다"], "q": "This limited her mobility에서 This는 무엇을 가리키는가?", "a": "앞 문장의 내용 — 기형적인 어깨와 손가락 같은 신체적 약점으로 고통받은 것", "p": "This"}, {"t": "cause + 목적어 + to부정사 : ~가 …하게 하다", "c": "b", "x": "caused her to drop out of school은 ‘그녀가 학교를 중퇴하게 만들었다’라는 뜻이다. cause + 목적어 + to + 동사원형은 ‘목적어가 …하게 하다(유발하다)’라는 뜻이다. drop out of ~는 ‘(학교)를 중퇴하다’라는 뜻이다.", "n": ["cause + 목적어 + to V = 목적어가 …하게 하다", "drop out of ~ = ~를 중퇴하다"], "q": "caused her to drop out of school에서 drop out of의 뜻과 문장 해석은?", "a": "drop out of = 중퇴하다 / 그녀가 학교를 중퇴하게 만들었다", "p": "caused her to drop out of school"}, {"t": ", where : 그리고 거기서", "c": "k", "x": "Digby, Nova Scotia, where she met her future husband에서 쉼표 뒤의 where는 ‘그리고 거기서(=and there)’라는 뜻이다. 선행사는 Digby, Nova Scotia이다. ‘딕비로 갔는데, 거기서 미래의 남편을 만났다’처럼 앞에서부터 해석한다. When her parents passed away의 pass away는 ‘세상을 떠나다’라는 뜻이다.", "n": [", where = and there (그리고 거기서)", "pass away = 세상을 떠나다"], "q": "Digby, Nova Scotia, where she met her future husband의 where는 무슨 뜻인가?", "a": "그리고 거기서 (=and there) — 딕비에서 미래의 남편을 만났다", "p": "where she met her future husband"}, {"t": "전치사 After + 동명사 : ~한 후에", "c": "k", "x": "After marrying, the couple spent ...는 ‘결혼한 후에 부부는 ... 보냈다’라는 뜻이다. After가 전치사로 쓰여서 뒤에 동명사 marrying이 왔다. 접속사로 쓰면 After they married(그들이 결혼한 후에)처럼 주어와 동사를 쓴다. (After를 접속사, marrying을 분사로 보는 설명도 있지만 전치사 + 동명사로 보는 것이 일반적이다.) the rest of their lives는 ‘여생’이고, there는 앞의 Digby를 가리킨다.", "n": ["After + -ing = ~한 후에 (전치사)", "After + 주어 + 동사 = ~한 후에 (접속사)"], "q": "After marrying에서 marrying이 -ing 모양인 이유는?", "a": "After가 전치사로 쓰여서 뒤에 동명사가 온다. (접속사면 After they married = 그들이 결혼한 후에)", "p": "After marrying"}]}, {"no": 3, "id": "z3", "sents": [{"n": 23, "mk": "She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor.", "en": "She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor.", "ko": "그녀는 〈딕비 항구의 가장자리〉와 같은 그림에서 딕비의 풍경을 자주 묘사했다."}, {"n": 24, "mk": "Her artwork used a mixture of bright and vivid oil paints and simple forms, [1|generating an original, innovative style].", "en": "Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style.", "ko": "그녀의 작품은 밝고 선명한 유화물감의 혼합과 단순한 형태를 사용하여 독창적이고 혁신적인 스타일을 만들어 냈다."}, {"n": 25, "mk": "[2|Although] her physical limitations [3|confined her to] a small cottage, her talent and imagination were both limitless.", "en": "Although her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "ko": "비록 신체적 제약들은 그녀를 작은 오두막집에 가두었지만 그녀의 재능과 상상력은 둘 다 무한했다."}, {"n": 26, "mk": "In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field.", "en": "In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field.", "ko": "〈빨간 썰매〉에는 붉은 단풍잎이 특별한 겨울 풍경에 등장하고, 〈한 쌍의 소〉에는 꽃밭에 서 있는 장식된 소들을 보여 준다."}, {"n": 27, "mk": "With these features, Lewis' paintings create a magical quality, like [4|that] of a fairy tale.", "en": "With these features, Lewis' paintings create a magical quality, like that of a fairy tale.", "ko": "이러한 특징을 통해 Lewis의 그림은 마치 동화의 그것과 같은, 마법 같은 특성을 만들어 낸다."}, {"n": 28, "mk": "[5|As] her paintings gradually gained popularity, her story inspired many people and was later [6|made into] books and movies.", "en": "As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies.", "ko": "그녀의 그림이 점차 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고 나중에 책과 영화로 만들어졌다."}, {"n": 29, "mk": "Maud Lewis expressed her love for the world through her paintings and became an iconic figure in Canadian folk art.", "en": "Maud Lewis expressed her love for the world through her paintings and became an iconic figure in Canadian folk art.", "ko": "Maud Lewis는 그림을 통해 세상에 대한 사랑을 표현했고 캐나다 민속 예술의 상징적인 인물이 되었다."}, {"n": 30, "mk": "Now let's take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark.", "en": "Now let's take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark.", "ko": "이제 이번 전시의 마지막 예술가, 덴마크 출신의 유명 화가 Anna Ancher를 살펴보자."}, {"n": 31, "mk": "[7|When observing] her paintings, you may notice a common theme —[8|they] all feature female figures.", "en": "When observing her paintings, you may notice a common theme —they all feature female figures.", "ko": "그녀의 그림을 보면 여러분은 공통적인 주제를 알아차릴지도 모르는데, 그건 바로 그림에 모두 여성 인물이 등장한다는 점이다."}, {"n": 32, "mk": "Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school.", "en": "Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school.", "ko": "1859년 덴마크 스카겐에서 태어난 그녀는 나중에 사립 회화 학교에 다니기 위해 코펜하겐으로 이주했다."}, {"n": 33, "mk": "After that, she even studied abroad in Paris, [9|which was unusual for women at the time].", "en": "After that, she even studied abroad in Paris, which was unusual for women at the time.", "ko": "그 후 그녀는 파리에서 유학까지 했는데, 그것은 당시 여성들에게 드문 일이었다."}, {"n": 34, "mk": "[10|Thanks to] her mother's encouragement, she [10|was able to] take advantage of these opportunities.", "en": "Thanks to her mother's encouragement, she was able to take advantage of these opportunities.", "ko": "어머니의 격려 덕분에 그녀는 이러한 기회를 활용할 수 있었다."}, {"n": 35, "mk": "[11|Even after getting married], Ancher [12|persisted in] painting, [12|objecting to] the social pressure [13|that] married women [14|were to solely focus] on household duties.", "en": "Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties.", "ko": "결혼 후에도 Ancher는 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며 그림을 계속 그렸다."}], "items": [{"t": "분사구문 generating ~ : 그래서 …을 만들어 냈다", "c": "b", "x": "..., generating an original, innovative style은 앞 절의 결과를 덧붙이는 분사구문이다. and it generated an original, innovative style(그리고 그것이 독창적이고 혁신적인 스타일을 만들어 냈다)로 풀어 쓸 수 있다. original은 ‘독창적인’, innovative는 ‘혁신적인’라는 뜻이다.", "n": ["…, 동사ing = 그리고 …했다 (결과의 분사구문)", "= and it generated ~"], "q": "..., generating an original, innovative style을 접속사를 써서 풀어 쓰면?", "a": "and it generated an original, innovative style (그리고 독창적이고 혁신적인 스타일을 만들어 냈다)", "p": "generating an original, innovative style"}, {"t": "접속사 Although + 절 : 비록 ~이지만", "c": "k", "x": "Although her physical limitations confined her to a small cottage는 ‘비록 신체적 제약들이 그녀를 작은 오두막집에 가두었지만’라는 뜻이다. Although 뒤에 주어(her physical limitations)와 동사(confined)가 있으니 접속사 용법이다. 같은 뜻의 전치사 Despite를 쓰려면 Despite her physical limitations(신체적 제약에도 불구하고)처럼 명사구만 써야 한다.", "n": ["Although + 주어 + 동사 = 비록 ~이지만", "Despite + 명사(구) = ~에도 불구하고"], "q": "Although her physical limitations confined her ~를 Despite로 바꾸면?", "a": "Despite her physical limitations(신체적 제약에도 불구하고), ~ — 명사구만 쓰고 동사 confined는 뺀다", "p": "Although"}, {"t": "confine A to B : A를 B에 가두다", "c": "g", "x": "confine A to B는 ‘A를 B에 가두다(한정하다)’라는 뜻이다. confined her to a small cottage는 ‘그녀를 작은 오두막집에 가두었다’라는 뜻이다. limitation은 ‘제약, 한계’라는 뜻의 명사이다.", "n": ["confine A to B = A를 B에 가두다·한정하다", "limitation = 제약, 한계"], "q": "limitations confined her to a small cottage는 어떻게 해석하는가?", "a": "제약들이 그녀를 작은 오두막집에 가두었다 (confine A to B)", "p": "confined her to"}, {"t": "that = a magical quality (마법 같은 특성)", "c": "o", "x": "like that of a fairy tale의 that은 앞에 나온 a magical quality(마법 같은 특성)를 가리킨다. 같은 명사를 또 쓰지 않으려고 that으로 받은 것이다. ‘동화의 (마법 같은) 특성처럼’라는 뜻이다. 여기서 like는 ‘~와 같은’이라는 전치사이다.", "n": ["that of ~ = the quality of ~ (앞 명사 반복 피하기)", "that = a magical quality (마법 같은 특성)"], "q": "like that of a fairy tale에서 that은 무엇을 대신하는가?", "a": "앞의 a magical quality (마법 같은 특성)", "p": "that"}, {"t": "접속사 as : ~함에 따라", "c": "k", "x": "As her paintings gradually gained popularity에서 As는 ‘~함에 따라, ~하면서’라는 뜻이다. as는 뜻이 많아서 문장에서 구별해야 한다. ① ~할 때, ~함에 따라 ② ~처럼 ③ ~한 대로 ④ ~ 때문에. 여기서는 ‘점점 인기를 얻으면서’라는 뜻이다.", "n": ["as + 주어 + 동사 = ~함에 따라 (점차 변화)", "as의 뜻: 때·비례 / 양태(~처럼) / 상태 / 이유"], "q": "As her paintings gradually gained popularity의 As는 어떤 뜻인가?", "a": "~함에 따라, ~하면서 (그림이 점점 인기를 얻으면서)", "p": "As"}, {"t": "A be made into B : A가 B로 만들어지다", "c": "b", "x": "her story ... was later made into books and movies에서 A be made into B는 ‘A가 B로 만들어지다’라는 뜻이다. 주어 her story가 책과 영화로 ‘만들어진’ 쪽이라서 수동태이다. inspired many people과 was later made ...는 and로 이어진 두 동사예요(주어 her story가 같다).", "n": ["A be made into B = A가 B로 만들어지다", "inspired ~ and was made ~ (동사 병렬)"], "q": "her story was later made into books and movies는 무슨 뜻인가?", "a": "그녀의 이야기는 나중에 책과 영화로 만들어졌다", "p": "made into"}, {"t": "접속사가 남은 분사구문 : When observing ~", "c": "b", "x": "When observing her paintings, you may notice ...는 When you observe her paintings(여러분이 그녀의 그림을 볼 때)에서 주어(you)를 빼고 접속사 When을 남긴 분사구문이다. 접속사를 남기면 뜻(~할 때)이 더 분분명해진다. 의미상 주어는 주절의 you이다. may notice는 ‘알아차릴지도 모른다’라는 뜻이다.", "n": ["접속사 + -ing = 접속사 + 주어 + 동사의 줄임", "When observing ~ = When you observe ~ (~를 볼 때)"], "q": "When observing her paintings는 어떤 절을 줄인 것인가?", "a": "When you observe her paintings (여러분이 그녀의 그림을 볼 때)", "p": "When observing"}, {"t": "they = her paintings (그녀의 그림들)", "c": "o", "x": "they all feature female figures의 they는 her paintings(그녀의 그림들)를 가리킨다. all은 ‘모두’라는 뜻이라서 ‘그림 모두가 여성 인물을 특징으로 한다’라는 뜻이다. feature는 여기서 ‘~을 특징으로 하다, 보여주다’라는 동사이다.", "n": ["they = her paintings (그녀의 그림들)", "feature = ① 특징 ② ~을 특징으로 하다(동사)"], "q": "they all feature female figures에서 they는 무엇인가?", "a": "그녀(Anna Ancher)의 그림들 (her paintings)", "p": "they"}, {"t": ", which : 앞 절 전체를 받는 관계사", "c": "k", "x": "studied abroad in Paris, which was unusual ...에서 쉼표 뒤의 which는 앞 절 전체(파리에서 유학한 일)를 가리킨다. ‘그것은 당시 여성들에게 드문 일이었다’라고 해석한다. 그래서 동사도 단수 was이다. 쉼표 뒤(계속적 용법)에는 that을 쓸 수 없고 which를 쓴다.", "n": [", which = and it[this/that] (앞 절 전체)", "계속적 용법에는 that을 쓸 수 없음"], "q": "which was unusual for women at the time의 which는 무엇을 가리키는가?", "a": "앞 절 전체 — 그녀가 파리에서 유학한 일", "p": "which was unusual for women at the time"}, {"t": "Thanks to ~ · was able to + 동사원형", "c": "k", "x": "Thanks to her mother's encouragement는 ‘어머니의 격려 덕분에’라는 뜻이다. Thanks to ~(=because of ~)는 to가 전치사라서 뒤에 명사(구)가 온다. was able to take advantage of ...는 ‘~을 이용할 수 있었다’라는 뜻이다. was able to + 동사원형은 ‘~할 수 있었다’, take advantage of ~는 ‘~을 이용하다’라는 뜻이다.", "n": ["Thanks to + 명사(구) = ~ 덕분에", "was able to + 동사원형 = ~할 수 있었다"], "q": "Thanks to her mother's encouragement의 뜻과 뒤에 오는 말의 모양은?", "a": "어머니의 격려 덕분에 / Thanks to가 전치사 역할을 해서 뒤에 명사(구)가 온다", "p": "Thanks to … was able to"}, {"t": "Even after + -ing : 심지어 ~한 후에도 · get married", "c": "k", "x": "Even after getting married는 ‘심지어 결혼한 후에도’라는 뜻이다. after가 전치사로 쓰여서 뒤에 동명사 getting이 왔다. get married(= be married)는 ‘결혼하다’라는 뜻이다. 앞의 After marrying처럼 after + -ing 모양이다.", "n": ["Even after + -ing = 심지어 ~한 후에도 (전치사)", "get married = 결혼하다"], "q": "Even after getting married에서 getting이 -ing 모양인 이유는?", "a": "after가 전치사로 쓰여서 뒤에 동명사가 온다. (심지어 결혼한 후에도)", "p": "Even after getting married"}, {"t": "persist in ~ · object to ~", "c": "g", "x": "persist in ~은 ‘~을 끈질기게 계속하다’라는 뜻이다. in은 전치사라서 persisted in painting처럼 뒤에 동명사가 온다. object to ~는 ‘~에 반대하다’이고 이때도 to는 전치사라서 the social pressure(사회적 압력)가 왔다. objecting은 ‘반대하면서’라는 분사구문이다.", "n": ["persist in + -ing = ~을 끈질기게 계속하다", "object to + 명사 = ~에 반대하다 (to는 전치사)"], "q": "persisted in painting, objecting to ~는 어떻게 해석하는가?", "a": "~에 반대하며 그림을 계속 그렸다 (persist in -ing, object to ~)", "p": "persisted in … objecting to"}, {"t": "동격의 that : ~라는", "c": "b", "x": "the social pressure that married women were to solely focus ...에서 that은 pressure의 내용을 설명하는 동격의 that이다. ‘기혼 여성은 가사에만 집중해야 한다는 사회적 압력’이라고 해석한다. 동격의 that 뒤에는 주어와 동사가 모두 있는 완전한 절이 온다. (관계대명사 that 뒤에는 빠진 자리가 있다.)", "n": ["명사 + that + 완전한 절 = ~라는 (동격)", "pressure that married women were to ~ = ~해야 한다는 function refOf(t){var r=t.split(' = ')[1]||'',q=r.match(/\(([^)]*)\)\s*$/);return q?q[1]:r}
function marks(mk,s,mode,only,sn){
  /* mode: 'all' 모든 칠하기(누르면 해설로) / 'color' 한 색만 / 'item' 한 항목만 */
  var out='',pos=0,re=/\[(\d+)\|([^\]]*)\]/g,m;

    else if(mode=='item'&&i==only)out+='<span class="hl c-'+c+'">'+t+'</span>';
    else out+=t;
    pos=re.lastIndex}
  return out+esc(mk.slice(pos))}
