"id": "ctx2", "kind": "ctx", "n": 2, "title": null, "tko": null, "paras": [[{"t": "Bill Traylor The first artist we’re going to "}, {"t": "examine", "c": 1}, {"t": " is Bill Traylor. Traylor was born into slavery in the U.S. in 1853 and spent his early life working on a cotton farm in Alabama. Although he became a free man after the American Civil War, he still had to "}, {"t": "face", "c": 2}, {"t": " racial discrimination, working for very "}, {"t": "high", "c": 3}, {"t": " wages on the farm. Later, when he was around 70 years old, Traylor moved to the city of Montgomery, Alabama, where he found a job in a factory. It wasn’t until he was 85 years old and became too "}, {"t": "well", "c": 4}, {"t": " to work that he turned to drawing to express his life experiences. Now, we’re going to look at some of his paintings, starting with Mean Dog and Man and Large Dog. Traylor had a "}, {"t": "strong", "c": 5}, {"t": " fear of dogs because they had often been used on farms to watch and hunt slaves. His fear of dogs is expressed strongly in these pieces. In contrast, Woman with Purse and Man with Umbrella portrays the free lives of African Americans that he observed on the streets of Montgomery. Using simple shapes and colors, Traylor captured "}, {"t": "simple", "c": 6}, {"t": " moments in American history from slavery to freedom. As a result, he’s now considered an "}, {"t": "important", "c": 7}, {"t": " figure in American folk art."}]], "items": [{"c": 3, "w": "high", "r": "low", "gw": "높은", "gr": "낮은", "fb": null, "fg": "Although he became a free man after the American Civil War, he still had to face racial discrimination, working for very <span class=\"d\">low</span> wages on the farm.", "ko": "그는 미국 남북전쟁 이후 자유의 몸이 되었지만, 농장에서 매우 낮은 임금을 받고 일하며 여전히 인종차별에 직면해야 했다.", "why": "앞에서 노예로 태어나 고생했고, 자유의 몸이 된 뒤에도 still had to face racial discrimination (여전히 인종차별에 직면해야 했다)고 해요. 이 힘든 흐름에서 농장 임금도 very low wages (아주 낮은 임금)여야 맞아요. high (높은)는 좋은 대우라서 앞뒤와 안 맞아요."}, {"c": 4, "w": "well", "r": "ill", "gw": "건강한", "gr": "아픈", "fb": null, "fg": "It wasn't until he was 85 years old and became too <span class=\"d\">ill</span> to work that he turned to drawing to express his life experiences.", "ko": "85세가 되고 몸이 너무 아파서 일을 할 수 없게 된 후에야 그는 자신의 인생 경험을 표현하기 위해 그림으로 눈을 돌렸다.", "why": "'85세가 되고 너무 ~해서 일을 할 수 없게 된 후에야 그림으로 눈을 돌렸다'는 문장이에요. too ~ to work (너무 ~해서 일할 수 없는)에는 일을 못 할 이유가 와야 하니 ill (아픈)이 맞아요. well (건강한)이면 일을 할 수 있다는 뜻이 되어 too ~ to와 충돌해요."}, {"c": 6, "w": "simple", "r": "complex", "gw": "단순한", "gr": "복잡한", "fb": null, "fg": "Using simple shapes and colors, Traylor captured <span class=\"d\">complex</span> moments in American history from slavery to freedom.", "ko": "Traylor는 단순한 형태와 색채를 사용하여 노예 제도에서 자유에 이르는 미국 역사의 복잡한 순간을 포착했다.", "why": "앞에 Using simple shapes and colors (단순한 형태와 색채를 사용하여)가 있어요. 그런데 포착한 것이 slavery to freedom (노예 제도에서 자유까지)라는 큰 역사의 순간이니, 단순한 도구로 복잡한 순간을 담았다는 대비가 자연스러워요. simple moments (단순한 순간)이면 '단순한 걸로 단순한 걸 그렸다'가 되어 의미가 약해져요."}], "keep": "examine (살펴보다)은 '이제 이 예술가를 살펴보겠다'는 안내라 맞아요. face (직면하다)는 racial discrimination (인종차별)과 어울려요. strong (강한)은 fear (두려움)를 꾸미고, important (중요한)는 마지막 평가 문장에 알맞아요.", "flow": "Bill Traylor (빌 트레일러)가 노예로 태어나 어렵게 살다가 늦게 그림을 시작한 이야기예요. 힘든 삶을 말하는 부분인지, 나중에 인정받는 부분인지 나눠서 읽으면 어색한 말이 보여요.", "ko": "첫 번째로 살펴볼 예술가는 Bill Traylor이다. Traylor는 1853년 미국에서 노예로 태어나 앨라배마의 목화 농장에서 일하며 어린 시절을 보냈다. 그는 미국 남북전쟁 이후 자유의 몸이 되었지만, 농장에서 매우 낮은 임금을 받고 일하며 여전히 인종차별에 직면해야 했다. 이후 70세 무렵에, Traylor는 앨라배마주 몽고메리시로 이주하여 공장에서 일자리를 얻었다. 85세가 되고 몸이 너무 아파서 일을 할 수 없게 된 후에야 그는 자신의 인생 경험을 표현하기 위해 그림으로 눈을 돌렸다. 이제 〈비열한 개〉와 〈남자와 큰 개〉를 시작으로 그의 그림 몇 점을 살펴보겠다. Traylor는 개가 농장에서 노예를 감시하고 사냥하는 데 자주 사용되었기 때문에 개에 대한 두려움이 컸다. 이 작품들에는 개에 대한 그의 두려움이 강하게 표현되어 있다. 이와 대조적으로 〈핸드백을 든 여인과 우산을 든 남자〉는 몽고메리 거리에서 그가 관찰한 아프리카계 미국인의 자유로운 삶을 묘사한다. Traylor는 단순한 형태와 색채를 사용하여 노예 제도에서 자유에 이르는 미국 역사의 복잡한 순간을 포착했다. 그 결과, 그는 현재 미국 민속 예술의 중요한 인물로 여겨지고 있다."}, {"id": "ctx3", "kind": "ctx", "n": 3, "title": null, "tko": null, "paras": [[{"t": "Maud Lewis  Next, we have Maud Lewis, a "}, {"t": "renowned", "c": 1}, {"t": " artist known for her heart-warming paintings. Born in a small Canadian town in 1903, Lewis suffered from "}, {"t": "mental", "c": 2}, {"t": " weaknesses such as distorted shoulders and fingers. This "}, {"t": "limited", "c": 3}, {"t": " her mobility and caused her to drop out of school. To make a living, she began to paint and sell Christmas cards. When her parents passed away, Lewis went to live with her aunt in Digby, Nova Scotia, where she met her future husband, Everett Lewis. After marrying, the couple spent the rest of their lives there, and Lewis continued to paint. She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor. Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, "}, {"t": "conventional", "c": 4}, {"t": " style. Although her physical limitations confined her to a small cottage, her talent and imagination were both "}, {"t": "limited", "c": 5}, {"t": ". In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field. With these features, Lewis’ paintings create a magical quality, like that of a fairy tale. As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies. Maud Lewis expressed her love for the world through her paintings and became an "}, {"t": "iconic", "c": 6}, {"t": " figure in Canadian folk art."}]], "items": [{"c": 2, "w": "mental", "r": "physical", "gw": "정신적인", "gr": "신체적인", "fb": null, "fg": "Born in a small Canadian town in 1903, Lewis suffered from <span class=\"d\">physical</span> weaknesses such as distorted shoulders and fingers.", "ko": "1903년 캐나다의 작은 마을에서 태어난 Lewis는 기형적인 어깨와 손가락과 같은 신체적 약점으로 고통받았다.", "why": "뒤에 such as distorted shoulders and fingers (기형적인 어깨와 손가락 같은)가 나와요. 어깨와 손가락은 몸이니까 physical (신체적인)이 맞아요. 또 다음 문장 This limited her mobility (이것이 이동성을 제한했다)도 몸의 이야기이고, 아래의 physical limitations (신체적 제약)와도 이어져요."}, {"c": 4, "w": "conventional", "r": "innovative", "gw": "전통적인", "gr": "혁신적인", "fb": null, "fg": "Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, <span class=\"d\">innovative</span> style.", "ko": "그녀의 작품은 밝고 선명한 유화물감의 혼합과 단순한 형태를 사용하여 독창적이고 혁신적인 스타일을 만들어 냈다.", "why": "밝고 선명한 유화물감과 단순한 형태로 만든 스타일이니 original (독창적인)과 짝을 이루는 innovative (혁신적인)가 맞아요. conventional (전통적인)은 original과 뜻이 반대라서 an original, conventional style (독창적이고 전통적인 스타일)이 되어 어색해요."}, {"c": 5, "w": "limited", "r": "limitless", "gw": "제한된", "gr": "무한한", "fb": null, "fg": "Although her physical limitations confined her to a small cottage, her talent and imagination were both <span class=\"d\">limitless</span>.", "ko": "비록 신체적 제약들은 그녀를 작은 오두막집에 가두었지만 그녀의 재능과 상상력은 둘 다 무한했다.", "why": "Although (비록 ~이지만)로 시작하니 뒤는 앞과 반대가 되어야 해요. 몸은 작은 오두막에 갇혀 있었지만(physical limitations (신체적 제약)) 재능과 상상력은 limitless (한계가 없는)였다는 대비가 되어야 해요. limited (제한된)를 쓰면 앞뒤가 같은 방향이 되어 Although가 어색해져요."}], "keep": "renowned (유명한)는 뒤의 known for (~로 알려진)와 같은 뜻이라 맞아요. 앞쪽(첫 번째)의 limited (제한했다)는 'This limited her mobility (이것이 이동성을 제한했다)'라서 정상이에요. iconic (상징적인)은 마지막의 '캐나다 민속 예술의 대표 인물'과 잘 맞아요.", "flow": "Maud Lewis (모드 루이스)는 몸이 불편했지만 밝고 독창적인 그림으로 사랑받은 화가예요. '몸의 한계'와 '마음과 재능의 한계 없음'이 대비되는 글이라, 한계를 말하는 곳과 자유를 말하는 곳을 구분하면 돼요.", "ko": "다음은 마음이 따뜻해지는 그림으로 알려진, 유명 예술가 Maud Lewis이다. 1903년 캐나다의 작은 마을에서 태어난 Lewis는 기형적인 어깨와 손가락과 같은 신체적 약점으로 고통받았다. 이것은 그녀의 이동성을 제한했고 그녀가 학교를 중퇴하도록 만들었다. 생계를 위해 그녀는 크리스마스카드를 그려서 팔기 시작했다. 부모님이 돌아가신 후 Lewis는 이모와 함께 살기 위해 노바스코샤주 딕비로 갔고, 그곳에서 미래의 남편인 Everett Lewis를 만났다. 결혼 후 부부는 여생을 그곳에서 보냈고 Lewis는 계속해서 그림을 그렸다. 그녀는 〈딕비 항구의 가장자리〉와 같은 그림에서 딕비의 풍경을 자주 묘사했다. 그녀의 작품은 밝고 선명한 유화물감의 혼합과 단순한 형태를 사용하여 독창적이고 혁신적인 스타일을 만들어 냈다. 비록 신체적 제약들은 그녀를 작은 오두막집에 가두었지만 그녀의 재능과 상상력은 둘 다 무한했다. 〈빨간 썰매〉에는 붉은 단풍잎이 특별한 겨울 풍경에 등장하고, 〈한 쌍의 소〉에는 꽃밭에 서 있는 장식된 소들을 보여 준다. 이러한 특징을 통해 Lewis의 그림은 마치 동화의 그것과 같은, 마법 같은 특성을 만들어 낸다. 그녀의 그림이 점차 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고 나중에 책과 영화로 만들어졌다. Maud Lewis는 그림을 통해 세상에 대한 사랑을 표현했고 캐나다 민속 예술의 상징적인 인물이 되었다."}, {"id": "ctx4", "kind": "ctx", "n": 4, "title": null, "tko": null, "paras": [[{"t": "Anna Ancher  Now let’s take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark. When observing her paintings, you may notice a common theme—they all feature female figures. Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school. After that, she even studied abroad in Paris, which was unusual for women at the time. Thanks to her mother’s "}, {"t": "discouragement", "c": 1}, {"t": ", she was able to take advantage of these opportunities. Even after getting married, Ancher persisted in painting, "}, {"t": "objecting", "c": 2}, {"t": " to the social pressure that married women were to solely focus on household duties. Ancher "}, {"t": "differed", "c": 3}, {"t": " from other artists of that era, who depicted women as still life subjects. In contrast, she showcased them as "}, {"t": "passive", "c": 4}, {"t": " participants in everyday tasks, as seen in her works The Maid in the Kitchen and Sewing Fisherman’s Wife. She also skillfully explored light and color, contributing to the rich Impressionist movement in Denmark. In her painting Sunlight in the Blue Room, the reflection of the sunlight on the blue wall is stunningly portrayed. Ancher "}, {"t": "accepted", "c": 5}, {"t": " the conventional roles of women in the 20th century and displayed her "}, {"t": "exceptional", "c": 6}, {"t": " artistic talent. Her paintings continue to amaze us to this day."}], [{"t": "Thank you for joining this guided tour, and I hope my explanations have aided you in appreciating these paintings. Please take some time to further explore the exhibition."}]], "items": [{"c": 1, "w": "discouragement", "r": "encouragement", "gw": "낙담시킴(말림)", "gr": "격려", "fb": null, "fg": "Thanks to her mother's <span class=\"d\">encouragement</span>, she was able to take advantage of these opportunities.", "ko": "어머니의 격려 덕분에 그녀는 이러한 기회를 활용할 수 있었다.", "why": "뒤에 she was able to take advantage of these opportunities (이 기회들을 활용할 수 있었다)가 있어요. Thanks to (~덕분에)는 좋은 이유 앞에 쓰니 encouragement (격려)가 맞아요. discouragement (낙담시킴)이면 말리는 건데, 그 덕에 유학을 갔다는 말은 안 맞아요."}, {"c": 4, "w": "passive", "r": "active", "gw": "수동적인", "gr": "적극적인", "fb": null, "fg": "In contrast, she showcased them as <span class=\"d\">active</span> participants in everyday tasks, as seen in her works The Maid in the Kitchen and Sewing Fisherman's Wife.", "ko": "이와는 대조적으로, 〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉라는 작품에서 볼 수 있듯 그녀는 일상 작업의 적극적인 참여자로서의 여성을 보여 주었다.", "why": "앞 문장에서 다른 화가들은 여성을 still life subjects (정물화 소재)처럼 가만히 있는 대상으로 그렸다고 해요. 이어서 In contrast (이와 대조적으로)가 나오니 Ancher는 active (적극적인) 참여자로 보여 줘야 해요. passive (수동적인)이면 다른 화가들과 똑같아져서 대조가 사라져요."}, {"c": 5, "w": "accepted", "r": "challenged", "gw": "받아들였다", "gr": "이의를 제기했다(맞섰다)", "fb": null, "fg": "Ancher <span class=\"d\">challenged</span> the conventional roles of women in the 20th century and displayed her exceptional artistic talent.", "ko": "Ancher는 20세기 여성의 전통적인 역할에 이의를 제기하며 뛰어난 예술적 재능을 보여 주었다.", "why": "이 글은 편견에 맞선 Ancher의 이야기예요. 앞에서도 objecting to the social pressure (사회적 압력에 저항하며), In contrast (대조적으로)로 이어졌어요. 그러니 the conventional roles (전통적인 역할)를 challenged (이의를 제기했다)해야 맞아요. accepted (받아들였다)이면 지금까지의 흐름과 정반대예요."}], "keep": "objecting (반대하다)은 '사회적 압력에 맞서'라서 맞아요. differed (달랐다)는 뒤의 In contrast (이와 대조적으로)와 이어지고, exceptional (뛰어난)은 재능을 칭찬하는 말이라 자연스러워요.", "flow": "Anna Ancher (안나 앙케르)는 여성이 공부하기 어려운 시대에 유학까지 한 화가예요. 이 글은 '시대의 편견에 맞선 사람'이라는 흐름이라, 편견을 따르는 말이 나오면 어색해요.", "ko": "이제 이번 전시의 마지막 예술가, 덴마크 출신의 유명 화가 Anna Ancher를 살펴보자. 그녀의 그림을 보면 여러분은 공통적인 주제를 알아차릴지도 모르는데, 그건 바로 그림에 모두 여성 인물이 등장한다는 점이다. 1859년 덴마크 스카겐에서 태어난 그녀는 나중에 사립 회화 학교에 다니기 위해 코펜하겐으로 이주했다. 그 후 그녀는 파리에서 유학까지 했는데, 그것은 당시 여성들에게 드문 일이었다. 어머니의 격려 덕분에 그녀는 이러한 기회를 활용할 수 있었다. 결혼 후에도 Ancher는 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며 그림을 계속 그렸다. Ancher는 당시의 다른 예술가들과는 달랐는데, 그들은 여성을 정물화 소재로 묘사했다. 이와는 대조적으로, 〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉라는 작품에서 볼 수 있듯 그녀는 일상 작업의 적극적인 참여자로서의 여성을 보여 주었다. 또한 그녀는 빛과 색채를 능숙하게 탐구하여 덴마크의 풍부한 인상주의 운동에 기여했다. 그녀의 작품 〈푸른 방의 햇빛〉에서는 푸른 벽에 반사되는 햇빛이 굉장히 아름답게 묘사되어 있다. Ancher는 20세기 여성의 전통적인 역할에 이의를 제기하며 뛰어난 예술적 재능을 보여 주었다. 그녀의 그림은 오늘날까지도 우리를 놀라게 한다. 이번 가이드 투어에 참여해 주셔서 감사하며, 나의 설명이 여러분이 그림을 감상하는 데 도움이 되었기를 바란다. 잠시 시간을 내어 전시를 더 둘러보기 바란다."}, {"id": "gram1", "kind": "gram", "n": 1, "title": null, "tko": null, "paras": [[{"t": "Welcome to the Dream Art Gallery!", "c": 1}, {"t": " I’m Isabel Williams, the docent for the From Shadows to Spotlights exhibit. Today, "}, {"t": "you’re going to meet three amazing artists who never gave up on their art, though challenges in their lives", "c": 2}, {"t": ". "}, {"t": "Each artist has a unique painting style and story that have made their work highly valued.", "c": 3}, {"t": " "}, {"t": "Let’s explore each artist’s life and artwork", "c": 4}, {"t": "."}]], "items": [{"c": 2, "w": "though", "r": "despite", "gw": "(~이지만) 어려움이 그들의 삶에", "gr": "그들 삶의 어려움에도 불구하고", "fb": "you’re going to meet three amazing artists who never gave up on their art, <span class=\"d\">though</span> challenges in their lives.", "fg": "you’re going to meet three amazing artists who never gave up on their art, <span class=\"d\">despite</span> challenges in their lives.", "ko": "오늘은 인생의 역경에도 불구하고 결코 예술을 포기하지 않았던 세 명의 놀라운 예술가들을 만나 보려고 한다.", "why": "though (~이지만) 뒤에는 '주어 + 동사'가 있는 문장이 와야 해요. 그런데 뒤가 challenges in their lives (그들 삶의 어려움)라서 동사 없는 명사 덩어리예요. 이럴 때는 '~에도 불구하고'라는 뜻으로 명사를 받는 despite (~에도 불구하고)를 써요."}, {"c": 3, "w": "have", "r": "has", "gw": "이야기가 만들어 왔다 (복수 동사)", "gr": "이야기가 만들어 줬다 (단수 동사)", "fb": "Each artist has a unique painting style and story that <span class=\"d\">have</span> made their work highly valued.", "fg": "Each artist has a unique painting style and story that <span class=\"d\">has</span> made their work highly valued.", "ko": "각 예술가에게는 독특한 화풍과 그들의 작품을 높이 평가받게 만들어 준 이야기가 있다.", "why": "that has made (만들어 준)의 주어는 that이고, that은 앞의 a unique painting style and story (독특한 화풍과 이야기)를 가리켜요. 여기서 a가 하나만 붙어서 style and story (화풍과 이야기)를 한꺼번에 묶고 있어요. Each artist has (각 예술가는 가지고 있다)처럼 예술가 한 명마다 이 한 덩어리를 가진다는 뜻이라 단수 동사 has를 써요."}], "keep": "Welcome to the Dream Art Gallery! (드림 아트 갤러리에 오신 것을 환영합니다!)와 Let's explore each artist's life and artwork. (각 예술가의 삶과 작품을 함께 살펴봐요.)는 짧고 규칙에 맞아요.", "flow": "도슨트의 인사말이라 짧은 문장이 이어져요. 밑줄 친 네 문장 중 '~에도 불구하고'를 이어 주는 말과, 동사가 주어와 맞는지를 살펴보세요.", "ko": "드림 아트 갤러리에 오신 것을 환영한다! 나는 〈그림자에서 빛으로〉 전시회의 도슨트인 Isabel Williams이다. 오늘은 인생의 역경에도 불구하고 결코 예술을 포기하지 않았던 세 명의 놀라운 예술가들을 만나 보려고 한다. 각 예술가에게는 독특한 화풍과 그들의 작품을 높이 평가받게 만들어 준 이야기가 있다. 각 예술가의 삶과 작품을 함께 살펴보자."}, {"id": "gram2", "kind": "gram", "n": 2, "title": null, "tko": null, "paras": [[{"t": "Bill Traylor  The first artist we’re going to examine is Bill Traylor. "}, {"t": "Traylor was born into slavery in the U.S. in 1853 and spent his early life working on a cotton farm in Alabama.", "c": 1}, {"t": " "}, {"t": "Although he became a free man after the American Civil War, he still had to face racial discrimination, working for very low wages on the farm", "c": 2}, {"t": ". Later, when he was around 70 years old, "}, {"t": "Traylor moved to the city of Montgomery, Alabama, which he found a job in a factory.", "c": 3}, {"t": " "}, {"t": "It wasn’t until he was 85 years old and became too ill to work when he turned to drawing to express his life experiences.", "c": 4}, {"t": " Now, we’re going to look at some of his paintings, starting with Mean Dog and Man and Large Dog. "}, {"t": "Traylor had a strong fear of dogs because they had often used on farms to watch and hunt slaves.", "c": 5}, {"t": " His fear of dogs is expressed strongly in these pieces. In contrast, "}, {"t": "Woman", "c": 6}, {"t": " "}, {"t": "with", "c": 7}, {"t": " "}, {"t": "Purse", "c": 8}, {"t": " "}, {"t": "and", "c": 9}, {"t": " "}, {"t": "Man", "c": 10}, {"t": " "}, {"t": "with", "c": 11}, {"t": " "}, {"t": "Umbrella portrays the free lives of African Americans that he observed on the streets of Montgomery", "c": 12}, {"t": ". Using simple shapes and colors, Traylor captured complex moments in American history from slavery to freedom. As a result, he’s now considered an important figure in American folk art."}]], "items": [{"c": 3, "w": "which", "r": "where", "gw": "앨라배마, 그것이 그는 일자리를 얻었다", "gr": "앨라배마, 거기서 그는 일자리를 얻었다", "fb": "Traylor moved to the city of Montgomery, Alabama, <span class=\"d\">which</span> he found a job in a factory.", "fg": "Traylor moved to the city of Montgomery, Alabama, <span class=\"d\">where</span> he found a job in a factory.", "ko": "이후 70세 무렵에, Traylor는 앨라배마주 몽고메리시로 이주하여 공장에서 일자리를 얻었다.", "why": "which (그것)는 뒤에 주어나 목적어가 빠져 있어야 해요. 그런데 he found a job in a factory (그는 공장에서 일자리를 얻었다)는 이미 주어 he와 목적어 a job이 다 있는 완전한 문장이에요. 앞의 장소 the city of Montgomery (몽고메리시)를 '거기서'로 이어 주는 where (거기서)가 필요해요."}, {"c": 4, "w": "when", "r": "that", "gw": "너무 아파서 일할 수 없을 때 그는 돌아섰다", "gr": "너무 아파서 일할 수 없게 된 후에야 그는 돌아섰다", "fb": "It wasn’t until he was 85 years old and became too ill to work <span class=\"d\">when</span> he turned to drawing to express his life experiences.", "fg": "It wasn’t until he was 85 years old and became too ill to work <span class=\"d\">that</span> he turned to drawing to express his life experiences.", "ko": "85세가 되고 몸이 너무 아파서 일을 할 수 없게 된 후에야 그는 자신의 인생 경험을 표현하기 위해 그림으로 눈을 돌렸다.", "why": "It wasn't until ~ that ... (~하고 나서야 비로소 ...했다)은 한 세트로 외워요. 85세가 되고 몸이 아파서 일을 못 하게 된 뒤에야 그림을 시작했다는 뜻이에요. 그래서 문장 가운데에 that을 넣어야 해요. when (~할 때)은 이 세트에 쓰지 않아요."}, {"c": 5, "w": "", "r": "been", "gw": "그들은 농장에서 자주 사용했다", "gr": "그들은 농장에서 자주 사용되어 왔다", "fb": "Traylor had a strong fear of dogs because they had often used on farms to watch and hunt slaves.", "fg": "Traylor had a strong fear of dogs because they had often <span class=\"d\">been</span> used on farms to watch and hunt slaves.", "ko": "Traylor는 개가 농장에서 노예를 감시하고 사냥하는 데 자주 사용되었기 때문에 개에 대한 두려움이 컸다.", "why": "주어 they는 앞의 dogs (개들)예요. 개가 농장에서 노예를 감시하고 사냥하는 데 '사용된' 것이니 '~되다'는 뜻으로 써야 해요. 그래서 'be동사 + 과거분사(used처럼 -ed 모양)'인 been used (사용되었다)가 맞아요. had often used는 '개들이 무언가를 사용했다'가 되어 뜻이 거꾸로예요."}], "keep": "첫 문장의 was born (태어났다)과 spent (보냈다)는 시간 순서에 맞게 잘 쓰였고, 'working for very low wages (매우 낮은 임금을 받고 일하며)'도 알맞아요. 'Woman with Purse and Man with Umbrella portrays (〈핸드백을 든 여인과 우산을 든 남자〉는 묘사한다)'는 작품 한 점의 제목이 주어라서 단수 동사 portrays가 맞고, that he observed (그가 관찰한)도 the free lives (자유로운 삶)를 꾸며 줘서 맞아요. 작품 제목 단어들에 밑줄이 쳐 있지만 제목이라 틀린 곳이 아니에요.", "flow": "Bill Traylor의 삶을 시간 순서로 소개하는 글이에요. 장소 뒤에서 '거기서'로 이어 주는 말, 'It wasn't until ~ (~하고 나서야)'의 짝, 동사의 모양(수동)을 차례로 살펴보세요.", "ko": "첫 번째로 살펴볼 예술가는 Bill Traylor이다. Traylor는 1853년 미국에서 노예로 태어나 앨라배마의 목화 농장에서 일하며 어린 시절을 보냈다. 그는 미국 남북전쟁 이후 자유의 몸이 되었지만, 농장에서 매우 낮은 임금을 받고 일하며 여전히 인종차별에 직면해야 했다. 이후 70세 무렵에, Traylor는 앨라배마주 몽고메리시로 이주하여 공장에서 일자리를 얻었다. 85세가 되고 몸이 너무 아파서 일을 할 수 없게 된 후에야 그는 자신의 인생 경험을 표현하기 위해 그림으로 눈을 돌렸다. 이제 〈비열한 개〉와 〈남자와 큰 개〉를 시작으로 그의 그림 몇 점을 살펴보겠다. Traylor는 개가 농장에서 노예를 감시하고 사냥하는 데 자주 사용되었기 때문에 개에 대한 두려움이 컸다. 이 작품들에는 개에 대한 그의 두려움이 강하게 표현되어 있다. 이와 대조적으로 〈핸드백을 든 여인과 우산을 든 남자〉는 몽고메리 거리에서 그가 관찰한 아프리카계 미국인의 자유로운 삶을 묘사한다. Traylor는 단순한 형태와 색채를 사용하여 노예 제도에서 자유에 이르는 미국 역사의 복잡한 순간을 포착했다. 그 결과, 그는 현재 미국 민속 예술의 중요한 인물로 여겨지고 있다."}, {"id": "gram3", "kind": "gram", "n": 3, "title": null, "tko": null, "paras": [[{"t": "Maud Lewis  Next, we have Maud Lewis, a renowned artist known for her heart-warming paintings. "}, {"t": "Born in a small Canadian town in 1903, Lewis suffered from physical weaknesses such as distorted shoulders and fingers", "c": 1}, {"t": ". This limited her mobility and caused her to drop out of school. To make a living, she began to paint and sell Christmas cards. When her parents passed away, "}, {"t": "Lewis went to live with her aunt in Digby, Nova Scotia, which she met her future husband, Everett Lewis", "c": 2}, {"t": ". "}, {"t": "After marrying, the couple spent the rest of their lives there, and Lewis continued to paint", "c": 3}, {"t": ". She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor. "}, {"t": "Her artwork used a mixture of bright and vivid oil paints and simple forms, generate an original, innovative style.", "c": 4}, {"t": " "}, {"t": "Despite her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "c": 5}, {"t": " In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field. "}, {"t": "With these features, Lewis’ paintings create a magical quality, like that of a fairy tale", "c": 6}, {"t": ". As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies. Maud Lewis expressed her love for the world through her paintings and became an iconic figure in Canadian folk art."}]], "items": [{"c": 2, "w": "which", "r": "where", "gw": "노바스코샤, 그것이 그녀는 미래의 남편을 만났다", "gr": "노바스코샤, 거기서 그녀는 미래의 남편을 만났다", "fb": "Lewis went to live with her aunt in Digby, Nova Scotia, <span class=\"d\">which</span> she met her future husband, Everett Lewis.", "fg": "Lewis went to live with her aunt in Digby, Nova Scotia, <span class=\"d\">where</span> she met her future husband, Everett Lewis.", "ko": "부모님이 돌아가신 후 Lewis는 이모와 함께 살기 위해 노바스코샤주 딕비로 갔고, 그곳에서 미래의 남편인 Everett Lewis를 만났다.", "why": "앞의 gram2와 같은 규칙이에요. she met her future husband (그녀는 미래의 남편을 만났다)는 이미 완전한 문장이라 which (그것)가 올 수 없어요. 앞의 장소 Digby, Nova Scotia (노바스코샤주 딕비)를 '거기서'로 이어 주는 where (거기서)를 써요."}, {"c": 4, "w": "generate", "r": "generating", "gw": "단순한 형태, 만들어라 독창적인", "gr": "단순한 형태, 독창적인 ...을 만들어 내며", "fb": "Her artwork used a mixture of bright and vivid oil paints and simple forms, <span class=\"d\">generate</span> an original, innovative style.", "fg": "Her artwork used a mixture of bright and vivid oil paints and simple forms, <span class=\"d\">generating</span> an original, innovative style.", "ko": "그녀의 작품은 밝고 선명한 유화물감의 혼합과 단순한 형태를 사용하여 독창적이고 혁신적인 스타일을 만들어 냈다.", "why": "이 문장에는 이미 동사 used (사용했다)가 있어요. 한 문장에 동사를 접속사 없이 하나 더 쓰면 안 돼요. '그 결과 ~을 만들어 냈다'처럼 덧붙일 때는 동사 generate에 -ing를 붙인 generating (만들어 내며)으로 이어요."}, {"c": 5, "w": "Despite", "r": "Although", "gw": "(~에도 불구하고) 그녀의 신체적 제약이 가뒀다", "gr": "비록 그녀의 신체적 제약이 가뒀지만", "fb": "<span class=\"d\">Despite</span> her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "fg": "<span class=\"d\">Although</span> her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "ko": "비록 신체적 제약들은 그녀를 작은 오두막집에 가두었지만 그녀의 재능과 상상력은 둘 다 무한했다.", "why": "despite (~에도 불구하고) 뒤에는 명사만 올 수 있어요(앞의 메모와 같은 규칙). 그런데 여기는 her physical limitations confined her (그녀의 신체적 제약이 그녀를 가뒀다)처럼 '주어 + 동사'가 있는 문장이에요. 그래서 문장을 이어 주는 Although (비록 ~이지만)를 써야 해요."}], "keep": "'Born in a small Canadian town (캐나다의 작은 마을에서 태어난)'은 '태어난'이라는 뜻의 Born으로 문장을 시작한 것이라 알맞아요. 'After marrying, the couple spent ~ there (결혼 후 부부는 거기서 보냈다)'도 맞아요. 'create a magical quality (마법 같은 특성을 만든다)'도 주어 paintings (그림들)와 맞아요.", "flow": "Maud Lewis가 몸이 불편했지만 재능은 무한했다는 이야기예요. 장소를 이어 주는 말, 동사 두 개가 한 문장에 있을 때의 모양, '~에도 불구하고' 계열의 말을 살펴보세요.", "ko": "다음은 마음이 따뜻해지는 그림으로 알려진, 유명 예술가 Maud Lewis이다. 1903년 캐나다의 작은 마을에서 태어난 Lewis는 기형적인 어깨와 손가락과 같은 신체적 약점으로 고통받았다. 이것은 그녀의 이동성을 제한했고 그녀가 학교를 중퇴하도록 만들었다. 생계를 위해 그녀는 크리스마스카드를 그려서 팔기 시작했다. 부모님이 돌아가신 후 Lewis는 이모와 함께 살기 위해 노바스코샤주 딕비로 갔고, 그곳에서 미래의 남편인 Everett Lewis를 만났다. 결혼 후 부부는 여생을 그곳에서 보냈고 Lewis는 계속해서 그림을 그렸다. 그녀는 〈딕비 항구의 가장자리〉와 같은 그림에서 딕비의 풍경을 자주 묘사했다. 그녀의 작품은 밝고 선명한 유화물감의 혼합과 단순한 형태를 사용하여 독창적이고 혁신적인 스타일을 만들어 냈다. 비록 신체적 제약들은 그녀를 작은 오두막집에 가두었지만 그녀의 재능과 상상력은 둘 다 무한했다. 〈빨간 썰매〉에는 붉은 단풍잎이 특별한 겨울 풍경에 등장하고, 〈한 쌍의 소〉에는 꽃밭에 서 있는 장식된 소들을 보여 준다. 이러한 특징을 통해 Lewis의 그림은 마치 동화의 그것과 같은, 마법 같은 특성을 만들어 낸다. 그녀의 그림이 점차 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고 나중에 책과 영화로 만들어졌다. Maud Lewis는 그림을 통해 세상에 대한 사랑을 표현했고 캐나다 민속 예술의 상징적인 인물이 되었다."}, {"id": "gram4", "kind": "gram", "n": 4, "title": null, "tko": null, "paras": [[{"t": "Anna Ancher  Now let’s take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark. When observing her paintings, you may notice a common theme—they all feature female figures. Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school. "}, {"t": "After that, she even studied abroad in Paris, that was unusual for women at the time.", "c": 1}, {"t": " Thanks to her mother’s encouragement, she was able to take advantage of these opportunities. Even after getting married, "}, {"t": "Ancher persisted in painting, objecting to the social pressure that married women were to solely focusing on household duties", "c": 2}, {"t": ". "}, {"t": "Ancher differed from other artists of that era, who depicted women as still life subjects", "c": 3}, {"t": ". In contrast, "}, {"t": "she showcased them as active participants in everyday tasks, as seeing in her works The Maid in the Kitchen and Sewing Fisherman’s Wife", "c": 4}, {"t": ". She also skillfully explored light and color, contributing to the rich Impressionist movement in Denmark. In her painting Sunlight in the Blue Room, the reflection of the sunlight on the blue wall is stunningly portrayed. Ancher challenged the conventional roles of women in the 20th century and displayed her exceptional artistic talent. "}, {"t": "Her paintings continue to amaze us to this day", "c": 5}, {"t": "."}], [{"t": "Thank you for joining this guided tour, and "}, {"t": "I hope my explanations have aided you in appreciating these paintings", "c": 6}, {"t": ". Please take some time to further explore the exhibition."}]], "items": [{"c": 1, "w": "that", "r": "which", "gw": "파리, 그것은 드물었다 (that)", "gr": "파리, 그것은 드문 일이었다 (which)", "fb": "After that, she even studied abroad in Paris, <span class=\"d\">that</span> was unusual for women at the time.", "fg": "After that, she even studied abroad in Paris, <span class=\"d\">which</span> was unusual for women at the time.", "ko": "그 후 그녀는 파리에서 유학까지 했는데, 그것은 당시 여성들에게 드문 일이었다.", "why": "콤마(,) 뒤에서 앞 내용을 통째로 받아 '그것은 ~였다'라고 덧붙일 때는 which를 써요. 파리에서 유학까지 한 일이 당시 여성에게 드문 일이었다는 뜻이에요. that은 콤마 바로 뒤에 쓸 수 없어요."}, {"c": 2, "w": "focusing", "r": "focus", "gw": "오로지 집중하는 중이었다", "gr": "오로지 집중해야 했다", "fb": "Ancher persisted in painting, objecting to the social pressure that married women were to solely <span class=\"d\">focusing</span> on household duties.", "fg": "Ancher persisted in painting, objecting to the social pressure that married women were to solely <span class=\"d\">focus</span> on household duties.", "ko": "결혼 후에도 Ancher는 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며 그림을 계속 그렸다.", "why": "were to ~ (~해야 한다)에서 to 뒤에는 원래 모양 동사가 와요. 사회적 압력이 'married women were to solely focus on household duties (기혼 여성은 가사에만 집중해야 한다)'라고 하는 내용이에요. solely (오로지)는 부사라서 to와 동사 사이에 끼어도 동사는 focus 그대로 써야 해요."}, {"c": 4, "w": "seeing", "r": "seen", "gw": "그녀의 작품에서 보는 것처럼 (-ing)", "gr": "그녀의 작품에서 보이듯이", "fb": "she showcased them as active participants in everyday tasks, as <span class=\"d\">seeing</span> in her works The Maid in the Kitchen and Sewing Fisherman’s Wife.", "fg": "she showcased them as active participants in everyday tasks, as <span class=\"d\">seen</span> in her works The Maid in the Kitchen and Sewing Fisherman’s Wife.", "ko": "이와는 대조적으로, 〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉라는 작품에서 볼 수 있듯 그녀는 일상 작업의 적극적인 참여자로서의 여성을 보여 주었다.", "why": "as seen in ~은 '~에서 볼 수 있듯이'라는 굳어진 표현이에요. 작품이 '보여지는' 쪽이라서 '보여진'이라는 뜻의 seen (보인)을 써요. seeing (보는)은 작품이 본다는 뜻이 되어 틀려요. 그 뒤의 her works (그녀의 작품들)는 The Maid in the Kitchen (부엌의 하녀) 같은 작품들을 가리켜요."}], "keep": "'Ancher differed from other artists ~, who depicted ~ (Ancher는 여성을 정물화 소재로 그린 다른 화가들과 달랐다)'에서 who는 '사람(예술가들)'을 받아서 맞아요. 'Her paintings continue to amaze us (그녀의 그림은 지금도 우리를 놀라게 한다)'는 주어가 복수라 continue가 맞고, 'I hope my explanations have aided you (제 설명이 도움이 되었기를 바랍니다)'도 알맞아요.", "flow": "Anna Ancher가 시대의 편견에 맞서 그림을 그린 이야기예요. 앞 내용을 통째로 받는 which, '~해야 한다'의 be to, '보이듯이' 같은 표현의 모양을 살펴보세요.", "ko": "이제 이번 전시의 마지막 예술가, 덴마크 출신의 유명 화가 Anna Ancher를 살펴보자. 그녀의 그림을 보면 여러분은 공통적인 주제를 알아차릴지도 모르는데, 그건 바로 그림에 모두 여성 인물이 등장한다는 점이다. 1859년 덴마크 스카겐에서 태어난 그녀는 나중에 사립 회화 학교에 다니기 위해 코펜하겐으로 이주했다. 그 후 그녀는 파리에서 유학까지 했는데, 그것은 당시 여성들에게 드문 일이었다. 어머니의 격려 덕분에 그녀는 이러한 기회를 활용할 수 있었다. 결혼 후에도 Ancher는 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 저항하며 그림을 계속 그렸다. Ancher는 당시의 다른 예술가들과는 달랐는데, 그들은 여성을 정물화 소재로 묘사했다. 이와는 대조적으로, 〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉라는 작품에서 볼 수 있듯 그녀는 일상 작업의 적극적인 참여자로서의 여성을 보여 주었다. 또한 그녀는 빛과 색채를 능숙하게 탐구하여 덴마크의 풍부한 인상주의 운동에 기여했다. 그녀의 작품 〈푸른 방의 햇빛〉에서는 푸른 벽에 반사되는 햇빛이 굉장히 아름답게 묘사되어 있다. Ancher는 20세기 여성의 전통적인 역할에 이의를 제기하며 뛰어난 예술적 재능을 보여 주었다. 그녀의 그림은 오늘날까지도 우리를 놀라게 한다. 이번 가이드 투어에 참여해 주셔서 감사하며, 나의 설명이 여러분이 그림을 감상하는 데 도움이 되었기를 바란다. 잠시 시간을 내어 전시를 더 둘러보기 바란다."}];

function $(i){return document.getElementById(i)}

function qById(id){return Q.filter(function(q){return q.id===id})[0]}

function draw(q){
  var r=R(q),n=q.items.length,idx=Q.indexOf(q);
  $('qn').textContent=nm(q)+' ('+(idx+1)+'/'+Q.length+')';
  $('ask').innerHTML='밑줄 친 곳 중 <b>'+(q.kind==='ctx'?'문맥상':'어법상')+' 어색한 것 '+n+'개</b>를 고르세요.';
  var ps=$('ps');ps.innerHTML='';ps.classList.toggle('locked',r.done);
  if(q.title){var tp=el('p','ptitle');tp.textContent=q.title+' ';var sp=el('span',null,'('+q.tko+')');sp.style.cssText='color:var(--sub);font-size:15px;font-weight:600';tp.appendChild(sp);ps.appendChild(tp)}
  var T=truth(q);
  q.paras.forEach(function(p){
    var pe=el('p');
    p.forEach(function(s){
      if(!s.c){pe.appendChild(document.createTextNode(s.t));return}
      var c=el('span','cd');c.setAttribute('data-c',s.c);c.appendChild(document.createTextNode(s.t));
      c.appendChild(el('sup',null,CIRC.charAt(s.c-1)));
      var picked=r.sel.indexOf(s.c)>=0,isT=T.indexOf(s.c)>=0;
      if(r.done){
        if(picked&&isT)c.classList.add('hit');else if(isT)c.classList.add('miss');else if(picked)c.classList.add('bad');
        if(isT){var it=q.items.filter(function(i){return i.c===s.c})[0];pe.appendChild(c);pe.appendChild(el('span','fx',' → '+it.r+' '));return}
      }else{
        if(picked)c.classList.add('sel');
        c.onclick=function(){toggle(q,s.c)};
      }
      pe.appendChild(c);
    });
    ps.appendChild(pe)});
  var sub=$('submit'),cnt=$('cnt');

  else{sub.classList.remove('hide');cnt.classList.remove('hide');$('res').classList.add('hide');upd(q)}

function upd(q){var r=R(q),n=q.items.length;$('cnt').innerHTML='선택한 곳 <b>'+r.sel.length+'</b> / '+n+(r.sel.length?' · '+r.sel.slice().sort(function(a,b){return a-b}).map(function(c){return CIRC.charAt(c-1)}).join(' '):'');$('submit').disabled=r.sel.length!==n}
function toggle(q,c){

}

function result(q){
  var r=R(q),res=$('res');res.innerHTML='';res.classList.remove('hide');
  var T=truth(q),got=r.sel.filter(function(c){return T.indexOf(c)>=0}).length,ok=isOk(q);

  q.items.forEach(function(it,ii){
    var d=el('div','it'),h=el('div','ih');

    h.appendChild(el('span','tag '+(hit?'y':'n'),(hit?'찾았어요 ':'놓쳤어요 ')+CIRC.charAt(it.c-1)));
    var ia=el('span','ia');ia.appendChild(el('span','x',it.w));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gw+')'));ia.appendChild(document.createTextNode(' → '));ia.appendChild(el('span','r',it.r));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gr+')'));
    h.appendChild(ia);d.appendChild(h);

    d.appendChild(el('div','kot',it.ko));
    d.appendChild(html('div','why',it.why));

  var wrongPick=r.sel.filter(function(c){return T.indexOf(c)<0});

  if(WN.MIX){WN.finish();res.appendChild(html('div','note','틀린 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에 담겨요.'))}
  else if(WN.MODE){res.appendChild(html('div','note','이제 안 봐도 되는 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에서 \'빼기\'로 뺄 수 있어요.'))}

  res.appendChild(bk);res.appendChild(kb);
