<style>

 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8}

<script>
var D={"secs": [{"no": 1, "id": "z1", "sents": [{"n": 1, "mk": "Neuroscience has a long history [2|of exploring] [1|treatments for] disorders of the nervous system, including the brain and spinal cord.", "en": "Neuroscience has a long history of exploring treatments for disorders of the nervous system, including the brain and spinal cord.", "ko": "신경과학은 뇌와 척수를 포함한 신경계 질환에 대한 치료법을 탐구해 온 오랜 역사가 있습니다."}, {"n": 2, "mk": "Traditionally, researchers [3|have studied] various functions of neural implants, [4|which are medical devices] like computer chips that [5|can be implanted] in the nervous system.", "en": "Traditionally, researchers have studied various functions of neural implants, which are medical devices like computer chips that can be implanted in the nervous system.", "ko": "전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔고, 이것은 신경계에 이식될 수 있는 컴퓨터 칩과 같은 의료 기기입니다."}, {"n": 3, "mk": "But here's the [6|exciting] part: with the rapid advancement of artificial intelligence (AI), researchers [3|have begun] to [7|integrate AI into] neural implants.", "en": "But here's the exciting part: with the rapid advancement of artificial intelligence (AI), researchers have begun to integrate AI into neural implants.", "ko": "하지만 흥미로운 점은 여기 있습니다. 그건 바로 인공지능(AI)의 급속한 발전과 함께 연구자들이 신경 임플란트에 AI를 통합하기 시작했다는 점입니다."}, {"n": 4, "mk": "In this post, we'll examine [8|the incredible benefits] of AI-powered neural implants, [8|their amazing potential] for the future, and [8|the ethical concerns] [9|surrounding] [10|them].", "en": "In this post, we'll examine the incredible benefits of AI-powered neural implants, their amazing potential for the future, and the ethical concerns surrounding them.", "ko": "이 글에서는 AI 기반 신경 임플란트의 뛰어난 장점과 앞으로의 놀라운 잠재력, 그리고 이를 둘러싼 윤리적 우려에 대해 살펴보겠습니다."}], "items": [{"t": "treatment for ~ : ~에 대한 치료법", "c": "g", "x": "treatment는 ‘치료’라는 뜻이고, 치료법이라는 의미로 쓰일 때는 셀 수 있는 명사가 되어 treatments처럼 복수형도 쓴다. 이 문장의 treatments for disorders는 ‘질환에 대한 치료법들’이라는 뜻이다. 본문의 treatments는 treatment의 복수형이다.", "n": ["treatment for ~ = ~에 대한 치료법", "disorder = 장애, 질환"], "q": "treatments for disorders는 무슨 뜻인가?", "a": "질환에 대한 치료법들", "p": "treatments for"}, {"t": "전치사 of + 동명사(-ing) : ~하는 것의", "c": "b", "x": "a long history of exploring에서 of는 전치사이다. 전치사 뒤에는 동사원형이 아니라 동명사(-ing)가 와서 ‘탐구해 온 (역사)’라는 뜻이 된다. of exploring treatments ...는 앞의 명사 history를 뒤에서 꾸며 준다.", "n": ["전치사 + 동명사(-ing)", "history of -ing = ~해 온 역사"], "q": "of 뒤에 동사를 쓸 때 어떤 형태로 쓰는가?", "a": "동명사(-ing). 본문에서는 exploring", "p": "of exploring"}, {"t": "have + p.p. : 현재완료", "c": "k", "x": "have studied와 have begun은 모두 have + p.p. 형태의 현재완료이다. 과거에 시작한 일이 지금까지 이어지거나 지금과 관련됨을 나타낸다. 첫 번째는 ‘연구해 왔다’, 두 번째는 ‘통합하기 시작했다’로 해석한다. begun은 begin의 과거분사형이다.", "n": ["현재완료 : have(has) + p.p.", "begin - began - begun"], "q": "have begun에서 begun은 동사 begin의 어떤 형태인가?", "a": "과거분사(p.p.)", "p": "have begun"}, {"t": "계속적 용법의 주격 관계대명사 which", "c": "k", "x": "neural implants, which are medical devices ...에서 which 앞에 쉼표(,)가 있어 앞의 말에 설명을 덧붙이는 계속적 용법이다. which는 neural implants를 가리키며 관계절 안에서 주어 역할을 한다. 선행사가 복수라서 동사도 복수형 are가 되었다.", "n": [", which + 동사 = 그리고 그것은 ~", "관계절의 동사는 선행사의 수에 일치"], "q": "which are에서 are가 단수가 아니라 복수인 이유는?", "a": "which가 가리키는 neural implants가 복수이기 때문", "p": "which are medical devices"}, {"t": "can be p.p. : 조동사가 있는 수동태", "c": "b", "x": "can be implanted는 조동사 + be + p.p.의 수동태로 ‘이식될 수 있다’라는 뜻이다. that이 가리키는 computer chips가 이식을 ‘당하는’ 대상이라서 수동태를 쓴다. implanted는 동사 implant(이식하다)의 과거분사형이다.", "n": ["조동사 + be + p.p. = ~될 수 있다(수동)", "implant = ~을 이식하다"], "q": "can be implanted를 해석하면?", "a": "이식될 수 있다", "p": "can be implanted"}, {"t": "exciting : 흥미진진한 (현재분사 형태의 형용사)", "c": "b", "x": "exciting은 동사 excite(흥분시키다)에 -ing가 붙은 현재분사 형태의 형용사로 ‘흥미진진한’이라는 뜻이다. the exciting part에서 명사 part를 앞에서 꾸민다. 부분(part)이 감정을 일으키는 쪽이라서 -ed가 아닌 -ing를 쓴다.", "n": ["감정을 일으키는 대상 : -ing (exciting)", "감정을 느끼는 사람 : -ed (excited)"], "q": "the exciting part에서 exciting이 꾸미는 말은?", "a": "part", "p": "exciting"}, {"t": "integrate ~ into … : ~을 …에 통합하다", "c": "g", "x": "integrate AI into neural implants는 ‘AI를 신경 임플란트에 통합하다’라는 뜻이다. integrate 뒤에 통합할 대상(AI)이 오고, into 뒤에 합쳐 넣는 대상(neural implants)이 온다. 이 문장은 to부정사 to integrate의 형태로 쓰였다.", "n": ["integrate A into B = A를 B에 통합하다"], "q": "integrate AI into neural implants에서 into 뒤에 오는 것은?", "a": "AI가 합쳐져 들어가는 대상인 neural implants", "p": "integrate AI into"}, {"t": "병렬 연결 : A, B, and C", "c": "k", "x": "we'll examine 뒤에 benefits, potential, concerns라는 세 개의 명사구가 쉼표(,)와 and로 이어져 있다. 모두 같은 자리의 목적어이므로 ‘장점, 잠재력, 우려’를 나란히 살펴보겠다는 뜻이다. 병렬 구조에서는 and 앞뒤를 같은 형태로 맞춘다.", "n": ["A, B, and C : 같은 문법 형태끼리 연결", "병렬되는 세 명사구가 모두 examine의 목적어"], "q": "examine의 목적어로 병렬된 세 가지는 무엇인가?", "a": "benefits, potential, concerns(장점, 잠재력, 우려)", "p": "the incredible benefits of AI-powered neural implants, their amazing potential for the future, and the ethical concerns"}, {"t": "surrounding them : ~을 둘러싼 (현재분사구)", "c": "b", "x": "surrounding them은 ‘그것들을 둘러싼’이라는 뜻의 현재분사구이다. 앞의 명사 the ethical concerns를 뒤에서 꾸며 준다. surround(~을 둘러싸다)의 목적어 them이 바로 뒤에 있어서 능동의 -ing 형태를 쓴다.", "n": ["명사 + 현재분사구 = ~하는 (명사)", "surround = ~을 둘러싸다"], "q": "surrounding them이 꾸며 주는 명사는?", "a": "the ethical concerns", "p": "surrounding"}, {"t": "them = AI 기반 신경 임플란트", "c": "o", "x": "surrounding them의 them은 앞에 나온 AI-powered neural implants를 가리킨다. 그래서 ‘AI 기반 신경 임플란트를 둘러싼 윤리적 우려’라는 뜻이 된다.", "n": ["them = AI-powered neural implants"], "q": "surrounding them의 them이 가리키는 것은?", "a": "AI-powered neural implants (AI 기반 신경 임플란트)", "p": "them"}]}, {"no": 2, "id": "z2", "sents": [{"n": 5, "mk": "First, let's explore [1|how this fascinating technology] [2|has been applied].", "en": "First, let's explore how this fascinating technology has been applied.", "ko": "먼저 이 매혹적인 기술이 어떻게 적용되었는지 살펴봅시다."}, {"n": 6, "mk": "The AI-powered neural implant has shown great [3|promise] in medical applications, [4|offering solutions to a range of problems].", "en": "The AI-powered neural implant has shown great promise in medical applications, offering solutions to a range of problems.", "ko": "AI 기반 신경 임플란트는 다양한 문제에 대한 해결책을 제시하며 의료 분야 적용에서 큰 가능성을 보여 주었습니다."}, {"n": 7, "mk": "For instance, neural implants [5|are used to treat] brain disorders like Parkinson's disease.", "en": "For instance, neural implants are used to treat brain disorders like Parkinson's disease.", "ko": "예를 들어, 신경 임플란트는 파킨슨병과 같은 뇌 질환을 치료하는 데 사용됩니다."}, {"n": 8, "mk": "These implants electrically stimulate targeted regions of the brain at the right time [6|with the help of] AI to restore normal brain activity.", "en": "These implants electrically stimulate targeted regions of the brain at the right time with the help of AI to restore normal brain activity.", "ko": "이러한 임플란트는 정상적인 뇌 활동을 회복시키기 위해 AI의 도움을 받아 적시에 뇌의 표적 부위를 전기로 자극합니다."}, {"n": 9, "mk": "In addition, paralyzed people can have [7|the ability to walk] again with the help of a “digital bridge” between two implants [8|inserted into] their brain and spine.", "en": "In addition, paralyzed people can have the ability to walk again with the help of a “digital bridge” between two implants inserted into their brain and spine.", "ko": "또한 마비 환자들은 뇌와 척추에 삽입된 두 개의 임플란트 사이에 있는 '디지털 브릿지'의 도움으로 다시 걸을 수 있는 능력을 가질 수 있습니다."}, {"n": 10, "mk": "When [9|they] think [10|about moving] their legs, the AI [11|analyzes] the brain signals and [11|sends] them to their legs through the implants.", "en": "When they think about moving their legs, the AI analyzes the brain signals and sends them to their legs through the implants.", "ko": "환자가 다리를 움직이려고 생각하면 AI가 뇌 신호를 분석하여 임플란트를 통해 다리로 신호를 보냅니다."}, {"n": 11, "mk": "Similarly, [12|those who have lost] their arms can use [13|artificial] arms operated by the same mechanism.", "en": "Similarly, those who have lost their arms can use artificial arms operated by the same mechanism.", "ko": "마찬가지로 팔을 잃은 사람들도 동일한 메커니즘으로 작동하는 의수를 사용할 수 있습니다."}], "items": [{"t": "간접의문문 : 의문사 + 주어 + 동사", "c": "k", "x": "explore how this fascinating technology has been applied에서 how로 시작하는 절이 explore의 목적어이다. 이런 간접의문문은 의문문 어순이 아니라 how + 주어(this fascinating technology) + 동사(has been applied) 순서로 쓴다.", "n": ["의문사 + 주어 + 동사 = 간접의문문(목적어 자리)", "how has this technology ~ (X) → how this technology has ~ (O)"], "q": "explore how has this technology been applied가 틀린 이유는?", "a": "간접의문문은 의문사 뒤에 평서문 어순(주어 + 동사)으로 써야 하기 때문이다.", "p": "how this fascinating technology has been applied"}, {"t": "has been applied : 현재완료 수동태", "c": "k", "x": "has been applied는 have + been + p.p. 형태로 ‘적용되어 왔다’라는 뜻이다. applied는 동사 apply(적용하다)의 과거분사이다. 기술(technology)은 스스로 적용하는 것이 아니라 적용되는 대상이므로 수동태를 쓴다.", "n": ["현재완료 수동태 : have/has + been + p.p. = ~되어 왔다, ~되었다"], "q": "has been applied는 어떤 형태가 합쳐진 것인가?", "a": "has + been + p.p.(현재완료 + 수동태)", "p": "has been applied"}, {"t": "promise : 유망함, 가능성", "c": "g", "x": "has shown great promise에서 promise는 동사(약속하다)가 아니라 명사로 쓰여 ‘유망함, 가능성’이라는 뜻이다. great promise는 ‘큰 가능성’이라는 의미이다.", "n": ["promise n. 약속, (전도)유망함 / v. ~을 약속하다"], "q": "has shown great promise에서 promise의 뜻은?", "a": "유망함, 가능성 (명사)", "p": "promise"}, {"t": "offering ~ : 분사구문 (~하며)", "c": "b", "x": "문장 뒤에 붙은 offering solutions to a range of problems는 분사구문으로, 앞 내용에 이어 ‘해결책을 제시하며’라고 덧붙이는 설명이다. 분사구문의 의미상 주어는 주절의 주어인 The AI-powered neural implant이다.", "n": ["분사구문 : 접속사 + 주어를 생략하고 동사를 -ing로 바꿈 = ~하며, ~하면서"], "q": "offering solutions를 접속사 and와 동사로 바꾸면?", "a": "and (it) offers solutions", "p": "offering solutions to a range of problems"}, {"t": "be used to + 동사원형 : ~하는 데 사용되다", "c": "k", "x": "are used to treat brain disorders는 ‘뇌 질환을 치료하는 데 사용된다’라는 뜻이다. 수동태 are used 뒤에 목적을 나타내는 to부정사 to treat가 이어진 구조이다. be used to + -ing(~에 익숙하다)와 모양이 비슷하니 구별해야 한다.", "n": ["be used + to + 동사원형 = ~하는 데 사용되다", "be used to + 동명사 = ~에 익숙하다"], "q": "are used to treat의 뜻은? be used to + -ing와 뜻이 어떻게 다른가?", "a": "~을 치료하는 데 사용된다. be used to + -ing는 ‘~에 익숙하다’이다.", "p": "are used to treat"}, {"t": "with the help of ~ : ~의 도움으로", "c": "g", "x": "with the help of AI는 ‘AI의 도움으로’라는 뜻이다. help 앞에 the가 붙고, 도움을 주는 대상은 of 뒤에 쓴다.", "n": ["with the help of ~ = ~의 도움으로"], "q": "with the help of AI를 해석하면?", "a": "AI의 도움으로", "p": "with the help of AI"}, {"t": "명사 + to부정사 : ~할 (명사)", "c": "b", "x": "the ability to walk에서 to walk는 앞의 명사 ability를 꾸미는 형용사적 용법의 to부정사이다. ‘걸을 수 있는 능력’이라는 뜻이다.", "n": ["명사 + to + 동사원형 = ~하는, ~할 (명사) (형용사적 용법)"], "q": "the ability to walk에서 to walk는 무엇을 꾸미는가?", "a": "명사 ability (‘걸을 수 있는 능력’)", "p": "the ability to walk"}, {"t": "implants inserted into ~ : 과거분사구의 후치 수식", "c": "b", "x": "inserted into their brain and spine은 앞의 명사 implants를 뒤에서 꾸미는 과거분사구이다. 임플란트가 ‘삽입되는’ 대상이므로 수동의 의미이며, ‘뇌와 척추에 삽입된 임플란트’라는 뜻이다. inserted는 동사 insert(삽입하다)의 과거분사이다.", "n": ["명사 + p.p. + 어구 = ~된 (명사) (= 명사 + which are + p.p.)", "insert ~ into … = …에 ~을 삽입하다"], "q": "implants inserted into their brain and spine에서 inserted가 꾸미는 말은?", "a": "앞의 명사 implants", "p": "inserted into their brain and spine"}, {"t": "they = 마비 환자들", "c": "o", "x": "When they think의 they는 앞 문장의 paralyzed people(마비 환자들)을 가리킨다. 뒤에 나오는 their legs도 같은 환자들의 다리이다.", "n": ["they = paralyzed people (마비 환자들)"], "q": "When they think about moving의 they는 누구인가?", "a": "마비 환자들 (paralyzed people)", "p": "they"}, {"t": "전치사 + -ing : about moving", "c": "b", "x": "전치사 about 뒤에는 동사가 아니라 동명사(-ing)가 온다. think about moving their legs는 ‘다리를 움직이는 것에 대해 생각하다’라는 뜻이다. moving 대신 to move를 쓰지 않는다.", "n": ["전치사 + 동명사(-ing) (전치사 뒤에는 to부정사 불가)"], "q": "think about 뒤에 to move가 아니라 moving을 쓰는 이유는?", "a": "전치사 about의 목적어 자리에는 동명사를 쓰기 때문이다.", "p": "about moving"}, {"t": "병렬연결 : analyzes ~ and sends ~", "c": "b", "x": "접속사 and가 동사 analyzes와 sends를 대등하게 연결한다. 주어 the AI가 3인칭 단수이므로 두 동사 모두 -s가 붙은 현재형이다. 이처럼 and로 연결되는 어구는 같은 형태로 맞춘다.", "n": ["A and B 병렬 : 연결되는 동사끼리 시제·형태를 일치시킴"], "q": "the AI analyzes ~ and sends ~에서 and가 연결하는 두 동사는?", "a": "analyzes와 sends", "p": "analyzes the brain signals and sends them"}, {"t": "those who + have lost : 주격 관계대명사 & 수일치 · 현재완료", "c": "k", "x": "those who have lost their arms에서 who는 주격 관계대명사이고 선행사는 those(~하는 사람들)이다. those가 복수이므로 who 뒤의 동사도 복수형 have를 쓴다. have lost는 현재완료로 ‘팔을 잃은’ 상태를 나타낸다.", "n": ["those who + 복수 동사 = ~하는 사람들", "관계대명사절의 동사는 선행사에 수일치"], "q": "those who have lost에서 동사가 has가 아니라 have인 이유는?", "a": "선행사 those가 복수이므로 who절의 동사도 복수형을 쓴다.", "p": "those who have lost their arms"}, {"t": "artificial : 인공의", "c": "g", "x": "artificial arms는 ‘인공 팔’, 즉 의수를 뜻한다. artificial은 형용사로 ‘인공의’라는 뜻이다.", "n": ["artificial a. 인공의"], "q": "artificial arms의 뜻은?", "a": "인공 팔 (의수)", "p": "artificial arms"}]}, {"no": 3, "id": "z3", "sents": [{"n": 12, "mk": "[1|The success of AI-powered neural implants in health care is also expected] to [2|spread] to other industries.", "en": "The success of AI-powered neural implants in health care is also expected to spread to other industries.", "ko": "의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상됩니다."}, {"n": 13, "mk": "Some futurists [3|predict that] these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives.", "en": "Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives.", "ko": "일부 미래학자들은 이러한 임플란트가 향후 20~30년 이내에 상용화되어 우리의 일상을 크게 변화시킬 것이라고 예측합니다."}, {"n": 14, "mk": "For example, advances in neural implant technology will [4|make it possible to install] in our brains [5|software that can read] our minds.", "en": "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds.", "ko": "예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것입니다."}, {"n": 15, "mk": "This could [6|enable us to play games, type social media messages, and stream music] simply by thinking.", "en": "This could enable us to play games, type social media messages, and stream music simply by thinking.", "ko": "이것은 우리가 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍하는 것이 가능하도록 해 줄 것입니다."}, {"n": 16, "mk": "[7|There is also great potential] for memory-enhancing brain implants, similar to computer memory chips.", "en": "There is also great potential for memory-enhancing brain implants, similar to computer memory chips.", "ko": "컴퓨터 메모리 칩과 유사한 기억력 향상 뇌 임플란트도 큰 잠재력을 가지고 있습니다."}, {"n": 17, "mk": "Such devices would [8|allow us to capture and enhance] memories, and even upload and download [9|them] using the digital cloud.", "en": "Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.", "ko": "이러한 장치를 사용하면 기억을 캡처하고 향상시킬 수 있으며, 디지털 클라우드를 사용하여 기억을 업로드 및 다운로드할 수도 있습니다."}, {"n": 18, "mk": "We could [10|look through] our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and [10|back up] our most valuable memories.", "en": "We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories.", "ko": "우리는 소셜 미디어 피드처럼 기억을 살펴보고, 인생에서 가장 좋았던 순간을 생생하게 회상하고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것입니다."}, {"n": 19, "mk": "Finally, AI-powered neural implants would revolutionize [11|the way our brains work].", "en": "Finally, AI-powered neural implants would revolutionize the way our brains work.", "ko": "마지막으로, AI 기반 신경 임플란트는 우리 뇌의 작동 방식에 혁명을 일으킬 것입니다."}, {"n": 20, "mk": "The role of the brain would shift [12|from learning and storing information to processing] the vast amounts of data provided by the implants.", "en": "The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants.", "ko": "뇌의 역할이 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀌게 될 것입니다."}, {"n": 21, "mk": "[13|Instead of simply memorizing] information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas.", "en": "Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas.", "ko": "우리는 단순히 정보를 암기하는 대신 지식을 다운로드하고, 창의력을 발휘하여 그 지식을 해석하고, 새로운 아이디어를 창출할 수 있게 될 것입니다."}], "items": [{"t": "be expected to V : ~할 것으로 예상되다 (수동태) · 수일치", "c": "b", "x": "is also expected to spread는 be + p.p. 모양의 수동태이다. ‘~할 것으로 예상된다’라는 뜻이다. 주어는 The success(성공, 단수)이고 of AI-powered neural implants in health care는 success를 꾸미는 말이라서 동사가 is이다. implants(복수)에 맞춰 are를 쓰면 안 된다.", "n": ["be expected to V = ~할 것으로 예상되다", "주어 찾기: 수식어(of ~ in ~)를 건너뛰고 The success(단수) → is"], "q": "The success of ... implants ___ expected에서 is/are 중 무엇이고 왜인가?", "a": "is — 주어가 단수 The success이고 of ~ in ~은 수식어이다.", "p": "The success of AI-powered neural implants in health care is also expected"}, {"t": "spread : 퍼지다 (자동사)", "c": "g", "x": "spread(퍼지다)는 spread-spread-spread로 변하는 동사이다. 여기서는 목적어 없이 쓰인 자동사로 ‘다른 산업 분야로도 퍼지다’라는 뜻이다. 타동사일 때는 ‘~을 퍼뜨리다’이고, 명사로는 ‘확산’이라는 뜻이다.", "n": ["spread (자동사) = 퍼지다 / (타동사) = ~을 퍼뜨리다", "spread - spread - spread"], "q": "spread의 3단 변화는 무엇이며, 이 문장에서 자동사인가 타동사인가?", "a": "spread-spread-spread / 자동사 (목적어 없이 to other industries가 이어진다)", "p": "spread"}, {"t": "predict that ~ : 명사절 접속사 that", "c": "b", "x": "Some futurists predict that these implants will become ...에서 that은 ‘~라는 것’을 뜻하는 명사절 접속사이다. that 뒤에 주어(these implants)와 동사(will become)가 갖춰진 완전한 절이 와서 predict(예측하다)의 목적어가 된다. that절 안에서는 will become ... and (will) ... change처럼 두 동사가 and로 연결되어 있다.", "n": ["predict + that + 주어 + 동사 = ~라고 예측하다", "that + 완전한 절 = 명사절 (목적어)"], "q": "predict that ~에서 that절은 문장에서 어떤 역할인가?", "a": "predict의 목적어 역할을 하는 명사절", "p": "predict that"}, {"t": "make + it(가목적어) + 형용사 + to부정사 : ~하는 것을 …하게 만들다", "c": "k", "x": "make it possible to install ...에서 it은 가목적어이고, 진짜 목적어는 뒤의 to install ...이다. to부정사구가 길어서 it을 먼저 두고 to부정사구를 뒤로 보낸 것이다. possible은 목적격보어(형용사)이다. 해석은 ‘~하는 것을 가능하게 만든다’이다.", "n": ["make + it + 형용사 + to V = ~하는 것을 …하게 만들다", "it = 가목적어 / to V = 진목적어"], "q": "make it possible to install에서 it과 to install은 각각 무엇인가?", "a": "it은 가목적어, to install ...은 진목적어", "p": "make it possible to install"}, {"t": "software that can read ... : 주격 관계대명사 that · 어순", "c": "b", "x": "software that can read our minds에서 that은 주격 관계대명사로, 선행사 software를 꾸미고 바로 뒤에 동사 can read가 온다. ‘우리의 마음을 읽을 수 있는 소프트웨어’라는 뜻이다. install A in B(A를 B에 설치하다)에서 목적어 software가 관계절 때문에 길어져서 in our brains 뒤에 놓였다.", "n": ["선행사 + that + 동사 = ~하는 (주격 관계대명사)", "install A in B = A를 B에 설치하다"], "q": "software that can read에서 that의 역할은 무엇이고 선행사는 무엇인가?", "a": "주격 관계대명사 / 선행사는 software", "p": "software that can read our minds"}, {"t": "enable + 목적어 + to V : ~가 …할 수 있게 해 주다", "c": "k", "x": "This could enable us to play games, type social media messages, and stream music에서 enable은 ‘enable + 목적어 + to V’ 모양으로 쓰였다. ‘우리가 ~할 수 있게 해 준다’라는 뜻이다. to play, (to) type, (to) stream이 and로 연결된 병렬 구조라서 모두 같은 동사원형 모양이다.", "n": ["enable + O + to V = O가 ~할 수 있게 해 주다", "A, B, and C 병렬: 같은 모양으로 연결"], "q": "enable us to play games, type ..., and stream ...에서 병렬로 연결된 동사 3개는 무엇인가?", "a": "play, type, stream", "p": "enable us to play games, type social media messages, and stream music"}, {"t": "There is + 주어 : 유도부사 there · 수일치", "c": "b", "x": "There is also great potential for ...는 ‘~이(가) 있다’는 뜻의 There + be + 주어 구문이다. 주어는 be동사 뒤의 great potential(큰 잠재력, 단수)이라서 be동사가 is이다. 뒤의 memory-enhancing brain implants(복수)에 맞춰 are를 쓰지 않는다. for ~는 potential을 꾸미는 말이다.", "n": ["There + be + 주어 : be동사는 뒤의 주어에 수일치", "potential for ~ = ~에 대한 잠재력"], "q": "There ___ also great potential for ... implants에서 is/are 중 무엇이고 왜인가?", "a": "is — 주어가 단수 great potential이다.", "p": "There is also great potential"}, {"t": "allow + 목적어 + to V : ~가 …하도록 허락하다[가능하게 하다]", "c": "k", "x": "Such devices would allow us to capture and enhance memories에서 allow는 ‘allow + 목적어 + to V’ 모양이다. ‘우리가 ~할 수 있게 해 준다’라는 뜻이다. to capture and (to) enhance처럼 and로 두 동사가 병렬 연결된다. would는 이런 장치가 생긴다면 가능할 일을 가정해서 말하는 조동사이다.", "n": ["allow + O + to V = O가 ~하도록 허락하다, ~할 수 있게 해 주다", "to V1 and (to) V2 = 병렬"], "q": "allow us to capture and enhance에서 capture와 enhance의 관계는 무엇인가?", "a": "and로 연결된 병렬 구조 (둘 다 allow의 to부정사)", "p": "allow us to capture and enhance"}, {"t": "them = 기억들", "c": "o", "x": "upload and download them의 them은 앞에 나온 memories(기억들)를 가리킨다. ‘기억들을 업로드하고 다운로드한다’라는 뜻이다. devices(장치들)가 아니라 업로드·다운로드되는 대상인 기억이다.", "n": ["them = memories", "업로드·다운로드되는 대상 = 기억"], "q": "upload and download them의 them은 무엇을 가리키는가?", "a": "기억들 (memories)", "p": "them"}, {"t": "look through ~ · back ~ up : ~을 살펴보다 · ~을 백업하다", "c": "g", "x": "look through ~는 ‘~을 살펴보다’라는 뜻의 구동사이다. look through our memories like a social media feed는 ‘소셜 미디어 피드처럼 기억을 살펴보다’라는 뜻이다. back up(백업하다)도 구동사이고 back ~ up 모양으로 목적어를 사이에 둘 수 있다. 여기서는 back up our most valuable memories(가장 소중한 기억을 백업하다)로 쓰였다.", "n": ["look through ~ = ~을 살펴보다", "back ~ up = ~을 백업하다"], "q": "look through와 back up은 각각 무슨 뜻인가?", "a": "look through = 살펴보다 / back up = 백업하다", "p": "look through"}, {"t": "the way (that) 주어 + 동사 : 관계부사의 생략", "c": "b", "x": "the way our brains work는 ‘우리 뇌가 작동하는 방식’이라는 뜻이다. the way 뒤에는 관계부사 how에 해당하는 말이 오는데, the way와 how는 함께 쓰지 않고 how에 해당하는 말(in which나 that)은 생략할 수 있다. 그래서 the way 바로 뒤에 our brains work(주어 + 동사)가 이어진다.", "n": ["the way + 주어 + 동사 = ~하는 방식 (관계부사 생략)", "the way how는 함께 쓰지 않음"], "q": "the way our brains work에서 생략된 것은 무엇인가?", "a": "관계부사 (how / in which에 해당)", "p": "the way our brains work"}, {"t": "shift from A to B : A에서 B로 바뀌다 (to + 동명사)", "c": "k", "x": "The role of the brain would shift from learning and storing information to processing ...는 ‘뇌의 역할이 학습하고 저장하는 것에서 처리하는 것으로 바뀐다’라는 뜻이다. from A to B에서 A와 B 자리에 동명사가 와서 learning and storing, processing이 된다. 이때 to는 전치사라서 뒤에 동명사(-ing)가 온다. data provided by the implants는 과거분사구가 data를 뒤에서 꾸미는 모양이다.", "n": ["from A to B = A에서 B로 (전치사 to + 동명사)", "명사 + p.p.구 = ~되는[~된] 명사"], "q": "from ... to processing에서 to 뒤에 동명사가 온 이유는 무엇인가?", "a": "이때의 to는 전치사이기 때문이다.", "p": "from learning and storing information to processing"}, {"t": "instead of ~ : ~ 대신에", "c": "g", "x": "instead of ~는 ‘~ 대신에’라는 뜻의 전치사 역할을 하는 표현이다. 뒤에 명사나 동명사가 오기 때문에 Instead of simply memorizing information처럼 -ing 모양이 이어진다. 뒤에 이어지는 주절의 download, use, generate가 병렬로 연결되어 ‘다운로드하고, 발휘하고, 창출한다’는 뜻이 된다.", "n": ["instead of + 명사/동명사 = ~ 대신에", "would be able to V = ~할 수 있게 될 것이다"], "q": "Instead of 뒤에는 어떤 모양이 오는가?", "a": "명사 또는 동명사(-ing)", "p": "Instead of simply memorizing"}]}, {"no": 4, "id": "z4", "sents": [{"n": 22, "mk": "Before we can fully [1|embrace] the era of AI-powered neural implants, many tricky ethical issues [2|should be addressed].", "en": "Before we can fully embrace the era of AI-powered neural implants, many tricky ethical issues should be addressed.", "ko": "우리가 AI 기반 신경 임플란트 시대를 완전히 받아들이기 전에, 여러 가지 까다로운 윤리적 문제들이 해결되어야 합니다."}, {"n": 23, "mk": "[3|The integration of AI technology with the human brain raises] concerns about what it means to be human.", "en": "The integration of AI technology with the human brain raises concerns about what it means to be human.", "ko": "AI 기술과 인간의 뇌를 통합하는 것은 인간이라는 존재가 무엇을 의미하는가에 대한 우려를 제기합니다."}, {"n": 24, "mk": "Our brains [4|are believed to be] central to our [5|identity, existence, and value] as human beings.", "en": "Our brains are believed to be central to our identity, existence, and value as human beings.", "ko": "우리의 두뇌는 인간으로서의 정체성, 존재, 가치의 중심이라고 여겨집니다."}, {"n": 25, "mk": "However, an [6|over-reliance on] technology may delay our natural development and create confusion about [7|whether we are human, AI, or something in between].", "en": "However, an over-reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between.", "ko": "그러나 기술에 대한 지나친 의존은 우리의 자연스러운 발달을 지연시키고 우리가 인간인지, AI인지, 아니면 그 중간인지에 대한 혼란을 야기할 수 있습니다."}, {"n": 26, "mk": "Another critical issue is privacy.", "en": "Another critical issue is privacy.", "ko": "또 다른 중요한 문제는 프라이버시입니다."}, {"n": 27, "mk": "There's [8|a risk that] organizations or hackers could [9|access] personal data without permission through AI-connected implants.", "en": "There's a risk that organizations or hackers could access personal data without permission through AI-connected implants.", "ko": "조직이나 해커가 AI와 연결된 임플란트를 통해 허가 없이 개인 정보에 접근할 수 있는 위험이 있습니다."}, {"n": 28, "mk": "This means that our thoughts, emotions, and behaviors could be controlled by hackers.", "en": "This means that our thoughts, emotions, and behaviors could be controlled by hackers.", "ko": "이는 우리의 생각, 감정, 행동이 해커에 의해 통제될 수 있다는 뜻입니다."}, {"n": 29, "mk": "There's an additional risk that this technology could [10|lead to even greater social inequality], [11|given that] [12|it] may not be available to all due to [12|its] high cost.", "en": "There's an additional risk that this technology could lead to even greater social inequality, given that it may not be available to all due to its high cost.", "ko": "또한 이 기술은 높은 비용으로 인해 모든 사람에게 제공되지 않을 수 있다는 점에서 사회적 불평등을 더욱 심화시킬 수 있다는 추가적인 위험도 있습니다."}, {"n": 30, "mk": "Such unequal [9|access] to the technology could intensify the division between [13|those who can afford the implants] and [13|those who cannot].", "en": "Such unequal access to the technology could intensify the division between those who can afford the implants and those who cannot.", "ko": "기술에 대한 이러한 불평등한 접근성은 임플란트 비용을 감당할 수 있는 사람과 그렇지 않은 사람 사이의 분열을 심화시킬 수 있습니다."}], "items": [{"t": "embrace : ~을 포용하다, 받아들이다", "c": "g", "x": "embrace는 원래 ‘껴안다’라는 뜻에서 나와, 새로운 것을 ‘받아들이다’라는 뜻으로 쓴다. Before we can fully embrace the era of AI-powered neural implants는 ‘우리가 AI 기반 신경 임플란트 시대를 완전히 받아들이기 전에’라는 뜻이다. fully(완전히)가 embrace를 꾸며 준다.", "n": ["embrace = ~을 포용하다, 받아들이다", "fully embrace = 완전히 받아들이다"], "q": "fully embrace the era of AI-powered neural implants에서 embrace의 뜻은?", "a": "~을 받아들이다 (포용하다)", "p": "embrace"}, {"t": "should be addressed : 조동사 + be p.p. (수동태)", "c": "b", "x": "should be addressed는 should + be + p.p.로 ‘해결되어야 한다’라는 뜻의 수동태이다. 주어 many tricky ethical issues(까다로운 윤리적 문제들)는 ‘다루어지는’ 대상이라서 수동태를 쓴다. address는 여기서 ‘~을 다루다, ~에 대처하다’라는 뜻의 동사이다. (명사 address는 ‘주소, 연설’이라는 뜻이다.)", "n": ["조동사 + be + p.p. = ~되어야 한다 (조동사가 있는 수동태)", "address v. = ~을 다루다[~에 대처하다]"], "q": "should be addressed는 어떤 형태이고 무슨 뜻인가?", "a": "조동사 + be + p.p.의 수동태 — 해결되어야 한다 (다루어져야 한다)", "p": "should be addressed"}, {"t": "The integration ... raises : 주어 수일치 + 타동사 raise", "c": "b", "x": "주어는 The integration(통합, 단수)이고 of AI technology with the human brain은 이를 꾸미는 수식어구라서 동사가 raises이다. 수식어구 안의 명사에 끌려 동사를 정하지 않는다. raise는 ‘~을 제기하다’라는 타동사라서 바로 뒤에 목적어 concerns(우려)가 온다. (rise는 ‘오르다’라는 뜻으로 목적어 없이 쓴다.)", "n": ["주어 찾기: 수식어구(of ... with ...)를 건너뛰고 integration → 단수 동사 raises", "raise v. = ~을 제기하다 (타동사) / rise v. = 오르다"], "q": "The integration of AI technology with the human brain ___ concerns에서 raise와 raises 중 무엇이고 왜인가?", "a": "raises — 주어가 단수 integration이고 of ... brain은 수식어구이다.", "p": "The integration of AI technology with the human brain raises"}, {"t": "are believed to be : ~라고 여겨진다 (의식동사의 수동태)", "c": "k", "x": "Our brains are believed to be central to ...는 ‘우리의 두뇌는 ~의 중심이라고 여겨진다’라는 뜻이다. 주어 brains가 ‘믿어지는’ 대상이라서 수동태 are believed가 쓰이고, to부정사 to be가 이어진다. It is believed that our brains are ...나 People believe that our brains are ...로 바꿔 쓸 수 있다.", "n": ["주어 + is/are believed + to부정사 = It is believed that + 주어 + 동사 = People believe that + 주어 + 동사", "say, believe, think 등의 수동태 + to부정사 = ~라고 말해진다/여겨진다/생각된다"], "q": "Our brains are believed to be central to ...를 It으로 시작하는 문장으로 바꾸면?", "a": "It is believed that our brains are central to ...", "p": "are believed to be"}, {"t": "identity, existence, and value : A, B, and C 병렬", "c": "b", "x": "central to our identity, existence, and value as human beings에서 identity(정체성), existence(존재), value(가치)가 and로 연결된 명사 세 개이다. 병렬 구조에서는 같은 형태끼리 나열하고, 셋 이상일 때는 마지막 앞에 and를 둔다. central to ~는 ‘~에 중심인’, as human beings는 ‘인간으로서’라는 뜻이다.", "n": ["A, B, and C = 같은 형태(여기서는 명사)끼리 병렬", "central to ~ = ~에 중심인"], "q": "and로 병렬된 세 단어는 무엇이고 품사는 무엇인가?", "a": "identity, existence, value — 모두 명사", "p": "identity, existence, and value"}, {"t": "over-reliance on ~ : ~에 대한 지나친 의존", "c": "g", "x": "over-reliance는 ‘지나친 의존’이라는 뜻의 명사이고, 전치사 on과 함께 over-reliance on technology(기술에 대한 지나친 의존)로 쓴다. 이 표현이 문장의 주어이고, 동사 may delay(~을 지연시킬 수 있다)와 create(~을 야기하다)가 and로 이어진다.", "n": ["over-reliance on ~ = ~에 대한 지나친 의존", "delay v. = ~을 지연시키다"], "q": "over-reliance on technology의 뜻은?", "a": "기술에 대한 지나친 의존", "p": "over-reliance on"}, {"t": "whether A, B, or C : A인지, B인지, 아니면 C인지", "c": "k", "x": "about whether we are human, AI, or something in between에서 whether는 ‘~인지 (아닌지)’라는 뜻의 명사절 접속사이다. 이 절은 전치사 about의 목적어이고, 뒤에 we are처럼 주어와 동사가 온다. human, AI, something in between 세 가지가 or로 연결된 보어이다. in between은 ‘그 사이에 있는’이라는 뜻이다.", "n": ["whether + 주어 + 동사 = ~인지 (아닌지)", "whether A, B, or C = A인지 B인지 C인지"], "q": "whether가 이끄는 절은 어떻게 해석하는가?", "a": "우리가 인간인지, AI인지, 아니면 그 중간인지", "p": "whether we are human, AI, or something in between"}, {"t": "a risk that ~ : ~라는 위험 (동격의 that)", "c": "k", "x": "There's a risk that organizations or hackers could access personal data ...에서 that 이하는 a risk의 내용을 설명하는 동격의 that절이며 ‘~라는 위험’으로 해석한다. that 뒤에 organizations or hackers could access personal data처럼 주어와 목적어가 모두 있는 완전한 절이 오는 점이 관계대명사 that과 다르다. There's는 There is의 줄임말이고, 뒤의 a risk가 단수 주어라서 is를 쓴다.", "n": ["명사 + that + 완전한 절 = ~라는 (동격의 that)", "관계대명사 that 뒤에는 주어나 목적어가 빠진 불완전한 절"], "q": "a risk that 뒤의 절은 완전한가, 불완전한가? 이 that의 역할은?", "a": "완전한 절 — 앞 명사 a risk의 내용을 설명하는 동격의 that", "p": "a risk that organizations or hackers could access personal data"}, {"t": "access : ~에 접근하다 (타동사)", "c": "b", "x": "could access personal data는 ‘개인 정보에 접근할 수 있다’라는 뜻이다. 동사 access는 타동사라서 전치사 to 없이 바로 목적어 personal data를 쓴다. 명사로 쓸 때는 access to ~(~에 대한 접근)처럼 to가 필요하다. 마지막 문장의 Such unequal access to the technology가 그 예이다.", "n": ["access v. = ~에 접근하다 (전치사 없이 목적어)", "access n. + to ~ = ~에 대한 접근"], "q": "access personal data에서 access 뒤에 to가 필요한가?", "a": "필요 없다. 타동사라서 바로 목적어를 쓴다.", "p": "access personal data"}, {"t": "lead to ~ : ~로 이어지다, ~을 초래하다", "c": "g", "x": "this technology could lead to even greater social inequality는 ‘이 기술이 사회적 불평등을 더욱 심화시킬 수 있다’라는 뜻이다. lead to는 ‘~로 이어지다’라는 구동사이고, 여기서 to는 전치사라서 뒤에 명사(구)가 온다. even은 비교급 greater를 강조하는 부사로 ‘훨씬, 더욱’이라는 뜻이다.", "n": ["lead to ~ = ~로 이어지다, ~을 초래하다", "even + 비교급 = 훨씬 더 ~한 (비교급 강조)"], "q": "lead to even greater social inequality는 어떻게 해석하는가?", "a": "사회적 불평등을 더욱 심화시키다 (더 큰 사회적 불평등으로 이어지다)", "p": "lead to even greater social inequality"}, {"t": "given that ~ : ~을 고려하면, ~라는 점에서", "c": "k", "x": "given that it may not be available to all due to its high cost는 ‘높은 비용 때문에 모든 사람에게 제공되지 않을 수 있다는 점을 고려하면’이라는 뜻이다. given that은 접속사처럼 쓰여 뒤에 주어와 동사가 있는 절이 온다. considering (that) ~, taking into consideration (that) ~과 같은 뜻이다. due to its high cost의 due to ~(~ 때문에) 뒤에는 명사구가 온다.", "n": ["given (that) ~ = considering (that) ~ = taking into consideration (that) ~ = ~을 고려하면", "due to + 명사(구) = ~ 때문에"], "q": "given that ~은 어떤 뜻이고, 같은 뜻의 표현 하나는?", "a": "~을 고려하면 / considering (that) ~", "p": "given that"}, {"t": "it, its = 이 기술", "c": "o", "x": "given that it may not be available에서 it은 앞에 나온 주어 this technology(이 기술)를 가리킨다. 그래서 ‘이 기술이 모든 사람에게 제공되지 않을 수 있다’라는 뜻이 된다. due to its high cost의 its도 같은 this technology를 가리켜 ‘이 기술의 높은 비용’이 된다.", "n": ["it = this technology", "its = this technology's (이 기술의)"], "q": "it may not be available의 it과 its high cost의 its는 각각 무엇을 가리키는가?", "a": "둘 다 this technology (이 기술)", "p": "it may not be available"}, {"t": "those who ~ : ~하는 사람들 (주격 관계대명사 who)", "c": "k", "x": "those who can afford the implants and those who cannot에서 those는 ‘사람들’이고, who는 those를 꾸미는 주격 관계대명사이다. who 뒤에는 주어가 빠진 can afford the implants가 온다. those who cannot 뒤에는 앞과 반복되는 afford the implants가 생략되어 있다. afford는 ‘~의 여유가 있다, ~을 감당하다’라는 뜻이다.", "n": ["those who ~ = ~하는 사람들", "반복되는 부분은 생략 가능: those who cannot (afford the implants)"], "q": "those who cannot 뒤에 생략된 말은 무엇인가?", "a": "afford the implants", "p": "those who can afford the implants"}]}, {"no": 5, "id": "z5", "sents": [{"n": 31, "mk": "I hope [5|that] we can [1|overcome] these challenges through careful consideration of neuroethics.", "en": "I hope that we can overcome these challenges through careful consideration of neuroethics.", "ko": "저는 신경 윤리에 대한 신중한 고찰을 통해 우리가 이러한 난제를 극복할 수 있기를 바랍니다."}, {"n": 32, "mk": "This field [2|highlights] the social aspects of neural technology [9|and provides] possible answers to [8|what should be considered legal and ethical].", "en": "This field highlights the social aspects of neural technology and provides possible answers to what should be considered legal and ethical.", "ko": "이 분야는 신경 기술의 사회적 측면을 강조하고 무엇이 합법적이고 윤리적으로 여겨져야 하는지에 대한 가능한 대답을 제시합니다."}, {"n": 33, "mk": "I [7|think] [6|it is important to] establish a prior review process and thoroughly assess the ethical aspects before any kind of brain research is [3|conducted].", "en": "I think it is important to establish a prior review process and thoroughly assess the ethical aspects before any kind of brain research is conducted.", "ko": "저는 어떤 종류의 뇌 연구를 수행하기 전에 사전 검토 프로세스를 확립하고 윤리적 측면을 철저히 평가하는 것이 중요하다고 생각합니다."}, {"n": 34, "mk": "This will ensure [5|that] science and technology progress [4|in accordance with] ethical principles.", "en": "This will ensure that science and technology progress in accordance with ethical principles.", "ko": "이는 과학과 기술이 윤리적 원칙에 따라 발전하도록 보장할 것입니다."}, {"n": 35, "mk": "What do you think about this technology?", "en": "What do you think about this technology?", "ko": "이 기술에 대해 여러분은 어떻게 생각하시나요?"}, {"n": 36, "mk": "Please share your opinion in the comments section below.", "en": "Please share your opinion in the comments section below.", "ko": "아래 댓글란에 여러분의 의견을 공유해 주세요."}, {"n": 37, "mk": "Eric Davis: Wow, AI-powered neural implants [13|sound incredible]!", "en": "Eric Davis: Wow, AI-powered neural implants sound incredible!", "ko": "Eric Davis: 와, AI 기반 신경 임플란트는 정말 놀랍네요!"}, {"n": 38, "mk": "I can't believe [5|that] AI can [10|help] [11|the disabled] [10|walk again] and use artificial arms that move according to their thoughts!", "en": "I can't believe that AI can help the disabled walk again and use artificial arms that move according to their thoughts!", "ko": "AI가 장애인을 다시 걸을 수 있게 돕고 생각에 따라 움직이는 의수를 사용하도록 도와줄 수 있다는 것이 믿기지 않아요!"}, {"n": 39, "mk": "Yumi Lee: Well, the technology [13|sounds amazing], but I'm really worried about the [12|privacy issues it might cause].", "en": "Yumi Lee: Well, the technology sounds amazing, but I'm really worried about the privacy issues it might cause.", "ko": "Yumi Lee: 음, 이 기술은 대단해 보이지만, 저는 이로 인해 발생할 수 있는 프라이버시 문제가 정말 걱정됩니다."}, {"n": 40, "mk": "I [7|think] [6|it is necessary] [14|to strictly enforce] privacy laws to protect the personal information of individuals.", "en": "I think it is necessary to strictly enforce privacy laws to protect the personal information of individuals.", "ko": "개인 정보 보호를 위해 개인 정보 보호법을 엄격하게 시행할 필요가 있다고 생각합니다."}, {"n": 41, "mk": "Andy Taylor: [15|Thank you all for sharing] your thoughts.", "en": "Andy Taylor: Thank you all for sharing your thoughts.", "ko": "Andy Taylor: 의견을 공유해 주신 모든 분께 감사드립니다."}, {"n": 42, "mk": "I'll talk more about [16|how to address] the concerns in my next post.", "en": "I'll talk more about how to address the concerns in my next post.", "ko": "저의 다음 글에서 이러한 우려를 해결하는 방법에 관해 더 이야기해 보겠습니다."}], "items": [{"t": "overcome : ~을 극복하다", "c": "g", "x": "overcome은 ‘~을 극복하다, 이겨내다’라는 뜻이다. 본문에서는 overcome these challenges로 쓰여 ‘이러한 난제를 극복하다’라는 뜻이다. challenge(도전, 난제)와 함께 외워 두면 좋다.", "n": ["overcome = ~을 극복하다 (= get over)", "challenge = 도전, 난제"], "q": "overcome these challenges는 무슨 뜻인가?", "a": "이러한 난제를 극복하다", "p": "overcome these challenges"}, {"t": "highlight : ~을 강조하다", "c": "g", "x": "highlight는 ‘~을 강조하다’라는 동사이다. 이 분야(neuroethics)가 신경 기술의 사회적 측면을 강조한다는 문맥이다. 주어가 This field(단수)라서 highlights로 -s가 붙었다.", "n": ["highlight = ~을 강조하다", "aspect = 측면"], "q": "highlights the social aspects에서 highlights의 뜻은?", "a": "강조하다", "p": "highlights the social aspects of neural technology"}, {"t": "conduct : ~을 수행하다", "c": "g", "x": "conduct는 여러 뜻이 있는데 research와 함께 쓰이면 ‘(연구·조사를) 수행하다’라는 뜻이다. 본문의 is conducted는 동사 conduct의 과거분사 형태로 be동사와 함께 수동태를 이루어 ‘수행되다’라는 뜻이다.", "n": ["conduct research = 연구를 수행하다", "be  "should be p.p. = ~되어야 한다"], "q": "should be considered는 어떤 형태인가?", "a": "조동사 should + 수동태(be + p.p.)", "p": "what should be considered legal and ethical"}, {"t": "병렬연결 : A and B", "c": "b", "x": "highlights ... and provides ...에서 and가 동사 highlights와 provides를 같은 형태로 연결한다. 주어 This field가 같으므로 두 동사 모두 -s가 붙었다. 병렬은 and 앞뒤의 형태를 똑같이 맞추는 것이다.", "n": ["A and B : 같은 형태끼리 연결", "highlights ... and provides ... (동사끼리 병렬)"], "q": "and provides는 어떤 동사와 연결되는가?", "a": "highlights", "p": "and provides"}, {"t": "help + 목적어 + 동사원형 : ~가 …하도록 돕다", "c": "k", "x": "help the disabled walk again에서 help 뒤에 목적어(the disabled)와 동사원형(walk)이 이어진다. ‘장애인이 다시 걸을 수 있게 돕다’라는 뜻이다. help는 목적격 보어로 동사원형이나 to부정사를 모두 쓸 수 있다.", "n": ["help + 목적어 + 동사원형[to부정사] = ~가 …하도록 돕다", "walk again and use ... (동사원형끼리 병렬)"], "q": "help the disabled walk again에서 walk의 형태는 무엇인가?", "a": "동사원형 (목적격 보어)", "p": "help"}, {"t": "the + 형용사 : ~한 사람들", "c": "k", "x": "the disabled는 형용사 disabled 앞에 the를 붙여 ‘장애인들’이라는 뜻으로 쓴 것이다. ‘the + 형용사’는 보통 복수 사람(~한 사람들)을 뜻한다. 그래서 the disabled는 disabled people과 같은 뜻이다.", "n": ["the + 형용사 = ~한 사람들 (복수 취급)", "the disabled = disabled people = 장애인들"], "q": "the disabled는 무슨 뜻인가?", "a": "장애인들 (= disabled people)", "p": "the disabled"}, {"t": "목적격 관계대명사의 생략 : issues (that) it might cause", "c": "b", "x": "the privacy issues it might cause에서 issues와 it 사이에 목적격 관계대명사 that[which]가 생략되어 있다. cause의 목적어가 앞의 issues이므로, 목적격 관계대명사 that[which]가 생략되어 issues (that) it might cause 형태가 된다. 명사 뒤에 ‘주어 + 동사’가 바로 이어지면 관계대명사 생략을 의심한다. 여기서 it은 the technology를 가리킨다.", "n": ["명사 + (목적격 관계대명사) + 주어 + 동사", "issues (that) it might cause = 그것이 일으킬 수 있는 문제"], "q": "issues it might cause 사이에 생략된 말은?", "a": "목적격 관계대명사 (that / which)", "p": "issues it might cause"}, {"t": "sound + 형용사 : ~하게 들리다", "c": "k", "x": "sound incredible, sounds amazing에서 sound는 ‘~하게 들리다’라는 뜻의 동사이다. 뒤에 부사가 아니라 형용사(incredible, amazing)가 보어로 온다. amazing은 ‘놀라운’이라는 뜻의 분사형 형용사이다.", "n": ["sound + 형용사 = ~하게 들리다", "sound 뒤에는 부사가 아닌 형용사"], "q": "sounds amazing에서 a var CAT={g:'어휘',b:'문법',k:'핵심문법',o:'대명사'};
var S={sec:1,drill:null};try{var _m=/[?&]s=(\d+)/.exec(location.search);if(_m&&D.secs.some(function(x){return x.no==+_m[1]}))S.sec=+_m[1]}catch(e){}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sec(){return D.secs.filter(function(s){return s.no==S.sec})[0]}
function refOf(t){var r=t.split(' = ')[1]||'',q=r.match(/\(([^)]*)\)\s*$/);return q?q[1]:r}
function marks(mk,s,mode,only,sn){
  /* mode: 'all' 모든 칠하기(누르면 해설로) / 'color' 한 색만 / 'item' 한 항목만 */
  var out='',pos=0,re=/\[(\d+)\|([^\]]*)\]/g,m;
  while((m=re.exec(mk))){
    out+=esc(mk.slice(pos,m.index));
    var i=+m[1],c=s.items[i-1].c,t=esc(m[2]);
    if(mode=='all')out+='<span class="hlk c-'+c+'" data-i="'+i+'" data-sn="'+sn+'">'+t+'</span>'+(c=='o'?'<sup class="rf c-o">(='+esc(refOf(s.items[i-1].t))+')</sup>':'');
    else if(mode=='color'&&c==only)out+='<span class="hl c-'+c+'">'+t+'</span>';
    else if(mode=='item'&&i==only)out+='<span class="hl c-'+c+'">'+t+'</span>';
    else out+=t;
    pos=re.lastIndex}
  return out+esc(mk.slice(pos))}
function noteBox(n){return '<div class="note"><div class="nl">노트 정리</div>'+n.map(function(l){return '<div class="ln">'+esc(l)+'</div>'}).join('')+'</div>'}
function drillBar(cur){return '<div class="drb">'+['g','b','k','o'].map(function(k){return '<button type="button" class="c-'+k+(cur==k?' on':'')+'" data-dr="'+k+'">'+CAT[k]+'</button>'}).join('')+'</div>'}
function firstSent(s,i){for(var k=0;k<s.sents.length;k++){if(new RegExp('\\['+i+'\\|').test(s.sents[k].mk))return s.sents[k]}return s.sents[0]}
function vDrill(){
