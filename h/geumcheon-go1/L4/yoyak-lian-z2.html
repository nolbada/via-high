var DATA={"meta": {"sch": "geumcheon-go1", "src": "geumcheon-go1/L4/sx-data.js", "pidx": 1, "lesson": "4과", "title": "AI Neural Implants", "label": "❷", "page": "yoyak-lian-z2"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "의료에서 성공한 AI 임플란트가 다른 산업으로 퍼질 것이라고 [[expected|예상된다]].", "en": ["The success of AI-powered neural implants in health care is also expected to spread to other industries."], "kos": ["의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상된다."]}, {"tag": "본문 2번", "ns": [2], "line": "미래학자들은 20~30년 안에 일상이 크게 바뀐다고 [[predict|예측한다]].", "en": ["Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives."], "kos": ["일부 미래학자들은 이러한 임플란트가 향후 20~30년 이내에 상용화되어 우리의 일상을 크게 변화시킬 것이라고 예측한다."]}, {"tag": "본문 3번", "ns": [3], "line": "마음을 읽는 소프트웨어를 뇌에 [[install|설치할]] 수 있게 된다.", "en": ["For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds."], "kos": ["예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다."]}, {"tag": "본문 4번", "ns": [4], "line": "생각만으로 게임, 메시지, 음악이 되도록 [[enable|가능하게]] 해 준다.", "en": ["This could enable us to play games, type social media messages, and stream music simply by thinking."], "kos": ["이것은 우리가 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍하는 것이 가능하도록 해 줄 것이다."]}, {"tag": "본문 5~6번", "ns": [5, 6], "line": "기억력 임플란트는 기억을 담고 [[enhance|높여]] 준다.", "en": ["There is also great potential for memory-enhancing brain implants, similar to computer memory chips.", "Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud."], "kos": ["컴퓨터 메모리 칩과 유사한 기억력 향상 뇌 임플란트도 큰 잠재력을 가지고 있다.", "이러한 장치를 사용하면 기억을 캡처하고 향상시킬 수 있으며, 디지털 클라우드를 사용하여 기억을 업로드 및 다운로드할 수도 있다."]}, {"tag": "본문 7번", "ns": [7], "line": "기억을 공유하고, [[valuable|소중한]] 기억은 백업한다.", "en": ["We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories."], "kos": ["우리는 소셜 미디어 피드처럼 기억을 살펴보고, 인생에서 가장 좋았던 순간을 생생하게 회상하고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것이다."]}, {"tag": "본문 8번", "ns": [8], "line": "마지막으로, 뇌의 작동 방식에 [[revolutionize|혁명을 일으킨다]].", "en": ["Finally, AI-powered neural implants would revolutionize the way our brains work."], "kos": ["마지막으로, AI 기반 신경 임플란트는 우리 뇌의 작동 방식에 혁명을 일으킬 것이다."]}, {"tag": "본문 9~10번", "ns": [9, 10], "line": "뇌는 지식을 내려받고 새 아이디어를 [[generate|만들어 낸다]].", "en": ["The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants.", "Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas."], "kos": ["뇌의 역할이 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀌게 될 것이다.", "우리는 단순히 정보를 암기하는 대신 지식을 다운로드하고, 창의력을 발휘하여 그 지식을 해석하고, 새로운 아이디어를 창출할 수 있게 될 것이다."]}], "story": [{"a": "expect", "form": "expected", "n": 1, "sq": 1, "sum": "is [[anticipated]] to spread to other industries", "hook": "의료의 성공이 다른 산업으로 퍼질 거라는 문장의 expected(예상되다) → 요약문에서는 anticipated(예상되다)로 바꿨어요.", "b": "anticipate", "k": "예상하다 → 예상하다, 기대하다", "en": "The success of AI-powered neural implants in health care is also expected to spread to other industries.", "ko": "의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상된다."}, {"a": "predict", "form": "predict", "n": 2, "sq": 1, "sum": "some futurists [[forecast]] that they will greatly change our daily lives", "hook": "미래학자들이 앞날을 말하는 문장의 predict(예측하다) → 요약문에서는 forecast(예측하다)로 바꿨어요.", "b": "forecast", "k": "예측하다 → 예측하다", "en": "Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives.", "ko": "일부 미래학자들은 이러한 임플란트가 향후 20~30년 이내에 상용화되어 우리의 일상을 크게 변화시킬 것이라고 예측한다."}, {"a": "install", "form": "install", "n": 3, "sq": 2, "sum": "may be [[embedded]] in our brains", "hook": "마음을 읽는 소프트웨어를 뇌에 넣는 문장의 install(설치하다) → 요약문에서는 embed(심다)의 모습인 embedded로 바꿨어요.", "b": "embed", "k": "설치하다 → 심다, 박아 넣다", "en": "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds.", "ko": "예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다."}, {"a": "enable", "form": "enable", "n": 4, "sq": 2, "sum": "which would [[allow]] us to play games", "hook": "생각만으로 게임을 하게 된다는 문장의 enable(가능하게 하다) → 요약문에서는 allow(허락하다, ~하게 해 주다)로 바꿨어요.", "b": "allow", "k": "가능하게 하다 → 허락하다, ~하게 해 주다", "en": "This could enable us to play games, type social media messages, and stream music simply by thinking.", "ko": "이것은 우리가 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍하는 것이 가능하도록 해 줄 것이다."}, {"a": "enhance", "form": "enhance", "n": 6, "sq": 3, "sum": "may let us [[improve]] our memories", "hook": "기억을 담고 더 좋게 만든다는 문장의 enhance(높이다) → 요약문에서는 improve(향상시키다)로 바꿨어요.", "b": "improve", "k": "높이다 → 향상시키다", "en": "Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.", "ko": "이러한 장치를 사용하면 기억을 캡처하고 향상시킬 수 있으며, 디지털 클라우드를 사용하여 기억을 업로드 및 다운로드할 수도 있다."}, {"a": "valuable", "form": "valuable", "n": 7, "sq": 3, "sum": "our most [[precious]] ones", "hook": "가장 아끼는 기억을 백업한다는 문장의 valuable(가치 있는) → 요약문에서는 precious(소중한)로 바꿨어요.", "b": "precious", "k": "가치 있는 → 소중한", "en": "We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories.", "ko": "우리는 소셜 미디어 피드처럼 기억을 살펴보고, 인생에서 가장 좋았던 순간을 생생하게 회상하고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것이다."}, {"a": "revolutionize", "form": "revolutionize", "n": 8, "sq": 4, "sum": "would [[transform]] the way our brains work", "hook": "마지막 큰 변화를 말하는 문장의 revolutionize(혁명을 일으키다) → 요약문에서는 transform(완전히 바꾸다)으로 바꿨어요.", "b": "transform", "k": "혁명을 일으키다 → 완전히 바꾸다", "en": "Finally, AI-powered neural implants would revolutionize the way our brains work.", "ko": "마지막으로, AI 기반 신경 임플란트는 우리 뇌의 작동 방식에 혁명을 일으킬 것이다."}, {"a": "generate", "form": "generate", "n": 10, "sq": 4, "sum": "and [[produce]] new ideas", "hook": "새 아이디어가 나오는 마지막 문장의 generate(만들어 내다) → 요약문에서는 produce(만들어 내다)로 바꿨어요.", "b": "produce", "k": "만들어 내다 → 만들어 내다", "en": "Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas.", "ko": "우리는 단순히 정보를 암기하는 대신 지식을 다운로드하고, 창의력을 발휘하여 그 지식을 해석하고, 새로운 아이디어를 창출할 수 있게 될 것이다."}], "passage": [{"n": 1, "en": "The success of AI-powered neural implants in health care is also expected to spread to other industries.", "ko": "의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상된다."}, {"n": 2, "en": "Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives.", "ko": "일부 미래학자들은 이러한 임플란트가 향후 20~30년 이내에 상용화되어 우리의 일상을 크게 변화시킬 것이라고 예측한다."}, {"n": 3, "en": "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds.", "ko": "예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다."}, {"n": 4, "en": "This could enable us to play games, type social media messages, and stream music simply by thinking.", "ko": "이것은 우리가 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍하는 것이 가능하도록 해 줄 것이다."}, {"n": 5, "en": "There is also great potential for memory-enhancing brain implants, similar to computer memory chips.", "ko": "컴퓨터 메모리 칩과 유사한 기억력 향상 뇌 임플란트도 큰 잠재력을 가지고 있다."}, {"n": 6, "en": "Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.", "ko": "이러한 장치를 사용하면 기억을 캡처하고 향상시킬 수 있으며, 디지털 클라우드를 사용하여 기억을 업로드 및 다운로드할 수도 있다."}, {"n": 7, "en": "We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories.", "ko": "우리는 소셜 미디어 피드처럼 기억을 살펴보고, 인생에서 가장 좋았던 순간을 생생하게 회상하고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것이다."}, {"n": 8, "en": "Finally, AI-powered neural implants would revolutionize the way our brains work.", "ko": "마지막으로, AI 기반 신경 임플란트는 우리 뇌의 작동 방식에 혁명을 일으킬 것이다."}, {"n": 9, "en": "The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants.", "ko": "뇌의 역할이 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀌게 될 것이다."}, {"n": 10, "en": "Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas.", "ko": "우리는 단순히 정보를 암기하는 대신 지식을 다운로드하고, 창의력을 발휘하여 그 지식을 해석하고, 새로운 아이디어를 창출할 수 있게 될 것이다."}], "questions": [{"id": 1, "summary": "The success of AI-powered neural implants in medicine is (A) to spread to other industries, and some futurists (B) that they will greatly change our daily lives in 20 to 30 years.", "ko": "의료 분야에서 AI 기반 신경 임플란트의 성공은 다른 산업으로도 퍼질 것으로 <b>(A) 예상되며</b>, 일부 미래학자들은 그것이 20~30년 안에 우리의 일상을 크게 바꿀 것이라고 <b>(B) 예측한다</b>.", "opts": [["anticipated", "deny"], ["doubted", "deny"], ["doubted", "forecast"], ["anticipated", "forecast"], ["required", "hope"]], "optko": ["예상하다 – 부인하다", "의심하다 – 부인하다", "의심하다 – 예측하다", "예상하다 – 예측하다", "요구하다 – 바라다"], "ans": 3, "wrong": ["deny(부인하다)가 틀려요. 미래학자들은 부인하는 게 아니라 일상이 크게 바뀔 거라고 예측(predict)해요.", "둘 다 틀려요. doubt(의심하다)와 deny(부인하다)는 본문의 expect(예상하다), predict(예측하다)와 반대 느낌이에요.", "doubt(의심하다)가 틀려요. 본문은 성공이 다른 산업으로 퍼질 것으로 예상된다(expect)고 해요.", null, "둘 다 틀려요. require(요구하다)는 '꼭 해야 한다'는 뜻이고, hope(바라다)는 예측이 아니라 소망이에요."], "evid": [{"n": 1, "hl": ["expected to spread to other industries"]}, {"n": 2, "hl": ["predict", "significantly change our daily lives"]}], "swaps": [["expect", "anticipate", "예상하다 → 예상하다, 기대하다"], ["predict", "forecast", "예측하다 → 예측하다"], ["significantly", "greatly", "크게 → 크게, 대단히"], ["will become commercially available in the next 20 to 30 years", "will change our daily lives in 20 to 30 years", "앞으로 20~30년 안에 상용화된다 usic simply by thinking.", "ko": "신경 임플란트 기술이 발전하면, 우리의 마음을 읽을 수 있는 소프트웨어가 뇌에 <b>(A) 심어질</b> 수도 있고, 이는 우리가 생각만으로 게임을 하고 음악을 스트리밍하도록 <b>(B) 가능하게 해 줄</b> 것이다.", "opts": [["embedded", "forbid"], ["embedded", "allow"], ["removed", "forbid"], ["removed", "allow"], ["erased", "force"]], "optko": ["심다 – 금지하다", "심다 – 허락하다", "제거하다 – 금지하다", "제거하다 – 허락하다", "지우다 – 강요하다"], "ans": 1, "wrong": ["forbid(금지하다)가 틀려요. 본문은 생각만으로 게임을 할 수 있게 해 준다(enable)고 해요.", null, "둘 다 틀려요. remove(제거하다)도 forbid(금지하다)도 본문과 반대예요. 소프트웨어를 뇌에 설치(install)해요.", "remove(제거하다)가 틀려요. 본문은 소프트웨어를 뇌에 설치(install)한다고 해요.", "둘 다 틀려요. erase(지우다)가 아니라 설치하고, force(강요하다)가 아니라 가능하게 해 줘요(enable)."], "evid": [{"n": 3, "hl": ["install in our brains software that can read our minds"]}, {"n": 4, "hl": ["enable us", "simply by thinking"]}], "swaps": [["install", "embed", "설치하다 → 심다, 박아 넣다"], ["enable", "allow", "가능하게 하다 → 허락하다, ~하게 해 주다"], ["make it possible to install", "be embedded", "설치하는 것이 가능해지다 → 심어지다"]], "swapnote": "install(설치하다)은 embed(심다)로, enable(가능하게 하다)은 allow(허락하다)나 let(~하게 해 주다)으로 바뀌어 나올 수 있어요. 처음 보는 단어여도 앞뒤 뜻으로 짐작해 보세요.", "use": [{"w": "embed", "ex": "The doctor will embed a small chip in his arm.", "ko": "의사는 그의 팔에 작은 칩을 심을 것이다.", "wk": "심다", "hk": "심을"}, {"w": "allow", "ex": "This app allows you to learn English anywhere.", "ko": "이 앱은 당신이 어디서든 영어를 배울 수 있게 해 준다.", "wk": "허락하다, ~하게 해 주다", "hk": "수 있게 해 준다"}], "flow": "본문 3번에서 마음을 읽는 소프트웨어를 뇌에 설치할 수 있게 되고, 4번에서 그 덕분에 생각만으로 게임, 메시지, 음악이 가능해진다고 이어져요.", "jd": [["As neural implant technology advances,", "신경 임플란트 기술이 발전함에 따라,"], ["software that can read our minds", "우리의 마음을 읽을 수 있는 소프트웨어가"], ["may be [[embedded]] in our brains,", "우리 뇌 속에 [[심어질]] 수도 있고,"], ["which would [[allow]] us to play games and stream music", "이는 우리가 게임을 하고 음악을 스트리밍하도록 [[가능하게 해 줄]] 것이다"], ["simply by thinking.", "오직 생각만으로."]], "fc": [["본문 3번", "마음을 읽는 소프트웨어를 뇌에", "{{install|설치하다}} = 뇌 속에 넣는다는 뜻이에요."], ["본문 4번", "생각만으로 게임, 메시지, 음악", "이것을 {{enable|가능하게 하다}}한다고 해요."], ["정답 포인트", "{{install|설치하다}} function rich(t,hl){
  if(!hl||!hl.length)return words(t);
  var pos=[];hl.forEach(function(h){var i=t.indexOf(h);if(i>=0)pos.push([i,i+h.length])});
  pos.sort(function(a,b){return a[0]-b[0]});
  var c=0,o='';
  pos.forEach(function(p){if(p[0]<c)return;o+=words(t.slice(c,p[0]))+'<mark>'+words(t.slice(p[0],p[1]))+'</mark>';c=p[1]});
  return o+words(t.slice(c));
}
function sumHtml(q,done){
  var o='';
  q.summary.split(/(\(A\)|\(B\))/).forEach(function(p){
    if(p==='(A)'||p==='(B)'){
      if(done)o+='<span class="fill">'+words(q.opts[q.ans][p==='(A)'?0:1])+'</span>';
      else o+='<span class="blank">'+p+'</span>';
    }else o+=words(p);
  });
  return o;
}
function nNotes(){return Object.keys(NOTES).length}
function firstOpen(){for(var i=0;i<Qs.length;i++)if(PR.a[Qs[i].id]===undefined)return i;return -1}
function doneCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]!==undefined)n++});return n}
function okCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]===q.ans)n++});return n}
function hideSheet(){$('sheet').className=''}
var histPushed=false;
function go(v,i){
  if(i!==undefined)cur=i;
  if(v==='home'&&view!=='home'&&histPushed){histPushed=false;try{history.back();return}catch(e){}}
  if(v!=='home'&&view==='home'){try{history.pushState({v:v},'');histPushed=true}catch(e){}}
  view=v;try{if(v==='home')sessionStorage.removeItem('vhyv');else sessionStorage.setItem('vhyv',JSON.stringify({p:location.pathname,v:v,c:cur,t:Date.now()}))}catch(e){}
  hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)
}
window.addEventListener('popstate',function(){histPushed=false;view='home';try{sessionStorage.removeItem('vhyv')}catch(e){}hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)});
function sayBtn(){return ''}


/* 단어 누르기: 뜻을 보여 주고 단어노트에 자동으로 담는다 */
function tapWord(key){
  var g=G[key];if(!g)return;
  var lem=g[0],id=lem.toLowerCase();
  var n=NOTES[id]||{l:lem,k:g[1],c:0,t:0};
  n.c=(n.c||0)+1;n.t=Date.now();n.q=curQ;NOTES[id]=n;jset(K_NOTE,NOTES);
  if(!PUSHED['w:'+id]){PUSHED['w:'+id]=1;jset('vhvs:'+SCH,PUSHED);try{WN.add([{w:lem,m:g[1],src:SRC,how:'탭',ask:true}])}catch(e){}}
  $('sw').textContent=key.toLowerCase()===id?lem:key+'  →  '+lem;
  $('sl').textContent=g[1];
  $('sn').textContent='단어노트에 담았어요 (지금 '+nNotes()+'개)';
  $('sheet').className='on';
  document.querySelectorAll('.w[data-k]').forEach(function(e){var gg=G[e.getAttribute('data-k')];if(gg&&gg[0].toLowerCase()===id)e.classList.add('got')});
}
document.addEventListener('click',function(e){
  var w=e.target.closest&&e.target.closest('.w');
  if(w){e.stopPropagation();tapWord(w.getAttribute('data-k'));return}
  if(!(e.target.closest&&e.target.closest('#sheet')))hideSheet();
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');
  else if(act==='q')go('q',+v);
  else if(act==='pick')pick(+v);
  else if(act==='rmnote'){var rid=String(v);var rn=NOTES[rid];delete NOTES[rid];jset(K_NOTE,NOTES);delete PUSHED['w:'+rid];jset('vhvs:'+SCH,PUSHED);try{WN.del(rn?rn.l:rid,SRC)}catch(x){}render()}
  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}



function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}

  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';

    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';

    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';

    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});

    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});

function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}

function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}

/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
