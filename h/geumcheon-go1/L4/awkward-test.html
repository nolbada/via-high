가 맞지 않아요. rapid (빠른)와도 advancement (발전)가 짝이에요."}, {"c": 5, "w": "drawbacks", "r": "benefits", "gw": "단점", "gr": "장점", "fb": null, "fg": "In this post, we'll examine the incredible <span class=\"d\">benefits</span> of AI-powered neural implants, their amazing potential for the future, and the ethical concerns surrounding them.", "ko": "이 글에서는 AI 기반 신경 임플란트의 뛰어난 장점과 앞으로의 놀라운 잠재력, 그리고 이를 둘러싼 윤리적 우려에 대해 살펴볼 것이다.", "why": "마지막 문장은 benefits (장점들), amazing potential (놀라운 잠재력), ethical concerns (윤리적 우려) 세 가지를 차례로 말해요. incredible (믿기 어려울 만큼 대단한)이 앞에 있어서 좋은 말이 와야 하고, 걱정거리는 세 번째에서 따로 나와요. 그러니 첫 번째 자리에는 drawbacks (단점)가 아니라 benefits가 맞아요."}], "keep": "exploring (탐구하는)은 '신경계 질환 치료법을 탐구해 온 오랜 역사'라서 맞고, implanted (이식된)는 임플란트가 신경계에 '심어지는' 의료 기기라는 설명이라 그대로 둬요.", "flow": "신경 임플란트에 AI를 합친 연구를 소개하는 글의 도입이에요. 이 글은 '놀라운 장점, 놀라운 잠재력, 그리고 윤리적 걱정'을 차례로 살펴본다고 말해요. 그래서 긍정적인 말이 흐름을 이끌고, 분위기가 반대로 꺾이는 단어가 답이에요.", "ko": "신경과학은 뇌와 척수를 포함한 신경계 질환에 대한 치료법을 탐구해 온 오랜 역사가 있다. 전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔고, 이것은 신경계에 이식될 수 있는 컴퓨터 칩과 같은 의료 기기이다. 하지만 흥미로운 점은 여기 있다. 그건 바로 인공지능(AI)의 급속한 발전과 함께 연구자들이 신경 임플란트에 AI를 통합하기 시작했다는 점이다. 이 글에서는 AI 기반 신경 임플란트의 뛰어난 장점과 앞으로의 놀라운 잠재력, 그리고 이를 둘러싼 윤리적 우려에 대해 살펴볼 것이다."}, {"id": "ctx2", "kind": "ctx", "n": 2, "title": null, "tko": null, "paras": [[{"t": "First, let’s explore how this "}, {"t": "dull", "c": 1}, {"t": " technology has been applied. The AI‑powered neural implant has shown great promise in medical applications, offering solutions to a range of problems. For instance, neural implants are used to treat brain disorders like Parkinson’s disease. These implants electrically stimulate targeted regions of the brain at the right time "}, {"t": "without", "c": 2}, {"t": " the help of AI to restore normal brain activity. In addition, paralyzed people can have the ability to "}, {"t": "walk", "c": 3}, {"t": " again with the help of a “digital bridge” between two implants inserted into their brain and spine. When they think about moving their legs, the AI analyzes the brain signals and sends them to their legs through the implants. Similarly, those who have lost their arms can use artificial arms operated by the "}, {"t": "different", "c": 4}, {"t": " mechanism."}], [{"t": "How the Brain and Spinal Implants Work"}], [{"t": "‑ Brain implants "}, {"t": "send", "c": 5}, {"t": " signal"}], [{"t": "‑ Spinal implant receives signal"}], [{"t": "‑ Nerve cells carry signal to legs"}]], "items": [{"c": 1, "w": "dull", "r": "fascinating", "gw": "따분한", "gr": "매혹적인", "fb": null, "fg": "First, let's explore how this <span class=\"d\">fascinating</span> technology has been applied.", "ko": "먼저 이 매혹적인 기술이 어떻게 적용되었는지 살펴보자.", "why": "First, let's explore how this fascinating technology has been applied (먼저 이 매혹적인 기술이 어떻게 적용되었는지 살펴보자)가 원문이에요. 바로 뒤 문장에서 이 기술이 great promise (큰 가능성)를 보여 줬다고 칭찬해요. 칭찬하는 글을 여는 문장에 dull (따분한)은 어울리지 않아요."}, {"c": 2, "w": "without", "r": "with", "gw": "~없이", "gr": "~와 함께", "fb": null, "fg": "These implants electrically stimulate targeted regions of the brain at the right time <span class=\"d\">with</span> the help of AI to restore normal brain activity.", "ko": "이러한 임플란트는 정상적인 뇌 활동을 회복시키기 위해 AI의 도움을 받아 적시에 뇌의 표적 부위를 전기로 자극한다.", "why": "파킨슨병을 치료하는 임플란트가 '적시에 뇌를 자극'하는 것은 AI가 도와주기 때문이에요. 이 글의 주제가 AI-powered neural implant (AI로 작동하는 신경 임플란트)이니 AI의 도움이 있어야 해요. without the help (도움 없이)로 쓰면 글 전체 내용과 반대가 돼요. with the help of AI (AI의 도움으로)가 맞아요."}, {"c": 4, "w": "different", "r": "same", "gw": "다른", "gr": "같은", "fb": null, "fg": "Similarly, those who have lost their arms can use artificial arms operated by the <span class=\"d\">same</span> mechanism.", "ko": "마찬가지로 팔을 잃은 사람들도 동일한 메커니즘으로 작동하는 의수를 사용할 수 있다.", "why": "마비 환자는 디지털 브릿지로 걷고, 팔을 잃은 사람은 의수를 쓴다고 해요. 문장 앞의 Similarly (마찬가지로)가 힌트예요. '마찬가지로' 뒤에는 같은 방식이 와야 하니 the same mechanism (같은 원리)이 맞아요. different (다른)는 Similarly와 서로 부딪쳐요."}], "keep": "walk (걷다)는 마비 환자가 '다시 걸을 수 있다'는 내용이라 맞고, send (보내다)는 아래 정리 칸의 '신호를 보낸다'와 이어져서 그대로 둬요.", "flow": "의료 분야에서 이 기술이 어떻게 쓰였는지 보여 주는 단락이에요. '큰 가능성(great promise)'을 보여 준다고 했으니 좋은 쪽 설명이 이어져요. AI가 뇌 신호를 읽어서 다리로 보내는 과정이 계속 같은 방식으로 이어지는지 확인하세요.", "ko": "먼저 이 매혹적인 기술이 어떻게 적용되었는지 살펴보자. AI 기반 신경 임플란트는 다양한 문제에 대한 해결책을 제시하며 의료 분야 적용에서 큰 가능성을 보여 주었다. 예를 들어, 신경 임플란트는 파킨슨병과 같은 뇌 질환을 치료하는 데 사용된다. 이러한 임플란트는 정상적인 뇌 활동을 회복시키기 위해 AI의 도움을 받아 적시에 뇌의 표적 부위를 전기로 자극한다. 또한 마비 환자들은 뇌와 척추에 삽입된 두 개의 임플란트 사이에 있는 '디지털 브릿지'의 도움으로 다시 걸을 수 있는 능력을 가질 수 있다. 환자가 다리를 움직이려고 생각하면 AI가 뇌 신호를 분석하여 임플란트를 통해 다리로 신호를 보낸다. 마찬가지로 팔을 잃은 사람들도 동일한 메커니즘으로 작동하는 의수를 사용할 수 있다."}, {"id": "ctx3", "kind": "ctx", "n": 3, "title": null, "tko": null, "paras": [[{"t": "The "}, {"t": "failure", "c": 1}, {"t": " of AI‑powered neural implants in health care is also expected to spread to other industries. Some futurists predict that these implants will become commercially "}, {"t": "available", "c": 2}, {"t": " in the next 20 to 30 years and significantly change our daily lives. For example, advances in neural implant technology will make it "}, {"t": "impossible", "c": 3}, {"t": " to install in our brains software that can read our minds. This could enable us to play games, type social media messages, and stream music simply by thinking. There is also great potential for memory‑enhancing brain implants, similar to computer memory chips. Such devices would "}, {"t": "forbid", "c": 4}, {"t": " us to capture and enhance memories, and even upload and download them using the digital cloud. We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories. Finally, AI‑powered neural implants would "}, {"t": "revolutionize", "c": 5}, {"t": " the way our brains work. The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants. Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas."}]], "items": [{"c": 1, "w": "failure", "r": "success", "gw": "실패", "gr": "성공", "fb": null, "fg": "The <span class=\"d\">success</span> of AI-powered neural implants in health care is also expected to spread to other industries.", "ko": "의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상된다.", "why": "문장 끝이 is also expected to spread to other industries (다른 산업으로도 퍼질 것으로 기대된다)예요. failure (실패)가 다른 산업으로 퍼질 거라고 예상하는 건 앞뒤가 맞지 않아요. 뒤 문장에서도 임플란트가 우리 삶을 크게 바꾼다고 하니 의료 분야에서의 success (성공)가 맞아요."}, {"c": 3, "w": "impossible", "r": "possible", "gw": "불가능한", "gr": "가능한", "fb": null, "fg": "For example, advances in neural implant technology will make it <span class=\"d\">possible</span> to install in our brains software that can read our minds.", "ko": "예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다.", "why": "이 문장은 For example (예를 들어)로 시작해서 앞 내용을 보여 줘요. 바로 뒤 문장이 This could enable us to play games (이것이 우리가 게임을 하게 해 줄 수 있다)라서 마음을 읽는 소프트웨어를 설치하는 일이 '가능해진다'는 뜻이에요. impossible (불가능한)이면 뒤 문장과 이어지지 않아요."}, {"c": 4, "w": "forbid", "r": "allow", "gw": "금지하다", "gr": "허락하다", "fb": null, "fg": "Such devices would <span class=\"d\">allow</span> us to capture and enhance memories, and even upload and download them using the digital cloud.", "ko": "이러한 장치를 사용하면 기억을 캡처하고 향상시킬 수 있으며, 디지털 클라우드를 사용하여 기억을 업로드 및 다운로드할 수도 있다.", "why": "메모리 칩 같은 임플란트가 기억을 저장하고 올리고 내려받는다는 이야기예요. Such devices would ... us to capture and enhance memories (이런 장치는 우리가 기억을 담고 키우게 ...)라서 '해 준다'는 뜻의 allow (허락하다, 가능하게 하다)가 필요해요. forbid (금지하다)는 뒤에 나오는 좋은 활용 예와 맞지 않아요."}], "keep": "available (이용 가능한)은 '상용화되어 쓸 수 있게 된다'는 뜻이라 맞고, revolutionize (혁명을 일으키다)는 뇌의 역할이 크게 바뀐다는 마지막 내용과 어울려서 그대로 둬요.", "flow": "이 단락은 임플란트가 앞으로 우리 삶을 어떻게 바꿀지 '미래 전망'을 말해요. 전체가 '이런 것도 가능하다, 이렇게 달라질 것이다'로 밝은 방향이에요. 가능성과 허락을 말해야 할 자리에 막는 말이 오면 어색해요.", "ko": "의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상된다. 일부 미래학자들은 이러한 임플란트가 향후 20~30년 이내에 상용화되어 우리의 일상을 크게 변화시킬 것이라고 예측한다. 예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다. 이것은 우리가 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍하는 것이 가능하도록 해 줄 것이다. 컴퓨터 메모리 칩과 유사한 기억력 향상 뇌 임플란트도 큰 잠재력을 가지고 있다. 이러한 장치를 사용하면 기억을 캡처하고 향상시킬 수 있으며, 디지털 클라우드를 사용하여 기억을 업로드 및 다운로드할 수도 있다. 우리는 소셜 미디어 피드처럼 기억을 살펴보고, 인생에서 가장 좋았던 순간을 생생하게 회상하고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것이다. 마지막으로, AI 기반 신경 임플란트는 우리 뇌의 작동 방식에 혁명을 일으킬 것이다. 뇌의 역할이 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀌게 될 것이다. 우리는 단순히 정보를 암기하는 대신 지식을 다운로드하고, 창의력을 발휘하여 그 지식을 해석하고, 새로운 아이디어를 창출할 수 있게 될 것이다."}, {"id": "ctx4", "kind": "ctx", "n": 4, "title": null, "tko": null, "paras": [[{"t": "Before we can fully embrace the era of AI‑powered neural implants, many tricky "}, {"t": "ethical", "c": 1}, {"t": " issues should be addressed. The integration of AI technology with the human brain raises concerns about what it means to be human. Our brains are believed to be central to our identity, existence, and value as human beings. However, an "}, {"t": "over‑independence", "c": 2}, {"t": " on technology may delay our natural development and create confusion about whether we are human, AI, or something in between. Another critical issue is privacy. There’s a risk that organizations or hackers could access "}, {"t": "personal", "c": 3}, {"t": " data without permission through AI‑connected implants. This means that our thoughts, emotions, and behaviors could be "}, {"t": "controlled", "c": 4}, {"t": " by hackers. There’s an additional risk that this technology could lead to even greater social "}, {"t": "equality", "c": 5}, {"t": ", given that it may not be available to all due to its high cost. Such unequal access to the technology could "}, {"t": "weaken", "c": 6}, {"t": " the division between those who can afford the implants and those who cannot."}]], "items": [{"c": 2, "w": "over‑independence", "r": "over‑reliance", "gw": "과도한 독립", "gr": "과도한 의존", "fb": null, "fg": "However, an over-reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between.", "ko": "그러나 기술에 대한 지나친 의존은 우리의 자연스러운 발달을 지연시키고 우리가 인간인지, AI인지, 아니면 그 중간인지에 대한 혼란을 야기할 수 있다.", "why": "문장이 However (그러나)로 시작해서 앞에 나온 '뇌는 정체성의 중심'이라는 말에 반대 걱정을 해요. delay our natural development (우리의 자연스러운 발달을 늦추다)가 이어지니 기술에 '지나치게 기대는' 것이 문제예요. over-independence (과도한 독립)는 기대지 않는 것이라 뜻이 반대가 돼요. 또 뒤의 on (~에)과 어울리는 짝은 reliance on (~에 대한 의존)이에요. independence (독립)는 보통 from (~로부터)과 함께 써요."}, {"c": 5, "w": "equality", "r": "inequality", "gw": "평등", "gr": "불평등", "fb": null, "fg": "There's an additional risk that this technology could lead to even greater social <span class=\"d\">inequality</span>, given that it may not be available to all due to its high cost.", "ko": "또한 이 기술은 높은 비용으로 인해 모든 사람에게 제공되지 않을 수 있다는 점에서 사회적 불평등을 더욱 심화시킬 수 있다는 추가적인 위험도 있다.", "why": "뒤에 given that it may not be available to all due to its high cost (높은 비용 때문에 모두에게 제공되지 않을 수 있다는 점을 고려하면)가 이유로 나와요. 모두에게 안 돌아가면 격차가 커지니 inequality (불평등)가 맞아요. 단락 전체가 '위험(risk)'을 말하는 것이고 greater (더 큰)도 나쁜 쪽에 어울려요."}, {"c": 6, "w": "weaken", "r": "intensify", "gw": "약화시키다", "gr": "심화시키다", "fb": null, "fg": "Such unequal access to the technology could <span class=\"d\">intensify</span> the division between those who can afford the implants and those who cannot.", "ko": "기술에 대한 이러한 불평등한 접근성은 임플란트 비용을 감당할 수 있는 사람과 그렇지 않은 사람 사이의 분열을 심화시킬 수 있다.", "why": "Such unequal access (이런 불평등한 접근)가 원인이에요. 비용을 낼 수 있는 사람과 없는 사람의 나뉨(division)이 더 커진다는 이야기라서 '더 크게 만들다'는 뜻의 intensify (심화시키다)가 맞아요. weaken (약화시키다)이면 불평등한 접근이 오히려 나뉨을 줄인다는 말이 되어 앞 내용과 맞지 않아요."}], "keep": "ethical (윤리적인)은 '윤리적 문제'를 다루는 단락이라 맞고, personal (개인적인)은 개인 정보를 말하며, controlled (통제되는)는 해커가 조종할 수 있다는 걱정과 이어져서 그대로 둬요.", "flow": "이 단락은 AI 임플란트의 '윤리적 문제'를 걱정하는 부분이에요. 정체성 혼란, 개인정보, 사회 불평등 순서로 나쁜 결과를 하나씩 말해요. 걱정을 키우는 내용인데 정반대로 안심시키는 말이 오면 어색해요.", "ko": "우리가 AI 기반 신경 임플란트 시대를 완전히 받아들이기 전에, 여러 가지 까다로운 윤리적 문제들이 해결되어야 한다. AI 기술과 인간의 뇌를 통합하는 것은 인간이라는 존재가 무엇을 의미하는가에 대한 우려를 제기한다. 우리의 두뇌는 인간으로서의 정체성, 존재, 가치의 중심이라고 여겨진다. 그러나 기술에 대한 지나친 의존은 우리의 자연스러운 발달을 지연시키고 우리가 인간인지, AI인지, 아니면 그 중간인지에 대한 혼란을 야기할 수 있다. 또 다른 중요한 문제는 프라이버시이다. 조직이나 해커가 AI와 연결된 임플란트를 통해 허가 없이 개인 정보에 접근할 수 있는 위험이 있다. 이는 우리의 생각, 감정, 행동이 해커에 의해 통제될 수 있다는 뜻이다. 또한 이 기술은 높은 비용으로 인해 모든 사람에게 제공되지 않을 수 있다는 점에서 사회적 불평등을 더욱 심화시킬 수 있다는 추가적인 위험도 있다. 기술에 대한 이러한 불평등한 접근성은 임플란트 비용을 감당할 수 있는 사람과 그렇지 않은 사람 사이의 분열을 심화시킬 수 있다."}, {"id": "ctx5", "kind": "ctx", "n": 5, "title": null, "tko": null, "paras": [[{"t": "I hope that we can "}, {"t": "raise", "c": 1}, {"t": " these challenges through careful consideration of neuroethics. This field highlights the social aspects of neural technology and provides possible answers to what should be considered legal and ethical. I think it is important to establish a prior review process and thoroughly "}, {"t": "assess", "c": 2}, {"t": " the ethical aspects before any kind of brain research is conducted. This will ensure that science and technology progress in accordance with ethical principles."}], [{"t": "What do you think about this technology? Please share your opinion in the comments section below."}], [{"t": "Eric Davis: Wow, AI‑powered neural implants sound "}, {"t": "disappointing", "c": 3}, {"t": "! I can’t believe that AI can help the disabled walk again and use artificial arms that move according to their thoughts!"}], [{"t": "Yumi Lee: Well, the technology sounds amazing, but I’m really "}, {"t": "excited", "c": 4}, {"t": " about the privacy issues it might cause. I think it is necessary to strictly enforce privacy laws to "}, {"t": "protect", "c": 5}, {"t": " the personal information of individuals."}], [{"t": "Andy Taylor: Thank you all for sharing your thoughts. I’ll talk more about how to address the concerns in my next post."}]], "items": [{"c": 1, "w": "raise", "r": "overcome", "gw": "(문제를) 제기하다", "gr": "극복하다", "fb": null, "fg": "I hope that we can <span class=\"d\">overcome</span> these challenges through careful consideration of neuroethics.", "ko": "나는 신경 윤리에 대한 신중한 고찰을 통해 우리가 이러한 난제를 극복할 수 있기를 바란다.", "why": "I hope that we can overcome these challenges through careful consideration (신중한 고찰을 통해 우리가 이 난제를 극복하기를 바란다)가 원문이에요. 앞 단락에서 문제를 이미 잔뜩 말했으니, 이제는 '풀어 보자'는 쪽으로 가야 해요. raise (제기하다)는 문제를 새로 꺼내는 뜻이라 hope (바라다)와 이어지지 않아요."}, {"c": 3, "w": "disappointing", "r": "incredible", "gw": "실망스러운", "gr": "놀라운", "fb": null, "fg": "Eric Davis: Wow, AI-powered neural implants sound <span class=\"d\">incredible</span>!", "ko": "Eric Davis: 와, AI 기반 신경 임플란트는 정말 놀랍다!", "why": "Eric은 뒤에서 I can't believe that AI can help the disabled walk again (AI가 장애인을 다시 걷게 돕는다니 믿기지 않는다)이라고 감탄해요. 그래서 처음 말도 sound incredible (정말 놀랍게 들린다)이 맞아요. disappointing (실망스러운)이면 뒤 감탄과 정반대예요."}, {"c": 4, "w": "excited", "r": "worried", "gw": "신이 난", "gr": "걱정되는", "fb": null, "fg": "Yumi Lee: Well, the technology sounds amazing, but I'm really <span class=\"d\">worried</span> about the privacy issues it might cause.", "ko": "Yumi Lee: 음, 이 기술은 대단해 보이지만, 나는 이로 인해 발생할 수 있는 프라이버시 문제가 정말 걱정된다.", "why": "Yumi의 말은 '기술은 amazing (놀라운)하지만, but (그러나) ... privacy issues (프라이버시 문제)'로 방향이 꺾여요. 그러니 but 뒤에는 걱정(worried)이 와야 해요. excited (신이 난)는 amazing과 같은 방향이라 but으로 이을 수 없어요. 또 뒤의 strictly enforce privacy laws (개인정보 보호법을 엄격히 시행하다)도 걱정을 전제로 해요."}], "keep": "assess (평가하다)는 윤리적인 면을 '철저히 평가한다'는 뜻이라 맞고, protect (보호하다)는 개인정보를 지키자는 내용이라 그대로 둬요.", "flow": "글쓴이가 '신경 윤리'로 문제를 풀어 가자고 하고, 댓글 두 개가 이어져요. 첫 번째 댓글은 기술에 감탄하고, 두 번째 댓글은 'amazing (놀라운)하지만, but (그러나) 걱정된다'로 방향이 바뀌어요. 누가 감탄하고 누가 걱정하는지 짚으세요.", "ko": "AI 기술과 인간의 뇌를 통합하는 것은 인간이라는 존재가 무엇을 의미하는가에 대한 우려를 제기한다. 나는 신경 윤리에 대한 신중한 고찰을 통해 우리가 이러한 난제를 극복할 수 있기를 바란다. 이 분야는 신경 기술의 사회적 측면을 강조하고 무엇이 합법적이고 윤리적으로 여겨져야 하는지에 대한 가능한 대답을 제시한다. 나는 어떤 종류의 뇌 연구를 수행하기 전에 사전 검토 프로세스를 확립하고 윤리적 측면을 철저히 평가하는 것이 중요하다고 생각한다. 이는 과학과 기술이 윤리적 원칙에 따라 발전하도록 보장할 것이다. 이 기술에 대해 여러분은 어떻게 생각하는가? 아래 댓글란에 여러분의 의견을 공유해 주기 바란다. Eric Davis: 와, AI 기반 신경 임플란트는 정말 놀랍다! AI가 장애인을 다시 걸을 수 있게 돕고 생각에 따라 움직이는 의수를 사용하도록 도와줄 수 있다는 것이 믿기지 않는다! Yumi Lee: 음, 이 기술은 대단해 보이지만, 나는 이로 인해 발생할 수 있는 프라이버시 문제가 정말 걱정된다. 개인 정보 보호를 위해 개인 정보 보호법을 엄격하게 시행할 필요가 있다고 생각한다. Andy Taylor: 의견을 공유해 준 모든 분께 감사한다. 나의 다음 글에서 이러한 우려를 해결하는 방법에 관해 더 이야기하겠다."}, {"id": "gram1", "kind": "gram", "n": 1, "title": null, "tko": null, "paras": [[{"t": "Neuroscience has a long history of exploring treatments for disorders of the nervous system", "c": 1}, {"t": ", including the brain and spinal cord. Traditionally, researchers have studied various functions of neural implants, "}, {"t": "who are medical devices like computer chips", "c": 2}, {"t": " "}, {"t": "that can be implanting in the nervous system", "c": 3}, {"t": ". But here’s the exciting part: with the rapid advancement of artificial intelligence (AI), "}, {"t": "researchers have begun to integrate AI into neural implants", "c": 4}, {"t": ". In this post, "}, {"t": "we’ll examine the incredible benefits of AI‑powered neural implants, their amazing potential for the future, and the ethical concerns surround them", "c": 5}, {"t": "."}]], "items": [{"c": 2, "w": "who", "r": "which", "gw": "신경 임플란트, 그 사람들은 의료 기기이다 (who는 사람)", "gr": "신경 임플란트, 그것들은 의료 기기이다 (which는 물건)", "fb": "<span class=\"d\">who</span> are medical devices like computer chips", "fg": "<span class=\"d\">which</span> are medical devices like computer chips", "ko": "전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔고, 이것은 신경계에 이식될 수 있는 컴퓨터 칩과 같은 의료 기기이다.", "why": "neural implants (신경 임플란트)는 사람이 아니라 기기라서 who (누구)를 쓰면 안 돼요. 앞의 neural implants를 받아서 '그것들은 의료 기기이다'라고 이어 주는 자리라 which (그것은)가 맞아요. 사람 뒤에는 who, 물건 뒤에는 which를 써요."}, {"c": 3, "w": "implanting", "r": "implanted", "gw": "'심고 있는'", "gr": "'심어질 수 있는'", "fb": "that can be <span class=\"d\">implanting</span> in the nervous system.", "fg": "that can be <span class=\"d\">implanted</span> in the nervous system.", "ko": "전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔고, 이것은 신경계에 이식될 수 있는 컴퓨터 칩과 같은 의료 기기이다.", "why": "임플란트는 스스로 심는 것이 아니라 사람이 몸에 '심는' 것이에요. 그래서 '심어지다'라는 뜻의 be + 과거분사(implanted)가 되어야 해요. can be (~될 수 있다) 뒤에는 -ing가 아니라 implanted (이식된)가 와요."}, {"c": 5, "w": "surround", "r": "surrounding", "gw": "'윤리적 걱정들이 그것들을 둘러싼다'", "gr": "'그것들을 둘러싼 윤리적 걱정들'", "fb": "we’ll examine the incredible benefits of AI‑powered neural implants, their amazing potential for the future, and the ethical concerns <span class=\"d\">surround</span> them.", "fg": "we’ll examine the incredible benefits of AI‑powered neural implants, their amazing potential for the future, and the ethical concerns <span class=\"d\">surrounding</span> them.", "ko": "이 글에서는 AI 기반 신경 임플란트의 뛰어난 장점과 앞으로의 놀라운 잠재력, 그리고 이를 둘러싼 윤리적 우려에 대해 살펴볼 것이다.", "why": "이 문장에는 이미 we'll examine (우리는 살펴볼 것이다)이라는 동사가 있어요. 그러니 concerns (걱정들) 뒤의 surround (둘러싸다)는 동사로 또 쓸 수 없고, 앞말을 꾸미는 '둘러싼'이라는 -ing 모양으로 바꿔야 해요. 한 문장에 동사 두 개를 그냥 놓을 수는 없어요."}], "keep": "나머지 밑줄 문장은 neuroscience has a long history of exploring (탐구해 온 긴 역사)와 researchers have begun to integrate (통합하기 시작했다)처럼 모양이 맞아서 그대로 둬요.", "flow": "어법상 어색한 문장은 모두 밑줄 친 문장 중에서 찾아요. 이 글은 신경 임플란트와 AI를 소개하는 도입이에요. 각 밑줄에서 '꾸미는 말, 동사 모양'이 앞말과 맞는지 보세요.", "ko": "신경과학은 뇌와 척수를 포함한 신경계 질환에 대한 치료법을 탐구해 온 오랜 역사가 있다. 전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔고, 이것은 신경계에 이식될 수 있는 컴퓨터 칩과 같은 의료 기기이다. 하지만 흥미로운 점은 여기 있다. 그건 바로 인공지능(AI)의 급속한 발전과 함께 연구자들이 신경 임플란트에 AI를 통합하기 시작했다는 점이다. 이 글에서는 AI 기반 신경 임플란트의 뛰어난 장점과 앞으로의 놀라운 잠재력, 그리고 이를 둘러싼 윤리적 우려에 대해 살펴볼 것이다."}, {"id": "gram2", "kind": "gram", "n": 2, "title": null, "tko": null, "paras": [[{"t": "First, "}, {"t": "let’s explore how this fascinating technology have been apply", "c": 1}, {"t": ". The AI‑powered neural implant has shown great promise in medical applications, "}, {"t": "offering solutions to a range of problems", "c": 2}, {"t": ". For instance, neural implants are used to treat brain disorders like Parkinson’s disease. These implants electrically stimulate targeted regions of the brain at the right time with the help of AI to restore normal brain activity. In addition, paralyzed people can have the ability to walk again with the help of a “digital bridge” between two implants inserted into their brain and spine. When they think about moving their legs, "}, {"t": "the AI analyzes the brain signals and sends them their legs through the implants", "c": 3}, {"t": ". Similarly, "}, {"t": "those who have lost their arms can use artificial arms are operated by the same mechanism", "c": 4}, {"t": "."}], [{"t": "How the Brain and Spinal Implants Work", "c": 5}], [{"t": "‑ Brain implants send signal"}], [{"t": "‑ Spinal implant receives signal"}], [{"t": "‑ Nerve cells carry signal to legs"}]], "items": [{"c": 1, "w": "have apply", "r": "has applied", "gw": "'적용하다 해 왔다' (모양이 틀림)", "gr": "'적용되어 왔다'", "fb": "let’s explore how this fascinating technology <span class=\"d\">have</span> been <span class=\"d\">apply</span>.", "fg": "let’s explore how this fascinating technology <span class=\"d\">has</span> been <span class=\"d\">applied</span>.", "ko": "먼저 이 매혹적인 기술이 어떻게 적용되었는지 살펴보자.", "why": "주어 this fascinating technology (이 매혹적인 기술)는 하나라서 have가 아니라 has가 맞아요. 또 기술은 '적용되는' 쪽이라서 been 뒤에 applied (적용된)를 써야 해요. has been + 과거분사는 '지금까지 ~되어 왔다'라는 뜻이에요."}, {"c": 3, "w": "", "r": "to", "gw": "'그것들을 그들의 다리 보낸다'", "gr": "'그것들을 그들의 다리로 보낸다'", "fb": "the AI analyzes the brain signals and sends them their legs through the implants.", "fg": "the AI analyzes the brain signals and sends them <span class=\"d\">to</span> their legs through the implants.", "ko": "환자가 다리를 움직이려고 생각하면 AI가 뇌 신호를 분석하여 임플란트를 통해 다리로 신호를 보낸다.", "why": "send A to B (A를 B로 보내다)처럼 '~로'를 나타내는 to가 필요해요. 뇌 신호(brain signals)가 다리(legs)로 가는 길이니 to their legs (그들의 다리로)가 맞아요. 이 문장은 '신호가 뇌에서 다리까지 가는 길'을 말하고 있어요."}, {"c": 4, "w": "are", "r": "", "gw": "'작동되어진다' (동사로 또 씀)", "gr": "'작동되는' (앞말을 꾸밈)", "fb": "those who have lost their arms can use artificial arms <span class=\"d\">are</span> operated by the same mechanism.", "fg": "those who have lost their arms can use artificial arms operated by the same mechanism.", "ko": "마찬가지로 팔을 잃은 사람들도 동일한 메커니즘으로 작동하는 의수를 사용할 수 있다.", "why": "can use (사용할 수 있다)가 이미 이 문장의 동사예요. artificial arms (의수) 뒤의 are operated를 또 쓰면 동사가 두 개가 되어 틀려요. 앞말을 꾸미는 '작동되는'이라는 operated (작동되는)만 남겨야 해요."}], "keep": "offering solutions to a range of problems (다양한 문제에 해결책을 제시하며)는 앞 문장에 -ing로 덧붙인 말이라 맞고, 제목 How the Brain and Spinal Implants Work (뇌와 척추 임플란트가 작동하는 방식)도 문제가 없어요.", "flow": "의료 분야에 쓰인 사례를 설명하는 단락이에요. 주어가 하나인지 여러 개인지, 동사가 당하는 뜻인지, 전치사가 빠지지 않았는지를 보면서 찾아요.", "ko": "먼저 이 매혹적인 기술이 어떻게 적용되었는지 살펴보자. AI 기반 신경 임플란트는 다양한 문제에 대한 해결책을 제시하며 의료 분야 적용에서 큰 가능성을 보여 주었다. 예를 들어, 신경 임플란트는 파킨슨병과 같은 뇌 질환을 치료하는 데 사용된다. 이러한 임플란트는 정상적인 뇌 활동을 회복시키기 위해 AI의 도움을 받아 적시에 뇌의 표적 부위를 전기로 자극한다. 또한 마비 환자들은 뇌와 척추에 삽입된 두 개의 임플란트 사이에 있는 '디지털 브릿지'의 도움으로 다시 걸을 수 있는 능력을 가질 수 있다. 환자가 다리를 움직이려고 생각하면 AI가 뇌 신호를 분석하여 임플란트를 통해 다리로 신호를 보낸다. 마찬가지로 팔을 잃은 사람들도 동일한 메커니즘으로 작동하는 의수를 사용할 수 있다."}, {"id": "gram3", "kind": "gram", "n": 3, "title": null, "tko": null, "paras": [[{"t": "The success of AI‑powered neural implants in health care is also expecting to spread to other industries.", "c": 1}, {"t": " Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives. For example, "}, {"t": "advances in neural implant technology will make that possible to install in our brains software that can read our minds", "c": 2}, {"t": ". This could enable us to play games, type social media messages, and stream music simply by thinking. There is also great potential for memory‑enhancing brain implants, similar to computer memory chips. "}, {"t": "Such devices would allow us to capture and enhance memories", "c": 3}, {"t": ", and even upload and download them using the digital cloud. We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories. Finally, "}, {"t": "AI‑powered neural implants would revolutionize the way our brains work", "c": 4}, {"t": ". "}, {"t": "The role of the brain would shift from learning and storing information to process the vast amounts of data provided by the implants.", "c": 5}, {"t": " Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas."}]], "items": [{"c": 1, "w": "expecting", "r": "expected", "gw": "'기대하고 있다'", "gr": "'기대된다, 예상된다'", "fb": "The success of AI‑powered neural implants in health care is also <span class=\"d\">expecting</span> to spread to other industries.", "fg": "The success of AI‑powered neural implants in health care is also <span class=\"d\">expected</span> to spread to other industries.", "ko": "의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상된다.", "why": "주어 The success (성공)가 스스로 기대하는 것이 아니라 '사람들이 기대하는' 것이에요. 그래서 '예상된다'는 be + 과거분사(expected)가 맞아요. is expected to (~할 것으로 예상된다)는 뉴스에서 자주 쓰는 틀이에요."}, {"c": 2, "w": "that", "r": "it", "gw": "'저것을 가능하게 하다'", "gr": "'(~하는 것을) 가능하게 하다'", "fb": "advances in neural implant technology will make <span class=\"d\">that</span> possible to install in our brains software that can read our minds.", "fg": "advances in neural implant technology will make <span class=\"d\">it</span> possible to install in our brains software that can read our minds.", "ko": "예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다.", "why": "make it possible to ... (~하는 것을 가능하게 하다)에서 it은 자리만 먼저 맡아 두는 '가짜' 말이에요. 진짜로 가능해지는 일은 뒤에 나오는 to install (설치하는 것)이에요. that (저것)은 이렇게 자리를 맡아 두는 일을 못 해서 틀려요."}, {"c": 5, "w": "process", "r": "processing", "gw": "'처리하기 위해'", "gr": "'처리하는 것으로'", "fb": "The role of the brain would shift from learning and storing information to <span class=\"d\">process</span> the vast amounts of data provided by the implants.", "fg": "The role of the brain would shift from learning and storing information to <span class=\"d\">processing</span> the vast amounts of data provided by the implants.", "ko": "뇌의 역할이 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀌게 될 것이다.", "why": "shift from A to B (A에서 B로 바뀌다)에서 to는 전치사예요. 그래서 뒤에는 동사원형이 아니라 -ing(명사처럼)가 와야 해요. 앞의 from learning and storing (학습하고 저장하는 것에서)도 -ing 모양이라 짝을 맞춰 processing (처리하는 것)이 맞아요."}], "keep": "would allow us to capture (우리가 담도록 해 줄 것이다), would revolutionize (혁명을 일으킬 것이다)는 모양이 맞아서 그대로 둬요.", "flow": "앞으로의 미래 전망을 말하는 단락이에요. 예상, 가능, 변화 같은 말이 나오니 '당하는 뜻'인지, it을 써야 하는지, to 뒤 모양이 맞는지 확인하세요.", "ko": "의료 분야에서의 AI 기반 신경 임플란트의 성공은 다른 산업 분야로도 확산될 것으로 예상된다. 일부 미래학자들은 이러한 임플란트가 향후 20~30년 이내에 상용화되어 우리의 일상을 크게 변화시킬 것이라고 예측한다. 예를 들어, 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다. 이것은 우리가 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍하는 것이 가능하도록 해 줄 것이다. 컴퓨터 메모리 칩과 유사한 기억력 향상 뇌 임플란트도 큰 잠재력을 가지고 있다. 이러한 장치를 사용하면 기억을 캡처하고 향상시킬 수 있으며, 디지털 클라우드를 사용하여 기억을 업로드 및 다운로드할 수도 있다. 우리는 소셜 미디어 피드처럼 기억을 살펴보고, 인생에서 가장 좋았던 순간을 생생하게 회상하고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것이다. 마지막으로, AI 기반 신경 임플란트는 우리 뇌의 작동 방식에 혁명을 일으킬 것이다. 뇌의 역할이 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀌게 될 것이다. 우리는 단순히 정보를 암기하는 대신 지식을 다운로드하고, 창의력을 발휘하여 그 지식을 해석하고, 새로운 아이디어를 창출할 수 있게 될 것이다."}, {"id": "gram4", "kind": "gram", "n": 4, "title": null, "tko": null, "paras": [[{"t": "Before we can fully embrace the era of AI‑powered neural implants, many tricky ethical issues should be addressed. The integration of AI technology with the human brain raises concerns about what it means to be human. "}, {"t": "Our brains are believed being central to our identity, existence, and value as human beings.", "c": 1}, {"t": " However, "}, {"t": "an over‑reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between", "c": 2}, {"t": ". Another critical issue is privacy. "}, {"t": "There’s a risk what organizations or hackers could access personal data", "c": 3}, {"t": " without permission through AI‑connected implants. This means that our thoughts, emotions, and behaviors could be controlled by hackers. There’s an additional risk "}, {"t": "that this technology could lead to very greater social inequality", "c": 4}, {"t": ", given that it may not be available to all due to its high cost. "}, {"t": "Such unequal access to the technology could intensify the division     if(it.fb)f.appendChild(html('span','l bad','<small>틀린 문장</small>'+it.fb));
    f.appendChild(html('span','l good','<small>고친 문장</small>'+it.fg));d.appendChild(f);
    d.appendChild(el('div','kot',it.ko));
    d.appendChild(html('div','why',it.why));
    res.appendChild(d)});
  var wrongPick=r.sel.filter(function(c){return T.indexOf(c)<0});
  if(wrongPick.length){res.appendChild(html('div','note','<b>잘못 고른 곳</b> '+wrongPick.map(function(c){return CIRC.charAt(c-1)}).join(' ')+'은(는) 글의 흐름과 문법에 맞는 표현이라 그대로 둬요.'))}
  if(WN.MIX){WN.finish();res.appendChild(html('div','note','틀린 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에 담겨요.'))}
  else if(WN.MODE){res.appendChild(html('div','note','이제 안 봐도 되는 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에서 \'빼기\'로 뺄 수 있어요.'))}
  else if(WN.has('L4',PART,'awk',q.id)){res.appendChild(html('div','note','<a href="../wrong.html" style="color:#0f766e;text-decoration:underline">틀린 '+WN.ids('L4',PART,'awk').length+'개가 오답 노트에 담겼어요 ›</a>'))}
  res.appendChild(html('div','note','<b>글의 흐름</b> '+q.flow));
  res.appendChild(html('div','note','<b>그대로 두는 부분</b> '+q.keep));
  var kb=el('div','kobox');kb.textContent=q.ko;
  var row=el('div','row');
  var bk=el('button','btn','한글 해석 보기');bk.onclick=function(){var on=kb.classList.toggle('on');bk.textContent=on?'한글 해석 닫기':'한글 해석 보기'};
  res.appendChild(bk);res.appendChild(kb);
  var idx=Q.indexOf(q),nx=Q[idx+1];
  var again=el('button','big alt','이 문제 다시 풀기');again.onclick=function(){S.res[q.id]={sel:[],done:false};save();draw(q);window.scrollTo(0,0)};
  var next=el('button','big',nx?'다음 문제 · '+nm(nx):'목록으로');next.onclick=function(){if(nx)open(nx.id);else home()};
  row.appendChild(again);row.appendChild(next);res.appendChild(row);
}
