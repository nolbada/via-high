var D={"n": "4", "title": "4과 AI Neural Implants", "parts": [["❶", "본문 ❶"], ["❷", "본문 ❷"], ["❸", "본문 ❸"], ["❹", "본문 ❹"], ["❺", "본문 ❺"]], "groups": [{"part": "❶", "title": "신경과학의 오랜 역사", "flow": "신경과학은 뇌와 척수를 포함한 신경계 질환의 치료법을 오래전부터 연구해 왔어요.", "items": [{"en": "Scientists in neuroscience have worked on healing brain and nerve diseases.", "ans": "T", "ko": "신경과학 분야의 과학자들은 뇌와 신경의 질환을 치료하는 일에 힘써 왔다.", "eve": "Neuroscience has a long history of exploring treatments for disorders of the nervous system, including the brain and spinal cord.", "evk": "신경과학은 뇌와 척수를 포함한 신경계 질환에 대한 치료법을 탐구해 온 오랜 역사를 가지고 있습니다.", "why": "'long history of exploring treatments(치료법을 탐구해 온 오랜 역사)'가 핵심이에요. disorders of the nervous system은 '신경계 질환'이고, 뇌와 척수가 그 예시예요. 글의 첫 문장은 '오래전부터 해 온 연구'로 시작해요."}, {"en": "The speaker says neuroscience was created only a few decades ago.", "ans": "F", "ko": "화자는 신경과학이 불과 몇십 년 전에 생겼다고 말한다.", "eve": "Neuroscience has a long history of exploring treatments...", "evk": "신경과학은 치료법을 탐구해 온 오랜 역사를 가지고 있습니다...", "why": "본문은 **a long history(오랜 역사)**예요. 'only a few decades ago(불과 몇십 년 전)'는 정반대예요. 시간의 길이를 바꿔 놓은 문장은 대표적인 함정이에요."}, {"en": "Researchers in neuroscience have recently begun studying heart diseases.", "ans": "F", "ko": "신경과학 연구자들은 최근에 심장 질환을 연구하기 시작했다.", "eve": "...disorders of the nervous system, including the brain and spinal cord.", "evk": "...뇌와 척수를 포함한 신경계 질환.", "why": "연구 대상은 **신경계(뇌와 척수)**이지 심장이 아니에요. 또 '최근에 시작'이 아니라 '오랜 역사'라서 두 군데가 본문과 달라요."}]}, {"part": "❶", "title": "신경 임플란트와 AI의 만남", "flow": "연구자들은 컴퓨터 칩 같은 의료 기기인 신경 임플란트의 기능을 연구해 왔고, AI가 급속히 발전하면서 이제 AI를 신경 임플란트에 통합하기 시작했어요.", "items": [{"en": "In the past, scientists examined many uses of neural implants.", "ans": "T", "ko": "과거에 과학자들은 신경 임플란트의 여러 가지 용도를 연구했다.", "eve": "Traditionally, researchers have studied various functions of neural implants...", "evk": "전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔습니다...", "why": "Traditionally(전통적으로)는 '예전부터'라는 뜻이에요. various functions(다양한 기능)를 many uses(많은 용도)로 바꿔 쓴 맞는 문장이에요. 뒤에 나올 반전(But)을 위한 '예전 이야기'예요."}, {"en": "Neural implants are tiny devices placed outside the nervous system.", "ans": "F", "ko": "신경 임플란트는 신경계 바깥에 놓이는 아주 작은 기기이다.", "eve": "...neural implants, which are medical devices like computer chips that can be implanted in the nervous system.", "evk": "...신경 임플란트는 신경계에 이식될 수 있는 컴퓨터 칩 같은 의료 기기입니다.", "why": "implant는 '몸속에 심는(이식하는) 것'이에요. 본문도 **implanted in the nervous system(신경계에 이식된다)**이라고 해요. 'outside(바깥)'는 정반대예요. 단어 자체가 뜻을 알려 주는 좋은 예예요."}, {"en": "Neural implants can act like computer chips to help damaged nerves work.", "ans": "T", "ko": "신경 임플란트는 컴퓨터 칩처럼 작용해 손상된 신경이 작동하도록 도울 수 있다.", "eve": "...medical devices like computer chips...", "evk": "...컴퓨터 칩 같은 의료 기기...", "why": "본문은 신경 임플란트를 'computer chips 같은 의료 기기'라고 설명해요. 앞 문장이 '신경계 질환의 치료'를 말하고 있으니, 신경 기능을 돕는 의료 기기라는 흐름과 맞는 문장이에요."}, {"en": "Because of AI’s progress, new ideas for neural implants appeared.", "ans": "T", "ko": "AI의 발전 덕분에 신경 임플란트에 대한 새로운 아이디어가 나타났다.", "eve": "But here's the exciting part: with the rapid advancement of artificial intelligence (AI), researchers have begun to integrate AI into neural implants.", "evk": "하지만 흥미로운 점은 이것입니다. 인공지능(AI)의 급속한 발전과 함께 연구자들이 AI를 신경 임플란트에 통합하기 시작했다는 점입니다.", "why": "But으로 글의 분위기가 바뀌어요. 'with the rapid advancement of AI(AI의 급속한 발전과 함께)'가 이유예요. 예전 연구에서 AI와 결합한 새로운 단계로 넘어간다는 흐름이에요."}, {"en": "Researchers have stopped studying neural implants after AI appeared.", "ans": "F", "ko": "AI가 등장한 이후 연구자들은 신경 임플란트 연구를 중단했다.", "eve": "...researchers have begun to integrate AI into neural implants.", "evk": "...연구자들이 AI를 신경 임플란트에 통합하기 시작했습니다.", "why": "중단한 게 아니라 **AI를 합치기 시작(begun to integrate)**했어요. 오히려 연구가 한 단계 더 나아간 것이에요. stopped와 begun을 구분하면 쉽게 찾을 수 있어요."}, {"en": "Scientists started adding AI systems to the design of neural implants.", "ans": "T", "ko": "과학자들은 신경 임플란트의 설계에 AI 시스템을 더하기 시작했다.", "eve": "...researchers have begun to integrate AI into neural implants.", "evk": "...연구자들이 AI를 신경 임플란트에 통합하기 시작했습니다.", "why": "integrate A into B는 쓴 맞는 문장이에요. 이 문장이 '의료 → 일상'으로 넘어가는 다리 역할을 해요."}]}, {"part": "❸", "title": "상용화와 마음을 읽는 소프트웨어", "flow": "일부 미래학자들은 20~30년 안에 임플란트가 상용화되고 일상을 크게 바꿀 것이라고 예측해요. 마음을 읽는 소프트웨어를 뇌에 설치하면 생각만으로 게임을 하고, 메시지를 입력하고, 음악을 들을 수 있어요.", "items": [{"en": "Futurists believe that neural implants will disappear within the next 20 to 30 years.", "ans": "F", "ko": "미래학자들은 신경 임플란트가 앞으로 20~30년 안에 사라질 것이라고 믿는다.", "eve": "Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives.", "evk": "일부 미래학자들은 이러한 임플란트가 향후 20~30년 이내에 상용화되고 우리의 일상을 크게 변화시킬 것이라고 예측합니다.", "why": "사라지는 게 아니라 **상용화(commercially available)**된다고 예측해요. commercially available은 '시장에서 살 수 있는'이라는 뜻이에요. 숫자 20~30년은 맞게 두고 내용만 바꾼 함정이에요."}, {"en": "Some experts expect brain implants to soon enter the consumer market.", "ans": "T", "ko": "일부 전문가들은 뇌 임플란트가 곧 소비자 시장에 나올 것으로 기대한다.", "eve": "...these implants will become commercially available in the next 20 to 30 years...", "evk": "...이러한 임플란트가 향후 20~30년 이내에 상용화될 것이라고...", "why": "commercially available을 'enter the consumer market(소비자 시장에 진입)'으로 바꿔 쓴 맞는 문장이에요. predict는 '예측하다'라서 확정이 아닌 전망이라는 점도 기억하세요."}, {"en": "The speaker says that these devices could greatly impact people’s everyday lives.", "ans": "T", "ko": "화자는 이 장치들이 사람들의 일상에 큰 영향을 줄 수 있다고 말한다.", "eve": "...significantly change our daily lives.", "evk": "...우리의 일상을 크게 변화시킬 것입니다.", "why": "significantly change를 greatly impact로 바꿔 쓴 맞는 문장이에요. '의료 분야'에서 '우리의 일상'으로 범위가 커진다는 점이 중요해요."}, {"en": "New software installed in human brains might understand what people think.", "ans": "T", "ko": "사람의 뇌에 설치된 새로운 소프트웨어가 사람들이 생각하는 것을 이해할 수 있을지도 모른다.", "eve": "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds.", "evk": "예를 들어 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것입니다.", "why": "read our minds(우리의 마음을 읽다)를 understand what people think(사람들이 생각하는 것을 이해하다)로 바꿔 쓴 문장이에요. make it possible to ~는 '~하는 것을 가능하게 하다'예요."}, {"en": "Neural implants will only be used for medical treatments in hospitals.", "ans": "F", "ko": "신경 임플란트는 병원에서의 의료 치료에만 쓰일 것이다.", "eve": "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds.", "evk": "예를 들어 신경 임플란트 기술의 발전으로 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것입니다.", "why": "본문의 예시는 **게임, 소셜 미디어 메시지 입력, 음악 스트리밍**처럼 일상 속 활용이에요. 앞 문장에서 '일상을 크게 변화시킨다'고 했으니 의료에만 쓰인다는 말은 맞지 않아요."}, {"en": "People could play digital games with their thoughts through brain implants.", "ans": "T", "ko": "사람들은 뇌 임플란트로 생각만으로 디지털 게임을 할 수 있을 것이다.", "eve": "This could enable us to play games, type social media messages, and stream music simply by thinking.", "evk": "이것은 우리가 단지 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍할 수 있게 해 줄 것입니다.", "why": "enable + 목적어 + to부정사는 '~가 …할 수 있게 하다'예요. 세 가지 활동(게임, 메시지 입력, 음악)이 병렬로 나오고, 모두 simply by thinking(단지 생각만으로)이에요."}, {"en": "The technology could allow users to write online posts only by thinking.", "ans": "T", "ko": "이 기술은 사용자가 생각만으로 온라인 글을 쓸 수 있게 해 줄 수 있다.", "eve": "...type social media messages... simply by thinking.", "evk": "...단지 생각만으로 소셜 미디어 메시지를 입력...", "why": "type social media messages를 'write online posts(온라인 글을 쓰다)'로 바꿔 쓴 맞는 문장이에요. 손이 아니라 생각만으로 입력한다는 점이 핵심이에요."}, {"en": "Future neural implants might let users enjoy music without touching any device.", "ans": "T", "ko": "미래의 신경 임플란트는 사용자가 어떤 기기도 만지지 않고 음악을 즐기게 해 줄지도 모른다.", "eve": "...stream music simply by thinking.", "evk": "...단지 생각만으로 음악을 스트리밍...", "why": "stream music(음악을 스트리밍하다)을 enjoy music으로 바꿔 쓴 문장이에요. simply by thinking을 'without touching any device(기기를 만지지 않고)'로 바꿔 쓴 것이라 맞는 문장이에요."}]}, {"part": "❸", "title": "기억력을 높이는 임플란트", "flow": "컴퓨터 메모리 칩과 비슷한 기억력 향상 임플란트도 큰 잠재력이 있어요. 기억을 포착하고 향상시키며, 디지털 클라우드에 업로드·다운로드까지 할 수 있게 해 줄 거예요.", "items": [{"en": "Scientists see strong possibilities in brain implants that improve memory.", "ans": "T", "ko": "과학자들은 기억력을 높이는 뇌 임플란트에 큰 가능성을 본다.", "eve": "There is also great potential for memory-enhancing brain implants, similar to computer memory chips.", "evk": "컴퓨터 메모리 칩과 유사한, 기억력을 향상시키는 뇌 임플란트에도 큰 잠재력이 있습니다.", "why": "'memory-enhancing(기억력을 향상시키는)'은 memory와 enhancing이 붙은 형용사예요. great potential을 strong possibilities로 바꿔 쓴 맞는 문장이에요. 새 소단락의 주제는 '기억'이에요."}, {"en": "Some brain devices may work in a way similar to that of computer chips.", "ans": "T", "ko": "일부 뇌 장치는 컴퓨터 칩과 비슷한 방식으로 작동할지도 모른다.", "eve": "...memory-enhancing brain implants, similar to computer memory chips.", "evk": "...컴퓨터 메모리 칩과 유사한, 기억력을 향상시키는 뇌 임플란트.", "why": "similar to ~는 '~와 비슷한'이라는 뜻이에요. 컴퓨터가 정보를 저장하는 칩처럼, 뇌 임플란트도 기억을 다룬다는 비유예요."}, {"en": "Future implants might help people record and strengthen their memories.", "ans": "T", "ko": "미래의 임플란트는 사람들이 기억을 기록하고 강화하도록 도울지도 모른다.", "eve": "Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.", "evk": "이러한 장치는 우리가 기억을 포착하고 향상시킬 뿐 아니라 디지털 클라우드를 사용해 업로드와 다운로드까지 할 수 있게 해 줄 것입니다.", "why": "capture(포착하다)를 record(기록하다)로, enhance(향상시키다)를 strengthen(강화하다)으로 바꿔 쓴 맞는 문장이에요. 'allow + 목적어 + to부정사'는 '~가 …할 수 있게 하다'예요."}, {"en": "The speaker says the devices may upload memories to the digital cloud.", "ans": "T", "ko": "화자는 이 장치들이 기억을 디지털 클라우드에 업로드할 수 있다고 말한다.", "eve": "...even upload and download them using the digital cloud.", "evk": "...심지어 디지털 클라우드를 사용해 그것들을 업로드와 다운로드까지.", "why": "even(심지어)이 붙어 '기록과 강화에서 한 걸음 더 나아가 업로드까지'라는 느낌을 줘요. them은 앞의 memories를 가리켜요."}, {"en": "Users could download their stored memories whenever they need to recall them.", "ans": "T", "ko": "사용자는 기억해야 할 때마다 저장된 기억을 다운로드할 수 있을 것이다.", "eve": "...even upload and download them using the digital cloud.", "evk": "...심지어 디지털 클라우드를 사용해 그것들을 업로드와 다운로드까지.", "why": "upload(올리다)와 짝인 download(내려받다)가 함께 나와요. 클라우드에 저장해 둔 기억을 필요할 때 꺼내 쓴다는 뜻이에요."}, {"en": "These implants can erase old memories to create space for new ones.", "ans": "F", "ko": "이 임플란트는 오래된 기억을 지워서 새로운 기억을 위한 공간을 만들 수 있다.", "eve": "Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.", "evk": "이러한 장치는 우리가 기억을 포착하고 향상시킬 뿐 아니라 디지털 클라우드를 사용해 업로드와 다운로드까지 할 수 있게 해 줄 것입니다.", "why": "본문에 **기억을 지운다(erase)**는 말은 없어요. 나오는 동작은 capture, enhance, upload, download 네 가지예요. 본문에 없는 동작을 끼워 넣은 문장이에요."}]}, {"part": "❸", "title": "기억을 다루는 새로운 방식과 뇌의 역할", "flow": "기억을 소셜 미디어 피드처럼 훑어보고, 생생하게 떠올리고, 공유하고, 백업할 수 있어요. 뇌의 역할은 정보를 학습하고 저장하는 것에서 임플란트가 주는 방대한 데이터를 처리하는 것으로 바뀔 거예요.", "items": [{"en": "People could browse their memories like scrolling a social media feed.", "ans": "T", "ko": "사람들은 소셜 미디어 피드를 넘기듯 자신의 기억을 훑어볼 수 있을 것이다.", "eve": "We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories.", "evk": "우리는 기억을 소셜 미디어 피드처럼 훑어보고, 인생에서 가장 좋았던 순간을 생생하게 떠올리고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것입니다.", "why": "이 문장에는 **네 가지 동작**이 병렬로 나와요. ① 훑어보기 ② 생생하게 떠올리기 ③ 공유하기 ④ 백업하기예요. 이 문제의 1~4번이 순서대로 이 네 동작을 하나씩 확인해요."}, {"en": "Users may vividly remember their most enjoyable life experiences easily.", "ans": "T", "ko": "사용자는 가장 즐거웠던 인생 경험을 쉽게 생생하게 기억해 낼 수 있을 것이다.", "eve": "...vividly recall our favorite life moments...", "evk": "...인생에서 가장 좋았던 순간을 생생하게 떠올리고...", "why": "vividly recall(생생하게 떠올리다)과 favorite life moments(가장 좋았던 순간)를 합친 맞는 문장이에요. recall은 remember와 같은 뜻이에요."}, {"en": "Neural implants would allow sharing memories with friends and family members.", "ans": "T", "ko": "신경 임플란트는 친구와 가족에게 기억을 공유할 수 있게 해 줄 것이다.", "eve": "...share memories with others...", "evk": "...다른 사람들과 기억을 공유하고...", "why": "others(다른 사람들)를 friends and family members(친구와 가족)로 구체적으로 바꿔 쓴 맞는 문장이에요. 기억이 개인의 것에서 나눌 수 있는 것으로 바뀐다는 점이 재미있는 포인트예요."}, {"en": "People could back up their most important memories to secure storage systems.", "ans": "T", "ko": "사람들은 가장 중요한 기억을 안전한 저장 시스템에 백업할 수 있을 것이다.", "eve": "...back up our most valuable memories.", "evk": "...가장 소중한 기억을 백업할 수 있을 것입니다.", "why": "back up(백업하다)은 컴퓨터 파일을 복사해 두는 것과 같아요. most valuable memories(가장 소중한 기억)를 most important memories로 바꿔 쓴 맞는 문장이에요."}, {"en": "AI-powered brain devices could completely change the way our minds function.", "ans": "T", "ko": "AI 기반 뇌 장치는 우리 마음이 작동하는 방식을 완전히 바꿀 수 있을 것이다.", "eve": "Finally, AI-powered neural implants would revolutionize the way our brains work.", "evk": "마지막으로 AI 기반 신경 임플란트는 우리 뇌가 작동하는 방식에 혁명을 일으킬 것입니다.", "why": "revolutionize(혁명을 일으키다)를 completely change(완전히 바꾸다)로 바꿔 쓴 맞는 문장이에요. Finally(마지막으로)는 뇌의 역할 변화라는 가장 큰 이야기로 넘어가는 신호예요."}, {"en": "The AI devices only allow people to learn, not to remember experiences.", "ans": "F", "ko": "AI 장치는 사람들이 배우게만 할 뿐 경험을 기억하게 하지는 않는다.", "eve": "We could look through our memories like a social media feed, vividly recall our favorite life moments...", "evk": "우리는 기억을 소셜 미디어 피드처럼 훑어보고 인생에서 가장 좋았던 순간을 생생하게 떠올릴 수 있을 것입니다...", "why": "바로 앞에서 **기억을 훑어보고, 떠올리고, 공유하고, 백업**한다고 했으니 '기억하지 않는다'는 말은 맞지 않아요. 임플란트는 배움뿐 아니라 기억도 돕는 장치예요."}, {"en": "The speaker claims that brains will stop processing any information in the future.", "ans": "F", "ko": "화자는 미래에 뇌가 어떤 정보도 처리하지 않게 될 것이라고 주장한다.", "eve": "The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants.", "evk": "뇌의 역할은 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀔 것입니다.", "why": "뇌가 처리를 멈추는 게 아니라, **방대한 데이터를 처리하는 쪽으로 역할이 바뀌는** 거예요. shift from A to B는 'A에서 B로 바뀌다'예요."}, {"en": "Future brains will ignore all data provided by neural implants.", "ans": "F", "ko": "미래의 뇌는 신경 임플란트가 제공하는 모든 데이터를 무시할 것이다.", "eve": "...processing the vast amounts of data provided by the implants.", "evk": "...임플란트가 제공하는 방대한 양의 데이터를 처리하는 것.", "why": "provided by the implants는 앞의 data를 꾸며 줘요. 데이터를 무시하는 게 아니라 **처리(processing)하는 것**이 뇌의 새 역할이에요. ignore(무시하다)와 process(처리하다)를 구분하세요."}, {"en": "The role of the brain would move from simple learning to complex data processing.", "ans": "T", "ko": "뇌의 역할은 단순한 학습에서 복잡한 데이터 처리로 옮겨 갈 것이다.", "eve": "The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants.", "evk": "뇌의 역할은 정보를 학습하고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀔 것입니다.", "why": "from learning and storing(학습하고 저장하는 것)을 simple learning(단순한 학습)으로, to processing the vast amounts of data(방대한 데이터를 처리하는 것)를 complex data processing으로 바꿔 쓴 문장이에요."}]}, {"part": "❸", "title": "지식을 다운로드하는 시대", "flow": "단순히 암기하는 대신 지식을 다운로드하고, 창의력으로 해석하고, 새로운 아이디어를 만들어 낼 수 있을 거예요.", "items": [{"en": "People will only memorize facts without interpreting them in any way.", "ans": "F", "ko": "사람들은 아무것도 해석하지 않고 사실만 암기하게 될 것이다.", "eve": "Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas.", "evk": "단순히 정보를 암기하는 대신 우리는 지식을 다운로드하고, 창의력을 발휘해 그것을 해석하고, 새로운 아이디어를 창출할 수 있을 것입니다.", "why": "본문은 **'단순 암기 대신(Instead of simply memorizing)'** 해석하고 아이디어를 만든다고 해요. '해석 없이 암기만 한다'는 반대예요. 암기에서 해석과 창의로 역할이 바뀐다는 흐름이에요."}, {"en": "People could download knowledge directly instead of just memorizing facts.", "ans": "T", "ko": "사람들은 사실을 암기하는 대신 지식을 직접 다운로드할 수 있을 것이다.", "eve": "...we would be able to download knowledge...", "evk": "...우리는 지식을 다운로드할 수 있을 것입니다...", "why": "Instead of ~는 '~ 대신에'라는 표현이에요. 외우는 대신 내려받는다는 뜻이에요. 문장에서 이어지는 세 동사(download, use, generate)가 병렬로 나와요."}, {"en": "Users may apply their imagination to understand and interpret the information.", "ans": "T", "ko": "사용자는 상상력을 발휘해 정보를 이해하고 해석할 수 있을 것이다.", "eve": "...use our creativity to interpret it...", "evk": "...창의력을 발휘해 그것을 해석하고...", "why": "creativity(창의력)를 imagination(상상력)으로 바꿔 쓴 맞는 문장이에요. interpret it에서 it은 앞의 knowledge예요. 지식을 얻은 다음 단계는 '해석'이에요."}, {"en": "Brain technology could help generate new ideas based on downloaded knowledge.", "ans": "T", "ko": "뇌 기술은 다운로드한 지식을 바탕으로 새로운 아이디어를 만드는 데 도움이 될 수 있다.", "eve": "...download knowledge, use our creativity to interpret it, and generate new ideas.", "evk": "...지식을 다운로드하고, 창의력으로 해석하고, 새로운 아이디어를 창출할 수 있을 것입니다.", "why": "다운로드 → 해석 → 새 아이디어의 순서예요. generate(만들어 내다)는 마지막 단계이고, 앞의 지식이 바탕이 된다는 흐름이에요."}]}, {"part": "❹", "title": "윤리 문제를 먼저 해결해야 해요", "flow": "AI 임플란트 시대를 완전히 받아들이기 전에 까다로운 윤리 문제를 먼저 다뤄야 해요. 뇌는 인간의 정체성, 존재, 가치의 중심이라 AI와 통합하면 '인간이란 무엇인가'라는 우려가 생겨요.", "items": [{"en": "Experts warn that ethical concerns need careful discussion before full implementation.", "ans": "T", "ko": "전문가들은 완전히 도입하기 전에 윤리적 우려를 신중히 논의해야 한다고 경고한다.", "eve": "Before we can fully embrace the era of AI-powered neural implants, many tricky ethical issues should be addressed.", "evk": "우리가 AI 기반 신경 임플란트의 시대를 완전히 받아들이기 전에 여러 까다로운 윤리적 문제가 다뤄져야 합니다.", "why": "Before(~하기 전에)가 핵심이에요. fully embrace는 '완전히 받아들이다', should be addressed는 '다뤄져야 한다(해결되어야 한다)'예요. 장점을 말한 뒤 '그래도 먼저 해결할 문제가 있다'로 분위기가 바뀌는 소단락이에요."}, {"en": "The speaker claims ethical issues are not important for adopting neural technology.", "ans": "F", "ko": "화자는 신경 기술 도입에서 윤리 문제가 중요하지 않다고 주장한다.", "eve": "...many tricky ethical issues should be addressed.", "evk": "...여러 까다로운 윤리적 문제가 다뤄져야 합니다.", "why": "본문은 오히려 윤리 문제가 **many tricky(여러 까다로운)**이고 반드시 다뤄져야 한다고 해요. '중요하지 않다'는 정반대예요."}, {"en": "Neural implants can be freely applied without considering any risks.", "ans": "F", "ko": "신경 임플란트는 위험을 고려하지 않고 자유롭게 적용될 수 있다.", "eve": "Before we can fully embrace the era... many tricky ethical issues should be addressed.", "evk": "우리가 그 시대를 완전히 받아들이기 전에... 여러 까다로운 윤리적 문제가 다뤄져야 합니다.", "why": "문제를 먼저 해결해야 한다는 글이므로 **고려 없이 자유롭게 적용**한다는 말은 본문과 반대예요. 'before(~ 전에)'가 순서를 정해 주는 단어예요."}, {"en": "Integrating AI with brains has no impact on human identity or values.", "ans": "F", "ko": "AI를 뇌와 통합하는 것은 인간의 정체성이나 가치에 아무런 영향을 주지 않는다.", "eve": "The integration of AI technology with the human brain raises concerns about what it means to be human.", "evk": "AI 기술과 인간의 뇌를 통합하는 것은 인간이라는 존재가 무엇을 의미하는지에 대한 우려를 불러일으킵니다.", "why": "본문은 **raises concerns(우려를 불러일으킨다)**라고 해요. 영향이 없다는 말은 반대예요. what it means to be human은 '인간이라는 것이 무엇을 뜻하는지'예요."}, {"en": "Experts believe our brains are key to understanding our personal existence.", "ans": "T", "ko": "전문가들은 우리의 뇌가 개인의 존재를 이해하는 열쇠라고 믿는다.", "eve": "Our brains are believed to be central to our identity, existence, and value as human beings.", "evk": "우리의 뇌는 인간으로서의 정체성, 존재, 가치의 중심이라고 여겨집니다.", "why": "'are believed to be central to ~(~의 중심이라고 여겨진다)'를 key to understanding(이해하는 열쇠)으로 바꿔 쓴 문장이에요. 정체성·존재·가치의 세 가지가 뇌와 연결된다는 점을 기억하세요."}, {"en": "The speaker says human value is closely connected to brain functions.", "ans": "T", "ko": "화자는 인간의 가치가 뇌의 기능과 밀접하게 연결되어 있다고 말한다.", "eve": "...central to our identity, existence, and value as human beings.", "evk": "...인간으로서의 정체성, 존재, 가치의 중심.", "why": "central(중심인)을 closely connected(밀접하게 연결된)로 바꿔 쓴 맞는 문장이에요. 뇌가 가치의 중심이라서 AI와 합칠 때 우려가 생긴다는 흐름이에요."}]}, {"part": "❹", "title": "기술 의존과 프라이버시", "flow": "기술에 지나치게 의존하면 자연스러운 발달이 늦어지고, 인간인지 AI인지 그 중간인지 혼란이 생길 수 있어요. 또 다른 문제는 프라이버시로, 조직이나 해커가 허가 없이 개인 정보에 접근할 위험이 있어요.", "items": [{"en": "Excessive use of AI technology helps accelerate natural human growth.", "ans": "F", "ko": "AI 기술의 과도한 사용은 인간의 자연스러운 성장을 앞당기는 데 도움이 된다.", "eve": "However, an over-reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between.", "evk": "그러나 기술에 대한 지나친 의존은 우리의 자연스러운 발달을 지연시키고, 우리가 인간인지 AI인지 아니면 그 중간인지에 대한 혼란을 일으킬 수 있습니다.", "why": "However(그러나)로 반전돼요. 본문은 지나친 의존이 자연스러운 발달을 **지연시킨다(delay)**고 하는데, 문장은 **앞당긴다(accelerate)**로 바꿔 놓았어요. 방향이 정반대예요."}, {"en": "People might become unsure whether they are fully human or partly AI.", "ans": "T", "ko": "사람들은 자신이 완전한 인간인지 일부 AI인지 확신하지 못하게 될 수 있다.", "eve": "...create confusion about whether we are human, AI, or something in between.", "evk": "...우리가 인간인지, AI인지, 아니면 그 중간인지에 대한 혼란을 일으킬 수 있습니다.", "why": "something in between(그 중간)을 partly AI(일부 AI)로 풀어 쓴 맞는 문장이에요. whether ~는 '~인지 아닌지'라는 명사절이에요."}, {"en": "Some specialists warn that AI implants may blur lines between humans and machines.", "ans": "T", "ko": "일부 전문가들은 AI 임플란트가 인간과 기계의 경계를 흐릴 수 있다고 경고한다.", "eve": "...whether we are human, AI, or something in between.", "evk": "...우리가 인간인지, AI인지, 아니면 그 중간인지.", "why": "'인간인지 AI인지 그 중간인지'라는 혼란을 '인간과 기계의 경계가 흐려진다'고 풀어 쓴 맞는 문장이에요. 정체성에 대한 우려를 한 번 더 강조하는 표현이에요."}, {"en": "Privacy is a major concern regarding AI-connected neural implants.", "ans": "T", "ko": "프라이버시는 AI와 연결된 신경 임플란트에 관한 주요 우려이다.", "eve": "Another critical issue is privacy.", "evk": "또 다른 중요한 문제는 프라이버시입니다.", "why": "Another(또 다른)가 새 문제를 알리는 신호예요. critical(중요한)을 major(주요한)로 바꿔 쓴 맞는 문장이에요. 정체성 문제 다음에 두 번째 문제로 프라이버시가 나와요."}, {"en": "There is a risk that hackers may access private information illegally.", "ans": "T", "ko": "해커가 개인 정보에 불법적으로 접근할 위험이 있다.", "eve": "There's a risk that organizations or hackers could access personal data without permission through AI-connected implants.", "evk": "조직이나 해커가 AI와 연결된 임플란트를 통해 허가 없이 개인 정보에 접근할 수 있는 위험이 있습니다.", "why": "without permission(허가 없이)을 illegally(불법적으로)로 바꿔 쓴 맞는 문장이에요. 접근하는 주체는 해커뿐 아니라 organizations(조직)도 있다는 점을 기억하세요."}, {"en": "Organizations will always need explicit permission before accessing neural data.", "ans": "F", "ko": "조직들은 신경 데이터에 접근하기 전에 항상 명시적인 허가를 받아야 한다.", "eve": "...organizations or hackers could access personal data without permission...", "evk": "...조직이나 해커가 허가 없이 개인 정보에 접근할 수 있는...", "why": "본문은 **허가 없이(without permission)** 접근할 위험을 말해요. '항상 허가를 받는다'는 안전한 상황이라서 위험을 말하는 본문과 반대예요."}, {"en": "The speaker suggests AI-connected technology could threaten individual privacy seriously.", "ans": "T", "ko": "화자는 AI와 연결된 기술이 개인의 프라이버시를 심각하게 위협할 수 있다고 제안한다.", "eve": "There's a risk that organizations or hackers could access personal data without permission through AI-connected implants.", "evk": "조직이나 해커가 AI와 연결된 임플란트를 통해 허가 없이 개인 정보에 접근할 수 있는 위험이 있습니다.", "why": "'There's a risk that ~(~할 위험이 있다)'를 threaten privacy(프라이버시를 위협하다)로 풀어 쓴 맞는 문장이에요. AI와 연결되어 있기 때문에 밖에서 접근할 수 있다는 점이 핵심이에요."}]}, {"part": "❹", "title": "해킹과 사회적 불평등", "flow": "해커가 생각·감정·행동을 통제할 수도 있어요. 또 높은 비용 때문에 모든 사람이 이용하지 못하면 사회적 불평등이 더 커지고, 임플란트를 감당할 수 있는 사람과 그렇지 못한 사람 사이의 분열이 심해질 수 있어요.", "items": [{"en": "Hackers might control human thoughts and emotions through brain devices.", "ans": "T", "ko": "해커가 뇌 장치를 통해 사람의 생각과 감정을 조종할 수 있을지도 모른다.", "eve": "This means that our thoughts, emotions, and behaviors could be controlled by hackers.", "evk": "이것은 우리의 생각, 감정, 행동이 해커에 의해 통제될 수 있다는 것을 의미합니다.", "why": "This means that ~ 은 앞 문장(허가 없는 접근 위험)이 어떤 결과로 이어지는지 보여 줘요. 데이터를 훔쳐보는 데서 끝나지 않고 **생각·감정·행동까지 통제될 수 있다**는 더 큰 우려예요."}, {"en": "Users’ behaviors are fully independent and cannot be influenced by hackers.", "ans": "F", "ko": "사용자의 행동은 완전히 독립적이어서 해커의 영향을 받을 수 없다.", "eve": "...our thoughts, emotions, and behaviors could be controlled by hackers.", "evk": "...우리의 생각, 감정, 행동이 해커에 의해 통제될 수 있다.", "why": "본문은 행동도 **통제될 수 있다(could be controlled)**고 해요. 독립적이어서 영향을 받을 수 없다는 말은 정반대예요. 생각, 감정, 행동 세 가지가 모두 대상이에요."}, {"en": "High costs of AI implants may prevent all people from accessing them.", "ans": "T", "ko": "AI 임플란트의 높은 비용 때문에 모든 사람이 이용하지 못할 수 있다.", "eve": "There's an additional risk that this technology could lead to even greater social inequality, given that it may not be available to all due to its high cost.", "evk": "이 기술이 높은 비용 때문에 모든 사람에게 제공되지 않을 수 있다는 점을 고려하면, 사회적 불평등을 더욱 심화시킬 수 있다는 추가적인 위험도 있습니다.", "why": "due to its high cost(높은 비용 때문에)가 원인이고, may not be available to all(모두에게 제공되지 않을 수 있다)이 결과예요. given that ~은 '~을 고려하면'이라는 뜻이에요."}, {"en": "The speaker claims social equality will automatically improve with implants.", "ans": "F", "ko": "화자는 임플란트와 함께 사회적 평등이 자동으로 나아질 것이라고 주장한다.", "eve": "...this technology could lead to even greater social inequality...", "evk": "...이 기술이 사회적 불평등을 더욱 심화시킬 수 있다...", "why": "본문은 오히려 **더 큰 불평등(even greater social inequality)**을 걱정해요. 평등이 자동으로 나아진다는 말은 반대예요. 'even greater'의 even이 '지금보다 더'라는 느낌을 줘요."}, {"en": "Experts suggest that unequal availability of implants may harm fairness in society.", "ans": "T", "ko": "전문가들은 임플란트를 불평등하게 이용하게 되면 사회의 공정성이 해쳐질 수 있다고 제안한다.", "eve": "...social inequality... may not be available to all due to its high cost.", "evk": "...사회적 불평등... 높은 비용 때문에 모든 사람에게 제공되지 않을 수 있다.", "why": "'social inequality(사회적 불평등)'를 'harm fairness in society(사회의 공정성을 해치다)'로 바꿔 쓴 맞는 문장이에요. 불평등 → 공정성 훼손으로 이어지는 말이에요."}, {"en": "The speaker insists that social divisions will disappear after people use implants.", "ans": "F", "ko": "화자는 사람들이 임플란트를 사용한 뒤에 사회적 분열이 사라질 것이라고 주장한다.", "eve": "Such unequal access to the technology could intensify the division between those who can afford the implants and those who cannot.", "evk": "기술에 대한 이러한 불평등한 접근은 임플란트를 감당할 수 있는 사람과 그렇지 못한 사람 사이의 분열을 심화시킬 수 있습니다.", "why": "본문은 분열이 **심해질(intensify)** 수 있다고 해요. 사라진다는 말은 정반대예요. intensify(심화시키다)는 점점 더 강하게 만든다는 뜻이에요."}, {"en": "People with financial resources may benefit more from neural implants than others.", "ans": "T", "ko": "경제적 여유가 있는 사람들이 다른 사람들보다 신경 임플란트의 혜택을 더 많이 받을 수 있다.", "eve": "...those who can afford the implants and those who cannot.", "evk": "...임플란트를 감당할 수 있는 사람과 그렇지 못한 사람.", "why": "those who can afford(감당할 수 있는 사람)를 people with financial resources(경제적 여유가 있는 사람)로 바꿔 쓴 맞는 문장이에요. afford는 '~을 살 여유가 있다'라는 뜻이에요."}, {"en": "People without enough money might be excluded from the benefits of AI devices.", "ans": "T", "ko": "충분한 돈이 없는 사람들은 AI 장치의 혜택에서 제외될 수 있다.", "eve": "...the division between those who can afford the implants and those who cannot.", "evk": "...임플란트를 감당할 수 있는 사람과 그렇지 못한 사람 사이의 분열.", "why": "those who cannot(감당할 수 없는 사람)이 혜택에서 밀려난다는 뜻이에요. 앞 문장과 짝으로 '가진 사람 vs 못 가진 사람'의 분열을 설명해요."}]}, {"part": "❺", "title": "신경 윤리라는 해법", "flow": "글쓴이는 신경 윤리에 대한 신중한 고찰을 통해 이러한 난제를 극복하길 바라요.", "items": [{"en": "The speaker claims that neuroethics has no role in solving these challenges.", "ans": "F", "ko": "화자는 신경 윤리가 이러한 과제를 해결하는 데 아무 역할도 하지 않는다고 주장한다.", "eve": "I hope that we can overcome these challenges through careful consideration of neuroethics.", "evk": "나는 신경 윤리에 대한 신중한 고찰을 통해 우리가 이러한 난제를 극복할 수 있기를 바랍니다.", "why": "화자는 신경 윤리를 통해 난제를 **극복할 수 있기를 바란다(I hope)**고 말해요. 역할이 없다는 말은 반대예요. 문제를 말한 뒤 해결 방향을 제시하는 소단락이에요."}, {"en": "The speaker believes careful ethical reflection will guide solutions to complex problems.", "ans": "T", "ko": "화자는 신중한 윤리적 성찰이 복잡한 문제의 해결책을 이끌 것이라고 믿는다.", "eve": "...we can overcome these challenges through careful consideration of neuroethics.", "evk": "...신경 윤리에 대한 신중한 고찰을 통해 이러한 난제를 극복할 수 있기를.", "why": "careful consideration(신중한 고찰)을 careful ethical reflection(신중한 윤리적 성찰)로, overcome(극복하다)을 guide solutions(해결책을 이끌다)로 바꿔 쓴 맞는 문장이에요."}, {"en": "Experts warn that careful consideration will make brain technology problems worse.", "ans": "F", "ko": "전문가들은 신중히 고려하면 뇌 기술의 문제가 더 나빠질 것이라고 경고한다.", "eve": "...we can overcome these challenges through careful consideration of neuroethics.", "evk": "...신경 윤리에 대한 신중한 고찰을 통해 이러한 난제를 극복할 수 있기를.", "why": "신중한 고찰의 결과는 '악화'가 아니라 **'극복'**이에요. 본문의 방향과 정반대예요. 긍정적 결과(overcome)를 부정적 결과로 뒤집은 문장이에요."}]}, {"part": "❺", "title": "사전 검토의 필요성", "flow": "신경 윤리는 신경 기술의 사회적 측면을 강조하고 무엇이 합법적이고 윤리적인지 답을 제시해요. 글쓴이는 뇌 연구 전에 사전 검토 절차를 세우고 윤리적 측면을 철저히 평가해야, 과학이 윤리적 원칙에 따라 발전한다고 생각해요.", "items": [{"en": "Neuroethics studies social issues and legal questions of brain technology.", "ans": "T", "ko": "신경 윤리는 뇌 기술의 사회적 문제와 법적 문제를 다룬다.", "eve": "This field highlights the social aspects of neural technology and provides possible answers to what should be considered legal and ethical.", "evk": "이 분야는 신경 기술의 사회적 측면을 강조하고 무엇이 합법적이고 윤리적으로 여겨져야 하는지에 대한 가능한 답을 제시합니다.", "why": "This field는 앞 문장의 neuroethics(신경 윤리)를 가리켜요. 'social aspects(사회적 측면)'와 'legal and ethical(합법적이고 윤리적인)'이 핵심 단어예요."}, {"en": "The speaker believes it is necessary to review ethics before brain experiments.", "ans": "T", "ko": "화자는 뇌 실험 전에 윤리를 검토하는 것이 필요하다고 믿는다.", "eve": "I think it is important to establish a prior review process and thoroughly assess the ethical aspects before any kind of brain research is conducted.", "evk": "나는 어떤 종류의 뇌 연구가 수행되기 전에 사전 검토 절 function rich(p,s){var parts=s.split('**');parts.forEach(function(t,i){if(!t)return;if(i%2){var b=el('b',null,t);p.appendChild(b)}else p.appendChild(document.createTextNode(t))})}
document.getElementById('h').textContent=D.title+' · 본문과 다른 문장 찾기';
if(PART){var _n=el('div','sub','');_n.innerHTML='이번 범위: <b>'+PARTS.names.L4[PART]+'</b>';var _h=document.getElementById('h');_h.parentNode.insertBefore(_n,_h.nextSibling)}
var root=document.getElementById('root'),prog=el('span','prog','');
var nav=document.getElementById('nav');

var WNA='find';
function wnNote(host,mode){ /* host: 요소 뒤에 안내 줄 삽입 */
  var d=document.createElement('div');d.id='wnote';d.style.cssText='margin:8px 0;font-size:14px;color:#57534e';
  host.parentNode.insertBefore(d,host.nextSibling);return d}
function wnRender(d,fin){
  if(WN.MODE){
    d.innerHTML=WN.MIX?WN.mixNote(fin):'<b>오답 다시 풀기</b> · 오답 노트에 담은 문제만 보여요. <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트 보기 ›</a>'+(fin?'<div style="margin-top:6px">이제 안 봐도 되는 문제는 오답 노트에서 \'빼기\'로 뺄 수 있어요.</div>':'');
  }else{
    var n=WN.ids('L4',PART,WNA).length;
    d.innerHTML=n?'<a href="../wrong.html" style="font-size:13px;color:#0f766e;text-decoration:underline">틀린 '+n+'개가 오답 노트에 담겼어요 ›</a>':''}
}
function wnEmpty(host){
  var m=document.createElement('div');m.style.cssText='margin:24px 0;padding:18px;border:1px solid #d6d3d1;border-radius:12px;text-align:center;font-size:16px';
  m.innerHTML='오답 노트에 담긴 문제가 없어요.<div style="margin-top:8px"><a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트로 가기 ›</a></div>';
  host.parentNode.insertBefore(m,host.nextSibling)}
var wn=wnNote(nav);wnRender(wn,false);
if(WEMPTY){nav.style.display='none';wnEmpty(wn)}else if(!D.groups.length){nav.style.display='none';var _e=document.createElement('div');_e.style.cssText='margin:24px 0;padding:18px;border:1px solid #d6d3d1;border-radius:12px;text-align:center;font-size:16px';_e.textContent='이 범위에는 본문과 다른 문장 찾기 문제가 없어요.';wn.parentNode.insertBefore(_e,wn.nextSibling)}
function wnItem(g){return{kind:'L4',part:PART,act:'find',qid:String(g._i),label:'본문 '+g.part+' · '+g.title}}
function wnMan(g){var m=g._wm;if(!m)return;m.innerHTML='';var b=WN.manual(wnItem(g));if(b)m.appendChild(b)}
function wnWrong(g){WN.add(wnItem(g));wnMan(g);wnRender(wn,false)}
var secs={};
D.parts.forEach(function(p){var b=el('button',null,p[1]);b.onclick=function(){secs[p[0]].scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b)});
var bClose=el('button','closeall','답 모두 닫기');bClose.onclick=function(){S={};save();paint();window.scrollTo({top:0,behavior:'smooth'})};nav.insertBefore(bClose,nav.firstChild);nav.appendChild(prog);
var cards=[];
D.parts.forEach(function(p){
  var h=el('h2',null,p[1]);root.appendChild(h);secs[p[0]]=h;
  D.groups.forEach(function(g,gi){
    if(g.part!==p[0])return;
    var card=el('div','grp'),head=el('div','gh');
    head.appendChild(el('div','gt',g.title));
    var cnt=el('span','cnt','');head.appendChild(cnt);card.appendChild(head);
    var nF=g.items.filter(function(i){return i.ans==='F'}).length;
    card.appendChild(el('div','ask',nF?('본문과 다른 문장이 '+nF+'개 있어요. 찾아서 눌러 보세요.'):'본문과 다른 문장이 있을 수도, 없을 수도 있어요. 모두 눌러서 확인해 보세요.'));
    var btns=[];
    g.items.forEach(function(it,ii){
      var b=el('div','it');b.setAttribute('role','button');b.tabIndex=0;
      var line=el('div');line.appendChild(el('span','no',(ii+1)+'.'));line.appendChild(document.createTextNode(' '+it.en));b.appendChild(line);
      var pn=el('div','pn');
      pn.appendChild(el('div','ko',it.ko));
      var ev=el('div','ev');ev.appendChild(el('span','e',it.eve));if(it.evk)ev.appendChild(el('span','k',it.evk));
      pn.appendChild(el('span','tag','본문 근거'));pn.appendChild(ev);
      pn.appendChild(el('span','tag','해설'));var w=el('div','why');rich(w,it.why);pn.appendChild(w);
      b.appendChild(pn);
      var id=gi+'-'+ii;
      function open(){
        if(b.classList.contains('open'))return;
        var fd=btns.filter(function(x){return S[x.id]&&x.it.ans==='F'}).length;
        if(it.ans==='T'&&fd<nF)wnWrong(g);
        S[id]=1;save();paint(true);
      }
      b.onclick=open;b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
      card.appendChild(b);btns.push({b:b,id:id,it:it,pn:pn});
    });
    var tools=el('div','tools');
    var bAll=el('button',null,'나머지 해설 모두 열기');bAll.onclick=function(){var fd=btns.filter(function(x){return S[x.id]&&x.it.ans==='F'}).length;if(fd<nF)wnWrong(g);btns.forEach(function(x){S[x.id]=1});save();paint(true)};
    var bReset=el('button',null,'이 소단락 다시 하기');bReset.onclick=function(){btns.forEach(function(x){delete S[x.id]});save();paint()};
    tools.appendChild(bAll);tools.appendChild(bReset);card.appendChild(tools);var wm=el('div','wm');g._wm=wm;card.appendChild(wm);wnMan(g);
    var flow=el('div','flow');flow.appendChild(el('span','tag','이 소단락 정리'));flow.appendChild(document.createTextNode(g.flow));card.appendChild(flow);
    root.appendChild(card);
    cards.push({g:g,btns:btns,cnt:cnt,flow:flow,nF:nF});
  });
});
function paint(user){
  var done=0;
  cards.forEach(function(c){
    var found=0,all=true;
    c.btns.forEach(function(x){
      var o=!!S[x.id];
      x.b.classList.toggle('open',o);
      x.b.classList.remove('ok','no2');
      var old=x.b.querySelector('.badge');if(old)old.remove();
      if(o){
        var f=x.it.ans==='F';x.b.classList.add(f?'ok':'no2');
        if(f)found++;
        var bd=el('span','badge',f?'✔ 본문과 다른 문장 · 잘 찾았어요':'본문과 같은 내용이에요 · 맞는 문장');
        x.b.insertBefore(bd,x.pn);
      }
      if(!o)all=false;
    });
    var fin=found===c.nF&&(c.nF>0||c.btns.every(function(x){return !!S[x.id]}));
    c.cnt.textContent=c.nF?('다른 문장 '+found+'/'+c.nF+' 찾음'):(c.btns.every(function(x){return !!S[x.id]})?'모두 확인':'확인 중');
    c.cnt.classList.toggle('done',fin);
    c.flow.classList.toggle('on',fin);
    if(fin)done++;
  });
  prog.textContent='소단락 '+done+'/'+cards.length+' 확인';
  if(user&&cards.length&&done===cards.length&&!S._m){S._m=1;save();if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}
  if(WN.MODE&&cards.length)wnRender(wn,done===cards.length);
}
paint();
</script><div style="height:64px"></div><a class="homefab" href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#0f766e;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a><script src="../../common/prog.js?v=261019"></script><script>if(!WN.MODE)PG.bar(PGK,"풀었어요")</script></body></html>
