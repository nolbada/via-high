<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><meta name="robots" content="noindex"><title>스페셜 · 교과서 다지기</title>
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="../common/sx.css?v=261019">
<style>
.hd2{margin:14px 2px 6px;font-size:13.5px;font-weight:800;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 4px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--navy);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;line-height:1;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){.chip.on,.btn{color:#0b1220}}
.rem{font-size:12.5px;color:var(--sub);margin:8px 2px 0}
.btn{display:block;width:100%;margin:12px 0 0;border:0;background:var(--pri);color:#fff;font-weight:800;font-size:16px;line-height:1.2;border-radius:12px;padding:14px;cursor:pointer}
.btn.l{background:var(--card);color:var(--sub);border:1.5px solid var(--line);font-size:14.5px;padding:12px;font-weight:700}
.btn:disabled{opacity:.35;cursor:default}
.note{font-size:13.5px;color:var(--sub);line-height:1.65;margin:4px 2px 10px}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--teal);background:var(--tealL);border:1px solid var(--teal);border-radius:999px;padding:0 9px;margin-left:6px;vertical-align:2px}
.st{background:var(--card);border:1.5px solid var(--pri);border-radius:14px;padding:14px;margin:12px 0}
.st .r{font-size:18px;font-weight:800;color:var(--navy)}.st .s{font-size:14px;color:var(--sub);margin-top:3px}
.pbar{height:8px;border-radius:99px;background:var(--line);margin:10px 0 2px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--pri)}
.cy{font-size:13px;color:#b45309;margin:8px 0 0}
/* 문제 카드 */
.qc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin:12px 0}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px;color:var(--sub);font-weight:700}
.qh .no{background:var(--navy);color:var(--card);border-radius:8px;font-size:14px;font-weight:800;padding:1px 10px}
.qp{font-weight:700;font-size:15px;color:var(--sub);margin:2px 0 8px}
.ctx{font-size:15px;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 10px;line-height:1.65}
.sen{font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.85;margin:4px 0 14px}
.blk{display:inline-block;min-width:72px;border-bottom:2.5px solid var(--pri);text-align:center;color:var(--pri);font-weight:800;padding:0 6px;margin:0 2px}
.blk.ok{color:var(--ok);border-color:var(--ok)}.blk.ng{color:var(--ans);border-color:var(--ans)}
.opts{display:flex;flex-direction:column;gap:9px}
.op{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 14px;font-size:18px;font-weight:700;cursor:pointer;line-height:1.35}
.op.sel{border-color:var(--pri);background:var(--priL)}
.op.ok{border-color:var(--ok);background:var(--okBg)}
.op.ng{border-color:var(--ans);background:var(--ngBg)}
.op:disabled{cursor:default}
.pair{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.pair b{font-family:Georgia,"Times New Roman",serif;font-size:23px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 16px}
.pair i{font-style:normal;color:var(--sub);font-weight:800}
.res{border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:16px;line-height:1.7}
.res.ok{background:var(--okBg);border:1.5px solid var(--ok)}.res.ng{background:var(--ngBg);border:1.5px solid var(--ans)}
.res .v{font-weight:800;font-size:17px}.res.ok .v{color:var(--ok)}.res.ng .v{color:var(--ans)}
.res .en{font-family:Georgia,"Times New Roman",serif;font-size:18px;margin:6px 0 2px;line-height:1.7}
.res .en u{text-decoration:none;border-bottom:2.5px solid var(--ok);font-weight:800}
.res .ko,.rv .ko{color:var(--ink);font-size:15.5px;margin:2px 0}
.mem{margin:10px 0 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;line-height:1.65;color:var(--ink)}
.mh{display:block;font-size:12.5px;font-weight:800;color:var(--teal);margin-bottom:2px}
.vb{margin:8px 0 0;font-size:14px;line-height:1.7;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.vbh{font-size:12.5px;font-weight:800;color:var(--sub)}
.vbi b{font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.cko{font-size:14px;color:var(--ink);margin-top:3px}
.wp{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.wp .wc{display:flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 14px;min-width:0;max-width:100%}
.wp .wc b{font-family:Georgia,"Times New Roman",serif;font-size:19px;overflow-wrap:anywhere}.wp .wc span{font-size:14px;color:var(--ink);text-align:center}
.wp i{font-style:normal;font-weight:800;font-size:20px;color:var(--sub)}
.rl{text-align:center;font-size:13.5px;font-weight:700;color:var(--sub)}
.rv{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:15px}
.rv .en{font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.7}
.rv .en u{text-decoration:none;border-bottom:2.5px solid var(--ok);font-weight:800}
.rv .mem{background:var(--bg)}
.fin{background:var(--priL);border-radius:14px;padding:16px;margin:12px 0;text-align:center}.fin b{font-size:20px;color:var(--navy)}.fin p{margin:6px 0 0;font-size:14px;color:var(--sub)}
.skip{display:block;margin:12px auto 0;background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← 목록</a></div>
<h1>스페셜 · 교과서 다지기<span class="tag">매번 다른 문제</span></h1>
<div id="app"></div>
<div class="foot" style="text-align:center;color:var(--sub);font-size:13px;margin-top:26px">비타민 영어클리닉</div></div>
<a class="homefab" href="index.html">⌂ 목록</a>
<script src="dajigi-data.js?v=261024b"></script>
<script>
(function(){
var QUOTA=20;
var seg=location.pathname.split('/'),si=seg.indexOf('h'),SCH=(si>=0&&seg[si+1])||'x',KEY='vhdj:'+SCH;
var ITEMS=(window.DAJIGI&&DAJIGI.items)||[],BY={};ITEMS.forEach(function(it){BY[it.id]=it});
var LN={L3:'3과',L4:'4과'},TN={g:'문법',v:'어휘'};
var REL={s:'비슷한 뜻',a:'반대 뜻',n:'관련 없음'};
var app=document.getElementById('app');
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&typeof o==='object')return o}catch(e){}return{round:0,used:[],wrong:[],cur:null}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var SEL={range:'all',type:'all'};
(function(){var S=load();if(S.sel)SEL={range:S.sel.range||'all',type:S.sel.type||'all'}})();
function pool(sel){return ITEMS.filter(function(it){return(sel.range==='all'||it.L===sel.range)&&(sel.type==='all'||it.t===sel.type)})}
function draw(S,sel){
  var P=pool(sel),used={};(S.used||[]).forEach(function(i){used[i]=1});
  var fresh=P.filter(function(it){return!used[it.id]}),wrap=0;
  if(!fresh.length){wrap=1;S.used=[];used={};fresh=P.slice()}
  var g=shuf(fresh.filter(function(i){return i.t==='g'})),v=shuf(fresh.filter(function(i){return i.t==='v'})),pick=[];
  if(sel.type==='g')pick=g.slice(0,QUOTA);else if(sel.type==='v')pick=v.slice(0,QUOTA);
  else{var ng=Math.min(g.length,Math.ceil(QUOTA/2)),nv=Math.min(v.length,QUOTA-ng);ng=Math.min(g.length,QUOTA-nv);pick=g.slice(0,ng).concat(v.slice(0,nv))}
  pick=shuf(pick);
  S.used=(S.used||[]).concat(pick.map(function(i){return i.id}));
  S.round=(S.round||0)+1;S.cur={ids:pick.map(function(i){return i.id}),i:0,sub:{},wrapped:wrap,sel:sel,retry:0};
  return S}
/* 화면 */
function home(){
  var S=load(),P=pool(SEL),used={};(S.used||[]).forEach(function(i){used[i]=1});
  var rem=P.filter(function(it){return!used[it.id]}).length;
  var h='';
  if(!ITEMS.length){app.innerHTML='<div class="note">아직 준비된 문제가 없어요.</div>';return}
  h+='<div class="note">3과·4과 교과서 본문에서 문법 고르기와 어휘(비슷한 뜻·반대 뜻)를 섞어 풀어요. 보기를 누르면 바로 정답과 해설이 나와요. 4과까지 끝나고 모의고사를 다 푼 뒤에 돌아와서 풀어 보세요.</div>';
  var cur=S.cur;
  if(cur&&cur.ids&&cur.i<cur.ids.length){
    h+='<div class="st"><div class="r">풀던 세트 '+(cur.i)+' / '+cur.ids.length+'</div><div class="s">'+(cur.retry?'틀린 문제 다시 풀기':'랜덤 '+S.round+'회')+'</div><div class="pbar"><i style="width:'+Math.round(cur.i/cur.ids.length*100)+'%"></i></div></div>';
    h+='<button class="btn" id="resume">이어서 풀기</button><div class="hd2">새로 시작</div>'}
  h+='<div class="hd2">범위</div><div class="chips">'+[['all','전체'],['L3','3과'],['L4','4과']].map(function(r){return'<button type="button" class="chip'+(SEL.range===r[0]?' on':'')+'" data-r="'+r[0]+'">'+r[1]+'</button>'}).join('')+'</div>';
  h+='<div class="hd2">유형</div><div class="chips">'+[['all','전체'],['g','문법'],['v','어휘']].map(function(r){return'<button type="button" class="chip'+(SEL.type===r[0]?' on':'')+'" data-t="'+r[0]+'">'+r[1]+'</button>'}).join('')+'</div>';
  h+='<div class="rem">남은 문제 '+rem+'개 (전체 '+P.length+'개)</div>';
  var lab=!P.length?'':rem===0?'새로 섞어서 '+Math.min(QUOTA,P.length)+'문항 시작':rem<QUOTA?'남은 '+rem+'문항 풀기':QUOTA+'문항 시작';
  h+=P.length?'<button class="btn'+(cur&&cur.ids&&cur.i<cur.ids.length?' l':'')+'" id="go">'+lab+'</button>':'<div class="rem">이 범위에는 해당 유형 문제가 없어요.</div>';
  var W=(S.wrong||[]).filter(function(i){return BY[i]});
  if(W.length)h+='<button class="btn l" id="rw">틀린 문제 다시 풀기 ('+W.length+')</button>';
  app.innerHTML=h;
  var q=function(id,f){var e=document.getElementById(id);if(e)e.onclick=f};
  q('resume',function(){quiz()});
  q('go',function(){var S1=load();save(draw(S1,{range:SEL.range,type:SEL.type}));window.scrollTo(0,0);quiz()});
  q('rw',function(){var S1=load(),ids=shuf((S1.wrong||[]).filter(function(i){return BY[i]})).slice(0,QUOTA);S1.cur={ids:ids,i:0,sub:{},retry:1,sel:SEL};save(S1);window.scrollTo(0,0);quiz()})}
app.addEventListener('click',function(e){
  var r=e.target.closest('button[data-r]');if(r){SEL.range=r.dataset.r;var S=load();S.sel=SEL;save(S);home();return}
  var t=e.target.closest('button[data-t]');if(t){SEL.type=t.dataset.t;var S2=load();S2.sel=SEL;save(S2);home()}});
function sen(it,mode,pickIdx){
  var m=/^(.*?)\[\[([^\]]*)\]\](.*)$/.exec(it.en),o=m[2].split('|');
  var core=function(cls,txt){return'<span class="blk'+(cls?' '+cls:'')+'">'+E(txt)+'</span>'};
  var mid=mode==='q'?core('',pickIdx>=0?o[pickIdx]:'     '):mode==='ok'?'<u>'+E(o[it.a])+'</u>':core('',o[it.a]);
  return E(m[1])+mid+E(m[3])}
function opts(it){return/\[\[([^\]]*)\]\]/.exec(it.en)[1].split('|')}
function vbl(it){if(!it.vb||!it.vb.length)return'';return'<div class="vb"><span class="vbh">동사 기본형</span>'+it.vb.map(function(e){var f=e[0],b=e[1];return'<span class="vbi">'+(f.toLowerCase()===b?'':E(f)+' → ')+'<b>'+E(b)+'</b>('+E(e[2])+')</span>'}).join('')+'</div>'}
function isOk(it,p){return it.t==='g'?p===it.a:p===it.rel}
function body(it){var h;
  if(it.t==='g'){h='<div class="en">'+sen(it,'ok')+'</div><div class="ko">'+E(it.ko||'')+'</div>'+(it.why?'<div class="mem"><span class="mh">이렇게 기억해요</span>'+E(it.why)+'</div>':'')+vbl(it)}
  else{var sym=it.rel==='s'?'=':it.rel==='a'?'↔':'≠';
    h='<div class="wp"><div class="wc"><b>'+E(it.w1)+'</b><span>'+E(it.ko1||'')+'</span></div><i>'+sym+'</i><div class="wc"><b>'+E(it.w2)+'</b><span>'+E(it.ko2||'')+'</span></div></div><div class="rl">'+REL[it.rel]+'</div>'+vbl(it)}
  return h}
function res(it,pick){
  var ok=isOk(it,pick),v;
  if(it.t==='g'){var o=opts(it);v=ok?'정답이에요':'오답이에요 · 정답은 '+E(o[it.a])}
  else v=ok?'정답이에요':'오답이에요 · 정답은 '+REL[it.rel];
  return{ok:ok,h:'<div class="res '+(ok?'ok':'ng')+'"><div class="v">'+v+'</div>'+body(it)+'</div>'}}
function quiz(){
  var S=load(),cur=S.cur;if(!cur||!cur.ids){home();return}
  if(!cur.sub)cur.sub={};
  if(cur.i>=cur.ids.length){finish();return}
  var id=cur.ids[cur.i],it=BY[id];if(!it){cur.i++;save(S);quiz();return}
  var sub=cur.sub[id],done=sub!==undefined;
  var n=cur.ids.length,h='<div class="st" style="padding:10px 14px"><div class="s" style="margin:0">'+(cur.retry?'틀린 문제 다시 · ':'')+(cur.i+1)+' / '+n+'</div><div class="pbar"><i style="width:'+Math.round((cur.i+(done?1:0))/n*100)+'%"></i></div></div>';
  h+='<div class="qc"><div class="qh"><span class="no">'+(cur.i+1)+'번</span><span>'+TN[it.t]+' · '+LN[it.L]+'</span></div>';
  if(it.t==='g'){
    var o=opts(it);
    h+='<div class="qp">괄호 안에서 어법상 알맞은 것을 고르세요.</div>'+(it.ctx?'<div class="ctx">'+E(it.ctx)+(done&&it.ctxko?'<div class="cko">'+E(it.ctxko)+'</div>':'')+'</div>':'')+'<div class="sen">'+sen(it,'q',done?sub:-1)+'</div>';
    h+='<div class="opts">'+o.map(function(t,i){var c=done?(i===it.a?' ok':(i===sub?' ng':'')):'';return'<button type="button" class="op'+c+'" data-p="'+i+'"'+(done?' disabled':'')+'>'+E(t)+'</button>'}).join('')+'</div>'}
  else{
    h+='<div class="qp">두 단어의 관계는?</div><div class="pair"><b>'+E(it.w1)+'</b><i>?</i><b>'+E(it.w2)+'</b></div><div class="opts">'+['s','a','n'].map(function(k){var c=done?(k===it.rel?' ok':(k===sub?' ng':'')):'';return'<button type="button" class="op'+c+'" data-p="'+k+'"'+(done?' disabled':'')+'>'+REL[k]+'</button>'}).join('')+'</div>'}
  if(done){h+=res(it,sub).h;h+='<button class="btn" id="nx">'+(cur.i+1>=n?'결과 보기':'다음 문제')+'</button>'}
  h+='</div><button type="button" class="skip" id="home">목록으로 (풀던 곳에서 이어 풀 수 있어요)</button>';
  app.innerHTML=h;
  if(!done){[].forEach.call(app.querySelectorAll('.op'),function(b){b.onclick=function(){
      var S1=load(),c1=S1.cur;if(!c1||c1.ids[c1.i]!==id)return;if(!c1.sub)c1.sub={};if(c1.sub[id]!==undefined)return;
      var v=b.dataset.p;v=(it.t==='g')?+v:v;c1.sub[id]=v;if(c1.ans)delete c1.ans[id];
      var W=S1.wrong||[],ix=W.indexOf(id);if(isOk(it,v)){if(ix>=0)W.splice(ix,1)}else if(ix<0)W.push(id);
      S1.wrong=W;save(S1);quiz();var r=app.querySelector('.res');if(r&&r.scrollIntoView)r.scrollIntoView({block:'nearest',behavior:'smooth'})}})}
  else{document.getElementById('nx').onclick=function(){var S1=load();S1.cur.i++;save(S1);window.scrollTo(0,0);quiz()}}
  document.getElementById('home').onclick=function(){home()}}
function finish(){
  var S=load(),cur=S.cur,ok=0,bad=[];if(!cur.sub)cur.sub={};
  cur.ids.forEach(function(id){var it=BY[id];if(!it)return;var p=cur.sub[id];if(p===undefined)return;if(isOk(it,p))ok++;else bad.push(it)});
  var n=cur.ids.length,h='<div class="fin"><b>'+n+'문항 중 '+ok+'개 맞았어요</b><p>'+(bad.length?'틀린 '+bad.length+'문항은 아래에서 다시 확인하고, 따로 모아 다시 풀 수 있어요.':'모두 맞혔어요.')+'</p></div>';
  if(bad.length){h+='<div class="hd2">틀린 문제</div>';
    bad.forEach(function(it){h+='<div class="rv">'+(it.t==='g'&&it.ctx?'<div class="ctx">'+E(it.ctx)+(it.ctxko?'<div class="cko">'+E(it.ctxko)+'</div>':'')+'</div>':'')+body(it)+'</div>'})}
  var W=(S.wrong||[]).filter(function(i){return BY[i]});
  if(W.length)h+='<button class="btn" id="rw">틀린 문제 다시 풀기 ('+W.length+')</button>';
  h+='<button class="btn'+(W.length?' l':'')+'" id="again">새로 20문항 풀기</button><a class="btn l" style="text-align:center;text-decoration:none" href="index.html">목록으로</a>';
  app.innerHTML=h;window.scrollTo(0,0);
  var a=document.getElementById('again');if(a)a.onclick=function(){S.cur=null;save(S);home()};
  var r=document.getElementById('rw');if(r)r.onclick=function(){var S1=load(),ids=shuf((S1.wrong||[]).filter(function(i){return BY[i]})).slice(0,QUOTA);S1.cur={ids:ids,i:0,sub:{},retry:1,sel:SEL};save(S1);window.scrollTo(0,0);quiz()}}
home();
})();
</script></body></html>
