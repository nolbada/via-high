    var o = it.o[oi], cls = '';
    if (isDone) { if (oi === it.a) cls = ' ok'; else if (oi === shown) cls = ' ng'; }
    h += '<button class="ob' + cls + '" data-opt="' + oi + '"><span class="ot"><span class="on">' + CIRC[k] + '</span><span class="ow">' + esc(optText(o)) + '</span></span><span class="bd b1">정답</span><span class="bd b2">내가 고름</span>' + (optKo(o) ? '<span class="k">' + esc(optKo(o)) + '</span>' : '') + (oi !== it.a && optWhy(o) ? '<span class="wy">' + esc(optWhy(o)) + '</span>' : '') + '</button>';
  });
  if (isDone) {
    var right = shown === it.a;
    h += '<div class="ex"><div class="res ' + (right ? 'o' : 'x') + '">' + (right ? '정답이에요.' : '정답은 ' + CIRC[ord.indexOf(it.a)] + '번이에요.') + '</div><div class="wl">우리쌤이 왜 짚으셨을까?</div><div class="why">' + hl(it.e) + '</div>' + (clue ? '<div class="clue"><b>수업 노트</b> · ' + esc(clue) + '</div>' : '') + '<div class="kk"><span class="kl">본문 해석</span>' + hl(it.k) + '</div>' +
      '<div class="pit"><span class="pt">본문 떠올리기</span><p>' + hl(it.m) + '</p></div></div>';
  }
  h += '</div>';
  var last = s.pos >= idx.length - 1;
  h += '<button class="next"' + (isDone ? '' : ' hidden') + ' data-next="1">' + (last ? (s.filt === 'wrong' || solved(u) === u.items.length ? '마무리 포스트잇 보기' : '남은 문제 이어서 풀기') : '다음') + '</button>';
  app.innerHTML = h;
}

function renderWrap(u) {
  var s = st(u.id), right = 0;
  u.items.forEach(function (it, i) { if (s.pick[i] === it.a) right++; });
  var wrongN = list(u, 'wrong').length;
  var h = '<div class="top"><button class="back" data-home="1">목록</button><div><div class="ut">' + esc(u.name) + '</div><div class="us">' + esc(u.sub) + '</div></div></div>';
  h += '<div class="wrapup"><div class="pit"><span class="pt">' + esc(u.name) + ' 마무리 포스트잇</span><ol>' + u.wrap.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ol></div></div>';
  h += '<p class="score">' + u.items.length + '문제 중 ' + right + '문제 맞혔어요.</p>';
  if (wrongN) h += '<button class="btn2" data-wrong="1">틀린 문제만 다시 풀기 (' + wrongN + ')</button>';
  h += '<button class="btn2" data-restart="1">처음부터 다시 (보기 순서가 바뀌어요)</button>';
  h += '<button class="btn2" data-home="1">목록으로</button>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

app.addEventListener('click', function (e) {
  var ah = e.target.closest('#apphome');
  if (ah) { try { if (document.referrer && document.referrer.indexOf('geumcheon-go1') >= 0 && history.length > 1) { e.preventDefault(); history.back(); } } catch (x) {} return; }
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sec) { openSec = openSec === b.dataset.sec ? null : b.dataset.sec; store.__open = openSec; save(); renderHome(); return; }
  if (b.dataset.unit) { var s0 = st(b.dataset.unit); if (s0.filt === 'wrong') { s0.filt = 'all'; s0.pos = 0; } save(); renderUnit(b.dataset.unit); window.scrollTo(0, 0); return; }
  if (b.dataset.home) { renderHome(); return; }
  var u = unitById(view.unit); if (!u) return;
  var s = st(u.id);
  if (b.dataset.filt) { s.filt = b.dataset.filt; s.pos = 0; s.retry = {}; save(); renderUnit(u.id, true); return; }
  if (b.dataset.opt !== undefined) {
    var idx = list(u, s.filt), i = idx[s.pos], oi = +b.dataset.opt;
    if (s.filt === 'wrong') { s.retry = s.retry || {}; if (s.retry[i] === undefined) s.retry[i] = oi; }
    else if (s.pick[i] === undefined) s.pick[i] = oi;
    save(); renderUnit(u.id, true); return;
  }
  if (b.dataset.next) {
    var idx2 = list(u, s.filt), last = s.pos >= idx2.length - 1;
    if (!last) { s.pos++; save(); renderUnit(u.id, true); window.scrollTo(0, 0); return; }
    if (s.filt === 'wrong') {
      for (var k in s.retry) { if (s.retry[k] === u.items[k].a) s.pick[k] = s.retry[k]; }
      s.retry = {};
    }
    var allDone = solved(u) === u.items.length;
    s.filt = 'all'; s.pos = 0;
    if (allDone) { s.done = true; save(); renderWrap(u); return; }
    var first = 0; while (first < u.items.length && s.pick[first] !== undefined) first++;
    s.pos = first < u.items.length ? first : 0; save(); renderUnit(u.id, true); window.scrollTo(0, 0); return;
  }
  if (b.dataset.wrong) { s.filt = 'wrong'; s.pos = 0; s.retry = {}; save(); renderUnit(u.id, true); window.scrollTo(0, 0); return; }
  if (b.dataset.restart) { s.pick = {}; s.pos = 0; s.filt = 'all'; s.done = false; s.retry = {}; s.seed = (s.seed || 1) + 1; save(); renderUnit(u.id, true); window.scrollTo(0, 0); return; }
});

renderHome();
</script>
</body>
</html>
