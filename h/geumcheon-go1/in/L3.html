</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "교과서 3과 삽입 다지기", "sub": "공통영어2 3과 · 6문제", "key": "geumcheon-go1:in:L3", "pass": [{"label": "3과 ① 도슨트 인사와 Bill Traylor의 삶", "sents": [{"en": "Welcome to the Dream Art Gallery!", "ko": "드림 아트 갤러리에 오신 것을 환영합니다!"}, {"en": "I'm Isabel Williams, the docent for the From Shadows to Spotlights exhibit.", "ko": "저는 〈그림자에서 빛으로〉 전시회의 도슨트 Isabel Williams입니다."}, {"en": "Today, you're going to meet three amazing artists who never gave up on their art, despite challenges in their lives.", "ko": "오늘 여러분은 인생의 역경에도 불구하고 예술을 결코 포기하지 않았던 세 명의 놀라운 예술가를 만나게 됩니다."}, {"en": "Each artist has a unique painting style and story that has made their work highly valued.", "ko": "각 예술가에게는 작품을 높이 평가받게 만든 독특한 화풍과 이야기가 있습니다."}, {"en": "Let's explore each artist's life and artwork.", "ko": "각 예술가의 삶과 작품을 함께 살펴봅시다."}, {"en": "The first artist we're going to examine is Bill Traylor.", "ko": "첫 번째로 살펴볼 예술가는 Bill Traylor입니다."}, {"en": "Traylor was born into slavery in the U.S. in 1853 and spent his early life working on a cotton farm in Alabama.", "ko": "Traylor는 1853년 미국에서 노예로 태어나 앨라배마의 목화 농장에서 일하며 어린 시절을 보냈습니다."}, {"en": "Although he became a free man after the American Civil War, he still had to face racial discrimination, working for very low wages on the farm.", "ko": "그는 미국 남북전쟁 이후 자유의 몸이 되었지만, 농장에서 아주 낮은 임금을 받고 일하며 여전히 인종차별을 겪어야 했습니다."}, {"en": "Later, when he was around 70 years old, Traylor moved to the city of Montgomery, Alabama, where he found a job in a factory.", "ko": "이후 70세 무렵 Traylor는 앨라배마주 몽고메리시로 이주해 그곳 공장에서 일자리를 얻었습니다."}, {"en": "It wasn't until he was 85 years old and became too ill to work that he turned to drawing to express his life experiences.", "ko": "85세가 되어 몸이 너무 아파 일할 수 없게 된 후에야 그는 자신의 인생 경험을 표현하려고 그림을 시작했습니다."}]}, {"label": "3과 ② Traylor의 작품과 Maud Lewis의 삶", "sents": [{"en": "Now, we're going to look at some of his paintings, starting with Mean Dog and Man and Large Dog.", "ko": "이제 〈비열한 개〉와 〈남자와 큰 개〉를 시작으로 그의 그림 몇 점을 살펴보겠습니다."}, {"en": "Traylor had a strong fear of dogs because they had often been used on farms to watch and hunt slaves.", "ko": "Traylor는 개를 몹시 두려워했는데, 농장에서 개가 노예를 감시하고 사냥하는 데 자주 쓰였기 때문입니다."}, {"en": "His fear of dogs is expressed strongly in these pieces.", "ko": "이 작품들에는 개에 대한 그의 두려움이 강하게 드러나 있습니다."}, {"en": "In contrast, Woman with Purse and Man with Umbrella portrays the free lives of African Americans that he observed on the streets of Montgomery.", "ko": "이와 대조적으로 〈핸드백을 든 여인과 우산을 든 남자〉는 그가 몽고메리 거리에서 본 아프리카계 미국인들의 자유로운 삶을 그립니다."}, {"en": "Using simple shapes and colors, Traylor captured complex moments in American history from slavery to freedom.", "ko": "Traylor는 단순한 형태와 색으로 노예 제도에서 자유에 이르는 미국 역사의 복잡한 순간들을 담아냈습니다."}, {"en": "As a result, he's now considered an important figure in American folk art.", "ko": "그 결과, 그는 오늘날 미국 민속 예술의 중요한 인물로 여겨집니다."}, {"en": "Next, we have Maud Lewis, a renowned artist known for her heart-warming paintings.", "ko": "다음은 마음이 따뜻해지는 그림으로 알려진 유명 예술가 Maud Lewis입니다."}, {"en": "Born in a small Canadian town in 1903, Lewis suffered from physical weaknesses such as distorted shoulders and fingers.", "ko": "1903년 캐나다의 작은 마을에서 태어난 Lewis는 기형적인 어깨와 손가락 같은 신체적 약점으로 고통받았습니다."}, {"en": "This limited her mobility and caused her to drop out of school.", "ko": "이것 때문에 그녀는 움직이기 어려웠고 학교도 그만두게 되었습니다."}, {"en": "To make a living, she began to paint and sell Christmas cards.", "ko": "생계를 위해 그녀는 크리스마스카드를 그려 팔기 시작했습니다."}, {"en": "When her parents passed away, Lewis went to live with her aunt in Digby, Nova Scotia, where she met her future husband, Everett Lewis.", "ko": "부모님이 돌아가신 후 Lewis는 노바스코샤주 딕비의 이모 집으로 가서 살았고, 그곳에서 미래의 남편 Everett Lewis를 만났습니다."}, {"en": "After marrying, the couple spent the rest of their lives there, and Lewis continued to paint.", "ko": "결혼 후 부부는 그곳에서 여생을 보냈고, Lewis는 계속 그림을 그렸습니다."}]}, {"label": "3과 ③ Lewis의 작품과 Anna Ancher의 삶", "sents": [{"en": "She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor.", "ko": "그녀는 〈딕비 항구의 가장자리〉 같은 그림에서 딕비의 풍경을 자주 그렸습니다."}, {"en": "Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style.", "ko": "그녀의 작품은 밝고 선명한 유화물감과 단순한 형태를 섞어 써서 독창적이고 혁신적인 스타일을 만들어 냈습니다."}, {"en": "Although her physical limitations confined her to a small cottage, her talent and imagination were both limitless.", "ko": "신체적 제약 때문에 작은 오두막에 갇혀 지냈지만, 그녀의 재능과 상상력은 끝이 없었습니다."}, {"en": "In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field.", "ko": "〈빨간 썰매〉에는 특별한 겨울 풍경에 붉은 단풍잎이 등장하고, 〈한 쌍의 소〉에는 꽃밭에 서 있는 장식된 소들이 그려져 있습니다."}, {"en": "With these features, Lewis' paintings create a magical quality, like that of a fairy tale.", "ko": "이런 특징 덕분에 Lewis의 그림은 마치 동화 같은 마법적인 느낌을 줍니다."}, {"en": "As her paintings gradually gained popularity, her story inspired many people and was later made into books and movies.", "ko": "그녀의 그림이 점점 인기를 얻으면서 그녀의 이야기는 많은 사람에게 영감을 주었고, 나중에 책과 영화로도 만들어졌습니다."}, {"en": "Maud Lewis expressed her love for the world through her paintings and became an iconic figure in Canadian folk art.", "ko": "Maud Lewis는 그림으로 세상에 대한 사랑을 표현했고 캐나다 민속 예술의 상징적인 인물이 되었습니다."}, {"en": "Now let's take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark.", "ko": "이제 이번 전시의 마지막 예술가, 덴마크 출신의 유명 화가 Anna Ancher를 살펴봅시다."}, {"en": "When observing her paintings, you may notice a common theme—they all feature female figures.", "ko": "그녀의 그림을 보면 공통된 주제를 알아챌지도 모르는데, 그림마다 모두 여성 인물이 등장한다는 점입니다."}, {"en": "Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school.", "ko": "1859년 덴마크 스카겐에서 태어난 그녀는 나중에 사립 회화 학교에 다니려고 코펜하겐으로 이주했습니다."}, {"en": "After that, she even studied abroad in Paris, which was unusual for women at the time.", "ko": "그 후 그녀는 파리 유학까지 했는데, 이는 당시 여성에게는 드문 일이었습니다."}, {"en": "Thanks to her mother's encouragement, she was able to take advantage of these opportunities.", "ko": "어머니의 격려 덕분에 그녀는 이런 기회들을 활용할 수 있었습니다."}]}, {"label": "3과 ④ Ancher의 작품과 투어 마무리", "sents": [{"en": "Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties.", "ko": "결혼 후에도 Ancher는 기혼 여성은 집안일에만 집중해야 한다는 사회적 압력에 맞서며 그림을 계속 그렸습니다."}, {"en": "Ancher differed from other artists of that era, who depicted women as still life subjects.", "ko": "Ancher는 여성을 정물화 소재처럼 그렸던 당시의 다른 예술가들과 달랐습니다."}, {"en": "In contrast, she showcased them as active participants in everyday tasks, as seen in her works The Maid in the Kitchen and Sewing Fisherman's Wife.", "ko": "이와 대조적으로, 그녀는 〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉에서 볼 수 있듯 여성을 일상의 일에 적극적으로 참여하는 사람으로 보여 주었습니다."}, {"en": "She also skillfully explored light and color, contributing to the rich Impressionist movement in Denmark.", "ko": "그녀는 또한 빛과 색을 능숙하게 탐구해 덴마크의 풍부한 인상주의 운동에 기여했습니다."}, {"en": "In her painting Sunlight in the Blue Room, the reflection of the sunlight on the blue wall is stunningly portrayed.", "ko": "그녀의 작품 〈푸른 방의 햇빛〉에는 푸른 벽에 반사되는 햇빛이 눈부시게 아름답게 그려져 있습니다."}, {"en": "Ancher challenged the conventional roles of women in the 20th century and displayed her exceptional artistic talent.", "ko": "Ancher는 20세기 여성의 전통적인 역할에 도전하며 뛰어난 예술적 재능을 보여 주었습니다."}, {"en": "Her paintings continue to amaze us to this day.", "ko": "그녀의 그림은 오늘날까지도 우리를 놀라게 합니다."}, {"en": "Thank you for joining this guided tour, and I hope my explanations have aided you in appreciating these paintings.", "ko": "이번 가이드 투어에 함께해 주셔서 감사드리며, 제 설명이 그림 감상에 도움이 되었기를 바랍니다."}, {"en": "Please take some time to further explore the exhibition.", "ko": "시간을 내어 전시를 더 둘러보시기 바랍니다."}]}], "items": [{"id": "in-g1_geumcheon_L3-01", "p": 0, "s": 7, "pos": [4, 6, 7, 9, 10], "cue": ["he(그) = 앞 문장의 Traylor, born into slavery(노예로 태어난) 사람", "became a free man(자유인이 되었다) → 앞의 slavery(노예 신분) 다음 단계", "on the farm(그 농장에서) = 앞 문장의 a cotton farm(목화 농장), 뒤 문장 Later(이후)에서 도시로 이동"], "trap": [[9, "도시 공장에 취직한 뒤에 넣으면 다시 on the farm(농장에서) 일하는 얘기가 되어 시간 순서가 거꾸로"], [6, "Bill Traylor 소개 바로 뒤라 he가 받을 사람은 있지만 ‘노예로 태어났다’보다 ‘자유인이 되었다’가 먼저 나오게 됨"]], "var": {"en": "Even though he became a free man after the American Civil War, he still had to face racial discrimination, working for very low wages on the farm.", "ko": "그는 미국 남북전쟁 이후 비록 자유의 몸이 되었지만, 농장에서 아주 낮은 임금을 받고 일하며 여전히 인종차별을 겪어야 했습니다.", "chg": "Although(~이지만) → Even though(비록 ~이지만)", "note": "접속사가 바뀌어도 he(그)·the farm(그 농장)이 앞 문장을 가리키는 점은 그대로"}, "fam": "양보 접속사 가족: Although(~이지만) / Though(~이지만) / Even though(비록 ~이지만) / While(~이긴 하지만)", "post": "노예로 태어남 → 전쟁 후 자유인이 되었지만 차별 → 이후 도시로 이주"}, {"id": "in-g1_geumcheon_L3-02", "p": 0, "s": 8, "pos": [2, 5, 6, 8, 10], "cue": ["Later(이후) → 앞의 농장 시절 다음 시기", "around 70 years old(70세 무렵) → 뒤 문장의 85 years old(85세)보다 앞선 나이", "moved to the city(도시로 이주했다) → 앞 문장 on the farm(농장에서)과 이어지는 장소 변화"], "trap": [[10, "맨 끝에 넣으면 85세 얘기 뒤에 70세가 나와 나이 순서가 거꾸로"], [6, "Bill Traylor 이름이 나온 직후라 넣고 싶지만 born in 1853(1853년에 태어난)보다 70세가 먼저 나오게 됨"]], "var": {"en": "Afterward, when he was around 70 years old, Traylor moved to the city of Montgomery, Alabama, where he found a job in a factory.", "ko": "그 뒤 70세 무렵 Traylor는 앨라배마주 몽고메리시로 이주해 그곳 공장에서 일자리를 얻었습니다.", "chg": "Later(이후) → Afterward(그 뒤에)", "note": "앞머리가 바뀌어도 70 → 85로 이어지는 나이 순서가 단서"}, "fam": "시간 순서 가족: Then(그런 다음) / Next(다음으로) / Later(이후) / After that(그 후에) / Afterward(그 뒤에)", "post": "농장에서 일하던 시절 → 70세 무렵 도시 공장 → 85세에 그림 시작"}, {"id": "in-g1_geumcheon_L3-03", "p": 1, "s": 3, "pos": [1, 3, 5, 7, 9], "cue": ["In contrast(이와 대조적으로) → 앞의 fear of dogs(개에 대한 두려움)와 반대되는 free lives(자유로운 삶)", "앞 문장 these pieces(이 작품들) = Mean Dog와 Man and Large Dog, 그 뒤에 다른 작품 소개", "뒤 문장 from slavery to freedom(노예 신분에서 자유까지) = 두려움 그림 + 자유 그림을 묶는 정리"], "trap": [[1, "작품 이름이 나온 바로 뒤라 작품 나열처럼 보이지만 대조할 ‘두려움’ 설명이 아직 없고, 뒤의 these pieces(이 작품들)가 어느 작품인지 흐려짐"], [5, "from slavery to freedom(노예 신분에서 자유까지)으로 이미 정리한 뒤라 In contrast(대조적으로)로 새 작품을 꺼낼 자리가 아님"]], "var": {"en": "On the other hand, Woman with Purse and Man with Umbrella portrays the free lives of African Americans that he observed on the streets of Montgomery.", "ko": "반면에 〈핸드백을 든 여인과 우산을 든 남자〉는 그가 몽고메리 거리에서 본 아프리카계 미국인들의 자유로운 삶을 그립니다.", "chg": "In contrast(이와 대조적으로) → On the other hand(반면에)", "note": "앞머리가 바뀌어도 fear(두려움) ↔ free(자유로운)의 대조가 단서"}, "fam": "대조 가족: In contrast(대조적으로) / On the other hand(반면에) / By contrast(그에 반해) / However(그러나) / Whereas(~인 반면)", "post": "개 그림에 담긴 두려움 → 대조적으로 자유로운 삶을 그린 작품 → 노예에서 자유까지 담아냄"}, {"id": "in-g1_geumcheon_L3-04", "p": 1, "s": 8, "pos": [7, 8, 10, 11, 12], "cue": ["This(이것) = 앞 문장의 physical weaknesses(신체적 약점), 뒤틀린 어깨와 손가락", "limited her mobility(그녀의 움직임을 제한했다)·drop out of school(학교를 그만두다) → 몸이 약하다는 말 다음에 오는 결과", "뒤 문장 To make a living(생계를 위해) → 학교를 그만둔 뒤의 선택"], "trap": [[7, "Maud Lewis 소개 직후라 her가 받을 사람은 있지만 This가 heart-warming paintings(마음이 따뜻해지는 그림)를 가리키게 되어 뜻이 안 통함"], [10, "카드를 그려 팔기 시작했다는 문장 뒤에 넣으면 This가 ‘그림을 그려 판 일’이 되어 움직임을 제한했다는 말과 안 맞음"]], "var": {"en": "This condition limited her mobility and caused her to drop out of school.", "ko": "이런 몸 상태 때문에 그녀는 움직이기 어려웠고 학교도 그만두게 되었습니다.", "chg": "This(이것) → This condition(이런 몸 상태)", "note": "condition(상태)이 붙어 앞 문장의 physical weaknesses(신체적 약점)를 받는다는 점이 더 분명"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "신체적 약점 → 움직임 제한과 학교 중퇴 → 생계를 위해 카드 그림 시작"}, {"id": "in-g1_geumcheon_L3-05", "p": 2, "s": 10, "pos": [3, 5, 7, 8, 10], "cue": ["After that(그 후에) → 앞 문장의 moved to Copenhagen to attend a private painting school(사립 미술 학교에 다니려고 코펜하겐으로 이주했다) 다음 단계", "even(심지어) → 코펜하겐 공부에 더해 Paris(파리) 유학까지 갔다는 강조", "뒤 문장 these opportunities(이 기회들) = 코펜하겐 학교 + 파리 유학, 복수라 두 가지가 다 앞에 있어야 함"], "trap": [[8, "Anna Ancher 소개 직후라 she가 받을 사람은 있지만 After that(그 후에)이 가리킬 앞 사건도, even(심지어)이 더할 앞 공부도 없음"], [7, "Maud Lewis 정리 문장 뒤라 she가 Lewis가 되어 버리고, Ancher는 아직 소개되지 않은 상태"]], "var": {"en": "Afterward, she even studied abroad in Paris, which was unusual for women at the time.", "ko": "그 뒤 그녀는 파리 유학까지 했는데, 이는 당시 여성에게는 드문 일이었습니다.", "chg": "After that(그 후에) → Afterward(그 뒤에)", "note": "앞머리가 바뀌어도 even(심지어)이 앞의 코펜하겐 공부를 요구"}, "fam": "시간 순서 가족: Then(그런 다음) / Next(다음으로) / Later(이후) / After that(그 후에) / Afterward(그 뒤에)", "post": "코펜하겐 미술 학교 → 그 후 파리 유학까지 → 어머니의 격려 덕분에 누린 기회들"}, {"id": "in-g1_geumcheon_L3-06", "p": 3, "s": 2, "pos": [1, 2, 4, 6, 8], "cue": ["In contrast(이와 대조적으로) → 앞 문장 other artists(다른 화가들)의 방식과 반대", "them(그들) = 앞 문장의 women(여성들)", "still life subjects(정물화의 대상) ↔ active participants(적극적인 참여자), 뜻이 반대인 짝"], "trap": [[1, "married women(결혼한 여성들)이 있어 them이 받을 말은 있지만 대조할 ‘다른 화가들의 방식’이 아직 없고, 앞 문장 주어도 Ancher라 자기 자신과 대조하는 꼴"], [4, "light and color(빛과 색) 얘기로 넘어간 뒤라 them(그들)이 가리킬 여성이 없음"]], "var": {"en": "On the other hand, she showcased them as active participants in everyday tasks, as seen in her works The Maid in the Kitchen and Sewing Fisherman's Wife.", "ko": "반면에 그녀는 〈부엌의 하녀〉와 〈바느질하는 어부의 아내〉에서 볼 수 있듯 여성을 일상의 일에 적극적으로 참여하는 사람으로 보여 주었습니다.", "chg": "In contrast(이와 대조적으로) → On the other hand(반면에)", "note": "앞머리가 바뀌어도 them(그들)이 앞 문장의 women(여성들)을 받는 점은 그대로"}, "fam": "대조 가족: In contrast(대조적으로) / On the other hand(반면에) / By contrast(그에 반해) / However(그러나) / Whereas(~인 반면)", "post": "다른 화가들은 여성을 정물처럼 그림 → Ancher는 일하는 주체로 그림 → 빛과 색 탐구"}]}</script><script>
var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='in:'+D.key;
var C='①②③④⑤';
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var cur=0,lv=1,pick=-1,done=false;
function home(){var h='<h1>'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 IT.forEach(function(it,i){var s=st[it.id]||{};h+='<button class="row" onclick="op('+i+',1)"><b>'+esc(D.pass[it.p].label)+(IT.filter(function(x){return x.p==it.p}).length>1?' · '+(IT.slice(0,i+1).filter(function(x){return x.p==it.p}).length):'')+'</b><span class="st'+(s[1]?' on':'')+'">1단계</span><span class="st'+(s[2]?' on':'')+'">2단계</span></button>'});
 $('app').innerHTML=h;window.scrollTo(0,0)}
function op(i,l){cur=i;lv=l;pick=-1;done=false;draw();window.scrollTo(0,0)}
function draw(){var it=IT[cur],P=D.pass[it.p].sents,N=P.length,g=lv==1?{en:P[it.s].en,ko:P[it.s].ko}:{en:it['var'].en,ko:it['var'].ko};
 var h='<div class="top"><b>'+esc(D.pass[it.p].label)+'</b><button class="hb" onclick="home()">목록</button></div>';
 h+='<div class="seg"><button class="'+(lv==1?'on':'')+'" onclick="op('+cur+',1)">1단계 원문</button><button class="'+(lv==2?'on':'')+'" onclick="op('+cur+',2)">2단계 변형</button></div>';
 h+='<div class="giv"><small>주어진 문장</small><span lang="en" translate="no">'+esc(g.en)+'</span>'+(done?'<div class="ko">'+esc(g.ko)+'</div>':'')+'</div>';
 h+='<div class="ps" lang="en" translate="no">';
 for(var i=0;i<=N;i++){var k=it.pos.indexOf(i);
  if(k>=0){var cls='mk';if(done){if(i==it.s)cls+=' ok';else if(k==pick)cls+=' ng'}else if(k==pick)cls+=' sel';
   h+='<button class="'+cls+'" '+(done?'':'onclick="pk('+k+')"')+'>'+C[k]+'</button> ';
   if(done&&i==it.s)h+='<span class="ins">'+esc(g.en)+'</span> '}
  if(i<N&&i!=it.s)h+=esc(P[i].en)+' '}
 h+='</div>';
 if(!done)h+='<button class="go" '+(pick<0?'disabled':'')+' onclick="sub()">제출</button>';
 else{var ok=it.pos[pick]==it.s;h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답 '+C[pick]:'오답 · 정답 '+C[it.pos.indexOf(it.s)])+'</div>';
  h+='<div class="exh">이 자리인 이유</div>';it.cue.forEach(function(c){h+='<div class="why">'+esc(c)+'</div>'});
  (it.trap||[]).forEach(function(t){var k=it.pos.indexOf(t[0]);if(k<0)return;h+='<div class="trap"><b>'+C[k]+'</b> '+esc(t[1])+'</div>'});
  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
  if(it.fam)h+='<div class="post"><small>연결어 가족</small>'+esc(it.fam)+'</div>';
  if(it.post)h+='<div class="post"><small>흐름 기억</small>'+esc(it.post)+'</div>';
  h+='<button class="go" onclick="op('+cur+','+lv+')">다시 풀기</button>';
  if(lv==1)h+='<button class="go sec" onclick="op('+cur+',2)">2단계 변형 문장으로</button>';
  else if(cur+1<IT.length)h+='<button class="go sec" onclick="op('+(cur+1)+',1)">다음 문제</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h}
function pk(k){pick=k;draw()}
function sub(){done=true;var it=IT[cur];if(it.pos[pick]==it.s){st[it.id]=st[it.id]||{};st[it.id][lv]=1;save()}draw()}
home();
</script></body></html>
