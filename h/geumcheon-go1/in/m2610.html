</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "26년 10월 모의고사 삽입 다지기", "sub": "지문 15개 · 14문제", "key": "geumcheon-go1:in:2610_g1", "pass": [{"label": "26년 10월 21번 같은 방식 반복하는 이직", "sents": [{"en": "Among unsatisfied professionals, there’s a repeating theme — the belief that someday (a mysterious day in the future) things will miraculously change and they’ll stumble into the perfect job or career.", "ko": "만족하지 못하는 직업인들 사이에는 되풀이되는 주제가 있는데, 언젠가(미래의 알 수 없는 날) 상황이 기적처럼 바뀌어 우연히 완벽한 일자리나 경력을 만나게 될 것이라는 믿음이다."}, {"en": "At the same time, they (typically) do little to meaningfully alter their current situation.", "ko": "그러면서도 그들은 (대체로) 자신의 현재 상황을 의미 있게 바꾸기 위해 하는 일이 거의 없다."}, {"en": "They don’t like their job, so what do they do?", "ko": "그들은 자신의 일자리를 좋아하지 않는데, 그래서 무엇을 하는가?"}, {"en": "They head to job boards and search for roles with a similar job title, hoping that the universe will sprinkle a bit of magic on their career if they just hit the refresh button in a different department or company.", "ko": "그들은 구인란으로 가서 비슷한 직책의 일자리를 검색하며, 다른 부서나 회사에서 새로 고침 버튼만 누르면 우주가 자신의 경력에 마법 가루를 조금 뿌려 주기를 바란다."}, {"en": "Efforts like this make professionals feel like they are doing something, when really they’re just setting themselves up to take a new role and quickly become just as disenchanted as they were before.", "ko": "이런 노력은 직업인들에게 뭔가를 하고 있다는 느낌을 주지만, 실제로는 새 일자리를 얻은 뒤 예전처럼 금세 다시 환상이 깨질 상황을 스스로 만드는 것일 뿐이다."}, {"en": "It’s like rearranging deck chairs on the Titanic.", "ko": "그것은 타이타닉호의 갑판 의자를 재배치하는 것과 같다."}, {"en": "You’ve got to completely switch up your approach.", "ko": "여러분은 접근 방식을 완전히 바꿔야 한다."}, {"en": "If you keep playing the same game, you’ll win the same prizes.", "ko": "계속 같은 게임을 하면 똑같은 상품을 받게 될 것이다."}]}, {"label": "26년 10월 22번 시간 인식은 사회의 산물", "sents": [{"en": "Sociologists argue that our perception and usage of time are not just basic properties of nature, like a clock ticking away in the background, nor are they simply psychological phenomena of individual experience.", "ko": "사회학자들은 시간에 대한 우리의 인식과 시간 사용이 배경에서 째깍거리는 시계처럼 단순히 자연의 기본 속성도 아니고, 단순히 개인 경험의 심리 현상도 아니라고 주장한다."}, {"en": "Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.", "ko": "오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다."}, {"en": "Eviatar Zerubavel’s work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.", "ko": "Eviatar Zerubavel의 저서 The Seven Day Circle: The History and Meaning of the Week는 시간의 기본 단위인 일주일이 문화마다 다른 사회적 발명품이며, 사람들이 활동과 삶의 리듬을 짜는 방식에 영향을 준다는 것을 보여 준다."}, {"en": "Why do we consider a nine-to-five job routine?", "ko": "왜 우리는 9시부터 5시까지 일하는 것을 일상으로 여기는가?"}, {"en": "Why don’t many of us work on the weekends?", "ko": "왜 우리 중 많은 사람은 주말에 일하지 않는가?"}, {"en": "Why do we usually pay our bills at the end of the month?", "ko": "왜 우리는 대개 월말에 고지서 금액을 내는가?"}, {"en": "Why is the retirement age sixty-five?", "ko": "왜 은퇴 연령은 65세인가?"}, {"en": "These numbers and patterns aren’t really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and come to accept as “normal.”", "ko": "이러한 숫자와 양식은 실제로 자연이나 인간의 어떤 본질적 특성이 정한 것이 아니라, 우리가 내면화해 결국 '정상'으로 받아들이게 된 사회적 창조물이다."}]}, {"label": "26년 10월 23번 내부 고발자 보호", "sents": [{"en": "In recent years, the number of illegal actions in particular at the corporate level has grown, or at least the number of cases that came to light increased.", "ko": "최근 몇 년 동안 특히 기업 차원의 위법 행위가 늘었거나, 적어도 세상에 드러난 사건의 수가 늘었다."}, {"en": "Such misconduct has often only been exposed because brave informants have risked a great deal in order to put an end to it.", "ko": "그러한 위법 행위는 용기 있는 제보자들이 그것을 끝내려고 큰 위험을 무릅썼기 때문에 비로소 드러난 경우가 많았다."}, {"en": "Hence, it is no surprise that whistleblower protection has come into focus.", "ko": "따라서 내부 고발자 보호가 주목받게 된 것은 놀라운 일이 아니다."}, {"en": "If violations of law and order go undetected and unpunished for years because employees of a company fear to report illegal activities for fear of reprisals or consequences, it can have several negative effects.", "ko": "기업 직원들이 보복이나 불이익이 두려워 위법 행위 신고를 꺼려서 법과 질서의 위반이 여러 해 동안 적발되지도 처벌받지도 않는다면, 여러 가지 부정적인 영향이 생길 수 있다."}, {"en": "It can harm the company itself, but also third-parties, the economy in general, the general public, and even the rule of law could be affected.", "ko": "그것은 기업 자체에 해를 끼칠 수 있을 뿐 아니라, 제삼자, 경제 전반, 일반 대중, 심지어 법치주의까지 영향을 받을 수 있다."}, {"en": "Protecting those who would assist in reducing unlawful or even criminal behaviour has two main functions: Protecting the individual’s actions as well as protecting the public good.", "ko": "위법하거나 심지어 범죄인 행위를 줄이는 데 도움을 주려는 사람들을 보호하는 것에는 두 가지 주요 기능이 있다. 바로 그 개인의 행위를 보호하는 것과 공익을 보호하는 것이다."}, {"en": "A well-balanced whistleblower protection may have positive effects on both of these.", "ko": "균형이 잘 잡힌 내부 고발자 보호는 이 두 가지 모두에 긍정적인 영향을 줄 수 있다."}]}, {"label": "26년 10월 24번 목표에 대한 환상", "sents": [{"en": "Unfortunately, sometimes the idea of a goal is disconnected from the daily reality of what it will take to achieve it.", "ko": "안타깝게도 목표에 대한 생각은 때때로 그것을 이루는 데 필요한 일상의 현실과 동떨어져 있다."}, {"en": "We fall in love with the idea of a goal, pushing out of mind how different our day-to-day will need to be for us to make it happen.", "ko": "우리는 목표라는 생각과 사랑에 빠져, 그것을 실현하려면 하루하루가 얼마나 달라져야 하는지를 생각에서 밀어낸다."}, {"en": "In fact, research even suggests that positive fantasies about our future can lead us to put less effort into our goals because our fantasies provide us with a false and premature sense of accomplishment.", "ko": "실제로 연구는 심지어 미래에 대한 긍정적인 환상이 거짓되고 때 이른 성취감을 주기 때문에 우리가 목표에 노력을 덜 기울이게 만들 수 있다고 시사한다."}, {"en": "We romanticize a goal — falling in love with the idea of a change.", "ko": "우리는 목표를 낭만화한다. 즉, 변화라는 생각과 사랑에 빠진다."}, {"en": "In the process, we gloss over the intricacies and challenges of integrating a complex new behavior into our life.", "ko": "그 과정에서 우리는 복잡한 새 행동을 삶에 녹여 넣는 일의 복잡함과 어려움을 얼버무리고 넘어간다."}, {"en": "As one study nicely summed it up, fantasizing about a positive future “seduces a person to mentally enjoy the desired future in the here and now” — and because we don’t reflect on why our fantasy is not yet our future, “a necessity to act is not induced.”", "ko": "한 연구가 잘 요약했듯이, 긍정적인 미래를 상상하는 것은 \"사람을 현혹해 원하는 미래를 지금 여기서 머릿속으로 즐기게 하고\", 우리는 환상이 왜 아직 미래가 되지 않았는지 돌아보지 않기 때문에 \"행동해야 할 필요가 생기지 않는다.\""}]}, {"label": "26년 10월 29번 불멸 해파리와 인간 노화", "sents": [{"en": "Since hydra and the immortal jellyfish don’t exhibit obvious signs of aging, they are often called biologically immortal.", "ko": "히드라와 불멸의 해파리는 뚜렷한 노화 징후를 보이지 않기 때문에 흔히 생물학적으로 불멸이라고 불린다."}, {"en": "This doesn’t mean they don’t die.", "ko": "이것이 그것들이 죽지 않는다는 뜻은 아니다."}, {"en": "Nor does it even mean that they cannot die of biological causes.", "ko": "심지어 생물학적 원인으로 죽을 수 없다는 뜻도 아니다."}, {"en": "But, unlike most every animal, their likelihood of dying does not increase with age.", "ko": "하지만 거의 모든 동물과 달리, 그것들이 죽을 가능성은 나이가 들어도 커지지 않는다."}, {"en": "Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.", "ko": "히드라와 불멸의 해파리 같은 종은 노화 과정을 이기는 방법에 대한 단서를 줄지도 모르기 때문에 노화학자들을 흥분시킨다."}, {"en": "But their property of being able to regenerate entire body parts, or even a whole organism, makes them more similar to trees than to us.", "ko": "하지만 신체 부위 전체나 심지어 생물체 하나를 통째로 재생할 수 있는 그것들의 특성은 그것들을 우리보다 나무에 더 가깝게 만든다."}, {"en": "Although we may learn some fascinating things about their lack of apparent aging, it is not at all clear how relevant those findings will be to human aging.", "ko": "비록 그것들에게 뚜렷한 노화가 없다는 점에 대해 흥미로운 사실을 알게 될 수도 있지만, 그 발견들이 인간의 노화와 얼마나 관련이 있을지는 전혀 분명하지 않다."}, {"en": "Sometimes biology is universal, especially if it relates to fundamental mechanisms.", "ko": "때때로 생명 현상은 보편적인데, 특히 근본적인 메커니즘과 관련될 때 그렇다."}, {"en": "But in other cases, even discoveries in rats or mice, which are mammals and biologically much closer to us, are difficult to translate into humans.", "ko": "하지만 다른 경우에는, 포유류이고 생물학적으로 우리와 훨씬 가까운 쥐나 생쥐에서의 발견조차도 인간에게 적용하기 어렵다."}, {"en": "It may be a very long time before any findings gained from hydra or jellyfish are useful to us.", "ko": "히드라나 해파리에게서 얻은 발견이 우리에게 쓸모 있어지기까지는 아주 오랜 시간이 걸릴지도 모른다."}]}, {"label": "26년 10월 30번 발전소 보조금의 문제", "sents": [{"en": "Subsidies, taxes, and regulations can all lead to power plants that pollute less by switching away from coal.", "ko": "보조금, 세금, 규제는 모두 석탄에서 벗어나 오염을 덜 일으키는 발전소로 이어질 수 있다."}, {"en": "In all cases, profits can be higher from making the transition, even taking the related costs into account.", "ko": "모든 경우에, 관련 비용까지 고려해도 그 전환으로 얻는 이익이 더 클 수 있다."}, {"en": "The power plants prefer subsidies over regulations or taxes.", "ko": "발전소들은 규제나 세금보다 보조금을 선호한다."}, {"en": "The reason is obvious.", "ko": "이유는 뻔하다."}, {"en": "They prefer to receive money from the government rather than pay the costs themselves.", "ko": "그들은 비용을 직접 내기보다 정부로부터 돈을 받는 쪽을 선호한다."}, {"en": "But the “expansion” of their opportunity set through subsidies has to be matched by the contraction of the opportunity set of others.", "ko": "그러나 보조금을 통한 그들의 기회 집합의 '확대'는 다른 사람들의 기회 집합의 축소로 맞춰져야 한다."}, {"en": "The electricity companies’ “freedom” is increased at the expense of the ordinary individual, who must suffer from increased taxation to pay for the subsidy.", "ko": "전력 회사들의 '자유'는 일반 개인을 희생시켜 늘어나는데, 이들은 보조금을 대기 위해 늘어난 세금으로 고통받아야 한다."}, {"en": "Moreover, from the perspective of pure efficiency, the subsidy distorts the economy because the electricity company is not facing the full costs of what it does, even if it is successful in limiting emissions.", "ko": "게다가 순수한 효율성의 관점에서 보면, 보조금은 전력 회사가 배출량을 줄이는 데 성공하더라도 자기가 하는 일의 전체 비용을 마주하지 않기 때문에 경제를 왜곡한다."}, {"en": "Indeed, electricity prices may end up lower than they should be and electricity consumption higher, which will worsen global warming, even though the emissions per unit of electricity have been reduced.", "ko": "실제로 전기 가격은 마땅한 수준보다 낮아지고 전기 소비는 많아질 수 있으며, 그러면 전기 단위당 배출량이 줄었더라도 지구 온난화는 더 악화될 것이다."}]}, {"label": "26년 10월 31번 스타트렉과 풍요", "sents": [{"en": "Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "ko": "Star Trek의 세계를 경제학의 눈으로 보는 사람은 거의 없겠지만, 그렇게 하면 곧 우리에게 닥칠지도 모르는 세계를 들여다보는 창이 생긴다."}, {"en": "All of classical economics is based on the notion that there isn’t usually enough of anything to give everyone everything they want or need.", "ko": "고전 경제학 전체는 모든 사람에게 원하거나 필요한 모든 것을 줄 만큼 대개 어떤 것도 충분하지 않다는 생각에 기초한다."}, {"en": "Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.", "ko": "그 때문에 우리는 재화와 서비스, 자원을 가장 큰 이익을 낼 수 있는 곳에 배분하려고 시장과 가격 책정을 이용한다."}, {"en": "In Star Trek, however, there isn’t much scarcity.", "ko": "그러나 Star Trek에서는 희소성이 별로 없다."}, {"en": "Technology has allowed that society to reproduce any food they want, transport themselves thousands of miles in the blink of an eye, communicate over light-years, and travel among the stars.", "ko": "기술 덕분에 그 사회는 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 수천 마일을 이동하고, 수 광년 너머와 소통하고, 별들 사이를 여행할 수 있게 되었다."}, {"en": "All of humanity in that world has been fully educated so that they can participate in this prosperity.", "ko": "그 세계의 모든 인류는 이 풍요에 참여할 수 있도록 충분히 교육받았다."}, {"en": "Everyone is an explorer, researcher, engineer, artist, doctor, or counselor.", "ko": "모든 사람이 탐험가, 연구원, 기술자, 예술가, 의사, 또는 상담사이다."}, {"en": "Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant.", "ko": "생성형 AI는 우리 사회의 많은 측면도 마찬가지로 매우 풍요로워지게 할 잠재력을 지니고 있다."}]}, {"label": "26년 10월 32번 들었음을 보여 줘야 경청", "sents": [{"en": "People, whether customers or otherwise, want to feel heard.", "ko": "사람들은 고객이든 아니든 경청받고 있다고 느끼고 싶어 한다."}, {"en": "When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "ko": "누군가 고객 센터에 전화하거나, 관리자와 이야기하게 해 달라고 하거나, 마음에 걸리는 일을 품고 여러분의 사무실에 올 때, 그들은 누군가가 자신의 걱정을 듣고 해결해 줄 것처럼 느끼고 싶어 한다."}, {"en": "But for someone to feel heard, three things have to happen.", "ko": "그러나 누군가가 경청받는다고 느끼려면 세 가지가 이루어져야 한다."}, {"en": "First, they have to feel like the other person paid attention to what they said.", "ko": "첫째, 그들은 상대방이 자신의 말에 주의를 기울였다고 느껴야 한다."}, {"en": "Second, they have to feel like the other person understood what they said.", "ko": "둘째, 그들은 상대방이 자신의 말을 이해했다고 느껴야 한다."}, {"en": "And third, the other person has to demonstrate that they listened.", "ko": "그리고 셋째, 상대방은 자신이 들었다는 것을 보여 줘야 한다."}, {"en": "This last part is key.", "ko": "이 마지막 부분이 핵심이다."}, {"en": "Imagine talking to someone who provided no response.", "ko": "아무 반응도 보이지 않는 사람과 이야기한다고 상상해 보라."}, {"en": "They might have attended to everything we said.", "ko": "그들은 우리가 한 말 모두에 주의를 기울였을지도 모른다."}, {"en": "They might even have understood it completely.", "ko": "그들은 심지어 그것을 완전히 이해했을지도 모른다."}, {"en": "But without some sort of outward signal that indicates they listened, it’s impossible to know whether or not they actually did.", "ko": "그러나 들었다는 것을 보여 주는 어떤 외적인 신호가 없다면, 그들이 실제로 들었는지 아닌지 알 수가 없다."}]}, {"label": "26년 10월 33번 장소는 경험의 매개체", "sents": [{"en": "The very fact that all of our experiences “take place” in a physical space makes the space inseparable from what defines it, from the event that took place in it.", "ko": "우리의 모든 경험이 물리적 공간에서 ‘일어난다’는 바로 그 사실은, 그 공간을 그것을 규정하는 것, 즉 그 안에서 일어난 사건과 분리될 수 없게 만든다."}, {"en": "The tree and the ground beneath are inseparable from what took place there.", "ko": "그 나무와 그 아래의 땅은 그곳에서 일어난 일과 분리될 수 없다."}, {"en": "This intertwining of space, place, and experience challenges the idea of place as passive backdrop.", "ko": "공간, 장소, 경험의 이러한 뒤얽힘은 장소를 수동적 배경으로 보는 생각에 이의를 제기한다."}, {"en": "If place and space are central to the very heart of experience, we must accept the possibility that the spatial framework is the medium of all experiences—actions, thoughts, memories, and feelings of every place—not merely a background or context exterior to experience (as commonly supposed).", "ko": "장소와 공간이 경험의 핵심 중의 핵심이라면, 우리는 공간적 틀이 (흔히 생각하듯) 경험 바깥의 배경이나 상황에 그치는 것이 아니라, 모든 장소에서의 행동·생각·기억·감정, 즉 모든 경험의 매개체일 가능성을 받아들여야 한다."}, {"en": "Belgian literary critic Georges Poulet made the point elegantly, writing of the space created in Marcel Proust’s great novel In Search of Lost Time:", "ko": "벨기에의 문학 평론가 Georges Poulet는 Marcel Proust의 위대한 소설 In Search of Lost Time에서 창조된 공간에 대해 이렇게 쓰며 그 점을 멋지게 표현했다."}, {"en": "“Beings surround themselves with the places where they find themselves, the way one wraps oneself up in a garment that is at one and the same time a disguise and a characterization.", "ko": "“존재들은 자신이 놓인 장소들로 스스로를 둘러싸는데, 이는 마치 변장이자 동시에 자신을 드러내는 특징이기도 한 옷으로 몸을 감싸는 것과 같다."}, {"en": "Without places, beings would be only abstractions.”", "ko": "장소가 없다면, 존재들은 단지 추상적인 것에 불과할 것이다.”"}]}, {"label": "26년 10월 34번 단순화 가정과 유용한 모델", "sents": [{"en": "No matter how you choose to delineate your evolutionary system of interest—let’s say it’s cell phones—there will be some things that your model just needs to take as a given, such as the fact that new ideas emerge at particular times.", "ko": "여러분이 관심을 두는 진화 시스템(예를 들어 휴대 전화)의 경계를 어떻게 정하든, 새로운 아이디어가 특정 시기에 출현한다는 사실처럼 여러분의 모델이 그냥 주어진 것으로 받아들여야 하는 것들이 있을 것이다."}, {"en": "Indeed, all models must make simplifying assumptions of this nature.", "ko": "실제로 모든 모델은 이런 성격의 단순화 가정을 세워야 한다."}, {"en": "When Wallace and Darwin presented their verbal model of biological evolution, there was little knowledge of how variation generation and inheritance worked.", "ko": "Wallace와 Darwin이 생물학적 진화에 대한 언어적 모델을 제시했을 때, 변이 생성과 유전이 어떻게 작동하는지는 거의 알려져 있지 않았다."}, {"en": "They just took as a given that these things happened somehow.", "ko": "그들은 이런 일들이 어떻게든 일어난다는 것을 그냥 주어진 것으로 받아들였다."}, {"en": "Even at the finest level of detail, we need simplifying assumptions.", "ko": "가장 미세한 세부 수준에서조차 우리는 단순화 가정이 필요하다."}, {"en": "Physicists, for example, must take as a given the mass and charge of fundamental particles.", "ko": "예를 들어, 물리학자들은 기본 입자의 질량과 전하를 주어진 것으로 받아들여야 한다."}, {"en": "In a model of atomic bonds, physicists don’t attempt to explain why electrons have their particular mass and charge, they just accept the measured values and move on.", "ko": "원자 결합 모델에서 물리학자들은 전자가 왜 그런 질량과 전하를 갖는지 설명하려 하지 않고, 그냥 측정된 값을 받아들이고 넘어간다."}, {"en": "The key point is that we can build useful models at one level of analysis without a complete accounting of what’s happening at all other levels.", "ko": "핵심은 다른 모든 수준에서 일어나는 일을 완전히 설명하지 않고도 한 분석 수준에서 유용한 모델을 만들 수 있다는 것이다."}]}, {"label": "26년 10월 36번 소리는 뇌가 만드는 개념", "sents": [{"en": "All sound begins with some kind of motion, something that disturbs molecules in air, water, steel, wood, or other medium.", "ko": "모든 소리는 어떤 종류의 운동, 즉 공기, 물, 강철, 나무 또는 다른 매질 속의 분자들을 교란하는 무언가에서 시작된다."}, {"en": "Isaac Newton noted that light waves are colorless; the perception of color only occurs in the brain of a living organism.", "ko": "Isaac Newton은 빛의 파동에는 색이 없으며, 색에 대한 인식은 오직 살아 있는 생명체의 뇌에서만 일어난다고 지적했다."}, {"en": "The same is true of sound.", "ko": "소리도 마찬가지이다."}, {"en": "Thus perception of sound begins at our eardrums — before it hits our eardrums, it is nothing more than the disturbance of molecules.", "ko": "따라서 소리에 대한 인식은 우리의 고막에서 시작되는데, 고막에 닿기 전에 그것은 분자들의 교란에 불과하다."}, {"en": "We can measure that disturbance with gauges and instruments, but until it hits a brain, it is not sound.", "ko": "우리는 측정기와 도구로 그 교란을 측정할 수 있지만, 그것이 뇌에 닿기 전까지는 소리가 아니다."}, {"en": "You may have heard the old philosophical riddle, “If a tree falls in the forest and no one is there to hear it, does it make a sound?”", "ko": "여러분은 “숲에서 나무가 쓰러지는데 그것을 들을 사람이 아무도 없다면, 그것은 소리를 내는가?”라는 오래된 철학적 수수께끼를 들어 봤을지도 모른다."}, {"en": "No, because sound is a psychological concept, a product of brains.", "ko": "아니다. 소리는 심리적 개념, 즉 뇌가 만든 산물이기 때문이다."}, {"en": "That tree will disturb molecules and make a mess, but if no creature hears it, no bird, fox, or human, it has not made sound.", "ko": "그 나무는 분자들을 교란하고 난장판을 만들겠지만, 어떤 생명체도, 즉 새도 여우도 인간도 그것을 듣지 않는다면, 그것은 소리를 낸 것이 아니다."}]}, {"label": "26년 10월 37번 대면 협업과 원격 협업의 틈", "sents": [{"en": "When people are collaborating face to face, they can easily see each other and the range of different communication cues being used, so the task space is a subset of the communication space.", "ko": "사람들이 대면하여 협업할 때는 서로의 모습과 사용되는 다양한 의사소통 단서들을 쉽게 볼 수 있어서, 작업 공간이 의사소통 공간의 부분 집합이 된다."}, {"en": "Ishii, a professor at the MIT Media Lab, describes this as seamless communication because there is no functional separation between the task and communication space.", "ko": "MIT Media Lab의 교수인 Ishii는 작업 공간과 의사소통 공간 사이에 기능적 분리가 없기 때문에 이를 이음새 없는 의사소통이라고 묘사한다."}, {"en": "However, when people are working remotely, the task space is often separated from the communication space.", "ko": "그러나 사람들이 원격으로 작업할 때는 작업 공간이 흔히 의사소통 공간과 분리된다."}, {"en": "For example, when video conferencing, people may have the face of their collaborator on one screen, while looking at a shared document on another.", "ko": "예를 들어, 화상 회의를 할 때 사람들은 한 화면에는 협업자의 얼굴을 띄우고, 다른 화면에서는 공유 문서를 보고 있을 수 있다."}, {"en": "In this case, it is impossible to see many of the remote collaborator’s communication cues at the same time as looking at the task space.", "ko": "이 경우, 작업 공간을 보면서 동시에 원격 협업자의 많은 의사소통 단서들을 보는 것은 불가능하다."}, {"en": "So, there is an artificial seam between the communication space and task space.", "ko": "그래서 의사소통 공간과 작업 공간 사이에 인위적인 틈이 생긴다."}, {"en": "This is the type of impact of remote communication technology that needs to be predicted through communication models.", "ko": "이것은 의사소통 모델을 통해 예측될 필요가 있는 원격 의사소통 기술의 영향의 한 유형이다."}]}, {"label": "26년 10월 38번 반복이 만드는 착각적 진실", "sents": [{"en": "In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false.", "ko": "1977년, 심리학자 Lynn Hasher와 David Goldstein은 한 그룹의 대학생들에게 60개의 잡학 상식 진술문이 참인지 거짓인지 얼마나 확신하는지 물었다."}, {"en": "The students were asked to evaluate the sixty statements three times, at two-week intervals.", "ko": "학생들은 그 60개의 진술문을 2주 간격으로 세 번 평가하도록 요청받았다."}, {"en": "Crucially, only twenty of the statements were repeated each time; the other forty were new.", "ko": "결정적으로, 그중 20개만 매번 반복되었고 나머지 40개는 새로운 것이었다."}, {"en": "The researchers then compared the ‘truth-ratings’ of the repeated versus non-repeated statements.", "ko": "그런 다음 연구자들은 반복된 진술문과 반복되지 않은 진술문의 ‘진실성 평가’를 비교했다."}, {"en": "What they found was astonishing.", "ko": "그들이 알아낸 것은 놀라웠다."}, {"en": "Regardless of whether the statement was true or false, belief in the truth of the claim went up as a function of repetition.", "ko": "진술문이 참이든 거짓이든 상관없이, 그 주장이 참이라는 믿음은 반복에 따라 높아졌다."}, {"en": "In other words, the more often you hear a statement, the more ‘true’ it sounds.", "ko": "다시 말해, 어떤 진술문을 더 자주 들을수록 그것은 더 ‘참’처럼 들린다."}, {"en": "This became known as the illusory truth effect.", "ko": "이것은 착각적 진실 효과로 알려지게 되었다."}]}, {"label": "26년 10월 39번 잠수와 몸 안팎의 압력 균형", "sents": [{"en": "The human body on the Earth’s surface experiences constant air pressure equal to 16–18 tons per square meter of its body surface.", "ko": "지구 표면 위의 인체는 신체 표면 1제곱미터당 16~18톤에 달하는 일정한 기압을 받는다."}, {"en": "However, this pressure is not felt because external pressure is balanced by internal pressure in the lungs and air cavities of the body.", "ko": "하지만 외부 압력이 폐와 몸속 공기 공간의 내부 압력과 균형을 이루기 때문에 이 압력은 느껴지지 않는다."}, {"en": "During dives, in addition to atmospheric pressure, the pressure of the water also acts on the human body.", "ko": "잠수하는 동안에는 대기압에 더해 물의 압력도 인체에 작용한다."}, {"en": "When submerged underwater, to avoid feeling the pressure of the surrounding environment, it is necessary to maintain the condition of equal external and internal pressure.", "ko": "물속에 잠겼을 때 주변 환경의 압력을 느끼지 않으려면 외부와 내부의 압력이 같은 상태를 유지해야 한다."}, {"en": "To achieve this, air or a breathing mixture is supplied to the diver under pressure equal to the pressure applied by the surrounding water.", "ko": "이를 위해 공기나 호흡용 혼합 기체가 주변 물이 가하는 압력과 같은 압력으로 잠수부에게 공급된다."}, {"en": "Water pressure increases proportionally with depth.", "ko": "수압은 깊이에 비례하여 증가한다."}, {"en": "It increases by 1 bar for every 10 meters.", "ko": "수압은 10미터마다 1바씩 증가한다."}, {"en": "It follows that a diver at a depth of 10 meters experiences a pressure of 2 bar, and to stabilize pressure, the supply of a breathing mixture under a pressure of 2 atmospheres is required.", "ko": "따라서 10미터 깊이의 잠수부는 2바의 압력을 받고, 압력을 맞추려면 2기압의 압력으로 호흡용 혼합 기체를 공급해야 한다."}]}, {"label": "26년 10월 40번 미역취의 화학 경보", "sents": [{"en": "Researchers recently found that goldenrods that live in peaceful areas without much threat from predators will issue chemical alarm calls that are incredibly specific — comprehensible only to their close kin — on the rare occasion they are attacked.", "ko": "연구자들은 포식자의 위협이 별로 없는 평화로운 지역에 사는 미역취들이 드물게 공격을 받으면 가까운 친족만 이해할 수 있는 매우 독특한 화학적 경보 신호를 내보낸다는 것을 최근에 발견했다."}, {"en": "But goldenrods in more hostile territory signal to their neighbors using chemical phrases easily understood by all the goldenrod in the area, not just their biological kin.", "ko": "하지만 더 적대적인 지역에 사는 미역취들은 생물학적 친족뿐 아니라 그 지역의 모든 미역취가 쉽게 이해하는 화학적 표현으로 이웃에게 신호를 보낸다."}, {"en": "Instead of using coded whisper networks, these goldenrod broadcast the threat over loudspeaker, so to speak.", "ko": "암호화된 속삭임 네트워크를 쓰는 대신, 이 미역취들은 말하자면 확성기로 위협을 널리 알리는 셈이다."}, {"en": "It is the first time research has confirmed that these chemical communications are beneficial not only to the plant receiving them but also to the sender.", "ko": "이러한 화학적 교신이 그것을 받는 식물뿐 아니라 보내는 식물에게도 이롭다는 것을 연구가 확인한 것은 이번이 처음이다."}, {"en": "When times are truly tough, you do not want to be left standing in a field alone.", "ko": "정말로 힘든 시기에는 들판에 혼자 서 있는 채로 남겨지고 싶지 않다."}, {"en": "There will be no one to mate with, no one to help bring in pollinators.", "ko": "짝짓기할 상대도, 꽃가루 매개자를 불러들이는 것을 도와줄 상대도 없을 것이기 때문이다."}]}], "items": [{"id": "mock_2610_g1_a:in-mock_2610_g1_a-02", "p": 0, "s": 4, "pos": [1, 2, 3, 4, 7], "cue": ["Efforts like this(이런 노력) = 바로 앞 문장의 job boards(구인 게시판)에서 비슷한 직함 검색하기", "take a new role(새 역할을 맡다)·just as disenchanted as they were before(전과 똑같이 환멸을 느끼는) = 직장만 바꾸고 같은 일 반복", "바로 뒤 문장의 rearranging deck chairs on the Titanic(타이타닉호 갑판 의자 재배치) 비유가 이 '헛수고'를 받음"], "trap": [[2, "do little(거의 하지 않음) 뒤라 '노력' 얘기가 어울려 보이지만 질문과 답(구인 게시판 검색)이 먼저 나와야 Efforts like this(이런 노력)가 가리킬 대상이 생김"]], "var": {"en": "Such efforts make professionals feel like they are doing something, when really they’re just setting themselves up to take a new role and quickly become just as disenchanted as they were before.", "ko": "그런 노력은 직장인들이 뭔가를 하고 있다고 느끼게 하지만, 실제로는 새 역할을 맡았다가 금세 전과 똑같이 환멸을 느끼도록 스스로를 몰아가는 것일 뿐이다.", "chg": "Efforts like this(이런 노력) → Such efforts(그런 노력)", "note": "지시 표현만 바뀌고 가리키는 대상은 여전히 바로 앞 문장의 구인 게시판 검색"}, "fam": "앞 내용 받기: Efforts like this(이런 노력) / Such efforts(그런 노력) / These attempts(이런 시도)", "post": "직장 불만 → 비슷한 직함만 검색 → 같은 환멸 반복 → 타이타닉 비유 → 접근 방식 전환 필요의 흐름"}, {"id": "mock_2610_g1_a:in-mock_2610_g1_a-03", "p": 1, "s": 7, "pos": [1, 3, 5, 6, 7], "cue": ["These numbers and patterns(이런 숫자와 패턴) = 앞 문장들의 질문 속 nine-to-five(9시~5시), weekends(주말), end of the month(월말), sixty-five(65세)", "social creations(사회적 창조물)가 앞의 shaped by tradition and cultural norms(전통과 문화 규범이 만듦)의 결론", "질문 네 개가 모두 끝난 뒤에야 '이 모든 숫자'로 묶어 받기 가능"], "trap": [[6, "sixty-five(65세) 질문 앞에 넣으면 뒤에 질문이 하나 더 남아 These numbers(이런 숫자)가 모든 예시를 다 받지 못함"], [3, "week(주)도 숫자라 끌리지만 바로 뒤 질문들이 '이런 숫자'의 예시라 질문보다 먼저 나올 수 없음"]], "var": {"en": "Such numbers and patterns aren’t really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and co var C='①②③④⑤';
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var cur=0,lv=1,pick=-1,done=false;
function home(){var h='<h1>'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 IT.forEach(function(it,i){var s=st[it.id]||{};h+='<button class="row" onclick="op('+i+',1)"><b>'+esc(D.pass[it.p].label)+(IT.filter(function(x){return x.p==it.p}).length>1?' · '+(IT.slice(0,i+1).filter(function(x){return x.p==it.p}).length):'')+'</b><span class="st'+(s[1]?' on':'')+'">1단계</span><span class="st'+(s[2]?' on':'')+'">2단계</span></button>'});
 $('app').innerHTML=h;window.scrollTo(0,0)}
function op(i,l){cur=i;lv=l;pick=-1;done=false;draw();window.scrollTo(0,0)}
function draw(){var it=IT[cur],P=D.pass[it.p].sents,N=P.length,g=lv==1?{en:P[it.s].en,ko:P[it.s].ko}:{en:it['var'].en,ko:it['var'].ko};
 var h='<div class="top"><b>'+esc(D.pass[it.p].label)+'</b><button class="hb" onclick="home()">목록</button></div>';
 h+='<div class="seg"><button class="'+(lv==1?'on':'')+'" onclick="op('+cur+',1)">1단계 원문</button><button class="'+(lv==2?'on':'')+'" onclick="op('+cur+',2)">2단계 변형</button></div>';
 h+='<div class="giv"><small>주어진 문장</small><span lang="en" translate="no">'+esc(g.en)+'</span>'+(done?'<div class="ko">'+esc(g.ko)+'</div>':'')+'</div>';
 h+='<div class="ps" lang="en" translate="no">';
 for(var i=0;i<=N;i++){var k=it.pos.indexOf(i);
  if(k>=0){var cls='mk';if(done){if(i==it.s)cls+=' ok';else if(k==pick)cls+=' ng'}else if(k==pick)cls+=' sel';
   h+='<button class="'+cls+'" '+(done?'':'onclick="pk('+k+')"')+'>'+C[k]+'</button> ';
   if(done&&i==it.s)h+='<span class="ins">'+esc(g.en)+'</span> '}
  if(i<N&&i!=it.s)h+=esc(P[i].en)+' '}
 h+='</div>';
 if(!done)h+='<button class="go" '+(pick<0?'disabled':'')+' onclick="sub()">제출</button>';
 else{var ok=it.pos[pick]==it.s;h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답 '+C[pick]:'오답 · 정답 '+C[it.pos.indexOf(it.s)])+'</div>';
  h+='<div class="exh">이 자리인 이유</div>';it.cue.forEach(function(c){h+='<div class="why">'+esc(c)+'</div>'});
  (it.trap||[]).forEach(function(t){var k=it.pos.indexOf(t[0]);if(k<0)return;h+='<div class="trap"><b>'+C[k]+'</b> '+esc(t[1])+'</div>'});
  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
  if(it.fam)h+='<div class="post"><small>연결어 가족</small>'+esc(it.fam)+'</div>';
  if(it.post)h+='<div class="post"><small>흐름 기억</small>'+esc(it.post)+'</div>';
  h+='<button class="go" onclick="op('+cur+','+lv+')">다시 풀기</button>';
  if(lv==1)h+='<button class="go sec" onclick="op('+cur+',2)">2단계 변형 문장으로</button>';
  else if(cur+1<IT.length)h+='<button class="go sec" onclick="op('+(cur+1)+',1)">다음 문제</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h}
function pk(k){pick=k;draw()}
function sub(){done=true;var it=IT[cur];if(it.pos[pick]==it.s){st[it.id]=st[it.id]||{};st[it.id][lv]=1;save()}draw()}
home();
</script></body></html>
