</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "교과서 4과 삽입 다지기", "sub": "공통영어2 4과 · 5문제", "key": "geumcheon-go1:in:L4", "pass": [{"label": "4과 ① 신경 임플란트와 의료 활용", "sents": [{"en": "Neuroscience has a long history of exploring treatments for disorders of the nervous system, including the brain and spinal cord.", "ko": "신경과학은 뇌와 척수를 포함한 신경계 질환의 치료법을 탐구해 온 오랜 역사를 가지고 있다."}, {"en": "Traditionally, researchers have studied various functions of neural implants, which are medical devices like computer chips that can be implanted in the nervous system.", "ko": "전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔는데, 이것은 신경계에 이식할 수 있는 컴퓨터 칩 같은 의료 기기이다."}, {"en": "But here's the exciting part: with the rapid advancement of artificial intelligence (AI), researchers have begun to integrate AI into neural implants.", "ko": "그런데 흥미로운 점이 있다. 인공지능(AI)이 빠르게 발전하면서 연구자들이 신경 임플란트에 AI를 결합하기 시작했다는 것이다."}, {"en": "In this post, we'll examine the incredible benefits of AI-powered neural implants, their amazing potential for the future, and the ethical concerns surrounding them.", "ko": "이 글에서는 AI 기반 신경 임플란트의 놀라운 장점과 미래의 엄청난 잠재력, 그리고 이를 둘러싼 윤리적 우려를 살펴볼 것이다."}, {"en": "First, let's explore how this fascinating technology has been applied.", "ko": "먼저 이 매력적인 기술이 어떻게 활용되어 왔는지 살펴보자."}, {"en": "The AI-powered neural implant has shown great promise in medical applications, offering solutions to a range of problems.", "ko": "AI 기반 신경 임플란트는 다양한 문제의 해결책을 내놓으며 의료 분야에서 큰 가능성을 보여 주었다."}, {"en": "For instance, neural implants are used to treat brain disorders like Parkinson's disease.", "ko": "예를 들어, 신경 임플란트는 파킨슨병 같은 뇌 질환을 치료하는 데 쓰인다."}, {"en": "These implants electrically stimulate targeted regions of the brain at the right time with the help of AI to restore normal brain activity.", "ko": "이 임플란트는 정상적인 뇌 활동을 되살리기 위해 AI의 도움을 받아 알맞은 때에 뇌의 목표 부위를 전기로 자극한다."}, {"en": "In addition, paralyzed people can have the ability to walk again with the help of a “digital bridge” between two implants inserted into their brain and spine.", "ko": "또한 마비 환자들은 뇌와 척추에 넣은 두 임플란트 사이의 '디지털 다리' 덕분에 다시 걸을 수 있다."}, {"en": "When they think about moving their legs, the AI analyzes the brain signals and sends them to their legs through the implants.", "ko": "환자가 다리를 움직이려고 생각하면 AI가 뇌 신호를 분석해 임플란트를 통해 다리로 보낸다."}, {"en": "Similarly, those who have lost their arms can use artificial arms operated by the same mechanism.", "ko": "마찬가지로 팔을 잃은 사람들도 같은 원리로 움직이는 인공 팔을 사용할 수 있다."}]}, {"label": "4과 ② 미래 전망: 생각 조작과 기억", "sents": [{"en": "The success of AI-powered neural implants in health care is also expected to spread to other industries.", "ko": "의료 분야에서 거둔 AI 기반 신경 임플란트의 성공은 다른 산업으로도 퍼질 것으로 예상된다."}, {"en": "Some futurists predict that these implants will become commercially available in the next 20 to 30 years and significantly change our daily lives.", "ko": "일부 미래학자들은 이 임플란트가 앞으로 20~30년 안에 상용화되어 우리의 일상을 크게 바꿀 것이라고 예측한다."}, {"en": "For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds.", "ko": "예를 들어, 신경 임플란트 기술이 발전하면 우리의 생각을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것이 가능해질 것이다."}, {"en": "This could enable us to play games, type social media messages, and stream music simply by thinking.", "ko": "이것 덕분에 우리는 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍할 수 있을지도 모른다."}, {"en": "There is also great potential for memory-enhancing brain implants, similar to computer memory chips.", "ko": "컴퓨터 메모리 칩과 비슷한, 기억력을 높여 주는 뇌 임플란트도 큰 잠재력이 있다."}, {"en": "Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.", "ko": "이런 장치가 있으면 기억을 저장하고 강화할 수 있으며, 디지털 클라우드를 이용해 기억을 올리고 내려받을 수도 있을 것이다."}, {"en": "We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories.", "ko": "우리는 소셜 미디어 피드처럼 기억을 훑어보고, 인생에서 가장 좋았던 순간을 생생하게 떠올리고, 다른 사람과 기억을 나누고, 가장 소중한 기억을 백업할 수 있을 것이다."}, {"en": "Finally, AI-powered neural implants would revolutionize the way our brains work.", "ko": "마지막으로, AI 기반 신경 임플란트는 우리 뇌가 작동하는 방식을 혁명적으로 바꿀 것이다."}, {"en": "The role of the brain would shift from learning and storing information to processing the vast amounts of data provided by the implants.", "ko": "뇌의 역할은 정보를 배우고 저장하는 것에서 임플란트가 주는 방대한 데이터를 처리하는 것으로 바뀔 것이다."}, {"en": "Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas.", "ko": "우리는 정보를 단순히 외우는 대신 지식을 내려받고, 창의력을 발휘해 그것을 해석하고, 새로운 아이디어를 만들어 낼 수 있을 것이다."}]}, {"label": "4과 ③ 윤리적 문제", "sents": [{"en": "Before we can fully embrace the era of AI-powered neural implants, many tricky ethical issues should be addressed.", "ko": "AI 기반 신경 임플란트의 시대를 완전히 받아들이기 전에 많은 까다로운 윤리적 문제들이 해결되어야 한다."}, {"en": "The integration of AI technology with the human brain raises concerns about what it means to be human.", "ko": "AI 기술과 인간의 뇌를 결합하는 것은 인간이란 무엇인가에 대한 우려를 낳는다."}, {"en": "Our brains are believed to be central to our identity, existence, and value as human beings.", "ko": "우리의 뇌는 인간으로서의 정체성, 존재, 가치의 중심이라고 여겨진다."}, {"en": "However, an over-reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between.", "ko": "그러나 기술에 지나치게 의존하면 자연스러운 발달이 늦어지고, 우리가 인간인지 AI인지 아니면 그 중간인지 혼란이 생길 수 있다."}, {"en": "Another critical issue is privacy.", "ko": "또 다른 중요한 문제는 사생활(프라이버시)이다."}, {"en": "There's a risk that organizations or hackers could access personal data without permission through AI-connected implants.", "ko": "기관이나 해커가 AI와 연결된 임플란트를 통해 허락 없이 개인 정보에 접근할 위험이 있다."}, {"en": "This means that our thoughts, emotions, and behaviors could be controlled by hackers.", "ko": "이는 우리의 생각, 감정, 행동이 해커에게 조종당할 수 있다는 뜻이다."}, {"en": "There's an additional risk that this technology could lead to even greater social inequality, given that it may not be available to all due to its high cost.", "ko": "또한 이 기술은 비용이 비싸 모두가 이용하지 못할 수 있다는 점에서 사회적 불평등을 더 키울 수 있다는 추가 위험도 있다."}, {"en": "Such unequal access to the technology could intensify the division between those who can afford the implants and those who cannot.", "ko": "이런 불평등한 기술 접근은 임플란트를 살 수 있는 사람과 그렇지 못한 사람 사이의 분열을 더 심하게 만들 수 있다."}]}], "items": [{"id": "in-g1_geumcheon_L4-01", "p": 0, "s": 2, "pos": [1, 2, 4, 6, 8], "cue": ["But(그러나) → 앞 문장 Traditionally(전통적으로)와 대비되는 새 흐름", "neural implants(신경 임플란트) → 앞 문장에서 which are medical devices ~(~인 의료 기기)로 뜻을 설명한 뒤에야 쓸 수 있는 말", "뒤 문장 AI-powered neural implants(AI 기반 신경 임플란트) = integrate AI into neural implants(AI를 신경 임플란트에 결합하다)의 결과물"], "trap": [[1, "글의 첫 문장 뒤에 넣으면 neural implants(신경 임플란트)가 설명도 없이 먼저 나오고, 그 뒤에야 뜻풀이가 따라오는 꼴"], [4, "AI-powered neural implants(AI 기반 신경 임플란트)를 살펴보겠다고 이미 말한 뒤라 ‘AI를 결합하기 시작했다’는 소개가 뒤늦음"]], "var": {"en": "However, here's the exciting part: with the rapid advancement of artificial intelligence (AI), researchers have begun to integrate AI into neural implants.", "ko": "하지만 흥미로운 점이 있다. 인공지능(AI)이 빠르게 발전하면서 연구자들이 신경 임플란트에 AI를 결합하기 시작했다는 것이다.", "chg": "But(그러나) → However(하지만)", "note": "앞머리가 바뀌어도 Traditionally(전통적으로) ↔ AI라는 ‘옛것과 새것’의 대비가 단서"}, "fam": "역접 가족: However(그러나) / Yet(그렇지만) / Nevertheless(그럼에도 불구하고) / Still(그런데도) / On the other hand(반면에)", "post": "전통적인 신경 임플란트 연구 → AI 결합 시작 → AI 기반 임플란트의 장점·가능성·우려 예고"}, {"id": "in-g1_geumcheon_L4-02", "p": 0, "s": 10, "pos": [5, 6, 8, 9, 10], "cue": ["Similarly(마찬가지로) → 비슷한 사례가 먼저 있어야 함, paralyzed people(마비된 사람들)이 다시 걷는 사례", "the same mechanism(같은 원리) = 앞 문장의 AI가 brain signals(뇌 신호)를 분석해 임플란트로 보내는 방식", "legs(다리) → arms(팔)로 넓히는 흐름"], "trap": [[9, "마비 환자 문장 바로 뒤라 Similarly(마찬가지로)가 맞아 보이지만 the same mechanism(같은 원리)이 가리킬 원리 설명이 아직 없고, 뒤 문장 they(그들)가 팔을 잃은 사람이 되어 ‘다리를 움직인다’와 충돌"], [8, "Parkinson's disease(파킨슨병) 치료 설명 뒤에는 팔다리를 움직이는 원리가 안 나와 the same mechanism(같은 원리)이 붕 뜸"]], "var": {"en": "Likewise, those who have lost their arms can use artificial arms operated by the same mechanism.", "ko": "이와 같이 팔을 잃은 사람들도 같은 원리로 움직이는 인공 팔을 사용할 수 있다.", "chg": "Similarly(마찬가지로) → Likewise(이와 같이)", "note": "앞머리가 바뀌어도 the same mechanism(같은 원리)이 앞의 원리 설명을 요구"}, "fam": "비슷함 가족: Similarly(마찬가지로) / Likewise(이와 같이) / In the same way(같은 방식으로)", "post": "마비 환자가 다시 걷는 원리 → 같은 원리로 인공 팔도 가능"}, {"id": "in-g1_geumcheon_L4-03", "p": 1, "s": 3, "pos": [1, 3, 5, 7, 9], "cue": ["This(이것) = 앞 문장 내용, software that can read our minds(우리 마음을 읽을 수 있는 소프트웨어)를 뇌에 설치하는 일", "simply by thinking(생각만으로) = read our minds(마음을 읽다)와 짝", "뒤 문장 There is also(또한 ~이 있다)의 also(또한) → 이 문장까지가 첫 번째 가능성"], "trap": [[5, "memory-enhancing brain implants(기억력을 높이는 뇌 임플란트) 뒤에 넣으면 This가 기억 장치를 가리켜 게임·음악과 안 맞고, 뒤 문장 Such devices(그런 장치들)와도 끊김"], [1, "글의 첫 문장 뒤에는 ‘마음을 읽는 소프트웨어’가 아직 없어 simply by thinking(생각만으로)의 근거 없음"]], "var": {"en": "Such technology could enable us to play games, type social media messages, and stream music simply by thinking.", "ko": "그런 기술 덕분에 우리는 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍할 수 있을지도 모른다.", "chg": "This(이것) → Such technology(그런 기술)", "note": "Such technology(그런 기술)가 가리키는 것도 앞 문장의 마음을 읽는 소프트웨어"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "마음을 읽는 소프트웨어 → 생각만으로 게임·메시지·음악 → 또 다른 가능성인 기억 임플란트"}, {"id": "in-g1_geumcheon_L4-04", "p": 2, "s": 3, "pos": [1, 3, 5, 7, 9], "cue": ["However(그러나) → 앞 문장 central to our identity(우리 정체성의 중심)와 부딪히는 걱정", "whether we are human, AI, or something in between(우리가 인간인지 AI인지 그 중간인지) = identity(정체성)의 혼란", "뒤 문장 Another critical issue(또 다른 중요한 문제) → 이 문장까지가 첫 번째 문제"], "trap": [[5, "privacy(사생활) 문제로 넘어간 뒤라 ‘인간이란 무엇인가’ 얘기가 다시 끼어들 수 없음"], [1, "ethical issues(윤리적 문제) 뒤라 문제 얘기가 이어질 듯하지만 However(그러나)가 뒤집을 ‘뇌는 정체성의 중심’이라는 말이 아직 없음"]], "var": {"en": "Yet an over-reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between.", "ko": "그렇지만 기술에 지나치게 의존하면 자연스러운 발달이 늦어지고, 우리가 인간인지 AI인지 아니면 그 중간인지 혼란이 생길 수 있다.", "chg": "However(그러나) → Yet(그렇지만)", "note": "앞머리가 바뀌어도 identity(정체성) → confusion(혼란)의 연결이 단서"}, "fam": "역접 가족: However(그러나) / Yet(그렇지만) / Nevertheless(그럼에도 불구하고) / Still(그런데도) / On the other hand(반면에)", "post": "뇌는 인간 정체성의 중심 → 그러나 기술 의존은 정체성 혼란 초래 → 다음 문제인 사생활"}, {"id": "in-g1_geumcheon_L4-05", "p": 2, "s": 8, "pos": [3, 5, 6, 7, 8], "cue": ["Such unequal access(그런 불평등한 접근) → ‘모두가 쓸 수는 없다’는 말이 먼저 필요, it may not be available to all(모두가 이용할 수는 없을지도 모른다)", "division(분열) = 앞 문장의 social inequality(사회적 불평등)", "those who can afford(살 여유가 되는 사람들) ↔ high cost(높은 비용)"], "trap": [[6, "access personal data(개인 정보에 접근하다) 바로 뒤라 access(접근)가 겹쳐 보이지만 그건 without permission(허락 없는) 접근이지 unequal(불평등한) 접근이 아님"], [5, "privacy(사생활) 소개 직후라 Such(그런)가 가리킬 불평등 얘기가 전혀 없음"]], "var": {"en": "This kind of unequal access to the technology could intensify the division between those who can afford the implants and those who cannot.", "ko": "이런 종류의 불평등한 기술 접근은 임플란트를 살 수 있는 사람과 그렇지 못한 사람 사이의 분열을 더 심하게 만들 수 있다.", "chg": "Such(그런) → This kind of(이런 종류의)", "note": "지시어가 바뀌어도 unequal access(불평등한 접근)가 앞의 not available to all(모두가 이용할 수는 없는)을 받는 점은 그대로"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "비싼 가격 때문에 모두가 쓸 수는 없음 → 그런 불평등이 사람들 사이의 분열 심화"}]}</script><script>
var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='in:'+D.key;
var C='①②③④⑤';
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

var cur=0,lv=1,pick=-1,done=false;

 IT.forEach(function(it,i){var s=st[it.id]||{};h+='<button class="row" onclick="op('+i+',1)"><b>'+esc(D.pass[it.p].label)+(IT.filter(function(x){return x.p==it.p}).length>1?' · '+(IT.slice(0,i+1).filter(function(x){return x.p==it.p}).length):'')+'</b><span class="st'+(s[1]?' on':'')+'">1단계</span><span class="st'+(s[2]?' on':'')+'">2단계</span></button>'});
 $('app').innerHTML=h;window.scrollTo(0,0)}
function op(i,l){cur=i;lv=l;pick=-1;done=false;draw();window.scrollTo(0,0)}
function draw(){var it=IT[cur],P=D.pass[it.p].sents,N=P.length,g=lv==1?{en:P[it.s].en,ko:P[it.s].ko}:{en:it['var'].en,ko:it['var'].ko};
 var h='<div class="top"><b>'+esc(D.pass[it.p].label)+'</b><button class="hb" onclick="home()">목록</button></div>';
 h+='<div class="seg"><button class="'+(lv==1?'on':'')+'" onclick="op('+cur+',1)">1단계 원문</button><button class="'+(lv==2?'on':'')+'" onclick="op('+cur+',2)">2단계 변형</button></div>';
 h+='<div class="giv"><small>주어진 문장</small><span lang="en" translate="no">'+esc(g.en)+'</span>'+(done?'<div class="ko">'+esc(g.ko)+'</div>':'')+'</div>';
 h+='<div class="ps" lang="en" translate="no">';
 for(var i=0;i<=N;i++){var k=it.pos.indexOf(i);
  if(k>=0){var cls='mk';if(done){if(i==it.s)cls+=' ok';else if(k==pick)cls+=' ng'}else if(k==pick)cls+=' sel';
   h+='<button class="'+cls+'" '+(done?'':'onclick="pk('+k+')"')+'>'+C[k]+'</button> ';
   if(done&&i==it.s)h+='<span class="ins">'+esc(g.en)+'</span> '}
  if(i<N&&i!=it.s)h+=esc(P[i].en)+' '}
 h+='</div>';
 if(!done)h+='<button class="go" '+(pick<0?'disabled':'')+' onclick="sub()">제출</button>';
 else{var ok=it.pos[pick]==it.s;h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답 '+C[pick]:'오답 · 정답 '+C[it.pos.indexOf(it.s)])+'</div>';
  h+='<div class="exh">이 자리인 이유</div>';it.cue.forEach(function(c){h+='<div class="why">'+esc(c)+'</div>'});
  (it.trap||[]).forEach(function(t){var k=it.pos.indexOf(t[0]);if(k<0)return;h+='<div class="trap"><b>'+C[k]+'</b> '+esc(t[1])+'</div>'});
  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
  if(it.fam)h+='<div class="post"><small>연결어 가족</small>'+esc(it.fam)+'</div>';
  if(it.post)h+='<div class="post"><small>흐름 기억</small>'+esc(it.post)+'</div>';
  h+='<button class="go" onclick="op('+cur+','+lv+')">다시 풀기</button>';
  if(lv==1)h+='<button class="go sec" onclick="op('+cur+',2)">2단계 변형 문장으로</button>';
  else if(cur+1<IT.length)h+='<button class="go sec" onclick="op('+(cur+1)+',1)">다음 문제</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h}
function pk(k){pick=k;draw()}
function sub(){done=true;var it=IT[cur];if(it.pos[pick]==it.s){st[it.id]=st[it.id]||{};st[it.id][lv]=1;save()}draw()}

</script></body></html>
