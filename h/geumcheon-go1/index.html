        h+='<div style="font-size:13px;color:var(--sub);margin:2px 2px 6px">시험에 나올 수 있는 주요 문장 15개예요. 해석을 가리고 먼저 스스로 해석해 봐요.</div><button type="button" id="hide15" class="row on" style="border:0;width:100%;cursor:pointer;font-family:inherit">해석 '+(hide15?'보이기':'가리기')+'</button>';
        var no=0;
        KEY15.groups.forEach(function(gr){
          h+='<div style="font-size:13px;font-weight:800;color:var(--sub);margin:12px 2px 2px">'+esc(gr.title)+'</div>';
          gr.items.forEach(function(it){no++;h+='<div class="s"><div class="en"><b style="color:var(--pri)">'+no+'</b> '+esc(it.en)+'</div>'+(hide15?'':'<div class="ko">'+esc(it.ko)+'</div>')+'</div>'});
        });
      }else h+='<div class="soonbox">준비 중</div>';
    }else if(mode===1){
      if(true){h+='<div class="soonbox">문법 분석은 준비 중이에요.</div>';}
      else g[0].passages.forEach(function(p){
        var G=GRAM[p.id];
        if(!G){h+='<div class="row soon"><span>'+esc(p.label)+'<small>준비 중</small></span></div>';return}
        h+='<details class="acc" style="margin:7px 0"><summary><span>'+esc(p.label)+'</span></summary><div class="in">';
        p.en.forEach(function(e,i){
          var cs=G[i+1]||[],segs=[];
          cs.forEach(function(c,ci){var at=c.hl?e.indexOf(c.hl):-1;if(at>=0)segs.push({a:at,b:at+c.hl.length,n:ci})});
          segs.sort(function(x,y){return x.a-y.a});
          var en='',pos=0;
          segs.forEach(function(sg){if(sg.a<pos)return;en+=esc(e.slice(pos,sg.a))+'<mark class="m'+sg.n%4+'">'+esc(e.slice(sg.a,sg.b))+'<sup>'+(sg.n+1)+'</sup></mark>';pos=sg.b});
          en+=esc(e.slice(pos));
          h+='<div class="s"><div class="en"><b style="color:var(--pri)">'+(i+1)+'</b> '+en+'</div><div class="ko">'+esc((p.ko||[])[i]||'')+'</div>';
          cs.forEach(function(c,ci){
            h+='<div class="gc g'+ci%4+'"><div class="gt"><span class="gn">'+(ci+1)+'</span>'+esc(c.t)+(c.tag?'<span class="tg t">'+esc(c.tag)+'</span>':'')+'</div><div class="gd">'+esc(c.d)+'</div><div class="ge">쉬운 예: <b>'+esc(c.ex)+'</b><br>'+esc(c.exk)+'</div></div>';
          });
          h+='</div>';
        });
        h+='</div></details>';
      });
    }else if(mode!==0){
      h+='<div class="soonbox">'+MODES[mode]+'은(는) 준비 중이에요.<br>하나씩 채워서 열어 드려요.</div>';
    }else{
      g[0].passages.forEach(function(p){
        var tg=p.taught===true?'<span class="tg t">수업에서 다룸</span>':p.taught===false?'<span class="tg">안 다룸</span>':'';
        h+='<details class="acc" style="margin:7px 0"><summary><span>'+esc(p.label)+tg+'</span></summary><div class="in">';
        var J=window.SHOW_JJ?(JJ4[p.id]||JJM[p.id]):null;
        p.en.forEach(function(e,i){
          h+='<div class="s"><div class="en"><b style="color:var(--pri)">'+(i+1)+'</b></div>';
          if(J&&J[i]){h+='<div class="jjl">직독직해</div><table class="jj">'+J[i].e.map(function(c,j){return '<tr><td>'+esc(c)+'</td><td>'+esc(J[i].k[j])+'</td></tr>'}).join('')+'</table><div class="jjl">자연스러운 해석</div>'}
          else h+='<div class="en" style="margin-top:2px">'+esc(e)+'</div>';
          h+='<div class="ko">'+esc((p.ko||[])[i]||'')+'</div></div>';
        });
        var Z=window.SHOW_JJ?EZ[p.id]:null;
        if(Z){h+='<div class="ez"><div class="jjl">쉬운 정리</div><div>'+esc(Z.easy)+'</div></div>'+(Z.life?'<div class="ez life"><div class="jjl">생활 속 예시</div><div>'+esc(Z.life)+'</div></div>':'')}
        h+='</div></details>';
      });
    }
    h+='</div></details>';
  });
  document.getElementById('text').innerHTML=h;
}
document.getElementById('text').addEventListener('click',function(e){if(e.target.id==='hide15'){hide15=!hide15;text();}});
document.getElementById('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;text()});
var TABS=[['text','원문','<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/>'],['keys','답안지','<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/>'],['today','오늘의 학습','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>']];
function show(id){
  TABS.forEach(function(t){document.getElementById('p-'+t[0]).classList.toggle('on',t[0]===id)});
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.t===id)});
  if(id==='today')today();if(id==='keys')keys();if(id==='text')text();
  try{sessionStorage.setItem('vh-tab',id)}catch(e){}
  window.scrollTo(0,0);
}
document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button type="button" data-t="'+t[0]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+t[2]+'</svg>'+t[1]+'</button>'}).join('');
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.t)});
window.addEventListener('pageshow',function(e){var t='today';try{var nv=(performance.getEntriesByType('navigation')[0]||{}).type;if(e.persisted||nv==='back_forward')t=sessionStorage.getItem('vh-tab')||'today'}catch(x){}show(t)});
})();
</script></body></html>
