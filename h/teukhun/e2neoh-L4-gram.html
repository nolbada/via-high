<title>어법특훈 · 영어II 능률(오) 4과</title>

<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}

.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>

:"Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.","ko":"이 제품들에 들어 있는 납 같은 유독성 물질 때문에, 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다.","hl":["toxic materials contained in these products"],"khl":["이 제품들에 들어 있는"],"blocks":[{"t":"p","h":"버려진 노트북 속에는","x":["e-waste(전자 쓰레기)는 버려진 전자 장치와 전기 기기다.","그 속에는 lead(납) 같은 독성 물질이 들어 있다.","물질은 스스로 뭘 담는 게 아니라 제품 안에 '담겨 있는' 쪽이다.","그래서 materials(물질들) 뒤에 p.p. contained(들어 있는).","containing(담고 있는)을 쓰면 뒤에 담을 물건(목적어)이 와야 하는데 없다."]},{"t":"pair","h":"쉬운 예시","x":[["I ate the cake made by Mom.","나는 엄마가 만든 케이크를 먹었다. (케이크는 만들어진 쪽 → made(만들어진))"],["I saw a box containing old toys.","나는 낡은 장난감이 든 상자를 보았다. (상자가 담는 쪽 + 목적어 old toys(낡은 장난감) → containing(담고 있는))"]]}],"post":["명사 + p.p. + in: materials contained in these products(이 제품들에 들어 있는 물질들)"]},{"slots":[["is","","","주어 the amount(양)가 단수라 is(~이다)."],["which","that","a","콤마(,) 뒤에서 앞 내용을 덧붙여 설명하는 자리. that(~하는)은 콤마 뒤에 못 온다."],["when","","","the year(그해) + 완전한 문장이라 when(~하는)이다."],["that","","","predict(예측하다) + that(~라고) + 완전한 문장이다."],["being_made","","","노력은 기울여지는 쪽이고 진행 중이라 are being made(이루어지고 있다)."]],"opts":["what","which","where","who"],"or":["what(~하는 것): 앞 내용을 받아 콤마 뒤에서 이어 주는 역할을 못 함.","which(그리고 그것은): 콤마 뒤에서 앞 내용을 받아 덧붙이고, 뒤에 주어가 빠져 있어 맞음.","where(~하는 곳): 장소를 받고 뒤에 완전한 문장이 와야 하는데 주어가 빠져 있음.","who(그리고 그 사람은): 사람을 받는 말인데 앞 내용은 사람이 아님."],"point":"관계대명사 (계속적 용법 which)","en":"In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected.","ko":"2021년에 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기 자료가 처음 수집된 해인 2014년보다 37% 늘어난 것이었다.","hl":["worldwide, which was a 37% increase"],"khl":["이는"],"blocks":[{"t":"p","h":"콤마 뒤 덧붙이기","x":["57.4 million metric tons(5,740만 메트릭톤). 2021년 한 해 동안 나온 전자 쓰레기 양이다.","글은 콤마 뒤에서 '그런데 그건 37% 증가였다'라고 덧붙인다.","이렇게 콤마 뒤에서 앞말을 받아 이어 가는 말이 which(그리고 그것은)다.","that(~하는)은 콤마 뒤에 서지 못한다. 시험 단골 함정이다."]},{"t":"pair","h":"쉬 itle":"어법특훈 · 영어II 4과 본문 ❸+❹","sub":"수리할 권리 운동: 왜 수리가 어려운가 + 네 가지 요구","tpl":"One reason many people dispose of their damaged devices {is|is} {that|that} they are too difficult to repair. For example, a device may be difficult to disassemble, or its manufacturer may require that it {be|be} brought to an official service center to be fixed. Many companies do not allow their customers {to_take|to take} their damaged items to third-party repair shops. What is more, some products are intentionally {designed|designed} to be difficult to repair. It is common for consumers {to_be|to be} unable to acquire the instructions for how {to_fix|to fix} their items or the parts {needed|needed} to complete repairs. The right-to-repair movement is trying to solve these problems by {promoting|promoting} legislation {that2|that} {states|states} the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice. To protect the rights of consumers, the right-to-repair movement demands four things. First, companies must make information about their products {available|available} to everyone. Second, third parties, including individuals, should be able to obtain the parts and tools required to make repairs. Third, the practice of preventing consumers from {installing|installing} custom software on their own devices should {be_prohibited|be prohibited} by law. Finally, it demands that manufacturers {design|design} devices in a way {that3|that} {makes|makes} repairs as {easy|easy} as possible. Advocates of the movement say that if all these goals are {accomplished|accomplished}, far less e-waste will be generated. Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation. This movement is gaining a growing influence in Europe as well, with more and more countries {joining|joining} the cause.","fn":[],"mean":{"is":"~이다(be의 현재형, 단수 주어)","that":"~라는 것, ~라고(접속사) / ~하는(관계대명사)","what":"~하는 것(선행사를 품은 (use의 to부정사)","sleep":"자다(동사원형)","sleeping":"자는 것(sleep의 -ing형, 동명사)","wear":"입다, 매다(동사원형)","to wear":"매는 것(wear의 to부정사)","drinking":"마시는 것(drink의 -ing형)","to drink":"마시는 것(drink의 to부정사)","like":"좋아하다(동사원형·현재형)","likes":"좋아하다(like의 3인칭 단수 현재형)","send":"보내다(동사원형)","be sent":"보내지다(send의 수동형)","following":"따르는(follow의 -ing형)","followed":"따라와진(follow의 과거분사형) / 따라왔다(과거형)","jog":"조깅하다(동사원형)","jogging":"조깅하는 것(jog의 -ing형, 동명사)","leads":"이어지다(lead의 3인칭 단수 현재형)","lead":"이어지다(동사원형)"},"sets":[{"items":[{"slots":[["is","","","주인은 One reason(한 가지 이유). many people dispose of their damaged devices(많은 사람이 고장 난 장치를 버린다)는 꼬리표라 단수 is(~이다)."],["that","what","a","뒤 they are too difficult to repair(그것들은 수리하기 너무 어렵다)는 빠진 게 없는 문장이다. what(~하는 것)은 뒤에 빈자리가 있어야 한다."],["be","","","require(요구하다) + that절은 should(~해야 한다)가 숨은 자리라 동사원형 be(~되다)."],["to_take","","","allow(허용하다) + 사람 + to부정사다."],["designed","","","products(제품들)는 설계되는 쪽이라 are designed(설계된다)."]],"opts":["which","whom","that","whose"],"or":["which(~하는): 뒤에 빈자리가 있어야 하는데 문장이 완전하고 받을 명사도 없음.","whom(~하는 사람): 사람 명사를 받는 말인데 앞에 받을 사람이 없음.","that(~라는 것): is(~이다) 뒤 보어 자리에서 완전한 문장을 이끄는 접속사라 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 대명사 they(그것들)가 옴."],"point":"that vs. what","en":"One reason many people dispose of their damaged devices is that they are too difficult to repair.","ko":"많은 사람이 고장 난 장치를 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵다는 것이다.","hl":["is that they are too difficult to repair"],"khl":["수리하기 너무 어렵다는 것"],"blocks":[{"t":"p","h":"왜 버릴까?","x":["❸에서 글은 질문을 던진다. 사람들은 왜 고장 난 기기를 버릴까?","답은 '고치기 너무 어려워서'다.","is(~이다) 뒤에 답이 문장 통째로 온다: they are too difficult to repair(그것들은 수리하기 너무 어렵다).","주어 they(그것들), 동사 are(~이다). 빠진 게 없다.","빠진 게 없는 문장을 통째로 묶는 말은 that(~라는 것). what(~하는 것)은 뒤에 빈자리가 있어야 한다."]},{"t":"pair","h":"쉬운 예시","x":[["The problem is that I am hungry.","문제는 내가 배고프다는 것이다. (I am hungry(나는 배고프다) 완전 → that)"],["This is what I want.","이것이 내가 원하는 것이다. (want(원하다)의 목적어 빠짐 → what)"]]}],"post":["is + that(~라는 것) + 완전한 문장: is that they are too difficult(그것들이 너무 어렵다는 음."}]},{"id":"e2g-4e","no":"본문 ❺","title":"어법특훈 · 영어II 4과 본문 ❺","sub":"수리 가능성 지수: 한눈에 보는 정보","tpl":"In January 2021, the French government passed a bill {that|that} {requires|requires} {that2|that} every manufacturer {include|include} a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers. {using|Using} a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers {see|see} how {easily|easily} the product can be {repaired|repaired} before they purchase it. The index takes into account several elements, {including|including} the availability of repair information, the ease of disassembly, and the price of spare parts. A low number on a bright red label means {that3|that} {repairing|repairing} the product will be difficult, whereas a high number on a green label {indicates|indicates} that the product is easy {to_repair|to repair}. The index was designed to have two positive effects. Firstly, it allows consumers {to_make|to make} informed decisions when purchasing new devices and appliances. Secondly, it {encourages|encourages} manufacturers to make their products {easier|easier} to repair. As a result, with fewer electronic and electrical items ending up in its landfills, France can expect {to_make2|to make} a transition to a more sustainable society in the near future. The impact of the index, however, is likely to spread far beyond France. We live in a global economy, and any company that {wants|wants} to sell its appliances on the French market will need to label its products according to the repairability index. If the index is successful, we can anticipate {seeing|seeing} more countries around the world {following|following} France’s innovative lead.","fn":[],"mean":{"requires":"요구하다(require의 3인칭 단수 현재형)","require":"요구하다(동사원형)","that":"~라는 것, ~라고(접속사) / ~하는(관계대명사)","include":"포함하다(동사원형)","Using":"사용하여(use의 -ing형, 분사구문)","see":"보다(동사원형)","requiring":"요구하는(require의 -ing형)","to require":"요구하는 것(require의 to부정사)","requirement":"요구 사항(명사)","seeing":"보는 것(see의 -ing형)","easily":"쉽게(부사)","repaired":"수리된(repair의 과거분사형)","to see":"보는 것(see의 to부정사)","seen":"보인(see의 과거분사형)","sees":"보다(see의 3인칭 단수 현재형)","including":"~을 포함하여(include의 -ing형)","included":"포함된(include의 과거분사형)","repairing":"수리하는 것, 수리하는(repair의 -ing형)","indicates":"나타내다(indicate의 3인칭 단수 현재형)","includes":"포함하다(include의 3인칭 단수 현재형)","being included":"포함되는(include의 수동 -ing형)","to repair":"수리하기에(repair의 to부정사)","to make":"만드는 것, 만들도록(make의 to부정사)","make":"만들다(동사원형)","encourages":"장려하다(encourage의 3인칭 단수 현재형)","making":"만드는 것(make의 -ing형, 동명사)","made":"만들었다(make의 과거형) / 만들어진(과거분사형)","makes":"만들다(make의 3인칭 단수 현재형)","easier":"더 쉬운(easy의 비교급)","wants":"원하다(want의 3인칭 단수 현재형)","Used":"사용된(use의 과거분사형)","Use":"사용하다(동사원형)","Uses":"사용하다(use의 3인칭 단수 현재형)","Being used":"사용되면서(use의 수동 -ing형)","easy":"쉬운(형용사)","ease":"쉬움(명사) / 덜어 주다(동사)","easiness":"쉬움(명사)","eased":"덜어진(ease의 과거분사형)","which":"(관계대명사) ~하는, 그리고 그것은","what":"~하는 것(선행사를 품은 관계대명사)","whom":"~하는 (사람)(관계대명사 목적격)","whose":"~의(소유격 관계대명사)","encouraging":"장려하는(encourage의 -ing형)","encourage":"장려하다(동사원형)","to encourage":"장려하는 것(encourage의 to부정사)","encouragement":"격려(명사)","following":"따르는(follow의 -ing형)","to follow":"따르는 것(follow의 to부정사)","followed":"따라와진(follow의 과거분사형) / 따라왔다(과거형)","follows":"따르다(follow의 3인칭 단수 현재형)","being followed":"따름을 당하는(follow의 수동 -ing형)","indicate":"나타내다(동사원형)","indicating":"나타내는(indicate의 -ing형)","to indicate":"나타내는 것(indicate의 to부정사)","indication":"표시(명사)","sell":"팔다(동사원형)","sells":"팔다(sell의 3인칭 단수 현재형)","visit":"방문하다(동사원형)","to visit":"방문하는 것(visit의 to부정사)","leave":"떠나다(동사원형)","to leave":"떠나는 것(leave의 to부정사)","Climbing":"오르면서(climb의 -ing형)","Climbed":"올라진(climb의 과거분사형)","washes":"씻다(wash의 3인칭 단수 현재형)","washing":"씻는(wash의 -ing형)","playing":"하는(play의 -ing형)","to play":"하는 것(play의 to부정사)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","winning":"이기는 것(win의 -ing형)","to win":"이기는 것(win의 to부정사)","more easily":"더 쉽게(easily의 비교급, 부사)","easing":"덜어 주는(ease의 -ing형)","happy":"행복한(형용사)","happily":"행복하게(부사)"},"sets":[{"items":[{"slots":[["requires","require","a","관계대명사 that(~하는)의 주인은 a bill(법안), 하나다. 원형 require(요구하다)는 복수 주어에 쓰는 모양이다."],["that2","","","requires(요구하다)의 목적어 문장을 이끄는 that(~라고)이다."],["include","","","require(요구하다) + that절은 should(~해야 한다)가 숨은 자리라 동사원형 include(포함하다)."],["using","","","지수가 점수를 '사용하는' 쪽이라 능동 Using(사용하여)."],["see","","","let(~하게 하다) + 사람 + 동사원형이다."]],"opts":["requires","requiring","to require","requirement"],"or":["requires(요구하다): 관계대명사 that(~하는)이 받는 a bill(법안)이 단수라 맞음.","requiring(요구하는): that(~하는) 뒤 동사 자리에 -ing가 혼자 못 옴.","to require(요구하는 것): to부정사는 that절의 동사 자리에 못 옴.","requirement(요구 사항): 명사라 동사 자리에 못 옴."],"point":"관계대명사절 동사의 수일치","en":"In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.","ko":"2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 잔디 깎는 기계라는 다섯 종류의 전자 장치와 전기 기기에 ‘수리 가능성 지수’를 표시하도록 요구하는 법안을 통과시켰다.","hl":["a bill that requires"],"khl":["요구하는 법안"],"blocks":[{"t":"p","h":"프랑스의 새 법","x":["4과의 두 번째 해법은 프랑스에서 나왔다.","2021년, 제조사에게 '수리 가능성 지수' 표시를 요구하는 법이 통과됐다.","that requires(요구하는)의 주인은 바로 앞 a bill(법안)이다.","법안 하나 → 동사에 s를 붙인 requires(요구하다)."]},{"t":"pair","h":"쉬운 예시","x":[["I read a book that is funny.","나는 재미있는 책을 읽었다. (a book(책) 단수 → is(~이다))"],["I like songs that are slow.","나는 느린 노래들을 좋아한다. (songs(노래들) 복수 → are(~이다))"]]}],"post":["a bill(법안) + that + 단수 동사: a bill that requires(요구하는 법안)"]},{"slots":[["include","","","require(요구하다) + that절이라 동사원형 include(포함하다)다."],["using","","","능동 분사구문 Using(사용하여)이다."],["see","seeing","a","let(~하게 하다)은 사람 뒤에 동사원형을 데려온다. seeing(보는)은 못 온다."],["easily","","","동사 can be repaired(수리될 수 있다)를 꾸미니 부사 easily(쉽게)."],["repaired","","","제품은 수리되는 쪽이라 can be repaired(수리될 수 있다)."]],"opts":["to see","see","seen","sees"],"or":["to see(보는 것): let(~하게 하다)은 to를 붙이지 않고 원형만 받음.","see(보다): let(~하게 하다) + 사람 + 동사원형이라 맞음.","seen(보인): 소비자가 직접 보는 쪽이라 p.p.는 뜻이 안 맞음.","sees(보다, 3인칭 단수형): 목적격보어 자리에 s 붙은 동사는 못 옴."],"point":"목적격보어 (사역동사 let + 동사원형)","en":"Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.","ko":"색상으로 구분된 체계뿐만 아니라 0에서 10까지의 점수를 사용하여, 그 지수는 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다.","hl":["lets consumers see"],"khl":["알 수 있게 해 준다"],"blocks":[{"t":"p","h":"살 때 미리 본다","x":["지수는 0~10 점수와 색깔로 표시된다.","그래서 소비자는 사기 전에 '이거 고치기 쉬운가?'를 볼 수 있다.","let(~하게 하다) + 사람 + 동사원형 = 사람이 ~하게 해 주다.","let(~하게 하다)은 make(~하게 만들다), have(~하게 하다)와 같은 사역동사라 원형만 받는다."]},{"t":"pair","h":"쉬운 예시","x":[["Mom lets me watch TV.","엄마는 내가 텔레비전을 보게 해 준다. (let(~하게 하다) → watch(보다))"],["The teacher made us clean the room.","선생님은 우리에게 교실을 청소하게 했다. (make(~하게 하다) → clean(청소하다))"]]}],"post":["let(~하게 하다) + 사람 + 동사원형: lets consumers see(소비자가 보게 해 주다)"]},{"slots":[["repaired","","","제품은 수리되는 쪽이라 p.p.다."],["including","included","a","뒤에 the availability(이용 가능성) 같은 목적어가 줄줄이 온다. p.p. included(포함된)는 목적어를 데려오지 못한다."],["that3","","","means(의미하다)의 목적어 문장을 이끄는 that(~라는 것)이다."],["repairing","","","will be difficult(어려울 것이다)의 주어 자리라 동명사 repairing(수리하는 것)."],["indicates","","","주인 a high number(높은 숫자)가 단수라 indicates(나타내다)."]],"opts":["including","include","includes","being included"],"or":["including(~을 포함하여): 뒤 목적어 the availability(이용 가능성) 등을 데려오는 능동 -ing라 맞음.","include(포함하다): 이미 동사 takes(고려하다)가 있어 접속사 없이 동사가 또 올 수 없음.","includes(포함하다, 3인칭 단수형): 접속사 없이 두 번째 동사가 될 수 없음.","being included(포함되는): 수동이라 뒤에 목적어를 가질 수 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"The index takes into account several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.","ko":"그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 여분 부품의 가격을 포함한 몇 가지 요소를 고려한다.","hl":["several elements, including the availability"],"khl":["포함한 몇 가지 요소"],"blocks":[{"t":"p","h":"점수는 어떻게 매기나","x":["지수는 세 가지를 본다. 수리 정보가 있는지, 분해가 쉬운지, 부품값이 얼마인지.","콤마 뒤 including(~을 포함하여)이 이 목록을 끌고 온다.","including(~을 포함하여) 뒤에는 포함할 대상(목적어)이 바로 온다.","included(포함된)는 당하는 모양이라 뒤에 목적어를 못 둔다."]},{"t":"pair","h":"쉬운 예시","x":[["I like fruits, including apples and grapes.","나는 사과와 포도를 포함해 과일을 좋아한다. (including(~을 포함하여) + 목적어)"],["Lunch is $10, tax included.","점심은 세금 포함 10달러다. (tax(세금)가 포함된 쪽 → included(포함된))"]]}],"post":["콤마 + including(~을 포함하여) + 목적어 목록"]},{"slots":[["repairing","","","주어 자리의 동명사다."],["indicates","","","주인 a high number(높은 숫자)가 단수라 indicates(나타내다)."],["to_repair","","","easy(쉬운) + to부정사 = ~하기 쉬운."],["to_make","make","a","allow(허용하다)는 사람 뒤에 to부정사를 데려온다. let(~하게 하다)과 달리 원형 make(내리다)만 쓰면 안 된다."],["encourages","","","주어 it(그것)의 동사, 3인칭 단수 encourages(장려한다)."]],"opts":["making","made","makes","to make"],"or":["making(내리는): allow(허용하다)의 목적격보어 자리에 -ing는 못 옴.","made(만들어진): 소비자가 결정을 내리는 쪽이라 p.p.는 뜻이 안 맞음.","makes(만들다, 3인칭 단수형): 목적격보어 자리에 s 붙은 동사는 못 옴.","to make(내리는 것): allow(허용하다) + 사람 + to부정사라 맞음."],"point":"목적격보어 (allow + to부정사)","en":"Firstly, it allows consumers to make informed decisions when purchasing new devices and appliances.","ko":"첫째로, 그것은 소비자들이 새 장치와 기기를 구입할 때 정보에 근거한 결정을 내릴 수 있게 해 준다.","hl":["allows consumers to make informed decisions"],"khl":["결정을 내릴 수 있게 해 준다"],"blocks":[{"t":"p","h":"첫 번째 효과","x":["지수의 첫 번째 효과는 소비자 쪽에 있다.","알고 사니까 현명한 결정을 내릴 수 있다.","앞 문장의 let(~하게 하다)은 원형 see(보다)를 받았다.","이번 allow(허용하다)는 to를 챙겨 to make(내리는 것)를 받는다.","같은 '하게 해 주다'라도 동사마다 짝이 다르다."]},{"t":"pair","h":"쉬운 예시","x":[["Dad allows me to stay up late.","아빠는 내가 늦게까지 깨어 있도록 허락한다. (allow(허락하다) → to stay(머무는 것))"],["Dad lets me stay up late.","아빠는 내가 늦게까지 깨어 있게 해 준다. (let(~하게 하다) → stay(머무르다))"]]},{"t":"tap","h":"확인 질문","q":"lets consumers see(소비자가 보게 해 주다)와 allows consumers to make(소비자가 내리게 해 주다)는 어디가 다른가?","a":["let(~하게 하다)은 원형 see(보다)를 받는다.","allow(허용하다)는 to부정사 to make(내리는 것)를 받는다."]}],"post":["allow(허용하다) + 사람 + to부정사: allows consumers to make(소비자가 내리게 해 주다)"]},{"slots":[["encourages","","","주어 it(그것)의 동사, 3인칭 단수 encourages(장려한다)."],["easier","easily","a","make(만들다) + 목적어 + 목적격보어 자리다. 보어는 형용사 easier(더 쉬운)가 온다. 부사 easily(쉽게)는 보어가 될 수 없다."],["to_make2","","","expect(기대하다) + to부정사다."],["wants","","","that(~하는)이 받는 any company(어떤 회사든)가 단수라 wants(원하다)."],["seeing","","","anticipate(예상하다) + 동명사 seeing(보는 것)이다."]],"opts":["more easily","easier","ease","easing"],"or":["more easily(더 쉽게): 부사라 목적격보어 자리에 못 옴.","easier(더 쉬운): make(만들다) + 목적어 + 형용사 보어라 맞음. products(제품들)가 더 쉬운 상태가 됨.","ease(쉬움, 덜어 주다): 명사나 동사라 '제품 = 더 쉬운' 관계를 못 만듦.","easing(덜어 주는): -ing라 '수리하기 더 쉬운'이라는 상태를 못 나타냄."],"point":"형용사 자리 vs. 부사 자리 (목적격보어)","en":"Secondly, it encourages manufacturers to make their products easier to repair.","ko":"둘째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다.","hl":["make their products easier to repair"],"khl":["수리하기 더 쉽게 만들도록"],"blocks":[{"t":"p","h":"두 번째 효과","x":["첫 번째 효과는 소비자 쪽, 두 번째 효과는 제조사 쪽이다.","점수가 낮으면 안 팔리니, 제조사는 제품을 고치기 쉽게 만들려고 한다.","make(만들다) + 목적어 + 보어 = 목적어를 ~한 상태로 만들다.","their products(그들의 제품) = easier(더 쉬운). 제품의 상태를 말하니 형용사다.","우리말 '쉽게'에 끌려 부사 easily(쉽게)를 고르면 함정에 빠진다."]},{"t":"pair","h":"쉬운 예시","x":[["The song makes me happy.","그 노래는 나를 행복하게 만든다. (me(나) = happy(행복한) → 형용사)"],["She sings happily.","그녀는 행복하게 노래한다. (동사 sings(노래한다)를 꾸밈 → 부사 happily(행복하게))"]]}],"post":["make(만들다) + 목적어 + 형용사: make their products easier(제품을 더 쉽게 만들다)"]}],"quiz":[{"s":"This is a shop that ___ fresh bread.","o":["sells","sell"],"a":0,"ko":"이곳은 신선한 빵을 파는 가게이다.","why":"that(~하는)의 주인 a shop(가게)이 단수 → sells(팔다).","wy":"sell(팔다): 복수 주어에 쓰는 모양이라 단수 a shop(가게)과 안 맞음."},{"s":"My mom let me ___ my friend’s house.","o":["to visit","visit"],"a":1,"ko":"엄마는 내가 친구 집에 놀러 가게 해 주셨다.","why":"let(~하게 하다) + 사람 + 동사원형.","wy":"to visit(방문하는 것): let(~하게 하다)은 to를 붙이지 않음."},{"s":"Ten people came, ___ my sister.","o":["including","included"],"a":0,"ko":"내 여동생을 포함해 열 명이 왔다.","why":"뒤에 목적어 my sister(내 여동생) → 능동 including(~을 포함하여).","wy":"included(포함된): 당하는 모양이라 뒤에 목적어를 못 가짐."},{"s":"The teacher allowed us ___ early.","o":["to leave","leave"],"a":0,"ko":"선생님은 우리가 일찍 가도록 허락하셨다.","why":"allow(허락하다) + 사람 + to부정사.","wy":"leave(떠나다): allow(허락하다)는 원형을 바로 받지 않음."},{"s":"The news made me ___.","o":["happily","happy"],"a":1,"ko":"그 소식은 나를 행복하게 만들었다.","why":"make(만들다) + 목적어 + 형용사 보어 → happy(행복한).","wy":"happily(행복하게): 부사라 목적격보어 자리에 못 옴."}]},{"items":[{"slots":[["that2","","","requires(요구하다)의 목적어 문장을 이끄는 that(~라고)이다."],["include","","","require(요구하다) + that절이라 동사원형 include(포함하다)."],["using","Used","a","지수가 점수를 직접 '사용하는' 쪽이고 뒤에 목적어 a score(점수)가 있다. Used(사용된)는 목적어를 못 데려온다."],["see","","","let(~하게 하다) + 사람 + 동사원형이다."],["easily","","","동사를 꾸미는 부사다."]],"opts":["Using","Use","Uses","Being used"],"or":["Using(사용하여): 지수가 점수를 사용하는 쪽이고 뒤에 목적어가 있는 능동 분사구문이라 맞음.","Use(사용하다): 뒤에 주어 the index(그 지수)와 동사 lets(~하게 하다)가 있어 동사원형이 앞에 또 올 수 없음.","Uses(사용하다, 3인칭 단수형): 주어 없이 문장 맨 앞에 올 수 없고 동사도 겹침.","Being used(사용되면서): 수동이라 뒤에 목적어 a score(점수)를 가질 수 없음."],"point":"능동 v-ing vs. 수동 p.p. (분사구문)","en":"Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.","ko":"색상으로 구분된 체계뿐만 아니라 0에서 10까지의 점수를 사용하여, 그 지수는 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다.","hl":["Using a score ranging from 0 to 10"],"khl":["0에서 10까지의 점수를 사용하여"],"blocks":[{"t":"p","h":"숫자와 색깔로","x":["지수는 0~10 점수와 색깔 체계를 쓴다.","문장의 진짜 주어는 뒤에 나오는 the index(그 지수), 동사는 lets(~하게 하다).","맨 앞 덩어리는 '~을 사용하여'라는 꾸밈말이다. 분사구문이다.","점수를 쓰는 쪽은 지수. 능동이고 목적어 a score(점수)도 있으니 Using(사용하여)."]},{"t":"pair","h":"쉬운 예시","x":[["Using a map, I found the shop.","지도를 써서 나는 가게를 찾았다. (내가 쓰는 쪽 → Using(사용하여))"],["Written in English, the book is hard.","영어로 쓰여 있어서 그 책은 어렵다. (책이 쓰인 쪽 → Written(쓰인))"]]}],"post":["주어가 하는 쪽 + 목적어 → 맨 앞 -ing: Using a score(점수를 사용하여)"]},{"slots":[["see","","","let(~하게 하다) + 사람 + 동사원형이다."],["easily","easy","a","how(얼마나) 뒤 말은 동사 can be repaired(수리될 수 있다)를 꾸민다. 동사를 r on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.","ko":"밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 뜻인 반면, 초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타낸다.","hl":["means that repairing the product will be difficult"],"khl":["어려울 것이라는 뜻인"],"blocks":[{"t":"p","h":"빨강과 초록","x":["빨간 라벨 + 낮은 숫자 = 고치기 어렵다.","초록 라벨 + 높은 숫자 = 고치기 쉽다.","means(의미하다)와 indicates(나타내다) 뒤에는 '무엇을' 뜻하는지가 문장 통째로 온다.","완전한 문장을 목적어로 묶는 말은 that(~라는 것)이다.","which(~하는)는 앞 명사를 꾸미는 말이라 이 자리에 못 온다."]},{"t":"pair","h":"쉬운 예시","x":[["Red means that you must stop.","빨간불은 멈춰야 한다는 뜻이다. (you must stop(너는 멈춰야 한다) 완전 → that)"],["I think that he is kind.","나는 그가 친절하다고 생각한다. (he is kind(그는 친절하다) 완전 → that)"]]}],"post":["means(의미하다) + that(~라는 것) + 완전한 문장"]},{"slots":[["to_make","","","allow(허용하다) + 사람 + to부정사다."],["encourages","encouraging","a","Secondly, it(둘째로, 그것은) 뒤에 진짜 동사가 하나도 없게 된다. -ing인 encouraging(장려하는)은 혼자 동사가 될 수 없다."],["easier","","","make(만들다) + 목적어 + 형용사 easier(더 쉬운)."],["to_make2","","","expect(기대하다) + to부정사다."],["wants","","","단수 any company(어떤 회사든)를 받아 wants(원하다)."]],"opts":["encourage","to encourage","encouragement","encourages"],"or":["encourage(장려하다, 원형): 주어 it(그것)은 3인칭 단수라 s가 필요함.","to encourage(장려하는 것): to부정사는 혼자 동사 자리에 못 옴.","encouragement(격려): 명사라 동사 자리에 못 옴.","encourages(장려하다): 주어 it(그것)이 3인칭 단수라 s 붙은 현재형 동사가 맞음."],"point":"정동사 vs. 준동사","en":"Secondly, it encourages manufacturers to make their products easier to repair.","ko":"둘째로, 그것은 제조사들이 제품을 수리하기 더 쉽게 만들도록 장려한다.","hl":["it encourages manufacturers to make"],"khl":["만들도록 장려한다"],"blocks":[{"t":"p","h":"두 번째 효과","x":["두 번째 효과는 제조사 쪽이다.","점수가 낮으면 안 팔리니, 제조사는 고치기 쉽게 만들려 한다.","문장의 뼈대: it(그것) + encourages(장려한다) + manufacturers(제조사들) + to make(만들도록).","주어 바로 뒤 자리는 진짜 동사 자리다. -ing나 to부정사로는 채울 수 없다."]},{"t":"pair","h":"쉬운 예시","x":[["She encourages me to read more.","그녀는 내가 책을 더 읽도록 격려한다. (주어 She(그녀) → 동사 encourages(격려하다))"],["My teacher helps us a lot 다."],["to_make2","making","a","expect(기대하다)는 to부정사를 목적어로 받는 동사다. making(하는 것)은 못 온다."],["wants","","","단수 any company(어떤 회사든) → wants(원하다)."],["seeing","","","anticipate(예상하다) + 동명사다."]],"opts":["make","to make","made","makes"],"or":["make(하다): can expect(기대할 수 있다) 뒤에 동사원형이 또 올 수 없음.","to make(하는 것): expect(기대하다) + to부정사라 맞음.","made(했다, 만들어진): 목적어 자리에 과거형이나 p.p.는 못 옴.","makes(하다, 3인칭 단수형): 동사라 목적어 자리에 못 옴."],"point":"동명사 목적어 vs. to부정사 목적어","en":"As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.","ko":"그 결과, 쓰레기 매립지로 가는 전자·전기 제품이 줄어들면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 전환할 것을 기대할 수 있다.","hl":["France can expect to make a transition"],"khl":["전환할 것을 기대할 수 있다"],"blocks":[{"t":"p","h":"매립지가 가벼워지면","x":["고치기 쉬운 제품이 늘면 매립지로 가는 쓰레기가 준다.","프랑스는 더 지속 가능한 사회로 바뀌기를 기대할 수 있다.","expect(기대하다), hope(바라다), plan(계획하다)은 앞으로 할 일을 바라는 동사라 to부정사를 받는다.","같은 지문 끝의 anticipate(예상하다)는 seeing(보는 것)을 받았다. 짝을 따로 외워 둔다."]},{"t":"pair","h":"쉬운 예시","x":[["I hope to see you soon.","곧 너를 보기를 바란다. (hope(바라다) → to see(보는 것))"],["We plan to visit Jeju.","우리는 제주를 방문할 계획이다. (plan(계획하다) → to visit(방문하는 것))"]]}],"post":["expect(기대하다) + to부정사: can expect to make a transition(전환할 것을 기대할 수 있다)"]}],"compquiz":[{"s":"The pictures on the wall ___ beautiful.","o":["are","is"],"a":0,"ko":"벽에 걸린 그림들은 아름답다.","why":"주인 The pictures(그림들)가 복수 → are(~이다).","wy":"is(~이다): 단수 동사라 복수 주인과 안 맞음."},{"s":"We expect ___ the game.","o":["winning","to win"],"a":1,"ko":"우리는 그 경기를 이길 거라 기대한다.","why":"expect(기대하다) + to부정사.","wy":"winning(이기는 것): expect(기대하다)는 -ing를 목적어로 받지 않음."}]},{"id":"e2g-4f","no":"본문 ❻","title":"어법특훈 · 영어II 4과 본문 ❻","sub":"수리 카페: 온 지역 사회가 나서야 한다","tpl":"When consumers are {given|given} the right tools and materials, along with some helpful advice, they can repair much of the damage {that|that} {occurs|occurs} to electronic products by themselves. That is why {rc_were|Repair Cafés were} started. They are free meeting places {where|where} people can {gather|gather} together and {fix|fix} their broken devices. The cafés are {staffed|staffed} by volunteer experts {who|who} can give technical advice and teach people how {to_fix|to fix} things. The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009. It was {such|such} a success {that2|that} the idea soon spread to neighboring countries. Before long, there {were|were} Repair Cafés in over 30 countries around the world. Along with {preventing|preventing} damaged items from {becoming|becoming} e-waste, these cafés also encourage people {to_share|to share} their invaluable skills and knowledge about the repair and maintenance of electronics. They continue to grow in popularity, with more and more people {signing|signing} up to volunteer.","fn":[],"mean":{"given":"주어진(give의 과거분사형)","give":"주다(동사원형)","that":"~라는 것, ~라고(접속사) / ~하는(관계대명사)","occurs":"발생하다(occur의 3인칭 단수 현재형)","Repair Cafés were":"수리 카페들이 ~되었다(주어 + 동사 어순)","where":"~하는 (곳)(장소의 관계부사)","gave":"주었다(give의 과거형)","gives":"주다(give의 3인칭 단수 현재형)","be given":"주어지다(give의 수동형)","were Repair Cafés":"수리 카페들이 ~되었나(동사 + 주어, 질문 어순)","gather":"모이다(동사원형)","Repair Cafés was":"수리 카페들이 ~되었다(복수 주어 + 단수 동사)","Repair Cafés being":"수리 카페들이 ~되는(동사 없는 모양)","Repair Cafés to be":"수리 카페들이 ~되는 것(동사 없는 모양)","fix":"고치다(동사원형)","fixing":"고치는 것(fix의 -ing형)","staffed":"직원으로 채워진(staff의 과거분사형)","who":"~하는 (사람)(사람을 받는 관계대명사)","fixed":"고쳤다(fix의 과거형) / 고쳐진(과거분사형)","fixes":"고치다(fix의 3인칭 단수 현재형)","to fix":"고치는(fix의 to부정사)","such":"아주 ~한(such + a + 명사)","so":"아주, 너무(so + 형용사·부사)","were":"~였다(be의 과거형, 복수 주어) / (가정법) ~라면","preventing":"막는 것(prevent의 -ing형, 동명사)","very":"매우(부사)","too":"너무(부사)","much":"많이, 훨씬(부사)","becoming":"~이 되는 것(become의 -ing형, 동명사)","to share":"나누는 것(share의 to부정사)","share":"나누다(동사원형)","signing":"(sign up에서) 신청하는(sign의 -ing형)","sharing":"나누는(share의 -ing형)","shared":"나눠진(share의 과거분사형)","shares":"나누다(share의 3인칭 단수 현재형)","is occurred":"(없는 모양) 자동사 occur(발생하다)의 ective(지속 가능한 관점)를 꾸미고 뒤에 주어가 빠진 관계대명사 that(~하는)."]],"opts":["maintaining","to maintain","maintained","maintains"],"or":["maintaining(유지하는): enable(~할 수 있게 하다)의 목적격보어 자리에 -ing는 못 옴.","to maintain(유지하는 것): enable(~할 수 있게 하다) + 사람 + to부정사라 맞음.","maintained(유지된): 개인이 직접 관리하는 쪽이고 뒤에 목적어도 있어 p.p.는 안 맞음.","maintains(유지하다, 3인칭 단수형): 목적격보어 자리에 s 붙은 동사는 못 옴."],"point":"목적격보어(준동사)","en":"By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and extend their life spans.","ko":"사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페는 개인이 자기 장치를 관리하고 그 수명을 늘릴 수 있게 해 준다.","hl":["enable individuals to maintain their devices"],"khl":["관리하고 그 수명을 늘릴 수 있게 해 준다"],"blocks":[{"t":"p","h":"고쳐서 오래 쓰기","x":["수리 카페 덕분에 사람들은 기기를 관리하고 수명을 늘린다.","enable(~할 수 있게 하다) + 사람 + to부정사 = 사람이 ~할 수 있게 하다.","이 과에서 계속 나온 allow(허용하다), encourage(장려하다)와 같은 짝이다.","to maintain and extend(관리하고 늘리는 것): extend(늘리다) 앞에는 to가 생략되어 있다."]},{"t":"pair","h":"쉬운 예시","x":[["This app enables you to learn words.","이 앱은 네가 단어를 배울 수 있게 해 준다. (enable(~할 수 있게 하다) → to learn(배우는 것))"],["Mom asked me to clean my room.","엄마는 나에게 방을 치우라고 하셨다. (ask(부탁하다) → to clean(치우는 것))"]]}],"post":["enable(~할 수 있게 하다) + 사람 + to부정사: enable individuals to maintain(개인이 관리할 수 있게 하다)"]},{"slots":[["repairing","","","was(~였다)의 주어 자리라 동명사 repairing(수리하는 것)."],["was","","","주어는 동명사구 repairing damaged devices and appliances(손상된 장치와 기기를 수리하는 것), 하나로 보니 단수 was(~였다)."],["were","","","If that were the case(만약 그렇다면): 현재 사실과 반대인 가정이라 were(~라면)."],["limited","limit","a","her options(그녀의 선택지)는 제한을 '받는' 쪽이다. be 뒤에 원형 limit(제한하다)은 올 수 없다."],["paying","","","limited to(~에 한정된)의 to(~에)는 전치사라 동명사 paying(지불하는 것)."]],"opts":["limits","to limit","limitation","limited"],"or":["limits(제한하다, 3인칭 단수형): be 뒤에 s 붙은 동사가 올 수 없음.","to limit(제한하는 것): 선택지가 제한을 받는 쪽인데 to부정사는 그 뜻을 못 만듦.","limitation(제한): 명사라 be limited to(~에 한정되다)의 뜻을 못 만듦.","limited(제한된): 선택지가 제한을 받는 쪽이라 be + p.p. 수동이 맞음."],"point":"능동태 vs. 수동태","en":"If that were the case, her options wouldn function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

  render();window.scrollTo(0,0);
}

    var ok=runs.filter(function(x){return x.round===r[0];});

    });

  });

  });

function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}

function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}

function cur(){return st.items[st.i];}

function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){

function slotReason(it,s,n,a){
  if(G){return s[3]||'';}

  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';

function wrongCard(it,a,aw,right){

  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';

      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');

  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }

/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}

  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';

  return h+footer(false);
}

  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
