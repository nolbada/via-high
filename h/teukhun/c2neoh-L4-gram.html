<html lang="ko" translate="no">

<title>어법특훈 · 공통영어2 능률(오) 4과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

s(~이다)."]],"opts":["what","who","how","why"],"or":["what(~하는 것): 앞에 명사 the reason(이유)이 있고 뒤 문장도 완전해서 못 옴.","who(~하는 사람): 사람을 받는 말인데 the reason(이유)은 사람이 아니고 뒤에 빠진 주어도 없음.","how(어떻게 ~하는지): the reason(이유) 같은 명사 뒤에 붙여 꾸미는 말로 쓰지 않음.","why(~하는 이유): 선행사 the reason(이유) 뒤에서 완전한 문장을 이끄는 관계부사라 맞음."],"point":"관계대명사 vs. 관계부사","en":"This is the reason why web accessibility is important.","ko":"이것이 웹 접근성이 중요한 이유이다.","hl":["the reason why"],"khl":["중요한 이유"],"blocks":[{"t":"p","h":"팔 부러진 것은 작은 문제","x":["왼손 마우스는 불편해도 a minor challenge(작은 문제)다.","장애가 있는 사람에게는 웹 사이트가 거의 쓸 수 없는 곳이 된다.","\"그래서\" 웹 접근성이 중요하다고 글이 결론 낸다.","the reason(이유)을 설명하는 자리가 why(~하는 이유)다."]},{"t":"p","h":"뒤 문장 검사","x":["web accessibility(주어) + is(동사) + important(보어). 빠진 것이 없다.","뒤가 완전하면 관계부사 why(~하는 이유).","뒤에 빠진 자리가 있어야 which(~하는)를 쓴다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the reason why I was late.","이것이 내가 늦은 이유이다. (뒤가 완전 → why(~하는 이유))"],["This is the book which I bought.","이것은 내가 산 책이다. (bought(샀다)의 목적어가 빠짐 → which)"]]}],"post":["the reason(이유) + why(~하는 이유) + 완전한 문장"]},{"slots":[["is","","","주어 web accessibility(웹 접근성)가 단수라 is(~이다)."],["making","","","전치사 of(~의) 뒤라 동명사 making(만드는 것)."],["be_used","","","websites(웹 사이트)는 사용 '되는' 쪽이라 수동 be used(사용되다)."],["accessible","accessibly","a","makes a website accessible(웹 사이트를 접근 가능하게 만들다). make(만들다) + 목적어 뒤에는 목적어 상태를 말하는 형용사가 온다."],["are","","","Here are(여기 ~이 있다) 뒤 진짜 주어 features(특징들)가 복수라 are(있다)."]],"opts":["accesses","accessing","to access","accessible"],"or":["accesses(접속하다, 3인칭 단수형): 목적어 뒤 보어 자리에 s 붙은 동사는 못 옴.","accessing(접속하는): make(만들다) + 목적어 뒤에 -ing는 못 옴.","to access(접속하는 것): make(만들다)는 목적어 뒤에 to부정사를 받지 않음.","accessible(접근 가능한): make(만들다) + 목적어 + 형용사로 웹 사이트의 상태를 말해서 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"So what exactly makes a website accessible?","ko":"그렇다면 무엇이 정확히 웹 사이트를 접근 가능하게 만들까?","hl":["makes a website accessible"],"khl":["접근 가능하게 만들까"],"blocks":[{"t":"p","h":"질문으로 다음 이야기 열기","x":["웹 접근성이 중요하다고 했으니 이제 질문이 나온다.","\"무엇이 웹 사이트를 접근 가능하게 만들까?\"","이 질문의 답이 뒤에 나올 common features(공통 특징들)이다."]},{"t":"p","h":"한국말 '~하게'에 속지 말기","x":["해석은 '접근 가능하게'라 부사처럼 들린다.","하지만 make(만들다) + 목적어 뒤는 목적어의 상태를 말하는 자리다.","웹 사이트가 \"접근 가능한\" 상태가 되는 것이다.","그래서 형용사 accessible(접근 가능한). -ly는 붙이지 않는다."]},{"t":"pair","h":"쉬운 예시","x":[["The song makes me happy.","그 노래는 나를 행복하게 만든다. (me(나) = happy(행복한) 상태)"],["He keeps his room clean.","그는 방을 깨끗하게 유지한다. (room(방) = clean(깨끗한) 상태)"]]}],"post":["make(만들다) + 목적어 + 형용사: makes a website accessible(접근 가능하게 만들다), -ly 금지"]}],"quiz":[{"s":"I have a cat ___ sleeps all day.","o":["what","that"],"a":1,"ko":"나는 하루 종일 자는 고양이가 있다.","why":"앞에 명사 a cat(고양이)이 있으니 that(~하는).","wy":"what(~하는 것): 앞에 명사 a cat(고양이)이 있으면 못 옴."},{"s":"You can stay home or ___ to the park.","o":["going","go"],"a":1,"ko":"너는 집에 있거나 공원에 갈 수 있다.","why":"can stay or go(머물거나 가다). 동사원형끼리 나란히.","wy":"going(가는 것): or(또는) 앞 stay(머물다)는 원형이라 짝이 안 맞음."},{"s":"___ soccer with friends is my hobby.","o":["Playing","Play"],"a":0,"ko":"친구들과 축구하는 것이 나의 취미이다.","why":"주어 자리라 -ing(~하는 것).","wy":"Play(놀다, 경기하다): 동사원형이라 주어가 될 수 없고 is(~이다)와 동사가 겹침."},{"s":"Tell me the reason ___ you left early.","o":["why","which"],"a":0,"ko":"네가 일찍 떠난 이유를 말해 줘.","why":"뒤 you left early(네가 일찍 떠났다)가 완전하니 why(~하는 이유).","wy":"which(~하는): 뒤에 빠진 자리가 있어야 하는데 문장이 완전함."},{"s":"Music makes me ___.","o":["happily","happy"],"a":1,"ko":"음악은 나를 행복하게 만든다.","why":"make(만들다) + 목적어 + 형용사.","wy":"happily(행복하게): 부사라 목적어 me(나)의 상태를 말할 수 없음."}]},{"items":[{"slots":[["broken","","","have fallen and broken(넘어져서 부러졌다). 앞의 have(완료)를 함께 써서 과거분사끼리 나란하다."],["that","","","things(일들)를 꾸미는 관계대명사 that(~하는)."],["to_do","","","difficult(어려운) 뒤 '하기에'를 더하는 to do(하기에)."],["injured","injuring","a","팔이 다치게 '하는' 것이 아니라 다침을 '당한' 것이다. 당한 쪽은 과거분사 injured(다친)."],["ride","","","carry(옮기다)와 or(또는)로 나란한 동사원형 ride(타다)."]],"opts":["injure","injures","injured","to injure"],"or":["injure(다치게 하다): 동사원형은 명사 arm(팔) 앞에서 꾸미는 말이 될 수 없음.","injures(다치게 하다, 3인칭 단수형): 동사라 your(당신의)와 arm(팔) 사이에 못 옴.","injured(다친): 팔이 다침을 당한 상태라 과거분사가 명사 arm(팔)을 꾸며 유)."],["is","","","주어 web accessibility(웹 접근성)가 단수라 is(~이다)."],["making","","","전치사 of(~의) 뒤 동명사."]],"opts":["uses","used","to using","to use"],"or":["uses(사용하다, 3인칭 단수형): 이미 can be(~일 수 있다)라는 동사가 있어 동사가 겹침.","used(사용된): 과거분사가 형용사 impossible(불가능한) 뒤에 붙어 '~하기에'라는 뜻을 만들지 못함.","to using(사용하는 것으로): 여기 to는 전치사가 아니라 to부정사의 to라 -ing가 못 옴.","to use(사용하기에): 형용사 impossible(불가능한) 뒤에서 '~하기에'를 나타내는 to부정사라 맞음."],"point":"to부정사 (형용사 수식)","en":"For people with certain disabilities, many websites can be nearly impossible to use.","ko":"특정 장애가 있는 사람들에게는, 많은 웹 사이트가 사용하기에 거의 불가능할 수 있다.","hl":["nearly impossible to use"],"khl":["사용하기에 거의 불가능할"],"blocks":[{"t":"p","h":"작은 문제 vs 큰 문제","x":["왼손 마우스는 시간이 좀 걸릴 뿐이다.","하지만 장애가 있는 사람에게 웹 사이트는 \"사용하기에 거의 불가능\"하다.","impossible(불가능한)만 쓰면 무엇이 불가능한지 모른다.","to use(사용하기에)가 붙어 '사용하기에' 불가능하다고 범위를 정한다."]},{"t":"pair","h":"쉬운 예시","x":[["This book is easy to read.","이 책은 읽기에 쉽다. (easy(쉬운) + to read(읽기에))"],["The water is too hot to drink.","그 물은 마시기에 너무 뜨겁다. (hot(뜨거운) + to drink(마시기에))"]]}],"post":["형용사 + to 동사원형 = ~하기에: impossible to use(사용하기에 불가능한)"]},{"slots":[["why","","","the reason(이유) 뒤 완전한 문장을 이끄는 why(~하는 이유)."],["is","are","a","the reason why(~하는 이유) 뒤 문장의 주어는 web accessibility(웹 접근성) 하나다. 셀 수 없는 단수라 is(~이다)."],["making","","","전치사 of(~의) 뒤 동명사 making(만드는 것)."],["that2","","","make sure(확실히 하다) 뒤 완전한 문장을 이끄는 접속사 that(~라는 것)."],["including","","","'~을 포함하여'라는 뜻으로 굳은 including(~을 포함하여)."]],"opts":["were","being","to be","is"],"or":["were(~였다, 복수 과거형): 주어가 단수라 수가 안 맞고, 시제도 현재가 아님.","being(~인 것): -ing는 혼자 동사 자리에 못 와서 관계부사 뒤 문장에 동사가 없어짐.","to be(~인 것): to부정사도 동사 자리에 못 와서 문장이 완성되지 않음.","is(~이다): 주어 web accessibility(웹 접근성)가 단수이고 지금의 이야기라 맞음."],"point":"주어-동사 수일치","en":"This is the reason why web accessibility is important.","ko":"이것이 웹 접근성이 중요한 이유이다.","hl":["web accessibility is important"],"khl":["웹 접근성이 중요한"],"blocks":[{"t":"p","h":"why(~하는 이유) 뒤 작은 문장의 주인","x":["why(~하는 이유) 뒤에도 주어와 동사가 있는 작은 문장이 있다.","그 작은 문장의 주인은 web accessibility(웹 접근성).","접근성은 하나의 개념이라 단수 취급.","그래서 are(~이다, 복수형)가 아니라 is(~이다)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the reason why music is important.","이것이 음악이 중요한 이유이다. (music(음악) → is(~이다))"],["That is why the students are tired.","그것이 학생들이 피곤한 이유이다. (students(학생들) → are(~이다))"]]}],"post":["why(~하는 이유) 뒤 주인 web accessibility(웹 접근성) 단수 → is(~이다)"]},{"slots":[["making","","","전치사 of(~의) 뒤 동명사."],["that2","","","make sure(확실히 하다) 뒤 '~라는 것'을 이끄는 접속사 that."],["be_used","use","a","websites(웹 사이트)는 사람이 사용하는 대상이다. 웹 사이트가 직접 쓰는 게 아니라 쓰이는 쪽이라 be used(사용되다)."],["including","","","'~을 포함하여'라는 뜻의 including(~을 포함하여)."],["accessible","","","make(만들다) + 목적어 + 형용사 accessible(접근 가능한)."]],"opts":["be used","used","being used","to be used"],"or":["be used(사용되다): 조동사 can(~할 수 있다) 뒤 수동 동사원형이라 맞음.","used(사용된): can(~할 수 있다) 뒤에는 동사원형이 와야 해서 과거분사만 올 수 없음.","being used(사용되는 것): can(~할 수 있다) 뒤에 -ing는 못 옴.","to be used(사용되는 것): can(~할 수 있다) 뒤에 to가 끼면 안 됨."],"point":"능동태 vs. 수동태","en":"Web accessibility is the practice of making sure that websites can be used by everyone, including people with disabilities.","ko":"웹 접근성은 웹 사이트가 장애가 있는 사람들을 포함하여 모두에게 사용될 수 있도록 확실히 하는 실천이다.","hl":["websites can be used by everyone"],"khl":["모두에게 사용될 수 있도록"],"blocks":[{"t":"p","h":"웹 접근성의 정의","x":["이 문장이 웹 접근성의 뜻을 정리한다.","모두가, 장애가 있는 사람까지, 웹 사이트를 쓸 수 있게 하는 실천.","쓰는 사람은 everyone(모두)이고 웹 사이트는 쓰이는 쪽이다.","by everyone(모두에 의해)이 붙은 것도 수동태라는 신호다."]},{"t":"pair","h":"쉬운 예시","x":[["This room is cleaned by Tom.","이 방은 Tom(톰)에 의해 청소된다. (방은 청소되는 쪽)"],["The song can be sung by everyone.","그 노래는 모두가 부를 수 있다. (노래는 불리는 쪽)"]]},{"t":"tap","h":"확인 질문","q":"websites(웹 사이트)가 사람을 사용하나, 사람이 웹 사이트를 사용하나?","a":["사람(everyone = 모두)이 웹 사이트를 사용한다.","웹 사이트는 쓰이는 쪽이라 be used(사용되다)."]}],"post":["쓰이는 쪽 + by(~에 의해): can be used by everyone(모두에게 사용될 수 있다)"]}],"quiz":[{"s":"Be careful with your ___ finger.","o":["injured","injuring"],"a":0,"ko":"다친 손가락을 조심해.","why":"손가락이 다침을 당했으니 -ed.","wy":"injuring(다치게 하는): 손가락이 남을 다치게 한다는 뜻이 되어 안 맞음."},{"s":"What about ___ a movie tonight?  실천)"]},{"no":"본문 ❶","slots":[["compared","","","compared to(~에 비해)는 한 덩어리 표현이다."],["what","that","a","compared to(~에 비해) 뒤에 '직면하는 것'이라는 명사 덩어리가 온다. 앞에 명사가 없고 face(직면하다)의 목적어도 빠져 있다. that(~하는)은 이 빈자리를 채우지 못한다."],["to_use","","","impossible(불가능한) 뒤에서 '~하기에'를 더하는 to use(사용하기에)."],["is","","","why(~하는 이유) 뒤 주어 web accessibility(웹 접근성)가 단수라 is(~이다)."],["that2","","","make sure(확실히 하다) 뒤 완전한 문장을 이끄는 접속사 that(~라는 것)."]],"opts":["which","whose","where","what"],"or":["which(~하는): 꾸밀 명사가 바로 앞에 있어야 하는데 compared to(~에 비해) 뒤라 꾸밀 명사가 없음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 some(몇몇)은 그 자리가 아니고, face(직면하다)의 목적어도 빠져 있음.","where(~하는 곳): 뒤에 완전한 문장이 와야 하는데 face(직면하다)의 목적어가 빠져 있음.","what(~하는 것): 앞에 명사가 없고 face(직면하다)의 목적어가 빠져 있어 '~하는 것'이라는 명사 덩어리를 만들어서 맞음."],"point":"that vs. what","en":"However, this is a minor challenge compared to what some of us face on the Internet.","ko":"그러나 이것은 우리 중 몇몇이 인터넷에서 직면하는 것에 비해 작은 문제이다.","hl":["compared to what some of us face"],"khl":["직면하는 것에 비해"],"blocks":[{"t":"p","h":"부러진 팔은 작은 문제","x":["왼손으로 마우스를 쓰는 건 불편하다.","하지만 글은 이것이 a minor challenge(작은 문제)라고 한다.","장애가 있는 사람들이 인터넷에서 \"직면하는 것\"에 비하면 말이다.","이 \"직면하는 것\"을 만드는 말이 what(~하는 것)이다."]},{"t":"p","h":"빈자리 검사","x":["some of us(우리 중 몇몇) + face(직면하다) + ?","face(직면하다)가 무엇을 직면하는지가 빠져 있다.","앞에 명사도 없다.","명사도 없고 빈자리도 있으면 what(~하는 것).","that(~하는)은 앞에 명사가 있을 때만 빈자리 문장을 이끈다."]},{"t":"pair","h":"쉬운 예시","x":[["This is what I wanted.","이것이 내가 원했던 것이다. (앞에 명사 없음, wanted(원했다)의 목적어 빠짐 → what)"],["This is the bag that I wanted.","이것이 내가 원했던 가방이다. (앞에 명사 bag(가방) → that)"]]}],"post":["compared to(~에 비해) + what(~하는 것) + 목적어 빠진 문장: what some of us face(우리 중 몇몇이 직면하는 것)"]}],"compquiz":[{"s":"I am interested in ___ English.","o":["learn","learning"],"a":1,"ko":"나는 영어를 배우는 것에 관심이 있다.","why":"전치사 in(~에) 뒤는 -ing.","wy":"learn(배우다): 동사원형은 전치사 in(~에) 뒤에 못 옴."},{"s":"This is ___ I wanted.","o":["that","what"],"a":1,"ko":"이것이 내가 원했던 것이다.","why":"앞에 명사가 없고 wanted(원했다)의 목적어가 빠져 있어 what(~하는 것).","wy":"that(~라는 것): 앞에 꾸밀 명사도 없고, 뒤에 완전한 문장이 와야 하는데 wanted(원했다)의 목적어가 빠져 있음."}]},{"id":"jg1-g4b","no":"본문 ❷❸","title":"어법특훈 · 공통영어2 4과 본문 ❷+❸","sub":"이미지 설명 대체 텍스트와 음성 콘텐츠의 대본·자막","tpl":"Along with text, most websites include other forms of information, such as images. Sometimes such visual information is important for {understanding|understanding} the text. This is a problem for users with visual disabilities. When they go on a website, they often use programs {called|called} “screen readers,” {which|which} {read1|read} online text aloud. However, these programs cannot “read” images. Accessible websites solve this problem by {providing|providing} alternative text, also {known|known} as “alt text.” Alt text is a brief description of non-textual information. For instance, if an image {shows|shows} a group of students, its alt text would explain how many students are in the image and {what|what} they are doing. Screen readers can detect this alt text and {read2|read} it aloud. This way, alt text ensures {that1|that} people with visual disabilities can access more of the information on a website. In some cases, audio content cannot be accessed or {understood|understood}. Some people may have hearing disabilities, while others might be in places {where|where} they can’t listen to audio, such as a quiet library. Therefore, accessible websites often offer other ways {to_access|to access} information that {is|is} presented in audio form. For example, they may provide transcripts or captions {that2|that} can help users {access2|access} this information. Transcripts are text versions of the entire audio content, while captions are text versions of the audio that {appear|appear} in a video as it plays. Captions {include|include} not only the text version of the {spoken|spoken} words but also descriptions of the music and other sounds in the video.","fn":["*screen reader: 스크린 리더(화면의 글을 소리 내어 읽어 주는 프로그램)","*transcript: 대본","*caption: 자막"],"mean":{"has read":"읽어 왔다(read의 현재완료형, 단수 주어)","like":"좋아하다(동사원형·복수 주어 현재형)","likes":"좋아하다(like의 3인칭 단수 현재형)","understanding":"이해하는 것(understand의 -ing형, 동명사)","understand":"이해하다(동사원형)","understood":"이해된(understand의 과거분사형)","understands":"이해하다(understand의 3인칭 단수 현재형)","to understand":"이해하는 것(understand의 to부정사)","understandably":"당연하게도(부사)","called":"~라고 불리는(call의 과거분사형)","call":"부르다(동사원형)","calls":"부르다(call의 3인칭 단수 현재형)","are called":"~라고 불린다(call의 수동 현재형)","have called":"불러 왔다(call의 현재완료형)","which":"그것은, 그것들은(계속적 용법 관계대명사)","that":"~하는(관계대명사) / ~라는 것(접속사)","what":"~하는 것(관계대명사) / 무엇(의문사)","whose":"~의(소유격 관계대명사)","where":"~하는 (곳)(관계부사)","who":"~하는(사람을 받는 관계대명사)","when":"~하는 (때)(관계부사)","read":"읽다, 읽어 주다(동사원형·현재형)","reads":"읽다(read의 3인칭 단수 현재형)","reading":"읽는 것, 읽는(read의 -ing형)","to read":"읽는 것(read의 to부정사)","being read":"읽히는 것(read의 수동 -ing형)","providing":"제공하는 것(provide의 -ing형, 동명사)","provide":"제공하다(동사원형)","provided":"제공했다(provide의 과거형) / 제공된(과거분사형)","provides":"제공하다(provide의 3인칭 단수 현재형)","to provide":"제공하는 것(provide의 to부정사)","known":"알려진(know의 과거분사형)","knowing":"아는(know의 -ing형)","know":"알다(동사원형)","knows":"알다(know의 3인칭 단수 현재형)","to know":"아는 것(know의 to부정사)","shows":"보여 주다(show의 3인칭 단수 현재형)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","be":"~이다(be동사원형)","being":"~인 것(be의 -ing형)","were":"~였다(be의 과거형, 복수 주어)","to access":"접근할(access의 to부정사)","access":"접근하다(동사원형)","appear":"나타나다(동사원형·현재형)","include":"포함하다(동사원형·현재형)","includes":"포함하다(include의 3인칭 단수 현재형)","including":"포함하는 것, ~을 포함하여(include의 -ing형)","to include":"포함하는 것(include의 to부정사)","has included":"포함해 왔다(include의 현재완료형, 단수 주어)","spoken":"말해진, 발화된(speak의 과거분사형)","speaking":"말하는(speak의 -ing형)","speak":"말하다(동사원형)","speaks":"말하다(speak의 3인칭 단수 현재형)","spoke":"말했다(speak의 과거형)","draw":"그리다(동사원형)","drawing":"그리는 것(draw의 -ing형, 동명사)","sing":"노래하다(동사원형)","singing":"노래하는 것(sing의 -ing형, 동명사)","broken":"깨진(break의 과거분사형)","break":"깨다(동사원형)","dance":"춤추다(동사원형)","dancing":"춤추는 것(dance의 -ing형)","drink":"마시다(동사원형·현재형)","drinks":"마시다(drink의 3인칭 단수 현재형)"},"sets":[{"items":[{"slots":[["understanding","understan ],"point":"정동사 vs. 준동사","en":"When they go on a website, they often use programs called “screen readers,” which read online text aloud.","ko":"그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다.","hl":["use programs called"],"khl":["불리는 프로그램을 사용하는데"],"blocks":[{"t":"p","h":"동사 자리는 하나","x":["시각 장애가 있는 사람들은 '스크린 리더'를 쓴다.","스크린 리더는 화면의 글을 소리 내어 읽어 준다.","they often use(그들은 종종 사용한다)에서 동사 자리는 이미 찼다.","남은 말은 programs(프로그램들)를 꾸미는 말이어야 한다.","프로그램이 그렇게 '불리는' 쪽이라 called(불리는)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a dog called Max.","나는 Max(맥스)라고 불리는 개가 있다. (called(불리는)가 dog(개)를 꾸밈)"],["She read a book written in English.","그녀는 영어로 쓰인 책을 읽었다. (written(쓰인)이 book(책)을 꾸밈)"]]}],"post":["동사 use(사용하다) 자리 끝 → 꾸밈은 p.p.: programs called(~라 불리는 프로그램)"]},{"slots":[["called","","","프로그램이 불리는 쪽이라 과거분사."],["which","that","a","콤마(,) 바로 뒤에서 앞말을 덧붙여 설명하는 자리다. 이 자리에 that(~하는)은 쓸 수 없다."],["read1","","","which(그것들은)가 받는 programs(프로그램들)가 복수라 read(읽어 주다)."],["known","","","also known as(~라고도 알려진) 한 덩어리."],["shows","","","if(만약 ~라면)절의 주어 an image(이미지)가 단수라 shows(보여 주다)."]],"opts":["what","which","whose","where"],"or":["what(~하는 것): 앞에 명사 screen readers(스크린 리더)가 있어서 못 옴.","which(그것들은): 콤마 뒤에서 programs(프로그램들)를 덧붙여 설명하고, 뒤에 주어가 빠져 있어 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 동사 read(읽어 주다)가 옴.","where(~하는 곳): 장소 뒤에서 완전한 문장을 이끄는 말인데 뒤에 주어가 빠져 있음."],"point":"관계대명사 (계속적 용법 which)","en":"When they go on a website, they often use programs called “screen readers,” which read online text aloud.","ko":"그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다.","hl":["“screen readers,” which read"],"khl":["이것은"],"blocks":[{"t":"p","h":"콤마는 that(~하는)을 막는 문","x":["'스크린 리더'라는 이름을 말한 뒤 콤마를 찍었다.","그리고 \"그건 글을 소리 내어 읽어 준다\"고 덧붙인다.","콤마 뒤에서 덧붙여 설명하는 자리에는 which(그것은)나 who(그 사람은)만 온다.","that(~하는)은 콤마 뒤에 못 선다. 학교 시험 단골 함정."]},{"t":"pair","h":"쉬운 예시","x":[["I read the book, which was very funny.","나는 그 책을 읽었는데, 그것은 아주 재미있었다. (콤마 + which(그것은))"],["This is the book that I read.","이것  이끄는 관계부사라 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 주어 they(그들)가 와서 안 됨."],"point":"관계대명사 vs. 관계부사","en":"Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library.","ko":"어떤 사람들은 청각 장애를 가지고 있을 수도 있는 반면, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다.","hl":["places where they can’t listen to audio"],"khl":["음성을 들을 수 없는 장소"],"blocks":[{"t":"p","h":"못 듣는 이유는 두 가지","x":["첫째, 청각 장애가 있어서.","둘째, 조용한 도서관처럼 소리를 켤 수 없는 장소에 있어서.","그 '장소'를 뒤에서 설명하는 말이 where(~하는 곳)이다.","listen to audio(음성을 듣다)까지 다 갖춰져 빈자리가 없다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the house where I was born.","여기가 내가 태어난 집이다. (뒤가 완전 → where(~하는 곳))"],["This is the house which I bought.","이것은 내가 산 집이다. (bought(샀다)의 목적어가 빠짐 → which(~하는))"]]}],"post":["장소 + where(~하는 곳) + 완전한 문장: places where they can’t listen(들을 수 없는 장소)"]},{"slots":[["where","","","places(장소들) 뒤 관계부사."],["to_access","","","other ways(다른 방법들)를 꾸미는 to access(접근할)."],["is","are","a","that이 받는 말은 information(정보)이다. information(정보)은 셀 수 없는 명사라 언제나 단수 취급."],["that2","","","transcripts or captions(대본이나 자막)를 꾸미는 관계대명사 that(~하는)."],["appear","","","that이 받는 text versions(텍스트 버전들)가 복수라 appear(나타나다)."]],"opts":["is","be","being","were"],"or":["is(~이다): that이 받는 information(정보)이 셀 수 없는 단수라 맞고, is presented(제시되다)라는 현재 수동을 만듦.","be(~이다, 동사원형): 관계대명사 that 뒤 동사 자리에 원형만 올 수 없음.","being(~인 것): -ing는 혼자 동사 자리에 못 와서 that 뒤 문장에 동사가 없어짐.","were(~였다, 복수 과거형): information(정보)은 단수라 복수 동사가 안 맞음."],"point":"주어-동사 수일치","en":"Therefore, accessible websites often offer other ways to access information that is presented in audio form.","ko":"그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다.","hl":["information that is presented"],"khl":["제시되는 정보"],"blocks":[{"t":"p","h":"정보는 셀 수 없다","x":["information(정보)은 한 개, 두 개로 셀 수 없는 명사다.","그래서 s도 안 붙고, 동사도 언제나 단수형.","that(~하는) 뒤 동사는 that(~하는)이 받는 명사에 맞춘다.","음성 형식으로 제시되는 것은 ways(방법들)가 아니라 information(정보)이다.","그래서 that(~하는)은 바로 앞 information(정보)을 받고, information(정보) → is presented(제시되다)."]},{"t":"pair","h":"쉬운 예시","x":[["The information is very useful.","그 정보는 매우 유용하다. (information(정보) → is(~이다))"],["The advice that he gave me is helpful.","그가 나에게 해 준 충고는 도움이 된다. (advice(충고)도 셀 수 없음 → is(~이다))"]]}],"post":["information(정보) = 셀 수 없음 → 단수 is(~이다)"]},{"slots":[["is","","","information(정보)은 단수라 is(~이다)."],["that2","what","a","앞에 transcripts or captions(대본이나 자막)라는 명사가 있다. 명사를 뒤에서 꾸밀 땐 what(~하는 것)이 아니라 that(~하는)."],["access2","","","help(돕다) + 목적어 + 동사원형 access(접근하다)."],["appear","","","text versions(텍스트 버전들)가 복수라 appear(나타나다)."],["include","","","주어 Captions(자막)가 복수라 include(포함하다)."]],"opts":["that","whose","where","when"],"or":["that(~하는): 앞 명사 transcripts or captions(대본이나 자막)를 꾸미고 뒤에 주어가 빠져 있어 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 조동사 can(~할 수 있다)이 와서 안 됨.","where(~하는 곳): 장소 뒤 완전한 문장을 이끄는 말인데 뒤에 주어가 빠져 있음.","when(~하는 때): 시간 뒤 완전한 문장을 이끄는 말인데 대본과 자막은 시간이 아니고 주어도 빠져 있음."],"point":"that vs. what","en":"For example, they may provide transcripts or captions that can help users access this information.","ko":"예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다.","hl":["transcripts or captions that can help"],"khl":["도움이 될 수 있는 대본이나 자막"],"blocks":[{"t":"p","h":"귀를 대신하는 두 가지","x":["못 듣는 사람을 위한 방법은 transcripts(대본)와 captions(자막)이다.","이 둘을 뒤에서 \"사용자를 돕는\"이라고 꾸며 준다.","앞에 명사가 있으니 that(~하는).","what(~하는 것)은 자기 안에 명사를 품고 있어서 앞에 명사가 또 오면 안 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I lost the pen that my dad gave me.","나는 아빠가 주신 펜을 잃어버렸다. (명사 pen(펜) + that)"],["I lost what my dad gave me.","나는 아빠가 주신 것을 잃어버렸다. (앞에 명사 없이 what)"]]}],"post":["명사(captions = 자막) + that(~하는): 앞에 명사 있으면 what(~하는 것) 금지"]},{"slots":[["that2","","","transcripts or captions(대본이나 자막)를 꾸미는 that(~하는)."],["access2","","","help(돕다) + 목적어 + 동사원형 access(접근하다)."],["appear","","","text versions(텍스트 버전들)가 복수라 appear(나타나다)."],["include","","","주어 Captions(자막)가 복수라 include(포함하다)."],["spoken","speaking","a","words(단어들)는 사람이 말한 것, 즉 '말해진' 쪽이다. 단어가 직접 말하는 게 아니라서 과거분사 spoken(말해진)."]],"opts":["speak","speaks","spoke","spoken"],"or":["speak(말하다): 동사원형은 the(그)와 words(단어들) 사이에서 명사를 꾸밀 수 없음.","speaks(말하다, 3인칭 단수형): 동사라 명사 앞 꾸밈 자리에 못 옴.","spoke(말했다, speak의 과거형): 과거형 동사는 명사를 앞에서 꾸밀 수 없음.","spoken(말해진): 단어들이 말해진 쪽이라 과거분사가 명사 words(단어들)를 꾸며서 맞음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video.","ko":"자막은 발화된 단어의 텍스트 버전뿐만 아니라 영상 내의 음악과 다른 소리들에 대한 설명도 포함한다.","hl":["the spoken words"],"khl":["발화된 단어"],"blocks":[{"t":"p","h":"자막에 들어가는 것","x":["자막에는 사람이 한 말이 글로 나온다.","그뿐 아니라 음악과 다른 소리에 대한 설명도 나온다.","'사람이 한 말' = 말해진 단어들 = the spoken words(발화된 단어).","단어는 말을 하는 쪽이 아니라 말해지는 쪽이다."]},{"t":"pair","h":"쉬운 예시","x":[["English is spoken in many countries.","영어는 많은 나라에서 말해진다. (영어는 말해지는 쪽 → spoken(말해진))"],["I like the speaking robot.","나는 말하는 로봇이 좋다. (로봇이 직접 말함 → speaking(말하는))"]]}],"post":["말해진 단어 = p.p.: the spoken words(발화된 단어)"]}],"quiz":[{"s":"I have two cats, which ___ milk.","o":["likes","like"],"a":1,"ko":"나는 고양이 두 마리가 있는데, 그것들은 우유를 좋아한다.","why":"which(그것들은)가 받는 cats(고양이들)가 복수라 like(좋아하다).","wy":"likes(좋아하다, 3인칭 단수형): which(그것들은)가 받는 cats(고양이들)는 복수라 수가 안 맞음."},{"s":"This is the town ___ I grew up.","o":["where","which"],"a":0,"ko":"이곳은 내가 자란 마을이다.","why":"뒤 I grew up(내가 자랐다)이 완전하니 where(~하는 곳).","wy":"which(~하는): 뒤에 빠진 자리가 있어야 하는데 문장이 완전함."},{"s":"The information on this website ___ very useful.","o":["are","is"],"a":1,"ko":"이 웹 사이트의 정보는 매우 유용하다.","why":"information(정보)은 셀 수 없는 단수라 is(~이다).","wy":"are(~이다, 복수형): 단수 information(정보)과 안 맞음."},{"s":"I lost the pen ___ my dad gave me.","o":["that","what"],"a":0,"ko":"나는 아빠가 주신 펜을 잃어버렸다.","why":"앞에 명사 the pen(펜)이 있으니 that(~하는).","wy":"what(~하는 것): 앞에 명사 the pen(펜)이 있어서 못 옴."},{"s":"English is ___ in many countries.","o":["speaking","spoken"],"a":1,"ko":"영어는 많은 나라에서 쓰인다.","why":"영어는 말해지는 쪽이라 p.p.","wy":"speaking(말하는): 영어가 직접 말한다는 뜻이 되어 안 맞음."}]}],"comp":[{"no":"본문 ❷❸","slots":[["known",""," de not only the text version of the spoken words but also descriptions of the music and other sounds in the video.","ko":"자막은 발화된 단어의 텍스트 버전뿐만 아니라 영상 내의 음악과 다른 소리들에 대한 설명도 포함한다.","hl":["Captions include"],"khl":["자막은"],"blocks":[{"t":"p","h":"주인은 맨 앞에 있다","x":["Captions(자막들)가 주어다. s가 붙은 복수.","동사 include(포함하다)는 주어에 맞춰 s 없이.","not only A but also B(A뿐만 아니라 B도)가 길게 이어져도 동사는 처음 주어만 본다.","자막 하나에 말과 소리 설명이 다 들어 있다는 것이 이 문장의 내용이다."]},{"t":"pair","h":"쉬운 예시","x":[["My parents drink coffee every morning.","우리 부모님은 매일 아침 커피를 마신다. (parents(부모님) → drink(마시다))"],["My dad drinks coffee every morning.","우리 아빠는 매일 아침 커피를 마신다. (dad(아빠) → drinks(마시다))"]]},{"t":"tap","h":"확인 질문","q":"transcripts(대본)와 captions(자막)의 차이는?","a":["transcripts(대본)는 음성 전체를 글로 옮긴 것.","captions(자막)는 영상이 재생될 때 영상 안에 나타나는 글."]}],"post":["복수 주어(Captions = 자막들) → include(포함하다), s 없음"]}],"compquiz":[{"s":"She can sing and ___ well.","o":["dance","dancing"],"a":0,"ko":"그녀는 노래하고 춤을 잘 출 수 있다.","why":"can(~할 수 있다) + sing and dance(노래하고 춤추다). 동사원형끼리 나란히.","wy":"dancing(춤추는 것): can(~할 수 있다) 뒤 sing(노래하다)과 모양이 안 맞음."},{"s":"My parents ___ coffee every morning.","o":["drinks","drink"],"a":1,"ko":"우리 부모님은 매일 아침 커피를 마신다.","why":"주어 My parents(우리 부모님)가 복수라 drink(마시다).","wy":"drinks(마시다, 3인칭 단수형): 복수 주어 parents(부모님)와 안 맞음."}]},{"id":"jg1-g4d","no":"본문 ❹❺","title":"어법특훈 · 공통영어2 4과 본문 ❹+❺","sub":"보고 듣기 쉬운 콘텐츠와 키보드만으로 하는 탐색","tpl":"{having|Having} a visual disability {doesnt|doesn’t} necessarily mean a person can’t see at all. Some people, including many elderly people, simply {have1|have} poor eyesight. This makes it {difficult|difficult} for them to read. For this reason, accessible websites have a background color {that1|that} contrasts with the color of their text. This makes the text {clear_enough|clear enough} for most people to see. As for audio content, accessible websites allow users {to_adjust|to adjust} the volume of background sound or to turn it off altogether. This gives users both with and without hearing difficulties more control over their experience {while|while} they are using the sites. Some users have disabilities {that2|that} {limit|limit} the movement of their hands. They rely on their keyboards, rather than a mouse, {to_navigate|to navigate} websites. On accessible websites, users can access everything on the site {using|using} only a keyboard. This means that links, buttons, and fields, {which|which} are spaces {where|where} information is entered, can {be_accessed|be accessed} through keyboard navigation. Users navigate the websites by {making|making} use of keys such as the space bar, the arrow keys, the enter key, and the tab key. For example, they can use the tab key to jump from one part of a web page to another. Both users with disabilities and {those|those} with temporarily {injured|injured} hands can {benefit|benefit} from this kind of navigation.","fn":["*eyesight: 시력","*contrast with: ~와 대조를 이루다","*navigate: (웹 사이트를) 탐색하다"],"mean":{"Having":"가지고 있는 것(have의 -ing형, 동명사)","Have":"가지다(동사원형)","Has":"가지다(have의 3인칭 단수 현재형)","Had":"가졌다(have의 과거형)","Have had":"가져 왔다(have의 현재완료형)","doesn’t":"~하지 않는다(does not, 단수 주어)","don’t":"~하지 않는다(do not, 복수 주어)","isn’t":"~이 아니다(is not)","aren’t":"~이 아니다(are not)","haven’t":"~하지 않았다(have not, 완료형)","have":"가지고 있다(동사원형·현재형)","has":"가지고 있다(have의 3인칭 단수 현재형)","having":"가지고 있는 것(have의 -ing형)","to have":"가지는 것(have의 to부정사)","is having":"가지고 있는 중이다(have의 진행형, 단수 주어)","difficult":"어려운(형용사)","that":"~하는(관계대명사) / 그것(지시대명사)","what":"~하는 것(선행사를 품은 관계대명사)","whose":"~의(소유격 관계대명사)","where":"~하는 (곳)(관계부사)","when":"~하는 (때)(관계부사)","who":"~하는(사람을 받는 관계대명사)","how":"어떻게 ~하는지(의문사)","which":"그것은, 그것들은(계속적 용법 관계대명사)","clear enough":"충분히 명확한(형용사 + enough)","to adjust":"조절하도록(adjust의 to부정사)","adjust":"조절하다(동사원형)","adjusts":"조절하다(adjust의 3인칭 단수 현재형)","adjusted":"조절했다(adjust의 과거형) / 조절된(과거분사형)","to adjusting":"조절하는 것으로(전치사 to + 동명사)","while":"~하는 동안(접속사)","during":"~ 동안(전치사)","despite":"~에도 불구하고(전치사)","because of":"~ 때문에(전치사구)","throughout":"~ 내내(전치사)","lim isit} the same websites in a different language setting, you {will|will} see a different format.","fn":["*color blindness: 색맹","*indicator: 지표, 표시","*inclusive: 차별 없는, 모두를 포함하는"],"mean":{"find":"여기다, 알게 되다(동사원형·현재형)","finds":"여기다(find의 3인칭 단수 현재형)","finding":"발견하는 것(find의 -ing형)","to find":"찾기 위해(find의 to부정사)","has found":"여겨 왔다(find의 현재완료형, 단수 주어)","found":"발견했다(find의 과거형)","to show":"보여 주기 위해(show의 to부정사)","show":"보여 주다(동사원형)","shows":"보여 주다(show의 3인칭 단수 현재형)","showed":"보여 주었다(show의 과거형)","to showing":"보여 주는 것으로(전치사 to + 동명사)","dotted":"점선으로 된(dot의 과거분사형)","that":"~라는 것(접속사) / 그것(단수 명사를 대신하는 말)","what":"~하는 것(선행사를 품은 관계대명사)","whose":"~의(소유격 관계대명사)","where":"~하는 (곳)(관계부사)","who":"~하는(사람을 받는 관계대명사)","how":"어떻게 ~하는지(의문사)","which":"~하는(관계대명사, 뒤에 빠진 말이 있어야 함)","don’t":"~하지 않는다(do not, 복수 주어)","doesn’t":"~하지 않는다(does not, 단수 주어)","isn’t":"~이 아니다(is not)","aren’t":"~이 아니다(are not)","haven’t":"~하지 않았다(have not, 완료형)","easier":"더 쉬운(easy의 비교급, 형용사)","more easily":"더 쉽게(부사의 비교급)","easily":"쉽게(부사)","more easier":"더 쉬운(비교급을 두 번 쓴 틀린 모양)","most easily":"가장 쉽게(부사의 최상급)","to navigate":"탐색하기에(navigate의 to부정사)","navigate":"탐색하다(동사원형)","navigates":"탐색하다(navigate의 3인칭 단수 현재형)","navigated":"탐색했다(navigate의 과거형) / 탐색된(과거분사형)","to navigating":"탐색하는 것으로(전치사 to + 동명사)","benefit":"득을 보다(동사원형)","are":"~이다(be의 현재형, 복수 주어)","different":"다른(형용사)","differently":"다르게(부사)","differ":"다르다(동사원형)","differs":"다르다(differ의 3인칭 단수 현재형)","differed":"달랐다(differ의 과거형·과거분사형)","those":"~한 사람들, 그것들(복수 명사를 대신하는 말)","them":"그들을(they의 목적격)","it":"그것(단수 대명사)","this":"이것(단수 지시대명사)","read":"읽다(동사원형·현재형)","take":"취하다(동사원형·현재형, take ~ into consideration = ~을 고려하다)","taking":"취하는 것, 취하는(take의 -ing형)","takes":"취하다(take의 3인칭 단수 현재형)","to take":"취하는 것(take의 to부정사)","taken":"취해진(take의 과거분사형)","adjust":"조정하다(동사원형·현재형)","adjusting":"조정하는 것, 조정하는(adjust의 -ing형)","adjusts":"조정하다(adjust의 3인칭 단수 현재형)","to adjust":"조정하는 것(adjust의 to부정사)","has adjusted":"조정해 왔다(adjust의 현재완료형, 단수 주어)","visit":"방문하다(동사원형·현재형)","visits":"방문하다(visit의 ],["dotted","","","선은 점이 찍힌 쪽이라 be dotted(점선으로 되다)."],["that1","","","ensure(보장하다) 뒤 접속사 that(~라는 것)."],["easier","","","make(만들다) + 목적어 + 형용사 easier(더 쉬운)."]],"opts":["shows","showed","to show","to showing"],"or":["shows(보여 주다, 3인칭 단수형): 접속사 없이 동사가 하나 더 생기고, 주어 graphs and charts(그래프와 차트)와 수도 안 맞음.","showed(보여 주었다): 과거형 동사가 접속사 없이 또 오면 문장이 깨짐.","to show(보여 주기 위해): 동사 use(사용하다)가 이미 있고, 색을 쓰는 '목적'을 나타내는 to부정사라 맞음.","to showing(보여 주는 것으로): 여기 to는 to부정사의 to라 -ing가 못 옴."],"point":"정동사 vs. 준동사","en":"This can cause problems, especially when graphs and charts only use colors to show the differences between sets of information.","ko":"이는 특히 그래프와 차트가 정보 세트들 간의 차이를 나타내기 위해 색상만을 사용할 때 문제를 일으킬 수 있다.","hl":["only use colors to show"],"khl":["나타내기 위해 색상만을 사용할 때"],"blocks":[{"t":"p","h":"색만 쓰면 생기는 문제","x":["그래프에서 빨간 선, 초록 선으로만 차이를 보여 준다고 생각해 보자.","색맹인 사람에게는 두 선이 똑같아 보일 수 있다.","when(~할 때) 뒤 작은 문장의 동사는 use(사용하다) 하나.","show(보여 주다)는 to를 달고 '~하기 위해'라는 목적이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I used a map to find the way.","나는 길을 찾기 위해 지도를 사용했다. (to find(찾기 위해) = 목적)"],["She went to the store to buy milk.","그녀는 우유를 사기 위해 가게에 갔다. (to buy(사기 위해) = 목적)"]]}],"post":["동사 use(사용하다) 하나 + 목적은 to 동사원형: use colors to show(보여 주기 위해 색을 쓰다)"]},{"slots":[["to_show","","","목적의 to show(보여 주기 위해)."],["dotted","","","선은 점이 찍힌 쪽이라 be dotted(점선으로 되다)."],["that1","what","a","ensure(보장하다) 뒤 문장 everyone can tell the two lines apart(모두가 두 선을 구별할 수 있다)는 빠진 것 없는 완전한 문장이다. 완전한 문장을 이끄는 건 접속사 that(~라는 것)."],["dont","","","주어 features(특징들)가 복수라 don’t(~하지 않는다)."],["easier","","","make(만들다) + 목적어 + 형용사 easier(더 쉬운)."]],"opts":["whose","where","that","who"],"or":["whose(~의): 앞에 꾸밀 명사도 없고 뒤에 바로 명사가 붙지도 않아 안 됨.","where(~하는 곳): 앞에 장소 명사가 없고, ensure(보장하다)의 목적어를 이끌지 못함.","that(~라는 것): ensure(보장하다)의 목적어가 되는 완전한 문장을 이끄는 접속사라 맞음.","who(~하는 사람): 앞에 사람 명사가 없고 뒤 문장도 완전해서 못 옴."],"point":"that vs. what","en":"This ensures that everyone can tell the two lines apart.","ko":"이는 모든 이가 두 선을 구별할 수 있도록 한다.","hl":["ensures that everyone can tell"],"khl":["모든 이가 두 선을 구별할 수 있도록"],"blocks":[{"t":"p","h":"점선과 실선","x":["해결책: 초록 선은 점선, 파란 선은 실선으로.","색을 못 구별해도 모양으로 구별할 수 있다.","이 덕분에 \"모두가 두 선을 구별할 수 있다\"는 게 보장된다.","뒤 문장이 완전하니 접속사 that(~라는 것). what(~하는 것)은 빈자리가 있어야 쓴다."]},{"t":"pair","h":"쉬운 예시","x":[["Make sure that the door is locked.","문이 꼭 잠기게 해라. (뒤가 완전 → that)"],["This is what I want.","이것이 내가 원하는 것이다. (want(원하다)의 목적어가 빠짐 → what)"]]}],"post":["ensure(보장하다) + that + 완전한 문장: what(~하는 것) 금지"]},{"slots":[["dotted","","","선은 점이 찍힌 쪽이라 be dotted(점선으로 되다)."],["that1","","","ensure(보장하다) 뒤 접속사 that(~라는 것)."],["dont","doesn’t","a","주어는 The accessibility features(접근성 특징들), 복수다. of websites(웹 사이트의)는 꾸며 주는 꼬리표라 주어의 수를 바꾸지 않는다."],["easier","","","make(만들다) + 목적어 + 형용사 easier(더 쉬운)."],["to_navigate","","","easy(쉬운) 뒤 '~하기에'를 더하는 to navigate(탐색하기에)."]],"opts":["don’t","isn’t","aren’t","haven’t"],"or":["don’t(~하지 않는다): 복수 주어 features(특징들)에 맞고, 뒤 동사원형 help(돕다)를 받아서 맞음.","isn’t(~이 아니다): be동사 부정이라 뒤에 동사원형 help(돕다)가 올 수 없고, 수도 안 맞음.","aren’t(~이 아니다): be동사 부정이라 뒤에 동사원형 help(돕다)를 받지 못함.","haven’t(~하지 않았다): 완료형이라 뒤에 과거분사가 와야 하는데 help(돕다)는 원형임."],"point":"수식받는 주어의 수일치","en":"The accessibility features of websites don’t just help people with disabilities.","ko":"웹 사이트의 접근성 특징들은 단지 장애가 있는 사람들만을 돕는 것이 아니다.","hl":["The accessibility features of websites don’t"],"khl":["웹 사이트의 접근성 특징들은"],"blocks":[{"t":"p","h":"글의 결론이 시작되는 문장","x":["지금까지 본 기능들: 대체 텍스트, 자막, 배경 색, 키보드 탐색, 점선.","이 기능들은 장애가 있는 사람만 돕는 게 아니라고 글은 결론 낸다.","주어 The accessibility features(접근성 특징들)는 복수.","그래서 doesn’t(~하지 않는다, 단수형)가 아니라 don’t(~하지 않는다)."]},{"t":"pair","h":"쉬운 예시","x":[["The books on the desk don’t belong to me.","책상 위의 책들은 내 것이 아니다. (books(책들) → don’t(~하지 않는다))"],["The color of the walls doesn’t look good.","벽의 색깔은 보기 좋지 않다. (color(색깔) → doesn’t(~하지 않는다))"]]}],"post":["꼬리표 of websites(웹 사이트의) 떼고 주인 features(특징들) → don’t(~하지 않는다)"]},{"slots":[["that1","","","ensure(보장하다) 뒤 접속사 that(~라는 것)."],["dont","","","복수 주어 features(특징들)라 don’t(~하지 않는다)."],["easier","more it","has visited"],"or":["visiting(방문하는 것): -ing는 혼자 동사 자리에 못 와서 if(만약 ~라면)절에 동사가 없어짐.","to visit(방문하는 것): to부정사도 동사 자리에 못 옴.","visit(방문하다): if(만약 ~라면)절 주어 you(당신)에 맞는 현재형 동사라 맞음.","has visited(방문해 왔다): has(완료형에 쓰는 단수형)는 3인칭 단수 주어용이라 you(당신)와 안 맞음."],"point":"주어-동사 수일치","en":"If you visit the same websites in a different language setting, you will see a different format.","ko":"만약 당신이 동일한 웹 사이트를 다른 언어 설정으로 방문한다면, 당신은 다른 구성 방식을 보게 될 것이다.","hl":["If you visit"],"khl":["방문한다면"],"blocks":[{"t":"p","h":"직접 해 볼 수 있는 실험","x":["같은 웹 사이트라도 언어 설정을 바꾸면 화면 배치가 달라진다.","글은 독자에게 직접 확인해 보라고 권하며 끝난다.","if(만약 ~라면)절은 미래 일도 현재형으로 쓴다: If you visit(방문한다면).","주어 you(당신)라서 visits(방문하다, 3인칭 단수형)가 아니라 visit(방문하다)."]},{"t":"pair","h":"쉬운 예시","x":[["If it rains tomorrow, we will stay home.","내일 비가 오면 우리는 집에 있을 것이다. (it(그것) → rains(비가 오다))"],["If you study hard, you will pass the test.","네가 열심히 공부하면 시험에 합격할 것이다. (you(너) → study(공부하다))"]]}],"post":["if(만약 ~라면)절 주어 you(당신) → visit(방문하다), s 없음"]}],"compquiz":[{"s":"This question is hard ___.","o":["answer","to answer"],"a":1,"ko":"이 질문은 대답하기에 어렵다.","why":"형용사 hard(어려운) + to 동사원형 = ~하기에.","wy":"answer(대답하다): 이미 동사 is(~이다)가 있어 동사원형이 또 올 수 없음."},{"s":"If it ___ tomorrow, we will stay home.","o":["rain","rains"],"a":1,"ko":"내일 비가 오면 우리는 집에 있을 것이다.","why":"if(만약 ~라면)절 주어 it(그것)이 3인칭 단수라 rains(비가 오다).","wy":"rain(비가 오다): 3인칭 단수 주어 it(그것) 뒤 현재형에는 s가 필요함."}]}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
