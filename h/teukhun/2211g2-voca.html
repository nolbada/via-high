ve numbers. People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign.","ko":"그런데도 우리 중 많은 사람은 아직 음수와 완전히 화해하지 못했다. 사람들은 그 두려운 마이너스 기호를 피하려고 온갖 우스꽝스러운 작은 정신적 전략들을 만들어 냈다.","hl":["the dreaded negative sign","haven’t quite made peace"],"khl":["두려운 마이너스 기호","완전히 화해하지 못했다"],"blocks":[{"t":"p","h":"피하는 대상의 표정","x":["sidestep(피하다)은 슬쩍 비켜 가는 것이다.","사람이 비켜 가는 건 무섭거나 싫은 것이다.","beloved(사랑받는)를 넣으면 \"사랑받는 기호를 피하려고 꾀를 짰다\"가 된다.","좋아하는 걸 피하려고 애쓰는 사람은 없다."]},{"t":"p","h":"바로 앞 문장이 깔아 둔 감정","x":["바로 앞 문장은 사람들이 음수와 아직 화해하지 못했다고 한다.","made peace with(~와 화해했다)를 못 한 상대는 껄끄러운 상대다.","그 껄끄러움이 dreaded(두려운)로 이어진다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["coping with(~에 대처하는)는 contending with(~을 상대하는)와 같은 뜻이다.","dodge(피하다)는 sidestep(비켜 가다)과 같은 방향이다.","철자가 낯설어도 뜻이 같으면 맞는 표현."]}],"post":["dreaded(두려운) ↔ beloved(사랑받는)","화해 못 한 상대 = 피하고 싶은 기호"]},{"slots":[["freezing","frigid","s"],["invented"],["often","rarely","a"],["designations"],["unpleasant"]],"opts":["never","often","seldom","scarcely"],"or":["never(결코 ~않는): B1, B2라는 이름이 아예 없다면 기호를 피하는 예시가 되지 못함.","often(흔히): 주차장에서 B1, B2를 흔히 본다는 사실 그대로라 피하기 꾀의 예시가 성립함.","seldom(좀처럼 ~않는): 드문 일이라면 '사람들이 온갖 꾀를 만들었다'는 주장의 증거로 약함.","scarcely(거의 ~않는): 거의 안 쓰는 이름이라면 예시로 꺼낼 이유가 사라짐."],"om":["결코 ~않는","흔히","좀처럼 ~않는","거의 ~않는"],"en":"People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign. … The underground levels in a parking garage often have designations like B1 and B2.","ko":"사람들은 그 두려운 마이너스 기호를 피하려고 온갖 우스꽝스러운 작은 정신적 전략들을 만들어 냈다. … 주차장의 지하층에는 흔히 B1, B2 같은 명칭이 붙어 있다.","hl":["often have designations like B1 and B2","all sorts of funny little mental strategies"],"khl":["흔히 B1, B2 같은 명칭이","온갖 우스꽝스러운 작은 정신적 전략들"],"blocks":[{"t":"p","h":"예시는 흔해야 힘이 있다","x":["필자는 사람들이 온갖 꾀를 만들었다고 주장했다.","그 증거로 주차장을 꺼낸다.","증거가 되려면 B1, B2가 흔히 보여야 한다.","rarely(좀처럼 ~않는)를 넣으면 증거가 스스로 힘을 잃는다.","실제로도 지하 주차장에는 B1, B2가 흔하다."]},{"t":"p","h":"함정","x":["frigid(몹시 추운)는 freezing(얼어붙을 듯한)과 같은 뜻이다.","frigid temperatures(혹독하게 추운 기온)도 자연스러운 짝이다."]}],"post":["often(흔히) ↔ rarely(좀처럼 ~않는)","주차장 B1, B2 = 흔히 보는 피하기 꾀"]},{"slots":[["certainly"],["dreaded"],["losses"],["few","many","a"],["prefer"]],"opts":["countless","few","numerous","frequent"],"or":["countless(셀 수 없이 많은): 예외가 셀 수 없이 많다면 사람들이 음수를 피한다는 주장이 무너짐.","few(몇 안 되는): 앞의 예시들이 모두 기호를 피하는 쪽이라, 기온은 드문 예외라는 말이 맞음.","numerous(수많은): 예외가 수두룩하면 음수와 화해하지 못했다는 앞 문장과 부딪침.","frequent(잦은): 예외가 잦다면 '그때조차 영하 5도를 더 좋아한다'는 말로 이어질 수 없음."],"om":["셀 수 없이 많은","몇 안 되는","수많은","잦은"],"en":"Temperatures are one of the few exceptions: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero.","ko":"기온은 몇 안 되는 예외 중 하나다. 특히 이곳 뉴욕주 이타카에서 사람들은 바깥이 -5도라고 실제로 말한다. 하지만 그때조차 많은 사람은 영하 5도라고 말하는 쪽을 더 좋아한다.","hl":["one of the few exceptions","many prefer to say 5 below zero"],"khl":["몇 안 되는 예외","영하 5도라고 말하는 쪽을"],"blocks":[{"t":"flow","h":"예시 줄 세우기","x":["펀드 내역서: 빨간 글씨, 괄호 → 피함","역사책: 기원전 100년 → 피함","주차장: B1, B2 → 피함","기온: -5도라고 말함 → 예외","그런데 그마저 영하 5도를 더 씀"],"at":3},{"t":"p","h":"many(많은)가 틀린 이유","x":["피하는 예시가 줄줄이 나온 뒤에야 예외가 하나 나온다.","예외가 많다면 필자가 피하기 예시를 이렇게 쌓을 이유가 없다.","게다가 그 예외조차 반쪽짜리다.","though even then(그때조차)이 그걸 보여 준다."]}],"post":["few(몇 안 되는) ↔ many(많은)","기온 = 드문 예외, 그마저 '영하'로 돌려 말함"]},{"slots":[["invented","devised","s"],["printed"],["underground"],["prefer","refuse","a"],["unpleasant","unattractive","s"]],"opts":["prefer","hesitate","fail","hate"],"or":["prefer(더 좋아하다): though even then(그때조차)과 함께 '예외에서도 결국 기호를 피한다'는 흐름을 만들어 맞음.","hesitate(망설이다): 영하 5도라고 말하길 망설인다면 기호를 피하는 쪽이 아니게 되어 흐름과 반대임.","fail(~하지 못하다): 영하 5도라고 말하지 못한다는 건 근거 없는 말이고, 피하기 흐름도 깨짐.","hate(몹시 싫어하다): '영하'라는 말까지 싫어한다면 -5도를 쓰는 셈이라 마지막 문장과 부딪침."],"om":["더 좋아하다","망설이다","~하지 못하다","몹시 싫어하다"],"en":"folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero. There’s something about that negative sign that just looks so unpleasant.","ko":"특히 이곳 뉴욕주 이타카에서 사람들은 바깥이 -5도라고 실제로 말한다. 하지만 그때조차 많은 사람은 영하 5도라고 말하는 쪽을 더 좋아한다. 그 마이너스 기호에는 그저 너무 불쾌해 보이는 무언가가 있다.","hl":["many prefer to say 5 below zero","though even then"],"khl":["더 좋아한다","그때조차"],"blocks":[{"t":"pair","h":"같은 날씨, 두 가지 말","x":[["it’s -5 degrees","-5도다 (기호를 씀)"],["5 below zero","영하 5도 (기호를 안 씀)"]]},{"t":"tap","h":"거꾸로 넣어 보기","q":"refuse(거부하다)를 넣으면 사람들은 결국 어느 쪽으로 말할까?","a":["'영하 5도'를 거부하니 -5도라고 말하게 된다.","그러면 마지막 문장과 부딪친다.","기호가 불쾌해 보인다면서 기호를 쓰는 셈이다."]},{"t":"p","h":"함정","x":["devised(고안한)는 invented(만들어 낸)와 같은 뜻이다.","unattractive(보기 싫은)도 unpleasant(불쾌한)와 같은 방향이다.","둘 다 그대로 두는 게 맞다."]}],"post":["prefer(더 좋아하다) ↔ refuse(거부하다)","-5도보다 '영하 5도' = 끝까지 기호 피하기"]}],"quiz":[{"w":"think","m":"생각하다","it":[["consider","고려하다","s"],["borrow","빌리다","n"],["forget","잊다","a"],["ponder","곰곰이 생각하다","s"],["sweep","쓸다","n"],["ignore","무시하다","a"],["bake","굽다","n"]]},{"w":"dread","m":"몹시 두려워하다","it":[["repair","수리하다","n"],["fear","두려워하다","s"],["welcome","반기다","a"],["invite","초대하다","n"],["be afraid of","~을 무서워하다","s"],["look forward to","~을 고대하다","a"],["measure","측정하다","n"]]},{"w":"often","m":"자주, 흔히","it":[["frequently","자주","s"],["quietly","조용히","n"],["rarely","좀처럼 ~않는","a"],["abroad","해외에","n"],["regularly","정기적으로, 자주","s"],["seldom","좀처럼 ~않는","a"],["sideways","옆으로","n"]]},{"w":"few","m":"(a 없이) 거의 없는, 몇 안 되는","it":[["brave","용감한","n"],["many","많은","a"],["rare","드문","s"],["sticky","끈적끈적한","n"],["numerous","수많은","a"],["scant","얼마 안 되는","s"],["polite","공손한","n"]]},{"w":"prefer","m":"~을 더 좋아하다, 선호하다","it":[["favor","선호하다","s"],["whisper","속삭이다","n"],["dislike","싫어하다","a"],["opt for","~을 택하다","s"],["polish","닦다","n"],["reject","거부하다","a"],["rent","빌리다","n"]]}]}],"no":"33"},{"id":"2211g2-34","title":"어휘특훈 · 22년 11월 고2 34번","sub":"교란 변수와 관찰 연구의 한계","tpl":"Observational studies of humans cannot be properly controlled. Humans live {different} lifestyles and in different environments. {Thus}, they are {insufficiently} {homogeneous} to be {suitable} experimental subjects. These confounding factors {undermine} our ability to draw {sound} causal conclusions from human epidemiological surveys. Confounding factors are variables (known or unknown) that make it difficult for epidemiologists to {isolate} the effects of the specific variable being studied. For example, Taubes {argued} that since many people who drink also smoke, researchers have difficulty determining the link between alcohol consumption and cancer. {Similarly}, researchers in the {famous} Framingham study identified a {significant} correlation between coffee drinking and coronary heart disease. However, most of this correlation {disappeared} once researchers {corrected} for the fact that many coffee drinkers also smoke. If the confounding factors are {known}, it is often {possible} to correct for them. However, if they are unknown, they will undermine the {reliability} of the causal conclusions we draw from epidemiological surveys.","fn":["*observational study: 관찰 연구","*confounding factor: 교란 변수(연구 결과를 헷갈리게 만드는 다른 요인)","*causal: 인과 관계의","*epidemiological: 역학의(질병의 원인과 퍼짐을 연구하는)","*epidemiologist: 역학자","*correlation: 상관관계","*coronary heart disease: 관상 동맥 심장 질환"],"mean":{"different":"다른, 서로 다른","identical":"동일한, 똑같은","Thus":"따라서","Therefore":"그러므로","However":"그러나","insufficiently":"불충분하게, 충분하지 않게","sufficiently":"충분히","homogeneous":"동질적인, 균질한","uniform":"균일한, 한결같은","diverse":"다양한","suitable":"적합한, 알맞은","appropriate":"적절한","undermine":"약화시키다, 손상시키다","weaken":"약화시키다","strengthen":"강화하다","sound":"타당한, 건전한","valid":"타당한, 유효한","flawed":"결함이 있는","isolate":"분리하다, 따로 떼어 내다","separate":"분리하다","combine":"결합하다, 합치다","argued":"동사 argue(주장하다)의 과거형","claimed":"동사 claim(주장하다)의 과거형","Similarly":"마찬가지로","Likewise":"마찬가지로","In contrast":"그와 대조적으로","famous":"유명한","renowned":"유명한, 명성 있는","significant":"상당한, 의미 있는","negligible":"무시해도 될 정도의","disappeared":"동사 disappear(사라지다)의 과거형","vanished":"동사 vanish(사라지다)의 과거형","remained":"동사 remain(남아 있다)의 과거형","corrected":"동사 correct(바로잡다, 보정하다)의 과거형. correct for = ~을 감안해 보정하다","adjusted":"동사 adjust(조정하다)의 과거형. adjust for = ~을 감안해 조정하다","ignored":"동사 ignore(무시하다)의 과거형","known":"알려진. 동사 know(알다)의 과거분사형","unknown":"알려지지 않은","possible":"가능한","feasible":"실현 가능한","impossible":"불가능한","reliability":"신뢰성","credibility":"신뢰성, 믿을 만함"},"comp":[{"no":"34","slots":[["different"],["sound","flawed","a"],["argued"],["disappeared","vanished","s"],["possible"]],"opts":["biased","mistaken","sound","faulty"],"or":["biased(편향된): 편향된 결론을 내는 능력이 약해지는 건 오히려 좋은 일이라 경고가 되지 않음.","mistaken(잘못된): 잘못된 결론을 내는 능력이 약해진다면 교란 변수가 도움을 주는 셈임.","sound(타당한): 교란 변수가 '타당한 결론을 끌어내는 능력'을 약화시킨다는 경고라 맞음.","faulty(결함 있는): 결함 있는 결론을 막아 준다는 말이 되어 글의 문제의식과 반대임."],"om":["편향된","잘못된","타당한","결함 있는"],"en":"These confounding factors undermine our ability to draw sound causal conclusions from human epidemiological surveys.","ko":"이러한 교란 변수는 인간 역학 조사로부터 타당한 인과적 결론을 끌어내는 우리의 능력을 약화시킨다.","hl":["draw sound causal conclusions","undermine our ability"],"khl":["타당한 인과적 결론을","약화시킨다"],"blocks":[{"t":"p","h":"약화시키는 대상은 좋은 것","x":["undermine(약화시키다) 뒤에는 지켜야 할 좋은 것이 와야 경고가 된다.","지켜야 할 것은 타당한 결론을 내는 능력이다.","flawed(결함이 있는)를 넣으면 결함 있는 결론을 내는 능력이 약해진다.","교란 변수가 오히려 고마운 존재가 된다."]},{"t":"p","h":"sound(타당한)의 다른 얼굴","x":["sound(소리)라는 명사로 읽으면 뜻이 안 풀린다.","여기서는 형용사로 '타당한, 건전한'이다.","a sound decision(현명한 결정)처럼 쓰인다.","vanished(사라졌다)는 disappeared(사라졌다)와 같은 뜻이라 그대로 둔다."]}],"post":["sound(타당한) ↔ flawed(결함이 있는)","교란 변수 = 타당한 결론을 흐리는 방해꾼"]},{"no":"34","slots":[["Thus"],["suitable"],["isolate","combine","a"],["famous"],["reliability"]],"opts":["isolate","merge","blend","double"],"or":["isolate(따로 떼어 내다): 담배가 섞여 있어서 술만의 영향을 떼어 보기 어렵다는 뒤 예시와 맞음.","merge(합치다): 교란 변수는 영향을 이미 섞어 놓는 쪽이라, 합치기 어렵게 만든다는 말과 반대임.","blend(섞다): 영향이 섞여서 문제인데 섞기 어렵다는 건 거꾸로 된 말임.","double(두 배로 하다): 영향을 두 배로 만드는 일은 글 어디에도 나오지 않음."],"om":["따로 떼어 내다","합치다","섞다","두 배로 하다"],"en":"Confounding factors are variables (known or unknown) that make it difficult for epidemiologists to isolate the effects of the specific variable being studied.","ko":"교란 변수란 역학자가 연구 중인 특정 변수의 영향만 따로 떼어 내기 어렵게 만드는 (알려졌거나 알려지지 않은) 변수다.","hl":["isolate the effects of the specific variable","make it difficult"],"khl":["따로 떼어 내기","어렵게 만드는"],"blocks":[{"t":"p","h":"정의 다음엔 예시","x":["교란 변수의 정의 바로 뒤에 술과 담배 예시가 나온다.","술 마시는 사람이 담배도 피운다.","암이 생겼을 때 술 탓인지 담배 탓인지 떼어 보기 어렵다.","그게 isolate(따로 떼어 내다)가 어렵다는 말이다."]},{"t":"p","h":"combine(합치다)이 거꾸로인 이유","x":["교란 변수는 두 영향을 이미 한데 섞어 놓는다.","섞인 걸 푸는 게 어렵지, 합치는 게 어려운 게 아니다.","combine(합치다)을 넣으면 문제의 방향이 뒤집힌다."]}],"post":["isolate(따로 떼어 내다) ↔ combine(합치다)","술 탓? 담배 탓? = 떼어 보기 어려운 영향"]}],"compquiz":[{"w":"sound","m":"타당한, 건전한","it":[["valid","타당한","s"],["hungry","배고픈","n"],["flawed","결함이 있는","a"],["solid","견실한, 탄탄한","s"],["rural","시골의","n"],["faulty","잘못된, 결함 있는","a"],["polite","공손한","n"]]},{"w":"isolate","m":"분리하다, 따로 떼어 내다","it":[["borrow","빌리다","n"],["separate","분리하다","s"],["combine","결합하다","a"],["polish","닦다","n"],["detach","떼어 내다","s"],["merge","합치다","a"],["whisper","속삭이다","n"]]}],"sets":[{"items":[{"slots":[["different","identical","a"],["suitable"],["sound"],["famous"],["known"]],"opts":["similar","matching","standard","different"],"or":["similar(비슷한): 생활 방식이 비슷하다면 '충분히 동질적이지 않다'는 결론으로 이어질 수 없음.","matching(똑같이 맞춘): 생활 방식이 서로 맞춰져 있다면 통제가 쉬워져 첫 문장과 부딪침.","standard(표준적인): 모두 표준적인 생활을 한다면 오히려 실험 대상으로 알맞아짐.","different(서로 다른): 사람마다 사는 방식이 달라서 실험 대상으로 알맞지 않다는 다음 문장의 원인이 되어 맞음."],"om":["비슷한","똑같이 맞춘","표준적인","서로 다른"],"en":"Observational studies of humans cannot be properly controlled. Humans live different lifestyles and in different environments. Thus, they are insufficiently homogeneous to be suitable experimental subjects.","ko":"인간에 대한 관찰 연구는 제대로 통제될 수 없다. 인간은 서로 다른 생활 방식으로, 서로 다른 환경에서 산다. 따라서 인간은 적절한 실험 대상이 될 만큼 충분히 동질적이지 않다.","hl":["live different lifestyles","insufficiently homogeneous"],"khl":["서로 다른 생활 방식","충분히 동질적이지 않다"],"blocks":[{"t":"flow","h":"원인에서 결론까지","x":["사람마다 생활 방식과 환경이 다르다","그래서 사람들끼리 충분히 비슷하지 않다","그래서 실험 대상으로 알맞지 않다","그래서 관찰 연구를 제대로 통제할 수 없다"],"at":0},{"t":"p","h":"identical(똑같은)을 넣으면","x":["\"사람들은 똑같은 생활 방식으로 산다.\"","그런데 바로 다음이 Thus(따라서), 충분히 비슷하지 않다.","똑같이 사는데 비슷하지 않다는 결론은 나올 수 없다.","원인과 결과가 끊어진다."]}],"post":["different(서로 다른) ↔ identical(똑같은)","사람마다 다른 생활 = 통제 안 되는 실험"]},{"slots":[["homogeneous","uniform","s"],["undermine","strengthen","a"],["isolate","separate","s"],["Similarly"],["possible"]],"opts":["undermine","enhance","boost","guarantee"],"or":["undermine(약화시키다): 교란 변수가 결론을 흐린다는 글 전체의 문제의식과 맞음.","enhance(높이다): 교란 변수가 결론 내는 능력을 높인다면 마지막 문장의 '신뢰성을 떨어뜨린다'와 부딪침.","boost(북돋우다): 교란 변수가 도움이 된다는 말이 되어 흡연 때문에 결과가 헷갈린 예시와 반대임.","guarantee(보장하다): 교란 변수가 타당한 결론을 보장한다면 연구자가 그걸 보정할 이유가 없음."],"om":["약화시키다","높이다","북돋우다","보장하다"],"en":"These confounding factors undermine our ability to draw sound causal conclusions from human epidemiological surveys.","ko":"이러한 교란 변수는 인간 역학 조사로부터 타당한 인과적 결론을 끌어내는 우리의 능력을 약화시킨다.","hl":["undermine our ability","These confounding factors"],"khl":["능력을 약화시킨다","이러한 교란 변수"],"blocks":[{"t":"pair","h":"글의 앞과 끝에 같은 동사","x":[["These confounding factors undermine our ability","교란 변수는 우리의 능력을 약화시킨다 (앞)"],["they will undermine the reliability","그것은 신뢰성을 떨어뜨릴 것이다 (끝)"]]},{"t":"p","h":"strengthen(강화하다)이 안 되는 이유","x":["교란 변수는 결과를 헷갈리게 만드는 다른 요인이다.","술과 암의 관계를 보려는데 담배가 끼어드는 식이다.","끼어든 요인이 결론을 더 단단하게 해 줄 리 없다.","글 끝에서도 같은 동사 undermine(약화시키다)이 다시 나온다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["uniform(균일한)은 homogeneous(동질적인)와 같은 뜻이다.","separate(분리하다)도 isolate(따로 떼어 내다)와 같은 일을 한다.","둘 다 문장의 뜻을 그대로 지킨다."]}],"post":["undermine(약화시키다) ↔ strengthen(강화하다)","끼어든 담배 = 결론을 흐리는 교란 변수"]},{"slots":[["insufficiently"],["argued","claimed","s"],["significant","negligible","a"],["corrected"],["reliability"]],"opts":["minor","trivial","significant","slight"],"or":["minor(사소한): 처음부터 작은 관계였다면 '대부분 사라졌다'는 반전이 의미가 없음.","trivial(하찮은): 하찮은 관계였다면 유명한 연구의 결과로 내세울 이유가 없음.","significant(상당한): 처음엔 커피와 심장병이 꽤 강하게 묶여 보였다가 However(그러나) 뒤에서 대부분 사라지는 반전이라 맞음.","slight(약간의): 약한 관계였다면 However(그러나)로 뒤집을 거리가 없음."],"om":["사소한","하찮은","상당한","약간의"],"en":"Similarly, researchers in the famous Framingham study identified a significant correlation between coffee drinking and coronary heart disease. However, most of this correlation disappeared once researchers corrected for the fact that many coffee drinkers also smoke.","ko":"마찬가지로 유명한 Framingham 연구의 연구자들은 커피 마시기와 관상 동맥 심장 질환 사이에서 상당한 상관관계를 확인했다. 그러나 커피를 마시는 많은 사람이 담배도 피운다는 사실을 연구자들이 보정하자 이 상관관계의 대부분이 사라졌다.","hl":["a significant correlation","most of this correlation disappeared"],"khl":["상당한 상관관계","대부분이 사라졌다"],"blocks":[{"t":"p","h":"However(그러나)가 뒤집는 것","x":["처음 결과: 커피와 심장병 사이에 상당한 관계가 보였다.","However(그러나), 담배를 감안하자 대부분 사라졌다.","뒤집으려면 처음 것이 커야 한다.","negligible(무시해도 될 정도의)이면 사라질 것도 없다."]},{"t":"tap","h":"질문 하나","q":"커피와 심장병이 처음에 왜 묶여 보였을까?","a":["커피를 마시는 사람 중에 담배를 피우는 사람이 많았다.","심장병의 진짜 원인은 담배 쪽이었다.","커피는 담배 옆에 서 있다가 누명을 쓴 셈이다."]},{"t":"p","h":"함정","x":["claimed(주장했다)는 argued(주장했다)와 같은 뜻이라 고치지 않는다."]}],"post":["significant(상당한) ↔ negligible(무시해도 될 정도의)","커피 = 담배 옆에서 누명 쓴 범인"]},{"slots":[["Thus"],["sound"],["famous"],["corrected","ignored","a"],["known"]],"opts":["overlooked","denied","corrected","doubted"],"or":["overlooked(간과했다): 흡연 사실을 놓쳤다면 상관관계가 그대로 남았어야 함.","denied(부인했다): 사실을 부인한다고 계산 결과가 바뀌지는 않음.","corrected(보정했다): 담배의 영향을 따로 빼고 계산하자 커피의 관계가 사라졌다는 흐름이라 맞음.","doubted(의심했다): 의심만 해서는 상관관계가 사라질 수 없고, 다음 문장의 correct for(보정하다)와도 이어지지 않음."],"om":["간과했다","부인했다","보정했다","의심했다"],"en":"However, most of this correlation disappeared once researchers corrected for the fact that many coffee drinkers also smoke. If the confounding factors are known, it is often possible to correct for them.","ko":"그러나 커피를 마시는 많은 사람이 담배도 피운다는 사실을 연구자들이 보정하자 이 상관관계의 대부분이 사라졌다. 교란 변수가 알려져 있다면 그것을 보정하는 것이 대개 가능하다.","hl":["corrected for the fact","it is often possible to correct for them"],"khl":["보정하자","보정하는 것이 대개 가능하다"],"blocks":[{"t":"p","h":"correct for(~을 감안해 보정하다)가 하는 일","x":["보정이란 끼어든 요인의 몫을 계산에서 빼는 것이다.","담배 피우는 몫을 빼고 커피만 남겨 본다.","그러자 관계 대부분이 사라졌다.","ignored(무시했다)를 넣으면 담배를 빼지 않은 셈이다.","그러면 관계는 그대로 남았어야 한다."]},{"t":"pair","h":"바로 뒤 문장과 이어 보기","x":[["corrected for the fact","그 사실을 보정했다 (프레이밍엄 연구 사례)"],["possible to correct for them","교란 변수를 보정할 수 있다 (일반 원리)"]]}],"post":["corrected(보정했다) ↔ ignored(무시했다)","담배 몫 빼고 보기 = 보정"]},{"slots":[["suitable","appropriate","s"],["undermine"],["disappeared"],["possible","impossible","a"],["reliability","credibility","s"]],"opts":["pointless","possible","risky","illegal"],"or":["pointless(무의미한): 커피 사례에서 보정이 결과를 바로잡았으니 무의미하다는 말과 부딪침.","possible(가능한): 알려진 교란 변수는 보정할 수 있다는 말이 바로 앞 커피 사례로 증명되어 맞음.","risky(위험한): 보정이 위험하다는 근거는 글 어디에도 없음.","illegal(불법인): 연구 방법이 가능한지를 말하는 자리에 법 이야기는 어울리지 않음."],"om":["무의미한","가능한","위험한","불법인"],"en":"If the confounding factors are known, it is often possible to correct for them. However, if they are unknown, they will undermine the reliability of the causal conclusions we draw from epidemiological surveys.","ko":"교란 변수가 알려져 있다면 그것을 보정하는 것이 대개 가능하다. 그러나 그것이 알려져 있지 않다면, 그것은 우리가 역학 조사에서 끌어내는 인과적 결론의 신뢰성을 떨어뜨릴 것이다.","hl":["it is often possible to correct for them","However, if they are unknown"],"khl":["보정하는 것이 대개 가능하다","그러나 그것이 알려져 있지 않다면"],"blocks":[{"t":"pair","h":"If ~, However, if ~ 짝","x":[["If the confounding factors are known","알려져 있으면 → 보정할 수 있다"],["However, if they are unknown","알려져 있지 않으면 → 결론이 흔들린다"]]},{"t":"p","h":"impossible(불가능한)을 넣으면","x":["알려져 있어도 보정 불가, 알려져 있지 않아도 결론이 흔들린다.","두 경우가 다 나쁜 소식이 된다.","그럼 However(그러나)로 맞설 이유가 없다.","게다가 바로 앞 커피 사례에서 보정은 실제로 해냈다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","appropriate(적절한)는 suitable(적합한) 자리에, credibility(신뢰성)는 reliability(신뢰성) 자리에 그대로 들어간다.","고칠 단어는 하나뿐."]}],"post":["possible(가능한) ↔ impossible(불가능한)","아는 변수 = 보정 가능, 모르는 변수 = 결론 흔들림"]}],"quiz":[{"w":"different","m":"다른, 서로 다른","it":[["brave","용감한","n"],["distinct","뚜렷이 다른","s"],["identical","동일한","a"],["sticky","끈적끈적한","n"],["dissimilar","같지 않은","s"],["similar","비슷한","a"],["fragile","깨지기 쉬운","n"]]},{"w":"undermine","m":"약화시키다, 손상시키다","it":[["weaken","약화시키다","s"],["borrow","빌리다","n"],["strengthen","강화하다","a"],["sweep","쓸다","n"],["impair","손상시키다","s"],["reinforce","강화하다","a"],["whisper","속삭이다","n"]]},{"w":"significant","m":"상당한, 의미 있는","it":[["wooden","나무로 된","n"],["considerable","상당한","s"],["negligible","무시해도 될 정도의","a"],["polite","공손한","n"],["substantial","상당한","s"],["trivial","사소한","a"],["rural","시골의","n"]]},{"w":"correct","m":"바로잡다, 보정하다","it":[["adjust","조정하다","s"],["invite","초대하다","n"],["spoil","망치다","a"],["rectify","바로잡다","s"],["knit","뜨개질하다","n"],["damage","손상시키다","a"],["bake","굽다","n"]]},{"w":"possible","m":"가능한","it":[["feasible","실현 가능한","s"],["noisy","시끄러운","n"],["impossible","불가능한","a"],["ancient","고대의","n"],["achievable","성취할 수 있는","s"],["unattainable","도달할 수 없는","a"],["humble","겸손한","n"]]}]},{"items":[{"slots":[["different"],["insufficiently","sufficiently","a"],["isolate"],["significant"],["possible"]],"opts":["insufficiently","perfectly","highly","remarkably"],"or":["insufficiently(불충분하게): 사람마다 사는 모습이 달라서 실험 대상끼리 충분히 비슷하지 않다는 뜻이라 맞음.","perfectly(완벽하게): 완벽하게 동질적이면 실험 대상으로 딱 좋아 첫 문장과 부딪침.","highly(매우): 매우 동질적이라면 앞 문장의 '서로 다른 생활 방식'과 맞지 않음.","remarkably(놀라울 만큼): 놀라울 만큼 비슷하다면 통제가 안 된다는 결론이 나오지 않음."],"om":["불충분하게","완벽하게","매우","놀라울 만큼"],"en":"Thus, they are insufficiently homogeneous to be suitable experimental subjects.","ko":"따라서 인간은 적절한 실험 대상이 될 만큼 충분히 동질적이지 않다.","hl":["insufficiently homogeneous","to be suitable experimental subjects"],"khl":["충분히 동질적이지 않다","적절한 실험 대상이 될"],"blocks":[{"t":"tap","h":"실험실과 비교하기","q":"실험 쥐 100마리는 왜 실험 대상으로 좋을까?","a":["같은 먹이, 같은 우리, 같은 하루를 산다.","조건이 똑같으니 차이 하나만 비교할 수 있다.","사람은 그렇지 않다. 먹는 것도 사는 곳도 제각각이다."]},{"t":"p","h":"sufficiently(충분히)를 넣으면","x":["\"사람들은 실험 대상이 될 만큼 충분히 비슷하다.\"","앞 문장은 사람마다 생활 방식도 환경도 다르다고 했다.","첫 문장은 사람 연구는 제대로 통제할 수 없다고 했다.","앞의 두 문장과 모두 부딪친다."]}],"post":["insufficiently(불충분하게) ↔ sufficiently(충분히)","제각각인 사람 = 실험 쥐처럼 맞출 수 없음"]},{"slots":[["Thus","Therefore","s"],["homogeneous"],["Similarly","In contrast","a"],["famous","renowned","s"],["corrected"]],"opts":["Instead","Nevertheless","Otherwise","Similarly"],"or":["Instead(대신에): 앞 예시를 버리고 다른 걸 택하는 말인데, 두 예시는 나란히 서 있음.","Nevertheless(그럼에도 불구하고): 앞 내용과 맞서는 말인데, 커피 사례는 앞 내용을 뒷받침함.","Otherwise(그렇지 않으면): 조건을 뒤집는 말이라 예시를 이어 붙이는 자리와 맞지 않음.","Similarly(마찬가지로): 술·담배 예시에 이어 커피·담배라는 같은 모양의 예시를 하나 더 드는 자리라 맞음."],"om":["대신에","그럼에도 불구하고","그렇지 않으면","마찬가지로"],"en":"For example, Taubes argued that since many people who drink also smoke, researchers have difficulty determining the link between alcohol consumption and cancer. Similarly, researchers in the famous Framingham study identified a significant correlation between coffee drinking and coronary heart disease.","ko":"예를 들어 Taubes는 술을 마시는 많은 사람이 담배도 피우기 때문에 연구자들이 음주와 암 사이의 연관성을 밝히는 데 어려움을 겪는다고 주장했다. 마찬가지로 유명한 Framingham 연구의 연구자들은 커피 마시기와 관상 동맥 심장 질환 사이에서 상당한 상관관계를 확인했다.","hl":["Similarly","since many people who drink also smoke"],"khl":["마찬가지로","술을 마시는 많은 사람이 담배도 피우기 때문에"],"blocks":[{"t":"pair","h":"두 예시를 나란히","x":[["drink + smoke","술 + 담배 → 암과의 관계가 헷갈림"],["coffee + smoke","커피 + 담배 → 심장병과의 관계가 헷갈림"]]},{"t":"p","h":"In contrast(그와 대조적으로)가 틀린 이유","x":["두 예시는 모양이 똑같다.","무언가를 마시는 사람이 담배도 피워서 결과가 섞인다.","같은 모양의 예시를 잇는 말은 Similarly(마찬가지로)다.","In contrast(그와 대조적으로)는 반대 사례를 꺼낼 때 쓴다."]},{"t":"p","h":"함정","x":["Therefore(그러므로)는 Thus(따라서)와, renowned(명성 있는)는 famous(유명한)와 같은 뜻이다.","이 둘을 고쳤다면 본문 모양만 외운 것."]}],"post":["Similarly(마찬가지로) ↔ In contrast(그와 대조적으로)","술+담배, 커피+담배 = 같은 모양의 두 예시"]},{"slots":[["sound","valid","s"],["argued"],["significant"],["disappeared","remained","a"],["known"]],"opts":["persisted","doubled","grew","disappeared"],"or":["persisted(지속됐다): 관계가 그대로라면 However(그러나)로 시작할 이유가 없음.","doubled(두 배가 됐다): 담배를 빼자 관계가 더 커진다는 건 교란 변수 설명과 반대임.","grew(커졌다): 담배가 원인이었다는 흐름과 맞지 않음.","disappeared(사라졌다): 담배의 몫을 빼자 커피와 심장병의 관계가 대부분 없어졌다는 반전이라 맞음."],"om":["지속됐다","두 배가 됐다","커졌다","사라졌다"],"en":"However, most of this correlation disappeared once researchers corrected for the fact that many coffee drinkers also smoke.","ko":"그러나 커피를 마시는 많은 사람이 담배도 피운다는 사실을 연구자들이 보정하자 이 상관관계의 대부분이 사라졌다.","hl":["most of this correlation disappeared","However"],"khl":["대부분이 사라졌다","그러나"],"blocks":[{"t":"flow","h":"커피 사건의 순서","x":["커피를 많이 마시는 사람에게 심장병이 많아 보였다","그런데 그 사람들 중 상당수가 담배를 피웠다","담배의 몫을 빼고 다시 계산했다","커피와 심장병의 관계가 대부분 사라졌다"],"at":3},{"t":"p","h":"remained(남아 있었다)를 넣으면","x":["담배를 빼도 관계가 그대로 남았다는 말이 된다.","그러면 커피가 진짜 원인일 수도 있다는 뜻이다.","교란 변수가 결과를 흐린다는 예시로 쓸 수 없다.","However(그러나)도 뒤집을 거리를 잃는다."]},{"t":"p","h":"함정","x":["valid(타당한)는 sound(타당한)와 뜻이 같다.","sound(소리)라는 뜻만 떠올리면 헷갈리는 단어다."]}],"post":["disappeared(사라졌다) ↔ remained(남아 있었다)","담배 빼고 보니 커피는 무죄"]},{"slots":[["suitable"],["undermine"],["Similarly"],["disappeared"],["known","unknown","a"]],"opts":["known","hidden","unclear","unnoticed"],"or":["known(알려진): 무엇이 끼어들었는지 알아야 그걸 빼고 계산할 수 있어 맞음.","hidden(숨겨진): 숨겨진 변수라면 무엇을 빼야 할지 몰라 보정할 수 없음.","unclear(불분명한): 정체가 불분명하면 뒤 문장과 같은 쪽이 되어 However(그러나)의 대비가 깨짐.","unnoticed(눈에 띄지 않은): 눈치채지 못한 변수는 빼고 계산할 수 없음."],"om":["알려진","숨겨진","불분명한","눈에 띄지 않은"],"en":"If the confounding factors are known, it is often possible to correct for them. However, if they are unknown, they will undermine the reliability of the causal conclusions we draw from epidemiological surveys.","ko":"교란 변수가 알려져 있다면 그것을 보정하는 것이 대개 가능하다. 그러나 그것이 알려져 있지 않다면, 그것은 우리가 역학 조사에서 끌어내는 인과적 결론의 신뢰성을 떨어뜨릴 것이다.","hl":["If the confounding factors are known","if they are unknown"],"khl":["교란 변수가 알려져 있다면","그것이 알려져 있지 않다면"],"blocks":[{"t":"tap","h":"앞 사례로 돌아가기","q":"커피 연구자들은 무엇을 알았기에 보정할 수 있었을까?","a":["커피를 마시는 사람 중 상당수가 담배를 피운다는 것.","끼어든 요인이 담배라는 걸 알았다.","알아야 뺄 수 있다."]},{"t":"p","h":"unknown(알려지지 않은)을 넣으면","x":["\"알려지지 않으면 보정할 수 있다. 그러나 알려지지 않으면 결론이 흔들린다.\"","같은 조건에서 반대 결과가 나온다.","However(그러나) 앞뒤는 반대 조건이어야 한다.","known(알려진)과 unknown(알려지지 않은)의 짝이 이 두 문장의 뼈대다."]}],"post":["known(알려진) ↔ unknown(알려지지 않은)","알아야 뺄 수 있는 교란 변수"]},{"slots":[["homogeneous","diverse","a"],["undermine","weaken","s"],["isolate"],["corrected","adjusted","s"],["reliability"]],"opts":["varied","homogeneous","complex","unique"],"or":["varied(다양한): '충분히 다양하지 않다'가 되어 서로 다른 생활 방식이라는 앞 문장과 부딪침.","homogeneous(동질적인): 사람마다 다르게 살아서 '충분히 비슷하지 않다'는 결론이라 맞음.","complex(복잡한): '충분히 복잡하지 않아 실험 대상이 못 된다'는 말은 근거가 없음.","unique(독특한): 사람이 충분히 독특하지 않다는 건 '사람마다 다르다'는 앞 문장과 반대임."],"om":["다양한","동질적인","복잡한","독특한"],"en":"Humans live different lifestyles and in different environments. Thus, they are insufficiently homogeneous to be suitable experimental subjects.","ko":"인간은 서로 다른 생활 방식으로, 서로 다른 환경에서 산다. 따라서 인간은 적절한 실험 대상이 될 만큼 충분히 동질적이지 않다.","hl":["insufficiently homogeneous","different lifestyles"],"khl":["충분히 동질적이지 않다","서로 다른 생활 방식"],"blocks":[{"t":"p","h":"단어 쪼개 보기","x":["homo-(같은) + -geneous(종류의) = 같은 종류로 이루어진.","반대말 heterogeneous(이질적인)의 hetero-(다른)와 짝을 이룬다.","이 문장은 사람들이 같은 종류라 하기엔 너무 다르다는 말이다."]},{"t":"p","h":"diverse(다양한)를 넣으면","x":["\"사람들은 다르게 산다. 따라서 충분히 다양하지 않다.\"","다르게 산다면서 다양하지 않다고 하는 모순이다.","Thus(따라서)는 앞말의 결과를 이어야 한다."]},{"t":"p","h":"함정","x":["weaken(약화시키다)은 undermine(약화시키다)과, adjusted for(~을 감안해 조정했다)는 corrected for(~을 감안해 보정했다)와 같은 뜻이다.","둘 다 그대로 맞는 표현."]}],"post":["homogeneous(동질적인) ↔ diverse(다양한)","제각각인 사람들 = 같은 종류로 묶기 어려움"]}],"quiz":[{"w":"insufficiently","m":"불충분하게","it":[["inadequately","불충분하게","s"],["loudly","큰 소리로","n"],["sufficiently","충분히","a"],["abroad","해외에","n"],["poorly","불충분하게, 형편없이","s"],["adequately","충분히, 적절히","a"],["upstairs","위층에","n"]]},{"w":"similarly","m":"마찬가지로","it":[["nearby","근처에","n"],["likewise","마찬가지로","s"],["conversely","반대로","a"],["overnight","밤사이에","n"],["equally","똑같이","s"],["differently","다르게","a"],["sideways","옆으로","n"]]},{"w":"disappear","m":"사라지다","it":[["vanish","사라지다","s"],["polish","닦다","n"],["appear","나타나다","a"],["rent","빌리다","n"],["fade","희미해지다, 사라지다","s"],["emerge","나타나다","a"],["bake","굽다","n"]]},{"w":"known","m":"알려진","it":[["sticky","끈적끈적한","n"],["familiar","잘 알려진, 익숙한","s"],["unknown","알려지지 않은","a"],["brave","용감한","n"],["recognized","인정된, 알려진","s"],["obscure","잘 알려지지 않은","a"],["hollow","속이 빈","n"]]},{"w":"homogeneous","m":"동질적인, 균질한","it":[["uniform","균일한","s"],["punctual","시간을 잘 지키는","n"],["heterogeneous","이질적인","a"],["edible","먹을 수 있는","n"],["alike","비슷한","s"],["diverse","다양한","a"],["loyal","충실한","n"]]}]}],"no":"34"},{"id":"2211g2-35","title":"어휘특훈 · 22년 11월 고2 35번","sub":"숨어 버리는 감정, 질투","tpl":"Of all the human emotions, none is trickier or more {elusive} than envy. It is very difficult to actually {discern} the envy that {motivates} people’s actions. The reason for this elusiveness is {simple}: we almost never {directly} {express} the envy we are feeling. Envy {entails} the {admission} to ourselves that we are {inferior} to another person in something we {value}. Not only is it {painful} to {admit} this inferiority, but it is even {worse} for others to see that we are feeling this. And so almost as soon as we experience the {initial} feelings of envy, we are motivated to {disguise} it to ourselves — it is not envy we feel but {unfairness} at the {distribution} of goods or attention, {resentment} at this unfairness, even anger.","fn":["*elusiveness: 붙잡기 어려움, 알아채기 힘듦","*inferiority: 열등함, 남보다 못함"],"mean":{"elusive":"붙잡기 어려운, 알아채기 힘든","obvious":"뻔한, 분명한","discern":"알아보다, 분별하다","detect":"감지하다, 알아내다","overlook":"간과하다, 못 보고 넘어가다","motivates":"동사 motivate(동기를 부여하다, 움직이게 하다)의 3인칭 단수 현재형","drives":"동사 drive(몰아가다, 움직이게 하다)의 3인칭 단수 현재형","simple":"간단한","straightforward":"간단한, 복잡하지 않은","directly":"직접, 대놓고","openly":"드러내 놓고, 공공연히","express":"표현하다, 드러내다","reveal":"드러내다, 밝히다","conceal":"숨기다","entails":"동사 entail(수반하다)의 3인칭 단수 현재형","involves":"동사 involve(포함하다, 수반하다)의 3인칭 단수 현재형","excludes":"동사 exclude(배제하다)의 3인칭 단수 현재형","admission":"인정, 시인","acknowledgment":"인정","denial":"부인, 부정","inferior":"(~보다) 못한, 열등한","superior":"(~보다) 우월한, 나은","value":"소중히 여기다","cherish":"소중히 여기다, 아끼다","painful":"고통스러운","pleasant":"즐거운, 기분 좋은","admit":"인정하다","confess":"고백하다, 털어놓다","worse":"형용사 bad(나쁜)의 비교급, 더 나쁜","better":"형용사 good(좋은)의 비교급, 더 좋은","initial":"처음의, 초기의","first":"처음의, 첫","final":"마지막의","disguise":"위장하다, 감추다","expose":"드러내다, 폭로하다","unfairness":"불공평함","satisfaction":"만족","distribution":"분배, 나눠 줌","allocation":"배분, 할당","resentment":"분개, 억울함","bitterness":"억울함, 쓰라림","gratitude":"감사"},"comp":[{"no":"35","slots":[["discern","overlook","a"],["simple"],["entails","involves","s"],["value"],["admit"]],"opts":["imitate","reward","discern","forgive"],"or":["imitate(흉내 내다): 질투를 흉내 내기 어렵다는 말은 뒤에 나오는 '드러내지 않아서'라는 이유와 이어지지 않음.","reward(보상하다): 질투에 상을 준다는 말은 글의 주제와 아무 관련이 없음.","discern(알아보다): 바로 다음 문장이 this elusiveness(이렇게 붙잡기 어려움)라고 받으니 '알아보기 어렵다'가 맞음.","forgive(용서하다): 이 글은 질투를 용서하는 문제가 아니라 질투가 눈에 안 띄는 문제를 다룸."],"om":["흉내 내다","보상하다","알아보다","용서하다"],"en":"It is very difficult to actually discern the envy that motivates people’s actions. The reason for this elusiveness is simple","ko":"사람들의 행동을 움직이는 질투를 실제로 알아보기는 매우 어렵다. 이렇게 붙잡기 어려운 이유는 간단하다","hl":["very difficult to actually discern","this elusiveness"],"khl":["실제로 알아보기는 매우 어렵다","이렇게 붙잡기 어려운"],"blocks":[{"t":"pair","h":"뒷문장이 앞 내용을 한 단어로 받는다","x":[["very difficult to actually discern the envy","질투를 실제로 알아보기는 매우 어렵다"],["this elusiveness","이렇게 붙잡기 어려움"]]},{"t":"p","h":"overlook(간과하다)을 넣어 보면","x":["\"질투를 못 보고 넘어가기가 매우 어렵다\"가 된다.","그러면 질투는 눈에 확 띄는 감정이 된다.","그런데 바로 뒤에서 this elusiveness(이렇게 붙잡기 어려움)라고 받는다.","눈에 확 띄는 것을 붙잡기 어렵다고 할 수는 없다."]},{"t":"p","h":"그대로 둘 단어","x":["involves(포함하다)는 entails(수반하다)와 같은 방향이다.","\"질투에는 열등함의 인정이 따른다\"는 뜻이 그대로 살아 있다."]}],"post":["discern(알아보다) ↔ overlook(간과하다)","질투 = 눈앞에 있어도 잘 안 보이는 감정"]},{"no":"35","slots":[["inferior"],["painful"],["disguise"],["unfairness","satisfaction","a"],["resentment","bitterness","s"]],"opts":["pride","joy","unfairness","comfort"],"or":["pride(자부심): 재물·관심이 나뉜 방식에 자부심을 느낀다면 뒤의 분개와 분노로 이어지지 않음.","joy(기쁨): 기쁨은 질투를 위장한 '불만' 목록에 들어갈 수 없음.","unfairness(불공평함): 바로 뒤 this unfairness(이 불공평함)가 가리키는 말이라 반드시 앞에 있어야 함.","comfort(편안함): 편안함 다음에 곧바로 분개·분노가 오는 건 앞뒤가 맞지 않음."],"om":["자부심","기쁨","불공평함","편안함"],"en":"it is not envy we feel but unfairness at the distribution of goods or attention, resentment at this unfairness, even anger","ko":"우리가 느끼는 건 질투가 아니라 재물이나 관심이 나뉜 방식에 대한 불공평함, 이 불공평함에 대한 분개, 심지어 분노라는 것이다","hl":["unfairness at the distribution","resentment at this unfairness"],"khl":["나뉜 방식에 대한 불공평함","이 불공평함에 대한 분개"],"blocks":[{"t":"flow","h":"점점 세지는 감정 목록","x":["불공평하다는 느낌","그 불공평함에 대한 분개","심지어 분노"],"at":0},{"t":"p","h":"this(이)가 가리키는 말 찾기","x":["this unfairness(이 불공평함)는 앞에 이미 나온 불공평함을 가리킨다.","satisfaction(만족)을 넣으면 앞에 불공평함이 사라진다.","this(이)가 가리킬 말이 없어진다.","게다가 만족 다음에 분개와 분노가 이어지는 건 말이 안 된다."]},{"t":"p","h":"bitterness(억울함)는 그대로","x":["bitterness(억울함, 쓰라림)는 resentment(분개)와 같은 쪽 감정이다.","불만 → 억울함 → 분노로 점점 세지는 흐름이 그대로 유지된다."]}],"post":["unfairness(불공평함) ↔ satisfaction(만족)","질투의 가면 = 불공평하다는 불만"]}],"compquiz":[{"w":"discern","m":"알아보다, 분별하다","it":[["bake","굽다","n"],["detect","감지하다","s"],["overlook","간과하다","a"],["swim","수영하다","n"],["perceive","인지하다, 알아차리다","s"],["miss","놓치다","a"],["fold","접다","n"]]},{"w":"unfairness","m":"불공평함","it":[["injustice","부당함","s"],["pottery","도자기","n"],["fairness","공정함","a"],["tunnel","터널","n"],["inequity","불공평","s"],["justice","정의, 공정","a"],["orchestra","관현악단","n"]]}],"sets":[{"items":[{"slots":[["elusive","obvious","a"],["motivates"],["directly"],["inferior"],["initial"]],"opts":["harmless","noble","familiar","elusive"],"or":["harmless(해롭지 않은): 이 글은 질투가 해로운지가 아니라 잘 안 보인다는 점을 다룸.","noble(고귀한): 남보다 못하다는 걸 인정하는 괴로운 감정을 고귀하다고 할 근거가 없음.","familiar(친숙한): 친숙해서 잘 아는 감정이라면 알아보기 어렵다는 뒷문장과 부딪침.","elusive(붙잡기 어려운): 바로 뒤 '알아보기 매우 어렵다'와 this elusiveness(이렇게 붙잡기 어려움)가 같은 말을 반복해 줌."],"om":["해롭지 않은","고귀한","친숙한","붙잡기 어려운"],"en":"Of all the human emotions, none is trickier or more elusive than envy. It is very difficult to actually discern the envy that motivates people’s actions.","ko":"인간의 모든 감정 가운데 질투보다 더 까다롭거나 더 붙잡기 어려운 것은 없다. 사람들의 행동을 움직이는 질투를 실제로 알아보기는 매우 어렵다.","hl":["more elusive than envy","very difficult to actually discern"],"khl":["더 붙잡기 어려운","실제로 알아보기는 매우 어렵다"],"blocks":[{"t":"flow","h":"글 전체 지도","x":["질투는 붙잡기 어려운 감정이다","이유: 우리가 질투를 드러내지 않기 때문","질투 = 남보다 못하다는 인정","인정도 괴롭고, 들키는 건 더 괴롭다","그래서 질투를 '불공평함·분노'로 위장한다"],"at":0},{"t":"p","h":"obvious(뻔한)가 틀린 이유","x":["obvious(뻔한)를 넣으면 \"질투만큼 뻔히 보이는 감정은 없다\"가 된다.","그런데 바로 다음 문장이 \"질투를 알아보기는 매우 어렵다\"이다.","첫 문장과 둘째 문장이 정면으로 부딪친다.","첫 문장의 이 단어가 글 전체의 주제를 정한다."]}],"post":["elusive(붙잡기 어려운) ↔ obvious(뻔한)","질투 = 숨어서 잘 안 보이는 감정"]},{"slots":[["discern","detect","s"],["simple"],["admission","denial","a"],["value","cherish","s"],["disguise"]],"opts":["admission","celebration","promise","complaint"],"or":["admission(인정): 다음 문장이 admit this inferiority(이 열등함을 인정하다)로 같은 말을 동사로 다시 받음.","celebration(축하): 남보다 못하다는 걸 스스로 축하하는 사람은 없음.","promise(약속): '못하다는 약속'은 말이 되지 않고, 뒤의 admit(인정하다)와도 연결되지 않음.","complaint(불평): 불평은 남에게 하는 것이라 to ourselves(스스로에게) 하는 마음속 인정과 다름."],"om":["인정","축하","약속","불평"],"en":"Envy entails the admission to ourselves that we are inferior to another person in something we value. Not only is it painful to admit this inferiority","ko":"질투에는 우리가 소중히 여기는 무언가에서 다른 사람보다 못하다는 것을 스스로 인정하는 일이 따른다. 이 열등함을 인정하는 것은 고통스러울 뿐 아니라","hl":["the admission to ourselves","admit this inferiority"],"khl":["스스로 인정하는 일","이 열등함을 인정하는 것"],"blocks":[{"t":"pair","h":"명사와 동사로 같은 말 두 번","x":[["the admission to ourselves","스스로에게 하는 인정 (명사)"],["admit this inferiority","이 열등함을 인정하다 (동사)"]]},{"t":"p","h":"denial(부인)이 안 되는 이유","x":["denial(부인)을 넣으면 질투에는 \"나는 못하지 않다\"는 부정이 따른다는 말이 된다.","그런데 바로 다음 문장은 \"이 열등함을 인정하는 것이 괴롭다\"이다.","인정하지 않았다면 괴로울 것도 없다.","감추는 일, 곧 disguise(위장하다)는 인정한 다음에 벌어지는 단계다."]},{"t":"p","h":"고치지 않는 두 단어","x":["detect(감지하다)는 discern(알아보다) 자리에 넣어도 \"알아채기 어렵다\"로 뜻이 같다.","cherish(소중히 여기다)는 value(소중히 여기다)와 같은 뜻이다."]}],"post":["admission(인정) ↔ denial(부인)","질투의 속뜻 = \"나는 저 사람보다 못하다\"는 인정"]},{"slots":[["express","reveal","s"],["entails"],["painful","pleasant","a"],["worse"],["resentment"]],"opts":["amusing","painful","rewarding","easy"],"or":["amusing(재미있는): 남보다 못하다는 인정이 재미있다면 뒤의 even worse(훨씬 더 나쁜)와 이어지지 않음.","painful(고통스러운): 'A도 괴롭지만 B는 더 나쁘다'는 짝이라 A 자리도 괴로운 쪽이어야 함.","rewarding(보람 있는): 보람 있는 일을 하고 나서 '훨씬 더 나쁘다'고 덧붙일 수 없음.","easy(쉬운): 쉽게 인정할 수 있다면 굳이 질투를 위장할 이유가 사라짐."],"om":["재미있는","고통스러운","보람 있는","쉬운"],"en":"Not only is it painful to admit this inferiority, but it is even worse for others to see that we are feeling this.","ko":"이 열등함을 인정하는 것은 고통스러울 뿐 아니라, 우리가 이런 감정을 느끼고 있다는 걸 남들이 보는 것은 훨씬 더 나쁘다.","hl":["painful to admit","even worse"],"khl":["고통스러울 뿐 아니라","훨씬 더 나쁘다"],"blocks":[{"t":"p","h":"Not only A but even worse B","x":["Not only A, but even worse B(A일 뿐 아니라 B는 훨씬 더 나쁘다).","even worse(훨씬 더 나쁜)는 A도 이미 나쁘다는 뜻이다.","그러니 A 자리에는 나쁜 쪽 말이 와야 한다.","pleasant(즐거운)를 넣으면 \"즐거운데 더 나쁘다\"가 되어 말이 안 된다."]},{"t":"p","h":"질투를 숨기는 두 가지 이유","x":["하나, 내가 못하다는 걸 스스로 인정하는 게 괴롭다.","둘, 그걸 남이 알아채는 건 더 괴롭다.","이 두 괴로움 때문에 우리는 질투를 드러내지 않는다."]},{"t":"p","h":"reveal(드러내다)은 맞는 표현","x":["reveal(드러내다)은 express(표현하다) 자리에서 \"질투를 대놓고 드러내는 일이 거의 없다\"로 같은 뜻이 된다."]}],"post":["painful(고통스러운) ↔ pleasant(즐거운)","인정은 괴롭고, 들키는 건 더 괴로움"]},{"slots":[["directly"],["inferior"],["admit"],["initial","final","a"],["distribution"]],"opts":["lasting","faded","initial","imagined"],"or":["lasting(오래가는): 오래 묵은 질투를 '느끼자마자' 숨긴다는 건 앞뒤가 맞지 않음.","faded(희미해진): 이미 희미해진 감정이라면 서둘러 위장할 이유가 없음.","initial(처음의): as soon as(~하자마자)와 함께 '질투가 막 생기자마자 바로 숨긴다'는 속도를 보여 줌.","imagined(상상 속의): 이 글은 실제로 느끼는 질투를 감추는 이야기라 상상 속 감정과 맞지 않음."],"om":["오래가는","희미해진","처음의","상상 속의"],"en":"And so almost as soon as we experience the initial feelings of envy, we are motivated to disguise it to ourselves","ko":"그래서 처음 질투를 느끼자마자 거의 곧바로, 우리는 그것을 스스로에게 위장하고 싶어진다","hl":["almost as soon as","the initial feelings of envy"],"khl":["느끼자마자 거의 곧바로","처음 질투를"],"blocks":[{"t":"tap","h":"질문 하나","q":"질투를 숨기는 건 언제일까?","a":["almost as soon as(거의 ~하자마자)가 답이다.","질투가 막 싹트는 그 순간 바로 감춘다.","그래서 initial(처음의) 감정이어야 한다."]},{"t":"p","h":"final(마지막의)을 넣어 보면","x":["\"질투의 마지막 감정을 느끼자마자\"가 된다.","질투가 끝날 즈음에야 숨긴다는 말이다.","그러면 그전까지는 질투가 다 드러난다.","\"질투는 거의 드러나지 않는다\"는 글의 주장과 부딪친다."]}],"post":["initial(처음의) ↔ final(마지막의)","질투는 생기자마자 바로 감춤"]},{"slots":[["motivates","drives","s"],["simple"],["painful"],["distribution","allocation","s"],["resentment","gratitude","a"]],"opts":["sympathy","resentment","relief","admiration"],"or":["sympathy(동정): 불공평함에 동정을 느낀다는 건 이 불만 목록과 어울리지 않음.","resentment(분개): '불공평함 → 분개 → 분노'로 점점 세지는 불만 목록에 딱 들어감.","relief(안도): 불공평하다고 느끼면서 안도한다는 건 앞뒤가 맞지 않음.","admiration(감탄): 불공평함에 감탄한다는 말은 바로 뒤 even anger(심지어 분노)와 반대 방향임."],"om":["동정","분개","안도","감탄"],"en":"it is not envy we feel but unfairness at the distribution of goods or attention, resentment at this unfairness, even anger.","ko":"우리가 느끼는 건 질투가 아니라 재물이나 관심이 나뉜 방식에 대한 불공평함, 이 불공평함에 대한 분개, 심지어 분노라는 것이다.","hl":["resentment at this unfairness","even anger"],"khl":["이 불공평함에 대한 분개","심지어 분노"],"blocks":[{"t":"p","h":"질투가 쓰는 가면","x":["우리는 \"질투 아니야\"라고 스스로를 속인다.","대신 \"불공평해서 화가 난 거야\"라고 이름을 바꾼다.","가면은 모두 불만과 화의 얼굴이다."]},{"t":"p","h":"gratitude(감사)가 튀는 이유","x":["목록은 unfairness(불공평함) → ? → even anger(심지어 분노)다.","even(심지어)은 같은 방향으로 한 단계 더 세질 때 쓴다.","가운데에 gratitude(감사)가 오면 화 → 감사 → 더 큰 화가 된다.","불공평함에 감사한다는 것부터 말이 안 된다."]},{"t":"p","h":"고치지 않는 두 단어","x":["drives(움직이게 하다)는 motivates(동기를 부여하다) 자리에 넣어도 \"행동을 움직이는 질투\"가 된다.","allocation(배분)은 distribution(분배)과 같은 뜻이다."]}],"post":["resentment(분개) ↔ gratitude(감사)","불공평함 → 분개 → 분노 = 질투의 가면"]}],"quiz":[{"w":"elusive","m":"붙잡기 어려운, 알아채기 힘든","it":[["salty","짠","n"],["slippery","종잡을 수 없는","s"],["obvious","뻔한, 분명한","a"],["rural","시골의","n"],["intangible","손에 잡히지 않는","s"],["apparent","명백한","a"],["punctual","시간을 잘 지키는","n"]]},{"w":"admission","m":"인정, 시인","it":[["acknowledgment","인정","s"],["harvest","수확","n"],["denial","부인, 부정","a"],["furniture","가구","n"],["confession","고백, 자백","s"],["disavowal","부인, 거부","a"],["volcano","화산","n"]]},{"w":"painful","m":"고통스러운","it":[["wooden","나무로 된","n"],["pleasant","즐거운","a"],["distressing","괴로운","s"],["annual","해마다의","n"],["painless","고통 없는","a"],["agonizing","몹시 고통스러운","s"],["fluent","유창한","n"]]},{"w":"initial","m":"처음의, 초기의","it":[["first","처음의","s"],["polite","공손한","n"],["final","마지막의","a"],["noisy","시끄러운","n"],["early","초기의","s"],["last","마지막의","a"],["humble","겸손한","n"]]},{"w":"resentment","m":"분개, 억울함","it":[["ladder","사다리","n"],["bitterness","억울함, 쓰라림","s"],["contentment","만족","a"],["festival","축제","n"],["indignation","분개","s"],["goodwill","호의","a"],["climate","기후","n"]]}]},{"items":[{"slots":[["elusive"],["express"],["inferior","superior","a"],["worse"],["disguise"]],"opts":["grateful","loyal","inferior","similar"],"or":["grateful(고마워하는): 남에게 고마워하는 마음은 인정하기 괴로운 감정이 아님.","loyal(충실한): 남에게 충실하다는 건 질투의 속뜻과 아무 관련이 없음.","inferior(못한): 다음 문장이 this inferiority(이 열등함)라고 받으니 '남보다 못하다'가 맞음.","similar(비슷한): 남과 비슷하다면 질투가 생길 이유가 없음."],"om":["고마워하는","충실한","못한","비슷한"],"en":"Envy entails the admission to ourselves that we are inferior to another person in something we value. Not only is it painful to admit this inferiority","ko":"질투에는 우리가 소중히 여기는 무언가에서 다른 사람보다 못하다는 것을 스스로 인정하는 일이 따른다. 이 열등함을 인정하는 것은 고통스러울 뿐 아니라","hl":["inferior to another person","this inferiority"],"khl":["다른 사람보다 못하다는 것","이 열등함"],"blocks":[{"t":"p","h":"질투가 생기는 순간 떠올리기","x":["친구가 나보다 시험을 잘 봤다.","내가 중요하게 여기는 것에서 친구가 앞섰다.","그때 드는 감정이 질투다.","질투는 \"내가 더 못하다\"는 마음에서 나온다."]},{"t":"p","h":"superior(우월한)가 안 되는 이유","x":["superior(우월한)를 넣으면 질투가 \"내가 더 낫다\"는 인정이 된다.","더 나은 사람이 상대를 질투할 이유는 없다.","게다가 다음 문장이 this inferiority(이 열등함)로 받는다.","this(이)가 가리키는 말이 앞에 있어야 한다."]}],"post":["inferior(못한) ↔ superior(우월한)","질투의 출발점 = 내가 더 못하다는 느낌"]},{"slots":[["simple","straightforward","s"],["express","conceal","a"],["entails"],["admit","confess","s"],["initial"]],"opts":["invent","express","celebrate","exaggerate"],"or":["invent(지어내다): 이 글은 질투를 꾸며 내는 게 아니라 실제 느끼는 질투를 다룸.","express(드러내다): '질투를 직접 드러내는 일이 거의 없다'가 질투가 잘 안 보이는 이유가 됨.","celebrate(축하하다): 질투를 축하한다는 말은 문맥과 무관함.","exaggerate(과장하다): 질투를 과장하지 않는다는 건 질투가 안 보이는 이유가 되지 못함."],"om":["지어내다","드러내다","축하하다","과장하다"],"en":"The reason for this elusiveness is simple: we almost never directly express the envy we are feeling.","ko":"이렇게 붙잡기 어려운 이유는 간단하다. 우리는 자신이 느끼는 질투를 직접 드러내는 일이 거의 없다.","hl":["almost never directly express","The reason for this elusiveness"],"khl":["직접 드러내는 일이 거의 없다","이렇게 붙잡기 어려운 이유"],"blocks":[{"t":"p","h":"콜론(:) 뒤는 이유","x":["콜론(:) 앞은 \"이유는 간단하다\", 뒤는 그 이유다.","이유는 질투가 왜 잘 안 보이는지를 설명해야 한다.","\"질투를 드러내지 않는다\"면 당연히 안 보인다."]},{"t":"p","h":"conceal(숨기다)을 넣고 다시 읽기","x":["\"우리는 질투를 직접 숨기는 일이 거의 없다\"가 된다.","숨기지 않으니 질투가 잘 보인다는 뜻이다.","질투가 잘 안 보이는 이유로는 정반대다.","부정어 almost never(거의 ~않는)와 만나 뜻이 뒤집힌다."]},{"t":"p","h":"그대로 두는 두 단어","x":["straightforward(간단한)는 simple(간단한)과 같은 말이다.","confess(털어놓다)는 admit(인정하다) 자리에서 \"열등함을 털어놓는 게 괴롭다\"로 뜻이 통한다."]}],"post":["express(드러내다) ↔ conceal(숨기다)","잘 안 보이는 이유 = 안 드러내서"]},{"slots":[["discern"],["admission","acknowledgment","s"],["value"],["disguise","expose","a"],["unfairness"]],"opts":["disguise","share","display","praise"],"or":["disguise(위장하다): 대시(—) 뒤에 '질투가 아니라 불공평함'이라는 가짜 이름표가 나오니 위장이 맞음.","share(나누다): 질투를 남과 나눈다는 건 to ourselves(스스로에게) 이름을 바꾸는 장면과 맞지 않음.","display(내보이다): 내보인다면 질투가 잘 안 보인다는 글의 주장과 반대임.","praise(칭찬하다): 질투를 칭찬한다는 건 '질투가 아니라'라고 부정하는 대시 뒤 내용과 부딪침."],"om":["위장하다","나누다","내보이다","칭찬하다"],"en":"we are motivated to disguise it to ourselves — it is not envy we feel but unfairness at the distribution of goods or attention","ko":"우리는 그것을 스스로에게 위장하고 싶어진다. 우리가 느끼는 건 질투가 아니라 재물이나 관심이 나뉜 방식에 대한 불공평함이라는 것이다","hl":["disguise it to ourselves","it is not envy we feel"],"khl":["스스로에게 위장하고","느끼는 건 질투가 아니라"],"blocks":[{"t":"pair","h":"대시(—) 앞뒤 맞춰 보기","x":[["disguise it to ourselves","스스로에게 질투를 위장한다"],["it is not envy we feel but unfairness","우리가 느끼는 건 질투가 아니라 불공평함이다"]]},{"t":"p","h":"대시 뒤는 위장의 내용","x":["대시 뒤는 우리가 속으로 하는 말이다.","\"이건 질투가 아니야. 불공평해서 그래.\"","질투에 다른 이름표를 붙이는 것, 그게 위장이다.","expose(드러내다)라면 \"이건 질투야\"라고 해야 맞다."]},{"t":"p","h":"acknowledgment(인정)는 맞는 표현","x":["acknowledgment(인정)는 admission(인정) 자리에 넣어도 뜻이 같다."]}],"post":["disguise(위장하다) ↔ expose(드러내다)","질투에 '불공평함'이라는 가짜 이름표"]},{"slots":[["motivates"],["directly"],["entails","excludes","a"],["painful"],["unfairness"]],"opts":["entails","forbids","prevents","delays"],"or":["entails(수반하다): 질투에는 열등함의 인정이 따라온다는 뜻이라 다음 문장의 admit(인정하다)과 이어짐.","forbids(금지하다): 인정을 금지한다면 '인정하는 것이 괴롭다'는 다음 문장이 나올 수 없음.","prevents(막다): 인정을 막는다면 괴로워할 일도 없어 글의 흐름이 끊김.","delays(미루다): 인정을 미룬다는 건 질투 자체가 곧 인정이라는 이 문장의 정의와 맞지 않음."],"om":["수반하다","금지하다","막다","미루다"],"en":"Envy entails the admission to ourselves that we are inferior to another person in something we value.","ko":"질투에는 우리가 소중히 여기는 무언가에서 다른 사람보다 못하다는 것을 스스로 인정하는 일이 따른다.","hl":["Envy entails the admission","inferior to another person"],"khl":["인정하는 일이 따른다","다른 사람보다 못하다는 것"],"blocks":[{"t":"tap","h":"질투의 정의 한 줄","q":"질투를 느낀다는 건 속으로 무엇을 인정하는 걸까?","a":["\"내가 저 사람보다 못하다\"는 것.","질투와 이 인정은 늘 붙어 다닌다.","그래서 entails(수반하다)가 맞다."]},{"t":"p","h":"excludes(배제하다)를 넣으면","x":["질투에는 열등함의 인정이 빠져 있다는 말이 된다.","그러면 다음 문장 \"이 열등함을 인정하는 것은 괴롭다\"가 붕 뜬다.","인정이 없으면 괴로울 일도, 숨길 이유도 없다."]}],"post":["entail(수반하다) ↔ exclude(배제하다)","질투 = '내가 못하다'는 인정이 늘 따라옴"]},{"slots":[["directly","openly","s"],["admission"],["worse","better","a"],["initial","first","s"],["resentment"]],"opts":["kinder","worse","safer","easier"],"or":["kinder(더 친절한): 남이 내 질투를 보는 것이 더 친절하다는 말은 성립하지 않음.","worse(더 나쁜): 열등함을 남에게 들키는 게 더 괴로워서 질투를 숨긴다는 흐름과 맞음.","safer(더 안전한): 들키는 게 더 안전하다면 서둘러 위장할 이유가 없음.","easier(더 쉬운): 들키는 게 더 쉽다면 And so(그래서) 뒤의 위장과 이어지지 않음."],"om":["더 친절한","더 나쁜","더 안전한","더 쉬운"],"en":"Not only is it painful to admit this inferiority, but it is even worse for others to see that we are feeling this. And so almost as soon as we experience the initial feelings of envy, we are motivated to disguise it","ko":"이 열등함을 인정하는 것은 고통스러울 뿐 아니라, 우리가 이런 감정을 느끼고 있다는 걸 남들이 보는 것은 훨씬 더 나쁘다. 그래서 처음 질투를 느끼자마자 거의 곧바로, 우리는 그것을 위장하고 싶어진다","hl":["even worse for others to see","And so"],"khl":["훨씬 더 나쁘다","그래서"],"blocks":[{"t":"p","h":"And so(그래서)가 정하는 방향","x":["And so(그래서) 뒤의 결과는 \"질투를 위장한다\"이다.","위장하는 이유는 들키는 게 싫어서다.","그러니 앞 문장은 \"남이 보는 건 더 나쁘다\"여야 한다.","better(더 좋은)를 넣으면 들키는 게 좋은데 숨기는 셈이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","openly(드러내 놓고)는 directly(직접) 자리에, first(처음의)는 initial(처음의) 자리에 들어가도 뜻이 같다.","고쳐야 할 것은 하나뿐."]}],"post":["worse(더 나쁜) ↔ better(더 좋은)","들키는 게 제일 싫어서 숨김"]}],"quiz":[{"w":"inferior","m":"(~보다) 못한, 열등한","it":[["lesser","더 못한","s"],["musical","음악적인","n"],["superior","우월한","a"],["frozen","얼어붙은","n"],["second-rate","이류의","s"],["better","더 나은","a"],["spicy","매운","n"]]},{"w":"express","m":"표현하다, 드러내다","it":[["boil","끓이다","n"],["convey","전달하다","s"],["conceal","숨기다","a"],["sew","바느질하다","n"],["voice","말로 나타내다","s"],["suppress","억누르다","a"],["rent","빌리다","n"]]},{"w":"disguise","m":"위장하다, 감추다","it":[["mask","가리다, 감추다","s"],["plant","심다","n"],["reveal","드러내다","a"],["polish","닦다, 윤내다","n"],["camouflage","위장하다","s"],["expose","드러내다, 폭로하다","a"],["measure","측정하다","n"]]},{"w":"entail","m":"수반하다","it":[["jog","조깅하다","n"],["involve","수반하다, 포함하다","s"],["exclude","배제하다","a"],["paint","칠하다","n"],["require","필요로 하다","s"],["rule out","배제하다","a"],["knit","뜨개질하다","n"]]},{"w":"bad","m":"나쁜 (worse는 bad의 비교급)","it":[["awful","끔찍한","s"],["tall","키가 큰","n"],["good","좋은","a"],["liquid","액체의","n"],["terrible","형편없는, 끔찍한","s"],["excellent","훌륭한","a"],["weekly","매주의","n"]]}]}],"no":"35"},{"id":"2211g2-36","title":"어휘특훈 · 22년 11월 고2 36번","sub":"잊힐 권리와 사생활 권리","tpl":"The right to be forgotten is a right {distinct} from but {related} to a right to privacy. The right to privacy is, among other things, the right for information {traditionally} regarded as {protected} or personal not to be {revealed}. The right to be forgotten, in contrast, can be applied to information that has been in the {public} domain. The right to be forgotten {broadly} includes the right of an individual not to be {forever} defined by information from a {specific} point in time. One {motivation} for such a right is to {allow} individuals to {move_on} with their lives and not be defined by a specific event or period in their lives. For example, it has long been {recognized} in some countries, such as the UK and France, that even past criminal convictions should {eventually} be “spent” and not {continue} to affect a person’s life. Despite the reason for {supporting} the right to be forgotten, the right to be forgotten can sometimes come into {conflict} with other rights. For example, formal {exceptions} are sometimes made for security or public health reasons.","fn":["*public domain: 공공의 영역, 누구나 볼 수 있는 곳","*criminal conviction: 유죄 판결","*spent: (전과 기록이) 효력을 다한, 소멸된"],"mean":{"distinct":"(~와) 구별되는, 별개의","different":"(~와) 다른","inseparable":"(~와) 떼어 놓을 수 없는","related":"(~와) 관련된","connected":"(~와) 연결된, 관련된","traditionally":"전통적으로, 예로부터","conventionally":"관례적으로, 통상적으로","rarely":"좀처럼 ~않는, 드물게","protected":"동사 protect(보호하다)의 과거분사형, 보호되는","revealed":"동사 reveal(드러내다, 공개하다)의 과거분사형","disclosed":"동사 disclose(공개하다, 밝히다)의 과거분사형","hidden":"동사 hide(숨기다)의 과거분사형, 숨겨진","public":"공공의, 공개된","private":"사적인, 비공개의","broadly":"넓게 보아, 대체로","generally":"일반적으로, 대체로","forever":"영원히","permanently":"영구적으로","temporarily":"일시적으로","specific":"특정한","particular":"특정한","motivation":"동기, 이유","obstacle":"장애물","allow":"허락하다, ~하게 해 주다","enable":"~할 수 있게 하다","forbid":"금지하다","move on":"(지난 일을 털고) 앞으로 나아가다","get on":"(삶을) 계속해 나가다","recognized":"동사 recognize(인정하다)의 과거분사형","acknowledged":"동사 acknowledge(인정하다)의 과거분사형","rejected":"동사 reject(거부하다)의 과거분사형","eventually":"결국, 마침내","ultimately":"결국, 궁극적으로","never":"결코 ~않는","continue":"계속하다","cease":"그치다, 멈추다","supporting":"동사 support(지지하다)의 -ing형. 동명사","backing":"동사 back(지지하다)의 -ing형. 동명사","opposing":"동사 oppose(반대하다)의 -ing형. 동명사","conflict":"충돌, 갈등","harmony":"조화","exceptions":"명사 exception(예외)의 복수형"},"comp":[{"no":"36","slots":[["distinct","different","s"],["protected"],["motivation","obstacle","a"],["allow"],["continue"]],"opts":["threat","penalty","mistake","motivation"],"or":["threat(위협): 삶을 이어 가게 돕는 일이 권리의 위협이라는 건 말이 안 됨.","penalty(처벌): 앞으로 나아가게 해 주는 것은 처벌이 아니라 배려임.","mistake(실수): 뒤의 For example(예를 들어)이 영국·프랑스가 오래 인정해 온 일로 받으니 실수가 될 수 없음.","motivation(동기): 개인이 삶을 이어 가게 해 주는 것은 이 권리를 만든 이유라서 맞음."],"om":["위협","처벌","실수","동기"],"en":"One motivation for such a right is to allow individuals to move on with their lives and not be defined by a specific event or period in their lives.","ko":"그런 권리가 생긴 한 가지 동기는 개인이 자 이유","it":[["reason","이유","s"],["blanket","담요","n"],["discouragement","의욕 꺾기, 낙담","a"],["harvest","수확","n"],["incentive","동기, 유인","s"],["disincentive","의욕을 꺾는 것","a"],["volcano","화산","n"]]},{"w":"continue","m":"계속하다","it":[["sneeze","재채기하다","n"],["persist","지속하다","s"],["cease","그치다","a"],["whistle","휘파람 불다","n"],["carry on","계속하다","s"],["stop","멈추다","a"],["sew","바느질하다","n"]]}],"sets":[{"items":[{"slots":[["distinct","inseparable","a"],["protected"],["public"],["forever"],["specific"]],"opts":["absent","borrowed","banned","distinct"],"or":["absent(없는): 사생활 권리에서 '빠져 있는' 권리라는 말은 뒤의 비교 설명과 이어지지 않음.","borrowed(빌려 온): 다른 권리에서 빌려 왔다는 말은 글 어디에도 근거가 없음.","banned(금지된): 잊힐 권리가 금지됐다는 말은 이 권리를 설명하는 글과 정반대임.","distinct(구별되는): but related(하지만 관련된)와 짝을 이뤄 '다르지만 관련 있다'는 정의를 만듦."],"om":["없는","빌려 온","금지된","구별되는"],"en":"The right to be forgotten is a right distinct from but related to a right to privacy. … The right to be forgotten, in contrast, can be applied to information that has been in the public domain.","ko":"잊힐 권리는 사생활 권리와 구별되지만 관련이 있는 권리이다. … 반면에 잊힐 권리는 공공의 영역에 있었던 정보에도 적용될 수 있다.","hl":["distinct from but related to","in contrast"],"khl":["구별되지만 관련이 있는","반면에"],"blocks":[{"t":"flow","h":"글 전체 지도","x":["잊힐 권리 = 사생활 권리와 다르지만 관련 있음","사생활 권리: 비밀 정보를 공개하지 않을 권리","잊힐 권리: 이미 공개된 정보에도 적용","이유: 과거 한 시점에 묶이지 않고 새 출발","한계: 다른 권리와 충돌, 예외가 있음"],"at":0},{"t":"p","h":"but(하지만)이 요구하는 짝","x":["A but B(A 하지만 B)는 서로 반대 느낌의 두 말을 묶는다.","B가 related(관련된)이니 A는 \"다르다\" 쪽이어야 한다.","inseparable(떼어 놓을 수 없는)을 넣으면 \"떼어 놓을 수 없지만 관련 있다\"가 된다.","but(하지만)의 대조가 사라진다.","세 번째 문장의 in contrast(반면에)도 두 권리가 다르다는 증거다."]}],"post":["distinct(구별되는) ↔ inseparable(떼어 놓을 수 없는)","잊힐 권리 = 사생활 권리와 다르지만 가까운 사이"]},{"slots":[["traditionally","conventionally","s"],["protected"],["revealed","hidden","a"],["broadly","generally","s"],["allow"]],"opts":["revealed","praised","repaired","translated"],"or":["revealed(공개된): '보호되거나 개인적인 정보가 공개되지 않을 권리'가 사생활 권리의 뜻 그대로임.","praised(칭찬받는): 정보가 칭찬받지 않을 권리는 사생활과 아무 관련이 없음.","repaired(수리된): 정보를 수리한다는 말은 문맥에 맞지 않음.","translated(번역된): 번역 여부는 사생활 보호와 무관함."],"om":["공개된","칭찬받는","수리된","번역된"],"en":"The right to privacy is, among other things, the right for information traditionally regarded as protected or personal not to be revealed.","ko":"사생활 권리는 무엇보다도, 전통적으로 보호받거나 개인적인 것으로 여겨지는 정보가 공개되지 않을 권리이다.","hl":["not to be revealed","protected or personal"],"khl":["공개되지 않을 권리","보호받거나 개인적인"],"blocks":[{"t":"p","h":"사생활 권리를 내 일로 떠올리기","x":["내 일기장, 내 병원 기록, 내 집 주소.","이런 건 남이 함부로 보면 안 된다.","사생활 권리는 이런 정보가 공개되지 않게 지켜 주는 권리다."]},{"t":"p","h":"hidden(숨겨진)을 넣어 보면","x":["\"개인적인 정보가 숨겨지지 않을 권리\"가 된다.","비밀을 지켜 주는 권리가 비밀을 드러내는 권리로 뒤집힌다.","not to be(~되지 않을)와 만나 뜻이 정반대가 된다."]},{"t":"p","h":"고치지 않는 두 단어","x":["conventionally(관례적으로)는 traditionally(전통적으로)와 같은 방향이다.","generally(대체로)는 broadly(넓게 보아)와 바꿔 써도 뜻이 통한다."]}],"post":["reveal(공개하다) ↔ hide(숨기다)","사생활 권리 = 비밀 정보를 공개 안 할 권리"]},{"slots":[["related"],["forever","temporarily","a"],["motivation"],["move_on","get on","s"],["eventually"]],"opts":["forever","kindly","loudly","gladly"],"or":["forever(영원히): 과거 한 시점의 정보에 '영원히' 묶이지 않을 권리라서 결국 효력을 다한다는 예시와 맞음.","kindly(친절하게): 친절하게 규정되지 않을 권리는 의미가 통하지 않음.","loudly(큰 소리로): 정보가 큰 소리로 규정된다는 말은 문맥과 무관함.","gladly(기꺼이): 기꺼이 규정되지 않는다는 말은 권리의 내용이 될 수 없음."],"om":["영원히","친절하게","큰 소리로","기꺼이"],"en":"The right to be forgotten broadly includes the right of an individual not to be forever defined by information from a specific point in time.","ko":"잊힐 권리는 넓게 보아, 개인이 특정 시점의 정보에 의해 영원히 규정되지 않을 권리를 포함한다.","hl":["not to be forever defined","a specific point in time"],"khl":["영원히 규정되지 않을","특정 시점의 정보"],"blocks":[{"t":"pair","h":"시간을 나타내는 말끼리 맞춰 보기","x":[["a specific point in time","어느 한 시점"],["not to be forever defined","영원히 규정되지 않을"],["should eventually be “spent”","결국에는 효력을 다해야 한다"]]},{"t":"p","h":"temporarily(일시적으로)가 안 되는 이유","x":["temporarily(일시적으로)를 넣으면 \"잠깐이라도 규정되지 않을 권리\"가 된다.","하지만 예시는 전과도 eventually(결국) 효력을 다한다는 내용이다.","잠깐은 남아 있어도 되지만, 영원히 따라다니면 안 된다는 것.","문제는 '영원히'다."]},{"t":"p","h":"get on(계속해 나가다)은 맞는 표현","x":["get on with their lives(삶을 계속해 나가다)는 move on with their lives(삶을 이어 나가다)와 같은 뜻이다."]}],"post":["forever(영원히) ↔ temporarily(일시적으로)","한 시점의 기록에 평생 묶이지 않기"]},{"slots":[["public"],["allow"],["recognized","rejected","a"],["continue"],["conflict"]],"opts":["doubted","forgotten","recognized","ignored"],"or":["doubted(의심받은): 의심받아 왔다면 이 권리를 지지하는 예시가 되지 못함.","forgotten(잊힌): 그런 생각이 잊혔다면 영국·프랑스를 예로 들 이유가 없음.","recognized(인정된): For example(예를 들어)로 시작해 이 권리를 지지하는 사례를 보여 주므로 '오랫동안 인정되어 왔다'가 맞음.","ignored(무시된): 무시되어 왔다면 '삶을 이어 가게 해 준다'는 앞 문장의 예시가 될 수 없음."],"om":["의심받은","잊힌","인정된","무시된"],"en":"For example, it has long been recognized in some countries, such as the UK and France, that even past criminal convictions should eventually be “spent”","ko":"예를 들어, 영국과 프랑스 같은 일부 국가에서는 과거의 유죄 판결조차 결국에는 '효력을 다해야' 한다는 것이 오랫동안 인정되어 왔다","hl":["it has long been recognized","For example"],"khl":["오랫동안 인정되어 왔다","예를 들어"],"blocks":[{"t":"p","h":"For example(예를 들어)은 앞 문장 편","x":["앞 문장은 이 권리의 좋은 이유를 말했다.","\"삶을 이어 가게 해 주는 것\".","For example(예를 들어) 뒤는 그 이유를 받쳐 주는 실제 사례여야 한다.","rejected(거부된)를 넣으면 영국·프랑스가 이 생각을 거부한 사례가 된다.","앞 문장을 받쳐 주기는커녕 반박하는 예시가 된다."]},{"t":"tap","h":"질문 하나","q":"전과가 평생 따라다니면 어떤 일이 생길까?","a":["취업도, 새 출발도 어렵다.","그래서 이 나라들은 '언젠가는 끝나야 한다'는 생각을 오래 인정해 왔다."]}],"post":["recognize(인정하다) ↔ reject(거부하다)","영국·프랑스 = 전과도 결국 끝난다고 인정"]},{"slots":[["related","connected","s"],["specific"],["eventually","ultimately","s"],["supporting","opposing","a"],["exceptions"]],"opts":["ignoring","delaying","supporting","mocking"],"or":["ignoring(무시하는): 권리를 무시하는 이유는 글 어디에도 나오지 않음.","delaying(미루는): 권리를 미루는 이유는 앞 내용과 연결되지 않음.","supporting(지지하는): 앞에서 말한 '새 출발'이 이 권리를 지지하는 이유이고, Despite(~에도 불구하고)가 그 뒤의 한계와 대조를 만듦.","mocking(비웃는): 비웃는 이유를 무릅쓰고 충돌이 생긴다는 건 말이 안 됨."],"om":["무시하는","미루는","지지하는","비웃는"],"en":"Despite the reason for supporting the right to be forgotten, the right to be forgotten can sometimes come into conflict with other rights.","ko":"잊힐 권리를 지지하는 그런 이유에도 불구하고, 잊힐 권리는 때때로 다른 권리와 충돌할 수 있다.","hl":["Despite the reason for supporting","come into conflict"],"khl":["지지하는 그런 이유에도 불구하고","충돌할 수 있다"],"blocks":[{"t":"p","h":"Despite(~에도 불구하고)의 방향","x":["Despite A, B(A에도 불구하고 B)는 A와 B가 반대 방향일 때 쓴다.","B는 \"이 권리가 다른 권리와 충돌할 수 있다\", 곧 권리의 약점이다.","그러니 A는 권리의 장점, 곧 지지하는 이유여야 한다.","opposing(반대하는)을 넣으면 \"반대하는 이유에도 불구하고 약점이 있다\"가 된다.","약점에 약점을 이어 붙이니 Despite(~에도 불구하고)가 어울리지 않는다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","connected(관련된)는 related(관련된)와, ultimately(결국)는 eventually(결국)와 같은 뜻이다.","고쳐야 할 것은 하나뿐."]}],"post":["support(지지하다) ↔ oppose(반대하다)","좋은 이유가 있어도 다른 권리와 부딪칠 수 있음"]}],"quiz":[{"w":"distinct","m":"(~와) 구별되는, 별개의","it":[["hungry","배고픈","n"],["separate","별개의","s"],["identical","동일한","a"],["wooden","나무로 된","n"],["dissimilar","서로 다른","s"],["similar","비슷한","a"],["polite","공손한","n"]]},{"w":"reveal","m":"드러내다, 공개하다","it":[["disclose","공개하다, 밝히다","s"],["bake","굽다","n"],["conceal","숨기다","a"],["pour","붓다","n"],["expose","드러내다","s"],["hide","숨기다","a"],["fold","접다","n"]]},{"w":"forever","m":"영원히","it":[["upstairs","위층에서","n"],["permanently","영구적으로","s"],["temporarily","일시적으로","a"],["loudly","큰 소리로","n"],["eternally","영원히","s"],["briefly","잠시","a"],["cheerfully","쾌활하게","n"]]},{"w":"recognize","m":"인정하다","it":[["acknowledge","인정하다","s"],["swim","수영하다","n"],["reject","거부하다","a"],["knit","뜨개질하다","n"],["accept","받아들이다","s"],["deny","부인하다","a"],["climb","오르다","n"]]},{"w":"support","m":"지지하다","it":[["sketch","스케치하다","n"],["back","지지하다","s"],["oppose","반대하다","a"],["rinse","헹구다","n"],["endorse","지지하다, 승인하다","s"],["resist","저항하다, 반대하다","a"],["chew","씹다","n"]]}]},{"items":[{"slots":[["distinct"],["traditionally"],["public","private","a"],["motivation"],["recognized"]],"opts":["secret","public","empty","foreign"],"or":["secret(비밀의): 비밀 정보는 바로 앞 사생활 권리가 다루는 것이라 in contrast(반면에)와 부딪침.","public(공공의): in contrast(반면에)가 사생활 권리의 '비공개 정보'와 대조를 만들어 '이미 공개된 정보'가 맞음.","empty(빈): 빈 영역에 있던 정보라는 말은 뜻이 통하지 않음.","foreign(외국의): 외국 영역이라는 말은 사생활과의 대조와 아무 관련이 없음."],"om":["비밀의","공공의","빈","외국의"],"en":"The right to privacy is, among other things, the right for information traditionally regarded as protected or personal not to be revealed. The right to be forgotten, in contrast, can be applied to information that has been in the public domain.","ko":"사생활 권리는 무엇보다도, 전통적으로 보호받거나 개인적인 것으로 여겨지는 정보가 공개되지 않을 권리이다. 반면에 잊힐 권리는 공공의 영역에 있었던 정보에도 적용될 수 있다.","hl":["in the public domain","in contrast"],"khl":["공공의 영역에 있었던 정보","반면에"],"blocks":[{"t":"pair","h":"in contrast(반면에) 앞뒤 나란히","x":[["protected or personal not to be revealed","보호받는 개인 정보 → 공개 안 됨 (사생활 권리)"],["information that has been in the public domain","이미 공개된 정보 (잊힐 권리)"]]},{"t":"p","h":"private(사적인)를 넣으면","x":["\"잊힐 권리는 비공개 영역의 정보에 적용된다\"가 된다.","그건 바로 앞 사생활 권리가 하는 일이다.","in contrast(반면에)로 대조를 했는데 똑같은 말을 한 셈이다.","예: 이미 신문에 났던 기사도 지워 달라고 할 수 있는 것이 잊힐 권리다."]}],"post":["public(공공의) ↔ private(사적인)","잊힐 권리 = 이미 공개된 정보에도 적용"]},{"slots":[["forever","permanently","s"],["specific","particular","s"],["allow","forbid","a"],["move_on"],["continue"]],"opts":["warn","blame","allow","beg"],"or":["warn(경고하다): 삶을 이어 가라고 경고한다는 건 권리의 동기로 어색함.","blame(비난하다): 권리가 사람을 비난한다는 말이 되어 삶을 이어 가게 돕는다는 뜻과 반대 방향임.","allow(~하게 해 주다): 이 권리가 개인이 삶을 이어 가도록 '허락해 준다'는 좋은 목적을 나타냄.","beg(간청하다): 권리가 개인에게 간청한다는 말은 성립하지 않음."],"om":["경고하다","비난하다","~하게 해 주다","간청하다"],"en":"One motivation for such a right is to allow individuals to move on with their lives and not be defined by a specific event or period in their lives.","ko":"그런 권리가 생긴 한 가지 동기는 개인이 자기 삶을 이어 나가고, 삶의 특정한 사건이나 시기에 의해 규정되지 않게 해 주는 것이다.","hl":["allow individuals to move on","not be defined"],"khl":["자기 삶을 이어 나가고","규정되지 않게 해 주는 것"],"blocks":[{"t":"tap","h":"질문 하나","q":"권리는 사람에게 무엇을 해 줄까?","a":["무언가를 할 수 있게 해 준다.","잊힐 권리는 과거를 털고 앞으로 나아가게 해 준다.","그래서 allow(허락하다)가 맞다."]},{"t":"p","h":"forbid(금지하다)가 튀는 이유","x":["forbid(금지하다)를 넣으면 \"삶을 이어 가는 것을 금지하는 것이 이 권리의 동기\"가 된다.","권리가 사람을 과거에 묶어 두는 셈이다.","앞 문장의 \"영원히 규정되지 않을 권리\"와 정반대다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","permanently(영구적으로)는 forever(영원히)와, particular(특정한)는 specific(특정한)과 같은 뜻이다.","고칠 단어는 하나뿐."]}],"post":["allow(허락하다) ↔ forbid(금지하다)","잊힐 권리 = 앞으로 나아가게 해 주는 권리"]},{"slots":[["broadly"],["eventually"],["supporting","backing","s"],["conflict","harmony","a"],["exceptions"]],"opts":["fashion","bloom","power","conflict"],"or":["fashion(유행): 권리가 다른 권리와 유행이 된다는 말은 뜻이 통하지 않음.","bloom(꽃핌): 다른 권리와 함께 꽃핀다는 말은 Despite(~에도 불구하고)의 대조와 맞지 않음.","power(권력): 'come into power(권력을 잡다)'는 사람·정당에 쓰는 말이라 '다른 권리와'와 이어지지 않음.","conflict(충돌): 다음 문장의 formal exceptions(공식적인 예외)가 다른 권리와 부딪친 결과라서 맞음."],"om":["유행","꽃핌","권력","충돌"],"en":"the right to be forgotten can sometimes come into conflict with other rights. For example, formal exceptions are sometimes made for security or public health reasons.","ko":"잊힐 권리는 때때로 다른 권리와 충돌할 수 있다. 예를 들어, 안보나 공중 보건상의 이유로 공식적인 예외가 때때로 만들어진다.","hl":["come into conflict with other rights","formal exceptions"],"khl":["다른 권리와 충돌할 수 있다","공식적인 예외"],"blocks":[{"t":"p","h":"예외가 생기는 장면","x":["감염병이 돌 때 누가 어디를 다녀갔는지 알아야 할 때가 있다.","이럴 땐 \"내 기록을 지워 줘\"가 통하지 않는다.","모두의 건강(공중 보건)이라는 다른 권리와 부딪치기 때문이다.","부딪치니 예외를 둔다."]},{"t":"p","h":"harmony(조화)를 넣으면","x":["\"잊힐 권리는 때때로 다른 권리와 조화를 이룬다\"가 된다.","그런데 다음 문장의 예시는 '예외'다.","조화를 이룬다면 예외를 만들 필요가 없다.","Despite(~에도 불구하고)가 예고한 반전도 사라진다."]},{"t":"p","h":"backing(지지하는)은 그대로","x":["backing(지지하는)은 supporting(지지하는)과 같은 뜻이라 Despite(~에도 불구하고)의 대조가 그대로 살아 있다."]}],"post":["conflict(충돌) ↔ harmony(조화)","안보·공중 보건 앞에서는 예외"]},{"slots":[["traditionally","rarely","a"],["revealed"],["broadly"],["specific"],["move_on"]],"opts":["accidentally","traditionally","briefly","wrongly"],"or":["accidentally(우연히): 우연히 개인 정보로 여겨졌다는 말은 권리의 정의로 어울리지 않음.","traditionally(전통적으로): 예로부터 보호받는 개인 정보로 여겨져 온 것을 지키는 게 사생활 권리라서 맞음.","briefly(잠깐): 잠깐만 개인 정보로 여겨진 정보를 지킨다는 건 권리의 기준이 될 수 없음.","wrongly(잘못): 잘못 개인 정보로 여겨진 정보를 지킨다면 권리의 뜻이 무너짐."],"om":["우연히","전통적으로","잠깐","잘못"],"en":"The right to privacy is, among other things, the right for information traditionally regarded as protected or personal not to be revealed.","ko":"사생활 권리는 무엇보다도, 전통적으로 보호받거나 개인적인 것으로 여겨지는 정보가 공개되지 않을 권리이다.","hl":["traditionally regarded as protected or personal","not to be revealed"],"khl":["전통적으로 보호받거나 개인적인 것으로","공개되지 않을 권리"],"blocks":[{"t":"p","h":"rarely(좀처럼 ~않는)를 넣고 다시 읽기","x":["\"개인적인 것으로 좀처럼 여겨지지 않는 정보가 공개되지 않을 권리\"가 된다.","별로 개인적이지도 않은 정보를 숨겨 주는 권리라는 말이다.","사생활 권리가 지키는 건 정반대로 늘 개인적이라고 여겨진 정보다."]},{"t":"p","h":"권리의 기준은 오랜 약속","x":["일기, 건강 기록, 가족 이야기.","사람들이 예로부터 '남이 보면 안 되는 것'이라고 여겨 온 정보들이다.","traditionally(전통적으로)는 그 오랜 약속을 가리킨다."]}],"post":["traditionally(전통적으로) ↔ rarely(좀처럼 ~않는)","사생활 권리 = 예로부터 개인적이라 여겨진 정보 지키기"]},{"slots":[["revealed","disclosed","s"],["motivation"],["recognized","acknowledged","s"],["eventually","never","a"],["supporting"]],"opts":["secretly","barely","nervously","eventually"],"or":["secretly(몰래): 전과가 몰래 효력을 다한다는 건 나라가 공식적으로 인정한 원칙과 맞지 않음.","barely(거의 ~않게): '거의 효력을 다하지 않다'가 되어 뒤의 not continue to affect(계속 영향을 미치지 않다)와 부딪침.","nervously(초조하게): 전과가 초조하게 효력을 다한다는 말은 뜻이 통하지 않음.","eventually(결국): 일정 시간이 지나 '결국에는' 효력을 다해야 한다는 뜻이라 not continue(계속 ~않다)와 짝이 맞음."],"om":["몰래","거의 ~않게","초조하게","결국"],"en":"even past criminal convictions should eventually be “spent” and not continue to affect a person’s life.","ko":"과거의 유죄 판결조차 결국에는 '효력을 다해야' 하며, 한 사람의 삶에 계속 영향을 미쳐서는 안 된다.","hl":["should eventually be “spent”","not continue to affect"],"khl":["결국에는 '효력을 다해야'","계속 영향을 미쳐서는 안 된다"],"blocks":[{"t":"flow","h":"전과 기록의 시간표","x":["범죄로 유죄 판결","일정 기간 기록이 남음","시간이 흐름","결국 효력을 다함, spent(효력을 다한)","새 삶을 이어 감"],"at":3},{"t":"p","h":"never(결코 ~않는)가 만드는 모순","x":["never(결코 ~않는)를 넣으면 \"전과는 결코 효력을 다해선 안 된다\"가 된다.","그런데 and(그리고) 뒤는 \"삶에 계속 영향을 미치지 않아야 한다\"이다.","끝나면 안 되는데 계속 영향을 주면 안 된다. 앞뒤가 부딪친다.","잊힐 권리의 예시로도 정반대다."]},{"t":"p","h":"그대로 두는 두 단어","x":["disclosed(공개된)는 revealed(공개된) 자리에, acknowledged(인정된)는 recognized(인정된) 자리에 들어가도 뜻이 같다."]}],"post":["eventually(결국) ↔ never(결코 ~않는)","전과도 시간이 지나면 결국 끝"]}],"quiz":[{"w":"public","m":"공공의, 공개된","it":[["open","공개된","s"],["fluffy","폭신한","n"],["private","사적인","a"],["spicy","매운","n"],["communal","공동의","s"],["confidential","기밀의","a"],["musical","음악적인","n"]]},{"w":"allow","m":"허락하다, ~하게 해 주다","it":[["whistle","휘파람 불다","n"],["permit","허락하다","s"],["forbid","금지하다","a"],["iron","다림질하다","n"],["let","~하게 하다","s"],["prohibit","금지하다","a"],["dig","파다","n"]]},{"w":"conflict","m":"충돌, 갈등","it":[["clash","충돌","s"],["telescope","망원경","n"],["harmony","조화","a"],["pillow","베개","n"],["friction","마찰, 불화","s"],["agreement","합의, 일치","a"],["carpet","카펫","n"]]},{"w":"traditionally","m":"전통적으로, 예로부터","it":[["sideways","옆으로","n"],["conventionally","관례적으로","s"],["unconventionally","관례에서 벗어나","a"],["underwater","물속에서","n"],["customarily","관습적으로","s"],["unusually","이례적으로","a"],["angrily","화내며","n"]]},{"w":"eventually","m":"결국, 마침내","it":[["ultimately","결국, 궁극적으로","s"],["politely","공손하게","n"],["immediately","즉시","a"],["outdoors","야외에서","n"],["finally","마침내","s"],["instantly","즉각","a"],["nearby","근처에","n"]]}]}],"no":"36"},{"id":"2211g2-37","title":"어휘특훈 · 22년 11월 고2 37번","sub":"출생률을 움직이는 것은 기호인가 가격인가","tpl":"To an economist who succeeds in figuring out a person’s preference structure — understanding whether the satisfaction gained from consuming one good is greater than that of another — explaining behavior in terms of changes in {underlying} likes and dislikes is usually highly {problematic}. To argue, for instance, that the baby boom and then the baby bust resulted from {an_increase} and then a {decrease} in the public’s {inherent} {taste} for children, rather than a change in relative prices against a background of {stable} preferences, places a social scientist in an {unsound} position. In economics, such an argument about birth rates would be {equivalent} to saying that a rise and fall in {mortality} could be {attributed} to an increase in the inherent desire change for {death}. For an economist, changes in income and prices, {rather_than} changes in tastes, {affect} birth rates. When income {rises}, for example, people want {more} children (or, as you will see later, more satisfaction {derived} from children), even if their inherent desire for children {stays_the_same}.","fn":["*preference structure: 선호 구조","*baby boom: 베이비붐(출생아 수의 급증)","*baby bust: 출생아 수의 급감"],"mean":{"underlying":"기저에 있는, 근본적인","fundamental":"근본적인","superficial":"피상적인, 겉만 스치는","problematic":"문제가 많은","questionable":"의심스러운, 문제가 있는","convincing":"설득력 있는","an increase":"증가","a rise":"증가, 상승","a decline":"감소, 하락","decrease":"감소","surge":"급증","inherent":"타고난, 내재적인","innate":"타고난, 선천적인","taste":"기호, 좋아함(여기서는 '맛'이 아님)","fondness":"좋아함, 애정","distaste":"싫어함, 혐오","stable":"안정된, 변함없는","steady":"꾸준한, 변함없는","shifting":"동사 shift(바뀌다)의 -ing형. 변하는","unsound":"근거가 약한, 불안정한","untenable":"지지하기 힘든, 옹호할 수 없는","advantageous":"유리한","equivalent":"같은, 동등한","comparable":"비슷한, 견줄 만한","contrary":"반대되는","mortality":"사망률","death rates":"명사 death rate(사망률)의 복수형","fertility":"출산율, 생식력","attributed":"동사 attribute(~의 탓으로 돌리다)의 과거분사형","ascribed":"동사 ascribe(~의 탓으로 돌리다)의 과거분사형","death":"죽음","life":"삶, 생명","rather than":"~이 아니라, ~보다는","instead of":"~ 대신에","as well as":"~뿐만 아니라 ~도","affect":"영향을 주다","influence":"영향을 주다","rises":"동사 rise(오르다)의 3인칭 단수형","increases":"동사 increase(늘다)의 3인칭 단수형","more":"더 많은","derived":"동사 derive(얻다, 끌어내다)의 과거분사형. ~에서 얻어진","obtained":"동사 obtain(얻다)의 과거분사형. 얻어진","stays the same":"그대로이다(stay the same의 3인칭 단수형)","remains unchanged":"변하지 않은 채로 있다","fluctuates":"동사 fluctuate(오르내리다)의 3인칭 단수형"},"comp":[{"no":"37","slots":[["problematic"],["decrease","surge","a"],["inherent"],["attributed"],["derived","obtained","s"]],"opts":["decrease","boost","revival","recovery"],"or":["decrease(감소): baby bust(출생아 급감)와 짝이 되어 아이를 원하는 마음이 줄었다는 주장이 되므로 맞음.","boost(끌어올림, 증가): 기호가 올라갔는데 출생아가 급감했다는 말이 되어 방향이 거꾸로임.","revival(부활): 기호가 되살아났다면 출생아가 늘어야지 급감할 수 없음.","recovery(회복): 기호가 회복된 결과가 출생아 급감이라는 건 앞뒤가 안 맞음."],"om":["감소","끌어올림, 증가","부활","회복"],"en":"the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children","ko":"베이비붐과 그 뒤의 출생아 급감이 아이에 대한 대중의 타고난 기호가 늘었다가 줄어 rease(증가): baby boom(베이비붐)과 짝이 되어 아이를 원하는 마음이 늘었다는 주장이 되므로 맞음.","an absence(없음): 아이를 좋아하는 마음이 없었는데 아기가 쏟아졌다는 말이 되어 앞뒤가 안 맞음.","an erosion(약화): 기호가 약해졌는데 베이비붐이 왔다는 말이라 방향이 거꾸로임.","an illusion(착각): '늘었다가 줄었다'는 짜임이 깨져 붐과 급감의 짝이 사라짐."],"om":["증가","없음","약화","착각"],"en":"To argue, for instance, that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position.","ko":"예를 들어, 베이비붐과 그 뒤의 출생아 급감이 변함없는 선호를 배경으로 한 상대 가격의 변화 때문이 아니라 아이에 대한 대중의 타고난 기호가 늘었다가 줄었기 때문이라고 주장하면, 사회과학자는 근거가 약한 입장에 놓인다.","hl":["an increase and then a decrease","the baby boom and then the baby bust"],"khl":["늘었다가 줄었기","베이비붐과 그 뒤의 출생아 급감"],"blocks":[{"t":"pair","h":"순서대로 짝짓기","x":[["the baby boom","베이비붐 (아기가 많이 태어남)"],["an increase","증가 (아이를 좋아하는 마음이 늘어남)"],["the baby bust","출생아 급감 (아기가 확 줄어듦)"],["a decrease","감소 (아이를 좋아하는 마음이 줄어듦)"]]},{"t":"p","h":"a decline(감소)을 넣으면","x":["\"줄었다가 줄었다\"가 된다.","아기가 쏟아진 베이비붐이 아이를 좋아하는 마음이 줄어서 생겼다는 말이다.","앞뒤 짝이 완전히 어긋난다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","fundamental(근본적인)은 underlying(기저에 있는) 자리에 그대로 들어간다.","untenable(지지하기 힘든)도 unsound(근거가 약한)와 같은 쪽 말이다.","둘 다 고치지 않는다."]}],"post":["increase(증가) ↔ decline(감소)","베이비붐 = 아이 기호가 늘었다는 주장"]},{"slots":[["decrease"],["inherent","innate","s"],["stable","shifting","a"],["mortality"],["rises"]],"opts":["stable","chaotic","unknown","temporary"],"or":["stable(안정된): 선호는 그대로 두고 가격만 바뀐다는 경제학자의 그림이라 맞음.","chaotic(혼란스러운): 선호가 어지럽게 바뀐다면 기호 변화 설명을 비판할 근거가 사라짐.","unknown(알려지지 않은): 첫 문장의 경제학자는 선호 구조를 알아내는 데 성공한 사람이라 맞지 않음.","temporary(일시적인): 선호가 잠깐만 간다면 마지막 문장의 stays the same(그대로이다)과 부딪침."],"om":["안정된","혼란스러운","알려지지 않은","일시적인"],"en":"rather than a change in relative prices against a background of stable preferences","ko":"변함없는 선호를 배경으로 한 상대 가격의 변화 때문이 아니라","hl":["stable preferences","a change in relative prices"],"khl":["변함없는 선호","상대 가격의 변화"],"bl  for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same.","ko":"예를 들어 소득이 오르면, 아이에 대한 타고난 욕구가 그대로여도 사람들은 더 많은 아이(또는 나중에 보게 되겠지만, 아이에게서 얻는 더 많은 만족)를 원한다.","hl":["even if their inherent desire for children stays the same","When income rises"],"khl":["아이에 대한 타고난 욕구가 그대로여도","소득이 오르면"],"blocks":[{"t":"p","h":"even if(~이더라도)가 만드는 대비","x":["앞: 소득이 오르면 아이를 더 원한다.","뒤: 아이를 원하는 마음은 그대로여도.","바뀌는 건 소득이고, 그대로인 건 마음이다.","fluctuates(오르내리다)를 넣으면 마음도 바뀌는 셈이다.","그러면 아이를 더 원하는 이유가 소득인지 마음인지 알 수 없게 된다."]},{"t":"p","h":"세 군데 중 고칠 곳은 하나","x":["ascribed(~의 탓으로 돌려진)는 attributed(~의 탓으로 돌려진)와 같은 말이다.","increases(늘다)는 rises(오르다) 자리에 넣어도 뜻이 같다.","고칠 곳은 마지막 한 군데."]}],"post":["stay the same(그대로이다) ↔ fluctuate(오르내리다)","바뀌는 건 소득, 그대로인 건 마음"]}],"quiz":[{"w":"problematic","m":"문제가 많은","it":[["seasonal","계절의","n"],["troublesome","골칫거리인","s"],["unproblematic","문제없는","a"],["hollow","속이 빈","n"],["questionable","의심스러운, 문제가 있는","s"],["straightforward","간단한, 수월한","a"],["polite","공손한","n"]]},{"w":"increase","m":"증가","it":[["rise","증가, 상승","s"],["harvest","수확","n"],["decline","감소","a"],["ceiling","천장","n"],["growth","성장, 증가","s"],["reduction","축소, 감소","a"],["rumor","소문","n"]]},{"w":"stable","m":"안정된, 변함없는","it":[["edible","먹을 수 있는","n"],["steady","꾸준한, 변함없는","s"],["unstable","불안정한","a"],["rural","시골의","n"],["constant","일정한","s"],["volatile","변덕스러운, 불안정한","a"],["fluent","유창한","n"]]},{"w":"death","m":"죽음","it":[["demise","사망, 죽음","s"],["recipe","조리법","n"],["life","삶, 생명","a"],["luggage","짐","n"],["passing","죽음, 별세","s"],["birth","탄생","a"],["pottery","도자기","n"]]},{"w":"stay the same","m":"그대로이다","it":[["fall asleep","잠들다","n"],["remain unchanged","변하지 않은 채로 있다","s"],["change","변하다","a"],["take place","일어나다, 열리다","n"],["stay constant","일정하게 유지되다","s"],["fluctuate","오르내리다","a"],["show up","나타나다","n"]]}]},{"items":[{"slots":[["problematic","questionable","s"],["decrease"],["equivalent","contrary","a"],[" ,"마지못해","잘못하여"],"en":"Intuitively, animals also know to stay away from these plants. Years of evolution and information being passed down created this innate intelligence. This “intuition,” though, is not just seen in animals.","ko":"동물은 또한 직관적으로 이런 식물을 멀리할 줄 안다. 오랜 세월의 진화와 대대로 전해 내려온 정보가 이 타고난 지능을 만들어 냈다. 그런데 이 ‘직관’은 동물에게서만 보이는 것이 아니다.","hl":["Intuitively","This “intuition,”"],"khl":["직관적으로","이 ‘직관’"],"blocks":[{"t":"pair","h":"같은 것을 가리키는 말","x":[["Intuitively","직관적으로"],["this innate intelligence","이 타고난 지능"],["This “intuition,”","이 ‘직관’"],["our inner intelligence","우리 내면의 지능"]]},{"t":"tap","h":"질문 하나","q":"Consciously(의식적으로)를 넣으면 뒤의 ‘직관’은 무엇을 가리킬까?","a":["가리킬 것이 없다.","의식적으로 따져서 아는 건 직관이 아니다.","따옴표까지 붙여 다시 부르는 말이니, 앞에 그 단어가 있어야 한다."]}],"post":["intuitively(직관적으로) ↔ consciously(의식적으로)","타고난 지능 = 직관 = 내면의 지능"]},{"slots":[["hate","dislike","s"],["justifies","explains","s"],["fragile"],["disgusting","delicious","a"],["suddenly"]],"opts":["tempting","pleasant","appetizing","disgusting"],"or":["tempting(유혹적인): '나쁘고 심지어 유혹적인'은 방향이 꺾여 even(심지어)과 안 맞음.","pleasant(기분 좋은): 몸이 채소를 멀리하게 하려는 목적과 반대임.","appetizing(식욕을 돋우는): 식욕을 돋우면 아이가 채소를 더 먹게 되어 보호 장치가 무너짐.","disgusting(역겨운): bad(나쁜)에 even(심지어)이 붙어 한 단계 더 센 부정이 와야 하므로 맞음."],"om":["유혹적인","기분 좋은","식욕을 돋우는","역겨운"],"en":"It does this by making your taste buds perceive these flavors as bad and even disgusting.","ko":"몸은 미뢰가 이 맛들을 나쁘고 심지어 역겹다고 느끼게 만들어서 그렇게 한다.","hl":["bad and even disgusting","perceive these flavors"],"khl":["나쁘고 심지어 역겹다고","이 맛들을"],"blocks":[{"t":"p","h":"even(심지어)의 계단","x":["even(심지어)은 앞말보다 한 칸 더 올라간다.","bad(나쁜) 다음에는 더 나쁜 말이 와야 한다.","delicious(맛있는)는 계단을 거꾸로 내려간다.","\"맛이 나쁘고 심지어 맛있다\"는 말이 안 된다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["dislike(싫어하다)는 hate(몹시 싫어하다)보다 약하지만 같은 방향이다.","explains(설명하다)는 justifies(이유를 대다)를 쉽게 바꾼 말이다.","여기서 justify(정당화하다)는 '그럴 만한 이유를 댄다'는 뜻에 가깝다."]}],"post":["disgusting(역겨운) ↔ delicious(맛있는)","미뢰가 채소 맛을 역겹게 = 몸의 보호 작전"]}],"quiz":[{"w":"hate","m":"몹시 싫어하다","it":[["polish","닦다","n"],["detest","몹시
