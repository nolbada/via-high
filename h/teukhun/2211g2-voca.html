<style>

*{box-sizing:border-box}

button{font:inherit;color:inherit}

button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}

.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}

.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}

.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}

and allows the viewer to {distinguish} its shape. Thus even if an animal is exactly, but {uniformly}, the same color as the substrate, it will be {easily} {visible} when illuminated. Most animals, however, are darker above than they are below. When they are illuminated from above, the darker back is {lightened} and the lighter belly is {shaded}. The animal thus appears to be a {single} color and easily {blends_in} with the substrate. This pattern of coloration, or countershading, {ruins} the visual impression of shape in the organism. It allows the animal to blend in with its background.","fn":["*countershading: 카운터셰이딩, 명암역위형 보호색","*substrate: (동물이 사는 곳의) 밑바탕, 바닥면","*coloration: 배색, 색깔 패턴"],"mean":{"optical":"시각의, 눈으로 보는","visual":"시각적인","flattening":"동사 flatten(평평하게 하다)의 -ing형. 평평하게 만들기(동명사)","deepening":"동사 deepen(깊게 하다)의 -ing형. 깊이감을 더하기(동명사)","provides":"동사 provide(제공하다)의 3인칭 단수형","denies":"동사 deny(주지 않다, 거부하다)의 3인칭 단수형","camouflage":"위장","visibility":"눈에 잘 보임, 가시성","illuminates":"동사 illuminate(비추다)의 3인칭 단수형","lights up":"동사구 light up(환하게 비추다)의 3인칭 단수형","brightest":"형용사 bright(밝은)의 최상급. 가장 밝은","dimmest":"형용사 dim(어둑한)의 최상급. 가장 어두운","lightest":"형용사 light(밝은)의 최상급. 가장 밝은","gradually":"점차, 서서히","progressively":"점진적으로, 차츰","darker":"형용사 dark(어두운)의 비교급. 더 어두운","lighter":"형용사 light(밝은)의 비교급. 더 밝은","depth":"깊이, 입체감","flatness":"평평함","distinguish":"구별하다, 알아보다","recognize":"알아보다","overlook":"못 보고 넘기다, 간과하다","uniformly":"균일하게, 한결같이","evenly":"고르게","easily":"쉽게","hardly":"거의 ~않게","readily":"손쉽게","visible":"눈에 보이는","noticeable":"눈에 띄는","hidden":"동사 hide(숨기다)의 과거분사형. 숨겨진","lightened":"동사 lighten(밝게 하다)의 과거분사형. 밝아진","darkened":"동사 darken(어둡게 하다)의 과거분사형. 어두워진","shaded":"동사 shade(음영을 넣다, 그늘지게 하다)의 과거분사형. 음영이 진","shadowed":"동사 shadow(그늘지게 하다)의 과거분사형. 그늘진","single":"하나의, 단일한","uniform":"한결같은, 균일한","blends in":"동사구 blend in(섞여 들다)의 3인칭 단수형","contrasts":"동사 contrast(대조를 이루다)의 3인칭 단수형","ruins":"동사 ruin(망가뜨리다)의 3인칭 단수형","enhances":"동사 enhance(강화하다)의 3인칭 단수형","breaks up":"동사구 break up(흐트러뜨리다, 깨뜨리다)의 3인칭 단수형"},"comp":[{"no":"30","slots":[["optical"],["camouflage","visibility","a"],["gradually"],["distinguish"],["shaded"]],"opts":["camouflage","exposure","attention","brightness"],"or":["camouflage(위장): 마지막 문장 \"배경에 섞여 들게 한다\"와 같은 뜻이라 맞음.","exposure(노출): 노출을 제공한다면 동물이 더 잘 드러나 결론과 반대임.","attention(주목): 주목을 끌게 한다는 건 배경에 섞여 숨는 것과 정반대임.","brightness(밝기): 밝기를 더해 주는 게 목적이라면 모양을 지운다는 글 내용과 이어지지 않음."],"om":["위장","노출","주목","밝기"],"en":"Countershading is the process of optical flattening that provides camouflage to animals. … It allows the animal to blend in with its background.","ko":"카운터셰이딩은 동물에게 위장을 제공하는, 눈으로 보기에 평평하게 만드는 과정이다. … 그것은 동물이 배경에 섞여 들게 해 준다.","hl":["provides camouflage","blend in with its background"],"khl":["위장을 제공하는","배경에 섞여 들게"],"blocks":[{"t":"p","h":"첫 줄과 마지막 줄 맞대기","x":["첫 줄: 카운터셰이딩은 동물에게 ___를 준다.","마지막 줄: 그것은 동물이 배경에 섞여 들게 한다.","배경에 섞여 드는 것 = camouflage(위장).","visibility(눈에 잘 보임)를 넣으면 첫 줄과 마지막 줄이 정반대 이야기를 한다."]},{"t":"p","h":"군복 무늬로 확인","x":["군복의 얼룩무늬도 camouflage(위장)다.","숲속에서 사람의 윤곽을 흐려 눈에 덜 띄게 한다.","동물의 등과 배 색 차이도 같은 일을 한다."]}],"post":["camouflage(위장) ↔ visibility(눈에 잘 보임)","카운터셰이딩 = 동물의 군복 무늬"]},{"no":"30","slots":[["brightest","lightest","s"],["depth"],["uniformly"],["visible","hidden","a"],["single"]],"opts":["concealed","unnoticed","disguised","visible"],"or":["concealed(숨겨진): 숨겨진다면 even if(~라 해도)가 만드는 반전이 사라짐.","unnoticed(눈에 띄지 않는): 눈에 안 띈다면 뒤에서 however(그러나)로 해결책을 꺼낼 필요가 없음.","disguised(위장된): 이미 위장된다면 카운터셰이딩을 따로 설명할 이유가 없음.","visible(눈에 보이는): 같은 색이라도 음영 때문에 잘 보인다는 even if(~라 해도)의 반전과 맞음."],"om":["숨겨진","눈에 띄지 않는","위장된","눈에 보이는"],"en":"Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated.","ko":"따라서 동물이 밑바탕과 정확히, 하지만 균일하게 같은 색이라 해도, 빛을 받으면 쉽게 눈에 띌 것이다.","hl":["easily visible when illuminated","even if"],"khl":["빛을 받으면 쉽게 눈에 띌","같은 색이라 해도"],"blocks":[{"t":"p","h":"even if(~라 해도)가 거는 반전","x":["even if(~라 해도)는 \"그럴 것 같지만 아니다\"를 만든다.","배경과 같은 색이면 숨을 것 같다.","하지만 음영 때문에 오히려 쉽게 보인다는 것이 이 문장의 반전이다.","hidden(숨겨진)을 넣으면 \"같은 색이라 해도 숨겨진다\"가 되어 반전이 사라진다."]},{"t":"p","h":"그대로 둘 단어","x":["lightest(가장 밝은)는 brightest(가장 밝은)와 같은 뜻이라 맞는 표현이다."]}],"post":["visible(눈에 보이는) ↔ hidden(숨겨진)","같은 색이어도 음영 때문에 들킴"]}],"compquiz":[{"w":"camouflage","m":"위장","it":[["disguise","변장, 위장","s"],["pottery","도자기","n"],["exposure","노출","a"],["concealment","숨김, 은폐","s"],["ambulance","구급차","n"],["display","드러내 보임, 전시","a"],["mailbox","우편함","n"]]},{"w":"visible","m":"눈에 보이는","it":[["noticeable","눈에 띄는","s"],["spicy","매운","n"],["invisible","보이지 않는","a"],["apparent","눈에 보이는, 분명한","s"],["monthly","매달의","n"],["hidden","숨겨진","a"],["delicious","맛있는","n"]]}],"sets":[{"items":[{"slots":[["flattening","deepening","a"],["brightest"],["depth"],["easily"],["single"]],"opts":["sharpening","highlighting","outlining","flattening"],"or":["sharpening(선명하게 만들기): 윤곽을 선명하게 하면 오히려 동물이 더 잘 보임.","highlighting(강조하기): 강조는 눈에 띄게 하는 일이라 위장과 반대임.","outlining(윤곽 그리기): 테두리를 그려 주면 모양이 또렷해져 배경에 섞일 수 없음.","flattening(평평하게 만들기): 입체감을 지워 모양이 안 보이게 한다는 글 결론과 맞음."],"om":["선명하게 만들기","강조하기","윤곽 그리기","평평하게 만들기"],"en":"Countershading is the process of optical flattening that provides camouflage to animals. … This pattern of coloration, or countershading, ruins the visual impression of shape in the organism.","ko":"카운터셰이딩은 동물에게 위장을 제공하는, 눈으로 보기에 평평하게 만드는 과정이다. … 이러한 배색 패턴, 즉 카운터셰이딩은 그 생물의 모양에 대한 시각적 인상을 망가뜨린다.","hl":["optical flattening","ruins the visual impression of shape"],"khl":["평평하게 만드는","모양에 대한 시각적 인상을 망가뜨린다"],"blocks":[{"t":"flow","h":"글 전체 지도","x":["정의: 카운터셰이딩 = 눈으로 보기에 평평하게 만들기","보통 물체: 위는 밝고 아래로 갈수록 어두움","그 음영 때문에 입체감이 생겨 모양이 보임","대부분의 동물: 등이 어둡고 배가 밝음","빛을 받으면 한 가지 색처럼 보여 배경에 섞임"],"at":0},{"t":"p","h":"첫 문장과 끝 문장은 같은 말","x":["첫 문장은 정의, 끝에서 두 번째 문장은 그 결과다.","결과는 모양의 인상을 망가뜨린다는 것.","모양이 안 보이게 하려면 입체감을 없애 납작해 보이게 해야 한다.","deepening(깊이감을 더하기)은 입체감을 키우는 쪽이라 정반대다."]}],"post":["flattening(평평하게 만들기) ↔ deepening(깊이감을 더하기)","카운터셰이딩 = 눈속임으로 납작하게"]},{"slots":[["brightest","dimmest","a"],["gradually","progressively","s"],["distinguish","recognize","s"],["lightened"],["ruins"]],"opts":["darkest","dullest","brightest","faintest"],"or":["darkest(가장 어두운): 빛을 정면으로 받는 윗면이 가장 어둡다는 말이라 모순임.","dullest(가장 칙칙한): 햇빛이 직접 닿는 곳이 가장 칙칙하다는 말은 다음 문장과 맞지 않음.","brightest(가장 밝은): 빛이 위에서 오니 맨 위가 가장 밝고 아래로 갈수록 어두워진다는 흐름과 맞음.","faintest(가장 희미한): 빛이 가장 많이 닿는 곳이 가장 희미하다는 건 앞뒤가 거꾸로임."],"om":["가장 어두운","가장 칙칙한","가장 밝은","가장 희미한"],"en":"When sunlight illuminates an object from above, the object will be brightest on top. The color of the object will gradually shade darker toward the bottom.","ko":"햇빛이 위에서 물체를 비추면 그 물체는 맨 위가 가장 밝을 것이다. 물체의 색은 아래쪽으로 갈수록 점점 더 어둡게 음영이 질 것이다.","hl":["brightest on top","from above"],"khl":["맨 위가 가장 밝을","위에서"],"blocks":[{"t":"tap","h":"손전등 실험","q":"공 위에서 손전등을 비추면 어디가 가장 밝을까?","a":["빛이 닿는 맨 위.","아래로 내려갈수록 빛이 덜 닿아 어두워진다.","dimmest(가장 어두운)를 넣으면 빛 받는 곳이 가장 어둡다는 말이 된다.","바로 다음 문장 \"아래로 갈수록 더 어두워진다\"와도 부딪친다."]},{"t":"p","h":"두 단어는 그대로","x":["progressively(점진적으로)는 gradually(점차)와 같은 뜻이다.","recognize(알아보다)는 distinguish(구별하다) 자리에 넣어도 \"모양을 알아본다\"로 자연스럽다."]}],"post":["brightest(가장 밝은) ↔ dimmest(가장 어두운)","빛 오는 쪽 = 가장 밝은 쪽"]},{"slots":[["provides"],["darker"],["depth","flatness","a"],["uniformly","evenly","s"],["blends_in"]],"opts":["plainness","blankness","depth","smoothness"],"or":["plainness(밋밋함): 밋밋해 보이면 모양을 구별하기 오히려 어려워짐.","blankness(텅 빈 느낌): 텅 빈 느낌으로는 모양을 알아볼 수 없어 and(그리고) 뒤와 부딪침.","depth(입체감): 음영이 입체감을 줘서 모양이 구별된다는 원인과 결과가 맞음.","smoothness(매끄러움): 표면의 매끄러움은 음영이 만드는 효과가 아니고 모양 구별과도 이어지지 않음."],"om":["밋밋함","텅 빈 느낌","입체감, 깊이","매끄러움"],"en":"This shading gives the object depth and allows the viewer to distinguish its shape.","ko":"이 음영은 물체에 입체감을 주고, 보는 사람이 그 모양을 구별할 수 있게 해 준다.","hl":["gives the object depth","distinguish its shape"],"khl":["물체에 입체감을 주고","그 모양을 구별할"],"blocks":[{"t":"p","h":"미술 시간 떠올리기","x":["동그라미만 그리면 납작한 원이다.","한쪽을 어둡게 칠하면 갑자기 공처럼 보인다.","음영이 입체감을 만든다는 말이 이것이다.","flatness(평평함)를 넣으면 음영이 물체를 납작하게 만든다는 말이 된다.","납작해 보이는데 모양이 잘 구별된다는 뒷부분과도 안 맞는다."]},{"t":"pair","h":"and(그리고)로 묶인 두 결과","x":[["gives the object depth","물체에 입체감을 준다"],["allows the viewer to distinguish its shape","보는 사람이 모양을 구별하게 한다"]]},{"t":"p","h":"함정","x":["evenly(고르게)는 uniformly(균일하게)와 같은 뜻이라 고치지 않는다."]}],"post":["depth(입체감, 깊이) ↔ flatness(평평함)","음영 → 입체감 → 모양이 보임"]},{"slots":[["camouflage"],["illuminates"],["easily","hardly","a"],["shaded"],["single"]],"opts":["easily","rarely","barely","seldom"],"or":["easily(쉽게): 음영 때문에 모양이 드러나니 배경과 같은 색이어도 잘 보인다는 Thus(따라서)의 흐름과 맞음.","rarely(드물게): 드물게 보인다면 뒤에서 however(그러나)로 해결책을 꺼낼 이유가 없음.","barely(간신히): 간신히 보인다는 건 음영이 모양을 드러낸다는 앞 문장과 이어지지 않음.","seldom(좀처럼 ~않게): 좀처럼 안 보인다면 이미 위장이 된 셈이라 카운터셰이딩이 필요 없음."],"om":["쉽게","드물게","간신히","좀처럼 ~않게"],"en":"Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated. Most animals, however, are darker above than they are below.","ko":"따라서 동물이 밑바탕과 정확히, 하지만 균일하게 같은 색이라 해도, 빛을 받으면 쉽게 눈에 띌 것이다. 그러나 대부분의 동물은 아랫부분보다 윗부분이 더 어둡다.","hl":["easily visible","Thus","however"],"khl":["쉽게 눈에 띌","따라서","그러나"],"blocks":[{"t":"p","h":"Thus(따라서)가 이어 주는 말","x":["바로 앞 문장: 음영 때문에 모양이 구별된다.","Thus(따라서) 뒤: 그러니 배경과 같은 색이어도 빛을 받으면 쉽게 보인다.","색이 같아도 음영이 생겨 입체가 드러나기 때문이다.","hardly(거의 ~않게)를 넣으면 \"따라서 거의 안 보인다\"가 되어 앞 문장과 이어지지 않는다."]},{"t":"p","h":"however(그러나)가 한 번 더 확인","x":["다음 문장은 however(그러나)로 방향을 튼다.","\"그런데 대부분의 동물은 다르게 생겼다\"는 반전이다.","반전이 필요하다는 건 앞 문장이 \"잘 보인다\"는 문제였다는 뜻이다."]}],"post":["easily(쉽게) ↔ hardly(거의 ~않게)","배경색과 같아도 음영 때문에 잘 보임"]},{"slots":[["optical","visual","s"],["gradually"],["visible","noticeable","s"],["blends_in","contrasts","a"],["ruins"]],"opts":["stands_out","sticks_out","clashes","blends_in"],"or":["stands out(눈에 띄다): 한 가지 색으로 보여 입체감이 사라졌는데 눈에 띈다는 건 앞뒤가 반대임.","sticks out(튀어 보이다): 튀어 보인다면 위장이 실패한 것이라 마지막 문장과 부딪침.","clashes(어울리지 않다): 배경과 어울리지 않는다는 말은 위장을 설명하는 글의 결론과 반대임.","blends in(섞여 들다): 한 가지 색처럼 보이면 배경과 구별되지 않는다는 결과와 맞음."],"om":["눈에 띄다","튀어 보이다","어울리지 않다","섞여 들다"],"en":"The animal thus appears to be a single color and easily blends in with the substrate.","ko":"그래서 그 동물은 한 가지 색으로 보이고 밑바탕에 쉽게 섞여 든다.","hl":["easily blends in with the substrate","a single color"],"khl":["밑바탕에 쉽게 섞여 든다","한 가지 색으로"],"blocks":[{"t":"pair","h":"원인과 결과 나란히","x":[["appears to be a single color","한 가지 색으로 보인다 (원인)"],["blends in with the substrate","밑바탕에 섞여 든다 (결과)"]]},{"t":"p","h":"contrasts(대조를 이루다)가 깨는 것","x":["음영이 사라져 한 가지 색처럼 보이면 입체감도 사라진다.","입체감이 없으면 배경과 구별이 안 된다.","contrasts(대조를 이루다)를 넣으면 배경과 확 대비된다는 말이 된다.","마지막 문장 It allows the animal to blend in with its background(그것은 동물이 배경에 섞여 들게 한다)와도 정면으로 부딪친다."]},{"t":"p","h":"함정 둘","x":["visual(시각적인)은 optical(시각의)과 같은 뜻이다.","noticeable(눈에 띄는)은 visible(눈에 보이는) 자리에서 \"쉽게 눈에 띈다\"로 그대로 통한다."]}],"post":["blend in(섞여 들다) ↔ contrast(대조를 이루다)","한 가지 색처럼 보임 → 배경 속으로 쏙"]}],"quiz":[{"w":"flatten","m":"평평하게 하다","it":[["level","평평하게 하다","s"],["vote","투표하다","n"],["crumple","구기다","a"],["smooth","매끄럽게 펴다","s"],["gossip","수다 떨다","n"],["roughen","거칠게 만들다","a"],["apologize","사과하다","n"]]},{"w":"bright","m":"밝은","it":[["radiant","빛나는, 환한","s"],["salty","짠","n"],["dim","어둑한, 흐릿한","a"],["brilliant","눈부신, 아주 밝은","s"],["loyal","충실한","n"],["dark","어두운","a"],["annual","해마다의","n"]]},{"w":"depth","m":"깊이, 입체감","it":[["deepness","깊음, 깊이","s"],["luggage","짐, 수하물","n"],["shallowness","얕음","a"],["profundity","깊이, 깊음","s"],["thunder","천둥","n"],["flatness","평평함","a"],["receipt","영수증","n"]]},{"w":"easily","m":"쉽게","it":[["effortlessly","힘들이지 않고","s"],["abroad","해외에","n"],["laboriously","힘겹게","a"],["readily","손쉽게","s"],["upstairs","위층에","n"],["strenuously","힘들여, 애써서","a"],["nearby","근처에","n"]]},{"w":"blend in","m":"섞여 들다, 어우러지다","it":[["fit in","어울리다, 잘 맞다","s"],["call off","취소하다","n"],["stand out","눈에 띄다","a"],["merge","합쳐지다, 녹아들다","s"],["put away","치우다","n"],["stick out","튀다, 두드러지다","a"],["look after","돌보다","n"]]}]},{"items":[{"slots":[["provides"],["depth"],["visible"],["lightened"],["ruins","enhances","a"]],"opts":["strengthens","sharpens","ruins","reveals"],"or":["strengthens(강화하다): 모양 인상을 강화하면 동물이 더 잘 보여 위장이 실패함.","sharpens(선명하게 하다): 모양을 또렷하게 하면 배경에 섞여 들 수 없음.","ruins(망가뜨리다): 모양 인상이 망가져야 배경에 섞인다는 마지막 문장과 맞음.","reveals(드러내다): 모양을 드러내는 배색은 위장이 아니라 광고판 노릇을 함."],"om":["강화하다","선명하게 하다","망가뜨리다","드러내다"],"en":"This pattern of coloration, or countershading, ruins the visual impression of shape in the organism. It allows the animal to blend in with its background.","ko":"이러한 배색 패턴, 즉 카운터셰이딩은 그 생물의 모양에 대한 시각적 인상을 망가뜨린다. 그것은 동물이 배경에 섞여 들게 해 준다.","hl":["ruins the visual impression of shape","blend in with its background"],"khl":["모양에 대한 시각적 인상을 망가뜨린다","배경에 섞여 들게"],"blocks":[{"t":"p","h":"위장은 모양을 지우는 기술","x":["포식자는 동물의 모양을 보고 먹잇감을 알아챈다.","모양이 흐려지면 그냥 배경의 일부로 보인다.","그래서 카운터셰이딩은 모양의 인상을 망가뜨린다.","enhances(강화하다)를 넣으면 모양을 더 또렷하게 만든다는 말이 된다.","바로 뒤 \"배경에 섞여 들게 한다\"와 정반대다."]},{"t":"tap","h":"한 줄 요약","q":"카운터셰이딩을 한 줄로 줄이면?","a":["등은 어둡고 배는 밝은 몸 색으로, 위에서 오는 빛이 만든 음영을 지우는 것.","음영이 지워지면 입체감도 모양도 사라진다."]}],"post":["ruin(망가뜨리다) ↔ enhance(강화하다)","모양 지우기 = 배경 속으로 숨기"]},{"slots":[["illuminates","lights up","s"],["darker","lighter","a"],["easily"],["shaded","shadowed","s"],["blends_in"]],"opts":["paler","darker","brighter","whiter"],"or":["paler(더 옅은): 아래로 갈수록 옅어지면 위가 가장 밝다는 앞 문장과 어긋남.","darker(더 어두운): 맨 위가 가장 밝으니 아래로 갈수록 어두워져야 맞음.","brighter(더 밝은): 아래가 더 밝아지면 맨 위가 가장 밝다는 말이 거짓이 됨.","whiter(더 하얀): 아래로 갈수록 하얘진다면 빛이 위에서 온다는 설정과 맞지 않음."],"om":["더 옅은","더 어두운","더 밝은","더 하얀"],"en":"When sunlight illuminates an object from above, the object will be brightest on top. The color of the object will gradually shade darker toward the bottom.","ko":"햇빛이 위에서 물체를 비추면 그 물체는 맨 위가 가장 밝을 것이다. 물체의 색은 아래쪽으로 갈수록 점점 더 어둡게 음영이 질 것이다.","hl":["shade darker toward the bottom","brightest on top"],"khl":["더 어둡게 음영이 질","맨 위가 가장 밝을"],"blocks":[{"t":"pair","h":"위와 아래 짝 맞추기","x":[["on top","위쪽: 가장 밝음"],["toward the bottom","아래쪽: 점점 더 어두움"]]},{"t":"p","h":"lighter(더 밝은)가 틀린 이유","x":["위가 가장 밝다고 했다.","그렇다면 아래로 갈수록 밝아질 수 없다.","lighter(더 밝은)를 넣으면 아래가 위보다 밝아져 \"가장 밝다\"가 거짓말이 된다.","이 자연스러운 음영이 뒤에서 카운터셰이딩이 지워야 할 대상이다."]},{"t":"p","h":"이번 함정","x":["lights up(환하게 비추다)은 illuminates(비추다)와 같은 그림이다.","shadowed(그늘진)는 shaded(음영이 진)와 같은 뜻이다."]}],"post":["darker(더 어두운) ↔ lighter(더 밝은)","보통 물체 = 위는 밝고 아래로 어두워짐"]},{"slots":[["optical"],["provides","denies","a"],["distinguish"],["single","uniform","s"],["ruins"]],"opts":["removes","withholds","refuses","provides"],"or":["removes(없애다): 위장을 없애는 과정이라면 배경에 섞인다는 결론과 반대임.","withholds(주지 않다): 위장을 주지 않는다면 이 글이 설명하는 효과가 사라짐.","refuses(거부하다): 위장을 거부한다는 말은 배경에 섞여 숨는 결과와 정반대임.","provides(제공하다): 끝에서 배경에 섞이게 한다고 했으니 위장을 제공한다는 정의가 맞음."],"om":["없애다","주지 않다","거부하다","제공하다"],"en":"Countershading is the process of optical flattening that provides camouflage to animals.","ko":"카운터셰이딩은 동물에게 위장을 제공하는, 눈으로 보기에 평평하게 만드는 과정이다.","hl":["provides camouflage to animals","optical flattening"],"khl":["동물에게 위장을 제공하는","평평하게 만드는"],"blocks":[{"t":"p","h":"정의 문장은 글 전체의 결론","x":["글 끝에서 카운터셰이딩은 동물을 배경에 섞이게 한다고 했다.","배경에 섞이는 것이 바로 camouflage(위장)다.","그러니 첫 문장에서 위장을 준다고 정의해야 앞뒤가 맞는다.","denies(주지 않다)를 넣으면 \"위장을 빼앗는 과정\"이 되어 결론과 거꾸로다."]},{"t":"p","h":"그대로 둘 단어","x":["uniform(한결같은)은 single(하나의) 자리에서 \"한 가지 색으로 고르게 보인다\"는 뜻이 된다.","색이 하나로 보인다는 방향이 같아 고치지 않는다."]}],"post":["provide(제공하다) ↔ deny(주지 않다)","정의 = 위장을 주는 눈속임"]},{"slots":[["flattening"],["brightest"],["gradually"],["uniformly"],["lightened","darkened","a"]],"opts":["lightened","deepened","dimmed","blackened"],"or":["lightened(밝아진): 빛을 받는 어두운 등이 밝아져야 위아래 색이 비슷해짐.","deepened(짙어진): 등이 더 짙어지면 위아래 차이가 커져 한 가지 색으로 보일 수 없음.","dimmed(흐려진): 빛을 정면으로 받는 등이 흐려진다는 건 빛의 성질과 맞지 않음.","blackened(검게 된): 등이 검게 되면 밝은 배와 차이가 더 벌어져 위장이 깨짐."],"om":["밝아진","짙어진","흐려진","검게 된"],"en":"Most animals, however, are darker above than they are below. When they are illuminated from above, the darker back is lightened and the lighter belly is shaded.","ko":"그러나 대부분의 동물은 아랫부분보다 윗부분이 더 어둡다. 위에서 빛을 받으면 더 어두운 등은 밝아지고, 더 밝은 배에는 음영이 진다.","hl":["the darker back is lightened","the lighter belly is shaded"],"khl":["더 어두운 등은 밝아지고","더 밝은 배에는 음영이 진다"],"blocks":[{"t":"flow","h":"두 색이 만나 하나가 되는 과정","x":["타고난 색: 등은 어둡고 배는 밝다","위에서 빛이 온다","어두운 등은 빛을 받아 밝아진다","밝은 배는 그늘이 져서 어두워진다","결국 위아래가 비슷한 한 가지 색"],"at":2},{"t":"p","h":"darkened(어두워진)를 넣고 다시 읽기","x":["\"어두운 등이 더 어두워지고, 밝은 배는 그늘이 진다\"가 된다.","등도 배도 어두워질 뿐, 위아래 차이는 그대로 남는다.","다음 문장 \"한 가지 색으로 보인다\"가 성립하지 않는다.","빛을 정면으로 받는 쪽이 밝아지는 것은 상식이기도 하다."]}],"post":["lighten(밝게 하다) ↔ darken(어둡게 하다)","어두운 등 + 위에서 오는 빛 = 밝아진 등"]},{"slots":[["camouflage"],["distinguish","overlook","a"],["easily","readily","s"],["lightened"],["ruins","breaks up","s"]],"opts":["distinguish","ignore","forget","mistake"],"or":["distinguish(구별하다): 음영이 입체감을 줘서 모양을 알아보게 한다는 and(그리고) 앞뒤 연결과 맞음.","ignore(무시하다): 입체감이 생겼는데 모양을 무시하게 된다는 건 원인과 결과가 어긋남.","forget(잊다): 음영이 모양을 잊게 한다는 말은 바로 뒤 \"쉽게 눈에 띈다\"와 부딪침.","mistake(잘못 알다): 음영은 모양을 정확히 보이게 하는 장치라 잘못 알게 한다는 말과 반대임."],"om":["구별하다","무시하다","잊다","잘못 알다"],"en":"This shading gives the object depth and allows the viewer to distinguish its shape. Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated.","ko":"이 음영은 물체에 입체감을 주고, 보는 사람이 그 모양을 구별할 수 있게 해 준다. 따라서 동물이 밑바탕과 정확히, 하지만 균일하게 같은 색이라 해도, 빛을 받으면 쉽게 눈에 띌 것이다.","hl":["distinguish its shape","easily visible"],"khl":["그 모양을 구별할","쉽게 눈에 띌"],"blocks":[{"t":"tap","h":"질문 하나","q":"배경과 똑같은 색의 동물이 왜 쉽게 보일까?","a":["몸에 음영이 생겨 입체감이 드러나기 때문이다.","입체감이 있으면 보는 사람이 모양을 구별할 수 있다.","overlook(못 보고 넘기다)을 넣으면 음영 때문에 모양을 놓친다는 말이 된다.","그러면 Thus(따라서) 뒤의 \"쉽게 눈에 띈다\"가 근거를 잃는다."]},{"t":"p","h":"이번 함정 둘","x":["readily(손쉽게)는 easily(쉽게)와 같은 뜻이다.","breaks up(흐트러뜨리다)은 ruins(망가뜨리다) 자리에서 \"모양의 인상을 흐트러뜨린다\"가 되어 같은 방향이다.","바뀐 단어가 셋이지만 고칠 곳은 하나."]}],"post":["distinguish(구별하다) ↔ overlook(못 보고 넘기다)","음영 → 입체감 → 모양 구별"]}],"quiz":[{"w":"ruin","m":"망가뜨리다","it":[["destroy","파괴하다","s"],["whistle","휘파람 불다","n"],["restore","복구하다","a"],["spoil","망치다","s"],["bake","굽다","n"],["repair","수리하다","a"],["purchase","구입하다","n"]]},{"w":"dark","m":"어두운","it":[["dim","어둑한","s"],["thirsty","목마른","n"],["bright","밝은","a"],["shadowy","그늘진, 어둑한","s"],["weekly","매주의","n"],["light","밝은, 환한","a"],["polite","공손한","n"]]},{"w":"provide","m":"제공하다","it":[["supply","공급하다","s"],["sneeze","재채기하다","n"],["withhold","주지 않다, 보류하다","a"],["offer","제공하다","s"],["kneel","무릎 꿇다","n"],["deprive","빼앗다","a"],["skate","스케이트 타다","n"]]},{"w":"lighten","m":"밝게 하다","it":[["brighten","밝게 하다","s"],["harvest","수확하다","n"],["darken","어둡게 하다","a"],["illuminate","밝히다, 비추다","s"],["memorize","암기하다","n"],["dim","흐리게 하다","a"],["wrap","포장하다, 싸다","n"]]},{"w":"distinguish","m":"구별하다, 알아보다","it":[["differentiate","구별하다","s"],["sweep","쓸다","n"],["confuse","혼동하다","a"],["discern","분별하다, 알아보다","s"],["sew","바느질하다","n"],["mix up","혼동하다","a"],["jog","조깅하다","n"]]}]}],"no":"30"},{"id":"2211g2-31","title":"어휘특훈 · 22년 11월 고2 31번","sub":"놀람이 학습을 만든다","tpl":"No learning is possible without an error signal. Organisms only learn when events {violate} their expectations. In other words, surprise is one of the {fundamental} drivers of learning. Imagine hearing a series of {identical} notes, AAAAA. Each note {draws_out} a response in the auditory areas of your brain — but as the notes repeat, those responses {progressively} {decrease}. This is called “adaptation,” a {deceptively} simple phenomenon that shows that your brain is learning to {anticipate} the next event. Suddenly, the note changes: AAAAA#. Your primary auditory cortex {immediately} shows a {strong} surprise reaction: not only does the adaptation {fade_away}, but {additional} neurons begin to {vigorously} fire in response to the {unexpected} sound. And it is not just repetition that leads to adaptation: what matters is whether the notes are {predictable}. For instance, if you hear an {alternating} set of notes, such as ABABA, your brain {gets_used_to} this alternation, and the activity in your auditory areas again decreases. This time, however, it is an unexpected repetition, such as ABABB, that {triggers} a surprise response.","fn":["*organism: 유기체, 생물","*auditory cortex: 청각 피질(소리를 처리하는 뇌 부위)","*adaptation: 적응","*fire: (신경 세포가) 신호를 보내다"],"mean":{"violate":"어기다, 위반하다","fulfill":"충족시키다, 이루다","defy":"거스르다, 무시하다","fundamental":"근본적인","essential":"필수적인, 본질적인","trivial":"사소한, 하찮은","identical":"똑같은, 동일한","varied":"다양한, 가지각색의","draws out":"동사구 draw out(끌어내다)의 3인칭 단수형","blocks":"동사 block(막다)의 3인칭 단수형","progressively":"점진적으로, 점점","gradually":"점차, 서서히","steadily":"꾸준히, 점점","decrease":"줄다, 감소하다","intensify":"강해지다, 심해지다","deceptively":"속을 만큼, 보기와 달리","seemingly":"겉보기에","anticipate":"예상하다, 미리 내다보다","predict":"예측하다","foresee":"예견하다, 내다보다","immediately":"즉시, 곧바로","instantly":"즉시, 순식간에","eventually":"결국에는, 마침내","strong":"강한","powerful":"강력한","faint":"희미한, 약한","fade away":"점점 사라지다","build up":"쌓이다, 커지다","additional":"추가의","extra":"추가의, 여분의","vigorously":"힘차게, 활발하게","energetically":"힘차게, 정력적으로","feebly":"힘없이, 약하게","unexpected":"예상하지 못한, 뜻밖의","familiar":"익숙한, 친숙한","predictable":"예측 가능한","foreseeable":"예측할 수 있는","alternating":"동사 alternate(번갈아 나오다)의 -ing형, 번갈아 나오는","unchanging":"변하지 않는","gets used to":"동사구 get used to(~에 익숙해지다)의 3인칭 단수형","triggers":"동사 trigger(일으키다, 촉발하다)의 3인칭 단수형","suppresses":"동사 suppress(억누르다)의 3인칭 단수형"},"comp":[{"no":"31","slots":[["violate"],["fundamental","trivial","a"],["identical"],["decrease"],["anticipate","foresee","s"]],"opts":["minor","optional","accidental","fundamental"],"or":["minor(사소한): 없으면 학습이 아예 안 되는 것을 사소하다고 할 수 없음.","optional(선택적인): No learning is possible(어떤 학습도 불가능하다)이라 했으니 있어도 그만 없어도 그만인 것이 아님.","accidental(우연한): 학습이 일어나는 원리를 설명하는 글이라 우연한 원동력은 맞지 않음.","fundamental(근본적인): 오류 신호 없이는 학습이 불가능하다는 앞 문장을 바꿔 말한 것이라 맞음."],"om":["사소한","선택적인","우연한","근본적인"],"en":"No learning is possible without an error signal. Organisms only learn when events violate their expectations. In other words, surprise is one of the fundamental drivers of learning.","ko":"어떤 학습도 오류 신호 없이는 불가능하다. 유기체는 사건이 자신의 기대를 어길 때에만 배운다. 다시 말해, 놀람은 학습의 근본적인 원동력 중 하나다.","hl":["fundamental drivers of learning","No learning is possible"],"khl":["근본적인 원동력","어떤 학습도"],"blocks":[{"t":"p","h":"In other words(다시 면 오류가 없어서 첫 문장과 부딪침.","violate(어기다): 앞 문장의 error signal(오류 신호)과 짝을 이뤄 예상이 빗나갈 때 배운다는 뜻이 되어 맞음.","match(들어맞다): 사건이 기대와 들어맞으면 놀람이 없어 다음 문장의 surprise(놀람)와 안 맞음.","confirm(확인해 주다): 기대를 확인해 주는 일은 예측 성공이라 오류 신호가 생기지 않음."],"om":["충족시키다","어기다","들어맞다","확인해 주다"],"en":"No learning is possible without an error signal. Organisms only learn when events violate their expectations.","ko":"어떤 학습도 오류 신호 없이는 불가능하다. 유기체는 사건이 자신의 기대를 어길 때에만 배운다.","hl":["violate their expectations","without an error signal"],"khl":["기대를 어길 때에만","오류 신호 없이는"],"blocks":[{"t":"flow","h":"이 단어가 서 있는 자리","x":["주장: 오류 신호 없이는 학습도 없음","다시 말해: 놀람이 학습을 움직임","예 1: 같은 음 반복 뒤 다른 음 → 놀람","예 2: 번갈아 나오던 음이 깨짐 → 놀람","결론: 예측이 깨질 때 뇌가 반응"],"at":0},{"t":"p","h":"fulfill(충족시키다)을 넣고 읽어 보기","x":["\"사건이 기대를 충족시킬 때에만 배운다\"가 된다.","그런데 바로 앞 문장은 오류 신호가 있어야 배운다고 했다.","오류란 예상이 빗나간 것이다.","예상대로 된 일에서는 오류가 생기지 않는다.","그래서 기대를 어겨야(violate = 어기다) 배운다."]}],"post":["violate(어기다) ↔ fulfill(충족시키다)","예상이 빗나갈 때 = 배우는 순간"]},{"slots":[["fundamental","essential","s"],["identical","varied","a"],["draws_out"],["progressively","gradually","s"],["deceptively"]],"opts":["random","contrasting","assorted","identical"],"or":["random(무작위의): 무작위 음이라면 한 글자만 계속 반복될 리 없음.","contrasting(대조되는): 서로 대조되는 음이라면 같은 음만 이어지는 예시와 어긋남.","assorted(갖가지의): 갖가지 음은 뒤의 as the notes repeat(음이 반복되면서)와 안 맞음.","identical(똑같은): 같은 글자 하나가 다섯 번 이어지는 예시 그대로라 맞음."],"om":["무작위의","대조되는","갖가지의","똑같은"],"en":"Imagine hearing a series of identical notes, AAAAA. Each note draws out a response in the auditory areas of your brain — but as the notes repeat, those responses progressively decrease.","ko":"똑같은 음이 이어지는 AAAAA를 듣는다고 상상해 보라. 각 음은 뇌의 청각 영역에서 반응을 끌어내지만, 음이 반복되면서 그 반응은 점점 줄어든다.","hl":["identical notes, AAAAA","as the notes repeat"],"khl":["똑같은 음","음이 반복되면서"],"blocks":[{"t":"p","h":"기호가 곧 답","x":["예시 기호는 같은 글자 하나가 다섯 번 이어진 것이다.","같은 음이 계속 반복된다는 뜻이다.","varied(다양한)를 넣으면 \"다양한 음\"이라고 해 놓고 같은 글자만 늘어놓은 셈이 된다.","눈앞의 기호와 단어가 서로 다른 말을 한다."]},{"t":"p","h":"뒤 문장도 확인","x":["바로 뒤에 as the notes repeat(음이 반복되면서)가 나온다.","반복된다는 건 같은 음이라는 증거다."]},{"t":"p","h":"함정","x":["essential(필수적인)은 fundamental(근본적인) 자리에 들어가도 뜻이 통한다.","gradually(점차)는 progressively(점진적으로)와 같은 뜻이다.","둘 다 그대로 두는 게 맞다."]}],"post":["identical(똑같은) ↔ varied(다양한)","같은 음의 반복 = 실험의 출발점"]},{"slots":[["draws_out"],["decrease","intensify","a"],["deceptively"],["anticipate","predict","s"],["immediately"]],"opts":["decrease","increase","persist","multiply"],"or":["decrease(줄다): 반복될수록 뇌가 익숙해져 반응이 줄어드는 '적응' 설명과 맞음.","increase(늘다): 반응이 늘면 뒤에 나오는 again decreases(다시 줄어든다)의 again(다시)이 설 자리가 없음.","persist(지속되다): 반응이 그대로 지속되면 but(하지만)으로 꺾을 이유가 없음.","multiply(크게 늘다): 반복할수록 반응이 불어나면 '적응'이 아니라 정반대 현상임."],"om":["줄다","늘다","지속되다","크게 늘다"],"en":"Each note draws out a response in the auditory areas of your brain — but as the notes repeat, those responses progressively decrease. This is called “adaptation,”","ko":"각 음은 뇌의 청각 영역에서 반응을 끌어내지만, 음이 반복되면서 그 반응은 점점 줄어든다. 이것을 '적응'이라고 부른다.","hl":["progressively decrease","but as the notes repeat"],"khl":["점점 줄어든다","음이 반복되면서"],"blocks":[{"t":"pair","h":"앞뒤 나란히 놓기","x":[["draws out a response","반응을 끌어낸다 (처음 들을 때)"],["those responses progressively decrease","그 반응이 점점 줄어든다 (반복된 뒤)"]]},{"t":"p","h":"but(하지만)이 정하는 방향","x":["but(하지만) 앞은 반응이 생긴다는 말이다.","but(하지만) 뒤는 그 반대 방향이어야 한다.","intensify(강해지다)를 넣으면 \"반응이 생기는데, 하지만 더 강해진다\"가 된다.","방향이 꺾이지 않아 but(하지만)이 쓸모없어진다."]},{"t":"p","h":"글 뒤쪽 증거","x":["번갈아 나오는 음 예시에서도 activity again decreases(활동이 다시 줄어든다)라고 한다.","again(다시)은 앞에서도 줄었다는 표시다.","predict(예측하다)는 anticipate(예상하다)와 같은 뜻이라 고치지 않는다."]}],"post":["decrease(줄다) ↔ intensify(강해지다)","같은 음 반복 = 반응이 점점 작아짐"]},{"slots":[["deceptively"],["immediately"],["strong","faint","a"],["additional"],["unexpected"]],"opts":["mild","delayed","strong","hidden"],"or":["mild(가벼운): 가벼운 반응이면 추가 뉴런이 vigorously(힘차게) 움직일 리 없음.","delayed(늦은): 바로 앞 immediately(즉시)와 부딪침.","strong(강한): 콜론 뒤 적응이 사라지고 뉴런이 힘차게 신호를 보내는 모습과 맞음.","hidden(숨겨진): 반응을 뚜렷이 shows(보인다)라고 했으니 숨겨졌다는 말과 안 맞음."],"om":["가벼운","늦은","강한","숨겨진"],"en":"Suddenly, the note changes: AAAAA#. Your primary auditory cortex immediately shows a strong surprise reaction: not only does the adaptation fade away, but additional neurons begin to vigorously fire","ko":"갑자기 음이 바뀐다. AAAAA#. 일차 청각 피질은 즉시 강한 놀람 반응을 보인다. 적응이 사라질 뿐 아니라, 추가 뉴런들이 힘차게 신호를 보내기 시작한다","hl":["a strong surprise reaction","Suddenly"],"khl":["강한 놀람 반응","갑자기"],"blocks":[{"t":"p","h":"콜론(:) 뒤가 증거","x":["콜론 뒤에 반응이 어떤지 풀어 놓았다.","적응은 사라지고, 추가 뉴런까지 힘차게 신호를 보낸다.","이건 크고 센 반응이다.","faint(희미한)를 넣으면 콜론 앞뒤가 서로 다른 말을 한다."]},{"t":"tap","h":"질문 하나","q":"같은 음만 듣다가 갑자기 다른 음이 들리면 뇌는 무덤덤할까?","a":["아니다.","예상이 깨진 순간이라 깜짝 놀란다.","이 글이 말하는 학습은 바로 이 놀람에서 시작된다."]}],"post":["strong(강한) ↔ faint(희미한)","갑자기 바뀐 음 = 뇌의 큰 놀람"]},{"slots":[["immediately","instantly","s"],["fade_away"],["additional","extra","s"],["vigorously","feebly","a"],["predictable"]],"opts":["vigorously","weakly","slowly","quietly"],"or":["vigorously(힘차게): 앞의 strong surprise reaction(강한 놀람 반응)을 구체적으로 보여 주는 말이라 맞음.","weakly(약하게): 약하게 신호를 보내면 strong(강한) 반응이라는 설명과 모순됨.","slowly(느리게): 즉시 강하게 반응한다는 흐름에서 느리게는 어울리지 않음.","quietly(조용히): 조용한 반응은 놀람이 아니라 적응 상태에 가까움."],"om":["힘차게","약하게","느리게","조용히"],"en":"not only does the adaptation fade away, but additional neurons begin to vigorously fire in response to the unexpected sound.","ko":"적응이 사라질 뿐 아니라, 예상하지 못한 소리에 반응해 추가 뉴런들이 힘차게 신호를 보내기 시작한다.","hl":["begin to vigorously fire","not only"],"khl":["힘차게 신호를 보내기","뿐 아니라"],"blocks":[{"t":"p","h":"not only A but B 구조","x":["not only A but B(A뿐 아니라 B도)는 같은 방향으로 더 보태는 구조다.","A: 반응을 줄이던 적응이 사라진다.","B: 거기에 더해 뉴런이 더 움직인다.","feebly(힘없이)를 넣으면 보태는 게 아니라 깎는 말이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","instantly(즉시)는 immediately(즉시)와, extra(추가의)는 additional(추가의)과 뜻이 같다.","이 둘을 고쳤다면 철자만 본 것이다."]}],"post":["vigorously(힘차게) ↔ feebly(힘없이)","놀람 = 적응 사라짐 + 뉴런 추가 출동"]}],"quiz":[{"w":"violate","m":"어기다, 위반하다","it":[["harvest","수확하다","n"],["breach","어기다, 위반하다","s"],["obey","따르다, 복종하다","a"],["decorate","장식하다","n"],["break","(규칙·약속을) 어기다","s"],["observe","(규칙을) 지키다","a"],["borrow","빌리다","n"]]},{"w":"identical","m":"똑같은, 동일한","it":[["matching","똑같은, 어울리는","s"],["rural","시골의","n"],["different","다른","a"],["fragile","깨지기 쉬운","n"],["equivalent","동등한","s"],["distinct","뚜렷이 다른","a"],["generous","관대한","n"]]},{"w":"decrease","m":"줄다, 감소하다","it":[["pray","기도하다","n"],["decline","줄어들다, 감소하다","s"],["increase","늘다, 증가하다","a"],["wander","돌아다니다","n"],["diminish","줄어들다","s"],["grow","늘어나다, 커지다","a"],["polish","닦다, 윤을 내다","n"]]},{"w":"strong","m":"강한","it":[["powerful","강력한","s"],["polite","공손한","n"],["weak","약한","a"],["ancient","고대의","n"],["intense","강렬한","s"],["mild","약한, 가벼운","a"],["wooden","나무로 된","n"]]},{"w":"vigorously","m":"힘차게, 활발하게","it":[["secretly","몰래","n"],["energetically","힘차게, 정력적으로","s"],["feebly","힘없이","a"],["politely","공손하게","n"],["forcefully","힘 있게, 강력하게","s"],["weakly","약하게","a"],["honestly","솔직하게","n"]]}]},{"items":[{"slots":[["anticipate"],["strong"],["fade_away","build up","a"],["vigorously"],["alternating"]],"opts":["set_in","fade_away","take_hold","carry_on"],"or":["set in(자리 잡다): 적응이 새로 자리 잡으면 반응이 줄어 강한 놀람과 반대임.","fade away(사라지다): 놀라는 순간 반응을 줄이던 적응이 풀린다는 뜻이라 맞음.","take hold(굳어지다): 적응이 굳어지면 뇌가 더 무덤덤해져 surprise(놀람)와 안 맞음.","carry on(계속되다): 적응이 계속되면 바뀐 음에도 반응이 줄어든 채라 흐름이 깨짐."],"om":["자리 잡다","사라지다","굳어지다","계속되다"],"en":"Your primary auditory cortex immediately shows a strong surprise reaction: not only does the adaptation fade away, but additional neurons begin to vigorously fire","ko":"일차 청각 피질은 즉시 강한 놀람 반응을 보인다. 적응이 사라질 뿐 아니라, 추가 뉴런들이 힘차게 신호를 보내기 시작한다","hl":["the adaptation fade away","a strong surprise reaction"],"khl":["적응이 사라질","강한 놀람 반응"],"blocks":[{"t":"flow","h":"적응이 뭐였는지 다시 따라가기","x":["같은 음이 반복됨","반응이 점점 줄어듦 = 적응","갑자기 다른 음","적응이 사라짐","반응이 다시 커짐"],"at":3},{"t":"p","h":"build up(쌓이다)을 넣으면","x":["적응은 반응이 줄어드는 현상이었다.","적응이 쌓인다는 건 반응이 더 줄어든다는 말이다.","그런데 콜론 앞은 strong surprise reaction(강한 놀람 반응)이다.","반응이 줄면서 강하게 놀랄 수는 없다."]}],"post":["fade away(사라지다) ↔ build up(쌓이다)","새 소리 = 적응이 풀리는 순간"]},{"slots":[["deceptively","seemingly","s"],["strong","powerful","s"],["unexpected","familiar","a"],["predictable"],["triggers"]],"opts":["repeated","unexpected","usual","predicted"],"or":["repeated(반복된): 반복된 소리라면 적응이 일어나 반응이 줄어들어야 함.","unexpected(예상하지 못한): 갑자기 바뀐 음을 가리키며 놀람의 원인이 되어 맞음.","usual(평소의): 평소 듣던 소리에 뉴런이 힘차게 반응한다는 건 적응 설명과 반대임.","predicted(예측된): 예측된 소리는 기대를 어기지 않아 놀람이 생기지 않음."],"om":["반복된","예상하지 못한","평소의","예측된"],"en":"Suddenly, the note changes: AAAAA#. … additional neurons begin to vigorously fire in response to the unexpected sound.","ko":"갑자기 음이 바뀐다. AAAAA#. … 예상하지 못한 소리에 반응해 추가 뉴런들이 힘차게 신호를 보내기 시작한다.","hl":["the unexpected sound","the note changes"],"khl":["예상하지 못한 소리","음이 바뀐다"],"blocks":[{"t":"p","h":"그 소리는 어떤 소리였나","x":["the unexpected sound(예상하지 못한 소리)는 갑자기 바뀐 그 음이다.","같은 음만 듣던 뇌에게는 처음 듣는 소리다.","familiar(익숙한)를 넣으면 \"익숙한 소리에 반응해 놀란다\"가 된다.","익숙하면 놀랄 이유가 없다."]},{"t":"p","h":"원인과 결과","x":["원인: 예상이 깨짐","결과: 놀람 반응","원인을 familiar(익숙한)로 바꾸면 결과가 따라오지 않는다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["seemingly simple(겉보기에 단순한)은 deceptively simple(보기엔 단순하지만 실은 그렇지 않은)과 같은 뜻이다.","powerful(강력한)은 strong(강한) 자리에 그대로 들어간다."]}],"post":["unexpected(예상하지 못한) ↔ familiar(익숙한)","처음 듣는 소리 = 놀람의 원인"]},{"slots":[["additional"],["unexpected"],["predictable","foreseeable","s"],["alternating","unchanging","a"],["gets_used_to"]],"opts":["alternating","isolated","irregular","unrelated"],"or":["alternating(번갈아 나오는): 두 음이 오가는 예시와 바로 뒤 this alternation(이 번갈아 나오기)과 맞음.","isolated(따로 떨어진): 하나만 떨어진 음이 아니라 규칙이 있는 음의 묶음이라 안 맞음.","irregular(불규칙한): 두 음이 규칙대로 오가는 음이라 맞지 않고, 불규칙하면 뇌가 익숙해질 수도 없음.","unrelated(서로 무관한): 서로 무관한 음이면 뇌가 다음 음을 예측할 수 없어 반응이 줄지 않음."],"om":["번갈아 나오는","따로 떨어진","불규칙한","서로 무관한"],"en":"what matters is whether the notes are predictable. For instance, if you hear an alternating set of notes, such as ABABA, your brain gets used to this alternation","ko":"중요한 것은 음이 예측 가능한지 여부다. 예를 들어 ABABA처럼 번갈아 나오는 음을 들으면, 뇌는 이 번갈아 나오기에 익숙해진다","hl":["an alternating set of notes","this alternation"],"khl":["번갈아 나오는 음","이 번갈아 나오기"],"blocks":[{"t" h as ABABB, that triggers a surprise response.","ko":"뇌는 이 번갈아 나오기에 익숙해지고, 청각 영역의 활동은 다시 줄어든다. 그러나 이번에는 ABABB 같은 예상하지 못한 반복이 놀람 반응을 일으킨다.","hl":["triggers a surprise response","an unexpected repetition"],"khl":["놀람 반응을 일으킨다","예상하지 못한 반복"],"blocks":[{"t":"p","h":"however(그러나)가 꺾는 방향","x":["앞 문장: 번갈아 나오는 음에 익숙해져 반응이 줄었다.","however(그러나) 뒤: 이번엔 그 규칙을 깨는 반복이 나온다.","예상을 깬 반복이니 놀람이 나와야 한다.","suppresses(억누르다)를 넣으면 놀람이 사라진다는 말이 되어 글 첫머리 주장까지 무너진다."]},{"t":"p","h":"글 전체 한 줄 정리","x":["반복이든 규칙이든, 예측대로 되면 뇌는 조용하다.","예측이 깨지면 놀란다.","그리고 그 놀람이 학습이다."]},{"t":"p","h":"함정","x":["defy(거스르다)는 violate(어기다) 자리에, steadily(꾸준히)는 progressively(점진적으로) 자리에 들어가도 뜻이 같다."]}],"post":["trigger(일으키다) ↔ suppress(억누르다)","예상 밖 반복도 놀람을 부름"]}],"quiz":[{"w":"fade away","m":"점점 사라지다","it":[["disappear","사라지다","s"],["apologize","사과하다","n"],["emerge","나타나다","a"],["negotiate","협상하다","n"],["vanish","사라지다","s"],["strengthen","강해지다","a"],["borrow","빌리다","n"]]},{"w":"unexpected","m":"예상하지 못한, 뜻밖의","it":[["loyal","충실한","n"],["unforeseen","예견하지 못한","s"],["expected","예상된","a"],["fluent","유창한","n"],["surprising","놀라운, 뜻밖의","s"],["predictable","예측 가능한","a"],["wooden","나무로 된","n"]]},{"w":"alternating","m":"번갈아 나오는","it":[["rotating","교대로 하는, 돌아가는","s"],["generous","관대한","n"],["constant","변함없는, 끊임없는","a"],["bitter","쓴","n"],["interchanging","서로 번갈아 바뀌는","s"],["continuous","연속적인","a"],["ancient","고대의","n"]]},{"w":"immediately","m":"즉시, 곧바로","it":[["politely","공손하게","n"],["instantly","즉시","s"],["later","나중에","a"],["loudly","큰 소리로","n"],["promptly","지체 없이","s"],["eventually","결국에는","a"],["honestly","솔직하게","n"]]},{"w":"trigger","m":"일으키다, 촉발하다","it":[["spark","촉발하다","s"],["decorate","장식하다","n"],["suppress","억누르다","a"],["whisper","속삭이다","n"],["provoke","유발하다","s"],["prevent","막다","a"],["borrow","빌리다","n"]]}]}],"no":"31"},{"id":"2211g2-32","title":"어휘특훈 · 22년 11월 고2 32번","sub":"금융 시장의 감염과 두려움","tpl":"The {connectedness} of the global economic market makes it {vulnerable} to {potential} “infection.” A financial failure can make its way from borrowers to banks to insurers, {spreading} like a flu. However, there are {unexpected} characteristics when it comes to such infection in the market. Infection can {occur} even without any contact. A bank might become {insolvent} even without having any of its investments fail. Fear and {uncertainty} can be {damaging} to financial markets, just as {cascading} failures due to bad investments. If we all woke up tomorrow and believed that Bank X would be insolvent, then it would become insolvent. In fact, it would be {enough} for us to fear that others believed that Bank X was going to fail, or just to fear our {collective} fear! We might all even know that Bank X was well-managed with {healthy} investments, but if we expected others to pull their money out, then we would {fear} being the {last} to pull our money out. Financial {distress} can be self-fulfilling and is a {particularly} {troublesome} aspect of financial markets.","fn":["*borrower: 돈을 빌린 사람","*insurer: 보험 회사","*self-fulfilling: 자기 충족적인(믿는 대로 실제로 이루어지는)"],"mean":{"connectedness":"연결성, 서로 이어져 있음","interdependence":"상호 의존","isolation":"고립","vulnerable":"취약한, (~에) 약한","susceptible":"(~에) 걸리기 쉬운, 영향을 받기 쉬운","immune":"면역이 있는, 영향을 받지 않는","potential":"잠재적인","possible":"가능한, 있을 수 있는","spreading":"동사 spread(퍼지다)의 -ing형. 퍼지면서(분사구문)","vanishing":"동사 vanish(사라지다)의 -ing형","unexpected":"예상 밖의, 뜻밖의","ordinary":"평범한","occur":"일어나다, 발생하다","happen":"일어나다","insolvent":"지급 불능의, 빚을 갚을 수 없는","bankrupt":"파산한","profitable":"수익성이 있는, 이익이 나는","uncertainty":"불확실성","doubt":"의심, 불확실함","confidence":"자신감, 확신","damaging":"해로운, 피해를 주는","harmful":"해로운","beneficial":"이로운, 유익한","cascading":"동사 cascade(연쇄적으로 일어나다)의 -ing형. 연쇄적인","enough":"충분한","insufficient":"불충분한","collective":"집단적인","shared":"동사 share(공유하다)의 과거분사형. 공유된","common":"공동의, 공통의","healthy":"건전한, 건강한","sound":"건전한, 탄탄한","risky":"위험한","fear":"두려워하다","dread":"몹시 두려워하다","last":"마지막의","first":"처음의, 첫 번째의","distress":"곤경, 고통","stability":"안정","particularly":"특히","notably":"특히, 두드러지게","troublesome":"골치 아픈, 성가신","reassuring":"안심시키는"},"comp":[{"no":"32","slots":[["connectedness","interdependence","s"],["vulnerable"],["unexpected","ordinary","a"],["occur"],["insolvent"]],"opts":["unexpected","typical","obvious","predictable"],"or":["unexpected(예상 밖의): However(그러나) 뒤에서 접촉 없는 감염이라는 놀라운 특징을 예고해 맞음.","typical(전형적인): 전형적인 특징이라면 However(그러나)로 앞말을 꺾을 이유가 없음.","obvious(뻔한): 접촉 없이 감염된다는 건 뻔하지 않은 이야기라 안 맞음.","predictable(예측 가능한): 예측 가능한 특징이라면 독감처럼 퍼진다는 앞말과 다를 게 없음."],"om":["예상 밖의","전형적인","뻔한","예측 가능한"],"en":"However, there are unexpected characteristics when it comes to such infection in the market. Infection can occur even without any contact.","ko":"그러나 시장에서의 이런 감염에는 예상 밖의 특징들이 있다. 감염은 아무런 접촉 없이도 일어날 수 있다.","hl":["unexpected characteristics","However"],"khl":["예상 밖의 특징들","그러나"],"blocks":[{"t":"p","h":"However(그러나)가 정하는 방향","x":["앞에서는 실패가 독감처럼 퍼진다고 했다.","여기까지는 누구나 예상할 수 있는 감염이다.","However(그러나) 뒤에는 그와 다른, 뜻밖의 이야기가 와야 한다.","실제로 바로 뒤에 접촉 없이도 감염된다는 놀라운 특징이 나온다.","ordinary(평범한)를 넣으면 However(그러나)가 꺾을 게 없다."]},{"t":"p","h":"함정","x":["interdependence(상호 의존)는 connectedness(연결성)와 같은 뜻이라 그대로 둔다."]}],"post":["unexpected(예상 밖의) ↔ ordinary(평범한)","접촉 없이도 옮는 감염"]},{"no":"32","slots":[["enough"],["healthy","sound","s"],["fear"],["last"],["distress","stability","a"]],"opts":["growth","success","distress","recovery"],"or":["growth(성장): 성장이 골치 아픈 측면이라는 건 글 내용과 안 맞음.","success(성공): 은행이 무너지는 이야기의 정리로 성공은 어울리지 않음.","distress(곤경): troublesome(골치 아픈)의 주인공이자 앞에서 말한 은행 붕괴를 묶는 말이라 맞음.","recovery(회복): 회복이 믿는 대로 실현된다면 좋은 일이라 troublesome(골치 아픈)과 부딪침."],"om":["성장","성공","곤경","회복"],"en":"Financial distress can be self-fulfilling and is a particularly troublesome aspect of financial markets.","ko":"재정적 곤경은 자기 충족적일 수 있으며, 금융 시장의 특히 골치 아픈 측면이다.","hl":["Financial distress","troublesome"],"khl":["재정적 곤경","골치 아픈"],"blocks":[{"t":"p","h":"and(그리고)로 이어진 두 설명","x":["같은 주어에 설명이 두 개 붙었다.","하나는 self-fulfilling(자기 충족적인), 하나는 troublesome(골치 아픈).","골치 아픈 것의 주인공이니 나쁜 일이어야 한다.","stability(안정)를 넣
