<!DOCTYPE html>
<html lang="ko" translate="no">
<head>

<title>어휘특훈 · 공통영어2 능률(오) 4과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

":[["broken your right arm","오른팔이 부러졌다 (첫 문장)"],["your injured arm","당신의 다친 팔 (둘째 문장)"]]},{"t":"p","h":"healed(다 나은)가 틀린 이유","x":["둘째 문장의 팔은 첫 문장에서 방금 부러진 그 팔이다.","healed(다 나은)를 넣으면 다 나은 팔로 하기 어려운 일이 있다는 말이 된다.","다 나았다면 상자를 못 들 이유가 없다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","inconvenient(불편한)는 awkward(어색한) 자리에, essential(필수적인)은 important(중요한) 자리에 그대로 쓸 수 있다."]}],"post":["injured(다친) ↔ healed(다 나은)","방금 부러진 오른팔 = 다친 팔"]},{"slots":[["broken"],["minor","major","a"],["certain"],["disabilities","impairments","s"],["accessible"]],"opts":["minor","serious","huge","central"],"or":["minor(작은): compared to(~에 비하면) 뒤에 '거의 불가능한' 더 큰 어려움이 오므로 팔 부상 쪽은 작아야 맞음.","serious(심각한): 앞에 However(그러나)가 있어 '생각보다 작다'로 뒤집는 자리인데 심각하다고 하면 뒤집기가 사라짐.","huge(거대한): 비교 대상인 장애인의 어려움보다 크다는 말이 되어 순서가 거꾸로 됨.","central(중심적인): 이 글의 중심 문제는 팔 부상이 아니라 장애인의 웹 사용임."],"om":["작은","심각한","거대한","중심적인"],"en":"However, this is a minor challenge compared to what some of us face on the Internet. For people with certain disabilities, many websites can be nearly impossible to use.","ko":"그러나 이것은 우리 중 몇몇이 인터넷에서 직면하는 것에 비하면 작은 과제이다. 특정 장애가 있는 사람들에게는 많은 웹 사이트가 사용하기에 거의 불가능할 수 있다.","hl":["a minor challenge","However"],"khl":["작은 과제","그러나"],"blocks":[{"t":"p","h":"However(그러나)가 방향을 꺾는다","x":["앞에서는 왼손 마우스가 어색하고 느리다고 했다.","독자는 '꽤 힘들겠다'고 생각한다.","However(그러나)는 그 생각을 꺾는다.","\"그래도 이건 작은 편이다.\"","major(큰)를 넣으면 꺾지 않고 같은 방향으로 가 버려 However(그러나)가 쓸모없어진다."]},{"t":"flow","h":"크기 비교","x":["왼손 마우스: 어색하고 느림","장애인의 웹: 거의 불가능","그러니 왼손 마우스는 작은 과제"],"at":2},{"t":"p","h":"impairments(장애)는 맞는 표현","x":["impairments(장애, 손상)는 disabilities(장애)와 같은 뜻의 짝이다."]}],"post":["minor(작은) ↔ major(큰)","팔 부상은 작은 과제, 장애인의 웹은 거의 불가능"]},{"slots":[["challenge"],["certain"],["impossible","effortless","a"],["everyone"],["exactly"]],"opts":["impossible","pleasant","enjoyable","convenient"],"or":["impossible(불가능한): 바로 뒤 '이것이 웹 접근성이 중요한 이유'가 되려면 웹 사용이 막혀 있어야 해서 맞음.","pleasant(즐거운): 사용하기 즐겁다면 웹 접근성을 따로 강조할 이유가 없음.","enjoyable(재미있는): 장애인에게 웹이 재미있다는 말은 앞 문장의 '훨씬 큰 어려움'과 반대임.","convenient(편리한): 편리하다면 팔 부상보다 큰 과제라는 비교가 무너짐."],"om":["불가능한","즐거운","재미있는","편리한"],"en":"For people with certain disabilities, many websites can be nearly impossible to use. This is the reason why web accessibility is important.","ko":"특정 장애가 있는 사람들에게는 많은 웹 사이트가 사용하기에 거의 불가능할 수 있다. 이것이 웹 접근성이 중요한 이유이다.","hl":["nearly impossible to use","This is the reason why"],"khl":["사용하기에 거의 불가능할","이것이 웹 접근성이 중요한 이유"],"blocks":[{"t":"tap","h":"질문 하나","q":"웹 사이트가 장애인에게도 수월하다면, 웹 접근성이 왜 필요할까?","a":["필요 없다.","필자가 접근성이 중요하다고 말하려면 그 전에 '거의 불가능하다'는 문제가 있어야 한다.","effortless(수월한)는 문제 자체를 지워 버린다."]},{"t":"p","h":"nearly(거의)와의 짝","x":["nearly impossible(거의 불가능한)은 '아주 조금만 되고 사실상 안 된다'는 뜻이다.","앞 문장의 '왼손 마우스는 작은 과제'보다 훨씬 무거운 표현이어야 비교가 산다."]}],"post":["impossible(불가능한) ↔ effortless(수월한)","장애인에게 웹 = 사실상 막힌 문"]},{"slots":[["difficult"],["certain","particular","s"],["important"],["including","excluding","a"],["common","shared","s"]],"opts":["including","except","without","against"],"or":["including(~을 포함하여): everyone(모든 사람) 안에 장애가 있는 사람들도 들어간다는 말이라 맞음.","except(~을 빼고): 장애인을 빼면 '모든 사람'이 아니고, 앞 문장들에서 말한 문제도 그대로 남음.","without(~없이): 장애인 없이 쓰게 한다는 말은 웹 접근성의 목적과 반대임.","against(~에 반대하여): 장애인에 반대한다는 말은 글 전체와 정반대임."],"om":["~을 포함하여","~을 빼고","~없이","~에 반대하여"],"en":"Web accessibility is the practice of making sure that websites can be used by everyone, including people with disabilities.","ko":"웹 접근성은 장애가 있는 사람들을 포함하여 모든 사람이 웹 사이트를 사용할 수 있도록 확실히 하는 실천이다.","hl":["including people with disabilities","everyone"],"khl":["장애가 있는 사람들을 포함하여","모든 사람"],"blocks":[{"t":"p","h":"웹 접근성의 정의","x":["정의의 핵심은 두 가지다.","① 모든 사람이 쓸 수 있게.","② 특히 장애가 있는 사람까지.","excluding(~을 제외하고)을 넣으면 정작 도와야 할 사람을 빼 버린다.","앞에서 '장애인에게 웹이 거의 불가능하다'고 해 놓고 그 사람들을 빼는 정의는 성립하지 않는다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","particular(특정한)는 certain(특정한)과, shared(공통의)는 common(공통의)과 같은 뜻이다."]}],"post":["including(~을 포함하여) ↔ excluding(~을 제외하고)","웹 접근성 = 장애인까지 포함한 모두"]}],"quiz":[{"w":"break","m":"부러뜨리다, 깨다","it":[["fracture","골절시키다","s"],["repair","고치다","a"],["season","양념하다","n"],["crack","금이 가게 하다","s"],["mend","수선하다, 고치다","a"],["applaud","박수를 치다","n"],["rent","빌리다","n"]]},{"w":"injured","m":"다친","it":[["polite","공손한","n"],["wounded","부상을 입은","s"],["unhurt","다치지 않은","a"],["hurt","다친","s"],["metallic","금속의","n"],["uninjured","다치지 않은","a"],["weekly","매주의","n"]]},{"w":"minor","m":"작은, 사소한","it":[["major","큰, 주요한","a"],["slight","약간의, 사소한","s"],["golden","금으로 된","n"],["significant","중요한, 상당한","a"],["trivial","사소한","s"],["northern","북쪽의","n"],["furry","털이 많은","n"]]},{"w":"impossible","m":"불가능한","it":[["possible","가능한","a"],["unachievable","달성할 수 없는","s"],["oval","타원형의","n"],["feasible","실현 가능한","a"],["unattainable","이룰 수 없는","s"],["chilly","쌀쌀한","n"],["loyal","충실한","n"]]},{"w":"including","m":"~을 포함하여","it":[["excluding","~을 제외하고","a"],["containing","~을 포함하는","s"],["beneath","~아래에","n"],["except","~을 제외하고","a"],["counting","~을 포함하여, 셈에 넣어","s"],["toward","~쪽으로","n"],["beyond","~너머에","n"]]}]}],"no":"본문 ❶"},{"id":"js1-noh2-4b","title":"어휘특훈 · 공통영어2 능률(오) 4과 ②+③","sub":"대체 텍스트 · 대본과 자막","tpl":"Along with text, most websites include other forms of information, such as images. Sometimes such visual information is {important} for {understanding} the text. This is a {problem} for users with visual disabilities. When they go on a website, they {often} use programs called “screen readers,” which read online text {aloud}. However, these programs cannot “read” images. Accessible websites {solve} this problem by providing alternative text, also known as “alt text.” Alt text is a {brief} description of non-textual information. For instance, if an image shows a group of students, its alt text would {explain} how many students are in the image and what they are doing. Screen readers can {detect} this alt text and read it aloud. This way, alt text {ensures} that people with visual disabilities can access {more} of the information on a website. In some cases, audio content cannot be accessed or understood. Some people may have hearing {disabilities}, while others might be in places where they can’t listen to audio, such as a {quiet} library. Therefore, {accessible} websites often {offer} other ways to access information that is presented in audio form. For example, they may {provide} transcripts or captions that can help users access this information. Transcripts are text versions of the {entire} audio content, while captions are text versions of the audio that {appear} in a video as it plays. Captions {include} not only the text version of the {spoken} words but also descriptions of the music and other sounds in the video.","fn":["*screen reader: 화면 낭독 프로그램","*alt text: 대체 텍스트(이미지 설명 글)","*transcript: (음성 내용을) 글로 옮긴 기록, 대본","*caption: 자막"],"mean":{"important":"중요한","crucial":"결정적인, 매우 중요한","understanding":"동사 understand(이해하다)의 -ing형. 동명사(전치사 for의 목적어)","misunderstanding":"동사 misunderstand(오해하다)의 -ing형. 동명사","aloud":"소리 내어","out loud":"소리 내어","silently":"소리 없이, 조용히","solve":"해결하다","address":"(문제를) 다루다, 해결하려 하다","brief":"간단한, 간략한","concise":"간결한","explain":"설명하다","describe":"묘사하다, 설명하다","hide":"숨기다","detect":"감지하다, 알아채다","recognize":"인식하다, 알아보다","ignore":"무시하다","ensures":"동사 ensure(보장하다)의 3인칭 단수 현재형","guarantees":"동사 guarantee(보장하다)의 3인칭 단수 현재형","more":"더 많은 것(more of ~ = ~의 더 많은 부분)","less":"더 적은 것(less of ~ = ~의 더 적은 부분)","disabilities":"명사 disability(장애)의 복수형","quiet":"조용한","silent":"고요한, 조용한","accessible":"접근 가능한, 이용 가능한","offer":"제공하다","provide":"제공하다","withhold":"주지 않다, 보류하다","remove":"없애다, 제거하다","entire":"전체의","whole":"전체의, 모든","complete":"전부의, 완전한","appear":"나타나다","show up":"나타나다","include":"포함하다","omit":"빠뜨리다, 생략하다","spoken":"말로 하는, 구어의 (동사 speak(말하다)의 과거분사형)","written":"글로 쓴, 문자로 된 (동사 write(쓰다)의 과거분사형)","problem":"문제","blessing":"축복, 다행스러운 것","often":"자주, 흔히","insignificant":"중요하지 않은, 사소한","complicate":"복잡하게 만들다"},"comp":[{"no":"본문 ❷❸","slots":[["important","crucial","s"],["solve","complicate","a"],["explain"],["ensures"],["quiet"]],"opts":["solve","cause","worsen","overlook"],"or":["solve(해결하다): by providing alternative text(대체 텍스트를 제공함으로써)는 돕는 방법이라 그 결과는 문제 해결이어서 맞음.","cause(일으키다): 문제는 이미 앞에서 생겼고, 설명 글을 붙이는 일이 문제를 만들 리 없음.","worsen(악화시키다): 이미지를 말로 설명해 주는 글이 상황을 더 나쁘게 할 수 없음.","overlook(못 보고 넘기다): 대체 텍스트라는 대책을 내놓았으니 문제를 외면한 게 아님."],"om":["해결하다","일으키다","악화시키다","못 보고 넘기다"],"en":"However, these programs cannot “read” images. Accessible websites solve this problem by providing alternative text, also known as “alt text.”","ko":"그러나 이 프로그램들은 이미지를 '읽을' 수 없다. 접근성 있는 웹 사이트는 '알트 텍스트'라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다.","hl":["solve this problem by providing alternative text","cannot “read” images"],"khl":["대체 텍스트를 제공함으로써 이 문제를 해결한다","이미지를 '읽을' 수 없다"],"blocks":[{"t":"p","h":"by(~함으로써) 뒤가 방법이다","x":["방법: 대체 텍스트를 제공한다.","이미지를 글로 설명해 주니 스크린 리더가 읽을 수 있게 된다.","돕는 방법을 썼으니 결과는 '해결'이어야 한다.","complicate(복잡하게 만들다)를 넣으면 도와주는 방법으로 문제를 더 꼬이게 했다는 말이 된다."]},{"t":"pair","h":"문제와 해결이 바로 붙어 있다","x":[["these programs cannot “read” images","프로그램은 이미지를 못 읽는다 (문제)"],["providing alternative text","대체 텍스트를 제공한다 (해결)"]]},{"t":"p","h":"crucial(매우 중요한)은 그대로","x":["crucial(매우 중요한)은 important(중요한)와 같은 방향이다.","이미지 정보가 글 이해에 중요하다는 말이 그대로 살아 있다."]}],"post":["solve(해결하다) ↔ complicate(복잡하게 만들다)","이미지 못 읽는 스크린 리더 → 대체 텍스트로 해결"]},{"no":"본문 ❷❸","slots":[["solve"],["offer"],["provide","remove","a"],["entire","complete","s"],["include"]],"opts":["provide","delete","avoid","forbid"],"or":["provide(제공하다): For example(예를 들어)가 앞 문장의 '다른 방법을 제공한다'의 예를 드는 자리라 맞음.","delete(삭제하다): 대본을 지우는 건 정보에 접근하게 돕는 예가 될 수 없음.","avoid(피하다): 대본을 피하면 듣지 못하는 사람은 정보를 얻을 길이 없음.","forbid(금지하다): 사용자를 돕는 대본을 금지한다는 건 접근성과 정반대임."],"om":["제공하다","삭제하다","피하다","금지하다"],"en":"Therefore, accessible websites often offer other ways to access information that is presented in audio form. For example, they may provide transcripts or captions that can help users access this information.","ko":"그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 다른 방법들을 제공한다. 예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다.","hl":["provide transcripts or captions","For example"],"khl":["대본이나 자막을 제공할","예를 들어"],"blocks":[{"t":"pair","h":"앞 문장과 예시 나란히","x":[["offer other ways to access information","정보에 접근할 다른 방법을 제공한다 (주장)"],["provide transcripts or captions","대본이나 자막을 제공한다 (예시)"]]},{"t":"p","h":"remove(없애다)를 넣고 읽기","x":["\"예를 들어, 사이트는 대본이나 자막을 없앨 수도 있다.\"","없애는 건 '다른 방법을 제공한다'의 예가 아니다.","게다가 그 대본과 자막은 바로 뒤에서 help users(사용자를 돕는) 것이라고 한다.","돕는 물건을 없앤다는 말은 앞뒤가 다 안 맞는다."]},{"t":"p","h":"complete(전부의)는 맞는 표현","x":["complete(전부의)는 entire(전체의)와 같은 뜻이다.","대본은 음성 전체를 글로 옮긴 것이다."]}],"post":["provide(제공하다) ↔ remove(없애다)","다른 방법의 예 = 대본과 자막 제공"]}],"compquiz":[{"w":"solve","m":"해결하다","it":[["settle","해결하다","s"],["yawn","하품하다","n"],["complicate","복잡하게 만들다","a"],["work out","(문제를) 풀다, 해결하다","s"],["skate","스케이트를 타다","n"],["tangle","엉키게 하다","a"],["bloom","꽃이 피다","n"]]},{"w":"provide","m":"제공하다","it":[["supply","공급하다","s"],["whisper","속삭이다","n"],["withhold","주지 않다, 보류하다","a"],["furnish","제공하다, 갖추다","s"],["retain","보유하다, 계속 가지고 있다","a"],["sneeze","재채기하다","n"],["paint","칠하다","n"]]}],"sets":[{"items":[{"slots":[["understanding"],["problem","blessing","a"],["aloud"],["solve"],["brief"]],"opts":["problem","relief","gift","pleasure"],"or":["problem(문제): 이미지 정보가 글 이해에 중요한데 시각 장애인은 그걸 못 보니 곤란한 일이라 맞음.","relief(안심되는 일): 중요한 정보를 못 보는 상황이 안심될 리 없음.","gift(선물): 못 보는 이미지가 시각 장애인에게 선물이 될 수 없음.","pleasure(즐거움): 정보를 놓치는 일은 즐거움이 아님."],"om":["문제","안심되는 일","선물","즐거움"],"en":"This is a problem for users with visual disabilities.","ko":"이것은 시각 장애가 있는 사용자들에게 문제가 된다.","hl":["This is a problem","users with visual disabilities"],"khl":["문제가 된다","시각 장애가 있는 사용자들"],"blocks":[{"t":"flow","h":"본문 ❷는 문제 → 해결 순서","x":["이미지 정보가 글 이해에 중요함","시각 장애인은 이미지를 못 봄 → 문제","스크린 리더도 이미지는 못 읽음","해결: 대체 텍스트","스크린 리더가 대체 텍스트를 읽어 줌"],"at":1},{"t":"p","h":"뒤에서 같은 말을 다시 부른다","x":["세 문장 뒤에 solve this problem(이 문제를 해결하다)이 나온다.","this problem(이 문제)은 바로 이 문장의 problem(문제)이다.","blessing(축복, 다행스러운 것)을 넣으면 \"이미지를 못 보는 것이 시각 장애인에게 다행이다\"가 된다.","바로 뒤에서 스크린 리더도 이미지를 못 읽는다고 하고, 웹 사이트는 이를 solve(해결하다)한다 ng_use_of} keys such as the space bar, the arrow keys, the enter key, and the tab key. For example, they can use the tab key to {jump} from one part of a web page to another. Both users with disabilities and those with temporarily {injured} hands can {benefit} from this kind of navigation.","fn":["*navigate: (웹 사이트 등을) 돌아다니다, 탐색하다","*field: (입력) 칸, 필드"],"mean":{"elderly":"나이가 지긋한, 연로한","older":"나이 든 (old의 비교급)","poor":"(상태가) 좋지 않은","weak":"약한","good":"좋은","eyesight":"시력","vision":"시력, 시각","difficult":"어려운","hard":"어려운, 힘든","contrasts":"동사 contrast(대조를 이루다)의 3인칭 단수 현재형","blends":"동사 blend(뒤섞이다, 어우러지다)의 3인칭 단수 현재형","clear":"또렷한, 분명한","blurry":"흐릿한","allow":"허락하다, ~하게 하다","permit":"허락하다","forbid":"금지하다","adjust":"조절하다","regulate":"조절하다, 조정하다","altogether":"완전히","completely":"완전히","more":"더 많은","disabilities":"명사 disability(장애)의 복수형","limit":"제한하다","restrict":"제한하다","expand":"넓히다, 확장하다","rely on":"~에 의존하다","depend on":"~에 의존하다","avoid":"피하다","accessible":"접근 가능한, 이용 가능한","inaccessible":"접근하기 어려운, 이용할 수 없는","entered":"동사 enter(입력하다)의 과거분사형. is entered = 수동태","typed":"동사 type(타자로 치다, 입력하다)의 과거분사형","jump":"건너뛰다, 뛰어넘다","move":"옮겨 가다, 이동하다","injured":"다친, 부상을 당한","benefit":"이익을 얻다, 득을 보다(benefit from ~ = ~로부터 득을 보다)","profit":"이익을 얻다","suffer":"고통받다, 피해를 입다(suffer from ~ = ~로 고통받다)","effortless":"힘들지 않은, 수월한","most":"대부분의","a minority of":"소수의 (a minority = 소수)","everything":"모든 것","partially":"부분적으로","making use of":"동사 make use of(~을 이용하다)의 -ing형(동명사). by 뒤라서 -ing","ignoring":"동사 ignore(무시하다)의 -ing형(동명사)"},"comp":[{"no":"본문 ❹❺","slots":[["elderly"],["difficult","effortless","a"],["contrasts"],["allow","permit","s"],["adjust"]],"opts":["difficult","pleasant","quick","safe"],"or":["difficult(어려운): 바로 앞 문장이 '시력이 좋지 않다'이고, 다음 문장이 For this reason(이런 이유로) 대조되는 배경 색을 쓴다고 해서 읽기가 힘들어야 맞음.","pleasant(즐거운): 시력이 약한데 읽는 게 즐거워진다는 건 원인과 결과가 안 맞음.","quick(빠른): 잘 안 보이면 읽는 속도는 오히려 느려짐.","safe(안전한): 읽기의 안전은 이 글의 관심이 아니고, 시력과도 연결되지 않음."],"om":["어려운","즐거운","빠른","안전한"],"en":"Some people, includ "대조를 이루다","어울리다","합쳐지다","섞이다"],"en":"For this reason, accessible websites have a background color that contrasts with the color of their text. This makes the text clear enough for most people to see.","ko":"이런 이유로 접근성 있는 웹 사이트들은 글자 색과 대조를 이루는 배경 색을 가지고 있다. 이것은 대부분의 사람들이 볼 수 있을 만큼 글자를 충분히 또렷하게 만든다.","hl":["contrasts with the color of their text","clear enough"],"khl":["글자 색과 대조를 이루는","충분히 또렷하게"],"blocks":[{"t":"p","h":"blends(어우러지다)를 넣고 상상하기","x":["연한 회색 바탕에 연한 회색 글씨를 떠올려 보자.","배경 색이 글자 색과 어우러지면 글자가 바탕에 묻힌다.","그러면 다음 문장의 clear(또렷한)가 나올 수 없다.","검은 바탕에 흰 글씨처럼 대조가 강해야 또렷하다."]},{"t":"p","h":"For this reason(이런 이유로)의 이유","x":["이유는 앞 문장, 시력이 약해 읽기 어려운 사람들이다.","그 사람들을 돕는 방법이 '대조'다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","hard(어려운)는 difficult(어려운)와, completely(완전히)는 altogether(완전히)와 같은 뜻이라 고치지 않는다."]}],"post":["contrast(대조를 이루다) ↔ blend(어우러지다)","배경 색 ≠ 글자 색 → 글자가 또렷"]},{"slots":[["eyesight","vision","s"],["clear"],["rely_on","avoid","a"],["accessible"],["jump"]],"opts":["rely_on","give_up","look_down_on","throw_away"],"or":["rely on(~에 의존하다): 손이 불편해 마우스 대신 키보드를 쓴다는 말이고, 다음 문장도 '키보드만으로' 접근한다고 해서 맞음.","give up(포기하다): 키보드를 포기한다면 뒤 문장의 '키보드만 사용해서'와 정반대임.","look down on(얕보다): 키보드를 얕본다는 말은 키보드 탐색을 소개하는 흐름과 안 맞음.","throw away(버리다): 키보드를 버리면 웹 사이트를 돌아다닐 도구가 없어짐."],"om":["~에 의존하다","포기하다","얕보다","버리다"],"en":"They rely on their keyboards, rather than a mouse, to navigate websites. On accessible websites, users can access everything on the site using only a keyboard.","ko":"그들은 웹 사이트를 돌아다니기 위해 마우스보다는 키보드에 의존한다. 접근성 있는 웹 사이트에서 사용자는 키보드만 사용해서 사이트의 모든 것에 접근할 수 있다.","hl":["rely on their keyboards","rather than a mouse"],"khl":["키보드에 의존한다","마우스보다는"],"blocks":[{"t":"pair","h":"rather than(~보다는)으로 나뉜 두 도구","x":[["their keyboards","키보드 (쓰는 쪽)"],["a mouse","마우스 (덜 쓰는 쪽)"]]},{"t":"p","h":"avoid(피하다)가 틀린 이유","x":["손 움직임이 제한되면 작은 마우스를 정확히 움직이기 어렵다.","그래서 키보드가 그들의 길이다.","avoid(피하다)를 넣으면 키보드를 피한다는 말이 된다.","다음 문장 using only a keyboard(키보드만 사용해서)와 정면으로 부딪친다."]},{"t":"p","h":"vision(시력)은 맞는 표현","x":["vi of navigation","Both users with disabilities and those with temporarily injured hands"],"khl":["득을 볼 수 있다","장애가 있는 사용자들과 일시적으로 손을 다친 사람들 모두"],"blocks":[{"t":"p","h":"suffer(고통받다)를 넣으면","x":["\"두 부류 모두 이런 탐색 때문에 고통받는다.\"","그런데 이 탐색은 바로 그 사람들을 위해 만든 기능이다.","키보드만으로 모든 것에 접근하게 해 주는 기능이 피해를 줄 리 없다."]},{"t":"p","h":"본문 ❶과 이어지는 고리","x":["temporarily injured hands(일시적으로 다친 손)는 본문 ❶의 상상을 떠올리게 한다.","넘어져서 오른팔이 부러진 그 상황이다.","접근성은 장애인만이 아니라 잠깐 다친 우리 모두를 위한 것이다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","restrict(제한하다)는 limit(제한하다)와, move(이동하다)는 jump(건너뛰다) 자리에 써도 뜻이 통한다."]}],"post":["benefit(득을 보다) ↔ suffer(고통받다)","키보드 탐색 = 장애인 + 잠깐 다친 사람 모두에게 득"]}],"quiz":[{"w":"poor","m":"(상태가) 좋지 않은","it":[["weak","약한","s"],["excellent","훌륭한","a"],["salty","짠","n"],["inferior","열등한, 질이 떨어지는","s"],["superior","우수한","a"],["rectangular","직사각형의","n"],["eager","열망하는","n"]]},{"w":"contrast","m":"대조를 이루다","it":[["differ","다르다","s"],["match","어울리다, 일치하다","a"],["knit","뜨개질하다","n"],["diverge","갈라지다, 다르다","s"],["agree","일치하다","a"],["sneeze","재채기하다","n"],["bake","굽다","n"]]},{"w":"rely on","m":"~에 의존하다","it":[["depend on","~에 의존하다","s"],["distrust","믿지 않다","a"],["take off","이륙하다","n"],["count on","~을 믿다, 의지하다","s"],["mistrust","불신하다","a"],["put on","입다","n"],["show off","자랑하다","n"]]},{"w":"allow","m":"허락하다","it":[["permit","허락하다","s"],["forbid","금지하다","a"],["melt","녹다","n"],["let","~하게 하다","s"],["prohibit","금지하다","a"],["chew","씹다","n"],["fold","접다","n"]]},{"w":"benefit","m":"이익을 얻다, ~에 이롭다","it":[["profit","이익을 얻다","s"],["harm","해치다","a"],["paddle","노를 젓다","n"],["help","돕다","s"],["hinder","방해하다","a"],["sew","바느질하다","n"],["kneel","무릎을 꿇다","n"]]}]},{"items":[{"slots":[["poor"],["most","a minority of","a"],["altogether"],["limit"],["jump"]],"opts":["most","no","hardly_any","very_few"],"or":["most(대부분의): 배경과 글자의 대조는 시력이 약한 사람까지 넓게 돕는 장치라 '대부분의 사람'이 보게 해 주는 게 맞음.","no(어떤 ~도 없는): 아무도 못 보게 만드는 선명함은 있을 수 없음.","hardly any(거의 없는): 글자를 또렷하게 만들었는데 거의 아무도 못 본다는 건 거꾸로임.","very few(극소수의): 접근성은 더 많은 사람이 쓰게 하는 것이라 극소수만 보게 하는 건 목적과 반대임."],"om":["대부분의","어떤 ~도 없는","거의 없는","극소수의"],"en":"This makes the text clear enough for most people to see.","ko":"이것은 대부분의 사람들이 볼 수 있을 만큼 글자를 충분히 또렷하게 만든다.","hl":["for most people to see","clear enough"],"khl":["대부분의 사람들이 볼 수 있을 만큼","충분히 또렷하게"],"blocks":[{"t":"p","h":"a minority of(소수의)를 넣고 다시 읽기","x":["\"이것은 글자를 소수의 사람들만 볼 수 있을 만큼 충분히 또렷하게 만든다.\"","또렷하게 만들었는데 보는 사람은 소수뿐이라는 말이다.","a minority(소수) ↔ a majority(다수). most(대부분의)는 다수 쪽이다.","clear enough(충분히 또렷한)와 정면으로 부딪친다."]},{"t":"p","h":"누구를 위한 대조인가","x":["앞 문장들의 주인공은 시력이 약한 노인들이다.","대조가 강하면 그 사람들도 읽는다.","시력이 좋은 사람은 당연히 읽는다.","그래서 결과는 '대부분의 사람'이다."]}],"post":["most(대부분의) ↔ a minority of(소수의)","강한 대조 = 시력이 약한 사람까지 읽는 글자"]},{"slots":[["elderly","older","s"],["adjust","regulate","s"],["more"],["limit","expand","a"],["accessible"]],"opts":["limit","strengthen","improve","free"],"or":["limit(제한하다): 손 움직임이 제한되어 마우스 대신 키보드에 의존한다는 다음 문장과 이어져 맞음.","strengthen(강화하다): 움직임을 강화하는 장애라는 말은 성립하지 않음.","improve(개선하다): 장애가 움직임을 좋게 만든다는 건 거꾸로임.","free(자유롭게 하다): 손이 자유로우면 마우스를 피할 이유가 없음."],"om":["제한하다","강화하다","개선하다","자유롭게 하다"],"en":"Some users have disabilities that limit the movement of their hands. They rely on their keyboards, rather than a mouse, to navigate websites.","ko":"어떤 사용자들은 손의 움직임을 제한하는 장애가 있다. 그들은 웹 사이트를 돌아다니기 위해 마우스보다는 키보드에 의존한다.","hl":["limit the movement of their hands","rather than a mouse"],"khl":["손의 움직임을 제한하는","마우스보다는"],"blocks":[{"t":"tap","h":"질문 하나","q":"왜 이 사람들은 마우스보다 키보드를 쓸까?","a":["마우스는 손을 섬세하게 움직여야 한다.","손 움직임이 제한되면 그게 어렵다.","expand(넓히다)를 넣으면 움직임이 넓어진다는 말이 되어 키보드로 옮길 이유가 사라진다."]},{"t":"p","h":"고치지 않는 두 단어","x":["older(나이 든)는 elderly(연로한) 자리에, regulate(조절하다)는 adjust(조절하다) 자리에 그대로 들어간다.","바뀐 단어가 셋이지만 고칠 건 하나뿐."]}],"post":["limit(제한하다) ↔ expand(넓히다)","손 움직임 제한 → 마우스 대신 키보드"]},{"slots":[["contrasts"],["clear","blurry","a"],["altogether"],["entered","typed","s"],["injured"]],"opts":["clear","small","faint","dim"],"or":["clear(또렷한): 글자와 배경 색이 대조를 이룬 결과라 글자가 또렷해지는 게 맞음.","small(작은): 대조는 색의 문제라 글자 크기를 작게 만들지 않음.","faint(희미한): 대조가 강해졌는데 글자가 희미해진다는 건 거꾸로임.","dim(어둑한, 흐릿한): 볼 수 있을 만큼 흐릿하다는 말은 앞뒤가 안 맞음."],"om":["또렷한","작은","희미한","흐릿한"],"en":"For this reason, accessible websites have a background color that contrasts with the color of their text. This makes the text clear enough for most people to see.","ko":"이런 이유로 접근성 있는 웹 사이트들은 글자 색과 대조를 이루는 배경 색을 가지고 있다. 이것은 대부분의 사람들이 볼 수 있을 만큼 글자를 충분히 또렷하게 만든다.","hl":["clear enough for most people to see","contrasts"],"khl":["볼 수 있을 만큼 글자를 충분히 또렷하게","대조를 이루는"],"blocks":[{"t":"p","h":"형용사+enough to(~할 만큼 충분히 …한)","x":["clear enough to see(볼 수 있을 만큼 충분히 또렷한)는 '그래서 보인다'는 뜻이다.","blurry enough to see(볼 수 있을 만큼 흐릿한)는 말이 안 된다.","흐릿할수록 안 보이기 때문이다."]},{"t":"pair","h":"원인과 결과","x":[["a background color that contrasts with the color of their text","글자 색과 대조되는 배경 색 (원인)"],["the text clear enough for most people to see","대부분이 볼 수 있을 만큼 또렷한 글자 (결과)"]]},{"t":"p","h":"typed(입력된)는 맞는 표현","x":["typed(입력된)는 entered(입력된)와 같은 뜻이다.","필드는 정보를 입력하는 칸이다."]}],"post":["clear(또렷한) ↔ blurry(흐릿한)","대조되는 배경 색 → 또렷한 글자"]},{"slots":[["clear"],["adjust"],["altogether","partially","a"],["everything"],["jump"]],"opts":["altogether","secretly","slowly","loudly"],"or":["altogether(완전히): or(또는)로 '볼륨 조절'과 나란히 놓인 두 번째 선택지라, 아예 끄는 것이어야 맞음.","secretly(몰래): 사용자가 직접 고르는 기능인데 몰래 끈다는 건 말이 안 됨.","slowly(천천히): 끄는 속도는 이 문장의 관심이 아님. 핵심은 소리를 얼마나 끄느냐임.","loudly(시끄럽게): 소리를 끄는 동작을 시끄럽게 한다는 건 뜻이 통하지 않음."],"om":["완전히","몰래","천천히","시끄럽게"],"en":"As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.","ko":"음성 콘텐츠에 관해서는, 접근성 있는 웹 사이트들은 사용자가 배경 소리의 볼륨을 조절하거나 그것을 완전히 끌 수 있게 해 준다.","hl":["turn it off altogether","adjust the volume of background sound"],"khl":["완전히 끌","배경 소리의 볼륨을 조절하거나"],"blocks":[{"t":"pair","h":"or(또는)가 고르게 하는 두 가지","x":[["adjust the volume of background sound","배경 소리 볼륨을 조절한다 (조금 줄이기)"],["turn it off altogether","그것을 완전히 끈다 (아예 없애기)"]]},{"t":"p","h":"partially(부분적으로)를 넣으면","x":["\"볼륨을 조절하거나, 부분적으로 끈다.\"","부분적으로 끄는 건 결국 소리를 줄이는 것이다.","그건 앞의 adjust the volume(볼륨을 조절하다)과 같은 말이 되어 or(또는)로 나눌 이유가 없다.","turn off(끄다) 자체도 소리를 없앤다는 뜻이라 '부분적으로'와 부딪친다."]},{"t":"p","h":"누가 아예 끄고 싶을까","x":["청각에 어려움이 있어 배경 소리 때문에 말소리를 못 알아듣는 사람.","조용히 집중하고 싶은 사람.","그래서 다음 문장은 이 기능이 모두에게 more control(더 많은 통제권)을 준다고 한다."]}],"post":["altogether(완전히) ↔ partially(부분적으로)","배경 소리: 볼륨 조절 또는 완전히 끄기"]},{"slots":[["poor","weak","s"],["limit"],["rely_on","depend on","s"],["making_use_of","ignoring","a"],["benefit"]],"opts":["making_use_of","getting_rid_of","staying_away_from","laughing_at"],"or":["making use of(~을 이용하는 것): 다음 문장이 '예를 들어 탭 키를 사용해 건너뛴다'라서 키를 써서 돌아다니는 게 맞음.","getting rid of(~을 없애는 것): 키를 없애면 키보드만으로 돌아다닐 방법이 사라짐.","staying away from(~을 멀리하는 것): 키보드에 의존하는 사람들이 키를 멀리할 리 없음.","laughing at(~을 비웃는 것): 키를 비웃으며 탐색한다는 말은 뜻이 통하지 않음."],"om":["~을 이용하는 것","~을 없애는 것","~을 멀리하는 것","~을 비웃는 것"],"en":"Users navigate the websites by making use of keys such as the space bar, the arrow keys, the enter key, and the tab key. For example, they can use the tab key to jump from one part of a web page to another.","ko":"사용자들은 스페이스 바, 화살표 키, 엔터 키, 탭 키와 같은 키들을 이용하여 웹 사이트를 탐색한다. 예를 들어, 그들은 탭 키를 사용하여 웹 페이지의 한 부분에서 다른 부분으로 건너뛸 수 있다.","hl":["by making use of keys","use the tab key to jump"],"khl":["키들을 이용하여","탭 키를 사용하여"],"blocks":[{"t":"p","h":"For example(예를 들어)이 증인","x":["예시: 탭 키를 사용해 다른 부분으로 건너뛴다.","use(사용하다)라는 동사가 그대로 나온다.","앞 문장이 '키를 무시한다'였다면 이 예시가 나올 수 없다.","ignoring(무시하는 것)은 예시와 정반대다."]},{"t":"flow","h":"본문 ❺의 흐름","x":["손 움직임이 제한된 사용자","마우스 대신 키보드에 의존","키보드만으로 모든 것에 접근","스페이스 바·화살표·엔터·탭 키를 이용","탭 키로 건너뛰기"],"at":3},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","weak(약한)는 poor(좋지 않은) 자리에, depend on(~에 의존하다)은 rely on(~에 의존하다) 자리에 그대로 들어간다."]}],"post":["make use of(~을 이용하다) ↔ ignore(~을 무시하다)","스페이스 바·화살표·엔터·탭 = 키보드 탐색 도구"]}],"quiz":[{"w":"most","m":"대부분의","it":[["nearly all","거의 모든","s"],["rusty","녹슨","n"],["few","(수가) 거의 없는","a"],["almost all","거의 모든","s"],["hollow","속이 빈","n"],["least","가장 적은","a"],["crispy","바삭한","n"]]},{"w":"limit","m":"제한하다","it":[["restrict","제한하다","s"],["expand","넓히다, 확장하다","a"],["whistle","휘파람을 불다","n"],["confine","한정하다, 가두다","s"],["broaden","넓히다","a"],["sweep","쓸다","n"],["dive","잠수하다","n"]]},{"w":"clear","m":"또렷한, 분명한","it":[["distinct","뚜렷한","s"],["blurry","흐릿한","a"],["hungry","배고픈","n"],["sharp","선명한","s"],["fuzzy","흐릿한, 희미한","a"],["generous","관대한","n"],["rural","시골의","n"]]},{"w":"altogether","m":"완전히","it":[["completely","완전히","s"],["indoors","실내에서","n"],["partially","부분적으로","a"],["entirely","전적으로, 완전히","s"],["upstairs","위층에서","n"],["partly","부분적으로, 일부는","a"],["abroad","해외에","n"]]},{"w":"make use of","m":"~을 이용하다","it":[["utilize","활용하다","s"],["yawn","하품하다","n"],["ignore","무시하다","a"],["employ","사용하다","s"],["giggle","킥킥 웃다","n"],["neglect","소홀히 하다","a"],["shiver","떨다","n"]]}]}],"no":"본문 ❹❺"},{"id":"js1-noh2-4f","title":"어휘특훈 · 공통영어2 능률(오) 4과 ⑥+⑦","sub":"색 이외의 지표 · 문화에 맞춘 웹","tpl":"Color blindness is a common visual disability. People with color blindness find it {difficult} to tell some colors apart. This can {cause} problems, {especially} when graphs and charts only use colors to {show} the differences between sets of information. {Accessible} websites use other indicators {along_with} the colors. For example, a line in green may also be dotted, while a line in blue is {solid}. This {ensures} that {everyone} can tell the two lines apart. The accessibility features of websites don’t just {help} people with disabilities. They can make online experiences {easier} for everyone, regardless of abilities or situations. When websites are easy to navigate and understand, we can all {benefit} from a more {inclusive} online experience. Reading and writing systems are {different} across cultures. People from Western cultures read and write from left to right, while those from some Middle Eastern cultures read and write from right to left. People from some Eastern cultures, like that of Japan, read and write from {top} to bottom. Some {global} websites take these {differences} into {consideration} and {adjust} their websites for people in different {regions}. In countries where text is read from right to left, the website’s search button is on the left and the logo is on the right. If you visit the same websites in a different language setting, you will see a different format.","fn":["*color blindness: 색맹","*indicator: 지표, 표시","*tell ~ apart: ~을 구별하다"],"mean":{"difficult":"어려운","tough":"힘든, 어려운","cause":"일으키다, 초래하다","create":"만들어 내다, 일으키다","prevent":"막다, 예방하다","especially":"특히","particularly":"특히","Accessible":"접근 가능한, 이용 가능한","along with":"~와 함께, ~에 더하여","together with":"~와 함께","ensures":"동사 ensure(보장하다)의 3인칭 단수 현재형","guarantees":"동사 guarantee(보장하다)의 3인칭 단수 현재형","everyone":"모든 사람","no one":"아무도 ~않다","help":"돕다","harm":"해치다, 해를 끼치다","easier":"형용사 easy(쉬운)의 비교급. 더 쉬운","simpler":"형용사 simple(간단한)의 비교급. 더 간단한","harder":"형용사 hard(어려운)의 비교급. 더 어려운","benefit":"이익을 얻다, 득을 보다(benefit from ~ = ~로부터 득을 보다)","inclusive":"포용적인, 차별 없는","exclusive":"배타적인, 일부만 받아들이는","different":"다른","diverse":"다양한, 서로 다른","identical":"똑같은, 동일한","top":"맨 위","bottom":"맨 아래","global":"세계적인","international":"국제적인","local":"지역의, 현지의","differences":"명사 difference(차이)의 복수형","similarities":"명사 similarity(유사점)의 복수형","consideration":"고려 (take ~ into consideration = ~을 고려하다)","account":"고려 (take ~ into account = ~을 고려하다)","adjust":"조정하다, 맞추다","adapt":"(상황에) 맞게 고치다, 조정하다","regions":"명사 region(지역)의 복수형","areas":"명사 area(지역)의 복수형","show":"보여 주다","hide":"숨기다","solid":"(선이) 끊기지 않은, 실선의","dotted":"점선의","straightforward":"간단한, 수월한","everybody":"모든 사람"},"comp":[{"no":"본문 ❻❼","slots":[["difficult","straightforward","a"],["especially"],["along_with"],["everyone","everybody","s"],["help"]],"opts":["difficult","fun","useless","unusual"],"or":["difficult(어려운): 색맹은 시각 장애이고, 바로 다음 문장이 '이것은 문제를 일으킬 수 있다'라서 색 구별이 힘들어야 맞음.","fun(재미있는): 색을 구별하는 게 재미있다면 다음 문장의 problems(문제들)로 이어지지 않음.","useless(쓸모없는): 색 구별이 쓸모없다는 말이 아니라, 하기 힘들다는 것이 이 단락의 출발점임.","unusual(특이한): 색 구별이 특이한 일이라는 건 색맹 설명과 관련이 없음."],"om":["어려운","재미있는","쓸모없는","특이한"],"en":"Color blindness is a common visual disability. People with color blindness find it difficult to tell some colors apart. This can cause problems, especially when graphs and charts only use colors to show the differences between sets of information.","ko":"색맹은 흔한 시각 장애이다. 색맹이 있는 사람들은 몇몇 색을 구별하는 것을 어렵다고 느낀다. 이것은 특히 그래프와 차트가 정보 집합들 사이의 차이를 보여 주기 위해 색만 사용할 때 문제를 일으킬 수 있다.","hl":["find it difficult to tell some colors apart","This can cause problems"],"khl":["몇몇 색을 구별하는 것을 어렵다고 느낀다","문제를 일으킬 수 있다"],"blocks":[{"t":"p","h":"색맹이 무엇인지부터","x":["첫 문장: Color blindness is a common visual disability(색맹은 흔한 시각 장애이다).","장애라는 말 자체가 '어떤 일이 힘들다'는 뜻이다.","색맹이 힘든 일은 바로 색 구별이다.","straightforward(간단한, 수월한)를 넣으면 \"색맹인 사람은 색 구별이 수월하다\"가 되어 첫 문장과 부딪친다."]},{"t":"pair","h":"다음 문장이 결과를 말한다","x":[["find it difficult to tell some colors apart","몇몇 색을 구별하기 어렵다 (원인)"],["This can cause problems","이것은 문제를 일으킬 수 있다 (결과)"]]},{"t":"p","h":"everybody(모든 사람)는 그대로","x":["everybody(모든 사람)는 everyone(모든 사람)과 같은 뜻이다.","점선과 실선 덕분에 색맹인 사람을 포함해 누구나 두 선을 구별한다는 말이 그대로다."]}],"post":["difficult(어려운) ↔ straightforward(간단한, 수월한)","색맹 = 몇몇 색 구별이 어려운 시각 장애"]},{"no":"본문 ❻❼","slots":[["especially"],["different","identical","a"],["top"],["global","international","s"],["adjust"]],"opts":["different","unknown","secret","illegal"],"or":["different(다른): 바로 뒤에 서양은 왼→오, 중동은 오→왼, 일본은 위→아래로 서로 다른 예가 줄줄이 나와 맞음.","unknown(알려지지 않은): 뒤에서 각 문화의 방향을 다 알려 주므로 알려지지 않은 게 아님.","secret(비밀의): 읽기 방향은 비밀이 아니라 누구나 아는 차이임.","illegal(불법인): 읽고 쓰는 방향이 불법이라는 말은 뒤의 예시와 아무 관련이 없음."],"om":["다른","알려지지 않은","비밀의","불법인"],"en":"Reading and writing systems are different across cultures. People from Western cultures read and write from left to right, while those from some Middle Eastern cultures read and write from right to left.","ko":"읽기와 쓰기 체계는 문화마다 다르다. 서양 문화권 사람들은 왼쪽에서 오른쪽으로 읽고 쓰는 반면, 일부 중동 문화권 사람들은 오른쪽에서 왼쪽으로 읽고 쓴다.","hl":["are different across cultures","while"],"khl":["문화마다 다르다","반면"],"blocks":[{"t":"flow","h":"첫 문장 뒤의 증거 세 개","x":["서 tion","account","s"],["regions"]],"opts":["help","confuse","ignore","blame"],"or":["help(돕다): don’t just(단지 ~만 하는 것이 아니다) 뒤에 '모두에게 더 쉽게 해 준다'가 이어져 '장애인만 돕는 게 아니라 모두를 돕는다'가 되어 맞음.","confuse(혼란스럽게 하다): 접근성 기능이 장애인을 혼란스럽게 한다는 건 앞 문단 내용과 반대임.","ignore(무시하다): 장애인을 위해 만든 기능이 장애인을 무시한다는 건 말이 안 됨.","blame(비난하다): 기능이 사람을 비난한다는 말은 뜻이 통하지 않음."],"om":["돕다","혼란스럽게 하다","무시하다","비난하다"],"en":"The accessibility features of websites don’t just help people with disabilities. They can make online experiences easier for everyone, regardless of abilities or situations.","ko":"웹 사이트의 접근성 기능들은 장애가 있는 사람들만 돕는 것이 아니다. 그것들은 능력이나 상황에 관계없이 모든 사람에게 온라인 경험을 더 쉽게 만들어 줄 수 있다.","hl":["don’t just help people with disabilities","easier for everyone"],"khl":["장애가 있는 사람들만 돕는 것이 아니다","모든 사람에게"],"blocks":[{"t":"pair","h":"not just A, B도","x":[["don’t just help people with disabilities","장애인만 돕는 게 아니다 (A: 원래 돕는 대상)"],["make online experiences easier for everyone","모두의 경험을 더 쉽게 한다 (B: 범위를 넓힘)"]]},{"t":"p","h":"harm(해치다)이 틀린 이유","x":["don’t just(단지 ~만이 아니다)는 범위를 넓히는 표현이다.","\"장애인만 돕는 게 아니라 모두를 돕는다.\"","harm(해치다)을 넣으면 \"장애인만 해치는 게 아니라 모두를 쉽게 해 준다\"가 된다.","해친다는 말과 쉽게 해 준다는 말이 한 흐름에 같이 설 수 없다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","simpler(더 간단한)는 easier(더 쉬운)와, account(고려)는 consideration(고려)과 같은 뜻이다.","take into account(~을 고려하다)는 take into consideration(~을 고려하다)과 같은 숙어다."]}],"post":["help(돕다) ↔ harm(해치다)","접근성 기능 = 장애인만 X, 모두를 도움"]},{"slots":[["cause","create","s"],["inclusive"],["different"],["global","local","a"],["adjust"]],"opts":["global","offline","abandoned","deleted"],"or":["global(세계적인): 여러 지역 사람들을 위해 화면을 바꾸는 사이트라 세계를 상대하는 사이트여야 맞음.","offline(오프라인의): 오프라인 웹 사이트라는 말은 성립하지 않음.","abandoned(버려진): 관리하지 않는 사이트가 지역마다 화면을 조정할 수는 없음.","deleted(삭제된): 지워진 사이트는 조정할 화면이 없음."],"om":["세계적인","오프라인의","버려진","삭제된"],"en":"Some global websites take these differences into consideration and adjust their websites for people in different regions.","ko":"몇몇 세계적인 웹 사이트들은 이러한 차이를 고려하여 서로 다른 지역의 사람들을 위해 자신의 웹 사이트를 조정한다.","hl":[" usive","배타적인","a"],["muddy","진흙투성이의","n"],["broad","폭넓은","s"],["narrow","좁은, 편협한","a"],["oval","타원형의","n"],["punctual","시간을 잘 지키는","n"]]},{"w":"top","m":"맨 위","it":[["peak","꼭대기","s"],["bottom","맨 아래","a"],["pillow","베개","n"],["summit","정상, 꼭대기","s"],["base","맨 아래, 밑바닥","a"],["onion","양파","n"],["ticket","표","n"]]},{"w":"easy","m":"쉬운","it":[["simple","간단한","s"],["hard","어려운","a"],["golden","금으로 된","n"],["effortless","힘들지 않은","s"],["difficult","어려운","a"],["northern","북쪽의","n"],["noisy","시끄러운","n"]]}]}],"no":"본문 ❻❼"}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
