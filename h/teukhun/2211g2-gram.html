 from(~로부터) 뒤 동명사 starting(시작하는 것)."],["that2","what","a","앞에 some intent(어떤 의도)라는 명사가 있다. 명사를 꾸미는 말은 what(~하는 것)이 아니라 that(~하는)."],["doing","","","전치사 from(~로부터) 뒤 동명사 doing(하는 것)."],["implies","","","주어 The idea(그 개념)가 단수라 implies(암시하다)."]],"opts":["that","whose","whom","where"],"or":["that(~하는, 관계대명사): 앞 명사 some intent(어떤 의도)를 꾸미고, 뒤에 주어가 빠져 있어 맞음.","whose(~의): 바로 뒤에 명사가 와야 하는데 조동사 might(~할 수도 있다)가 와서 안 됨.","whom(~을): 목적어가 빠진 자리에 쓰는 말인데 여기는 주어가 빠졌고, 사람도 아님.","where(~하는 곳): 장소를 받는 관계부사라 뒤 문장이 완전해야 하는데 주어가 빠져 있음."],"point":"관계대명사 that vs. what","en":"In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same.","ko":"어떤 경우에 선제적 조치는 경쟁자들이 같은 행동을 하지 못하게 단념시킬 수 있는 어떤 의도를 그저 발표하는 것일 수도 있다.","hl":["some intent that might discourage"],"khl":["단념시킬 수 있는 어떤 의도"],"blocks":[{"t":"p","h":"what(~하는 것)은 혼자 다니는 말","x":["what(~하는 것)은 그 안에 이미 \"것\"이라는 명사를 품고 있다.","그래서 앞에 명사가 또 있으면 자리가 겹친다.","some intent what(어떤 의도 + ~하는 것)은 명사가 둘이 겹친다.","앞에 명사가 있고 뒤에 주어가 빠졌으면 that(~하는)이나 which(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a friend that lives in Busan.","나는 부산에 사는 친구가 있다. (명사 a friend(친구) + that)"],["What I want is a new bike.","내가 원하는 것은 새 자전거다. (앞에 명사 없이 what)"]]},{"t":"tap","h":"빈자리 찾기","q":"that(~하는) 뒤 might discourage rivals(경쟁자들을 단념시킬 수 있다)에서 빠진 것은?","a":["주어가 빠져 있다.","그 주어가 바로 앞 명사 some intent(어떤 의도)다."]}],"post":["명사(some intent = 어떤 의도) + that(~하는) + 주어 빠진 문장"]},{"slots":[["that2","","","some intent(어떤 의도)를 꾸미는 관계대명사 that(~하는)."],["doing","","","전치사 from(~로부터) 뒤 동명사 doing(하는 것)."],["implies","","","주어 The idea(그 개념)가 단수라 implies(암시하다)."],["much","very","a","more rewarding(더 득이 되는)은 비교급이다. very(매우)는 비교급을 꾸미지 못한다."],["rewarding","","","결정이 득을 \"주는\" 쪽이라 rewarding(득이 되는)."]],"opts":["much","many","so","too"],"or":["much(훨씬): 비교급 more rewarding(더 득이 되는)을 강조하는 부사라 맞음.","many(많은): 셀 수 있는 명사 앞에 쓰는 말이라 형용사 비교급 more rewarding(더 득이 되는)을 강조할 수 없음.","so(아주): 원급을 꾸미는 말이라 비교급 앞에 못 옴.","too(너무): 원급을 꾸미는 말이라 비교급 앞에 못 옴."], ,"en":"Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand.","ko":"거의 틀림없이, 시장이 이미 제품 변형들로 가득 차 있다면 경쟁자들이 아직 손대지 않은 시장 수요의 틈새를 찾기는 더 어렵다.","hl":["Arguably"],"khl":["거의 틀림없이"],"blocks":[{"t":"p","h":"문장 맨 앞 콤마 자리는 부사석","x":["문장 맨 앞에 단어 하나 + 콤마가 오면 뒤 문장 전체를 꾸미는 자리다.","문장 전체를 꾸미는 건 부사(-ly)의 일.","형용사 Arguable(논쟁의 여지가 있는)은 명사만 꾸민다.","꾸밀 명사가 없으니 Arguable(논쟁의 여지가 있는)은 갈 곳이 없다."]},{"t":"pair","h":"쉬운 예시","x":[["Luckily, I found my phone.","다행히 나는 휴대폰을 찾았다. (문장 앞 Luckily(다행히))"],["Sadly, the shop was closed.","안타깝게도 그 가게는 문을 닫았다. (문장 앞 Sadly(안타깝게도))"]]}],"post":["문장 맨 앞 콤마 자리 = 부사: Arguably(거의 틀림없이),"]}],"quiz":[{"s":"I met a girl ___ speaks three languages.","o":["what","that"],"a":1,"ko":"나는 3개 국어를 하는 소녀를 만났다.","why":"명사 a girl(소녀)을 꾸미고 주어가 빠져 있어 that(~하는).","wy":"what(~하는 것): 앞에 명사 a girl(소녀)이 있어서 못 옴."},{"s":"My new phone is ___ better than my old one.","o":["very","much"],"a":1,"ko":"내 새 휴대폰은 옛날 것보다 훨씬 더 좋다.","why":"비교급 better(더 좋은)는 much(훨씬)가 꾸민다.","wy":"very(매우): 원급만 꾸미는 말이라 비교급 better(더 좋은) 앞에 못 옴."},{"s":"You can ___ my pen.","o":["use","uses"],"a":0,"ko":"너는 내 펜을 써도 된다.","why":"조동사 can(~해도 된다) 뒤는 동사원형.","wy":"uses(쓰다, 3인칭 단수형): 조동사 뒤에 s 붙은 동사는 못 옴."},{"s":"When my sister ___ home, she washes her hands.","o":["come","comes"],"a":1,"ko":"언니는 집에 오면 손을 씻는다.","why":"when(~할 때) 뒤 주어 my sister(언니)가 단수라 comes(오다).","wy":"come(오다): s 없는 형태라 단수 주어 my sister(언니)와 안 맞음."},{"s":"___, nobody was hurt.","o":["Lucky","Luckily"],"a":1,"ko":"다행히 아무도 다치지 않았다.","why":"문장 전체를 꾸미는 자리라 부사 Luckily(다행히).","wy":"Lucky(운이 좋은): 형용사라 문장 전체를 꾸밀 수 없음."}]}],"comp":[{"no":"29","slots":[["that","what","a","means(의미하다) 뒤 문장 a strategy is designed ...(전략이 ~하도록 만들어졌다)에 빠진 것이 없다. 완전한 문장을 이끄는 건 that(~라는 것)."],["designed","","","전략은 만들어지는 쪽이라 is designed(만들어진다)."],["starting","","","전치사 from(~로부터) 뒤 동명사 starting(시작하는 것)."],["doing","","","전치사 from(~로부터) 뒤 동명사 doing(하는 것)."],["implies","","","주어 The idea(그 개념)가 단수라 implies(암시하다)."]],"opts":["that","which","whose","whom"],"or":["that(~라는 것, 접속사): 뒤 문장이 주어·동사·목적어를 다 갖춘 완전한 문장이라 맞음.","which(~하는, 관계대명사): 뒤에 빈자리가 있어야 하는데 뒤 문장이 완전하고, 꾸밀 명사도 없음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 a strategy(전략)는 이미 a(하나의)가 붙어 있어 안 됨.","whom(~을): 목적어가 빠진 문장 앞에 쓰는 말인데 뒤 문장이 완전함."],"point":"that vs. what","en":"Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity.","ko":"선매 행위는 어떤 전략이 경쟁자가 특정한 활동을 시작하지 못하게 막도록 만들어졌다는 뜻이다.","hl":["means that","a strategy is designed"],"khl":["만들어졌다는 뜻이다"],"blocks":[{"t":"p","h":"뒤 문장 검사하기","x":["what(~하는 것)은 뒤 문장에 빈자리가 있을 때만 쓴다.","뒤 문장: a strategy(전략은) / is designed(만들어졌다) / to prevent ...(막기 위해).","starting(시작하는 것)의 목적어 some particular activity(특정한 활동)까지 다 있다.","빈자리 없는 완전한 문장 → that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I know that he is honest.","나는 그가 정직하다는 것을 안다. (뒤가 완전 → that)"],["I know what he wants.","나는 그가 원하는 것을 안다. (wants(원하다)의 목적어가 빠짐 → what)"]]},{"t":"tap","h":"확인 질문","q":"Pre-emption means what ...(선매 행위는 ~하는 것을 의미한다)으로 바꾸면 뒤 문장에서 무엇이 남는가?","a":["빈자리가 없는데 what(~하는 것)이 \"것\"을 또 가져와 명사가 남는다.","그래서 틀린다."]}],"post":["means(의미하다) + that(~라는 것) + 완전한 문장"]},{"no":"29","slots":[["potential","","","명사 buyers(구매자들)를 꾸미는 형용사."],["accommodated","","","수요가 채워지는 쪽이라 수동태."],["arguably","","","문장 전체를 꾸미는 부사 Arguably(거의 틀림없이)."],["filled","","","시장이 채워지는 쪽이라 is filled with(~로 채워져 있다)."],["to_find","find","a","it(가짜 주어) ... for competitors(경쟁자들이) 뒤 진짜 주어 자리. 동사원형은 주어가 될 수 없다."]],"opts":["to find","finds","found","to finding"],"or":["to find(찾는 것): 가주어 it이 가리키는 진짜 주어 자리라 to부정사가 맞음.","finds(찾다, 3인칭 단수형): is(~이다)라는 동사가 이미 있어 동사가 겹침.","found(찾았다, 과거·과거분사형): 동사가 겹치고, 경쟁자들이 직접 찾는 쪽이라 p.p.도 안 맞음.","to finding(찾는 것으로): 진짜 주어 자리에 전치사 to + 동명사는 못 옴."],"point":"가주어 it - 진주어 to부정사","en":"If a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand.","ko":"시장이 이미 제품 변형들로 가득 차 있다면 경쟁자들이 아직 손대지 않은 시장 수요의 틈새를 찾기는 더 어렵다.","hl":["it is more difficult","to find"],"khl":["찾기는 더 어렵다"],"blocks":[{"t":"p","h":"it(그것)은 자리만 맡아 둔 가방","x":["it(가주어)은 뜻이 없고 자리만 맡아 둔다.","진짜 주어는 뒤의 to find untapped pockets(틈새를 찾는 것)이다.","for competitors(경쟁자들이)는 \"누가 찾는지\" 알려 주는 말.","진짜 주어 자리라 \"~하는 것\"인 to부정사가 와야 한다."]},{"t":"pair","h":"쉬운 예시","x":[["It is hard for me to wake up early.","나는 일찍 일어나는 것이 힘들다. (진짜 주어 to wake up(일어나는 것))"],["It is fun to play soccer.","축구하는 것은 재미있다. (진짜 주어 to play(하는 것))"]]}],"post":["it(가주어) + for(~가) 사람 + to부정사(진주어): it is difficult for competitors to find(경쟁자들이 찾기 어렵다)"]}],"compquiz":[{"s":"I think ___ she is kind.","o":["what","that"],"a":1,"ko":"나는 그녀가 친절하다고 생각한다.","why":"뒤 문장 she is kind(그녀는 친절하다)가 완전해서 that.","wy":"what(~하는 것): 뒤 문장에 빈자리가 없어서 못 옴."},{"s":"It is important ___ breakfast.","o":["to eat","eat"],"a":0,"ko":"아침을 먹는 것은 중요하다.","why":"가주어 It 뒤 진짜 주어는 to eat(먹는 것).","wy":"eat(먹다): 동사원형은 진짜 주어 자리에 못 옴."}]},{"id":"2211g2-30","no":"30","title":"어법특훈 · 22년 11월 고2 30번","sub":"카운터셰이딩, 동물의 위장 색","tpl":"Countershading is the process of optical flattening {that|that} {provides|provides} camouflage to animals. When sunlight {illuminates|illuminates} an object from above, the object will be brightest on top. The color of the object will {gradually|gradually} shade darker toward the bottom. This shading {gives|gives} the object depth and {allows|allows} the viewer {to_distinguish|to distinguish} {its|its} shape. Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily {visible|visible} when {illuminated|illuminated}. Most animals, however, {are|are} darker above than they {are2|are} below. When they {are_illuminated|are illuminated} from above, the darker back is lightened and the lighter belly is shaded. The animal thus appears {to_be|to be} a single color and easily {blends|blends} in with the substrate. This pattern of coloration, or countershading, {ruins|ruins} the visual impression of shape in the organism. It allows the animal {to_blend|to blend} in with its background.","fn":["*countershading: 카운터셰이딩(명암역위형 보호색)","*camouflage: 위장","*substrate: 밑바탕, 바닥면"],"mean":{"that":"~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","whose":"~의(소유격 관계대명사)","whom":"~을(목적격 관계대명사)","where":"~하는 곳(관계부사)","provides":"제공하다(provide의 3인칭 단수 현재형)","provide":"제공하다(동사원형·현재형)","providing":"제공하는 것, 제공하는(provide의 -ing형)","to provide":"제공하는 것(provide의 to부정사)","having provided":"제공하고 나서(provide의 완료 -ing형)","illuminates":"비추다(illuminate의 3인칭 단수 현재형)","illuminating":"비추는(illuminate의 -ing형)","illuminate":"비추다(동사원형)","to illuminate":"비추는 것(illuminate의 to부정사)","having illuminated":"비추고 나서(illuminate의 완료 -ing형)","illuminated":"빛을 받은(illuminate의 과거분사형)","gradually":"점점, 서서히(부사)","gradual":"점진적인(형용사)","gradualness":"점진성(명사)","graduate":"졸업하다(동사)","graduation":"졸업(명사)","gives":"주다(give의 3인칭 단수 현재형)","allows":"~하게 해 주다(allow의 3인칭 단수 현재형)","allowing":"~하게 해 주는(allow의 -ing형)","allow":"~하게 해 주다(동사원형)","to allow":"~하게 해 주는 것(allow의 to부정사)","having allowed":"~하게 해 주고 나서(allow의 완료 -ing형)","to distinguish":"구별하는 것(distinguish의 to부정사)","distinguish":"구별하다(동사원형)","distinguishing":"구별하는(distinguish의 -ing형)","distinguished":"뛰어난, 구별된(distinguish의 과거분사형)","distinguishes":"구별하다(distinguish의 3인칭 단수 현재형)","its":"그것의(it의 소유격)","visible":"눈에 보이는(형용사)","visibly":"눈에 띄게(부사)","vision":"시력, 시야(명사)","visibility":"눈에 보이는 정도(명사)","visualize":"시각화하다(동사)","are":"~이다(be의 현재형, 복수 주어)","is":"~이다(be의 현재형, 단수 주어)","do":"하다(일반동사를 대신 받는 대동사)","does":"하다(do의 3인칭 단수 현재형, 대동사)","being":"~인 것(be의 -ing형)","are illuminated":"빛을 받다(illuminate의 수동태, 복수 주어)","are illuminating":"비추고 있다(illuminate의 진행형)","is illuminated":"빛을 받다(illuminate의 수동태, 단수 주어)","to be":"~인 것(be의 to부정사)","be":"~이다(동사원형)","been":"~였던(be의 과거분사형)","blends":"섞여 들다(blend의 3인칭 단수 현재형)","ruins":"망가뜨리다(ruin의 3인칭 단수 현재형)","ruin":"망가뜨리다(동사원형)","ruining":"망가뜨리는 것, 망가뜨리는(ruin의 -ing형)","to ruin":"망가뜨리는 것(ruin의 to부정사)","having ruined":"망가뜨리고 나서(ruin의 완료 -ing형)","to blend":"섞여 드는 것(blend의 to부정사)","likes":"좋아하다(like의 3인칭 단수 현재 :["to be","be","is","been"],"or":["to be(~인 것): appear(~처럼 보이다) + to부정사라 맞음.","be(~이다): appear(~처럼 보이다) 뒤에 to 없이 동사원형은 못 옴.","is(~이다): appears(보이다)와 접속사 없이 동사가 둘이 겹침.","been(~였던, 과거분사형): appears(보이다) 바로 뒤에 p.p.는 못 옴."],"point":"appear + to부정사","en":"The animal thus appears to be a single color and easily blends in with the substrate.","ko":"그래서 동물은 한 가지 색처럼 보이고 밑바탕에 쉽게 섞여 든다.","hl":["appears to be"],"khl":["한 가지 색처럼 보이고"],"blocks":[{"t":"p","h":"appear(~처럼 보이다)와 seem(~인 것 같다)은 to be와 한 몸","x":["appear(~처럼 보이다) + to be ~ = ~인 것처럼 보이다.","seem(~인 것 같다)도 똑같이 seem to be(~인 것 같다).","to를 빼거나 -ing를 쓰면 틀린다.","appears to be a single color(한 가지 색처럼 보이다)가 이 글의 핵심, 위장 성공 장면이다."]},{"t":"pair","h":"쉬운 예시","x":[["He seems to be tired.","그는 피곤한 것 같다. (seems to be(~인 것 같다))"],["She appears to be happy.","그녀는 행복해 보인다. (appears to be(~처럼 보인다))"]]}],"post":["appear(~처럼 보이다) + to be: appears to be a single color(한 가지 색처럼 보이다)"]}],"compquiz":[{"s":"The cake ___ by my dad was delicious.","o":["made","making"],"a":0,"ko":"아빠가 만든 케이크는 맛있었다.","why":"케이크는 만들어지는 쪽이라 p.p. made(만들어진).","wy":"making(만드는): 케이크가 직접 뭔가를 만드는 셈이 되어 틀림."},{"s":"He appears ___ sick.","o":["to be","being"],"a":0,"ko":"그는 아파 보인다.","why":"appear(~처럼 보이다) + to be.","wy":"being(~인 것): appear(~처럼 보이다) 뒤에 -ing는 못 옴."}]},{"id":"2211g2-31","no":"31","title":"어법특훈 · 22년 11월 고2 31번","sub":"놀람이 학습을 이끈다","tpl":"No learning is possible without an error signal. Organisms only learn when events {violate|violate} their expectations. In other words, surprise is one of the fundamental drivers of learning. Imagine {hearing|hearing} a series of {identical|identical} notes, AAAAA. Each note {draws|draws} out a response in the auditory areas of your brain — but as the notes {repeat|repeat}, those responses {progressively|progressively} decrease. This is {called|called} “adaptation,” a {deceptively|deceptively} simple phenomenon {that_rel|that} {shows|shows} {that_conj|that} your brain is learning {anticipate|to anticipate} the next event. Suddenly, the note changes: AAAAA#. Your primary auditory cortex {immediately|immediately} shows a strong surprise reaction: not only {does|does} the adaptation fade away, but additional neurons begin to vigorously fire in response to the unexpected sound. And it is not just repetition {that_lead|that} leads to adaptation: {what|what} matters is {whether|whether} the notes are predictable. For instance, if you hear an alternating set of notes, such as ABABA, your brain gets used to this alternation, and the activity in your auditory areas again {decreases|decreases}. This time, however, it is an unexpected repetition, such as ABABB, {that_trig|that} {triggers|triggers} a surprise response.","fn":["*auditory: 청각의","*cortex: (뇌의) 피질","*adaptation: 적응"],"mean":{"violate":"어기다, 어긋나다(동사원형·현재형)","violating":"어기는, 어기는 것(violate의 -ing형)","violates":"어기다(violate의 3인칭 단수 현재형)","to violate":"어기는 것, 어기기 위해(violate의 to부정사)","having violated":"어기고 나서(violate의 완료 -ing형)","hearing":"듣는 것(hear의 -ing형, 동명사)","to hear":"듣는 것(hear의 to부정사)","hear":"듣다(동사원형)","heard":"들었다(hear의 과거형·과거분사형)","to hearing":"듣는 것으로(전치사 to + 동명사)","identical":"똑같은(형용사)","draws":"끌어내다(draw의 3인칭 단수 현재형)","draw":"끌어내다(동사원형·현재형)","drawing":"끌어내는, 끌어내는 것(draw의 -ing형)","to draw":"끌어내는 것(draw의 to부정사)","have drawn":"끌어내 왔다(draw의 현재완료형, 복수 주어)","repeat":"반복되다(동사원형·현재형)","repeating":"반복되는, 반복되는 것(repeat의 -ing형)","repeats":"반복되다(repeat의 3인칭 단수 현재형)","to repeat":"반복하는 것(repeat의 to부정사)","having repeated":"반복하고 나서(repeat의 완료 -ing형)","progressively":"점점, 점진적으로(부사)","progressive":"점진적인(형용사)","progress":"진전(명사) / 나아가다(동사)","progression":"진행(명사)","progressed":"나아갔다(progress의 과거형·과거분사형)","called":"불리는(call의 과거분사형)","calling":"부르는, 부르는 것(call의 -ing형)","call":"부르다(동사원형)","calls":"부르다(call의 3인칭 단수 현재형)","having called":"부르고 나서(call의 완료 -ing형)","deceptively":"겉보기와 달리, 현혹될 정도로(부사)","that":"~하는(관계대명사) / ~라는 것(접속사) / 강조 구문의 that","what":"~하는 것(선행사를 품은 관계대명사)","whom":"~을(목적격 관계대명사, 사람)","whose":"~의(소유격 관계대명사)","where":"~하는 곳(관계부사)","which":"~하는(관계대명사, 앞에 명사가 필요)","how":"~하는 방법(관계부사)","shows":"보여 주다(show의 3인칭 단수 현재형)","to anticipate":"예상하는 것(anticipate의 to부정사)","immediately":"즉시(부사)","does":"하다(do의 3인칭 단수 현재형, 도치에서 쓰는 조동사)","do":"하다(조동사, 복수 주어용)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","has":"가지고 있다, 완료형을 만드는 조동사(have의 3인칭 단수 현재형)","have":"가지고 있다(have의 원형·복수 주어 현재형)","whether":"~인지 아닌지(접속사)","decreases":"감소하다(decrease의 3인칭 단수 현재형)","decrease":"감소하다(동사원형·현재형)","decreasing":"감소하는, 감소하는 것(decrease의 -ing형)","to decrease":"감소하는 것(decrease의 to부정사)","have decreased":"감소해 왔다(decrease의 현재완료형, 복수 주어)","triggers":"일으키다(trigger의 3인칭 단수 현재형)","trigger":"일으키다(동사원형·현재형)","triggering":"일으키는, 일으키는 것(trigger의 -ing형)","to trigger":"일으키는 것(trigger의 to부정사)","have triggered":"일으켜 왔다(trigger의 현재완료형, 복수 주어)","visit":"방문하다(동사원형·현재형)","visiting":"방문하는, 방문하는 것(visit의 -ing형)","winning":"이기는 것, 따는 것(win의 -ing형, 동명사)","to win":"이기는 것(win의 to부정사)","broken":"깨진(break의 과거분사형)","breaking":"깨는, 깨는 것(break의 -ing형)","What":"~하는 것(선행사를 품은 관계대명사, 문장 첫머리)","That":"~라는 것(접속사, 문장 첫머리)","quiet":"조용한(형용사)","quietly":"조용히(부사)","rises":"떠오르다(rise의 3인칭 단수 현재형)","rising":"떠오르는, 떠오르는 것(rise의 -ing형)","makes":"~하게 만들다(make의 3인칭 단수 현재형)","make":"~하게 만들다(동사원형·현재형)"},"sets":[{"items":[{"slots":[["violate","violating","a","when(~할 때) 뒤에도 주어 events(사건들)와 진짜 동사가 있어야 한다. -ing는 동사 자리에 못 온다."],["hearing","","","imagine(상상하다)은 뒤에 -ing를 목적어로 받는다."],["draws","","","Each note(각각의 음)는 하나라서 단수 동사 draws(끌어내다)가 맞다."],["progressively","","","동사 decrease(감소하다)를 꾸미니까 부사가 맞다."],["called","","","이것이 ‘적응’이라고 \"불리는\" 쪽이라 is called(불린다)가 맞다."]],"opts":["violate","violates","to violate","having violated"],"or":["violate(어긋나다): when(~할 때) 뒤 주어 events(사건들)가 복수라 s 없는 현재형 동사가 맞음.","violates(어긋나다, 3인칭 단수형): 주어 events(사건들)는 복수라 s를 붙이면 안 됨.","to violate(어기는 것): to부정사는 동사 자리에 못 와서 when(~할 때) 뒤 문장에 동사가 없어짐.","having violated(어기고 나서): 완료 -ing형이라 동사 자리에 못 오고 when(~할 때) 뒤 문장이 깨짐."],"point":"정동사 vs. 준동사","en":"Organisms only learn when events violate their expectations.","ko":"유기체는 사건이 그들의 기대에 어긋날 때에만 학습한다.","hl":["violate","when events"],"khl":["어긋날","사건이"],"blocks":[{"t":"p","h":"when(~할 때) 뒤는 작은 문장","x":["when(~할 때)은 문장과 문장을 잇는 접속사다.","그래서 when(~할 때) 뒤에도 주어와 동사가 한 세트로 와야 한다.","주어: events(사건들)","동사: violate(어긋나다)","violating(어긋나는)을 쓰면 동사가 사라져 문장이 반쪽이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I feel happy when my friends visit me.","친구들이 나를 찾아올 때 나는 행복하다. (when(~할 때) 뒤 진짜 동사 visit(찾아오다))"],["Call me when you arrive.","도착하면 전화해. (when(~할 때) 뒤 진짜 동사 arrive(도착하다))"]]}],"post":["when(~할 때) + 주어 + 동사: when events violate(사건이 어긋날 때)"]},{"slots":[["that_conj","","","shows(보여 주다)의 목적어이고 뒤가 완전한 문장이라 that(~라는 것)이 맞다."],["immediately","","","동사 shows(보여 주다)를 꾸미니까 부사가 맞다."],["does","","","not only(~뿐만 아니라)가 앞으로 나와 도치. 주어 the adaptation(적응)이 단수라 does(조동사)."],["whether","","","is(~이다) 뒤 보어 자리에서 \"~인지 아닌지\"라는 뜻의 whether(~인지)가 맞다."],["decreases","decrease","a","주어는 the activity(활동), 단수다. in your auditory areas(청각 영역의)는 꾸며 주는 꼬리표일 뿐."]],"opts":["decreases","decreasing","to decrease","have decreased"],"or":["decreases(감소하다, 3인칭 단수형): 진짜 주어 the activity(활동)가 단수라 s 붙은 동사가 맞음.","decreasing(감소하는): -ing는 혼자 동사 자리에 못 와서 and(그리고) 뒤 문장에 동사가 없어짐.","to decrease(감소하는 것): to부정사도 동사 자리에 못 오고, 앞 gets(~하게 되다)와 짝도 안 맞음.","have decreased(감소해 왔다): have(완료 조동사)는 복수 주어용인데 주어 the activity(활동)는 단수라 안 맞음."],"point":"수식받는 주어의 수일치","en":"For instance, if you hear an alternating set of notes, such as ABABA, your brain gets used to this alternation, and the activity in your auditory areas again decreases.","ko":"예를 들어 ABABA처럼 번갈아 나오는 음을 들으면, 뇌는 이 번갈아 나옴에 익숙해지고, 청각 영역의 활동은 다시 감소한다.","hl":["the activity","decreases"],"khl":["활동은","감소한다"],"blocks":[{"t":"p","h":"가까운 단어에 속지 않기","x":["동사 바로 앞에 있는 단어는 areas(영역들), 복수다.","하지만 areas(영역들)는 in(~안의)에 묶인 꼬리표 속 단어다.","꼬리표를 손가락으로 가리면 the activity(활동) ... decreases(감소한다)만 남는다.","주인이 하나니까 s가 붙는다.","again(다시)도 동사를 꾸미는 말일 뿐, 수에는 상관없다."]},{"t":"pair","h":"쉬운 예시","x":[["The color of the flowers is beautiful.","그 꽃들의 색깔은 아름답다. (주인 The color(색깔) → is(~이다))"],["The boxes on the table are heavy.","탁자 위의 상자들은 무겁다. (주인 The boxes(상자들) → are(~이다))"]]}],"post":["꼬리표(in your auditory areas = 청각 영역의) 가리고 주인(the activity = 활동) 보고 decreases(감소한다)"]},{"slots":[["hearing","to hear","a","imagine(상상하다)은 to부정사가 아니라 -ing를 목적어로 받는 동사다."],["identical","","","명사 notes(음들)를 꾸미니까 형용사가 맞다."],["repeat","","","as(~하면서) 뒤 주어 the notes(음들)의 진짜 동사. 복수라 s가 없다."],["called","","","이것이 ‘적응’이라고 \"불리는\" 쪽이라 수동태가 맞다."],["anticipate","","","learn(배우다)은 to부정사를 목적어로 받는다. learning to anticipate(예상하는 것을 배우는)."]],"opts":["hearing","hear","heard","to hearing"],"or":["hearing(듣는 것): imagine(상상하다)은 -ing를 목적어로 받아서 맞음.","hear(듣다): Imagine(상상해라) 뒤에 동사원형이 또 오면 동사가 두 개가 됨.","heard(들었다, hear의 과거·과거분사형): 목적어 자리에 과거형 동사가 올 수 없음.","to hearing(듣는 것으로): imagine(상상하다)은 뒤에 전치사 to가 필요 없는 동사라 틀림."],"point":"동명사 vs. to부정사 목적어","en":"Imagine hearing a series of identical notes, AAAAA.","ko":"일련의 똑같은 음인 AAAAA를 듣는 것을 상상해 보아라.","hl":["Imagine hearing"],"khl":["듣는 것을 상상해 보아라"],"blocks":[{"t":"p","h":"머릿속 그림은 -ing로 그린다","x":["imagine(상상하다)은 머릿속에서 이미 그 장면을 보고 있는 느낌이다.","그래서 진행 중인 그림을 담는 -ing와 잘 어울린다.","같은 편 동사: enjoy(즐기다), mind(꺼리다), avoid(피하다), finish(끝내다), consider(고려하다).","imagine(상상하다) + to부정사는 시험에서 자주 노리는 함정이다."]},{"t":"pair","h":"쉬운 예시","x":[["Imagine winning a million dollars.","백만 달러를 따는 걸 상상해 봐. (imagine(상상하다) + -ing)"],["He avoided looking at me.","그는 나를 보는 것을 피했다. (avoid(피하다) + -ing)"]]}],"post":["imagine(상상하다) + -ing: Imagine hearing(듣는 것을 상상해 봐)"]},{"slots":[["draws","","","Each note(각각의 음)는 단수라 draws(끌어내다)가 맞다."],["progressively","","","동사 decrease(감소하다)를 꾸미는 부사다."],["called","calling","a","This(이것)가 ‘적응’이라고 남에게 \"불리는\" 쪽이다. 수동태 be + p.p.가 필요하다."],["that_conj","","","shows(보여 주다) 뒤 목적어 문장을 이끄는 that(~라는 것)이다."],["immediately","","","동사 shows(보여 주다)를 꾸미는 부사다."]],"opts":["called","call","calls","having called"],"or":["called(불리는): This(이것)가 ‘적응’이라고 불리는 쪽이라 is + p.p.가 맞음.","call(부르다): be동사 is(~이다) 뒤에 동사원형이 바로 올 수 없음.","calls(부르다, 3인칭 단수형): is(~이다)가 이미 동사라 동사가 두 개 겹침.","having called(부르고 나서): is(~이다) 뒤에 완료 -ing형은 못 오고, 불리는 쪽이라 뜻도 안 맞음."],"point":"능동태 vs. 수동태","en":"This is called “adaptation,” a deceptively simple phenomenon that shows that your brain is learning to anticipate the next event.","ko":"이것은 ‘적응’이라 불리며, 뇌가 다음 사건을 예상하는 법을 배우고 있다는 것을 보여 주는, 겉보기에는 단순한 현상이다.","hl":["is called"],"khl":["불리며"],"blocks":[{"t":"p","h":"이름표는 남이 붙여 준다","x":["이름은 내가 붙이는 게 아니라 남이 불러 주는 것이다.","This(이것)는 사람들에게 ‘적응’이라고 불린다.","불리는 쪽이니까 be + p.p.: is called(불린다).","is calling(부르고 있다)이면 이것이 누군가를 부르는 이상한 뜻이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["My dog is called Max.","내 개는 맥스라고 불린다. (개가 불리는 쪽 → is called(불린다))"],["The window was broken by Tom.","그 창문은 톰에 의해 깨졌다. (창문이 깨지는 쪽 → was broken(깨졌다))"]]}],"post":["불리는 쪽이면 be + p.p.: is called(불린다)"]},{"slots":[["repeat","","","as(~하면서) 뒤 주어 the notes(음들)의 진짜 동사다."],["deceptively","","","형용사 simple(단순한)을 꾸미니까 부사가 맞다."],["that_rel","what","a","앞에 명사 phenomenon(현상)이 있다. 명사를 꾸미는 자리엔 what(~하는 것)이 못 온다."],["shows","","","선행사 phenomenon(현상)이 단수라 shows(보여 주다)가 맞다."],["anticipate","","","learn(배우다)은 to부정사를 목적어로 받는다."]],"opts":["that","whom","whose","where"],"or":["that(~하는, 관계대명사): 명사 phenomenon(현상)을 꾸미고 뒤에 주어가 빠져 있어 맞음.","whom(~을, 목적격 관계대명사): 사람을 받는 말이고, 빠진 건 목적어가 아니라 주어라 안 맞음.","whose(~의, 소유격 관계대명사): 바로 뒤에 명사가 와야 하는데 동사 shows(보여 주다)가 옴.","where(~하는 곳, 관계부사): 뒤에 완전한 문장이 와야 하는데 주어가 빠져 있어 안 됨."],"point":"that/which vs. what","en":"This is called “adaptation,” a deceptively simple phenomenon that shows that your brain is learning to anticipate the next event.","ko":"이것은 ‘적응’이라 불리며, 뇌가 다음 사건을 예상하는 법을 배우고 있다는 것을 보여 주는, 겉보기에는 단순한 현상이다.","hl":["phenomenon that shows"],"khl":["보여 주는"],"blocks":[{"t":"p","h":"명사가 보이면 what(~하는 것)은 비켜라","x":["what(~하는 것) 안에는 이미 \"것\"이라는 명사가 들어 있다.","앞에 phenomenon(현상)이라는 명사가 있으니 what(~하는 것)을 또 쓰면 명사가 둘이 된다.","명사 뒤에서 그 명사를 꾸미는 건 that(~하는) 또는 which(~하는).","뒤에 주어가 빠진 것도 확인: ___ shows(보여 준다)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a friend that lives in Seoul.","나는 서울에 사는 친구가 있다. (명사 a friend(친구) + that(~하는))"],["What I need is sleep.","내게 필요한 것은 잠이다. (앞에 명사 없이 What(~하는 것))"]]}],"post":["명사(phenomenon = 현상) + that(~하는) + 주어 빠진 문장"]}],"quiz":[{"s":"I feel happy when my friends ___ me.","o":["visit","visiting"],"a":0,"ko":"친구들이 나를 찾아올 때 나는 행복하다.","why":"when(~할 때) 뒤 주어 my friends(내 친구들)에게 진짜 동사가 필요.","wy":"visiting(방문하는): -ing는 혼자 동사 자리에 못 와서 when(~할 때) 뒤 문장에 동사가 없어짐."},{"s":"The color of the flowers ___ beautiful.","o":["is","are"],"a":0,"ko":"그 꽃들의 색깔은 아름답다.","why":"주인은 The color(색깔). of the flowers(꽃들의)는 꼬리표.","wy":"are(~이다): 복수 동사라 단수 주어 The color(색깔)와 안 맞음."},{"s":"Imagine ___ a million dollars.","o":["winning","to win"],"a":0,"ko":"백만 달러를 따는 걸 상상해 봐.","why":"imagine(상상하다) 뒤는 -ing.","wy":"to win(이기는 것): imagine(상상하다)은 to부정사를 목적어로 받지 않음."},{"s":"The window was ___ by Tom.","o":["broken","breaking"],"a":0,"ko":"그 창문은 톰에 의해 깨졌다.","why":"창문이 깨지는 쪽이라 be + p.p.","wy":"breaking(깨는): 창문이 직접 깨는 게 아니고 by Tom(톰에 의해)이 있어 수동태가 필요함."},{"s":"I have a friend ___ lives in Seoul.","o":["what","that"],"a":1,"ko":"나는 서울에 사는 친구가 있다.","why":"명사 a friend(친구)를 꾸미니 that(~하는).","wy":"what(~하는 것): 앞에 명사 a friend(친구)가 있어서 못 옴."}]},{"items":[{"slots":[["hearing","","","imagine(상상하다) 뒤 -ing 목적어다."],["identical","","","명사 notes(음들)를 꾸미는 형용사다."],["progressively","progressive","a","여기서 decrease(감소하다)는 동사다. 동사를 꾸미는 자리에는 형용사가 못 온다."],["deceptively","","","형용사 simple(단순한)을 꾸미는 부사다."],["immediately","","","동사 shows(보여 주다)를 꾸미는 부사다."]],"opts":["progressively","progress","progression","progressed"],"or":["progressively(점점): 동사 decrease(감소하다)를 꾸미는 자리라 부사가 맞음.","progress(진전, 나아가다): 명사나 동사라 동사 decrease(감소하다)를 꾸밀 수 없고 동사가 겹치기도 함.","progression(진행): 명사라 동사를 꾸밀 수 없음.","progressed(나아갔다): 과거형 동사라 decrease(감소하다)와 동사가 두 개 겹침."],"point":"형용사 자리 vs. 부사 자리","en":"Each note draws out a response in the auditory areas of your brain — but as the notes repeat, those responses progressively decrease.","ko":"각각의 음은 뇌의 청각 영역에서 반응을 끌어내지만, 음이 반복되면서 그 반응은 점점 감소한다.","hl":["progressively decrease","those responses"],"khl":["점점 감소한다","그 반응은"],"blocks":[{"t":"p","h":"decrease(감소)의 두 얼굴","x":["decrease(감소)는 명사(감소)도 되고 동사(감소하다)도 된다.","여기선 those responses(그 반응들) 뒤의 진짜 동사다.","동사를 꾸미는 말은 부사(-ly): progressively(점점).","progressive(점진적인)를 쓰면 decrease(감소)가 명사처럼 보여 문장에 동사가 사라진다."]},{"t":"pair","h":"쉬운 예시","x":[["She speaks quietly.","그녀는 조용히 말한다. (동사 speaks(말한다) ← 부사)"],["It was a quiet room.","그곳은 조용한 방이었다. (명사 room(방) ← 형용사)"]]}],"post":["동사(decrease = 감소하다) 꾸미면 -ly: progressively decrease(점점 감소하다)"]},{"slots":[["shows","","","선행사 phenomenon(현상)이 단수라 shows(보여 주다)."],["that_conj","","","shows(보여 주다) 뒤 완전한 문장을 이끄는 that(~라는 것)."],["does","do","a","not only(~뿐만 아니라) 도치. 조동사는 뒤 주어 the adaptation(적응)에 맞춰야 하는데 단수다."],["that_lead","","","It is ~ that(바로 ~이다) 강조 구문. 강조된 말 repetition(반복) 뒤의 that이다."],["whether","","","is(~이다) 뒤 보어 자리의 whether(~인지)."]],"opts":["does","is","has","are"],"or":["does(조동사): 뒤에 동사원형 fade(사라지다)가 있고 주어 the adaptation(적응)이 단수라 맞음.","is(~이다): be동사 뒤에 동사원형 fade(사라지다)가 올 수 없음.","has(완료 조동사): has 뒤에는 p.p.가 와야 하는데 원형 fade(사라지다)가 옴.","are(~이다): 복수용 be동사이고, 뒤에 동사원형 fade(사라지다)도 올 수 없음."],"point":"도치","en":"not only does the adaptation fade away, but additional neurons begin to vigorously fire in response to the unexpected sound.","ko":"적응이 점차 사라질 뿐만 아니라, 예상치 못한 소리에 반응해 추가적인 뉴런이 힘차게 활성화되기 시작한다.","hl":["not only does the adaptation fade away"],"khl":["적응이 점차 사라질 뿐만 아니라"],"blocks":[{"t":"p","h":"부정어가 앞으로 오면 순서가 바뀐다","x":["not only(~뿐만 아니라), never(결코 ~않다), little(거의 ~않다) 같은 부정의 말이 문장 맨 앞으로 오면 의문문 순서가 된다.","원래 문장: the adaptation fades away(적응이 사라진다).","도치 순서: does(조동사) + 주어 + 동사원형.","그래서 fades(사라진다)의 s는 does(조동사)로 옮겨 가고, fade(사라지다)는 원형이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["Not only does he sing, but he also dances.","그는 노래할 뿐만 아니라 춤도 춘다. (주어 he(그) 단수 → does)"],["Never have I seen such a big dog.","나는 그렇게 큰 개를 본 적이 없다. (Never(결코 ~않다) + have + 주어 + p.p.)"]]},{"t":"tap","h":"확인 질문","q":"주어가 the notes(음들)였다면 ___ 자리는?","a":["do(조동사).","주어가 복수면 does(조동사)가 아니라 do(조동사)."]}],"post":["Not only(~뿐만 아니라) + e auditory areas of your brain.","ko":"각각의 음은 뇌의 청각 영역에서 반응을 끌어낸다.","hl":["Each note draws"],"khl":["각각의 음은"],"blocks":[{"t":"p","h":"each(각각의)는 한 명씩 줄 세우기","x":["each(각각의)는 여럿을 하나씩 따로 떼어 보는 말이다.","줄 선 음들을 한 개씩 차례로 가리키는 느낌.","그래서 each(각각의) + 단수 명사 + 단수 동사.","Each note(각각의 음) → draws(끌어낸다)."]},{"t":"pair","h":"쉬운 예시","x":[["Each student has a book.","학생마다 책이 한 권씩 있다. (Each student(각 학생) → has(가지고 있다))"],["Every child likes candy.","아이들은 모두 사탕을 좋아한다. (Every(모든)도 단수 → likes(좋아한다))"]]}],"post":["Each(각각의) + 단수 명사 + 단수 동사: Each note draws(각각의 음이 끌어낸다)"]},{"slots":[["violate","","","when(~할 때) 뒤 진짜 동사."],["repeat","repeating","a","as(~하면서)는 여기서 \"~하면서\"라는 접속사다. 접속사 뒤에는 주어 the notes(음들)의 진짜 동사가 필요하다."],["called","","","‘적응’이라고 불리는 쪽이라 수동태."],["immediately","","","동사 shows(보여 주다)를 꾸미는 부사."],["whether","","","is(~이다) 뒤 보어 자리의 whether(~인지)."]],"opts":["repeat","repeats","to repeat","having repeated"],"or":["repeat(반복되다): as(~하면서) 뒤 주어 the notes(음들)가 복수라 s 없는 현재형 동사가 맞음.","repeats(반복되다, 3인칭 단수형): 주어 the notes(음들)는 복수라 s를 붙이면 안 됨.","to repeat(반복하는 것): to부정사는 동사 자리에 못 와서 as(~하면서) 뒤 문장이 깨짐.","having repeated(반복하고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"but as the notes repeat, those responses progressively decrease.","ko":"하지만 음이 반복되면서 그 반응은 점점 감소한다.","hl":["as the notes repeat"],"khl":["음이 반복되면서"],"blocks":[{"t":"p","h":"as(~하면서)도 문장을 데리고 온다","x":["as(~하면서, ~할 때)는 접속사다.","접속사는 문장과 문장을 잇는 다리다.","다리 건너편에도 주어 + 동사가 있어야 한다.","주어 the notes(음들) + 동사 repeat(반복되다)."]},{"t":"pair","h":"쉬운 예시","x":[["As the sun rises, it gets warmer.","해가 뜨면서 더 따뜻해진다. (As(~하면서) 뒤 진짜 동사 rises(뜬다))"],["As I grew older, I got taller.","나이가 들면서 나는 키가 더 컸다. (As(~하면서) 뒤 진짜 동사 grew(자랐다))"]]}],"post":["접속사 as(~하면서) + 주어 + 동사: as the notes repeat(음이 반복되면서)"]}],"quiz":[{"s":"She speaks very ___.","o":["quiet","quietly"],"a":1,"ko":"그녀는 아주 조용히 말한다.","why":"동사 speaks(말한다)를 꾸미니 부사.","wy":"quiet(조용한): 형용사라 동사 speaks(말한다)를 꾸밀 수 없음."},{"s":"Not only ___ he sing, but he also dances.","o":["does","is"],"a o":["what","that"],"a":1,"ko":"창문을 깬 건 바로 톰이었다.","why":"It was ~ that(바로 ~였다) 강조 구문.","wy":"what(~하는 것): 강조 구문 It was ~ that(바로 ~였다)의 짝이 될 수 없음."}]},{"id":"2211g2-32","no":"32","title":"어법특훈 · 22년 11월 고2 32번","sub":"접촉 없이 번지는 금융 감염","tpl":"The connectedness of the global economic market {makes|makes} it {vulnerable|vulnerable} to potential “infection.” A financial failure can make {its1|its} way from borrowers to banks to insurers, {spreading|spreading} like a flu. However, there {are|are} unexpected characteristics when it comes to such infection in the market. Infection can {occur|occur} even without any contact. A bank might become insolvent even without {having|having} any of its investments {fail|fail}. Fear and uncertainty can be {damaging|damaging} to financial markets, just as cascading failures due to bad investments. If we all woke up tomorrow and {believed|believed} that Bank X would be insolvent, then it {would_b|would} become insolvent. In fact, it would be enough for us {to_fear1|to fear} {that1|that} others believed that Bank X was going to fail, or just {to_fear2|to fear} our collective fear! We might all even know that Bank X was {well_managed|well-managed} with {healthy|healthy} investments, but if we expected others {to_pull|to pull} their money out, then we would fear {being|being} the last to pull our money out. Financial distress can be self-fulfilling and {is|is} a {particularly|particularly} troublesome aspect of financial markets.","fn":["*insolvent: 지급 불능의, 파산한","*cascading: 연쇄적으로 일어나는","*distress: 곤경, 고통"],"mean":{"makes":"~하게 만들다(make의 3인칭 단수 현재형)","make":"~하게 만들다(동사원형·현재형)","making":"만드는, 만드는 것(make의 -ing형)","to make":"만드는 것, 만들기 위해(make의 to부정사)","have made":"만들어 왔다(make의 현재완료형, 복수 주어)","vulnerable":"취약한, 약한(형용사)","vulnerably":"취약하게(부사)","vulnerability":"취약성(명사)","vulnerabilities":"취약점들(vulnerability의 복수형)","to vulnerable":"(틀린 형태) to 뒤에 형용사 vulnerable(취약한)을 붙인 것","its":"그것의(it의 소유격)","spreading":"퍼지면서(spread의 -ing형, 분사구문)","spreads":"퍼지  수 있다) 뒤에 to를 넣으면 안 됨."],"point":"능동태 vs. 수동태","en":"Infection can occur even without any contact.","ko":"감염은 심지어 아무런 접촉 없이도 일어날 수 있다.","hl":["can occur"],"khl":["일어날 수 있다"],"blocks":[{"t":"p","h":"혼자 일어나는 동사는 수동태가 없다","x":["수동태는 \"누가 무엇을 ~하다\"에서 무엇을 앞으로 끌어낸 모양이다.","그런데 occur(일어나다)는 \"무엇을\"이 없는 동사다.","끌어낼 목적어가 없으니 be occurred(일어나지다)라는 모양도 없다.","같은 편: happen(일어나다), appear(나타나다), disappear(사라지다), arrive(도착하다)."]},{"t":"pair","h":"쉬운 예시","x":[["An accident happened yesterday.","어제 사고가 일어났다. (happen(일어나다) → 수동태 없음)"],["The sun appeared behind the clouds.","해가 구름 뒤에서 나타났다. (appear(나타나다) → 수동태 없음)"]]},{"t":"tap","h":"확인 질문","q":"Infection(감염)이 무엇에 의해 \"일어나지는\" 것인가, 스스로 \"일어나는\" 것인가?","a":["스스로 일어나는 것이다.","그래서 can occur(일어날 수 있다), 능동."]}],"post":["occur(일어나다) = 목적어 없음 → 수동태 X: can occur(일어날 수 있다)"]},{"slots":[["spreading","","","진짜 동사 can make(나아갈 수 있다) 뒤 덧붙인 분사구문."],["having","have","a","without(~없이)은 전치사다. 전치사 뒤에 동사를 쓰려면 -ing 옷을 입혀야 한다."],["to_fear1","","","가짜 주어 it 뒤 진짜 주어 to fear(두려워하는 것)."],["well_managed","","","X은행이 \"운영되는\" 쪽이라 p.p. 형태 well-managed(잘 운영되는)."],["is","","","주어 Financial distress(재정적인 곤경)가 단수이고, can be(~일 수 있다)와 and(그리고)로 나란한 동사."]],"opts":["having","has","had","to have"],"or":["having(겪는 것): 전치사 without(~없이) 뒤라 동명사가 맞음.","has(가지다, 3인칭 단수형): 전치사 without(~없이) 뒤에 동사가 그대로 올 수 없음.","had(가졌다, have의 과거·과거분사형): 전치사 뒤에 과거형 동사는 못 옴.","to have(가지는 것): 전치사 without(~없이) 뒤에 to부정사는 못 옴."],"point":"전치사 + 동명사","en":"A bank might become insolvent even without having any of its investments fail.","ko":"은행은 투자가 하나도 실패하지 않아도 지급 불능 상태가 될 수 있다.","hl":["without having"],"khl":["실패하지 않아도"],"blocks":[{"t":"p","h":"전치사는 명사만 태우는 버스","x":["without(~없이), for(~ 때문에), by(~함으로써), before(~ 전에)는 전치사다.","전치사 버스에는 명사만 탈 수 있다.","동사가 타려면 -ing를 붙여 명사처럼 변신해야 한다.","without have(겪다 없이)는 버스에 동사가 그대로 탄 꼴."]},{"t":"pair","h":"쉬운 예시","x":[["He left without saying goodbye.","그는 작별 인사도 없이 떠났다. (without(~없이) + saying(말하는 것))"],["Thanks for helping me.","도와줘서 고마워. (for(~에 대해) + helping(돕는 것))"]]}],"post":["전치사(without = ~없이) 뒤 동사는 -ing: without having(겪지 않고)"]},{"slots":[["its1","","","A financial failure(금융상의 실패)를 받는 단수 its(그것의)."],["fail","to fail","a","여기 having(겪는 것)은 \"(목적어가) ~하는 일을 겪다\"라는 뜻이다. have(겪다) + 목적어 + 동사원형이라 to가 붙으면 안 된다."],["that1","","","fear(두려워하다)의 목적어이고 뒤가 완전한 문장이라 that(~라는 것)."],["to_fear2","","","or(또는) 앞의 to fear(두려워하는 것)와 같은 모양."],["being","","","fear(두려워하다)의 목적어 자리에 온 동명사 being(~이 되는 것)."]],"opts":["fail","fails","has failed","failure"],"or":["fail(실패하다): have(겪다) + 목적어 + 동사원형 자리이고 투자가 직접 실패하는 능동이라 맞음.","fails(실패하다, 3인칭 단수형): 목적격보어 자리는 원형이라 s가 붙으면 안 됨.","has failed(실패했다): 진짜 동사 모양이라 목적격보어 자리에 못 옴.","failure(실패): 명사라 투자들이 \"실패하다\"라는 동작을 나타내지 못함."],"point":"목적격보어(준동사)","en":"A bank might become insolvent even without having any of its investments fail.","ko":"은행은 투자가 하나도 실패하지 않아도 지급 불능 상태가 될 수 있다.","hl":["having any of its investments fail"],"khl":["투자가 하나도 실패하지 않아도"],"blocks":[{"t":"p","h":"have(시키다, 겪다)는 to를 싫어한다","x":["have(시키다, 겪다), make(만들다), let(허락하다) + 목적어 + 동사원형.","목적어: any of its investments(그것의 투자 중 어느 것이든).","목적어가 하는 동작: fail(실패하다).","투자가 스스로 실패하는 능동이라 원형 fail(실패하다), to fail(실패하는 것)은 틀림."]},{"t":"pair","h":"쉬운 예시","x":[["I had my brother fix my bike.","나는 동생에게 자전거를 고치게 했다. (had(시켰다) + 사람 + fix(고치다))"],["Don't let the baby cry.","아기를 울게 두지 마. (let(~하게 두다) + 사람 + cry(울다))"]]}],"post":["have(겪다) + 목적어 + 동사원형: having any of its investments fail(투자가 실패하는 일을 겪다)"]}],"quiz":[{"s":"The sound of the birds ___ me happy.","o":["makes","make"],"a":0,"ko":"새들의 소리는 나를 행복하게 한다.","why":"주인은 The sound(소리). of the birds(새들의)는 꼬리표.","wy":"make(만들다): 복수 주어용이라 단수 The sound(소리)와 안 맞음."},{"s":"She walked into the room, ___ at me.","o":["smiling","smiled"],"a":0,"ko":"그녀는 나에게 미소 지으며 방으로 걸어 들어왔다.","why":"진짜 동사 walked(걸었다)가 있으니 덧붙임은 -ing.","wy":"smiled(웃었다): 접속사 없이 동사 walked(걸었다) 뒤에 동사가 또 올 수 없음."},{"s":"What will ___ next?","o":["happen","be happened"],"a":0,"ko":"다음에 무슨 일이 일어날까?","why":"happen(일어나다)은 목적어가 없어 수동태가 없음.","wy":"be happened(틀린 형태): happen(일어나다)은 수동태로 쓸 수 없는 동사임."},{"s":"He left without ___ goodbye.","o":["saying","say"],"a":0,"ko":"그는 작별 인사도 없이 떠났다.","why":"전치사 without(~없이) 뒤는 -ing.","wy":"say(말하다): 전치사 without(~없이) 뒤에 동사원형은 못 옴."},{"s":"Don't let the baby ___.","o":["cry","to cry"],"a":0,"ko":"아기를 울게 두지 마.","why":"let(~하게 두다) + 사람 + 동사원형.","wy":"to cry(우는 것): let(~하게 두다) 뒤 목적격보어 자리에는 to 없이 원형이 옴."}]},{"items":[{"slots":[["vulnerable","vulnerably","a","make(만들다) + it(그것) + 보어. 보어는 it(그것)의 상태를 말하는 자리라 부사는 못 온다."],["are","","","진짜 주어 characteristics(특징들)가 복수라 are(있다)."],["damaging","","","두려움이 손해를 \"주는\" 쪽이라 damaging(해로운)."],["would_b","","","If(만약) + 과거형 woke(일어났다) ... 결과는 would(~할 것이다) + 동사원형. 가정법 과거."],["healthy","","","명사 investments(투자들)를 꾸미는 형용사."]],"opts":["vulnerable","vulnerability","vulnerabilities","to vulnerable"],"or":["vulnerable(취약한): make(만들다) + it(그것) 뒤 목적격보어 자리라 상태를 말하는 형용사가 맞음.","vulnerability(취약성): 명사라 \"그것을 취약성으로 만든다\"는 엉뚱한 말이 되고 관사도 없음.","vulnerabilities(취약점들): 복수 명사라 단수 it(그것)과 맞지 않고 뜻도 안 맞음.","to vulnerable(틀린 형태): vulnerable(취약한)은 동사가 아니라 to를 붙일 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"The connectedness of the global economic market makes it vulnerable to potential “infection.”","ko":"전 세계 경제 시장의 연결성은 그것을 잠재적인 ‘감염’에 취약하게 만든다.","hl":["makes it vulnerable"],"khl":["취약하게 만든다"],"blocks":[{"t":"p","h":"\"~하게\"라는 해석에 속지 않기","x":["우리말로는 \"취약하게 만든다\"라서 부사처럼 들린다.","하지만 영어에서 make(만들다) + 목적어 뒤는 목적어의 상태를 말하는 보어 자리다.","it(그것) = vulnerable(취약한). 등호가 성립하면 형용사.","부사 vulnerably(취약하게)는 상태를 말해 주지 못한다."]},{"t":"pair","h":"쉬운 예시","x":[["The news made me happy.","그 소식은 나를 행복하게 했다. (me(나) = happy(행복한) → 형용사)"],["Keep your room clean.","네 방을 깨끗하게 유지해라. (room(방) = clean(깨끗한) → 형용사)"]]}],"post":["make(만들다) + 목적어 + 형용사: makes it vulnerable(그것을 취약하게 만든다)"]},{"slots":[["spreading","","","진짜 동사 can make(나아갈 수 있다) 뒤 덧붙인 분사구문."],["damaging","damaged","a","두려움과 불확실성이 시장에 손해를 \"주는\" 쪽이다. 손상을 \"당하는\" -ed가 아니다."],["believed","","","woke up(일어났다)과 나란한 과거형 동사."],["to_pull","","","expect(예상하다) + 목적어 + to부정사."],["particularly","","","형용사 troublesome(골치 아픈)을 꾸미는 부사."]],"opts":["damaging","damagingly","damages","have damaged"],"or":["damaging(해로운): be damaging to(~에 해롭다). 두려움이 손해를 주는 쪽이라 -ing가 맞음.","damagingly(해롭게): 부사라 be(~이다) 뒤 보어 자리에 못 옴.","damages(손상시키다, 3인칭 단수형): can be(~일 수 있다)가 이미 동사라 동사가 겹침.","have damaged(손상시켜 왔다): can be(~일 수 있다) 뒤에 완료형 동사가 또 올 수 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Fear and uncertainty can be damaging to financial markets, just as cascading failures due to bad investments.","ko":"나쁜 투자 때문에 연쇄적으로 일어나는 실패와 마찬가지로, 두려움과 불확실성도 금융 시장에 해를 끼칠 수 있다.","hl":["can be damaging to"],"khl":["해를 끼칠 수 있다"],"blocks":[{"t":"p","h":"화살표 방향 보기","x":["-ing: 영향을 \"주는\" 쪽. 화살표가 밖으로 나간다.","-ed: 영향을 \"받는\" 쪽. 화살표가 안으로 들어온다.","Fear(두려움) → financial markets(금융 시장). 두려움이 시장을 해친다.","화살표가 밖으로 나가니 damaging(해로운)."]},{"t":"pair","h":"쉬운 예시","x":[["The game was exciting.","그 경기는 신났다. (경기가 신남을 줌 → -ing)"],["I was excited about the game.","나는 그 경기 때문에 신이 났다. (내가 신남을 받음 → -ed)"]]}],"post":["주는 쪽이면 -ing: Fear ... damaging to markets(두려움은 시장에 해롭다)"]},{"slots":[["occur","","","occur(일어나다)는 수동태가 없는 동사."],["having","","","전치사 without(~없이) 뒤 동명사."],["believed","believing","a","If(만약) 뒤 주어 we(우리)의 동사가 woke up(일어났다) and believed(그리고 믿었다)로 이어진다. and(그리고) 뒤도 같은 과거형 동사여야 한다."],["to_fear2","","","or(또는) 앞 to fear(두려워하는 것)와 같은 모양."],["is","","","can be(~일 수 있다) ... and is(그리고 ~이다)로 나란한 동사, 주어 Financial distress(재정적인 곤경)가 단수."]],"opts":["believed","believes","has believed","to believe"],"or":["believed(믿었다): and(그리고) 앞 woke up(일어났다)과 같은 과거형이라 균형이 맞음.","believes(믿다, 3인칭 단수형): 주어 we(우리)는 복수이고 woke(일어났다)와 시제도 안 맞음.","has believed(믿어 왔다): has(가지다)는 단수 주어용이고 woke(일어났다)와 모양도 안 맞음.","to believe(믿는 것): and(그리고) 앞은 동사 woke(일어났다)인데 뒤만 to부정사라 짝이 안 맞음."],"point":"병렬구조","en":"If we all woke up tomorrow and believed that Bank X would be insolvent, then it would become insolvent.","ko":"만약 우리 모두가 내일 일어나서 X은행이 지급 불능이 될 거라고 믿는다면, 그 은행은 정말 지급 불능이 될 것이다.","hl":["woke up","believed"],"khl":["일어나서","믿는다면"],"blocks":[{"t":"p","h":"and(그리고)는 시소","x":["and(그리고) 양쪽에 같은 무게가 앉아야 시소가 평평하다.","왼쪽: woke up(일어났다), 과거형 동사.","오른쪽: believed(믿었다), 과거형 동사.","believing(믿는)을 앉히면 한쪽만 -ing라 시소가 기운다."]},{"t":"pair","h":"쉬운 예시","x":[["I went home and watched TV.","나는 집에 가서 텔레비전을 봤다. (went(갔다) and watched(봤다))"],["She cooked dinner and washed the dishes.","그녀는 저녁을 만들고 설거지를 했다. (cooked(만들었다) and washed(씻었다))"]]}],"post":["and(그리고) 앞뒤 같은 모양: woke up and believed(일어나서 믿었다)"]},{"slots":[["makes","","","주어 The connectedness(연결성)가 단수라 makes(만든다)."],["fail","","","have(겪다) + 목적어 + 동사원형."],["would_b","will","a","If(만약) 절이 과거형 woke(일어났다), believed(믿었다)다. 지금 사실이 아닌 상상이라 결과도 과거형 조동사 would(~할 것이다)가 짝이다."],["well_managed","","","X은행이 \"운영되는\" 쪽이라 p.p. 형태."],["being","","","fear(두려워하다)의 목적어 자리 동명사."]],"opts":["would","would have","shall","can"],"or":["would(~할 것이다): If(만약) + 과거형과 짝을 이루는 가정법 과거라 맞음.","would have(~했을 것이다): 과거 사실을 뒤집는 가정법 과거완료용이라 tomorrow(내일) 이야기와 안 맞음.","shall(~할 것이다): 현재형 조동사라 If(만약) + 과거형과 짝이 안 맞음.","can(~할 수 있다): 현재형 조동사라 가정법 과거의 짝이 될 수 없음."],"point":"가정법 과거","en":"If we all woke up tomorrow and believed that Bank X would be insolvent, then it would become insolvent.","ko":"만약 우리 모두가 내일 일어나서 X은행이 지급 불능이 될 거라고 믿는다면, 그 은행은 정말 지급 불능이 될 것이다.","hl":["If we all woke up","it would become insolvent"],"khl":["만약 우리 모두가 내일 일어나서","지급 불능이 될 것이다"],"blocks":[{"t":"p","h":"상상 세계의 공식","x":["tomorrow(내일)인데 woke(일어났다)라는 과거형을 썼다.","시간이 과거라서가 아니라 \"상상\"이라는 표시다.","공식: If(만약) + 주어 + 과거형, 주어 + would(~할 것이다) + 동사원형.","앞을 과거형으로 열었으면 뒤도 would(~할 것이다)로 닫는다. will(~할 것이다)은 짝이 아니다."]},{"t":"pair","h":"쉬운 예시","x":[["If I had wings, I would fly.","나에게 날개가 있다면 날아갈 텐데. (had(가졌다) → would fly(날아갈 텐데))"],["If I were you, I would wait.","내가 너라면 기다릴 거야. (were(~라면) → would wait(기다릴 거야))"]]}],"post":["If(만약) + 과거형 ..., would(~할 것이다) + 원형: If we woke ..., it would become(지급 불능이 될 것이다)"]},{"slots":[["vulnerable","","","make(만들다) + it(그것) + 형용사 보어."],["believed","","","woke up(일어났다)과 나란한 과거형 동사."],["that1","what","a","fear(두려워하다) 뒤 문장 others believed that ...(다른 사람들이 ~라고 믿었다)는 빠진 것 없이 완전하다. 완전한 문장 앞에는 what(~하는 것)이 못 온다."],["to_pull","","","expect(예상하다) + 목적어 + to부정사."],["particularly","","","형용사 troublesome(골치 아픈)을 꾸미는 부사."]],"opts":["that","which","whose","where"],"or":["that(~라는 것): fear(두려워하다)의 목적어이고 뒤가 완전한 문장이라 맞음.","which(~하는): 앞에 꾸밀 명사가 있어야 하는데 동사 fear(두려워하다) 바로 뒤라 없음.","whose(~의): 바로 뒤에 명사가 와야 하는데 others believed(다른 사람들이 믿었다)는 문장이라 안 맞음.","where(~하는 곳): 장소를 나타내는 말인데 꾸밀 장소 명사가 없음."],"point":"that/which vs. what","en":"In fact, it would be enough for us to fear that others believed that Bank X was going to fail, or just to fear our collective fear!","ko":"사실 다른 사람들이 X은행이 망할 거라고 믿는다는 것을 우리가 두려워하기만 해도, 혹은 그저 우리의 집단적인 두려움을 두려워하기만 해도 충분할 것이다!","hl":["to fear that others believed"],"khl":["믿는다는 것을 우리가 두려워하기만"],"blocks":[{"t":"p","h":"빈자리 찾기 게임","x":["that(~라는 것)과 what(~하는 것)을 가르는 열쇠는 뒤 문장의 빈자리다.","others(다른 사람들, 주어) believed(믿었다, 동사) that Bank X was going to fail(X은행이 망할 거라는 것, 목적어).","주어, 동사, 목적어가 다 있다. 빈자리가 없다.","빈자리 없는 완전한 문장을 데려오는 건 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I know that he is honest.","나는 그가 정직하다는 것을 안다. (뒤가 완전 → that(~라는 것))"],["I know what he wants.","나는 그가 원하는 것을 안다. (wants(원하다)의 목적어가 빔 → what(~하는 것))"]]}],"post":["뒤가 완전한 문장이면 that(~라는 것): fear that others believed(다른 사람들이 믿는다는 것을 두려워하다)"]}],"quiz":[{"s":"The news made me ___.","o":["happy","happily"],"a":0,"ko":"그 소식은 나를 행복하게 했다.","why":"me(나) = happy(행복한). 목적격보어는 형용사.","wy":"happily(행복하게): 부사라 목적어 me(나)의 상태를 말하는 보어 자리에 못 옴."},{"s":"The game was very ___.","o":["exciting","excited"],"a":0,"ko":"그 경기는 아주 신났다.","why":"경기가 신남을 주는 쪽이라 -ing.","wy":"excited(신이 난): 신남을 느끼는 사람에게 쓰는 말이라 경기에는 안 맞음."},{"s":"I went home and ___ TV.","o":["watched","watching"],"a":0,"ko":"나는 집에 가서 TV를 봤다.","why":"went(갔다) and watched(봤다). 과거형 동사끼리 나란히.","wy":"watching(보는): -ing라서 동사 went(갔다)와 and(그리고)로 짝을 이룰 수 없음."},{"s":"If I had wings, I ___ fly.","o":["would","will"],"a":0,"ko":"나에게 날개가 있다면 날아갈 텐데.","why":"If(만약) + 과거형 had(가졌다) → would(~할 텐데).","wy" 먹다) 뒤 목적어 자리에 못 옴.","their(그것들의): 소유격이라 뒤에 명사가 와야 하는데 문장이 거기서 끝남.","themselves(그들 자신): 주어 you(여러분)와 같은 대상이 아니라 재귀대명사를 쓸 수 없음."],"point":"대명사의 성·수·격 일치","en":"you can’t see negative 4 cookies and you certainly can’t eat them","ko":"여러분은 음수 4개의 쿠키를 볼 수 없고 그것들을 먹을 수도 당연히 없다","hl":["negative 4 cookies","eat them"],"khl":["음수 4개의 쿠키를","그것들을 먹을"],"blocks":[{"t":"p","h":"손가락으로 가리켜 보기","x":["대명사는 앞에 나온 명사를 손가락으로 가리키는 말이다.","eat(먹다) 앞으로 가서 먹을 대상을 찾는다.","찾은 것은 negative 4 cookies(음수 4개의 쿠키).","cookies(쿠키들)는 s가 붙은 복수라 it(그것)이 아니라 them(그것들을).","자리도 확인한다. 동사 eat(먹다) 뒤라 목적격."]},{"t":"pair","h":"쉬운 예시","x":[["I made cookies and my sister ate them.","나는 쿠키를 만들었고 여동생이 그것들을 먹었다. (cookies(쿠키들) → them(그것들을))"],["I found a key and gave it to Mom.","나는 열쇠를 찾아서 그것을 엄마에게 드렸다. (a key(열쇠 하나) → it(그것을))"]]}],"post":["여럿 가리키면 them(그것들을): cookies(쿠키들) → eat them(그것들을 먹다)"]},{"slots":[["them","","","eat(먹다)의 목적어, cookies(쿠키들)를 가리키는 복수 목적격."],["contending","contend","a","from debts to ~(빚에서부터 ~까지)의 to(~까지)는 전치사다. 전치사 뒤에 동사를 쓰려면 -ing."],["freezing","","","기온이 모든 걸 얼게 \"만드는\" 쪽이라 -ing가 맞다."],["sidestep","","","\"~을 피하기 위해\"라는 목적을 나타내는 to부정사다."],["printed","","","손실은 \"인쇄되는\" 쪽이라 are printed(인쇄된다)가 맞다."]],"opts":["contending","contended","contends","have contended"],"or":["contending(씨름하는 것, 동명사): 전치사 to(~까지) 뒤라 동명사가 맞음.","contended(씨름했다, 과거·과거분사형): 전치사 뒤에 과거형이나 p.p.는 못 옴.","contends(씨름하다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음.","have contended(씨름해 왔다): 현재완료도 동사라 전치사 뒤에 못 옴."],"point":"전치사 + 동명사","en":"in all aspects of daily life, from debts to contending with freezing temperatures and parking garages","ko":"빚에서부터 몹시 추운 기온과 주차장을 상대하는 것에 이르기까지 일상생활의 모든 면에서","hl":["from debts to contending"],"khl":["빚에서부터","상대하는 것에 이르기까지"],"blocks":[{"t":"p","h":"to(~로, ~까지)의 두 얼굴","x":["to 뒤에 동사원형이 오면 to부정사(~하는 것, ~하기 위해)다.","to가 전치사(~로, ~까지)면 뒤에 명사나 -ing가 온다.","from A to B(A에서 B까지)의 to(~까지)는 전치사다.","A 자리에 명사 debts(빚)가 왔으니 B 자리도 명사 역할이어야 한다.","그래서 동사 contend(씨름하다)에 -ing 옷을 입힌 contending(씨름하는 것)."]},{"t":"pair","h":"쉬운 예시", , 과거형): 진짜 동사 undermine(손상시키다)이 이미 있어 동사가 겹침.","draws(이끌어 내다, 3인칭 단수형): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐.","to drawing(틀린 형태): ability to(~할 능력)의 to는 to부정사라 뒤에 동사원형이 와야 함."],"point":"정동사 vs. 준동사","en":"These confounding factors undermine our ability to draw sound causal conclusions from human epidemiological surveys.","ko":"이러한 교란 변수는 인간 역학 조사로부터 타당한 인과적 결론을 이끌어 낼 우리의 능력을 손상시킨다.","hl":["undermine","our ability to draw"],"khl":["이끌어 낼 우리의 능력을","손상시킨다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["접속사 없는 문장에 진짜 동사는 하나다.","이 문장의 진짜 동사는 undermine(손상시키다).","our ability(우리의 능력) 뒤에서 \"무엇을 할\" 능력인지 덧붙인다.","명사를 뒤에서 꾸밀 땐 동사 옷을 벗긴 to부정사(~할).","draw(이끌어 내다)를 그대로 쓰면 동사가 둘이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I have no time to sleep.","나는 잘 시간이 없다. (time(시간) ← to sleep(잘))"],["She has the ability to swim fast.","그녀는 빨리 수영할 능력이 있다. (ability(능력) ← to swim(수영할))"]]}],"post":["ability(능력) + to + 동사원형: ability to draw(이끌어 낼 능력)"]},{"slots":[["todraw","","","ability(능력)를 꾸미는 to부정사(~할)."],["that","what","a","앞에 선행사 variables(변수들)가 있다. what(~하는 것)은 선행사를 이미 품고 있어서 앞에 명사가 또 올 수 없다."],["make","","","선행사 variables(변수들)가 복수라 make(만들다)."],["toisolate","","","가목적어 it이 가리키는 진짜 목적어, to부정사."],["who","","","선행사 people(사람들)이 사람이고 drink(마시다)의 주어가 빠졌으니 who(~하는)."]],"opts":["that","who","whom","whose"],"or":["that(~하는, 관계대명사): 선행사 variables(변수들)가 사물이고 뒤에 주어가 빠져 있어 맞음.","who(~하는): 사람을 받는 관계대명사라 사물인 variables(변수들)에는 못 씀.","whom(~을): 목적격이라 주어가 빠진 자리에 못 오고, 사람을 받는 말임.","whose(~의): 뒤에 꾸밀 명사가 와야 하는데 바로 동사 make(만들다)가 와서 안 됨."],"point":"that vs. what","en":"Confounding factors are variables (known or unknown) that make it difficult for epidemiologists to isolate the effects of the specific variable being studied.","ko":"교란 변수는 역학자가 연구되고 있는 특정 변수의 영향을 분리하는 것을 어렵게 만드는 (알려졌거나 알려지지 않은) 변수이다.","hl":["variables","that make"],"khl":["변수이다","어렵게 만드는"],"blocks":[{"t":"p","h":"what(~하는 것)은 명사를 품고 다닌다","x":["what(~하는 것) = the thing which(~하는 것). 이미 \"것\"이라는 명사가 들어 있다.","그래서 what(~하는 것) 앞에는 명사가 또 올 수 없다.","여기는 앞에 variables(변수들)라는 명사가 버티고 있다.","명사 뒤에서 \"~하는\"으로 꾸미는 관계대명사는 that(~하는) 또는 which(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the bag that I bought.","이것이 내가 산 가방이다. (명사 the bag(가방) + that)"],["This is what I bought.","이것이 내가 산 것이다. (명사 없이 what)"]]},{"t":"tap","h":"확인 질문","q":"that(~하는) 뒤 make it difficult(어렵게 만든다)에서 빠진 것은?","a":["주어가 빠져 있다.","그 빈 주어 자리를 that(~하는)이 채우고, 그 주인은 variables(변수들)."]}],"post":["명사(variables = 변수들) 뒤 관계대명사는 that, what(~하는 것) 금지"]},{"slots":[["it","","","가목적어 it. 진짜 목적어는 뒤의 to isolate ...(~을 분리하는 것)."],["toisolate","","","make it difficult(어렵게 만들다)의 진짜 목적어, to부정사."],["studied","studying","a","변수는 스스로 연구하는 게 아니라 연구자들이 \"연구하는\" 대상이다. 당하는 쪽이라 being(~되고 있는) + p.p."],["that2","","","argued(주장했다)의 목적어로 완전한 문장을 이끄는 that(~라고)."],["identified","","","주어 researchers(연구자들)의 진짜 동사, 과거형."]],"opts":["being studied","being studying","is studied","having studied"],"or":["being studied(연구되고 있는): 변수는 연구를 당하는 쪽이고, 명사 뒤에서 꾸미는 분사라 맞음.","being studying(틀린 형태): being(~되고 있는) 뒤에는 p.p.나 형용사가 와야 하고 -ing는 못 옴.","is studied(연구된다): 접속사나 관계사 없이 동사가 하나 더 생겨 문장이 깨짐.","having studied(연구하고 나서): 능동이라 변수가 직접 연구했다는 뜻이 되어 틀림."],"point":"능동 v-ing vs. 수동 p.p.","en":"Confounding factors are variables (known or unknown) that make it difficult for epidemiologists to isolate the effects of the specific variable being studied.","ko":"교란 변수는 역학자가 연구되고 있는 특정 변수의 영향을 분리하는 것을 어렵게 만드는 (알려졌거나 알려지지 않은) 변수이다.","hl":["the specific variable being studied"],"khl":["연구되고 있는 특정 변수의"],"blocks":[{"t":"p","h":"누가 연구하나","x":["study(연구하다)의 주인공은 사람(연구자)이다.","variable(변수)은 연구자가 들여다보는 대상이다.","대상 = 당하는 쪽 = p.p.","being studied(연구되고 있는) = 지금 연구를 당하는 중.","studying(연구하는)을 쓰면 변수가 직접 연구하는 셈이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["Look at the house being built.","지어지고 있는 저 집을 봐. (집은 지어짐을 당함 → being built(지어지고 있는))"],["Look at the man building the house.","집을 짓고 있는 저 남자를 봐. (남자가 직접 지음 → building(짓는))"]]}],"post":["변수는 연구를 당하는 쪽: the variable being studied(연구되고 있는 변수)"]},{"slots":[["who","","","사람 선행사 people(사람들) + 주어가 빠진 관계절 → who(~하는)."],["smoke","","","since(~ 때문에) 절의 주어는 people(사람들), 복수라 smoke(담배를 피우다)."],["determining","to determine","a","have difficulty(어려움을 겪다) 뒤에는 -ing가 온다. 원래 in(~하는 데) + -ing에서 in(~하는 데)이 빠진 모양이다."],["disappeared","","","disappear(사라지다)는 목적어 없는 동사라 능동 과거형."],["tocorrect","","","가주어 it의 진짜 주어인 to부정사(~하는 것)."]],"opts":["determining","determine","determined","determines"],"or":["determining(밝히는 것, 동명사): have difficulty (in) -ing(~하는 데 어려움을 겪다)라 맞음.","determine(밝히다): have difficulty(어려움을 겪다) 뒤에 동사원형은 못 옴.","determined(밝혔다, 과거·과거분사형): 연구자들이 직접 밝히는 능동이라 p.p.가 안 되고, 동사가 겹침.","determines(밝히다, 3인칭 단수형): 진짜 동사 have(겪다)가 이미 있어 동사가 겹침."],"point":"동명사 관용 표현","en":"researchers have difficulty determining the link between alcohol consumption and cancer","ko":"연구자들은 알코올 섭취와 암 사이의 연관성을 밝히는 데 어려움을 겪는다","hl":["have difficulty determining"],"khl":["밝히는 데 어려움을 겪는다"],"blocks":[{"t":"p","h":"숨어 있는 in(~하는 데)","x":["원래 모양은 have difficulty in determining(밝히는 데 어려움을 겪다).","in(~하는 데)은 전치사라 뒤에 -ing가 온다.","in(~하는 데)이 자주 생략되지만 -ing는 그대로 남는다.","to determine(밝히는 것)으로 바꾸는 게 시험의 단골 함정.","have trouble -ing(~하는 데 애를 먹다), spend time -ing(~하는 데 시간을 쓰다)도 같은 무리."]},{"t":"pair","h":"쉬운 예시","x":[["I had difficulty finding my seat.","나는 내 자리를 찾는 데 어려움을 겪었다. (had difficulty(어려움을 겪었다) + finding(찾는 것))"],["He spent two hours doing his homework.","그는 숙제를 하는 데 두 시간을 썼다. (spent(썼다) + doing(하는 것))"]]}],"post":["have difficulty(어려움을 겪다) + -ing: have difficulty determining(밝히는 데 어려움을 겪다)"]}],"quiz":[{"s":"The room was ___ cleaned.","o":["nice","nicely"],"a":1,"ko":"그 방은 깔끔하게 청소되었다.","why":"was cleaned(청소되었다) 사이에서 동사를 꾸미니 부사.","wy":"nice(좋은): 형용사라 동사 덩어리를 꾸밀 수 없음."},{"s":"I have no time ___ a movie.","o":["watch","to watch"],"a":1,"ko":"나는 영화를 볼 시간이 없다.","why":"명사 time(시간)을 뒤에서 꾸미는 to watch(볼).","wy":"watch(보다): 진짜 동사 have(가지다)가 있어 동사가 겹침."},{"s":"This is the bag ___ I bought yesterday.","o":["what","that"],"a":1,"ko":"이것이 내가 어제 산 가방이다.","why":"앞에 명사 the bag(가방)이 있으니 that(~하는).","wy":"what(~하는 것): 선행사를 품은 말이라 앞에 명사 the bag(가방)이 또 올 수 없음."},{"s":"Look at the house ___ now.","o":["building","being built"],"a":1,"ko":"지금 지어지고 있는 저 집을 봐.","why":"집은 지어지는 쪽이라 being built(지어지고 있는).","wy":"building(짓는): 집이 직접 무언가를 짓는 셈이라 안 맞음."},{"s":"I had difficulty ___ the answer.","o":["finding","to find"],"a":0,"ko":"나는 답을 찾는 데 어려움을 겪었다.","why":"have difficulty(어려움을 겪다) 뒤는 -ing.","wy":"to find(찾는 것): have difficulty(어려움을 겪다) 뒤에는 to부정사가 못 옴."}]},{"items":[{"slots":[["properly","","","be와 p.p. 사이에서 동사를 꾸미는 부사."],["controlled","control","a","조동사 cannot(~할 수 없다) 뒤 be가 왔으니 다음은 p.p.나 형용사 자리다. 연구는 \"통제되는\" 쪽이라 be + p.p."],["tobe","","","\"~이 되기에\"라는 뜻의 to부정사."],["todraw","","","ability(능력)를 꾸미는 to부정사(~할)."],["studied","","","변수는 연구되는 쪽이라 being(~되고 있는) + p.p."]],"opts":["controlled","to control","having controlled","controls"],"or":["controlled(통제된): 연구는 통제를 당하는 쪽이라 be + p.p. 수동태가 맞음.","to control(통제하는 것): be 뒤에 to부정사를 쓰면 \"연구가 통제해야 한다\"처럼 능동이 되어 뜻도 구조도 깨짐.","having controlled(통제하고 나서): 능동 완료형이라 연구가 직접 통제했다는 뜻이 됨.","controls(통제하다, 통제 집단들): 동사라면 be와 겹치고, 명사라면 부사 properly(적절하게)가 꾸밀 수 없음."],"point":"능동태 vs. 수동태","en":"Observational studies of humans cannot be properly controlled.","ko":"인간에 대한 관찰 연구는 적절하게 통제될 수 없다.","hl":["Observational studies","cannot be properly controlled"],"khl":["관찰 연구는","통제될 수 없다"],"blocks":[{"t":"p","h":"주어가 하는 일인가, 당하는 일인가","x":["주어는 Observational studies(관찰 연구).","연구가 무언가를 통제하는 게 아니다.","연구자가 연구 조건을 통제한다. 연구는 통제를 \"당하는\" 쪽.","당하는 쪽이면 be + p.p. 그래서 be controlled(통제되다).","be 뒤에 동사원형 control(통제하다)을 쓰면 동사가 두 번 겹친다."]},{"t":"pair","h":"쉬운 예시","x":[["The door can be opened easily.","그 문은 쉽게 열릴 수 있다. (문은 열림을 당함 → be opened(열리다))"],["This rule must be followed.","이 규칙은 지켜져야 한다. (규칙은 지켜짐을 당함 → be followed(지켜지다))"]]}],"post":["조동사 + be + p.p.: cannot be controlled(통제될 수 없다)"]},{"slots":[["insufficiently","insufficient","a","뒤에 오는 homogeneous(동질적인)는 형용사다. 형용사를 꾸미는 건 부사(-ly)."],["undermine","","","주어 factors(변수들)가 복수라 undermine(손상시키다)."],["make","","","선행사 variables(변수들)가 복수라 make(만들다)."],["determining","","","have difficulty(어려움을 겪다) 뒤 -ing."],["known","","","교란 변수는 사람에게 \"알려지는\" 쪽이라 are known(알려져 있다)."]],"opts":["insufficiently","insufficiency","sufficient","suffice"],"or":["insufficiently(불충분하게): 형용사 homogeneous(동질적인)를 꾸미는 부사라 맞음.","insufficiency(불충분함): 명사라 형용사 homogeneous(동질적인)를 꾸밀 수 없음.","sufficient(충분한): 형용사라 다른 형용사를 꾸밀 수 없고, 뜻도 정반대가 됨.","suffice(충분하다): 동사라 are(~이다) 뒤에 또 올 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"Thus, they are insufficiently homogeneous to be suitable experimental subjects.","ko":"따라서 그들은 적절한 실험 대상이 되기에 충분히 동질적이지 않다.","hl":["insufficiently homogeneous"],"khl":["충분히 동질적이지 않다"],"blocks":[{"t":"p","h":"형용사 앞에 또 형용사?","x":["are(~이다) 뒤에 보어 homogeneous(동질적인)가 이미 있다.","그 앞의 말은 \"얼마나\" 동질적인지 정도를 말해 준다.","형용사를 꾸미는 건 형용사가 아니라 부사.","insufficient(불충분한)를 넣으면 형용사 두 개가 나란히 붙어 버린다.","very(매우) 자리에 들어간 말이라고 생각하면 쉽다."]},{"t":"pair","h":"쉬운 예시","x":[["The test was surprisingly easy.","그 시험은 놀랄 만큼 쉬웠다. (형용사 easy(쉬운) ← 부사)"],["She is really kind.","그녀는 정말 친절하다. (형용사 kind(친절한) ← 부사)"]]}],"post":["형용사 꾸미면 -ly: insufficiently homogeneous(충분히 동질적이지 않은)"]},{"slots":[["that","","","사물 선행사 variables(변수들) + 주어가 빠진 관계절 → that(~하는)."],["who","","","사람 선행사 people(사람들)을 받는 who(~하는)."],["smoke","smokes","a","since(~ 때문에) 절의 주어는 many people(많은 사람들)이다. who drink(술을 마시는)는 꼬리표."],["determining","","","have difficulty(어려움을 겪다) + -ing."],["that3","","","the fact(사실)의 내용을 풀어 주는 동격 that(~라는)."]],"opts":["smoke","smoking","to smoke","is smoking"],"or":["smoke(담배를 피우다): 주어 many people(많은 사람들)이 복수라 s 없는 현재형이 맞음.","smoking(담배를 피우는 것): -ing는 혼자 동사가 못 돼서 since(~ 때문에) 절에 동사가 없어짐.","to smoke(담배를 피우는 것): to부정사도 동사 자리에 못 옴.","is smoking(담배를 피우는 중이다): 주어가 복수라 is(~이다)가 안 맞고, 습관을 말하는 문장이라 진행형도 어색함."],"point":"수식받는 주어의 수일치","en":"since many people who drink also smoke, researchers have difficulty determining the link between alcohol consumption and cancer","ko":"술을 마시는 많은 사람들이 담배도 피우기 때문에 연구자들은 알코올 섭취와 암 사이의 연관성을 밝히는 데 어려움을 겪는다","hl":["many people who drink also smoke"],"khl":["술을 마시는 많은 사람들이 담배도 피우기"],"blocks":[{"t":"p","h":"동사가 두 개 보일 때","x":["since(~ 때문에) 뒤에 동사처럼 생긴 말이 drink(마시다)와 smoke(피우다) 두 개다.","drink(마시다)는 who(~하는)가 이끄는 꼬리표 안의 동사다.","꼬리표 who drink(술을 마시는)를 가리면 many people also smoke(많은 사람들이 담배도 피운다).","진짜 주인은 people(사람들), 복수. 그래서 smoke(피우다)에 s가 없다."]},{"t":"pair","h":"쉬운 예시","x":[["The students who study hard get good grades.","열심히 공부하는 학생들은 좋은 성적을 받는다. (주인 The students(학생들) → get(받는다))"],["The girl who sings well is my sister.","노래를 잘하는 그 소녀는 내 여동생이다. (주인 The girl(그 소녀) → is(~이다))"]]}],"post":["꼬리표(who drink = 술을 마시는) 가리고 주인(people = 사람들) 보고 smoke(담배를 피우다)"]},{"slots":[["that2","","","argued(주장했다)의 목적어로 완전한 문장을 이끄는 that(~라고)."],["identified","identifying","a","주어 researchers(연구자들) 뒤에 진짜 동사가 하나도 없다. in the famous Framingham study(유명한 프레이밍햄 연구의)는 꼬리표. 동사 자리라 과거형."],["disappeared","","","disappear(사라지다)는 목적어 없는 동사라 능동 과거형."],["known","","","교란 변수는 알려지는 쪽이라 are known(알려져 있다)."],["tocorrect","","","가주어 it의 진짜 주어인 to부정사."]],"opts":["identified","to identify","having identified","identification"],"or":["identified(확인했다, 과거형): 주어 researchers(연구자들)의 진짜 동사 자리라 맞음.","to identify(확인하는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","having identified(확인하고 나서): -ing 형태라 혼자 동사 역할을 못 함.","identification(확인, 식별): 명사라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"Similarly, researchers in the famous Framingham study identified a significant correlation between coffee drinking and coronary heart disease.","ko":"마찬가지로, 유명한 프레이밍햄 연구의 연구자들은 커피를 마시는 것과 관상 동맥성 심장 질환 사이의 상당한 상관관계를 확인했다.","hl":["researchers","identified"],"khl":["연구자들은","확인했다"],"blocks":[{"t":"p","h":"주어 다음엔 동사가 와야 한다","x":["주어: researchers(연구자들).","꼬리표: in the famous Framingham study(유명한 프레이밍햄 연구의).","그다음 자리가 이 문장 하나뿐인 동사 자리다.","identifying(확인하는)을 넣으면 문장 전체에 동사가 사라진다.","주어 + 꼬리표가 길면 동사 자리를 놓치기 쉽다."]},{"t":"pair","h":"쉬운 예시","x":[["The kids in the park saw a big dog.","공원에 있던 아이들은 큰 개를 보았다. (주어 The kids(아이들) → 동사 saw(보았다))"],["My friend from Canada speaks Korean well.","캐나다에서 온 내 친구는 한국어를 잘한다. (주어 My friend(내 친구) → 동 ern the envy {that1|that} {motivates|motivates} people’s actions. The reason for this elusiveness is {simple|simple}: we almost never {directly|directly} {express|express} the envy we are {feeling|feeling}. Envy {entails|entails} the admission to ourselves {that2|that} we are {inferior_to|inferior to} another person in something we value. Not only {is_it|is it} painful {to_admit|to admit} this inferiority, but it is even {worse|worse} for others {to_see|to see} that we are feeling this. And so almost as soon as we {experience|experience} the initial feelings of envy, we are {motivated|motivated} to {disguise|disguise} it to {ourselves|ourselves} — it is not envy we feel but unfairness at the distribution of goods or attention, resentment at this unfairness, even anger.","fn":["*elusive: 정체를 알기 어려운","*discern: 알아차리다","*entail: 수반하다","*disguise: 숨기다, 위장하다"],"mean":{"difficult":"어려운(형용사)","actually":"실제로(부사)","that":"~하는(관계대명사) / ~라는(접속사)","what":"~하는 것(선행사를 품은 관계대명사)","which":"~하는(관계대명사, 뒤에 빈자리가 있어야 함)","whom":"~을(목적격 관계대명사, 사람)","whose":"~의(소유격 관계대명사)","where":"~하는 곳(관계부사, 뒤 문장이 완전해야 함)","motivates":"자극하다, ~하게 만들다(motivate의 3인칭 단수 현재형)","motivate":"자극하다(동사원형·현재형)","motivating":"자극하는 것, 자극하는(motivate의 -ing형)","to motivate":"자극하는 것, 자극하기 위해(motivate의 to부정사)","motivated":"자극받은, 의욕이 생긴(motivate의 과거분사형)","motivation":"동기(명사)","have motivated":"자극해 왔다(motivate의 현재완료형, 복수 주어용)","simple":"간단한(형용사)","directly":"직접(부사)","direct":"직접적인(형용사) / 지시하다(동사)","direction":"방향(명사)","directed":"지시했다, 지시받은(direct의 과거형·과거분사형)","directs":"지시하다(direct의 3인칭 단수 현재형)","express":"표현하다(동사원형·현재형)","expressing":"표현하는 것, 표현하는(express의 -ing형)","to express":"표현하는 것, 표현하기 위해(express의 to부정사)","expresses":"표현하다(express의 3인칭 단수 현재형)","having expressed":"표현하고 나서(express의 완료 -ing형)","feeling":"느끼고 있는(feel의 -ing형, 진행형)","entails":"수반하다(entail의 3인칭 단수 현재형)","inferior to":"~보다 열등한, ~보다 못한","inferior than":"틀린 모양(inferior(열등한)는 than(~보다)이 아니라 to와 짝)","inferiority to":"~보다 열등함(명사 + to)","inferiorly to":"열등하게(부사 ich(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the song that I like.","이것이 내가 좋아하는 노래다. (명사 the song(노래) + that)"],["This is what I like.","이것이 내가 좋아하는 것이다. (명사 없이 what)"]]},{"t":"tap","h":"확인 질문","q":"that(~하는) 앞에 꾸밈을 받는 명사가 있는가?","a":["있다. the envy(질투).","명사가 있으니 what(~하는 것)은 못 온다."]}],"post":["명사(the envy = 질투) + that(~하는) / what(~하는 것)은 명사 없이"]},{"slots":[["that1","","","선행사 the envy(질투)를 꾸미는 관계대명사다."],["directly","direct","a","동사 express(표현하다)를 꾸미는 자리. 형용사 direct(직접적인)는 동사를 꾸밀 수 없다."],["feeling","","","we are feeling(우리가 느끼고 있는). be동사 + -ing 진행형이다."],["that2","","","명사 the admission(인정)의 내용을 완전한 문장으로 풀어 주는 that(~라는)이다."],["to_see","","","it(가주어) ... for others(남들이) to see(보는 것). 진짜 주어 자리의 to부정사다."]],"opts":["directly","direction","directed","directs"],"or":["directly(직접): 동사 express(표현하다)를 앞에서 꾸미는 부사라 맞음.","direction(방향): 명사라 동사 express(표현하다)를 꾸밀 수 없음.","directed(지시했다, 지시받은): 과거형·p.p.라 뒤에 동사 express(표현하다)가 또 있으면 동사가 겹침.","directs(지시하다): 주어 we(우리)와 수가 안 맞고, express(표현하다)와 동사가 겹침."],"point":"형용사 자리 vs. 부사 자리","en":"The reason for this elusiveness is simple: we almost never directly express the envy we are feeling.","ko":"이렇게 알아차리기 어려운 이유는 간단하다. 우리는 우리가 느끼는 질투를 직접 드러내는 일이 거의 없다.","hl":["directly express"],"khl":["직접 드러내는"],"blocks":[{"t":"p","h":"화살표가 어디로 가나","x":["directly(직접) → express(표현하다). 화살표가 동사로 간다.","동사를 꾸미는 건 부사(-ly)의 일이다.","형용사 direct(직접적인)는 명사만 꾸민다. a direct answer(직접적인 대답)처럼.","never(결코 ~않다)와 directly(직접)가 둘 다 동사 express(표현하다) 앞에 줄 서 있다."]},{"t":"pair","h":"쉬운 예시","x":[["He quietly closed the door.","그는 조용히 문을 닫았다. (동사 closed(닫았다) ← 부사)"],["He is a quiet boy.","그는 조용한 소년이다. (명사 boy(소년) ← 형용사)"]]}],"post":["동사 꾸미면 -ly: directly express(직접 표현하다)"]},{"slots":[["simple","","","is(~이다) 뒤 보어 자리라 형용사가 맞다."],["entails","","","주어 Envy(질투)가 단수라 entails(수반하다)."],["is_it","it is","a","Not only(~뿐만 아니라)가 문장 맨 앞에 나오면 뒤는 질문 순서(be동사 + 주어)로 뒤집힌다."],["to_admit","","","it(가주어) ... to admit(인정하는 것). 진짜 주어 자리의 to부정사다."],["motivated","","","we(우리)가 자극을 \"받는\" 쪽이라 be + r public health reasons.","fn":["*public domain: 공공의 영역","*criminal conviction: 유죄 판결","*spent: (형벌 기록이) 효력이 다한"],"mean":{"distinct":"구별되는, 별개의(형용사)","distinctly":"뚜렷하게(부사)","distinction":"구별, 차이(명사)","distinguish":"구별하다(동사원형)","distinguishes":"구별하다(distinguish의 3인칭 단수 현재형)","related":"관련된(relate의 과거분사형)","traditionally":"전통적으로(부사)","traditional":"전통적인(형용사)","tradition":"전통(명사)","traditions":"전통들(명사 tradition의 복수형)","more traditional":"더 전통적인(traditional의 비교급)","regarded":"여겨지는(regard의 과거분사형)","regarding":"~에 관하여(전치사) / 여기는(regard의 -ing형)","regards":"여기다(regard의 3인칭 단수 현재형)","regard":"여기다(동사원형·현재형)","having regarded":"여기고 나서(regard의 완료 -ing형)","revealed":"드러난, 공개된(reveal의 과거분사형)","that":"~하는(관계대명사) / ~라는(접속사)","what":"~하는 것(선행사를 품은 관계대명사)","whom":"~을(목적격 관계대명사, 사람)","whose":"~의(소유격 관계대명사)","where":"~하는 곳(관계부사, 뒤 문장이 완전해야 함)","has been":"있어 왔다(be의 현재완료형, 단수 주어용)","have been":"있어 왔다(be의 현재완료형, 복수 주어용)","been":"있었던(be의 과거분사형)","being":"있는 것, 있는(be의 -ing형)","to be":"있는 것(be의 to부정사)","includes":"포함하다(include의 3인칭 단수 현재형)","include":"포함하다(동사원형·현재형)","including":"~을 포함하여(include의 -ing형)","to include":"포함하는 것(include의 to부정사)","having included":"포함하고 나서(include의 완료 -ing형)","defined":"규정된, 정의된(define의 과거분사형)","is":"~이다(be의 3인칭 단수 현재형)","are":"~이다(be의 현재형, 복수 주어)","be":"~이다(be동사 원형)","were":"~였다(be의 과거형, 복수 주어)","to move":"나아가도록(move의 to부정사)","move":"나아가다, 움직이다(동사원형)","moving":"나아가는 것(move의 -ing형)","moved":"나아갔다(move의 과거형·과거분사형)","moves":"나아가다(move의 3인칭 단수 현재형)","be defined":"규정되다(be 원형 + define의 과거분사, 수동)","being defined":"규정되는 것(being + define의 과거분사)","be defining":"규정하고 있다(be 원형 + define의 -ing형, 능동)","been defined":"규정된(been + define의 과거분사)","defines":"규정하다(define의 3인칭 단수 현재형)","been recognized":"인정된(been + recognize의 과거분사, has와 함께 수동 현재완료)","recognized":"인정했다, 인정된(recognize의 과거형·과거분사형)","being recognized":"인정되는 것(being + recognize의 과거분사)","be recognized":"인정되다(be 원형 + recognize의 과거분사)","recognizing":"인정하는 것(recognize의 -ing형)","continue":"계속하다(동사원형)","Despite":"~에도 불구하고(전치사 ":[["This is a book useful to everyone.","이것은 모두에게 쓸모 있는 책이다. (명사 a book(책) ← 뒤에서 형용사 useful(쓸모 있는))"],["She speaks clearly.","그녀는 또렷하게 말한다. (동사 speaks(말한다) ← 부사)"]]},{"t":"tap","h":"확인 질문","q":"distinct(구별되는)와 but(그러나)으로 짝을 이루는 related(관련된)는 무슨 역할인가?","a":["명사 a right(권리)를 꾸미는 형용사 역할이다.","짝이 형용사 역할이니 distinct(구별되는)도 형용사."]}],"post":["명사(a right = 권리) 뒤 꾸밈 덩어리: distinct(구별되는) from but related(관련된) to"]},{"slots":[["related","","","a right(권리)를 꾸미는 p.p. related(관련된)."],["regarded","regarding","a","정보는 스스로 여기는 게 아니라 사람들에게 \"여겨지는\" 쪽이다. 수동이라 p.p."],["revealed","","","정보가 공개\"되는\" 쪽이라 not to be(~되지 않는) + p.p."],["includes","","","주어 The right(권리)의 진짜 동사, 단수라 s."],["to_move","","","allow(허락하다) + 사람 + to부정사."]],"opts":["regarded","regards","regard","having regarded"],"or":["regarded(여겨지는): 정보가 \"여겨지는\" 쪽이라 p.p.가 명사 information(정보)을 뒤에서 꾸며 맞음.","regards(여기다, 3인칭 단수형): 동사라 문장 동사 is(~이다)와 겹침.","regard(여기다): 동사원형이라 명사를 꾸밀 수 없고 동사가 겹침.","having regarded(여기고 나서): 정보가 남을 여기는 능동이 되어 뜻이 뒤집히고, 명사를 꾸밀 수도 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"The right to privacy is, among other things, the right for information traditionally regarded as protected or personal not to be revealed.","ko":"사생활 권리는 무엇보다도, 전통적으로 보호되거나 개인적인 것으로 여겨져 온 정보가 공개되지 않을 권리이다.","hl":["information traditionally regarded as"],"khl":["여겨져 온 정보가"],"blocks":[{"t":"p","h":"정보가 하나, 당하나","x":["regard(여기다) + A + as(~로) + B: A를 B로 여기다.","누가 여기나? 사람들이 여긴다.","information(정보)은 여김을 \"당하는\" 쪽이다.","당하는 쪽을 꾸밀 땐 p.p. regarded(여겨지는).","-ing인 regarding(여기는)을 쓰면 정보가 남을 여기는 이상한 뜻이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I read a letter written by my grandma.","나는 할머니가 쓰신 편지를 읽었다. (편지가 쓰임 → written(쓰인))"],["Look at the girl writing a letter.","편지를 쓰고 있는 소녀를 봐. (소녀가 씀 → writing(쓰는))"]]}],"post":["당하는 정보 information(정보) + p.p. regarded(여겨지는)"]},{"slots":[["traditionally","","","p.p. regarded(여겨지는)를 꾸미는 부사."],["that","what","a","앞에 information(정보)이라는 명사가 있다. 명사를 꾸미는 관계대명사는 what(~하는 것)이 아니라 that(~하는)."],["defined","","","개인이 정보에 의해 규정\"되는\" 쪽이라 not to be(~되지 않는) + p.p."],["be_defined","","","to move(나아가도록)와 and(그리고)로 나란한 (to) be defined(규정되다)."],["continue","","","should(~해야 한다) ... be와 and not(그리고 ~않다)으로 나란한 동사원형."]],"opts":["that","whom","whose","where"],"or":["that(~하는): 선행사 information(정보) 뒤, 주어가 빠진 절을 이끄는 관계대명사라 맞음.","whom(~을): 사람을 받는 목적격이라 information(정보)을 받을 수 없고, 빠진 것도 주어임.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 has been(있어 왔다)이 와서 안 됨.","where(~하는 곳): 뒤 문장이 완전해야 하는데 has been(있어 왔다)의 주어가 빠져 있음."],"point":"that/which vs. what","en":"The right to be forgotten, in contrast, can be applied to information that has been in the public domain.","ko":"반면에 잊힐 권리는 공공의 영역에 있었던 정보에 적용될 수 있다.","hl":["information that has been"],"khl":["있었던 정보에"],"blocks":[{"t":"p","h":"명사 자리가 이미 찼다","x":["what(~하는 것) 안에는 이미 \"것\"이라는 명사가 들어 있다.","앞에 information(정보)이 있으니 명사 자리가 이미 찼다.","information what(정보 ~하는 것)은 명사가 두 번 나오는 꼴이다.","명사를 뒤에서 꾸밀 땐 that(~하는) 또는 which(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["I lost the pen that you gave me.","나는 네가 준 펜을 잃어버렸다. (명사 the pen(펜) + that)"],["I lost what you gave me.","나는 네가 준 것을 잃어버렸다. (명사 없이 what)"]]}],"post":["명사(information = 정보) + that(~하는) / what(~하는 것)은 명사 없이"]},{"slots":[["revealed","","","정보가 공개되는 쪽이라 p.p."],["has_been","","","선행사 information(정보)이 단수 취급이라 has been(있어 왔다)."],["includes","including","a","주어 The right to be forgotten(잊힐 권리) 뒤에 진짜 동사가 와야 한다. -ing는 혼자 동사가 될 수 없다."],["been_recognized","","","it(가주어)이 인정\"되는\" 쪽이라 has been(~되어 왔다) + p.p. 수동."],["despite","","","뒤에 명사 덩어리 the reason(이유)이 오니 전치사 Despite(~에도 불구하고)."]],"opts":["includes","include","to include","having included"],"or":["includes(포함하다): 주어 The right(권리)가 단수라 s 붙은 현재형 동사가 맞음.","include(포함하다): 단수 주어 The right(권리)에는 s가 붙어야 함.","to include(포함하는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","having included(포함하고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"The right to be forgotten broadly includes the right of an individual not to be forever defined by information from a specific point in time.","ko":"잊힐 권리는 넓게 서 have(복수 주어용)가 아니라 has(단수 주어용)."]},{"t":"pair","h":"쉬운 예시","x":[["The water in the bottle is cold.","병 안의 물은 차갑다. (water(물)는 셀 수 없음 → is(~이다))"],["I have a friend who lives in Seoul.","나는 서울에 사는 친구가 있다. (주인 a friend(친구 한 명) → lives(산다))"]]},{"t":"tap","h":"확인 질문","q":"information(정보), advice(조언), money(돈)의 공통점은?","a":["모두 셀 수 없는 명사다.","그래서 뒤의 동사는 단수 모양: is(~이다), has(단수 주어용), -s."]}],"post":["셀 수 없는 information(정보) → that has been(있어 왔던)"]},{"slots":[["related","","","a right(권리)를 꾸미는 p.p. related(관련된)."],["regarded","","","정보가 여겨지는 쪽이라 p.p."],["includes","","","주어 The right(권리)의 진짜 동사."],["be_defined","being defined","a","allow individuals to move on and not (to) be defined. and(그리고) 뒤도 앞의 to move(나아가도록)와 같은 모양이어야 한다."],["despite","","","뒤에 명사 덩어리가 오니 전치사 Despite(~에도 불구하고)."]],"opts":["be defined","be defining","been defined","defines"],"or":["be defined(규정되다): to move(나아가도록)와 짝을 이루는 (to) + 동사원형 be이고, 규정당하는 수동이라 맞음.","be defining(규정하고 있다): 개인이 남을 규정하는 능동이 되어 뜻이 안 맞고, 뒤의 by(~에 의해)와도 안 맞음.","been defined(규정된): (to) 뒤에는 원형 be가 와야 하는데 p.p. 모양 been(be의 과거분사)이 와서 틀림.","defines(규정하다, 3인칭 단수형): (to) 뒤에 s 붙은 동사는 못 오고, 능동이라 뜻도 반대임."],"point":"병렬구조","en":"One motivation for such a right is to allow individuals to move on with their lives and not be defined by a specific event or period in their lives.","ko":"그런 권리가 필요한 한 가지 이유는, 개인이 자기 삶을 이어 나가고 삶의 특정 사건이나 시기에 의해 규정되지 않게 해 주는 것이다.","hl":["to move on","and not be defined"],"khl":["이어 나가고","규정되지 않게"],"blocks":[{"t":"p","h":"and(그리고)는 저울이다","x":["and(그리고) 양쪽 접시에는 같은 모양이 올라가야 한다.","왼쪽 접시: to move on(나아가도록)","오른쪽 접시: (to) not be defined(규정되지 않도록)","두 번째 to는 반복을 피하려고 생략했다. 그래서 바로 원형 be가 보인다.","being defined(규정되는 것)를 올리면 저울이 기운다."]},{"t":"pair","h":"쉬운 예시","x":[["He wants to sing and dance.","그는 노래하고 춤추고 싶어 한다. (to sing and (to) dance(노래하고 춤추다))"],["I want to rest and not be bothered.","나는 쉬고 싶고 방해받고 싶지 않다. (to rest and (to) not be bothered(쉬고 방해받지 않다))"]]}],"post":["to move(나아가도록) and not (to) be defined(규정되지 않도록): to 생략, 원형 be"]}, ir inherent desire for children {stays|stays} the same.","fn":[],"mean":{"Learn":"배우다(동사원형)","Learning":"배우는 것(learn의 -ing형, 동명사)","beautiful":"아름다운(형용사)","beautifully":"아름답게(부사)","help":"돕다(동사원형)","helping":"돕는 것(help의 -ing형, 동명사)","makes":"만들다(make의 3인칭 단수 현재형)","making":"만드는, 만드는 것(make의 -ing형)","play":"(운동·게임을) 하다(동사원형)","playing":"하는 것(play의 -ing형, 동명사)","unsoundly":"불안정하게(부사)","unsoundness":"불안정함(명사)","more unsoundly":"더 불안정하게(unsoundly의 비교급, 부사)","unsoundest":"가장 불안정한(unsound의 최상급)","wrote":"썼다(write의 과거형)","written":"쓰인(write의 과거분사형)","who":"~하는(사람을 받는 주격 관계대명사)","which":"~하는(사물을 받는 관계대명사)","whom":"~을(사람을 받는 목적격 관계대명사)","whose":"~의(소유격 관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","succeeds":"성공하다(succeed의 3인칭 단수 현재형)","figuring":"알아내는 것(figure의 -ing형, 동명사)","figure":"알아내다(동사원형)","figured":"알아냈다(figure의 과거형·과거분사형)","figures":"알아내다(figure의 3인칭 단수 현재형)","to figure":"알아내는 것(figure의 to부정사)","whether":"~인지 아닌지(접속사)","gained":"얻어진(gain의 과거분사형)","consuming":"소비하는 것(consume의 -ing형, 동명사)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","be":"~이다(be동사 원형)","being":"~인 것, ~이면서(be의 -ing형)","were":"~였다(be의 과거형, 복수 주어)","that":"그것(앞에 나온 단수 명사를 대신하는 지시대명사)","those":"그것들(앞에 나온 복수 명사를 대신하는 지시대명사)","it":"그것(대명사)","this":"이것(지시대명사)","them":"그것들을(they의 목적격)","explaining":"설명하는 것(explain의 -ing형, 동명사)","explain":"설명하다(동사원형)","explains":"설명하다(explain의 3인칭 단수 현재형)","has explained":"설명해 왔다(explain의 현재완료형)","to explaining":"설명하는 것으로(전치사 to + 동명사)","highly":"매우(부사)","high":"높이(부사) / 높은(형용사)","height":"높이(명사)","higher":"더 높은(high의 비교급)","highest":"가장 높은(high의 최상급)","resulted":"생겼다, 비롯되었다(result의 과거형)","were resulted":"(틀린 형태) result는 수동태를 만들 수 없음","was resulted":"(틀린 형태) result는 수동태를 만들 수 없음","resulting":"비롯되는(result의 -ing형)","to result":"비롯되는 것(result의 to부정사)","places":"놓다(place의 3인칭 단수 현재형)","placing":"놓는 것, 놓는(place의 -ing형)","place":"놓다(동사원형·현재형)","to place":"놓는 것, 놓기 위해(place의 to부정사)","having placed":"놓고 나서(place의 완료 -ing형)","unsound":"불안정한, 근거가 약한(형용사)","equivalent":"같은, 동등한(형용사)",
