","resulted(비롯되었다)는 that(~라고) 안쪽 문장의 동사일 뿐이다.","바깥 문장의 동사는 콤마 뒤 places(놓다) 하나다.","이 자리를 placing(놓는 것)으로 바꾸면 주어만 있고 동사가 없는 문장이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["To play games all day makes me tired.","하루 종일 게임하는 것은 나를 피곤하게 한다. (주어 To play games(게임하는 것) → 동사 makes(만든다))"],["To learn English is fun.","영어를 배우는 것은 재미있다. (to부정사 주어는 단수 → is(~이다))"]]}],"post":["긴 주어 To argue(주장하는 것은) ~ 끝나면 진짜 동사: places(놓다)"]},{"slots":[["who","","","an economist(경제학자)라는 사람을 받는 who(~하는)다."],["whether","","","\"~인지 아닌지\"를 이해한다는 뜻의 접속사 whether(~인지 아닌지)다."],["is1","","","주어 the satisfaction(만족감)이 단수라 is(~이다)가 맞다."],["that","those","a","앞의 the satisfaction(만족감)을 대신하는 말이다. 만족감은 하나(단수)라서 that(그것)이어야 한다."],["highly","","","형용사 problematic(문제가 많은)을 꾸미는 부사 highly(매우)다."]],"opts":["that","it","this","them"],"or":["that(그것): 앞에 나온 단수 명사 the satisfaction(만족감)을 대신하고, 뒤에 of another(다른 것의)를 달 수 있어 맞음.","it(그것): 앞 명사를 대신하긴 하지만 뒤에 of another(다른 것의) 같은 꾸밈말을 붙일 수 없음.","this(이것): 비교 문장에서 앞 명사를 받아 of(~의)를 붙이는 말은 that(그것)이지 this(이것)가 아님.","them(그것들을): 복수 목적격이라 단수 the satisfaction(만족감)을 받을 수 없음."],"point":"대명사의 성·수·격 일치","en":"understanding whether the satisfaction gained from consuming one good is greater than that of another","ko":"한 상품을 소비함으로써 얻는 만족감이 다른 상품의 그것(만족감)보다 더 큰지를 이해하는 것","hl":["the satisfaction","that of another"],"khl":["만족감이","다른 상품의 그것(만족감)"],"blocks":[{"t":"p","h":"that(그것)은 앞 명사의 대타","x":["비교 문장에서 같은 명사를 두 번 쓰기 싫을 때 대타를 쓴다.","대타 that(그것)은 앞 명사가 단수일 때, those(그것들)는 복수일 때 쓴다.","여기서 대타가 받는 말은 the satisfaction(만족감)이다.","만족감은 하나로 보는 명사라 those(그것들)가 아니라 that(그것)."]},{"t":"pair","h":"쉬운 예시","x":[["My bag is bigger than that of my sister.","내 가방은 여동생의 그것(가방)보다 크다. (bag(가방) 단수 → that(그것))"],["His shoes are cleaner than those of his friend.","그의 신발은 친구의 그것(신발)보다 깨끗하다. (shoes(신발) 복수 → those(그것들))"]]},{"t":"tap","h":"확인 질문","q":"than(~보다) 뒤 대타가 가리키는 명사는?","a":["the satisfaction(만족감).","단수라서 that(그것)."]}],"post":["단수 명사 the satisfaction(만족감)의 대타 = that of ~(~의 그것)"]},{"slots":[["succeeds","","","주어 an economist(경제학자)가 단수라 succeeds(성공하다)가 맞다."],["consuming","","","전치사 from(~로부터) 뒤라서 동명사 consuming(소비하는 것)이 맞다."],["resulted","were resulted","a","result(비롯되다)는 목적어를 안 받는 동사다. 목적어가 없는 동사는 수동태(be + p.p.)를 만들 수 없다."],["equivalent","","","be동사 be(~이다) 뒤 보어 자리라 형용사 equivalent(같은)가 맞다."],["stays","","","주어 their inherent desire(그들의 내재적 욕구)가 단수라 stays(그대로이다)가 맞다."]],"opts":["resulted","resulting","to result","was resulted"],"or":["resulted(비롯되었다): that(~라고) 안쪽 문장의 동사이고, result(비롯되다)는 목적어 없는 동사라 능동형이 맞음.","resulting(비롯되는): -ing형은 혼자 동사 자리에 못 와서 that(~라고) 안쪽 문장에 동사가 없어짐.","to result(비롯되는 것): to부정사도 동사 자리에 못 와서 문장이 깨짐.","was resulted(틀린 수동형): result(비롯되다)는 목적어가 없는 동사라 수동태 자체가 불가능함."],"point":"능동태 vs. 수동태","en":"the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children","ko":"베이비붐과 그 후의 출산율 급락이 아이에 대한 대중의 내재적인 기호의 증가와 그 후의 감소에서 비롯되었다","hl":["resulted from"],"khl":["비롯되었다"],"blocks":[{"t":"p","h":"목적어가 없으면 수동태도 없다","x":["수동태는 목적어를 주어 자리로 끌어올린 문장이다.","그래서 원래 목적어가 없는 동사는 수동태로 바꿀 재료가 없다.","result(비롯되다), happen(일어나다), appear(나타나다), disappear(사라지다)가 대표 선수다.","resulted from(~에서 비롯되었다)은 능동 그대로 쓴다."]},{"t":"pair","h":"쉬운 예시","x":[["The accident happened last night.","그 사고는 어젯밤에 일어났다. (was happened(틀린 형태) 불가)"],["His success resulted from hard work.","그의 성공은 노력에서 비롯되었다. (resulted from = ~에서 비롯되었다)"]]}],"post":["result from(~에서 비롯되다) = 목적어 없는 동사 → 수동태 불가"]},{"slots":[["figuring","","","전치사 in(~에) 뒤라서 동명사 figuring(알아내는 것)이 맞다."],["gained","","","만족감은 사람이 \"얻는\" 대상이라 과거분사 gained(얻어진)가 맞다."],["unsound","","","명사 position(입장)을 꾸미니 형용사 unsound(불안정한)가 맞다."],["saying","say","a","be equivalent to(~와 같다)의 to(~와)는 전치사다. 전치사 뒤에 동사가 오려면 -ing가 되어야 한다."],["derived","","","만족감은 아이로부터 \"얻어지는\" 것이라 과거분사 derived(얻어진)가 맞다."]],"opts":["saying","said","says","have said"],"or":["saying(말하는 것, 동명사): 전치사 to(~와) 뒤라 동명사가 맞음.","said(말했다, say의 과거·과거분사형): 전치사 to(~와) 뒤에 과거형이나 p.p.는 못 옴.","says(말하다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음.","have said(말해 왔다, 현재완료형): to(~와)가 전치사라 동사원형 덩어리도 못 옴."],"point":"전치사 + 동명사","en":"Such an argument about birth rates would be equivalent to saying that a rise and fall in mortality could be attributed to an increase in the inherent desire change for death.","ko":"출생률에 대한 그러한 주장은 사망률의 상승과 하락이 죽음에 대한 내재적 욕구의 증가 탓이라고 말하는 것과 같을 것이다.","hl":["equivalent to saying"],"khl":["말하는 것과 같을 것이다"],"blocks":[{"t":"p","h":"to(~에, ~와)라고 다 같은 to가 아니다","x":["to + 동사원형은 to부정사다. 이때 to(~하는 것, ~하기 위해)는 동사의 짝꿍이다.","하지만 be equivalent to(~와 같다)의 to(~와)는 명사를 받는 전치사다.","전치사는 명사만 받으니 동사는 -ing 옷을 입고 들어와야 한다.","시험에 자주 나오는 전치사 to: look forward to(~을 기대하다), be used to(~에 익숙하다), when it comes to(~에 관해서라면)."]},{"t":"pair","h":"쉬운 예시","x":[["I look forward to seeing you.","나는 너를 만나기를 기대한다. (to(~을) + seeing(만나는 것))"],["She is used to getting up early.","그녀는 일찍 일어나는 데 익숙하다. (to(~에) + getting up(일어나는 것))"]]}],"post":["be equivalent to(~와 같다) + -ing: equivalent to saying(말하는 것과 같은)"]},{"slots":[["whether","","","\"~인지 아닌지\"를 뜻하는 접속사 whether(~인지 아닌지)다."],["is2","","","주어 explaining ...(설명하는 것)은 동명사 덩어리라 단수, is(~이다)가 맞다."],["places","","","To argue ...(주장하는 것은)의 진짜 동사다."],["attr","","","사망률의 상승과 하락은 무엇의 탓으로 \"돌려지는\" 쪽이라 수동 be attributed(~의 탓으로 여겨지다)가 맞다."],["affect","affects","a","주어는 changes(변화들), 복수다. in income and prices(소득과 가격의)와 rather than changes in tastes(기호의 변화보다는)는 꾸미는 말일 뿐."]],"opts":["affect","affecting","to affect","has affected"],"or":["affect(영향을 미치다): 주어 changes(변화들)가 복수라 s 없는 현재형 동사가 맞음.","affecting(영향을 미치는): -ing형은 혼자 동사 자리에 못 와서 문장에 동사가 사라짐.","to affect(영향을 미치는 것): to부정사도 동사 자리에 못 옴.","has affected(영향을 미쳐 왔다): has(가지다, 단수형)는 단수 주어용이라 복수 changes(변화들)와 안 맞음."],"point":"수식받는 주어의 수일치","en":"For an economist, changes in income and prices, rather than changes in tastes, affect birth rates.","ko":"경제학자에게는 기호의 변화보다는 소득과 가격의 변화가 출생률에 영향을 미친다.","hl":["changes","affect"],"khl":["소득과 가격의 변화가","영향을 미친다"],"blocks":[{"t":"p","h":"꼬리표 두 개 떼기","x":["주인: changes(변화들).","꼬리표 1: in income and prices(소득과 가격의).","꼬리표 2: 콤마 사이의 rather than changes in tastes(기호의 변화보다는).","prices(가격들), tastes(기호들)가 동사 바로 앞에 있어 헷갈리지만 모두 꼬리표다.","꼬리표를 다 떼면 changes affect(변화들이 영향을 미친다). 복수라 s가 없다."]},{"t":"pair","h":"쉬운 예시","x":[["The boys in the room, not the girl, are noisy.","그 소녀가 아니라 방 안의 소년들이 시끄럽다. (주인 The boys(소년들) → are(~이다))"],["The color of the flowers is red.","그 꽃들의 색깔은 빨간색이다. (주인 The color(색깔) → is(~이다))"]]}],"post":["꼬리표 in ~(~의), rather than ~(~보다는) 떼고 주인 changes(변화들) → affect(영향을 미치다)"]}],"quiz":[{"s":"To read many books ___ you smarter.","o":["makes","making"],"a":0,"ko":"책을 많이 읽는 것은 너를 더 똑똑하게 만든다.","why":"To read ...(읽는 것은)가 주어라 진짜 동사 makes(만든다)가 필요함.","wy":"making(만드는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐."},{"s":"His voice is louder than ___ of his brother.","o":["that","those"],"a":0,"ko":"그의 목소리는 형의 그것(목소리)보다 크다.","why":"voice(목소리)가 단수라 that(그것).","wy":"those(그것들): 복수 명사를 받는 말이라 단수 voice(목소리)와 안 맞음."},{"s":"The fire ___ from a small mistake.","o":["resulted","was resulted"],"a":0,"ko":"그 화재는 작은 실수에서 비롯되었다.","why":"result(비롯되다)는 목적어 없는 동사라 능동형.","wy":"was resulted(틀린 수동형): result(비롯되다)는 수동태를 만들 수 없음."},{"s":"Thank you for ___ me.","o":["help","helping"],"a":1,"ko":"도와줘서 고마워.","why":"전치사 for(~에 대해) 뒤는 -ing.","wy":"help(돕다): 전치사 for(~에 대해) 뒤에 동사원형은 못 옴."},{"s":"The books on the desk, not the pen, ___ mine.","o":["is","are"],"a":1,"ko":"그 펜이 아니라 책상 위의 책들이 내 것이다.","why":"주인은 The books(책들), 복수라 are(~이다).","wy":"is(~이다, 단수형): 꼬리표 the pen(그 펜)에 속은 단수형이라 주인 The books(책들)와 안 맞음."}]},{"items":[{"slots":[["who","which","a","선행사 an economist(경제학자)는 사람이다. 사람을 받는 주격 관계대명사는 which(~하는, 사물용)가 아니라 who(~하는)."],["figuring","","","전치사 in(~에) 뒤 동명사 figuring(알아내는 것)이다."],["is1","","","주어 the satisfaction(만족감)이 단수라 is(~이다)."],["highly","","","형용사 problematic(문제가 많은)을 꾸미는 부사다."],["places","","","To argue ...(주장하는 것은)의 진짜 동사다."]],"opts":["who","whom","whose","what"],"or":["who(~하는): 사람 an economist(경제학자)를 받고, 뒤에 주어가 빠진 succeeds(성공하다)가 와서 주격 who가 맞음.","whom(~을): 목적격이라 주어가 빠진 자리에 못 옴.","whose(~의): 소유격이라 바로 뒤에 명사가 와야 하는데 동사 succeeds(성공하다)가 옴.","what(~하는 것): 선행사를 품은 말이라 앞에 an economist(경제학자)가 있으면 못 옴."],"point":"관계대명사(who vs. which)","en":"To an economist who succeeds in figuring out a person’s preference structure","ko":"한 사람의 선호 구조를 알아내는 데 성공한 경제학자에게는","hl":["an economist who succeeds"],"khl":["성공한 경제학자에게는"],"blocks":[{"t":"p","h":"앞 명사가 사람인지 먼저 본다","x":["관계대명사는 앞 명사(선행사)를 뒤 문장과 이어 주는 연결 고리다.","앞 명사가 사람이면 who(~하는), 사물이나 동물이면 which(~하는).","an economist(경제학자)는 사람이다.","뒤에 주어 없이 succeeds(성공하다)가 바로 나오니 주격 who."]},{"t":"pair","h":"쉬운 예시","x":[["I have a friend who speaks Chinese.","나에게는 중국어를 하는 친구가 있다. (friend(친구) 사람 → who(~하는))"],["I have a dog which runs fast.","나에게는 빨리 달리는 개가 있다. (dog(개) 동물 → which(~하는))"]]}],"post":["사람(an economist = 경제학자) + who(~하는) + 동사(succeeds = 성공하다)"]},{"slots":[["succeeds","","","an economist(경제학자)가 단수라 succeeds(성공하다)."],["consuming","","","전치사 from(~로부터) 뒤 동명사다."],["explaining","explain","a","이 자리는 is(~이다)의 주어 자리다. 동사원형 explain(설명하다)은 주어가 될 수 없다."],["resulted","","","result from(~에서 비롯되다)은 능동으로 쓴다."],["equivalent","","","be(~이다) 뒤 보어 자리의 형용사다."]],"opts":["explaining","explains","has explained","to explaining"],"or":["explaining(설명하는 것, 동명사): 동사 is(~이다)의 주어 자리라 명사 역할을 하는 동명사가 맞음.","explains(설명하다, 3인칭 단수형): 동사라 주어가 될 수 없고 is(~이다)와 동사가 겹침.","has explained(설명해 왔다): 현재완료도 동사라 주어 자리에 못 오고 is(~이다)와 동사가 겹침.","to explaining(설명하는 것으로): 주어 앞에 전치사 to(~로)가 붙으면 주어가 될 수 없음."],"point":"정동사 vs. 준동사(동명사 주어)","en":"explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic","ko":"행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은 대개 매우 문제가 많다","hl":["explaining","is"],"khl":["설명하는 것은","문제가 많다"],"blocks":[{"t":"p","h":"동사에 명사 옷 입히기","x":["동사는 그대로 주어 자리에 앉을 수 없다.","주어가 되려면 -ing(동명사)나 to부정사로 명사 옷을 입어야 한다.","이 문장의 진짜 동사는 is(~이다).","그 앞 explaining ... dislikes(호불호를 설명하는 것)가 한 덩어리 주어다.","explain(설명하다)으로 바꾸면 주어 없이 동사만 두 개가 된다."]},{"t":"pair","h":"쉬운 예시","x":[["Swimming is good for your health.","수영하는 것은 건강에 좋다. (Swim is(틀린 형태) 불가)"],["Eating breakfast makes me happy.","아침을 먹는 것은 나를 행복하게 한다. (주어 Eating breakfast(아침 먹는 것))"]]},{"t":"tap","h":"확인 질문","q":"이 문장에서 앞부분 To an economist(경제학자에게는) ... another(다른 것)까지는 무엇인가?","a":["\"경제학자에게는\"이라는 앞머리 꾸밈말이다.","진짜 주어는 그 뒤 explaining(설명하는 것)부터 시작한다."]}],"post":["주어 자리 동사는 -ing: explaining(설명하는 것) ... is(~이다)"]},{"slots":[["whether","","","\"~인지 아닌지\"를 뜻하는 접속사다."],["that","","","단수 the satisfaction(만족감)을 대신하는 that(그것)이다."],["is2","are","a","주어는 explaining ...(설명하는 것). 동명사 덩어리는 하나로 보니 단수다. 바로 앞 likes and dislikes(좋아하는 것과 싫어하는 것)에 속으면 안 된다."],["unsound","","","명사 position(입장)을 꾸미는 형용사다."],["saying","","","전치사 to(~와) 뒤 동명사다."]],"opts":["is","be","being","were"],"or":["is(~이다): 동명사 주어 explaining ...(설명하는 것)은 단수라 is가 맞음.","be(~이다, 원형): 주어 뒤 동사 자리에 원형은 못 옴.","being(~인 것): -ing형이라 동사 자리에 못 와서 문장에 동사가 사라짐.","were(~였다, 복수 과거형): 동명사 주어는 단수이고, 글 전체가 현재 시제라 안 맞음."],"point":"수식받는 주어의 수일치","en":"explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic","ko":"행동을 기저에 있는 호불호의 변화의 관점에서 설명하는 것은 대개 매우 문제가 많다","hl":["explaining","likes and dislikes is"],"khl":["설명하는 것은","문제가 많다"],"blocks":[{"t":"p","h":"동명사 주어는 한 묶음","x":["-ing 주어는 아무리 길어도 \"~하는 것\" 한 개다.","그래서 동사는 항상 단수형으로 받는다. 예: is(~이다), was(~였다), makes(만든다).","동사 바로 앞 likes and dislikes(좋아하는 것과 싫어하는 것)는 복수라 함정이다.","주어 덩어리의 머리 explaining(설명하는 것)을 보고 is(~이다)를 고른다."]},{"t":"pair","h":"쉬운 예시","x":[["Playing with my cats is fun.","내 고양이들과 노는 것은 재미있다. (cats(고양이들)가 아니라 Playing(노는 것) → is(~이다))"],["Reading comic books makes me laugh.","만화책을 읽는 것은 나를 웃게 한다. (Reading(읽는 것) → makes(만든다))"]]}],"post":["-ing 주어(explaining = 설명하는 것)는 단수 → is(~이다)"]},{"slots":[["gained","","","만족감은 사람이 얻는 대상이라 과거분사 gained(얻어진)다."],["is2","","","동명사 주어 explaining ...(설명하는 것)이라 단수, is(~이다)."],["unsound","unsoundly","a","an(하나의)과 명사 position(입장) 사이, 명사를 꾸미는 자리다. 부사 unsoundly(불안정하게)는 명사를 꾸밀 수 없다."],["attr","","","돌려지는 쪽이라 수동 be attributed(~의 탓으로 여겨지다)다."],["stays","","","단수 desire(욕구)라 stays(그대로이다)."]],"opts":["unsound","unsoundness","more unsoundly","unsoundest"],"or":["unsound(불안정한): 명사 position(입장)을 꾸미는 형용사라 맞음.","unsoundness(불안정함): 명사라 명사 position(입장)을 앞에서 꾸밀 수 없고 \"불안정함 입장\"이 됨.","more unsoundly(더 불안정하게): 부사의 비교급이라 명사 position(입장)을 꾸밀 수 없고, an(하나의) 뒤에 올 수도 없음.","unsoundest(가장 불안정한): 최상급은 an(하나의)이 아니라 the(그)와 쓰여야 해서 안 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"To argue ... places a social scientist in an unsound position.","ko":"~라고 주장하는 것은 사회과학자를 불안정한 입장에 놓는다.","hl":["an unsound position"],"khl":["불안정한 입장에"],"blocks":[{"t":"p","h":"누구를 꾸미나 화살표 긋기","x":["unsound(불안정한) → position(입장). 화살표가 명사로 간다.","명사를 꾸미는 건 형용사의 일이다.","-ly를 붙인 부사는 동사, 형용사, 문장 전체를 꾸민다.","이 지문의 highly problematic(매우 문제가 많은)은 부사 highly(매우)가 형용사를 꾸민 경우다."]},{"t":"pair","h":"쉬운 예시","x":[["She lives in a quiet town.","그녀는 조용한 마을에 산다. (명사 town(마을) ← 형용사 quiet(조용한))"],["She speaks quietly.","그녀는 조용히 말한다. (동사 speaks(말한다) ← 부사 quietly(조용히))"]]}],"post":["a/an + 형용사 + 명사: an unsound position(불안정한 입장)"]},{"slots":[["explaining","","","is(~이다)의 주어인 동명사다."],["highly","","","형용사 problematic(문제가 많은)을 꾸미는 부사다."],["equivalent","","","be(~이다) 뒤 보어 자리 형용사다."],["attr","attribute","a","사망률의 상승과 하락은 스스로 무엇을 \"탓으로 돌리는\" 쪽이 아니라, 증가의 탓으로 \"돌려지는\" 쪽이다. 게다가 attribute(~의 탓으로 돌리다) 뒤에 목적어도 없다."],["derived","","","아이로부터 얻어지는 만족감이라 과거분사다."]],"opts":["be attributed","be attributing","have attributed","attributing"],"or":["be attributed(~의 탓으로 여겨지다): 주어 a rise and fall(상승과 하락)이 탓으로 돌려지는 쪽이라 수동형이 맞음.","be attributing(~의 탓으로 돌리고 있다): 진행형 능동이라 상승과 하락이 직접 무언가를 탓하는 꼴이 되고 목적어도 없음.","have attributed(~의 탓으로 돌렸다): 능동 완료형이라 attribute A to B(A를 B의 탓으로 돌리다)의 A(목적어)가 빠짐.","attributing(~의 탓으로 돌리는 것): 조동사 could(~할 수 있다) 뒤에는 동사원형이 와야 해서 -ing는 못 옴."],"point":"능동태 vs. 수동태","en":"a rise and fall in mortality could be attributed to an increase in the inherent desire change for death","ko":"사망률의 상승과 하락이 죽음에 대한 내재적 욕구의 증가 탓으로 여겨질 수 있다","hl":["could be attributed to"],"khl":["탓으로 여겨질 수 있다"],"blocks":[{"t":"p","h":"뒤에 목적어가 있나 확인하기","x":["attribute A to B(A를 B의 탓으로 돌리다).","능동이면 attribute(돌리다) 바로 .","who(누가, ~하는): 사람을 묻거나 받는 말이라 빈자리가 필요한데 뒤 문장이 완전함.","whose(누구의, ~의): 바로 뒤에 명사가 붙어야 하는데 the satisfaction(만족감)이 the(그)로 시작해 붙을 수 없음."],"point":"that/which vs. what","en":"understanding whether the satisfaction gained from consuming one good is greater than that of another","ko":"한 상품을 소비함으로써 얻는 만족감이 다른 상품의 만족감보다 더 큰지를 이해하는 것","hl":["whether","is greater"],"khl":["더 큰지를"],"blocks":[{"t":"p","h":"뒤가 완전한지 빈칸 검사","x":["what(~하는 것)은 자기 안에 주어나 목적어 한 칸을 품고 있다.","그래서 what(~하는 것) 뒤 문장은 한 칸이 비어 있어야 한다.","the satisfaction(만족감)이 주어, is(~이다)가 동사, greater(더 큰)가 보어. 빈 곳이 없다.","뒤가 완전하면 what(~하는 것)이 아니라 접속사 whether(~인지 아닌지)나 that(~라는 것)이 온다."]},{"t":"pair","h":"쉬운 예시","x":[["I don’t know whether he is at home.","나는 그가 집에 있는지 모른다. (뒤 문장 완전 → whether(~인지))"],["I don’t know what he wants.","나는 그가 무엇을 원하는지 모른다. (wants(원하다)의 목적어가 빔 → what(무엇))"]]}],"post":["뒤 문장 완전 + \"~인지\" = whether(~인지 아닌지), what(~하는 것) 불가"]},{"no":"37","slots":[["who","","","사람 an economist(경제학자)를 받는 who(~하는)."],["figuring","figure","a","전치사 in(~에) 뒤 자리다. succeed in(~에 성공하다) 뒤에 동사를 쓰려면 -ing가 되어야 한다."],["gained","","","얻어지는 만족감이라 과거분사."],["consuming","","","전치사 from(~로부터) 뒤 동명사."],["that","","","단수 the satisfaction(만족감)의 대타 that(그것)."]],"opts":["figuring","figured","figures","to figure"],"or":["figuring(알아내는 것, 동명사): 전치사 in(~에) 뒤라 동명사가 맞음.","figured(알아냈다, figure의 과거·과거분사형): 전치사 in(~에) 뒤에 과거형이나 p.p.는 못 옴.","figures(알아내다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음.","to figure(알아내는 것): 전치사 in(~에) 바로 뒤에 to부정사는 못 옴."],"point":"전치사 + 동명사","en":"To an economist who succeeds in figuring out a person’s preference structure","ko":"한 사람의 선호 구조를 알아내는 데 성공한 경제학자에게는","hl":["succeeds in figuring out"],"khl":["알아내는 데 성공한"],"blocks":[{"t":"p","h":"succeed(성공하다)는 in(~에)과 한 몸","x":["succeed in(~에 성공하다)은 짝으로 외운다.","in(~에)은 전치사라서 명사나 -ing만 받는다.","figure out(알아내다)이 들어가려면 figuring out(알아내는 것)이 된다.","succeed to(틀린 표현) 같은 to부정사 꼴은 쓰지 않는다."]},{"t":"pair","h":"쉬운 예시","x":[["He succeeded in passing the test.","그는 시험에 통과하는 데 성공했다. (in(~에) + passing(통과하는 것))"],["She is good at drawing.","그녀는 그림 그리기를 잘한다. (at(~에) + drawing(그리는 것))"]]}],"post":["succeed in(~에 성공하다) + -ing: succeeds in figuring out(알아내는 데 성공하다)"]}],"compquiz":[{"s":"I wonder ___ she likes me.","o":["whether","what"],"a":0,"ko":"나는 그녀가 나를 좋아하는지 궁금하다.","why":"뒤 문장이 완전하고 \"~인지\"라서 whether(~인지 아닌지).","wy":"what(무엇, ~하는 것): 뒤에 빈자리가 있어야 하는데 she likes me(그녀가 나를 좋아한다)는 완전함."},{"s":"He is good at ___ soccer.","o":["play","playing"],"a":1,"ko":"그는 축구를 잘한다.","why":"전치사 at(~에) 뒤는 -ing.","wy":"play(하다): 전치사 at(~에) 뒤에 동사원형은 못 옴."}]},{"id":"2211g2-38","no":"38","title":"어법특훈 · 22년 11월 고2 38번","sub":"아이들이 채소를 싫어하는 이유","tpl":"In the natural world, if an animal {consumes|consumes} a plant with enough antinutrients {tomake|to make} it {feel|feel} unwell, it won’t eat that plant again. {intuitively|Intuitively}, animals also know to stay away from these plants. Years of evolution and information being passed down {created|created} this innate intelligence. This “intuition,” though, {is|is} not just {seen|seen} in animals. Have you ever wondered {why|why} most children {hate|hate} vegetables? Dr. Steven Gundry {justifies|justifies} this as part of our genetic programming, our inner intelligence. Since many vegetables {are|are} full of antinutrients, your body {tries|tries} to keep you away from {them|them} while you are still {fragile|fragile} and in development. It does this by {making|making} your taste buds {perceive|perceive} these flavors as bad and even {disgusting|disgusting}. As you grow and your body becomes stronger enough to tolerate these antinutrients, suddenly they no longer taste as {bad|bad} as before.","fn":["*antinutrient: 항영양소(영양분 흡수를 방해하는 물질)","*taste bud: 미뢰(혀에서 맛을 느끼는 기관)"],"mean":{"consumes":"먹다, 섭취하다(consume의 3인칭 단수 현재형)","to make":"~하게 만드는(make의 to부정사)","make":"만들다(동사원형)","makes":"만들다(make의 3인칭 단수 현재형)","made":"만들었다, 만들어진(make의 과거형·과거분사형)","making":"만드는 것(make의 -ing형, 동명사)","to making":"만드는 것으로(전치사 to + 동명사)","feel":"느끼다(동사원형)","feeling":"느끼는(feel의 s":[{"items":[{"slots":[["consumes","","","if(만약 ~하면) 안의 주어 an animal(동물)이 단수라 consumes(먹다)가 맞다."],["feel","","","make(만들다) + 목적어 it(그것) + 동사원형 feel(느끼다)이다."],["created","creating","a","주어 Years of evolution and information(오랜 진화와 정보)의 진짜 동사 자리다. creating(만들어 내는)으로 바꾸면 문장에 동사가 없어진다."],["hate","","","주어 most children(대부분의 아이들)이 복수라 hate(싫어하다)가 맞다."],["are","","","주어 many vegetables(많은 채소)가 복수라 are(~이다)가 맞다."]],"opts":["created","to create","having created","being created"],"or":["created(만들어 냈다): 긴 주어 Years ... passed down(전해져 온 오랜 진화와 정보)의 진짜 동사라 맞음.","to create(만들어 내는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","having created(만들어 내고 나서): 완료 -ing형이라 동사 자리에 못 옴.","being created(만들어지는): 수동 -ing형이라 동사 자리에 못 오고, 뒤에 목적어 this innate intelligence(이 타고난 지능)도 받을 수 없음."],"point":"정동사 vs. 준동사","en":"Years of evolution and information being passed down created this innate intelligence.","ko":"오랜 세월의 진화와 전해 내려오는 정보가 이 타고난 지능을 만들어 냈다.","hl":["Years of evolution and information being passed down","created"],"khl":["오랜 세월의 진화와 전해 내려오는 정보가","만들어 냈다"],"blocks":[{"t":"p","h":"이미 나온 -ing에 속지 않기","x":["이 문장에는 being passed down(전해져 내려오는)이라는 -ing가 먼저 나온다.","이건 information(정보)을 꾸며 주는 꼬리표다. 동사가 아니다.","그래서 문장의 진짜 동사는 아직 안 나온 상태다.","created(만들어 냈다)가 바로 그 진짜 동사 자리다.","여기까지 -ing로 바꾸면 주어만 길게 있고 동사가 하나도 없다."]},{"t":"pair","h":"쉬운 예시","x":[["The boy sitting next to me smiled.","내 옆에 앉아 있는 소년이 미소 지었다. (sitting(앉아 있는) = 꼬리표, smiled(미소 지었다) = 진짜 동사)"],["Rain and wind broke the window.","비와 바람이 창문을 깼다. (진짜 동사 broke(깼다))"]]}],"post":["꼬리표 being passed down(전해져 내려오는) 뒤 진짜 동사: created(만들어 냈다)"]},{"slots":[["intuitively","","","문장 전체를 꾸미는 부사 Intuitively(직관적으로)다."],["is","","","주어 This intuition(이 직관)이 단수라 is(~이다)가 맞다."],["why","what","a","뒤 문장 most children hate vegetables(대부분의 아이들이 채소를 싫어한다)는 주어, 동사, 목적어가 다 있는 완전한 문장이다. what(무엇)은 빈자리가 있어야 쓸 수 있다."],["justifies","","","주어 Dr. Steven Gundry(스티븐 건드리 박사)는 한 사람이라 justifies(정당화하다)가 맞다."],["tries","","","주어 your body(여러분의 몸)가 단수라 tries(노력하다)가 맞다."]],"opts":["why","which","whom","whose"],"or":["why(왜): 뒤에 완전한 문장이 오고 \"왜 ~하는지\"라는 뜻이라 맞음.","which(어느 것): 의문사로 쓰면 뒤에 빈자리가 있어야 하는데 뒤 문장이 완전함.","whom(누구를): 목적어가 빠진 자리가 있어야 하는데 hate(싫어하다)의 목적어 vegetables(채소)가 이미 있음.","whose(누구의): 바로 뒤에 명사가 붙어야 하는데 most(대부분의)가 와서 \"누구의 대부분\"처럼 말이 안 됨."],"point":"that/which vs. what","en":"Have you ever wondered why most children hate vegetables?","ko":"여러분은 대부분의 아이들이 왜 채소를 싫어하는지 궁금해한 적이 있는가?","hl":["why most children hate vegetables"],"khl":["왜 채소를 싫어하는지"],"blocks":[{"t":"p","h":"빈칸이 있나 없나","x":["what(무엇)은 뒤 문장의 빈칸 한 칸을 채우는 말이다.","why(왜)는 빈칸을 채우지 않는다. 이유만 붙여 준다.","most children(주어) hate(동사) vegetables(목적어). 빈칸이 없다.","빈칸이 없으니 what(무엇)은 들어갈 자리가 없다."]},{"t":"pair","h":"쉬운 예시","x":[["I know why she is angry.","나는 그녀가 왜 화났는지 안다. (뒤 문장 완전 → why(왜))"],["I know what she wants.","나는 그녀가 무엇을 원하는지 안다. (wants(원하다)의 목적어가 빔 → what(무엇))"]]},{"t":"tap","h":"확인 질문","q":"What do most children hate?(대부분의 아이들은 무엇을 싫어하는가?)에서 what(무엇)이 채우는 칸은?","a":["hate(싫어하다)의 목적어 칸.","그 칸이 vegetables(채소)로 이미 차 있으면 what(무엇)을 못 쓴다."]}],"post":["뒤 문장 완전(most children hate vegetables) → why(왜), what(무엇) 불가"]},{"slots":[["tomake","","","enough antinutrients(충분한 항영양소)를 뒤에서 꾸미는 to make(~하게 만드는)다."],["seen","","","직관은 사람들에게 \"보이는\" 쪽이라 is seen(보인다)이 맞다."],["justifies","","","한 사람 Dr. Steven Gundry(스티븐 건드리 박사)라 단수형."],["them","it","a","가리키는 것은 many vegetables(많은 채소), 복수다. 복수 명사를 받는 대명사는 it(그것)이 아니라 them(그것들을)."],["fragile","","","be동사 are(~이다) 뒤 보어 자리라 형용사 fragile(연약한)이 맞다."]],"opts":["them","they","their","themselves"],"or":["them(그것들을): 복수 many vegetables(많은 채소)를 받고, 전치사 from(~로부터) 뒤 목적격이라 맞음.","they(그것들은): 주격이라 전치사 from(~로부터) 뒤에 못 옴.","their(그것들의): 소유격이라 뒤에 명사가 와야 하는데 while(~하는 동안)이 옴.","themselves(그것들 자신): 재귀대명사는 같은 문장의 주어와 같을 때 쓰는데, 주어 your body(여러분의 몸)는 채소가 아님."],"point":"대명사의 성·수·격 일치","en":"Since many vegetables are full of antinutrients, your body tries to keep you away from them while you are still fragile and in development.","ko":"많은 채소가 항영양소로 가득 차 있기 때문에, 여러분이 아직 연약하고 성장 중일 때 여러분의 몸은 여러분을 그것들로부터 멀리하게 하려고 노력한다.","hl":["many vegetables","from them"],"khl":["많은 채소가","그것들로부터"],"blocks":[{"t":"p","h":"대명사는 누구 대신인가","x":["대명사를 보면 먼저 \"누구 대신 나왔나\"를 앞에서 찾는다.","몸이 여러분을 멀리하게 하려는 대상은 채소다.","앞 문장의 many vegetables(많은 채소)는 복수다.","복수 명사 대신이니 them(그것들을). it(그것)은 하나일 때만."]},{"t":"pair","h":"쉬운 예시","x":[["I like these cookies. My mom made them.","나는 이 쿠키들을 좋아한다. 엄마가 그것들을 만들었다. (cookies(쿠키들) → them(그것들을))"],["I lost my pen. I can’t find it.","나는 펜을 잃어버렸다. 그것을 찾을 수 없다. (pen(펜) → it(그것))"]]}],"post":["복수 many vegetables(많은 채소) 대신 = them(그것들을)"]},{"slots":[["created","","","긴 주어의 진짜 동사 created(만들어 냈다)다."],["hate","","","복수 most children(대부분의 아이들)이라 hate(싫어하다)."],["are","","","복수 many vegetables(많은 채소)라 are(~이다)."],["making","make","a","전치사 by(~함으로써) 뒤 자리다. 전치사 뒤에 동사가 오려면 -ing 옷을 입어야 한다."],["disgusting","","","맛이 역겨움을 \"주는\" 쪽이라 disgusting(역겨운)이 맞다."]],"opts":["making","made","to make","makes"],"or":["making(만드는 것, 동명사): 전치사 by(~함으로써) 뒤라 동명사가 맞음.","made(만들었다, make의 과거·과거분사형): 전치사 by(~함으로써) 뒤에 과거형이나 p.p.는 못 옴.","to make(만드는 것): 전치사 by(~함으로써) 바로 뒤에 to부정사는 못 옴.","makes(만들다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음."],"point":"전치사 + 동명사","en":"It does this by making your taste buds perceive these flavors as bad and even disgusting.","ko":"몸은 여러분의 미뢰가 이러한 맛을 나쁘고 심지어 역겨운 것으로 인식하게 만듦으로써 이를 해낸다.","hl":["by making"],"khl":["만듦으로써"],"blocks":[{"t":"p","h":"by(~함으로써)는 방법을 알려 주는 전치사","x":["by(~함으로써) + -ing = ~함으로써. 어떤 방법으로 했는지 알려 준다.","by(~함으로써)는 전치사라 뒤에 명사나 -ing만 온다.","by make(틀린 형태)처럼 동사원형을 바로 붙이면 안 된다.","by making(만듦으로써): 몸이 미뢰를 조종하는 방법이다."]},{"t":"pair","h":"쉬운 예시","x":[["I learned English by watching movies.","나는 영화를 보면서 영어를 배웠다. (by(~함으로써) + watching(보는 것))"],["She saved money by walking to school.","그녀는 학교에 걸어가서 돈을 아꼈다. (by(~함으로써) + walking(걷는 것))"]]}],"post":["by(~함으로써) + -ing: by making(만듦으로써)"]},{"slots":[["is","","","단수 This intuition(이 직관)이라 is(~이다)."],["why","","","뒤 문장이 완전해서 why(왜)."],["them","","","복수 many vegetables(많은 채소)를 받는 them(그것들을)."],["perceive","","","make(만들다) + 목적어 + 동사원형 perceive(인식하다)다."],["disgusting","disgusted","a","역겨움을 \"주는\" 것은 these flavors(이러한 맛)다. 맛이 역겨움을 느끼는 게 아니니 -ed는 틀린다."]],"opts":["disgusting","disgusts","disgustingly","to disgust"],"or":["disgusting(역겨운): 맛이 역겨움을 주는 쪽이고, bad(나쁜)와 and(그리고)로 나란한 형용사 자리라 맞음.","disgusts(역겹게 하다, 3인칭 단수형): 동사라 bad(나쁜)와 짝을 이루는 형용사 자리에 못 옴.","disgustingly(역겹게): 부사라 as(~로) 뒤 목적어를 설명하는 보어 자리에 못 옴.","to disgust(역겹게 하는 것): to부정사라 bad(나쁜)와 모양이 안 맞고 as(~로) 뒤에 못 옴."],"point":"능동 v-ing vs. 수동 p.p.","en":"It does this by making your taste buds perceive these flavors as bad and even disgusting.","ko":"몸은 여러분의 미뢰가 이러한 맛을 나쁘고 심지어 역겨운 것으로 인식하게 만듦으로써 이를 해낸다.","hl":["these flavors as bad and even disgusting"],"khl":["이러한 맛을 나쁘고 심지어 역겨운 것으로"],"blocks":[{"t":"p","h":"감정을 주나, 느끼나","x":["-ing: 감정을 주는 쪽. disgusting(역겨움을 주는)","-ed: 감정을 느끼는 쪽. disgusted(역겨움을 느낀)","여기서 설명받는 것은 these flavors(이러한 맛)다.","맛이 역겨움을 느낄 수는 없다. 맛이 역겨움을 준다.","그래서 disgusting(역겨운)."]},{"t":"pair","h":"쉬운 예시","x":[["The food was disgusting.","그 음식은 역겨웠다. (음식이 역겨움을 줌)"],["I was disgusted by the smell.","나는 그 냄새에 역겨움을 느꼈다. (내가 역겨움을 느낌)"]]},{"t":"tap","h":"질문 하나","q":"아이가 주인공이라면? The child was ___ by the flavor.(그 아이는 그 맛에 ___.)","a":["disgusted(역겨움을 느꼈다).","사람이 느끼는 쪽이라 -ed."]}],"post":["맛 flavors(맛들)는 주는 쪽 → disgusting(역겨운)"]}],"quiz":[{"s":"Hard work and good luck ___ his success.","o":["created","creating"],"a":0,"ko":"노력과 행운이 그의 성공을 만들어 냈다.","why":"주어 뒤 진짜 동사 자리라 created(만들어 냈다).","wy":"creating(만들어 내는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐."},{"s":"I wonder ___ she is crying.","o":["why","what"],"a":0,"ko":"나는 그녀가 왜 울고 있는지 궁금하다.","why":"뒤 문장 she is crying(그녀가 울고 있다)이 완전해서 why(왜).","wy":"what(무엇): 뒤에 빈자리가 있어야 하는데 she is crying(그녀가 울고 있다)은 완전함."},{"s":"I bought two apples and ate ___.","o":["it","them"],"a":1,"ko":"나는 사과 두 개를 사서 그것들을 먹었다.","why":"two apples(사과 두 개)가 복수라 them(그것들을).","wy":"it(그것): 하나를 가리키는 말이라 복수 two apples(사과 두 개)와 안 맞음."},{"s":"He became famous by ___ songs.","o":["sing","singing"],"a":1,"ko":"그는 노래를 불러서 유명해졌다.","why":"전치사 by(~함으로써) 뒤는 -ing.","wy":"sing(노래하다): 전치사 by(~함으로써) 뒤에 동사원형은 못 옴."},{"s":"The smell of the trash was ___.","o":["disgusting","disgusted"],"a":0,"ko":"쓰레기 냄새는 역겨웠다.","why":"냄새가 역겨움을 주는 쪽이라 -ing.","wy":"disgusted(역겨움을 느낀): 느끼는 쪽에 쓰는 말이라 냄새에는 안 맞음."}]},{"items":[{"slots":[["tomake","make","a","if(만약 ~하면) 안의 동사는 consumes(먹다)로 이미 나왔다. enough antinutrients(충분한 항영양소) 뒤는 \"~하게 만들 만큼\"을 붙이는 자리라 to부정사가 와야 한다."],["feel","","","make(만들다) + 목적어 + 동사원형."],["intuitively","","","문장 전체를 꾸미는 부사."],["is","","","단수 This intuition(이 직관)이라 is(~이다)."],["hate","","","복수 most children(대부분의 아이들)이라 hate(싫어하다)."]],"opts":["to make","makes","made","to making"],"or":["to make(~하게 만드는): enough(충분한) + 명사 + to부정사로 \"~할 만큼 충분한 명사\"가 되어 맞음.","makes(만들다, 3인칭 단수형): if(만약 ~하면) 안에 동사 consumes(먹다)가 이미 있어 접속사 없이 동사가 겹침.","made(만들었다, 만들어진): 과거형이면 동사가 겹치고, p.p.로 보면 뒤 목적어 it(그것)과 맞지 않음.","to making(만드는 것으로): enough(충분한) 뒤 to는 to부정사라 -ing가 아니라 동사원형이 와야 함."],"point":"정동사 vs. 준동사","en":"If an animal consumes a plant with enough antinutrients to make it feel unwell, it won’t eat that plant again.","ko":"만약 동물이 자신의 몸을 안 좋게 할 만큼 충분한 항영양소가 든 식물을 먹으면, 그 동물은 그 식물을 다시는 먹지 않을 것이다.","hl":["consumes","enough antinutrients to make"],"khl":["먹으면","안 좋게 할 만큼 충분한 항영양소가"],"blocks":[{"t":"p","h":"enough(충분한)는 to와 짝꿍","x":["enough(충분한) + 명사 + to부정사 = ~할 만큼 충분한 명사.","enough antinutrients to make it feel unwell(몸을 안 좋게 할 만큼 충분한 항영양소).","if(만약 ~하면) 문장의 동사는 consumes(먹다) 하나로 끝났다.","make(만들다)를 그냥 쓰면 접속사 없이 동사가 하나 더 생긴다."]},{"t":"pair","h":"쉬운 예시","x":[["I have enough money to buy the book.","나는 그 책을 살 만큼 충분한 돈이 있다. (enough money(충분한 돈) + to buy(살))"],["He is tall enough to reach the shelf.","그는 선반에 닿을 만큼 키가 크다. (형용사 + enough(충분히) + to reach(닿을))"]]}],"post":["enough(충분한) + 명사 + to부정사: enough antinutrients to make(만들 만큼 충분한 항영양소)"]},{"slots":[["consumes","","","단수 an animal(동물)이라 consumes(먹다)."],["feel","to feel","a","make(만들다)는 \"~하게 시키다\"라는 사역동사다. make + 목적어 뒤에는 to 없이 동사원형이 온다."],["created","","","긴 주어의 진짜 동사다."],["why","","","뒤가 완전 ,["tries","","","단수 your body(여러분의 몸)라 tries(노력하다)."],["fragile","","","are(~이다) 뒤 보어 형용사."],["making","","","전치사 by(~함으로써) 뒤 동명사."],["perceive","to perceive","a","making(만드는 것)도 사역동사 make(만들다)다. make + 목적어 your taste buds(여러분의 미뢰) 뒤에는 동사원형이 온다."]],"opts":["perceive","perceiving","perceived","perceives"],"or":["perceive(인식하다): 사역동사 make(~하게 하다) + 목적어 뒤라 동사원형이 맞음.","perceiving(인식하는): make(~하게 하다) 뒤 목적격보어 자리에 -ing는 못 옴.","perceived(인식된): 미뢰가 직접 맛을 인식하는 능동이고, 뒤에 목적어 these flavors(이러한 맛)도 있어 p.p.는 안 맞음.","perceives(인식하다, 3인칭 단수형): 목적격보어 자리는 동사원형이라 s가 붙으면 안 됨."],"point":"목적격보어(준동사)","en":"It does this by making your taste buds perceive these flavors as bad and even disgusting.","ko":"몸은 여러분의 미뢰가 이러한 맛을 나쁘고 심지어 역겨운 것으로 인식하게 만듦으로써 이를 해낸다.","hl":["making your taste buds perceive"],"khl":["미뢰가","인식하게 만듦으로써"],"blocks":[{"t":"p","h":"옷을 갈아입어도 make(만들다)는 make","x":["making(만드는 것)은 make(만들다)가 by(~함으로써) 때문에 -ing 옷을 입은 것이다.","옷만 바뀌었지 사역동사라는 성격은 그대로다.","그래서 making(만드는 것) + 목적어 + 동사원형.","making your taste buds perceive(여러분의 미뢰가 인식하게 만드는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["Thank you for making me laugh.","나를 웃게 해 줘서 고마워. (making me laugh = 나를 웃게 하는 것)"],["Letting him go was hard.","그를 보내 주는 것은 힘들었다. (Letting him go = 그를 가게 하는 것)"]]}],"post":["making(만드는 것) + 목적어 + 동사원형: making your taste buds perceive(미뢰가 인식하게 만드는 것)"]},{"no":"38","slots":[["justifies","","","한 사람이라 justifies(정당화하다)."],["are","","","복수 many vegetables(많은 채소)라 are(~이다)."],["tries","trying","a","Since(~때문에)로 시작한 앞 문장 뒤에 나오는 주절이다. 주어 your body(여러분의 몸)의 진짜 동사 자리라 -ing로 바꾸면 주절에 동사가 없어진다."],["them","","","복수 many vegetables(많은 채소)를 받는 대명사."],["fragile","","","are(~이다) 뒤 보어 형용사."]],"opts":["tries","try","to try","having tried"],"or":["tries(노력하다, 3인칭 단수형): 주절의 주어 your body(여러분의 몸)가 단수라 맞음.","try(노력하다): 동사이긴 하지만 단수 주어 your body(여러분의 몸)에는 s가 붙어야 함.","to try(노력하는 것): to부정사는 동사 자리에 못 와서 주절에 동사가 없어짐.","having tried(노력하고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"Since many vegetables are full of antinutrients, your body tries to keep you away from them.","ko":"많은 채소가 항영양소로 가득 차 있기 때문에, 여러분의 몸은 여러분을 그것들로부터 멀리하게 하려고 노력한다.","hl":["your body tries"],"khl":["여러분의 몸은","노력한다"],"blocks":[{"t":"p","h":"접속사 하나에 동사 둘","x":["Since(~때문에)는 접속사다. 접속사가 하나면 동사는 두 개 필요하다.","동사 1: Since(~때문에) 문장 안의 are(~이다).","동사 2: 콤마 뒤 주절의 tries(노력하다).","tries(노력하다)를 trying(노력하는)으로 바꾸면 동사가 하나 모자란다."]},{"t":"pair","h":"쉬운 예시","x":[["Because it was cold, I wore a coat.","추웠기 때문에 나는 코트를 입었다. (was(~였다) + wore(입었다), 동사 두 개)"],["When he came home, his dog ran to him.","그가 집에 왔을 때 그의 개가 그에게 달려갔다. (came(왔다) + ran(달려갔다))"]]}],"post":["Since(~때문에) 문장 + 콤마 + 주절 동사: your body tries(여러분의 몸은 노력한다)"]}],"compquiz":[{"s":"My mom let me ___ to the party.","o":["go","to go"],"a":0,"ko":"엄마는 내가 파티에 가게 해 주셨다.","why":"사역동사 let(허락하다) + 목적어 + 동사원형.","wy":"to go(가는 것): 사역동사 let(~하게 해 주다) 뒤에는 to 없이 동사원형이 와야 함."},{"s":"Because it was sunny, my sister ___ to school.","o":["walked","walking"],"a":0,"ko":"날씨가 맑아서 내 여동생은 학교에 걸어갔다.","why":"Because(~때문에) 문장 뒤 주절의 진짜 동사 자리라 walked(걸어갔다).","wy":"walking(걸어가는): -ing는 혼자 동사 자리에 못 와서 주절에 동사가 없어짐."}]}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+'번<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+'번 · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+'번 지문</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
