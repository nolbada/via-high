<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}

.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}

.exp{display:flex;flex-direction:column;gap:16px}

.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}

.band small{color:var(--sub);font-size:.85rem}

.ck.miss{border-color:var(--ok);border-style:dashed}

sterpiece"],["universal"]],"opts":["uncomfortable","enjoyable","relaxing","harmless"],"or":["uncomfortable(불편한): 바로 뒤 this discomfort(이 불편함)가 받아 주는 말이라 맞음.","enjoyable(즐거운): 즐거운 것을 \"이 불편함\"으로 받을 수는 없음.","relaxing(편안하게 해 주는): 편안함은 불편함과 정반대라 this discomfort(이 불편함)와 부딪침.","harmless(해가 없는): 해가 없다는 말은 불편함과 이어지지 않아 뒤 내용과 안 맞음."],"om":["불편한","즐거운","편안하게 해 주는","해가 없는"],"en":"In art, when there’s something challenging, which can also be uncomfortable, this discomfort, if we’re willing to engage with it, offers the possibility of some change, some transformation.","ko":"예술에서, 도전적인 무언가가 있을 때, 그것은 불편할 수도 있는데, 이 불편함은, 우리가 기꺼이 그것과 마주하려 한다면, 어떤 변화, 어떤 변형의 가능성을 제공한다.","hl":["which can also be uncomfortable","this discomfort"],"khl":["불편할 수도 있는데","이 불편함은"],"blocks":[{"t":"pair","h":"바로 뒤 말과 짝 맞추기","x":[["which can also be uncomfortable","그것은 불편할 수도 있는데"],["this discomfort","이 불편함은 (앞말을 다시 받음)"]]},{"t":"p","h":"this(이)가 가리키는 것","x":["this discomfort(이 불편함)는 바로 앞에서 말한 불편함을 다시 가리킨다.","앞에 불편하다는 말이 있어야 \"이 불편함\"이 성립한다.","pleasant(즐거운)를 넣으면 앞은 즐겁다는데 뒤는 \"이 불편함\"이라고 받는다.","가리킬 대상이 사라진다."]},{"t":"p","h":"함정","x":["grapple with(씨름하다)는 contend with(씨름하다, 맞서다)와 같은 뜻이다.","어려운 생각과 씨름한다는 뜻 그대로라 고치지 않는다."]}],"post":["uncomfortable(불편한) ↔ pleasant(즐거운)","불편함 → 이 불편함, 앞뒤가 같은 감정"]},{"slots":[["discomfort"],["possibility"],["powerful"],["captured","concealed","a"],["touching"]],"opts":["captured","erased","denied","softened"],"or":["captured(포착했다): 전쟁의 본질을 그림에 담아냈기에 세상이 그 고통을 생각해 볼 수 있었음.","erased(지웠다): 지워 버린 고통을 어떻게 생각해 보게 하는지 앞뒤가 안 맞음.","denied(부인했다): 전쟁의 잔인함을 부인했다면 고통을 생각해 볼 방법을 줄 수 없음.","softened(누그러뜨렸다): 불편함과 마주하게 한다는 글의 주장과 반대로 고통을 덜어 낸 셈이 됨."],"om":["포착했다","지웠다","부인했다","누그러뜨렸다"],"en":"When Picasso painted his masterpiece Guernica in 1937, he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War.","ko":"피카소가 1937년에 걸작 '게르니카'를 그렸을 때, 그는 전쟁의 가슴 아프고 잔인한 본질을 포착했고, 스페인 내전이 일으킨 보편적인 고통을 생각해 볼 방법을 세상에 제시했다.","hl":["he captured the heartbreaking and cruel nature of war","offered the world a way to consider the universal suffering"],"khl":["전쟁의 가슴 아프고 잔인한 본질을 포착했고","생각해 볼 방법을 세상에 제시했다"],"blocks":[{"t":"p","h":"and(그리고)로 이어진 두 행동","x":["captured(포착했다)와 offered(제시했다)는 and(그리고)로 나란히 이어진다.","두 행동은 같은 방향이어야 한다.","전쟁의 고통을 보여 줬기에 세상이 그 고통을 생각해 볼 수 있었다.","concealed(숨겼다)를 넣으면 숨겨 놓고 생각해 보라는 꼴이 된다."]},{"t":"p","h":"그림 한 장의 힘","x":["게르니카는 폭격당한 마을 사람들의 비명을 그린 그림이다.","보는 사람이 불편해질 만큼 전쟁을 정면으로 보여 준다.","앞에서 말한 \"불편함과 마주하기\"의 실제 예다."]}],"post":["capture(포착하다) ↔ conceal(숨기다)","게르니카 = 전쟁의 잔인함을 정면으로 보여 준 그림"]},{"slots":[["full","entire","s"],["willing"],["transformation","stagnation","a"],["cruel","brutal","s"],["struggling"]],"opts":["transformation","repetition","stillness","boredom"],"or":["transformation(변형, 탈바꿈): 바로 앞 change(변화)를 다시 강조하는 말이라 맞음.","repetition(반복): 같은 걸 되풀이하는 건 변화와 반대라 쉼표 앞 change(변화)와 안 맞음.","stillness(정지, 고요함): 멈춰 있는 상태는 변화를 다시 강조하는 자리에 올 수 없음.","boredom(지루함): 불편함과 마주해 얻는 결과로 지루함을 말하면 글의 긍정적 흐름과 부딪침."],"om":["변형, 탈바꿈","반복","정지, 고요함","지루함"],"en":"this discomfort, if we’re willing to engage with it, offers the possibility of some change, some transformation.","ko":"이 불편함은, 우리가 기꺼이 그것과 마주하려 한다면, 어떤 변화, 어떤 변형의 가능성을 제공한다.","hl":["some change, some transformation","the possibility"],"khl":["어떤 변화, 어떤 변형","가능성"],"blocks":[{"t":"p","h":"쉼표로 한 번 더 말하기","x":["some change(어떤 변화), some transformation(어떤 변형)은 쉼표로 같은 말을 한 번 더 한 것이다.","앞말을 다시 힘주어 말하는 방식이다.","stagnation(정체)을 넣으면 \"어떤 변화, 어떤 정체\"가 된다.","변한다고 해 놓고 바로 멈춰 있다고 하는 셈이다."]},{"t":"p","h":"함정 두 개","x":["entire(전체의)는 full(전체의) 자리에 넣어도 같은 범위를 뜻한다.","brutal(잔혹한)은 cruel(잔인한)과 같은 쪽 단어다.","바뀐 단어는 셋, 고칠 단어는 하나."]}],"post":["transformation(변형) ↔ stagnation(정체)","불편함을 마주하면 내가 바뀜"]}],"quiz":[{"w":"full","m":"전체의, 가득한","it":[["noisy","시끄러운","n"],["complete","완전한","s"],["partial","부분적인","a"],["loyal","충실한","n"],["whole","전체의","s"],["incomplete","불완전한","a"],["frozen","얼어붙은","n"]]},{"w":"engage with","m":"~와 마주하다, 관여하다","it":[["deal with","다루다, 대처하다","s"],["take after","닮다","n"],["avoid","피하다","a"],["put on","입다","n"],["tackle","맞붙다, 다루다","s"],["shun","피하다","a"],["look after","돌보다","n"]]},{"w":"uncomfortable","m":"불편한","it":[["wooden","나무로 된","n"],["uneasy","불안한, 불편한","s"],["comfortable","편안한","a"],["annual","해마다의","n"],["awkward","어색한, 거북한","s"],["relaxed","느긋한, 편안한","a"],["rural","시골의","n"]]},{"w":"capture","m":"포착하다, 붙잡다","it":[["catch","잡다, 포착하다","s"],["borrow","빌리다","n"],["release","놓아주다","a"],["whisper","속삭이다","n"],["seize","붙잡다","s"],["free","풀어 주다","a"],["measure","측정하다","n"]]},{"w":"transformation","m":"변형, 탈바꿈","it":[["harvest","수확","n"],["change","변화","s"],["stagnation","정체","a"],["ceiling","천장","n"],["alteration","변경","s"],["conversion","전환, 변환","s"],["rumor","소문","n"]]}]},{"items":[{"slots":[["emotional"],["possibility"],["contend_with","ignore","a"],["heartbreaking"],["struggling"]],"opts":["contend_with","run_away_from","look_down_on","put_aside"],"or":["contend with(씨름하다): in this way(이런 식으로)가 받는 '불편함과 마주하기'와 같은 방향이라 맞음.","run away from(~에서 달아나다): 어려운 생각에서 달아난다면 불편함과 마주하라는 앞 문장과 부딪침.","look down on(~을 깔보다): 생각을 깔본다는 말은 예술이 그 생각을 다루는 수단이라는 흐름과 안 맞음.","put aside(~을 제쳐 두다): 제쳐 두면 씨름이 일어나지 않아 수단이 될 수 없음."],"om":["~와 씨름하다","~에서 달아나다","~을 깔보다","~을 제쳐 두다"],"en":"The arts, in this way, become vehicles to contend with ideas and concepts that are difficult and uncomfortable otherwise.","ko":"이런 식으로 예술은, 그렇지 않으면 어렵고 불편했을 생각과 개념들과 씨름하는 수단이 된다.","hl":["become vehicles to contend with ideas and concepts","in this way"],"khl":["씨름하는 수단이 된다","이런 식으로"],"blocks":[{"t":"p","h":"in this way(이런 식으로)가 가리키는 것","x":["in this way(이런 식으로)는 앞 문장 내용을 받는다.","앞 문장은 불편함과 기꺼이 마주하면 변화가 생긴다고 했다.","그러니 예술은 어려운 생각과 마주하는 수단이다.","ignore(무시하다)를 넣으면 예술이 어려운 생각을 피하는 도구가 된다.","앞 문장과 정반대 방향이다."]},{"t":"p","h":"설탕 비유와 연결","x":["sugar on the tongue(혀 위의 설탕)는 달기만 하고 금방 녹아 없어지는 즐거움이다.","예술은 그 이상이라고 했다.","어려운 생각을 무시하는 예술이라면 딱 설탕에 머무는 셈이다."]}],"post":["contend with(씨름하다) ↔ ignore(무시하다)","예술 = 어려운 생각과 씨름하는 수단"]},{"slots":[["willing","ready","s"],["powerful","profound","s"],["masterpiece"],["heartbreaking","heartwarming","a"],["universal"]],"opts":["heartbreaking","amusing","peaceful","delightful"],"or":["heartbreaking(가슴 아픈): 뒤의 cruel(잔인한), suffering(고통)과 같은 어두운 쪽이라 맞음.","amusing(재미있는): 전쟁의 고통을 재미있다고 할 수 없어 단어 묶음에서 튐.","peaceful(평화로운): 전쟁의 본질을 평화롭다고 하면 단어 자체가 모순임.","delightful(아주 기쁜): 잔인함과 고통을 담은 그림과 정반대 감정임."],"om":["가슴 아픈","재미있는","평화로운","아주 기쁜"],"en":"When Picasso painted his masterpiece Guernica in 1937, he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War.","ko":"피카소가 1937년에 걸작 '게르니카'를 그렸을 때, 그는 전쟁의 가슴 아프고 잔인한 본질을 포착했고, 스페인 내전이 일으킨 보편적인 고통을 생각해 볼 방법을 세상에 제시했다.","hl":["the heartbreaking and cruel nature of war","the universal suffering"],"khl":["가슴 아프고 잔인한 본질","보편적인 고통"],"blocks":[{"t":"p","h":"단어 묶음에서 튀는 것","x":["heartbreaking(가슴 아픈), cruel(잔인한), suffering(고통).","모두 전쟁의 어두운 얼굴을 그리는 말이다.","heartwarming(마음이 따뜻해지는)을 넣으면 한 단어만 밝다.","잔인한데 마음이 따뜻해지는 전쟁은 없다."]},{"t":"p","h":"함정 두 개","x":["ready(준비된)는 willing(기꺼이 하는) 자리에 넣어도 \"마주할 준비가 되었다면\"으로 통한다.","profound(깊은)는 powerful(강렬한) 자리에서 깊은 울림을 주는 경험이라는 뜻을 그대로 살린다."]}],"post":["heartbreaking(가슴 아픈) ↔ heartwarming(마음이 따뜻해지는)","게르니카 = 전쟁의 가슴 아픈 얼굴"]},{"slots":[["challenging","soothing","a"],["engage_with"],["contend_with"],["captured","depicted","s"],["touching"]],"opts":["challenging","relaxing","pleasing","sweet"],"or":["challenging(도전적인): 설탕 이상의 예술, 불편할 수도 있는 것이라는 설명과 맞음.","relaxing(긴장을 풀어 주는): 긴장을 풀어 주는 것이 불편하다는 which(그것은) 이하 설명과 부딪침.","pleasing(기분 좋은): 기분 좋은 것은 오히려 혀 위의 설탕 쪽이라 글이 말하는 예술과 반대임.","sweet(달콤한): 바로 앞 sugar on the tongue(혀 위의 설탕)을 넘어서자는 말이라 달콤한 것은 정반대임."],"om":["도전적인","긴장을 풀어 주는","기분 좋은","달콤한"],"en":"“The arts can be more than just sugar on the tongue,” … “In art, when there’s something challenging, which can also be uncomfortable, this discomfort, if we’re willing to engage with it, offers the possibility of some change, some transformation.","ko":"“예술은 단지 혀 위의 설탕 그 이상이 될 수 있다.” … “예술에서, 도전적인 무언가가 있을 때, 그것은 불편할 수도 있는데, 이 불편함은, 우리가 기꺼이 그것과 마주하려 한다면, 어떤 변화, 어떤 변형의 가능성을 제공한다.","hl":["something challenging","more than just sugar on the tongue"],"khl":["도전적인 무언가","혀 위의 설탕 그 이상"],"blocks":[{"t":"tap","h":"설탕의 반대편","q":"혀 위의 설탕과 반대되는 예술은 어떤 예술일까?","a":["달콤하게 녹고 끝나는 게 아니라, 나를 불편하게 흔드는 예술.","그래서 바로 다음 문장에 challenging(도전적인)이 나온다.","soothing(달래 주는)은 오히려 설탕 쪽이다."]},{"t":"p","h":"which(그것은) 뒤를 확인","x":["which can also be uncomfortable(그것은 불편할 수도 있다)이 바로 붙는다.","도전적인 것은 불편할 수 있다. 자연스럽다.","달래 주는 것이 불편할 수 있다? 앞뒤가 꼬인다."]},{"t":"p","h":"함정","x":["depicted(묘사했다)는 captured(포착했다) 자리에 들어가도 그림에 전쟁을 담았다는 뜻이 그대로다."]}],"post":["challenging(도전적인) ↔ soothing(달래 주는)","예술 = 혀 위의 설탕 그 이상"]},{"slots":[["full"],["uncomfortable"],["transformation"],["powerful","trivial","a"],["cruel"]],"opts":["powerful","minor","shallow","forgettable"],"or":["powerful(강렬한): 나를 바꿔 놓는 변화를 가리키므로 강한 경험이라는 말이 맞음.","minor(작은, 사소한): 변형이라는 큰 변화를 작은 경험으로 깎아내려 also(또한)의 긍정 흐름과 안 맞음.","shallow(얕은): 설탕 이상의 깊이를 말하는 글에서 얕은 경험은 정반대임.","forgettable(쉽게 잊힐): 나를 바꾼 경험이 쉽게 잊힌다는 건 앞 내용과 모순임."],"om":["강렬한","작은, 사소한","얕은","쉽게 잊힐"],"en":"this discomfort, if we’re willing to engage with it, offers the possibility of some change, some transformation. That can also be a powerful aesthetic experience.","ko":"이 불편함은, 우리가 기꺼이 그것과 마주하려 한다면, 어떤 변화, 어떤 변형의 가능성을 제공한다. 그것 또한 강렬한 미적 경험이 될 수 있다.","hl":["a powerful aesthetic experience","some transformation"],"khl":["강렬한 미적 경험","어떤 변형"],"blocks":[{"t":"flow","h":"불편함이 힘이 되기까지","x":["불편한 작품을 만남","도망치지 않고 마주함","내 안에서 변화가 생김","그 변화 자체가 강렬한 미적 경험"],"at":3},{"t":"p","h":"That(그것)과 also(또한)","x":["That(그것)은 앞의 변화, 변형을 가리킨다.","also(또한)는 앞의 좋은 점에 하나를 더 얹는 말이다.","trivial(사소한)을 넣으면 \"그 변화는 또한 사소한 경험이다\"가 된다.","나를 바꿔 놓은 경험을 사소하다고 할 수는 없다."]}],"post":["powerful(강렬한) ↔ trivial(사소한)","나를 바꾼 불편함 = 강렬한 경험"]},{"slots":[["possibility","prospect","s"],["masterpiece","masterwork","s"],["cruel","merciful","a"],["universal"],["touching"]],"opts":["cruel","gentle","tender","glorious"],"or":["cruel(잔인한): 뒤의 suffering(고통)을 낳은 원인으로 딱 맞음.","gentle(온화한): 온화한 전쟁이 고통을 낳는다는 건 원인과 결과가 어긋남.","tender(다정한): 전쟁을 다정하다고 하면 바로 앞 heartbreaking(가슴 아픈)과 부딪침.","glorious(영광스러운): 그림이 보여 준 건 영광이 아니라 고통이라 글의 방향과 반대임."],"om":["잔인한","온화한","다정한","영광스러운"],"en":"When Picasso painted his masterpiece Guernica in 1937, he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War.","ko":"피카소가 1937년에 걸작 '게르니카'를 그렸을 때, 그는 전쟁의 가슴 아프고 잔인한 본질을 포착했고, 스페인 내전이 일으킨 보편적인 고통을 생각해 볼 방법을 세상에 제시했다.","hl":["cruel nature of war","the universal suffering caused by the Spanish Civil War"],"khl":["잔인한 본질","스페인 내전이 일으킨 보편적인 고통"],"blocks":[{"t":"p","h":"원인과 결과로 읽기","x":["전쟁이 잔인하다 → 사람들이 고통을 겪는다.","suffering caused by the war(전쟁이 일으킨 고통)가 바로 그 결과다.","merciful(자비로운)을 넣으면 원인은 자비로운데 결과는 고통이다.","원인과 결과가 이어지지 않는다."]},{"t":"p","h":"함정 두 개","x":["prospect(가능성, 전망)는 possibility(가능성) 자리에 넣어도 \"변화가 생길 가능성\"이 그대로다.","masterwork(걸작)는 masterpiece(걸작)와 같은 말이다.","철자가 달라 보여도 뜻이 같으면 맞는 표현."]}],"post":["cruel(잔인한) ↔ merciful(자비로운)","잔인한 전쟁 → 모두의 고통"]}],"quiz":[{"w":"contend with","m":"~와 씨름하다, 맞서다","it":[["cope with","대처하다","s"],["take off","벗다","n"],["ignore","무시하다","a"],["look up to","존경하다","n"],["grapple with","씨름하다","s"],["disregard","무시하다","a"],["run out of","다 써 버리다","n"]]},{"w":"heartbreaking","m":"가슴 아픈","it":[["punctual","시간을 잘 지키는","n"],["tragic","비극적인","s"],["heartwarming","마음이 따뜻해지는","a"],["digital","디지털의","n"],["distressing","괴로움을 주는","s"],["uplifting","희망을 주는","a"],["plastic","플라스틱으로 된","n"]]},{"w":"challenging","m":"도전적인, 힘든","it":[["demanding","힘든, 부담이 큰","s"],["northern","북쪽의","n"],["easy","쉬운","a"],["sour","신맛이 나는","n"],["difficult","어려운","s"],["effortless","힘들지 않은","a"],["monthly","매달의","n"]]},{"w":"powerful","m":"강렬한, 강력한","it":[["polite","공손한","n"],["strong","강한","s"],["weak","약한","a"],["liquid","액체의","n"],["forceful","강력한","s"],["feeble","허약한","a"],["sticky","끈적끈적한","n"]]},{"w":"cruel","m":"잔인한","it":[["brutal","잔혹한","s"],["metallic","금속의","n"],["kind","친절한","a"],["weekly","매주의","n"],["harsh","가혹한","s"],["merciful","자비로운","a"],["coastal","해안의","n"]]}]}],"no":"21"},{"id":"2311g2-23","title":"어휘특훈 · 23년 11월 고2 23번","sub":"쇼핑 카트를 퍼뜨린 바람잡이","tpl":"Sylvan Goldman invented the shopping cart and introduced it in his stores in 1937. It was an {excellent} device that would make it {easy} for shoppers to buy as much as they wanted without getting tired or {seeking} others’ help. But Goldman discovered that in spite of his {repeated} advertisements and explanations, he could not {persuade} his shoppers to use the wheeled carts. Men were {reluctant} because they thought they would appear {weak} if they pushed such carts instead of carrying their shopping. Women wouldn’t touch them because the carts reminded them of baby carriages. It was only a few {elderly} shoppers who used them. That made the carts even less attractive to the {majority} of the shoppers. Then Goldman {hit_upon} an idea. He hired several models, men and women, of {different} ages and asked them to wheel the carts in the store and shop. A young woman employee standing near the entrance told the regular shoppers, ‘Look, everyone is using the carts. Why don’t you?’ That was the {turning_point}. A few shills {disguised} as {regular} shoppers easily {accomplished} what logic, explanations, and advertisements {failed} to do. Within a few weeks shoppers {readily} {accepted} those carts.","fn":["*baby carriage: 유모차","*shill: 바람잡이"],"mean":{"excellent":"훌륭한","inefficient":"비효율적인","ingenious":"기발한, 독창적인","easy":"쉬운","hard":"어려운","simple":"간단한, 쉬운","seeking":"동사 seek(구하다, 찾다)의 -ing형","requesting":"동사 request(요청하다)의 -ing형","repeated":"동사 repeat(반복하다)의 과거분사형, 거듭된","occasional":"가끔의","persistent":"끈질긴, 끊임없는","constant":"끊임없는","persuade":"설득하다","forbid":"금지하다","convince":"설득하다, 확신시키다","reluctant":"꺼리는","eager":"열렬한, 몹시 하고 싶어 하는","unwilling":"꺼리는","weak":"약한","strong":"강한","feeble":"허약한","elderly":"나이 든","young":"젊은","older":"형용사 old(나이 든)의 비교급, 나이가 더 많은","majority":"대다수","minority":"소수","bulk":"대부분","hit upon":"동사구 hit upon(떠올리다)의 과거형, hit는 과거형도 hit","came up with":"동사구 come up with(생각해 내다)의 과거형","different":"다른, 여러 가지의","similar":"비슷한","various":"다양한","turning point":"전환점","dead end":"막다른 길","breakthrough":"돌파구","disguised":"동사 disguise(변장시키다)의 과거분사형, ~로 변장한","posing":"동사 pose(~인 척하다)의 -ing형","regular":"일반의, 평범한","unusual":"특이한","ordinary":"평범한","accomplished":"동사 accomplish(이루다)의 과거형","failed":"동사 fail(~하지 못하다)의 과거형","managed":"동사 manage(해내다)의 과거형","readily":"선뜻, 기꺼이","willingly":"기꺼이","accepted":"동사 accept(받아들이다)의 과거형","rejected":"동사 reject(거부하다)의 과거형"},"comp":[{"no":"23","slots":[["excellent","inefficient","a"],["weak","feeble","s"],["turning_point","breakthrough","s"],["regular"],["readily"]],"opts":["excellent","awkward","unreliable","outdated"],"or":["excellent(훌륭한): 뒤에 장점만 나열되고 But(하지만)의 반전과도 맞음.","awkward(다루기 불편한): 원하는 만큼 쉽게 사게 해 준다는 설명과 부딪침.","unreliable(믿을 수 없는): 장점을 늘어놓는 that(그것은) 이하와 안 맞음.","outdated(구식인): 막 발명한 새 장치라 구식이라는 말이 성립하지 않음."],"om":["훌륭한","다루기 불편한","믿을 수 없는","구식인"],"en":"It was an excellent device that would make it easy for shoppers to buy as much as they wanted without getting tired or seeking others’ help.","ko":"그것은 쇼핑객들이 지치거나 남의 도움을 구하지 않고도 원하는 만큼 쉽게 살 수 있게 해 줄 훌륭한 장치였다.","hl":["an excellent device","without getting tired or seeking others’ help"],"khl":["훌륭한 장치","지치거나 남의 도움을 구하지 않고도"],"blocks":[{"t":"p","h":"that(그것은) 이하가 증거","x":["device(장치) 뒤 that(그것은) 이하가 장치를 설명한다.","원하는 만큼, 지치지 않고, 남의 도움 없이.","전부 장점이다.","inefficient(비효율적인)를 넣으면 장점만 늘어놓고 비효율적이라 부르는 셈이다."]},{"t":"p","h":"But(하지만)이 만드는 반전","x":["다음 문장은 But(하지만)으로 시작한다.","훌륭한 장치인데 아무도 안 썼다는 반전이다.","장치가 처음부터 형편없었다면 반전이 아니다."]},{"t":"p","h":"함정 두 개","x":["feeble(허약한)은 weak(약한)과 같은 뜻이다.","breakthrough(돌파구)는 turning point(전환점)처럼 상황이 확 바뀐 순간을 가리킨다."]}],"post":["excellent(훌륭한) ↔ inefficient(비효율적인)","훌륭한 발명인데 아무도 안 쓴 반전"]},{"no":"23","slots":[["repeated"],["persuade","forbid","a"],["reluctant","unw f another does not {justify} doing so. Rather, {advances} in technology {require} citizens and policy makers to consider how privacy {protections} should be {expanded}. For example, when cameras first became {available} for commercial and private use, nations and citizens {struggled} over whether new laws should be {enacted} to protect individuals from being photographed without their {permission}. The reconsideration of privacy brought about by this new technology re-affirmed a {distinction} between private and public spaces. It was determined by most cultures that people {automatically} gave {consent} to being seen ―and thus recorded ―once they {voluntarily} stepped into a public space. Although some people might be {uncomfortable} with the {spread} of surveillance cameras, citizens in most cultures have {adjusted} to the fact that giving up the right not to be observed in these circumstances causes {less} harm to the community than failing to have surveillance.","fn":["*policy maker: 정책 입안자","*re-affirm: 재확인하다","*surveillance: 감시"],"mean":{"changes":"동사 change(바꾸다)의 3인칭 단수형","alters":"동사 alter(바꾸다)의 3인칭 단수형","preserves":"동사 preserve(보존하다, 그대로 지키다)의 3인칭 단수형","justify":"정당화하다","warrant":"정당화하다, 정당한 이유가 되다","prohibit":"금지하다","advances":"명사 advance(발전, 진보)의 복수형","developments":"명사 development(발전)의 복수형","setbacks":"명사 setback(퇴보, 차질)의 복수형","require":"요구하다","compel":"(어쩔 수 없이) ~하게 만들다, 강요하다","protections":"명사 protection(보호, 보호 장치)의 복수형","safeguards":"명사 safeguard(보호 장치)의 복수형","violations":"명사 violation(침해, 위반)의 복수형","expanded":"동사 expand(확대하다)의 과거분사형. 확대된","extended":"동사 extend(넓히다, 연장하다)의 과거분사형. 넓혀진","reduced":"동사 reduce(줄이다)의 과거분사형. 줄어든","available":"이용할 수 있는","accessible":"이용할 수 있는, 접근할 수 있는","obsolete":"더 이상 쓰이지 않는, 구식이 된","struggled":"동사 struggle(씨름하다, 애쓰다)의 과거형","argued":"동사 argue(논쟁하다)의 과거형","enacted":"동사 enact(법을 제정하다)의 과거분사형. 제정된","repealed":"동사 repeal(법을 폐지하다)의 과거분사형. 폐지된","permission":"허락","objection":"반대, 이의","distinction":"구별, 구분","separation":"분리, 나눔","similarity":"비슷함, 유사성","automatically":"자동으로","consent":"동의","voluntarily":"자발적으로","willingly":"기꺼이, 자진해서","involuntarily":"본의 아니게, 자기 뜻과 상관없이","uncomfortable":"불편한","uneasy":"불안한, 마음이 편치 않은","spread":"확산, 퍼짐","decline":"감소, 쇠퇴","adjusted":"동사 adjust(적응하다)의 과거분사형. have adjusted는 현재완료","adapted":"동사 adapt(적응하다)의 과거분사형. have adapted는 현재완료","less":"형용사 little(적은)의 비교급. 더 적은","more":"형용사 much(많은)의 비교급. 더 많은"},"comp":[{"no":"30","slots":[["justify"],["advances","setbacks","a"],["require"],["protections"],["expanded","extended","s"]],"opts":["advances","failures","limits","costs"],"or":["advances(발전): 새로운 능력이 생겼다는 앞 문장, 새로 나온 카메라 예시와 딱 맞음.","failures(실패): 기술이 실패했다면 남을 엿볼 새 능력이 생겼다는 앞 문장과 맞지 않음.","limits(한계): 기술의 한계 때문이라면 엿보는 힘이 커졌다는 앞 내용과 반대임.","costs(비용): 기술의 비용은 사생활 보호를 넓혀야 하는 이유가 되지 못함."],"om":["발전","실패","한계","비용"],"en":"The fact that someone has a new ability to access information or watch the actions of another does not justify doing so. Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.","ko":"누군가가 정보에 접근하거나 다른 사람의 행동을 지켜볼 새로운 능력을 갖게 되었다는 사실이 그렇게 하는 것을 정당화하지는 않는다. 오히려 기술의 발전은 시민과 정책 입안자들에게 사생활 보호가 어떻게 확대되어야 하는지 고민할 것을 요구한다.","hl":["advances in technology","a new ability"],"khl":["기술의 발전","새로운 능력"],"blocks":[{"t":"p","h":"새 능력은 어디서 왔나","x":["앞 문장은 누군가 a new ability(새로운 능력)를 갖게 되었다고 한다.","남의 정보를 보고, 남을 지켜볼 수 있는 힘이 커진 것이다.","힘이 커진 건 기술이 앞으로 나아갔기 때문이다.","setbacks(퇴보)를 넣으면 기술이 뒷걸음질했다는 말이 된다.","뒷걸음질한 기술이 보호를 넓히라고 요구할 이유는 없다."]},{"t":"p","h":"함정","x":["extended(넓혀진)는 expanded(확대된)와 같은 방향이라 고치지 않는다."]}],"post":["advance(발전) ↔ setback(퇴보)","커진 엿보는 힘 = 기술의 발전"]},{"no":"30","slots":[["advances"],["require","compel","s"],["protections","violations","a"],["available"],["struggled"]],"opts":["protections","risks","threats","abuses"],"or":["protections(보호 장치): 넓혀야 할 것은 사생활을 지켜 주는 장치라 맞음.","risks(위험): 사생활 위험을 넓히자는 말이 되어 글쓴이 주장과 정반대임.","threats(위협): 위협을 늘리자는 건 할 수 있다고 해도 되는 건 아니라는 앞 문장과 부딪침.","abuses(남용): 남용을 넓히자는 건 기술을 함부로 쓰지 말자는 글의 흐름과 거꾸로임."],"om":["보호 장치","위험","위협","남용"],"en":"Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded. For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.","ko":"오히려 기술의 발전은 시민과 정책 입안자들에게 사생활 보호가 어떻게 확대되어야 하는지 고민할 것을 요구한다. 예를 들어, 카메라를 처음 상업용·개인용으로 쓸 수 있게 되었을 때, 국가와 시민들은 허락 없이 사진 찍히는 것으로부터 개인을 보호하기 위해 새 법을 제정해야 하는지를 두고 씨름했다.","hl":["privacy protections should be expanded","to protect individuals"],"khl":["사생활 보호가 어떻게 확대되어야","개인을 보호하기 위해"],"blocks":[{"t":"tap","h":"질문 하나","q":"넓혀야 할 것은 사생활을 지키는 것일까, 해치는 것일까?","a":["지키는 것이다.","바로 다음 예시에서 사람들은 to protect individuals(개인을 보호하기 위해) 새 법을 고민했다.","violations(침해)를 넣으면 사생활 침해를 넓히자는 말이 된다.","글쓴이가 경계하는 바로 그것이다."]},{"t":"p","h":"compel(강요하다)은 그대로","x":["compel(~하게 만들다)은 require(요구하다) 자리에서 \"고민하지 않을 수 없게 만든다\"가 된다.","방향이 같아 고치지 않는다."]}],"post":["protection(보호) ↔ violation(침해)","넓혀야 할 것 = 사생활 보호 장치"]}],"compquiz":[{"w":"advance","m":"발전, 진보","it":[["progress","진보, 발전","s"],["blanket","담요","n"],["regression","퇴보","a"],["sauce","소스","n"],["development","발전","s"],["retreat","후퇴","a"],["ticket","표, 입장권","n"]]},{"w":"protection","m":"보호","it":[["ladder","사다리","n"],["safeguard","보호 장치","s"],["danger","위험","a"],["festival","축제","n"],["defense","방어","s"],["exposure","노출","a"],["pillow","베개","n"]]}],"sets":[{"items":[{"slots":[["changes"],["justify","prohibit","a"],["advances"],["require"],["protections"]],"opts":["justify","delay","punish","criticize"],"or":["justify(정당화하다): 할 수 있다고 해서 해도 되는 건 아니라는 뜻이 되어 Rather(오히려) 뒤의 '보호를 넓혀라'와 이어짐.","delay(미루다): '능력이 있다는 사실이 엿보기를 미루지 않는다'는 뜻이 통하지 않음.","punish(처벌하다): 사실이 행동을 처벌한다는 말이라 주어와 동사가 어울리지 않음.","criticize(비판하다): '능력이 있다는 사실이 엿보기를 비판하지 않는다'가 되어 말이 되지 않음."],"om":["정당화하다","미루다","처벌하다","비판하다"],"en":"The fact that someone has a new ability to access information or watch the actions of another does not justify doing so. Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.","ko":"누군가가 정보에 접근하거나 다른 사람의 행동을 지켜볼 새로운 능력을 갖게 되었다는 사실이 그렇게 하는 것을 정당화하지는 않는다. 오히려 기술의 발전은 시민과 정책 입안자들에게 사생활 보호가 어떻게 확대되어야 하는지 고민할 것을 요구한다.","hl":["does not justify doing so","Rather"],"khl":["정당화하지는 않는다","오히려"],"blocks":[{"t":"p","h":"할 수 있다 ≠ 해도 된다","x":["새 기술 덕분에 남의 정보를 보고, 남을 지켜볼 수 있게 되었다.","글쓴이는 할 수 있다고 해서 해도 되는 건 아니라고 말한다.","그게 does not justify doing so(그렇게 하는 것을 정당화하지 않는다)다.","prohibit(금지하다)을 넣으면 \"능력이 있다는 사실이 엿보기를 막지 않는다\"가 된다.","마음껏 엿봐도 괜찮다는 쪽으로 기운다."]},{"t":"p","h":"Rather(오히려)가 가리키는 방향","x":["Rather(오히려) 뒤에는 앞말을 뒤집는 진짜 주장이 온다.","진짜 주장은 사생활 보호를 넓히자는 것이다.","앞 문장이 엿봐도 괜찮다는 쪽이면 이 연결이 깨진다."]}],"post":["justify(정당화하다) ↔ prohibit(금지하다)","할 수 있음 ≠ 해도 됨"]},{"slots":[["advances","developments","s"],["protections","safeguards","s"],["expanded","reduced","a"],["available"],["enacted"]],"opts":["expanded","abolished","ignored","postponed"],"or":["expanded(확대된): 엿볼 수 있는 힘이 커졌으니 지키는 장치도 넓혀야 한다는 흐름과 맞음.","abolished(폐지된): 보호를 없애자는 말이 되어 해도 되는 건 아니라는 앞 문장과 부딪침.","ignored(무시된): 시민과 정책 입안자가 고민할 문제가 '보호를 어떻게 무시할까'일 수는 없음.","postponed(미뤄진): 보호를 미루자는 건 바로 새 법을 고민한 카메라 예시와 반대임."],"om":["확대된","폐지된","무시된","미뤄진"],"en":"Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.","ko":"오히려 기술의 발전은 시민과 정책 입안자들에게 사생활 보호가 어떻게 확대되어야 하는지 고민할 것을 요구한다.","hl":["how privacy protections should be expanded","advances in technology"],"khl":["사생활 보호가 어떻게 확대되어야 하는지","기술의 발전"],"blocks":[{"t":"flow","h":"글의 뼈대","x":["기술이 사생활 개념을 바꿈","할 수 있다고 해도 되는 건 아님","그러니 보호를 넓혀야 함","예: 카메라와 새 법 논의","결론: 공공장소 감시엔 적응함"],"at":2},{"t":"p","h":"reduced(줄어든)를 넣고 읽기","x":["\"사생활 보호를 어떻게 줄일지 고민하라\"가 된다.","엿볼 수 있는 힘이 커졌는데 지키는 장치를 줄인다?","바로 다음 예시에서 사람들은 찍히지 않도록 보호할 새 법을 고민했다.","보호를 줄이는 게 아니라 늘리는 이야기다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["developments(발전)는 advances(발전)와 같은 뜻이다.","safeguards(보호 장치)는 protections(보호 장치)와 같은 말이다."]}],"post":["expand(확대하다) ↔ reduce(줄이다)","엿보는 힘이 커짐 → 보호도 넓히기"]},{"slots":[["struggled","argued","s"],["permission"],["distinction","similarity","a"],["automatically"],["consent"]],"opts":["distinction","confusion","connection","harmony"],"or":["distinction(구별): 공공장소에 들어서면 동의한 것으로 본다는 다음 문장이 '두 공간은 다르다'를 전제로 함.","confusion(혼동): 두 공간을 헷갈리게 되었다면 공공장소에만 따로 규칙을 정할 수 없음.","connection(연결): 두 공간이 이어져 있다는 말은 공공장소에서만 동의로 본다는 선 긋기와 맞지 않음.","harmony(조화): 이 글은 두 공간의 조화가 아니라 어디부터 공적인지 선을 긋는 이야기임."],"om":["구별","혼동","연결","조화"],"en":"The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces. It was determined by most cultures that people automatically gave consent to being seen ―and thus recorded ―once they voluntarily stepped into a public space.","ko":"이 새로운 기술이 불러온 사생활에 대한 재고는 사적 공간과 공적 공간의 구분을 다시 확인해 주었다. 대부분의 문화에서는, 사람들이 일단 자발적으로 공공장소에 발을 들이면 남에게 보이는 것, 그리고 그래서 녹화되는 것에 자동으로 동의한 것으로 정해졌다.","hl":["re-affirmed a distinction between private and public spaces","once they voluntarily stepped into a public space"],"khl":["사적 공간과 공적 공간의 구분을 다시 확인해","일단 자발적으로 공공장소에 발을 들이면"],"blocks":[{"t":"pair","h":"앞뒤 문장 나란히","x":[["re-affirmed a distinction between private and public spaces","사적 공간과 공적 공간은 다르다고 다시 확인함"],["once they voluntarily stepped into a public space","공공장소에 들어서는 순간부터는 동의한 것으로 봄"]]},{"t":"p","h":"선이 있어야 '들어서는 순간'이 생긴다","x":["공공장소에 발을 들인다는 말은 경계선이 있다는 뜻이다.","선 안쪽(사적 공간)에서는 찍히지 않을 권리가 있다.","선 바깥(공적 공간)에서는 보이는 것에 동의한 셈이 된다.","similarity(비슷함)를 넣으면 두 공간이 비슷하다고 확인한 셈이다.","그러면 공공장소에서만 동의로 본다는 다음 문장이 설 자리가 없다."]},{"t":"p","h":"argued는 그대로","x":["argued over(~을 두고 논쟁했다)는 struggled over(~을 두고 씨름했다)와 같은 그림이다.","새 법을 만들지 말지 다퉜다는 뜻이 그대로 남는다."]}],"post":["distinction(구별) ↔ similarity(비슷함)","사적 공간 / 공적 공간 사이에 선 긋기"]},{"slots":[["distinction"],["automatically"],["consent"],["voluntarily","involuntarily","a"],["uncomfortable"]],"opts":["voluntarily","secretly","accidentally","rarely"],"or":["voluntarily(자발적으로): 스스로 공공장소에 나왔으니 보이는 것에 동의한 것으로 본다는 논리와 맞음.","secretly(몰래): 몰래 공공장소에 들어선다는 건 남에게 보이는 상황과 어울리지 않음.","accidentally(우연히): 우연히 들어선 사람에게 동의했다고 하기는 어려워 consent(동의)의 근거가 사라짐.","rarely(좀처럼 ~않게): once(일단 ~하면)와 만나면 '일단 좀처럼 안 들어서면'이 되어 말이 안 됨."],"om":["자발적으로","몰래","우연히","좀처럼 ~않게"],"en":"It was determined by most cultures that people automatically gave consent to being seen ―and thus recorded ―once they voluntarily stepped into a public space.","ko":"대부분의 문화에서는, 사람들이 일단 자발적으로 공공장소에 발을 들이면 남에게 보이는 것, 그리고 그래서 녹화되는 것에 자동으로 동의한 것으로 정해졌다.","hl":["voluntarily stepped into a public space","automatically gave consent"],"khl":["자발적으로 공공장소에 발을 들이면","자동으로 동의한"],"blocks":[{"t":"tap","h":"질문 하나","q":"억지로 끌려 나온 사람도 찍혀도 좋다고 동의한 걸까?","a":["아니다.","동의는 내 뜻으로 할 때만 동의다.","그래서 스스로 나왔으니 보이는 것도 받아들인 셈이라는 논리가 선다.","involuntarily(자기 뜻과 상관없이)를 넣으면 동의의 근거가 통째로 사라진다."]},{"t":"p","h":"원인과 결과","x":["원인: 스스로 공공장소에 들어섬","결과: 보이는 것, 녹화되는 것에 자동으로 동의한 것으로 봄","원인이 내 뜻이어야 결과가 동의가 된다."]}],"post":["voluntarily(자발적으로) ↔ involuntarily(자기 뜻과 상관없이)","제 발로 나옴 = 보이는 것에 동의"]},{"slots":[["automatically"],["voluntarily","willingly","s"],["uncomfortable","uneasy","s"],["adjusted"],["less","more","a"]],"opts":["less","greater","worse","heavier"],"or":["less(더 적은): 권리를 포기하는 편이 해가 덜하니 받아들였다는 이유가 되어 맞음.","greater(더 큰): 포기하는 쪽 해가 더 크다면 사람들이 적응할 이유가 없음.","worse(더 나쁜): 감시를 받아들인 선택이 더 나쁜 결과를 낸다면 have adjusted(적응해 왔다)와 부딪침.","heavier(더 무거운): 해가 더 무겁다면 대부분의 시민이 받아들였다는 결론이 무너짐."],"om":["더 적은","더 큰","더 나쁜","더 무거운"],"en":"Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance.","ko":"일부 사람들은 감시 카메라의 확산이 불편할 수도 있지만, 대부분의 문화권 시민들은 이런 상황에서 관찰당하지 않을 권리를 포기하는 것이 감시가 없는 것보다 공동체에 해를 덜 끼친다는 사실에 적응해 왔다.","hl":["causes less harm to the community than failing to have surveillance","have adjusted to the fact"],"khl":["감시가 없는 것보다 공동체에 해를 덜 끼친다","사실에 적응해 왔다"],"blocks":[{"t":"p","h":"저울에 달아 보기","x":["왼쪽: 관찰당하지 않을 권리를 포기함","오른쪽: 감시 카메라가 아예 없음","사람들은 왼쪽이 공동체에 해가 덜하다고 보았다.","그래서 감시 카메라를 받아들이고 적응했다.","more(더 많은)를 넣으면 저울이 반대로 기운다.","손해가 더 큰 쪽을 대부분의 문화가 받아들였다는 말이 되어 이상하다."]},{"t":"p","h":"함정 둘","x":["willingly(자진해서)는 voluntarily(자발적으로)와 같은 뜻이다.","uneasy(마음이 편치 않은)는 uncomfortable(불편한) 자리에 그대로 들어간다.","바뀐 단어가 셋이지만 고칠 곳은 하나."]}],"post":["less(더 적은) ↔ more(더 많은)","권리 포기 < 감시 없음 (해의 크기)"]}],"quiz":[{"w":"justify","m":"정당화하다","it":[["whisper","속삭이다","n"],["warrant","정당화하다, 정당한 이유가 되다","s"],["condemn","비난하다","a"],["borrow","빌리다","n"],["rationalize","합리화하다, 정당화하다","s"],["blame","탓하다, 나무라다","a"],["sew","바느질하다","n"]]},{"w":"expand","m":"확대하다","it":[["enlarge","확대하다","s"],["sneeze","재채기하다","n"],["reduce","줄이다","a"],["broaden","넓히다","s"],["polish","닦다, 광내다","n"],["shrink","줄어들다, 줄이다","a"],["applaud","박수를 치다","n"]]},{"w":"distinction","m":"구별, 차이","it":[["luggage","짐, 수하물","n"],["difference","차이","s"],["similarity","비슷함, 유사성","a"],["appetite","식욕","n"],["contrast","대조, 차이","s"],["resemblance","닮음","a"],["ceremony","의식, 식","n"]]},{"w":"voluntarily","m":"자발적으로","it":[["willingly","기꺼이, 자진해서","s"],["upstairs","위층에","n"],["unwillingly","마지못해","a"],["abroad","해외에","n"],["freely","자유롭게, 자진해서","s"],["reluctantly","마지못해, 꺼리며","a"],["loudly","큰 소리로","n"]]},{"w":"less","m":"더 적은","it":[["smaller","더 작은, 더 적은","s"],["honest","정직한","n"],["more","더 많은","a"],["frozen","얼어붙은","n"],["lesser","더 적은, 덜한","s"],["greater","더 큰","a"],["polite","공손한","n"]]}]},{"items":[{"slots":[["changes","preserves","a"],["justify"],["advances"],["require"],["expanded"]],"opts":["changes","hides","ignores","measures"],"or":["changes(바꾸다): 뒤에서 새 기술이 사생활을 다시 따져 보게 했다는 카메라 예시와 맞음.","hides(숨기다): 기술이 사생활 개념을 숨긴다는 말은 뒤 내용 어디에도 근거가 없음.","ignores(무시하다): 기술이 사람들의 생각을 무시한다는 건 주어와 동사가 어울리지 않음.","measures(측정하다): 사생활 이해를 측정한다는 이야기는 글 어디에도 나오지 않음."],"om":["바꾸다","숨기다","무시하다","측정하다"],"en":"Technology changes how individuals and societies understand the concept of privacy. … The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces.","ko":"기술은 개인과 사회가 사생활이라는 개념을 이해하는 방식을 바꾼다. … 이 새로운 기술이 불러온 사생활에 대한 재고는 사적 공간과 공적 공간의 구분을 다시 확인해 주었다.","hl":["Technology changes how","The reconsideration of privacy"],"khl":["이해하는 방식을 바꾼다","사생활에 대한 재고"],"blocks":[{"t":"p","h":"첫 문장은 글의 제목","x":["첫 문장은 글 전체가 무엇을 말할지 알려 준다.","새 기술이 나오면 사생활에 대한 생각이 바뀐다.","뒤의 카메라 예시가 그 증거다.","카메라가 나오자 사생활에 대한 reconsideration(재고)이 일어났다."]},{"t":"p","h":"preserves(그대로 지키다)가 틀린 이유","x":["preserves(그대로 지키다)를 넣으면 기술이 사람들의 생각을 그대로 둔다는 말이 된다.","그런데 뒤에서는 새 법을 고민하고, 사생활을 다시 따졌다.","생각이 그대로였다면 다시 따질 일도 없다."]}],"post":["change(바꾸다) ↔ preserve(그대로 지키다)","새 기술 → 사생활 생각이 바뀜"]},{"slots":[["changes","alters","s"],["justify","warrant","s"],["available","obsolete","a"],["struggled"],["permission"]],"opts":["available","outdated","illegal","invisible"],"or":["available(이용할 수 있는): 카메라를 처음 쓸 수 있게 되자 사생활 문제가 생겼다는 흐름과 맞음.","outdated(구식인): first(처음)와 만나면 '처음 구식이 되었을 때'가 되어 새 기술 이야기와 맞지 않음.","illegal(불법인): 처음부터 불법이었다면 새 법을 만들지 말지 다툴 필요가 없음.","invisible(보이지 않는): 카메라가 안 보이게 된 때라는 말은 카메라 사용이 퍼진 때를 말하는 이 예시와 맞지 않음."],"om":["이용할 수 있는","구식인","불법인","보이지 않는"],"en":"For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.","ko":"예를 들어, 카메라를 처음 상업용·개인용으로 쓸 수 있게 되었을 때, 국가와 시민들은 허락 없이 사진 찍히는 것으로부터 개인을 보호하기 위해 새 법을 제정해야 하는지를 두고 씨름했다.","hl":["first became available for commercial and private use","new laws"],"khl":["처음 상업용·개인용으로 쓸 수 있게 되었을 때","새 법"],"blocks":[{"t":"p","h":"새 기술 → 새 고민","x":["예시의 시작은 카메라가 처음 나왔을 때다.","누구나 카메라를 쓸 수 있게 되자 허락 없이 찍히는 일이 생겼다.","그래서 새 법이 필요한지 다퉜다.","obsolete(구식이 된)를 넣으면 카메라가 처음 구식이 되었을 때가 된다.","사라져 가는 기술이 새 법 논쟁을 불렀다는 말이라 앞뒤가 맞지 않는다."]},{"t":"p","h":"첫 문장과 이어 보기","x":["첫 문장 Technology changes(기술은 바꾼다)가 이 예시의 제목이다.","새로 등장한 카메라가 사생활 생각을 바꾼 사례다."]},{"t":"p","h":"그대로 둘 두 단어","x":["alters(바꾸다)는 changes(바꾸다)와 같은 뜻이다.","warrant(정당화하다)는 justify(정당화하다) 자리에 그대로 들어간다."]}],"post":["available(이용할 수 있는) ↔ obsolete(구식이 된)","카메라 등장 = 새 법 논쟁의 시작"]},{"slots":[["available","accessible","s"],["struggled"],["enacted","repealed","a"],["permission"],["distinction"]],"opts":["enacted","cancelled","violated","weakened"],"or":["enacted(제정된): 찍히지 않도록 보호하려면 새 법을 만들어야 하므로 to protect(보호하기 위해)와 맞음.","cancelled(취소된): 새 법을 취소해서 사람을 보호한다는 말은 앞뒤가 맞지 않음.","violated(위반된): 보호하려고 법을 어겨야 하느냐를 두고 다퉜다는 건 말이 안 됨.","weakened(약화된): 법을 약하게 만들어 개인을 보호한다는 건 목적과 방법이 거꾸로임."],"om":["제정된","취소된","위반된","약화된"],"en":"For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.","ko":"예를 들어, 카메라를 처음 상업용·개인용으로 쓸 수 있게 되었을 때, 국가와 시민들은 허락 없이 사진 찍히는 것으로부터 개인을 보호하기 위해 새 법을 제정해야 하는지를 두고 씨름했다.","hl":["new laws should be enacted to protect individuals","without their permission"],"khl":["개인을 보호하기 위해 새 법을 제정해야 하는지","허락 없이"],"blocks":[{"t":"flow","h":"카메라 예시의 흐름","x":["카메라를 누구나 쓰게 됨","허락 없이 찍히는 사람이 생김","보호할 새 법을 만들지 고민","결론: 사적·공적 공간 구분 재확인"],"at":2},{"t":"p","h":"목적에서 거꾸로 짚기","x":["문장 끝의 목적은 to protect individuals(개인을 보호하기 위해)다.","보호하려면 법을 새로 만들어야 한다.","repealed(폐지된)를 넣으면 개인을 보호하려고 새 법을 폐지할지 다퉜다는 말이 된다.","아직 생기지도 않은 새 법을 없애서 보호한다는 말이라 성립하지 않는다."]},{"t":"p","h":"accessible은 그대로","x":["accessible(이용할 수 있는)은 available(이용할 수 있는)과 같은 자리에 들어간다."]}],"post":["enact(제정하다) ↔ repeal(폐지하다)","찍히지 않을 보호 = 새 법 만들기"]},{"slots":[["struggled"],["enacted"],["permission","objection","a"],["distinction"],["automatically"]],"opts":["permission","payment","effort","presence"],"or":["permission(허락): 허락 없이 찍히는 것이 바로 사생활 침해라 보호할 대상과 맞음.","payment(지불): 돈을 안 내고 찍히는 걸 막는다는 건 사생활과 상관없는 이야기임.","effort(노력): '그들의 노력 없이 찍히는 것'은 뜻이 통하지 않음.","presence(그 자리에 있음): 그 자리에 없는데 찍힌다는 건 말이 안 되어 카메라 예시와 맞지 않음."],"om":["허락","지불","노력","그 자리에 있음"],"en":"For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission.","ko":"예를 들어, 카메라를 처음 상업용·개인용으로 쓸 수 있게 되었을 때, 국가와 시민들은 허락 없이 사진 찍히는 것으로부터 개인을 보호하기 위해 새 법을 제정해야 하는지를 두고 씨름했다.","hl":["being photographed without their permission","to protect individuals"],"khl":["허락 없이 사진 찍히는 것","개인을 보호하기 위해"],"blocks":[{"t":"p","h":"objection(반대)을 넣고 읽기","x":["\"반대하지 않았는데 찍히는 것으로부터 보호한다\"가 된다.","본인이 괜찮다는데 무엇을 막아 준다는 걸까?","보호가 필요한 건 본인이 원하지 않는데 찍힐 때다.","그래서 without their permission(그들의 허락 없이)이어야 한다."]},{"t":"p","h":"뒤에 나오는 consent(동의)와 한 쌍","x":["두 문장 뒤에 gave consent(동의했다)가 나온다.","permission(허락)과 consent(동의)는 같은 생각을 가리킨다.","사생활 이야기의 핵심은 본인이 허락했는가다.","공공장소에 스스로 나오면 그 허락을 한 것으로 본다는 결론으로 이어진다."]}],"post":["permission(허락) ↔ objection(반대)","허락 없이 찍힘 = 사생활 침해"]},{"slots":[["distinction","separation","s"],["consent"],["uncomfortable"],["spread","decline","a"],["adjusted","adapted","s"]],"opts":["spread","removal","absence","shortage"],"or":["spread(확산): 감시 카메라가 늘어나는 게 불편하다는 말이라 Although(~이지만) 뒤 '그래도 적응했다'와 짝이 맞음.","removal(제거): 카메라 제거가 불편하다면 감시를 원한다는 뜻이라 적응했다는 뒷말과 대조가 안 됨.","absence(없음): 카메라가 없는 게 불편한 사람은 감시를 바라는 쪽이라 Although(~이지만)의 대조와 맞지 않음.","shortage(부족): 카메라 부족이 불편하다는 건 감시에 적응한 시민과 같은 편이라 대조가 사라짐."],"om":["확산","제거","없음","부족"],"en":"Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance.","ko":"일부 사람들은 감시 카메라의 확산이 불편할 수도 있지만, 대부분의 문화권 시민들은 이런 상황에서 관찰당하지 않을 권리를 포기하는 것이 감시가 없는 것보다 공동체에 해를 덜 끼친다는 사실에 적응해 왔다.","hl":["uncomfortable with the spread of surveillance cameras","have adjusted to"],"khl":["감시 카메라의 확산이 불편할","적응해 왔다"],"blocks":[{"t":"p","h":"Although(~이지만)가 만드는 대조","x":["Although(~이지만) 앞뒤는 서로 반대 편이어야 한다.","앞: 카메라가 늘어나서 불편한 사람들","뒤: 그래도 대부분은 감시에 적응함","decline(감소)을 넣으면 카메라가 줄어들어서 불편한 사람들이 된다.","그 사람들은 감시를 원하는 쪽이라 뒤쪽 시민과 같은 편이다.","대조가 사라져 Although(~이지만)가 할 일이 없어진다."]},{"t":"tap","h":"한 줄 요약","q":"이 글의 마지막 문장을 한 줄로 줄이면?","a":["감시 카메라가 늘어 불편해도, 감시가 없는 것보다 해가 적어 대부분 받아들였다.","카메라의 spread(확산)가 이야기의 출발점이다."]},{"t":"p","h":"그대로 둘 두 단어","x":["separation(분리)은 distinction(구별) 자리에서 두 공간을 나눈다는 같은 뜻이 된다.","adapted(적응한)는 adjusted(적응한)와 같은 말이다."]}],"post":["spread(확산) ↔ decline(감소)","늘어나는 감시 카메라 → 불편하지만 적응"]}],"quiz":[{"w":"change","m":"바꾸다","it":[["alter","바꾸다","s"],["whistle","휘파람을 불다","n"],["maintain","유지하다","a"],["modify","수정하다, 바꾸다","s"],["harvest","수확하다","n"],["preserve","보존하다, 그대로 지키다","a"],["knit","뜨개질하다","n"]]},{"w":"available","m":"이용할 수 있는","it":[["curious","호기심 많은","n"],["accessible","이용할 수 있는, 접근할 수 있는","s"],["unavailable","이용할 수 없는","a"],["salty","짠","n"],["obtainable","얻을 수 있는","s"],["inaccessible","접근할 수 없는","a"],["punctual","시간을 잘 지키는","n"]]},{"w":"enact","m":"(법을) 제정하다","it":[["legislate","법률을 제정하다","s"],["jog","조깅하다","n"],["repeal","폐지하다","a"],["pass","(법안을) 통과시키다","s"],["kneel","무릎을 꿇다","n"],["abolish","폐지하다","a"],["skate","스케이트를 타다","n"]]},{"w":"permission","m":"허락","it":[["approval","승인, 허락","s"],["thunder","천둥","n"],["prohibition","금지","a"],["consent","동의","s"],["receipt","영수증","n"],["refusal","거절","a"],["cushion","쿠션, 방석","n"]]},{"w":"spread","m":"확산, 퍼짐","it":[["blanket","담요","n"],["proliferation","급증, 확산","s"],["decrease","감소","a"],["recipe","조리법","n"],["expansion","확대, 확산","s"],["reduction","감소, 축소","a"],["umbrella","우산","n"]]}]}],"no":"30"},{"id":"2311g2-31","title":"어휘특훈 · 23년 11월 고2 31번","sub":"기적은 생각을 건너뛴 핑계","tpl":"Coincidence that is statistically {impossible} seems to us like an {irrational} event, and some {define} it as a miracle. But, as Montaigne has said, “the {origin} of a miracle is in our {ignorance}, at the level of our knowledge of nature, and not in nature itself.” Glorious miracles have been later on {discovered} to be {obedience} to the laws of nature or a technological development that was not {widely} known at the time. As the German poet, Goethe, phrased it: “Things that are {mysterious} are not yet miracles.” The miracle {assumes} the {intervention} of a “higher power” in its occurrence that is {beyond} human capability to {grasp}. Yet there are {methodical} and simple ways to “cause a miracle” without {divine} revelation and inspiration. Instead of checking it out, {investigating} and finding the source of the event, we define it as a miracle. The miracle, then, is the {excuse} of those who are too {lazy} to think.","fn":["*coincidence: 우연의 일치","*Montaigne: 몽테뉴(프랑스의 사상가)","*revelation: 계시","*inspiration: 영감"],"mean":{"impossible":"불가능한","improbable":"일어날 것 같지 않은","probable":"있을 법한, 일어날 가능성이 높은","irrational":"비이성적인, 비합리적인","illogical":"비논리적인","ordinary":"평범한","define":"정의하다, ~라고 규정하다","label":"(~라고) 이름 붙이다, 꼬리표를 달다","origin":"기원, 근원","source":"근원, 원천","ignorance":"무지, 모름","wisdom":"지혜","discovered":"동사 discover(발견하다, 알게 되다)의 과거분사형. 밝혀진","found":"동사 find(발견하다, 알게 되다)의 과거분사형. 알게 된","obedience":"복종, (규칙을) 따름","defiance":"거역, 반항","widely":"널리","generally":"일반적으로, 널리","mysterious":"신비로운, 불가사의한","puzzling":"알쏭달쏭한, 이해하기 힘든","obvious":"명백한, 뻔한","assumes":"동사 assume(전제로 하다, 가정하다)의 3인칭 단수형","presupposes":"동사 presuppose(전제로 하다)의 3인칭 단수형","excludes":"동사 exclude(배제하다, 빼다)의 3인칭 단수형","intervention":"개입","involvement":"관여, 개입","beyond":"~을 넘어선, ~이 미치지 못하는","within":"~ 안에, ~ 범위 안에","grasp":"이해하다, 파악하다","comprehend":"이해하다","misunderstand":"오해하다","methodical":"체계적인, 질서 정연한","systematic":"체계적인","supernatural":"초자연적인","divine":"신의, 신성한","human":"인간의","investigating":"동사 investigate(조사하다)의 -ing형. 동명사","examining":"동사 examine(살피다, 조사하다)의 -ing형. 동명사","ignoring":"동사 ignore(무시하다)의 -ing형. 동명사","excuse":"핑계, 변명","lazy":"게으른","diligent":"부지런한"},"comp":[{"no":"31","slots":[["assumes","presupposes","s"],["beyond"],["methodical"],["divine","human","a"],["investigating"]],"opts":["divine","scientific","logical","natural"],"or":["divine(신의): 앞 문장의 '더 높은 힘' 없이도 된다는 말이라 Yet(그러나)의 대조와 맞음.","scientific(과학적인): 과학 없이 기적을 일으킨다면 바로 앞의 체계적인 방법과 부딪침.","logical(논리적인): 논리 없이 체계적인 방법을 쓴다는 건 앞뒤가 맞지 않음.","natural(자연의): 기적은 알고 보니 자연법칙대로였다고 했으니 자연을 빼는 방향은 글과 반대임."],"om":["신의","과학적인","논리적인","자연의"],"en":"The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp. Yet there are methodical and simple ways to “cause a miracle” without divine revelation and inspiration.","ko":"기적은 그것이 일어날 때 인간의 능력으로는 이해할 수 없는 ‘더 높은 힘’이 개입했다는 것을 전제로 한다. 그러나 신의 계시와 영감 없이도 ‘기적을 일으키는’ 체계적이고 간단한 방법들이 있다.","hl":["without divine revelation and inspiration","a “higher power”"],"khl":["신의 계시와 영감 없이도","‘더 높은 힘’"],"blocks":[{"t":"p","h":"Yet(그러나) 앞뒤 맞세우기","x":["앞: 기적은 더 높은 힘이 끼어들었다는 걸 전제로 한다.","Yet(그러나)","뒤: 그 힘 없이도 기적을 일으키는 방법이 있다.","그 더 높은 힘을 가리키는 말이 divine(신의)이다.","human(인간의)을 넣으면 \"인간의 계시 없이\"가 된다.","빼야 할 것이 더 높은 힘이 아니라 사람이 되어 대조가 무너진다."]},{"t":"p","h":"presupposes는 그대로","x":["presupposes(전제로 하다)는 assumes(전제로 하다)와 같은 뜻이다."]}],"post":["divine(신의) ↔ human(인간의)","신의 계시 없이도 일으키는 '기적'"]},{"no":"31","slots":[["impossible","improbable","s"],["mysterious"],["intervention"],["beyond","within","a"],["grasp"]],"opts":["beyond","under","near","around"],"or":["beyond(~을 넘어선): 사람이 이해할 수 있는 범위 밖의 힘이어야 '더 높은 힘'이 되므로 맞음.","under(~ 아래에): 사람 능력 아래에 있는 힘이라면 '더 높은' 힘이 될 수 없음.","near(~ 가까이에): 사람 능력 가까이라는 말로는 높은 힘을 설명하지 못함.","around(~ 주변에): 능력 주변이라는 말은 뜻이 흐리고 '이해할 수 없는 힘'과 맞지 않음."],"om":["~을 넘어선","~ 아래에","~ 가까이에","~ 주변에"],"en":"The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.","ko":"기적은 그것이 일어날 때 인간의 능력으로는 이해할 수 없는 ‘더 높은 힘’이 개입했다는 것을 전제로 한다.","hl":["beyond human capability to grasp","“higher power”"],"khl":["인간의 능력으로는 이해할 수 없는","더 높은 힘"],"blocks":[{"t":"tap","h":"한 줄 요약","q":"기적을 한 줄로 정의하면?","a":["사람 머리로는 이해 못 할 더 높은 힘이 끼어든 일.","within(~ 안에)을 넣으면 사람 머리로 충분히 이해되는 힘이 된다.","그런 힘은 '더 높은' 힘이 아니다."]},{"t":"p","h":"improbable은 그대로","x":["improbable(일어날 것 같지 않은)은 impossible(불가능한) 자리에서 확률상 일어나기 어려운 우연이 된다.","기적처럼 보이는 우연이라는 그림이 그대로 남는다."]}],"post":["beyond(~을 넘어선) ↔ within(~ 안에)","더 높은 힘 = 사람 이해 범위 밖"]}],"compquiz":[{"w":"divine","m":"신의, 신성한","it":[["holy","신성한","s"],["rusty","녹슨","n"],["human","인간의","a"],["chilly","쌀쌀한","n"],["heavenly","천상의, 하늘의","s"],["mortal","언젠가 죽는, 인간의","a"],["loyal","충실한","n"]]},{"w":"beyond","m":"~을 넘어선","it":[["during","~ 동안","n"],["outside","~의 밖에","s"],["within","~ 안에","a"],["despite","~에도 불구하고","n"],["above","~을 넘어서는, ~보다 위에","s"],["past","~을 지나서, ~을 넘어서","s"],["among","~ 사이에","n"]]}],"sets":[{"items":[{"slots":[["impossible"],["irrational","ordinary","a"],["define"],["origin"],["ignorance"]],"opts":["irrational","expected","everyday","understandable"],"or":["irrational(비이성적인): 통계적으로 불가능한 일은 이치로 설명이 안 되어 보이므로 맞음.","expected(예상된): 불가능한 우연이 예상된 일처럼 보인다는 건 앞뒤가 모순임.","everyday(일상적인): 매일 일어나는 일 같다면 누군가 기적이라 부를 이유가 없음.","understandable(이해할 수 있는): 이해가 되는 일이라면 기적이라고 부르지 않음."],"om":["비이성적인","예상된","일상적인","이해할 수 있는"],"en":"Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.","ko":"통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적이라고 정의한다.","hl":["an irrational event","statistically impossible"],"khl":["비이성적인 사건","통계적으로 불가능한"],"blocks":[{"t":"flow","h":"글의 출발점","x":["불가능해 보이는 우연이 일어남","이치로 설명이 안 되는 것 같음","사람들이 기적이라 부름","글쓴이: 사실은 우리가 모를 뿐"],"at":1},{"t":"p","h":"ordinary(평범한)를 넣고 다시 읽기","x":["\"통계적으로 불가능한 우연이 평범한 사건처럼 보인다\"가 된다.","불가능한 일이 평범해 보일 수는 없다.","게다가 평범한 일을 기적이라 부르는 사람은 없다.","and(그리고) 뒤의 define it as a miracle(그것을 기적이라 정의한다)과 이어지지 않는다."]}],"post":["irrational(비이성적인) ↔ ordinary(평범한)","불가능한 우연 → 이치에 안 맞아 보임 → 기적"]},{"slots":[["origin","source","s"],["discovered","found","s"],["obedience","defiance","a"],["widely"],["mysterious"]],"opts":["obedience","resistance","exception","threat"],"or":["obedience(따름): 기적이 알고 보니 자연법칙대로 일어난 일이었다는 뜻이라 몽테뉴의 '자연 자체가 아니라 우리 무지'와 맞음.","resistance(저항): 자연법칙에 저항한 것이었다면 진짜 기적이 되어 글쓴이 주장과 반대임.","exception(예외): 법칙의 예외였다면 기적이 맞다는 말이 되어 글의 흐름과 거꾸로임.","threat(위협): 자연법칙에 대한 위협이라는 말은 뒤의 '기술 발전'과 나란히 설 수 없음."],"om":["따름, 복종","저항","예외","위협"],"en":"But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.” Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time.","ko":"하지만 몽테뉴가 말했듯이, “기적의 기원은 자연 그 자체가 아니라, 자연에 대한 우리 지식의 수준에서, 우리의 무지에 있다.” 영광스러운 기적들은 나중에 알고 보니 자연법칙을 따른 것이거나, 당시에는 널리 알려지지 않았던 기술적 발전이었던 것으로 밝혀져 왔다.","hl":["obedience to the laws of nature","not in nature itself"],"khl":["자연법칙을 따른 것","자연 그 자체가 아니라"],"blocks":[{"t":"pair","h":"몽테뉴의 말과 그 증거","x":[["not in nature itself","기적의 원인은 자연 자체에 있지 않다 (주장)"],["obedience to the laws of nature","알고 보니 자연법칙을 그대로 따른 일 (증거)"]]},{"t":"p","h":"defiance(거역)가 틀린 이유","x":["defiance(거역)를 넣으면 기적이 자연법칙을 거스른 일로 밝혀졌다는 말이 된다.","그러면 기적은 정말 자연을 뛰어넘은 사건이 된다.","글쓴이는 정반대를 말한다.","기적처럼 보였지만 사실은 자연법칙대로였다는 것."]},{"t":"p","h":"함정 둘","x":["source(근원)는 origin(기원) 자리에서 같은 뜻이다.","found(알게 된)는 discovered(밝혀진)와 같은 자리에 들어간다.","have been found to be(~인 것으로 밝혀졌다)도 자연스러운 표현이다."]}],"post":["obedience(따름) ↔ defiance(거역)","기적의 정체 = 자연법칙대로 일어난 일"]},{"slots":[["widely","generally","s"],["mysterious","obvious","a"],["assumes"],["intervention"],["beyond"]],"opts":["mysterious","familiar","simple","clear"],"or":["mysterious(신비로운): 당시 널리 알려지지 않아 신비해 보이던 것도 아직 기적은 아니라는 말이라 앞 문장과 이어짐.","familiar(익숙한): 익숙한 것은 처음부터 기적 후보가 아니라 not yet(아직 ~ 아닌)과 어울리지 않음.","simple(단순한): 단순한 것을 두고 '아직 기적이 아니다'라고 할 이유가 없음.","clear(분명한): 분명히 이해되는 것은 기적으로 오해받을 일이 없어 괴테의 말이 힘을 잃음."],"om":["신비로운","익숙한","단순한","분명한"],"en":"Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time. As the German poet, Goethe, phrased it: “Things that are mysterious are not yet miracles.”","ko":"영광스러운 기적들은 나중에 알고 보니 자연법칙을 따른 것이거나, 당시에는 널리 알려지지 않았던 기술적 발전이었던 것으로 밝혀져 왔다. 독일 시인 괴테가 표현했듯이, “신비로운 것들이 아직 기적인 것은 아니다.”","hl":["Things that are mysterious are not yet miracles","not widely known at the time"],"khl":["신비로운 것들이 아직 기적인 것은 아니다","당시에는 널리 알려지지 않았던"],"blocks":[{"t":"tap","h":"질문 하나","q":"not yet(아직 ~ 아닌)은 어떤 것에 붙는 말일까?","a":["기적처럼 보일 만한 것에 붙는다.","신비로워 보이는 것은 기적이라고 부르고 싶어진다.","괴테는 그래도 아직 기적은 아니라고 선을 긋는다.","obvious(뻔한)를 넣으면 애초에 기적 후보가 아닌 것을 두고 \"아직 아니다\"라고 하는 셈이다."]},{"t":"p","h":"앞 문장과 이어 읽기","x":["바로 앞에서 당시엔 널리 알려지지 않은 기술이라고 했다.","모르니까 신비해 보였던 것이다.","신비로움은 지식이 아직 따라오지 못한 상태일 뿐이다.","몽테뉴도 기적의 기원은 our ignorance(우리의 무지)에 있다고 했다.","모르는 것 = 신비로운 것이라 괴테의 말과 몽테뉴의 말이 짝을 이룬다.","obvious(뻔한)는 이미 다 아는 것이라 이 짝이 깨진다.","generally(일반적으로)는 widely(널리)와 같은 자리에서 그대로 통한다."]}],"post":["mysterious(신비로운) ↔ obvious(뻔한)","신비로움 = 아직 모르는 것, 기적은 아님"]},{"slots":[["grasp"],["methodical","supernatural","a"],["divine"],["investigating"],["excuse"]],"opts":["methodical","magical","sacred","mystical"],"or":["methodical(체계적인): 다음 문장의 확인하고, 조사하고, 근원을 찾는 과정이 바로 체계적인 방법이라 맞음.","magical(마법 같은): without divine revelation(신의 계시 없이)과 함께 쓰면 신은 빼고 마법은 쓴다는 이상한 말이 됨.","sacred(신성한): 신성한 방법이라면 신의 계시 없이라는 말과 부딪침.","mystical(신비주의적인): 신비로운 방법은 기적을 차근차근 풀어내는 글쓴이 쪽 방법과 반대임."],"om":["체계적인","마법 같은","신성한","신비주의적인"],"en":"Yet there are methodical and simple ways to “cause a miracle” without divine revelation and inspiration. Instead of checking it out, investigating and finding the source of the event, we define it as a miracle.","ko":"그러나 신의 계시와 영감 없이도 ‘기적을 일으키는’ 체계적이고 간단한 방법들이 있다. 그것을 확인하고, 그 사건의 근원을 조사하고 찾아내는 대신, 우리는 그것을 기적이라고 정의한다.","hl":["methodical and simple ways","without divine revelation and inspiration"],"khl":["체계적이고 간단한 방법들","신의 계시와 영감 없이도"],"blocks":[{"t":"pair","h":"방법을 풀어 쓴 다음 문장","x":[["methodical and simple ways","체계적이고 간단한 방법"],["checking it out, investigating and finding the source","확인하기, 조사하기, 근원 찾기"]]},{"t":"p","h":"supernatural(초자연적인)이 부딪치는 곳","x":["supernatural(초자연적인)을 넣으면 \"신의 계시 없이도 기적을 일으키는 초자연적인 방법\"이 된다.","초자연적인 힘을 빼겠다면서 초자연적인 방법을 쓴다는 모순이다.","글쓴이가 말하는 방법은 사람이 순서대로 따라 할 수 있는 방법이다.","Yet(그러나)은 앞 문장의 더 높은 힘과 이 방법을 맞세운다."]}],"post":["methodical(체계적인) ↔ supernatural(초자연적인)","기적 만들기 = 확인·조사·근원 찾기"]},{"slots":[["grasp","comprehend","s"],["divine"],["investigating","examining","s"],["excuse"],["lazy","diligent","a"]],"opts":["lazy","eager","careful","smart"],"or":["lazy(게으른): 조사 대신 기적이라 부르고 끝내는 사람들을 꼬집는 말이라 맞음.","eager(열렬한): '생각하기를 너무 바라는 사람들의 핑계'는 뜻이 통하지 않음.","careful(신중한): 신중한 사람은 조사를 건너뛰지 않아 앞 문장의 행동과 맞지 않음.","smart(똑똑한): '생각하기엔 너무 똑똑한'은 말이 되지 않고 글쓴이의 비판과도 어긋남."],"om":["게으른","열렬한","신중한","똑똑한"],"en":"Instead of checking it out, investigating and finding the source of the event, we define it as a miracle. The miracle, then, is the excuse of those who are too lazy to think.","ko":"그것을 확인하고, 그 사건의 근원을 조사하고 찾아내는 대신, 우리는 그것을 기적이라고 정의한다. 그렇다면 기적은 생각하기에 너무 게으른 사람들의 핑계이다.","hl":["too lazy to think","Instead of checking it out"],"khl":["생각하기에 너무 게으른","조사하고 찾아내는 대신"],"blocks":[{"t":"p","h":"too lazy to think(너무 게을러 생각 안 하는)","x":["too lazy to think(너무 게을러서 생각하지 않는)는 생각을 건너뛰는 사람이다.","앞 문장이 그 모습을 그대로 보여 준다.","확인도, 조사도 안 하고 그냥 기적이라 부른다.","diligent(부지런한)를 넣으면 \"너무 부지런해서 생각하지 않는\" 사람이 된다.","말이 되지 않는다."]},{"t":"p","h":"excuse(핑계)와 짝 맞추기","x":["핑계는 해야 할 일을 안 한 사람이 대는 것이다.","해야 할 일 = 생각하고 조사하기","안 한 사람 = 게으른 사람","그래서 핑계와 게으름이 한 문장에 함께 선다."]},{"t":"p","h":"함정 둘","x":["comprehend(이해하다)는 grasp(파악하다) 자리에 그대로 들어간다.","examining(살피기)은 investigating(조사하기)과 같은 뜻이다."]}],"post":["lazy(게으른) ↔ diligent(부지런한)","기적이라 부르기 = 생각을 건너뛴 핑계"]}],"quiz":[{"w":"irrational","m":"비이성적인, 비합리적인","it":[["illogical","비논리적인","s"],["wooden","나무로 된","n"],["rational","이성적인","a"],["weekly","매주의","n"],["unreasonable","불합리한","s"],["logical","논리적인","a"],["tropical","열대의","n"]]},{"w":"obedience","m":"복종, 따름","it":[["pottery","도자기","n"],["compliance","따름, 준수","s"],["defiance","거역, 반항","a"],["lecture","강의","n"],["conformity","따름, 순응","s"],["disobedience","불복종","a"],["harvest","수확","n"]]},{"w":"mysterious","m":"신비로운, 불가사의한","it":[["puzzling","알쏭달쏭한","s"],["punctual","시간을 잘 지키는","n"],["obvious","명백한, 뻔한","a"],["salty","짠","n"],["inexplicable","설명할 수 없는","s"],["evident","분명한","a"],["generous","관대한","n"]]},{"w":"methodical","m":"체계적인, 질서 정연한","it":[["fluent","유창한","n"],["systematic","체계적인","s"],["chaotic","혼란스러운","a"],["thirsty","목마른","n"],["orderly","정돈된, 질서 있는","s"],["disorganized","체계가 없는, 엉망인","a"],["ancient","고대의","n"]]},{"w":"lazy","m":"게으른","it":[["idle","게으른, 빈둥거리는","s"],["polite","공손한","n"],["diligent","부지런한","a"],["frozen","얼어붙은","n"],["sluggish","게으른, 굼뜬","s"],["industrious","근면한","a"],["curious","호기심 많은","n"]]}]},{"items":[{"slots":[["impossible","probable","a"],["irrational"],["define"],["ignorance"],["discovered"]],"opts":["impossible","common","frequent","typical"],"or":["impossible(불가능한): 일어날 수 없어 보이는 우연이라 비이성적으로 보이고 기적이라 불린다는 흐름과 맞음.","common(흔한): 흔한 우연은 비이성적으로 보이지도 않고 기적이라 불리지도 않음.","frequent(잦은): 자주 일어나는 우연을 기적이라 부를 사람은 없음.","typical(전형적인): 전형적인 우연이라면 놀랄 일이 없어 irrational(비이성적인)과 맞지 않음."],"om":["불가능한","흔한","잦은","전형적인"],"en":"Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.","ko":"통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적이라고 정의한다.","hl":["statistically impossible","some define it as a miracle"],"khl":["통계적으로 불가능한","기적이라고 정의한다"],"blocks":[{"t":"p","h":"기적이라는 이름표가 붙는 조건","x":["사람들이 기적이라 부르는 건 도저히 일어날 수 없어 보이는 일이다.","확률로 따지면 거의 0인 우연.","그래서 이치에 안 맞아 보인다.","probable(있을 법한)을 넣으면 확률상 충분히 일어날 만한 우연이 된다.","그런 일은 irrational(비이성적인)으로 보이지도 않고, 기적이라 불리지도 않는다."]},{"t":"p","h":"첫 문장이 맡은 일","x":["첫 문장은 사람들이 기적을 믿는 이유를 보여 준다.","글쓴이는 이 믿음을 끝까지 반박해 나간다."]}],"post":["impossible(불가능한) ↔ probable(있을 법한)","확률 거의 0인 우연 = 기적 후보"]},{"slots":[["irrational","illogical","s"],["define","label","s"],["ignorance","wisdom","a"],["obedience"],["widely"]],"opts":["ignorance","intelligence","understanding","insight"],"or":["ignorance(무지): 기적은 우리가 자연을 잘 몰라서 생긴다는 뜻이라 마지막 문장의 '생각하기 귀찮은 사람들의 핑계'와 이어짐.","intelligence(지능): 기적이 우리의 똑똑함에서 나온다는 말은 글쓴이의 비판과 반대임.","understanding(이해): 우리가 이해해서 기적이 생긴다면, 알고 보니 몰랐던 기술이었다는 다음 문장과 거꾸로임.","insight(통찰): 통찰에서 기적이 나온다는 건 조사를 안 해서 기적이라 부른다는 결론과 맞지 않음."],"om":["무지","지능","이해","통찰"],"en":"But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.”","ko":"하지만 몽테뉴가 말했듯이, “기적의 기원은 자연 그 자체가 아니라, 자연에 대한 우리 지식의 수준에서, 우리의 무지에 있다.”","hl":["the origin of a miracle is in our ignorance","at the level of our knowledge of nature"],"khl":["우리의 무지에 있다","자연에 대한 우리 지식의 수준에서"],"blocks":[{"t":"flow","h":"But(하지만) 앞뒤","x":["앞: 어떤 이들은 불가능한 우연을 기적이라 부름","But(하지만)","뒤: 기적은 우리가 몰라서 생기는 것","증거: 알고 보니 자연법칙이나 기술"],"at":2},{"t":"p","h":"wisdom(지혜)이 틀린 이유","x":["wisdom(지혜)을 넣으면 기적이 우리의 지혜에서 나온다는 말이 된다.","그런데 다음 문장은 기적이 알고 보니 당시 몰랐던 기술이었다고 한다.","몰라서 기적처럼 보였던 것이다.","at the level of our knowledge(우리 지식의 수준에서)는 지식이 모자란 그 지점을 가리킨다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["illogical(비논리적인)은 irrational(비이성적인)과 같은 자리에 들어간다.","label(이름 붙이다)은 define(정의하다) 자리에서 \"기적이라고 이름 붙인다\"가 된다."]}],"post":["ignorance(무지) ↔ wisdom(지혜)","기적의 출발점 = 우리가 모르는 부분"]},{"slots":[["mysterious","puzzling","s"],["assumes","excludes","a"],["intervention"],["beyond"],["grasp"]],"opts":["assumes","denies","rejects","forbids"],"or":["assumes(전제로 하다): 기적이라는 말에는 원래 '더 높은 힘이 끼어들었다'는 생각이 깔려 있어 맞음.","denies(부인하다): 더 높은 힘을 부인한다면 그건 기적이 아니라 평범한 사건임.","rejects(거부하다): 기적이 더 높은 힘의 개입을 거부한다는 건 기적의 뜻과 정반대임.","forbids(금지하다): 기적이 개입을 금지한다는 말은 뜻이 통하지 않음."],"om":["전제로 하다","부인하다","거부하다","금지하다"],"en":"The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.","ko":"기적은 그것이 일어날 때 인간의 능력으로는 이해할 수 없는 ‘더 높은 힘’이 개입했다는 것을 전제로 한다.","hl":["assumes the intervention of a “higher power”","beyond human capability to grasp"],"khl":["개입했다는 것을 전제로 한다","인간의 능력으로는 이해할 수 없는"],"blocks":[{"t":"p","h":"기적이라는 낱말의 정의","x":["이 문장은 기적이 무엇인지 정의한다.","기적 = 사람이 알 수 없는 더 높은 힘이 끼어든 일","그 힘이 빠지면 기적이라 부를 수 없다.","excludes(배제하다)를 넣으면 기적이 더 높은 힘을 빼고 일어난다는 말
