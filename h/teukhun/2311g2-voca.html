ead of checking it out"],"khl":["사건의 근원을 조사하고 찾아내는","대신"],"blocks":[{"t":"pair","h":"나란히 선 세 행동","x":[["checking it out","확인하기"],["investigating","조사하기"],["finding the source of the event","사건의 근원 찾기"]]},{"t":"p","h":"ignoring(무시하기)이 튀는 이유","x":["세 행동은 모두 사건을 파고드는 일이다.","Instead of(~ 대신에)가 이 셋을 묶어 우리가 하지 않는 일로 만든다.","ignoring(무시하기)을 넣으면 확인하기, 근원 찾기 사이에 혼자 반대 방향인 말이 끼어든다.","게다가 무시하는 것이야말로 우리가 실제로 하는 일이라 앞뒤가 엉킨다."]},{"t":"p","h":"그대로 둘 두 단어","x":["involvement(관여)는 intervention(개입) 자리에서 같은 뜻이 된다.","systematic(체계적인)은 methodical(체계적인)과 같은 말이다."]}],"post":["investigate(조사하다) ↔ ignore(무시하다)","기적 대신 할 일 = 확인·조사·근원 찾기"]}],"quiz":[{"w":"impossible","m":"불가능한","it":[["muddy","진흙투성이의","n"],["inconceivable","상상도 할 수 없는","s"],["possible","가능한","a"],["royal","왕의","n"],["unattainable","이룰 수 없는","s"],["feasible","실행 가능한","a"],["spicy","매운","n"]]},{"w":"ignorance","m":"무지, 모름","it":[["unawareness","알지 못함","s"],["blanket","담요","n"],["knowledge","지식","a"],["appetite","식욕","n"],["unfamiliarity","잘 모름, 낯섦","s"],["awareness","앎, 인식","a"],["ladder","사다리","n"]]},{"w":"assume","m":"전제로 하다, 가정하다","it":[["sneeze","재채기하다","n"],["presume","가정하다, 추정하다","s"],["doubt","의심하다","a"],["wrap","싸다, 포장하다","n"],["suppose","가정하다, 생각하다","s"],["disbelieve","믿지 않다","a"],["polish","닦다, 광내다","n"]]},{"w":"grasp","m":"이해하다, 파악하다","it":[["comprehend","이해하다","s"],["bake","굽다","n"],["misunderstand","오해하다","a"],["sew","바느질하다","n"],["understand","이해하다","s"],["misinterpret","잘못 해석하다","a"],["skate","스케이트를 타다","n"]]},{"w":"investigate","m":"조사하다","it":[["whisper","속삭이다","n"],["examine","살피다, 조사하다","s"],["ignore","무시하다","a"],["jog","조깅하다","n"],["probe","캐다, 조사하다","s"],["overlook","간과하다","a"],["knit","뜨개질하다","n"]]}]}],"no":"31"},{"id":"2311g2-32","title":"어휘특훈 · 23년 11월 고2 32번","sub":"사건 뒤에 들어온 정보와 목격자의 기억","tpl":"Information {encountered} after an event can influence {subsequent} remembering. {External} information can {easily} {integrate} into a witness’s memory, especially if the event was {poorly} encoded or the memory is from a {distant} event, in which case time and forgetting have {degraded} the original memory. With {reduced} information available in memory with which to {confirm} the validity of post-event misinformation, it is less likely that this new information will be {rejected}. Instead, especially when it {fits} the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience. This process can be {explicit} (i.e., the witness knows it is happening), but it is often {unconscious}. That is, the witness might find himself or herself thinking about the event {differently} without {awareness}. Over time, the witness may not even know the {source} of information that led to the (new) memory. Sources of misinformation in forensic contexts can be encountered {anywhere}, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court.","fn":["*encode: (정보를) 기억에 입력하다","*validity: 타당성, 유효성","*misinformation: 잘못된 정보","*forensic: 법의학의, 법정의","*investigator: 수사관"],"mean":{"encountered":"동사 encounter(마주치다, 접하다)의 과거분사형. 접한","obtained":"동사 obtain(얻다)의 과거분사형. 얻은","subsequent":"그 뒤의, 이후의","later":"나중의, 그 뒤의","previous":"이전의","External":"외부의","Internal":"내부의","easily":"쉽게","readily":"손쉽게, 선뜻","rarely":"좀처럼 ~않게, 드물게","integrate":"통합되다, 섞여 들다","blend":"섞이다, 섞여 들다","poorly":"형편없이, 제대로 ~하지 못하게","well":"잘, 제대로","distant":"먼, 오래전의","remote":"먼, 오래전의","recent":"최근의","degraded":"동사 degrade(질을 떨어뜨리다, 약화시키다)의 과거분사형","eroded":"동사 erode(침식하다, 서서히 약화시키다)의 과거분사형","preserved":"동사 preserve(보존하다)의 과거분사형","reduced":"동사 reduce(줄이다)의 과거분사형. 줄어든","limited":"제한된, 한정된","increased":"동사 increase(늘리다)의 과거분사형. 늘어난","confirm":"확인하다","verify":"검증하다, 확인하다","rejected":"동사 reject(거부하다)의 과거분사형. 거부된","dismissed":"동사 dismiss(묵살하다, 일축하다)의 과거분사형","accepted":"동사 accept(받아들이다)의 과거분사형. 받아들여진","fits":"동사 fit(들어맞다, 일치하다)의 3인칭 단수형","contradicts":"동사 contradict(모순되다, 반박하다)의 3인칭 단수형","explicit":"명시적인, 겉으로 드러난","conscious":"의식적인, 알고 있는","implicit":"암묵적인, 드러나지 않은","unconscious":"무의식적인","deliberate":"의도적인, 고의의","differently":"다르게","identically":"똑같이","awareness":"인식, 알아차림","source":"출처, 원천","origin":"기원, 출처","anywhere":"어디에서든"},"comp":[{"no":"32","slots":[["encountered"],["integrate"],["reduced","increased","a"],["fits"],["source"]],"opts":["reduced","abundant","reliable","fresh"],"or":["reduced(줄어든): 앞 문장에서 시간과 망각이 원래 기억을 약하게 만들었으니 쓸 수 있는 정보가 줄어든 상태라 맞음.","abundant(풍부한): 확인할 정보가 풍부하면 잘못된 정보를 잘 걸러 내서 거부될 가능성이 오히려 높아짐.","reliable(믿을 만한): 믿을 만한 기억이 있으면 확인이 쉬워져 less likely(가능성이 더 낮은)와 부딪침.","fresh(생생한): 생생한 정보는 앞 문장의 degraded(약해진) 기억과 반대 방향임."],"om":["줄어든","풍부한","믿을 만한","생생한"],"en":"With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.","ko":"사건 이후의 잘못된 정보가 맞는지 확인할 정보가 기억 속에 줄어들어 있으면, 이 새 정보가 거부될 가능성은 더 낮다.","hl":["reduced information","less likely"],"khl":["줄어들어","가능성은 더 낮다"],"blocks":[{"t":"p","h":"increased(늘어난)를 넣고 읽기","x":["\"확인할 정보가 늘어나면 새 정보가 거부될 가능성이 낮다\"가 된다.","확인할 정보가 많을수록 가짜를 더 잘 걸러 낸다.","그러면 거부될 가능성은 높아져야 한다.","앞뒤가 정반대로 엇갈린다."]},{"t":"p","h":"흐릿한 원본 사진","x":["원본 사진이 흐릿하면 누가 덧칠해도 티가 안 난다.","원본이 선명하면 덧칠이 바로 보인다.","기억도 같다.","원래 정보가 줄어 있어야 잘못된 정보가 그냥 통과한다."]}],"post":["reduced(줄어든) ↔ increased(늘어난)","확인할 기억이 적을수록 가짜가 통과"]},{"no":"32","slots":[["easily","rarely","a"],["poorly"],["confirm"],["explicit","conscious","s"],["differently"]],"opts":["easily","barely","reluctantly","unsuccessfully"],"or":["easily(쉽게): 원래 기억이 약할수록 바깥 정보가 잘 섞인다는 especially(특히) 뒤 조건과 맞음.","barely(거의 ~않게): 거의 안 섞인다면 그 뒤 내용, 즉 새 정보가 원래 경험의 일부로 합쳐진다는 말과 부딪침.","reluctantly(마지못해): 정보에는 마음이 없다. 게다가 마지못해 섞인다는 건 글의 요점과 상관없음.","unsuccessfully(성공하지 못한 채): 섞이는 데 실패한다면 기억이 바뀌는 이야기가 성립하지 않음."],"om":["쉽게","거의 ~않게","마지못해","성공하지 못한 채"],"en":"External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.","ko":"외부 정보는 목격자의 기억 속에 쉽게 섞여 들어갈 수 있다. 특히 사건이 제대로 입력되지 않았거나 오래전 사건의 기억일 때 그렇다. 그런 경우에는 시간과 망각이 원래 기억을 약하게 만들어 놓았다.","hl":["can easily integrate","especially if the event was poorly encoded"],"khl":["쉽게 섞여 들어갈 수 있다","특히 사건이 제대로 입력되지 않았거나"],"blocks":[{"t":"p","h":"especially(특히)가 정하는 방향","x":["especially(특히)는 앞말이 더 강해지는 경우를 붙인다.","\"쉽게 섞인다. 특히 기억이 약할 때.\" 자연스럽다.","rarely(좀처럼 ~않게)를 넣으면 \"좀처럼 안 섞인다. 특히 기억이 약할 때.\"가 된다.","약한 기억일수록 더 안 섞인다는 말이라 글 전체와 반대다."]},{"t":"p","h":"함정","x":["conscious(의식적인)는 explicit(명시적인) 자리에 넣어도 된다.","괄호 속 the witness knows it is happening(목격자가 그 일이 일어나는 걸 안다)이 바로 의식적이라는 뜻이다."]}],"post":["easily(쉽게) ↔ rarely(좀처럼 ~않게)","약한 기억 = 바깥 정보가 쉽게 섞이는 틈"]}],"compquiz":[{"w":"reduce","m":"줄이다","it":[["greet","인사하다","n"],["decrease","줄이다","s"],["increase","늘리다","a"],["swallow","삼키다","n"],["diminish","줄이다, 약화시키다","s"],["expand","확대하다","a"],["rent","빌리다, 임대하다","n"]]},{"w":"easily","m":"쉽게","it":[["effortlessly","힘들이지 않고","s"],["angrily","화내며","n"],["laboriously","힘들게, 공들여","a"],["weekly","매주","n"],["readily","손쉽게","s"],["with difficulty","어렵게, 힘들게","a"],["silently","조용히","n"]]}],"sets":[{"items":[{"slots":[["subsequent","previous","a"],["External"],["poorly"],["rejected"],["awareness"]],"opts":["subsequent","simultaneous","inherited","momentary"],"or":["subsequent(그 뒤의): after an event(사건 이후에) 접한 정보가 바꿀 수 있는 건 그 뒤에 떠올리는 기억이라 맞음.","simultaneous(동시의): 사건과 동시에 일어나는 기억이라면 사건 뒤에 들어온 정보가 끼어들 틈이 없음.","inherited(물려받은): 부모에게 물려받은 기억이라는 말은 사건 뒤에 접한 정보와 아무 상관이 없음.","momentary(순간적인): 글은 Over time(시간이 지나면서) 바뀌는 기억을 다루므로 순간적인 기억과 안 맞음."],"om":["그 뒤의, 이후의","동시의","물려받은","순간적인"],"en":"Information encountered after an event can influence subsequent remembering.","ko":"사건 이후에 접한 정보는 그 뒤의 기억에 영향을 줄 수 있다.","hl":["subsequent remembering","after an event"],"khl":["그 뒤의 기억","사건 이후에"],"blocks":[{"t":"flow","h":"이 단어가 서 있는 자리","x":["사건이 일어남","사건 뒤에 새 정보를 접함","그 정보가 그 뒤의 기억에 섞임","목격자는 섞인 줄도 모름","법적 상황 곳곳에 이런 정보가 있음"],"at":2},{"t":"p","h":"시간 순서로 따져 보기","x":["정보는 사건 after(이후에) 들어왔다.","이 정보가 영향을 줄 수 있는 건 그 뒤에 떠올리는 기억뿐이다.","previous(이전의)를 넣으면 나중 정보가 과거의 기억을 바꾼다는 말이 된다.","시간이 거꾸로 흐르는 셈이다."]}],"post":["subsequent(그 뒤의) ↔ previous(이전의)","사건 뒤 정보 → 그 뒤의 기억에 영향"]},{"slots":[["encountered","obtained","s"],["poorly","well","a"],["distant","remote","s"],["fits"],["unconscious"]],"opts":["poorly","carefully","clearly","vividly"],"or":["poorly(제대로 못하게): 처음부터 기억에 제대로 안 들어간 사건일수록 바깥 정보가 끼어들기 쉬워 맞음.","carefully(꼼꼼하게): 꼼꼼히 입력된 기억은 단단해서 바깥 정보가 쉽게 섞이지 않음.","clearly(또렷하게): 또렷하게 입력된 기억은 잘못된 정보를 걸러 낼 수 있어 especially(특히)의 조건이 될 수 없음.","vividly(생생하게): 생생한 기억은 같은 문장 뒤쪽의 degraded(약해진) 기억과 반대 방향임."],"om":["제대로 못하게","꼼꼼하게","또렷하게","생생하게"],"en":"External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.","ko":"외부 정보는 목격자의 기억 속에 쉽게 섞여 들어갈 수 있다. 특히 사건이 제대로 입력되지 않았거나 오래전 사건의 기억일 때 그렇다. 그런 경우에는 시간과 망각이 원래 기억을 약하게 만들어 놓았다.","hl":["poorly encoded","degraded the original memory"],"khl":["제대로 입력되지 않았거나","원래 기억을 약하게 만들어"],"blocks":[{"t":"p","h":"especially(특히) 뒤의 두 조건","x":["외부 정보가 특히 잘 섞이는 경우가 두 가지 나온다.","하나는 사건이 poorly encoded(제대로 입력되지 않은) 경우다.","다른 하나는 오래전 사건이라 기억이 약해진 경우다.","두 조건의 공통점은 원래 기억이 약하다는 것이다.","well(잘)을 넣으면 튼튼한 기억이 오히려 잘 흔들린다는 말이 된다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["obtained(얻은)는 encountered(접한) 자리에 넣어도 사건 뒤에 들어온 정보라는 뜻이 그대로다.","remote(먼, 오래전의)는 distant(먼)와 같은 뜻이다.","둘 다 글의 방향을 해치지 않는다."]}],"post":["poorly(제대로 못하게) ↔ well(잘)","약한 기억일수록 바깥 정보가 잘 섞임"]},{"slots":[["easily"],["reduced","limited","s"],["rejected","accepted","a"],["explicit"],["source"]],"opts":["rejected","remembered","repeated","recorded"],"or":["rejected(거부된): 확인할 기억이 부족하니 거부될 가능성이 낮고, 그래서 Instead(대신) 기억에 합쳐진다는 흐름과 맞음.","remembered(기억된): 기억될 가능성이 낮다면 바로 뒤에서 원래 경험의 일부로 합쳐진다는 말과 부딪침.","repeated(반복된): 새 정보가 반복되느냐는 이 문장이 따지는 문제가 아님. 확인할 기억이 부족하다는 앞부분과 이어지지 않음.","recorded(기록된): 기록 여부가 아니라 받아들이느냐 거부하느냐가 핵심이라 Instead(대신)와 이어지지 않음."],"om":["거부된","기억된","반복된","기록된"],"en":"With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected. Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.","ko":"사건 이후의 잘못된 정보가 맞는지 확인할 정보가 기억 속에 줄어들어 있으면, 이 새 정보가 거부될 가능성은 더 낮다. 대신, 특히 그 정보가 목격자의 현재 생각과 맞아떨어지고 그 사람에게 말이 되는 이야기를 만드는 데 쓰일 수 있을 때, 그것은 원래 경험의 일부로 합쳐질 수 있다.","hl":["will be rejected","Instead"],"khl":["거부될 가능성은 더 낮다","대신"],"blocks":[{"t":"pair","h":"Instead(대신) 앞뒤 나란히","x":[["it is less likely that this new information will be rejected","이 새 정보가 거부될 가능성은 낮다"],["Instead, ... it may be integrated as part of the original experience.","대신 원래 경험의 일부로 합쳐질 수 있다"]]},{"t":"p","h":"accepted(받아들여진)를 넣고 다시 읽기","x":["\"받아들여질 가능성이 낮다. 대신 기억에 합쳐진다.\"가 된다.","받아들이지 않는데 기억에 합쳐질 수는 없다.","Instead(대신)는 거부되는 대신 합쳐진다는 뜻이어야 말이 된다."]},{"t":"p","h":"함정","x":["limited(제한된)는 reduced(줄어든) 자리에 들어가도 기억 속 정보가 부족하다는 뜻이 같다."]}],"post":["reject(거부하다) ↔ accept(받아들이다)","확인할 기억 부족 → 거부 대신 그대로 흡수"]},{"slots":[["External","Internal","a"],["integrate"],["degraded"],["differently"],["anywhere"]],"opts":["External","Accurate","Personal","Forgotten"],"or":["External(외부의): 마지막 문장에 나오는 출처가 모두 목격자 바깥에서 들어오는 정보라 맞음.","Accurate(정확한): 이 글은 정확한 정보가 아니라 misinformation(잘못된 정보)이 기억에 섞이는 이야기임.","Personal(개인적인): 목격자 자신의 정보가 아니라 다른 사람·검색·면담에서 들어온 정보가 문제임.","Forgotten(잊힌): 잊힌 정보는 기억에 섞여 들어갈 수 없음. 잊히는 건 오히려 원래 기억 쪽임."],"om":["외부의","정확한","개인적인","잊힌"],"en":"External information can easily integrate into a witness’s memory … Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court.","ko":"외부 정보는 목격자의 기억 속에 쉽게 섞여 들어갈 수 있다. … 법적 상황에서 잘못된 정보의 출처는 어디서든 마주칠 수 있다. 다른 목격자들과의 대화에서부터 소셜 미디어 검색, 수사관이나 다른 법률 전문가와의 여러 차례 면담, 심지어 법정에서까지.","hl":["External information","from discussions with other witnesses"],"khl":["외부 정보는","다른 목격자들과의 대화에서부터"],"blocks":[{"t":"p","h":"마지막 문장이 출처를 다 알려 준다","x":["마지막 문장에 잘못된 정보의 출처가 줄줄이 나온다.","다른 목격자와의 대화, 소셜 미디어 검색, 수사관과의 면담, 법정.","전부 목격자 바깥에서 들어오는 정보다.","Internal(내부의)을 넣으면 목격자 머릿속에서 나온 정보가 되어 이 목록과 부딪친다."]},{"t":"p","h":"첫 문장과도 이어진다","x":["첫 문장의 Information encountered after an event(사건 이후에 접한 정보)가 바로 이 외부 정보다.","사건 뒤에 바깥에서 만난 정보라는 뜻."]}],"post":["external(외부의) ↔ internal(내부의)","대화·검색·면담·법정 = 전부 바깥 정보"]},{"slots":[["integrate","blend","s"],["confirm","verify","s"],["fits"],["unconscious","deliberate","a"],["source"]],"opts":["unconscious","purposeful","accurate","brief"],"or":["unconscious(무의식적인): but(하지만) 앞의 explicit(명시적인)과 대조되고 다음 문장 without awareness(자신도 모르게)와 이어져 맞음.","purposeful(의도적인): 목격자가 알면서 일부러 하는 과정이 되어 without awareness(자신도 모르게)와 부딪침.","accurate(정확한): 잘못된 정보가 섞이는 과정이 정확하다는 건 글 내용과 반대임.","brief(짧은): 과정의 길이는 but(하지만) 앞의 explicit(명시적인)과 대조가 되지 않음."],"om":["무의식적인","의도적인","정확한","짧은"],"en":"This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious. That is, the witness might find himself or herself thinking about the event differently without awareness.","ko":"이 과정은 명시적일 수도 있지만(즉, 목격자가 그 일이 일어나고 있음을 안다), 흔히 무의식적이다. 즉, 목격자는 자신도 모르게 그 사건을 다르게 생각하고 있는 자신을 발견할 수도 있다.","hl":["often unconscious","without awareness"],"khl":["흔히 무의식적이다","자신도 모르게"],"blocks":[{"t":"tap","h":"질문 하나","q":"but(하지만) 앞의 explicit(명시적인)을 괄호 속에서 어떻게 풀었나?","a":["the witness knows it is happening(목격자가 그 일이 일어나는 걸 안다).","but(하지만) 뒤에는 그 반대, 모르는 채 일어난다는 말이 와야 한다.","그 말이 unconscious(무의식적인)이다."]},{"t":"p","h":"deliberate(의도적인)가 안 되는 이유","x":["deliberate(의도적인)는 알고 일부러 한다는 뜻이다.","바로 다음 문장은 without awareness(자신도 모르게)라고 못 박는다.","일부러 하면서 모를 수는 없다."]},{"t":"p","h":"함정","x":["blend(섞여 들다)는 integrate(통합되다) 자리에 넣어도 into(~ 속으로)와 잘 어울린다.","verify(검증하다)는 confirm(확인하다)과 같은 뜻이다."]}],"post":["unconscious(무의식적인) ↔ deliberate(의도적인)","기억이 바뀌는 과정 = 대개 본인도 모르게"]}],"quiz":[{"w":"subsequent","m":"그 뒤의, 이후의","it":[["following","그다음의","s"],["rural","시골의","n"],["previous","이전의","a"],["later","나중의","s"],["fragile","깨지기 쉬운","n"],["prior","이전의, 앞선","a"],["generous","관대한","n"]]},{"w":"poorly","m":"형편없이, 제대로 ~하지 못하게","it":[["badly","나쁘게, 서투르게","s"],["loudly","큰 소리로","n"],["well","잘","a"],["inadequately","불충분하게","s"],["secretly","몰래","n"],["adequately","충분히, 적절히","a"],["politely","공손하게","n"]]},{"w":"reject","m":"거부하다","it":[["dismiss","묵살하다, 일축하다","s"],["borrow","빌리다","n"],["accept","받아들이다","a"],["refuse","거절하다","s"],["paint","칠하다","n"],["approve","승인하다","a"],["whisper","속삭이다","n"]]},{"w":"external","m":"외부의","it":[["outside","바깥의","s"],["internal","내부의","a"],["annual","해마다의","n"],["outer","바깥쪽의","s"],["inner","안쪽의","a"],["spicy","매운","n"],["wooden","나무로 된","n"]]},{"w":"unconscious","m":"무의식적인","it":[["subconscious","잠재의식의","s"],["conscious","의식적인","a"],["talkative","말이 많은","n"],["involuntary","자기도 모르게 하는, 무의식적인","s"],["deliberate","의도적인","a"],["rectangular","직사각형의","n"],["humid","습한","n"]]}]},{"items":[{"slots":[["subsequent"],["distant","recent","a"],["reduced"],["explicit"],["awareness"]],"opts":["distant","vivid","shocking","familiar"],"or":["distant(먼, 오래전의): 뒤의 in which case(그런 경우에는)가 시간과 망각이 기억을 약하게 했다고 설명해 오래전 사건이어야 맞음.","vivid(생생한): 생생한 사건이면 기억이 약해졌다는 뒤 설명과 반대임.","shocking(충격적인): 충격의 크기는 time and forgetting(시간과 망각)과 상관이 없음.","familiar(익숙한): 뒤 설명의 핵심은 익숙함이 아니라 시간이 많이 흘렀다는 것임."],"om":["먼, 오래전의","생생한","충격적인","익숙한"],"en":"External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory.","ko":"외부 정보는 목격자의 기억 속에 쉽게 섞여 들어갈 수 있다. 특히 사건이 제대로 입력되지 않았거나 오래전 사건의 기억일 때 그렇다. 그런 경우에는 시간과 망각이 원래 기억을 약하게 만들어 놓았다.","hl":["a distant event","time and forgetting"],"khl":["오래전 사건의 기억","시간과 망각이"],"blocks":[{"t":"p","h":"in which case(그런 경우에는)가 가리키는 것","x":["in which case(그런 경우에는)는 바로 앞 내용을 받는다.","그 경우엔 time and forgetting(시간과 망각)이 원래 기억을 약하게 만들었다.","시간이 많이 흘러야 망각이 일어난다.","recent(최근의)를 넣으면 최근 사건인데 시간이 기억을 갉아먹었다는 말이 된다.","앞뒤가 맞지 않는다."]},{"t":"flow","h":"기억이 약해지는 순서","x":["오래전 사건","시간이 흐르고 잊힘","원래 기억이 약해짐","확인할 정보가 부족","바깥 정보가 쉽게 섞임"],"at":0}],"post":["distant(먼) ↔ recent(최근의)","시간 + 망각 = 약해진 원래 기억"]},{"slots":[["easily","readily","s"],["degraded","eroded","s"],["fits","contradicts","a"],["differently"],["anywhere"]],"opts":["fits","challenges","replaces","ignores"],"or":["fits(들어맞다): 뒤의 makes sense to him or her(그 사람에게 말이 되는)와 같은 방향이라 맞음.","challenges(이의를 제기하다): 현재 생각에 맞서는 정보라면 그 사람에게 말이 되는 이야기가 되기 어려움.","replaces(대체하다): 현재 생각을 통째로 갈아 치운다는 말이 되어 그 생각에 잘 섞인다는 흐름과 안 맞음.","ignores(무시하다): 현재 생각을 무시하는 정보는 그 사람에게 말이 되는 이야기를 만들 수 없음."],"om":["들어맞다","이의를 제기하다","대체하다","무시하다"],"en":"Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.","ko":"대신, 특히 그 정보가 목격자의 현재 생각과 맞아떨어지고 그 사람에게 말이 되는 이야기를 만드는 데 쓰일 수 있을 때, 그것은 원래 경험의 일부로 합쳐질 수 있다.","hl":["fits the witness’s current thinking","makes sense to him or her"],"khl":["목격자의 현재 생각과 맞아떨어지고","말이 되는 이야기"],"blocks":[{"t":"p","h":"and(그리고)로 묶인 두 조건","x":["두 조건이 and(그리고)로 묶여 있다.","하나는 목격자의 현재 생각과 맞는 것.","다른 하나는 그 사람에게 말이 되는 이야기를 만드는 것.","둘 다 \"내 생각에 잘 들어맞는다\"는 같은 방향이다.","contradicts(모순되다)를 넣으면 내 생각과 부딪치는데 말이 되는 이야기가 된다는 말이 된다."]},{"t":"p","h":"사람 마음으로 생각해 보기","x":["사람은 자기 생각과 맞는 이야기를 쉽게 믿는다.","부딪치는 정보는 오히려 의심한다.","그래서 기억에 섞이는 건 맞아떨어지는 정보 쪽이다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","readily(손쉽게)는 easily(쉽게)와, eroded(서서히 약해진)는 degraded(약해진)와 뜻이 같다.","고칠 단어는 하나뿐."]}],"post":["fit(들어맞다) ↔ contradict(모순되다)","내 생각에 맞는 정보일수록 기억에 쏙"]},{"slots":[["encountered"],["distant"],["explicit","implicit","a"],["awareness"],["source","origin","s"]],"opts":["explicit","gradual","harmful","temporary"],"or":["explicit(명시적인): 괄호 속 풀이가 목격자가 안다는 것이고, but(하지만) 뒤 unconscious(무의식적인)와 대조를 이뤄 맞음.","gradual(점진적인): 괄호 속 '목격자가 안다'는 풀이와 연결되지 않음.","harmful(해로운): 괄호 풀이는 해로운지가 아니라 아느냐 모르느냐를 말함.","temporary(일시적인): 기간이 아니라 의식 여부의 대조라서 but(하지만) 뒤 unconscious(무의식적인)와 짝이 안 맞음."],"om":["명시적인","점진적인","해로운","일시적인"],"en":"This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.","ko":"이 과정은 명시적일 수도 있지만(즉, 목격자가 그 일이 일어나고 있음을 안다), 흔히 무의식적이다.","hl":["can be explicit","the witness knows it is happening"],"khl":["명시적일 수도 있지만","목격자가 그 일이 일어나고 있음을 안다"],"blocks":[{"t":"pair","h":"괄호 속 풀이와 짝 맞추기","x":[["explicit","명시적인 = 본인이 알고 있는"],["(i.e., the witness knows it is happening)","(즉, 목격자가 그 일이 일어나는 걸 안다)"],["but it is often unconscious","하지만 흔히 무의식적이다"]]},{"t":"p","h":"implicit(암묵적인)이 틀린 이유","x":["implicit(암묵적인)는 드러나지 않고 속에 깔려 있다는 뜻이다.","그런데 괄호는 목격자가 안다고 풀었다.","게다가 but(하지만) 뒤 unconscious(무의식적인)와 대조가 되려면 앞은 의식하는 쪽이어야 한다.","implicit(암묵적인)는 오히려 unconscious(무의식적인) 쪽에 가깝다."]},{"t":"p","h":"함정","x":["origin(기원, 출처)은 source(출처) 자리에 넣어도 된다."]}],"post":["explicit(명시적인) ↔ implicit(암묵적인)","알고 섞임은 가끔, 모르고 섞임이 대부분"]},{"slots":[["External"],["poorly"],["rejected"],["differently","identically","a"],["anywhere"]],"opts":["differently","calmly","briefly","proudly"],"or":["differently(다르게): 새 정보가 섞여 사건을 전과 다르게 떠올린다는 뜻이라 맞음.","calmly(침착하게): 감정 상태가 아니라 기억의 내용이 바뀌는 게 핵심임.","briefly(잠깐): 얼마나 오래 생각하느냐가 아니라 어떻게 생각하느냐(바뀐 기억)가 문제임.","proudly(자랑스럽게): 바뀐 기억과 상관없는 감정이라 That is(즉)로 앞 문장을 풀어 쓴 말이 될 수 없음."],"om":["다르게","침착하게","잠깐","자랑스럽게"],"en":"That is, the witness might find himself or herself thinking about the event differently without awareness. Over time, the witness may not even know the source of information that led to the (new) memory.","ko":"즉, 목격자는 자신도 모르게 그 사건을 다르게 생각하고 있는 자신을 발견할 수도 있다. 시간이 지나면 목격자는 그 (새) 기억을 만든 정보의 출처조차 모를 수 있다.","hl":["thinking about the event differently","without awareness"],"khl":["다르게 생각하고 있는","자신도 모르게"],"blocks":[{"t":"p","h":"That is(즉)는 앞 문장을 다시 말한다","x":["앞 문장: 이 과정은 흔히 unconscious(무의식적인)다.","That is(즉) 뒤에서 그걸 풀어 쓴다.","새 정보가 섞여서 사건이 다르게 떠오르는데, 본인은 모른다.","identically(똑같이)를 넣으면 사건을 전과 똑같이 생각한다는 말이 된다.","그러면 바뀐 게 없으니 모르고 말고 할 것도 없다."]},{"t":"tap","h":"한 줄로 줄이면","q":"이 글의 핵심을 한 줄로?","a":["사건 뒤에 들어온 정보가 기억을 몰래 바꾼다.","그래서 목격자는 사건을 다르게 기억하면서도 그걸 모른다."]}],"post":["differently(다르게) ↔ identically(똑같이)","모르는 사이 바뀌어 버린 기억"]},{"slots":[["subsequent","later","s"],["degraded","preserved","a"],["rejected","dismissed","s"],["unconscious"],["awareness"]],"opts":["degraded","sharpened","organized","refreshed"],"or":["degraded(약화시킨): 시간과 망각이 기억에 하는 일은 약하게 만드는 것이라 맞음.","sharpened(또렷하게 만든): 망각이 기억을 또렷하게 만들 수는 없음.","organized(정리한): 망각은 기억을 정리하는 게 아니라 지우는 쪽임.","refreshed(새롭게 한): 다음 문장의 reduced information(줄어든 정보)과 부딪침."],"om":["약화시킨","또렷하게 만든","정리한","새롭게 한"],"en":"… in which case time and forgetting have degraded the original memory. With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.","ko":"… 그런 경우에는 시간과 망각이 원래 기억을 약하게 만들어 놓았다. 사건 이후의 잘못된 정보가 맞는지 확인할 정보가 기억 속에 줄어들어 있으면, 이 새 정보가 거부될 가능성은 더 낮다.","hl":["have degraded the original memory","reduced information"],"khl":["원래 기억을 약하게 만들어","줄어들어"],"blocks":[{"t":"pair","h":"원인과 결과 나란히","x":[["time and forgetting have degraded the original memory","원인: 시간과 망각이 원래 기억을 약하게 만듦"],["With reduced information available in memory","결과: 기억 속에 쓸 수 있는 정보가 줄어듦"]]},{"t":"p","h":"preserved(보존된)가 깨뜨리는 것","x":["preserved(보존된)를 넣으면 시간과 망각이 기억을 지켜 준 셈이 된다.","망각은 잊는 것이다. 지켜 줄 수 없다.","게다가 바로 다음 문장이 reduced information(줄어든 정보)이라고 말한다."]},{"t":"p","h":"함정","x":["later(나중의)는 subsequent(그 뒤의) 자리에, dismissed(묵살된)는 rejected(거부된) 자리에 그대로 써도 된다.","두 단어 모두 본문의 방향 그대로다."]}],"post":["degrade(약화시키다) ↔ preserve(보존하다)","시간 + 망각 → 원래 기억 약화"]}],"quiz":[{"w":"distant","m":"먼, 오래전의","it":[["remote","먼, 외딴","s"],["near","가까운","a"],["salty","짠","n"],["faraway","멀리 떨어진","s"],["brave","용감한","n"],["close","가까운","a"],["square","정사각형의","n"]]},{"w":"fit","m":"들어맞다, 일치하다","it":[["match","일치하다, 어울리다","s"],["sneeze","재채기하다","n"],["contradict","모순되다","a"],["suit","맞다, 어울리다","s"],["knit","뜨개질하다","n"],["conflict","상충하다","a"],["bake","굽다","n"]]},{"w":"explicit","m":"명시적인, 겉으로 드러난","it":[["hungry","배고픈","n"],["clear","분명한","s"],["implicit","암묵적인","a"],["wealthy","부유한","n"],["overt","공공연한, 드러난","s"],["vague","모호한","a"],["frozen","얼어붙은","n"]]},{"w":"differently","m":"다르게","it":[["otherwise","달리, 다르게","s"],["similarly","비슷하게","a"],["cheerfully","쾌활하게","n"],["dissimilarly","다르게","s"],["hourly","매시간","n"],["identically","똑같이","a"],["bravely","용감하게","n"]]},{"w":"degrade","m":"질을 떨어뜨리다, 약화시키다","it":[["weaken","약화시키다","s"],["invite","초대하다","n"],["improve","개선하다","a"],["erode","침식하다, 서서히 약화시키다","s"],["sweep","쓸다","n"],["enhance","향상시키다","a"],["arrest","체포하다","n"]]}]}],"no":"32"},{"id":"2311g2-33","title":"어휘특훈 · 23년 11월 고2 33번","sub":"상관관계는 분명하고 인과 관계는 흐리다","tpl":"Correlations are {powerful} because the insights they offer are {relatively} {clear}. These insights are often {covered_up} when we bring causality back into the picture. For instance, a used-car dealer {supplied} data to statisticians to {predict} which of the vehicles {available} for purchase at an auction were likely to have problems. A correlation analysis showed that orange-colored cars were far less likely to have {defects}. Even as we read this, we already think about why it might be so: Are orange-colored car owners likely to be car {enthusiasts} and take {better} care of their vehicles? Or, is it because orange-colored cars are more {noticeable} on the road and therefore less likely to be in accidents, so they’re in better condition when resold? Quickly we are {caught_in} a web of {competing} causal hypotheses. But our attempts to {illuminate} things this way only make them {cloudier}. Correlations exist; we can show them {mathematically}. We can’t {easily} do the same for causal links. So we would do well to {hold_off_from} trying to explain the reason behind the correlations.","fn":["*correlation: 상관관계","*causality: 인과 관계","*auction: 경매","*resell: 되팔다 (resold는 과거분사형)","*hypothesis: 가설 (hypotheses는 복수형)"],"mean":{"powerful":"강력한","weak":"약한","relatively":"비교적","comparatively":"비교적","clear":"분명한","vague":"모호한","covered up":"동사 cover up(가리다, 덮어 감추다)의 과거분사형. 가려진","hidden":"동사 hide(숨기다)의 과거분사형. 숨겨진","revealed":"동사 reveal(드러내다)의 과거분사형. 드러난","supplied":"동사 supply(제공하다)의 과거형","provided":"동사 provide(제공하다)의 과거형","denied":"동사 deny(주지 않다, 거부하다)의 과거형","predict":"예측하다","forecast":"예측하다, 예보하다","available":"구할 수 있는, 이용할 수 있는","defects":"명사 defect(결함)의 복수형","flaws":"명사 flaw(결점, 흠)의 복수형","advantages":"명사 advantage(장점)의 복수형","enthusiasts":"명사 enthusiast(애호가, 열성 팬)의 복수형","lovers":"명사 lover(애호가, 좋아하는 사람)의 복수형","better":"형용사 good(좋은)의 비교급. 더 좋은","worse":"형용사 bad(나쁜)의 비교급. 더 나쁜","noticeable":"눈에 띄는","visible":"눈에 보이는","inconspicuous":"눈에 잘 띄지 않는","caught in":"동사 catch(잡다)의 과거분사형 + in. ~에 걸려든, ~에 갇힌","freed from":"동사 free(풀어 주다)의 과거분사형 + from. ~에서 풀려난","competing":"동사 compete(경쟁하다)의 -ing형. 서로 경쟁하는","rival":"경쟁하는, 맞서는","identical":"똑같은, 동일한","illuminate":"밝히다, 분명히 설명하다","clarify":"분명히 하다","obscure":"흐리게 하다, 모호하게 하다","cloudier":"형용사 cloudy(흐린, 불분명한)의 비교급. 더 흐린","clearer":"형용사 clear(분명한)의 비교급. 더 분명한","mathematically":"수학적으로","easily":"쉽게","readily":"손쉽게","hold off from":"~을 미루다, ~을 삼가다","refrain from":"~을 삼가다","persist in":"~을 끈질기게 계속하다, ~을 고집하다"},"comp":[{"no":"33","slots":[["supplied","denied","a"],["predict"],["defects"],["enthusiasts"],["noticeable"]],"opts":["supplied","deleted","concealed","lost"],"or":["supplied(제공했다): 데이터를 받아야 통계학자들이 분석하고 다음 문장의 분석 결과가 나오므로 맞음.","deleted(삭제했다): 데이터를 지웠다면 바로 뒤 A correlation analysis showed(상관관계 분석 결과가 나왔다)가 나올 수 없음.","concealed(숨겼다): 숨긴 데이터로는 예측도 분석도 할 수 없음.","lost(잃어버렸다): 잃어버린 데이터로 주황색 차의 결과를 얻을 수는 없음."],"om":["제공했다","삭제했다","숨겼다","잃어버렸다"],"en":"For instance, a used-car dealer supplied data to statisticians to predict which of the vehicles available for purchase at an auction were likely to have problems. A correlation analysis showed that orange-colored cars were far less likely to have defects.","ko":"예를 들어, 한 중고차 판매업자가 경매에서 구입할 수 있는 차량 중 어떤 차에 문제가 생길 가능성이 높은지 예측하려고 통계학자들에게 데이터를 제공했다. 상관관계 분석 결과, 주황색 차는 결함이 있을 가능성이 훨씬 낮았다.","hl":["supplied data to statisticians","A correlation analysis showed"],"khl":["통계학자들에게 데이터를 제공했다","상관관계 분석 결과"],"blocks":[{"t":"p","h":"denied(주지 않았다)를 넣으면","x":["판매업자가 통계학자들에게 데이터를 주지 않았다는 말이 된다.","그런데 바로 다음 문장에 A correlation analysis showed(상관관계 분석 결과가 나왔다)가 온다.","데이터가 없으면 분석도 없다."]},{"t":"flow","h":"예시가 굴러가는 순서","x":["판매업자가 데이터 제공","통계학자들이 분석","주황색 차는 결함이 적다는 결과","우리는 곧장 이유를 궁금해함"],"at":0}],"post":["supply(제공하다) ↔ deny(주지 않다)","데이터 제공 → 분석 → 주황색 차 결과"]},{"no":"33","slots":[["covered_up"],["available"],["better"],["caught_in","freed from","a"],["hold_off_from","refrain from","s"]],"opts":["caught_in","satisfied_with","bored_with","protected_from"],"or":["caught in(~에 걸려든): web(그물)과 짝을 이뤄 가설 속에서 빠져나오지 못하는 모습이라 맞음.","satisfied with(~에 만족한): 바로 뒤 But(하지만) 문장이 시도가 더 흐리게 만들 뿐이라고 해서 만족과 부딪침.","bored with(~에 싫증 난): 우리는 이유가 궁금해 가설을 쏟아내는 중이라 싫증과 반대임.","protected from(~로부터 보호받는): 가설의 그물에서 보호받는다면 혼란에 빠질 일이 없음."],"om":["~에 걸려든","~에 만족한","~에 싫증 난","~로부터 보호받는"],"en":"Quickly we are caught in a web of competing causal hypotheses. But our attempts to illuminate things this way only make them cloudier.","ko":"우리는 금세 서로 경쟁하는 인과 가설들의 그물에 걸려든다. 하지만 이런 식으로 상황을 밝혀 보려는 우리의 시도는 오히려 더 흐리게 만들 뿐이다.","hl":["caught in a web","only make them cloudier"],"khl":["그물에 걸려든다","더 흐리게 만들 뿐이다"],"blocks":[{"t":"p","h":"web(그물)과 짝을 이루는 말","x":["web(그물)은 걸려들면 빠져나오기 어려운 것이다.","가설이 하나둘 생기면서 우리는 그 그물에 걸린다.","freed from(~에서 풀려난)을 넣으면 가설이 쏟아지자마자 빠져나온 셈이다.","바로 뒤 But(하지만) 문장은 더 흐려질 뿐이라고 하니 앞뒤가 안 맞는다."]},{"t":"p","h":"함정","x":["refrain from(~을 삼가다)은 hold off from(~을 미루다) 자리에 넣어도 같은 결론이 된다."]}],"post":["caught in(~에 걸려든) ↔ freed from(~에서 풀려난)","가설의 그물에 걸려 버린 우리"]}],"compquiz":[{"w":"supply","m":"제공하다","it":[["provide","제공하다","s"],["sneeze","재채 ats can fly, which is why they can escape from danger much faster.","ko":"그것은 박쥐가 왜 30살까지 살 수 있는지를 설명해 준다. 쥐와 대조적으로 박쥐는 날 수 있고, 그래서 위험에서 훨씬 더 빨리 벗어날 수 있다.","hl":["That explains why","which is why"],"khl":["설명해 준다","그래서"],"blocks":[{"t":"flow","h":"원리에서 사례로","x":["원리: 야생에서 버티는 시간이 수명을 정함","That(그것) = 이 원리","박쥐가 30년 사는 이유를 풀어 줌","날개 → 빠른 탈출, 먼 이동, 먹이 찾기"],"at":2},{"t":"p","h":"obscures(흐리게 한다)를 넣으면","x":["\"그 원리가 박쥐가 오래 사는 이유를 흐리게 한다\"가 된다.","그런데 뒤 문장들은 이유를 하나씩 또렷하게 보여 준다.","원리와 사례가 서로 싸우는 글이 되어 버린다."]}],"post":["explain(설명하다) ↔ obscure(흐리게 하다)","원리 하나로 박쥐 30년이 풀림"]},{"slots":[["In_contrast_to","Unlike","s"],["faster"],["cover","travel","s"],["useful","harmful","a"],["flee"]],"opts":["useful","risky","pointless","costly"],"or":["useful(쓸모 있는): 오래 살게 해 주는 변화가 박쥐에게 이득이었다는 뜻이라 because(~때문에) 뒤 장점들과 맞음.","risky(위험한): 박쥐는 위험을 잘 피하니 오래 사는 변화가 위험할 이유가 없음.","pointless(무의미한): 박쥐는 오래 버틸 수 있으니 오래 사는 몸이 오히려 의미가 있음.","costly(손해가 큰): 뒤의 because(~때문에)절은 장점만 늘어놓아 손해라는 말과 부딪침."],"om":["쓸모 있는","위험한","무의미한","손해가 큰"],"en":"Every genetic change in the past that made it possible for a bat to live longer was useful, because bats are much better able than mice to flee from danger, find food, and survive.","ko":"박쥐가 더 오래 살 수 있게 해 준 과거의 모든 유전적 변화는 쓸모가 있었다. 박쥐는 쥐보다 위험에서 달아나고, 먹이를 찾고, 살아남는 일을 훨씬 더 잘하기 때문이다.","hl":["was useful","because bats are much better able"],"khl":["쓸모가 있었다","훨씬 더 잘하기 때문이다"],"blocks":[{"t":"p","h":"쥐와 거꾸로 생각해 보기","x":["쥐에게 오래 사는 몸은 쓸 데가 없었다.","어차피 2년 안에 잡아먹히니까.","박쥐는 다르다.","실제로 오래 버티니, 오래 사는 몸이 진짜로 쓸모가 있다."]},{"t":"p","h":"because(~때문에) 뒤를 보면 답이 보인다","x":["because(~때문에) 뒤에는 달아나기, 먹이 찾기, 살아남기, 장점만 나온다.","장점이 이유인데 결과가 harmful(해로운)일 수는 없다.","Unlike(~와 달리)는 In contrast to(~와 대조적으로)와, travel(이동하다)은 cover(가다)와 같은 뜻이라 맞는 표현."]}],"post":["useful(쓸모 있는) ↔ harmful(해로운)","오래 버티는 동물에게만 오래 사는 몸이 쓸모 있음"]}],"quiz":[{"w":"predator","m":"포식자","it":[["hunter","사냥꾼","s"],["blanket","담요","n"],["prey","먹잇감","a"],["mirror","거울","n"],["killer","죽이는 동물, 살해자","s"],["victim","희생물","a"],["ladder","사다리  cognitive skills, until the mid-twenties.","ko":"인간의 뇌가 신경해부학적으로나 인지 능력 면에서나 20대 중반까지 계속 발달하기 때문에","hl":["continues to develop","until the mid-twenties"],"khl":["계속 발달하기 때문에","20대 중반까지"],"blocks":[{"t":"p","h":"until(~까지)과 어울리는 동사","x":["until the mid-twenties(20대 중반까지)는 그때까지 쭉 이어진다는 말이다.","continue(계속하다)와 짝이 맞는다.","ceases(멈춘다)를 넣으면 \"20대 중반까지 발달을 멈춘다\"가 된다.","멈춘 상태가 20대 중반에 끝난다는 이상한 말이다."]},{"t":"p","h":"원인과 결과","x":["원인: 뇌가 20대 중반까지 자란다.","결과: 성격은 그 뒤인 서른 무렵에야 자리 잡는다.","뇌가 멈춰 있다면 성격이 늦게 굳을 이유가 없다."]}],"post":["continue(계속하다) ↔ cease(멈추다)","뇌가 20대 중반까지 자람 → 성격은 서른 무렵에"]},{"slots":[["stabilize","settle","s"],["regardless_of","irrespective of","s"],["develop"],["advantage"],["optimistic","pessimistic","a"]],"opts":["optimistic","nervous","curious","confused"],"or":["optimistic(낙관적인): 성격이 서른까지 자리 잡는 중이니 가르칠 기회가 더 길어 희망적이라 맞음.","nervous(불안한): 기회가 늘었다는 좋은 소식 앞에서 더 불안할 이유가 없음.","curious(궁금한): 이 문장은 장점을 말하는 자리라 궁금증과 연결되지 않음.","confused(혼란스러운): 새 연구로 오히려 더 분명해졌으니 혼란스럽다는 말과 반대임."],"om":["낙관적인","불안한","궁금한","혼란스러운"],"en":"The advantage of this new understanding is that we can be a bit more optimistic than Aristotle and Freud about being able to teach moral excellence.","ko":"이 새로운 이해의 장점은, 도덕적 탁월함을 가르칠 수 있다는 점에 대해 우리가 아리스토텔레스와 프로이트보다 조금 더 낙관적일 수 있다는 것이다.","hl":["more optimistic than Aristotle and Freud","The advantage"],"khl":["프로이트보다 조금 더 낙관적일","장점"],"blocks":[{"t":"tap","h":"한 줄 요약 복원","q":"성격이 다섯 살이 아니라 서른 무렵에 굳는다면, 가르치는 사람에게 좋은 소식일까 나쁜 소식일까?","a":["좋은 소식이다.","가르칠 시간이 25년이나 더 생긴다.","그래서 Aristotle(아리스토텔레스)과 Freud(프로이트)보다 더 희망을 가질 수 있다."]},{"t":"p","h":"pessimistic(비관적인)이 틀린 이유","x":["문장 머리가 The advantage(장점)다.","장점을 말하면서 더 비관적이 된다는 건 앞뒤가 안 맞는다.","settle(자리를 잡다)은 stabilize(안정되다)와, irrespective of(~와 관계없이)는 regardless of(~와 상관없이)와 같은 뜻이다."]}],"post":["optimistic(낙관적인) ↔ pessimistic(비관적인)","성격이 늦게 굳음 = 가르칠 시간이 더 있음"]}],"quiz":[{"w":"recent","m":"최근의","it":[["new","새로운","s"],["polite","공손한","n"],["old","오래된","a"],["latest","최신의","s"],["generous","너그러운","n"],["outdated","구식의","a"],["wooden","나무로 된","n"]]},{"w":"early","m":"이른, 일찍","it":[["honest","정직한","n"],["initial","초기의","s"],["late","늦은","a"],["crowded","붐비는","n"],["first","처음의","s"],["delayed","늦어진","a"],["purple","보라색의","n"]]},{"w":"wrong","m":"틀린","it":[["mistaken","잘못 생각한","s"],["hungry","배고픈","n"],["right","옳은","a"],["distant","먼","n"],["incorrect","틀린","s"],["correct","맞는","a"],["noisy","시끄러운","n"]]},{"w":"continue","m":"계속하다","it":[["apologize","사과하다","n"],["carry on","계속하다","s"],["cease","멈추다","a"],["invite","초대하다","n"],["go on","계속하다","s"],["stop","멈추다","a"],["measure","측정하다","n"]]},{"w":"optimistic","m":"낙관적인","it":[["hopeful","희망적인","s"],["rusty","녹슨","n"],["pessimistic","비관적인","a"],["punctual","시간을 잘 지키는","n"],["positive","긍정적인","s"],["gloomy","우울한, 비관적인","a"],["sandy","모래가 많은","n"]]}]}],"no":"35"},{"id":"2311g2-36","title":"어휘특훈 · 23년 11월 고2 36번","sub":"작아지는 동물과 더위","tpl":"The size of a species is not {accidental}. It’s a fine-tuned {interaction} between a species and the world it {inhabits}. Over large periods of time, size {fluctuations} have often {signalled} {significant} changes in the environment. Generally speaking, over the last five hundred million years, the trend has been towards animals getting {larger}. It’s particularly {notable} in marine animals, whose average body size has {increased} 150-fold in this time. But we are beginning to see {changes} in this trend. Scientists have {discovered} that many animals are {shrinking}. Around the world, species in every category have been found to be getting {smaller}, and one {major} cause appears to be the heat. Animals living in the Italian Alps, for example, have seen temperatures {rise} by three to four degrees Celsius since the 1980s. To {avoid} overheating, chamois goats now spend more of their days {resting} rather than searching for food, and as a result, in just a few decades, the new generations of chamois are 25 percent smaller.","fn":["*fine-tuned: 미세하게 조정된","*-fold: ~배","*chamois: 샤무아(알프스에 사는 산양)"],"mean" t-field camera, which {captures} not just a single plane of light, as with {conventional} cameras, but rays from the {entire} light field, some 11 million of them. The photographers can decide {later} which element of an image to focus on in the digital file. There is no need to focus at the beginning, since {collecting} all the information makes it possible to do that afterwards. Because rays from the entire light field are {included}, it is closer to all the data. As a result, the information is more “reuseable” than {ordinary} pictures, where the photographer has to decide what to focus on {before} she presses the shutter.","fn":["*random sampling: 무작위 표본 추출","*dataset: 데이터 묶음","*light-field camera: 라이트 필드 카메라(빛이 들어오는 방향까지 기록하는 카메라)","*ray: 광선"],"mean":{"shortcut":"지름길, 손쉬운 방법","obstacle":"장애물","possible":"가능한","feasible":"실현 가능한","impractical":"비현실적인, 실행하기 어려운","smaller":"형용사 small(작은)의 비교급, 더 작은","larger":"형용사 large(큰)의 비교급, 더 큰","loss":"손실, 잃음","lost":"동사 lose(잃다)의 과거분사형","gained":"동사 gain(얻다)의 과거분사형","full":"전체의, 완전한","complete":"완전한, 전부 갖춘","partial":"부분적인","freedom":"자유","room":"여지, 공간","flexibility":"융통성, 유연성","different":"다른, 여러 가지의","various":"다양한","identical":"똑같은, 동일한","fitting":"적절한, 꼭 맞는","suitable":"알맞은, 적합한","captures":"동사 capture(포착하다, 담아내다)의 3인칭 단수형","records":"동사 record(기록하다)의 3인칭 단수형","misses":"동사 miss(놓치다)의 3인칭 단수형","conventional":"기존의, 전통적인","traditional":"전통적인","innovative":"혁신적인","entire":"전체의","whole":"전체의, 온전한","later":"나중에","beforehand":"미리, 사전에","collecting":"동사 collect(모으다)의 -ing형(동명사)","gathering":"동사 gather(모으다)의 -ing형(동명사)","discarding":"동사 discard(버리다)의 -ing형(동명사)","included":"동사 include(포함하다)의 과거분사형","excluded":"동사 exclude(제외하다)의 과거분사형","ordinary":"평범한, 보통의","typical":"전형적인, 보통의","before":"~하기 전에","after":"~한 후에"},"comp":[{"no":"37","slots":[["shortcut"],["lost"],["different","identical","a"],["conventional"],["before"]],"opts":["different","narrow","fixed","familiar"],"or":["different(여러 가지의): 앞의 freedom to explore(탐색할 자유)와 이어져 여 .","excluded(제외되다)를 넣으면 \"전체 빛이 빠졌으니 모든 데이터에 가깝다\"가 된다.","재료를 다 빼놓고 재료가 풍부하다고 하는 셈이다."]},{"t":"p","h":"함정","x":["records(기록하다)는 captures(담아내다) 자리에 넣어도 카메라가 빛을 저장한다는 뜻 그대로다."]}],"post":["include(포함하다) ↔ exclude(제외하다)","빛 전체 포함 = 모든 데이터에 가까움"]},{"slots":[["smaller"],["full"],["different"],["later","beforehand","a"],["collecting"]],"opts":["later","rarely","earlier","alone"],"or":["later(나중에): 다음 문장 afterwards(나중에)와 같은 말이라 맞음.","rarely(좀처럼 ~않게): 결정을 거의 안 한다는 뜻이 되어 초점 선택이라는 장점이 사라짐.","earlier(더 일찍): 다음 문장 no need to focus at the beginning(처음에 초점을 맞출 필요가 없다)과 정반대라 틀림.","alone(혼자서): 혼자냐 아니냐는 글과 상관이 없음."],"om":["나중에","좀처럼 ~않게","더 일찍","혼자서"],"en":"The photographers can decide later which element of an image to focus on in the digital file. There is no need to focus at the beginning, since collecting all the information makes it possible to do that afterwards.","ko":"사진가들은 이미지의 어느 요소에 초점을 맞출지를 디지털 파일에서 나중에 결정할 수 있다. 처음부터 초점을 맞출 필요가 없는데, 모든 정보를 모아 두면 나중에 그것을 하는 것이 가능하기 때문이다.","hl":["can decide later","no need to focus at the beginning"],"khl":["나중에 결정할 수 있다","처음부터 초점을 맞출 필요가 없는데"],"blocks":[{"t":"pair","h":"같은 말 찾기","x":[["decide later","나중에 결정하다"],["no need to focus at the beginning","처음부터 초점을 맞출 필요가 없다"],["do that afterwards","그것을 나중에 하다"]]},{"t":"p","h":"beforehand(미리)가 튀는 이유","x":["세 표현이 모두 \"나중에 해도 된다\"는 뜻이다.","beforehand(미리)만 \"처음에 정해야 한다\"는 반대편에 선다.","미리 정해야 하는 건 마지막 문장의 평범한 카메라 쪽이다."]}],"post":["later(나중에) ↔ beforehand(미리)","찍고 나서 초점 고르기"]},{"slots":[["full","complete","s"],["freedom"],["collecting","gathering","s"],["included"],["before","after","a"]],"opts":["before","because","unless","although"],"or":["before(~하기 전에): 평범한 사진은 셔터를 누르기 전에 초점을 정해야 해서 맞음.","because(~ 때문에): 셔터를 눌렀기 때문에 초점을 정한다는 건 순서 이야기가 아니라 흐름과 안 맞음.","unless(~하지 않는 한): 셔터를 누르지 않는 한 초점을 정해야 한다는 말은 의미가 통하지 않음.","although(~이긴 하지만): 셔터를 누르긴 하지만 초점을 정해야 한다는 말은 앞뒤 연결이 안 됨."],"om":["~하기 전에","~ 때문에","~하지 않는 한","~이긴 하지만"],"en":"As a result, the information is more “reuseable” than ordinary pictures, where the photographer has to decide what to focus on before she presses the shutter.","ko":"그 결과 그 정보는, 사진가가 셔터를 누르기 전에 무엇에 초점을 맞출지 결정해야 하는 평범한 사진보다 더 ‘재사용이 가능’하다.","hl":["before she presses the shutter","more “reuseable” than ordinary pictures"],"khl":["셔터를 누르기 전에","더 ‘재사용이 가능’하다"],"blocks":[{"t":"p","h":"평범한 사진의 약점","x":["평범한 카메라는 찍기 전에 초점을 정해야 한다.","한 번 찍으면 초점을 바꿀 수 없다.","그래서 다시 쓰기 어렵다.","after(~한 후에)를 넣으면 평범한 사진도 찍고 나서 초점을 고르는 셈이다.","그러면 라이트 필드 카메라와 다를 게 없어 비교가 무너진다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","complete(완전한)는 full(전체의)과, gathering(모으기)은 collecting(모으기)과 같은 뜻이다.","고칠 단어는 하나뿐."]}],"post":["before(~하기 전에) ↔ after(~한 후에)","평범한 사진 = 찍기 전에 초점 확정"]}],"quiz":[{"w":"possible","m":"가능한","it":[["feasible","실현 가능한","s"],["impossible","불가능한","a"],["greedy","욕심 많은","n"],["achievable","이룰 수 있는","s"],["unattainable","이룰 수 없는","a"],["dusty","먼지투성이의","n"],["hollow","속이 빈","n"]]},{"w":"lose","m":"잃다","it":[["misplace","잘못 두어 잃어버리다","s"],["gain","얻다","a"],["knit","뜨개질하다","n"],["forfeit","몰수당하다, 잃다","s"],["find","찾다","a"],["yawn","하품하다","n"],["kneel","무릎 꿇다","n"]]},{"w":"include","m":"포함하다","it":[["contain","담고 있다","s"],["exclude","제외하다","a"],["whistle","휘파람 불다","n"],["incorporate","통합하다, 포함하다","s"],["omit","빠뜨리다","a"],["blink","눈을 깜박이다","n"],["sew","바느질하다","n"]]},{"w":"later","m":"나중에","it":[["afterward","그 후에","s"],["earlier","더 일찍","a"],["loudly","큰 소리로","n"],["subsequently","그 뒤에","s"],["beforehand","미리","a"],["kindly","친절하게","n"],["upstairs","위층에","n"]]},{"w":"before","m":"~하기 전에, ~ 앞에","it":[["prior to","~에 앞서","s"],["after","~ 후에","a"],["beneath","~ 아래에","n"],["ahead of","~보다 먼저","s"],["following","~ 후에","a"],["across","~을 가로질러","n"],["among","~ 사이에","n"]]}]}],"no":"37"},{"id":"2311g2-38","title":"어휘특훈 · 23년 11월 고2 38번","sub":"내향적인 리더와 서번트 리더십","tpl":"Introverted leaders do have to {overcome} the strong cultural {presumption} that extroverts are more {effective} leaders. Although the population splits into almost {equal} parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted. In a study done in 2006, 65 percent of senior corporate executives {viewed} introversion as a {barrier} to leadership. We must {reexamine} this {stereotype}, however, as it doesn’t always hold true. Regent University found that a {desire} to be of service to others and to {empower} them to grow, which is more {common} among introverts than extroverts, is a {key} factor in becoming a leader and {retaining} leadership. So-called servant leadership, dating back to ancient philosophical literature, {adheres_to} the belief that a company’s goals are best achieved by helping workers or customers achieve their goals. Such leaders do not {seek} attention but rather want to shine a light on others’ wins and achievements; servant leadership requires {humility}, but that humility {ultimately} {pays_off}.","fn":["*introvert: 내향적인 사람","*extrovert: 외향적인 사람","*servant leadership: 서번트 리더십(남을 섬기며 이끄는 리더십)"],"mean":{"overcome":"극복하다","reinforce":"강화하다","presumption":"추정, 억측","assumption":"가정, 추정","effective":"유능한, 효과적인","capable":"유능한, 능력 있는","ineffective":"무능한, 효과 없는","equal":"동등한, 같은","even":"고른, 균등한","unequal":"같지 않은, 불균등한","viewed":"동사 view(~을 …로 보다, 여기다)의 과거형","regarded":"동사 regard(~을 …로 여기다)의 과거형","barrier":"장애물","hindrance":"방해물, 장애","benefit":"이점, 도움","reexamine":"재검토하다","reconsider":"다시 생각하다, 재고하다","accept":"받아들이다","stereotype":"고정 관념","preconception":"선입견","desire":"열망, 바람","reluctance":"꺼림, 내키지 않음","empower":"힘을 주다, ~할 수 있게 하다","enable":"~할 수 있게 하다","common":"흔한, 일반적인","rare":"드문","key":"핵심적인, 중요한","crucial":"결정적인, 아주 중요한","minor":"사소한, 중요하지 않은","retaining":"동사 retain(유지하다)의 -ing형. 동명사","maintaining":"동사 maintain(유지하다)의 -ing형. 동명사","losing":"동사 lose(잃다)의 -ing형. 동명사","adheres to":"고수하다, 지키다(adhere to의 3인칭 단수형)","rejects":"동사 reject(거부하다)의 3인칭 단수형","seek":"추구하다, 찾다","pursue":"추구하다, 좇다","avoid":"피하다","humility":"겸손","arrogance":"오만","ultimately":"궁극적으로, 결국","eventually":"결국, 마침내","pays off":"결실을 맺다, 성과를 거두다(pay off의 3인칭 단수형)"},"comp":[{"no":"38","slots":[["viewed"],["barrier"],["reexamine","accept","a"],["stereotype"],["desire"]],"opts":["reexamine","embrace","trust","adopt"],"or":["reexamine(재검토하다): 고정 관념이 doesn’t always hold true(항상 맞지는 않다)라서 다시 따져 봐야 한다는 말이라 맞음.","embrace(기꺼이 받아들이다): 틀릴 때가 있는 고정 관념을 기꺼이 받아들이자는 건 이유와 정반대임.","trust(믿다): 항상 맞지는 않는다면서 믿자고 하면 as(~이기 때문에) 뒤의 이유와 부딪침.","adopt(채택하다): 틀린 고정 관념을 채택하자는 말이 되어 뒤에 나오는 반대 연구 결과와 이어지지 않음."],"om":["재검토하다","기꺼이 받아들이다","믿다","채택하다"],"en":"We must reexamine this stereotype, however, as it doesn’t always hold true.","ko":"하지만 이 고정 관념은 항상 맞는 것은 아니기 때문에 우리는 이것을 재검토해야 한다.","hl":["reexamine this stereotype","doesn’t always hold true"],"khl":["재검토해야","항상 맞는 것은 아니기"],"blocks":[{"t":"p","h":"as 뒤에 붙은 이유부터 읽기","x":["이유: 이 고정 관념은 항상 맞지는 않는다.","이유가 \"틀릴 때가 있다\"면 해야 할 일은 다시 따져 보기다.","accept(받아들이다)를 넣으면 \"틀릴 때가 있으니 받아들이자\"가 된다.","이유와 행동이 거꾸로 붙는다."]},{"t":"p","h":"however(하지만)가 꺾는 방향","x":["앞 두 문장은 \"리더는 외향적이어야 한다\"는 생각을 보여 준다.","however(하지만)로 글쓴이가 그 생각에 제동을 건다.","제동을 거는 말이 accept(받아들이다)일 수는 없다."]}],"post":["reexamine(재검토하다) ↔ accept(받아들이다)","틀릴 때가 있는 고정 관념 = 다시 따져 볼 대상"]},{"no":"38","slots":[["desire"],["empower"],["common"],["key","minor","a"],["seek","pursue","s"]],"opts":["key","trivial","marginal","negligible"],"or":["key(핵심적인): 연구가 찾아낸 \"리더가 되는 비결\"이라 핵심 요소여야 맞음.","trivial(하찮은): 하찮은 요소라면 고정 관념을 뒤집는 근거가 될 수 없음.","marginal(미미한): 미미한 요소를 굳이 연구 결과로 내세울 이유가 없음.","negligible(무시해도 될 정도의): 무시해도 되는 요소라면 뒤의 서번트 리더십 칭찬과 이어지지 않음."],"om":["핵심적인","하찮은","미미한","무시해도 될 정도의"],"en":"Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.","ko":"Regent 대학교는 남에게 도움이 되고 그들이 성장하도록 힘을 주려는 열망이 리더가 되고 리더십을 유지하는 데 핵심 요소이며, 이 열망은 외향적인 사람보다 내향적인 사람에게 더 흔하다는 것을 발견했다.","hl":["a key factor","more common among introverts"],"khl":["핵심 요소","내향적인 사람에게 더 흔하다"],"blocks":[{"t":"flow","h":"연구 결과가 맡은 역할","x":["고정 관념: 외향적인 사람이 리 ts":[["effective","capable","s"],["equal","unequal","a"],["viewed","regarded","s"],["reexamine"],["common"]],"opts":["equal","uneven","lopsided","unbalanced"],"or":["equal(동등한): 인구는 반반인데 관리자는 96%가 외향적이라는 대비가 생겨 맞음.","uneven(고르지 않은): 인구가 원래 한쪽으로 쏠려 있다면 Although(비록 ~이지만)의 대비가 사라짐.","lopsided(한쪽으로 치우친): 인구부터 치우쳐 있으면 96%라는 숫자가 놀랍지 않음.","unbalanced(불균형한): 인구 불균형이면 관리자 쏠림이 당연해져서 문장의 놀라움이 없어짐."],"om":["동등한","고르지 않은","한쪽으로 치우친","불균형한"],"en":"Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted.","ko":"인구는 내향적인 사람과 외향적인 사람으로 거의 똑같이 나뉘지만, 관리자와 임원의 96% 이상은 외향적이다.","hl":["almost equal parts","more than 96 percent"],"khl":["거의 똑같이 나뉘지만","96% 이상"],"blocks":[{"t":"pair","h":"숫자 두 개 나란히","x":[["the population splits into almost equal parts","인구: 내향 반, 외향 반"],["more than 96 percent of managers and executives are extroverted","관리자·임원: 거의 전부 외향"]]},{"t":"p","h":"Although(비록 ~이지만)가 만드는 놀라움","x":["반반인데 관리자는 거의 다 외향적이다.","이 차이가 바로 고정 관념이 얼마나 센지 보여 준다.","unequal(불균등한)을 넣으면 인구부터 한쪽으로 쏠린 셈이다.","그러면 관리자가 외향적인 게 당연해서 Although(비록 ~이지만)를 쓸 이유가 없다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["capable(유능한)은 effective(유능한) 자리에 그대로 들어간다.","regarded(여겼다)도 viewed(보았다)처럼 \"A를 B로 여기다\" 틀에 맞는다."]}],"post":["equal(동등한) ↔ unequal(불균등한)","인구는 반반, 관리자는 96% 외향"]},{"slots":[["barrier"],["stereotype","preconception","s"],["desire","reluctance","a"],["key"],["seek"]],"opts":["desire","refusal","hesitation","failure"],"or":["desire(열망): 남을 돕고 키우려는 마음이 리더의 핵심이라는 연구 결과라 맞음.","refusal(거절): 남을 돕기를 거절하는 마음이 리더의 핵심이라는 건 서번트 리더십 설명과 정반대임.","hesitation(망설임): 돕기를 망설이는 마음은 남의 성공을 비춰 주는 리더의 모습과 안 맞음.","failure(실패): 돕는 데 실패하는 것이 리더가 되는 핵심 요소일 수는 없음."],"om":["열망","거절","망설임","실패"],"en":"Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.","ko":"Regent 대학교는 남에게 도움이 되고 그들이 성장하도록 힘을 주려는 열망이 리더가 되고 리더십을 유지하는 데 핵심 요소이며, 이 열망은 외향적인 사람보다 내향적인 사람에게 더 흔하다는 것을 발견했다.","hl":["a desire to be of service to others","a key factor"],"khl":["남에게 도움이 되고","핵심 요소"],"blocks":[{"t":"p","h":"reluctance(꺼림)를 넣고 다시 읽기","x":["\"남을 돕기를 꺼리는 마음이 리더가 되는 핵심이다.\"","바로 뒤에서 글쓴이는 서번트 리더십을 칭찬한다.","서번트 리더는 남을 섬기고 돕는 리더다.","돕기를 꺼리는 마음과는 정반대다."]},{"t":"tap","h":"질문 하나","q":"servant(섬기는 사람) 리더가 가장 먼저 가져야 할 마음은?","a":["남을 돕고 싶은 마음.","그 마음이 바로 a desire to be of service(도움이 되고 싶은 열망)다."]},{"t":"p","h":"함정","x":["preconception(선입견)은 stereotype(고정 관념)과 같은 쪽 단어다.","미리 정해 둔 생각이라는 뜻이라 this(이)와 붙여도 자연스럽다."]}],"post":["desire(열망) ↔ reluctance(꺼림)","남을 돕고 키우려는 마음 = 리더의 출발점"]},{"slots":[["empower"],["retaining"],["adheres_to","rejects","a"],["humility"],["ultimately"]],"opts":["adheres_to","opposes","denies","abandons"],"or":["adheres to(고수하다): 남을 도와야 회사 목표도 이룬다는 믿음이 서번트 리더십의 핵심이라 맞음.","opposes(반대하다): 서번트(섬기는) 리더십이 섬기기를 반대한다는 모순이 생김.","denies(부인하다): 남을 돕는 길을 부인하면 뒤 문장의 남의 성공을 비춰 주는 리더와 부딪침.","abandons(버리다): 그 믿음을 버린다면 이름부터 servant(섬기는)일 이유가 없음."],"om":["고수하다","반대하다","부인하다","버리다"],"en":"So-called servant leadership, dating back to ancient philosophical literature, adheres to the belief that a company’s goals are best achieved by helping workers or customers achieve their goals.","ko":"고대 철학 문헌으로 거슬러 올라가는 이른바 서번트 리더십은 회사의 목표는 직원이나 고객이 자신의 목표를 이루도록 도울 때 가장 잘 이루어진다는 믿음을 고수한다.","hl":["adheres to the belief","by helping workers or customers achieve their goals"],"khl":["믿음을 고수한다","직원이나 고객이 자신의 목표를 이루도록 도울 때"],"blocks":[{"t":"p","h":"이름이 정해 주는 믿음","x":["servant(섬기는 사람) 리더십.","이름부터 남을 섬기는 리더다.","그 믿음: 직원과 고객을 도우면 회사 목표도 이루어진다.","rejects(거부하다)를 넣으면 섬기는 리더십이 섬기기를 거부하는 셈이다."]},{"t":"p","h":"뒷문장이 한 번 더 확인","x":["Such leaders(그런 리더들)는 남의 성공에 빛을 비춰 주고 싶어 한다.","남을 돕는 믿음을 지키고 있어야 나올 수 있는 행동이다."]}],"post":["adhere to(고수하다) ↔ reject(거부하다)","직원·고객을 도움 = 회사 목표 달성"]},{"slots":[["presumption","assumption","s"],["viewed"],["retaining","maintaining","s"],["seek"],["humility","arrogance","a"]],"opts":["humility","pride","vanity","conceit"],"or":["humility(겸손): 뒤의 that humility(그 겸손)가 같은 말을 다시 받고, 관심을 원하지 않는 리더와 맞음.","pride(자만): 자기 자랑을 하는 마음이라 관심을 추구하지 않는 리더와 안 맞음.","vanity(허영심): 남에게 잘 보이고 싶은 마음이라 남의 성공을 비춰 주는 리더와 정반대임.","conceit(자만심): 자기를 높이는 마음이라 바로 뒤 that humility(그 겸손)와 부딪침."],"om":["겸손","자만","허영심","자만심"],"en":"Such leaders do not seek attention but rather want to shine a light on others’ wins and achievements; servant leadership requires humility, but that humility ultimately pays off.","ko":"그런 리더들은 관심을 추구하지 않고 오히려 다른 사람들의 승리와 성취에 빛을 비춰 주고 싶어 한다. 서번트 리더십은 겸손을 필요로 하지만, 그 겸손은 결국 결실을 맺는다.","hl":["requires humility","that humility ultimately pays off","do not seek attention"],"khl":["겸손을 필요로 하지만","그 겸손은 결국 결실을 맺는다","관심을 추구하지 않고"],"blocks":[{"t":"p","h":"that(그)이 가리키는 말","x":["that humility(그 겸손)는 바로 앞에 나온 말을 다시 받는다.","앞이 arrogance(오만)이면 \"오만을 필요로 하지만, 그 겸손은…\"이 된다.","가리킬 대상이 사라진다."]},{"t":"p","h":"앞 절과 연결","x":["관심을 원하지 않는다.","남의 성공을 비춰 준다.","이런 리더에게 어울리는 말은 겸손이다.","오만한 사람은 스포트라이트를 자기 쪽으로 돌린다."]},{"t":"p","h":"함정","x":["assumption(가정, 추정)은 presumption(추정)과 같은 뜻이다.","maintaining(유지하기)은 retaining(유지하기)과 같은 뜻이다.","둘 다 고치면 안 된다."]}],"post":["humility(겸손) ↔ arrogance(오만)","스포트라이트를 남에게 돌리는 리더"]}],"quiz":[{"w":"overcome","m":"극복하다","it":[["borrow","빌리다","n"],["conquer","정복하다, 이겨 내다","s"],["succumb","굴복하다","a"],["decorate","장식하다","n"],["surmount","극복하다","s"],["surrender","항복하다","a"],["whisper","속삭이다","n"]]},{"w":"equal","m":"동등한, 같은","it":[["equivalent","동등한","s"],["frozen","얼어붙은","n"],["unequal","같지 않은","a"],["polite","공손한","n"],["even","고른, 균등한","s"],["uneven","고르지 않은","a"],["thirsty","목마른","n"]]},{"w":"desire","m":"열망, 바람","it":[["ladder","사다리","n"],["reluctance","꺼림","a"],["wish","바람","s"],["harvest","수확","n"],["aversion","혐오, 싫어함","a"],["longing","갈망","s"],["invoice","청구서","n"]]},{"w":"adhere to","m":"고수하다, 지키다","it":[["stick to","고수하다","s"],["take after","닮다","n"],["reject","거부하다","a"],["run out of","다 떨어지다","n"],["abide by","지키다, 따르다","s"],["deviate from","벗어나다","a"],["put o troverts, is a key factor in becoming a leader and retaining leadership.","ko":"Regent 대학교는 남에게 도움이 되고 그들이 성장하도록 힘을 주려는 열망이 리더가 되고 리더십을 유지하는 데 핵심 요소이며, 이 열망은 외향적인 사람보다 내향적인 사람에게 더 흔하다는 것을 발견했다.","hl":["more common among introverts than extroverts","a key factor"],"khl":["내향적인 사람에게 더 흔하다","핵심 요소"],"blocks":[{"t":"p","h":"이 연구는 누구 편인가","x":["글쓴이는 바로 앞에서 고정 관념을 다시 따져 보자고 했다.","그 뒤에 나오는 연구는 내향적인 리더 편을 들어야 한다.","리더의 핵심 마음이 내향적인 사람에게 더 흔하다 → 내향적인 사람도 좋은 리더.","rare(드문)를 넣으면 그 마음이 내향적인 사람에게 더 드물다는 말이 된다.","연구가 갑자기 고정 관념 편을 들게 된다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["reconsider(다시 생각하다)는 reexamine(재검토하다)과 같은 방향이다.","enable them to grow(그들이 성장할 수 있게 하다)는 empower them to grow(그들이 성장하도록 힘을 주다)와 뜻이 통한다.","enable(~할 수 있게 하다)도 \"목적어 + to부정사\" 틀을 쓴다."]}],"post":["common(흔한) ↔ rare(드문)","리더의 핵심 마음 = 내향적인 사람에게 더 흔함"]},{"slots":[["equal","even","s"],["key"],["seek","avoid","a"],["humility"],["pays_off"]],"opts":["seek","shun","dodge","refuse"],"or":["seek(추구하다): 관심을 좇지 않고 오히려 남을 비춰 준다는 대비가 맞음.","shun(피하다): \"관심을 피하지 않고 오히려 남을 비춘다\"가 되어 but rather(오히려)의 대비가 깨짐.","dodge(피하다): 관심을 피하지 않는다면 겸손한 리더의 모습과 반대가 됨.","refuse(거절하다): 관심을 거절하지 않는다는 말이라 뒤의 humility(겸손)와 이어지지 않음."],"om":["추구하다","피하다","(교묘히) 피하다","거절하다"],"en":"Such leaders do not seek attention but rather want to shine a light on others’ wins and achievements","ko":"그런 리더들은 관심을 추구하지 않고 오히려 다른 사람들의 승리와 성취에 빛을 비춰 주고 싶어 한다","hl":["do not seek attention","but rather"],"khl":["관심을 추구하지 않고","오히려"],"blocks":[{"t":"pair","h":"not A but rather B(A가 아니라 오히려 B)","x":[["do not seek attention","A: 자기에게 쏠리는 관심을 좇지 않음"],["want to shine a light on others’ wins","B: 남의 성공에 조명을 비춰 줌"]]},{"t":"p","h":"조명의 방향","x":["A와 B는 조명을 어디로 비추느냐의 대비다.","나에게 비추기 대신 남에게 비추기.","avoid(피하다)를 넣으면 \"관심을 피하지 않는다\"가 된다.","관심을 즐긴다는 말이라 B와 짝이 맞지 않는다."]},{"t":"p","h":"함정","x":["even(고른, 균등한)은 equal(동등한) 자리에 써도 된다.","almost even parts(거의 고른 몫)도 반반이라는 뜻이다."]}],"post":["seek(추구하다) ↔ avoid(피하다)","조명은 내가 아니라 남에게"]},{"slots":[["presumption"],["effective","ineffective","a"],["equal" , in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement. And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.","ko":"불과 반세기 뒤인 1920년대에 양자역학의 발견은 빠짐없고 완벽한 측정이라는 꿈을 영원히 깨 버렸다. 그런데도 비교적 소수의 물리학자 집단을 제외하면, 흠 없이 측정하려는 인류의 욕구라는 사고방식은 공학자와 과학자 사이에서 계속되었다.","hl":["forever destroyed the dream","And yet"],"khl":["영원히 깨 버렸다","그런데도"],"blocks":[{"t":"p","h":"And yet(그런데도)에서 거꾸로 읽기","x":["And yet(그런데도) 뒤: 사람들은 계속 완벽한 측정을 좇았다.","\"그런데도\"가 붙으려면 앞에 \"그 꿈은 끝났다\"가 있어야 한다.","fulfilled(실현했다)를 넣으면 꿈이 이루어진 셈이다.","이룬 꿈을 계속 좇는 건 \"그런데도\"가 아니다."]},{"t":"p","h":"forever(영원히)도 힌트","x":["forever destroyed(영원히 깨 버렸다).","다시는 되돌릴 수 없다는 말이다.","꿈을 영원히 이루었다는 표현은 어색하다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["devised(고안했다)는 developed(개발했다) 자리에 자연스럽다.","comparatively(비교적)는 relatively(비교적)와 같은 뜻이다."]}],"post":["destroy(파괴하다) ↔ fulfill(실현하다)","양자역학 = 완벽한 측정의 꿈을 깬 발견"]},{"slots":[["capture"],["continued","ceased","a"],["influence","affect","s"],["contrary_to"],["relaxing"]],"opts":["continued","vanished","disappeared","stopped"],"or":["continued(계속되었다): 꿈이 깨졌는데도 공학자·과학자들은 그 사고방식을 이어 갔다는 말이라 맞음.","vanished(사라졌다): 사라졌다면 다음 문장에서 그것이 even expanded(심지어 확장되었다)일 수 없음.","disappeared(없어졌다): 없어진 것이 기업 세계에서 커졌다는 건 모순임.","stopped(멈췄다): 멈췄다면 outside(~을 제외하고) 물리학자라고 굳이 나눌 이유가 없음."],"om":["계속되었다","사라졌다","없어졌다","멈췄다"],"en":"the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists. In the world of business it even expanded","ko":"흠 없이 측정하려는 인류의 욕구라는 사고방식은 공학자와 과학자 사이에서 계속되었다. 기업 세계에서는 그것이 심지어 확장되었다","hl":["continued among engineers and scientists","it even expanded"],"khl":["계속되었다","심지어 확장되었다"],"blocks":[{"t":"pair","h":"두 문장 나란히","x":[["continued among engineers and scientists","공학자·과학자 사이에서 계속됨"],["In the world of business it even expanded","기업 세계에서는 심지어 커짐"]]},{"t":"p","h":"even(심지어)이 하는 일","x":["even(심지어)은 앞보다 한 걸음 더 ":"부정확성, 즉 엉성함을 허용하는 것이 단점이 아니라 긍정적인 특징일 수 있다.","hl":["a positive feature, not a shortcoming"],"khl":["단점이 아니라 긍정적인 특징"],"blocks":[{"t":"pair","h":"A, not B(B가 아니라 A)","x":[["a positive feature","A: 긍정적인 특징"],["not a shortcoming","B: 단점이 아님"]]},{"t":"p","h":"맞서는 두 말","x":["not(~이 아니라)으로 이어진 두 말은 서로 반대여야 한다.","positive(긍정적인)의 반대는 단점 쪽이다.","strength(강점)를 넣으면 \"긍정적인 특징이지 강점이 아니다\"가 된다.","같은 편끼리 싸우는 문장이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","accept(받아들이다)는 adopt(채택하다) 자리에서 \"기준을 받아들이다\"로 통한다.","inaccuracy(부정확함)는 imprecision(부정확성)과 같은 뜻이다."]}],"post":["shortcoming(단점) ↔ strength(강점)","엉성함 = 단점 아닌 장점일 수도"]}],"quiz":[{"w":"precisely","m":"정밀하게, 정확하게","it":[["bravely","용감하게","n"],["exactly","정확하게","s"],["roughly","대략","a"],["secretly","몰래","n"],["accurately","정확하게","s"],["approximately","대략","a"],["politely","공손하게","n"]]},{"w":"destroy","m":"파괴하다","it":[["ruin","망치다","s"],["whisper","속삭이다","n"],["construct","건설하다","a"],["borrow","빌리다","n"],["wreck","망가뜨리다","s"],["create","창조하다","a"],["decorate","장식하다","n"]]},{"w":"continue","m":"계속되다","it":[["fold","접다","n"],["persist","지속되다","s"],["cease","그치다","a"],["invite","초대하다","n"],["carry on","계속하다","s"],["stop","멈추다","a"],["sneeze","재채기하다","n"]]},{"w":"contrary to","m":"~와 반대로","it":[["unlike","~와 달리","s"],["on behalf of","~을 대신하여","n"],["in line with","~와 일치하여","a"],["by means of","~을 써서","n"],["opposed to","~와 반대되는","s"],["consistent with","~와 일치하는","a"],["in charge of","~을 맡은","n"]]},{"w":"shortcoming","m":"단점, 결점","it":[["ladder","사다리","n"],["drawback","결점, 약점","s"],["strength","강점","a"],["harvest","수확","n"],["flaw","결함","s"],["merit","장점","a"],["rumor","소문","n"]]}]},{"items":[{"slots":[["precisely"],["destroyed"],["comprehensive","partial","a"],["continued"],["positive"]],"opts":["comprehensive","limited","narrow","incomplete"],"or":["comprehensive(빠짐없는): perfect(완벽한)와 and(그리고)로 나란히 서서 모든 것을 다 재겠다는 꿈을 그려 맞음.","limited(제한된): 제한된 측정은 꿈이라 부를 만큼 대단하지 않음.","narrow(좁은): 좁은 범위의 측정을 \"완벽한\"과 함께 꿈으로 묶는 건 어색함.","incomplete(불완전한): ","carelessly","a"],["expanded"],["contrary_to"]],"opts":["flawlessly","clumsily","sloppily","approximately"],"or":["flawlessly(흠 없이): 완벽한 측정의 꿈을 이어 가는 사고방식이라 맞음.","clumsily(서투르게): 서투르게 재려는 욕구라면 정밀함을 좇는 기업 세계 이야기와 맞지 않음.","sloppily(엉성하게): 엉성하게 재기는 글 끝에서 새로 권하는 쪽이지 옛 사고방식이 아님.","approximately(대략): 대략 재려는 욕구는 precision-oriented(정확성을 지향하는) 학문과 반대임."],"om":["흠 없이","서투르게","엉성하게","대략"],"en":"the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists. In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.","ko":"흠 없이 측정하려는 인류의 욕구라는 사고방식은 공학자와 과학자 사이에서 계속되었다. 정확성을 지향하는 수학과 통계학이 상업의 모든 영역에 영향을 미치기 시작하면서, 기업 세계에서는 그것이 심지어 확장되었다.","hl":["drive to flawlessly measure","precision-oriented sciences"],"khl":["흠 없이 측정하려는","정확성을 지향하는"],"blocks":[{"t":"p","h":"단어 묶음에서 튀는 것","x":["precisely(정밀하게), perfect(완벽한), precision-oriented(정확성을 지향하는).","글의 앞 절반은 온통 \"정확하게\"의 단어다.","carelessly(부주의하게)만 혼자 반대쪽에 선다.","부주의하게 재려는 욕구가 기업 세계에서 커졌다는 건 말이 안 된다."]},{"t":"p","h":"함정","x":["quantify(수치로 나타내다)는 capture(포착하다) 자리에 넣어도 된다.","공간과 시간을 단위로 잡아낸다는 뜻이 그대로다."]}],"post":["flawlessly(흠 없이) ↔ carelessly(부주의하게)","옛 사고방식 = 흠 없이 재려는 욕구"]},{"slots":[["developed"],["adopt"],["flawlessly"],["imprecision"],["positive","negative","a"]],"opts":["positive","harmful","damaging","worthless"],"or":["positive(긍정적인): not a shortcoming(단점이 아니라)과 맞서는 말이라 맞음.","harmful(해로운): \"해로운 특징이지 단점이 아니다\"가 되어 말이 꼬임.","damaging(손상을 주는): 손상을 주는 것과 단점은 같은 쪽이라 not(~이 아니라)으로 맞설 수 없음.","worthless(쓸모없는): 쓸모없다면 데이터를 훨씬 많이 얻는다는 다음 문장과 부딪침."],"om":["긍정적인","해로운","손상을 주는","쓸모없는"],"en":"allowing for imprecision―for messiness―may be a positive feature, not a shortcoming. As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.","ko":"부정확성, 즉 엉성함을 허용하는 것이 단점이 아니라 긍정적인 특징일 수 있다. 허용 가능한 오차의 기준을 완화하는 것과 맞바꾸어, 우리는 훨씬 더 많은 데이터를 손에 넣을 수 있다.","hl":["a positive feature","much more data"],"khl":["긍정적인 특징","훨씬 더 많은 데이터"],"blocks":[{"t":"p","h":"negative(부정적인)를 넣고 다시 읽기","x":["\"엉성함은 부정적인 특징이지, 단점이 아니다.\"","부정적인 것과 단점은 같은 말이다.","같은 말을 not(~이 아니라)으로 맞세우면 문장이 성립하지 않는다."]},{"t":"p","h":"다음 문장이 이유","x":["엉성함을 허용하면 데이터를 훨씬 많이 얻는다.","얻는 게 있으니 긍정적인 특징이다.","글쓴이는 엉성함 편에 서 있다."]}],"post":["positive(긍정적인) ↔ negative(부정적인)","엉성함 허용 = 데이터가 늘어나는 장점"]},{"slots":[["destroyed","shattered","s"],["relatively"],["expanded","shrank","a"],["contrary_to","unlike","s"],["relaxing"]],"opts":["expanded","faded","declined","weakened"],"or":["expanded(확장되었다): 수학과 통계가 상업의 모든 영역에 퍼졌다는 as(~하면서) 절과 맞음.","faded(희미해졌다): 정밀한 학문이 모든 영역에 퍼지는데 그 사고방식이 희미해질 수 없음.","declined(줄어들었다): even(심지어)은 더 세지는 쪽을 가리키므로 줄어듦과 안 맞음.","weakened(약해졌다): 정밀한 학문이 모든 영역에 영향을 미치기 시작했다는 원인과 반대 방향임."],"om":["확장되었다","희미해졌다","줄어들었다","약해졌다"],"en":"In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.","ko":"정확성을 지향하는 수학과 통계학이 상업의 모든 영역에 영향을 미치기 시작하면서, 기업 세계에서는 그것이 심지어 확장되었다.","hl":["it even expanded","influence all areas of commerce"],"khl":["심지어 확장되었다","상업의 모든 영역에 영향을"],"blocks":[{"t":"p","h":"as(~하면서) 절이 원인","x":["원인: 정밀한 수학·통계가 상업 모든 영역에 들어왔다.","결과: 완벽하게 재려는 사고방식이 기업 세계에서 커졌다.","shrank(줄어들었다)를 넣으면 원인과 결과가 반대로 간다.","정밀한 학문이 퍼질수록 정밀함 욕구가 줄었다는 셈이다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["shattered(산산이 깨뜨렸다)는 destroyed(파괴했다)보다 더 생생할 뿐 같은 방향이다.","unlike(~와 달리)도 contrary to(~와 반대로)처럼 지난 흐름과 선을 긋는다."]}],"post":["expand(확장되다) ↔ shrink(줄어들다)","수학·통계가 퍼지며 완벽 측정 욕구도 커짐"]}],"quiz":[{"w":"comprehensive","m":"포괄적인, 빠짐없는","it":[["thorough","철저한","s"],["frozen","얼어붙은","n"],["partial","부분적인","a"],["loyal","충실한","n"],["complete","완전한","s"],["limited","제한된","a"],["musical","음악의","n"]]},{"w":"relax","m":"완화하다","it":[["knit","뜨개질하다","n"],["loosen","느슨하게 하다","s"],["tighten","엄격하게 하다, 조이다","a"],["translate","번역하다","n"],["ease","완화하다","s"],["toughen","강화하다, 엄하게 하다","a"],["paint","칠하다","n"]]},{"w":"flawlessly","m":"흠 없이, 완벽하게","it":[["perfectly","완벽하게","s"],["upstairs","위층에서","n"],["imperfectly","불완전하게","a"],["loudly","큰 소리로","n"],["impeccably","흠잡을 데 없이","s"],["poorly","형편없이","a"],["weekly","매주","n"]]},{"w":"positive","m":"긍정적인","it":[["rural","시골의","n"],["beneficial","이로운","s"],["negative","부정적인","a"],["wooden","나무로 된","n"],["favorable","호의적인, 유리한","s"],["harmful","해로운","a"],["hollow","속이 빈","n"]]},{"w":"expand","m":"확장되다","it":[["whistle","휘파람을 불다","n"],["grow","커지다","s"],["shrink","줄어들다","a"],["bake","굽다","n"],["enlarge","확대하다","s"],["contract","수축하다","a"],["sneeze","재채기하다","n"]]}]}],"no":"39"},{"id":"2311g2-40","title":"어휘특훈 · 23년 11월 고2 40번","sub":"협력하는 사람이 얻는 사회적 이익","tpl":"Multiple laboratory studies show that {cooperative} people tend to receive social {advantages} from others. One way to {demonstrate} this is to give people the {opportunity} to act positively or negatively toward contributors. For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could {contribute} money toward a group fund which {helped} all group members, and then {allowed} participants to give money to other participants based on their {reputations}. People who contributed more to the group fund were given responsibility for more money than people who contributed less. {Similar} results have been found by other researchers. People who contribute toward their groups are also {chosen} more often as interaction partners, {preferred} as leaders, rated as more {desirable} partners for long-term relationships, and are {perceived} to be {trustworthy} and have {high} social status. {Uncooperative} people tend to receive verbal {criticism} or even more {severe} punishment.","fn":["*fund: 기금","*interaction: 상호작용"],"mean":{"cooperative":"협력적인, 협조하는","selfish":"이기적인","advantages":"명사 advantage(이점, 혜택)의 복수형","benefits":"명사 benefit(이익, 혜택)의 복수형","penalties":"명사 penalty(불이익, 벌)의 복수형","demonstrate":"증명하다, 보여 주다","illustrate":"(예를 들어) 보여 주다, 설명하다","disprove":"틀렸음을 증명하다, 반증하다","opportunity":"기회","chance":"기회","contribute":"기부하다, 기여하다","donate":"기부하다","helped":"동사 help(돕다)의 과거형","benefited":"동사 benefit(이롭게 하다)의 과거형","harmed":"동사 harm(해를 끼치다)의 과거형","allowed":"동사 allow(허락하다)의 과거형","permitted":"동사 permit(허락하다)의 과거형","reputations":"명사 reputation(평판)의 복수형","Similar":"비슷한","Comparable":"비슷한, 견줄 만한","Contradictory":"모순되는, 정반대의","chosen":"동사 choose(선택하다)의 과거분사형","appealing":"매력적인","selected":"동사 select(선발하다, 고르다)의 과거분사형","avoided":"동사 avoid(피하다)의 과거분사형","preferred":"동사 prefer(선호하다)의 과거분사형","rejected":"동사 reject(거부하다)의 과거분사형","desirable":"바람직한, 탐나는","unattractive":"매력 없는","perceived":"동사 perceive(인식하다, 여기다)의 과거분사형","considered":"동사 consider(여기다, 간주하다)의 과거분사형","trustworthy":"신뢰할 수 있는","dishonest":"정직하지 못한","high":"높은","low":"낮은","Uncooperative":"비협조적인","Unhelpful":"도움이 안 되는, 비협조적인","criticism":"비판","praise":"칭찬","severe":"심한, 가혹한","mild":"가벼운, 순한"},"comp":[{"no":"40","slots":[["cooperative"],["allowed"],["Similar"],["desirable","unattractive","a"],["criticism"]],"opts":["desirable","troublesome","unpleasant","unsuitable"],"or":["desirable(바람직한): 함께 나열된 chosen(선택되는), preferred(선호되는)와 같은 좋은 평가라 맞음.","troublesome(골칫거리인): 기여자가 골칫거리 파트너로 평가된다는 말이라 좋은 대우 목록에서 튐.","unpleasant(불쾌한): 불쾌한 파트너로 평가된다는 건 사회적 혜택이 아니라 손해임.","unsuitable(부적합한): 오래 함께하기 부적합하다는 평가는 협력자가 받는 이익과 반대임."],"om":["바람직한","골칫거리인","불쾌한","부적합한"],"en":"People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status.","ko":"또한 자기 집단에 기여하는 사람들은 상호작용 파트너로 더 자주 선택되고, 리더로 선호되며, 장기적인 관계를 위한 더 바람직한 파트너로 평가되고, 신뢰할 수 있고 사회적 지위가 높은 것으로 여겨진다.","hl":["rated as more desirable partners","preferred as leaders"],"khl":["더 바람직한 파트너로 평가되고","리더로 선호되며"],"blocks":[{"t":"p","h":"오래 사귈 사람을 고른다면","x":["친구든 동업자든 오래 함께할 사람을 고른다고 해 보자.","모임에 늘 먼저 보태는 사람과 늘 빠지는 사람.","대부분 앞사람을 고른다.","본문도 같은 말을 한다.","기여하는 사람은 오래 갈 파트너로 더 desirable(바람직한) 사람이 된다.","unattractive(매력 없는)를 넣으면 기여할수록 매력이 떨어진다는 말이 된다."]}],"post":["desirable(바람직한) ↔ unattractive(매력 없는)","오래 함께하고 싶은 사람 = 집단에 보태는 사람"]},{"no":"40","slots":[["helped","benefited","s"],["reputations"],["chosen"],["high","low","a"],["severe"]],"opts":["high","poor","weak","minor"],"or":["high(높은): 기여자가 받는 대우 목록의 마지막 칸이라 좋은 쪽이어야 해서 맞음.","poor(초라한): 사회적 지위가 초라하다는 건 혜택이 아니라 손해임.","weak(약한): 지위가 약하다는 건 리더로 선호된다는 같은 문장의 내용과 부딪침.","minor(사소한): 사소한 지위는 협력자가 사회적 이점을 받는다는 첫 문장과 맞지 않음."],"om":["높은","초라한","약한","사소한"],"en":"and are perceived to be trustworthy and have high social status. Uncooperative people tend to receive verbal criticism or even more severe punishment.","ko":"그리고 신뢰할 수 있고 사회적 지위가 높은 것으로 여겨진다. 비협조적인 사람들은 말로 하는 비판이나 심지어 더 심한 벌을 받는 경향이 있다.","hl":["have high social status","Uncooperative people"],"khl":["사회적 지위가 높은","비협조적인 사람들"],"blocks":[{"t":"pair","h":"두 부류의 성적표","x":[["People who contribute","기여하는 사람: 신뢰받고 지위가 높음"],["Uncooperative people","비협조적인 사람: 비판받고 벌받음"]]},{"t":"p","h":"low(낮은)를 넣으면","x":["기여하는 사람이 지위까지 낮아진다.","그러면 바로 뒤 비협조적인 사람과 차이가 없어진다.","두 부류를 맞세운 마지막 두 문장이 무너진다.","benefited(이롭게 했다)는 helped(도왔다)와 같은 방향이라 그대로 둔다."]}],"post":["high(높은) ↔ low(낮은)","기여하는 사람 = 신뢰 + 높은 지위"]}],"compquiz":[{"w":"desirable","m":"바람직한, 탐나는","it":[["liquid","액체의","n"],["appealing","매력적인","s"],["undesirable","바람직하지 않은","a"],["monthly","매달의","n"],["attractive","매력적인","s"],["unattractive","매력 없는","a"],["wooden","나무로 된","n"]]},{"w":"high","m":"높은","it":[["elevated","높은, 고위의","s"],["salty","짠","n"],["low","낮은","a"],["rainy","비 오는","n"],["lofty","높은, 고상한","s"],["lowly","낮은, 미천한","a"],["curious","호기심 많은","n"]]}],"sets":[{"items":[{"slots":[["cooperative","selfish","a"],["opportunity"],["reputations"],["desirable"],["criticism"]],"opts":["cooperative","hostile","isolated","competitive"],"or":["cooperative(협력적인): 실험에서 이익을 받은 사람이 집단 기금에 돈을 보탠 사람이라 맞음.","hostile(적대적인): 남에게 적대적인 사람이 사회적 혜택을 받는다는 건 마지막 문장의 벌받는 쪽과 같음.","isolated(고립된): 혼자 떨어진 사람은 남에게 대우를 받을 기회조차 적어 글의 결론과 안 맞음.","competitive(경쟁적인): 이 글은 경쟁이 아니라 집단에 보태는 행동이 보상받는다는 이야기임."],"om":["협력적인","적대적인","고립된","경쟁적인"],"en":"Multiple laboratory studies show that cooperative people tend to receive social advantages from others. … Uncooperative people tend to receive verbal criticism or even more severe punishment.","ko":"여러 실험실 연구는 협력적인 사람들이 다른 사람들로부터 사회적 이점을 받는 경향이 있음을 보여 준다. … 비협조적인 사람들은 말로 하는 비판이나 심지어 더 심한 벌을 받는 경향이 있다.","hl":["cooperative people tend to receive social advantages","Uncooperative people"],"khl":["협력적인 사람들이 다른 사람들로부터 사회적 이점을 받는","비협조적인 사람들은"],"blocks":[{"t":"flow","h":"글 전체가 가는 길","x":["주장: 협력하는 사람이 사회적 이점을 받음","방법: 기여자에게 잘해 줄지 못되게 굴지 기회 주기","실험: 집단 기금에 돈을 낸 사람이 더 큰 돈을 맡음","다른 연구: 파트너·리더로 더 많이 뽑힘","반대편: 비협조적인 사람은 비판과 벌"],"at":0},{"t":"p","h":"첫 문장과 끝 문장은 짝","x":["끝 문장의 주인공은 Uncooperative(비협조적인) 사람이고, 받는 건 벌이다.","그렇다면 첫 문장의 주인공은 그 반대편이어야 한다.","selfish(이기적인)를 넣으면 이기적인 사람이 혜택도 받고, 비협조적인 사람이 벌도 받는다.","글의 저울이 한쪽으로 쏠려 버린다."]}],"post":["cooperative(협력적인) ↔ selfish(이기적인)","협력하면 혜택, 비협조하면 벌"]},{"slots":[["advantages","benefits","s"],["contribute"],["helped","harmed","a"],["Similar","Comparable","s"],["high"]],"opts":["helped","divided","threatened","weakened"],"or":["helped(도왔다): 모두를 위해 돈을 모으는 협력 게임이라 기금은 구성원 모두를 돕는 쪽이어야 맞음.","divided(분열시켰다): 구성원을 갈라놓는 기금이라면 cooperative game(협력 게임)이 될 수 없음.","threatened(위협했다): 구성원을 위협하는 기금에 돈을 더 낸 사람이 칭찬받을 이유가 없음.","weakened(약하게 했다): 모두를 약하게 만드는 기금에 기여하는 건 협력이 아니라 손해임."],"om":["도왔다","분열시켰다","위협했다","약하게 했다"],"en":"Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could contribute money toward a group fund which helped all group members","ko":"Guelph 대학교 교수인 Pat Barclay는 참가자들에게, 구성원 모두를 돕는 집단 기금에 사람들이 돈을 낼 수 있는 협력 게임을 하게 했다","hl":["a group fund which helped all group members","a cooperative game"],"khl":["구성원 모두를 돕는 집단 기금","협력 게임"],"blocks":[{"t":"p","h":"반 비품비로 생각해 보기","x":["반 친구들이 각자 돈을 조금씩 걷는다.","그 돈으로 반 전체가 쓰는 물건을 산다.","돈을 많이 낸 친구는 고마운 사람이 된다.","이 실험의 group fund(집단 기금)가 바로 그 비품비다.","harmed(해를 끼쳤다)를 넣으면 돈을 낼수록 반 전체가 손해를 본다.","그런 돈을 낸 사람을 칭찬할 이유가 없다."]},{"t":"p","h":"그대로 두는 두 단어","x":["benefits(혜택)는 advantages(이점) 자리에 넣어도 같은 뜻이다.","Comparable(비슷한)은 Similar(비슷한)와 같은 말이다.","바뀐 단어가 셋이지만 틀린 것은 하나."]}],"post":["helped(도왔다) ↔ harmed(해를 끼쳤다)","집단 기금 = 모두를 위해 걷는 돈"]},{"slots":[["demonstrate"],["allowed","permitted","s"],["chosen"],["trustworthy","dishonest","a"],["severe"]],"opts":["trustworthy","suspicious","careless","deceptive"],"or":["trustworthy(신뢰할 수 있는): 바로 뒤 have high social status(높은 사회적 지위를 갖다)와 함께 좋은 평가를 이루어 맞음.","suspicious(의심스러운): 기여한 사람이 의심받는다는 건 리더로 선호된다는 같은 문장과 부딪침.","careless(부주의한): 부주의한 사람으로 보인다면 더 많은 돈을 맡길 리 없음.","deceptive(남을 속이는): 남을 속이는 사람으로 보이는 건 혜택이 아니라 벌받을 이유임."],"om":["신뢰할 수 있는","의심스러운","부주의한","남을 속이는"],"en":"People who contributed more to the group fund were given responsibility for more money than people who contributed less. … and are perceived to be trustworthy and have high social status.","ko":"집단 기금에 더 많이 낸 사람들은 덜 낸 사람들보다 더 많은 돈에 대한 책임을 받았다. … 그리고 신뢰할 수 있고 사회적 지위가 높은 것으로 여겨진다.","hl":["perceived to be trustworthy","were given responsibility for more money"],"khl":["신뢰할 수 있고","더 많은 돈에 대한 책임을 받았다"],"blocks":[{"t":"pair","h":"실험 결과와 나란히","x":[["were given responsibility for more money","더 많은 돈을 맡았다 (실험에서 한 일)"],["perceived to be trustworthy","믿을 만하다고 여겨진다 (사람들의 생각)"]]},{"t":"p","h":"돈을 맡기는 이유","x":["남에게 큰돈을 맡기는 건 그 사람을 믿을 때다.","실험에서 기여자가 더 큰돈을 맡았다는 건 사람들이 그를 믿었다는 증거다.","dishonest(정직하지 못한)를 넣으면 못 믿을 사람에게 돈을 맡긴 셈이 된다.","permitted(허락했다)는 allowed(허락했다)와 같은 뜻이라 고칠 필요가 없다."]}],"post":["trustworthy(신뢰할 수 있는) ↔ dishonest(정직하지 못한)","큰돈을 맡김 = 믿는다는 표시"]},{"slots":[["opportunity"],["reputations"],["Similar","Contradictory","a"],["preferred"],["Uncooperative"]],"opts":["Similar","Opposite","Inconsistent","Unreliable"],"or":["Similar(비슷한): 다음 문장이 also(또한)로 같은 방향의 결과를 이어 가니 맞음.","Opposite(반대의): 반대 결과가 나왔다면 다음 문장이 also(또한)로 이어질 수 없음.","Inconsistent(일관성 없는): 결과가 들쭉날쭉했다면 Multiple laboratory studies show(여러 실험실 연구가 보여 준다)라고 단정할 수 없음.","Unreliable(믿을 수 없는): 믿을 수 없는 결과라면 글쓴이가 주장의 근거로 내세울 리 없음."],"om":["비슷한","반대의","일관성 없는","믿을 수 없는"],"en":"Similar results have been found by other researchers. People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders","ko":"비슷한 결과가 다른 연구자들에 의해서도 발견되었다. 또한 자기 집단에 기여하는 사람들은 상호작용 파트너로 더 자주 선택되고, 리더로 선호되며","hl":["Similar results","are also chosen"],"khl":["비슷한 결과가","또한"],"blocks":[{"t":"p","h":"also(또한)가 정하는 방향","x":["바로 다음 문장에 also(또한)가 있다.","also(또한)는 앞과 같은 쪽 이야기를 하나 더 얹을 때 쓴다.","다음 문장 내용은 기여자가 파트너로, 리더로 더 뽑힌다는 것이다.","바클레이 실험과 같은 방향이다.","Contradictory(모순되는)를 넣으면 반대 결과를 말해 놓고 also(또한)로 같은 이야기를 잇는 꼴이 된다."]},{"t":"p","h":"글쓴이의 의도","x":["글쓴이는 실험 하나로 끝내지 않는다.","다른 연구자들도 같은 결과를 얻었다고 근거를 쌓는다.","주장을 단단하게 만드는 자리라서 반대 결과가 들어올 틈이 없다."]}],"post":["Similar(비슷한) ↔ Contradictory(모순되는)","다른 연구도 같은 결과 = 근거 쌓기"]},{"slots":[["contribute","donate","s"],["chosen","selected","s"],["desirable"],["criticism","praise","a"],["severe"]],"opts":["criticism","applause","encouragement","admiration"],"or":["criticism(비판): 바로 뒤 even more severe punishment(심지어 더 심한 벌)와 같은 쪽의 나쁜 대우라 맞음.","applause(박수갈채): 비협조적인 사람이 박수를 받는다면 '심지어 더 심한 벌'로 이어질 수 없음.","encouragement(격려): 격려 다음에 '더 심한 벌'이 오면 정도를 높여 가는 even(심지어)이 어색해짐.","admiration(감탄, 존경): 비협조적인 사람이 존경받는다는 건 협력자가 혜택을 받는다는 주장과 정반대임."],"om":["비판","박수갈채","격려","감탄, 존경"],"en":"Uncooperative people tend to receive verbal criticism or even more severe punishment.","ko":"비협조적인 사람들은 말로 하는 비판이나 심지어 더 심한 벌을 받는 경향이 있다.","hl":["verbal criticism","or even more severe punishment"],"khl":["말로 하는 비판","심지어 더 심한 벌"],"blocks":[{"t":"tap","h":"질문 하나","q":"or even more severe punishment(또는 심지어 더 심한 벌)의 '더 심한'은 무엇보다 더 심하다는 걸까?","a":["바로 앞의 verbal criticism(말로 하는 비판)보다 더 심하다는 뜻이다.","그러니 앞 칸도 벌의 일종이어야 한다.","praise(칭찬)를 넣으면 칭찬보다 더 심한 벌이라는 이상한 말이 된다."]},{"t":"p","h":"그대로 두는 두 단어","x":["donate(기부하다)는 contribute(기부하다)와 같은 말이다.","selected(선발된)도 chosen(선택된)과 같은 말이다.","철자가 달라도 뜻이 같으면 맞는 표현."]}],"post":["criticism(비판) ↔ praise(칭찬)","말로 혼나기 → 더 심하면 벌"]}],"quiz":[{"w":"cooperative","m":"협력적인, 협조하는","it":[["rectangular","직사각형의","n"],["collaborative","협력하는","s"],["uncooperative","비협조적인","a"],["musical","음악의","n"],["helpful","도움이 되는, 협조적인","s"],["unhelpful","도움이 안 되는, 비협조적인","a"],["rural","시골의","n"]]},{"w":"help","m":"돕다","it":[["assist","돕다","s"],["borrow","빌리다","n"],["hinder","방해하다","a"],["describe","묘사하다","n"],["aid","돕다","s"],["harm","해를 끼치다","a"],["freeze","얼다","n"]]},{"w":"trustworthy","m":"신뢰할 수 있는","it":[["northern","북쪽의","n"],["unreliable","믿을 수 없는","a"],["dependable","믿을 만한","s"],["frozen","얼어붙은","n"],["untrustworthy","신뢰할 수 없는","a"],["reliable","믿을 만한","s"],["spicy","매운","n"]]},{"w":"similar","m":"비슷한","it":[["noisy","시끄러운","n"],["comparable","비슷한, 견줄 만한","s"],["different","다른","a"],["annual","해마다의","n"],["alike","비슷한","s"],["dissimilar","비슷하지 않은","a"],["sticky","끈적끈적한","n"]]},{"w":"criticism","m":"비판","it":[["disapproval","반감, 못마땅함","s"],["furniture","가구","n"],["praise","칭찬","a"],["harvest","수확","n"],["condemnation","비난","s"],["approval","인정, 찬성","a"],["temperature","온도","n"]]}]},{"items":[{"slots":[["advantages","penalties","a"],["contribute"],["reputations"],["preferred"],["perceived"]],"opts":["advantages","losses","burdens","risks"],"or":["advantages(이점): 실험에서 기여자가 더 많은 돈을 맡고 리더로 뽑힌 일들이 모두 이점이라 맞음.","losses(손실): 기여자가 손실을 받는다면 더 큰돈을 맡았다는 실험 결과와 정반대임.","burdens(짐, 부담): 남에게서 짐을 받는다는 건 리더로 선호된다는 좋은 대우와 맞지 않음.","risks(위험): 협력자에게 위험이 돌아온다는 내용은 글 어디에도 없고 결론과 반대임."],"om":["이점","손실","짐, 부담","위험"],"en":"Multiple laboratory studies show that cooperative people tend to receive social advantages from others.","ko":"여러 실험실 연구는 협력적인 사람들이 다른 사람들로부터 사회적 이점을 받는 경향이 있음을 보여 준다.","hl":["receive social advantages","cooperative people"],"khl":["사회적 이점을 받는","협력적인 사람들이"],"blocks":[{"t":"p","h":"뒤에 나오는 예시를 모아 보기","x":["더 많은 돈을 맡는다.","파트너로 더 자주 뽑힌다.","리더로 선호된다.","믿을 만하다는 평가를 받는다.","이 네 가지를 한 단어로 묶은 것이 첫 문장의 advantages(이점)다."]},{"t":"p","h":"penalties(불이익)가 안 되는 이유","x":["penalties(불이익)는 마지막 문장의 비협조적인 사람이 받는 쪽이다.","협력자가 불이익을 받는다면 뒤의 예시가 전부 거꾸로 된다.","첫 문장은 글 전체의 예고편이라 예시와 같은 방향이어야 한다."]}],"post":["advantages(이점) ↔ penalties(불이익)","큰돈 맡기 + 리더 뽑힘 = 사회적 이점"]},{"slots":[["demonstrate","illustrate","s"],["helped"],["chosen","avoided","a"],["desirable","appealing","s"],["Uncooperative"]],"opts":["chosen","ignored","excluded","dismissed"],"or":["chosen(선택된): 뒤이어 preferred(선호되는), desirable(바람직한)이 나열되니 같은 좋은 대우라 맞음.","ignored(무시당한): 파트너로 무시당한다는 건 리더로 선호된다는 바로 뒤 내용과 부딪침.","excluded(배제된): 파트너에서 빠진다는 건 기여자가 받는 혜택이 아니라 불이익임.","dismissed(묵살된): 상대에게 묵살된다는 건 also(또한)로 앞 실험 결과를 잇는 흐름과 반대임."],"om":["선택된","무시당한","배제된","묵살된"],"en":"People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships","ko":"또한 자기 집단에 기여하는 사람들은 상호작용 파트너로 더 자주 선택되고, 리더로 선호되며, 장기적인 관계를 위한 더 바람직한 파트너로 평가되고","hl":["chosen more often as interaction partners","preferred as leaders"],"khl":["더 자주 선택되고","리더로 선호되며"],"blocks":[{"t":"p","h":"조별 과제 짝 고르기","x":["조별 과제에서 짝을 고른다고 해 보자.","자기 몫을 늘 해 오는 친구가 먼저 뽑힌다.","본문의 기여자도 그렇다.","파트너로 더 자주 뽑히고, 리더로도 선호된다.","avoided(피해지는)를 넣으면 성실한 친구일수록 짝에서 빠진다는 말이 된다."]},{"t":"p","h":"나열에서 튀는 칸 찾기","x":["chosen(선택된), preferred(선호되는), rated as more desirable(더 바람직하다고 평가되는).","모두 좋은 대우가 줄지어 나온다.","이 줄에 avoided(피해지는) 하나만 섞이면 혼자 방향이 반대다."]},{"t":"p","h":"고치지 않는 두 단어","x":["illustrate(보여 주다)는 demonstrate(증명하다, 보여 주다) 자리에 넣어도 뜻이 통한다.","appealing(매력적인)은 desirable(바람직한)과 같은 좋은 평가다.","바뀐 단어가 셋이어도 방향이 반대인 것은 avoided(피해지는) 하나."]}],"post":["chosen(선택된) ↔ avoided(피해지는)","조별 과제 = 성실한 친구가 먼저 뽑힘"]},{"slots":[["opportunity","chance","s"],["allowed"],["high"],["criticism"],["severe","mild","a"]],"opts":["severe","gentle","minor","slight"],"or":["severe(심한): even more(심지어 더)가 말로 하는 비판보다 한 단계 센 벌을 가리키니 맞음.","gentle(부드러운): 비판보다 더 부드러운 벌이라면 even(심지어)으로 강조할 이유가 없음.","minor(사소한): 사소한 벌은 말로 하는 비판보다 약해 '심지어 더'의 방향과 반대임.","slight(가벼운): 가벼운 벌은 비판에서 한 단계 올라가는 흐름을 거꾸로 돌림."],"om":["심한","부드러운","사소한","가벼운"],"en":"Uncooperative people tend to receive verbal criticism or even more severe punishment.","ko":"비협조적인 사람들은 말로 하는 비판이나 심지어 더 심한 벌을 받는 경향이 있다.","hl":["even more severe punishment","verbal criticism"],"khl":["심지어 더 심한 벌","말로 하는 비판"],"blocks":[{"t":"flow","h":"계단을 올라가는 벌","x":["1단계: verbal criticism(말로 하는 비판)","even(심지어)으로 한 계단 더","2단계: 더 심한 벌"],"at":2},{"t":"p","h":"even(심지어)의 역할","x":["even(심지어)은 앞보다 더 센 것을 꺼낼 때 붙는다.","말로 혼나는 것보다 센 것은 실제 벌이다.","mild(가벼운)를 넣으면 계단을 내려가 버린다.","chance(기회)는 opportunity(기회)와 같은 말이라 그대로 둔다."]}],"post":["severe(심한) ↔ mild(가벼운)","말로 혼나기 < 심지어 더 심한 벌"]},{"slots":[["demonstrate","disprove","a"],["helped"],["Similar"],["trustworthy"],["criticism"]],"opts":["demonstrate","deny","conceal","ignore"],"or":["demonstrate(증명하다): 이어지는 For example(예를 들어) 실험이 앞 주장을 뒷받침하니 맞음.","deny(부인하다): 실험 결과가 주장을 지지하는데 부인하는 방법이라고 소개할 수 없음.","conceal(숨기다): 연구 결과를 숨기는 방법을 소개하는 글이 아님.","ignore(무시하다): 주장을 무시하는 방법이라면 뒤의 실험 소개가 필요 없음."],"om":["증명하다","부인하다","숨기다","무시하다"],"en":"One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors. For example, Pat Barclay","ko":"이것을 증명하는 한 가지 방법은 사람들에게 기여자에게 긍정적으로 또는 부정적으로 행동할 기회를 주는 것이다. 예를 들어 Pat Barclay는","hl":["One way to demonstrate this","For example"],"khl":["이것을 증명하는 한 가지 방법은","예를 들어"],"blocks":[{"t":"p","h":"this(이것)가 가리키는 것","x":["this(이것)는 첫 문장, 즉 협력자가 사회적 이점을 받는다는 주장이다.","그다음 For example(예를 들어)로 실험이 나온다.","실험 결과는 기여자가 더 큰돈을 맡았다는 것.","주장이 맞다는 걸 보여 주는 결과다."]},{"t":"tap","h":"질문 하나","q":"disprove(반증하다)를 넣으면 실험은 무엇을 보여 줘야 할까?","a":["협력자가 오히려 손해를 본다는 결과를 보여 줘야 한다.","그런데 실제 결과는 정반대다.","방법인 demonstrate(증명하다)와 결과가 같은 방향이어야 앞뒤가 맞는다."]}],"post":["demonstrate(증명하다) ↔ disprove(반증하다)","실험 = 주장을 증명하는 방법"]},{"slots":[["reputations"],["preferred","rejected","a"],["perceived","considered","s"],["Uncooperative","Unhelpful","s"],["severe"]],"opts":["preferred","mocked","opposed","doubted"],"or":["preferred(선호되는): 기여자가 받는 좋은 대우를 줄지어 나열하는 자리라 맞음.","mocked(조롱당하는): 리더로 조롱당한다는 건 좋은 대우 목록에서 혼자 나쁜 쪽임.","opposed(반대에 부딪히는): 리더가 되는 걸 반대당한다면 사 ern society, many music performance settings make a {clear} {distinction} between performers and audience members: the performers are the “doers” and those in the audience take a decidedly {passive} role. The performance space itself may further {reinforce} the distinction with a physical {separation} between the stage and audience seating. Perhaps because this distinction is so {common}, audiences seem to greatly {value} opportunities to have special “access” to performers that affords understanding about performers’ style of music. Some performing musicians have won great {approval} by regularly {incorporating} “audience participation” into their concerts. Whether by leading a sing-along activity or teaching a rhythm to be clapped at certain points, including audience members in the music making can {boost} the level of {engagement} and enjoyment for all involved. Performers who are {uncomfortable} leading audience participation can still {connect} with the audience simply by giving a special {glimpse} of the performer perspective. It is quite common in classical music to provide audiences with program notes. Typically, this text in a program gives background information about pieces of music being performed and perhaps biographical information about historically {significant} composers. What may be of more {interest} to audience members is background information about the very performers who are onstage, including an explanation of why they have chosen the music they are presenting. Such insight can make audience members feel {closer} to the musicians onstage, both metaphorically and emotionally. This connection will likely {enhance} the expressive and communicative experience.","fn":["*afford: 제공하다","*program note: (공연 안내 책자의) 곡 해설","*biographical: 전기의, 일생에 관한","*metaphorically: 비유적으로"],"mean":{"clear":"분명한, 뚜렷한","sharp":"뚜렷한, 선명한","vague":"흐릿한, 애매한","distinction":"구분, 차이","passive":"수동적인","inactive":"활동하지 않는, 소극적인","active":"적극적인, 활동적인","reinforce":"강화하다","stre
