<!DOCTYPE html>

<title>어휘특훈 · 공통영어2 능률(오) 3과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

ous":"귀중한, 소중한","worthless":"가치 없는, 쓸모없는","ruin":"파괴, 붕괴","destruction":"파괴","brave":"용감한","courageous":"용감한","cowardly":"겁 많은, 비겁한","volunteered":"동사 volunteer(자원하다, 자청하다)의 과거형","refused":"동사 refuse(거부하다, 거절하다)의 과거형","protect":"보호하다, 지키다","damage":"손상시키다, 해를 끼치다","main":"주된, 주요한","principal":"주요한, 주된","prevent":"막다, 방지하다","stop":"막다, 멈추게 하다","promote":"촉진하다, 부추기다","persuaded":"동사 persuade(설득하다)의 과거형","convinced":"동사 convince(설득하다, 납득시키다)의 과거형","significant":"중요한","important":"중요한","insignificant":"대수롭지 않은, 하찮은","restore":"복원하다, 복구하다","repair":"수리하다, 고치다","demolish":"철거하다, 허물다","expanded":"동사 expand(확대되다)의 과거형","broadened":"동사 broaden(넓어지다)의 과거형","shrank":"동사 shrink(줄어들다)의 과거형","hid":"동사 hide(숨기다)의 과거형","concealed":"동사 conceal(감추다, 숨기다)의 과거형","lose":"(전쟁·경기에서) 지다","win":"(전쟁·경기에서) 이기다","destroy":"파괴하다","preserve":"보존하다, 지키다","useful":"쓸모 있는, 유용한","helpful":"도움이 되는","useless":"쓸모없는","retreated":"동사 retreat(후퇴하다, 철수하다)의 과거형","withdrew":"동사 withdraw(물러나다, 철수하다)의 과거형","included":"동사 include(포함하다)의 과거형","excluded":"동사 exclude(제외하다)의 과거형","of value":"가치 있는, 귀중한","valuable":"가치 있는, 귀중한"},"comp":[{"no":"본문 ❶❷","slots":[["priceless"],["protect","damage","a"],["main"],["expanded","broadened","s"],["of_value"]],"opts":["sell","ignore","protect","abandon"],"or":["sell(팔다): 문화유산을 팔겠다고 자청한 사람들을 용감하다고 부를 수 없음.","ignore(무시하다): 무시할 거라면 굳이 자청해서 나설 필요가 없음.","protect(보호하다): 첫 문장의 to protect priceless works of art(대단히 귀중한 예술 작품을 지키기 위해)를 다시 말한 것이라 맞음.","abandon(버리다): 문화유산을 버리는 건 모든 것을 걸고 지키려던 목표와 정반대임."],"om":["팔다","무시하다","보호하다","버리다"],"en":"These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”","ko":"이 용감한 남녀들은 유럽의 문화유산을 지키는 일을 자청했고, '모뉴먼츠 맨'으로 알려지게 되었다.","hl":["to protect Europe’s cultural heritage","brave"],"khl":["유럽의 문화유산을 지키는 일","용감한"],"blocks":[{"t":"p","h":"첫 문장이 이미 말해 준 목표","x":["첫 문장: 귀중한 예술 작품을 파괴로부터 지키려고 모든 것을 건 사람들.","넷째 문장은 그 사람들이 무엇을 자청했는지 다시 말한다.","damage(손상시키다)를 넣으면 문화유산을 해치겠다고 자청한 셈이다.","그런 사람들에게 brave(용감한) 범한 작품이라면 전쟁 중에 전문가들이 따로 모일 이유가 없음.","fake(가짜의): 가짜 작품을 파괴로부터 지킨다는 건 문화유산을 지키는 이 글의 목적과 맞지 않음."],"om":["대단히 귀중한","값싼","평범한","가짜의"],"en":"During World War II, there was a group of people who risked everything to protect priceless works of art from ruin.","ko":"제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다.","hl":["priceless works of art","risked everything"],"khl":["대단히 귀중한 예술 작품들","모든 것을 건"],"blocks":[{"t":"p","h":"price + less의 함정","x":["priceless(대단히 귀중한)는 price(가격) + less(없는)로 생겼다.","그래서 '값이 없다 = 싸다'로 착각하기 쉽다.","실제 뜻은 값을 매길 수 없을 만큼 귀하다는 것이다.","worthless(가치 없는)는 정말로 가치가 없다는 말이라 정반대다."]},{"t":"p","h":"모든 것을 건 이유","x":["이 사람들은 risked everything(모든 것을 걸었다).","전쟁 한가운데서 모든 것을 걸고 지킨 대상이다.","가치 없는 작품을 위해 그렇게 하는 사람은 없다."]}],"post":["priceless(대단히 귀중한) ↔ worthless(가치 없는)","모든 것을 걸고 지킨 대상 = 값을 매길 수 없는 예술 작품"]},{"slots":[["ruin","destruction","s"],["volunteered","refused","a"],["persuaded","convinced","s"],["hid"],["retreated","withdrew","s"]],"opts":["hesitated","forgot","pretended","volunteered"],"or":["hesitated(망설였다): 망설이기만 했다면 '모뉴먼츠 맨'이라는 이름을 얻을 일도 없었음.","forgot(잊었다): 문화유산 지키기를 잊었다면 이 글이 소개할 활동 자체가 없음.","pretended(~하는 척했다): 지키는 척만 했다면 이미 파괴된 지역까지 찾아가 복원한 행동과 맞지 않음.","volunteered(자청했다): 군인도 아닌 학자들이 스스로 나섰다는 뜻이라 These brave men and women(이 용감한 남녀들)과 어울림."],"om":["망설였다","잊었다","~하는 척했다","자청했다"],"en":"These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”","ko":"이 용감한 남녀들은 유럽의 문화유산을 지키는 일을 자청했고, '모뉴먼츠 맨'으로 알려지게 되었다.","hl":["volunteered to protect","brave men and women"],"khl":["지키는 일을 자청했고","용감한 남녀들"],"blocks":[{"t":"flow","h":"본문 ❶의 흐름","x":["누가: 군인이 아닌 학자와 전문가들","무엇을: 유럽의 문화유산 지키기","어떻게: 스스로 자청함","결과: '모뉴먼츠 맨'이라는 이름"],"at":2},{"t":"p","h":"refused(거부했다)를 넣고 다시 읽기","x":["\"용감한 남녀들이 문화유산 지키기를 거부했다.\"","그런데 바로 뒤에 '모뉴먼츠 맨'으로 알려졌다고 이어진다.","거부한 사람에게 이 이름이 붙을 리 없다.","brave(용감한)라는 말과도 부딪친다."]},{"t":"p","h":"그대로 둬도 되는 세 단어","x":["destruction(파괴)은 ruin(파괴) 자리에 들어가도 뜻이 통한다.","convinced(설득했다)는 persuaded(설득했다)와 같은 뜻이다.","withdrew(철수했다)는 retreated(후퇴했다)와 같은 방향의 말이다."]}],"post":["volunteer(자청하다) ↔ refuse(거부하다)","군인 아닌 학자들의 자청 = 모뉴먼츠 맨"]},{"slots":[["brave"],["prevent","promote","a"],["significant","important","s"],["expanded"],["included"]],"opts":["speed_up","ignore","prevent","allow"],"or":["speed up(앞당기다): 파괴를 앞당기는 건 폭격을 말린 다음 행동과 정반대임.","ignore(무시하다): 파괴를 모른 척하는 게 목표라면 굳이 모여 프로그램을 만들 이유가 없음.","prevent(막다): 바로 다음 문장에서 연합군에게 폭격하지 말라고 설득하므로 '파괴를 막는 것'이 목표와 맞음.","allow(허용하다): 파괴를 허용하는 건 문화유산을 지키겠다고 자청한 본문 ❶과 부딪침."],"om":["앞당기다","무시하다","막다","허용하다"],"en":"When the MFAA was first formed, its main goal was to prevent the destruction of cultural landmarks. The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings.","ko":"MFAA가 처음 만들어졌을 때, 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다. 모뉴먼츠 맨은 연합군을 설득해 박물관, 교회, 또는 그 밖의 문화적으로 중요한 건물이 있는 지역은 폭격하지 않게 했다.","hl":["to prevent the destruction","not to bomb"],"khl":["파괴를 막는 것","폭격하지 않게"],"blocks":[{"t":"pair","h":"목표와 행동 나란히","x":[["its main goal was to prevent the destruction","주된 목표 = 파괴를 막는 것"],["persuaded the Allied forces not to bomb","실제 행동 = 연합군에게 폭격하지 말라고 설득"]]},{"t":"p","h":"promote(촉진하다)가 안 되는 이유","x":["promote(촉진하다)를 넣으면 목표가 '파괴를 부추기는 것'이 된다.","그런데 바로 다음 행동은 폭격을 말리는 것이다.","목표와 행동이 정반대로 갈라진다.","important(중요한)는 significant(중요한)와 같은 뜻이라 고치지 않는다."]}],"post":["prevent(막다) ↔ promote(촉진하다)","첫 임무 = 폭격을 말려 파괴 막기"]},{"slots":[["protect"],["restore","demolish","a"],["hid"],["useful"],["of_value"]],"opts":["abandon","sell","steal","restore"],"or":["abandon(버리다): 버릴 거라면 일부러 파괴된 지역을 찾아갈 이유가 없음.","sell(팔다): 문화유산을 지키겠다고 자청한 사람들이 작품을 내다 판다는 건 앞뒤가 안 맞음.","steal(훔치다): 훔친 건 나치 쪽이고, 모뉴먼츠 맨은 그 도난품을 찾아 나선 사람들임.","restore(복원하다): 이미 파괴된 곳을 찾아가 할 일은 되살리는 것이라 맞음."],"om":["버리다","팔다","훔치다","복원하다"],"en":"They also visited areas that had already been destroyed to restore damaged architecture and works of art.","ko":"그들은 또한 이미 파괴된 지역을 찾아가 훼손된 건축물과 예술 작품을 복원했다.","hl":["to restore damaged architecture","already been destroyed"],"khl":["복원했다","이미 파괴된 지역"],"blocks":[{"t":"tap","h":"질문 하나","q":"이미 부서진 곳에 일부러 찾아가는 이유는?","a":["부서진 것을 다시 살리기 위해서다.","restore(복원하다)가 그 목적이다.","demolish(철거하다)를 넣으면 이미 무너진 것을 한 번 더 허무는 셈이다."]},{"t":"p","h":"also(또한)가 이어 주는 것","x":["앞 문장은 폭격을 막는 일이었다.","also(또한)는 같은 방향의 일을 하나 더 붙인다.","막는 일 + 되살리는 일.","둘 다 지키는 쪽이다."]}],"post":["restore(복원하다) ↔ demolish(철거하다)","폭격 막기 + 부서진 곳 되살리기"]},{"slots":[["main","principal","s"],["persuaded"],["expanded","shrank","a"],["hid","concealed","s"],["destroy"]],"opts":["expanded","ended","weakened","paused"],"or":["expanded(확대되었다): 파괴 막기에 보물 찾기까지 더해졌으니 역할이 커진 것이 맞음.","ended(끝났다): 바로 뒤에 도난품을 찾기 시작했다는 새 임무가 나와 '끝났다'와 부딪침.","weakened(약해졌다): 역사상 가장 위대한 보물찾기로 불리는 일을 맡았으니 약해졌다고 할 수 없음.","paused(잠시 멈췄다): 멈춘 게 아니라 일이 하나 더 늘어나는 흐름임."],"om":["확대되었다","끝났다","약해졌다","잠시 멈췄다"],"en":"It wasn’t long before their role expanded. During the war, the Nazis had been stealing works of art and other cultural treasures from countries across Europe.","ko":"머지않아 그들의 역할은 확대되었다. 전쟁 중에 나치는 유럽 전역의 나라들에서 예술 작품과 다른 문화재들을 훔쳐 오고 있었다.","hl":["their role expanded","had been stealing"],"khl":["역할은 확대되었다","훔쳐 오고 있었다"],"blocks":[{"t":"flow","h":"역할이 바뀌는 지점","x":["처음 목표: 랜드마크 파괴 막기","새로 안 사실: 나치가 보물을 훔쳐 숨김","새 임무: 도난품 찾기","별명: 역사상 가장 위대한 보물찾기"],"at":2},{"t":"p","h":"shrank(줄어들었다)가 틀린 이유","x":["It wasn’t long before(머지않아)는 곧 무언가가 생긴다는 신호다.","그 뒤에 나오는 건 새 임무, 도난품 찾기다.","일이 하나 더 붙었으니 역할은 커졌다.","줄어들었다는 말은 이 흐름과 맞지 않는다."]},{"t":"p","h":"함정 두 개","x":["principal(주된)은 main(주된)과 같은 뜻이다.","concealed(숨겼다)는 hid(숨겼다)와 같은 뜻이다.","둘 다 고치면 안 된다."]}],"post":["expand(확대되다) ↔ shrink(줄어들다)","파괴 막기 → 보물 찾기까지 역할 확대"]}],"quiz":[{"w":"priceless","m":"대단히 귀중한","it":[["invaluable","매우 귀중한","s"],["rural","시골의","n"],["worthless","가치 없는","a"],["precious","귀중한","s"],["noisy","시끄러운","n"],["cheap","값싼","a"],["thirsty","목마른","n"]]},{"w":"volunteer","m":"자원하다, 자청하다","it":[["offer","(자진해서) 나서다, 제공하다","s"],["refuse","거절하다","a"],["borrow","빌리다","n"],["step forward","자진해서 나서다","s"],["decline","거절하다","a"],["whisper","속삭이다","n"],["polish","닦다, 윤내다","n"]]},{"w":"prevent","m":"막다, 방지하다","it":[["stop","막다","s"],["allow","허용하다","a"],["fold","접다","n"],["avert","막다, 피하다","s"],["permit","허락하다","a"],["swim","수영하다","n"],["paint","칠하다","n"]]},{"w":"restore","m":"복원하다, 복구하다","it":[["repair","수리하다","s"],["sneeze","재채기하다","n"],["damage","손상시키다","a"],["renovate","보수하다","s"],["destroy","파괴하다","a"],["deliver","배달하다","n"],["giggle","킥킥 웃다","n"]]},{"w":"expand","m":"확대하다, 확대되다","it":[["enlarge","확대하다","s"],["knit","뜨개질하다","n"],["shrink","줄어들다","a"],["broaden","넓히다","s"],["cough","기침하다","n"],["contract","수축하다","a"],["rent","빌리다","n"]]}]},{"items":[{"slots":[["brave","cowardly","a"],["protect"],["prevent"],["hid"],["useful"]],"opts":["brave","selfish","lazy","greedy"],"or":["brave(용감한): 전쟁 중에 모든 것을 걸고 나선 사람들이라 맞음.","selfish(이기적인): 남의 나라 문화유산까지 지키겠다고 자청한 사람들을 이기적이라 할 수 없음.","lazy(게으른): 이미 파괴된 지역까지 찾아다닌 사람들이라 게으르다는 말과 반대임.","greedy(탐욕스러운): 보물을 차지하려는 쪽은 나치이고, 이들은 그 보물을 지키는 쪽임."],"om":["용감한","이기적인","게으른","탐욕스러운"],"en":"During World War II, there was a group of people who risked everything to protect priceless works of art from ruin. … These brave men and women volunteered to protect Europe’s cultural heritage","ko":"제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다. … 이 용감한 남녀들은 유럽의 문화유산을 지키는 일을 자청했고","hl":["These brave men and women","risked everything"],"khl":["이 용감한 남녀들","모든 것을 건"],"blocks":[{"t":"pair","h":"첫 문장과 넷째 문장 잇기","x":[["a group of people who risked everything","모든 것을 건 한 무리의 사람들"],["These brave men and women","이 용감한 남녀들"]]},{"t":"p","h":"These(이)가 가리키는 사람","x":["These(이)는 앞에서 소개한 바로 그 사람들을 가리킨다.","전쟁 중에 모든 것을 걸었고, 군인도 아닌데 자청해서 나섰다.","cowardly(겁 많은)를 넣으면 앞에서 그린 모습과 정면으로 부딪친다."]}],"post":["brave(용감한) ↔ cowardly(겁 많은)","군인 아닌 학자들 + 모든 것을 걸고 자청"]},{"slots":[["priceless","precious","s"],["significant","insignificant","a"],["restore","repair","s"],["lose"],["destroy"]],"opts":["ordinary","meaningless","significant","forgettable"],"or":["ordinary(평범한): 아무 건물이 아니라 박물관·교회 같은 특별한 곳을 지키려는 설득이라 맞지 않음.","meaningless(무의미한): 무의미한 건물을 지키려고 연합군을 설득할 이유가 없음.","significant(중요한): 박물관·교회와 같은 부류로 묶이니 문화적으로 중요한 건물이 맞음.","forgettable(잊혀도 그만인): 잊혀도 되는 건물이라면 폭격을 말릴 이유가 사라짐."],"om":["평범한","무의미한","중요한","잊혀도 그만인"],"en":"The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings.","ko":"모뉴먼츠 맨은 연합군을 설득해 박물관, 교회, 또는 그 밖의 문화적으로 중요한 건물이 있는 지역은 폭격하지 않게 했다.","hl":["other culturally significant buildings","museums, churches"],"khl":["그 밖의 문화적으로 중요한 건물","박물관, 교회"],"blocks":[{"t":"p","h":"other(그 밖의)가 묶어 주는 무리","x":["A, B, or other(그 밖의) C 구조는 A와 B를 C의 예시로 묶는다.","박물관과 교회가 C의 예시다.","그러니 C는 박물관·교회와 같은 부류여야 한다.","insignificant(하찮은)를 넣으면 박물관과 교회까지 하찮은 건물이 되어 버린다."]},{"t":"p","h":"함정","x":["precious(귀중한)는 priceless(대단히 귀중한)와 같은 방향이다.","repair(수리하다)는 restore(복원하다) 자리에 들어가도 자연스럽다.","둘 다 맞는 표현."]}],"post":["significant(중요한) ↔ insignificant(하찮은)","박물관·교회 = 문화적으로 중요한 건물의 예시"]},{"slots":[["volunteered"],["main"],["lose","win","a"],["useful","helpful","s"],["retreated"]],"opts":["dominate","lead","enjoy","lose"],"or":["dominate(장악하다): 전쟁을 장악했다면 한 지역에서 후퇴할 일이 없음.","lead(주도하다): 전쟁을 주도하는 쪽이 모든 걸 부수고 물러날 이유가 없음.","enjoy(즐기다): 전쟁을 즐긴다는 말은 도난품이 위협받는 위기 상황과 맞지 않음.","lose(지다): 다음 문장에 retreated(후퇴했다)가 나와 전쟁에서 밀리는 상황과 맞음."],"om":["장악하다","주도하다","즐기다","지다"],"en":"When Germany began to lose the war, the stolen objects came under threat. Hitler ordered his forces to destroy everything that could be useful to the Allied armies before they retreated from an area.","ko":"독일이 전쟁에서 지기 시작하자, 도난당한 물건들은 위협을 받게 되었다. 히틀러는 자기 군대에게 한 지역에서 후퇴하기 전에 연합군에게 쓸모 있을 수 있는 것은 모두 파괴하라고 명령했다.","hl":["began to lose the war","before they retreated"],"khl":["전쟁에서 지기 시작하자","후퇴하기 전에"],"blocks":[{"t":"flow","h":"원인과 결과","x":["독일이 전쟁에서 밀림","독일군이 지역에서 물러나야 함","물러나기 전에 쓸 만한 것은 다 부수라는 명령","훔친 예술품까지 위험"],"at":0},{"t":"p","h":"win(이기다)을 넣으면","x":["이기는 군대는 물러나지 않는다.","그런데 바로 다음 문장이 retreated(후퇴했다)다.","이기는 중이라면 적에게 넘어갈 물건을 미리 부술 이유도 없다.","helpful(도움이 되는)은 useful(쓸모 있는)과 같은 뜻이라 그대로 둔다."]}],"post":["lose(지다) ↔ win(이기다)","전쟁에서 밀림 → 후퇴 전 파괴 명령 → 예술품 위기"]},{"slots":[["ruin"],["persuaded"],["expanded"],["destroy","preserve","a"],["included"]],"opts":["display","share","destroy","repair"],"or":["display(전시하다): 물러나는 군대가 적에게 쓸모 있는 물건을 전시할 이유가 없음.","share(나눠 주다): 적군에게 쓸모 있는 것을 나눠 준다는 건 전쟁 중인 군대의 명령이 될 수 없음.","destroy(파괴하다): 적에게 쓸모 있을 만한 건 남기지 않으려는 명령이라 맞고, 그래서 예술품이 위협을 받음.","repair(수리하다): 적이 쓸 물건을 고쳐 주고 떠난다는 말이라 예술품이 위협받았다는 흐름과 이어지지 않음."],"om":["전시하다","나눠 주다","파괴하다","수리하다"],"en":"Hitler ordered his forces to destroy everything that could be useful to the Allied armies before they retreated from an area. Some Nazi leaders believed that this included not just military and industrial equipment but everything of value—even the stolen works of art.","ko":"히틀러는 자기 군대에게 한 지역에서 후퇴하기 전에 연합군에게 쓸모 있을 수 있는 것은 모두 파괴하라고 명령했다. 일부 나치 지도자들은 여기에 군사 장비와 산업 장비뿐 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품까지 포함된다고 믿었다.","hl":["to destroy everything","even the stolen works of art"],"khl":["모두 파괴하라고","심지어 훔친 예술 작품까지"],"blocks":[{"t":"tap","h":"질문 하나","q":"왜 훔친 예술품이 위험해졌을까?","a":["히틀러가 '적에게 쓸모 있을 것은 다 부숴라'고 명령했기 때문이다.","일부 나치 지도자들은 예술품도 그 '쓸모 있는 것'에 넣었다.","명령이 preserve(보존하다)였다면 예술품이 위험할 이유가 없다."]},{"t":"p","h":"적에게 남겨 주지 않기","x":["물러나는 군대는 적이 쓸 만한 것을 남기기 싫어한다.","그래서 떠나기 전에 부순다.","보존하라는 명령은 적에게 선물을 남기라는 말과 같다."]}],"post":["destroy(파괴하다) ↔ preserve(보존하다)","후퇴 전 '다 부숴라' 명령 = 예술품의 위기"]},{"slots":[["brave","courageous","s"],["prevent","stop","s"],["expanded"],["included","excluded","a"],["of_value"]],"opts":["spared","protected","ignored","included"],"or":["spared(남겨 두었다): 예술품을 남겨 두는 명령이었다면 도난품이 위협을 받을 일이 없음.","protected(보호했다): 파괴 명령이 예술품을 보호한다는 건 말이 안 됨.","ignored(무시했다): 예술품을 무시했다면 even(심지어)으로 예술품을 콕 집어 강조할 이유가 없음.","included(포함했다): 파괴 대상에 군사 장비뿐 아니라 예술품까지 들어간다는 뜻이라 도난품이 위협받은 이유와 맞음."],"om":["남겨 두었다","보호했다","무시했다","포함했다"],"en":"Some Nazi leaders believed that this included not just military and industrial equipment but everything of value—even the stolen works of art.","ko":"일부 나치 지도자들은 여기에 군사 장비와 산업 장비뿐 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품까지 포함된다고 믿었다.","hl":["this included","not just military and industrial equipment but everything of value"],"khl":["포함된다고","군사 장비와 산업 장비뿐 아니라 가치 있는 모든 것"],"blocks":[{"t":"p","h":"not just A but B(A뿐 아니라 B도)","x":["이 구조는 A에 B를 더한다.","A는 군사·산업 장비, B는 가치 있는 모든 것이다.","더하는 동사는 included(포함했다)여야 한다.","excluded(제외했다)를 넣으면 '장비뿐 아니라 예술품까지 뺐다'가 되어 even(심지어)과 부딪친다."]},{"t":"p","h":"this(이것)가 가리키는 것","x":["this(이것)는 앞 문장의 '적에게 쓸모 있을 모든 것'이다.","나치 지도자들은 그 범위를 예술품까지 넓혀 생각했다.","그래서 도난품이 위험해졌다."]},{"t":"p","h":"함정","x":["courageous(용감한)는 brave(용감한)와, stop(막다)은 prevent(막다)와 같은 뜻이다."]}],"post":["include(포함하다) ↔ exclude(제외하다)","파괴 대상 = 장비 + 가치 있는 모든 것, 심지어 예술품"]}],"quiz":[{"w":"brave","m":"용감한","it":[["courageous","용감한","s"],["salty","짠","n"],["cowardly","겁 많은","a"],["bold","대담한","s"],["wooden","나무로 된","n"],["timid","소심한","a"],["weekly","매주의","n"]]},{"w":"significant","m":"중요한","it":[["sticky","끈적끈적한","n"],["important","중요한","s"],["trivial","사소한","a"],["meaningful","의미 있는","s"],["foggy","안개 낀","n"],["insignificant","하찮은","a"],["square","정사각형의","n"]]},{"w":"lose","m":"(전쟁·경기에서) 지다","it":[["be defeated","패배하다","s"],["win","이기다","a"],["bake","굽다","n"],["be beaten","지다, 패하다","s"],["climb","오르다","n"],["triumph","승리하다","a"],["sew","바느질하다","n"]]},{"w":"destroy","m":"파괴하다","it":[["demolish","철거하다, 허물다","s"],["sing","노래하다","n"],["preserve","보존하다","a"],["wreck","망가뜨리다","s"],["skip","건너뛰다","n"],["build","짓다","a"],["yawn","하품하다","n"]]},{"w":"include","m":"포함하다","it":[["contain","포함하다","s"],["chew","씹다","n"],["exclude","제외하다","a"],["involve","포함하다, 수반하다","s"],["omit","빠뜨리다","a"],["float","뜨다","n"],["shout","소리치다","n"]]}]}],"no":"본문 ❶❷"},{"id":"js1-L3-3c","title":"어휘특훈 · 공통영어2 3과 본문 ❸","sub":"알타우제 소금 광산의 반전","tpl":"One of the largest collections of stolen items was {hidden} in the salt mines of Altaussee, Austria. Upon {discovering} its location, some of the Monuments Men {rushed} to the mines. They hoped to {recover} everything before it was too late. Meanwhile, the Nazi leader who was {in_charge_of} the area tried to destroy everything by setting off large explosives inside the mines. This could have been {disastrous}. {Luckily}, some local miners found the explosives in the mines and {came_up_with} a plan to {protect} their livelihood. They {secretly} {removed} the large explosives and put {smaller} ones at the entrances. Once they {went_off}, the Nazi leader believed that everything was {destroyed}. However, while the small explosions {sealed_off} the entrances, they left the rest of the mines and the works of art {unharmed}. When the Monuments Men arrived and squeezed their way into the mines, they must have been {amazed} to see what was inside. There were thousands of {priceless} objects, including paintings, statues, books, furniture, and more.","fn":["*Altaussee: 알타우제 (오스트리아의 지명)","*set ~ off: (폭탄 등을) 터뜨리다","*explosive: 폭발물","*livelihood: 생계 (수단)","*squeeze: (억지로) 비집고 들어가다"],"mean":{"hidden":"동사 hide(숨기다)의 과거분사형. was hidden = 숨겨져 있었다","concealed":"동사 conceal(감추다, 숨기다)의 과거분사형","discovering":"동사 discover(알아내다, 발견하다)의 -ing형. Upon -ing = ~하자마자","finding out":"동사구 find out(알아내다)의 -ing형","forgetting":"동사 forget(잊다)의 -ing형","rushed":"동사 rush(급히 움직이다, 서두르다)의 과거형","hurried":"동사 hurry(서둘러 가다)의 과거형","recover":"(잃은 것을) 되찾다","retrieve":"되찾아 오다, 회수하다","abandon":"버리다, 포기하다","in charge of":"~을 맡아서, 담당해서","responsible for":"~을 책임지는, 담당하는","disastrous":"처참한, 재앙을 부르는","catastrophic":"파멸적인, 재앙 같은","fortunate":"운 좋은","Luckily":"다행히도","Fortunately":"다행히도","Unfortunately":"불행히도","came up with":"동사구 come up with(~을 생각해 내다)의 과거형","devised":"동사 devise(고안하다)의 과거형","protect":"보호하다, 지키다","sacrifice":"희생하다, 내놓다","secretly":"몰래, 비밀리에","openly":"공개적으로, 드러내 놓고","removed":"동사 remove(제거하다)의 과거형","took out":"동사구 take out(꺼내다, 빼내다)의 과거형","installed":"동사 install(설치하다)의 과거형","smaller":"형용사 small(작은)의 비교급. 더 작은","larger":"형용사 large(큰)의 비교급. 더 큰","went off":"동사구 go off(폭발하다, 터지다)의 과거형","exploded":"동사 explode(폭발하다)의 과거형","destroyed":"동사 destroy(파괴하다)의 과거분사형. was destroyed = 파괴되었다","preserved":"동사 preserve(보존하다)의 과거분사형. was preserved = 보존되었다","sealed off":"동사구 seal off(봉쇄하다, 막다)의 과거형","blocked":"동사 block(막다)의 과거형","unharmed":"손상되지 않은, 다치지 않은","harmed":"동사 harm(해를 끼치다)의 과거분사형. 피해를 입은","amazed":"(깜짝) 놀란","astonished":"깜짝 놀란","disappointed":"실망한","priceless":"대단히 귀중한 (값을 매길 수 없을 만큼 귀한)","worthless":"가치 없는, 쓸모없는"},"comp":[{"no":"본문 ❸","slots":[["rushed"],["in_charge_of"],["removed","installed","a"],["smaller"],["amazed","astonished","s"]],"opts":["checked","doubled","ignored","removed"],"or":["checked(점검했다): 점검만 하고 그대로 두면 대형 폭발물이 터져 모든 것이 날아감.","doubled(두 배로 늘렸다): 폭발물을 늘리면 생계와 작품을 지키려던 계획과 정반대임.","ignored(내버려 두었다): 내버려 두었다면 광산은 처참하게 파괴되었을 것임.","removed(제거했다): 대형 폭발물을 빼야 광산과 작품이 손상되지 않은 채 남을 수 있어 맞음."],"om":["점검했다","두 배로 늘렸다","내버려 두었다","제거했다"],"en":"They secretly removed the large explosives and put smaller ones at the entrances.","ko":"그들은 몰래 대형 폭발물을 제거하고 입구에 더 작은 것들을 놓았다.","hl":["removed the large explosives","put smaller ones"],"khl":["대형 폭발물을 제거하고","더 작은 것들을 놓았다"],"blocks":[{"t":"flow","h":"광부들의 속임수 순서","x":["폭발물 발견","대형 폭발물 빼기","입구에 작은 폭발물 두기","작은 폭발로 입구만 막힘","나치 지도자는 다 파괴됐다고 착각"],"at":1},{"t":"p","h":"installed(설치했다)가 틀린 이유","x":["대형 폭발물을 설치하면 광산 안이 통째로 날아간다.","그러면 작품이 손상되지 않은 채 남을 수 없다.","astonished(깜짝 놀란)는 amazed(놀란)와 같은 뜻이라 그대로 둔다."]}],"post":["remove(제거하다) ↔ install(설치하다)","큰 폭발물 빼기 = 속임수의 첫 단계"]},{"no":"본문 ❸","slots":[["recover","retrieve","s"],["Luckily"],["went_off"],["destroyed","preserved","a"],["unharmed"]],"opts":["rescued","destroyed","returned","sold"],"or":["rescued(구출된): 나치 지도자는 예술품을 구출하려던 사람이 아니라 날려 버리려던 사람임.","destroyed(파괴된): 입구가 폭발로 막히는 걸 보고 속은 나치 지도자의 착각이라 맞음.","returned(반환된): 반환은 전쟁 뒤 모뉴먼츠 맨이 한 일이고, 이 순간 나치 지도자가 믿을 내용이 아님.","sold(팔린): 폭발이 터진 직후에 '모든 것이 팔렸다'고 믿는다는 건 상황과 맞지 않음."],"om":["구출된","파괴된","반환된","팔린"],"en":"Once they went off, the Nazi leader believed that everything was destroyed. However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.","ko":"그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 믿었다. 하지만 작은 폭발들은 입구를 막아 버렸을 뿐, 광산의 나머지 부분과 예술 작품들은 손상되지 않은 채로 남겨 두었다.","hl":["believed that everything was destroyed","However"],"khl":["모든 것이 파괴되었다고 믿었다","하지만"],"blocks":[{"t":"p","h":"믿음과 사실의 대조","x":["나치 지도자의 믿음: 모든 것이 파괴됨.","실제: 입구만 막히고 나머지는 멀쩡함.","However(하지만)가 이 둘을 갈라 놓는다.","preserved(보존된)를 넣으면 믿음과 사실이 같아져 However(하지만)가 설 자리가 없다."]},{"t":"p","h":"함정","x":["retrieve(되찾다)는 recover(되찾다)와 같은 뜻이라 맞는 표현이다."]}],"post":["destroyed(파괴된) ↔ preserved(보존된)","입구 폭발 = 나치 지도자를 속인 신호"]}],"compquiz":[{"w":"remove","m":"제거하다","it":[["eliminate","제거하다","s"],["giggle","킥킥 웃다","n"],["put in","넣다, 설치하다","a"],["extract","뽑아내다","s"],["skate","스케이트를 타다","n"],["insert","끼워 넣다","a"],["borrow","빌리다","n"]]},{"w":"destroy","m":"파괴하다","it":[["yawn","하품하다","n"],["demolish","철거하다, 허물다","s"],["preserve","보존하다","a"],["sing","노래하다","n"],["wreck","망가뜨리다","s"],["build","짓다","a"],["fold","접다","n"]]}],"sets":[{"items":[{"slots":[["discovering","forgetting","a"],["recover"],["disastrous"],["removed"],["unharmed"]],"opts":["hiding","ignoring","discovering","doubting"],"or":["hiding(숨기다): 위치를 숨긴 건 나치 쪽이고, 모뉴먼츠 맨은 그 위치를 찾는 쪽임.","ignoring(무시하다): 위치를 무시했다면 광산으로 급히 달려간 행동과 맞지 않음.","discovering(알아내다): 위치를 알아냈으니 곧바로 광산으로 달려갈 수 있었음.","doubting(의심하다): 위치를 의심하면서 너무 늦기 전에 되찾겠다고 서두를 수는 없음."],"om":["숨기다","무시하다","알아내다","의심하다"],"en":"Upon discovering its location, some of the Monuments Men rushed to the mines.","ko":"그 위치를 알아내자마자, 모뉴먼츠 맨 중 몇 명이 광산으로 달려갔다.","hl":["Upon discovering its location","rushed to the mines"],"khl":["그 위치를 알아내자마자","광산으로 달려갔다"],"blocks":[{"t":"p","h":"Upon -ing(~하자마자)","x":["Upon(~하자마자) + -ing는 어떤 일이 일어나고 곧바로 다음 행동이 이어질 때 쓴다.","위치를 알아냄 → 곧바로 광산으로 달려감.","forgetting(잊다)을 넣으면 '위치를 잊자마자 그곳으로 달려갔다'가 된다.","잊은 장소로는 달려갈 수 없다."]},{"t":"flow","h":"본문 ❸의 시작","x":["알타우제 소금 광산에 도난품 더미","위치를 알아냄","급히 달려감","너무 늦기 전에 되찾고 싶음"],"at":1}],"post":["discover(알아내다) ↔ forget(잊다)","위치를 알아내자마자 광산으로 달려감"]},{"slots":[["hidden","concealed","s"],["rushed","hurried","s"],["Luckily","Unfortunately","a"],["protect"],["amazed"]],"opts":["Similarly","Therefore","Sadly","Luckily"],"or":["Similarly(마찬가지로): 앞 문장은 위기, 뒷문장은 구원이라 '비슷한 일'을 잇는 말이 들어갈 수 없음.","Therefore(그러므로): 처참할 수 있었다는 것이 광부들이 폭발물을 발견한 원인은 아님.","Sadly(슬프게도): 광부들이 생계와 예술품을 지킨 일은 슬픈 소식이 아니라 반가운 소식임.","Luckily(다행히도): 처참할 뻔한 상황을 광부들이 막아 주는 반전이라 맞음."],"om":["마찬가지로","그러므로","슬프게도","다행히도"],"en":"This could have been disastrous. Luckily, some local miners found the explosives in the mines and came up with a plan to protect their livelihood.","ko":"이것은 처참한 일이 될 수도 있었다. 다행히도, 지역 광부 몇 명이 광산에서 폭발물을 발견했고, 자신들의 생계를 지킬 계획을 생각해 냈다.","hl":["Luckily","could have been disastrous"],"khl":["다행히도","처참한 일이 될 수도 있었다"],"blocks":[{"t":"pair","h":"위기와 반전","x":[["This could have been disastrous.","위기: 처참한 일이 될 수도 있었다"],["Luckily, some local miners found the explosives","반전: 다행히 광부들이 폭발물을 발견"]]},{"t":"p","h":"could have p.p.(~할 수도 있었다)","x":["could have been(~이 될 수도 있었다)은 실제로는 그렇게 되지 않았다는 뜻을 품는다.","처참한 일은 결국 일어나지 않았다.","그걸 막아 준 사람들이 광부들이다.","Unfortunately(불행히도)를 넣으면 반가운 반전을 나쁜 소식처럼 소개하는 셈이다."]},{"t":"p","h":"함정","x":["concealed(숨겨진)는 hidden(숨겨진)과, hurried(서둘러 갔다)는 rushed(급히 움직였다)와 같은 뜻이다."]}],"post":["luckily(다행히도) ↔ unfortunately(불행히도)","처참할 뻔한 위기 → 광부들의 반전"]},{"slots":[["recover"],["in_charge_of","responsible for","s"],["secretly","openly","a"],["smaller"],["priceless"]],"opts":["proudly","loudly","carelessly","secretly"],"or":["proudly(자랑스럽게): 자랑하듯 드러내 놓고 했다면 나치 지도자가 속을 수 없음.","loudly(시끄럽게): 시끄럽게 일하면 나치에게 계획이 들통남.","carelessly(부주의하게): 대형 폭발물을 부주의하게 다루면 광산이 먼저 날아갈 수 있어 계획과 맞지 않음.","secretly(몰래): 나치 지도자가 모든 것이 파괴됐다고 믿게 하려면 들키지 않아야 해서 맞음."],"om":["자랑스럽게","시끄럽게","부주의하게","몰래"],"en":"They secretly removed the large explosives and put smaller ones at the entrances. Once they went off, the Nazi leader believed that everything was destroyed.","ko":"그들은 몰래 대형 폭발물을 제거하고 입구에 더 작은 것들을 놓았다. 그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 믿었다.","hl":["secretly removed","the Nazi leader believed that everything was destroyed"],"khl":["몰래 대형 폭발물을 제거하고","나치 지도자는 모든 것이 파괴되었다고 믿었다"],"blocks":[{"t":"p","h":"속임수의 조건","x":["광부들의 계획은 나치 지도자를 속이는 것이었다.","속이려면 들키면 안 된다.","실제로 나치 지도자는 모든 것이 파괴됐다고 믿었다.","openly(공개적으로)를 넣으면 다 보는 앞에서 폭발물을 뺀 셈이라 속임수가 성립하지 않는다."]},{"t":"p","h":"그대로 둬도 되는 말","x":["responsible for(~을 책임지는)는 in charge of(~을 맡아서)와 같은 뜻이다.","그 지역을 맡은 나치 지도자라는 내용은 변하지 않는다."]}],"post":["secretly(몰래) ↔ openly(공개적으로)","들키지 않아야 성공하는 광부들의 속임수"]},{"slots":[["came_up_with"],["smaller","larger","a"],["went_off"],["destroyed"],["unharmed"]],"opts":["heavier","smaller","stronger","louder"],"or":["heavier(더 무거운): 더 무거운 폭발물은 더 큰 폭발로 이어져 광산 전체를 위험하게 만듦.","smaller(더 작은): 뒤 문장의 the small explosions(작은 폭발들)와 맞고, 입구만 막을 만큼의 힘이라 맞음.","stronger(더 강한): 더 강한 폭발물을 둘 거라면 대형 폭발물을 뺀 의미가 없어짐.","louder(더 시끄러운): 폭발물을 고른 기준은 소리가 아니라 크기이며, 뒤 문장이 small(작은)이라고 못 박음."],"om":["더 무거운","더 작은","더 강한","더 시끄러운"],"en":"They secretly removed the large explosives and put smaller ones at the entrances. … However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.","ko":"그들은 몰래 대형 폭발물을 제거하고 입구에 더 작은 것들을 놓았다. … 하지만 작은 폭발들은 입구를 막아 버렸을 뿐, 광산의 나머지 부분과 예술 작품들은 손상되지 않은 채로 남겨 두었다.","hl":["put smaller ones at the entrances","the small explosions"],"khl":["입구에 더 작은 것들을 놓았다","작은 폭발들"],"blocks":[{"t":"pair","h":"크기 비교","x":[["removed the large explosives","대형 폭발물은 뺌"],["put smaller ones at the entrances","입구에는 더 작은 것을 둠"],["the small explosions sealed off the entrances","작은 폭발이 입구만 막음"]]},{"t":"p","h":"larger(더 큰)를 넣으면","x":["대형 폭발물을 빼고 더 큰 폭발물을 넣는 셈이다.","그러면 뺄 이유가 없다.","게다가 두 문장 뒤에 the small explosions(작은 폭발들)라고 분명히 나온다.","입구만 막고 안쪽을 살리려면 폭발은 작아야 한다."]}],"post":["smaller(더 작은) ↔ larger(더 큰)","큰 폭발물 빼고 작은 것으로 입구만 막기"]},{"slots":[["discovering","finding out","s"],["disastrous","catastrophic","s"],["protect"],["removed"],["amazed","disappointed","a"]],"opts":["bored","annoyed","amazed","frightened"],"or":["bored(지루한): 수천 점의 보물을 보고 지루해할 사람은 없음.","annoyed(짜증 난): 되찾고 싶던 보물이 무사히 있었으니 짜증 날 이유가 없음.","amazed(놀란): 안에 수천 점의 귀중한 물건이 고스란히 있었으니 놀란 게 당연함.","frightened(겁먹은): 안에 있던 건 위험한 것이 아니라 그림과 조각상 같은 보물임."],"om":["지루한","짜증 난","놀란","겁먹은"],"en":"When the Monuments Men arrived and squeezed their way into the mines, they must have been amazed to see what was inside. There were thousands of priceless objects, including paintings, statues, books, furniture, and more.","ko":"모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 안에 있는 것을 보고 놀랐음에 틀림없다. 그곳에는 그림, 조각상, 책, 가구 등을 포함해 수천 점의 귀중한 물건들이 있었다.","hl":["must have been amazed","thousands of priceless objects"],"khl":["놀랐음에 틀림없다","수천 점의 귀중한 물건들"],"blocks":[{"t":"p","h":"이야기의 끝 장면","x":["입구는 막혀 있었다.","그래서 모뉴먼츠 맨은 비집고 들어가야 했다.","안에는 수천 점의 귀중한 물건이 그대로 있었다.","disappointed(실망한)는 이 장면과 정반대 감정이다."]},{"t":"p","h":"must have p.p.(~했음에 틀림없다)","x":["필자가 그때의 감정을 강하게 추측하는 표현이다.","뒤 문장의 보물 목록이 그 추측의 근거다."]},{"t":"p","h":"함정","x":["finding out(알아내다)은 discovering(알아내다)과, catastrophic(파멸적인)은 disastrous(처참한)와 같은 뜻이다."]}],"post":["amazed(놀란) ↔ disappointed(실망한)","막힌 입구 너머 = 무사한 보물 수천 점"]}],"quiz":[{"w":"discover","m":"알아내다, 발견하다","it":[["find out","알아내다","s"],["bake","굽다","n"],["overlook","못 보고 지나치다","a"],["uncover","밝혀내다","s"],["swing","흔들다","n"],["miss","놓치다","a"],["knock","두드리다","n"]]},{"w":"luckily","m":"다행히도","it":[["quietly","조용히","n"],["fortunately","다행히도","s"],["unfortunately","불행히도","a"],["happily","다행히, 운 좋게","s"],["upstairs","위층으로","n"],["unluckily","운 나쁘게","a"],["twice","두 번","n"]]},{"w":"secretly","m":"몰래, 비밀리에","it":[["covertly","은밀히","s"],["openly","공개적으로","a"],["early","일찍","n"],["privately","남몰래, 은밀히","s"],["fast","빨리","n"],["publicly","공공연하게","a"],["abroad","해외에서","n"]]},{"w":"small","m":"작은","it":[["sour","신","n"],["little","작은","s"],["large","큰","a"],["tiny","아주 작은","s"],["polite","공손한","n"],["huge","거대한","a"],["frozen","얼어붙은","n"]]},{"w":"amazed","m":"(깜짝) 놀란","it":[["astonished","깜짝 놀란","s"],["thirsty","목마른","n"],["unimpressed","별 감흥이 없는","a"],["astounded","몹시 놀란","s"],["wooden","나무로 된","n"],["indifferent","무관심한, 무덤덤한","a"],["rectangular","직사각형의","n"]]}]},{"items":[{"slots":[["rushed"],["recover","abandon","a"],["Luckily"],["secretly"],["went_off"]],"opts":["destroy","forget","sell","recover"],"or":["destroy(파괴하다): 파괴하려던 건 나치 지도자이고, 모뉴먼츠 맨은 그 반대편임.","forget(잊다): 잊고 싶었다면 급히 광산으로 달려가지 않았을 것임.","sell(팔다): 도난품을 원래 자리로 돌려보낸 사람들이 팔 생각을 할 리 없음.","recover(되찾다): 도난품의 위치를 알고 달려간 목적이 바로 되찾기라 맞음."],"om":["파괴하다","잊다","팔다","되찾다"],"en":"Upon discovering its location, some of the Monuments Men rushed to the mines. They hoped to recover everything before it was too late.","ko":"그 위치를 알아내자마자, 모뉴먼츠 맨 중 몇 명이 광산으로 달려갔다. 그들은 너무 늦기 전에 모든 것을 되찾고 싶었다.","hl":["to recover everything","before it was too late"],"khl":["모든 것을 되찾고 싶었다","너무 늦기 전에"],"blocks":[{"t":"tap","h":"질문 하나","q":"'너무 늦기 전에'의 늦는다는 건 무엇일까?","a":["나치가 광산을 폭파해 버리는 것.","그 전에 보물을 되찾아야 했다.","abandon(버리다)을 넣으면 서두를 이유가 사라진다."]},{"t":"p","h":"rushed(급히 움직였다)와 한 묶음","x":["급히 달려간 이유가 다음 문장에 나온다.","되찾기 위해서다.","버리러 가는 사람은 서두르지 않는다."]}],"post":["recover(되찾다) ↔ abandon(버리다)","시간과의 경주 = 폭파 전에 되찾기"]},{"slots":[["disastrous","fortunate","a"],["came_up_with","devised","s"],["smaller"],["sealed_off","blocked","s"],["unharmed"]],"opts":["harmless","disastrous","pleasant","convenient"],"or":["harmless(해가 없는): 대형 폭발물로 보물을 날리려던 계획이 해가 없을 리 없음.","disastrous(처참한): 광산 속 대형 폭발물로 모든 것을 파괴하려던 계획이라 처참할 뻔했다는 말이 맞음.","pleasant(즐거운): 수천 점의 보물이 사라질 뻔한 상황은 즐거움과 거리가 멂.","convenient(편리한): 폭파 계획은 모뉴먼츠 맨에게 편리한 일이 아니라 최악의 위기임."],"om":["해가 없는","처참한","즐거운","편리한"],"en":"Meanwhile, the Nazi leader who was in charge of the area tried to destroy everything by setting off large explosives inside the mines. This could have been disastrous.","ko":"한편, 그 지역을 담당하던 나치 지도자는 광산 안에서 대형 폭발물을 터뜨려 모든 것을 파괴하려 했다. 이것은 처참한 일이 될 수도 있었다.","hl":["This could have been disastrous","setting off large explosives"],"khl":["처참한 일이 될 수도 있었다","대형 폭발물을 터뜨려"],"blocks":[{"t":"p","h":"This(이것)가 가리키는 것","x":["This(이것)는 앞 문장, 대형 폭발물로 모든 것을 날리려던 시도다.","그게 성공했다면 수천 점의 보물이 사라졌다.","fortunate(운 좋은)를 넣으면 폭파 계획이 '운 좋은 일'이 되어 버린다.","바로 다음에 Luckily(다행히도)로 반전이 나오는 것도 앞이 위기였기 때문이다."]},{"t":"p","h":"고치지 않아도 되는 두 단어","x":["devised(고안했다)는 came up with(생각해 냈다)와 같은 뜻이다.","blocked(막았다)는 sealed off(봉쇄했다)와 같은 방향이다."]}],"post":["disastrous(처참한) ↔ fortunate(운 좋은)","광산 폭파 계획 = 처참할 뻔한 위기"]},{"slots":[["hidden"],["Luckily","Fortunately","s"],["protect","sacrifice","a"],["removed"],["priceless"]],"opts":["destroy","protect","risk","abandon"],"or":["destroy(파괴하다): 자기 생계를 파괴하는 계획이라면 폭발물을 몰래 뺄 이유가 없음.","protect(보호하다): 광산이 폭파되면 일터를 잃으니 생계를 지키려는 계획이 맞음.","risk(위태롭게 하다): 광부들은 오히려 폭발물을 치워 일터를 지켜 냈음.","abandon(버리다): 생계를 버릴 거라면 광산을 살리는 계획을 세우지 않았을 것임."],"om":["파괴하다","보호하다","위태롭게 하다","버리다"],"en":"Luckily, some local miners found the explosives in the mines and came up with a plan to protect their livelihood.","ko":"다행히도, 지역 광부 몇 명이 광산에서 폭발물을 발견했고, 자신들의 생계를 지킬 계획을 생각해 냈다.","hl":["a plan to protect their livelihood","local miners"],"khl":["자신들의 생계를 지킬 계획","지역 광부"],"blocks":[{"t":"p","h":"광부들에게 광산이란","x":["광부에게 광산은 일터이자 밥줄이다.","광산이 날아가면 생계도 끝난다.","그래서 광부들은 폭발물을 몰래 빼냈다.","sacrifice(희생하다)를 넣으면 스스로 밥줄을 내놓는 계획이 되어 다음 행동과 맞지 않는다."]},{"t":"p","h":"한 번에 두 가지를 지킨 계획","x":["광부들이 지키려던 건 생계였다.","그런데 그 덕분에 예술 작품까지 살아남았다.","Fortunately(다행히도)는 Luckily(다행히도)와 같은 뜻이라 그대로 둔다."]}],"post":["protect(지키다) ↔ sacrifice(희생하다)","광부의 밥줄 지키기 = 예술품 지키기"]},{"slots":[["recover"],["secretly"],["destroyed"],["sealed_off"],["unharmed","harmed","a"]],"opts":["broken","burned","unharmed","scattered"],"or":["broken(부서진): 안에서 수천 점의 귀중한 물건이 발견됐으니 부서진 채 남았다는 말과 부딪침.","burned(불탄): 작은 폭발은 입구만 막았을 뿐 안쪽 작품을 태우지 않았음.","unharmed(손상되지 않은): while(~이지만)이 '입구는 막혔지만 나머지는 멀쩡'이라는 대조를 만들어 맞음.","scattered(흩어진): 모뉴먼츠 맨이 들어갔을 때 보물이 그대로 있었다는 장면과 맞지 않음."],"om":["부서진","불탄","손상되지 않은","흩어진"],"en":"However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.","ko":"하지만 작은 폭발들은 입구를 막아 버렸을 뿐, 광산의 나머지 부분과 예술 작품들은 손상되지 않은 채로 남겨 두었다.","hl":["left the rest of the mines and the works of art unharmed","while"],"khl":["예술 작품들은 손상되지 않은 채로 남겨 두었다","입구를 막아 버렸을 뿐"],"blocks":[{"t":"pair","h":"while(~이지만) 앞뒤 나란히","x":[["the small explosions sealed off the entrances","입구: 막힘 (피해)"],["left the rest of the mines and the works of art unharmed","나머지와 작품: 멀쩡함"]]},{"t":"p","h":"However(하지만)가 뒤집는 믿음","x":["바로 앞에서 나치 지도자는 모든 것이 파괴됐다고 믿었다.","However(하지만)는 그 믿음이 틀렸다고 알려 준다.","harmed(피해를 입은)를 넣으면 믿음이 맞은 셈이 되어 However(하지만)가 필요 없다."]},{"t":"p","h":"leave + 목적어 + 형용사","x":["leave(남겨 두다) + 목적어 + 형용사는 '~을 …한 상태로 남겨 두다'라는 뜻이다.","목적어는 광산의 나머지와 예술 작품, 상태는 unharmed(손상되지 않은)다."]}],"post":["unharmed(손상되지 않은) ↔ harmed(피해를 입은)","입구만 막히고 작품은 멀쩡"]},{"slots":[["discovering"],["removed","took out","s"],["went_off","exploded","s"],["amazed"],["priceless","worthless","a"]],"opts":["priceless","broken","ordinary","fake"],"or":["priceless(대단히 귀중한): 그림·조각상 같은 문화재 수천 점이라 맞고, 모뉴먼츠 맨이 놀란 이유가 됨.","broken(부서진): 바로 앞에서 작품들이 손상되지 않은 채 남았다고 했음.","ordinary(평범한): 평범한 물건이라면 모뉴먼츠 맨이 놀랄 이유도, 광산까지 달려올 이유도 없음.","fake(가짜의): 나치가 유럽 곳곳에서 훔쳐 숨겨 둔 진짜 문화재들이라 가짜일 수 없음."],"om":["대단히 귀중한","부서진","평범한","가짜의"],"en":"they must have been amazed to see what was inside. There were thousands of priceless objects, including paintings, statues, books, furniture, and more.","ko":"그들은 안에 있는 것을 보고 놀랐음에 틀림없다. 그곳에는 그림, 조각상, 책, 가구 등을 포함해 수천 점의 귀중한 물건들이 있었다.","hl":["thousands of priceless objects","amazed"],"khl":["수천 점의 귀중한 물건들","놀랐음에 틀림없다"],"blocks":[{"t":"tap","h":"질문 하나","q":"가치 없는 물건 수천 점을 보고 놀랄까?","a":["놀랄 이유가 없다.","놀란 건 그 물건들이 값을 매길 수 없을 만큼 귀했기 때문이다.","priceless(대단히 귀중한)를 '값이 없는'으로 착각하면 worthless(가치 없는)에 속는다."]},{"t":"p","h":"함정","x":["took out(꺼냈다)은 removed(제거했다)와, exploded(폭발했다)는 went off(터졌다)와 같은 뜻이다.","둘 다 고치지 않는다."]}],"post":["priceless(대단히 귀중한) ↔ worthless(가치 없는)","광산 속 수천 점 = 값을 매길 수 없는 보물"]}],"quiz":[{"w":"recover","m":"(잃은 것을) 되찾다","it":[["retrieve","되찾다","s"],["sneeze","재채기하다","n"],["lose","잃다","a"],["regain","되찾다","s"],["paint","칠하다","n"],["forfeit","(벌로) 잃다, 몰수당하다","a"],["jog","조깅하다","n"]]},{"w":"disastrous","m":"처참한","it":[["fluffy","솜털 같은","n"],["catastrophic","파멸적인","s"],["fortunate","운 좋은","a"],["devastating","엄청난 피해를 주는","s"],["annual","해마다의","n"],["successful","성공적인","a"],["spicy","매운","n"]]},{"w":"protect","m":"보호하다, 지키다","it":[["guard","지키다","s"],["endanger","위험에 빠뜨리다","a"],["iron","다림질하다","n"],["shield","보호하다","s"],["whistle","휘파람을 불다","n"],["attack","공격하다","a"],["spell","철자를 말하다","n"]]},{"w":"unharmed","m":"손상되지 않은, 다치지 않은","it":[["noisy","시끄러운","n"],["intact","온전한","s"],["damaged","손상된","a"],["unhurt","다치지 않은","s"],["sweet","달콤한","n"],["injured","다친","a"],["rural","시골의","n"]]},{"w":"priceless","m":"대단히 귀중한","it":[["invaluable","매우 귀중한","s"],["worthless","가치 없는","a"],["sleepy","졸린","n"],["precious","귀중한","s"],["curly","곱슬곱슬한","n"],["valueless","가치 없는","a"],["foreign","외국의","n"]]}]}],"no":"본문 ❸"},{"id":"js1-L3-3d","title":"어휘특훈 · 공통영어2 3과 본문 ❹+❺","sub":"두 달의 수송 작전 + 전쟁 뒤에도 이어진 노력","tpl":"The Monuments Men thought it would take about one year to {transport} everything they found to a {safe} location. However, because control of the area was going to change at the end of the war, they would have access to the mines for just two months. With {insufficient} packing supplies and only a few trucks, the transporting mission seemed {impossible}. Not only that, but food was {in_short_supply}. Even without eating {proper} meals, they worked up to twenty hours a day. They used coats and gas masks as packing materials and did everything they could to {accomplish} this {vital} mission in time. In the end, the Monuments Men {succeeded_in} rescuing thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges. The efforts of the Monuments Men did not end with the war. For several years, they {continued} the work of recovering cultural treasures and identifying where they had been stolen from. In the end, the Monuments Men {returned} more than five million works of art and objects of cultural importance to their places of origin. Not everything that was stolen by the Nazis has been found, but what the Monuments Men accomplished is truly {amazing}. Without this {determined} group, the search for stolen works of art might never have begun. In addition, {countless} historical and cultural landmarks would have been lost forever due to the destruction of war. It is worth remembering the Monuments Men’s contribution to the {preservation} of cultural heritage. Thanks to their efforts, many {incredible} cultural sites and works of art have {survived} and can still be {appreciated} to this day.","fn":["*packing: (상품의) 포장","*gas mask: 방독면","*place of origin: 원래 있던 곳, 원산지","*contribution: 기여, 공헌"],"mean":{"transport":"이동시키다, 수송하다","move":"옮기다","safe":"안전한","secure":"안전한, 안심할 수 있는","dangerous":"위험한","insufficient":"불충분한","inadequate":"부족한, 불충분한","sufficient":"충분한","impossible":"불가능한","hopeless":"가망 없는","achievable":"달성할 수 있는","in short supply":"공급이 부족한","scarce":"부족한, 드문","abundant":"풍부한","proper":"적절한, 제대로 된","decent":"제대로 된, 괜찮은","accomplish":"완수하다, 성취하다","complete":"완료하다, 끝마치다","vital":"필수적인, 매우 중요한","trivial":"사소한, 하찮은","succeeded in":"동사구 succeed in(~에 성공하다)의 과거형","failed in":"동사구 fail in(~에 실패하다)의 과거형","continued":"동사 continue(계속하다)의 과거형","carried on":"동사구 carry on(계속하다)의 과거형","stopped":"동사 stop(멈추다)의 과거형","returned":"동사 return(돌려주다)의 과거형","gave back":"동사구 give back(돌려주다)의 과거형","amazing":"놀라운","remarkable":"놀랄 만한, 주목할 만한","disappointing":"실망스러운","determined":"결연한, 단호한","resolute":"단호한, 굳게 결심한","hesitant":"망설이는, 주저하는","countless":"무수한, 셀 수 없이 많은","numerous":"수많은","few":"거의 없는","preservation":"보존, 보호","destruction":"파괴","incredible":"(믿기 어려울 만큼) 대단한, 엄청난","extraordinary":"놀라운, 비범한","survived":"동사 survive(살아남다)의 과거분사형. have survived = 살아남았다","disappeared":"동사 disappear(사라지다)의 과거분사형","appreciated":"동사 appreciate(감상하다, 진가를 알아보다)의 과거분사형. be appreciated = 감상되다"},"comp":[{"no":"본문 ❹❺","slots":[["transport"],["in_short_supply"],["succeeded_in","failed in","a"],["determined","resolute","s"],["incredible"]],"opts":["gave_up","delayed","succeeded_in","stopped"],"or":["gave up(포기했다): 포기했다면 반 에이크·페르메이르·미켈란젤로의 작품을 구했다고 소개할 수 없음.","delayed(미뤘다): 두 달밖에 없는 임무라 미룰 수 없었고, 결과도 구출 성공임.","succeeded in(~에 성공했다): 뒤에 구출된 명작들의 이름이 줄줄이 나오고, 5백만 점 반환으로 이어져 맞음.","stopped(그만두었다): 할 수 있는 모든 것을 한 끝에 그만두었다는 건 In the end(마침내)의 결말과 맞지 않음."],"om":["포기했다","미뤘다","~에 성공했다","그만두었다"],"en":"In the end, the Monuments Men succeeded in rescuing thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges.","ko":"마침내 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 요하네스 페르메이르의 「천문학자」, 미켈란젤로의 「브뤼헤의 성모」 같은 중요한 작품을 포함해 수천 점의 도난 예술품을 구출하는 데 성공했다.","hl":["succeeded in rescuing","In the end"],"khl":["구출하는 데 성공했다","마침내"],"blocks":[{"t":"p","h":"In the end(마침내)가 알려 주는 결말","x":["불가능해 보였던 임무 이야기의 끝이다.","뒤에 구출된 명작들의 이름이 줄줄이 나온다.","failed in(~에 실패했다)을 넣으면 구출된 작품 목록과 부딪친다.","resolute(단호한)는 determined(결연한)와 같은 뜻이라 그대로 둔다."]}],"post":["succeed in(~에 성공하다) ↔ fail in(~에 실패하다)","불가능해 보인 두 달 → 수천 점 구출 성공"]},{"no":"본문 ❹❺","slots":[["safe"],["amazing"],["countless","numerous","s"],["preservation","destruction","a"],["appreciated"]],"opts":["sale","theft","preservation","loss"],"or":["sale(판매): 문화재를 판 일에 기여했다면 기억할 가치가 있다고 칭찬할 수 없음.","theft(도난): 도난은 나치가 한 일이고, 모뉴먼츠 맨은 도난품을 되찾은 사람들임.","preservation(보존): It is worth remembering(기억할 가치가 있다)과 함께 칭찬받는 기여는 문화유산을 지킨 일이라 맞음.","loss(손실): 바로 앞 문장이 그들이 없었다면 유적을 잃었을 것이라는 말이라, 손실에 기여했다는 건 정반대임."],"om":["판매","도난","보존","손실"],"en":"It is worth remembering the Monuments Men’s contribution to the preservation of cultural heritage.","ko":"문화유산 보존에 대한 모뉴먼츠 맨의 기여는 기억할 가치가 있다.","hl":["contribution to the preservation of cultural heritage","worth remembering"],"khl":["문화유산 보존에 대한 모뉴먼츠 맨의 기여","기억할 가치가 있다"],"blocks":[{"t":"p","h":"글의 결론 문장","x":["본문 ❶에서 그들은 문화유산을 지키겠다고 자청했다.","마지막에 필자는 그 기여를 기억하자고 말한다.","destruction(파괴)을 넣으면 문화유산 파괴에 기여한 사람들을 기억하자는 말이 된다.","파괴는 전쟁과 나치 쪽 단어다."]},{"t":"p","h":"be worth -ing(~할 가치가 있다)","x":["It is worth remembering(기억할 가치가 있다)은 칭찬하는 말투다.","칭찬받는 기여는 지키는 쪽이어야 한다.","numerous(수많은)는 countless(무수한)와 같은 뜻이라 그대로 둔다."]}],"post":["preservation(보존) ↔ destruction(파괴)","결론 = 문화유산을 지킨 기여를 기억하기"]}],"compquiz":[{"w":"succeed","m":"성공하다","it":[["triumph","승리하다, 성공하다","s"],["iron","다림질하다","n"],["fail","실패하다","a"],["prevail","이기다, 성공하다","s"],["skate","스케이트를 타다","n"],["flop","완전히 실패하다","a"],["yawn","하품하다","n"]]},{"w":"preservation","m":"보존, 보호","it":[["ladder","사다리","n"],["protection","보호","s"],["destruction","파괴","a"],["conservation","보존","s"],["harvest","수확","n"],["neglect","방치","a"],["rumor","소문","n"]]}],"sets":[{"items":[{"slots":[["safe","dangerous","a"],["insufficient"],["proper"],["returned"],["incredible"]],"opts":["hostile","safe","ruined","flooded"],"or":["hostile(적대적인): 적대적인 곳으로 옮기면 작품을 다시 위험에 빠뜨리는 셈임.","safe(안전한): 전쟁 중 위협받던 작품을 옮기는 목적은 안전한 곳에 두는 것이라 맞음.","ruined(폐허가 된): 폐허로 옮기는 건 작품을 지키려는 수송 임무의 목적과 반대임.","flooded(물에 잠긴): 물에 잠긴 곳은 그림과 책을 망가뜨려 보관 장소가 될 수 없음."],"om":["적대적인","안전한","폐허가 된","물에 잠긴"],"en":"The Monuments Men thought it would take about one year to transport everything they found to a safe location.","ko":"모뉴먼츠 맨은 그들이 발견한 모든 것을 안전한 장소로 옮기는 데 약 1년이 걸릴 거라고 생각했다.","hl":["to a safe location","transport everything they found"],"khl":["안전한 장소로","발견한 모든 것을"],"blocks":[{"t":"flow","h":"본문 ❹의 흐름","x":["목표: 발견한 모든 것을 안전한 곳으로","예상 기간: 약 1년","실제 허락된 기간: 두 달","장애물: 부족한 자재·트럭·식량","결과: 그래도 구출 성공"],"at":0},{"t":"p","h":"dangerous(위험한)를 넣으면","x":["광산에서 겨우 살아남은 보물이다.","그걸 위험한 곳으로 옮긴다면 1년씩 들일 이유가 없다.","수송의 목적은 오직 하나, 안전이다."]}],"post":["safe(안전한) ↔ dangerous(위험한)","광산의 보물 → 안전한 곳으로 수송"]},{"slots":[["transport","move","s"],["impossible","achievable","a"],["vital"],["amazing","remarkable","s"],["survived"]],"opts":["simple","pleasant","impossible","quick"],"or":["simple(간단한): 1년 걸릴 일을 두 달에 해야 하는데 간단해 보일 수 없음.","pleasant(즐거운): 자재도 트럭도 부족한 임무가 즐거워 보였다는 건 흐름과 맞지 않음.","impossible(불가능한): 불충분한 자재와 몇 대뿐인 트럭이라는 조건 뒤라 불가능해 보였다는 말이 맞음.","quick(빠른): 1년은 걸릴 거라 예상한 일이라 금방 끝날 임무로 보일 수 없음."],"om":["간단한","즐거운","불가능한","빠른"],"en":"With insufficient packing supplies and only a few trucks, the transporting mission seemed impossible.","ko":"포장 자재는 불충분하고 트럭은 몇 대뿐이어서, 수송 임무는 불가능해 보였다.","hl":["seemed impossible","insufficient packing supplies and only a few trucks"],"khl":["불가능해 보였다","포장 자재는 불충분하고 트럭은 몇 대뿐이어서"],"blocks":[{"t":"p","h":"조건부터 읽기","x":["1년 걸릴 일인데 시간은 두 달.","포장 자재는 불충분, 트럭은 몇 대뿐.","이 조건이 쌓인 끝에 나오는 말이 impossible(불가능한)이다.","achievable(달성할 수 있는)을 넣으면 앞의 나쁜 조건들이 아무 의미가 없어진다."]},{"t":"p","h":"그대로 둬도 되는 두 단어","x":["move(옮기다)는 transport(이동시키다) 자리에 들어가도 자연스럽다.","remarkable(놀랄 만한)은 amazing(놀라운)과 같은 뜻이다."]}],"post":["impossible(불가능한) ↔ achievable(달성할 수 있는)","1년 걸릴 일 + 두 달 + 부족한 자재 = 불가능해 보인 임무"]},{"slots":[["in_short_supply","scarce","s"],["vital","trivial","a"],["succeeded_in"],["determined"],["preservation"]],"opts":["optional","pointless","relaxing","vital"],"or":["optional(선택적인): 해도 되고 안 해도 되는 일이라면 끼니도 거르며 매달릴 이유가 없음.","pointless(무의미한): 수천 점의 작품을 살린 임무를 무의미하다고 할 수 없음.","relaxing(느긋한): 두 달 안에 끝내야 하는 시간과의 싸움이라 느긋함과 정반대임.","vital(매우 중요한): 하루 20시간씩 일하며 할 수 있는 모든 것을 한 임무라 매우 중요한 임무가 맞음."],"om":["선택적인","무의미한","느긋한","매우 중요한"],"en":"Even without eating proper meals, they worked up to twenty hours a day. They used coats and gas masks as packing materials and did everything they could to accomplish this vital mission in time.","ko":"제대로 된 식사도 하지 못한 채, 그들은 하루에 20시간까지 일했다. 그들은 외투와 방독면을 포장 재료로 썼고, 이 중요한 임무를 제때 완수하기 위해 할 수 있는 모든 것을 했다.","hl":["this vital mission","did everything they could"],"khl":["이 중요한 임무","할 수 있는 모든 것을 했다"],"blocks":[{"t":"pair","h":"얼마나 애썼나","x":[["worked up to twenty hours a day","하루 20시간까지 일함"],["used coats and gas masks as packing materials","외투와 방독면까지 포장재로 씀"],["did everything they could","할 수 있는 모든 것을 함"]]},{"t":"p","h":"trivial(사소한)이 안 되는 이유","x":["사소한 일에 끼니를 거르고 밤낮없이 매달리는 사람은 없다.","이만큼 애쓴 건 임무가 그만큼 중요했기 때문이다.","scarce(부족한)는 in short supply(공급이 부족한)와 같은 뜻이라 고치지 않는다."]}],"post":["vital(매우 중요한) ↔ trivial(사소한)","외투·방독면까지 동원한 시간과의 싸움"]},{"slots":[["safe"],["accomplish"],["continued","stopped","a"],["amazing"],["appreciated"]],"opts":["delayed","continued","refused","forgot"],"or":["delayed(미뤘다): 여러 해 동안 일을 미뤘다면 5백만 점을 돌려보낼 수 없었음.","continued(계속했다): 바로 앞 문장 did not end with the war(전쟁과 함께 끝나지 않았다)를 그대로 이어받아 맞음.","refused(거부했다): 거부했다면 노력이 전쟁과 함께 끝난 셈이라 앞 문장과 부딪침.","forgot(잊었다): 문화재를 되찾고 출처를 확인하는 일은 잊힌 게 아니라 이어진 일임."],"om":["미뤘다","계속했다","거부했다","잊었다"],"en":"The efforts of the Monuments Men did not end with the war. For several years, they continued the work of recovering cultural treasures and identifying where they had been stolen from.","ko":"모뉴먼츠 맨의 노력은 전쟁과 함께 끝나지 않았다. 여러 해 동안, 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 확인하는 일을 계속했다.","hl":["they continued the work","did not end with the war"],"khl":["확인하는 일을 계속했다","전쟁과 함께 끝나지 않았다"],"blocks":[{"t":"pair","h":"두 문장은 같은 말","x":[["did not end with the war","전쟁과 함께 끝나지 않았다"],["For several years, they continued the work","여러 해 동안 그 일을 계속했다"]]},{"t":"p","h":"stopped(멈췄다)를 넣으면","x":["'끝나지 않았다' 바로 뒤에 '여러 해 동안 멈췄다'가 온다.","앞 문장을 스스로 뒤집는 말이다.","본문 ❺는 전쟁 뒤에도 이어진 노력에 대한 이야기다."]}],"post":["continue(계속하다) ↔ stop(멈추다)","전쟁이 끝나도 계속된 되찾기·출처 확인"]},{"slots":[["insufficient","inadequate","s"],["proper","decent","s"],["returned"],["countless","few","a"],["incredible"]],"opts":["fake","unimportant","imaginary","countless"],"or":["fake(가짜의): 전쟁의 파괴로 사라질 뻔한 것은 진짜 역사 유적임.","unimportant(중요하지 않은): 중요하지 않은 랜드마크를 잃는다는 말은 모뉴먼츠 맨의 기여를 강조하지 못함.","imaginary(상상 속의): 상상 속의 랜드마크는 애초에 파괴될 수도 없음.","countless(무수한): 이 집단이 없었다면 잃었을 것이 셀 수 없이 많다는 말로 그들의 공을 강조해 맞음."],"om":["가짜의","중요하지 않은","상상 속의","무수한"],"en":"Without this determined group, the search for stolen works of art might never have begun. In addition, countless historical and cultural landmarks would have been lost forever due to the destruction of war.","ko":"이 결연한 집단이 없었다면, 도난 예술품 수색은 시작조차 되지 않았을지도 모른다. 또한 수많은 역사적·문화적 랜드마크가 전쟁의 파괴로 영원히 사라졌을 것이다.","hl":["c 는 언어의 역할이 맞음.","replacing(대체하기): 정체성을 문화로 바꿔 버린다는 이상한 말이 되어 because(~ 때문에) 절의 이유가 못 됨."],"om":["지우기","약하게 만들기","연결하기","대체하기"],"en":"This would be a great loss because language plays a big role in connecting people’s identity to their culture.","ko":"이것은 큰 손실이 될 것이다. 언어가 사람들의 정체성을 그들의 문화와 연결하는 데 큰 역할을 하기 때문이다.","hl":["connecting people’s identity to their culture","a great loss"],"khl":["사람들의 정체성을 그들의 문화와 연결하는","큰 손실"],"blocks":[{"t":"pair","h":"이유와 결론 나란히","x":[["language plays a big role in connecting people’s identity to their culture","언어는 사람들의 정체성을 문화와 연결하는 데 큰 역할을 한다 (이유)"],["This would be a great loss","이것은 큰 손실이 될 것이다 (결론)"]]},{"t":"p","h":"언어는 나와 문화를 잇는 다리","x":["separating(분리하기)을 넣으면 언어가 정체성과 문화를 떼어 놓는다는 말이 된다.","떼어 놓는 것이 사라진다면 손실이 아니다.","게다가 separate(분리하다)는 보통 separate A from B(A를 B에서 분리하다)로 쓴다.","뒤의 to their culture(그들의 문화에)와 짝이 맞는 건 connect(연결하다)다."]}],"post":["connecting(연결하기) ↔ separating(분리하기)","언어 = 정체성과 문화를 잇는 다리"]},{"slots":[["currently"],["big","major","s"],["lost"],["achieve","undermine","a"],["accessible","available","s"]],"opts":["delay","oppose","forget","achieve"],"or":["delay(미루다): 목표를 미루려고 애쓴다는 건 바로 뒤의 적극적인 방법들과 안 맞음.","oppose(반대하다): 단체가 자기 목표에 반대한다는 모순이 생김.","forget(잊다): 목표를 잊으려고 애쓴다는 말은 언어를 지키는 활동과 정반대임.","achieve(달성하다): this(이것)는 언어 보존 목표이고, 뒤의 녹화·자료 공개가 그 목표를 이루는 방법이라 맞음."],"om":["미루다","반대하다","잊다","달성하다"],"en":"The organization works to achieve this by recording videos of individuals speaking these languages and making mother-tongue resources more accessible.","ko":"그 단체는 이 언어들을 말하는 개인들의 영상을 녹화하고 모국어 자료를 더 쉽게 이용할 수 있게 함으로써 이 목표를 이루려고 애쓴다.","hl":["works to achieve this","by recording videos"],"khl":["이 목표를 이루려고 애쓴다","영상을 녹화하고"],"blocks":[{"t":"tap","h":"위키텅스를 한 줄로","q":"이 단체는 무엇을 위해, 어떻게 일하는가?","a":["무엇을: 사라질 위험에 처한 모든 언어의 보존","어떻게: 사용자 영상 녹화 + 모국어 자료 공개","works to achieve this(이것을 달성하려고 애쓴다)의 this(이것)는 바로 그 목표다."]},{"t":"p","h":"undermine(약화시키다)이 틀린 이유","x":["undermine(약화시키다)을 넣으면 단체가 자기 목표를 망치려고 애쓴다는 말이 된다.","그런데 뒤에 나오는 방법은 모두 언어를 지키는 일이다.","방법과 목표가 정반대로 엇갈린다."]},{"t":"p","h":"함정","x":["major(주요한)는 big(큰) 자리에서 play a major role(주요한 역할을 하다)로 자연스럽다.","available(이용할 수 있는)은 accessible(접근 가능한) 자리에서 자료를 더 이용하기 쉽게 한다는 뜻이 통한다."]}],"post":["achieve(달성하다) ↔ undermine(약화시키다)","목표 = 언어 보존, 방법 = 녹화 + 자료 공개"]}],"quiz":[{"w":"lose","m":"잃다","it":[["polish","광을 내다","n"],["misplace","제자리에 두지 않아 잃어버리다","s"],["find","찾다","a"],["greet","인사하다","n"],["forfeit","(권리 등을) 잃다, 박탈당하다","s"],["gain","얻다","a"],["fold","접다","n"]]},{"w":"big","m":"큰","it":[["large","큰","s"],["sour","신","n"],["small","작은","a"],["major","주요한, 큰","s"],["oval","타원형의","n"],["little","작은","a"],["curly","곱슬곱슬한","n"]]},{"w":"accessible","m":"접근 가능한, 이용하기 쉬운","it":[["sleepy","졸린","n"],["available","이용할 수 있는","s"],["inaccessible","접근하기 어려운","a"],["noisy","시끄러운","n"],["reachable","닿을 수 있는, 접근 가능한","s"],["unavailable","이용할 수 없는","a"],["striped","줄무늬가 있는","n"]]},{"w":"connect","m":"연결하다","it":[["link","연결하다","s"],["melt","녹다","n"],["separate","분리하다","a"],["join","잇다, 연결하다","s"],["shout","소리치다","n"],["disconnect","연결을 끊다","a"],["rinse","헹구다","n"]]},{"w":"achieve","m":"달성하다, 이루다","it":[["sweep","쓸다","n"],["accomplish","완수하다, 성취하다","s"],["fail","실패하다","a"],["hum","콧노래를 부르다","n"],["attain","이루다, 달성하다","s"],["give up","포기하다","a"],["peel","껍질을 벗기다","n"]]}]}],"no":"본문 ❻"}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
