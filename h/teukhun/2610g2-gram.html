"39","title":"어법특훈 · 26년 10월 고2 39번","sub":"사회사학자들이 자료를 읽는 법","tpl":"Like all historians, social historians {draw|draw} from a variety of primary sources. Social history often {emphasizes|emphasizes} ordinary people rather than elites. Yet, in most places and times, non-elites {lacked|lacked} access to education and, thus, did not {produce|produce} substantial amounts of documentation. Even when they {did|did} produce documentation, these materials {rarely|rarely} ended up in archives {where|where} they could be {preserved|preserved} and {made|made} available to researchers. Because of such biases in the historical record, social historians have to be very {creative|creative} in {their|their} work. Like other historians, social historians analyze textual sources {produced|produced} by government officials, employers, and other elites. Yet rather than {simply|simply} {take|take} such sources at face value, they read {them|them} “against the grain”. So, for example, a social historian will read legal documents not only for the “facts” {provided|provided} by slaveowners; she will also {examine|examine} the silences, interruptions, rumors, and other details {that|that} {offer|offer} hints about the enslaved peoples’ attitudes and actions.","fn":[],"mean":{"draw":"가져와 쓰다, 끌어오다(동사원형·현재형)","draws":"가져와 쓰다(draw의 3인칭 단수 현재형)","drawing":"가져와 쓰는 것, 가져와 쓰는(draw의 -ing형)","to draw":"가져와 쓰는 것(draw의 to부정사)","having drawn":"가져와 쓰고 나서(draw의 완료 -ing형)","emphasizes":"강조하다(emphasize의 3인칭 단수 현재형)","emphasize":"강조하다(동사원형·현재형)","emphasizing":"강조하는 것, 강조하는(emphasize의 -ing형)","to emphasize":"강조하는 것(emphasize의 to부정사)","are emphasizing":"강조하고 있다(emphasize의 현재진행형, 복수 주어)","lacked":"부족했다(lack의 과거형)","produce":"생산하다(동사원형·현재형)","produced":"생산했다(produce의 과거형) / 생산된(produce의 과거분사형)","producing":"생산하는 것, 생산하는(produce의 -ing형)","to produce":"생산하는 것, 생산할(produce의 to부정사)","produces":"생산하다(produce의 3인칭 단수 현재형)","have produced":"생산해 왔다(produce의 현재완료형)","did":"정말로 ~했다(do의 과거형, 동사를 강조하는 조동사)","rarely":"거의 ~않다(부사)","rare":"드문, 희귀한(형용사)","rarity":"희귀함, 희귀한 것(명사)","rarer":"더 드문(rare의 비교급)","rarest":"가장 드문(rare의 최상급)","where":"그곳에서(장소를 받는 관계부사)","which":"~하는(관계대명사, 뒤에 빈자리가 있음)","what":"~하는 것(선행사를 품은 관계대명사)","whose":"~의(소유격 관계대명사)","who":"~하는(사람을 받는 주격 관계대명사)","whom":"~을(사람을 받는 목적격 관계대명사)","that":"~하는(관계대명사)","preserved":"보존된(preserve의 과거분사형)","made":"만들어진(make의 과거분사형) / 만들었다(make의 과거형)","making":"만드는(make의 -ing형)","creative":"창의적인(형용사)","creatively":"창의적으로(부사)","create":"창조하다(동사원형)","creation":"창조, 창작물(명사)","creativity":"창의성(명사)","their":"그들의(they의 소유격)","them":"그들을, 그것들을(they의 목적격)","they":"그들은, 그것들은(주격)","theirs":"그들의 것(소유대명사)","themselves":"그들 자신(they의 재귀대명사)","simply":"단순히(부사)","take":"받아들이다(동사원형)","provided":"제공된(provide의 과거분사형) / 제공했다(provide의 과거형)","providing":"제공하는(provide의 -ing형)","provides":"제공하다(provide의 3인칭 단수 현재형)","to provide":"제공할, 제공하는 것(provide의 to부정사)","provider":"제공자(명사)","examine":"조사하다(동사원형)","examining":"조사하는 것, 조사하는(examine의 -ing형)","examined":"조사했다(examine의 과거형) / 조사된(과거분사형)","examines":"조사하다(examine의 3인칭 단수 현재형)","to examine":"조사하는 것(examine의 to부정사)","offer":"제공하다(동사원형·현재형)","offers":"제공하다(offer의 3인칭 단수 현재형)","offering":"제공하는(offer의 -ing형)","to offer":"제공하는 것(offer의 to부정사)","has offered":"제공해 왔다(offer의 현재완료형, 단수 주어)","plays":"(악기를) 연주하다(play의 3인칭 단수 현재형)","playing":"연주하는 것, 연주하는(play의 -ing형)","written":"쓰인(write의 과거분사형)","writing":"쓰는(write의 -ing형)","sleep":"자다(동사원형·현재형)","sleeps":"자다(sleep의 3인칭 단수 현재형)","visit":"방문하다(동사원형)","visiting":"방문하는 것(visit의 -ing형)","make":"~하게 만들다(동사원형·현재형)","makes":"~하게 만들다(make의 3인칭 단수 현재형)","knew":"알았다(know의 과거형)","know":"알다(동사원형)","quiet":"조용한(형용사)","quietly":"조용히(부사)"},"sets":[{"items":[{"slots":[["draw","drawing","a","주어 social historians(사회사학자들) 뒤 진짜 동사 자리다. drawing(가져와 쓰는)은 동사 자리에 못 온다."],["emphasizes","","","주어 Social history(사회사)가 단수라 emphasizes(강조하다)."],["lacked","","","주어 non-elites(엘리트가 아닌 사람들)의 진짜 동사, 과거형 lacked(부족했다)."],["did","","","did(정말로 ~했다)는 동사 produce(생산하다)를 강조하는 말. 뒤는 동사원형."],["rarely","","","동사 ended up(결국 ~에 이르렀다)을 꾸미니 부사 rarely(거의 ~않다)."]],"opts":["draws","draw","to draw","having drawn"],"or":["draws(가져와 쓰다, 3인칭 단수형): 주어 social historians(사회사학자들)가 복수라 s를 붙이면 안 됨.","draw(가져와 쓰다): 주어 social historians(사회사학자들)의 진짜 동사이고 복수라 s가 없는 현재형이 맞음.","to draw(가져와 쓰는 것): to부정사는 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","having drawn(가져와 쓰고 나서): 완료 -ing형이라 동사 자리에 못 오고 문장이 끝나지 않음."],"point":"정동사 vs. 준동사","en":"Like all historians, social historians draw from a variety of primary sources.","ko":"모든 역사학자들과 마찬가지로, 사회사학자들은 다양한 원자료들을 가져와 쓴다.","hl":["social historians draw"],"khl":["사회사학자들은","가져와 쓴다"],"blocks":[{"t":"p","h":"문장에는 엔진이 하나 필요하다","x":["문장 하나에는 진짜 동사(엔진)가 꼭 있어야 한다.","Like all historians(모든 역사학자들처럼)는 앞에 붙은 꾸밈말이다.","주어 social historians(사회사학자들) 뒤에 올 엔진이 draw(가져와 쓰다)다.","drawing(가져와 쓰는)으로 바꾸면 엔진이 꺼져서 문장이 끝나지 않는다."]},{"t":"pair","h":"쉬운 예시","x":[["Like my dad, I love soccer.","아빠처럼 나도 축구를 정말 좋아한다. (주어 I(나) → 진짜 동사 love(좋아하다))"],["The kids playing outside are my friends.","밖에서 노는 아이들은 내 친구들이다. (playing(노는)은 꾸밈, 진짜 동사는 are(~이다))"]]}],"post":["주어(social historians = 사회사학자들) 뒤 엔진: draw(가져와 쓰다)"]},{"slots":[["lacked","","","주어 non-elites(엘리트가 아닌 사람들)의 진짜 동사, 과거형 lacked(부족했다)."],["did","","","did(정말로 ~했다)는 강조의 조동사. 뒤의 produce(생산하다)는 원형이 맞다."],["rarely","rare","a","동사 ended up(결국 ~에 이르렀다)을 꾸미는 자리. 형용사 rare(드문)는 동사를 꾸밀 수 없다."],["preserved","","","자료가 \"보존되는\" 쪽이라 be + p.p. preserved(보존된)."],["made","","","could be preserved and (be) made(만들어진). p.p.끼리 and(그리고)로 나란하다."]],"opts":["rarity","rarer","rarely","rarest"],"or":["rarity(희귀함, 희귀한 것): 명사라 동사를 꾸밀 수 없고, 주어 뒤에 명사가 또 붙어 문장이 깨짐.","rarer(더 드문): 형용사 비교급이라 동사 ended up(결국 ~에 이르렀다)을 꾸밀 수 없음.","rarely(거의 ~않다): 동사 ended up(결국 ~에 이르렀다)을 꾸미는 부사 자리라 맞음.","rarest(가장 드문): 형용사 최상급이라 동사를 꾸밀 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"Even when they did produce documentation, these materials rarely ended up in archives.","ko":"심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도, 이러한 자료들은 기록 보관소들에 거의 다다르지 못했다.","hl":["rarely ended up"],"khl":["거의 다다르지 못했다"],"blocks":[{"t":"p","h":"부사는 동사의 단짝","x":["rarely(거의 ~않다)는 \"얼마나 자주\"를 말해 주는 부사다.","꾸미는 대상은 동사 ended up(결국 ~에 이르렀다)이다.","rare(드문)는 형용사라 명사만 꾸민다. a rare bird(희귀한 새)처럼.","these materials rare ended up(이 자료들 드문 이르렀다)은 말이 안 된다.","자료가 보관소까지 \"거의 못 갔다\"는 것이 이 글의 출발점이다."]},{"t":"pair","h":"쉬운 예시","x":[["He rarely eats breakfast.","그는 아침을 거의 먹지 않는다. (동사 eats(먹는다)를 꾸미는 부사)"],["It is a rare stamp.","그것은 희귀한 우표다. (명사 stamp(우표)를 꾸미는 형용사)"]]}],"post":["동사 ended up(결국 이르다) 꾸미면 -ly: rarely(거의 ~않게)"]},{"slots":[["where","","","뒤 문장 they could be preserved(그것들이 보존될 수 있었다)가 완전해서 관계부사 where(그곳에서)."],["preserved","","","자료가 \"보존되는\" 쪽이라 be + p.p. preserved(보존된)."],["creative","","","be(~이다) 뒤 보어 자리라 형용사 creative(창의적인)."],["their","them","a","명사 work(작업) 앞은 \"누구의\"를 나타내는 소유격 자리다. them(그들을)은 목적격이라 못 온다."],["produced","","","자료가 관료들에 의해 \"생산된\" 쪽이라 p.p. produced(생산된)."]],"opts":["they","theirs","their","themselves"],"or":["they(그들은): 주격이라 명사 work(작업) 앞에 올 수 없음.","theirs(그들의 것): 혼자 쓰는 소유대명사라 뒤에 명사 work(작업)를 달 수 없음.","their(그들의): 명사 work(작업) 앞 소유격 자리이고 주인이 복수 social historians(사회사학자들)라 맞음.","themselves(그들 자신): 재귀대명사라 명사 앞에서 \"누구의\"를 나타낼 수 없음."],"point":"대명사의 성·수·격 일치","en":"Because of such biases in the historical record, social historians have to be very creative in their work.","ko":"역사적 기록에서의 그러한 편향들 때문에, 사회사학자들은 자신들의 작업에 있어서 매우 창의적이어야 한다.","hl":["social historians","their work"],"khl":["사회사학자들은","자신들의 작업"],"blocks":[{"t":"p","h":"주인 찾아 이름표 붙이기","x":["work(작업) 앞은 \"누구의\"를 밝히는 소유격 자리다.","이 작업의 주인은 social historians(사회사학자들), 여러 명이다.","여러 명의 것이면 their(그들의).","them(그들을)은 목적격이라 명사 앞에 설 수 없다."]},{"t":"pair","h":"쉬운 예시","x":[["The students opened their books.","학생들은 자기들의 책을 폈다. (주인 The students(학생들) → their(그들의))"],["I called them yesterday.","나는 어제 그들에게 전화했다. (동사 뒤 목적어 → them(그들을))"]]}],"post":["명사 work(작업) 앞은 소유격: their work(그들의 작업)"]},{"slots":[["simply","","","동사 take(받아들이다)를 꾸미니 부사 simply(단순히)."],["take","","","rather than(~하기보다) 뒤에 동사원형 take(받아들이다)가 왔다. 뒤의 동사 read(읽다)와 같은 원형 모양."],["them","","","복수 such sources(그러한 자료들)를 받는 목적격 them(그것들을)."],["provided","providing","a","\"사실\"은 스스로 제공하지 않는다. 노예 소유주들에 의해 \"제공된\" 쪽이고 뒤에 by(~에 의해)도 있다."],["examine","","","조동사 will(~할 것이다) 뒤라 동사원형 examine(조사하다)."]],"opts":["provided","provides","to provide","provider"],"or":["provided(제공된): 사실들이 노예 소유주들에 의해 \"제공되는\" 쪽이라 p.p.가 맞음.","provides(제공하다, 3인칭 단수형): 동사라 명사 뒤 꾸밈 자리에 못 오고, 진짜 동사 read(읽다)와 겹쳐 문장이 깨짐.","to provide(제공할): 뒤에 by slaveowners(노예 소유주들에 의해)가 있어 수동 뜻이 필요한데 능동이라 안 맞음.","provider(제공자): 명사라 명사 facts(사실들)를 뒤에서 꾸밀 수 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"A social historian will read legal documents not only for the “facts” provided by slaveowners.","ko":"어떤 사회사학자는 노예 소유주들에 의해 제공된 ‘사실들’을 얻기 위해서만 법적 문서들을 읽지는 않을 것이다.","hl":["the “facts” provided by slaveowners"],"khl":["노예 소유주들에 의해 제공된 ‘사실들’"],"blocks":[{"t":"p","h":"by(~에 의해)가 보이면 당하는 쪽","x":["facts(사실들)는 스스로 무언가를 제공하지 않는다.","노예 소유주들이 제공했고, 사실은 \"제공되는\" 쪽이다.","그래서 꾸밈말은 p.p. provided(제공된).","뒤의 by slaveowners(노예 소유주들에 의해)가 결정적인 힌트다.","providing(제공하는)을 쓰면 사실이 직접 무언가를 준다는 뜻이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I ate the cake made by my mom.","나는 엄마가 만든 케이크를 먹었다. (케이크는 만들어지는 쪽 → made(만들어진))"],["Look at the boy holding a flag.","깃발을 들고 있는 소년을 봐. (소년이 직접 듦 → holding(들고 있는))"]]}],"post":["사실은 제공되는 쪽: facts provided by(~에 의해 제공된 사실들)"]},{"slots":[["produced","","","자료가 관료들에 의해 \"생산된\" 쪽이라 p.p. produced(생산된)."],["them","","","복수 such sources(그러한 자료들)를 받는 목적격 them(그것들을)."],["provided","","","사실이 \"제공된\" 쪽이라 p.p. provided(제공된)."],["that","what","a","앞에 details(세부 사항들)라는 명사가 있다. 명사 뒤에서 꾸밀 땐 what(~하는 것)이 아니라 that(~하는)."],["offer","","","선행사 details(세부 사항들)가 복수라 offer(제공하다)."]],"opts":["that","who","whom","where"],"or":["that(~하는): 앞에 명사 details(세부 사항들)가 있고 뒤에 주어가 빠져 있어 관계대명사가 맞음.","who(~하는, 사람): 사람을 받는 관계대명사라 사물인 details(세부 사항들)를 받을 수 없음.","whom(~을, 사람): 사람을 받는 목적격이라 사물에 못 쓰고, 뒤에 빠진 것도 주어임.","where(그곳에서): 관계부사라 뒤가 완전한 문장이어야 하는데 주어가 빠져 있음."],"point":"that/which vs. what","en":"She will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.","ko":"그녀는 또한 노예가 된 사람들의 태도들과 행동들에 대한 힌트들을 제공하는 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 조사할 것이다.","hl":["other details that offer hints"],"khl":["힌트들을 제공하는"],"blocks":[{"t":"p","h":"what(~하는 것)은 혼자 다닌다","x":["what(~하는 것)은 이미 \"것\"이라는 명사를 품고 있다.","그래서 앞에 명사가 있으면 what(~하는 것)을 쓸 수 없다.","앞에 details(세부 사항들)라는 명사가 버티고 있다.","뒤에는 주어가 빠진 offer hints(힌트를 제공하다)가 온다.","명사 + 빈자리 있는 문장 = 관계대명사 that(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["I like the song that you sang.","나는 네가 부른 노래가 좋다. (앞에 명사 the song(노래)이 있음 → that)"],["I like what you sang.","나는 네가 부른 것이 좋다. (앞에 명사 없음 → what)"]]},{"t":"tap","h":"확인 질문","q":"that(~하는) 뒤 offer hints(힌트를 제공하다)에서 빠진 것은?","a":["주어가 빠져 있다.","빠진 주어는 앞의 details(세부 사항들)다."]}],"post":["명사(details = 세부 사항들) + that(~하는): what(~하는 것)은 불가"]}],"quiz":[{"s":"Like his brother, Minsu ___ the piano.","o":["plays","playing"],"a":0,"ko":"형처럼 민수도 피아노를 친다.","why":"주어 뒤 진짜 동사 자리라 plays(연주하다).","wy":"playing(연주하는 것): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐."},{"s":"My grandpa ___ watches TV.","o":["rarely","rare"],"a":0,"ko":"우리 할아버지는 TV를 거의 보지 않으신다.","why":"동사 watches(본다)를 꾸미니 부사 rarely(거의 ~않다).","wy":"rare(드문): 형용사라 동사 watches(본다)를 꾸밀 수 없음."},{"s":"My parents love ___ garden.","o":["them","their"],"a":1,"ko":"우리 부모님은 자기들의 정원을 아주 좋아하신다.","why":"명사 garden(정원) 앞 소유격 their(그들의).","wy":"them(그들을): 목적격이라 명사 garden(정원) 앞에 올 수 없음."},{"s":"This is a letter ___ by my friend.","o":["written","writing"],"a":0,"ko":"이것은 내 친구가 쓴 편지다.","why":"편지는 쓰이는 쪽이라 p.p. written(쓰인).","wy":"writing(쓰는): 편지가 직접 쓰는 뜻이 되고, 뒤의 by(~에 의해)와도 안 맞음."},{"s":"I found the key ___ opens this door.","o":["what","that"],"a":1,"ko":"나는 이 문을 여는 열쇠를 찾았다.","why":"명사 the key(열쇠) 뒤, 주어가 빠진 문장이라 that(~하는).","wy":"what(~하는 것): 앞에 명사 the key(열쇠)가 있어서 못 옴."}]},{"items":[{"slots":[["draw","","","주어 social historians(사회사학자들)가 복수라 draw(가져와 쓰다)."],["emphasizes","emphasize","a","주어 Social history(사회사)는 하나, 단수다. 현재형이면 동사에 s가 붙어야 한다."],["lacked","","","주어 non-elites(엘리트가 아닌 사람들)의 과거형 동사 lacked(부족했다)."],["produce","","","did not(~하지 않았다) 뒤라 동사원형 produce(생산하다)."],["did","","","did(정말로 ~했다)는 강조. 뒤 produce(생산하다)는 원형."]],"opts":["emphasizing","to emphasize","are emphasizing","emphasizes"],"or":["emphasizing(강조하는 것): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to emphasize(강조하는 것): to부정사는 동사 자리에 못 와서 문장이 끝나지 않음.","are emphasizing(강조하고 있다): are(~이다)는 복수 주어용이라 단수 Social history(사회사)와 안 맞음.","emphasizes(강조하다): 주어 Social history(사회사)가 단수이고 현재라 s가 붙은 형태가 맞음."],"point":"주어와 동사의 수일치","en":"Social history often emphasizes ordinary people rather than elites.","ko":"사회사는 대개 엘리트들보다 평범한 사람들을 강조한다.","hl":["Social history","emphasizes"],"khl":["사회사는","강조한다"],"blocks":[{"t":"p","h":"주어가 하나면 동사에 s","x":["Social history(사회사)는 학문 하나, 단수다.","주어가 3인칭 단수이고 현재면 동사에 s가 붙는다.","emphasize(강조하다)로 쓰면 주어가 여럿인 것처럼 된다.","often(대개)은 주어와 동사 사이에 끼어든 부사일 뿐이다.","바로 앞 문장의 social historians(사회사학자들)는 복수라 draw(가져와 쓰다). 사람과 학문을 구별하자."]},{"t":"pair","h":"쉬운 예시","x":[["My sister often reads at night.","언니는 밤에 자주 책을 읽는다. (주어 My sister(언니) → reads(읽는다))"],["My sisters often read at night.","언니들은 밤에 자주 책을 읽는다. (주어 My sisters(언니들) → read(읽는다))"]]}],"post":["단수 주어(Social history = 사회사) + emphasizes(강조하다)"]},{"slots":[["rarely","","","동사 ended up(결국 ~에 이르렀다)을 꾸미는 부사 rarely(거의 ~않다)."],["where","which","a","뒤 문장 they could be preserved(그것들이 보존될 수 있었다)에 빠진 것이 없다. which(~하는)는 빈자리가 있어야 쓴다."],["preserved","","","자료가 \"보존되는\" 쪽이라 be + p.p. preserved(보존된)."],["made","","","be preserved(보존되다)와 and(그리고)로 나란한 p.p. made(만들어진)."],["creative","","","be(~이다) 뒤 보어 자리라 형용사 creative(창의적인)."]],"opts":["where","what","whose","who"],"or":["where(그곳에서): 장소 archives(기록 보관소들) 뒤이고 뒤 문장이 완전해서 관계부사가 맞음.","what(~하는 것): 앞에 명사 archives(기록 보관소들)가 있어서 못 오고 뒤 문장도 완전함.","whose(~의): 뒤에 꾸밀 명사가 바로 와야 하는데 대명사 they(그것들)가 와서 안 됨.","who(~하는, 사람): 사람을 받는 관계대명사라 장소에 못 쓰고 뒤 문장도 완전함."],"point":"관계대명사 vs. 관계부사","en":"These materials rarely ended up in archives where they could be preserved and made available to researchers.","ko":"이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다.","hl":["archives where","they could be preserved"],"khl":["기록 보관소들","보존될 수 있고"],"blocks":[{"t":"p","h":"뒤 문장이 꽉 찼나 확인","x":["which(~하는)는 뒤 문장에 빈자리가 있어야 쓴다.","where(그곳에서)는 뒤 문장이 꽉 차 있을 때 쓴다.","they could be preserved(그것들이 보존될 수 있었다)에는 주어 they(그것들)와 동사가 다 있다.","빈자리가 없으니 which(~하는)는 탈락, where(그곳에서)가 맞다.","where(그곳에서) = in which(그 안에서)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the park where I met her.","여기가 내가 그녀를 만난 공원이다. (I met her(내가 그녀를 만났다)가 완전 → where)"],["This is the park which I visited.","여기가 내가 방문한 공원이다. (visited(방문했다) 뒤 목적어가 빠짐 → which)"]]},{"t":"tap","h":"확인 질문","q":"archives(기록 보관소들)는 장소인가?","a":["장소다.","장소 + 완전한 문장이면 where(그곳에서)."]}],"post":["장소(archives = 기록 보관소들) + where(그곳에서) + 완전한 문장"]},{"slots":[["their","","","명사 work(작업) 앞 소유격 their(그들의)."],["produced","producing","a","자료는 스스로 생산하지 않는다. 관료들에 의해 \"생산된\" 쪽이고 뒤에 by(~에 의해)도 있다."],["simply","","","동사 take(받아들이다)를 꾸미는 부사 simply(단순히)."],["take","","","rather than(~하기보다) 뒤에 동사원형 take(받아들이다)가 온 구조."],["them","","","복수 such sources(그러한 자료들)를 받는 them(그것들을)."]],"opts":["produces","to produce","produced","have produced"],"or":["produces(생산하다, 3인칭 단수형): 동사라 명사 sources(자료) 뒤 꾸밈 자리에 못 오고 동사 analyze(분석하다)와 겹침.","to produce(생산할): 뒤에 by(~에 의해)가 있어 수동 뜻이 필요한데 능동이라 안 맞음.","produced(생산된): 자료가 관료와 엘리트들에 의해 \"생산되는\" 쪽이라 p.p.가 맞음.","have produced(생산해 왔다): 동사라 꾸밈 자리에 못 오고, 이미 진짜 동사 analyze(분석하다)가 있음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.","ko":"다른 역사학자들처럼 사회사학자들은 정부 관료들, 고용주들, 그리고 다른 엘리트들에 의해 생산된 텍스트 자료를 분석한다.","hl":["textual sources produced by"],"khl":["에 의해 생산된 텍스트 자료"],"blocks":[{"t":"p","h":"자료가 만드나, 만들어지나","x":["textual sources(텍스트 자료)는 스스로 무언가를 생산하지 않는다.","관료와 고용주들이 만들었고, 자료는 \"생산된\" 쪽이다.","그래서 명사를 뒤에서 꾸미는 말은 p.p. produced(생산된).","producing(생산하는)을 쓰면 자료가 직접 만든다는 뜻이 된다.","by(~에 의해)가 뒤에 붙어 있으면 거의 p.p.다."]},{"t":"pair","h":"쉬운 예시","x":[["We ate bread baked by my grandma.","우리는 할머니가 구운 빵을 먹었다. (빵은 구워지는 쪽 → baked(구워진))"],["The man driving the bus is my uncle.","그 버스를 운전하는 남자는 우리 삼촌이다. (남자가 직접 운전 → driving(운전하는))"]]}],"post":["자료는 만들어지는 쪽: sources produced by(~에 의해 생산된 자료)"]},{"slots":[["take","","","rather than(~하기보다) 뒤 동사원형 take(받아들이다)."],["them","","","복수 such sources(그러한 자료들)를 받는 them(그것들을)."],["provided","","","사실이 노예 소유주들에 의해 \"제공된\" 쪽이라 p.p. provided(제공된)."],["examine","examining","a","조동사 will(~할 것이다) 뒤는 동사원형 자리다. examining(조사하는)은 못 온다."],["that","","","명사 details(세부 사항들) 뒤, 주어가 빠진 문장을 이끄는 that(~하는)."]],"opts":["examine","examined","examines","to examine"],"or":["examine(조사하다): 조동사 will(~할 것이다) 뒤 동사원형 자리라 맞음.","examined(조사했다, examine의 과거·과거분사형): will(~할 것이다) 뒤에 과거형은 못 오고, 그녀가 직접 조사하는 능동이라 p.p.도 안 됨.","examines(조사하다, 3인칭 단수형): 조동사 뒤에는 s가 붙지 않음.","to examine(조사하는 것): will(~할 것이다) 뒤에는 to 없이 동사원형이 와야 함."],"point":"정동사 vs. 준동사","en":"She will also examine the silences, interruptions, rumors, and other details.","ko":"그녀는 또한 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 조사할 것이다.","hl":["will also examine"],"khl":["조사할 것이다"],"blocks":[{"t":"p","h":"will(~할 것이다)은 원형을 데리고 다닌다","x":["will(~할 것이다), can(~할 수 있다), must(~해야 한다) 같은 조동사 뒤에는 동사원형만 온다.","also(또한)는 사이에 끼어든 부사라 건너뛰고 본다.","will also examine(또한 조사할 것이다)이 맞다.","examining(조사하는)을 쓰면 will(~할 것이다)이 짝을 잃고 진짜 동사가 사라진다.","사회사학자는 \"사실\"만이 아니라 침묵과 소문까지 들여다본다. 그 행동이 examine(조사하다)이다."]},{"t":"pair","h":"쉬운 예시","x":[["I will always remember you.","나는 너를 항상 기억할 것이다. (will + always(항상) + remember(기억하다))"],["She can also swim fast.","그녀는 수영도 빨리 할 수 있다. (can + also(또한) + swim(수영하다))"]]}],"post":["will(~할 것이다) + also(또한) + 동사원형 examine(조사하다)"]},{"slots":[["them","","","복수 such sources(그러한 자료들)를 받는 them(그것들을)."],["provided","","","사실이 \"제공된\" 쪽이라 p.p. provided(제공된)."],["examine","","","조동사 will(~할 것이다) 뒤 동사원형 examine(조사하다)."],["that","","","명사 details(세부 사항들) 뒤, 주어가 빠진 문장을 이끄는 that(~하는)."],["offer","offers","a","that(~하는) 앞의 details(세부 사항들)는 복수다. 그래서 offer(제공하다)에 s를 붙이면 안 된다 ggested that ‘Idle time is the devil’s workshop’ {implies|implies} that {those|those} with too much time on their hands may fill that time with troubling thoughts and behavior. The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time. Reflecting, just how {lucky|lucky} are we to be bored? Boredom doesn’t {exist|exist} in the presence of danger, as it is only an indulgence pastime in a safe zone. Boredom can {be_perceived|be perceived} as a luxury {that2|that} {typically|typically} {manifests|manifests} in safe and inactive situations, {providing|providing} an occasion to appreciate and comprehend the environment. In hazardous circumstances, the luxury of boredom is unavailable. Thus, it is paramount {to_utilize|to utilize} idle moments for profound self-reflection. It represents an occasion to listen, {observe|observe}, and appreciate before {expressing|expressing}. Rather than viewing boredom as {unproductive|unproductive}, it should {be_regarded|be regarded} as an opportunity for personal development and constructive contemplation.","fn":["*indulgence: 탐닉, 마음껏 즐김","*manifest: 나타나다","*paramount: 가장 중요한","*contemplation: 사색, 깊은 생각"],"mean":{"that":"~라는 것(명사절 접속사) / ~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","where":"~하는 곳(관계부사)","whose":"~의(소유격 관계대명사)","whom":"~을(목적격 관계대명사, 사람)","addressed":"다뤄진(address의 과거분사형)","addressing":"다루는(address의 -ing형)","address":"다루다(동사원형)","addresses":"다루다(address의 3인칭 단수 현재형)","to address":"다루는 것, 다루기 위해(address의 to부정사)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","be":"~이다(be동사 원형)","being":"~인 것, ~이면서(be의 -ing형)","to be":"~인 것, ~이 되기 위해(be의 to부정사)","searching":"찾는 것(search의 -ing형, 동명사)","dependent":"의존하는(형용사)","arise":"생기다, 일어나다(동사원형·현재형)","arises":"생기다(arise의 3인칭 단수 현재형)","arising":"생기는(arise의 -ing형)","arisen":"생긴(arise의 과거분사형)","to arise":"생기는 것(arise의 to부정사)","implies":"암시하다(imply의 3인칭 단수 현재형)","those":"~한 사람들(지시 서 p.p. addressed(다뤄진)가 맞다."],["is","","","주어는 the only way(유일한 방법), 단수라 is(~이다)가 맞다."],["searching","","","전치사 by(~함으로써) 뒤라서 동명사가 맞다."],["dependent","","","become(~이 되다) 뒤 보어 자리라 형용사 dependent(의존하는)가 맞다."]],"opts":["address","addressed","addresses","to address"],"or":["address(다루다): 접속사 if(~하면) 뒤에 주어 없이 동사원형만 올 수 없음.","addressed(다뤄진): if not(~하지 않으면) 뒤에 boredom is(무료함이 ~이다)가 생략된 자리이고, 무료함이 다뤄지는 쪽이라 p.p.가 맞음.","addresses(다루다, 3인칭 단수형): 주어가 빠진 채 동사가 오고, 뒤에 다룰 대상(목적어)도 없음.","to address(다루기 위해): if not(~하지 않으면) 뒤에 to부정사는 못 오고 뜻도 통하지 않음."],"point":"능동 v-ing vs. 수동 p.p.","en":"It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.","ko":"무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다.","hl":["if not adequately addressed","boredom"],"khl":["적절하게 다뤄지지 않는다면","무료함이"],"blocks":[{"t":"p","h":"숨은 주어 되살리기","x":["if not adequately addressed(적절히 다뤄지지 않으면)는 줄어든 말이다.","원래 모습: if it is not adequately addressed(그것이 적절히 다뤄지지 않으면).","숨은 주어 it(그것)은 boredom(무료함)이다.","무료함은 스스로 무엇을 다루지 않는다.","누군가에 의해 다뤄지는 쪽이라 p.p. addressed(다뤄진)."]},{"t":"pair","h":"쉬운 예시","x":[["If not stored well, milk goes bad.","잘 보관되지 않으면 우유는 상한다. (우유가 보관되는 쪽 → stored(보관된))"],["The letter was written by Mina.","그 편지는 미나가 썼다. (편지가 쓰이는 쪽 → written(쓰인))"]]}],"post":["if not (it is) addressed(다뤄지지 않으면): 숨은 주어 boredom(무료함)은 당하는 쪽 → p.p."]},{"slots":[["addressed","","","무료함이 \"다뤄지는\" 쪽이라 p.p.가 맞다."],["is","are","a","주어는 the only way(유일한 방법)다. to be happy(행복해지는)는 꾸미는 말일 뿐."],["searching","","","전치사 by(~함으로써) 뒤라 동명사가 맞다."],["arise","","","주어 negative thoughts and emotions(부정적인 생각과 감정)가 복수라 s 없는 arise(생기다)."],["those","","","\"~한 사람들\"을 뜻하는 those(사람들). 뒤에서 with(~을 가진)가 꾸민다."]],"opts":["be","is","being","to be"],"or":["be(~이다, 원형): that절 안에 주어가 있는데 동사원형만 오면 진짜 동사가 없어짐.","is(~이다): 주어 the only way(유일한 방법)가 단수라 단수 현재형 동사가 맞음.","being(~인 것): -ing는 혼자 동사 자리에 못 와서 that절에 동사가 없어짐.","to be(~인 것): to부정사도 동사 자리에 못 와서 that절의 동사가 비게 됨."],"point":"수식받는 주어의 수일치","en":"When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities.","ko":"우리가 행복해지는 유일한 방법이 재미있는 활동들을 찾는 것에 의해서만이라고 믿으면, 그때 우리는 그러한 활동들에 의존하게 된다.","hl":["the only way","is by searching"],"khl":["유일한 방법이","찾는 것에 의해서만이라고"],"blocks":[{"t":"p","h":"꼬리 자르고 머리 찾기","x":["주어 덩어리: the only way to be happy(행복해지는 유일한 방법).","머리는 way(방법) 하나다.","to be happy(행복해지는)는 way(방법)에 붙은 꼬리다.","꼬리를 잘라 내면 the only way is(유일한 방법은 ~이다)만 남는다.","머리가 하나라 is(~이다)."]},{"t":"pair","h":"쉬운 예시","x":[["The best way to make friends is to smile.","친구를 사귀는 가장 좋은 방법은 웃는 것이다. (머리 way(방법) → is(~이다))"],["The books on the desk are mine.","책상 위의 책들은 내 것이다. (머리 books(책들) → are(~이다))"]]}],"post":["꼬리(to be happy = 행복해지는) 떼고 머리(the only way = 유일한 방법) 보고 is(~이다)"]},{"slots":[["is","","","주어 the only way(유일한 방법)가 단수라 is(~이다)."],["arise","","","주어가 생각과 감정, 둘이라 arise(생기다)."],["implies","","","that절의 주어는 인용된 속담 한 문장이다. 하나로 보아 단수 동사 implies(암시하다)."],["those","them","a","may fill(채울 수도 있다)의 주어 자리다. 목적격 them(그들을)은 주어가 될 수 없다."],["lucky","","","be동사 are(~이다)의 보어 자리라 형용사 lucky(운이 좋은)."]],"opts":["that","it","this","those"],"or":["that(그것): 단수인 사물을 가리키는 말이라 their hands(그들의 손)와 안 맞고 사람들을 뜻할 수 없음.","it(그것): 단수인 사물을 가리키는 말이고, 뒤에서 with(~을 가진)로 꾸밈을 받지 못함.","this(이것): 단수 지시대명사라 \"~한 사람들\"이라는 뜻이 안 되고 their(그들의)와도 어긋남.","those(~한 사람들): with(~을 가진)의 꾸밈을 받아 \"~을 가진 사람들\"이 되고, 뒤의 their hands(그들의 손)와도 맞음."],"point":"대명사의 성·수·격 일치","en":"It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.","ko":"‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 자신의 손에 너무 많은 시간을 가진 사람들이 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을 암시한다고 일컬어진다.","hl":["those with too much time","may fill"],"khl":["너무 많은 시간을 가진 사람들이","채울 수 있다는"],"blocks":[{"t":"p","h":"those(사람들)는 꾸밈을 받는 주인","x":["those(~한 사람들)는 \"그런 사람들\"이라는 뜻의 대명사다.","뒤에 who(~하는)나 with(~을 가진)가 붙어 어떤 사람인지 알려 준다.","those with too much time(너무 많은 시간을 가진 사람들)이 하나의 주어다.","그 뒤 동사는 may fill(채울 수도 있다).","주어 자리에 목적격 them(그들을)은 못 온다."]},{"t":"pair","h":"쉬운 예시","x":[["Those with tickets can come in.","표를 가진 사람들은 들어올 수 있다. (주어 Those(사람들))"],["I helped them.","나는 그들을 도왔다. (목적어 자리 → them(그들을))"]]}],"post":["주어 자리 사람들: those with ~(~을 가진 사람들), them(그들을) 금지"]},{"slots":[["lucky","","","be동사 are(~이다)의 보어라 형용사 lucky(운이 좋은)."],["exist","","","doesn’t(~하지 않는다) 뒤라 동사원형 exist(존재하다)."],["be_perceived","perceive","a","무료함은 사치로 \"여겨지는\" 쪽이다. 뒤에 목적어도 없으니 수동태가 맞다."],["that2","","","명사 a luxury(사치)를 꾸미는 주격 관계대명사 that(~하는)이다."],["manifests","","","선행사 a luxury(사치)가 단수라 manifests(나타나다)."]],"opts":["be perceiving","perceives","be perceived","to perceive"],"or":["be perceiving(인식하고 있다): 무료함이 무언가를 인식하는 능동 뜻이 되는데 뒤에 목적어가 없음.","perceives(인식하다, 3인칭 단수형): 조동사 can(~할 수 있다) 뒤에는 s 붙은 동사가 못 옴.","be perceived(인식되다): 무료함이 사치로 인식되는 쪽이고 뒤에 목적어가 없어 수동태가 맞음.","to perceive(인식하는 것): 조동사 can(~할 수 있다) 뒤에는 to 없이 원형이 와야 함."],"point":"능동태 vs. 수동태","en":"Boredom can be perceived as a luxury that typically manifests in safe and inactive situations.","ko":"무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있다.","hl":["Boredom can be perceived as a luxury"],"khl":["무료함은","사치로 인식될 수 있다"],"blocks":[{"t":"p","h":"목적어 빈자리 확인","x":["perceive(인식하다)는 \"무엇을\" 인식하는지가 꼭 필요한 동사다.","능동이면 perceive A as B(A를 B로 인식하다) 모양이 된다.","그런데 can(~할 수 있다) 뒤에 바로 as a luxury(사치로)가 온다.","\"무엇을\"이 비어 있다. 주어 Boredom(무료함)이 그 \"무엇을\"이다.","그래서 be perceived(인식되다)."]},{"t":"pair","h":"쉬운 예시","x":[["People see him as a hero.","사람들은 그를 영웅으로 본다. (능동: him(그를)이 목적어)"],["He is seen as a hero.","그는 영웅으로 여겨진다. (수동: 목적어 him(그를)이 주어 He(그)로 이동)"]]}],"post":["perceive A as B(A를 B로 인식하다) → A can be perceived as B(A는 B로 인식될 수 있다)"]},{"slots":[["typically","","","동사 manifests(나타나다)를 꾸미니 부사 typically(보통)."],["providing","","","진짜 동사는 can be perceived(인식될 수 있다). 콤마 뒤 덧붙임이라 -ing."],["to_utilize","","","가주어 it(그것)의 진짜 주어 자리라 to utilize(활용하는 것)."],["observe","observing","a","to listen, observe, and appreciate(듣고, 관찰하고, 감상하는 것). to 하나에 원형 셋이 나란히 묶여 있다."],["expressing","","","전치사 before(~ 전에) 뒤라 동명사 expressing(표현하는 것)."]],"opts":["observe","observes","observed","observation"],"or":["observe(관찰하다): to listen(듣는 것)의 to를 같이 쓰는 동사원형이라 listen(듣다), appreciate(감상하다)와 모양이 맞음.","observes(관찰하다, 3인칭 단수형): to 뒤에는 s 붙은 동사가 못 오고 양옆 원형과 모양이 어긋남.","observed(관찰했다, 과거·과거분사형): to 뒤 원형 자리에 안 맞고 listen(듣다), appreciate(감상하다)와 짝이 깨짐.","observation(관찰): 명사라 동사원형 listen(듣다), appreciate(감상하다)와 나란히 설 수 없음."],"point":"병렬구조","en":"It represents an occasion to listen, observe, and appreciate before expressing.","ko":"그것은 표현하기 전에 경청하고, 관찰하고, 그리고 인식할 기회를 의미한다.","hl":["to listen, observe, and appreciate"],"khl":["경청하고, 관찰하고, 그리고 인식할"],"blocks":[{"t":"p","h":"to 하나로 셋을 묶는다","x":["A, B, and C처럼 셋을 나열하면 셋 모두 같은 모양이다.","to listen(듣는 것), (to) observe(관찰하는 것), and (to) appreciate(감상하는 것).","앞의 to 하나를 셋이 같이 쓴다.","그래서 가운데도 동사원형 observe(관찰하다).","가운데만 observing(관찰하는 것)이면 줄이 비뚤어진다."]},{"t":"pair","h":"쉬운 예시","x":[["I like to read, draw, and sing.","나는 읽고, 그리고, 노래하는 것을 좋아한다. (to + 원형 셋)"],["She likes reading, drawing, and singing.","그녀는 읽기, 그리기, 노래하기를 좋아한다. (-ing 셋)"]]}],"post":["to listen, observe, and appreciate(듣고, 관찰하고, 감상하는 것): to 하나 + 원형 셋"]}],"quiz":[{"s":"If not ___ soon, the problem will get worse.","o":["solving","solved"],"a":1,"ko":"곧 해결되지 않으면 그 문제는 더 나빠질 것이다.","why":"숨은 주어 the problem(그 문제)은 해결되는 쪽이라 p.p.","wy":"solving(해결하는): 문제가 스스로 무언가를 해결하는 뜻이 되고 목적어도 없음."},{"s":"The best way to learn English ___ to read a lot.","o":["are","is"],"a":1,"ko":"영어를 배우는 가장 좋은 방법은 많이 읽는 것이다.","why":"머리는 The best way(가장 좋은 방법), 단수라 is(~이다).","wy":"are(~이다): 복수 동사라 단수 주어 The best way(가장 좋은 방법)와 안 맞음."},{"s":"___ who study hard will pass the test.","o":["Those","Them"],"a":0,"ko":"열심히 공부하는 사람들은 시험에 합격할 것이다.","why":"주어 자리의 \"~하는 사람들\"은 Those(사람들).","wy":"Them(그들을): 목적격이라 주어 자리에 못 옴."},{"s":"The song can ___ all over the world.","o":["hear","be heard"],"a":1,"ko":"그 노래는 전 세계에서 들릴 수 있다.","why":"노래는 들리는 쪽이라 수동태.","wy":"hear(듣다): 노래가 직접 무언가를 듣는 뜻이 되고 목적어도 없음."},{"s":"I want to sing, dance, and ___ all day.","o":["playing","play"],"a":1,"ko":"나는 하루 종일 노래하고, 춤추고, 놀고 싶다.","why":"to sing(노래하는 것), dance(춤추는 것)와 같은 원형.","wy":"playing(노는 것): 앞의 to + 원형 sing(노래하다), dance(춤추다)와 모양이 안 맞음."}]},{"items":[{"slots":[["searching","","","전치사 by(~함으로써) 뒤라 동명사."],["dependent","","","become(~이 되다) 뒤 보어라 형용사."],["arise","arises","a","주어는 negative thoughts and emotions(부정적인 생각과 감정). and(그리고)로 묶인 복수다."],["implies","","","인용된 속담 한 문장이 주어라 단수 동사 implies(암시하다)."],["those","","","with(~을 가진)의 꾸밈을 받는 those(사람들)."]],"opts":["arise","arising","arisen","to arise"],"or":["arise(생기다): 주어 negative thoughts and emotions(부정적인 생각과 감정)가 복수라 s 없는 현재형이 맞음.","arising(생기는): -ing는 혼자 동사 자리에 못 와서 and(그리고) 뒤 문장에 동사가 없어짐.","arisen(생긴, 과거분사형): have(~했다) 없이 혼자 동사가 될 수 없음.","to arise(생기는 것): to부정사는 동사 자리에 못 와서 주어 뒤 동사가 비게 됨."],"point":"주어와 동사의 수일치","en":"Then we become dependent on those activities, and negative thoughts and emotions arise.","ko":"그때 우리는 그러한 활동들에 의존하게 되고, 부정적인 생각들과 감정들이 생긴다.","hl":["negative thoughts and emotions arise"],"khl":["부정적인 생각들과 감정들이 생긴다"],"blocks":[{"t":"p","h":"and(그리고)는 더하기","x":["thoughts(생각들) and emotions(감정들). 둘을 더하면 복수다.","게다가 thoughts(생각들)도 emotions(감정들)도 이미 s가 붙은 복수다.","복수 주어의 현재형 동사에는 s를 붙이지 않는다.","그래서 arise(생기다)."]},{"t":"pair","h":"쉬운 예시","x":[["My brother and I play soccer.","형과 나는 축구를 한다. (둘이라 play(하다))"],["My brother plays soccer.","형은 축구를 한다. (하나라 plays(하다))"]]}],"post":["A and B(A와 B) = 복수: thoughts and emotions arise(생각과 감정이 생긴다)"]},{"slots":[["those","","","주어 자리의 those(~한 사람들)."],["lucky","luckily","a","how(얼마나) 뒤 단어는 are we(우리가 ~이다)의 보어다. be동사의 보어는 형용사."],["exist","","","doesn’t(~하지 않는다) 뒤 동사원형."],["be_perceived","","","무료함이 \"인식되는\" 쪽이라 수동태."],["typically","","","manifests(나타나다)를 꾸미는 부사."]],"opts":["lucky","luck","luckier","fortunately"],"or":["lucky(운이 좋은): we are lucky(우리는 운이 좋다)에서 lucky가 how(얼마나)와 함께 앞으로 나온 것이라 형용사가 맞음.","luck(운): 명사라 how(얼마나) 바로 뒤에서 정도를 물을 수 없음.","luckier(더 운이 좋은): how(얼마나) 뒤에 비교급은 바로 못 오고 how much luckier(얼마나 더 운이 좋은)처럼 써야 함.","fortunately(다행히도): 부사라 be동사 are(~이다)의 보어가 될 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"Reflecting, just how lucky are we to be bored?","ko":"곰곰이 생각해 보면 우리가 무료할 수 있어서 정말 얼마나 행운인가?","hl":["how lucky are we"],"khl":["얼마나 행운인가"],"blocks":[{"t":"p","h":"원래 자리로 돌려놓기","x":["how(얼마나)는 뒤 단어를 끌고 맨 앞으로 나온다.","돌려놓으면: we are lucky(우리는 운이 좋다).","are(~이다) 뒤에서 주어의 상태를 말하는 말이다.","be동사 뒤 상태 자리는 형용사 자리.","그래서 luckily(운 좋게도)가 아니라 lucky(운이 좋은)."]},{"t":"pair","h":"쉬운 예시","x":[["How tall is he?","그는 키가 얼마나 크니? (he is tall = 그는 키가 크다 → 형용사 tall(키가 큰))"],["How fast does he run?","그는 얼마나 빨리 달리니? (he runs fast = 그는 빨리 달린다 → 동사 runs(달린다)를 꾸미는 부사)"]]},{"t":"tap","h":"확인 질문","q":"how(얼마나) 뒤 단어가 형용사인지 부사인지 어떻게 아나?","a":["문장을 원래 순서로 돌려 본다.","be동사 뒤 상태면 형용사, 일반동사를 꾸미면 부사."]}],"post":["how lucky are we(우리는 얼마나 운이 좋은가) = we are lucky(우리는 운이 좋다) → 형용사"]},{"slots":[["exist","","","doesn’t(~하지 않는다) 뒤 원형."],["be_perceived","","","무료함이 \"인식되는\" 쪽이라 수동태."],["that2","what","a","앞에 명사 a luxury(사치)가 있다. 명사를 뒤에서 꾸밀 땐 what(~하는 것)이 아니라 that(~하는)."],["typically","","","동사 manifests(나타나다)를 꾸미는 부사."],["manifests","","","선행사 a luxury(사치)가 단수라 manifests(나타나다)."]],"opts":["where","whose","that","whom"],"or":["where(~하는 곳): 관계부사라 뒤에 완전한 문장이 와야 하는데 manifests(나타나다)의 주어가 비어 있음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 부사 typically(보통)가 와서 안 됨.","that(~하는): 명사 a luxury(사치)를 꾸미고, 뒤에 주어가 빠져 있어 주격 관계대명사가 맞음.","whom(~을): 목적격이라 주어 빈자리를 채울 수 없고, a luxury(사치)는 사람도 아님."],"point":"that/which vs. what","en":"Boredom can be perceived as a luxury that typically manifests in safe and inactive situations.","ko":"무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있다.","hl":["a luxury that typically manifests"],"khl":["전형적으로 나타나는 사치로"],"blocks":[{"t":"p","h":"명사가 앞에 있나 먼저 본다","x":["what(~하는 것) 안에는 이미 \"것\"이라는 명사가 들어 있다.","그래서 what 앞에 명사가 또 오면 명사가 둘이 된다.","여기는 a luxury(사치)라는 명사가 앞에 있다.","그 명사를 뒤에서 꾸미는 말은 that(~하는) 또는 which(~하는).","뒤에 주어가 빠졌으니 주격 that(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the cake that I made.","이것은 내가 만든 케이크다. (명사 the cake(케이크) + that)"],["This is what I made.","이것이 내가 만든 것이다. (앞에 명사 없이 what)"]]}],"post":["명사(a luxury = 사치) + that(~하는) + 주어 빠진 문장"]},{"slots":[["that2","","","a luxury(사치)를 꾸미는 주격 관계대명사."],["manifests","","","선행사 a luxury(사치)가 단수."],["providing","provides","a","이 문장의 진짜 동사는 can be perceived(인식될 수 있다)다. 접속사 없이 콤마 뒤에 동사를 또 붙일 수 없다."],["to_utilize","","","가주어 it(그것)의 진짜 주어 to부정사."],["observe","","","listen(듣다), appreciate(감상하다)와 나란한 원형."]],"opts":["provide","had provided","will provide","providing"],"or":["provide(제공하다): 접속사 없이 콤마 뒤에 동사가 하나 더 생겨 문장이 깨짐.","had provided(제공했었다): 과거완료도 진짜 동사라 접속사 없이 붙일 수 없음.","will provide(제공할 것이다): 미래형도 진짜 동사라 접속사 없이 콤마 뒤에 올 수 없음.","providing(제공하면서): 진짜 동사가 이미 있어 콤마 뒤 덧붙임은 분사구문 -ing가 맞음."],"point":"정동사 vs. 준동사","en":"Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment.","ko":"무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있으며, 환경을 인식하고 이해할 기회를 제공한다.","hl":["can be perceived","providing"],"khl":["인식될 수 있으며","제공한다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["큰 문장의 진짜 동사: can be perceived(인식될 수 있다).","manifests(나타나다)는 that(~하는)이 이끄는 꾸밈 문장 속 동사다.","콤마 뒤에 provides(제공하다)를 쓰면 접속사 없이 동사가 또 생긴다.","동사 옷을 벗긴 providing(제공하면서)으로 붙여야 한다.","providing(제공하면서) = and it provides(그리고 그것은 제공한다)."]},{"t":"pair","h":"쉬운 예시","x":[["He sat on the bench, eating bread.","그는 빵을 먹으면서 벤치에 앉아 있었다. (eating = 덧붙임)"],["The sun rose, making the sky red.","해가 떠서 하늘을 붉게 만들었다. (making = 덧붙임)"]]}],"post":["동사 자리 끝났으면 콤마 뒤는 -ing: ..., providing(제공하면서)"]},{"slots":[["to_utilize","","","가주어 it(그것)의 진짜 주어."],["observe","","","to 하나에 원형 셋이 나란히."],["expressing","express","a","before(~ 전에)는 여기서 전치사다. 전치사 뒤에 동사를 쓰려면 -ing."],["unproductive","","","view A as B(A를 B로 여기다)의 B 자리. 형용사 unproductive(비생산적인)."],["be_regarded","","","주어 it(무료함)이 기회로 \"여겨지는\" 쪽이라 수동태."]],"opts":["expresses","expressing","expressed","to express"],"or":["expresses(표현하다, 3인칭 단수형): 접속사 before(~하기 전에)로 보더라도 주어가 없어 동사만 올 수 없음.","expressing(표현하는 것, 동명사): 전치사 before(~ 전에) 뒤라 동명사가 맞음.","expressed(표현했다, 과거·과거분사형): 주어 없이 동사가 올 수 없고, 표현하는 쪽이라 p.p.도 안 맞음.","to express(표현하는 것): 전치사 before(~ 전에) 뒤에 to부정사는 못 옴."],"point":"전치사 + 동명사","en":"It represents an occasion to listen, observe, and appreciate before expressing.","ko":"그것은 표현하기 전에 경청하고, 관찰하고, 그리고 인식할 기회를 의미한다.","hl":["before expressing"],"khl":["표현하기 전에"],"blocks":[{"t":"p","h":"before(~ 전에)의 두 얼굴","x":["접속사 before(~하기 전에): 뒤에 주어 + 동사가 온다. before I speak(내가 말하기 전에).","전치사 before(~ 전에): 뒤에 명사나 -ing가 온다. before dinner(저녁 전에).","여기는 뒤에 주어가 없다.","그래서 전치사 before(~ 전에) + expressing(표현하는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["Think before speaking.","말하기 전에 생각해라. (before(~ 전에) + -ing)"],["Think before you speak.","말하기 전에 생각해라. (before(~하기 전에) + 주어 you(너) + 동사)"]]}],"post":["주어 없으면 before(~ 전에) + -ing: before expressing(표현하기 전에)"]}],"quiz":[{"s":"Mina and her friend ___ in the same town.","o":["live","lives"],"a":0,"ko":"미나와 그녀의 친구는 같은 동네에 산다.","why":"Mina and her friend(미나와 그녀의 친구)는 둘이라 복수.","wy":"lives(살다, 3인칭 단수형): 주어가 and(그리고)로 묶인 복수라 s를 붙이면 안 됨."},{"s":"How ___ she looks today!","o":["happy","happily"],"a":0,"ko":"오늘 그녀는 얼마나 행복해 보이는지!","why":"she looks happy(그녀는 행복해 보인다). looks(~해 보이다) 뒤 상태는 형용사.","wy":"happily(행복하게): 부사라 looks(~해 보이다) 뒤 상태 자리에 못 옴."},{"s":"I have a dog ___ loves balls.","o":["what","that"],"a":1,"ko":"나는 공을 아주 좋아하는 개를 키운다.","why":"명사 a dog(개) 뒤, 주어가 빠진 문장이라 that.","wy":"what(~하는 것): 앞에 명사 a dog(개)가 있어서 못 옴."},{"s":"She sat by the window, ___ a book.","o":["reads","reading"],"a":1,"ko":"그녀는 책을 읽으며 창가에 앉아 있었다.","why":"동사 sat(앉았다)이 있으니 덧붙임은 -ing.","wy":"reads(읽다): 접속사 없이 동사 sat(앉았다) 뒤에 동사가 또 올 수 없음."},{"s":"Wash your hands before ___ dinner.","o":["eating","eat"],"a":0,"ko":"저녁을 먹기 전에 손을 씻어라.","why":"주어가 없으니 전치사 before(~ 전에) + -ing.","wy":"eat(먹다): 전치사 before(~ 전에) 뒤에 동사원형은 못 옴."}]}],"comp":[{"no":"41-42","slots":[["manifests","","","선행사 a luxury(사치)가 단수라 manifests(나타나다)."],["providing","","","진짜 동사가 이미 있어 콤마 뒤 덧붙임은 -ing."],["to_utilize","utilize","a","it is paramount(가장 중요하다) 뒤 진짜 주어 자리다. 동사원형은 주어가 될 수 없으니 to utilize(활용하는 것)."],["observe","","","listen(듣다), appreciate(감상하다)와 나란한 원형."],["unproductive","","","view A as B(A를 B로 여기다)의 B 자리라 형용사."]],"opts":["to utilize","utilizes","utilized","utilization"],"or":["to utilize(활용하는 것): 가주어 it(그것)이 가리키는 진짜 주어 자리라 to부정사가 맞음.","utilizes(활용하다, 3인칭 단수형): is(~이다)라는 동사가 이미 있어 동사가 겹침.","utilized(활용했다, 과거·과거분사형): 동사가 겹치거나, 뒤 목적어 idle moments(한가한 순간들)와 연결이 안 됨.","utilization(활용): 명사라 뒤의 목적어 idle moments(한가한 순간들)를 바로 받을 수 없음."],"point":"가주어 it + 진주어 to부정사","en":"Thus, it is paramount to utilize idle moments for profound self-reflection.","ko":"따라서, 심오한 자기 성찰을 위해 아무것도 안 하는 순간들을 활용하는 것은 가장 중요하다.","hl":["it is paramount to utilize"],"khl":["활용하는 것은 가장 중요하다"],"blocks":[{"t":"p","h":"it(그것)은 자리만 맡아 둔 가짜","x":["주어가 길면 뒤로 보내고 앞에 it(그것)을 세운다.","it(그것)은 뜻이 없는 자리 맡기용이다.","진짜 주어: to utilize idle moments(한가한 순간들을 활용하는 것).","주어가 되려면 명사 역할을 하는 to부정사나 -ing가 필요하다.","동사원형 utilize(활용하다)만으로는 주어가 될 수 없다."]},{"t":"pair","h":"쉬운 예시","x":[["It is fun to play soccer.","축구를 하는 것은 재미있다. (진짜 주어 to play soccer(축구를 하는 것))"],["It is hard to wake up early.","일찍 일어나는 것은 어렵다. (진짜 주어 to wake up early(일찍 일어나는 것))"]]},{"t":"tap","h":"확인 질문","q":"it(그것) 자리에 진짜 주어를 넣어 보면?","a":["To utilize idle moments is paramount.(한가한 순간들을 활용하는 것이 가장 중요하다.)","주어 자리라 to부정사여야 말이 된다."]}],"post":["it is paramount(가장 중요하다) + to utilize(활용하는 것) = 가주어 + 진주어"]},{"no":"41-42","slots":[["that","","","recognize(인식하다)의 목적어가 되는 that(~라는 것)절."],["dependent","","","become(~이 되다) 뒤 보어라 형용사."],["typically","","","manifests(나타나다)를 꾸미는 부사."],["expressing","","","전치사 before(~ 전에) 뒤 동명사."],["be_regarded","regard","a","주어 it(그것)은 boredom(무료함)이다. 무료함은 기회로 \"여겨지는\" 쪽이고 뒤에 목적어도 없다."]],"opts":["be regarding","be regarded","regards","to regard"],"or":["be regarding(여기고 있다): 무료함이 무언가를 여기는 능동 뜻이 되는데 뒤에 목적어가 없음.","be regarded(여겨지다): 무료함이 기회로 여겨지는 쪽이고 뒤에 목적어가 없어 수동태가 맞음.","regards(여기다, 3인칭 단수형): 조동사 should(~해야 한다) 뒤에는 s 붙은 동사가 못 옴.","to regard(여기는 것): 조동사 should(~해야 한다) 뒤에는 to 없이 원형이 와야 함."],"point":"능동태 vs. 수동태","en":"Rather than viewing boredom as unproductive, it should be regarded as an opportunity for personal development and constructive contemplation.","ko":"무료함을 비생산적이라고 여기기보다, 그것은 개인적 발달과 건설적인 사유를 위한 기회로 여겨져야 한다.","hl":["it should be regarded as an opportunity"],"khl":["그것은","기회로 여겨져야 한다"],"blocks":[{"t":"p","h":"누가 누구를 여기나","x":["regard A as B(A를 B로 여기다): 여기는 대상 A가 바로 뒤에 온다.","능동이면 regard(여기다) 뒤에 \"무엇을\"이 바로 와야 한다.","그런데 should(~해야 한다) 뒤에 바로 as an opportunity(기회로)가 온다.","\"무엇을\"에 해당하는 it(무료함)이 주어로 올라갔다.","그래서 be regarded(여겨지다)."]},{"t":"pair","h":"쉬운 예시","x":[["We regard him as a friend.","우리는 그를 친구로 여긴다. (능동: him(그를)이 목적어)"],["He is regarded as a friend.","그는 친구로 여겨진다. (수동: as(~로) 바로 앞에 목적어 없음)"]]}],"post":["regard A as B(A를 B로 여기다) → it should be regarded as B(그것은 B로 여겨져야 한다)"]}],"compquiz":[{"s":"It is important ___ enough sleep.","o":["get","to get"],"a":1,"ko":"충분히 자는 것은 중요하다.","why":"가주어 It(그것)의 진짜 주어라 to부정사.","wy":"get(얻다): 동사원형은 진짜 주어가 될 수 없고 is(~이다)와 동사가 겹침."},{"s":"This book should ___ by everyone.","o":["read","be read"],"a":1,"ko":"이 책은 모든 사람에게 읽혀야 한다.","why":"책은 읽히는 쪽이라 수동태.","wy":"read(읽다): 책이 직접 읽는 뜻이 되고, by everyone(모든 사람에 의해)과도 안 맞음."}]}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+'번<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+'번 · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+'번 지문</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
