 side of the world. As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby {buffered|buffered} from the effects of errors outside {their|their} walls. That is no longer the case. The digitization of massive amounts of information {has|has} continued to grow enormously as the cost of computing power has decreased. The development of smart systems {that|that} {communicate|communicate} {autonomously|autonomously} {gave|gave} rise to an infinite variety of potential breakdowns. This interdependence is a breeding ground for complex failure. As Rita puts it, when “things that used to be {kept|kept} separate {bump|bump} up against each other, it becomes {far|far} more difficult to predict {what|what}’s going to happen next.” Information technology creates new vulnerabilities {because|because} interconnectedness instantly {spreads|spreads} the impact of small failures.","fn":["*buffer: 완충하다, (충격으로부터) 보호하다","*breeding ground: 온상"],"mean":{"making":"만들면서(make의 -ing형, 분사구문)","made":"만들었다(make의 과거형·과거분사형)","makes":"만들다(make의 3인칭 단수 현재형)","make":"만들다(동사원형)","have made":"만들어 왔다(make의 현재완료형)","going":"~하게 되는 것(go의 -ing형, 동명사)","go":"가다, ~하게 되다(동사원형)","gone":"간, ~하게 된(go의 과거분사형)","goes":"가다(go의 3인칭 단수 현재형)","went":"갔다(go의 과거형)","links":"연결하다(link의 3인칭 단수 현재형)","link":"연결하다(동사원형·복수 주어 현재형)","linking":"연결하는(link의 -ing형)","to link":"연결하는 것(link의 to부정사)","have linked":"연결해 왔다(link의 현재완료형, 복수 주어)","us":"우리를(we의 목적격)","we":"우리는(주격)","our":"우리의(we의 소유격)","I":"나는(주격)","he":"그는(주격)","vulnerable":"취약한(형용사)","vulnerably":"취약하게(부사)","to be vulnerable":"취약한 것(to부정사 + 형용사)","being vulnerable":"취약한 것(being + 형용사)","been vulnerable":"취약했던(be의 과거분사형 + 형용사)","taking":"일어나는(take의 -ing형, take place = 일어나다)","taken":"취해진(take의 과거분사형)","takes":"취하다(take의 3인칭 단수 현재형)","took":"취했다(take의 과거형)","has taken":"취해 왔다(take의 현재완료형)","buffered":"보호된(buffer의 과거분사형)","their":"그들의, 그것들의(they의 소유격)","has":"~해 왔다(현재완료를 만드는 조동사, 3인칭 단수)","have":"~해 왔 ,"that(~하는): 선행사 smart systems(스마트 시스템들)를 받고 뒤에 주어가 빠진 주격 관계대명사라 맞음."],"point":"that/which vs. what","en":"The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.","ko":"자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장들을 초래했다.","hl":["smart systems that communicate"],"khl":["자율적으로 소통하는 스마트 시스템"],"blocks":[{"t":"p","h":"what(~하는 것)은 명사를 이미 품었다","x":["what(~하는 것) = the thing that(~하는 것). 안에 명사가 들어 있다.","smart systems what(스마트 시스템들 ~하는 것)이라 하면 명사가 둘이 된다.","앞에 명사가 있으면 그 명사를 받는 that(~하는)이나 which(~하는)를 쓴다.","뒤에 communicate(소통하다)의 주어가 빠졌으니 주격 관계대명사."]},{"t":"pair","h":"쉬운 예시","x":[["I have a phone that takes good pictures.","나는 사진이 잘 찍히는 휴대폰을 가지고 있다. (명사 a phone(휴대폰) + that)"],["What I need is sleep.","내가 필요한 것은 잠이다. (명사 없이 What(~하는 것))"]]}],"post":["명사 smart systems(스마트 시스템들) 뒤는 that(~하는), 명사 없으면 what(~하는 것)"]},{"slots":[["going","","","making(만들면서)의 목적어 자리 동명사."],["their","","","institutions(기관들)를 받는 복수 소유격."],["autonomously","","","동사 communicate(소통하다)를 꾸미는 부사."],["bump","bumps","a","주어는 things(것들), 복수다. that used to be kept separate(분리되어 있던)는 꼬리표."],["what","","","predict(예측하다)의 목적어, 뒤에 주어가 빠져 what(~하는 것)."]],"opts":["bumping","bump","to bump","has bumped"],"or":["bumping(부딪치는): -ing는 혼자 동사 자리에 못 와서 when(~할 때) 절에 동사가 없어짐.","bump(부딪치다): 주어 things(것들)가 복수라 s 없는 현재형 동사가 맞음.","to bump(부딪치는 것): to부정사도 동사 자리에 못 옴.","has bumped(부딪쳐 왔다): has(완료 조동사)는 단수 주어용이라 복수 things(것들)와 안 맞음."],"point":"수식받는 주어의 수일치","en":"When things that used to be kept separate bump up against each other, it becomes far more difficult to predict what’s going to happen next.","ko":"분리되어 있던 것들이 서로 부딪치게 될 때, 다음에 무슨 일이 일어날지를 예측하는 것은 훨씬 더 어려워진다.","hl":["things","bump up against"],"khl":["것들이","부딪치게 될 때"],"blocks":[{"t":"p","h":"긴 꼬리표 손으로 가리기","x":["things that used to be kept separate bump(분리되어 있던 것들이 부딪친다).","that(~하는)부터 separate(분리된)까지는 things(것들)를 꾸미는 긴 꼬리표다.","꼬리표 바로 끝의 separate(분리된)나 kept(유지되는)는 주인이 아니다.","가리고 보면 things bump(것들이 부딪친다). 복수라 s 없음."]}, an error taking place on the other side of the world.","ko":"세계 금융 산업은 모든 은행과 전 세계 각국의 수많은 가정을 연결하여, 우리를 세계의 다른 곳에서 발생한 인간의 오류에 취약해지게 만들었다.","hl":["human error taking place"],"khl":["발생한 인간의 오류"],"blocks":[{"t":"p","h":"수동이 안 되는 동사","x":["take place(일어나다), happen(일어나다), occur(일어나다)는 목적어가 없다.","목적어가 없으면 수동태로 바꿀 재료가 없다.","그래서 이 말들은 p.p.로 명사를 꾸밀 수 없다.","human error taking place = 일어나는 인간의 오류."]},{"t":"pair","h":"쉬운 예시","x":[["Look at the children playing in the park.","공원에서 놀고 있는 아이들을 봐. (아이들이 스스로 놂 → playing(놀고 있는))"],["The festival takes place every May.","그 축제는 매년 5월에 열린다. (takes place(열린다), 수동 없음)"]]}],"post":["take place(일어나다)는 수동 없음: error taking place(일어나는 오류)"]},{"slots":[["us","","","making(만들면서)의 목적어 자리라 목적격 us(우리를)."],["buffered","","","기관들이 \"보호받는\" 쪽이라 p.p."],["has","have","a","주어는 The digitization(디지털화), 단수다. of massive amounts of information(방대한 양의 정보의)은 꼬리표."],["autonomously","","","동사 communicate(소통하다)를 꾸미는 부사."],["bump","","","주어 things(것들)가 복수라 bump(부딪치다)."]],"opts":["having","to have","has","are"],"or":["having(~해 온 것): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to have(~해 온 것): to부정사도 동사 자리에 못 옴.","has(~해 왔다): 주어 The digitization(디지털화)이 단수라 has continued(계속해 왔다)가 맞음.","are(~이다): 복수 주어용 be동사라 단수 The digitization(디지털화)과 안 맞고, 뒤의 continued(계속된)와도 맞지 않음."],"point":"수식받는 주어의 수일치","en":"The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.","ko":"컴퓨팅 능력의 비용이 감소함에 따라 방대한 양의 정보의 디지털화는 계속해서 엄청나게 증가해 왔다.","hl":["The digitization","has continued"],"khl":["디지털화는","증가해 왔다"],"blocks":[{"t":"p","h":"복수 단어에 속지 않기","x":["주어 앞부분: The digitization(디지털화).","뒤의 of massive amounts of information(방대한 양의 정보의)은 꼬리표다.","amounts(양들)가 복수라 have(~해 왔다)를 쓰고 싶어진다. 이게 함정.","주인은 하나뿐인 The digitization(디지털화). 그래서 has(~해 왔다)."]},{"t":"pair","h":"쉬운 예시","x":[["The price of these shoes has gone up.","이 신발들의 가격이 올랐다. (주인 The price(가격) → has(~해 왔다))"],["A box of apples is on the table.","사과 한 상자가 탁자 위에 있다. (주인 A box(한 상자) → is(~이다))"]]}],"post":["꼬리표 of massive amounts of information(방대한 양의 정보의) 떼고 The digitization(디지털화) + has(~해 왔다)"]},{"slots":[["links","","","주어 The global financial industry(세계 금융 산업)가 단수라 s."],["that","","","선행사 smart systems(스마트 시스템들)를 받는 주격 관계대명사."],["gave","giving","a","주어 The development(발달)의 진짜 동사 자리다. that(~하는) 뒤 communicate(소통하다)는 꼬리표 안의 동사라 주어의 동사가 아니다."],["what","","","predict(예측하다)의 목적어, 뒤에 주어가 빠져 what(~하는 것)."],["because","","","뒤에 주어 + 동사가 있는 절이라 접속사."]],"opts":["gave","give","to give","given"],"or":["gave(주었다, give의 과거형): 주어 The development(발달)의 진짜 동사라 맞음. gave rise to = 초래했다.","give(주다): 복수 주어용 현재형이라 단수 주어 The development(발달)와 안 맞음.","to give(주는 것): to부정사는 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","given(주어진): 과거분사는 be나 have(완료 조동사) 없이 혼자 동사가 될 수 없음."],"point":"정동사 vs. 준동사","en":"The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns.","ko":"자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장들을 초래했다.","hl":["The development","gave rise to"],"khl":["발달은","초래했다"],"blocks":[{"t":"p","h":"동사 두 개, 주인은 누구?","x":["이 문장에는 동사처럼 보이는 말이 둘: communicate(소통하다), gave(주었다).","communicate(소통하다)는 that(~하는) 꼬리표 안에서 systems(시스템들)의 동사다.","주어 The development(발달)의 동사는 아직 비어 있다.","그 자리를 채우는 게 gave(초래했다). 여기까지 -ing로 바꾸면 주어가 동사 없이 남는다."]},{"t":"pair","h":"쉬운 예시","x":[["The man who lives here gave me a map.","여기 사는 그 남자가 나에게 지도를 주었다. (lives(산다)는 꼬리표 안, 진짜 동사 gave(주었다))"],["The girl that I met yesterday is my cousin.","내가 어제 만난 소녀는 내 사촌이다. (met(만났다)는 꼬리표 안, 진짜 동사 is(~이다))"]]}],"post":["꼬리표 속 동사 communicate(소통하다) 말고 주어 The development(발달)의 동사 gave(초래했다)"]},{"slots":[["vulnerable","","","make(만들다) + us(우리를) + 형용사 보어."],["their","","","institutions(기관들)를 받는 복수 소유격."],["kept","","","used to be kept(유지되곤 했다), be + p.p. 수동."],["far","very","a","뒤에 비교급 more difficult(더 어려운)가 온다. 비교급을 세게 만드는 말은 very(매우)가 아니라 far(훨씬)."],["spreads","","","주어 interconnectedness(상호 연결성)가 단수라 s."]],"opts":["so","too","many","far"],"or":["so(아주): 원급을 꾸미는 말이라 비교급 앞 ":"관리하다(manage의 3인칭 단수 현재형)","to manage":"관리하는 것, 관리하기 위해(manage의 to부정사)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","happy":"행복한(형용사)","happily":"행복하게(부사)","being":"~인 것, ~인(be의 -ing형)","made":"만들어진(make의 과거분사형) / 만들었다(과거형)","make":"만들다(동사원형)","beautiful":"아름다운(형용사)","beautifully":"아름답게(부사)","walk":"산책, 걷기(명사) / 걷다(동사)","walked":"걸었다(walk의 과거형·과거분사형)","where":"~하는 곳(장소를 받는 관계부사, 뒤에 완전한 문장)"},"sets":[{"items":[{"slots":[["have_brought","has brought","a","주어는 developments and technologies(발전들과 기술들), 복수다. in medical practice(의료 행위에서의)는 꼬리표일 뿐."],["for_which","","","the discovery(발견)에 대해 상을 받았다. 전치사 + 관계대명사 which(그것)가 맞다."],["was","","","주어는 The discovery(그 발견), 단수라 was(~였다)가 맞다."],["that","","","discovered(발견했다)의 목적어로, 뒤에 완전한 문장이 오는 that(~라는 것)이다."],["were_protected","","","humans(인간들)는 \"보호받는\" 쪽이라 수동태 were protected(보호되었다)가 맞다."]],"opts":["bringing","to bring","have brought","having brought"],"or":["bringing(가져다주는 것): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to bring(가져다주는 것): to부정사도 동사 자리에 못 와서 주어 뒤 동사가 비게 됨.","have brought(가져다주었다): 복수 주어 developments and technologies(발전들과 기술들)에 맞는 현재완료 동사라 맞음.","having brought(가져다주고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"수식받는 주어의 수일치","en":"Scientific developments and technologies in medical practice have brought us enormous progress in the treatment and prevention of infectious diseases.","ko":"의료 행위에서의 과학적 발전들과 기술들은 우리에게 전염병의 치료와 예방에 있어 엄청난 진보를 가져다주었다.","hl":["developments and technologies","have brought"],"khl":["발전들과 기술들은","가져다주었다"],"blocks":[{"t":"p","h":"주인은 and(그리고)로 두 명","x":["주어 자리에 developments(발전들)와 technologies(기술들)가 and(그리고)로 묶여 있다.","A and B는 둘이니까 복수다.","바로 앞 단어 practice(행위)는 단수처럼 보이지만 in medical practice(의료 행위에서의)라는 꼬리표 안에 있다.","꼬리표는 동사 모양을 정하지 못한다.","그래서 has(가지다, 단수형)가 아니라 have(가지다, 복수형)."]},{"t":"pair","h":"쉬운 예시","x":[["Tom and Jerry are friends.","톰과 제리는 친구다. (A and B = 복수 → are(~이다))"],["The pens in the box are red.","상자 안의 펜들은 빨갛다. (주인 The pens(펜들) → are(~이다))"]]}],"post":["꼬리표 in medical practice(의료 행위에서의) 떼고 A and B(복수) → have brought(가져다주었다)"]},{"slots":[["was","","","주어 The discovery(그 발견)가 단수라 was(~였다)."],["that","","","discovered(발견했다) 뒤에서 발견한 내용을 이끄는 that(~라는 것)이다."],["exposure","","","전치사 after(~ 후에) 뒤라서 명사 exposure(노출)가 맞다."],["which","that","a","콤마(,) 뒤에서 앞말을 덧붙여 설명할 때는 that(~하는)을 쓸 수 없다. which(그리고 그것은)를 쓴다."],["developed","","","백신은 사람이 \"개발한\" 것이라 과거분사 developed(개발된)가 Vaccines(백신들)를 꾸민다."]],"opts":["what","which","who","whom"],"or":["what(~하는 것): 앞에 명사 the cowpox virus(우두 바이러스)가 이미 있어서 명사를 품은 what(~하는 것)은 못 옴.","which(그리고 그것은): 콤마 뒤에서 사물 the cowpox virus(우두 바이러스)를 받아 주어 역할을 하는 관계대명사라 맞음.","who(~하는 사람): 사람을 받는 말인데 바이러스는 사람이 아님.","whom(~을 (사람)): 사람을 받는 목적격이라 사물도 아니고, 주어 자리에도 못 옴."],"point":"관계대명사 which vs. that(콤마 뒤)","en":"Edward Jenner discovered around 1796 that humans were protected against the deadly smallpox virus after exposure to the cowpox virus, which is harmless to humans.","ko":"1796년경 Edward Jenner는 인간들에게 무해한 우두 바이러스에 인간들이 노출된 후 치명적인 천연두 바이러스로부터 보호된다는 점을 발견했다.","hl":["the cowpox virus, which is harmless"],"khl":["무해한 우두 바이러스"],"blocks":[{"t":"p","h":"콤마는 that(~하는)이 못 넘는 벽","x":["콤마(,) 뒤에 붙는 관계대명사는 앞말에 설명을 하나 더 얹는 역할이다.","이 자리에 that(~하는)은 들어가지 못한다.","사물이면 which(그리고 그것은), 사람이면 who(그리고 그 사람은).","여기 앞말은 the cowpox virus(우두 바이러스), 사물이다.","그래서 , which is harmless(그리고 그것은 무해하다)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a dog, which is very cute.","나는 개가 한 마리 있는데, 그 개는 정말 귀엽다. (콤마 뒤 which(그것은))"],["This is my uncle, who lives in Seoul.","이분은 우리 삼촌인데, 서울에 사신다. (사람이면 who(그 사람은))"]]}],"post":["콤마(,) 뒤 관계대명사: which(그것은) O / that(~하는) X"]},{"slots":[["have_contributed","","","주어 Vaccines(백신들)가 복수라 have contributed(기여해 왔다)."],["enormously","enormous","a","동사 have contributed(기여해 왔다)를 꾸미는 자리. 형용사 enormous(엄청난)는 동사를 꾸밀 수 없다."],["have_reduced","","","주어 measures(조치들)가 복수라 have reduced(줄여 왔다)."],["their","","","가리키는 것은 other infectious diseases(다른 전염병들), 복수라 their(그것들의)."],["while","","","뒤에 주어 treatment therapies(치료법들)와 동사 turned(바꾸었다)가 있으니 접속사 while(~하는 반면)."]],"opts":["so enormous","more enormous","most enormous","enormously"],"or":["so enormous(그렇게 엄청난): 형용사 덩어리라 동사를 꾸밀 수 없고, 뒤에 꾸밀 명사도 없음.","more enormous(더 엄청난): 형용사 비교급이라 동사를 꾸밀 수 없음.","most enormous(가장 엄청난): 형용사 최상급이라 동사를 꾸밀 수 없고 the(그)도 없음.","enormously(엄청나게): 동사 have contributed(기여해 왔다)를 꾸미는 부사라 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"Vaccines developed in laboratories have contributed enormously to the reduction of the burden of bacterial and viral diseases.","ko":"실험실에서 개발된 백신은 세균성 질병과 바이러스성 질병의 부담의 감소에 엄청나게 기여했다.","hl":["have contributed enormously"],"khl":["엄청나게 기여했다"],"blocks":[{"t":"p","h":"화살표가 어디로 가나","x":["enormously(엄청나게)가 꾸미는 말을 찾아 화살표를 그어 본다.","화살표는 contributed(기여했다), 동사로 간다.","동사를 꾸미는 건 부사(-ly)의 일이다.","형용사 enormous(엄청난)는 명사만 꾸민다.","같은 지문 첫 문장의 enormous progress(엄청난 진보)가 바로 형용사 + 명사다."]},{"t":"pair","h":"쉬운 예시","x":[["He runs quickly.","그는 빠르게 달린다. (동사 runs(달린다) ← 부사)"],["He is a quick runner.","그는 빠른 주자다. (명사 runner(주자) ← 형용사)"]]},{"t":"tap","h":"같은 지문에서 찾기","q":"이 지문에서 enormous(엄청난)가 명사를 꾸미는 곳은?","a":["첫 문장 enormous progress(엄청난 진보).","명사 progress(진보) 앞이라 형용사, 동사 contributed(기여했다) 뒤라 부사."]}],"post":["명사 앞 enormous(엄청난) / 동사 뒤 enormously(엄청나게)"]},{"slots":[["for_which","","","the discovery(발견)를 받아 \"그것에 대해\" 상을 받았다는 뜻."],["that","","","discovered(발견했다)의 목적어, 뒤가 완전한 문장."],["were_protected","protecting","a","that(~라는 것) 뒤 문장의 주어는 humans(인간들). 그 주어의 진짜 동사가 있어야 한다."],["exposure","","","전치사 after(~ 후에) 뒤라 명사 exposure(노출)."],["which","","","콤마 뒤에서 the cowpox virus(우두 바이러스)를 덧붙여 설명하는 which(그것은)."]],"opts":["to be protected","being protected","were protected","having protected"],"or":["to be protected(보호되는 것): to부정사는 동사 자리에 못 와서 that(~라는 것) 뒤 문장에 동사가 없어짐.","being protected(보호되는 것): -ing형은 혼자 동사 자리에 못 옴.","were protected(보호되었다): that(~라는 것) 뒤 주어 humans(인간들)의 진짜 동사이고, 보호받는 쪽이라 수동태라 맞음.","having protected(보호하고 나서): 동사 자리에 못 오고, 보호받는 쪽인데 능동 모양이기도 함."],"point":"정동사 vs. 준동사","en":"Edward Jenner discovered around 1796 that humans were protected against the deadly smallpox virus.","ko":"1796년경 Edward Jenner는 인간들이 치명적인 천연두 바이러스로부터 보호된다는 점을 발견했다.","hl":["that humans were protected"],"khl":["인간들이","보호된다는"],"blocks":[{"t":"p","h":"that(~라는 것) 뒤에도 주어 + 동사","x":["that(~라는 것) 뒤는 문장 하나가 통째로 들어가는 방이다.","방 안에도 주어와 진짜 동사가 하나씩 있어야 한다.","주어는 humans(인간들).","protecting(보호하는)은 -ing라서 진짜 동사가 못 된다.","그래서 were protected(보호되었다)가 그 방의 동사."]},{"t":"pair","h":"쉬운 예시","x":[["I know that he is kind.","나는 그가 친절하다는 것을 안다. (that 뒤 주어 he(그) + 동사 is(~이다))"],["She said that the shop was closed.","그녀는 그 가게가 문을 닫았다고 말했다. (that 뒤 동사 was closed(닫혀 있었다))"]]}],"post":["that(~라는 것) + 주어 humans(인간들) + 진짜 동사 were protected(보호되었다)"]},{"slots":[["while","","","뒤에 주어 + 동사가 오니 접속사 while(~하는 반면)."],["turned","","","while(~하는 반면) 뒤 주어 treatment therapies(치료법들)의 동사."],["that_d","what","a","앞에 명사 viral diseases(바이러스성 질병들)가 있다. 명사를 꾸미는 관계대명사는 that(~하는)이지 what(~하는 것)이 아니다."],["were_d","","","that(~하는)이 받는 viral diseases(바이러스성 질병들)가 복수라 were(~였다)."],["deadly","","","be동사 were(~였다) 뒤 보어 자리. deadly(치명적인)는 -ly로 끝나도 형용사다."]],"opts":["whose","that","whom","where"],"or":["where(~하는 곳): 뒤에 빠진 것 없는 문장이 와야 하는데 주어가 비어 있고, 질병은 장소도 아님.","that(~하는): 사물 viral diseases(바이러스성 질병들)를 받아 주어 역할을 하는 관계대명사라 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 동사 were(~였다)가 와서 안 됨.","whom(~을 (사람)): 사람을 받는 목적격이라 사물도 아니고, 주어 자리에도 못 옴."],"point":"that/which vs. what","en":"Treatment therapies turned viral diseases that were deadly into chronic manageable diseases.","ko":"치료법이 치명적인 바이러스성 질병을 만성적인 관리 가능한 질병으로 바꾸었다.","hl":["viral diseases that were deadly"],"khl":["치명적인 바이러스성 질병을"],"blocks":[{"t":"p","h":"what(~하는 것)은 혼자 다닌다","x":["what(~하는 것) = the thing which(~하는 것). 안에 이미 명사가 들어 있다.","그래서 what(~하는 것) 앞에는 꾸밀 명사가 없어야 한다.","여기는 viral diseases(바이러스성 질병들)라는 명사가 앞에 있다.","명사를 뒤에서 꾸미는 건 that(~하는) 또는 which(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the bag that I bought.","이것은 내가 산 가방이다. (명사 the bag(가방) + that)"],["What I bought is this bag.","내가 산 것은 이 가방이다. (명사 없이 What(~하는 것))"]]}],"post":["명사 viral diseases(바이러스성 질병 leming에 의한 페니실린의 발견은 전염병과의 싸움에서 가장 큰 획기적 발전들 중 하나였으며, 그것에 대해 그는 후에 노벨상을 받았다.","hl":["for which he later received the Nobel Prize"],"khl":["그것에 대해 그는 후에 노벨상을 받았다"],"blocks":[{"t":"p","h":"두 문장으로 쪼개 보기","x":["문장 1: The discovery was a breakthrough(그 발견은 획기적 발전이었다).","문장 2: He received the Nobel Prize for the discovery(그는 그 발견에 대해 노벨상을 받았다).","문장 2의 the discovery(그 발견)를 which(그것)로 바꾼다.","for(~에 대해)도 which(그것)를 따라 앞으로 함께 나온다.","for(~에 대해)를 빼면 which(그것)가 들어갈 빈자리가 없다. 뒤 문장이 이미 완전하기 때문."]},{"t":"pair","h":"쉬운 예시","x":[["This is the house in which I live.","이것은 내가 사는 집이다. (I live in the house(나는 그 집에 산다) → in which)"],["This is the house which I bought.","이것은 내가 산 집이다. (bought(샀다)의 목적어가 비어서 which만)"]]},{"t":"tap","h":"확인 질문","q":"he later received the Nobel Prize(그는 후에 노벨상을 받았다)에 빠진 것이 있나?","a":["없다. 주어 he(그), 동사 received(받았다), 목적어 the Nobel Prize(노벨상)가 다 있다.","뒤가 완전하면 which(그것) 혼자는 못 오고 전치사 + which."]}],"post":["뒤 문장 완전 → 전치사 + which: for which(그것에 대해)"]},{"slots":[["which","","","콤마 뒤 the cowpox virus(우두 바이러스)를 덧붙여 설명."],["developed","develop","a","문장의 진짜 동사는 have contributed(기여해 왔다)다. 그 앞에 동사가 또 오면 접속사 없이 동사가 둘이 된다."],["have_contributed","","","주어 Vaccines(백신들)의 진짜 동사, 복수라 have(가지다, 복수형)."],["enormously","","","동사 contributed(기여했다)를 꾸미는 부사."],["have_reduced","","","주어 measures(조치들)가 복수라 have reduced(줄여 왔다)."]],"opts":["develops","have developed","developed","are developed"],"or":["develops(개발하다, 3인칭 단수형): 진짜 동사 have contributed(기여해 왔다)가 따로 있어서 동사가 겹침.","have developed(개발해 왔다): 현재완료도 진짜 동사라 접속사 없이 동사가 둘이 됨.","developed(개발된): Vaccines(백신들)를 뒤에서 꾸미는 과거분사라 맞음. 백신은 개발되는 쪽.","are developed(개발된다): 수동태라도 진짜 동사라서 have contributed(기여해 왔다)와 겹침."],"point":"정동사 vs. 준동사","en":"Vaccines developed in laboratories have contributed enormously to the reduction of the burden of bacterial and viral diseases.","ko":"실험실에서 개발된 백신은 세균성 질병과 바이러스성 질병의 부담의 감소에 엄청나게 기여했다.","hl":["Vaccines developed in laboratories","have contributed"],"khl":["실험실에서 개발된 백신은","기여했다"],"blocks":[{"t":"p","h":"동사 개수 세기"  treatment therapies turned viral diseases that were deadly into chronic manageable diseases.","ko":"통제와 위생 관리 조치들이 그것들의 부담을 줄였으며, 또 다른 것들의 경우에는 치료법이 치명적인 바이러스성 질병을 만성적인 관리 가능한 질병으로 바꾸었다.","hl":["while","treatment therapies turned"],"khl":["줄였으며","치료법이"],"blocks":[{"t":"p","h":"뒤를 보고 고르기","x":["빈칸 뒤에 주어 + 동사가 있으면 접속사.","빈칸 뒤에 명사만 있으면 전치사.","여기 뒤: for others(다른 것들의 경우) treatment therapies(치료법들) turned(바꾸었다).","for others(다른 것들의 경우)는 끼어든 말이고, 주어 + 동사가 보인다.","그래서 접속사 while(~하는 반면). 전치사 during(~ 동안)은 탈락."]},{"t":"pair","h":"쉬운 예시","x":[["I slept during the movie.","나는 영화 중에 잤다. (during(~ 동안) + 명사)"],["I slept while he was talking.","나는 그가 말하는 동안 잤다. (while(~하는 동안) + 주어 + 동사)"]]}],"post":["뒤에 주어 + 동사 → while(~하는 반면) / during(~ 동안) + 명사"]}],"compquiz":[{"s":"She was tired after the long ___.","o":["walked","walk"],"a":1,"ko":"그녀는 긴 산책 후에 피곤했다.","why":"전치사 after(~ 후에) 뒤, the long(긴) 다음은 명사 walk(산책).","wy":"walked(걸었다): 과거형 동사라 전치사 뒤 명사 자리에 못 옴."},{"s":"I fell asleep ___ the movie.","o":["during","while"],"a":0,"ko":"나는 영화를 보는 중에 잠이 들었다.","why":"뒤에 명사 the movie(영화)만 있으니 전치사 during(~ 동안).","wy":"while(~하는 동안): 접속사라 뒤에 주어 + 동사가 와야 함."}]},{"id":"2610g2-36","no":"36","title":"어법특훈 · 26년 10월 고2 36번","sub":"디자이너는 사용자가 아니다: 사용성 테스트","tpl":"A simple truth {that_a|that} designers must embrace in order to create more effective products and experiences {is|is} the fact {that_b|that} we are not the user. We're much too close to {what|what} we build to {objectively|objectively} see it and {understand|understand} how users will interact with it. The best user interfaces are {those|those} {that_c|that} {have_been_shaped|have been shaped} by observations of real users and their interactions with them. So how can designers shape their work {to_be|to be} more {effective|effective}? An {incredibly|incredibly} effective way is with usability testing. The goal of this method is to uncover problems in a design, {discover|discover} existing opportunities, and {learn|learn} more about the behaviors and preferences of users by {asking|asking} participants {to_engage|to engage} in realistic activities. This technique is effective for {understanding|understanding} how well a design will perform once it {is_d|is} in the hands of real users. Designers can use this method {to_improve|to improve} their work through subsequent revisions {based|based} on the findings from representative users.","fn":["*embrace: 받아들이다, 수용하다","*user interface: 사용자 인터페이스(사용자가 제품을 다루는 화면·장치)","*usability testing: 사용성 테스트","*subsequent: 차후의, 그다음의","*representative: 대표적인"],"mean":{"that":"~하는(관계대명사) / ~라는(내용을 설명하는 접속사)","what":"~하는 것(선행사를 품은 관계대명사)","who":"~하는 (사람)(사람을 받는 관계대명사)","whom":"~을 (사람)(사람을 받는 목적격 관계대명사)","how":"어떻게, ~하는 방법(관계부사·의문사)","whose":"~의(소유격 관계대명사)","which":"~하는(관계대명사, 뒤에 빠진 자리가 있어야 함)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","being":"~인 것, ~인(be의 -ing형)","be":"~이다, ~하다(동사원형)","to be":"~이 되도록, ~인 것(be의 to부정사)","having been":"~였고 나서(be의 완료 -ing형)","objectively":"객관적으로(부사)","objective":"객관적인(형용사) / 목표(명사)","objection":"반대, 이의(명사)","objectivity":"객관성(명사)","objectives":"목표들(objective의 복수형, 명사)","understand":"이해하다(동사원형)","understands":"이해하다(understand의 3인칭 단수 현재형)","to understanding":"이해하는 것으로(전치사 to + 동명사)","has understood":"이해했다(understand의 현재완료형, 단수 주어)","understandable":"이해할 수 있는(형용사)","those":"그것들(앞의 복수 명사를 대신하는 지시대명사)","this":"이것(단수 지시대명사)","it":"그것(단수 대명사)","its":"그것의(it의 소유격)","have been shaped":"만들어져 왔다(shape의 현재완료 수동형, 복수)","have shaped":"만들어 왔다(shape의 현재완료 능동형)","has been shaped":"만들어져 왔다(shape의 현재완료 수동형, 단수)","has shaped":"만들어 왔다(shape의 현재완료 능동형, 단수)","shaping":"만드는 것, 만드는(shape의 -ing형)","effective":"효과적인(형용사)","effectively":"효과적으로(부사)","effect":"효과(명사)","effects":"효과들(effect의 복수형, 명사)","effectiveness":"효과성(명사)","incredibly":"엄청나게, 믿을 수 없을 만큼(부사)","discover":"발견하다(동사원형)","learn":"배우다, 알게 되다(동사원형)","learning":"배우는 것, 배우는(learn의 -ing형)","learns":"배우다(learn의 3인칭 단수 현재형)","to learning":"배우는 것으로(전치사 to + 동명사)","has learned":"배웠다(learn의 현재완료형, 단수 주어)","asking":"요청하는 것(ask의 -ing형, 동명사)","ask":"요청하다(동사원형)","asked":"요청했다(ask의 과거형·과거분사형)","asks":"요청하다(ask의 3인칭 단수 현재형)","to ask":"요청하는 것(ask의 to부정사)","to engage":"참여하도록(engage의 to부정사)","engage":"참여하다(동사원형)","engages":"참여하다(engage의 3인칭 단수 현재형)","to engaging":"참여하는 것으로(전치사 to + 동명사)","engagement":"참여(명사)","understanding":"이해하는 것(understand의 -ing형, 동명사)","to improve":"개선하기 위해(improve의 to부정사)","based":"기반을 둔(base의 과거분사형, based on = ~에 기반한)","basing":"기반을 두는(base의 -ing형)","base":"기반을 두다(동사원형) / 기초(명사)","bases":"기반을 두다(base의 3인칭 단수 현재형) / 기초들(명사)","to base":"기반을 두는 것(base의 to부정사)","take":"(휴식을) 취하다(동사원형)","takes":"취하다(take의 3인칭 단수 현재형)","sung":"불린(sing의 과거분사형)","singing":"노래하는(sing의 -ing형)","draw":"그리다(동사원형)","drawing":"그리는 것(draw의 -ing형)","clear":"분명한(형용사)","clearly":"분명하게(부사)","cold":"차가운(형용사)","coldly":"차갑게, 쌀쌀맞게(부사)","cook":"요리하다(동사원형)","cooking":"요리하는 것(cook의 -ing형, 동명사)","wash":"씻다(동사원형)","to wash":"씻도록(wash의 to부정사)"},"sets":[{"items":[{"slots":[["that_a","","","A simple truth(단순한 진리)를 꾸미는 관계대명사. embrace(받아들이다)의 목적어가 비어 있다."],["is","are","a","주어는 A simple truth(단순한 진리), 단수다. that ~ experiences(~하는 경험들)는 길게 붙은 꼬리표일 뿐."],["that_b","","","the fact(사실)의 내용을 완전한 문장으로 풀어 주는 that(~라는)."],["what","","","전치사 to(~에) 뒤에서 build(만들다)의 목적어가 빠진 문장을 이끄는 what(~하는 것)."],["objectively","","","동사 see(보다)를 꾸미니 부사."]],"opts":["being","to be","having been","is"],"or":["being(~인 것): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to be(~인 것): to부정사도 동사 자리에 못 와서 주어 뒤 동사가 비게 됨.","having been(~였고 나서): 완료 -ing형이라 동사 자리에 못 옴.","is(~이다): 단수 주어 A simple truth(단순한 진리)의 진짜 동사라 맞음."],"point":"수식받는 주어의 수일치","en":"A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.","ko":"디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다.","hl":["A simple truth","is the fact"],"khl":["단순한 진리는","사실이다"],"blocks":[{"t":"p","h":"긴 꼬리표에 속지 않기","x":["주어 A simple truth(단순한 진리) 뒤에 that(~하는)으로 시작하는 긴 꼬리표가 붙어 있다.","꼬리표 끝의 products and experiences(제품과 경험)는 복수처럼 보인다.","하지만 그건 꼬리표 안의 말이라 동사 모양을 못 정한다.","꼬리표를 괄호로 묶으면 A simple truth is the fact(단순한 진리는 사실이다)만 남는다.","주인이 하나니까 is(~이다)."]},{"t":"pair","h":"쉬운 예시","x":[["The girl who sells apples and bananas is my sister.","사과와 바나나를 파는 그 소녀는 내 언니다. (주인 The girl(그 소녀) → is(~이다))"],["The cookies that my grandma makes are delicious.","할머니가 만드시는 쿠키들은 맛있다. (주인 The cookies(쿠키들) → are(~이다))"]]}],"post":["긴 꼬리표 that ~ experiences(~하는 ~ 경험들) 묶고 주인 A simple truth(단순한 진리) → is(~이다)"]},{"slots":[["what","","","전치사 to(~에) 뒤, build(만들다)의 목적어가 빠졌으니 what(~하는 것)."],["objectively","","","동사 see(보다)를 꾸미는 부사."],["understand","understands","a","to objectively see it and understand(객관적으로 보고 이해하다). and(그리고)로 to 뒤의 see(보다)와 나란한 동사원형이어야 한다."],["those","","","앞의 복수 명사 user interfaces(사용자 인터페이스들)를 대신하는 those(그것들)."],["that_c","","","those(그것들)를 꾸미는 관계대명사. 뒤에 주어가 빠져 있다."]],"opts":["to understanding","has understood","understand","understandable"],"or":["to understanding(이해하는 것으로): 전치사 to 모양이라 to부정사 see(보다)와 짝이 안 맞음.","has understood(이해했다): 주어 We(우리)와 수가 안 맞고, to 뒤 원형 자리와도 안 맞음.","understand(이해하다): to 뒤 see(보다)와 and(그리고)로 나란한 동사원형이라 맞음.","understandable(이해할 수 있는): 형용사라 뒤에 오는 how users will interact(사용자들이 어떻게 상호 작용할지)를 목적어로 받을 수 없음."],"point":"병렬구조","en":"We're much too close to what we build to objectively see it and understand how users will interact with it.","ko":"우리는 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다.","hl":["to objectively see it and understand"],"khl":["객관적으로 보고","이해할 수 없다"],"blocks":[{"t":"p","h":"to(~하기에) 하나에 동사 둘","x":["too ~ to(너무 ~해서 …할 수 없다)의 to 뒤에 동사 두 개가 매달려 있다.","to + see(보다) and (to) understand(이해하다).","두 번째 to는 반복을 피하려고 생략되었다.","그래서 understand(이해하다)도 see(보다)처럼 동사원형.","s를 붙인 understands(이해하다, 3인칭 단수형)는 to 뒤에 올 수 없다."]},{"t":"pair","h":"쉬운 예시","x":[["I want to eat and sleep.","나는 먹고 자고 싶다. (to eat and sleep = 먹고 자는 것)"],["She is too tired to cook and clean.","그녀는 너무 피곤해서 요리하고 청소할 수 없다. (to cook and clean = 요리하고 청소하다)"]]}],"post":["to see and understand(보고 이해하다): to 하나 + 동사원형 둘"]},{"slots":[["those","","","앞의 복수 명사 user interfaces(사용자 인터페이스들)를 대신하는 those(그것들)."],["that_c","","","those(그것들)를 꾸미는 관계대명사 that(~하는)."],["have_been_shaped","have shaped","a","인터페이스는 관찰 결과에 의해 \"만들어지는\" 쪽이다. 뒤에 by(~에 의해)가 있고 목적어가 없으니 수동태여야 한다."],["to_be","","","\"더 효과적이도록\"이라는 목적을 나타내는 to부정사 to be(~이 되도록)."],["effective","","","be(~이다) 뒤 보어 자리라 형용사 effective(효과적인)."]],"opts":["have been shaped","has been shaped","has shaped","shaping"],"or":["have been shaped(만들어져 왔다): 복수 those(그것들)를 받은 that(~하는)의 동사이고, 만들어지는 쪽이라 수동태라 맞음.","has been shaped(만들어져 왔다, 단수형): that(~하는)이 받는 those(그것들)가 복수라 has(완료 조동사, 단수형)는 수가 안 맞음.","has shaped(만들어 왔다, 단수 능동형): 수도 안 맞고, 만들어지는 쪽인데 능동이라 틀림.","shaping(만드는): -ing는 혼자 동사 자리에 못 와서 that(~하는) 뒤에 동사가 없어짐."],"point":"능동태 vs. 수동태","en":"The best user interfaces are those that have been shaped by observations of real users and their interactions with them.","ko":"가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다.","hl":["those that have been shaped by observations"],"khl":["관찰 결과들에 의해 만들어져 온 것들이다"],"blocks":[{"t":"p","h":"누가 누구를 만들었나","x":["만든 쪽: observations(관찰 결과들).","만들어진 쪽: those(그것들) = user interfaces(사용자 인터페이스들).","주어 자리에 만들어진 쪽이 있으면 be + p.p.(수동태).","by observations(관찰 결과들에 의해)가 만든 쪽을 알려 주는 표시다.","have shaped(만들어 왔다)는 목적어가 와야 하는데 바로 by(~에 의해)가 나와서 틀린다."]},{"t":"pair","h":"쉬운 예시","x":[["This house was built by my grandfather.","이 집은 우리 할아버지에 의해 지어졌다. (집은 지어지는 쪽 → was built(지어졌다))"],["My grandfather built this house.","우리 할아버지가 이 집을 지으셨다. (할아버지는 짓는 쪽 → built(지었다))"]]}],"post":["만들어지는 쪽 + by(~에 의해) → have been shaped(만들어져 왔다)"]},{"slots":[["incredibly","","","형용사 effective(효과적인)를 꾸미니 부사."],["discover","","","to uncover(밝혀 내는 것) 뒤 and(그리고)로 이어지는 동사원형."],["learn","learning","a","to uncover(밝혀 내다), discover(발견하다), and learn(배우다). 셋 다 to 뒤에 매달린 동사원형이어야 한다."],["asking","","","전치사 by(~함으로써) 뒤라 동명사 asking(요청하는 것)."],["to_engage","","","ask(요청하다) + 사람 + to부정사. \"참여하도록 요청하다\"."]],"opts":["learns","to learning","has learned","learn"],"or":["learns(배우다, 3인칭 단수형): to 뒤에는 s 붙은 동사가 못 오고, 앞 두 동사와도 모양이 다름.","to learning(배우는 것으로): 전치사 to 모양이라 앞의 동사원형들과 짝이 안 맞음.","has learned(배웠다): 현재완료라 to 뒤 원형 자리에 못 옴.","learn(배우다): to 뒤 uncover(밝혀 내다), discover(발견하다)와 나란한 동사원형이라 맞음."],"point":"병렬구조","en":"The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users.","ko":"이 방법의 목표는 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다.","hl":["to uncover","discover","learn"],"khl":["밝혀 내고","발견하고","학습하는 것이다"],"blocks":[{"t":"p","h":"A, B, and C는 기차","x":["A, B, and C는 한 줄로 달리는 기차다.","칸마다 같은 모양이 타야 한다.","첫 칸: to uncover(밝혀 내는 것). 맨 앞의 to가 뒤 칸 모두를 끌고 간다.","둘째 칸 discover(발견하다), 셋째 칸 learn(배우다) 모두 동사원형.","셋째 칸만 learning(배우는 것)이면 기차가 탈선한다."]},{"t":"pair","h":"쉬운 예시","x":[["My plan is to read, write, and draw.","내 계획은 읽고, 쓰고, 그리는 것이다. (to read(읽다), write(쓰다), and draw(그리다) = 셋 다 원형)"],["He likes swimming, running, and dancing.","그는 수영, 달리기, 춤을 좋아한다. (셋 다 -ing)"]]}],"post":["to uncover(밝혀 내다), discover(발견하다), and learn(배우다): to 하나 + 원형 셋"]},{"slots":[["to_engage","","","ask(요청하다) + 사람 + to부정사."],["understanding","","","전치사 for(~에) 뒤라 동명사 understanding(이해하는 것)."],["is_d","","","once(일단 ~하면)가 이끄는 때를 나타내는 말에서는 미래 일도 현재형 is(~이다)로 쓴다."],["to_improve","","","\"개선하기 위해\"라는 목적의 to부정사 to improve(개선하기 위해)."],["based","basing","a","revisions(수정들)는 결과에 \"기반을 둔\" 쪽이다. based on(~에 기반한)은 p.p. 모양으로 쓴다."]],"opts":["base","based","bases","to base"],"or":["base(기반을 두다): 동사원형이라 명사 revisions(수정들)를 뒤에서 꾸밀 수 없음.","based(기반을 둔): revisions(수정들)를 뒤에서 꾸미는 p.p.라 맞음. based on(~에 기반한)이 한 덩어리.","bases(기반을 두다, 3인칭 단수형): 진짜 동사 can use(사용할 수 있다)가 따로 있어서 동사가 겹침.","to base(기반을 두는 것): to부정사는 목적어가 있어야 하는데 바로 on(~에)이 와서 뜻과 모양이 모두 깨짐."],"point":"능동 v-ing vs. 수동 p.p.","en":"Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.","ko":"디자이너들은 대표적인 에 명사가 없고 build(만들다)의 목적어가 비었으니 what(~하는 것)."],["understand","","","to see(보다)와 and(그리고)로 나란한 동사원형."],["those","","","복수 user interfaces(사용자 인터페이스들)를 대신하는 those(그것들)."]],"opts":["who","whom","how","that"],"or":["who(~하는 (사람)): 사람을 받는 말인데 truth(진리)는 사람이 아님.","whom(~을 (사람)): 사람을 받는 목적격이라 truth(진리)와 안 맞음.","how(~하는 방법): 뒤에 빠진 것 없는 문장이 와야 하는데 embrace(받아들이다)의 목적어가 비어 있고, 명사 바로 뒤에 how도 못 씀.","that(~하는): 명사 A simple truth(단순한 진리)를 꾸미고 embrace(받아들이다)의 목적어 역할을 하는 관계대명사라 맞음."],"point":"that/which vs. what","en":"A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.","ko":"디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다.","hl":["A simple truth that designers must embrace"],"khl":["디자이너들이","수용해야만 하는 단순한 진리는"],"blocks":[{"t":"p","h":"같은 지문 속 that(~하는)과 what(~하는 것)","x":["A simple truth that designers must embrace(디자이너들이 받아들여야 하는 단순한 진리): 명사 truth(진리)가 앞에 있다 → that(~하는).","close to what we build(우리가 만드는 것에 가까운): 앞에 명사가 없다 → what(~하는 것).","what(~하는 것)은 안에 \"것\"이라는 명사를 품고 있다.","앞에 명사가 또 있으면 명사가 둘이 되어 틀린다.","같은 지문 두 문장을 나란히 놓고 보면 차이가 바로 보인다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the song that I like.","이것은 내가 좋아하는 노래다. (명사 the song(노래) + that)"],["This is what I like.","이것이 내가 좋아하는 것이다. (명사 없이 what(~하는 것))"]]},{"t":"tap","h":"확인 질문","q":"designers must embrace(디자이너들이 받아들여야 한다) 뒤에 무엇이 빠졌나?","a":["embrace(받아들이다)의 목적어.","빠진 목적어 = 앞의 A simple truth(단순한 진리). 그래서 관계대명사 that(~하는)."]}],"post":["명사 A simple truth(단순한 진리) + that(~하는) / 명사 없으면 what(~하는 것)"]},{"slots":[["is","","","단수 주어 A simple truth(단순한 진리)의 동사 is(~이다)."],["what","","","build(만들다)의 목적어가 빠진 문장을 이끄는 what(~하는 것)."],["objectively","objective","a","to와 동사 see(보다) 사이에 끼어 동사를 꾸미는 자리. 형용사 objective(객관적인)는 동사를 꾸밀 수 없다."],["understand","","","to see(보다)와 나란한 동사원형."],["that_c","","","those(그것들)를 꾸미는 관계대명사 that(~하는)."]],"opts":["objectively","objection","objectivity","objectives"],"or":["objectively(객관적으로): 동사 see(보다)를 꾸미는 부사라 )에서도 effective(효과적인)는 형용사."]},{"t":"pair","h":"쉬운 예시","x":[["The soup is hot.","그 수프는 뜨겁다. (be + 형용사 hot(뜨거운))"],["He looks happy.","그는 행복해 보인다. (look(~해 보이다) + 형용사 happy(행복한))"]]}],"post":["be(~이다) + 형용사: to be more effective(더 효과적이도록)"]},{"slots":[["discover","","","to uncover(밝혀 내다)와 나란한 동사원형."],["learn","","","to uncover(밝혀 내다), discover(발견하다)와 나란한 동사원형."],["asking","ask","a","by(~함으로써)는 전치사다. 전치사 뒤에 동사를 쓰려면 -ing(동명사)."],["to_engage","","","ask(요청하다) + 사람 + to부정사."],["understanding","","","전치사 for(~에) 뒤 동명사."]],"opts":["asked","asking","asks","to ask"],"or":["asked(요청했다, 요청받은): 과거형·과거분사형은 전치사 뒤에 명사처럼 올 수 없음.","asking(요청하는 것): 전치사 by(~함으로써) 뒤 동명사라 맞음.","asks(요청하다, 3인칭 단수형): 동사라 전치사 뒤에 그대로 못 옴.","to ask(요청하는 것): 전치사 by(~함으로써) 뒤에는 to부정사가 못 옴."],"point":"전치사 + 동명사","en":"The goal of this method is to learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.","ko":"이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다.","hl":["by asking participants"],"khl":["요청함으로써"],"blocks":[{"t":"p","h":"by(~함으로써) + -ing = 방법","x":["by(~함으로써) + -ing는 \"~함으로써\"라는 방법을 말한다.","by(~함으로써)는 전치사라 뒤에 명사만 받는다.","동사 ask(요청하다)가 오려면 -ing 옷을 입혀 명사처럼 만든다.","이 지문 뒤쪽 for understanding(이해하는 데)도 같은 원리."]},{"t":"pair","h":"쉬운 예시","x":[["I learned English by watching movies.","나는 영화를 봄으로써 영어를 배웠다. (by(~함으로써) + watching(보는 것))"],["Thank you for helping me.","나를 도와줘서 고마워. (for(~에 대해) + helping(돕는 것))"]]}],"post":["by(~함으로써) + -ing: by asking(요청함으로써)"]},{"slots":[["understand","","","to see(보다)와 나란한 동사원형."],["those","that","a","앞의 user interfaces(사용자 인터페이스들)는 복수다. 복수를 대신 받는 말은 those(그것들)이고 단수 that(그것)은 짝이 안 맞는다."],["that_c","","","those(그것들)를 꾸미는 관계대명사 that(~하는)."],["have_been_shaped","","","복수 those(그것들)를 받은 수동태 have been shaped(만들어져 왔다)."],["to_be","","","목적을 나타내는 to부정사 to be(~이 되도록)."]],"opts":["those","this","it","its"],"or":["those(그것들): 복수 user interfaces(사용자 인터페이스들)를 대신 받는 지시대명사라 맞음.","this(이것): 단수라 복수 user interfaces(사용자 인터페이스들)와 안 맞음.","it(그것): 단수 대명사라 복수와 안 맞고, 관계대명사의 꾸밈을 받지도 못함.","its(그것의): 소유격이라 뒤에 명사가 와야 하는데 that(~하는)이 와서 안 됨."],"point":"대명사의 성·수·격","en":"The best user interfaces are those that have been shaped by observations of real users and their interactions with them.","ko":"가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다.","hl":["The best user interfaces","those"],"khl":["가장 좋은 사용자 인터페이스들은","것들이다"],"blocks":[{"t":"p","h":"대신 받는 말도 거울","x":["those(그것들)는 앞의 복수 명사를 대신 받는다.","여기서 받는 것은 The best user interfaces(가장 좋은 사용자 인터페이스들), 복수.","거울에 비친 모습도 복수여야 하니 those(그것들).","단수 명사를 받을 때만 that(그것)을 쓴다.","those(그것들) 뒤 동사가 have been shaped(만들어져 왔다)로 복수인 것도 같은 증거."]},{"t":"pair","h":"쉬운 예시","x":[["My shoes are bigger than those of my brother.","내 신발은 내 남동생의 것보다 크다. (shoes(신발) = 복수 → those)"],["My bag is bigger than that of my sister.","내 가방은 내 여동생의 것보다 크다. (bag(가방) = 단수 → that)"]]}],"post":["복수 interfaces(인터페이스들) → those(그것들) / that(그것) X"]}],"quiz":[{"s":"The cake ___ she made was sweet.","o":["that","what"],"a":0,"ko":"그녀가 만든 케이크는 달았다.","why":"앞에 명사 The cake(케이크)가 있으니 that(~하는).","wy":"what(~하는 것): 앞에 명사가 있으면 what은 못 옴."},{"s":"Please speak ___.","o":["clear","clearly"],"a":1,"ko":"분명하게 말해 주세요.","why":"동사 speak(말하다)를 꾸미니 부사.","wy":"clear(분명한): 형용사라 동사 speak(말하다)를 꾸밀 수 없음."},{"s":"The water in this lake is very ___.","o":["cold","coldly"],"a":0,"ko":"이 호수의 물은 매우 차갑다.","why":"be(~이다) 뒤 보어 자리라 형용사.","wy":"coldly(차갑게): 부사라 be(~이다) 뒤 보어 자리에 못 옴."},{"s":"She is good at ___.","o":["cook","cooking"],"a":1,"ko":"그녀는 요리를 잘한다.","why":"전치사 at(~에) 뒤는 -ing.","wy":"cook(요리하다): 동사원형은 전치사 at(~에) 뒤에 못 옴."},{"s":"His shoes are cleaner than ___ of his brother.","o":["that","those"],"a":1,"ko":"그의 신발은 그의 형의 것보다 깨끗하다.","why":"shoes(신발)가 복수라 those(그것들).","wy":"that(그것): 단수를 받는 말이라 복수 shoes(신발)와 안 맞음."}]}],"comp":[{"no":"36","slots":[["is","","","단수 주어 A simple truth(단순한 진리)의 동사 is(~이다)."],["that_b","which","a","the fact(사실) 뒤 문장 we are not the user(우리는 사용자가 아니다)는 빠진 것 없이 완전하다. 빈자리가 없으니 관계대명사 which(~하는)는 못 오고, 내용을 설명하는 that(~라는)이 와야 한다."],["what","","","build(만들다)의 목적어가 빠진 문장을 이끄는 what(~하는 것)."],["objectively","","","동사 see(보다)를 꾸미는 부사."],["those","","","복수 user interfaces(사용자 인터페이스들)를 대신 받는 those(그것들)."]],"opts":["what","whose","that","whom"],"or":["what(~하는 것): 앞에 명사 the fact(사실)가 있고 뒤 문장도 완전해서 못 옴.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 we(우리)가 와서 안 됨.","that(~라는): 명사 the fact(사실)의 내용을 완전한 문장으로 풀어 주는 접속사라 맞음.","whom(~을 (사람)): 뒤에 목적어가 빠진 자리가 있어야 하는데 문장이 완전하고, fact(사실)는 사람도 아님."],"point":"동격 that vs. 관계대명사 which","en":"A simple truth that designers must embrace is the fact that we are not the user.","ko":"디자이너들이 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다.","hl":["the fact that we are not the user"],"khl":["우리가 ‘사용자가 아니라’는 사실이다"],"blocks":[{"t":"p","h":"한 문장 속 두 개의 that","x":["첫 번째 that: A simple truth that designers must embrace(디자이너들이 받아들여야 하는 진리). embrace(받아들이다)의 목적어가 비어 있다 → 관계대명사.","두 번째 that: the fact that we are not the user(우리가 사용자가 아니라는 사실). 뒤가 완전하다 → 내용을 설명하는 that(~라는).","which(~하는)는 첫 번째 자리에는 들어갈 수 있다.","하지만 두 번째 자리처럼 뒤가 완전하면 which(~하는)는 못 온다."]},{"t":"pair","h":"쉬운 예시","x":[["I like the idea that we go to the beach.","나는 우리가 해변에 간다는 생각이 좋다. (뒤가 완전 → that(~라는))"],["I like the idea which you gave me.","나는 네가 준 아이디어가 좋다. (gave(주었다)의 목적어가 빔 → which(~하는))"]]},{"t":"tap","h":"확인 질문","q":"we are not the user(우리는 사용자가 아니다)에 빠진 것이 있나?","a":["없다. 주어 we(우리), 동사 are(~이다), 보어 the user(사용자)가 다 있다.","뒤가 완전하고 앞에 the fact(사실)가 있으면 that(~라는)."]}],"post":["the fact(사실) + that(~라는) + 완전한 문장 / which(~하는) X"]},{"no":"36","slots":[["learn","","","to uncover(밝혀 내다), discover(발견하다)와 나란한 동사원형."],["asking","","","전치사 by(~함으로써) 뒤라 동명사."],["to_engage","engage","a","ask(요청하다) + 사람 + to부정사. \"참여하도록 요청하다\"는 to를 빼면 안 된다."],["understanding","","","전치사 for(~에) 뒤라 동명사 understanding(이해하는 것)."],["to_improve","","","\"개선하기 위해\"라는 목적의 to부정사."]],"opts":["engages","to engaging","engagement","to engage"],"or":["engages(참여하다, 3인칭 단수형): 목적격보어 자리에 s 붙은 동사가 못 옴.","to engaging(참여하는 것으로): to부정사 자리라 to 뒤는 동사원형이어야 함.","engagement(참여): 명사라 participants(참가자들)가 하는 동작을 나타내는 보어 자리에 안 맞음.","to engage(참여하도록): ask(요청하다) + 목적어 participants(참가자들) 뒤 목적격보어는 to부정사라 맞음."],"point":"목적격보어(준동사)","en":"The goal of this method is to learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.","ko":"이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다.","hl":["asking participants to engage"],"khl":["참가자들이","참여하도록 요청함으로써"],"blocks":[{"t":"p","h":"부탁하는 동사는 to를 데려온다","x":["ask(요청하다) + 사람 + to부정사 = 사람에게 ~하라고 요청하다.","want(원하다), tell(말하다), ask(요청하다)는 모두 이 모양.","to를 빼고 동사원형만 쓰는 건 make(만들다), let(허락하다), have(시키다) 같은 사역동사뿐이다.","ask(요청하다)는 사역동사가 아니니 to engage(참여하도록)."]},{"t":"pair","h":"쉬운 예시","x":[["My mom asked me to wash the dishes.","엄마는 내게 설거지를 하라고 부탁했다. (asked me to wash = 씻으라고 부탁했다)"],["My mom made me wash the dishes.","엄마는 내게 설거지를 하게 했다. (made me wash = 씻게 했다, to 없음)"]]}],"post":["ask(요청하다) + 사람 + to부정사: asking participants to engage(참여하도록 요청하기)"]}],"compquiz":[{"s":"I heard the news ___ he won the game.","o":["which","that"],"a":1,"ko":"나는 그가 경기에서 이겼다는 소식을 들었다.","why":"뒤 문장이 완전하고 앞에 명사 the news(소식)가 있으니 that(~라는).","wy":"which(~하는): 뒤에 빠진 자리가 있어야 하는데 he won the game(그가 경기에서 이겼다)은 완전함."},{"s":"The teacher asked us ___ quiet.","o":["to be","be"],"a":0,"ko":"선생님은 우리에게 조용히 하라고 요청했다.","why":"ask(요청하다) + 사람 + to부정사.","wy":"be(~이다): ask(요청하다)는 사역동사가 아니라 to 없이 동사원형을 쓸 수 없음."}]},{"id":"2610g2-37","no":"37","title":"어법특훈 · 26년 10월 고2 37번","sub":"재평가와 감정 조절","tpl":"Reappraisal ― {changing|changing} the way one {thinks|thinks} about emotional situations ― might present a particularly effective avenue to {regulating|regulating} emotions because it {transforms|transforms} emotions at their root. Take, for example, someone {who|who} {is_g|is} going through a divorce. This is often an adverse event, and yet, it can be {construed|construed} in different ways. One might view it as an {overpowering|overpowering} loss {that_m|that} will mark one's family for life. Alternatively, one might see it as something that is painful but that might {lead|lead} to positive outcomes in the long run, such as {improved|improved} relationships. As a result of {these|these} different construals, one might feel different emotions. The first construal may bring {intense|intense} sadness and anger. The second construal might also bring sadness and anger but perhaps at lower levels. {crucially|Crucially}, it might also bring some positive emotions, such as hope, strength, or gratitude. This example {illustrates|illustrates} {how|how} reappraisal might {powerfully|powerfully} transform short-term emotional responses. When {repeated|repeated} over time, these short-term emotional consequences of reappraisal might accumulate {to_shape|to shape} people's {psychological|psychological} health. Thereby, reappraisal might be a key to resilience.","fn":["*reappraisal: 재평가","*construe: 해석하다 (construal: 해석)","*resilience: 회복 탄력성"],"mean":{"changing":"바꾸는 것(change의 -ing형, 동명사)","changes":"바꾸다(change의 3인칭 단수 현재형)","change":"바꾸다(동사원형)","has changed":"바꿔 왔다(change의 현재완료형)","had changed":"바꿨었다(change의 과거완료형)","thinks":"생각하다(think의 3인칭 단수 현재형)","think":"생각하다(동사원형)","thinking":"생각하는 것, 생각하는(think의 -ing형)","to think":"생각하는 것(think의 to부정사)","have thought":"생각해 왔다(think의 현재완료형, 복수 주어용)","regulating":"조절하는 것(regulate의 -ing형, 동명사)","transforms":"변화시키다(transform의 3인칭 단수 현재형)","transforming":"변화시키는(transform의 -ing형)","transform":"변화시키다(동사원형)","to transform":"변화시키는 것(transform의 to부정사)","having transformed":"변화시키고 나서(transform의 완료 -ing형)","who":"~하는(사람을 받는 주격 관계대명사)","which":"~하는(사물·동물을 받는 관계대명사)","whom":"~을(사람을 받는 목적격 관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","whose":"~의(소유격 관계대명사)","where":"~하는 곳(장소의 관계부사)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","be":"~이다(동사원형)","being":"~인 것, ~인(be의 -ing형)","were":"~였다(be의 과거형, 복수 주어)","construed":"해석된(construe의 과거분사형)","overpowering":"압도적인(overpower의 -ing형)","that":"~하는(관계대명사)","lead":"이어지다(동사원형)","leading":"이어지는(lead의 -ing형)","leads":"이어지다(lead의 3인칭 단수 현재형)","to lead":"이어지는 것(lead의 to부정사)","led":"이어졌다(lead의 과거형·과거분사형)","improved":"개선된(improve의 과거분사형)","these":"이러한(복수 명사 앞 지시형용사)","this":"이(단수 명사 앞 지시형용사)","them":"그것들을(they의 목적격)","each":"각각의(단수 명사 앞)","intense":"강렬한(형용사)","intensely":"강렬하게(부사)","intensively":"집중적으로(부사)","intensify":"강화하다(동사원형)","intensifies":"강화하다(intensify의 3인칭 단수 현재형)","Crucially":"결정적으로(부사)","illustrates":"보여 주다(illustrate의 3인칭 단수 현재형)","illustrate":"보여 주다(동사원형)","illustrating":"보여 주는(illustrate의 -ing형)","to illustrate":"보여 주는 것(illustrate의 to부정사)","have illustrated":"보여 왔다(illustrate의 현재완료형, 복수 주어용)","how":"어떻게(의문사)","powerfully":"강력하게(부사)","powerful":"강력한(형용사)","power":"힘(명사) / 동력을 공급하다(동사원형)","powers":"동력을 공급하다(power의 3인칭 단수 현재형)","powered":"동력을 공급했다(power의 과거형·과거분사형)","repeated":"반복된(repeat의 과거분사형)","to shape":"형성하게 되다(shape의 to부정사, 결과)","shape":"형성하다(동사원형)","shapes":"형성하다(shape의 3인칭 단수 현재형)","shaped":"형성했다(shape의 과거형·과거분사형)","has shaped":"형성해 왔다(shape의 현재완료형)","psychological":"심리적인(형용사)","rained":"비가 왔다(rain의 과거형)","raining":"비가 오는(rain의 -ing형)","strong":"강한(형용사)","strongly":"강하게(부사)","buy":"사다(동사원형)","to buy":"사기 위해(buy의 to부정사)","taking":"찍는 것(take의 -ing형, 동명사)","takes":"찍다(take의 3인칭 단수 현재형)","has":"가지다(have의 3인칭 단수 현재형)","have":"가지다(동사원형·복수 주어 현재형)","drink":"마시다(동사원형)","drinking":"마시는 것(drink의 -ing형)","go":"가다(동사원형)","goes":"가다(go의 3인칭 단수 현재형)","This":"이(단수 명사 앞 지시형용사)","These":"이러한(복수 명사 앞 지시형용사)"},"sets":[{"items":[{"slots":[["changing","","","Reappraisal(재평가)이 무엇인지 풀어 주는 동명사(~하는 것)다. 문장의 진짜 동사는 might present(제공할지도 모른다)."],["thinks","think","a","the way(방식) 뒤 문장의 주어는 one(사람). one(사람)은 한 사람으로 세서 thinks(생각하다)처럼 s가 붙는다."],["regulating","","","avenue to(~로 가는 길)의 to는 전치사라 뒤에 동명사 regulating(조절하는 것)이 온다."],["transforms","","","because(~ 때문에) 절의 주어 it(그것)이 단수라 transforms(변화시키다)."],["who","","","사람 someone(누군가)을 받는 주격 관계대명사 who(~하는)."]],"opts":["thinking","to think","thinks","have thought"],"or":["thinking(생각하는 것, 생각하는): -ing는 혼자 동사 자리에 못 와서 주어 one(사람)의 동사가 없어짐.","to think(생각하는 것): to부정사도 동사 자리에 못 와서 one(사람) 뒤 동사가 비게 됨.","thinks(생각하다): 주어 one(사람)이 3인칭 단수라 s 붙은 현재형이 맞음.","have thought(생각해 왔다): one(사람)은 단수라 have(복수용)가 아니라 has(단수용)를 써야 함."],"point":"주어-동사 수일치","en":"Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions.","ko":"재평가, 즉 사람이 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다.","hl":["one thinks"],"khl":["사람이","생각하는"],"blocks":[{"t":"p","h":"one(사람)은 한 명으로 센다","x":["one(사람)은 여기서 \"사람, 누구나\"라는 뜻의 대명사다.","뜻은 사람 전체 이야기 같아도 문법에서는 한 사람으로 센다.","그래서 he(그), she(그녀)처럼 동사에 s를 붙인다.","the way one thinks = 사람이 생각하는 방식."]},{"t":"pair","h":"쉬운 예시","x":[["Everyone likes ice cream.","모두가 아이스크림을 좋아한다. (Everyone(모두)은 단수 → likes(좋아한다))"],["One never knows the future.","사람은 결코 미래를 알 수 없다. (One(사람) → knows(안다))"]]}],"post":["the way one thinks(사람이 생각하는 방식): one(사람) = 단수 → thinks(생각하다)"]},{"slots":[["thinks","","","주어 one(사람)이 단수라 thinks(생각하다)."],["regulating","","","전치사 to(~로) 뒤라 동명사 regulating(조절하는 것)."],["transforms","transforming","a","because(~ 때문에)는 문장을 잇는 접속사라 뒤에 주어 it(그것)과 진짜 동사가 있어야 한다. -ing는 동사 자리에 못 온다."],["construed","","","it(그것, 이혼)이 해석'되는' 쪽이라 can be construed(해석될 수 있다), 수동태."],["overpowering","","","상실이 사람을 압도'하는' 쪽이라 -ing. an overpowering loss(압도적인 상실)."]],"opts":["transform","to transform","transforms","having transformed"],"or":["transform(변화시키다): 주어 it(그것)은 3인칭 단수라 s가 빠지면 수가 안 맞음.","to transform(변화시키는 것): to부정사는 동사 자리에 못 와서 because(~ 때문에) 절에 동사가 없어짐.","transforms(변화시키다): because(~ 때문에) 절의 주어 it(그것)이 단수라 s 붙은 현재형 동사가 맞음.","having transformed(변화시키고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.","ko":"재평가, 즉 사람이 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다.","hl":["because it transforms"],"khl":["그것이 감정을 본질적으로 변화시키기 때문에"],"blocks":[{"t":"p","h":"접속사 뒤에는 완전한 문장","x":["because(~ 때문에)는 문장 두 개를 잇는 접속사다.","접속사 뒤에는 주어와 진짜 동사가 꼭 있어야 한다.","주어: it(그것, 재평가). 진짜 동사: transforms(변화시킨다).","transforming(변화시키는)을 쓰면 동사가 사라져 문장이 반쪽이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I stayed home because I was sick.","나는 아파서 집에 있었다. (because(~ 때문에) 뒤 동사 was(~였다))"],["She is happy because she passed the test.","그녀는 시험에 붙어서 기쁘다. (because(~ 때문에) 뒤 동사 passed(통과했다))"]]}],"post":["because(~ 때문에) + 주어 it(그것) + 진짜 동사 transforms(변화시킨다)"]},{"slots":[["who","which","a","선행사 someone(누군가)은 사람이다. 사람을 받는 관계대명사는 who(~하는). which(~하는)는 사물·동물용."],["is_g","","","선행사 someone(누군가)이 단수라 is going(겪고 있다)."],["construed","","","it(그것)이 해석'되는' 쪽이라 수동태 be construed(해석되다)."],["overpowering","","","loss(상실)가 사람을 압도'하는' 쪽이라 -ing."],["that_m","","","앞 명사 loss(상실)를 꾸미고 뒤에 주어가 빠진 주격 관계대명사 that(~하는)."]],"opts":["who","whom","what","whose"],"or":["who(~하는, 주격 관계대명사): 사람 someone(누군가)을 받고, 뒤에 주어가 빠져 있어 맞음.","whom(~을, 목적격 관계대명사): 뒤에 빠진 것이 주어인데 목적격을 쓰면 안 됨.","what(~하는 것): 앞에 선행사 someone(누군가)이 있어서 쓸 수 없음.","whose(~의, 소유격 관계대명사): 바로 뒤에 꾸밀 명사가 와야 하는데 is(~이다)가 옴."],"point":"관계대명사 who vs. which","en":"Take, for example, someone who is going through a divorce.","ko":"예를 들어, 이혼을 겪고 있는 누군가를 생각해 보자.","hl":["someone who"],"khl":["겪고 있는 누군가"],"blocks":[{"t":"p","h":"앞 명사가 사람이면 who","x":["관계대명사는 앞 명사(선행사)를 보고 고른다.","사람 → who(~하는) / 사물·동물 → which(~하는) / 둘 다 → that(~하는).","someone(누군가)은 사람이라 who(~하는).","which(~하는)를 쓰면 사람을 물건 취급하는 셈이다."]},{"t":"pair","h":"쉬운 예시","x":[["I have a friend who speaks French.","나는 프랑스어를 하는 친구가 있다. (사람 friend(친구) → who)"],["I have a bag which is very old.","나는 아주 오래된 가방이 있다. (사물 bag(가방) → which)"]]}],"post":["사람 someone(누군가) + who(~하는) / 사물 + which(~하는)"]},{"slots":[["lead","","","조동사 might(~할지도 모른다) 뒤라 동사원형 lead(이어지다)."],["improved","","","관계가 개선'된' 것이라 p.p. improved(개선된)."],["these","","","뒤 명사 construals(해석들)가 복수라 these(이러한)."],["intense","intensely","a","뒤의 명사 sadness(슬픔)를 꾸미는 자리. 명사를 꾸미는 건 형용사다."],["crucially","","","콤마 뒤 문장 전체를 꾸미는 부사 Crucially(결정적으로)."]],"opts":["intense","intensively","intensify","intensifies"],"or":["intense(강렬한): 명사 sadness(슬픔)를 꾸미는 형용사라 맞음.","intensively(집중적으로): 부사라 명사 sadness(슬픔)를 꾸밀 수 없음.","intensify(강화하다): 동사라 명사 앞 꾸밈 자리에 못 오고, bring(불러오다)과 동사가 겹침.","intensifies(강화하다, 3인칭 단수형): 동사라 명사 sadness(슬픔)를 꾸밀 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"The first construal may bring intense sadness and anger.","ko":"첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다.","hl":["intense sadness"],"khl":["강렬한 슬픔"],"blocks":[{"t":"p","h":"꾸밈 화살표 긋기","x":["intense(강렬한) → sadness(슬픔). 화살표가 명사로 간다.","명사를 꾸미는 건 형용사의 일이다.","intensely(강렬하게)는 동사나 형용사를 꾸미는 부사다.","sadness and anger(슬픔과 분노) 둘 다 intense(강렬한)가 꾸민다."]},{"t":"pair","h":"쉬운 예시","x":[["He has a strong body.","그는 튼튼한 몸을 가졌다. (명사 body(몸) ← 형용사 strong(튼튼한))"],["He runs fast and strongly.","그는 빠르고 힘차게 달린다. (동사 runs(달린다) ← 부사)"]]}],"post":["명사 꾸미면 형용사: intense sadness(강렬한 슬픔)"]},{"slots":[["how","","","illustrates(보여 준다)의 목적어 자리. 뒤 문장이 완전해서 의문사 how(어떻게)가 맞다."],["powerfully","","","동사 transform(변화시키다)을 꾸미는 부사."],["repeated","","","When (they are) repeated(반복될 때). 결과들이 반복'되는' 쪽이라 p.p."],["to_shape","shape","a","문장의 진짜 동사는 might accumulate(축적될지도 모른다). 접속사 없이 동사를 또 쓸 수 없으니 to부정사로 이어 준다."],["psychological","","","명사 health(건강)를 꾸미는 형용사."]],"opts":["shapes","to shape","shaped","has shaped"],"or":["shapes(형성하다, 3인칭 단수형): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐.","to shape(형성하게 되다): 진짜 동사 accumulate(축적되다) 뒤에 결과를 이어 주는 to부정사라 맞음.","shaped(형성했다, shape의 과거·과거분사형): 동사로 읽으면 동사가 겹치고, p.p.로 읽으면 뒤 목적어 people's health(사람들의 건강)와 안 맞음.","has shaped(형성해 왔다): 현재완료도 진짜 동사라 접속사 없이 붙일 수 없음."],"point":"정동사 vs. 준동사","en":"When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people's psychological health.","ko":"오랫동안 반복되면, 재평가의 이러한 단기적인 감정적 결과들이 축적되어 사람들의 심리적 건강을 형성할지도 모른다.","hl":["might accumulate to shape"],"khl":["축적되어","형성할지도 모른다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["접속사 없이 문장 하나에 진짜 동사는 하나다.","이 문장의 진짜 동사: might accumulate(축적될지도 모른다).","shape(형성하다)를 그대로 붙이면 동사가 두 개가 된다.","to를 붙여 준동사로 바꾸면 \"쌓여서 ~을 만들게 된다\"는 결과 뜻이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["He grew up to be a doctor.","그는 자라서 의사가 되었다. (grew up(자랐다) + to be(~이 되다), 결과)"],["She woke up to find the house empty.","그녀는 깨어나 보니 집이 비어 있었다. (woke up(깨어났다) + to find(알게 되다))"]]},{"t":"tap","h":"확인 질문","q":"accumulate(축적되다)와 shape(형성하다) 사이에 and(그리고) 같은 접속사가 있는가?","a":["없다.","그래서 shape(형성하다)는 to shape(형성하게 되다)처럼 준동사 옷을 입어야 한다."]}],"post":["진짜 동사 accumulate(축적되다) + 결과 to shape(형성하게 되다)"]}],"quiz":[{"s":"Everyone ___ differently.","o":["think","thinks"],"a":1,"ko":"모두가 다르게 생각한다.","why":"Everyone(모두)은 단수로 세서 thinks(생각한다).","wy":"think(생각하다): 단수 주어 Everyone(모두)에는 s를 붙여야 함."},{"s":"I stayed home because it ___ all day.","o":["raining","rained"],"a":1,"ko":"하루 종일 비가 와서 나는 집에 있었다.","why":"because(~ 때문에) 뒤 주어 it(그것) + 진짜 동사 rained(비가 왔다).","wy":"raining(비가 오는): -ing는 혼자 동사 자리에 못 옴."},{"s":"I have a friend ___ lives in Busan.","o":["who","which"],"a":0,"ko":"나는 부산에 사는 친구가 있다.","why":"사람 a friend(친구)를 받는 관계대명사는 who(~하는).","wy":"which(~하는): 사물·동물을 받는 말이라 사람 a friend(친구)에 안 맞음."},{"s":"She has a ___ fear of dogs.","o":["strongly","strong"],"a":1,"ko":"그녀는 개를 몹시 무서워한다.","why":"명사 fear(두려움)를 꾸미니 형용사 strong(강한).","wy":"strongly(강하게): 부사라 명사 fear(두려움)를 꾸밀 수 없음."},{"s":"She went to the store ___ some milk.","o":["to buy","buy"],"a":0,"ko":"그녀는 우유를 사러 가게에 갔다.","why":"진짜 동사 went(갔다)가 있으니 to buy(사기 위해)로 잇는다.","wy":"buy(사다): 접속사 없이 동사가 하나 더 생김."}]},{"items":[{"slots":[["changing","changes","a","문장의 진짜 동사는 might present(제공할지도 모른다). 줄표(―) 안은 Reappraisal(재평가)을 풀어 주는 말이라 동명사(~하는 것)여야 한다."],["regulating","","","전치사 to(~로) 뒤의 동명사 regulating(조절하는 것)."],["transforms","","","because(~ 때문에) 절의 진짜 동사. 주어 it(그것)이 단수라 s."],["who","","","사람 someone(누군가)을 받는 who(~하는)."],["construed","","","it(그것)이 해석'되는' 쪽이라 수동태 be construed(해석되다)."]],"opts":["change","has changed","had changed","changing"],"or":["change(바꾸다): 동사원형이라 접속사 없이 동사가 하나 더 생김. 진짜 동사는 might present(제공할지도 모른다).","has changed(바꿔 왔다): 현재완료도 진짜 동사라 might present(제공할지도 모른다)와 동사가 겹침.","had changed(바꿨었다): 과거완료도 진짜 동사라 동사가 겹침.","changing(바꾸는 것): Reappraisal(재평가)이 무엇인지 풀어 주는 동명사라 맞음."],"point":"정동사 vs. 준동사","en":"Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions.","ko":"재평가, 즉 사람이 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다.","hl":["changing the way","might present"],"khl":["방식을 바꾸는 것은","제공할지도 모른다"],"blocks":[{"t":"p","h":"줄표(―)는 이름표 설명","x":["줄표(―) 두 개 사이는 앞 단어를 풀어 주는 설명이다.","Reappraisal(재평가) = changing the way(방식을 바꾸는 것).","명사를 풀어 주니까 설명도 명사 모양, 즉 동명사(~하는 것)다.","줄표 부분을 손가락으로 가리면 Reappraisal might present(재평가는 제공할지도 모른다)만 남는다."]},{"t":"tap","h":"확인 질문","q":"줄표(―) 안을 가리면 남는 진짜 동사는?","a":["might present(제공할지도 모른다).","그래서 줄표 안에 changes(바꾸다) 같은 동사가 또 오면 안 된다."]},{"t":"pair","h":"쉬운 예시","x":[["My dream, becoming a singer, is not easy.","내 꿈, 즉 가수가 되는 것은 쉽지 않다. (becoming(되는 것) = 꿈 설명, 진짜 동사 is(~이다))"],["His job ― teaching kids ― makes him happy.","그의 일, 즉 아이들을 가르치는 것은 그를 행복하게 한다. (진짜 동사 makes(만든다))"]]}],"post":["줄표(―) 안은 설명 changing(바꾸는 것), 진짜 동사는 might present(제공할지도 모른다)"]},{"slots":[["who","","","사람 someone(누군가)을 받는 주격 관계대명사."],["is_g","are","a","who(~하는) 뒤 동사는 앞 명사 someone(누군가)에 수를 맞춘다. someone(누군가)은 단수라 is(~이다)."],["construed","","","it(그것)이 해석'되는' 쪽이라 be construed(해석되다)."],["overpowering","","","상실이 사람을 압도'하는' 쪽이라 -ing."],["improved","","","관계가 개선'된' 것이라 p.p."]],"opts":["is","be","being","were"],"or":["is(~이다): 선행사 someone(누군가)이 단수이고 지금 이야기라 맞음. is going(겪고 있다).","be(~이다): 동사원형이라 who(~하는) 절의 동사 자리에 그대로 못 옴.","being(~인): -ing는 동사 자리에 못 와서 who(~하는) 절에 동사가 없어짐.","were(~였다): 복수·과거형이라 단수 someone(누군가)과 안 맞고, 지금 이야기와도 안 맞음."],"point":"관계대명사절의 수일치","en":"Take, for example, someone who is going through a divorce.","ko":"예를 들어, 이혼을 겪고 있는 누군가를 생각해 보자.","hl":["someone who is going"],"khl":["겪고 있는 누군가"],"blocks":[{"t":"p","h":"who(~하는)는 거울","x":["관계대명사 who(~하는)는 앞 명사를 그대로 비추는 거울이다.","who(~하는) 뒤 동사는 거울 속 someone(누군가)을 보고 수를 맞춘다.","someone(누군가) = 한 사람 → is(~이다).","-one(사람), -body(사람)로 끝나는 말은 모두 단수다."]},{"t":"pair","h":"쉬운 예시","x":[["I know a boy who has three dogs.","나는 개를 세 마리 키우는 소년을 안다. (a boy(소년) → has(가지다))"],["I know boys who have a cat.","나는 고양이를 키우는 소년들을 안다. (boys(소년들) → have(가지다))"]]}],"post":["someone(누군가) who is(~인) ~ : 선행사 단수 → is(~이다)"]},{"slots":[["overpowering","","","상실이 사람을 압도'하는' 쪽이라 -ing."],["that_m","what","a","앞에 명사 loss(상실)가 있다. 명사를 꾸미는 관계대명사는 that(~하는). what(~하는 것)은 앞에 명사가 없을 때만 쓴다."],["lead","","","조동사 might(~할지도 모른다) 뒤라 동사원형."],["improved","","","관계가 개선'된' 것이라 p.p."],["these","","","복수 명사 construals(해석들) 앞이라 these(이러한)."]],"opts":["whom","that","whose","where"],"or":["whom(~을): 사람을 받는 목적격이라 사물 loss(상실)에도, 주어가 빠진 자리에도 안 맞음.","that(~하는): 명사 loss(상실)를 꾸미고 뒤에 주어가 빠져 있어 맞음.","whose(~의): 바로 뒤에 명사가 와야 하는데 will mark(남길 것이다)가 옴.","where(~하는 곳): 관계부사라 뒤 문장이 완전해야 하는데 주어가 빠져 있음."],"point":"that/which vs. what","en":"One might view it as an overpowering loss that will mark one's family for life.","ko":"누군가는 그것을 자신의 가족에게 평생 흔적을 남길 강렬한 상실로 여길지도 모른다.","hl":["loss that will mark"],"khl":["평생 흔적을 남길 강렬한 상실"],"blocks":[{"t":"p","h":"앞에 명사가 있나 보기","x":["앞 명사 loss(상실) 뒤에 꾸미는 말이 붙는다.","명사를 뒤에서 꾸미는 관계대명사는 that(~하는)이나 which(~하는).","what(~하는 것)은 \"것\"이라는 명사를 이미 품고 있다.","그래서 명사 바로 뒤에 what(~하는 것)이 오면 명사가 겹친다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the song that I love.","이것이 내가 사랑하는 노래다. (명사 the song(노래) + that)"],["What I love is this song.","내가 사랑하는 것은 이 노래다. (앞에 명사 없이 What)"]]}],"post":["명사 loss(상실) + that(~하는) / 앞에 명사 없으면 what(~하는 것)"]},{"slots":[["lead","leading","a","might(~할지도 모른다)는 조동사다. 조동사 뒤에는 언제나 동사원형이 온다."],["improved","","","관계가 개선'된' 것이라 p.p."],["these","","","복수 construals(해석들) 앞이라 these(이러한)."],["crucially","","","문장 전체를 꾸미는 부사 Crucially(결정적으로)."],["illustrates","","","주어 This example(이 예시)이 단수라 illustrates(보여 준다)."]],"opts":["leads","to lead","led","lead"],"or":["leads(이어지다, 3인칭 단수형): 조동사 뒤에는 s를 붙이지 않음.","to lead(이어지는 것): 조동사 might(~할지도 모른다) 뒤에는 to 없이 원형이 옴.","led(이어졌다, lead의 과거·과거분사형): 조동사 뒤에 과거형이 올 수 없음.","lead(이어지다): 조동사 might(~할지도 모른다) 뒤 동사원형이라 맞음."],"point":"조동사 + 동사원형","en":"Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.","ko":"이와는 달리, 누군가는 그것을 고통스럽기는 하지만 개선된 관계와 같이 장기적으로는 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다.","hl":["might lead"],"khl":["이어질 수 있는"],"blocks":[{"t":"p","h":"조동사는 원형을 데리고 다닌다","x":["can(~할 수 있다), will(~할 것이다), may(~할지도 모른다), might(~할지도 모른다)는 조동사다.","조동사 뒤 동사는 옷을 다 벗은 원형이다.","s도, -ing도, to도, 과거형도 붙지 않는다.","같은 지문의 might feel(느낄지도 모른다), might accumulate(축적될지도 모른다)도 같은 구조다."]},{"t":"pair","h":"쉬운 예시","x":[["We can swim in the river.","우리는 강에서 수영할 수 있다. (can(~할 수 있다) + swim(수영하다))"],["It may rain tomorrow.","내일 비가 올지도 모른다. (may(~할지도 모른다) + rain(비가 오다))"]]}],"post":["might(~할지도 모른다) + 동사원형 lead(이어지다)"]},{"slots":[["crucially","","","콤마 앞에서 문장 전체를 꾸미는 부사."],["illustrates","illustrate","a","주어는 This example(이 예시), 한 개다. 3인칭 단수 현재라 s가 붙는다."],["how","","","뒤 문장이 완전해서 의문사 how(어떻게)."],["repeated","","","결과들이 반복'되는' 쪽이라 p.p."],["psychological","","","명사 health(건강)를 꾸미는 형용사."]],"opts":["illustrating","to illustrate","illustrates","have illustrated"],"or":["illustrating(보여 주는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐.","to illustrate(보여 주는 것): to부정사도 동사 자리에 못 옴.","illustrates(보여 준다): 주어 This example(이 예시)이 단수라 s 붙은 현재형이 맞음.","have illustrated(보여 왔다): 단수 주어 This example(이 예시)에는 have(복수용)가 아니라 has(단수용)를 씀."],"point":"주어-동사 수일치","en":"This example illustrates how reappraisal might powerfully transform short-term emotional responses.","ko":"이 예시는 재평가가 어떻게 단기적인 감정적 반응들을 강력하게 변화시킬 수 있을지를 보여 준다.","hl":["This example illustrates"],"khl":["이 예시는","보여 준다"],"blocks":[{"t":"p","h":"주어 하나면 동사에 s 하나","x":["This(이) + example(예시) = 한 개.","주어가 한 개이고 지금 일이면 동사에 s를 붙인다.","This example illustrates(이 예시는 보여 준다).","These examples illustrate(이 예시들은 보여 준다)와 나란히 놓고 보면 확실하다." ,["The bird sings in the morning.","그 새는 아침에 노래한다. (bird(새) → sings(노래한다))"]]}],"post":["These guidelines(이러한 지침들) 복수 → inform(알려 주다), s 없음"]},{"slots":[["safe","","","is(~이다) 뒤 보어 자리라 형용사."],["drinking","","","whether(~이든) 뒤에 나열되는 첫 번째 -ing."],["running","runs","a","drinking(마시는 것), watering(물을 주는 것), ___ 세 개가 or(혹은)로 나란히 이어진다. 앞 둘이 -ing라 마지막도 -ing여야 한다."],["utilize","","","조동사 can’t(~할 수 없다) 뒤라 동사원형 utilize(활용하다)."],["because","","","뒤에 주어 we(우리)와 동사 use(사용하다)가 있는 문장이라 접속사 because(~ 때문에)."]],"opts":["running","ran","has run","had run"],"or":["running(흘려보내는 것): drinking(마시는 것), watering(물을 주는 것)과 같은 -ing라 나란히 맞음.","ran(흘려보냈다, run의 과거형): 동사라 앞의 -ing 두 개와 모양이 안 맞음.","has run(흘려보내 왔다): 진짜 동사라 -ing 나열 속에 들어갈 수 없음.","had run(흘려보냈었다): 과거완료 동사라 -ing 나열과 짝이 안 맞음."],"point":"병렬구조","en":"These rules ensure the water is safe for anything we want to do with it, whether that’s drinking it at home, watering crops on a farm, or running it through a huge industrial boiler.","ko":"이러한 규칙들은 우리가 물로 하고 싶은 것이 집에서 물을 마시는 것이든, 농장에서 작물들에 물을 주는 것이든, 혹은 거대한 산업용 보일러를 통해 물을 흘려보내는 것이든 간에 그것에서 그 물이 안전하다고 보장한다.","hl":["drinking","watering","running"],"khl":["마시는 것이든","물을 주는 것이든","흘려보내는 것이든"],"blocks":[{"t":"p","h":"기차 칸은 같은 모양","x":["A, B, or C(A, B 혹은 C)는 기차 칸처럼 같은 모양으로 연결된다.","1번 칸: drinking it(그것을 마시는 것)","2번 칸: watering crops(작물에 물을 주는 것)","3번 칸도 -ing: running it(그것을 흘려보내는 것)","runs(흘려보내다)를 넣으면 마지막 칸만 모양이 달라 탈선한다."]},{"t":"pair","h":"쉬운 예시","x":[["I like swimming, reading, and cooking.","나는 수영, 독서, 요리를 좋아한다. (-ing 세 칸)"],["He came, saw, and won.","그는 와서 보고 이겼다. (과거형 세 칸)"]]}],"post":["drinking, watering, or running(마시는 것, 물을 주는 것, 혹은 흘려보내는 것): -ing 세 칸"]},{"slots":[["diverse","","","명사 things(것들)를 꾸미는 형용사 diverse(다양한)."],["that_c","what","a","앞에 명사 the water(물)가 있다. 명사를 꾸미는 관계대명사는 that(~하는). what(~하는 것)은 앞에 명사가 없을 때 쓴다."],["doesnt","","","주어 the water(물)가 단수라 doesn’t(~하지 않다). 사이의 that ~ generator(~하는 발전기) 부분은 꾸밈말."],["clean","","","as ~ as(~만큼) 사이에는 원급. be(~이다) 뒤 보어라 형용사 clean(깨끗한)."],["why","","","This is why(이것이 ~한 이유이다) + 완전한 문장. 관계부사 why(~하는 이유)."]],"opts":["whom","that","whose","where"],"or":["whom(~을): 사람을 받는 목적격이라 사물 the water(물)와도, 주어가 빠진 자리와도 안 맞음.","that(~하는): 명사 the water(물)를 꾸미고 뒤에 주어가 빠져 있어 맞음.","whose(~의): 바로 뒤에 명사가 와야 하는데 동사 cools(식히다)가 옴.","where(~하는 곳): 관계부사라 뒤 문장이 완전해야 하는데 주어가 빠져 있음."],"point":"that/which vs. what","en":"For instance, the water that cools down a huge power plant generator doesn’t need to be as clean as the water you drink from the kitchen tap.","ko":"예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지로부터 마시는 물만큼 깨끗할 필요가 없다.","hl":["the water that cools"],"khl":["발전기를 식히는 물은"],"blocks":[{"t":"p","h":"빈자리 확인","x":["that(~하는) 뒤를 보면 cools down(식힌다)부터 시작한다.","누가 식히는지, 주어 자리가 비어 있다.","그 빈자리를 앞 명사 the water(물)가 채운다.","what(~하는 것)은 앞에 명사가 없어야 하므로 여기선 실격."]},{"t":"pair","h":"쉬운 예시","x":[["I lost the pen that my dad gave me.","나는 아빠가 주신 펜을 잃어버렸다. (명사 the pen(펜) + that)"],["I lost what my dad gave me.","나는 아빠가 주신 것을 잃어버렸다. (명사 없이 what)"]]}],"post":["명사 the water(물) + that cools(식히는) / 명사 없으면 what(~하는 것)"]},{"slots":[["cools","","","선행사 the water(물)가 단수라 cools(식히다)."],["doesnt","","","주어 the water(물)가 단수라 doesn’t(~하지 않다)."],["clean","","","as ~ as(~만큼) 사이 원급 형용사."],["why","","","뒤 문장이 완전하고 이유를 말하니 why(~하는 이유)."],["be_utilized","utilize","a","it(그것)은 물이다. 물은 스스로 무언가를 활용하는 게 아니라 사람에게 활용'되는' 쪽이라 be + p.p. 수동태."]],"opts":["utilizing","utilized","be utilized","utilizes"],"or":["utilizing(활용하는): 조동사 will(~할 것이다) 뒤에 -ing는 못 옴.","utilized(활용했다, 활용된): 조동사 will(~할 것이다) 뒤에는 원형이 와야 하므로 be가 빠지면 안 됨.","be utilized(활용되다): 물이 사람에게 활용'되는' 쪽이라 will(~할 것이다) + be + p.p. 수동태가 맞음.","utilizes(활용하다, 3인칭 단수형): 조동사 뒤에 s 붙은 동사는 못 옴."],"point":"능동태 vs. 수동태","en":"This is why groups set different “safety limits” for the water dependent on how it will be utilized.","ko":"이것이 물이 어떻게 활용될지에 따라 집단들이 그것에 대한 각기 다른 ‘안전 허용치’를 설정하는 이유이다.","hl":["it will be utilized"],"khl":["어떻게 활용될지에"],"blocks":[{"t":"p","h":"하는 쪽인가, 당하는 쪽인가","x":["utilize(활용하다)는 무엇을 활용하는지 목적어가 필요하다.","how it will utilize(그것이 어떻게 활용할지)라고 쓰면 뒤에 목적어가 없다.","게다가 물이 무언가를 활용할 수는 없다.","물은 사람이 쓰는 대상이니 be utilized(활용되다)."]},{"t":"tap","h":"확인 질문","q":"how it will utilize(그것이 어떻게 활용할지)에서 utilize(활용하다)의 목적어는 어디 있나?","a":["없다.","목적어가 없고 주어가 당하는 쪽이면 수동태 be utilized(활용되다)."]},{"t":"pair","h":"쉬운 예시","x":[["English is spoken in many countries.","영어는 많은 나라에서 사용된다. (영어는 말해지는 쪽 → is spoken(말해진다))"],["The cake was eaten by my brother.","그 케이크는 내 남동생이 먹었다. (케이크는 먹히는 쪽 → was eaten(먹혔다))"]]}],"post":["물 = 활용'되는' 쪽 → will be utilized(활용될 것이다)"]}],"quiz":[{"s":"She is good at ___ pictures.","o":["drawing","draw"],"a":0,"ko":"그녀는 그림을 잘 그린다.","why":"전치사 at(~에) 뒤는 동명사 drawing(그리는 것).","wy":"draw(그리다): 전치사 at(~에) 뒤에 동사원형은 못 옴."},{"s":"These cookies ___ sweet.","o":["tastes","taste"],"a":1,"ko":"이 쿠키들은 단맛이 난다.","why":"복수 주어 These cookies(이 쿠키들) → taste(맛이 나다).","wy":"tastes(맛이 나다, 3인칭 단수형): 단수 주어용이라 복수 cookies(쿠키들)와 안 맞음."},{"s":"He opened the door, looked around, and ___ inside.","o":["walking","walked"],"a":1,"ko":"그는 문을 열고, 주위를 둘러보고, 안으로 걸어 들어갔다.","why":"opened(열었다), looked(둘러봤다)와 나란히 과거형 walked(걸었다).","wy":"walking(걷는): 앞의 과거형 동사 두 개와 모양이 안 맞음."},{"s":"Look at the bird ___ is singing.","o":["that","what"],"a":0,"ko":"노래하고 있는 저 새를 봐.","why":"앞에 명사 the bird(새)가 있으니 that(~하는).","wy":"what(~하는 것): 앞에 명사가 있으면 쓸 수 없음."},{"s":"The letter was ___ by my sister.","o":["written","writing"],"a":0,"ko":"그 편지는 내 여동생이 썼다.","why":"편지는 쓰이는 쪽이라 be + p.p. written(쓰인).","wy":"writing(쓰는): 편지가 스스로 쓰는 게 아니고, by my sister(내 여동생에 의해)와도 안 맞음."}]},{"items":[{"slots":[["that_s","","","say(말하다)의 목적어 문장을 이끄는 접속사 that(~라고)."],["following","","","전치사 about(~에 관한) 뒤의 동명사."],["exactly","exact","a","뒤의 how much(얼마나 많이) 이하 덩어리를 꾸미는 자리. 명사가 아닌 말을 꾸미는 건 부사다."],["much","","","셀 수 없는 stuff(것, 물질) 앞이라 much(많은)."],["safe","","","is(~이다) 뒤 보어 자리라 형용사."]],"opts":["exactness","exactly","exacting","exacts"],"or":["exactness(정확성): 명사라 inform us(우리에게 알려 주다) 뒤에서 how(얼마나) 덩어리를 꾸밀 수 없음.","exactly(정확히): how much(얼마나 많이) 덩어리를 꾸미는 부사라 맞음.","exactin
