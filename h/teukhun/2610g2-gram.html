<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}

.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}

.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}

.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}

.chw small{font-size:.85rem;color:var(--sub);font-weight:400}

.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}

.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}

osophers {enjoyed|enjoyed} positions of high privilege and influence. {because_of|Because of} their practice of contemplation for the highest human good, philosophers {were_considered|were considered} {worthy|worthy} to have all the best things in life. Somehow that assertion {seems|seems} {oddly|oddly} self-serving. It serves us to remember {that|that} every great thinker {is1|is} of her own time and {speaks|speaks} to a particular audience, and certainly Aristotle is no exception. Human flourishing as he understood it probably would not be nearly as {inclusive|inclusive} as we would want {it|it} {to_be|to be} today. How he understood right and good {is2|is} best {taken|taken} to be an indicator of how the privileged elite of ancient Greek society {tended|tended} to understand right and good. As a result, for all it does well, it is also {deeply|deeply} flawed.","fn":["*contemplation: 사유, 깊은 생각","*self-serving: 자기 잇속만 차리는","*flourishing: 번영","*flawed: 결함이 있는"],"mean":{"Consistent":"일관적인(형용사)","Consistently":"일관되게(부사)","Consisted":"이루어졌다(consist의 과거형·과거분사형)","Consist":"이루어지다, 있다(동사원형)","Consists":"이루어지다, 있다(consist의 3인칭 단수 현재형)","meet":"만나다, 다가오다(동사원형·복수 주어 현재형)","meets":"만나다, 다가오다(meet의 3인칭 단수 현재형)","meeting":"만나는, 만나는 것(meet의 -ing형)","to meet":"만나는 것, 만나기 위해(meet의 to부정사)","having met":"만나고 나서(meet의 완료 -ing형)","justifying":"정당화하는 것(justify의 -ing형, 동명사)","justify":"정당화하다(동사원형)","justified":"정당화했다, 정당화된(justify의 과거형·과거분사형)","justifies":"정당화하다(justify의 3인칭 단수 현재형)","justification":"정당화(명사)","enjoyed":"누렸다(enjoy의 과거형)","Because of":"~ 때문에(전치사, 뒤에 명사)","Because":"~ 때문에(접속사, 뒤에 주어 + 동사)","Although":"비록 ~이지만(접속사, 뒤에 주어 + 동사)","Unless":"~하지 않는다면(접속사, 뒤에 주어 + 동사)","Even if":"설령 ~일지라도(접속사, 뒤에 주어 + 동사)","were considered":"여겨졌다(consider의 과거 수동형, 복수 주어)","considered":"여겼다(consider의 과거형) / 여겨진(과거분사형)","were considering":"고려하고 있었다(consider의 과거진행형)","considering":"고려하는(consider의 -ing형)","has considered":"여겨 왔다(consider의 현재완료형, 단수 주어)","worthy":"~할 가치가 있는, ~할 만한(형용사)","seems":"~처럼 일부)는 뒤를 본다","x":["some(일부), most(대부분), half(절반), all(모두) + of(~ 중) + 명사.","이런 말이 주어면 of(~ 중) 뒤 명사를 보고 동사를 정한다.","여기서 of(~ 중) 뒤는 ideas(생각들), 복수다.","그래서 동사도 복수, s 없는 meet(다가오다).","Aristotle's(아리스토텔레스의)가 한 사람이라고 단수로 착각하면 안 된다."]},{"t":"pair","h":"쉬운 예시","x":[["Some of the cookies are gone.","쿠키들 중 일부가 없어졌다. (cookies(쿠키들) 복수 → are(~이다))"],["Some of the cake is gone.","케이크 중 일부가 없어졌다. (cake(케이크) 단수 → is(~이다))"]]}],"post":["some of(~ 중 일부) + 복수 ideas(생각들) → meet(다가오다)"]},{"slots":[["justifying","justify","a","have no difficulty(어려움이 없다) 뒤에는 -ing가 온다. 원래 have difficulty in(~하는 데 어려움이 있다) -ing에서 in(~에서)이 빠진 모양이라 동사원형은 못 온다."],["oddly","","","형용사 self-serving(자기 잇속만 차리는)을 꾸미는 부사 oddly(이상하게도)."],["is1","","","주어 every great thinker(모든 위대한 사상가)가 단수라 is(~이다)."],["it","","","앞의 Human flourishing(인간 번영)을 받는 단수 대명사 it(그것)."],["tended","","","how(어떻게) 뒤 문장의 진짜 동사라 과거형 tended(경향이 있었다)."]],"opts":["justifying","justified","justifies","justification"],"or":["justifying(정당화하는 것): have no difficulty(어려움이 없다) 뒤에는 -ing가 와서 맞음.","justified(정당화했다, 정당화된): 과거형이면 had(가졌다)와 동사가 겹치고, p.p.로 보면 뒤 목적어 slavery(노예 제도)와 안 맞음.","justifies(정당화한다): 동사라 had(가졌다)와 겹치고, 시제도 안 맞음.","justification(정당화): 명사라 뒤에 목적어 slavery(노예 제도)를 바로 받을 수 없음."],"point":"동명사 관용 표현","en":"He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.","ko":"예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다.","hl":["had no difficulty justifying"],"khl":["정당화하는 데 아무런 어려움이 없었고"],"blocks":[{"t":"p","h":"-ing와 붙어 다니는 단짝","x":["have difficulty(어려움이 있다) -ing = ~하는 데 어려움이 있다.","have trouble(애먹다) -ing, have a hard time(힘든 시간을 보내다) -ing도 같은 식구다.","원래는 in(~에서)이 있던 자리라 -ing가 온다.","앞에 no(없는)가 붙어도 규칙은 그대로다."]},{"t":"pair","h":"쉬운 예시","x":[["I had trouble finding the bus stop.","나는 버스 정류장을 찾는 데 애를 먹었다. (had trouble(애를 먹었다) + finding(찾는 것))"],["She has no difficulty speaking English.","그녀는 영어로 말하는 데 아무 어려움이 없다. (has no difficulty(어려움이 없다) + speaking(말하는 것))"]]}],"post":["have no difficulty(어려움이 없다) + -ing: justifying(정당화하는 것)"]},{"slots":[["consistent","","","be(~이다) 뒤 보어가 앞으로 나온 형용사."],["because_of","Because","a","뒤에 their practice of contemplation(그들의 사유의 실천)이라는 명사 덩어리만 있고 동사가 없다. 접속사 Because(~ 때문에)는 주어와 동사가 있는 문장을 이끈다."],["speaks","","","주어 every great thinker(모든 위대한 사상가)의 두 번째 동사. is(~이다)와 and(그리고)로 나란하고 단수라 speaks(말한다)."],["is2","","","주어는 How he understood right and good(그가 옳음과 선을 어떻게 이해했는가) 덩어리 하나라 단수 is(~이다)."],["deeply","","","형용사 flawed(결함이 있는)를 꾸미는 부사."]],"opts":["Although","Because of","Unless","Even if"],"or":["Although(비록 ~이지만): 접속사라 뒤에 주어와 동사가 있어야 하는데 명사 덩어리만 옴.","Because of(~ 때문에): 뒤에 명사 덩어리 their practice(그들의 실천)가 오니 전치사가 맞음.","Unless(~하지 않는다면): 접속사라 뒤에 문장이 와야 하는데 명사 덩어리만 옴.","Even if(설령 ~일지라도): 접속사라 뒤에 문장이 와야 하는데 명사 덩어리만 옴."],"point":"전치사 vs. 접속사","en":"Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.","ko":"그들의 인간의 최고선에 대한 사유의 실천 때문에, 철학자들은 삶에서 모든 최고의 것들을 가질 만하다고 여겨졌다.","hl":["Because of their practice"],"khl":["사유의 실천 때문에"],"blocks":[{"t":"p","h":"뒤에 동사가 있나 없나","x":["Because of(~ 때문에) 뒤 덩어리를 콤마까지 읽어 본다.","their practice of contemplation for the highest human good(인간의 최고선에 대한 그들의 사유의 실천).","명사 practice(실천)만 있고 동사는 없다.","명사 덩어리 앞엔 전치사 Because of(~ 때문에).","주어 + 동사가 있는 문장 앞엔 접속사 Because(~ 때문에)."]},{"t":"pair","h":"쉬운 예시","x":[["We stayed home because of the rain.","우리는 비 때문에 집에 있었다. (명사 the rain(비) → because of(~ 때문에))"],["We stayed home because it rained.","비가 와서 우리는 집에 있었다. (문장 it rained(비가 왔다) → because(~ 때문에))"]]}],"post":["명사 덩어리 앞 = Because of(~ 때문에): Because of their practice(그들의 실천 때문에)"]},{"slots":[["meet","","","주어 some of Aristotle's ideas(아리스토텔레스의 생각들 중 일부)가 복수."],["enjoyed","","","philosophers(철학자들)의 진짜 동사, 과거형."],["were_considered","considered","a","철학자들은 남들에게 \"여겨지는\" 쪽이다. 뒤에 consider(여기다)의 목적어도 없다. 그래서 수동 were considered(여겨졌다)."],["inclusive","","","as ~ as(~만큼) 사이 보어 자리 형용사."],["taken","","","How 덩어리가 \"여겨지는\" 쪽이라 수동 taken(여겨지는)."]],"opts":["were considering","considering","were considered","has considered"],"or":["were considering(고려하고 있었다): 능동이라 뒤에 consider(여기다)의 목적어가 있어야 하는데 없고, 뜻도 안 맞음.","considering(고려하는): -ing만으로는 동사가 못 되어 문장에 진짜 동사가 없어짐.","were considered(여겨졌다): 철학자들이 여겨지는 쪽이고 목적어가 없으니 수동태가 맞음.","has considered(여겨 왔다): 능동이라 목적어가 없고, 주어 philosophers(철학자들)는 복수라 has(단수형)도 틀림."],"point":"능동태 vs. 수동태","en":"Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.","ko":"그들의 인간의 최고선에 대한 사유의 실천 때문에, 철학자들은 삶에서 모든 최고의 것들을 가질 만하다고 여겨졌다.","hl":["philosophers were considered worthy"],"khl":["가질 만하다고 여겨졌다"],"blocks":[{"t":"p","h":"목적어가 사라지면 수동태","x":["능동: People considered philosophers worthy.(사람들은 철학자들을 가치 있다고 여겼다.)","수동: Philosophers were considered worthy.(철학자들은 가치 있다고 여겨졌다.)","능동 문장의 목적어 philosophers(철학자들)가 주어 자리로 올라갔다.","그래서 consider(여기다) 뒤에 목적어가 비어 있다.","목적어 없이 considered(여겼다)만 쓰면 누구를 여겼는지 빠진 문장이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["English is spoken in many countries.","영어는 많은 나라에서 쓰인다. (영어가 쓰이는 쪽 → is spoken(쓰인다))"],["He is considered a hero.","그는 영웅으로 여겨진다. (그가 여겨지는 쪽 → is considered(여겨진다))"]]}],"post":["여겨지는 쪽은 be + p.p.: philosophers were considered(철학자들은 여겨졌다)"]}],"quiz":[{"s":"She looks ___ today.","o":["happy","happily"],"a":0,"ko":"그녀는 오늘 행복해 보인다.","why":"look(~해 보이다) 뒤 보어 자리는 형용사.","wy":"happily(행복하게): 부사라 보어 자리에 못 옴."},{"s":"Some of my friends ___ from Busan.","o":["is","are"],"a":1,"ko":"내 친구들 중 일부는 부산 출신이다.","why":"some of(~ 중 일부) 뒤 friends(친구들)가 복수라 are(~이다).","wy":"is(~이다): 단수 동사라 복수 friends(친구들)와 안 맞음."},{"s":"I had trouble ___ the door.","o":["open","opening"],"a":1,"ko":"나는 문을 여는 데 애를 먹었다.","why":"have trouble(애먹다) 뒤는 -ing.","wy":"open(열다): have trouble(애먹다) 뒤에 동사원형은 못 옴."},{"s":"The game was canceled ___ the snow.","o":["because of","because"],"a":0,"ko":"그 경기는 눈 때문에 취소되었다.","why":"뒤에 명사 the snow(눈)만 있으니 전치사 because of(~ 때문에).","wy":"because(~ 때문에, 접속사): 뒤에 주어와 동사가 있는 문장이 와야 함."},{"s":"This bridge ___ in 1990.","o":["built","was built"],"a":1,"ko":"이 다리는 1990년에 지어졌다.","why":"다리는 지어지는 쪽이라 수동 was built(지어졌다).","wy":"built(지었다): 능동이라 다리가 무언가를 지었다는 뜻이 되고 목적어도 없음."}]},{"items":[{"slots":[["justifying","","","have no difficulty(어려움이 없다) 뒤 -ing."],["worthy","","","were considered(여겨졌다) 뒤 보어 자리 형용사."],["that","what","a","remember(기억하다) 뒤 문장 every great thinker is of her own time(모든 위대한 사상가는 자기 시대에 속한다)은 완전하다. 완전한 문장 앞엔 that(~라는 것)."],["it","","","Human flourishing(인간 번영)을 받는 단수 대명사."],["deeply","","","형용사 flawed(결함이 있는)를 꾸미는 부사."]],"opts":["which","whom","whose","that"],"or":["which(어느 것): 뒤에 빈자리가 있어야 하는데 완전한 문장이라 못 옴.","whom(누구를): 목적어 빈자리가 있어야 하는데 뒤 문장에 빈자리가 없음.","whose(누구의): 소유를 묻는 말이라 뒤 문장과 뜻이 엉키고, remember(기억하다)의 내용을 이끌 수 없음.","that(~라는 것): 뒤 문장이 주어·동사를 다 갖춘 완전한 문장이라 명사절 접속사 that이 맞음."],"point":"that/which vs. what","en":"It serves us to remember that every great thinker is of her own time and speaks to a particular audience.","ko":"모든 위대한 사상가는 자기 자신의 시대에 속해 있고 특정한 청중에게 말한다는 것을 기억하는 것이 우리에게 도움이 된다.","hl":["remember that"],"khl":["기억하는 것이"],"blocks":[{"t":"p","h":"빈자리 검사","x":["that(~라는 것) 뒤 문장을 쪼개 본다.","every great thinker(모든 위대한 사상가) = 주어.","is of her own time(자기 시대에 속한다) = 동사 + 꾸밈말.","and speaks to a particular audience(그리고 특정한 청중에게 말한다) = 두 번째 동사.","빠진 자리가 없다. 그래서 what(~하는 것)이 아니라 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["Remember that you are not alone.","네가 혼자가 아니라는 것을 기억해라. (완전한 문장 → that(~라는 것))"],["Remember what I told you.","내가 너에게 말한 것을 기억해라. (told(말했다)의 목적어가 빠짐 → what(~하는 것))"]]}],"post":["완전한 문장 앞 = that(~라는 것): remember that(~라는 것을 기억하다)"]},{"slots":[["consistent","","","be(~이다) 뒤 보어가 앞으로 나온 형용사."],["seems","","","주어 that assertion(그 주장)이 단수."],["is1","are","a","주어는 every great thinker(모든 위대한 사상가). every(모든)는 하나하나를 가리켜서 단수로 센다. 그래서 is(~이다)."],["speaks","","","is(~이다)와 and(그리고)로 나란한 두 번째 동사. 단수 주어라 speaks(말한다)."],["tended","","","how(어떻게) 뒤 문장의 진짜 동사."]],"opts":["is","being","been","to be" e"],"or":["whom(~을): 사람을 받는 말인데 a race(경주)는 사람이 아님.","which(~하는): 사물 a race(경주)를 받고, 전치사 in(~에서) 뒤에 올 수 있는 관계대명사라 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 a hurdle(허들 하나)은 관사 a가 있어 소유격과 함께 못 씀.","where(~하는 곳): 관계부사라 앞에 전치사 in(~에서)을 붙일 수 없음."],"point":"that/which vs. what","en":"You might think of survival as a race in which a hurdle has to be jumped every year.","ko":"여러분은 생존을 매년 하나의 허들을 뛰어넘어야 하는 경주라고 생각할지도 모른다.","hl":["a race in which","a hurdle has to be jumped"],"khl":["경주","허들을 뛰어넘어야 하는"],"blocks":[{"t":"p","h":"what(~하는 것)은 명사를 이미 품고 있다","x":["what(~하는 것) = the thing which(~하는 것). 속에 \"것\"이라는 명사가 들어 있다.","그래서 앞에 a race(경주) 같은 명사가 또 오면 명사가 두 번이 된다.","in which(그 안에서) = 그 경주 안에서.","뒤 문장 a hurdle has to be jumped(허들이 넘어져야 한다)는 빠진 것 없이 완전하다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the box in which I keep my toys.","이것은 내가 장난감을 넣어 두는 상자다. (명사 the box(상자) + in which(그 안에))"],["What I want is a new bike.","내가 원하는 것은 새 자전거다. (앞에 명사 없이 what(~하는 것))"]]},{"t":"tap","h":"확인 질문","q":"in which(그 안에서)를 관계부사 하나로 바꾸면?","a":["where(~하는 곳).","a race in which = a race where(허들을 넘는 경주). 하지만 in where(~하는 곳에서)는 안 된다."]}],"post":["명사(a race) + in which(그 안에서) + 완전한 문장"]},{"slots":[["clearing","","","전치사 before(~하기 전에) 뒤라 동명사(-ing)가 맞다."],["extremely","extreme","a","wasteful(낭비하는)은 형용사다. 형용사를 꾸미는 건 부사다."],["become","","","조동사 will(~할 것이다) 뒤라 동사원형 become(~이 되다)."],["which2","","","앞 문장 내용 전체를 받는 콤마 뒤 which(그런데 그것은)다."],["failed","","","whom(그들 중) 절의 진짜 동사, 과거형이다."]],"opts":["extremely","extremity","extremes","extremist"],"or":["extremely(극도로): 형용사 wasteful(낭비하는)을 앞에서 꾸미는 부사라 맞음.","extremity(극단, 끝): 명사라 형용사 wasteful(낭비하는)을 꾸밀 수 없음.","extremes(극단들): 복수 명사라 형용사 앞 꾸밈 자리에 못 옴.","extremist(극단주의자): 사람을 뜻하는 명사라 형용사를 꾸밀 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"Demographically, humankind was living close to a state of nature, and nature is extremely wasteful of life.","ko":"인구 통계학적으로, 인류는 자연 상태에 가깝게 살았었고, 자연은 생명을 극도로 낭비한다.","hl":["extremely wasteful"],"khl":["극도로 낭비한다"],"blocks":[{"t":"p","h":"누구를 꾸 ny people(많은 사람들)의 과거형 동사."],["which2","","","앞 문장 내용 전체를 받는 계속적 용법 which(그런데 그것은)."],["whom","","","전치사 of(~중의) 뒤 목적격 관계대명사."],["reproduce","","","to(~할) 뒤 동사원형."],["would_have","will have","a","앞에 Had it been(만약 그랬더라면)이 있다. 과거를 뒤집어 상상하는 가정법이라 would have p.p.(~했을 것이다)."]],"opts":["would be","would have","will","had"],"or":["would be(~일 것이다): occur(일어나다)는 수동태로 못 쓰고, 뒤의 occurred(일어난)와 이어질 수 없음.","would have(~했을 것이다): Had it been(만약 그랬더라면)과 짝인 가정법 과거완료 주절이라 맞음.","will(~할 것이다): 조동사 will 뒤에는 원형이 와야 하는데 occurred(일어났다)가 옴.","had(~했었다): 가정법의 주절에는 would(~할 것이다) 같은 조동사가 꼭 있어야 함."],"point":"가정법 과거완료","en":"Had it been otherwise, the huge recent growth in human population would have occurred much earlier.","ko":"만약 그렇지 않았더라면, 최근의 엄청난 인구 증가는 훨씬 더 일찍 일어났었을 것이다.","hl":["would have occurred","Had it been"],"khl":["일어났었을 것이다","그렇지 않았더라면"],"blocks":[{"t":"p","h":"과거를 뒤집는 상상의 짝","x":["실제: 옛날엔 많이 죽었다. 그래서 인구가 늦게 늘었다.","상상: 그렇지 않았더라면 더 일찍 늘었을 것이다.","과거를 뒤집는 상상의 짝: Had(~했더라면) + 주어 + p.p., 주어 + would have(~했을 것이다) + p.p.","will have(~했을 것이다, 미래완료)는 미래 이야기라 짝이 안 맞는다."]},{"t":"pair","h":"쉬운 예시","x":[["If I had studied, I would have passed.","내가 공부했더라면 합격했을 텐데. (had studied(공부했더라면) ↔ would have passed(합격했을 텐데))"],["Had it not rained, we would have gone out.","비가 오지 않았더라면 우리는 나갔을 텐데. (Had it not rained(비가 오지 않았더라면) ↔ would have gone(갔을 텐데))"]]}],"post":["Had it been(그랬더라면) ↔ would have occurred(일어났을 것이다)"]}],"compquiz":[{"s":"Never will I ___ that day.","o":["forget","forgets"],"a":0,"ko":"나는 그날을 절대 잊지 않을 것이다.","why":"will(~할 것이다) 뒤는 주어와 상관없이 원형.","wy":"forgets(잊다, 3인칭 단수형): 조동사 will(~할 것이다) 뒤에 s 붙은 동사는 못 옴."},{"s":"If I had studied, I ___ passed the test.","o":["would have","will have"],"a":0,"ko":"내가 공부했더라면 시험에 합격했을 텐데.","why":"If(만약) + had p.p.(~했더라면)의 짝은 would have p.p.(~했을 것이다)","wy":"will have(~했을 것이다, 미래완료): 미래 이야기라 과거를 뒤집는 가정법 짝이 안 됨."}]},{"id":"2610g2-30","no":"30","title":"어법특훈 · 26년 10월 고2 30번","sub":"말보다 더 믿는 비언어 신호","tpl":"A study by Eva McMahan, professor of speech communication, {confirmed|confirmed} the dominance of nonverbal signals. The phenomenon, however, {was|was} {especially|especially} pronounced when adults {found|found} {themselves|themselves} in situations with {conflicting|conflicting} messages (i.e., situations in {which|which} the contents of the verbal and nonverbal messages {differ|differ}). Attempts {to_manipulate|to manipulate} another person verbally {are|are} therefore likely {to_fail|to fail} if the {accompanying|accompanying} nonverbal communication does not match the {spoken|spoken} message. This is {because|because} people trust nonverbal messages more than verbal {ones|ones}. When somebody tells you {that|that} they enjoy {spending|spending} time with you, but you notice how they are looking away and are forcing a smile, you are probably less {inclined|inclined} to believe their words. The same is probably true when you are back at the office after a sickness and your colleague tells you with a displeased expression that they were happy to take over your workload. You might not believe that they enjoyed {replacing|replacing} you while you were gone.","fn":["*nonverbal: 비언어적인","*pronounced: 두드러진","*manipulate: 조종하다"],"mean":{"confirmed":"확인했다(confirm의 과거형)","was":"~였다(be의 과거형, 단수 주어)","especially":"특히(부사)","especial":"특별한(형용사)","special":"특별한(형용사)","specialty":"전문, 특산품(명사)","specialize":"전문으로 하다(동사원형)","found":"발견했다, (어떤 상태에) 있게 되었다(find의 과거형)","finding":"발견하는 것, 발견하는(find의 -ing형)","to find":"발견하는 것(find의 to부정사)","finds":"발견하다(find의 3인칭 단수 현재형)","having found":"발견하고 나서(find의 완료 -ing형)","themselves":"그들 자신(they의 재귀대명사)","them":"그들을(they의 목적격)","their":"그들의(they의 소유격)","they":"그들은(주격)","itself":"그것 자신(it의 재귀대명사, 단수)","conflicting":"서로 모순되는(conflict의 -ing형)","which":"~하는(관계대명사, 사물 선행사)","where":"~하는 곳(관계부사)","what":"~하는 것(선행사를 품은 관계대명사)","whom":"~을(목적격 관계대명사, 사람 선행사)","whose":"~의(소유격 관계대명사)","differ":"다르다(동사원형·현재형)","differs":"다르다(differ의 3인칭 단수 현재형)","differing":"다른, 다르게 하는(differ의 -ing형)","to differ":"다른 것(differ의 n does not match the spoken message.","ko":"그러므로 만약 동반되는 비언어적 의사소통이 발화된 메시지와 일치하지 않는다면 다른 사람을 언어적으로 조종하려는 시도는 실패할 가능성이 있다.","hl":["Attempts to manipulate","are"],"khl":["조종하려는 시도는","가능성이 있다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["접속사 없는 문장 하나에 진짜 동사는 하나.","이 문장의 진짜 동사는 are(~이다).","Attempts manipulate(시도들이 조종한다)라고 쓰면 동사가 둘이 된다.","그래서 꾸미는 말은 to manipulate(조종하려는)로 동사 옷을 벗는다."]},{"t":"pair","h":"쉬운 예시","x":[["Efforts to save water are important.","물을 아끼려는 노력은 중요하다. (진짜 동사 are(~이다) 하나)"],["My plan to travel is simple.","여행하려는 내 계획은 간단하다. (진짜 동사 is(~이다) 하나)"]]}],"post":["Attempts to manipulate(조종하려는 시도들) + 진짜 동사 are(~이다)"]},{"slots":[["confirmed","","","주어 A study(한 연구)의 과거형 동사."],["conflicting","","","서로 \"충돌하는\" 메시지라 -ing."],["are","","","주어 Attempts(시도들)가 복수라 are(~이다)."],["ones","one","a","받는 말은 앞의 messages(메시지들), 복수다. 복수를 받으려면 ones(것들)."],["replacing","","","enjoyed(즐겼다) 뒤는 -ing."]],"opts":["it","them","ones","that"],"or":["it(그것): 단수이고, 형용사 verbal(언어적인)이 앞에서 꾸밀 수 없음.","them(그것들을): 형용사 verbal(언어적인)이 앞에서 꾸밀 수 없는 대명사임.","ones(것들): 복수 messages(메시지들)를 대신하고 형용사 verbal(언어적인)의 꾸밈을 받을 수 있어 맞음.","that(그것): 단수 지시대명사라 복수 messages(메시지들)를 받을 수 없고 형용사 뒤에도 못 옴."],"point":"대명사의 성·수·격 일치","en":"This is because people trust nonverbal messages more than verbal ones.","ko":"이는 사람들이 비언어적 메시지들을 언어적인 것들보다 더 많이 신뢰하기 때문이다.","hl":["verbal ones","nonverbal messages"],"khl":["언어적인 것들","비언어적 메시지들을"],"blocks":[{"t":"p","h":"one(것)과 ones(것들)는 앞 명사의 그림자","x":["원래는 verbal messages(언어적 메시지들)라고 써야 한다.","messages(메시지들)를 또 쓰기 싫어서 그림자 대명사를 쓴다.","단수 명사의 그림자는 one(것), 복수 명사의 그림자는 ones(것들).","messages(메시지들)가 복수라 ones(것들)."]},{"t":"pair","h":"쉬운 예시","x":[["I like red apples more than green ones.","나는 초록 사과보다 빨간 사과를 더 좋아한다. (apples(사과들) → ones(것들))"],["This bag is cheaper than the black one.","이 가방은 검은 것보다 더 싸다. (bag(가방) → one(것))"]]}],"post":["복수 messages(메시지들)의 그림자 → verbal ones(언어적인 것들)"]},{"slots":[["was","","","주어 The phenomenon(그 현상)이 단수라 was(~였다)."],["themselves","","","주어 adults(성인들) 자신이라 재귀대명사."],["a 사가 온다. 문장을 이끄는 건 접속사 because(~ 때문에)."],["that","","","tells you(너에게 말한다) 뒤 완전한 문장을 이끄는 접속사."],["replacing","","","enjoyed(즐겼다) 뒤는 -ing."]],"opts":["due to","despite","because","owing to"],"or":["due to(~ 때문에): 전치사구라 뒤에 명사만 오고 주어 + 동사 문장은 못 옴.","despite(~에도 불구하고): 전치사라 뒤에 문장이 못 오고 뜻도 정반대임.","because(~ 때문에): 뒤에 주어 people(사람들) + 동사 trust(믿는다)가 오는 접속사라 맞음.","owing to(~ 때문에): 전치사구라 뒤에 주어 + 동사 문장이 올 수 없음."],"point":"because vs. because of","en":"This is because people trust nonverbal messages more than verbal ones.","ko":"이는 사람들이 비언어적 메시지들을 언어적인 것들보다 더 많이 신뢰하기 때문이다.","hl":["because people trust"],"khl":["신뢰하기 때문이다"],"blocks":[{"t":"p","h":"뒤에 뭐가 오나 보고 고르기","x":["because(~ 때문에) + 주어 + 동사: because people trust(사람들이 믿기 때문에)","because of(~ 때문에) + 명사: because of the rain(비 때문에)","뜻은 같아도 뒤에 따라오는 짐이 다르다.","뒤에 people trust(사람들이 믿는다)라는 문장이 있으니 because(~ 때문에)."]},{"t":"pair","h":"쉬운 예시","x":[["I stayed home because it rained.","비가 와서 나는 집에 있었다. (because(~ 때문에) + 문장)"],["I stayed home because of the rain.","비 때문에 나는 집에 있었다. (because of(~ 때문에) + 명사)"]]}],"post":["because(~ 때문에) + 주어 + 동사 / because of(~ 때문에) + 명사"]}],"compquiz":[{"s":"Try to avoid ___ junk food.","o":["eating","to eat"],"a":0,"ko":"정크 푸드 먹는 것을 피하도록 노력해라.","why":"avoid(피하다)는 목적어로 -ing만 받는다.","wy":"to eat(먹는 것): avoid(피하다)는 to부정사를 목적어로 받지 않음."},{"s":"The game was canceled ___ the rain.","o":["because","because of"],"a":1,"ko":"비 때문에 경기가 취소되었다.","why":"뒤에 명사 the rain(비)이 오니 because of(~ 때문에).","wy":"because(~ 때문에): 접속사라 뒤에 주어 + 동사가 와야 하는데 명사만 있음."}]},{"id":"2610g2-31","no":"31","title":"어법특훈 · 26년 10월 고2 31번","sub":"자동 설정은 결함이 아니라 핵심 기능","tpl":"A person {who|who} lives eighty years {lives|lives} some twenty-nine thousand days, and the overwhelming majority of the behaviour {packed|packed} into them {runs|runs} on settings {laid|laid} down, most of them, decades earlier and rarely {inspected|inspected} since. This need not be a {hopeless|hopeless} thought. In one light it is a triumph of engineering. If you had to {consciously|consciously} decide every footstep and every fork-grip and every word, you {would|would} never make it out of bed; the deliberate mind is far too {slow|slow} and too costly {to_run|to run} a whole life in real time, and any creature {that|that} tried would {be_out|be outcompeted} by a creature that didn't. The automation is precisely {what|what} frees the captain {to_come|to come} up on deck for the few problems that actually {require|require} {him|him}. The default is not a flaw in the human design. It is arguably the central feature, the thing that {makes|makes} a complex life {affordable|affordable} at all.","fn":["*outcompete: 경쟁에서 이기다","*deliberate: 신중한, 의도적인"],"mean":{"who":"~하는(사람을 받는 주격 관계대명사)","which":"~하는(사물을 받는 관계대명사)","whose":"~의(소유격 관계대명사)","whom":"~을(목적격 관계대명사)","where":"~하는 곳(관계부사)","that":"~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","lives":"살다(live의 3인칭 단수 현재형)","living":"사는 것, 살면서(live의 -ing형)","to live":"사는 것, 살기 위해(live의 to부정사)","having lived":"살고 나서(live의 완료 -ing형)","to have lived":"산 것(live의 완료 to부정사)","packed":"빽빽이 담긴(pack의 과거분사형)","runs":"작동하다(run의 3인칭 단수 현재형)","run":"작동하다(동사원형·현재형)","running":"작동하는 것, 작동하는(run의 -ing형)","to run":"운영하는 것, 운영하기에(run의 to부정사)","being run":"운영되는 것(run의 수동 -ing형)","laid":"놓인, 정해진(lay의 과거분사형)","laying":"놓는(lay의 -ing형)","lays":"놓다(lay의 3인칭 단수 현재형)","lie":"놓여 있다, 눕다(동사원형)","having laid":"놓고 나서(lay의 완료 -ing형)","inspected":"점검된(inspect의 과거분사형)","hopeless":"절망적인(형용사)","hopelessly":"절망적으로(부사)","hopefully":"바라건대, 희망을 품고(부사)","hopelessness":"절망(명사)","hopes":"바라다(hope의 3인칭 단수 현재형) / 희망들(명사 복수형)","consciously":"의식적으로(부사)","conscious":"의식하는(형용사)","consciousness":"의식(명사)","unconscious":"의식이 없는(형용사)","conscience":"양심(명사)","would":"~할 텐데(가정법 조동사)","will":"~할 것이다(미래 조동사)","can":"~할 수 있다(조동사)","would have":"~했을 텐데(가정법 과거완료 조동사)","had":"가졌다, ~해야 했다(have의 과거형)","slow":"느린(형용사)","be outcompeted":"경쟁에서 지다(outcompete의 수동형)","outcompete":"경쟁에서 이기다(동사원형)","be outcompeting":"경쟁에서 이기고 있다(outcompete의 진행형)","have outcompeted":"경쟁에서 이겼다(outcompete의 완료형)","outcompeting":"경쟁에서 이기는(outcompete의 -ing형)","to come":"오도록(come의 to부정사)","come":"오다(동사원형)","comes":"오다(come의 3인칭 단수 현재형)","came":"왔다(come의 과거형)","to coming":"오는 것으로(전치사 to + 동명사)","require":"필요로 하다(동사원형·현재형)","him":"그를(he의 목적격)","himself":"그 자신(he의 재귀대명사)","he":"그는(주격)","they":"그들은(주격)","its":"그것의(it의 소유격)","makes":"~하게 만들다(make의 3인칭 단수 현재형)","affordable":"감당할 수 있는(형용사)","affordably":"감당할 수 있게(부사)","affords":"~할 여유가 있다(afford의 3인칭 단수 현재형)","affording":"~할 여유가 있는(afford의 -ing형)","afford":"~할 여유가 있다(동사원형)","to afford":"~할 여유가 있는 것(afford의 to부정사)","plays":"(운동을) 하다(play의 3인칭 단수 현재형)","playing":"하는 것, 하는(play의 -ing형)","made":"만들어진(make의 과거분사형)","making":"만드는(make의 -ing형)","careful":"조심하는(형용사)","carefully":"조심스럽게(부사)","to use":"사용하도록(use의 to부정사)","use":"사용하다(동사원형)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","perfect":"완벽한(형용사)","perfectly":"완벽하게(부사)","broken":"깨진(break의 과거분사형)","breaking":"깨는(break의 -ing형)","me":"나를(I의 목적격)","myself":"나 자신(I의 재귀대명사)","happy":"행복한(형용사)","happily":"행복하게(부사)"},"sets":[{"items":[{"slots":[["who","","","선행사 A person(사람)이 사람이고 뒤에 주어가 빠져 있어 who(~하는)가 맞다."],["lives","living","a","주어 A person(사람)의 진짜 동사 자리다. -ing로는 동사가 될 수 없다."],["runs","","","주인은 the majority of the behaviour(행동의 대다수). behaviour(행동)는 셀 수 없는 명사라 단수 runs(작동하다)."],["inspected","","","설정은 점검'되는' 쪽이라 p.p. laid(정해진)와 나란한 inspected(점검된)가 맞다."],["hopeless","","","명사 thought(생각)를 꾸미는 자리라 형용사가 맞다."]],"opts":["to live","having lived","to have lived","lives"],"or":["to live(사는 것): to부정사는 동사 자리에 못 와서 A person(사람)의 동사가 없어짐.","having lived(살고 나서): 완료 -ing형이라 혼자 문장의 동사가 될 수 없음.","to have lived(산 것): 완료 to부정사도 동사 자리에 못 옴.","lives(살다): 주어 A person(사람)이 단수라 s 붙은 현재형 동사가 맞음."],"point":"정동사 vs. 준동사","en":"A person who lives eighty years lives some twenty-nine thousand days.","ko":"80년을 사는 사람은 약 2만 9천 일을 산다.","hl":["A person","lives some twenty-nine thousand days"],"khl":["사람은","약 2만 9천 일을 산다"],"blocks":[{"t":"p","h":"lives(살다)가 두 번 나오는 이유","x":["첫 번째 lives(살다)는 who(~하는)에 딸린 꾸밈말 속 동사다.","who lives eighty years(80년을 사는) = 꾸밈말.","이 꾸밈말을 괄호로 묶으면 A person(사람) ___ some twenty-nine thousand days(약 2만 9천 일)만 남는다.","빈자리는 주인 A person(사람)의 진짜 동사 자리다.","그래서 두 번째도 동사 lives(산다)여야 한다."]},{"t":"pair","h":"쉬운 예시","x":[["The man who sells fruit lives near my house.","과일을 파는 그 남자는 우리 집 근처에 산다. (who sells fruit = 꾸밈말, lives = 진짜 동사)"],["The girl who sings well wants to be a singer.","노래를 잘하는 그 소녀는 가수가 되고 싶어 한다. (wants = 진짜 동사)"]]}],"post":["who(~하는) 꾸밈말 괄호 치고 주인 A person(사람)의 동사 찾기: lives(산다)"]},{"slots":[["packed","","","행동은 날들 속에 채워 '넣어진' 쪽이라 p.p. packed(빽빽이 담긴)가 맞다."],["laid","laying","a","설정은 사람이 정해 '놓은' 것이다. 설정은 놓이는 쪽이라 p.p. laid(정해진)."],["inspected","","","laid(정해진)와 and(그리고)로 이어진 p.p.다. 설정은 점검되는 쪽."],["consciously","","","동사 decide(결정하다)를 꾸미니 부사가 맞다."],["slow","","","be동사 is(~이다) 뒤에서 the deliberate mind(신중한 사고)를 설명하는 형용사다."]],"opts":["laid","lays","lie","having laid"],"or":["laid(정해진, lay의 과거분사형): 설정이 사람에 의해 놓인 쪽이라 수동 p.p.가 맞음.","lays(놓다, 3인칭 단수형): 이미 동사 runs(작동하다)가 있는데 접속사 없이 동사가 또 생김.","lie(놓여 있다, 눕다): 동사라 이미 동사 runs(작동하다)가 있는 문장에 접속사 없이 동사가 또 생기고, '정해 놓인'이라는 뜻도 안 됨.","having laid(놓고 나서): 능동이라 뒤에 놓을 대상(목적어)이 필요한데 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"The overwhelming majority of the behaviour packed into them runs on settings laid down, most of them, decades earlier and rarely inspected since.","ko":"그 속에 빽빽이 들어 있는 행동의 압도적인 다수는 대부분이 수십 년 전에 정해져서 그 이후로는 거의 점검되지 않은 설정들에 따라 작동한다.","hl":["settings laid down","rarely inspected"],"khl":["정해져서","거의 점검되지 않은"],"blocks":[{"t":"p","h":"설정은 스스로 눕지 않는다","x":["settings(설정들)를 뒤에서 꾸미는 말을 고르는 문제다.","설정이 직접 뭔가를 놓는가? 아니다.","누군가가 오래전에 정해 놓은 것이다.","놓이는 쪽이니까 p.p. laid(놓인).","lay(놓다)는 lay(놓다)-laid(놓았다)-laid(놓인)로 변한다. lie(눕다)는 lie(눕다)-lay(누웠다)-lain(누운)으로 변하니 헷갈리지 말 것."]},{"t":"pair","h":"쉬운 예시","x":[["Look at the books laid on the desk.","책상 위에 놓인 책들을 봐. (책은 놓이는 쪽 → laid = 놓인)"],["She is laying the plates on the table.","그녀는 식탁 위에 접시를 놓고 있다. (그녀가 놓는 쪽 → laying = 놓는, 뒤에 the plates = 접시들)"]]},{"t":"tap","h":"확인 질문","q":"laying(놓는)을 쓰려면 뒤에 무엇이 꼭 있어야 하나?","a":["놓을 대상(목적어)이 있어야 한다.","본문의 laid down(정해진) 뒤에는 목적어가 없다. 그래서 수동 p.p.다."]}],"post":["놓이는 쪽은 p.p.: settings laid down(정해진 설정들)"]},{"slots":[["hopeless","","","명사 thought(생각)를 꾸미는 형용사다."],["consciously","conscious","a","동사 decide(결정하다)를 꾸미는 자리. 형용사는 동사를 꾸밀 수 없다."],["would","","","If(만약 ~라면) + 과거형 had(~해야 했다), 주절은 would(~할 텐데). 가정법 과거다."],["to_run","","","too ~ to(너무 ~해서 …할 수 없다) 구문이라 to run(운영하기에)이 맞다."],["require","","","선행사 the few problems(몇 안 되는 문제들)가 복수라 require(필요로 하다)."]],"opts":["consciousness","unconscious","consciously","conscience"],"or":["consciousness(의식): 명사라 동사 decide(결정하다)를 꾸밀 수 없음.","unconscious(의식이 없는): 형용사라 동사를 꾸밀 수 없고, 뜻도 정반대가 됨.","consciously(의식적으로): had to(~해야 했다)와 동사 decide(결정하다) 사이에서 동사를 꾸미니 부사가 맞음.","conscience(양심): 명사라 동사 자리 앞에서 동사를 꾸밀 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"If you had to consciously decide every footstep and every fork-grip and every word, you would never make it out of bed.","ko":"만약 여러분이 발걸음 하나하나와, 포크를 쥐는 동작 하나하나와, 말 한마디 한마디를 의식적으로 결정해야 한다면 여러분은 침대에서 결코 빠져나오지 못할 것이다.","hl":["consciously decide"],"khl":["의식적으로 결정해야"],"blocks":[{"t":"p","h":"화살표가 어디로 가나","x":["consciously(의식적으로) → decide(결정하다). 화살표가 동사로 간다.","동사를 꾸미는 건 부사(-ly = ~하게)의 일이다.","conscious(의식하는)는 형용사라 명사만 꾸민다. a conscious choice(의식적인 선택)처럼.","to와 동사 사이에 끼어 있어도 꾸미는 대상은 동사다."]},{"t":"pair","h":"쉬운 예시","x":[["He quietly closed the door.","그는 조용히 문을 닫았다. (동사 closed = 닫았다 ← 부사)"],["He is a quiet boy.","그는 조용한 소년이다. (명사 boy = 소년 ← 형용사)"]]}],"post":["동사 decide(결정하다) 꾸미면 -ly(~하게): consciously decide(의식적으로 결정하다)"]},{"slots":[["slow","","","is(~이다) 뒤 보어 자리라 형용사 slow(느린)가 맞다."],["to_run","","","too costly to run(너무 대가가 커서 운영할 수 없는). too(너무) ~ to(…하기에) 구문이다."],["that","what","a","앞에 any creature(어떤 생명체)라는 명사가 있다. 명사를 꾸밀 땐 what(~하는 것)이 아니라 that(~하는)."],["be_out","","","생명체가 다른 생명체에게 경쟁에서 지는 쪽이고 뒤에 by(~에 의해)가 있어 수동태가 맞다."],["makes","","","선행사 the thing(것)이 단수라 makes(만들다)."]],"opts":["that","whose","whom","where"],"or":["that(~하는): 앞의 명사 any creature(어떤 생명체)를 꾸미고 뒤에 주어가 빠져 있어 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 동사 tried(시도했다)가 와서 안 됨.","whom(~을): 목적격이라 주어가 빠진 자리에 못 오고, 생명체 전반을 받는 말도 아님.","where(~하는 곳): 관계부사라 뒤에 완전한 문장이 와야 하는데 주어가 빠져 있음."],"point":"that/which vs. what","en":"Any creature that tried would be outcompeted by a creature that didn't.","ko":"그렇게 하려고 하는 모든 생명체는 그렇게 하지 않는 생명체에게 패배할 것이다.","hl":["Any creature that tried"],"khl":["그렇게 하려고 하는 모든 생명체는"],"blocks":[{"t":"p","h":"what(~하는 것)은 이미 짐을 들고 있다","x":["what(~하는 것) = the thing which(~하는 것). 속에 '것'이라는 명사가 이미 들어 있다.","그래서 앞에 명사가 또 있으면 what(~하는 것)을 못 쓴다.","any creature what tried(생명체 ~하려 한 것)는 '생명체 ~하는 것'처럼 명사가 겹친다.","앞 명사를 뒤에서 꾸밀 땐 that(~하는) 또는 which(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a dog that likes water.","나는 물을 좋아하는 개가 있다. (명사 a dog = 개 + that)"],["What I need is sleep.","내가 필요한 것은 잠이다. (앞에 명사 없이 What)"]]}],"post":["명사 any creature(어떤 생명체) + that(~하는) + 주어 빠진 문장"]},{"slots":[["what","","","앞에 명사가 없고, 뒤 frees(해방시키다)의 주어가 빠져 있어 what(~하는 것)이 맞다."],["to_come","come","a","free(해방시키다) + 사람 + to부정사. free(해방시키다)는 사역동사가 아니라 to가 필요하다."],["require","","","선행사 the few problems(몇 안 되는 문제들)가 복수라 s 없는 require(필요로 하다)."],["him","","","problems(문제들)가 필요로 하는 대상은 the captain(선장)이다. 주어와 다른 사람이라 목적격 him(그를)."],["affordable","","","make(만들다) + 목적어 + 형용사. 삶이 감당할 수 있는 상태가 된다."]],"opts":["comes","came","to come","to coming"],"or":["comes(오다, 3인칭 단수형): 목적격보어 자리에 s 붙은 동사가 못 오고, 동사가 겹침.","came(왔다, come의 과거형): 목적격보어 자리에 과거형 동사는 못 옴.","to come(오도록): free(해방시키다) + 사람 + to부정사 구조라 맞음.","to coming(오는 것으로): free(해방시키다) 뒤 보어 자리는 to + 동사원형이라 -ing가 붙으면 안 됨."],"point":"목적격보어(준동사)","en":"The automation is precisely what frees the captain to come up on deck for the few problems that actually require him.","ko":"자동화는 정확히 선장을 정말로 필요로 하는 몇 안 되는 문제들을 위해 그가 갑판 위로 올라올 수 있게 해방해 주는 것이다.","hl":["frees the captain to come up"],"khl":["그가 갑판 위로 올라올 수 있게 해방해 주는"],"blocks":[{"t":"p","h":"to가 필요한 동사들","x":["make(만들다), let(허락하다), have(시키다) 세 개만 to 없이 원형이 온다.","free(해방시키다)는 이 셋에 들지 않는다.","free(해방시키다) + 사람 + to부정사 = 사람이 ~하도록 풀어 주다.","allow(허락하다), enable(가능하게 하다), want(원하다)도 같은 모양이다."]},{"t":"pair","h":"쉬운 예시","x":[["Mom allowed me to go out.","엄마는 내가 나가도록 허락했다. (allowed me to go = 내가 가도록 허락했다)"],["Mom let me go out.","엄마는 내가 나가게 해 주었다. (let은 to 없이 go = 가다)"]]}],"post":["free(해방시키다) + 사람 + to부정사: frees the captain to come(선장이 올라오게 해 주다)"]}],"quiz":[{"s":"The boy who lives next door ___ soccer every day.","o":["playing","plays"],"a":1,"ko":"옆집에 사는 그 소년은 매일 축구를 한다.","why":"주인 The boy(그 소년)의 진짜 동사 자리라 plays(한다).","wy":"playing(하는 것, 하는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐."},{"s":"This is a cake ___ by my mom.","o":["making","made"],"a":1,"ko":"이것은 우리 엄마가 만든 케이크다.","why":"케이크는 만들어지는 쪽이라 p.p. made(만들어진).","wy":"making(만드는): 케이크가 직접 만드는 게 아니고, 뒤에 만들 대상도 없음."},{"s":"Please read the sentence ___.","o":["carefully","careful"],"a":0,"ko":"그 문장을 조심스럽게 읽어 주세요.","why":"동사 read(읽다)를 꾸미니 부사 carefully(조심스럽게).","wy":"careful(조심하는): 형용사라 동사 read(읽다)를 꾸밀 수 없음."},{"s":"I have a friend ___ speaks three languages.","o":["what","that"],"a":1,"ko":"나는 세 개의 언어를 말하는 친구가 있다.","why":"앞에 명사 a friend(친구)가 있고 뒤에 주어가 빠져 있어 that(~하는).","wy":"what(~하는 것): 앞에 명사 a friend(친구)가 있으면 못 옴."},{"s":"My dad allowed me ___ his camera.","o":["to use","use"],"a":0,"ko":"아빠는 내가 아빠의 카메라를 쓰도록 허락했다.","why":"allow(허락하다) + 사람 + to부정사.","wy":"use(사용하다): allow(허락하다)는 사역동사가 아니라 to 없는 원형이 못 옴."}]},{"items":[{"slots":[["lives","","","주인 A person(사람)의 진짜 동사라 lives(산다)."],["packed","","","행동은 날들 속에 채워 넣어진 쪽이라 p.p. packed(빽빽이 담긴)."],["runs","run","a","주인은 the majority of the behaviour(행동의 대다수). of(~의) 뒤 behaviour(행동)가 셀 수 없는 명사라 단수 동사 runs(작동하다)."],["laid","","","설정은 정해 놓인 쪽이라 p.p. laid(정해진)."],["would","","","If(만약 ~라면) + 과거형, 주절은 would(~할 텐데)."]],"opts":["running","runs","to run","being run"],"or":["running(작동하는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐.","runs(작동하다): 주인 the majority of the behaviour(행동의 대다수)가 단수 취급이라 s 붙은 현재형 동사가 맞음.","to run(작동하는 것): to부정사도 동사 자리에 못 옴.","being run(운영되는 것): 수동 -ing형이라 동사 자리에 못 오고, 뒤 on settings(설정에 따라)와도 안 맞음."],"point":"수식받는 주어의 수일치","en":"The overwhelming majority of the behaviour packed into them runs on settings laid down, most of them, decades earlier and rarely inspected since.","ko":"그 속에 빽빽이 들어 있는 행동의 압도적인 다수는 대부분이 수십 년 전에 정해져서 그 이후로는 거의 점검되지 않은 설정들에 따라 작동한다.","hl":["The overwhelming majority of the behaviour","runs"],"khl":["행동의 압도적인 다수는","작동한다"],"blocks":[{"t":"p","h":"바로 앞 them(그것들)에 속지 말 것","x":["동사 runs(작동하다) 바로 앞에 them(그것들)이 있다.","them(그것들)은 packed into them(그 속에 담긴)이라는 꼬리표 속 말일 뿐이다.","꼬리표를 떼면 주인은 the majority of the behaviour(행동의 대다수).","majority of(~의 대다수) 같은 부분 표현은 of 뒤 명사에 수를 맞춘다.","behaviour(행동)는 셀 수 없는 명사라 단수. 그래서 runs(작동하다)."]},{"t":"pair","h":"쉬운 예시","x":[["Most of the milk in the cups is cold.","컵에 든 우유의 대부분은 차갑다. (of = ~의, 뒤 milk = 우유는 셀 수 없음 → is = ~이다)"],["Most of the students in the room are tired.","방에 있는 학생들의 대부분은 피곤하다. (of = ~의, 뒤 students = 학생들 → are = ~이다)"]]}],"post":["부분 표현 majority of(~의 대다수)는 of(~의) 뒤 behaviour(행동, 셀 수 없음) 보고 runs(작동하다)"]},{"slots":[["inspected","","","설정은 점검되는 쪽이라 p.p. inspected(점검된)."],["hopeless","hopelessly","a","관사 a와 명사 thought(생각) 사이, 명사를 꾸미는 자리다. 부사는 명사를 꾸밀 수 없다."],["consciously","","","동사 decide(결정하다)를 꾸미는 부사."],["that","","","앞 명사 any creature(어떤 생명체)를 꾸미는 that(~하는)."],["what","","","앞에 명사가 없고 뒤에 주어가 빠져 있어 what(~하는 것)."]],"opts":["hopefully","hopelessness","hopeless","hopes"],"or":["hopefully(바라건대): 부사라 명사 thought(생각)를 꾸밀 수 없음.","hopelessness(절망): 명사라 a와 thought(생각) 사이에서 명사를 꾸밀 수 없음.","hopeless(절망적인): 관사 a와 명사 thought(생각) 사이라 명사를 꾸미는 형용사가 맞음.","hopes(바라다, 희망들): 동사나 복수 명사라 a와 thought(생각) 사이에 못 옴."],"point":"형용사 자리 vs. 부사 자리","en":"This need not be a hopeless thought.","ko":"이것이 꼭 절망적인 생각일 필요는 없다.","hl":["a hopeless thought"],"khl":["절망적인 생각"],"blocks":[{"t":"p","h":"a와 명사 사이는 형용사 자리","x":["a ___ thought(생각): 관사와 명사 사이에 낀 자리다.","이 자리에서 명사를 꾸미는 건 형용사다.","hopeless(절망적인)는 형용사, hopelessly(절망적으로)는 부사.","부사는 동사나 형용사를 꾸미지, 명사는 못 꾸민다."]},{"t":"pair","h":"쉬운 예시","x":[["It was a sad story.","그것은 슬픈 이야기였다. (명사 story = 이야기 ← 형용사 sad = 슬픈)"],["She looked at me sadly.","그녀는 슬프게 나를 바라봤다. (동사 looked = 바라봤다 ← 부사 sadly = 슬프게)"]]}],"post":["a + 형용사 + 명사: a hopeless thought(절망적인 생각)"]},{"slots":[["who","","","선행사 A person(사람)이 사람이라 who(~하는)."],["would","will","a","앞이 If(만약 ~라면) + 과거형 had(~해야 했다)인 가정법 과거다. 주절은 will(~할 것이다)이 아니라 would(~할 텐데)."],["slow","","","is(~이다) 뒤 보어 형용사 slow(느린)."],["be_out","","","뒤에 by(~에 의해)가 있고 경쟁에서 지는 쪽이라 수동태."],["to_come","","","free(해방시키다) + 사람 + to부정사."]],"opts":["can","would have","had","would"],"or":["can(~할 수 있다): 가정법 과거의 주절에는 현재형 조동사 can(~할 수 있다)이 못 오고 could(~할 수 있을 텐데)를 써야 함.","would have(~했을 텐데): 뒤에 p.p.가 와야 하는데 동사원형 make(만들다)가 와서 형태가 깨짐.","had(가졌다): 뒤에 동사원형 make(만들다)가 와서 동사가 겹침.","would(~할 텐데): If(만약 ~라면) + 과거형의 가정법 과거라 주절에 would + 동사원형이 맞음."],"point":"가정법","en":"If you had to consciously decide every footstep, you would never make it out of bed.","ko":"만약 여러분이 발걸음 하나하나를 의식적으로 결정해야 한다면 여러분은 침대에서 결코 빠져나오지 못할 것이다.","hl":["If you had to","you would never make it"],"khl":["결정해야 한다면","결코 빠져나오지 못할 것이다"],"blocks":[{"t":"p","h":"과거형인데 지금 이야기","x":["If you had to(만약 ~해야 한다면)는 과거 일이 아니다.","지금 사실과 반대로 상상하는 말이다. 실제로 우리는 발걸음을 하나하나 고민하지 않는다.","이렇게 상상할 땐 If(만약 ~라면) + 과거형, 주절은 would(~할 텐데) + 동사원형.","짝을 맞추는 세트라고 생각하면 쉽다."]},{"t":"pair","h":"쉬운 예시","x":[["If I were a bird, I would fly to you.","내가 새라면 너에게 날아갈 텐데. (were = ~이다의 과거형 ↔ would = ~할 텐데)"],["If I had money, I would buy a bike.","나에게 돈이 있다면 자전거를 살 텐데. (had = 가졌다 ↔ would = ~할 텐데)"]]},{"t":"tap","h":"확인 질문","q":"실제로 사람이 모든 발걸음을 의식적으로 정하는가?","a":["아니다. 자동으로 걷는다.","사실과 반대되는 상상이라 가정법 would(~할 텐데)를 쓴다."]}],"post":["If(만약 ~라면) + 과거형 had(~해야 했다) ↔ 주절 would(~할 텐데) + 동사원형"]},{"slots":[["runs","","","주인 the majority of the behaviour(행동의 대다수)가 단수 취급이라 runs(작동하다)."],["to_run","","","too ~ to(너무 ~해서 …할 수 없다) 구문의 to run(운영하기에)."],["that","","","앞 명사 any creature(어떤 생명체)를 꾸미는 that(~하는)."],["be_out","outcompete","a","생명체가 다른 생명체에게 경쟁에서 지는 쪽이다. 뒤에 by(~에 의해)가 있으니 수동태 be outcompeted(경쟁에서 지다)."],["makes","","","선행사 the thing(것)이 단수라 makes(만들다)."]],"opts":["be outcompeting","be outcompeted","have outcompeted","outcompeting"],"or":["be outcompeting(경쟁에서 이기고 있다): 능동이라 이길 대상(목적어)이 필요한데 없고, by(~에 의해)와도 안 맞음.","be outcompeted(경쟁에서 지다): 생명체가 당하는 쪽이고 by(~에 의해) + 행위자가 있어 수동태가 맞음.","have outcompeted(경쟁에서 이겼다): 능동 완료형이라 목적어가 없고 by(~에 의해) + 행위자와 안 맞음.","outcompeting(경쟁에서 이기는): 조동사 would(~할 것이다) 뒤에는 동사원형이 와야 하므로 -ing가 못 옴."],"point":"능동태 vs. 수동태","en":"Any creature that tried would be outcompeted by a creature that didn't.","ko":"그렇게 하려고 하는 모든 생명체는 그렇게 하지 않는 생명체에게 패배할 것이다.","hl":["would be outcompeted by"],"khl":["생명체에게 패배할 것이다"],"blocks":[{"t":"p","h":"누가 이기고 누가 지나","x":["모든 걸 의식적으로 하려는 생명체는 느려서 진다.","지는 쪽이 주어 자리에 있다. 당하는 쪽이다.","이긴 쪽은 by a creature that didn't(그렇게 하지 않은 생명체에 의해)로 뒤에 나온다.","by(~에 의해) + 이긴 쪽이 보이면 수동태 신호다."]},{"t":"pair","h":"쉬운 예시","x":[["Our team was beaten by their team.","우리 팀은 그들의 팀에게 졌다. (was beaten = 졌다, by = ~에게)"],["Their team beat our team.","그들의 팀이 우리 팀을 이겼다. (능동, 목적어 our team = 우리 팀)"]]}],"post":["진 쪽이 주어 + by(~에 의해) + 이긴 쪽: would be outcompeted by(~에게 패배할 것이다)"]},{"slots":[["laid","","","설정은 정해 놓인 쪽이라 p.p. laid(정해진)."],["hopeless","","","명사 thought(생각)를 꾸미는 형용사."],["require","","","선행사 the few problems(몇 안 되는 문제들)가 복수라 require(필요로 하다)."],["him","himself","a","require(필요로 하다)의 주어는 problems(문제들)다. 필요한 대상은 선장이라 주어와 다른 사람, 목적격 him(그를)."],["affordable","","","make(만들다) + 목적어 + 형용사 affordable(감당할 수 있는)."]],"opts":["he","they","him","its"],"or":["he(그는): 주격이라 동사 뒤 목적어 자리에 못 옴.","they(그들은): 주격이고 복수라 목적어 자리에도, the captain(선장)에도 안 맞음.","him(그를): 동사 require(필요로 하다)의 목적어 자리이고 단수 남자 the captain(선장)을 받아 맞음.","its(그것의): 소유격이라 뒤에 명사가 와야 하고, 사람 the captain(선장)을 받을 수도 없음."],"point":"대명사의 성·수·격","en":"The automation is precisely what frees the captain to come up on deck for the few problems that actually require him.","ko":"자동화는 정확히 선장을 정말로 필요로 하는 몇 안 되는 문제들을 위해 그가 갑판 위로 올라올 수 있게 해방해 주는 것이다.","hl":["the captain","require him"],"khl":["선장을 정말로 필요로 하는"],"blocks":[ goes":"가다(go의 3인칭 단수 현재형)","to buy":"사기 위해(buy의 to부정사)","buy":"사다(동사원형)"},"sets":[{"items":[{"slots":[["weakening","","","요인이 유대를 약화'시키는' 쪽이라 능동 -ing가 맞다."],["weakens","weakening","a","If(만약 ~라면) 절이 끝나고 시작되는 주절이다. 주어 mass culture(대중문화)의 진짜 동사가 필요하다."],["overlapping","","","diminishing(축소시키면서)과 and(그리고)로 나란한 분사구문이다."],["important","","","are(~이다)의 보어. traditional social institutions(전통적인 사회 기관)와 and(그리고)로 나란한 형용사다."],["turn","","","주어 people(사람들)이 복수라 turn(의지하다)."]],"opts":["weakens","weaken","to weaken","having weakened"],"or":["weakens(약화시키다): 주어 mass culture(대중문화)가 단수라 s 붙은 현재형 동사가 맞음.","weaken(약화시키다): 동사는 맞지만 단수 주어 mass culture(대중문화)에 s가 빠짐.","to weaken(약화시키는 것): to부정사라 동사 자리에 못 와서 주절에 동사가 없어짐.","having weakened(약화시키고 나서): 완료 -ing형이라 혼자 동사가 될 수 없음."],"point":"정동사 vs. 준동사","en":"If we understand mass culture as a weakening factor of the cultural ties, mass culture weakens the intermediary institutions in society.","ko":"만약 우리가 대중문화를 문화적 유대감을 약화시키는 요인으로 이해한다면, 대중문화는 사회 내의 매개하는 제도들을 약화시킨다.","hl":["mass culture weakens"],"khl":["대중문화는","약화시킨다"],"blocks":[{"t":"p","h":"If(만약 ~라면) 절 뒤에는 주인공이 나온다","x":["If(만약 ~라면)로 시작한 부분은 콤마에서 끝난다.","그 뒤가 진짜 문장, 주절이다.","주절의 주어는 mass culture(대중문화).","주어 다음에는 진짜 동사가 와야 한다. -ing는 동사 자리를 못 채운다.","그래서 weakens(약화시킨다)."]},{"t":"pair","h":"쉬운 예시","x":[["If it rains, the game stops.","비가 오면 경기는 멈춘다. (주절 the game = 경기, 동사 stops = 멈춘다)"],["If you are tired, my mom drives you home.","네가 피곤하면 우리 엄마가 너를 집에 태워다 준다. (동사 drives = 태워다 준다)"]]}],"post":["If(만약 ~라면) 절 콤마 뒤 주어 mass culture(대중문화) + 진짜 동사 weakens(약화시킨다)"]},{"slots":[["unite","unites","a","that(~하는)이 받는 명사는 the cultural ties(문화적 유대감들), 복수다. 복수 주어에는 s 없는 unite(결속시키다)."],["diminishing","","","주절 동사 weakens(약화시킨다)가 이미 있어 덧붙이는 말은 분사구문 -ing다."],["harmonious","","","명사 functioning(기능)을 꾸미고 normal(정상적인)과 나란한 형용사다."],["to_put","","","\"압박을 가하기 위해\"라는 목적을 나타내는 to부정사다."],["becomes","","","is popularized(대중화된다)와 and(그리고)로 이어진 동사. 주어 this practice(이 관행)가 단수라 becomes(~이 된다)."]],"opts":["unite","uniting","to unite","has united"],"or":["unite(결속시키다): 선행사 the cultural ties(문화적 유대감들)가 복수라 s 없는 현재형 동사가 맞음.","uniting(결속시키는): 주격 관계대명사 that(~하는) 뒤에는 동사가 와야 하는데 -ing는 동사가 아님.","to unite(결속시키는 것): to부정사라 that(~하는) 뒤 동사 자리에 못 옴.","has united(결속시켜 왔다): has(~해 왔다, 단수형)는 단수 주어용이라 복수 선행사 ties(유대감들)와 안 맞음."],"point":"수식받는 주어의 수일치","en":"If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, ...","ko":"만약 우리가 대중문화를 자신들의 전통들에 사람들을 결속시키는 문화적 유대감을 약화시키는 요인으로 이해한다면, …","hl":["the cultural ties that unite"],"khl":["사람들을 결속시키는 문화적 유대감"],"blocks":[{"t":"p","h":"that(~하는) 뒤 동사는 앞 명사를 본다","x":["that unite people(사람들을 결속시키는)의 주어는 따로 안 보인다.","주어는 that(~하는)이 받은 앞 명사다.","앞 명사는 factor(요인)가 아니라 the cultural ties(문화적 유대감들).","사람을 전통에 묶는 건 '유대감'이다. 뜻으로도 확인된다.","ties(유대감들)가 복수니까 unite(결속시키다)."]},{"t":"pair","h":"쉬운 예시","x":[["I have two friends who live in Seoul.","나는 서울에 사는 친구가 두 명 있다. (friends = 친구들 → live = 살다)"],["I have a friend who lives in Busan.","나는 부산에 사는 친구가 한 명 있다. (a friend = 친구 한 명 → lives = 살다)"]]},{"t":"tap","h":"확인 질문","q":"사람들을 전통에 묶어 주는 것은 factor(요인)인가, ties(유대감들)인가?","a":["ties(유대감들)이다.","그래서 동사는 복수에 맞춘 unite(결속시키다)."]}],"post":["선행사 ties(유대감들, 복수) + that(~하는) + unite(결속시키다), s 없음"]},{"slots":[["overlapping","","","diminishing(축소시키면서)과 and(그리고)로 나란한 -ing."],["harmonious","harmoniously","a","the normal and ___ functioning(정상적이고 ___ 기능). 명사 functioning(기능)을 꾸미고 normal(정상적인)과 나란해야 하니 형용사."],["is_pop","","","관행은 대중화'되는' 쪽이라 수동태 is popularized(대중화된다)."],["which1","","","콤마 뒤에서 앞 내용을 받아 덧붙이는 계속적 용법 which(그런데 그것은)다."],["is_conv","","","광장이 가상 공간으로 바뀌는 쪽이라 수동태 is converted(전환된다)."]],"opts":["harmony","harmonious","harmonize","harmonizes"],"or":["harmony(조화): 명사라 형용사 normal(정상적인)과 짝이 안 맞음.","harmonious(조화로운): 형용사 normal(정상적인)과 and(그리고)로 나란히 명사 functioning(기능)을 꾸며 맞음.","harmonize(조화시키다): 동사원형이라 명사 앞 꾸밈 자리에 못 옴.","harmonizes(조화시키다, 3인칭 단수형): 동사라 명사 functioning(기능)을 꾸밀 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"Courts are traditional social institutions and important for the normal and harmonious functioning of collective life.","ko":"법정은 전통적인 사회 기관이며 집단 생활의 정상적이고 조화로운 기능을 위해 중요하다.","hl":["the normal and harmonious functioning"],"khl":["정상적이고 조화로운 기능"],"blocks":[{"t":"p","h":"functioning(기능)은 여기서 명사","x":["앞에 the(그), 뒤에 of collective life(집단 생활의)가 붙어 있다.","이렇게 the(그) ~ of(~의) 사이에 끼면 functioning(기능)은 명사다.","명사를 꾸미는 말은 형용사.","게다가 and(그리고) 앞이 형용사 normal(정상적인)이라 짝도 형용사여야 한다."]},{"t":"pair","h":"쉬운 예시","x":[["She has a kind and warm heart.","그녀는 친절하고 따뜻한 마음을 가졌다. (kind = 친절한, warm = 따뜻한, 둘 다 형용사)"],["He spoke kindly and warmly.","그는 친절하고 따뜻하게 말했다. (동사 spoke = 말했다 ← 부사 둘)"]]}],"post":["the normal and harmonious functioning(정상적이고 조화로운 기능): 형용사 + 형용사 + 명사"]},{"slots":[["important","","","are(~이다)의 보어로 나란한 형용사."],["turn","","","주어 people(사람들)이 복수라 turn(의지하다)."],["is_pop","popularizes","a","관행이 스스로 무엇을 대중화하는 게 아니다. 관행이 대중화'되는' 쪽이고 뒤에 목적어도 없다."],["be_done","","","재판은 행해지는 쪽이라 must not be done(행해져서는 안 된다)."],["to_judge","","","the appropriate place(적절한 장소)를 꾸미는 to부정사, \"재판할 장소\"."]],"opts":["is popularizing","popularizing","is popularized","to be popularized"],"or":["is popularizing(대중화하고 있다): 능동이라 무엇을 대중화하는지 목적어가 필요한데 없음.","popularizing(대중화하는): -ing는 동사가 아니라 주어 this practice(이 관행)의 동사가 없어짐.","is popularized(대중화되다): 관행이 대중화되는 쪽이라 수동태가 맞고 becomes(~이 되다)와 나란함.","to be popularized(대중화되는 것): to부정사라 동사 자리에 못 오고 becomes(~이 되다)와도 짝이 안 맞음."],"point":"능동태 vs. 수동태","en":"This practice is popularized and becomes a habitual form of culture, which is harmful.","ko":"이러한 관행은 대중화되고 습관적인 문화의 형태가 되며, 이는 해롭다.","hl":["This practice is popularized"],"khl":["이러한 관행은 대중화되고"],"blocks":[{"t":"p","h":"목적어 칸을 확인하라","x":["popularize(대중화하다)는 '무엇을' 대중화하는 동사다.","능동으로 쓰면 뒤에 대중화할 대상이 꼭 있어야 한다.","본문 뒤에는 and becomes(그리고 ~이 된다)가 바로 온다. 대상이 없다.","관행은 사람들에 의해 퍼지는 쪽. 그래서 is popularized(대중화된다)."]},{"t":"pair","h":"쉬운 예시","x":[["This song is loved by many people.","이 노래는 많은 사람에게 사랑받는다. (노래는 사랑받는 쪽 → is loved = 사랑받는다)"],["Many people love this song.","많은 사람이 이 노래를 사랑한다. (능동, 목적어 this song = 이 노래)"]]}],"post":["관행은 퍼지는 쪽 + 뒤에 목적어 없음 → is popularized(대중화된다)"]},{"slots":[["weakening","","","요인이 유대를 약화시키는 쪽이라 능동 -ing."],["to_put","","","목적을 나타내는 to부정사 \"압박을 가하기 위해\"."],["which1","that","a","콤마 뒤에서 앞 내용을 받아 덧붙이는 자리다. that(~하는)은 콤마 뒤에 쓸 수 없다."],["is_conv","","","광장이 전환되는 쪽이라 수동태."],["that","","","앞 명사 a way(방식)를 꾸미고 뒤에 주어가 빠져 있어 that(~하는)."]],"opts":["what","who","which","where"],"or":["what(~하는 것): 앞 내용을 받는 말이 아니라 스스로 명사 덩어리를 만드는 말이라 콤마 뒤 덧붙임 자리에 못 옴.","who(~하는): 사람을 받는 말이라 앞의 관행·문화를 받을 수 없음.","which(그런데 그것은): 콤마 뒤에서 앞 내용을 받고 뒤에 주어가 빠져 있어 맞음.","where(~하는 곳): 관계부사라 뒤에 완전한 문장이 와야 하는데 주어가 빠져 있음."],"point":"관계대명사 that vs. which(계속적 용법)","en":"This practice is popularized and becomes a habitual form of culture, which is harmful.","ko":"이러한 관행은 대중화되고 습관적인 문화의 형태가 되며, 이는 해롭다.","hl":[", which is harmful"],"khl":["이는 해롭다"],"blocks":[{"t":"p","h":"콤마 뒤에는 that(~하는)이 못 선다","x":["콤마(,) 뒤에서 앞말을 받아 \"그런데 그것은\" 하고 덧붙이는 걸 계속적 용법이라고 한다.","이 자리에는 which(그런데 그것은)나 who(그런데 그 사람은)를 쓴다.","that(~하는)은 콤마 뒤에 올 수 없다. 시험에 자주 나오는 규칙이다.","여기서 which(그런데 그것은)는 관행이 습관이 되는 일 전체를 받는다."]},{"t":"pair","h":"쉬운 예시","x":[["He passed the test, which made his mom happy.","그는 시험에 합격했는데, 그것이 엄마를 기쁘게 했다. (콤마 + which = 그런데 그것은)"],["I met Jane, who is a nurse.","나는 제인을 만났는데, 그녀는 간호사다. (콤마 + who = 그런데 그 사람은)"]]}],"post":["콤마(,) + which(그런데 그것은) ○ / 콤마(,) + that(~하는) ×"]}],"quiz":[{"s":"My sister ___ to school every morning.","o":["walking","walks"],"a":1,"ko":"우리 언니는 매일 아침 학교에 걸어간다.","why":"주어 My sister(우리 언니)의 진짜 동사 자리라 walks(걷다).","wy":"walking(걷는 것, 걷는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐."},{"s":"I like books that ___ funny pictures.","o":["have","has"],"a":0,"ko":"나는 재미있는 그림이 있는 책들을 좋아한다.","why":"that(~하는)이 받는 books(책들)가 복수라 have(가지고 있다).","wy":"has(가지고 있다): 단수용이라 복수 books(책들)와 안 맞음."},{"s":"She gave a clear and ___ answer.","o":["simply","simple"],"a":1,"ko":"그녀는 분명하고 간단한 대답을 했다.","why":"명사 answer(대답)를 꾸미고 clear(분명한)와 나란해서 형용사 simple(간단한).","wy":"simply(간단히): 부사라 명사 answer(대답)를 꾸밀 수 없고 clear(분명한)와 짝도 안 맞음."},{"s":"English ___ by many people.","o":["speaks","is spoken"],"a":1,"ko":"영어는 많은 사람에 의해 말해진다.","why":"영어는 말해지는 쪽이고 by(~에 의해)가 있어 수동태 is spoken(말해지다).","wy":"speaks(말하다): 능동이라 목적어가 필요하고, 영어가 직접 말하는 것도 아님."},{"s":"I met Tom, ___ is my best friend.","o":["who","that"],"a":0,"ko":"나는 톰을 만났는데, 그는 나의 가장 친한 친구다.","why":"콤마 뒤 덧붙임 자리라 who(그런데 그 사람은).","wy":"that(~하는): 콤마 뒤 계속적 용법에는 쓸 수 없음."}]},{"items":[{"slots":[["unite","","","선행사 the cultural ties(문화적 유대감들)가 복수라 unite(결속시키다)."],["diminishing","diminishes","a","주절 동사 weakens(약화시킨다)가 이미 있다. 접속사 없이 동사를 또 쓸 수 없으니 분사구문 -ing다. and(그리고) 뒤 overlapping(중첩되면서)과도 짝이 맞아야 한다."],["harmonious","","","명사 functioning(기능)을 꾸미고 normal(정상적인)과 나란한 형용사."],["becomes","","","is popularized(대중화된다)와 나란한 동사, 주어가 단수라 becomes(~이 된다)."],["which2","","","콤마 뒤에서 the public square(대중 광장)를 받고, 뒤에 주어가 빠져 있어 which(그런데 그것은)."]],"opts":["diminish","diminished","diminishing","has diminished"],"or":["diminish(축소시키다): 접속사 없이 동사가 하나 더 생기고, 단수 주어에 s도 빠짐.","diminished(축소시켰다): 과거형 동사로 보면 접속사 없이 동사가 겹치고, p.p.로 보면 뒤 목적어 their role(그것들의 역할)과 안 맞음.","diminishing(축소시키면서): 주절 동사 weakens(약화시킨다) 뒤에 덧붙인 분사구문이고 overlapping(중첩되면서)과 나란해 맞음.","has diminished(축소시켜 왔다): 진짜 동사라 접속사 없이 붙일 수 없고, overlapping(중첩되면서)과 짝도 안 맞음."],"point":"정동사 vs. 준동사","en":"Mass culture weakens the intermediary institutions in society, diminishing their role and overlapping these institutions.","ko":"대중문화는 사회 내의 매개하는 제도들을 약화시켜, 그것들의 역할을 축소시키고 이 제도들과 중첩된다.","hl":["weakens","diminishing their role and overlapping"],"khl":["약화시켜","역할을 축소시키고"],"blocks":[{"t":"p","h":"동사 자리는 이미 찼다","x":["이 문장의 진짜 동사는 weakens(약화시킨다) 하나다.","콤마 뒤는 그 결과를 덧붙이는 말이다.","접속사 없이 덧붙일 땐 동사 옷을 벗긴 -ing를 쓴다.","diminishing(축소시키면서) and overlapping(중첩되면서). and(그리고) 양쪽 모두 -ing로 짝이 맞는다."]},{"t":"pair","h":"쉬운 예시","x":[["He left the room, closing the door.","그는 문을 닫으면서 방을 나갔다. (진짜 동사 left = 나갔다, 덧붙임 closing = 닫으면서)"],["She sat down, smiling and waving.","그녀는 미소 짓고 손을 흔들며 앉았다. (smiling = 미소 지으며, waving = 손을 흔들며)"]]}],"post":["동사 weakens(약화시킨다) 하나 + 덧붙임 diminishing and overlapping(축소시키고 중첩되면서)"]},{"slots":[["weakens","","","주절 주어 mass culture(대중문화)의 진짜 동사."],["turn","turns","a","when(~할 때) 절의 주어는 people(사람들), 복수다. 복수 주어에는 s 없는 turn(의지하다)."],["is_pop","","","관행은 대중화되는 쪽이라 수동태."],["be_done","","","재판은 행해지는 쪽이라 be done(행해지다)."],["is2","","","주어 the appropriate place(적절한 장소)가 단수라 is(~이다)."]],"opts":["turn","turning","to turn","has turned"],"or":["turn(의지하다): 주어 people(사람들)이 복수라 s 없는 현재형 동사가 맞음.","turning(의지하는 것): when(~할 때) 절에 진짜 동사가 없어짐.","to turn(의지하는 것): to부정사라 동사 자리에 못 옴.","has turned(의지해 왔다): has(~해 왔다, 단수형)는 단수 주어용이라 복수 people(사람들)과 안 맞음."],"point":"수일치","en":"When people turn to social networks to put pressure on judicial decisions, this practice is popularized.","ko":"사법적 결정에 압박을 가하기 위해 사람들이 소셜 네트워크에 의존할 때, 이러한 관행은 대중화된다.","hl":["people turn"],"khl":["사람들이 소셜 네트워크에 의존할 때"],"blocks":[{"t":"p","h":"people(사람들)은 언제나 여러 명","x":["people(사람들)에는 s가 없어서 단수처럼 보인다.","하지만 people(사람들)은 원래 여러 사람을 뜻하는 복수다.","그래서 동사에 s를 붙이지 않는다.","children(아이들), men(남자들)도 s 없이 복수인 말이다."]},{"t":"pair","h":"쉬운 예시","x":[["People love this park.","사람들은 이 공원을 아주 좋아한다. (People = 사람들, 복수 → love = 사랑하다)"],["Children like ice cream.","아이들은 아이스크림을 좋아한다. (Children = 아이들, 복수 → like = 좋아하다)"]]}],"post":["people(사람들) = 복수 → turn(의지하다), s 없음"]},{"slots":[["overlapping","","","diminishing(축소시키면서)과 나란한 -ing."],["to_put","","","목적을 나타내는 to부정사 \"압박을 가하기 위해\"."],["which1","","","콤마 뒤 계속적 용법 which(그런데 그것은)."],["be_done","do","a","Justice(재판)가 직접 무엇을 하는 게 아니다. 재판은 '행해지는' 쪽이고 뒤에 목적어도 없다."],["to_judge","","","the appropriate place(적절한 장소)를 꾸미는 to부정사."]],"opts":["doing","be done","to be done","been done"],"or":["doing(하는 것): 조동사 must(~해야 한다) 뒤에는 동사원형이 와야 하므로 -ing가 못 옴.","be done(행해지다): 조동사 must not(~해서는 안 된다) 뒤 동사원형 be + p.p. 수동태라 맞음.","to be done(행해지는 것): 조동사 must(~해야 한다) 뒤에 to를 쓰지 않음.","been done(행해진): 조동사 뒤에는 원형 be(~이다)가 와야 하는데 p.p. been(~였던)이 옴."],"point":"능동태 vs. 수동태","en":"Justice must not be done in the public square.","ko":"재판은 대중 광장에서 집행되어서는 안 된다.","hl":["must not be done"],"khl":["집행되어서는 안 된다"],"blocks":[{"t":"p","h":"재판은 손이 없다","x":["Justice(재판)는 사람이 하는 일이다. 스스로 무엇을 하지 못한다.","그래서 재판이 주어면 '행해지는' 쪽, 수동태다.","조동사 뒤 수동태 = 조동사 + be + p.p.","must not be done(행해져서는 안 된다)."]},{"t":"pair","h":"쉬운 예시","x":[["The work must be finished today.","그 일은 오늘 끝마쳐져야 한다. (일은 끝내지는 쪽 → must be finished = 끝마쳐져야 한다)"],["The rules should be kept.","규칙은 지켜져야 한다. (should be kept = 지켜져야 한다)"]]},{"t":"tap","h":"확인 질문","q":"Justice must not do(재판이 하면 안 된다) 뒤에 무엇을 하는지 목적어가 있나?","a":["없다. in the public square(대중 광장에서)는 장소일 뿐이다.","하는 쪽이 아니라 되는 쪽이라 be done(행해지다)."]}],"post":["조동사 + be + p.p.: Justice must not be done(재판은 행해져서는 안 된다)"]},{"slots":[["weakening","","","요인이 유대를 약화시키는 쪽이라 능동 -ing."],["important","","","are(~이다)의 보어 형용사."],["becomes","","","주어 this practice(이 관행)가 단수라 becomes(~이 된다)."],["which2","where","a","뒤에 today is converted(오늘날 전환된다)가 온다. 주어가 빠진 문장이라 관계부사 where(~하는 곳)가 아니라 관계대명사 which(그런데 그것은)."],["is2","","","주어 the appropriate place(적절한 장소)가 단수라 is(~이다)."]],"opts":["what","who","whose","which"],"or":["what(~하는 것): 앞에 받는 명사 the public square(대중 광장)가 있으면 못 쓰고, 콤마 뒤 덧붙임에도 못 씀.","who(~하는): 사람을 받는 말이라 장소 the public square(대중 광장)를 받을 수 없음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 today(오늘날)와 동사 is converted(전환된다)가 옴.","which(그런데 그것은): 콤마 뒤에서 the public square(대중 광장)를 받고 뒤에 주어가 빠져 있어 맞음."],"point":"관계대명사 vs. 관계부사","en":"Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.","ko":"재판은 대중 광장에서 집행되어서는 안 되며, 그것은 오늘날 가상의 차원, 즉 소셜 네트워크로 전환된다.","hl":["the public square, which today is converted"],"khl":["그것은 오늘날 가상의 차원"],"blocks":[{"t":"p","h":"장소 명사라고 무조건 where(~하는 곳)는 아니다","x":["앞 명사 the public square(대중 광장)가 장소라서 where(~하는 곳)가 떠오른다.","하지만 결정은 뒤 문장이 한다.","where(~하는 곳) 뒤에는 빠진 것 없는 완전한 문장이 와야 한다.","today(오늘날) is converted(전환된다)에는 주어가 없다.","빠진 주어를 채워 주는 건 관계대명사 which(그런데 그것은)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the park which has a big lake.","이곳은 큰 호수가 있는 공원이다. (has = 가지고 있다, 주어 빠짐 → which)"],["This is the park where we played.","이곳은 우리가 놀았던 공원이다. (we played = 우리가 놀았다, 완전 → where = ~하는 곳)"]]}],"post":["장소 명사여도 뒤에 주어 빠짐 → which(그런데 그것은), 완전한 문장 → where(~하는 곳)"]},{"slots":[["unite","","","선행사 ties(유대감들)가 복수라 unite(결속시키다)."],["harmonious","","","명사 functioning(기능)을 꾸미는 형용사."],["is_conv","","","광장이 가상 공간으로 바뀌는 쪽이라 수동태 is converted(전환된다)."],["to_judge","","","place(장소)를 꾸미는 to부정사 \"재판할\"."],["is2","are","a","주어는 the appropriate place(적절한 장소), 단수다. to judge and make justice(재판하고 정의를 실현할)는 꼬리표일 뿐이다."]],"opts":["being","is","be","were"],"or":["being(~인 것): -ing는 동사 자리에 못 와서 문장에 동사가 없어짐.","is(~이다): 주어 the appropriate place(적절한 장소)가 단수이고 지금의 일반적인 사실이라 맞음.","be(~이다): 주어 뒤 동사 자리에 원형 be가 혼자 올 수 없음.","were(~였다): 복수 주어용 과거형이라 단수 주어 place(장소)와 안 맞음."],"point":"수식받는 주어의 수일치","en":"In a democratic state of law, the appropriate place to judge and make justice is the court.","ko":"민주적인 법치 국가에서, 재판하고 정의를 실현하기에 적절한 장소는 법정이다.","hl":["the appropriate place","is the court"],"khl":["적절한 장소는","법정이다"],"blocks":[{"t":"p","h":"긴 꼬리표 떼어 내기","x":["주어 the appropriate place(적절한 장소) 뒤에 to judge and make justice(재판하고 정의를 실현할)가 길게 붙었다.","동사 바로 앞의 justice(정의)나 and(그리고) 때문에 복수처럼 느껴진다.","꼬리표를 떼면 the appropriate place ___ the court(적절한 장소는 ___ 법정).","place(장소)는 하나, 그래서 is(~이다)."]},{"t":"pair","h":"쉬운 예시","x":[["The best way to learn and enjoy English is reading.","영어를 배우고 즐기는 가장 좋은 방법은 독서다. (주어 The best way = 가장 좋은 방법 → is = ~이다)"],["The book on the desks is mine.","책상들 위에 있는 그 책은 내 것이다. (주어 The book = 그 책 → is = ~이다)"]]}],"post":["꼬리표 to judge and make justice(재판하고 정의를 실현할) 떼고 place(장소) → is(~이다)"]}],"quiz":[{"s":"He ran out of the room, ___ the door.","o":["closing","closes"],"a":0,"ko":"그는 문을 닫으면서 방에서 뛰어나갔다.","why":"진짜 동사 ran(뛰었다)이 이미 있어 덧붙임은 -ing, closing(닫으면서).","wy":"closes(닫다): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐."},{"s":"Many people ___ to the park on Sundays.","o":["goes","go"],"a":1,"ko":"많은 사람들이 일요일마다 공원에 간다.","why":"people(사람들)은 복수라 s 없는 go(가다).","wy":"goes(가다, 3인칭 단수형): 단수 주어용이라 복수 people(사람들)과 안 맞음."},{"s":"The homework must ___ by Friday.","o":["be done","do"],"a":0,"ko":"숙제는 금요일까지 끝내져야 한다.","why":"숙제는 해지는 쪽이라 조동사 + be + p.p., be done(행해지다).","wy":"do(하다): 숙제가 직접 하는 게 아니고 뒤에 목적어도 없음."},{"s":"This is the house ___ was built in 1990.","o":["which","where"],"a":0,"ko":"이것은 1990년에 지어진 집이다.","why":"뒤에 주어가 빠진 문장 was built(지어졌다)라서 관계대명사 which(~하는).","wy":"where(~하는 곳): 관계부사라 뒤에 완전한 문장이 와야 하는데 주어가 없음."},{"s":"The key to the doors ___ on the table.","o":["are","is"],"a":1,"ko":"그 문들의 열쇠는 탁자 위에 있다.","why":"주인은 The key(열쇠), 단수. to the doors(그 문들의)는 꼬리표.","wy":"are(~이다): 복수 동사라 단수 주어 The key(열쇠)와 안 맞음."}]}],"comp":[{"no":"32","slots":[["diminishing","","","주절 동사 weakens(약화시킨다)에 덧붙인 분사구문."],["turn","","","주어 people(사람들)이 복수라 turn(의지하다)."],["to_put","put","a","when(~할 때) 절의 동사는 이미 turn(의지하다)이다. 접속사 없이 동사 put(가하다)을 또 쓸 수 없다. '압박을 가하기 위해'라는 목적은 to부정사."],["which2","","","콤마 뒤 the public square(대중 광장)를 받는 which(그런데 그것은)."],["that","","","앞 명사 a way(방식)를 꾸미는 that(~하는)."]],"opts":["puts","to put","to putting","had put"],"or":["puts(가하다, 3인칭 단수형): 접속사 없이 동사가 또 생기고 복수 people(사람들)과 수도 안 맞음.","to put(가하기 위해): 진짜 동사 turn(의지하다) 뒤에 목적을 덧붙이는 to부정사라 맞음.","to putting(가하는 것으로): '~하기 위해'라는 목적은 to + 동사원형이라 -ing가 붙으면 안 됨.","had put(가했었다): 진짜 동사라 접속사 없이 turn(의지하다) 뒤에 또 올 수 없음."],"point":"정동사 vs. 준동사","en":"When people turn to social networks to put pressure on judicial decisions, this practice is popularized.","ko":"사법적 결정에 압박을 가하기 위해 사람들이 소셜 네트워크에 의존할 때, 이러한 관행은 대중화된다.","hl":["turn to social networks to put pressure"],"khl":["압박을 가하기 위해"],"blocks":[{"t":"p","h":"to가 두 번 나와도 역할이 다르다","x":["turn to(~에 의존하다)의 to(~에)는 전치사라 뒤에 명사 social networks(소셜 네트워크)가 온다.","to put(가하기 위해)의 to는 동사원형과 붙어 '~하기 위해'라는 목적을 만든다.","when(~할 때) 절의 진짜 동사는 turn(의지하다) 하나.","그래서 put(가하다) 앞에 to를 붙여 준동사로 만든다."]},{"t":"pair","h":"쉬운 예시","x":[["I went to the library to study.","나는 공부하기 위해 도서관에 갔다. (to the library = 도서관에, to study = 공부하기 위해)"],["She saved money to buy a bike.","그녀는 자전거를 사기 위해 돈을 모았다. (to buy = 사기 위해)"]]}],"post":["동사 turn(의지하다) 하나 + 목적 to put(가하기 위해)"]},{"no":"32","slots":[["weakens","","","주절 주어 mass culture(대중문화)의 진짜 동사."],["is_pop","","","관행은 대중화되는 쪽이라 수동태."],["be_done","","","재판은 행해지는 쪽이라 be done(행해지다)."],["to_judge","","","place(장소)를 꾸미는 to부정사."],["that","what","a","앞에 a way(방식)라는 명사가 있다. 명사를 꾸밀 땐 what(~하는 것)이 아니라 that(~하는)."]],"opts":["that","where","whose","how"],"or":["that(~하는): 앞 명사 a way(방식)를 꾸미고 뒤에 주어가 빠져 있어 맞음.","where(~하는 곳): 관계부사라 뒤에 완전한 문장이 와야 하는데 주어가 빠져 있음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 동사 is(~이다)가 옴.","how(~하는 방법): a way(방식)와 함께 쓸 수 없고, 뒤에 주어도 빠져 있음."],"point":"that/which vs. what","en":"The appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.","ko":"재판하고 정의를 실현하기에 적절한 장소는 법정이며 대중의 압박에 영향을 받지 않는 방식이어야 한다.","hl":["a way that is immune"],"khl":["영향을 받지 않는 방식"],"blocks":[{"t":"p","h":"명사가 앞에 서 있으면 what(~하는 것)은 비켜라","x":["what(~하는 것)은 '것'이라는 명사를 이미 품고 있다.","그래서 앞에 명사 a way(방식)가 있으면 명사가 겹친다.","앞 명사를 꾸미고 뒤에 주어가 빠져 있으면 that(~하는).","a way that is immune(영향을 받지 않는 방식)."]},{"t":"pair","h":"쉬운 예시","x":[["I know a girl that is good at math.","나는 수학을 잘하는 소녀를 안다. (명사 a girl = 소녀 + that)"],["What is good for you is sleep.","너에게 좋은 것은 잠이다. (앞에 명사 없음 → What)"]]}],"post":["명사 a way(방식) + that(~하는) + 주어 빠진 문장"]}],"compquiz":[{"s":"I went to the store ___ some milk.","o":["to buy","buy"],"a":0,"ko":"나는 우유를 좀 사기 위해 가게에 갔다.","why":"'~하기 위해'라는 목적이라 to부정사 to buy(사기 위해).","wy":"buy(사다): 이미 동사 went(갔다)가 있어 접속사 없이 동사를 또 쓸 수 없음."},{"s":"___ you need is rest.","o":["That","What"],"a":1,"ko":"네가 필요한 것은 휴식이다.","why":"앞에 명사가 없고 need(필요하다)의 목적어가 빠져 있어 What(~하는 것).","wy":"That(~하는): 받을 명사(선행사)가 없고, 뒤 you need(네가 필요하다)도 목적어가 빠진 불완전한 문장이라 못 씀."}]},{"id":"2610g2-33","no":"33","title":"어법특훈 · 26년 10월 고2 33번","sub":"평생 이어지는 발달, 가소성","tpl":"Human development {is|is} now {increasingly|increasingly} understood as an ongoing, flexible, and {evolving|evolving} process rather than a fixed sequence of stages. At the core of this perspective {lies|lies} the concept of plasticity. Plasticity {refers|refers} to the human capacity {to_change|to change}, adapt, and {reorganize|reorganize} cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights {that_a|that} individuals {are|are} not merely passive recipients of development but active agents {capable|capable} of growth throughout {their|their} lives. In earlier views, development was believed {to_occur|to occur} mainly during childhood, with adulthood {seen|seen} as a period of stability and old age as a phase of decline. The concept of plasticity {challenges|challenges} this rigid outlook by {emphasizing|emphasizing} {that_b|that} development {continues|continues} across the entire lifespan. {although|Although} the extent of change may vary at different stages, every phase of life {allows|allows} room for adaptation and transformation.","fn":["*plasticity: 가소성(변화하고 적응하는 능력)"],"mean":{"is":"~이다(be의 현재형, 단수 주어)","increasingly":"점점 더(부사)","increasing":"증가하는(increase의 -ing형)","increase":"증가하다(동사원형) / 증가(명사)","increased":"증가했다, 증가된(increase의 과거형·과거분사형)","increases":"증가하다(increase의 3인칭 단수 현재형)","evolving":"서서히 발전하는(evolve의 -ing형)","lies":"놓여 있다, 있다(lie의 3인칭 단수 현재형)","lie":"놓여 있다(동사원형·복수 주어 현재형)","lying":"놓여 있는(lie의 -ing형)","to lie":"놓여 있는 것(lie의 to부정사)","lain":"놓여 있던(lie의 과거분사형)","refers":"가리키다, 지칭하다(refer의 3인칭 단수 현재형)","refer":"가리키다(동사원형·복수 주어 현재형)","referring":"가리키는(refer의 -ing형)","to refer":"가리키는 것(refer의 to부정사)","having referred":"가리키고 나서(refer의 완료 -ing형)","to change":"변화할, 변화시킬(change의 to부정사)","reorganize":"재구성하다(동사원형)","reorganizing":"재구성하는 것(reorganize의 -ing형)","reorganized":"재구성했다, 재구성된(reorganize의 과거형·과거분사형)","reorganizes":"재구성하다(reorganize의 3인칭 단수 현재형)","reorganization":"재구성(명사)","that":"~라는 것(명사절을 이끄는 접속사)","what":"~하는 것(선행사를 품은 관계대명사)","whom":"~을(목적격 관계대명사)","of which":"그것의(전치사 + 관계대명사)","in which":"그 안  형용사 자리. 과정이 스스로 발전하니 -ing."],["lies","lie","a","장소를 말하는 덩어리가 앞으로 나와 주어·동사 자리가 바뀌었다. 진짜 주어는 뒤의 the concept(개념), 단수다."],["to_change","","","the human capacity(인간의 능력)를 뒤에서 꾸미는 to부정사. \"변화할 능력\"."],["capable","","","active agents(능동적인 주체들)를 뒤에서 꾸미는 형용사. capable of(~할 수 있는)."]],"opts":["lying","to lie","lies","lain"],"or":["lying(놓여 있는): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to lie(놓여 있는 것): to부정사도 동사 자리에 못 와서 주어 the concept(개념)의 동사가 비게 됨.","lies(놓여 있다): 자리가 바뀐 문장의 진짜 주어 the concept(개념)가 단수라 s 붙은 현재형 동사가 맞음.","lain(놓여 있던, lie의 과거분사형): 과거분사는 have(완료 조동사)나 be 없이 혼자 동사가 될 수 없음."],"point":"도치 (주어·동사 수일치)","en":"At the core of this perspective lies the concept of plasticity.","ko":"이러한 관점의 핵심에는 가소성의 개념이 있다.","hl":["lies","the concept"],"khl":["있다","개념이"],"blocks":[{"t":"p","h":"자리 바꾼 문장에서 주인 찾기","x":["보통 순서는 주어 → 동사다.","장소 덩어리 At the core of this perspective(이 관점의 핵심에)가 앞으로 나오면 동사가 먼저 나올 수 있다.","그래서 lies(있다) 뒤에 진짜 주인 the concept(개념)가 숨어 있다.","앞의 perspective(관점)는 주인이 아니다. 장소 덩어리 안의 말일 뿐이다.","주인 the concept(개념)가 하나니까 lies(있다)."]},{"t":"pair","h":"쉬운 예시","x":[["On the table lies a book.","탁자 위에 책 한 권이 놓여 있다. (주인 a book(책 한 권) → lies(놓여 있다))"],["Under the tree sit two cats.","나무 아래에 고양이 두 마리가 앉아 있다. (주인 two cats(고양이 두 마리) → sit(앉아 있다))"]]},{"t":"tap","h":"확인 질문","q":"이 문장에서 lies(있다)의 진짜 주인은?","a":["the concept of plasticity(가소성의 개념).","동사 뒤에 있어도 주인은 주인이다. 하나라서 lies(있다)."]}],"post":["장소 덩어리 + 동사 + 주어: lies(있다) ← the concept(개념, 단수)"]},{"slots":[["increasingly","","","과거분사 understood(이해되는)를 꾸미는 부사."],["refers","","","주어 Plasticity(가소성)의 진짜 동사. 단수라 s."],["reorganize","reorganizing","a","to 뒤에 change(변화시키다), adapt(적응시키다)와 함께 나란히 서는 동사원형 자리다."],["their","","","individuals(개인들)를 받는 복수 소유격. 뒤에 명사 lives(삶)가 온다."],["continues","","","that(~라는 것) 뒤 주어 development(발달)의 진짜 동사. 단수라 s."]],"opts":["reorganized","reorganize","reorganizes","reorganization"],"or":["reorganized(재구성했다, 재구성된): to 뒤 동사원형 change(변화시키다), adapt(적응시키다)와 모양이 달라 짝이 깨짐.","reorganize(재구성하다): to change(변화시키다), adapt(적응시키다)와 같은 동사원형이라 셋이 나란히 맞음.","reorganizes(재구성하다, 3인칭 단수형): to 뒤에는 s 붙은 동사가 올 수 없음.","reorganization(재구성): 명사라 동사원형 change(변화시키다), adapt(적응시키다)와 짝이 안 맞고, 뒤의 patterns(패턴들)를 목적어로 받지 못함."],"point":"병렬구조","en":"Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns.","ko":"가소성은 인지적, 정서적, 그리고 행동적 패턴들을 변화시키고, 적응시키며, 재구성하는 인간의 능력을 지칭한다.","hl":["to change, adapt, and reorganize"],"khl":["변화시키고, 적응시키며, 재구성하는"],"blocks":[{"t":"p","h":"to 하나에 동사 셋","x":["to change(변화시키다), adapt(적응시키다), and reorganize(재구성하다).","to는 맨 앞에 한 번만 쓰고 뒤에서는 생략했다.","그래서 adapt(적응시키다)도 reorganize(재구성하다)도 to 뒤 동사원형이다.","셋 중 마지막만 -ing로 바꾸면 줄이 흐트러진다."]},{"t":"pair","h":"쉬운 예시","x":[["I want to eat, sleep, and rest.","나는 먹고, 자고, 쉬고 싶다. (to 뒤 원형 셋)"],["He likes to read and write.","그는 읽고 쓰는 것을 좋아한다. (to read(읽기) and write(쓰기))"]]}],"post":["to + 원형, 원형, and 원형: to change, adapt, and reorganize(변화·적응·재구성하다)"]},{"slots":[["is","","","주어 Human development(인간 발달)가 단수라 is(~이다)."],["lies","","","도치된 문장. 진짜 주어 the concept(개념)가 단수라 lies(있다)."],["that_a","what","a","highlights(강조하다)의 목적어 자리. 뒤 문장에 빠진 게 없으니 what(~하는 것)이 아니라 that(~라는 것)."],["seen","","","with + adulthood(성인기) + seen(여겨지는). 성인기는 \"여겨지는\" 쪽이라 p.p."],["allows","","","주어 every phase(모든 단계). every(모든) 뒤는 단수라 allows(허용하다)."]],"opts":["whom","of which","that","in which"],"or":["whom(~을, 목적격 관계대명사): 앞에 꾸밀 사람 명사도 없고 뒤 문장에 빈자리도 없음.","of which(그것의): 앞에 받을 명사가 없어서 관계대명사가 설 수 없음.","that(~라는 것): 뒤가 완전한 문장이고 highlights(강조하다)의 목적어가 되는 명사절이라 맞음.","in which(그 안에서): 앞에 장소처럼 받을 명사가 없어 명사절을 만들 수 없음."],"point":"that vs. what","en":"It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.","ko":"그것은 개인들이 단순히 발달의 수동적인 수용자가 아니라 평생에 걸쳐 성장이 가능한 능동적인 주체들이라는 점을 강조한다.","hl":["highlights that","individuals are"],"khl":["점을 강조한다","개인들이"],"blocks":[{"t":"p","h":"뒤 문장 빈칸 검사","x":["what(~하는 것)은 뒤 문장에 빈자리가 있을 때만 쓴다.","that(~라는 것) 뒤 문장: individuals(개인들)가 주어, are(~이다)가 동사, recipients(수용자들)가 보어.","빠진 것이 하나도 없다.","완전한 문장을 목적어로 만들 땐 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I think that she is kind.","나는 그녀가 친절하다고 생각한다. (뒤가 완전 → that)"],["I know what you want.","나는 네가 원하는 것을 안다. (want(원하다)의 목적어가 빠짐 → what)"]]}],"post":["뒤가 완전하면 that(~라는 것): highlights that individuals are ~(개인들이 ~라는 점을 강조한다)"]},{"slots":[["evolving","","","ongoing(진행 중인), flexible(유연한)과 나란한 형용사 자리."],["to_change","","","capacity(능력)를 꾸미는 to부정사."],["to_occur","","","be believed to(~한다고 여겨지다) 뒤 to부정사."],["seen","seeing","a","with(~한 채로) + 명사 + 분사. adulthood(성인기)는 직접 보는 게 아니라 \"여겨지는\" 쪽이다."],["emphasizing","","","전치사 by(~함으로써) 뒤라 동명사."]],"opts":["see","seen","sees","saw"],"or":["see(여기다): with(~한 채로) + 명사 뒤에 동사원형은 못 옴.","seen(여겨지는): with + adulthood(성인기) 뒤에서 성인기가 \"여겨지는\" 쪽이라 p.p.가 맞음.","sees(여기다, 3인칭 단수형): with(~한 채로) 뒤 덩어리 안에 진짜 동사는 올 수 없음.","saw(보았다, see의 과거형): 과거형 동사도 with(~한 채로) 뒤 분사 자리에 못 옴."],"point":"능동 v-ing vs. 수동 p.p.","en":"In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.","ko":"이전의 관점들에서는 발달이 주로 아동기에 일어난다고 믿어졌으며, 성인기는 안정의 시기로, 그리고 노년기는 쇠퇴의 단계로 간주되었다.","hl":["with adulthood seen as"],"khl":["성인기는 안정의 시기로"],"blocks":[{"t":"p","h":"with(~한 채로) 뒤에 숨은 수동","x":["with(~한 채로) + 명사 + 분사 = 명사가 ~한 채로, ~하면서.","adulthood(성인기)와 see(여기다)의 관계를 따진다.","사람들이 성인기를 안정의 시기로 \"여긴다\".","성인기 입장에서는 \"여겨지는\" 쪽. 그래서 seen(여겨지는).","뒤의 old age(노년기) as a phase(단계로)도 seen(여겨지는)이 생략된 것이다."]},{"t":"pair","h":"쉬운 예시","x":[["He slept with the light turned on.","그는 불을 켜 놓은 채로 잠들었다. (불은 켜지는 쪽 → turned(켜진))"],["She stood with her arms folded.","그녀는 팔짱을 낀 채 서 있었다. (팔은 접히는 쪽 → folded(접힌))"]]}],"post":["with(~한 채로) + 명사 + p.p.: with adulthood seen as(성인기가 ~로 여겨지며)"]},{"slots":[["refers","","","주어 Plasticity(가소성)가 단수라 s."],["are","","","that(~라는 것) 뒤 주어 individuals(개인들)가 복수라 are(~이다)."],["challenges","","","주어 The concept(개념)가 단수. of plasticity(가소성의)는 꼬리표."],["emphasizing","emphasize","a","by(~함으로써)는 전치사다. 전치사 뒤에 동사를 쓰려면 -ing 옷을 입혀야 한다."],["that_b","","","emphasizing(강조하는 것)의 목적어. 뒤가 완전해서 that(~라는 것)."]],"opts":["emphasizing","emphasizes","emphasized","to emphasize"],"or":["emphasizing(강조하는 것): 전치사 by(~함으로써) 뒤라 동명사가 맞음.","emphasizes(강조하다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음.","emphasized(강조했다, 강조된): 과거형·과거분사형도 전치사 by(~함으로써) 뒤 명사 자리에 못 옴.","to emphasize(강조하는 것): 전치사 by(~함으로써) 뒤에는 to부정사가 못 옴."],"point":"전치사 + 동명사","en":"The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.","ko":"가소성의 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이러한 경직된 사고방식에 이의를 제기한다.","hl":["by emphasizing"],"khl":["강조함으로써"],"blocks":[{"t":"p","h":"전치사는 명사만 태운다","x":["by(~함으로써)는 뒤에 명사를 태우는 전치사다.","동사 emphasize(강조하다)는 그대로는 못 탄다.","-ing를 붙여 명사처럼 만든 emphasizing(강조하는 것)만 탈 수 있다.","by(~함으로써) + -ing = ~함으로써. 방법을 말할 때 자주 나온다."]},{"t":"pair","h":"쉬운 예시","x":[["You can learn English by watching movies.","영화를 봄으로써 영어를 배울 수 있다. (by watching = 봄으로써)"],["He is good at drawing.","그는 그림 그리기를 잘한다. (at drawing = 그리기를)"]]}],"post":["by(~함으로써) + -ing: by emphasizing(강조함으로써)"]}],"quiz":[{"s":"On the hill ___ a small house.","o":["stand","stands"],"a":1,"ko":"언덕 위에 작은 집 한 채가 서 있다.","why":"진짜 주어 a small house(작은 집 한 채)가 단수라 stands(서 있다).","wy":"stand(서 있다): 복수 주어에 쓰는 모양이라 단수 주어 a small house(작은 집 한 채)와 안 맞음."},{"s":"She cleaned the room, washed the dishes, and ___ the trash.","o":["took out","taking out"],"a":0,"ko":"그녀는 방을 청소하고, 설거지를 하고, 쓰레기를 내다 버렸다.","why":"cleaned(청소했다), washed(씻었다), took out(내다 버렸다). 과거형 동사 셋이 나란히.","wy":"taking out(내다 버리는 것): 앞의 과거형 동사 cleaned(청소했다), washed(씻었다)와 모양이 달라 짝이 깨짐."},{"s":"I know ___ he is honest.","o":["what","that"],"a":1,"ko":"나는 그가 정직하다는 것을 안다.","why":"뒤 문장 he is honest(그는 정직하다)가 완전하니 that(~라는 것).","wy":"what(~하는 것): 뒤 문장에 빠진 자리가 있어야 하는데 he is honest(그는 정직하다)는 완전함."},{"s":"He sat with his eyes ___.","o":["closed","closing"],"a":0,"ko":"그는 눈을 감은 채 앉아 있었다.","why":"눈은 \"감기는\" 쪽이라 p.p. closed(감긴).","wy":"closing(감는): 눈이 스스로 무언가를 감는 게 아니라 감기는 쪽이라 -ing는 안 맞음."},{"s":"She improved her English by ___ every day.","o":["read","reading"],"a":1,"ko":"그녀는 매일 읽음으로써 영어 실력을 늘렸다.","why":"전치사 by(~함으로써) 뒤는 -ing.","wy":"read(읽다): 전치사 by(~함으로써) 뒤에 동사원형은 못 옴."}]},{"items":[{"slots":[["increasingly","increasing","a","is understood(이해된다) 사이에서 과거분사 understood(이해되는)를 꾸미는 자리. 형용사·분사가 아니라 부사가 와야 한다."],["reorganize","","","to 뒤 change(변화시키다), adapt(적응시키다)와 나란한 동사원형."],["capable","","","active agents(능동적인 주체들)를 뒤에서 꾸미는 형용사."],["seen","","","성인기는 \"여겨지는\" 쪽이라 p.p."],["continues","","","that(~라는 것) 뒤 주어 development(발달)의 동사, 단수라 s."]],"opts":["increase","increasingly","increased","increases"],"or":["increase(증가하다, 증가): 동사원형이나 명사라 is(~이다)와 understood(이해되는) 사이에 끼어 분사를 꾸밀 수 없음.","increasingly(점점 더): 과거분사 understood(이해되는)를 꾸미는 부사라 맞음.","increased(증가된): 과거분사가 둘 겹쳐 is increased understood(증가된 이해된)처럼 문장이 깨짐.","increases(증가하다, 3인칭 단수형): is(~이다)가 이미 동사라 동사가 겹침."],"point":"형용사 자리 vs. 부사 자리","en":"Human development is now increasingly understood as an ongoing, flexible, and evolving process.","ko":"인간 발달은 계속 진행 중이고, 유연하며, 그리고 서서히 발전하는 과정으로 오늘날 점점 이해되고 있다.","hl":["increasingly understood","is"],"khl":["점점 이해되고 있다","인간 발달은"],"blocks":[{"t":"p","h":"be와 p.p. 사이 빈칸","x":["is understood(이해된다) = be + p.p. 수동태.","그 사이에 끼는 말은 \"얼마나, 어떻게\" 이해되는지 알려 주는 부사다.","increasingly(점점 더) → understood(이해되는). 화살표가 분사로 간다.","분사(동사에서 온 말)를 꾸미는 건 형용사가 아니라 부사."]},{"t":"pair","h":"쉬운 예시","x":[["The book is widely read.","그 책은 널리 읽힌다. (read(읽히는) ← 부사 widely(널리))"],["The cake was beautifully made.","그 케이크는 아름답게 만들어졌다. (made(만들어진) ← 부사 beautifully(아름답게))"]]}],"post":["be + 부사 + p.p.: is increasingly understood(점점 더 이해된다)"]},{"slots":[["is","","","주어 Human development(인간 발달)가 단수라 is(~이다)."],["refers","referring","a","이 문장의 주어 Plasticity(가소성) 뒤에 진짜 동사가 하나 있어야 한다. 다른 동사가 없다."],["that_a","","","highlights(강조하다)의 목적어, 뒤가 완전해서 that(~라는 것)."],["their","","","individuals(개인들)를 받는 복수 소유격."],["although","","","뒤에 주어 the extent(정도) + 동사 may vary(다를 수 있다)가 있는 절이라 접속사."]],"opts":["refer","to refer","having referred","refers"],"or":["refer(가리키다): 복수 주어에 쓰는 모양이라 단수 주어 Plasticity(가소성)와 안 맞음.","to refer(가리키는 것): to부정사는 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","having referred(가리키고 나서): 완료 -ing형이라 동사 자리에 못 오고 문장에 동사가 사라짐.","refers(가리키다): 주어 Plasticity(가소성)가 단수이고, 문장의 진짜 동사라 s 붙은 현재형이 맞음."],"point":"정동사 vs. 준동사","en":"Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns.","ko":"가소성은 인지적, 정서적, 그리고 행동적 패턴들을 변화시키고, 적응시키며, 재구성하는 인간의 능력을 지칭한다.","hl":["Plasticity refers to"],"khl":["지칭한다"],"blocks":[{"t":"p","h":"문장의 심장은 동사 하나","x":["문장마다 진짜 동사가 꼭 하나 있어야 살아 있다.","이 문장의 to change(변화시키다), adapt(적응시키다), reorganize(재구성하다)는 to 뒤라 진짜 동사가 아니다.","그러면 진짜 동사는 refers(지칭하다) 하나뿐이다.","이것까지 referring(지칭하는)으로 바꾸면 문장에 심장이 없어진다."]},{"t":"pair","h":"쉬운 예시","x":[["The word refers to a small dog.","그 단어는 작은 개를 가리킨다. (진짜 동사 refers(가리킨다))"],["My dream is to become a doctor.","내 꿈은 의사가 되는 것이다. (진짜 동사 is(~이다), to become(되는 것)은 준동사)"]]},{"t":"tap","h":"확인 질문","q":"refer to(~을 가리키다) 뒤의 the human capacity(인간의 능력)는 결국 무엇을 할 능력인가?","a":["삶의 경험과 환경에 맞춰 생각·감정·행동 패턴을 바꾸고 다시 짜는 능력.","이것이 이 글의 핵심 단어 plasticity(가소성)의 뜻이다."]}],"post":["진짜 동사 하나 필수: Plasticity refers to(가소성은 ~을 지칭한다)"]},{"slots":[["evolving","","","ongoing(진행 중인), flexible(유연한)과 나란한 형용사 자리."],["are","","","주어 individuals(개인들)가 복수라 are(~이다)."],["their","them","a","뒤에 명사 lives(삶)가 온다. 명사 앞에서 \"누구의\"를 말하는 자리라 소유격이 필요하다."],["emphasizing","","","전치사 by(~함으로써) 뒤 동명사."],["allows","","","every phase(모든 단계)가 단수라 allows(허용하다)."]],"opts":["they","theirs","themselves","their"],"or":["they(그들은): 주격이라 명사 lives(삶) 앞에 붙을 수 없음.","theirs(그들의 것): 혼자 쓰는 소유대명사라 뒤에 명사 lives(삶)가 오면 안 됨.","themselves(그들 자신): 재귀대명사라 명사 lives(삶) 앞 소유격 자리에 못 옴.","their(그들의): 뒤 명사 lives(삶)를 꾸미는 소유격이고, 복수 individuals(개인들)를 받아서 맞음."],"point":"대명사의 성·수·격 일치","en":"It highlights that individuals are not merely passive recipients of development but active agents capable of growth
