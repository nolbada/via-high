plex","","","be동사 is(~이다) 뒤 보어 자리라 형용사 complex(복잡한)가 맞다."]],"opts":["to be","being","been","is"],"or":["to be(~인 것, to부정사): 전치사 by(~함으로써) 뒤에는 to부정사가 못 옴.","being(~인 것, 동명사): 전치사 by(~함으로써) 뒤라 동명사가 맞음.","been(~였던, 과거분사형): 전치사 뒤에 과거분사 혼자 올 수 없음.","is(~이다, 현재형): 전치사 by(~함으로써) 뒤에 동사가 그대로 올 수 없음."],"point":"전치사 + 동명사","en":"Just as an expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities, so each perspective on the body can potentially enhance the others.","ko":"와인의 맛과 색의 전문가가 그러한 특성들의 기저에 있는 화학을 알게 됨으로써 많은 것을 획득하듯이, 마찬가지로 신체에 대한 각각의 관점은 아마도 다른 관점들을 강화시킬지도 모른다.","hl":["by being aware"],"khl":["알게 됨으로써"],"blocks":[{"t":"p","h":"전치사 뒤는 명사 자리","x":["by(~함으로써)는 전치사다.","전치사 뒤에는 명사 모양이 와야 한다.","aware(알고 있는)는 형용사라 be동사가 있어야 쓸 수 있다.","be동사를 명사 모양으로 바꾸면 being(~인 것).","그래서 by being aware = 알게 됨으로써."]},{"t":"pair","h":"쉬운 예시","x":[["She is good at singing.","그녀는 노래를 잘한다. (at + singing(노래하는 것))"],["Thank you for being kind.","친절하게 대해 줘서 고마워. (for + being(~인 것))"]]}],"post":["전치사 by(~함으로써) + being aware(알고 있는 것)"]},{"slots":[["that_a","","","선행사 the chemistry(화학)가 있고 뒤에 주어가 빠져 있어 관계대명사 that(~하는)이 맞다."],["potentially","potential","a","조동사 can(~할 수 있다)과 동사 enhance(강화하다) 사이에서 동사를 꾸미는 자리라 부사여야 한다."],["sectioned","","","공동체가 다른 공동체와 \"구분된\" 쪽이라 과거분사 sectioned(구분된)가 맞다."],["studied","","","생명체가 \"연구되는\" 쪽이라 are studied(연구된다)가 맞다."],["is","","","nobody(아무도 ~않다)는 단수 취급이라 is(~이다)가 맞다."]],"opts":["potentiality","potentials","potent","potentially"],"or":["potentiality(잠재성): 명사라 동사 enhance(강화하다)를 꾸밀 수 없음.","potentials(잠재력들): 복수 명사라 can(~할 수 있다)과 동사 사이에 낄 수 없음.","potent(강력한): 형용사라 동사를 꾸밀 수 없고 뜻도 안 맞음.","potentially(잠재적으로, 아마도): 동사 enhance(강화하다)를 꾸미는 부사라 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"So each perspective on the body can potentially enhance the others.","ko":"마찬가지로 신체에 대한 각각의 관점은 아마도 다른 관점들을 강화시킬지도 모른다.","hl":["potentially enhance"],"khl":["아마도","강화시킬지도"],"blocks":[{"t":"p","h":"샌드위치 속 재료","x":["can(~할 수 있다)과 enhance(강화하다)는 빵 두 장이다.","그 사이에 낀 재료는 동사 enhance(강화하다)를 꾸민다.","동사를 꾸미는 건 부사(-ly)의 일이다.","potential(잠재적인)은 형용사라 명사 앞에만 선다. a potential problem(잠재적인 문제)처럼."]},{"t":"pair","h":"쉬운 예시","x":[["You can easily find it.","너는 그것을 쉽게 찾을 수 있다. (can(~할 수 있다) + 부사 + find(찾다))"],["It is an easy test.","그것은 쉬운 시험이다. (형용사 + 명사 test(시험))"]]}],"post":["can(~할 수 있다) + -ly + 동사: potentially enhance(아마도 강화하다)"]},{"slots":[["underlies","","","선행사 the chemistry(화학)가 단수라 underlies(기저에 있다)가 맞다."],["requires","requiring","a","주어 every scientific tool ... and every aspect(모든 과학적 도구와 모든 측면) 뒤에 진짜 동사가 있어야 한다. -ing는 동사 자리에 못 온다."],["dedicated","","","be dedicated to(~에 전념하다)의 수동 모양이라 dedicated(전념하는)가 맞다."],["becomes","","","주어가 How(어떻게)로 시작하는 명사절 한 덩어리라 단수 becomes(~이 되다)가 맞다."],["that_c","","","commented(논평했다)의 목적어 자리, 뒤가 완전한 문장이라 접속사 that(~라고)이 맞다."]],"opts":["to require","having required","being required","requires"],"or":["to require(요구하는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","having required(요구하고 나서): 완료 -ing형이라 동사 자리에 못 옴.","being required(요구받는): -ing형이라 동사 자리에 못 오고, 뜻도 수동이라 뒤 목적어 such depth(그렇게 깊은 정도)와 안 맞음.","requires(요구하다): 이 문장의 진짜 동사이고 every(모든)가 붙은 주어라 단수형이 맞음."],"point":"정동사 vs. 준동사","en":"And yet every scientific tool, from microscopes to mathematics, and every aspect of the body, from the brain to the microorganism, requires such depth of expertise that this tends not to happen.","ko":"하지만 현미경에서부터 수학에 이르기까지의 모든 과학적 도구와 뇌에서부터 미생물에 이르기까지의 신체의 모든 측면은 너무 깊은 전문 지식을 요구해서 이런 일은 잘 일어나지 않는 경향이 있다.","hl":["every scientific tool","every aspect of the body","requires"],"khl":["모든 과학적 도구","신체의 모든 측면은","요구해서"],"blocks":[{"t":"p","h":"긴 주어 뒤에서 동사 찾기","x":["주어가 아주 길다. every scientific tool(모든 과학적 도구) ... and every aspect of the body(신체의 모든 측면).","중간의 from A to B(A에서 B까지)는 콤마 사이에 낀 덧붙임이다.","덧붙임을 다 걷어 내면 주어 + requires(요구한다)만 남는다.","이 문장의 진짜 동사는 requires(요구한다) 하나다.","requiring(요구하는)으로 바꾸면 동사가 사라진다."]},{"t":"pair","h":"쉬운 예시","x":[["Every boy and every girl in the room likes music.","방에 있는 모든 소년과 모든 소녀는 음악을 좋아한다. (every(모든) 주어 → likes(좋아한다))"],["The man in the car waves at me.","차 안의 남자가 나에게 손을 흔든다. (진짜 동사 waves(손을 흔든다))"]]},{"t":"tap","h":"확인 질문","q":"주어에 and(그리고)가 있는데 왜 require(요구하다)가 아니라 requires(요구한다)일까?","a":["each(각각의)·every(모든)가 붙은 명사는 and(그리고)로 이어져도 하나씩 따로 본다.","그래서 단수형 requires(요구한다)."]}],"post":["긴 주어 걷어 내면 진짜 동사 하나: ... requires(요구한다)"]},{"slots":[["enhance","","","can(~할 수 있다) 뒤 동사원형이다."],["to_happen","","","tend(~하는 경향이 있다)는 뒤에 to부정사를 받는다."],["sectioned","sectioning","a","각 공동체는 스스로 무엇을 구분하는 게 아니라 전문 어휘에 의해 \"구분되는\" 쪽이다. 뒤에 by(~에 의해)까지 있다."],["communicate","","","주어가 different types of cell(다른 유형의 세포들), 복수라 communicate(소통하다)가 맞다."],["evidently","","","문장 전체를 꾸며 \"분명히\"라는 뜻을 더하는 부사다."]],"opts":["sections","sectioned","to section","having sectioned"],"or":["sections(구분하다, 3인칭 단수형): 접속사 없이 콤마 뒤에 동사가 또 생겨 문장이 깨짐.","sectioned(구분된): 공동체가 전문 어휘에 의해 구분되는 수동이라 과거분사가 맞음.","to section(구분하는 것): 뒤에 목적어가 없고 by(~에 의해)가 있어 수동이 필요한데 능동 to부정사라 안 맞음.","having sectioned(구분하고 나서): 능동 완료형이라 목적어가 필요한데, 공동체는 구분되는 쪽이라 안 맞음."],"point":"능동 v-ing vs. 수동 p.p.","en":"We tend to study the human body in silos, each community sectioned from the others by its own specialised vocabulary.","ko":"우리는 각각의 공동체가 그것 자신의 전문적인 어휘에 의해 나머지 다른 것들과는 구분된 채, 인간의 신체를 개별적으로 분리해서 연구하는 경향이 있다.","hl":["each community sectioned","by its own specialised vocabulary"],"khl":["각각의 공동체가","구분된 채"],"blocks":[{"t":"p","h":"칸막이를 치는 쪽, 갇히는 쪽","x":["each community(각각의 공동체)가 이 분사의 주인이다.","공동체는 칸막이를 치는 쪽이 아니라 칸막이 안에 갇히는 쪽이다.","by its own specialised vocabulary(그 자신의 전문 어휘에 의해)가 \"누가 갈랐는지\"를 알려 준다.","by(~에 의해)가 보이면 수동, 그러니 p.p. sectioned(구분된)."]},{"t":"pair","h":"쉬운 예시","x":[["He sat there, his eyes filled with tears.","그는 눈에 눈물이 가득 찬 채 거기 앉아 있었다. (눈이 눈물로 채워짐 → filled(채워진))"],["She walked home, her bag held in her hand.","그녀는 가방을 손에 든 채 집에 걸어갔다. (가방이 들려 있음 → held(들린))"]]}],"post":["by(~에 의해) 보이면 p.p.: each community sectioned(각 공동체가 구분된 채)"]},{"slots":[["being","","","전치사 by(~함으로써) 뒤 동명사다."],["that_b","","","such ~ that(너무 ~해서 ...하다)의 that(그래서)이다."],["how","","","뒤가 완전한 문장이라 \"어떻게 ~하는지\"의 How(어떻게)가 맞다."],["becomes","become","a","주어는 How ... another(세포들이 서로 어떻게 소통하는지) 한 덩어리다. 명사절 주어는 단수 취급이라 s가 있어야 한다."],["to_be","","","too ~ to(너무 ~해서 ...할 수 없다) 구문의 to be(~이기에)다."]],"opts":["becoming","to become","becomes","have become"],"or":["becoming(~이 되는): -ing는 동사 자리에 못 와서 문장에 동사가 없어짐.","to become(~이 되는 것): to부정사도 동사 자리에 못 옴.","becomes(~이 되다, 3인칭 단수형): 명사절 주어는 한 덩어리 단수라 맞음.","have become(~이 되었다, 복수형): 명사절 주어는 단수라 have(가지다, 복수형)가 아니라 has(단수형)여야 함."],"point":"명사절 주어의 수일치","en":"How different types of cell communicate with one another becomes its own specialist topic.","ko":"다른 유형의 세포들이 서로 어떻게 소통하는지가 그 자체의 전문적인 주제가 된다.","hl":["How different types of cell communicate with one another","becomes"],"khl":["서로 어떻게 소통하는지가","된다"],"blocks":[{"t":"p","h":"한 상자에 담긴 주어","x":["How(어떻게)부터 another(다른 것)까지가 하나의 상자다.","상자 안에 types(유형들)라는 복수가 있어도 상자는 한 개.","상자 하나는 단수 취급이다.","그래서 동사는 becomes(~이 된다)."]},{"t":"pair","h":"쉬운 예시","x":[["What he said is true.","그가 말한 것은 사실이다. (명사절 한 덩어리 → is(~이다))"],["How the students study matters.","학생들이 어떻게 공부하는지가 중요하다. (students(학생들)가 있어도 → matters(중요하다))"]]}],"post":["명사절 주어(How(어떻게) ~ another(다른 것)) = 한 상자 = 단수 becomes(~이 된다)"]}],"quiz":[{"s":"She is good at ___ pictures.","o":["drawing","draw"],"a":0,"ko":"그녀는 그림을 잘 그린다.","why":"전치사 at(~에) 뒤는 동명사.","wy":"draw(그리다): 전치사 at(~에) 뒤에 동사원형은 못 옴."},{"s":"You can ___ find the key.","o":["easy","easily"],"a":1,"ko":"너는 그 열쇠를 쉽게 찾을 수 있다.","why":"동사 find(찾다)를 꾸미니 부사.","wy":"easy(쉬운): 형용사라 동사 find(찾다)를 꾸밀 수 없음."},{"s":"The boy ___ his bike every day.","o":["riding","rides"],"a":1,"ko":"그 소년은 매일 자전거를 탄다.","why":"문장에 동사가 하나 꼭 있어야 하니 rides(탄다).","wy":"riding(타는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐."},{"s":"I found a letter ___ in red ink.","o":["written","writing"],"a":0,"ko":"나는 빨간 잉크로 쓰인 편지를 발견했다.","why":"편지는 \"쓰이는\" 쪽이라 p.p.","wy":"writing(쓰는): 편지가 직접 글을 쓰는 게 아니라서 능동 -ing는 안 맞음."},{"s":"How he solved the problems ___ a secret.","o":["is","are"],"a":0,"ko":"그가 그 문제들을 어떻게 풀었는지는 비밀이다.","why":"How(어떻게)로 시작하는 명사절 주어는 단수.","wy":"are(~이다, 복수형): problems(문제들)에 속은 것. 주어는 명사절 한 덩어리라 단수."}]},{"items":[{"slots":[["that_a","what","a","앞에 the chemistry(화학)라는 명사가 있다. 명사를 꾸미려면 that(~하는). what(~하는 것)은 앞에 명사를 둘 수 없다."],["requires","","","every(모든)가 붙은 주어의 진짜 동사, 단수형이다."],["its","","","each community(각각의 공동체)를 받는 단수 소유격이다."],["communicate","","","복수 주어 different types of cell(다른 유형의 세포들)에 맞춘 동사다."],["complex","","","is(~이다) 뒤 보어 자리 형용사, much more(훨씬 더)가 꾸민다."]],"opts":["whose","that","whom","where"],"or":["whose(~의, 소유격): 바로 뒤에 꾸밀 명사가 와야 하는데 동사 underlies(기저에 있다)가 와서 안 됨.","that(~하는, 관계대명사): 선행사 the chemistry(화학) 뒤에서 주어가 빠진 절을 이끌어 맞음.","whom(~을, 목적격): 사람을 받는 목적격이라, 사물 선행사에 주어 자리가 빈 이 절에는 못 씀.","where(~하는 곳, 관계부사): 뒤에 완전한 문장이 와야 하는데 주어가 빠져 있어 안 됨."],"point":"that/which vs. what","en":"An expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities.","ko":"와인의 맛과 색의 전문가가 그러한 특성들의 기저에 있는 화학을 알게 됨으로써 많은 것을 획득한다.","hl":["the chemistry that underlies"],"khl":["기저에 있는 화학을"],"blocks":[{"t":"p","h":"what(~하는 것)은 명사를 이미 품고 있다","x":["what(~하는 것) = the thing that(~하는 것).","\"것\"이라는 명사가 이미 들어 있다.","그래서 앞에 the chemistry(화학) 같은 명사가 또 오면 명사가 두 번이 된다.","앞에 명사가 있고 뒤에 빈자리가 있으면 that(~하는)이나 which(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["I like the song that you sang.","나는 네가 부른 노래가 좋다. (명사 the song(노래) + that)"],["I like what you sang.","나는 네가 부른 것이 좋다. (명사 없이 what)"]]}],"post":["명사(the chemistry = 화학) + that(~하는) + 주어 빠진 절"]},{"slots":[["underlies","underlie","a","관계대명사 that(~하는)의 동사는 앞 선행사에 수를 맞춘다. 선행사 the chemistry(화학)는 단수."],["potentially","","","can(~할 수 있다)과 enhance(강화하다) 사이, 동사를 꾸미는 부사다."],["sectioned","","","공동체가 \"구분된\" 쪽이라 과거분사다."],["dedicated","","","be dedicated to(~에 전념하다)의 과거분사다."],["is","","","nobody(아무도 ~않다)는 단수 취급이다."]],"opts":["underlies","underlying","to underlie","underlain"],"or":["underlies(기저에 있다, 3인칭 단수형): 선행사 the chemistry(화학)가 단수라 맞음.","underlying(기저에 있는): 관계대명사 that(~하는) 뒤에는 진짜 동사가 와야 하는데 -ing는 동사 자리에 못 옴.","to underlie(기저에 있는 것): to부정사도 관계절의 동사 자리에 못 옴.","underlain(기저에 놓인, 과거분사형): be동사 없이 과거분사 혼자 동사가 될 수 없음."],"point":"주격 관계대명사절의 수일치","en":"An expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities.","ko":"와인의 맛과 색의 전문가가 그러한 특성들의 기저에 있는 화학을 알게 됨으로써 많은 것을 획득한다.","hl":["the chemistry that underlies","those qualities"],"khl":["기저에 있는 화학을","그러한 특성들의"],"blocks":[{"t":"p","h":"that(~하는) 앞을 돌아보기","x":["관계대명사 that(~하는)은 주어 자리를 대신한다.","그러니 that(~하는)의 동사는 that이 가리키는 말에 맞춘다.","that(~하는)이 가리키는 건 the chemistry(화학), 단수.","뒤에 있는 those qualities(그러한 특성들)는 목적어일 뿐이다.","단수 주인이니 underlies(기저에 있다)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a friend who lives in Seoul.","나는 서울에 사는 친구가 한 명 있다. (a friend(친구 한 명) → lives(산다))"],["I have friends who live in Seoul.","나는 서울에 사는 친구들이 있다. (friends(친구들) → live(산다))"]]}],"post":["that(~하는) 앞 단수 선행사(the chemistry = 화학) → underlies(기저에 있다)"]},{"slots":[["enhance","","","can(~할 수 있다) 뒤 동사원형이다."],["to_happen","happening","a","tend(~하는 경향이 있다)는 뒤에 to부정사만 받는다. not(~않다)은 to 앞에 붙는다."],["how","","","뒤가 완전한 문장이라 How(어떻게)가 맞다."],["studied","","","생명체가 \"연구되는\" 수동이다."],["that_c","","","commented(논평했다)의 목적어, 뒤가 완전해서 that(~라고)이다."]],"opts":["happen","happened","to be happened","to happen"],"or":["happen(일어나다): tends(경향이 있다)라는 동사 뒤에 동사원형이 또 올 수 없음.","happened(일어났다): tends(경향이 있다) 뒤에 과거형 동사가 또 올 수 없음.","to be happened(일어나게 되는 것): happen(일어나다)은 목적어를 안 받는 동사라 수동태가 없음.","to happen(일어나는 것): tend(~하는 경향이 있다) 뒤에는 to부정사가 와서 맞음."],"point":"동명사 vs. to부정사 목적어","en":"Every scientific tool ... requires such depth of expertise that this tends not to happen.","ko":"모든 과학적 도구는 너무 깊은 전문 지식을 요구해서 이런 일은 잘 일어나지 않는 경향이 있다.","hl":["tends not to happen"],"khl":["잘 일어나지 않는 경향이 있다"],"blocks":[{"t":"p","h":"to를 좋아하는 동사","x":["tend(~하는 경향이 있다)는 앞으로의 방향을 가리키는 동사다.","이런 동사는 뒤에 to부정사를 데려온다.","같은 지문 뒤에도 we tend to study(우리는 연구하는 경향이 있다)가 나온다.","부정할 땐 not(~않다)을 to 바로 앞에: tends not to happen(일어나지 않는 경향이 있다)."]},{"t":"pair","h":"쉬운 예시","x":[["He tends to sleep late.","그는 늦게 자는 경향이 있다. (tend + to sleep(자는 것))"],["I decided not to go.","나는 가지 않기로 했다. (not(~않다) + to go(가는 것))"]]},{"t":"p","h":"-ing만 받는 동사와 구별","x":["enjoy(즐기다), finish(끝내다), keep(계속하다)은 -ing를 받는다.","want(원하다), decide(결정하다), tend(~하는 경향이 있다)는 to부정사를 받는다."]}],"post":["tend(~하는 경향이 있다) + not(~않다) + to 동사원형: tends not to happen(일어나지 않는 경향이 있다)"]},{"slots":[["being","","","전치사 by(~함으로써) 뒤 동명사다."],["that_b","","","such ~ that(너무 ~해서 ...하다)의 that(그래서)이다."],["communicate","communicates","a","주어는 different types of cell(다른 유형의 세포들)이다. 중심 단어 types(유형들)가 복수라 s를 붙이면 안 된다."],["evidently","","","문장에 \"분명히\"라는 뜻을 더하는 부사다."],["to_be","","","too ~ to(너무 ~해서 ...할 수 없다)의 to be(~이기에)다."]],"opts":["communicating","to communicate","communicate","has communicated"],"or":["communicating(소통하는): How(어떻게) 뒤 명사절에도 진짜 동사가 필요한데 -ing는 동사 자리에 못 옴.","to communicate(소통하는 것): 주어 different types of cell(다른 유형의 세포들)이 있는데 뒤에 to부정사가 오면 동사가 없어짐.","communicate(소통하다): 명사절 속 주어 types(유형들)가 복수라 s 없는 현재형이 맞음.","has communicated(소통해 왔다, 단수형): has(가지다, 단수형)는 복수 주어 types(유형들)와 안 맞음."],"point":"수식받는 주어의 수일치","en":"How different types of cell communicate with one another becomes its own specialist topic.","ko":"다른 유형의 세포들이 서로 어떻게 소통하는지가 그 자체의 전문적인 주제가 된다.","hl":["different types of cell communicate"],"khl":["다른 유형의 세포들이","소통하는지가"],"blocks":[{"t":"p","h":"주인은 types(유형들)","x":["different types of cell(다른 유형의 세포들)에서 중심 단어는 types(유형들).","of cell(세포의)은 꼬리표다.","cell(세포)이 단수처럼 보여도 꼬리표라 속으면 안 된다.","주인 types(유형들)가 복수라 communicate(소통하다)."]},{"t":"p","h":"상자 안과 밖은 따로","x":["상자 안(명사절) 동사: communicate(소통하다), 주인은 types(유형들).","상자 밖 동사: becomes(~이 되다), 주인은 상자 전체.","안은 복수, 밖은 단수. 둘을 섞으면 틀린다."]},{"t":"pair","h":"쉬운 예시","x":[["Many kinds of fish live here.","많은 종류의 물고기가 여기 산다. (주인 kinds(종류들) → live(산다))"],["A box of apples is on the table.","사과 한 상자가 탁자 위에 있다. (주인 A box(한 상자) → is(있다))"]]}],"post":["꼬리표(of cell = 세포의) 떼고 주인(types = 유형들) → communicate(소통하다)"]},{"slots":[["that_a","","","선행사 the chemistry(화학) 뒤 주어가 빠진 관계절이다."],["requires","","","every(모든)가 붙은 주어의 진짜 동사다."],["becomes","","","명사절 주어 한 덩어리라 단수형이다."],["evidently","evident","a","the human body is ... much more complex(인간의 신체는 훨씬 더 복잡하다)에 \"분명히\"를 더하는 자리. 보어는 complex(복잡한)가 이미 차지했다."],["is","","","nobody(아무도 ~않다)는 단수 취급이다."]],"opts":["evidently","evidence","evidences","evidencing"],"or":["evidently(분명히): 보어 complex(복잡한)가 이미 있어 문장에 뜻을 더하는 부사가 맞음.","evidence(증거): 명사라 is(~이다) 뒤에 오면 보어가 둘이 되어 문장이 깨짐.","evidences(증거들, 증명하다): 명사 복수나 동사라 is(~이다)와 much more complex(훨씬 더 복잡한) 사이에 못 옴.","evidencing(증명하는): -ing형이라 is(~이다) 뒤에 두면 진행형이 되는데 뒤에 목적어가 아닌 형용사가 와서 안 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"Even simple forms of life on Earth are now rarely studied as a whole, and the human body is evidently much more complex.","ko":"심지어 지구상에 있는 단순한 형태의 생명체조차도 이제는 전체로서 탐구되는 경우가 드물며, 인간의 신체는 분명히 훨씬 더 복잡하다.","hl":["is evidently much more complex"],"khl":["분명히 훨씬 더 복잡하다"],"blocks":[{"t":"p","h":"의자는 하나뿐","x":["be동사 is(~이다) 뒤에는 보어 의자가 하나 있다.","그 의자에는 이미 complex(복잡한)가 앉아 있다.","evident(분명한)까지 앉으면 형용사 둘이 의자 하나를 다툰다.","그래서 끼어드는 말은 부사 evidently(분명히)."]},{"t":"pair","h":"쉬운 예시","x":[["She is clearly happy.","그녀는 분명히 행복하다. (보어 happy(행복한) + 부사 clearly(분명히))"],["It is clear.","그것은 분명하다. (보어 자리 하나 → 형용사 clear(분명한))"]]}],"post":["보어(complex = 복잡한) 있으면 끼어드는 말은 -ly: is evidently complex(분명히 복잡하다)"]}],"quiz":[{"s":"This is the bag ___ I bought yesterday.","o":["what","that"],"a":1,"ko":"이것은 내가 어제 산 가방이다.","why":"앞에 명사 the bag(가방)이 있으니 that(~하는).","wy":"what(~하는 것): 이미 명사를 품고 있어 앞에 the bag(가방)이 또 올 수 없음."},{"s":"I have a friend who ___ in London.","o":["lives","live"],"a":0,"ko":"나는 런던에 사는 친구가 한 명 있다.","why":"선행사 a friend(친구 한 명)가 단수라 lives(산다).","wy":"live(살다): 복수 주어용이라 단수 선행사 a friend(친구 한 명)와 안 맞음."},{"s":"She decided ___ home early.","o":["to go","going"],"a":0,"ko":"그녀는 집에 일찍 가기로 결정했다.","why":"decide(결정하다)는 to부정사를 받는다.","wy":"going(가는 것): decide(결정하다)는 -ing를 목적어로 받지 않음."},{"s":"The boxes on the table ___ heavy."," ~라고)이다."],["to_be","being","a","too ~ to(너무 ~해서 ...할 수 없다)는 짝이 정해진 구문이다. too(너무) 뒤에는 to부정사가 와야 한다."]],"opts":["to be","be","been","to being"],"or":["to be(~이기에): too ~ to(너무 ~해서 ...할 수 없다) 구문이라 to부정사가 맞음.","be(~이다): too vast(너무 방대한) 뒤에 동사원형이 혼자 올 수 없음.","been(~였던, 과거분사형): too ~ to(너무 ~해서 ...할 수 없다) 자리에 과거분사는 못 옴.","to being(~인 것으로): 여기 to는 전치사가 아니라 to부정사의 to라서 동사원형이 와야 함."],"point":"too ~ to 구문","en":"As long ago as 1890, The Times newspaper commented that knowledge 'had already become too vast to be manageable'.","ko":"오래전인 1890년에도 'The Times' 신문은 지식이 '이미 너무 방대해져서 다루기 어렵게 되었다'라고 논평했다.","hl":["too vast to be manageable"],"khl":["너무 방대해져서 다루기 어렵게"],"blocks":[{"t":"p","h":"too(너무)는 브레이크","x":["too(너무) + 형용사 + to 동사원형 = 너무 ~해서 ...할 수 없다.","too vast(너무 방대한) → to be manageable(다룰 수 있기에).","합치면 \"너무 방대해서 다룰 수 없다\".","too(너무)가 브레이크를 걸어 뒤의 일이 일어나지 못하게 한다.","to 다음엔 동사원형 be(~이다)."]},{"t":"pair","h":"쉬운 예시","x":[["He is too young to drive.","그는 너무 어려서 운전할 수 없다. (too ~ to drive(운전하기에))"],["The box is too heavy to lift.","그 상자는 너무 무거워서 들 수 없다. (too ~ to lift(들기에))"]]}],"post":["too(너무) + 형용사 + to 동사원형: too vast to be manageable(너무 방대해서 다룰 수 없는)"]}],"compquiz":[{"s":"It was such a cold day ___ we stayed home.","o":["which","that"],"a":1,"ko":"너무 추운 날이라서 우리는 집에 있었다.","why":"such ~ that(너무 ~해서 ...하다) 짝, 뒤가 완전한 문장.","wy":"which(~하는): 뒤에 빈자리가 있어야 하는데 we stayed home(우리는 집에 있었다)은 완전함."},{"s":"He is too sick ___ to school.","o":["to go","going"],"a":0,"ko":"그는 너무 아파서 학교에 갈 수 없다.","why":"too ~ to(너무 ~해서 ...할 수 없다) 구문.","wy":"going(가는 것): too(너무) 뒤 짝은 to부정사라 -ing는 못 옴."}]},{"id":"2510g2-33","no":"33","title":"어법특훈 · 25년 10월 고2 33번","sub":"궁전의 유리가 만든 권력","tpl":"Historically, palaces weren't just homes; they were {carefully|carefully} constructed stages {designed|designed} {to_impress|to impress} and {intimidate|intimidate}. {while|While} stone {symbolized|symbolized} permanence and strength, glass offered something {equally|equally} powerful: visibility. The introduction of large windows in palaces {allowed|allowed} rulers to literally look down upon their subjects, {emphasizing|emphasizing} their elevated position. Conversely, it also allowed subjects {to_gaze|to gaze} up at their leaders, creating a sense of awe and distance. Consider the Palace of Versailles: its Hall of Mirrors, {lined|lined} with reflective surfaces, not only {magnified|magnified} the grandeur of the space but also {placed|placed} the king at the center of a dazzling display, {reinforcing|reinforcing} his absolute authority. The use of glass in palaces {wasnt|wasn't} merely {aesthetic|aesthetic}; it was strategic. Open sightlines allowed for better surveillance and control, ensuring the safety and security of the ruling family. Courtiers and visitors were constantly aware of {being_observed|being observed}, {contributing|contributing} to an atmosphere of careful obedience and respect. The very architecture {dictated|dictated} social behavior, with glass {acting|acting} as a silent enforcer of the power dynamic.","fn":["*intimidate: 위협하다, 겁을 주다","*courtier: (궁정의) 신하","*enforcer: 집행자"],"mean":{"carefully":"주의 깊게(부사)","careful":"주의 깊은(형용사)","care":"주의, 돌봄(명사) / 신경 쓰다(동사)","carefulness":"주의 깊음(명사)","cared":"신경 썼다(care의 과거형·과거분사형)","designed":"설계된(design의 과거분사형)","to impress":"깊은 인상을 주기 위해(impress의 to부정사)","intimidate":"위협하다(동사원형)","While":"~하는 반면, ~하는 동안(접속사, 뒤에 주어+동사)","During":"~ 동안(전치사, 뒤에 명사)","Despite":"~에도 불구하고(전치사, 뒤에 명사)","Because of":"~ 때문에(전치사, 뒤에 명사)","In spite of":"~에도 불구하고(전치사, 뒤에 명사)","symbolized":"상징했다(symbolize의 과거형)","equally":"동등하게(부사)","equal":"동등한(형용사)","equality":"평등, 동등함(명사)","equals":"~와 같다(equal의 3인칭 단수 현재형) / 대등한 사람들(복수 명사)","equaled":"~와 같았다(equal의 과거형·과거분사형)","allowed":"허락했다, ~하게 해 주었다(allow의 과거형)","allowing":"~하게 해 주는(allow의 -ing형)","to allow":"허락하는 것(allow의 to부정사)","having allowed":"허락하고 나서(allow의 완료 -ing형)","being allowed":"허락받는(allow의 수동 -ing형)","emphasizing":"강조하면서(emphasize의 -ing형, 분사구문)","emphasized":"강조된(emphasize의 과거분사형) / 강조했다(과거형)","emphasizes": ,"형용사 powerful(강력한)을 꾸미는 부사다."],["reinforcing","","","콤마 뒤 \"강화하면서\"를 덧붙이는 분사구문, 뒤에 목적어 his absolute authority(그의 절대 권위)가 있다."],["aesthetic","","","wasn't(~이 아니었다) 뒤 보어 자리라 형용사 aesthetic(미적인)이 맞다."]],"opts":["While","Despite","Because of","In spite of"],"or":["While(~하는 반면, 접속사): 뒤에 주어 stone(돌) + 동사 symbolized(상징했다)가 와서 맞음.","Despite(~에도 불구하고): 전치사라 뒤에 주어 + 동사의 문장이 올 수 없음.","Because of(~ 때문에): 전치사 덩어리라 뒤에 문장이 올 수 없고 뜻도 안 맞음.","In spite of(~에도 불구하고): 전치사 덩어리라 뒤에 문장이 올 수 없음."],"point":"접속사 vs. 전치사","en":"While stone symbolized permanence and strength, glass offered something equally powerful: visibility.","ko":"돌은 영속성과 힘을 상징했고, 유리는 동등하게 강력한 어떤 것, 즉 가시성을 제공했다.","hl":["While stone symbolized"],"khl":["돌은 영속성과 힘을 상징했고"],"blocks":[{"t":"p","h":"뒤에 오는 손님 보기","x":["접속사는 문장(주어 + 동사)을 손님으로 받는다.","전치사는 명사만 손님으로 받는다.","While(~하는 반면) 뒤 손님: stone(돌) + symbolized(상징했다). 문장이다.","그래서 접속사 While(~하는 반면). 전치사 During(~ 동안)은 못 받는다.","돌과 유리를 맞세우는 \"반면\"의 뜻이다."]},{"t":"pair","h":"쉬운 예시","x":[["While I was sleeping, it rained.","내가 자는 동안 비가 왔다. (While(~하는 동안) + 주어 + 동사)"],["During the night, it rained.","밤 동안 비가 왔다. (During(~ 동안) + 명사 the night(밤))"]]}],"post":["주어 + 동사 받으면 접속사: While(~하는 반면) stone symbolized(돌은 상징했다)"]},{"slots":[["intimidate","","","to impress and (to) intimidate(인상을 주고 위협하기 위해). to 뒤 동사원형이 and(그리고)로 나란하다."],["allowed","","","주어 The introduction(도입)의 진짜 동사, 과거형이다."],["to_gaze","gazing","a","allow(~하게 해 주다) + 사람 + to부정사. 앞 문장의 allowed rulers to look(통치자들이 내려다보게 했다)과 같은 틀이다."],["wasnt","","","주어 The use(용도)가 단수라 wasn't(~이 아니었다)가 맞다."],["acting","","","with(~하면서) + glass(유리) + 분사. 유리가 역할을 \"하는\" 쪽이라 -ing다."]],"opts":["gaze","to gaze","gazed","to gazing"],"or":["gaze(바라보다): allow(~하게 해 주다)는 사역동사가 아니라 to 없는 동사원형을 받지 않음.","to gaze(바라보는 것): allow(~하게 해 주다) + 목적어 뒤는 to부정사라 맞음.","gazed(바라보았다, 과거·과거분사형): 국민들이 직접 바라보는 능동이고, 목적어 뒤 자리라 과거형도 못 옴.","to gazing(바라보는 것으로): allow(~하게 해 주다) 뒤 to는 to부정사의 to라 동사원형이 와야 함."],"point":"목적격보어(준동사)","en":"Conversely, it also allowed subjects to gaze up at their leaders, creating a sense of awe and distance.","ko":"반대로 그것은 또한 국민들이 자신들의 통치자를 '위로' 올려다보게 했고, 경외심과 거리감을 만들어 냈다.","hl":["allowed subjects to gaze up"],"khl":["올려다보게 했고"],"blocks":[{"t":"p","h":"allow(~하게 해 주다)는 to와 한 세트","x":["allow(~하게 해 주다) + 사람 + to 동사원형.","allowed subjects to gaze up(국민들이 올려다보게 했다) = 국민들이 올려다보게 했다.","make(만들다), let(허락하다), have(시키다)만 to 없이 원형을 받는다.","allow(~하게 해 주다)는 그 셋이 아니라서 to가 꼭 있어야 한다.","같은 지문의 allowed rulers to look(통치자들이 내려다보게 했다)과 짝을 이룬다."]},{"t":"pair","h":"쉬운 예시","x":[["My mom allowed me to play outside.","엄마는 내가 밖에서 놀게 해 주셨다. (allow + me + to play(노는 것))"],["Let me go.","나를 가게 해 줘. (let(허락하다)은 to 없이 원형)"]]}],"post":["allow(~하게 해 주다) + 사람 + to 동사원형: allowed subjects to gaze(국민들이 바라보게 했다)"]},{"slots":[["carefully","","","분사 constructed(건설된)를 꾸미는 부사다."],["emphasizing","","","콤마 뒤 \"강조하면서\"를 덧붙이는 분사구문, 뒤에 목적어가 있어 능동 -ing다."],["lined","","","거울의 방이 반사 표면으로 \"덮인\" 쪽이라 과거분사다."],["placed","placing","a","not only A but also B(A뿐만 아니라 B도). A 자리가 동사 magnified(확대했다)이니 B도 같은 과거형 동사여야 한다."],["being_observed","","","전치사 of(~을) 뒤, 신하들이 \"관찰되는\" 쪽이라 수동 동명사다."]],"opts":["to place","having placed","placed","being placed"],"or":["to place(두는 것): magnified(확대했다)는 동사인데 짝이 to부정사라 모양이 안 맞음.","having placed(두고 나서): -ing형이라 동사 magnified(확대했다)와 짝을 이룰 수 없음.","placed(두었다): not only magnified(확대했을 뿐만 아니라)와 나란한 과거형 동사라 맞음.","being placed(놓이는): -ing형이라 짝이 안 맞고, 뒤에 목적어 the king(왕)이 있어 수동도 안 맞음."],"point":"병렬구조","en":"Its Hall of Mirrors, lined with reflective surfaces, not only magnified the grandeur of the space but also placed the king at the center of a dazzling display.","ko":"반사되는 표면들로 일렬로 둘러싸인 그것의 거울의 방은 공간의 웅장함을 증대시켰을 뿐 아니라, 왕을 눈부신 장식의 중심에 두었다.","hl":["not only magnified","but also placed"],"khl":["증대시켰을 뿐 아니라","두었다"],"blocks":[{"t":"p","h":"not only A but also B는 저울","x":["not only(~뿐만 아니라) 쪽 접시: magnified(확대했다).","but also(~도) 쪽 접시: placed(두었다).","왼쪽이 과거형 동사면 오른쪽도 과거형 동사.","placing(두는)을 올리면 저울이 기운다.","주인은 둘 다 its Hall of Mirrors(그것의 거울의 방)."]},{"t":"pair","h":"쉬운 예시","x":[["She not only sings but also dances.","그녀는 노래할 뿐만 아니라 춤도 춘다. (sings ↔ dances(춤춘다))"],["He not only cleaned the room but also washed the dishes.","그는 방을 청소했을 뿐만 아니라 설거지도 했다. (cleaned ↔ washed(씻었다))"]]}],"post":["not only magnified(확대했을 뿐만 아니라) but also placed(두기도 했다): 같은 과거형"]},{"slots":[["while","","","뒤에 주어 + 동사가 오는 접속사 While(~하는 반면)이다."],["to_gaze","","","allow(~하게 해 주다) + 사람 + to부정사다."],["magnified","","","not only(~뿐만 아니라) 뒤의 과거형 동사다."],["contributing","","","콤마 뒤 분사구문, \"~에 기여하면서\"."],["dictated","dictating","a","주어 The very architecture(건축물 그 자체) 뒤에 진짜 동사가 필요하다. with(~하면서) 이하는 덧붙임일 뿐이다."]],"opts":["to dictate","having dictated","dictated","being dictated"],"or":["to dictate(좌우하는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","having dictated(좌우하고 나서): 완료 -ing형이라 동사 자리에 못 옴.","dictated(좌우했다): 주어 The very architecture(건축물 그 자체)의 진짜 동사, 과거형이라 맞음.","being dictated(좌우되는): -ing형이라 동사 자리에 못 오고, 뒤에 목적어 social behavior(사회적 행동)가 있어 수동도 안 맞음."],"point":"정동사 vs. 준동사","en":"The very architecture dictated social behavior, with glass acting as a silent enforcer of the power dynamic.","ko":"유리가 권력 역학 관계의 조용한 집행자로서 역할을 하면서 건축물 그 자체가 사회적 행동을 지배했다.","hl":["The very architecture dictated"],"khl":["건축물 그 자체가","지배했다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["문장 하나에는 진짜 동사가 꼭 하나 있어야 한다.","with glass acting(유리가 역할을 하면서)은 덧붙임이라 동사로 안 센다.","남은 자리 중 동사 후보는 dictated(지배했다) 하나뿐.","dictating(지배하는)으로 바꾸면 동사가 0개가 된다.","the very(바로 그)는 \"건축물 그 자체가\"라고 강조하는 말이다."]},{"t":"pair","h":"쉬운 예시","x":[["The dog ate my lunch, with its tail wagging.","개가 꼬리를 흔들면서 내 점심을 먹었다. (진짜 동사 ate(먹었다))"],["My little brother broke the cup.","내 남동생이 컵을 깼다. (진짜 동사 broke(깼다))"]]}],"post":["덧붙임(with(~하면서) ~) 빼고 진짜 동사 하나: architecture dictated(건축물이 지배했다)"]}],"quiz":[{"s":"This is a ___ written letter.","o":["beautiful","beautifully"],"a":1,"ko":"이것은 아름답게 쓰인 편지다.","why":"분사 written(쓰인)을 꾸미니 부사.","wy":"beautiful(아름다운): 형용사라 분사 written(쓰인)을 꾸밀 수 없음."},{"s":"___ I was sleeping, my phone rang.","o":["While","D )","fly":"날다(동사원형)","flies":"날다(fly의 3인칭 단수 현재형)","was":"~였다(be의 과거형, 단수 주어)","were":"~였다(be의 과거형, 복수 주어)","use":"사용하다(동사원형)","uses":"사용하다(use의 3인칭 단수 현재형)","wake":"깨다(동사원형)","waking":"깨는 것(wake의 -ing형, 동명사)","happy":"행복한(형용사)","rises":"뜨다(rise의 3인칭 단수 현재형)","rising":"뜨는 것, 뜨는(rise의 -ing형)","playing":"노는(play의 -ing형)","plays":"놀다(play의 3인칭 단수 현재형)","happily":"행복하게(부사)"},"sets":[{"items":[{"slots":[["consider","Considering","a","문장 맨 앞 자리. 이 문장에는 다른 동사가 없어서 명령문 동사원형 Consider(고려해 보라)가 꼭 있어야 한다."],["descriptive","","","명사 device(장치)를 앞에서 꾸미니까 형용사 descriptive(서술하는)가 맞다."],["using","","","전치사 with(~에) 뒤라서 동명사 using(사용하는 것)이 맞다."],["be_given","","","거리는 누군가에 의해 \"제시되는\" 쪽이라 can be given(제시될 수 있다), 수동이 맞다."],["does","","","주어 physics(물리학)는 -s로 끝나도 단수라 does not(~하지 않는다)이 맞다."]],"opts":["Consider","Considered","To consider","Having considered"],"or":["Consider(고려해 보라): 다른 동사가 없는 문장이라 명령문 동사원형이 진짜 동사 역할을 해서 맞음.","Considered(고려했다, 고려된): 주어 없이 과거형만 오면 누가 했는지 없고, 과거분사로 읽으면 문장에 진짜 동사가 없어짐.","To consider(고려하는 것, 고려하기 위해): to부정사는 진짜 동사가 아니라서 문장이 동사 없이 끝나 버림.","Having considered(고려하고 나서): 완료 -ing형도 진짜 동사가 아니라 문장에 동사가 하나도 없게 됨."],"point":"정동사 vs. 준동사","en":"Consider units of measure, one kind of descriptive device we are familiar with using in physics.","ko":"우리가 물리학에서 사용하는 것으로 익숙한 서술 장치의 한 종류인 측정 단위들을 고려해 보라.","hl":["Consider"],"khl":["고려해 보라"],"blocks":[{"t":"p","h":"이 문장의 동사를 찾아라","x":["units of measure(측정 단위들)부터 physics(물리학)까지 전부 명사 덩어리다.","we are familiar with(우리가 익숙한)는 device(장치)를 꾸미는 작은 문장일 뿐이다.","큰 문장의 진짜 동사는 맨 앞 Consider(고려해 보라) 하나뿐.","이걸 Considering(고려하면서)으로 바꾸면 동사가 0개가 된다.","주어 없이 동사원형으로 시작하면 \"~해라\"라는 명령문이다."]},{"t":"pair","h":"명령문은 동사원형으로 시작","x":[["Look at the sky.","하늘을 봐라. (동사원형 Look(봐라)으로 시작)"],["Think about your answer.","네 답을 생각해 봐라. (Thinking(생각하면서)으로 쓰면 문장이 안 됨)"]]}],"post":["주어 없는 첫 자리 = 명령문 동사원형: Consider(고려해 보라)"]},{"slots":[["depending","","","any feature(어떤 특성이든)를 뒤에서 꾸미는 -ing다. 진짜 동사는 뒤의 is(~이다)."],["assigned","","","수치는 거리에 \"할당되는\" 쪽이라 과거분사 assigned(할당된)가 맞다."],["is1","are","a","주인은 any feature(어떤 특성이든), 단수다. 바로 앞 locations(지점들)는 꼬리표 속 단어일 뿐."],["likewise","","","\"마찬가지로\"라는 뜻으로 문장 전체를 꾸미는 부사다."],["changes","","","주어 nothing(아무것도 ~않다)은 단수라 changes(바뀌다)가 맞다."]],"opts":["be","is","being","been"],"or":["be(~이다, 원형): 주어 바로 뒤 동사 자리에 원형은 못 옴.","is(~이다): 주어 any feature(어떤 특성이든)가 단수라 단수 현재형 동사가 맞음.","being(~인 것): -ing형은 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","been(~였던): 과거분사는 have(가지다) 없이 혼자 동사가 될 수 없음."],"point":"수식받는 주어의 수일치","en":"We further conclude that any feature depending on that choice, such as the particular numerical value assigned to the spatial separation between two locations, is not out there in the world apart from a choice of unit.","ko":"우리는 더 나아가 두 지점 사이의 공간적 분리에 할당된 특정한 수치적 값과 같이 그 선택에 의존하는 어떠한 특성도 단위의 선택과 분리되어 세상 어딘가에 존재하는 것이 아니라고 결론짓는다.","hl":["any feature","is not"],"khl":["어떠한 특성도","존재하는 것이 아니라고"],"blocks":[{"t":"p","h":"긴 꼬리표는 괄호로 묶어 본다","x":["주인: any feature(어떤 특성이든).","꼬리표 1: depending on that choice(그 선택에 의존하는).","꼬리표 2: such as(~와 같은) ... between two locations(두 지점 사이의).","꼬리표를 괄호로 묶어 지우면 any feature(어떤 특성이든) ... is not(~이 아니다)만 남는다.","동사 바로 앞 locations(지점들)가 복수라고 are(~이다)로 속으면 안 된다."]},{"t":"pair","h":"쉬운 예시","x":[["The key to the doors is on the table.","그 문들의 열쇠는 탁자 위에 있다. (주인 The key(열쇠) → is(~이다))"],["A box of apples is heavy.","사과 한 상자는 무겁다. (주인 A box(상자) → is(~이다))"]]},{"t":"tap","h":"확인 질문","q":"is not(~이 아니다)의 진짜 주인은 어디서 시작하나?","a":["that(~라는) 바로 뒤의 any feature(어떤 특성이든).","콤마 사이 such as(~와 같은) 부분은 통째로 꼬리표다."]}],"post":["꼬리표 떼고 주인 any feature(어떤 특성) → is(~이다), locations(지점들)에 속지 않기"]},{"slots":[["switch","","","when(~할 때) 뒤 작은 문장의 동사다. 주어 we(우리)라 switch(바꾸다)가 맞다."],["that1","what","a","conclude(결론짓다)의 목적어 자리. 뒤 문장이 빠진 것 없이 완전하니 what(~하는 것)이 아니라 that(~라는 것)."],["arbitrary","","","명사 choice(선택)를 꾸미니 형용사 arbitrary(임의적인)가 맞다."],["that2","","","and(그리고) 앞의 that(~라는 것)과 나란히 conclude(결론짓다)의 두 번째 내용을 이끈다."],["depends2","","","선행사 any feature(어떤 특성이든)가 단수라 관계절 동사도 depends(의존하다)."]],"opts":["which","whose","whom","that"],"or":["which(어느 것, ~하는): 의문사로 읽어도 관계대명사로 읽어도 뒤에 빈자리가 있어야 하는데 완전한 문장임.","whose(~의): 뒤에 꾸밀 명사가 바로 와야 하고, 동사 conclude(결론짓다)의 목적어 덩어리를 만들 수 없음.","whom(~을 (사람)): 사람 목적어가 빠진 자리를 받는 말인데 뒤 문장에 빠진 것이 없음.","that(~라는 것, 접속사): 뒤 문장(척도의 선택은 임의적 선택이다)이 완전해서 맞음."],"point":"that vs. what","en":"We conclude that the choice of scale is an arbitrary choice in description, and that any feature that depends on that choice is scale-dependent.","ko":"우리는 척도의 선택이 서술상의 임의적인 선택이며, 그 선택에 의존하는 어떤 특성이든 척도에 의존한다는 결론을 내린다.","hl":["conclude that","the choice of scale is an arbitrary choice"],"khl":["결론을 내린다","척도의 선택이 서술상의 임의적인 선택이며"],"blocks":[{"t":"p","h":"뒤를 보고 빈 칸 검사","x":["what(~하는 것)은 뒤 문장에 구멍(빠진 주어나 목적어)이 있어야 쓴다.","that(~라는 것)은 뒤 문장이 꽉 찬 완전한 문장일 때 쓴다.","the choice of scale(척도의 선택) = 주어, is(~이다) = 동사, an arbitrary choice(임의적인 선택) = 보어.","빠진 것이 없으니 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I think that he is kind.","나는 그가 친절하다고 생각한다. (뒤가 완전 → that)"],["I know what you want.","나는 네가 원하는 것을 안다. (want(원하다)의 목적어가 빠짐 → what)"]]}],"post":["뒤가 꽉 찬 문장이면 that(~라는 것): conclude that(~라고 결론짓다) + 완전한 문장"]},{"slots":[["descriptive","","","명사 device(장치)를 꾸미는 형용사다."],["using","to use","a","with(~에)는 전치사. 전치사 뒤에 동사를 쓰려면 -ing(동명사)여야 한다."],["regardless","","","\"그와 상관없이\"라는 뜻의 부사로 문장 끝에서 혼자 쓰였다."],["assigned","","","값이 \"할당되는\" 쪽이라 과거분사."],["changes","","","주어 nothing(아무것도 ~않다)은 단수."]],"opts":["used","be used","been using","using"],"or":["used(사용했다, 사용된): 과거형이나 과거분사는 전치사 with(~에)의 목적어가 될 수 없음.","be used(사용되다): 원형 be(~이다)로 시작하는 덩어리는 전치사 뒤에 못 옴.","been using(사용해 오고 있는): have(가지다) 없이 혼자 쓸 수 없는 조각이라 전치사 뒤에 못 옴.","using(사용하는 것): 전치사 with(~에) 뒤라 동명사가 맞음."],"point":"전치사 + 동명사","en":"Consider units of measure, one kind of descriptive device we are familiar with using in physics.","ko":"우리가 물리학에서 사용하는 것으로 익숙한 서술 장치의 한 종류인 측정 단위들을 고려해 보라.","hl":["familiar with using"],"khl":["사용하는 것으로 익숙한"],"blocks":[{"t":"p","h":"전치사 뒤는 명사 손님만","x":["be familiar with(~에 익숙하다)의 with(~에)는 전치사다.","전치사 뒤에는 명사만 앉을 수 있다.","동사 use(사용하다)를 앉히려면 명사 옷 -ing를 입혀 using(사용하는 것)으로.","to use(사용하는 것)는 to가 겹쳐 전치사 뒤에 못 앉는다."]},{"t":"pair","h":"쉬운 예시","x":[["I am good at drawing.","나는 그림 그리는 것을 잘한다. (at drawing = 전치사 + -ing)"],["She is familiar with cooking.","그녀는 요리하는 것에 익숙하다. (with cooking = 전치사 + -ing)"]]}],"post":["be familiar with(~에 익숙하다) + -ing: with using(사용하는 것에)"]},{"slots":[["does","","","주어 physics(물리학)는 단수라 does not(~하지 않는다)."],["depending","","","any feature(어떤 특성이든)를 꾸미는 -ing. 특성이 선택에 \"의존하는\" 쪽이다."],["assigned","assigning","a","값은 스스로 할당하는 게 아니라 거리에 \"할당되는\" 쪽이다. 그래서 과거분사 assigned(할당된)."],["that1","","","conclude(결론짓다) 뒤에 완전한 문장을 이끄는 that(~라는 것)."],["that3","","","선행사 any feature(어떤 특성이든)를 받고 뒤에 주어가 빠진 관계대명사 that(~하는)."]],"opts":["assigns","to assigning","assigned","is assigned"],"or":["assigns(할당하다): 진짜 동사라 접속사 없이 동사가 하나 더 생기고, 뒤에 할당할 대상도 없음.","to assigning(할당하는 것으로): 명사 value(값) 바로 뒤에서 이런 꼴로 꾸밀 수 없음.","assigned(할당된): 값이 할당\"되는\" 쪽이라 과거분사로 명사를 꾸미는 게 맞음.","is assigned(할당된다): 진짜 동사라 such as(~와 같은) 뒤 명사 덩어리 안에 접속사 없이 들어갈 수 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"such as the particular numerical value assigned to the spatial separation between two locations","ko":"두 지점 사이의 공간적 분리에 할당된 특정한 수치적 값과 같이","hl":["value assigned"],"khl":["할당된 특정한 수치적 값"],"blocks":[{"t":"p","h":"하는 쪽인가, 당하는 쪽인가","x":["꾸밈을 받는 명사 value(값)를 주인으로 놓고 묻는다.","값이 무언가를 할당하나? 아니다.","사람이 값을 거리에 할당한다. 값은 \"할당되는\" 쪽.","당하는 쪽이면 p.p.(과거분사), 하는 쪽이면 -ing.","assigning(할당하는)이면 뒤에 할당할 대상(목적어)이 있어야 하는데 바로 to(~에)가 온다."]},{"t":"pair","h":"쉬운 예시","x":[["Look at the window broken by the ball.","공에 깨진 창문을 봐라. (창문은 깨지는 쪽 → broken(깨진))"],["The boy reading a book is my brother.","책을 읽고 있는 소년은 내 동생이다. (소년이 읽는 쪽 → reading(읽는))"]]}],"post":["값은 할당되는 쪽 → value assigned to(~에 할당된 값)"]}],"quiz":[{"s":"___ the door, please.","o":["Opening","Open"],"a":1,"ko":"문 좀 열어 주세요.","why":"주어 없는 명령문은 동사원형 Open(열어라)으로 시작.","wy":"Opening(여는 것, 열면서): -ing로 시작하면 문장에 진짜 동사가 없어짐."},{"s":"The color of the flowers ___ pink.","o":["is","are"],"a":0,"ko":"그 꽃들의 rprising.","그 뉴스는 놀랍다. (news(뉴스)는 s가 있어도 단수)"]]}],"post":["physics(물리학) = 단수 → does not prefer(선호하지 않는다)"]},{"slots":[["descriptive","","","명사 device(장치)를 꾸미는 형용사."],["be_given","give","a","거리는 스스로 무언가를 주지 않는다. 사람이 거리를 피트나 미터로 \"제시하는\" 것이라 거리 입장에선 수동이다."],["depending","","","any feature(어떤 특성이든)를 뒤에서 꾸미는 -ing."],["likewise","","","\"마찬가지로\"라는 부사. 앞 문장의 거리 이야기와 같은 원리라는 신호다."],["switch","","","when(~할 때) 절의 동사. 주어 we(우리)라 switch(바꾸다)."]],"opts":["giving","be given","given","to give"],"or":["giving(주는): 조동사 can(~할 수 있다) 바로 뒤에는 -ing가 못 오고 동사원형이 와야 함.","be given(제시되다): 조동사 can(~할 수 있다) 뒤 원형이면서 거리가 제시되는 쪽이라 수동이 맞음.","given(주어진): 조동사 can(~할 수 있다) 뒤에 과거분사만 혼자 올 수 없고 be(~이다)가 필요함.","to give(주는 것): 조동사 can(~할 수 있다) 뒤에는 to 없이 원형이 와야 함."],"point":"능동태 vs. 수동태","en":"Spatial distances can be given in terms of feet or meters or some other unit, and the physics will be the same regardless.","ko":"공간적인 거리는 피트, 미터 또는 어떤 다른 단위로 환산하여 제시될 수 있으며, 그와 관계없이 물리적 원리는 동일할 것이다.","hl":["Spatial distances can be given"],"khl":["공간적인 거리는","제시될 수 있으며"],"blocks":[{"t":"p","h":"주어에게 직접 물어보기","x":["주어 Spatial distances(공간적인 거리)에게 묻는다. 네가 직접 주니?","아니다. 사람이 거리를 숫자와 단위로 제시한다.","거리는 제시\"되는\" 쪽이니 be + p.p.(수동태).","can give(줄 수 있다)로 쓰면 거리가 무언가를 준다는 말이 되고, 줄 대상도 없다.","뒤 문장의 Temperatures can likewise be given(온도도 마찬가지로 제시될 수 있다)도 같은 구조다."]},{"t":"pair","h":"쉬운 예시","x":[["The prize will be given to the winner.","그 상은 우승자에게 주어질 것이다. (상은 주어지는 쪽)"],["English is spoken in many countries.","영어는 많은 나라에서 말해진다. (영어는 말해지는 쪽)"]]}],"post":["거리는 제시되는 쪽 → can be given(제시될 수 있다)"]},{"slots":[["assigned","","","값이 \"할당되는\" 쪽이라 과거분사."],["changes","","","주어 nothing(아무것도 ~않다)은 단수."],["switch","switching","a","when(~할 때) 뒤에는 주어 + 동사가 와야 한다. 주어 we(우리) 뒤에 동사가 없으면 절이 안 된다."],["arbitrary","","","명사 choice(선택)를 꾸미는 형용사."],["is2","","","주인 any feature(어떤 특성이든)가 단수라 is(~이다)."]],"opts":["switches","to switch","switch","be switched"],"or":["switches(바꾸다, 3인칭 단수형): 주어 we(우리)는 복수라 s를 붙이면 안 됨.","to switch(바꾸는 것): to부정사는 진짜 동사가 아니라서 when(~할 때) 절에 동사가 없어짐.","switch(바꾸다): 주어 we(우리)에 맞는 현재형 동사라 맞음.","be switched(바뀌다): 주어 we(우리) 바로 뒤에 원형 be(~이다)가 올 수 없고, 우리가 직접 바꾸는 쪽이라 수동도 안 맞음."],"point":"정동사 vs. 준동사","en":"Temperatures can likewise be given in terms of the Fahrenheit or Celsius or Kelvin scale, and nothing in the physics changes when we switch from one scale to another.","ko":"온도도 마찬가지로 화씨, 섭씨 또는 켈빈 척도로 환산하여 제시될 수 있으며, 우리가 하나의 척도에서 다른 것으로 전환하더라도 물리적 원리의 어떠한 것도 변화하지 않는다.","hl":["when we switch"],"khl":["우리가 하나의 척도에서 다른 것으로 전환하더라도"],"blocks":[{"t":"p","h":"접속사는 동사를 데리고 온다","x":["when(~할 때)은 접속사라 뒤에 작은 문장(주어 + 동사)이 온다.","주어: we(우리). 동사: switch(바꾸다).","switching(바꾸는 것)은 동사 옷을 벗은 말이라 동사 자리를 못 채운다.","접속사 + 주어가 보이면 바로 뒤 동사 자리를 확인한다."]},{"t":"pair","h":"쉬운 예시","x":[["I was happy when you called me.","네가 나에게 전화했을 때 나는 기뻤다. (when(~할 때) + 주어 + 동사)"],["Be quiet when the baby sleeps.","아기가 잘 때는 조용히 해라. (sleeping(자는 것)이면 틀림)"]]}],"post":["when(~할 때) + 주어 + 동사: when we switch(우리가 바꿀 때)"]},{"slots":[["consider","","","명령문 동사원형 Consider(고려해 보라)."],["likewise","","","\"마찬가지로\"라는 부사."],["that2","","","and(그리고)로 앞의 that(~라는 것)과 나란히 conclude(결론짓다)의 두 번째 내용을 이끈다."],["that3","what","a","앞에 명사 any feature(어떤 특성이든)가 있다. 그 명사를 꾸미는 관계대명사는 that(~하는). what(~하는 것)은 앞에 명사를 둘 수 없다."],["is2","","","주인 any feature(어떤 특성이든)가 단수라 is(~이다)."]],"opts":["whose","whom","where","that"],"or":["whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 동사 depends(의존하다)가 옴.","whom(~을 (사람)): 사람 목적어를 받는 말인데 feature(특성)는 사람이 아니고 빠진 것도 주어임.","where(~하는 곳): 관계부사라 뒤 문장이 완전해야 하는데 주어가 빠져 있음.","that(~하는): 선행사 any feature(어떤 특성이든)를 받고 뒤에 주어가 빠진 관계대명사라 맞음."],"point":"that vs. what","en":"We conclude that the choice of scale is an arbitrary choice in description, and that any feature that depends on that choice is scale-dependent.","ko":"우리는 척도의 선택이 서술상의 임의적인 선택이며, 그 선택에 의존하는 어떤 특성이든 척도에 의존한다는 결론을 내린다.","hl":["any feature that depends"],"khl":["그 선택에 의존하는 어떤 특성이든"],"blocks":[{"t":"p","h":"what(~하는 것)은 혼자 다닌다","x":["what(~하는 것) = the thing which(~하는 것). 이미 명사를 품고 있다.","그래서 what(~하는 것) 앞에는 꾸밈받을 명사가 올 수 없다.","여기는 앞에 any feature(어떤 특성이든)라는 명사가 버티고 있다.","명사를 뒤에서 꾸미는 관계대명사는 that(~하는)이나 which(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a friend that lives in Busan.","나는 부산에 사는 친구가 있다. (명사 a friend(친구) + that)"],["What I need is sleep.","내가 필요한 것은 잠이다. (앞에 명사 없음 → What)"]]}],"post":["명사(any feature = 어떤 특성) + that(~하는) + 동사, what(~하는 것) 불가"]},{"slots":[["using","","","전치사 with(~에) 뒤 동명사."],["does","","","주어 physics(물리학)는 단수."],["depending","depends","a","이 문장의 진짜 동사는 뒤에 있는 is(~이다)다. depends(의존하다)까지 쓰면 접속사 없이 동사가 둘이 된다."],["is1","","","주인 any feature(어떤 특성이든)의 진짜 동사 is(~이다)."],["arbitrary","","","명사 choice(선택)를 꾸미는 형용사."]],"opts":["depend","is depending","has depended","depending"],"or":["depend(의존하다): 진짜 동사라 뒤의 is(~이다)와 동사가 겹치고, 단수 주어와 수도 안 맞음.","is depending(의존하고 있다): 진짜 동사라 뒤의 is(~이다)와 접속사 없이 동사가 둘이 됨.","has depended(의존해 왔다): 이것도 진짜 동사라 뒤의 is(~이다)와 동사가 겹침.","depending(의존하는): any feature(어떤 특성이든)를 뒤에서 꾸미는 -ing라 맞음. 진짜 동사는 뒤의 is(~이다)."],"point":"정동사 vs. 준동사","en":"We further conclude that any feature depending on that choice, such as the particular numerical value assigned to the spatial separation between two locations, is not out there in the world apart from a choice of unit.","ko":"우리는 더 나아가 두 지점 사이의 공간적 분리에 할당된 특정한 수치적 값과 같이 그 선택에 의존하는 어떠한 특성도 단위의 선택과 분리되어 세상 어딘가에 존재하는 것이 아니라고 결론짓는다.","hl":["depending on that choice","is not"],"khl":["그 선택에 의존하는","존재하는 것이 아니라고"],"blocks":[{"t":"p","h":"동사 자리는 한 자리","x":["that(~라는 것) 뒤 작은 문장에서 주어는 any feature(어떤 특성이든).","그 주어의 동사는 콤마 덩어리 뒤의 is not(~이 아니다)이다.","동사 자리가 이미 찼으니 앞의 꾸밈말은 동사 옷을 벗은 depending(의존하는).","depends(의존하다)로 바꾸면 주어 하나에 동사가 둘이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["The girl wearing a red hat is my sister.","빨간 모자를 쓴 소녀는 내 여동생이다. (wearing(쓴)은 꾸밈, is(~이다)가 동사)"],["People living here are kind.","여기 사는 사람들은 친절하다. (living(사는)은 꾸밈, are(~이다)가 동사)"]]},{"t":"tap","h":"확인 질문","q":"이 작은 문장에서 진짜 동사는 몇 개여야 하나?","a":["하나. is not(~이 아니다).","depending(의존하는)과 assigned(할당된)는 둘 다 꾸밈말이다."]}],"post":["진짜 동사는 is(~이다) 하나 →  a ___ student.","o":["happy","happily"],"a":0,"ko":"그는 행복한 학생이다.","why":"명사 student(학생)를 꾸미니 형용사.","wy":"happily(행복하게): 부사라 명사 student(학생)를 꾸밀 수 없음."}]},{"id":"2510g2-36","no":"36","title":"어법특훈 · 25년 10월 고2 36번","sub":"소금과 바다 생물의 수분 조절","tpl":"{even_though|Even though} sea creatures live in it, they still need to take in water for {their|their} bodies to function {properly|properly}. They just need to get rid of any extra salt it might bring with it. Salt {absorbs|absorbs} water like a sponge. If you put a tiny mountain of salt on a small plate, then {add|add} enough water to the side, {making|making} sure an edge {touches|touches} the salt, the salt will absorb the water. Now you have a pile of {wet|wet} salt. {notice|Notice} {that_n|that} it has increased in size. The same principle {applies|applies} to sea creatures. If the body fluids in a sea animal {are|are} {saltier|saltier} than the seawater {lives_in|it lives in}, then the extra salt in the creature's body will absorb seawater. This can cause them {to_swell|to swell} up. On the other hand, if the amount of salt in the seawater {is_h|is} higher than the amount of salt in the body fluids of a sea animal, the extra salt in the water will draw fluids out of the creature's body, {causing|causing} it to dehydrate and {shrink|shrink}.","fn":["*body fluid: 체액","*dehydrate: 탈수되다","*shrink: 줄어들다"],"mean":{"Even though":"비록 ~이지만(접속사)","Despite":"~에도 불구하고(전치사)","Because of":"~ 때문에(전치사 덩어리)","In spite of":"~에도 불구하고(전치사 덩어리)","Regardless of":"~에 상관없이(전치사 덩어리)","their":"그들의(they의 소유격)","them":"그들을(they의 목적격)","they":"그들은(주격)","theirs":"그들의 것(소유대명사)","themselves":"그들 자신(they의 재귀대명사)","properly":"제대로, 적절하게(부사)","proper":"적절한(형용사)","property":"재산, 성질(명사)","properties":"재산들, 성질들(property의 복수형)","improper":"부적절한(형용사)","absorbs":"흡수하다(absorb의 3인칭 단수 현재형)","add":"더하다, 붓다(동사원형)","adds":"더하다(add의 3인칭 단수 현재형)","to add":"더하는 것(add의 to부정사)","has added":"더했다(add의 현재완료형, 단수 주어)","is added":"더해진다(add의 현재 수동형)","making":"~하게 하면서(make의  붙여 비교급: salty(짠) → saltier(더 짠).","긴 형용사는 more(더)를 앞에 붙인다: more important(더 중요한).","둘 중 하나만 쓴다. 둘 다 쓰면 \"더 더 짠\"이 된다.","뒤의 than(~보다)이 비교급의 신호다."]},{"t":"pair","h":"쉬운 예시","x":[["My brother is taller than me.","우리 형은 나보다 키가 크다. (more taller는 틀림)"],["This book is more interesting than that one.","이 책은 저 책보다 더 재미있다. (긴 단어는 more(더))"]]}],"post":["-er(비교급 꼬리) 비교급 앞에 more(더) 금지: saltier than(~보다 더 짠)"]},{"slots":[["their","","","명사 bodies(몸들) 앞 소유격."],["touches","","","make sure(반드시 ~하게 하다) 뒤 주어 an edge(가장자리)의 동사."],["notice","","","명령문 동사원형 Notice(주목하라)."],["causing","causes","a","이 문장의 진짜 동사는 will draw(빨아낼 것이다)다. 콤마 뒤에 접속사 없이 causes(~하게 하다)까지 쓰면 동사가 둘이 된다."],["shrink","","","to dehydrate(탈수되는 것)와 and(그리고)로 나란한 원형."]],"opts":["cause","has caused","causing","is caused"],"or":["cause(~하게 하다): 접속사 없이 콤마 뒤에 동사가 하나 더 생겨 문장이 깨짐.","has caused(~하게 했다): 현재완료도 진짜 동사라 접속사 없이 붙일 수 없음.","causing(~하게 하면서): 진짜 동사 will draw(빨아낼 것이다)가 이미 있어 콤마 뒤 덧붙임은 분사구문이 맞음.","is caused(야기된다): 진짜 동사라 접속사 없이 못 오고, 뒤에 목적어 it(그것)까지 있어 수동도 안 됨."],"point":"정동사 vs. 준동사","en":"On the other hand, if the amount of salt in the seawater is higher than the amount of salt in the body fluids of a sea animal, the extra salt in the water will draw fluids out of the creature's body, causing it to dehydrate and shrink.","ko":"반대로, 만약 바닷물 속 소금의 양이 해양 동물의 체액 안의 소금의 양보다 더 높다면, 바닷물 속의 여분 소금이 생물의 몸으로부터 체액을 빨아내게 되고, 그것이 수분이 빠져 축소되게 하는 원인이 된다.","hl":["will draw","causing"],"khl":["빨아내게 되고","원인이 된다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["주어: the extra salt(여분 소금). 진짜 동사: will draw(빨아낼 것이다).","콤마 뒤에 and(그리고) 같은 접속사가 없다.","접속사 없이 동사를 또 쓸 수 없으니 동사 옷을 벗긴 causing(~하게 하면서).","\"빨아내고, 그 결과 ~하게 만든다\"라는 결과를 덧붙이는 -ing다."]},{"t":"pair","h":"쉬운 예시","x":[["He fell down, hurting his knee.","그는 넘어져서 무릎을 다쳤다. (hurting(다치게 하면서) = 덧붙임)"],["She sat by the window, reading a book.","그녀는 책을 읽으며 창가에 앉아 있었다. (reading(읽으면서) = 덧붙임)"]]}],"post":["진짜 동사 will draw(빨아낼 것이다) 뒤 콤마 덧붙임은 -ing: ..., causing(~하게 하면서)"]},{"slots":[["making","","","콤마 뒤 분사구문 mak are(~이다) 뒤에서 '보통'이라는 빈도를 나타내는 부사가 맞다."],["their","","","Butterflies(나비들)의 날개라 복수 소유격 their(그것들의)가 맞다."]],"opts":["Distinguishing","Distinguished","Distinguishes","Distinction"],"or":["Distinguishing(구별하는 것): 동명사라 주어 자리에 올 수 있고, 뒤 동사 is(~이다)와도 맞음.","Distinguished(구별했다): 과거형 동사로 읽으면 주어가 없고, 뒤에 진짜 동사 is(~이다)가 또 있어 동사가 겹침.","Distinguishes(구별하다, 3인칭 단수형): 동사라 주어 자리에 못 오고 is(~이다)와 동사가 겹침.","Distinction(구별): 명사라서 뒤에 목적어 moths(나방들)를 바로 데려올 수 없음."],"point":"정동사 vs. 준동사","en":"Distinguishing moths from butterflies on outward appearance is not always easy, but there are a few rules of thumb that can help.","ko":"외적 생김새로 나비들과 나방들을 구별하는 것이 항상 용이한 일은 아니지만, 도움이 될 수 있는 몇 가지 경험적 방법들이 있다.","hl":["Distinguishing","is"],"khl":["구별하는 것이","아니지만"],"blocks":[{"t":"p","h":"동사에게 주어 옷 입히기","x":["동사원형 distinguish(구별하다)는 그대로는 주어가 될 수 없다.","주어로 쓰려면 -ing를 붙여 '구별하는 것'으로 바꿔 입힌다.","Distinguishing moths from butterflies(나방을 나비와 구별하는 것)가 한 덩어리 주어다.","진짜 동사는 그 뒤의 is(~이다) 하나뿐이다."]},{"t":"pair","h":"쉬운 예시","x":[["Reading books is fun.","책 읽는 것은 재미있다. (주어 Reading(읽는 것) + 동사 is(~이다))"],["Swimming in the sea is hard.","바다에서 수영하는 것은 어렵다. (주어 Swimming(수영하는 것))"]]},{"t":"tap","h":"확인 질문","q":"이 문장 앞부분에서 진짜 동사는 무엇인가?","a":["is(~이다).","그래서 맨 앞 Distinguishing(구별하는 것)은 동사가 아니라 주어 옷을 입은 -ing다."]}],"post":["주어 자리 동사는 -ing 옷: Distinguishing(구별하는 것) ... is(~이다)"]},{"slots":[["is_e","","","동명사 주어 Distinguishing(구별하는 것)은 단수라 is(~이다)."],["that_h","what","a","앞에 rules of thumb(경험적 방법들)이라는 명사가 있다. 명사를 꾸밀 땐 what(~하는 것)이 아니라 that(~하는)."],["they","","","앞의 the antennae(더듬이들), 복수를 가리키니 they(그것들)."],["to_rest","","","tend(~하는 경향이 있다)는 뒤에 to부정사를 쓴다."],["joins","","","선행사 a tiny hook(아주 작은 갈고리)이 단수라 joins(연결하다)."]],"opts":["whose","where","that","how"],"or":["whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 조동사 can(~할 수 있다)이 와서 안 됨.","where(~하는 곳): 관계부사는 뒤에 완전한 문장이 와야 하는데 can help(도울 수 있다) 앞에 주어가 없음.","that(~하는): 명사 rules of thumb(경험적 방법들)을 꾸미고 뒤에 주어가 빠진 절을 이끄는 관계대명사라 맞음.","how(~하는 방식): 뒤 문장이 완전해야 하는데 주어가 빠져 있고, 앞 명사와도 함께 못 씀."],"point":"that/which vs. what","en":"There are a few rules of thumb that can help.","ko":"도움이 될 수 있는 몇 가지 경험적 방법들이 있다.","hl":["rules of thumb that can help"],"khl":["도움이 될 수 있는 몇 가지 경험적 방법들"],"blocks":[{"t":"p","h":"what(~하는 것)은 이미 명사를 품고 있다","x":["what(~하는 것) 안에는 '것'이라는 명사가 이미 들어 있다.","그래서 what(~하는 것) 앞에 명사가 또 오면 명사가 둘이 된다.","rules of thumb(경험적 방법들)이 앞에 있으니 그 명사를 꾸미는 that(~하는)이 맞다.","that(~하는) 뒤를 보면 주어가 빠지고 can help(도울 수 있다)만 있다."]},{"t":"pair","h":"쉬운 예시","x":[["I have a bag that is very old.","나는 아주 오래된 가방을 가지고 있다. (명사 a bag(가방) + that)"],["What I want is water.","내가 원하는 것은 물이다. (앞에 명사 없이 What(~하는 것))"]]}],"post":["명사 rules of thumb(경험적 방법들) + that(~하는) / 명사 없으면 what(~하는 것)"]},{"slots":[["that_h","","","명사 rules of thumb(경험적 방법들)을 꾸미는 관계대명사 that(~하는)."],["end","ends","a","주어 the antennae(더듬이들)는 antenna(더듬이)의 복수형이다. 복수 주어에는 s 없는 end(끝나다)."],["usually","","","be동사 are(~이다) 뒤의 빈도부사 usually(보통)."],["looking","","","전치사 by(~함으로써) 뒤라 동명사 looking(찾는 것)."],["simply","","","형용사 wrong(잘못된)을 꾸미는 부사 simply(그야말로)."]],"opts":["ending","end","to end","having ended"],"or":["ending(끝나는): -ing는 혼자 동사 자리에 못 와서 주절에 진짜 동사가 없어짐.","end(끝나다): 복수 주어 the antennae(더듬이들)에 맞는 현재형 동사라 맞음.","to end(끝나는 것): to부정사도 동사 자리에 못 와서 주어 뒤 동사가 비게 됨.","having ended(끝나고 나서): 완료 -ing형이라 동사 자리에 못 오고 지금 사실을 말하는 시제와도 안 맞음."],"point":"주어와 동사의 수일치","en":"In most butterflies the antennae end with a small club-shaped swelling.","ko":"대부분의 나비들의 경우 더듬이들은 작은 곤봉 모양의 혹으로 끝난다.","hl":["the antennae end"],"khl":["더듬이들은","끝난다"],"blocks":[{"t":"p","h":"s로 안 끝나는 복수 명사","x":["antenna(더듬이) 한 개 → antennae(더듬이들) 여러 개.","끝에 s가 없어도 antennae(더듬이들)는 복수다.","주어가 여럿이면 동사에 s를 붙이지 않는다.","그래서 ends(끝나다, 3인칭 단수형)가 아니라 end(끝나다)."]},{"t":"pair","h":"쉬운 예시","x":[["The children play in the park.","아이들은 공원에서 논다. (children(아이들)은 child(아이)의 복수형)"],["My teeth hurt.","내 이가 아프다. (teeth(이들)는 tooth(이)의 복수형)"]]}],"post":["antennae(더듬이들) = 복수 → end(끝나다), s 없음"]},{"slots":[["end","","","복수 주어 the antennae(더듬이들)에 맞춘 end(끝나다)."],["to_rest","resting","a","tend(~하는 경향이 있다)는 뒤에 음."],"point":"that/which vs. what","en":"There are many brightly coloured moths and many which are active throughout the day.","ko":"밝은색을 가진 나방들이 많고 낮 동안 내내 활동적인 나방들이 많이 있다.","hl":["many which are active"],"khl":["활동적인 나방들이 많이"],"blocks":[{"t":"p","h":"many(많은 것들)도 선행사가 된다","x":["여기서 many(많은 것들)는 '많은 나방들'을 줄인 대명사다.","명사 역할이니 뒤에서 꾸며 줄 수 있다.","선행사가 이미 있으니 '것'을 품은 what(~하는 것)은 들어갈 자리가 없다.","which(~하는) 뒤를 보면 주어가 빠지고 are active(활동적이다)만 있다."]},{"t":"pair","h":"쉬운 예시","x":[["I have a dog which likes to swim.","나는 수영하기를 좋아하는 개를 키운다. (선행사 a dog(개) + which)"],["What I need is sleep.","내가 필요한 것은 잠이다. (선행사 없이 What(~하는 것))"]]}],"post":["선행사 many(많은 것들) + which(~하는) / 선행사 없으면 what(~하는 것)"]},{"no":"37","slots":[["they","","","복수 the antennae(더듬이들)를 가리키는 they(그것들)."],["looking","","","전치사 by(~함으로써) 뒤라 동명사 looking(찾는 것)."],["active","","","be동사 are(~이다) 뒤 보어 자리라 형용사 active(활동적인)."],["to_think","think","a","It's more sensible(더 합리적이다)에서 동사 is(~이다)는 이미 있다. 진짜 주어 자리에 동사원형이 오면 동사가 겹친다."],["fascinating","","","곤충이 사람을 매혹'하는' 쪽이라 fascinating(매혹적인)."]],"opts":["thinks","to think","thought","to thinking"],"or":["thinks(생각하다, 3인칭 단수형): 동사라 is(~이다)와 겹치고 진짜 주어 자리에 못 옴.","to think(생각하는 것): 가주어 It(그것)이 가리키는 진짜 주어 to부정사라 맞음.","thought(생각했다, 생각): 동사로 보면 is(~이다)와 겹치고, 명사로 보면 뒤의 of them(그것들에 대해)과 문장 연결이 안 맞음.","to thinking(생각하는 것으로): 형용사 sensible(합리적인) 뒤에 전치사 to + 동명사는 오지 않음."],"point":"가주어 it + 진주어 to부정사","en":"It's more sensible to think of them together.","ko":"그들을 함께 묶어 생각하는 것이 더 합리적이다.","hl":["It's more sensible to think"],"khl":["생각하는 것이 더 합리적이다"],"blocks":[{"t":"p","h":"가짜 주인 It(그것)","x":["진짜 주어 to think of them together(그들을 함께 생각하는 것)는 길다.","긴 주어를 맨 앞에 두면 머리가 무거워서 뒤로 보낸다.","빈 주어 자리는 가짜 주어 It(그것)이 채운다.","뒤로 간 진짜 주어는 to부정사 모양을 지켜야 한다."]},{"t":"pair","h":"쉬운 예시","x":[["It is important to eat breakfast.","아침을 먹는 것은 중요하다. (It = to eat breakfast(아침을 먹는 것))"],["It is fun to play soccer.","축구를 하는 것은 재미있다. (It = to play soccer(축구를 하는 것))"]]}],"post":["It(가주어) is sensible(합리적이다) + to think(생각하는 것)"]}] (~할 수 있다) + be + p.p.로 맞음.","classifying(분류하는): 조동사 can(~할 수 있다) 뒤에는 동사원형이 와야 해서 -ing는 못 옴.","classifies(분류하다, 3인칭 단수형): 조동사 뒤에 s 붙은 동사는 못 옴.","have classified(분류했다): 능동형이라 목적어가 있어야 하는데 없고, 방법들이 직접 분류하는 셈이 됨."],"point":"능동태 vs. 수동태","en":"They all imply stewardship and can be classified into two broad categories: active management and inactive management.","ko":"그것들은 모두 관리 책임을 수반하고 적극적 관리와 소극적 관리라는 두 가지 넓은 범주로 분류될 수 있다.","hl":["can be classified into"],"khl":["범주로 분류될 수 있다"],"blocks":[{"t":"p","h":"주어가 직접 하나, 당하나","x":["주어 they(그것들)는 야생 생물을 관리하는 '방법들'이다.","방법은 스스로 무언가를 분류하지 않는다. 사람이 방법을 분류한다.","당하는 쪽이니 be + p.p.: can be classified(분류될 수 있다).","classify(분류하다) 뒤에는 원래 목적어가 와야 하는데, 여기엔 into(~으로)가 바로 온다. 수동태 신호."]},{"t":"pair","h":"쉬운 예시","x":[["English is spoken in many countries.","영어는 많은 나라에서 말해진다. (영어는 말해지는 쪽 → is spoken(말해진다))"],["People speak English in many countries.","사람들은 많은 나라에서 영어를 말한다. (사람이 말하는 쪽 + 목적어 English(영어))"]]}],"post":["방법들은 당하는 쪽: can be classified into(~으로 분류될 수 있다)"]},{"slots":[["does","","","주어 Active management(적극적 관리)가 단수라 does(하다)."],["direct","directly","a","뒤의 manner(방식)는 명사다. 명사를 꾸미는 자리에 부사 directly(직접)는 올 수 없다."],["are_t","","","주어 population numbers(개체 수)가 복수라 are(~이다)."],["to_minimize","","","predator control(포식자 통제)이 무엇을 위한 것인지 알려 주는 to부정사 to minimize(최소화하기 위한)."],["those","","","앞의 populations(개체군들), 복수 명사를 대신하는 those(그것들)."]],"opts":["direct","direction","directs","directness"],"or":["direct(직접적인): 관사 a와 명사 manner(방식) 사이에서 명사를 꾸미는 형용사라 맞음.","direction(방향): 명사라서 다른 명사 manner(방식)를 꾸미는 자리에 안 맞음.","directs(지휘하다, 3인칭 단수형): 동사라 관사와 명사 사이에 못 옴.","directness(직접적임): 명사라서 manner(방식) 앞 꾸밈 자리에 안 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"Active management does something to the population in a direct manner through strategies like translocations or hunting.","ko":"적극적 관리는 거주지 이전이나 사냥과 같은 전략을 통해 무언가를 직접적인 방식으로 개체군에게 실행한다.","hl":["in a direct manner"],"khl":["직접적인 방식으로"],"blocks":[{"t":"p","h":"화살표가 어디로 가나","x":["direct(직접적인) → manner(방식). 화살표가 명사로 간다. _a|that} the demand for more products will {be_sustained|be sustained}. Many strategies {have|have} been incorporated into product design and use to ensure that waste is {inevitable|inevitable}, such as planned obsolescence, limited access to tools for repairs, and use of cheap materials. All these strategies {ensure|ensure} that the consumer will have limited access to the product in use and will eventually {require|require} a replacement. Those who supported the idea {that_b|that} waste is necessary to drive demand {failed|failed} {to_realize|to realize} that {prioritizing|prioritizing} the elimination of waste via repair and remanufacturing {creates|creates} a different kind of demand: products as a service. Through this setup, companies simply lease out products that were once sold directly to the customer. With this transition of ownership, companies maintain profit by {offering|offering} maintenance and repair services and are encouraged to develop long-lasting products.","fn":["*planned obsolescence: 계획적 노후화(일부러 제품 수명을 짧게 만드는 것)","*remanufacturing: 재제조","*lease out: 임대하다"],"mean":{"historically":"역사적으로(부사)","been seen":"여겨져 왔다(has와 함께 쓰는 see의 현재완료 수동형)","seen":"보았다, 보인(see의 과거분사형)","been seeing":"보아 오고 있다(has와 함께 쓰는 see의 현재완료 진행형)","seeing":"보는 것, 보는(see의 -ing형)","to see":"보는 것, 보기 위해(see의 to부정사)","are":"~이다(be의 현재형, 복수 주어)","is":"~이다(be의 현재형, 단수 주어)","supplied":"공급되는(supply의 과거분사형)","supplying":"공급하는(supply의 -ing형)","supplies":"공급하다(supply의 3인칭 단수 현재형) / 물품들(명사)","is supplying":"공급하고 있다(supply의 현재진행형)","have supplied":"공급해 왔다(supply의 현재완료형)","which":"그리고 그것은(앞 내용을 받는 관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","whom":"~을(목적격 관계대명사)","whose":"~의(소유격 관계대명사)","where":"~하는 곳(관계부사)","that":"~라는 것, ~라는(명사절·동격을 이끄는 접속사)","directly":"직접적으로(부사)","directed":"지시했다, 향하게 된(direct의 과거형·과거분사형)","directs":"지시하다(direct의 3인칭 단수 현재형)","directing":"지시하는, 지휘하는(direct의 -ing형)","directive":"지시하는(형용사) / 지시(명사)","be wasted":"버려지다(waste의 수동형 원형)","being wasted":"버려지는 것(waste의 수동 -ing형)","w  that product.","ko":"판매량은 어떤 제품의 공급량에 연결되고, 그것은 그 제품에 대한 수요량에 직접적으로 의존한다.","hl":["the amount of a product supplied, which"],"khl":["그것은"],"blocks":[{"t":"p","h":"what(~하는 것)은 혼자 다닌다","x":["what(~하는 것)은 이미 \"것\"이라는 명사를 품고 있다.","그래서 what(~하는 것) 앞에는 받아 줄 명사가 오지 않는다.","이 문장은 앞에 the amount(양)가 있고 콤마로 이어진다.","앞 명사를 받아 \"그리고 그것은\"이라고 이어 주는 말은 which(그것은)다."]},{"t":"pair","h":"쉬운 예시","x":[["I have a bike, which is very old.","나는 자전거가 있는데, 그것은 아주 오래됐다. (앞 명사 a bike(자전거) → which)"],["What I want is a new bike.","내가 원하는 것은 새 자전거다. (앞 명사 없이 what)"]]}],"post":["명사(the amount = 양) + 콤마 + which(그리고 그것은), what(~하는 것)은 금지"]},{"slots":[["which","","","앞 명사 the amount(양)를 받는 관계대명사다."],["directly","directed","a","is(~이다)와 형용사 dependent(의존하는) 사이에서 형용사를 꾸미는 자리. 부사 directly(직접적으로)만 들어갈 수 있다."],["be_wasted","","","제품이 \"버려지는\" 쪽이라 to 뒤에 be wasted(버려지다)."],["that_a","","","ensure(보장하다) 뒤 완전한 문장을 이끄는 that(~라는 것)이다."],["have","","","주어 Many strategies(많은 전략들)가 복수라 have(~해 왔다)."]],"opts":["directly","directs","directing","directive"],"or":["directly(직접적으로): 형용사 dependent(의존하는)를 꾸미는 부사라 맞음.","directs(지시하다): 동사라 is(~이다) 뒤에 또 동사가 붙어 문장이 깨짐.","directing(지시하는): is directing(지시하고 있다)이 되면 뒤의 dependent(의존하는)가 갈 곳이 없어짐.","directive(지시하는, 형용사): 형용사라 다른 형용사 dependent(의존하는)를 꾸밀 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"Sales are tied to the amount of a product supplied, which is directly dependent on the demand for that product.","ko":"판매량은 어떤 제품의 공급량에 연결되고, 그것은 그 제품에 대한 수요량에 직접적으로 의존한다.","hl":["is directly dependent"],"khl":["직접적으로 의존한다"],"blocks":[{"t":"p","h":"형용사 앞에 끼는 말","x":["is dependent on(~에 의존한다)이 뼈대다.","dependent(의존하는)는 형용사다.","형용사를 꾸며 \"얼마나, 어떻게\"를 더하는 말은 부사다.","그래서 is directly dependent(직접적으로 의존한다).","동사 모양(directs = 지시하다, directed = 지시된)이 끼면 동사가 두 번 나온 셈이다."]},{"t":"pair","h":"쉬운 예시","x":[["She is very kind.","그녀는 매우 친절하다. (형용사 kind(친절한) ← 부사 very(매우))"],["The room is really clean.","그 방은 정말 깨끗하다. (형용사 clean(깨끗한) ← 부사 really(정말))"]]}],"post":["be + 부사 + 형용사: is directly dependent(직접적으로 의존한다)"]},{"slots":[["directly","","","형용사 dependent(의존하는)를 꾸미는 부사다."],["be_wasted","being wasted","a","design(설계하다) + 목적어 + to + 동사원형. to 뒤에는 원형 be(~되다)가 와야 한다."],["that_a","","","ensure(보장하다)의 목적어가 되는 완전한 문장을 이끈다."],["be_sustained","","","수요가 \"유지되는\" 쪽이라 will be sustained(지속될 것이다)."],["have","","","주어 Many strategies(많은 전략들)가 복수라 have(~해 왔다)."]],"opts":["wasted","be wasted","been wasted","have wasted"],"or":["wasted(버려진): to 바로 뒤에 과거분사는 올 수 없음.","be wasted(버려지다): to 뒤 원형 + 수동이라 \"버려지도록\"이 되어 맞음.","been wasted(버려져 온): have(~해 왔다) 없이 been(~되어 온)만 쓸 수 없어 to 뒤 모양이 깨짐.","have wasted(낭비해 온): 능동이라 waste(낭비하다)의 목적어가 있어야 하는데 없음."],"point":"목적격보어(준동사)","en":"Therefore, if you design the product to eventually be wasted, you can ensure that the demand for more products will be sustained.","ko":"따라서, 만약 여러분이 그 제품을 결국에는 폐기되도록 설계한다면, 여러분은 더 많은 제품에 대한 수요량이 지속될 것을 보장할 수 있다.","hl":["design the product to eventually be wasted"],"khl":["결국에는 폐기되도록 설계한다면"],"blocks":[{"t":"p","h":"to 뒤에 낀 부사는 잠깐 치운다","x":["to eventually be wasted(결국 버려지도록)에서 eventually(결국)는 끼어든 부사다.","부사를 치우면 to be wasted(버려지도록)가 남는다.","to부정사의 to 뒤에는 언제나 동사원형이 온다.","그래서 being(~되는 것)이 아니라 원형 be(~되다)."]},{"t":"pair","h":"쉬운 예시","x":[["I want the cake to be shared.","나는 그 케이크가 나눠지길 원한다. (to be shared = 나눠지도록)"],["Mom told me to clean my room.","엄마는 나에게 방을 청소하라고 했다. (to clean = 청소하라고)"]]}],"post":["design(설계하다) + 목적어 + to be p.p.(~되도록): to eventually be wasted(결국 버려지도록)"]},{"slots":[["require","","","will have(갖게 될 것이다) ... and will eventually require(결국 필요로 할 것이다). will(~할 것이다) 뒤 동사원형이다."],["that_b","","","the idea(생각)의 내용을 완전한 문장으로 설명하는 동격 that(~라는)이다."],["failed","failing","a","주어 Those(사람들) 뒤 who(~하는) 덩어리는 꾸밈말이다. 문장의 진짜 동사가 필요한 자리다."],["to_realize","","","fail(실패하다)은 to부정사를 목적어로 취한다."],["prioritizing","","","realize that(~라는 것을 깨닫다) 뒤 문장의 주어 자리라 동명사가 맞다."]],"opts":["to fail","having failed","being failed","failed"],"or":["to fail(실패하는 것): to부정사는 문장의 진짜 동사가 될 수 없음.","having failed(실패하고 나서): -ing형이라 진짜 동사 자리에 못 옴.","being failed(실패당하는 것): -ing형이라 동사 자리에 못 오고 수동의 뜻도 안 맞음.","failed(실패했다): 주어 Those(사람들)의 진짜 동사라 과거형이 맞음."],"point":"정동사 vs. 준동사","en":"Those who supported the idea that waste is necessary to drive demand failed to realize that prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand: products as a service.","ko":"폐기가 수요를 촉진하는 데 필수적이라는 생각을 지지했던 사람들은 수리와 재제조를 통해 폐기의 제거를 우선시하는 것이 서비스로서의 상품이라는 다른 종류의 수요를 창출한다는 것을 인식하는 데 실패했다.","hl":["Those","failed"],"khl":["사람들은","실패했다"],"blocks":[{"t":"p","h":"긴 주어 뒤의 진짜 동사 찾기","x":["주어 Those(사람들) 뒤에 who supported the idea ... demand(~라는 생각을 지지했던)가 길게 붙었다.","이 덩어리는 Those(사람들)를 꾸미는 꼬리표다.","꼬리표 안의 supported(지지했다)는 who(~하는)의 동사일 뿐이다.","Those(사람들) 자신의 동사가 하나 더 있어야 문장이 완성된다.","그 자리가 failed(실패했다). -ing로 바꾸면 문장에 진짜 동사가 사라진다."]},{"t":"pair","h":"쉬운 예시","x":[["The boy who won the race smiled.","경주에서 이긴 그 소년은 미소 지었다. (진짜 동사 smiled(미소 지었다))"],["People who live here love the park.","여기 사는 사람들은 그 공원을 좋아한다. (진짜 동사 love(좋아한다))"]]}],"post":["Those(사람들) + who ~(꼬리표) + failed(실패했다) = 진짜 동사 자리"]}],"quiz":[{"s":"English is ___ in many countries.","o":["spoken","speaking"],"a":0,"ko":"영어는 많은 나라에서 쓰인다.","why":"영어는 \"쓰이는\" 쪽이라 is spoken(쓰인다).","wy":"speaking(말하는): is speaking(말하고 있다)은 영어가 직접 말하는 셈이 되어 틀림."},{"s":"I bought a new bag, ___ is very light.","o":["which","what"],"a":0,"ko":"나는 새 가방을 샀는데, 그것은 아주 가볍다.","why":"앞 명사 a new bag(새 가방)을 받는 which(그것은).","wy":"what(~하는 것): 앞에 받아 줄 명사가 있으면 쓸 수 없음."},{"s":"The test was ___ easy.","o":["surprising","surprisingly"],"a":1,"ko":"그 시험은 놀라울 만큼 쉬웠다.","why":"형용사 easy(쉬운)를 꾸미니 부사.","wy":"surprising(놀라운): 형용사라 다른 형용사 easy(쉬운)를 꾸밀 수 없음."},{"s":"The teacher asked us ___ quiet.","o":["to be","being"],"a":0,"ko":"선생님은 우리에게 조용히 하라고 했다.","why":"ask(요청하다) + 사람 + to + 동사원형.","wy":"being(~인 것): ask(요청하다) + 사람 뒤에는 -ing가 아니라 to부정사가 옴."},{"s":"The boy who lives next door ___ my friend.","o":["being","is"],"a":1,"ko":"옆집에 사는 그 소년은 내 친구다.","why":"주어 The boy(그 소년)의 진짜 동사가 필요.","wy":"being(~인 것): -i int":"that vs. what","en":"Therefore, if you design the product to eventually be wasted, you can ensure that the demand for more products will be sustained.","ko":"따라서, 만약 여러분이 그 제품을 결국에는 폐기되도록 설계한다면, 여러분은 더 많은 제품에 대한 수요량이 지속될 것을 보장할 수 있다.","hl":["ensure that the demand for more products will be sustained"],"khl":["수요량이 지속될 것을 보장할 수 있다"],"blocks":[{"t":"p","h":"뒤 문장에 구멍이 있나 보기","x":["what(~하는 것) 뒤 문장에는 주어나 목적어 하나가 꼭 빠져 있다.","that(~라는 것) 뒤 문장은 빠진 것 없이 완전하다.","the demand(수요)가 주어, will be sustained(지속될 것이다)가 동사.","구멍이 없으니 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I hope that you get better.","나는 네가 낫기를 바란다. (완전한 문장 → that)"],["Tell me what you saw.","네가 본 것을 말해 줘. (saw(보았다)의 목적어가 빠짐 → what)"]]}],"post":["ensure(보장하다) + that + 완전한 문장, 구멍 있으면 what(~하는 것)"]},{"slots":[["be_sustained","","","수요가 \"지속되는\" 쪽이라 수동이 맞다."],["have","has","a","주어는 Many strategies(많은 전략들), 복수다. 복수 주어에는 have(~해 왔다)."],["inevitable","","","is(~이다) 뒤 보어 자리라 형용사 inevitable(피할 수 없는)."],["ensure","","","주어 All these strategies(이 모든 전략들)가 복수라 s 없는 ensure(보장하다)."],["require","","","and(그리고) 뒤 will eventually require(결국 필요로 할 것이다). will(~할 것이다) 뒤 동사원형이다."]],"opts":["having","to have","have","be"],"or":["having(가지고 있는 것): -ing는 문장의 진짜 동사가 될 수 없음.","to have(가지는 것): to부정사도 진짜 동사가 될 수 없음.","have(~해 왔다): 복수 주어 Many strategies(많은 전략들)와 맞는 현재완료형이라 맞음.","be(~이다): 원형 be(~이다)는 주어 바로 뒤 동사 자리에 못 오고, be been(~되어 왔다)이라는 모양도 없음."],"point":"수식받는 주어의 수일치","en":"Many strategies have been incorporated into product design and use to ensure that waste is inevitable.","ko":"많은 전략들은 폐기가 불가피하다는 것을 보장하기 위해서 제품 설계와 사용에 포함되어 왔다.","hl":["Many strategies have been incorporated"],"khl":["많은 전략들은","포함되어 왔다"],"blocks":[{"t":"p","h":"주인을 찾으면 숫자가 보인다","x":["동사 have(~해 왔다)의 주인은 Many strategies(많은 전략들)다.","Many(많은)와 strategies(전략들)의 s가 복수라는 표시다.","복수 주인에게는 has(단수형)가 아니라 have(복수형).","뒤의 product design(제품 설계)은 동사 뒤에 나오는 말이라 동사 모양과 상관없다."]},{"t":"pair","h":"쉬운 예시","x":[["Many students have finished the test.","많은 학생들이 시험을 끝냈다. (주인 students(학생들) → have)"],["My brother has finished the test.","내 남동생은 시험을 끝냈다. (주인 brother(남동생) → has)"]]}],"post":["Many strategies(많은 전략들) = 복수 → have been(~되어 왔다)"]},{"slots":[["inevitable","","","is(~이다) 뒤 보어 자리라 형용사다."],["ensure","","","주어 All these strategies(이 모든 전략들)가 복수라 ensure(보장하다)."],["require","requiring","a","will have(갖게 될 것이다) ... and will eventually require(결국 필요로 할 것이다). and(그리고) 뒤에도 will(~할 것이다)이 있으니 동사원형이어야 한다."],["that_b","","","the idea(생각)의 내용을 설명하는 동격 that(~라는)이다."],["failed","","","주어 Those(사람들)의 진짜 동사다."]],"opts":["requires","require","required","to require"],"or":["requires(필요로 하다, 3인칭 단수형): will(~할 것이다) 뒤에는 s가 붙은 모양이 못 옴.","require(필요로 하다): will(~할 것이다) 뒤에는 동사원형이 오니 맞음.","required(필요로 했다): will(~할 것이다) 뒤에는 과거형이 못 옴.","to require(필요로 하는 것): will(~할 것이다) 뒤에는 to 없이 동사원형이 옴."],"point":"병렬구조","en":"All these strategies ensure that the consumer will have limited access to the product in use and will eventually require a replacement.","ko":"이 모든 전략들은 소비자가 사용 중인 제품에 제한된 접근을 하게 될 것이고 결국에는 교체를 필요로 할 것을 보장한다.","hl":["will have","will eventually require"],"khl":["하게 될 것이고","필요로 할 것을"],"blocks":[{"t":"p","h":"and(그리고) 양쪽 접시 맞추기","x":["왼쪽 접시: will have limited access(제한된 접근을 하게 될 것이다)","오른쪽 접시: will eventually require a replacement(결국 교체를 필요로 할 것이다)","양쪽 모두 will(~할 것이다) + 동사원형 모양이다.","eventually(결국)는 끼어든 부사라 잠깐 치우고 본다.","will(~할 것이다) 바로 뒤에 -ing가 오면 저울이 기운다."]},{"t":"pair","h":"쉬운 예시","x":[["I will wash the dishes and will clean the room.","나는 설거지를 하고 방을 청소할 것이다. (wash and clean = 설거지하고 청소하다)"],["He can sing and dance.","그는 노래하고 춤출 수 있다. (can sing and dance = 노래하고 춤출 수 있다)"]]}],"post":["will have(갖게 될 것이다) ~ and will require(필요로 할 것이다): will(~할 것이다) 뒤는 둘 다 원형"]},{"slots":[["that_b","","","the idea(생각) 뒤 완전한 문장을 이끄는 동격 that(~라는)이다."],["failed","","","주어 Those(사람들)의 진짜 동사다."],["to_realize","realizing","a","fail(실패하다)은 뒤에 to부정사를 쓴다. fail to V(~하지 못하다)."],["prioritizing","","","that(~라는 것) 뒤 문장의 주어 자리라 동명사다."],["creates","","","동명사 주어 prioritizing(우선시하는 것)은 단수라 creates(만들어 낸다)."]],"opts":["realize","to realize","realized","to realizing"],"or":["realize(깨닫다): failed(실패했다) 바로 뒤에 동사원형이 오면 동사가 두 개 붙음.","to realize(깨닫는 것): fail(실패하다) 뒤에는 to부정사가 오니 맞음.","realized(깨달았다): failed(실패했다) 뒤에 과거형 동사가 또 오면 문장이 깨짐.","to realizing(깨닫는 것으로): 여기 to는 to부정사의 to라 뒤에 동사원형이 와야 함."],"point":"동명사/to부정사 목적어","en":"Those who supported the idea that waste is necessary to drive demand failed to realize that prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand.","ko":"폐기가 수요를 촉진하는 데 필수적이라는 생각을 지지했던 사람들은 수리와 재제조를 통해 폐기의 제거를 우선시하는 것이 다른 종류의 수요를 창출한다는 것을 인식하는 데 실패했다.","hl":["failed to realize"],"khl":["인식하는 데 실패했다"],"blocks":[{"t":"p","h":"to를 좋아하는 동사들","x":["앞으로 할 일, 하려던 일을 말하는 동사는 to부정사를 좋아한다.","want(원하다), plan(계획하다), decide(결정하다), fail(실패하다)이 그 무리다.","fail to V = ~하지 못하다.","failed to realize = 깨닫지 못했다."]},{"t":"pair","h":"쉬운 예시","x":[["He failed to pass the test.","그는 시험에 합격하지 못했다. (failed to pass = 합격하지 못했다)"],["I decided to study harder.","나는 더 열심히 공부하기로 결심했다. (decided to study = 공부하기로 결심했다)"]]}],"post":["fail to V(~하지 못하다): failed to realize(깨닫지 못했다)"]}],"quiz":[{"s":"This is a picture ___ by my sister.","o":["painted","painting"],"a":0,"ko":"이것은 내 여동생이 그린 그림이다.","why":"그림은 \"그려지는\" 쪽이라 p.p.(과거분사).","wy":"painting(그리는): 그림이 직접 그리는 셈이 되고, by my sister(내 여동생에 의해)와도 안 맞음."},{"s":"I know ___ he is honest.","o":["what","that"],"a":1,"ko":"나는 그가 정직하다는 것을 안다.","why":"뒤 문장이 완전하니 that(~라는 것).","wy":"what(~하는 것): 뒤 문장에 빠진 자리가 있어야 하는데 he is honest(그는 정직하다)는 완전함."},{"s":"The books on the desk ___ mine.","o":["are","is"],"a":0,"ko":"책상 위의 책들은 내 것이다.","why":"주인 The books(책들)가 복수.","wy":"is(~이다): 단수 동사라 복수 주어 The books(책들)와 안 맞음."},{"s":"She will clean the room and ___ dinner.","o":["cook","cooking"],"a":0,"ko":"그녀는 방을 청소하고 저녁을 요리할 것이다.","why":"will clean(청소할 것이다)과 나란히 원형 cook(요리하다).","wy":"cooking(요리하는 것): will(~할 것이다) 뒤 원형 clean(청소하다)과 짝이 안 맞음."},{"s":"He failed ___ the bus.","o":["catching","to catch"],"a":1,"ko":" "offers","to offer","offering"],"or":["offered(제공했다): 전치사 뒤에 과거형 동사는 못 옴.","offers(제공하다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음.","to offer(제공하는 것): 전치사 by(~함으로써) 뒤에 to부정사는 못 옴.","offering(제공하는 것): 전치사 by(~함으로써) 뒤라 동명사가 맞음."],"point":"전치사 + 동명사","en":"With this transition of ownership, companies maintain profit by offering maintenance and repair services and are encouraged to develop long-lasting products.","ko":"이러한 소유권의 전환으로 기업들은 유지와 수리 서비스들을 제공함으로써 수익을 유지하고 더 오래 지속되는 제품들을 개발하도록 촉진된다.","hl":["by offering"],"khl":["제공함으로써"],"blocks":[{"t":"p","h":"전치사 뒤는 명사 자리","x":["by(~함으로써), for(~을 위해), without(~없이)는 전치사다.","전치사 뒤에는 명사 모양만 올 수 있다.","동사를 넣고 싶으면 -ing를 붙여 명사처럼 만든다.","by offering = 제공함으로써."]},{"t":"pair","h":"쉬운 예시","x":[["She saved money by walking to school.","그녀는 학교에 걸어감으로써 돈을 아꼈다. (by walking = 걸어감으로써)"],["Thank you for helping me.","도와줘서 고마워. (for helping = 도와준 것에 대해)"]]}],"post":["by + -ing(~함으로써): by offering(제공함으로써)"],"no":"39"}],"compquiz":[{"s":"Reading books ___ fun.","o":["is","are"],"a":0,"ko":"책을 읽는 것은 재미있다.","why":"동명사 주어 Reading(읽는 것)은 단수.","wy":"are(~이다): 복수 동사라 단수 취급하는 동명사 주어와 안 맞음."},{"s":"She is good at ___.","o":["swim","swimming"],"a":1,"ko":"그녀는 수영을 잘한다.","why":"전치사 at(~에) 뒤는 -ing.","wy":"swim(수영하다): 전치사 at(~에) 뒤에 동사원형은 못 옴."}]},{"id":"2510g2-40","no":"40","title":"어법특훈 · 25년 10월 고2 40번","sub":"인간이 만든 시간과 지구의 자전","tpl":"{Viewing|Viewing} time as a purchasable and consistent product {cemented|cemented} artificial views on time into our psyche, but every now and again we {are_forced|are forced} {to_acknowledge|to acknowledge} this mistake. On twenty-six occasions in the last fifty years, a second {has|has} been added to everyone's day to adjust for the Earth wobbling and the rate of {its|its} spin changing. For instance, when El Niño, a climatic system in the Pacific, causes wind speed {to_change|to change} {dramatically|dramatically}, it can {slow|slow} the rotation of the Earth {slightly|slightly}. Indeed, the Earth's spin is generally slowing {because|because} the moon's gravity is acting as a drag, so days {are_getting|are getting} longer by about 1.7 milliseconds per century. Such events {disturb|disturb} the similarity between man-made time and more flexible time {based|based} on the Earth's {naturally|naturally} {occurring|occurring} rotation. When events like this {happen|happen}, a bunch of humans make the decision to add a small slice of time to your day, without your knowledge. We try to force our fixed, man-made view of time on nature in the false hope {that|that} it will yield. It {doesnt|doesn't}.","fn":["*psyche: 정신, 마음","*wobble: 흔들리다","*drag: 끌어당기는 힘, 저항","*yield: 굴복하다"],"mean":{"Viewing":"보는 것(view의 -ing형, 동명사)","View":"보다(동사원형) / 관점(명사)","Viewed":"보았다(view의 과거형·과거분사형)","Views":"보다(view의 3인칭 단수 현재형) / 관점들(명사)","Being viewed":"보여지는 것(view의 수동 -ing형)","cemented":"굳혔다, 고착시켰다(cement의 과거형)","cementing":"굳히는 것, 굳히는(cement의 -ing형)","to cement":"굳히는 것(cement의 to부정사)","having cemented":"굳히고 나서(cement의 완료 -ing형)","being cemented":"굳혀지는 것(cement의 수동 -ing형)","are forced":"어쩔 수 없이 ~하게 되다(force의 수동형, 복수 주어)","being forced":"강요받는 것(force의 수동 -ing형)","force":"강요하다(동사원형)","forcing":"강요하는 것, 강요하는(force의 -ing형)","have forced":"강요해 왔다(force의 현재완료형)","to acknowledge":"인정하는 것(acknowledge의 to부정사)","has":"~해 왔다(현재완료를 만드는 조동사, 단수 주어)","its":"그것의(it의 소유격)","their":"그들의, 그것들의(they의 소유격)","it's":"그것은 ~이다(it is의 줄임말)","it":"그것(주격·목적격)","them":"그들을, 그것들을(they의 목적격)","to change":"바뀌는 것(change의 to부정사)","change":"바뀌다(동사원형)","changing":"바뀌는 것, 바뀌는(change의 -ing형)","changed":"바뀌었다(change의 과거형·과거분사형)","changes":"바뀌다(change의 3인칭 단수 현재형) / 변화들(명사)","dramatically":"극적으로(부사)","slow":"늦추다(동사원형)","slightly":"약간(부사)","because":"~이기 때문에(접속사, 뒤에 문장)","because of":"~ 때문에(전치사구, 뒤에 명사)","due to":"~ 때문에(전치사구, 뒤에 명사)","owing to":"~ 때문에(전치사구, 뒤에 명사)","instead of":"~ 대신에(전치사구, 뒤에 명사)","are getting":"점점 ~해지고 있다(get의 현재진행형, 복수 주어)","is getting":"점점 ~해지고 있다(get의 현재진행형, 단수 주어)","getting":"~해지는 것, ~해지는(get의 -ing형)","gets":"~해지다(get의 3인칭 단수 현재형)","to ge
