tablishing realistic self-boundaries, you can protect that relationship.","ko":"현실적인 자기 경계를 확립함으로써, 여러분은 그 관계를 보호할 수 있다.","hl":["realistic self-boundaries"],"khl":["현실적인 자기 경계를"],"blocks":[{"t":"p","h":"화살표가 어디로 가나","x":["realistic(현실적인) → self-boundaries(자기 경계).","화살표가 명사로 간다.","명사를 꾸미는 건 형용사의 일이다.","realistically(현실적으로)는 동사나 형용사를 꾸미는 부사다.","부사는 명사 앞에 혼자 서지 못한다."]},{"t":"pair","h":"쉬운 예시","x":[["He has a kind heart.","그는 친절한 마음을 가졌다. (명사 heart(마음) ← 형용사)"],["He speaks kindly.","그는 친절하게 말한다. (동사 speaks(말한다) ← 부사)"]]}],"post":["명사 앞은 형용사: realistic self-boundaries(현실적인 자기 경계)"]},{"slots":[["protect","","","조동사 can(~할 수 있다) 뒤라 동사원형이 맞다."],["who","whom","a","관계사 뒤에 주어가 없다(are seen(만나진다)이 바로 온다). 주어 자리를 채우는 건 주격 who(~하는)."],["them","","","앞의 patients(환자들)를 받는다. 여럿이니까 them(그들을)."],["that2","","","feel(느끼다)의 목적어가 되는 명사절. 뒤 문장이 완전해서 that(~라는 것)."],["to_treat","","","need(~할 필요가 있다) 뒤에는 to부정사가 목적어로 온다."]],"opts":["who","whose","what","where"],"or":["who(~하는): 선행사가 사람 patients(환자들)이고 뒤에 주어가 빠져 있어서 주격 관계대명사가 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 있어야 하는데 are seen(만나진다)이 바로 와서 안 됨.","what(~하는 것): 앞에 명사 patients(환자들)가 이미 있어서 못 옴.","where(~하는 곳): 장소를 받는 말인데 patients(환자들)는 장소가 아니고, 뒤에 주어도 빠져 있음."],"point":"관계대명사의 격","en":"When working with patients who are seen frequently, it is easy to start to think of them as friends.","ko":"자주 만나게 되는 환자들을 상대로 일할 때는, 그들을 친구처럼 생각하기 시작하기 쉽다.","hl":["patients who are seen"],"khl":["자주 만나게 되는 환자들을"],"blocks":[{"t":"p","h":"빈자리가 어디인지 본다","x":["관계사 뒤 문장에서 빠진 자리를 찾는다.","who are seen frequently(자주 만나지는): 동사 are seen(만나진다) 앞에 주어가 없다.","빈자리가 주어 자리면 주격 who(~하는).","whom(~을)은 목적어 자리가 빌 때만 쓴다.","whom(~을)을 쓰면 주어 없는 문장이 그대로 남는다."]},{"t":"pair","h":"쉬운 예시","x":[["I have a friend who lives in Busan.","나는 부산에 사는 친구가 있다. (lives(산다) 앞 주어 자리가 빔 → who)"],["She is the girl whom I met yesterday.","그녀는 내가 어제 만난 소녀다. (met(만났다)의 목적어 자리가 빔 → whom)"]]},{"t":"tap","h":"확인 질문","q":"who(~하는) 뒤에서 빠진 것은 주어인가, 목적어인가?","a":["주어다. are seen(만나진다) 앞에 주인이 없다.","그래서 주격 who(~하는)."]}],"post":["주어 빈자리 → who(~하는): patients who are seen(만나지는 환자들)"]},{"slots":[["working","","","여러분이 일하는 능동이라 When working(일할 때)."],["that","what","a","앞에 명사 personal information(개인 정보)이 있다. 명사를 뒤에서 꾸밀 땐 what(~하는 것)이 아니라 that(~하는)."],["is","","","선행사 information(정보)은 셀 수 없는 명사라 단수 is(~이다)."],["embarrassing","","","가주어 it(그것), 즉 그 정보를 나누는 일이 난처함을 \"주는\" 쪽이라 -ing."],["keep2","","","Be friendly(친절하라) and keep(그리고 두어라). 명령문 두 개가 and(그리고)로 나란하다."]],"opts":["whom","whose","that","where"],"or":["whom(~을): 사람을 받는 목적격이라 정보(사물)에도 안 맞고, 빠진 자리도 주어 자리임.","whose(~의): 뒤에 꾸밀 명사가 와야 하는데 is(~이다)가 바로 와서 안 됨.","that(~하는): 명사 personal information(개인 정보)을 꾸미고, 뒤에 주어가 빠져 있어서 주격 관계대명사가 맞음.","where(~하는 곳): 장소를 받는 말이고 뒤 문장이 완전해야 하는데 주어가 빠져 있음."],"point":"that/which vs. what","en":"With a friend, you are likely to share personal information that is not appropriate with a patient.","ko":"여러분은 환자와는 공유하기 적절하지 않은 개인 정보를 친구와 나눌 가능성이 있다.","hl":["personal information that is not appropriate"],"khl":["적절하지 않은 개인 정보를"],"blocks":[{"t":"p","h":"what(~하는 것)은 명사를 이미 품고 있다","x":["what(~하는 것) = the thing that(~하는 것).","what(~하는 것) 안에 \"것\"이라는 명사가 들어 있다.","그래서 앞에 명사가 있으면 what(~하는 것)을 쓸 수 없다.","personal information what(개인 정보 ~하는 것)은 명사가 두 번 겹친 꼴이다.","앞 명사를 뒤에서 꾸미는 말은 that(~하는)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the book that I love.","이것은 내가 아주 좋아하는 책이다. (명사 the book(책) + that)"],["What I love is this book.","내가 아주 좋아하는 것은 이 책이다. (앞에 명사 없이 what)"]]}],"post":["명사(personal information = 개인 정보) + that(~하는) / 명사 없으면 what(~하는 것)"]},{"slots":[["to_keep","","","가주어 It(그것) 뒤 진짜 주어 자리라 to부정사."],["that2","","","feel(느끼다) 뒤 목적어 명사절. 뒤가 완전한 문장이라 that(~라는 것)."],["because","because of","a","뒤에 you are their friend(여러분이 그들의 친구이다)라는 문장이 온다. 문장 앞은 접속사 because(~ 때문에)."],["be_thought","","","자기 경계는 사람에게 \"여겨지는\" 쪽이라 수동태 be thought(여겨지다)."],["keep","","","need to treat(대할 필요가 있다) ... and (to) keep(그리고 유지할). to 뒤 동사원형끼리 나란하다."]],"opts":["due to","despite","in spite of","because"],"or":["due to(~ 때문에): 전치사라 뒤에 명사만 오고 문장은 못 받음.","despite(~에도 불구하고): 전치사라 문장을 못 받고, 뜻도 반대가 됨.","in spite of(~에도 불구하고): 전치사라 문장을 못 받고, 뜻도 흐름과 반대임.","because(~ 때문에): 뒤에 주어 you(여러분)와 동사 are(~이다)가 있는 문장이 와서 접속사가 맞음."],"point":"접속사 vs. 전치사","en":"Patients may feel that they cannot share important health-related information because you are their friend.","ko":"환자들은 여러분이 자신들의 친구이기 때문에 중요한 건강 관련 정보를 자신들이 공유할 수 없다고 느낄 수도 있다.","hl":["because you are their friend"],"khl":["친구이기 때문에"],"blocks":[{"t":"p","h":"뒤를 보고 고른다","x":["because(~ 때문에)와 because of(~ 때문에)는 뜻이 같다.","다른 건 뒤에 오는 모양이다.","because(~ 때문에) + 주어 + 동사(문장)","because of(~ 때문에) + 명사","여기는 you are their friend(여러분이 그들의 친구이다). 주어와 동사가 있는 문장이다."]},{"t":"pair","h":"쉬운 예시","x":[["I was late because it snowed.","눈이 와서 나는 늦었다. (because(~ 때문에) + 문장)"],["I was late because of the snow.","눈 때문에 나는 늦었다. (because of(~ 때문에) + 명사)"]]}],"post":["because(~ 때문에) + 문장 / because of(~ 때문에) + 명사"]}],"quiz":[{"s":"It is fun ___ soccer with friends.","o":["plays","to play"],"a":1,"ko":"친구들과 축구를 하는 것은 재미있다.","why":"가주어 It(그것) 뒤 진짜 주어 자리는 to부정사.","wy":"plays(하다): 동사 is(~이다)가 이미 있어서 동사가 둘이 됨."},{"s":"She gave a ___ answer.","o":["clear","clearly"],"a":0,"ko":"그녀는 분명한 대답을 했다.","why":"명사 answer(대답)를 꾸미니 형용사.","wy":"clearly(분명하게): 부사라 명사 answer(대답)를 꾸밀 수 없음."},{"s":"I know a boy ___ lives next door.","o":["who","whom"],"a":0,"ko":"나는 옆집에 사는 소년을 안다.","why":"lives(산다) 앞 주어 자리가 비어 있어 주격 who(~하는).","wy":"whom(~을): 목적어 자리가 빌 때 쓰는 말인데 여기는 주어 자리가 빔."},{"s":"This is the bag ___ I bought yesterday.","o":["what","that"],"a":1,"ko":"이것은 내가 어제 산 가방이다.","why":"앞에 명사 the bag(가방)이 있어서 that(~하는).","wy":"what(~하는 것): 명사를 품은 말이라 앞에 명사 the bag(가방)이 있으면 못 옴."},{"s":"I stayed home ___ I was sick.","o":["because of","because"],"a":1,"ko":"나는 아파서 집에 있었다.","why":"뒤에 I was sick(나는 아팠다)이라는 문장이 와서 접속사 because(~ 때문에).","wy":"because of(~ 때문에): 전치사라 뒤에 명사만 옴."}]},{"items":[{"slots":[["establishing","establish","a","By(~함으로써)는 전치사다. 전치사 뒤에 동사를 쓰려면 동명사(-ing) 옷을 입는다."],["protect","","","조동사 can(~할 수 있다) 뒤라 동사원형."],["are_seen","","","선행사 ],"khl":["스스로에게"],"blocks":[{"t":"p","h":"거울 보기","x":["주어가 한 행동이 자기 자신에게 돌아오면 재귀대명사(-self(~ 자신), -selves(~ 자신들))를 쓴다.","박탈하는 사람: super-tasters(초미각자들)","박탈당하는 사람: 바로 그 super-tasters(초미각자들)","거울에 비친 자기 모습이라 themselves(그들 자신).","them(그들을)을 쓰면 다른 사람들을 박탈하는 뜻이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["The kids enjoyed themselves.","아이들은 즐거운 시간을 보냈다. (아이들 → 아이들 자신)"],["I looked at myself in the mirror.","나는 거울 속 나 자신을 보았다. (I → myself(나 자신))"]]}],"post":["deprive A of B(A에게서 B를 빼앗다): 나 자신이면 themselves(그들 자신)"]}],"compquiz":[{"s":"She left the room, ___ the door.","o":["closes","closing"],"a":1,"ko":"그녀는 문을 닫으며 방을 나갔다.","why":"동사 left(나갔다)가 이미 있어 덧붙임은 -ing.","wy":"closes(닫다, 3인칭 단수형): 접속사 없이 동사가 하나 더 생김."},{"s":"The kids enjoyed ___ at the party.","o":["them","themselves"],"a":1,"ko":"아이들은 파티에서 즐거운 시간을 보냈다.","why":"아이들이 자기 자신을 즐겁게 한 것이라 재귀대명사.","wy":"them(그들을): 다른 사람들을 가리키게 되어 뜻이 안 맞음."}]},{"id":"2510g2-22","no":"22","title":"어법특훈 · 25년 10월 고2 22번","sub":"무지를 받아들이는 실험 과학","tpl":"Experiments {testify|testify} to science's embrace of ignorance. Arguably the worst thing a scientist can do {is|is} {to_suppose|to suppose} they know {what|what} will happen in a given scenario without {bothering|bothering} to check. The rise of the experimental philosophy {coincided|coincided} with the liberation of curiosity as a {valuable|valuable} rather than a questionable attribute. For all that experimental science today is often assumed to be {supported|supported} by a philosophical framework and an {approved|approved} methodology (\"state your hypothesis and then {test|test} {it|it}\"), the fact is {that|that}, as philosopher of science Ian Hacking says, \"One can {conduct|conduct} an experiment {simply|simply} out of curiosity to see what will happen.\" Indeed, in the view of Charles Darwin's son, the astronomer George Darwin, once in a while one should {do|do} a completely crazy experiment, even if it is most likely to {prove|prove} {fruitless|fruitless}. You never know until you {try|try}. 칭 단수 현재형)","trying":"해 보는 것(try의 -ing형)","to try":"해 보는 것(try의 to부정사)","play":"(운동을) 하다(동사원형·현재형)","plays":"(운동을) 하다(play의 3인칭 단수 현재형)","draw":"그리다(동사원형)","drawing":"그리는 것(draw의 -ing형, 동명사)","came":"왔다(come의 과거형)","coming":"오는 것, 오는(come의 -ing형)","loves":"사랑하다(love의 3인칭 단수 현재형)","is loved":"사랑받다(love의 수동태)","easy":"쉬운(형용사)","easily":"쉽게(부사)","close":"닫다(동사원형)","closing":"닫는 것(close의 -ing형)","rain":"비가 오다(동사원형)","raining":"비가 오는 것(rain의 -ing형)","come":"오다(동사원형·현재형)","will come":"올 것이다(come의 미래형)"},"sets":[{"items":[{"slots":[["testify","testifies","a","주어 Experiments(실험들)는 복수다. 복수 주어 뒤 현재형 동사에는 s를 붙이지 않는다."],["what","","","know(알다)의 목적어 자리. what(무엇이)이 will happen(일어날 것이다)의 주어 역할까지 한다."],["coincided","","","주어 The rise(등장)의 진짜 동사다. 과거 이야기라 과거형."],["conduct","","","조동사 can(~할 수 있다) 뒤라 동사원형."],["fruitless","","","prove(~로 판명되다) 뒤 보어 자리라 형용사."]],"opts":["testifying","testify","to testify","having testified"],"or":["testifying(입증하는): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","testify(입증하다): 복수 주어 Experiments(실험들)에 맞는 현재형 동사라 맞음.","to testify(입증하는 것): to부정사도 동사 자리에 못 와서 주어 뒤 동사가 비게 됨.","having testified(입증하고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"주어-동사 수일치","en":"Experiments testify to science's embrace of ignorance.","ko":"실험은 과학이 무지를 받아들인다는 것을 입증한다.","hl":["Experiments","testify"],"khl":["실험은","입증한다"],"blocks":[{"t":"p","h":"s는 하나일 때만 붙는 표시","x":["현재형 동사 끝의 s는 주어가 하나(3인칭 단수)라는 표시다.","Experiments(실험들)는 끝에 s가 붙은 복수 명사다.","명사의 s는 여럿이라는 표시, 동사의 s는 하나라는 표시.","그래서 명사에 s가 있으면 동사에는 s가 빠진다."]},{"t":"pair","h":"쉬운 예시","x":[["Dogs bark at night.","개들은 밤에 짖는다. (Dogs(개들) 복수 → bark(짖다))"],["My dog barks at night.","우리 개는 밤에 짖는다. (My dog(우리 개) 단수 → barks(짖는다))"]]}],"post":["명사 s 있으면 동사 s 없음: Experiments testify(실험은 입증한다)"]},{"slots":[["is","","","주어는 the worst thing(가장 나쁜 일), 단수라 is(~이다)."],["what","that","a","know(알다) 뒤에 명사가 없고, will happen(일어날 것이다)에는 주어가 빠져 있다. 명사 없이 빈자리를 채우는 건 what(무엇이)."],["bothering","","","전치사 without(~없이) 뒤라 동명사."],["valuable","","","명사 attribute(특성)를 꾸미는 형용사."],["test","","","state(세워라)와 and then(그러고 나서)으로 나란한 명령문 동사원형."]],"opts":["whose","what","where","whom"],"or":["whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 will(~할 것이다)이 와서 안 됨.","what(무엇이): 앞에 명사가 없고 뒤 will happen(일어날 것이다)에 주어가 빠져 있어 맞음.","where(어디서): 뒤에 빠진 것 없는 문장이 와야 하는데 주어가 빠져 있음.","whom(~을): 목적어 빈자리를 채우는 말이라 주어 빈자리에 못 옴."],"point":"that vs. what","en":"Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check.","ko":"거의 틀림없이 과학자가 할 수 있는 가장 나쁜 일은 확인하는 수고도 없이 주어진 상황에서 무슨 일이 일어날지 안다고 짐작하는 것이다.","hl":["know what will happen"],"khl":["무슨 일이 일어날지 안다고"],"blocks":[{"t":"p","h":"빈자리 탐지기","x":["what(무엇이, ~하는 것)은 앞에 명사가 없고 뒤 문장에 빈자리가 있을 때 쓴다.","know(알다) 뒤를 보자. 명사 없이 바로 ___ will happen(일어날 것이다).","happen(일어나다)의 주어 자리가 비어 있다.","that(~라는 것)은 뒤가 꽉 찬 문장일 때만 쓴다. 여기는 빈자리가 있으니 that은 탈락."]},{"t":"pair","h":"쉬운 예시","x":[["I know what you want.","나는 네가 원하는 것을 안다. (want(원하다)의 목적어가 빈자리 → what)"],["I know that you are busy.","나는 네가 바쁘다는 것을 안다. (you are busy(네가 바쁘다)는 꽉 찬 문장 → that)"]]},{"t":"tap","h":"확인 질문","q":"what(무엇이) 뒤에서 빠진 자리는 어디인가?","a":["will happen(일어날 것이다)의 주어 자리.","무엇이 일어날지 = what will happen(무슨 일이 일어날지)."]}],"post":["명사 없음 + 주어 빈자리 → what will happen(무슨 일이 일어날지)"]},{"slots":[["to_suppose","","","is(~이다) 뒤 보어 자리. \"짐작하는 것\"이라는 뜻의 to부정사."],["bothering","to bother","a","without(~없이)은 전치사다. 전치사 뒤에 동사가 오려면 -ing(동명사)."],["supported","","","science(과학)가 틀에 의해 \"뒷받침되는\" 쪽이라 수동 be supported(뒷받침되다)."],["it","","","your hypothesis(너의 가설) 하나를 가리키니 it(그것)."],["simply","","","out of curiosity(호기심에서)를 꾸미는 부사. \"그저 호기심에서\"."]],"opts":["bother","bothered","bothering","bothers"],"or":["bother(수고하다): 전치사 뒤에 동사원형은 못 옴.","bothered(수고했다, bother의 과거·과거분사형): 전치사 뒤에 과거형은 못 오고, 과학자가 직접 수고하는 능동이라 p.p.도 안 맞음.","bothering(수고하는 것, 동명사): 전치사 without(~없이) 뒤라 동명사가 맞음.","bothers(수고하다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음."],"point":"전치사 + 동명사","en":"Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check.","ko":"거의 틀림없이 과학자가 할 수 있는 가장 나쁜 일은 확인하는 수고도 없이 주어진 상황에서 무슨 일이 일어날지 안다고 짐작하는 것이다.","hl":["without bothering to check"],"khl":["확인하는 수고도 없이"],"blocks":[{"t":"p","h":"전치사 뒤는 명사 전용석","x":["without(~없이), for(~해서), by(~함으로써) 같은 전치사 뒤는 명사 전용석이다.","동사가 이 자리에 앉으려면 -ing 옷을 입고 동명사가 되어야 한다.","without bothering(수고도 하지 않고)이 바로 그 모양이다.","뒤의 to check(확인하려고)는 bother(수고하다)에 딸린 꼬리다."]},{"t":"pair","h":"쉬운 예시","x":[["She left without eating breakfast.","그녀는 아침을 먹지 않고 떠났다. (without eating = 먹지 않고)"],["Thank you for calling me.","전화해 줘서 고마워. (for calling = 전화해 줘서)"]]}],"post":["전치사 뒤는 -ing: without bothering(수고도 없이)"]},{"slots":[["testify","","","복수 주어 Experiments(실험들)에 맞춘 현재형 동사."],["coincided","coinciding","a","주어 The rise(등장) 뒤에 진짜 동사가 하나도 없게 된다. 문장에는 동사가 꼭 하나 있어야 한다."],["approved","","","방법론이 \"승인된\" 쪽이라 과거분사가 명사 methodology(방법론)를 꾸민다."],["that","","","the fact is(사실은 ~이다) 뒤 빠진 것 없는 문장을 이끄는 that(~라는 것)."],["do","","","조동사 should(~해야 한다) 뒤라 동사원형."]],"opts":["to coincide","having coincided","coincide","coincided"],"or":["to coincide(동시에 일어나는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","having coincided(동시에 일어나고 나서): 완료 -ing형이라 동사 자리에 못 옴.","coincide(동시에 일어나다): 주어 The rise(등장)는 단수라 s 없는 현재형이 안 맞고, 과거 이야기와도 안 맞음.","coincided(동시에 일어났다): 주어 The rise(등장)의 진짜 동사이고 과거 이야기라 맞음."],"point":"정동사 vs. 준동사","en":"The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute.","ko":"실험 철학의 등장은 호기심이 의심스러운 특성이 아니라 가치 있는 특성으로 해방된 것과 동시에 일어났다.","hl":["The rise","coincided"],"khl":["등장은","동시에 일어났다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["주어는 The rise(등장). of the experimental philosophy(실험 철학의)는 꼬리표다.","이 문장에서 진짜 동사 후보는 coincided(동시에 일어났다) 하나뿐이다.","이걸 coinciding(동시에 일어나는)으로 바꾸면 동사가 0개가 된다.","동사가 없으면 문장이 아니라 그냥 긴 명사 덩어리다."]},{"t":"pair","h":"쉬운 예시","x":[["The price of apples rose last week.","사과 가격이 지난주에 올랐다. (진짜 동사 rose(올랐다))"],["The boy wearing a cap ran fast.","모자를 쓴 소년이 빨리 달렸다. (wearing(쓴)은 꼬리표, 진짜 동사는 ran(달렸다))"]]}],"post":["주어 The rise(등장) + 진짜 동사 coincided(동시에 일어났다)"]},{"slots":[["what","","","know(알다) 뒤, 주어가 빠진 will happen(일어날 것이다)을 이끄는 what(무엇이)."],["valuable","","","명사 attribute(특성)를 꾸미는 형용사 자리."],["supported","supporting","a","과학은 틀에 의해 뒷받침을 \"받는\" 쪽이다. 뒤에 목적어가 없고 by(~에 의해)가 있으니 수동."],["conduct","","","조동사 can(~할 수 있다) 뒤 동사원형."],["try","","","until(~할 때까지) 뒤는 앞으로의 일이라도 현재형."]],"opts":["support","supports","supported","to support"],"or":["support(뒷받침하다): be(~이다) 뒤에 동사원형이 또 올 수 없음.","supports(뒷받침하다, 3인칭 단수형): be(~이다) 뒤에 동사가 또 올 수 없음.","supported(뒷받침되는): be supported by(~에 의해 뒷받침되다)라는 수동 모양이라 맞음.","to support(뒷받침하는 것): be(~이다) 뒤에 to부정사가 겹쳐 수동 모양이 깨지고 by(~에 의해)와도 안 맞음."],"point":"능동태 vs. 수동태","en":"For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology","ko":"오늘날의 실험 과학은 철학적 틀과 승인된 방법론에 의해 뒷받침된다고 흔히 여겨지지만","hl":["to be supported by"],"khl":["뒷받침된다고"],"blocks":[{"t":"p","h":"받는 쪽이면 be + p.p.","x":["support(뒷받침하다)는 무엇을 받쳐 주는 동사다.","이 문장에서 science(과학)는 받쳐 주는 쪽이 아니라 받침을 받는 쪽이다.","받는 쪽이면 be + p.p.(과거분사) 모양을 쓴다.","by a philosophical framework(철학적 틀에 의해)가 받쳐 주는 쪽을 알려 주는 힌트다."]},{"t":"pair","h":"쉬운 예시","x":[["The bridge is supported by strong poles.","그 다리는 튼튼한 기둥이 받치고 있다. (다리가 받침을 받음 → is supported(받쳐진다))"],["Strong poles support the bridge.","튼튼한 기둥이 그 다리를 받친다. (기둥이 받쳐 줌 → support(받치다))"]]}],"post":["by(~에 의해) 앞은 be + p.p.: be supported by(~에 의해 뒷받침되다)"]}],"quiz":[{"s":"My friends ___ soccer every day.","o":["play","plays"],"a":0,"ko":"내 친구들은 매일 축구를 한다.","why":"주어 My friends(내 친구들)가 복수라 s 없는 play(하다).","wy":"plays(하다, 3인칭 단수형): 주어가 하나일 때 쓰는 모양이라 복수 주어와 안 맞음."},{"s":"I don't know ___ is in the box.","o":["that","what"],"a":1,"ko":"나는 상자 안에 무엇이 있는지 모른다.","why":"앞에 명사가 없고 is(있다)의 주어가 비어 있으니 what(무엇이).","wy":"that(~라는 것): 뒤가 완전한 문장이어야 하는데 is(있다)의 주어가 빠져 있음."},{"s":"She is good at ___ pictures.","o":["drawing","draw"],"a":0,"ko":"그녀는 그림을 잘 그린다.","why":"전치사 at(~에) 뒤라 동명사 drawing(그리는 것).","wy":"draw(그리다): 전치사 뒤에 동사원형은 못 옴."},{"s":"My dad ___ home late last night.","o":["came","coming"],"a":0,"ko":"아빠는 어젯밤 늦게 집에 오셨다.","why":"주어 My dad(아빠)의 진짜 동사가 필요하니 came(왔다).","wy":"coming(오는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐."},{"s":"This song ___ by many people.","o":["loves","is loved"],"a":1,"ko":"이 노래는 많은 사람에게 사랑받는다.","why":"노래가 사랑을 받는 쪽이고 by(~에 의해)가 있으니 수동 is loved(사랑받다).","wy":"loves(사랑하다): 능동이라 노래가 누군가를 사랑한다는 뜻이 되고 목적어도 없음."}]},{"items":[{"slots":[["is","are","a","주인은 the worst thing(가장 나쁜 일), 하나다. a scientist can do(과학자가 할 수 있는)는 꼬리표."],["coincided","","","주어 The rise(등장)의 진짜 동사, 과거형."],["test","","","state(세워라)와 나란한 명령문 동사원형."],["simply","","","out of curiosity(호기심에서)를 꾸미는 부사, \"그저\"."],["fruitless","","","prove(~로 판명되다) 뒤 보어 자리라 형용사."]],"opts":["is","being","to be","been"],"or":["is(~이다): 주어 the worst thing(가장 나쁜 일)이 단수라 맞음.","being(~인 것): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to be(~이 되는 것): to부정사도 동사 자리에 못 옴.","been(~였던, be의 과거분사형): have(가지다) 없이 혼자 동사 자리에 못 옴."],"point":"수식받는 주어의 수일치","en":"Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check.","ko":"거의 틀림없이 과학자가 할 수 있는 가장 나쁜 일은 확인하는 수고도 없이 주어진 상황에서 무슨 일이 일어날지 안다고 짐작하는 것이다.","hl":["the worst thing","is to suppose"],"khl":["가장 나쁜 일은","짐작하는 것이다"],"blocks":[{"t":"p","h":"꼬리표 떼기","x":["the worst thing(가장 나쁜 일) 뒤에 a scientist can do(과학자가 할 수 있는)가 붙어 있다.","원래는 the worst thing that a scientist can do(과학자가 할 수 있는 가장 나쁜 일). that(~하는)이 생략된 꼬리표다.","꼬리표 안의 scientist(과학자), do(하다)에 속지 말 것.","주인은 thing(일) 하나라서 is(~이다)."]},{"t":"pair","h":"쉬운 예시","x":[["The cake my mom made is delicious.","엄마가 만든 케이크는 맛있다. (주인 The cake(케이크) → is(~이다))"],["The books I bought are heavy.","내가 산 책들은 무겁다. (주인 The books(책들) → are(~이다))"]]}],"post":["꼬리표 a scientist can do(과학자가 할 수 있는) 떼고 주인 the worst thing(가장 나쁜 일) → is(~이다)"]},{"slots":[["that","","","the fact is(사실은 ~이다) 뒤 꽉 찬 문장을 이끄는 that(~라는 것)."],["conduct","","","조동사 can(~할 수 있다) 뒤 동사원형."],["simply","simple","a","이 자리는 명사를 꾸미는 자 lor of the flowers is red.","그 꽃들의 색깔은 빨간색이다. (주인 The color(색깔) → is(~이다))"]]}],"post":["꼬리표 of Newton and Einstein(뉴턴과 아인슈타인의) 떼고 주인 The theories(이론들) → offer(제공하다)"]},{"slots":[["replace","replacing","a","can(~할 수 있다) 뒤에 discard(버리다) or(또는) replace(바꾸다). 둘 다 can(~할 수 있다)에 걸린 동사원형이다."],["supports","","","선행사 the evidence(증거)가 단수라 supports(뒷받침하다)."],["where","","","cases(경우들) 뒤, 빠진 것 없는 문장을 이끄는 관계부사."],["be_ignored","","","성과는 무시를 \"당하는\" 쪽이라 수동 be ignored(무시되다)."],["broader","","","뒤에 than(~보다)이 있으니 비교급."]],"opts":["replace","replaces","replaced","to replace"],"or":["replace(바꾸다): can(~할 수 있다) 뒤 discard(버리다)와 or(또는)로 나란한 동사원형이라 맞음.","replaces(바꾸다, 3인칭 단수형): 조동사 can(~할 수 있다)에 걸린 동사라 s를 붙일 수 없음.","replaced(바꿨다, replace의 과거·과거분사형): discard(버리다)는 원형인데 뒤만 과거형이라 짝이 안 맞음.","to replace(바꾸는 것): can(~할 수 있다) 뒤에 to부정사는 못 오고 discard(버리다)와도 모양이 다름."],"point":"병렬구조","en":"We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.","ko":"우리는 과학 이론을 뒷받침하는 증거를 설명할 더 나은 방법이 있을 때에만 그 이론을 버리거나 바꿀 수 있다.","hl":["can discard or replace"],"khl":["버리거나 바꿀 수 있다"],"blocks":[{"t":"p","h":"조동사 하나가 동사 둘을 끈다","x":["can(~할 수 있다)이 기차 머리, discard(버리다)와 replace(바꾸다)가 뒤에 달린 칸이다.","can discard(버릴 수 있다) or (can) replace(바꿀 수 있다).","두 번째 can(~할 수 있다)은 겹치니 생략했을 뿐이다.","그래서 두 칸 모두 동사원형이어야 한다."]},{"t":"pair","h":"쉬운 예시","x":[["You can stay or leave.","너는 머물러도 되고 떠나도 된다. (can stay or leave = 머물 수도, 떠날 수도)"],["She will sing and dance.","그녀는 노래하고 춤출 것이다. (will sing and dance = 노래하고 춤출 것이다)"]]}],"post":["can(~할 수 있다) + 원형 or 원형: can discard or replace(버리거나 바꿀 수 있다)"]},{"slots":[["that","what","a","앞에 the evidence(증거)라는 명사가 있다. 명사를 꾸미는 관계대명사는 that(~하는). what(~하는 것)은 앞에 명사를 둘 수 없다."],["supports2","","","주인은 A vast body(방대한 양), 단수라 supports(뒷받침하다). of evidence(증거의)는 꼬리표."],["perfectly","","","동사 match(일치하다)를 꾸미는 부사."],["which","","","콤마 뒤에서 앞의 his general theory of relativity(그의 일반 상대성 이론)를 덧붙여 설명하는 which(그리고 그것은)."],["gains","","","If(만약 ~하면) 조건절이라 앞으로의 일도 현재형. 주어가 단수라 gains(얻다)."]],"opts":["whom","that","whose","where"],"or":["whom(~을): 사람 명사를 받는 목적격이라 사물 the evidence(증거)도, 주어 빈자리도 못 받음.","that(~하는): 명사 the evidence(증거) 뒤에서 주어가 빠진 supports it(그것을 뒷받침한다)을 이끄는 관계대명사라 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 동사 supports(뒷받침하다)가 와서 안 됨.","where(~하는): 뒤에 빠진 것 없는 문장이 와야 하는데 주어가 빠져 있음."],"point":"that vs. what","en":"We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.","ko":"우리는 과학 이론을 뒷받침하는 증거를 설명할 더 나은 방법이 있을 때에만 그 이론을 버리거나 바꿀 수 있다.","hl":["the evidence that supports it"],"khl":["뒷받침하는 증거를"],"blocks":[{"t":"p","h":"what(~하는 것)은 명사를 이미 삼켰다","x":["what(~하는 것) = the thing which(~하는 것). 속에 명사가 들어 있다.","그래서 앞에 the evidence(증거) 같은 명사가 있으면 what(~하는 것)은 못 온다.","명사 뒤에서 꾸미는 말은 that(~하는) 또는 which(~하는).","the evidence that supports it(그것을 뒷받침하는 증거)."]},{"t":"pair","h":"쉬운 예시","x":[["I like the song that you sang.","나는 네가 부른 노래가 좋다. (명사 the song(노래) + that)"],["I like what you sang.","나는 네가 부른 것이 좋다. (명사 없이 what)"]]},{"t":"tap","h":"확인 질문","q":"that(~하는) 뒤 supports it(그것을 뒷받침한다)에서 빠진 자리는?","a":["주어 자리.","무엇이 뒷받침하나? 바로 the evidence(증거)."]}],"post":["명사 the evidence(증거) + that(~하는) + 주어 빈자리"]},{"slots":[["explaining","","","전치사 of(~의) 뒤 동명사."],["offer","","","복수 주어 The theories(이론들)에 맞춘 동사."],["perfectly","perfect","a","did not(~하지 않았다)과 동사 match(일치하다) 사이에서 동사를 꾸미는 자리. 형용사는 동사를 꾸밀 수 없다."],["had_not_been","","","would not have gained(얻지 못했을 것이다)와 짝인 가정법 과거완료. if(만약 ~라면)절은 had p.p.(과거완료형)."],["why","","","that is why(그래서 ~이다). 이유를 나타내는 관계부사."]],"opts":["perfection","perfectly","perfects","perfected"],"or":["perfection(완벽함): 명사라 동사 match(일치하다)를 꾸밀 수 없음.","perfectly(완벽하게): 동사 match(일치하다)를 꾸미는 부사라 맞음.","perfects(완벽하게 하다, 3인칭 단수형): did not(~하지 않았다) 뒤에 s 붙은 동사가 못 오고 match(일치하다)와 동사가 겹침.","perfected(완벽하게 했다, perfect의 과거·과거분사형): did not(~하지 않았다) 뒤 원형 자리에 안 맞고 match(일치하다)와 동사가 겹침."],"point":"형용사 자리 vs. 부사 자리","en":"by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations.","ko":"19세기 후반 무렵 과학자들은 그것의 예측이 관찰 결과와 완벽하게 일치하지 않는 경우들을 발견하기 시작했다.","hl":["did not perfectly match"],"khl":["완벽하게 일치하지 않는"],"blocks":[{"t":"p","h":"동사 옆에 붙는 꾸밈말","x":["perfectly(완벽하게) → match(일치하다). 화살표가 동사로 간다.","동사를 꾸미는 건 부사(-ly).","perfect(완벽한)는 a perfect score(만점)처럼 명사를 꾸민다.","같은 지문의 equally well(똑같이 잘)도 부사가 부사를 꾸미는 모양이다."]},{"t":"pair","h":"쉬운 예시","x":[["He did not clearly answer.","그는 분명하게 대답하지 않았다. (answer(대답하다) ← clearly(분명하게))"],["He gave a clear answer.","그는 분명한 대답을 했다. (answer(대답) ← clear(분명한))"]]}],"post":["동사 match(일치하다) 꾸미면 -ly: perfectly match(완벽하게 일치하다)"]},{"slots":[["discard","","","조동사 can(~할 수 있다) 뒤 동사원형."],["where","","","cases(경우들) 뒤 완전한 문장을 이끄는 관계부사."],["were_explained","","","불일치가 설명\"되는\" 쪽이라 수동."],["had_not_been","has not been","a","앞이 would not have gained(얻지 못했을 것이다), 과거 사실의 반대를 상상하는 가정법 과거완료다. if(만약 ~라면)절에는 has p.p.(현재완료형)가 아니라 had p.p.(과거완료형)가 짝이다."],["does","","","work(작동하다)를 대신 받는 대동사. 주어 Einstein's theory(아인슈타인의 이론)가 단수라 does(하다)."]],"opts":["is not","will not be","would not be","had not been"],"or":["is not(~이지 않다): 현재형이라 과거 일을 반대로 상상하는 가정법 과거완료와 짝이 안 맞음.","will not be(~이지 않을 것이다): 미래형이라 과거 일을 상상하는 문장과 시제가 정반대임.","would not be(~이지 않을 것이다): would(~할 것이다)는 콤마 앞 큰 문장 쪽에 오는 말이라 if(만약 ~라면)절에 못 옴.","had not been(~이지 않았다면): would not have gained(얻지 못했을 것이다)와 짝을 이루는 과거완료형이라 맞음."],"point":"가정법 과거완료","en":"Einstein's theory would not have gained acceptance if it had not been able to explain these successes equally well.","ko":"아인슈타인의 이론이 이러한 성과를 똑같이 잘 설명할 수 없었다면 인정을 받지 못했을 것이다.","hl":["would not have gained","had not been able"],"khl":["받지 못했을 것이다","설명할 수 없었다면"],"blocks":[{"t":"p","h":"상상 문장의 짝꿍","x":["would not have gained(얻지 못했을 것이다)는 \"과거에 이랬다면 저랬을 텐데\"라는 상상이다.","실제로는 아인슈타인 이론이 그 설명을 해냈다. 그 반대를 상상하는 것.","이 상상의 if(만약 ~라면)절은 had p.p.(과거완료형)를 쓴다.","그래서 if it had not been able(그것이 할 수 없었다면)."]},{"t":"pair","h":"쉬운 예시","x":[["If I had studied, I would have passed.","내가 공부했다면 합격했을 ],"opts":["were explained","were explaining","explaining","to explain"],"or":["were explained(설명되었다): 불일치들이 설명을 받는 쪽이고 복수 주어라 were(~였다) + p.p.(과거분사)가 맞음.","were explaining(설명하고 있었다): 능동 진행형이라 불일치들이 무언가를 설명한다는 뜻이 되고, 뒤에 목적어도 없음.","explaining(설명하는): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to explain(설명하는 것): to부정사도 동사 자리에 못 옴."],"point":"능동태 vs. 수동태","en":"These discrepancies were explained only when Einstein developed his general theory of relativity.","ko":"이러한 불일치들은 아인슈타인이 일반 상대성 이론을 만들었을 때에야 비로소 설명되었다.","hl":["These discrepancies","were explained"],"khl":["불일치들은","설명되었다"],"blocks":[{"t":"p","h":"목적어 없는 explain(설명하다)","x":["explain(설명하다)은 \"무엇을\" 설명하는지 뒤에 목적어가 붙는 동사다.","These discrepancies explained(이러한 불일치들은 설명했다)라고 하면 무엇을 설명했는지가 비어 버린다.","불일치는 설명하는 쪽이 아니라 설명되는 쪽이다.","받는 쪽이면 be + p.p.: were explained(설명되었다)."]},{"t":"pair","h":"쉬운 예시","x":[["The window was broken by the wind.","창문이 바람에 깨졌다. (창문이 깨짐을 당함 → was broken(깨졌다))"],["The wind broke the window.","바람이 창문을 깼다. (바람이 깸 → broke(깼다) + 목적어)"]]}],"post":["받는 쪽 + 목적어 없음 → were explained(설명되었다)"]},{"slots":[["that","","","명사 the evidence(증거)를 꾸미는 관계대명사."],["perfectly","","","동사 match(일치하다)를 꾸미는 부사."],["which","","","콤마 뒤 덧붙임 설명 which(그리고 그것은)."],["broader","broad","a","뒤에 than Newton's theory(뉴턴의 이론보다)가 있다. than(~보다)과 짝을 이루는 건 비교급 broader(더 폭넓은)."],["gains","","","If(만약 ~하면) 조건절은 앞으로의 일도 현재형."]],"opts":["broadest","broadly","broadening","broader"],"or":["broadest(가장 폭넓은): 최상급은 than(~보다)과 짝을 이룰 수 없음.","broadly(폭넓게): 부사라 명사 theory(이론)를 꾸밀 수 없음.","broadening(넓어지는): 비교급이 아니라 뒤의 than(~보다)과 짝이 안 맞음.","broader(더 폭넓은): 뒤의 than(~보다)과 짝을 이루는 비교급이라 맞음."],"point":"비교급","en":"that is why we now view Einstein's theory as a broader theory of gravity than Newton's theory.","ko":"그래서 우리는 이제 아인슈타인의 이론을 뉴턴의 이론보다 더 폭넓은 중력 이론으로 본다.","hl":["a broader theory of gravity than"],"khl":["뉴턴의 이론보다 더 폭넓은"],"blocks":[{"t":"p","h":"than(~보다)이 보이면 비교급","x":["than(~보다)은 두 개를 견주는 말이다.","견줄 때는 형용사 끝에 -er(더 ~한)이나 more(더)를 붙인 비교급을 쓴다.","a broader theory w theory ever gains acceptance, it will have to match all the successes of Einstein's theory.","ko":"만약 어떤 새로운 이론이 언젠가 인정을 받는다면, 그것은 아인슈타인 이론의 모든 성과에 맞먹어야 할 것이다.","hl":["If any new theory ever gains acceptance"],"khl":["인정을 받는다면"],"blocks":[{"t":"p","h":"If(만약 ~하면)절도 문장 하나","x":["If(만약 ~하면)는 접속사다. 뒤에 주어와 진짜 동사가 다 있어야 한다.","주어: any new theory(어떤 새로운 이론).","동사 자리에 gaining(얻는)을 넣으면 If(만약 ~하면)절에 동사가 사라진다.","-ing, to부정사는 동사 옷이 아니다.","조건절은 앞으로의 일도 현재형이라 gains(얻다)."]},{"t":"pair","h":"쉬운 예시","x":[["If he leaves early, he will catch the bus.","그가 일찍 떠나면 버스를 탈 것이다. (leaves(떠나다) = 진짜 동사)"],["When she arrives, I will call you.","그녀가 도착하면 내가 너에게 전화할게. (arrives(도착하다) = 진짜 동사)"]]}],"post":["If(만약 ~하면)절에도 진짜 동사 하나: If any new theory ever gains(만약 새 이론이 언젠가 얻는다면)"]},{"no":"23","slots":[["explaining","","","전치사 of(~의) 뒤 동명사."],["where","","","cases(경우들) 뒤 완전한 문장을 이끄는 관계부사."],["had_not_been","","","would not have gained(얻지 못했을 것이다)와 짝인 가정법 과거완료."],["broader","","","than(~보다)과 짝인 비교급."],["does","do","a","does not(~하지 않는다)은 앞의 work(작동하다)를 대신한다. 주어 Einstein's theory(아인슈타인의 이론)는 단수라 does(하다)."]],"opts":["does","doing","done","to do"],"or":["does(하다, 대동사): 일반동사 work(작동하다)를 대신 받고, 주어가 단수라 맞음.","doing(하는 것): -ing는 혼자 동사 자리에 못 와서 where(~하는)절에 동사가 없어짐.","done(된, do의 과거분사형): have(가지다)나 be(~이다) 없이 혼자 동사 자리에 못 옴.","to do(하는 것): to부정사도 동사 자리에 못 옴."],"point":"대동사(do / does)","en":"it will have to match all the successes of Einstein's theory as well as work in new realms where Einstein's theory does not.","ko":"그것은 아인슈타인의 이론이 작동하지 않는 새로운 영역에서 작동할 뿐만 아니라 아인슈타인 이론의 모든 성과에도 맞먹어야 할 것이다.","hl":["where Einstein's theory does not"],"khl":["작동하지 않는"],"blocks":[{"t":"p","h":"does not 뒤에 숨은 단어","x":["where Einstein's theory does not (work)(아인슈타인의 이론이 작동하지 않는).","반복을 피하려고 work(작동하다)를 지우고 does(하다)만 남겼다.","일반동사를 대신 받는 건 do(하다)다.","주어 theory(이론)가 하나라서 does(하다), 여럿이면 do(하다)."]},{"t":"pair","h":"쉬운 예시","x":[["I like pizza, but my sister does not.","나는 피자를 좋아하지만 내 여동생은 그렇지 않다. (does not = does not like(좋아하지 않는다))"],["My brothers play games, but I do not.","내 형들은 게임을 하지만 나는 하지 않는다. (do not = do not play(하지 않는다))"]]}],"post":["단수 주어 + does not(~하지 않는다) = does not work(작동하지 않는다)"]}],"compquiz":[{"s":"If he ___ early, he will catch the bus.","o":["leaving","leaves"],"a":1,"ko":"그가 일찍 떠나면 버스를 탈 것이다.","why":"If(만약 ~하면)절에도 진짜 동사가 필요해 leaves(떠나다).","wy":"leaving(떠나는): -ing는 혼자 동사 자리에 못 옴."},{"s":"He runs fast, and his sister ___ too.","o":["is","does"],"a":1,"ko":"그는 빨리 달리고, 그의 여동생도 그렇다.","why":"일반동사 runs(달린다)를 대신 받으니 does(하다).","wy":"is(~이다): be동사라 일반동사 runs(달린다)를 대신 받을 수 없음."}]},{"id":"2510g2-24","no":"24","title":"어법특훈 · 25년 10월 고2 24번","sub":"점심시간 뉴로빅 운동의 힘","tpl":"Imagine {pausing|pausing} in the middle of a busy day, {taking|taking} a moment to refresh your mind and recharge your energy. This power of a midday break is often {underestimated|underestimated}. When you break away from routine, especially with activities {designed|designed} to stimulate your brain, you {prevent|prevent} cognitive tiredness and {enhance|enhance} productivity for the rest of the day. Neurobic exercises — simple yet {effective|effective} — {are|are} perfect for such breaks. They target different areas of your brain, {keeping|keeping} it {agile|agile} and alert. These exercises create a mental oasis {that|that} {refreshes|refreshes} and {prepares|prepares} you for the afternoon's challenges. This strategic pause is not just a break; it boosts your cognitive capabilities, {ensuring|ensuring} your mind remains {sharp|sharp} and focused. Even briefly {experimenting|experimenting} with neurobic exercises can work wonders for your cognitive state during lunch. Start with {using|using} your non-dominant hand for routine tasks like writing or eating. This simple switch challenges your brain, {activating|activating} pathways that aren't typically {engaged|engaged} and promoting greater flexibility in thinking.","fn":["*neurobic exercise: 뉴로빅 운동(뇌를 자극하는 운동)","*agile: 기민한, 민첩한","*non-dominant hand: 주로 쓰지 않는 손"], (또렷한): remain(~한 상태로 남다) 뒤 보어 자리이고 focused(집중된)와 나란한 형용사라 맞음.","sharpen(날카롭게 하다): 동사원형이라 remains(남다)와 동사가 겹침.","sharpens(날카롭게 하다, 3인칭 단수형): 동사라 보어 자리에 못 오고 remains(남다)와 동사가 겹침.","to sharpening(날카롭게 하는 것으로): 전치사구라 마음의 상태를 말하는 보어가 못 됨."],"point":"형용사 자리 vs. 부사 자리","en":"This strategic pause is not just a break; it boosts your cognitive capabilities, ensuring your mind remains sharp and focused.","ko":"이 전략적인 멈춤은 단순한 휴식이 아니며, 그것은 여러분의 인지 능력을 증진시키고 여러분의 정신이 또렷하고 집중된 상태가 유지되도록 확실히 한다.","hl":["remains sharp and focused"],"khl":["또렷하고 집중된 상태가"],"blocks":[{"t":"p","h":"상태 동사 뒤는 형용사 자리","x":["remain(~한 상태로 남다)은 be동사처럼 주어의 상태를 말한다.","your mind remains sharp: 마음이 또렷한 상태로 남는다.","sharp(또렷한)는 mind(마음)의 상태다. 그래서 형용사.","뒤의 focused(집중된)도 형용사라, and(그리고) 앞뒤가 같은 모양이다."]},{"t":"pair","h":"쉬운 예시","x":[["Please stay calm.","침착한 상태로 있어 줘. (stay(~한 상태로 있다) + 형용사)"],["The soup smells good.","그 수프는 좋은 냄새가 난다. (smells(냄새가 나다) + 형용사)"]]},{"t":"tap","h":"확인 질문","q":"sharp(또렷한)가 꾸미는 건 동사 remains(남다)인가, 주어 your mind(여러분의 마음)인가?","a":["주어 your mind(여러분의 마음)다.","마음이 \"또렷한\" 상태라는 뜻이라 형용사가 맞다."]}],"post":["remain(~한 상태로 남다) + 형용사: remains sharp(또렷한 상태로 남다)"]},{"slots":[["taking","","","덧붙인 분사구문 \"~하면서\"이다."],["are","","","주어 Neurobic exercises(뉴로빅 운동들)가 복수라 are(~이다)."],["refreshes","refresh","a","that(~하는)이 받는 앞 명사는 a mental oasis(정신적 오아시스), 단수다. 그래서 refreshes(새롭게 하다)."],["experimenting","","","문장의 주어 자리라 동명사가 맞다."],["engaged","","","경로들이 \"사용되는\" 쪽이라 be + p.p.가 맞다."]],"opts":["refreshing","refreshes","to refresh","being refreshed"],"or":["refreshing(새롭게 하는): 관계대명사 that(~하는) 뒤에는 진짜 동사가 필요한데 -ing는 동사가 못 됨.","refreshes(새롭게 하다, 3인칭 단수형): that(~하는)이 받는 a mental oasis(정신적 오아시스)가 단수라 맞음.","to refresh(새롭게 하는 것): to부정사도 동사 자리에 못 와서 that(~하는) 뒤 동사가 비게 됨.","being refreshed(새롭게 되는 것): 동사가 못 되고, 오아시스가 여러분을 새롭게 하는 능동이라 수동도 안 맞음."],"point":"주격 관계대명사절의 수일치","en":"These exercises create a mental oasis that refreshes and prepares you for the afternoon's challenges.","ko":"이러한 운동들은 오후의 힘든 일들을 위해 여러분을 새롭게 하고 준비시켜 주는 정신적  altered cell has an increased likelihood of reproducing itself.","ko":"첫 번째 유형의 실수로 인한 변화들은 영속되는 경향이 있을 것인데, 변화가 일어난 세포가 스스로를 복제할 증가한 가능성을 가지고 있기 때문이다.","hl":["because the altered cell has"],"khl":["가지고 있기 때문이다"],"blocks":[{"t":"p","h":"뒤에 동사가 있나 없나","x":["because(~ 때문에) 뒤: 주어 + 동사가 있는 문장.","because of(~ 때문에) 뒤: 명사 덩어리만.","이 문장은 뒤에 has(가지고 있다)라는 동사가 있다. 그래서 because(~ 때문에).","같은 문장 앞쪽의 due to mistakes(실수 때문에)는 뒤가 명사라 전치사가 맞다."]},{"t":"pair","h":"쉬운 예시","x":[["I stayed home because it rained.","비가 와서 나는 집에 있었다. (because(~ 때문에) + 문장)"],["I stayed home because of the rain.","비 때문에 나는 집에 있었다. (because of(~ 때문에) + 명사)"]]}],"post":["뒤에 주어 + 동사 있으면 because(~ 때문에): because the altered cell has(그 세포가 가지고 있기 때문에)"]},{"slots":[["are","","","주어 the genomes(유전체들)가 복수라 are(~이다)."],["whether","","","뒤 문장이 완전하고 \"성공할지 아닐지\"라는 뜻이라 whether(~인지 아닌지)."],["lead","","","주어 changes(변화들)가 복수라 lead(이르다)."],["evolve","evolves","a","주어는 organisms(유기체들), 복수다. 앞의 긴 Through(~을 통해) 덩어리는 주어가 아니다."],["successfully","","","동사 reproduce(번식하다)를 꾸미는 부사."]],"opts":["evolving","to evolve","evolve","being evolved"],"or":["evolving(진화하는): -ing는 혼자 동사가 못 돼서 문장에 진짜 동사가 없어짐.","to evolve(진화하는 것): to부정사도 동사 자리에 못 옴.","evolve(진화하다): 주어 organisms(유기체들)가 복수라 s 없는 현재형 동사가 맞음.","being evolved(진화되는 것): 동사가 못 되고, evolve(진화하다)는 수동으로 쓰지 않음."],"point":"수식받는 주어의 수일치","en":"Through endless repetition of this cycle of mutation and natural selection organisms evolve.","ko":"이러한 '돌연변이'와 '자연 선택'의 순환의 끊임없는 반복을 통해 유기체들은 진화한다.","hl":["organisms evolve","Through endless repetition"],"khl":["유기체들은 진화한다","끊임없는 반복을 통해"],"blocks":[{"t":"p","h":"전치사 덩어리는 주어가 못 된다","x":["Through(~을 통해)로 시작하는 덩어리는 \"어떻게\"를 말하는 부사구다.","전치사 덩어리 안의 명사는 주어가 될 수 없다.","repetition(반복), cycle(순환), selection(선택)은 모두 덩어리 속 단수 명사다. 여기에 속으면 evolves(진화하다, 3인칭 단수형)를 고른다.","덩어리가 끝나고 나오는 organisms(유기체들)가 진짜 주어. 복수라 evolve(진화하다)."]},{"t":"pair","h":"쉬운 예시","x":[["In the box under the bed, the toys sleep.","침대 밑 상자 속에서 장난감들이 잔다. (주어 the toys(장난감들) → sleep)"],["After a long day at school, my friends go home.","학교에서 긴 하루를 보낸 뒤 내 친구들은 집에 간다. (주어 my friends(내 친구들) → go)"]]},{"t":"tap","h":"확인 질문","q":"원문에는 selection(선택)과 organisms(유기체들) 사이에 콤마가 없다. 주어는 어디서 시작하나?","a":["organisms(유기체들)부터다.","selection organisms(선택 유기체들)라는 한 덩어리가 아니라, 덩어리가 끝나고 주어가 새로 시작된다."]}],"post":["Through(~을 통해) 덩어리 건너뛰고 주어(organisms = 유기체들) → evolve(진화하다)"]},{"slots":[["divides","","","주어 a cell(세포)이 단수라 divides(분열하다)."],["disrupting","disrupt","a","by(~함으로써)는 전치사다. 전치사 뒤에 동사를 쓰려면 -ing 옷을 입어야 한다."],["reproducing","","","전치사 of(~의) 뒤라 동명사."],["dies","","","주어 the cell(그 세포)이 단수라 dies(죽다)."],["giving","","","진짜 동사 change(변화하다) 뒤 덧붙임이라 -ing."]],"opts":["disrupted","disrupts","disrupting","to disrupt"],"or":["disrupted(망가뜨렸다, 망가진): 전치사 뒤에 과거형이나 p.p.는 못 오고, 오류가 직접 망가뜨리는 능동임.","disrupts(망가뜨리다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음.","disrupting(망가뜨리는 것, 동명사): 전치사 by(~함으로써) 뒤라 동명사가 맞음.","to disrupt(망가뜨리는 것): 전치사 by(~함으로써) 뒤에는 to부정사가 못 옴."],"point":"전치사 + 동명사","en":"But in some cases, the error will cause serious damage: for example, by disrupting the coding sequence for a key protein.","ko":"그러나 어떤 경우에는 그 오류가 심각한 손상을 야기할 것이다. 예를 들어 핵심 단백질의 코딩 서열을 망가뜨림으로써 그렇게 할 것이다.","hl":["by disrupting"],"khl":["망가뜨림으로써"],"blocks":[{"t":"p","h":"by(~함으로써) + -ing는 방법 표시","x":["by(~함으로써) + -ing = ~함으로써. \"어떤 방법으로\"를 말한다.","오류가 어떻게 손상을 일으키나? 서열을 망가뜨림으로써.","by(~함으로써)는 전치사라 뒤에 동사원형이 못 온다.","같은 지문의 of reproducing(복제하는 것의)도 전치사 + 동명사다."]},{"t":"pair","h":"쉬운 예시","x":[["I learn English by watching movies.","나는 영화를 보면서 영어를 배운다. (by watching = 봄으로써)"],["He saved money by walking to school.","그는 학교에 걸어감으로써 돈을 아꼈다. (by walking = 걸어감으로써)"]]}],"post":["by(~함으로써) + -ing: by disrupting(망가뜨림으로써)"]},{"slots":[["are","","","주어 the genomes(유전체들)가 복수라 are(~이다)."],["to_be","","","tend(~하는 경향이 있다) 뒤 to부정사."],["whether","what","a","뒤 문장 the altered cell or its cousins will succeed(그 세포나 사촌들이 성공할 것이다)는 빠진 것 없는 완전한 문장이다. what(~하는 것)은 뒤에 빈자리가 있어야 한다."],["cause","","","관계대명사 that(~하는)이 받는 changes(변화들)가 복수라 cause(일으키다)."], garded} as state citizens. Therefore, for Confucians, the family {possesses|possesses} inherent value {that|that} should never {be_abandoned|be abandoned}, even if it {results|results} in certain {societal|societal} inequalities. Some cultures, like the liberal one, may choose {to_impose|to impose} increasing restrictions on the role of families and {implement|implement} more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity. On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, {accepting|accepting} inequalities {stemming|stemming} from the existence of the family as long as everyone's basic freedoms and rights {are_safeguarded|are safeguarded} in the state.","fn":["*integrity: 온전함","*Confucian: 유교의","*egalitarian: 평등주의의"],"mean":{"outweighs":"~보다 더 중요하다(outweigh의 3인칭 단수 현재형)","outweigh":"~보다 더 중요하다(동사원형·현재형)","outweighing":"~보다 더 중요한(outweigh의 -ing형)","to outweigh":"~보다 더 중요한 것(outweigh의 to부정사)","having outweighed":"~보다 더 중요했고 나서(outweigh의 완료 -ing형)","seeking":"추구하는 것(seek의 -ing형, 동명사)","seek":"추구하다(동사원형·현재형)","seeks":"추구하다(seek의 3인칭 단수 현재형)","sought":"추구했다(seek의 과거형·과거분사형)","has sought":"추구해 왔다(seek의 현재완료형)","assumes":"(역할을) 맡다(assume의 3인칭 단수 현재형)","fundamental":"기본적인, 근본적인(형용사)","living":"사는 것(live의 -ing형, 동명사)","is considered":"여겨진다(consider의 수동태)","considers":"여기다(consider의 3인칭 단수 현재형)","considering":"여기는 것, 여기는(consider의 -ing형)","to consider":"여기는 것(consider의 to부정사)","consider":"여기다(동사원형·현재형)","primarily":"주로, 우선적으로(부사)","primary":"주된, 첫째의(형용사)","primacy":"최우선, 으뜸(명사)","prime":"주요한(형용사)","primal":"원시적인, 근본적인(형용사)","are regarded":"여겨진다(regard의 수동태, 복수 주어)","possesses":"지니다, 보유하다(possess의 3인칭 단수 현재형)","that":"~하는(관계대명사) / ~라는 것(접속사)","what":"~하는 것(선행사를 품은 관계대명사)","whose":"~의(소유격 관계대명사)","where":"~하는 곳(관계부사)","who":"~하는(사람을 받는 관계대명사)","be abandoned":"포기되다, 버려지다(abandon의 수동태)","abandon":"포기하다, 버리다 족)가 단수라 assumes(맡다)에 s가 붙는다."],["living","","","and 뒤 문장의 주어 자리라 동명사 living(사는 것)이 맞다."],["possesses","","","주어 the family(가족)가 단수라 possesses(지니다)가 맞다."],["stemming","","","불평등이 가족에서 \"생겨나는\" 쪽이라 능동 -ing. stem from(~에서 생겨나다)은 수동으로 못 쓰는 동사다."]],"opts":["outweighing","to outweigh","outweighs","having outweighed"],"or":["outweighing(더 중요한): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to outweigh(더 중요한 것): to부정사도 동사 자리에 못 와서 주어 뒤 동사가 비게 됨.","outweighs(더 중요하다): 주어 the value(가치)가 단수라 s 붙은 현재형 동사가 맞음.","having outweighed(더 중요했고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"수식받는 주어의 수일치","en":"Within liberal culture, the value of fair equality of opportunity for individuals outweighs the preservation of the family's integrity.","ko":"자유주의 문화 내에서는, 개인들을 위한 기회의 공정한 평등이라는 가치가 가족의 온전함을 보존하는 것보다 우선된다.","hl":["the value","outweighs"],"khl":["가치가","우선된다"],"blocks":[{"t":"p","h":"긴 꼬리표 걷어 내기","x":["동사 바로 앞 단어 individuals(개인들)는 복수다.","하지만 진짜 주인(주어)은 맨 앞의 the value(가치)다.","of fair equality of opportunity(기회의 공정한 평등이라는)는 꼬리표다.","for individuals(개인들을 위한)도 꼬리표다.","꼬리표를 걷어 내면 the value outweighs(가치가 더 중요하다)만 남는다.","주인이 하나니 outweighs(더 중요하다)에 s가 붙는다."]},{"t":"pair","h":"쉬운 예시","x":[["The color of the leaves changes in fall.","나뭇잎들의 색은 가을에 변한다. (주인 The color(색) → changes(변한다))"],["A box of apples is on the table.","사과 한 상자가 탁자 위에 있다. (주인 A box(한 상자) → is(있다))"]]}],"post":["꼬리표 떼고 주인(the value = 가치) 보고 동사 결정: outweighs(더 중요하다)"]},{"slots":[["seeking","","","while(~이지만) 뒤 문장에서 seeking ~(추구하는 것)이 주어, is(~이다)가 동사다."],["fundamental","","","명사 role(역할)을 꾸미니 형용사가 맞다."],["that","","","앞의 명사 inherent value(내재적 가치)를 받는 관계대명사 that(~하는). 뒤에 주어가 빠져 있다."],["to_impose","imposing","a","choose(선택하다)는 to부정사를 목적어로 받는 동사다. choose imposing(부과하는 것을 선택하다)은 틀린다."],["accepting","","","진짜 동사 may prefer(선호할지도 모른다)가 이미 있다. 콤마 뒤 덧붙임은 분사구문 -ing."]],"opts":["to impose","impose","imposed","imposes"],"or":["to impose(부과하는 것): choose(선택하다)는 to부정사를 목적어로 받으니 맞음.","impose(부과하다): choose(선택하다) 뒤에 동사원형이 바로 올 수 없음.","imposed(부과했다, 부과된): 목적어 자리에 과거형이 못 오고, 뒤에 목적어 restrictions(제한들)가 있어 수동 p.p.도 안 됨.","imposes(부과하다, 3인칭 단수형): may choose(선택할지도 모른다) 뒤에 동사가 또 와서 동사가 겹침."],"point":"동명사/to부정사 목적어","en":"Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families.","ko":"자유주의 문화와 같은 일부 문화들은 가족의 역할에 점점 더 많은 제한들을 부과하기를 선택할지도 모른다.","hl":["choose to impose"],"khl":["부과하기를 선택할지도"],"blocks":[{"t":"p","h":"앞으로 할 일은 to와 짝","x":["choose(선택하다), decide(결정하다), want(원하다), plan(계획하다)은 뒤에 to부정사를 받는다.","모두 \"앞으로 할 일\"을 고르는 동사라 to(~할 것)와 잘 어울린다.","반대로 enjoy(즐기다), finish(끝내다), avoid(피하다)는 -ing를 받는다.","choose imposing(부과하는 것을 선택하다)은 짝이 틀린 조합이다."]},{"t":"pair","h":"쉬운 예시","x":[["I chose to stay home.","나는 집에 있기로 선택했다. (chose(선택했다) + to stay(머무는 것))"],["She enjoys reading books.","그녀는 책 읽는 것을 즐긴다. (enjoys(즐긴다) + reading(읽는 것))"]]}],"post":["choose(선택하다) + to부정사: choose to impose(부과하기를 선택하다)"]},{"slots":[["outweighs","","","주어 the value(가치)가 단수라 outweighs(더 중요하다)."],["is_considered","considers","a","사는 것은 무언가를 여기는 쪽이 아니라 \"여겨지는\" 쪽이다. 그래서 수동태 is considered(여겨진다)."],["primarily","","","과거분사 understood(이해되는)를 꾸미니 부사가 맞다."],["be_abandoned","","","가치는 \"포기되는\" 쪽이라 수동. 조동사 should(~해야 한다) 뒤라 be + p.p."],["implement","","","to impose(부과하는 것)와 and로 이어진 (to) implement(실행하는 것). to 뒤 원형이 맞다."]],"opts":["considering","to consider","is considered","consider"],"or":["considering(여기는): -ing는 혼자 동사 자리에 못 와서 주어 living(사는 것) 뒤 동사가 비게 됨.","to consider(여기는 것): to부정사도 동사 자리에 못 옴.","is considered(여겨진다): 사는 것은 여겨지는 대상이라 수동태가 맞음.","consider(여기다): 주어 living(사는 것)이 단수라 수가 안 맞고, 능동이라 뜻도 틀림."],"point":"능동태 vs. 수동태","en":"In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life.","ko":"이에 반해 유교 문화에서는, 개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만, 가족은 인간의 번영에 있어 기본적인 역할을 담당하며, 가족 제도 안에서 사는 것이 삶의 본질적인 방식으로 간주된다.","hl":["is considered"],"khl":["간주된다"],"blocks":[{"t":"p","h":"누가 누구를 여기나","x":["consider(여기다) A B = A를 B로 여기다.","사람들이 \"가족 안에서 사는 것\"을 삶의 본질적인 방식으로 여긴다.","이걸 사는 것 쪽에서 말하면 \"여겨진다\"가 된다.","그래서 is considered(여겨진다).","considers(여기다)를 쓰면 사는 것이 직접 무언가를 여기는 이상한 뜻이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["He is called Tom.","그는 톰이라고 불린다. (is called = 불린다)"],["English is spoken in many countries.","영어는 많은 나라에서 쓰인다. (is spoken = 말해진다)"]]}],"post":["주어가 \"여겨지는\" 쪽이면 수동: is considered(여겨진다)"]},{"slots":[["assumes","","","주어 the family(가족)가 단수라 assumes(맡다)."],["are_regarded","","","they(그들)는 시민으로 \"여겨지는\" 쪽이라 수동태가 맞다."],["that","what","a","앞에 명사 inherent value(내재적 가치)가 있다. 명사를 받는 건 that(~하는). what(~하는 것)은 앞에 명사가 있으면 못 쓴다."],["results","","","even if(~일지라도) 뒤 주어 it(그것)이 단수라 results(초래하다)."],["are_safeguarded","","","주어 freedoms and rights(자유와 권리들)가 복수라 are(~이다). 보장되는 쪽이라 수동."]],"opts":["whose","where","who","that"],"or":["whose(~의): 바로 뒤에 명사가 와야 하는데 should(~해야 한다)가 와서 안 됨.","where(~하는 곳): 뒤에 빠진 것 없는 문장이 와야 하는데 주어가 빠져 있고, 장소도 아님.","who(~하는): 사람을 받는 말인데 value(가치)는 사람이 아님.","that(~하는, 관계대명사): 앞의 명사 inherent value(내재적 가치)를 받고 뒤에 주어가 빠진 문장이 오니 맞음."],"point":"that vs. what","en":"Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.","ko":"그러므로 유교를 따르는 사람들에게는, 가족은 그것이 어떤 사회적 불평등을 초래할지라도, 결코 포기되어서는 안 되는 내재적인 가치를 보유한다.","hl":["inherent value that"],"khl":["내재적인 가치를"],"blocks":[{"t":"p","h":"what(~하는 것)은 명사를 이미 품고 있다","x":["what(~하는 것) = the thing that(~하는 것). 속에 \"것\"이라는 명사가 들어 있다.","그래서 앞에 명사가 또 있으면 명사가 두 개가 된다.","value what(가치 ~하는 것)은 말이 안 된다.","명사 inherent value(내재적 가치)를 뒤에서 꾸밀 땐 that(~하는)."]},{"t":"tap","h":"확인 질문","q":"that(~하는) 뒤의 should never be abandoned(결코 포기되면 안 된다)에서 빠진 것은?","a":["주어가 빠졌다.","빠진 주어는 바로 앞의 inherent value(내재적 가치)다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the book that I bought.","이것은 내가 산 책이다. (명사 the book(책) + that)"],["This is what I bought.","이것이 내가 산 것이다. (명사 없이 what)"]]}],"post":["명사(inherent value = 내재적 가치) + that(~하는) + 주어 빠진 문장"]},{"slots":[["seeking","seek","a","while(~이지만) 뒤 문장의 동사는 is(~이다)다. 주어 자리에 동사 seek(추구하다)이 올 수 없으니 동명사 seeking(추구하는 것)."],["living","","","and 뒤 문장의 주어 자리라 동명사 living(사는 것)."],["possesses","","","주어 the family(가족)가 단수라 possesses(지니다)."],["societal","","","명사 inequalities(불평등)를 꾸미니 형용사가 맞다."],["stemming","","","불평등이 \"생겨나는\" 쪽이라 능동 -ing. stem from(~에서 생겨나다)은 수동으로 못 쓴다."]],"opts":["seeking","sought","seeks","has sought"],"or":["seeking(추구하는 것): 동사를 주어 자리에 쓰려면 동명사로 바꿔야 하니 맞음.","sought(추구했다, 추구된): 과거형은 주어 자리에 못 오고, 동사 is(~이다)와 겹침.","seeks(추구하다, 3인칭 단수형): 주어 없이 동사가 먼저 나와 is(~이다)와 동사가 둘이 됨.","has sought(추구해 왔다): 현재완료도 진짜 동사라 주어 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing.","ko":"이에 반해 유교 문화에서는, 개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만, 가족은 인간의 번영에 있어 기본적인 역할을 담당한다.","hl":["seeking","is important"],"khl":["추구하는 것이","중요하지만"],"blocks":[{"t":"p","h":"동사에 명찰 달기","x":["문장의 주어 자리에는 명사가 온다.","동사를 주어로 쓰려면 -ing(~하는 것) 명찰을 단다.","seeking fair equality(공정한 평등을 추구하는 것) = 주어.","is important(중요하다) = 동사.","seek(추구하다)를 그대로 두면 동사만 둘이고 주어가 없다."]},{"t":"pair","h":"쉬운 예시","x":[["Swimming is good for your health.","수영하는 것은 건강에 좋다. (Swimming(수영하는 것) = 주어, is(~이다) = 동사)"],["Eating breakfast helps me.","아침을 먹는 것은 나에게 도움이 된다. (Eating(먹는 것) = 주어)"]]}],"post":["주어 자리 동사는 -ing: seeking ~ is important(추구하는 것이 중요하다)"]}],"quiz":[{"s":"The price of these shoes ___ high.","o":["is","are"],"a":0,"ko":"이 신발의 가격은 비싸다.","why":"주인은 The price(가격). of these shoes(이 신발의)는 꼬리표.","wy":"are(~이다): 복수 동사라 단수 주어 The price(가격)와 안 맞음."},{"s":"We decided ___ a new bike.","o":["buying","to buy"],"a":1,"ko":"우리는 새 자전거를 사기로 결정했다.","why":"decide(결정하다) + to부정사.","wy":"buying(사는 것): decide(결정하다)는 -ing를 목적어로 받지 않음."},{"s":"This song ___ by many people.","o":["loves","is loved"],"a":1,"ko":"이 노래는 많은 사람들에게 사랑받는다.","why":"노래는 사랑받는 쪽이라 수동.","wy":"loves(사랑한다): 노래가 사람을 사랑하는 뜻이 되어 틀림."},{"s":"I lost the pen ___ my dad gave me.","o":["that","what"],"a":0,"ko":"나는 아빠가 주신 펜을 잃어버렸다.","why":"앞에 명사 the pen(펜)이 있으니 that(~하는).","wy":"what(~하는 것): 앞에 명사 the pen(펜)이 있어서 못 옴."},{"s":"___ vegetables is good for you.","o":["Eat","Eating"],"a":1,"ko":"채소를 먹는 것은 너에게 좋다.","why":"주어 자리라 동명사 Eating(먹는 것).","wy":"Eat(먹다): 동사원형은 주어 자리에 못 와서 is(~이다)와 동사가 겹침."}]},{"items":[{"slots":[["outweighs","","","주어 the value(가치)가 단수라 outweighs(더 중요하다)."],["fundamental","","","명사 role(역할)을 꾸미는 형용사."],["to_impose","","","choose(선택하다) + to부정사."],["implement","","","to impose(부과하는 것)와 and로 나란한 (to) implement(실행하는 것)."],["accepting","accepts","a","진짜 동사는 may prefer(선호할지도 모른다)다. 접속사 없이 콤마 뒤에 동사를 또 쓸 수 없으니 accepting(용인하면서)."]],"opts":["accept","accepted","have accepted","accepting"],"or":["accept(용인하다): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐.","accepted(용인했다, 받아들여진): 과거형이면 동사가 겹치고, 뒤에 목적어 inequalities(불평등)가 있어 수동 p.p.도 안 됨.","have accepted(용인해 왔다): 현재완료도 진짜 동사라 접속사 없이 못 붙음.","accepting(용인하면서): 진짜 동사 may prefer(선호할지도 모른다)가 있으니 콤마 뒤 덧붙임은 분사구문 -ing가 맞음."],"point":"정동사 vs. 준동사","en":"On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.","ko":"반면 유교 문화와 같은 다른 문화들은, 국가에서 모든 사람의 기본적 자유와 권리들이 보장되는 한, 가족의 존재로 인해 발생하는 불평등을 용인하며 복지에 대한 책임을 우선적으로 가족에게 할당하는 것을 선호할지도 모른다.","hl":["may prefer","accepting"],"khl":["선호할지도 모른다","용인하며"],"blocks":[{"t":"p","h":"동사 자리는 이미 찼다","x":["접속사 없이 이어진 문장에서 진짜 동사는 하나다.","여기 진짜 동사는 may prefer(선호할지도 모른다).","콤마 뒤 \"용인하면서\"는 덧붙이는 말이다.","덧붙이는 말은 동사 옷을 벗고 -ing(~하면서)를 입는다.","accepts(용인하다)를 쓰면 접속사 없이 동사가 하나 더 생긴다."]},{"t":"pair","h":"쉬운 예시","x":[["She walked home, singing a song.","그녀는 노래를 부르면서 집으로 걸어갔다. (singing(부르면서) = 덧붙임)"],["He sat down, holding a cup.","그는 컵을 든 채 앉았다. (holding(든 채) = 덧붙임)"]]}],"post":["진짜 동사 may prefer(선호하다) 뒤 콤마 덧붙임은 -ing: accepting(용인하면서)"]},{"slots":[["seeking","","","while(~이지만) 뒤 문장의 주어라 동명사 seeking(추구하는 것)."],["is_considered","","","사는 것은 \"여겨지는\" 쪽이라 수동태."],["primarily","primary","a","be동사 are(~이다)와 과거분사 understood(이해되는) 사이에서 분사를 꾸미는 자리. 형용사 primary(주된)는 못 들어간다."],["that","","","명사 inherent value(내재적 가치)를 받는 관계대명사 that(~하는)."],["stemming","","","불평등이 \"생겨나는\" 쪽이라 능동 -ing."]],"opts":["primacy","primarily","prime","primal"],"or":["primacy(최우선): 명사라 분사 understood(이해되는)를 꾸밀 수 없음.","primarily(주로, 우선적으로): 과거분사 understood(이해되는)를 꾸미는 부사 자리라 맞음.","prime(주요한): 형용사는 명사만 꾸며서 분사 앞 부사 자리에 못 옴.","primal(원시적인): 형용사라 자리가 틀리고 뜻도 안 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"Individuals are primarily understood as family members before they are regarded as state citizens.","ko":"개인들은 국가의 시민으로 여겨지기 전에 우선적으로 가족 구성원으로 이해된다.","hl":["primarily understood"],"khl":["우선적으로","이해된다"],"blocks":[{"t":"p","h":"꾸밈 화살표 긋기","x":["primarily(우선적으로) → understood(이해되는). 화살표가 분사로 간다.","동사나 분사를 꾸미는 건 부사(-ly)의 일이다.","형용사 primary(주된)는 명사를 꾸민다. a primary reason(주된 이유)처럼.","be + 부사 + p.p. 순서: are primarily understood(주로 이해된다)."]},{"t":"pair","h":"쉬운 예시","x":[["The room was nicely cleaned.","그 방은 깔끔하게 청소되었다. (nicely(깔끔하게) → cleaned(청소된))"],["It was a nice room.","그것은 좋은 방이었다. (nice(좋은) → room(방))"]]}],"post":["be + 부사 + p.p.: are primarily understood(주로 이해된다)"]},{"slots":[["assumes","","","주어 the family(가족)가 단수라 assumes(맡다)."],["are_regarded","","","they(그들)는 시민으로 \"여겨지는\" 쪽이라 수동태."],["results","","","주어 it(그것)이 단수라 results(초래하다)."],["implement","implements","a","choose to impose(부과하기를 선택하다) ... and implement(실행하다). and 뒤도 to 뒤의 동사원형이어야 짝이 맞는다."],["accepting","","","진짜 동사 may prefer(선호할지도 모른다) 뒤 덧붙인 분사구문."]],"opts":["implemented","implementation","implement","has implemented"],"or":["implemented(실행했다, 실행된): 원형 자리와 짝이 안 맞고, 뒤에 목적어 programs(프로그램들)가 있어 수동 p.p.도 안 됨.","implementation(실행): 명사라 뒤의 목적어 programs(프로그램들)를 받을 수 없고 모양도 다름.","implement(실행하다): and 앞의 to impose(부과하는 것)와 짝인 원형이라 맞음.","has implemented(실행해 왔다): 진짜 재적인 가치를 보유한다.","hl":["should never be abandoned"],"khl":["포기되어서는 안 되는"],"blocks":[{"t":"p","h":"목적어 빈자리 확인","x":["abandon(포기하다)은 \"무엇을\"이 꼭 필요한 동사다.","should never abandon(결코 포기하면 안 된다) 뒤에 \"무엇을\"이 없다.","포기되는 것은 앞의 value(가치) 자신이다.","그래서 수동: should never be abandoned(결코 포기되면 안 된다).","조동사 뒤 수동 = 조동사 + be + p.p."]},{"t":"pair","h":"쉬운 예시","x":[["The door must be closed.","그 문은 닫혀 있어야 한다. (must be closed = 닫혀야 한다)"],["The cake will be eaten soon.","그 케이크는 곧 먹힐 것이다. (will be eaten = 먹힐 것이다)"]]}],"post":["조동사 + be + p.p.: should never be abandoned(결코 포기되면 안 된다)"]},{"slots":[["fundamental","","","명사 role(역할)을 꾸미는 형용사."],["is_considered","","","사는 것은 \"여겨지는\" 쪽이라 수동태."],["that","","","명사 inherent value(내재적 가치)를 받는 관계대명사 that(~하는)."],["societal","societally","a","명사 inequalities(불평등)를 꾸미는 자리. 부사 societally(사회적으로)는 명사를 꾸밀 수 없다."],["to_impose","","","choose(선택하다) + to부정사."]],"opts":["socially","socialize","socializes","societal"],"or":["socially(사회적으로): 부사라 명사를 꾸밀 수 없음.","socialize(사귀다, 사회화하다): 동사라 명사 앞 꾸밈 자리에 못 옴.","socializes(사귀다, 3인칭 단수형): 동사라 자리가 안 맞고 results(초래하다)와 동사가 겹침.","societal(사회적인): 명사 inequalities(불평등)를 꾸미는 형용사라 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.","ko":"그러므로 유교를 따르는 사람들에게는, 가족은 그것이 어떤 사회적 불평등을 초래할지라도, 결코 포기되어서는 안 되는 내재적인 가치를 보유한다.","hl":["certain societal inequalities"],"khl":["어떤 사회적 불평등을"],"blocks":[{"t":"p","h":"명사 앞자리는 형용사 몫","x":["certain(어떤) + ___ + inequalities(불평등). 빈칸이 명사 바로 앞이다.","명사를 꾸미는 건 형용사다.","societal(사회적인) = 형용사, societally(사회적으로) = 부사.","같은 지문의 fundamental role(기본적인 역할)도 같은 모양이다."]},{"t":"pair","h":"쉬운 예시","x":[["She is a careful driver.","그녀는 조심스러운 운전자다. (careful(조심스러운) → driver(운전자))"],["She drives carefully.","그녀는 조심스럽게 운전한다. (carefully(조심스럽게) → drives(운전한다))"]]}],"post":["명사 앞은 형용사: certain societal inequalities(어떤 사회적 불평등)"]}],"quiz":[{"s":"He came into the room, ___ a song.","o":["singing","sang"],"a":0,"ko":"그는 노래를 부르면서 방으로 들어왔다.","why":"진짜 동사 came(왔다)이 있으니 덧붙임은 -ing.","wy":"sang(불렀다): 접속사 없이 동사가 하나 더 생겨 틀림."},{"s":"The letter was ___ written.","o":["beautiful","beautifully"],"a":1,"ko":"그 편지는 아름답게 쓰였다.","why":"과거분사 written(쓰인)을 꾸미니 부사.","wy":"beautiful(아름다운): 형용사라 written(쓰인)을 꾸밀 수 없음."},{"s":"I want to wash my hands and ___ lunch.","o":["eating","eat"],"a":1,"ko":"나는 손을 씻고 점심을 먹고 싶다.","why":"to wash(씻는 것)와 eat(먹는 것)가 원형끼리 짝.","wy":"eating(먹는 것): to wash(씻는 것)와 모양이 달라 짝이 깨짐."},{"s":"The window must ___ every day.","o":["be cleaned","clean"],"a":0,"ko":"그 창문은 매일 닦여야 한다.","why":"창문은 닦이는 쪽이라 조동사 + be + p.p.","wy":"clean(닦다): 창문이 직접 닦는 뜻이 되어 틀림."},{"s":"He gave me a ___ answer.","o":["clear","clearly"],"a":0,"ko":"그는 나에게 분명한 답을 주었다.","why":"명사 answer(답)를 꾸미니 형용사.","wy":"clearly(분명하게): 부사라 명사 answer(답)를 꾸밀 수 없음."}]}],"comp":[{"no":"30","slots":[["outweighs","","","주어 the value(가치)가 단수라 outweighs(더 중요하다)."],["primarily","","","과거분사 understood(이해되는)를 꾸미는 부사."],["be_abandoned","","","가치는 포기되는 쪽이라 조동사 + be + p.p."],["results","resulting","a","even if(~일지라도)는 접속사라 뒤에 주어 it(그것) + 동사가 와야 한다. resulting(초래하는)은 동사가 아니다."],["stemming","","","불평등이 생겨나는 쪽이라 능동 -ing."]],"opts":["results","result","to result","having resulted"],"or":["results(초래하다): 접속사 even if(~일지라도) 뒤 주어 it(그것)의 동사이고 단수라 s가 붙어 맞음.","result(초래하다): 주어 it(그것)이 단수라 s가 빠지면 수가 안 맞음.","to result(초래하는 것): to부정사는 동사 자리에 못 와서 it(그것) 뒤 동사가 비게 됨.","having resulted(초래하고 나서): -ing형이라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.","ko":"그러므로 유교를 따르는 사람들에게는, 가족은 그것이 어떤 사회적 불평등을 초래할지라도, 결코 포기되어서는 안 되는 내재적인 가치를 보유한다.","hl":["even if it results in"],"khl":["초래할지라도"],"blocks":[{"t":"p","h":"접속사는 주어와 동사를 데려온다","x":["even if(~일지라도), because(~ 때문에), when(~할 때)은 접속사다.","접속사 뒤에는 주어 + 동사가 한 세트로 온다.","주어: it(그것). 동사: results(초래하다).","동사 자리에 -ing를 두면 세트가 깨진다.","result in = ~을 초래하다."]},{"t":"pair","h":"쉬운 예시","x":[["I will go out even if it rains.","비가 오더라도 나는 나갈 것이다. (it(그것) + rains(비가 온다))"],["When he arrives, we will eat.","그가 도착하면 우리는 먹을 것이다. (he(그) + arrives(도착하다))"]]}],"post":["even if(~일지라도) + 주어 + 동사: it results in(그것이 ~을 초래하다)"]},{"no":"30","slots":[["seeking","","","while(~이지만) 뒤 문장의 주어라 동명사."],["are_regarded","","","they(그들)는 여겨지는 쪽이라 수동태."],["implement","","","to impose(부과하는 것)와 나란한 원형."],["accepting","","","진짜 동사 may prefer(선호할지도 모른다) 뒤 분사구문."],["are_safeguarded","is safeguarded","a","주어는 freedoms and rights(자유와 권리들), and로 묶인 복수다. everyone's(모든 사람의)는 꾸밈말일 뿐."]],"opts":["are safeguarded","safeguarding","safeguards","to safeguard"],"or":["are safeguarded(보장된다): 복수 주어 freedoms and rights(자유와 권리들)이고 보장되는 쪽이라 맞음.","safeguarding(보장하는): -ing는 혼자 동사 자리에 못 와서 as long as(~하는 한) 뒤 동사가 비게 됨.","safeguards(보장하다, 3인칭 단수형): 주어가 복수라 수가 안 맞고, 자유가 무언가를 보장하는 능동 뜻도 틀림.","to safeguard(보장하는 것): to부정사는 동사 자리에 못 옴."],"point":"수식받는 주어의 수일치","en":"accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.","ko":"국가에서 모든 사람의 기본적 자유와 권리들이 보장되는 한, 가족의 존재로 인해 발생하는 불평등을 용인하며","hl":["freedoms and rights are safeguarded"],"khl":["자유와 권리들이 보장되는 한"],"blocks":[{"t":"p","h":"everyone(모든 사람)에 속지 말기","x":["everyone(모든 사람)은 단수 취급이다.","하지만 everyone's(모든 사람의)는 앞에 붙은 꾸밈말이지 주인이 아니다.","basic(기본적인)도 꾸밈말이다.","진짜 주인은 freedoms and rights(자유와 권리들).","둘을 and로 묶었으니 복수 → are(~이다)."]},{"t":"pair","h":"쉬운 예시","x":[["Tom and Jerry are friends.","톰과 제리는 친구다. (A and B → are(~이다))"],["My mom's car is red.","우리 엄마의 차는 빨갛다. (주인 car(차) → is(~이다))"]]}],"post":["A and B는 복수: freedoms and rights are(자유와 권리들은 ~이다)"]}],"compquiz":[{"s":"Even if he ___ tired, he will finish the work.","o":["is","being"],"a":0,"ko":"그는 피곤하더라도 그 일을 끝낼 것이다.","why":"접속사 even if(~일지라도) 뒤에 주어 + 동사.","wy":"being(~인 것): -ing는 동사 자리에 못 와서 he(그) 뒤 동사가 빔."},{"s":"My brother and I ___ in the same school.","o":["am","are"],"a":1,"ko":"우리 형과 나는 같은 학교에 다닌다.","why":"A and B는 복수라 are(~이다).","wy":"am(~이다): I(나) 하나에만 맞춘 동사라 복수 주어와 안 맞음."}]},{"id":"2510g2-31","no":"31","title":"어법특훈 · 25년 10월 고2 31번","sub":"국가를 위한 통계와 정량화의 권위","tpl":"Statistics in the twentieth century {became|became} the {systematic|systematic} collection of quantitative information {needed|needed} by the state. This process {occurred|occurred} in all the industrialised countries as a key part of {their|their} {becoming|becoming} modern states. Desrosières writes: \"It is difficult to think {simultaneously|simultaneously} that the objects {being_measured|being measured} really {do_exist|do exist} and {that|that} this is only a convention\". Yet this is the case. Phenomena such as prices being charged and products being sold {exist|exist}, but the categories and classification frameworks {supporting|supporting} the collection, aggregation, and organisation of official statistics {are_devised|are devised} to serve the purposes of the state, for macroeconomic or for social policies. Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of {making|making} decisions without {seeming|seeming} {to_decide|to decide}\", {characterising|characterising} it as a \"social technology\" {intended|intended} to build trust in authority.","fn":["*quantitative: 정량적인, 양적인","*aggregation: 집계","*quantification: 정량화"],"mean":{"became":"~이 되었다(become의 과거형)","becoming":"~이 되는 것, ~이 되는(become의 -ing형)","become":"~이 되다(동사원형)","becomes":"~이 되다(become의 3인칭 단수 현재형)","to become":"~이 되는 것(become의 to부정사)","having become":"~이 되고 나서(become의 완료 -ing형)","been":"~였던(be의 과거분사형)","systematic":"체계적인(형용사)","systematically":"체계적으로(부사)","systematize":"체계화하다(동사원형)","systematizes":"체계화하다(systematize의 3인칭 단수 현재형)","to systematize":"체계화하는 것(systematize의 to부정사)","needed":"필요로 되는(need의 과거분사형)","needing":"필요로 하는(need의 -ing형)","to need":"필요로 하는 것(need의 to부정사)","having needed":"필요로 하고 나서(need의 완료 -ing형)","is needed":"필요로 된다(need의 수동태)","occurred":"일어났다, 발생했 imple":"간단한(형용사)","simply":"간단히(부사)"},"sets":[{"items":[{"slots":[["became","","","주어 Statistics(통계 자료) 뒤의 진짜 동사다. 20세기 이야기라 과거형 became(~이 되었다)."],["needed","needing","a","정보는 국가에 의해 \"필요로 되는\" 쪽이다. 뒤의 by the state(국가에 의해)도 수동의 신호. needing(필요로 하는)은 정보가 무언가를 필요로 하는 뜻이 된다."],["simultaneously","","","동사 think(생각하다)를 꾸미니 부사가 맞다."],["supporting","","","체계들이 수집을 \"뒷받침하는\" 쪽이고 뒤에 목적어 the collection(수집)이 있어 능동 -ing."],["intended","","","사회적 기술은 신뢰를 쌓도록 \"의도된\" 쪽이라 과거분사."]],"opts":["to need","having needed","is needed","needed"],"or":["to need(필요로 하는 것): 정보가 무언가를 필요로 하는 능동 뜻이 되고, by the state(국가에 의해)와도 안 어울림.","having needed(필요로 하고 나서): 능동 완료 -ing라 수동 뜻이 안 되고, 명사 information(정보)을 뒤에서 꾸밀 수 없음.","is needed(필요로 된다): 진짜 동사라 이미 became(~이 되었다)이 있는 문장에 접속사 없이 동사가 하나 더 생김.","needed(필요로 되는): 정보가 국가에 의해 필요로 되는 쪽이고 뒤에 by the state(국가에 의해)가 있어 수동 p.p.가 맞음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.","ko":"20세기의 통계 자료는 국가에 의해서 필요한 정량적인 정보의 체계적인 수집이 되었다.","hl":["information needed by the state"],"khl":["국가에 의해서 필요한"],"blocks":[{"t":"p","h":"필요로 하는 쪽, 필요로 되는 쪽","x":["information needed by the state(국가가 필요로 하는 정보).","필요로 하는 주인공은 국가다.","정보는 필요로 \"되는\" 쪽이다.","당하는 쪽을 뒤에서 꾸밀 땐 p.p.(~된).","by(~에 의해) + 행위자가 붙어 있으면 p.p.라는 강한 신호다."]},{"t":"pair","h":"쉬운 예시","x":[["This is a book written by Tom.","이것은 톰이 쓴 책이다. (책은 쓰인 쪽 → written(쓰인))"],["Look at the boy reading a book.","책을 읽고 있는 소년을 봐라. (소년이 읽는 쪽 → reading(읽는))"]]}],"post":["명사 + p.p. + by(~에 의해): information needed by the state(국가가 필요로 하는 정보)"]},{"slots":[["systematic","","","명사 collection(수집)을 꾸미니 형용사가 맞다."],["occurred","was occurred","a","occur(일어나다)는 목적어를 갖지 않는 동사라 수동태가 없다. 과정은 스스로 일어나는 것이다."],["being_measured","","","대상들은 \"측정되는\" 쪽이라 수동 being p.p.(~되는)."],["are_devised","","","범주들과 체계들은 \"고안되는\" 쪽이고 주어가 복수라 are devised(고안된다)."],["seeming","","","전치사 without(~없이) 뒤라 동명사 seeming(~처럼 보이는 것)."]],"opts":["occurring","to occur","been occurred","occurred"],"or":["occurring(일어나는): -ing는 혼자 동사 자리에 못 와서 주어 This process(이 과정) 뒤 동사가 비게 됨.","to occur(일어나는 것): to부정사는 동사 자리에 못 옴.","been occurred(일어나진): occur(일어나다)는 수동이 안 되고, 앞에 be동사나 have(완료 조동사) 없이 been(~였던)만 올 수도 없음.","occurred(일어났다): occur(일어나다)는 스스로 일어나는 동사라 능동 과거형이 맞음."],"point":"능동태 vs. 수동태","en":"This process occurred in all the industrialised countries as a key part of their becoming modern states.","ko":"이러한 과정은 모든 산업 국가에서 그것들이 근대 국가가 되는 것의 핵심적인 부분으로 발생했다.","hl":["This process occurred"],"khl":["발생했다"],"blocks":[{"t":"p","h":"수동태가 없는 동사들","x":["수동태는 \"누가 무엇을\" 했는지에서 \"무엇\"을 주어로 올린 문장이다.","그래서 목적어(무엇을)가 없는 동사는 수동태도 없다.","occur(일어나다), happen(일어나다), appear(나타나다), disappear(사라지다), exist(존재하다)가 대표 선수다.","was occurred(일어나졌다)는 시험에 자주 나오는 함정이다."]},{"t":"pair","h":"쉬운 예시","x":[["The accident happened last night.","그 사고는 어젯밤에 일어났다. (was happened(일어나졌다)는 틀림)"],["A rainbow appeared in the sky.","하늘에 무지개가 나타났다. (appeared(나타났다) = 능동)"]]}],"post":["occur(일어나다)는 수동 불가: This process occurred(이 과정이 일어났다)"]},{"slots":[["became","","","주어 Statistics(통계 자료)의 진짜 동사 became(~이 되었다)."],["their","","","앞의 countries(국가들)를 가리키니 복수 their(그것들의)."],["that","","","and 앞의 첫 번째 that(~라는 것)과 짝인 접속사. 뒤 문장이 완전하다."],["exist","exists","a","주어는 Phenomena(현상들), phenomenon(현상)의 복수형이다. such as(~와 같은)로 시작하는 말은 꾸밈말일 뿐."],["intended","","","사회적 기술은 \"의도된\" 쪽이라 과거분사."]],"opts":["existing","to exist","exist","being existed"],"or":["existing(존재하는): -ing는 혼자 동사 자리에 못 와서 but(그러나) 앞 문장에 동사가 없어짐.","to exist(존재하는 것): to부정사도 동사 자리에 못 옴.","exist(존재하다): 주어 Phenomena(현상들)가 복수라 s 없는 현재형이 맞음.","being existed(존재되는): exist(존재하다)는 수동이 안 되고 동사 자리에도 못 옴."],"point":"수식받는 주어의 수일치","en":"Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.","ko":"가격이 부과되는 것이나 제품이 판매되는 것과 같은 현상들은 존재 m good at drawing.","나는 그림 그리기를 잘한다. (at(~을) + drawing(그리기))"],["Thank you for coming.","와 줘서 고마워. (for(~에 대해) + coming(오는 것))"]]}],"post":["전치사 + -ing: a way of making decisions(결정을 내리는 방법)"]},{"slots":[["occurred","","","occur(일어나다)는 수동이 없는 동사라 능동 과거형."],["their","its","a","가리키는 것은 all the industrialised countries(모든 산업 국가), 복수다. its(그것의)는 하나만 가리킨다."],["simultaneously","","","동사 think(생각하다)를 꾸미는 부사."],["supporting","","","체계들이 수집을 뒷받침하는 쪽이라 능동 -ing."],["to_decide","","","seem(~처럼 보이다) + to부정사."]],"opts":["they","theirs","their","his"],"or":["they(그것들은): 주격이라 전치사 of(~의) 뒤 동명사 앞 자리에 못 옴.","theirs(그것들의 것): 소유대명사라 뒤의 동명사와 이어질 수 없음.","their(그것들의): 복수 countries(국가들)를 가리키고, 동명사 becoming(~이 되는 것)의 의미상 주어로 소유격이 맞음.","his(그의): 남자 한 명을 가리키는 말이라 countries(국가들)와 안 맞음."],"point":"대명사의 성·수·격","en":"This process occurred in all the industrialised countries as a key part of their becoming modern states.","ko":"이러한 과정은 모든 산업 국가에서 그것들이 근대 국가가 되는 것의 핵심적인 부분으로 발생했다.","hl":["their becoming"],"khl":["그것들이 근대 국가가 되는 것"],"blocks":[{"t":"p","h":"누구의 일인가 찾기","x":["becoming modern states(근대 국가가 되는 것)는 누가 하는 일인가?","근대 국가가 되는 건 나라들, 즉 all the industrialised countries(모든 산업 국가)다.","나라가 여럿이니 their(그것들의).","its(그것의)를 쓰면 하나를 가리켜 수가 안 맞는다.","뒤의 modern states(근대 국가들)도 복수라는 게 힌트다."]},{"t":"pair","h":"쉬운 예시","x":[["The students opened their books.","학생들은 자기 책을 펼쳤다. (students(학생들) → their(그들의))"],["The dog wagged its tail.","그 개는 꼬리를 흔들었다. (dog(개) 한 마리 → its(그것의))"]]}],"post":["복수 countries(국가들) → their(그것들의) becoming(~이 되는 것)"]}],"quiz":[{"s":"I read a letter ___ by my grandma.","o":["written","writing"],"a":0,"ko":"나는 할머니가 쓰신 편지를 읽었다.","why":"편지는 쓰인 쪽이라 p.p.","wy":"writing(쓰는): 편지가 직접 쓰는 뜻이 되어 틀림."},{"s":"A big change ___ last year.","o":["was happened","happened"],"a":1,"ko":"작년에 큰 변화가 일어났다.","why":"happen(일어나다)은 수동태가 없다.","wy":"was happened(일어나졌다): happen(일어나다)은 목적어가 없는 동사라 수동이 안 됨."},{"s":"The children in this town ___ kind.","o":["are","is"],"a":0,"ko":"이 마을의 아이들은 친절하다.","why":"children(아이들)은 child(아이)의 복수.","wy":"is(~이다): 단수 동사라 복수 주어 children(아이들)과 안 맞음."},{"s":"She is interested in ___ pictures.","o":["take","taking"],"a":1,"ko":"그녀는 사진 찍는 것에 관심이 있다.","why":"전치사 in(~에) 뒤는 -ing.","wy":"take(찍다): 전치사 뒤에 동사원형은 못 옴."},{"s":"The birds built ___ nests in the tree.","o":["its","their"],"a":1,"ko":"새들은 나무에 둥지를 지었다.","why":"birds(새들)가 복수라 their(그들의).","wy":"its(그것의): 하나를 가리키는 말이라 복수 birds(새들)와 안 맞음."}]},{"items":[{"slots":[["became","becoming","a","주어 Statistics(통계 자료) 뒤 진짜 동사 자리다. becoming(~이 되는)으로는 문장이 끝나지 않는다."],["systematic","","","명사 collection(수집)을 꾸미는 형용사."],["being_measured","","","대상들은 측정되는 쪽이라 being p.p.(~되는)."],["are_devised","","","주어 categories(범주들)와 frameworks(체계들)가 복수, 고안되는 쪽이라 are devised(고안된다)."],["seeming","","","전치사 without(~없이) 뒤 동명사."]],"opts":["to become","became","having become","been"],"or":["to become(~이 되는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","became(~이 되었다): 주어 Statistics(통계 자료)의 진짜 동사이고 20세기 이야기라 과거형이 맞음.","having become(~이 되고 나서): 완료 -ing형이라 동사 자리에 못 옴.","been(~였던): 과거분사만으로는 동사가 못 되고, 앞에 have(완료 조동사)가 있어야 함."],"point":"정동사 vs. 준동사","en":"Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.","ko":"20세기의 통계 자료는 국가에 의해서 필요한 정량적인 정보의 체계적인 수집이 되었다.","hl":["Statistics","became"],"khl":["통계 자료는","되었다"],"blocks":[{"t":"p","h":"문장의 심장 찾기","x":["문장에는 심장 같은 진짜 동사가 꼭 하나 있어야 한다.","주어는 Statistics(통계 자료). in the twentieth century(20세기의)는 꾸밈말.","needed(필요로 되는)는 information(정보)을 꾸미는 p.p.라 심장이 아니다.","그래서 심장 자리는 became(~이 되었다).","becoming(~이 되는)을 쓰면 문장에 심장이 없어진다."]},{"t":"pair","h":"쉬운 예시","x":[["My brother became a doctor.","우리 형은 의사가 되었다. (became(되었다) = 진짜 동사)"],["The man standing there is my uncle.","저기 서 있는 남자는 우리 삼촌이다. (standing(서 있는) = 꾸밈, is(~이다) = 진짜 동사)"]]}],"post":["주어 Statistics(통계 자료) + 진짜 동사 became(~이 되었다)"]},{"slots":[["occurred","","","occur(일어나다)는 수동이 없는 동사."],["simultaneously","","","동사 think(생각하다)를 꾸미는 부사."],["do_exist","does exist","a","주어는 the objects(대상들), 복수다. being measured(측정되는)는 꾸밈말. 강조의 do(정말)도 주어에 맞춰 do."],["exist","","","주어 Phenomena(현상들)가 복수라 exist(존재하다)."],["supporting","","","체계들이 수집을 뒷받침하는 쪽이라 능동 -ing."]],"opts":["do exist","doing exist","to exist","exists"],"or":["do exist(정말 존재하다): 복수 주어 the objects(대상들)에 맞춘 강조 do + 동사원형이라 맞음.","doing exist(정말 존재하는): -ing형은 동사 자리에 못 오고, 강조 do는 -ing로 쓰지 않음.","to exist(존재하는 것): to부정사는 that(~라는 것) 뒤 문장의 동사 자리에 못 옴.","exists(존재하다, 3인칭 단수형): 주어 the objects(대상들)가 복수라 s를 붙이면 안 됨."],"point":"수식받는 주어의 수일치","en":"Desrosières writes: \"It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention\".","ko":"Desrosières는 '측정되는 대상들이 실제로 확실히 존재한다는 것과 이것이 단지 하나의 관례라는 것을 동시에 생각하기는 어렵다'라고 기술한다.","hl":["the objects being measured really do exist"],"khl":["측정되는 대상들이 실제로 확실히 존재한다는 것"],"blocks":[{"t":"p","h":"강조의 do(정말)도 주인을 본다","x":["do(정말) + 동사원형 = \"정말 ~하다\"라고 힘을 주는 말이다.","강조의 do(정말)도 주어에 맞춰 do(복수·I·you), does(3인칭 단수), did(과거)로 바뀐다.","주인은 the objects(대상들), 복수다.","being measured(측정되는)는 꼬리표다.","그래서 do exist(정말 존재하다)."]},{"t":"pair","h":"쉬운 예시","x":[["They do love music.","그들은 정말 음악을 사랑한다. (They(그들) → do(정말))"],["She does love music.","그녀는 정말 음악을 사랑한다. (She(그녀) → does(정말))"]]}],"post":["복수 주어 the objects(대상들) + do exist(정말 존재하다)"]},{"slots":[["their","","","복수 countries(국가들)를 가리키는 소유격."],["that","","","and 앞의 첫 번째 that(~라는 것)과 짝인 접속사."],["making","","","전치사 of(~의) 뒤 동명사."],["seeming","","","전치사 without(~없이) 뒤 동명사."],["characterising","characterises","a","진짜 동사는 앞의 described(묘사했다)다. 접속사 없이 콤마 뒤에 동사를 또 쓸 수 없으니 characterising(특징지으면서)."]],"opts":["characterising","characterise","characterised","has characterised"],"or":["characterising(특징지으면서): 진짜 동사 described(묘사했다)가 있으니 콤마 뒤 덧붙임은 분사구문 -ing가 맞음.","characterise(특징짓다): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐.","characterised(특징지었다, 특징지어진): 과거형이면 동사가 겹치고, 뒤에 목적어 it(그것)이 있어 수동 p.p.도 안 됨.","has characterised(특징지어 왔다): 현재완료도 진짜 동사라 접속사 없이 못 붙음."],"point":"정동사 vs. 준동사","en":"Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of making decisions without seeming to decide\", characterising it as a \"social technology\" intended to build trust in authority.","ko":"Theodore Porter는 국가의 권위를 창조하기 위한 통계 자료의 사용을, '정량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방법'이라고 묘사했고, 그것을 권위에 대한 신뢰를 구축하기 위해 의도된 '사회적 기술'로 특징지었다.","hl":["described","characterising"],"khl":["묘사했고","특징지었다"],"blocks":[{"t":"p","h":"따옴표 속 말은 잠시 치워 두기","x":["인용문(따옴표 속 말)은 따로 떼어 두고 바깥 문장만 본다.","바깥 문장: Theodore Porter described(묘사했다) ..., characterising(특징지으면서) ...","진짜 동사는 described(묘사했다) 하나다.","콤마 뒤 \"특징지으면서\"는 덧붙임이라 -ing.","characterises(특징짓다)로 바꾸면 접속사 없이 동사가 둘이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["He left the room, closing the door.","그는 문을 닫으면서 방을 나갔다. (closing(닫으면서) = 덧붙임)"],["She waved at me, smiling brightly.","그녀는 환하게 웃으며 나에게 손을 흔들었다. (smiling(웃으며) = 덧붙임)"]]}],"post":["진짜 동사 described(묘사했다) 뒤 콤마 덧붙임은 -ing: characterising(특징지으면서)"]},{"slots":[["systematic","systematically","a","the(그) + ___ + collection(수집). 명사를 꾸미는 자리라 형용사. 부사 systematically(체계적으로)는 명사를 못 꾸민다."],["being_measured","","","대상들은 측정되는 쪽이라 being p.p.(~되는)."],["are_devised","","","복수 주어, 고안되는 쪽이라 are devised(고안된다)."],["to_decide","","","seem(~처럼 보이다) + to부정사."],["intended","","","사회적 기술은 의도된 쪽이라 과거분사."]],"opts":["systematize","systematic","systematizes","to systematize"],"or":["systematize(체계화하다): 동사라 the(그)와 명사 사이 꾸밈 자리에 못 옴.","systematic(체계적인): 명사 collection(수집)을 꾸미는 형용사라 맞음.","systematizes(체계화하다, 3인칭 단수형): 동사라 명사를 꾸밀 수 없고 became(~이 되었다)과 동사가 겹침.","to systematize(체계화하는 것): to부정사는 the(그)와 명사 사이에 들어갈 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.","ko":"20세기의 통계 자료는 국가에 의해서 필요한 정량적인 정보의 체계적인 수집이 되었다.","hl":["the systematic collection"],"khl":["체계적인 수집"],"blocks":[{"t":"p","h":"the와 명사 사이는 형용사 자리","x":["the(그) + 형용사 + 명사: the systematic collection(체계적인 수집).","systematic(체계적인) → collection(수집). 화살표가 명사로 간다.","명사를 꾸미는 건 형용사, 동사를 꾸미는 건 부사다.","같은 지문의 think simultaneously(동시에 생각하다)는 동사를 꾸미니 부사다."]},{"t":"pair","h":"쉬운 예시","x":[["He is a quick runner.","그는 빠른 주자다. (quick(빠른) → runner(주자))"],["He runs quickly.","그는 빠르게 달린다. (quickly(빠르게) → runs(달린다))"]]}],"post":["the + 형용사 + 명사: the systematic collection(체계적인 수집)"]},{"slots":[["became","","","주어 Statistics(통계 자료)의 진짜 동사."],["needed","","","정보는 필요로 되는 쪽이라 p.p."],["that","what","a","and 앞의 첫 번째 that(~라는 것)과 짝이다. 뒤의 this is only a convention(이것은 관례일 뿐이다)이 완전한 문장이라 that. what(~하는 것)은 뒤에 빠진 것이 있어야 한다."],["making","","","전치사 of(~의) 뒤 동명사."],["characterising","","","진짜 동사 described(묘사했다) 뒤 분사구문."]],"opts":["which","whose","that","who"],"or":["which(~하는): 관계대명사라 뒤에 빠진 자리가 있어야 하는데 뒤 문장이 완전함.","whose(~의): 뒤에 꾸밀 명사가 바로 와야 하고, 앞에 받을 명사도 없음.","that(~라는 것, 접속사): 뒤의 this is only a convention(이것은 관례일 뿐이다)이 완전한 문장이고 앞 that(~라는 것)과 and로 짝을 이루니 맞음.","who(~하는): 사람을 받는 관계대명사라 앞에 사람 명사가 없고 뒤 문장도 완전함."],"point":"that vs. what","en":"It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention","ko":"측정되는 대상들이 실제로 확실히 존재한다는 것과 이것이 단지 하나의 관례라는 것을 동시에 생각하기는 어렵다","hl":["and that this is only a convention"],"khl":["이것이 단지 하나의 관례라는 것"],"blocks":[{"t":"p","h":"뒤 문장이 완전한지 검사","x":["that(~라는 것) 뒤에는 빠진 것 없는 완전한 문장이 온다.","what(~하는 것) 뒤에는 주어나 목적어가 빠진 문장이 온다.","this is only a convention(이것은 단지 관례일 뿐이다): 주어 this(이것), 동사 is(~이다), 보어 a convention(관례). 빠진 게 없다.","그러니 that(~라는 것)."]},{"t":"tap","h":"확인 질문","q":"think(생각하다)의 목적어는 몇 개인가?","a":["두 개. \"대상들이 정말 존재한다는 것\"과 \"이것이 관례일 뿐이라는 것\".","and(그리고) 양쪽이 같은 that(~라는 것) 덩어리로 짝을 이룬다."]},{"t":"pair","h":"쉬운 예시","x":[["I know that he is honest.","나는 그가 정직하다는 것을 안다. (뒤 문장 완전 → that)"],["I know what he wants.","나는 그가 원하는 것을 안다. (wants(원하다)의 목적어가 빠짐 → what)"]]}],"post":["that(~라는 것) + 완전한 문장: and that this is only a convention(그리고 이것이 관례일 뿐이라는 것)"]}],"quiz":[{"s":"The girl wearing a red hat ___ my sister.","o":["is","being"],"a":0,"ko":"빨간 모자를 쓴 소녀는 내 여동생이다.","why":"we
