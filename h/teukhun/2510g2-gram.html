,"en":"Viewing time as a purchasable and consistent product cemented artificial views on time into our psyche.","ko":"시간을 구매 가능하고 일관된 상품으로 보는 것은 시간에 대한 인위적인 관점을 우리의 정신 속에 고착시켰다.","hl":["Viewing","cemented"],"khl":["보는 것은","고착시켰다"],"blocks":[{"t":"p","h":"동사는 한 문장에 하나","x":["이 문장의 진짜 동사는 cemented(고착시켰다)다.","그 앞 Viewing time as ... product(시간을 ~ 상품으로 보는 것)는 통째로 주어다.","주어 자리에 동사를 넣으려면 -ing를 붙여 명사처럼 만든다.","View(보다)를 그대로 두면 동사가 두 개 생긴다."]},{"t":"pair","h":"쉬운 예시","x":[["Watching movies makes me happy.","영화를 보는 것은 나를 행복하게 한다. (주어 Watching(보는 것), 동사 makes(만든다))"],["Learning English takes time.","영어를 배우는 것은 시간이 걸린다. (주어 Learning(배우는 것), 동사 takes(걸린다))"]]},{"t":"tap","h":"확인 질문","q":"이 문장에서 시제가 있는 진짜 동사는 몇 개인가?","a":["cemented(고착시켰다) 하나다.","그래서 맨 앞 View(보다)는 Viewing(보는 것)으로 옷을 바꿔야 한다."]}],"post":["Viewing ~ product(~을 상품으로 보는 것) = 주어, cemented(고착시켰다) = 동사"]},{"slots":[["cemented","","","주어 Viewing ... product(~을 상품으로 보는 것)의 진짜 동사다."],["are_forced","being forced","a","주어 we(우리) 뒤에 진짜 동사가 있어야 한다. being forced(강요받는 것)는 -ing형이라 동사 자리에 설 수 없다. 우리가 강요받는 쪽이고 뒤에 사람 목적어도 없으니 be동사를 살린 수동 are forced(강요받다)여야 한다."],["to_acknowledge","","","be forced to V(어쩔 수 없이 ~하다)."],["has","","","주어 a second(1초)가 단수라 has(~해 왔다)."],["its","","","the Earth(지구)를 가리키니 단수 소유격 its(그것의)."]],"opts":["are forced","force","forcing","have forced"],"or":["are forced(강요받다): 우리가 강요받는 쪽이고 뒤에 목적어가 없어 수동이 맞음.","force(강요하다): 능동이라 force(강요하다) 뒤에 사람 목적어가 있어야 하는데 바로 to가 옴.","forcing(강요하는): -ing만으로는 주어 we(우리)의 진짜 동사가 될 수 없음.","have forced(강요해 왔다): 능동이라 목적어가 있어야 하는데 없음."],"point":"동사 자리 + 수동태","en":"Every now and again we are forced to acknowledge this mistake.","ko":"때때로 우리는 이러한 실수를 인정하지 않을 수 없다.","hl":["we are forced to acknowledge"],"khl":["인정하지 않을 수 없다"],"blocks":[{"t":"p","h":"목적어 자리가 비었나 보기","x":["능동: Nature forces us to acknowledge it. (자연이 우리에게 그것을 인정하게 만든다.)","force(강요하다) 바로 뒤에 us(우리를)라는 사람이 있다.","수동: We are forced to acknowledge it. (우리는 그것을 인정할 수밖에 없다.)","사람 us(우리를)가 주어 We(우리는)로 올라가면 그 자리가 빈다.","빈자리가 보이면 be p.p.(~되다)."]},{"t":"pair","h":"쉬운 예시","x":[["I was forced to wait.","나는 어쩔 수 없이 기다려야 했다. (was forced = 강요받았다)"],["He forced me to wait.","그는 나에게 기다리라고 강요했다. (forced me = 나에게 강요했다)"]]}],"post":["force(강요하다) + 사람 + to V → 사람이 주어면 be forced to V(어쩔 수 없이 ~하다)"]},{"slots":[["to_acknowledge","","","be forced to V(어쩔 수 없이 ~하다)."],["has","","","주어 a second(1초)가 단수라 has(~해 왔다)."],["its","their","a","가리키는 것은 the Earth(지구) 하나다. 하나를 가리키는 소유격은 its(그것의)."],["to_change","","","cause(~하게 하다) + 목적어 + to부정사."],["dramatically","","","동사 change(바뀌다)를 꾸미니 부사가 맞다."]],"opts":["its","it's","it","them"],"or":["its(그것의): 단수 the Earth(지구)를 가리키는 소유격이라 명사 spin(회전) 앞에 맞음.","it's(그것은 ~이다): it is(그것은 ~이다)의 줄임말이라 명사 spin(회전) 앞 소유격 자리에 못 옴.","it(그것): 주격·목적격이라 명사 spin(회전)을 꾸밀 수 없음.","them(그것들을): 목적격이고 복수라 명사 앞에 못 오고 수도 안 맞음."],"point":"대명사의 성·수·격","en":"A second has been added to everyone's day to adjust for the Earth wobbling and the rate of its spin changing.","ko":"지구가 흔들리는 것과 그것의 자전 속도가 변하는 것에 맞추기 위해 모든 사람의 하루에 1초가 추가되어 왔다.","hl":["the Earth","its spin"],"khl":["지구가","그것의 자전 속도"],"blocks":[{"t":"p","h":"대명사는 거울이다","x":["대명사는 앞에 나온 명사를 그대로 비추는 거울이다.","거울에 비친 것은 the Earth(지구), 딱 하나.","하나면 its(그것의), 여럿이면 their(그것들의).","its(그것의)와 it's(그것은 ~이다)는 소리는 같아도 전혀 다른 말이다."]},{"t":"pair","h":"쉬운 예시","x":[["The cat licked its paw.","고양이가 자기 발을 핥았다. (고양이 한 마리 → its = 그것의)"],["The cats licked their paws.","고양이들이 자기 발을 핥았다. (고양이 여러 마리 → their = 그것들의)"]]}],"post":["the Earth(지구) = 하나 → its spin(그것의 자전)"]},{"slots":[["slow","","","조동사 can(~할 수 있다) 뒤라 동사원형 slow(늦추다)."],["slightly","","","동사 slow(늦추다)를 꾸미는 부사다."],["because","because of","a","뒤에 the moon's gravity is acting(달의 중력이 작용하고 있다)이라는 주어+동사 문장이 온다. 문장 앞에는 접속사 because(~이기 때문에)."],["are_getting","","","주어 days(하루들)가 복수라 are getting(점점 ~해지고 있다)."],["disturb","","","주어 Such events(그러한 사건들)가 복수라 s 없는 disturb(방해하다)."]],"opts":["due to","owing to","because","instead of"],"or":["due to(~ 때문에): 전치사구라 뒤에 명사만 오는데 문장이 옴.","owing to(~ 때문에): 전치사구라 뒤에 명사만 오는데 문장이 옴.","because(~이기 때문에): 접속사라 뒤에 주어+동사가 있는 문장이 와서 맞음.","instead of(~ 대신에): 전치사구라 문장이 못 오고 뜻도 안 맞음."],"point":"접속사 vs. 전치사","en":"Indeed, the Earth's spin is generally slowing because the moon's gravity is acting as a drag.","ko":"실제로 지구의 자전은 일반적으로 둔화되고 있는데 이는 달의 중력이 끌어당기는 힘으로 작용하고 있기 때문이다.","hl":["because the moon's gravity is acting"],"khl":["달의 중력이 끌어당기는 힘으로 작용하고 있기 때문이다"],"blocks":[{"t":"p","h":"뒤에 동사가 있나 세어 보기","x":["because(~이기 때문에)와 because of(~ 때문에)는 뜻이 같아도 뒤에 오는 것이 다르다.","because(~이기 때문에) + 주어 + 동사","because of(~ 때문에) + 명사","뒤에 is acting(작용하고 있다)이라는 동사가 보인다.","동사가 있으면 because(~이기 때문에)."]},{"t":"pair","h":"쉬운 예시","x":[["I was late because it rained.","비가 와서 나는 늦었다. (it rained = 비가 왔다 → because = ~이기 때문에)"],["I was late because of the rain.","비 때문에 나는 늦었다. (명사 the rain(비) → because of)"]]}],"post":["because(~이기 때문에) + 주어 + 동사, because of(~ 때문에) + 명사"]},{"slots":[["based","","","time(시간)이 지구 자전에 \"기반을 둔\" 쪽이라 과거분사."],["naturally","","","분사 occurring(발생하는)을 꾸미니 부사가 맞다."],["occurring","","","occur(일어나다)는 목적어를 갖지 않는 동사라 -ing로 꾸민다."],["happen","happens","a","주어는 events(사건들), 복수다. like this(이런)는 꾸며 주는 꼬리표일 뿐."],["that","","","the false hope(헛된 희망)의 내용을 설명하는 동격 that(~라는)."]],"opts":["happening","to happen","happen","has happened"],"or":["happening(일어나는): -ing는 혼자 진짜 동사 자리에 못 옴.","to happen(일어나는 것): to부정사도 진짜 동사 자리에 못 옴.","happen(일어나다): 복수 주어 events(사건들)에 맞는 s 없는 현재형이라 맞음.","has happened(일어났다): has(단수형)라 복수 주어 events(사건들)와 안 맞음."],"point":"수식받는 주어의 수일치","en":"When events like this happen, a bunch of humans make the decision to add a small slice of time to your day.","ko":"이런 일이 발생할 때, 몇몇 사람들은 여러분의 하루에 아주 작은 시간 조각을 추가하기로 결정한다.","hl":["events like this happen"],"khl":["이런 일이 발생할 때"],"blocks":[{"t":"p","h":"꼬리표 떼고 주인 보기","x":["When(~할 때) 뒤 작은 문장의 주인은 events(사건들)다.","like this(이런)는 events(사건들)에 붙은 꼬리표다.","this(이것)가 단수처럼 보여도 동사와는 상관없다.","주인이 여럿이니 happen(일어나다)에 s를 붙이지 않는다."]},{"t":"pair","h":"쉬운 예시","x":[["Kids like him love soccer.","그 아이 같은 아이들은 축구를 좋아한다. (주인 Kids(아이들) → love)"],["Days like this make me smile.","이런 날들은 나를 웃게 한다. (주인 Days(날들) → make)"]]}],"post":["꼬리표(like this = 이런) 떼고 주인(events = 사건들) 보고 happen(일어나다)"]}],"quiz":[{"s":"___ breakfast every day is good for you.","o":["Eat","Eating"],"a":1,"ko":"매일 아침을 먹는 것은 너에게 좋다.","why":"진짜 동사는 is(~이다). 주어 자리라 Eating(먹는 것).","wy":"Eat(먹다): 동사원형이 주어 자리에 오면 동사가 두 개가 됨."},{"s":"We were ___ to stay inside.","o":["forcing","forced"],"a":1,"ko":"우리는 어쩔 수 없이 안에 있어야 했다.","why":"우리가 강요받는 쪽, 뒤에 목적어 없음.","wy":"forcing(강요하는): 능동이라 뒤에 사람 목적어가 있어야 하는데 없음."},{"s":"The dog wagged ___ tail.","o":["its","their"],"a":0,"ko":"그 개는 꼬리를 흔들었다.","why":"개 한 마리라 its(그것의).","wy":"their(그들의): 여럿을 가리키는 말이라 개 한 마리와 안 맞음."},{"s":"I stayed home ___ it was raining.","o":["because of","because"],"a":1,"ko":"비가 오고 있어서 나는 집에 있었다.","why":"뒤에 it was raining(비가 오고 있었다), 주어+동사.","wy":"because of(~ 때문에): 뒤에 명사만 오는데 문장이 옴."},{"s":"Students like him ___ hard.","o":["studies","study"],"a":1,"ko":"그 같은 학생들은 열심히 공부한다.","why":"주인 Students(학생들)가 복수.","wy":"studies(공부하다, 3인칭 단수형): 꼬리표 him(그)에 속은 단수 모양."}]},{"items":[{"slots":[["Viewing","","","주어 자리라 동명사 Viewing(보는 것)."],["cemented","cementing","a","주어 Viewing ... product(~을 상품으로 보는 것) 뒤에 문장의 진짜 동사가 필요하다. -ing로는 동사가 될 수 없다."],["are_forced","","","우리가 강요받는 쪽이라 수동."],["to_acknowledge","","","be forced to V(어쩔 수 없이 ~하다)."],["has","","","주어 a second(1초)가 단수라 has(~해 왔다)."]],"opts":["to cement","having cemented","being cemented","cemented"],"or":["to cement(고착시키는 것): to부정사는 진짜 동사가 될 수 없음.","having cemented(고착시키고 나서): -ing형이라 진짜 동사 자리에 못 옴.","being cemented(고착되는 것): -ing형이라 동사가 될 수 없고, 뒤에 목적어도 있어 수동도 안 맞음.","cemented(고착시켰다): 주어의 진짜 동사인 과거형이라 맞음."],"point":"정동사 vs. 준동사","en":"Viewing time as a purchasable and consistent product cemented artificial views on time into our psyche.","ko":"시간을 구매 가능하고 일관된 상품으로 보는 것은 시간에 대한 인위적인 관점을 우리의 정신 속에 고착시켰다.","hl":["Viewing","cemented"],"khl":["보는 것은","고착시켰다"],"blocks":[{"t":"p","h":"주어가 길면 동사를 놓치기 쉽다","x":["주어 Viewing time as a purchasable and consistent product(시간을 구매 가능하고 일관된 상품으로 보는 것)가 아주 길다.","긴 주어가 끝나면 반드시 진짜 동사가 하나 나와야 한다.","그 자리가 cemented(고착시켰다)다.","여기를 -ing로 바꾸면 주어만 있고 동사가 없는 문장이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["Riding a bike in the park was fun.","공원에서 자전거를 탄 것은 재미있었다. (주어 Riding(타는 것) ~ park(공원), 동사 was(~였다))"],["Helping my friends made me happy.","친구들을 도운 것은 나를 행복하게 했다. (동사 made(만들었다))"]]}],"post":["긴 주어 Viewing ~ product(~을 상품으로 보는 것) 끝 → 진짜 동사 cemented(고착시켰다)"]},{"slots":[["has","","","주어 a second(1초)가 단수라 has(~해 왔다)."],["its","","","the Earth(지구)를 가리키는 단수 소유격."],["to_change","change","a","cause(~하게 하다)는 사역동사가 아니다. cause + 목적어 + to부정사로 쓴다."],["dramatically","","","동사 change(바뀌다)를 꾸미는 부사다."],["slow","","","조동사 can(~할 수 있다) 뒤 동사원형."]],"opts":["to change","changing","changed","changes"],"or":["to change(바뀌는 것): cause(~하게 하다) + 목적어 뒤는 to부정사라 맞음.","changing(바뀌는): cause(~하게 하다)의 목적격보어로 -ing는 쓰지 않음.","changed(바뀐): 바람의 속도가 스스로 바뀌는 쪽이라 p.p.(과거분사)는 안 맞음.","changes(바뀌다): 동사 causes(일으킨다)가 이미 있어 목적어 뒤에 동사가 또 올 수 없음."],"point":"목적격보어(준동사)","en":"For instance, when El Niño, a climatic system in the Pacific, causes wind speed to change dramatically, it can slow the rotation of the Earth slightly.","ko":"예를 들어 태평양의 한 기후 체계인 엘니뇨가 바람의 속도가 극적으로 바뀌는 것을 유발할 때, 그것은 지구의 자전을 약간 느리게 할 수 있다.","hl":["causes wind speed to change"],"khl":["바람의 속도가 극적으로 바뀌는 것을 유발할 때"],"blocks":[{"t":"p","h":"cause(~하게 하다)는 to를 데리고 다닌다","x":["make(만들다), let(허락하다), have(시키다) 뒤에는 동사원형이 온다.","cause(~하게 하다)는 뜻이 비슷해도 이 무리가 아니다.","cause(~하게 하다)는 want(원하다), ask(부탁하다)처럼 to를 붙인다.","causes wind speed to change(바람 속도가 바뀌게 한다)."]},{"t":"pair","h":"쉬운 예시","x":[["The rain caused the game to stop.","비 때문에 경기가 멈췄다. (caused(~하게 했다) + the game(경기) + to stop(멈추다))"],["Mom made me eat vegetables.","엄마는 내가 채소를 먹게 했다. (made me eat = 나를 먹게 했다)"]]}],"post":["cause(~하게 하다) + 목적어 + to V: causes wind speed to change(바람 속도를 바뀌게 하다)"]},{"slots":[["slightly","","","동사 slow(늦추다)를 꾸미는 부사."],["because","","","뒤에 주어+동사 문장이 와서 접속사 because(~이기 때문에)."],["are_getting","is getting","a","주어는 days(하루들), 복수다. 복수 주어에는 are(~이다)."],["disturb","","","주어 Such events(그러한 사건들)가 복수라 disturb(방해하다)."],["based","","","time(시간)이 \"기반을 둔\" 쪽이라 과거분사."]],"opts":["getting","gets","to get","are getting"],"or":["getting(~해지는): be동사 없이 -ing만으로는 진짜 동사가 될 수 없음.","gets(~해지다, 3인칭 단수형): s가 붙어 복수 주어 days(하루들)와 안 맞음.","to get(~해지는 것): to부정사는 진짜 동사가 될 수 없음.","are getting(점점 ~해지고 있다): 복수 주어 days(하루들)에 맞는 현재진행형이라 맞음."],"point":"수식받는 주어의 수일치","en":"So days are getting longer by about 1.7 milliseconds per century.","ko":"그래서 하루는 한 세기마다 약 1.7밀리세컨드씩 점점 더 길어지고 있다.","hl":["days are getting longer"],"khl":["점점 더 길어지고 있다"],"blocks":[{"t":"p","h":"s가 붙은 명사, s 없는 동사","x":["days(하루들)의 s는 \"여럿\"이라는 표시다.","여럿인 주인에게는 are(~이다)를 붙인다.","한국어 해석은 \"하루는\"이라 하나처럼 들리지만 영어는 days(하루들), 복수다.","해석 말고 영어 모양을 보고 정한다."]},{"t":"pair","h":"쉬운 예시","x":[["The days are getting warmer.","날이 점점 따뜻해지고 있다. (days(날들) → are)"],["The weather is getting warmer.","날씨가 점점 따뜻해지고 있다. (weather(날씨) → is)"]]}],"post":["days(하루들) = 복수 → are getting longer(점점 길어지고 있다)"]},{"slots":[["are_getting","","","주어 days(하루들)가 복수라 are getting(점점 ~해지고 있다)."],["disturb","","","주어 Such events(그러한 사건들)가 복수라 disturb(방해하다)."],["based","basing","a","base(기반을 두다)는 base A on B(A를 B에 기반을 두다)로 쓴다. time(시간)은 기반을 \"두게 되는\" 쪽이라 based on(~에 기반을 둔)."],["naturally","","","분사 occurring(발생하는)을 꾸미는 부사."],["occurring","","","rotation(자전)이 스스로 \"일어나는\" 쪽이라 -ing."]],"opts":["bases","to base","based","having based"],"or":["bases(기반을 두다): 동사라 접속사 없이 문장 안에 동사가 하나 더 생김.","to base(기반을 두는 것): 능동이라 base(기반을 두다)의 목적어가 필요한데 바로 on(~에)이 옴.","based(기반을 둔): time(시간)이 기반을 두게 되는 쪽이라 과거분사가 뒤에서 꾸며 맞음.","having based(기반을 두고 나서): 능동이라 목적어가 필요한데 없고, 시간이 직접 무엇을 기반에 두는 셈이 됨."],"point":"능동 -ing vs. 수동 p.p.","en":"Such events disturb the similarity between man-made time and more flexible time based on the Earth's naturally occurring rotation.","ko":"그러한 사건들은 인간이 만든 시간과 지구의 자연적으로 발생하는 자전에 기반한 더 유연한 시간 사이의 유사성을 방해한다.","hl":["time based on"],"khl":["자전에 기반한 더 유연한 시간"],"blocks":[{"t":"p","h":"based on(~에 기반을 둔)은 한 덩어리로","x":["base(기반을 두다)는 목적어를 가지는 동사다.","be based on(~에 기반을 두다)처럼 거의 늘 수동으로 쓴다.","명사 뒤에서 꾸밀 때는 be를 빼고 based on(~에 기반을 둔)만 남는다.","time based on(~에 기반을 둔 시간)."]},{"t":"pair","h":"쉬운 예시","x":[["This movie is based on a true story.","이 영화는 실화를 바탕으로 한다. (is based on = 바탕으로 한다)"],["I read a book based on his life.","나는 그의 삶을 바탕으로 한 책을 읽었다. (명사 a book(책) ← based on)"]]}],"post":["명사 + based on(~에 기반을 둔): time based on(~에 기반한 시간)"]},{"slots":[["naturally","","","분사 occurring(발생하는)을 꾸미는 부사."],["occurring","","","rotation(자전)이 스스로 일어나는 쪽이라 -ing."],["happen","","","주어 events(사건들)가 복수라 happen(일어나다)."],["that","","","the false hope(헛된 희망)의 내용을 설명하는 동격 that(~라는)."],["doesnt","don't","a","앞 문장의 동사 will yield(굴복할 것이다)는 일반동사라 대신 받는 말은 do(하다)다. 주어 It(그것 = 자연)이 단수이므로 don't(그러지 않는다)가 아니라 doesn't(그러지 않는다)여야 한다."]],"opts":["doesn't","aren't","wasn't","weren't"],"or":["doesn't(그러지 않는다): 일반동사 yield(굴복하다)를 대신 받고 주어 It(그것)이 단수라 맞음.","aren't(~이 아니다): be동사라 일반동사 yield(굴복하다)를 대신 받을 수 없고 수도 안 맞음.","wasn't(~이 아니었다): be동사라 일반동사 yield(굴복하다)를 대신 받을 수 없음.","weren't(~이 아니었다): be동사 과거형이라 일반동사 yield(굴복하다)를 대신 받을 수 없고 단수 주어 It(그것)과 수도 안 맞음."],"point":"대동사","en":"We try to force our fixed, man-made view of time on nature in the false hope that it will yield. It doesn't.","ko":"우리는 자연이 굴복할 것이라는 헛된 희망을 지니고 우리의 고정된, 인간이 만든 시간에 대한 관점을 자연에 강요하려고 노력한다. 그러나 자연은 그러지 않는다.","hl":["it will yield","It doesn't"],"khl":["자연이 굴복할 것이라는","그러지 않는다"],"blocks":[{"t":"p","h":"대동사는 앞 동사의 종류를 따른다","x":["It doesn't.(그러지 않는다.)는 It doesn't yield.(그것은 굴복하지 않는다.)를 줄인 말이다.","yield(굴복하다)는 be동사가 아닌 일반동사다.","일반동사를 대신 받을 때는 do(하다), does(하다), did(했다)를 쓴다.","주어 It(그것)은 단수라 do(하다)가 아니라 does(하다)다.","It don't.(그것은 그러지 않는다.)처럼 쓰면 수가 안 맞는다.","be동사(is = ~이다, are = ~이다)를 쓰면 \"자연은 ~이 아니다\"가 되어 무엇이 아닌지 알 수 없다."]},{"t":"pair","h":"쉬운 예시","x":[["I like pizza, but my sister doesn't.","나는 피자를 좋아하지만 내 여동생은 그렇지 않다. (like(좋아하다) → doesn't)"],["I am tired, but he isn't.","나는 피곤하지만 그는 그렇지 않다. (am(~이다) → isn't)"]]}],"post":["일반동사(yield = 굴복하다) 받기 + 단수 주어 → It doesn't(그러지 않는다)"]}],"quiz":[{"s":"My friend ___ me a letter yesterday.","o":["sent","sending"],"a":0,"ko":"내 친구가 어제 나에게 편지를 보냈다.","why":"주어 My friend(내 친구)의 진짜 동사가 필요.","wy":"sending(보내는): -ing는 혼자 진짜 동사가 될 수 없음."},{"s":"The noise caused the baby ___.","o":["cry","to cry"],"a":1,"ko":"그 소음은 아기를 울게 했다.","why":"cause(~하게 하다) + 목적어 + to V.","wy":"cry(울다): cause(~하게 하다)는 사역동사가 아니라 동사원형을 쓰지 않음."},{"s":"The days ___ getting shorter.","o":["are","is"],"a":0,"ko":"날이 점점 짧아지고 있다.","why":"주인 The days(날들)가 복수.","wy":"is(~이다): 단수 동사라 복수 주어 The days(날들)와 안 맞음."},{"s":"This movie is ___ on a true story.","o":["basing","based"],"a":1,"ko":"이 영화는 실화를 바탕으로 한다.","why":"be based on(~을 바탕으로 하다).","wy":"basing(기반을 두는): 능동이라 목적어가 필요한데 바로 on(~에)이 옴."},{"s":"She likes cats, but I ___.","o":["don't","am not"],"a":0,"ko":"그녀는 고양이를 좋아하지만 나는 그렇지 않다.","why":"일반동사 likes(좋아한다)를 대신 받으니 do(하다).","wy":"am not(~이 아니다): be동사라 일반동사 likes(좋아한다)를 대신 받을 수 없음."}]}],"comp":[{"slots":[["disturb","","","주어 Such events(그러한 사건들)가 복수라 disturb(방해하다)."],["based","","","time(시간)이 \"기반을 둔\" 쪽이라 과거분사."],["naturally","natural","a","뒤의 occurring(발생하는)은 \"일어나는\"이라는 동사 성질의 분사다. 이것을 꾸미는 말은 부사 naturally(자연적으로)."],["occurring","","","rotation(자전)이 스스로 일어나는 쪽이라 -ing."],["happen","","","주어 events(사건들)가 복수라 happen(일어나다)."]],"opts":["nature","naturalness","naturally","naturalize"],"or":["nature(자연): 명사라 분사 occurring(발생하는)을 꾸밀 수 없음.","naturalness(자연스러움): 명사라 분사를 꾸밀 수 없고 뜻도 안 맞음.","naturally(자연적으로): 분사 occurring(발생하는)을 꾸미는 부사라 맞음.","naturalize(귀화시키다): 동사라 소유격 the Earth's(지구의) 뒤 꾸밈 자리에 못 옴."],"point":"형용사 자리 vs. 부사 자리","en":"Such events disturb the similarity between man-made time and more flexible time based on the Earth's naturally occurring rotation.","ko":"그러한 사건들은 인간이 만든 시간과 지구의 자연적으로 발생하는 자전에 기반한 더 유연한 시간 사이의 유사성을 방해한다.","hl":["naturally occurring rotation"],"khl":["자연적으로 발생하는 자전"],"blocks":[{"t":"p","h":"누구를 꾸미나 화살표 긋기","x":["naturally(자연적으로) → occurring(발생하는) → rotation(자전).","naturally(자연적으로)가 꾸미는 것은 바로 뒤 occurring(발생하는)이다.","occurring(발생하는)은 동사 occur(일어나다)에서 온 말이다.","동사 성질의 말을 꾸미는 것은 부사(-ly)의 일이다.","occurring rotation(발생하는 자전)은 \"자연적으로 일어나는 자전\"이라는 뜻이다."]},{"t":"pair","h":"쉬운 예시","x":[["They live in a newly built house.","그들은 새로 지어진 집에 산다. (built(지어진) ← 부사 newly(새로))"],["She has a beautifully painted room.","그녀는 아름답게 칠해진 방을 가지고 있다. (painted(칠해진) ← 부사 beautifully(아름답게))"]]}],"post":["부사 + 분사 + 명사: naturally occurring rotation(자연적으로 발생하는 자전)"],"no":"40"},{"slots":[["based","","","time(시간)이 \"기반을 둔\" 쪽이라 과거분사."],["occurring","","","rotation(자전)이 스스로 일어나는 쪽이라 -ing."],["happen","","","주어 events(사건들)가 복수라 happen(일어나다)."],["that","what","a","앞에 the false hope(헛된 희망)라는 명사가 있고 뒤 it will yield(그것이 굴복할 것이다)는 완전한 문장이다. 명사의 내용을 풀어 주는 말은 that(~라는)."],["doesnt","","","일반동사 yield(굴복하다)를 대신 받는 does(하다)의 부정."]],"opts":["which","whose","whom","that"],"or":["which(~하는): 관계대명사라 뒤에 빠진 자리가 있어야 하는데 it will yield(그것이 굴복할 것이다)는 완전함.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 대명사 it(그것)이 옴.","whom(~을): 목적격이라 뒤에 목적어가 빠져야 하는데 yield(굴복하다)는 목적어 없이 완전함.","that(~라는): 명사 the false hope(헛된 희망)의 내용을 완전한 문장으로 풀어 주는 동격 접속사라 맞음."],"point":"that vs. what","en":"We try to force our fixed, man-made view of time on nature in the false hope that it will yield.","ko":"우리는 자연이 굴복할 것이라는 헛된 희망을 지니고 우리의 고정된, 인간이 만든 시간에 대한 관점을 자연에 강요하려고 노력한다.","hl":["the false hope that it will yield"],"khl":["자연이 굴복할 것이라는 헛된 희망"],"blocks":[{"t":"p","h":"명사 뒤 that(~라는)은 설명서","x":["the false hope(헛된 희망)는 어떤 희망인지 설명이 필요하다.","that it will yield(그것이 굴복할 거라는)가 그 설명서다.","what(~하는 것)은 이미 \"것\"이라는 명사를 품어서 앞에 명사가 또 올 수 없다.","앞에 명사, 뒤에 완전한 문장이면 that(~라는)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a feeling that he will come.","나는 그가 올 거라는 느낌이 든다. (명사 a feeling(느낌) + that)"],["I believe what he said.","나는 그가 말한 것을 믿는다. (앞 명사 없이 what)"]]}],"post":["the false hope(헛된 희망) + that(~라는) + 완전한 문장"],"no":"40"}],"compquiz":[{"s":"He speaks English ___.","o":["naturally","natural"],"a":0,"ko":"그는 영어를 자연스럽게 말한다.","why":"동사 speaks(말한다)를 꾸미니 부사.","wy":"natural(자연스러운): 형용사라 동사 speaks(말한다)를 꾸밀 수 없음."},{"s":"I have a hope ___ we will win.","o":["that","what"],"a":0,"ko":"나는 우리가 이길 거라는 희망을 가지고 있다.","why":"명사 a hope(희망) 뒤, 완전한 문장이라 that(~라는).","wy":"what(~하는 것): 앞에 명사 a hope(희망)가 있고 뒤 문장도 완전해서 못 옴."}]}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+'번<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+'번 · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+'번 지문</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
