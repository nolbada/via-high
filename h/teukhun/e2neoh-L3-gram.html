<!DOCTYPE html>
<html lang="ko" translate="no">
<head>

<title>어법특훈 · 영어II 능률(오) 3과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

"there(~이 있다) 뒤의 진짜 주어 many situations(많은 상황들)가 복수라 are(있다)가 맞다."],["where","which","a","뒤 문장 we must make decisions as a group(우리가 집단으로서 결정을 내려야 한다)는 빠진 것 없이 완전하다. which(~하는)는 빈자리가 있어야 한다."],["is_simple","","","주어 Group decision-making(집단 의사 결정)은 하나의 일이라 단수 is(~이다)가 맞다."],["involves","","","it(그것 = 집단 의사 결정)이 목소리들을 직접 수반하는 쪽이라 능동 involves(수반한다)가 맞다."],["differing","","","의견이 스스로 서로 다른 쪽이라 현재분사 differing(서로 다른)이 맞다."]],"opts":["what","where","whose","whom"],"or":["what(~하는 것): 앞에 명사 situations(상황들)가 있으면 쓸 수 없음.","where(~하는, 관계부사): 뒤 문장이 완전하고 situations(상황들)가 \"그런 상황에서\"라는 장소 같은 말이라 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 we(우리)가 와서 안 됨.","whom(~을): 목적어가 빠진 자리를 받는 말인데 뒤 문장에 빠진 목적어가 없음."],"point":"관계대명사 vs. 관계부사","en":"However, there are many situations where we must make decisions as a group.","ko":"하지만 우리가 집단으로서 결정을 내려야 하는 상황이 많이 있다.","hl":["situations where we must make decisions"],"khl":["결정을 내려야 하는 상황"],"blocks":[{"t":"p","h":"빈자리 검사","x":["관계대명사 which(~하는)는 뒤 문장에 빈자리(주어나 목적어)가 있어야 들어온다.","we must make decisions(우리가 결정을 내려야 한다): 주어 we(우리), 동사 make(내리다), 목적어 decisions(결정들)가 다 있다.","빈자리가 없으니 관계부사 where(~하는)가 맞다.","situations where(~하는 상황) = 그런 상황 속에서. 상황을 일종의 장소처럼 본다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the park where I play soccer.","여기가 내가 축구를 하는 공원이다. (뒤 문장 완전 → where(~하는))"],["This is the park which I like.","여기가 내가 좋아하는 공원이다. (like(좋아하다)의 목적어가 빠짐 → which)"]]}],"post":["뒤가 완전하면 where: situations where we must make decisions(결정을 내려야 하는 상황)"]},{"slots":[["is_simple","","","주어 Group decision-making(집단 의사 결정)은 하나의 일이라 단수 is(~이다)가 맞다."],["involves","is involved","a","it(집단 의사 결정)이 numerous voices(수많은 목소리)를 직접 수반한다. 뒤에 목적어가 있으니 수동 is involved(연루되다)는 틀린다."],["differing","","","의견이 스스로 서로 다른 쪽이라 현재분사 differing(서로 다른)이 맞다."],["used","","","투표는 사람들이 쓰는 대상이라 수동 is used(사용된다)가 맞다."],["efficient","","","make(만들다) + 목적어 + 형용사. fairer(더 공정한)와 나란한 형용사 efficient(효율적인)가 맞다."]],"opts":["involve","involving","involves","to involve"],"or":["involve(수반하다): 주어 it(그것)이 단수라 -s가 빠지면 안 됨.","involving(수반하는): -ing는 혼자 동사 자리에 못 와서 as(~때문에) 뒤 문장에 동사가 없어짐.","involves(수반한다): 주어 it(그것)이 단수이고, 뒤에 목적어 voices(목소리들)를 받는 능동이라 맞음.","to involve(수반하는 것): to부정사는 동사 자리에 못 옴."],"point":"능동태 vs. 수동태","en":"Group decision-making is not as simple as our personal choices, as it involves numerous voices with differing opinions.","ko":"집단 의사 결정은 서로 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택만큼 간단하지 않다.","hl":["it involves numerous voices"],"khl":["수많은 목소리를 수반하기"],"blocks":[{"t":"p","h":"목적어가 있으면 능동","x":["수동태(be + p.p.)는 \"당하는\" 모양이라 보통 뒤에 목적어가 없다.","이 문장은 involves(수반한다) 바로 뒤에 numerous voices(수많은 목소리)라는 목적어가 있다.","집단 의사 결정이 여러 목소리를 \"품고 가는\" 쪽이니 능동이다.","그래서 개인의 선택보다 복잡하다. 목소리마다 의견이 다르기 때문이다."]},{"t":"pair","h":"쉬운 예시","x":[["The job involves a lot of travel.","그 일은 출장을 많이 수반한다. (뒤에 목적어 travel(출장) → 능동)"],["He was involved in the accident.","그는 그 사고에 연루되었다. (뒤에 목적어 없음 → 수동)"]]}],"post":["뒤에 목적어 있으면 능동: it involves numerous voices(그것은 수많은 목소리를 수반한다)"]},{"slots":[["work_q","","","how(어떻게) 뒤에 끼워 넣은 질문은 주어 + 동사 순서라 맞다."],["needed","needing","a","문장의 주어 The members(구성원들) 뒤에 진짜 동사가 하나 있어야 한다. needing(필요로 하는)은 동사 자리에 못 온다."],["to_raise","","","의문사 how(어떻게) + to부정사: how to raise money(돈을 모을 방법)."],["were","","","there(~이 있다) 뒤 주어 conflicting opinions(상충되는 의견들)가 복수라 were(있었다)가 맞다."],["not_to_use","","","encourage(권하다) + 사람 + to부정사. 부정은 to 앞에 not: not to use(쓰지 말라고)."]],"opts":["needed","to need","having needed","being needed"],"or":["needed(~해야 했다): 주어 The members(구성원들)의 진짜 동사이고 이야기가 과거라 맞음.","to need(필요로 하는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","having needed(필요로 하고 나서): 완료 -ing형이라 동사 자리에 못 옴.","being needed(필요로 되는 것): -ing형이라 동사 자리에 못 오고, 구성원들이 직접 결정해야 하는 능동이라 수동도 틀림."],"point":"정동사 vs. 준동사","en":"The members of the Greenville High School student council needed to decide how to raise money for children in need.","ko":"Greenville 고등학교 학생 자치회 구성원들은 어려움에 처한 아이들을 위해 돈을 모을 방법을 결정해야 했다.","hl":["The members","needed to decide"],"khl":["구성원들은","결정해야 했다"],"blocks":[{"t":"p","h":"주어가 길어도 동사는 꼭 하나","x":["주어: The members of the Greenville High School student council(Greenville 고등학교 학생 자치회 구성원들).","주어가 길어서 동사를 깜빡하기 쉽다. 시험 출제자가 노리는 곳이다.","of(~의) 뒤 꼬리를 떼면 The members(구성원들) + needed(~해야 했다).","needing(필요로 하는)은 동사 옷을 벗은 말이라 문장의 중심이 될 수 없다.","이야기 시작: 자치회는 어려운 아이들을 도울 모금 방법을 정해야 했다."]},{"t":"pair","h":"쉬운 예시","x":[["The students in my class needed a break.","우리 반 학생들은 휴식이 필요했다. (주어 The students(학생들) → needed(필요했다))"],["The boy sitting there is my brother.","저기 앉아 있는 소년은 내 남동생이다. (sitting(앉아 있는)은 꾸밈말, is(~이다)가 진짜 동사)"]]}],"post":["긴 주어(The members(구성원들) + 꼬리) 뒤에도 진짜 동사 하나: needed(~해야 했다)"]},{"slots":[["were","","","there(~이 있다) 뒤 주어 conflicting opinions(상충되는 의견들)가 복수라 were(있었다)가 맞다."],["not_to_use","not using","a","encourage(권하다) + 사람 + to부정사. 부정은 to 앞에 not(~않다)을 붙인 not to use(쓰지 말라고). -ing는 이 자리에 못 온다."],["to_try","","","not A but B(A가 아니라 B). 앞의 not to use(쓰지 말고)에 맞춘 to try(시도해 보라고)가 맞다."],["something","","","-thing(~것)으로 끝나는 말은 형용사가 뒤에서 꾸민다: something different(다른 것)."],["doing","","","전치사 After(~한 후에) 뒤라 동명사 doing(하는 것)이 맞다."]],"opts":["not use","not to use","not used","to not using"],"or":["not use(쓰지 말다): encourage(권하다) 뒤 목적격보어 자리에 to 없는 동사원형은 못 옴.","not to use(쓰지 말라고): encourage(권하다) + 사람 + to부정사이고, not(~않다)을 to 앞에 붙여 맞음.","not used(사용되지 않은): 학생들이 직접 쓰는 능동이고, encourage(권하다) 뒤는 to부정사여야 함.","to not using(쓰지 않는 것으로): to 뒤에 -ing가 오는 모양은 이 자리에 없음."],"point":"목적격보어(준동사)","en":"She encouraged them not to use the familiar voting method, but to try something different instead.","ko":"그녀는 그들에게 익숙한 투표 방법을 쓰지 말고 대신 다른 것을 시도해 보라고 권했다.","hl":["encouraged them not to use"],"khl":["쓰지 말고"],"blocks":[{"t":"p","h":"권하는 동사 뒤는 to","x":["encourage(권하다), want(원하다), ask(부탁하다), tell(말하다) + 사람 + to부정사.","Akers(에이커스) 선생님이 학생들에게 \"익숙한 방법은 쓰지 마\" 하고 권한 장면이다.","부정할 때 not(~않다)의 자리는 to 바로 앞: not to use(쓰지 말라고).","not using(쓰지 않는 것)은 encourage(권하다)의 짝이 아니다."]},{"t":"pair","h":"쉬운 예시","x":[["Mom told me not to run.","엄마는 나에게 뛰지 말라고 했다. (not to run(뛰지 말라고))"],["He encouraged me to try aga ion-making is not as simple as our personal choices, as it involves numerous voices with differing opinions.","ko":"집단 의사 결정은 서로 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택만큼 간단하지 않다.","hl":["voices with differing opinions"],"khl":["서로 다른 의견을 가진 수많은 목소리"],"blocks":[{"t":"p","h":"당할 수 없는 동사","x":["p.p.(과거분사)는 \"~된, ~당한\"이라는 뜻이다.","그런데 differ(다르다)는 누구를 \"다르게 하는\" 동사가 아니다. 그냥 스스로 다르다.","당할 수 없는 동사는 p.p.로 명사를 꾸미지 못한다.","의견들이 서로 다르다 → differing opinions(서로 다른 의견들).","이 다른 의견들 때문에 집단 결정은 개인 선택보다 어렵다."]},{"t":"pair","h":"쉬운 예시","x":[["We have differing ideas.","우리는 서로 다른 생각을 가지고 있다. (생각이 스스로 다름 → -ing)"],["I saw a falling leaf.","나는 떨어지는 나뭇잎을 보았다. (fall(떨어지다)도 당할 수 없어 -ing)"]]}],"post":["differ(다르다)는 p.p. 불가: differing opinions(서로 다른 의견들)"]},{"slots":[["involves","","","it(그것 = 집단 의사 결정)이 목소리들을 직접 수반하는 쪽이라 능동 involves(수반한다)가 맞다."],["differing","","","의견이 스스로 서로 다른 쪽이라 현재분사 differing(서로 다른)이 맞다."],["used","","","투표는 사람들이 쓰는 대상이라 수동 is used(사용된다)가 맞다."],["efficient","efficiently","a","make(만들다) + 목적어 + 형용사. group decisions(집단 의사 결정)가 어떤 상태가 되는지 말하는 자리라 부사 efficiently(효율적으로)는 틀린다."],["work_q","","","how(어떻게) 뒤에 끼워 넣은 질문은 주어 + 동사 순서라 맞다."]],"opts":["efficiency","efficient","efficiencies","inefficiently"],"or":["efficiency(효율성): 명사라 형용사 fairer(더 공정한)와 and(그리고)로 나란히 설 수 없음.","efficient(효율적인): make(만들다) + 목적어 + 형용사이고, 앞의 fairer(더 공정한)와 같은 형용사라 맞음.","efficiencies(효율성들): 복수 명사라 상태를 말하는 형용사 자리에 안 맞음.","inefficiently(비효율적으로): 부사라 자리가 틀리고, 뜻도 정반대가 됨."],"point":"형용사 자리 vs. 부사 자리","en":"Voting is often used to make group decisions fairer and more efficient.","ko":"투표는 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 흔히 사용된다.","hl":["make group decisions fairer and more efficient"],"khl":["더 공정하고 더 효율적으로 만들기"],"blocks":[{"t":"p","h":"목적어의 상태를 말하는 자리","x":["make(만들다) + A + 형용사 = A를 ~한 상태로 만들다.","무엇이? group decisions(집단 의사 결정)가.","어떤 상태로? fairer(더 공정한) and more efficient(더 효율적인).","한국말로 \"효율적으로\"라고 해석돼도 영어 자리는 형용사다. 해석에 속지 말 것.","and(그리고) 앞이 형용사 fairer(더 공정한)이니 뒤도 형용사로 맞춘다."]},{"t":"pair","h":"쉬운 예시","x":[["The news made me happy.","그 소식은 나를 행복하게 만들었다. (me(나)의 상태 → 형용사 happy)"],["Keep your room clean.","네 방을 깨끗하게 유지해라. (room(방)의 상태 → 형용사 clean)"]]}],"post":["make(만들다) + 목적어 + 형용사: make group decisions fairer and more efficient(더 공정하고 효율적으로)"]},{"slots":[["were","","","there(~이 있다) 뒤 주어 conflicting opinions(상충되는 의견들)가 복수라 were(있었다)가 맞다."],["not_to_use","","","encourage(권하다) + 사람 + to부정사. 부정은 to 앞에 not: not to use(쓰지 말라고)."],["to_try","trying","a","not A but B(A가 아니라 B)는 양쪽 모양을 맞춘다. 앞이 not to use(쓰지 말고)라 뒤도 to try(시도해 보라고). trying(시도하는 것)은 짝이 안 맞는다."],["something","","","-thing(~것)으로 끝나는 말은 형용사가 뒤에서 꾸민다: something different(다른 것)."],["to_find","","","be curious to(~하고 싶어 하다) 뒤 동사원형: to find out(알아내다)."]],"opts":["to trying","having tried","to be tried","to try"],"or":["to trying(시도하는 것으로): to 뒤에 -ing가 붙는 모양은 encourage(권하다) 뒤에 없음.","having tried(시도하고 나서): 완료 -ing형이라 앞의 to부정사와 모양이 안 맞음.","to be tried(시도되다): 수동이라 뒤에 목적어 something different(다른 것)를 받을 수 없음.","to try(시도해 보라고): not to use(쓰지 말고)와 not A but B(A가 아니라 B)로 나란한 to부정사라 맞음."],"point":"병렬구조","en":"She encouraged them not to use the familiar voting method, but to try something different instead.","ko":"그녀는 그들에게 익숙한 투표 방법을 쓰지 말고 대신 다른 것을 시도해 보라고 권했다.","hl":["not to use","but to try"],"khl":["쓰지 말고","시도해 보라고"],"blocks":[{"t":"p","h":"not A but B는 쌍둥이","x":["not A but B(A가 아니라 B)에서 A와 B는 같은 모양의 쌍둥이다.","A: not to use the familiar voting method(익숙한 투표 방법을 쓰지 말라고)","B: to try something different(다른 것을 시도해 보라고)","A가 to부정사니까 B도 to부정사.","선생님의 조언은 한마디로 \"늘 하던 방식 말고 새것!\". 그래서 세 가지 투표 방식 실험이 시작된다."]},{"t":"pair","h":"쉬운 예시","x":[["I want not to sleep but to study.","나는 자는 것이 아니라 공부하는 것을 원한다. (to sleep(자는 것) / to study(공부하는 것))"],["He likes not swimming but running.","그는 수영하는 것이 아니라 달리는 것을 좋아한다. (swimming(수영하는 것) / running(달리는 것))"]]}],"post":["not to use(쓰지 말고) ~, but to try(시도해 보라고): 쌍둥이 모양"]},{"slots":[["needed","","","주어 The members(구성원들)의 진짜 동사 needed(~해야 했다)가 맞다."],["not_to_use","","","encourage(권하다) + 사람 + to부정사. 부정은 to 앞에 not: not to use(쓰지 말라고)."],["to_try","","","not A but B(A가 아니라 B). 앞의 not to use(쓰지 말고)에 맞춘 to try(시도해 보라고)가 맞다."],["something","different something","a","-thing(~것)으로 끝나는 말(something = 어떤 것)은 형용사가 뒤에서 꾸민다. different something(다른 어떤 것)처럼 앞에 두면 틀린다."],["doing","","","전치사 After(~한 후에) 뒤라 동명사 doing(하는 것)이 맞다."]],"opts":["something difference","something differs","different anything","something different"],"or":["something difference(어떤 것 차이): difference(차이)는 명사라 something(어떤 것)을 꾸밀 수 없음.","something differs(어떤 것이 다르다): try(시도하다)의 목적어 자리에 동사 differs(다르다)가 끼면 문장이 깨짐.","different anything(다른 아무것): 형용사가 -thing 앞에 와서 순서가 틀림.","something different(다른 것): -thing(~것) 뒤에 형용사 different(다른)가 와서 맞음."],"point":"-thing + 형용사 어순","en":"She encouraged them not to use the familiar voting method, but to try something different instead.","ko":"그녀는 그들에게 익숙한 투표 방법을 쓰지 말고 대신 다른 것을 시도해 보라고 권했다.","hl":["try something different"],"khl":["다른 것을 시도해"],"blocks":[{"t":"p","h":"-thing은 꾸밈말을 뒤에 단다","x":["something(어떤 것), anything(아무것), nothing(아무것도 ~않다), everything(모든 것).","이 말들은 형용사를 뒤에 붙인다.","something different(다른 것), something cold(차가운 것).","보통 명사는 a different method(다른 방법)처럼 형용사가 앞이라 헷갈리기 쉽다.","선생님이 권한 것은 익숙한 방법이 아닌 \"다른 무언가\"였다."]},{"t":"pair","h":"쉬운 예시","x":[["I want something cold.","나는 차가운 것을 원한다. (something(어떤 것) + 형용사)"],["There is nothing special.","특별한 것은 아무것도 없다. (nothing(아무것도 ~않다) + 형용사)"]]}],"post":["something(어떤 것) + 형용사: something different(다른 것)"]},{"slots":[["to_raise","","","의문사 how(어떻게) + to부정사: how to raise money(돈을 모을 방법)."],["something","","","-thing(~것)으로 끝나는 말은 형용사가 뒤에서 꾸민다: something different(다른 것)."],["doing","","","전치사 After(~한 후에) 뒤라 동명사 doing(하는 것)이 맞다."],["to_find","","","be curious to(~하고 싶어 하다) 뒤 동사원형: to find out(알아내다)."],["if","what","a","what(~하는 것)은 뒤에 빈자리가 있어야 한다. the different methods would yield different results(서로 다른 방법이 서로 다른 결과를 낼 것이다)는 완전한 문장이다."]],"opts":["if","which","whose","whom"],"or":["if(~인지): find out(알아내다)의 목적어가 되는 명사절을 이끌고, 뒤 문장이 완전해서 맞음.","which(어느 것이): 뒤에 빈자리가 있어야 하는데 뒤 문장은 주어·동사·목적어가 다 있음.","whose(누구의): 바로 뒤에 꾸밀 명사가 와야 하는데 the different methods(서로 다른 방법들)는 이미 the(그)가 붙어 있음.","whom(누구를): 목적어가 빠진 자리를 받는 말인데 yield(내다)의 목적어 results(결과들)가 이미 있음."],"point":"명사절 접속사 if vs. what","en":"The entire council was curious to find out if the different methods would yield different results.","ko":"자치회 전체는 서로 다른 방법이 서로 다른 결과를 낼지 알아내고 싶어 했다.","hl":["to find out if the different methods would yield different results"],"khl":["서로 다른 결과를 낼지 알아내고"],"blocks":[{"t":"p","h":"if는 \"~인지\" 상자","x":["find out(알아내다) 뒤에는 \"무엇을\" 알아낼지가 온다.","if(~인지)는 완전한 문장을 상자에 담아 명사처럼 만든다.","what(~하는 것)은 문장 안에 구멍이 하나 있어야 쓴다.","뒤 문장: 주어 the different methods(서로 다른 방법들), 동사 would yield(낼 것이다), 목적어 different results(서로 다른 결과들). 구멍이 없다.","자치회의 궁금증: 방법만 바꿔도 결과가 달라질까?"]},{"t":"pair","h":"쉬운 예시","x":[["I wonder if he likes me.","나는 그가 나를 좋아하는지 궁금하다. (완전한 문장 → if(~인지))"],["I know what he likes.","나는 그가 좋아하는 것을 안다. (likes(좋아하다)의 목적어가 빠짐 → what)"]]},{"t":"tap","h":"확인 질문","q":"what(~하는 것)을 넣으려면 뒤 문장에서 무엇이 빠져 있어야 할까?","a":["주어나 목적어 하나가 빠져 있어야 한다.","이 문장은 다 있으니 if(~인지)."]}],"post":["완전한 문장 앞 if(~인지): find out if ~ (~인지 알아내다)"]}],"quiz":[{"s":"They have ___ opinions about the movie.","o":["differing","differed"],"a":0,"ko":"그들은 그 영화에 대해 서로 다른 의견을 가지고 있다.","why":"differ(다르다)는 당할 수 없어서 -ing로 꾸민다.","wy":"differed(달랐다): differ(다르다)는 목적어를 받지 않아 p.p.로 명사를 꾸밀 수 없음."},{"s":"The song made me ___.","o":["sad","sadly"],"a":0,"ko":"그 노래는 나를 슬프게 만들었다.","why":"make(만들다) + 사람 + 형용사.","wy":"sadly(슬프게): 부사라 me(나)의 상태를 말하는 자리에 못 옴."},{"s":"She asked me not to cry but ___.","o":["smiling","to smile"],"a":1,"ko":"그녀는 나에게 울지 말고 웃으라고 했다.","why":"not to cry(울지 말고)와 짝을 맞춰 to smile(웃으라고).","wy":"smiling(웃는 것): 앞의 to cry(우는 것)와 모양이 안 맞음."},{"s":"Let’s eat something ___.","o":["sweet","sweetly"],"a":0,"ko":"달콤한 것을 먹자.","why":"something(어떤 것) 뒤에서 꾸미는 형용사 sweet(달콤한).","wy":"sweetly(달콤하게): 부사라 something(어떤 것)을 꾸밀 수 없음."},{"s":"Please check ___ the store is open.","o":["if","what"],"a":0,"ko":"그 가게가 문을 열었는지 확인해 줘.","why":"뒤 문장이 완전하니 if(~인지).","wy":"what(~하는 것): 뒤 문장 the store is open(가게가 열려 있다)에 빈자리가 없음."}]}],"comp":[{"no":"본문 ❶❷","slots":[["is_simple","","","주어 Group decision-making(집단 의사 결정)은 하나의 일이라 단수 is(~이다)가 맞다."],["used","","","투표는 사람들이 쓰는 대상이라 수동 is used(사용된다)가 맞다."],["efficient","","","make(만들다) + 목적어 + 형용사. fairer(더 공정한)와 나란한 형용사 efficient(효율적인)가 맞다."],["work_q","do these different voting methods work","a","how(어떻게)가 문장 안에 끼어들면 질문 어순(do + 주어 + 동사)을 쓰지 않는다. 주어 + 동사 순서로."],["needed","","","주어 The members(구성원들)의 진짜 동사 needed(~해야 했다)가 맞다."]],"opts":["these different voting methods work","these different voting methods working","these different voting methods to work","does these different voting methods work"],"or":["these different voting methods work(이러한 다양한 투표 방법이 적용되는지): how(어떻게) 뒤 주어 + 동사 순서라 맞음.","these different voting methods working(이러한 방법들이 적용되는): -ing만 있어 how(어떻게) 뒤 문장에 동사가 없음.","these different voting methods to work(이러한 방법들이 적용될): to부정사도 동사가 아니라 문장이 안 됨.","does these different voting methods work(이러한 방법들이 적용되나): 질문 어순이고, 주어가 복수인데 does(하다, 단수형)까지 틀림."],"point":"간접의문문 어순","en":"The following story illustrates how these different voting methods work.","ko":"다음 이야기는 이러한 다양한 투표 방법이 어떻게 적용되는지 보여 준다.","hl":["how these different voting methods work"],"khl":["어떻게 적용되는지"],"blocks":[{"t":"p","h":"문장 속 질문은 평서문 순서","x":["혼자 묻는 질문: How do these methods work?(이 방법들은 어떻게 적용되나?)","문장 속에 넣으면: illustrates how these methods work(이 방법들이 어떻게 적용되는지 보여 준다).","do(하다)는 빠지고 주어 + 동사 순서가 된다.","이 문장이 이야기의 문을 연다. 이제부터 세 가지 투표 방법이 차례로 나온다."]},{"t":"pair","h":"쉬운 예시","x":[["Tell me where you live.","네가 어디 사는지 말해 줘. (where(어디) + 주어 + 동사)"],["I don’t know how he did it.","나는 그가 그것을 어떻게 했는지 모른다. (how(어떻게) + he did(그가 했다))"]]}],"post":["문장 속 how(어떻게): how + 주어 + 동사 (do 없음)"]},{"no":"본문 ❶❷","slots":[["not_to_use","","","encourage(권하다) + 사람 + to부정사. 부정은 to 앞에 not: not to use(쓰지 말라고)."],["to_try","","","not A but B(A가 아니라 B). 앞의 not to use(쓰지 말고)에 맞춘 to try(시도해 보라고)가 맞다."],["something","","","-thing(~것)으로 끝나는 말은 형용사가 뒤에서 꾸민다: something different(다른 것)."],["doing","done","a","After(~한 후에)는 여기서 전치사. 전치사 뒤 동사는 -ing. 뒤에 목적어 some research(약간의 조사)가 있으니 done(된)은 틀린다."],["if","","","find out(알아내다)의 목적어 자리, 뒤 문장이 완전하니 if(~인지)가 맞다."]],"opts":["do","did","doing","to do"],"or":["do(하다): 전치사 뒤에 동사원형은 못 옴.","did(했다): 전치사 뒤에 과거형 동사는 못 옴.","doing(하는 것): 전치사 After(~한 후에) 뒤라 동명사이고, 목적어 some research(약간의 조사)를 받는 능동이라 맞음.","to do(하는 것): 전치사 After(~한 후에) 뒤에 to부정사는 못 옴."],"point":"전치사 + 동명사","en":"After doing some research, the council members decided to try three different voting systems.","ko":"약간의 조사를 한 후, 자치회 구성원들은 세 가지 다른 투표 시스템을 시도해 보기로 결정했다.","hl":["After doing some research"],"khl":["약간의 조사를 한 후"],"blocks":[{"t":"p","h":"전치사 뒤는 -ing 옷","x":["After(~한 후에), before(~하기 전에), without(~없이), by(~함으로써) 뒤에 동사가 오면 -ing로 바꾼다.","done(된)은 \"조사가 되어진\"처럼 당하는 뜻이라, 뒤의 목적어 some research(약간의 조사)를 받을 수 없다.","학생들이 직접 조사를 \"한\" 것이니 doing(하는 것).","조사 끝에 고른 세 가지: FPTP(단순 다수결), AV(대안 투표), Condorcet(콩도르세)."]},{"t":"pair","h":"쉬운 예시","x":[["After eating lunch, we played soccer.","점심을 먹은 후, 우리는 축구를 했다. (After(~한 후에) + -ing)"],["She left without saying goodbye.","그녀는 작별 인사도 없이 떠났다. (without(~없이) + -ing)"]]}],"post":["전치사 After(~한 후에) + 동명사: After doing some research(약간의 조사를 한 후)"]}],"compquiz":[{"s":"Can you tell me where ___?","o":["does she live","she lives"],"a":1,"ko":"그녀가 어디 사는지 말해 줄 수 있니?","why":"문장 속 질문은 주어 + 동사 순서.","wy":"does she live(그녀는 사니): 질문 어순이라 문장 안에 끼워 넣을 수 없음."},{"s":"Wash your hands before ___.","o":["eating","eat"],"a":0,"ko":"먹기 전에 손을 씻어라.","why":"전치사 before(~하기 전에) 뒤는 -ing.","wy":"eat(먹다): 전치사 뒤에 동사원형은 못 옴."}]},{"id":"e2g3-3c","no":"본문 ❸❹","title":"어법특훈 · 영어II 3과 본문 ❸+❹","sub":"투표 당일 + 방식 1: 단순 다수결(FPTP)","tpl":"On the day of the vote, each possible event {was_given|was given} a letter: “art show” {was_rep|was represented} by the letter A, the letter B indicated “bake sale,” and C stood for “charity concert.” Each of the 20 council members {was_each|was} given a voting slip and instructed {to_write|to write} down the options in order of preference. For example, if the charity concert was their first choice, {followed|followed} by the bake sale and the art show, they would write CBA. After {every_member|every member} had voted, the voting slips {were_counted|were counted}. The results were as follows: The FPTP method is {the_simplest|the simplest} of the three methods. Voters are given several options, and {whichever|whichever} gets the most first-preference votes {wins|wins}. Neither the second {nor|nor} third preference matters at all, so they are ignored. This method is commonly {used|used} in political elections around the world. The student council quickly determined {that|that} the winner would be option C, the charity concert. This was {because|because} it received 8 first-preference votes, {while|while} option A received 5 and option B received 7. The FPTP method is uncomplicated and easy {to_understand|to understand}, but it has a significant weakness. It is possible {to_win|to win} a vote without the support of the majority. That was the case here. According to the results of the FPTP method, the council’s choice was {to_hold|to hold} a charity concert. However, only 8 out of 20 council members chose the charity concert as their first preference, {which|which} equaled 40% of the total votes.","fn":[],"mean":{"was given":"주어졌다, 받았다(give의 수동태 과거형)","was represented":"표시되었다(represent의 수동태 과거형)","was representing":"나타내고 있었다(represent의 과거진행형)","was":"~였다(be의 과거형, 단수 주어)","to write":"적으라고(write의 to부정사)","followed":"뒤따라지는(follow의 과거분사형)","represent":"나타내다(동사원형)","to represent":"나타내는 것(represent의 to부정사)","representing":"나타내는(represent의 -ing형)","were":"~였다(be의 과거형, 복수 주어)","every member":"모든 구성원(every(모든) + 단수 명사)","be":"~이다(동사원형)","being":"~인 것(be의 -ing형)","to be":"~인 것(be의 to부정사)","writing":"적는 것(write의 -ing형)","write":"적다(동사원형)","written":"쓰인(write의 과거분사형)","wrote":"적었다(write의 과거형)","the simplest":"가장 간단한(simple의 최상급)","whichever":"~하는 어느 것이든(복합관계대명사)","wins":"이긴다(win의 3인칭 단수 현재형)","nor":"~도 아니다(neither의 짝)","or":"또는(either의 짝)","used":"사용된(use의 과거분사형)","and":"그리고(both의 짝)","but":"그러나(not A but B의 짝)","so":"그래서(접속사)","that":"~라는 것(명사절 접속사) / ~하는(관계대명사)","because":"~ 때문에(접속사)","because of":"~ 때문에(전치사)","while":"~인 반면(접속사)","to understand":"이해하기(understand의 to부정사)","due to":"~ 때문에(전치사)","despite":"~에도 불구하고(전치사)","in spite of":"~에도 불구하고(전치사)","following":"뒤따르는(follow의 -ing형)","were counted":"집계되었다(count의 수동태 과거형, 복수 주어)","follow":"뒤따르다(동사원형)","follows":"뒤따르다(follow의 3인칭 단수 현재형)","to follow":"뒤따르는 것(follow의 to부정사)","every members":"모든 구성원들(every + 복수 명사, 틀린 모양)","all member":"모든 구성원(all + 단수 명사, 틀린 모양)","each members":"각각의 구성원들(each + 복수 명사, 틀린 모양)","many member":"많은 구성원(many + 단수 명사, 틀린 모양)","the most simplest":"가장 가장 간단한(최상급 표시가 겹친 틀린 모양)","the simply":"그 간단하게(부사 simply 앞에 the, 틀린 모양)","simpler":"더 간단한(simple의 비교급)","what":"~하는 것(선행사를 품은 관계대명사)","to win":"이기는 것(win의 to부정사)","which":"그리고 그것은(계속적 용법 관계대명사) / 어느 것","whose":"~의(소유격 관계대명사) / 누구의","whom":"~을(목적격 관계대명사) / 누구를","to hold":"여는 것(hold의 to부정사)","held":"열렸다, 열린(hold의 과거형·과거분사형)","hold":"열다(동사원형)","holds":"연다(hold의 3인칭 단수 현재형)","to be held":"열리는 것(hold의 수동 to부정사)","was counted":"집계되었다(count의 수동태 과거형, 단수 주어)","counting":"세는(count의 -ing형)","to count":"세는 것(count의 to부정사)","having counted":"센 후에(count의 완료 -ing형)","broke":"깨졌다, 깨뜨렸다(break의 과거형)","was broken":"깨졌다(break의 수동태 과거형)","has":"가지고 있다(have의 3인칭 단수 현재형)","have":"가지고 있다(동사원형·현재형)","to close":"닫는 것(close의 to부정사)","closing":"닫는 것(close의 -ing형)","child":"아이(단수 명사)","children":"아이들(child의 복수형)","hottest":"가장 더운(hot의 최상급)","most hottest":"가장 가장 더운(최상급 표시가 겹친 틀린 모양)","to read":"읽는 것(read의 to부정사)","read":"읽다(동사원형)","who":"그리고 그 사람은(계속적 용법 관계대명사)","the more simpler":"더 간단한(more와 -er을 겹친 틀린 비교급)"},"sets":[{"items":[{"slots":[["was_given","","","행사가 글자를 \"받는\" 쪽이라 수동 was given(주어졌다)이 맞다. give A B(A에게 B를 주다)의 수동이라 a letter(글자)가 뒤에 남는다."],["was_rep","was representing","a","‘미술 전시회’는 글자 A로 \"표시되는\" 쪽이다. 뒤에 목적어 없이 by the letter A(글자 A에 의해)가 오니 수동이어야 한다. was representing(나타내고 있었다)은 목적어가 필요하다."],["was_each","","","주어 Each(각각)는 단수 취급이라 was(~였다, 단수형)가 맞다."],["to_write","","","instruct(지시하다) + 사람 + to부정사의 수동: (was) instructed to write(적으라는 지시를 받았다)."],["followed","","","자선 콘서트가 다른 선택지들에게 \"뒤따라지는\" 쪽이라 followed by(~이 뒤따르는)가 맞다."]],"opts":["represent","to represent","was represented","representing"],"or":["represent(나타내다): 능동 원형이라 뒤에 목적어가 필요하고, 주어 “art show”(미술 전시회)가 단수라 수도 안 맞음.","to represent(나타내는 것): to부정사는 동사 자리에 못 옴.","was represented(표시되었다): 미술 전시회가 글자 A에 의해 표시되는 수동이고, by(~에 의해)가 단서라 맞음.","representing(나타내는): -ing만으로는 동사가 안 되고, 뒤에 목적어도 없음."],"point":"능동태 vs. 수동태","en":"On the day of the vote, each possible event was given a letter: “art show” was represented by the letter A.","ko":"투표 당일, 각각의 가능한 행사에 글자가 하나씩 주어졌다. ‘미술 전시회’는 글자 A로 표시되었다.","hl":["was represented by the letter A"],"khl":["글자 A로 표시되었다"],"blocks":[{"t":"p","h":"by가 보이면 \"당하는\" 쪽","x":["투표 당일, 세 행사에 글자 이름표를 붙였다. 미술 전시회 = A, 빵 바자회 = B, 자선 콘서트 = C.","미술 전시회가 스스로 뭘 표시하는 게 아니다. 글자 A로 \"표시되는\" 것이다.","그래서 be + p.p.: was represented(표시되었다).","뒤에 목적어가 없고 by the letter A(글자 A에 의해)가 붙은 것이 수동의 단서다."]},{"t":"pair","h":"쉬운 예시","x":[["The cake was made by my sister.","그 케이크는 내 여동생이 만들었다. (by가 붙은 수동)"],["My sister made the cake.","내 여동생이 그 케이크를 만들었다. (목적어 the cake(그 케이크)가 있는 능동)"]]}],"post":["목적어 없이 by(~에 의해) 뒤따르면 수동: was represented by the letter A(글자 A로 표시되었다)"]},{"slots":[["was_rep","","","‘미술 전시회’가 글자 A로 \"표시되는\" 쪽이라 수동 was represented(표시되었다)가 맞다."],["was_each","were","a","주어는 members(구성원들)가 아니라 Each(각각)다. Each(각각)는 한 명씩 보는 말이라 단수 취급, were(~였다, 복수형)는 틀린다."],["to_write","","","instruct(지시하다) + 사람 + to부정사의 수동: (was) instructed to write(적으라는 지시를 받았다)."],["followed","","","자선 콘서트가 다른 선택지들에게 \"뒤따라지는\" 쪽이라 followed by(~이 뒤따르는)가 맞다."],["every_member","","","every(모든) 뒤에는 단수 명사: every member(모든 구성원)."]],"opts":["was","be","being","to be"],"or":["was(~였다, 단수형): 주어 Each(각각)가 단수 취급이고 이야기가 과거라 맞음.","be(~이다): 동사원형은 주어 뒤 동사 자리에 그대로 못 옴.","being(~인 것): -ing는 혼자 동사 자리에 못 옴.","to be(~인 것): to부정사는 동사 자리에 못 옴."],"point":"each of + 복수명사의 수일치","en":"Each of the 20 council members was given a voting slip and instructed to write down the options in order of preference.","ko":"20명의 자치회 구성원 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다.","hl":["Each of the 20 council members was given"],"khl":["구성원 각각은","받았고"],"blocks":[{"t":"p","h":"주인은 맨 앞의 Each","x":["Each of the 20 council members(20명의 구성원 각각).","바로 앞 members(구성원들)가 복수라 were(~였다, 복수형)로 끌리기 쉽다.","하지만 주인은 Each(각각). \"한 명 한 명이\" 투표용지를 받은 것이다.","Each(각각), Every(모든), One of(~ 중 하나)는 단수 동사."]},{"t":"pair","h":"쉬운 예시","x":[["Each of the boys has a ball.","소년들 각각은 공을 하나씩 가지고 있다. (Each(각각) → has(가지다, 단수형))"],["One of my friends lives in Seoul.","내 친구들 중 한 명은 서울에 산다. (One(하나) → lives(산다, 단수형))"]]}],"post":["Each of(~ 각각) + 복수명사 → 단수 동사: Each of the 20 council members was(~였다)"]},{"slots":[["was_rep","","","‘미술 전시회’가 글자 A로 \"표시되는\" 쪽이라 수동 was represented(표시되었다)가 맞다."],["was_each","","","주어 Each(각각)는 단수 취급이라 was(~였다, 단수형)가 맞다."],["to_write","writing","a","instruct(지시하다) + 사람 + to부정사. 사람이 주어로 나간 수동에서도 to가 남는다: was instructed to write(적으라는 지시를 받았다). writing(적는 것)은 틀린다."],["followed","","","자선 콘서트가 다른 선택지들에게 \"뒤따라지는\" 쪽이라 followed by(~이 뒤따르는)가 맞다."],["every_member","","","every(모든) 뒤에는 단수 명사: every member(모든 구성원)."]],"opts":["write","written","wrote","to write"],"or":["write(적다): be instructed(지시받다) 뒤에 to 없는 원형은 못 옴.","written(쓰인): 구성원들이 직접 적는 능동인데 p.p.는 \"쓰인\"이라는 수동이라 틀림.","wrote(적었다): 과거형 동사라 instructed(지시받은) 뒤에 동사가 겹침.","to write(적으라고): instruct(지시하다) + 사람 + to부정사의 수동이라 to가 그대로 남아서 맞음."],"point":"5형식의 수동태(be p.p. + to부정사)","en":"Each of the 20 council members was given a voting slip and instructed to write down the options in order of preference.","ko":"20명의 자치회 구성원 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다.","hl":["instructed to write down the options"],"khl":["선택지를 적으라는 지시를 받았다"],"blocks":[{"t":"p","h":"수동이 돼도 to는 남는다","x":["능동: The teacher instructed them to write(선생님이 그들에게 적으라고 지시했다).","수동: They were instructed to write(그들은 적으라는 지시를 받았다).","사람이 주어로 앞에 나가도 뒤의 to부정사는 그대로 붙어 있다.","이 문장은 was given(받았다) ... and (was) instructed(지시받았다)로 앞의 수동과 and(그리고)로 이어진다.","투표 규칙: 1지망부터 3지망까지 순서대로 적기."]},{"t":"pair","h":"쉬운 예시","x":[["We were told to sit down.","우리는 앉으라는 말을 들었다. (be told(말을 듣다) + to)"],["He was asked to sing.","그는 노래해 달라는 부탁을 받았다. (be asked(부탁받다) + to)"]]}],"post":["be instructed to(~하라는 지시를 받다) + 동사원형: instructed to write down(적으라는 지시를 받았다)"]},{"slots":[["the_simplest","","","of the three methods(세 가지 방식 중) 앞이라 최상급 the simplest(가장 간단한)가 맞다."],["whichever","","","\"~하는 어느 것이든\"이라는 주어 덩어리를 만드는 whichever(어느 것이든)가 맞다."],["wins","","","whichever(어느 것이든) 덩어리 주어는 단수라 wins(이긴다)가 맞다."],["nor","or","a","Neither(~도 아닌)는 nor(~도 아니다)와 짝이다. or(또는)는 either(둘 중 하나)의 짝이라 틀린다."],["used","","","이 방식은 사람들이 \"쓰는\" 대상이라 수동 is used(사용된다)가 맞다."]],"opts":["and","but","so","nor"],"or":["and(그리고): both A and B(A와 B 둘 다)의 짝이라 Neither(~도 아닌)와 못 씀.","but(그러나): not A but B(A가 아니라 B)의 짝이라 Neither(~도 아닌)와 못 씀.","so(그래서): 결과를 잇는 접속사라 Neither(~도 아닌)의 짝이 될 수 없음.","nor(~도 아니다): Neither A nor B(A도 B도 아닌)의 짝이라 맞음."],"point":"상관접속사 neither A nor B","en":"Neither the second nor third preference matters at all, so they are ignored.","ko":"2지망도 3지망도 전혀 중요하지 않으므로, 그것들은 무시된다.","hl":["Neither the second nor third preference"],"khl":["2지망도 3지망도"],"blocks":[{"t":"p","h":"짝꿍 접속사는 정해져 있다","x":["both A and B(A와 B 둘 다)","either A or B(A나 B 둘 중 하나)","neither A nor B(A도 B도 아닌)","not A but B(A가 아니라 B)","FPTP(단순 다수결)는 1지망만 센다. 2지망도 3지망도 \"아무 상관 없다\"는 말이라 neither A nor B(A도 B도 아닌)."]},{"t":"pair","h":"쉬운 예시","x":[["Neither Tom nor Jane came.","톰도 제인도 오지 않았다. (neither(~도 아닌) ~ nor(~도 아니다))"],["You can have either tea or coffee.","너는 차나 커피 중 하나를 마실 수 있다. (either(둘 중 하나) ~ or(또는))"]]}],"post":["Neither A nor B(A도 B도 아닌): neither(~도 아닌)의 짝은 nor(~도 아니다)"]},{"slots":[["used","","","이 방식은 사람들이 \"쓰는\" 대상이라 수동 is used(사용된다)가 맞다."],["that","","","determined(알아냈다)의 목적어, 뒤 문장이 완전해서 that(~라는 것)이 맞다."],["because","because of","a","because of(~ 때문에)는 전치사라 뒤에 명사만 온다. 뒤에 it received(그것이 받았다)라는 주어 + 동사가 오니 접속사 because(~ 때문에)여야 한다."],["while","","","뒤에 주어 + 동사가 오는 접속사 while(~인 반면)이 맞다."],["to_understand","","","easy(쉬운) + to부정사: easy to understand(이해하기 쉬운)."]],"opts":["due to","because","despite","in spite of"],"or":["due to(~ 때문에): 전치사라 뒤에 주어 + 동사 문장이 못 옴.","because(~ 때문에): 뒤에 주어 it(그것) + 동사 received(받았다)가 오는 접속사라 맞음.","despite(~에도 불구하고): 전치사라 뒤에 문장이 못 오고 뜻도 반대임.","in spite of(~에도 불구하고): 전치사라 뒤에 문장이 못 오고 뜻도 반대임."],"point":"전치사 vs. 접속사","en":"This was because it received 8 first-preference votes, while option A received 5 and option B received 7.","ko":"이는 선택지 A가 5표, 선택지 B가 7표를 받은 반면, 그것이 1지망 표 8표를 받았기 때문이었다.","hl":["because it received 8 first-preference votes"],"khl":["1지망 표 8표를 받았기 때문이었다"],"blocks":[{"t":"p","h":"뒤에 동사가 있나 보기","x":["접속사 because(~ 때문에) + 주어 + 동사.","전치사 because of(~ 때문에) + 명사.","뒤를 보면 it received(그것이 받았다). 동사가 있다. 그래서 because(~ 때문에).","내용: 자선 콘서트(C) 8표, 빵 바자회(B) 7표, 미술 전시회(A) 5표. 1지망이 제일 많은 C가 이겼다."]},{"t":"pair","h":"쉬운 예시","x":[["I stayed home because it rained.","비가 와서 나는 집에 있었다. (because(~ 때문에) + 주어 + 동사)"],["I stayed home because of the rain.","비 때문에 나는 집에 있었다. (because of(~ 때문에) + 명사)"]]}],"post":["주어 + 동사 앞은 because(~ 때문에), 명사 앞은 because of(~ 때문에)"]}],"quiz":[{"s":"The window ___ by the boy.","o":["broke","was broken"],"a":1,"ko":"그 창문은 소년에 의해 깨졌다.","why":"창문이 깨진 쪽이고 by(~에 의해)가 있으니 수동.","wy":"broke(깨졌다, 깨뜨렸다): 능동이라 by the boy(소년에 의해)와 안 맞음."},{"s":"Each of the students ___ a laptop.","o":["have","has"],"a":1,"ko":"학생들 각각은 노트북을 가지고 있다.","why":"주어 Each(각각)는 단수라 has(가지고 있다).","wy":"have(가지고 있다, 복수형): 주어 Each(각각)가 단수라 안 맞음."},{"s":"She was asked ___ the door.","o":["to close","closing"],"a":0,"ko":"그녀는 문을 닫아 달라는 부탁을 받았다.","why":"be asked(부탁받다) + to부정사.","wy":"closing(닫는 것): be asked(부탁받다) 뒤에는 to부정사가 와야 함."},{"s":"Neither my dad ___ my mom likes spicy food.","o":["or","nor"],"a":1,"ko":"아빠도 엄마도 매운 음식을 좋아하지 않는다.","why":"Neither(~도 아닌)의 짝은 nor(~도 아니다).","wy":"or(또는): either(둘 중 하나)의 짝이라 Neither(~도 아닌)와 못 씀."},{"s":"We canceled the game ___ the storm.","o":["because","because of"],"a":1,"ko":"우리는 폭풍 때문에 경기를 취소했다.","why":"뒤에 명사 the storm(폭풍)만 오니 전치사 because of(~ 때문에).","wy":"because(~ 때문에): 접속사라 뒤에 주어 + 동사가 와야 함."}]},{"items":[{"slots":[["was_given","","","행사가 글자를 \"받는\" 쪽이라 수동 was given(주어졌다)이 맞다. give A B(A에게 B를 주다)의 수동이라 a letter(글자)가 뒤에 남는다."],["to_write","","","instruct(지시하다) + 사람 + to부정사의 수동: (was) instructed to write(적으라는 지시를 받았다)."],["followed","following","a","자선 콘서트(첫 번째 선택)가 빵 바자회와 미술 전시회에게 \"뒤따라지는\" 쪽이다. 뒤의 by(~에 의해)가 수동 단서라 following(뒤따르는)은 틀린다."],["every_member","","","every(모든) 뒤에는 단수 명사: every member(모든 구성원)."],["were_counted","","","투표용지들이 \"세어지는\" 쪽이고 복수라 were counted(집계되었다)가 맞다."]],"opts":["follow","follows","followed","to follow"],"or":["follow(뒤따르다): 콤마 뒤에 동사원형이 접속사 없이 올 수 없음.","follows(뒤따르다, 3인칭 단수형): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐.","followed(뒤따라지는): 자선 콘서트가 뒤따라지는 수동 분사이고, 뒤의 by(~에 의해)와 짝이라 맞음.","to follow(뒤따르는 것): to부정사는 by(~에 의해)와 이어져 \"뒤따라지는\" 뜻을 만들 수 없음."],"point":"능동 v-ing vs. 수동 p.p.(분사구문)","en":"For example, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.","ko":"예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 그 뒤를 따른다면, 그들은 CBA라고 적을 것이다.","hl":["followed by the bake sale and the art show"],"khl":["그 뒤를 따른다면"],"blocks":[{"t":"p","h":"줄 서기로 생각하기","x":["줄 맨 앞: 자선 콘서트(1지망).","그 뒤에 빵 바자회, 그다음 미술 전시회가 \"따라온다\".","주어 쪽(자선 콘서트) 입장에서는 뒤에서 \"따라와지는\" 것이라 followed by(~이 뒤따르는).","following(따라가는)은 뒤에 따라갈 대상이 바로 와야 하는데, 여기는 by(~에 의해)가 와 있다.","그래서 이 투표용지에는 순서대로 CBA(C 다음 B 다음 A)라고 적는다."]},{"t":"pair","h":"쉬운 예시","x":[["She came in, followed by her dog.","그녀가 들어왔고, 그 뒤를 그녀의 개가 따라왔다. (followed by(~이 뒤따르는))"],["He walked home, following the river.","그는 강을 따라 집으로 걸어갔다. (following(따라가는) + 목적어 the river(강))"]]}],"post":["followed by(~이 뒤따르는): by가 보이면 p.p."]},{"slots":[["was_each","","","주어 Each(각각)는 단수 취급이라 was(~였다, 단수형) es were redistributed based on their second preferences.","ko":"따라서 선택지 A는 제거되었고, 그 5명의 표는 그들의 2지망에 따라 재분배되었다.","hl":["option A was eliminated"],"khl":["선택지 A는 제거되었고"],"blocks":[{"t":"p","h":"하나는 was, 여럿은 were","x":["option A(선택지 A)는 선택지 하나다. 그래서 was eliminated(제거되었다).","같은 문장 뒤쪽 votes(표들)는 여럿이라 were redistributed(재분배되었다).","한 문장 안에서 was(~였다, 단수형)와 were(~였다, 복수형)가 나란히 나오니, 주어를 하나씩 확인한다.","꼴찌 A가 빠지고, A를 1지망으로 쓴 5명의 표는 2지망을 따라 옮겨 간다."]},{"t":"pair","h":"쉬운 예시","x":[["The player was sent off.","그 선수는 퇴장당했다. (player(선수) 하나 → was)"],["The players were sent off.","그 선수들은 퇴장당했다. (players(선수들) 여럿 → were)"]]}],"post":["단수 주어 option A(선택지 A) → was eliminated(제거되었다)"]},{"slots":[["were_added","","","and(그리고)로 이어진 두 주어(4표와 1표)라 복수 were(~되었다)가 맞다."],["meant","meaning","a","주어 This(이것) 뒤에 진짜 동사가 필요하다. meaning(의미하는)은 동사 옷을 벗은 말이라 문장의 동사가 될 수 없다."],["while","","","뒤에 주어 + 동사가 오는 접속사 while(~인 반면)이 맞다."],["allows","","","주어 It(그것 = AV(대안 투표) 방식)이 단수라 allows(허용한다)가 맞다."],["to_have","","","allow(허용하다) + 목적어 + to부정사: allows votes to have(표가 갖게 한다)."]],"opts":["to mean","meant","having meant","be meant"],"or":["to mean(의미하는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","meant(의미했다): 주어 This(이것)의 진짜 동사이고 이야기가 과거라 맞음.","having meant(의미하고 나서): 완료 -ing형이라 동사 자리에 못 옴.","be meant(의도되다): 주어 뒤에 원형 be가 그대로 올 수 없고, 뒤의 that절 목적어와도 안 맞음."],"point":"정동사 vs. 준동사","en":"This meant that option B had 11 total votes, while option C had only 9.","ko":"이것은 선택지 C가 9표밖에 얻지 못한 반면 선택지 B가 총 11표를 얻었다는 것을 의미했다.","hl":["This meant that option B had 11 total votes"],"khl":["선택지 B가 총 11표를 얻었다는 것을 의미했다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["This(이것)가 주어. 뒤에 동사가 하나 꼭 있어야 한다.","that(~라는 것) 뒤 option B had(B가 얻었다)는 that 상자 안의 동사라 바깥 문장의 동사가 아니다.","바깥 문장의 동사는 meant(의미했다) 하나뿐. 이걸 -ing로 바꾸면 동사가 사라진다.","결론: 11표 대 9표, AV(대안 투표)의 승자는 빵 바자회."]},{"t":"pair","h":"쉬운 예시","x":[["This means that you won.","이것은 네가 이겼다는 뜻이다. (주어 This(이것) + 동사 means(의미하다))"],["The red light meant stop.","빨간불은 멈추라는 뜻이었다. (주어 light(불빛) + 동사 meant(의미했다))"]]}],"p 3: 콩도르세","tpl":"Finally, the student council {counted|counted} the votes {using|using} the Condorcet method. This method {involves|involves} {comparing|comparing} the voters’ preferences between each possible pair of options. In this case, there {were|were} three pairs {to_consider|to consider}: A vs. B, B vs. C, and A vs. C. Through this method, the student council discovered {that_d|that} its members preferred option A {to_b|to} option B by a count of 11 to 9. In other words, 11 people preferred A to B, {voting|voting} either ABC, ACB, or CAB. Meanwhile, 9 people preferred B to A by {voting_by|voting} BAC, BCA, or CBA. Interestingly, the voters preferred option B to option C by the same count of 11 to 9. They also preferred option A to option C by 11 to 9. As option A, the art show, {was|was} {preferred|preferred} to both of the {other|other} options, it would be {considered|considered} the winner. The Condorcet method’s weakness is {that_w|that}, along with {being|being} complex, it sometimes fails {to_select|to select} a winner. This is especially true in elections {that_r|that} {contain|contain} numerous options. It is possible {that_p|that} no option will be clearly preferred over the others.","fn":[],"mean":{"counted":"집계했다, 셌다(count의 과거형)","counting":"세는(count의 -ing형)","using":"사용하여(use의 -ing형, 분사)","involves":"수반한다(involve의 3인칭 단수 현재형)","comparing":"비교하는 것(compare의 -ing형, 동명사)","were":"있었다(be의 과거형, 복수 주어)","to count":"세는 것(count의 to부정사)","having counted":"센 후에(count의 완료 -ing형)","be counted":"세어지다(count의 수동 원형)","to compare":"비교하는 것(compare의 to부정사)","compare":"비교하다(동사원형)","compared":"비교된, 비교했다(compare의 과거분사형·과거형)","compares":"비교하다(compare의 3인칭 단수 현재형)","to consider":"고려해야 할(consider의 to부정사)","consider":"고려하다(동사원형)","that":"~라는 것(명사절 접속사) / ~하는(관계대명사)","to":"~보다(prefer A to B의 짝)","considers":"고려하다(consider의 3인칭 단수 현재형)","to considering":"고려하는 것으로(to + -ing)","be considered":"고려되다(consider의 수동 원형)","than":"~보다(비교급의 짝)","voting":"투표하는 것, 투표하며(vote의 -ing형)","fr 반하다)는 목적어로 동명사를 받아 comparing(비교하는 것)이 맞다."],["were","","","there(~이 있다) 뒤 주어 three pairs(세 쌍)가 복수라 were(있었다)가 맞다."]],"opts":["counted","to count","having counted","be counted"],"or":["counted(집계했다): 주어 the student council(학생 자치회)의 진짜 동사이고 이야기가 과거라 맞음.","to count(세는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","having counted(센 후에): 완료 -ing형이라 동사 자리에 못 옴.","be counted(세어지다): 주어 뒤에 원형 be가 그대로 올 수 없고, 자치회가 직접 세는 능동과도 안 맞음."],"point":"정동사 vs. 준동사","en":"Finally, the student council counted the votes using the Condorcet method.","ko":"마지막으로 학생 자치회는 콩도르세 방식을 사용하여 표를 집계했다.","hl":["the student council counted the votes"],"khl":["학생 자치회는","표를 집계했다"],"blocks":[{"t":"p","h":"-ing가 둘이면 동사가 없다","x":["이 문장에서 using(사용하여)은 덧붙인 분사다. 동사가 아니다.","counted(집계했다)까지 counting(세는)으로 바꾸면 문장에 동사가 하나도 없다.","주어 + 동사는 문장의 뼈대. 뼈대 하나는 꼭 남겨야 한다.","세 번째이자 마지막 방식: Condorcet(콩도르세)."]},{"t":"pair","h":"쉬운 예시","x":[["She cleaned the room using a mop.","그녀는 대걸레를 사용하여 방을 청소했다. (cleaned(청소했다)가 동사)"],["He finished the test, smiling.","그는 웃으면서 시험을 끝냈다. (finished(끝냈다)가 동사)"]]}],"post":["뼈대 동사 하나는 꼭: the council counted(자치회가 집계했다) + using(사용하여)"]},{"slots":[["counted","","","주어 the student council(학생 자치회)의 진짜 동사 counted(집계했다)가 맞다."],["using","","","진짜 동사 counted(집계했다)가 있고, 자치회가 방식을 직접 쓰는 쪽이라 using(사용하여)이 맞다."],["involves","","","주어 This method(이 방식)가 단수라 involves(수반한다)가 맞다."],["comparing","to compare","a","involve(수반하다)는 목적어로 동명사만 받는다. to compare(비교하는 것)는 이 자리에 못 온다."],["were","","","there(~이 있다) 뒤 주어 three pairs(세 쌍)가 복수라 were(있었다)가 맞다."]],"opts":["compare","comparing","compared","compares"],"or":["compare(비교하다): involves(수반한다) 뒤에 동사원형이 오면 동사가 겹침.","comparing(비교하는 것): involve(수반하다)의 목적어로 동명사가 오고, 뒤의 목적어 preferences(선호도)를 받아서 맞음.","compared(비교된, 비교했다): 동사가 겹치거나 수동이 되어 목적어 preferences(선호도)를 받을 수 없음.","compares(비교하다, 3인칭 단수형): involves(수반한다)와 동사가 겹침."],"point":"동명사 vs. to부정사 목적어","en":"This method involves comparing the voters’ preferences between each possible pair of options.","ko":"이 방식은 가능한 선택지 쌍마다 투표자들의 선호도를 비교하는 것을 키는 것)과 모양도 안 맞음.","making(만드는 것): 전치사 Instead of(~ 대신에) 뒤에서 pointing(가리키는 것)과 and(그리고)로 나란한 동명사라 맞음.","be made(만들어지다): 전치사 뒤에 원형 be는 못 오고, 목적어 the council’s choice(자치회의 선택)도 받을 수 없음."],"point":"병렬구조","en":"Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.","ko":"모든 방식이 하나의 선택지를 가리켜 자치회의 선택을 더 쉽게 만들어 주는 대신, 승자는 방식마다 달랐다.","hl":["pointing toward a single option and making the council’s choice easier"],"khl":["하나의 선택지를 가리켜","더 쉽게 만들어 주는 대신"],"blocks":[{"t":"p","h":"and 앞뒤 저울 맞추기","x":["왼쪽 접시: pointing toward a single option(하나의 선택지를 가리키는 것).","오른쪽 접시: making the council’s choice easier(자치회의 선택을 더 쉽게 만드는 것).","둘 다 Instead of(~ 대신에)에 걸리는 동명사다.","현실: 세 방식이 고른 승자는 C, B, A로 모두 달랐다. 선택이 쉬워지기는커녕 더 어려워졌다."]},{"t":"pair","h":"쉬운 예시","x":[["Instead of sleeping and wasting time, he studied.","그는 자면서 시간을 낭비하는 대신 공부했다. (sleeping(자는 것) and wasting(낭비하는 것))"],["She enjoys singing and dancing.","그녀는 노래하고 춤추는 것을 즐긴다. (singing(노래하는 것) and dancing(춤추는 것))"]]}],"post":["and(그리고) 앞뒤 같은 -ing: pointing and making(가리키고 만드는 것)"]},{"slots":[["making","","","and(그리고)로 앞의 pointing(가리키는 것)과 나란한 동명사 making(만드는 것)이 맞다."],["easier","","","make(만들다) + 목적어 + 형용사: making the choice easier(선택을 더 쉽게 만드는)."],["differed","was differed","a","differ(다르다)는 목적어를 받지 않는 동사라 수동태(be + p.p.)가 될 수 없다. was differed(달라졌다)는 틀린다."],["to_choose","","","decide(결정하다) + to부정사: decided to choose(선택하기로 결정했다)."],["directly","","","the idea(생각)를 설명하는 of(~라는) 뒤 동명사 comparing(비교하는 것)이 목적어 each option(각 선택지)을 직접 받으니 능동이 맞다. directly(직접)는 그 동명사를 꾸미는 부사."]],"opts":["differing","to differ","differed","different"],"or":["differing(다른): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐.","to differ(다른 것): to부정사는 동사 자리에 못 옴.","differed(달랐다): differ(다르다)는 수동이 없는 동사라 능동 과거형이 맞음.","different(다른): 형용사라 be동사 없이 동사 자리에 못 옴."],"point":"능동태 vs. 수동태","en":"Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.","ko":"모든 방식이 하나의 선택지를 가리켜 자치회의 선택을 더 쉽게 만들어 주는 대신, 승자는 방식마다 달랐다.","hl":["the winner differed with each method"],"khl":["승자는 방식마다 달랐다"],"blocks":[{"t":"p","h":"수동태가 없는 동사","x":["수동태는 \"누가 누구에게 하는\" 동작을 뒤집은 모양이다.","differ(다르다), happen(일어나다), arrive(도착하다), disappear(사라지다)는 목적어가 없어서 뒤집을 것이 없다.","그래서 be + p.p.로 쓰지 못한다.","승자: FPTP(단순 다수결) → 자선 콘서트, AV(대안 투표) → 빵 바자회, Condorcet(콩도르세) → 미술 전시회."]},{"t":"pair","h":"쉬운 예시","x":[["The accident happened at night.","그 사고는 밤에 일어났다. (was happened(틀린 모양))"],["Their opinions differed.","그들의 의견은 달랐다. (was differed(틀린 모양))"]]}],"post":["differ(다르다)는 수동 불가: the winner differed(승자는 달랐다)"]},{"slots":[["differed","","","differ(다르다)는 목적어 없이 쓰는 동사라 능동 differed(달랐다)가 맞다."],["to_choose","choosing","a","decide(결정하다)는 목적어로 to부정사를 받는다. decided choosing(선택하는 것을 결정했다)은 틀린다."],["directly","","","the idea(생각)를 설명하는 of(~라는) 뒤 동명사 comparing(비교하는 것)이 목적어 each option(각 선택지)을 직접 받으니 능동이 맞다. directly(직접)는 그 동명사를 꾸미는 부사."],["that_a","","","agreed(동의했다) 뒤 완전한 문장을 이끄는 that(~라는 것)이 맞다."],["is","","","동명사 주어 choosing ~(선택하는 것)은 단수라 is(~이다)가 맞다."]],"opts":["choose","to choose","chose","chosen"],"or":["choose(선택하다): decided(결정했다)와 동사가 겹침.","to choose(선택하기로): decide(결정하다) + to부정사라 맞음.","chose(선택했다): 과거형 동사가 겹쳐 문장이 깨짐.","chosen(선택된): p.p.는 decided(결정했다)의 목적어 자리에 못 오고, 목적어 the Condorcet method(콩도르세 방식)도 받을 수 없음."],"point":"동명사 vs. to부정사 목적어","en":"The student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.","ko":"학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했다. 각 선택지를 다른 선택지들과 직접 비교한다는 생각이 마음에 들었기 때문이다.","hl":["decided to choose the Condorcet method"],"khl":["콩도르세 방식을 선택하기로 결정했다"],"blocks":[{"t":"p","h":"앞으로 할 일은 to","x":["decide(결정하다), plan(계획하다), hope(바라다), want(원하다): 아직 하지 않은 앞날의 일 → to부정사.","enjoy(즐기다), finish(끝내다), avoid(피하다): 이미 하고 있는 일 → -ing.","자치회는 이제부터 콩도르세 방식을 쓰기로 했다. 앞으로의 일이라 to choose(선택하기로).","이유: 모든 선택지를 일대일로 직접 비교하는 방식이 마음에 들었다."]},{"t":"pair","h":"쉬운 예시","x":[["We decided to  동명사 comparing(비교하는 것)이 목적어 each option(각 선택지)을 직접 받으니 능동이 맞다. directly(직접)는 그 동명사를 꾸미는 부사."],["that_a","","","agreed(동의했다) 뒤 완전한 문장을 이끄는 that(~라는 것)이 맞다."],["is","are","a","that(~라는 것) 안의 주어는 choosing an ideal voting method(이상적인 투표 방법을 선택하는 것). 동명사 주어는 단수 취급이라 are(~이다, 복수형)는 틀린다."],["whichever","","","\"우리가 고르는 어느 것이든\"이라는 주어 덩어리를 만드는 Whichever(어느 것이든)가 맞다."],["simple","","","keep(유지하다) + 목적어 + 형용사: keep the process simple(과정을 단순하게 유지하다)."]],"opts":["is","be","being","to be"],"or":["is(~이다): 동명사 주어 choosing ~(선택하는 것)은 단수라 맞음.","be(~이다): 동사원형은 주어 뒤 동사 자리에 그대로 못 옴.","being(~인 것): -ing는 혼자 동사 자리에 못 옴.","to be(~인 것): to부정사는 동사 자리에 못 옴."],"point":"동명사 주어의 수일치","en":"It is obvious that choosing an ideal voting method is a complex and challenging task.","ko":"이상적인 투표 방법을 선택하는 것이 복잡하고 어려운 일이라는 것은 분명하다.","hl":["choosing an ideal voting method is"],"khl":["이상적인 투표 방법을 선택하는 것이"],"blocks":[{"t":"p","h":"동명사 주어는 한 덩어리","x":["choosing an ideal voting method(이상적인 투표 방법을 선택하는 것)는 \"선택하는 일\" 하나다.","method(방법)는 그 일 안의 목적어일 뿐이다.","한 가지 일 → 단수 → is(~이다).","결론: 완벽한 투표 방법은 없다. 그래서 고르기가 어렵다."]},{"t":"pair","h":"쉬운 예시","x":[["Reading books is fun.","책을 읽는 것은 재미있다. (Reading(읽는 것) → is)"],["Making friends is not easy.","친구를 사귀는 것은 쉽지 않다. (Making(사귀는 것) → is)"]]}],"post":["동명사 주어 choosing ~(선택하는 것) → 단수 is(~이다)"]}],"quiz":[{"s":"Instead of watching TV and ___ games, read a book.","o":["playing","play"],"a":0,"ko":"TV를 보고 게임을 하는 대신 책을 읽어라.","why":"watching(보는 것)과 and(그리고)로 나란히 -ing.","wy":"play(하다): 전치사 Instead of(~ 대신에) 뒤에서 watching(보는 것)과 모양이 안 맞음."},{"s":"Their answers ___ a lot.","o":["were differed","differed"],"a":1,"ko":"그들의 대답은 많이 달랐다.","why":"differ(다르다)는 수동이 없어 능동 differed(달랐다).","wy":"were differed(달라졌다): differ(다르다)는 목적어가 없는 동사라 수동태가 안 됨."},{"s":"We decided ___ a taxi.","o":["to take","taking"],"a":0,"ko":"우리는 택시를 타기로 결정했다.","why":"decide(결정하다) + to부정사.","wy":"taking(타는 것): decide(결정하다)는 -ing를 목적어로 받지 않음."},{"s":"He enjoys ___ comics.","o":["being read","reading"],"a":1,"ko":"그는 만 ","keep(유지하다) + 목적어 + 형용사. the process(과정)가 어떤 상태인지 말하는 자리라 부사 simply(단순히)는 틀린다."],["not_ranking","","","전치사 by(~함으로써) 뒤 동명사, 부정은 앞에 not(~않다): by not ranking(순위를 매기지 않음으로써)."],["arguing","","","진짜 동사 continue(계속하다)가 있고, 사람들이 직접 주장하는 쪽이라 분사 arguing(주장하며)이 맞다."]],"opts":["simplicity","simplify","simple","simplifies"],"or":["simplicity(단순함): 명사라 the process(과정)의 상태를 말하는 형용사 자리에 안 맞음.","simplify(단순화하다): 동사원형이라 keep(유지하다) + 목적어 뒤에 못 옴.","simple(단순한): keep(유지하다) + 목적어 + 형용사에서 the process(과정)의 상태를 말해서 맞음.","simplifies(단순화하다, 3인칭 단수형): 동사가 겹쳐 문장이 깨짐."],"point":"형용사 자리 vs. 부사 자리(목적격보어)","en":"Some people believe that it is best to keep the process simple by not ranking our choices at all.","ko":"어떤 사람들은 선택지에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다.","hl":["keep the process simple"],"khl":["과정을 단순하게 유지하는"],"blocks":[{"t":"p","h":"keep 뒤는 상태","x":["keep(유지하다) + A + 형용사 = A를 ~한 상태로 유지하다.","the process(과정)가 어떤 상태? simple(단순한).","한국말 해석 \"단순하게\"에 속아 -ly를 붙이면 틀린다.","이 사람들의 생각: 순위 매기기는 빼고 1지망만 세자. 바로 FPTP(단순 다수결)처럼."]},{"t":"pair","h":"쉬운 예시","x":[["Keep the door open.","문을 열어 두어라. (door(문)의 상태 → 형용사)"],["Keep your hands clean.","손을 깨끗하게 유지해라. (hands(손)의 상태 → 형용사)"]]}],"post":["keep(유지하다) + 목적어 + 형용사: keep the process simple(과정을 단순하게 유지하다)"]},{"slots":[["whichever","","","\"우리가 고르는 어느 것이든\"이라는 주어 덩어리를 만드는 Whichever(어느 것이든)가 맞다."],["simple","","","keep(유지하다) + 목적어 + 형용사: keep the process simple(과정을 단순하게 유지하다)."],["not_ranking","not to rank","a","by(~함으로써)는 전치사라 뒤에 동명사가 와야 한다. 부정은 동명사 앞에 not(~않다). to부정사 not to rank(순위를 매기지 않는 것)는 전치사 뒤에 못 온다."],["arguing","","","진짜 동사 continue(계속하다)가 있고, 사람들이 직접 주장하는 쪽이라 분사 arguing(주장하며)이 맞다."],["are_designed","","","노력들이 \"고안되는\" 쪽이고 복수라 are designed(고안되었다)가 맞다."]],"opts":["not rank","not ranked","ranking not","not ranking"],"or":["not rank(순위를 매기지 않다): 전치사 뒤에 동사원형은 못 옴.","not ranked(순위가 매겨지지 않은): p.p.는 전치사 뒤에 못 오고, 목적어 our choices(우리의 선택들)도 받을 수 없음.","ranking not(순위를 매기는 것 않음): not(~않다)이 동명사 뒤에 와서 어순이 틀림.","not ranking(순위를 매기지 않음): 전치사 by(~함으로 ))"],["He runs not to win but to enjoy it.","그는 이기려고가 아니라 즐기려고 달린다. (to win(이기려고) / to enjoy(즐기려고))"]]},{"t":"tap","h":"확인 질문","q":"이 문장에서 help(돕다) 뒤 make(내리다)는 왜 to가 없을까?","a":["help(돕다) + 목적어 + 동사원형이 가능하기 때문.","help us make = 우리가 내리도록 돕다."]}],"post":["not to make(만들려는 것이 아니라) ~, but to help(돕기 위해): 쌍둥이 모양"]}],"quiz":[{"s":"___ you pick will be fine.","o":["However","Whichever"],"a":1,"ko":"네가 어느 것을 고르든 괜찮을 것이다.","why":"주어 덩어리를 만드는 Whichever(어느 것이든).","wy":"However(아무리 ~해도): 부사라 will be(~일 것이다)의 주어 덩어리를 만들 수 없음."},{"s":"Keep your desk ___.","o":["clean","cleanly"],"a":0,"ko":"네 책상을 깨끗하게 유지해라.","why":"keep(유지하다) + 목적어 + 형용사.","wy":"cleanly(깨끗하게): 부사라 desk(책상)의 상태를 말하는 자리에 못 옴."},{"s":"I’m sorry for not ___ you earlier.","o":["to tell","telling"],"a":1,"ko":"너에게 더 일찍 말하지 않아서 미안해.","why":"전치사 for(~에 대해) 뒤 not(~않다) + -ing.","wy":"to tell(말하는 것): 전치사 for(~에 대해) 뒤에 to부정사는 못 옴."},{"s":"She left the room, ___ goodbye.","o":["said","saying"],"a":1,"ko":"그녀는 작별 인사를 하며 방을 나갔다.","why":"동사 left(나갔다)가 있으니 덧붙임은 -ing.","wy":"said(말했다): 접속사 없이 동사가 하나 더 생김."},{"s":"I came not to play but ___.","o":["to study","studying"],"a":0,"ko":"나는 놀려고가 아니라 공부하려고 왔다.","why":"not to play(놀려고가 아니라)와 모양을 맞춘 to study(공부하려고).","wy":"studying(공부하는 것): 앞의 to play(놀려고)와 모양이 안 맞음."}]}],"comp":[{"no":"본문 ❼","slots":[["to_help","","","not A but B(A가 아니라 B). 앞의 not to make(만들려는 것이 아니라)에 맞춘 to help(돕기 위해)가 맞다."],["make","","","help(돕다) + 목적어 + 동사원형: help us make(우리가 내리도록 돕다)."],["allows","","","이해하고 따져 보는 일을 하나의 과정으로 본 동명사구 주어라 단수 allows(~하게 한다)가 맞다."],["to_become","becoming","a","be likely to(~할 가능성이 있다)는 뒤에 동사원형이 오는 굳은 표현이다. likely(~할 것 같은) 뒤에 becoming(되는 것)은 못 온다."],["ourselves","","","주어 we(우리) 자신을 강조하는 재귀대명사 ourselves(우리 스스로)가 맞다."]],"opts":["become","became","to become","to becoming"],"or":["become(되다): likely(~할 것 같은) 뒤에 to 없이 동사원형이 바로 올 수 없음.","became(되었다): 과거형 동사가 are(~이다)와 겹침.","to become(될): be likely to(~할 가능성이 있다) + 동사원형이라 맞음.","to becoming(되는 것으로): to 뒤에 -ing가 붙는 모양은 be likely to(~할 가능성이 있다)에 없음."],"point":"be likely to + 동사원형","en":"When we understand decision-making better, we are more likely to become better decision-makers ourselves.","ko":"우리가 의사 결정을 더 잘 이해할 때, 우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다.","hl":["we are more likely to become better decision-makers"],"khl":["더 나은 의사 결정자가 될 가능성이 더 높다"],"blocks":[{"t":"p","h":"likely는 to와 붙어 다닌다","x":["be likely to(~할 가능성이 있다) + 동사원형.","more(더)가 붙어도 모양은 그대로: be more likely to(~할 가능성이 더 높다).","글의 마지막 메시지: 결정 과정을 이해하면, 우리 자신이 더 좋은 결정을 내리는 사람이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["It is likely to rain tomorrow.","내일 비가 올 것 같다. (be likely to(~할 것 같다) + 원형)"],["Kids are more likely to get colds.","아이들은 감기에 걸릴 가능성이 더 높다. (be more likely to(~할 가능성이 더 높다) + 원형)"]]}],"post":["be likely to(~할 가능성이 있다) + 동사원형: likely to become(될 가능성이 있는)"]},{"no":"본문 ❼","slots":[["to_help","","","not A but B(A가 아니라 B). 앞의 not to make(만들려는 것이 아니라)에 맞춘 to help(돕기 위해)가 맞다."],["make","","","help(돕다) + 목적어 + 동사원형: help us make(우리가 내리도록 돕다)."],["allows","","","이해하고 따져 보는 일을 하나의 과정으로 본 동명사구 주어라 단수 allows(~하게 한다)가 맞다."],["to_become","","","be likely to(~할 가능성이 있다) + 동사원형: to become(되다)."],["ourselves","us","a","주어 we(우리)를 \"우리 스스로\"라고 강조하는 자리다. 목적격 us(우리를)는 문장 끝에 강조로 붙일 수 없다."]],"opts":["ourselves","ours","our","themselves"],"or":["ourselves(우리 스스로): 주어 we(우리)를 강조하는 재귀대명사라 맞음.","ours(우리의 것): 소유대명사라 \"우리 스스로\"라는 강조 뜻이 안 됨.","our(우리의): 소유격이라 뒤에 명사가 와야 하는데 문장이 끝남.","themselves(그들 스스로): 주어 we(우리)와 사람이 달라 틀림."],"point":"재귀대명사(강조 용법)","en":"When we understand decision-making better, we are more likely to become better decision-makers ourselves.","ko":"우리가 의사 결정을 더 잘 이해할 때, 우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다.","hl":["better decision-makers ourselves"],"khl":["우리 스스로 더 나은 의사 결정자가"],"blocks":[{"t":"p","h":"강조하는 -selves","x":["재귀대명사는 두 가지로 쓴다.","1) 목적어 = 주어: We enjoyed ourselves(우리는 즐거운 시간을 보냈다).","2) 강조: We did it ourselves(우리가 직접 했다). 빼도 문장이 성립한다.","이 문장은 2번. 남이 아니라 \"우리 자신이\" 더 좋은 결정자가 된다는 강조."]},{"t":"pair","h":"쉬운 예시","x":[["We made the cake ourselves.","우리가 직접 그 케이크를 만들었다. (주어 We(우리) 강조)"],["She fixed the bike herself.","그녀가 직접 자전거를 고쳤다. (주어 She(그녀) 강조)"]]}],"post":["주어 we(우리) 강조: ourselves(우리 스스로)"]}],"compquiz":[{"s":"It is likely ___ tomorrow.","o":["raining","to rain"],"a":1,"ko":"내일 비가 올 것 같다.","why":"be likely to(~할 가능성이 있다) + 동사원형.","wy":"raining(비가 오는 것): likely(~할 것 같은) 뒤에는 to부정사가 와야 함."},{"s":"We painted the room ___.","o":["us","ourselves"],"a":1,"ko":"우리가 직접 그 방을 칠했다.","why":"주어 We(우리)를 강조하는 재귀대명사.","wy":"us(우리를): 목적격이라 강조 자리에 못 옴."}]}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
