→ say(말하다). 화살표가 동사로 간다.","동사를 꾸미는 일은 부사가 맡는다.","rough(대략적인)는 형용사라 명사에만 화살표를 쏜다. a rough idea(대략적인 생각)처럼.","can(~할 수 있다)과 동사 사이에 끼어 있는 말은 대부분 부사다."]},{"t":"pair","h":"쉬운 예시","x":[["He can easily solve the problem.","그는 그 문제를 쉽게 풀 수 있다. (동사 solve(풀다) ← 부사)"],["It is an easy problem.","그것은 쉬운 문제다. (명사 problem(문제) ← 형용사)"]]}],"post":["can roughly say(대략 말할 수 있다): 동사 앞 꾸밈말은 -ly"]},{"slots":[["get","","","주어 Things(상황들)가 복수라 get(되다)이 맞다."],["measuring","","","that절의 주어 역할을 하는 동명사다."],["involves","involve","a","that절의 주어는 measuring(측정하는 것)이다. 동명사 주어는 하나로 세니 involves(수반하다)."],["which","","","use(사용하다) 뒤에 목적어가 빠져 있어서 관계대명사 which(~하는)가 맞다."],["existing","","","exist(존재하다)는 목적어 없이 스스로 하는 동사라 -ing가 맞다."]],"opts":["involving","to involve","have involved","involves"],"or":["involving(수반하는): -ing는 혼자 동사 자리에 못 와서 that절에 동사가 없어짐.","to involve(수반하는 것): to부정사도 동사 자리에 못 와서 that절의 동사가 비게 됨.","have involved(수반해 왔다): have(완료형 조동사)는 복수 주어용이라 동명사 주어 measuring(측정하는 것)과 안 맞음.","involves(수반하다, 3인칭 단수형): 주어 measuring(측정하는 것)이 동명사라 단수 취급해서 맞음."],"point":"수식받는 주어의 수일치","en":"We can roughly say that measuring the mass of a star involves various theories.","ko":"별의 질량을 측정하는 것은 다양한 이론을 수반한다고 대략 말할 수 있다.","hl":["measuring","involves"],"khl":["측정하는 것은","수반한다고"],"blocks":[{"t":"p","h":"주인은 맨 앞의 -ing 덩어리","x":["that(~라고) 뒤 문장의 주인은 measuring(측정하는 것)이다.","the mass of a star(별의 질량)는 measuring(측정하는 것)에 딸린 짐이다.","동명사 주어는 덩어리 하나로 센다. 그래서 단수.","바로 앞 star(별)나 뒤의 theories(이론들)에 속으면 안 된다."]},{"t":"pair","h":"쉬운 예시","x":[["Reading books makes me happy.","책을 읽는 것은 나를 행복하게 만든다. (주인 Reading(읽는 것) → makes(만든다))"],["Learning new words takes time.","새 단어를 배우는 것은 시간이 걸린다. (주인 Learning(배우는 것) → takes(걸린다))"]]}],"post":["동명사 주어 measuring(측정하는 것) = 하나 → involves(수반하다)"]},{"slots":[["compare","","","might(~할 수도 있다) 뒤 put(놓다)과 나란한 동사원형이다."],["to_measure","","","want(원하다) + to부정사. \"측정하기를 원하다\"."],["determine","","","주어 we(우리)의 진짜 동사다."],["which","where","a","뒤의 use(사용하다)에 목적어가 빠져 있다. 빈자리가 있으면 관계부사 where(~하는 곳)가 아니라 관계대명사 which(~하는)."],["accepted","","","theories(이론들)는 사람들에게 '인정받는' 쪽이라 p.p.가 맞다."]],"opts":["what","whose","which","how"],"or":["what(~하는 것): 앞에 명사(their distance = 그들의 거리)가 있어서 선행사를 품은 what은 못 옴.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 we(우리)가 와서 안 됨.","which(~하는): 앞 명사(거리)를 받고, 뒤의 use(사용하다)의 목적어 빈자리를 채우는 관계대명사라 맞음.","how(~하는 방법): 관계부사라 뒤 문장이 완전해야 하는데 use(사용하다)의 목적어가 비어 있음."],"point":"관계대명사 vs. 관계부사","en":"we first determine a center of mass between the two stars, then their distance from that center which we can then use, together with a value for the period and a certain instance of Kepler’s Third Law, to calculate the mass.","ko":"우리는 먼저 두 별 사이의 질량 중심을 알아내고, 그다음 그 중심에서 두 별까지의 거리를 알아낸다. 그 거리를 주기 값과 케플러 제3법칙의 한 사례와 함께 사용해 질량을 계산할 수 있다.","hl":["which we can then use","their distance"],"khl":["그 거리를","거리를 알아낸다"],"blocks":[{"t":"p","h":"빈자리 찾기","x":["관계사 뒤 문장을 읽고 빠진 자리를 찾는다.","we can then use(우리는 그다음 사용할 수 있다): 무엇을 사용하지? 목적어가 없다.","목적어가 빠진 문장 앞에는 관계대명사 which(~하는)가 온다.","where(~하는 곳)는 뒤 문장이 다 갖춰져 있을 때만 쓴다.","together with ~(~와 함께)는 중간에 끼어든 말이라 목적어가 아니다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the pen which I bought yesterday.","이것은 내가 어제 산 펜이다. (bought(샀다)의 목적어가 빠짐 → which)"],["This is the shop where I bought the pen.","이곳은 내가 그 펜을 산 가게다. (빠진 것 없음 → where(~하는 곳))"]]},{"t":"tap","h":"확인 질문","q":"together with(~와 함께) ... Law(법칙)를 괄호로 묶으면 남는 문장은?","a":["which we can then use to calculate the mass(질량을 계산하는 데 그다음 사용할 수 있는).","use(사용하다)의 목적어가 앞의 거리이고, 그 자리가 비어 있다."]}],"post":["use(사용하다) 뒤 목적어 빈자리 → which(~하는), 완전하면 where(~하는 곳)"]}],"quiz":[{"s":"___ catch the bus, I ran fast.","o":["Catch","To catch"],"a":1,"ko":"버스를 잡으려고 나는 빨리 달렸다.","why":"진짜 동사는 ran(달렸다). 앞은 목적을 나타내는 To catch(잡기 위해).","wy":"Catch(잡다): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐."},{"s":"She will wash the dishes and ___ the table.","o":["clean","cleaning"],"a":0,"ko":"그녀는 설거지를 하고 식탁을 닦을 것이다.","why":"will wash and clean(씻고 닦을 것이다). 동사원형끼리 나란히.","wy":"cleaning(닦는 것): will(~할 것이다) 뒤 동사원형 wash(씻다)와 모양이 안 맞음."},{"s":"She spoke ___ to the baby.","o":["soft","softly"],"a":1,"ko":"그녀는 아기에게 부드럽게 말했다.","why":"동사 spoke(말했다)를 꾸미니 부사.","wy":"soft(부드러운): 형용사라 동사 spoke(말했다)를 꾸밀 수 없음."},{"s":"Playing computer games ___ fun.","o":["is","are"],"a":0,"ko":"컴퓨터 게임을 하는 것은 재미있다.","why":"주어는 Playing(하는 것). 동명사 주어는 하나로 센다.","wy":"are(~이다): 복수 동사. games(게임들)는 딸린 짐이라 주인이 아님."},{"s":"This is the bike ___ my dad gave me.","o":["which","where"],"a":0,"ko":"이것은 아빠가 나에게 준 자전거다.","why":"gave me(나에게 주었다) 뒤에 줄 물건이 빠져 있어 관계대명사 which(~하는).","wy":"where(~하는 곳): 뒤 문장이 완전할 때만 쓰는데, 줄 물건 자리가 비어 있음."}]},{"items":[{"slots":[["to_determine","","","진짜 동사 might put(놓을 수도 있다) 앞의 목적(~하기 위해) to부정사다."],["weighing","weigh","a","such as(~같은) 뒤는 명사 덩어리다. 그 안에 접속사 없이 동사 weigh(무게가 ~이다)가 들어올 수 없다. 꾸미는 말 -ing로."],["complicated","","","get(되다) 뒤 상태를 나타내는 형용사다."],["involves","","","동명사 주어 measuring(측정하는 것)이 단수라 involves(수반하다)."],["measure_v","","","주어 we(우리)의 진짜 동사라 현재형 measure(측정하다)."]],"opts":["weighs","was weighing","has weighed","weighing"],"or":["weighs(무게가 ~이다, 3인칭 단수형): 접속사 없이 동사가 생기고, 복수 cubes(큐브들)와 수도 안 맞음.","was weighing(무게를 재고 있었다): 과거진행형도 진짜 동사라 접속사 없이 명사 뒤에 붙일 수 없음.","has weighed(무게를 재 왔다): 현재완료형도 진짜 동사라 명사 덩어리 안에 들어올 수 없음.","weighing(무게가 ~인): 명사 cubes(큐브들)를 뒤에서 꾸미는 분사라 맞음."],"point":"정동사 vs. 준동사","en":"such as a number of metal cubes each weighing 1, 10, or 100 grams.","ko":"예를 들면 각각 1그램, 10그램, 또는 100그램이 나가는 여러 개의 금속 큐브 같은 것이다.","hl":["metal cubes each weighing"],"khl":["나가는 여러 개의 금속 큐브"],"blocks":[{"t":"p","h":"such as(~같은) 뒤는 명사 상자","x":["such as(~같은) 뒤에는 예시로 드는 명사가 온다.","그 상자 안의 주인공은 metal cubes(금속 큐브들).","each weighing ~(각각 무게가 ~인)는 큐브를 꾸미는 설명표다.","설명표에 진짜 동사 weigh(무게가 ~이다)를 붙이면 상자 안에 문장이 하나 더 생긴다.","접속사가 없으니 -ing로 동사 옷을 벗긴다."]},{"t":"pair","h":"쉬운 예시","x":[["I have two bags each weighing 5 kilograms.","나는 각각 5킬로그램이 나가는 가방 두 개가 있다. (weighing = 꾸미는 말)"],["Look at the girl dancing on the stage.","무대에서 춤추는 소녀를 봐. (dancing(춤추는)이 girl(소녀)을 꾸밈)"]]}],"post":["명사 + each weighing(각각 무게가 ~인): 꾸밈말은 -ing"]},{"slots":[["put","","","might(~할 수도 있다) 뒤 동사원형이다."],["much","very","a","more complicated(더 복잡한)는 비교급이다. very(매우)는 비교급을 꾸밀 수 없고 much(훨씬)가 꾸민다."],["roughly","","","동사 say(말하다)를 꾸미는 부사다."],["those","","","복수 values(값들) 앞이라 those(그 ~들)."],["simple","","","명사 estimation(추정)을 꾸미고 unmediated(매개되지 않은)와 나란하니 형용사."]],"opts":["much","many","so","too"],"or":["much(훨씬): 비교급 more complicated(더 복잡한)를 강조하는 말이라 맞음.","many(많은): 셀 수 있는 복수 명사를 꾸미는 말이라 비교급 형용사를 꾸밀 수 없음.","so(그렇게, 매우): 원급을 꾸미는 말이라 비교급 more(더) 앞에 못 옴.","too(너무): 원급을 꾸미는 말이라 비교급 more(더) 앞에 못 옴."],"point":"비교급 강조","en":"Things get much more complicated if I want to know the mass of a distant star.","ko":"만약 내가 먼 별의 질량을 알고 싶다면 상황은 훨씬 더 복잡해진다.","hl":["much more complicated"],"khl":["훨씬 더 복잡해진다"],"blocks":[{"t":"p","h":"비교급 전용 확성기","x":["비교급(더 ~한)을 크게 외치는 확성기는 따로 있다.","much(훨씬), even(훨씬), far(훨씬), still(훨씬), a lot(훨씬).","very(매우)는 원급 전용 확성기다. very big(매우 큰)은 되지만 very bigger(매우 더 큰)는 안 된다.","볼링공에서 별로 넘어가며 \"훨씬\" 어려워진다는 흐름이라 much(훨씬)."]},{"t":"pair","h":"쉬운 예시","x":[["My brother is much taller than me.","형은 나보다 훨씬 더 크다. (비교급 taller(더 큰) ← much)"],["My brother is very tall.","형은 매우 크다. (원급 tall(큰) ← very)"]]}],"post":["much more complicated(훨씬 더 복잡한): 비교급 앞 very(매우) 금지"]},{"slots":[["get","","","주어 Things(상황들)가 복수라 get(되다)."],["to_measure","measuring","a","want(원하다)는 to부정사를 목적어로 받는 동사다. -ing는 쓰지 않는다."],["which","","","use(사용하다)의 목적어가 빠진 자리라 관계대명사 which(~하는)."],["use","","","measure(측정하다)와 and(그리고)로 나란한 동사원형이다."],["existing","","","exist(존재하다)는 목적어가 없는 동사라 -ing로 꾸민다."]],"opts":["measure","measured","to measuring","to measure"],"or":["measure(측정하다): want(원하다) 뒤에 동사원형이 바로 오면 동사가 겹침.","measured(측정했다, 측정된): want(원하다) 뒤 목적어 자리에 과거형이나 p.p.는 못 옴.","to measuring(측정하는 것으로): want(원하다) 뒤의 to는 전치사가 아니라서 -ing를 붙일 수 없음.","to measure(측정하는 것): want(원하다)는 to부정사를 목적어로 받아서 맞음."],"point":"동명사 vs. to부정사 목적어","en":"If we want to measure the mass of a binary star, we first determine a center of mass between the two stars.","ko":"우리가 쌍성의 질량을 측정하고 싶다면, 먼저 두 별 사이의 질량 중심을 알아낸다.","hl":["want to measure"],"khl":["측정하고 싶다면"],"blocks":[{"t":"p","h":"앞날을 바라는 동사는 to","x":["want(원하다), hope(바라다), plan(계획하다), decide(결정하다)는 아직 안 한 일을 바란다.","to는 '앞으로 가는 화살표'라서 이런 동사와 잘 맞는다.","want to measure = 측정하기를 원하다.","같은 지문의 want to know(알고 싶다)도 같은 모양이다."]},{"t":"pair","h":"쉬운 예시","x":[["I want to eat pizza.","나는 피자를 먹고 싶다. (want(원하다) + to부정사)"],["She decided to study abroad.","그녀는 유학하기로 결정했다. (decide(결정하다) + to부정사)"]]}],"post":["want to measure(측정하고 싶다): want(원하다) 뒤는 to부정사"]},{"slots":[["measuring","","","that절의 주어 역할 동명사다."],["determine","","","주어 we(우리)의 진짜 동사다."],["measure_v","","","주어 we(우리)의 진짜 동사라 현재형이다."],["use","using","a","we measure ... and use(우리는 측정하고 사용한다). and(그리고) 앞의 measure(측정하다)와 같은 현재형 동사여야 한다."],["accepted","","","theories(이론들)가 '받아들여지는' 쪽이라 p.p."]],"opts":["uses","having used","use","to be used"],"or":["uses(사용하다, 3인칭 단수형): 주어 we(우리)는 복수라 s를 붙이면 안 됨.","having used(사용하고 나서): -ing형이라 현재형 동사 measure(측정하다)와 짝이 안 맞음.","use(사용하다): 주어 we(우리)의 동사 measure(측정하다)와 and(그리고)로 나란한 현재형이라 맞음.","to be used(사용되는 것): 수동형 to부정사라 동사 자리에 못 오고, 뒤 목적어 those values(그 값들)와도 안 맞음."],"point":"병렬구조","en":"we measure other quantities and use those values, together with certain equations, to calculate the mass.","ko":"우리는 다른 양들을 측정하고, 그 값들을 특정 방정식들과 함께 사용하여 질량을 계산한다.","hl":["measure","use those values"],"khl":["측정하고","사용하여"],"blocks":[{"t":"p","h":"and(그리고)의 저울","x":["왼쪽 접시: we measure(우리는 측정한다)","오른쪽 접시: use those values(그 값들을 사용한다)","두 접시 모두 주어 we(우리)의 동사다.","왼쪽이 현재형 동사면 오른쪽도 현재형 동사.","using(사용하는 것)을 올리면 저울이 기운다."]},{"t":"pair","h":"쉬운 예시","x":[["We cook dinner and wash the dishes.","우리는 저녁을 요리하고 설거지를 한다. (cook and wash = 요리하고 씻는다)"],["They open the box and take out the gift.","그들은 상자를 열고 선물을 꺼낸다. (open and take = 열고 꺼낸다)"]]}],"post":["we measure and use(우리는 측정하고 사용한다): and(그리고) 앞뒤 같은 모양"]},{"slots":[["compare","","","might(~할 수도 있다) 뒤 put(놓다)과 나란한 동사원형이다."],["involves","","","동명사 주어 measuring(측정하는 것)이 단수라 involves(수반하다)."],["those","","","복수 values(값들) 앞이라 those(그 ~들)."],["simple","simply","a","a ___ and unmediated estimation(~하고 매개되지 않은 추정). 명사 estimation(추정)을 꾸미는 자리라 형용사여야 한다."],["existing","","","exist(존재하다)는 '당하는' 뜻이 없는 동사라 -ing."]],"opts":["simple","simplicity","simplify","simplest"],"or":["simple(단순한): 명사 estimation(추정)을 꾸미고 형용사 unmediated(매개되지 않은)와 and(그리고)로 나란해서 맞음.","simplicity(단순함): 명사라 a(하나의) 뒤에서 형용사 unmediated(매개되지 않은)와 짝을 이룰 수 없음.","simplify(단순화하다): 동사라 명사를 꾸미는 자리에 못 옴.","simplest(가장 단순한): 최상급은 보통 the(그)와 함께 쓰며 a(하나의) 뒤에 오지 않음."],"point":"형용사 자리 vs. 부사 자리","en":"Measurement is not a simple and unmediated estimation of independently existing properties.","ko":"측정은 독립적으로 존재하는 속성들을 단순하고 직접적으로 추정하는 것이 아니다.","hl":["a simple and unmediated estimation"],"khl":["단순하고 직접적으로 추정하는 것"],"blocks":[{"t":"p","h":"a(하나의)와 명사 사이는 형용사 자리","x":["a ___ estimation(하나의 ___ 추정): 관사와 명사 사이는 명사를 꾸미는 형용사 자리다.","and(그리고) 오른쪽 unmediated(매개되지 않은)가 형용사라 왼쪽도 형용사.","simply(단순히)는 부사라 명사를 꾸미지 못한다.","부사는 동사·형용사·문장을 꾸미는 말이다."]},{"t":"pair","h":"쉬운 예시","x":[["It is a simple and clear answer.","그것은 단순하고 분명한 답이다. (명사 answer(답) ← 형용사 둘)"],["He explained it simply.","그는 그것을 단순하게 설명했다. (동사 explained(설명했다) ← 부사)"]]}],"post":["a simple and unmediated estimation(단순하고 직접적인 추정): 명사 앞은 형용사"]}],"quiz":[{"s":"I saw a man ___ a red hat.","o":["wears","wearing"],"a":1,"ko":"나는 빨간 모자를 쓴 남자를 보았다.","why":"진짜 동사는 saw(보았다). a man(한 남자)을 꾸미는 말은 -ing.","wy":"wears(쓰다): 접속사 없이 동사가 하나 더 생김."},{"s":"This box is ___ heavier than that one.","o":["very","much"],"a":1,"ko":"이 상자는 저것보다 훨씬 더 무겁다.","why":"비교급 heavier(더 무거운) 앞 강조는 much(훨씬).","wy":"very(매우): 원급만 꾸밀 수 있어 비교급 앞에 못 옴."},{"s":"I want ___ a pilot.","o":["to become","becoming"],"a":0,"ko":"나는 조종사가 되고 싶다.","why":"want(원하다) 뒤는 to부정사.","wy":"becoming(되는 것): want(원하다)는 -ing를 목적어로 받지 않음."},{"s":"He reads books and ___ music.","o":["listens to","listening to"],"a":0,"ko":"그는 책을 읽고 음악을 듣는다.","why":"reads and listens(읽고 듣는다). 현재형 동사끼리 나란히.","wy":"listening to(듣는 것): -ing라 동사 reads(읽는다)와 짝이 안 맞음."},{"s":"She is a ___ and kind teacher.","o":["warmly","warm"],"a":1,"ko":"그녀는 따뜻하고 친절한 선생님이다.","why":"명사 teacher(선생님)를 꾸미고 kind(친절한)와 나란하니 형용사.","wy":"warmly(따뜻하게): 부사라 명사를 꾸밀 수 없음."}]}],"comp":[{"no":"22","slots":[["weighing","","","cubes(큐브들)를 꾸미는 분사다."],["much","","","비교급 more complicated(더 복잡한)를 강조한다."],["measure_v","","","주어 we(우리)의 진짜 동사다."],["simple","","","명사 estimation(추정)을 꾸미는 형용사다."],["existing","existed","a","exist(존재하다)는 목적어가 없는 동사라 '당하는' p.p.가 될 수 없다. 속성이 스스로 존재하니 -ing."]],"opts":["exist","exists","existence","existing"],"or":["exist(존재하다): 동사원형이라 전치사 of(~의) 뒤에서 명사를 꾸미는 자리에 못 옴.","exists(존재하다, 3인칭 단수형): 동사라 명사 앞 꾸밈말 자리에 못 오고, 동사도 겹침.","existence(존재): 명사라 부사 independently(독립적으로)의 꾸밈을 받을 수 없음.","existing(존재하는): exist(존재하다)는 목적어 없이 스스로 하는 동사라 -ing로 명사 properties(속성들)를 꾸며서 맞음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Measurement is not a simple and unmediated estimation of independently existing properties.","ko":"측정은 독립적으로 존재하는 속성들을 단순하고 직접적으로 추정하는 것이 아니다.","hl":["independently existing properties"],"khl":["독립적으로 존재하는 속성들"],"blocks":[{"t":"p","h":"당할 수 없는 동사","x":["exist(존재하다), happen(일어나다), appear(나타나다)는 목적어가 없는 동사다.","목적어가 없으니 누구에게 '당하는' 일도 없다.","그래서 수동 p.p.로 명사를 꾸밀 수 없다.","properties(속성들)는 스스로 존재한다. 그러니 existing(존재하는).","independently(독립적으로)는 existing(존재하는)을 꾸미는 부사다."]},{"t":"pair","h":"쉬운 예시","x":[["We need to fix the existing problems.","우리는 기존에 있는 문제들을 고쳐야 한다. (existing = 존재하는)"],["The accident happened last night.","그 사고는 어젯밤에 일어났다. (happen(일어나다)은 수동 불가)"]]}],"post":["independently existing properties(독립적으로 존재하는 속성들): exist(존재하다)는 p.p. 불가"]},{"no":"22","slots":[["to_determine","","","진짜 동사 might put(놓을 수도 있다) 앞의 목적 to부정사다."],["complicated","","","get(되다) 뒤 상태를 나타내는 형용사다."],["to_measure","","","want(원하다) + to부정사."],["use","","","measure(측정하다)와 and(그리고)로 나란한 동사원형이다."],["those","that","a","뒤의 values(값들)가 복수다. that(그)은 단수 명사 앞에만 쓰니 those(그 ~들)여야 한다."]],"opts":["this","it","they","those"],"or":["this(이): 단수 명사 앞에만 쓰는 말이라 복수 values(값들)와 안 맞음.","it(그것): 대명사라 뒤에 명사 values(값들)를 꾸밀 수 없음.","they(그것들은): 주격 대명사라 명사 앞에서 꾸미지 못하고, use(사용하다)의 목적어 자리에도 못 옴.","those(그 ~들): 복수 명사 values(값들) 앞에서 꾸며 주는 지시형용사라 맞음."],"point":"대명사의 성·수·격 일치","en":"we measure other quantities and use those values, together with certain equations, to calculate the mass.","ko":"우리는 다른 양들을 측정하고, 그 값들을 특정 방정식들과 함께 사용하여 질량을 계산한다.","hl":["those values","other quantities"],"khl":["그 값들을","다른 양들을"],"blocks":[{"t":"p","h":"손가락 개수 맞추기","x":["those(그 ~들)는 여러 개를 가리키는 손가락이다.","가리키는 것은 앞에서 측정한 other quantities(다른 양들)의 값들, 즉 여러 개.","그래서 values(값들)에 s가 붙고, 앞에는 those(그 ~들).","that(그)은 하나만 가리키는 손가락이다."]},{"t":"pair","h":"쉬운 예시","x":[["Look at those stars.","저 별들을 봐. (복수 stars(별들) ← those)"],["Look at that star.","저 별을 봐. (단수 star(별) ← that)"]]}],"post":["those values(그 값들): 복수 명사 앞은 those(그 ~들)"]}],"compquiz":[{"s":"We must solve the ___ problems first.","o":["existing","existed"],"a":0,"ko":"우리는 기존의 문제들을 먼저 해결해야 한다.","why":"exist(존재하다)는 목적어가 없는 동사라 p.p.가 될 수 없고 -ing로 꾸민다.","wy":"existed(존재했다): exist(존재하다)는 '당하는' 뜻이 없어 p.p.로 명사를 꾸밀 수 없음."},{"s":"Look at ___ birds in the tree.","o":["that","those"],"a":1,"ko":"나무에 있는 저 새들을 봐.","why":"birds(새들)가 복수라 those(저 ~들).","wy":"that(저): 단수 명사 앞에만 쓰는 말이라 복수 birds(새들)와 안 맞음."}]},{"id":"2410g2-23","no":"23","title":"어법특훈 · 24년 10월 고2 23번","sub":"고통과 쾌락의 저울","tpl":"Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain. Our bodies {constantly|constantly} {strive|strive} for homeostasis, {which|which} {is_defined|is defined} as the balance of bodily functions. Without the body’s effective compensatory mechanisms, which may cushion {potential|potential} highs and lows, we would not be capable of {surviving|surviving}. Pleasure and pain are like two sides of the same coin; they {seem|seem} to work together and are {heavily|heavily} reliant on one another and {keep|keep} balance. If you imagine pleasure and pain as the two opposite points on a scale, you can {easily|easily} understand {that|that} as one of the two points {rises|rises}, the other must {correspondingly|correspondingly} fall. We’ve all heard the expression, “No pain, no gain.” Well, according to psychiatrist Dr. Anna Lembke, there may be some truth to these words. She says that our attempts to escape {being|being} miserable {are|are} in fact making us {even|even} more {miserable|miserable}. This is {because|because} pain is actually an {essential|essential} component of our ability to maintain a neutral state, and {allowing|allowing} it will in turn reset our internal scale back to balance.","fn":["*homeostasis: 항상성(몸 상태를 일정하게 유지하려는 성질)","*compensatory mechanism: 보상 기제(부족하거나 넘치는 것을 메워 주는 장치)","*cushion: (충격을) 완화하다","*psychiatrist: 정신과 의사"],"mean":{"very":"매우(원급을 꾸미는 부사, 비교급은 못 꾸밈)","so":"그렇게, 매우(원급을 꾸미는 부사)","too":"너무(원급을 꾸미는 부사)","quite":"꽤(원급을 꾸미는 부사)","constantly":"끊임없이(부사)","strive":"노력하다, 추구하다(동사원형·복수 주어 현재형)","which":"그리고 그것은, ~하는(사물을 받는 관계대명사, 콤마 뒤 가능)","that":"~라는 것(명사절 접속사) / ~하는(관계대명사, 콤마 뒤 불가)","what":"~하는 것(선행사를 품은 관계대명사)","who":"~하는(사람을 받는 관계대명사)","where":"~하는 곳(장소를 받는 관계부사)","whom":"~을(사람을 받는 목적격 관계대명사)","whose":"~의(소유격 관계대명사)","is defined":"정의된다(define의 현재 수동형)","defines":"정의하다(define의 3인칭 단수 현재형)","is defining":"정의하고 있다(define의 현재진행형)","define":"정의하다(동사원형·복수 주어 현재형)","defining":"정의하는, 정의하는 것(define의 -ing형)","potential":"잠재적인(형용사)","potentially":"잠재적으로(부사)","potentiality":"잠재력, 가능성(명사)","potentials":"잠재력들(potential의 명사 복수형)","potently":"강력하게(부사)","surviving":"살아남는 것(survive의 -ing형, 동명사)","survive":"살아남다(동사원형)","survived":"살아남았다(survive의 과거형·과거분사형)","survives":"살아남다(survive의 3인칭 단수 현재형)","to survive":"살아남는 것(survive의 to부정사)","seem":"~처럼 보이다(동사원형·복수 주어 현재형)","heavily":"크게, 심하게(부사)","heavy":"무거운, 심한(형용사)","heaviness":"무거움(명사)","heavier":"더 무거운(heavy의 비교급)","heaviest":"가장 무거운(heavy의 최상급)","keep":"유지하다(동사원형·복수 주어 현재형)","easily":"쉽게(부사)","rises":"올라가다(rise의 3인칭 단수 현재형)","rise":"올라가다(동사원형·복수 주어 현재형)","rising":"올라가는(rise의 -ing형)","risen":"올라간(rise의 과거분사형)","raises":"~을 올리다(raise의 3인칭 단수 현재형, 목적어가 필요)","correspondingly":"그에 맞춰, 상응하여(부 ["homeostasis, which"],"khl":["항상성은"],"blocks":[{"t":"p","h":"콤마는 that(~하는)이 못 넘는 벽","x":["콤마 뒤에서 앞 명사를 한 번 더 설명하는 방식을 '계속적 용법'이라 한다.","\"~인데, 그것은 ~이다\"처럼 말을 이어 붙이는 느낌이다.","이 자리에는 which(그리고 그것은)나 who(그리고 그 사람은)만 온다.","that(~하는)은 콤마라는 벽을 넘지 못한다.","콤마 + that이 보이면 바로 틀린 것으로 의심한다."]},{"t":"pair","h":"쉬운 예시","x":[["I read the book, which was very funny.","나는 그 책을 읽었는데, 그 책은 아주 웃겼다. (콤마 + which)"],["This is the book that I read.","이것이 내가 읽은 책이다. (콤마 없음 → that 가능)"]]}],"post":["콤마 + which(그리고 그것은) 가능, 콤마 + that(~하는) 불가"]},{"slots":[["is_defined","","","항상성은 '정의되는' 쪽이라 수동 is defined(정의된다)가 맞다."],["potential","","","명사 highs and lows(오르내림)를 꾸미는 형용사다."],["surviving","survive","a","capable of(~할 수 있는)의 of는 전치사다. 전치사 뒤에 동사를 쓰려면 -ing."],["keep","","","주어 they(그것들)의 동사로, seem(~처럼 보이다), are(~이다)와 and(그리고)로 나란하다."],["correspondingly","","","동사 fall(내려가다)을 꾸미는 부사다."]],"opts":["survived","survives","surviving","to survive"],"or":["survived(살아남았다): 과거형이나 p.p.는 전치사 뒤 명사 자리에 못 옴.","survives(살아남다, 3인칭 단수형): 동사라 전치사 of(~의) 뒤에 그대로 올 수 없음.","surviving(살아남는 것): 전치사 of(~의) 뒤라 동명사가 맞음.","to survive(살아남는 것): 전치사 of(~의) 뒤에는 to부정사가 못 옴."],"point":"전치사 + 동명사","en":"Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.","ko":"잠재적인 오르내림을 완화해 줄 수 있는 몸의 효과적인 보상 기제가 없다면, 우리는 생존할 수 없을 것이다.","hl":["capable of surviving"],"khl":["생존할 수 없을 것이다"],"blocks":[{"t":"p","h":"전치사는 명사만 태우는 버스","x":["of(~의), in(~안에), at(~에), for(~를 위해), without(~없이)은 전치사다.","전치사 버스에는 명사만 탈 수 있다.","동사 survive(살아남다)가 타려면 -ing 옷을 입고 명사처럼 변신해야 한다.","be capable of -ing(~할 수 있다). 통째로 외워 둔다."]},{"t":"pair","h":"쉬운 예시","x":[["She is good at singing.","그녀는 노래를 잘한다. (at singing = 노래하는 것에)"],["Thank you for coming.","와 줘서 고마워. (for coming = 와 준 것에 대해)"]]}],"post":["capable of surviving(생존할 수 있는): 전치사 뒤 -ing"]},{"slots":[["heavily","","","형용사 reliant(의존하는)를 꾸미니 부사가 맞다."],["easily","","","동사 understand(이해하다)를 꾸미는 부사다."],["that","what","a","뒤 문장 the other must correspondingly fall(다른 하나는 그에 맞춰 내려간다)이 완전하다. 완전한 문장을 목적어로 묶을 땐 what(~하는 것)이 아니라 that(~라는 것)."],["rises","","","one of the two points(두 지점 중 하나)의 주인은 one(하나)이라 rises(올라가다)."],["even","","","비교급 more miserable(더 비참한)을 강조하는 even(훨씬)이다."]],"opts":["which","that","whom","whose"],"or":["which(어느 것): 뒤 문장에 빈자리가 있어야 하는데 the other must fall(다른 하나는 내려간다)은 완전함.","that(~라는 것): understand(이해하다)의 목적어로 완전한 문장을 이끄는 접속사라 맞음.","whom(~을): 사람을 받는 관계대명사라 앞에 사람 명사가 있어야 하고 뒤 문장도 빠진 게 없음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 as(~할 때)가 와서 안 됨."],"point":"that vs. what","en":"you can easily understand that as one of the two points rises, the other must correspondingly fall.","ko":"두 지점 중 하나가 올라갈 때 다른 하나는 그에 맞춰 내려갈 수밖에 없다는 것을 쉽게 이해할 수 있다.","hl":["understand that","the other must correspondingly fall"],"khl":["내려갈 수밖에 없다는 것을","이해할 수 있다"],"blocks":[{"t":"p","h":"중간 덩어리를 잠깐 치우기","x":["that(~라는 것) 바로 뒤의 as ~ rises(~가 올라갈 때)는 시간을 알려 주는 덩어리다.","그 덩어리를 손으로 가리면 the other must correspondingly fall(다른 하나는 그에 맞춰 내려간다)이 남는다.","주어 the other(다른 하나), 동사 fall(내려가다). 빠진 것이 없다.","빠진 것 없는 문장을 묶는 건 that(~라는 것).","what(~하는 것)은 뒤 문장에 빈자리가 있을 때만 쓴다."]},{"t":"pair","h":"쉬운 예시","x":[["I know that you are tired.","나는 네가 피곤하다는 것을 안다. (완전한 문장 → that)"],["I know what you want.","나는 네가 원하는 것을 안다. (want(원하다)의 목적어 빈자리 → what)"]]},{"t":"tap","h":"확인 질문","q":"as one of the two points rises(두 지점 중 하나가 올라갈 때)를 가리면 남는 문장은 완전한가?","a":["완전하다. the other(다른 하나)가 주어, must fall(내려가야 한다)이 동사.","그래서 that(~라는 것)."]}],"post":["understand that(~라는 것을 이해하다) + 완전한 문장, 끼어든 as(~할 때)절은 가리고 판단"]},{"slots":[["rises","","","주인 one(하나)이 단수라 rises(올라가다)."],["being","","","escape(벗어나다)는 -ing를 목적어로 받는다."],["are","is","a","주어는 our attempts(우리의 시도들)다. to escape being miserable(비참함에서 벗어나려는)은 꾸미는 말이라 복수 동사 are(~이다)."],["miserable","","","make(만들다) + 목적어 + 형용사. 우리의 상태를 말하는 형용사 miserable(비참한)."],["essential","","","명사 component(구성 요소)를 꾸미는 형용사다."]],"opts":["are","was","being","has"],"or":["are(~이다): 주어 our attempts(우리의 시도들)가 복수라 맞고, 뒤 making(만들고 있는)과 현재진행형을 이룸.","was(~였다): 단수 동사라 복수 attempts(시도들)와 안 맞음.","being(~인 것): -ing는 혼자 동사 자리에 못 와서 that절에 동사가 없어짐.","has(가지고 있다): 단수 주어용이고, has making(가지고 있다 + 만드는)은 말이 안 됨."],"point":"수식받는 주어의 수일치","en":"She says that our attempts to escape being miserable are in fact making us even more miserable.","ko":"그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다.","hl":["our attempts","are in fact making"],"khl":["우리의 시도가","만들고 있다고"],"blocks":[{"t":"p","h":"주인 찾기: 긴 꼬리 자르기","x":["that(~라고) 뒤 문장의 주인은 our attempts(우리의 시도들).","to escape being miserable(비참함에서 벗어나려는)은 attempts(시도들)에 달린 긴 꼬리다.","꼬리 끝의 miserable(비참한)이 동사 바로 앞에 있어 헷갈리게 만든다.","꼬리를 자르면 our attempts are making(우리의 시도들이 만들고 있다)이 남는다."]},{"t":"pair","h":"쉬운 예시","x":[["The plans to visit the museum are exciting.","박물관을 방문하려는 계획들은 신난다. (주인 plans(계획들) → are)"],["The key to the doors is lost.","그 문들의 열쇠가 없어졌다. (주인 key(열쇠) → is)"]]}],"post":["꼬리(to escape being miserable = 비참함에서 벗어나려는) 자르고 attempts(시도들) are(~이다)"]},{"slots":[["strive","","","주어 Our bodies(우리 몸)가 복수라 strive(추구하다)."],["seem","","","주어 they(그것들)가 복수라 seem(~처럼 보이다)."],["correspondingly","","","동사 fall(내려가다)을 꾸미는 부사."],["because","","","뒤에 주어 pain(고통) + 동사 is(~이다)가 오니 접속사 because(~때문에)."],["allowing","allow","a","and(그리고) 뒤 문장의 진짜 동사는 will reset(다시 맞출 것이다)이다. 앞은 주어 자리라 동명사 allowing(허용하는 것)이어야 한다."]],"opts":["allowed","allowing","allows","allowance"],"or":["allowed(허용했다, 허용된): 과거형으로 보면 will reset(다시 맞출 것이다)과 동사가 겹치고, p.p.로 보면 목적어 it(그것)을 가질 수 없음.","allowing(허용하는 것): will reset(다시 맞출 것이다) 앞 주어 자리이고 뒤에 목적어 it(그것)을 가지는 동명사라 맞음.","allows(허용하다, 3인칭 단수형): 주어도 없이 동사가 생기고 will reset(다시 맞출 것이다)과 겹침.","allowance(용돈, 허용량): 명사라 뒤에 목적어 it(그것)을 가질 수 없음."],"point":"정동사 vs. 준동사","en":"and allowing it will in turn reset our internal scale back to balance.","ko":"그리고 고통을 허용하는 것이 결과적으로 우리 내부의 저울을 다시 균형 상태로 맞춰 줄 것이다.","hl":["allowing it","will in turn reset"],"khl":["허용하는 것이","맞춰 줄 것이다"],"blocks":[{"t":"p","h":"엔진 자리와 주인 자리","x":["and(그리고) 뒤 문장의 엔진(진짜 동사)은 will reset(다시 맞출 것이다).","엔진 앞은 주인(주어) 자리다." for homeostasis, which is defined as the balance of bodily functions.","ko":"우리 몸은 끊임없이 항상성을 추구하는데, 항상성은 신체 기능들의 균형으로 정의된다.","hl":["which is defined as"],"khl":["정의된다"],"blocks":[{"t":"p","h":"하는 쪽인가, 당하는 쪽인가","x":["which(그것은)가 가리키는 건 homeostasis(항상성).","항상성이 무언가를 정의하나? 아니다. 사람들이 항상성을 정의한다.","항상성은 정의를 '당하는' 쪽이니 be + p.p.","목적어 확인: define(정의하다) 뒤에 목적어 없이 as(~로)가 바로 온다.","목적어가 없으면 수동태라는 신호다."]},{"t":"pair","h":"쉬운 예시","x":[["English is spoken in many countries.","영어는 많은 나라에서 말해진다. (영어가 '말해지는' 쪽)"],["A friend is defined as a person you trust.","친구는 네가 믿는 사람으로 정의된다. (be defined as = ~로 정의되다)"]]}],"post":["be defined as(~로 정의되다): 목적어 없으면 수동"]},{"slots":[["strive","","","주어 Our bodies(우리 몸)가 복수라 strive(추구하다)."],["potential","potentially","a","뒤의 highs and lows(오르내림)는 명사다. 명사를 꾸미는 건 형용사 potential(잠재적인)."],["seem","","","주어 they(그것들)가 복수라 seem(~처럼 보이다)."],["that","","","understand(이해하다)의 목적어로 완전한 문장을 이끄는 that(~라는 것)."],["being","","","escape(벗어나다)는 -ing를 목적어로 받는다."]],"opts":["potentiality","potentials","potential","potently"],"or":["potentiality(잠재력): 명사라 뒤 명사 highs and lows(오르내림)를 꾸밀 수 없음.","potentials(잠재력들): 명사 복수형이라 다른 명사 앞에서 꾸미는 말이 될 수 없음.","potential(잠재적인): 명사 highs and lows(오르내림)를 꾸미는 형용사라 맞음.","potently(강력하게): 부사라 명사를 꾸밀 수 없고 뜻도 안 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.","ko":"잠재적인 오르내림을 완화해 줄 수 있는 몸의 효과적인 보상 기제가 없다면, 우리는 생존할 수 없을 것이다.","hl":["potential highs and lows"],"khl":["잠재적인 오르내림을"],"blocks":[{"t":"p","h":"highs and lows(오르내림)는 명사","x":["high(높은), low(낮은)는 원래 형용사다.","하지만 s가 붙은 highs and lows(오르내림)는 명사다. '높을 때와 낮을 때'라는 뜻.","명사 앞에서 꾸미는 말은 형용사.","cushion(완화하다) + 목적어 potential highs and lows(잠재적인 오르내림).","s가 붙은 걸 보고 명사인 줄 알아채는 게 핵심이다."]},{"t":"pair","h":"쉬운 예시","x":[["Life has its ups and downs.","인생에는 좋은 일과 나쁜 일이 있다. (ups and downs(오르내림)는 명사)"],["She is a possible winner.","그녀는 우승 가능성이 있는 사람이다. (명사 winner(우승자) ← 형용사)"]]}],"post": ssible for the animal to associate each place with {what_b|what} happened to it there. The animal’s preference for {being|being} in one place or another {is_measured|is measured} both before and after its experiences in the two places. If there is a shift in where the animal chooses {to_spend|to spend} its time for the reward, this suggests that it liked the experience and {is_trying|is trying} to repeat it. Conversely, if it now avoids the place the stimulus appeared and {starts|starts} to prefer the place it did not experience it, then this suggests that it found the stimulus {unpleasant|unpleasant}. For example, mice with cancer show a preference for the place {where|where} they have been given morphine, a drug {used|used} to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference. This {suggests|suggests} {that_c|that} the mice with cancer wanted the morphine.","fn":["*stimulus: 자극","*saline: 식염수"],"mean":{"finding":"알아내는 것(find의 -ing형, 동명사)","find":"찾다, 알아내다(동사원형)","to find":"알아내는 것, 알아내기 위해(find의 to부정사)","found":"알아냈다(find의 과거형·과거분사형)","finds":"알아내다(find의 3인칭 단수 현재형)","what":"~하는 것(선행사를 품은 관계대명사)","that":"~라는 것(명사절 접속사) / ~하는(관계대명사)","whether":"~인지 아닌지(접속사)","why":"왜 ~하는지(의문사)","how":"어떻게 ~하는지(의문사)","which":"~하는(관계대명사, 앞에 꾸밀 명사가 필요)","whose":"~의(소유격 관계대명사)","whom":"~을(목적격 관계대명사)","who":"~하는(사람을 받는 관계대명사)","where":"~하는 곳(장소를 받는 관계부사)","to associate":"연관시키는 것, 연관시키도록(associate의 to부정사)","associate":"연관시키다(동사원형)","associating":"연관시키는 것, 연관시키는(associate의 -ing형)","associated":"연관시켰다(associate의 과거형) / 연관된(과거분사형)","associates":"연관시키다(associate의 3인칭 단수 현재형)","completely":"완전히(부사)","are made":"만들어진다(make의 현재 수동형, 복수 주어)","is made":"만들어진다(make의 현재 수동형, 단수 주어)","make":"만들다(동사원형·복수 주어 현재형)","makes":"만들다(make의 3인칭 단수 현재형)","making":"만드는 것, 만드는(make의 -ing형)","made":"만들었다(make의 과거형) / 만들어진(과거분사형)","obviously":"명백히, 눈에 띄게(부사)","easy":"쉬운(형용사)","easily":"쉽게(부사)","easier":"더 쉬운(easy의 비교급)","easiest":"가장 쉬운(easy의 최상급)","ease":"쉬 "ko":"그것은 갑작스러운 번식 기회를 최대한으로 활용하기 위한 것이다.","hl":["for making the most of"],"khl":["최대한으로 활용하기 위한"],"blocks":[{"t":"p","h":"덩어리 표현 통째로 외우기","x":["make the most of(~을 최대한 활용하다)는 한 덩어리 표현이다.","전치사 for(~을 위한) 뒤에 이 덩어리가 오려면 make(만들다)가 making(만드는 것)으로 바뀐다.","덩어리 안의 다른 부분 the most of(최대한)는 그대로 둔다.","비가 오면 바로 번식을 시작하는 이유가 바로 이것이다."]},{"t":"pair","h":"쉬운 예시","x":[["This bag is for carrying books.","이 가방은 책을 나르기 위한 것이다. (for(~을 위한) + carrying(나르는 것))"],["He is famous for telling jokes.","그는 농담을 잘하는 것으로 유명하다. (for(~로) + telling(말하는 것))"]]}],"post":["for(~을 위한) + -ing: for making the most of(~을 최대한 활용하기 위한)"]}],"compquiz":[{"s":"It was a ___ hot day.","o":["terrible","terribly"],"a":1,"ko":"몹시 더운 날이었다.","why":"형용사 hot(더운)을 꾸미니 부사.","wy":"terrible(끔찍한): 형용사라 다른 형용사 hot(더운)을 꾸밀 수 없음."},{"s":"He is interested in ___ cookies.","o":["bake","baking"],"a":1,"ko":"그는 쿠키 굽는 것에 관심이 있다.","why":"전치사 in(~에) 뒤는 -ing.","wy":"bake(굽다): 전치사 in(~에) 뒤에 동사원형은 못 옴."}]},{"id":"2410g2-33","no":"33","title":"어법특훈 · 24년 10월 고2 33번","sub":"읽기의 경계는 어디인가","tpl":"Some people argue {that_a|that} there is a single, {logically|logically} consistent concept {known|known} as reading that can be {neatly|neatly} set apart from everything else people {do|do} with books. Is reading really that simple? The most productive way {to_think|to think} about reading {is_b|is} as a loosely {related|related} set of behaviors that {belong|belong} together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without {having|having} in common a single defining trait. Consequently, efforts to distinguish reading from nonreading {are_destined|are destined} to fail because there is no agreement on {what|what} qualifies as reading in the first place. The more one {tries|tries} to figure out where the border lies between reading and not-reading, {the_more|the more} edge cases will be found to stretch the term’s flexible boundaries. Thus, it is worth {attempting|attempting} to collect together these exceptional forms of reading into a single forum, one highlighting the challenges {faced|faced} by anyone wishing to establish the boundaries {where|where} reading begins and ends. The attempt moves toward an understanding of reading as a spectrum {that_c|that} is expansive enough {to_accommodate|to accommodate} the distinct reading activities.","fn":["*family resemblance: 가족 유사성","*forum: 토론의 장","*spectrum: 스펙트럼, 범위"],"mean":{"that":"~라는 것(명사절 접속사) / ~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","which":"~하는(관계대명사, 앞에 꾸밀 명사가 필요)","whose":"~의(소유격 관계대명사)","whom":"~을(목적격 관계대명사)","who":"~하는(사람을 받는 관계대명사)","how":"어떻게 ~하는지(의문사)","where":"~하는 곳(관계부사) / 어디에(의문사)","logically":"논리적으로(부사)","known":"알려진(know의 과거분사형)","knowing":"아는(know의 -ing형)","knows":"알다(know의 3인칭 단수 현재형)","knew":"알았다(know의 과거형)","be known":"알려지다(know의 수동 원형)","neatly":"깔끔하게(부사)","neat":"깔끔한(형용사)","neatness":"깔끔함(명사)","neater":"더 깔끔한(neat의 비교급)","neatest":"가장 깔끔한(neat의 최상급)","do":"하다(동사원형·복수 주어 현재형)","to think":"생각하는, 생각할(think의 to부정사)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","being":"~인 것, ~인(be의 -ing형)","to be":"~인 것(be의 to부정사)","be":"~이다(동사원형)","related":"연결된, 관련된(relate의 과거분사형)","belong":"속하다(동사원형·복수 주어 현재형)","belongs":"속하다(belong의 3인칭 단수 현재형)","belonging":"속하는(belong의 -ing형)","to belong":"속하는 것(belong의 to부정사)","has belonged":"속해 왔다(belong의 현재완료형, 단수 주어)","having":"가지는 것(have의 -ing형, 동명사)","have":"가지다(동사원형)","to have":"가지는 것(have의 to부정사)","had":"가졌다(have의 과거형·과거분사형)","has":"가지다(have의 3인칭 단수 현재형)","are destined":"~할 운명이다(destine의 수동형, 복수 주어)","tries":"애쓰다, 노력하다(try의 3인칭 단수 현재형)","the more":"더 ~할수록 더(the + 비교급)","more":"더 많은(many·much의 비교급)","the most":"가장 많은(최상급)","the many":"그 많은(the + many)","most":"대부분의, 가장 많은(최상급)","attempting":"시도하는 것(attempt의 -ing형, 동명사)","to attempt":"시도하는 것(attempt의 to부정사)","attempt":"시도(명사) / 시도하다(동사원형)","attempted":"시도했다(attempt의 과거형·과거분사형)","attempts":"시도들(명사 복수) / 시도하다(3인칭 단수 현재형)","faced":"마주하게 되는(face의 과거분사형)","facing":"마주하는(face의 -ing형)","face":"마주하다(동사원형) / 얼굴(명사)","faces":"마주하다(face의 3인칭 단수 현재형)","has faced":"마주해 왔다(face의 현재완료형)","to accommodate":"수용할(accommodate의 to부정사)","accommodating":"수용하는(accommodate의 -ing형)","accommodate":"수용하다(동사원형)","accommodated":"수용했다(accommodate의 과거형) / 수용된(과거분사형)","accommodates":"수용하다(accommodate의 3인칭 단수 현재형)","spoken":"말해지는, 쓰이는(speak의 과거분사형)","speaking":"말하는(speak의 -ing형)","wearing":"입는 것(wear의 -ing형, 동명사)","wear":"입다(동사원형)","watching":"보는 것(watch의 -ing형, 동명사)","to watch":"보는 것(watch의 to부정사)","like":"좋아하다(동사원형·복수 주어 현재형)","likes":"좋아하다(like의 3인칭 단수 현재형)","the better":"더 잘(the + 비교급)","better":"더 잘, 더 좋은(well·good의 비교급)","to reach":"닿을(reach의 to부정사)","reaching":"닿는(reach의 -ing형)"},"sets":[{"items":[{"slots":[["that_a","what","a","there is a single concept(하나의 개념이 있다)은 빠진 것 없는 완전한 문장이다. 완전한 문장을 이끄는 건 that(~라는 것)."],["neatly","","","과거분사 set apart(분리되는)를 꾸미는 부사다."],["related","","","set(묶음)이 \"연결된\" 쪽이라 과거분사."],["tries","","","주어 one(사람, 누군가)이 단수라 s."],["that_c","","","선행사 a spectrum(스펙트럼) 뒤, is(~이다)의 주어가 빠진 관계대명사 that(~하는)."]],"opts":["which","whose","whom","that"],"or":["which(~하는): 뒤에 빈자리가 있어야 하는데 there is a single concept(하나의 개념이 있다)은 완전함.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 there(~이 있다)가 옴.","whom(~을): 목적어 빈자리가 있어야 하는데 없고, 앞에 받을 사람 명사도 없음.","that(~라는 것): argue(주장하다)의 목적어로 완전한 문장을 이끄는 접속사라 맞음."],"point":"that vs. what","en":"Some people argue that there is a single, logically consistent concept known as reading.","ko":"몇몇 사람들은 읽기로 알려진, 유일하고 논리적으로 일관성 있는 개념이 있다고 주장한다.","hl":["argue that there is"],"khl":["개념이 있다고 주장한다"],"blocks":[{"t":"p","h":"뒤 문장 부품 검사","x":["there is(~이 있다) + a single concept(하나의 개념).","\"무엇이 있다\"가 완성됐다. 빠진 부품이 없다.","what(~하는 것)은 뒤에 빈자리가 있을 때만 들어간다.","빈자리 없는 문장을 통째로 목적어로 쓸 땐 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I think that it will rain.","나는 비가 올 거라고 생각한다. (뒤가 완전 → that)"],["I know what you did.","나는 네가 한 일을 안다. (did(했다) 뒤가 빔 → what)"]]}],"post":["argue that(~라고 주장하다) + 완전한 문장"]},{"slots":[["known","knowing","a","개념은 사람들에게 \"알려지는\" 쪽이다. 알려진 = p.p."],["do","","","주어 people(사람들)이 복수라 do(하다)."],["belong","","","선행사 behaviors(행동들)가 복수라 s 없는 belong(속하다)."],["what","","","전치사 on(~에 대한) 뒤, qualifies(자격이 되다)의 주어가 빠졌으니 what(~하는 것)."],["faced","","","challenges(어려움들)가 \"마주하게 되는\" 쪽이라 p.p. 뒤에 by(~에 의해)도 있다."]],"opts":["knows","knew","known","be known"],"or":["knows(알다): 접속사 없이 동사가 또 생기고, 개념이 무언가를 아는 것도 아님.","knew(알았다): 과거형 동사라 명사를 뒤에서 꾸밀 수 없음.","known(알려진): 개념이 알려지는 쪽이라 명사 concept(개념)를 뒤에서 꾸미는 과거분사가 맞음.","be known(알려지다): 동사원형 be가 명사 뒤에 그대로 올 수 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Some people argue that there is a single, logically consistent concept known as reading.","ko":"몇몇 사람들은 읽기로 알려진, 유일하고 논리적으로 일관성 있는 개념이 있다고 주장한다.","hl":["concept known as reading"],"khl":["읽기로 알려진"],"blocks":[{"t":"p","h":"꾸밈받는 명사에게 물어보기","x":["concept(개념)에게 묻는다: 너는 아니, 알려지니?","개념은 사람들에게 알려진다.","알려지는 쪽이니 p.p. known(알려진).","be known as(~로 알려지다)에서 be가 빠지고 known(알려진)만 남은 모양이다."]},{"t":"pair","h":"쉬운 예시","x":[["He is a singer known as K.","그는 K로 알려진 가수다. (가수는 알려지는 쪽)"],["I met a man knowing three languages.","나는 세 언어를 아는 남자를 만났다. (남자가 아는 쪽)"]]}],"post":["개념은 알려지는 쪽: concept known as reading(읽기로 알려진 개념)"]},{"slots":[["logically","","","형용사 consistent(일관성 있는)를 꾸미는 부사."],["is_b","are","a","주인은 The most productive way(가장 생산적인 방식), 하나다. to think about reading(읽기에 대해 생각하는)은 꼬리표."],["having","","","전치사 without(~없이) 뒤 동명사."],["the_more","","","앞의 The more(더 ~할수록)와 짝을 맞춘 the more(더 ~한다)."],["where","","","선행사 the boundaries(경계들) 뒤, 뒤 문장이 완전하니 where(~하는 곳)."]],"opts":["is","being","to be","be"],"or":["is(~이다): 주어 The most productive way(가장 생산적인 방식)가 단수라 맞음.","being(~인 것): -ing는 혼자 동사 자리에 못 와서 진짜 동사가 없어짐.","to be(~인 것): to부정사도 동사 자리에 못 옴.","be(~이다): 동사원형은 주어 뒤 현재형 동사 자리에 못 옴."],"point":"수식받는 주어의 수일치","en":"The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances.","ko":"읽기에 대해 생각하는 가장 생산적인 방식은 가족 유사성 때문에 함께 속하게 되는 헐겁게 연결된 행동의 묶음으로서이다.","hl":["The most productive way","is"],"khl":["가장 생산적인 방식은","묶음으로서이다"],"blocks":[{"t":"p","h":"꼬리표 떼고 주인 찾기","x":["주인: The most productive way(가장 생산적인 방식). 하나다.","꼬리표: to think about reading(읽기에 대해 생각하는).","꼬리표 끝의 reading(읽기)에 끌려도 상관없다. 주인이 하나다.","그래서 is(~이다)."]},{"t":"pair","h":"쉬운 예시","x":[["The best way to make friends is to smile.","친구를 사귀는 가장 좋은 방법은 웃는 것이다. (주인 way(방법) → is)"],["The time to eat lunch is noon.","점심 먹을 시간은 정오다. (주인 time(시간) → is)"]]}],"post":["꼬리표(to think about reading = 읽기에 대해 생각하는) 떼고 주인 way(방식) 보고 is(~이다)"]},{"slots":[["do","","","주어 people(사람들)이 복수."],["to_think","","","명사 way(방식)를 뒤에서 꾸미는 to부정사(생각하는)."],["having","have","a","without(~없이)은 전치사다. 전치사 뒤에 동사를 쓰려면 -ing."],["are_destined","","","주어 efforts(노력들)가 복수라 are. be destined to(~할 운명이다)."],["attempting","","","be worth -ing(~할 가치가 있다)."]],"opts":["to have","having","had","has"],"or":["to have(가지는 것): 전치사 without(~없이) 뒤에는 to부정사가 못 옴.","having(가지는 것): 전치사 without(~없이) 뒤라 동명사가 맞음.","had(가졌다): 과거형·과거분사형은 전치사 뒤에서 명사 역할을 못 함.","has(가지다): s 붙은 동사는 전치사 뒤에 그대로 못 옴."],"point":"전치사 + 동명사","en":"The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait.","ko":"읽기에 대해 생각하는 가장 생산적인 방식은 하나의 명백한 특성을 공통적으로 가지지 않은 채 Ludwig Wittgenstein(루트비히 비트겐슈타인)이 그 어구를 사용한 것처럼 가족 유사성 때문에 함께 속하게 되는 헐겁게 연결된 행동의 묶음으로서이다.","hl":["without having in common"],"khl":["공통적으로 가지지 않은 채"],"blocks":[{"t":"p","h":"자리가 바뀐 목적어","x":["원래 순서: having a single defining trait in common(하나의 명백한 특성을 공통으로 가지는 것).","목적어가 길어서 in common(공통으로)이 앞으로 나왔다.","순서가 바뀌어도 without(~없이) 바로 뒤 having(가지는 것)의 모양은 그대로다.","전치사 without(~없이) 뒤 = -ing."]},{"t":"pair","h":"쉬운 예시","x":[["He left without saying goodbye.","그는 작별 인사 없이 떠났다. (without(~없이) + saying(말하는 것))"],["I can’t live without having coffee.","나는 커피를 마시지 않고는 못 산다. (without(~없이) + having(마시는 것))"]]}],"post":["without(~없이) + -ing: without having in common(공통으로 가지지 않은 채)"]},{"slots":[["known","","","개념이 알려지는 쪽이라 p.p."],["related","","","set(묶음)이 연결된 쪽이라 p.p."],["tries","","","단수 주어 one(사람)의 동사."],["attempting","to attempt","a","be worth(~할 가치가 있다) 뒤에는 -ing만 온다. to부정사는 안 된다."],["to_accommodate","","","형용사 + enough(충분히) + to부정사(~할 만큼 충분히 ~한)."]],"opts":["attempt","attempted","attempts","attempting"],"or":["attempt(시도, 시도하다): 관사 없는 명사이거나 동사원형이라 worth(~의 가치가 있는) 뒤에 바로 올 수 없음.","attempted(시도했다, 시도된): 과거형·과거분사형은 worth(~의 가치가 있는) 뒤에 못 옴.","attempts(시도들, 시도하다): 뒤의 to collect(모으는 것)와 이어지지 않고, worth(~의 가치가 있는) 뒤 -ing 자리에 안 맞음.","attempting(시도하는 것): be worth(~할 가치가 있다) 뒤라 동명사가 맞음."],"point":"동명사 관용 표현(be worth -ing)","en":"Thus, it is worth attempting to collect together these exceptional forms of reading into a single forum.","ko":"그러므로, 이러한 예외적인 읽기의 형태들을 모두 함께 하나의 토론의 장으로 모으려는 시도는 해 볼 가치가 있다.","hl":["it is worth attempting"],"khl":["해 볼 가치가 있다"],"blocks":[{"t":"p","h":"worth(~의 가치가 있는)는 전치사처럼","x":["worth(~의 가치가 있는) 뒤에는 명사나 -ing가 온다.","be worth(~의 가치가 있다) -ing = ~할 가치가 있다.","to부정사를 넣으면 틀린다. 시험 단골 함정.","attempting to collect(모으려고 시도하는 것): attempt(시도하다) 자신은 뒤에 to부정사를 받는다."]},{"t":"pair","h":"쉬운 예시","x":[["This book is worth reading.","이 책은 읽을 가치가 있다. (worth + reading(읽는 것))"],["The museum is worth visiting.","그 박물관은 방문할 가치가 있다. (worth + visiting(방문하는 것))"]]}],"post":["be worth -ing(~할 가치가 있다): it is worth attempting(시도할 가치가 있다)"]}],"quiz":[{"s":"I think ___ he is honest.","o":["that","what"],"a":0,"ko":"나는 그가 정직하다고 생각한다.","why":"뒤 문장이 완전하니 that.","wy":"what(~하는 것): 뒤에 빈자리가 있어야 하는데 he is honest(그는 정직하다)는 완전함."},{"s":"English is a language ___ all over the world.","o":["spoken","speaking"],"a":0,"ko":"영어는 전 세계에서 쓰이는 언어다.","why":"언어는 말해지는 쪽이라 p.p.","wy":"speaking(말하는): 언어가 직접 말하는 게 아님."},{"s":"The best way to learn words ___ to read a lot.","o":["are","is"],"a":1,"ko":"단어를 배우는 가장 좋은 방법은 많이 읽는 것이다.","why":"주인 The best way(가장 좋은 방법)는 단수.","wy":"are(~이다): 복수 동사라 단수 주어 way(방법)와 안 맞음."},{"s":"He went out without ___ his coat.","o":["wearing","wear"],"a":0,"ko":"그는 외투를 입지 않고 나갔다.","why":"전 s belonged"],"or":["belonging(속하는): 관계대명사 that(~하는) 뒤 동사 자리에 -ing는 못 옴.","to belong(속하는 것): to부정사도 that(~하는) 뒤 동사 자리에 못 옴.","belong(속하다): 선행사 behaviors(행동들)가 복수라 s 없는 현재형이 맞음.","has belonged(속해 왔다): has(단수형)는 단수 주어용이라 복수 behaviors(행동들)와 안 맞음."],"point":"관계사절 동사의 수일치","en":"The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances.","ko":"읽기에 대해 생각하는 가장 생산적인 방식은 가족 유사성 때문에 함께 속하게 되는 헐겁게 연결된 행동의 묶음으로서이다.","hl":["behaviors that belong together"],"khl":["함께 속하게 되는"],"blocks":[{"t":"p","h":"that(~하는)이 붙잡은 명사 찾기","x":["관계대명사 that(~하는) 뒤 동사는 that이 붙잡은 명사에 맞춘다.","후보 1: a set(묶음), 하나.","후보 2: behaviors(행동들), 여럿.","belong together(함께 속하다) 하는 것은 행동들이다. 묶음 하나가 \"함께\" 속할 수는 없다.","그래서 복수 belong(속하다)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a box of toys that are broken.","나는 망가진 장난감들이 든 상자가 있다. (toys(장난감들) → are)"],["She has a friend who lives nearby.","그녀는 근처에 사는 친구가 있다. (friend(친구) → lives)"]]},{"t":"tap","h":"확인 질문","q":"together(함께)라는 단어가 왜 큰 힌트일까?","a":["\"함께\"는 여럿일 때만 쓸 수 있다.","그래서 that(~하는)이 받는 건 복수 behaviors(행동들)."]}],"post":["that(~하는) 앞 진짜 짝은 behaviors(행동들) → belong(속하다), s 없음"]},{"slots":[["logically","","","형용사 consistent(일관성 있는)를 꾸미는 부사."],["having","","","전치사 without(~없이) 뒤 동명사."],["what","that","a","전치사 on(~에 대한) 뒤에 앞에서 받을 명사가 없고, qualifies(자격이 되다)의 주어가 비어 있다. 이 빈자리를 품는 건 what(~하는 것)."],["attempting","","","be worth -ing(~할 가치가 있다)."],["to_accommodate","","","형용사 + enough(충분히) + to부정사."]],"opts":["which","whose","where","what"],"or":["which(~하는): 붙잡을 앞 명사가 있어야 하는데 전치사 on(~에 대한)만 있음.","whose(~의): 뒤에 꾸밀 명사가 와야 하는데 qualifies(자격이 되다)가 바로 옴.","where(~하는 곳, 어디에): 뒤에 완전한 문장이 와야 하는데 qualifies(자격이 되다)의 주어가 비어 있음.","what(~하는 것): 앞에 명사가 없고 qualifies(자격이 되다)의 주어가 빠져 있어서 맞음."],"point":"that/which vs. what","en":"Consequently, efforts to distinguish reading from nonreading are destined to fail because there is no agreement on what qualifies as reading in the first place.","ko":"결론적으로, 읽기와 읽기가 아닌 것을 where(~하는 곳))"],["This is the place which I visited.","이곳은 내가 방문한 장소다. (visited(방문했다) 뒤가 빔 → which)"]]}],"post":["경계 + where(~하는 곳) + 완전한 문장: the boundaries where reading begins(읽기가 시작되는 경계)"]},{"slots":[["do","","","주어 people(사람들)이 복수."],["is_b","","","단수 주어 way(방식)의 동사."],["are_destined","","","복수 주어 efforts(노력들)의 동사."],["faced","facing","a","challenges(어려움들)는 사람들이 마주하는 대상이다. 어려움 입장에서는 \"마주하게 되는\" 쪽이라 p.p. 뒤의 by(~에 의해)가 결정적 힌트."],["to_accommodate","","","형용사 + enough(충분히) + to부정사."]],"opts":["faced","face","faces","has faced"],"or":["faced(마주하게 되는): 어려움들이 누군가에게 마주하게 되는 쪽이고 by(~에 의해)가 있어서 과거분사가 맞음.","face(마주하다): 동사원형은 명사 challenges(어려움들)를 뒤에서 꾸밀 수 없음.","faces(마주하다): 접속사 없이 동사가 또 생겨 문장이 깨짐.","has faced(마주해 왔다): 진짜 동사라 명사를 꾸밀 수 없고 by(~에 의해)와도 안 맞음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Thus, it is worth attempting to collect together these exceptional forms of reading into a single forum, one highlighting the challenges faced by anyone wishing to establish the boundaries where reading begins and ends.","ko":"그러므로, 이러한 예외적인 읽기의 형태들을 모두 함께 하나의 토론의 장으로 모으려는 시도는 해 볼 가치가 있으며, 그 토론의 장은 어디서 읽기가 시작되고 끝나는가에 대한 경계를 정하기를 원하는 누구나 마주하게 될 어려움들을 돋보이게 한다.","hl":["the challenges faced by anyone"],"khl":["누구나 마주하게 될 어려움들"],"blocks":[{"t":"p","h":"분사 세 개 줄 세우기","x":["highlighting(돋보이게 하는): 토론의 장이 어려움을 돋보이게 한다. 능동.","faced(마주하게 되는): 어려움이 누군가에게 마주하게 된다. 수동.","wishing(원하는): 누군가가 경계를 정하길 원한다. 능동.","한 문장에 -ing와 p.p.가 섞여 나오니 하나씩 주인에게 물어봐야 한다."]},{"t":"pair","h":"쉬운 예시","x":[["The problems solved by him were hard.","그가 푼 문제들은 어려웠다. (문제는 풀리는 쪽 + by(~에 의해))"],["The boy solving the problem is smart.","그 문제를 푸는 소년은 똑똑하다. (소년이 푸는 쪽)"]]}],"post":["어려움은 마주하게 되는 쪽: the challenges faced by anyone(누구나 마주하는 어려움들)"]}],"quiz":[{"s":"The cake was ___ cut into pieces.","o":["neat","neatly"],"a":1,"ko":"그 케이크는 깔끔하게 조각으로 잘렸다.","why":"과거분사 cut(잘린)을 꾸미니 부사.","wy":"neat(깔끔한): 형용사라 분사 cut(잘린)을 꾸밀 수 없음."},{"s":"I have friends who ___ soccer.","o":["like","likes"],"a":0,"ko":"나에게는 축구를 좋아하는 친구들이 있다.","why":"who(~하는)가 받는 friends(친구들)가 복수.","wy":"likes(좋아하다): 3인칭 단수형이라 복수 friends(친구들)와 안 맞음."},{"s":"We talked about ___ happened.","o":["that","what"],"a":1,"ko":"우리는 일어난 일에 대해 이야기했다.","why":"전치사 뒤, 주어가 빠졌으니 what.","wy":"that(~라는 것): 전치사 about(~에 대해) 바로 뒤에 못 오고 주어 빈자리도 못 채움."},{"s":"This is the town ___ my grandma lives.","o":["where","which"],"a":0,"ko":"이곳은 우리 할머니가 사시는 마을이다.","why":"my grandma lives(할머니가 사신다)가 완전한 문장이라 where(~하는 곳).","wy":"which(~하는): 뒤에 빈자리가 있어야 하는데 my grandma lives(할머니가 사신다)는 완전함."},{"s":"The problems ___ by the team were big.","o":["facing","faced"],"a":1,"ko":"그 팀이 마주한 문제들은 컸다.","why":"문제는 마주하게 되는 쪽이고 by(~에 의해)가 있음.","wy":"facing(마주하는): 능동이라 by the team(그 팀에 의해)과 함께 쓸 수 없음."}]}],"comp":[{"no":"33","slots":[["that_a","","","argue(주장하다)의 목적어, 뒤가 완전해서 that(~라는 것)."],["neatly","","","분사 set apart(분리되는)를 꾸미는 부사."],["having","","","전치사 without(~없이) 뒤 동명사."],["the_more","more","a","앞에 The more one tries(더 애쓸수록)가 나왔다. 짝이 되는 뒤쪽에도 the + 비교급이 와야 한다."],["where","","","선행사 the boundaries(경계들) 뒤 완전한 문장."]],"opts":["the most","the more","the many","most"],"or":["the most(가장 많은): the + 최상급은 \"~할수록 더\"의 짝이 못 되어 앞의 The more(더 ~할수록) 절이 짝 없이 남음.","the more(그만큼 더 많은): 앞의 The more(더 ~할수록)와 짝을 이루는 the + 비교급이라 맞음.","the many(그 많은): many(많은)는 원급이라 the가 붙어도 비교급 짝이 아니어서 앞의 The more(더 ~할수록) 절이 짝 없이 남음.","most(대부분의): the도 없고 비교급도 아니라 짝이 깨짐."],"point":"비교(the 비교급, the 비교급)","en":"The more one tries to figure out where the border lies between reading and not-reading, the more edge cases will be found to stretch the term’s flexible boundaries.","ko":"읽기와 읽기가 아닌 것 사이의 경계가 어디에 있는가를 알려고 하면 할수록, 더욱 많은 특이 사례들이 그 용어의 유연한 경계를 확장하고 있다는 것이 밝혀질 것이다.","hl":["The more one tries","the more edge cases"],"khl":["알려고 하면 할수록","더욱 많은 특이 사례들"],"blocks":[{"t":"p","h":"시소 구조","x":["The 비교급 ~, the 비교급 ~ = ~할수록 더 ~하다.","한쪽이 올라가면 다른 쪽도 올라가는 시소다.","왼쪽: The more one tries(더 애쓸수록).","오른쪽: the more edge cases(더 많은 특이 사례들).","양쪽 모두 the를 달아야 시소가 성립한다."]},{"t":"pair","h":"쉬운 예시","x":[["The more you eat, the fatter you get.","많이 먹을수록 더 살이 찐다. (the 비교급, the 비교급)"],["The older he gets, the wiser he becomes.","그는 나이가 들수록 더 현명해진다."]]},{"t":"tap","h":"확인 질문","q":"경계를 알려고 애쓸수록 무엇이 늘어난다는 말인가?","a":["경계를 넓혀 버리는 특이 사례들.","그래서 읽기의 경계를 딱 정하기는 어렵다는 것이 이 글의 흐름이다."]}],"post":["The more ~, the more ~(~할수록 더 ~): 양쪽 다 the + 비교급"]},{"no":"33","slots":[["logically","","","형용사 consistent(일관성 있는)를 꾸미는 부사."],["to_think","","","명사 way(방식)를 꾸미는 to부정사."],["belong","","","선행사 behaviors(행동들)가 복수."],["attempting","","","be worth -ing(~할 가치가 있다)."],["to_accommodate","accommodating","a","형용사 + enough(충분히) 뒤에는 to부정사가 온다. \"~할 만큼 충분히 ~한\"."]],"opts":["accommodate","to accommodate","accommodated","accommodates"],"or":["accommodate(수용하다): enough(충분히) 뒤 \"~할 만큼\" 자리에는 to가 필요하고, 동사원형만 오면 is(~이다)와 동사가 겹침.","to accommodate(수용할): 형용사 expansive(광범위한) + enough(충분히) 뒤라 to부정사가 맞음.","accommodated(수용했다, 수용된): enough(충분히) 뒤 \"~할 만큼\" 자리에 과거형·과거분사형은 못 옴.","accommodates(수용하다): 관계사절의 동사 is(~이다)가 이미 있어서 동사가 겹침."],"point":"형용사 + enough(충분히) + to부정사","en":"The attempt moves toward an understanding of reading as a spectrum that is expansive enough to accommodate the distinct reading activities.","ko":"그러한 시도는 별개의 읽기 활동들을 다 수용할 만큼 충분히 광범위한 스펙트럼으로서 읽기를 이해하는 것으로 나아간다.","hl":["expansive enough to accommodate"],"khl":["수용할 만큼 충분히 광범위한"],"blocks":[{"t":"p","h":"enough(충분히)의 자리와 짝","x":["enough(충분히)는 형용사 뒤에 선다: expansive enough(충분히 광범위한).","그 뒤에 \"무엇을 할 만큼\"인지는 to부정사가 말한다.","expansive enough to accommodate = 수용할 만큼 충분히 광범위한.","읽기를 하나로 딱 자르지 말고 넓은 범위로 보자는 글의 결론이다."]},{"t":"pair","h":"쉬운 예시","x":[["She is old enough to drive.","그녀는 운전할 만큼 충분히 나이가 들었다. (old enough + to drive(운전할))"],["The room is big enough to hold ten people.","그 방은 열 명이 들어갈 만큼 충분히 크다. (big enough + to hold(수용할))"]]}],"post":["형용사 + enough + to V: expansive enough to accommodate(수용할 만큼 충분히 광범위한)"]}],"compquiz":[{"s":"The more you practice, ___ you get.","o":["better","the better"],"a":1,"ko":"연습을 많이 할수록 더 잘하게 된다.","why":"The more(더 ~할수록)와 짝이 되는 the + 비교급.","wy":"better(더 잘): the가 빠져서 the 비교급 짝이 깨짐."},{"s":"He is tall enough ___ the shelf.","o":["reaching","to reach"],"a":1,"ko":"그는 선반에 닿을 만큼 충분히 키가 크다.","why":"형용사 + enough(충분히) + to부정사.","wy":"reaching(닿는): enough(충분히) 뒤 \"~할 만큼\" 자리에 -ing는 못 옴."}]}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+'번<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+'번 · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+'번 지문</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
