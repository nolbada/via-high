<title>어휘특훈 · 24년 10월 고2</title>

<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}

.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}

.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>

hose values, together with certain equations, to calculate the mass.","ko":"우리는 다른 양들을 측정하고, 그 값들을 특정한 방정식들과 함께 사용해 질량을 계산한다.","hl":["together with certain equations","use those values"],"khl":["특정한 방정식들과 함께","그 값들을"],"blocks":[{"t":"p","h":"계산의 재료 두 가지","x":["재료 1: 잰 값들 (거리, 주기).","재료 2: 방정식 (케플러 법칙).","둘 중 하나만 있으면 질량이 안 나온다.","without(~ 없이)을 넣으면 방정식 없이 계산한다는 말이 된다."]},{"t":"p","h":"앞 문장에도 같은 표현","x":["바로 앞 문장에도 together with a value for the period(공전 주기 값과 함께)가 있었다.","이 글은 처음부터 \"값 + 법칙\"을 한 묶음으로 쓴다.","apply(적용하다), specific(특정한)은 use(사용하다), certain(특정한)과 같은 뜻이라 고치지 않는다."]}],"post":["together with(~와 함께) ↔ without(~ 없이)","질량 계산 = 잰 값 + 방정식"]},{"slots":[["In_other_words"],["use"],["together_with"],["certain","arbitrary","a"],["a_simple"]],"opts":["certain","random","careless","meaningless"],"or":["certain(특정한): 케플러 제3법칙처럼 정해진 방정식을 쓰므로 맞음.","random(무작위의): 아무 방정식이나 넣으면 질량이 매번 달라짐.","careless(부주의한): 측정에 쓰는 방정식을 부주의하다고 할 근거가 없음.","meaningless(의미 없는): 의미 없는 방정식으로는 질량을 계산할 수 없음."],"om":["특정한","무작위의","부주의한","의미 없는"],"en":"we measure other quantities and use those values, together with certain equations, to calculate the mass.","ko":"우리는 다른 양들을 측정하고, 그 값들을 특정한 방정식들과 함께 사용해 질량을 계산한다.","hl":["certain equations","to calculate the mass"],"khl":["특정한 방정식들과","질량을 계산한다"],"blocks":[{"t":"tap","h":"질문 하나","q":"쌍성의 질량을 구할 때 쓴 방정식은 아무거나였나?","a":["아니다.","a certain instance of Kepler’s Third Law(케플러 제3법칙의 특정한 사례)였다.","딱 정해진 법칙을 쓴다.","arbitrary(제멋대로의)는 이 정해진 느낌을 정반대로 뒤집는다."]}],"post":["certain(특정한) ↔ arbitrary(제멋대로의)","쓰는 방정식 = 케플러 제3법칙처럼 정해진 것"]}],"quiz":[{"w":"known","m":"알려진, 이미 알고 있는","it":[["familiar","익숙한, 잘 알려진","s"],["unknown","알려지지 않은","a"],["thirsty","목마른","n"],["identified","확인된","s"],["unfamiliar","낯선","a"],["wet","젖은","n"],["cheerful","쾌활한","n"]]},{"w":"involve","m":"포함하다, 수반하다","it":[["entail","수반하다","s"],["exclude","배제하다","a"],["knit","뜨개질하다","n"],["include","포함하다","s"],["omit","빠뜨리다","a"],["bark","짖다","n"],["yawn","하품하다","n"]]},{"w":"various","m":"다양한","it":[["diverse","다양한","s"],["uniform","획일적인, 한결같은","a"],["rusty","녹슨","n"],["assorted","여러 가지의","s"],["identical","똑같은","a"],["shy","수줍은","n"],["juicy","즙이 많은","n"]]},{"w":"together with","m":"~와 함께","it":[["along with","~와 함께","s"],["without","~ 없이","a"],["because of","~ 때문에","n"],["combined with","~와 결합하여","s"],["coupled with","~와 더불어","s"],["according to","~에 따르면","n"],["in spite of","~에도 불구하고","n"]]},{"w":"certain","m":"특정한","it":[["specific","특정한","s"],["general","일반적인","a"],["muddy","진흙투성이의","n"],["particular","특정한","s"],["unspecified","특정되지 않은","a"],["sweet","달콤한","n"],["lazy","게으른","n"]]}]}],"no":"22"},{"id":"2410g2-23","title":"어휘특훈 · 24년 10월 고2 23번","sub":"고통과 쾌락의 저울","tpl":"Based on {discoveries} in neuroscience, pain and pleasure are formed and processed in the {same} area of the brain. Our bodies {constantly} {strive_for} homeostasis, which is defined as the {balance} of bodily functions. Without the body’s {effective} compensatory mechanisms, which may {cushion} potential highs and lows, we would not be capable of surviving. Pleasure and pain are like two sides of the same coin; they seem to work together and are {heavily} {reliant} on one another and keep balance. If you imagine pleasure and pain as the two opposite points on a scale, you can easily understand that as one of the two points {rises}, the other must correspondingly {fall}. We’ve all heard the expression, “No pain, no gain.” Well, according to psychiatrist Dr. Anna Lembke, there may be some truth to these words. She says that our attempts to {escape} being miserable are in fact making us even more {miserable}. This is because pain is actually an {essential} component of our ability to {maintain} a {neutral} state, and {allowing} it will in turn reset our internal scale back to balance.","fn":["*neuroscience: 신경과학","*homeostasis: 항상성(몸 상태를 일정하게 유지하려는 성질)","*compensatory mechanism: 보상 기제(한쪽으로 쏠린 것을 되돌리는 몸의 장치)","*psychiatrist: 정신과 의사"],"mean":{"discoveries":"명사 discovery(발견)의 복수형","findings":"명사 finding(연구 결과, 발견)의 복수형","same":"같은","opposite":"정반대의, 반대편의","constantly":"끊임없이","continually":"계속해서, 끊임없이","strive for":"~을 얻으려고 애쓰다","resist":"저항하다, 거부하다","balance":"균형","equilibrium":"평형, 균형","imbalance":"불균형","effective":"효과적인","efficient":"효율적인","ineffective":"효과 없는","cushion":"(충격을) 완화하다, 누그러뜨리다","soften":"누그러뜨리다, 부드럽게 하다","amplify":"증폭시키다, 키우다","heavily":"크게, 심하게","highly":"매우, 크게","hardly":"거의 ~않게","reliant":"의존하는","dependent":"의존하는","rises":"동사 rise(올라가다)의 3인칭 단수형","goes up":"동사 go up(올라가다)의 3인칭 단수형","fall":"내려가다, 떨어지다","rise":"올라가다","escape":"벗어나다, 탈출하다","avoid":"피하다","embrace":"기꺼이 받아들이다, 껴안다","miserable":"비참한","content":"만족하는","essential":"필수적인","integral":"없어서는 안 될, 필수적인","unnecessary":"불필요한","maintain":"유지하다","preserve":"지키다, 보존하다","disrupt":"흐트러뜨리다, 방해하다","neutral":"중립의, 어느 쪽에도 치우치지 않은","allowing":"동사 allow(허용하다)의 -ing형. 동명사 주어","suppressing":"동사 suppress(억누르다)의 -ing형. 동명사"},"comp":[{"no":"23","slots":[["same"],["constantly","continually","s"],["strive_for"],["balance","imbalance","a"],["effective"]],"opts":["balance","conflict","collapse","disorder"],"or":["balance(균형): homeostasis(항상성)는 몸 상태를 고르게 맞추는 것이라 맞음.","conflict(충돌): 몸의 기능끼리 부딪치는 걸 몸이 애써 얻으려 할 리 없음.","collapse(붕괴): 무너짐을 추구한다면 살아남을 수 없다는 다음 문장과 부딪침.","disorder(무질서): 무질서를 항상성이라고 부르는 건 정반대 정의임."],"om":["균형","충돌","붕괴","무질서"],"en":"Our bodies constantly strive for homeostasis, which is defined as the balance of bodily functions.","ko":"우리 몸은 끊임없이 항상성을 얻으려고 애쓰는데, 항상성은 신체 기능의 균형이라고 정의된다.","hl":["the balance of bodily functions","strive for homeostasis"],"khl":["신체 기능의 균형","항상성을 얻으려고 애쓰는데"],"blocks":[{"t":"p","h":"정의 문장은 단어 뜻 그대로","x":["which is defined as(~라고 정의된다) 뒤에는 앞 단어의 뜻풀이가 온다.","homeo(같은) + stasis(머무름) = 같은 상태로 머물기.","같은 상태로 머물려면 기울지 않고 고르게, 즉 균형이어야 한다.","imbalance(불균형)를 넣으면 항상성의 뜻을 거꾸로 정의하게 된다."]},{"t":"p","h":"글 끝과 맞물리는 단어","x":["글 마지막도 back to balance(다시 균형으로)로 끝난다.","처음과 끝이 모두 균형 얘기다.","continually(끊임없이)는 constantly(끊임없이)와 같은 뜻이라 그대로 둔다."]}],"post":["balance(균형) ↔ imbalance(불균형)","항상성 = 몸을 고르게 맞추려는 힘"]},{"no":"23","slots":[["reliant"],["escape"],["miserable","content","a"],["maintain","preserve","s"],["allowing"]],"opts":["miserable","joyful","relaxed","satisfied"],"or":["miserable(비참한): 고통을 피하려다 오히려 더 비참해진다는 역설이 이 글의 핵심이라 맞음.","joyful(기쁜): 더 기뻐진다면 고통이 필수라는 다음 문장과 이어지지 않음.","relaxed(느긋한): 고통을 피해서 더 편해졌다면 \"No pain, no gain(고통 없이는 얻는 것도 없다)\"에 진실이 있을 리 없음.","satisfied(만족한): 피하는 시도가 성공한 셈이 되어 글쓴이가 경고하는 방향과 반대임."],"om":["비참한","기쁜","느긋한","만족한"],"en":"She says that our attempts to escape being miserable are in fact making us even more miserable.","ko":"그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다.","hl":["even more miserable","in fact"],"khl":["훨씬 더 비참하게","사실은"],"blocks":[{"t":"p","h":"in fact(사실은)가 알려 주는 반전","x":["in fact(사실은)는 \"예상과 달리\"라는 신호다.","예상: 고통을 피하면 덜 비참해진다.","실제: 오히려 더 비참해진다.","content(만족하는)를 넣으면 예상대로 된 셈이라 반전이 사라진다."]},{"t":"p","h":"그대로 둘 단어","x":["preserve(지키다)는 maintain(유지하다) 자리에 넣어도 \"중립 상태를 지키는 능력\"이 된다."]}],"post":["miserable(비참한) ↔ content(만족하는)","고통 피하기 = 오히려 더 비참해지는 길"]}],"compquiz":[{"w":"balance","m":"균형","it":[["equilibrium","평형, 균형","s"],["pillow","베개","n"],["imbalance","불균형","a"],["stability","안정","s"],["harvest","수확","n"],["instability","불안정","a"],["museum","박물관","n"]]},{"w":"miserable","m":"비참한","it":[["wretched","비참한","s"],["cheerful","쾌활한","a"],["wooden","나무로 된","n"],["unhappy","불행한","s"],["content","만족하는","a"],["square","정사각형의","n"],["frequent","잦은","n"]]}],"sets":[{"items":[{"slots":[["discoveries"],["same","opposite","a"],["constantly"],["strive_for"],["balance"]],"opts":["same","separate","unrelated","distant"],"or":["same(같은): 바로 뒤에서 쾌락과 고통을 같은 동전의 양면이라 부르니 맞음.","separate(분리된): 따로 처리된다면 함께 작동하며 서로 기댄다는 설명과 안 맞음.","unrelated(관계없는): 관계없는 곳에서 처리되면 저울처럼 한쪽이 오르면 다른 쪽이 내려갈 수 없음.","distant(멀리 떨어진): 멀리 떨어진 영역이라면 \"같은 동전의 양면\" 비유가 성립하지 않음."],"om":["같은","분리된","관계없는","멀리 떨어진"],"en":"Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain.","ko":"신경과학의 발견에 따르면, 고통과 쾌락은 뇌의 같은 영역에서  imagine pleasure and pain as the two opposite points on a scale, you can easily understand that as one of the two points rises, the other must correspondingly fall.","ko":"쾌락과 고통을 저울 위의 서로 반대편 두 지점이라고 상상해 보면, 두 지점 중 하나가 올라가면 다른 하나는 그에 맞춰 내려갈 수밖에 없다는 것을 쉽게 이해할 수 있다.","hl":["the other must correspondingly fall","two opposite points on a scale"],"khl":["그에 맞춰 내려갈 수밖에 없다","저울 위의 서로 반대편 두 지점"],"blocks":[{"t":"tap","h":"질문 하나","q":"놀이터 시소에서 한쪽이 올라가면 반대쪽은?","a":["내려간다.","이 글의 scale(저울)도 똑같다.","쾌락이 오르면 고통이 내려가고, 고통이 오르면 쾌락이 내려간다.","rise(올라가다)를 넣으면 양쪽이 같이 올라가는 이상한 저울이 된다."]},{"t":"p","h":"그대로 둘 단어","x":["highly(크게)는 heavily(크게) 자리에 넣어도 \"서로 크게 의존한다\"가 된다."]}],"post":["fall(내려가다) ↔ rise(올라가다)","쾌락과 고통 = 시소의 양쪽"]},{"slots":[["escape"],["miserable"],["essential"],["maintain","disrupt","a"],["neutral"]],"opts":["maintain","abandon","destroy","upset"],"or":["maintain(유지하다): 고통이 중립 상태를 지키는 능력의 일부라야 균형 얘기와 이어져 맞음.","abandon(버리다): 중립 상태를 버리는 능력이라면 균형으로 되돌린다는 뒷부분과 부딪침.","destroy(파괴하다): 중립 상태를 깨는 능력에 고통이 필수라는 건 글 전체와 반대임.","upset(뒤엎다): 저울을 뒤엎는 능력이 아니라 바로잡는 능력을 말하는 문장임."],"om":["유지하다","버리다","파괴하다","뒤엎다"],"en":"This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance.","ko":"이는 고통이 사실 중립 상태를 유지하는 우리 능력의 필수 구성 요소이고, 고통을 허용하면 결국 우리 내부의 저울이 다시 균형으로 맞춰지기 때문이다.","hl":["maintain a neutral state","reset our internal scale back to balance"],"khl":["중립 상태를 유지하는","다시 균형으로 맞춰지기"],"blocks":[{"t":"pair","h":"한 문장 안의 두 부분","x":[["our ability to maintain a neutral state","중립 상태를 유지하는 능력"],["reset our internal scale back to balance","내부의 저울을 다시 균형으로 맞추다"]]},{"t":"p","h":"두 부분이 같은 방향","x":["앞부분과 뒷부분 모두 균형을 지키는 쪽이다.","neutral(중립의) 상태 = 어느 쪽에도 기울지 않은 저울.","disrupt(흐트러뜨리다)를 넣으면 앞은 저울을 흔들고 뒤는 바로잡는 말이 되어 한 문장이 둘로 쪼개진다."]}],"post":["maintain(유지하다) ↔ disrupt(흐트러뜨리다)","고통의 역할 = 저울을 가운데로 지키기"]},{"slots":[["escape","avoid","s"],["miserable"],["essential","integral","s"],["neutral"],["allowing","suppressing","a"]],"opts":["allowing","resisting","denying","blocking"],"or":["allowing(허용하기): 고통을 피하면 더 비참해진다고 했으니 해결책은 고통을 받아들이는 쪽이라 맞음.","resisting(저항하기): 고통에 맞서는 건 앞에서 실패한다고 한 \"벗어나려는 시도\"와 같음.","denying(부인하기): 고통을 없는 척하는 것도 피하기의 한 종류라 해결책이 될 수 없음.","blocking(막기): 고통을 막는 건 글쓴이가 더 비참해진다고 경고한 바로 그 행동임."],"om":["허용하기","저항하기","부인하기","막기"],"en":"She says that our attempts to escape being miserable are in fact making us even more miserable. This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance.","ko":"그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다. 이는 고통이 사실 중립 상태를 유지하는 우리 능력의 필수 구성 요소이고, 고통을 허용하면 결국 우리 내부의 저울이 다시 균형으로 맞춰지기 때문이다.","hl":["allowing it","our attempts to escape being miserable"],"khl":["고통을 허용하면","비참함에서 벗어나려는 우리의 시도"],"blocks":[{"t":"p","h":"문제와 해결이 짝","x":["문제: 고통에서 벗어나려 하면 더 비참해진다.","해결: 그렇다면 고통을 받아들여야 한다.","suppressing(억누르기)은 벗어나려는 시도와 같은 편이다.","문제로 지적한 행동을 해결책 자리에 다시 넣는 셈이다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","avoid(피하다)는 escape(벗어나다)와 같은 방향이라 \"비참함을 피하려는 시도\"로 자연스럽다.","integral(없어서는 안 될)은 essential(필수적인)과 같은 뜻이고 an(하나의)과도 잘 붙는다.","고칠 곳은 마지막 하나."]}],"post":["allow(허용하다) ↔ suppress(억누르다)","고통을 받아들여야 저울이 균형으로"]}],"quiz":[{"w":"same","m":"같은","it":[["identical","똑같은","s"],["different","다른","a"],["crispy","바삭한","n"],["alike","비슷한, 같은","s"],["distinct","별개의, 다른","a"],["foggy","안개 낀","n"],["rude","무례한","n"]]},{"w":"effective","m":"효과적인","it":[["successful","성공적인","s"],["ineffective","효과 없는","a"],["purple","보라색의","n"],["efficient","효율적인","s"],["useless","쓸모없는","a"],["humid","습한","n"],["elderly","나이 든","n"]]},{"w":"fall","m":"내려가다, 떨어지다","it":[["drop","떨어지다","s"],["rise","올라가다","a"],["knock","두드리다","n"],["decline","감소하다, 내려가다","s"],["climb","올라가다","a"],["borrow","빌리다","n"],["smell","냄새 맡다","n"]]},{"w":"maintain","m":"유지하다","it":[["preserve","지키다, 보존하다","s"],["abandon","버리다","a"],["giggle","킥킥 웃다","n"],["sustain","지속시키다","s"],["discontinue","중단하다","a"],["paint","칠하다","n"],["sail","항해하다","n"]]},{"w":"allow","m":"허용하다","it":[["permit","허락하다","s"],["forbid","금지하다","a"],["melt","녹다","n"],["tolerate","참고 받아들이다","s"],["prohibit","금지하다","a"],["shout","소리치다","n"],["wander","돌아다니다","n"]]}]},{"items":[{"slots":[["discoveries","findings","s"],["same"],["constantly"],["strive_for","resist","a"],["balance"]],"opts":["strive_for","give_up_on","run_away_from","fight_against"],"or":["strive for(얻으려고 애쓰다): 몸은 균형이 깨지면 못 살아남으니 늘 균형을 얻으려 애써 맞음.","give up on(포기하다): 항상성을 포기하면 다음 문장처럼 살아남을 수 없음.","run away from(도망치다): 생존에 꼭 필요한 균형에서 도망칠 리 없음.","fight against(맞서 싸우다): 몸이 자기 균형과 싸운다는 건 글 흐름과 정반대임."],"om":["얻으려고 애쓰다","포기하다","도망치다","맞서 싸우다"],"en":"Our bodies constantly strive for homeostasis, which is defined as the balance of bodily functions. Without the body’s effective compensatory mechanisms, … we would not be capable of surviving.","ko":"우리 몸은 끊임없이 항상성을 얻으려고 애쓰는데, 항상성은 신체 기능의 균형이라고 정의된다. … 몸의 효과적인 보상 기제가 없다면, 우리는 살아남을 수 없을 것이다.","hl":["constantly strive for homeostasis","we would not be capable of surviving"],"khl":["끊임없이 항상성을 얻으려고 애쓰는데","살아남을 수 없을 것이다"],"blocks":[{"t":"p","h":"몸이 원하는 것","x":["한겨울에도 체온은 36.5도 언저리로 돌아온다.","배가 고프면 먹고 싶고, 너무 먹으면 그만 먹고 싶다.","몸은 늘 가운데로 돌아오려 한다. 이게 homeostasis(항상성)다.","resist(저항하다)를 넣으면 몸이 자기 생존 조건을 거부하는 말이 된다."]},{"t":"p","h":"그대로 둘 단어","x":["findings(연구 결과)는 discoveries(발견) 자리에 넣어도 \"신경과학 연구 결과에 따르면\"이 된다."]}],"post":["strive for(얻으려 애쓰다) ↔ resist(저항하다)","몸 = 늘 가운데로 돌아오려는 저울"]},{"slots":[["effective"],["cushion","amplify","a"],["heavily"],["reliant"],["rises"]],"opts":["cushion","worsen","exaggerate","multiply"],"or":["cushion(완화하다): 보상 기제는 한쪽으로 쏠린 걸 되돌리는 장치라 높낮이를 누그러뜨려 맞음.","worsen(악화시키다): 기복을 더 나쁘게 만드는 장치라면 생존을 돕는다는 말과 부딪침.","exaggerate(과장하다, 부풀리다): 높낮이를 부풀리면 균형에서 더 멀어짐.","multiply(크게 늘리다): 기복을 늘리는 장치는 균형을 지키는 몸의 목표와 반대임."],"om":["완화하다","악화시키다","부풀리다","크게 늘리다"],"en":"Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.","ko":"일어날 수 있는 기복을 완화해 줄 수 있는 몸의 효과적인 보상 기제가 없다면, 우리는 살아남을 수 없을 것이다.","hl":["cushion potential highs and lows","compensatory mechanisms"],"khl":["기복을 완화해 줄 수 있는","보상 기제가"],"blocks":[{"t":"p","h":"단어의 그림부터","x":["cushion(쿠션)은 원래 방석이다.","떨어질 때 쿠션이 있으면 충격이 줄어든다.","동사로 쓰면 \"충격을 줄여 주다\"가 된다.","highs and lows(높낮이) = 기분이나 몸 상태가 확 올라갔다 확 떨어지는 것."]},{"t":"p","h":"amplify(증폭시키다)가 틀린 이유","x":["compensatory(보상하는)는 기운 쪽을 반대로 채워 주는 성질이다.","그런 장치가 높낮이를 키울 리 없다.","키우면 균형에서 더 멀어지고, 몸이 애쓰는 항상성과 반대로 간다."]}],"post":["cushion(완화하다) ↔ amplify(증폭시키다)","보상 기제 = 기복을 받아 주는 쿠션"]},{"slots":[["effective","efficient","s"],["cushion","soften","s"],["heavily","hardly","a"],["reliant"],["fall"]],"opts":["heavily","rarely","loosely","weakly"],"or":["heavily(크게): 같은 동전의 양면처럼 함께 작동하니 서로 크게 기대어 맞음.","rarely(좀처럼 ~않게): 함께 작동한다는 앞부분과 부딪침.","loosely(느슨하게): 동전의 양면은 떼려야 뗄 수 없는 관계라 느슨하지 않음.","weakly(약하게): 한쪽이 오르면 다른 쪽이 반드시 내려가는 관계라 약한 연결이 아님."],"om":["크게","좀처럼 ~않게","느슨하게","약하게"],"en":"Pleasure and pain are like two sides of the same coin; they seem to work together and are heavily reliant on one another and keep balance.","ko":"쾌락과 고통은 같은 동전의 양면과 같다. 그것들은 함께 작동하는 것처럼 보이고, 서로에게 크게 의존하며, 균형을 유지한다.","hl":["heavily reliant on one another","two sides of the same coin"],"khl":["서로에게 크게 의존하며","같은 동전의 양면"],"blocks":[{"t":"p","h":"비유가 정하는 세기","x":["동전의 앞면만 떼어 낼 수 있을까?","없다. 앞면이 있으면 뒷면도 반드시 있다.","그만큼 단단히 묶인 사이라는 비유다.","hardly(거의 ~않게)를 넣으면 \"서로 거의 의존하지 않는다\"가 되어 비유가 무너진다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","efficient(효율적인)는 effective(효과적인) 자리에, soften(누그러뜨리다)은 cushion(완화하다) 자리에 들어가도 뜻이 통한다.","둘 다 \"몸이 기복을 잘 받아 준다\"는 방향 그대로."]}],"post":["heavily(크게) ↔ hardly(거의 ~않게)","쾌락과 고통 = 떼어 낼 수 없는 동전의 양면"]},{"slots":[["rises","goes up","s"],["fall"],["escape","embrace","a"],["miserable"],["essential"]],"opts":["escape","welcome","endure","tolerate"],"or":["escape(벗어나다): 비참함에서 벗어나려는 시도가 오히려 더 비참하게 만든다는 역설이라 맞음.","welcome(반기다): 비참함을 반기는 건 오히려 글쓴이가 권하는 쪽이라 \"더 비참해진다\"와 안 맞음.","endure(견디다): 견디는 것은 고통을 허용하는 쪽이라 균형으로 돌아간다는 결론과 같은 편임.","tolerate(참다): 참는 것도 고통을 받아들이는 쪽이라 더 비참해질 이유가 없음."],"om":["벗어나다","반기다","견디다","참다"],"en":"She says that our attempts to escape being miserable are in fact making us even more miserable.","ko":"그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다.","hl":["our attempts to escape being miserable","even more miserable"],"khl":["비참함에서 벗어나려는 우리의 시도가","훨씬 더 비참하게"],"blocks":[{"t":"pair","h":"이 문장과 짝이 되는 속담","x":[["No pain, no gain.","고통 없이는 얻는 것도 없다."],["our attempts to escape being miserable are … making us even more miserable","비참함에서 벗어나려는 시도가 더 비참하게 만든다"]]},{"t":"p","h":"embrace(기꺼이 받아들이다)가 틀린 이유","x":["속담은 고통을 피하지 말라고 한다.","이 문장은 고통을 피하면 손해라고 한다.","둘은 같은 얘기다.","embrace(기꺼이 받아들이다)를 넣으면 \"받아들이려다 더 비참해진다\"가 되어 속담과 등을 돌린다."]},{"t":"p","h":"그대로 둘 단어","x":["goes up(올라가다)은 rises(올라가다)와 같은 말이다."]}],"post":["escape(벗어나다) ↔ embrace(기꺼이 받아들이다)","고통 피하기 = 더 큰 비참함"]},{"slots":[["fall"],["escape"],["miserable"],["essential","unnecessary","a"],["maintain"]],"opts":["essential","irrelevant","optional","unimportant"],"or":["essential(필수적인): 고통을 허용해야 저울이 균형으로 돌아오니 고통은 꼭 필요한 부품이라 맞음.","irrelevant(무관한): 고통이 균형과 무관하다면 고통을 허용해서 균형이 돌아올 리 없음.","optional(선택적인): 있어도 없어도 되는 것이라면 고통을 피해도 손해가 없어 앞 문장과 부딪침.","unimportant(중요하지 않은): 고통이 별것 아니라면 \"No pain, no gain(고통 없이는 얻는 것도 없다)\"에 진실이 있을 수 없음."],"om":["필수적인","무관한","선택적인","중요하지 않은"],"en":"This is because pain is actually an essential component of our ability to maintain a neutral state","ko":"이는 고통이 사실 중립 상태를 유지하는 우리 능력의 필수 구성 요소이기 때문이다","hl":["an essential component","This is because"],"khl":["필수 구성 요소","이는"],"blocks":[{"t":"p","h":"This is because(이는 ~이기 때문이다)가 묻는 것","x":["앞 문장: 고통을 피하면 더 비참해진다.","왜? 이 문장이 그 이유다.","고통이 꼭 필요한 것이어야 피했을 때 손해가 난다.","unnecessary(불필요한)를 넣으면 피해도 아무 일 없어야 맞는데, 앞 문장은 더 비참해진다고 했다."]},{"t":"tap","h":"질문 하나","q":"actually(사실)가 왜 붙었을까?","a":["사람들은 보통 고통을 쓸모없다고 생각한다.","그 생각을 뒤집는 신호가 actually(사실)다.","\"사실 고통은 꼭 필요하다\"로 읽어야 뒤집기가 된다."]}],"post":["essential(필수적인) ↔ unnecessary(불필요한)","고통 = 저울의 필수 부품"]}],"quiz":[{"w": leepiest","가장 졸린","n"]]}],"sets":[{"items":[{"slots":[["masterfully","clumsily","a"],["doubt"],["adequacy"],["current"],["itch"]],"opts":["masterfully","carelessly","reluctantly","accidentally"],"or":["masterfully(노련하게): 이 순환이 욕구를 만드는 데 완전한 효력을 낸다고 했으니 솜씨 좋은 제조사라 맞음.","carelessly(부주의하게): 대충 한 일이 소비자 욕구를 이렇게 완벽하게 바꿀 수는 없음.","reluctantly(마지못해): 제조사는 새 제품을 팔고 싶어 하니 마지못해 할 이유가 없음.","accidentally(우연히): 매년 새 버전을 내놓는 건 계획된 일이지 우연이 아님."],"om":["노련하게","부주의하게","마지못해","우연히"],"en":"Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices.","ko":"제조사들은 우리가 지금 쓰는 기기가 충분한지에 대해 노련하게 의심의 씨앗을 뿌린다.","hl":["masterfully sow seeds of doubt","Manufacturers"],"khl":["노련하게 의심의 씨앗을 뿌린다","제조사들은"],"blocks":[{"t":"flow","h":"글의 길","x":["제조사가 노련하게 의심의 씨앗을 뿌림","멀쩡한 폰이 갑자기 구닥다리로 보임","진짜 필요도 없는데 바꾸고 싶어짐","폰을 넘어 차·냉장고까지 번짐","논리로 알아도 유혹은 여전히 강력"],"at":0},{"t":"p","h":"결과를 보면 솜씨가 보인다","x":["글 중간에 the utter efficacy(완전한 효력)라는 말이 나온다.","이 순환이 우리 욕구를 완벽하게 바꿔 놓는다는 뜻이다.","그런 결과를 만든 사람이 서툴 리 없다.","clumsily(서투르게)를 넣으면 결과와 솜씨가 따로 논다."]}],"post":["masterfully(노련하게) ↔ clumsily(서투르게)","제조사 = 의심의 씨앗을 뿌리는 노련한 농부"]},{"slots":[["current","existing","s"],["itch","reluctance","a"],["genuine","real","s"],["confined"],["an_unstoppable"]],"opts":["itch","refusal","hesitation","failure"],"or":["itch(욕구): 내 폰이 구닥다리로 보이니 바꾸고 싶어 근질거리는 마음이 시작되어 맞음.","refusal(거부): 바꾸기를 거부한다면 업그레이드 순환이 시작될 수 없음.","hesitation(망설임): And thus(그래서)는 앞의 의심이 낳은 결과를 말하는데, 의심의 결과는 망설임이 아니라 바꾸고 싶은 마음임.","failure(실패): 업그레이드에 실패하는 게 시작된다는 건 앞뒤 흐름과 상관없음."],"om":["욕구","거부","망설임","실패"],"en":"Suddenly, the phone that was your lifeline a year ago is now a museum piece, unable to keep pace with your digital demands. And thus, the itch to upgrade begins, often before there’s a genuine need.","ko":"갑자기, 1년 전에는 생명줄 같던 휴대폰이 이제는 박물관 소장품이 되어, 당신의 디지털 요구를 따라가지 못한다. 그래서 업그레이드하고 싶은 욕구가 시작되는데, 진짜 필요가 생기기도 전인 경우가 많다.","hl":["the itch to upgrade begins","a museum piece"],"khl":["업그레이드하고 싶은 욕구가 시작되는데","박물관 소장품"],"blocks":[{"t":"p","h":"itch(근질거림)의 그림","x":["모기 물린 곳이 근질거리면 자꾸 긁고 싶다.","itch(근질거림)는 참기 힘든 \"하고 싶은 마음\"으로도 쓴다.","내 폰이 구닥다리로 보이는 순간, 바꾸고 싶어 근질거린다."]},{"t":"p","h":"And thus(그래서)가 정하는 방향","x":["앞: 멀쩡한 폰이 박물관 소장품처럼 보인다.","그래서: 바꾸고 싶어진다.","reluctance(꺼림)를 넣으면 \"그래서 바꾸기 싫어진다\"가 되어 원인과 결과가 반대로 간다."]},{"t":"p","h":"함정","x":["existing(기존의)은 current(현재의)와, real(진짜의)은 genuine(진짜의)과 같은 뜻이다.","a real need(진짜 필요)처럼 관사와도 잘 붙는다.","고칠 곳은 하나뿐."]}],"post":["itch(욕구) ↔ reluctance(꺼림)","구닥다리처럼 보이는 폰 → 바꾸고 싶은 근질거림"]},{"slots":[["confined","limited","s"],["an_unstoppable"],["revolutionize","ruin","a"],["fascinating"],["disturbing"]],"opts":["revolutionize","complicate","limit","burden"],"or":["revolutionize(혁명적으로 바꾸다): 새 세대 제품이 내거는 거창한 약속이라 맞음.","complicate(복잡하게 만들다): 삶을 복잡하게 해 주겠다고 약속하는 광고는 없음.","limit(제한하다): 삶을 제한하겠다는 약속은 사람을 끌어들일 수 없음.","burden(부담을 지우다): 짐을 지우겠다고 약속하면 아무도 다음 버전을 원하지 않음."],"om":["혁명적으로 바꾸다","복잡하게 만들다","제한하다","부담을 지우다"],"en":"Every product seems to be on an unstoppable march towards the next version, the next generation that promises to revolutionize your life.","ko":"모든 제품이 다음 버전, 즉 당신의 삶을 혁명적으로 바꿔 주겠다고 약속하는 다음 세대를 향해 멈출 수 없는 행진을 하고 있는 것 같다.","hl":["promises to revolutionize your life","the next generation"],"khl":["삶을 혁명적으로 바꿔 주겠다고 약속하는","다음 세대"],"blocks":[{"t":"tap","h":"질문 하나","q":"신제품 광고는 보통 뭐라고 약속할까?","a":["\"당신의 삶이 완전히 달라집니다.\"","좋은 쪽으로 확 바꿔 준다는 약속이다.","promises(약속하다) 뒤에는 듣기 좋은 말이 와야 한다.","ruin(망치다)을 넣으면 \"삶을 망쳐 드리겠습니다\"라고 약속하는 셈이다."]},{"t":"p","h":"그대로 둘 단어","x":["limited(제한된)는 confined(국한된) 자리에 넣어도 \"디지털 기기에만 한정되지 않는다\"가 된다.","뒤의 to(~에)와도 그대로 붙는다."]}],"post":["revolutionize(혁명적으로 바꾸다) ↔ ruin(망치다)","다음 세대 제품의 약속 = 삶을 확 바꿔 드림"]},{"slots":[["disturbing"],["utter"],["efficacy","weakness","a"],["newest"],["blurs"]],"opts":["efficacy","failure","uselessness","absence"],"or":["efficacy(효력): 우리가 필요하다고 믿게 될 만큼 이 순환이 욕구를 잘 만들어 내니 맞음.","failure(실패): 순환이 실패한다면 사람들이 계속 업그레이드할 리 없음.","uselessness(쓸모없음): 쓸모없는 순환이라면 유혹이 여전히 강력하다는 마지막 문장과 부딪침.","absence(없음): 이 순환은 이미 차·냉장고까지 번져 있어 없다고 할 수 없음."],"om":["효력","실패","쓸모없음","없음"],"en":"What’s fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires. It’s not so much that we want the newest device; we’re led to believe we need it.","ko":"흥미로운 점, 혹은 어쩌면 불안한 점은 우리의 욕구를 형성하는 데 있어 이 순환이 지닌 완전한 효력이다. 우리가 최신 기기를 원한다기보다는, 우리가 그것을 필요로 한다고 믿도록 이끌린다는 것이다.","hl":["the utter efficacy of this cycle","we’re led to believe we need it"],"khl":["완전한 효력","필요로 한다고 믿도록 이끌린다"],"blocks":[{"t":"p","h":"다음 문장이 증거","x":["바로 다음 문장: 우리는 필요하다고 믿도록 이끌린다.","원하지도 않던 것을 필요하다고 믿게 만든다.","이보다 센 효과가 있을까.","weakness(약함)를 넣으면 \"순환이 욕구를 못 바꾼다\"가 되어 다음 문장이 설 자리가 없다."]},{"t":"p","h":"disturbing(불안하게 하는)과 함께 읽기","x":["효과가 너무 좋아서 불안하다는 말이다.","약한 순환이었다면 불안할 이유도 없다."]}],"post":["efficacy(효력) ↔ weakness(약함)","순환의 힘 = 원하지 않던 걸 필요하다고 믿게 함"]},{"slots":[["newest","latest","s"],["blurs"],["logical","rational","s"],["ceaseless","occasional","a"],["compelling"]],"opts":["ceaseless","rare","brief","temporary"],"or":["ceaseless(끊임없는): 다음 버전, 또 다음 버전으로 멈추지 않는 순환을 가리키니 맞음.","rare(드문): 매년 바꾸고 싶어지는 이야기이니 드물지 않음.","brief(짧은): 짧게 끝나는 업그레이드라면 순환이라고 부를 수 없음.","temporary(일시적인): 잠깐이면 멈출 수 없는 행진이라는 앞의 표현과 부딪침."],"om":["끊임없는","드문","짧은","일시적인"],"en":"For all the logical arguments against this ceaseless upgrading, the temptation remains compelling.","ko":"이 끝없는 업그레이드에 반대하는 온갖 논리적인 주장에도 불구하고, 그 유혹은 여전히 강력하다.","hl":["this ceaseless upgrading","the temptation remains compelling"],"khl":["이 끝없는 업그레이드","여전히 강력하다"],"blocks":[{"t":"p","h":"this(이)가 가리키는 것","x":["this(이)는 앞에서 말한 업그레이드를 다시 가리킨다.","앞에서 그 업그레이드는 cycle(순환), unstoppable march(멈출 수 없는 행진)였다.","그러니 this(이) 뒤에도 같은 성격의 말이 붙어야 한다.","occasional(가끔의)을 넣으면 앞에서 그린 그림과 다른 업그레이드가 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","latest(최신의)는 newest(가장 새로운)와, rational(합리적인)은 logical(논리적인)과 같은 뜻이다.","the latest device(최신 기기)처럼 자연스럽게 쓰인다."]}],"post":["ceaseless(끊임없는) ↔ occasional(가끔의)","업그레이드 = 멈추지 않고 도는 순환"]}],"quiz":[{"w":"masterfully","m":"노련하게, 능숙하게","it":[["skillfully","능숙하게","s"],["clumsily","서투르게","a"],["sadly","슬프게","n"],["expertly","전문가답게, 능숙하게","s"],["awkwardly","어색하게, 서투르게","a"],["hourly","매시간","n"],["silently","조용히","n"]]},{"w":"itch","m":"(~하고 싶은) 욕구","it":[["urge","충동, 욕구","s"],["reluctance","꺼림","a"],["ladder","사다리","n"],["craving","갈망","s"],["aversion","싫어함, 혐오","a"],["pebble","조약돌","n"],["blanket","담요","n"]]},{"w":"revolutionize","m":"혁명적으로 바꾸다","it":[["transform","완전히 바꾸다","s"],["preserve","보존하다","a"],["sneeze","재채기하다","n"],["reshape","새로 만들다, 개조하다","s"],["maintain","유지하다","a"],["whistle","휘파람 불다","n"],["kneel","무릎 꿇다","n"]]},{"w":"efficacy","m":"효력, 효과","it":[["effectiveness","효과, 유효성","s"],["ineffectiveness","효과 없음","a"],["carpet","카펫","n"],["potency","효능, 힘","s"],["uselessness","쓸모없음","a"],["harbor","항구","n"],["thunder","천둥","n"]]},{"w":"ceaseless","m":"끊임없는","it":[["endless","끝없는","s"],["occasional","가끔의","a"],["spicy","매운","n"],["incessant","끊임없는","s"],["intermittent","간헐적인","a"],["curly","곱슬곱슬한","n"],["honest","정직한","n"]]}]},{"items":[{"slots":[["masterfully","skillfully","s"],["doubt","confidence","a"],["adequacy"],["current"],["itch"]],"opts":["doubt","pride","praise","certainty"],"or":["doubt(의심): 지금 폰이 충분한지 의심하게 만들어야 바꾸고 싶어지므로 맞음.","pride(자부심): 지금 기기에 자부심을 심어 주면 사람들은 안 바꿈.","praise(칭찬): 제조사가 이미 팔린 기기를 칭찬하면 새 제품이 안 팔림.","certainty(확신): 지금 기기가 충분하다고 확신하게 되면 업그레이드할 이유가 사라짐."],"om":["의심","자부심","칭찬","확신"],"en":"Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices. Suddenly, the phone that was your lifeline a year ago is now a museum piece","ko":"제조사들은 우리가 지금 쓰는 기기가 충분한지에 대해 노련하게 의심의 씨앗을 뿌린다. 갑자기, 1년 전에는 생명줄 같던 휴대폰이 이제는 박물관 소장품이 된다","hl":["seeds of doubt","now a museum piece"],"khl":["의심의 씨앗","박물관 소장품"],"blocks":[{"t":"p","h":"씨앗 비유 따라가기","x":["씨앗을 뿌리면 시간이 지나 싹이 튼다.","의심의 씨앗이 싹트면 \"내 폰, 이걸로 괜찮나?\"가 된다.","그 싹이 자라 다음 문장의 박물관 소장품이 된다.","confidence(확신)의 씨앗이었다면 \"내 폰 아직 쓸 만해\"가 되어 업그레이드가 시작되지 않는다."]},{"t":"p","h":"그대로 둘 단어","x":["skillfully(능숙하게)는 masterfully(노련하게)와 같은 뜻이다."]}],"post":["doubt(의심) ↔ confidence(확신)","의심의 씨앗 → 멀쩡한 폰이 구닥다리로"]},{"slots":[["doubt"],["adequacy"],["current","future","a"],["itch"],["genuine"]],"opts":["current","upcoming","imaginary","ideal"],"or":["current(현재의): 의심의 대상은 1년 전부터 쓰던 지금 폰이라 맞음.","upcoming(곧 나올): 곧 나올 기기는 제조사가 팔려는 물건이라 의심을 심을 대상이 아님.","imaginary(상상의): 상상의 기기가 충분한지 의심할 일은 없음.","ideal(이상적인): 이상적인 기기라면 애초에 부족할 리 없음."],"om":["현재의","곧 나올","상상의","이상적인"],"en":"Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices. Suddenly, the phone that was your lifeline a year ago is now a museum piece","ko":"제조사들은 우리가 지금 쓰는 기기가 충분한지에 대해 노련하게 의심의 씨앗을 뿌린다. 갑자기, 1년 전에는 생명줄 같던 휴대폰이 이제는 박물관 소장품이 된다","hl":["our current devices","the phone that was your lifeline a year ago"],"khl":["지금 쓰는 기기","1년 전에는 생명줄 같던 휴대폰"],"blocks":[{"t":"p","h":"누가 무엇을 의심하게 하나","x":["제조사가 원하는 것은 새 제품 판매.","그러려면 소비자가 지금 가진 걸 못마땅하게 여겨야 한다.","다음 문장의 예시도 1년 전부터 쓰던 바로 그 폰이다.","future(미래의) 기기를 의심하게 하면 제조사는 자기가 팔 물건을 깎아내리는 셈이다."]}],"post":["current(현재의) ↔ future(미래의)","의심의 대상 = 지금 내 손의 폰"]},{"slots":[["an_unstoppable","a relentless","s"],["revolutionize","transform","s"],["fascinating"],["disturbing","reassuring","a"],["utter"]],"opts":["disturbing","comforting","harmless","encouraging"],"or":["disturbing(불안하게 하는): 원하지도 않던 걸 필요하다고 믿게 될 만큼 휘둘린다는 건 걱정스러운 일이라 맞음.","comforting(위안이 되는): 우리 욕구가 조종당한다는 사실은 위안이 될 수 없음.","harmless(해가 없는): 재정적 우선순위까지 바꿔 놓는다고 했으니 해가 없다고 할 수 없음.","encouraging(고무적인): 끝없는 업그레이드를 비판하는 글에서 좋은 소식처럼 말할 리 없음."],"om":["불안하게 하는","위안이 되는","해가 없는","고무적인"],"en":"What’s fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires.","ko":"흥미로운 점, 혹은 어쩌면 불안한 점은 우리의 욕구를 형성하는 데 있어 이 순환이 지닌 완전한 효력이다.","hl":["or perhaps disturbing","shaping our desires"],"khl":["어쩌면 불안한 점","욕구를 형성하는"],"blocks":[{"t":"p","h":"글쓴이의 말투","x":["글쓴이는 업그레이드를 칭찬하지 않는다.","temptation(유혹), led to believe(믿도록 이끌린다) 같은 말을 고른다.","우리가 조종당하고 있다는 걱정이 깔려 있다.","or perhaps(혹은 어쩌면)는 \"흥미롭다고만 하기엔 좀 무섭다\"로 한 단계 더 들어가는 말이다."]},{"t":"p","h":"reassuring(안심시키는)이 틀린 이유","x":["내 욕구가 남의 손에서 만들어진다.","이걸 안심된다고 할 사람은 없다.","a relentless(끈질긴), transform(완전히 바꾸다)은 원래 단어와 같은 방향이라 고치지 않는다."]}],"post":["disturbing(불안하게 하는) ↔ reassuring(안심시키는)","흥미롭지만 무서운 것 = 내 욕구가 만들어짐"]},{"slots":[["utter","sheer","s"],["efficacy"],["newest"],["blurs","sharpens","a"],["ceaseless","endless","s"]],"opts":["blurs","widens","strengthens","deepens"],"or":["blurs(흐려지다): 원하는 걸 필요하다고 믿게 되니 둘의 경계가 흐릿해져 맞음.","widens(넓어지다): 둘의 차이가 벌어진다면 원하는 것을 필요하다고 착각할 수 없음.","strengthens(강해지다): 구분이 강해지면 재정 우선순위가 유행 쪽으로 쏠릴 이유가 없음.","deepens(깊어지다): 구분이 깊어진다는 건 착각과 정반대 방향임."],"om":["흐려지다","넓어지다","강해지다","깊어지다"],"en":"It’s not so much that we want the newest device; we’re led to believe we need it. The distinction between want and need blurs","ko":"우리가 최신 기기를 원한다기보다는, 우리가 그것을 필요로 한다고 믿도록 이끌린다는 것이다. 원하는 것과 필요한 것 사이의 구분이 흐려진다","hl":["The distinction between want and need blurs","we’re led to believe we need it"],"khl":["구분이 흐려진다","필요로 한다고 믿도록 이끌린다"],"blocks":[{"t":"pair","h":"원래 그려야 할 선","x":[["want","원하는 것: 있으면 좋은 것"],["need","필요한 것: 없으면 곤란한 것"]]},{"t":"p","h":"선이 지워지는 순간","x":["갖고 싶을 뿐인 새 폰을 \"없으면 안 돼\"라고 믿는다.","원하는 것과 필요한 것 사이의 선이 지워진 것이다.","sharpens(뚜렷해지다)를 넣으면 선이 더 진해져서 착각이 일어날 수 없다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","sheer(순전한)는 utter(완전한)와 같은 뜻이고, endless(끝없는)는 ceaseless(끊임없는)와 같은 뜻이다.","둘 다 원래 문장의 힘을 그대로 지킨다."]}],"post":["blur(흐려지다) ↔ sharpen(뚜렷해지다)","갖고 싶은 것 = 필요한 것으로 착각"]},{"slots":[["newest"],["blurs"],["logical"],["ceaseless"],["compelling","weak","a"]],"opts":["compelling","faint","dull","feeble"],"or":["compelling(강력한): 논리로 반박해도 유혹이 꺾이지 않는다는 양보의 흐름이라 맞음.","faint(희미한): 유혹이 희미하다면 For all(~에도 불구하고)을 쓸 이유가 없음.","dull(시시한): 시시한 유혹이라면 사람들이 매년 업그레이드할 리 없음.","feeble(힘없는): 힘없는 유혹은 끝없는 업그레이드를 설명하지 못함."],"om":["강력한","희미한","시시한","힘없는"],"en":"For all the logical arguments against this ceaseless upgrading, the temptation remains compelling.","ko":"이 끝없는 업그레이드에 반대하는 온갖 논리적인 주장에도 불구하고, 그 유혹은 여전히 강력하다.","hl":["the temptation remains compelling","For all the logical arguments"],"khl":["여전히 강력하다","온갖 논리적인 주장에도 불구하고"],"blocks":[{"t":"p","h":"For all(~에도 불구하고)의 짝","x":["For all(~에도 불구하고) A, B 구조는 \"A인데도 B다\"라는 뜻이다.","A: 업그레이드에 반대하는 논리는 많다.","B에는 예상과 다른 말이 와야 한다.","그래도 유혹은 강하다, 이게 예상과 다른 말이다.","weak(약한)를 넣으면 \"논리가 많은데도 유혹은 약하다\"가 되어 양보가 성립하지 않는다."]},{"t":"tap","h":"글 전체를 한 줄로","q":"이 글을 한 줄로 줄이면?","a":["제조사가 만든 업그레이드 순환이 우리 욕구를 바꿔 놓는다.","머리로는 알아도 마음은 계속 끌린다."]}],"post":["compelling(강력한) ↔ weak(약한)","머리는 반대, 마음은 계속 끌림"]}],"quiz":[{"w":"doubt","m":"의심","it":[["uncertainty","불확실함","s"],["confidence","확신","a"],["pillow","베개","n"],["suspicion","의심, 의혹","s"],["certainty","확실성, 확신","a"],["violin","바이올린","n"],["breakfast","아침 식사","n"]]},{"w":"current","m":"현재의","it":[["present","현재의","s"],["former","예전의","a"],["muddy","진흙투성이의","n"],["existing","기존의, 현재 있는","s"],["past","지나간, 과거의","a"],["furry","털이 많은","n"],["round","둥근","n"]]},{"w":"disturbing","m":"불안하게 하는","it":[["troubling","걱정스러운","s"],["reassuring","안심시키는","a"],["wooden","나무로 된","n"],["unsettling","불안하게 만드는","s"],["comforting","위안이 되는","a"],["oval","타원형의","n"],["salty","짠","n"]]},{"w":"blur","m":"흐려지다","it":[["fade","희미해지다","s"],["sharpen","뚜렷해지다","a"],["bake","굽다","n"],["dim","흐릿해지다","s"],["clarify","분명하게 하다","a"],["swim","수영하다","n"],["knit","뜨개질하다","n"]]},{"w":"compelling","m":"강력한, 저항하기 힘든","it":[["powerful","강력한","s"],["weak","약한","a"],["rusty","녹슨","n"],["irresistible","저항할 수 없는","s"],["unconvincing","설득력 없는","a"],["chilly","쌀쌀한","n"],["hollow","속이 빈","n"]]}]}],"no":"24"},{"id":"2410g2-29","title":"어휘특훈 · 24년 10월 고2 29번","sub":"동물이 원하는 것을 장소로 알아내기","tpl":"Conditioned Place Preference is a way of finding out what animals want. Researchers train them to {associate} one place with an experience such as food or a {loud} noise and another place with something {completely} {different}, usually where nothing happens. The two places are made {obviously} different to make it as {easy} as possible for the animal to associate each place with what happened to it there. The animal’s {preference} for being in one place or another is {measured} both before and after its experiences in the two places. If there is a {shift} in where the animal chooses to spend its time for the {reward}, this suggests that it {liked} the experience and is trying to {repeat} it. Conversely, if it now {avoids} the place the stimulus appeared and starts to {prefer} the place it did not experience it, then this suggests that it found the stimulus {unpleasant}. For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to {relieve} pain, rather than where they have received saline whereas {healthy} mice developed no such preference. This suggests that the mice with cancer wanted the morphine.","fn":["*stimulus: 자극","*morphine: 모르핀(진통제)","*saline: 식염수"],"mean":{"associate":"연관 짓다","link":"연결하다","connect":"연결하다, 관련짓다","loud":"시끄러운, 큰 소리의","completely":"완전히","slightly":"약간, 조금","different":"다른","similar":"비슷한","obviously":"확연히, 분명히","subtly":"미묘하게, 티 나지 않게","easy":"쉬운","simple":"간단한, 쉬운","difficult":"어려운","preference":"선호, 더 좋아함","liking":"좋아함, 선호","measured":"동사 measure(측정하다)의 과거분사형. 측정되는","recorded":"동사 record(기록하다)의 과거분사형. 기록되는","assessed":"동사 assess(평가하다)의 과거분사형. 평가되는","shift":"변화, 이동","stability":"안정, 변함없음","reward":"보상","punishment":"벌","liked":"동사 like(좋아하다)의 과거형","enjoyed":"동사 enjoy(즐기다)의 과거형","hated":"동사 hate(몹시 싫어하다)의 과거형","repeat":"반복하다, 되풀이하다","avoids":"동사 avoid(피하다)의 3인칭 단수형","shuns":"동사 shun(피하다, 멀리하다)의 3인칭 단수형","seeks out":"동사 seek out(일부러 찾아가다)의 3인칭 단수형","prefer":"더 좋아하다, 선호하다","dislike":"싫어하다","unpleasant":"불쾌한","enjoyable":"즐거운","distressing":"괴로운, 고통스러운","disagreeable":"불쾌한, 싫은","relieve":"덜어 주다, 완화하다","ease":"덜어 주다, 누그러뜨리다","alleviate":"완화하다","worsen":"악화시키다","healthy":"건강한","sick":"아픈, 병든"},"comp":[{"no":"29","slots":[["associate","connect","s"],["loud"],["completely","slightly","a"],["different"],["obviously"]],"opts":["completely","partly","somewhat","hardly"],"or":["completely(완전히): 먹이·큰 소리가 있는 곳과 아무 일도 없는 곳의 차이라 맞음.","partly(부분적으로): 있음과 없음의 차이는 부분적인 차이가 아님.","somewhat(다소): 다소 다른 정도로는 다음 문장의 obviously different(확연히 다른)와 맞지 않음.","hardly(거의 ~않게): 거의 다르지 않다면 두 장소를 구별할 수 없어 실험이 안 됨."],"om":["완전히","부분적으로","다소","거의 ~않게"],"en":"Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.","ko":"연구자들은 동물들이 한 장소는 먹이나 시끄러운 소리 같은 경험과, 다른 장소는 완전히 다른 것과 연관 짓도록 훈련시키는데, 보통 그곳은 아무 일도 일어나지 않는 곳이다.","hl":["something completely different","food or a loud noise"],"khl":["완전히 다른 것","먹이나 시끄러운 소리"],"blocks":[{"t":"p","h":"차이의 크기 재기","x":["장소 A에는 먹이나 큰 소리가 있다.","장소 B에는 보통 아무 일도 없다.","있음과 없음은 조금이 아니라 통째로 다르다.","slightly(약간) 다르다고 하면 다음 문장 obviously different(확연히 다른)와도 어긋난다."]},{"t":"p","h":"그대로 둬야 하는 단어","x":["connect(연결하다)는 associate(연관 짓다) 자리에 써도 된다.","connect A with B(A를 B와 연결하다)로 자연스럽게 읽힌다."]}],"post":["completely(완전히) ↔ slightly(약간)","있음과 없음 = 통째로 다름"]},{"no":"29","slots":[["liked"],["repeat"],["avoids","seeks out","a"],["prefer"],["unpleasant","disagreeable","s"]],"opts":["avoids","approaches","visits","chooses"],"or":["avoids(피하다): 반대편 장소를 더 좋아하게 된다는 뒷말과 짝이 맞음.","approaches(다가가다): 자극이 있던 곳에 다가가면 불쾌했다는 결론이 나오지 않음.","visits(찾아가다): 찾아가는 행동은 앞 문장의 '좋았다' 쪽 신호임.","chooses(고르다): 그 장소를 고르면 반대편을 좋아하게 됐다는 말과 부딪침."],"om":["피하다","다가가다","찾아가다","고르다"],"en":"Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.","ko":"반대로, 동물이 이제 자극이 나타났던 장소를 피하고 그 자극을 겪지 않았던 장소를 더 좋아하기 시작한다면, 이것은 동물이 그 자극을 불쾌하게 느꼈다는 것을 보여 준다.","hl":["avoids the place the stimulus appeared","Conversely"],"khl":["자극이 나타났던 장소를 피하고","반대로"],"blocks":[{"t":"flow","h":"두 갈래 신호","x":["보상이 있던 곳 → 다시 찾아감","반대로","불쾌한 자극이 있던 곳 → 피함","자극이 없던 곳 → 더 좋아함"],"at":2},{"t":"p","h":"seeks out(일부러 찾아가다)을 넣으면","x":["싫은 자극이 있던 곳을 일부러 찾아가면서 반대쪽을 더 좋아하게 된다는 말이 된다.","한 문장 안에서 두 행동이 부딪친다.","disagreeable(불쾌한)은 unpleasant(불쾌한)와 같은 뜻이라 고칠 필요가 없다."]}],"post":["avoid(피하다) ↔ seek out(일부러 찾아가다)","싫었던 자극의 장소 = 피하는 곳"]}],"compquiz":[{"w":"completely","m":"완전히","it":[["entirely","전적으로","s"],["partly","부분적으로","a"],["nervously","초조하게","n"],["totally","완전히","s"],["partially","부분적으로","a"],["cheerfully","즐겁게","n"],["nightly","밤마다","n"]]},{"w":"avoid","m":"피하다","it":[["shun","피하다, 멀리하다","s"],["seek","찾다","a"],["knit","뜨개질하다","n"],["evade","피하다, 회피하다","s"],["confront","맞서다","a"],["bake","굽다","n"],["whistle","휘파람 불다","n"]]}],"sets":[{"items":[{"slots":[["associate"],["loud"],["completely"],["different","similar","a"],["obviously"]],"opts":["different","identical","familiar","matching"],"or":["different(다른): 먹이·큰 소리가 있는 곳과 아무 일도 없는 곳의 대비라 맞음.","identical(똑같은): 완전히 똑같은 것이면 두 장소를 구별할 수 없어 실험이 안 됨.","familiar(익숙한): 익숙한 것이 아니라 아무 일도 없는 곳이 비교 대상이라 맞지 않음.","matching(일치하는): 일치하는 경험이면 두 장소 사이의 차이가 사라짐."],"om":["다른","똑같은","익숙한","일치하는"],"en":"Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.","ko":"연구자들은 동물들이 한 장소는 먹이나 시끄러운 소리 같은 경험과, 다른 장소는 완전히 다른 것과 연관 짓도록 훈련시키는데, 보통 그곳은 아무 일도 일어나지 않는 곳이다.","hl":["completely different","nothing happens"],"khl":["완전히 다른 것","아무 일도 일어나지 않는"],"blocks":[{"t":"flow","h":"실험이 돌아가는 순서","x":["장소 A: 먹이나 큰 소리 같은 경험","장소 B: 보통 아무 일도 없음","두 장소를 확연히 다르게 꾸밈","경험 전후로 어디를 좋아하는지 측정","선호가 바뀌면 그 경험이 좋았다는 신호"],"at":1},{"t":"p","h":"similar(비슷한)를 넣고 다시 읽기","x":["장소 B에서는 보통 nothing happens(아무 일도 일어나지 않는다).","먹이가 나오는 곳과 아무 일도 없는 곳은 완전히 다르다.","similar(비슷한)를 넣으면 '완전히 비슷한 것'이 된다.","바로 뒤 '아무 일도 없음'과 부딪친다.","실험은 차이를 만들어야 비교가 된다."]}],"post":["different(다른) ↔ similar(비슷한)","한쪽은 먹이, 한쪽은 아무 일 없음"]},{"slots":[["associate","link","s"],["completely"],["obviously","subtly","a"],["easy","simple","s"],["preference"]],"opts":["obviously","barely","faintly","secretly"],"or":["obviously(확연히): 최대한 쉽게 구별하게 하려는 목적과 맞음.","barely(겨우): 겨우 다르면 구별이 어려워져 as easy as possible(최대한 쉽게)과 반대임.","faintly(희미하게): 희미한 차이는 동물이 알아채기 어려움.","secretly(몰래): 동물이 알아채야 하는 차이를 몰래 만들 이유가 없음."],"om":["확연히","겨우","희미하게","몰래"],"en":"The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there.","ko":"두 장소는 동물이 각 장소를 거기서 자기에게 일어난 일과 최대한 쉽게 연관 짓도록 확연히 다르게 만들어진다.","hl":["obviously different","as easy as possible"],"khl":["확연히 다르게","최대한 쉽게"],"blocks":[{"t":"p","h":"목적이 방법을 정한다","x":["to make it as easy as possible(최대한 쉽게 하려고)이 이 문장의 목적이다.","구별을 쉽게 하려면 차이가 커야 한다.","subtly(미묘하게) 다르게 만들면 동물이 헷갈린다.","목적과 방법이 거꾸로 간다."]},{"t":"p","h":"손대면 안 되는 두 단어","x":["link(연결하다)는 associate(연관 짓다) 자리에 넣어도 된다.","link A with B(A를 B와 연결하다)로 자연스럽다.","simple(간단한)도 easy(쉬운)와 같은 방향이다."]}],"post":["obviously(확연히) ↔ subtly(미묘하게)","구별을 쉽게 = 차이를 크게"]},{"slots":[["preference"],["measured","recorded","s"],["shift","stability","a"],["reward"],["liked"]],"opts":["shift","pause","limit","decline"],"or":["shift(변화): 전과 후를 비교해 달라진 점이 있다는 말이라 맞음.","pause(멈춤): 장소 선택에 멈춤이 있다는 말은 뜻이 통하지 않고 '좋아했다'는 결론도 안 나옴.","limit(한계): 장소 선택의 한계는 경험을 좋아했다는 증거가 되지 못함.","decline(감소): 무엇이 줄었는지 알 수 없고 '되풀이하려 한다'와 이어지지 않음."],"om":["변화","멈춤","한계","감소"],"en":"The animal’s preference for being in one place or another is measured both before and after its experiences in the two places. If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.","ko":"한 장소나 다른 장소에 있는 것에 대한 동물의 선호는 두 장소에서 경험하기 전과 후에 모두 측정된다. 동물이 보상을 위해 시간을 보내기로 고르는 장소에 변화가 있다면, 이것은 동물이 그 경험을 좋아했고 그것을 되풀이하려 한다는 것을 보여 준다.","hl":["a shift","both before and after"],"khl":["변화가 있다면","전과 후에 모두"],"blocks":[{"t":"pair","h":"앞뒤 문장 나란히","x":[["is measured both before and after","전과 후에 모두 잰다"],["If there is a shift","전과 후가 달라졌다면"]]},{"t":"p","h":"stability(안정)가 틀린 이유","x":["전과 후를 둘 다 재는 건 달라진 점을 찾기 위해서다.","stability(안정)를 넣으면 '머무는 곳이 그대로라면 그 경험이 좋았다'가 된다.","아무 변화가 없는데 좋아했다고 말할 근거는 없다.","recorded(기록되는)는 measured(측정되는) 자리에 넣어도 실험 내용이 그대로라 맞는 표현."]}],"post":["shift(변화) ↔ stability(안정)","전후 비교 → 달라졌으면 좋았다는 신호"]},{"slots":[["measured"],["shift"],["reward","punishment","a"],["liked"],["repeat"]],"opts":["reward","penalty","danger","boredom"],"or":["reward(보상): 좋아해서 되풀이하려 한다는 뒷부분과 맞음.","penalty(벌칙): 벌칙을 위해 머문다면 '좋아했다'는 결론과 부딪침.","danger(위험): 위험을 위해 시간을 보낸다는 건 말이 안 되고 좋아했다는 말과도 반대임.","boredom(지루함): 지루함을 얻으려고 머물 동물은 없고 되풀이하고 싶은 경험도 아님."],"om":["보상","벌칙","위험","지루함"],"en":"If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.","ko":"동물이 보상을 위해 시간을 보내기로 고르는 장소에 변화가 있다면, 이것은 동물이 그 경험을 좋아했고 그것을 되풀이하려 한다는 것을 보여 준다.","hl":["for the reward","liked the experience"],"khl":["보상을 위해","그 경험을 좋아했고"],"blocks":[{"t":"p","h":"같은 문장 안의 짝","x":["뒷부분에 liked(좋아했다)와 repeat(되풀이하다)가 나온다.","좋아서 되풀이하려는 것은 보상이다.","punishment(벌)를 넣으면 벌을 받으려고 그곳에 머물고 그걸 좋아했다는 말이 된다.","앞뒤가 맞지 않는다."]},{"t":"p","h":"다음 문장이 알려 주는 것","x":["다음 문장은 Conversely(반대로)로 시작한다.","거기서는 불쾌한 자극을 다룬다.","그러니 이 문장은 좋은 경험, 곧 보상 쪽 이야기다."]}],"post":["reward(보상) ↔ punishment(벌)","좋으면 그곳으로 되돌아감"]},{"slots":[["avoids","shuns","s"],["prefer"],["unpleasant","enjoyable","a"],["relieve","ease","s"],["healthy"]],"opts":["unpleasant","delightful","comforting","rewarding"],"or":["unpleasant(불쾌한): 피하고 다른 곳을 더 좋아하게 됐다는 행동과 맞음.","delightful(아주 기쁜): 기쁜 자극이면 그 장소를 피할 이유가 없음.","comforting(위안이 되는): 위안이 되는 자극이라면 오히려 그곳을 찾아감.","rewarding(보람 있는): 보람 있는 자극은 앞 문장의 보상 쪽 이야기라 Conversely(반대로)와 부딪침."],"om":["불쾌한","아주 기쁜","위안이 되는","보람 있는"],"en":"Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.","ko":"반대로, 동물이 이제 자극이 나타났던 장소를 피하고 그 자극을 겪지 않았던 장소를 더 좋아하기 시작한다면, 이것은 동물이 그 자극을 불쾌하게 느꼈다는 것을 보여 준다.","hl":["found the stimulus unpleasant","avoids the place"],"khl":["불쾌하게 느꼈다","장소를 피하고"],"blocks":[{"t":"p","h":"행동으로 마음 읽기","x":["피한다 → 싫었다.","동물의 행동을 보고 마음을 거꾸로 읽는 실험이다.","enjoyable(즐거운)을 넣으면 피하는데 즐거웠다는 말이 된다.","즐거웠다면 다시 찾아가야 맞다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","shuns(피하다)는 avoids(피하다)와 같은 뜻이다.","ease(덜어 주다)는 relieve(완화하다) 자리에 넣어도 a drug used to ease pain(통증을 덜어 주는 데 쓰이는 약)으로 자연스럽다."]}],"post":["unpleasant(불쾌한) ↔ enjoyable(즐거운)","피하는 장소 = 싫었던 자극의 장소"]}],"quiz":[{"w":"different","m":"다른","it":[["distinct","뚜렷이 다른","s"],["rapid","빠른","n"],["similar","비슷한","a"],["dissimilar","비슷하지 않은","s"],["wooden","나무로 된","n"],["identical","동일한","a"],["honest","정직한","n"]]},{"w":"obviously","m":"확연히, 분명히","it":[["clearly","분명히","s"],["subtly","미묘하게","a"],["loudly","큰 소리로","n"],["evidently","분명히, 눈에 띄게","s"],["politely","공손하게","n"],["vaguely","모호하게","a"],["weekly","매주","n"]]},{"w":"shift","m":"변화, 이동","it":[["change","변화","s"],["harvest","수확","n"],["stability","안정","a"],["switch","전환","s"],["ceiling","천장","n"],["constancy","불변, 한결같음","a"],["ladder","사다리","n"]]},{"w":"reward","m":"보상","it":[["prize","상","s"],["punishment","벌","a"],["recipe","요리법","n"],["bonus","보너스, 상여금","s"],["penalty","벌칙","a"],["tunnel","터널","n"],["opinion","의견","n"]]},{"w":"unpleasant","m":"불쾌한","it":[["disagreeable","불쾌한","s"],["pleasant","즐거운","a"],["annual","해마다의","n"],["distasteful","불쾌한","s"],["enjoyable","즐거운","a"],["metallic","금속의","n"],["northern","북쪽의","n"]]}]},{"items":[{"slots":[["loud"],["different"],["obviously"],["easy","difficult","a"],["preference"]],"opts":["easy","hard","confusing","risky"],"or":["easy(쉬운): 확연히 다르게 만든 이유가 구별을 쉽게 하려는 것이라 맞음.","hard(어려운): 어렵게 하려면 두 장소를 비슷하게 만들어야 하니 앞말과 부딪침.","confusing(헷갈리는): 헷갈리게 하려는 실험이면 확연히 다르게 만들 필요가 없음.","risky(위험한): 연관 짓기를 위험하게 만든다는 말은 실험 목적과 관계없음."],"om":["쉬운","어려운","헷갈리는","위험한"],"en":"The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there.","ko":"두 장소는 동물이 각 장소를 거기서 자기에게 일어난 일과 최대한 쉽게 연관 짓도록 확연히 다르게 만들어진다.","hl":["as easy as possible","made obviously different"],"khl":["최대한 쉽게","확연히 다르게 만들어진다"],"blocks":[{"t":"tap","h":"질문 하나","q":"두 장소를 왜 확연히 다르게 꾸밀까?","a":["동물이 헷갈리지 않게 하려고.","구별이 쉬워야 어디서 무슨 일이 있었는지 기억한다.","그래서 as easy as possible(최대한 쉽게)."]},{"t":"p","h":"difficult(어려운)를 넣으면","x":["'최대한 어렵게 하려고 확연히 다르게 만든다'가 된다.","확연히 다르게 만드는 건 쉽게 하려는 방법이다.","방법과 목적이 서로 반대로 간다."]}],"post":["easy(쉬운) ↔ difficult(어려운)","확연히 다른 두 장소 = 구별 쉽게"]},{"slots":[["preference","liking","s"],["measured","assessed","s"],["shift"],["liked","hated","a"],["repeat"]],"opts":["liked","feared","resented","dreaded"],"or":["liked(좋아했다): 되풀이하려 한다는 뒷말과 같은 방향이라 맞음.","feared(두려워했다): 두려운 경험은 되풀이하지 않고 피함.","resented(분하게 여겼다): 분한 경험을 다시 하려 할 이유가 없음.","dreaded(몹시 무서워했다): 무서운 경험은 다음 문장 Conversely(반대로)에서 다루는 쪽임."],"om":["좋아했다","두려워했다","분하게 여겼다","몹시 무서워했다"],"en":"If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.","ko":"동물이 보상을 위해 시간을 보내기로 고르는 장소에 변화가 있다면, 이것은 동물이 그 경험을 좋아했고 그것을 되풀이하려 한다는 것을 보여 준다.","hl":["liked the experience","is trying to repeat it"],"khl":["좋아했고","되풀이하려 한다"],"blocks":[{"t":"p","h":"and(그리고)로 묶인 두 행동","x":["liked(좋아했다)와 is trying to repeat(되풀이하려 한다)가 and(그리고)로 묶여 있다.","둘은 같은 방향이어야 한다.","hated(몹시 싫어했다)를 넣으면 싫은데 되풀이하려 한다는 말이 된다.","싫은 일을 일부러 다시 하러 가는 동물은 없다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["liking(좋아함)은 preference(선호) 자리에 넣어도 뜻이 같다.","assessed(평가되는)는 measured(측정되는)와 같은 쪽 말이다.","선호를 재는 실험이니 둘 다 자연스럽다."]}],"post":["liked(좋아했다) ↔ hated(몹시 싫어했다)","좋았으니 다시 그 자리로"]},{"slots":[["liked","enjoyed","s"],["repeat"],["avoids"],["prefer","dislike","a"],["unpleasant"]],"opts":["prefer","fear","leave","escape"],"or":["prefer(더 좋아하다): 자극이 있던 곳을 피했으니 반대편을 좋아하게 된다는 흐름이라 맞음.","fear(두려워하다): 자극을 겪지 않은 곳은 두려워할 이유가 없음.","leave(떠나다): 두 곳을 다 떠난다는 말이 되어 선호 비교가 사라짐.","escape(달아나다): 아무 일도 없던 곳에서 달아날 이유가 없음."],"om":["더 좋아하다","두려워하다","떠나다","달아나다"],"en":"Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.","ko":"반대로, 동물이 이제 자극이 나타났던 장소를 피하고 그 자극을 겪지 않았던 장소를 더 좋아하기 시작한다면, 이것은 동물이 그 자극을 불쾌하게 느꼈다는 것을 보여 준다.","hl":["starts to prefer the place it did not experience it","avoids the place the stimulus appeared"],"khl":["겪지 않았던 장소를 더 좋아하기 시작한다면","자극이 나타났던 장소를 피하고"],"blocks":[{"t":"pair","h":"두 장소를 나란히","x":[["avoids the place the stimulus appeared","자극이 있던 곳은 피한다"],["starts to prefer the place it did not experience it","자극이 없던 곳은 더 좋아한다"]]},{"t":"p","h":"dislike(싫어하다)가 틀린 이유","x":["두 장소 중 하나를 피하면 남은 곳으로 간다.","dislike(싫어하다)를 넣으면 두 곳을 다 싫어하는 셈이다.","그러면 어느 쪽 자극이 싫었는지 알 수 없다.","enjoyed(즐겼다)는 liked(좋아했다)와 같은 뜻이라 그대로 둔다."]}],"post":["prefer(더 좋아하다) ↔ dislike(싫어하다)","싫은 곳을 피하면 남은 곳을 좋아함"]},{"slots":[["avoids"],["prefer"],["unpleasant"],["relieve","worsen","a"],["healthy"]],"opts":["relieve","cause","increase","spread"],"or":["relieve(완화하다): 아픈 쥐만 모르핀 장소를 좋아했다는 결과와 맞음.","cause(일으키다): 통증을 일으키는 약이면 그 장소를 피해야 함.","increase(늘리다): 통증을 늘리는 약을 원했다는 건 마지막 문장과 부딪침.","spread(퍼뜨리다): 통증을 퍼뜨리는 약은 말이 안 되고 선호의 이유도 안 됨."],"om":["완화하다","일으키다","늘리다","퍼뜨리다"],"en":"For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.","ko":"예를 들어, 암에 걸린 쥐는 식염수를 받았던 곳보다 통증을 덜어 주는 데 쓰이는 약인 모르핀을 받았던 장소를 더 좋아하는 반면, 건강한 쥐는 그런 선호가 생기지 않았다.","hl":["a drug used to relieve pain","mice with cancer"],"khl":["통증을 덜어 주는 데 쓰이는 약","암에 걸린 쥐"],"blocks":[{"t":"p","h":"예시를 따라가 보기","x":["암에 걸린 쥐는 아프다.","모르핀은 그 아픔을 덜어 준다.","그래서 아픈 쥐만 모르핀 받은 곳을 좋아했다.","worsen(악화시키다)을 넣으면 통증을 더 심하게 하는 약이 된다.","그런 약을 받은 곳을 좋아할 리 없다."]},{"t":"p","h":"마지막 문장과 맞추기","x":["This suggests that the mice with cancer wanted the morphine.(이것은 암에 걸린 쥐가 모르핀을 원했다는 것을 보여 준다.)","원했다는 건 그 약이 쥐에게 좋은 것이었다는 뜻이다."]}],"post":["relieve(완화하다) ↔ worsen(악화시키다)","아픈 쥐만 진통제 받은 곳을 좋아함"]},{"slots":[["easy"],["reward"],["unpleasant","distressing","s"],["relieve","alleviate","s"],["healthy","sick","a"]],"opts":["healthy","injured","weak","infected"],"or":["healthy(건강한): 암에 걸린 쥐와 맞세우는 비교 대상이라 맞음.","injured(다친): 다친 쥐도 통증이 있어 모르핀을 원할 수 있으니 대조가 안 됨.","weak(약한): 약한 쥐는 아픈 쥐와 같은 편이라 whereas(~인 반면)의 대조가 흐려짐.","infected(감염된): 감염된 쥐도 병든 쥐라 건강한 비교군이 되지 못함."],"om":["건강한","다친","약한","감염된"],"en":"For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.","ko":"예를 들어, 암에 걸린 쥐는 식염수를 받았던 곳보다 통증을 덜어 주는 데 쓰이는 약인 모르핀을 받았던 장소를 더 좋아하는 반면, 건강한 쥐는 그런 선호가 생기지 않았다.","hl":["healthy mice developed no such preference","whereas"],"khl":["건강한 쥐는 그런 선호가 생기지 않았다","반면"],"blocks":[{"t":"p","h":"대조 구조","x":["whereas(~인 반면)는 앞뒤를 맞세우는 연결어다.","앞: 암에 걸린 쥐는 모르핀 장소를 좋아함.","뒤: 다른 쥐는 그런 선호가 없음.","맞서려면 뒤의 쥐는 아프지 않아야 한다.","sick(아픈)을 넣으면 아픈 쥐끼리 비교하는 셈이라 대조가 무너진다."]},{"t":"tap","h":"한 번 더 생각","q":"건강한 쥐는 왜 모르핀 장소를 좋아하지 않았을까?","a":["덜어 낼 통증이 없으니까.","약 자체가 좋은 게 아니라 아픔이 줄어드는 게 좋았던 것."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","distressing(괴로운)은 unpleasant(불쾌한) 자리에, alleviate(완화하다)는 relieve(완화하다) 자리에 들어가도 뜻이 같다."]}],"post":["healthy(건강한) ↔ sick(아픈)","통증 없는 쥐 = 모르핀 장소에 관심 없음"]}],"quiz":[{"w":"easy","m":"쉬운","it":[["simple","간단한","s"],["difficult","어려운","a"],["purple","보라색의","n"],["effortless","힘들지 않은","s"],["hard","어려운","a"],["ancient","고대의","n"],["thirsty","목마른","n"]]},{"w":"like","m":"좋아하다","it":[["enjoy","즐기다","s"],["dislike","싫어하다","a"],["borrow","빌리다","n"],["adore","아주 좋아하다","s"],["hate","몹시 싫어하다","a"],["paint","칠하다","n"],["arrive","도착하다","n"]]},{"w":"prefer","m":"더 좋아하다, 선호하다","it":[["favor","더 좋아하다","s"],["reject","거부하다","a"],["deliver","배달하다","n"],["choose","고르다, 택하다","s"],["dislike","싫어하다","a"],["sneeze","재채기하다","n"],["polish","닦다","n"]]},{"w":"relieve","m":"덜어 주다, 완화하다","it":[["ease","덜어 주다","s"],["worsen","악화시키다","a"],["swallow","삼키다","n"],["alleviate","완화하다","s"],["aggravate","악화시키다","a"],["fold","접다","n"],["count","세다","n"]]},{"w":"healthy","m":"건강한","it":[["fit","건강한","s"],["sick","아픈","a"],["silent","조용한","n"],["sound","건강한, 탄탄한","s"],["ill","병든","a"],["square","네모난","n"],["foreign","외국의","n"]]}]}],"no":"29"},{"id":"2410g2-30","title":"어휘특훈 · 24년 10월 고2 30번","sub":"새들이 번식하는 시기와 방식","tpl":"Near the equator, many species of bird breed all year round. But in {temperate} and polar regions, the breeding seasons of birds are often {sharply} defined. They are {triggered} mainly by changes in day length. If all goes well, the {outcome} is that birds raise their young when the food supply is at its {peak}. Most birds are not simply {reluctant} to breed at other times but they are also physically {incapable} of doing so. This is because their reproductive system {shrinks}, which helps flying birds {save} weight. The main exception to this rule are nomadic desert species. These can {initiate} their breeding cycle within days of rain. It’s for making the most of the {sudden} breeding opportunity. Also, different species {divide} the breeding season up in different ways. Most seabirds raise a {single} brood. In {warm} regions, however, songbirds may raise {several} families in a few months. In an exceptionally {good} year, a pair of House Sparrows, a kind of songbird, can raise {successive} broods through a marathon reproductive effort.","fn":["*equator: 적도","*reproductive: 번식의","*nomadic: 떠돌아다니는, 유목의","*brood: 한 배의 새끼들"],"mean":{"temperate":"온대의, 온화한","tropical":"열대의","sharply":"뚜렷하게, 분명하게","clearly":"분명하게","vaguely":"모호하게, 흐릿하게","triggered":"동사 trigger(촉발하다)의 과거분사형. 촉발되는","prompted":"동사 prompt(유발하다)의 과거분사형. 유발되는","set off":"동사 set off(촉발하다, 일으키다)의 과거분사형. 촉발되는","outcome":"결과","result":"결과","peak":"정점, 최고조","lowest":"형용사 low(낮은)의 최상급. 가장 낮은 상태","reluctant":"꺼리는, 내키지 않는","eager":"열망하는, 몹시 하고 싶어 하는","unwilling":"내키지 않는","incapable":"~할 수 없는","capable":"~할 수 있는","shrinks":"동사 shrink(줄어들다)의 3인칭 단수형","expands":"동사 expand(팽창하다, 커지다)의 3인칭 단수형","contracts":"동사 contract(수축하다)의 3인칭 단수형","save":"아끼다, 덜다(여기서는 무게를 덜다)","gain":"늘리다, 얻다","initiate":"시작하다, 개시하다","terminate":"끝내다","begin":"시작하다","sudden":"갑작스러운","gradual":"점진적인","unexpected":"예상치 못한","divide":"나누다","split":"나누다, 쪼개다","single":"단 하나의","warm":"따뜻한","cold":"추운","several":"여러, 몇몇의","multiple":"여러, 다수의","fewer":"형용사 few(적은)의 비교급. 더 적은","good":"좋은","poor":"형편없는, 나쁜","successive":"연속적인, 잇따른","consecutive":"연이은, 연속적인"},"comp":[{"no":"30","slots":[["peak"],["reluctant"],["incapable","capable","a"],["shrinks"],["save"]],"opts":["incapable","fond","proud","aware"],"or":["incapable(~할 수 없는): 번식 기관이 줄어든다는 다음 문장의 이유와 맞음.","fond(좋아하는): physically fond of(신체적으로 좋아하는)는 말이 안 되고 꺼린다는 앞말과도 반대임.","proud(자랑스러워하는): 번식을 자랑스러워한다는 건 기관이 줄어든다는 이유와 상관없음.","aware(알고 있는): 알고 있다는 말은 몸이 따라 주지 않는다는 내용을 담지 못함."],"om":["~할 수 없는","좋아하는","자랑스러워하는","알고 있는"],"en":"Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so. This is because their reproductive system shrinks, which helps flying birds save weight.","ko":"대부분의 새들은 다른 시기에 번식하기를 단지 꺼리는 것이 아니라 신체적으로 그렇게 할 수도 없다. 이것은 새들의 번식 기관이 줄어들기 때문인데, 이것은 나는 새들이 몸무게를 줄이는 데 도움이 된다.","hl":["physically incapable of doing so","This is because"],"khl":["신체적으로 그렇게 할 수도 없다","이것은 새들의 번식 기관이 줄어들기 때문"],"blocks":[{"t":"p","h":"This is because(이것은 ~때문이다)가 받쳐 주는 말","x":["뒤 문장은 앞 문장의 이유다.","이유: 번식 기관이 줄어든다.","기관이 줄면 몸이 번식할 수 없다.","capable(~할 수 있는)을 넣으면 이유와 결과가 서로 맞지 않는다."]},{"t":"p","h":"physically(신체적으로)라는 말","x":["physically(신체적으로)는 마음이 아니라 몸 이야기다.","몸의 기관이 줄었으니 할 수 '없다'가 짝이다."]}],"post":["incapable(~할 수 없는) ↔ capable(~할 수 있는)","번식 기관 축소 = 몸이 번식 불가"]},{"no":"30","slots":[["sudden","unexpected","s"],["divide"],["single"],["warm"],["several","fewer","a"]],"opts":["several","few","no","zero"],"or":["several(여러): 한 배뿐인 바닷새와 맞서는 however(그러나) 뒤라 맞음.","few(거의 없는): 거의 기르지 않는다면 바닷새와 대조가 안 됨.","no(하나도 없는): 하나도 안 기른다면 다음 문장의 연달아 번식하는 참새와 부딪침.","zero(0의): 0이면 번식 자체가 없어 '몇 달 사이'라는 말이 의미 없음."],"om":["여러","거의 없는","하나도 없는","0의"],"en":"Most seabirds raise a single brood. In warm regions, however, songbirds may raise several families in a few months.","ko":"대부분의 바닷새는 한 배의 새끼만 기른다. 그러나 따뜻한 지역에  해 놓고 다시 번식기가 딱 정해져 있다고 하면 앞뒤가 부딪친다.","polar(극지의)와 나란히 서려면 적도에서 먼 쪽 말이어야 한다."]}],"post":["temperate(온대의) ↔ tropical(열대의)","적도 = 일 년 내내, 온대·극지 = 정해진 철"]},{"slots":[["sharply","clearly","s"],["triggered","prompted","s"],["peak"],["reluctant","eager","a"],["incapable"]],"opts":["reluctant","keen","anxious","ready"],"or":["reluctant(꺼리는): 몸도 안 된다는 but also(~도 또한) 뒷말과 같은 방향이라 맞음.","keen(열심인): 번식하고 싶어 한다는 뜻이라 같은 방향으로 잇는 연결이 깨짐.","anxious(몹시 ~하고 싶어 하는): anxious to(몹시 ~하고 싶어 하는)는 바라는 쪽이라 '할 수도 없다'와 짝이 안 맞음.","ready(준비된): 준비가 됐다면 신체적으로 할 수 없다는 말과 부딪침."],"om":["꺼리는","열심인","몹시 ~하고 싶어 하는","준비된"],"en":"Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.","ko":"대부분의 새들은 다른 시기에 번식하기를 단지 꺼리는 것이 아니라 신체적으로 그렇게 할 수도 없다.","hl":["not simply reluctant","physically incapable"],"khl":["단지 꺼리는 것이 아니라","신체적으로 그렇게 할 수도 없다"],"blocks":[{"t":"p","h":"not simply A but also B","x":["not simply A but also B(단지 A일 뿐만 아니라 B이기도 하다)는 A와 B가 같은 방향이다.","B는 '몸이 따라 주지 않는다'.","그러니 A도 '안 하려 한다' 쪽이어야 한다.","eager(열망하는)를 넣으면 '몹시 하고 싶은 데다 몸도 안 된다'가 되어 연결이 어색해진다.","번식기가 아닐 때는 마음도 몸도 번식과 멀다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이어도 고칠 곳은 하나다.","clearly(분명하게)는 sharply(뚜렷하게) 자리에, prompted(유발된)는 triggered(촉발된) 자리에 넣어도 뜻이 통한다."]}],"post":["reluctant(꺼리는) ↔ eager(열망하는)","철이 아닐 때 = 마음도 몸도 번식 X"]},{"slots":[["outcome","result","s"],["reluctant"],["incapable"],["shrinks","expands","a"],["save"]],"opts":["shrinks","swells","enlarges","strengthens"],"or":["shrinks(줄어들다): 무게를 줄이는 데 도움이 된다는 뒷말과 맞음.","swells(부풀다): 부풀면 무거워져 save weight(무게를 덜다)와 반대임.","enlarges(커지다): 커지면 신체적으로 번식할 수 없다는 앞 문장의 이유가 되지 못함.","strengthens(강해지다): 기관이 강해지면 오히려 번식할 수 있어 incapable(~할 수 없는)과 부딪침."],"om":["줄어들다","부풀다","커지다","강해지다"],"en":"This is because their reproductive system shrinks, which helps flying birds save weight.","ko":"이것은 새들의 번식 기관이 줄어들기 때문인데, 이것은 나는 새들이 몸무게를 줄이는 데 도움이 된다.","hl":["reproductive system shrinks","save weight"],"khl":["번식 기관이 줄어들기","몸무게를 줄이는"],"blocks":[{"t":"flow","h":"원인에 ich helps flying birds save weight.","ko":"대부분의 새들은 다른 시기에 번식하기를 단지 꺼리는 것이 아니라 신체적으로 그렇게 할 수도 없다. 이것은 새들의 번식 기관이 줄어들기 때문인데, 이것은 나는 새들이 몸무게를 줄이는 데 도움이 된다.","hl":["save weight","flying birds"],"khl":["몸무게를 줄이는","나는 새들"],"blocks":[{"t":"p","h":"flying(나는)이라는 단어에 주목","x":["날아다니는 새에게 무게는 짐이다.","쓰지 않는 기관을 줄이면 몸이 가벼워진다.","gain(늘리다)을 넣으면 줄어드는 기관이 무게를 늘려 준다는 말이 된다.","줄어드는데 무거워질 수는 없다."]},{"t":"p","h":"그대로 두는 단어","x":["contracts(수축하다)는 shrinks(줄어들다)와 같은 뜻이다.","오히려 이 단어가 '가벼워진다'의 근거다."]}],"post":["save(덜다) ↔ gain(늘리다)","쓰지 않는 기관 줄이기 = 몸 가볍게"]},{"slots":[["initiate"],["sudden","gradual","a"],["divide"],["single"],["several"]],"opts":["sudden","slow","planned","yearly"],"or":["sudden(갑작스러운): 언제 올지 모르는 비 뒤에 며칠 안에 시작한다는 내용과 맞음.","slow(느린): 느리게 오는 기회라면 며칠 안에 서두를 이유가 없음.","planned(계획된): 사막의 비는 미리 계획할 수 없음.","yearly(해마다의): 해마다 정해진 기회라면 규칙의 예외가 될 수 없음."],"om":["갑작스러운","느린","계획된","해마다의"],"en":"These can initiate their breeding cycle within days of rain. It’s for making the most of the sudden breeding opportunity.","ko":"이 새들은 비가 온 뒤 며칠 안에 번식 주기를 시작할 수 있다. 그것은 갑작스러운 번식 기회를 최대한 활용하기 위해서다.","hl":["the sudden breeding opportunity","within days of rain"],"khl":["갑작스러운 번식 기회","비가 온 뒤 며칠 안에"],"blocks":[{"t":"p","h":"within days of rain(비가 온 뒤 며칠 안에)","x":["사막의 비는 언제 올지 모른다.","비가 오면 기회가 갑자기 생긴다.","그래서 며칠 안에 서둘러 시작한다.","gradual(점진적인) 기회라면 서두를 필요가 없다."]},{"t":"p","h":"nomadic(떠돌아다니는)과 연결","x":["nomadic(떠돌아다니는) 새는 한곳에 머물지 않는다.","비를 따라 움직이다 기회가 오면 바로 잡는다.","갑작스러움에 맞춰 사는 새들이다."]}],"post":["sudden(갑작스러운) ↔ gradual(점진적인)","사막의 비 = 언제 올지 모르는 기회"]},{"slots":[["initiate","begin","s"],["single"],["several"],["good","poor","a"],["successive","consecutive","s"]],"opts":["good","harsh","bad","difficult"],"or":["good(좋은): 연달아 여러 배를 기르는 큰 노력은 조건이 좋은 해에만 가능함.","harsh(혹독한): 혹독한 해에는 한 번 키우기도 힘듦.","bad(나쁜): 나쁜 해에 가장 많이 번식한다는 건 먹이가 많을 때 기른다는 앞 내용과 반대임.","difficult(힘든): 힘든 해에는 마라톤 같은 번식을 버틸 수 없음."],"om":["좋은","혹독한","나쁜","힘든"],"en":"In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort.","ko":"유난히 좋은 해에는 명금류의 한 종류인 집참새 한 쌍이 마라톤 같은 번식 노력을 통해 연달아 여러 배의 새끼를 기를 수 있다.","hl":["exceptionally good year","a marathon reproductive effort"],"khl":["유난히 좋은 해","마라톤 같은 번식 노력"],"blocks":[{"t":"p","h":"마라톤에 필요한 것","x":["마라톤처럼 연달아 새끼를 기르려면 먹이가 넉넉해야 한다.","그래서 '유난히 좋은 해'에만 가능하다.","poor(형편없는)를 넣으면 먹이도 부족한 해에 오히려 가장 많이 번식한다는 말이 된다.","먹이가 많을 때 새끼를 키운다는 앞 흐름과도 부딪친다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","begin(시작하다)은 initiate(시작하다) 자리에, consecutive(연이은)는 successive(연속적인) 자리에 넣어도 뜻이 같다."]}],"post":["good(좋은) ↔ poor(형편없는)","유난히 좋은 해 = 연달아 번식하는 마라톤"]}],"quiz":[{"w":"sharply","m":"뚜렷하게","it":[["clearly","분명하게","s"],["vaguely","모호하게","a"],["weekly","매주","n"],["distinctly","뚜렷하게","s"],["faintly","희미하게","a"],["politely","공손하게","n"],["hungrily","배고프게","n"]]},{"w":"peak","m":"정점, 최고조","it":[["summit","정상, 꼭대기","s"],["bottom","바닥","a"],["recipe","요리법","n"],["height","절정, 한창","s"],["minimum","최저, 최소","a"],["blanket","담요","n"],["opinion","의견","n"]]},{"w":"save","m":"아끼다, 절약하다","it":[["conserve","아끼다, 보존하다","s"],["waste","낭비하다","a"],["swallow","삼키다","n"],["preserve","보존하다","s"],["spend","쓰다, 소비하다","a"],["whistle","휘파람 불다","n"],["fold","접다","n"]]},{"w":"sudden","m":"갑작스러운","it":[["abrupt","갑작스러운","s"],["gradual","점진적인","a"],["silent","조용한","n"],["unexpected","예상치 못한","s"],["expected","예상된","a"],["square","네모난","n"],["foreign","외국의","n"]]},{"w":"good","m":"좋은","it":[["favorable","유리한, 좋은","s"],["poor","형편없는","a"],["ancient","고대의","n"],["excellent","훌륭한","s"],["bad","나쁜","a"],["thirsty","목마른","n"],["northern","북쪽의","n"]]}]}],"no":"30"},{"id":"2410g2-33","title":"어휘특훈 · 24년 10월 고2 33번","sub":"읽기의 경계는 딱 잘라 정할 수 없다","tpl":"Some people {argue} that there is a single, logically {consistent} concept known as reading that can be {neatly} set apart from everything else people do with books. Is reading really that {simple}? The most {productive} way to think about reading is as a {loosely} related set of behaviors that belong together owing to family {resemblances}, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait. Consequently, efforts to {distinguish} reading from nonreading are {destined} to fail because there is no {agreement} on what qualifies as reading in the first place. The more one tries to figure out where the border lies between reading and not-reading, the more edge cases will be found to {stretch} the term’s {flexible} boundaries. Thus, it is worth attempting to {collect} together these {exceptional} forms of reading into a single forum, one highlighting the {challenges} faced by anyone wishing to establish the boundaries where reading begins and ends. The attempt moves toward an understanding of reading as a spectrum that is {expansive} enough to {accommodate} the distinct reading activities.","fn":["*Ludwig Wittgenstein: 루트비히 비트겐슈타인(철학자)","*trait: 특성","*edge case: 경계 사례, 특이 사례","*forum: 토론의 장","*spectrum: 범위, 스펙트럼"],"mean":{"argue":"주장하다","claim":"주장하다","consistent":"일관된","contradictory":"모순되는","neatly":"깔끔하게","cleanly":"깔끔하게, 깨끗이","simple":"단순한","complex":"복잡한","productive":"생산적인, 얻는 게 많은","unproductive":"비생산적인","fruitful":"유익한, 성과 있는","loosely":"느슨하게","tightly":"단단히, 빽빽하게","resemblances":"명사 resemblance(닮음, 유사성)의 복수형","differences":"명사 difference(차이)의 복수형","distinguish":"구분하다","separate":"분리하다, 떼어 놓다","destined":"~할 운명인, ~하게 되어 있는","doomed":"(실패 등을) 할 운명인","bound":"~하게 되어 있는","agreement":"합의, 동의","disagreement":"이견, 의견 불일치","stretch":"늘이다, 넓히다","extend":"넓히다, 늘이다","shrink":"줄이다","flexible":"유연한","rigid":"딱딱한, 굳은","collect":"모으다","scatter":"흩뿌리다","exceptional":"예외적인, 특이한","typical":"전형적인","unusual":"특이한, 흔치 않은","challenges":"명사 challenge(어려움, 도전)의 복수형","difficulties":"명사 difficulty(어려움)의 복수형","obstacles":"명사 obstacle(장애물)의 복수형","expansive":"넓은, 광범위한","broad":"넓은","narrow":"좁은","accommodate":"수용하다, 담다","exclude":"배제하다, 빼다"},"comp":[{"no":"33","slots":[["destined"],["agreement"],["stretch","shrink","a"],["flexible"],["collect"]],"opts":["str ,"om":["단순한","복잡한","신비로운","어려운"],"en":"Some people argue that there is a single, logically consistent concept known as reading that can be neatly set apart from everything else people do with books. Is reading really that simple?","ko":"어떤 사람들은 사람들이 책으로 하는 다른 모든 일과 깔끔하게 구분될 수 있는, 읽기라고 알려진 하나의 논리적으로 일관된 개념이 있다고 주장한다. 읽기는 정말 그렇게 단순할까?","hl":["really that simple","Some people argue"],"khl":["정말 그렇게 단순할까","어떤 사람들은"],"blocks":[{"t":"tap","h":"질문 하나","q":"필자는 이 질문에 '예'라고 답할까, '아니오'라고 답할까?","a":["아니오.","바로 다음 문장부터 읽기는 느슨한 행동 묶음이라고 말한다.","이 질문은 앞사람들의 '단순한 읽기'를 흔드는 장치다."]},{"t":"p","h":"complex(복잡한)를 넣으면","x":["'읽기가 정말 그렇게 복잡할까?'가 된다.","그런데 앞사람들은 읽기를 깔끔한 하나로 봤다.","복잡하다고 한 사람이 없으니 되물을 이유도 없다.","claim(주장하다)과 cleanly(깔끔하게)는 argue(주장하다), neatly(깔끔하게)와 같은 뜻이라 손대지 않는다."]}],"post":["simple(단순한) ↔ complex(복잡한)","질문 = 단순하다는 주장 흔들기"]},{"slots":[["productive"],["loosely","tightly","a"],["resemblances"],["distinguish"],["destined","doomed","s"]],"opts":["loosely","strictly","rigidly","firmly"],"or":["loosely(느슨하게): 공통 특성 하나 없이 닮음으로만 묶인다는 뒷말과 맞음.","strictly(엄격하게): 엄격하게 관련됐다면 공통 특성이 있어야 함.","rigidly(딱딱하게): 딱딱하게 묶인 관계는 가족처럼 닮은 관계와 거리가 멂.","firmly(단단히): 단단한 연결은 결정적 특성이 없다는 말과 부딪침."],"om":["느슨하게","엄격하게","딱딱하게","단단히"],"en":"The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait.","ko":"읽기를 생각하는 가장 생산적인 방법은, 루트비히 비트겐슈타인이 그 표현을 쓴 것처럼, 공통된 하나의 결정적 특성 없이 가족 유사성 때문에 함께 묶이는 느슨하게 관련된 행동들의 집합으로 보는 것이다.","hl":["loosely related","without having in common a single defining trait"],"khl":["느슨하게 관련된","공통된 하나의 결정적 특성 없이"],"blocks":[{"t":"p","h":"가족 사진으로 이해하기","x":["가족 사진을 보면 형은 아빠 눈을, 동생은 엄마 코를 닮았다.","모두에게 똑같은 한 가지는 없는데도 한 가족처럼 보인다.","읽기도 그렇다.","공통점 하나로 묶이지 않고 느슨하게 닮아 있다.","tightly(단단히)를 넣으면 '공통 특성 하나 없이'와 정면으로 부딪친다."]},{"t":"p","h":"그대로 두는 단어","x":["doomed(실패할 운명인)는 destined(~할 운명인) 자리에 들어가도 된다.","doomed to fail(실패할 운명인)로 자연스럽다."]}],"p
