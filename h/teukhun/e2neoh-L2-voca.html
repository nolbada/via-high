현저하게)와 같은 뜻이다.","call(부르다)도 name(이름 짓다) 자리에 넣으면 '이 현상을 Steve(스티브)라고 부르기로 했다'가 되어 자연스럽다."]}],"post":["unsure(확신하지 못하는) ↔ convinced(확신하는)","Steve(스티브) = 정체 모를 것에 붙인 이름"]}],"quiz":[{"w":"exceptional","m":"특출한, 뛰어난","it":[["outstanding","뛰어난","s"],["rainy","비 오는","n"],["mediocre","그저 그런","a"],["remarkable","놀라운, 뛰어난","s"],["wooden","나무로 된","n"],["ordinary","평범한","a"],["thirsty","목마른","n"]]},{"w":"strange","m":"이상한, 낯선","it":[["southern","남쪽의","n"],["odd","이상한","s"],["familiar","익숙한","a"],["juicy","즙이 많은","n"],["peculiar","기이한, 독특한","s"],["usual","보통의, 흔한","a"],["brave","용감한","n"]]},{"w":"stretch","m":"뻗다, 펼쳐지다","it":[["extend","뻗다, 이어지다","s"],["whisper","속삭이다","n"],["shrink","줄어들다","a"],["spread","펼쳐지다","s"],["bake","굽다","n"],["contract","수축하다","a"],["borrow","빌리다","n"]]},{"w":"similar","m":"비슷한","it":[["hungry","배고픈","n"],["akin","유사한, 비슷한","s"],["dissimilar","비슷하지 않은","a"],["plastic","플라스틱으로 된","n"],["comparable","비슷한, 견줄 만한","s"],["different","다른","a"],["lazy","게으른","n"]]},{"w":"unsure","m":"확신하지 못하는","it":[["uncertain","확신하지 못하는","s"],["wealthy","부유한","n"],["certain","확신하는","a"],["doubtful","의심스러운, 확신 없는","s"],["sticky","끈적거리는","n"],["confident","자신 있는, 확신하는","a"],["rural","시골의","n"]]}]},{"items":[{"slots":[["exceptional"],["notice","overlook","a"],["strange"],["appearing"],["unusual"]],"opts":["deny","forget","notice","hide"],"or":["deny(부인하다): 있는 것을 부인했다면 이름을 붙이고 사진을 찍을 리 없음.","forget(잊다): 잊기 시작했다면 빛의 길이, 지속 시간 같은 자세한 관찰이 나올 수 없음.","notice(알아채다): 다음 문장에서 그 빛을 자세히 묘사하고 몇 년 동안 사진까지 찍으니 '알아채기 시작했다'가 맞음.","hide(숨기다): 하늘에 나타난 빛을 숨긴다는 건 말이 안 되고, 사진을 나누던 단체와도 안 맞음."],"om":["부인하다","잊다","알아채다","숨기다"],"en":"In the summer of 2014, the group members began to notice something strange appearing in the night sky.","ko":"2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다.","hl":["began to notice something strange","in the night sky"],"khl":["알아채기 시작했다","밤하늘에"],"blocks":[{"t":"flow","h":"알아챈 뒤에 벌어진 일","x":["이상한 빛을 알아챔","색·길이·지속 시간을 관찰","Steve(스티브)라는 이름을 붙임","몇 년 동안 사진을 찍음","전문가에게 도움을 청함"],"at":0},{"t":"p","h":"overlook(못 보고 지나치다)이 안 되는 이유","x":["못 보고 지나쳤다면 이 뒤의 이야기가 하나도 일어날 수 없다.","이 단어 하나가 STEVE(스티브) 발견 이야기 전체의 출발점이다.","전문가들이 나중에 이들에게 공을 돌린 것도 먼저 알아챘기 때문이다."]}],"post":["notice(알아채다) ↔ overlook(못 보고 지나치다)","먼저 알아챈 사람들 = STEVE(스티브) 발견의 주인공"]},{"slots":[["exceptional","outstanding","s"],["strange","odd","s"],["appearing"],["unusual","typical","a"],["stretch"]],"opts":["unusual","common","standard","regular"],"or":["unusual(특이한): 앞 문장의 something strange(이상한 무언가)를 다시 받는 말이라 맞음.","common(흔한): 흔한 빛의 띠였다면 앞 문장에서 '이상한 무언가'라고 부를 수 없음.","standard(표준적인): 표준적인 빛이라면 정체를 몰라 이름을 지어 줄 이유가 없음.","regular(보통의): 늘 보는 빛이라면 전문가가 처음 보는 현상이라고 할 리 없음."],"om":["특이한","흔한","표준적인","보통의"],"en":"In the summer of 2014, the group members began to notice something strange appearing in the night sky. There were unusual ribbons of green and purple light, some of which seemed to stretch for thousands of kilometers.","ko":"2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다. 녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다.","hl":["unusual ribbons of green and purple light","something strange"],"khl":["특이한 빛의 띠","이상한 무언가"],"blocks":[{"t":"p","h":"typical(전형적인)을 넣고 다시 읽기","x":["\"녹색과 보라색의 전형적인 빛의 띠가 있었다.\"","바로 앞에서 이상한 무언가가 나타났다고 했다.","이상한 것을 가리키면서 전형적이라고 할 수는 없다.","게다가 이 빛은 몇 년 뒤 NASA(미국 항공우주국) 과학자도 처음 보는 현상이었다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","outstanding(뛰어난)은 exceptional(특출한)과, odd(이상한)는 strange(이상한)와 같은 뜻이다.","이 둘을 고쳤다면 철자만 본 것."]}],"post":["unusual(특이한) ↔ typical(전형적인)","녹색·보라색의 특이한 띠 = 아무도 본 적 없는 빛"]},{"slots":[["formed","disbanded","a"],["informal","casual","s"],["leave"],["try"],["exceptional"]],"opts":["formed","sold","punished","feared"],"or":["formed(결성했다): 뒤에서 사진을 the rest of the group(단체의 나머지 사람들)과 나누고, 2014년에도 the group members(단체 구성원들)가 함께 움직여서 맞음.","sold(팔았다): 자기들이 함께 활동하는 단체를 팔았다는 건 사진을 나누는 모임 이야기와 안 맞음.","punished(처벌했다): 단체를 처벌한다는 건 말이 안 되고, 이들은 그 단체의 구성원임.","feared(두려워했다): 두려워하는 단체와 매번 사진을 나눌 리 없음."],"om":["결성했다","팔았다","처벌했다","두려워했다"],"en":"In Alberta, Canada, there were some “aurora chasers” who formed an informal group online. They would leave their homes at night and try to get exceptional photographs of auroras. Then they would share them with the rest of the group.","ko":"캐나다 앨버타에는 온라인에서 비공식 단체를 결성한 몇몇 '오로라 추적자들'이 있었다. 그들은 밤에 집을 나서 오로라의 특별한 사진을 찍으려고 하곤 했다. 그런 다음 그 사진들을 단체의 나머지 사람들과 공유하곤 했다.","hl":["formed an informal group online","share them with the rest of the group"],"khl":["비공식 단체를 결성한","단체의 나머지 사람들과 공유하곤 했다"],"blocks":[{"t":"p","h":"the rest of the group(단체의 나머지 사람들)이 말해 주는 것","x":["사진을 찍은 뒤 the rest of the group(단체의 나머지 사람들)과 나눈다.","단체가 계속 있어야 이렇게 나눌 수 있다.","2014년 여름에도 the group members(단체 구성원들)가 함께 빛을 알아챈다.","disbanded(해체했다)를 넣으면 이미 없어진 단체와 사진을 나누는 셈이다."]},{"t":"p","h":"함정","x":["casual(격식 없는)은 informal(비공식적인)과 같은 뜻이라 고치지 않는다."]}],"post":["form(결성하다) ↔ disband(해체하다)","온라인 비공식 단체 = 오로라 추적자들의 사진 나눔터"]},{"slots":[["similar"],["possessed"],["notably"],["different","identical","a"],["Unsure"]],"opts":["familiar","different","common","matching"],"or":["familiar(익숙한): 익숙한 특징이라면 오로라와 비슷하다는 앞말과 같은 쪽이라 yet(그렇지만)이 어색함.","different(다른): yet(그렇지만) 앞의 '비슷한 생김새'와 대비되어 맞음.","common(흔한): 흔한 특징이라면 전문가도 정체를 몰랐다는 뒷이야기와 안 맞음.","matching(일치하는): 오로라와 일치하는 특징이라면 오로라가 아니라는 전문가의 확인과 부딪침."],"om":["익숙한","다른","흔한","일치하는"],"en":"They were similar in appearance to auroras, yet they possessed some notably different features.","ko":"그것들은 생김새가 오로라와 비슷했지만, 몇 가지 현저하게 다른 특징을 지니고 있었다.","hl":["notably different features","similar in appearance"],"khl":["현저하게 다른 특징","오로라와 비슷했지만"],"blocks":[{"t":"p","h":"identical(똑같은)을 넣고 다시 읽기","x":["\"오로라와 비슷했지만, 현저하게 똑같은 특징을 지녔다.\"","notably(현저하게)는 차이가 두드러질 때 어울리는 말이다.","'현저하게 똑같은'은 말 자체가 어색하다.","무엇보다 yet(그렇지만)이 대비를 만들지 못한다."]},{"t":"p","h":"뒷이야기와 연결","x":["이 '다른 특징' 때문에 전문가들은 오로라가 아니라고 확인했다.","새로운 유형의 현상이라는 결론도 여기서 나온다."]}],"post":["different(다른) ↔ identical(똑같은)","오로라를 닮았지만 다른 점 → 새로운 현상"]},{"slots":[["notably"],["different","distinct","s"],["Unsure","Uncertain","s"],["name"],["unfamiliar","everyday","a"]],"opts":["ordinary","obvious","identified","unfamiliar"],"or":["ordinary(평범한): 평범한 물체에 붙인 이름이라면 정체 모를 빛에 빌려 올 이유가 없음.","obvious(뻔한): 뻔히 아는 물체였다면 확신하지 못해서 이름을 지었다는 앞부분과 안 맞음.","identified(정체가 밝혀진): 정체가 밝혀진 물체의 이름은 '뭔지 모를 것'의 이름이 될 수 없음.","unfamiliar(낯선): 정체를 몰랐던 추적자들의 처지와 똑같아서 그 이름을 빌려 왔다는 흐름과 맞음."],"om":["평범한","뻔한","정체가 밝혀진","낯선"],"en":"Unsure of what they were, the group decided to name the phenomenon “Steve,” based on a scene from an animated movie where some characters give that name to an unfamiliar object.","ko":"그것들이 무엇인지 확신하지 못해서, 그 단체는 등장인물들이 낯선 물체에 그 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 'Steve'라고 이름 짓기로 했다.","hl":["give that name to an unfamiliar object","Unsure of what they were"],"khl":["낯선 물체에 그 이름을 붙이는","확신하지 못해서"],"blocks":[{"t":"tap","h":"질문 하나","q":"왜 하필 영화 속 그 장면에서 이름을 빌려 왔을까?","a":["영화 속 인물들도 처음 보는 낯선 것 앞에서 이름을 지었기 때문이다.","추적자들도 처음 보는 빛 앞에 서 있었다.","처지가 같아야 이름을 빌려 올 이유가 생긴다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","Uncertain(확신하지 못하는)은 Unsure(확신하지 못하는)와 같은 뜻이다.","distinct(뚜렷이 다른)는 different(다른)와 같은 방향이라 notably distinct features(현저하게 다른 특징)도 자연스럽다.","everyday(일상적인)만 이야기의 흐름을 거스른다."]}],"post":["unfamiliar(낯선) ↔ everyday(일상적인)","낯선 물체의 이름 → 낯선 빛의 이름 Steve(스티브)"]}],"quiz":[{"w":"notice","m":"알아채다, 알아차리다","it":[["observe","알아채다, 관찰하다","s"],["boil","끓다","n"],["overlook","못 보고 지나치다","a"],["spot","발견하다, 알아채다","s"],["sew","바느질하다","n"],["ignore","무시하다","a"],["rent","빌리다","n"]]},{"w":"unusual","m":"특이한, 흔치 않은","it":[["muddy","진흙투성이의","n"],["uncommon","흔하지 않은","s"],["typical","전형적인, 흔한","a"],["polite","공손한","n"],["rare","드문","s"],["usual","보통의, 흔한","a"],["tall","키가 큰","n"]]},{"w":"form","m":"(단체를) 결성하다, 형성하다","it":[["establish","설립하다","s"],["sneeze","재채기하다","n"],["dismantle","해체하다","a"],["set up","세우다, 결성하다","s"],["paint","칠하다","n"],["destroy","파괴하다","a"],["climb","오르다","n"]]},{"w":"different","m":"다른","it":[["cozy","아늑한","n"],["distinct","뚜렷이 다른","s"],["identical","똑같은","a"],["sour","신","n"],["dissimilar","비슷하지 않은","s"],["similar","비슷한","a"],["humble","겸손한","n"]]},{"w":"unfamiliar","m":"낯선, 익숙하지 않은","it":[["strange","낯선","s"],["loose","헐거운","n"],["familiar","익숙한","a"],["unknown","알려지지 않은","s"],["tasty","맛있는","n"],["well-known","잘 알려진","a"],["weekly","매주의","n"]]}]}],"no":"본문 ❺"},{"id":"e2-L2-2f","title":"어휘특훈 · 영어II 2과 본문 ⑥+⑦","sub":"STEVE라는 이름 + 누구나 시민 과학자","tpl":"After photographing Steve for several years and discussing what it might be, the group members decided to get help from {experts}. They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA. {Surprisingly}, neither of them had any idea what Steve was. They {confirmed} that it was not an aurora, but it did not {resemble} anything they had seen before. They realized that the group had discovered a {new} type of phenomenon that had never been properly studied. In order to learn more about it, NASA funded a citizen science project involving the public. The project asked ordinary people to {gather} photos of Steve and send them to NASA. It is still in progress today. In honor of the aurora chasers who first discovered the phenomenon, the name “Steve” has been {kept}. However, it is now written in all capital letters and stands for “Strong Thermal Emission Velocity Enhancement.” Experts have {acknowledged} that it is the {dedicated} members of the aurora chasers group that deserve the {credit} for discovering STEVE. If it had not been for them, it might have remained {unnoticed} forever. There are many interesting theories about STEVE, but none of them have been proven for certain. Scientists and citizens continue to {collaborate} to solve this mystery, and they are learning more and more about STEVE every day. Most of the individuals involved in these two projects are not {professional} scientists. Instead, they are citizen scientists—ordinary people who desire to help {advance} science in areas that they are interested in. Even though citizen scientists may not have science degrees or long, white lab coats, they are still {capable} of making {valuable} contributions to science. You can become one as well if you have {curiosity} and an interest in {taking_part} in scientific research. The next great scientific achievement could be made by citizen scientists volunteering their time for the purpose of better understanding the world.","fn":["*phenomenon: 현상","*capital letter: 대문자","*thermal emission: 열 방출","*velocity: 속도","*enhancement: 증대, 향상","*degree: 학위"],"mean":{"experts":"명사 expert(전문가)의 복수형","specialists":"명사 specialist(전문가)의 복수형","Surprisingly":"놀랍게도","Predictably":"예상대로","confirmed":"동사 confirm(확인해 주다)의 과거형","denied":"동사 deny(부인하다)의 과거형","resemble":"~을 닮다, ~와 비슷하다","new":"새로운","novel":"새로운, 참신한","gather":"모으다","scatter":"흩뿌리다, 흩어지게 하다","collect":"모으다","kept":"동사 keep(유지하다)의 과거분사형. has been kept = 유지되어 왔다","retained":"동사 retain(유지하다, 보유하다)의 과거분사형","discarded":"동사 discard(버리다)의 과거분사형","acknowledged":"동사 acknowledge(인정하다)의 과거분사형. have acknowledged = 인정했다","recognized":"동사 recognize(인정하다)의 과거분사형","dedicated":"헌신적인","halfhearted":"성의 없는, 마음이 내키지 않는","devoted":"헌신적인","credit":"공로, 인정","blame":"비난, 책임","unnoticed":"알아차려지지 않은, 눈에 띄지 않은","undetected":"발견되지 않은","noticed":"동사 notice(알아채다)의 과거분사형. 알아차려진","collaborate":"협력하다","professional":"전문적인, 직업적인","amateur":"아마추어의, 비전문가의","advance":"발전시키다, 진보시키다","promote":"촉진하다, 증진하다","hinder":"방해하다","capable":"~할 수 있는. capable of -ing = ~할 수 있는","incapable":"~할 수 없는","valuable":"귀중한, 소중한","meaningful":"의미 있는","worthless":"가치 없는","curiosity":"호기심","indifference":"무관심","taking part":"동사구 take part(참여하다)의 -ing형. 동명사","participating":"동사 participate(참여하다)의 -ing형. 동명사","engaging":"동사 engage(참여하다)의 -ing형. engage in ~ = ~에 참여하다"},"comp":[{"no":"본문 ❻❼","slots":[["dedicated","devoted","s"],["credit"],["unnoticed","noticed","a"],["collaborate"],["professional"]],"opts":["famous","celebrated","explained","unnoticed"],"or":["famous(유명한): 그들이 없었다면 유명해졌을 거라는 건 공로를 돌리는 앞 문장과 정반대임.","celebrated(널리 알려진): 발견한 사람이 없는데 널리 알려진 채로 남을 수는 없음.","explained(설명된): 지금도 어떤 이론도 확실히 증명되지 않은 수수께끼라 '설명된 채로'와 안 맞음.","unnoticed(알아차려지지 않은): 추적자들이 없었다면 아무도 몰랐을 거라는 말이라 맞음."],"om":["유명한","널리 알려진","설명된","알아차려지지 않은"],"en":"Experts have acknowledged that it is the dedicated members of the aurora chasers group that deserve the credit for discovering STEVE. If it had not been for them, it might have remained unnoticed forever.","ko":"전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람은 바로 오로라 추적자 단체의 헌신적인 구성원들이라는 것을 인정했다. 그들이 없었다면 STEVE는 영원히 알려지지 않은 채로 남았을지도 모른다.","hl":["remained unnoticed forever","If it had not been for them"],"khl":["영원히 알려지지 않은 채로","그들이 없었다면"],"blocks":[{"t":"p","h":"가정법 과거완료 다시 읽기","x":["If it had not been for them(그들이 없었다면)은 실제와 반대로 상상하는 말이다.","실제: 그들이 있었고, STEVE(스티브)는 발견되었다.","상상: 그들이 없었다면, 아무도 몰랐을 것이다.","noticed(알아차려진)를 넣으면 그들이 없어도 다들 알았을 거라는 말이 되어 공로가 사라진다."]},{"t":"p","h":"함정","x":["devoted(헌신적인)는 dedicated(헌신적인)와 같은 뜻이라 고치지 않는다."]}],"post":["unnoticed(알아차려지지 않은) ↔ noticed(알아차려진)","추적자들이 없었다면 영원히 묻혔을 빛"]},{"no":"본문 ❻❼","slots":[["professional"],["advance"],["capable"],["valuable","worthless","a"],["curiosity"]],"opts":["valuable","harmful","fake","careless"],"or":["valuable(귀중한): 7천5백만 건의 분류와 STEVE(스티브) 발견처럼 과학에 큰 도움이 된 기여라 맞음.","harmful(해로운): 과학에 해로운 기여는 말 자체가 모순이고 두 사례와도 반대임.","fake(가짜의): 가짜 기여라면 전문가들이 공로를 인정했을 리 없음.","careless(부주의한): 꼼꼼히 분류하고 몇 년간 관찰한 두 사례와 맞지 않음."],"om":["귀중한","해로운","가짜의","부주의한"],"en":"Even though citizen scientists may not have science degrees or long, white lab coats, they are still capable of making valuable contributions to science.","ko":"시민 과학자들에게는 과학 학위나 길고 흰 실험실 가운이 없을지도 모르지만, 그들은 여전히 과학에 귀중한 기여를 할 수 있다.","hl":["valuable contributions to science","may not have science degrees"],"khl":["귀중한 기여","과학 학위나"],"blocks":[{"t":"flow","h":"글 전체가 모으는 증거","x":["Galaxy Zoo(갤럭시 주): 8만 명 이상이 7천5백만 건 분류","오로라 추적자: 새로운 현상 STEVE(스티브) 발견","결론: 학위 없는 시민도 귀중한 기여를 함"],"at":2},{"t":"p","h":"worthless(가치 없는)가 틀린 이유","x":["두 사례 모두 전문가 혼자서는 해낼 수 없던 일이다.","Schawinski(샤빈스키) 혼자 했다면 수십 년이 걸렸을 것이다.","추적자들이 없었다면 STEVE(스티브)는 영원히 묻혔을 것이다.","이런 기여를 worthless(가치 없는)라고 부를 수는 없다."]}],"post":["valuable(귀중한) ↔ worthless(가치 없는)","학위 없는 시민의 귀중한 기여 두 가지"]}],"compquiz":[{"w":"unnoticed","m":"알아차려지지 않은","it":[["unseen","눈에 띄지 않은","s"],["crunchy","바삭한","n"],["noticed","알아차려진","a"],["undetected","발견되지 않은","s"],["annual","해마다의","n"],["observed","관찰된","a"],["spicy","매운","n"]]},{"w":"valuable","m":"귀중한, 소중한","it":[["windy","바람 부는","n"],["precious","귀중한","s"],["worthless","가치 없는","a"],["oily","기름진","n"],["worthwhile","가치 있는","s"],["useless","쓸모없는","a"],["sleepy","졸린","n"]]}],"sets":[{"items":[{"slots":[["experts"],["Surprisingly","Predictably","a"],["confirmed"],["resemble"],["new"]],"opts":["Naturally","Obviously","Normally","Surprisingly"],"or":["Naturally(당연히): 전문가가 모르는 게 당연하다면 일부러 전문가를 찾아간 이유가 없어짐.","Obviously(분명히): 전문가가 모르는 걸 뻔한 일로 말하면 새 현상을 발견했다는 놀라움이 사라짐.","Normally(보통은): 보통 전문가는 아는 게 정상이라 '보통은 둘 다 몰랐다'는 앞뒤가 안 맞음.","Surprisingly(놀랍게도): 천문학 교수와 NASA(미국 항공우주국) 과학자조차 몰랐다는 건 뜻밖이라 맞음."],"om":["당연히","분명히","보통은","놀랍게도"],"en":"They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA. Surprisingly, neither of them had any idea what Steve was.","ko":"그들은 Steve의 사진을 지역 대학의 천문학 교수와 NASA의 과학자에게 보여 주었다. 놀랍게도 그 둘 중 누구도 Steve가 무엇인지 전혀 알지 못했다.","hl":["Surprisingly, neither of them had any idea","a scientist at NASA"],"khl":["놀랍게도","NASA의 과학자"],"blocks":[{"t":"flow","h":"본문 ❻의 흐름","x":["몇 년간 사진을 찍고 토론함","전문가에게 사진을 보여 줌","전문가도 정체를 모름","새로운 현상임을 깨달음","NASA(미국 항공우주국)가 시민 과학 프로젝트 지원"],"at":2},{"t":"p","h":"Predictably(예상대로)가 틀린 이유","x":["전문가를 찾아간 건 그들이 답을 알 거라고 기대했기 때문이다.","그런데 둘 다 몰랐다.","기대가 빗나갔으니 '놀랍게도'다.","Predictably(예상대로)를 넣으면 전문가가 모를 줄 알면서 찾아간 셈이 된다."]}],"post":["surprisingly(놀랍게도) ↔ predictably(예상대로)","천문학 교수도 NASA(미국 항공우주국) 과학자도 모른 빛"]},{"slots":[["new","novel","s"],["gather","scatter","a"],["kept","retained","s"],["acknowledged"],["dedicated"]],"opts":["gather","delete","sell","hide"],"or":["gather(모으다): 모은 사진을 NASA(미국 항공우주국)에 보내는 순서라 맞음.","delete(지우다): 지운 사진은 보낼 수 없어 and send them(그리고 그것들을 보내다)과 부딪침.","sell(팔다): 판 사진을 다시 NASA(미국 항공우주국)에 보낼 수는 없음.","hide(숨기다): 숨긴 사진으로는 연구를 도울 수 없어 시민 과학 프로젝트의 목적과 반대임."],"om":["모으다","지우다","팔다","숨기다"],"en":"In order to learn more about it, NASA funded a citizen science project involving the public. The project asked ordinary people to gather photos of Steve and send them to NASA.","ko":"그것에 대해 더 알아보기 위해 NASA는 대중이 참여하는 시민 과학 프로젝트에 자금을 지원했다. 그 프로젝트는 일반인들에게 Steve의 사진을 모아 NASA에 보내 달라고 요청했다.","hl":["gather photos of Steve and send them to NASA","involving the public"],"khl":["Steve의 사진을 모아 NASA에 보내","대중이 참여하는"],"blocks":[{"t":"p","h":"and(그리고)로 이어진 두 동작","x":["사진을 모은다. 그리고 그것들을 보낸다.","send them(그것들을 보내다)의 them(그것들)은 모은 사진이다.","scatter(흩뿌리다)를 넣으면 사진을 흩어 놓고 다시 보내라는 엉뚱한 부탁이 된다.","NASA(미국 항공우주국)가 원한 건 사진을 한곳으로 모으는 일이다."]},{"t":"p","h":"함정","x":["novel(새로운)은 new(새로운)와 같은 뜻이고 a novel type(새로운 유형)도 자연스럽다.","retained(유지되었다)는 kept(유지되었다)와 같은 뜻이라 둘 다 맞는 표현."]}],"post":["gather(모으다) ↔ scatter(흩뿌리다)","시민이 모은 사진을 NASA(미국 항공우주국)로"]},{"slots":[["kept"],["acknowledged","recognized","s"],["dedicated","halfhearted","a"],["credit"],["unnoticed"]],"opts":["dedicated","lazy","careless","reluctant"],"or":["dedicated(헌신적인): 몇 년 동안 밤마다 사진을 찍고 토론한 사람들이라 맞음.","lazy(게으른): 몇 년씩 밤에 나가 사진을 찍은 사람들을 게으르다고 할 수 없음.","careless(부주의한): 부주의했다면 오로라와 다른 미묘한 특징을 알아채지 못했을 것임.","reluctant(마지못해 하는): 스스로 단체를 만들고 몇 년을 매달린 사람들이라 '마지못해'와 안 맞음."],"om":["헌신적인","게으른","부주의한","마지못해 하는"],"en":"Experts have acknowledged that it is the dedicated members of the aurora chasers group that deserve the credit for discovering STEVE.","ko":"전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람은 바로 오로라 추적자 단체의 헌신적인 구성원들이라는 것을 인정했다.","hl":["the dedicated members of the aurora chasers group","deserve the credit"],"khl":["헌신적인 구성원들","공로를 인정받아야 할"],"blocks":[{"t":"tap","h":"질문 하나","q":"이 사람들이 Steve(스티브)를 위해 한 일은?","a":["밤마다 집을 나서 사진을 찍었다.","몇 년 동안 사진을 찍고 정체를 토론했다.","직접 전문가를 찾아갔다.","이런 사람들에게 붙는 말은 halfhearted(성의 없는)가 아니라 dedicated(헌신적인)다."]},{"t":"p","h":"함정","x":["recognized(인정했다)는 acknowledged(인정했다)와 같은 뜻이라 고치지 않는다."]}],"post":["dedicated(헌신적인) ↔ halfhearted(성의 없는)","몇 년간 밤하늘을 지킨 헌신적인 추적자들"]},{"slots":[["collaborate"],["professional","amateur","a"],["advance"],["capable"],["valuable"]],"opts":["ordinary","volunteer","professional","curious"],"or":["ordinary(평범한): Instead(대신) 뒤에서 그들을 바로 평범한 사람들이라고 하니 '평범한 과학자가 아니다'와 부딪침.","volunteer(자원봉사하는): 마지막 문장에서 시민 과학자들이 시간을 자발적으로 내준다고 하니 '자원봉사 과학자가 아니다'와 모순임.","professional(전문적인): Instead(대신) 뒤의 citizen scientists(시민 과학자들), 즉 평범한 사람들과 대비를 이루어 맞음.","curious(호기심 많은): 호기심이 있으면 누구나 시민 과학자가 될 수 있다는 뒤 내용과 정반대임."],"om":["평범한","자원봉사하는","전문적인","호기심 많은"],"en":"Most of the individuals involved in these two projects are not professional scientists. Instead, they are citizen scientists—ordinary people who desire to help advance science in areas that they are interested in.","ko":"이 두 프로젝트에 참여한 사람들 대부분은 전문 과학자가 아니다. 대신 그들은 시민 과학자들, 즉 자신이 관심 있는 분야에서 과학의 발전을 돕고 싶어 하는 평범한 사람들이다.","hl":["not professional scientists","Instead, they are citizen scientists"],"khl":["전문 과학자가 아니다","대신 그들은 시민 과학자들"],"blocks":[{"t":"pair","h":"Instead(대신) 앞뒤","x":[["not professional scientists","전문 과학자가 아니다"],["citizen scientists—ordinary people","시민 과학자, 즉 평범한 사람들"]]},{"t":"p","h":"amateur(아마추어)를 넣으면","x":["\"아마추어 과학자가 아니다. 대신 평범한 사람들이다.\"","평범한 사람이 바로 아마추어다.","Instead(대신)가 뒤집을 것이 없어진다.","글 첫머리의 흰 가운 과학자와 마지막의 시민 과학자가 짝을 이루는 구조도 무너진다."]}],"post":["professional(전문적인) ↔ amateur(아마추어의)","두 프로젝트의 주인공 = 전문가 아닌 시민 과학자"]},{"slots":[["professional"],["advance","promote","s"],["capable","incapable","a"],["valuable"],["taking_part","participating","s"]],"opts":["afraid","tired","ashamed","capable"],"or":["afraid(두려워하는): 기여하기를 두려워한다는 말은 누구나 시민 과학자가 될 수 있다는 다음 문장과 부딪침.","tired(지친): 기여에 지쳤다는 말은 지금도 활발히 참여한다는 두 사례와 안 맞음.","ashamed(부끄러워하는): 귀중한 기여를 부끄러워한다는 건 말이 안 되고 글의 응원하는 말투와도 반대임.","capable(~할 수 있는): Even though(비록 ~이지만) 학위가 없어도 still(여전히) 기여할 수 있다는 양보의 흐름과 맞음."],"om":["두려워하는","지친","부끄러워하는","~할 수 있는"],"en":"Even though citizen scientists may not have science degrees or long, white lab coats, they are still capable of making valuable contributions to science.","ko":"시민 과학자들에게는 과학 학위나 길고 흰 실험실 가운이 없을지도 모르지만, 그들은 여전히 과학에 귀중한 기여를 할 수 있다.","hl":["still capable of making valuable contributions","Even though"],"khl":["여전히 과학에 귀중한 기여를 할 수 있다","없을지도 모르지만"],"blocks":[{"t":"p","h":"Even though(비록 ~이지만) + still(여전히)","x":["Even though(비록 ~이지만) 뒤: 학위도 없고 흰 가운도 없다.","still(여전히) 뒤: 그래도 기여할 수 있다.","'없지만 그래도 할 수 있다'가 양보 문장의 짝이다.","incapable(~할 수 없는)을 넣으면 '없지만 여전히 못 한다'가 되어 짝이 깨진다."]},{"t":"p","h":"첫 문장과의 연결","x":["white lab coats(흰 실험실 가운)는 글 첫 문장에 나온 말이다.","처음엔 흰 가운이 과학자의 상징이었다.","마지막엔 흰 가운이 없어도 괜찮다고 말한다.","promote(증진하다), participating(참여하기)은 각각 advance(발전시키다), taking part(참여하기)와 같은 뜻이라 맞는 표현."]}],"post":["capable(~할 수 있는) ↔ incapable(~할 수 없는)","학위·흰 가운 없어도 과학에 기여 가능"]}],"quiz":[{"w":"surprisingly","m":"놀랍게도","it":[["unexpectedly","뜻밖에","s"],["quietly","조용히","n"],["predictably","예상대로","a"],["amazingly","놀랍게도","s"],["upstairs","위층에서","n"],["unsurprisingly","놀랄 것 없이, 예상대로","a"],["weekly","매주","n"]]},{"w":"gather","m":"모으다","it":[["sneeze","재채기하다","n"],["collect","모으다","s"],["scatter","흩뿌리다","a"],["giggle","킥킥 웃다","n"],["assemble","모으다","s"],["disperse","흩어지게 하다","a"],["sail","항해하다","n"]]},{"w":"dedicated","m":"헌신적인","it":[["devoted","헌신적인","s"],["salty","짠","n"],["halfhearted","성의 없는","a"],["committed","전념하는","s"],["square","정사각형의","n"],["indifferent","무관심한","a"],["frozen","얼어붙은","n"]]},{"w":"professional","m":"전문적인, 직업적인","it":[["rainy","비 오는","n"],["expert","전문가의, 숙련된","s"],["amateur","아마추어의","a"],["juicy","즙이 많은","n"],["skilled","숙련된","s"],["nonprofessional","비전문적인","a"],["tidy","깔끔한","n"]]},{"w":"capable","m":"~할 수 있는, 유능한","it":[["able","~할 수 있는","s"],["noisy","시끄러운","n"],["incapable","~할 수 없는","a"],["competent","유능한","s"],["purple","보라색의","n"],["unable","~할 수 없는","a"],["humid","습한","n"]]}]},{"items":[{"slots":[["Surprisingly"],["confirmed","denied","a"],["resemble"],["new"],["gather"]],"opts":["regretted","forgot","doubted","confirmed"],"or":["regretted(후회했다): 오로라가 아닌 것을 후회한다는 건 전문가가 사진을 살펴본 결과로 어울리지 않음.","forgot(잊었다): 잊었다면 뒤에 새로운 유형의 현상이라고 결론 내릴 근거가 사라짐.","doubted(의심했다): '오로라가 아님'을 의심하면 오로라라고 본 셈이라 새 현상이라는 결론과 부딪침.","confirmed(확인해 주었다): 전문가가 '오로라는 아니다'라고 확인해 준 뒤 새로운 현상임을 깨닫는 흐름이라 맞음."],"om":["후회했다","잊었다","의심했다","확인해 주었다"],"en":"They confirmed that it was not an aurora, but it did not resemble anything they had seen before. They realized that the group had discovered a new type of phenomenon that had never been properly studied.","ko":"그들은 그것이 오로라가 아니라는 것은 확인해 주었지만, 그것은 그들이 전에 본 어떤 것과도 닮지 않았다. 그들은 그 단체가 한 번도 제대로 연구된 적 없는 새로운 유형의 현상을 발견했다는 것을 깨달았다.","hl":["confirmed that it was not an aurora","a new type of phenomenon"],"khl":["오로라가 아니라는 것은 확인해 주었지만","새로운 유형의 현상"],"blocks":[{"t":"p","h":"denied(부인했다)를 넣으면 생기는 일","x":["denied that it was not an aurora(오로라가 아니라는 것을 부인했다).","부정을 부정하면 \"오로라가 맞다\"가 된다.","그런데 바로 다음 문장은 '새로운 유형의 현상'을 발견했다고 한다.","오로라라면 새로운 현상일 수 없다."]},{"t":"flow","h":"전문가의 결론까지","x":["오로라는 아님","전에 본 어떤 것과도 다름","제대로 연구된 적 없는 새 현상","더 알아보려고 시민 과학 프로젝트 시작"],"at":0}],"post":["confirm(확인해 주다) ↔ deny(부인하다)","오로라 아님 + 처음 보는 것 = 새로운 현상"]},{"slots":[["experts","specialists","s"],["gather","collect","s"],["kept","discarded","a"],["acknowledged"],["dedicated"]],"opts":["forgotten","banned","kept","replaced"],"or":["forgotten(잊힌): 잊힌 이름을 대문자로 다시 쓸 수는 없음.","banned(금지된): 경의를 표한다면서 이름을 금지한다는 건 In honor of(~에게 경의를 표하여)와 정반대임.","kept(유지된): 처음 발견한 사람들을 기려 이름을 그대로 두되 대문자로만 바꿨다는 흐름이라 맞음.","replaced(교체된): 이름을 바꿨다면 지금도 STEVE(스티브)라고 부르는 이유가 설명되지 않음."],"om":["잊힌","금지된","유지된","교체된"],"en":"In honor of the aurora chasers who first discovered the phenomenon, the name “Steve” has been kept. However, it is now written in all capital letters and stands for “Strong Thermal Emission Velocity Enhancement.”","ko":"그 현상을 처음 발견한 오로라 추적자들에게 경의를 표하여 'Steve'라는 이름은 유지되었다. 그러나 그 이름은 이제 모두 대문자로 쓰이며 '속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)'을 뜻한다.","hl":["the name “Steve” has been kept","In honor of"],"khl":["이름은 유지되었다","경의를 표하여"],"blocks":[{"t":"p","h":"In honor of(~에게 경의를 표하여)가 정하는 방향","x":["경의를 표한다는 건 그 사람들이 지은 것을 소중히 지킨다는 뜻이다.","그래서 그들이 붙인 이름 Steve(스티브)를 그대로 두었다.","discarded(버려진)를 넣으면 경의를 표하면서 이름을 버린 셈이다.","However(그러나) 뒤도 이름을 버린 게 아니라 대문자로 바꿔 쓴 것뿐이다."]},{"t":"p","h":"함정","x":["specialists(전문가들)는 experts(전문가들)와 같은 뜻이다.","collect(모으다)는 gather(모으다)와 같은 뜻이라 고치지 않는다."]}],"post":["keep(유지하다) ↔ discard(버리다)","Steve(스티브) → STEVE(스티브), 이름은 그대로 대문자만"]},{"slots":[["acknowledged"],["dedicated"],["credit","blame","a"],["unnoticed","undetected","s"],["collaborate"]],"opts":["punishment","criticism","penalty","credit"],"or":["punishment(벌): 새 현상을 발견한 사람들이 벌을 받을 이유가 없음.","criticism(비판): 전문가들이 그들을 기려 이름까지 지켜 줬으니 비판과는 정반대임.","penalty(처벌): 발견은 잘못이 아니라 업적이라 처벌과 어울리지 않음.","credit(공로): 발견한 사람들에게 마땅히 돌아갈 인정이라 맞음."],"om":["벌","비판","처벌","공로"],"en":"Experts have acknowledged that it is the dedicated members of the aurora chasers group that deserve the credit for discovering STEVE. If it had not been for them, it might have remained unnoticed forever.","ko":"전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람은 바로 오로라 추적자 단체의 헌신적인 구성원들이라는 것을 인정했다. 그들이 없었다면 STEVE는 영원히 알려지지 않은 채로 남았을지도 모른다.","hl":["deserve the credit for discovering STEVE","If it had not been for them"],"khl":["공로를 인정받아야 할","그들이 없었다면"],"blocks":[{"t":"p","h":"If it had not been for(~이 없었다면)가 말하는 것","x":["그들이 없었다면 STEVE(스티브)는 영원히 아무도 몰랐을 수 있다.","그만큼 그들의 발견이 중요했다는 말이다.","중요한 발견을 한 사람에게 돌아가는 건 blame(비난, 책임)이 아니라 credit(공로)이다."]},{"t":"p","h":"함정","x":["undetected(발견되지 않은)는 unnoticed(알아차려지지 않은)와 같은 뜻이다.","remained undetected forever(영원히 발견되지 않은 채로 남았다)도 자연스러운 표현."]}],"post":["credit(공로) ↔ blame(비난, 책임)","STEVE(스티브) 발견의 공로 = 오로라 추적자들"]},{"slots":[["professional"],["advance","hinder","a"],["capable"],["valuable"],["curiosity"]],"opts":["advance","ignore","avoid","abandon"],"or":["advance(발전시키다): 과학에 귀중한 기여를 한다는 다음 문장과 같은 방향이라 맞음.","ignore(무시하다): 관심 있는 분야의 과학을 무시하도록 돕는다는 건 앞뒤가 안 맞음.","avoid(피하다): 과학을 피하도록 돕고 싶어 하는 사람은 시민 과학자가 될 수 없음.","abandon(버리다): 관심 있는 분야를 버리도록 돕는다는 건 시민 과학자의 정의와 반대임."],"om":["발전시키다","무시하다","피하다","버리다"],"en":"Instead, they are citizen scientists—ordinary people who desire to help advance science in areas that they are interested in.","ko":"대신 그들은 시민 과학자들, 즉 자신이 관심 있는 분야에서 과학의 발전을 돕고 싶어 하는 평범한 사람들이다.","hl":["help advance science","areas that they are interested in"],"khl":["과학의 발전을 돕고","관심 있는 분야"],"blocks":[{"t":"p","h":"시민 과학자의 정의","x":["대시(—) 뒤는 citizen scientists(시민 과학자)의 뜻풀이다.","평범한 사람 + 관심 있는 분야 + 과학을 앞으로 나아가게 돕고 싶은 마음.","hinder(방해하다)를 넣으면 과학을 방해하고 싶어 하는 사람이 된다.","Galaxy Zoo(갤럭시 주) 참여자도, 오로라 추적자도 과학을 도왔지 방해하지 않았다."]}],"post":["advance(발전시키다) ↔ hinder(방해하다)","시민 과학자 = 과학을 돕고 싶은 평범한 사람"]},{"slots":[["advance"],["capable"],["valuable","meaningful","s"],["curiosity","indifference","a"],["taking_part","engaging","s"]],"opts":["curiosity","fear","boredom","laziness"],"or":["curiosity(호기심): an interest in(~에 대한 관심)과 나란히 놓인 조건이라 같은 방향의 말이 맞음.","fear(두려움): 두려움은 시민 과학자가 되는 조건으로 내세울 말이 아님.","boredom(지루함): 지루함이 있으면 시민 과학자가 될 수 있다는 건 앞뒤가 안 맞음.","laziness(게으름): 게으름이 있으면 시민 과학자가 될 수 있다는 건 헌신적인 추적자들 이야기와 정반대임."],"om":["호기심","두려움","지루함","게으름"],"en":"You can become one as well if you have curiosity and an interest in taking part in scientific research.","ko":"호기심과 과학 연구에 참여하는 것에 대한 관심이 있다면 당신도 시민 과학자가 될 수 있다.","hl":["if you have curiosity and an interest","You can become one as well"],"khl":["호기심과 과학 연구에 참여하는 것에 대한 관심","당신도 시민 과학자가 될 수 있다"],"blocks":[{"t":"pair","h":"and(그리고)로 묶인 두 조건","x":[["curiosity","호기심"],["an interest in taking part in scientific research","과학 연구에 참여하는 것에 대한 관심"]]},{"t":"p","h":"indifference(무관심)가 튀는 이유","x":["and(그리고)로 묶인 두 말은 같은 방향이어야 한다.","indifference(무관심)와 an interest(관심)를 함께 갖는 건 불가능하다.","학위도 흰 가운도 필요 없다. 필요한 건 궁금해하는 마음이다."]},{"t":"p","h":"함정","x":["meaningful(의미 있는)은 valuable(귀중한) 자리에 넣어도 '가치 있는 기여'가 그대로다.","engaging in(~에 참여하는 것)은 taking part in(~에 참여하는 것)과 같은 뜻이다."]}],"post":["curiosity(호기심) ↔ indifference(무관심)","시민 과학자의 조건 = 호기심 + 관심"]}],"quiz":[{"w":"confirm","m":"확인해 주다, 확증하다","it":[["verify","확인하다, 검증하다","s"],["polish","광내다","n"],["deny","부인하다","a"],["validate","입증하다, 확인하다","s"],["knit","뜨개질하다","n"],["refute","반박하다","a"],["chew","씹다","n"]]},{"w":"keep","m":"유지하다","it":[["sneeze","재채기하다","n"],["retain","유지하다, 보유하다","s"],["discard","버리다","a"],["dive","다이빙하다","n"],["preserve","보존하다","s"],["abandon","버리다, 포기하다","a"],["blink","눈을 깜빡이다","n"]]},{"w":"credit","m":"공로, 인정","it":[["recognition","인정","s"],["recipe","조리법","n"],["blame","비난, 책임","a"],["praise","칭찬","s"],["harbor","항구","n"],["discredit","불신, 불명예","a"],["blanket","담요","n"]]},{"w":"advance","m":"발전시키다, 진보시키다","it":[["iron","다림질하다","n"],["promote","촉진하다, 증진하다","s"],["hinder","방해하다","a"],["whistle","휘파람 불다","n"],["further","발전시키다, 촉진하다","s"],["impede","지연시키다, 방해하다","a"],["peel","껍질을 벗기다","n"]]},{"w":"curiosity","m":"호기심","it":[["inquisitiveness","호기심, 캐묻기 좋아함","s"],["luggage","짐, 수하물","n"],["indifference","무관심","a"],["interest","관심","s"],["ceiling","천장","n"],["apathy","무관심, 냉담","a"],["thunder","천둥","n"]]}]}],"no":"본문 ❻❼"}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
