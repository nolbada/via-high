<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">

<title>어휘특훈 · 영어II 능률(오) 2과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

<script id="data" type="application/json">{"kind":"v","id":"e2neohL2","title":"어휘특훈","sub":"영어II 능률(오) 2과","nums":[{"id":"e2-L2-2a","title":"어휘특훈 · 영어II 2과 본문 ①+②","sub":"과학은 모두의 것 + 은하를 하나하나 분류하는 연구원","tpl":"When we think about science, we might consider it as a domain reserved {exclusively} for scientists in long, white lab coats who spend their days conducting experiments and {analyzing} data. They seem to have very little in common with {ordinary} people like us. However, this {perception} is {far_from} the truth. In reality, science belongs to everyone, and we all have the {ability} to play a role in the {advancement} of science. There have been {numerous} citizen science projects in which ordinary people have made contributions to {remarkable} scientific accomplishments. Let’s take a look at two of them. Kevin Schawinski was a young astronomy researcher studying black holes and the evolution of galaxies at the University of Oxford. This might sound {exciting}, but his job there was {dull} and time-consuming. He had to {classify} around one million images of galaxies according to their shape. Since they all looked {similar} but were actually shaped {slightly} differently, the best way to do this was to sort them while looking at each one {individually}. Of course, this would {require} a {tremendous} amount of time. It took Schawinski a whole week to classify just 50,000 galaxies. He thought, “But what about the remaining 950,000?”","fn":["*lab coat: 실험실 가운","*astronomy: 천문학","*galaxy: 은하(복수형 galaxies)","*time-consuming: 시간이 많이 걸리는"],"mean":{"exclusively":"오로지, 독점적으로","solely":"오로지, 단지","analyzing":"동사 analyze(분석하다)의 -ing형. spend+시간+-ing(~하며 시간을 보내다)","ordinary":"평범한, 보통의","extraordinary":"비범한, 보기 드문","average":"보통의, 평균의","perception":"인식","impression":"인상, 느낌","far from":"~와 거리가 먼, 전혀 ~이 아닌","close to":"~에 가까운","ability":"능력","inability":"무능, ~할 수 없음","capacity":"능력, 역량","advancement":"발전, 진보","progress":"진보, 발전","decline":"쇠퇴, 감소","numerous":"수많은","countless":"셀 수 없이 많은","remarkable":"주목할 만한, 놀라운","trivial":"사소한, 하찮은","exciting":"흥미진진한, 신나는","tiresome":"지루한, 짜증 나는","dull":"따분한, 지루한","fascinating":"매혹적인, 대단히 흥미로운","classify":"분류하다","categorize":"분류하다","similar":"비슷한","alike":"비슷한, 닮은","slightly":"약간, 조금","noticeably":"눈에 띄게, 현저히","subtly":"미묘하게","individually":"개별적으로, 하나하나","separately":"따로따로, 개별적으로","collectively":"한꺼번에, 집단적으로","require":"필요로 하다","demand":"(시간·노력 등을) 필요로 하다, 요구하다","tremendous":"엄청난, 막대한","massive":"거대한, 막대한","mix up":"뒤섞다","neglecting":"동사 neglect(소홀히 하다, 방치하다)의 -ing형","negligible":"무시해도 될 정도의, 아주 적은"},"comp":[{"no":"본문 ❶❷","slots":[["exclusively"],["analyzing","neglecting","a"],["ordinary"],["far_from"],["ability","capacity","s"]],"opts":["analyzing","deleting","hiding","inventing"],"or":["analyzing(분석하는): 실험을 하고 그 데이터를 분석하는 것이 흔히 떠올리는 과학자의 하루라서 맞음.","deleting(삭제하는): 실험으로 얻은 데이터를 지우며 하루를 보낸다면 실험할 까닭이 사라짐.","hiding(숨기는): 데이터를 숨기는 사람은 우리가 떠올리는 실험실 과학자의 모습이 아님.","inventing(지어내는): 데이터를 지어내는 것은 과학이 아니라 조작이라 이 문장과 안 맞음."],"om":["분석하는","삭제하는","숨기는","지어내는"],"en":"When we think about science, we might consider it as a domain reserved exclusively for scientists in long, white lab coats who spend their days conducting experiments and analyzing data.","ko":"과학에 대해 생각할 때, 우리는 과학을 실험을 하고 데이터를 분석하며 하루하루를 보내는, 길고 하얀 실험실 가운을 입은 과학자들만을 위한 영역으로 여길지도 모른다.","hl":["conducting experiments and analyzing data","in long, white lab coats"],"khl":["실험을 하고 데이터를 분석하며","길고 하얀 실험실 가운을 입은"],"blocks":[{"t":"p","h":"우리가 떠올리는 과학자","x":["글은 사람들이 흔히 가진 과학자 이미지로 시작한다.","하얀 가운, 실험, 데이터.","conducting experiments(실험하기)와 짝을 이루는 일은 그 결과를 살피는 일이다.","neglecting(소홀히 하는)을 넣으면 데이터를 내버려 두는 과학자가 된다.","실험만 하고 결과는 안 보는 과학자를 떠올리는 사람은 없다."]},{"t":"p","h":"함정","x":["capacity(능력, 역량)는 ability(능력)와 같은 뜻이라 고치지 않는다.","the capacity to(~할 능력)도 자연스러운 짝이다."]}],"post":["analyze(분석하다) ↔ neglect(소홀히 하다)","하얀 가운 + 실험 + 데이터 분석 = 흔한 과학자 이미지"]},{"no":"본문 ❶❷","slots":[["exciting"],["dull","fascinating","a"],["classify"],["similar"],["slightly","subtly","s"]],"opts":["rewarding","glamorous","dull","relaxing"],"or":["rewarding(보람 있는): 보람 있는 일이었다면 퇴근 후 친구에게 불평할 이유가 없음.","glamorous(화려한): 화려한 일이라면 exciting(흥미진진한)과 같은 쪽이라 but(하지만)이 어색해짐.","dull(따분한): but(하지만) 앞의 exciting(흥미진진한)과 대비되고, 나중에 친구에게 불평한 것과도 맞음.","relaxing(느긋한): 백만 장을 혼자 분류하는 일이 느긋하다는 건 엄청난 시간이 든다는 설명과 안 맞음."],"om":["보람 있는","화려한","따분한","느긋한"],"en":"This might sound exciting, but his job there was dull and time-consuming. He had to classify around one million images of galaxies according to their shape.","ko":"이것은 흥미진진하게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸렸다. 그는 약 백만 장의 은하 이미지를 모양에 따라 분류해야 했다.","hl":["dull and time-consuming","classify around one million images"],"khl":["따분하고 시간이 많이 걸렸다","약 백만 장의 은하 이미지를"],"blocks":[{"t":"flow","h":"따분함이 만든 이야기","x":["따분하고 오래 걸리는 분류 작업","퇴근 후 친구 Lintott(린토트)에게 불평","인터넷에 도움을 청하자는 제안","Galaxy Zoo(갤럭시 주) 탄생"],"at":0},{"t":"p","h":"fascinating(매혹적인)이 안 되는 이유","x":["일이 매혹적이었다면 Galaxy Zoo(갤럭시 주)는 생기지 않았다.","따분하고 끝이 안 보였기 때문에 친구에게 불평했다.","그 불평이 프로젝트의 씨앗이 됐다.","subtly(미묘하게)는 slightly(약간) 자리에 넣어도 '조금씩 다르다'가 그대로라 맞는 표현."]}],"post":["dull(따분한) ↔ fascinating(매혹적인)","따분함 → 불평 → Galaxy Zoo(갤럭시 주)"]}],"compquiz":[{"w":"analyze","m":"분석하다","it":[["examine","조사하다, 검토하다","s"],["fold","접다","n"],["ignore","무시하다","a"],["study","연구하다, 살피다","s"],["pour","붓다","n"],["neglect","소홀히 하다","a"],["knit","뜨개질하다","n"]]},{"w":"dull","m":"따분한, 지루한","it":[["sticky","끈적거리는","n"],["boring","지루한","s"],["exciting","흥미진진한","a"],["northern","북쪽의","n"],["tedious","지루한, 싫증 나는","s"],["fascinating","매혹적인","a"],["costly","값비싼","n"]]}],"sets":[{"items":[{"slots":[["exclusively"],["analyzing"],["ordinary","extraordinary","a"],["perception"],["far_from"]],"opts":["famous","brilliant","elite","ordinary"],"or":["famous(유명한): 우리 같은 사람이 유명하다는 말이 되어 글이 말하는 '평범한 우리'와 안 맞음.","brilliant(뛰어난): 뛰어난 사람이라면 과학자와 공통점이 없다고 할 이유가 없어 대비가 무너짐.","elite(엘리트의): 엘리트는 오히려 과학자 쪽이라 '우리'를 가리키는 말로 맞지 않음.","ordinary(평범한): 흰 가운의 과학자와 대비되는 '우리 같은 보통 사람'이라 맞음."],"om":["유명한","뛰어난","엘리트의","평범한"],"en":"When we think about science, we might consider it as a domain reserved exclusively for scientists in long, white lab coats who spend their days conducting experiments and analyzing data. They seem to have very little in common with ordinary people like us.","ko":"과학에 대해 생각할 때, 우리는 그것을 실험을 하고 데이터를 분석하며 나날을 보내는, 길고 흰 실험실 가운을 입은 과학자들에게만 독점적으로 지정된 영역이라고 여길지도 모른다. 그들은 우리 같은 평범한 사람들과 공통점이 거의 없는 것처럼 보인다.","hl":["ordinary people like us","scientists in long, white lab coats"],"khl":["우리 같은 평범한 사람들","흰 실험실 가운을 입은 과학자들"],"blocks":[{"t":"flow","h":"2과 전체 그림","x":["통념: 과학은 흰 가운 과학자들만의 것","반박: 과학은 모두의 것","사례 1: 은하 분류를 도운 Galaxy Zoo(갤럭시 주) 참여자들","사례 2: STEVE(스티브)를 찾아낸 오로라 추적자들","결론: 누구나 시민 과학자가 될 수 있음"],"at":0},{"t":"p","h":"두 무리로 나뉜 첫 장면","x":["첫 두 문장은 사람을 두 무리로 나눈다.","한쪽은 흰 가운을 입고 실험만 하는 과학자들이다.","다른 쪽은 people like us(우리 같은 사람들)다.","둘 사이에 공통점이 거의 없다는 게 이 통념의 핵심이다.","extraordinary(비범한)를 넣으면 우리가 특별한 사람이 되어 버린다.","그러면 과학자와 우리를 갈라놓는 대비가 사라진다."]}],"post":["ordinary(평범한) ↔ extraordinary(비범한)","흰 가운 과학자와 우리 같은 보통 사람의 대비"]},{"slots":[["perception","impression","s"],["far_from"],["ability","inability","a"],["advancement","progress","s"],["numerous"]],"opts":["reluctance","hesitation","ability","unwillingness"],"or":["reluctance(꺼림): 우리 모두 역할을 꺼린다는 말이 되어 과학이 모두의 것이라는 앞말과 부딪침.","hesitation(망설임): 모두 망설인다면 수많은 시민 과학 프로젝트가 있었다는 다음 문장과 이어지지 않음.","ability(능력): science belongs to everyone(과학은 모두의 것)과 이어져 '우리 모두 역할을 할 수 있다'가 되어 맞음.","unwillingness(내키지 않음): 모두가 하기 싫어한다는 말이라 시민 과학을 소개하는 글의 방향과 반대임."],"om":["꺼림","망설임","능력","내키지 않음"],"en":"However, this perception is far from the truth. In reality, science belongs to everyone, and we all have the ability to play a role in the advancement of science.","ko":"하지만 이러한 인식은 사실과 거리가 멀다. 실제로 과학은 모두의 것이며, 우리 모두에게는 과학의 발전에 한몫을 할 수 있는 능력이 있다.","hl":["we all have the ability","science belongs to everyone"],"khl":["능력이 있다","과학은 모두의 것"],"blocks":[{"t":"pair","h":"However(하지만) 앞뒤 뒤집기","x":[["They seem to have very little in common with ordinary people like us.","통념: 과학자는 우리와 공통점이 거의 없다"],["science belongs to everyone, and we all have the ability to play a role","진실: 과학은 모두의 것, 우리 모두 역할을 할 수 있다"]]},{"t":"p","h":"inability(무능)를 넣고 다시 읽기","x":["\"우리 모두 과학 발전에 한몫할 수 없다\"가 된다.","그건 However(하지만)가 뒤집어 놓은 통념을 다시 꺼내는 말이다.","앞에서 이 생각은 far from the truth(사실과 거리가 먼)라고 했다.","같은 글이 스스로 부정한 말을 다시 할 수는 없다."]},{"t":"p","h":"함정","x":["impression(인상)은 perception(인식)을 대신해도 '이런 생각'이라는 뜻이 그대로다.","progress(진보)는 advancement(발전)와 같은 뜻이다.","바뀐 단어가 셋이지만 틀린 건 하나뿐."]}],"post":["ability(능력) ↔ inability(무능, ~할 수 없음)","과학 = 모두의 것, 누구나 한몫"]},{"slots":[["far_from"],["ability"],["advancement"],["numerous","countless","s"],["remarkable","trivial","a"]],"opts":["minor","failed","fake","remarkable"],"or":["minor(사소한): 사소한 업적에 기여했다면 굳이 사례 두 개를 골라 소개할 이유가 없음.","failed(실패한): accomplishments(업적)는 이뤄 낸 것인데 '실패한 업적'은 앞뒤가 안 맞음.","fake(가짜의): 가짜 업적이라면 과학이 모두의 것이라는 주장의 근거가 될 수 없음.","remarkable(놀라운): 평범한 사람들의 기여를 높이 사는 글이라 '놀라운 과학적 업적'이 맞음."],"om":["사소한","실패한","가짜의","놀라운"],"en":"There have been numerous citizen science projects in which ordinary people have made contributions to remarkable scientific accomplishments. Let’s take a look at two of them.","ko":"평범한 사람들이 놀라운 과학적 업적에 기여한 시민 과학 프로젝트는 수없이 많았다. 그중 두 가지를 살펴보자.","hl":["remarkable scientific accomplishments","ordinary people have made contributions"],"khl":["놀라운 과학적 업적","평범한 사람들이"],"blocks":[{"t":"p","h":"이 문장의 역할: 예고편","x":["이 문장은 뒤에 나올 두 사례의 예고편이다.","하나는 은하 7천5백만 건 분류, 다른 하나는 STEVE(스티브)라는 새 현상 발견.","둘 다 과학계가 인정한 큰 성과다.","trivial(사소한)을 넣으면 예고편이 \"별것 아닌 이야기\"를 예고하는 셈이다.","뒤의 사례들과 정반대."]},{"t":"p","h":"countless(셀 수 없이 많은)는 그대로","x":["countless(셀 수 없이 많은)는 numerous(수많은)와 같은 방향이다.","많았다는 뜻은 변하지 않는다."]}],"post":["remarkable(놀라운) ↔ trivial(사소한)","예고편: 평범한 사람들의 놀라운 업적 두 가지"]},{"slots":[["dull"],["classify","mix up","a"],["similar"],["slightly"],["individually"]],"opts":["classify","delete","purchase","decorate"],"or":["classify(분류하다): according to their shape(모양에 따라)라는 기준이 붙어 있고, 다음 문장도 sort(분류하다)로 같은 일을 다시 말해서 맞음.","delete(삭제하다): 지워 버릴 이미지라면 하나하나 들여다보며 나눌 까닭이 없음.","purchase(구입하다): 연구원이 은하 이미지 백만 장을 모양에 따라 산다는 건 말이 안 됨.","decorate(장식하다): 이미지를 꾸미는 일은 은하를 연구하는 일과 관계가 없음."],"om":["분류하다","삭제하다","구입하다","장식하다"],"en":"He had to classify around one million images of galaxies according to their shape. Since they all looked similar but were actually shaped slightly differently, the best way to do this was to sort them while looking at each one individually.","ko":"그는 약 백만 장의 은하 이미지를 모양에 따라 분류해야 했다. 그것들은 모두 비슷해 보였지만 실제로는 모양이 조금씩 달랐기 때문에, 이 일을 하는 가장 좋은 방법은 하나하나를 개별적으로 보면서 분류하는 것이었다.","hl":["classify around one million images of galaxies according to their shape","sort them"],"khl":["은하 이미지를 모양에 따라 분류해야 했다","보면서 분류하는 것"],"blocks":[{"t":"p","h":"according to(~에 따라)가 가리키는 일","x":["according to their shape(모양에 따라)는 기준을 세워 나눈다는 말이다.","mix up(뒤섞다)을 넣으면 모양에 따라 뒤섞어야 했다가 된다.","기준이 있는데 섞는다는 건 말이 안 된다.","바로 뒤 문장도 sort(분류하다)로 같은 일을 다시 부른다."]},{"t":"tap","h":"질문 하나","q":"Schawinski(샤윈스키)가 꼬박 일주일 걸려 5만 개를 해낸 일은 무엇일까?","a":["classify(분류하다)다.","섞는 일이었다면 일주일씩 걸릴 이유가 없다.","모양을 하나하나 보고 나누느라 오래 걸렸다."]}],"post":["classify(분류하다) ↔ mix up(뒤섞다)","은하 이미지 백만 장, 모양 기준 분류"]},{"slots":[["classify","categorize","s"],["similar"],["individually","separately","s"],["require"],["tremendous","negligible","a"]],"opts":["reasonable","modest","tremendous","limited"],"or":["reasonable(적당한): 적당한 시간이었다면 '남은 95만 개는 어쩌지?' 하고 한숨 쉴 일이 없음.","modest(많지 않은): 시간이 많이 안 든다는 말이 되어 따분하고 시간이 많이 드는 일이라는 앞 설명과 부딪침.","tremendous(엄청난): 일주일에 겨우 5만 개, 남은 건 95만 개라는 숫자와 딱 맞음.","limited(제한된): 짧은 시간만 든다는 뜻이라 꼬박 일주일이 걸렸다는 다음 문장과 안 맞음."],"om":["적당한","많지 않은","엄청난","제한된"],"en":"Of course, this would require a tremendous amount of time. It took Schawinski a whole week to classify just 50,000 galaxies. He thought, “But what about the remaining 950,000?”","ko":"물론 이 방법에는 엄청난 양의 시간이 필요했다. Schawinski가 고작 5만 개의 은하를 분류하는 데 꼬박 일주일이 걸렸다. 그는 '하지만 남은 95만 개는 어쩌지?'라고 생각했다.","hl":["a tremendous amount of time","a whole week"],"khl":["엄청난 양의 시간","꼬박 일주일"],"blocks":[{"t":"p","h":"숫자로 확인","x":["전체: 약 100만 개.","일주일 동안 한 것: 5만 개.","남은 것: 95만 개.","이 속도면 혼자서 20주, 다섯 달 가까이 걸린다.","negligible(무시해도 될 정도의) 시간이라는 말은 이 숫자 앞에서 버틸 수 없다."]},{"t":"p","h":"함정","x":["categorize(분류하다)는 classify(분류하다)와 같은 말이다.","separately(따로따로)는 individually(개별적으로)와 같은 뜻이다.","둘 다 고치면 안 된다."]}],"post":["tremendous(엄청난) ↔ negligible(무시해도 될 정도의)","일주일에 5만 개, 남은 건 95만 개"]}],"quiz":[{"w":"ordinary","m":"평범한, 보통의","it":[["normal","보통의, 정상적인","s"],["fragile","깨지기 쉬운","n"],["extraordinary","비범한","a"],["typical","전형적인, 보통의","s"],["exceptional","특출한","a"],["humid","습한","n"],["generous","관대한","n"]]},{"w":"ability","m":"능력","it":[["harvest","수확","n"],["capacity","능력, 역량","s"],["inability","무능, ~할 수 없음","a"],["tradition","전통","n"],["capability","능력","s"],["incapacity","무능력","a"],["climate","기후","n"]]},{"w":"remarkable","m":"주목할 만한, 놀라운","it":[["notable","주목할 만한","s"],["unremarkable","평범한, 별것 없는","a"],["wooden","나무로 된","n"],["striking","눈에 띄는, 두드러진","s"],["salty","짠","n"],["commonplace","흔해 빠진, 평범한","a"],["rural","시골의","n"]]},{"w":"classify","m":"분류하다","it":[["categorize","분류하다","s"],["borrow","빌리다","n"],["disorganize","어지럽히다, 흐트러뜨리다","a"],["sort","분류하다, 정리하다","s"],["whistle","휘파람 불다","n"],["mix up","뒤섞다","a"],["swim","수영하다","n"]]},{"w":"tremendous","m":"엄청난, 막대한","it":[["immense","막대한","s"],["polite","공손한","n"],["tiny","아주 작은","a"],["enormous","거대한, 막대한","s"],["frozen","얼어붙은","n"],["minute","아주 작은, 미세한","a"],["honest","정직한","n"]]}]},{"items":[{"slots":[["ordinary"],["perception"],["far_from","close to","a"],["ability"],["advancement"]],"opts":["in_line_with","consistent_with","far_from","identical_to"],"or":["in line with(~와 일치하는): 통념이 사실과 일치한다면 However(하지만)로 뒤집을 이유가 없음.","consistent with(~와 맞아떨어지는): 다음 문장 science belongs to everyone(과학은 모두의 것)과 정면으로 부딪침.","far from(~와 거리가 먼): However(하지만)로 앞의 통념을 뒤집으니 '사실과 거리가 멀다'가 맞음.","identical to(~와 똑같은): 통념이 곧 사실이라는 말이 되어 글 전체의 주장과 반대임."],"om":["~와 일치하는","~와 맞아떨어지는","~와 거리가 먼","~와 똑같은"],"en":"They seem to have very little in common with ordinary people like us. However, this perception is far from the truth. In reality, science belongs to everyone, and we all have the ability to play a role in the advancement of science.","ko":"그들은 우리 같은 평범한 사람들과 공통점이 거의 없는 것처럼 보인다. 하지만 이러한 인식은 사실과 거리가 멀다. 실제로 과학은 모두의 것이며, 우리 모두에게는 과학의 발전에 한몫을 할 수 있는 능력이 있다.","hl":["far from the truth","However"],"khl":["사실과 거리가 멀다","하지만"],"blocks":[{"t":"p","h":"However(하지만)가 정하는 방향","x":["However(하지만)는 앞말을 뒤집는 신호다.","앞말: 과학자는 우리와 딴 세상 사람 같다.","뒷말: 그 생각은 사실과 거리가 멀다.","close to(~에 가까운)를 넣으면 앞말을 뒤집지 않고 맞장구를 친다.","바로 뒤 In reality(실제로는)가 \"과학은 모두의 것\"이라고 하니 앞뒤가 꼬인다."]}],"post":["far from(~와 거리가 먼) ↔ close to(~에 가까운)","과학자만의 과학 = 사실 아님"]},{"slots":[["exclusively","solely","s"],["ordinary","average","s"],["far_from"],["advancement","decline","a"],["remarkable"]],"opts":["collapse","neglect","misuse","advancement"],"or":["collapse(붕괴): 우리 모두 과학을 무너뜨리는 데 한몫할 수 있다는 말이라 글의 방향과 반대임.","neglect(방치): 과학을 내버려 두는 데 한몫한다는 건 시민 과학자의 '기여'와 정반대임.","misuse(오용): 과학을 잘못 쓰는 데 한몫한다는 말이 되어 긍정적인 사례 소개와 안 맞음.","advancement(발전): 뒤 문장의 remarkable scientific accomplishments(놀라운 과학적 업적)와 이어져 맞음."],"om":["붕괴","방치","오용","발전"],"en":"In reality, science belongs to everyone, and we all have the ability to play a role in the advancement of science. There have been numerous citizen science projects in which ordinary people have made contributions to remarkable scientific accomplishments.","ko":"실제로 과학은 모두의 것이며, 우리 모두에게는 과학의 발전에 한몫을 할 수 있는 능력이 있다. 평범한 사람들이 놀라운 과학적 업적에 기여한 시민 과학 프로젝트는 수없이 많았다.","hl":["the advancement of science","made contributions to remarkable scientific accomplishments"],"khl":["과학의 발전","놀라운 과학적 업적에 기여한"],"blocks":[{"t":"pair","h":"같은 말을 두 번 하는 두 문장","x":[["play a role in the advancement of science","과학의 발전에 한몫하다"],["made contributions to remarkable scientific accomplishments","놀라운 과학적 업적에 기여했다"]]},{"t":"p","h":"decline(쇠퇴)이 튀는 이유","x":["두 문장은 같은 이야기를 두 번 한다.","평범한 사람도 과학을 앞으로 나아가게 할 수 있다는 것.","decline(쇠퇴)을 넣으면 과학을 뒷걸음질 치게 하는 데 한몫한다는 말이 된다.","바로 다음 문장의 contributions(기여)와 방향이 반대다."]},{"t":"p","h":"함정","x":["solely(오로지)는 exclusively(독점적으로)와 같은 '오직 ~만'이다.","average(보통의)는 ordinary(평범한)와 같은 뜻이라 그대로 둔다."]}],"post":["advancement(발전) ↔ decline(쇠퇴)","평범한 사람 = 과학을 앞으로 미는 힘"]},{"slots":[["exciting","tiresome","a"],["dull"],["classify"],["similar","alike","s"],["slightly"]],"opts":["exciting","gloomy","pointless","unpleasant"],"or":["exciting(흥미진진한): 블랙홀과 은하를 연구하는 일이 겉으로는 멋져 보인다는 뜻이라 but(하지만) 뒤 dull(따분한)과 대비를 이룸.","gloomy(우울한): 우울하게 들린다면 but(하지만) 뒤의 '따분했다'와 대비가 생기지 않음.","pointless(무의미한): 블랙홀 연구가 무의미하게 들린다는 건 젊은 천문학 연구원 소개와 어울리지 않음.","unpleasant(불쾌한): 불쾌하게 들린다면 따분함과 같은 쪽이라 but(하지만)이 필요 없음."],"om":["흥미진진한","우울한","무의미한","불쾌한"],"en":"Kevin Schawinski was a young astronomy researcher studying black holes and the evolution of galaxies at the University of Oxford. This might sound exciting, but his job there was dull and time-consuming.","ko":"Kevin Schawinski는 옥스퍼드 대학에서 블랙홀과 은하의 진화를 연구하는 젊은 천문학 연구원이었다. 이것은 흥미진진하게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸렸다.","hl":["This might sound exciting, but","dull and time-consuming"],"khl":["흥미진진하게 들릴지도 모르지만","따분하고 시간이 많이 걸렸다"],"blocks":[{"t":"p","h":"겉으로 들리는 것 vs 실제","x":["might sound(~하게 들릴지도 모른다)는 겉으로 보이는 인상이다.","but(하지만) 뒤가 실제 모습이다.","블랙홀, 은하, 옥스퍼드. 겉으로는 멋진 일이다.","실제로는 사진을 모양대로 나누는 따분한 일이다.","tiresome(지루한)을 넣으면 겉도 지루하고 실제도 따분한 셈이다.","but(하지만)이 뒤집을 게 없어진다."]},{"t":"p","h":"함정","x":["alike(비슷한)는 similar(비슷한)와 같은 뜻이다.","they all looked alike(그것들은 모두 비슷해 보였다)도 자연스러운 문장."]}],"post":["exciting(흥미진진한) ↔ tiresome(지루한)","멋져 보이는 연구, 실제론 따분한 분류 작업"]},{"slots":[["classify"],["similar"],["slightly","noticeably","a"],["individually"],["require"]],"opts":["obviously","completely","slightly","dramatically"],"or":["obviously(뻔히): 차이가 뻔히 보였다면 all looked similar(모두 비슷해 보였다)와 부딪침.","completely(완전히): 완전히 다른 모양이라면 겉보기에 비슷할 수가 없음.","slightly(약간): 비슷해 보이는데 실제로는 '조금씩' 달라서 하나하나 봐야 했다는 흐름과 맞음.","dramatically(극적으로): 극적으로 달랐다면 한눈에 나눌 수 있어 일주일씩 걸릴 일이 아님."],"om":["뻔히","완전히","약간","극적으로"],"en":"Since they all looked similar but were actually shaped slightly differently, the best way to do this was to sort them while looking at each one individually.","ko":"그것들은 모두 비슷해 보였지만 실제로는 모양이 조금씩 달랐기 때문에, 이 일을 하는 가장 좋은 방법은 하나하나를 개별적으로 보면서 분류하는 것이었다.","hl":["slightly differently","looked similar"],"khl":["조금씩 달랐기","비슷해 보였지만"],"blocks":[{"t":"p","h":"noticeably(눈에 띄게)를 넣고 다시 읽기","x":["\"모두 비슷해 보였지만 실제로는 눈에 띄게 모양이 달랐다.\"","눈에 띄게 다르면 비슷해 보일 수가 없다.","한 문장 안에서 앞말과 뒷말이 싸운다.","차이가 아주 작았기 때문에 하나씩 들여다봐야 했다."]},{"t":"flow","h":"작은 차이가 만든 큰 고생","x":["은하 모양 차이가 아주 작음","한 장씩 들여다봐야 함","일주일에 고작 5만 개","남은 95만 개 앞에서 한숨","친구에게 털어놓음"],"at":0}],"post":["slightly(약간) ↔ noticeably(눈에 띄게)","작은 차이 때문에 하나하나 들여다봐야 했던 은하"]},{"slots":[["similar"],["slightly"],["individually","collectively","a"],["require","demand","s"],["tremendous","massive","s"]],"opts":["carelessly","roughly","briefly","individually"],"or":["carelessly(부주의하게): 조금씩 다른 모양을 가려내야 하니 대충 보는 건 '가장 좋은 방법'이 될 수 없음.","roughly(대충): 대충 보면 미세한 차이를 놓쳐 분류가 틀어짐.","briefly(잠깐): 한 장을 잠깐씩만 봤다면 엄청난 시간이 걸릴 이유가 없음.","individually(개별적으로): 차이가 아주 작아서 한 장씩 따로 들여다봐야 했다는 말이라 맞음."],"om":["부주의하게","대충","잠깐","개별적으로"],"en":"Since they all looked similar but were actually shaped slightly differently, the best way to do this was to sort them while looking at each one individually. Of course, this would require a tremendous amount of time.","ko":"그것들은 모두 비슷해 보였지만 실제로는 모양이 조금씩 달랐기 때문에, 이 일을 하는 가장 좋은 방법은 하나하나를 개별적으로 보면서 분류하는 것이었다. 물론 이 방법에는 엄청난 양의 시간이 필요했다.","hl":["looking at each one individually","Of course"],"khl":["하나하나를 개별적으로","물론"],"blocks":[{"t":"p","h":"each one(하나하나)과 짝이 맞는 말","x":["each one(하나하나)은 한 장씩 따로 본다는 뜻이다.","collectively(한꺼번에)를 넣으면 하나하나를 한꺼번에 본다는 말이 된다.","말 자체가 모순이다."]},{"t":"p","h":"Of course(물론)가 이어 주는 것","x":["하나씩 봐야 했으니, 당연히 시간이 엄청 든다.","Of course(물론)는 앞 문장의 결과를 받는 말이다.","한꺼번에 볼 수 있었다면 '물론 시간이 엄청 든다'로 이어질 수 없다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["demand(필요로 하다)는 require(필요로 하다)와 같은 뜻으로 시간이 든다는 말에 쓰인다.","massive(막대한)는 tremendous(엄청난) 자리에 넣어도 '엄청난 양'이 그대로다."]}],"post":["individually(개별적으로) ↔ collectively(한꺼번에)","하나씩 보기 = 엄청난 시간"]}],"quiz":[{"w":"far from","m":"~와 거리가 먼, 전혀 ~이 아닌","it":[["nowhere near","~에 전혀 못 미치는","s"],["in spite of","~에도 불구하고","n"],["close to","~에 가까운","a"],["anything but","결코 ~이 아닌","s"],["on behalf of","~을 대신하여","n"],["near","~에 가까운","a"],["in addition to","~에 더하여","n"]]},{"w":"advancement","m":"발전, 진보","it":[["recipe","조리법","n"],["progress","진보, 발전","s"],["decline","쇠퇴","a"],["shelter","피난처","n"],["development","발전","s"],["regression","퇴보","a"],["festival","축제","n"]]},{"w":"exciting","m":"흥미진진한, 신나는","it":[["thrilling","아주 신나는","s"],["humble","겸손한","n"],["boring","지루한","a"],["exhilarating","몹시 흥분되는","s"],["edible","먹을 수 있는","n"],["dull","따분한","a"],["tidy","깔끔한","n"]]},{"w":"slightly","m":"약간, 조금","it":[["loudly","큰 소리로","n"],["somewhat","다소, 약간","s"],["considerably","상당히","a"],["politely","공손하게","n"],["marginally","아주 조금","s"],["significantly","상당히, 크게","a"],["honestly","정직하게","n"]]},{"w":"individually","m":"개별적으로, 하나하나","it":[["separately","따로따로","s"],["angrily","화가 나서","n"],["collectively","한꺼번에, 집단적으로","a"],["one by one","하나씩","s"],["early","일찍","n"],["together","함께","a"],["abroad","해외에서","n"]]}]}],"no":"본문 ❶❷"},{"id":"e2-L2-2c","title":"어휘특훈 · 영어II 2과 본문 ③+④","sub":"Galaxy Zoo의 탄생 + Zooniverse로의 성장","tpl":"One evening after work, Schawinski met a friend named Chris Lintott and {complained} about the situation. Lintott {suggested} that he turn to the Internet to ask other people for help. {Eventually}, the two men ended up {launching} a crowdsourced online project known as Galaxy Zoo. The website was kept as {simple} as possible, with a very {basic} design and an easy-to-use interface. This allowed those who wanted to participate to get started {quickly}. New visitors were {greeted} with a {brief} tutorial that explained the project. Then they were shown an image of a galaxy and asked to click buttons that described its features. Is the galaxy smooth and rounded? Is its shape an oval or a spiral? After completion of the tutorial and a little bit of practice, the participants were able to classify galaxies {effectively}. It was online media that helped spread the word about Galaxy Zoo, bringing more and more participants to the website. Shortly after the website was launched, {nearly} 70,000 classifications were being made per hour. In a year and a half, more than 80,000 individuals {participated}, and they made more than 75 million classifications. If it had not been for those participants, Schawinski couldn’t have classified that many images. In fact, it would have taken him decades on his own. More than 15 years have passed since the project first {began} in 2007. Galaxy Zoo has now {grown} into Zooniverse, which is one of the most {popular} platforms on the Internet for ordinary people who want to participate in science projects. It is more {active} than ever before, with about 2 million registered users worldwide. It now offers a {wide} range of projects in astronomy, biology, physics, and more. If you want to get involved, you should {definitely} check it out!","fn":["*crowdsourced: 대중을 참여시켜 만든","*interface: 인터페이스(사용자가 조작하는 화면)","*tutorial: 사용 안내, 사용 지침","*oval: 타원형","*spiral: 나선형"],"mean":{"complained":"동사 complain(불평하다)의 과거형","praised":"동사 praise(칭찬하다)의 과거형","suggested":"동사 suggest(제안하다)의 과거형. suggest that+주어+(should)+동사원형","proposed":"동사 propose(제안하다)의 과거형","Eventually":"결국, 마침내","Ultimately":"결국, 궁극적으로","launching":"동사 launch(시작하다, 출시하다)의 -ing형. end up -ing(결국 ~하게 되다)","starting":"동사 start(시작하다)의 -ing형","abandoning":"동사 abandon(포기하다, 버리다)의 -ing형","simple":"단순한, 간단한","complicated":"복잡한","uncomplicated":"복잡하지 않은, 단순한","basic":"기본적인, 단순한","elaborate":"정교한, 공들인","quickly":"빠르게","rapidly":"빠르게","brief":"짧은, 간단한","lengthy":"긴, 장황한","concise":"간결한","greeted":"동사 greet(맞이하다)의 과거분사형. be greeted with ~ = ~로 맞이받다","welcomed":"동사 welcome(환영하다)의 과거분사형","effectively":"효과적으로","poorly":"서툴게, 형편없이","nearly":"거의","almost":"거의","participated":"동사 participate(참여하다)의 과거형","took part":"동사구 take part(참여하다)의 과거형","bega ],"en":"Galaxy Zoo has now grown into Zooniverse, which is one of the most popular platforms on the Internet for ordinary people who want to participate in science projects. It is more active than ever before, with about 2 million registered users worldwide.","ko":"Galaxy Zoo는 이제 Zooniverse로 성장했는데, 이것은 과학 프로젝트에 참여하고 싶은 일반인들을 위한, 인터넷에서 가장 인기 있는 플랫폼 중 하나이다. 그것은 전 세계적으로 약 2백만 명의 등록 사용자를 두고 그 어느 때보다 활발하다.","hl":["one of the most popular platforms","about 2 million registered users"],"khl":["가장 인기 있는 플랫폼 중 하나","약 2백만 명의 등록 사용자"],"blocks":[{"t":"pair","h":"앞 문장과 뒷 문장 나란히","x":[["one of the most popular platforms","가장 인기 있는 플랫폼 중 하나"],["about 2 million registered users worldwide","전 세계 약 2백만 명의 등록 사용자"]]},{"t":"p","h":"obscure(잘 알려지지 않은)이 틀린 이유","x":["뒷 문장의 2백만 명은 앞 문장의 '인기'를 숫자로 보여 준다.","obscure(잘 알려지지 않은)을 넣으면 숫자와 말이 정면으로 부딪친다.","started(시작했다)는 began(시작했다)과 같은 뜻이라 고치지 않는다."]}],"post":["popular(인기 있는) ↔ obscure(잘 알려지지 않은)","인기의 증거 = 전 세계 2백만 명"]}],"compquiz":[{"w":"quickly","m":"빠르게","it":[["rapidly","빠르게","s"],["kindly","친절하게","n"],["slowly","느리게","a"],["swiftly","재빨리","s"],["upstairs","위층으로","n"],["leisurely","느긋하게","a"],["honestly","정직하게","n"]]},{"w":"popular","m":"인기 있는","it":[["wet","젖은","n"],["well-liked","인기 있는, 호감을 사는","s"],["unpopular","인기 없는","a"],["square","정사각형의","n"],["favored","선호되는","s"],["disliked","미움받는","a"],["frozen","얼어붙은","n"]]}],"sets":[{"items":[{"slots":[["complained","praised","a"],["suggested"],["Eventually"],["launching"],["simple"]],"opts":["complained","boasted","rejoiced","forgot"],"or":["complained(불평했다): 따분하고 끝없는 분류 작업을 털어놓은 것이라 친구가 해결책을 제안하는 다음 문장과 맞음.","boasted(자랑했다): 따분한 일을 자랑할 리 없고, 자랑하는 사람에게 도움 받을 방법을 제안하지도 않음.","rejoiced(크게 기뻐했다): 95만 개가 남아 막막한 상황을 기뻐했다는 건 앞 내용과 정반대임.","forgot(잊어버렸다): 상황을 잊었다면 Lintott(린토트)이 해결책을 내놓을 계기가 없음."],"om":["불평했다","자랑했다","크게 기뻐했다","잊어버렸다"],"en":"One evening after work, Schawinski met a friend named Chris Lintott and complained about the situation. Lintott suggested that he turn to the Internet to ask other people for help.","ko":"어느 날 저녁 퇴근 후, Schawinski는 Chris Lintott이라는 친구를 만나 그 상황에 대해 불평했다. Lintott은 그에게 다른 사람들에게 도움을 청할 수 있도록 인터넷에 의지해 보라고 제안했다.","hl":["complained about the situation","ask other people for help"],"khl":["그 상황에 대해 불평했다","도움을 청할"],"blocks":[{"t":"tap","h":"질문 하나","q":"the situation(그 상황)은 어떤 상황일까?","a":["백만 장의 은하 사진을 혼자 모양대로 나눠야 하는 상황.","일주일에 고작 5만 개, 남은 건 95만 개.","이런 상황 앞에서 나오는 말은 칭찬이 아니라 불평이다."]},{"t":"p","h":"praised(칭찬했다)를 넣으면","x":["상황을 칭찬한 사람에게 친구가 \"도움을 청해 봐\"라고 할 리 없다.","Lintott(린토트)의 제안은 불평에 대한 대답이다.","불평 → 제안 → Galaxy Zoo(갤럭시 주). 이 순서가 이야기의 뼈대다."]}],"post":["complain(불평하다) ↔ praise(칭찬하다)","퇴근 후 불평 한마디가 Galaxy Zoo(갤럭시 주)의 시작"]},{"slots":[["launching","starting","s"],["simple","complicated","a"],["basic"],["quickly","rapidly","s"],["brief"]],"opts":["simple","impressive","colorful","formal"],"or":["simple(단순한): 바로 뒤 a very basic design(아주 기본적인 디자인), an easy-to-use interface(사용하기 쉬운 화면)와 한 덩어리라 맞음.","impressive(인상적인): 인상적으로 꾸몄다는 말은 아주 기본적인 디자인과 부딪침.","colorful(화려한): 화려하게 꾸민 사이트라면 '아주 기본적인 디자인'이라고 할 수 없음.","formal(격식을 갖춘): 격식을 차린 사이트는 누구나 빨리 시작하게 하려는 목적과 거리가 멂."],"om":["단순한","인상적인","화려한","격식을 갖춘"],"en":"The website was kept as simple as possible, with a very basic design and an easy-to-use interface. This allowed those who wanted to participate to get started quickly.","ko":"그 웹사이트는 아주 기본적인 디자인과 사용하기 쉬운 화면으로 가능한 한 단순하게 유지되었다. 이 덕분에 참여하고 싶은 사람들이 빠르게 시작할 수 있었다.","hl":["as simple as possible","an easy-to-use interface"],"khl":["가능한 한 단순하게","사용하기 쉬운 화면"],"blocks":[{"t":"pair","h":"with(~을 갖춘) 뒤의 두 증거","x":[["a very basic design","아주 기본적인 디자인"],["an easy-to-use interface","사용하기 쉬운 화면"]]},{"t":"p","h":"complicated(복잡한)를 넣고 다시 읽기","x":["\"가능한 한 복잡하게 유지했다, 아주 기본적인 디자인으로.\"","복잡하게 만들면서 기본 디자인을 쓴다는 건 말이 안 된다.","목적도 분명하다. 누구나 빨리 시작하게 하는 것.","복잡한 사이트로는 그 목적을 이룰 수 없다."]},{"t":"p","h":"함정","x":["starting(시작하기)은 launching(시작하기) 자리에, rapidly(빠르게)는 quickly(빠르게) 자리에 그대로 들어간다."]}],"post":["simple(단순한) ↔ complicated(복잡한)","누구나 빨리 시작하도록 최대한 단순하게"]},{"slots":[["quickly"] 타나는 것을 알아채기 시작했다. 녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다.","hl":["something strange","unusual ribbons"],"khl":["이상한 무언가","특이한 빛의 띠"],"blocks":[{"t":"pair","h":"같은 대상을 가리키는 두 말","x":[["something strange","이상한 무언가"],["unusual ribbons of green and purple light","녹색과 보라색의 특이한 빛의 띠"]]},{"t":"p","h":"familiar(익숙한)를 넣으면","x":["익숙한 무언가를 알아챘다는 말이 된다.","그런데 바로 다음 문장이 그것을 unusual(특이한) 띠라고 부른다.","나중에는 정체 모를 낯선 물체에 빗대어 Steve(스티브)라고 부른다.","익숙한 것에는 이런 일이 일어나지 않는다."]},{"t":"p","h":"함정","x":["spot(발견하다)은 notice(알아채다)와 같은 뜻이다.","peculiar(기이한)는 unusual(특이한)과 같은 방향이라 고치지 않는다."]}],"post":["strange(이상한) ↔ familiar(익숙한)","2014년 여름 밤하늘의 이상한 빛"]},{"slots":[["unusual"],["stretch","shrink","a"],["lasted","continued","s"],["remained"],["similar"]],"opts":["stretch","fade","melt","sink"],"or":["stretch(뻗다): for thousands of kilometers(수천 킬로미터에 걸쳐)라는 길이와 짝이 맞음.","fade(희미해지다): 수천 킬로미터라는 거리와 이어지지 않고, 한 시간 내내 머물렀다는 다음 문장과도 안 맞음.","melt(녹다): 빛의 띠가 녹는다는 건 말이 안 되고 거리 표현과도 이어지지 않음.","sink(가라앉다): 하늘의 빛이 수천 킬로미터 가라앉는다는 건 띠의 모양을 설명하는 말이 아님."],"om":["뻗다","희미해지다","녹다","가라앉다"],"en":"There were unusual ribbons of green and purple light, some of which seemed to stretch for thousands of kilometers. Sometimes they lasted for just a few minutes, while other times they remained in the sky for a whole hour.","ko":"녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다. 어떤 때는 그것들이 단 몇 분 동안만 지속되었지만, 다른 때는 한 시간 내내 하늘에 머물러 있었다.","hl":["stretch for thousands of kilometers","ribbons"],"khl":["수천 킬로미터에 걸쳐 뻗어","빛의 띠"],"blocks":[{"t":"p","h":"ribbon(띠)이라는 그림","x":["ribbon(리본, 띠)은 길고 가는 모양이다.","그 띠가 수천 킬로미터에 걸쳐 있다.","길게 뻗은 모습을 그리는 문장이다.","shrink(줄어들다)를 넣으면 수천 킬로미터 동안 줄어든다는 이상한 말이 된다."]},{"t":"p","h":"함정","x":["continued(계속되었다)는 lasted(지속되었다) 자리에 넣어도 '몇 분 동안 이어졌다'가 그대로다."]}],"post":["stretch(뻗다) ↔ shrink(줄어들다)","수천 킬로미터로 뻗은 녹색·보라색 빛의 띠"]},{"slots":[["remained"],["similar","dissimilar","a"],["possessed"],["notably"],["different"]],"opts":["opposite","inferior","superior","similar"],"or":["opposite(정반대인):
