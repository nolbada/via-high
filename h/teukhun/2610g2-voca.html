swim","수영하다","n"],["amass","모으다, 축적하다","s"],["scatter","흩어지다","a"],["knock","두드리다","n"]]}]},{"items":[{"slots":[["regulating"],["adverse","enjoyable","a"],["overpowering"],["positive"],["shape"]],"opts":["adverse","uplifting","joyful","amusing"],"or":["adverse(부정적인): and yet(그럼에도)으로 '나쁜 일이지만 다르게 볼 수 있다'고 꺾는 흐름에 맞음.","uplifting(기운을 북돋는): 이혼이 기운을 북돋는 일이라면 굳이 다르게 해석할 필요가 없음.","joyful(기쁜): 기쁜 일은 가족에게 평생 흔적을 남길 압도적인 상실이 될 수 없음.","amusing(재미있는): 재미있는 사건은 슬픔과 분노를 부르는 예시가 될 수 없음."],"om":["부정적인","기운을 북돋는","기쁜","재미있는"],"en":"Take, for example, someone who is going through a divorce. This is often an adverse event, and yet, it can be construed in different ways.","ko":"예를 들어, 이혼을 겪고 있는 누군가를 생각해 보자. 이것은 보통 부정적인 사건이지만, 그럼에도 다른 방식들로 해석될 수 있다.","hl":["an adverse event, and yet","going through a divorce"],"khl":["부정적인 사건이지만","이혼을 겪고 있는"],"blocks":[{"t":"p","h":"and yet(그럼에도)이 정하는 방향","x":["and yet(그럼에도)은 앞말을 한 번 꺾는다.","앞: 이혼은 보통 나쁜 일이다.","뒤: 그래도 다르게 볼 수 있다.","enjoyable(즐거운)을 넣으면 \"즐거운 일이지만, 다르게 볼 수 있다\"가 된다.","꺾을 게 없는데 꺾는 셈이다."]},{"t":"p","h":"왜 하필 이혼을 예로 들까","x":["재평가가 빛나는 순간은 나쁜 일을 겪을 때다.","좋은 일은 다시 해석할 필요가 없다.","그래서 필자는 누가 봐도 힘든 이혼을 골랐다."]}],"post":["adverse(부정적인) ↔ enjoyable(즐거운)","이혼 = 누가 봐도 힘든 일, 그래서 재평가의 예시"]},{"slots":[["regulating","managing","s"],["painful"],["improved","strengthened","s"],["intense","mild","a"],["powerfully"]],"opts":["intense","slight","faint","brief"],"or":["intense(강렬한): 두 번째 해석이 '더 낮은 강도'라고 했으니 첫 번째는 강한 쪽이어야 해서 맞음.","slight(약간의): 첫 번째가 약간의 슬픔이면 두 번째를 '더 낮은 강도'라고 비교할 여지가 없음.","faint(희미한): 압도적인 상실로 본 사람의 감정이 희미할 리 없음.","brief(잠깐의): 평생 흔적을 남길 상실로 본 사람의 슬픔이 잠깐일 리 없음."],"om":["강렬한","약간의","희미한","잠깐의"],"en":"The first construal may bring intense sadness and anger. The second construal might also bring sadness and anger but perhaps at lower levels.","ko":"첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다. 두 번째 해석 역시 슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도일 것이다.","hl":["intense sadness","at lower levels"],"khl":["강렬한 슬픔","더 낮은 강도"],"blocks":[{"t":"tap","h":"질문 하나","q":"첫 번째 해석이 mild(가벼운) 슬픔을 부른다면, 두 번째의 '더 낮은 강도'는 뭐가 될까?","a":["거의 슬픔이 없는 상태.","그러면 두 번째도 슬픔과 분노를 부른다는 말과 어긋난다.","비교가 서려면 첫 번째는 세게, 두 번째는 덜 세게."]},{"t":"p","h":"해석이 감정의 세기를 정한다","x":["첫 번째 해석: 평생 남을 압도적인 상실.","그러니 감정도 세다.","원인이 크면 결과도 크다.","mild(가벼운)는 압도적인 상실과 짝이 맞지 않는다."]},{"t":"p","h":"함정","x":["managing(다스리기)은 regulating(조절하기) 자리에 들어가도 된다.","strengthened(더 튼튼해진)도 improved(개선된) 관계와 같은 그림이다.","둘 다 그대로 둔다."]}],"post":["intense(강렬한) ↔ mild(가벼운)","첫 번째 해석 = 센 슬픔, 두 번째 해석 = 덜한 슬픔"]},{"slots":[["overpowering","overwhelming","s"],["positive"],["illustrates","conceals","a"],["accumulate"],["resilience"]],"opts":["illustrates","hides","questions","ignores"],"or":["illustrates(보여 주다): 예시의 역할은 주장을 눈에 보이게 하는 것이라 맞음.","hides(숨기다): 필자가 직접 든 예시가 자기 주장을 숨긴다는 건 말이 안 됨.","questions(의문을 제기하다): 예시는 재평가를 칭찬하는 근거로 쓰였지 의심하는 데 쓰이지 않음.","ignores(무시하다): 이혼 예시는 바로 재평가의 효과를 다루고 있어 무시한다고 할 수 없음."],"om":["보여 주다","숨기다","의문을 제기하다","무시하다"],"en":"This example illustrates how reappraisal might powerfully transform short-term emotional responses.","ko":"이 예시는 재평가가 어떻게 단기적인 감정 반응을 강력하게 변화시킬 수 있는지를 보여 준다.","hl":["This example illustrates","powerfully transform"],"khl":["이 예시는","보여 준다"],"blocks":[{"t":"flow","h":"이 단어가 서 있는 자리","x":["주장: 재평가는 효과적","예시: 이혼을 두 가지로 해석","정리: 이 예시가 보여 주는 것","확장: 쌓이면 건강이 됨"],"at":2},{"t":"p","h":"정리 문장의 역할","x":["This example(이 예시)으로 시작하는 문장은 앞 예시를 정리한다.","예시를 든 이유는 주장을 보여 주기 위해서다.","conceals(숨기다)를 넣으면 필자가 일부러 고른 예시가 주장을 가린다는 말이 된다.","예시를 든 이유가 사라진다."]},{"t":"p","h":"함정","x":["overwhelming(압도적인)은 overpowering(압도적인)과 같은 말이라 고치지 않는다."]}],"post":["illustrate(보여 주다) ↔ conceal(숨기다)","이혼 예시 = 재평가의 힘을 보여 주는 장면"]},{"slots":[["effective"],["transforms","preserves","a"],["construed"],["lower"],["powerfully"]],"opts":["transforms","maintains","freezes","overlooks"],"or":["transforms(변화시키다): 뒤에서 같은 동사로 powerfully transform(강력하게 변화시키다)이라고 다시 말해 맞음.","maintains(유지하다): 감정을 그대로 두는 방법이 감정 조절에 효과적일 이유가 없음.","freezes(얼어붙게 하다): 감정을 멈춰 세우는 건 '해석이 다르면 감정이 달라진다'는 예시와 맞지 않음.","overlooks(간과하다): 감정을 못 본 척하는 건 감정을 뿌리부터 다루는 일과 반대임."],"om":["변화시키다","유지하다","얼어붙게 하다","간과하다"],"en":"Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.","ko":"재평가, 즉 감정적인 상황에 대해 생각하는 방식을 바꾸는 것은 감정을 뿌리에서부터 변화시키기 때문에 감정을 조절하는 특히 효과적인 방법이 될지도 모른다.","hl":["it transforms emotions","changing the way one thinks"],"khl":["변화시키기 때문에","생각하는 방식을 바꾸는 것"],"blocks":[{"t":"pair","h":"첫 문장과 정리 문장 나란히","x":[["it transforms emotions at their root","재평가는 감정을 뿌리에서부터 변화시킨다 (첫 문장)"],["reappraisal might powerfully transform short-term emotional responses","재평가는 단기적인 감정 반응을 강력하게 변화시킬 수 있다 (정리 문장)"]]},{"t":"p","h":"같은 말이 두 번 나온다","x":["필자는 처음과 정리에서 같은 동사를 쓴다.","처음 문장이 preserves(보존하다)라면 정리 문장과 정반대가 된다.","게다가 재평가의 뜻 자체가 생각하는 방식을 바꾸는 것이다.","바꾸는 방법이 감정을 그대로 둘 리 없다."]}],"post":["transform(변화시키다) ↔ preserve(보존하다)","재평가 = 생각을 바꿔 감정을 바꿈"]},{"slots":[["root","core","s"],["adverse"],["positive"],["shape","influence","s"],["resilience","vulnerability","a"]],"opts":["resilience","fragility","weakness","dependence"],"or":["resilience(회복 탄력성): 덜 아프게 겪고 희망까지 얻는 힘이 쌓인 결과라 맞음.","fragility(연약함): 좋은 감정이 쌓여 건강을 만든다고 했으니 결론이 연약함일 수 없음.","weakness(약함): 재평가를 계속 칭찬해 온 글이 약함의 열쇠로 끝날 리 없음.","dependence(의존): 재평가는 스스로 생각을 바꾸는 일이라 남에게 기대는 것과 관계없음."],"om":["회복 탄력성","연약함","약함","의존"],"en":"When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people's psychological health. Thereby, reappraisal might be a key to resilience.","ko":"오랫동안 반복되면, 재평가의 이러한 단기적인 감정적 결과들이 쌓여 사람들의 심리적 건강을 형성할지도 모른다. 그렇게 함으로써 재평가는 회복 탄력성의 열쇠가 될지도 모른다.","hl":["a key to resilience","psychological health"],"khl":["회복 탄력성의 열쇠","심리적 건강"],"blocks":[{"t":"tap","h":"글 전체를 한 줄로","q":"이 글을 한 줄로 줄이면?","a":["생각을 바꾸면 감정이 바뀌고, 그게 쌓이면 다시 일어서는 힘이 된다.","마지막 단어는 그 '다시 일어서는 힘'이다."]},{"t":"p","h":"Thereby(그렇게 함으로써)가 잇는 것","x":["Thereby(그렇게 함으로써)는 앞 문장의 결과를 이어 받는다.","앞 문장: 좋은 효과가 쌓여 건강을 만든다.","그 결과가 vulnerability(취약성)일 수는 없다.","건 ,"uniform","limited","repetitive"],"or":["diverse(다양한): 마시기·농사·공장처럼 쓰임새가 제각각이라서 규칙 하나로 안 된다는 이유로 맞음.","uniform(획일적인): 쓰임새가 다 똑같다면 하나의 규칙을 쓰지 못할 이유가 없음.","limited(제한된): 쓰임새가 적다면 '일률적인 규칙을 쓸 수 없다'는 이유가 되지 않음.","repetitive(반복적인): 같은 일만 되풀이한다면 오히려 하나의 규칙으로 충분함."],"om":["다양한","획일적인","제한된","반복적인"],"en":"We can’t utilize the same “one size fits all” rule for everyone because we use water for so many diverse things.","ko":"우리는 물을 아주 다양한 일에 쓰기 때문에 모두에게 똑같은 '일률적인' 규칙을 활용할 수는 없다.","hl":["so many diverse things","because"],"khl":["아주 다양한 일","쓰기 때문에"],"blocks":[{"t":"p","h":"because(~때문에)가 정하는 방향","x":["앞: 하나의 규칙을 모두에게 쓸 수 없다.","뒤(이유): 물을 아주 다양한 일에 쓴다.","쓰임이 제각각이니 규칙도 하나로는 안 된다.","similar(비슷한)를 넣으면 이유가 거꾸로 선다.","쓰임이 비슷하면 오히려 규칙 하나면 충분하다."]},{"t":"tap","h":"질문 하나","q":"물을 비슷한 일에만 쓴다면, 기준은 몇 개 필요할까?","a":["하나면 된다.","기준이 여러 개 필요한 건 쓰임새가 다양하기 때문이다.","그래서 diverse(다양한)여야 한다."]}],"post":["diverse(다양한) ↔ similar(비슷한)","쓰임새가 제각각 = 규칙 하나로는 부족"]},{"slots":[["just","simply","s"],["exactly"],["clean","pure","s"],["different","identical","a"],["dependent_on"]],"opts":["different","equal","uniform","universal"],"or":["different(다른): dependent on how it will be utilized(어떻게 활용될지에 따라)와 짝을 이뤄 쓰임새마다 기준을 다르게 둔다는 결론이라 맞음.","equal(동일한): 동일한 허용치라면 '쓰임새에 따라'라는 말이 필요 없음.","uniform(획일적인): 획일적인 허용치는 앞에서 쓸 수 없다고 한 일률적인 규칙과 같음.","universal(보편적인): 모두에게 통하는 허용치는 one size fits all(일률적인) 규칙을 다시 들여오는 셈임."],"om":["다른","동일한","획일적인","보편적인"],"en":"This is why groups set different “safety limits” for the water dependent on how it will be utilized.","ko":"이것이 물이 어떻게 활용될지에 따라 단체들이 물에 대해 서로 다른 '안전 허용치'를 정하는 이유이다.","hl":["different “safety limits”","dependent on how it will be utilized"],"khl":["서로 다른 '안전 허용치'","어떻게 활용될지에 따라"],"blocks":[{"t":"pair","h":"예시와 결론 나란히","x":[["the water that cools down a huge power plant generator","발전기를 식히는 물: 덜 깨끗해도 됨"],["the water you drink from the kitchen tap","주방 수도꼭지에서 마시는 물: 아주 깨끗해야 함"]]},{"t":"p","h":"This is why(이것이 ~한 이유이다)가 묶는 것","x":["This is why(이것이 ~한 이유이다)는 앞 예시에서 결론을 끌어낸다."," ":"guidelines(지침들)라는 이름 자체가 답","x":["guideline(지침)은 길을 안내하는 선이다.","안내하는 것이 숨기면 안내가 아니다.","hide from us(우리에게 숨기다)를 넣으면 \"지침이 정확한 양을 우리에게 숨긴다\"가 된다.","그러면 우리는 무엇을 따라야 할지 모른다."]},{"t":"p","h":"앞뒤 문장으로 확인","x":["앞 문장: 수질은 기준을 따르는 것.","뒤 문장: 이 규칙들이 안전을 보장한다.","따를 수 있으려면 먼저 알아야 한다.","가운데 문장은 '알려 준다'여야 앞뒤가 이어진다."]}],"post":["inform us(우리에게 알려 주다) ↔ hide from us(우리에게 숨기다)","지침 = 물속에 얼마까지 괜찮은지 알려 주는 안내선"]},{"slots":[["inform_us","tell us","s"],["safe"],["utilize","reject","a"],["diverse"],["dependent_on","based on","s"]],"opts":["utilize","abandon","change","question"],"or":["utilize(활용하다): 쓰임새가 다양해서 하나의 규칙을 '쓸 수 없다'는 문장이라 맞음.","abandon(버리다): '일률적 규칙을 버릴 수 없다'가 되어 쓰임새가 다양하다는 이유와 거꾸로 이어짐.","change(바꾸다): '바꿀 수 없다'면 쓰임새마다 기준을 달리한다는 마지막 문장과 부딪침.","question(의문을 제기하다): 의문도 못 품는다면 결국 하나의 규칙을 그대로 쓰는 셈이라 결론과 반대임."],"om":["활용하다","버리다","바꾸다","의문을 제기하다"],"en":"We can’t utilize the same “one size fits all” rule for everyone because we use water for so many diverse things.","ko":"우리는 물을 아주 다양한 일에 쓰기 때문에 모두에게 똑같은 '일률적인' 규칙을 활용할 수는 없다.","hl":["can’t utilize the same","for everyone"],"khl":["활용할 수는 없다","모두에게"],"blocks":[{"t":"p","h":"can’t(~할 수 없다)와 함께 읽기","x":["이 문장은 '하지 못한다'는 문장이다.","못 하는 것: 하나의 규칙을 모두에게 쓰는 것.","reject(거부하다)를 넣으면 \"하나의 규칙을 거부할 수 없다\"가 된다.","즉 하나의 규칙을 계속 써야 한다는 말이다.","마지막 문장의 different safety limits(서로 다른 안전 허용치)와 정반대가 된다."]},{"t":"tap","h":"질문 하나","q":"글쓴이는 결국 규칙을 하나로 쓰자는 걸까, 여러 개로 쓰자는 걸까?","a":["여러 개.","그래서 이 문장은 하나짜리 규칙을 '쓸 수 없다'가 되어야 한다."]},{"t":"p","h":"고치면 안 되는 두 표현","x":["tell us(우리에게 말해 주다)는 inform us(우리에게 알려 주다)와 같은 뜻이다.","based on(~에 근거하여)은 dependent on(~에 따라)과 같은 방향이다.","둘 다 그대로 둔다."]}],"post":["utilize(활용하다) ↔ reject(거부하다)","하나의 규칙 X, 쓰임새별 규칙 O"]},{"slots":[["following","meeting","s"],["guidelines"],["same"],["clean","polluted","a"],["set"]],"opts":["clean","dirty","warm","cloudy"],"or":["clean(깨끗한): 마시는 물만큼 깨끗할 필요는 없다는 비교로, 쓰임새마다 기준이 다르다는 예시가 되어 맞음.","dirty(더러운): '마시는 물만큼 더러울 필요가 없다'가 되어 마시는 물이 더럽다는 이상한 말이 됨.","warm(따뜻한): 글은 온도가 아니라 물속에 든 것의 양, 즉 깨끗함을 다룸.","cloudy(탁한): 마시는 물을 탁한 물의 기준으로 삼는 셈이라 비교가 뒤집힘."],"om":["깨끗한","더러운","따뜻한","탁한"],"en":"For instance, the water that cools down a huge power plant generator doesn’t need to be as clean as the water you drink from the kitchen tap.","ko":"예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지에서 마시는 물만큼 깨끗할 필요는 없다.","hl":["as clean as the water you drink","doesn’t need to be"],"khl":["마시는 물만큼 깨끗할","필요는 없다"],"blocks":[{"t":"p","h":"비교의 기준이 누구인가","x":["as ~ as(~만큼)의 기준은 마시는 물이다.","마시는 물은 가장 깨끗해야 하는 물이다.","polluted(오염된)를 넣으면 \"마시는 물만큼 오염될 필요는 없다\"가 된다.","마시는 물이 오염됐다는 말이 숨어 있게 된다.","앞에서 규칙이 마시는 물까지 안전하게 지킨다고 했으니 말이 안 된다."]},{"t":"p","h":"이 예시가 하는 일","x":["발전기를 식히는 물은 사람이 마시지 않는다.","그래서 덜 깨끗해도 된다.","쓰임이 다르면 필요한 깨끗함도 다르다는 것.","meeting(충족하기)은 following(따르기) 자리에 들어가도 '기준을 지키다'라는 뜻이 그대로다."]}],"post":["clean(깨끗한) ↔ polluted(오염된)","발전기 냉각수 = 마시는 물만큼 깨끗할 필요 X"]},{"slots":[["just"],["certain"],["exactly"],["utilize"],["dependent_on","independent of","a"]],"opts":["dependent_on","regardless_of","free_from","apart_from"],"or":["dependent on(~에 따라): 물이 어떻게 쓰일지에 따라 허용치를 다르게 정한다는 결론이라 맞음.","regardless of(~와 상관없이): 쓰임과 상관없이 정한다면 허용치를 '서로 다르게' 둘 이유가 없음.","free from(~에서 벗어난): 쓰임에서 벗어난 허용치라는 말이 되어 발전기 냉각수 예시와 이어지지 않음.","apart from(~을 제외하고): 쓰임을 빼고 정한다면 앞 예시가 결론의 근거가 되지 못함."],"om":["~에 따라","~와 상관없이","~에서 벗어난","~을 제외하고"],"en":"This is why groups set different “safety limits” for the water dependent on how it will be utilized.","ko":"이것이 물이 어떻게 활용될지에 따라 단체들이 물에 대해 서로 다른 '안전 허용치'를 정하는 이유이다.","hl":["dependent on how it will be utilized","different “safety limits”"],"khl":["어떻게 활용될지에 따라","서로 다른 '안전 허용치'"],"blocks":[{"t":"flow","h":"이 표현이 서 있는 자리","x":["물의 쓰임새는 제각각","하나의 규칙으로는 안 됨","예: 발전기 냉각수와 마시는 물","결론: 쓰임새에 따라 허용치를 따로 정함"],"at":3},{"t":"p","h":"independent of(~와 상관없이)를 넣고 다시 읽기","x":["\"쓰임새와 상관없이 서로 다른 허용치를 정한다\"가 된다.","쓰임과 상관없다면 무엇을 기준으로 다르게 정할까?","다르게 정하는 이유가 사라진다.","바로 앞 발전기 예시도 '쓰임이 다르면 기준도 다르다'를 보여 줬다."]},{"t":"p","h":"글 첫 문장과 이어 보기","x":["첫 문장은 보기에 깨끗하다고 다가 아니라고 했다.","마지막 문장은 그 답을 준다.","깨끗함의 기준은 물을 어디에 쓰느냐에 달려 있다."]}],"post":["dependent on(~에 따라) ↔ independent of(~와 상관없이)","안전 허용치 = 물의 쓰임새에 따라 정함"]},{"slots":[["exactly","precisely","s"],["safe","suitable","s"],["diverse"],["set","abolish","a"],["different"]],"opts":["set","ignore","remove","hide"],"or":["set(정하다): 쓰임새마다 다른 허용치를 '정해 둔다'는 결론이라 맞음.","ignore(무시하다): 허용치를 무시한다면 앞에서 길게 설명한 기준이 모두 쓸모없어짐.","remove(없애다): 허용치를 없애면 물이 안전하다고 보장할 방법이 사라짐.","hide(숨기다): 기준은 정확히 알려 주는 것이라고 했으니 숨긴다는 건 반대임."],"om":["정하다","무시하다","없애다","숨기다"],"en":"This is why groups set different “safety limits” for the water dependent on how it will be utilized.","ko":"이것이 물이 어떻게 활용될지에 따라 단체들이 물에 대해 서로 다른 '안전 허용치'를 정하는 이유이다.","hl":["groups set different “safety limits”","This is why"],"khl":["'안전 허용치'를 정하는","이유이다"],"blocks":[{"t":"tap","h":"글 전체를 한 줄로","q":"이 글을 한 줄로 줄이면?","a":["깨끗한 물의 기준은 하나가 아니라, 물을 어디에 쓰느냐에 따라 따로 정한다.","마지막 문장이 그 '따로 정한다'를 맡는다."]},{"t":"p","h":"abolish(없애다)가 안 되는 이유","x":["글 내내 기준이 왜 필요한지 설명했다.","안전을 보장하고, 정확한 양을 알려 준다.","그런 기준을 마지막에 없앤다면 글 전체가 무너진다.","게다가 different(서로 다른) 허용치는 새로 정할 때 쓰는 말이다."]},{"t":"p","h":"함정","x":["precisely(정확히)는 exactly(정확히)와 같은 뜻이다.","suitable(알맞은)도 safe(안전한) 자리에 들어가 '어떤 쓰임에든 쓸 수 있는'이라는 뜻을 살린다.","둘 다 고치지 않는다."]}],"post":["set(정하다) ↔ abolish(없애다)","안전 허용치 = 쓰임새별로 정해 두는 것"]}],"quiz":[{"w":"inform","m":"알려 주다","it":[["notify","통지하다, 알리다","s"],["bake","굽다","n"],["conceal","숨기다","a"],["swim","수영하다","n"],["tell","말해 주다","s"],["withhold","주지 않다, 알리지 않다","a"],["repair","수리하다","n"]]},{"w":"utilize","m":"활용하다","it":[["discard","버리다","a"],["employ","쓰다, 이용하다","s"],["sneeze","재채기하다","n"],["use","쓰다","s"],["neglect","방치하다","a"],["knit","뜨개질하다","n"],["climb","오르다","n"]]},{"w":"clean","m":"깨끗한","it":[["pure","순수한, 깨끗한","s"],["brave","용감한","n"],["dirty","더러운","a"],["spotless","티 없이 깨끗한","s"],["rural","시골의","n"],["polluted","오염된","a"],["loyal","충실한","n"]]},{"w":"dependent","m":"(~에) 달린, 좌우되는","it":[["independent","독립적인, ~와 무관한","a"],["contingent","~에 달린","s"],["oval","타원형의","n"],["conditional","조건부의","s"],["musical","음악의","n"],["unconditional","무조건의","a"],["sleepy","졸린","n"]]},{"w":"set","m":"(기준을) 정하다, 세우다","it":[["establish","세우다, 정하다","s"],["paint","칠하다","n"],["abolish","없애다, 폐지하다","a"],["determine","결정하다","s"],["whistle","휘파람을 불다","n"],["eliminate","없애다","a"],["knock","두드리다","n"]]}]}],"no":"38"},{"id":"2610g2-39","title":"어휘특훈 · 26년 10월 고2 39번","sub":"기록이 적은 평범한 사람들의 역사를 읽는 법","tpl":"Like all historians, social historians draw from a {variety} of primary sources. Social history often {emphasizes} {ordinary} people rather than {elites}. Yet, in most places and times, non-elites {lacked} access to education and, thus, did not produce {substantial} amounts of documentation. Even when they did produce documentation, these materials {rarely} ended up in archives where they could be {preserved} and made {available} to researchers. Because of such {biases} in the historical record, social historians have to be very {creative} in their work. Like other historians, social historians {analyze} textual sources produced by government officials, employers, and other elites. Yet rather than {simply} take such sources at face value, they read them “{against_the_grain}”. So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also {examine} the {silences}, interruptions, rumors, and other details that {offer} {hints} about the enslaved peoples’ attitudes and actions.","fn":["*primary source: 원자료, 1차 자료","*archive: 기록 보관소","*at face value: 액면 그대로","*slaveowner: 노예 소유주","*enslaved: 노예가 된"],"mean":{"variety":"여러 가지, 다양성 (a variety of = 다양한)","range":"범위, 다양한 종류 (a range of = 다양한)","emphasizes":"동사 emphasize(강조하다)의 3인칭 단수형","highlights":"동사 highlight(부각하다, 강조하다)의 3인칭 단수형","downplays":"동사 downplay(경시하다, 대수롭지 않게 다루다)의 3인칭 단수형","ordinary":"평범한, 보통의","common":"평범한, 보통의","privileged":"특권을 누리는, 특권층의","elites":"명사 elite(엘리트, 상류층)의 복수형","commoners":"명사 commoner(평민, 서민)의 복수형","lacked":"동사 lack(~이 없다, 부족하다)의 과거형","enjoyed":"동사 enjoy(누리다, 즐기다)의 과거형","substantial":"상당한, 많은","considerable":"상당한, 꽤 많은","rarely":"좀처럼 ~않는, 드물게","frequently":"자주, 흔히","preserved":"동사 preserve(보존하다)의 과거분사형 (be preserved = 보존되다)","destroyed":"동사 destroy(파괴하다)의 과거분사형 (be destroyed = 파괴되다)","available":"이용할 수 있는","accessible":"접근할 수 있는, 이용할 수 있는","inaccessible":"접근할 수 없는, 이용할 수 없는","biases":"명사 bias(편향, 치우침)의 복수형","fairness":"공정함, 치우치지 않음","creative":"창의적인","inventive":"창의적인, 독창적인","conventional":"관습적인, 틀에 박힌","analyze":"분석하다","disregard":"무시하다, 고려하지 않다","simply":"그저, 단순히","merely":"그저, 단지","against the grain":"결을 거슬러, 겉으로 드러난 의도와 반대로","examine":"살펴보다, 조사하다","investigate":"조사하다, 살피다","overlook":"간과하다, 못 보고 넘어가다","silences":"명사 silence(침묵)의 복수형","gaps":"명사 gap(빈틈, 공백)의 복수형","offer":"주다, 제공하다","provide":"제공하다, 주다","withhold":"주지 않다, 보류하다","hints":"명사 hint(힌트, 단서)의 복수형","clues":"명사 clue(단서)의 복수형"},"comp":[{"no":"39","slots":[["variety"],["ordinary"],["elites","commoners","a"],["lacked"],["biases"]],"opts":["elites","peasants","workers","servants"],"or":["elites(엘리트): 평범한 사람들과 맞서는 쪽이라 rather than(~보다)의 비교가 성립하여 맞음.","peasants(농민): 농민도 평범한 사람들 쪽이라 '평범한 사람들보다 농민'이라는 비교가 안 됨.","workers(노동자): 노동자도 엘리트가 아닌 쪽이라 비교의 두 편이 같아져 버림.","servants(하인): 하인은 오히려 사회사가 주목하는 쪽이라 '하인보다 평범한 사람'은 말이 안 됨."],"om":["엘리트","농민","노동자","하인"],"en":"Social history often emphasizes ordinary people rather than elites. Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.","ko":"사회사는 흔히 엘리트보다 평범한 사람들을 강조한다. 그러나 대부분의 장소와 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 없었고, 그래서 상당한 양의 기록을 남기지 못했다.","hl":["ordinary people rather than elites","non-elites"],"khl":["엘리트보다 평범한 사람들을","엘리트가 아닌 사람들은"],"blocks":[{"t":"pair","h":"rather than(~보다)의 두 편","x":[["ordinary people","평범한 사람들 (사회사가 주목하는 쪽)"],["elites","엘리트 (상대적으로 덜 주목하는 쪽)"]]},{"t":"p","h":"commoners(평민)를 넣으면","x":["commoners(평민)는 ordinary people(평범한 사람들)과 같은 무리다.","\"평민보다 평범한 사람들을 강조한다\"가 되어 비교의 두 편이 똑같아진다.","바로 다음 문장의 non-elites(엘리트가 아닌 사람들)가 답을 준다.","평범한 사람들의 맞은편은 elites(엘리트)다."]}],"post":["elite(엘리트) ↔ commoner(평민)","사회사의 주인공 = 엘리트가 아닌 보통 사람"]},{"no":"39","slots":[["creative"],["simply"],["examine","investigate","s"],["silences"],["offer","withhold","a"]],"opts":["offer","hide","block","remove"],"or":["offer(주다): 세부 사항이 노예들의 태도에 대한 힌트를 준다는 말이라 살펴볼 이유가 생겨 맞음.","hide(숨기다): 힌트를 숨기는 세부 사항이라면 굳이 들여다볼 까닭이 사라짐.","block(막다): 힌트를 막는다는 말이 되어 사회사가가 이것을 살펴보는 이유와 반대임.","remove(없애다): 힌트를 없애는 세부 사항이라면 찾을 것이 남지 않음."],"om":["주다","숨기다","막다","없애다"],"en":"So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.","ko":"그래서 예를 들어, 사회사가는 법률 문서를 노예 소유주가 내놓은 ‘사실’만 얻으려고 읽지 않는다. 노예가 된 사람들의 태도와 행동에 대한 힌트를 주는 침묵, 끊김, 소문, 그 밖의 세부 사항까지 살펴볼 것이다.","hl":["details that offer hints","she will also examine"],"khl":["힌트를 주는","살펴볼 것이다"],"blocks":[{"t":"p","h":"왜 침묵까지 살펴볼까","x":["노예들은 자기 기록을 거의 남기지 못했다.","그래서 사회사가는 주인이 쓴 문서 속 빈틈을 뒤진다.","말하지 않은 것, 끊긴 부분, 떠도는 소문.","이런 것들이 노예들의 마음에 대한 힌트를 준다.","그 \"준다\"가 바로 offer(주다)다.","withhold(주지 않다)를 넣으면 힌트를 주지 않는 것을 일부러 살펴보는 셈이 된다."]},{"t":"p","h":"고치면 안 되는 단어","x":["investigate(조사하다)는 examine(살펴보다) 자리에 넣어도 같은 행동이다.","she will also investigate the silences(그녀는 침묵까지 조사할 것이다)도 자연스럽다."]}],"post":["offer(주다) ↔ withhold(주지 않다)","주인의 문서 속 침묵 = 노예의 마음을 엿보는 단서"]}],"compquiz":[{"w":"elite","m":"엘리트, 상류층","it":[["upper class","상류층","s"],["ladder","사다리","n"],["the masses","대중, 서민","a"],["recipe","요리법","n"],["aristocracy","귀족층, 상류층","s"],["commoners","평민들","a"],["umbrella","우산","n"]]},{"w":"offer","m":"주다, 제공하다","it":[["chew","씹다","n"],["provide","제공하다","s"],["withhold","주지 않다, 보류하다","a"],["knit","뜨개질하다","n"],["supply","공급하다","s"],["withdraw","(제안 등을) 거두어들이다","a"],["sneeze","재채기하다","n"]]}],"sets":[{"items":[{"slots":[["variety"],["emphasizes","downplays","a"],["substantial"],["rarely"],["creative"]],"opts":["emphasizes","excludes","neglects","mocks"],"or":["emphasizes(강조하다): 평범한 사람들을 중심에 두기 때문에 그들의 기록이 적다는 다음 문제가 생겨 맞음.","excludes(빼 버리다): 평범한 사람들을 빼 버린다면 그들의 기록 부족을 걱정할 까닭이 없음.","neglects(소홀히 하다): 평범한 사람들을 소홀히 한다면 뒤의 Yet(그러나)이 만드는 고민이 생기지 않음.","mocks(조롱하다): 역사학이 연구 대상을 조롱한다는 말이 되어 글 전체와 맞지 않음."],"om":["강조하다","빼 버리다","소홀히 하다","조롱하다"],"en":"Social history often emphasizes ordinary people rather than elites. Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.","ko":"사회사는 흔히 엘리트보다 평범한 사람들을 강조한다. 그러나 대부분의 장소와 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 없었고, 그래서 상당한 양의 기록을 남기지 못했다.","hl":["emphasizes ordinary people","Yet"],"khl":["평범한 사람들을 강조한다","그러나"],"blocks":[{"t":"flow","h":"글의 출발점","x":["사회사는 평범한 사람들에 주목함","그러나 그들은 기록을 거의 못 남김","남긴 기록도 보관소에 잘 안 들어감","그래서 사회사가는 창의적이어야 함","엘리트의 문서를 거슬러 읽기"],"at":0},{"t":"p","h":"Yet(그러나)이 만드는 고민","x":["평범한 사람들을 강조하는데, 그들의 기록은 적다.","이 어긋남이 글 전체의 문제다.","downplays(경시하다)를 넣으면 평범한 사람들을 대수롭지 않게 다룬다는 말이 된다.","그러면 그들의 기록이 적어도 아무 고민이 없다.","Yet(그러나) 뒤의 걱정이 설 자리를 잃는다."]}],"post":["emphasize(강조하다) ↔ downplay(경시하다)","주목하는 사람들 = 기록이 적은 사람들"]},{"slots":[["ordinary","common","s"],["lacked","enjoyed","a"],["substantial","considerable","s"],["preserved"],["analyze"]],"opts":["lacked","gained","secured","controlled"],"or":["lacked(~이 없었다): 교육을 못 받아서 기록을 남기지 못했다는 원인-결과가 맞음.","gained(얻었다): 교육을 얻었다면 thus(그래서) 기록을 못 남겼다는 결과와 이어지지 않음.","secured(확보했다): 교육 기회를 확보했다면 글을 써서 기록을 남길 수 있었을 것임.","controlled(장악했다): 교육을 장악한 쪽은 엘리트이지 엘리트가 아닌 사람들이 아님."],"om":["~이 없었다","얻었다","확보했다","장악했다"],"en":"Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.","ko":"그러나 대부분의 장소와 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 없었고, 그래서 상당한 양의 기록을 남기지 못했다.","hl":["lacked access to education","thus"],"khl":["교육을 받을 기회가 없었고","그래서"],"blocks":[{"t":"p","h":"thus(그래서)가 잇는 원인과 결과","x":["원인: 교육을 받을 기회가 없었다.","결과: 그래서 기록을 많이 남기지 못했다.","글을 배우지 못하면 글을 남길 수 없다.","enjoyed(누렸다)를 넣으면 교육을 누렸는데 그래서 기록을 못 남겼다는 말이 된다.","원인과 결과가 거꾸로 엮인다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","common people(평범한 사람들)은 ordinary people(평범한 사람들)과 같은 말이다.","considerable amounts(상당한 양)도 substantial amounts(상당한 양)와 같은 뜻이다.","철자가 낯설어도 뜻이 같으면 그대로 둔다."]}],"post":["lack(~이 없다) ↔ enjoy(누리다)","교육 없음 → 기록 없음"]},{"slots":[["emphasizes"],["rarely","frequently","a"],["available","accessible","s"],["simply"],["hints"]],"opts":["rarely","usually","always","regularly"],"or":["rarely(좀처럼 ~않는): 기록이 보관소에 거의 남지 않았다는 말이라 바로 뒤 biases(편향)와 이어져 맞음.","usually(대개): 대개 보관소에 들어갔다면 역사 기록이 치우칠 이유가 없음.","always(항상): 항상 보존되었다면 사회사가들이 애써 창의적일 필요가 없음.","regularly(꾸준히): 꾸준히 보관되었다면 Even when(~할 때조차)이 만드는 아쉬움이 사라짐."],"om":["좀처럼 ~않는","대개","항상","꾸준히"],"en":"Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers. Because of such biases in the historical record, social historians have to be very creative in their work.","ko":"그들이 실제로 기록을 남겼을 때조차, 이 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 들어가는 일이 거의 없었다. 역사 기록의 이런 편향 때문에, 사회사가들은 작업에서 매우 창의적이어야 한다.","hl":["rarely ended up in archives","such biases"],"khl":["들어가는 일이 거의 없었다","이런 편향"],"blocks":[{"t":"p","h":"Even when(~할 때조차)의 말투","x":["\"기록을 남겼을 때조차\"는 그다음에도 안 좋은 소식이 온다는 신호다.","기록이 적다. 그나마 있던 것도 보관소에 잘 안 들어갔다.","나쁜 일이 겹치는 흐름이다.","frequently(자주)를 넣으면 좋은 소식이 와서 말투가 깨진다."]},{"t":"p","h":"다음 문장이 증인","x":["바로 뒤에 such biases(이런 편향)가 나온다.","기록이 엘리트 쪽으로 치우쳤다는 말이다.","평범한 사람들의 자료가 자주 보관되었다면 편향은 생기지 않는다."]},{"t":"p","h":"고치면 안 되는 단어","x":["accessible(이용할 수 있는)은 available(이용할 수 있는)과 같은 자리에서 같은 뜻을 낸다."]}],"post":["rarely(드물게) ↔ frequently(자주)","적은 기록 + 보관도 잘 안 됨 = 편향"]},{"slots":[["ordinary"],["biases"],["creative","conventional","a"],["against_the_grain"],["silences"]],"opts":["creative","passive","careless","traditional"],"or":["creative(창의적인): 자료가 부족하니 남들과 다른 방법으로 읽어야 한다는 흐름과 맞음.","passive(수동적인): 손 놓고 기다리면 부족한 기록을 메울 수 없음.","careless(부주의한): 편향된 기록일수록 더 꼼꼼해야 하므로 반대 방향임.","traditional(전통적인): 뒤에 나오는 '결을 거슬러 읽기'는 전통적인 읽기와 반대임."],"om":["창의적인","수동적인","부주의한","전통적인"],"en":"Because of such biases in the historical record, social historians have to be very creative in their work. Yet rather than simply take such sources at face value, they read them “against the grain”.","ko":"역사 기록의 이런 편향 때문에, 사회사가들은 작업에서 매우 창의적이어야 한다. 그러나 그들은 그런 자료를 그저 액면 그대로 받아들이기보다, 그것을 ‘결을 거슬러’ 읽는다.","hl":["very creative","against the grain"],"khl":["매우 창의적이어야","결을 거슬러"],"blocks":[{"t":"p","h":"어떻게 창의적인가","x":["글 뒷부분이 그 방법을 보여 준다.","엘리트가 쓴 문서를 그대로 믿지 않는다.","결을 거슬러, 즉 쓴 사람의 의도와 반대로 읽는다.","이것이 남들이 안 하는 방식, 곧 창의적인 방식이다.","conventional(관습적인)을 넣으면 뒤의 방법 설명과 정면으로 부딪친다."]},{"t":"tap","h":"질문 하나","q":"재료가 부족한 요리사는 어떻게 해야 할까?","a":["있는 재료를 새로운 방식으로 써야 한다.","사회사가도 같다.","평범한 사람들의 기록이 부족하니 엘리트의 문서를 새롭게 읽는다."]}],"post":["creative(창의적인) ↔ conventional(관습적인)","부족한 기록 → 거슬러 읽기라는 새 방법"]},{"slots":[["substantial"],["simply","merely","s"],["examine","overlook","a"],["offer"],["hints","clues","s"]],"opts":["examine","dismiss","skip","bury"],"or":["examine(살펴보다): not only(~뿐 아니라) ~ also(~도)로 사실 말고 침묵까지 들여다본다는 말이라 맞음.","dismiss(묵살하다): 힌트를 주는 세부 사항을 묵살한다면 결을 거슬러 읽는 의미가 없음.","skip(건너뛰다): 힌트가 담긴 부분을 건너뛰는 건 사회사가의 방법과 반대임.","bury(묻어 두다): 노예의 마음을 알려 주는 단서를 묻어 버린다는 말이 되어 맞지 않음."],"om":["살펴보다","묵살하다","건너뛰다","묻어 두다"],"en":"So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.","ko":"그래서 예를 들어, 사회사가는 법률 문서를 노예 소유주가 내놓은 ‘사실’만 얻으려고 읽지 않는다. 노예가 된 사람들의 태도와 행동에 대한 힌트를 주는 침묵, 끊김, 소문, 그 밖의 세부 사항까지 살펴볼 것이다.","hl":["she will also examine the silences","not only for the “facts”"],"khl":["세부 사항까지 살펴볼 것이다","‘사실’만 얻으려고 읽지 않는다"],"blocks":[{"t":"pair","h":"not only(~뿐 아니라) ~ also(~도)의 두 칸","x":[["not only for the “facts” provided by slaveowners","노예 소유주가 내놓은 ‘사실’을 얻으려고만이 아니라"],["she will also examine the silences","침묵까지 살펴본다"]]},{"t":"p","h":"overlook(간과하다)를 넣으면","x":["also(~도)는 앞의 일에 하나를 더 보탠다는 말이다.","\"사실도 읽고, 침묵도 간과한다\"는 보탠 것이 아니다.","게다가 그 침묵은 힌트를 주는 부분이다.","힌트를 일부러 놓치는 탐정은 없다."]},{"t":"p","h":"함정","x":["merely(그저)는 simply(그저)와, clues(단서들)는 hints(힌트들)와 뜻이 같다.","둘 다 그대로 넣어도 문장이 자연스럽다."]}],"post":["examine(살펴보다) ↔ overlook(간과하다)","사실 + 침묵까지 읽는 탐정 같은 역사가"]}],"quiz":[{"w":"emphasize","m":"강조하다","it":[["borrow","빌리다","n"],["stress","강조하다","s"],["downplay","경시하다","a"],["decorate","장식하다","n"],["highlight","부각하다","s"],["understate","축소해서 말하다","a"],["freeze","얼다","n"]]},{"w":"lack","m":"~이 없다, 부족하다","it":[["be without","~이 없다","s"],["invent","발명하다","n"],["have","가지다","a"],["applaud","박수 치다","n"],["be short of","~이 부족하다","s"],["possess","소유하다","a"],["describe","묘사하다","n"]]},{"w":"rarely","m":"좀처럼 ~않는, 드물게","it":[["loudly","큰 소리로","n"],["seldom","좀처럼 ~않는","s"],["often","자주","a"],["politely","공손하게","n"],["infrequently","드물게","s"],["frequently","자주","a"],["firmly","단단히","n"]]},{"w":"creative","m":"창의적인","it":[["imaginative","상상력이 풍부한","s"],["punctual","시간을 잘 지키는","n"],["unimaginative","상상력이 없는","a"],["fragile","깨지기 쉬운","n"],["inventive","독창적인","s"],["uninspired","독창성이 없는","a"],["thirsty","목마른","n"]]},{"w":"examine","m":"살펴보다, 조사하다","it":[["greet","인사하다","n"],["inspect","점검하다","s"],["overlook","간과하다","a"],["pour","붓다","n"],["investigate","조사하다","s"],["ignore","무시하다","a"],["dance","춤추다","n"]]}]},{"items":[{"slots":[["variety"],["lacked"],["rarely"],["preserved","destroyed","a"],["analyze"]],"opts":["preserved","discarded","hidden","damaged"],"or":["preserved(보존되다): 기록 보관소는 자료를 지켜 두는 곳이라 맞음.","discarded(버려지다): 자료를 버리는 곳이라면 연구자들이 이용할 수 없음.","hidden(숨겨지다): 숨겨진다면 뒤의 made available(이용할 수 있게 되다)과 부딪침.","damaged(손상되다): 손상시키는 곳이라면 기록이 거기 못 들어간 것을 아쉬워할 까닭이 없음."],"om":["보존되다","버려지다","숨겨지다","손상되다"],"en":"Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.","ko":"그들이 실제로 기록을 남겼을 때조차, 이 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 들어가는 일이 거의 없었다.","hl":["could be preserved and made available","archives"],"khl":["보존되어 연구자들이 이용할 수 있게","기록 보관소"],"blocks":[{"t":"p","h":"기록 보관소가 하는 일","x":["archive(기록 보관소)는 문서를 오래 지켜 두는 곳이다.","지켜 둔 문서를 연구자가 꺼내 본다.","그래서 preserved(보존되다)와 made available(이용할 수 있게 되다)이 and(그리고)로 나란히 선다.","destroyed(파괴되다)를 넣으면 \"파괴되고 이용할 수 있게 되는\" 곳이 된다.","부서진 문서는 아무도 볼 수 없다."]},{"t":"p","h":"아쉬움의 방향","x":["평범한 사람들의 기록이 이곳에 거의 못 들어갔다.","좋은 곳에 못 들어간 것이 아쉬운 것이다.","파괴되는 곳이라면 못 들어간 게 오히려 다행이다."]}],"post":["preserve(보존하다) ↔ destroy(파괴하다)","기록 보관소 = 지켜 두고 꺼내 보는 곳"]},{"slots":[["variety","range","s"],["substantial"],["biases","fairness","a"],["creative","inventive","s"],["examine"]],"opts":["biases","strengths","advantages","improvements"],"or":["biases(편향): 기록이 엘리트 쪽으로 치우쳤으니 창의적이어야 한다는 흐름과 맞음.","strengths(강점): 기록에 강점이 있다면 굳이 거슬러 읽을 필요가 없음.","advantages(이점): 이점 때문에 창의적이어야 한다는 말은 원인과 결과가 맞지 않음.","improvements(개선점): 기록이 나아졌다면 사회사가의 고민이 사라짐."],"om":["편향","강점","이점","개선점"],"en":"Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers. Because of such biases in the historical record, social historians have to be very creative in their work.","ko":"그들이 실제로 기록을 남겼을 때조차, 이 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 들어가는 일이 거의 없었다. 역사 기록의 이런 편향 때문에, 사회사가들은 작업에서 매우 창의적이어야 한다.","hl":["such biases in the historical record","rarely ended up in archives"],"khl":["역사 기록의 이런 편향","들어가는 일이 거의 없었다"],"blocks":[{"t":"p","h":"such(이런)가 가리키는 것","x":["such(이런)는 앞에서 말한 내용을 묶어 받는 말이다.","앞에서 말한 것: 평범한 사람들은 기록을 거의 못 남겼다. 남긴 것도 보관이 잘 안 됐다.","결국 남은 기록은 엘리트 것뿐이다.","이것이 한쪽으로 치우친 기록, 곧 biases(편향)다.","fairness(공정함)를 넣으면 앞 내용을 정반대로 묶게 된다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["a range of(다양한)는 a variety of(다양한)와 같은 뜻이다.","inventive(독창적인)도 creative(창의적인) 자리에 자연스럽게 들어간다.","바뀐 단어가 셋이어도 고칠 것은 하나."]}],"post":["bias(편향) ↔ fairness(공정함)","남은 기록 = 거의 엘리트의 것"]},{"slots":[["ordinary"],["preserved"],["analyze","disregard","a"],["against_the_grain"],["silences","gaps","s"]],"opts":["analyze","reject","ignore","abandon"],"or":["analyze(분석하다): 엘리트의 문서를 분석하되 그대로 믿지 않는다는 다음 문장과 이어져 맞음.","reject(거부하다): 문서를 거부한다면 '그런 자료를' 거슬러 읽을 수 없음.","ignore(무시하다): 무시한 자료를 다음 문장에서 읽는다는 말과 부딪침.","abandon(버리다): 버린 자료로는 노예의 태도에 대한 힌트를 찾을 수 없음."],"om":["분석하다","거부하다","무시하다","버리다"],"en":"Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites. Yet rather than simply take such sources at face value, they read them “against the grain”.","ko":"다른 역사가들처럼, 사회사가들도 정부 관리, 고용주, 그 밖의 엘리트들이 만든 문서 자료를 분석한다. 그러나 그들은 그런 자료를 그저 액면 그대로 받아들이기보다, 그것을 ‘결을 거슬러’ 읽는다.","hl":["analyze textual sources","rather than simply take such sources at face value"],"khl":["문서 자료를 분석한다","그저 액면 그대로 받아들이기보다"],"blocks":[{"t":"pair","h":"두 문장 나란히","x":[["social historians analyze textual sources","사회사가들도 문서 자료를 분석한다 (자료를 쓴다)"],["rather than simply take such sources at face value","그런 자료를 그저 액면 그대로 받아들이지는 않는다 (쓰는 방식이 다르다)"]]},{"t":"p","h":"Yet(그러나)이 바꾸는 것","x":["Yet(그러나) 뒤에서 바뀌는 건 쓰느냐 마느냐가 아니다.","어떻게 읽느냐가 바뀐다.","disregard(무시하다)를 넣으면 자료를 아예 안 쓰는 셈이다.","안 쓰는 자료를 거슬러 읽을 수는 없다."]},{"t":"p","h":"함정","x":["gaps(빈틈들)는 silences(침묵들) 자리에 들어가도 '말해지지 않은 부분'이라는 뜻이 살아난다."]}],"post":["analyze(분석하다) ↔ disregard(무시하다)","엘리트의 문서도 쓰되 거꾸로 읽기"]},{"slots":[["ordinary","privileged","a"],["lacked"],["available"],["simply"],["hints"]],"opts":["ordinary","wealthy","royal","powerful"],"or":["ordinary(평범한): 엘리트와 맞서는 보통 사람들이라 rather than elites(엘리트보다)와 맞음.","wealthy(부유한): 부유한 사람들은 엘리트 쪽이라 비교가 성립하지 않음.","royal(왕족의): 왕족은 엘리트 중의 엘리트라 엘리트와 맞세울 수 없음.","powerful(권력 있는): 권력자들은 엘리트와 같은 편이라 비교의 두 편이 겹침."],"om":["평범한","부유한","왕족의","권력 있는"],"en":"Social history often emphasizes ordinary people rather than elites. Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.","ko":"사회사는 흔히 엘리트보다 평범한 사람들을 강조한다. 그러나 대부분의 장소와 시대에서 엘리트가 아닌 사람들은 교육을 받을 기회가 없었고, 그래서 상당한 양의 기록을 남기지 못했다.","hl":["ordinary people rather than elites","non-elites lacked access to education"],"khl":["엘리트보다 평범한 사람들을","교육을 받을 기회가 없었고"],"blocks":[{"t":"p","h":"묶음에서 튀는 단어","x":["다음 문장은 non-elites(엘리트가 아닌 사람들) 이야기다.","교육을 못 받고 기록도 못 남긴 사람들.","사회사가 주목하는 사람들이 바로 이들이다.","privileged(특권층의)는 엘리트와 같은 편이라 이 묶음에서 혼자 튄다.","\"엘리트보다 특권층을 강조한다\"는 같은 사람끼리 비교하는 말이 된다."]}],"post":["ordinary(평범한) ↔ privileged(특권층의)","사회사의 눈길 = 기록 못 남긴 보통 사람"]},{"slots":[["emphasizes","highlights","s"],["substantial"],["available","inaccessible","a"],["analyze"],["offer","provide","s"]],"opts":["available","unknown","forbidden","invisible"],"or":["available(이용할 수 있는): 보관소에 들어가야 연구자가 볼 수 있다는 말이라 맞음.","unknown(알려지지 않은): 보관소는 자료를 알리는 곳이라 반대 방향임.","forbidden(금지된): 연구자에게 금지된다면 보관소에 못 들어간 것이 아쉬울 까닭이 없음.","invisible(보이지 않는): 보관된 자료가 보이지 않는다는 말은 보관소의 역할과 맞지 않음."],"om":["이용할 수 있는","알려지지 않은","금지된","보이지 않는"],"en":"Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.","ko":"그들이 실제로 기록을 남겼을 때조차, 이 자료들은 보존되어 연구자들이 이용할 수 있게 되는 기록 보관소에 들어가는 일이 거의 없었다.","hl":["made available to researchers","rarely"],"khl":["연구자들이 이용할 수 있게","거의 없었다"],"blocks":[{"t":"tap","h":"한 줄 요약 복원","q":"이 문장을 한 줄로 줄이면?","a":["평범한 사람들의 기록은 연구자 손에 잘 닿지 않았다.","기록이 보관소에 들어가면 연구자가 쓸 수 있다.","그 좋은 곳에 거의 못 들어갔다는 것이 핵심."]},{"t":"p","h":"inaccessible(접근할 수 없는)을 넣고 다시 읽기","x":["\"연구자들이 접근할 수 없게 되는 보관소에 거의 안 들어갔다\"가 된다.","그러면 자료가 오히려 연구자 손에 잘 닿았다는 말이 된다.","뒤에 나오는 기록의 편향과 앞뒤가 맞지 않는다."]},{"t":"p","h":"함정","x":["highlights(부각하다)는 emphasizes(강조하다)와, provide(제공하다)는 offer(주다)와 같은 뜻이다.","바뀐 단어 셋 중 고칠 것은 하나뿐."]}],"post":["available(이용할 수 있는) ↔ inaccessible(접근할 수 없는)","보관소에 못 간 기록 = 연구자가 못 보는 기록"]}],"quiz":[{"w":"preserve","m":"보존하다","it":[["whisper","속삭이다","n"],["conserve","보존하다","s"],["destroy","파괴하다","a"],["translate","번역하다","n"],["protect","보호하다","s"],["ruin","망치다","a"],["borrow","빌리다","n"]]},{"w":"bias","m":"편향, 치우침","it":[["prejudice","편견","s"],["harvest","수확","n"],["fairness","공정함","a"],["ceiling","천장","n"],["partiality","편애, 치우침","s"],["impartiality","공평함","a"],["rhythm","리듬","n"]]},{"w":"analyze","m":"분석하다","it":[["kneel","무릎 꿇다","n"],["examine","살펴보다","s"],["synthesize","종합하다","a"],["sweep","쓸다","n"],["study","연구하다","s"],["neglect","소홀히 하다","a"],["yawn","하품하다","n"]]},{"w":"ordinary","m":"평범한, 보통의","it":[["common","흔한, 평범한","s"],["wet","젖은","n"],["extraordinary","비범한","a"],["rapid","빠른","n"],["everyday","일상의, 평범한","s"],["exceptional","특출한","a"],["honest","정직한","n"]]},{"w":"available","m":"이용할 수 있는","it":[["brave","용감한","n"],["accessible","접근할 수 있는","s"],["unavailable","이용할 수 없는","a"],["hollow","속이 빈","n"],["obtainable","얻을 수 있는","s"],["inaccessible","접근할 수 없는","a"],["tidy","깔끔한","n"]]}]}],"no":"39"},{"id":"2610g2-40","title":"어휘특훈 · 26년 10월 고2 40번","sub":"돌고래 뇌의 병렬 처리","tpl":"Dolphins’ brains have evolved {specialized} areas {dedicated} to echolocation, allowing them to process acoustic information more quickly and with {less} energy. One {key} adaptation is the structure of the dolphin’s auditory pathway. The signals from the ears are {rapidly} {transmitted} to the auditory cortex, the brain region {responsible} for processing sound. However, {unlike} many other mammals, dolphins have a highly specialized auditory cortex with {distinct} areas dedicated to processing different aspects of echolocation signals. Some areas may be responsible for {analyzing} the timing of echoes, while others {focus_on} the frequency content or the intensity of the sound. This specialization allows the dolphin’s brain to process echo information in {parallel}, rather than {sequentially}. Imagine a factory assembly line, where different workers are responsible for different tasks. By {dividing} the work among specialized areas, the brain can process information much faster and more {efficiently}. This parallel processing {reduces} the cognitive {load} associated with echolocation, allowing dolphins to {react} quickly to changes in their environment.","fn":["*echolocation: 반향 정위(소리를 내보내고 되돌아오는 메아리로 위치를 알아내는 능력)","*acoustic: 소리의, 음향의","*auditory pathway: 청각 경로","*auditory cortex: 청각 피질(소리를 처리하는 뇌 부위)","*echo: 메아리, 반향","*cognitive: 인지의"],"mean":{"specialized":"특화된, 전문화된","general":"일반적인, 두루 쓰이는","dedicated":"~에 전념하는, ~ 전용의","devoted":"~에 바쳐진, ~ 전용의","less":"더 적은","more":"더 많은","key":"핵심적인, 중요한","minor":"사소한, 중요하지 않은","rapidly":"빠르게","swiftly":"신속하게","slowly":"느리게","transmitted":"동사 transmit(전달하다)의 과거분사형 (be transmitted = 전달되다)","sent":"동사 send(보내다)의 과거분사형 (be sent = 보내지다)","relayed":"동사 relay(중계하다, 전달하다)의 과거분사형 (be relayed = 전달되다)","responsible":"~을 담당하는, 책임지는 (responsible for = ~을 맡은)","unlike":"~와 달리","like":"~처럼, ~와 마찬가지로","distinct":"뚜렷이 구별되는, 별개의","separate":"분리된, 별개의","identical":"똑같은, 동일한","analyzing":"동사 analyze(분석하다)의 -ing형. 동명사","examining":"동사 examine(살펴보다)의 -ing형. 동명사","ignoring":"동사 ignore(무시하다)의 -ing형. 동명사","focus on":"~에 집중하다","concentrate on":"~에 집중하다","neglect":"소홀히 하다, 방치하다","parallel":"병렬, 동시 진행 (in parallel = 동시에 나란히)","series":"연속, 직렬 (in series = 하나씩 차례로)","sequentially":"순차적으로, 하나씩 차례로","simultaneously":"동시에","dividing":"동사 divide(나누다)의 -ing형. 동명사","splitting":"동사 split(나누다, 쪼개다)의 -ing형. 동명사","efficiently":"효율적으로","effectively":"효과적으로","wastefully":"낭비하며, 비효율적으로","reduces":"동사 reduce(줄이다)의 3인칭 단수형","lowers":"동사 lower(낮추다)의 3인칭 단수형","increases":"동사 increase(늘리다)의 3인칭 단수형","load":"부담, 짐","burden":"부담, 짐","react":"반응하다","respond":"반응하다, 대응하다"},"comp":[{"no":"40","slots":[["specialized"],["less","more","a"],["key"],["rapidly"],["parallel"]],"opts":["less","extra","greater","wasted"],"or":["less(더 적은): 특화된 영역 덕분에 일을 덜 들이고 처리한다는 말이라 글 끝의 '부담 감소'와 맞음.","extra(추가의): 에너지를 더 쓴다면 특화의 장점이 사라짐.","greater(더 큰): 더 큰 에너지를 든다는 말은 more efficiently(더 효율적으로)와 부딪침.","wasted(낭비된): 낭비된 에너지로 처리한다는 말은 특화의 이점과 정반대임."],"om":["더 적은","추가의","더 큰","낭비된"],"en":"Dolphins’ brains have evolved specialized areas dedicated to echolocation, allowing them to process acoustic information more quickly and with less energy.","ko":"돌고래의 뇌는 반향 정위에 전념하는 특화된 영역들을 진화시켜 왔고, 그 덕분에 소리 정보를 더 빠르게, 더 적은 에너지로 처리할 수 있다.","hl":["with less energy","more quickly"],"khl":["더 적은 에너지로","더 빠르게"],"blocks":[{"t":"p","h":"and(그리고)로 묶인 두 장점","x":["more quickly(더 빠르게) and with less energy(더 적은 에너지로).","둘 다 특화가 주는 좋은 점이다.","빠르면서 힘도 덜 든다.","more(더 많은)를 넣으면 빠르지만 힘이 더 드는 셈이 되어 한쪽은 단점이 된다.","글 끝의 more efficiently(더 효율적으로)와 reduces the cognitive load(인지 부담을 줄인다)도 이 장점을 다시 말한다."]}],"post":["less(더 적은) ↔ more(더 많은)","특화된 뇌 = 더 빠르고 힘은 덜 듦"]},{"no":"40","slots":[["transmitted","relayed","s"],["responsible"],["unlike","like","a"],["distinct"],["dividing"]],"opts":["unlike","similar to","as with","along with"],"or":["unlike(~와 달리): However(그러나)와 함께 돌고래만의 특별한 구조를 꺼내는 말이라 맞음.","similar to(~와 비슷하게): 다른 포유류와 비슷하다면 '고도로 특화된'이라는 특별함이 사라짐.","as with(~의 경우처럼): 다른 포유류도 같다는 말이 되어 However(그러나)의 반전과 맞지 않음.","along with(~와 함께): 다른 포유류와 함께 가진 구조라면 돌고래만의 적응이 아님."],"om":["~와 달리","~와 비슷하게","~의 경우처럼","~와 함께"],"en":"The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound. However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals.","ko":"귀에서 온 신호는 소리 처리를 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다. 그러나 다른 많은 포유류와 달리, 돌고래는 반향 정위 신호의 서로 다른 측면을 처리하는 데 전념하는 뚜렷이 구별된 영역들을 가진, 고도로 특화된 청각 피질을 갖고 있다.","hl":["However, unlike many other mammals","highly specialized"],"khl":["그러나 다른 많은 포유류와 달리","고도로 특화된"],"blocks":[{"t":"p","h":"However(그러나)가 여는 반전","x":["앞 문장은 귀 → 청각 피질로 신호가 가는 이야기다.","이건 포유류라면 다 비슷하다.","However(그러나) 뒤에서 돌고래만의 특별한 점이 나온다.","like(~처럼)를 넣으면 \"다른 포유류처럼 고도로 특화되어 있다\"가 된다.","반전이 사라지고, 돌고래만의 적응이라는 글의 중심도 무너진다."]},{"t":"p","h":"고치면 안 되는 단어","x":["relayed(전달되다)는 transmitted(전달되다)와 같은 뜻이라 그대로 둔다."]}],"post":["unlike(~와 달리) ↔ like(~처럼)","다른 포유류와 다른 돌고래만의 청각 피질"]}],"compquiz":[{"w":"less","m":"더 적은","it":[["fewer","더 적은 수의","s"],["noisy","시끄러운","n"],["more","더 많은","a"],["wooden","나무로 된","n"],["smaller","더 작은","s"],["gre or processing sound.","ko":"귀에서 온 신호는 소리 처리를 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다.","hl":["rapidly transmitted","the auditory cortex"],"khl":["빠르게 전달된다","청각 피질"],"blocks":[{"t":"pair","h":"속도를 말하는 단어 묶음","x":[["more quickly","더 빠르게 (첫 문장)"],["rapidly transmitted","빠르게 전달된다 (이 문장)"],["much faster","훨씬 더 빠르게 (조립 라인 뒤)"],["react quickly","빠르게 반응하다 (마지막 문장)"]]},{"t":"p","h":"묶음에서 튀는 단어","x":["글 처음부터 끝까지 '빠르다'가 되풀이된다.","slowly(느리게)만 혼자 반대쪽이다.","속도를 자랑하는 글에서 신호가 느리게 간다는 말은 들어갈 수 없다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","devoted(~에 바쳐진)는 dedicated(~에 전념하는)와, sent(보내지다)는 transmitted(전달되다)와 같은 뜻이다.","둘을 고쳤다면 철자만 외운 것."]}],"post":["rapidly(빠르게) ↔ slowly(느리게)","처음부터 끝까지 '빠르다'의 글"]},{"slots":[["key"],["distinct","identical","a"],["focus_on","concentrate on","s"],["dividing"],["reduces"]],"opts":["distinct","similar","blended","empty"],"or":["distinct(뚜렷이 구별되는): 영역마다 맡는 측면이 다르다는 바로 뒤 내용과 맞음.","similar(비슷한): 비슷한 영역들이라면 서로 다른 측면을 나눠 맡는다는 말과 부딪침.","blended(뒤섞인): 영역이 뒤섞여 있다면 타이밍 담당, 주파수 담당으로 나뉠 수 없음.","empty(비어 있는): 빈 영역은 아무것도 처리하지 못함."],"om":["뚜렷이 구별되는","비슷한","뒤섞인","비어 있는"],"en":"However, unlike many other mammals, dolphins have a highly specialized auditory cortex with distinct areas dedicated to processing different aspects of echolocation signals. Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.","ko":"그러나 다른 많은 포유류와 달리, 돌고래는 반향 정위 신호의 서로 다른 측면을 처리하는 데 전념하는 뚜렷이 구별된 영역들을 가진, 고도로 특화된 청각 피질을 갖고 있다. 어떤 영역은 반향의 타이밍을 분석하는 일을 맡고, 다른 영역은 소리의 주파수 성분이나 세기에 집중할 수 있다.","hl":["distinct areas dedicated to processing different aspects","Some areas","others"],"khl":["서로 다른 측면을 처리하는 데 전념하는 뚜렷이 구별된 영역들","어떤 영역은","다른 영역은"],"blocks":[{"t":"p","h":"바로 뒤 문장이 보여 주는 것","x":["Some areas(어떤 영역): 메아리의 타이밍 담당.","others(다른 영역): 소리의 주파수나 세기 담당.","영역마다 맡은 일이 다르다.","그러니 영역들은 서로 뚜렷이 구별되어야 한다.","identical(똑같은)을 넣으면 똑같은 영역들이 서로 다른 일을 맡는다는 모순이 된다."]},{"t":"p","h":"고치면 안 되는 단어","x":["concentrate on(~에 집중하다)은 focus on(~에 집중하다)과 같은 말이다.","while others concentrate on the frequency content(다른 영역은 주파수 성분에 집중한다)도 자연스럽다."]}],"post":["distinct(뚜렷이 구별되는) ↔ identical(똑같은)","영역마다 다른 담당 = 타이밍 / 주파수 / 세기"]},{"slots":[["responsible"],["analyzing"],["parallel","series","a"],["dividing"],["efficiently"]],"opts":["parallel","turn","order","silence"],"or":["in parallel(동시에 나란히): rather than sequentially(순차적으로가 아니라)와 맞서는 짝이라 맞음.","in turn(차례로): 차례로 처리하는 것이 곧 순차적으로 처리하는 것이라 뒤와 같은 말이 됨.","in order(순서대로): 순서대로 처리는 sequentially(순차적으로)와 같은 뜻이라 비교가 안 됨.","in silence(조용히): 소리 정보를 다루는 방식을 말하는 자리에 조용히는 엉뚱함."],"om":["동시에 나란히","차례로","순서대로","조용히"],"en":"This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially. Imagine a factory assembly line, where different workers are responsible for different tasks.","ko":"이러한 특화 덕분에 돌고래의 뇌는 반향 정보를 순차적으로가 아니라 병렬로 처리할 수 있다. 서로 다른 노동자들이 서로 다른 작업을 맡는 공장 조립 라인을 상상해 보라.","hl":["in parallel, rather than sequentially","assembly line"],"khl":["순차적으로가 아니라 병렬로","조립 라인"],"blocks":[{"t":"p","h":"rather than(~가 아니라)은 반대를 맞세운다","x":["A rather than B(B가 아니라 A)에서 A와 B는 서로 반대여야 한다.","B 자리에 sequentially(순차적으로, 하나씩 차례로)가 있다.","그러니 A는 '동시에 나란히'여야 한다.","series(직렬, 하나씩 차례로)를 넣으면 \"차례로가 아니라 차례로\"가 된다."]},{"t":"tap","h":"질문 하나","q":"조립 라인에서 노동자들은 한 명씩 차례로 일할까?","a":["아니다. 각자 맡은 작업을 동시에 한다.","돌고래 뇌의 영역들도 그렇다.","타이밍, 주파수, 세기를 한꺼번에 나란히 처리한다."]}],"post":["in parallel(동시에 나란히) ↔ in series(하나씩 차례로)","돌고래 뇌 = 동시에 돌아가는 조립 라인"]},{"slots":[["transmitted"],["sequentially"],["reduces","increases","a"],["load","burden","s"],["react","respond","s"]],"opts":["reduces","doubles","creates","raises"],"or":["reduces(줄이다): 일을 나눠 효율이 오르니 머리의 부담이 줄어 빠른 반응이 가능하다는 흐름과 맞음.","doubles(두 배로 늘리다): 부담이 두 배가 되면 빠르게 반응할 수 없음.","creates(만들어 내다): 병렬 처리가 부담을 새로 만든다는 말은 효율의 장점과 반대임.","raises(높이다): 부담을 높이면서 반응이 빨라진다는 원인-결과는 성립하지 않음."],"om":["줄이다","두 배로 늘리다","만들어 내다","높이다"],"en":"This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.","ko":"이러한 병렬 처리는 반향 정위와 관련된 인지 부담을 줄여, 돌고래가 주변 환경의 변화에 빠르게 반응할 수 있게 한다.","hl":["reduces the cognitive load","allowing dolphins to react quickly"],"khl":["인지 부담을 줄여","빠르게 반응할 수 있게"],"blocks":[{"t":"p","h":"원인과 결과","x":["원인: 인지 부담이 줄어든다.","결과: 환경 변화에 빠르게 반응한다.","머리가 덜 바쁘니 바로 반응할 수 있다.","increases(늘리다)를 넣으면 부담이 커졌는데 반응은 빨라졌다는 말이 된다.","원인과 결과가 서로 등을 돌린다."]},{"t":"p","h":"함정","x":["burden(부담)은 load(부담)와, respond(반응하다)는 react(반응하다)와 같은 뜻이다.","바뀐 단어 셋 중 고칠 것은 하나."]}],"post":["reduce(줄이다) ↔ increase(늘리다)","부담 감소 → 빠른 반응"]}],"quiz":[{"w":"specialized","m":"특화된, 전문화된","it":[["specific","특정한","s"],["thirsty","목마른","n"],["general","일반적인","a"],["curly","곱슬곱슬한","n"],["dedicated","~ 전용의","s"],["generalized","일반화된","a"],["sour","신맛이 나는","n"]]},{"w":"rapidly","m":"빠르게","it":[["swiftly","신속하게","s"],["honestly","정직하게","n"],["slowly","느리게","a"],["quickly","빨리","s"],["politely","공손하게","n"],["gradually","서서히","a"],["warmly","따뜻하게","n"]]},{"w":"distinct","m":"뚜렷이 구별되는, 별개의","it":[["separate","분리된, 별개의","s"],["frozen","얼어붙은","n"],["identical","똑같은","a"],["discrete","별개의","s"],["humble","겸손한","n"],["indistinguishable","구별할 수 없는","a"],["rusty","녹슨","n"]]},{"w":"parallel","m":"병렬의, 동시에 나란히 진행되는","it":[["simultaneous","동시의","s"],["sequential","순차적인","a"],["muddy","진흙투성이의","n"],["concurrent","동시에 일어나는","s"],["serial","직렬의, 연속적인","a"],["generous","관대한","n"],["bitter","쓴","n"]]},{"w":"reduce","m":"줄이다","it":[["lessen","줄이다","s"],["sew","바느질하다","n"],["increase","늘리다","a"],["decrease","줄이다","s"],["whistle","휘파람 불다","n"],["raise","높이다","a"],["bake","굽다","n"]]}]},{"items":[{"slots":[["dedicated"],["key","minor","a"],["responsible"],["focus_on"],["efficiently"]],"opts":["key","trivial","failed","harmful"],"or":["key(핵심적인): 이 구조가 뒤에 나오는 빠른 병렬 처리의 출발점이라 맞음.","trivial(하찮은): 글 전체가 이 구조의 효과를 설명하므로 하찮을 수 없음.","failed(실패한): 실패한 적응이라면 더 빠르고 효율적인 처리가 나올 수 없음.","harmful(해로운): 부담을 줄이고 반응을 빠르게 하는 구조라 해로운 것과 반대임."],"om":["핵심적인","하찮은","실패한","해로운"],"en":"One key adaptation is the structure of the dolphin’s auditory pathway. The signals from the ears are rapidly transmitted to the auditory cortex, the brain region responsible for processing sound.","ko":"한 가지 핵심적인 적응은 돌고래의 청각 경로 구조이다. 귀에서 온 신호는 소리 처리를 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다.","hl":["One key adaptation","the structure of the dolphin’s auditory pathway"],"khl":["한 가지 핵심적인 적응","돌고래의 청각 경로 구조"],"blocks":[{"t":"p","h":"글 흐름 속 위치","x":["첫 문장: 돌고래 뇌가 더 빠르고 덜 힘들게 처리한다.","이 문장: 그 비결 하나를 꺼낸다.","그다음 문장부터 끝까지 이 구조 하나만 자세히 설명한다.","글 전체가 매달리는 내용을 minor(사소한)라고 부를 수는 없다."]},{"t":"p","h":"필자의 의도","x":["필자는 이 구조로 돌고래가 얼마나 빠른지 보여 주려 한다.","그래서 하찮은 것이 아니라 핵심이라고 먼저 못 박아 둔다."]}],"post":["key(핵심적인) ↔ minor(사소한)","청각 경로 구조 = 빠른 처리의 비결"]},{"slots":[["distinct","separate","s"],["analyzing","ignoring","a"],["parallel"],["dividing","splitting","s"],["load"]],"opts":["analyzing","blocking","erasing","hiding"],"or":["analyzing(분석하는 것): 영역이 메아리의 타이밍이라는 한 측면을 맡아 처리한다는 말이라 맞음.","blocking(막는 것): 타이밍 정보를 막는다면 그 영역이 처리할 것이 없음.","erasing(지우는 것): 메아리의 타이밍을 지운다면 거리를 알아낼 수 없음.","hiding(숨기는 것): 정보를 숨기는 영역은 '처리 담당'이라는 말과 맞지 않음."],"om":["분석하는 것","막는 것","지우는 것","숨기는 것"],"en":"Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.","ko":"어떤 영역은 반향의 타이밍을 분석하는 일을 맡고, 다른 영역은 소리의 주파수 성분이나 세기에 집중할 수 있다.","hl":["responsible for analyzing the timing of echoes","focus on"],"khl":["타이밍을 분석하는 일을 맡고","집중할"],"blocks":[{"t":"pair","h":"while(~하는 한편)로 나란히 선 두 영역","x":[["Some areas may be responsible for analyzing the timing of echoes","어떤 영역은 반향의 타이밍을 분석한다"],["while others focus on the frequency content","다른 영역은 주파수 성분에 집중한다"]]},{"t":"p","h":"ignoring(무시하는 것)을 넣고 다시 읽기","x":["\"어떤 영역은 타이밍을 무시하는 일을 맡는다\"가 된다.","다른 영역은 각자 맡은 것에 집중하는데, 이 영역만 일을 버리는 셈이다.","처리 담당 영역이 정보를 무시할 수는 없다."]},{"t":"p","h":"함정","x":["separate(별개의)는 distinct(뚜렷이 구별되는)와, splitting(나누는 것)은 dividing(나누는 것)과 뜻이 같다.","둘 다 그대로 둔다."]}],"post":["analyze(분석하다) ↔ ignore(무시하다)","영역별 분업 = 타이밍 담당 / 주파수 담당"]},{"slots":[["specialized"],["rapidly"],["sequentially","simultaneously","a"],["efficiently","effectively","s"],["react"]],"opts":["sequentially","jointly","instantly","collectively"],"or":["sequentially(순차적으로): in parallel(병렬로)과 반대되는 방식이라 rather than(~가 아니라)의 짝으로 맞음.","jointly(함께): 함께 처리하는 것은 병렬과 비슷해서 반대 짝이 되지 못함.","instantly(즉시): 병렬 처리의 장점이 빠름인데 '즉시가 아니라'는 앞뒤가 안 맞음.","collectively(한데 모여): 여러 영역이 함께하는 쪽이라 병렬과 맞서는 말이 아님."],"om":["순차적으로","함께","즉시","한데 모여"],"en":"This specialization allows the dolphin’s brain to process echo information in parallel, rather than sequentially.","ko":"이러한 특화 덕분에 돌고래의 뇌는 반향 정보를 순차적으로가 아니라 병렬로 처리할 수 있다.","hl":["rather than sequentially","in parallel"],"khl":["순차적으로가 아니라","병렬로"],"blocks":[{"t":"p","h":"simultaneously(동시에)를 넣으면","x":["in parallel(병렬로)은 여러 일을 동시에 나란히 한다는 뜻이다.","\"동시에가 아니라 병렬로\"가 되면 같은 말을 맞세우는 셈이다.","rather than(~가 아니라) 뒤에는 반대 방식이 와야 한다.","하나씩 차례로, 곧 sequentially(순차적으로)."]},{"t":"p","h":"고치면 안 되는 단어","x":["effectively(효과적으로)는 efficiently(효율적으로) 자리에서 '잘, 제대로'의 뜻을 살린다.","faster and more effectively(더 빠르고 더 효과적으로)도 자연스럽다."]}],"post":["sequentially(순차적으로) ↔ simultaneously(동시에)","하나씩이 아니라 한꺼번에"]},{"slots":[["less"],["responsible"],["distinct"],["focus_on","neglect","a"],["sequentially"]],"opts":["focus_on","give_up","shut_out","tune_out"],"or":["focus on(~에 집중하다): 다른 영역이 주파수나 세기를 맡아 처리한다는 말이라 맞음.","give up(포기하다): 주파수 성분을 포기하면 그 정보는 처리되지 않음.","shut out(차단하다): 소리의 세기를 차단하는 영역은 처리 담당이 될 수 없음.","tune out(귀를 닫다): 정보를 듣지 않는 영역이라면 분업이 성립하지 않음."],"om":["~에 집중하다","포기하다","차단하다","귀를 닫다"],"en":"Some areas may be responsible for analyzing the timing of echoes, while others focus on the frequency content or the intensity of the sound.","ko":"어떤 영역은 반향의 타이밍을 분석하는 일을 맡고, 다른 영역은 소리의 주파수 성분이나 세기에 집중할 수 있다.","hl":["others focus on the frequency content","responsible for analyzing"],"khl":["다른 영역은 소리의 주파수 성분이나 세기에 집중할","분석하는 일을 맡고"],"blocks":[{"t":"p","h":"조립 라인 비유와 연결","x":["조립 라인에서 노동자마다 맡은 작업이 있다.","누구는 바퀴, 누구는 문짝.","돌고래 뇌도 같다. 어떤 영역은 타이밍, 다른 영역은 주파수와 세기.","neglect(소홀히 하다)를 넣으면 맡은 작업을 내버려 두는 노동자가 된다.","그런 공장은 빨라질 수 없다."]}],"post":["focus on(~에 집중하다) ↔ neglect(소홀히 하다)","영역마다 맡은 일에 집중 = 조립 라인의 노동자"]},{"slots":[["rapidly","swiftly","s"],["analyzing"],["efficiently","wastefully","a"],["reduces","lowers","s"],["react"]],"opts":["efficiently","carelessly","clumsily","randomly"],"or":["efficiently(효율적으로): 일을 나누면 낭비 없이 처리되어 부담이 준다는 흐름과 맞음.","carelessly(부주의하게): 정교한 분업을 설명하는 글에 부주의함은 반대 방향임.","clumsily(서투르게): 서투른 처리라면 빠른 반응으로 이어질 수 없음.","randomly(무작위로): 영역마다 정해진 일을 맡는 분업과 반대임."],"om":["효율적으로","부주의하게","서투르게","무작위로"],"en":"By dividing the work among specialized areas, the brain can process information much faster and more efficiently. This parallel processing reduces the cognitive load associated with echolocation, allowing dolphins to react quickly to changes in their environment.","ko":"특화된 영역들 사이에 일을 나눔으로써, 뇌는 정보를 훨씬 더 빠르고 효율적으로 처리할 수 있다. 이러한 병렬 처리는 반향 정위와 관련된 인지 부담을 줄여, 돌고래가 주변 환경의 변화에 빠르게 반응할 수 있게 한다.","hl":["much faster and more efficiently","reduces the cognitive load"],"khl":["훨씬 더 빠르고 효율적으로","인지 부담을 줄여"],"blocks":[{"t":"tap","h":"글 전체를 한 줄로","q":"이 글을 한 줄로 줄이면?","a":["돌고래 뇌는 일을 나눠 동시에 처리해서 빠르고 덜 힘들다.","빠르다 = faster(더 빠르게)","덜 힘들다 = efficiently(효율적으로), less energy(더 적은 에너지)"]},{"t":"p","h":"wastefully(낭비하며)가 안 되는 이유","x":["첫 문장에서 이미 with less energy(더 적은 에너지로)라고 했다.","바로 뒤 문장도 인지 부담이 준다고 한다.","그 사이에 낭비하며 처리한다는 말이 끼어들 수 없다."]},{"t":"p","h":"함정","x":["swiftly(신속하게)는 rapidly(빠르게)와, lowers(낮추다)는 reduces(줄이다)와 같은 방향이다.","바뀐 단어 셋 중 하나만 반대쪽."]}],"post":["efficiently(효율적으로) ↔ wastefully(낭비하며)","분업 = 빠르고 덜 힘든 처리"]}],"quiz":[{"w":"key","m":"핵심적인, 중요한","it":[["crucial","결정적인, 중대한","s"],["salty","짠","n"],["minor","사소한","a"],["central","중심적인","s"],["sleepy","졸린","n"],["peripheral","주변적인, 지엽적인","a"],["shiny","반짝이는","n"]]},{"w":"analyze","m":"분석하다","it":[["examine","살펴보다","s"],["knit","뜨개질하다","n"],["overlook","간과하다","a"],["study","연구하다","s"],["sneeze","재채기하다","n"],["neglect","소홀히 하다","a"],["paint","칠하다","n"]]},{"w":"sequential uch time on their hands may fill that time with troubling thoughts and behavior.","ko":"‘한가한 시간은 악마의 작업장이다’라는 말은, 시간이 너무 많이 남는 사람들이 그 시간을 문제를 일으키는 생각과 행동으로 채울 수 있다는 뜻으로 여겨진다.","hl":["troubling thoughts and behavior","the devil’s workshop"],"khl":["문제를 일으키는 생각과 행동","악마의 작업장"],"blocks":[{"t":"p","h":"속담이 말하는 것","x":["Idle time is the devil’s workshop(한가한 시간은 악마의 작업장이다).","할 일 없이 남는 시간에 나쁜 생각이 끼어든다는 속담이다.","악마의 작업장에서 만들어지는 건 당연히 나쁜 것이다.","wholesome(건전한)을 넣으면 악마가 건전한 생각을 만들어 주는 꼴이 된다."]},{"t":"p","h":"그대로 둘 두 단어","x":["properly(제대로)는 adequately(적절히) 자리에 넣어도 뜻이 같다.","reliant on(~에 기대는)도 dependent on(~에 의존하는)과 같은 말이다.","둘을 고쳤다면 본문 철자만 외운 것."]}],"post":["troubling(문제를 일으키는) ↔ wholesome(건전한)","남는 시간 = 악마의 작업장"]},{"slots":[["negative"],["wasted","squandered","s"],["lucky","unfortunate","a"],["luxury"],["comprehend"]],"opts":["lucky","foolish","ashamed","miserable"],"or":["lucky(운이 좋은): 바로 뒤에서 무료함을 안전할 때만 누리는 luxury(사치)라고 하니 맞음.","foolish(어리석은): 무료함을 어리석다고 보면 뒤에 이어지는 '사치', '기회'라는 칭찬과 맞지 않음.","ashamed(부끄러운): 부끄러워할 일이라면 무료함을 성장의 기회로 보자는 주장과 반대임.","miserable(비참한): 비참하다는 건 위험 속에서는 누릴 수 없는 사치라는 설명과 부딪침."],"om":["운이 좋은","어리석은","부끄러운","비참한"],"en":"Reflecting, just how lucky are we to be bored? Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone.","ko":"곰곰이 생각해 보면, 우리가 무료할 수 있다는 건 정말 얼마나 운이 좋은 일인가? 무료함은 위험이 있는 곳에는 존재하지 않는다. 그것은 안전한 곳에서만 누리는 여유로운 소일거리이기 때문이다.","hl":["how lucky are we to be bored","in the presence of danger"],"khl":["얼마나 운이 좋은 일인가","위험이 있는 곳"],"blocks":[{"t":"tap","h":"질문 하나","q":"왜 무료한 게 운이 좋은 일일까?","a":["무료하다는 건 지금 위험하지 않다는 뜻이기 때문이다.","위험이 닥치면 지루할 틈도 없다.","그래서 무료함은 안전하다는 신호다."]},{"t":"p","h":"unfortunate(불운한)를 넣고 다시 읽기","x":["\"무료하다니 우리는 얼마나 불운한가?\"가 된다.","그런데 바로 다음 문장은 무료함을 안전한 곳에서만 누리는 것이라고 한다.","불운이 아니라 행운의 증거다."]},{"t":"p","h":"고치지 말 것","x":["squandered(허비된)는 wasted(낭비된)와 뜻이 같다.","\"이렇게 보지 말자\"는 목록 속 단어라 그대로 맞다."]}],"post":["lucky(운이 좋은) ↔ unfortunate(불운한)","무료함 = 지금 안전하다는 신호"]},{"slots":[["safe"],["luxury"],["inactive","hectic","a"],["hazardous"],["paramount"]],"opts":["inactive","busy","chaotic","demanding"],"or":["inactive(할 일이 없는): 무료함은 아무 일도 없을 때 생기므로 safe(안전한)와 짝을 이뤄 맞음.","busy(바쁜): 바쁜 상황에서는 지루할 틈이 없어 무료함이 생길 수 없음.","chaotic(혼란스러운): 혼란스러운 상황은 위험에 가까워 무료함이 나타나는 자리와 반대임.","demanding(힘이 많이 드는): 할 일이 쏟아지는 상황이라 무료함과 맞지 않음."],"om":["할 일이 없는","바쁜","혼란스러운","힘이 많이 드는"],"en":"Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment.","ko":"무료함은 대개 안전하고 할 일이 없는 상황에서 나타나는 사치로 볼 수 있으며, 주변 환경을 음미하고 이해할 기회를 준다.","hl":["safe and inactive situations","a luxury"],"khl":["안전하고 할 일이 없는 상황","사치"],"blocks":[{"t":"pair","h":"and로 묶인 짝","x":[["safe","안전한 (위험이 없음)"],["inactive","할 일이 없는 (바쁘지 않음)"]]},{"t":"p","h":"hectic(정신없이 바쁜)이 안 되는 이유","x":["무료함은 할 일이 없을 때 생긴다.","정신없이 바쁜 상황에서는 지루할 틈이 없다.","\"정신없이 바쁜 상황에서 나타나는 무료함\"은 말 자체가 모순이다.","and(그리고) 앞의 safe(안전한)와도 결이 맞아야 한다."]}],"post":["inactive(할 일이 없는) ↔ hectic(정신없이 바쁜)","무료함이 생기는 곳 = 안전하고 한가한 상황"]},{"slots":[["luxury","privilege","s"],["comprehend","grasp","s"],["unavailable"],["profound","shallow","a"],["constructive"]],"opts":["profound","superficial","careless","hasty"],"or":["profound(깊은): paramount(가장 중요한) 일로 권하는 성찰이니 깊이가 있어야 맞음.","superficial(피상적인): 겉핥기 성찰을 '무엇보다 중요하다'며 권할 리 없음.","careless(부주의한): 부주의한 성찰은 성장의 기회가 될 수 없음.","hasty(성급한): 표현하기 전에 듣고 관찰하라는 다음 문장과 정반대임."],"om":["깊은","피상적인","부주의한","성급한"],"en":"Thus, it is paramount to utilize idle moments for profound self-reflection. It represents an occasion to listen, observe, and appreciate before expressing.","ko":"따라서 한가한 순간을 깊은 자기 성찰에 활용하는 것이 무엇보다 중요하다. 그것은 표현하기 전에 듣고, 관찰하고, 음미할 기회이다.","hl":["profound self-reflection","before expressing"],"khl":["깊은 자기 성찰","표현하기 전에"],"blocks":[{"t":"flow","h":"Thus(따라서)가 잇는 고리","x":["무료함은 안전할 때만 누리는 사치","위험할 땐 누릴 수 없음","따라서 한가한 순간은 깊은 자기 성찰에","듣고, 관찰하고, 음미한 뒤에 표현"],"at":2},{"t":"p","h":"shallow(얕은)를 넣으면","x":["\"얕은 자기 성찰에 쓰는 것이 무엇보다 중요하다\"가 된다.","귀한 사치를 얕게 라 지루할 틈이 없음."],"om":["안전한","위험한","위협적인","적대적인"],"en":"Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone.","ko":"무료함은 위험이 있는 곳에는 존재하지 않는다. 그것은 안전한 곳에서만 누리는 여유로운 소일거리이기 때문이다.","hl":["in a safe zone","in the presence of danger"],"khl":["안전한 곳","위험이 있는 곳"],"blocks":[{"t":"pair","h":"한 문장 속 대조","x":[["in the presence of danger","위험이 있는 곳 → 무료함 없음"],["in a safe zone","안전한 곳 → 무료함 있음"]]},{"t":"p","h":"dangerous(위험한)를 넣고 읽기","x":["\"무료함은 위험한 곳에서만 누리는 소일거리\"가 된다.","같은 문장 앞부분은 위험이 있으면 무료함이 없다고 했다.","한 문장 안에서 스스로 부딪친다."]},{"t":"p","h":"함정","x":["uneventful(별일 없는)은 inactive(할 일이 없는) 자리에 넣어도 자연스럽다.","별일 없이 조용한 상황이 바로 무료함이 생기는 곳이다."]}],"post":["safe(안전한) ↔ dangerous(위험한)","위험 앞에서는 지루할 틈도 없음"]},{"slots":[["lucky"],["luxury","burden","a"],["hazardous"],["paramount"],["constructive"]],"opts":["luxury","curse","punishment","threat"],"or":["luxury(사치): 다음 문장에서 the luxury of boredom(무료함이라는 사치)으로 다시 받으니 맞음.","curse(저주): 저주라면 환경을 음미하고 이해할 기회를 준다는 뒷말과 맞지 않음.","punishment(벌): 벌이라면 무료한 게 운이 좋다고 한 앞 문장과 부딪침.","threat(위협): 무료함은 위험이 없는 곳에서 생기니 위협이라 부를 수 없음."],"om":["사치","저주","벌","위협"],"en":"Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, providing an occasion to appreciate and comprehend the environment. In hazardous circumstances, the luxury of boredom is unavailable.","ko":"무료함은 대개 안전하고 할 일이 없는 상황에서 나타나는 사치로 볼 수 있으며, 주변 환경을 음미하고 이해할 기회를 준다. 위험한 상황에서는 무료함이라는 사치를 누릴 수 없다.","hl":["a luxury","the luxury of boredom"],"khl":["사치","무료함이라는 사치"],"blocks":[{"t":"p","h":"다음 문장이 같은 말을 다시 쓴다","x":["바로 다음 문장에 the luxury of boredom(무료함이라는 사치)이 나온다.","글쓴이가 같은 말을 두 번 써서 못 박은 것이다.","burden(짐)을 넣으면 앞에서는 짐, 뒤에서는 사치가 된다.","뒤에 오는 providing an occasion(기회를 주며)과도 맞지 않는다."]},{"t":"tap","h":"글쓴이의 눈으로","q":"글쓴이가 보는 무료함은 어떤 것일까?","a":["안전할 때만 누릴 수 있는 귀한 것.","그래서 lucky(운이 좋은), luxury(사치), opportunity(기회) 같은 말이 줄줄이 이어진다."]}],"post":["luxury(사치) ↔ burden(짐)","무료함 = 안전할 때만 누리는 귀한 것"]},{"slots":[["crucial","vital","s"],["safe"," ","m":"사치, 호사","it":[["harbor","항구","n"],["indulgence","(마음껏) 누림, 사치","s"],["necessity","필수품, 꼭 필요한 것","a"],["ladder","사다리","n"],["extravagance","사치, 낭비","s"],["burden","짐, 부담","a"],["receipt","영수증","n"]]},{"w":"unavailable","m":"누릴 수 없는, 이용할 수 없는","it":[["inaccessible","접근할 수 없는","s"],["loyal","충실한","n"],["available","이용할 수 있는","a"],["wooden","나무로 된","n"],["unobtainable","손에 넣을 수 없는","s"],["accessible","이용할 수 있는","a"],["curious","호기심 많은","n"]]}]}],"no":"41-42"}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+'번<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+'번 · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+'번 지문</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
