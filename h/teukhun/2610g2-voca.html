<title>어휘특훈 · 26년 10월 고2</title>

<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>

): 기간이 짧으면 오히려 가까운 미래라 further into the future(더 먼 미래로)와 부딪침.","safer(더 안전한): 안전한 기간일수록 못 돌려받을 가능성이 높다는 건 앞뒤가 안 맞고, 뒤의 '더 먼 미래' 설명과도 이어지지 않음.","cheaper(더 싼): term(기간)은 싸고 비싸고를 따지는 말이 아니고, 뒤의 '더 먼 미래'와도 이어지지 않음."],"om":["더 긴","더 짧은","더 안전한","더 싼"],"en":"The longer the term of the loan, the higher the chance you won't be paid back because it is further into the future ― which by definition is unknowable ― and the longer you will have to wait before spending the money yourself.","ko":"대출 기간이 길수록 돈을 돌려받지 못할 가능성은 더 높아진다. 더 먼 미래의 일이고, 미래는 원래 알 수 없는 것이기 때문이다. 또 그 돈을 직접 쓰기까지 더 오래 기다려야 한다.","hl":["The longer the term of the loan","further into the future"],"khl":["대출 기간이 길수록","더 먼 미래의 일"],"blocks":[{"t":"p","h":"~할수록 더 ~하다 짝","x":["이 문장은 \"길수록, 더 높다\" 짝으로 움직인다.","기간이 길다 → 더 먼 미래 → 알 수 없음 → 못 돌려받을 가능성 높음.","shorter(더 짧은)를 넣으면 \"짧을수록 더 먼 미래\"가 된다.","짧은 대출이 더 먼 미래라니, 말이 안 된다."]},{"t":"p","h":"함정","x":["greater(더 큰)는 higher(더 높은) 자리에 그대로 들어간다.","the greater the chance(가능성이 클수록)도 자연스러운 표현이다."]}],"post":["long(긴) ↔ short(짧은)","긴 대출 = 더 먼 미래 = 더 큰 위험"]},{"slots":[["higher"],["future"],["unknowable","predictable","a"],["worthwhile"],["lender"]],"opts":["unknowable","obvious","familiar","visible"],"or":["unknowable(알 수 없는): 미래는 아직 오지 않아 알 수 없으니 돌려받지 못할 가능성이 커진다는 이유가 됨.","obvious(명백한): 미래가 명백하다면 오히려 위험이 줄어 '가능성이 더 높다'는 앞말과 부딪침.","familiar(익숙한): 미래가 익숙하다는 건 말이 안 되고, 위험이 커지는 이유도 되지 못함.","visible(눈에 보이는): 미래가 눈에 보인다면 못 돌려받을 걱정이 줄어 흐름과 반대임."],"om":["알 수 없는","명백한","익숙한","눈에 보이는"],"en":"The longer the term of the loan, the higher the chance you won't be paid back because it is further into the future ― which by definition is unknowable ― …","ko":"대출 기간이 길수록 돈을 돌려받지 못할 가능성은 더 높아진다. 더 먼 미래의 일이고, 미래는 원래 알 수 없는 것이기 때문이다. …","hl":["by definition is unknowable","because"],"khl":["원래 알 수 없는 것","때문이다"],"blocks":[{"t":"tap","h":"질문 하나","q":"미래를 정확히 알 수 있다면 이자가 이렇게 붙을까?","a":["훨씬 덜 붙는다.","돌려받을지 못 받을지 미리 알면 위험이 없기 때문이다.","이자가 붙는 큰 이유가 바로 미래를 알 수 없다는 것."]},{"t":"p","h":"by definition(정의상, 원래)","x":["by definition(정의상)은 \"원래 그 말 뜻이 그렇다\"는 표현이다.","미래는 원래 알 수 없는 것이다.","predictable(예측할 수 있는)을 넣으면 미래는 원래 뻔히 보인다는 말이 된다.","그러면 because(왜냐하면) 뒤 이유가 위험을 키우지 못한다."]}],"post":["unknowable(알 수 없는) ↔ predictable(예측할 수 있는)","먼 미래 = 알 수 없음 = 위험"]},{"slots":[["worldview","outlook","s"],["worthwhile"],["cost","charge","s"],["income","loss","a"],["worth"]],"opts":["income","debt","expense","burden"],"or":["income(수입): 빌리는 사람이 내는 돈이 빌려주는 사람에게는 들어오는 돈이라 맞음.","debt(빚): 빚을 지는 건 빌려준 사람이 아니라 빌린 사람임.","expense(지출): 빌려주는 사람에게 이자는 나가는 돈이 아니라 들어오는 돈임.","burden(부담): 이자가 빌려주는 사람에게 부담이라면 worthwhile(할 만한)하게 만든다는 앞말과 부딪침."],"om":["수입","빚","지출","부담"],"en":"In order to make this worthwhile for the lender, money has to have a price ― a cost to the borrower and income to the lender.","ko":"빌려주는 사람에게 이것이 할 만한 일이 되려면 돈에는 가격이 있어야 한다. 빌리는 사람에게는 비용이고 빌려주는 사람에게는 수입인 가격이다.","hl":["income to the lender","a cost to the borrower"],"khl":["빌려주는 사람에게는 수입","빌리는 사람에게는 비용"],"blocks":[{"t":"pair","h":"한 돈, 두 얼굴","x":[["a cost to the borrower","빌리는 사람에게는 비용 (나가는 돈)"],["income to the lender","빌려주는 사람에게는 수입 (들어오는 돈)"]]},{"t":"p","h":"loss(손실)를 넣으면","x":["빌린 사람도 손해, 빌려준 사람도 손해가 된다.","그럼 이 거래는 누구에게도 이득이 없다.","문장 앞머리 worthwhile for the lender(빌려주는 사람에게 할 만한)와 정면으로 부딪친다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","outlook(관점)은 worldview(세계관) 자리에, charge(요금)는 cost(비용) 자리에 들어가도 뜻이 통한다.","고칠 것은 하나뿐."]}],"post":["income(수입) ↔ loss(손실)","이자 = 빌리는 쪽엔 비용, 빌려주는 쪽엔 수입"]}],"quiz":[{"w":"consider","m":"생각해 보다, 고려하다","it":[["examine","살펴보다","s"],["paint","칠하다","n"],["ignore","무시하다","a"],["contemplate","곰곰이 생각하다","s"],["arrive","도착하다","n"],["disregard","무시하다","a"],["bake","굽다","n"]]},{"w":"risk","m":"위험","it":[["custom","관습","n"],["danger","위험","s"],["safety","안전","a"],["harvest","수확","n"],["hazard","위험 요소","s"],["security","안전","a"],["journey","여행","n"]]},{"w":"long","m":"긴","it":[["lengthy","긴","s"],["curious","호기심 많은","n"],["short","짧은","a"],["extended","연장된, 긴","s"],["loyal","충실한","n"],["brief","짧은","a"],["rough","거친","n"]]},{"w":"unknowable","m":"알 수 없는","it":[["wooden","나무로 된","n"],["unfathomable","헤아릴 수 없는","s"],["knowable","알 수 있는","a"],["generous","관대한","n"],["incomprehensible","이해할 수 없는","s"],["understandable","이해할 수 있는","a"],["seasonal","계절의","n"]]},{"w":"income","m":"수입","it":[["earnings","소득","s"],["ladder","사다리","n"],["expenditure","지출","a"],["revenue","수입","s"],["climate","기후","n"],["expense","비용, 지출","a"],["rumor","소문","n"]]}]},{"items":[{"slots":[["consider"],["perception"],["reflects","ignores","a"],["risk"],["spending"]],"opts":["reflects","hides","denies","removes"],"or":["reflect(반영하다): 돈의 대가 안에 못 돌려받을 위험과 기회비용이 담겨 있다는 말이라 맞음.","hide(숨기다): 바로 앞에서 This rate tells us(이 이자율은 우리에게 알려 준다)라고 했는데 위험을 숨긴다면 알려 줄 수 없음.","deny(부인하다): 대가가 위험을 부인한다는 건 뜻이 안 통하고, 위험이 클수록 이자가 붙는 흐름과 반대임.","remove(없애다): 대가를 매긴다고 위험이 없어지지 않음. 위험은 그대로 있고 그 값을 매길 뿐임."],"om":["반영하다","숨기다","부인하다","없애다"],"en":"This rate tells us that the money lent has a cost that reflects the risk of you not being repaid and the opportunity cost of not spending that money yourself.","ko":"이 이자율은 빌려준 돈에 대가가 있다는 것을 알려 준다. 그 대가는 여러분이 돈을 돌려받지 못할 위험과, 그 돈을 직접 쓰지 못하는 기회비용을 반영한다.","hl":["a cost that reflects the risk","This rate tells us"],"khl":["반영한다","이 이자율은"],"blocks":[{"t":"p","h":"이자 속에 든 두 가지","x":["10%라는 숫자 안에는 두 가지가 들어 있다.","하나, 돈을 못 돌려받을지도 모르는 위험.","둘, 그동안 내가 그 돈을 못 쓰는 손해.","이자는 이 둘을 숫자로 담아낸 값이다.","ignores(무시하다)를 넣으면 이자가 이 둘과 아무 상관없는 숫자가 된다."]},{"t":"p","h":"글 끝과 이어 보기","x":["끝부분에서 This price factors in the value of time(이 가격은 시간의 가치를 감안한다)이라고 한다.","감안한다 = 반영한다.","처음과 끝이 같은 말을 하고 있다."]}],"post":["reflect(반영하다) ↔ ignore(무시하다)","이자 = 위험 + 못 쓰는 손해를 담은 값"]},{"slots":[["consider","examine","s"],["reflects"],["risk","danger","s"],["spending","lending","a"],["longer"]],"opts":["spending","repaying","borrowing","returning"],"or":["spending(쓰는 것): 돈을 빌려주면 그동안 그 돈을 못 쓰니 그 손해가 기회비용이라 맞음. 다음 문장 before spending the money yourself(그 돈을 직접 쓰기 전에)와도 같은 말임.","repaying(갚는 것): 빌려준 사람은 갚을 사람이 아니라 돌려받을 사람임.","borrowing(빌리는 것): 이 글의 '여러분'은 빌리는 쪽이 아니라 빌려주는 쪽임.","returning(돌려주는 것): 돌려주는 건 빌린 사람이 할 일이라 빌려주는 사람의 손해가 될 수 없음."],"om":["쓰는 것","갚는 것","빌리는 것","돌려주는 것"],"en":"This rate tells us that the money lent has a cost that reflects the risk of you not being repaid and the opportunity cost of not spending that money yourself. … and the longer you will have to wait before spending the money yourself.","ko":"이 이자율은 빌려준 돈에 대가가 있다는 것을 알려 준다. 그 대가는 여러분이 돈을 돌려받지 못할 위험과, 그 돈을 직접 쓰지 못하는 기회비용을 반영한다. … 또 그 돈을 직접 쓰기까지 더 오래 기다려야 한다.","hl":["not spending that money yourself","before spending the money yourself"],"khl":["그 돈을 직접 쓰지 못하는 기회비용","직접 쓰기까지"],"blocks":[{"t":"p","h":"기회비용 쉽게 풀기","x":["기회비용은 하나를 고르느라 포기한 것의 값이다.","돈을 빌려주면, 그 돈으로 살 수 있던 것을 못 산다.","그 포기한 쓰임이 바로 기회비용이다."]},{"t":"p","h":"lending(빌려주는 것)을 넣어 다시 읽기","x":["\"그 돈을 직접 빌려주지 않는 기회비용\"이 된다.","그런데 '여러분'은 지금 빌려주고 있는 중이다.","하고 있는 일을 안 하는 손해라니, 말이 꼬인다."]},{"t":"p","h":"함정","x":["examine(살펴보다)은 consider(생각해 보다) 자리에, danger(위험)는 risk(위험) 자리에 들어가도 자연스럽다.","둘 다 고치면 안 된다."]}],"post":["spend(쓰다) ↔ lend(빌려주다)","기회비용 = 빌려준 동안 못 쓰는 손해"]},{"slots":[["longer"],["higher","lower","a"],["future"],["unknowable","unpredictable","s"],["worthwhile"]],"opts":["higher","smaller","slimmer","weaker"],"or":["higher(더 높은): 먼 미래일수록 알 수 없으니 못 돌려받을 가능성이 커진다는 흐름과 맞음.","smaller(더 작은): 기간이 길수록 가능성이 작아진다면 because(왜냐하면) 뒤 '알 수 없는 먼 미래'가 이유가 되지 못함.","slimmer(더 희박한): 먼 미래일수록 못 돌려받을 가능성이 희박해진다는 건 상식과 반대임.","weaker(더 약한): 가능성이 약해진다는 말이 되어 위험이 커진다는 흐름과 거꾸로임."],"om":["더 높은","더 작은","더 희박한","더 약한"],"en":"The longer the term of the loan, the higher the chance you won't be paid back because it is further into the future ― which by definition is unknowable ― and the longer you will have to wait before spending the money yourself.","ko":"대출 기간이 길수록 돈을 돌려받지 못할 가능성은 더 높아진다. 더 먼 미래의 일이고, 미래는 원래 알 수 없는 것이기 때문이다. 또 그 돈을 직접 쓰기까지 더 오래 기다려야 한다.","hl":["the higher the chance you won't be paid back","further into the future"],"khl":["돌려받지 못할 가능성은 더 높아진다","더 먼 미래"],"blocks":[{"t":"flow","h":"원인에서 결과로","x":["대출 기간이 길다","더 먼 미래의 "빼다","배제하다","포기하다"],"en":"This price factors in the value of time. To put it another way, a bird in the hand is worth two in the bush.","ko":"이 가격은 시간의 가치를 계산에 넣는다. 달리 말하면, 손 안의 새 한 마리가 덤불 속 새 두 마리의 가치가 있다.","hl":["factors in the value of time","a bird in the hand is worth two in the bush"],"khl":["시간의 가치를 계산에 넣는다","손 안의 새 한 마리"],"blocks":[{"t":"p","h":"속담으로 확인","x":["a bird in the hand(손 안의 새)는 지금 내 손에 있는 것이다.","two in the bush(덤불 속 두 마리)는 나중에 잡을지도 모르는 것이다.","지금 가진 하나가 나중의 둘만큼 값지다.","즉 시간에도 값이 있다는 뜻이다.","excludes(제외하다)를 넣으면 가격이 시간의 값을 빼 버린다. 속담과 정반대다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","mirrors(그대로 반영하다)는 reflects(반영하다) 자리에, profit(이익)은 income(수입) 자리에 들어가도 뜻이 통한다.","고칠 것은 하나."]}],"post":["factor in(감안하다) ↔ exclude(제외하다)","지금 손 안의 돈 = 나중 돈보다 값짐"]}],"quiz":[{"w":"reflect","m":"반영하다, 나타내다","it":[["mirror","그대로 반영하다","s"],["swim","수영하다","n"],["conceal","감추다","a"],["indicate","나타내다","s"],["knit","뜨개질하다","n"],["hide","숨기다","a"],["shout","외치다","n"]]},{"w":"spend","m":"(돈을) 쓰다","it":[["whistle","휘파람 불다","n"],["use","쓰다","s"],["save","저축하다, 아끼다","a"],["climb","오르다","n"],["expend","쓰다, 소비하다","s"],["hoard","비축하다","a"],["fold","접다","n"]]},{"w":"high","m":"높은","it":[["elevated","높은, 높아진","s"],["hungry","배고픈","n"],["low","낮은","a"],["heightened","높아진, 고조된","s"],["polite","공손한","n"],["decreased","줄어든, 감소한","a"],["sticky","끈적끈적한","n"]]},{"w":"worthwhile","m":"할 만한, 가치 있는","it":[["rewarding","보람 있는","s"],["rainy","비 오는","n"],["pointless","무의미한","a"],["valuable","가치 있는","s"],["frozen","얼어붙은","n"],["useless","쓸모없는","a"],["curly","곱슬곱슬한","n"]]},{"w":"factor in","m":"감안하다, 계산에 넣다","it":[["account for","감안하다, 고려하다","s"],["sneeze","재채기하다","n"],["exclude","제외하다","a"],["include","포함하다","s"],["decorate","장식하다","n"],["ignore","무시하다","a"],["melt","녹다","n"]]}]}],"no":"21"},{"id":"2610g2-22","title":"어휘특훈 · 26년 10월 고2 22번","sub":"콘텐츠 제작자의 사회·환경적 책임","tpl":"Social and environmental responsibility has become an {increasingly} {important} ethical consideration for content creators. As global { ation for content creators. As global awareness of social, environmental, and sustainability issues grows, many content creators are being called upon to consider the broader impact of their work.","ko":"사회적·환경적 책임은 콘텐츠 제작자들에게 점점 더 중요한 윤리적 고려 사항이 되었다. 사회·환경·지속 가능성 문제에 대한 전 세계의 인식이 커지면서, 많은 콘텐츠 제작자들이 자기 작업이 미치는 더 넓은 영향을 고려하라는 요구를 받고 있다.","hl":["an increasingly important ethical consideration","are being called upon"],"khl":["점점 더 중요한 윤리적 고려 사항","요구를 받고 있다"],"blocks":[{"t":"flow","h":"글이 가는 길","x":["주제: 책임이 점점 더 중요해짐","이유: 세계의 인식이 커짐","내용: 기후·정의·윤리적 소비 다루기","근거: 제작자에게는 영향력이 있음","예시: 친환경 제품 홍보, 평등 지지","정리: 콘텐츠 = 자기 원칙과 일치"],"at":0},{"t":"p","h":"trivial(사소한)을 넣으면","x":["\"점점 더 사소한 고려 사항\"이 된다.","그런데 바로 뒤에서 제작자들이 더 많이 요구받는다고 한다.","사소한 일을 점점 더 요구받을 리 없다.","첫 문장이 글 전체의 무게를 정한다."]}],"post":["important(중요한) ↔ trivial(사소한)","제작자의 사회·환경 책임 = 점점 더 중요해짐"]},{"slots":[["grows"],["called_upon","urged","s"],["broader","narrower","a"],["includes","involves","s"],["addressing"]],"opts":["broader","smaller","shorter","simpler"],"or":["broader(더 넓은): 바로 뒤에 기후 변화, 사회 정의처럼 세상 전체에 걸친 주제가 나오니 맞음.","smaller(더 작은): 작은 영향만 생각하라는 말이 되어 큰 사회 문제를 다루라는 다음 문장과 부딪침.","shorter(더 짧은): 영향이 길고 짧음을 따지는 글이 아니고, 뒤의 예시와 이어지지 않음.","simpler(더 단순한): 고려할 것이 늘어난다는 흐름인데 단순한 영향만 보라는 건 거꾸로임."],"om":["더 넓은","더 작은","더 짧은","더 단순한"],"en":"As global awareness of social, environmental, and sustainability issues grows, many content creators are being called upon to consider the broader impact of their work. This includes addressing topics such as climate change, social justice, and ethical consumerism in their content.","ko":"사회·환경·지속 가능성 문제에 대한 전 세계의 인식이 커지면서, 많은 콘텐츠 제작자들이 자기 작업이 미치는 더 넓은 영향을 고려하라는 요구를 받고 있다. 여기에는 기후 변화, 사회 정의, 윤리적 소비주의 같은 주제를 자기 콘텐츠에서 다루는 것이 포함된다.","hl":["the broader impact of their work","climate change, social justice, and ethical consumerism"],"khl":["더 넓은 영향","기후 변화, 사회 정의, 윤리적 소비주의"],"blocks":[{"t":"pair","h":"앞 문장과 뒤 문장 나란히","x":[["consider the broader impact of their work","자기 작업의 더 넓은 영향을 고려하다" aise"],["drive"]],"opts":["supporting","ignoring","attacking","resisting"],"or":["supporting(지지하는 것): 평등과 정의를 지지해야 인식이 높아지고 의미 있는 영향이 생기니 맞음.","ignoring(무시하는 것): 무시하면 인식을 높일 수 없어 can help raise awareness(인식을 높이는 데 도움이 될 수 있다)와 부딪침.","attacking(공격하는 것): 평등과 정의를 공격하는 건 긍정적인 변화의 예가 될 수 없음.","resisting(저항하는 것): 정의에 저항한다면 앞 문장의 positive change(긍정적인 변화)와 반대임."],"om":["지지하는 것","무시하는 것","공격하는 것","저항하는 것"],"en":"For example, promoting environmentally sustainable products or supporting causes related to equality and justice can help raise awareness and drive meaningful social impact.","ko":"예를 들어, 환경적으로 지속 가능한 제품을 홍보하거나 평등과 정의에 관련된 대의를 지지하는 것은 인식을 높이고 의미 있는 사회적 영향을 이끌어 내는 데 도움이 될 수 있다.","hl":["supporting causes related to equality and justice","can help raise awareness"],"khl":["평등과 정의에 관련된 대의를 지지하는 것","인식을 높이고"],"blocks":[{"t":"p","h":"예시는 앞 문장의 증거","x":["For example(예를 들어)로 시작하는 문장은 앞 문장을 받쳐 준다.","앞 문장은 \"긍정적인 변화를 위해 쓸 책임\"이었다.","그러니 예시도 좋은 일이어야 한다.","opposing(반대하는 것)을 넣으면 평등과 정의에 반대하는 게 좋은 예시가 된다."]},{"t":"p","h":"or(또는)로 묶인 짝","x":["promoting(홍보하는 것) or supporting(지지하는 것).","둘은 같은 방향의 행동으로 묶여 있다.","하나만 반대 방향이면 짝이 깨진다."]}],"post":["support(지지하다) ↔ oppose(반대하다)","좋은 예시 = 친환경 홍보 + 평등·정의 지지"]},{"slots":[["increasingly","ever more","s"],["positive"],["drive","generate","s"],["meaningful","insignificant","a"],["ensuring"]],"opts":["meaningful","useless","shallow","minimal"],"or":["meaningful(의미 있는): 인식을 높이는 것과 나란히 좋은 결과를 말하는 자리라 맞음.","useless(쓸모없는): 쓸모없는 영향을 이끌어 내는 데 '도움이 된다'는 건 말이 안 됨.","shallow(얄팍한): 얄팍한 영향은 이 글이 권하는 긍정적인 변화가 아님.","minimal(아주 적은): 아주 적은 영향을 위해 애쓰라는 건 책임을 강조하는 흐름과 반대임."],"om":["의미 있는","쓸모없는","얄팍한","아주 적은"],"en":"For example, promoting environmentally sustainable products or supporting causes related to equality and justice can help raise awareness and drive meaningful social impact.","ko":"예를 들어, 환경적으로 지속 가능한 제품을 홍보하거나 평등과 정의에 관련된 대의를 지지하는 것은 인식을 높이고 의미 있는 사회적 영향을 이끌어 내는 데 도움이 될 수 있다.","hl":["drive meaningful social impact","raise awareness"],"khl":["의미 있는 사회적 영향을 이끌어 내는","인식을 높이고"],"blocks":[{"t":"p","h":"and(그리고)로 이어진 두 결과","x":["raise awareness(인식을 높이다)와 drive social impact(사회적 영향을 이끌어 내다).","둘 다 can help(도움이 될 수 있다)에 걸린 좋은 결과다.","insignificant(하찮은)를 넣으면 \"하찮은 영향을 이끌어 내는 데 도움이 된다\"가 된다.","도움이 되는 일의 결과가 하찮다니 앞뒤가 안 맞는다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["ever more(점점 더)는 increasingly(점점 더)와 같은 뜻이다.","an ever more important(점점 더 중요한)로 관사 an(하나의)까지 그대로 맞는다.","generate(만들어 내다)는 drive(이끌어 내다) 자리에 넣어도 자연스럽다."]}],"post":["meaningful(의미 있는) ↔ insignificant(하찮은)","친환경 홍보·정의 지지 = 인식 ↑ + 의미 있는 영향"]}],"quiz":[{"w":"important","m":"중요한","it":[["crucial","매우 중요한","s"],["sleepy","졸린","n"],["trivial","사소한","a"],["vital","필수적인","s"],["curly","곱슬곱슬한","n"],["minor","중요하지 않은","a"],["frozen","얼어붙은","n"]]},{"w":"broad","m":"넓은","it":[["hungry","배고픈","n"],["wide","넓은","s"],["narrow","좁은","a"],["polite","공손한","n"],["extensive","광범위한","s"],["limited","제한된","a"],["noisy","시끄러운","n"]]},{"w":"positive","m":"긍정적인","it":[["beneficial","유익한","s"],["ancient","고대의","n"],["negative","부정적인","a"],["constructive","건설적인","s"],["loud","시끄러운","n"],["harmful","해로운","a"],["wooden","나무로 된","n"]]},{"w":"support","m":"지지하다","it":[["melt","녹다","n"],["back","지지하다","s"],["oppose","반대하다","a"],["sew","바느질하다","n"],["champion","옹호하다","s"],["resist","저항하다","a"],["fold","접다","n"]]},{"w":"meaningful","m":"의미 있는","it":[["significant","의미 있는, 중요한","s"],["sticky","끈적끈적한","n"],["meaningless","무의미한","a"],["worthwhile","가치 있는","s"],["bitter","쓴","n"],["insignificant","하찮은","a"],["rainy","비 오는","n"]]}]},{"items":[{"slots":[["important"],["awareness","ignorance","a"],["broader"],["includes"],["influence"]],"opts":["awareness","confusion","neglect","denial"],"or":["awareness(인식): 문제를 아는 사람이 늘어서 제작자에게도 더 넓은 영향을 생각하라는 요구가 생긴다는 흐름이라 맞음.","confusion(혼란): 혼란이 커진다고 해서 책임을 고려하라는 요구가 커지는 이유가 되지 못함.","neglect(방치): 문제를 내버려 두는 분위기가 커진다면 오히려 요구가 줄어야 함.","denial(부인): 문제를 부인하는 사람이 늘어난다면 제작자에게 책임을 묻는 목소리도 약해져야 함."],"om":["인식","혼란","방치","부인"],"en":"As global awareness of social, environmental, and sustainability issues grows, many content creators are being called upon to consider the broader impact of their work.","ko":"사회·환경·지속 가능성 문제에 대한 전 세계의 인식이 커지면서, 많은 콘텐츠 제작자들이 자기 작업이 미치는 더 넓은 영향을 고려하라는 요구를 받고 있다.","hl":["As global awareness","are being called upon"],"khl":["전 세계의 인식이 커지면서","요구를 받고 있다"],"blocks":[{"t":"tap","h":"질문 하나","q":"사람들은 왜 제작자에게 책임을 요구하기 시작했을까?","a":["사회·환경 문제를 아는 사람이 늘었기 때문이다.","알게 되면 관심이 생기고, 관심이 생기면 요구한다.","그래서 As awareness grows(인식이 커지면서)가 이유가 된다."]},{"t":"p","h":"ignorance(무지)로 바꾸면","x":["\"문제를 모르는 사람이 늘수록 책임을 더 요구받는다\"가 된다.","모르는 사람은 요구하지도 않는다.","원인과 결과가 이어지지 않는다."]}],"post":["awareness(인식) ↔ ignorance(무지)","문제를 아는 사람 ↑ → 책임 요구 ↑"]},{"slots":[["grows","rises","s"],["broader","wider","s"],["includes"],["addressing","avoiding","a"],["positive"]],"opts":["addressing","ignoring","hiding","dismissing"],"or":["addressing(다루는 것): 더 넓은 영향을 고려한다는 건 기후 변화 같은 주제를 콘텐츠에서 직접 다룬다는 뜻이라 맞음.","ignoring(무시하는 것): 더 넓은 영향을 고려하라는 요구가 큰 문제를 무시하는 걸 포함할 수 없음.","hiding(숨기는 것): 사회 문제를 숨기면 인식을 높이는 예시와 정반대가 됨.","dismissing(묵살하는 것): 기후 변화나 정의를 묵살하는 건 책임 있는 제작자의 모습이 아님."],"om":["다루는 것","무시하는 것","숨기는 것","묵살하는 것"],"en":"This includes addressing topics such as climate change, social justice, and ethical consumerism in their content.","ko":"여기에는 기후 변화, 사회 정의, 윤리적 소비주의 같은 주제를 자기 콘텐츠에서 다루는 것이 포함된다.","hl":["addressing topics such as climate change","This includes"],"khl":["다루는 것","여기에는"],"blocks":[{"t":"p","h":"includes(포함하다)가 알려 주는 것","x":["This includes(여기에는 ~이 포함된다)는 앞 문장을 더 구체적으로 푸는 말이다.","앞 문장: 더 넓은 영향을 고려하라.","이 문장: 그러려면 큰 주제를 콘텐츠에서 다뤄라.","avoiding(피하는 것)을 넣으면 큰 문제를 피하는 게 더 넓은 영향을 고려하는 일이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","rises(커지다)는 grows(커지다) 자리에, wider(더 넓은)는 broader(더 넓은) 자리에 그대로 들어간다.","고칠 것은 하나뿐."]}],"post":["address(다루다) ↔ avoid(피하다)","책임 있는 콘텐츠 = 기후·정의·윤리적 소비 다루기"]},{"slots":[["influence"],["promoting","boycotting","a"],["sustainable"],["supporting","backing","s"],["raise"]],"opts":["promoting","banning","mocking","wasting"],"or":["promoting(홍보하는 것): 친환경 제품을 알려야 사람들이 관심을 갖고 인식이 높아지니 맞음.","banning(금지하는 것): 친환경 제품을 금지하는 건 긍정적인 변화의 예가 아님.","mocking(조롱하는 것): 좋은 제품을 놀리는 건 책임 있는 제작자의 예시와 정반대임.","wasting(낭비하는 것): 친환경 제품을 낭비한다는 건 지속 가능성이라는 글의 방향과 맞지 않음."],"om":["홍보하는 것","금지하는 것","조롱하는 것","낭비하는 것"],"en":"For example, promoting environmentally sustainable products or supporting causes related to equality and justice can help raise awareness and drive meaningful social impact.","ko":"예를 들어, 환경적으로 지속 가능한 제품을 홍보하거나 평등과 정의에 관련된 대의를 지지하는 것은 인식을 높이고 의미 있는 사회적 영향을 이끌어 내는 데 도움이 될 수 있다.","hl":["promoting environmentally sustainable products","For example"],"khl":["환경적으로 지속 가능한 제품을 홍보하거나","예를 들어"],"blocks":[{"t":"p","h":"boycotting(불매하는 것)을 넣고 다시 읽기","x":["\"친환경 제품을 불매하는 것이 의미 있는 사회적 영향을 이끈다\"가 된다.","친환경 제품을 사지 말자는 게 환경을 위한 일일 수 없다.","예시가 앞 문장의 positive change(긍정적인 변화)를 거꾸로 뒤집는다."]},{"t":"p","h":"마지막 문장과 연결","x":["마지막 문장에도 promoting their products(자기 제품을 홍보하는 것)가 나온다.","제작자에게 홍보는 늘 하는 일이다.","좋은 제작자는 홍보하되, 무엇을 홍보할지 원칙에 맞춰 고른다."]},{"t":"p","h":"그대로 둘 단어","x":["backing(지지하는 것)은 supporting(지지하는 것)과 같은 뜻이다."]}],"post":["promote(홍보하다) ↔ boycott(불매하다)","친환경 제품 홍보 = 긍정적 변화의 예"]},{"slots":[["sustainable"],["supporting"],["raise","reduce","a"],["meaningful"],["ensuring"]],"opts":["raise","lower","weaken","limit"],"or":["raise(높이다): raise awareness(인식을 높이다)는 짝으로 자주 쓰는 표현이고, 좋은 예시의 결과라 맞음.","lower(낮추다): 좋은 일을 했는데 사람들의 인식이 낮아진다는 건 흐름과 반대임.","weaken(약화시키다): 인식이 약해지면 의미 있는 사회적 영향도 생길 수 없음.","limit(제한하다): 인식을 제한하는 데 도움이 된다는 건 책임 있는 콘텐츠의 목표가 아님."],"om":["높이다","낮추다","약화시키다","제한하다"],"en":"As global awareness of social, environmental, and sustainability issues grows, … For example, promoting environmentally sustainable products or supporting causes related to equality and justice can help raise awareness and drive meaningful social impact.","ko":"사회·환경·지속 가능성 문제에 대한 전 세계의 인식이 커지면서, … 예를 들어, 환경적으로 지속 가능한 제품을 홍보하거나 평등과 정의에 관련된 대의를 지지하는 것은 인식을 높이고 의미 있는 사회적 영향을 이끌어 내는 데 도움이 될 수 있다.","hl":["help raise awareness","global awareness"],"khl":["인식을 높이고","전 세계의 인식이 커지면서"],"blocks":[{"t":"pair","h":"글에 두 번 나오는 awareness(인식)","x":[["As global awareness ... grows","전 세계의 인식이 커지면서 (2번째 문장)"],["help raise awareness","인식을 높이는 데 도움이 되다 (5번째 문장)"]]},{"t":"p","h":"reduce(줄이다)가 틀린 이유","x":["글 앞에서 인식이 커지는 것이 좋은 흐름으로 나왔다.","제작자의 좋은 활동은 그 인식을 더 키워야 한다.","reduce(줄이다)를 넣으면 좋은 활동이 인식을 줄이는 꼴이다.","and(그리고) 뒤의 meaningful social impact(의미 있는 사회적 영향)와도 어울리지 않는다."]}],"post":["raise(높이다) ↔ reduce(줄이다)","좋은 콘텐츠 = 사람들의 인식 높이기"]},{"slots":[["positive"],["raise"],["meaningful","significant","s"],["ensuring","making sure","s"],["aligns_with","contradicts","a"]],"opts":["aligns_with","clashes_with","breaks_with","departs_from"],"or":["align with(~와 일치하다): 홍보만이 아니라 자기가 지지하는 가치도 고려하니, 콘텐츠가 원칙과 맞아야 한다는 결론이라 맞음.","clash with(~와 충돌하다): 가치를 고려한 결과가 원칙과 충돌하는 콘텐츠라면 앞말과 부딪침.","break with(~와 결별하다): 윤리적인 제작자가 자기 원칙과 갈라선다는 건 말이 안 됨.","depart from(~에서 벗어나다): 원칙에서 벗어나도록 확실히 한다는 건 Ethical(윤리적인)이라는 주어와 정반대임."],"om":["~와 일치하다","~와 충돌하다","~와 결별하다","~에서 벗어나다"],"en":"Ethical content creators not only focus on promoting their products or services but also consider the values and causes they support, ensuring that their content aligns with their social and environmental principles.","ko":"윤리적인 콘텐츠 제작자들은 자기 제품이나 서비스를 홍보하는 데만 집중하지 않고 자신이 지지하는 가치와 대의도 고려하여, 자기 콘텐츠가 자신의 사회적·환경적 원칙과 확실히 일치하도록 한다.","hl":["aligns with their social and environmental principles","not only focus on promoting"],"khl":["원칙과 확실히 일치하도록","홍보하는 데만 집중하지 않고"],"blocks":[{"t":"p","h":"not only A but also B(A뿐만 아니라 B도)","x":["A: 제품이나 서비스를 홍보하는 것.","B: 자기가 지지하는 가치와 대의를 고려하는 것.","B까지 챙기는 이유는 콘텐츠가 원칙과 맞게 하려는 것이다.","contradicts(모순되다)를 넣으면 가치를 고려해서 원칙과 어긋나게 만드는 꼴이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","significant(의미 있는, 중요한)는 meaningful(의미 있는) 자리에, making sure(확실히 하면서)는 ensuring(반드시 ~하게 하면서) 자리에 넣어도 뜻이 같다.","고칠 것은 하나."]}],"post":["align with(~와 일치하다) ↔ contradict(~와 모순되다)","윤리적 제작자 = 홍보 + 원칙에 맞는 콘텐츠"]}],"quiz":[{"w":"awareness","m":"인식","it":[["consciousness","의식, 인식","s"],["furniture","가구","n"],["ignorance","무지","a"],["recognition","인식, 인정","s"],["harbor","항구","n"],["unawareness","알지 못함","a"],["recipe","요리법","n"]]},{"w":"address","m":"(문제를) 다루다","it":[["borrow","빌리다","n"],["tackle","(문제를) 다루다, 씨름하다","s"],["avoid","피하다","a"],["whisper","속삭이다","n"],["deal with","다루다, 처리하다","s"],["ignore","무시하다","a"],["polish","닦다, 윤내다","n"]]},{"w":"promote","m":"홍보하다, 촉진하다","it":[["advertise","광고하다","s"],["swim","수영하다","n"],["discourage","막다, 단념시키다","a"],["publicize","널리 알리다","s"],["knit","뜨개질하다","n"],["hinder","방해하다","a"],["sneeze","재채기하다","n"]]},{"w":"raise","m":"높이다, 올리다","it":[["bake","굽다","n"],["increase","늘리다","s"],["lower","낮추다","a"],["chase","뒤쫓다","n"],["heighten","높이다","s"],["reduce","줄이다","a"],["tie","묶다","n"]]},{"w":"align with","m":"~와 일치하다","it":[["match","~와 일치하다, 어울리다","s"],["look after","돌보다","n"],["contradict","~와 모순되다","a"],["agree with","~와 일치하다","s"],["run out of","다 써 버리다","n"],["conflict with","~와 충돌하다","a"],["take off","이륙하다","n"]]}]}],"no":"22"},{"id":"2610g2-23","title":"어휘특훈 · 26년 10월 고2 23번","sub":"다리에 퍼진 문어의 뉴런","tpl":"Research on cephalopod neurobiology suggests that an octopus {possesses} {roughly} five hundred million neurons. What makes this system {unusual} is where many of those neurons are located. More than half are {distributed} throughout the arms rather than {concentrated} {entirely} in the central brain. Each arm contains networks of nerve cells {capable} of controlling {complex} movements and responding to sensory input {locally}. This means that many actions do not {require} {detailed} instructions from the brain itself. Instead, the arms {function} as highly capable extensions of the nervous system that interact with the environment {directly}. The suckers lining each arm play an important role in this process. These structures provide {strong} grip but also {detect} chemical signals on surfaces they contact. Marine biologists studying octopus behavior have shown that this {allows} the animal to {gather} chemical information through touch. In practical terms, an octopus can {effectively} taste what it touches.","fn":["*cephalopod: 두족류(문어·오징어처럼 머리에 다리가 붙은 동물)","*neurobiology: 신경생물학","*neuron: 뉴런, 신경세포","*sucker: 빨판"],"mean":{"possesses":"동사 possess(가지고 있다)의 3인칭 단수 현재형","lacks":"동사 lack(~이 없다)의 3인칭 단수 현재형","roughly":"대략","approximately":"대략, 거의","unusual":"특이한, 흔치 않은","ordinary":"평범한","distributed":"동사 distribute(분포시키다)의 과거분사형, 분포된, 퍼져 있는","spread":"동사 spread(퍼뜨리다)의 과거분사형(원형과 모양이 같음), 퍼져 있는","centralized":"동사 centralize(중앙에 집중시키다)의 과거분사형, 중앙에 집중된","concentrated":"동사 concentrate(한곳에 모으다)의 과거분사형, 집중된, 모여 있는","dispersed":"동사 disperse(흩어지게 하다)의 과거분사형, 흩어진","entirely":"완전히, 전적으로","wholly":"전적으로, 완전히","capable":"(of와 함께) ~할 수 있는, 유능한","incapable":"(of와 함께) ~할 수 없는","complex":"복잡한","intricate":"복잡한, 정교한","locally":"국소적으로, 그 자리에서","centrally":"중앙에서","require":"필요로 하다","demand":"요구하다, 필요로 하다","detailed":"세세한, 상세한","specific":"구체적인","function":"기능하다, 작동하다","operate":"작동하다, 움직이다","fail":"실패하다, 제 역할을 못 하다","directly":"직접, 곧바로","indirectly":"간접적으로","strong":"강한","firm":"단단한, 확고한","weak":"약한","detect":"감지하다, 알아내다","sense":"감지하다, 느끼다","perceive":"감지하다, 인식하다","ignore":"무시하다","allows":"동사 allow(~할 수 있게 하다)의 3인칭 단수 현재형","forbids":"동사 forbid(금지하다)의 3인칭 단수 현재형","gather":"모으다","collect":"모으다","lose":"잃다","effectively":"사실상, 실질적으로","virtually":"사실상, 거의"},"comp":[{"no":"23","slots":[["unusual"],["concentrated"],["complex"],["function","fail","a"],["strong"]],"opts":["function","compete","struggle","rest"],"or":["function(기능하다): 뇌가 빠진 자리를 다리가 신경계의 연장선으로서 채운다는 뜻이라 맞음.","compete(경쟁하다): 다리가 뇌와 경쟁한다는 내용은 글 어디에도 없음.","struggle(허덕이다): highly capable(매우 유능한)이라고 하면서 허덕인다고 하면 한 문장 안에서 부딪침.","rest(쉬다): 쉬는 다리는 환경과 직접 상호작용한다는 같은 문장 뒷부분과 안 맞음."],"om":["기능하다","경쟁하다","허덕이다, 애쓰다","쉬다"],"en":"Instead, the arms function as highly capable extensions of the nervous system that interact with the environment directly.","ko":"대신 다리는 환경과 직접 상호작용하는, 매우 유능한 신경계의 연장선으로 기능한다.","hl":["the arms function as highly capable extensions","Instead"],"khl":["매우 tantly","barely"],"or":["directly(직접): 뇌를 거치지 않고 다리가 바로 반응한다는 앞 내용과 맞음.","rarely(드물게): 다리가 환경과 드물게 만난다면 빨판으로 늘 만지고 맛본다는 뒤 내용과 부딪침.","reluctantly(마지못해): 다리는 highly capable(매우 유능한) 일꾼이라 마지못해 움직인다는 말과 안 맞음.","barely(거의 ~않게): 거의 상호작용하지 않는다면 접촉으로 정보를 모은다는 뒤 문장이 무너짐."],"om":["직접","드물게","마지못해","거의 ~않게"],"en":"This means that many actions do not require detailed instructions from the brain itself. Instead, the arms function as highly capable extensions of the nervous system that interact with the environment directly.","ko":"이는 많은 동작이 뇌 자체의 세세한 지시를 필요로 하지 않는다는 뜻이다. 대신 다리는 환경과 직접 상호작용하는, 매우 유능한 신경계의 연장선으로 기능한다.","hl":["interact with the environment directly","do not require detailed instructions from the brain itself"],"khl":["환경과 직접 상호작용하는","뇌 자체의 세세한 지시를 필요로 하지 않는다"],"blocks":[{"t":"tap","h":"질문 하나","q":"뇌의 지시 없이 움직이는 다리는 환경을 어떻게 만날까?","a":["중간에 뇌를 거치지 않고 바로 만난다.","그래서 directly(직접)이다.","indirectly(간접적으로)는 누군가를 거쳐서 만난다는 뜻이다.","거쳐 갈 대상인 뇌를 앞 문장이 이미 빼 버렸다."]},{"t":"p","h":"Instead(대신에)가 가리키는 방향","x":["앞 문장: 뇌의 세세한 지시가 필요 없다.","Instead(대신에) 뒤: 다리가 스스로 한다.","뇌 대신 다리가 나서니 다리가 직접 움직여야 말이 된다."]}],"post":["directly(직접) ↔ indirectly(간접적으로)","뇌를 거치지 않고 다리가 바로 반응"]},{"slots":[["distributed"],["locally"],["strong","firm","s"],["detect","ignore","a"],["gather","collect","s"]],"opts":["detect","release","block","erase"],"or":["detect(감지하다): 다음 문장이 접촉으로 화학 정보를 모은다고 하니 신호를 알아채야 맞음.","release(내보내다): 신호를 내보내는 거라면 문어가 정보를 받아들여 맛본다는 결론과 방향이 반대임.","block(막다): 신호를 막으면 접촉으로 정보를 모을 수 없음.","erase(지우다): 표면의 신호를 지운다면 맛볼 거리가 사라져 마지막 문장과 안 맞음."],"om":["감지하다","내보내다","막다","지우다"],"en":"These structures provide strong grip but also detect chemical signals on surfaces they contact. Marine biologists studying octopus behavior have shown that this allows the animal to gather chemical information through touch.","ko":"이 구조는 강한 붙잡는 힘을 제공할 뿐 아니라 닿는 표면의 화학 신호도 감지한다. 문어의 행동을 연구하는 해양생물학자들은 이것 덕분에 문어가 접촉을 통해 화학 정보를 모을 수 있다는 것을 보여 주었다.","hl":["detect chemical signals","gather chemical information through touch"],"khl m unusual is where many of those neurons are located. More than half are distributed throughout the arms rather than concentrated entirely in the central brain.","ko":"이 체계를 특이하게 만드는 것은 그 뉴런 중 상당수가 어디에 있느냐이다. 절반 이상이 중앙의 뇌에 전부 모여 있는 것이 아니라 다리 전체에 퍼져 있다.","hl":["What makes this system unusual","rather than concentrated entirely in the central brain"],"khl":["이 체계를 특이하게 만드는 것","중앙의 뇌에 전부 모여 있는 것이 아니라"],"blocks":[{"t":"p","h":"보통이라면 뉴런은 어디에","x":["보통 동물의 뉴런은 대부분 뇌에 모여 있다.","문어는 절반 이상이 다리에 있다.","보통과 다르니 unusual(특이한)이다.","ordinary(평범한)를 넣으면 이 놀라운 사실을 평범하다고 소개하는 셈이다."]},{"t":"p","h":"What makes ~ is(~을 만드는 것은 ~이다) 틀","x":["이 틀은 무엇이 특별한지 콕 집어 주는 문장이다.","뒤에 나오는 설명은 전부 뇌와 다른 점이다.","특별함을 소개하는 틀에 평범함은 들어갈 수 없다."]}],"post":["unusual(특이한) ↔ ordinary(평범한)","뉴런 절반 이상이 다리에 = 문어만의 특이점"]},{"slots":[["distributed","spread","s"],["entirely"],["locally","centrally","a"],["detailed"],["effectively","virtually","s"]],"opts":["locally","remotely","randomly","poorly"],"or":["locally(그 자리에서): 바로 다음 문장이 뇌의 지시가 필요 없다고 하니 다리 안에서 처리해야 맞음.","remotely(멀리서): 멀리서 반응한다면 다리 안의 신경세포가 스스로 처리한다는 내용과 반대임.","randomly(무작위로): 아무렇게나 반응하는 다리는 highly capable(매우 유능한)이라는 평가와 맞지 않음.","poorly(형편없이): 형편없이 반응한다면 복잡한 움직임을 조절한다는 같은 문장 앞부분과 부딪침."],"om":["그 자리에서, 국소적으로","멀리서","무작위로","형편없이"],"en":"Each arm contains networks of nerve cells capable of controlling complex movements and responding to sensory input locally. This means that many actions do not require detailed instructions from the brain itself.","ko":"각 다리에는 복잡한 움직임을 조절하고 감각 입력에 그 자리에서 반응할 수 있는 신경세포 네트워크가 들어 있다. 이는 많은 동작이 뇌 자체의 세세한 지시를 필요로 하지 않는다는 뜻이다.","hl":["responding to sensory input locally","This means"],"khl":["감각 입력에 그 자리에서 반응할","뜻이다"],"blocks":[{"t":"pair","h":"앞뒤 문장 나란히","x":[["responding to sensory input locally","감각 입력에 그 자리에서 반응한다"],["do not require detailed instructions from the brain itself","뇌 자체의 세세한 지시가 필요 없다"]]},{"t":"p","h":"This means(이는 ~라는 뜻이다)가 묶어 주는 것","x":["This means(이는 ~라는 뜻이다)는 앞 내용을 다른 말로 다시 풀어 준다.","뒤 문장은 뇌가 필요 없다고 한다.","그러니 앞 문장도  실제로 말하자면, 문어는 사실상 자기가 만지는 것을 맛볼 수 있다.","hl":["gather chemical information through touch","taste what it touches"],"khl":["접촉을 통해 화학 정보를 모을","만지는 것을 맛볼"],"blocks":[{"t":"tap","h":"마지막 문장에서 거꾸로","q":"an octopus can effectively taste what it touches(문어는 사실상 만지는 것을 맛볼 수 있다)가 되려면 바로 앞에서 무엇이 일어나야 할까?","a":["접촉할 때 화학 정보가 문어에게 들어와야 한다.","정보가 들어와야 맛을 안다.","lose(잃다)는 정보가 빠져나가는 쪽이다."]},{"t":"p","h":"원인과 결과","x":["원인: 빨판이 화학 신호를 감지한다.","결과: 문어가 접촉으로 정보를 모은다.","결론: 만지는 것이 곧 맛보는 것.","결과 자리에 lose(잃다)를 넣으면 원인과 결과가 끊긴다."]}],"post":["gather(모으다) ↔ lose(잃다)","만지기 = 맛보기"]},{"slots":[["entirely","wholly","s"],["complex"],["detailed","specific","s"],["allows","forbids","a"],["effectively"]],"opts":["allows","warns","begs","pressures"],"or":["allows(~할 수 있게 하다): 빨판의 감지 능력 덕분에 정보를 모을 수 있다는 뜻이라 맞음.","warns(경고하다): 감지 능력이 문어에게 경고한다는 말은 능력 덕분에 가능해진 일을 설명하는 자리와 안 맞음.","begs(간청하다): 빨판의 능력이 문어에게 간청한다는 건 말이 되지 않음.","pressures(압박하다): 억지로 시키는 게 아니라 할 수 있게 해 주는 능력이라 맞지 않음."],"om":["~할 수 있게 하다","경고하다","간청하다","압박하다"],"en":"Marine biologists studying octopus behavior have shown that this allows the animal to gather chemical information through touch.","ko":"문어의 행동을 연구하는 해양생물학자들은 이것 덕분에 문어가 접촉을 통해 화학 정보를 모을 수 있다는 것을 보여 주었다.","hl":["this allows the animal to gather","have shown"],"khl":["이것 덕분에 문어가","보여 주었다"],"blocks":[{"t":"p","h":"this(이것)가 가리키는 것","x":["this(이것)는 앞 문장의 빨판 능력을 가리킨다.","표면의 화학 신호를 감지하는 능력.","그 능력이 있으니 정보를 모을 수 있다.","forbids(금지하다)를 넣으면 능력이 오히려 정보 모으기를 막는 말이 된다."]},{"t":"p","h":"allow A to B(A가 B할 수 있게 하다)","x":["allow A to B(A가 B할 수 있게 하다)는 가능하게 해 주는 말이다.","여기서 A는 문어, B는 정보 모으기.","해양생물학자들이 보여 준 것은 문어의 놀라운 능력이다."]},{"t":"p","h":"그대로 둘 두 단어","x":["wholly(전적으로)는 entirely(완전히) 자리에 그대로 들어간다.","specific instructions(구체적인 지시)도 detailed instructions(세세한 지시)와 뜻이 통한다."]}],"post":["allow(~할 수 있게 하다) ↔ forbid(금지하다)","감지 능력 덕분에 정보 수집"]}],"quiz":[{"w":"unusual","m":"특이한, 흔치 않은","it":[["uncommon","흔치 않은","s"],["ordinary","평범한","a"],["thirsty","목마른","n"],["rare","드문","s"],["typical","전형적인","a"],["metalli e(유행하는): 오늘날 유행하는 생각이라면 for example(예를 들어) 뒤의 노예제 예시와 안 맞음."],"om":["이상한, 낯선","현대적인","합리적인","유행하는"],"en":"Consistent though he may be, some of Aristotle's ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.","ko":"그가 일관된 사람일지는 몰라도, 아리스토텔레스의 생각 중 일부는 오늘날 우리에게 이상하게 다가온다. 예를 들어 그는 노예제를 정당화하는 데 아무 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력을 지닌 지위를 누렸다.","hl":["meet us today as strange","justifying slavery"],"khl":["오늘날 우리에게 이상하게 다가온다","노예제를 정당화하는"],"blocks":[{"t":"flow","h":"글의 흐름 속 자리","x":["인정: 아리스토텔레스는 일관된 사상가","하지만: 일부 생각은 오늘 보면 이상함","예시: 노예제 정당화, 철학자의 특권","이유: 사상가도 자기 시대의 사람","결론: 장점이 있어도 깊은 결함"],"at":1},{"t":"p","h":"for example(예를 들어)이 증거","x":["바로 뒤에 for example(예를 들어)과 함께 노예제 이야기가 나온다.","예시는 앞말을 뒷받침한다.","노예제를 정당화한 생각이 오늘 우리에게 familiar(익숙한)할 리 없다.","그래서 이 자리는 strange(이상한)여야 한다."]}],"post":["strange(이상한) ↔ familiar(익숙한)","노예제 정당화 = 오늘 보면 낯선 생각"]},{"slots":[["difficulty","trouble","s"],["worthy","unworthy","a"],["certainly","undoubtedly","s"],["inclusive"],["flawed"]],"opts":["worthy","afraid","reluctant","unlikely"],"or":["worthy(자격이 있는): 사색을 이유로 최고의 것을 누릴 만하다고 여겨졌다는 뜻이라 다음 문장의 self-serving(자기 잇속만 차리는)과 이어짐.","afraid(두려워하는): 좋은 것을 갖기를 두려워했다면 높은 특권을 누렸다는 앞 문장과 맞지 않음.","reluctant(꺼리는): 좋은 것을 꺼렸다면 그 주장이 잇속을 차린다는 비판이 나올 수 없음.","unlikely(가능성이 낮은): 좋은 것을 가질 가능성이 낮다는 말은 철학자들이 특권층이었다는 내용과 반대임."],"om":["~할 자격이 있는","~을 두려워하는","~을 꺼리는","~할 것 같지 않은"],"en":"Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly self-serving.","ko":"인간의 최고선을 위한 사색을 실천한다는 이유로, 철학자들은 삶의 가장 좋은 것들을 모두 가질 자격이 있다고 여겨졌다. 왠지 그 주장은 묘하게 자기 잇속만 차리는 것처럼 보인다.","hl":["considered worthy to have all the best things in life","oddly self-serving"],"khl":["가질 자격이 있다고 여겨졌다","자기 잇속만 차리는"],"blocks":[{"t":"p","h":"unworthy(자격이 없는)를 넣고 다시 읽기","x":["\"철학자들은 좋은 것을 가질 자격이 없다고 여겨졌다\"가 된다.","그러면 다음 문장이 이상해진다.","글쓴이는 그 주장이 self-serving(자기 잇속만 차리는)하다고 꼬집는다.","자격이 없다는 주장은 철학자에게 손해라 잇속과는 거리가 멀다."]},{"t":"p","h":"Because of(~ 때문에)가 만든 논리","x":["사색을 한다, 그러니 최고의 것을 누릴 자격이 있다.","철학자가 철학자를 위해 만든 논리다.","이 논리가 바로 잇속 차리기로 보인다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","trouble(어려움)은 difficulty(어려움) 자리에 그대로 들어간다.","no trouble justifying(정당화하는 데 어려움이 없음)도 자연스러운 표현이다.","undoubtedly(의심할 여지 없이)도 certainly(분명히)와 같은 쪽이다."]}],"post":["worthy(자격이 있는) ↔ unworthy(자격이 없는)","철학자가 만든 철학자 우대 논리"]},{"slots":[["justifying"],["contemplation"],["remember","recall","s"],["particular","universal","a"],["inclusive"]],"opts":["particular","global","general","worldwide"],"or":["particular(특정한): 사상가가 자기 시대에 속한다는 말과 짝을 이뤄 '그 시대의 특정 청중'이 되어 맞음.","global(세계적인): 세계 모든 사람에게 말한다면 her own time(자기 시대)에 묶인다는 말과 부딪침.","general(일반적인): 누구에게나 하는 말이라면 시대의 한계를 말하는 이 문장의 요점이 사라짐.","worldwide(전 세계의): 전 세계 청중은 고대 그리스 엘리트의 생각이라는 뒤 내용과 안 맞음."],"om":["특정한","세계적인","일반적인","전 세계의"],"en":"It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.","ko":"모든 위대한 사상가는 자기 시대에 속하고 특정한 청중에게 말한다는 것을 기억하는 것이 우리에게 도움이 되며, 분명 아리스토텔레스도 예외가 아니다.","hl":["speaks to a particular audience","is of her own time"],"khl":["특정한 청중에게 말한다","자기 시대에 속하고"],"blocks":[{"t":"pair","h":"and(그리고)로 묶인 두 말","x":[["is of her own time","자기 시대에 속한다"],["speaks to a particular audience","특정한 청중에게 말한다"]]},{"t":"p","h":"두 말은 같은 방향","x":["두 표현 모두 사상가의 한계를 말한다.","시대에 묶이고, 청중도 정해져 있다.","universal(보편적인)을 넣으면 모든 사람에게 말한다는 뜻이 된다.","시대에 묶인다는 앞말과 정면으로 부딪친다."]},{"t":"p","h":"recall(떠올리다)은 그대로","x":["recall(떠올리다)은 remember(기억하다)와 같은 뜻이다.","It serves us to recall(떠올리는 것이 우리에게 도움이 된다)도 자연스럽다."]}],"post":["particular(특정한) ↔ universal(보편적인)","위대한 사상가도 자기 시대의 사람"]},{"slots":[["strange"],["assertion"],["flourishing"],["privileged","underprivileged","a"],["deeply"]],"opts":["privileged","enslaved","powerless","humble"],"or":["privileged(특권을 가진): 바로 뒤 elite(엘리트)와 어울리고 앞의 high privilege(높은 특권)를 다시 가리켜 맞음.","enslaved(노예가 된): 노예가 된 엘리트란 말은 성립하지 않고, 노예제를 정당화한 쪽은 오히려 엘리트였음.","powerless(힘없는): 높은 영향력을 누린 사람들이라는 앞 내용과 반대임.","humble(비천한): 신분이 낮은 엘리트라는 건 말 자체가 모순임."],"om":["특권을 가진","노예가 된","힘없는","비천한"],"en":"How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good.","ko":"그가 옳음과 선을 어떻게 이해했는지는 고대 그리스 사회의 특권층 엘리트가 옳음과 선을 어떻게 이해하는 경향이 있었는지 보여 주는 지표로 보는 것이 가장 좋다.","hl":["the privileged elite of ancient Greek society","How he understood right and good"],"khl":["고대 그리스 사회의 특권층 엘리트","그가 옳음과 선을 어떻게 이해했는지는"],"blocks":[{"t":"p","h":"단어 묶음에서 튀는 것","x":["이 글에서 철학자들을 꾸미는 말을 모아 보자.","high privilege(높은 특권), influence(영향력), all the best things(모든 최고의 것).","모두 사회 위쪽에 선 사람들의 말이다.","underprivileged(혜택받지 못한)만 아래쪽 말이라 튄다."]},{"t":"p","h":"elite(엘리트)와 한 몸","x":["elite(엘리트)는 사회 맨 위층이다.","underprivileged elite(혜택받지 못한 엘리트)는 말 자체가 모순이다."]}],"post":["privileged(특권을 가진) ↔ underprivileged(혜택받지 못한)","아리스토텔레스의 선 = 고대 그리스 특권층의 선"]},{"slots":[["privilege","status","s"],["assertion"],["indicator","indication","s"],["privileged"],["flawed","flawless","a"]],"opts":["flawed","admired","praised","respected"],"or":["flawed(결함이 있는): for all it does well(잘하는 점이 많음에도)과 맞서는 말이라 맞음.","admired(존경받는): 장점이 있음에도 존경받는다는 건 양보 구조가 성립하지 않음.","praised(칭찬받는): 잘하는 점이 있는데 칭찬받는다는 말은 '그럼에도'로 이을 내용이 아님.","respected(존중받는): 특권층의 한계를 지적해 온 흐름이 칭찬으로 끝나 버림."],"om":["결함이 있는","존경받는","칭찬받는","존중받는"],"en":"As a result, for all it does well, it is also deeply flawed.","ko":"그 결과, 잘하는 점이 많음에도 불구하고, 그것은 또한 깊이 결함이 있다.","hl":["it is also deeply flawed","for all it does well"],"khl":["깊이 결함이 있다","잘하는 점이 많음에도 불구하고"],"blocks":[{"t":"p","h":"for all(~에도 불구하고)의 방향","x":["for all(~에도 불구하고)은 앞뒤를 반대로 묶는다.","앞: 잘하는 점이 많다.","뒤: 그런데도 결함이 있다.","flawless(흠 없는)를 넣으면 앞뒤가 같은 방향이 되어 for all(~에도 불구하고)이 할 일이 사라진다."]},{"t":"p","h":"As a result(그 결과)가 가리키는 원인","x":["바로 앞 문장은 그의 선이 특권층의 선이라고 했다.","노예제까지 정당화한 생각이다.","그 결과가 흠 없음일 수는 없다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","status(지위)는 privilege(특권) 자리에, indication(표시, 징후)은 indicator(지표) 자리에 들어가도 뜻이 통한다.","모음으로 시작하는 단어라 앞의 an(하나의)도 그대로 맞는다."]}],"post":["flawed(결함이 있는) ↔ flawless(흠 없는)","장점이 있어도 깊은 결함"]}],"quiz":[{"w":"strange","m":"이상한, 낯선","it":[["odd","이상한","s"],["familiar","익숙한","a"],["edible","먹을 수 있는","n"],["peculiar","기묘한","s"],["normal","정상적인, 보통의","a"],["annual","해마다의","n"],["wooden","나무로 된","n"]]},{"w":"worthy","m":"~할 자격이 있는, 가치 있는","it":[["deserving","받을 자격이 있는","s"],["unworthy","자격이 없는","a"],["frozen","얼어붙은","n"],["admirable","훌륭한, 칭찬할 만한","s"],["undeserving","받을 자격이 없는","a"],["salty","짠","n"],["rapid","빠른","n"]]},{"w":"particular","m":"특정한","it":[["specific","특정한, 구체적인","s"],["general","일반적인","a"],["muddy","진흙투성이의","n"],["certain","어떤, 특정한","s"],["universal","보편적인","a"],["bitter","쓴","n"],["shy","수줍은","n"]]},{"w":"privileged","m":"특권을 가진","it":[["advantaged","혜택받은","s"],["underprivileged","혜택받지 못한","a"],["noisy","시끄러운","n"],["favored","특혜를 받는","s"],["disadvantaged","불리한 처지의","a"],["foggy","안개 낀","n"],["spicy","매운","n"]]},{"w":"flawed","m":"결함이 있는","it":[["defective","결함이 있는","s"],["flawless","흠 없는","a"],["sleepy","졸린","n"],["faulty","결점이 있는","s"],["perfect","완벽한","a"],["crowded","붐비는","n"],["purple","보라색의","n"]]}]},{"items":[{"slots":[["difficulty"],["enjoyed","lacked","a"],["contemplation"],["remember"],["flourishing"]],"opts":["enjoyed","refused","abandoned","feared"],"or":["enjoyed(누렸다): 다음 문장에서 철학자들이 최고의 것을 가질 자격이 있다고 여겨졌으니 특권을 누린 것이 맞음.","refused(거절했다): 특권을 거절했다면 그 주장이 잇속을 차린다는 비판이 나올 수 없음.","abandoned(버렸다): 특권을 버렸다면 뒤에서 privileged elite(특권층 엘리트)라고 부를 수 없음.","feared(두려워했다): 특권을 두려워했다는 말은 최고의 것을 가질 자격이 있다는 다음 문장과 안 맞음."],"om":["누렸다","거절했다","버렸다","두려워했다"],"en":"He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.","ko":"예를 들어 그는 노예제를 정당화하는 데 아무 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력을 지닌 지위를 누렸다. 인간의 최고선을 위한 사색을 실천한다는 이유로, 철학자들은 삶의 가장 좋은 것들을 모두 가질 자격이 있다고 여겨졌다.","hl":["philosophers enjoyed positions of high privilege and influence","worthy to have all the best things in life"],"khl":["높은 특권과 영향력을 지닌 지위를 누렸다","가질 자격이 있다고"],"blocks":[{"t":"tap","h":"질문 하나","q":"특권이 없는 사람들이 '삶의 최고의 것을 다 가질 자격이 있다'고 여겨질까?","a":["그럴 수 없다.","다음 문장에서 철학자들은 삶의 최고의 것을 가질 자격이 있다고 여겨졌다.","그러니 그들은 이미 특권을 누리던 사람들이다.","lacked(~이 없었다)를 넣으면 이 그림이 무너진다."]},{"t":"p","h":"and(그리고)로 이어진 두 예시","x":["노예제 정당화, 그리고 철학자의 특권.","둘 다 오늘 보면 낯선 생각의 예다.","특권이 없었다면 낯설어할 거리도 아니다."]}],"post":["enjoy(누리다) ↔ lack(~이 없다)","고대 철학자 = 특권과 영향력을 누린 사람"]},{"slots":[["justifying","defending","s"],["worthy"],["certainly","surely","s"],["inclusive","exclusive","a"],["indicator"]],"opts":["inclusive","narrow","limited","selective"],"or":["inclusive(포용적인): 노예를 빼놓은 그의 번영은 오늘 우리가 원하는 만큼 모두를 아우르지 못한다는 뜻이라 맞음.","narrow(좁은): 우리가 오늘 좁은 번영을 원하지는 않으니 '원하는 만큼 좁지 않다'는 말이 안 됨.","limited(제한된): 우리가 바라는 것이 제한된 번영이라는 말이 되어 글의 비판과 반대임.","selective(선택적인): 일부만 골라 주는 번영을 우리가 원한다는 말이 되어 맞지 않음."],"om":["포용적인","좁은","제한된","선택적인"],"en":"Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.","ko":"그가 이해한 인간의 번영은 아마 오늘날 우리가 바라는 만큼 포용적이지는 결코 않을 것이다.","hl":["would not be nearly as inclusive as we would want it to be today","Human flourishing as he understood it"],"khl":["오늘날 우리가 바라는 만큼 포용적이지는 결코 않을 것이다","그가 이해한 인간의 번영은"],"blocks":[{"t":"p","h":"exclusive(배타적인)를 넣고 다시 읽기","x":["\"우리가 오늘 원하는 만큼 배타적이지 않을 것이다\"가 된다.","그러면 우리가 배타적인 번영을 바란다는 말이 된다.","노예제를 정당화한 사람의 번영이 오히려 덜 배타적이라는 셈이다.","글의 비판과 정반대다."]},{"t":"p","h":"not nearly as(~만큼은 전혀 아닌)의 기준","x":["이 표현은 기준에 한참 못 미친다는 뜻이다.","기준은 오늘 우리가 바라는 모습.","우리가 바라는 건 노예까지 모두를 끌어안는 번영이다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","defending(옹호하기)은 justifying(정당화하기) 자리에 그대로 들어간다.","surely(분명히)도 certainly(분명히)와 같은 뜻이다."]}],"post":["inclusive(포용적인) ↔ exclusive(배타적인)","그의 번영 = 노예는 빠진 번영"]},{"slots":[["strange"],["contemplation","reflection","s"],["assertion","denial","a"],["particular"],["privileged"]],"opts":["assertion","apology","criticism","complaint"],"or":["assertion(주장): that(그)이 앞 문장의 '철학자는 최고의 것을 누릴 자격이 있다'를 가리키니 주장이 맞음.","apology(사과): 앞 문장에 누가 사과하는 내용은 없음.","criticism(비판): 앞 문장은 철학자를 비판하는 게 아니라 높이는 말임.","complaint(불평): 철학자를 우대하는 말을 불평이라고 부를 수 없음."],"om":["주장","사과","비판","불평"],"en":"Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly self-serving.","ko":"인간의 최고선을 위한 사색을 실천한다는 이유로, 철학자들은 삶의 가장 좋은 것들을 모두 가질 자격이 있다고 여겨졌다. 왠지 그 주장은 묘하게 자기 잇속만 차리는 것처럼 보인다.","hl":["that assertion","philosophers were considered worthy"],"khl":["그 주장","철학자들은"],"blocks":[{"t":"pair","h":"that(그)이 가리키는 문장","x":[["philosophers were considered worthy to have all the best things in life","철학자들은 삶의 최고의 것을 다 가질 자격이 있다고 여겨졌다"],["that assertion seems oddly self-serving","그 주장은 묘하게 자기 잇속을 차리는 것처럼 보인다"]]},{"t":"p","h":"denial(부인)이 틀린 이유","x":["앞 문장은 무언가를 부인하지 않는다.","오히려 철학자의 자격을 힘주어 내세운다.","내세우는 말이 곧 assertion(주장).","denial(부인)을 넣으면 가리킬 대상이 사라진다."]},{"t":"p","h":"reflection(숙고)은 그대로","x":["reflection(숙고)은 contemplation(사색)과 같은 쪽 말이다.","practice of reflection(숙고의 실천)도 자연스럽다."]}],"post":["assertion(주장) ↔ denial(부인)","철학자는 최고의 것을 누릴 자격 = 잇속 차린 주장"]},{"slots":[["justifying"],["privilege"],["remember","forget","a"],["inclusive"],["deeply"]],"opts":["remember","ignore","doubt","deny"],"or":["remember(기억하다): 사상가가 자기 시대의 사람이라는 점을 마음에 두라는 글쓴이의 조언이라 맞음.","ignore(무시하다): 이 점을 무시하라고 하면 바로 뒤 Aristotle is no exception(아리스토텔레스도 예외가 아니다)을 꺼낼 이유가 없음.","doubt(의심하다): 의심하라는 말을 바로 '분명히 예외가 아니다'로 받쳐 줄 수 없음.","deny(부인하다): 부인하라는 조언이라면 이 점을 근거로 결함을 짚는 글 전체 흐름과 반대임."],"om":["기억하다","무시하다","의심하다","부인하다"],"en":"It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.","ko":"모든 위대한 사상가는 자기 시대에 속하고 특정한 청중에게 말한다는 것을 기억하는 것이 우리에게 도움이 되며, 분명 아리스토텔레스도 예외가 아니다.","hl":["It serves us to remember","certainly Aristotle is no exception"],"khl":["기억하는 것이 우리에게 도움이 되며","분명 아리스토텔레스도 예외가 아니다"],"blocks":[{"t":"tap","h":"한 줄 요약 복원","q":"이 글의 핵심을 한 줄로 줄이면?","a":["위대한 사상가도 자기 시대의 눈으로 본다.","그 점을 늘 기억해야 그의 한계가 보인다.","forget(잊다)은 그 열쇠를 버리라는 말이다."]},{"t":"p","h":"serves us(우리에게 도움이 된다)의 방향","x":["serves us(우리에게 도움이 된다)는 좋은 조언을 꺼낼 때 쓴다.","잊는 것이 도움이 된다면 뒤에 시대 이야기를 꺼낼 이유가 없다.","글쓴이는 바로 이 점을 근거로 아리스토텔레스를 다시 본다."]}],"post":["remember(기억하다) ↔ forget(잊다)","사상가도 자기 시대에 속함"]},{"slots":[["Consistent","Inconsistent","a"],["flourishing","well-being","s"],["indicator"],["deeply","seriously","s"],["flawed"]],"opts":["Consistent","Careless","Confused","Clumsy"],"or":["Consistent(일관된): 글쓴이가 먼저 장점을 인정하고 though(~이지만)로 한계를 꺼내는 구조라 맞음.","Careless(부주의한): 단점을 인정한 뒤 또 단점을 말하면 though(~이지만)로 맞세울 거리가 없음.","Confused(혼란스러운): 혼란스러운 사람이라면 생각이 이상한 게 당연해 '그럼에도'의 구조가 깨짐.","Clumsy(서툰): 서툴다는 단점 뒤에 또 단점이 오니 양보 구조가 성립하지 않음."],"om":["일관된","부주의한","혼란스러운","서툰"],"en":"Consistent though he may be, some of Aristotle's ideas meet us today as strange. … As a result, for all it does well, it is also deeply flawed.","ko":"그가 일관된 사람일지는 몰라도, 아리스토텔레스의 생각 중 일부는 오늘날 우리에게 이상하게 다가온다. … 그 결과, 잘하는 점이 많음에도 불구하고, 그것은 또한 깊이 결함이 있다.","hl":["Consistent though he may be","for all it does well"],"khl":["일관된 사람일지는 몰라도","잘하는 점이 많음에도 불구하고"],"blocks":[{"t":"pair","h":"처음과 끝 나란히","x":[["Consistent though he may be","그가 일관된 사람일지는 몰라도 (장점 인정)"],["for all it does well, it is also deeply flawed","잘하는 점이 많음에도 깊은 결함이 있다 (장점 인정 + 한계)"]]},{"t":"p","h":"though(~이지만)는 앞뒤를 맞세운다","x":["앞: 장점, 뒤: 한계.","Inconsistent(일관성 없는)를 넣으면 앞도 단점이 된다.","단점과 단점은 though(~이지만)로 맞세울 수 없다.","이 글은 처음과 끝이 모두 '장점은 있지만 한계도 있다'는 틀이다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","well-being(행복, 안녕)은 flourishing(번영) 자리에, seriously(심각하게)는 deeply(깊이) 자리에 들어가도 뜻이 통한다."]}],"post":["consistent(일관된) ↔ inconsistent(일관성 없는)","장점 인정 + 한계 지적"]}],"quiz":[{"w":"enjoy","m":"즐기다, 누리다","it":[["relish","즐기다","s"],["di urred much {earlier}.","fn":["*demographically: 인구학적으로","*fig: 무화과","*baboon: 개코원숭이","*primate: 영장류","*infant mortality rate: 유아 사망률","*hunter-gatherer: 수렵 채집인","*reproduce: 번식하다, 자식을 낳다"],"mean":{"survival":"생존","death":"죽음","early":"초기의, 초반의","initial":"처음의, 초기의","final":"마지막의","high":"높은","low":"낮은","fell":"동사 fall(넘어지다, 쓰러지다)의 과거형","tumbled":"동사 tumble(굴러 넘어지다)의 과거형","survived":"동사 survive(살아남다)의 과거형","won":"동사 win(이기다)의 과거형","celebrated":"동사 celebrate(축하하다)의 과거형","laughed":"동사 laugh(웃다)의 과거형","clearing":"동사 clear((장애물을) 뛰어넘다)의 -ing형. 동명사","getting over":"동사구 get over(넘어가다)의 -ing형. 동명사","close to":"~에 가까이","near":"~ 가까이에","far from":"~에서 멀리","extremely":"극도로","incredibly":"믿을 수 없을 만큼, 엄청나게","barely":"거의 ~않게","wasteful":"낭비하는","protective":"보호하는, 지키려 하는","in the wild":"야생에서","in captivity":"갇혀서, 사육 상태에서","typical":"전형적인, 흔히 있는","common":"흔한","normal":"보통의, 정상적인","unusual":"드문, 특이한","similar":"비슷한","comparable":"비슷한, 견줄 만한","higher":"형용사 high(높은)의 비교급, 더 높은","greater":"형용사 great(큰)의 비교급, 더 큰","little":"(부사) 거의 ~않게","hardly":"거의 ~않게","much":"(비교급 앞에서) 훨씬","huge":"엄청난, 거대한","massive":"거대한, 막대한","tiny":"아주 작은","recent":"최근의","ancient":"고대의, 아주 오래된","earlier":"부사 early(일찍)의 비교급, 더 일찍","sooner":"부사 soon(곧)의 비교급, 더 빨리","later":"부사 late(늦게)의 비교급, 더 늦게"},"comp":[{"no":"29","slots":[["early","initial","s"],["high"],["close_to","far from","a"],["wasteful"],["higher"]],"opts":["close_to","away_from","free_from","apart_from"],"or":["close to(~에 가까이): 바로 뒤 '자연은 생명을 극도로 낭비한다'가 인류에게도 해당하려면 자연 가까이 살아야 해서 맞음.","away from(~에서 떨어져): 자연에서 떨어져 살았다면 자연의 낭비가 사람에게 해당할 이유가 없음.","free from(~에서 벗어나): 자연 상태에서 벗어났다면 높은 허들도, 높은 사망률도 설명되지 않음.","apart from(~와 떨어져): 자연과 떨어져 살았다면 사람의 사망률이 유인원과 비슷했다는 뒷말과 부딪침."],"om":["~에 가까이","~에서 떨어져","~에서 벗어나","~와 떨어져"],"en":"Demographically, humankind was living close to a state of nature, and nature is extremely wasteful of life.","ko":"인구학적으로 인류는 자연 상태에 가깝게 살고 있었고, 자연은 생명을 극도로 낭비한다.","hl":["living close to a state of nature","nature is extremely wasteful of li d, which is fairly typical for primates.","ko":"자연은 생명을 극도로 낭비한다. … 야생에서 태어난 개코원숭이의 거의 4분의 1이 한 살이 되기 전에 죽는데, 이는 영장류에게 꽤 전형적인 일이다.","hl":["born in the wild","nature is extremely wasteful of life"],"khl":["야생에서 태어난","자연은 생명을 극도로 낭비한다"],"blocks":[{"t":"tap","h":"질문 하나","q":"개코원숭이 예시는 무엇을 보여 주려고 나왔을까?","a":["자연이 생명을 얼마나 낭비하는지.","그러려면 사람 손이 닿지 않은 곳이어야 한다.","그래서 in the wild(야생에서)다."]},{"t":"p","h":"in captivity(갇혀서)를 넣으면","x":["갇혀 사는 원숭이는 사람이 먹이고 돌본다.","그건 자연 상태가 아니다.","예시가 주장을 받쳐 주지 못하고 엉뚱한 얘기가 된다."]}],"post":["in the wild(야생에서) ↔ in captivity(갇혀서)","개코원숭이 = 자연 상태의 견본"]},{"slots":[["survival"],["in_the_wild"],["typical","common","s"],["little","much","a"],["earlier","sooner","s"]],"opts":["little","far","even","still"],"or":["little(거의 ~않게): 조상들도 4분의 1이 첫 생일 전에 죽었으니 '거의 나을 게 없었다'가 맞음.","far(훨씬): '훨씬 나았다'가 되어 4분의 1이 첫 생일도 못 맞았다는 뒷말과 부딪침.","even(한층 더): '한층 더 나았다'는 사정이 좋았다는 말이라 높은 사망률 내용과 안 맞음.","still(더욱): '더욱 나았다'도 사정이 좋았다는 쪽이라 절반 가까이 어른이 못 됐다는 내용과 반대임."],"om":["거의 ~않게","훨씬","한층 더","더욱"],"en":"Things were little better for our hunter-gatherer ancestors, a quarter of whom failed to reach their first birthday, while another quarter didn't live long enough to reproduce just about everywhere until the nineteenth century.","ko":"우리의 수렵 채집인 조상들에게도 사정은 거의 나을 게 없었는데, 그들 중 4분의 1은 첫 생일을 맞지 못했고, 또 다른 4분의 1은 19세기까지 거의 모든 곳에서 자식을 낳을 만큼 오래 살지 못했다.","hl":["little better","a quarter of whom failed to reach their first birthday"],"khl":["거의 나을 게 없었는데","4분의 1은 첫 생일을 맞지 못했고"],"blocks":[{"t":"p","h":"뒤에 붙은 숫자로 확인","x":["조상들 중 4분의 1은 첫 생일을 못 맞았다.","또 4분의 1은 자식을 낳을 나이까지 못 살았다.","거의 절반이 어른이 되기 전에 사라진 셈이다.","much better(훨씬 나은)라고 하기엔 숫자가 너무 참혹하다."]},{"t":"p","h":"little 하나로 뜻이 뒤집힘","x":["a little better(조금 나은)는 \"조금 낫다\"다.","관사 없는 little better(거의 나을 게 없는)는 \"거의 안 낫다\"다.","이 글은 뒤쪽 뜻이다."]},{"t":"p","h":"함정","x":["common(흔한)은 typical(전형적인) 자리에, sooner(더 빨리)는 earlier(더 일찍) 자리에 들어가도 뜻이 통한다.","고칠 곳은 한 군데."]}],"post":["little(거의 ~않게) ↔ much(훨씬)","수렵 채집 조상 = 절반 가까이 어른이 못 됨"]}],"quiz":[{"w":"survival"," ions in which the contents of the verbal and nonverbal messages {differ}). Attempts to {manipulate} another person verbally are therefore {likely} to {fail} if the {accompanying} nonverbal communication does not {match} the spoken message. This is because people {trust} nonverbal messages more than verbal ones. When somebody tells you that they enjoy spending time with you, but you notice how they are looking away and are {forcing} a smile, you are probably {less} {inclined} to believe their words. The same is probably true when you are back at the office after a sickness and your colleague tells you with a {displeased} expression that they were happy to take over your workload. You might not believe that they enjoyed {replacing} you while you were gone.","fn":["*nonverbal: 비언어적인","*phenomenon: 현상","*workload: 업무량"],"mean":{"confirmed":"동사 confirm(확인하다)의 과거형","verified":"동사 verify(검증하다, 확인하다)의 과거형","disproved":"동사 disprove(틀렸음을 증명하다)의 과거형","dominance":"우위, 지배","superiority":"우월함, 우위","weakness":"약함, 약점","especially":"특히","particularly":"특히","pronounced":"두드러진, 뚜렷한","noticeable":"눈에 띄는, 두드러진","faint":"희미한, 약한","conflicting":"상충하는, 서로 어긋나는","contradictory":"모순되는","consistent":"일관된, 서로 맞는","differ":"다르다","agree":"일치하다","manipulate":"(사람을) 조종하다","control":"통제하다, 조종하다","likely":"~할 것 같은, ~하기 쉬운","unlikely":"~할 것 같지 않은","fail":"실패하다","succeed":"성공하다","accompanying":"동사 accompany(동반하다)의 -ing형, 함께 따라오는","match":"일치하다, 맞다","align with":"~와 일치하다, ~와 맞다","contradict":"모순되다, 반대되다","trust":"신뢰하다, 믿다","rely on":"~을 믿고 의지하다","doubt":"의심하다","forcing":"동사 force(억지로 하다)의 -ing형. 진행형(are forcing)","faking":"동사 fake(꾸며 내다, ~인 척하다)의 -ing형. 진행형(are faking)","less":"덜","more":"더","inclined":"~하고 싶은, ~하는 경향이 있는","willing":"기꺼이 ~하는","reluctant":"꺼리는, 마지못한","displeased":"불쾌한, 언짢은","grumpy":"언짢은, 심통 난","cheerful":"쾌활한, 기분 좋은","replacing":"동사 replace(대신하다)의 -ing형. 동명사","covering for":"동사구 cover for(~의 일을 대신 봐 주다)의 -ing형. 동명사"},"comp":[{"no":"30","slots":[["dominance","superiority","s"],["pronou on does not match the spoken message. This is because people trust nonverbal messages more than verbal ones.","ko":"그러므로 말로 다른 사람을 조종하려는 시도는, 함께 따라오는 비언어적 의사소통이 말한 메시지와 맞지 않으면 실패하기 쉽다. 이는 사람들이 언어적 메시지보다 비언어적 메시지를 더 믿기 때문이다.","hl":["likely to fail","people trust nonverbal messages more than verbal ones"],"khl":["실패하기 쉽다","비언어적 메시지를 더 믿기 때문이다"],"blocks":[{"t":"p","h":"This is because(이는 ~ 때문이다)로 따지기","x":["다음 문장이 바로 이유를 댄다.","사람들은 말보다 몸짓을 더 믿는다.","말과 몸짓이 어긋나면 사람들은 몸짓 쪽을 믿는다.","그러니 말로만 하는 조종은 들통나고 실패한다.","succeed(성공하다)를 넣으면 이유와 결과가 따로 논다."]},{"t":"p","h":"고치지 않는 단어","x":["faking a smile(가짜 미소를 짓다)은 forcing a smile(억지 미소를 짓다)과 같은 장면이다.","둘 다 속마음과 다른 미소."]}],"post":["fail(실패하다) ↔ succeed(성공하다)","말과 몸짓이 어긋나면 몸짓이 이김"]},{"slots":[["pronounced"],["likely"],["trust","doubt","a"],["less"],["replacing"]],"opts":["trust","question","suspect","ignore"],"or":["trust(신뢰하다): 몸짓과 말이 어긋나면 몸짓 쪽을 믿는다는 뒤의 예시들과 맞음.","question(의문을 품다): 몸짓을 더 의심한다면 억지 미소를 보고 말을 덜 믿게 될 리 없음.","suspect(의심하다): 몸짓을 의심하는 사람은 언짢은 표정보다 '기뻤다'는 말을 믿을 것이라 예시와 반대임.","ignore(무시하다): 몸짓을 무시한다면 말과 몸짓이 어긋나도 조종이 실패할 이유가 없음."],"om":["신뢰하다","의문을 품다","의심하다","무시하다"],"en":"This is because people trust nonverbal messages more than verbal ones.","ko":"이는 사람들이 언어적 메시지보다 비언어적 메시지를 더 믿기 때문이다.","hl":["people trust nonverbal messages","more than verbal ones"],"khl":["비언어적 메시지를 더 믿기 때문이다","언어적 메시지보다"],"blocks":[{"t":"tap","h":"질문 하나","q":"친구가 \"너랑 노는 게 좋아\"라고 하면서 눈을 피하고 억지로 웃는다. 무엇을 믿게 될까?","a":["말이 아니라 표정과 눈빛.","이게 바로 몸짓을 더 믿는다는 뜻이다.","doubt(의심하다)를 넣으면 이 예시와 거꾸로 간다."]},{"t":"p","h":"앞뒤 문장 고리","x":["앞 문장: 말과 몸짓이 어긋나면 조종은 실패한다.","이 문장: 사람들이 몸짓을 더 믿기 때문이다.","이유가 뒤집히면 앞 문장의 \"실패한다\"도 설명이 안 된다."]}],"post":["trust(신뢰하다) ↔ doubt(의심하다)","말보다 표정을 믿는 사람들"]},{"slots":[["confirmed"],["match"],["inclined","willing","s"],["displeased","cheerful","a"],["replacing","covering for","s"]],"opts":["displeased","delighted","warm","grateful"],"or":["displeased(언짢은): '기뻤다'는 말과 어긋나는 표정이어야 다음 문장의 '믿지 않을 것'이 나와서 맞음.","delighted(아주 기쁜): 표정까지 기쁘면 말과 몸짓이 맞아서 믿지 않을 이유가 없음.","warm(따뜻한): 따뜻한 표정이라면 동료의 말을 의심할 근거가 사라짐.","grateful(고마워하는): 고마워하는 표정은 일을 떠맡아 기뻤다는 말과 어긋나지 않음."],"om":["언짢은","아주 기쁜","따뜻한","고마워하는"],"en":"The same is probably true when you are back at the office after a sickness and your colleague tells you with a displeased expression that they were happy to take over your workload. You might not believe that they enjoyed replacing you while you were gone.","ko":"여러분이 아파서 쉬었다가 회사에 돌아왔는데, 동료가 언짢은 표정으로 여러분의 업무를 떠맡게 되어 기뻤다고 말할 때도 아마 마찬가지일 것이다. 여러분은 여러분이 없는 동안 그들이 여러분 대신 일하는 걸 즐겼다는 말을 믿지 않을지도 모른다.","hl":["with a displeased expression","You might not believe"],"khl":["언짢은 표정으로","믿지 않을지도 모른다"],"blocks":[{"t":"pair","h":"말과 얼굴 나란히","x":[["they were happy to take over your workload","네 일을 떠맡게 되어 기뻤다 (말)"],["with a displeased expression","언짢은 표정으로 (얼굴)"]]},{"t":"p","h":"cheerful(쾌활한)을 넣으면","x":["말도 기쁘고 얼굴도 기쁘다.","어긋나는 게 없다.","그런데 다음 문장은 \"믿지 않을지도 모른다\"이다.","믿지 않으려면 말과 얼굴이 달라야 한다."]},{"t":"p","h":"함정","x":["willing(기꺼이 ~하는)은 inclined(~하고 싶은) 자리에서 \"덜 믿고 싶어진다\"를 그대로 살린다.","covering for(~의 일을 대신 봐 주기)는 replacing(대신하기)과 같은 상황이다."]}],"post":["displeased(언짢은) ↔ cheerful(쾌활한)","말은 \"기뻤어\", 얼굴은 언짢음"]}],"quiz":[{"w":"confirm","m":"확인하다","it":[["verify","검증하다","s"],["disprove","틀렸음을 증명하다","a"],["borrow","빌리다","n"],["validate","입증하다","s"],["refute","반박하다","a"],["whisper","속삭이다","n"],["decorate","장식하다","n"]]},{"w":"conflicting","m":"상충하는, 서로 어긋나는","it":[["contradictory","모순되는","s"],["consistent","일관된","a"],["wooden","나무로 된","n"],["clashing","충돌하는","s"],["compatible","양립하는, 잘 맞는","a"],["annual","해마다의","n"],["fluent","유창한","n"]]},{"w":"fail","m":"실패하다","it":[["flop","실패하다","s"],["succeed","성공하다","a"],["sneeze","재채기하다","n"],["fall short","미치지 못하다, 실패하다","s"],["triumph","승리하다, 성공하다","a"],["knit","뜨개질하다","n"],["arrive","도착하다","n"]]},{"w":"trust","m":"신뢰하다, 믿다","it":[["rely on","~을 믿고 의지하다","s"],["doubt","의심하다","a"],["paint","칠하다","n"],["count on","~을 믿다","s"],["distrust","불신하다","a"],["swim","수영하다","n"],["fold","접다","n"]]},{"w":"displeased","m":"불 essage.","ko":"그러므로 말로 다른 사람을 조종하려는 시도는, 함께 따라오는 비언어적 의사소통이 말한 메시지와 맞지 않으면 실패하기 쉽다.","hl":["does not match the spoken message","likely to fail"],"khl":["말한 메시지와 맞지 않으면","실패하기 쉽다"],"blocks":[{"t":"p","h":"not(않다)과 만나면 뒤집힘","x":["does not match(맞지 않는다) = 어긋난다.","does not contradict(모순되지 않는다) = 서로 맞는다.","말과 몸짓이 서로 맞으면 조종이 실패할 이유가 없다.","실패하는 건 어긋날 때다."]},{"t":"p","h":"앞 문장과 같은 상황","x":["앞 문장의 conflicting messages(어긋나는 메시지)가 바로 이 \"맞지 않는\" 상황이다.","같은 상황을 두 번 다른 말로 짚는다."]},{"t":"p","h":"함정","x":["noticeable(눈에 띄는)은 pronounced(두드러진)와 같은 뜻이다.","rely on(~을 믿고 의지하다)은 trust(신뢰하다) 자리에 들어가도 된다."]}],"post":["match(일치하다) ↔ contradict(모순되다)","말과 몸짓이 따로 놀면 조종 실패"]},{"slots":[["manipulate"],["likely"],["forcing"],["less","more","a"],["displeased","grumpy","s"]],"opts":["less","highly","very","strongly"],"or":["less(덜): 억지 미소를 보면 그 말을 덜 믿게 되므로 맞음.","highly(매우): '매우 믿고 싶어진다'가 되어 눈을 피하고 억지로 웃는 장면과 정반대임.","very(아주): '아주 믿고 싶어진다'는 몸짓을 더 믿는다는 글의 주장과 거꾸로임.","strongly(강하게): '강하게 믿고 싶어진다'면 말이 몸짓을 이긴다는 뜻이 됨."],"om":["덜","매우","아주","강하게"],"en":"When somebody tells you that they enjoy spending time with you, but you notice how they are looking away and are forcing a smile, you are probably less inclined to believe their words.","ko":"누군가 여러분과 시간을 보내는 게 즐겁다고 말하지만, 그 사람이 눈길을 피하고 억지로 미소 짓는 것을 알아차리면, 여러분은 아마 그 말을 덜 믿고 싶어질 것이다.","hl":["less inclined to believe their words","forcing a smile"],"khl":["덜 믿고 싶어질 것이다","억지로 미소 짓는"],"blocks":[{"t":"flow","h":"장면 따라가기","x":["말: 너랑 있는 게 즐거워","눈: 다른 곳을 봄","입: 억지 미소","내 마음: 말을 덜 믿게 됨"],"at":3},{"t":"p","h":"but(하지만)이 정하는 방향","x":["말은 즐겁다고 하는데 but(하지만) 몸짓은 반대다.","이 글의 주장대로라면 몸짓 쪽을 믿는다.","그러니 말은 덜 믿는다.","more(더)를 넣으면 억지 미소를 보고 말을 더 믿는 이상한 사람이 된다."]},{"t":"p","h":"함정","x":["grumpy(언짢은)는 displeased(언짢은)와 같은 표정이라 고치지 않는다."]}],"post":["less(덜) ↔ more(더)","억지 미소 = 말을 덜 믿게 되는 신호"]},{"slots":[["confirmed"],["pronounced","faint","a"],["accompanying"],["match"],["inclined"]],"opts":["pronounced","hidden","reduced","rare"],"or":["pronounced(두드러진): 말과 몸짓이 어긋날 때 몸짓의 힘이 특히 세게 드러나서 맞음.","hidden(숨겨진): 어긋날 때 현상이 숨는다면 '그러므로 조종이 실패한다'는 결론이 나오지 않음.","reduced(줄어든): 줄어들었다면 바로 어긋날 때 조종이 실패한다는 다음 문장과 반대임.","rare(드문): 드물게 나타난다면 especially(특히)와 함께 쓸 이유가 없음."],"om":["두드러진","숨겨진","줄어든","드문"],"en":"The phenomenon, however, was especially pronounced when adults found themselves in situations with conflicting messages … Attempts to manipulate another person verbally are therefore likely to fail","ko":"그런데 그 현상은 성인들이 메시지가 서로 어긋나는 상황에 놓였을 때 특히 두드러졌다. … 그러므로 말로 다른 사람을 조종하려는 시도는 … 실패하기 쉽다.","hl":["especially pronounced","therefore likely to fail"],"khl":["특히 두드러졌다","실패하기 쉽다"],"blocks":[{"t":"p","h":"therefore(그러므로)가 증거","x":["다음 문장은 therefore(그러므로)로 시작하는 결론이다.","어긋날 때 몸짓의 힘이 특히 세다, 그러므로 말로 하는 조종은 실패한다.","faint(희미한)를 넣으면 \"어긋날 때 오히려 약했다, 그러므로 실패한다\"가 된다.","원인과 결론이 맞물리지 않는다."]},{"t":"p","h":"however(그런데)의 역할","x":["however(그런데)는 여기서 반대가 아니라 \"특히 이런 때\"를 덧붙이는 신호다.","몸짓은 늘 세지만, 말과 어긋날 때 더 세다."]}],"post":["pronounced(두드러진) ↔ faint(희미한)","말과 몸짓이 어긋날 때 몸짓이 더 셈"]},{"slots":[["confirmed","verified","s"],["conflicting","contradictory","s"],["likely","unlikely","a"],["trust"],["forcing"]],"opts":["likely","unable","careful","hesitant"],"or":["likely(~하기 쉬운): 몸짓이 말과 안 맞으면 조종이 실패하기 쉽다는 뜻이라 글의 결론과 맞음.","unable(~할 수 없는): '실패할 수 없다'가 되어 어긋날 때 들통난다는 내용과 반대임.","careful(조심하는): 시도가 실패를 조심한다는 말이 되어 뜻이 통하지 않음.","hesitant(망설이는): 시도가 실패하기를 망설인다는 엉뚱한 말이 되어 결론이 사라짐."],"om":["~하기 쉬운","~할 수 없는","조심하는","망설이는"],"en":"Attempts to manipulate another person verbally are therefore likely to fail if the accompanying nonverbal communication does not match the spoken message.","ko":"그러므로 말로 다른 사람을 조종하려는 시도는, 함께 따라오는 비언어적 의사소통이 말한 메시지와 맞지 않으면 실패하기 쉽다.","hl":["are therefore likely to fail","does not match"],"khl":["실패하기 쉽다","맞지 않으면"],"blocks":[{"t":"tap","h":"한 줄 요약","q":"세 번째 문장을 한 줄로 줄이면?","a":["말과 몸짓이 어긋나면, 말로 하는 조종은 들통난다.","unlikely(~할 것 같지 않은)를 넣으면 \"들통나지 않는다\"가 되어 정반대."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","verified(검증했다)는 confirmed(확인했다)와, contradictory(모순되는)는 conflicting(상충하는)과 같은 뜻이다.","이 둘을 고쳤다면 본문 철자만 외운 것."]}],"post":["likely(~하기 쉬운) ↔ unlikely(~할 것 같지 않은)","어긋나는 몸짓 = 들통나는 거짓말"]}],"quiz":[{"w":"dominance","m":"우위, 지배","it":[["superiority","우월함, 우위","s"],["weakness","약함","a"],["harvest","수확","n"],["supremacy","최고 지위, 우위","s"],["inferiority","열등함","a"],["recipe","요리법","n"],["voyage","항해","n"]]},{"w":"match","m":"일치하다, 맞다","it":[["correspond","일치하다","s"],["contradict","모순되다","a"],["bake","굽다","n"],["fit","맞다, 들어맞다","s"],["clash","충돌하다, 어울리지 않다","a"],["sweep","쓸다","n"],["climb","오르다","n"]]},{"w":"less","m":"덜","it":[["not as much","그만큼 많이 ~않게","s"],["more","더","a"],["outdoors","야외에서","n"],["to a lesser degree","더 적은 정도로","s"],["to a greater degree","더 큰 정도로","a"],["upstairs","위층에서","n"],["aloud","소리 내어","n"]]},{"w":"pronounced","m":"두드러진, 뚜렷한","it":[["noticeable","눈에 띄는","s"],["faint","희미한","a"],["edible","먹을 수 있는","n"],["marked","뚜렷한","s"],["subtle","미묘한, 희미한","a"],["wooden","나무로 된","n"],["loyal","충실한","n"]]},{"w":"likely","m":"~할 것 같은, ~하기 쉬운","it":[["apt","~하기 쉬운","s"],["unlikely","~할 것 같지 않은","a"],["hungry","배고픈","n"],["liable","~하기 쉬운","s"],["improbable","있을 것 같지 않은","a"],["shiny","반짝이는","n"],["rural","시골의","n"]]}]}],"no":"30"},{"id":"2610g2-31","title":"어휘특훈 · 26년 10월 고2 31번","sub":"기본 설정은 결함이 아니라 설계","tpl":"A person who lives eighty years lives some twenty-nine thousand days, and the {overwhelming} majority of the behaviour packed into them runs on settings {laid_down}, most of them, decades earlier and {rarely} inspected since. This need not be a {hopeless} thought. In one light it is a {triumph} of engineering. If you had to {consciously} decide every footstep and every fork-grip and every word, you would never make it out of bed; the {deliberate} mind is far too {slow} and too {costly} to run a whole life in real time, and any creature that tried would be {outcompeted} by a creature that didn't. The {automation} is precisely what {frees} the captain to come up on deck for the {few} problems that actually require him. The default is not a {flaw} in the human design. It is arguably the {central} feature, the thing that makes a {complex} life {affordable} at all.","fn":["*fork-grip: 포크를 쥐는 동작","*default: 기본 설정","*engineering: 설계, 공학"],"mean":{"overwhelming":"압도적인","vast":"막대한, 대다수의","laid down":"lay down(정하다, 규정하다)의 과거분사형. 정해진","established":"동사 establish(확립하다, 정하다)의 과거분사형. 정해진","rarely":"거의 ~않게, 드물게","seldom":"좀처럼 ~않게","constantly":"끊임없이, 늘","hopeless":"절망적인, 가망 없는","reassuring":"안심시키는","bleak":"암울한","triumph":"승리, 대성공","marvel":"경이, 놀라운 것","failure":"실패","consciously":"의식적으로","automatically":"자동적으로, 저절로","deliberate":"신중한, 숙고하는","conscious":"의식적인","automatic":"자동의, 무의식적인","slow":"느린","sluggish":"느릿느릿한, 굼뜬","quick":"빠른","costly":"비용이 많이 드는","expensive":"비싼, 비용이 큰","economical":"경제적인, 비용이 적게 드는","outcompeted":"동사 outcompete(경쟁에서 이기다)의 과거분사형. be outcompeted = 경쟁에서 밀려나다","outperformed":"동사 outperform(~보다 더 잘하다)의 과거분사형. be outperformed = 밀려나다, 뒤처지다","automation":"자동화","autopilot":"자동 조종 (장치)","frees":"동사 free(자유롭게 하다, 풀어 주다)의 3인칭 단수 현재형","liberates":"동사 liberate(해방하다, 자유롭게 하다)의 3인칭 단수 현재형","forbids":"동사 forbid(금지하다)의 3인칭 단수 현재형","few":"거의 없는, 몇 안 되는","countless":"셀 수 없이 많은","flaw":"결함","defect":"결함","strength":"강점","central":"중심적인, 핵심적인","core":"핵심의","marginal":"주변적인, 사소한","complex":"복잡한","complicated":"복잡한","affordable":"감당할 수 있는, (비용이) 감당 가능한","unmanageable":"감당할 수 없는, 다루기 힘든"},"comp":[{"no":"31","slots":[["laid_down"],["triumph","failure","a"],["costly","expensive","s"],["automation"],["few"]],"opts":["triumph","defeat","blunder","waste"],"or":["triumph(승리): 절망할 필요 없다는 앞 문장 뒤에서 자동화를 좋게 보는 쪽으로 돌아서는 말이라 맞음.","defeat(패배): 설계의 패배라면 절망할 필요가 없다는 앞 문장과 부딪침.","blunder(큰 실수): 큰 실수라면 마지막 문장의 '결함이 아니다'와 정반대임.","waste(낭비): 자동화는 오히려 비용을 아껴 주는 장치라서 낭비라는 말과 거꾸로임."],"om":["승리","패배","큰 실수","낭비"],"en":"This need not be a hopeless thought. In one light it is a triumph of engineering.","ko":"이것이 꼭 절망적인 생각일 필요는 없다. 어떤 면에서 보면 그것은 설계의 승리다.","hl":["a triumph of engineering","need not be a hopeless thought"],"khl":["설계의 승리","
