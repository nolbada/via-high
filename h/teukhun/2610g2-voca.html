"blocks":[{"t":"p","h":"글쓴이가 먼저 막는 걱정","x":["첫 문장을 읽으면 기분이 가라앉는다.","내 행동 대부분이 수십 년 전 설정대로 돌아간다니.","글쓴이는 독자가 이렇게 느낄 걸 안다.","그래서 바로 \"절망할 필요는 없다\"고 말한다.","need not be(~일 필요는 없다) 뒤에는 독자가 느낄 법한 나쁜 감정이 와야 한다."]},{"t":"p","h":"reassuring(안심시키는)을 넣으면","x":["\"안심되는 생각일 필요는 없다.\"","그러고 나서 바로 \"설계의 승리\"라고 칭찬한다.","안심할 필요 없다더니 안심시키는 말을 하는 꼴이다."]}],"post":["hopeless(절망적인) ↔ reassuring(안심시키는)","옛 설정대로 사는 삶 = 절망할 일 아님"]},{"slots":[["laid_down","established","s"],["consciously"],["deliberate","automatic","a"],["outcompeted","outperformed","s"],["central"]],"opts":["deliberate","instinctive","reflexive","impulsive"],"or":["deliberate(신중한): 하나하나 따져서 정하는 마음이라 '너무 느리고 비싸다'는 설명과 맞음.","instinctive(본능적인): 본능은 빠르게 반응하므로 '너무 느리다'와 부딪침.","reflexive(반사적인): 반사 작용은 생각 없이 즉시 일어나서 느리다는 말과 맞지 않음.","impulsive(충동적인): 충동은 따지지 않고 바로 움직이는 것이라 느리고 비싸다는 단점과 안 맞음."],"om":["신중한","본능적인","반사적인","충동적인"],"en":"the deliberate mind is far too slow and too costly to run a whole life in real time","ko":"신중하게 따지는 마음은 삶 전체를 실시간으로 운영하기엔 너무 느리고 비용이 너무 크다","hl":["the deliberate mind","far too slow"],"khl":["신중하게 따지는 마음","너무 느리고"],"blocks":[{"t":"pair","h":"글에 나오는 두 가지 마음","x":[["the deliberate mind","하나하나 따지는 마음 (느리고 비쌈)"],["the automation","저절로 돌아가는 자동화 (빠르고 쌈)"]]},{"t":"p","h":"automatic(자동의)이 틀린 이유","x":["\"자동으로 돌아가는 마음은 너무 느리다\"가 된다.","그런데 글은 자동화가 바로 해결책이라고 말한다.","느리고 비싼 쪽은 앞 문장의 consciously decide(의식적으로 결정하다) 쪽이다.","deliberate(신중한)는 그 의식적인 마음을 다시 부른 말이다."]},{"t":"p","h":"고치지 않는 두 단어","x":["established(정해진)는 laid down(정해진) 자리에 그대로 들어간다.","outperformed(밀려난)도 outcompeted(경쟁에서 밀려난)와 같은 방향이다.","따지는 생명체가 그러지 않는 생명체에게 진다는 뜻은 그대로다."]}],"post":["deliberate(신중한) ↔ automatic(자동의)","따지는 마음 = 느림, 자동화 = 해결책"]},{"slots":[["hopeless"],["slow","quick","a"],["costly"],["frees","liberates","s"],["flaw"]],"opts":["slow","rapid","swift","nimble"],"or":["slow(느린): 걸음마다 생각하면 침대에서도 못 나온다는 앞 내용과 이어져 맞음.","rapid(빠른): 빠르다면 삶 전체를 실시간으로 돌리지 못할 이유가 없음.","swift(신속한): 신속하다면 too ~ to(너무 ~해서 …할 수 없다)의 단점 자리에 맞지 않음.","nimble(민첩한): 민첩한 마음은 장점이라 다른 생명체에게 밀려난다는 결과와 부딪침."],"om":["느린","빠른","신속한","민첩한"],"en":"the deliberate mind is far too slow and too costly to run a whole life in real time, and any creature that tried would be outcompeted by a creature that didn't.","ko":"신중하게 따지는 마음은 삶 전체를 실시간으로 운영하기엔 너무 느리고 비용이 너무 크며, 그렇게 하려는 생명체는 그러지 않는 생명체에게 경쟁에서 밀려날 것이다.","hl":["far too slow","in real time"],"khl":["너무 느리고","실시간으로"],"blocks":[{"t":"tap","h":"질문 하나","q":"발걸음 하나를 정하는 데 1분이 걸린다면?","a":["학교 가는 길에만 몇 시간이 걸린다.","in real time(실시간으로)은 일이 벌어지는 속도 그대로 따라가야 한다는 뜻이다.","따지는 마음은 그 속도를 못 따라간다.","그래서 too slow(너무 느린)."]},{"t":"p","h":"quick(빠른)이 틀린 이유","x":["\"너무 빨라서 삶을 실시간으로 못 돌린다\"는 말이 안 된다.","빠르면 실시간에 오히려 유리하다.","게다가 그 생명체가 경쟁에서 밀려난다는 결과와도 맞지 않는다."]},{"t":"p","h":"함정","x":["liberates(자유롭게 하다)는 frees(풀어 주다)와 같은 뜻이다.","선장을 풀어 준다는 방향이 그대로라 맞는 표현."]}],"post":["slow(느린) ↔ quick(빠른)","걸음마다 생각하기 = 실시간을 못 따라감"]},{"slots":[["overwhelming"],["deliberate"],["automation"],["central"],["affordable","unmanageable","a"]],"opts":["affordable","impossible","unbearable","exhausting"],"or":["affordable(감당할 수 있는): 앞에서 신중한 마음은 too costly(너무 비싼)라 했고, 자동화가 그 비용을 감당하게 해 준다는 돈 비유라 맞음.","impossible(불가능한): 핵심 특징이 삶을 불가능하게 만든다는 말이 되어 칭찬과 정반대임.","unbearable(견딜 수 없는): 견딜 수 없게 만든다면 결함이 아니라는 바로 앞 문장과 부딪침.","exhausting(지치게 하는): 지치게 만드는 건 의식적으로 다 정할 때의 모습이라 자동화의 효과가 아님."],"om":["감당할 수 있는","불가능한","견딜 수 없는","지치게 하는"],"en":"the deliberate mind is far too slow and too costly to run a whole life in real time … It is arguably the central feature, the thing that makes a complex life affordable at all.","ko":"신중하게 따지는 마음은 삶 전체를 실시간으로 운영하기엔 너무 느리고 비용이 너무 크다 … 그것은 아마도 핵심 특징, 즉 복잡한 삶을 애초에 감당할 수 있게 만드는 바로 그것이다.","hl":["makes a complex life affordable","too costly"],"khl":["감당할 수 있게 만드는","비용이 너무 크다"],"blocks":[{"t":"pair","h":"돈 비유로 이어지는 두 단어","x":[["too costly","비용이 너무 크다 (의식적인 마음)"],["affordable","감당할 수 있다 (자동화 덕분)"]]},{"t":"p","h":"unmanageable(감당할 수 없는)을 넣으면","x":["\"기본 설정은 복잡한 삶을 감당할 수 없게 만든다.\"","바로 앞에서 결함이 아니라 핵심 특징이라 했다.","칭찬하다가 갑자기 탓하는 꼴이다.","생각에도 비용이 든다. 자동화는 그 비용을 낮춰 삶을 굴러가게 한다."]}],"post":["affordable(감당할 수 있는) ↔ unmanageable(감당할 수 없는)","생각 = 비싼 비용, 자동화 = 그 비용을 감당하게 함"]},{"slots":[["rarely","seldom","s"],["consciously"],["frees","forbids","a"],["flaw","defect","s"],["complex"]],"opts":["frees","bans","restrains","discourages"],"or":["frees(풀어 주다): 자동화가 잔일을 맡아 주니 선장이 필요한 때 갑판에 올라올 수 있다는 그림이라 맞음.","bans(금지하다): 자동화가 선장을 못 올라오게 막는다면 선장이 필요한 문제를 아무도 못 다룸.","restrains(제지하다): 선장을 붙잡아 둔다는 말이라 '정말 필요로 하는 문제'와 어긋남.","discourages(단념시키다): 올라오지 말라고 말린다는 뜻이 되어 자동화를 칭찬하는 흐름과 반대임."],"om":["풀어 주다","금지하다","제지하다","단념시키다"],"en":"The automation is precisely what frees the captain to come up on deck for the few problems that actually require him.","ko":"자동화야말로 선장이 자신을 정말 필요로 하는 몇 안 되는 문제를 위해 갑판 위로 올라올 수 있게 풀어 주는 것이다.","hl":["frees the captain to come up on deck","actually require him"],"khl":["갑판 위로 올라올 수 있게 풀어 주는","정말 필요로 하는"],"blocks":[{"t":"pair","h":"선장 비유 풀기","x":[["the captain","선장 = 의식적으로 따지는 마음"],["on deck","갑판 위 = 판단이 필요한 자리"],["the automation","자동화 = 습관처럼 돌아가는 기본 설정"]]},{"t":"p","h":"forbids(금지하다)가 틀린 이유","x":["\"자동화가 선장이 갑판에 올라오는 것을 막는다.\"","그러면 정말 선장이 필요한 문제는 누가 해결할까?","글은 자동화를 좋게 말하는 중이다.","잔일을 대신 맡아 선장을 '풀어 주는' 쪽이어야 한다."]},{"t":"p","h":"그대로 두는 두 단어","x":["seldom(좀처럼 ~않게)은 rarely(거의 ~않게)와 같은 뜻이다.","defect(결함)는 flaw(결함)와 같은 뜻이다.","철자가 낯설어도 뜻이 같으면 맞는 문장."]}],"post":["free(풀어 주다) ↔ forbid(금지하다)","자동화가 잔일 담당 → 선장은 꼭 필요한 일만"]}],"quiz":[{"w":"hopeless","m":"절망적인, 가망 없는","it":[["wooden","나무로 된","n"],["despairing","절망한","s"],["hopeful","희망에 찬","a"],["punctual","시간을 잘 지키는","n"],["bleak","암울한","s"],["optimistic","낙관적인","a"],["noisy","시끄러운","n"]]},{"w":"deliberate","m":"신중한, 숙고하는","it":[["intentional","의도적인","s"],["rural","시골의","n"],["impulsive","충동적인","a"],["calculated","계산된, 신중히 계획된","s"],["sincere","진실한","n"],["spontaneous","즉흥적인","a"],["annual","해마다의","n"]]},{"w":"slow","m":"느린","it":[["fast","빠른","a"],["sluggish","굼뜬","s"],["humble","겸손한","n"],["rapid","빠른","a"],["leisurely","느긋한","s"],["brave","용감한","n"],["curious","호기심 많은","n"]]},{"w":"affordable","m":"감당할 수 있는, (비용이) 감당 가능한","it":[["inexpensive","비싸지 않은","s"],["loyal","충실한","n"],["unaffordable","감당할 수 없는","a"],["reasonable","(값이) 적당한","s"],["silent","조용한","n"],["overpriced","너무 비싼","a"],["distant","먼","n"]]},{"w":"free","m":"자유롭게 하다, 풀어 주다","it":[["borrow","빌리다","n"],["liberate","해방하다","s"],["confine","가두다","a"],["whisper","속삭이다","n"],["release","풀어 주다","s"],["restrain","제지하다","a"],["decorate","장식하다","n"]]}]}],"no":"31"},{"id":"2610g2-32","title":"어휘특훈 · 26년 10월 고2 32번","sub":"정의는 광장이 아니라 법정에서","tpl":"If we understand mass culture as a {weakening} factor of the cultural {ties} that {unite} people to their {traditions}, mass culture {weakens} the {intermediary} institutions in society (e.g. the family or the school), {diminishing} their role and overlapping these institutions. For example, courts are {traditional} social institutions and {important} for the normal and {harmonious} functioning of {collective} life. However, when people turn to social networks to put pressure on {judicial} decisions in certain mediated and politicized processes, this practice is {popularized} and becomes a {habitual} form of culture, which is {harmful}. Justice must not be done in the public square, which today is converted into a {virtual} dimension, the social networks. In a democratic state of law, the {appropriate} place to judge and make justice is the court and in a way that is {immune} to popular pressure.","fn":["*mediated: (미디어를) 거쳐 전해진","*politicized: 정치화된","*overlap: 겹치다","*state of law: 법치 국가"],"mean":{"weakening":"동사 weaken(약화시키다)의 -ing형. 약화시키는","strengthening":"동사 strengthen(강화하다)의 -ing형. 강화하는","ties":"명사 tie(유대, 끈)의 복수형","bonds":"명사 bond(유대, 결속)의 복수형","divisions":"명사 division(분열, 갈라짐)의 복수형","unite":"결속시키다, 하나로 묶다","bind":"묶다, 결속시키다","alienate":"멀어지게 하다, 소외시키다","traditions":"명사 tradition(전통)의 복수형","weakens":"동사 weaken(약화시키다)의 3인칭 단수 현재형","undermines":"동사 undermine(약화시키다, 서서히 무너뜨리다)의 3인칭 단수 현재형","intermediary":"중간에서 매개하는","mediating":"동사 mediate( s"],["urgent","긴급한","n"],["inappropriate","부적절한","a"],["proper","적절한","s"],["noisy","시끄러운","n"],["unsuitable","부적합한","a"],["ancient","고대의","n"]]}]}],"no":"32"},{"id":"2610g2-33","title":"어휘특훈 · 26년 10월 고2 33번","sub":"평생 이어지는 발달, 가소성","tpl":"Human development is now increasingly understood as an {ongoing}, {flexible}, and {evolving} process rather than a {fixed} sequence of stages. At the core of this perspective lies the concept of plasticity. Plasticity refers to the human {capacity} to change, {adapt}, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It {highlights} that individuals are not merely {passive} recipients of development but {active} agents capable of growth throughout their lives. In earlier views, development was believed to occur {mainly} during childhood, with adulthood seen as a period of {stability} and old age as a phase of {decline}. The concept of plasticity {challenges} this {rigid} outlook by emphasizing that development {continues} across the {entire} lifespan. Although the extent of change may {vary} at different stages, every phase of life {allows} room for adaptation and transformation.","fn":["*plasticity: 가소성(경험에 따라 바뀔 수 있는 성질)","*recipient: 받는 사람, 수용자","*lifespan: 수명, 일생"],"mean":{"ongoing":"계속 진행 중인","flexible":"유연한","inflexible":"유연하지 않은, 융통성 없는","adaptable":"적응력 있는, 융통성 있는","evolving":"동사 evolve(서서히 발전하다)의 -ing형, 발전해 가는","static":"정적인, 변화가 없는","developing":"동사 develop(발달하다)의 -ing형, 발달해 가는","fixed":"고정된, 정해진","fluid":"유동적인, 잘 바뀌는","set":"정해진, 고정된","capacity":"능력, 역량","inability":"할 수 없음, 무능력","adapt":"적응하다, (상황에) 맞추다","adjust":"조정하다, 적응하다","highlights":"동사 highlight(강조하다)의 3인칭 단수 현재형","stresses":"동사 stress(강조하다)의 3인칭 단수 현재형","passive":"수동적인","dynamic":"역동적인, 활발한","active":"능동적인, 적극적인","helpless":"무력한, 스스로 어쩔 수 없는","mainly":"주로","rarely":"좀처럼 ~않는, 드물게","chiefly":"주로","stability":"안정","instability":"불안정","decline":"쇠퇴, 감소","progress":"진보, 발전","deterioration":"악화, 쇠퇴","challenges":"동사 challenge(이의를 제기하다)의 3인칭 단수 현재형","reinforces":"동사 reinforce(강화하다)의 3인칭 단수 현재형","questions":"동사 question(의문을 제기하다)의 3인칭 단수 현재형","rigid":"경직된, 융통성 없는","narrow":"편협한, 좁은","continues":"동사 continue(계속되다)의 3인칭 단수 현재형","persists":"동사 persist(지속되다)의 3인칭 단수 현재형","stops":"동사 stop(멈추다)의 3인칭 단수 현재형","entire":"전체의","whole":"전체의, 온","vary":"서로 다르다, 달라지다","differ":"다르다","allows":"동사 allow(허용하다)의 3인칭 단수 현재형","denies":"동사 deny(주지 않다, 거부하다)의 3인칭 단수 현재형"},"comp":[{"no":"33","slots":[["ongoing"],["evolving"],["fixed","fluid","a"],["adapt"],["highlights"]],"opts":["fixed","loose","random","variable"],"or":["fixed(고정된): rather than(~라기보다) 앞의 flexible(유연한), evolving(발전해 가는)과 정반대 짝이 되어 맞음.","loose(느슨한): 느슨한 순서는 유연하다는 쪽이라 rather than(~라기보다)이 만드는 대조가 사라짐.","random(무작위의): 옛 관점은 아동기 → 성인기 → 노년기로 정해진 순서였지 무작위 순서가 아니었음.","variable(변하기 쉬운): 변하기 쉽다는 건 flexible(유연한)과 같은 편이라 대조가 깨짐."],"om":["고정된","느슨한","무작위의","변하기 쉬운"],"en":"Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.","ko":"인간 발달은 이제 고정된 순서의 단계들이라기보다 계속 진행 중이고, 유연하며, 발전해 가는 과정으로 점점 더 이해되고 있다.","hl":["rather than a fixed sequence","flexible, and evolving"],"khl":["고정된 순서의 단계들이라기보다","유연하며, 발전해 가는"],"blocks":[{"t":"pair","h":"rather than(~라기보다) 양쪽 저울","x":[["an ongoing, flexible, and evolving process","계속되고, 유연하고, 발전해 가는 과정 (새 관점)"],["a fixed sequence of stages","고정된 순서의 단계들 (옛 관점)"]]},{"t":"p","h":"fluid(유동적인)를 넣으면","x":["rather than(~라기보다)은 양쪽을 반대로 세우는 말이다.","왼쪽이 유연하면 오른쪽은 굳어 있어야 한다.","fluid(유동적인)는 왼쪽 flexible(유연한)과 같은 편이다.","\"유연한 과정이지, 유동적인 단계는 아니다\"가 되어 말이 안 된다."]}],"post":["fixed(고정된) ↔ fluid(유동적인)","옛 관점 = 정해진 순서의 단계"]},{"no":"33","slots":[["passive"],["active","helpless","a"],["decline"],["rigid","narrow","s"],["vary"]],"opts":["active","reluctant","fragile","timid"],"or":["active(능동적인): 바로 뒤 capable of growth(성장할 수 있는)와 함께 스스로 크는 주체를 그려 맞음.","reluctant(마지못해 하는): 성장을 꺼리는 주체라면 평생 성장할 수 있다는 강조가 힘을 잃음.","fragile(연약한): 연약한 주체는 passive(수동적인)와 대비되지 않아 not A but B(A가 아니라 B) 구조가 무너짐.","timid(소심한): 소심함은 성격 얘기라 '받기만 하는 존재 ↔ 스스로 움직이는 존재' 대비와 안 맞음."],"om":["능동적인","마지못해 하는","연약한","소심한"],"en":"It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.","ko":"그것은 개인이 단지 발달의 수동적인 수용자가 아니라 평생에 걸쳐 성장할 수 있는 능동적인 주체라는 점을 강조한다.","hl":["active agents capable of growth","not merely passive recipients"],"khl":["성장할 수 있는 능동적인 주체","단지 발달의 수동적인 수용자가 아니라"],"blocks":[{"t":"p","h":"한 문장 안에서 부딪치는 말","x":["helpless(무력한)를 넣으면 \"무력한 주체\"가 된다.","그런데 바로 뒤에 capable of growth(성장할 수 있는)가 붙어 있다.","무력한데 성장할 수 있다는 건 앞뒤가 맞지 않는다.","게다가 not merely A but B(단지 A가 아니라 B)에서 B는 A보다 한 걸음 나아간 말이어야 한다.","수동적인 것보다 더 약한 무력함은 거꾸로 간 것이다."]},{"t":"p","h":"그대로 둘 단어","x":["narrow(편협한)는 rigid(경직된) 자리에 들어가도 된다.","옛 관점은 발달을 아동기에만 가둔 좁은 시각이었다.","\"좁은 관점\"도 \"굳은 관점\"도 그 옛 시각을 그대로 가리킨다."]}],"post":["active(능동적인) ↔ helpless(무력한)","사람 = 받기만 하는 존재 X, 스스로 크는 주체"]}],"compquiz":[{"w":"fixed","m":"고정된, 정해진","it":[["sticky","끈적끈적한","n"],["unchanging","변하지 않는","s"],["variable","변하기 쉬운","a"],["rural","시골의","n"],["invariable","변함없는","s"],["changeable","바뀔 수 있는","a"],["hollow","속이 빈","n"]]},{"w":"active","m":"능동적인, 적극적인","it":[["energetic","활기찬","s"],["wooden","나무로 된","n"],["passive","수동적인","a"],["spicy","매운","n"],["dynamic","역동적인","s"],["inactive","활동하지 않는","a"],["rural","시골의","n"]]}],"sets":[{"items":[{"slots":[["ongoing"],["flexible","inflexible","a"],["evolving"],["fixed"],["capacity"]],"opts":["flexible","permanent","brittle","uniform"],"or":["flexible(유연한): ongoing(계속되는), evolving(발전해 가는)과 같이 '계속 바뀌는' 쪽에 서서 맞음.","permanent(영구적인): 영구적이라는 건 안 바뀐다는 말이라 evolving(발전해 가는)과 나란히 설 수 없음.","brittle(잘 부서지는): 잘 부서진다는 건 약하다는 뜻이지 바뀔 수 있다는 뜻이 아님.","uniform(획일적인): 모두 똑같다는 말이라 사람마다 다르게 바뀐다는 가소성과 안 맞음."],"om":["유연한","영구적인","잘 부서지는","획일적인"],"en":"Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.","ko":"인간 발달은 이제 고정된 순서의 단계들이라기보다 계속 진행 중이고, 유연하며, 발전해 가는 과정으로 점점 더 이해되고 있다.","hl":["flexible","an ongoing","evolving process"],"khl":["유연하며","계속 진행 중이고"],"blocks":[{"t":"flow","h":"글이 걸어가는 길","x":["새 관점: 발달은 계속되는 유연한 과정","핵심 개념: 가소성 = 바뀌고 적응하는 능력","사람 = 스스로 크는 주체","옛 관점: 아동기에만 발달, 노년엔 쇠퇴","결론: 모든 시기에 변화의 여지"],"at":0},{"t":"p","h":"세 단어는 한 팀","x":["ongoing(계속되는), flexible(유연한), evolving(발전해 가는)이 and(그리고)로 묶여 있다.","셋 다 \"멈추지 않고 바뀐다\"는 쪽이다.","inflexible(융통성 없는)을 넣으면 팀 안에 혼자 반대쪽 선수가 생긴다.","게다가 그 말은 오른쪽 a fixed sequence(고정된 순서)와 같은 편이 된다."]}],"post":["flexible(유연한) ↔ inflexible(융통성 없는)","새 관점의 발달 = 계속, 유연, 발전"]},{"slots":[["fixed"],["capacity","inability","a"],["adapt","adjust","s"],["highlights","stresses","s"],["passive"]],"opts":["capacity","reluctance","refusal","failure"],"or":["capacity(능력): 바꾸고 적응하고 재구성할 '수 있다'는 가소성의 정의라 맞음.","reluctance(꺼림): 바뀌기를 꺼리는 마음이 되어 다음 문장의 capable of growth(성장할 수 있는)와 반대임.","refusal(거부): 변화를 거부한다면 '변할 수 있는 성질'이라는 가소성의 뜻이 사라짐.","failure(실패): 바꾸는 데 실패하는 것이라 평생 성장한다는 글 전체 주장과 부딪침."],"om":["능력","꺼림","거부","실패"],"en":"Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes.","ko":"가소성은 삶의 경험, 환경의 요구, 생물학적 변화에 반응하여 인지적·정서적·행동적 패턴을 바꾸고, 적응시키고, 재구성하는 인간의 능력을 말한다.","hl":["the human capacity to change","Plasticity refers to"],"khl":["인간의 능력","가소성은"],"blocks":[{"t":"p","h":"정의 문장은 개념 그 자체","x":["refers to(~을 가리키다)는 뜻풀이를 시작하는 말이다.","가소성(plasticity = 바뀔 수 있는 성질)이라는 이름 자체가 \"바뀔 수 있다\"다.","inability(할 수 없음)를 넣으면 \"바꿀 수 없는 인간의 무능력\"이 가소성의 뜻이 된다.","개념 이름과 뜻풀이가 정반대로 간다."]},{"t":"p","h":"바뀐 단어 셋 중 둘은 무사","x":["adjust(조정하다, 적응하다)는 adapt(적응하다) 자리에 그대로 들어간다.","stresses(강조하다)는 highlights(강조하다)와 같은 말이다.","철자가 낯설다고 고치면 본문 철자만 외운 것이다."]}],"post":["capacity(능력) ↔ inability(할 수 없음)","가소성 = 바꾸고 적응할 수 있는 능력"]},{"slots":[["active"],["mainly","rarely","a"],["stability"],["decline","deterioration","s"],["challenges"]],"opts":["mainly","seldom","barely","hardly"],"or":["mainly(주로): 옛 관점은 발달을 아동기에 몰아넣었으므로 '주로 아동기에'가 맞음.","seldom(좀처럼 ~않는): 아동기에 발달이 거의 없다면 성인기·노년기에도 없으니 발달이 일어날 시기가 사라짐.","barely(간신히, 거의 ~않게): 아동기에 거의 발달하지 않는다는 말이라 옛 관점의 핵심과 정반대임.","hardly(거의 ~않는): seldom(좀처럼 ~않는)과 같은 문제로 발달이 언제 일어나는지 아무 데도 남지 않음."],"om":["주로","좀처럼 ~않는","간신히, 거의 ~않게","거의 ~않는"],"en":"In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.","ko":"이전의 관점에서는 발달이 주로 아동기에 일어난다고 여겨졌고, 성인기는 안정의 시기로, 노년기는 쇠퇴의 단계로 간주되었다.","hl":["occur mainly during childhood","a period of stability"],"khl":["주로 아동기에 일어난다고","안정의 시기로"],"blocks":[{"t":"pair","h":"옛 관점의 인생 시간표","x":[["childhood","아동기: 발달하는 시기"],["adulthood","성인기: 안정, 더 안 변함"],["old age","노년기: 쇠퇴, 내려가기만 함"]]},{"t":"p","h":"rarely(드물게)를 넣고 다시 읽기","x":["\"발달은 아동기에 드물게 일어난다\"가 된다.","그런데 성인기는 안정, 노년기는 쇠퇴다.","그러면 발달이 일어나는 시기가 인생 어디에도 없다.","옛 관점은 발달을 아동기에 몰아넣은 것이지 없앤 것이 아니다."]},{"t":"p","h":"함정","x":["deterioration(악화, 쇠퇴)은 decline(쇠퇴) 자리에 그대로 둔다.","노년기를 내리막으로 본 옛 관점이 그대로 살아 있다."]}],"post":["mainly(주로) ↔ rarely(드물게)","옛 관점 = 발달은 아동기에 집중"]},{"slots":[["stability"],["decline"],["challenges","reinforces","a"],["rigid"],["continues"]],"opts":["challenges","confirms","supports","justifies"],"or":["challenges(이의를 제기하다): 옛 관점을 rigid(경직된)라고 낮춰 부르며 반대 주장을 펴는 흐름이라 맞음.","confirms(확인해 주다): 옛 관점이 옳다고 확인해 준다면 '평생 발달'이라는 반대 근거를 댈 이유가 없음.","supports(지지하다): '발달은 평생 계속된다'는 근거로 '아동기에만 발달'을 지지할 수는 없음.","justifies(정당화하다): 필자가 rigid(경직된)라고 깎아내린 관점을 정당화한다는 건 말투와 정반대임."],"om":["이의를 제기하다","확인해 주다","지지하다","정당화하다"],"en":"The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.","ko":"가소성 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이 경직된 관점에 이의를 제기한다.","hl":["challenges this rigid outlook","development continues across the entire lifespan"],"khl":["이 경직된 관점에 이의를 제기한다","전 생애에 걸쳐 계속된다는"],"blocks":[{"t":"tap","h":"질문 하나","q":"\"평생 발달한다\"는 말이 \"아동기에만 발달한다\"를 도와줄까, 깨뜨릴까?","a":["깨뜨린다.","두 주장은 정반대다.","그래서 가소성은 옛 관점을 reinforce(강화하다)할 수 없고 challenge(이의를 제기하다)할 수밖에 없다."]},{"t":"p","h":"필자의 말투가 이미 답","x":["필자는 옛 관점을 this rigid outlook(이 경직된 관점)이라고 부른다.","좋게 보는 관점에 '경직된'이라는 말을 붙이지는 않는다.","깎아내린 관점을 바로 이어서 강화해 준다는 건 앞뒤가 맞지 않는다."]}],"post":["challenge(이의를 제기하다) ↔ reinforce(강화하다)","가소성과 옛 관점 = 정면 충돌"]},{"slots":[["rigid"],["continues","persists","s"],["entire"],["vary","differ","s"],["allows","denies","a"]],"opts":["allows","removes","blocks","limits"],"or":["allows(허용하다): Although(비록 ~지만)가 '정도는 달라도 여지는 있다'로 이어지는 문장이라 맞음.","removes(없애다): 모든 시기가 변화의 여지를 없앤다면 앞에서 말한 평생 발달이 무너짐.","blocks(막다): 적응과 변화를 막는다는 건 가소성의 정의와 정반대임.","limits(제한하다): '정도는 달라도'와 같은 쪽 말이라 Although(비록 ~지만)의 뒤집기가 생기지 않음."],"om":["허용하다","없애다","막다","제한하다"],"en":"Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.","ko":"변화의 정도는 단계마다 다를 수 있지만, 삶의 모든 단계는 적응과 변화의 여지를 허용한다.","hl":["every phase of life allows room","Although the extent of change may vary"],"khl":["삶의 모든 단계는","변화의 정도는 단계마다 다를 수 있지만"],"blocks":[{"t":"p","h":"Although(비록 ~지만)가 정하는 방향","x":["앞: 변화의 정도는 시기마다 다를 수 있다. (살짝 물러서기)","뒤: 그래도 모든 시기에 변화의 여지가 있다. (진짜 주장)","denies(주지 않다)를 넣으면 뒤도 물러서는 말이 된다.","Although(비록 ~지만) 앞뒤가 같은 방향이면 이 접속사를 쓸 이유가 없다.","더구나 바로 앞 문장의 development continues(발달은 계속된다)와도 부딪친다."]},{"t":"p","h":"고치지 않아도 되는 두 곳","x":["persists(지속되다)는 continues(계속되다)와 같은 뜻이다.","differ(다르다)는 vary(서로 다르다)와 같은 뜻이다.","둘 다 문장의 방향을 바꾸지 않는다."]}],"post":["allow(허용하다) ↔ deny(주지 않다)","어느 나이든 변화의 여지 있음"]}],"quiz":[{"w":"flexible","m":"유연한","it":[["ancient","고대의","n"],["adaptable","적응력 있는","s"],["rigid","경직된","a"],["noisy","시끄러운","n"],["pliable","유연한, 잘 휘는","s"],["inflexible","융통성 없는","a"],["sour","신","n"]]},{"w":"capacity","m":"능력, 역량","it":[["ability","능력","s"],["festival","축제","n"],["inability","할 수 없음","a"],["receipt","영수증","n"],["capability","능력","s"],["incapacity","무능력","a"],["ladder","사다리","n"]]},{"w":"mainly","m":"주로","it":[["chiefly","주로","s"],["loudly","큰 소리로","n"],["secondarily","부차적으로","a"],["primarily","주로","s"],["politely","공손하게","n"],["minimally","아주 조금","a"],["safely","안전하게","n"]]},{"w":"challenge","m":"이의를 제기하다","it":[["borrow","빌리다","n"],["dispute","반박하다","s"],["accept","받아들이다","a"],["whisper","속삭이다","n"],["question","의문을 제기하다","s"],["endorse","지지하다","a"],["bake","굽다","n"]]},{"w":"allow","m":"허용하다","it":[["permit","허락하다","s"],["polish","닦다","n"],["forbid","금지하다","a"],["sneeze","재채기하다","n"],["let","~하게 하다, 허락하다","s"],["prohibit","금지하다","a"],["chop","썰다","n"]]}]},{"items":[{"slots":[["ongoing"],["flexible","adaptable","s"],["evolving","static","a"],["fixed","set","s"],["capacity"]],"opts":["evolving","stagnating","fading","shrinking"],"or":["evolving(발전해 가는): ongoing(계속되는), flexible(유연한)과 함께 계속 자라는 과정을 그려 맞음.","stagnating(정체된): 멈춰 고인 과정은 ongoing(계속 진행 중인)과 정면으로 부딪침.","fading(희미해지는): 점점 사라지는 과정이라 평생 성장한다는 글의 주장과 반대임.","shrinking(줄어드는): 줄어드는 과정은 옛 관점의 노년기 decline(쇠퇴) 쪽 그림임."],"om":["발전해 가는","정체된","희미해지는","줄어드는"],"en":"Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.","ko":"인간 발달은 이제 고정된 순서의 단계들이라기보다 계속 진행 중이고, 유연하며, 발전해 가는 과정으로 점점 더 이해되고 있다.","hl":["evolving process","rather than a fixed sequence"],"khl":["발전해 가는 과정","고정된 순서의 단계들이라기보다"],"blocks":[{"t":"p","h":"static(정적인)을 넣고 읽어 보기","x":["\"계속 진행 중이고, 유연하고, 정적인 과정\"이 된다.","계속 진행되는데 정적이다? 한 줄 안에서 이미 모순이다.","정적인 쪽은 오히려 rather than(~라기보다) 뒤의 옛 관점에 어울린다.","새 관점 칸에 옛 관점 단어가 잘못 들어간 셈."]},{"t":"p","h":"함정 둘","x":["adaptable(적응력 있는)은 flexible(유연한)과 같은 쪽 말이다.","set(정해진)은 fixed(고정된)와 같은 뜻이다.","a set sequence(정해진 순서)도 자연스러운 표현이라 그대로 둔다."]}],"post":["evolving(발전해 가는) ↔ static(정적인)","발달 = 멈추지 않고 자라는 과정"]},{"slots":[["adapt"],["highlights"],["passive","dynamic","a"],["active"],["mainly"]],"opts":["passive","eager","creative","independent"],"or":["passive(수동적인): but(그러나) 뒤 active(능동적인)와 정반대 짝을 이뤄 맞음.","eager(열렬한): 열렬한 수용자는 active(능동적인)와 같은 편이라 not A but B(A가 아니라 B) 대비가 사라짐.","creative(창의적인): 창의적인 존재는 이미 스스로 움직이는 쪽이라 부정할 대상이 되지 않음.","independent(독립적인): 독립적인 존재는 active agents(능동적인 주체)와 거의 같은 말이라 대비가 안 됨."],"om":["수동적인","열렬한","창의적인","독립적인"],"en":"It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.","ko":"그것은 개인이 단지 발달의 수동적인 수용자가 아니라 평생에 걸쳐 성장할 수 있는 능동적인 주체라는 점을 강조한다.","hl":["not merely passive recipients","active agents"],"khl":["단지 발달의 수동적인 수용자가 아니라","능동적인 주체"],"blocks":[{"t":"p","h":"not merely A but B(단지 A가 아니라 B)","x":["A와 B는 서로 반대 방향이어야 이 구조가 산다.","B 자리는 active agents(능동적인 주체)다.","그러면 A 자리는 받기만 하는 쪽, 곧 passive(수동적인)여야 한다.","dynamic(역동적인)을 넣으면 \"역동적인 수용자가 아니라 능동적인 주체\"가 된다.","둘 다 힘차게 움직이는 쪽이라 무엇을 부정하는지 알 수 없다."]},{"t":"p","h":"recipient(받는 사람)라는 단어도 힌트","x":["recipient(수용자)는 주는 걸 받는 사람이다.","받기만 하는 사람에 어울리는 말은 수동적인 쪽이다.","역동적인 수용자라는 말은 그 자체로 어색하다."]}],"post":["passive(수동적인) ↔ dynamic(역동적인)","발달을 받기만 하는 사람 X, 스스로 만드는 사람"]},{"slots":[["passive"],["mainly","chiefly","s"],["stability","instability","a"],["decline"],["rigid"]],"opts":["stability","turmoil","expansion","crisis"],"or":["stability(안정): 발달이 아동기에 끝났다고 보니 성인기는 더 안 변하는 시기라 맞음.","turmoil(혼란): 크게 요동치는 시기라면 '발달은 주로 아동기'라는 옛 관점과 부딪침.","expansion(확장): 성인기에 계속 넓어진다면 이미 평생 발달을 인정한 셈이라 옛 관점이 아님.","crisis(위기): 위기는 큰 변화의 순간이라 '더 안 변한다'는 옛 관점의 성인기와 안 맞음."],"om":["안정","혼란","확장","위기"],"en":"In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.","ko":"이전의 관점에서는 발달이 주로 아동기에 일어난다고 여겨졌고, 성인기는 안정의 시기로, 노년기는 쇠퇴의 단계로 간주되었다.","hl":["adulthood seen as a period of stability","mainly during childhood"],"khl":["성인기는 안정의 시기로","주로 아동기에"],"blocks":[{"t":"flow","h":"옛 관점의 인생 그래프","x":["아동기: 쑥쑥 올라감 (발달)","성인기: 평평함 (안정)","노년기: 내려감 (쇠퇴)"],"at":1},{"t":"p","h":"원인과 결과","x":["원인: 발달은 주로 아동기에 끝난다고 봤다.","결과: 그다음 성인기는 더 안 바뀌는 평평한 구간이 된다.","instability(불안정)를 넣으면 성인기에 계속 흔들리고 바뀐다는 말이 된다.","그건 옛 관점이 아니라 오히려 가소성 쪽 생각이다."]},{"t":"p","h":"그대로 둘 단어","x":["chiefly(주로)는 mainly(주로)와 같은 뜻이다."]}],"post":["stability(안정) ↔ instability(불안정)","옛 관점의 성인기 = 평평한 구간"]},{"slots":[["mainly"],["stability"],["decline","progress","a"],["challenges"],["entire"]],"opts":["decline","renewal","discovery","ambition"],"or":["decline(쇠퇴): 옛 관점은 노년기를 내리막으로 봤고, 가소성이 바로 그 생각을 반박하므로 맞음.","renewal(새로워짐): 노년기가 새로워지는 시기라면 이미 평생 발달을 인정한 것이라 반박할 이유가 없음.","discovery(발견): 노년을 발견의 단계로 보는 건 rigid(경직된) 관점이 아니라 열린 관점임.","ambition(야망): 야망은 시기의 성격을 나타내는 말이 아니라 '안정 → 쇠퇴' 흐름에 끼지 못함."],"om":["쇠퇴","새로워짐","발견","야망"],"en":"In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook","ko":"이전의 관점에서는 발달이 주로 아동기에 일어난다고 여겨졌고, 성인기는 안정의 시기로, 노년기는 쇠퇴의 단계로 간주되었다. 가소성 개념은 이 경직된 관점에 이의를 제기한다","hl":["old age as a phase of decline","challenges this rigid outlook"],"khl":["노년기는 쇠퇴의 단계로","이 경직된 관점에 이의를 제기한다"],"blocks":[{"t":"p","h":"반박당하는 쪽이 어떤 생각이어야 하나","x":["다음 문장에서 가소성은 이 관점에 이의를 제기한다.","가소성의 주장은 \"평생 계속 성장한다\"다.","그러니 옛 관점은 노년에 성장이 멈추고 내려간다고 봐야 반박이 성립한다.","progress(진보)를 넣으면 옛 관점도 노년의 성장을 인정한 셈이 된다.","같은 말을 하는 상대에게 이의를 제기할 수는 없다."]},{"t":"tap","h":"한 줄로 복원","q":"옛 관점의 인생을 세 단어로 줄이면?","a":["성장 → 멈춤 → 내리막.","마지막 칸이 decline(쇠퇴)이다."]}],"post":["decline(쇠퇴) ↔ progress(진보)","옛 관점의 노년 = 내리막"]},{"slots":[["challenges","questions","s"],["rigid"],["continues","stops","a"],["entire","whole","s"],["vary"]],"opts":["continues","pauses","ends","fails"],"or":["continues(계속되다): across the entire lifespan(전 생애에 걸쳐)과 짝을 이뤄 평생 발달을 말하므로 맞음.","pauses(잠시 멈추다): 잠시 멈춘다면 아동기 이후 멈춘다는 옛 관점 쪽으로 기울어 반박이 안 됨.","ends(끝나다): 발달이 끝난다는 건 옛 관점 그 자체라 가소성의 강조 내용이 될 수 없음.","fails(실패하다): 발달이 실패한다는 건 노년 쇠퇴 쪽 그림이라 가소성 주장과 정반대임."],"om":["계속되다","잠시 멈추다","끝나다","실패하다"],"en":"The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.","ko":"가소성 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이 경직된 관점에 이의를 제기한다.","hl":["development continues across the entire lifespan","by emphasizing"],"khl":["전 생애에 걸쳐 계속된다는","강조함으로써"],"blocks":[{"t":"p","h":"by -ing(~함으로써)는 반박의 무기","x":["가소성은 무엇을 무기로 옛 관점을 반박하나?","by emphasizing(강조함으로써) 뒤가 그 무기다.","옛 관점은 \"발달은 아동기에 끝난다\"였다.","그걸 깨는 무기는 \"발달은 평생 계속된다\"여야 한다.","stops(멈추다)를 넣으면 무기가 옛 관점 편을 들어 버린다."]},{"t":"p","h":"across the entire lifespan(전 생애에 걸쳐)과의 궁합","x":["\"전 생애에 걸쳐 멈춘다\"는 말 자체가 어색하다.","across(~에 걸쳐)는 쭉 이어지는 동사와 어울린다."]},{"t":"p","h":"함정","x":["questions(의문을 제기하다)는 challenges(이의를 제기하다) 자리에, whole(전체의)은 entire(전체의) 자리에 들어가도 뜻이 같다."]}],"post":["continue(계속되다) ↔ stop(멈추다)","가소성의 무기 = 평생 계속되는 발달"]}],"quiz":[{"w":"evolve","m":"서서히 발전하다","it":[["knit","뜨개질하다","n"],["develop","발달하다","s"],["stagnate","정체되다","a"],["bark","짖다","n"],["progress","나아가다, 발전하다","s"],["regress","퇴보하다","a"],["spill","엎지르다","n"]]},{"w":"passive","m":"수동적인","it":[["inactive","활동하지 않는","s"],["annual","해마다의","n"],["active","능동적인","a"],["foggy","안개 낀","n"],["submissive","순종적인","s"],["assertive","적극적인, 자기주장이 강한","a"],["salty","짠","n"]]},{"w":"stability","m":"안정","it":[["recipe","요리법","n"],["steadiness","꾸준함, 안정","s"],["instability","불안정","a"],["harbor","항구","n"],["balance","균형","s"],["volatility","변덕, 불안정","a"],["laundry","세탁물","n"]]},{"w":"decline","m":"쇠퇴, 감소","it":[["deterioration","악화","s"],["ceremony","의식, 행사","n"],["improvement","향상","a"],["puzzle","퍼즐","n"],["decay","쇠퇴, 부패","s"],["recovery","회복","a"],["orchard","과수원","n"]]},{"w":"continue","m":"계속되다","it":[["fold","접다","n"],["persist","지속되다","s"],["stop","멈추다","a"],["scream","비명을 지르다","n"],["last","지속되다","s"],["cease","그치다","a"],["rinse","헹구다","n"]]}]}],"no":"33"},{"id":"2610g2-34","title":"어휘특훈 · 26년 10월 고2 34번","sub":"연결될수록 커지는 실패의 위험","tpl":"Social media has {altered} business, politics, and friendships, making going viral a household term. The global financial industry links every bank and {countless} households in every country, making us {vulnerable} to human error taking place on the other side of the world. As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were {separate} and thereby {buffered} from the effects of errors outside their walls. That is no longer the case. The digitization of {massive} amounts of information has continued to grow {enormously} as the cost of computing power has {decreased}. The development of smart systems that communicate {autonomously} gave rise to an {infinite} variety of {potential} breakdowns. This {interdependence} is a breeding ground for {complex} failure. As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more {difficult} to {predict} what’s going to happen next.” Information technology creates new {vulnerabilities} because interconnectedness {instantly} {spreads} the impact of small failures.","fn":["*go viral: 입소문이 나다, 온라인에서 빠르게 퍼지다","*household term: 누구나 아는 말","*digitization: 디지털화","*breeding ground: 온상, 생겨나기 좋은 곳","*interconnectedness: 상호 연결성"],"mean":{"altered":"동사 alter(바꾸다)의 과거분사형","preserved":"동사 preserve(보존하다)의 과거분사형","transformed":"동사 transform(완전히 바꾸다)의 과거분사형","countless":"셀 수 없이 많은","few":"거의 없는, 소수의","numerous":"수많은","vulnerable":"취약한, 다치기 쉬운","immune":"면역이 있는, 영향을 받지 않는","separate":"분리된, 따로 떨어진","connected":"연결된","buffered":"동사 buffer(완충하다, 보호하다)의 과거분사형, 보호받는","shielded":"동사 shield(보호하다, 가리다)의 과거분사형, 보호받는","massive":"방대한, 거대한","tiny":"아주 작은","vast":"방대한, 막대한","enormously":"엄청나게","tremendously":"엄청나게","decreased":"동사 decrease(감소하다)의 과거분사형","increased":"동사 increase(증가하다)의 과거분사형","dropped":"동사 drop(떨어지다)의 과거분사형","autonomously":"자율적으로","independently":"독립적으로, 스스로","infinite":"무한한","endless":"끝없는","potential":"잠재적인, ~할 가능성이 있는","impossible":"불가능한","interdependence":"상호 의존","independence":"독립","interconnection":"상호 연결","complex":"복잡한, 복합적인","simple":"단순한","difficult":"어려운","straightforward":"간단한, 쉬운","challenging":"어려운, 힘든","predict":"예측하다","foresee":"예견하다, 미리 알다","vulnerabilities":"명사 vulnerability(취약성)의 복수형","safeguards":"명사 safeguard(안전장치)의 복수형","weaknesses":"명사 weakness(약점)의 복수형","instantly":"즉시","immediately":"즉시, 곧바로","spreads":"동사 spread(퍼뜨리다)의 3인칭 단수 현재형","contains":"동사 contain(억제하다, 막다)의 3인칭 단수 현재형"},"comp":[{"no":"34","slots":[["altered","transformed","s"],["countless","few","a"],["vulnerable"],["separate"],["buffered"]],"opts":["countless","wealthy","rural","isolated"],"or":["countless(셀 수 없이 많은): every bank(모든 은행), every country(모든 나라)와 함께 '전 세계가 다 묶였다'는 그림을 그려 맞음.","wealthy(부유한): 부자 가정만 연결된다면 '우리 모두'가 취약해진다는 말이 힘을 잃음.","rural(시골의): 시골 가정만 연결한다는 건 global(세계적인) 금융 산업 그림과 안 맞음.","isolated(고립된): 고립된 가정을 연결한다는 건 말 자체가 모순이고 글은 연결을 말하고 있음."],"om":["셀 수 없이 많은","부유한","시골의","고립된"],"en":"The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.","ko":"세계 금융 산업은 모든 나라의 모든 은행과 수많은 가정을 연결하여, 우리를 지구 반대편에서 일어나는 인간의 실수에 취약하게 만든다.","hl":["every bank and countless households in every country","making us vulnerable"],"khl":["모든 나라의 모든 은행과 수많은 가정을","취약하게 만든다"],"blocks":[{"t":"pair","h":"\"전부\"를 말하는 단어 묶음","x":[["global","세계적인"],["every bank","모든 은행"],["countless households","셀 수 없이 많은 가정"],["in every country","모든 나라에서"]]},{"t":"p","h":"few(거의 없는)가 튀는 이유","x":["모든 은행, 모든 나라, 그리고 '거의 없는' 가정?","묶음 속에서 혼자 크기가 확 줄어든다.","가정이 거의 연결되지 않으면 우리 모두가 취약해질 이유도 없다.","글은 우리 집까지 다 연결되어서 위험하다는 이야기다."]},{"t":"p","h":"그대로 둘 단어","x":["transformed(완전히 바꾸다)는 altered(바꾸다)보다 세지만 같은 방향이다.","소셜 미디어가 세상을 크게 바꿨다는 뜻은 그대로다."]}],"post":["countless(셀 수 없이 많은) ↔ few(거의 없는)","전 세계 은행 + 우리 집 = 전부 연결"]},{"no":"34","slots":[["complex"],["predict"],["vulnerabilities","weaknesses","s"],["instantly"],["spreads","contains","a"]],"opts":["spreads","blocks","limits","reduces"],"or":["spreads(퍼뜨리다): 연결되어 있으니 작은 실패가 곧바로 여기저기 번진다는 이유가 되어 맞음.","blocks(막다): 실패의 영향을 막는다면 새로운 취약성이 생긴다는 앞말의 이유가 될 수 없음.","limits(제한하다): 영향이 제한되면 오히려 안전해지는 것이라 vulnerabilities(취약성)와 부딪침.","reduces(줄이다): 작은 실패를 더 작게 만든다면 위험이 커진다는 글 전체 흐름과 반대임."],"om":["퍼뜨리다","막다","제한하다","줄이다"],"en":"Information technology creates new vulnerabilities because interconnectedness instantly spreads the impact of small failures.","ko":"정보 기술은 새로운 취약성을 만들어 내는데, 상호 연결성이 작은 실패의 영향을 즉시 퍼뜨리기 때문이다.","hl":["instantly spreads the impact of small failures","creates new vulnerabilities because"],"khl":["작은 실패의 영향을 즉시 퍼뜨리기 때문이다","새로운 취약성을 만들어 내는데"],"blocks":[{"t":"flow","h":"because(왜냐하면)가 잇는 원인과 결과","x":["모든 것이 서로 연결됨","작은 실패 하나 발생","그 영향이 즉시 번짐","결과: 새로운 취약성"],"at":2},{"t":"p","h":"contains(억제하다)를 넣으면","x":["\"연결성이 작은 실패의 영향을 즉시 막아 준다\"가 된다.","막아 준다면 더 안전해진다.","그런데 앞에서는 새로운 vulnerabilities(취약성)가 생긴다고 했다.","원인이 결과를 거꾸로 설명하게 된다.","weaknesses(약점)는 vulnerabilities(취약성) 자리에 둬도 뜻이 같다."]}],"post":["spread(퍼뜨리다) ↔ contain(억제하다)","연결성 = 작은 실패의 확성기"]}],"compquiz":[{"w":"countless","m":"셀 수 없이 많은","it":[["numerous","수많은","s"],["wooden","나무로 된","n"],["few","거의 없는","a"],["polite","공손한","n"],["innumerable","셀 수 없이 많은","s"],["finite","유한한","a"],["salty","짠","n"]]},{"w":"spread","m":"퍼뜨리다","it":[["sneeze","재채기하다","n"],["distribute","퍼뜨리다, 나누어 주다","s"],["contain","억제하다, 막다","a"],["polish","닦다","n"],["disperse","흩어지게 하다","s"],["confine","가두다, 국한시키다","a"],["bake","굽다","n"]]}],"sets":[{"items":[{"slots":[["altered","preserved","a"],["countless"],["vulnerable"],["separate"],["buffered"]],"opts":["altered","ignored","avoided","abandoned"],"or":["altered(바꾸다): 입소문이 누구나 아는 말이 될 만큼 세상이 달라졌다는 결과와 맞음.","ignored(무시하다): 비즈니스와 정치를 무시했다면 소셜 미디어 말이 일상어가 될 만큼 퍼질 수 없음.","avoided(피하다): 소셜 미디어가 우정을 피한다는 건 뜻이 통하지 않고 글의 '변화' 흐름과도 무관함.","abandoned(버리다): 비즈니스·정치·우정을 버렸다는 건 사실과도 글의 흐름과도 맞지 않음."],"om":["바꾸다","무시하다","피하다","버리다"],"en":"Social media has altered business, politics, and friendships, making going viral a household term.","ko":"소셜 미디어는 비즈니스, 정치, 우정을 바꿔 놓았고, '입소문이 나다'를 누구나 아는 말로 만들었다.","hl":["has altered business, politics, and friendships","a household term"],"khl":["비즈니스, 정치, 우정을 바꿔 놓았고","누구나 아는 말로"],"blocks":[{"t":"flow","h":"글이 걸어가는 길","x":["소셜 미디어·금융이 세상을 바꿈","옛날: 기관들이 따로 떨어져 보호받음","지금: 정보·기계가 서로 연결됨","연결 = 복합적 실패의 온상","작은 실패도 즉시 번지는 취약성"],"at":0},{"t":"p","h":"분사구문이 보여 주는 결과","x":["making going viral a household term(입소문이 나다를 누구나 아는 말로 만들며)은 앞 내용의 결과다.","예전엔 없던 말이 일상어가 됐다는 건 세상이 달라졌다는 증거다.","preserved(보존하다)를 넣으면 세상은 그대로인데 새 말만 퍼진 꼴이 된다.","원인과 결과가 이어지지 않는다."]}],"post":["alter(바꾸다) ↔ preserve(보존하다)","입소문 = 누구나 아는 말, 세상이 바뀐 증거"]},{"slots":[["countless","numerous","s"],["vulnerable","immune","a"],["separate"],["buffered","shielded","s"],["massive"]],"opts":["vulnerable","resistant","indifferent","hostile"],"or":["vulnerable(취약한): 다 연결되어 있으니 먼 나라 실수도 우리에게 닿는다는 위험을 말해 맞음.","resistant(저항력 있는): 영향을 견딘다는 말이라 '연결 = 위험'이라는 글의 경고와 반대임.","indifferent(무관심한): 무관심은 마음의 문제라 실수의 영향을 받는다는 흐름과 이어지지 않음.","hostile(적대적인): 남의 실수에 적대적이라는 건 금융 연결이 만드는 결과로 볼 수 없음."],"om":["취약한","저항력 있는","무관심한","적대적인"],"en":"The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world.","ko":"세계 금융 산업은 모든 나라의 모든 은행과 수많은 가정을 연결하여, 우리를 지구 반대편에서 일어나는 인간의 실수에 취약하게 만든다.","hl":["making us vulnerable to human error","links every bank"],"khl":["인간의 실수에 취약하게 만든다","연결하여"],"blocks":[{"t":"p","h":"immune(영향을 받지 않는)을 넣고 다시 읽기","x":["\"모든 걸 연결해서 우리를 지구 반대편 실수로부터 끄떡없게 만든다\"가 된다.","하지만 연결되어 있다는 건 남의 문제가 내게로 넘어온다는 뜻이다.","글 끝에서도 연결성이 작은 실패를 즉시 퍼뜨린다고 한다.","연결 = 안전이 아니라 연결 = 위험이다."]},{"t":"p","h":"함정 둘","x":["numerous(수많은)는 countless(셀 수 없이 많은)와 같은 뜻이다.","shielded(보호받는)는 buffered(보호받는) 자리에 넣어도 from(~로부터)과 잘 어울린다.","바뀐 단어가 셋이어도 고칠 건 하나."]}],"post":["vulnerable(취약한) ↔ immune(영향을 받지 않는)","지구 반대편 실수도 우리 집까지 도착"]},{"slots":[["separate","connected","a"],["buffered"],["massive"],["enormously","tremendously","s"],["decreased"]],"opts":["separate","merged","unified","open"],"or":["separate(분리된): 따로 떨어져 있었기에 바깥 오류로부터 보호받았다는 thereby(그 덕분에)의 원인이 되어 맞음.","merged(합쳐진): 합쳐져 있었다면 바깥 오류가 그대로 들어와 보호받을 수 없음.","unified(통합된): 통합된 기관은 지금의 연결된 상태와 같아서 That is no longer the case(더 이상 그렇지 않다)와 안 맞음.","open(열린): 울타리가 열려 있었다면 바깥 오류를 막아 주는 walls(울타리)라는 그림이 깨짐."],"om":["분리된","합쳐진","통합된","열린"],"en":"years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls. That is no longer the case.","ko":"수년 전에는 우리 기관 대부분이 분리되어 있었고, 그 덕분에 자기 울타리 밖에서 일어난 오류의 영향으로부터 보호받았다. 이제는 더 이상 그렇지 않다.","hl":["were separate and thereby buffered","That is no longer the case"],"khl":["분리되어 있었고, 그 덕분에","이제는 더 이상 그렇지 않다"],"blocks":[{"t":"pair","h":"옛날과 지금","x":[["years ago: separate, buffered","옛날: 따로 떨어짐 → 보호받음"],["now: no longer the case","지금: 더 이상 그렇지 않음 → 연결됨, 취약함"]]},{"t":"p","h":"connected(연결된)가 안 되는 이유","x":["thereby(그 덕분에)는 앞이 뒤의 원인이라는 표시다.","연결되어 있어서 바깥 오류로부터 보호받았다? 원인과 결과가 거꾸로다.","게다가 교수의 말 속에도 things that used to be kept separate(따로 떨어져 있던 것들)가 나온다.","옛날 = 따로, 지금 = 연결. 이 대비가 글의 뼈대다."]},{"t":"p","h":"그대로 둘 단어","x":["tremendously(엄청나게)는 enormously(엄청나게)와 같은 말이다."]}],"post":["separate(분리된) ↔ connected(연결된)","옛날 = 따로 떨어져서 안전"]},{"slots":[["buffered"],["massive","tiny","a"],["enormously"],["decreased"],["autonomously"]],"opts":["massive","minor","scarce","modest"],"or":["massive(방대한): 비용이 내려가 정보가 엄청나게 디지털화됐다는 흐름과 크기가 맞음.","minor(사소한): 사소한 양의 정보라면 grow enormously(엄청나게 늘다)와 크기가 안 맞음.","scarce(부족한): 정보가 부족하다는 건 디지털화가 폭발적으로 늘었다는 내용과 반대임.","modest(적당한, 많지 않은): 적당한 양은 '엄청나게'라는 말과 함께 쓰기에 너무 작음."],"om":["방대한","사소한","부족한","적당한, 많지 않은"],"en":"The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.","ko":"컴퓨팅 능력의 비용이 감소하면서 방대한 양의 정보의 디지털화는 엄청나게 계속 늘어났다.","hl":["massive amounts of information","grow enormously"],"khl":["방대한 양의 정보의","엄청나게 계속 늘어났다"],"blocks":[{"t":"p","h":"한 문장 안의 크기 맞추기","x":["이 문장은 크기를 말하는 단어로 가득하다.","massive(방대한) 양, grow enormously(엄청나게 늘다).","tiny(아주 작은)를 넣으면 \"아주 작은 양의 정보가 엄청나게 늘었다\"가 된다.","작은 것과 엄청난 것이 한 문장에서 부딪친다."]},{"t":"p","h":"글 흐름 속 이 문장의 역할","x":["옛날엔 따로 떨어져 안전했다.","지금은 정보가 어마어마하게 디지털로 옮겨 가 서로 얽힌다.","정보의 양이 커야 '연결의 위험'도 커진다."]}],"post":["massive(방대한) ↔ tiny(아주 작은)","정보 디지털화 = 어마어마한 규모"]},{"slots":[["massive","vast","s"],["enormously"],["decreased","increased","a"],["autonomously","independently","s"],["infinite"]],"opts":["decreased","risen","doubled","soared"],"or":["decreased(감소하다): 컴퓨터 비용이 싸질수록 디지털화가 늘어나는 자연스러운 원인-결과라 맞음.","risen(오르다): 비용이 오르면 디지털화는 줄어들어야 하므로 grow enormously(엄청나게 늘다)와 반대임.","doubled(두 배가 되다): 비용이 두 배가 되면 쓰기 더 어려워져 디지털화가 폭발할 이유가 없음.","soared(치솟다): 비용이 치솟는다는 건 디지털화가 엄청나게 늘었다는 결과와 정반대 원인임."],"om":["감소하다","오르다","두 배가 되다","치솟다"],"en":"The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased.","ko":"컴퓨팅 능력의 비용이 감소하면서 방대한 양의 정보의 디지털화는 엄청나게 계속 늘어났다.","hl":["as the cost of computing power has decreased","grow enormously"],"khl":["컴퓨팅 능력의 비용이 감소하면서","엄청나게 계속 늘어났다"],"blocks":[{"t":"tap","h":"질문 하나","q":"물건값이 오르면 사람들이 더 많이 쓸까, 덜 쓸까?","a":["덜 쓴다.","컴퓨터 비용도 마찬가지다.","값이 내려가야 너도나도 정보를 디지털로 옮긴다.","increased(증가하다)를 넣으면 비싸졌는데 더 많이 썼다는 말이 된다."]},{"t":"p","h":"as(~함에 따라)가 잇는 두 변화","x":["as(~함에 따라)는 두 변화가 함께 움직인다는 표시다.","비용은 내려가고, 디지털화는 올라간다.","한쪽이 싸지니 다른 쪽이 늘어나는 관계."]},{"t":"p","h":"함정","x":["vast(방대한)는 massive(방대한)와, independently(스스로)는 autonomously(자율적으로)와 같은 뜻이다.","둘 다 고치면 안 된다."]}],"post":["decrease(감소하다) ↔ increase(증가하다)","컴퓨터 값 하락 = 디지털화 폭발"]}],"quiz":[{"w":"alter","m":"바꾸다","it":[["change","바꾸다","s"],["applaud","박수를 치다","n"],["preserve","보존하다","a"],["borrow","빌리다","n"],["modify","수정하다","s"],["maintain","유지하다","a"],["whisper","속삭이다","n"]]},{"w":"vulnerable","m":"취약한, 다치기 쉬운","it":[["punctual","시간을 잘 지키는","n"],["susceptible","영향을 받기 쉬운","s"],["immune","영향을 받지 않는","a"],["sour","신","n"],["exposed","노출된","s"],["resistant","저항력 있는","a"],["fluent","유창한","n"]]},{"w":"separate","m":"분리된, 따로 떨어진","it":[["isolated","고립된, 따로 떨어진","s"],["delicious","맛있는","n"],["connected","연결된","a"],["brave","용감한","n"],["detached","떨어진, 분리된","s"],["joined","결합된","a"],["foggy","안개 낀","n"]]},{"w":"massive","m":"방대한, 거대한","it":[["huge","거대한","s"],["tiny","아주 작은","a"],["polite","공손한","n"],["enormous","거대한","s"],["small","작은","a"],["sincere","진실한","n"],["rural","시골의","n"]]},{"w":"decrease","m":"감소하다","it":[["decline","감소하다","s"],["sew","바느질하다","n"],["increase","증가하다","a"],["sneeze","재채기하다","n"],["drop","떨어지다","s"],["rise","오르다","a"],["polish","닦다","n"]]}]},{"items":[{"slots":[["autonomously"],["infinite","endless","s"],["potential","impossible","a"],["interdependence","interconnection","s"],["complex"]],"opts":["potential","harmless","trivial","rare"],"or":["potential(잠재적인): 아직 일어나진 않았지만 일어날 수 있는 고장이라 '실패의 온상'이라는 다음 문장과 맞음.","harmless(해롭지 않은): 해롭지 않은 고장이라면 복합적 실패의 온상이라고 경고할 이유가 없음.","trivial(사소한): 사소한 고장뿐이라면 예측하기 훨씬 어려워진다는 걱정과 안 맞음.","rare(드문): 무한히 다양한데 드물다는 건 infinite(무한한)와 부딪침."],"om":["잠재적인","해롭지 않은","사소한","드문"],"en":"The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns. This interdependence is a breeding ground for complex failure.","ko":"자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장을 낳았다. 이러한 상호 의존성은 복합적 실패의 온상이다.","hl":["potential breakdowns","gave rise to","a breeding ground"],"khl":["잠재적 고장을","낳았다","온상"],"blocks":[{"t":"p","h":"gave rise to(낳았다)가 정하는 것","x":["gave rise to(~을 낳았다)는 새로 생겨났다는 말이다.","impossible(불가능한)을 넣으면 \"일어날 수 없는 고장을 무한히 낳았다\"가 된다.","일어날 수 없는 고장은 걱정거리도 아니다.","바로 다음 문장이 '실패의 온상'이라고 경고하는 것과 어긋난다."]},{"t":"p","h":"breeding ground(온상)의 그림","x":["온상은 무언가가 자라나기 좋은 곳이다.","지금은 고장이 안 났어도 언제든 자라날 수 있는 씨앗들.","그 씨앗이 바로 potential(잠재적인) 고장이다."]},{"t":"p","h":"그대로 둘 단어","x":["endless(끝없는)는 infinite(무한한) 자리에, interconnection(상호 연결)은 interdependence(상호 의존) 자리에 들어가도 된다.","an endless variety(끝없이 다양함)는 관사 an(하나의)과도 잘 맞는다."]}],"post":["potential(잠재적인) ↔ impossible(불가능한)","스마트 시스템 = 고장 씨앗의 온상"]},{"slots":[["infinite"],["potential"],["interdependence","independence","a"],["complex"],["difficult"]],"opts":["interdependence","isolation","simplicity","stability"],"or":["interdependence(상호 의존): 서로 기대어 있어서 한 곳의 고장이 얽히고설킨다는 '복합적 실패'와 맞음.","isolation(고립): 고립되어 있으면 실패가 번지지 않아 오히려 옛날의 안전한 상태임.","simplicity(단순함): 단순한 구조는 complex(복합적인) 실패의 온상이 될 수 없음.","stability(안정): 안정이 실패의 온상이라는 건 말 자체가 모순임."],"om":["상호 의존","고립","단순함","안정"],"en":"This interdependence is a breeding ground for complex failure.","ko":"이러한 상호 의존성은 복합적 실패의 온상이다.","hl":["This interdependence","complex failure"],"khl":["이러한 상호 의존성은","복합적 실패의"],"blocks":[{"t":"p","h":"This(이러한)가 가리키는 것","x":["This(이러한)는 앞 내용을 한 단어로 묶는 말이다.","앞에는 모든 은행·가정이 연결되고, 스마트 시스템이 서로 소통한다는 내용이 있다.","그걸 한 단어로 하면 '서로 기대어 있음', 곧 interdependence(상호 의존)다.","independence(독립)를 넣으면 앞 내용과 정반대로 묶어 버린다."]},{"t":"tap","h":"질문 하나","q":"서로 독립된 것들 사이에서 실패가 번질 수 있을까?","a":["번지기 어렵다.","그게 바로 옛날 기관들이 보호받던 이유다.","지금 실패가 커지는 건 서로 기대어 있기 때문이다."]}],"post":["interdependence(상호 의존) ↔ independence(독립)","서로 기대어 있음 = 실패의 온상"]},{"slots":[["interdependence"],["complex","simple","a"],["difficult"],["predict","foresee","s"],["vulnerabilities"]],"opts":["complex","minor","gradual","predictable"],"or":["complex(복합적인): 얽힌 것들이 부딪쳐 다음 일을 예측하기 어려워진다는 교수의 말과 맞음.","minor(사소한): 사소한 실패의 온상이라면 이렇게 크게 경고할 이유가 없음.","gradual(점진적인): 실패가 천천히 온다는 건 영향이 즉시 번진다는 마지막 문장과 부딪침.","predictable(예측 가능한): 바로 뒤에서 예측하기가 훨씬 어려워진다고 했으므로 정반대임."],"om":["복합적인","사소한","점진적인","예측 가능한"],"en":"This interdependence is a breeding ground for complex failure. As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what’s going to happen next.”","ko":"이러한 상호 의존성은 복합적 실패의 온상이다. Rita의 말대로, \"분리되어 있던 것들이 서로 부딪치게 되면, 다음에 무슨 일이 일어날지 예측하기가 훨씬 더 어려워진다.\"","hl":["complex failure","far more difficult to predict"],"khl":["복합적 실패의","예측하기가 훨씬 더 어려워진다"],"blocks":[{"t":"pair","h":"주장과 증거 나란히","x":[["a breeding ground for complex failure","복합적 실패의 온상 (필자의 주장)"],["far more difficult to predict","예측하기가 훨씬 더 어려워짐 (Rita의 증거)"]]},{"t":"p","h":"simple(단순한)을 넣으면","x":["\"단순한 실패의 온상\"이 된다.","단순한 실패라면 원인도 결과도 뻔해서 예측이 쉽다.","그런데 바로 뒤 증거는 예측이 훨씬 어려워진다고 말한다.","주장과 증거가 서로 반대를 가리킨다."]},{"t":"p","h":"그대로 둘 단어","x":["foresee(예견하다)는 predict(예측하다) ":["새로운 취약성을 만들어 내는데","작은 실패의 영향을 즉시 퍼뜨리기 때문이다"],"blocks":[{"t":"p","h":"첫 문단의 vulnerable(취약한)과 이어 보기","x":["글 앞쪽에서 금융 연결이 우리를 vulnerable(취약한) 상태로 만든다고 했다.","마지막 문장은 그 말을 명사로 다시 꺼낸다. vulnerabilities(취약성).","safeguards(안전장치)를 넣으면 글의 처음과 끝이 서로 반대를 말한다.","처음에 취약하다고 해 놓고 끝에서 안전장치가 생긴다? 결론이 무너진다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["challenging(어려운)은 difficult(어려운)와 같은 뜻이고 far more(훨씬 더)와도 잘 붙는다.","immediately(즉시)는 instantly(즉시)와 같은 말이다."]}],"post":["vulnerability(취약성) ↔ safeguard(안전장치)","글의 처음과 끝 = 연결 때문에 취약"]}],"quiz":[{"w":"potential","m":"잠재적인, ~할 가능성이 있는","it":[["possible","가능한","s"],["hungry","배고픈","n"],["actual","실제의","a"],["wooden","나무로 된","n"],["prospective","장래의, 가능성 있는","s"],["impossible","불가능한","a"],["generous","관대한","n"]]},{"w":"interdependence","m":"상호 의존","it":[["harvest","수확","n"],["interconnection","상호 연결","s"],["independence","독립","a"],["laundry","세탁물","n"],["interrelation","상호 관계","s"],["self-sufficiency","자급자족","a"],["ceremony","의식, 행사","n"]]},{"w":"complex","m":"복잡한, 복합적인","it":[["complicated","복잡한","s"],["purple","보라색의","n"],["simple","단순한","a"],["ancient","고대의","n"],["intricate","복잡한, 뒤얽힌","s"],["straightforward","간단한","a"],["salty","짠","n"]]},{"w":"difficult","m":"어려운","it":[["foggy","안개 낀","n"],["hard","어려운","s"],["easy","쉬운","a"],["annual","해마다의","n"],["challenging","어려운, 힘든","s"],["effortless","힘들지 않은","a"],["loyal","충실한","n"]]},{"w":"vulnerability","m":"취약성","it":[["weakness","약점","s"],["recipe","요리법","n"],["strength","강점","a"],["umbrella","우산","n"],["susceptibility","영향을 받기 쉬움","s"],["immunity","면역, 영향을 받지 않음","a"],["orchard","과수원","n"]]}]}],"no":"34"},{"id":"2610g2-35","title":"어휘특훈 · 26년 10월 고2 35번","sub":"전염병과 싸워 온 의학의 성과","tpl":"Scientific developments and technologies in medical practice have brought us {enormous} progress in the {treatment} and {prevention} of {infectious} diseases. The {discovery} of penicillin in 1928 by Alexander Fleming, for which he later received the Nobel Prize, was one of the biggest {breakthroughs} in the battle against infectious diseases. Edward Jenner discovered around 1796 that humans were {protected} against the {deadly} smallpox virus after {exposure} to the cowpox virus, which is {harmless} to humans. Vaccines developed in laboratories have {contributed} enormously to the {reduction} of the {burden} of bacterial and viral diseases and have even led to the {elimination} of poxvirus. For other infectious diseases (for example cholera and malaria), control and hygiene management measures have {reduced} their burden, while for others treatment therapies turned viral diseases that were deadly into {chronic} {manageable} diseases.","fn":["*penicillin: 페니실린(세균을 죽이는 항생제)","*smallpox: 천연두","*cowpox: 우두(소가 걸리는 천연두 비슷한 병)","*poxvirus: 폭스바이러스(천연두를 일으키는 바이러스 무리)","*hygiene: 위생"],"mean":{"enormous":"엄청난","tremendous":"엄청난","minimal":"아주 적은, 최소의","treatment":"치료","cure":"치료, 치료법","prevention":"예방","spread":"확산, 퍼짐","infectious":"전염성의","contagious":"전염성의","noninfectious":"비전염성의","discovery":"발견","breakthroughs":"명사 breakthrough(획기적 발전, 돌파구)의 복수형","advances":"명사 advance(발전, 진보)의 복수형","setbacks":"명사 setback(차질, 후퇴)의 복수형","protected":"동사 protect(보호하다)의 과거분사형. be protected = 보호되다","shielded":"동사 shield(보호하다, 막아 주다)의 과거분사형","defenseless":"무방비의","deadly":"치명적인","lethal":"치명적인","mild":"가벼운, 순한","exposure":"노출","harmless":"해가 없는","harmful":"해로운","contributed":"동사 contribute(기여하다)의 과거분사형. have contributed = 기여해 왔다(현재완료)","reduction":"감소","lessening":"동사 lessen(줄이다)의 -ing형. 줄어듦(동명사)","increase":"증가","burden":"부담, 짐","benefit":"이익, 혜택","elimination":"제거, 퇴치","eradication":"근절, 박멸","revival":"부활, 되살아남","reduced":"동사 reduce(줄이다)의 과거분사형. have reduced = 줄여 왔다(현재완료)","eased":"동사 ease(덜어 주다)의 과거분사형","worsened":"동사 worsen(악화시키다)의 과거분사형","chronic":"만성의(오래 계속되는)","long-term":"장기적인","manageable":"관리 가능한","uncontrollable":"통제할 수 없는"},"comp":[{"no":"35","slots":[["enormous"],["discovery"],["deadly","mild","a"],["exposure"],["harmless"]],"opts":["deadly","minor","weak","gentle"],"or":["deadly(치명적인): 막아야 ner는 1796년 무렵, 사람에게 해가 없는 우두 바이러스에 노출된 뒤에는 사람이 치명적인 천연두 바이러스로부터 보호된다는 것을 발견했다.","hl":["humans were protected against","harmless to humans"],"khl":["보호된다는 것","해가 없는"],"blocks":[{"t":"p","h":"제너가 발견한 것","x":["이 문장은 백신의 시작 이야기다.","해가 없는 우두를 먼저 겪으면 무서운 천연두를 막을 수 있다.","defenseless(무방비의)를 넣으면 우두를 겪은 뒤 오히려 천연두에 무방비가 된다.","그러면 발견이라고 부를 이유가 없다.","다음 문장이 바로 Vaccines(백신)로 이어지는 것도 '보호'가 맞다는 증거다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","advances(발전)는 breakthroughs(획기적 발전) 자리에 넣어도 뜻이 통한다.","lethal(치명적인)은 deadly(치명적인)와 같은 뜻이다."]}],"post":["protected(보호된) ↔ defenseless(무방비의)","해 없는 우두 먼저 → 천연두 방어 = 백신의 시작"]},{"slots":[["harmless"],["contributed"],["reduction","increase","a"],["elimination","eradication","s"],["reduced"]],"opts":["reduction","growth","rise","expansion"],"or":["reduction(감소): 기여한 대상이 질병의 부담이니 '부담 감소'여야 성과가 됨.","growth(증가): 백신이 질병 부담의 증가에 기여했다면 성과 목록에 들어올 수 없음.","rise(상승): 부담이 올라갔다면 바로 뒤 elimination(퇴치)과 정반대 방향임.","expansion(확대): 부담을 넓혔다는 말이 되어 백신을 칭찬하는 문장과 부딪침."],"om":["감소","증가","상승","확대"],"en":"Vaccines developed in laboratories have contributed enormously to the reduction of the burden of bacterial and viral diseases and have even led to the elimination of poxvirus.","ko":"실험실에서 개발된 백신은 세균성·바이러스성 질병이 주는 부담을 줄이는 데 크게 기여했고, 심지어 폭스바이러스의 퇴치로까지 이어졌다.","hl":["the reduction of the burden","have even led to"],"khl":["부담을 줄이는 데","심지어"],"blocks":[{"t":"pair","h":"and 앞뒤 나란히","x":[["contributed enormously to the reduction of the burden","부담 감소에 크게 기여했다"],["have even led to the elimination of poxvirus","심지어 폭스바이러스 퇴치로까지 이어졌다"]]},{"t":"p","h":"even(심지어)이 정하는 방향","x":["even(심지어)은 앞말보다 한 걸음 더 나간 말을 붙인다.","앞이 '부담을 줄였다'면 뒤는 '아예 없앴다'로 한 걸음 더 나간다.","increase(증가)를 넣으면 '부담을 늘렸고, 심지어 퇴치했다'가 된다.","앞뒤가 서로 반대라 even(심지어)으로 이을 수 없다."]},{"t":"p","h":"고치면 안 되는 단어","x":["eradication(근절)은 elimination(제거, 퇴치)과 같은 뜻이다.","천연두 이야기에는 eradication(근절)이란 말이 특히 자주 쓰인다."]}],"post":["reduction(감소) ↔ increase(증가)","줄였다 → 심지어 없앴다"]},{"slots":[["treatment"],["prevention","spread","a"],["discovery"],["exposure"],["burden"]],"opts":["prevention","transmission","outbreak","origin"],"or":["prevention(예방): 뒤에 나오는 천연두 보호, 백신이 모두 병을 미리 막는 이야기라 맞음.","transmission(전파): 병을 옮기는 쪽에서 진보했다는 말이 되어 의학의 성과와 반대임.","outbreak(발병): 발병에서 진보했다는 건 병이 더 잘 터졌다는 말이라 어색함.","origin(기원): 치료와 나란히 놓일 성과가 아니고, 뒤 예시 어디에도 병의 기원 이야기는 없음."],"om":["예방","전파","발병","기원"],"en":"Scientific developments and technologies in medical practice have brought us enormous progress in the treatment and prevention of infectious diseases. … humans were protected against the deadly smallpox virus","ko":"의료 현장의 과학적 발전과 기술은 우리에게 전염병의 치료와 예방에 있어 엄청난 진보를 가져다주었다. … 사람이 치명적인 천연두 바이러스로부터 보호된다","hl":["the treatment and prevention","humans were protected against"],"khl":["치료와 예방","보호된다"],"blocks":[{"t":"tap","h":"질문 하나","q":"treatment(치료) 말고 의학이 병과 싸우는 또 하나의 방법은?","a":["병에 걸리기 전에 막는 것, 곧 prevention(예방)이다.","걸린 병은 고치고, 아직 안 걸린 병은 막는다.","spread(확산)는 막는 게 아니라 퍼지는 쪽이다."]},{"t":"p","h":"예시로 확인","x":["제너의 우두 이야기는 걸리기 전에 막는 이야기다.","백신도 마찬가지다.","첫 문장이 '예방'을 말해 두었기 때문에 이 예시들이 나올 수 있다."]}],"post":["prevention(예방) ↔ spread(확산)","치료 + 예방 = 의학이 병과 싸우는 두 방법"]},{"slots":[["infectious","contagious","s"],["harmless"],["reduced","eased","s"],["chronic"],["manageable","uncontrollable","a"]],"opts":["manageable","fatal","hopeless","untreatable"],"or":["manageable(관리 가능한): 치료법이 deadly(치명적인) 병을 바꿔 놓은 결과라 '관리할 수 있는 병'이 되어야 진보임.","fatal(치명적인): 치명적이던 병을 치명적인 병으로 바꿨다면 아무것도 바뀌지 않음.","hopeless(가망 없는): 치료법의 성과가 '가망 없는 병'이면 성과 목록에 들어갈 수 없음.","untreatable(치료할 수 없는): treatment therapies(치료법)가 만든 결과가 '치료할 수 없음'이면 앞뒤가 부딪침."],"om":["관리 가능한","치명적인","가망 없는","치료할 수 없는"],"en":"while for others treatment therapies turned viral diseases that were deadly into chronic manageable diseases.","ko":"또 다른 질병의 경우에는 치료법이 치명적이던 바이러스성 질병을 관리 가능한 만성 질병으로 바꾸었다.","hl":["chronic manageable diseases","that were deadly"],"khl":["관리 가능한 만성 질병","치명적이던"],"blocks":[{"t":"p","h":"turn A into B(A를 B로 바꾸다) 구조","x":["turn A into B(A를 B로 바꾸다)는 변화의 전과 후를 보여 준다.","전: that were deadly(치명적이던) 병.","후: 오래가지만 관리할 수 있는 병.","uncontrollable(통제할 수 없는)을 넣으면 치료법이 병을 더 손쓸 수 없게 만든 셈이다.","치료법이 그런 일을 했다면 성과 목록에 실릴 리 없다."]},{"t":"p","h":"함정","x":["contagious(전염성의)는 infectious(전염성의)와 같은 뜻이다.","eased(덜어 주었다)는 reduced(줄였다)와 같은 방향이다.","ease a burden(부담을 덜다)은 아주 자연스러운 짝이다.","고칠 것은 하나뿐."]}],"post":["manageable(관리 가능한) ↔ uncontrollable(통제할 수 없는)","치명적인 병 → 관리 가능한 만성 질병"]}],"quiz":[{"w":"enormous","m":"엄청난","it":[["honest","정직한","n"],["huge","거대한","s"],["tiny","아주 작은","a"],["wooden","나무로 된","n"],["immense","막대한","s"],["minimal","아주 적은, 최소의","a"],["rural","시골의","n"]]},{"w":"protect","m":"보호하다","it":[["shield","보호하다, 막아 주다","s"],["borrow","빌리다","n"],["endanger","위험에 빠뜨리다","a"],["whisper","속삭이다","n"],["guard","지키다","s"],["attack","공격하다","a"],["predict","예측하다","n"]]},{"w":"reduction","m":"감소","it":[["invitation","초대","n"],["decrease","감소","s"],["increase","증가","a"],["signature","서명","n"],["decline","감소, 하락","s"],["rise","상승, 증가","a"],["apology","사과","n"]]},{"w":"prevention","m":"예방","it":[["avoidance","회피, 막음","s"],["harvest","수확","n"],["promotion","촉진, 장려","a"],["journey","여행","n"],["deterrence","억제, 저지","s"],["encouragement","장려, 부추김","a"],["ceremony","의식","n"]]},{"w":"manageable","m":"관리 가능한","it":[["delicious","맛있는","n"],["controllable","통제할 수 있는","s"],["unmanageable","감당할 수 없는","a"],["ancient","고대의","n"],["governable","다스릴 수 있는","s"],["uncontrollable","통제할 수 없는","a"],["punctual","시간을 잘 지키는","n"]]}]},{"items":[{"slots":[["deadly"],["exposure"],["harmless","harmful","a"],["contributed"],["elimination"]],"opts":["harmless","toxic","painful","destructive"],"or":["harmless(해가 없는): 일부러 노출시켜도 괜찮은 바이러스라야 예방법이 될 수 있어 맞음.","toxic(독성이 있는): 독성 있는 바이러스에 노출시키는 건 보호가 아니라 위험임.","painful(고통스러운): 고통을 주는 바이러스라면 치명적인 천연두와의 대비가 흐려짐.","destructive(파괴적인): 사람에게 파괴적이라면 그것으로 사람을 지킨다는 발견과 맞지 않음."],"om":["해가 없는","독성이 있는","고통스러운","파괴적인"],"en":"Edward Jenner discovered around 1796 that humans were protected against the deadly smallpox virus after exposure to the cowpox virus, which is harmless to humans.","ko":"Edward Jenner는 1796년 무렵, 사람에게 해가 없는 우두 바이러스에 노출된 뒤에는 사람이 치명적인 천연두 바이러스로부터 보호된다는 것을 발견했다.","hl":["which is harmless to humans","the deadly smallpox virus"],"khl":["사람에게 해가 없는","치명적인 천연두 바이러스"],"blocks":[{"t":"pair","h":"두 바이러스 나란히","x":[["the deadly smallpox virus","치명적인 천연두 바이러스 (막고 싶은 것)"],["the cowpox virus, which is harmless to humans","사람에게 해가 없는 우두 바이러스 (먼저 겪게 하는 것)"]]},{"t":"p","h":"대비가 생명","x":["이 발견의 핵심은 '해 없는 것으로 무서운 것을 막는다'이다.","harmful(해로운)을 넣으면 둘 다 위험한 바이러스가 된다.","위험한 것을 겪게 해서 위험한 것을 막는다면 얻는 게 없다.","오늘날 백신도 같은 원리라 해가 없어야 한다."]}],"post":["harmless(해가 없는) ↔ harmful(해로운)","해 없는 우두로 치명적인 천연두 막기"]},{"slots":[["enormous","tremendous","s"],["treatment","cure","s"],["breakthroughs","setbacks","a"],["protected"],["burden"]],"opts":["breakthroughs","failures","mistakes","delays"],"or":["breakthroughs(획기적 발전): 노벨상을 받은 발견이니 '가장 큰 돌파구'가 맞음.","failures(실패): 노벨상을 받은 발견을 실패라고 부를 수 없음.","mistakes(실수): for which he later received the Nobel Prize(그 일로 그는 나중에 노벨상을 받았다)와 정면으로 부딪침.","delays(지연): 싸움을 늦춘 일이라면 첫 문장 enormous progress(엄청난 진보)의 예가 될 수 없음."],"om":["획기적 발전","실패","실수","지연"],"en":"The discovery of penicillin in 1928 by Alexander Fleming, for which he later received the Nobel Prize, was one of the biggest breakthroughs in the battle against infectious diseases.","ko":"1928년 Alexander Fleming의 페니실린 발견은 전염병과의 싸움에서 가장 큰 획기적 발전 중 하나였고, 그는 이 발견으로 나중에 노벨상을 받았다.","hl":["one of the biggest breakthroughs","received the Nobel Prize"],"khl":["가장 큰 획기적 발전","노벨상을 받았다"],"blocks":[{"t":"p","h":"쉼표 사이에 끼어든 힌트","x":["쉼표 사이에 for which he later received the Nobel Prize(그 일로 그는 나중에 노벨상을 받았다)가 끼어 있다.","노벨상은 실패한 일에 주지 않는다.","setbacks(차질, 후퇴)를 넣으면 노벨상과 정면으로 부딪친다.","battle(싸움)이라는 비유 속에서 페니실린은 싸움의 흐름을 바꾼 무기다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["tremendous(엄청난)는 enormous(엄청난)와 같은 뜻이다.","cure(치료)는 treatment(치료) 자리에 넣어도 '치료와 예방'이 된다.","두 단어 모두 글의 칭찬 방향을 그대로 지킨다."]}],"post":["breakthrough(획기적 발전) ↔ setback(차질, 후퇴)","페니실린 = 노벨상 받은 돌파구"]},{"slots":[["protected","shielded","s"],["contributed"],["reduction"],["elimination","revival","a"],["chronic"]],"opts":["elimination","return","survival","persistence"],"or":["elimination(퇴치): even(심지어)이 붙어 '부담 감소'보다 더 큰 성과, 곧 아예 없앰이 와야 맞음.","return(복귀): 바이러스가 돌아왔다면 백신의 성과가 아니라 실패임.","survival(생존): 바이러스를 살아남게 했다는 말이 되어 백신 칭찬과 반대임.","persistence(지속): 바이러스가 계속 남았다면 even(심지어)으로 강조할 성과가 없음."],"om":["퇴치","복귀","생존","지속"],"en":"Vaccines developed in laboratories have contributed enormously to the reduction of the burden of bacterial and viral diseases and have even led to the elimination of poxvirus.","ko":"실험실에서 개발된 백신은 세균성·바이러스성 질병이 주는 부담을 줄이는 데 크게 기여했고, 심지어 폭스바이러스의 퇴치로까지 이어졌다.","hl":["the elimination of poxvirus","have even led to"],"khl":["폭스바이러스의 퇴치로까지","심지어"],"blocks":[{"t":"tap","h":"한 줄로 복원하기","q":"넷째 문장을 한 줄로 줄이면?","a":["백신 덕분에 병의 부담이 줄었고, 천연두는 아예 사라졌다.","revival(부활)이 들어가면 '사라졌다'가 '되살아났다'로 뒤집힌다."]},{"t":"p","h":"led to(~로 이어졌다)의 주인","x":["주어는 Vaccines(백신)다.","백신이 병을 되살렸다는 말은 성립하지 않는다.","실제로 천연두는 백신으로 지구에서 사라진 첫 번째 병이다."]},{"t":"p","h":"함정","x":["shielded(보호받는)는 protected(보호된)와 같은 뜻이라 맞는 표현."]}],"post":["elimination(퇴치) ↔ revival(부활)","백신 → 부담 감소 → 천연두 퇴치"]},{"slots":[["treatment"],["prevention"],["infectious","noninfectious","a"],["discovery"],["breakthroughs"]],"opts":["infectious","genetic","mental","nutritional"],"or":["infectious(전염성의): 뒤의 페니실린, 백신 예시가 모두 세균과 바이러스로 옮는 병 이야기라 맞음.","genetic(유전의): 유전병 이야기는 글 어디에도 없음.","mental(정신의): 정신 질환은 페니실린이나 백신과 관계없음.","nutritional(영양의): 영양 결핍 질환은 뒤에 나오는 바이러스, 세균 이야기와 맞지 않음."],"om":["전염성의","유전의","정신의","영양의"],"en":"Scientific developments and technologies in medical practice have brought us enormous progress in the treatment and prevention of infectious diseases. The discovery of penicillin … was one of the biggest breakthroughs in the battle against infectious diseases.","ko":"의료 현장의 과학적 발전과 기술은 우리에게 전염병의 치료와 예방에 있어 엄청난 진보를 가져다주었다. 페니실린의 발견은 … 전염병과의 싸움에서 가장 큰 획기적 발전 중 하나였다.","hl":["infectious diseases","the battle against infectious diseases"],"khl":["전염병의","전염병과의 싸움"],"blocks":[{"t":"p","h":"같은 말이 다시 나온다","x":["infectious diseases(전염병)는 이 짧은 글에 세 번 나온다.","첫 문장, 페니실린 문장, 마지막 문장.","noninfectious(비전염성의)로 바꾸면 첫 문장만 다른 병을 말하게 된다.","예시가 모두 옮는 병인데 총평만 안 옮는 병이면 글이 갈라진다."]},{"t":"flow","h":"예시 속 병들","x":["smallpox(천연두): 바이러스","bacterial diseases(세균성 질병)","cholera(콜레라), malaria(말라리아)","모두 사람 사이에 옮는 병"],"at":3}],"post":["infectious(전염성의) ↔ noninfectious(비전염성의)","예시 전부 = 옮는 병"]},{"slots":[["reduction","lessening","s"],["burden"],["reduced","worsened","a"],["chronic","long-term","s"],["manageable"]],"opts":["reduced","doubled","raised","multiplied"],"or":["reduced(줄였다): 앞 문장의 the reduction of the burden(부담의 감소)과 같은 성과를 다른 병에서 되풀이해 맞음.","doubled(두 배로 늘렸다): 위생 관리가 부담을 두 배로 늘렸다면 성과 목록에 들 수 없음.","raised(높였다): 통제 조치가 부담을 높였다는 건 조치의 목적과 반대임.","multiplied(크게 늘렸다): 부담이 불어났다면 뒤의 치료법 성과와 나란히 놓일 수 없음."],"om":["줄였다","두 배로 늘렸다","높였다","크게 늘렸다"],"en":"For other infectious diseases (for example cholera and malaria), control and hygiene management measures have reduced their burden","ko":"다른 전염병(예를 들어 콜레라와 말라리아)의 경우에는 통제와 위생 관리 조치가 그 부담을 줄였고","hl":["have reduced their burden","control and hygiene management measures"],"khl":["그 부담을 줄였고","통제와 위생 관리 조치가"],"blocks":[{"t":"p","h":"주어가 하는 일 따져 보기","x":["주어는 control and hygiene management measures(통제와 위생 관리 조치)다.","손 씻기, 깨끗한 물, 모기 막기 같은 조치다.","이런 조치가 하는 일은 병의 부담을 덜어 주는 것이다.","worsened(악화시켰다)를 넣으면 위생이 병을 키운 셈이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","lessening(줄어듦)은 reduction(감소) 자리에, long-term(장기적인)은 chronic(만성의) 자리에 들어가도 뜻이 같다.","본문 철자만 외웠다면 여기서 흔들린다."]}],"post":["reduce(줄이다) ↔ worsen(악화시키다)","콜레라·말라리아 = 위생 관리로 부담 감소"]}],"quiz":[{"w":"harmless","m":"해가 없는","it":[["safe","안전한","s"],["loyal","충실한","n"],["harmful","해로운","a"],["brief","짧은","n"],["innocuous","무해한","s"],["dangerous","위험한","a"],["distant","먼","n"]]},{"w":"breakthrough","m":"획기적 발전, 돌파구","it":[["slogan","구호","n"],["advance","발전, 진보","s"],["setback","차질, 후퇴","a"],["cabinet","수납장","n"],["innovation","혁신","s"],["failure","실패","a"],["rumor","소문","n"]]},{"w":"elimination", "만들기 → 써 보게 하기 → 문제 찾기 → 고치기.","고친 것을 다시 써 보게 한다.","이 고리가 계속 돌기 때문에 revisions(수정들)가 복수형이다."]}],"post":["subsequent(이후의) ↔ prior(이전의)","써 보게 하고 → 결과 보고 → 그다음 수정"]},{"slots":[["effective"],["close_to","attached to","s"],["objectively","subjectively","a"],["interact","deal","s"],["shaped"]],"opts":["objectively","emotionally","personally","carelessly"],"or":["objectively(객관적으로): 너무 가까워서 못 하는 일은 남의 눈으로, 곧 객관적으로 보는 것이라 맞음.","emotionally(감정적으로): 너무 가까우면 오히려 감정적으로 보게 되므로 '감정적으로 볼 수 없다'는 거꾸로임.","personally(개인적으로): 만든 사람은 자기 입장에서만 보는 게 문제라 '개인적으로 못 본다'는 안 맞음.","carelessly(대충): 가까워서 대충 못 본다는 건 글의 걱정과 관계없음."],"om":["객관적으로","감정적으로","개인적으로","대충"],"en":"We're much too close to what we build to objectively see it and understand how users will interact with it.","ko":"우리는 우리가 만드는 것에 너무 가까이 있어서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해하기 어렵다.","hl":["to objectively see it","much too close to"],"khl":["객관적으로 보고","너무 가까이 있어서"],"blocks":[{"t":"p","h":"too(너무) ~ to(…하기에) 구조","x":["much too close(너무 가까운) ... to see(보기에).","'너무 ~해서 …할 수 없다'는 구조다.","내가 만든 건 너무 익숙해서 남의 눈으로 보기 어렵다.","그래서 못 하는 것은 objectively(객관적으로) 보기다.","subjectively(주관적으로)를 넣으면 '너무 가까워서 주관적으로 못 본다'가 된다.","가까울수록 오히려 주관적으로 보게 되니 거꾸로다."]},{"t":"p","h":"함정","x":["attached to(~에 애착을 가진)는 close to(~에 가까운) 자리에 들어가도 같은 그림이다.","deal with(~을 다루다)는 interact with(~와 상호 작용하다)처럼 with(~와)를 받아 자연스럽다.","바뀐 셋 중 고칠 것은 하나."]}],"post":["objectively(객관적으로) ↔ subjectively(주관적으로)","너무 가까움 → 객관적으로 못 봄"]}],"quiz":[{"w":"embrace","m":"받아들이다","it":[["borrow","빌리다","n"],["accept","받아들이다","s"],["reject","거부하다","a"],["whisper","속삭이다","n"],["adopt","채택하다","s"],["refuse","거절하다","a"],["measure","측정하다","n"]]},{"w":"real","m":"실제의","it":[["actual","실제의","s"],["noisy","시끄러운","n"],["imaginary","상상 속의","a"],["ancient","고대의","n"],["genuine","진짜의","s"],["fake","가짜의","a"],["polite","공손한","n"]]},{"w":"uncover","m":"밝혀내다","it":[["invite","초대하다","n"],["reveal","드러내다","s"],["conceal","숨기다","a"],["repair","수리하다","n"],["expose","폭로하다, 드러내다","s"],["hide","숨기다","a"],["predict","예측하다","n"]]},{"w":"subsequent","m":"이후의, 뒤따르는","it":[["later","나중의","s"],["wooden","나무로 된","n"],["prior","이전의","a"],["honest","정직한","n"],["following","다음의","s"],["previous","이전의","a"],["brief","짧은","n"]]},{"w":"objectively","m":"객관적으로","it":[["loudly","큰 소리로","n"],["impartially","공정하게, 치우침 없이","s"],["subjectively","주관적으로","a"],["rapidly","빠르게","n"],["neutrally","중립적으로","s"],["unfairly","불공평하게","a"],["secretly","몰래","n"]]}]},{"items":[{"slots":[["uncover"],["preferences"],["engage"],["realistic","artificial","a"],["perform"]],"opts":["realistic","fictional","random","competitive"],"or":["realistic(실제와 같은): 실제 사용자 손에서 어떻게 작동할지 알려면 활동도 실제와 같아야 맞음.","fictional(허구의): 꾸며 낸 활동으로는 실제 사용 모습을 알 수 없음.","random(무작위의): 아무 활동이나 시키면 디자인의 문제를 찾기 어려움.","competitive(경쟁적인): 참가자끼리 겨루게 하는 건 사용 모습 관찰과 관계없음."],"om":["실제와 같은","허구의","무작위의","경쟁적인"],"en":"by asking participants to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users.","ko":"참가자들에게 실제와 같은 활동에 참여하도록 요청함으로써. 이 기법은 디자인이 일단 실제 사용자들의 손에 들어갔을 때 얼마나 잘 작동할지 이해하는 데 효과적이다.","hl":["engage in realistic activities","in the hands of real users"],"khl":["실제와 같은 활동에 참여하도록","실제 사용자들의 손에"],"blocks":[{"t":"p","h":"다음 문장이 답을 준다","x":["바로 다음 문장은 in the hands of real users(실제 사용자들의 손에)를 말한다.","테스트는 진짜로 쓸 때의 모습을 미리 보는 것이다.","artificial(인위적인) 활동을 시키면 진짜 모습이 나오지 않는다.","그래서 활동은 실제와 같아야 한다."]},{"t":"tap","h":"질문 하나","q":"새 쇼핑 앱을 테스트할 때 참가자에게 무엇을 시켜야 할까?","a":["평소처럼 실제로 써 보게 한다.","예를 들어 물건을 장바구니에 담고 결제하기.","그래야 진짜 문제가 드러난다."]}],"post":["realistic(실제와 같은) ↔ artificial(인위적인)","실제와 같은 활동 → 실제 사용 모습 미리 보기"]},{"slots":[["embrace","accept","s"],["effective","useless","a"],["close_to"],["observations"],["real","actual","s"]],"opts":["effective","expensive","complicated","fragile"],"or":["effective(효과적인): 뒤의 질문 how can designers shape their work to be more effective(디자이너는 어떻게 작업을 더 효과적으로 만들까?)에서 같은 단어가 다시 나와 맞음.","expensive(비싼): 더 비싼 제품을 만들려고 이 진실을 받아들이는 건 아님.","complicated(복잡한): 사용자를 관찰하는 목적은 쓰기 쉽게 만드는 것이라 반대임.","fragile(깨지기 쉬운): 제품을 약하게 만드는 건 어떤 디자이너의 목표도 아님."],"om":["효과적인","비싼","복잡한","깨지기 쉬운"],"en":"A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. … So how can designers shape their work to be more effective?","ko":"디자이너들이 더 효과적인 제품과 경험을 만들기 위해 받아들여야 하는 단순한 진실은 우리가 사용자가 아니라는 사실이다. … 그렇다면 디자이너들은 어떻게 자신의 작업을 더 효과적으로 만들 수 있을까?","hl":["more effective products and experiences","to be more effective"],"khl":["더 효과적인 제품과 경험","더 효과적으로"],"blocks":[{"t":"p","h":"같은 단어가 줄줄이","x":["effective(효과적인)는 이 글에 네 번 나온다.","첫 문장, 질문 문장, 사용성 테스트 소개, 기법 설명.","글 전체가 '어떻게 더 효과적으로'에 답하는 구조다.","useless(쓸모없는)를 넣으면 첫 문장의 목표가 쓸모없는 제품이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","accept(받아들이다)는 embrace(받아들이다)와 같은 뜻이다.","actual(실제의)은 real(실제의)과 같은 뜻이다.","둘 다 손대면 안 된다."]}],"post":["effective(효과적인) ↔ useless(쓸모없는)","글 전체의 질문 = 어떻게 더 효과적으로"]},{"slots":[["realistic"],["perform"],["improve","damage","a"],["subsequent"],["representative","typical","s"]],"opts":["improve","abandon","copy","delay"],"or":["improve(개선하다): 결과를 바탕으로 수정을 거듭하는 목적이라 맞음.","abandon(버리다): 수정을 거듭하며 작업을 버린다는 건 앞뒤가 안 맞음.","copy(베끼다): 사용자 결과로 남의 작업을 베낀다는 말은 의미가 없음.","delay(미루다): 수정을 하면서 작업을 미룬다는 건 테스트의 목적과 관계없음."],"om":["개선하다","버리다","베끼다","미루다"],"en":"Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.","ko":"디자이너들은 대표성 있는 사용자들에게서 얻은 결과를 바탕으로 이후에 수정을 거듭하며 자신의 작업을 개선하는 데 이 방법을 쓸 수 있다.","hl":["to improve their work","based on the findings"],"khl":["작업을 개선하는","결과를 바탕으로"],"blocks":[{"t":"p","h":"마지막 문장 = 결론","x":["마지막 문장은 사용성 테스트로 얻는 열매를 말한다.","결과를 보고 고치고, 또 고친다.","고치는 이유는 작업을 더 낫게 만들기 위해서다.","damage(손상시키다)를 넣으면 고칠수록 망가진다는 말이 된다."]},{"t":"p","h":"고치면 안 되는 단어","x":["typical(전형적인, 보통의) 사용자는 representative(대표성 있는) 사용자와 같은 그림이다.","보통 사람들을 잘 대표하는 참가자라는 뜻."]}],"post":["improve(개선하다) ↔ damage(손상시키다)","테스트 결과 → 수정 → 작업 개선"]},{"slots":[["interact"],["shaped"],["observations","neglect","a"],["real"],["incredibly"]],"opts":["observations","guesses","rumors","myths"],"or":["observations(관찰): 실제 사용자를 지켜본 결과가 좋은 인터페이스를 만든다는 글의 주장과 맞음.","guesses(추측): 추측은 디자이너 머릿속에서 나온 것이라 '우리는 사용자가 아니다'와 부딪침.","rumors(소문): 소문으로 인터페이스를 만든다는 건 근거 없는 디자인임.","myths(근거 없는 믿음): 근거 없는 믿음은 실제 사용자 관찰과 정반대임."],"om":["관찰","추측","소문","근거 없는 믿음"],"en":"The best user interfaces are those that have been shaped by observations of real users and their interactions with them.","ko":"가장 좋은 사용자 인터페이스는 실제 사용자들과 그들이 인터페이스와 상호 작용하는 모습을 관찰한 결과로 만들어진 것들이다.","hl":["shaped by observations of real users","The best user interfaces"],"khl":["관찰한 결과로 만들어진","가장 좋은 사용자 인터페이스"],"blocks":[{"t":"p","h":"neglect(무시)를 넣고 읽기","x":["'가장 좋은 인터페이스는 실제 사용자를 무시해서 만들어졌다'가 된다.","무시하면 디자이너 생각대로만 만들게 된다.","첫 문장이 바로 그걸 경고했다.","we are not the user(우리는 사용자가 아니다)."]},{"t":"p","h":"앞 문장과 이어 보기","x":["앞 문장: 만든 사람은 너무 가까워서 객관적으로 못 본다.","이 문장: 그러니 실제 사용자를 지켜봐야 한다.","문제 다음에 해결이 온다."]}],"post":["observation(관찰) ↔ neglect(무시)","좋은 인터페이스 = 실제 사용자 관찰"]},{"slots":[["incredibly"],["uncover","reveal","s"],["existing","nonexistent","a"],["preferences"],["perform","work","s"]],"opts":["existing","past","false","lost"],"or":["existing(이미 있는): 테스트로 '발견'하는 건 지금 실제로 있지만 못 보던 기회라 맞음.","past(지나간): 이미 지나간 기회는 지금 디자인에 쓸 수 없음.","false(거짓의): 거짓 기회를 발견하는 건 테스트의 목표가 아님.","lost(잃어버린): 잃어버린 기회를 되찾는 게 아니라 지금 있는 기회를 찾는 것임."],"om":["이미 있는","지나간","거짓의","잃어버린"],"en":"The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.","ko":"이 방법의 목표는 참가자들에게 실제와 같은 활동에 참여하도록 요청함으로써 디자인의 문제를 밝혀내고, 이미 있는 기회를 발견하고, 사용자들의 행동과 선호에 대해 더 많이 알아내는 것이다.","hl":["discover existing opportunities","uncover problems in a design"],"khl":["이미 있는 기회를 발견하고","디자인의 문제를 밝혀내고"],"blocks":[{"t":"tap","h":"질문 하나","q":"없는 것을 발견할 수 있을까?","a":["없다.","discover(발견하다)는 이미 있는데 몰랐던 것을 찾아내는 말이다.","nonexistent(존재하지 않는)를 넣으면 '없는 기회를 발견한다'는 모순이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","reveal(드러내다)은 uncover(밝혀내다)와 같은 뜻이다.","work(작동하다)는 perform(작동하다, 수행하다) 자리에 들어가도 된다.","how well a design will work(디자인이 얼마나 잘 작동할지)도 자연스럽다."]}],"post":["existing(이미 있는) ↔ nonexistent(존재하지 않는)","테스트 = 있는데 못 보던 기회 발견"]}],"quiz":[{"w":"realistic","m":"실제와 같은, 현실적인","it":[["lifelike","실물 같은","s"],["generous","관대한","n"],["unrealistic","비현실적인","a"],["punctual","시간을 잘 지키는","n"],["authentic","진짜 같은, 진품의","s"],["artificial","인위적인","a"],["fragile","깨지기 쉬운","n"]]},{"w":"effective","m":"효과적인","it":[["rural","시골의","n"],["successful","성공적인","s"],["ineffective","효과 없는","a"],["delicious","맛있는","n"],["efficient","효율적인","s"],["useless","쓸모없는","a"],["loyal","충실한","n"]]},{"w":"improve","m":"개선하다","it":[["enhance","향상시키다","s"],["celebrate","축하하다","n"],["worsen","악화시키다","a"],["arrive","도착하다","n"],["upgrade","개선하다, 업그레이드하다","s"],["impair","손상시키다","a"],["translate","번역하다","n"]]},{"w":"observation","m":"관찰","it":[["recipe","조리법","n"],["examination","조사, 검사","s"],["neglect","무시, 방치","a"],["cabinet","수납장","n"],["monitoring","감시, 관찰","s"],["disregard","무시","a"],["rumor","소문","n"]]},{"w":"existing","m":"기존의, 이미 있는","it":[["current","현재의","s"],["curious","호기심 많은","n"],["nonexistent","존재하지 않는","a"],["distant","먼","n"],["present","현재 있는","s"],["extinct","사라진, 멸종된","a"],["humble","겸손한","n"]]}]}],"no":"36"},{"id":"2610g2-37","title":"어휘특훈 · 26년 10월 고2 37번","sub":"재평가는 감정을 뿌리부터 바꾼다","tpl":"Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly {effective} avenue to {regulating} emotions because it {transforms} emotions at their {root}. Take, for example, someone who is going through a divorce. This is often an {adverse} event, and yet, it can be {construed} in different ways. One might view it as an {overpowering} loss that will mark one's family for life. Alternatively, one might see it as something that is {painful} but that might lead to {positive} outcomes in the long run, such as {improved} relationships. As a result of these different construals, one might feel different emotions. The first construal may bring {intense} sadness and anger. The second construal might also bring sadness and anger but perhaps at {lower} levels. Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude. This example {illustrates} how reappraisal might {powerfully} transform short-term emotional responses. When repeated over time, these short-term emotional consequences of reappraisal might {accumulate} to {shape} people's psychological health. Thereby, reappraisal might be a key to {resilience}.","fn":["*reappraisal: 재평가(어떤 일을 다시 보고 다르게 해석하는 것)","*avenue: 방법, 길","*divorce: 이혼","*construal: 해석"],"mean":{"effective":"효과적인","futile":"헛된, 소용없는","promising":"유망한, 전망이 밝은","regulating":"동사 regulate(조절하다)의 -ing형. 동명사","managing":"동사 manage(다스리다, 관리하다)의 -ing형. 동명사","transforms":"동사 transform(변화시키다)의 3인칭 단수 현재형","alters":"동사 alter(바꾸다)의 3인칭 단수 현재형","preserves":"동사 preserve(그대로 보존하다)의 3인칭 단수 현재형","root":"뿌리, 근본","core":"핵심, 중심","adverse":"부정적인, 불리한","unfavorable":"불리한, 좋지 않은","enjoyable":"즐거운","construed":"동사 construe(해석하다)의 과거분사형","interpreted":"동사 interpret(해석하다)의 과거분사형","overpowering":"압도적인, 너무 강한","overwhelming":"압도적인, 감당하기 힘든","insignificant":"사소한, 하찮은","painful":"고통스러운","distressing":"괴로운, 고통스러운","pleasant":"즐거운, 기분 좋은","positive":"긍정적인","harmful":"해로운","improved":"동사 improve(개선하다)의 과거분사형. 개선된","strengthened":"동사 strengthen(강화하다)의 과거분사형. 더 튼튼해진","damaged":"동사 damage(손상시키다)의 과거분사형. 손상된","intense":"강렬한","mild":"가벼운, 약한","lower":"형용사 low(낮은)의 비교급. 더 낮은","higher":"형용사 high(높은)의 비교급. 더 높은","illustrates":"동사 illustrate(보여 주다, 설명하다)의 3인칭 단수 현재형","demonstrates":"동사 demonstrate(보여 주다, 증명하다)의 3인칭 단수 현재형","conceals":"동사 conceal(숨기다)의 3인칭 단수 현재형","powerfully":"강력하게","significantly":"상당히, 크게","accumulate":"쌓이다, 축적되다","fade":"희미해지다, 사라지다","shape":"형성하다, 만들어 가다","influence":"영향을 주다","resilience":"회복 탄력성(힘든 일을 겪고도 다시 일어서는 힘)","vulnerability":"취약성, 상처받기 쉬움"},"comp":[{"no":"37","slots":[["root"],["adverse","unfavorable","s"],["overpowering"],["painful","pleasant","a"],["improved"]],"opts":["painful","cheerful","effortless","delightful"],"or":["painful(고통스러운): 뒤의 but(하지만)이 '아프지만 좋은 결과로 이어질 수 있다'는 대조를 만들어 맞음.","cheerful(쾌활한): 쾌활한 일이 좋은 결과로 이어진다면 but(하지만)으로 꺾을 이유가 없음.","effortless(힘들지 않은): 두 번째 해석도 슬픔과 분노를 불러온다고 했으니 힘들지 않은 일이 아님.","delightful(아주 즐거운): 이혼을 아주 즐거운 일로 본다는 건 '슬픔이 더 낮은 강도로' 온다는 설명과 안 맞음."],"om":["고통스러운","쾌활한","힘들지 않은","아주 즐거운"],"en":"Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.","ko":"이와는 달리, 누군가는 그것을 고통스럽기는 하지만 장기적으로는 개선된 관계와 같은 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다.","hl":["painful but","positive outcomes"],"khl":["고통스럽기는 하지만","긍정적인 결과"],"blocks":[{"t":"p","h":"but(하지만)이 묶는 두 말","x":["but(하지만)은 서로 다른 방향의 두 말을 잇는다.","앞: 지금은 아프다.","뒤: 길게 보면 좋은 결과가 올 수 있다.","pleasant(즐거운)를 넣으면 앞도 좋고 뒤도 좋다.","방향이 같은데 but(하지만)으로 꺾는 꼴이 된다."]},{"t":"p","h":"두 번째 해석도 아프다","x":["뒤 문장이 확인해 준다.","The second construal might also bring sadness and anger (두 번째 해석 역시 슬픔과 분노를 불러올지도 모른다).","두 번째 해석도 슬픔은 있다.","다만 덜할 뿐.","unfavorable(불리한)은 adverse(부정적인) 자리에 넣어도 이혼을 그대로 설명해서 고치지 않는다."]}],"post":["painful(고통스러운) ↔ pleasant(즐거운)","두 번째 해석 = 아프지만 길게 보면 좋은 일"]},{"no":"37","slots":[["painful"],["positive","harmful","a"],["intense"],["illustrates","demonstrates","s"],["shape"]],"opts":["positive","negative","tragic","damaging"],"or":["positive(긍정적인): 바로 뒤 예시 improved relationships(개선된 관계)가 좋은 결과라서 맞음.","negative(부정적인): 예시가 개선된 관계인데 부정적인 결과라고 부를 수 없음.","tragic(비극적인): 비극적인 결과라면 첫 번째 해석과 다를 게 없어 Alternatively(이와는 달리)가 무의미해짐.","damaging(해를 끼치는): 개선된 관계는 해가 아니라 이득이라 예시와 부딪침."],"om":["긍정적인","부정적인","비극적인","해를 끼치는"],"en":"Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.","ko":"이와는 달리, 누군가는 그것을 고통스럽기는 하지만 장기적으로는 개선된 관계와 같은 긍정적인 결과로 이어질 수 있는 일로 여길지도 가 이유다.","이유는 감정을 뿌리에서부터 바꾼다는 것.","뿌리부터 바꾸는 방법이 소용없을 리 없다.","futile(헛된)을 넣으면 이유와 결론이 거꾸로 붙는다.","마지막 문장도 재평가를 a key to resilience(회복 탄력성의 열쇠)라고 칭찬한다."]}],"post":["effective(효과적인) ↔ futile(헛된)","재평가 = 감정을 뿌리부터 바꾸는 방법"]},{"slots":[["transforms","alters","s"],["construed"],["overpowering","insignificant","a"],["painful","distressing","s"],["lower"]],"opts":["overpowering","minor","passing","manageable"],"or":["overpowering(압도적인): 가족에게 평생 흔적을 남기고 강렬한 슬픔을 부르는 상실이라 맞음.","minor(작은): 작은 상실이 가족에게 평생 흔적을 남긴다는 건 말이 안 됨.","passing(일시적인): for life(평생)와 정반대라 같은 문장 안에서 부딪침.","manageable(감당할 만한): 첫 번째 해석은 강렬한 슬픔과 분노를 부른다고 했으니 감당할 만한 일로 본 게 아님."],"om":["압도적인","작은","일시적인","감당할 만한"],"en":"One might view it as an overpowering loss that will mark one's family for life.","ko":"누군가는 그것을 자신의 가족에게 평생 흔적을 남길 압도적인 상실로 여길지도 모른다.","hl":["mark one's family for life","an overpowering loss"],"khl":["평생 흔적을 남길","압도적인 상실"],"blocks":[{"t":"p","h":"insignificant(사소한)를 넣고 다시 읽기","x":["\"가족에게 평생 흔적을 남길 사소한 상실\"이 된다.","평생 남는 흔적과 사소함은 함께 갈 수 없다.","게다가 이 해석이 부르는 감정은 intense sadness(강렬한 슬픔)다.","사소한 일에서 강렬한 슬픔이 나오지 않는다."]},{"t":"pair","h":"첫 번째 해석과 그 감정","x":[["an overpowering loss","압도적인 상실 (첫 번째 해석)"],["intense sadness and anger","강렬한 슬픔과 분노 (그 결과)"]]},{"t":"p","h":"고치면 안 되는 두 단어","x":["alters(바꾸다)는 transforms(변화시키다) 자리에 들어가도 뜻이 통한다.","distressing(괴로운)도 painful(고통스러운)과 같은 쪽 말이다.","겉모양이 달라도 방향이 같으면 맞는 표현."]}],"post":["overpowering(압도적인) ↔ insignificant(사소한)","첫 번째 해석 = 평생 남을 큰 상실"]},{"slots":[["regulating"],["construed","interpreted","s"],["improved","damaged","a"],["illustrates"],["shape"]],"opts":["improved","broken","strained","weakened"],"or":["improved(개선된): positive outcomes(긍정적인 결과)의 예시로 딱 맞는 말임.","broken(깨진): 깨진 관계는 좋은 결과의 예가 될 수 없음.","strained(껄끄러워진): 관계가 껄끄러워진 건 이혼의 아픈 면이지 좋은 결과가 아님.","weakened(약해진): 약해진 관계는 '길게 보면 좋은 결과'라는 두 번째 해석과 반대 방향임."],"om":["개선된","깨진","껄끄러워진","약해진"],"en":"Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.","ko":"이와는 달리, 누군가는 그것을 고통스럽기는 하지만 장기적으로는 개선된 관계와 같은 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다.","hl":["improved relationships","Alternatively"],"khl":["개선된 관계","이와는 달리"],"blocks":[{"t":"pair","h":"두 해석 나란히","x":[["an overpowering loss","압도적인 상실 (첫 번째 눈)"],["positive outcomes in the long run","장기적으로 긍정적인 결과 (두 번째 눈)"]]},{"t":"p","h":"Alternatively(이와는 달리)가 하는 일","x":["Alternatively(이와는 달리)는 앞과 다른 눈으로 보겠다는 신호다.","첫 번째 눈은 큰 상실만 본다.","두 번째 눈은 그 뒤에 올 좋은 일까지 본다.","damaged(손상된) 관계는 첫 번째 눈에 더 가까운 그림이다.","두 번째 눈의 예시가 될 수 없다."]},{"t":"p","h":"함정","x":["interpreted(해석된)는 construed(해석된)와 같은 뜻이라 고치지 않는다."]}],"post":["improved(개선된) ↔ damaged(손상된)","두 번째 눈 = 이혼 뒤 더 좋아질 관계까지 봄"]},{"slots":[["root"],["positive"],["intense"],["lower","higher","a"],["accumulate"]],"opts":["lower","greater","stronger","deeper"],"or":["lower(더 낮은): 첫 번째 해석의 intense(강렬한) 슬픔과 비교해 더 약하게 온다는 뜻이라 맞음.","greater(더 큰): 두 번째 해석이 더 큰 슬픔을 부르면 재평가가 효과적이라는 주장이 무너짐.","stronger(더 강한): but(하지만)으로 '슬픔은 오지만 덜하다'고 누그러뜨리는 흐름과 반대임.","deeper(더 깊은): 더 깊은 슬픔이라면 회복 탄력성의 열쇠라는 결론과 이어지지 않음."],"om":["더 낮은","더 큰","더 강한","더 깊은"],"en":"The first construal may bring intense sadness and anger. The second construal might also bring sadness and anger but perhaps at lower levels.","ko":"첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다. 두 번째 해석 역시 슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도일 것이다.","hl":["at lower levels","intense sadness and anger"],"khl":["더 낮은 강도","강렬한 슬픔과 분노"],"blocks":[{"t":"p","h":"두 문장을 저울에 올리기","x":["첫 번째 해석: 강렬한 슬픔과 분노.","두 번째 해석: 슬픔과 분노는 있지만 but(하지만)…","but(하지만) 뒤에는 누그러뜨리는 말이 와야 한다.","그래서 강도가 더 낮다.","higher(더 높은)를 넣으면 두 번째 해석이 더 아픈 쪽이 된다."]},{"t":"tap","h":"질문 하나","q":"두 번째 해석이 더 아프다면, 이 글은 왜 재평가를 권할까?","a":["권할 이유가 없다.","재평가가 좋은 이유는 같은 일을 덜 아프게 겪게 해 주기 때문이다.","그래서 lower(더 낮은)여야 글의 주장이 선다."]}],"post":["lower(더 낮은) ↔ higher(더 높은)","두 번째 해석 = 같은 슬픔이 더 약하게 옴"]},{"slots":[["effective","promising","s"],["adverse"],["painful"],["powerfully","significantly","s"],["accumulate","fade","a"]],"opts":["accumulate","vanish","decline","weak
