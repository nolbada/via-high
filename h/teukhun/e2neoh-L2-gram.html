<title>어법특훈 · 영어II 능률(오) 2과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

"en":"They seem to have very little in common with ordinary people like us.","ko":"그들은 우리와 같은 평범한 사람들과 공통점이 거의 없는 것 같이 보인다.","hl":["seem to have"],"khl":["없는 것 같이 보인다"],"blocks":[{"t":"p","h":"seem(~인 것 같다)은 to와 한 몸","x":["seem(~인 것 같다) + to + 동사원형 = ~하는 것 같다.","흰 가운의 과학자들은 우리와 공통점이 거의 없는 '것 같다'.","본문은 바로 다음 문장에서 이 생각이 사실과 거리가 멀다고 뒤집는다.","seem(~인 것 같다) 뒤에 -ing를 붙이면 틀린다."]},{"t":"pair","h":"쉬운 예시","x":[["He seems to be tired.","그는 피곤한 것 같다. (seem(~인 것 같다) 뒤 to + 동사원형)"],["They seem to like the song.","그들은 그 노래를 좋아하는 것 같다. (seem(~인 것 같다) 뒤 to + 동사원형)"]]}],"post":["seem(~인 것 같다) + to + 동사원형: seem to have(가진 것 같다)"]},{"slots":[["studying","","","동사 was(~였다)가 이미 있고 연구원이 연구하는 능동이라 studying(연구하는)."],["exciting","excited","a","This(이것)는 그의 연구 일이다. 흥미를 '주는' 쪽이라 -ing. excited(흥분한)는 흥미를 느끼는 사람에게 쓴다."],["was","","","주어 his job(그의 일)이 단수라 was(~였다)."],["looking","","","while(~하는 동안) 뒤에 주어를 빼고 -ing를 남긴 모양이라 looking(보는)."],["remaining","","","remain(남다)은 자동사라 명사 앞 꾸밈은 remaining(남아 있는)."]],"opts":["exciting","excite","excitedly","excitement"],"or":["exciting(흥미로운): 연구가 흥미를 주는 쪽이고 sound(~하게 들리다) 뒤 형용사 자리라 맞음.","excite(흥미를 일으키다): sound(~하게 들리다) 뒤에 동사원형이 올 수 없음.","excitedly(흥분하여): 부사라 sound(~하게 들리다) 뒤 보어 자리에 못 옴.","excitement(흥분): sound(~하게 들리다) 바로 뒤에 명사를 쓰려면 like(~처럼)가 필요함."],"point":"감정동사의 분사 (-ing vs. -ed)","en":"This might sound exciting, but his job there was dull and time-consuming.","ko":"이것(그의 연구)은 흥미롭게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸렸다.","hl":["sound exciting","dull"],"khl":["흥미롭게 들릴지도","따분하고"],"blocks":[{"t":"p","h":"느끼게 하는 쪽 vs 느끼는 쪽","x":["블랙홀과 은하의 진화 연구라니, 겉으로는 흥미롭게 들린다.","This(이것)는 사람이 아니라 '그 연구'다. 흥미를 주는 쪽이라 exciting(흥미로운).","excited(흥분한)는 흥미를 느끼는 사람 쪽 말이다.","하지만 실제 일은 dull(따분한)하고 time-consuming(시간이 많이 걸리는)이었다는 반전이 온다."]},{"t":"pair","h":"쉬운 예시","x":[["The game was exciting.","그 경기는 흥미진진했다. (경기가 흥미를 줌)"],["The fans were excited.","팬들은 신이 났다. (팬들이 흥미를 느낌)"]]}],"post":["주는 쪽 -ing, 느끼는 쪽 -ed: sound exciting(흥미롭게 들리다)"]},{"slots":[["to_have","","","seem(~인 것 같다) 뒤에는 to + 동사원형이라 to have(가지는 것)가 맞다."],["belongs","is belonged","a","belong(~의 것이다)은 목적어가 없는 자동사라 be + p.p.(수동태)로 못 쓴다."],["to_play","","","명사 the ability(능력)를 뒤에서 꾸미는 to부정사 to play(할)가 맞다."],["have_been","","","진짜 주어 numerous projects(수많은 프로젝트들)가 복수라 have been(있어 왔다)."],["made","","","사람들이 기여를 한 능동이고 뒤에 목적어 contributions(기여)가 있어 have made(해 왔다)."]],"opts":["belongs","belong","belonging","to belong"],"or":["belongs(~의 것이다): 주어 science(과학)가 단수이고, 자동사라 능동으로 쓰는 게 맞음.","belong(~의 것이다): 주어 science(과학)가 단수라 s가 필요함.","belonging(속하는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐.","to belong(속하는 것): to부정사도 동사 자리에 못 옴."],"point":"능동태 vs. 수동태 (자동사)","en":"In reality, science belongs to everyone, and we all have the ability to play a role in the advancement of science.","ko":"사실은, 과학은 모두의 것이며, 우리는 모두 과학의 발전에 일조할 수 있는 능력이 있다.","hl":["science belongs to everyone"],"khl":["과학은 모두의 것이며"],"blocks":[{"t":"p","h":"수동태가 안 되는 동사","x":["수동태는 '~을 당하다'다. 당할 목적어가 있는 동사만 만들 수 있다.","belong to(~의 것이다)는 목적어 없이 to(~에게)로 이어지는 자동사다.","그래서 is belonged(속해진다)는 없는 모양이다.","같은 무리: happen(일어나다), appear(나타나다), disappear(사라지다).","본문의 핵심 주장: 과학은 흰 가운의 것이 아니라 모두의 것."]},{"t":"pair","h":"쉬운 예시","x":[["This bag belongs to me.","이 가방은 내 것이다. (is belonged(속해진다)는 틀림)"],["The accident happened last night.","그 사고는 어젯밤에 일어났다. (was happened(일어나졌다)는 틀림)"]]}],"post":["belong to(~의 것이다)는 수동태 불가: science belongs to everyone(과학은 모두의 것)"]}],"quiz":[{"s":"I know two girls who ___ in my town.","o":["live","lives"],"a":0,"ko":"나는 우리 동네에 사는 소녀 두 명을 안다.","why":"선행사 two girls(소녀 두 명)가 복수라 live(살다).","wy":"lives(살다, 3인칭 단수형): 선행사 two girls(소녀 두 명)가 복수라 s가 붙으면 안 됨."},{"s":"The man ___ a red hat is my uncle.","o":["wears","wearing"],"a":1,"ko":"빨간 모자를 쓴 남자는 우리 삼촌이다.","why":"동사 is(~이다)가 이미 있어 꾸밈말 wearing(쓰고 있는).","wy":"wears(쓰다): 접속사 없이 동사 is(~이다)와 겹침."},{"s":"She seems ___ the answer.","o":["to know","knowing"],"a":0,"ko":"그녀는 답을 아는 것 같다.","why":"seem(~인 것 같다) + to + 동사원형.","wy":"knowing(아는): seem(~인 것 같다) 바로 뒤에 -ing는 못 옴."},{"s":"The movie was really ___.","o":["bored","boring"],"a":1,"ko":"그 영화는 정말 지루했다.","why":"영화가 지루함을 주는 쪽이라 boring(지루한).","wy":"bored(지루해하는): 지루함을 느끼는 사람에게 쓰는 말."},{"s":"The accident ___ last night.","o":["happened","was happened"],"a":0,"ko":"그 사고는 어젯밤에 일어났다.","why":"happen(일어나다)은 자동사라 능동 happened(일어났다).","wy":"was happened(일어나졌다): 자동사 happen(일어나다)은 수동태로 못 씀."}]},{"items":[{"slots":[["exciting","","","sound(~하게 들리다) 뒤 형용사 자리. 연구가 흥미를 주는 쪽이라 exciting(흥미로운)."],["was","were","a","주어는 his job(그의 일) 하나다. there(그곳에서)는 꾸밈말일 뿐이라 단수 was(~였다)."],["similar","","","looked(~해 보였다) 뒤 형용사 보어 자리라 similar(비슷한)가 맞다."],["individually","","","동사 looking at(보는)을 꾸미는 부사라 individually(개별적으로)."],["to_classify","","","It took(시간이 걸렸다) + 사람 + 시간 + to부정사 틀이라 to classify(분류하는 것)."]],"opts":["was","be","being","been"],"or":["was(~였다): 주어 his job(그의 일)이 단수이고 과거 이야기라 맞음.","be(~이다): 주어 뒤 동사 자리에 동사원형은 못 옴.","being(~인): -ing는 혼자 동사 자리에 못 옴.","been(~였던): have(완료 조동사) 없이 혼자 동사 자리에 못 옴."],"point":"주어와 동사의 수일치","en":"This might sound exciting, but his job there was dull and time-consuming.","ko":"이것(그의 연구)은 흥미롭게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸렸다.","hl":["his job there was"],"khl":["그의 일은"],"blocks":[{"t":"p","h":"꼬리표 there(그곳에서) 떼기","x":["주어는 his job(그의 일), 하나다.","there(그곳에서)는 '옥스퍼드에서의'라는 꼬리표라 수에 영향이 없다.","그 일이 왜 따분했나? 백만 장의 은하 사진을 모양별로 나눠야 했기 때문이다.","단수 주어 + 과거 → was(~였다)."]},{"t":"pair","h":"쉬운 예시","x":[["My job at the store was easy.","가게에서의 내 일은 쉬웠다. (주어 My job(내 일) 단수)"],["The books on the desk were heavy.","책상 위의 책들은 무거웠다. (주어 The books(책들) 복수)"]]}],"post":["his job(그의 일) + there(그곳에서) → 단수 was(~였다)"]},{"slots":[["who","","","선행사 scientists(과학자들)는 사람이고 뒤에 주어가 빠져 있어 who(~하는)가 맞다."],["belongs","","","belong(~의 것이다)은 수동태가 없는 자동사. 주어 science(과학)가 단수라 belongs(~의 것이다)."],["have_been","has been","a","There(~이 있다) 구문은 동사 뒤의 명사가 진짜 주어다. numerous projects(수많은 프로젝트들)가 복수라 have been(있어 왔다)."],["in_which","","","뒤 문장이 완전하고 '그 프로젝트들 안에서'라는 뜻이라 in which(그 안에서)가 맞다."],["studying","","","동사 was(~였다)가 이미 있고 연구원이 연구하는 능동이라 studying(연구하는)."]],"opts":["have been","having been","to be","being"],"or":["have been(있어 왔다): 진짜 주어 numerous projects(수많은 프로젝트들)가 복수라 맞음.","having been(있어 온): -ing형이라 동사 자리에 못 와서 문장에 동사가 없어짐.","to be(있는 것): to부정사는 동사 자리에 못 옴.","being(있는): -ing는 혼자 동사 자리에 못 옴."],"point":"There 구문의 수일치","en":"There have been numerous citizen science projects in which ordinary people have made contributions to remarkable scientific accomplishments.","ko":"평범한 사람들이 놀라운 과학적 업적에 기여한 수많은 시민 과학 프로젝트들이 있었다.","hl":["There have been numerous citizen science projects"],"khl":["수많은 시민 과학 프로젝트들이 있었다"],"blocks":[{"t":"p","h":"There(~이 있다)는 자리만 채운다","x":["There(~이 있다)는 자리만 채우는 말이고, 진짜 주어는 동사 뒤에 있다.","동사 뒤를 보면 numerous citizen science projects(수많은 시민 과학 프로젝트들).","복수니까 has been(있어 왔다, 단수형)이 아니라 have been(있어 왔다).","본문은 이제 그 프로젝트 중 두 가지를 보여 준다. 은하 분류와 STEVE(스티브) 발견."]},{"t":"pair","h":"쉬운 예시","x":[["There is a cat under the table.","탁자 아래에 고양이 한 마리가 있다. (a cat(고양이 한 마리) 단수 → is(있다))"],["There have been many changes.","많은 변화가 있어 왔다. (many changes(많은 변화) 복수 → have been(있어 왔다))"]]}],"post":["There(~이 있다) + 동사 + 진짜 주어: have been numerous projects(수많은 프로젝트들이 있어 왔다)"]},{"slots":[["was","","","주어 his job(그의 일)이 단수라 was(~였다)."],["similar","similarly","a","look(~해 보이다)은 뒤에 상태를 말하는 형용사를 받는다. 부사 similarly(비슷하게)는 이 자리에 못 온다."],["looking","","","while(~하는 동안) 뒤에 주어를 빼고 -ing를 남긴 모양이라 looking(보는)."],["to_classify","","","It took(시간이 걸렸다) + 사람 + 시간 + to부정사 틀이라 to classify(분류하는 것)."],["remaining","","","remain(남다)은 자동사라 명사 앞 꾸밈은 remaining(남아 있는)."]],"opts":["similar","similarity","similarities","resembling"],"or":["similar(비슷한): looked(~해 보였다) 뒤 형용사 보어 자리라 맞음.","similarity(유사성): look(~해 보이다) 뒤에 명사를 쓰려면 like(~처럼)가 필요함.","similarities(유사점들): 명사라 looked(~해 보였다) 뒤 보어 자리에 맞지 않음.","resembling(닮은): resemble(닮다)은 목적어가 꼭 필요한데 뒤에 목적어가 없음."],"point":"형용사 자리 vs. 부사 자리","en":"Since they all looked similar but were actually shaped slightly differently, the best way to do this was to sort them while looking at each one individually.","ko":"그것들은 모두 비슷해 보였지만 사실 모양이 조금씩 달랐기 때문에, 이것을 해내는 가장 좋은 방법은 하나하나를 개별적으로 보면서 분류하는 것이었다.","hl":["looked similar"],"khl":["비슷해 보였지만"],"blocks":[{"t":"p","h":"감각동사 뒤는 형용사","x":["look(~해 보이다), sound(~하게 들리다), feel(~하게 느껴지다) 뒤에는 형용사가 온다.","은하 사진들은 모두 비슷해 보였다.","하지만 실제 모양은 조금씩 달랐다. 그래서 하나하나 눈으로 봐야 했다.","similarly(비슷하게)는 동작을 꾸미는 부사라 보어 자리에 못 온다."]},{"t":"pair","h":"쉬운 예시","x":[["You look happy today.","너 오늘 행복해 보여. (happily(행복하게)는 틀림)"],["The soup smells good.","그 수프는 좋은 냄새가 난다. (well(잘)은 틀림)"]]}],"post":["looked(~해 보였다) + 형용사: looked similar(비슷해 보였다)"]},{"slots":[["analyzing","","","and(그리고)로 conducting(실시하는)과 나란한 -ing라 analyzing(분석하는)이 맞다."],["to_play","","","명사 the ability(능력)를 뒤에서 꾸미는 to부정사 to play(할)가 맞다."],["in_which","which","a","뒤 문장 ordinary people have made contributions(평범한 사람들이 기여해 왔다)는 빠진 것 없이 완전하다. which(~하는)만 쓰면 빠진 자리가 있어야 한다."],["made","","","사람들이 기여를 한 능동이고 뒤에 목적어 contributions(기여)가 있어 have made(해 왔다)."],["exciting","","","sound(~하게 들리다) 뒤 형용사 자리. 연구가 흥미를 주는 쪽이라 exciting(흥미로운)."]],"opts":["in which","what","in what","who"],"or":["in which(그 안에서): 뒤 문장이 완전하고 '그 프로젝트들 안에서'라는 뜻이라 맞음.","what(~하는 것): 앞에 명사 projects(프로젝트들)가 있어서 못 옴.","in what(~하는 것 안에서): what(~하는 것)은 앞에 명사가 있으면 전치사가 붙어도 못 씀.","who(~하는): 사람을 받는 말이고, 뒤 문장도 완전해서 못 옴."],"point":"전치사 + 관계대명사","en":"There have been numerous citizen science projects in which ordinary people have made contributions to remarkable scientific accomplishments.","ko":"평범한 사람들이 놀라운 과학적 업적에 기여한 수많은 시민 과학 프로젝트들이 있었다.","hl":["projects in which ordinary people have made contributions"],"khl":["평범한 사람들이 놀라운 과학적 업적에 기여한"],"blocks":[{"t":"p","h":"완전한 문장 앞엔 전치사를 붙인다","x":["in which(그 안에서)는 '그 프로젝트들 안에서'라는 뜻이다.","뒤 문장은 주어 ordinary people(평범한 사람들), 동사 have made(해 왔다), 목적어 contributions(기여)까지 다 있다.","빠진 게 없으니 which(~하는) 혼자는 못 오고 in which(그 안에서)가 된다.","평범한 사람들이 과학에 기여한 무대가 바로 그 프로젝트들이다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the house in which I was born.","이곳이 내가 태어난 집이다. (뒤 문장 완전 → in which(그 안에서))"],["This is the house which my dad built.","이것이 x":[["She spent the weekend reading books.","그녀는 책을 읽으며 주말을 보냈다. (spent(보냈다) + 시간 + -ing)"],["I spend an hour walking every day.","나는 매일 한 시간을 걸으며 보낸다. (spend(보내다) + 시간 + -ing)"]]}],"post":["spend(보내다) + 시간 + -ing: spend their days conducting(실험하며 나날을 보내다)"]},{"no":"본문 ❶❷","slots":[["to_have","","","seem(~인 것 같다) 뒤에는 to + 동사원형이라 to have(가지는 것)가 맞다."],["in_which","","","뒤 문장이 완전하고 '그 프로젝트들 안에서'라는 뜻이라 in which(그 안에서)가 맞다."],["exciting","","","sound(~하게 들리다) 뒤 형용사 자리. 연구가 흥미를 주는 쪽이라 exciting(흥미로운)."],["individually","","","동사 looking at(보는)을 꾸미는 부사라 individually(개별적으로)."],["remaining","remained","a","remain(남다)은 목적어 없는 자동사라 '남겨진'이라는 p.p. 꾸밈이 없다. '남아 있는'은 -ing."]],"opts":["remaining","remain","remains","to remain"],"or":["remaining(남아 있는): 스스로 남아 있는 상태라 -ing가 명사 앞에서 꾸미는 게 맞음.","remain(남다): the(그) 뒤 꾸밈 자리에 동사원형은 못 옴.","remains(남다, 3인칭 단수형): the(그)와 숫자 사이 꾸밈 자리에 동사가 못 옴.","to remain(남는 것): 명사 앞에서 꾸밀 때 to부정사는 못 옴."],"point":"능동 v-ing vs. 수동 p.p.","en":"It took Schawinski a whole week to classify just 50,000 galaxies. He thought, “But what about the remaining 950,000?”","ko":"Schawinski가 고작 5만 개의 은하를 분류하는 데 꼬박 일주일이 걸렸다. 그는 ‘하지만 남아 있는 95만 개는 어쩌지?’라고 생각했다.","hl":["the remaining 950,000"],"khl":["남아 있는 95만 개"],"blocks":[{"t":"p","h":"남는 건 스스로 남는다","x":["remain(남다)은 '남겨지다'라는 당하는 뜻이 없는 자동사다.","그래서 명사를 꾸밀 때도 remaining(남아 있는)만 된다.","일주일에 5만 개. 남은 95만 개를 혼자 하면 19주가 더 걸린다.","이 막막함이 Galaxy Zoo(갤럭시 주)를 만든 출발점이다."]},{"t":"pair","h":"쉬운 예시","x":[["Eat the remaining cookies.","남아 있는 쿠키를 먹어라. (remaining(남아 있는))"],["The remaining time is five minutes.","남은 시간은 5분이다. (remaining(남아 있는))"]]}],"post":["remain(남다)은 자동사 → the remaining 950,000(남아 있는 95만 개)"]}],"compquiz":[{"s":"He spent the evening ___ TV.","o":["watch","watching"],"a":1,"ko":"그는 TV를 보며 저녁 시간을 보냈다.","why":"spend(보내다) + 시간 + -ing라 watching(보는 것).","wy":"watch(보다): spend(보내다) + 시간 뒤에 동사원형은 못 옴."},{"s":"Look at the ___ snow on the roof.","o":["remaining","remained"],"a":0,"ko":"지붕 위에 남아 있는 눈을 봐.","why":"remain(남다)은 자동사라 '남아 있는'은 remaining(남아 있는).","wy":"remained(남겨진): 자동사 remain(남다)은 수동 꾸밈 p.p.로 못 씀."}]},{"id":"e2g-2c","no":"본문 ❸❹","title":"어법특훈 · 영어II 2과 본문 ❸+❹","sub":"Galaxy Zoo의 탄생 + Zooniverse로","fn":["*crowdsourced: 대중의 참여로 이루어지는(크라우드소싱)"],"tpl":"One evening after work, Schawinski met a friend {named|named} Chris Lintott and {complained|complained} about the situation. Lintott suggested {that_sug|that} he {turn|turn} to the Internet to ask other people for help. Eventually, the two men ended up {launching|launching} a crowdsourced online project {known|known} as Galaxy Zoo. The website was kept as {simple|simple} as possible, with a very basic design and an easy-to-use interface. This allowed those who wanted to participate {to_get|to get} started quickly. New visitors were greeted with a brief tutorial that explained the project. Then they were shown an image of a galaxy and asked {to_click|to click} buttons that described its features. Is the galaxy smooth and rounded? Is its shape an oval or a spiral? After completion of the tutorial and a little bit of practice, the participants were able to classify galaxies {effectively|effectively}. It was online media {that_cleft|that} helped spread the word about Galaxy Zoo, {bringing|bringing} more and more participants to the website. Shortly after the website was launched, nearly 70,000 classifications were being {made|made} per hour. In a year and a half, more than 80,000 individuals {participated|participated}, and they made more than 75 million classifications. If it {had|had} not been for those participants, Schawinski couldn’t have classified that many images. In fact, it would have taken him decades on his own. More than 15 years have {passed|passed} since the project first began in 2007. Galaxy Zoo has now grown into Zooniverse, {which|which} is one of the most popular {platforms|platforms} on the Internet for ordinary people who want to participate in science projects. It is more active than ever before, with about 2 million registered users worldwide. It now offers a wide range of projects in astronomy, biology, physics, and more. If you want to get {involved|involved}, you should definitely {check_it_out|check it out}!","mean":{"named":"~라는 이름의, 이름 붙여진(name의 과거분사형)","naming":"이름 짓는(name의 -ing형)","name":"이름 짓다(동사원형)","names":"이름 짓다(name의 3인칭 단수 현재형)","has named":"이름 지어 왔다(name의 현재완료형)","complained":"불평했다(complain의 과거형)","that":"~라고, ~라는 것(접속사) / ~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","which":"그것은, ~하는(관계대명사)","whom":"~을(목적격 관계대명사)","whose":"~의(소유격 관계대명사)","who":"~하는, 그는(사람을 받는 관계대명사)","it":"그것(대명사)","turn":"의지하다(동사원형)","launching":"시작하는 것(launch의 -ing형, 동명사)","to launch":"시작하는 것(launch의 to부정사)","launch":"시작하다(동사원형)","launches":"시작하다(launch의 3인칭 단수 현재형)","being launched":"시작되는(launch의 수동 -ing형)","known":"알려진(know의 과거분사형)","simple":"단순한(형용사)","to get":"~하게 되는 것(get의 to부정사)","get":"~하게 되다(동사원형)","getting":"~하게 되는(get의 -ing형)","got":"~하게 되었다(get의 과거형)","gets":"~하게 되다(get의 3인칭 단수 현재형)","to click":"클릭하는 것(click의 to부정사)","clicking":"클릭하는(click의 -ing형)","click":"클릭하다(동사원형)","clicked":"클릭했다(click의 과거형·과거분사형)","clicks":"클릭하다(click의 3인칭 단수 현재형)","effectively":"효과적으로(부사)","effective":"효과적인(형용사)","effect":"효과(명사)","effects":"효과들(명사 effect의 복수형)","effectiveness":"효과성(명사)","bringing":"데려오는, 불러 모으는(bring의 -ing형)","brought":"데려왔다(bring의 과거형·과거분사형)","bring":"데려오다(동사원형)","brings":"데려오다(bring의 3인칭 단수 현재형)","been brought":"데려와진(bring의 수동 완료형 일부)","made":"이루어진, 만들어진(make의 과거분사형)","making":"만드는(make의 -ing형)","make":"하다, 만들다(동사원형)","to make":"하는 것(make의 to부정사)","makes":"하다(make의 3인칭 단수 현재형)","participated":"참여했다(participate의 과거형)","had":"~했다면(완료 조동사 have의 과거형)","has":"~해 왔다(완료 조동사, 3인칭 단수 현재형)","have":"~해 왔다(완료 조동사 원형·현재형)","having":"~한(have의 -ing형)","would have":"~했을 것이다(would + have, 주절용)","passed":"지났다(pass의 과거분사형)","platforms":"플랫폼들(명사 platform의 복수형)","platform":"플랫폼(명사, 단수)","platform’s":"플랫폼의(명사 platform의 소유격)","a platform":"플랫폼 하나(단수)","the platform":"그 플랫폼(단수)","involved":"관여된, 참여한(involve의 과거분사형)","check i 짐 → named(이름 붙여진))"],["The man driving the bus is kind.","그 버스를 운전하는 남자는 친절하다. (남자가 운전함 → driving(운전하는))"]]}],"post":["a friend named(~라는 이름의 친구) + Chris Lintott(크리스 린토트)"]},{"slots":[["that_cleft","","","It was ~ that(~한 것은 바로 ~였다) 강조 구문의 that이라 맞다."],["bringing","brought","a","문장의 동사는 was(~였다)다. 접속사 없이 콤마 뒤에 동사 brought(데려왔다)를 또 쓸 수 없다."],["made","","","분류는 '이루어지는' 쪽이라 were being(되고 있었다) + p.p. made(이루어진)가 맞다."],["participated","","","주어 80,000 individuals(8만 명의 개인)의 동사이고 자동사라 능동 participated(참여했다)."],["had","","","If it had not been for(~가 없었다면): 과거를 반대로 가정하는 had(완료 조동사)가 맞다."]],"opts":["bringing","bring","brings","been brought"],"or":["bringing(데려오는): 동사 was(~였다)가 이미 있어 콤마 뒤 결과를 덧붙이는 분사구문이라 맞음.","bring(데려오다): 접속사 없이 동사원형이 또 올 수 없음.","brings(데려오다, 3인칭 단수형): 접속사 없이 동사가 두 개가 됨.","been brought(데려와진): have(완료 조동사) 없이 혼자 못 쓰고, 온라인 미디어가 직접 데려온 능동임."],"point":"분사구문 (결과)","en":"It was online media that helped spread the word about Galaxy Zoo, bringing more and more participants to the website.","ko":"Galaxy Zoo에 대한 소문을 퍼뜨리는 데 도움을 준 것은 바로 온라인 미디어였고, 그것은 그 웹사이트에 점점 더 많은 참여자를 불러 모았다.","hl":["bringing more and more participants"],"khl":["점점 더 많은 참여자를 불러 모았다"],"blocks":[{"t":"p","h":"콤마 뒤 -ing는 '그래서 ~하면서'","x":["문장의 동사 칸은 was(~였다)가 차지했다.","콤마 뒤에 접속사 없이 또 동사를 쓰면 동사가 두 개가 된다.","그래서 bringing(데려오는)처럼 -ing로 결과를 덧붙인다.","온라인 미디어가 소문을 퍼뜨림 → 그 결과 사람들이 몰려옴."]},{"t":"pair","h":"쉬운 예시","x":[["He studied hard, passing the test.","그는 열심히 공부해서 시험에 합격했다. (콤마 + -ing = 결과)"],["The bus left early, making me late.","버스가 일찍 떠나서 나는 늦었다. (콤마 + -ing = 결과)"]]}],"post":["동사 was(~였다) 있음 → 콤마 + bringing(불러 모으며)"]},{"slots":[["named","","","친구는 그 이름으로 '불리는' 쪽이라 p.p. named(~라는 이름의)가 맞다."],["that_sug","what","a","뒤 문장 he turn to the Internet(그가 인터넷에 의지하다)은 빠진 것 없이 완전하다. what(~하는 것)은 뒤에 빠진 자리가 있어야 한다."],["turn","","","제안의 suggest(제안하다) 뒤 that절은 (should(~해야 한다)) + 동사원형이라 turn(의지하다)이 맞다."],["known","","","프로젝트가 '알려진' 쪽이라 p.p. known as(~라고 알려진)가 맞다."],["simple","","","was kept(유지되었다) 뒤 상태를 말하는 형용사 보어 자리라 simple(단순한)이 맞다."]],"opts":["that","which","whom","whose"],"or":["that(~라고): 뒤 문장이 완전하고 suggested(제안했다)의 목적어 문장을 이끄는 접속사라 맞음.","which(~하는): 앞에 꾸밀 명사도 없고 뒤 문장도 완전해서 못 옴.","whom(~을): 목적어가 빠진 문장 앞에 쓰는 말인데 뒤 문장이 완전함.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 he(그)가 와서 안 됨."],"point":"that vs. what","en":"Lintott suggested that he turn to the Internet to ask other people for help.","ko":"Lintott은 그가 다른 사람들에게 도움을 요청하기 위해 인터넷에 의지할 것을 제안했다.","hl":["suggested that he turn to the Internet"],"khl":["인터넷에 의지할 것을 제안했다"],"blocks":[{"t":"p","h":"뒤가 완전하면 that(~라고)","x":["친구 Lintott(린토트)의 해결책: 인터넷으로 다른 사람들에게 도움을 청해라.","that(~라고) 뒤: 주어 he(그), 동사 turn(의지하다), to the Internet(인터넷에)까지 빠진 게 없다.","what(~하는 것)은 자기 안에 빈자리를 품고 다닌다. 뒤가 완전하면 못 온다.","turn(의지하다)이 원형인 이유: 제안의 suggest(제안하다) 뒤 that절은 (should(~해야 한다)) + 동사원형."]},{"t":"pair","h":"쉬운 예시","x":[["I think that he is honest.","나는 그가 정직하다고 생각한다. (뒤가 완전 → that(~라고))"],["I know what he wants.","나는 그가 원하는 것을 안다. (wants(원하다)의 목적어가 빠짐 → what(~하는 것))"]]}],"post":["suggested that(~라고) + 완전한 문장: that he turn(그가 의지할 것)"]},{"slots":[["bringing","","","동사 was(~였다)가 이미 있어 콤마 뒤 결과를 덧붙이는 분사 bringing(데려오는)이 맞다."],["made","making","a","분류는 '이루어지는' 쪽이다. were being(되고 있었다) 뒤에는 p.p.가 와야 진행 수동태가 된다."],["participated","","","주어 80,000 individuals(8만 명의 개인)의 동사이고 자동사라 능동 participated(참여했다)."],["passed","","","시간이 스스로 지나간 것이라 능동 have passed(지났다)가 맞다."],["which","","","콤마 뒤에서 Zooniverse(주니버스)를 덧붙여 설명하는 which(그것은)가 맞다."]],"opts":["made","make","to make","makes"],"or":["made(이루어진): were being(되고 있었다) + p.p. 진행 수동이라 맞음.","make(하다): being(되고 있는) 뒤에 동사원형은 못 옴.","to make(하는 것): being(되고 있는) 뒤에 to부정사는 못 옴.","makes(하다, 3인칭 단수형): being(되고 있는) 뒤에 동사가 또 올 수 없음."],"point":"진행형 수동태 (be being p.p.)","en":"Shortly after the website was launched, nearly 70,000 classifications were being made per hour.","ko":"웹사이트가 개설된 지 얼마 지나지 않아, 시간당 약 7만 건의 분류가 이루어지고 있었다.","hl":["were being made per hour"],"khl":["시간당 약 7만 건의 분류가 이루어지고 있었다"],"blocks":[{"t":"p","h":"be being p.p. = ~되고 있는 중","x":["be + being(되 try to get"],"khl":["집을 나서","찍으려고 하곤 했다"],"blocks":[{"t":"p","h":"would(~하곤 했다)는 두 동사를 함께 거느린다","x":["would(~하곤 했다)는 지난날 자주 하던 습관을 말한다.","밤에 집을 나섬 + 오로라 사진을 찍으려 함. 두 동작 모두 would(~하곤 했다)에 걸린다.","would(~하곤 했다) 뒤는 동사원형이니 leave(떠나다)도 try(노력하다)도 원형.","trying(노력하는)을 넣으면 and(그리고) 양쪽 모양이 어긋난다."]},{"t":"pair","h":"쉬운 예시","x":[["We would go to the beach and swim.","우리는 해변에 가서 수영하곤 했다. (would(~하곤 했다) + 원형 and 원형)"],["You can sit down and rest.","너는 앉아서 쉬어도 된다. (can(~해도 된다) + 원형 and 원형)"]]}],"post":["would leave ~ and try(집을 나서 ~하려 하곤 했다): and 양쪽 동사원형"]},{"slots":[["them","","","공유하는 것은 photographs(사진들), 복수라 them(그것들을)이 맞다."],["appearing","to appear","a","notice(알아채다)는 지각동사라 목적어 뒤에 -ing나 동사원형을 쓴다. to부정사 to appear(나타나는 것)는 못 온다."],["which","","","some of which(그중 일부는)가 콤마 앞뒤 문장을 이어 주는 관계대명사라 맞다."],["to_stretch","","","seem(~인 것 같다) + to부정사라 to stretch(뻗어 있는 것)가 맞다."],["lasted","","","last(지속되다)는 자동사라 능동 lasted(지속되었다)가 맞다."]],"opts":["appearing","appearance","being appeared","to appearing"],"or":["appearing(나타나는): notice(알아채다) + 목적어 + -ing라 맞음.","appearance(출현): 명사라 목적어 뒤 보어 자리에서 동작을 나타낼 수 없음.","being appeared(나타나지는): appear(나타나다)는 자동사라 수동으로 못 씀.","to appearing(나타나는 것으로): notice(알아채다) 뒤에 전치사 to가 낄 자리가 없음."],"point":"목적격보어(지각동사)","en":"In the summer of 2014, the group members began to notice something strange appearing in the night sky.","ko":"2014년 여름, 그 단체 구성원들은 밤하늘에 이상한 무언가가 나타나는 것을 알아채기 시작했다.","hl":["notice something strange appearing"],"khl":["이상한 무언가가 나타나는 것을 알아채기"],"blocks":[{"t":"p","h":"지각동사 + 목적어 + -ing/원형","x":["see(보다), hear(듣다), watch(지켜보다), notice(알아채다)는 지각동사다.","지각동사 + 목적어 뒤에는 -ing(진행 중인 모습)나 동사원형이 온다. to는 못 온다.","2014년 여름, 밤하늘에 이상한 무언가가 나타나는 장면이 포착됐다.","something(무언가) 같은 말은 형용사가 뒤에서 꾸민다: something strange(이상한 무언가)."]},{"t":"pair","h":"쉬운 예시","x":[["I saw a bird flying in the sky.","나는 새 한 마리가 하늘을 나는 것을 보았다. (saw(보았다) + 목적어 + -ing)"],["I heard him sing a song.","나는 그가 노래하는 것을 들었다. (heard(들었다) + 목적어 + 동사원형)"]]}],"post":["notice(알아채다) + 목적어 + -ing: notice something strange appearing(이상한 것이 나타나는 걸 알아채다)"]},{"slots":[["which","","","some of which(그중 일부는)가 콤마 앞뒤 문장을 이어 주는 관계대명사라 맞다."],["lasted","were lasted","a","last(지속되다)는 목적어가 없는 자동사라 be + p.p.(수동태)로 못 쓴다."],["while","","","뒤에 주어 they(그것들)와 동사 remained(머물렀다)가 있는 절이라 접속사 while(~인 반면)이 맞다."],["remained","","","remain(머무르다)도 자동사라 능동 remained(머물렀다)가 맞다."],["possessed","","","yet(그러나) 뒤 주어 they(그것들)의 동사라 과거형 possessed(지니고 있었다)가 맞다."]],"opts":["lasted","lasting","to last","been lasted"],"or":["lasted(지속되었다): 자동사 last(지속되다)의 과거형 능동이라 맞음.","lasting(지속되는): -ing는 혼자 동사 자리에 못 옴.","to last(지속되는 것): to부정사는 동사 자리에 못 옴.","been lasted(지속되어진): 자동사라 수동이 안 되고 have(완료 조동사)도 없음."],"point":"능동태 vs. 수동태 (자동사)","en":"Sometimes they lasted for just a few minutes, while other times they remained in the sky for a whole hour.","ko":"그것들은 어떤 때에는 단 몇 분간 지속되었지만, 다른 때에는 한 시간 내내 하늘에 머무르기도 했다.","hl":["they lasted for just a few minutes"],"khl":["단 몇 분간 지속되었지만"],"blocks":[{"t":"p","h":"스스로 이어지는 last(지속되다)","x":["last(지속되다)는 '누가 ~을 지속시키다'가 아니라 '스스로 이어지다'다.","당할 목적어가 없으니 수동태 were lasted(지속되어졌다)는 없는 모양.","빛의 띠는 몇 분 만에 사라지기도, 한 시간 내내 머물기도 했다.","뒤의 remained(머물렀다)도 같은 자동사라 능동."]},{"t":"pair","h":"쉬운 예시","x":[["The meeting lasted two hours.","회의는 두 시간 동안 이어졌다. (was lasted(지속되어졌다)는 틀림)"],["The rain lasted all day.","비가 하루 종일 이어졌다. (자동사 lasted(이어졌다))"]]}],"post":["last(지속되다)는 자동사: they lasted(그것들은 지속되었다)"]},{"slots":[["possessed","","","yet(그러나) 뒤 주어 they(그것들)의 동사라 과거형 possessed(지니고 있었다)가 맞다."],["unsure","Unsurely","a","원래 Being unsure of ~(~를 확신하지 못한 상태로)에서 Being(~인 상태로)이 빠진 모양이다. be동사 뒤 보어 자리라 형용사가 맞다."],["they_were","","","of(~에 대해) 뒤 간접의문문이라 의문사 + 주어 + 동사 순서 what they were(그것들이 무엇인지)."],["to_name","","","decide(결정하다) + to부정사라 to name(이름 짓는 것)이 맞다."],["where","","","뒤 문장이 완전하고 영화 장면을 꾸미는 관계부사라 where(~하는)가 맞다."]],"opts":["Unsure","Uncertainly","Uncertainty","Unsureness"],"or":["Unsure(확신하지 못한): Being(~인 상태로)이 생략된 자리의 형용사 보어라 맞음.","Uncertainly(확신 없이): 부사라 be동사 보어 자리에 못 옴.","Uncertainty(불확실성): 명사라 주어 없이 문장 앞에 홀로 올 수 없음.","Unsureness(확신 없음): 명사라 단체의 상태를 말하는 보어 자리에 맞지 않음."],"point":"분사구문 (Being 생략 + 형용사)","en":"Unsure of what they were, the group decided to name the phenomenon “Steve,” based on a scene from an animated movie where some characters give that name to an unfamiliar object.","ko":"그것들이 무엇인지 확신하지 못해서, 그 단체는 등장인물들이 낯선 물체에 그 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 ‘Steve’라고 이름 짓기로 결정했다.","hl":["Unsure of what they were"],"khl":["그것들이 무엇인지 확신하지 못해서"],"blocks":[{"t":"p","h":"숨은 Being(~인 상태로) 찾기","x":["원래 문장: Because they were unsure of what they were(그것들이 무엇인지 확신하지 못했기 때문에).","분사구문으로 줄이면 Being unsure of(~를 확신하지 못한 상태로)가 되고, Being(~인 상태로)은 자주 생략된다.","Being(~인 상태로) 뒤는 be동사의 보어 자리라 형용사 unsure(확신하지 못한).","Unsurely(확신 없이)는 부사라 be동사 보어가 못 된다."]},{"t":"pair","h":"쉬운 예시","x":[["Tired, I went to bed early.","피곤해서 나는 일찍 잠자리에 들었다. (Being(~인 상태로) 생략 + 형용사)"],["Hungry, the boy ate fast.","배가 고파서 그 소년은 빨리 먹었다. (Being(~인 상태로) 생략 + 형용사)"]]}],"post":["(Being) Unsure of(~를 확신하지 못해서): 형용사로 시작"]}],"quiz":[{"s":"There ___ three cats on the sofa.","o":["was","were"],"a":1,"ko":"소파 위에 고양이 세 마리가 있었다.","why":"진짜 주어 three cats(고양이 세 마리)가 복수.","wy":"was(있었다): 단수 동사라 복수 주어와 안 맞음."},{"s":"She will wash the dishes and ___ the floor.","o":["clean","cleaning"],"a":0,"ko":"그녀는 설거지를 하고 바닥을 청소할 것이다.","why":"will(~할 것이다) 뒤 wash(씻다)와 나란한 원형.","wy":"cleaning(청소하는): 원형 wash(씻다)와 and(그리고)로 짝이 안 맞음."},{"s":"I watched the kids ___ in the yard.","o":["to play","playing"],"a":1,"ko":"나는 아이들이 마당에서 노는 것을 지켜보았다.","why":"지각동사 watch(지켜보다) + 목적어 + -ing.","wy":"to play(노는 것): 지각동사 뒤 목적격보어에 to부정사는 못 옴."},{"s":"The show ___ for three hours.","o":["lasted","was lasted"],"a":0,"ko":"그 공연은 세 시간 동안 이어졌다.","why":"last(지속되다)는 자동사라 능동.","wy":"was lasted(지속되어졌다): 자동사는 수동태로 못 씀."},{"s":"___ about the test, he couldn't sleep.","o":["Nervous","Nervously"],"a":0,"ko":"시험 때문에 긴장해서 그는 잠을 잘 수 없었다.","why":"Being(~인 상태로)이 생략된 자리라 형용사.","wy":"Nervously(긴장하여): 부사라 be동사 보어 자리에 못 옴."}]},{"items":[{"slots":[["there_were","","","There(~이 있다) 뒤 진짜 주어 some au 수 주어와 안 맞음."],"point":"주어와 동사의 수일치","en":"Unsure of what they were, the group decided to name the phenomenon “Steve,” based on a scene from an animated movie where some characters give that name to an unfamiliar object.","ko":"그것들이 무엇인지 확신하지 못해서, 그 단체는 등장인물들이 낯선 물체에 그 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 ‘Steve’라고 이름 짓기로 결정했다.","hl":["some characters give that name"],"khl":["등장인물들이"],"blocks":[{"t":"p","h":"가까운 단어 말고 진짜 주어","x":["give(주다) 바로 앞 진짜 주어는 some characters(몇몇 등장인물들).","앞쪽의 a scene(한 장면), an animated movie(한 애니메이션 영화)가 단수라도 속으면 안 된다.","characters(등장인물들)가 여럿이라 s 없는 give(주다).","영화 속 장면을 설명하는 말이라 현재형으로 쓴다."]},{"t":"pair","h":"쉬운 예시","x":[["Some students play soccer after school.","몇몇 학생들은 방과 후에 축구를 한다. (복수 주어 → play(하다))"],["My brother plays soccer after school.","내 남동생은 방과 후에 축구를 한다. (단수 주어 → plays(하다))"]]}],"post":["주어 some characters(몇몇 등장인물들) 복수 → give(주다)"]}],"compquiz":[{"s":"This is the town ___ I was born.","o":["which","where"],"a":1,"ko":"이곳이 내가 태어난 마을이다.","why":"뒤 문장이 완전해서 where(~하는).","wy":"which(~하는): 뒤에 빠진 자리가 있어야 하는데 문장이 완전함."},{"s":"The boys in the band ___ well.","o":["sings","sing"],"a":1,"ko":"그 밴드의 소년들은 노래를 잘한다.","why":"주어 The boys(소년들)가 복수.","wy":"sings(노래하다, 3인칭 단수형): in the band(밴드의)는 꼬리표라 단수 동사가 안 맞음."}]},{"id":"e2g-2f","no":"본문 ❻❼","title":"어법특훈 · 영어II 2과 본문 ❻+❼","sub":"STEVE라는 이름 + 누구나 시민 과학자","fn":["*phenomenon: 현상"],"tpl":"After photographing Steve for several years and {discussing|discussing} {what_it|what} it might be, the group members decided to get help from experts. They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA. Surprisingly, neither of them had any idea {what_steve|what} Steve was. They confirmed that it was not an aurora, but it did not {resemble|resemble} anything they had seen before. They realized that the group {had_discovered|had discovered} a new type of phenomenon that had never been properly studied. In order to learn more about it, NASA funded a citizen science project {involving|involving} the public. The project asked ordinary people {to_gather|to gather} photos of Steve and send them to NASA. It is still in progress today. In honor of the aurora chasers who first discovered the phenomenon, the name “Steve” has {been_kept|been kept}. However, it is now written in all capital letters and {stands|stands} for “Strong Thermal Emission Velocity Enhancement.” Experts have acknowledged that it is the dedicated members of the aurora chasers group that {deserve|deserve} the credit for {discovering|discovering} STEVE. If it had not been for them, it might have remained unnoticed forever. There are many {interesting|interesting} theories about STEVE, but none of them have been proven for certain. Scientists and citizens continue to collaborate to solve this mystery, and they are learning more and more about STEVE every day. Most of the individuals involved in these two projects {are|are} not professional scientists. Instead, they are citizen scientists—ordinary people who desire to help {advance|advance} science in areas {that_areas|that} they are interested in. {even_though|Even though} citizen scientists may not have science degrees or long, white lab coats, they are still capable of making valuable contributions to science. You can become one as well if you have curiosity and an interest in {taking|taking} part in scientific research. The next great scientific achievement could be {made|made} by citizen scientists {volunteering|volunteering} their time for the purpose of better understanding the world.","mean":{"discussing":"논의하는 것(discuss의 -ing형, 동명사)","discussed":"논의했다(discuss의 과거형·과거분사형)","discuss":"논의하다(동사원형)","discusses":"논의하다(discuss의 3인칭 단수 현재형)","to discuss":"논의하는 것(discuss의 to부정사)","what":"무엇, ~하는 것(의문사·관계대명사)","that":"~라는 것(접속사) / ~하는(관계대명사)","it":"그것(대명사)","them":"그것들을(they의 목적격)","its":"그것의(it의 소유격)","resemble":"닮다(동사원형)","resemble to":"~에게 닮다(전치사를 붙인 틀린 형태)","resembles":"닮다(resemble의 3인칭 단수 현재형)","resembled":"닮았다(resemble의 과거형)","resembling":"닮은(resemble의 -ing형)","had discovered":"발견했었다(discover의 과거완료형)","involving":"참여시키는(involve의 -ing형)","involved":"참여된, 관여된(involve의 과거분사형)","involves":"참여시키다(involve의 3인칭 단수 현재형)","to involving":"참여시키는 것으로(전치사 to + 동명사)","being involved":"참여되는(involve의 수동 -ing형)","to gather":"모으는 것(gather의 to부정사)","been kept":"유지되어 온(keep의 수동 완료형 일부)","kept":"유지했다(keep의 과거형·과거분사형)","keep":"유지하다(동사원형)","keeps":"유지하다(keep의 3인칭 단수 현재형)","keeping":"유지하는(keep의 -ing형)","stands":"의미하다, 나타내다(stand의 3인칭 단수 현재형)","stand":"의미하다(동사원형)","standing":"의미하는(stand의 -ing형)","to stand":"의미하는 것(stand의 to부정사)","being stood":"의미되는(stand의 수동 -ing형)","deserve":"받을 자격이 있다(동사원형·현재형)","discovering":"발견하는 것(discover의 -ing형, 동명사)","interesting":"흥미로운(interest의 -ing형)","are":"~이다(be의 현재형, 복수 주어)","is":"~이다(be의 현재형, 단수 주어)","being":"~인(be의 -ing형)","be":"~이다(동사원형)","to be":"~인 것(be의 to부정사)","advance":"발전시키다(동사원형)","advancing":"발전시키는(advance의 -ing형)","advances":"발전시키다(advance의 3인칭 단수 현재형)","advancement":"발전(명사)","to advancing":"발전시키는 것으로(전치사 to + 동명사)","where":"~하는(장소를 받는 관계부사)","whose":"~의(소유격 관계대명사)","whom":"~을(사람을 받는 목적격 관계대명사)","Even though":"비록 ~이지만(접속사)","Despite":"~에도 불구하고(전치사)","In spite of":"~에도 불구하고(전치사구)","Because of":"~ 때문에(전치사구)","Due to":"~ 때문에(전치사구)","taking":"참여하는 것, 취하는 것(take의 -ing형, 동명사)","take":"취하다(동사원형)","takes":"취하다(take의 3인칭 단수 현재형)","taken":"취해진(take의 과거분사형)","to take":"취하는 것(take의 to부정사)","made":"이루어진(make의 과거분사형)","volunteering":"자발적으로 제공하는(volunteer의 -ing형)","volunteered":"자발적으로 제공했다, 제공된(volunteer의 과거형·과거분사형)","volunteers":"자발적으로 제공하다(volunteer의 3인칭 단수 현재형)","to volunteering":"자발적으로 제공하는 것으로(전치사 to + 동명사)","are volunteering":"자발적으로 제공하고 있다(volunteer의 현재진행형)","clean":"청소하다(동사원형)","cleaning":"청소하는 것(clean의 -ing형)","enter":"~에 들어가다(동사원형)","enter into":"~을 시작하다(enter + into)","broke":"깼다(break의 과거형)","broken":"깨진(break의 과거분사형)","move":"옮기다(동사원형)","moving":"옮기는(move의 -ing형)","Although":"비록 ~이지만(접속사)","flying":"날리는(fly의 -ing형)","flown":"날려진(fly의 과거분사형)","go":"가다(동사원형)","goes":"가다(go의 3인칭 단수 현재형)","wearing":"쓰고 있는(wear의 -ing형)","worn":"착용된(wear의 과거분사형)","interested":"흥미를 느끼는(interest의 과거분사형)","interestingly":"흥미롭게도(부사)","interests":"관심사들(명사 interest의 복수형) / 흥미를 끌다(3인칭 단수 현재형)","to interest":"흥미를 끄는 것(interest의 to부정사)","to standing":"의미하는 것으로(전치사 to + stand의 -ing형)","resembles to":"~에게 닮다(전치사를 붙인 틀린 형태)"},"sets":[{"items":[{"slots":[["discussing","discussed","a","After(~ 후에)는 여기서 전치사라 뒤에 동명사가 온다. photographing(찍는 것)과 and(그리고)로 나란하니 discussing(논의하는 것)."],["what_it","","","it might be(그것이 ~일지도 모른다) 뒤 보어가 빠져 있어 what(무엇)이 맞다."],["what_steve","","","Steve was(스티브가 ~였다) 뒤 보어가 빠져 있어 what(무엇)이 맞다."],["resemble","","","resemble(닮다)은 전치사 없이 목적어를 바로 받는 타동사라 resemble anything(어떤 것과도 닮다)이 맞다."],["had_discovered","","","깨달은 때보다 먼저 발견한 일이라 had discovered(발견했었다)가 맞다."]],"opts":["discussing","discuss","discusses","to discuss"],"or":["discussing(논의하는 것): 전치사 After(~ 후에) 뒤 photographing(찍는 것)과 나란한 동명사라 맞음.","discuss(논의하다): 전치사 뒤에 동사원형은 못 오고 photographing(찍는 것)과 짝도 안 맞음.","discusses(논의하다, 3인칭 단수형): 전치사 뒤에 동사는 못 옴.","to discuss(논의하는 것): and(그리고) 앞이 -ing라 뒤만 to부정사면 짝이 안 맞음."],"point":"병렬구조","en":"After photographing Steve for several years and discussing what it might be, the group members decided to get help from experts.","ko":"몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에, 그 단체 구성원들은 전문가들로부터 도움을 받기로 결정했다.","hl":["After photographing","discussing what it might be"],"khl":["사진을 찍고","논의한 후에"],"blocks":[{"t":"p","h":"After(~ 후에) 뒤 두 개의 -ing","x":["After(~ 후에)는 여기서 전치사라 뒤에 동명사가 온다.","After(~ 후에) + photographing(찍는 것) and discussing(논의하는 것). and(그리고) 양쪽이 모두 -ing.","오로라 추적자들은 몇 년 동안 사진을 찍고 정체를 토론했지만 답이 안 나왔다.","그래서 이제 전문가에게 도움을 청하기로 한다."]},{"t":"pair","h":"쉬운 예시","x":[["After eating dinner and washing the dishes, I watched a movie.","저녁을 먹고 설거지를 한 뒤 나는 영화를 봤다. (eating and washing(먹는 것과 씻는 것))"],["She likes reading and drawing.","그녀는 읽기와 그리기를 좋아한다. (reading and drawing(읽기와 그리기))"]]}],"post":["After(~ 후에) + photographing and discussing(찍고 논의하는 것)"]},{"slots":[["what_steve","","","Steve was(스티브가 ~였다) 뒤 보어가 빠져 있어 what(무엇)이 맞다."],["resemble","resemble to","a","resemble(닮다)은 전치사 없이 목적어를 바로 받는 타동사다. '~와'라는 우리말에 속아 to를 붙이면 틀린다."],["had_discovered","","","깨달은 때보다 먼저 발견한 일이라 had discovered(발견했었다)가 맞다."],["involving","","","프로젝트가 대중을 참여시키는 능동이고 뒤에 목적어 the public(대중)이 있어 involving(참여시키는)이 맞다."],["to_gather","","","ask(요청하다) + 사람 + to부정사라 to gather(모으는 것)가 맞다."]],"opts":["resemble","resembles","resembled","resembling"],"or":["resemble(닮다): did not(~하지 않았다) 뒤 동사원형이고 목적어를 바로 받아 맞음.","resembles(닮다, 3인칭 단수형): did not(~하지 않았다) 뒤에는 동사원형만 옴.","resembled(닮았다): did not(~하지 않았다) 뒤에 과거형은 못 옴.","resembling(닮은): did not(~하지 않았다) 뒤에 -ing는 못 옴."],"point":"타동사 + 목적어 (전치사 X)","en":"They confirmed that it was not an aurora, but it did not resemble anything they had seen before.","ko":"그들은 그것이 오로라가 아니라는 것은 확인했지만, 그것은 그들이 이전에 보았던 어느 것과도 비슷하지 않았다.","hl":["did not resemble anything"],"khl":["어느 것과도 비슷하지 않았다"],"blocks":[{"t":"p","h":"우리말 '~와'에 속지 않기","x":["resemble(~와 닮다)은 우리말로 '~와'가 붙지만 영어에선 바로 목적어를 받는다.","같은 무리: discuss(~에 대해 논의하다), marry(~와 결혼하다), enter(~에 들어가다), reach(~에 도착하다).","did not(~하지 않았다) 뒤라 동사원형 resemble(닮다).","천문학 교수도 NASA(나사) 과학자도 처음 보는 현상이었다."]},{"t":"pair","h":"쉬운 예시","x":[["She resembles her mother.","그녀는 엄마를 닮았다. (resembles to(~에게 닮다)는 틀림)"],["We discussed the plan.","우리는 그 계획에 대해 논의했다. (discussed about(~에 대해 논의했다)은 틀림)"]]}],"post":["resemble(~와 닮다) + 목적어: resemble anything(어떤 것과도 닮다)"]},{"slots":[["been_kept","","","이름은 사람들이 유지하는 대상이라 has been kept(유지되어 왔다)가 맞다."],["stands","","","주어 it(그것)이 단수이고 is written(쓰인다)과 and(그리고)로 나란해 stands(의미하다)가 맞다."],["deserve","","","It is ~ that(~한 것은 바로 ~이다) 강조 구문이라 강조된 the dedicated members(헌신적인 구성원들)에 맞춘 deserve(받을 자격이 있다)가 맞다."],["discovering","","","전치사 for(~에 대한) 뒤라 동명사 discovering(발견하는 것)이 맞다."],["interesting","interested","a","theories(이론들)는 흥미를 주는 쪽이라 interesting(흥미로운)이다. interested(흥미를 느끼는)는 흥미를 느끼는 사람에게 쓴다."]],"opts":["interesting","interestingly","interests","to interest"],"or":["interesting(흥미로운): 이론이 흥미를 주는 쪽이고 명사 theories(이론들) 앞 형용사 자리라 맞음.","interestingly(흥미롭게도): 부사라 명사 theories(이론들)를 꾸밀 수 없음.","interests(관심사들, 흥미를 끌다): many(많은)와 theories(이론들) 사이 꾸밈 자리에 명사·동사는 못 옴.","to interest(흥미를 끄는 것): to부정사는 명사 앞에서 꾸밀 수 없음."],"point":"감정동사의 분사 (-ing vs. -ed)","en":"There are many interesting theories about STEVE, but none of them have been proven for certain.","ko":"STEVE에 대한 흥미로운 이론들은 많지만, 그것들 중 어느 것도 확실하게 증명되지는 않았다.","hl":["many interesting theories"],"khl":["흥미로운 이론들"],"blocks":[{"t":"p","h":"흥미를 주는 쪽, 느끼는 쪽","x":["interest(흥미를 끌다)는 감정을 일으키는 동사다.","흥미를 주는 쪽은 -ing: interesting(흥미로운).","흥미를 느끼는 사람 쪽은 -ed: interested(흥미를 느끼는).","theories(이론들)는 흥미를 느끼는 사람이 아니라 사람들에게 흥미를 주는 쪽이다.","STEVE(스티브)를 두고 흥미로운 이론은 많지만 확실히 증명된 것은 아직 없다. 그래서 연구가 계속된다."]},{"t":"pair","h":"쉬운 예시","x":[["This is an interesting book.","이것은 흥미로운 책이다. (책이 흥미를 줌 → interesting(흥미로운))"],["I am interested in music.","나는 음악에 관심이 있다. (내가 흥미를 느낌 → interested(관심 있는))"]]}],"post":["주는 쪽 -ing: many interesting theories(많은 흥미로운 이론들)"]},{"slots":[["interesting","","","이론이 흥미를 주는 쪽이라 interesting(흥미로운)이 맞다."],["are","is","a","Most of(~의 대부분)는 of(~의) 뒤 명사에 수를 맞춘다. the individuals(개인들)가 복수라 are(~이다)."],["advance","","","help(돕다) 뒤에는 동사원형이 올 수 있어 advance(발전시키다)가 맞다."],["that_areas","","","끝의 in(~에) 뒤 목적어가 빠진 문장이라 관계대명사 that(~하는)이 맞다."],["even_though","","","뒤에 주어 citizen scientists(시민 과학자들)와 동사 may not have(없을 수도 있다)가 있어 접속사 Even though(비록 ~이지만)가 맞다."]],"opts":["are","being","be","to be"],"or":["are(~이다): of(~의) 뒤 the individuals(개인들)가 복수라 맞음.","being(~인): -ing는 혼자 동사 자리에 못 옴.","be(~이다): 주어 뒤 동사 자리에 동사원형은 못 옴.","to be(~인 것): to부정사는 동사 자리에 못 옴."],"point":"부분 표현의 수일치 (Most of)","en":"Most of the individuals involved in these two projects are not professional scientists.","ko":"이 두 프로젝트에 참여한 대부분의 개인들은 전문 과학자가 아니다.","hl":["Most of the individuals","are not"],"khl":["대부분의 개인들은","아니다"],"blocks":[{"t":"p","h":"Most of(~의 대부분)는 of(~의) 뒤를 본다","x":["Most(대부분), Some(일부), All(모두), Half(절반) + of(~의) + 명사: 동사는 of(~의) 뒤 명사에 맞춘다.","of(~의) 뒤 the individuals(개인들)는 복수 → are(~이다).","involved in these two projects(이 두 프로젝트에 참여한)는 꼬리표라 무시한다.","은하를 분류한 사람도, STEVE(스티브)를 찍은 사람도 대부분 전문 과학자가 아니었다."]},{"t":"pair","h":"쉬운 예시","x":[["Most of the students are kind.","그 학생들 대부분은 친절하다. (of(~의) 뒤 복수 → are(~이다))"],["Most of the cake is gone.","그 케이크의 대부분이 없어졌다. (of(~의) 뒤 단수 → is(~이다))"]]}],"post":["Most of(~의 대부분) + the individuals(개인들) 복수 → are(~이다)"]},{"slots":[["advance","","","help(돕다) 뒤에는 동사원형이 올 수 있어 advance(발전시키다)가 맞다."],["even_though","","","뒤에 주어 citizen scientists(시민 과학자들)와 동사 may not have(없을 수도 있다)가 있어 접속사 Even though(비록 ~이지만)가 맞다."],["taking","take","a","전치사 in(~에) 뒤에 동사를 쓰려면 동명사 -ing가 되어야 한다."],["made","","","업적은 이루어지는 쪽이라 could be made(이루어질 수도 있다)가 맞다."],["volunteering","","","시민 과학자들이 시간을 내놓는 능동이고 뒤에 목적어 their time(그들의 시간)이 있어 volunteering(자발적으로 제공하는)이 맞다."]],"opts":["taking","takes","taken","to take"],"or":["taking(참여하는 것): 전치사 in(~에) 뒤 동명사라 맞음.","takes(취하다, 3인칭 단수형): 전치사 뒤에 동사는 못 옴.","taken(취해진): 사람이 직접 참여하는 능동이라 p.p.는 안 맞고 전치사 뒤 자리에도 안 맞음.","to take(참여하는 것): 전치사 in(~에) 뒤에 to부정사는 못 옴."],"point":"전치사 + 동명사","en":"You can become one as well if you have curiosity and an interest in taking part in scientific research.","ko":"호기심과 과학 연구에 참여하는 것에 대한 관심이 있다면 당신도 시민 과학자가 될 수 있다.","hl":["an interest in taking part"],"khl":["과학 연구에 참여하는 것에 대한 관심"],"blocks":[{"t":"p","h":"전치사 뒤 동사는 -ing 옷","x":["an interest in(~에 대한 관심) 뒤: in(~에)은 전치사.","전치사 뒤에는 명사가 와야 해서 take part(참여하다)는 taking part(참여하는 것)로 바뀐다.","시민 과학자가 되는 조건은 학위가 아니라 두 가지: curiosity(호기심)와 참여하려는 관심.","one(하나)은 앞 문장의 a citizen scientist(시민 과학자)를 받는다."]},{"t":"pair","h":"쉬운 예시","x":[["Thank you for helping me.","도와줘서 고마워. (for(~에 대해) + helping(돕는 것))"],["She is good at drawing.","그녀는 그림을 잘 그린다. (at(~에) + drawing(그리는 것))"]]}],"post":["전치사 in(~에) + taking part(참여하는 것)"]}],"quiz":[{"s":"Before washing the car and ___ the yard, he ate lunch.","o":["clean","cleaning"],"a":1,"ko":"세차를 하고 마당을 청소하기 전에 그는 점심을 먹었다.","why":"전치사 Before(~ 전에) 뒤 washing(씻는 것)과 나란한 -ing.","wy":"clean(청소하다): 전치사 뒤에 동사원형은 못 오고 washing(씻는 것)과 짝도 안 맞음."},{"s":"She ___ her mother.","o":["resembles","resembles to"],"a":0,"ko":"그녀는 엄마를 닮았다.","why":"resemble(닮다)은 전치사 없이 목적어를 바로 받는 타동사.","wy":"resembles to(~에게 닮다): resemble(닮다) 뒤에 to를 붙이면 틀림."},{"s":"I heard an ___ story.","o":["interesting","interested"],"a":0,"ko":"나는 흥미로운 이야기를 들었다.","why":"이야기는 흥미를 주는 쪽이라 -ing.","wy":"interested(흥미를 느끼는): 흥미를 느끼는 사람에게 쓰는 말이라 이야기에는 안 맞음."},{"s":"Some of the water ___ cold.","o":["is","are"],"a":0,"ko":"그 물의 일부는 차갑다.","why":"of(~의) 뒤 the water(물)가 단수라 is(~이다).","wy":"are(~이다): of(~의) 뒤 명사가 단수라 복수 동사가 안 맞음."},{"s":"He is afraid of ___ alone.","o":["be","being"],"a":1,"ko":"그는 혼자 있는 것을 두려워한다.","why":"전치사 of(~을) 뒤는 동명사.","wy":"be(~이다): 전치사 뒤에 동사원형은 못 옴."}]},{"items":[{"slots":[["discussing","","","전치사 After(~ 후에) 뒤 photographing(찍는 것)과 and(그리고)로 나란한 동명사라 discussing(논의하는 것)이 맞다."],["what_it","that","a","it might be(그것이 ~일지도 모른다)는 be 뒤 보어가 빠진 불완전한 문장이다. 접속사 that(~라는 것)은 완전한 문장 앞에만 온다."],["what_steve","","","Steve was(스티브가 ~였다) 뒤 보어가 빠져 있어 what(무엇)이 맞다."],["had_discovered","","","깨달은 때보다 먼저 발견한 일이라 had discovered(발견했었다)가 맞다."],["involving","","","프로젝트가 대중을 참여시키는 능동이고 뒤에 목적어 the public(대중)이 있어 involving(참여시키는)이 맞다."]],"opts":["what","it","them","its"],"or":["what(무엇): 보어가 빠진 문장을 이끌며 discussing(논의하는 것)의 목적어가 되어 맞음.","it(그것): 대명사라 뒤 문장을 이어 줄 수 없음.","them(그것들을): 대명사라 뒤 문장을 이어 줄 수 없음.","its(그것의): 소유격이라 뒤에 명사가 와야 함."],"point":"that vs. what","en":"After photographing Steve for several years and discussing what it might be, the group members decided to get help from experts.","ko":"몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에, 그 단체 구성원들은 전문가들로부터 도움을 받기로 결정했다.","hl":["discussing what it might be"],"khl":["그것이 무엇일지에 대해 논의한"],"blocks":[{"t":"p","h":"빈자리를 품은 what(무엇)","x":["it might be(그것이 ~일지도 모른다) 뒤를 보자. be(~이다) 다음에 와야 할 말이 비어 있다.","그 빈자리가 바로 '무엇'. what(무엇)이 그 자리를 품고 앞으로 나간 것이다.","that(~라는 것)은 빈자리 없는 완전한 문장 앞에만 온다.","사진을 몇 년이나 찍었지만 '그게 대체 뭘까?'는 풀리지 않았다."]},{"t":"pair","h":"쉬운 예시","x":[["Let's guess what it is.","그게 뭔지 맞혀 보자. (is(~이다) 뒤가 비어 있음 → what(무엇))"],["I know that it is a bird.","나는 그것이 새라는 것을 안다. (뒤가 완전 → that(~라는 것))"]]}],"post":["빈자리 있으면 what(무엇): what it might be(그것이 무엇일지)"]},{"slots":[["had_discovered","","","깨달은 때보다 먼저 발견한 일이라 had discovered(발견했었다)가 맞다."],["involving","involved","a","프로젝트가 대중을 '참여시키는' 쪽이다. 바로 뒤에 목적어 the public(대중)이 있어 수동 p.p.는 올 수 없다."],["to_gather","","","ask(요청하다) + 사람 + to부정사라 to gather(모으는 것)가 맞다."],["been_kept","","","이름은 사람들이 유지하는 대상이라 has been kept(유지되어 왔다)가 맞다."],["stands","","","주어 it(그것)이 단수이고 is written(쓰인다)과 and(그리고)로 나란해 stands(의미하다)가 맞다."]],"opts":["involving","involves","to involving","being involved"],"or":["involving(참여시키는): 프로젝트가 대중을 참여시키는 능동이고 뒤에 목적어가 있어 맞음.","involves(참여시키다, 3인칭 단수형): 이미 동사 funded(자금을 댔다)가 있어 접속사 없이 동사가 또 올 수 없음.","to involving(참여시키는 것으로): 명사 뒤 꾸밈 자리에 전치사 to가 낄 수 없음.","being involved(참여되는): 수동이라 뒤의 목적어 the public(대중)과 부딪침."],"point":"능동 v-ing vs. 수동 p.p.","en":"In order to learn more about it, NASA funded a citizen science project involving the public.","ko":"그것에 대해 더 자세히 알아보기 위해, NASA는 대중이 참여하는 시민 과학 프로젝트에 자금을 제공했다.","hl":["a citizen science project involving the public"],"khl":["대중이 참여하는 시민 과학 프로젝트"],"blocks":[{"t":"p","h":"뒤에 목적어가 있으면 능동","x":["involve(참여시키다)는 '누구를' 참여시키는지 목적어가 필요하다.","프로젝트가 the public(대중)을 참여시킨다. 목적어가 바로 뒤에 있으니 능동 -ing.","involved(참여된)를 쓰면 프로젝트가 참여당하는 꼴이 되고 목적어도 남는다.","NASA(나사)가 돈을 대고, 이번엔 일반 대중이 사진을 모으는 시민 과학이 시작됐다."]},{"t":"pair","h":"쉬운 예시","x":[["I saw a sign warning drivers.","나는 운전자들에게 경고하는 표지판을 봤다. (뒤에 목적어 → warning(경고하는))"],["The man involved in the accident was hurt.","그 사고에 연루된 남자가 다쳤다. (뒤에 목적어 없음 → involved(연루된))"]]}],"post":["뒤에 목적어 the public(대중) → project involving(참여시키는 프로젝트)"]},{"slots":[["been_kept","","","이름은 사람들이 유지하는 대상이라 has been kept(유지되어 왔다)가 맞다."],["stands","stand","a","주어 it(그것)은 하나다. is now written(이제 쓰인다)과 and(그리고)로 이어진 동사라 3인칭 단수 stands(의미하다)."],["deserve","","","It is ~ that(~한 것은 바로 ~이다) 강조 구문이라 강조된 the dedicated members(헌신적인 구성원들)에 맞춘 deserve(받을 자격이 있다)가 맞다."],["discovering","","","전치사 for(~에 대한) 뒤라 동명사 discovering(발견하는 것)이 맞다."],["interesting","","","이론이 흥미를 주는 쪽이라 interesting(흥미로운)이 맞다."]],"opts":["stands","to standing","to stand","being stood"],"or":["stands(의미하다): 단수 주어 it(그것)의 현재형 동사로 is written(쓰인다)과 나란해 맞음.","to standing(의미하는 것으로): 전치사 to + -ing 모양이라 동사 자리에 못 오고 is written(쓰인다)과도 짝이 안 맞음.","to stand(의미하는 것): to부정사는 동사 자리에 못 옴.","being stood(의미되는): 수동 -ing라 동사 자리에도 못 오고 뜻도 안 맞음."],"point":"주어와 동사의 수일치 (병렬)","en":"However, it is now written in all capital letters and stands for “Strong Thermal Emission Velocity Enhancement.”","ko":"그러나, 그것은 이제 모두 대문자로 쓰이며, ‘속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)’을 의미한다.","hl":["it is now written","stands for"],"khl":["모두 대문자로 쓰이며","의미한다"],"blocks":[{"t":"p","h":"and(그리고) 뒤에서 주어 다시 찾기","x":["주어 it(그것)은 Steve(스티브)라는 이름 하나다.","it is now written(그것은 이제 쓰인다) and stands for(그리고 ~을 의미한다). 두 동사가 같은 주어를 받는다.","단수 주어 + 현재라 stands(의미하다).","이름은 그대로 두고 대문자 STEVE(스티브)로 바꿔 '강한 열 방출 속도 증가'라는 과학 약어가 되었다."]},{"t":"pair","h":"쉬운 예시","x":[["UN stands for United Nations.","UN(국제 연합)은 United Nations(국제 연합)를 의미한다. (단수 주어 → stands(의미하다))"],["He gets up early and goes jogging.","그는 일찍 일어나서 조깅을 하러 간다. (단수 주어 → gets and goes(일어나고 간다))"]]}],"post":["주어 it(그것) 하나 → is written and stands for(쓰이고 의미하다)"]},{"slots":[["are","","","Most of(~의 대부분) 뒤 the individuals(개인들)가 복수라 are(~이다)가 맞다."],["advance","advancing","a","help(돕다) 뒤에는 동사원형이나 to부정사가 온다. -ing는 못 온다."],["that_areas","","","끝의 in(~에) 뒤 목적어가 빠진 문장이라 관계대명사 that(~하는)이 맞다."],["even_though","","","뒤에 주어 citizen scientists(시민 과학자들)와 동사 may not have(없을 수도 있다)가 있어 접속사 Even though(비록 ~이지만)가 맞다."],["taking","","","전치사 in(~에) 뒤라 동명사 taking(참여하는 것)이 맞다."]],"opts":["advance","advances","advancement","to advancing"],"or":["advance(발전시키다): help(돕다) 뒤 동사원형이라 맞음.","advances(발전시키다, 3인칭 단수형): help(돕다) 뒤에 s 붙은 동사는 못 옴.","advancement(발전): 명사라 help(돕다) 뒤에서 목적어 science(과학)를 받을 수 없음.","to advancing(발전시키는 것으로): help(돕다) 뒤 to 다음에는 동사원형이 와야 함."],"point":"help + 동사원형","en":"Instead, they are citizen scientists—ordinary people who desire to help advance science in areas that they are interested in.","ko":"대신, 그들은 시민 과학자들, 즉 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다.","hl":["help advance science"],"khl":["과학의 발전을 돕고자 하는"],"blocks":[{"t":"p","h":"help(돕다)는 to를 빼도 된다","x":["help(돕다) + (to) + 동사원형 = ~하는 것을 돕다.","to를 넣어도 빼도 맞지만 -ing는 안 된다.","시민 과학자 = 과학을 직업으로 하지 않아도 과학이 앞으로 나아가게 돕고 싶은 사람.","help(돕다) + 목적어 + 동사원형도 같다: help me carry(내가 나르는 것을 돕다)."]},{"t":"pair","h":"쉬운 예시","x":[["I helped her carry the bag.","나는 그녀가 가방을 나르는 것을 도왔다. (help(돕다) + 사람 + 동사원형)"],["This app helps you learn English.","이 앱은 네가 영어를 배우는 것을 돕는다. (help(돕다) + 사람 + 동사원형)"]]}],"post":["help(돕다) + 동사원형: help advance science(과학 발전을 돕다)"]},{"slots":[["advance","","","help(돕다) 뒤에는 동사원형이 올 수 있어 advance(발전시키다)가 맞다."],["that_areas","","","끝의 in(~에) 뒤 목적어가 빠진 문장이라 관계대명사 that(~하는)이 맞다."],["even_though","Despite","a","뒤에 주어 citizen scientists(시민 과학자들)와 동사 may not have(없을 수도 있다)가 있는 절이다. 전치사 Despite(~에도 불구하고)는 절을 이끌 수 없다."],["taking","","","전치사 in(~에) 뒤라 동명사 taking(참여하는 것)이 맞다."],["made","","","업적은 이루어지는 쪽이라 could be made(이루어질 수도 있다)가 맞다."]],"opts":["Even though","In spite of","Because of","Due to"],"or":["Even though(비록 ~이지만): 주어와 동사가 있는 절을 이끄는 접속사라 맞음.","In spite of(~에도 불구하고): 전치사구라 뒤에 절이 올 수 없음.","Because of(~ 때문에): 전치사구라 명사만 받고 뜻도 안 맞음.","Due to(~ 때문에): 전치사구라 명사만 받고 뜻도 안 맞음."],"point":"접속사 vs. 전치사","en":"Even though citizen scientists may not have science degrees or long, white lab coats, they are still capable of making valuable contributions to science.","ko":"비록 시민 과학자들에게 과학 학위나 길고 흰 실험실 가운은 없을지 몰라도, 그들은 여전히 과학에 귀중한 기여를 할 수 있다.","hl":["Even though citizen scientists may not have"],"khl":["비록 시민 과학자들에게"],"blocks":[{"t":"p","h":"Even though(비록 ~이지만) + 절","x":["Even though(비록 ~이지만) 뒤: 주어 citizen scientists(시민 과학자들) + 동사 may not have(없을 수도 있다). 절이다.","같은 뜻이라도 despite(~에도 불구하고), in spite of(~에도 불구하고)는 전치사라 명사만 받는다.","본문 첫 문장의 '길고 흰 실험실 가운'이 , they are citizen scientists—ordinary people who desire to help advance science in areas that they are interested in.","ko":"대신, 그들은 시민 과학자들, 즉 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다.","hl":["areas that they are interested in"],"khl":["자신이 관심 있는 분야에서"],"blocks":[{"t":"p","h":"문장 끝 in(~에)이 단서","x":["be interested in(~에 관심이 있다)은 in(~에) 뒤에 목적어가 필요하다.","문장 끝 in(~에) 뒤가 비어 있다. 그 빈자리를 that(~하는)이 맡는다.","where(~하는)는 빈자리 없는 완전한 문장 앞에 온다. in(~에)이 남아 있으면 못 쓴다.","in which(그 안에서)로 바꾸면 끝의 in(~에)이 앞으로 간다: areas in which they are interested(그들이 관심 있는 분야)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the topic that I'm interested in.","이것이 내가 관심 있는 주제다. (in(~에) 뒤가 비어 있음 → that(~하는))"],["This is the town where I live.","이곳이 내가 사는 마을이다. (뒤가 완전 → where(~하는))"]]}],"post":["끝에 in(~에)이 남으면 that(~하는): areas that they are interested in(그들이 관심 있는 분야)"]},{"no":"본문 ❻❼","slots":[["discovering","","","전치사 for(~에 대한) 뒤라 동명사 discovering(발견하는 것)이 맞다."],["even_though","","","뒤에 주어 citizen scientists(시민 과학자들)와 동사 may not have(없을 수도 있다)가 있어 접속사 Even though(비록 ~이지만)가 맞다."],["taking","","","전치사 in(~에) 뒤라 동명사 taking(참여하는 것)이 맞다."],["made","","","업적은 이루어지는 쪽이라 could be made(이루어질 수도 있다)가 맞다."],["volunteering","volunteered","a","시민 과학자들이 자기 시간을 '내놓는' 쪽이다. 뒤에 목적어 their time(그들의 시간)이 있어 수동 p.p.는 올 수 없다."]],"opts":["volunteering","volunteers","to volunteering","are volunteering"],"or":["volunteering(자발적으로 제공하는): 시민 과학자들이 시간을 내놓는 능동이라 맞음.","volunteers(자발적으로 제공하다, 3인칭 단수형): 이미 동사 could be made(이루어질 수도 있다)가 있어 동사가 또 올 수 없음.","to volunteering(자발적으로 제공하는 것으로): 명사 뒤 꾸밈 자리에 전치사 to가 낄 수 없음.","are volunteering(자발적으로 제공하고 있다): 접속사 없이 동사가 또 생김."],"point":"능동 v-ing vs. 수동 p.p.","en":"The next great scientific achievement could be made by citizen scientists volunteering their time for the purpose of better understanding the world.","ko":"다음 위대한 과학적 업적은 세상을 더 잘 이해하기 위한 목적으로 자신의 시간을 자발적으로 제공하는 시민 과학자들에 의해 이루어질 수도 있다.","hl":["citizen scientists volunteering their time"],"khl":["자신의 시간을 자발적으로 제공하는 시민 과학자들"],"blocks":[{"t":"p","h":"꾸밈 분사도 목적어를 본다","x":["volunteering their time(자기 시간을 자발적으로 내놓는)이 citizen scientists(시민 과학자들)를 뒤에서 꾸민다.","시민 과학자들이 직접 시간을 내놓으니 능동 -ing.","목적어 their time(그들의 시간)이 바로 뒤에 있는 것도 능동의 신호.","글의 마지막 문장: 다음 위대한 발견은 당신 같은 시민 과학자의 몫일 수 있다."]},{"t":"pair","h":"쉬운 예시","x":[["People waiting for the bus looked tired.","버스를 기다리는 사람들은 피곤해 보였다. (사람들이 기다림 → waiting(기다리는))"],["Students using phones in class will be warned.","수업 중에 휴대폰을 쓰는 학생들은 경고를 받을 것이다. (뒤에 목적어 phones(휴대폰) → using(쓰는))"]]}],"post":["뒤에 목적어 their time(그들의 시간) → scientists volunteering(자발적으로 내놓는 과학자들)"]}],"compquiz":[{"s":"This is the song ___ I am interested in.","o":["where","that"],"a":1,"ko":"이것이 내가 관심 있는 노래다.","why":"끝의 in(~에) 뒤가 비어 있어 관계대명사 that(~하는).","wy":"where(~하는): 뒤가 완전할 때만 씀."},{"s":"The boy ___ a red cap is my brother.","o":["wearing","worn"],"a":0,"ko":"빨간 모자를 쓴 소년은 내 남동생이다.","why":"소년이 모자를 쓰는 능동이고 목적어 a red cap(빨간 모자)이 있어 -ing.","wy":"worn(착용된): 수동이라 뒤의 목적어와 부딪침."}]}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();
