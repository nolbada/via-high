 쌍을 무시한다는 말이 된다."]},{"t":"p","h":"함정","x":["Lastly(마지막으로)는 Finally(마지막으로)와 같은 뜻이라 맞는 표현."]}],"post":["consider(고려하다) ↔ ignore(무시하다)","콩도르세 = 둘씩 맞대결 세 번"]},{"slots":[["discovered","found","s"],["preferred","disliked","a"],["same","identical","s"],["winner"],["weakness"]],"opts":["preferred","rejected","avoided","opposed"],"or":["preferred(선호했다): 바로 뒤 In other words(즉) 문장이 11명이 B보다 A를 좋아했다고 다시 말해 주니 맞음.","rejected(거부했다): A를 거부했다면 A가 B를 11 대 9로 이길 수 없음.","avoided(피했다): A를 피했다는 건 11명이 A를 앞에 적은 사실과 반대임.","opposed(반대했다): A에 반대했다면 A가 최종 승자가 될 수 없음."],"om":["선호했다","거부했다","피했다","반대했다"],"en":"Through this method, the student council discovered that its members preferred option A to option B by a count of 11 to 9. In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB.","ko":"이 방식을 통해 학생 자치회는 구성원들이 선택지 B보다 선택지 A를 11대 9로 선호한다는 사실을 알아냈다. 즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다.","hl":["preferred option A to option B","In other words, 11 people preferred A to B"],"khl":["선택지 B보다 선택지 A를","즉, 11명이"],"blocks":[{"t":"pair","h":"In other words(즉) 앞뒤는 같은 말","x":[["its members preferred option A to option B by a count of 11 to 9","구성원들이 B보다 A를 11 대 9로 선호했다"],["11 people preferred A to B","11명이 B보다 A를 선호했다"]]},{"t":"p","h":"disliked(싫어했다)를 넣으면","x":["In other words(즉) 뒤는 앞 문장을 다시 말한 것이다.","뒤가 preferred(선호했다)인데 앞이 disliked(싫어했다)면 같은 말이 아니다.","게다가 prefer A to B(B보다 A를 좋아하다)는 짝으로 쓰는 표현이다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","found(알아냈다)는 discovered(알아냈다)와, identical(똑같은)은 same(같은)과 뜻이 같다."]}],"post":["prefer(선호하다) ↔ dislike(싫어하다)","prefer A to B(B보다 A를 더 좋아함)"]},{"slots":[["same"],["winner","loser","a"],["weakness","drawback","s"],["complex"],["fails"]],"opts":["winner","runner-up","outsider","underdog"],"or":["winner(승자): A가 다른 두 선택지를 모두 이겼으니 맞음.","runner-up(2위): 맞대결을 모두 이긴 A는 2위가 아니라 1위임.","outsider(승산 없는 후보): 두 번 다 이긴 A는 승산 없는 후보가 아님.","underdog(약자): 모든 맞대결에서 이긴 쪽은 약자가 아님."],"om":["승자","2위","승산 없는 후보","약자"],"en":"As option A, the art show, was preferred to both of the other options, it would be considered the winner.","ko":"미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 그것은 승자로 간주될 것이었다.","hl":["it would be considered the winner","preferred to both of the other options"],"khl":["승자로 간주될 것이었다","나머지 두 선택지보다 더 선호되었으므로"],"blocks":[{"t":"tap","h":"질문 하나","q":"A는 B를 11:9, C를 11:9로 이겼다. A는 몇 등?","a":["1등.","맞대결을 모두 이긴 선택지가 콩도르세 방식의 승자다.","loser(패자)를 넣으면 다 이기고도 진 쪽이 된다."]},{"t":"p","h":"세 방식, 세 승자","x":["FPTP(단순 다수결): C 자선 콘서트","AV(대안 투표): B 빵 바자회","Condorcet(콩도르세): A 미술 전시회","같은 표인데 방식마다 승자가 다르다. 본문 ⑦의 출발점."]},{"t":"p","h":"함정","x":["drawback(결점)은 weakness(약점) 자리에 넣어도 된다."]}],"post":["winner(승자) ↔ loser(패자)","콩도르세 승자 = A 미술 전시회"]},{"slots":[["weakness"],["complex"],["fails"],["select","reject","a"],["especially"]],"opts":["select","discard","dismiss","refuse"],"or":["select(고르다): 투표 방식이 할 일은 승자를 골라내는 것이고, 그걸 못 할 때가 있다는 게 약점이라 맞음.","discard(버리다): 승자를 버리지 못한다는 건 약점이 될 수 없음.","dismiss(물리치다): 승자를 물리치는 건 투표 방식이 할 일이 아님.","refuse(거절하다): 승자를 거절하지 못하는 게 약점이라는 말은 성립하지 않음."],"om":["고르다","버리다","물리치다","거절하다"],"en":"The Condorcet method’s weakness is that, along with being complex, it sometimes fails to select a winner. This is especially true in elections that contain numerous options. It is possible that no option will be clearly preferred over the others.","ko":"콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다. 이는 많은 선택지를 포함하는 선거에서 특히 그렇다. 어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않는 것이 가능하다.","hl":["fails to select a winner","no option will be clearly preferred over the others"],"khl":["승자를 가려내지 못한다","어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않는"],"blocks":[{"t":"p","h":"투표 방식이 하는 일","x":["투표 방식의 일은 딱 하나, 승자를 골라내는 것이다.","fails to select(고르지 못하다) = 그 일을 못 해낸다.","그래서 이것이 weakness(약점)다.","reject(거부하다)를 넣으면 \"승자를 거부하지 못한다\"가 된다.","승자를 거부하는 건 원래 투표가 할 일이 아니다."]},{"t":"p","h":"마지막 문장이 풀어 준다","x":["바로 뒤: no option will be clearly preferred(어떤 선택지도 뚜렷이 선호되지 않는다).","예: A가 B를, B가 C를, C가 A를 이기면 돌고 도는 가위바위보가 된다.","누구도 둘을 다 이기지 못하니 1등이 안 나온다."]}],"post":["select(고르다) ↔ reject(거부하다)","콩도르세 약점 = 1등이 안 나올 때가 있음"]},{"slots":[["complex","complicated","s"],["select","pick","s"],["true","false","a"],["numerous"],["clearly"]],"opts":["true","untrue","wrong","mistaken"],"or":["true(사실인, 들어맞는): 승자를 못 고르는 일이 선택지가 많을 때 특히 잘 일어나니 맞음.","untrue(사실이 아닌): 선택지가 많을수록 쌍이 늘어 문제가 커지므로 반대임.","wrong(틀린): especially(특히)는 앞 내용을 더 강하게 만드는 말이라 '틀리다'와 안 어울림.","mistaken(잘못된): 마지막 문장이 바로 그 문제를 다시 설명하니 잘못된 말이 아님."],"om":["사실인","사실이 아닌","틀린","잘못된"],"en":"it sometimes fails to select a winner. This is especially true in elections that contain numerous options.","ko":"때때로 승자를 가려내지 못한다. 이는 많은 선택지를 포함하는 선거에서 특히 그렇다.","hl":["This is especially true","fails to select a winner"],"khl":["특히 그렇다","승자를 가려내지 못한다"],"blocks":[{"t":"p","h":"This(이것)가 가리키는 것","x":["This(이것) = 앞 문장, 승자를 못 고를 때가 있다는 약점.","especially true(특히 들어맞는다)는 \"이런 곳에서 더 심하다\"는 말이다.","false(사실이 아닌)를 넣으면 약점을 말하자마자 부정해 버린다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","complicated(복잡한)는 complex(복잡한)와, pick(고르다)은 select(고르다)와 뜻이 같다."]}],"post":["true(사실인) ↔ false(사실이 아닌)","선택지 많을수록 약점이 더 들어맞음"]}],"quiz":[{"w":"consider","m":"고려하다, 따져 보다","it":[["examine","검토하다","s"],["ignore","무시하다","a"],["sweep","쓸다","n"],["weigh","따져 보다","s"],["disregard","무시하다","a"],["invite","초대하다","n"],["sneeze","재채기하다","n"]]},{"w":"prefer","m":"더 좋아하다, 선호하다","it":[["favor","선호하다","s"],["dislike","싫어하다","a"],["borrow","빌리다","n"],["choose","고르다","s"],["reject","거부하다","a"],["freeze","얼다","n"],["whisper","속삭이다","n"]]},{"w":"winner","m":"승자","it":[["champion","우승자","s"],["loser","패자","a"],["pillow","베개","n"],["victor","승리자","s"],["failure","실패자","a"],["ladder","사다리","n"],["harbor","항구","n"]]},{"w":"select","m":"고르다, 선택하다","it":[["choose","고르다","s"],["reject","거부하다","a"],["sneeze","재채기하다","n"],["pick","고르다, 뽑다","s"],["decline","거절하다","a"],["polish","닦다","n"],["swallow","삼키다","n"]]},{"w":"true","m":"사실인, 맞는","it":[["accurate","정확한","s"],["false","사실이 아닌","a"],["wooden","나무로 된","n"],["correct","옳은","s"],["untrue","사실이 아닌","a"],["hungry","배고픈","n"],["frozen","얼어붙은","n"]]}]}],"no":"본문 ❻"},{"id":"e2-L3-3g","title":"어휘특훈 · 영어II 3과 본문 ⑦","sub":"결과는 제각각: 이상적인 투표 방법이란","tpl":"Instead of all methods pointing toward a {single} option and making the council’s choice {easier}, the winner {differed} with each method. After a long, {intense} discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they {liked} the idea of {directly} comparing each option with the others. Everyone agreed that they learned a lot about different voting systems through this experience. It is {obvious} that choosing an {ideal} voting method is a complex and {challenging} task. No voting system is {flawless} or clearly {superior} to another. Whichever we choose will have pros and cons. Some people believe that it is best to keep the process {simple} by not ranking our choices at all. Others {continue} to develop and test new ways of voting, arguing that more complex methods deliver more {accurate} results. All of these efforts are designed not to make decision-making {difficult} and inefficient, but to help us make {better} decisions as a society. Ultimately, understanding all of the possible voting methods and {weighing} their pros and cons allows us to better understand the process of decision-making. When we understand decision-making better, we are more {likely} to become better decision-makers ourselves.","fn":["*pros and cons: 장단점","*rank: 순위를 매기다"],"mean":{"single":"단 하나의","multiple":"여러 개의, 다수의","easier":"형용사 easy(쉬운)의 비교급, 더 쉬운","simpler":"형용사 simple(간단한)의 비교급, 더 간단한","more troublesome":"형용사 troublesome(골치 아픈)의 비교급, 더 골치 아픈","differed":"동사 differ(다르다)의 과거형","varied":"동사 vary(서로 다르다, 달라지다)의 과거형","intense":"격렬한, 열띤","heated":"열띤, 격앙된","liked":"동사 like(좋아하다)의 과거형","favored":"동사 favor(선호하다, 좋아하다)의 과거형","opposed":"동사 oppose(반대하다)의 과거형","directly":"직접, 곧바로","indirectly":"간접적으로","obvious":"분명한, 명백한","evident":"분명한, 뚜렷한","doubtful":"의심스러운, 확실하지 않은","ideal":"이상적인","optimal":"최적의","challenging":"힘든, 도전적인","demanding":"힘든, 많은 노력을 요하는","effortless":"수월한, 힘이 들지 않는","flawless":"흠 없는, 완벽한","perfect":"완벽한","defective":"결함이 있는","superior":"우수한, 더 나은","simple":"간단한, 단순한","uncomplicated":"복잡하지 않은","continue":"계속하다","cease":"그만두다, 중단하다","accurate":"정확한","precise":"정밀한, 정확한","inaccurate":"부정확한","difficult":"어려운","hard":"어려운, 힘든","better":"형용사 good(좋은)의 비교급, 더 나은","inferior":"열등한, 더 못한","weighing":"동사 weigh(따져 보다, 저울질하다)의 -ing형. 동명사","evaluating":"동사 evaluate(평가하다)의 -ing형. 동명사","ignoring":"동사 ignore(무시하다)의 -ing형. 동명사","likely":"~할 가능성이 높은","unlikely":"~할 것 같지 않은"},"comp":[{"no":"본문 ❼","slots":[["directly"],["obvious","doubtful","a"],["ideal"],["challenging"],["flawless","perfect","s"]],"opts":["obvious","uncertain","questionable","unclear"],"or":["obvious(분명한): 같은 표로 세 방식이 세 승자를 냈으니 이상적인 방법 고르기가 어렵다는 건 분명하다는 말이 맞음.","uncertain(불확실한): 바로 다음 문장이 완벽한 방식은 없다고 못 박으니 불확실하다고 할 수 없음.","questionable(의심스러운): 본문 ④~⑥이 직접 보여 준 사실을 의심스럽다고 하면 흐름이 끊김.","unclear(불분명한): 세 방식의 약점을 다 확인한 뒤라 불분명할 것이 없음."],"om":["분명한","불확실한","의심스러운","불분명한"],"en":"It is obvious that choosing an ideal voting method is a complex and challenging task. No voting system is flawless or clearly superior to another.","ko":"이상적인 투표 방법을 선택하는 것이 복잡하고 힘든 일이라는 것은 분명하다. 어떤 투표 시스템도 완벽하지 않고, 다른 시스템보다 명백히 우수하지도 않다.","hl":["It is obvious that","No voting system is flawless"],"khl":["분명하다","어떤 투표 시스템도 완벽하지 않고"],"blocks":[{"t":"flow","h":"분명해진 이유","x":["FPTP(단순 다수결): C 승리, 약점 있음","AV(대안 투표): B 승리, 약점 있음","Condorcet(콩도르세): A 승리, 약점 있음","→ 이상적인 방법 고르기는 어렵다는 것이 분명함"],"at":3},{"t":"p","h":"doubtful(의심스러운)이 틀린 이유","x":["doubtful(의심스러운)을 넣으면 \"고르기가 어려운지 의심스럽다\"가 된다.","그런데 바로 다음 문장이 \"완벽한 방식은 없다\"이다.","앞에서 확인한 사실을 스스로 의심하는 셈이다."]},{"t":"p","h":"고치면 안 되는 단어","x":["perfect(완벽한)는 flawless(흠 없는) 자리에 넣어도 같은 뜻이다."]}],"post":["obvious(분명한) ↔ doubtful(의심스러운)","세 방식 세 승자 → 이상적 방법 고르기는 어려움"]},{"no":"본문 ❼","slots":[["continue"],["accurate"],["better"],["weighing","ignoring","a"],["likely"]],"opts":["weighing","overlooking","hiding","forgetting"],"or":["weighing(따져 보는 것): 투표 방법을 이해하고 장단점을 저울질해야 의사 결정을 더 잘 이해하게 되니 맞음.","overlooking(간과하는 것): 장단점을 놓치면 의사 결정을 더 잘 이해할 수 없음.","hiding(숨기는 것): 장단점을 숨기는 건 이해를 돕지 않음.","forgetting(잊는 것): 장단점을 잊으면서 의사 결정 과정을 이해한다는 건 모순임."],"om":["따져 보는 것","간과하는 것","숨기는 것","잊는 것"],"en":"Ultimately, understanding all of the possible voting methods and weighing their pros and cons allows us to better understand the process of decision-making.","ko":"결국, 모든 가능한 투표 방법을 이해하고 그것들의 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 한다.","hl":["weighing their pros and cons","understanding all of the possible voting methods"],"khl":["장단점을 따져 보는 것","모든 가능한 투표 방법을 이해하고"],"blocks":[{"t":"p","h":"and로 묶인 두 행동","x":["understanding(이해하는 것)과 and로 묶였다.","이해하기와 짝이 되는 건 따져 보기다.","ignoring(무시하는 것)을 넣으면 \"이해하고, 장단점은 무시하기\"가 된다.","그걸로 의사 결정을 더 잘 이해할 수는 없다."]},{"t":"p","h":"weigh = 저울에 올리다","x":["weigh(따져 보다)의 본뜻은 \"무게를 달다\"이다.","장점과 단점을 저울 양쪽에 올려 보는 것.","본문 내내 세 방식의 장점과 약점을 하나씩 달아 본 것이 바로 이 일이다."]}],"post":["weigh(따져 보다) ↔ ignore(무시하다)","글의 결론 = 장단점 저울질이 더 나은 결정으로"]}],"compquiz":[{"w":"obvious","m":"분명한, 명백한","it":[["evident","분명한","s"],["vague","모호한","a"],["salty","짠","n"],["clear","분명한","s"],["unclear","불분명한","a"],["wooden","나무로 된","n"],["polite","공손한","n"]]},{"w":"weigh","m":"따져 보다, 저울질하다","it":[["evaluate","평가하다","s"],["ignore","무시하다","a"],["sneeze","재채기하다","n"],["consider","고려하다","s"],["disregard","무시하다","a"],["bake","굽다","n"],["knit","뜨개질하다","n"]]}],"sets":[{"items":[{"slots":[["single","multiple","a"],["easier"],["differed"],["intense"],["liked"]],"opts":["single","several","various","separate"],"or":["single(단 하나의): 모든 방식이 한 선택지를 가리켰다면 결정이 쉬웠을 텐데, 실제로는 승자가 달랐다는 대조라 맞음.","several(몇몇의): 여러 선택지를 가리키는 건 실제로 일어난 일이라 Instead of(~ 대신)와 부딪침.","various(다양한): 다양한 선택지를 가리키면 결정이 쉬워질 수 없음.","separate(별개의): 서로 다른 선택지를 가리킨 건 실제 결과라 '대신'의 앞자리에 올 수 없음."],"om":["단 하나의","몇몇의","다양한","별개의"],"en":"Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.","ko":"모든 방식이 하나의 선택지를 가리켜 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자가 달랐다.","hl":["pointing toward a single option","the winner differed with each method"],"khl":["하나의 선택지를 가리켜","각 방식마다 승자가 달랐다"],"blocks":[{"t":"flow","h":"본문 ⑦의 흐름","x":["세 방식, 세 승자","자치회는 콩도르세 방식을 고름","교훈: 완벽한 투표 방식은 없음","단순하게 대 더 정확하게, 두 입장","결론: 장단점을 따지면 더 나은 결정자가 됨"],"at":0},{"t":"pair","h":"Instead of 앞뒤 = 바람 vs 현실","x":[["all methods pointing toward a single option","모든 방식이 한 선택지를 가리킴 (바람)"],["the winner differed with each method","방식마다 승자가 달랐음 (현실)"]]},{"t":"p","h":"multiple(여러 개의)이 틀린 이유","x":["Instead of(~ 대신)의 앞은 일어나지 않은 일이다.","여러 선택지를 가리킨 건 실제로 일어난 일이다.","C, B, A, 세 승자."]}],"post":["single(단 하나의) ↔ multiple(여러 개의)","바람: 한 승자 / 현실: 방식마다 다른 승자"]},{"slots":[["easier","simpler","s"],["differed","varied","s"],["intense"],["liked","opposed","a"],["directly"]],"opts":["liked","hated","doubted","feared"],"or":["liked(좋아했다): 직접 비교한다는 생각이 마음에 들어서 콩도르세를 골랐으니 맞음.","hated(몹시 싫어했다): 싫어하는 방식을 고를 이유가 없음.","doubted(의심했다): 그 생각을 의심하면서 그 방식을 고른다는 건 앞뒤가 안 맞음.","feared(두려워했다): 두려워하는 생각이 선택의 이유가 될 수 없음."],"om":["좋아했다","몹시 싫어했다","의심했다","두려워했다"],"en":"After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.","ko":"Akers 선생님과의 오랜 열띤 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접 비교한다는 발상이 마음에 들었기 때문이다.","hl":["as they liked the idea","decided to choose the Condorcet method"],"khl":["발상이 마음에 들었기 때문이다","콩도르세 방식을 선택하기로 결정했는데"],"blocks":[{"t":"p","h":"as(~ 때문에)는 선택의 이유","x":["결정: 콩도르세 방식을 고름.","이유: as(~ 때문에) 뒤에 온다.","고른 이유는 그 발상이 마음에 들어서여야 한다.","opposed(반대했다)를 넣으면 반대하는 발상 때문에 그 방식을 골랐다는 말이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","simpler(더 간단한)는 easier(더 쉬운) 자리에, varied(달라졌다)는 differed(달랐다) 자리에 넣어도 뜻이 통한다."]}],"post":["like(좋아하다) ↔ oppose(반대하다)","콩도르세를 고른 이유 = 직접 비교가 마음에 들어서"]},{"slots":[["ideal","optimal","s"],["challenging","effortless","a"],["flawless"],["superior"],["simple"]],"opts":["challenging","relaxing","painless","trivial"],"or":["challenging(힘든): complex(복잡한)와 and로 묶여 같은 방향이라 맞음.","relaxing(느긋한, 편안한): 복잡하면서 느긋한 일은 모순임.","painless(쉬운, 고통 없는): 세 방식이 다 약점을 보였는데 고르기가 쉬울 리 없음.","trivial(하찮은): 사회의 의사 결정을 좌우하는 일을 하찮다고 할 수 없음."],"om":["힘든","느긋한, 편안한","쉬운, 고통 없는","하찮은"],"en":"It is obvious that choosing an ideal voting method is a complex and challenging task.","ko":"이상적인 투표 방법을 선택하는 것이 복잡하고 힘든 일이라는 것은 분명하다.","hl":["a complex and challenging task","choosing an ideal voting method"],"khl":["복잡하고 힘든 일","이상적인 투표 방법을 선택하는 것"],"blocks":[{"t":"p","h":"and로 묶인 짝","x":["complex(복잡한)와 and로 묶였다.","짝꿍은 같은 방향이어야 한다.","effortless(수월한)를 넣으면 \"복잡하고 수월한 일\"이 된다.","한 일이 복잡하면서 힘이 안 들 수는 없다."]},{"t":"tap","h":"질문 하나","q":"왜 이상적인 투표 방법 고르기가 힘들까?","a":["세 방식 모두 장점과 약점이 있었기 때문.","같은 표로도 방식마다 승자가 달랐다.","하나만 골라 \"이게 최고\"라고 말할 수 없다."]},{"t":"p","h":"함정","x":["optimal(최적의)은 ideal(이상적인) 자리에 넣어도 된다.","an optimal voting method = 최적의 투표 방법."]}],"post":["challenging(힘든) ↔ effortless(수월한)","이상적인 방법 고르기 = 복잡하고 힘든 일"]},{"slots":[["simple"],["continue","cease","a"],["accurate"],["difficult"],["better"]],"opts":["continue","refuse","hesitate","fail"],"or":["continue(계속하다): 더 복잡한 방식이 더 정확하다고 주장하며 새 방식을 계속 만드는 사람들이라 맞음.","refuse(거부하다): 새 방식을 거부하면서 더 복잡한 방식이 낫다고 주장할 수는 없음.","hesitate(망설이다): 더 정확하다고 확신하는 사람들이 망설일 이유가 없음.","fail(~하지 못하다): 새 방식을 못 만든다는 말이 되어 arguing(주장하며)의 확신과 안 맞음."],"om":["계속하다","거부하다","망설이다","~하지 못하다"],"en":"Some people believe that it is best to keep the process simple by not ranking our choices at all. Others continue to develop and test new ways of voting, arguing that more complex methods deliver more accurate results.","ko":"어떤 사람들은 선택에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다. 다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 새로운 투표 방법을 계속해서 개발하고 시험한다.","hl":["Others continue to develop and test new ways of voting","arguing that more complex methods deliver more accurate results"],"khl":["새로운 투표 방법을 계속해서 개발하고 시험한다","더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며"],"blocks":[{"t":"pair","h":"Some people vs Others","x":[["keep the process simple","과정을 단순하게 유지하자 (단순파)"],["continue to develop and test new ways of voting","새 투표 방법을 계속 개발하고 시험하자 (정확파)"]]},{"t":"p","h":"cease(그만두다)를 넣으면","x":["\"더 복잡한 방식이 더 정확하다고 주장하며 개발을 그만둔다\"가 된다.","더 낫다고 믿으면서 그만둘 이유가 없다.","arguing(주장하며)과 행동이 같은 방향이어야 한다."]}],"post":["continue(계속하다) ↔ cease(그만두다)","단순파 대 계속 개발하는 정확파"]},{"slots":[["simple","uncomplicated","s"],["accurate","precise","s"],["difficult"],["better","inferior","a"],["weighing"]],"opts":["better","poorer","weaker","riskier"],"or":["better(더 나은): not A, but B(A가 아니라 B)에서 A가 '어렵고 비효율적인'이니 B는 좋은 쪽이어야 맞음.","poorer(더 형편없는): 투표 방식을 연구하는 목적이 형편없는 결정일 리 없음.","weaker(더 약한): 약한 결정을 돕는다는 건 노력의 목적이 될 수 없음.","riskier(더 위험한): 더 위험한 결정을 돕는다는 말은 사회를 위한 노력과 반대임."],"om":["더 나은","더 형편없는","더 약한","더 위험한"],"en":"All of these efforts are designed not to make decision-making difficult and inefficient, but to help us make better decisions as a society.","ko":"이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들기 위해서가 아니라, 우리가 사회로서 더 나은 의사 결정을 내리도록 돕기 위해 고안된 것이다.","hl":["to help us make better decisions as a society","not to make decision-making difficult and inefficient"],"khl":["더 나은 의사 결정을 내리도록 돕기 위해","어렵고 비효율적으로 만들기 위해서가 아니라"],"blocks":[{"t":"p","h":"not A, but B로 확인","x":["A: 의사 결정을 어렵고 비효율적으로 = 나쁜 쪽.","B: 그 반대여야 한다.","inferior(열등한, 더 못한)를 넣으면 A와 B가 둘 다 나쁜 쪽이 되어 버린다.","노력의 목적은 더 나은 결정이다."]},{"t":"p","h":"본문 ①과 이어지는 말","x":["본문 ①: 투표는 결정을 fairer and more efficient(더 공정하고 더 효율적으로) 하려고 쓴다.","본문 ⑦: 노력은 더 나은 결정을 돕기 위한 것.","글의 처음과 끝이 같은 목적을 말한다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","uncomplicated(복잡하지 않은)는 simple(단순한) 자리에, precise(정밀한)는 accurate(정확한) 자리에 써도 된다."]}],"post":["better(더 나은) ↔ inferior(열등한)","모든 노력의 목적 = 사회의 더 나은 결정"]}],"quiz":[{"w":"single","m":"단 하나의","it":[["sole","유일한","s"],["multiple","여러 개의","a"],["fluent","유창한","n"],["lone","혼자의, 단 하나의","s"],["many","많은","a"],["sour","신","n"],["humble","겸손한","n"]]},{"w":"like","m":"좋아하다","it":[["enjoy","즐기다","s"],["dislike","싫어하다","a"],["borrow","빌리다","n"],["favor","선호하다","s"],["hate","몹시 싫어하다","a"],["sweep","쓸다","n"],["freeze","얼다","n"]]},{"w":"challenging","m":"힘든, 도전적인","it":[["demanding","힘든","s"],["easy","쉬운","a"],["rural","시골의","n"],["difficult","어려운","s"],["effortless","수월한","a"],["shiny","반짝이는","n"],["annual","해마다의","n"]]},{"w":"continue","m":"계속하다","it":[["carry on","계속하다","s"],["stop","멈추다","a"],["whisper","속삭이다","n"],["keep on","계속하다","s"],["cease","그만두다","a"],["polish","닦다","n"],["swallow","삼키다","n"]]},{"w":"better","m":"더 나은","it":[["superior","우수한, 더 나은","s"],["worse","더 나쁜","a"],["sticky","끈적한","n"],["improved","개선된","s"],["inferior","열등한","a"],["frozen","얼어붙은","n"],["muddy","진흙투성이의","n"]]}]},{"items":[{"slots":[["single"],["easier","more troublesome","a"],["differed"],["intense","heated","s"],["liked"]],"opts":["easier","tougher","slower","messier"],"or":["easier(더 쉬운): 모든 방식이 한 선택지를 가리키면 고민할 것이 없어 결정이 쉬워지니 맞음.","tougher(더 힘든): 한 승자로 모이면 결정이 힘들어질 이유가 없음.","slower(더 느린): 한 답으로 모이면 결정이 오히려 빨라짐.","messier(더 엉망인): 승자가 하나로 정리되면 엉망이 될 것이 없음."],"om":["더 쉬운","더 힘든","더 느린","더 엉망인"],"en":"Instead of all methods pointing toward a single option and making the council’s choice easier, the winner differed with each method.","ko":"모든 방식이 하나의 선택지를 가리켜 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자가 달랐다.","hl":["making the council’s choice easier","a single option"],"khl":["자치회의 선택을 더 쉽게","하나의 선택지"],"blocks":[{"t":"tap","h":"질문 하나","q":"FPTP(단순 다수결)도 AV(대안 투표)도 콩도르세도 모두 A를 골랐다면?","a":["고민 없이 A로 결정.","결정이 easier(더 쉬운) 쪽이 된다.","more troublesome(더 골치 아픈)을 넣으면 답이 하나로 모였는데 더 골치 아파졌다는 말이 된다."]},{"t":"p","h":"함정","x":["heated(열띤)는 intense(격렬한) 자리에 넣어도 된다.","a long, heated discussion(길고 열띤 논의)도 자연스럽다."]}],"post":["easier(더 쉬운) ↔ more troublesome(더 골치 아픈)","승자가 하나였다면 결정이 쉬웠을 것"]},{"slots":[["liked","favored","s"],["directly","indirectly","a"],["obvious","evident","s"],["ideal"],["challenging"]],"opts":["directly","vaguely","randomly","partly"],"or":["directly(직접): 콩도르세는 두 선택지를 일대일로 맞붙여 비교하니 맞음.","vaguely(막연하게): 11 대 9처럼 숫자로 정확히 맞붙이는 방식이라 막연하지 않음.","randomly(무작위로): 가능한 모든 쌍을 빠짐없이 비교하니 무작위가 아님.","partly(부분적으로): 각 선택지를 나머지 모두와 비교하니 부분적이지 않음."],"om":["직접","막연하게","무작위로","부분적으로"],"en":"the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.","ko":"학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접 비교한다는 발상이 마음에 들었기 때문이다.","hl":["directly comparing each option with the others","the Condorcet method"],"khl":["각 선택지를 다른 선택지들과 직접 비교한다는","콩도르세 방식"],"blocks":[{"t":"p","h":"본문 ⑥에서 확인","x":["콩도르세는 A 대 B, B 대 C, A 대 C를 맞대결시켰다.","두 선택지를 바로 붙여 본 것, 그게 직접 비교다.","indirectly(간접적으로)를 넣으면 콩도르세의 특징이 사라진다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","favored(선호했다)는 liked(좋아했다) 자리에, evident(분명한)는 obvious(분명한) 자리에 넣어도 된다."]}],"post":["directly(직접) ↔ indirectly(간접적으로)","콩도르세 = 일대일 직접 비교"]},{"slots":[["challenging","demanding","s"],["flawless","defective","a"],["superior"],["simple"],["continue"]],"opts":["flawless","faulty","imperfect","weak"],"or":["flawless(흠 없는): 세 방식 모두 약점이 있었으니 '흠 없는 시스템은 없다'가 맞음.","faulty(결함 있는): '결함 있는 시스템은 없다'가 되어 장단점이 있다는 다음 문장과 부딪침.","imperfect(불완전한): '불완전한 시스템은 없다'는 세 방식 모두 약점이 있었다는 사실과 반대임.","weak(약한): '약한 시스템은 없다'는 본문이 하나하나 짚은 약점과 맞지 않음."],"om":["흠 없는","결함 있는","불완전한","약한"],"en":"No voting system is flawless or clearly superior to another. Whichever we choose will have pros and cons.","ko":"어떤 투표 시스템도 완벽하지 않고, 다른 시스템보다 명백히 우수하지도 않다. 우리가 어느 것을 고르든 장단점이 있을 것이다.","hl":["No voting system is flawless","will have pros and cons"],"khl":["어떤 투표 시스템도 완벽하지 않고","장단점이 있을 것이다"],"blocks":[{"t":"p","h":"No(어떤 ~도 아닌)와 함께 읽기","x":["No voting system is flawless(흠 없는 투표 시스템은 하나도 없다).","defective(결함이 있는)를 넣으면 \"결함 있는 시스템은 하나도 없다\"가 된다.","그런데 다음 문장은 어느 것이든 cons(단점)가 있다고 한다.","단점은 있는데 결함은 없다? 모순이다."]},{"t":"p","h":"Arrow의 불가능성 정리","x":["경제학자 Kenneth Arrow(케네스 애로)는 세 개 이상의 선택지가 있을 때 모든 조건을 다 만족하는 완벽한 투표 방식은 없다는 것을 증명했다.","본문 ⑦의 이 문장과 같은 결론이다."]},{"t":"p","h":"함정","x":["demanding(힘든)은 challenging(힘든) 자리에 넣어도 같은 뜻이다."]}],"post":["flawless(흠 없는) ↔ defective(결함이 있는)","완벽한 투표 시스템은 없음, 장단점뿐"]},{"slots":[["continue"],["accurate","inaccurate","a"],["difficult"],["better"],["weighing"]],"opts":["accurate","misleading","unreliable","distorted"],"or":["accurate(정확한): 더 복잡한 방식을 계속 개발하는 이유가 더 정확한 결과이니 맞음.","misleading(오해를 부르는): 오해를 부르는 결과를 내려고 새 방식을 만들 사람은 없음.","unreliable(믿을 수 없는): 믿을 수 없는 결과는 개발의 근거가 아니라 버릴 이유임.","distorted(왜곡된): 왜곡된 결과를 낸다고 주장하며 계속 개발한다는 건 모순임."],"om":["정확한","오해를 부르는","믿을 수 없는","왜곡된"],"en":"Others continue to develop and test new ways of voting, arguing that more complex methods deliver more accurate results.","ko":"다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 새로운 투표 방법을 계속해서 개발하고 시험한다.","hl":["more accurate results","continue to develop and test"],"khl":["더 정확한 결과","계속해서 개발하고 시험한다"],"blocks":[{"t":"p","h":"복잡함을 감수하는 이유","x":["단순파는 순위를 아예 매기지 말자고 한다.","정확파는 더 복잡해도 괜찮다고 한다.","대가로 얻는 것이 더 정확한 결과이기 때문이다.","inaccurate(부정확한)를 넣으면 복잡함을 감수할 이유가 없어진다."]},{"t":"tap","h":"질문 하나","q":"본문 속 '더 복잡한 방식'의 예는?","a":["AV(대안 투표)와 콩도르세 방식.","2지망·3지망까지 반영해 사람들의 선호를 더 자세히 담는다."]}],"post":["accurate(정확한) ↔ inaccurate(부정확한)","복잡함의 대가 = 더 정확한 결과"]},{"slots":[["accurate"],["difficult","hard","s"],["better"],["weighing","evaluating","s"],["likely","unlikely","a"]],"opts":["likely","reluctant","unable","afraid"],"or":["likely(~할 가능성이 높은): 의사 결정을 잘 이해할수록 더 나은 결정자가 되기 쉽다는 결론이라 맞음.","reluctant(꺼리는): 잘 이해하면 더 나은 결정자가 되길 꺼린다는 건 말이 안 됨.","unable(~할 수 없는): 이해할수록 더 못 하게 된다는 건 글의 결론과 정반대임.","afraid(두려워하는): 이해가 깊어지면 두려워진다는 내용은 본문 어디에도 없음."],"om":["~할 가능성이 높은","꺼리는","~할 수 없는","두려워하는"],"en":"When we understand decision-making better, we are more likely to become better decision-makers ourselves.","ko":"우리가 의사 결정을 더 잘 이해할 때, 우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다.","hl":["we are more likely to become better decision-makers","When we understand decision-making better"],"khl":["더 나은 의사 결정자가 될 가능성이 더 높다","의사 결정을 더 잘 이해할 때"],"blocks":[{"t":"p","h":"글의 마지막 한 줄","x":["When(~할 때) 절: 의사 결정을 더 잘 이해하면","주절: 더 나은 결정자가 될 가능성이 높다.","앞이 좋아지면 뒤도 좋아지는 구조.","unlikely(~할 것 같지 않은)를 넣으면 이해할수록 나빠진다는 말이 된다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","hard(어려운)는 difficult(어려운) 자리에, evaluating(평가하는 것)은 weighing(따져 보는 것) 자리에 넣어도 된다."]}],"post":["likely(가능성이 높은) ↔ unlikely(가능성이 낮은)","이해가 깊을수록 더 나은 결정자"]}],"quiz":[{"w":"easy","m":"쉬운","it":[["simple","간단한","s"],["hard","어려운","a"],["loyal","충실한","n"],["effortless","수월한","s"],["difficult","어려운","a"],["noisy","시끄러운","n"],["ancient","고대의","n"]]},{"w":"directly","m":"직접, 곧바로","it":[["straight","곧바로","s"],["indirectly","간접적으로","a"],["loudly","큰 소리로","n"],["firsthand","직접, 몸소","s"],["secondhand","간접적으로, 전해 들어","a"],["weekly","매주","n"],["neatly","깔끔하게","n"]]},{"w":"flawless","m":"흠 없는, 완벽한","it":[["perfect","완벽한","s"],["flawed","결함이 있는","a"],["thirsty","목마른","n"],["faultless","흠잡을 데 없는","s"],["defective","결함이 있는","a"],["brave","용감한","n"],["round","둥근","n"]]},{"w":"accurate","m":"정확한","it":[["precise","정밀한, 정확한","s"],["inaccurate","부정확한","a"],["generous","관대한","n"],["exact","정확한","s"],["wrong","틀린","a"],["hungry","배고픈","n"],["fragile","깨지기 쉬운","n"]]},{"w":"likely","m":"~할 가능성이 높은","it":[["probable","있을 법한","s"],["unlikely","~할 것 같지 않은","a"],["punctual","시간을 잘 지키는","n"],["apt","~하기 쉬운","s"],["improbable","있을 법하지 않은","a"],["urgent","긴급한","n"],["shiny","반짝이는","n"]]}]}],"no":"본문 ❼"}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
