<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>어휘특훈 · 영어II 능률(오) 3과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

"똑같은"],"en":"Their three options were an art show, a bake sale, and a charity concert, but there were conflicting opinions. So they decided to put it to a vote.","ko":"그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다. 그래서 그들은 그것을 투표에 부치기로 결정했다.","hl":["conflicting opinions","So they decided to put it to a vote"],"khl":["상충되는 의견들","그래서 그들은 그것을 투표에 부치기로"],"blocks":[{"t":"flow","h":"원인과 결과","x":["후보 셋: 미술 전시회, 빵 바자회, 자선 콘서트","의견이 갈림","그래서 투표에 부침"],"at":1},{"t":"p","h":"consistent(일관된)가 틀린 이유","x":["consistent(일관된, 일치하는)를 넣으면 \"의견이 다 맞았다\"가 된다.","그러면 So(그래서) 뒤 \"투표에 부쳤다\"가 이상해진다.","다 같은 의견이면 그냥 정하면 된다.","투표는 의견이 부딪칠 때 꺼내는 방법이다."]}],"post":["conflicting(상충하는) ↔ consistent(일관된)","의견이 갈림 → 투표에 부침"]},{"slots":[["conflicting","opposing","s"],["encouraged","urged","s"],["familiar"],["different","similar","a"],["yield"]],"opts":["different","traditional","common","standard"],"or":["different(다른): 익숙한 방법과 반대편에 서는 말이라 not A, but B(A가 아니라 B)에 딱 맞음.","traditional(전통적인): 전통적인 걸 해 보라면 '익숙한 방법은 쓰지 말라'와 부딪침.","common(흔한): 흔한 것을 해 보라면 익숙한 방법을 버리라는 조언과 반대임.","standard(표준의): 표준 방식은 바로 그 익숙한 방법이라 조언이 무너짐."],"om":["다른","전통적인","흔한","표준의"],"en":"When they asked for advice from Ms. Akers, the council’s advisor, she encouraged them not to use the familiar voting method, but to try something different instead.","ko":"그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고 대신 다른 것을 시도해 보라고 권장했다.","hl":["something different instead","not to use the familiar voting method"],"khl":["대신 다른 것을","익숙한 투표 방법을 사용하지 말고"],"blocks":[{"t":"p","h":"instead(대신)가 주는 힌트","x":["instead(대신)는 앞의 것을 버리고 다른 것을 고를 때 쓴다.","버린 것은 familiar(익숙한) 방법이다.","그러니 새로 고르는 것은 익숙한 것과 달라야 한다.","similar(비슷한)를 넣으면 \"익숙한 방법은 말고 대신 비슷한 것을\"이 된다.","이건 바꾼 게 아니다."]},{"t":"p","h":"이야기 속 결과","x":["실제로 자치회는 낯선 세 방식인 FPTP(단순 다수결), AV(대안 투표), Condorcet(콩도르세) 방식을 시험한다.","선생님 조언이 \"다른 것을 해 봐라\"였기 때문이다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","opposing(서로 대립하는)은 conflicting(상충하는)과, urged(강력히 권했다)는 encouraged(권장했다)와 뜻이 통한다.","이 둘을 고쳤 illustrates","demonstrates","s"],["conflicting"]],"opts":["fairer","harsher","slower","messier"],"or":["fairer(더 공정한): 투표를 쓰는 목적이라 more efficient(더 효율적인)와 나란히 좋은 쪽으로 맞음.","harsher(더 가혹한): 결정을 일부러 가혹하게 만들려고 투표를 쓰지는 않음.","slower(더 느린): 더 느리게 하면서 동시에 더 효율적이라는 말은 서로 부딪침.","messier(더 엉망인): 엉망으로 만드는 건 목적이 아니라 피하고 싶은 결과임."],"om":["더 공정한","더 가혹한","더 느린","더 엉망인"],"en":"Voting is often used to make group decisions fairer and more efficient, and various voting methods have been developed over time.","ko":"투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다.","hl":["fairer and more efficient","is often used to make"],"khl":["더 공정하고 더 효율적으로","만들기 위해 사용되며"],"blocks":[{"t":"p","h":"투표가 왜 생겼을까","x":["사람이 많고 의견이 갈리면 목소리 큰 사람이 이기기 쉽다.","투표는 한 사람이 한 표씩 똑같이 갖게 한다.","그래서 투표의 첫째 목적은 fair(공정한) 결정이다.","more biased(더 편향된)를 넣으면 \"한쪽으로 치우치게 하려고 투표한다\"가 된다."]},{"t":"p","h":"and로 묶인 짝","x":["fairer and more efficient(더 공정하고 더 효율적인)는 둘 다 좋은 점이다.","한쪽만 나쁜 말로 바뀌면 짝이 깨진다."]},{"t":"p","h":"고치면 안 되는 단어 둘","x":["created(만들어진)는 developed(개발된) 자리에 넣어도 뜻이 통한다.","demonstrates(보여 주다)는 illustrates(분명히 보여 주다)와 같은 말이다."]}],"post":["fair(공정한) ↔ biased(편향된)","투표의 목적 = 더 공정하게, 더 효율적으로"]}],"quiz":[{"w":"involve","m":"수반하다, 포함하다","it":[["include","포함하다","s"],["borrow","빌리다","n"],["exclude","제외하다","a"],["entail","수반하다","s"],["whisper","속삭이다","n"],["omit","빠뜨리다","a"],["repair","수리하다","n"]]},{"w":"differing","m":"서로 다른","it":[["varying","다양한","s"],["identical","똑같은","a"],["brave","용감한","n"],["different","다른","s"],["same","같은","a"],["thirsty","목마른","n"],["wooden","나무로 된","n"]]},{"w":"illustrate","m":"분명히 보여 주다, 설명하다","it":[["demonstrate","보여 주다, 입증하다","s"],["swallow","삼키다","n"],["conceal","숨기다","a"],["show","보여 주다","s"],["obscure","흐리게 하다, 모호하게 하다","a"],["knit","뜨개질하다","n"],["sweep","쓸다","n"]]},{"w":"various","m":"다양한, 여러 가지의","it":[["diverse","다양한","s"],["uniform","획일적인, 균일한","a"],["salty","짠","n"],["assorted","여러 가지의, 갖은","s"],["alike","비슷한, 같은","a"],["round","둥근","n"],["sticky","끈적한","n"]]},{"w":"fair","m":"공정한","it":[["impartial","공정한, 치우치지 않은","s"],["hollow","속이 빈","n"],["unfair","불공정한","a"],["unbiased","편견 없는","s"],["sleepy","졸린","n"],["biased","편향된","a"],["woolen","양모로 된","n"]]}]}],"no":"본문 ❶❷"},{"id":"e2-L3-3c","title":"어휘특훈 · 영어II 3과 본문 ③+④","sub":"순위를 적은 투표용지 + 방식 1: 단순 다수결(FPTP)","tpl":"On the day of the vote, each possible event was given a letter: “art show” was {represented} by the letter A, the letter B {indicated} “bake sale,” and C stood for “charity concert.” Each of the 20 council members was given a voting slip and {instructed} to write down the options in order of preference. For example, if the charity concert was their {first} choice, {followed} by the bake sale and the art show, they would write CBA. After every member had voted, the voting slips were {counted}. The results were as follows: The FPTP method is the {simplest} of the three methods. Voters are given several options, and whichever gets the {most} first-preference votes wins. Neither the second nor third preference {matters} at all, so they are {ignored}. This method is {commonly} used in political elections around the world. The student council quickly determined that the {winner} would be option C, the charity concert. This was because it {received} 8 first-preference votes, while option A received 5 and option B received 7. The FPTP method is {uncomplicated} and easy to understand, but it has a {significant} {weakness}. It is {possible} to win a vote without the {support} of the majority. That was the case here. According to the results of the FPTP method, the council’s choice was to hold a charity concert. However, only 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes.","fn":["*voting slip: 투표용지","*FPTP(first-past-the-post): 최다 득표자 당선 방식(단순 다수결)"],"mean":{"represented":"동사 represent(나타내다, 상징하다)의 과거분사형","symbolized":"동사 symbolize(상징하다)의 과거분사형","indicated":"동사 indicate(나타내다, 가리키다)의 과거형","signified":"동사 s wed"],["counted"]],"opts":["first","final","lowest","third"],"or":["first(첫 번째의): CBA(C·B·A 순)에서 C가 맨 앞이니 자선 콘서트가 1지망이라 맞음.","final(마지막의): 마지막 선택이면 C가 CBA(C·B·A 순)의 맨 끝에 와야 함.","lowest(가장 낮은): 가장 낮은 순위면 C를 맨 앞에 쓸 수 없음.","third(세 번째의): 세 번째면 순서가 BAC(B·A·C 순)나 ABC(A·B·C 순)처럼 C가 끝에 와야 함."],"om":["첫 번째의","마지막의","가장 낮은","세 번째의"],"en":"For example, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.","ko":"예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다.","hl":["their first choice","they would write CBA"],"khl":["첫 번째 선택","CBA를 적을 것이다"],"blocks":[{"t":"flow","h":"투표용지 한 장 읽기","x":["C = 자선 콘서트 (1지망)","B = 빵 바자회 (2지망)","A = 미술 전시회 (3지망)","적는 법: 좋아하는 순서대로 → CBA(C·B·A 순)"],"at":0},{"t":"p","h":"last(마지막의)를 넣고 읽어 보기","x":["\"자선 콘서트가 마지막 선택이면 CBA(C·B·A 순)라고 쓴다\"가 된다.","하지만 투표용지는 선호 순서대로(in order of preference = 선호하는 순서대로) 적는다.","마지막 선택이면 C는 맨 끝에 와야 한다.","CBA(C·B·A 순)의 맨 앞 글자가 C라는 것이 정답의 근거다."]}],"post":["first(첫 번째의) ↔ last(마지막의)","CBA(C·B·A 순) = C가 1지망, A가 3지망"]},{"slots":[["indicated","signified","s"],["counted","tallied","s"],["simplest","trickiest","a"],["most"],["matters"]],"opts":["simplest","hardest","slowest","toughest"],"or":["simplest(가장 간단한): 1지망만 세고 끝나는 방식이라 맞음.","hardest(가장 어려운): 같은 본문 뒤쪽에서 uncomplicated and easy(복잡하지 않고 쉽다)라고 하니 반대임.","slowest(가장 느린): 자치회가 quickly(빠르게) 승자를 정했으니 반대임.","toughest(가장 힘든): 2지망·3지망은 아예 무시하는 방식이라 힘들 것이 없음."],"om":["가장 간단한","가장 어려운","가장 느린","가장 힘든"],"en":"The FPTP method is the simplest of the three methods. Voters are given several options, and whichever gets the most first-preference votes wins.","ko":"FPTP 방식은 세 가지 방식 중 가장 간단하다. 투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다.","hl":["the simplest of the three methods","the most first-preference votes wins"],"khl":["가장 간단하다","가장 많은 1지망 표를 얻은 것이 이긴다"],"blocks":[{"t":"p","h":"규칙이 한 줄","x":["FPTP(단순 다수결)의 규칙은 한 줄이다.","1지망 표가 제일 많은 쪽이 이긴다.","2지망, 3지망은 보지도 않는다.","규칙이 이렇게 짧으니 세 방식 중 가장 간단하다."]},{"t":"pair","h":"같은 본문 속 짝꿍 표현","x":[["the simplest of the three methods","세 방식 중 가장 간단한"],["uncomplicated and easy to understand","복잡하지 않고 이해하기 쉬운"]]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","signified(나타냈다)는 indicated(나타냈다)와, tallied(집계되었다)는 counted(집계되었다)와 같은 뜻이다."]}],"post":["simplest(가장 간단한) ↔ trickiest(가장 까다로운)","FPTP(단순 다수결) = 1지망만 세는 한 줄 규칙"]},{"slots":[["simplest"],["most"],["matters","counts","s"],["ignored","counted","a"],["commonly"]],"opts":["ignored","weighed","included","examined"],"or":["ignored(무시되다): 2·3지망이 전혀 중요하지 않다는 앞 절과 같은 방향이라 맞음.","weighed(따져지다): 전혀 상관없다면서 따져 본다는 건 모순임.","included(포함되다): 1지망만 세는 FPTP(단순 다수결)의 규칙과 정반대임.","examined(검토되다): 중요하지 않다면서 꼼꼼히 들여다본다는 건 so(그래서)와 맞지 않음."],"om":["무시되다","따져지다","포함되다","검토되다"],"en":"Neither the second nor third preference matters at all, so they are ignored.","ko":"2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다.","hl":["so they are ignored","Neither the second nor third preference matters at all"],"khl":["그것들은 무시된다","2지망도 3지망도 둘 다 전혀 중요하지 않으므로"],"blocks":[{"t":"p","h":"so(그래서)가 정하는 방향","x":["앞: 2지망·3지망은 전혀 중요하지 않다.","so(그래서) 뒤: 그러니 어떻게 될까?","중요하지 않으니 버린다. 즉 무시된다.","counted(집계되다)를 넣으면 \"중요하지 않아서 집계한다\"가 된다."]},{"t":"p","h":"투표용지 속 버려지는 칸","x":["CBA(C·B·A 순)라고 적어도 FPTP(단순 다수결)는 C만 본다.","B와 A는 그냥 버려진다.","나중에 AV(대안 투표) 방식에서는 바로 이 2지망이 다시 살아난다."]},{"t":"p","h":"함정","x":["counts(중요하다)는 matters(중요하다) 자리에 넣어도 같은 뜻이다."]}],"post":["ignore(무시하다) ↔ count(세다, 집계하다)","FPTP(단순 다수결) = 2지망·3지망은 버리는 방식"]},{"slots":[["commonly"],["winner"],["received","lost","a"],["uncomplicated"],["significant"]],"opts":["received","missed","refused","returned"],"or":["received(받았다): C가 1지망 8표를 받아 A(5표), B(7표)보다 많아서 이겼으니 맞음.","missed(놓쳤다): 8표를 놓쳐서 이겼다는 건 말이 안 됨.","refused(거절했다): 표를 거절하고 승자가 될 수는 없음.","returned(돌려줬다): 표를 돌려준 쪽이 이겼다는 건 앞뒤가 안 맞음."],"om":["받았다","놓쳤다","거절했다","돌려줬다"],"en":"This was because it received 8 first-preference votes, while option A received 5 and option B received 7.","ko":"이는 그것(선택지 C)이 8표의 1지망 표를 받았기 때문이었는데, 반면 선택지 A는 5표, 선택지 B는 7표를 받았다.","hl":[" st","가장 이른","s"],["final","마지막의","a"],["loyal","충실한","n"],["fragile","깨지기 쉬운","n"]]},{"w":"simple","m":"간단한, 단순한","it":[["easy","쉬운","s"],["complex","복잡한","a"],["brave","용감한","n"],["plain","평이한, 단순한","s"],["difficult","어려운","a"],["hungry","배고픈","n"],["annual","해마다의","n"]]},{"w":"ignore","m":"무시하다","it":[["disregard","무시하다","s"],["notice","알아차리다","a"],["borrow","빌리다","n"],["neglect","소홀히 하다, 무시하다","s"],["heed","주의를 기울이다","a"],["whisper","속삭이다","n"],["knit","뜨개질하다","n"]]},{"w":"receive","m":"받다","it":[["obtain","얻다","s"],["lose","잃다","a"],["sneeze","재채기하다","n"],["get","받다, 얻다","s"],["forfeit","(권리·표 등을) 잃다, 빼앗기다","a"],["polish","닦다","n"],["swallow","삼키다","n"]]},{"w":"weakness","m":"약점","it":[["flaw","결함","s"],["strength","강점","a"],["ladder","사다리","n"],["shortcoming","단점","s"],["advantage","장점","a"],["pillow","베개","n"],["harbor","항구","n"]]}]},{"items":[{"slots":[["represented","symbolized","s"],["instructed"],["first"],["followed","preceded","a"],["counted"]],"opts":["followed","led","headed","topped"],"or":["followed(뒤따라지는): 1지망 C 뒤에 B, A가 이어진다는 뜻이라 CBA(C·B·A 순)와 맞음.","led(이끌어지는): B와 A가 C를 앞에서 이끈다면 C가 1지망일 수 없음.","headed(앞세워지는): B·A가 맨 앞에 서면 CBA(C·B·A 순)가 아니라 BAC(B·A·C 순) 같은 순서가 됨.","topped(위에 놓이는): B·A가 C보다 위면 C가 첫 번째 선택이라는 말과 부딪침."],"om":["뒤따르다","이끌다","앞장서다","맨 위에 오다"],"en":"For example, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.","ko":"예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다.","hl":["followed by the bake sale and the art show","their first choice"],"khl":["빵 바자회와 미술 전시회가 뒤따른다면","첫 번째 선택"],"blocks":[{"t":"p","h":"followed by = 뒤에 줄 서기","x":["A followed by B(A 다음에 B가 옴)는 \"A 다음에 B가 온다\"는 뜻이다.","C followed by B and A(C 다음에 B와 A가 옴) = C 다음 B, 그다음 A.","그래서 CBA(C·B·A 순)."]},{"t":"p","h":"preceded(앞서는)를 넣으면","x":["preceded by(~이 앞서는)는 \"앞에 ~이 온다\"는 뜻이다.","그러면 B와 A가 C보다 앞에 선다.","첫 번째 선택인 C 앞에 다른 것이 온다는 건 모순이다.","CBA(C·B·A 순)라는 글자 순서와도 맞지 않는다."]},{"t":"p","h":"함정","x":["symbolized(상징되었다)는 represented(나타내졌다) 자리에 넣어도 같은 뜻이다."]}],"post":["follow(뒤따르다) ↔ precede(앞서다)","C 다음 B, 그다음 A = CBA(C·B·A 순)"]},{"slots":[["instructed","told","s"],["first","top","s"],["most","fewest","a"],["ignored"],["winner"]],"opts":["most","least","smallest","lowest"],"or":["most(가장 많은): 1지망을 가장 많이 받은 C가 이긴 실제 결과와 맞음.","least(가장 적은): 가장 적게 받은 A(5표)가 이겨야 하는데 실제 승자는 C임.","smallest(가장 작은): 표가 가장 작은 쪽이 이긴다는 건 투표의 기본과 반대임.","lowest(가장 낮은): 가장 낮은 득표가 이긴다면 C가 승자가 될 수 없음."],"om":["가장 많은","가장 적은","가장 작은","가장 낮은"],"en":"Voters are given several options, and whichever gets the most first-preference votes wins.","ko":"투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다.","hl":["the most first-preference votes","whichever"],"khl":["가장 많은 1지망 표","어떤 것이든"],"blocks":[{"t":"tap","h":"질문 하나","q":"C 8표, B 7표, A 5표. FPTP(단순 다수결)의 승자는?","a":["C, 자선 콘서트.","1지망을 가장 많이 받았기 때문.","fewest(가장 적은)라면 A가 이겨야 하는데 본문의 승자는 C다."]},{"t":"p","h":"AV(대안 투표)와 헷갈리지 말 것","x":["fewest(가장 적은)는 본문 ⑤ AV(대안 투표) 방식에 나오는 단어다.","AV(대안 투표)에서는 1지망이 가장 적은 A가 \"탈락\"한다.","FPTP(단순 다수결): 가장 많은 쪽이 승리.","AV(대안 투표): 가장 적은 쪽이 먼저 탈락."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","told(지시받은)는 instructed(지시받은) 자리에, top(맨 위의)은 first(첫 번째의) 자리에 들어가도 뜻이 통한다."]}],"post":["most(가장 많은) ↔ fewest(가장 적은)","FPTP(단순 다수결) = 1지망 최다가 승리"]},{"slots":[["ignored","disregarded","s"],["commonly"],["winner","runner-up","a"],["received"],["uncomplicated"]],"opts":["winner","loser","outsider","underdog"],"or":["winner(승자): 1지망 8표로 가장 많이 받은 C가 이긴 결과라 맞음.","loser(패자): 가장 많이 받은 C가 졌다는 말은 결과와 정반대임.","outsider(승산 없는 후보): 표를 가장 많이 받은 C를 승산 없는 후보라 할 수 없음.","underdog(약자): 최다 득표인 C는 약자가 아니라 1등임."],"om":["승자","패자","승산 없는 후보","약자"],"en":"The student council quickly determined that the winner would be option C, the charity concert. This was because it received 8 first-preference votes, while option A received 5 and option B received 7.","ko":"학생 자치회는 승자가 자선 콘서트인 선택지 C가 될 것임을 빠르게 알아냈다. 이는 그것이 8표의 1지망 표를 받았기 때문이었는데, 반면 선택지 A는 5표, 선택지 B는 7표를 받았다.","hl":["the winner would be option C","This was because"],"khl":["승자가 자선 콘서트인 선택지 C가","이는 그것이"],"blocks":[{"t":"p","h":"This was because가 근거를 댄다","x":["This was because(이는 ~ 때문이었다) 뒤가 앞 문장의 이유다.","이유: C가 1지망 8표로 제일 많다.","제일 많이 받았으니 결과는 승리.","runner-up(2위)을 넣으면 \"가장 많이 받았는데 2위\"가 된다.","2위는 7표를 받은 B, 빵 바자회다."]},{"t":"p","h":"quickly(빠르게)의 이유","x":["1지망만 세면 끝나니 답이 금방 나온다.","그래서 자치회가 quickly(빠르게) 정할 수 있었다.","간단한 방식의 장점이 그대로 드러난 장면."]},{"t":"p","h":"함정","x":["disregarded(무시되는)는 ignored(무시되는) 자리에 넣어도 같은 뜻이다."]}],"post":["winner(승자) ↔ runner-up(2위)","FPTP(단순 다수결) 승자 = C 자선 콘서트(8표)"]},{"slots":[["received"],["uncomplicated","complicated","a"],["significant"],["weakness"],["possible"]],"opts":["uncomplicated","confusing","puzzling","elaborate"],"or":["uncomplicated(복잡하지 않은): 바로 옆 easy to understand(이해하기 쉬운)와 and로 나란히 서니 맞음.","confusing(헷갈리는): 헷갈리면서 이해하기 쉽다는 건 모순임.","puzzling(알쏭달쏭한): 알쏭달쏭한데 이해하기 쉽다는 말은 성립하지 않음.","elaborate(정교한, 복잡한): 세 방식 중 가장 간단하다는 앞 설명과 반대임."],"om":["복잡하지 않은","헷갈리는","알쏭달쏭한","정교한, 복잡한"],"en":"The FPTP method is uncomplicated and easy to understand, but it has a significant weakness.","ko":"FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다.","hl":["uncomplicated and easy to understand","but"],"khl":["복잡하지 않고 이해하기 쉽지만","약점"],"blocks":[{"t":"p","h":"and로 묶인 짝","x":["and(그리고)로 묶인 두 말은 같은 방향이어야 한다.","짝꿍이 easy to understand(이해하기 쉬운)다.","complicated(복잡한)와 easy(쉬운)는 한 대상에 같이 붙을 수 없다."]},{"t":"pair","h":"본문 ④의 처음과 끝","x":[["the simplest of the three methods","세 방식 중 가장 간단한 (④ 첫 문장)"],["uncomplicated and easy to understand","복잡하지 않고 이해하기 쉬운 (④ 뒷부분)"]]}],"post":["uncomplicated(복잡하지 않은) ↔ complicated(복잡한)","FPTP(단순 다수결) 장점 = 쉽고 간단함"]},{"slots":[["uncomplicated"],["significant","serious","s"],["weakness","flaw","s"],["possible"],["support","opposition","a"]],"opts":["support","objection","resistance","rejection"],"or":["support(지지): 20명 중 8명(40%)만 골랐으니 과반의 지지 없이 이긴 경우라 맞음.","objection(반대): 과반의 반대 없이 이기는 건 약점이 아니라 당연한 일임.","resistance(저항): 다수가 저항하지 않았다면 문제될 게 없어 '약점' 설명이 안 됨.","rejection(거부): 다수의 거부 없이 이긴다는 건 오히려 좋은 결과라 약점과 반대임."],"om":["지지","반대","저항","거부"],"en":"It is possible to win a vote without the support of the majority. That was the case here. According to the results of the FPTP method, the council’s choice was to hold a charity concert. However, only 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes.","ko":"과반수의 지지 없이도 투표에서 이기는 것이 가능하다. 이번이 바로 그 경우였다. FPTP 방식의 결과에 따르면, 자치회의 선택은 자선 콘서트를 여는 것이었다. 하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다.","hl":["without the support of the majority","only 8 out of 20"],"khl":["과반수의 지지 없이도","8명만이"],"blocks":[{"t":"flow","h":"약점이 실제로 드러난 과정","x":["FPTP(단순 다수결) 규칙: 1지망 최다가 승리","C가 8표로 승리","그런데 8/20 = 40%","과반(50% 넘게)의 지지는 못 받음"],"at":3},{"t":"p","h":"opposition(반대)을 넣으면","x":["\"과반의 반대 없이도 이길 수 있다\"가 된다.","반대 없이 이기는 건 약점이 아니라 당연한 일이다.","앞 문장이 \"상당한 약점\"이라고 했으니 문제점이 와야 한다.","과반이 \"지지하지 않았는데\" 이겼다는 것이 문제다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","serious(심각한)는 significant(상당한) 자리에, flaw(결함)는 weakness(약점) 자리에 넣어도 된다.","a serious flaw = 심각한 결함."]}],"post":["support(지지) ↔ opposition(반대)","40% 승리 = 과반의 지지 없는 승리"]}],"quiz":[{"w":"follow","m":"뒤따르다","it":[["succeed","뒤를 잇다","s"],["precede","앞서다","a"],["freeze","얼다","n"],["come after","~ 다음에 오다","s"],["lead","앞장서다, 이끌다","a"],["sweep","쓸다","n"],["bake","굽다","n"]]},{"w":"most","m":"가장 많은","it":[["greatest","가장 큰, 가장 많은","s"],["least","가장 적은","a"],["rural","시골의","n"],["maximum","최대의","s"],["fewest","가장 적은 수의","a"],["polite","공손한","n"],["frozen","얼어붙은","n"]]},{"w":"winner","m":"승자","it":[["victor","승리자","s"],["loser","패자","a"],["blanket","담요","n"],["champion","우승자","s"],["failure","실패자","a"],["kettle","주전자","n"],["meadow","풀밭","n"]]},{"w":"uncomplicated","m":"복잡하지 않은","it":[["straightforward","간단한, 복잡하지 않은","s"],["complicated","복잡한","a"],["sticky","끈적한","n"],["simple","간단한","s"],["intricate","복잡한, 뒤얽힌","a"],["noisy","시끄러운","n"],["ancient","고대의","n"]]},{"w":"support","m":"지지","it":[["backing","지지, 후원","s"],["opposition","반대","a"],["feather","깃털","n"],["approval","찬성, 승인","s"],["resistance","저항","a"],["tunnel","터널","n"],["recipe","요리법","n"]]}]}],"no":"본문 ❸❹"},{"id":"e2-L3-3e","title":"어휘특훈 · 영어II 3과 본문 ⑤","sub":"방식 2: 대안 투표(AV)","tpl":"Next, the council members {examined} the votes using the AV method, and they soon {realized} that there would be a {different} result. The AV method can {potentially} {include} more than one round of counting. For an option to {win} in the first round, it needs to get {more} than 50% of the first-preference votes. As the charity concert only received 40% of the total votes, a second round of counting was {required}. Option A, the art show, received the {fewest} first-preference votes, with only 5 council members voting for it. Therefore, option A was {eliminated}, and the 5 council members’ votes were {redistributed} based on their second preferences. As a result, 4 votes for option B (ABC) and 1 for option C (ACB) were {added} to the total. This meant that option B had 11 total votes, while option C had only 9. As a result, the bake sale would be the winner. {Unfortunately}, the AV method is not {perfect} either. It sometimes {allows} second-preference votes to have a {greater} influence than first-preference votes. In this case, the bake sale won, but this was {mainly} due to the second-preference votes it received.","fn":["*AV(alternative vote): 대안 투표(과반이 나올 때까지 최하위를 탈락시키고 표를 다시 나누는 방식)","*round: (집계의) 한 차례, 회"],"mean":{"examined":"동사 examine(검토하다)의 과거형","analyzed":"동사 analyze(분석하다)의 과거형","ignored":"동사 ignore(무시하다)의 과거형","realized":"동사 realize(깨닫다)의 과거형","recognized":"동사 recognize(알아차리다, 인식하다)의 과거형","doubted":"동사 doubt(의심하다)의 과거형","different":"다른","new":"새로운","potentially":"잠재적으로, 어쩌면","possibly":"어쩌면, 아마","include":"포함하다","involve":"수반하다, 포함하다","exclude":"제외하다","win":"이기다","succeed":"성공하다","lose":"지다","more":"더 많은(many·much의 비교급)","required":"동사 require(필요로 하다, 요구하다)의 과거분사형","needed":"동사 need(필요로 하다)의 과거분사형","unnecessary":"불필요한","fewest":"가장 적은(few의 최상급)","eliminated":"동사 eliminate(제거하다, 탈락시키다)의 과거분사형","removed":"동사 remove(제거하다)의 과거분사형","retained":"동사 retain(유지하다)의 과거분사형","redistributed":"동사 redistribute(재분배하다)의 과거분사형","reallocated":"동사 reallocate(재배분하다)의 과거분사형","added":"동사 add(더하다)의 과거분사형","subtracted":"동사 subtract(빼다)의 과거분사형","Unfortunately":"안타깝게도, 불행히도","Sadly":"슬프게도, 안타깝게도","Fortunately":"다행히도","perfect":"완벽한","flawless":"흠 없는","ideal":"이상적인","flawed":"결함이 있는","allows":"동사 allow(허락하다, ~하게 해 주다)의 3인칭 단수 현재형","forbids":"동사 forbid(금지하다)의 3인칭 단수 현재형","greater":"형용사 great(큰)의 비교급, 더 큰","stronger":"형용사 strong(강한)의 비교급, 더 강한","smaller":"형용사 small(작은)의 비교급, 더 작은","mainly":"주로","hardly":"거의 ~ 아니게"},"comp":[{"no":"본문 ❺","slots":[["different"],["potentially"],["win","lose","a"],["more"],["required","needed","s"]],"opts":["win","fail","withdraw","quit"],"or":["win(이기다): 1차 집계에서 이기려면 1지망 과반이 필요하다는 AV(대안 투표)의 규칙이라 맞음.","fail(실패하다): 과반을 얻어야 실패한다는 건 거꾸로 된 규칙임.","withdraw(물러나다): 표를 50% 넘게 얻은 쪽이 물러난다는 건 말이 안 됨.","quit(그만두다): 과반을 얻은 선택지가 그만둘 이유가 없음."],"om":["이기다","실패하다","물러나다","그만두다"],"en":"For an option to win in the first round, it needs to get more than 50% of the first-preference votes. As the charity concert only received 40% of the total votes, a second round of counting was required.","ko":"어떤 선택지가 1차 집계에서 이기기 위해서는, 1지망 표의 50%를 넘게 얻어야 한다. 자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다.","hl":["For an option to win in the first round","more than 50%"],"khl":["1차 집계에서 이기기 위해서는","50%를 넘게"],"blocks":[{"t":"p","h":"AV(대안 투표)의 첫 번째 규칙","x":["AV(대안 투표)의 승리 조건은 과반이다.","1지망 50%를 넘으면 1차에서 바로 이긴다.","lose(지다)를 넣으면 \"50%를 넘게 받으면 진다\"가 된다.","표를 많이 받을수록 지는 투표는 없다."]},{"t":"flow","h":"자선 콘서트의 1차 결과","x":["조건: 50% 넘게 받으면 1차 승리","자선 콘서트: 40%","조건을 못 채움","2차 집계로 넘어감"],"at":2},{"t":"p","h":"고치면 안 되는 단어","x":["needed(필요했다)는 required(필요했다)와 같은 뜻이라 맞는 표현."]}],"post":["win(이기다) ↔ lose(지다)","AV(대안 투표) 1차 승리 조건 = 1지망 과반"]},{"no":"본문 ❺","slots":[["eliminated","removed","s"],["added"],["Unfortunately"],["perfect","flawed","a"],["allows"]],"opts":["perfect","faulty","broken","defective"],"or":["perfect(완벽한): not perfect either(역시 완벽하지 않다) 뒤에 약점이 이어지니 맞음.","faulty(결함 있는): '결함이 있지 않다'가 되어 바로 뒤에 약점을 드는 흐름과 부딪침.","broken(고장 난): '고장 나지 않았다'는 말 뒤에 문제점을 꺼내는 건 앞뒤가 안 맞음.","defective(결함이 있는): faulty(결함 있는)와 같은 방향이라 뒤의 약점 설명과 모순임."],"om":["완벽한","결함 있는","고장 난","결함이 있는"],"en":"Unfortunately, the AV method is not perfect either. It sometimes allows second-preference votes to have a greater influence than first-preference votes.","ko":"안타깝게도, AV 방식 역시 완벽하지는 않다. 그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 한다.","hl":["not perfect either","Unfortunately"],"khl":["역시 완벽하지는 않다","안타깝게도"],"blocks":[{"t":"p","h":"either(역시)가 가리키는 것","x":["not ~ either(역시 ~하지 않다)는 \"앞의 것처럼 이것도\"라는 뜻이다.","앞의 것은 약점이 있던 FPTP(단순 다수결)다.","FPTP(단순 다수결)처럼 AV(대안 투표)도 완벽하지 않다는 말이다.","flawed(결함이 있는)를 넣으면 \"AV(대안 투표)도 결함이 없다\"가 되어 바로 뒤의 약점과 부딪친다."]},{"t":"p","h":"Unfortunately도 같은 방향","x":["Unfortunately(안타깝게도)는 나쁜 소식을 꺼낼 때 쓴다.","나쁜 소식 = AV(대안 투표)도 완벽하지 않다.","removed(제거된)는 eliminated(제거된) 자리에 넣어도 같은 뜻이다."]}],"post":["perfect(완벽한) ↔ flawed(결함이 있는)","FPTP(단순 다수결)도 AV(대안 투표)도 완벽하지 않음"]}],"compquiz":[{"w":"win","m":"이기다","it":[["triumph","승리하다","s"],["lose","지다","a"],["sneeze","재채기하다","n"],["succeed","성공하다","s"],["fail","실패하다","a"],["knit","뜨개질하다","n"],["bake","굽다","n"]]},{"w":"perfect","m":"완벽한","it":[["flawless","흠 없는","s"],["flawed","결함이 있는","a"],["rural","시골의","n"],["ideal","이상적인","s"],["imperfect","불완전한","a"],["sticky","끈적한","n"],["brave","용감한","n"]]}],"sets":[{"items":[{"slots":[["examined","ignored","a"],["realized"],["different"],["potentially"],["include"]],"opts":["examined","overlooked","skipped","neglected"],"or":["examined(검토했다): 표를 AV(대안 투표) 방식으로 들여다보고 나서 다른 결과를 깨달았으니 맞음.","overlooked(간과했다): 표를 보지도 않고 다른 결과를 깨달을 수는 없음.","skipped(건너뛰었다): 표를 건너뛰었다면 11표 대 9표 같은 계산이 나올 수 없음.","neglected(소홀히 했다): 뒤에서 표를 꼼꼼히 다시 나누는 과정과 반대임."],"om":["검토했다","간과했다","건너뛰었다","소홀히 했다"],"en":"Next, the council members examined the votes using the AV method, and they soon realized that there would be a different result.","ko":"다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 곧 다른 결과가 나올 것이라는 것을 깨달았다.","hl":["examined the votes","they soon realized"],"khl":["표를 검토했고","곧"],"blocks":[{"t":"flow","h":"본문 ⑤의 흐름","x":["같은 표를 AV(대안 투표)로 다시 봄","1차: 과반 없음","A 탈락, A의 표를 2지망대로 나눔","B 11표, C 9표 → 빵 바자회 승리","약점: 2지망이 더 큰 힘을 가질 수 있음"],"at":0},{"t":"p","h":"ignored(무시했다)를 넣으면","x":["\"표를 무시했고, 곧 다른 결과를 깨달았다\"가 된다.","표를 보지 않았는데 결과를 깨달을 수는 없다.","표를 들여다본 것(examine = 검토하다)이 깨달음의 출발이다."]}],"post":["examine(검토하다) ↔ ignore(무시하다)","같은 표, 다른 방식 = 다른 결과"]},{"slots":[["realized","doubted","a"],["different"],["potentially","possibly","s"],["include","involve","s"],["more"]],"opts":["realized","denied","forgot","disputed"],"or":["realized(깨달았다): 표를 AV(대안 투표)로 다시 보자 곧 결과가 달라진다는 걸 알아챘고, 실제로 승자가 빵 바자회로 바뀌니 맞음.","denied(부인했다): 다른 결과가 나온다는 걸 부인했다면 승자가 바뀌는 뒤 이야기와 부딪침.","forgot(잊어버렸다): 막 표를 검토하는 중에 결과를 잊었다는 건 흐름에 맞지 않음.","disputed(반박했다): 다른 결과를 반박했는데 실제로 결과가 달라졌으니 모순임."],"om":["깨달았다","부인했다","잊어버렸다","반박했다"],"en":"Next, the council members examined the votes using the AV method, and they soon realized that there would be a different result.","ko":"다음으로 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다.","hl":["they soon realized","there would be a different result"],"khl":["깨달았다","다른 결과가 나올 것"],"blocks":[{"t":"flow","h":"본문 ⑤가 맞히는 결말","x":["AV(대안 투표)로 표를 다시 봄","곧 다른 결과를 알아챔","A 탈락, A의 5표를 2지망대로 나눔","B 11표, C 9표","승자 = 빵 바자회 (FPTP(단순 다수결)와 다름)"],"at":1},{"t":"p","h":"doubted(의심했다)를 넣으면","x":["\"다른 결과가 나올지 의심했다\" = \"결과가 같을 거라 생각했다\"가 된다.","그런데 본문 끝에서 승자는 C가 아니라 B로 바뀐다.","첫 문장이 결말을 미리 알려 주는 예고편이다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","possibly(어쩌면)는 potentially(잠재적으로) 자리에, involve(수반하다)는 include(포함하다) 자리에 넣어도 뜻이 통한다."]}],"post":["realize(깨닫다) ↔ doubt(의심하다)","AV(대안 투표)로 다시 보니 승자가 바뀜"]},{"slots":[["fewest"],["eliminated","retained","a"],["redistributed","reallocated","s"],["added"],["Unfortunately"]],"opts":["eliminated","kept","protected","chosen"],"or":["eliminated(제거되었다) on B by a count of 11 to 9. In other words, 11 people preferred A to B, voting either ABC, ACB, or CAB. Meanwhile, 9 people preferred B to A by voting BAC, BCA, or CBA. Interestingly, the voters preferred option B to option C by the {same} count of 11 to 9. They also preferred option A to option C by 11 to 9. As option A, the art show, was preferred to both of the other options, it would be considered the {winner}. The Condorcet method’s {weakness} is that, along with being {complex}, it sometimes {fails} to {select} a winner. This is {especially} {true} in elections that {contain} {numerous} options. It is possible that no option will be {clearly} preferred over the others.","fn":["*Condorcet method: 콩도르세 방식(모든 선택지를 둘씩 짝지어 비교하는 방식)","*pair: 쌍, 짝"],"mean":{"Finally":"마지막으로","Lastly":"마지막으로","Initially":"처음에","comparing":"동사 compare(비교하다)의 -ing형. 동명사","weighing":"동사 weigh(따져 보다, 저울질하다)의 -ing형. 동명사","consider":"고려하다, 따져 보다","examine":"검토하다","ignore":"무시하다","discovered":"동사 discover(발견하다, 알아내다)의 과거형","found":"동사 find(알아내다)의 과거형","overlooked":"동사 overlook(간과하다)의 과거형","preferred":"동사 prefer(더 좋아하다, 선호하다)의 과거형","disliked":"동사 dislike(싫어하다)의 과거형","same":"같은","identical":"똑같은, 동일한","dissimilar":"같지 않은, 서로 다른","winner":"승자","victor":"승리자","loser":"패자","weakness":"약점","drawback":"결점, 단점","merit":"장점, 가치","complex":"복잡한","complicated":"복잡한","fails":"동사 fail(~하지 못하다, 실패하다)의 3인칭 단수 현재형. fail to ~ = ~하지 못하다","manages":"동사 manage(간신히 해내다)의 3인칭 단수 현재형. manage to ~ = 해내다","select":"고르다, 선택하다","choose":"고르다","pick":"고르다, 뽑다","reject":"거부하다","especially":"특히","particularly":"특히","true":"사실인, 맞는","false":"사실이 아닌, 틀린","contain":"포함하다, 담고 있다","include":"포함하다","rule out":"배제하다, 제외하다","numerous":"수많은","limited":"제한된, 많지 않은","clearly":"분명히, 명확하게","obviously":"분명히, 명백히"},"comp":[{"no":"본문 ❻","slots":[["complex"],["fails","manages","a"],["select"],["especially"],["clearly","obviously","s"]],"opts":["fails","succeeds","tends","hurries"],"or":["fails(~하지 못하다): weakness(약점)의 내용이 '승자를 못 고를 때가 있다'  바로 다음에 11명이 누구인지 설명할 수 없음.","forgot(잊었다): 잊은 결과로 A를 승자로 정할 수는 없음.","denied(부인했다): 집계로 나온 결과를 부인할 이유가 본문에 없음."],"om":["알아냈다","놓쳤다","잊었다","부인했다"],"en":"Through this method, the student council discovered that its members preferred option A to option B by a count of 11 to 9.","ko":"이 방식을 통해 학생 자치회는 구성원들이 선택지 B보다 선택지 A를 11대 9로 선호한다는 사실을 알아냈다.","hl":["the student council discovered","Through this method"],"khl":["알아냈다","이 방식을 통해"],"blocks":[{"t":"p","h":"Through this method(이 방식을 통해)","x":["이 방식 = 쌍을 하나씩 비교하는 것.","비교를 하면 결과가 드러난다.","드러난 결과를 \"알아냈다\".","overlooked(간과했다)를 넣으면 비교해 놓고 결과를 놓쳤다는 말이 된다."]},{"t":"p","h":"이 결과가 쓰이는 곳","x":["A가 B를 이긴다는 이 결과가 나중에 A를 승자로 만드는 근거가 된다.","놓친 결과로는 승자를 정할 수 없다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","weighing(따져 보기)은 comparing(비교하기)과, examine(검토하다)은 consider(고려하다)와 뜻이 통한다."]}],"post":["discover(알아내다) ↔ overlook(간과하다)","쌍 비교로 알아낸 결과 = A가 B보다 11:9"]},{"slots":[["preferred"],["same","dissimilar","a"],["winner","victor","s"],["weakness"],["complex"]],"opts":["same","unequal","opposite","reverse"],"or":["same(같은): 앞의 A 대 B도 11 대 9, B 대 C도 11 대 9라 맞음.","unequal(같지 않은): 숫자가 똑같이 11 대 9이니 다르다고 할 수 없음.","opposite(정반대의): 정반대면 9 대 11이어야 하는데 B가 11표로 이겼음.","reverse(거꾸로 된): 거꾸로 된 결과라면 C가 B를 이겼어야 함."],"om":["같은","같지 않은","정반대의","거꾸로 된"],"en":"Interestingly, the voters preferred option B to option C by the same count of 11 to 9. They also preferred option A to option C by 11 to 9.","ko":"흥미롭게도, 투표자들은 선택지 C보다 선택지 B를 똑같이 11대 9로 선호했다. 그들은 또한 선택지 C보다 선택지 A를 11대 9로 선호했다.","hl":["by the same count of 11 to 9","Interestingly"],"khl":["똑같이 11대 9로","흥미롭게도"],"blocks":[{"t":"flow","h":"세 쌍의 성적표","x":["A 대 B: 11 대 9 → A 승","B 대 C: 11 대 9 → B 승","A 대 C: 11 대 9 → A 승","A는 두 상대를 모두 이김 → 승자"],"at":1},{"t":"p","h":"Interestingly(흥미롭게도)의 이유","x":["무엇이 흥미로운가?","세 쌍 모두 점수가 똑같이 11 대 9라는 것.","dissimilar(같지 않은)를 넣으면 \"같지 않은 11 대 9\"가 된다.","앞도 11 대 9, 여기도 11 대 9인데 같지 않다고 하면 숫자와 말이 따로 논다."]},{"t":"p","h":"함정","x":["victor(승리자)는 winner(승자) 자리에 넣어도 같은 뜻이다."]}],"post":["same(같은) ↔
