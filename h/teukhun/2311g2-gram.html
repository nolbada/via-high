 모양.","wy":"watched(봤다): 과거형이라 앞의 reading(읽는 것)과 짝이 안 맞음."},{"s":"Thank you for ___ me.","o":["helping","help"],"a":0,"ko":"도와줘서 고마워.","why":"전치사 for(~에 대해) 뒤는 -ing.","wy":"help(돕다): 전치사 for(~에 대해) 뒤에 동사원형은 못 옴."}]},{"id":"2311g2-37","no":"37","title":"어법특훈 · 23년 11월 고2 37번","sub":"표본 추출의 한계와 라이트 필드 카메라","tpl":"For a long time, random sampling was a good shortcut. It made analysis of large data problems {possible|possible} in the pre-digital era. But much as {converting|converting} a digital image or song into a smaller file {results|results} in loss of data, information {is_lost|is lost} when sampling. Having the full (or close to the full) dataset {provides|provides} a lot more freedom to explore, to look at the data from different angles or {to_look|to look} closer at certain aspects of it. A fitting example may be the light-field camera, {which|which} {captures|captures} not just a single plane of light, as with conventional cameras, but rays from the entire light field, some 11 million of them. The photographers can {decide|decide} later which element of an image to focus on in the digital file. There {is|is} no need to focus at the beginning, since {collecting|collecting} all the information {makes|makes} {it|it} possible {to_do|to do} that afterwards. Because rays from the entire light field {are_included|are included}, it is closer to all the data. As a result, the information is more “reuseable” than ordinary pictures, {where|where} the photographer has to decide {what|what} to focus on before she {presses|presses} the shutter.","fn":["*random sampling: 무작위 표본 추출","*light-field camera: 라이트 필드 카메라(빛이 들어오는 방향까지 기록하는 카메라)"],"mean":{"possible":"가능한(형용사)","possibly":"아마, 어쩌면(부사)","impossibly":"불가능할 정도로(부사)","more possibly":"더 아마(possibly의 비교급, 부사)","being possible":"가능한 것, 가능한(be possible의 -ing형)","converting":"바꾸는 것(convert의 -ing형, 동명사)","convert":"바꾸다(동사원형)","converts":"바꾸다(convert의 3인칭 단수 현재형)","converted":"바꿨다(convert의 과거형·과거분사형)","to converting":"바꾸는 것으로(전치  lives(산다))"],["I have two dogs which love balls.","나는 공을 좋아하는 개 두 마리가 있다. (two dogs(개 두 마리) → love(좋아한다))"]]}],"post":["선행사(the light-field camera = 카메라 한 대) 보고 동사: which captures(포착하는)"]},{"slots":[["which","","","콤마 뒤 덧붙임 설명의 관계대명사."],["captures","","","선행사 camera(카메라)가 단수."],["decide","deciding","a","can(~할 수 있다)은 조동사. 조동사 뒤에는 항상 동사원형이 온다."],["is","","","진짜 주어 no need(필요 없음)가 단수."],["collecting","","","since(~ 때문에) 뒤 절의 주어 자리라 동명사."]],"opts":["decided","decides","decide","to decide"],"or":["decided(결정했다, 과거형·과거분사형): 조동사 뒤에 과거형은 못 옴.","decides(결정하다, 3인칭 단수형): 조동사 뒤에는 s가 붙지 않음.","decide(결정하다): 조동사 can(~할 수 있다) 뒤라 동사원형이 맞음.","to decide(결정하는 것): can(~할 수 있다) 뒤에 to는 붙지 않음."],"point":"조동사 + 동사원형","en":"The photographers can decide later which element of an image to focus on in the digital file.","ko":"사진작가들은 디지털 파일에서 이미지의 어느 요소에 초점을 맞출지를 나중에 결정할 수 있다.","hl":["can decide"],"khl":["결정할 수 있다"],"blocks":[{"t":"p","h":"조동사는 동사원형만 데려간다","x":["can(~할 수 있다), will(~할 것이다), must(~해야 한다), may(~일지도 모른다)는 조동사다.","조동사는 혼자 다니지 않고 꼭 동사원형을 데려간다.","can decide = 결정할 수 있다.","-ing, -ed, -s, to는 모두 조동사 뒤에 붙지 못한다."]},{"t":"pair","h":"쉬운 예시","x":[["You can sit here.","너는 여기 앉아도 된다. (can sit = 앉아도 된다)"],["She will come tomorrow.","그녀는 내일 올 것이다. (will come = 올 것이다)"]]}],"post":["조동사 can(~할 수 있다) + 동사원형: can decide(결정할 수 있다)"]},{"slots":[["decide","","","조동사 can(~할 수 있다) 뒤 동사원형."],["is","","","진짜 주어 no need(필요 없음)가 단수."],["makes","","","동명사 주어 collecting ...(모으는 것)은 단수라 makes(만들다)."],["it","them","a","뒤의 to do that afterwards(그것을 나중에 하는 것)를 대신 받는 가목적어 자리. 가목적어는 it만 쓴다."],["to_do","","","가목적어 it이 가리키는 진짜 목적어. to부정사."]],"opts":["its","it","they","itself"],"or":["its(그것의): 소유격이라 뒤에 명사가 와야 하는데 형용사 possible(가능한)이 옴.","it(가목적어): 뒤의 진짜 목적어 to do that(그것을 하는 것)을 대신 받는 자리라 맞음.","they(그것들은): 주격이라 makes(만들다)의 목적어 자리에 못 옴.","itself(그것 자체): 재귀대명사는 주어와 같은 대상일 때 쓰는데, 주어 collecting(모으는 것)이 자기 자신을 가능하게 만든다는 뜻이 아님."],"point":"가목적어 it","en":"There is no need to focus at the beginning, since collecting all the information makes it possible to do that afterwards.","ko":"모든 정보를 수집하는 것이 그것을 나중에 하는 것을 가능하게 만들기 때문에, 처음에 초점을 맞출 필요가 없다.","hl":["makes it possible to do that afterwards"],"khl":["그것을 나중에 하는 것을 가능하게 만들기"],"blocks":[{"t":"p","h":"자리 맡아 두기","x":["진짜 목적어 to do that afterwards(그것을 나중에 하는 것)가 너무 길다.","그래서 목적어 자리에 it을 먼저 앉혀 자리를 맡아 둔다.","make(만들다) + it + 형용사 + to부정사: ~하는 것을 ...하게 만들다.","자리 맡는 이 일은 it만 할 수 있다. them(그것들을), this(이것)는 안 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I found it hard to sleep.","나는 잠드는 것이 어렵다는 걸 알았다. (it = to sleep(잠드는 것))"],["The map made it easy to find the house.","그 지도는 집을 찾는 것을 쉽게 해 주었다. (it = to find the house(집을 찾는 것))"]]}],"post":["make(만들다) + it + 형용사 + to부정사: makes it possible to do(하는 것을 가능하게 만든다)"]},{"slots":[["makes","","","동명사 주어 collecting ...(모으는 것)은 단수."],["it","","","뒤의 to do that(그것을 하는 것)을 대신 받는 가목적어."],["to_do","","","가목적어 it의 진짜 목적어 to부정사."],["are_included","include","a","광선들은 무언가를 \"포함하는\" 쪽이 아니라 \"포함되는\" 쪽이다. include(포함하다) 뒤에 목적어도 없다."],["where","","","선행사 ordinary pictures(일반 사진들) 뒤, 완전한 문장이 오니 관계부사 where(그곳에서)."]],"opts":["is included","are including","are included","have included"],"or":["is included(포함된다, 단수형): 주어 rays(광선들)가 복수라 is(~이다, 단수형)와 안 맞음.","are including(포함하고 있다): 능동 진행형이라 목적어가 필요한데 없음.","are included(포함된다): 복수 rays(광선들)가 포함되는 쪽이라 be + p.p. 수동태가 맞음.","have included(포함해 왔다): 능동이라 목적어가 필요한데 없고, 광선들이 무언가를 포함한 뜻이 됨."],"point":"능동태 vs. 수동태","en":"Because rays from the entire light field are included, it is closer to all the data.","ko":"전체 라이트 필드로부터 오는 광선이 포함되기 때문에, 그것은 모든 데이터에 더 가깝다.","hl":["rays from the entire light field are included"],"khl":["광선이 포함되기"],"blocks":[{"t":"p","h":"포함하는 쪽 vs 포함되는 쪽","x":["주어는 rays(광선들). from the entire light field(전체 라이트 필드로부터의)는 꼬리표.","광선들이 사진 파일 안에 \"포함되는\" 쪽이다.","주어가 당하는 쪽이면 be + p.p.(수동태).","include(포함하다)는 \"~을\"이 꼭 필요한 동사다. 뒤가 비어 있으면 수동태 신호."]},{"t":"pair","h":"쉬운 예시","x":[["The cake was made by my mom.","그 케이크는 엄마가 만들었다. (케이크가 만들어짐 → 수동)"],["The price includes breakfast.","가격에 아침 식사가 포함된다. (가격이 아침을 포함함 → 능동, 목적어 있음)"]]}],"post":["주어가 당하고 목적어 없음 = 수동: rays are included(광선이 포함된다)"]},{"slots":[["to_do","","","가목적어 it의 진짜 목적어 to부정사."],["are_included","","","광선이 포함되는 쪽이라 수동태."],["where","which","a","뒤 문장 the photographer has to decide what to focus on(사진작가가 무엇에 초점을 맞출지 결정해야 한다)은 빠진 자리가 없는 완전한 문장이다. 완전한 문장 앞은 관계부사."],["what","","","decide(결정하다) 뒤 \"무엇을 ~할지\" = what + to부정사."],["presses","","","주어 she(그녀)가 단수라 presses(누르다)."]],"opts":["what","whom","who","where"],"or":["what(~하는 것): 앞에 명사 pictures(사진들)가 있으면 못 옴.","whom(~을): 사람을 받는 말이고, 뒤에 목적어 빈자리도 없음.","who(~하는): 사람을 받는 말이고, 뒤에 주어 the photographer(사진작가)가 이미 있음.","where(그곳에서): ordinary pictures(일반 사진들)라는 상황을 받고, 뒤 문장이 완전해서 관계부사가 맞음."],"point":"관계대명사 vs. 관계부사","en":"As a result, the information is more “reuseable” than ordinary pictures, where the photographer has to decide what to focus on before she presses the shutter.","ko":"결과적으로 그 정보는 일반 사진들보다 더 '재사용할 수 있는' 것인데, 일반 사진에서는 사진작가가 셔터를 누르기 전에 무엇에 초점을 맞출지 결정해야 한다.","hl":["ordinary pictures, where the photographer has to decide"],"khl":["일반 사진에서는"],"blocks":[{"t":"p","h":"뒤 문장에 빈자리가 있나","x":["which(~하는): 뒤 문장에 주어나 목적어 빈자리가 있어야 한다.","where(그곳에서): 뒤 문장이 꽉 찬 완전한 문장이어야 한다.","the photographer(주어) has to decide(동사) what to focus on(무엇에 초점을 맞출지 = 목적어). 빈자리가 없다.","그래서 where(그곳에서) = in which(그 안에서). \"그런 사진에서는\"이라는 뜻."]},{"t":"pair","h":"쉬운 예시","x":[["This is the house where I was born.","이것은 내가 태어난 집이다. (I was born(나는 태어났다) = 완전 → where)"],["This is the house which I bought.","이것은 내가 산 집이다. (bought(샀다)의 목적어가 빠짐 → which)"]]}],"post":["뒤가 완전하면 where(그곳에서) = in which(그 안에서)"]}],"quiz":[{"s":"The boy who ___ next door is kind.","o":["live","lives"],"a":1,"ko":"옆집에 사는 소년은 친절하다.","why":"선행사 The boy(소년)가 단수라 lives(산다).","wy":"live(살다): 복수 주어용이라 단수 The boy(소년)와 안 맞음."},{"s":"You can ___ here.","o":["sitting","sit"],"a":1,"ko":"너는 여기 앉아도 된다.","why":"조동사 can(~할 수 있다) 뒤는 동사원형.","wy":"sitting(앉는): 조동사 can(~할 수 있다) 뒤에 -ing는 못 옴."},{"s":"I found ___ hard to sleep.","o":["it","this"],"a":0,"ko":"나는 잠드는 것이 어렵다는 걸 알았다.","why":"to sleep(잠드는 것)을 대신 받는 가목적어 it.","wy":"this(이것): 뒤의 to부정사를 대신 받는 가목적어 자리는 it만 가능함."},{"s":"The cake was ___ by my mom.","o":["making","made"],"a":1,"ko":"그 케이크는 엄마가 만들었다.","why":"케이크가 만들어지는 쪽이라 be + p.p.","wy":"making(만드는): 케이크가 직접 무언가를 만든다는 뜻이 되고, 목적어도 없음."},{"s":"This is the house ___ I was born.","o":["which","where"],"a":1,"ko":"이것은 내가 태어난 집이다.","why":"I was born(나는 태어났다)은 완전한 문장이라 where(그곳에서).","wy":"which(~하는): 뒤 문장에 빈자리가 있어야 하는데 I was born(나는 태어났다)은 완전함."}]}],"comp":[{"no":"37","slots":[["is","","","There is(~이 있다) 뒤 진짜 주어 no need(필요 없음)가 단수."],["collecting","collect","a","since(~ 때문에) 뒤 절에는 이미 동사 makes(만들다)가 있다. collect(모으다)는 주어 자리에 못 오니 동명사 collecting(모으는 것)."],["makes","","","동명사 주어 collecting ...(모으는 것)은 단수."],["it","","","뒤의 to do that(그것을 하는 것)을 대신 받는 가목적어."],["are_included","","","광선이 포함되는 쪽이라 수동태."]],"opts":["collects","collecting","collected","to collecting"],"or":["collects(모으다, 3인칭 단수형): 동사라 주어 자리에 못 오고, makes(만들다)와 동사가 겹침.","collecting(모으는 것, 동명사): since(~ 때문에) 절의 주어 자리이고 동사 makes(만들다)가 따로 있어 맞음.","collected(모았다, 과거형·과거분사형): 주어 자리에 못 오고, makes(만들다)와 동사가 겹침.","to collecting(모으는 것으로): 전치사 to로 시작하는 말은 주어가 될 수 없음."],"point":"정동사 vs. 준동사","en":"There is no need to focus at the beginning, since collecting all the information makes it possible to do that afterwards.","ko":"모든 정보를 수집하는 것이 그것을 나중에 하는 것을 가능하게 만들기 때문에, 처음에 초점을 맞출 필요가 없다.","hl":["collecting all the information makes"],"khl":["모든 정보를 수집하는 것이"],"blocks":[{"t":"p","h":"since(~ 때문에) 뒤도 한 문장","x":["since(~ 때문에) 뒤에는 주어 + 동사가 온다.","동사는 makes(만들다). 이미 있다.","그럼 그 앞 collecting all the information(모든 정보를 모으는 것)이 주어.","동사를 주어로 쓰려면 -ing(동명사). collect(모으다)는 동사라 주어가 못 된다.","앞 문단의 converting(바꾸는 것) ... results(낳다)와 똑같은 구조."]},{"t":"pair","h":"쉬운 예시","x":[["Waking up early makes me tired.","일찍 일어나는 것은 나를 피곤하게 한다. (Waking up = 주어, makes = 동사)"],["Walking every day keeps you healthy.","매일 걷는 것은 너를 건강하게 해 준다. (Walking = 주어, keeps = 동사)"]]}],"post":["동사 makes(만든다) 앞 주어는 -ing: collecting(모으는 것) ... makes(만든다)"]},{"no":"37","slots":[["to_do","","","가목적어 it의 진짜 목적어 to부정사."],["are_included","","","광선이 포함되는 쪽이라 수동태."],["where","","","뒤가 완전한 문장이라 관계부사 where(그곳에서)."],["what","that","a","decide(결정하다)의 목적어로 \"무엇에 초점을 맞출지\"가 필요하다. 의문사 what(무엇) + to부정사. that(~라는 것)은 to부정사를 이끌지 못한다."],["presses","","","주어 she(그녀)가 단수."]],"opts":["whose","it","those","what"],"or":["whose(누구의): 바로 뒤에 명사가 와야 하는데 to focus(초점을 맞출)가 와서 안 됨.","it(그것): decide(결정하다)는 목적어 + to부정사 형태를 받지 않아서 안 됨.","those(그것들): decide(결정하다) 뒤에 목적어 + to부정사가 올 수 없고, 가리킬 복수 명사도 없음.","what(무엇): 의문사 + to부정사로 \"무엇에 초점을 맞출지\"가 되고, focus on(~에 초점을 맞추다)의 목적어 역할도 해서 맞음."],"point":"의문사 + to부정사","en":"The photographer has to decide what to focus on before she presses the shutter.","ko":"사진작가는 셔터를 누르기 전에 무엇에 초점을 맞출지 결정해야 한다.","hl":["decide what to focus on"],"khl":["무엇에 초점을 맞출지 결정해야"],"blocks":[{"t":"p","h":"의문사 + to부정사 = ~할지","x":["what to do(무엇을 할지), how to swim(어떻게 수영할지), where to go(어디로 갈지).","의문사 + to부정사는 \"~할지\"라는 명사 덩어리가 된다.","what to focus on(무엇에 초점을 맞출지): on(~에) 뒤 빈자리를 what(무엇)이 채운다.","that(~라는 것)은 뒤에 완전한 문장(주어 + 동사)이 와야 해서 to부정사와는 못 쓴다."]},{"t":"pair","h":"쉬운 예시","x":[["I don't know what to say.","나는 무슨 말을 할지 모르겠다. (what to say = 무슨 말을 할지)"],["Tell me how to use this.","이것을 어떻게 쓰는지 알려 줘. (how to use = 어떻게 쓰는지)"]]}],"post":["의문사 + to부정사 = ~할지: what to focus on(무엇에 초점을 맞출지)"]}],"compquiz":[{"s":"I don't know ___ to say.","o":["what","that"],"a":0,"ko":"나는 무슨 말을 할지 모르겠다.","why":"what(무엇) + to부정사 = 무엇을 ~할지.","wy":"that(~라는 것): 뒤에 주어 + 동사가 와야 해서 to부정사를 이끌 수 없음."},{"s":"___ early makes me tired.","o":["Waking up","Wake up"],"a":0,"ko":"일찍 일어나는 것은 나를 피곤하게 한다.","why":"동사 makes(만들다)가 있으니 주어는 동명사.","wy":"Wake up(일어나다): 동사원형이라 주어 자리에 못 오고, makes(만들다)와 동사가 겹침."}]},{"id":"2311g2-38","no":"38","title":"어법특훈 · 23년 11월 고2 38번","sub":"내향적인 리더와 서번트 리더십","tpl":"Introverted leaders {do|do} have to overcome the strong cultural presumption {that|that} extroverts are more effective leaders. Although the population {splits|splits} into almost {equal|equal} parts between introverts and extroverts, more than 96 percent of managers and executives {are|are} extroverted. In a study {done|done} in 2006, 65 percent of senior corporate executives {viewed|viewed} introversion as a barrier to leadership. We must reexamine this stereotype, however, as {it|it} doesn’t always hold true. Regent University found that a desire to be of service to others and {empower|to empower} them {grow|to grow}, {which|which} is more common among introverts than extroverts, {is2|is} a key factor in {becoming|becoming} a leader and {retaining|retaining} leadership. So-called servant leadership, {dating|dating} back to ancient philosophical literature, {adheres|adheres} to the belief that a company’s goals are best achieved by {helping|helping} workers or customers {achieve|achieve} their goals. Such leaders do not seek attention but rather {want|want} to shine a light on others’ wins and achievements; servant leadership requires humility, but that humility {ultimately|ultimately} pays off.","fn":["*presumption: 추정, 억측","*servant leadership: 서번트 리더십(남을 섬기는 리더십)","*humility: 겸손"],"mean":{"do":"정말로 ~하다(강조의 do, 복수 주어) / 하다(동사원형)","does":"정말로 ~하다(강조의 do, 3인칭 단수형) / 하다(do의 3인칭 단수 현재형)","did":"했다(do의 과거형)","doing":"하는 것, 하는(do의 -ing형)","to do":"하는 것, 하기 위해(do의 to부정사)","done":"된, 실시된(do의 과거분사형)","has done":"해 왔다(do의 현재완료형, 단수 주어)","that":"~라는(명사 내용을 설명하는 접속사) / ~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","which":"~하는, 그런데 그것은(관계대명사)","where":"~하는 곳(장소를 받는 관계부사)","whom":"~을(사람을 받는 목적격 관계대명사)","when":"~할 때(시간을 받는 관계부사)","splits":"나뉘다(split의 3인칭 단수 현재형)","splitting":"나뉘는, 나뉘는 것(split의 -ing형)","to split":"나뉘는 것, 나뉘기 위해(split의 to부정사)","having split":"나뉘고 나서(split의 완료 -ing형)","being split":"나뉘어지는(split의 수동 -ing형)","equal":"똑같은, 동등한(형용사)","are":"~이다(be의 현재형, 복수 주어)","is":"~이다(be의 현재형, 단수 주어)","being":"~인 것, ~인(be의 -ing형)","to be":"~인 것(be의 to부정사)","been":"~였던(be의 과거분사형)","were":"~였다(be의 과거형, 복수 주어)","was":"~였다(be의 과거형, 단수 주어)","viewed":"여겼다(view의 과거형)","viewing":"여기는, 여기는 것(view의 -ing형)","to view":"여기는 것(view의 to부정사)","having viewed":"여기고 나서(view의 완료 -ing형)","being viewed":"여겨지는(view의 수동 -ing형)","it":"그것(단수 대명사, 주격·목적격)","they":"그들, 그것들(복수 대명사, 주격)","them":"그들을, 그것들을(they의 목적격)","its":"그것의(it의 소유격)","itself":"그것 자체(it의 재귀대명사)","to empower":"힘을 실어 주는 것(empower의 to부정사)","to grow":"성장하도록(grow의 to부정사)","grow":"성장하다(동사원형)","growing":"성장하는(grow의 -ing형)","grown":"다 자란(grow의 과거분사형)","grows":"성장하다(grow의 3인칭 단수 현재형)","becoming":"되는 것(become의 -ing형, 동명사)","become":"되다(동사원형)","to become":"되는 것(become의 to부정사)","became":"되었다(become의 과거형)","becomes":"되다(become의 3인칭 단수 현재형)","retaining":"유지하는 것(retain의 -ing형, 동명사)","dating":"거슬러 올라가는(date의 -ing형, date back = 거슬러 올라가다)","adheres":"고수하다(adhere의 3인칭 단수 현재형, adhere to = ~을 고수하다)","helping":"돕는 것(help의 -ing형, 동명사)","achieve":"달성하다(동사원형)","want":"원하다(동사원형·현재형)","wanting":"원하는, 원하는 것(want의 -ing형)","wants":"원하다(want의 3인칭 단수 현재형)","to want":"원하는 것(want의 to부정사)","having wanted":"원하고 나서(want의 완료 -ing형)","ultimately":"궁극적으로, 결국(부사)","taking":"찍는(take의 -ing형)","taken":"찍힌(take의 과거분사형)","watched":"보았다(watch의 과거형)","watching":"보는(watch의 -ing형)","try":"해 보다(동사원형)","to try":"해 보도록(try의 to부정사)","play":"(악기를) 치다(동사원형)","playing":"치는 것(play의 -ing형, 동명사)","ran":"뛰었다(run의 과거형)","running":"뛰는(run의 -ing형)"},"sets":[{"items":[{"slots":[["do","does","a","주어 Introverted leaders(내향적인 리더들)는 복수다. 강조의 do(정말로)도 주어에 맞춰 do를 쓴다."],["that","","","명사 presumption(통념)의 내용을 뒤에서 풀어 주는 that(~라는)이다."],["splits","","","Although(비록 ~지만) 절의 동사다. 주어 the population(인구)이 단수라 splits(나뉘다)."],["equal","","","명사 parts(부분들)를 꾸미니까 형용사 equal(똑같은)이 맞다. almost(거의)는 equal(똑같은)을 꾸미는 부사."],["are","","","of(~의) 뒤 managers and executives(관리자와 임원들)가 복수라 are(~이다)."]],"opts":["doing","to do","do","done"],"or":["doing(하는, 하는 것): -ing는 혼자 동사 자리에 못 오고 have to(~해야 한다) 앞을 채울 수 없음.","to do(하는 것): to부정사는 동사 자리에 못 와서 문장의 동사가 사라짐.","do(정말로 ~하다, 강조): 복수 주어 Introverted leaders(내향적인 리더들) 뒤 강조의 do라 맞음.","done(된, do의 과거분사형): 과거분사 혼자는 동사 자리에 못 옴."],"point":"강조(조동사 do)","en":"Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders.","ko":"내향적인 리더들은 외향적인 사람들이 더 유능한 리더라는 강한 문화적 통념을 정말로 극복해야 한다.","hl":["Introverted leaders","do have to"],"khl":["내향적인 리더들은","정말로 극복해야 한다"],"blocks":[{"t":"p","h":"do(정말로)는 동사 앞의 확성기","x":["동사 앞에 do를 붙이면 \"정말로 ~하다\"라는 강조가 된다.","확성기 do(정말로)도 주어에 맞춰 모양을 바꾼다.","주어가 하나면 does(단수형), 여럿이면 do, 과거면 did(과거형).","이 문장의 주어는 Introverted leaders(내향적인 리더들), 여럿이다.","그래서 does(단수형)가 아니라 do."]},{"t":"pair","h":"쉬운 예시","x":[["I do like you.","나는 너를 정말 좋아해. (주어 I(나) → do(정말로))"],["He does look tired.","그는 정말 피곤해 보인다. (주어 He(그) 한 명 → does(정말로))"]]}],"post":["주어 여럿이면 강조도 do: Introverted leaders do have to(내향적인 리더들은 정말로 ~해야 한다)"]},{"slots":[["do","","","복수 주어 Introverted leaders(내향적인 리더들)에 맞춘 강조의 do(정말로)."],["that","what","a","앞에 명사 the strong cultural presumption(강한 문화적 통념)이 있고 뒤 문장이 완전하다. what(~하는 것)은 못 온다."],["splits","","","Although(비록 ~지만) 절의 동사, 단수 주어 the population(인구)에 맞춘 모양."],["are","","","percent of managers(관리자의 퍼센트)는 managers(관리자들)를 보고 복수 are(~이다)."],["done","","","연구는 \"실시되는\" 쪽이라 과거분사 done(실시된)."]],"opts":["that","which","where","whom"],"or":["that(~라는, 접속사): 명사 presumption(통념)의 내용을 완전한 문장으로 풀어 주는 동격 that이라 맞음.","which(~하는, 관계대명사): 뒤에 빈자리가 있어야 하는데 extroverts are more effective leaders(외향적인 사람들이 더 유능한 리더다)는 완전한 문장임.","where(~하는 곳, 관계부사): presumption(통념)은 장소가 아니고, 통념의 내용을 풀어 주는 말로도 못 씀.","whom(~을, 목적격 관계대명사): 사람을 받는 말이고 목적어 빈자리가 있어야 하는데 뒤 문장이 완전함."],"point":"that vs. what","en":"Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders.","ko":"내향적인 리더들은 외향적인 사람들이 더 유능한 리더라는 강한 문화적 통념을 정말로 극복해야 한다.","hl":["presumption that","extroverts are more effective leaders"],"khl":["통념","외향적인 사람들이 더 유능한 리더라는"],"blocks":[{"t":"p","h":"what(~하는 것)은 꽉 찬 상자","x":["what(~하는 것)은 안에 \"것\"이라는 명사를 이미 품고 있다.","그래서 앞에 명사가 있으면 what(~하는 것)이 설 자리가 없다.","presumption(통념)이라는 명사 뒤에 그 내용을 붙이는 라벨은 that(~라는).","라벨 뒤 문장 extroverts are more effective leaders(외향적인 사람들이 더 유능한 리더다)는 빠진 것이 없다."]},{"t":"pair","h":"쉬운 예시","x":[["I know the fact that she is kind.","나는 그녀가 친절하다는 사실을 안다. (명사 the fact(사실) + that(~라는))"],["I know what she wants.","나는 그녀가 원하는 것을 안다. (앞에 명사 없이 what(~하는 것))"]]},{"t":"tap","h":"확인 질문","q":"that(~라는) 뒤 문장에서 빠진 성분이 있는가?","a":["없다. 주어 extroverts(외향적인 사람들), 동사 are(~이다), 보어 leaders(리더들)가 다 있다.","앞에 명사, 뒤에 완전한 문장이면 that(~라는)."]}],"post":["명사(presumption = 통념) + that(~라는) + 완전한 문장"]},{"slots":[["that","","","presumption(통념)의 내용을 이끄는 that(~라는)."],["splits","splitting","a","Although(비록 ~지만)는 접속사라 뒤에 주어와 진짜 동사가 있어야 한다. -ing는 동사 자리에 못 온다."],["equal","","","명사 parts(부분들)를 꾸미는 형용사."],["are","","","주절의 동사, 복수 managers(관리자들)에 맞춘 are(~이다)."],["viewed","","","주어 65 percent of senior corporate executives(기업 고위 임원의 65퍼센트)의 동사, 과거형 viewed(여겼다)."]],"opts":["to split","having split","splits","being split"],"or":["to split(나뉘는 것): to부정사는 동사 자리에 못 와서 Although(비록 ~지만) 절에 동사가 없어짐.","having split(나뉘고 나서): 완료 -ing형이라 동사 자리에 못 옴.","splits(나뉘다): 접속사 Although(비록 ~지만) 뒤 절의 동사이고 주어 the population(인구)이 단수라 맞음.","being split(나뉘어지는): -ing형이라 동사 자리에 못 오고, split into(~로 나뉘다)는 그 자체로 \"나뉘다\"라서 수동도 필요 없음."],"point":"정동사 vs. 준동사","en":"Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted.","ko":"인구는 내향적인 사람과 외향적인 사람으로 거의 똑같이 나뉘지만, 관리자와 임원의 96퍼센트 이상이 외향적이다.","hl":["Although","the population splits"],"khl":["인구는","나뉘지만"],"blocks":[{"t":"p","h":"접속사는 동사를 꼭 데리고 다닌다","x":["Although(비록 ~지만)는 문장과 문장을 잇는 접속사다.","접속사 뒤에는 작은 문장 하나가 통째로 온다. 주어 + 진짜 동사.","주어 the population(인구), 동사 splits(나뉘다).","splitting(나뉘는)으로 바꾸면 동사가 빠진 반쪽 문장이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["Although it rained, we played outside.","비가 왔지만 우리는 밖에서 놀았다. (Although(비록 ~지만) + it + rained(비가 왔다))"],["Because she was sick, she stayed home.","그녀는 아파서 집에 있었다. (Because(~때문에) + she(그녀) + was(~였다))"]]}],"post":["접속사(Althoug p.가 맞음.","does(하다, 3인칭 단수 현재형): 동사라 명사를 꾸밀 수 없고, 동사 viewed(여겼다)와 겹침.","has done(해 왔다, 현재완료형): 진짜 동사 모양이라 명사를 꾸밀 수 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership.","ko":"2006년에 실시된 한 연구에서, 기업 고위 임원의 65퍼센트가 내향성을 리더십의 장애물로 여겼다.","hl":["a study done in 2006"],"khl":["2006년에 실시된 한 연구에서"],"blocks":[{"t":"p","h":"명사에게 물어보기: 네가 하니, 당하니?","x":["명사를 뒤에서 꾸미는 분사는 명사와의 관계로 고른다.","a study(연구)가 스스로 뭘 하나? 아니다. 연구자가 연구를 \"한다\".","연구는 \"되는\" 쪽이니 p.p. done(실시된).","doing(하는)을 쓰면 연구가 직접 무언가를 하는 이상한 뜻이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I read a book written by a child.","나는 한 아이가 쓴 책을 읽었다. (책은 쓰이는 쪽 → written(쓰인))"],["Look at the boy running in the park.","공원에서 달리는 소년을 봐. (소년이 직접 달림 → running(달리는))"]]}],"post":["연구는 실시되는 쪽: a study done(실시된 연구)"]}],"quiz":[{"s":"My sister ___ love chocolate.","o":["does","do"],"a":0,"ko":"내 여동생은 초콜릿을 정말 좋아한다.","why":"주어 My sister(내 여동생)는 한 명이라 강조도 does(정말로).","wy":"do(정말로): 주어가 한 명이라 단수형 does(정말로)가 필요함."},{"s":"I like the idea ___ we can go together.","o":["that","what"],"a":0,"ko":"나는 우리가 함께 갈 수 있다는 생각이 좋다.","why":"명사 the idea(생각) 뒤, 완전한 문장이라 that(~라는).","wy":"what(~하는 것): 앞에 명사 the idea(생각)가 있고 뒤 문장도 완전해서 못 옴."},{"s":"Although he ___ tired, he finished the work.","o":["being","was"],"a":1,"ko":"그는 피곤했지만 일을 끝냈다.","why":"접속사 Although(비록 ~지만) 뒤는 주어 + 진짜 동사.","wy":"being(~인 것): -ing는 동사 자리에 못 와서 Although(비록 ~지만) 절에 동사가 없어짐."},{"s":"Half of the students ___ from Seoul.","o":["are","is"],"a":0,"ko":"학생들의 절반이 서울 출신이다.","why":"of(~의) 뒤 the students(학생들)가 복수.","wy":"is(~이다, 단수형): of(~의) 뒤 students(학생들)가 복수라 안 맞음."},{"s":"This is a photo ___ by my dad.","o":["taken","taking"],"a":0,"ko":"이것은 아빠가 찍은 사진이다.","why":"사진은 찍히는 쪽이라 p.p.","wy":"taking(찍는): 사진이 직접 찍는 게 아니라 찍히는 쪽이라 안 맞음."}]},{"items":[{"slots":[["done","","","a study(한 연구)를 꾸미는 과거분사, 동사가 아니다."],["viewed","viewing","a","문장의 진짜 동사 자리다. In a study done in 2006(2006년에 실시된 한 연구에서)은 앞에 붙은 꾸밈말이고 done(실시된)은 동사가 아니다."],["it","","","단수 this stereotype(이 고정 관념)을 받는 it(그것)."],["empower","","","to be of service(도움이 되는 것)와 and(그리고)로 나란한 to부정사 to empower(힘을 실어 주는 것)."],["grow","","","empower(힘을 실어 주다) + 사람 + to부정사. to grow(성장하도록)가 맞다."]],"opts":["to view","viewed","having viewed","being viewed"],"or":["to view(여기는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","viewed(여겼다, view의 과거형): 주어 65 percent of senior corporate executives(기업 고위 임원의 65퍼센트)의 진짜 동사라 맞음.","having viewed(여기고 나서): 완료 -ing형이라 동사 자리에 못 옴.","being viewed(여겨지는): -ing형이라 동사 자리에 못 오고, 임원들이 직접 여기는 쪽이라 수동도 안 맞음."],"point":"정동사 vs. 준동사","en":"In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership.","ko":"2006년에 실시된 한 연구에서, 기업 고위 임원의 65퍼센트가 내향성을 리더십의 장애물로 여겼다.","hl":["viewed introversion as a barrier"],"khl":["장애물로 여겼다"],"blocks":[{"t":"p","h":"가짜 동사에 속지 않기","x":["done(실시된)은 동사처럼 생겼지만 a study(한 연구)를 꾸미는 꾸밈말이다.","꾸밈말 In a study done in 2006(2006년에 실시된 한 연구에서)을 괄호로 묶어 보자.","남는 것: 65 percent of senior corporate executives(기업 고위 임원의 65퍼센트) ___ introversion(내향성).","주어 뒤 동사 자리가 비어 있다. 그래서 진짜 동사 viewed(여겼다)."]},{"t":"pair","h":"쉬운 예시","x":[["In the photo taken yesterday, my dog looks happy.","어제 찍은 사진에서 우리 개는 행복해 보인다. (taken(찍힌)은 꾸밈말, 진짜 동사는 looks(~해 보인다))"],["The girl sitting next to me smiled.","내 옆에 앉아 있던 소녀가 웃었다. (sitting(앉아 있는)은 꾸밈말, 진짜 동사는 smiled(웃었다))"]]}],"post":["꾸밈말(done = 실시된) 괄호 치고 진짜 동사 찾기: executives viewed(임원들이 여겼다)"]},{"slots":[["viewed","","","주어 65 percent of senior corporate executives(기업 고위 임원의 65퍼센트)의 동사."],["it","they","a","가리키는 것은 this stereotype(이 고정 관념), 하나다. they(그것들)는 여럿을 가리키고 뒤 doesn’t(~하지 않는다)와도 안 맞는다."],["empower","","","to be of service(도움이 되는 것)와 나란한 to부정사."],["grow","","","empower(힘을 실어 주다)의 목적격보어 to grow(성장하도록)."],["which","","","앞 명사 a desire(열망)를 콤마 뒤에서 덧붙여 설명하는 관계대명사 which(그런데 그것은)."]],"opts":["them","its","it","itself"],"or":["them(그것들을): 목적격이라 주어 자리에 못 오고, 가리키는 것도 하나뿐임.","its(그것의): 소유격이라 뒤에 명사가 와야 하는데 바로 doesn’t(~하지 않는다)가 옴.","it(그것): 단수 명사 this stereotype(이 고정 관념)을 가리키는 주격이라 맞음.","itself(그것 자체): 재귀대명사라 주어 자리에 혼자 못 옴."],"point":"대명사의 성·수·격","en":"We must reexamine this stereotype, however, as it doesn’t always hold true.","ko":"하지만 그것이 항상 맞는 것은 아니기 때문에 우리는 이 고정 관념을 다시 살펴봐야 한다.","hl":["this stereotype","it doesn’t always hold true"],"khl":["이 고정 관념","항상 맞는 것은 아니기"],"blocks":[{"t":"p","h":"대명사는 줄을 그어 주인 찾기","x":["대명사를 보면 줄을 그어 누구를 가리키는지 찾는다.","it(그것) → this stereotype(이 고정 관념). 하나다.","하나면 it(그것), 여럿이면 they(그것들).","뒤 doesn’t(~하지 않는다)도 하나일 때 쓰는 모양이라 it(그것)과 짝이 맞는다."]},{"t":"pair","h":"쉬운 예시","x":[["I bought a new bag, but it is too small.","새 가방을 샀는데 너무 작다. (a new bag(새 가방) 하나 → it(그것))"],["I bought two bags, but they are too small.","가방 두 개를 샀는데 너무 작다. (two bags(가방 두 개) → they(그것들))"]]}],"post":["this stereotype(이 고정 관념) 하나 → it(그것) doesn’t(~하지 않는다)"]},{"slots":[["it","","","this stereotype(이 고정 관념)을 받는 it(그것)."],["empower","","","to be of service(도움이 되는 것)와 and(그리고)로 나란한 to empower(힘을 실어 주는 것)."],["grow","grow","a","empower(힘을 실어 주다)는 사역동사가 아니다. empower + 사람 + to부정사로 써야 한다."],["which","","","a desire(열망)를 받는 관계대명사, 뒤에 주어가 빠져 있다."],["is2","","","주어 a desire(열망)가 단수라 is(~이다)."]],"opts":["growing","grown","to grow","grows"],"or":["growing(성장하는): empower(힘을 실어 주다)는 목적격보어로 -ing를 받지 않음.","grown(다 자란, grow의 과거분사형): 그들이 직접 성장하는 쪽이라 p.p.는 안 맞음.","to grow(성장하도록): empower(힘을 실어 주다) + 목적어 뒤 목적격보어는 to부정사라 맞음.","grows(성장하다, 3인칭 단수형): 목적격보어 자리에 s 붙은 동사가 올 수 없음."],"point":"목적격보어(준동사)","en":"Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.","ko":"Regent 대학교는 다른 사람들에게 도움이 되고 그들이 성장하도록 힘을 실어 주려는 열망이 리더가 되고 리더십을 유지하는 데 핵심 요소이고, 그 열망은 외향적인 사람보다 내향적인 사람에게 더 흔하다는 것을 발견했다.","hl":["to empower them to grow"],"khl":["그들이 성장하도록 힘을 실어 주려는"],"blocks":[{"t":"p","h":"help(돕다)와 empower(힘을 실어 주다)는 다르다","x":["help(돕다)는 help + 사람 + 동사원형도 된다. 같은 지문의 helping workers or customers achieve(근로자나 고객이 달성하도록 돕는 것)처럼.","empower(힘을 실어 주다)는 allow(허락하다), enable(~할 수 있게 하다)처럼 to부정사만 받는다.","그래서 empower them to grow(그들이 성장하도록 힘을 실어 주다).","to를 빼면 틀린다. 바로 옆 help(돕다)와 헷갈리게 하는 함정."]},{"t":"pair","h":"쉬운 예시","x":[["My parents allowed me to go.","부모님은 내가 가도록 허락해 주셨다. (allowed me to go = 내가 가도록 허락했다)"],["She helped me carry the box.","그녀는 내가 상자를 옮기는 것을 도와주었다. (help(돕다)는 동사원형도 가능)"]]},{"t":"tap","h":"확인 질문","q":"같은 지문에서 to 없이 동사원형을 받은 동사는?","a":["helping workers or customers achieve their goals(근로자나 고객이 목표를 달성하도록 돕는 것)의 help(돕다).","help(돕다)만 특별하다. empower(힘을 실어 주다)는 to가 꼭 필요하다."]}],"post":["empower(힘을 실어 주다) + 사람 + to부정사: empower them to grow(그들이 성장하도록)"]},{"slots":[["empower","","","to be of service(도움이 되는 것)와 나란한 to부정사."],["grow","","","empower(힘을 실어 주다) 뒤 목적격보어 to grow(성장하도록)."],["which","where","a","앞 명사 a desire(열망)를 받고, 뒤에 주어가 빠져 있다. 빈자리가 있으면 관계부사 where(~하는 곳)가 아니라 관계대명사 which(그런데 그것은)."],["is2","","","주어 a desire(열망)가 단수라 is(~이다)."],["becoming","","","전치사 in(~에) 뒤라 동명사 becoming(되는 것)."]],"opts":["what","which","whom","when"],"or":["what(~하는 것): 앞에 명사 a desire(열망)가 있어 못 오고, 콤마 뒤에서 앞 명사를 설명할 수도 없음.","which(그런데 그것은, 관계대명사): 앞 명사 a desire(열망)를 받고 뒤 절에 주어가 빠져 있어 맞음.","whom(~을, 목적격 관계대명사): 사람을 받는 말이고, 빠진 것이 주어라 목적격은 안 맞음.","when(~할 때, 관계부사): 시간 명사를 받는 말이고, 관계부사 뒤에는 완전한 문장이 와야 함."],"point":"관계대명사 vs. 관계부사","en":"Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.","ko":"Regent 대학교는 다른 사람들에게 도움이 되고 그들이 성장하도록 힘을 실어 주려는 열망이 리더가 되고 리더십을 유지하는 데 핵심 요소이고, 그 열망은 외향적인 사람보다 내향적인 사람에게 더 흔하다는 것을 발견했다.","hl":["which is more common among introverts than extroverts"],"khl":["그 열망은 외향적인 사람보다 내향적인 사람에게 더 흔하다"],"blocks":[{"t":"p","h":"빈자리 찾기 게임","x":["관계사 뒤 문장에서 빠진 조각을 찾는다.","___ is more common among introverts(___이 내향적인 사람에게 더 흔하다): 주어가 빠졌다.","주어가 빠지면 관계대명사(which, who, that) 자리다.","where(~하는 곳)나 when(~할 때) 같은 관계부사 뒤는 빠진 것 없는 완전한 문장이어야 한다."]},{"t":"pair","h":"쉬운 예시","x":[["I visited the town where my mom was born.","나는 엄마가 태어난 마을을 방문했다. (where(~한 곳) 뒤 완전한 문장)"],["I visited the town, which was very quiet.","나는 그 마을을 방문했는데, 그곳은 아주 조용했다. (which(그런데 그곳은) 뒤 주어가 빠짐)"]]}],"post":["뒤에 주어가 빠지면 관계대명사: , which is(그런데 그것은 ~이다)"]},{"slots":[["grow","","","empower(힘을 실어 주다) + 사람 + to부정사."],["which","","","a desire(열망)를 받는 관계대명사 which(그런데 그것은)."],["is2","are","a","주어는 a desire(열망), 하나다. to be of service ... to grow(도움이 되고 성장하도록 힘을 실어 주려는)와 which 절(그런데 그것은 ~)은 모두 꼬리표다."],["becoming","","","전치사 in(~에) 뒤 동명사."],["retaining","","","becoming(되는 것)과 and(그리고)로 나란한 동명사 retaining(유지하는 것)."]],"opts":["being","to be","were","is"],"or":["being(~인 것): -ing형이라 동사 자리에 못 와서 found(발견했다) 뒤 that 절(~라는 것)에 동사가 없어짐.","to be(~인 것): to부정사는 동사 자리에 못 옴.","were(~였다, 복수 과거형): 주어 a desire(열망)가 단수라 복수형은 안 맞음.","is(~이다): 진짜 주어 a desire(열망)가 단수라 맞음."],"point":"수식받는 주어의 수일치","en":"Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.","ko":"Regent 대학교는 다른 사람들에게 도움이 되고 그들이 성장하도록 힘을 실어 주려는 열망이 리더가 되고 리더십을 유지하는 데 핵심 요소이고, 그 열망은 외향적인 사람보다 내향적인 사람에게 더 흔하다는 것을 발견했다.","hl":["a desire","is a key factor"],"khl":["열망이","핵심 요소이고"],"blocks":[{"t":"p","h":"긴 꼬리 잘라내기","x":["주어 a desire(열망) 뒤에 꼬리가 두 개나 붙었다.","꼬리 1: to be of service to others and to empower them to grow(다른 사람들에게 도움이 되고 그들이 성장하도록 힘을 실어 주려는)","꼬리 2: which is more common among introverts than extroverts(그런데 그것은 외향적인 사람보다 내향적인 사람에게 더 흔하다)","꼬리를 다 자르면 a desire is a key factor(열망은 핵심 요소다).","others(다른 사람들), them(그들) 같은 복수 단어에 속으면 안 된다."]},{"t":"pair","h":"쉬운 예시","x":[["The list of names is on the desk.","이름 목록이 책상 위에 있다. (주어 The list(목록) → is(있다))"],["A friend of my parents lives here.","우리 부모님의 친구 한 분이 여기 사신다. (주어 A friend(친구 한 명) → lives(산다))"]]}],"post":["꼬리 두 개 자르고 주인(a desire = 열망) 보고 is(~이다)"]}],"quiz":[{"s":"Last ni 는 주스가 아니라 물을 원한다. (juice(주스) ↔ water(물), 둘 다 명사)"]]}],"post":["not A but B(A가 아니라 B)는 같은 모양: do not seek but want(추구하지 않고 원하다)"]}],"compquiz":[{"s":"I am interested in ___ the piano.","o":["play","playing"],"a":1,"ko":"나는 피아노 치는 것에 관심이 있다.","why":"전치사 in(~에) 뒤는 -ing.","wy":"play(치다): 전치사 in(~에) 뒤에 동사원형은 못 옴."},{"s":"They did not walk but ___ home.","o":["ran","running"],"a":0,"ko":"그들은 걸어가지 않고 뛰어서 집에 갔다.","why":"did not walk(걷지 않았다)와 짝인 동사 ran(뛰었다).","wy":"running(뛰는): -ing라 동사 walk(걷다)와 짝이 안 맞음."}]},{"id":"2311g2-39","no":"39","title":"어법특훈 · 23년 11월 고2 39번","sub":"완벽한 측정에서 부정확성의 허용으로","tpl":"By the nineteenth century, France {had_developed|had developed} a system of {precisely|precisely} {defined|defined} units of measurement {capture|to capture} space, time, and more, and {had_begun|had begun} to get other nations {adopt|to adopt} the same standards. Just half a century later, in the 1920s, the discoveries of quantum mechanics forever {destroyed|destroyed} the dream of comprehensive and perfect measurement. And yet, outside a {relatively|relatively} small circle of physicists, the mindset of humankind’s drive to {flawlessly|flawlessly} measure {continued|continued} among engineers and scientists. In the world of business {it|it} even expanded, as the precision-oriented sciences of mathematics and statistics {began|began} to influence all areas of commerce. However, contrary to the trend of the past several decades, in many new situations {that|that} {are_occurring|are occurring} today, {allowing|allowing} for imprecision―for messiness―{may|may} be a positive feature, not a shortcoming. As a tradeoff for {relaxing|relaxing} the standards of {allowable|allowable} errors, one can get a hold of much more data. It isn’t just that “more is {better|better} than some,” but that, in fact, sometimes “more is {greater|greater} than better.”","fn":["*quantum mechanics: 양자역학","*imprecision: 부정확성","*tradeoff: 거래, 맞바꿈"],"mean":{"had developed":"개발했었다(develop의 과거완료형)","developin )","great":"훌륭한, 큰(원급)","greatest":"가장 훌륭한(great의 최상급)","greatly":"크게, 대단히(부사)","greatness":"위대함(명사)","had":"~했었다(have의 과거형, 과거완료를 만드는 조동사)","having":"~하고 나서(have의 -ing형)","wash":"씻다(동사원형)","to wash":"씻도록(wash의 to부정사)","happened":"일어났다(happen의 과거형)","was happened":"일어나졌다(happen은 수동태가 없어 틀린 형태)","Getting up":"일어나는 것(get up의 -ing형, 동명사)","Get up":"일어나다(동사원형)","sleep":"자다(동사원형)","sleeping":"자는 것(sleep의 -ing형, 동명사)","amazing":"놀라운(형용사)","amazingly":"놀랍게(부사)","fast":"빠른(원급)","faster":"더 빠른(fast의 비교급)"},"sets":[{"items":[{"slots":[["had_developed","developing","a","France(프랑스)가 주어인 문장의 진짜 동사 자리다. developing(개발하는)은 동사 자리에 못 온다."],["precisely","","","과거분사 defined(규정된)를 꾸미니까 부사 precisely(정밀하게)."],["defined","","","단위는 \"규정되는\" 쪽이라 p.p. defined(규정된)."],["capture","","","\"포착하기 위해\"라는 목적을 나타내는 to부정사 to capture(포착하기 위해)."],["had_begun","","","had developed(개발했었다)와 and(그리고)로 나란한 과거완료 had begun(시작했었다)."]],"opts":["to develop","had developed","having developed","being developed"],"or":["to develop(개발하는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","had developed(개발했었다, 과거완료형): By the nineteenth century(19세기 무렵까지) 이미 끝난 일이고 주어 France(프랑스)의 진짜 동사라 맞음.","having developed(개발하고 나서): 완료 -ing형이라 동사 자리에 못 옴.","being developed(개발되는): -ing형이라 동사 자리에 못 오고, 프랑스가 직접 개발한 쪽이라 수동도 안 맞음."],"point":"정동사 vs. 준동사","en":"By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards.","ko":"19세기 무렵 프랑스는 공간, 시간 등을 포착하기 위해 정밀하게 규정된 측정 단위 체계를 개발했고, 다른 나라들이 같은 기준을 채택하도록 만들기 시작했었다.","hl":["France had developed","and had begun"],"khl":["프랑스는","개발했고","시작했었다"],"blocks":[{"t":"p","h":"주어 뒤 동사 자리 확인","x":["주어 France(프랑스) 바로 뒤가 동사 자리다.","developing(개발하는)은 동사 옷을 벗은 모양이라 그 자리에 못 선다.","뒤의 and had begun(그리고 시작했었다)과 짝을 이루려면 앞도 had developed(개발했었다)여야 한다.","By(~무렵까지) + 과거 시점이면 그때까지 끝난 일을 말하는 had p.p.(과거완료)가 잘 어울린다."]},{"t":"pair","h":"쉬운 예시","x":[["By the time I arrived, the movie had started.","내가 도착했을 때 영화는 이미 시작했었다. (주어 the movie(영화) → had started(시작했었다))"],["My brother cleaned his room and washed the dishes.","형은 방을 청소하고 설거지를 했다. (cleaned and washed = 청소하고 설거지했다)"]]}],"post":["주어(France = 프랑스) 뒤 진짜 동사: had developed and had begun(개발했고 시작했었다)"]},{"slots":[["defined","","","units(단위)는 규정되는 쪽이라 과거분사."],["capture","","","목적을 나타내는 to부정사."],["had_begun","","","had developed(개발했었다)와 나란한 과거완료."],["adopt","adopt","a","get(~하게 하다)은 \"시키다\"라는 뜻이어도 사역동사 make(만들다)와 달리 get + 사람 + to부정사로 쓴다."],["destroyed","","","주어 the discoveries(발견들)의 진짜 동사, 과거형 destroyed(깨뜨렸다)."]],"opts":["adopts","to adopt","to adopting","had adopted"],"or":["adopts(채택하다, 3인칭 단수형): 목적격보어 자리에 s 붙은 동사가 못 오고, other nations(다른 나라들)도 복수임.","to adopt(채택하도록): get(~하게 하다) + 사람 + to부정사라 맞음.","to adopting(채택하는 것으로): get(~하게 하다)의 목적격보어에 전치사 to + -ing는 안 맞음.","had adopted(채택했었다, 과거완료형): 진짜 동사 모양이라 목적격보어 자리에 못 옴."],"point":"목적격보어(준동사)","en":"By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards.","ko":"19세기 무렵 프랑스는 공간, 시간 등을 포착하기 위해 정밀하게 규정된 측정 단위 체계를 개발했고, 다른 나라들이 같은 기준을 채택하도록 만들기 시작했었다.","hl":["to get other nations to adopt"],"khl":["다른 나라들이 같은 기준을 채택하도록 만들기"],"blocks":[{"t":"p","h":"get(~하게 하다)은 to를 꼭 챙긴다","x":["make(만들다), have(시키다), let(허락하다)은 사람 뒤에 동사원형.","get(~하게 하다)은 뜻은 비슷하지만 사람 뒤에 to부정사를 쓴다.","get other nations to adopt(다른 나라들이 채택하게 하다).","to를 빼면 틀린다. make(만들다)와 헷갈리게 하려는 단골 함정."]},{"t":"pair","h":"쉬운 예시","x":[["I got my brother to fix my bike.","나는 형에게 내 자전거를 고치게 했다. (got(~하게 했다) + 사람 + to fix(고치게))"],["I made my brother fix my bike.","나는 형이 내 자전거를 고치게 했다. (made(~하게 했다) + 사람 + fix(고치게), to 없음)"]]}],"post":["get(~하게 하다) + 사람 + to부정사: get other nations to adopt(다른 나라들이 채택하게)"]},{"slots":[["had_begun","","","had developed(개발했었다)와 and(그리고)로 나란한 동사."],["destroyed","destroying","a","주어 the discoveries of quantum mechanics(양자역학의 발견들) 뒤 진짜 동사 자리다. forever(영원히)는 끼어든 부사일 뿐."],["relatively","","","형용사 small(작은)을 꾸미는 부사."],["flawlessly","","","동사 measure(측정하다)를 꾸미는 부사."],["continued","","","주어 the mindset(사고방식)의 진짜 동사, 과거형."]],"opts":["to destroy","has destroyed","having destroyed","destroyed"],"or":["to destroy(깨뜨리는 것): to부정사는 동사 자리에 못 옴.","has destroyed(깨뜨려 왔다, 현재완료 단수형): 주어 the discoveries(발견들)가 복수이고, in the 1920s(1920년대에) 같은 과거 시점과 현재완료는 함께 못 씀.","having destroyed(깨뜨리고 나서): 완료 -ing형이라 동사 자리에 못 옴.","destroyed(깨뜨렸다, destroy의 과거형): in the 1920s(1920년대에)의 과거 일이고 주어의 진짜 동사라 맞음."],"point":"정동사 vs. 준동사","en":"Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement.","ko":"불과 반세기 후인 1920년대에 양자역학의 발견은 포괄적이고 완벽한 측정이라는 꿈을 영원히 깨뜨렸다.","hl":["the discoveries of quantum mechanics forever destroyed"],"khl":["양자역학의 발견은","영원히 깨뜨렸다"],"blocks":[{"t":"p","h":"끼어든 부사 걷어내기","x":["주어와 동사 사이에 forever(영원히) 같은 부사가 끼면 동사 자리가 흐려 보인다.","forever(영원히)를 걷어내면 the discoveries(발견들) ___ the dream(꿈).","주어와 목적어 사이 빈자리는 진짜 동사 자리다.","그래서 destroying(깨뜨리는)이 아니라 destroyed(깨뜨렸다)."]},{"t":"pair","h":"쉬운 예시","x":[["My dad always drinks coffee in the morning.","아빠는 항상 아침에 커피를 마신다. (always(항상)를 걷어내면 My dad drinks(아빠는 마신다))"],["The kids happily played in the snow.","아이들은 눈 속에서 즐겁게 놀았다. (happily(즐겁게)를 걷어내면 The kids played(아이들은 놀았다))"]]}],"post":["부사(forever = 영원히) 걷어내고 진짜 동사: discoveries destroyed(발견이 깨뜨렸다)"]},{"slots":[["destroyed","","","주어 the discoveries(발견들)의 동사."],["relatively","relative","a","형용사 small(작은)을 꾸미는 자리다. 형용사를 꾸미는 건 부사(-ly)의 일."],["flawlessly","","","동사 measure(측정하다)를 꾸미는 부사."],["continued","","","주어 the mindset(사고방식)의 동사."],["it","","","앞 문장의 the mindset(사고방식)을 받는 단수 대명사 it(그것)."]],"opts":["relatively","relation","relativity","relate"],"or":["relatively(비교적): 형용사 small(작은)을 꾸미는 부사라 맞음.","relation(관계): 명사라 형용사 small(작은)을 꾸밀 수 없음.","relativity(상대성): 명사라 형용사를 꾸밀 수 없고 뜻도 안 맞음.","relate(관련시키다): 동사라 a(하나의)와 small(작은) 사이에 들어갈 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists.","ko":"그러나 비교적 작은 물리학자 집단을 제외하면, 완벽하게 측정하려는 인류의 욕구라는 사고방식은 공학자와 과학자들 사이에서 계속되었다.","hl":["a relatively small circle"],"khl":["비교적 작은"],"blocks":[{"t":"p","h":"꾸밈 화살표 따라가기","x":["relatively(비교적) → small(작은) → circle(집단).","화살표가 가리키는 small(작은)은 형용사다.","형용사를 꾸밀 수 있는 건 부사뿐이다.","relative(상대적인)는 형용사라 다른 형용사 small(작은)을 꾸미지 못한다.","같은 지문의 precisely defined(정밀하게 규정된), flawlessly measure(완벽하게 측정하다)도 같은 원리."]},{"t":"pair","h":"쉬운 예시","x":[["It was a very cold day.","아주 추운 날이었다. (very(아주) → cold(추운))"],["She has a really nice voice.","그녀는 정말 좋은 목소리를 가졌다. (really(정말) → nice(좋은), real(진짜의)은 안 됨)"]]}],"post":["형용사(small = 작은) 꾸미면 -ly: a relatively small circle(비교적 작은 집단)"]},{"slots":[["flawlessly","","","동사 measure(측정하다)를 꾸미는 부사."],["continued","","","주어 the mindset(사고방식)의 진짜 동사."],["it","","","the mindset(사고방식)을 받는 it(그것)."],["began","beginning","a","as(~하면서)는 접속사다. 뒤에 주어 the precision-oriented sciences(정확성을 지향하는 과학)와 진짜 동사가 있어야 한다."],["that","","","앞 명사 situations(상황들)를 꾸미고 뒤에 주어가 빠진 관계대명사 that(~하는)."]],"opts":["to begin","begun","began","having begun"],"or":["to begin(시작하는 것): to부정사는 동사 자리에 못 와서 as(~하면서) 절에 동사가 없어짐.","begun(시작된, begin의 과거분사형): have(가지다) 없이 과거분사 혼자는 동사 자리에 못 옴.","began(시작했다, begin의 과거형): 접속사 as(~하면서) 뒤 절의 진짜 동사라 맞음.","having begun(시작하고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce.","ko":"정확성을 지향하는 수학과 통계학이라는 과학이 상업의 모든 영역에 영향을 미치기 시작하면서, 비즈니스 세계에서 그것은 심지어 확장되었다.","hl":["as the precision-oriented sciences","began to influence"],"khl":["영향을 미치기 시작하면서"],"blocks":[{"t":"p","h":"as(~하면서)도 접속사다","x":["as(~하면서, ~하기 때문에)는 뒤에 작은 문장을 데리고 오는 접속사다.","주어: the precision-oriented sciences of mathematics and statistics(정확성을 지향하는 수학과 통계학이라는 과학)","주어가 길어도 그 뒤엔 진짜 동사가 꼭 와야 한다.","beginning(시작하는)은 동사가 아니라서 문장이 반쪽이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["As the sun went down, it got cold.","해가 지면서 추워졌다. (As(~하면서) + the sun(해) + went down(졌다))"],["As I was tired, I went to bed early.","피곤해서 일찍 잤다. (As(~때문에) + I(나) + was(~였다))"]]}],"post":["접속사 as(~하면서) 뒤는 주어 + 진짜 동사: sciences began(과학이 시작했다)"]}],"quiz":[{"s":"By the time we arrived, the bus ___ left.","o":["having","had"],"a":1,"ko":"우리가 도착했을 때 버스는 이미 떠나 버렸었다.","why":"주어 the bus(버스) 뒤 진짜 동사 had left(떠났었다).","wy":"having(~하고 나서): -ing라 동사 자리에 못 와서 문장에 동사가 없어짐."},{"s":"Mom got me ___ the dishes.","o":["wash","to wash"],"a":1,"ko":"엄마는 내게 설거지를 시키셨다.","why":"get(~하게 하다) + 사람 + to부정사.","wy":"wash(씻다): get(~하게 하다)은 사람 뒤에 동사원형을 받지 않음."},{"s":"The fire ___ the old house last year.","o":["destroyed","destroying"],"a":0,"ko":"작년에 그 화재가 오래된 집을 파괴했다.","why":"주어 The fire(화재) 뒤 진짜 동사 자리.","wy":"destroying(파괴하는): -ing는 혼자 동사 자리에 못 옴."},{"s":"The math test was ___ easy.","o":["relatively","relative"],"a":0,"ko":"수학 시험은 비교적 쉬웠다.","why":"형용사 easy(쉬운)를 꾸미니 부사.","wy":"relative(상대적인): 형용사라 다른 형용사 easy(쉬운)를 꾸밀 수 없음."},{"s":"As the movie ___, the room got dark.","o":["beginning","began"],"a":1,"ko":"영화가 시작되면서 방이 어두워졌다.","why":"접속사 As(~하면서) 뒤 주어 the movie(영화) + 진짜 동사.","wy":"beginning(시작하는): -ing라 As(~하면서) 절의 동사가 될 수 없음."}]},{"items":[{"slots":[["it","","","the mindset(사고방식)을 받는 단수 대명사."],["began","","","접속사 as(~하면서) 절의 진짜 동사."],["that","where","a","앞 명사 situations(상황들)가 \"상황\"이라 where(~하는 곳)에 속기 쉽다. 하지만 뒤 are occurring(일어나고 있다)에 주어가 없다. 주어가 빠지면 관계대명사 that(~하는)."],["are_occurring","","","occur(일어나다)는 목적어 없이 쓰는 동사라 능동 진행형. 선행사 situations(상황들)가 복수라 are(~이다)."],["allowing","","","문장의 주어 자리. 동명사 allowing(허용하는 것)이 주어."]],"opts":["what","whose","how","that"],"or":["what(~하는 것): 앞에 명사 situations(상황들)가 있어서 못 옴.","whose(~의, 소유격 관계대명사): 바로 뒤에 꾸밀 명사가 와야 하는데 are occurring(일어나고 있다)이 옴.","how(~하는 방법): 관계부사라 뒤에 완전한 문장이 와야 하고, 명사 situations(상황들) 뒤에 바로 붙여 쓰지 않음.","that(~하는, 관계대명사): 앞 명사 situations(상황들)를 받고 뒤 절에 주어가 빠져 있어 맞음."],"point":"관계대명사 vs. 관계부사","en":"However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision―for messiness―may be a positive feature, not a shortcoming.","ko":"그러나 지난 수십 년간의 경향과 반대로, 오늘날 일어나고 있는 많은 새로운 상황에서는 부정확성, 즉 지저분함을 허용하는 것이 단점이 아니라 긍정적인 특징일 수 있다.","hl":["new situations that are occurring today"],"khl":["오늘날 일어나고 있는 많은 새로운 상황에서는"],"blocks":[{"t":"p","h":"\"상황\"이라는 말에 속지 않기","x":["situation(상황), case(경우), point(지점)는 장소처럼 보여 where(~하는 곳)를 부르기 쉽다.","하지만 관계사를 고르는 진짜 기준은 뒤 문장의 빈자리다.","___ are occurring today(___이 오늘날 일어나고 있다): 주어가 빠졌다.","주어가 빠지면 관계대명사 that, which.","뒤가 완전할 때만 where(~하는 곳)."]},{"t":"pair","h":"쉬운 예시","x":[["This is a situation where we need help.","이것은 우리가 도움이 필요한 상황이다. (where(~하는) 뒤 we need help(우리는 도움이 필요하다), 완전함)"],["This is a situation that needs help.","이것은 도움이 필요한 상황이다. (that(~하는) 뒤 주어가 빠짐)"]]}],"post":["situations(상황들) + 주어 빠진 문장 → that(~하는): situations that are occurring(일어나고 있는 상황들)"]},{"slots":[["began","","","as(~하면서) 절의 동사."],["that","","","주어가 빠진 절을 이끄는 관계대명사 that(~하는)."],["are_occurring","are occurred","a","occur(일어나다)는 목적어를 갖지 않는 동사다. 목적어가 없으니 \"~되다\"라는 수동태(be p.p.)도 만들 수 없다."],["allowing","","","may be(~일 수 있다)의 주어인 동명사."],["may","","","주어 뒤 조동사 may(~일 수 있다) + 동사원형 be(~이다)."]],"opts":["is occurring","occurring","are occurring","to occur"],"or":["is occurring(일어나고 있다, 단수형): 선행사 situations(상황들)가 복수라 is(~이다, 단수형)는 안 맞음.","occurring(일어나는): that 절(~하는) 안의 동사 자리에 -ing 혼자는 못 옴.","are occurring(일어나고 있다): 선행사 situations(상황들)가 복수이고, occur(일어나다)는 능동으로만 쓰는 동사라 진행형이 맞음.","to occur(일어나는 것): to부정사는 that 절(~하는)의 동사 자리에 못 옴."],"point":"능동태 vs. 수동태","en":"However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision―for messiness―may be a positive feature, not a shortcoming.","ko":"그러나 지난 수십 년간의 경향과 반대로, 오늘날 일어나고 있는 많은 새로운 상황에서는 부정확성, 즉 지저분함을 허용하는 것이 단점이 아니라 긍정적인 특징일 수 있다.","hl":["that are occurring today"],"khl":["오늘날 일어나고 있는"],"blocks":[{"t":"p","h":"목적어 없는 동사는 수동태가 없다","x":["수동태는 목적어를 주어 자리로 끌어올린 문장이다.","occur(일어나다), happen(일어나다), appear(나타나다), disappear(사라지다)는 처음부터 목적어가 없다.","끌어올릴 목적어가 없으니 be p.p.(~되다)가 될 수 없다.","그래서 are occurred(일어나지다)는 틀리고 are occurring(일어나고 있다)이 맞다."]},{"t":"pair","h":"쉬운 예시","x":[["The accident happened last night.","그 사고는 어젯밤에 일어났다. (was happened(일어나졌다)는 틀림)"],["The sun disappeared behind the clouds.","해가 구름 뒤로 사라졌다. (was disappeared(사라져졌다)는 틀림)"]]}],"post":["occur(일어나다)는 수동 불가: are occurring(일어나고 있다)"]},{"slots":[["that","","","situations(상황들)를 받는 관계대명사."],["are_occurring","","","occur(일어나다)는 능동만 가능, 복수 선행사라 are(~이다)."],["allowing","allow","a","may be(~일 수 있다)의 주어 자리다. 동사원형 allow(허용하다)는 주어가 될 수 없고, 동명사 allowing(허용하는 것)이 주어가 된다."],["may","","","조동사 may(~일 수 있다) 뒤 동사원형 be(~이다)."],["relaxing","","","전치사 for(~에 대한) 뒤라 동명사 relaxing(완화하는 것)."]],"opts":["allows","allowing","allowed","has allowed"],"or":["allows(허용하다, 3인칭 단수형): 동사라 주어 자리에 못 오고, may be(~일 수 있다)와 동사가 겹침.","allowing(허용하는 것, 동명사): 동사 may be(~일 수 있다)의 주어 자리라 명사 역할을 하는 동명사가 맞음.","allowed(허용했다, allow의 과거형·과거분사형): 주어 자리에 올 수 없고, 동사로 읽으면 may be(~일 수 있다)와 겹침.","has allowed(허용해 왔다, 현재완료형): 진짜 동사 모양이라 주어 자리에 못 옴."],"point":"동명사 주어","en":"However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision―for messiness―may be a positive feature, not a shortcoming.","ko":"그러나 지난 수십 년간의 경향과 반대로, 오늘날 일어나고 있는 많은 새로운 상황에서는 부정확성, 즉 지저분함을 허용하는 것이 단점이 아니라 긍정적인 특징일 수 있다.","hl":["allowing for imprecision","may be a positive feature"],"khl":["지저분함을 허용하는 것이","긍정적인 특징일 수 있다"],"blocks":[{"t":"p","h":"주어 덩어리 찾기","x":["이 문장의 동사는 may be(~일 수 있다).","그 앞 allowing for imprecision(부정확성을 허용하는 것)이 통째로 주어다.","주어 자리는 명사 자리다.","동사 allow(허용하다)를 명사처럼 쓰려면 -ing를 붙여 동명사로 만든다."]},{"t":"pair","h":"쉬운 예시","x":[["Eating vegetables is good for you.","채소를 먹는 것은 몸에 좋다. (주어 Eating vegetables(채소를 먹는 것) → is(~이다))"],["Reading books makes me calm.","책을 읽는 것은 나를 차분하게 만든다. (주어 Reading books(책을 읽는 것) → makes(만든다))"]]}],"post":["주어 자리 동사는 -ing: allowing for imprecision(부정확성을 허용하는 것) may be(~일 수 있다)"]},{"slots":[["may","","","조동사 may(~일 수 있다) + 동사원형."],["relaxing","relax","a","for(~에 대한)는 전치사다. 전치사 뒤에 동사원형 relax(완화하다)는 못 온다."],["allowable","","","명사 errors(오류들)를 꾸미는 형용사 allowable(허용 가능한)."],["better","","","뒤에 than(~보다)이 있으니 비교급 better(더 나은)."],["greater","","","뒤에 than(~보다)이 있으니 비교급 greater(더 훌륭한)."]],"opts":["to relax","relaxing","relaxed","relaxes"],"or":["to relax(완화하는 것): 전치사 for(~에 대한) 뒤에 to부정사는 못 옴.","relaxing(완화하는 것, 동명사): 전치사 for(~에 대한) 뒤라 동명사가 맞고, 뒤에 목적어 the standards(기준)도 거느림.","relaxed(완화된, relax의 과거분사형): 뒤 the standards(기준) 앞에 관사 the(그)가 있어 꾸밀 수 없고, 동사로도 전치사 뒤에 못 옴.","relaxes(완화하다, 3인칭 단수형): 동사라 전치사 뒤에 못 옴."],"point":"전치사 + 동명사","en":"As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.","ko":"허용 가능한 오류의 기준을 완화하는 대가로 사람은 훨씬 더 많은 데이터를 손에 넣을 수 있다.","hl":["for relaxing the standards"],"khl":["기준을 완화하는 대가로"],"blocks":[{"t":"p","h":"전치사 뒤에 동사 태우기","x":["for(~에 대한, ~을 위한)는 뒤에 명사를 데리고 오는 전치사다.","동사 relax(완화하다)가 그 자리에 오려면 -ing를 붙여 명사처럼 바꿔야 한다.","동명사는 명사처럼 쓰여도 동사의 힘이 남아 목적어를 데리고 다닌다.","relaxing the standards(기준을 완화하는 것): the standards(기준)가 목적어."]},{"t":"pair","h":"쉬운 예시","x":[["I am tired of waiting.","나는 기다리는 데 지쳤다. (of(~에) 뒤 waiting(기다리는 것))"],["She won a prize for drawing a cat.","그녀는 고양이를 그려서 상을 받았다. (for(~로) 뒤 drawing(그리는 것))"]]}],"post":["전치사 for(~에 대한) 뒤 동사는 -ing: for relaxing the standards(기준을 완화하는 것에 대한)"]},{"slots":[["may","","","조동사 may(~일 수 있다) 뒤 동사원형 be(~이다)."],["relaxing","","","전치사 for(~에 대한) 뒤 동명사."],["allowable","","","명사 errors(오류들)를 꾸미는 형용사."],["better","good","a","뒤에 than(~보다)이 있다. than(~보다)과 짝을 이루는 건 원급 good(좋은)이 아니라 비교급 better(더 나은)."],["greater","","","than(~보다) 앞 비교급 greater(더 훌륭한)."]],"opts":["best","well","most","better"],"or":["best(가장 좋은, good의 최상급): 최상급은 than(~보다)과 짝을 이루지 않음.","well(잘, 부사): is(~이다) 뒤 보어 자리이고, than(~보다)과 짝이 되려면 비교급이 필요함.","most(가장 많은, 최상급): 최상급이라 than(~보다)과 짝을 교급."]],"opts":["allow","allows","allowable","disallows"],"or":["allow(허용하다): 동사라 전치사 of(~의)와 명사 errors(오류들) 사이에서 명사를 꾸밀 수 없음.","allows(허용하다, 3인칭 단수형): 동사라 명사를 꾸밀 수 없음.","allowable(허용 가능한): 명사 errors(오류들)를 앞에서 꾸미는 형용사라 맞음.","disallows(허용하지 않다, 3인칭 단수형): 동사라 명사를 꾸밀 수 없고 뜻도 반대임."],"point":"형용사 자리 vs. 부사 자리","en":"As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data.","ko":"허용 가능한 오류의 기준을 완화하는 대가로 사람은 훨씬 더 많은 데이터를 손에 넣을 수 있다.","hl":["allowable errors"],"khl":["허용 가능한 오류"],"blocks":[{"t":"p","h":"명사 앞은 형용사 자리","x":["the standards of ___ errors(___ 오류의 기준): 빈칸 바로 뒤가 명사 errors(오류들)다.","명사를 꾸미는 건 형용사 allowable(허용 가능한).","allowably(허용 가능하게)는 부사라 동사, 형용사, 다른 부사만 꾸민다.","같은 지문 앞쪽의 relatively small(비교적 작은)과 반대 상황이다. 거기는 형용사를 꾸며서 부사였다."]},{"t":"pair","h":"쉬운 예시","x":[["She gave me a careful answer.","그녀는 내게 신중한 대답을 했다. (명사 answer(대답) ← careful(신중한))"],["She answered carefully.","그녀는 신중하게 대답했다. (동사 answered(대답했다) ← carefully(신중하게))"]]}],"post":["명사(errors = 오류들) 앞은 형용사: allowable errors(허용 가능한 오류)"]},{"no":"39","slots":[["may","","","조동사 may(~일 수 있다) 뒤 동사원형."],["relaxing","","","전치사 for(~에 대한) 뒤 동명사."],["allowable","","","명사 errors(오류들)를 꾸미는 형용사."],["better","","","than some(조금보다) 앞 비교급 better(더 나은)."],["greater","great","a","뒤에 than better(더 좋은 것보다)가 있다. than(~보다)과 짝이 되려면 원급 great(훌륭한)가 아니라 비교급 greater(더 훌륭한)."]],"opts":["greatest","greatly","greater","greatness"],"or":["greatest(가장 훌륭한, 최상급): 최상급은 than(~보다)과 짝을 이루지 않음.","greatly(크게, 부사): is(~이다) 뒤 보어 자리라 부사는 못 오고, than(~보다)과도 짝이 안 됨.","greater(더 훌륭한, great의 비교급): 뒤에 than(~보다)이 있어 비교급이 맞음.","greatness(위대함, 명사): 명사라 than(~보다) 비교를 만들 수 없음."],"point":"비교","en":"It isn’t just that “more is better than some,” but that, in fact, sometimes “more is greater than better.”","ko":"단지 '많은 것이 조금보다 낫다'는 것이 아니라, 사실 때로는 '많은 것이 더 좋은 것보다 더 훌륭하다'는 것이다.","hl":["more is greater than better"],"khl":["더 좋은 것보다 더 훌륭하다"],"blocks":[{"t":"p","h":"than(~보다) 양쪽 저울","x":["than(~보다)은 두 가지를 저울에 올려 무게를 잰다.","저울을 쓰려면 icism or even more {severe|severe} punishment.","fn":[],"mean":{"show":"보여 주다(동사원형·현재형)","cooperative":"협력적인(형용사)","cooperatively":"협력하여(부사)","cooperate":"협력하다(동사원형)","cooperates":"협력하다(cooperate의 3인칭 단수 현재형)","cooperated":"협력했다(cooperate의 과거형·과거분사형)","to receive":"받는 것(receive의 to부정사)","receive":"받다(동사원형)","received":"받았다, 받아진(receive의 과거형·과거분사형)","receiving":"받는 것, 받는(receive의 -ing형)","to receiving":"받는 것으로(전치사 to + 동명사)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","being":"~인 것, ~되는(be의 -ing형)","to be":"~인 것(be의 to부정사)","been":"~였던(be의 과거분사형)","was":"~였다(be의 과거형, 단수 주어)","were":"~였다(be의 과거형, 복수 주어)","to give":"주는 것, 주도록(give의 to부정사)","give":"주다(동사원형)","gives":"주다(give의 3인칭 단수 현재형)","giving":"주는 것, 주는(give의 -ing형)","to giving":"주는 것으로(전치사 to + 동명사)","play":"(게임을) 하다(동사원형)","plays":"하다(play의 3인칭 단수 현재형)","to play":"하는 것(play의 to부정사)","to playing":"하는 것으로(전치사 to + 동명사)","having played":"하고 나서(play의 완료 -ing형)","where":"~하는 곳(관계부사)","which":"~하는(관계대명사, 사물)","what":"~하는 것(선행사를 품은 관계대명사)","who":"~하는(주격 관계대명사, 사람)","whom":"~을(목적격 관계대명사, 사람)","whose":"~의(소유격 관계대명사)","helped":"도왔다(help의 과거형)","allowed":"허락했다(allow의 과거형)","allowing":"허락하면서(allow의 -ing형)","to allow":"허락하는 것(allow의 to부정사)","having allowed":"허락하고 나서(allow의 완료 -ing형)","allowance":"용돈, 허용(명사)","were given":"주어졌다(give의 수동태 과거형, 복수 주어)","was given":"주어졌다(give의 수동태 과거형, 단수 주어)","to be given":"주어지는 것(give의 수동 to부정사)","was giving":"주고 있었다(give의 과거진행형, 단수 주어)","have been found":"발견되었다(find의 수동태 현재완료형, 복수 주어)","has been found":"발견되었다(find의 수동태 현재완료형, 단수 주어)","have found":"찾았다(find의 현재완료형)","have been finding":"찾아 오고 있다(find의 현재완료진행형)","finding":"찾는 것, 찾는(find의 -ing형)","contribute":"기여하다, 기부하다(동사원형·현재형)","preferred":"선호되는(prefer의 과거분사형)","have":"가지다(동사원형)","severe":"심한(형용사)","severely":"심하게(부사)","severity":"심함, 가혹함(명사)","sever":"자르다, 끊다(동사원형)","severest":"가장 심한(severe의 최상급)","wash":"씻다(동사원형)","to wash":"씻는 것(wash의 to부정사)","set":"차렸다(set의 과거형, 원형과 모양이 같음)","setting":"차리는 것, 차리는(set의 -ing형)","happy":"행복한(형용사)","happily":"행복하게(부사)","wrote":"썼다(write의 과거형)","written":"쓰인(write의 과거분사형)","to sleep":"자는 것(sleep의 to부정사)","sleeping":"자는 것, 자는(sleep의 -ing형)","go":"가다(동사원형)","to go":"가는 것, 가도록(go의 to부정사)"},"sets":[{"items":[{"slots":[["show","","","주어 Multiple laboratory studies(여러 실험실 연구들)가 복수라 show(보여 주다)가 맞다."],["cooperative","","","명사 people(사람들)을 꾸미니 형용사가 맞다."],["is","are","a","주어는 One way(한 가지 방법), 단수다. to demonstrate this(이것을 증명하는)는 꼬리표일 뿐."],["play","","","had(~하게 했다) + 사람 + 동사원형. 참가자들이 직접 게임을 한다."],["where","","","뒤 문장(people could contribute money = 사람들이 돈을 기부할 수 있었다)이 완전해서 where(~하는 곳)가 맞다."]],"opts":["being","is","to be","been"],"or":["being(~인 것): -ing형은 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","is(~이다): 주어 One way(한 가지 방법)가 단수라 단수 현재형 동사가 맞음.","to be(~인 것): to부정사도 동사 자리에 못 와서 주어 One way(한 가지 방법) 뒤 동사가 비게 됨.","been(~였던): 과거분사는 have(가지다) 없이 혼자 동사 노릇을 못 함."],"point":"수식받는 주어의 수일치","en":"One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors.","ko":"이것을 증명하는 한 가지 방법은 사람들에게 기여자들을 향해 긍정적이거나 부정적으로 행동할 기회를 주는 것이다.","hl":["One way","is"],"khl":["한 가지 방법은","주는 것이다"],"blocks":[{"t":"p","h":"꼬리표 길이에 속지 않기","x":["주어 One way(한 가지 방법) 뒤에 to demonstrate this(이것을 증명하는)가 붙었다.","이 꼬리표는 주어를 꾸미는 말일 뿐 주인이 아니다.","주인 way(방법)는 하나다.","그래서 동사는 are(~이다, 복수형)가 아니라 is(~이다, 단수형)."]},{"t":"pair","h":"쉬운 예시","x":[["The way to the station is easy.","역으로 가는 길은 쉽다. (주인 The way(길) → is(~이다))"],["The books on the desk are mine.","책상 위의 책들은 내 것이다. (주인 The books(책들) → are(~이다))"]]}],"post":["꼬리표(to demonstrate this = 이것을 증명하는) 떼고 One way(한 가지 방법) → is(~이다)"]},{"slots":[["receive1","","","tend to(~하는 경향이 있다) + 동사원형이라 to receive(받는 것)가 맞다."],["togive1","","","is(~이다) 뒤 보어 자리. to give(주는 것)가 \"주는 것\"이라는 명사 역할을 한다."],["play","to play","a","had(~하게 했다)는 사역동사. had + 사람 + 동사원형이라 to를 붙이면 안 된다."],["which","","","앞 명사 a group fund(집단 기금)를 받고, 뒤에 주어가 빠진 helped(도왔다)가 오니 which(~하는)가 맞다."],["allowed","","","앞의 동사 had(~하게 했다)와 and then(그러고 나서)으로 나란한 과거형 동사다."]],"opts":["plays","play","to playing","having played"],"or":["plays(하다, 3인칭 단수형): 목적격보어 자리는 동사원형이라 s가 붙으면 안 됨.","play(하다): 사역동사 had(~하게 했다) + 목적어 뒤는 동사원형이라 맞음.","to playing(하는 것으로): 사역동사 뒤에 전치사 to가 낄 자리가 없음.","having played(하고 나서): 완료 -ing형이라 사역동사 뒤 원형 자리에 못 옴."],"point":"목적격보어(준동사)","en":"For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game.","ko":"예를 들어, Guelph 대학교의 교수인 Pat Barclay는 참가자들에게 협동 게임을 하게 했다.","hl":["had participants play"],"khl":["협동 게임을 하게 했다"],"blocks":[{"t":"p","h":"have(~하게 하다) 뒤 사람은 바로 움직인다","x":["have(~하게 하다), make(~하게 만들다), let(~하게 두다)은 사역동사다.","사역동사 = 남에게 어떤 행동을 시키는 동사.","had participants play(참가자들이 게임을 하게 했다): 참가자들이 바로 play(하다)로 움직인다.","같은 문장 뒤의 allowed(허락했다)는 사역동사가 아니라 to give(주도록)를 쓴다.","한 문장 안에서 두 모양을 비교해 두자."]},{"t":"pair","h":"쉬운 예시","x":[["My teacher had me read the letter.","선생님은 내가 그 편지를 읽게 했다. (had me read = 내가 읽게 했다)"],["She let her son play outside.","그녀는 아들이 밖에서 놀게 했다. (let(~하게 두다) + 사람 + 동사원형)"]]}],"post":["had(~하게 했다) + 사람 + 동사원형: had participants play(참가자들이 게임을 하게 했다)"]},{"slots":[["is","","","주어 One way(한 가지 방법)가 단수라 is(~이다)가 맞다."],["where","which","a","뒤 문장 people could contribute money(사람들이 돈을 기부할 수 있었다)가 빠진 것 없이 완전하다. 완전한 문장 앞에는 관계대명사 which(~하는)를 쓸 수 없다."],["helped","","","which(~하는) 뒤 동사 자리. 과거 이야기라 helped(도왔다)."],["togive2","","","allow(허락하다) + 사람 + to부정사라 to give(주도록)가 맞다."],["weregiven","","","주어 People(사람들)이 복수이고, 책임을 \"받는\" 쪽이라 were given(주어졌다)."]],"opts":["what","whom","where","who"],"or":["what(~하는 것): 앞에 명사 game(게임)이 있고 뒤 문장도 완전해서 못 옴.","whom(~을): 목적어가 빠진 문장 앞에 쓰는데 뒤 문장은 완전하고, game(게임)은 사람도 아님.","where(~하는 곳): 뒤 문장이 완전하고 앞 명사 a cooperative game(협동 게임)이 일이 벌어지는 자리라 관계부사가 맞음.","who(~하는): 사람을 받으며 주어가 빠진 문장 앞에 쓰는데 둘 다 안 맞음."],"point":"관계대명사 vs. 관계부사","en":"Pat Barclay had participants play a cooperative game where people could contribute money toward a group fund.","ko":"Pat Barclay는 사람들이 집단 기금에 돈을 기부할 수 있는 협동 게임을 참가자들에게 하게 했다.","hl":["a cooperative game where","people could contribute money"],"khl":["협동 게임을","돈을 기부할 수 있는"],"blocks":[{"t":"p","h":"뒤 문장에 빈자리가 있나","x":["관계대명사 which(~하는)는 뒤 문장의 주어나 목적어 하나를 데려간다.","그래서 which(~하는) 뒤 문장에는 빈자리가 하나 있어야 한다.","이 문장을 보자. people(사람들이) could contribute(기부할 수 있었다) money(돈을).","주어·동사·목적어가 다 있다. 빈자리가 없다.","빈자리가 없으면 where(~하는 곳)."]},{"t":"pair","h":"쉬운 예시","x":[["This is the house where I was born.","여기가 내가 태어난 집이다. (I was born = 내가 태어났다, 완전한 문장)"],["This is the house which my dad built.","이것은 아빠가 지은 집이다. (built(지었다)의 목적어가 빠짐)"]]},{"t":"tap","h":"확인 질문","q":"같은 문장의 a group fund which helped all group members(모든 구성원을 도운 집단 기금)에서 which(~하는) 뒤에 빠진 것은?","a":["주어가 빠졌다.","helped(도왔다)의 주인이 없으니 which(~하는)가 그 자리를 채운다."]}],"post":["완전한 문장 앞은 where(~하는 곳): a game where people could contribute(사람들이 기부할 수 있는 게임)"]},{"slots":[["cooperative","","","명사 people(사람들)을 꾸미는 형용사다."],["which","","","a group fund(집단 기금)를 받는 관계대명사. 뒤에 주어가 빠졌다."],["allowed","allowing","a","문장의 주인 Pat Barclay(팻 바클레이)의 동사는 had(~하게 했다). and then(그러고 나서) 뒤에도 같은 과거형 동사가 와야 한다."],["who1","","","사람 People(사람들)을 받고 뒤에 주어가 빠져 who(~하는)가 맞다."],["contribute","","","선행사 People(사람들)이 복수라 contribute(기여하다)."]],"opts":["allowed","to allow","having allowed","allowance"],"or":["allowed(허락했다): had(~하게 했다)와 and then(그러고 나서)으로 나란한 과거형 동사라 맞음.","to allow(허락하는 것): to부정사는 동사가 아니라 had(~하게 했다)와 짝을 이룰 수 없음.","having allowed(허락하고 나서): -ing형이라 동사 had(~하게 했다)와 and(그리고)로 나란할 수 없음.","allowance(용돈, 허용): 명사라 동사 자리에 못 오고 뒤 participants(참가자들)와도 이어지지 않음."],"point":"병렬구조","en":"Pat Barclay ... had participants play a cooperative game ..., and then allowed participants to give money to other participants based on their reputations.","ko":"Pat Barclay는 참가자들에게 협동 게임을 하게 한 다음, 참가자들이 평판을 바탕으로 다른 참가자들에게 돈을 줄 수 있도록 허락했다.","hl":["had","allowed"],"khl":["하게 한 다음","허락했다"],"blocks":[{"t":"p","h":"긴 문장에서 동사 두 개 찾기","x":["이 문장은 길지만 주인은 Pat Barclay(팻 바클레이) 한 명이다.","그가 한 일은 두 가지다. had(~하게 했다), allowed(허락했다).","두 동사는 and then(그러고 나서)으로 이어진다.","앞이 과거형 had(~하게 했다)이니 뒤도 과거형 allowed(허락했다).","allowing(허락하면 ":"My dad had me ___ the car.","o":["to wash","wash"],"a":1,"ko":"아빠는 나에게 세차를 시켰다.","why":"had(~하게 했다) + 사람 + 동사원형.","wy":"to wash(씻는 것): 사역동사 have(~하게 하다) 뒤에는 to 없이 원형이 와야 함."},{"s":"This is the park ___ we played soccer.","o":["where","which"],"a":0,"ko":"여기가 우리가 축구를 한 공원이다.","why":"we played soccer(우리가 축구를 했다)가 완전한 문장이라 where(~하는 곳).","wy":"which(~하는): 뒤 문장에 빈자리가 있어야 하는데 완전한 문장이라 못 옴."},{"s":"She cooked dinner and ___ the table.","o":["set","setting"],"a":0,"ko":"그녀는 저녁을 요리하고 식탁을 차렸다.","why":"cooked(요리했다) and set(차렸다). 과거형 동사끼리 나란히.","wy":"setting(차리는): -ing는 혼자 동사가 못 되어 cooked(요리했다)와 짝이 안 맞음."},{"s":"The boys in my class ___ given a prize.","o":["was","were"],"a":1,"ko":"우리 반 남자아이들은 상을 받았다.","why":"주인은 The boys(남자아이들), 복수라 were(~였다).","wy":"was(~였다): 단수 동사라 복수 주어 The boys(남자아이들)와 안 맞음."}]},{"items":[{"slots":[["cooperative","cooperatively","a","people(사람들)이라는 명사를 꾸미는 자리. 부사는 명사를 꾸밀 수 없다."],["receive1","","","tend to(~하는 경향이 있다) + 동사원형."],["play","","","had(~하게 했다) + 사람 + 동사원형."],["allowed","","","had(~하게 했다)와 and then(그러고 나서)으로 나란한 과거형 동사."],["have","","","to be trustworthy(신뢰할 만하다고) and (to) have(가지고 있다고). to 뒤 원형끼리 나란하다."]],"opts":["cooperate","cooperates","cooperated","cooperative"],"or":["cooperate(협력하다): 동사원형이라 명사 앞에서 꾸밀 수 없고, 뒤 tend(~하는 경향이 있다)와 동사가 겹침.","cooperates(협력하다, 3인칭 단수형): 동사라 명사를 꾸밀 수 없음.","cooperated(협력했다): cooperate(협력하다)는 목적어를 받지 않는 동사라 p.p.로 명사를 꾸미지 못함.","cooperative(협력적인): 명사 people(사람들)을 앞에서 꾸미는 형용사라 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"Multiple laboratory studies show that cooperative people tend to receive social advantages from others.","ko":"여러 실험실 연구들은 협력적인 사람들이 다른 사람들로부터 사회적인 혜택들을 받는 경향이 있다는 것을 보여 준다.","hl":["cooperative people"],"khl":["협력적인 사람들이"],"blocks":[{"t":"p","h":"화살표가 명사로 가면 형용사","x":["cooperative(협력적인) → people(사람들). 화살표가 명사로 간다.","명사를 꾸미는 건 형용사의 일이다.","cooperatively(협력하여)는 부사라 동사나 형용사를 꾸민다.","work cooperatively(협력하여 일하다)처럼 동사 옆에 둔다.","같은 지문 끝의 severe punishment(심한 벌)도 형용사 + 명사 구조다."]},{"t":"pair","h":"쉬운 예시","x":[["She i 의해)와도 안 맞음.","finding(찾는): -ing형은 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","have been found(발견되었다): 복수 주어 results(결과들)가 발견되는 쪽이라 복수 수동태가 맞음."],"point":"능동태 vs. 수동태","en":"Similar results have been found by other researchers.","ko":"유사한 결과들이 다른 연구자들에 의해 발견되었다.","hl":["have been found","by other researchers"],"khl":["발견되었다","다른 연구자들에 의해"],"blocks":[{"t":"p","h":"주인이 하는가, 당하는가","x":["주어 Similar results(유사한 결과들)는 찾는 쪽인가, 찾아지는 쪽인가?","결과는 연구자들에게 찾아지는 쪽이다.","당하는 쪽이면 be동사 + p.p.(수동태)를 쓴다.","have found(찾았다)를 쓰면 결과가 무언가를 찾았다는 엉뚱한 뜻이 된다.","뒤의 by other researchers(다른 연구자들에 의해)가 결정적 힌트다."]},{"t":"pair","h":"쉬운 예시","x":[["The window was broken by my brother.","그 창문은 남동생에 의해 깨졌다. (창문 = 깨진 쪽)"],["The letters have been sent.","편지들은 보내졌다. (have been(~되어 왔다) + p.p. = ~되었다)"]]}],"post":["by(~에 의해) 보이면 수동: have been found(발견되었다)"]},{"slots":[["play","","","had(~하게 했다) + 사람 + 동사원형."],["who1","","","사람 People(사람들)을 받고 뒤에 주어가 빠져 who(~하는)."],["preferred","","","are chosen(선택된다)의 chosen(선택된)과 나란한 p.p."],["have","","","to be(~이라고) ... and (to) have(가지고 있다고). 원형끼리 나란하다."],["receive2","receiving","a","tend(~하는 경향이 있다)는 뒤에 to부정사를 받는다. -ing는 안 된다."]],"opts":["receive","received","to receive","to receiving"],"or":["receive(받다): tend(~하는 경향이 있다) 바로 뒤에 동사원형은 못 옴.","received(받았다, 받아진): tend(~하는 경향이 있다) 뒤에 과거형이나 p.p.는 못 옴.","to receive(받는 것): tend(~하는 경향이 있다)는 to부정사를 받아서 맞음.","to receiving(받는 것으로): 여기 to는 to부정사의 to라 뒤에 원형이 와야 함."],"point":"동명사 vs. to부정사 목적어","en":"Uncooperative people tend to receive verbal criticism or even more severe punishment.","ko":"비협조적인 사람들은 언어적인 비판이나 심지어 더 심한 벌을 받는 경향이 있다.","hl":["tend to receive"],"khl":["받는 경향이 있다"],"blocks":[{"t":"p","h":"tend(~하는 경향이 있다) 뒤는 to","x":["tend to(~하는 경향이 있다) 뒤에는 동사원형이 온다.","한 덩어리로 외워 둔다.","같은 지문 첫 문장에도 tend to receive(받는 경향이 있다)가 나온다.","첫 문장은 협력하는 사람, 끝 문장은 협력하지 않는 사람.","두 문장이 같은 틀로 짝을 이룬다."]},{"t":"pair","h":"쉬운 예시","x":[["I tend to eat too fast.","나는 너무 빨리 먹는 경향이 있다. (tend to eat = 먹는 경향이 있다)"],["Kids tend to like sweets.","아이들은 단것을 좋아하는 경향이 있다. (tend to like = 좋아하는 경향이 있다)"]]}],"post":["tend to(~하는 경향이 있다) + 동사원형: tend to receive(받는 경향이 있다)"]},{"slots":[["togive1","","","is(~이다) 뒤 보어 자리의 to give(주는 것)."],["togive2","give","a","allow(허락하다)는 사역동사가 아니다. allow + 사람 + to부정사."],["weregiven","","","People(사람들)이 복수이고 \"주어진\" 쪽."],["contribute","","","선행사 People(사람들)이 복수."],["severe","","","명사 punishment(벌)를 꾸미는 형용사."]],"opts":["giving","to give","gives","to giving"],"or":["giving(주는): allow(허락하다)의 목적격보어 자리에 -ing는 못 옴.","to give(주도록): allow(허락하다) + 목적어 + to부정사라 맞음.","gives(주다, 3인칭 단수형): 목적격보어 자리에 s 붙은 동사는 못 옴.","to giving(주는 것으로): 여기 to는 to부정사의 to라 뒤에 원형이 와야 함."],"point":"목적격보어(준동사)","en":"and then allowed participants to give money to other participants based on their reputations","ko":"그 다음 참가자들이 그들의 평판을 바탕으로 다른 참가자들에게 돈을 줄 수 있도록 허락했다","hl":["allowed participants to give"],"khl":["돈을 줄 수 있도록 허락했다"],"blocks":[{"t":"p","h":"had(~하게 했다)와 allowed(허락했다) 비교","x":["같은 문장에 목적격보어가 두 번 나온다.","목적격보어 = 목적어(사람)가 무엇을 하는지 알려 주는 말.","had participants play(참가자들이 게임을 하게 했다): 사역동사라 원형.","allowed participants to give(참가자들이 돈을 주도록 허락했다): 보통 동사라 to부정사.","시험은 이 둘을 바꿔 치기 좋아한다."]},{"t":"pair","h":"쉬운 예시","x":[["My mom allowed me to go out.","엄마는 내가 외출하도록 허락했다. (allowed me to go = 내가 가도록 허락했다)"],["He asked me to help him.","그는 나에게 도와 달라고 부탁했다. (ask(부탁하다) + 사람 + to)"]]}],"post":["allow(허락하다) + 사람 + to부정사: allowed participants to give(참가자들이 주도록 허락했다)"]}],"quiz":[{"s":"She is a ___ girl.","o":["happily","happy"],"a":1,"ko":"그녀는 행복한 소녀다.","why":"명사 girl(소녀)을 꾸미니 형용사.","wy":"happily(행복하게): 부사라 명사 girl(소녀)을 꾸밀 수 없음."},{"s":"I lost the book ___ you gave me.","o":["which","what"],"a":0,"ko":"나는 네가 준 책을 잃어버렸다.","why":"앞에 명사 the book(책)이 있으니 which(~하는).","wy":"what(~하는 것): 명사를 품은 말이라 앞에 명사 the book(책)이 있으면 못 옴."},{"s":"The letter was ___ by my brother.","o":["written","wrote"],"a":0,"ko":"그 편지는 남동생이 썼다.","why":"편지는 \"쓰이는\" 쪽이라 be동사 + p.p.","wy":"wrote(썼다): 과거형이라 be동사 was(~였다) 뒤에 올 수 없음."},{"s":"Cats tend ___ a lot.","o":["sleeping","to sleep"],"a":1,"ko":"고양이는 잠을 많이 자는 경향이 있다.","why":"tend to(~하는 경향이 있다) + 동사원형.","wy":"sleeping(자는 것): tend(~하는 경향이 있다)는 -ing를 목적어로 받지 않음."},{"s":"Mom allowed me ___ out.","o":["to go","go"],"a":0,"ko":"엄마는 내가 외출하도록 허락했다.","why":"allow(허락하다) + 사람 + to부정사.","wy":"go(가다): allow(허락하다)는 사역동사가 아니라 원형을 쓸 수 없음."}]}],"comp":[{"slots":[["show","","","주어 studies(연구들)가 복수라 show(보여 주다)."],["allowed","","","had(~하게 했다)와 나란한 과거형 동사."],["who1","whom","a","who(~하는) 뒤에 바로 contributed(기부했다)가 온다. 주어 자리가 비었으니 주격 who(~하는). whom(~을)은 목적격이라 안 된다."],["havebeenfound","","","결과는 \"발견되는\" 쪽이라 수동태."],["have","","","to be ... and (to) have(가지고 있다고). 원형끼리 나란하다."]],"opts":["which","whose","what","who"],"or":["which(~하는): 사물을 받는 말이라 사람 People(사람들)에는 안 맞음.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 동사 contributed(기부했다)가 옴.","what(~하는 것): 명사를 품은 말이라 앞에 People(사람들)이 있으면 못 옴.","who(~하는): 사람 People(사람들)을 받고 뒤 contributed(기부했다)의 주어가 빠져 있어 맞음."],"point":"관계대명사의 격","en":"People who contributed more to the group fund were given responsibility for more money.","ko":"집단 기금에 더 많이 기부한 사람들은 더 많은 돈에 대한 책임이 주어졌다.","hl":["People who contributed"],"khl":["더 많이 기부한 사람들은"],"blocks":[{"t":"p","h":"빈자리가 주어 자리면 who(~하는)","x":["who(~하는) 뒤를 보면 바로 contributed(기부했다)가 나온다.","기부한 사람이 빠져 있다. 주어 자리가 비었다.","주어 자리를 채우는 건 주격 who(~하는).","whom(~을)은 목적어 자리가 빌 때 쓴다."]},{"t":"pair","h":"쉬운 예시","x":[["The boy who called me is my cousin.","나에게 전화한 소년은 내 사촌이다. (called(전화했다)의 주어가 빠짐 → who)"],["The boy whom I called is my cousin.","내가 전화한 소년은 내 사촌이다. (called(전화했다)의 목적어가 빠짐 → whom)"]]}],"post":["주어 빈자리는 who(~하는): People who contributed(기부한 사람들)"],"no":"40"},{"slots":[["cooperative","","","명사 people(사람들)을 꾸미는 형용사."],["where","","","뒤 문장이 완전해서 where(~하는 곳)."],["preferred","","","chosen(선택된)과 나란한 p.p. preferred(선호되는)."],["receive2","","","tend to(~하는 경향이 있다) + 동사원형."],["severe","severely","a","명사 punishment(벌)를 꾸미는 자리. 부사 severely(심하게)는 명사를 꾸밀 수 없다."]],"opts":["severity","sever","severe","severest"],"or":["severity(심함): 명사라 more(더) 뒤에서 명사 punishment(벌)를 꾸밀 수 없음.","sever(자르다): 동사라 명사 앞에서 꾸미는 자리에 못 옴.","severe(심한): more(더)와 함께 명사 punishment(벌)를 꾸미는 형용사라 맞음.","severest(가장 심한): 이미 more(더)가 있어 최상급을 또 쓰면 비교가 겹침."],"point":"형용사 자리 vs. 부사 자리","en":"Uncooperative people tend to receive verbal criticism or even more severe punishment.","ko":"비협조적인 사람들은 언어적인 비판이나 심지어 더 심한 벌을 받는 경향이 있다.","hl":["even more severe punishment"],"khl":["심지어 더 심한 벌을"],"blocks":[{"t":"p","h":"more(더) 떼고 짝 찾기","x":["more(더)는 비교를 만드는 말일 뿐이다.","more(더)를 빼고 보면 severe punishment(심한 벌).","punishment(벌)는 명사니까 형용사 severe(심한).","앞의 verbal criticism(언어적인 비판)도 형용사 + 명사로 같은 모양이다."]},{"t":"pair","h":"쉬운 예시","x":[["It was a more difficult test.","그것은 더 어려운 시험이었다. (명사 test(시험) ← 형용사)"],["He studied more carefully.","그는 더 주의 깊게 공부했다. (동사 studied(공부했다) ← 부사)"]]}],"post":["more(더) 떼고 명사 꾸미면 형용사: more severe punishment(더 심한 벌)"],"no":"40"}],"compquiz":[{"s":"The boy ___ lives next door is my friend.","o":["whom","who"],"a":1,"ko":"옆집에 사는 소년은 내 친구다.","why":"lives(산다)의 주어가 빠졌으니 주격 who(~하는).","wy":"whom(~을): 목적격이라 주어가 빠진 자리에 못 옴."},{"s":"We had a ___ storm last night.","o":["severely","severe"],"a":1,"ko":"어젯밤에 심한 폭풍이 왔다.","why":"명사 storm(폭풍)을 꾸미니 형용사.","wy":"severely(심하게): 부사라 명사 storm(폭풍)을 꾸밀 수 없음."}]},{"id":"2311g2-41","no":"41","title":"어법특훈 · 23년 11월 고2 41번","sub":"청중과 연주자를 잇는 법","tpl":"In Western society, many music performance settings {make|make} a clear distinction between performers and audience members: the performers are the “doers” and {those|those} in the audience take a {decidedly|decidedly} passive role. The performance space {itself|itself} may further reinforce the distinction with a physical separation between the stage and audience seating. Perhaps because this distinction is so {common|common}, audiences {seem|seem} to {greatly|greatly} value opportunities to have special “access” to performers that affords understanding about performers’ style of music. Some performing musicians have won great approval by regularly {incorporating|incorporating} “audience participation” into their concerts. Whether by {leading|leading} a sing-along activity or {teaching|teaching} a rhythm to be clapped at certain points, {including|including} audience members in the music making can boost the level of engagement and enjoyment for all {involved|involved}. Performers {who|who} are uncomfortable leading audience participation can still connect with the audience simply by {giving|giving} a special glimpse of the performer perspective. It is quite common in classical music {toprovide|to provide} audiences with program notes. Typically, this text in a program {gives|gives} background information about pieces of music {beingperformed|being performed} and perhaps biographical information about historically significant composers. {what|What} may be of more interest to audience members is background information about the very performers who are onstage, including an explanation of {why|why} they have chosen the music they are presenting. Such insight can make audience members {feel|feel} closer to the musicians onstage, both metaphorically and emotionally. This connection will likely enhance the expressive and communicative experience.","fn":[],"mean":{"make":"만들다(동사원형·현재형)","makes":"만들다(make의 3인칭 단수 현재형)","making":"만드는 것, 만드는(make의 -ing형)","to make":"만드는 것(make의 to부정사)","has made":"만들어 왔다(make의 현재완료형, 단수 주어)","those":"~한 사람들, 그것들(that의 복수형)","that":"그것, 저것(지시대명사, 단수)","That":"~라는 것(명사절을 이끄는 접속사) / 그것(지시대명사)","them":"그들을(they의 목적격)","it":"그것(단수 대명사)","this":"이것(지시대명사, 단수)","decidedly":"분명히, 확실히(부사)","itself":"그 자체(it의 재귀대명사)","common":"흔한(형용사)","seem":"~처럼 보이다(동사원형·현재형)","greatly":"크게, 매우(부사)","great":"큰, 대단한(형용사)","greatness":"위대함(명사)","greater":"더 큰(great의 비교급)","greatest":"가장 큰(great의 최상급)","incorporating":"포함하는 것(incorporate의 -ing형, 동명사)","incorporate":"포함하다(동사원형)","incorporated":"포함했다, 포함된(incorporate의 과거형·과거분사형)","incorporates":"포함하다(incorporate의 3인칭 단수 현재형)","to incorporate":"포함하는 것(incorporate의 to부정사)","leading":"이끄는 것(lead의 -ing형, 동명사)","teaching" ],["decidedly","","","형용사 passive(수동적인)를 꾸미니 부사가 맞다."],["itself","","","주어 The performance space(공연 공간)를 강조하는 재귀대명사. 단수라 itself(그 자체)."],["seem","","","주어 audiences(청중들)가 복수라 seem(~처럼 보이다)."]],"opts":["making","make","to make","has made"],"or":["making(만드는 것): -ing형은 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","make(만들다): 주어 settings(상황들)가 복수라 s 없는 현재형 동사가 맞음.","to make(만드는 것): to부정사도 동사 자리에 못 와서 주어 뒤 동사가 비게 됨.","has made(만들어 왔다, 단수형): 주어 settings(상황들)는 복수라 has(완료형의 단수형)를 쓸 수 없음."],"point":"수식받는 주어의 수일치","en":"In Western society, many music performance settings make a clear distinction between performers and audience members.","ko":"서양 사회에서, 많은 음악 공연 상황은 공연자와 청중 사이에 명확한 구분을 만든다.","hl":["many music performance settings make"],"khl":["많은 음악 공연 상황은","만든다"],"blocks":[{"t":"p","h":"명사 덩어리의 머리 찾기","x":["music performance settings(음악 공연 상황들)는 명사 셋이 붙은 덩어리다.","앞의 music(음악), performance(공연)는 꾸미는 말이다.","덩어리의 머리는 맨 끝 settings(상황들). 복수다.","앞의 Western society(서양 사회)는 In(~에서)에 묶인 말이라 주어가 아니다."]},{"t":"pair","h":"쉬운 예시","x":[["Many school buses stop here.","많은 스쿨버스가 여기 선다. (머리 buses(버스들) → stop(서다))"],["My computer desk is old.","내 컴퓨터 책상은 낡았다. (머리 desk(책상) → is(~이다))"]]}],"post":["덩어리 머리(settings = 상황들) 보고 make(만들다)"]},{"slots":[["make","","","주어 settings(상황들)가 복수라 make(만들다)."],["those","that","a","가리키는 것은 청중 속 \"사람들\"이고 동사도 take(맡다)다. 하나를 가리키는 that(그것)은 쓸 수 없다."],["common","","","is so(매우 ~하다) 뒤 보어 자리라 형용사 common(흔한)."],["greatly","","","동사 value(가치 있게 여기다)를 꾸미는 부사."],["incorporating","","","전치사 by(~함으로써) 뒤라 동명사."]],"opts":["those","them","it","this"],"or":["those(사람들): 뒤 in the audience(청중 속의)의 꾸밈을 받아 \"청중 속 사람들\"이 되고 복수 동사 take(맡다)와 맞음.","them(그들을): 목적격이라 주어 자리에 못 옴.","it(그것): 단수라 복수 동사 take(맡다)와 안 맞고 사람들을 가리킬 수도 없음.","this(이것): 단수라 복수 동사 take(맡다)와 안 맞음."],"point":"대명사의 성·수·격 일치","en":"the performers are the “doers” and those in the audience take a decidedly passive role.","ko":"공연자들은 ‘행위자들’이고, 청중 속 사람들은 분명히 수동적인 역할을 맡는다.","hl":["those in the audience take"],"khl":["청중 속 사람들은"],"blocks":[{"t":"p","h":"those(사람들)는 여럿을 가리킨다","x":["those in the audience = 청중 속에 있는 사람들.","those(사람들)는 뒤에 꾸미는 말을 달고 \"~한 사람들\"이 된다.","여럿이니 동사도 s가 없는 take(맡다).","that(그것)은 하나를 가리켜서 여러 사람을 받을 수 없다."]},{"t":"pair","h":"쉬운 예시","x":[["Those in the front row can see well.","앞줄에 있는 사람들은 잘 볼 수 있다. (Those = 사람들)"],["Heaven helps those who help themselves.","하늘은 스스로 돕는 자를 돕는다. (those who = ~하는 사람들)"]]}],"post":["\"~한 사람들\"은 those: those in the audience(청중 속 사람들)"]},{"slots":[["itself","","","주어 The performance space(공연 공간)를 강조하는 단수 재귀대명사."],["seem","","","주어 audiences(청중들)가 복수라 seem(~처럼 보이다)."],["greatly","great","a","to와 동사 value(가치 있게 여기다) 사이에서 동사를 꾸미는 자리. 형용사 great(큰)는 동사를 꾸밀 수 없다."],["leading","","","전치사 by(~함으로써) 뒤라 동명사 leading(이끄는 것)."],["including","","","동사 can boost(높일 수 있다) 앞의 주어 자리라 동명사."]],"opts":["greatness","greater","greatest","greatly"],"or":["greatness(위대함): 명사라 동사를 꾸밀 수 없고, to 뒤 동사 자리를 막음.","greater(더 큰): 형용사 비교급이라 동사를 꾸밀 수 없음.","greatest(가장 큰): 형용사 최상급이라 동사를 꾸밀 수 없음.","greatly(크게): 동사 value(가치 있게 여기다)를 꾸미는 부사라 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"audiences seem to greatly value opportunities to have special “access” to performers","ko":"청중들은 공연자에 대한 특별한 ‘접근’을 할 기회들에 크게 가치를 부여하는 것처럼 보인다","hl":["greatly value"],"khl":["크게 가치를 부여하는"],"blocks":[{"t":"p","h":"value(가치 있게 여기다)는 여기서 동사","x":["value(가치)는 명사로도, 동사로도 쓰인다.","seem to(~처럼 보이다) 뒤라서 여기 value(가치 있게 여기다)는 동사다.","동사를 꾸미는 말은 부사 greatly(크게).","great(큰)를 넣으면 great value(큰 가치)라는 명사 덩어리가 되어 to 뒤 동사가 사라진다."]},{"t":"pair","h":"쉬운 예시","x":[["I greatly respect my teacher.","나는 선생님을 매우 존경한다. (동사 respect(존경하다) ← 부사)"],["It was a great day.","멋진 날이었다. (명사 day(날) ← 형용사)"]]}],"post":["동사 꾸미면 -ly: greatly value(크게 가치 있게 여기다)"]},{"slots":[["decidedly","","","형용사 passive(수동적인)를 꾸미는 부사."],["incorporating","incorporate","a","by(~함으로써)는 전치사. 전치사 뒤에 동사를 쓰려면 -ing 모양이어야 한다."],["teaching","","","leading(이끄는 것)과 or(또는)로 나란한 -ing."],["involved","","","all involved(관련된 모든 사람)에는 people(사람들)이 생략됐다. 사람들이 \"관련된\" 쪽이라 p.p."],["giving","","","전치사
