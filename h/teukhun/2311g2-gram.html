<title>어법특훈 · 23년 11월 고2</title>

<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;

  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}

.stamps{display:flex;gap:10px}

.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>

 주어 자리가 비었으니 목적격은 안 되고, 사람도 아님.","whose(~의, 소유격): 바로 뒤에 꾸밀 명사가 와야 하는데 can(~할 수 있다)이 와서 안 됨."],"point":"관계대명사 which (콤마 뒤)","en":"In art, when there’s something challenging, which can also be uncomfortable,","ko":"예술에서 무언가 도전적인 것이 있을 때, 그리고 그것은 또한 불편할 수도 있는데,","hl":["something challenging","which"],"khl":["무언가 도전적인 것","그것은"],"blocks":[{"t":"p","h":"콤마는 that(~하는)의 출입 금지 표지판","x":["콤마(,) 뒤에서 앞말을 덧붙여 설명하는 관계대명사는 which(그리고 그것은)다.","that(~하는)은 콤마 뒤에 올 수 없다.","여기선 something challenging(도전적인 것)에 \"그런데 그건 불편할 수도 있다\"를 덧붙인다.","그래서 콤마 다음 which(그리고 그것은)가 맞다."]},{"t":"pair","h":"쉬운 예시","x":[["I have a dog, which is very cute.","나는 개가 한 마리 있는데, 그 개는 정말 귀엽다. (콤마 뒤 which(그리고 그것은))"],["This is the book that I bought.","이것은 내가 산 책이다. (콤마 없이 that(~하는))"]]}],"post":["콤마(,) 뒤 관계대명사는 which(그리고 그것은), that(~하는)은 출입 금지"]},{"slots":[["be","being","a","조동사 can(~할 수 있다) 뒤는 무조건 동사원형. being(~인 것)은 못 온다."],["says","","","주어 Anjan Chatterjee(앤잔 채터지)가 한 사람이고 문장의 진짜 동사라 says(말한다)."],["uncomfortable","","","be(~이다) 뒤 보어 자리라 형용사 uncomfortable(불편한)이 맞다."],["that","","","명사 ideas and concepts(생각과 개념들) 뒤, 주어가 빠진 문장을 이끄는 관계대명사 that(~하는)."],["gave","","","she(그녀)의 진짜 동사라 과거형 gave(주었다)."]],"opts":["to be","been","is","be"],"or":["to be(~이 되는 것): can(~할 수 있다) 뒤에 to를 붙일 수 없음.","been(~였던, be의 과거분사형): can(~할 수 있다) 바로 뒤에 과거분사는 못 옴.","is(~이다, 현재형): 조동사 뒤에 현재형 동사는 못 옴.","be(~이다, ~이 되다): 조동사 can(~할 수 있다) 뒤라 동사원형이 맞음."],"point":"조동사 + 동사원형","en":"The arts can be more than just sugar on the tongue,","ko":"예술은 그저 혀 위의 설탕 이상의 것이 될 수 있다.","hl":["can be"],"khl":["될 수 있다"],"blocks":[{"t":"p","h":"조동사는 원형만 데리고 다닌다","x":["can(~할 수 있다), will(~할 것이다), must(~해야 한다)는 조동사다.","조동사 뒤에는 옷을 안 갈아입은 동사원형이 온다.","be동사의 원형은 be(~이다)다.","being(~인 것), is(~이다), been(~였던)은 모두 탈락."]},{"t":"p","h":"혀 위의 설탕이란?","x":["혀 위의 설탕은 달콤하지만 금방 녹아 없어진다.","예술이 그저 달콤한 즐거움으로 끝나지 않는다는 말이다.","불편함을 주면서까지 우리를 바꿀 수 있다는 게 이 글의 핵심이다."]},{"t":"pair","h":"쉬운 예시","x":[["You can be a good friend.","너는 좋은 친구가 될 수 있다. (can be = ~이 될 수 있다)"],["She will be here soon.","그녀는 곧 여기에 올 것이다. (will be = ~에 있을 것이다)"]]}],"post":["조동사 can(~할 수 있다) + 동사원형 be(~이 되다)"]},{"slots":[["challenging","","","something(무언가)이 우리를 힘겹게 \"하는\" 쪽이라 -ing."],["offers","","","주어 this discomfort(이 불편함)가 단수라 offers(준다)."],["painted","","","When(~할 때) 뒤 문장의 진짜 동사라 과거형 painted(그렸다)."],["caused","causing","a","고통은 전쟁이 일으킨 결과, 즉 일으켜지는 쪽이다. 뒤에 by(~에 의해)까지 있으니 p.p.가 맞다."],["struggling","","","사람들이 직접 씨름하는 쪽이라 -ing."]],"opts":["cause","caused","causes","to cause"],"or":["cause(일으키다): 동사원형이라 명사 suffering(고통)을 뒤에서 꾸밀 수 없음.","caused(일으켜진, 과거분사): 고통은 전쟁에 의해 일으켜지는 쪽이고 뒤에 by(~에 의해)가 있어 맞음.","causes(일으키다, 3인칭 단수형): 접속사 없이 동사가 또 생기고, 목적어 없이 by(~에 의해)가 바로 와서 안 됨.","to cause(일으킬): 고통이 무언가를 일으킨다는 능동이 되는데 목적어 없이 by(~에 의해)가 와서 안 됨."],"point":"능동 v-ing vs. 수동 p.p.","en":"he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War.","ko":"그는 가슴 아프고 잔인한 전쟁의 본질을 포착했고, 스페인 내전으로 인한 보편적인 고통을 생각해 볼 방법을 세상에 주었다.","hl":["the universal suffering caused by"],"khl":["스페인 내전으로 인한"],"blocks":[{"t":"p","h":"by(~에 의해)는 수동의 지문","x":["the universal suffering(보편적인 고통)이 무언가를 일으키나? 아니다.","고통은 전쟁 때문에 생겨난 결과다.","당하는 쪽을 뒤에서 꾸밀 땐 p.p.(과거분사)를 쓴다.","뒤의 by the Spanish Civil War(스페인 내전에 의해)가 결정적 증거다."]},{"t":"pair","h":"쉬운 예시","x":[["I like the cake made by my mom.","나는 엄마가 만든 케이크를 좋아한다. (케이크는 만들어지는 쪽 → made(만들어진))"],["Look at the boy making a cake.","케이크를 만드는 소년을 봐. (소년이 직접 만드는 쪽 → making(만드는))"]]},{"t":"tap","h":"확인 질문","q":"Picasso(피카소)가 Guernica(게르니카)로 보여 준 고통은 무엇 때문에 생겼나?","a":["스페인 내전 때문이다.","전쟁이 고통을 일으켰고, 고통은 일으켜진 쪽이라 caused(일으켜진)."]}],"post":["고통은 일으켜지는 쪽: suffering caused by(~에 의해 일으켜진 고통)"]},{"slots":[["says","","","따옴표 밖 문장의 진짜 동사라 says(말한다)."],["willing","","","be동사 뒤 형용사 보어 willing(기꺼이 ~하는)."],["become","","","주어 The arts(예술)가 복수라 become(~이 되다)."],["offered","offering","a","he captured(그는 포착했다) ..., and offered(그리고 주었다). 과거형 동사끼리 짝이다."],["offering","","","while(~하면서) 뒤에 주어가 없으니 분사 offering(보여 주는)."]],"opts":["offer","to offer","offered","having offered"],"or":["offer(제공하다): 주어 he(그)와 수가 안 맞고, 1937년 과거 이야기라 시제도 틀림.","to offer(제공하는 것): and(그리고) 앞은 동사 captured(포착했다)인데 뒤만 to부정사라 짝이 안 맞음.","offered(제공했다, 과거형): and(그리고) 앞 captured(포착했다)와 같은 과거형 동사라 맞음.","having offered(제공하고 나서): -ing형이라 동사 captured(포착했다)와 and(그리고)로 짝을 이룰 수 없음."],"point":"병렬구조","en":"he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering","ko":"그는 가슴 아프고 잔인한 전쟁의 본질을 포착했고, 보편적인 고통을 생각해 볼 방법을 세상에 주었다.","hl":["captured","offered"],"khl":["포착했고","주었다"],"blocks":[{"t":"p","h":"and(그리고) 양쪽 접시 맞추기","x":["and(그리고)는 같은 모양끼리만 잇는다.","왼쪽 접시: he captured(그는 포착했다), 과거형 동사.","오른쪽 접시: offered(주었다), 과거형 동사.","offering(주는 것)을 올리면 동사와 -ing가 짝이 되어 저울이 기운다.","1937년 일이니 시제도 둘 다 과거."]},{"t":"pair","h":"쉬운 예시","x":[["He cooked dinner and washed the dishes.","그는 저녁을 요리하고 설거지를 했다. (cooked and washed = 요리했고 설거지했다)"],["I opened the window and looked outside.","나는 창문을 열고 밖을 내다봤다. (opened and looked = 열었고 내다봤다)"]]}],"post":["captured and offered(포착했고 주었다): and(그리고) 앞뒤 과거형 동사"]}],"quiz":[{"s":"My sister, as you know, ___ tennis very well.","o":["plays","play"],"a":0,"ko":"내 여동생은, 너도 알다시피, 테니스를 아주 잘 친다.","why":"끼어든 as you know(너도 알다시피)를 빼면 주인은 My sister(내 여동생), 단수.","wy":"play(치다): 주어 My sister(내 여동생)가 단수라 s를 붙여야 함."},{"s":"I have a cat, ___ sleeps all day.","o":["which","that"],"a":0,"ko":"나는 고양이가 한 마리 있는데, 그 고양이는 하루 종일 잔다.","why":"콤마 뒤 덧붙이는 설명은 which(그리고 그것은).","wy":"that(~하는): 콤마 뒤에는 관계대명사 that을 쓸 수 없음."},{"s":"You can ___ a great singer.","o":["being","be"],"a":1,"ko":"너는 훌륭한 가수가 될 수 있다.","why":"조동사 can(~할 수 있다) 뒤는 동사원형.","wy":"being(~인 것): 조동사 can(~할 수 있다) 뒤에 -ing는 못 옴."},{"s":"This is a picture ___ by my brother.","o":["painted","painting"],"a":0,"ko":"이것은 내 남동생이 그린 그림이다.","why":"그림은 그려지는 쪽이고, 뒤에 by(~에 의해)도 있음.","wy":"painting(그리는): 그림이 직접 그리는 쪽이 되어 뜻이 안 맞음."},{"s":"She cleaned her room and ___ a movie.","o":["watching","watched"],"a":1,"ko":"그녀는 방을 청소하고 영화를 봤다.","why":"cleaned(청소했다) and watched(봤다). 과거형 동사끼리.","wy":"watching(보는 것): -ing라 동사 cleaned(청소했다)와 and(그리고)로 짝을 이룰 수 없음."}]},{"items":[{"slots":[["says","saying","a","주어는 Anjan Chatterjee(앤잔 채터지). 문장에 진짜 동사가 하나는 있어야 하니 says(말한다)."],["there","","","something(무언가)은 단수라 there’s(~이 있다)."],["engage","","","willing to(기꺼이 ~하는) 뒤 동사원형 engage(마주하다)."],["are","","","선행사 ideas and concepts(생각과 개념들)가 복수라 are(~이다)."],["painted","","","When(~할 때) 뒤 문장의 진짜 동사, 과거형 painted(그렸다)."]],"opts":["say","to say","says","having said"],"or":["say(말하다): 주어가 한 사람(3인칭 단수)이라 s가 필요함.","to say(말하는 것): to부정사는 동사 자리에 못 와서 문장에 동사가 없어짐.","says(말하다, 3인칭 단수형): 주어 Anjan Chatterjee(앤잔 채터지)가 한 사람이고 문장의 진짜 동사라 맞음.","having said(말하고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"“The arts can be more than just sugar on the tongue,” Anjan Chatterjee, a professor at the University of Pennsylvania, says.","ko":"“예술은 그저 혀 위의 설탕 이상의 것이 될 수 있다.”라고 펜실베이니아 대학교 교수인 앤잔 채터지는 말한다.","hl":["Anjan Chatterjee","says"],"khl":["앤잔 채터지는","말한다"],"blocks":[{"t":"p","h":"따옴표 문장의 뼈대","x":["따옴표 안은 그가 한 말이다.","따옴표 밖이 진짜 문장이다: 앤잔 채터지가 말한다.","a professor at the University of Pennsylvania(펜실베이니아 대학교의 교수)는 이름 옆에 붙은 꼬리표일 뿐.","그러면 남는 동사 자리는 says(말한다) 하나.","saying(말하는 것)을 쓰면 문장에 동사가 하나도 없다."]},{"t":"pair","h":"쉬운 예시","x":[["“I’m hungry,” Tom says.","“배고파.”라고 Tom(톰)이 말한다. (진짜 동사 says(말한다))"],["My uncle, a doctor, lives in Seoul.","의사인 우리 삼촌은 서울에 산다. (꼬리표 a doctor(의사) 빼고 lives(산다))"]]}],"post":["따옴표 밖 진짜 동사: 이름, 꼬리표, says(말한다)"]},{"slots":[["be","","","조동사 can(~할 수 있다) 뒤 동사원형 be(~이 되다)."],["which","","","콤마 뒤 덧붙이는 관계대명사 which(그리고 그것은)."],["engage","engaging","a","be willing to(기꺼이 ~하다)의 to는 to부정사의 to. 뒤에는 동사원형 engage(마주하다)."],["become","","","주어 The arts(예술)가 복수라 become(~이 되다)."],["offered","","","captured(포착했다)와 and(그리고)로 나란한 과거형 offered(주었다)."]],"opts":["engaged","engages","engagement","engage"],"or":["engaged(참여했다, 과거·과거분사형): to부정사의 to 뒤에 과거형이나 과거분사는 못 옴.","engages(참여하다, 3인칭 단수형): to 뒤에 s 붙은 동사는 못 옴.","engagement(참여): 명사라 to부정사의 to 뒤 동사 자리에 dvertisements and explanations, he could not persuade his shoppers {to_use|to use} the wheeled carts. Men were {reluctant|reluctant} because they thought they would {appear|appear} {weak|weak} if they pushed such carts instead of {carrying|carrying} their shopping. Women wouldn’t touch them because the carts {reminded|reminded} them of baby carriages. It was only a few elderly shoppers {who|who} {used|used} them. That made the carts even less {attractive|attractive} to the majority of the shoppers. Then Goldman hit upon an idea. He {hired|hired} several models, men and women, of different ages and {asked|asked} them {to_wheel|to wheel} the carts in the store and shop. A young woman employee {standing|standing} near the entrance told the regular shoppers, ‘Look, everyone {is|is} using the carts. Why don’t you?’ That was the turning point. A few shills disguised as regular shoppers easily accomplished {what|what} logic, explanations, and advertisements failed to do. Within a few weeks shoppers readily accepted those carts.","fn":["*shill: 바람잡이"],"mean":{"introduced":"도입했다(introduce의 과거형·과거분사형)","introducing":"도입하는 것, 도입하는(introduce의 -ing형)","introduce":"도입하다(동사원형)","to introduce":"도입하는 것(introduce의 to부정사)","having introduced":"도입하고 나서(introduce의 완료 -ing형)","easy":"쉬운(형용사)","easily":"쉽게(부사)","eases":"덜어 주다(ease의 3인칭 단수 현재형)","to ease":"덜어 주는 것(ease의 to부정사)","easing":"덜어 주는(ease의 -ing형)","getting":"~하게 되는 것(get의 -ing형, 동명사)","get":"~하게 되다(동사원형)","got":"~하게 되었다(get의 과거형)","to get":"~하게 되는 것(get의 to부정사)","gets":"~하게 되다(get의 3인칭 단수 현재형)","seeking":"구하는 것(seek의 -ing형, 동명사)","that":"~라는 것(접속사) / ~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","which":"어느 것, ~하는(의문사·관계대명사)","whose":"~의, 누구의(소유격 관계대명사·의문사)","whom":"~을, 누구를(목적격 관계대명사·의문사)","where":"~하는 곳(관계부사)","who":"~하는(주격 관계대명사)","to use":"사용하도록, 사용하는 것(use의 to부정사)","use":"사용하다(동사원형)","uses":"사용하다(use의 3인칭 단수 현재형)","to using":"사용하는 것으로(전치사 to + 동명사)","have used":"사용해 왔다(use의 현재완료형)","reluctant":"꺼리는(형용사)","appear":"~처럼 보이다(동사원형)", (~을, 누구를): 뒤 문장에 목적어가 빠져야 하는데 빠진 자리가 없음."],"point":"that vs. what","en":"But Goldman discovered that in spite of his repeated advertisements and explanations, he could not persuade his shoppers to use the wheeled carts.","ko":"하지만 골드먼은 반복된 광고와 설명에도 불구하고 쇼핑객들이 바퀴 달린 카트를 쓰도록 설득할 수 없다는 것을 알게 되었다.","hl":["discovered that"],"khl":["없다는 것을 알게 되었다"],"blocks":[{"t":"p","h":"뒤 문장 빈칸 검사","x":["what(~하는 것)은 뒤 문장에 빈자리가 있을 때 쓴다.","that(~라는 것)은 뒤 문장이 빠진 것 없이 완전할 때 쓴다.","in spite of(~에도 불구하고) 덩어리를 괄호로 묶고 보자.","he could not persuade his shoppers to use the carts(그는 쇼핑객들에게 카트를 쓰라고 설득할 수 없었다).","주어, 동사, 목적어가 다 있다. 그래서 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I know that he is kind.","나는 그가 친절하다는 것을 안다. (뒤 문장 완전 → that(~라는 것))"],["I know what he wants.","나는 그가 원하는 것을 안다. (wants(원하다)의 목적어가 빠짐 → what(~하는 것))"]]}],"post":["discovered that(~라는 것을 알게 되었다) + 완전한 문장"]},{"slots":[["introduced","","","invented(발명했다)와 나란한 과거형 introduced(도입했다)."],["appear","appeared","a","조동사 would(~일 것이다) 뒤에는 동사원형. 과거형 appeared(~처럼 보였다)는 못 온다."],["who","","","사람 shoppers(쇼핑객들) 뒤 주격 관계대명사 who(~하는)."],["attractive","","","made(만들었다) + 목적어 + 형용사 attractive(매력적인)."],["standing","","","직원이 직접 서 있으니 -ing."]],"opts":["appears","appearing","to appear","appear"],"or":["appears(~처럼 보이다, 3인칭 단수형): 조동사 뒤에 s 붙은 동사는 못 옴.","appearing(보이는): 조동사 뒤에 -ing는 못 옴.","to appear(보이는 것): 조동사 would(~일 것이다) 뒤에 to를 붙일 수 없음.","appear(~처럼 보이다): 조동사 would(~일 것이다) 뒤라 동사원형이 맞음."],"point":"조동사 + 동사원형","en":"Men were reluctant because they thought they would appear weak if they pushed such carts instead of carrying their shopping.","ko":"남자들은 쇼핑한 물건을 들고 다니는 대신 그런 카트를 밀면 약해 보일 거라고 생각해서 꺼렸다.","hl":["would appear weak"],"khl":["약해 보일 거라고"],"blocks":[{"t":"p","h":"would(~일 것이다)는 과거형이지만 뒤는 원형","x":["would(~일 것이다)는 will(~할 것이다)의 과거형이다.","과거 이야기라 과거형을 한 번 더 쓰고 싶어진다.","하지만 과거는 would(~일 것이다)가 이미 표시했다.","조동사 뒤는 늘 동사원형: would appear(~처럼 보일 것이다)."]},{"t":"p","h":"appear(~처럼 보이다) 뒤는 형용사","x":["appear weak(약해 보이다). look(~해 보이다)과 같은 무리의 동사다.","그래서 부사 weak .","standing(서 있는): 진짜 동사 told(말했다)가 따로 있고 직원이 직접 서 있는 능동이라 -ing로 꾸미는 게 맞음.","stands(서 있다, 3인칭 단수형): 동사가 둘이 되고, 과거 이야기와 시제도 안 맞음.","has stood(서 있어 왔다): 현재완료도 진짜 동사라 told(말했다)와 동사가 겹침."],"point":"정동사 vs. 준동사","en":"A young woman employee standing near the entrance told the regular shoppers,","ko":"입구 근처에 서 있던 한 젊은 여성 직원이 일반 쇼핑객들에게 말했다.","hl":["standing","told"],"khl":["서 있던","말했다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["주어: A young woman employee(한 젊은 여성 직원).","진짜 동사: told(말했다).","접속사가 없으니 동사는 하나만 있어야 한다.","standing near the entrance(입구 근처에 서 있는)는 직원을 꾸미는 꼬리표다.","stood(서 있었다)를 쓰면 동사가 둘이 되어 문장이 깨진다."]},{"t":"pair","h":"쉬운 예시","x":[["The man standing by the door is my uncle.","문 옆에 서 있는 남자는 우리 삼촌이다. (진짜 동사 is(~이다), standing(서 있는)은 꼬리표)"],["The girl sitting next to me smiled.","내 옆에 앉아 있던 소녀가 미소 지었다. (진짜 동사 smiled(미소 지었다))"]]}],"post":["진짜 동사는 told(말했다) 하나, 꾸밈은 standing(서 있는)"]},{"slots":[["seeking","","","getting(되는 것)과 or(또는)로 나란한 동명사 seeking(구하는 것)."],["reminded","","","because(~ 때문에) 뒤 진짜 동사 reminded(떠올리게 했다)."],["hired","","","He(그)의 진짜 동사 hired(고용했다)."],["is","are","a","everyone(모든 사람)은 \"모두\"라는 뜻이지만 단수 취급한다. 그래서 is(~이다)."],["what","","","accomplished(해냈다)의 목적어이자 failed to do(하지 못했다)의 빈 목적어, what(~하는 것)."]],"opts":["be","being","is","were"],"or":["be(~이다, 원형): 주어 뒤 동사 자리에 동사원형은 못 옴.","being(~인 것): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","is(~이다, 단수형): everyone(모든 사람)은 단수 취급이고 지금 하고 있는 일이라 맞음.","were(~였다, 복수·과거형): everyone(모든 사람)은 단수라 복수형을 쓸 수 없고, 직원이 지금 하는 말이라 시제도 안 맞음."],"point":"주어와 동사의 수일치","en":"Look, everyone is using the carts. Why don’t you?","ko":"보세요, 모든 사람이 카트를 쓰고 있어요. 손님도 써 보시는 게 어때요?","hl":["everyone is using"],"khl":["모든 사람이 카트를 쓰고 있어요"],"blocks":[{"t":"p","h":"every(모든)는 한 명씩 세는 말","x":["everyone(모든 사람) = every(모든) + one(한 사람).","\"한 사람 한 사람 모두\"라는 느낌이라 단수로 본다.","그래서 is(~이다), likes(좋아한다)처럼 단수 동사.","everybody(모든 사람), everything(모든 것), each(각각)도 같은 무리."]},{"t":"pair","h":"쉬운 예시","x":[["Everyone likes pizza.","모든 사람이 피자를 좋아한다. (Everyone(모든 사람) → likes(좋아한다))"],["Everything is ready.","모든 것이 준비됐다. (Everything(모든 것) → is(~이다))"]]},{"t":"tap","h":"확인 질문","q":"Why don’t you(손님은 왜 안 ~하세요)? 뒤에 생략된 말은?","a":["use the carts(카트를 쓰다).","모두가 쓰니 손님도 써 보라는 권유다. 이 한마디가 전환점이 되었다."]}],"post":["everyone(모든 사람)은 단수: everyone is(모든 사람이 ~이다)"]}],"quiz":[{"s":"I think ___ she is right.","o":["that","what"],"a":0,"ko":"나는 그녀가 옳다고 생각한다.","why":"뒤 문장이 완전하니 that(~라는 것).","wy":"what(~하는 것): 뒤 문장에 빠진 자리가 있어야 하는데 she is right(그녀가 옳다)는 완전함."},{"s":"I thought he would ___ late.","o":["came","come"],"a":1,"ko":"나는 그가 늦게 올 거라고 생각했다.","why":"조동사 would(~일 것이다) 뒤는 동사원형.","wy":"came(왔다): 조동사 뒤에 과거형은 못 옴."},{"s":"The boy ___ won the race is my cousin.","o":["who","whom"],"a":0,"ko":"경주에서 이긴 소년은 내 사촌이다.","why":"won(이겼다)의 주어 자리가 비었으니 주격 who(~하는).","wy":"whom(~을): 목적격이라 주어 자리를 채울 수 없음."},{"s":"The boy ___ under the tree is my brother.","o":["sitting","sat"],"a":0,"ko":"나무 아래에 앉아 있는 소년은 내 남동생이다.","why":"진짜 동사는 is(~이다). 소년을 꾸미는 말은 -ing.","wy":"sat(앉았다): 접속사 없이 동사 is(~이다)와 동사가 둘이 됨."},{"s":"Everybody ___ happy today.","o":["are","is"],"a":1,"ko":"오늘은 모두가 행복하다.","why":"everybody(모든 사람)는 단수 취급.","wy":"are(~이다, 복수형): everybody(모든 사람)는 단수라 are를 쓸 수 없음."}]}],"comp":[{"no":"23","slots":[["reluctant","","","were(~였다) 뒤 보어 자리, 형용사 reluctant(꺼리는)."],["carrying","","","전치사 instead of(~ 대신에) 뒤 동명사 carrying(들고 다니는 것)."],["attractive","","","made(만들었다) + the carts(카트를) + 형용사 attractive(매력적인)."],["standing","","","진짜 동사 told(말했다)가 따로 있으니 꾸미는 -ing."],["what","that","a","accomplished(해냈다)의 목적어가 필요하고, 뒤 failed to do(하지 못했다)의 목적어도 빠졌다. 두 일을 한 번에 하는 건 what(~하는 것)."]],"opts":["which","what","whose","where"],"or":["which(~하는): 앞에 꾸밀 명사가 없어서 관계대명사는 못 옴.","what(~하는 것): accomplished(해냈다)의 목적어이면서 뒤 failed to do(하지 못했다)의 빈 목적어를 채워 맞음.","whose(~의): 뒤에 명사 logic(논리)이 오긴 하지만 앞에 꾸밀 명사가 없어서 못 옴.","where(~하는 곳): 앞에 장소 명사도 없고, 뒤 문장에 목적어가 빠져 있어서 못 옴."],"point":"that vs. what","en":"A few shills disguised as regular shoppers easily accomplished what logic, explanations, and advertisements failed to do.","ko":"일반 쇼핑객으로 위장한 몇몇 바람잡이들이 논리와 설명과 광고가 해내지 못한 것을 쉽게 해냈다.","hl":["accomplished what"],"khl":["해내지 못한 것을"],"blocks":[{"t":"p","h":"what(~하는 것)은 1인 2역","x":["what(~하는 것) = the thing which(~하는 것).","앞 문장에서는 accomplished(해냈다)의 목적어 역할.","뒤 문장에서는 failed to do(하지 못했다)의 목적어 역할.","that(~라는 것)은 뒤 문장이 완전할 때만 쓴다. 여기는 do(하다)의 목적어가 비어 있다."]},{"t":"p","h":"이 글의 반전","x":["광고도, 설명도, 논리도 못 한 일이었다.","가짜 손님 몇 명이 카트를 끌자 몇 주 만에 해결됐다.","사람은 남이 하는 걸 보고 따라 한다."]},{"t":"pair","h":"쉬운 예시","x":[["This is what I wanted.","이것이 내가 원했던 것이다. (wanted(원했다)의 목적어가 빠짐 → what(~하는 것))"],["Show me what you have.","네가 가진 것을 보여 줘. (have(가지다)의 목적어가 빠짐 → what(~하는 것))"]]}],"post":["accomplished what(~한 것을 해냈다): 뒤 failed to do(하지 못했다)의 목적어가 빈자리"]},{"no":"23","slots":[["introduced","","","invented(발명했다)와 and(그리고)로 나란한 과거형 introduced(도입했다)."],["appear","","","조동사 would(~일 것이다) 뒤 동사원형 appear(~처럼 보이다)."],["used","","","who(~하는) 뒤 진짜 동사 used(사용했다)."],["asked","asking","a","He hired(그는 고용했다) ... and asked(그리고 요청했다). 과거형 동사끼리 나란히."],["to_wheel","","","ask(요청하다) + 사람 + to wheel(밀도록)."]],"opts":["ask","to ask","having asked","asked"],"or":["ask(요청하다): 주어 He(그)와 수가 안 맞고, 과거 이야기라 시제도 틀림.","to ask(요청하는 것): and(그리고) 앞은 동사 hired(고용했다)인데 뒤만 to부정사라 짝이 안 맞음.","having asked(요청하고 나서): -ing형이라 동사 hired(고용했다)와 and(그리고)로 짝을 이룰 수 없음.","asked(요청했다, 과거형): and(그리고) 앞 hired(고용했다)와 같은 과거형 동사라 맞음."],"point":"병렬구조","en":"He hired several models, men and women, of different ages and asked them to wheel the carts in the store and shop.","ko":"그는 여러 나이대의 남녀 모델 몇 명을 고용했고, 그들에게 가게에서 카트를 밀며 쇼핑하도록 요청했다.","hl":["hired","asked"],"khl":["고용했고","요청했다"],"blocks":[{"t":"p","h":"멀리 떨어진 짝 찾기","x":["hired(고용했다)와 asked(요청했다) 사이에 말이 길게 끼어 있다.","several models(모델 몇 명) ... of different ages(여러 나이대의)는 hired(고용했다)의 목적어다.","and(그리고) 바로 앞 ages(나이대)에 속지 말고 짝 동사를 찾는다.","짝은 hired(고용했다). 그래서 과거형 asked(요청했다)."]},{"t":"pair","h":"쉬운 예시","x":[["She bought a new bag for her sister and gave it to her.","그녀는 여동생을 위해 새 가방을 사서 그녀에게 주었다. (bought and gave = 샀고 주었다)"],["I called my friend from school and asked for help.","나는 학교 친구에게 전화해서 도움을 청했다. (called and asked = 전화했고 청했다)"]]},{"t":"tap","h":"확인 질문","q":"Goldman(골드먼)이 모델들에게 시킨 일은 무엇인가?","a":["가게에서 카트를 밀며 쇼핑하기.","진짜 손님처럼 보이게 해서 남들이 따라 하게 만든 작전이다."]}],"post":["hired(고용했다) ... and asked(요청했다): 멀리 있어도 과거형 짝"]}],"compquiz":[{"s":"I don’t understand ___ you mean.","o":["what","that"],"a":0,"ko":"나는 네가 무슨 뜻으로 말하는지 모르겠다.","why":"mean(뜻하다)의 목적어가 빠졌으니 what(~하는 것).","wy":"that(~라는 것): 뒤 문장이 완전해야 하는데 mean(뜻하다)의 목적어가 비어 있음."},{"s":"She sang a song and ___ all night.","o":["dancing","danced"],"a":1,"ko":"그녀는 노래를 부르고 밤새 춤을 췄다.","why":"sang(불렀다) and danced(췄다). 과거형 동사끼리.","wy":"dancing(춤추는 것): -ing라 동사 sang(불렀다)와 and(그리고)로 짝을 이룰 수 없음."}]},{"id":"2311g2-30","no":"30","title":"어법특훈 · 23년 11월 고2 30번","sub":"기술 발전과 사생활의 개념","tpl":"Technology {changes|changes} how individuals and societies understand the concept of privacy. The fact {that|that} someone {has|has} a new ability to access information or watch the actions of another {does|does} not justify {doing|doing} so. Rather, advances in technology {require|require} citizens and policy makers {to_consider|to consider} how privacy protections should be expanded. For example, when cameras first became {available|available} for commercial and private use, nations and citizens struggled over whether new laws should {be_enacted|be enacted} to protect individuals from {being_photographed|being photographed} without their permission. The reconsideration of privacy {brought|brought} about by this new technology {re_affirmed|re-affirmed} a distinction between private and public spaces. It {was_determined|was determined} by most cultures that people {automatically|automatically} gave consent to being seen ―and thus recorded ―once they {voluntarily|voluntarily} stepped into a public space. Although some people might be {uncomfortable|uncomfortable} with the spread of surveillance cameras, citizens in most cultures {have|have} adjusted to the fact that {giving_up|giving up} the right not to be observed in these circumstances {causes|causes} less harm to the community than {failing|failing} to have surveillance.","fn":["*enact: (법을) 제정하다","*surveillance: 감시"],"mean":{"changes":"바꾼다(change의 3인칭 단수 현재형)","that":"~라는(명사 내용을 설명하는 접속사)","has":"가지고 있다(have의 3인칭 단수 현재형)","does":"하다(do의 3인칭 단수 현재형, not과 함께 부정)","do":"하다(동사원형·복수 주어 현재형)","doing":"하는 것(do의 -ing형, 동명사)","to do":"하는 것, 하기 위해(do의 to부정사)","is":"~이다(be의 현재형, 단수 주어)","done":"된, 한(do의 과거분사형)","require":"요구하다(동사원형·복수 주어 현재형)","requires":"요구하다(require의 3인칭 단수 현재형)","requiring":"요구하는(require의 -ing형)","to require":"요구하는 것(require의 to부정사)","has required":"요구해 왔다(require의 현재완료형, 단수 주어)","to consider":"고려하는 것(consider의 to부정사)","consider":"고려하다(동사원형)","considering":"고려하는(consider의 -ing형)","considers":"고려하다(consider의 3인칭 단수 현재형)","to considering":"고려하는 것으로(전치사 to + 동명사)","available":"이용 가능한(형용사)","be enacted":"제정되다(enact의 수동형)","being photographed":"사진 찍히는 것(photograph의 수동 동명사)","be photographed":"사진 찍히다(photograph의 수동 원형)","photographed":"사진 찍힌(photograph의 과거분사형)","to be photographed":"사진 찍히는 것(photograph의 수동 to부정사)","been photographed":"사진 찍힌(be의 과거분사형 + photograph의 과거분사형, 완료 수동의 일부)","brought":"가져와진, 생겨난(bring의 과거분사형)","bringing":"가져오는(bring의 -ing형)","bring":"가져오다(동사원형)","brings":"가져오다(bring의 3인칭 단수 현재형)","to bring":"가져올, 가져오는 것(bring의 to부정사)","re-affirmed":"재확인했다(re-affirm의 과거형)","re-affirming":"재확인하는(re-affirm의 -ing형)","re-affirm":"재확인하다(동사원형)","to re-affirm":"재확인하는 것(re-affirm의 to부정사)","having re-affirmed":"재확인하고 나서(re-affirm의 완료 -ing형)","was determined":"결정되었다(determine의 과거 수동형)","determined":"결정했다(determine의 과거형) / 결정된(과거분사형)","determining":"결정하는(determine의 -ing형)","to determine":"결정하는 것(determine의 to부정사)","has determined":"결정해 왔다, 결정했다(determine의 현재완료형)","automatically":"자동적으로(부사)","automatic":"자동의(형용사)","automation":"자동화(명사)","automate":"자동화하다(동사원형)","automates":"자동화하다(automate의 3인칭 단수 현재형)","voluntarily":"자발적으로(부사)","uncomfortable":"불편한(형용사)","uncomfortably":"불편하게(부사)","discomfort":"불편함(명사)","comfortably":"편안하게(부사)","comfort":"위로, 편안함(명사) / 위로하다(동사)","have":"~해 왔다(현재완료를 만드는 have, 복수 주어)","giving up":"포기하는 것(give up의 -ing형, 동명사)","give up":"포기하다(동사원형)","gives up":"포기하다(give up의 3인칭 단수 현재형)","gave up":"포기했다(give up의 과거형)","to giving up":"포기하는 것으로(전치사 to + 동명사)","causes":"일으킨다(cause의 3인칭 단수 현재형)","cause":"일으키다(동사원형·복수 주어 현재형)","causing":"일으키는(cause의 -ing형)","to cause":"일으키는 것(cause의 to부정사)","have caused":"일으켜 왔다(cause의 현재완료형, 복수 주어)","failing":"~하지 못하는 것(fail의 -ing형, 동명사)","are":"~이다(be의 현재형, 복수 주어)","be":"~이다, ~이 되다(동사원형)","to be":"~이 되는 것, ~하라고(be의 to부정사)","writing":"쓰는(write의 -ing형)","written":"쓰인(write의 과거분사형)","built":"지었다(build의 과거형) / 지어진(과거분사형)","was built":"지어졌다(build의 과거 수동형)","happy":"기쁜, 행복한(형용사)","happily":"행복하게(부사)","meeting":"마주치는 것(meet의 -ing형, 동명사)","to meet":"마주치는 것(meet의 to부정사)","wear":"입다(동사원형·복수 주어 현재형)","wears":"입다(wear의 3인칭 단수 현재형)","draw":"그리다(동사원형)","drawing":"그리는 것(draw의 -ing형, 동명사)","made":"만들었다(make의 과거형)","making":"만드는(make의 -ing형)","Eat":"먹다(동사원형)","Eating":"먹는 것(eat의 -ing형, 동명사)","quick":"빠른(형용사)","quickly":"빠르게, 재빨리(부사)","make":"만들다(동사원형·복수 주어 현재형)","makes":"만들다(make의 3인칭 단수 현재형)"},"sets":[{"items":[{"slots":[["changes","","","주어 Technology(기술)가 하나라 changes(바꾼다)가 맞다."],["that","","","명사 The fact(사실)의 내용을 풀어 주는 that(~라는)이다. 뒤 문장이 완전하다."],["has","","","that(~라는) 절의 주어 someone(누군가)은 단수라 has(가지고 있다)."],["does","do","a","주어는 The fact(사실) 하나다. 중간의 information(정보), the actions(행동들)는 꼬리일 뿐이라 do(하다)는 틀린다."],["available","","","became(~이 되었다) 뒤 보어 자리라 형용사 available(이용 가능한)이 맞다."]],"opts":["doing","to do","is","does"],"or":["doing(하는 것): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to do(하는 것): to부정사도 동사 자리에 못 와서 주어 The fact(사실) 뒤 동사가 비게 됨.","is(~이다): be동사 뒤에 not justify(정당화하지 않다)처럼 동사원형이 바로 올 수 없음.","does(하다, do의 3인칭 단수형): 주어 The fact(사실)가 단수라 맞고, 뒤의 not justify(정당화하지 않다)와 짝을 이룸."],"point":"수식받는 주어의 수일치","en":"The fact that someone has a new ability to access information or watch the actions of another does not justify doing so.","ko":"누군가가 정보에 접근하거나 다른 사람의 행동을 관찰하는 새로운 능력을 갖추고 있다는 사실은 그렇게 하는 것을 정당화하지 않는다.","hl":["The fact","does not justify"],"khl":["사실은","정당화하지 않는다"],"blocks":[{"t":"p","h":"긴 꼬리 잘라 내기","x":["주인(주어)은 맨 앞의 The fact(사실) 하나다.","that(~라는)부터 another(다른 사람)까지는 그 사실의 내용을 풀어 주는 긴 꼬리다.","꼬리 안의 information(정보), the actions(행동들)에 속으면 안 된다.","주인이 하나니까 does(하다)가 맞다.","do(하다)는 여럿인 주어에 쓴다."]},{"t":"pair","h":"꼬리 떼고 읽어 보기","x":[["The rumor about the two singers is false.","그 두 가수에 대한 소문은 거짓이다. (주인 The rumor(소문) → is(~이다))"],["The news that my friends won makes me happy.","친구들이 이겼다는 소식이 나를 기쁘게 한다. (주인 The news(소식) → makes(만든다))"]]}],"post":["The fact(사실) + 긴 꼬리 + does(하다): 꼬리 떼고 주인 보고 수 결정"]},{"slots":[["doing","","","justify(정당화하다)는 목적어로 -ing를 받는다."],["require","","","주어 advances(발전들)가 복수라 require(요구하다)."],["to_consider","consider","a","require(요구하다) + 사람 + to부정사. to를 빼면 틀린다."],["be_enacted","","","법은 사람이 만드는 것이다. laws(법들)는 만들어지는 쪽이라 수동 be enacted(제정되다)."],["voluntarily","","","동사 stepped(발을 들여놓았다)를 꾸미는 부사다."]],"opts":["considering","considers","to consider","to considering"],"or":["considering(고려하는): require(요구하다)는 목적격보어로 -ing를 받지 않음.","considers(고려하다, 3인칭 단수형): 이미 동사 require(요구하다)가 있어 동사가 겹치고, 목적격보어 자리에도 못 옴.","to consider(고려하는 것): require(요구하다) + 목적어 + to부정사 틀이라 맞음.","to considering(고려하는 것으로): 여기 to는 to부정사의 to라 뒤에 동사원형이 와야 함."],"point":"목적격보어(준동사)","en":"Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded.","ko":"오히려, 기술의 발전은 시민들과 정책 입안자들이 어떻게 사생활 보호가 확장되어야 하는지 고려할 것을 요구한다.","hl":["require citizens and policy makers to consider"],"khl":["고려할 것을 요구한다"],"blocks":[{"t":"p","h":"to가 꼭 붙는 요구 동사","x":["require(요구하다) 뒤에는 사람 + to + 동사원형이 온다.","citizens and policy makers(시민들과 정책 입안자들)가 사람이다.","to consider(고려할 것)가 그 사람들이 할 일이다.","ask(부탁하다), want(원하다), allow(허락하다)도 같은 틀이다.","make(만들다), let(허락하다)처럼 to를 빼는 동사와 헷갈리게 내는 게 함정이다."]},{"t":"pair","h":"to 붙여 말해 보기","x":[["My teacher asked me to read the book.","선생님은 내게 그 책을 읽으라고 하셨다. (asked me to read = 내게 읽으라고 했다)"],["The rule requires students to wear uniforms.","그 규칙은 학생들에게 교복을 입을 것을 요구한다. (requires students to wear = 학생들에게 입으라고 요구한다)"]]}],"post":["require(요구하다) + 사람 + to consider(고려할 것) (to 필수)"]},{"slots":[["available","","","became(~이 되었다) 뒤 형용사 보어다."],["being_photographed","","","전치사 from(~으로부터) 뒤라 동명사, 사람이 찍히는 쪽이라 being photographed(사진 찍히는 것)."],["brought","bringing","a","사생활의 재고는 기술에 의해 생겨난 쪽이다. 뒤에 by(~에 의해)도 있으니 p.p. brought(생겨난)가 맞고 -ing는 틀린다."],["was_determined","","","결정은 문화들에 의해 내려진 것이라 수동이다. by most cultures(대부분의 문화에 의해)가 증거다."],["have","","","주어 citizens(시민들)가 복수라 have adjusted(순응해 왔다)."]],"opts":["bring","brought","brings","to bring"],"or":["bring(가져오다): 동사원형이라 명사를 뒤에서 꾸밀 수 없고, 진짜 동사 re-affirmed(재확인했다)와 겹침.","brought(생겨난, bring의 과거분사형): 사생활 재고가 기술에 의해 생겨난 쪽이고 뒤에 by(~에 의해)가 있어 맞음.","brings(가져오다, 3인칭 단수형): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐.","to bring(가져올): 능동이라 뒤의 by(~에 의해)와 안 맞고, bring about(~을 일으키다)의 목적어도 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces.","ko":"이 새로운 기술이 가져온 사생활에 대한 재고는 사적 및 공적 공간의 구별을 재확인했다.","hl":["brought about by this new technology","re-affirmed"],"khl":["이 새로운 기술이 가져온","재확인했다"],"blocks":[{"t":"p","h":"by(~에 의해)가 보이면 p.p.","x":["bring about(~을 일으키다)은 뒤에 목적어가 필요한 말이다.","그런데 brought about(일으켜진) 뒤에는 목적어 없이 바로 by(~에 의해)가 온다.","목적어가 없고 by(~에 의해)가 있으면 당하는 쪽, 즉 p.p.다.","재고(다시 생각하기)는 카메라 기술이 일으킨 결과물이다."]},{"t":"pair","h":"하는 쪽과 당하는 쪽","x":[["This is a picture painted by my sister.","이것은 내 여동생이 그린 그림이다. (그림은 그려지는 쪽 → painted(그려진))"],["Look at the boy painting a picture.","그림을 그리고 있는 소년을 봐. (소년은 그리는 쪽 → painting(그리는))"]]},{"t":"tap","h":"동사 자리 확인","q":"re-affirmed(재확인했다)는 이 문장에서 무슨 역할일까?","a":["문장의 진짜 동사다.","그래서 brought(생겨난)는 동사가 아니라 앞 명사를 꾸미는 꼬리여야 한다."]}],"post":["목적어 없이 by(~에 의해) → p.p.: brought about by(~에 의해 생겨난)"]},{"slots":[["has","","","that(~라는) 절의 주어 someone(누군가)이 단수라 has(가지고 있다)."],["re_affirmed","","","주어 The reconsideration(재고)의 진짜 동사다. 과거 이야기라 과거형이다."],["was_determined","determined","a","It(가짜 주어)이 결정을 한 게 아니라 결정이 내려진 것이다. 뒤에 by most cultures(대부분의 문화에 의해)가 있으니 수동 was determined(결정되었다)."],["automatically","","","동사 gave(주었다)를 꾸미는 부사다."],["failing","","","than(~보다) 앞의 giving up(포기하는 것)과 짝을 이루는 동명사다."]],"opts":["determining","was determined","to determine","has determined"],"or":["determining(결정하는): -ing는 혼자 동사 자리에 못 와서 It(가짜 주어) 뒤에 동사가 없어짐.","was determined(결정되었다): 결정은 문화들에 의해 내려진 것이고 뒤에 by(~에 의해)가 있어 수동이 맞음.","to determine(결정하는 것): to부정사도 동사 자리에 못 옴.","has determined(결정했다): 능동이라 뒤의 by(~에 의해)와 안 맞고, 과거 이야기와 시제도 어긋남."],"point":"능동태 vs. 수동태","en":"It was determined by most cultures that people automatically gave consent to being seen ―and thus recorded ―once they voluntarily stepped into a public space.","ko":"일단 사람들이 자발적으로 공공장소에 발을 들여놓으면, 보여지고, 따라서 녹화되는 것에 자동적으로 동의하는 것으로 대부분의 문화에서 결정되었다.","hl":["It was determined by most cultures"],"khl":["대부분의 문화에서 결정되었다"],"blocks":[{"t":"p","h":"It(그것)은 자리만 지키는 가짜 주어","x":["It(가짜 주어)은 뜻이 없는 자리 지킴이다.","진짜 내용은 뒤의 that(~라는) 이하다.","공공장소에 들어가면 보이는 것에 동의한 셈이라는 내용이다.","이 내용을 결정한 건 대부분의 문화다.","내용 입장에서는 결정을 당한 것이라 be + p.p.다."]},{"t":"pair","h":"결정되는 쪽 문장","x":[["It was decided that we would leave early.","우리가 일찍 떠나기로 결정되었다. (It was decided = 결정되었다)"],["English is spoken in many countries.","영어는 많은 나라에서 쓰인다. (영어는 말해지는 쪽 → is spoken(쓰인다))"]]}],"post":["by(~에 의해) 있으면 be + p.p.: It was determined by(~에 의해 결정되었다)"]},{"slots":[["to_consider","","","require(요구하다) + 사람 + to부정사다."],["brought","","","기술에 의해 생겨난 쪽이라 p.p.다."],["voluntarily","","","동사 stepped(발을 들여놓았다)를 꾸미는 부사다."],["uncomfortable","uncomfortably","a","be(~이다) 뒤 보어 자리다. 사람의 상태를 말하니 형용사다. 부사는 보어가 될 수 없다."],["causes","","","동명사 주어 giving up(포기하는 것)은 하나로 세서 causes(일으킨다)."]],"opts":["discomfort","comfortably","uncomfortable","comfort"],"or":["discomfort(불편함): 명사라 사람이 불편함 그 자체가 되는 셈이고, 뒤의 with(~에 대해)와도 안 어울림.","comfortably(편안하게): 부사라 be(~이다) 뒤 보어 자리에 못 옴.","uncomfortable(불편한): might be(~일지도 모른다) 뒤 보어 자리라 형용사가 맞음.","comfort(위로, 위로하다): 명사·동사라 be(~이다) 뒤 상태를 말하는 보어로 안 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance.","ko":"일부 사람들은 감시카메라들의 확산을 불편하게 여길지도 모르지만, 대부분의 문화권에 있는 시민들은 이러한 상황에서 관찰되지 않을 권리를 포기하는 것이 감시받지 못하는 것보다 지역사회에 더 적은 해를 끼친다는 사실에 순응해 왔다.","hl":["might be uncomfortable"],"khl":["불편하게 여길지도"],"blocks":[{"t":"p","h":"be(~이다) 뒤는 형용사 방","x":["be(~이다) 뒤에는 주어의 상태를 말하는 말이 온다.","상태를 말하는 건 형용사의 일이다. uncomfortable(불편한).","-ly가 붙은 부사는 동사나 형용사를 꾸미는 일만 한다.","부사는 be(~이다) 뒤에 혼자 서서 상태를 말할 수 없다."]},{"t":"pair","h":"상태 말하기 vs. 동작 꾸미기","x":[["I am happy with my new bag.","나는 새 가방이 마음에 든다. (be동사 뒤 형용사 happy(기쁜))"],["He smiled happily.","그는 행복하게 웃었다. (동사 smiled(웃었다) ← 부사)"]]}],"post":["be(~이다) 뒤 보어는 형용사: might be uncomfortable(불편할지도 모른다)"]}],"quiz":[{"s":"The boxes on the table ___ heavy.","o":["are","is"],"a":0,"ko":"탁자 위의 상자들은 무겁다.","why":"주인은 The boxes(상자들). on the table(탁자 위의)은 꼬리.","wy":"is(~이다): 단수 동사라 복수 주인 The boxes(상자들)와 안 맞음."},{"s":"The teacher asked us ___ quiet.","o":["to be","be"],"a":0,"ko":"선생님은 우리에게 조용히 하라고 하셨다.","why":"ask(부탁하다) + 사람 + to부정사.","wy":"be(~이다): ask(부탁하다)는 to 없이 동사원형을 받는 동사가 아님."},{"s":"I read a book ___ by a famous writer.","o":["writing","written"],"a":1,"ko":"나는 유명한 작가가 쓴 책을 읽었다.","why":"책은 쓰이는 쪽이고 뒤에 by(~에 의해)가 있어 p.p.","wy":"writing(쓰는): 책이 스스로 쓰는 게 아니라 쓰이는 쪽이라 안 맞음."},{"s":"This bridge ___ in 1990.","o":["built","was built"],"a":1,"ko":"이 다리는 1990년에 지어졌다.","why":"다리는 지어지는 쪽이라 be + p.p.","wy":"built(지었다): 능동이라 다리가 직접 무언가를 지었다는 말이 됨."},{"s":"He is ___ with his new phone.","o":["happy","happily"],"a":0,"ko":"그는 새 휴대폰이 마음에 든다.","why":"is(~이다) 뒤 보어 자리라 형용사.","wy":"happily(행복하게): 부사라 is(~이다) 뒤 보어 자리에 못 옴."}]},{"items":[{"slots":[["that","","","The fact(사실 d some {define1|define} it as a miracle. But, as Montaigne has said, “the origin of a miracle is in our ignorance, at the level of our knowledge of nature, and not in nature itself.” Glorious miracles {have|have} been later on discovered to be obedience to the laws of nature or a technological development {that2|that} was not {widely|widely} known at the time. As the German poet, Goethe, phrased it: “Things that are {mysterious|mysterious} {are2|are} not yet miracles.” The miracle {assumes|assumes} the intervention of a “higher power” in {its|its} occurrence that is beyond human capability to grasp. Yet there are {methodical|methodical} and simple ways to “cause a miracle” without divine revelation and inspiration. Instead of {checking|checking} it out, investigating and {finding|finding} the source of the event, we {define2|define} it as a miracle. The miracle, then, is the excuse of those {who|who} {are3|are} too lazy {to_think|to think}.","fn":["*intervention: 개입","*divine revelation: 신의 계시"],"mean":{"that":"~하는(주격 관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","whose":"~의(소유격 관계대명사)","whom":"~을(목적격 관계대명사)","where":"~하는 곳(관계부사)","statistically":"통계적으로(부사)","statistical":"통계적인(형용사)","statistics":"통계, 통계학(명사)","statistician":"통계학자(명사)","statistic":"통계 수치(명사)","seems":"~처럼 보이다(seem의 3인칭 단수 현재형)","seem":"~처럼 보이다(동사원형·복수 주어 현재형)","seeming":"~처럼 보이는(seem의 -ing형)","to seem":"~처럼 보이는 것(seem의 to부정사)","have seemed":"~처럼 보여 왔다(seem의 현재완료형, 복수 주어)","define":"정의하다(동사원형·복수 주어 현재형)","defines":"정의하다(define의 3인칭 단수 현재형)","defining":"정의하는(define의 -ing형)","to define":"정의하는 것(define의 to부정사)","having defined":"정의하고 나서(define의 완료 -ing형)","have":"~해 왔다(현재완료를 만드는 have, 복수 주어)","widely":"널리(부사)","mysterious":"신비한(형용사)","are":"~이다(be의 현재형, 복수 주어)","is":"~이다(be의 현재형, 단수 주어)","being":"~인, ~인 것(be의 -ing형)","to be":"~인 것(be의 to부정사)","was":"~였다(be의 과거형, 단수 주어)","be":"~이다(be동사 원형)","assumes":"가정한다(assume의 3인칭 단수 현재형)","assuming":"가정하는(assume의 -ing형)","assume":"가정하다(동사원형·복수 주어 현재형)","to assume":"가정하는 것(a ed to walk = 너무 피곤해서 못 걷는)"],["The box is too heavy to lift.","그 상자는 너무 무거워서 들 수 없다. (too heavy to lift = 너무 무거워서 못 드는)"]]}],"post":["too(너무) + 형용사 + to + 동사원형: too lazy to think(너무 게을러 생각 못 하는)"]}],"quiz":[{"s":"I have a friend ___ lives in Busan.","o":["what","that"],"a":1,"ko":"나는 부산에 사는 친구가 있다.","why":"앞에 명사 a friend(친구)가 있어 that.","wy":"what(~하는 것): 앞에 명사 a friend(친구)가 있으면 못 옴."},{"s":"A girl who has many books ___ to the library every day.","o":["go","goes"],"a":1,"ko":"책이 많은 한 소녀가 매일 도서관에 간다.","why":"주인은 A girl(한 소녀). who has many books(책이 많은)는 꼬리.","wy":"go(가다): 복수용 동사라 단수 주인 A girl(한 소녀)과 안 맞음."},{"s":"The tree lost ___ leaves.","o":["its","it's"],"a":0,"ko":"그 나무는 잎을 잃었다.","why":"tree(나무)의 소유격 its(그것의).","wy":"it's(그것은 ~이다): it is(그것은 ~이다)의 줄임말이라 명사 앞에 못 옴."},{"s":"Thank you for ___ me.","o":["help","helping"],"a":1,"ko":"도와줘서 고마워.","why":"전치사 for(~에 대해) 뒤는 -ing.","wy":"help(돕다): 전치사 for(~에 대해) 뒤에 동사원형은 못 옴."},{"s":"He is too young ___ a car.","o":["driving","to drive"],"a":1,"ko":"그는 너무 어려서 차를 운전할 수 없다.","why":"too(너무) + 형용사 + to부정사.","wy":"driving(운전하는): too(너무) 짝으로는 to부정사가 와야 함."}]},{"items":[{"slots":[["that1","","","선행사 Coincidence(우연) 뒤, 빈 주어 자리를 채우는 주격 관계대명사 that(~하는)."],["statistically","statistical","a","impossible(불가능한)이라는 형용사를 꾸미는 자리다. 형용사를 꾸미는 건 부사라 statistical(통계적인)은 틀린다."],["seems","","","주어 Coincidence(우연)가 단수라 seems(~처럼 보인다)."],["widely","","","과거분사 known(알려진)을 꾸미는 부사다."],["its","","","가리키는 것은 The miracle(기적), 단수 사물이라 its(그것의)."]],"opts":["statistics","statistician","statistic","statistically"],"or":["statistics(통계, 통계학): 명사라 형용사 impossible(불가능한)을 꾸밀 수 없음.","statistician(통계학자): 사람 명사라 뜻도 자리도 안 맞음.","statistic(통계 수치): 명사라 형용사를 꾸밀 수 없음.","statistically(통계적으로): 형용사 impossible(불가능한)을 꾸미는 부사라 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle.","ko":"통계적으로 불가능한 우연은 우리에게 비이성적인 사건처럼 보이고, 어떤 이들은 그것을 기적으로 정의한다.","hl":["statistically impossible"],"khl":["통계적으로 불가능한"],"blocks":[{"t":"p","h":"형용사를 꾸미는 것도 부사","x":["부사는 동사만 꾸미는 게 아니다.","형용사 impossible(불가능한)을 꾸미는 것도 부사의 일이다.","statistically impossible = 통계적으로 불가능한.","같은 지문의 widely known(널리 알려진)도 부사가 분사를 꾸민다."]},{"t":"pair","h":"형용사 꾸미기 vs. 명사 꾸미기","x":[["The test was really easy.","그 시험은 정말 쉬웠다. (형용사 easy(쉬운) ← 부사 really(정말))"],["It was a real diamond.","그것은 진짜 다이아몬드였다. (명사 diamond(다이아몬드) ← 형용사 real(진짜의))"]]}],"post":["형용사 꾸미면 부사: statistically impossible(통계적으로 불가능한)"]},{"slots":[["define1","","","주어 some(어떤 사람들)이 복수라 define(정의하다)."],["that2","","","선행사 a technological development(기술적 발전)를 꾸미는 관계대명사다."],["mysterious","","","are(~이다) 뒤 보어 자리라 형용사다."],["are2","is","a","주어는 Things(것들), 복수다. that are mysterious(신비한)는 꼬리라 is(~이다)는 틀린다."],["checking","","","전치사 Instead of(~ 대신에) 뒤라 동명사다."]],"opts":["being","to be","are","was"],"or":["being(~인): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to be(~인 것): to부정사도 동사 자리에 못 옴.","are(~이다): 주어 Things(것들)가 복수라 맞음.","was(~였다, 단수형): 단수 주어용이라 복수 Things(것들)와 안 맞음."],"point":"수식받는 주어의 수일치","en":"As the German poet, Goethe, phrased it: “Things that are mysterious are not yet miracles.”","ko":"독일 시인 Goethe가 그것을 표현했듯이, “‘신비한’ 것들은 아직 ‘기적’이 ‘아니다’.”","hl":["Things that are mysterious are not yet miracles"],"khl":["‘신비한’ 것들은"],"blocks":[{"t":"p","h":"be동사가 두 번 나올 때","x":["Things that are mysterious are not yet miracles(신비한 것들은 아직 기적이 아니다).","첫 번째 are(~이다)는 꼬리 안의 동사다.","두 번째 are(~이다)가 Things(것들)의 진짜 동사다.","주인이 여럿이니 둘 다 are(~이다)."]},{"t":"pair","h":"꼬리 속 동사, 진짜 동사","x":[["Students who are late have to wait outside.","늦은 학생들은 밖에서 기다려야 한다. (주인 Students(학생들) → have(~해야 한다))"],["The bag that is on the desk is mine.","책상 위에 있는 가방은 내 것이다. (주인 The bag(가방) → is(~이다))"]]}],"post":["Things(것들) + 꼬리 + are(~이다): 신비하다고 다 기적은 아님"]},{"slots":[["have","","","주어 Glorious miracles(영광스러운 기적들)가 복수라 have(완료의 have)."],["widely","","","과거분사 known(알려진)을 꾸미는 부사다."],["assumes","assuming","a","주어 The miracle(기적) 뒤 진짜 동사 자리다. -ing로 바꾸면 문장에 동사가 없게 된다."],["its","","","The miracle(기적) 하나를 가리키는 소유격이다."],["who","","","사람을 가리키는 those(사람들) 뒤 주격 관계대명사다."]],"opts":["assume","to assume","assumes","having assumed"],"or":["assume(가정하다): 복수 주어용이라 단수 The miracle(기적)과 안 맞음.","to assume(가정하는 것): to부정사는 동사 자리에 못 옴.","assumes(가정한다): 주어 The miracle(기적)이 단수라 s 붙은 진짜 동사가 맞음.","having assumed(가정하고 나서): 완료 -ing형이라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"The miracle assumes the intervention of a “higher power” in its occurrence that is beyond human capability to grasp.","ko":"기적은 그것의 발생에 있어서 인간이 이해할 수 있는 능력 너머의 ‘더 높은 힘’의 개입을 가정한다.","hl":["The miracle assumes"],"khl":["가정한다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["이 문장에서 동사처럼 보이는 것은 assumes(가정한다)와 is(~이다)다.","is(~이다)는 that(~하는) 꼬리 안의 동사다.","그러니 문장의 진짜 동사는 assumes(가정한다) 하나뿐이다.","이것까지 -ing로 바꾸면 주어만 있고 동사가 없는 문장이 된다."]},{"t":"pair","h":"진짜 동사 찾기","x":[["The girl next to me speaks three languages.","내 옆의 소녀는 3개 국어를 한다. (진짜 동사 speaks(말한다))"],["The man reading a newspaper is my uncle.","신문을 읽고 있는 남자는 우리 삼촌이다. (reading(읽는)은 꼬리, is(~이다)가 진짜 동사)"]]},{"t":"tap","h":"내용 확인","q":"기적이라는 말은 무엇을 전제로 할까?","a":["인간이 이해할 수 없는 더 높은 힘이 끼어들었다는 것.","글쓴이는 바로 이 전제를 생각하기 귀찮은 사람의 핑계라고 본다."]}],"post":["주어 The miracle(기적) + 진짜 동사 assumes(가정한다)"]},{"slots":[["are2","","","주어 Things(것들)가 복수라 are(~이다)."],["methodical","","","명사 ways(방법들)를 꾸미는 형용사다."],["checking","","","전치사 Instead of(~ 대신에) 뒤라 동명사다."],["finding","find","a","investigating(조사하는 것)과 and(그리고)로 이어진 짝이다. 앞이 -ing니 뒤도 -ing여야 한다."],["are3","","","선행사 those(사람들)가 복수라 are(~이다)."]],"opts":["found","finding","to find","finds"],"or":["found(찾았다, 찾아진): 과거형·과거분사형이라 동명사 investigating(조사하는 것)과 짝이 안 맞음.","finding(찾는 것): and(그리고) 앞 investigating(조사하는 것)과 같은 동명사라 맞음.","to find(찾는 것): 전치사 of(~의)에 걸리는 자리라 to부정사가 못 오고, 짝도 안 맞음.","finds(찾다, 3인칭 단수형): 동사라 동명사와 짝을 이룰 수 없음."],"point":"병렬구조","en":"Instead of checking it out, investigating and finding the source of the event, we define it as a miracle.","ko":"그것을 확인하는 것, 즉, 그 사건의 근원을 조사하고 찾는 것 대신에, 우리는 그것을 기적으로 정의한다.","hl":["investigating and finding"], ime and forgetting {have|have} degraded the original memory. With reduced information available in memory with {which2|which} to confirm the validity of post-event misinformation, it is less likely {that1|that} this new information will be {rejected|rejected}. Instead, especially when it {fits|fits} the witness’s current thinking and can {be_used|be used} to create a story {that2|that} {makes|makes} sense to him or her, it may be integrated as part of the original experience. This process can be {explicit|explicit} (i.e., the witness knows it is {happening|happening}), but it is often {unconscious|unconscious}. That is, the witness might find {himself|himself or herself} {thinking|thinking} about the event differently without awareness. Over time, the witness may not even know the source of information {that3|that} led to the (new) memory. Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court.","fn":["*encode: (정보를 기억에) 부호화하다, 저장하다","*forensic: 법정의, 법의학의"],"mean":{"encountered":"마주쳐진, 접하게 된(encounter의 과거분사형)","encountering":"마주치는(encounter의 -ing형)","encounter":"마주치다(동사원형)","encounters":"마주치다(encounter의 3인칭 단수 현재형)","had encountered":"마주쳤었다(encounter의 과거완료형)","easily":"쉽게(부사)","easy":"쉬운(형용사)","ease":"완화하다(동사) / 편안함(명사)","eases":"완화하다(ease의 3인칭 단수 현재형)","easier":"더 쉬운(easy의 비교급)","poorly":"형편없이, 불충분하게(부사)","encoded":"부호화된(encode의 과거분사형)","which":"그것, ~하는(관계대명사)","who":"누구, ~하는(사람을 받는 관계대명사)","whose":"~의(소유격 관계대명사)","whom":"~을(목적격 관계대명사, 사람)","where":"~하는 곳(관계부사)","that":"~라는 것(접속사) / ~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","have":"~해 왔다(현재완료를 만드는 have, 복수 주어)","has":"~해 왔다(have의 3인칭 단수형)","having":"~해 온 것, ~하면서(have의 -ing형)","to have":"~하는 것(have의 to부정사)","is":"~이다(be의 현재형, 단수 주어)","rejected":"거부된(reject의 과거분사형)","fits":"맞다, 들어맞다(fit의 3인칭 단수 현재형)","fitting":"맞는(fit의 -ing형)","to fit":"맞는 것(fit의 to부정사)","having fitted":"맞고 나서(fit의 완료 -ing형)","fitness":"적합함, 건강(명사)","be used":"사용되다(use의 수동태)","use":"사용하다(동사원형)","using":"사용하는(use의 -ing형)","uses":"사용하다(use의 3인칭 단수 현재형)","been used":"사용된(be의 과거분사형 been + used)","makes":"만들다(make의 3인칭 단수 현재형, make sense = 이해가 되다)","make":"만들다(동사원형·현재형)","making":"만드는, 만드는 것(make의 -ing형)","to make":"만드는 것(make의 to부정사)","have made":"만들어 왔다(make의 현재완료형, 복수 주어)","explicit":"명시적인, 분명히 드러나는(형용사)","explicitly":"명시적으로(부사)","explicate":"설명하다(동사원형)","explicates":"설명하다(explicate의 3인칭 단수 현재형)","explicitness":"명시성, 분명함(명사)","happening":"일어나고 있는(happen의 -ing형)","happened":"일어났다(happen의 과거형·과거분사형)","happen":"일어나다(동사원형)","happens":"일어나다(happen의 3인칭 단수 현재형)","be happened":"(틀린 형태) 자동사 happen(일어나다)을 수동태로 만든 것","unconscious":"무의식적인(형용사)","himself or herself":"그 자신 또는 그녀 자신(재귀대명사)","thinking":"생각하고 있는(think의 -ing형)","think":"생각하다(동사원형)","thinks":"생각하다(think의 3인칭 단수 현재형)","to thinking":"생각하는 것으로(전치사 to + 동명사)","had thought":"생각했었다(think의 과거완료형)","written":"쓰인(write의 과거분사형)","writing":"쓰는(write의 -ing형)","live":"살다(동사원형·현재형)","lives":"살다(live의 3인칭 단수 현재형)","feels":"느끼다(feel의 3인칭 단수 현재형)","feeling":"느끼는(feel의 -ing형)","clear":"분명한(형용사)","clearly":"분명하게(부사)","used":"사용된(use의 과거분사형)","was happened":"(틀린 형태) 자동사 happen(일어나다)을 수동태로 만든 것","sleeping":"자고 있는(sleep의 -ing형)","sleep":"자다(동사원형)","runs":"달리다(run의 3인칭 단수 현재형)","run":"달리다(동사원형)"},"sets":[{"items":[{"slots":[["encountered","encountering","a","Information(정보)은 사람이 \"마주치는\" 대상이다. 정보가 스스로 뭔가를 마주치는 게 아니라서 -ing는 틀린다."],["easily","","","동사 integrate(통합되다)를 꾸미니까 부사가 맞다."],["which1","","","in which case(그런 경우에는). 앞 내용 전체를 받는 which(그것)다."],["have","","","주어 time and forgetting(시간과 망각)이 둘이라 have(~해 왔다)가 맞다."],["rejected","","","새 정보가 \"거부되는\" 쪽이라 will be rejected(거부될 것이다), 수동태가 맞다."]],"opts":["encounter","encounters","had encountered","encountered"],"or":["encounter(마주치다): 동사원형이라 뒤의 진짜 동사 can influence(영향을 줄 수 있다)와 겹침.","encounters(마주치다, 3인칭 단수형): 접속사 없이 동사가 둘이 되어 문장이 깨짐.","had encountered(마주쳤었다, 과거완료형): 이것도 진짜 동사라 can influence(영향을 줄 수 있다)와 겹침.","encountered(마주쳐진): 정보는 사람이 마주치는 대상이라 뒤에서 꾸미는 p.p.가 맞음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Information encountered after an event can influence subsequent remembering.","ko":"사건 후에 접하게 된 정보는 이후의 기억에 영향을 줄 수 있다.","hl":["Information encountered","can influence"],"khl":["접하게 된 정보는","영향을 줄 수 있다"],"blocks":[{"t":"p","h":"누가 누구를 마주치나","x":["encounter(마주치다)는 \"무엇을\" 마주치는지 목적어가 필요한 동사다.","마주치는 건 사람(목격자)이고, 정보는 마주침을 당하는 쪽이다.","그래서 정보 뒤에 붙는 꼬리는 p.p. encountered(마주쳐진).","encountering(마주치는)이면 정보가 뭔가를 마주치는 셈인데, 뒤에 목적어도 없다."]},{"t":"pair","h":"쉬운 예시","x":[["The window broken by the ball was fixed.","공에 깨진 창문은 수리되었다. (창문이 깨짐을 당함 → broken(깨진))"],["The boy wearing a cap is my brother.","모자를 쓴 소년은 내 동생이다. (소년이 직접 씀 → wearing(쓰고 있는))"]]}],"post":["정보는 마주침을 당하는 쪽: Information encountered(마주쳐진 정보)"]},{"slots":[["poorly","","","p.p. encoded(부호화된)를 꾸미니까 부사가 맞다."],["encoded","","","사건이 \"부호화되는\" 쪽이라 was encoded(부호화되었다), 수동태다."],["have","has","a","주어가 time(시간)과 forgetting(망각) 두 개다. and(그리고)로 묶이면 복수라 has(~해 왔다, 단수형)가 아니라 have(~해 왔다)."],["that1","","","가주어 it(그것) 뒤에서 진짜 주어 문장을 이끄는 that(~라는 것)이다."],["fits","","","접속사 when(~할 때) 뒤 주어 it(그것)의 진짜 동사다. it(그것)이 단수라 fits(맞다)."]],"opts":["having","to have","have","is"],"or":["having(~해 온 것): -ing는 혼자 동사 자리에 못 와서 in which case(그런 경우에는) 뒤 문장에 동사가 없어짐.","to have(~하는 것): to부정사도 동사 자리에 못 와서 문장이 깨짐.","have(~해 왔다): 주어 time and forgetting(시간과 망각)이 둘이라 복수형 현재완료가 맞음.","is(~이다): 단수 동사라 주어 둘과 안 맞고, 뒤의 degraded(저하시켰다)와도 이어지지 않음."],"point":"주어-동사 수일치 (A and B)","en":"the memory is from a distant event, in which case time and forgetting have degraded the original memory.","ko":"그 기억이 오래전 사건의 것이라면, 그런 경우에는 시간과 망각이 원래의 기억을 이미 흐려 놓았다.","hl":["time and forgetting","have degraded"],"khl":["시간과 망각이","흐려 놓았다"],"blocks":[{"t":"p","h":"and(그리고)는 더하기","x":["A and B는 A 하나, B 하나를 더한 것이다.","time(시간) + forgetting(망각) = 두 개.","두 개면 복수, 그래서 have(~해 왔다).","forgetting(망각)이 동사 바로 앞에 붙어 있어도 혼자가 아니다."]},{"t":"pair","h":"쉬운 예시","x":[["My dog and my cat sleep together.","내 개와 고양이는 같이 잔다. (둘이라 sleep(잔다))"],["Reading and writing are important.","읽기와 쓰기는 중요하다. (두 개가 and로 묶여 are(~이다))"]]}],"post":["A and B는 복수: time and forgetting have(시간과 망각이 ~해 왔다)"]},{"slots":[["easily","","","integrate(통합되다)를 꾸미는 부사."],["which2","that","a","전치사 with(~을 가지고) 바로 뒤에는 관계대명사 that이 올 수 없다. with which(그것을 가지고)가 맞다."],["rejected","","","새 정보가 거부\"되는\" 쪽이라 수동태."],["makes","","","선행사 a story(이야기)가 하나라 makes sense(이해가 되다)."],["happening","","","happen(일어나다)은 수동태가 없는 동사라 is happening(일어나고 있다)."]],"opts":["which","who","whose","where"],"or":["which(그것): 사물 information(정보)을 받고, 전치사 with(~을 가지고) 뒤에 올 수 있는 관계대명사라 맞음.","who(누구): 사람을 받는 말이라 information(정보)과 안 맞고, 전치사 바로 뒤에도 못 옴.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 to confirm(확인할)이 와서 안 됨.","where(~하는 곳): 관계부사라 전치사 with(~을 가지고) 뒤에 올 수 없음."],"point":"관계대명사 (전치사 + which)","en":"With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected.","ko":"사건 후에 들어온 잘못된 정보가 맞는지 확인하는 데 쓸 정보가 기억 속에 줄어들어 있으면, 이 새 정보가 거부될 가능성은 더 낮다.","hl":["with which to confirm"],"khl":["확인하는 데 쓸"],"blocks":[{"t":"p","h":"with which(그것을 가지고) 풀어 보기","x":["with which to confirm = 그것을 가지고 확인할.","which(그것)는 앞의 information(정보)을 가리킨다.","\"정보를 가지고 확인한다\"라서 with(~을 가지고)가 앞에 붙었다.","전치사 바로 뒤에는 which(그것)만 되고, that은 못 온다. 시험 단골 함정."]},{"t":"pair","h":"쉬운 예시","x":[["This is the knife with which I cut the bread.","이것은 내가 빵을 자른 칼이다. (with which(그것으로) = 그 칼로)"],["I need a pen with which to write.","나는 쓸 펜이 필요하다. (전치사 뒤라 which, that은 틀림)"]]}],"post":["전치사 + which(그것) 가능, 전치사 + that 불가: with which(그것을 가지고)"]},{"slots":[["which1","","","in which case(그런 경우에는), 앞 내용을 받는 관계대명사."],["that1","","","가주어 it(그것) 뒤 진짜 주어를 이끄는 that(~라는 것)."],["fits","fitting","a","접속사 when(~할 때) 뒤에는 주어 it(그것)과 진짜 동사가 와야 한다. fitting(맞는)은 동사가 아니다."],["explicit","","","be동사 뒤 보어 자리라 형용사 explicit(명시적인)."],["thinking","","","find(발견하다) + 목적어 + -ing: 자신이 ~하고 있는 걸 발견하다."]],"opts":["to fit","having fitted","fits","fitness"],"or":["to fit(맞는 것): to부정사는 동사 자리에 못 와서 when(~할 때) 뒤 문장에 동사가 없어짐.","having fitted(맞고 나서): -ing형이라 동사 자리에 못 오고, and(그리고) 뒤 can be used(사용될 수 있다)와 짝도 안 맞음.","fits(맞다): 접속사 when(~할 때) 뒤 주어 it(그것)이 단수라 3인칭 단수 현재형이 맞음.","fitness(적합함, 건강): 명사라 동사 자리에 못 옴."],"point":"정동사 vs. 준동사","en":"Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience.","ko":"오히려 특히 그것이 목격자의 현재 생각과 맞아떨어지고, 그 사람이 납득할 이야기를 만드는 데 쓰일 수 있을 때, 그것은 원래 경험의 일부로 통합될 수 있다.","hl":["when it fits","can be used"],"khl":["맞아떨어지고","쓰일 수 있을 때"],"blocks":[{"t":"p","h":"접속사는 동사를 부른다","x":["when(~할 때)은 문장과 문장을 잇는 접속사다.","접속사 뒤에는 주어 + 진짜 동사가 한 세트로 온다.","주어 it(그것), 동사 fits(맞다). and(그리고) 뒤 can be used(사용될 수 있다)도 같은 주어의 동사다.","fitting(맞는)을 넣으면 when(~할 때) 뒤에 동사가 하나도 없게 된다."]},{"t":"pair","h":"쉬운 예시","x":[["When he gets home, he eats dinner.","그는 집에 오면 저녁을 먹는다. (접속사 뒤 동사 gets(도착하다))"],["If it rains, we will stay inside.","비가 오면 우리는 안에 있을 것이다. (접속사 뒤 동사 rains(비가 오다))"]]}],"post":["접속사 when(~할 때) + 주어 + 진짜 동사: when it fits(그것이 맞을 때)"]},{"slots":[["encountered","","","정보가 마주쳐지는 쪽이라 p.p."],["be_used","","","이야기를 만드는 데 \"사용되는\" 쪽이라 be used(사용되다)."],["explicit","explicitly","a","be동사 뒤에서 주어 This process(이 과정)를 설명하는 보어 자리다. 부사는 보어가 못 된다."],["unconscious","","","it is(그것은 ~이다) 뒤 보어라 형용사."],["himself","","","주어 the witness(목격자) 자신을 발견하는 것이라 재귀대명사."]],"opts":["explicate","explicit","explicates","explicitness"],"or":["explicate(설명하다): 동사원형이라 can be(~일 수 있다) 뒤 보어 자리에 못 옴.","explicit(명시적인): be동사 뒤 보어 자리이고, but(하지만) 뒤 unconscious(무의식적인)와 짝을 이루는 형용사라 맞음.","explicates(설명하다, 3인칭 단수형): 동사라 be동사 뒤에 또 올 수 없음.","explicitness(명시성): 명사라 \"과정이 명시성 그 자체다\"가 되어 말이 안 되고, 짝인 unconscious(무의식적인)와도 모양이 안 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious.","ko":"이 과정은 명시적일 수도 있지만(즉, 목격자가 그 일  who plays the piano.","나는 피아노를 치는 소년을 안다. (a boy(소년) 하나 → plays(친다))"],["I know girls who play soccer.","나는 축구를 하는 소녀들을 안다. (girls(소녀들) 여럿 → play(한다))"]]}],"post":["that(~하는) 뒤 동사는 선행사에: a story that makes(이해가 되는 이야기)"]}],"compquiz":[{"s":"I read a book ___ made me cry.","o":["what","that"],"a":1,"ko":"나는 나를 울게 만든 책을 읽었다.","why":"앞에 명사 a book(책)이 있으니 that(~하는).","wy":"what(~하는 것): 앞에 명사 a book(책)이 있어서 못 옴."},{"s":"He has a dog that ___ very fast.","o":["runs","run"],"a":0,"ko":"그는 아주 빨리 달리는 개를 키운다.","why":"선행사 a dog(개)가 하나라 runs(달린다).","wy":"run(달리다): 선행사 a dog(개)가 단수라 s가 필요함."}]},{"id":"2311g2-33","no":"33","title":"어법특훈 · 23년 11월 고2 33번","sub":"상관관계에 이유를 붙이려 할수록 흐려지는 통찰","tpl":"Correlations {are1|are} powerful because the insights they offer {are2|are} {relatively|relatively} clear. These insights are often {covered|covered} up when we bring causality back into the picture. For instance, a used-car dealer {supplied|supplied} data to statisticians {to_predict|to predict} which of the vehicles {available|available} for purchase at an auction were likely to have problems. A correlation analysis showed {that|that} orange-colored cars were {far|far} less likely to have defects. Even as we read this, we already think about {why|why} it might be so: Are orange-colored car owners likely to be car enthusiasts and {take|take} better care of their vehicles? Or, {is|is} it because orange-colored cars are more {noticeable|noticeable} on the road and therefore less likely to be in accidents, so they’re in better condition when {resold|resold}? Quickly we are {caught|caught} in a web of {competing|competing} causal hypotheses. But our attempts to illuminate things this way only {make|make} them cloudier. Correlations {exist|exist}; we can show them {mathematically|mathematically}. We can’t easily do the same for causal links. So we would do well to hold off from {trying|trying} to explain the reason behind the correlations.","fn":["*causality: 인과 관계","*hypothesis: 가설(복수형 hypoth 가설들이 서로 경쟁하는 쪽이라 competing(경쟁하는)."],["trying","","","전치사 from(~로부터) 뒤 동명사."]],"opts":["competing","compete","competes","competition"],"or":["competing(경쟁하는): 가설들이 스스로 서로 경쟁하는 쪽이라 명사 앞에서 꾸미는 -ing가 맞음.","compete(경쟁하다): 동사원형이라 a web of(~의 거미줄) 뒤 꾸밈 자리에 못 옴.","competes(경쟁하다, 3인칭 단수형): 동사라 명사 hypotheses(가설들) 앞을 꾸밀 수 없음.","competition(경쟁): 명사라 형용사 causal(인과의) 앞에 놓일 수 없음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Quickly we are caught in a web of competing causal hypotheses.","ko":"우리는 금세 서로 경쟁하는 인과 가설들의 거미줄에 걸려든다.","hl":["competing causal hypotheses"],"khl":["서로 경쟁하는 인과 가설들"],"blocks":[{"t":"p","h":"p.p.가 없는 동사","x":["p.p.가 명사를 꾸미면 \"~당한, ~된\"이라는 뜻이다.","compete(경쟁하다)는 누구를 경쟁시키는 동사가 아니라 그냥 \"경쟁한다\".","당할 수가 없으니 competed(경쟁된)라는 꾸밈말은 성립하지 않는다.","가설들이 서로 경쟁하는 중 → competing(경쟁하는)."]},{"t":"pair","h":"쉬운 예시","x":[["Look at the rising sun.","떠오르는 해를 봐. (해가 스스로 떠오름 → rising(떠오르는))"],["The barking dog woke me up.","짖는 개가 나를 깨웠다. (개가 직접 짖음 → barking(짖는))"]]}],"post":["가설들이 서로 경쟁: competing hypotheses(경쟁하는 가설들)"]},{"slots":[["to_predict","","","\"예측하기 위해\" 목적의 to부정사."],["is","","","주어 it(그것)이 단수라 is(~이다)."],["make","","","주어 our attempts(우리의 시도들)가 복수라 make(만들다)."],["exist","","","주어 Correlations(상관관계들)가 복수라 exist(존재하다)."],["trying","try","a","from(~로부터)은 전치사다. 전치사 뒤에 동사를 쓰려면 -ing. hold off(미루다) from -ing = ~하는 것을 미루다."]],"opts":["to try","tried","tries","trying"],"or":["to try(시도하는 것): 전치사 from(~로부터) 뒤에 to부정사는 못 옴.","tried(시도했다, 과거·과거분사형): 전치사 뒤에 과거형은 못 오고, 우리가 직접 시도하는 것이라 p.p.도 안 됨.","tries(시도하다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음.","trying(시도하는 것, 동명사): 전치사 from(~로부터) 뒤라 동명사가 맞음."],"point":"전치사 + 동명사","en":"So we would do well to hold off from trying to explain the reason behind the correlations.","ko":"그러므로 상관관계 뒤에 숨은 이유를 설명하려 드는 것은 미루는 편이 낫다.","hl":["hold off from trying"],"khl":["설명하려 드는 것은 미루는"],"blocks":[{"t":"p","h":"from(~로부터)은 전치사","x":["from(~로부터), for(~을 위해), without(~ 없이), by(~함으로써)는 전치사다.","전치사 뒤에는 명사가 와야 한다.","동사를 명사처럼 쓰려면 -ing 옷을 입힌다. try(시도하다) → trying(시도하는 것).","hold off r no longer than two years.","ko":"그것이 자연이 쥐를 평균적으로 2년보다 더 오래 살지 못하게 만든 이유이다.","hl":["That is why"],"khl":["이유이다"],"blocks":[{"t":"p","h":"which(~하는)는 빈자리를 찾는다","x":["which(~하는)는 관계대명사다. 뒤 문장에 주어나 목적어 빈자리가 있어야 한다.","nature has made mice(자연이 쥐를 만들었다)는 주어, 동사, 목적어가 다 있다.","빈자리가 없으니 which(~하는)는 못 온다.","That is why(그것이 ~한 이유이다) + 완전한 문장.","앞 문장의 결과를 말할 때 쓰는 단골 짝이다."]},{"t":"pair","h":"쉬운 예시","x":[["I was sick. That is why I stayed home.","나는 아팠다. 그래서 집에 있었다. (That is why(그래서 ~이다) + 완전한 문장)"],["This is the book which I bought.","이것이 내가 산 책이다. (bought(샀다) 뒤 목적어 빈자리 → which)"]]}],"post":["That is why(그것이 ~한 이유이다) + 완전한 문장 (which(~하는) 불가)"]},{"slots":[["at_which","","","it ages at the rate(그것이 그 속도로 노화한다)에서 전치사 at(~로)이 관계대명사와 함께 앞으로 나온 형태."],["ages","","","at which(그 속도로) 뒤 절의 동사. 주어 it(그것)이 단수라 ages(노화한다)."],["is_determined","determines","a","수명은 무엇을 결정하는 쪽이 아니라 결정되는 쪽이다. 뒤에 by(~에 의해)도 있어 수동태여야 한다."],["that","","","the average time(평균 시간)을 뒤에서 꾸미는 관계사 that(~하는)."],["explains","","","주어 That(그것)의 진짜 동사. 단수라 explains(설명한다)."]],"opts":["determining","to determine","has determined","is determined"],"or":["determining(결정하는): -ing형은 동사 자리에 못 와서 주어 The average life span(평균 수명) 뒤 동사가 비게 됨.","to determine(결정하는 것): to부정사도 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","has determined(결정했다, 현재완료형): 능동이라 뒤에 목적어가 필요한데 목적어 없이 by(~에 의해)가 와서 안 맞음.","is determined(결정된다): 수명이 평균 시간에 의해 결정되는 쪽이고, 뒤에 by(~에 의해)가 있어 수동태가 맞음."],"point":"능동태 vs. 수동태","en":"The average life span of an animal species, or the rate at which it ages, is determined by the average time that this animal species can survive in the wild.","ko":"동물 종의 평균 수명, 또는 그것이 노화하는 속도는 이 동물 종이 야생에서 생존할 수 있는 평균 시간에 의해 결정된다.","hl":["is determined by"],"khl":["의해 결정된다"],"blocks":[{"t":"p","h":"누가 정하고 누가 정해지나","x":["determine(결정하다)은 뒤에 \"무엇을\"이 꼭 필요한 동사다.","이 문장에서 평균 수명은 무엇을 결정하는 쪽이 아니다.","야생에서 버티는 시간이 수명을 정한다. 수명은 정해지는 쪽이다.","정해지는 쪽이 주어면 be + p.p. 수동태.","뒤의 by(~에 의해)가 결정적 힌트다."]},{"t":"pair","h":"쉬운 예시","x":[["The window was broken by him.","그 창문은 그에 의해 깨졌 ding"],"or":["find(찾다): able(~할 수 있는) 바로 뒤에 to 없이 동사원형이 오면 안 됨.","found(찾았다, find의 과거·과거분사형): able(~할 수 있는) 뒤에 과거형이 올 수 없음.","to find(찾는 것): be able to(~할 수 있다) 뒤에 동사원형이 오는 짝이라 맞음.","to finding(찾는 것으로): be able to(~할 수 있다)의 to는 전치사가 아니라서 뒤에 -ing가 못 옴."],"point":"to부정사 (be able to)","en":"Thanks to their wings, bats can also cover longer distances and are better able to find food.","ko":"그들의 날개 덕분에, 박쥐들은 또한 더 긴 거리를 이동할 수 있고 먹이를 더 잘 찾을 수 있다.","hl":["are better able to find"],"khl":["더 잘 찾을 수 있다"],"blocks":[{"t":"p","h":"able(~할 수 있는)은 to와 한 몸","x":["be able to(~할 수 있다) + 동사원형.","can(~할 수 있다)과 뜻이 같은 짝이다.","중간에 better(더 잘)가 끼어도 짝은 그대로다.","are better able to find(더 잘 찾을 수 있다)."]},{"t":"pair","h":"쉬운 예시","x":[["I am able to swim.","나는 수영할 수 있다. (able to(~할 수 있는) + 원형 swim(수영하다))"],["She is better able to sing now.","그녀는 이제 노래를 더 잘할 수 있다. (better(더 잘)가 끼어도 to sing(노래하는 것))"]]}],"post":["be able to(~할 수 있다) + 동사원형: able to find(찾을 수 있는)"]}],"quiz":[{"s":"The color of the leaves ___ green.","o":["are","is"],"a":1,"ko":"그 나뭇잎들의 색깔은 초록색이다.","why":"주인은 The color(색깔). of the leaves(나뭇잎들의)는 꼬리표.","wy":"are(~이다): 복수 동사라 단수 주인 The color(색깔)와 안 맞음."},{"s":"I lost my key. That is ___ I was late.","o":["why","which"],"a":0,"ko":"나는 열쇠를 잃어버렸다. 그래서 나는 늦었다.","why":"뒤 문장 I was late(나는 늦었다)가 완전하니 why(~하는 이유).","wy":"which(~하는): 뒤에 빈자리가 있어야 하는데 문장이 완전함."},{"s":"This song ___ by many people.","o":["loves","is loved"],"a":1,"ko":"이 노래는 많은 사람들에게 사랑받는다.","why":"노래는 사랑받는 쪽 + by(~에 의해) → 수동태.","wy":"loves(사랑한다): 능동이라 뒤에 목적어가 필요한데 by(~에 의해)가 옴."},{"s":"She passed the test, ___ made her mom happy.","o":["which","what"],"a":0,"ko":"그녀는 시험에 합격했고, 그것이 엄마를 기쁘게 했다.","why":"콤마 뒤에서 앞 문장 전체를 받으니 which(그리고 그것은).","wy":"what(~하는 것): 앞에 받을 말이 있고 콤마 바로 뒤에도 못 옴."},{"s":"He is able ___ the piano.","o":["play","to play"],"a":1,"ko":"그는 피아노를 칠 수 있다.","why":"be able to(~할 수 있다) + 동사원형.","wy":"play(치다): able(~할 수 있는) 뒤에는 to가 꼭 필요함."}]},{"items":[{"slots":[["why","","","That is(그것이 ~이다) 뒤에서 \"~하는 이유\"를 이끄는 관계부사 why(~하는 이유). 뒤 문장이 완전하다."],["at_which","which","a","ages(노화하다)는 목적어를 받지 않는다. it ages at the rate(그 속도로 노화한다)의 at(~로)이 꼭 함께 와야 한다."],["ages","","","at which(그 속도로) 뒤 절의 동사. 주어 it(그것)이 단수라 ages(노화한다)."],["is_determined","","","수명은 평균 시간에 의해 \"결정되는\" 쪽이라 수동태 is determined(결정된다)."],["that","","","the average time(평균 시간)을 뒤에서 꾸미는 관계사 that(~하는)."]],"opts":["what","whose","at what","at which"],"or":["what(~하는 것): 앞에 명사 the rate(속도)가 있어서 못 오고, 뒤 문장 it ages(그것이 노화한다)도 완전함.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 대명사 it(그것)이 와서 안 됨.","at what(무엇으로): what(~하는 것)은 앞에 명사 the rate(속도)가 있으면 쓸 수 없음.","at which(그 속도로): it ages at the rate(그것이 그 속도로 노화한다)의 at(~로)이 관계대명사 앞으로 나온 형태라 맞음."],"point":"전치사 + 관계대명사","en":"The average life span of an animal species, or the rate at which it ages, is determined by the average time that this animal species can survive in the wild.","ko":"동물 종의 평균 수명, 또는 그것이 노화하는 속도는 이 동물 종이 야생에서 생존할 수 있는 평균 시간에 의해 결정된다.","hl":["the rate at which it ages"],"khl":["그것이 노화하는 속도"],"blocks":[{"t":"p","h":"빠진 조각 찾기","x":["두 문장으로 나눠 보자.","the rate(속도) + it ages at the rate(그것이 그 속도로 노화한다).","뒤 문장의 the rate(속도)가 which(그것)로 바뀌어 앞으로 나간다.","이때 at(~로)도 같이 데리고 나간다. → at which(그 속도로)","age(나이 들다)는 뒤에 목적어를 받지 않는 동사다.","그래서 at(~로)을 빼면 연결 고리가 끊긴다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the house in which I live.","이것이 내가 사는 집이다. (I live in the house(나는 그 집에 산다) → in which)"],["This is the house which I bought.","이것이 내가 산 집이다. (bought(샀다) 뒤 목적어 빈자리 → which)"]]},{"t":"tap","h":"확인 질문","q":"the rate which it ages(그것이 노화하는 속도)는 왜 안 될까?","a":["ages(노화한다)는 목적어를 받지 않는다.","which(그것)가 들어갈 빈자리가 없으니 at(~로)이 꼭 필요하다."]}],"post":["the rate at which(그 속도로) ← it ages at the rate(그 속도로 노화하다)"]},{"slots":[["that","","","the average time(평균 시간)을 뒤에서 꾸미는 관계사 that(~하는)."],["explains","explaining","a","주어 That(그것) 뒤에 진짜 동사가 있어야 한다. -ing형은 동사 자리에 못 온다."],["which","","","콤마 뒤에서 앞 문장 bats can fly(박쥐는 날 수 있다) 전체를 받는 관계대명사 which(그리고 그것은)."],["their","","","wings(날개)의 주인은 bats(박쥐들), 복수라 their(그들의)."],["are","",""," llence, according to Aristotle, {is_res|is} the result of habit and repetition, {though|though} modern science would also suggest that it may {have|have} an innate, genetic component. This {means|means} that moral excellence will be {broadly|broadly} set early in our lives, {which|which} is why the question of how early {to_teach|to teach} it {is_q|is} so important. Freud suggested that we don’t {change|change} our personality much after age five or thereabouts, but as in many other things, Freud {was|was} wrong. Recent psychological research {shows|shows} {that|that} personality traits {stabilize|stabilize} around age thirty in both men and women and regardless of ethnicity as the human brain {continues|continues} to develop, both {neuro|neuroanatomically} and in terms of cognitive skills, until the mid-twenties. The advantage of this new understanding {is_adv|is} {that2|that} we can be a bit more {optimistic|optimistic} than Aristotle and Freud about {being|being} able {to_teach2|to teach} moral excellence.","fn":["*innate: 선천적인","*neuroanatomically: 신경해부학적으로"],"mean":{"is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","be":"~이다(be동사의 원형)","being":"~인 것(be의 -ing형, 동명사)","were":"~였다(be의 과거형, 복수 주어)","was":"~였다(be의 과거형, 단수 주어)","been":"~였던(be의 과거분사형)","though":"비록 ~이지만(접속사)","despite":"~에도 불구하고(전치사)","Despite":"~에도 불구하고(전치사)","Though":"비록 ~이지만(접속사)","in spite of":"~에도 불구하고(전치사 덩어리)","because of":"~ 때문에(전치사 덩어리)","regardless of":"~에 상관없이(전치사 덩어리)","have":"가지다(동사원형)","means":"의미하다(mean의 3인칭 단수 현재형)","meaning":"의미하는 것, 의미하는(mean의 -ing형)","mean":"의미하다(동사원형)","to mean":"의미하는 것(mean의 to부정사)","having meant":"의미하고 나서(mean의 완료 -ing형)","broadly":"대체로, 폭넓게(부사)","broad":"넓은(형용사)","breadth":"폭, 너비(명사)","broaden":"넓히다(동사원형)","broadening":"넓히는 것, 넓히는(broaden의 -ing형)","which":"~하는, 그리고 그것은(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","who":"~하는 사람(주격 관계대명사)","whom":"~을(목적격 관계대명사)","whose":"~의(소유격 관계대명사)","that":"~라는 것(접속사)","to teach":"가르치는 것(teach의 to부정사)","teach":"가르치다(동사원형)","teach ng to Aristotle, is the result of habit and repetition, though modern science would also suggest that it may have an innate, genetic component.","ko":"비록 현대 과학은 그것이 선천적인, 즉 유전적인 요소를 가지고 있을 수도 있다고 또한 주장하겠지만, 아리스토텔레스에 따르면 도덕적 우수성은 습관과 반복의 결과물이다.","hl":["though modern science would also suggest"],"khl":["비록 현대 과학은"],"blocks":[{"t":"p","h":"뒤에 동사가 있나 보기","x":["though(비록 ~이지만)와 despite(~에도 불구하고)는 뜻이 비슷하다.","차이는 뒤에 오는 모양이다.","though(비록 ~이지만) + 주어 + 동사: 문장이 통째로 온다.","despite(~에도 불구하고) + 명사: 명사 덩어리만 온다.","여기는 뒤에 would suggest(주장할 것이다)라는 동사가 있다. 그래서 though(비록 ~이지만)."]},{"t":"pair","h":"쉬운 예시","x":[["Though it was cold, we went out.","비록 추웠지만 우리는 나갔다. (Though(비록 ~이지만) + 주어 it(그것) + 동사 was(~였다))"],["Despite the cold, we went out.","추위에도 불구하고 우리는 나갔다. (Despite(~에도 불구하고) + 명사 the cold(추위))"]]}],"post":["though(비록 ~이지만) + 주어 + 동사 / despite(~에도 불구하고) + 명사"]},{"slots":[["broadly","","","과거분사 set(정해진)을 꾸미니까 부사 broadly(대체로)."],["which","what","a","콤마 뒤에서 앞 문장 내용을 받는 자리. what(~하는 것)은 받을 말이 있으면 못 온다."],["to_teach","","","how early(얼마나 일찍) + to부정사 = 얼마나 일찍 ~해야 할지. to teach(가르치는 것)."],["is_q","","","주어는 the question(질문), 단수. of how early to teach it(얼마나 일찍 가르칠지에 대한)은 꼬리표라 is(~이다)."],["change","","","don’t(~하지 않는다) 뒤라 동사원형 change(바꾸다)."]],"opts":["which","who","whom","whose"],"or":["which(그리고 그것은): 콤마 뒤에서 앞 문장 전체를 받아 is why(~하는 이유이다)의 주어가 되는 관계대명사라 맞음.","who(~하는 사람): 사람을 받는 말인데 여기서 받는 것은 사람이 아니라 앞 문장 내용임.","whom(~을): 목적어 빈자리를 받는 말인데 여기는 주어 자리가 비어 있음.","whose(~의): 뒤에 명사가 와야 하는데 동사 is(~이다)가 바로 옴."],"point":"관계대명사 which vs. what","en":"This means that moral excellence will be broadly set early in our lives, which is why the question of how early to teach it is so important.","ko":"이것은 도덕적 우수성이 우리 삶에 있어서 이른 시기에 광범위하게 설정될 것임을 의미하며, 이것이 얼마나 일찍 그것을 가르쳐야 할지에 대한 질문이 매우 중요한 이유이다.","hl":["which is why"],"khl":["이것이"],"blocks":[{"t":"p","h":"콤마 뒤 what(~하는 것)은 출입 금지","x":["which(그리고 그것은)는 앞 문장 \"도덕성은 어릴 때 대체로 정해진다\"를 통째로 받는다.","그 내용이 질문이 중요한 이유라는 뜻이다.","what(~하는 것)은 받을 말 없이 혼자 쓰는 말이다.","앞에 받을 내용이 있고 콤마까지 찍혔으면 what(~하는 것)은 못 온다."]},{"t":"pair","h":"쉬운 예시","x":[["It rained all day, which was sad.","하루 종일 비가 왔고, 그것은 슬펐다. (앞 문장 전체 ← which)"],["Tell me what you saw.","네가 본 것을 말해 줘. (받을 말 없음 → what)"]]}],"post":["콤마 + which is why(그리고 그것이 ~한 이유다) (, what(~하는 것) 불가)"]},{"slots":[["is_q","","","주어는 the question(질문), 단수. of how early to teach it(얼마나 일찍 가르칠지에 대한)은 꼬리표라 is(~이다)."],["change","changing","a","don’t(~하지 않는다) 뒤에는 동사원형만 온다. -ing는 못 온다."],["was","","","주어 Freud(프로이트) 한 사람, 과거 이야기라 was(~였다)."],["shows","","","주어 Recent psychological research(최근 심리 연구)는 셀 수 없는 명사라 단수 취급, shows(보여 준다)."],["that","","","shows(보여 준다)의 목적어가 되는 절을 이끄는 접속사 that(~라는 것). 뒤 문장이 완전하다."]],"opts":["changes","changed","to change","change"],"or":["changes(바꾸다, 3인칭 단수형): don’t(~하지 않는다) 뒤에는 s를 붙이지 않음.","changed(바꿨다, change의 과거·과거분사형): don’t(~하지 않는다) 뒤에 과거형은 못 옴.","to change(바꾸는 것): don’t(~하지 않는다) 바로 뒤에 to부정사는 못 옴.","change(바꾸다): don’t(~하지 않는다) 뒤라 동사원형이 맞음."],"point":"조동사 + 동사원형","en":"Freud suggested that we don’t change our personality much after age five or thereabouts, but as in many other things, Freud was wrong.","ko":"프로이트는 우리가 5세 혹은 그 무렵 이후에는 우리의 성격을 많이 바꾸지 않는다고 제시했지만, 다른 많은 것들에서처럼 프로이트는 틀렸다.","hl":["don’t change"],"khl":["바꾸지 않는다고"],"blocks":[{"t":"p","h":"do(하다)는 짐꾼이다","x":["don’t(~하지 않는다)의 do(하다)가 시제와 부정을 대신 짊어진다.","그래서 뒤의 동사는 짐을 다 내려놓은 원형이 된다.","don’t change(바꾸지 않는다).","-ing나 s를 붙이면 짐을 두 번 지는 셈이다."]},{"t":"pair","h":"쉬운 예시","x":[["I don’t like milk.","나는 우유를 좋아하지 않는다. (don’t(~하지 않는다) + 원형 like(좋아하다))"],["She doesn’t eat meat.","그녀는 고기를 먹지 않는다. (doesn’t(~하지 않는다) + 원형 eat(먹다))"]]}],"post":["don’t(~하지 않는다) + 동사원형 change(바꾸다)"]},{"slots":[["shows","","","주어 Recent psychological research(최근 심리 연구)는 셀 수 없는 명사라 단수 취급, shows(보여 준다)."],["that","","","shows(보여 준다)의 목적어가 되는 절을 이끄는 접속사 that(~라는 것). 뒤 문장이 완전하다."],["stabilize","stabilizing","a","that(~라는 것) 뒤 절에도 진짜 동사가 있어야 한다. -ing형은 동사 자리에 못 온다."],["continues","","","as(~함에 따라) 뒤 절의 동사. 주어 the human brain(인간의 뇌)이 단수라 continues(계속하다)."],["neuro","", n Aristotle and Freud about being able to teach moral excellence.","ko":"이 새로운 이해의 이점은 우리가 아리스토텔레스나 프로이트보다 도덕적 우수성을 가르칠 수 있다는 점에서 조금 더 낙관적일 수 있다는 것이다.","hl":["being able to teach"],"khl":["가르칠 수 있다는"],"blocks":[{"t":"p","h":"able(~할 수 있는) 다음 순서","x":["being able(~할 수 있는 것) 뒤에도 짝은 그대로 to + 동사원형이다.","앞에서 being(~인 것)이 -ing였다고 뒤까지 -ing로 바꾸면 안 된다.","-ing는 전치사 about(~에 대해) 바로 뒤 한 번이면 끝.","able to teach(가르칠 수 있는)."]},{"t":"pair","h":"쉬운 예시","x":[["I want to be able to swim.","나는 수영할 수 있게 되고 싶다. (able to(~할 수 있는) + 원형 swim(수영하다))"],["She is happy about being able to drive.","그녀는 운전할 수 있게 되어 기쁘다. (being able to(~할 수 있는 것) + 원형 drive(운전하다))"]]}],"post":["being able to(~할 수 있는 것) + 원형 teach(가르치다) (-ing 불가)"],"no":"35"}],"compquiz":[{"s":"Thank you for ___ here.","o":["be","being"],"a":1,"ko":"여기 와 줘서 고마워.","why":"전치사 for(~에 대해) 뒤는 -ing.","wy":"be(~이다): 동사원형이라 전치사 for(~에 대해) 뒤에 못 옴."},{"s":"She is able ___ fast.","o":["running","to run"],"a":1,"ko":"그녀는 빨리 달릴 수 있다.","why":"be able to(~할 수 있다) + 동사원형.","wy":"running(달리는 것): able(~할 수 있는) 뒤에는 to + 동사원형이 와야 함."}]},{"id":"2311g2-36","no":"36","title":"어법특훈 · 23년 11월 고2 36번","sub":"더위 때문에 작아지는 동물들","tpl":"The size of a species {is|is} not {accidental|accidental}. It’s a fine-tuned interaction between a species and the world it {inhabits|inhabits}. Over large periods of time, size fluctuations {have|have} often signalled {significant|significant} changes in the environment. Generally speaking, over the last five hundred million years, the trend has been towards animals {getting|getting} larger. It’s particularly notable in marine animals, {whose|whose} average body size {has_increased|has increased} 150-fold in this time. But we are beginning to see changes in this trend. Scientists have discovered {that|that} many animals are shrinking. Around the world, species in every category {have_been_found|have been found} to be getting smaller, and one major cause {appears|appears} to be the heat. Animals {living|living} in the Italian Alps, for example, {have_seen|have seen} temperatures {rise|rise} by three to four degrees Celsius since the 1980s. To avoid {overheating|overheating}, chamois goats now {spend|spend} more of their days {resting|resting} rather than {searching|searching} for food, and as a result, in just a few decades, the new generations of chamois {are|are} 25 percent {smaller|smaller}.","fn":["*fluctuation: 변동","*chamois: 샤무아(알프스 산양의 일종)"],"mean":{"is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","be":"~이다(be동사의 원형)","being":"~인 것, ~인(be의 -ing형)","to be":"~인 것, ~이기 위해(be의 to부정사)","accidental":"우연한(형용사)","inhabits":"~에 살다(inhabit의 3인칭 단수 현재형)","have":"~해 왔다(현재완료의 have, 복수 주어)","significant":"상당한, 중요한(형용사)","significantly":"상당히(부사)","signify":"의미하다(동사원형)","signifies":"의미하다(signify의 3인칭 단수 현재형)","insignificantly":"사소하게(부사)","getting":"~하게 되는 것(get의 -ing형, 동명사)","get":"~하게 되다(동사원형)","gets":"~하게 되다(get의 3인칭 단수 현재형)","got":"~하게 되었다(get의 과거형)","to get":"~하게 되는 것(get의 to부정사)","whose":"~의(소유격 관계대명사)","which":"~하는(사물을 받는 관계대명사)","who":"~하는(사람을 받는 주격 관계대명사)","whom":"~을(사람을 받는 목적격 관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","that":"~라는 것(명사절을 이끄는 접속사)","has increased":"증가해 왔다(increase의 현재완료형, 단수 주어)","have been found":"~인 것으로 밝혀져 왔다(find의 현재완료 수동형)","have found":"발견해 왔다(find의 현재완료형, 능동)","has found":"발견해 왔다(find의 현재완료형, 단수 주어)","have been finding":"발견해 오고 있다(find의 현재완료 진행형)","finding":"발견하는, 발견하는 것(find의 -ing형)","found":"발견된(find의 과거분사형) / 발견했다(과거형)","appears":"~인 것 같다(appear의 3인칭 단수 현재형)","living":"살고 있는(live의 -ing형, 능동 분사)","lived":"살았다(live의 과거형·과거분사형)","live":"살다(동사원형)","lives":"살다(live의 3인칭 단수 현재형)","being lived":"살아지는(live의 수동 -ing형, 쓸 수 없는 형태)","have seen":"보아 왔다(see의 현재완료형, 복수 주어)","has seen":"보아 왔다(see의 현재완료형, 단수 주어)","has been seen":"보여 왔다(see의 현재완료 수동형, 단수 주어)","having seen":"보고 나서(see의 완료 -ing형)","to see":"보는 것, 보기 위해(see의 to부정사)","rise":"오르다(동사원형)","rises":"오르다(rise의 3인칭 단수 현재형)","rose":"올랐다(rise의 과거형)","risen":"오른(rise의 과거분사형)","to rise":"오르는 것(rise의 to부정사)","overheating":"과열되는 것(ov ","whom","what","whose"],"or":["who(~하는): 주격이라 뒤에 주어가 빠져야 하는데 뒤 문장은 주어가 다 있음.","whom(~을): 목적격이라 뒤에 목적어가 빠져야 하는데 뒤 문장은 완전함.","what(~하는 것): 앞에 명사 marine animals(해양 동물들)가 있으면 못 옴.","whose(~의): marine animals(해양 동물들)의 몸 크기를 나타내고, 뒤에 명사 average body size(평균 몸 크기)가 바로 와서 맞음."],"point":"관계대명사(소유격 whose)","en":"It’s particularly notable in marine animals, whose average body size has increased 150-fold in this time.","ko":"그것은 특히 해양 동물들에게서 두드러지는데, 그들의 평균 몸 크기는 이 시기에 150배로 증가해 왔다.","hl":["whose average body size","marine animals"],"khl":["그들의 평균 몸 크기는","해양 동물들"],"blocks":[{"t":"p","h":"whose(~의)는 '그들의'로 바꿔 읽기","x":["whose(~의) 자리에 their(그들의)를 넣어 보자.","their average body size has increased(그들의 평균 몸 크기는 증가해 왔다). 말이 된다.","which(~하는)는 뒤에 주어나 목적어 한 자리가 비어야 한다.","그런데 뒤 문장은 주어 size(크기), 동사 has increased(증가해 왔다)가 다 있다.","빈자리 없음 + 바로 뒤 명사 = whose(~의)."]},{"t":"pair","h":"쉬운 예시","x":[["I have a friend whose father is a doctor.","나는 아버지가 의사인 친구가 있다. (친구의 아버지 = whose father(그의 아버지))"],["I have a friend who lives in Seoul.","나는 서울에 사는 친구가 있다. (who 뒤에 주어 빈자리)"]]}],"post":["whose(~의) + 명사 + 완전한 문장: whose average body size(그들의 평균 몸 크기)"]},{"slots":[["has_increased","","","주어 average body size(평균 몸 크기)가 단수."],["that","what","a","discovered(발견했다) 뒤 many animals are shrinking(많은 동물이 작아지고 있다)은 빠진 것 없는 완전한 문장이다. 완전한 문장 앞은 that(~라는 것)."],["have_been_found","","","종들이 \"발견되는\" 쪽이라 수동태가 맞다."],["appears","","","주어 one major cause(한 가지 주요 원인)가 단수라 appears(~인 것 같다)."],["living","","","동물들이 직접 \"살고 있는\" 것이라 능동 -ing가 맞다."]],"opts":["whom","that","whose","who"],"or":["whom(~을): 앞에 사람 명사도 없고 뒤에 목적어 빈자리도 없어서 안 됨.","that(~라는 것): discovered(발견했다)의 목적어 명사절을 이끌고, 뒤가 완전한 문장이라 맞음.","whose(~의): 앞에 꾸밀 명사가 없고, 동사 discovered(발견했다) 뒤에 바로 소유격 관계사가 올 수 없음.","who(~하는): 앞에 사람 명사가 없고, 뒤에 주어 many animals(많은 동물)가 이미 있어 빈자리가 없음."],"point":"that vs. what","en":"Scientists have discovered that many animals are shrinking.","ko":"과학자들은 많은 동물이 작아지고 있다는 것을 발견해 왔다.","hl":["that many animals are shrinking"],"khl":["많은 동물이 작아지고 있다는 것을"
