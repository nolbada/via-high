<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}

.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}

.pairs li .k{color:var(--sub);font-size:.95rem;display:block}

.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}

.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}

.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}

mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}

.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}

제 행동)"]]},{"t":"p","h":"At the same time(동시에)이 만드는 모순","x":["바뀌길 바라면서, 정작 바꾸려고 하지는 않는다.","이 모순이 글쓴이가 처음 꺼낸 문제다.","preserve(보존하다)를 넣으면 \"현재 상황을 지키려는 일은 거의 안 한다\"가 된다.","바뀌길 바라면서 정작 바꾸지 않는다는 모순이 사라지고, 글의 출발점이 무너진다."]},{"t":"p","h":"함정","x":["magically(마법처럼)는 miraculously(기적적으로)와 뜻이 같아서 그대로 둔다."]}],"post":["alter(바꾸다) ↔ preserve(보존하다)","바라기만 하고 바꾸지는 않는 모순"]},{"slots":[["mysterious"],["similar","distinct","a"],["quickly"],["rearranging"],["switch_up"]],"opts":["similar","unique","unrelated","contrasting"],"or":["similar(비슷한): 자리만 바꾸는 갑판 의자 비유, 같은 화면을 다시 띄우는 새로고침 비유와 맞아떨어짐.","unique(독특한): 독특한 직함을 찾는다면 같은 일을 되풀이한다는 타이타닉 비유가 성립하지 않음.","unrelated(관련 없는): 전혀 다른 일을 찾는 건 글쓴이가 권하는 '완전히 바꾸기' 쪽이라 비판 대상이 안 됨.","contrasting(대조적인): 정반대 직함을 찾는 건 새로고침처럼 같은 화면을 다시 띄우는 행동이 아님."],"om":["비슷한","독특한","관련 없는","대조적인"],"en":"They head to job boards and search for roles with a similar job title, hoping that the universe will sprinkle a bit of magic on their career if they just hit the refresh button in a different department or company.","ko":"그들은 구인 게시판으로 가서 비슷한 직함의 일자리를 찾는다. 다른 부서나 회사에서 새로고침 버튼만 누르면 우주가 자기 경력에 마법을 조금 뿌려 줄 거라고 바라면서.","hl":["similar job title","hit the refresh button"],"khl":["비슷한 직함","새로고침 버튼만 누르면"],"blocks":[{"t":"p","h":"타이타닉 비유로 확인","x":["It’s like rearranging deck chairs on the Titanic. (그것은 타이타닉호의 갑판 의자를 다시 배치하는 것과 같다.)","가라앉는 배에서 의자 자리만 바꿔 봐야 배는 그대로 가라앉는다.","직함이 비슷한 일로 옮기는 것도 같다.","자리만 바뀌고 하는 일은 그대로.","distinct(뚜렷이 다른) 직함을 찾았다면 이 비유가 성립하지 않는다."]},{"t":"p","h":"새로고침 버튼","x":["새로고침은 같은 화면을 다시 띄우는 버튼이다.","내용이 바뀌지 않는 화면을 다시 띄우는 것, 그게 비슷한 직함 찾기다."]}],"post":["similar(비슷한) ↔ distinct(뚜렷이 다른)","비슷한 직함 찾기 = 갑판 의자 재배치"]},{"slots":[["unsatisfied","dissatisfied","s"],["perfect","ideal","s"],["hoping"],["disenchanted","enthusiastic","a"],["completely"]],"opts":["disenchanted","energized","hopeful","delighted"],"or":["disenchanted(환멸을 느낀): '전과 똑같이'라서 처음의 불만족 상태로 돌아간다는 뜻이 되어 맞음.","energized(활기를 얻은): 전에는 일이 싫었으니 '전과 똑같이 활기찬'은 앞뒤가 안 맞음.","hopeful(희망에 찬): 기적을 바랐지만 결국 다시 실망한다는 흐름과 반대임."," 느낀","s"],["ancient","고대의","n"],["eager","열렬한","a"],["disappointed","실망한","s"],["fluent","유창한","n"]]}]},{"items":[{"slots":[["repeating"],["similar","comparable","s"],["hoping","doubting","a"],["quickly"],["completely"]],"opts":["hoping","fearing","denying","worrying"],"or":["hoping(바라면서): 우주가 마법을 뿌려 주길 기대하며 구인 게시판을 뒤지는 행동과 같은 방향임.","fearing(두려워하면서): 마법이 일어날까 두려워한다면 새로고침 버튼을 누를 이유가 없음.","denying(부인하면서): 마법을 부인하는 사람은 기적을 기다리는 이 글의 주인공이 아님.","worrying(걱정하면서): 좋은 일이 생길까 걱정한다는 말이 되어 기대에 찬 행동과 안 맞음."],"om":["바라면서","두려워하면서","부인하면서","걱정하면서"],"en":"They head to job boards and search for roles with a similar job title, hoping that the universe will sprinkle a bit of magic on their career if they just hit the refresh button in a different department or company.","ko":"그들은 구인 게시판으로 가서 비슷한 직함의 일자리를 찾는다. 다른 부서나 회사에서 새로고침 버튼만 누르면 우주가 자기 경력에 마법을 조금 뿌려 줄 거라고 바라면서.","hl":["hoping","sprinkle a bit of magic"],"khl":["바라면서","마법을 조금 뿌려 줄"],"blocks":[{"t":"p","h":"글쓴이의 말투","x":["우주가 마법을 뿌려 준다. 새로고침 버튼만 누르면.","글쓴이는 이 기대를 진지하게 보지 않는다.","살짝 비꼬는 말투다.","비꼬려면 그 사람들이 정말로 그걸 바라고(hoping = 바라면서) 있어야 한다.","doubting(의심하다)을 넣으면 비꼴 대상이 사라진다."]},{"t":"tap","h":"질문 하나","q":"마법을 의심하는 사람이라면 구인 게시판에 갈까?","a":["가지 않는다.","비슷한 직함을 뒤지는 건 그 기적을 믿고 바라기 때문이다.","행동(search = 찾다)과 마음(hoping = 바라다)이 같은 방향이어야 한다."]},{"t":"p","h":"함정","x":["comparable(비슷한)은 similar(비슷한)와 같은 뜻이라 고치지 않는다."]}],"post":["hope(바라다) ↔ doubt(의심하다)","새로고침 = 마법을 바라는 행동"]},{"slots":[["perfect","flawed","a"],["meaningfully"],["hoping"],["rearranging"],["same"]],"opts":["perfect","modest","average","routine"],"or":["perfect(완벽한): someday(언젠가), miraculously(기적적으로)와 함께 막연한 꿈을 그려 맞음.","modest(수수한): 기적을 기다리면서 수수한 직업을 꿈꾼다는 건 어색함.","average(평균의): 평범한 일자리는 기적이 필요 없어 miraculously(기적적으로)와 안 어울림.","routine(일상적인): 늘 하는 일 같은 직업은 꿈의 대상이 아니라 지금 싫어하는 직장 쪽임."],"om":["완벽한","수수한","평균의","일상적인"],"en":"Among unsatisfied professionals, there’s a repeating theme—the belief that someday (a mysterious day in the future) things will miraculously change and they’ll stumble into the perfect job or career.","ko":"불만족한 직장인들 사이에는 반복되는 주제가 하나 있다. 언젠가(미래의 알 수 없는 어느 날) 상황이 기적처럼 바뀌고 완벽한 직업이나 경력을 우연히 만나게 될 거라는 믿음이다.","hl":["the perfect job or career","miraculously"],"khl":["완벽한 직업이나 경력","기적처럼"],"blocks":[{"t":"pair","h":"꿈을 그리는 단어 묶음","x":[["someday","언젠가"],["a mysterious day in the future","미래의 알 수 없는 어느 날"],["miraculously","기적적으로"],["stumble into","우연히 만나다"],["the perfect job","완벽한 직업"]]},{"t":"p","h":"묶음에서 튀는 단어","x":["다섯 표현이 모두 막연한 꿈을 그린다.","flawed(결함이 있는)만 꿈이 아니라 현실의 실망이다.","기적을 기다리면서 결함 있는 일자리를 꿈꾸는 사람은 없다."]}],"post":["perfect(완벽한) ↔ flawed(결함이 있는)","someday(언젠가) + miraculously(기적적으로) + perfect(완벽한) = 막연한 꿈"]},{"slots":[["meaningfully","significantly","s"],["alter"],["quickly","soon","s"],["completely","partially","a"],["same"]],"opts":["completely","slightly","barely","occasionally"],"or":["completely(완전히): 살짝 바꾸기를 비판했으니 해결책은 통째로 바꾸기여야 해서 맞음.","slightly(약간): 조금만 바꾸기는 글쓴이가 비판한 부서·회사 옮기기와 같은 방식임.","barely(거의 ~않게): 거의 안 바꾸라는 말이 되어 같은 게임을 계속하면 같은 상품을 받는다는 경고와 정반대임.","occasionally(가끔): 가끔 바꾸라는 건 해결책으로 너무 약해 '같은 게임, 같은 상품' 경고와 안 맞음."],"om":["완전히","약간","거의 ~않게","가끔"],"en":"You’ve got to completely switch up your approach. If you keep playing the same game, you’ll win the same prizes.","ko":"접근 방식을 완전히 바꿔야 한다. 같은 게임을 계속하면 같은 상품을 받게 된다.","hl":["completely switch up","the same game"],"khl":["완전히 바꿔야","같은 게임"],"blocks":[{"t":"p","h":"해결책의 세기","x":["글쓴이가 문제 삼은 건 조금씩 바꾸기였다.","부서만, 회사만 살짝 옮기는 것.","그러니 해결책은 반쯤이 아니라 통째로여야 한다.","partially(부분적으로)는 글쓴이가 비판한 그 방식으로 되돌아가는 말이다."]},{"t":"p","h":"함정","x":["이번엔 바뀐 단어가 셋이다.","significantly(상당히, 의미 있게)는 meaningfully(의미 있게) 자리에, soon(곧)은 quickly(빨리) 자리에 들어가도 뜻이 통한다.","고칠 단어는 하나뿐."]}],"post":["completely(완전히) ↔ partially(부분적으로)","살짝 바꾸기 X, 통째로 바꾸기"]},{"slots":[["unsatisfied"],["similar"],["disenchanted"],["rearranging","reorganizing","s"],["switch_up","retain","a"]],"opts":["switch_up","hold_onto","cling_to","stick_to"],"or":["switch up(확 바꾸다): 의자만 옮기지 말고 배에서 벗어나라는 타이타닉 비유의 결론이라 맞음.","hold onto(꼭 붙들다): 지금 방식을 붙들면 가라앉는 배에 남는 셈이라 비유의 경고와 반대임.","cling to(매달리다): 기존 방식에 매달리는 건 바로 글쓴이가 비판한 행동임.","stick to(고수하다): 같은 방식을 고수하면 같은 상품만 받는다는 마지막 문장과 부딪침."],"om":["확 바꾸다","꼭 붙들다","매달리다","고수하다"],"en":"It’s like rearranging deck chairs on the Titanic. You’ve got to completely switch up your approach.","ko":"그것은 타이타닉호의 갑판 의자를 다시 배치하는 것과 같다. 접근 방식을 완전히 바꿔야 한다.","hl":["switch up your approach","rearranging deck chairs"],"khl":["완전히 바꿔야","갑판 의자를 다시 배치하는"],"blocks":[{"t":"tap","h":"질문 하나","q":"가라앉는 타이타닉호에서 정말 해야 할 일은?","a":["의자를 옮기는 게 아니라 배 자체에서 벗어나는 것.","바로 다음 문장이 그 답이다.","switch up your approach(접근 방식을 확 바꿔라)."]},{"t":"p","h":"retain(유지하다)이 안 되는 이유","x":["retain(유지하다)은 지금 방식을 그대로 두라는 말이다.","그건 의자만 옮기며 계속 가라앉는 길이다.","비유가 경고하는 바로 그 행동."]},{"t":"p","h":"함정","x":["reorganizing(재정리하기)은 rearranging(재배치하기)과 같은 뜻이라 맞는 표현."]}],"post":["switch up(확 바꾸다) ↔ retain(유지하다)","의자 옮기기 X, 배에서 벗어나기"]},{"slots":[["miraculously"],["alter","modify","s"],["hoping"],["switch_up","overhaul","s"],["same","different","a"]],"opts":["same","bigger","better","richer"],"or":["same(같은): same game(같은 게임) → same prizes(같은 상품)로 짝을 이뤄 맞음.","bigger(더 큰): 같은 방식으로 더 큰 결과가 나온다면 방식을 바꿀 이유가 없어짐.","better(더 좋은): 같은 게임으로 더 좋은 상품을 받는다는 건 글 전체 주장과 정반대임.","richer(더 값진): 방식은 그대로인데 결과만 좋아진다는 말이라 경고가 되지 않음."],"om":["같은","더 큰","더 좋은","더 값진"],"en":"If you keep playing the same game, you’ll win the same prizes.","ko":"같은 게임을 계속하면 같은 상품을 받게 된다.","hl":["win the same prizes","keep playing the same game"],"khl":["같은 상품","같은 게임을 계속하면"],"blocks":[{"t":"tap","h":"글 전체를 한 줄로","q":"이 글을 한 줄로 줄이면?","a":["방식이 같으면 결과도 같다.","그러니 결과를 바꾸려면 방식을 바꿔야 한다."]},{"t":"p","h":"마지막 문장이 곧 한 줄 요약","x":["same game(같은 게임) → same prizes(같은 상품).","같은 행동에서 다른 결과는 나오지 않는다.","different prizes(다른 상품)가 되면 같은 방식으로도 결과가 달라진다는 말이 된다.","글 전체 주장과 정반대다."]},{"t":"p","h":"함정","x":["modify(수정하다)는 alter(바꾸다) 자리에, overhaul(전면적으로 뜯어고치다)은 switch up(확 바꾸다) 자리에 써도 된다.","둘 다 \"바꾸다\" 쪽 단어라 글의 방향을 해치지 않는다."]}],"post":["same(같은) ↔ different(다른)","같은 방식 = 같은 결과"]}],"quiz":[{"w":"hope","m":"바라다","it":[["repair","수리하다","n"],["wish","바라다","s"],["dread","몹시 두려워하다","a"],["whisper","속삭이다","n"],["expect","기대하다","s"],["despair","절망하다","a"],["invite","초대하다","n"]]},{"w":"perfect","m":"완벽한","it":[["flawed","결함이 있는","a"],["distant","먼","n"],["ideal","이상적인","s"],["humble","겸손한","n"],["defective","결함이 있는","a"],["flawless","흠 없는","s"],["noisy","시끄러운","n"]]},{"w":"completely","m":"완전히","it":[["secretly","몰래","n"],["entirely","전적으로","s"],["partially","부분적으로","a"],["rapidly","빠르게","n"],["thoroughly","철저히, 완전히","s"],["partly","부분적으로","a"],["honestly","솔직하게","n"]]},{"w":"switch up","m":"(방식을) 확 바꾸다","it":[["overhaul","전면적으로 뜯어고치다","s"],["celebrate","축하하다","n"],["retain","유지하다","a"],["postpone","미루다","n"],["revamp","쇄신하다","s"],["stick to","고수하다","a"],["measure","측정하다","n"]]},{"w":"same","m":"같은","it":[["brief","짧은","n"],["identical","동일한","s"],["different","다른","a"],["rural","시골의","n"],["equivalent","동등한","s"],["contrasting","대조적인","a"],["sincere","진실한","n"]]}]}],"no":"21"},{"id":"2610g1-22","title":"어휘특훈 · 26년 10월 고1 22번","sub":"시간 감각은 사회가 만든 것","tpl":"Sociologists argue that our perception and usage of time are not just {basic} properties of nature, like a clock ticking away in the background, nor are they simply {psychological} phenomena of {individual} experience. {Instead}, how we {perceive} and understand time is to a {large} degree {shaped} by tradition and cultural norms. Eviatar Zerubavel’s work, The Seven Day Circle: The History and Meaning of the Week, {demonstrates} how the week, a {fundamental} unit of time, is a {social} {invention} that {varies} across cultures, influencing how people structure their activities and rhythms of life. Why do we consider a nine-to-five job {routine}? Why don’t many of us work on the weekends? Why do we {usually} pay our bills at the end of the month? Why is the retirement age sixty-five? These numbers and patterns aren’t really {dictated} by nature or any {essential} human characteristic, but are rather social creations that we {internalize} and come to {accept} as “normal.”","fn":["*phenomena: 현상들(phenomenon의 복수형)","*norm: 규범","*retirement: 은퇴"],"mean":{"basic":"기본적인","inherent":"고유한, 본래 갖춰진","psychological":"심리적인","mental":"정신의, 마음의","individual":"개인의","personal":"개인적인","collective":"집단의, 공동의","Instead":"그 대신, 그게 아니라 오히려","Rather":"오히려, 그게 아니라","Similarly":"마찬가지로, 비슷하게","perceive":"인식하다, 알아차리다","overlook":"간과하다, 못 보고 넘기다","large":"큰","great":"(정도가) 큰, 상당한","minor":"작은, 사소한","shaped":"동사 shape(형성하다, 모양 짓다)의 과거분사형. is shaped by(~에 의해 형성되다, 수동태)","molded":"동사 mold(틀에 맞춰 만들다, 형성하다)의 과거분사형. 수동태","unaffected":"영향을 받지 않은","demonstrates":"동사 demonstrate(보여 주다, 입증하다)의 3인칭 단수 현재형","illustrates":"동사 illustrate(보여 주다, 예를 들어 설명하다)의 3인칭 단수 현재형","fundamental":"기본적인, 근본적인","core":"핵심적인","trivial":"사소한, 하찮은","social":"사회적인","natural":"자연의, 자연적인","invention":"발명, 발명품","discovery":"발견","varies":"동사 vary(서로 다르다, 달라지다)의 3인칭 단수 현재형","differs":"동사 differ(다르다)의 3인칭 단수 현재형","remains constant":"동사 remain(계속 ~이다)의 3인칭 단수 현재형 + constant(변함없는). 변함없이 그대로이다","routine":"일상적인, 늘 하는","standard":"표준의, 보통의","unusual":"특이한, 드문","usually":"보통, 대개","rarely":"좀처럼 ~하지 않는","dictated":"동사 dictate(좌우하다, 지시하다)의 과거분사형. are dictated by(~에 의해 정해지다, 수동태)","determined":"동사 determine(결정하다)의 과거분사형. 수동태","essential":"본질적인","innate":"타고난, 선천적인","internalize":"내면화하다(자기 것으로 받아들이다)","absorb":"흡수하다, 받아들이다","resist":"저항하다, 거부하다","accept":"받아들이다"},"sets":[{"items":[{"slots":[["basic"],["individual","collective","a"],["large"],["routine"],["essential"]],"opts":["individual","financial","physical","temporary"],"or":["individual(개인의): 사회학자가 부정하는 '나 혼자 느끼는 심리 현상'을 가리켜 맞음.","financial(금전의): 돈 문제는 시간 감각과 상관없고, 사회와 맞서는 '개인'이라는 대비도 생기지 않음.","physical(신체의): 몸으로 겪는 경험은 바로 앞 psychological phenomena(심리적 현상)와 어울리지 않음.","temporary(일시적인): 경험이 잠깐인지는 이 글의 쟁점이 아니며, 쟁점은 개인이냐 사회냐임."],"om":["개인의","금전의","신체의","일시적인"],"en":"Sociologists argue that our perception and usage of time are not just basic properties of nature, like a clock ticking away in the background, nor are they simply psychological phenomena of individual experience. Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.","ko":"사회학자들은 우리가 시간을 인식하고 사용하는 방식이 배경에서 째깍거리며 흘러가는 시계처럼 단지 자연의 기본적인 속성인 것도 아니고, 그저 개인 경험의 심리적 현상인 것도 아니라고 주장한다. 오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다.","hl":["individual experience","tradition and cultural norms"],"khl":["개인 경험","전통과 문화적 규범"],"blocks":[{"t":"pair","h":"사회학자가 고른 답, 고르지 않은 답","x":[["basic properties of nature","자연의 기본 속성 (시계처럼 원래 있는 것) → 아님"],["psychological phenomena of individual experience","개인 경험의 심리 현상 (나 혼자 느끼는 것) → 아님"],["shaped by tradition and cultural norms","전통과 문화 규범이 만든 것 → 정답"]]},{"t":"p","h":"collective(집단의)를 넣으면 생기는 일","x":["collective(집단의)는 여럿이 함께 나누는 것이다.","그런데 사회학자의 답이 바로 '함께 나누는 문화'다.","\"집단 경험만도 아니다\"라고 하면 자기 답을 스스로 지우는 셈이다.","부정해야 할 쪽은 나 혼자, 즉 individual(개인의)이다."]}],"post":["individual(개인의) ↔ collective(집단의)","시간 = 나 혼자 느끼는 것 X, 사회가 함께 만든 것"]},{"slots":[["psychological","mental","s"],["large","minor","a"],["demonstrates","illustrates","s"],["usually"],["accept"]],"opts":["large","limited","slight","equal"],"or":["large(큰): to a large degree(상당 부분)로 문화가 시간 감각을 크게 만든다는 핵심 주장을 살려 맞음.","limited(제한된): to a limited degree(제한적으로)는 문화의 영향이 작다는 말이라 Instead(오히려) 뒤 핵심 주장과 반대임.","slight(약간의): 문화의 영향이 조금뿐이라는 말이 되어 글 전체 주장과 반대임.","equal(동일한): '같은 정도로'는 무엇과 같은지 비교 대상이 없어 문장 뜻이 성립하지 않음."],"om":["큰","제한된","약간의","동일한"],"en":"Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.","ko":"오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다.","hl":["to a large degree","Instead"],"khl":["상당 부분","오히려"],"blocks":[{"t":"p","h":"Instead(그게 아니라 오히려) 뒤는 글의 핵심 주장","x":["앞 문장은 \"자연도 아니고 개인 심리도 아니다\"였다.","Instead(오히려) 뒤에 진짜 답이 나온다.","\"전통과 문화가 우리의 시간 감각을 만든다.\"","to a minor degree(작은 정도로)를 넣으면 \"문화의 영향은 조금뿐\"이 된다.","핵심 주장을 스스로 깎아내리는 말이라 틀렸다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["mental(정신의)은 psychological(심리적인)과 같은 쪽 말이다.","illustrates(보여 주다)도 demonstrates(보여 주다) 자리에 그대로 들어간다.","철자가 바뀌었다고 무조건 고치면 함정에 걸린다."]}],"post":["large(큰) ↔ minor(작은)","시간 감각의 대부분 = 문화가 만든 것"]},{"slots":[["Instead"],["shaped"],["social","natural","a"],["dictated","determined","s"],["internalize"]],"opts":["social","biological","universal","permanent"],"or":["social(사회적인): 바로 뒤 varies across cultures(문화마다 다르다), 마지막 social creations(사회적 창조물)과 이어져 맞음.","biological(생물학적인): 몸에 원래 있는 것이라 문화마다 달라질 수 없음.","universal(보편적인): 어디서나 같다는 뜻이라 문화마다 다르다는 바로 뒷말과 부딪침.","permanent(영구적인): 변하지 않는다는 뜻이라 문화마다 달라진다는 내용과 안 맞음."],"om":["사회적인","생물학적인","보편적인","영구적인"],"en":"Eviatar Zerubavel’s work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.","ko":"Eviatar Zerubavel의 저서 『7일의 순환: 일주일의 역사와 의미』는 기본적인 시간 단위인 일주일이 어떻게 문화마다 다른 사회적 발명품이며, 사람들이 활동과 삶의 리듬을 짜는 방식에 영향을 미치는지를 보여 준다.","hl":["a social invention","varies across cultures"],"khl":["사회적 발명품","문화마다 다른"],"blocks":[{"t":"tap","h":"질문 하나","q":"자연이 정한 것이라면 나라마다 달라질까?","a":["달라지지 않는다.","해가 뜨고 지는 하루는 어느 나라든 같다.","그런데 일주일은 varies across cultures(문화마다 다르다).","그러니 자연(natural = 자연의)이 아니라 사회(social = 사회의)가 만든 것이다."]},{"t":"p","h":"첫 문장과 이어 보기","x":["첫 문장에서 시간은 basic properties of nature(자연의 기본 속성)만이 아니라고 했다.","그 대표 예로 꺼낸 것이 일주일이다.","natural invention(자연의 발명품)이라고 하면 예시가 주장을 배신한다."]},{"t":"p","h":"determined(결정된)는 그대로","x":["dictated by nature(자연이 정한) 자리에 determined(결정된)를 써도 뜻이 같다."]}],"post":["social(사회적인) ↔ natural(자연의)","일주일 = 문화마다 다른 사회의 발명품"]},{"slots":[["individual"],["fundamental"],["varies"],["routine","unusual","a"],["accept"]],"opts":["routine","exhausting","risky","optional"],"or":["routine(일상적인): 우리가 당연하게 여기는 것을 콕 집어 묻는 질문이고, '정상'으로 받아들인다는 마지막 문장과 이어져 맞음.","exhausting(지치게 하는): 힘든지 묻는 글이 아니라 왜 당연한지 묻는 글이라 흐름과 안 맞음.","risky(위험한): 9시~5시 근무를 위험하다고 여기는 사람은 거의 없어 질문이 성립하지 않음.","optional(선택적인): 마음대로 골라도 되는 것이라면 사회가 정해 준 '정상'이라는 결론과 부딪침."],"om":["일상적인","지치게 하는","위험한","선택적인"],"en":"Why do we consider a nine-to-five job routine? … These numbers and patterns aren’t really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and come to accept as “normal.”","ko":"우리는 왜 9시부터 5시까지 일하는 직장을 일상적인 것으로 여길까? … 이러한 숫자와 패턴은 사실 자연이나 어떤 본질적인 인간 특성이 정한 것이 아니라, 오히려 우리가 내면화하여 ‘정상’으로 받아들이게 된 사회적 창조물이다.","hl":["a nine-to-five job routine","accept as “normal.”"],"khl":["일상적인 것으로","‘정상’으로 받아들이게"],"blocks":[{"t":"flow","h":"질문 네 개가 가리키는 곳","x":["9시 출근, 5시 퇴근","주말엔 쉬기","월말에 공과금 내기","65세 은퇴","모두 우리가 당연하다고 여기는 것"],"at":0},{"t":"p","h":"unusual(특이한)을 넣고 다시 읽기","x":["\"왜 우리는 9시~5시 근무를 특이하다고 여길까?\"가 된다.","하지만 대부분은 그걸 특이하게 보지 않는다.","글의 마지막 말도 accept as “normal”(‘정상’으로 받아들이다)이다.","질문은 당연한 것을 콕 집어 \"이게 왜 당연하지?\"라고 묻는 것이다."]}],"post":["routine(일상적인) ↔ unusual(특이한)","9시~5시 근무 = 당연하게 여기는 사회의 약속"]},{"slots":[["basic","inherent","s"],["large"],["varies","differs","s"],["usually"],["internalize","resist","a"]],"opts":["internalize","doubt","calculate","abandon"],"or":["internalize(내면화하다): and(그리고) 뒤 come to accept(받아들이게 되다)와 같은 방향이라 맞음.","doubt(의심하다): 의심하면서 동시에 '정상'으로 받아들이게 된다는 말이 되어 and(그리고) 앞뒤가 부딪침.","calculate(계산하다): 숫자를 계산한다는 엉뚱한 뜻이라 '정상으로 받아들인다'와 이어지지 않음.","abandon(버리다): 버리면서 동시에 받아들인다는 말이 되어 and(그리고) 앞뒤가 부딪침."],"om":["내면화하다","의심하다","계산하다","버리다"],"en":"These numbers and patterns aren’t really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and come to accept as “normal.”","ko":"이러한 숫자와 패턴은 사실 자연이나 어떤 본질적인 인간 특성이 정한 것이 아니라, 오히려 우리가 내면화하여 ‘정상’으로 받아들이게 된 사회적 창조물이다.","hl":["internalize and come to accept","social creations"],"khl":["내면화하여","사회적 창조물"],"blocks":[{"t":"p","h":"and(그리고)로 묶인 두 동사","x":["internalize and come to accept(내면화하고 받아들이게 되다).","and(그리고)로 묶인 두 동사는 같은 방향을 가리킨다.","resist(저항하다)를 넣으면 \"저항하면서 정상으로 받아들인다\"가 된다.","한 문장 안에서 앞뒤가 싸운다."]},{"t":"p","h":"우리 생활로 확인","x":["우리는 9시 출근에 반항하지 않는다.","어릴 때부터 보고 자라서 내 것처럼 익숙해졌다.","남이 만든 규칙이 내 생각이 되는 것, 그게 internalize(내면화하다)다."]},{"t":"p","h":"함정","x":["inherent(본래 갖춰진)는 basic(기본적인) 자리에, differs(다르다)는 varies(서로 다르다) 자리에 들어가도 된다.","둘 다 문장 뜻을 바꾸지 않는다."]}],"post":["internalize(내면화하다) ↔ resist(저항하다)","사회의 약속 → 내 것처럼 익숙해짐"]}],"quiz":[{"w":"individual","m":"개인의","it":[["frequent","잦은","n"],["personal","개인적인","s"],["collective","집단의","a"],["polite","공손한","n"],["separate","개별의, 따로의","s"],["common","공동의, 공통의","a"],["bitter","쓴","n"]]},{"w":"large","m":"큰","it":[["slight","약간의","a"],["honest","정직한","n"],["considerable","상당한","s"],["ancient","고대의","n"],["substantial","상당한, 큰","s"],["minor","작은, 사소한","a"],["rural","시골의","n"]]},{"w":"social","m":"사회적인","it":[["fragile","깨지기 쉬운","n"],["communal","공동체의","s"],["solitary","혼자 하는","a"],["loyal","충실한","n"],["societal","사회의","s"],["individual","개인의","a"],["sudden","갑작스러운","n"]]},{"w":"routine","m":"일상적인, 늘 하는","it":[["ordinary","평범한","s"],["generous","관대한","n"],["unusual","특이한","a"],["distant","먼","n"],["everyday","일상의","s"],["exceptional","예외적인","a"],["cruel","잔인한","n"]]},{"w":"internalize","m":"내면화하다","it":[["borrow","빌리다","n"],["absorb","흡수하다, 받아들이다","s"],["reject","거부하다","a"],["whisper","속삭이다","n"],["resist","저항하다","a"],["assimilate","동화하다, 흡수하다","s"],["repair","수리하다","n"]]}]},{"items":[{"slots":[["psychological"],["Instead","Similarly","a"],["demonstrates"],["social"],["accept"]],"opts":["Instead","Moreover","Meanwhile","Therefore"],"or":["Instead(그게 아니라 오히려): '~도 아니고 ~도 아니다'라고 두 번 부정한 뒤 진짜 답을 내놓는 신호라 맞음.","Moreover(게다가): 앞말에 같은 방향의 말을 덧붙일 때 쓰는데, 앞은 부정이고 뒤는 새 답이라 이어지지 않음.","Meanwhile(한편): 다른 장면으로 넘어가는 말이라 부정 뒤 진짜 답을 내놓는 자리와 안 맞음.","Therefore(그러므로): 앞 내용에서 끌어낸 결론이 아니라 앞 내용 대신 내놓는 답이라 안 맞음."],"om":["그게 아니라 오히려","게다가","한편","그러므로"],"en":"Sociologists argue that our perception and usage of time are not just basic properties of nature, like a clock ticking away in the background, nor are they simply psychological phenomena of individual experience. Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.","ko":"사회학자들은 우리가 시간을 인식하고 사용하는 방식이 배경에서 째깍거리며 흘러가는 시계처럼 단지 자연의 기본적인 속성인 것도 아니고, 그저 개인 경험의 심리적 현상인 것도 아니라고 주장한다. 오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다.","hl":["Instead","not just","nor"],"khl":["오히려","것도 아니고"],"blocks":[{"t":"p","h":"연결어가 정하는 방향","x":["앞 문장은 not just ~ nor ~ (~도 아니고 ~도 아니다) 구조다.","두 번 부정했으면 다음엔 \"그럼 뭔데?\"가 나와야 한다.","그 신호가 Instead(그게 아니라 오히려)다.","Similarly(마찬가지로)는 앞과 비슷한 말을 덧붙일 때 쓴다.","부정 뒤에 진짜 답을 내놓는 자리에는 맞지 않는다."]},{"t":"tap","h":"한 줄로 줄이기","q":"사회학자의 주장을 'A가 아니라 B' 꼴로 줄이면?","a":["시간은 자연이나 개인 심리가 아니라,","전통과 문화가 만든 것이다.","'아니라'를 맡은 단어가 Instead(그게 아니라 오히려)."]}],"post":["Instead(그게 아니라 오히려) ↔ Similarly(마찬가지로)","자연 X, 개인 X → 문화 O"]},{"slots":[["individual","personal","s"],["shaped","unaffected","a"],["fundamental"],["routine","standard","s"],["dictated"]],"opts":["shaped","weakened","measured","ignored"],"or":["shaped(형성된, shape의 과거분사): 마지막 문장의 social creations(사회적 창조물)과 같은 이야기라 맞음.","weakened(약해진, weaken의 과거분사): 전통이 시간 감각을 약하게 만든다는 엉뚱한 뜻이 됨.","measured(측정된, measure의 과거분사): 시간을 잰다는 말이라 문화가 시간 감각을 만든다는 주장과 다름.","ignored(무시된, ignore의 과거분사): 전통이 시간 감각을 무시한다는 말이 되어 글 전체와 반대임."],"om":["형성된","약해진","측정된","무시된"],"en":"Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.","ko":"오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다.","hl":["shaped by tradition and cultural norms","to a large degree"],"khl":["전통과 문화적 규범에 의해 형성된다","상당 부분"],"blocks":[{"t":"pair","h":"글 끝 문장과 나란히","x":[["shaped by tradition and cultural norms","전통과 문화 규범에 의해 형성된다 (둘째 문장)"],["social creations that we internalize","우리가 내면화한 사회적 창조물 (마지막 문장)"]]},{"t":"p","h":"unaffected(영향을 받지 않은)가 틀린 이유","x":["unaffected by(~의 영향을 받지 않은)를 넣으면 \"시간 감각은 문화의 영향을 안 받는다\"가 된다.","그러면 일주일, 9시 출근, 65세 은퇴 예시가 전부 설명이 안 된다.","이 글은 처음부터 끝까지 '문화가 만든 시간' 이야기다."]},{"t":"p","h":"그대로 둬야 할 두 단어","x":["personal experience(개인적인 경험)는 individual experience(개인 경험)와 같은 뜻이다.","consider a nine-to-five job standard(9시~5시 근무를 표준으로 여기다)도 routine(일상적인)과 통한다."]}],"post":["shaped(형성된) ↔ unaffected(영향을 받지 않은)","시간 감각 = 전통과 문화가 빚은 것"]},{"slots":[["basic"],["Instead","Rather","s"],["fundamental","trivial","a"],["usually"],["essential"]],"opts":["fundamental","recent","flexible","foreign"],"or":["fundamental(기본적인): 일주일이 사람들의 활동과 삶의 리듬을 짜는 큰 틀이라는 뒷부분과 맞음.","recent(최근의): 일주일이 최근 것인지는 글의 쟁점이 아니고, 생활의 틀이라는 내용과도 상관없음.","flexible(유연한): 콤마 사이 말은 일주일이 어떤 단위인지 풀어 주는 자리인데, 늘었다 줄었다 하는 단위라면 삶의 리듬을 짜는 기준이 될 수 없음.","foreign(외국의): 일주일은 우리 생활 자체의 단위라 외국 것이라고 할 수 없음."],"om":["기본적인","최근의","유연한","외국의"],"en":"Eviatar Zerubavel’s work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.","ko":"Eviatar Zerubavel의 저서 『7일의 순환: 일주일의 역사와 의미』는 기본적인 시간 단위인 일주일이 어떻게 문화마다 다른 사회적 발명품이며, 사람들이 활동과 삶의 리듬을 짜는 방식에 영향을 미치는지를 보여 준다.","hl":["a fundamental unit of time","influencing how people structure their activities and rhythms of life"],"khl":["기본적인 시간 단위","삶의 리듬을 짜는 방식에 영향을"],"blocks":[{"t":"p","h":"콤마 사이의 설명","x":["the week, a fundamental unit of time(일주일, 즉 기본적인 시간 단위).","콤마 사이 말은 일주일을 다시 풀어 주는 말이다.","일주일은 우리 생활을 나누는 큰 틀이다.","trivial(사소한)이라고 하면 문장 끝과 부딪친다.","사소한 단위가 사람들의 삶의 리듬을 짤 수는 없다."]},{"t":"p","h":"Rather(오히려)는 고치지 않는다","x":["Rather(오히려)는 Instead(그게 아니라 오히려)와 같은 역할이다.","\"~가 아니라 오히려\"의 방향을 그대로 지킨다."]}],"post":["fundamental(기본적인) ↔ trivial(사소한)","일주일 = 생활 리듬을 짜는 기본 틀"]},{"slots":[["perceive"],["large"],["social"],["invention","discovery","a"],["internalize"]],"opts":["invention","instinct","accident","illusion"],"or":["invention(발명품): 사람이 만든 것이라 마지막 social creations(사회적 창조물)과 이어져 맞음.","instinct(본능): 본능은 타고나는 것이라 essential human characteristic(본질적인 인간 특성)이 정한 게 아니라는 결론과 부딪침.","accident(우연한 사건): 사회가 정한 약속인데 우연히 생겼다는 말이 되어 '사회가 만든 것'이라는 주장과 어긋남.","illusion(착각): 일주일은 실제로 생활을 움직이는 약속이라 착각이라고 하면 뜻이 틀어짐."],"om":["발명품","본능","우연한 사건","착각"],"en":"Sociologists argue that our perception and usage of time are not just basic properties of nature, like a clock ticking away in the background, … Eviatar Zerubavel’s work … demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, …","ko":"사회학자들은 우리가 시간을 인식하고 사용하는 방식이 배경에서 째깍거리며 흘러가는 시계처럼 단지 자연의 기본적인 속성인 것만은 아니라고 주장한다. … Eviatar Zerubavel의 저서는 기본적인 시간 단위인 일주일이 어떻게 문화마다 다른 사회적 발명품인지를 보여 준다. …","hl":["a social invention","basic properties of nature"],"khl":["사회적 발명품","자연의 기본적인 속성"],"blocks":[{"t":"p","h":"발명과 발견의 차이","x":["invention(발명)은 없던 것을 사람이 만들어 내는 것이다.","discovery(발견)는 원래 있던 것을 찾아내는 것이다.","일주일이 발견이라면 자연에 원래 있었다는 말이 된다.","첫 문장이 바로 그걸 부정했다.","not just basic properties of nature(자연의 기본 속성만이 아니다).","게다가 일주일은 varies across cultures(문화마다 다르다).","원래 있던 것을 찾아냈다면 어느 나라에서나 같았을 것이다.","나라마다 다르다는 건 사람마다 다르게 만들었다는 증거다."]},{"t":"p","h":"마지막 문장이 한 번 더 확인","x":["social creations(사회적 창조물).","creation(창조물)도 사람이 만든 것이다.","글은 끝까지 '찾은 것'이 아니라 '만든 것'이라고 말한다."]}],"post":["invention(발명) ↔ discovery(발견)","일주일 = 찾아낸 것 X, 사람이 만든 것"]},{"slots":[["shaped","molded","s"],["demonstrates"],["usually","rarely","a"],["essential","innate","s"],["accept"]],"opts":["usually","secretly","reluctantly","quickly"],"or":["usually(보통): 바로 뒤에서 patterns(패턴)라고 부르니 늘 반복되는 일이라 맞음.","secretly(몰래): 공과금은 몰래 내는 것이 아니고, 반복되는 패턴과도 상관없음.","reluctantly(마지못해): 마음이 어떤지는 글의 쟁점이 아니며, 쟁점은 왜 다들 월말에 내느냐임.","quickly(빨리): 빨리 내는지가 아니라 왜 하필 월말에 내는 습관이 있는지를 묻는 질문임."],"om":["보통","몰래","마지못해","빨리"],"en":"Why do we usually pay our bills at the end of the month? Why is the retirement age sixty-five? These numbers and patterns aren’t really dictated by nature or any essential human characteristic, …","ko":"왜 우리는 보통 월말에 공과금을 낼까? 왜 은퇴 나이는 65세일까? 이러한 숫자와 패턴은 사실 자연이나 어떤 본질적인 인간 특성이 정한 것이 아니다. …","hl":["usually pay our bills","These numbers and patterns"],"khl":["보통 월말에 공과금을","이러한 숫자와 패턴"],"blocks":[{"t":"p","h":"질문이 가리키는 건 '습관'","x":["월말에 공과금을 내는 건 많은 사람이 늘 하는 일이다.","바로 뒤 문장은 이것을 patterns(패턴)라고 부른다.","패턴은 자주 반복되는 것이다.","rarely(좀처럼 ~않다)를 넣으면 반복되는 패턴이 아니게 된다.","드문 일에 \"왜 다들 이렇게 하지?\"라고 물을 이유도 없다."]},{"t":"p","h":"함정","x":["molded(틀에 맞춰 빚어진)는 shaped(형성된) 자리에 그대로 쓸 수 있다.","innate(타고난)도 essential human characteristic(본질적인 인간 특성)의 뜻을 살린다.","둘 다 손대지 않아도 되는 말이다."]}],"post":["usually(보통) ↔ rarely(좀처럼 ~않는)","월말 납부 = 반복되는 사회의 패턴"]}],"quiz":[{"w":"instead","m":"그 대신, 그게 아니라 오히려","it":[["loudly","큰 소리로","n"],["rather","오히려","s"],["as a substitute","대신하는 것으로","s"],["safely","안전하게","n"],["alternatively","그 대신에","s"],["as an alternative","대안으로, 대신에","s"],["politely","공손하게","n"]]},{"w":"shape","m":"형성하다","it":[["form","형성하다","s"],["admire","존경하다","n"],["influence","영향을 주다","s"],["postpone","미루다","n"],["mold","틀에 맞춰 만들다","s"],["construct","구성하다, 만들어 내다","s"],["invite","초대하다","n"]]},{"w":"fundamental","m":"기본적인, 근본적인","it":[["noisy","시끄러운","n"],["basic","기본적인","s"],["trivial","사소한","a"],["punctual","시간을 잘 지키는","n"],["essential","본질적인","s"],["secondary","부차적인","a"],["brave","용감한","n"]]},{"w":"invention","m":"발명, 발명품","it":[["creation","창조, 창조물","s"],["harvest","수확","n"],["device","고안품, 장치","s"],["ladder","사다리","n"],["innovation","혁신, 새로 만든 것","s"],["design","고안, 설계","s"],["courage","용기","n"]]},{"w":"usually","m":"보통, 대개","it":[["angrily","화가 나서","n"],["typically","대개, 일반적으로","s"],["rarely","좀처럼 ~하지 않는","a"],["neatly","깔끔하게","n"],["generally","일반적으로","s"],["seldom","좀처럼 ~하지 않는","a"],["loudly","큰 소리로","n"]]}]}],"comp":[{"no":"22","slots":[["psychological"],["large","great","s"],["invention"],["varies","remains constant","a"],["dictated"]],"opts":["varies","disappears","shrinks","matters"],"or":["varies(서로 다르다, vary의 3인칭 단수 현재형): 사람이 만든 약속이라 문화마다 다르다는 뜻이 되어 맞음.","disappears(사라지다, disappear의 3인칭 단수 현재형): 일주일은 지금도 사람들의 활동과 삶의 리듬을 짜고 있어 문화마다 사라진다는 말과 부딪침.","shrinks(줄어들다, shrink의 3인칭 단수 현재형): 일주일이 문화마다 줄어든다는 말은 엉뚱하고, 문화마다 다르다는 핵심 근거도 사라짐.","matters(중요하다, matter의 3인칭 단수 현재형): '문화마다 중요하다'는 어색하고, 문화마다 다르다는 핵심 근거가 사라짐."],"om":["서로 다르다","사라지다","줄어들다","중요하다"],"en":"Eviatar Zerubavel’s work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.","ko":"Eviatar Zerubavel의 저서 『7일의 순환: 일주일의 역사와 의미』는 기본적인 시간 단위인 일주일이 어떻게 문화마다 다른 사회적 발명품이며, 사람들이 활동과 삶의 리듬을 짜는 방식에 영향을 미치는지를 보여 준다.","hl":["varies across cultures","a social invention"],"khl":["문화마다 다른","사회적 발명품"],"blocks":[{"t":"p","h":"원인과 결과로 보기","x":["원인: 일주일은 사회가 만든 것이다.","결과: 그러니 사회마다 모습이 다르다.","사람이 정한 약속은 나라마다 달라질 수 있다.","remains constant(변함없이 그대로이다)를 넣으면 이 결과가 사라진다.","문화마다 똑같다면 오히려 자연이 정한 것처럼 보인다."]},{"t":"p","h":"great((정도가) 큰)는 그대로","x":["to a great degree(상당 부분)는 to a large degree(상당 부분)와 같은 뜻의 짝꿍 표현이다."]}],"post":["vary(서로 다르다) ↔ remain constant(변함없이 그대로이다)","사람이 만든 약속 = 문화마다 다름"]},{"no":"22","slots":[["basic"],["perceive","overlook","a"],["fundamental","core","s"],["routine"],["internalize","absorb","s"]],"opts":["perceive","forget","waste","save"],"or":["perceive(인식하다): 첫 문장 our perception(우리의 인식)을 동사로 다시 말한 것이라 맞음.","forget(잊다): '시간을 잊고 이해하는 방식'은 and(그리고) 앞뒤가 어울리지 않고, 첫 문장 our perception(우리의 인식)과도 이어지지 않음.","waste(낭비하다): '시간을 낭비하고 이해하는 방식'은 어색하고 글의 주제와도 상관없음.","save(아끼다): 시간을 아끼는 법이 아니라 시간을 어떻게 느끼고 받아들이는지를 다루는 글임."],"om":["인식하다","잊다","낭비하다","아끼다"],"en":"Sociologists argue that our perception and usage of time are not just basic properties of nature, … Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.","ko":"사회학자들은 우리가 시간을 인식하고 사용하는 방식이 단지 자연의 기본적인 속성인 것만은 아니라고 주장한다. … 오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다.","hl":["how we perceive and understand time","our perception and usage of time"],"khl":["시간을 인식하고 이해하는 방식","시간을 인식하고 사용하는 방식"],"blocks":[{"t":"pair","h":"첫 문장의 명사, 둘째 문장의 동사","x":[["our perception","우리의 인식 (명사)"],["how we perceive","우리가 인식하는 방식 (동사)"]]},{"t":"p","h":"overlook(간과하다)이 안 되는 이유","x":["perception(인식)을 받아서 perceive(인식하다)로 다시 말한 것이다.","overlook(간과하다)은 보고도 지나쳐 버리는 것이다.","\"간과하고 이해하는 방식\"은 and(그리고) 앞뒤가 서로 부딪친다.","글은 우리가 시간을 어떻게 느끼고 받아들이는지를 다룬다."]},{"t":"p","h":"함정","x":["core(핵심적인)는 fundamental(기본적인) 자리에, absorb(받아들이다)는 internalize(내면화하다) 자리에 넣어도 뜻이 통한다."]}],"post":["perceive(인식하다) ↔ overlook(간과하다)","perception(인식) → perceive(인식하다), 같은 말 되풀이"]}],"compquiz":[{"w":"vary","m":"서로 다르다, 달라지다","it":[["apologize","사과하다","n"],["differ","다르다","s"],["fluctuate","변동하다, 오르내리다","s"],["swallow","삼키다","n"],["change","바뀌다","s"],["stay the same","그대로이다, 변함없다","a"],["celebrate","축하하다","n"]]},{"w":"perceive","m":"인식하다, 알아차리다","it":[["sense","감지하다, 느끼다","s"],["repair","수리하다","n"],["overlook","간과하다","a"],["postpone","미루다","n"],["recognize","알아보다, 인식하다","s"],["ignore","무시하다","a"],["decorate","장식하다","n"]]}],"no":"22"},{"id":"2610g1-23","title":"어휘특훈 · 26년 10월 고1 23번","sub":"내부 고발자 보호의 필요성","tpl":"In recent years, the number of {illegal} actions in particular at the corporate level has {grown}, or at least the number of cases that came to light {increased}. Such {misconduct} has often only been {exposed} because {brave} informants have {risked} a great deal in order to {put_an_end_to} it. Hence, it is no surprise that whistleblower protection has come into focus. If {violations} of law and order go {undetected} and unpunished for years because employees of a company {fear} to report illegal activities for fear of {reprisals} or consequences, it can have several {negative} effects. It can {harm} the company itself, but also third-parties, the economy in general, the general public, and even the rule of law could be {affected}. {Protecting} those who would assist in {reducing} unlawful or even criminal behaviour has two main functions: Protecting the individual’s actions as well as protecting the public good. A well-balanced whistleblower protection may have {positive} effects on both of these.","fn":["*informant: 제보자","*come to light: 세상에 드러나다","*whistleblower: 내부 고발자","*third-party: 제3자","*the rule of law: 법치(법에 의한 다스림)"],"mean":{"illegal":"불법적인","illicit":"불법의","lawful":"합법적인","grown":"동사 grow(늘어나다, 자라다)의 과거분사형. has grown(현재완료)","declined":"동사 decline(줄어들다)의 과거분사형. has declined(현재완료)","increased":"동사 increase(늘다, 증가하다)의 과거형","rose":"동사 rise(오르다, 늘다)의 과거형","misconduct":"부정행위, 비행","wrongdoing":"나쁜 짓, 범법 행위","honesty":"정직","exposed":"동사 expose(드러내다, 폭로하다)의 과거분사형. has been exposed(드러나다, 수동태)","revealed":"동사 reveal(드러내다)의 과거분사형. 수동태","concealed":"동사 conceal(숨기다)의 과거분사형. 수동태","brave":"용감한","courageous":"용기 있는","cowardly":"비겁한","risked":"동사 risk(위험을 무릅쓰다, ~을 걸다)의 과거분사형. have risked(현재완료)","sacrificed":"동사 sacrifice(희생하다)의 과거분사형. have sacrificed(현재완료)","put an end to":"~을 끝내다","prolong":"연장하다, 오래 끌다","violations":"명사 violation(위반)의 복수형","breaches":"명사 breach(위반)의 복수형","undetected":"발각되지 않은","unnoticed":"눈에 띄지 않은","fear":"두려워하다","hesitate":"망설이다","dare":"감히 ~하다, ~할 용기가 있다","reprisals":"명사 reprisal(보복)의 복수형","rewards":"명사 reward(보상)의 복수형","negative":"부정적인","adverse":"해로운, 불리한","harm":"해치다, 해를 끼치다","damage":"손상을 주다, 해치다","benefit":"~에 이익이 되다, 이롭게 하다","affected":"동사 affect(영향을 미치다)의 과거분사형. be affected(영향을 받다, 수동태)","impacted":"동사 impact(영향을 주다)의 과거분사형. be impacted(영향을 받다, 수동태)","Protecting":"동사 protect(보호하다)의 -ing형. 동명사 주어(보호하는 것)","Shielding":"동사 shield(보호하다, 막아 주다)의 -ing형. 동명사 주어","Punishing":"동사 punish(처벌하다)의 -ing형. 동명사 주어(처벌하는 것)","reducing":"동사 reduce(줄이다)의 -ing형. 전치사 in 뒤의 동명사","encouraging":"동사 encourage(부추기다, 장려하다)의 -ing형. 동명사","positive":"긍정적인","harmful":"해로운"},"sets":[{"items":[{"slots":[["grown"],["exposed","concealed","a"],["risked"],["negative"],["reducing"]],"opts":["exposed","tolerated","repeated","ignored"],"om":["드러난","용인된","반복된","무시된"],"en":"Such misconduct has often only been exposed because brave informants have risked a great deal in order to put an end to it.","ko":"그러한 부정행위는 용감한 제보자들이 그것을 끝내기 위해 많은 것을 걸었기 때문에 비로소 드러난 경우가 많다.","hl":["only been exposed","brave informants"],"khl":["비로소 드러난","용감한 제보자들"],"blocks":[{"t":"p","h":"제보자가 하는 일","x":["informant(제보자)는 감춰진 잘못을 알리는 사람이다.","제보자가 위험을 무릅쓰고 나서면 어떻게 될까?","잘못이 세상에 드러난다.","concealed(숨겨진)를 넣으면 \"제보자 덕분에 숨겨졌다\"가 된다.","제보자가 하는 일과 정반대다."]},{"t":"p","h":"앞 문장이 준 힌트","x":["앞 문장의 came to light(세상에 드러나다)가 힌트다.","드러난 사례가 늘었다 → 누가 드러냈나 → 용감한 제보자.","exposed(드러난)는 came to light(세상에 드러나다)를 이어받는 말이다."]}],"post":["expose(드러내다) ↔ conceal(숨기다)","부정행위가 드러나는 이유 = 용감한 제보자"],"or":["exposed(드러난): 용감한 제보자가 위험을 무릅쓴 결과는 잘못이 세상에 드러나는 것이라 딱 맞음.","tolerated(용인된): 제보자가 위험을 걸고 나섰는데 잘못을 그냥 봐줬다는 건 원인과 결과가 안 맞음.","repeated(반복된): 제보자 덕분에 부정행위가 반복됐다는 말이 되어, 잘못을 끝내려고 나선 목적과 정반대임.","ignored(무시된): 제보했는데 무시됐다면 앞 문장의 came to light(세상에 드러나다)와 이어지지 않음."]},{"slots":[["illegal","illicit","s"],["brave"],["undetected","unnoticed","s"],["fear","dare","a"],["affected"]],"opts":["fear","decide","promise","pretend"],"om":["두려워하다","결정하다","약속하다","~인 척하다"],"en":"If violations of law and order go undetected and unpunished for years because employees of a company fear to report illegal activities for fear of reprisals or consequences, it can have several negative effects.","ko":"회사 직원들이 보복이나 불이익이 무서워 불법 행위를 신고하기를 두려워하는 탓에 법과 질서의 위반이 수년 동안 발각되지도 처벌되지도 않는다면, 여러 부정적인 결과가 생길 수 있다.","hl":["fear to report illegal activities","for fear of reprisals"],"khl":["신고하기를 두려워하는","보복이나 불이익이 무서워"],"blocks":[{"t":"flow","h":"because가 만든 사슬","x":["직원이 보복을 무서워한다","신고를 못 한다","위반이 몇 년씩 발각되지 않는다","처벌도 안 된다","여러 나쁜 결과"],"at":1},{"t":"p","h":"dare를 넣으면","x":["dare to report(감히 신고하다)는 용기 내서 신고했다는 말이다.","신고했다면 위반이 몇 년씩 숨어 있을 수 없다.","게다가 for fear of reprisals(보복이 두려워)와 한 문장 안에서 부딪친다."]},{"t":"p","h":"고치지 않는 두 단어","x":["illicit(불법의)는 첫 문장 illegal(불법적인) 자리에 들어가도 뜻이 같다.","go unnoticed(눈에 띄지 않고 넘어가다)도 go undetected(발각되지 않고 넘어가다)와 같은 짝 표현이다."]}],"post":["fear(두려워하다) ↔ dare(감히 ~하다)","보복이 무서움 → 신고 못 함 → 위반이 숨음"],"or":["fear(두려워하다): for fear of reprisals(보복이 두려워)와 같은 방향이라, 신고를 못 해 위반이 숨는 흐름에 맞음.","decide(결정하다): 신고하기로 결정했다면 위반이 몇 년씩 발각되지 않을 수 없음.","promise(약속하다): 신고를 약속한 직원이 있다면 위반이 드러나야 하므로 because(~ 때문에) 뒤 원인이 될 수 없음.","pretend(~인 척하다): 신고하는 척한다는 말은 보복이 무서워서라는 이유와 이어지지 않음."]},{"slots":[["misconduct"],["put_an_end_to"],["harm","damage","s"],["Protecting","Punishing","a"],["positive"]],"opts":["Protecting","Hiring","Training","Ignoring"],"om":["보호하는 것","고용하는 것","훈련하는 것","무시하는 것"],"en":"Protecting those who would assist in reducing unlawful or even criminal behaviour has two main functions: Protecting the individual’s actions as well as protecting the public good.","ko":"불법적이거나 심지어 범죄적인 행위를 줄이는 데 도움을 줄 사람들을 보호하는 것에는 두 가지 주요 기능이 있다. 공익을 보호하는 것뿐 아니라 개인의 행동을 보호하는 것이다.","hl":["Protecting those who would assist","protecting the public good"],"khl":["도움을 줄 사람들을 보호하는 것","공익을 보호하는 것"],"blocks":[{"t":"p","h":"콜론 뒤가 답을 알려 준다","x":["콜론(:) 뒤에 두 가지 기능이 나온다.","Protecting the individual’s actions(개인의 행동 보호), 그리고 protecting the public good(공익 보호).","기능 설명이 모두 '보호'다.","그러니 콜론 앞의 주어도 '보호하는 것'이어야 한다.","Punishing(처벌하는 것)을 넣으면 앞뒤가 따로 논다."]},{"t":"p","h":"누구를 처벌한다는 걸까","x":["those who would assist in reducing unlawful behaviour(불법 행위를 줄이는 데 도움을 줄 사람들)는 착한 쪽이다.","불법을 줄이려는 사람을 처벌한다는 건 말이 안 된다."]},{"t":"p","h":"damage는 그대로","x":["It can damage the company itself(회사 자체에 손상을 줄 수 있다).","harm(해치다)과 같은 뜻이라 고칠 필요가 없다."]}],"post":["protect(보호하다) ↔ punish(처벌하다)","내부 고발자 보호 = 개인 보호 + 공익 보호"],"or":["Protecting(보호하는 것): 콜론 뒤 두 기능이 모두 protecting(보호하는 것)이라 주어도 '보호'여야 함.","Hiring(고용하는 것): 제보자를 고용하는 일이 개인 행동 보호와 공익 보호라는 기능을 가진다는 건 연결이 안 됨.","Training(훈련하는 것): 훈련은 콜론 뒤의 '보호' 두 가지와 이어지지 않고, 글 주제인 내부 고발자 보호에서 벗어남.","Ignoring(무시하는 것): 불법을 줄이려는 사람을 무시하는 것이 개인 행동 보호와 공익 보호라는 기능을 가질 수 없음."]},{"slots":[["grown","declined","a"],["exposed"],["violations"],["reprisals"],["Protecting"]],"opts":["grown","shifted","varied","appeared"],"om":["늘어난","옮겨 간","달라진","나타난"],"en":"In recent years, the number of illegal actions in particular at the corporate level has grown, or at least the number of cases that came to light increased. … Hence, it is no surprise that whistleblower protection has come into focus.","ko":"최근 몇 년 동안 특히 기업 차원의 불법 행위 수가 늘어났거나, 적어도 세상에 드러난 사례 수가 증가했다. … 그러므로 내부 고발자 보호가 주목받게 된 것은 놀라운 일이 아니다.","hl":["has grown","or at least","Hence"],"khl":["늘어났거나","적어도","그러므로"],"blocks":[{"t":"p","h":"or at least의 힘","x":["or at least(아니면 적어도)는 앞말을 조금 약하게 다시 말할 때 쓴다.","\"불법이 늘었다. 아니면 적어도 드러난 게 늘었다.\"","두 말은 같은 방향(늘었다)을 가리킨다.","declined(줄었다)를 넣으면 \"줄었다, 아니면 적어도 늘었다\"가 된다.","방향이 거꾸로 꼬인다."]},{"t":"p","h":"Hence로 한 번 더 확인","x":["Hence(그러므로), 내부 고발자 보호가 주목받게 되었다.","불법이 줄었다면 보호가 갑자기 주목받을 이유가 없다."]}],"post":["grow(늘어나다) ↔ decline(줄어들다)","기업 불법 증가 → 내부 고발자 보호 주목"],"or":["grown(늘어나다, grow의 과거분사형): or at least(아니면 적어도) 뒤 increased(늘었다)와 같은 방향이라 맞음.","shifted(옮겨 가다, shift의 과거분사형): 수가 '옮겨 갔다'는 말은 어색하고, 뒤의 increased(늘었다)와 짝이 안 맞음.","varied(달라지다, vary의 과거분사형): 늘었는지 줄었는지 방향이 없어, Hence(그러므로) 보호가 주목받는 이유가 되지 못함.","appeared(나타나다, appear의 과거분사형): 수는 나타나는 것이 아니라 늘거나 줄어드는 것이라 어울리지 않음."]},{"slots":[["increased","rose","s"],["risked","sacrificed","s"],["fear"],["reducing"],["positive","harmful","a"]],"opts":["positive","disastrous","minor","mixed"],"om":["긍정적인","재앙 같은","사소한","엇갈린"],"en":"Protecting those who would assist in reducing unlawful or even criminal behaviour has two main functions: Protecting the individual’s actions as well as protecting the public good. A well-balanced whistleblower protection may have positive effects on both of these.","ko":"불법적이거나 심지어 범죄적인 행위를 줄이는 데 도움을 줄 사람들을 보호하는 것에는 두 가지 주요 기능이 있다. 공익을 보호하는 것뿐 아니라 개인의 행동을 보호하는 것이다. 균형이 잘 잡힌 내부 고발자 보호는 이 두 가지 모두에 긍정적인 효과를 가져올 수 있다.","hl":["positive effects on both of these","well-balanced"],"khl":["긍정적인 효과","균형이 잘 잡힌"],"blocks":[{"t":"p","h":"글쓴이의 결론","x":["이 글은 내부 고발자 보호가 필요하다는 글이다.","마지막 문장이 그 결론이다.","\"잘 짜인 보호는 개인과 공익 둘 다에 좋다.\"","harmful(해로운)을 넣으면 \"잘 짜인 보호가 둘 다 해친다\"가 된다.","글 전체 주장을 마지막 줄에서 뒤집는 셈이다."]},{"t":"p","h":"both of these가 가리키는 것","x":["both of these(이 둘 모두) = 바로 앞의 두 기능.","개인의 행동 보호, 그리고 공익 보호.","보호하려고 만든 제도가 둘 다 해친다면 앞뒤가 맞지 않는다."]},{"t":"p","h":"함정","x":["rose(증가했다)는 increased(증가했다) 자리에, sacrificed(희생했다)는 risked(걸었다) 자리에 들어가도 된다.","제보자가 많은 것을 내걸었다는 뜻이 그대로 산다."]}],"post":["positive(
