 law could be affected.","ko":"그것은 회사 자체에 해를 끼칠 수 있을 뿐 아니라, 제3자, 경제 전반, 일반 대중에게도 해를 끼칠 수 있고, 심지어 법치까지 영향을 받을 수 있다.","hl":["harm the company itself","even the rule of law"],"khl":["회사 자체에 해를 끼칠","심지어 법치까지"],"blocks":[{"t":"p","h":"but also가 이어 주는 것","x":["harm the company itself, but also third-parties(회사 자체뿐 아니라 제3자도 해친다).","harm(해치다) 하나가 뒤의 제3자, 경제, 대중까지 함께 거느린다.","benefit(이롭게 하다)을 넣으면 제3자와 대중도 이득을 본다는 말이 된다.","바로 앞 문장의 several negative effects(여러 부정적인 결과)와 정면으로 부딪친다."]},{"t":"p","h":"even이 보여 주는 방향","x":["even(심지어)은 \"이것까지?\" 하고 한 걸음 더 나아갈 때 쓴다.","회사에서 시작한 피해가 법치까지 번진다.","좋은 일이 번지는 그림이 아니다."]},{"t":"p","h":"함정","x":["hesitate to report(신고하기를 망설이다)는 fear to report(신고하기를 두려워하다)와 뜻이 통한다.","Shielding(막아 주는 것)도 Protecting(보호하는 것) 자리에 맞는 말이다."]}],"post":["harm(해치다) ↔ benefit(이롭게 하다)","피해 범위 = 회사에서 법치까지"],"or":["harm(해치다): 앞 문장 several negative effects(여러 부정적인 결과)를 이어받아 회사·제3자·대중의 피해를 말하므로 맞음.","divide(나누다): 회사와 경제, 대중을 '나눈다'는 말은 부정적인 결과의 내용이 되지 못함.","enrich(부유하게 하다): 회사와 대중을 부유하게 한다는 좋은 뜻이라 앞 문장 several negative effects(여러 부정적인 결과)와 부딪침.","reshape(재편하다): 모양을 바꾼다는 중립적인 말이라 negative effects(부정적인 결과)의 내용이 되지 못함."]}],"compquiz":[{"w":"put an end to","m":"~을 끝내다","it":[["stop","멈추다","s"],["celebrate","축하하다","n"],["prolong","연장하다, 오래 끌다","a"],["measure","측정하다","n"],["terminate","끝내다","s"],["continue","계속하다","a"],["decorate","장식하다","n"]]},{"w":"harm","m":"해치다","it":[["describe","묘사하다","n"],["damage","손상을 주다","s"],["benefit","~에 이익이 되다","a"],["deliver","배달하다","n"],["hurt","다치게 하다, 해치다","s"],["heal","치유하다","a"],["imitate","모방하다","n"]]}],"no":"23"},{"id":"2610g1-24","title":"어휘특훈 · 26년 10월 고1 24번","sub":"목표에 대한 환상의 함정","tpl":"Unfortunately, sometimes the idea of a goal is {disconnected} from the daily reality of what it will take to {achieve} it. We fall in love with the idea of a goal, pushing out of mind how {different} our day-to-day will need to be for us to make it happen. In fact, research even suggests that {positive} fantasies about our future can lead us to put {less} effort into our goals because our fantasies {provide} us with a {false} and {premature} sense of {accomplishment}. We {romanticize} a goal — falling in love with the idea of a change. In the process, we {gloss_over} the {intricacies} and challenges of integrating a complex new behavior into our life. As one study nicely summed it up, fantasizing about a positive future “{seduces} a person to {mentally} enjoy the {desired} future in the here and now” — and because we don’t {reflect_on} why our fantasy is not yet our future, “a {necessity} to act is not {induced}.”","fn":["*integrate: (삶 속에) 녹여 넣다, 통합하다","*sum up: 요약하다"],"mean":{"disconnected":"동떨어진, 분리된 (동사 disconnect(분리하다)의 과거분사형)","detached":"동떨어진, 분리된 (동사 detach(떼어 내다)의 과거분사형)","inseparable":"떼려야 뗄 수 없는","achieve":"이루다, 달성하다","attain":"이루다, 달성하다","abandon":"포기하다, 버리다","different":"다른","similar":"비슷한","positive":"긍정적인","optimistic":"낙관적인","negative":"부정적인","less":"더 적은 (little의 비교급)","more":"더 많은 (much의 비교급)","provide":"주다, 제공하다 (provide A with B: A에게 B를 주다)","supply":"공급하다, 주다 (supply A with B: A에게 B를 주다)","false":"거짓된, 가짜의","misleading":"오해를 부르는, 그릇된","genuine":"진짜의","premature":"너무 이른, 시기상조의","belated":"뒤늦은","accomplishment":"성취","achievement":"성취, 업적","romanticize":"낭만적으로 그리다, 미화하다","idealize":"이상화하다, 실제보다 아름답게 보다","belittle":"얕보다, 하찮게 여기다","gloss over":"얼버무리고 넘어가다, 대충 넘기다","overlook":"간과하다, 못 보고 넘기다","dwell on":"곱씹다, 오래 붙들고 생각하다","intricacies":"명사 intricacy(복잡한 세부 사항)의 복수형","seduces":"동사 seduce(꾀다, 유혹하다)의 3인칭 단수 현재형","forbids":"동사 forbid(금지하다)의 3인칭 단수 현재형","mentally":"마음속으로, 정신적으로","physically":"몸으로, 신체적으로","desired":"바라던 (동사 desire(바라다)의 과거분사형에서 온 형용사)","hoped-for":"바라던, 기대하던","dreaded":"두려워하던 (동사 dread(몹시 두려워하다)의 과거분사형에서 온 형용사)","reflect on":"~을 곰곰이 돌아보다","consider":"곰곰이 생각하다, 고려하다","necessity":"필요(성)","need":"필요","induced":"동사 induce(유발하다)의 과거분사형 (be induced: 유발되다)","triggered":"동사 trigger(촉발하다)의 과거분사형 (be triggered: 촉발되다)"},"sets":[{"items":[{"slots":[["disconnected","inseparable","a"],["positive"],["premature"],["gloss_over"],["necessity"]],"opts":["disconnected","derived","protected","released"],"om":["동떨어진","파생된","보호받는","풀려난"],"en":"Unfortunately, sometimes the idea of a goal is disconnected from the daily reality of what it will take to achieve it. We fall in love with the idea of a goal, pushing out of mind how different our day-to-day will need to be for us to make it happen.","ko":"안타깝게도, 때때로 목표라는 생각은 그것을 이루는 데 필요한 일상의 현실과 동떨어져 있다. 우리는 목표라는 생각에 푹 빠져서, 그것을 이루려면 우리의 일상이 얼마나 달라져야 하는지는 머릿속에서 밀어낸다.","hl":["disconnected from the daily reality","Unfortunately"],"khl":["일상의 현실과 동떨어져","안타깝게도"],"blocks":[{"t":"flow","h":"글의 첫 단추","x":["문제: 목표라는 생각과 실제 일상이 따로 놂","이유: 일상이 달라져야 한다는 건 잊음","결과: 가짜 성취감에 노력은 줄어듦","정리: 행동할 필요를 못 느낌"],"at":0},{"t":"p","h":"Unfortunately가 먼저 알려 주는 것","x":["Unfortunately(안타깝게도)는 나쁜 소식을 예고한다.","inseparable(떼려야 뗄 수 없는)을 넣으면 목표와 현실이 꼭 붙어 있다는 말이 된다.","그건 안타까운 일이 아니라 바람직한 일이다.","첫 문장부터 글이 꺼내는 문제가 거꾸로 선다."]}],"post":["disconnected(동떨어진) ↔ inseparable(떼려야 뗄 수 없는)","목표라는 생각 ≠ 매일의 현실"],"or":["disconnected(동떨어진): Unfortunately(안타깝게도)가 예고한 문제, 즉 목표라는 생각과 일상의 현실이 따로 논다는 말이라 맞음.","derived(파생된): 목표라는 생각이 현실에서 나왔다는 뜻이 되어, 안타까운 문제를 꺼내는 첫 문장이 되지 못함.","protected(보호받는): 목표가 현실로부터 보호받는다는 말은 일상의 변화를 잊는다는 다음 문장과 이어지지 않음.","released(풀려난): 목표가 현실에서 풀려났다는 말은 어색하고 글의 문제 제기를 담지 못함."]},{"slots":[["achieve"],["positive","negative","a"],["provide","supply","s"],["mentally"],["reflect_on","consider","s"]],"opts":["positive","frightening","realistic","shared"],"om":["긍정적인","무서운","현실적인","공유된"],"en":"In fact, research even suggests that positive fantasies about our future can lead us to put less effort into our goals because our fantasies provide us with a false and premature sense of accomplishment.","ko":"실제로 연구는 미래에 대한 긍정적인 환상이 우리가 목표에 노력을 덜 들이게 만들 수 있다는 것까지 보여 준다. 환상이 우리에게 거짓되고 너무 이른 성취감을 주기 때문이다.","hl":["positive fantasies","a false and premature sense of accomplishment"],"khl":["긍정적인 환상","거짓되고 너무 이른 성취감"],"blocks":[{"t":"pair","h":"같은 말을 두 번 하는 글","x":[["positive fantasies about our future","미래에 대한 긍정적인 환상 (셋째 문장)"],["fantasizing about a positive future","긍정적인 미래를 공상하는 것 (마지막 문장)"]]},{"t":"p","h":"negative가 안 되는 이유","x":["부정적인 환상은 일이 잘못될 거라고 상상하는 것이다.","그런 상상으로는 성취감이 생기지 않는다.","벌써 이룬 듯한 기분은 좋은 미래를 그릴 때 생긴다.","그래서 앞쪽도 positive(긍정적인)여야 마지막 문장과 맞는다."]},{"t":"p","h":"그대로 둬야 하는 두 단어","x":["supply A with B(A에게 B를 주다)는 provide A with B(A에게 B를 주다)와 같은 틀이다.","consider(곰곰이 생각하다)는 reflect on(돌아보다)과 같은 방향이다.","둘 다 문장 뜻을 그대로 살린다."]}],"post":["positive(긍정적인) ↔ negative(부정적인)","좋은 미래 공상 = 가짜 성취감의 출처"],"or":["positive(긍정적인): 마지막 문장의 fantasizing about a positive future(긍정적인 미래를 공상하는 것)와 같은 말이라 맞음.","frightening(무서운): 무서운 환상에서는 벌써 이룬 듯한 성취감이 생길 수 없음.","realistic(현실적인): 현실적으로 따져 보는 생각은 가짜 성취감을 주지 않고, 어려움을 대충 넘긴다는 글 흐름과 어긋남.","shared(공유된): 남과 나눈 환상이라는 말은 글의 초점인 '좋은 미래를 미리 즐김'과 상관이 없음."]},{"slots":[["different"],["less","more","a"],["accomplishment"],["romanticize","idealize","s"],["induced"]],"opts":["less","equal","double","steady"],"om":["더 적은","똑같은","두 배의","꾸준한"],"en":"In fact, research even suggests that positive fantasies about our future can lead us to put less effort into our goals because our fantasies provide us with a false and premature sense of accomplishment.","ko":"실제로 연구는 미래에 대한 긍정적인 환상이 우리가 목표에 노력을 덜 들이게 만들 수 있다는 것까지 보여 준다. 환상이 우리에게 거짓되고 너무 이른 성취감을 주기 때문이다.","hl":["put less effort into our goals","because"],"khl":["노력을 덜 들이게","때문이다"],"blocks":[{"t":"tap","h":"질문 하나","q":"벌써 이룬 기분이 들면 더 노력할까, 덜 노력할까?","a":["덜 노력한다.","배가 부르면 밥을 더 찾지 않는 것과 같다.","because(~ 때문에) 뒤의 이유(가짜 성취감)가 앞의 결과(less effort = 더 적은 노력)를 정한다."]},{"t":"p","h":"원인과 결과 잇기","x":["원인: 환상이 거짓되고 이른 성취감을 준다.","결과: 노력을 덜 들인다.","more(더 많은)를 넣으면 원인과 결과가 따로 논다.","research even suggests(연구는 ~까지 보여 준다)의 even(심지어)도 '좋은 상상이 오히려 해가 된다'는 놀라움을 담고 있다."]},{"t":"p","h":"함정","x":["idealize(이상화하다)는 romanticize(낭만적으로 그리다)와 거의 같은 말이다.","목표를 실제보다 아름답게 본다는 뜻이라 그대로 둔다."]}],"post":["less(더 적은) ↔ more(더 많은)","가짜 성취감 → 노력 줄어듦"],"or":["less(더 적은): 가짜 성취감이라는 원인에서 노력이 줄어든다는 결과가 나오므로 맞음.","equal(똑같은): 노력이 그대로라면 '연구는 ~까지 보여 준다'며 놀랄 이유가 없음.","double(두 배의): 성취감을 미리 느끼면 노력을 덜 하게 되므로 두 배라는 말은 원인과 정반대임.","steady(꾸준한): 꾸준한 노력은 좋은 결과라, 환상이 해가 된다는 글쓴이의 경고와 맞지 않음."]},{"slots":[["achieve"],["false"],["gloss_over","dwell on","a"],["seduces"],["desired"]],"opts":["gloss_over","look_into","point_out","work_through"],"om":["대충 넘기다","조사하다","지적하다","하나하나 해결해 나가다"],"en":"We romanticize a goal — falling in love with the idea of a change. In the process, we gloss over the intricacies and challenges of integrating a complex new behavior into our life.","ko":"우리는 목표를 낭만적으로 그린다. 변화라는 생각과 사랑에 빠지면서. 그 과정에서 우리는 복잡한 새 행동을 삶에 녹여 넣는 일의 복잡한 세부 사항과 어려움을 대충 넘겨 버린다.","hl":["gloss over the intricacies and challenges","In the process"],"khl":["복잡한 세부 사항과 어려움을 대충 넘겨 버린다","그 과정에서"],"blocks":[{"t":"p","h":"사랑에 빠진 사람의 눈","x":["사랑에 빠지면 상대의 단점이 잘 안 보인다.","목표에 반했을 때도 같다.","힘든 부분, 복잡한 부분은 눈에 안 들어온다.","그래서 gloss over(대충 넘기다)가 맞다."]},{"t":"p","h":"dwell on을 넣고 다시 읽기","x":["dwell on(곱씹다)은 어떤 것을 오래 붙들고 곱씹는 것이다.","\"그 과정에서 우리는 어려움을 곱씹는다\"가 된다.","목표를 낭만적으로 그리는 사람이 할 행동이 아니다.","In the process(그 과정에서)는 앞 문장의 '사랑에 빠지는 과정'을 그대로 이어받는다."]}],"post":["gloss over(대충 넘기다) ↔ dwell on(곱씹다)","목표에 반하면 어려움이 안 보임"],"or":["gloss over(대충 넘기다): 목표와 사랑에 빠지면 복잡한 부분이 눈에 안 들어오므로 맞음.","look into(조사하다): 어려움을 꼼꼼히 들여다본다는 뜻이라, 목표를 낭만적으로 그리는 모습과 반대임.","point out(지적하다): 어려움을 짚어 낸다면 일상이 달라져야 한다는 사실을 잊을 수 없음.","work through(하나하나 해결해 나가다): 어려움을 직접 해결한다면 노력을 덜 들인다는 글 내용과 정반대임."]},{"slots":[["disconnected","detached","s"],["premature","belated","a"],["intricacies"],["desired","hoped-for","s"],["necessity"]],"opts":["premature","hard-earned","gradual","humble"],"om":["너무 이른","힘들게 얻은","점진적인","소박한"],"en":"In fact, research even suggests that positive fantasies about our future can lead us to put less effort into our goals because our fantasies provide us with a false and premature sense of accomplishment. … As one study nicely summed it up, fantasizing about a positive future “seduces a person to mentally enjoy the desired future in the here and now”","ko":"실제로 연구는 미래에 대한 긍정적인 환상이 우리가 목표에 노력을 덜 들이게 만들 수 있다는 것까지 보여 준다. 환상이 우리에게 거짓되고 너무 이른 성취감을 주기 때문이다. … 한 연구가 잘 요약했듯이, 긍정적인 미래를 공상하는 것은 “사람을 꾀어 바라던 미래를 지금 이 자리에서 마음속으로 즐기게 한다.”","hl":["premature sense of accomplishment","in the here and now"],"khl":["너무 이른 성취감","지금 이 자리에서"],"blocks":[{"t":"flow","h":"성취감은 언제 오나","x":["목표를 세운다","환상 속에서 벌써 이룬다 (성취감이 여기서 옴)","실제 노력은 아직 시작도 안 함","진짜 결과는 한참 뒤"],"at":1},{"t":"p","h":"belated가 틀린 이유","x":["belated(뒤늦은)는 '뒤늦은'이다.","하지만 이 성취감은 일을 해내기도 전에 온다.","마지막 문장의 in the here and now(지금 이 자리에서)가 그 시점을 못 박는다.","늦은 게 아니라 너무 이른 것."]},{"t":"p","h":"함정","x":["detached from(~와 동떨어진)은 disconnected from(~와 동떨어진)과 같은 뜻이다.","hoped-for(바라던)는 desired(바라던) 자리에 들어가도 뜻이 같다.","바뀐 단어가 셋이라도 고칠 곳은 하나."]}],"post":["premature(너무 이른) ↔ belated(뒤늦은)","하기도 전에 미리 느끼는 성취감"],"or":["premature(너무 이른): 일을 해내기도 전에 in the here and now(지금 이 자리에서) 성취감이 오므로 맞음.","hard-earned(힘들게 얻은): 노력해서 얻은 성취감이라는 말이라, 아무것도 안 하고 환상으로 얻은 가짜 성취감과 정반대임.","gradual(점진적인): 조금씩 쌓이는 성취감은 실제 노력에서 오는 것이라 환상이 주는 성취감과 맞지 않음.","humble(소박한): 성취감의 크기를 말할 뿐이라, false(거짓된)와 짝을 이뤄 '가짜·미리'를 말하는 자리에 맞지 않음."]}],"quiz":[{"w":"disconnected","m":"동떨어진, 분리된","it":[["detached","분리된, 동떨어진","s"],["punctual","시간을 잘 지키는","n"],["connected","연결된","a"],["generous","관대한","n"],["separated","분리된","s"],["linked","연결된","a"],["ancient","고대의","n"]]},{"w":"positive","m":"긍정적인","it":[["rural","시골의","n"],["negative","부정적인","a"],["optimistic","낙관적인","s"],["fluent","유창한","n"],["pessimistic","비관적인","a"],["wooden","나무로 된","n"],["hopeful","희망에 찬","s"]]},{"w":"less","m":"더 적은","it":[["more","더 많은","a"],["fewer","(수가) 더 적은","s"],["older","더 나이 든","n"],["greater","더 큰, 더 많은","a"],["warmer","더 따뜻한","n"],["smaller","더 작은, 더 적은","s"],["stranger","더 이상한","n"]]},{"w":"gloss over","m":"대충 넘기다, 얼버무리다","it":[["show off","자랑하다","n"],["overlook","간과하다","s"],["dwell on","곱씹다","a"],["pick up","집어 들다","n"],["play down","대수롭지 않게 다루다","s"],["run into","우연히 만나다","n"],["emphasize","강조하다","a"]]},{"w":"premature","m":"너무 이른","it":[["early","이른","s"],["polite","공손한","n"],["belated","뒤늦은","a"],["salty","짠","n"],["untimely","때 이른","s"],["overdue","기한이 지난, 늦은","a"],["curious","호기심 많은","n"]]}]},{"items":[{"slots":[["achieve","abandon","a"],["less"],["provide"],["romanticize"],["mentally"]],"opts":["achieve","explain","delay","measure"],"om":["이루다","설명하다","미루다","측정하다"],"en":"Unfortunately, sometimes the idea of a goal is disconnected from the daily reality of what it will take to achieve it. We fall in love with the idea of a goal, pushing out of mind how different our day-to-day will need to be for us to make it happen.","ko":"안타깝게도, 때때로 목표라는 생각은 그것을 이루는 데 필요한 일상의 현실과 동떨어져 있다. 우리는 목표라는 생각에 푹 빠져서, 그것을 이루려면 우리의 일상이 얼마나 달라져야 하는지는 머릿속에서 밀어낸다.","hl":["what it will take to achieve it","make it happen"],"khl":["그것을 이루는 데 필요한","그것을 이루려면"],"blocks":[{"t":"tap","h":"질문 하나","q":"it(그것)은 무엇을 가리킬까?","a":["a goal(목표)이다.","목표를 두고 하는 일은 이루는 것이다.","abandon(포기하다)을 넣으면 '목표를 포기하는 데 필요한 일상의 현실'이 된다.","글 전체가 목표를 이루는 일 이야기라 맞지 않는다."]},{"t":"p","h":"다음 문장으로 확인","x":["make it happen(그것을 실현하다)이 achieve it(그것을 이루다)을 다시 말한 것이다.","같은 목표를 두 번 '이루는' 쪽으로 말하고 있다."]}],"post":["achieve(이루다) ↔ abandon(포기하다)","achieve it(그것을 이루다) = make it happen(그것을 실현하다)"],"or":["achieve(이루다): 다음 문장의 make it happen(그것을 실현하다)이 같은 말을 다시 하므로 맞음.","explain(설명하다): '목표를 설명하는 데 필요한 일상의 현실'이라는 말은 뜻이 서지 않음.","delay(미루다): 목표를 미루는 데 필요한 일상이라는 말이 되어 글 전체의 '목표 이루기' 이야기와 어긋남.","measure(측정하다): 목표를 재는 일은 매일의 일상이 달라져야 한다는 다음 문장과 이어지지 않음."]},{"slots":[["different"],["false","misleading","s"],["intricacies"],["seduces","forbids","a"],["induced","triggered","s"]],"opts":["seduces","warns","advises","reminds"],"om":["꾀다","경고하다","조언하다","상기시키다"],"en":"As one study nicely summed it up, fantasizing about a positive future “seduces a person to mentally enjoy the desired future in the here and now” — and because we don’t reflect on why our fantasy is not yet our future, “a necessity to act is not induced.”","ko":"한 연구가 잘 요약했듯이, 긍정적인 미래를 공상하는 것은 “사람을 꾀어 바라던 미래를 지금 이 자리에서 마음속으로 즐기게 한다.” 그리고 우리는 왜 환상이 아직 우리의 미래가 아닌지 돌아보지 않기 때문에 “행동할 필요성이 생기지 않는다.”","hl":["seduces a person to mentally enjoy","a necessity to act is not induced"],"khl":["사람을 꾀어","행동할 필요성이 생기지 않는다"],"blocks":[{"t":"p","h":"seduce라는 단어의 맛","x":["seduce(꾀다)는 달콤한 것으로 꾀어 끌고 가는 말이다.","공상이 우리를 꾀어 미래를 미리 즐기게 한다.","달콤하니까 빠져들고, 빠져드니까 행동은 안 한다.","forbid(금지하다)는 반대로 즐기지 못하게 막는 말이다."]},{"t":"p","h":"문장 끝과 맞춰 보기","x":["즐기는 걸 막았다면 오히려 '빨리 해야겠다'는 마음이 생긴다.","그런데 문장 끝은 a necessity to act is not induced(행동할 필요성이 생기지 않는다)다.","꾀어서 즐기게 해야 이 결과로 이어진다."]},{"t":"p","h":"고치면 안 되는 두 곳","x":["misleading(오해를 부르는)은 false(거짓된)처럼 '사실이 아닌' 쪽 단어다.","triggered(촉발된)는 induced(유발된)와 같은 뜻이라 문장 끝이 그대로다."]}],"post":["seduce(꾀다) ↔ forbid(금지하다)","공상의 달콤함 → 행동할 필요 X"],"or":["seduces(꾀다, 3인칭 단수형): 달콤한 공상이 사람을 꾀어 미래를 미리 즐기게 하므로 맞음.","warns(경고하다, 3인칭 단수형): 공상이 즐기라고 경고한다는 말은 어색하고, 행동할 필요를 못 느끼는 결과로 이어지지 않음.","advises(조언하다, 3인칭 단수형): 차분한 조언이 되어, 달콤하게 빠져들게 하는 공상의 유혹이 사라짐.","reminds(상기시키다, 3인칭 단수형): 무언가를 일깨우는 말이라 현실을 잊고 빠져드는 공상과 반대 방향임."]},{"slots":[["disconnected"],["different","similar","a"],["accomplishment","achievement","s"],["gloss_over"],["reflect_on"]],"opts":["different","pleasant","stable","relaxed"],"om":["다른","즐거운","안정된","느긋한"],"en":"We fall in love with the idea of a goal, pushing out of mind how different our day-to-day will need to be for us to make it happen.","ko":"우리는 목표라는 생각에 푹 빠져서, 그것을 이루려면 우리의 일상이 얼마나 달라져야 하는지는 머릿속에서 밀어낸다.","hl":["how different our day-to-day will need to be","pushing out of mind"],"khl":["얼마나 달라져야 하는지","머릿속에서 밀어낸다"],"blocks":[{"t":"pair","h":"생각 vs 현실","x":[["the idea of a goal","목표라는 생각 (머릿속 그림)"],["our day-to-day","우리의 일상 (실제로 바뀌어야 할 것)"]]},{"t":"p","h":"목표는 일상을 바꾼다","x":["시험 1등이 목표면 매일 공부 시간이 달라져야 한다.","운동이 목표면 아침 습관이 달라져야 한다.","similar(비슷한)를 넣으면 '일상이 얼마나 비슷해야 할지'가 되어 뜻이 서지 않는다.","우리가 머릿속에서 밀어내는 건 바로 '달라져야 한다'는 부담이다."]},{"t":"p","h":"함정","x":["achievement(성취)는 accomplishment(성취)와 같은 뜻이라 그대로 둔다."]}],"post":["different(다른) ↔ similar(비슷한)","목표 = 일상이 달라져야 이뤄짐"],"or":["different(다른): 목표를 이루려면 일상이 달라져야 하는데 그 부담을 머릿속에서 밀어낸다는 말이라 맞음.","pleasant(즐거운): 일상이 얼마나 즐거워야 하는지를 잊는다는 말은 목표와 현실의 차이를 말하지 못함.","stable(안정된): 목표를 이루려면 일상이 바뀌어야 하므로 '안정'은 방향이 반대임.","relaxed(느긋한): 목표를 이루려면 일상이 바뀌고 더 애써야 하는데, 느긋해야 한다는 건 방향이 반대임."]},{"slots":[["positive"],["premature"],["intricacies"],["mentally","physically","a"],["necessity"]],"opts":["mentally","publicly","briefly","legally"],"om":["마음속으로","공개적으로","잠깐","법적으로"],"en":"As one study nicely summed it up, fantasizing about a positive future “seduces a person to mentally enjoy the desired future in the here and now”","ko":"한 연구가 잘 요약했듯이, 긍정적인 미래를 공상하는 것은 “사람을 꾀어 바라던 미래를 지금 이 자리에서 마음속으로 즐기게 한다.”","hl":["mentally enjoy","in the here and now"],"khl":["마음속으로 즐기게","지금 이 자리에서"],"blocks":[{"t":"p","h":"어디에서 즐기는가","x":["공상은 머릿속에서만 일어난다.","몸은 아직 아무것도 하지 않았다.","그래서 즐기는 곳도 마음속, 곧 mentally(마음속으로)다.","physically(몸으로)를 넣으면 실제로 이룬 것처럼 된다.","그럼 공상이 아니라 진짜 성취다."]},{"t":"p","h":"the here and now","x":["the here and now(지금 이 자리)는 '지금 이 자리'다.","미래의 일을 지금 머릿속에서 미리 당겨 쓰는 모습이다."]}],"post":["mentally(마음속으로) ↔ physically(몸으로)","공상 = 머릿속에서만 미리 즐기기"],"or":["mentally(마음속으로): 공상은 머릿속에서만 일어나므로 미래를 마음속으로 미리 즐긴다는 말이 맞음.","publicly(공개적으로): 공상은 남 앞에서 하는 일이 아니라 머릿속 일이라 맞지 않음.","briefly(잠깐): 시간의 길이만 말할 뿐, 실제로는 아무것도 안 했다는 '머릿속 즐김'을 담지 못함.","legally(법적으로): 미래를 미리 즐기는 일과 법은 아무 관계가 없음."]},{"slots":[["provide"],["romanticize","belittle","a"],["gloss_over","overlook","s"],["desired"],["necessity","need","s"]],"opts":["romanticize","schedule","question","analyze"],"om":["낭만적으로 그리다","일정을 잡다","의문을 제기하다","분석하다"],"en":"We romanticize a goal — falling in love with the idea of a change. In the process, we gloss over the intricacies and challenges of integrating a complex new behavior into our life.","ko":"우리는 목표를 낭만적으로 그린다. 변화라는 생각과 사랑에 빠지면서. 그 과정에서 우리는 복잡한 새 행동을 삶에 녹여 넣는 일의 복잡한 세부 사항과 어려움을 대충 넘겨 버린다.","hl":["romanticize a goal","falling in love with the idea of a change"],"khl":["낭만적으로 그린다","사랑에 빠지면서"],"blocks":[{"t":"p","h":"줄표(—) 뒤가 설명이다","x":["줄표 뒤 falling in love with the idea of a change(변화라는 생각과 사랑에 빠지면서)가 앞말을 풀어 준다.","사랑에 빠지는 것 = 낭만적으로 그리는 것.","belittle(얕보다)을 넣으면 줄표 앞뒤가 정반대가 된다."]},{"t":"tap","h":"하나만 따져 보기","q":"얕보는 목표에 대해 가짜 성취감이 생길까?","a":["생기지 않는다.","목표를 아름답게 그려야 미리 이룬 듯 즐길 수 있다."]},{"t":"p","h":"함정","x":["overlook(간과하다)은 gloss over(대충 넘기다)처럼 못 보고 지나가는 쪽이다.","need(필요)는 necessity(필요성)와 같은 말이다."]}],"post":["romanticize(낭만적으로 그리다) ↔ belittle(얕보다)","목표와 사랑에 빠짐 = 미화"],"or":["romanticize(낭만적으로 그리다): 줄표 뒤 '변화라는 생각과 사랑에 빠짐'과 같은 말이라 맞음.","schedule(일정을 잡다): 일정을 짜는 건 현실적인 준비라, 어려움을 대충 넘긴다는 흐름과 반대임.","question(의문을 제기하다): 목표를 의심한다면 사랑에 빠졌다는 줄표 뒤 설명과 정반대임.","analyze(분석하다): 목표를 꼼꼼히 분석하면 복잡한 부분을 대충 넘길 수 없음."]}],"quiz":[{"w":"achieve","m":"이루다, 달성하다","it":[["borrow","빌리다","n"],["accomplish","이루다, 완수하다","s"],["fail","실패하다","a"],["whisper","속삭이다","n"],["attain","이루다, 달성하다","s"],["abandon","포기하다","a"],["decorate","장식하다","n"]]},{"w":"seduce","m":"꾀다, 유혹하다","it":[["tempt","유혹하다","s"],["bake","굽다","n"],["repel","쫓아 버리다, 물리치다","a"],["measure","측정하다","n"],["lure","꾀다, 유인하다","s"],["deter","단념시키다","a"],["repair","수리하다","n"]]},{"w":"different","m":"다른","it":[["brave","용감한","n"],["similar","비슷한","a"],["distinct","뚜렷이 다른","s"],["noisy","시끄러운","n"],["identical","동일한","a"],["dissimilar","비슷하지 않은, 다른","s"],["humble","겸손한","n"]]},{"w":"mentally","m":"마음속으로, 정신적으로","it":[["psychologically","심리적으로","s"],["loudly","큰 소리로","n"],["physically","몸으로, 신체적으로","a"],["safely","안전하게","n"],["intellectually","지적으로","s"],["bodily","육체적으로","a"],["honestly","솔직하게","n"]]},{"w":"romanticize","m":"낭만적으로 그리다, 미화하다","it":[["rent","빌리다, 임대하다","n"],["idealize","이상화하다","s"],["belittle","얕보다","a"],["polish","닦다, 윤을 내다","n"],["glamorize","미화하다","s"],["disparage","깎아내리다","a"],["repair","수리하다","n"]]}]}],"comp":[{"no":"24","slots":[["achieve","attain","s"],["false","genuine","a"],["accomplishment"],["seduces"],["reflect_on"]],"opts":["false","lasting","earned","shared"],"om":["거짓된","오래가는","노력으로 얻은","공유된"],"en":"In fact, research even suggests that positive fantasies about our future can lead us to put less effort into our goals because our fantasies provide us with a false and premature sense of accomplishment.","ko":"실제로 연구는 미래에 대한 긍정적인 환상이 우리가 목표에 노력을 덜 들이게 만들 수 있다는 것까지 보여 준다. 환상이 우리에게 거짓되고 너무 이른 성취감을 주기 때문이다.","hl":["a false and premature sense of accomplishment","fantasies"],"khl":["거짓되고 너무 이른 성취감","환상이"],"blocks":[{"t":"p","h":"환상이 주는 성취감의 정체","x":["fantasy(환상)는 실제로 일어나지 않은 일이다.","거기서 나온 성취감도 진짜일 수 없다.","genuine(진짜의)을 넣으면 공상만으로 진짜 성취를 얻은 셈이 된다.","그러면 노력을 덜 해도 문제가 없다.","글쓴이의 경고가 힘을 잃는다."]},{"t":"p","h":"함정","x":["attain(이루다)은 achieve(이루다)와 같은 뜻이다.","what it will take to attain it(그것을 이루는 데 필요한 것)도 자연스럽다."]}],"post":["false(거짓된) ↔ genuine(진짜의)","환상에서 나온 성취감 = 가짜"],"or":["false(거짓된): 환상은 실제로 일어나지 않은 일이라 거기서 나온 성취감도 가짜이므로 맞음.","lasting(오래가는): 오래가는 성취감은 환상 탓에 노력을 덜 한다는 경고의 이유가 되지 못함.","earned(노력으로 얻은): 환상은 노력 없이 생긴 것이라 '노력으로 얻은' 성취감이라는 말과 부딪침.","shared(공유된): 남과 나눈 성취감이라는 말은 개인의 환상 이야기와 상관이 없음."]},{"no":"24","slots":[["positive","optimistic","s"],["less"],["intricacies"],["desired","dreaded","a"],["induced"]],"opts":["desired","rejected","forgotten","unknown"],"om":["바라던","거부된","잊힌","알려지지 않은"],"en":"As one study nicely summed it up, fantasizing about a positive future “seduces a person to mentally enjoy the desired future in the here and now”","ko":"한 연구가 잘 요약했듯이, 긍정적인 미래를 공상하는 것은 “사람을 꾀어 바라던 미래를 지금 이 자리에서 마음속으로 즐기게 한다.”","hl":["the desired future","a positive future"],"khl":["바라던 미래","긍정적인 미래"],"blocks":[{"t":"pair","h":"한 문장 안의 짝","x":[["a positive future","긍정적인 미래 (공상하는 대상)"],["the desired future","바라던 미래 (즐기는 대상)"]]},{"t":"p","h":"dreaded가 틀린 이유","x":["dreaded(두려워하던)는 '두려워하던'이다.","두려운 미래를 즐길 수는 없다.","enjoy(즐기다)와 positive(긍정적인)가 모두 '바라던' 쪽을 가리킨다.","optimistic(낙관적인)은 positive(긍정적인)와 같은 쪽이라 고칠 필요가 없다."]}],"post":["desired(바라던) ↔ dreaded(두려워하던)","좋은 미래를 지금 미리 즐김"],"or":["desired(바라던): 앞의 a positive future(긍정적인 미래)를 다시 받는 말이고 enjoy(즐기다)와도 어울리므로 맞음.","rejected(거부된): 스스로 거부한 미래를 마음속으로 미리 즐긴다는 건 앞의 a positive future(긍정적인 미래)와 맞지 않음.","forgotten(잊힌): 잊힌 미래는 공상하며 미리 즐길 수 없음.","unknown(알려지지 않은): 모르는 미래를 마음속으로 미리 즐긴다는 건 긍정적인 미래를 그린다는 앞말과 맞지 않음."]}],"compquiz":[{"w":"false","m":"거짓된, 가짜의","it":[["brave","용감한","n"],["fake","가짜의","s"],["genuine","진짜의","a"],["weekly","매주의","n"],["untrue","사실이 아닌","s"],["true","참된, 사실인","a"],["salty","짠","n"]]},{"w":"desired","m":"바라던","it":[["wanted","원하던","s"],["frozen","얼어붙은","n"],["unwanted","원치 않는","a"],["narrow","좁은","n"],["longed-for","간절히 바라던","s"],["unwelcome","반갑지 않은, 원치 않는","a"],["rural","시골의","n"]]}],"no":"24"},{"id":"2610g1-29","title":"어휘특훈 · 26년 10월 고1 29번","sub":"불멸의 동물과 인간 노화 연구의 한계","tpl":"Since hydra and the immortal jellyfish don’t {exhibit} obvious signs of aging, they are often called biologically {immortal}. This doesn’t mean they don’t die. Nor does it even mean that they cannot die of biological causes. But, {unlike} almost every other animal, their {likelihood} of dying does not {increase} with age. Species such as hydra and the immortal jellyfish {excite} gerontologists because they may provide {clues} about how to {defeat} the aging process. But their property of being able to {regenerate} entire body parts, or even a whole organism, makes them more {similar} to trees than to us. Although we may learn some {fascinating} things about their {lack} of apparent aging, it is not at all clear how {relevant} those findings will be to human aging. Sometimes biology is {universal}, especially if it relates to {fundamental} mechanisms. But in other cases, even discoveries in rats or mice, which are mammals and biologically much {closer} to us, are {difficult} to translate into humans. It may be a very {long} time before any findings gained from hydra or jellyfish are useful to us.","fn":["*hydra: 히드라(민물에 사는 아주 작은 동물)","*gerontologist: 노인학자(노화를 연구하는 학자)","*organism: 생물, 유기체","*mechanism: 메커니즘, 작동 원리","*mammal: 포유류"],"mean":{"exhibit":"보이다, 드러내다","display":"보이다, 드러내다","conceal":"숨기다, 감추다","immortal":"죽지 않는, 불멸의","mortal":"언젠가 죽는, 죽을 운명의","unlike":"~와 달리 (전치사)","in contrast to":"~와 대조적으로, ~와 달리","likelihood":"가능성","probability":"확률, 가능성","increase":"커지다, 증가하다","rise":"오르다, 늘다","decline":"줄어들다","excite":"들뜨게 하다, 흥분시키다","intrigue":"흥미를 불러일으키다","bore":"지루하게 하다","clues":"명사 clue(단서)의 복수형","hints":"명사 hint(힌트, 단서)의 복수형","defeat":"이기다, 물리치다","conquer":"정복하다, 이겨 내다","accelerate":"가속하다, 앞당기다","regenerate":"재생하다, 다시 만들어 내다","similar":"비슷한","dissimilar":"비슷하지 않은, 다른","fascinating":"아주 흥미로운, 매혹적인","dull":"따분한, 재미없는","lack":"없음, 부족 (명사)","presence":"있음, 존재","relevant":"관련 있는","applicable":"적용할 수 있는, 들어맞는","universal":"보편적인, 모두에게 통하는","unique to each species":"종마다 따로 고유한 (unique: 고유한, 하나뿐인)","fundamental":"근본적인, 기본적인","basic":"기본적인","minor":"사소한, 중요하지 않은","closer":"형용사 close(가까운)의 비교급","nearer":"형용사 near(가까운)의 비교급","difficult":"어려운","challenging":"어려운, 힘든","straightforward":"간단한, 쉬운","long":"긴, 오랜","brief":"짧은"},"sets":[{"items":[{"slots":[["immortal","mortal","a"],["likelihood"],["clues"],["fascinating"],["closer"]],"opts":["immortal","ordinary","visible","fragile"],"om":["불멸의","평범한","눈에 보이는","연약한"],"or":["immortal(불멸의): 노화 징후가 안 보여 '불멸'이라 불리고, 바로 뒤에서 '죽지 않는다는 뜻은 아님'으로 오해를 바로잡으니 딱 맞음","ordinary(평범한): '생물학적으로 평범하다'고 불렸다면 뒤 문장이 바로잡을 오해가 없어 '죽지 않는다는 뜻은 아님'과 이어지지 않음","visible(눈에 보이는): 노화 징후가 안 보인다는 원인과 '생물학적으로 눈에 보인다'는 결과가 서로 연결되지 않음","fragile(연약한): 노화가 안 보이는 동물을 연약하다고 부를 근거가 없고, 뒤의 '죽지 않는다는 뜻은 아님'과도 안 맞음"],"en":"Since hydra and the immortal jellyfish don’t exhibit obvious signs of aging, they are often called biologically immortal. This doesn’t mean they don’t die. Nor does it even mean that they cannot die of biological causes.","ko":"히드라와 불멸의 해파리는 뚜렷한 노화의 징후를 보이지 않기 때문에, 흔히 생물학적으로 불멸이라고 불린다. 이것이 그들이 죽지 않는다는 뜻은 아니다. 그렇다고 생물학적 원인으로 죽을 수 없다는 뜻조차 아니다.","hl":["biologically immortal","This doesn’t mean they don’t die."],"khl":["생물학적으로 불멸이라고","죽지 않는다는 뜻은 아니다"],"blocks":[{"t":"flow","h":"글의 흐름 속 위치","x":["불멸이라 불림 (지금 여기)","하지만 죽긴 죽음","나이 따라 죽을 확률이 안 늘어날 뿐","학자들이 들뜸","하지만 사람과는 거리가 멂"],"at":0},{"t":"p","h":"바로 뒤 문장이 정답을 알려 준다","x":["This doesn’t mean they don’t die. (이것이 그들이 죽지 않는다는 뜻은 아니다.)","'불멸이라 불리지만 죽긴 한다'는 오해 바로잡기다.","mortal(언젠가 죽는)이라 불렸다면 바로잡을 오해가 없다.","당연한 말을 굳이 덧붙일 이유가 사라진다."]}],"post":["immortal(불멸의) ↔ mortal(언젠가 죽는)","불멸이라 불려도 죽긴 죽음"]},{"slots":[["exhibit","display","s"],["excite","bore","a"],["regenerate"],["relevant","applicable","s"],["long"]],"opts":["excite","confuse","disappoint","worry"],"om":["들뜨게 하다","혼란스럽게 하다","실망시키다","걱정시키다"],"or":["excite(들뜨게 하다): 노화를 이길 단서를 줄지도 모른다는 because(~ 때문에) 뒤 이유와 학자들의 반응이 자연스럽게 이어짐","confuse(혼란스럽게 하다): 노화를 이길 단서라는 좋은 소식이 학자들을 혼란스럽게 할 까닭이 없음","disappoint(실망시키다): 노화 정복의 단서는 학자들이 바라던 것이라 실망과는 반대 방향임","worry(걱정시키다): 단서를 줄지 모른다는 기대 섞인 이유와 걱정이라는 반응이 서로 맞지 않음"],"en":"Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.","ko":"히드라와 불멸의 해파리 같은 종은 노화 과정을 이겨 낼 방법에 대한 단서를 줄지도 몰라서 노인학자들을 들뜨게 한다.","hl":["excite gerontologists","provide clues about how to defeat the aging process"],"khl":["노인학자들을 들뜨게 한다","노화 과정을 이겨 낼 방법에 대한 단서를"],"blocks":[{"t":"p","h":"because 뒤의 이유부터 보기","x":["이유: 노화를 이길 단서를 줄지도 모른다.","노화를 연구하는 학자에게 이건 큰 선물이다.","그러니 반응은 들뜸(excite = 들뜨게 하다)이어야 한다.","bore(지루하게 하다)를 넣으면 이유와 반응이 따로 논다."]},{"t":"p","h":"함정 두 개","x":["display(보이다)는 exhibit(보이다)과 같은 뜻이다.","applicable(적용할 수 있는)은 relevant(관련 있는) 자리에서 '인간 노화에 얼마나 들어맞을지'로 뜻이 통한다.","둘 다 고치지 않는다."]}],"post":["excite(들뜨게 하다) ↔ bore(지루하게 하다)","노화 정복 단서 = 학자들이 들뜨는 이유"]},{"slots":[["unlike","in contrast to","s"],["defeat"],["lack","presence","a"],["universal"],["difficult"]],"opts":["lack","record","pattern","cost"],"om":["없음","기록","패턴","비용"],"or":["lack(없음): 첫 문장의 '뚜렷한 노화 징후를 보이지 않음'을 바꿔 말한 표현이라 딱 맞음","record(기록): '눈에 띄는 노화의 기록'이 있다는 말이 되어 노화가 안 보인다는 첫 문장과 부딪침","pattern(패턴): '눈에 띄는 노화 패턴'은 노화가 보인다는 뜻이라 노화가 안 보이는 동물 이야기와 반대임","cost(비용): '노화의 비용'은 본문 어디에도 근거가 없고, 노화가 안 보인다는 핵심을 담지 못함"],"en":"Since hydra and the immortal jellyfish don’t exhibit obvious signs of aging, they are often called biologically immortal. … Although we may learn some fascinating things about their lack of apparent aging, it is not at all clear how relevant those findings will be to human aging.","ko":"히드라와 불멸의 해파리는 뚜렷한 노화의 징후를 보이지 않기 때문에, 흔히 생물학적으로 불멸이라고 불린다. … 우리가 그들에게 눈에 띄는 노화가 없다는 점에 대해 흥미로운 사실을 알게 될 수도 있지만, 그 발견이 인간의 노화와 얼마나 관련이 있을지는 전혀 분명하지 않다.","hl":["their lack of apparent aging","don’t exhibit obvious signs of aging"],"khl":["눈에 띄는 노화가 없다는 점","뚜렷한 노화의 징후를 보이지 않기"],"blocks":[{"t":"pair","h":"같은 내용, 다른 표현","x":[["don’t exhibit obvious signs of aging","뚜렷한 노화의 징후를 보이지 않는다 (첫 문장)"],["their lack of apparent aging","그들에게 눈에 띄는 노화가 없음 (중간)"]]},{"t":"p","h":"presence를 넣으면","x":["'눈에 띄는 노화가 있음'이 된다.","첫 문장과 정면으로 부딪친다.","노화가 안 보여서 불멸이라 불린 동물이다.","글의 출발점이 사라진다."]},{"t":"p","h":"함정","x":["in contrast to(~와 대조적으로)는 unlike(~와 달리)를 풀어 쓴 말이라 그대로 둔다."]}],"post":["lack(없음) ↔ presence(있음)","노화가 안 보이는 동물 이야기"]},{"slots":[["increase"],["clues"],["similar"],["universal","unique to each species","a"],["closer"]],"opts":["universal","accidental","temporary","artificial"],"om":["보편적인","우연한","일시적인","인공적인"],"or":["universal(보편적인): 근본 메커니즘은 여러 종이 함께 가져 '사람에게도 통할 때'를 말하고, 뒤의 But in other cases(하지만 다른 경우에는)와 대조를 이룸","accidental(우연한): 근본 메커니즘과 관련될수록 우연하다는 건 말이 안 되고, But(하지만) 뒤 '안 통함'과 대조도 안 됨","temporary(일시적인): 생물학이 일시적이라는 말은 다른 종의 발견이 사람에게 통하느냐는 흐름과 관계없음","artificial(인공적인): 생물학 원리가 인공적이라는 건 근거가 없고, 종 사이에 통하는지와도 상관없음"],"en":"Sometimes biology is universal, especially if it relates to fundamental mechanisms. But in other cases, even discoveries in rats or mice, which are mammals and biologically much closer to us, are difficult to translate into humans.","ko":"생물학은 때때로 보편적이다. 특히 근본적인 메커니즘과 관련된 경우에 그렇다. 하지만 다른 경우에는, 포유류이고 생물학적으로 우리와 훨씬 가까운 쥐에게서 얻은 발견조차 인간에게 옮겨 적용하기 어렵다.","hl":["Sometimes biology is universal","But in other cases"],"khl":["생물학은 때때로 보편적이다","하지만 다른 경우에는"],"blocks":[{"t":"pair","h":"Sometimes와 But in other cases","x":[["Sometimes biology is universal","때로는 생물학이 보편적이다 → 다른 종의 발견이 사람에게도 통함"],["But in other cases, … difficult to translate into humans","하지만 다른 경우엔 사람에게 옮기기 어렵다 → 안 통함"]]},{"t":"p","h":"대조가 무너지는 자리","x":["두 문장은 '통할 때'와 '안 통할 때'를 맞세운다.","unique to each species(종마다 따로 고유한)를 넣으면 앞 문장도 '안 통함'이 된다.","But(하지만)으로 뒤집을 거리가 없어진다.","근본적인 메커니즘은 여러 종이 함께 가진 것이다.","그래서 '종마다 다르다'가 아니라 '보편적이다'와 어울린다."]}],"post":["universal(보편적인) ↔ unique to each species(종마다 따로 고유한)","통할 때 ↔ 안 통할 때"]},{"slots":[["likelihood","probability","s"],["defeat","conquer","s"],["fascinating"],["difficult","straightforward","a"],["long"]],"opts":["difficult","eager","ready","likely"],"om":["어려운","열망하는","준비된","~할 것 같은"],"or":["difficult(어려운): even(~조차)과 함께 '우리와 가까운 쥐의 발견조차 사람에게 옮기기 어렵다'는 경고가 되어 맞음","eager(열망하는): 발견(discoveries = 발견들)은 무언가를 열망할 수 없어 주어와 어울리지 않음","ready(준비된): '사람에게 옮길 준비가 됐다'면 even(~조차)의 놀라움도, 마지막 문장의 '오래 걸림'도 사라짐","likely(~할 것 같은): '사람에게 옮겨질 것 같다'는 긍정이 되어 마지막 문장의 '아주 오래 걸릴 수 있음'과 부딪침"],"en":"But in other cases, even discoveries in rats or mice, which are mammals and biologically much closer to us, are difficult to translate into humans.","ko":"하지만 다른 경우에는, 포유류이고 생물학적으로 우리와 훨씬 가까운 쥐에게서 얻은 발견조차 인간에게 옮겨 적용하기 어렵다.","hl":["are difficult to translate into humans","even discoveries in rats or mice"],"khl":["인간에게 옮겨 적용하기 어렵다","쥐에게서 얻은 발견조차"],"blocks":[{"t":"p","h":"even(~조차)이 하는 일","x":["even(~조차)은 '이것까지도'라는 놀라움을 붙인다.","쥐는 포유류이고 우리와 훨씬 가깝다.","그렇게 가까운 동물의 발견'조차' 사람에게 옮기기 어렵다.","그러니 히드라나 해파리는 더 어렵다는 말로 이어진다.","straightforward(간단한)를 넣으면 even(~조차)이 놀라움을 잃는다."]},{"t":"p","h":"고칠 곳은 하나","x":["probability(확률)는 likelihood(가능성)와 같은 뜻이다.","conquer(정복하다)는 defeat(이기다)처럼 노화를 이겨 낸다는 뜻이다."]}],"post":["difficult(어려운) ↔ straightforward(간단한)","가까운 쥐조차 어려움 → 해파리는 더 어려움"]}],"quiz":[{"w":"immortal","m":"죽지 않는, 불멸의","it":[["undying","죽지 않는","s"],["punctual","시간을 잘 지키는","n"],["mortal","언젠가 죽는","a"],["generous","관대한","n"],["eternal","영원한","s"],["perishable","썩기 쉬운, 소멸하는","a"],["rural","시골의","n"]]},{"w":"excite","m":"들뜨게 하다, 흥분시키다","it":[["repair","수리하다","n"],["thrill","열광시키다","s"],["bore","지루하게 하다","a"],["borrow","빌리다","n"],["stimulate","자극하다","s"],["calm","진정시키다","a"],["decorate","장식하다","n"]]},{"w":"lack","m":"없음, 부족","it":[["absence","없음, 부재","s"],["harvest","수확","n"],["abundance","풍부함","a"],["journey","여행","n"],["shortage","부족","s"],["chapter","(책의) 장","n"],["presence","있음, 존재","a"]]},{"w":"universal","m":"보편적인","it":[["fragile","깨지기 쉬운","n"],["general","일반적인","s"],["particular","특정한","a"],["salty","짠","n"],["worldwide","전 세계적인","s"],["local","국지적인, 한 지역에 한정된","a"],["polite","공손한","n"]]},{"w":"difficult","m":"어려운","it":[["easy","쉬운","a"],["loyal","충실한","n"],["hard","어려운","s"],["wooden","나무로 된","n"],["challenging","힘든, 도전적인","s"],["simple","간단한","a"],["sincere","진실한","n"]]}]},{"items":[{"slots":[["immortal"],["increase","decline","a"],["regenerate"],["lack"],["fundamental"]],"opts":["increase","shrink","depend","appear"],"om":["커지다","줄어들다","의존하다","나타나다"],"or":["increase(커지다): unlike(~와 달리) 보통 동물은 나이 들수록 죽을 위험이 커지니, 이 동물들은 '커지지 않음'이어야 대조가 됨","shrink(줄어들다): 줄어들지 않는다고 하면 위험이 커지는 보통 동물과 대조가 되지 않아 unlike(~와 달리)와 맞지 않음","depend(의존하다): depend는 on(~에)과 함께 써야 해서 depend with age(나이와 함께 의존하다)는 말 자체가 성립하지 않음","appear(나타나다): '죽을 가능성이 나이와 함께 나타나지 않음'은 뜻이 통하지 않음"],"en":"But, unlike almost every other animal, their likelihood of dying does not increase with age.","ko":"하지만 거의 모든 다른 동물과 달리, 그들이 죽을 가능성은 나이가 들어도 커지지 않는다.","hl":["does not increase with age","unlike almost every other animal"],"khl":["나이가 들어도 커지지 않는다","거의 모든 다른 동물과 달리"],"blocks":[{"t":"tap","h":"질문 하나","q":"보통 동물은 나이가 들수록 죽을 가능성이 어떻게 될까?","a":["커진다.","그래서 unlike(~와 달리)로 묶인 이 동물들은 '커지지 않는다'여야 한다.","decline(줄어들다)을 넣으면 '줄어들지 않는다'가 된다.","그건 다른 동물도 마찬가지라 unlike(~와 달리)를 쓸 이유가 없다."]},{"t":"p","h":"불멸의 진짜 뜻","x":["안 죽는다는 게 아니다.","나이 때문에 죽을 위험이 더 커지지 않는다는 것이다."]}],"post":["increase(커지다) ↔ decline(줄어들다)","나이 들어도 죽을 확률이 안 늘어남"]},{"slots":[["excite"],["clues","hints","s"],["similar","dissimilar","a"],["relevant"],["closer","nearer","s"]],"opts":["similar","grateful","harmful","loyal"],"om":["비슷한","감사하는","해로운","충실한"],"or":["similar(비슷한): 몸 전체를 다시 만드는 특성 때문에 사람보다 나무에 '더 비슷하다'는 비교가 than to us(우리보다)와 맞음","grateful(감사하는): 동물이 나무에게 감사한다는 건 재생 능력 이야기와 아무 관련 없음","harmful(해로운): '나무에 더 해롭다'는 말은 재생 능력과 연결되지 않고, 사람과 너무 다르다는 경고로도 안 이어짐","loyal(충실한): 나무에 충실하다는 건 말이 안 되고, 재생 능력을 사람·나무와 비교하는 흐름에서 벗어남"],"en":"But their property of being able to regenerate entire body parts, or even a whole organism, makes them more similar to trees than to us.","ko":"하지만 신체 부위 전체를, 심지어 생물 하나 전체를 재생할 수 있는 그들의 특성은 그들을 우리보다 나무에 더 가깝게 만든다.","hl":["more similar to trees than to us","regenerate entire body parts"],"khl":["우리보다 나무에 더 가깝게","생물 하나 전체를 재생할 수 있는"],"blocks":[{"t":"p","h":"나무를 떠올려 보기","x":["나무는 가지를 잘라도 새 가지가 난다.","잘라 낸 가지 하나를 꽂아 나무 한 그루로 키우기도 한다.","히드라도 몸 일부, 심지어 몸 전체를 다시 만든다.","사람은 팔이 잘리면 다시 자라지 않는다.","그러니 이 동물은 사람보다 나무와 비슷하다(similar = 비슷한)."]},{"t":"p","h":"But이 여는 문장","x":["앞 문장은 학자들이 들뜬다고 했다.","But(하지만)은 '그런데 문제가 있다'는 신호다.","문제는 이 동물이 사람과 너무 다르다는 점이다.","dissimilar(비슷하지 않은)를 넣으면 나무보다 사람에 가깝다는 말이 되어 But(하지만)의 경고가 사라진다."]},{"t":"p","h":"함정","x":["hints(힌트)는 clues(단서)와, nearer(더 가까운)는 closer(더 가까운)와 같은 뜻이다."]}],"post":["similar(비슷한) ↔ dissimilar(비슷하지 않은)","몸을 다시 만듦 = 사람보다 나무 쪽"]},{"slots":[["exhibit"],["unlike"],["fascinating"],["fundamental","basic","s"],["long","brief","a"]],"opts":["long","busy","quiet","strange"],"om":["오랜","바쁜","조용한","이상한"],"or":["long(오랜): 앞에서 '사람에게 통할지 분명치 않음, 쥐도 옮기기 어려움'을 쌓았으니 쓸모 있기까지 '오래 걸림'이 결론으로 맞음","busy(바쁜): a very busy time(아주 바쁜 시간)은 쓸모 있게 되기까지 걸리는 기간을 말하지 못함","quiet(조용한): a very quiet time(아주 조용한 시간)은 기간의 길이와 무관해 결론이 되지 못함","strange(이상한): a very strange time(아주 이상한 시간)은 연구가 쓸모 있어지기까지 얼마나 걸리는지 말하지 못함"],"en":"It may be a very long time before any findings gained from hydra or jellyfish are useful to us.","ko":"히드라나 해파리에게서 얻은 어떤 발견이 우리에게 쓸모 있게 되기까지는 아주 오랜 시간이 걸릴 수도 있다.","hl":["a very long time","before any findings gained from hydra or jellyfish are useful to us"],"khl":["아주 오랜 시간","쓸모 있게 되기까지는"],"blocks":[{"t":"flow","h":"글 전체의 결론","x":["불멸처럼 보이는 동물","학자들이 기대","하지만 사람과 너무 다름","쥐 연구도 사람에게 옮기기 어려움","그러니 쓸모 있기까지 오래 걸림 (결론)"],"at":4},{"t":"p","h":"brief가 틀린 이유","x":["앞에서 계속 '어렵다, 견이 인간의 노화와 얼마나 관련이 있을지는 전혀 분명하지 않다.","hl":["some fascinating things","Although"],"khl":["흥미로운 사실","있지만"],"blocks":[{"t":"p","h":"Although가 만드는 틀","x":["Although(~이긴 하지만) A, B는 'A이긴 하지만 B'다.","A에는 좋은 점, B에는 아쉬운 점이 온다.","A: 흥미로운 것을 배울 수 있다.","B: 사람 노화에 도움이 될지는 모른다.","dull(따분한)을 넣으면 A부터 아쉬운 점이 되어 '하지만'이 할 일이 없어진다."]},{"t":"tap","h":"앞 문장에 묻기","q":"학자들을 들뜨게 한 동물에게서 배우는 것이 따분할까?","a":["아니다.","앞에서 excite(들뜨게 하다)라고 했으니 배우는 것도 흥미롭다(fascinating = 아주 흥미로운)."]},{"t":"p","h":"함정","x":["rise(늘다)는 increase(커지다) 자리에 들어가도 뜻이 통한다.","does not rise with age(나이가 들어도 늘지 않는다)로 그대로 읽힌다."]}],"post":["fascinating(아주 흥미로운) ↔ dull(따분한)","흥미롭긴 한데 사람에게 통할지는 미지수"]}],"quiz":[{"w":"increase","m":"커지다, 증가하다","it":[["whisper","속삭이다","n"],["rise","오르다, 늘다","s"],["decrease","줄어들다","a"],["invite","초대하다","n"],["grow","커지다, 늘다","s"],["decline","줄어들다","a"],["polish","닦다","n"]]},{"w":"similar","m":"비슷한","it":[["alike","비슷한","s"],["urgent","긴급한","n"],["dissimilar","비슷하지 않은","a"],["brave","용감한","n"],["akin","유사한","s"],["different","다른","a"],["rural","시골의","n"]]},{"w":"long","m":"긴, 오랜","it":[["honest","정직한","n"],["lengthy","긴, 오랜","s"],["short","짧은","a"],["noisy","시끄러운","n"],["extended","길어진, 장기간의","s"],["curious","호기심 많은","n"],["brief","짧은","a"]]},{"w":"defeat","m":"이기다, 물리치다","it":[["conquer","정복하다","s"],["bake","굽다","n"],["surrender","항복하다","a"],["rent","빌리다","n"],["overcome","극복하다","s"],["lose","지다","a"],["paint","칠하다","n"]]},{"w":"fascinating","m":"아주 흥미로운, 매혹적인","it":[["wooden","나무로 된","n"],["captivating","매혹적인","s"],["dull","따분한","a"],["punctual","시간을 잘 지키는","n"],["intriguing","흥미를 자아내는","s"],["boring","지루한","a"],["frozen","얼어붙은","n"]]}]}],"comp":[{"no":"29","slots":[["exhibit","conceal","a"],["excite","intrigue","s"],["similar"],["lack"],["long"]],"opts":["exhibit","survive","resist","repeat"],"om":["보이다","견뎌 내다","저항하다","반복하다"],"or":["exhibit(보이다): Since(~ 때문에)가 원인을 이끄는데, 노화 징후를 '보이지 않아서' 불멸이라 불린다는 인과가 맞음","survive(견뎌 내다): '노화 징후를 견뎌 내지 않는다'는 말이 어색하고 불멸이라 불리는 원인이 되지 못함","resist(저항하다): don’t resist(저항하지 않는다)면 노화에 그대로 굴복한다는 뜻이 되어 불멸과 정반대임","repeat(반복하다): 노화 징후를 반복하지 않는다는 건 뜻이 통하지 않고 불멸의 이유가 되지 못함"],"en":"Since hydra and the immortal jellyfish don’t exhibit obvious signs of aging, they are often called biologically immortal. … Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.","ko":"히드라와 불멸의 해파리는 뚜렷한 노화의 징후를 보이지 않기 때문에, 흔히 생물학적으로 불멸이라고 불린다. … 히드라와 불멸의 해파리 같은 종은 노화 과정을 이겨 낼 방법에 대한 단서를 줄지도 몰라서 노인학자들을 들뜨게 한다.","hl":["don’t exhibit obvious signs of aging","biologically immortal"],"khl":["뚜렷한 노화의 징후를 보이지 않기","생물학적으로 불멸이라고"],"blocks":[{"t":"p","h":"Since가 잇는 원인과 결과","x":["Since(~이기 때문에)는 앞이 원인, 뒤가 결과다.","결과: 불멸이라고 불린다.","원인: 노화의 징후가 겉으로 안 보인다.","conceal(숨기다)을 넣으면 '노화 징후를 숨기지 않는다'가 된다.","노화가 훤히 드러나는 동물을 불멸이라 부를 리 없다."]},{"t":"p","h":"함정","x":["intrigue(흥미를 불러일으키다)는 excite(들뜨게 하다)와 같은 쪽 단어다.","학자들의 관심을 끈다는 뜻이 그대로 산다."]}],"post":["exhibit(보이다) ↔ conceal(숨기다)","노화가 안 보임 → 불멸이라 불림"]},{"no":"29","slots":[["likelihood"],["clues"],["universal"],["fundamental","minor","a"],["difficult","challenging","s"]],"opts":["fundamental","financial","seasonal","musical"],"om":["근본적인","재정의","계절의","음악의"],"or":["fundamental(근본적인): 여러 종에 똑같이 통하는 건 생명의 뿌리인 근본 메커니즘이라 '보편적'과 맞음","financial(재정의): 생물학 이야기에 돈과 관련된 메커니즘은 어울리지 않음","seasonal(계절의): 계절에 따른 메커니즘은 종을 넘어 보편적이라는 말의 근거가 되지 못함","musical(음악의): 생물학의 보편성과 음악의 메커니즘은 아무 관련 없음"],"en":"Sometimes biology is universal, especially if it relates to fundamental mechanisms.","ko":"생물학은 때때로 보편적이다. 특히 근본적인 메커니즘과 관련된 경우에 그렇다.","hl":["fundamental mechanisms","universal"],"khl":["근본적인 메커니즘","보편적이다"],"blocks":[{"t":"p","h":"보편적인 것은 어디에 있나","x":["모든 생물이 함께 쓰는 원리는 생명의 뿌리에 있다.","세포가 둘로 나뉘는 방식 같은 것이다.","그런 근본적인(fundamental) 부분일수록 여러 종에 똑같이 통한다.","minor(사소한)를 넣으면 '사소한 부분일수록 보편적'이 되어 거꾸로다."]},{"t":"p","h":"함정","x":["challenging(어려운)은 difficult(어려운)와 같은 뜻이라 고치지 않는다."]}],"post":["fundamental(근본적인) ↔ minor(사소한)","뿌리가 같은 원리일수록 모든 종에 통함"]}],"compquiz":[{"w":"exhibit","m":"보이다, 드러내다","it":[["display","보이다, 드러내다","s"],["borrow","빌리다","n"],["conceal","숨기다, 감추다","a"],["whisper","속삭이다","n"],["show","보여 주다","s"],["hide","숨기다","a"],["paint","칠하다","n"]]},{"w":"fundamental","m":"근본적인","it":[["basic","기본적인","s"],["nervous","긴장한","n"],["minor","사소한","a"],["sunny","화창한","n"],["essential","필수적인, 본질적인","s"],["secondary","부차적인","a"],["wooden","나무로 된","n"]]}],"no":"29"},{"id":"2610g1-30","title":"어휘특훈 · 26년 10월 고1 30번","sub":"발전소 보조금의 숨은 비용","tpl":"Subsidies, taxes, and regulations can all lead to power plants that pollute {less} by switching away from coal. In all cases, profits can be {higher} from making the transition, even taking the related costs into account. The power plants {prefer} subsidies over regulations or taxes. The reason is {obvious}. They prefer to {receive} money from the government rather than pay the costs themselves. But the “{expansion}” of their opportunity set through subsidies has to be {matched} by the {contraction} of the opportunity set of others. The electricity companies’ “freedom” is {increased} at the expense of the {ordinary} individual, who must {suffer} from increased taxation to pay for the subsidy. Moreover, from the perspective of {pure} efficiency, the subsidy {distorts} the economy because the electricity company is not facing the {full} costs of what it does, even if it is {successful} in limiting emissions. Indeed, electricity prices may end up {lower} than they should be and electricity consumption higher, which will {worsen} global warming, even though the emissions per unit of electricity have been {reduced}.","fn":["*subsidy: 보조금","*opportunity set: 선택 가능한 기회의 범위","*emission: 배출(량)"],"mean":{"less":"부사 little(적게)의 비교급, 더 적게","more":"부사 much(많이)의 비교급, 더 많이","higher":"형용사 high(높은)의 비교급, 더 높은","greater":"형용사 great(큰)의 비교급, 더 큰","prefer":"선호하다","favor":"선호하다, 더 좋아하다","obvious":"분명한, 뻔한","clear":"분명한","unclear":"분명하지 않은","receive":"받다","accept":"받아들이다, 받다","refuse":"거절하다","expansion":"확대, 확장","growth":"성장, 증가","narrowing":"동사 narrow(좁히다)의 -ing형, 좁아짐(동명사)","matched":"동사 match(~에 맞먹다, 짝을 맞추다)의 과거분사형","balanced":"동사 balance(균형을 맞추다)의 과거분사형","contraction":"축소, 수축","reduction":"감소, 축소","enlargement":"확대, 확장","increased":"동사 increase(늘리다)의 과거분사형","enhanced":"동사 enhance(높이다, 강화하다)의 과거분사형","diminished":"동사 diminish(줄이다)의 과거분사형","ordinary":"평범한, 보통의","average":"보통의, 평균적인","suffer":"고통받다, 시달리다","benefit":"이익을 얻다, 덕을 보다","pure":"순수한","distorts":"동사 distort(왜곡하다)의 3인칭 단수 현재형","stabilizes":"동사 stabilize(안정시키다)의 3인칭 단수 현재형","full":"전체의, 완전한","total":"전체의, 총","successful":"성공한, 성공적인","effective":"효과적인","powerless":"무력한, 힘을 못 쓰는","lower":"형용사 low(낮은)의 비교급, 더 낮은","steeper":"형용사 steep((값이) 터무니없이 비싼, 가파른)의 비교급","worsen":"악화시키다","aggravate":"악화시키다","mitigate":"완화하다","reduced":"동사 reduce(줄이다)의 과거분사형","cut":"동사 cut(줄이다, 삭감하다)의 과거분사형(원형과 모양이 같음)","raised":"동사 raise(올리다)의 과거분사형"},"sets":[{"items":[{"slots":[["less","more","a"],["prefer"],["receive"],["ordinary"],["full"]],"opts":["less","longer","harder","faster"],"om":["더 적게","더 오래","더 심하게","더 빨리"],"or":["less(더 적게): 석탄에서 벗어나는 건 오염을 줄이는 방법이라 '오염을 덜 일으킴'이 맞음","longer(더 오래): '더 오래 오염시킨다'는 석탄을 끊은 결과로 말이 안 되고, 보조금·세금·규제의 목적과도 반대임","harder(더 심하게): 석탄을 끊었는데 오염이 더 심해진다는 건 원인과 결과가 거꾸로임","faster(더 빨리): '더 빨리 오염시킨다'는 석탄을 끊는 효과와 정반대라 글의 출발점과 부딪침"],"en":"Subsidies, taxes, and regulations can all lead to power plants that pollute less by switching away from coal.","ko":"보조금, 세금, 규제는 모두 발전소가 석탄에서 벗어나 오염을 덜 일으키게 만들 수 있다.","hl":["pollute less","switching away from coal"],"khl":["오염을 덜 일으키게","석탄에서 벗어나"],"blocks":[{"t":"flow","h":"글 전체 지도","x":["출발: 세 가지 수단 모두 오염을 줄임","발전소의 선택: 보조금이 제일 좋음","문제 1: 보통 사람이 세금을 더 냄","문제 2: 전기 값↓, 전기 사용↑","결론: 지구 온난화가 오히려 악화"],"at":0},{"t":"p","h":"석탄을 버리면 생기는 일","x":["석탄은 태울 때 오염 물질이 많이 나오는 연료다.","switching away from coal(석탄에서 벗어나기)은 오염을 줄이는 방법이다.","more(더 많이)를 넣으면 석탄을 끊었더니 오염이 늘었다는 말이 된다.","원인과 결과가 거꾸로 붙는다."]}],"post":["less(더 적게) ↔ more(더 많이)","석탄 끊기 = 오염 줄이기"]},{"slots":[["higher","greater","s"],["obvious","unclear","a"],["matched","balanced","s"],["pure"],["successful"]],"opts":["obvious","complex","personal","historical"],"om":["분명한","복잡한","개인적인","역사적인"],"or":["obvious(분명한): 바로 다음 문장에서 '돈은 내기보다 받는 게 좋다'는 누구나 아는 이유를 짧게 밝히니 '뻔하다'가 맞음","complex(복잡한): 이유가 복잡하다면 길게 풀어야 하는데, 뒤 문장은 한 줄로 간단히 끝남","personal(개인적인): 발전소(회사)가 보조금을 좋아하는 이유는 돈 문제지 개인적인 사정이 아님","historical(역사적인): 뒤에 나오는 이유는 역사와 관계없이 '돈을 받는 게 낫다'는 계산임"],"en":"The power plants prefer subsidies over regulations or taxes. The reason is obvious. They prefer to receive money from the government rather than pay the costs themselves.","ko":"발전소들은 규제나 세금보다 보조금을 선호한다. 이유는 분명하다. 그들은 비용을 스스로 치르기보다 정부에서 돈을 받는 쪽을 선호한다.","hl":["The reason is obvious.","receive money from the government"],"khl":["이유는 분명하다.","정부에서 돈을 받는 쪽"],"blocks":[{"t":"pair","h":"예고와 바로 이어지는 답","x":[["The reason is obvious.","이유는 분명하다. (이유가 나온다는 예고)"],["They prefer to receive money ... rather than pay the costs themselves.","돈을 내기보다 받고 싶다. (이유 공개)"]]},{"t":"p","h":"unclear가 안 되는 이유","x":["unclear(분명하지 않은)라고 해 놓고 바로 다음 줄에 이유를 시원하게 말한다.","돈을 내는 것보다 받는 게 좋다는 건 누구나 아는 이유다.","그래서 필자는 \"뻔하다\"고 짧게 말하고 넘어간다."]},{"t":"p","h":"그대로 두는 두 단어","x":["greater(더 큰)는 이윤이 higher(더 높은)와 같은 방향이다.","balanced by(~로 균형이 맞춰지는)는 matched by(~와 짝이 맞춰지는)와 같은 뜻이다.","한쪽이 늘면 다른 쪽이 준다는 그림은 그대로다."]}],"post":["obvious(분명한) ↔ unclear(분명하지 않은)","돈은 내기보다 받는 게 좋음 = 뻔한 이유"]},{"slots":[["receive"],["expansion","narrowing","a"],["ordinary","average","s"],["distorts"],["worsen"]],"opts":["expansion","regulation","definition","protection"],"om":["확대","규제","정의","보호"],"or":["expansion(확대): 보조금으로 발전소의 기회가 늘고, 그만큼 다른 사람의 contraction(축소)과 시소처럼 맞물려 맞음","regulation(규제): 보조금은 돈을 주는 것이라 기회를 '규제'한다는 건 맞지 않고, contraction(축소)과 짝도 안 됨","definition(정의): 기회 범위의 '정의'는 늘고 주는 양이 아니라서 다른 사람의 축소와 맞물리지 않음","protection(보호): '기회 범위의 보호'는 늘어남을 말하지 못해 축소와 맞세우는 시소 그림이 깨짐"],"en":"But the “expansion” of their opportunity set through subsidies has to be matched by the contraction of the opportunity set of others.","ko":"하지만 보조금을 통한 그들의 기회 범위 '확대'는 다른 사람들의 기회 범위 축소와 짝을 이룰 수밖에 없다.","hl":["expansion","contraction"],"khl":["확대","축소"],"blocks":[{"t":"p","h":"시소 위의 두 단어","x":["발전소가 보조금을 받으면 쓸 수 있는 돈이 늘어난다.","그 돈은 하늘에서 떨어지지 않는다.","누군가의 몫이 그만큼 줄어든다.","그래서 한쪽은 expansion(확대), 다른 쪽은 contraction(축소)이다."]},{"t":"p","h":"narrowing을 넣고 다시 읽기","x":["\"보조금으로 그들의 기회가 좁아진다\"가 된다.","돈을 받았는데 기회가 좁아질 리 없다.","게다가 다른 사람들 쪽도 축소라서 시소가 아니라 둘 다 내려앉는다."]},{"t":"p","h":"함정","x":["average(보통의)는 ordinary(평범한) 자리에 넣어도 \"보통 사람\"이라는 뜻이 그대로 살아 있다."]}],"post":["expansion(확대) ↔ narrowing(좁아짐)","발전소 몫↑ = 다른 사람 몫↓"]},{"slots":[["contraction"],["increased"],["suffer","benefit","a"],["full"],["reduced"]],"opts":["suffer","escape","recover","withdraw"],"om":["고통받다","벗어나다","회복하다","물러나다"],"or":["suffer(시달리다): at the expense of(~을 희생시켜) 뒤 보통 사람은 손해 보는 쪽이라 늘어난 세금에 '시달림'이 맞음","escape(벗어나다): 보조금을 대려면 세금을 내야 하니 늘어난 세금에서 벗어날 수 없음","recover(회복하다): 세금이 늘어 손해를 보는 중이라 '회복'은 이 사람의 처지와 반대임","withdraw(물러나다): 세금은 피하거나 물러날 수 있는 게 아니라서 '보조금을 대기 위해'와 연결되지 않음"],"en":"The electricity companies’ “freedom” is increased at the expense of the ordinary individual, who must suffer from increased taxation to pay for the subsidy.","ko":"전력 회사들의 '자유'는 평범한 개인을 희생시켜 늘어나는데, 이 개인은 보조금을 대기 위해 늘어난 세금에 시달려야 한다.","hl":["suffer from increased taxation","at the expense of"],"khl":["늘어난 세금에 시달려야","희생시켜"],"blocks":[{"t":"p","h":"at the expense of가 정하는 방향","x":["at the expense of(~을 희생시켜)는 \"~을 희생시켜, ~의 손해로\"라는 뜻이다.","회사가 얻는 만큼 보통 사람은 잃는다.","그 뒤에 오는 who(그 사람은) 이하는 보통 사람이 무엇을 잃는지 설명한다.","손해 보는 사람이니 suffer(시달리다)가 맞다."]},{"t":"tap","h":"질문 하나","q":"정부가 발전소에 주는 보조금은 어디서 나올까?","a":["국민이 낸 세금에서 나온다.","보조금이 커지면 세금도 커진다.","세금이 늘어 이득을 보는 benefit(이익을 얻다)은 이 사람의 처지와 맞지 않는다."]}],"post":["suffer(시달리다) ↔ benefit(이익을 얻다)","보조금의 지갑 = 보통 사람의 세금"]},{"slots":[["prefer","favor","s"],["contraction"],["distorts","stabilizes","a"],["full","total","s"],["lower"]],"opts":["distorts","supports","measures","rescues"],"om":["왜곡하다","지탱하다","측정하다","구해 내다"],"or":["distorts(왜곡하다): Moreover(게다가)로 보조금의 문제점을 하나 더 얹고, 비용을 다 내지 않아 경제가 비틀린다는 because(~ 때문에) 이유와 맞음","supports(지탱하다): 보조금이 경제를 지탱한다는 칭찬은 Moreover(게다가)가 잇는 문제점 나열과 방향이 반대임","measures(측정하다): 보조금이 경제를 측정한다는 건 말이 안 되고, 효율성 관점의 문제점이 되지 못함","rescues(구해 내다): 경제를 구한다는 칭찬은 '전체 비용을 마주하지 않음'이라는 문제와 이어지지 않음"],"en":"Moreover, from the perspective of pure efficiency, the subsidy distorts the economy because the electricity company is not facing the full costs of what it does, even if it is successful in limiting emissions.","ko":"게다가 순수한 효율성의 관점에서 보면, 보조금은 경제를 왜곡한다. 전력 회사가 배출을 제한하는 데 성공하더라도, 자기가 하는 일의 전체 비용을 마주하지 않기 때문이다.","hl":["distorts the economy","not facing the full costs"],"khl":["경제를 왜곡한다","전체 비용을 마주하지 않기"],"blocks":[{"t":"p","h":"Moreover가 알려 주는 것","x":["Moreover(게다가)는 같은 방향의 말을 하나 더 얹는 연결어다.","앞에서 필자는 보조금의 문제점(보통 사람의 세금 부담)을 말했다.","그러니 이 문장도 보조금의 문제점이어야 한다.","stabilizes(안정시키다)는 칭찬이라 방향이 반대다."]},{"t":"p","h":"because 뒤를 먼저 읽기","x":["회사가 자기 비용을 다 내지 않는다.","비용 일부를 남이 대신 낸다는 뜻이다.","가격과 행동이 원래 모습에서 비틀린다.","그게 distort(왜곡하다)다."]},{"t":"p","h":"함정","x":["favor A over B(B보다 A를 선호하다)는 prefer A over B(B보다 A를 선호하다)처럼 \"B보다 A를 선호하다\"이다.","total costs(전체 비용)도 full costs(전체 비용)와 같은 말이다."]}],"post":["distort(왜곡하다) ↔ stabilize(안정시키다)","비용을 남이 대신 냄 = 경제가 비틀림"]}],"quiz":[{"w":"less","m":"더 적은, 더 적게","it":[["older","더 나이 든","n"],["fewer","(수가) 더 적은","s"],["more","더 많은","a"],["quieter","더 조용한","n"],["lesser","더 적은, 덜한","s"],["greater","더 큰, 더 많은","a"],["busier","더 바쁜","n"]]},{"w":"obvious","m":"분명한","it":[["evident","분명한","s"],["generous","관대한","n"],["obscure","불분명한","a"],["ancient","고대의","n"],["apparent","명백한","s"],["unclear","분명하지 않은","a"],["noisy","시끄러운","n"]]},{"w":"expansion","m":"확대","it":[["invention","발명","n"],["growth","성장, 증가","s"],["contraction","축소","a"],["ceremony","의식","n"],["enlargement","확대","s"],["shrinkage","줄어듦, 수축","a"],["rumor","소문","n"]]},{"w":"suffer","m":"고통받다","it":[["decorate","장식하다","n"],["thrive","번성하다","a"],["endure","견디다, 겪다","s"],["whisper","속삭이다","n"],["undergo","겪다","s"],["flourish","번창하다","a"],["borrow","빌리다","n"]]},{"w":"distort","m":"왜곡하다","it":[["twist","비틀다, 왜곡하다","s"],["invite","초대하다","n"],["straighten","바로잡다, 똑바로 하다","a"],["skew","왜곡하다, 비뚤게 하다","s"],["polish","닦다","n"],["warp","뒤틀다, 왜곡하다","s"],["greet","인사하다","n"]]}]},{"items":[{"slots":[["less"],["receive","refuse","a"],["matched"],["suffer"],["successful"]],"opts":["receive","borrow","return","lose"],"om":["받다","빌리다","돌려주다","잃다"],"or":["receive(받다): 발전소는 보조금(정부 돈)을 가장 좋아하고, rather than(~보다는) 뒤 '직접 비용 내기'와 반대라 맞음","borrow(빌리다): 보조금은 갚지 않는 돈이라 '빌린다'는 말과 맞지 않음","return(돌려주다): 정부 돈을 돌려주는 쪽을 좋아한다면 보조금을 선호한다는 앞 문장과 정반대임","lose(잃다): 정부 돈을 잃는 쪽을 좋아할 리 없고, 보조금을 선호한다는 앞 문장과도 반대임"],"en":"They prefer to receive money from the government rather than pay the costs themselves.","ko":"그들은 비용을 스스로 치르기보다 정부에서 돈을 받는 쪽을 선호한다.","hl":["receive money","rather than pay the costs themselves"],"khl":["돈을 받는 쪽","비용을 스스로 치르기보다"],"blocks":[{"t":"pair","h":"rather than이 가르는 두 길","x":[["receive money from the government","정부에서 돈을 받기 (보조금)"],["pay the costs themselves","비용을 직접 내기 (세금·규제)"]]},{"t":"p","h":"refuse를 넣고 다시 읽기","x":["\"정부 돈을 거절하는 쪽을 선호한다\"가 된다.","바로 앞 문장은 발전소가 보조금을 제일 좋아한다고 했다.","보조금을 좋아하면서 정부 돈을 거절할 수는 없다.","돈을 받는 쪽이 이 글의 출발점이다."]}],"post":["receive(받다) ↔ refuse(거절하다)","보조금 = 정부에서 받는 돈"]},{"slots":[["obvious"],["expansion","growth","s"],["contraction","enlargement","a"],["pure"],["successful","effective","s"]],"opts":["contraction","protection","evaluation","improvement"],"om":["축소","보호","평가","향상"],"or":["contraction(축소): But(하지만)으로 반전이 오고, 발전소 몫의 expansion(확대)만큼 남의 몫이 '줄어든다'는 시소 그림이 맞음","protection(보호): 다른 사람 기회의 '보호'라면 손해 보는 사람이 없어 But(하지만)의 반전이 사라짐","evaluation(평가): 기회 범위의 '평가'는 늘고 주는 양이 아니라서 확대와 맞물리지 않음","improvement(향상): 남의 기회도 나아진다면 모두가 이득이라 보통 사람이 세금에 시달린다는 다음 문장과 부딪침"],"en":"But the “expansion” of their opportunity set through subsidies has to be matched by the contraction of the opportunity set of others.","ko":"하지만 보조금을 통한 그들의 기회 범위 '확대'는 다른 사람들의 기회 범위 축소와 짝을 이룰 수밖에 없다.","hl":["the contraction of the opportunity set of others","has to be matched by"],"khl":["다른 사람들의 기회 범위 축소","짝을 이룰 수밖에 없다"],"blocks":[{"t":"p","h":"피자 한 판 나누기","x":["피자 한 판을 여럿이 나눈다고 해 보자.","한 사람이 조각을 더 가져가면 남은 사람 몫은 줄어든다.","보조금도 같다. 발전소 몫이 커지면 다른 사람 몫이 작아진다.","enlargement(확대)를 넣으면 모두의 몫이 함께 커진다는 말이 된다."]},{"t":"p","h":"But이 미리 알려 주는 것","x":["But(하지만)은 앞의 좋은 얘기를 뒤집는 신호다.","발전소는 좋지만, 다른 사람은 손해라는 반전이 온다.","반전의 핵심이 바로 contraction(축소)이다."]},{"t":"p","h":"함정","x":["growth(증가)는 expansion(확대)과 같은 방향이다.","effective in(~에 효과적인)도 successful in(~에 성공한)과 뜻이 통한다.","고칠 단어는 하나뿐."]}],"post":["contraction(축소) ↔ enlargement(확대)","발전소 조각↑ = 남의 조각↓"]},{"slots":[["receive","accept","s"],["increased","diminished","a"],["ordinary"],["distorts"],["lower"]],"opts":["increased","examined","limited","questioned"],"om":["늘어난","검토된","제한된","의문시되는"],"or":["increased(늘어난): at the expense of(~을 희생시켜)는 한쪽이 얻을 때 쓰니 회사의 '자유'는 늘어나야 맞음","examined(검토된): 회사의 자유가 검토된다는 건 보통 사람을 희생시킨다는 말과 연결되지 않음","limited(제한된): at the expense of(~을 희생시켜)는 한쪽이 얻을 때 쓰는데, 자유가 제한되면 회사가 얻는 게 없어 맞지 않음","questioned(의문시되는): 자유가 의문시된다면 회사가 얻는 게 없어 at the expense of(~을 희생시켜)와 안 맞음"],"en":"The electricity companies’ “freedom” is increased at the expense of the ordinary individual, who must suffer from increased taxation to pay for the subsidy.","ko":"전력 회사들의 '자유'는 평범한 개인을 희생시켜 늘어나는데, 이 개인은 보조금을 대기 위해 늘어난 세금에 시달려야 한다.","hl":["“freedom” is increased","at the expense of"],"khl":["늘어나는데","희생시켜"],"blocks":[{"t":"p","h":"따옴표에 담긴 필자의 속마음","x":["freedom(자유)에 따옴표가 붙어 있다.","필자가 이 자유를 곱게 보지 않는다는 표시다.","남의 세금으로 생긴 자유이기 때문이다.","그래도 회사 입장에서 자유가 늘어난 건 사실이다."]},{"t":"p","h":"diminished가 틀린 이유","x":["at the expense of(~을 희생시켜)는 한쪽이 얻고 다른 쪽이 잃을 때 쓴다.","회사의 자유가 줄었다면 보통 사람을 희생시킬 이유가 없다.","앞 문장의 expansion(확대)과도 이어져야 한다."]},{"t":"p","h":"함정","x":["accept money(돈을 받다)는 receive money(돈을 받다)와 같은 뜻이라 그대로 둔다."]}],"post":["increased(늘어난) ↔ diminished(줄어든)","회사의 \"자유\" = 남의 세금으로 생긴 자유"]},{"slots":[["higher"],["matched"],["suffer"],["successful","powerless","a"],["worsen"]],"opts":["successful","interested","confident","involved"],"om":["성공 ","a"],["educated"],["potential"]],"opts":["scarcity","competition","diversity","pollution"],"om":["부족","경쟁","다양성","오염"],"or":["scarcity(부족): however(그런데) 앞의 '늘 충분하지 않다'와 반대로 '부족함이 없다'가 되어 맞음","competition(경쟁): 앞 문장은 경쟁이 아니라 물건이 모자란 이야기라 however(그러나)의 대비가 안 됨","diversity(다양성): 뒤에 나오는 음식 복제·순간 이동은 다양성이 아니라 넉넉함의 근거임","pollution(오염): 글 어디에도 환경 이야기가 없어 앞뒤 어느 문장과도 이어지지 않음"],"en":"All of classical economics is based on the notion that there isn’t usually enough of anything to give everyone everything they want or need. … In Star Trek, however, there isn’t much scarcity.","ko":"고전 경제학 전체는 모든 사람에게 원하거나 필요한 모든 것을 줄 만큼 충분한 것은 대개 없다는 생각에 바탕을 두고 있다. … 그런데 스타트렉에는 부족함이 별로 없다.","hl":["there isn’t much scarcity","there isn’t usually enough of anything"],"khl":["부족함이 별로 없다","충분한 것은 대개 없다"],"blocks":[{"t":"pair","h":"두 세계 나란히 놓기","x":[["Our world: there isn’t usually enough of anything","우리 세계: 대개 무엇이든 충분하지 않음 (부족)"],["Star Trek: there isn’t much scarcity","스타트렉: 부족함이 별로 없음 (풍요)"]]},{"t":"p","h":"abundance가 틀린 이유","x":["however(그런데)는 앞과 반대되는 얘기를 꺼내는 신호다.","앞은 \"늘 부족하다\"였다.","그러니 스타트렉은 \"부족하지 않다\"여야 한다.","abundance(풍부함)를 넣으면 \"풍부함이 별로 없다\"가 되어 우리 세계와 똑같아진다."]},{"t":"p","h":"함정","x":["greatest benefit(가장 큰 이익)은 highest benefit(가장 높은 이익)과 같은 뜻이다."]}],"post":["scarcity(부족) ↔ abundance(풍부함)","우리 = 늘 부족, 스타트렉 = 부족 없음"]},{"slots":[["notion"],["benefit"],["allowed"],["fully","poorly","a"],["abundant"]],"opts":["fully","strictly","briefly","separately"],"om":["충분히, 완전히","엄격하게","짧게","따로"],"or":["fully(충분히): 모두가 의사·연구자가 될 만큼 모자람 없이 교육받았다는 뜻이라 맞음","strictly(엄격하게): 교육 방식이 엄격했다는 말은 풍요에 참여할 만큼 '충분히'라는 핵심과 어긋남","briefly(짧게): 짧게 배워서는 의사·연구자가 될 수 없어 바로 뒤 직업 예시와 충돌함","separately(따로): 모두가 함께 번영에 참여한다는 흐름과 '따로 교육'은 관계가 없음"],"en":"All of humanity in that world has been fully educated so that they can participate in this prosperity. Everyone is an explorer, researcher, engineer, artist, doctor, or counselor.","ko":"그 세계의 모든 인류는 이 번영에 참여할 수 있도록 충분히 교육을 받았다. 모두가 탐험가, 연구자, 기술자, 예술가, 의사, 또는 상담가다.","hl":["fully educated","Everyone is an explorer, researcher, engineer, artist, doctor, or counselor."],"khl":["충분히 교육을 받았다","모두가 탐험가, 연구자, 기술자, 예술가, 의사, 또는 상담가다."],"blocks":[{"t":"p","h":"바로 뒤 예시가 증거","x":["탐험가, 연구자, 기술자, 의사.","모두 오래 공부해야 될 수 있는 직업이다.","그 세계는 \"모두\"가 이런 일을 한다.","교육을 poorly(형편없이) 받았다면 불가능한 그림이다."]},{"t":"p","h":"so that이 알려 주는 목적","x":["so that ~ can(~할 수 있도록)은 목적을 나타낸다.","풍요에 참여하려고 교육을 받은 것이다.","그 목적에 맞는 교육은 \"충분한\" 교육이다."]}],"post":["fully(충분히) ↔ poorly(형편없이)","모두가 의사·연구자 = 충분한 교육"]},{"slots":[["view","look at","s"],["result_in"],["reproduce","replicate","s"],["participate_in","withdraw from","a"],["potential"]],"opts":["participate_in","pay_for","wait_for","compete_with"],"om":["~에 참여하다","~의 값을 치르다","~을 기다리다","~와 경쟁하다"],"or":["participate in(~에 참여하다): 교육받은 모두가 번영을 함께 누리고 만든다는 목적이라 맞음","pay for(~의 값을 치르다): 부족함이 없는 세계라 번영에 값을 치른다는 말이 안 맞음","wait for(~을 기다리다): this prosperity(이 번영)는 이미 있는 것이라 기다린다는 말이 어색함","compete with(~와 경쟁하다): 번영과 경쟁한다는 건 뜻이 통하지 않고 '모두 함께'라는 흐름과도 반대임"],"en":"All of humanity in that world has been fully educated so that they can participate in this prosperity.","ko":"그 세계의 모든 인류는 이 번영에 참여할 수 있도록 충분히 교육을 받았다.","hl":["participate in this prosperity","fully educated"],"khl":["이 번영에 참여할 수 있도록","충분히 교육을 받았다"],"blocks":[{"t":"tap","h":"질문 하나","q":"그 사회는 왜 모든 사람을 충분히 교육했을까?","a":["모두가 풍요를 함께 누리고 만들어 가게 하려고.","교육은 사람을 풍요 속으로 들여보내는 문이다.","풍요에서 빠지게(withdraw from = ~에서 물러나다) 하려고 교육하는 사회는 없다."]},{"t":"p","h":"함정","x":["look at(~을 보다)은 view(보다) 자리에 넣어도 \"경제의 눈으로 본다\"가 그대로다.","replicate(복제하다)는 reproduce(복제하다)와 같은 뜻이다.","스타트렉에 나오는 음식 복제 기계 이름도 replicator(복제기)다."]}],"post":["participate in(참여하다) ↔ withdraw from(빠지다)","교육 = 풍요로 들어가는 문"]}],"quiz":[{"w":"everyone","m":"모든 사람","it":[["everybody","모든 사람","s"],["myself","나 자신","n"],["nobody","아무도 ~않다","a"],["itself","그것 자체","n"],["all","모두, 모든 사람","s"],["no one","아무도 ~않다","a"],["yourself","너 자신","n"]]},{"w":"provide","m":"제공하다","it":[["supply","공급하다","s"],["imagine","상상하다","n"],["withhold","주지 않다","a"],["offer","제공 :["highest","earliest","quickest","widest"],"om":["가장 높은","가장 이른","가장 빠른","가장 넓은"],"or":["highest(가장 높은): 모자란 자원을 가장 큰 이익이 나는 곳으로 보낸다는 뜻이라 맞음","earliest(가장 이른): 이익이 '이르다'는 짝이 어색하고 글은 시간이 아니라 이익의 크기를 말함","quickest(가장 빠른): 빠르기는 자원을 나누는 기준이 아님, 기준은 이익의 크기임","widest(가장 넓은): 이익의 '넓이'라는 말은 어색하고 '가장 쓸모 있는 곳'이라는 뜻이 안 나옴"],"en":"Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.","ko":"그래서 우리는 시장과 가격을 이용해 그 상품, 서비스, 자원을 가장 큰 이익을 낼 수 있는 곳에 배분한다.","hl":["the highest benefit","allocate those goods, services, and resources"],"khl":["가장 큰 이익","그 상품, 서비스, 자원을"],"blocks":[{"t":"tap","h":"질문 하나","q":"빵이 열 개뿐인데 백 명이 원한다면, 시장은 빵을 어디로 보낼까?","a":["그 빵을 가장 원하고 가장 쓸모 있게 쓸 곳으로.","부족할수록 한 개 한 개를 잘 써야 하기 때문이다.","그래서 the highest benefit(가장 큰 이익)이다."]},{"t":"p","h":"lowest가 틀린 이유","x":["lowest(가장 낮은)를 넣으면 이익이 제일 적은 곳에 나눈다는 말이 된다.","모자란 자원을 일부러 낭비하는 셈이다.","시장과 가격을 쓰는 이유와 정반대다."]},{"t":"p","h":"함정","x":["lead to(~으로 이어지다)는 result in(~을 낳다)과 같은 뜻이라 그대로 둔다."]}],"post":["highest(가장 높은) ↔ lowest(가장 낮은)","모자란 빵 = 가장 쓸모 있는 곳으로"]},{"no":"31","slots":[["allocate"],["however","likewise","a"],["allowed","enabled","s"],["educated"],["abundant"]],"opts":["however","therefore","besides","similarly"],"om":["하지만","그러므로","게다가","마찬가지로"],"or":["however(그러나): 앞의 '우리는 늘 부족함'과 뒤의 '스타트렉은 부족함 없음'이 정반대라 맞음","therefore(그러므로): 앞이 원인, 뒤가 결과가 되는데 부족해서 부족함이 없다는 건 말이 안 됨","besides(게다가): 같은 방향의 내용을 덧붙일 때 쓰는데 앞뒤가 반대 방향임","similarly(마찬가지로): 앞과 같은 내용이 이어질 때 쓰는데, 늘 부족한 현실과 부족함 없는 스타트렉은 정반대임"],"en":"In Star Trek, however, there isn’t much scarcity.","ko":"그런데 스타트렉에는 부족함이 별로 없다.","hl":["however","there isn’t much scarcity"],"khl":["그런데","부족함이 별로 없다"],"blocks":[{"t":"flow","h":"글이 꺾이는 지점","x":["우리 경제: 늘 부족하다","그래서 시장과 가격으로 나눈다","however(그러나): 방향 전환","스타트렉: 부족함이 별로 없다","우리도 AI(인공지능)로 그렇게 될 수 있다"],"at":2},{"t":"p","h":"likewise를 넣으면","x":["likewise(마찬가지로)는 앞과 같은 얘기를 이어 갈 때 쓴다.","앞은 \"늘 부족하다\", 뒤는 \"부족함이 별로 없다\"이다.","정반대 내용을 \"마찬가지로\"로 이을 수는 없다."]},{"t":"p","h":"함정","x":["enabled(~할 수 있게 한)는 allowed(~하게 해 준)와 같은 방향이다.","기술이 막은 게 아니라 열어 준 것이다.","바뀐 단어 둘 중 고칠 단어는 연결어 하나."]}],"post":["however(그러나) ↔ likewise(마찬가지로)","우리 = 부족, 스타트렉 = 풍요 (방향 전환)"]}],"compquiz":[{"w":"high","m":"높은","it":[["elevated","높은, 높아진","s"],["tidy","깔끔한","n"],["low","낮은","a"],["lofty","높은, 우뚝 솟은","s"],["rusty","녹슨","n"],["tall","높은, 키가 큰","s"],["hungry","배고픈","n"]]},{"w":"however","m":"그러나","it":[["nevertheless","그럼에도 불구하고","s"],["still","그래도, 그럼에도","s"],["indoors","실내에서","n"],["nonetheless","그렇기는 하지만","s"],["though","그렇지만","s"],["upstairs","위층에서","n"],["abroad","해외에서","n"]]}],"no":"31"},{"id":"2610g1-32","title":"어휘특훈 · 26년 10월 고1 32번","sub":"들어 준다는 걸 보여 주기","tpl":"Individuals, whether customers or otherwise, want to feel {heard}. When someone calls customer service, asks to speak to a manager, or enters your office with something on their mind, they want to feel like someone is {listening} to their {worries} and going to {handle} them. But for someone to feel heard, three things have to happen. First, they have to feel like the other person paid {attention} to what they said. Second, they have to feel like the other person {understood} what they said. And third, the other person has to {demonstrate} that they listened. This {last} part is {key}. Imagine talking to someone who {provided} no response. They might have {attended_to} everything we said. They might even have understood it {completely}. But without some sort of {outward} {signal} that {indicates} they listened, it’s {impossible} to know whether or not they {actually} did.","fn":[],"mean":{"heard":"동사 hear(듣다)의 과거분사형. feel heard = 내 말이 들렸다고(받아들여졌다고) 느끼다","ignored":"동사 ignore(무시하다)의 과거분사형. feel ignored = 무시당한다고 느끼다","listening":"동사 listen(귀 기울여 듣다)의 -ing형. is listening to = ~을 듣고 있다(진행형)","indifferent":"무관심한. be indifferent to = ~에 무관심하다","worries":"명사 worry(걱정)의 복수형","concerns":"명사 concern(걱정, 염려)의 복수형","troubles":"명사 trouble(고민, 골칫거리)의 복수형","handle":"처리하다, 다루다","address":"(문제를) 다루다, 처리하다","dismiss":"묵살하다, 일축하다","attention":"주의, 주목. pay attention to = ~에 주의를 기울이다","heed":"주의, 유의. pay heed to = ~에 유의하다","understood":"동사 understand(이해하다)의 과거형","misunderstood":"동사 misunderstand(오해하다)의 과거형","grasped":"동사 grasp(이해하다, 파악하다)의 과거형","demonstrate":"보여 주다, (행동으로) 드러내다","show":"보여 주다","conceal":"숨기다, 감추다","last":"마지막의","final":"마지막의, 최종의","first":"첫 번째의","key":"핵심적인, 아주 중요한","crucial":"결정적인, 아주 중요한","essential":"필수적인, 아주 중요한","trivial":"사소한, 하찮은","provided":"동사 provide(주다, 제공하다)의 과거형","offered":"동사 offer(내놓다, 제공하다)의 과거형","attended to":"동사구 attend to(~에 주의를 기울이다)의 과거분사형. might have p.p. = ~했을 수도 있다","listened to":"동사구 listen to(~을 귀 기울여 듣다)의 과거분사형","disregarded":"동사 disregard(~을 무시하다)의 과거분사형. 전치사 없이 바로 목적어를 받는다","completely":"완전히","fully":"완전히, 충분히","vaguely":"어렴풋이, 막연하게","outward":"겉으로 드러나는, 바깥으로 보이는","inward":"안쪽의, 마음속의","signal":"신호","cue":"신호, 단서","indicates":"동사 indicate(나타내다, 가리키다)의 3인칭 단수 현재형","denies":"동사 deny(부인하다)의 3인칭 단수 현재형","impossible":"불가능한","easy":"쉬운","actually":"실제로"},"sets":[{"items":[{"slots":[["heard","ignored","a"],["handle"],["understood"],["key"],["outward"]],"opts":["heard","blamed","rushed","judged"],"om":["(말이) 들린, 받아들여진","비난받는","재촉받는","평가받는"],"or":["heard(들린, hear의 과거분사): 글 전체가 '내 말이 들렸다는 느낌'을 어떻게 만드는지에 관한 것이라 맞음","blamed(비난받는, blame의 과거분사): 비난받는다고 느끼고 싶은 사람은 없고 뒤의 '들어 주기' 조건들과도 안 이어짐","rushed(재촉받는, rush의 과거분사): 재촉받는 느낌은 바라는 바가 아니고 글에 서두름 이야기도 없음","judged(평가받는, judge의 과거분사): 평가받는 느낌은 주의·이해·반응 보여 주기라는 세 조건과 관련이 없음"],"en":"Individuals, whether customers or otherwise, want to feel heard. … But for someone to feel heard, three things have to happen.","ko":"사람들은 고객이든 아니든 자기 말이 들렸다고 느끼고 싶어 한다. … 하지만 누군가가 자기 말이 들렸다고 느끼려면 세 가지 일이 일어나야 한다.","hl":["want to feel heard","for someone to feel heard"],"khl":["자기 말이 들렸다고 느끼고 싶어 한다","들렸다고 느끼려면"],"blocks":[{"t":"flow","h":"글 전체 지도","x":["사람들은 내 말이 들렸다고 느끼고 싶다","그러려면 세 가지가 필요","① 주의 ② 이해 ③ 들었다는 걸 보여 주기","③이 핵심","겉으로 신호가 없으면 들었는지 알 수 없음"],"at":0},{"t":"p","h":"ignored가 틀린 이유","x":["feel ignored(무시당한다고 느끼다)는 상대가 나를 신경 쓰지 않는다고 느끼는 것이다.","무시당하고 싶어 하는 사람은 없다.","게다가 셋째 문장에 같은 말이 또 나온다.","for someone to feel heard(누군가가 들렸다고 느끼려면).","글 전체가 feel heard(내 말이 들렸다고 느끼다)를 어떻게 만들지에 대한 이야기다."]}],"post":["heard(들린, 받아들여진) ↔ ignored(무시당한)","글의 목표 = 내 말이 들렸다는 느낌"]},{"slots":[["worries","concerns","s"],["understood","misunderstood","a"],["last"],["provided","offered","s"],["signal"]],"opts":["understood","forgot","recorded","questioned"],"om":["이해했다","잊었다","기록했다","질문했다"],"or":["understood(이해했다, understand의 과거형): 첫째 '주의 기울이기' 다음 단계로 '내 말을 이해함'이 와야 하고, 뒤에서 understood it completely(완전히 이해했다)로 다시 짚어 맞음","forgot(잊었다, forget의 과거형): 상대가 내 말을 잊었다고 느끼면 들렸다는 느낌과 정반대이고, 뒤에서 다시 짚는 understood(이해했다)와도 반대임","recorded(기록했다, record의 과거형): 기록은 들렸다는 느낌을 만드는 조건이 아니고 뒤에서 다시 짚는 '이해'와도 다름","questioned(의문을 제기했다, question의 과거형): 내 말을 의심받는다고 느끼면 들렸다는 느낌과 거리가 멂"],"en":"First, they have to feel like the other person paid attention to what they said. Second, they have to feel like the other person understood what they said.","ko":"첫째, 그들은 상대가 자기가 한 말에 주의를 기울였다고 느껴야 한다. 둘째, 상대가 자기가 한 말을 이해했다고 느껴야 한다.","hl":["understood what they said","paid attention to what they said"],"khl":["자기가 한 말을 이해했다고","주의를 기울였다고"],"blocks":[{"t":"pair","h":"세 가지 조건 나란히","x":[["paid attention to what they said","내 말에 주의를 기울였다"],["understood what they said","내 말을 이해했다"],["demonstrate that they listened","들었다는 걸 보여 준다"]]},{"t":"p","h":"misunderstood를 넣으면","x":["둘째 조건이 \"상대가 내 말을 오해했다고 느껴야 한다\"가 된다.","오해받았다고 느끼면 들렸다는 느낌은 오히려 사라진다.","세 조건은 모두 \"잘 들어 주기\" 쪽 단어여야 한다."]},{"t":"p","h":"고치지 않는 두 단어","x":["concerns(걱정)는 worries(걱정) 자리에 그대로 들어간다.","offered no response(아무 반응도 내놓지 않았다)도 provided no response(아무 반응도 주지 않았다)와 뜻이 같다.","둘 다 맞는 표현이다."]}],"post":["understand(이해하다) ↔ misunderstand(오해하다)","조건 ① 주의, ② 이해, ③ 보여 주기"]},{"slots":[["attention","heed","s"],["key","trivial","a"],["attended_to"],["completely"],["impossible"]],"opts":["key","minor","optional","familiar"],"om":["핵심적인","작은, 부차적인","선택적인","익숙한"],"or":["key(핵심적인): 필자가 남은 글 전부를 셋째 조건 설명에 쓰며 힘을 주므로 맞음","minor(부차적인): 작은 부분이라면 Imagine(상상해 보라)으로 예까지 들며 길게 설명할 이유가 없음","optional(선택적인): 앞에서 has to(~해야 한다)로 꼭 필요한 조건이라 했으므로 모순됨","familiar(익숙한): 익숙한지는 글의 관심사가 아니고 뒤의 '신호가 없으면 알 수 없다'는 강조와 안 이어짐"],"en":"And third, the other person has to demonstrate that they listened. This last part is key. Imagine talking to someone who provided no response.","ko":"그리고 셋째, 상대는 자기가 들었다는 것을 보여 줘야 한다. 이 마지막 부분이 핵심이다. 아무 반응도 보이지 않는 사람과 이야기한다고 상상해 보라.","hl":["This last part is key","Imagine talking to someone"],"khl":["이 마지막 부분이 핵심이다","상상해 보라"],"blocks":[{"t":"p","h":"필자가 힘을 주는 곳","x":["세 조건을 말한 뒤 필자는 셋째 조건만 따로 붙잡는다.","그리고 남은 글 전부를 셋째 조건 설명에 쓴다.","Imagine(상상해 보라)으로 예까지 든다.","trivial(사소한) 부분에 이렇게 공을 들이는 필자는 없다."]},{"t":"p","h":"함정","x":["pay heed to(~에 유의하다)는 pay attention to(~에 주의를 기울이다)와 같은 뜻이다.","paid heed to what they said(그들이 한 말에 유의했다)도 자연스러운 문장이다."]}],"post":["key(핵심적인) ↔ trivial(사소한)","셋째 조건 = 이 글의 핵심"]},{"slots":[["listening"],["demonstrate"],["provided"],["outward","inward","a"],["actually"]],"opts":["outward","hidden","false","private"],"om":["겉으로 드러나는","숨겨진","거짓의","사적인"],"or":["outward(겉으로 드러나는): 상대가 알아챌 수 있으려면 신호가 밖으로 보여야 하므로 맞음","hidden(숨겨진): 숨겨진 신호는 원래 알 수 없으니, 그게 없어서 모른다는 말이 성립하지 않음","false(거짓의): 거짓 신호로는 정말 들었는지 알 수 없으니, 그게 없어서 모른다는 말이 성립하지 않음","private(사적인): 혼자만 아는 신호는 상대에게 들었다는 걸 보여 주지 못함"],"en":"But without some sort of outward signal that indicates they listened, it’s impossible to know whether or not they actually did.","ko":"하지만 그들이 들었다는 것을 나타내는 어떤 겉으로 드러나는 신호가 없으면, 그들이 실제로 들었는지 아닌지 알 수가 없다.","hl":["outward signal","impossible to know"],"khl":["겉으로 드러나는 신호","알 수가 없다"],"blocks":[{"t":"tap","h":"질문 하나","q":"상대 마음속에서만 일어나는 신호를 내가 알아챌 수 있을까?","a":["알아챌 수 없다.","그래서 신호는 밖으로 나와야 한다.","고개 끄덕이기, 대답하기, 되묻기처럼."]},{"t":"p","h":"inward가 무너뜨리는 것","x":["inward signal(마음속 신호)은 밖으로 드러나지 않는 신호다.","마음속 신호가 없다고 해서 알 수 없게 되는 게 아니다.","원래부터 마음속은 남이 볼 수 없다.","이 문장은 \"보이는 신호가 없으면 모른다\"는 말이어야 앞뒤가 맞는다."]}],"post":["outward(겉으로 드러나는) ↔ inward(마음속의)","끄덕임·대답 = 들었다는 겉 신호"]},{"slot ignify","나타내다, 의미하다","s"],["conceal","숨기다","a"],["bake","굽다","n"],["suggest","시사하다, 암시하다","s"],["obscure","흐리게 하다, 감추다","a"],["rescue","구조하다","n"]]}],"no":"32"},{"id":"2610g1-33","title":"어휘특훈 · 26년 10월 고1 33번","sub":"경험을 담는 그릇, 장소","tpl":"The very fact that all of our experiences “take place” in a {physical} space makes the space {inseparable} from what {defines} it, from the event that took place in it. The tree and the ground {beneath} are inseparable from what took place there. This {intertwining} of space, place, and experience {challenges} the idea of place as {passive} backdrop. If place and space are {central} to the very {heart} of experience, we must {accept} the possibility that the spatial framework is the {medium} of all experiences — actions, thoughts, memories, and feelings of every place — not {merely} a background or context {exterior} to experience (as {commonly} {supposed}). Belgian literary critic Georges Poulet made the point {elegantly}, writing of the space created in Marcel Proust’s great novel In Search of Lost Time: “Beings {surround} themselves with the places where they find themselves, the way one wraps oneself up in a garment that is at one and the same time a disguise and a characterization. Without places, beings would be only {abstractions}.”","fn":["*backdrop: (무대의) 배경막, 배경","*garment: 의복, 옷","*disguise: 변장","*characterization: 특징을 드러냄, 성격 묘사"],"mean":{"physical":"물리적인, 실제 물체로 된","fictional":"허구의, 지어낸","inseparable":"떼어 놓을 수 없는, 불가분의","detached":"떨어진, 분리된. be detached from = ~에서 떨어져 있다","defines":"동사 define(규정하다, 정의하다)의 3인칭 단수 현재형","beneath":"(바로) 아래에","below":"아래에","intertwining":"동사 intertwine(뒤얽히다)의 -ing형. 여기선 명사처럼 쓰인 동명사, 뒤얽힘","interweaving":"동사 interweave(섞어 짜다, 뒤섞다)의 -ing형. 동명사, 한데 뒤섞임","separation":"분리","challenges":"동사 challenge(이의를 제기하다)의 3인칭 단수 현재형","questions":"동사 question(의문을 제기하다)의 3인칭 단수 현재형","confirms":"동사 confirm(확인해 주다, 뒷받침하다)의 3인칭 단수 현재형","passive":"수동적인","active":"능동적인, 적극적인","central":"중심적인, 아주 중요한. be central to = ~의 중심이다","fundamental":"근본적인, 핵심적인","peripheral":"주변적인, 지엽적인","heart":"핵심, 중심 (원래 뜻: 심장)","surface":"표면, 겉","accept":"받아들이다","acknowledge":"인정하다, 받아들이다","admit":"인정하다","reject":"거부하다, 받아들이지 않다","medium":"매개체, 수단","merely":"단지, 그저","simply":"단지, 그저","just":"단지, 그저","exterior":"외부의, 바깥의. exterior to = ~의 바깥에 있는","external":"외부의, 바깥의","internal":"내부의, 안쪽의","commonly":"흔히, 일반적으로","widely":"널리","rarely":"좀처럼 ~않게, 드물게","supposed":"동사 suppose(생각하다, 가정하다)의 과거분사형. as commonly supposed = 흔히 생각하듯","assumed":"동사 assume(추정하다, 당연하게 여기다)의 과거분사형","believed":"동사 believe(믿다)의 과거분사형","elegantly":"우아하게, 멋지게","gracefully":"우아하게","clumsily":"서툴게, 어설프게","surround":"둘러싸다. surround oneself with = 자신을 ~으로 둘러싸다","abstractions":"명사 abstraction(추상적인 것, 추상 개념)의 복수형","realities":"명사 reality(실체, 현실)의 복수형"},"sets":[{"items":[{"slots":[["inseparable","detached","a"],["challenges"],["central"],["medium"],["surround"]],"opts":["inseparable","invisible","inaccessible","unknown"],"or":["inseparable(떼어 놓을 수 없는): 바로 다음 문장 The tree and the ground beneath are inseparable(나무와 그 아래 땅은 떼어 놓을 수 없다)에 같은 말이 반복되어 맞음","invisible(보이지 않는): 공간은 경험이 일어나는 물리적 자리라, 보이지 않게 된다는 말은 공간과 사건이 한 몸이라는 흐름과 무관함","inaccessible(접근할 수 없는): 사건에 접근할 수 없게 된다는 건 공간과 사건이 오히려 멀어진다는 뜻이라 반대 방향임","unknown(알려지지 않은): 뒤의 from(~로부터)과 짝이 어색하고, 공간과 사건이 붙어 있다는 주장을 담지 못함"],"om":["떼어 놓을 수 없는","보이지 않는","접근할 수 없는","알려지지 않은"],"en":"The very fact that all of our experiences “take place” in a physical space makes the space inseparable from what defines it, from the event that took place in it. The tree and the ground beneath are inseparable from what took place there.","ko":"우리의 모든 경험이 물리적 공간에서 ‘일어난다’는 바로 그 사실 때문에, 공간은 그 공간을 규정하는 것, 즉 그 안에서 일어난 사건과 떼어 놓을 수 없게 된다. 나무와 그 아래의 땅은 그곳에서 일어난 일과 떼어 놓을 수 없다.","hl":["makes the space inseparable","The tree and the ground beneath are inseparable"],"khl":["떼어 놓을 수 없게 된다","나무와 그 아래의 땅은"],"blocks":[{"t":"flow","h":"글 전체 지도","x":["경험은 늘 어떤 공간에서 일어남","그래서 공간과 사건은 떼어 놓을 수 없음","장소 = 그냥 배경? 아니다","장소는 모든 경험의 매개체","장소가 없으면 존재는 추상일 뿐"],"at":1},{"t":"p","h":"바로 다음 문장이 증거","x":["두 번째 문장에 같은 단어가 또 나온다.","The tree and the ground beneath are inseparable(나무와 그 아래 땅은 떼어 놓을 수 없다).","첫 문장은 원칙, 둘째 문장은 그 예다.","detached(분리된)를 넣으면 원칙과 예가 정반대로 갈라진다."]}],"post":["inseparable(떼어 놓을 수 없는) ↔ detached(분리된)","공간 + 그곳에서 일어난 일 = 한 몸"]},{"slots":[["intertwining","interweaving","s"],["challenges","confirms","a"],["merely","simply","s"],["elegantly"],["abstractions"]],"opts":["challenges","explains","inspires","repeats"],"or":["challenges(이의를 제기하다): 필자는 뒤에서 not merely a background(단순한 배경이 아님)라고 하므로 '장소 = 배경'이라는 생각에 반대하는 이 말이 맞음","explains(설명하다): 뒤얽힘이 '장소 = 수동적 배경'이라는 생각을 설명해 준다면 필자가 그 생각을 지지하는 꼴이 됨","inspires(영감을 주다): 뒤얽힘이 배경설에 영감을 준다는 건 필자의 반박 흐름과 반대임","repeats(반복하다): 필자는 '장소 = 수동적 배경'이라는 생각에 맞서므로, 그 생각을 되풀이한다는 말은 흐름과 반대임"],"om":["이의를 제기한다","설명한다","영감을 준다","반복한다"],"en":"This intertwining of space, place, and experience challenges the idea of place as passive backdrop.","ko":"공간, 장소, 경험이 이렇게 뒤얽혀 있다는 것은 장소를 수동적인 배경으로 보는 생각에 이의를 제기한다.","hl":["challenges the idea","passive backdrop"],"khl":["생각에 이의를 제기한다","수동적인 배경"],"blocks":[{"t":"pair","h":"필자 생각 vs 흔한 생각","x":[["the medium of all experiences","모든 경험의 매개체 (필자의 생각)"],["passive backdrop","수동적인 배경 (필자가 반대하는 생각)"]]},{"t":"p","h":"confirms를 넣으면","x":["\"장소는 수동적 배경이라는 생각을 뒷받침한다\"가 된다.","하지만 필자는 바로 뒤에서 not merely a background(단순한 배경이 아니다)라고 못 박는다.","필자가 반대하는 생각을 스스로 밀어주는 꼴이다."]},{"t":"p","h":"고치지 않는 두 단어","x":["interweaving(한데 뒤섞임)은 intertwining(뒤얽힘)과 같은 뜻이다.","simply(단지)도 merely(단지) 자리에 그대로 들어간다."]}],"post":["challenge(이의를 제기하다) ↔ confirm(뒷받침하다)","장소 = 수동적 배경? 필자는 반대"]},{"slots":[["physical"],["passive"],["accept","acknowledge","s"],["exterior","internal","a"],["surround"]],"opts":["exterior","similar","sensitive","harmful"],"or":["exterior(외부의): 흔한 생각은 장소를 경험 바깥의 무대로 보므로 exterior to experience(경험 바깥에 있는)가 맞음","similar(비슷한): similar to experience(경험과 비슷한)는 '경험과 따로 떨어진 배경'이라는 통념을 그리지 못함","sensitive(민감한): sensitive to experience(경험에 민감한)는 장소가 경험에 반응한다는 뜻이라 가만히 깔린 배경 그림과 어긋남","harmful(해로운): harmful to experience(경험에 해로운)는 좋고 나쁨 얘기라 장소의 위치를 다루는 글과 무관함"],"om":["외부의","비슷한","민감한","해로운"],"en":"… not merely a background or context exterior to experience (as commonly supposed).","ko":"… (흔히 생각하듯) 경험 바깥에 있는 단순한 배경이나 맥락이 아니라.","hl":["exterior to experience","as commonly supposed"],"khl":["경험 바깥에 있는","흔히 생각하듯"],"blocks":[{"t":"p","h":"괄호 속 한마디","x":["괄호 속 as commonly supposed(흔히 생각하듯)는 세상의 흔한 생각을 먼저 꺼내는 말이다.","흔한 생각은 이렇다.","무대가 먼저 있고, 그 앞에서 일이 벌어진다.","즉 장소는 경험 바깥에 따로 있는 배경이다."]},{"t":"p","h":"internal이 안 되는 이유","x":["internal to experience(경험 안쪽에 있는)는 경험 바깥이 아니라 안에 있다는 뜻이다.","괄호 (as commonly supposed(흔히 생각하듯))가 붙었으니 이 자리는 흔한 생각을 그린다.","흔한 생각은 셋째 문장에 이미 나왔다.","place as passive backdrop(장소 = 수동적인 배경).","배경은 뒤에, 바깥에 깔리는 것이다.","\"경험 안쪽에 있는 배경\"은 말 자체가 꼬인다."]},{"t":"p","h":"함정","x":["acknowledge the possibility(가능성을 인정하다)는 accept the possibility(가능성을 받아들이다)와 같은 뜻이다."]}],"post":["exterior(외부의) ↔ internal(내부의)","흔한 생각 = 장소는 경험 바깥의 무대"]},{"slots":[["defines"],["heart"],["commonly"],["elegantly"],["abstractions","realities","a"]],"opts":["abstractions","strangers","exceptions","neighbors"],"or":["abstractions(추상적인 것): 장소라는 옷을 벗기면 존재는 모양 없는 생각 덩어리가 된다는 옷 비유와 맞음","strangers(낯선 사람): 사람 사이 관계 얘기라 '장소 = 존재를 감싸는 옷' 비유와 연결되지 않음","exceptions(예외): 무엇에 대한 예외인지 기준이 없어 문장이 성립하지 않음","neighbors(이웃): 이웃은 같은 장소를 전제하는 말이라 Without places(장소가 없다면)와 모순임"],"om":["추상적인 것","낯선 사람","예외","이웃"],"en":"“Beings surround themselves with the places where they find themselves, the way one wraps oneself up in a garment that is at one and the same time a disguise and a characterization. Without places, beings would be only abstractions.”","ko":"“존재들은 자신이 놓인 장소로 스스로를 둘러싼다. 마치 사람이 변장이면서 동시에 자기 특징을 드러내는 옷으로 몸을 감싸듯이. 장소가 없다면 존재들은 추상적인 것에 불과할 것이다.”","hl":["only abstractions","Without places"],"khl":["추상적인 것에 불과할","장소가 없다면"],"blocks":[{"t":"p","h":"옷 비유로 풀기","x":["옷을 다 벗기면 그 사람이 어떤 사람인지 잘 안 보인다.","교복, 운동복, 정장이 그 사람을 보여 준다.","장소도 옷처럼 사람을 감싸고 드러낸다.","그 옷이 없으면 사람은 모양 없는 생각 덩어리, 곧 추상이 된다."]},{
