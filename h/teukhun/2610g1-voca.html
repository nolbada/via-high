upposed(흔히 생각하듯)가 굳은 표현이다."]},{"t":"tap","h":"글 전체를 한 줄로","q":"이 글을 한 줄로 줄이면?","a":["장소는 경험 뒤에 깔린 배경이 아니다.","장소는 모든 경험을 담고 이어 주는 매개체다."]},{"t":"p","h":"함정","x":["admit the possibility(가능성을 인정하다)는 accept(받아들이다)와 같은 쪽이다.","gracefully(우아하게)는 elegantly(우아하게)와 같은 뜻이다."]}],"post":["commonly(흔히) ↔ rarely(드물게)","흔한 생각 = 장소는 배경일 뿐"]}],"compquiz":[{"w":"central","m":"중심적인","it":[["essential","필수적인","s"],["wooden","나무로 된","n"],["peripheral","주변적인","a"],["sleepy","졸린","n"],["fundamental","근본적인","s"],["minor","부차적인","a"],["polite","공손한","n"]]},{"w":"commonly","m":"흔히","it":[["loudly","큰 소리로","n"],["usually","보통","s"],["rarely","드물게","a"],["bravely","용감하게","n"],["widely","널리","s"],["seldom","좀처럼 ~않게","a"],["neatly","깔끔하게","n"]]}],"no":"33"},{"id":"2610g1-34","title":"어휘특훈 · 26년 10월 고1 34번","sub":"다 몰라도 쓸모 있는 모델","tpl":"No matter how you choose to {delineate} your evolutionary system of interest — let’s say it’s cell phones — there will be some things that your model just needs to take as a given, such as the fact that new ideas {emerge} at {particular} times. Indeed, all models must make {simplifying} assumptions of this nature. When Wallace and Darwin presented their verbal model of biological evolution, there was {little} {knowledge} of how {variation} generation and {inheritance} worked. They just took as a given that these things happened somehow. Even at the {finest} level of detail, we {need} simplifying assumptions. Physicists, for example, must take as a given the mass and charge of {fundamental} particles. In a model of atomic bonds, physicists don’t {attempt} to explain why electrons have their particular mass and charge, they just {accept} the {measured} values and move on. The {key} point is that we can {build} {useful} models at one level of analysis without a {complete} accounting of what’s happening at all other levels.","fn":["*take ~ as a given: ~을 주어진 것(당연한 전제)으로 받아들이다","*charge: 전하","*atomic bond: 원자 결합","*accounting: 설명"],"mean":{"delineate":"(경계·범위를) 정하다, 윤곽을 그리다","define":"정의하다, (범위를) 정하다","blur":"흐릿하게 하다","emerge":"나타나다, 생겨나다","arise":"생겨나다, 일어나다","particular":"특정한","specific":"특정한, 구체적인","simplifying":"동사 simplify(단순화하다)의 -ing형. 단순화하는","complicating":"동사 complicate(복잡하게 만들다)의 -ing형. 복잡하게 만드는","little":"(셀 수 없는 명사 앞에서) 거의 없는","abundant":"풍부한","limited":"제한된, 한정된","knowledge":"지식","ignorance":"무지, 모름","variation":"변이, 차이","uniformity":"균일함, 획일성","inheritance":"유전, 상속","heredity":"유전","finest":"형용사 fine(세밀한, 미세한)의 최상급. 가장 세밀한","coarsest":"형용사 coarse(거친, 대략적인)의 최상급. 가장 거친","need":"필요로 하다","avoid":"피하다","fundamental":"기본적인, 근본적인","elementary":"기본적인, 기초의","attempt":"시도하다","refuse":"거부하다","seek":"(~하려고) 애쓰다, 추구하다","accept":"받아들이다","reject":"거부하다, 거절하다","measured":"동사 measure(측정하다)의 과거분사형. 측정된","observed":"동사 observe(관찰하다)의 과거분사형. 관찰된","key":"핵심적인, 가장 중요한","minor":"사소한, 중요하지 않은","crucial":"아주 중요한, 결정적인","build":"만들다, 세우다","construct":"세우다, 구성하다","dismantle":"해체하다, 분해하다","useful":"유용한","useless":"쓸모없는","valuable":"가치 있는, 소중한","complete":"완전한","full":"완전한, 전부의","thorough":"철저한, 빠짐없는"},"sets":[{"items":[{"slots":[["delineate"],["simplifying","complicating","a"],["little"],["fundamental"],["useful"]],"opts":["simplifying","confusing","exaggerating","misleading"],"or":["simplifying(단순화하는): 앞 문장의 '그냥 주어진 것으로 받아들이기'가 곧 단순화이고, 뒤에서도 simplifying assumptions(단순화 가정)가 반복되어 맞음","confusing(혼란스럽게 하는): 모든 모델이 혼란을 주는 가정을 해야 한다면 '쓸모 있는 모델'이라는 결론과 어긋남","exaggerating(과장하는): 따지지 않고 전제로 두는 것이지 부풀리는 것이 아님","misleading(오해를 부르는): 필자는 이런 가정을 긍정적으로 보므로 부정적 평가가 들어갈 자리가 아님"],"om":["단순화하는","혼란스럽게 하는","과장하는","오해를 부르는"],"en":"Indeed, all models must make simplifying assumptions of this nature. … Even at the finest level of detail, we need simplifying assumptions.","ko":"실제로 모든 모델은 이런 성격의 단순화 가정을 해야 한다. … 가장 세밀한 수준에서도 우리는 단순화 가정이 필요하다.","hl":["simplifying assumptions of this nature","we need simplifying assumptions"],"khl":["단순화 가정을 해야 한다","단순화 가정이 필요하다"],"blocks":[{"t":"flow","h":"글의 뼈대 속 이 문장","x":["주장: 모델은 어떤 것을 그냥 주어진 것으로 받아들인다","정리: 모든 모델은 단순화 가정을 한다","예시 1: 다윈과 월리스의 진화 모델","예시 2: 물리학자의 원자 모델","결론: 다 설명하지 않아도 쓸모 있는 모델"],"at":1},{"t":"p","h":"complicating을 넣으면","x":["complicating(복잡하게 만드는)은 일을 더 복잡하게 만든다는 뜻이다.","그런데 바로 앞 문장에서 모델은 어떤 것을 따지지 않고 그냥 받아들인다고 했다.","따지지 않고 넘어가는 건 일을 간단하게 만드는 쪽이다.","세 문장 뒤에도 simplifying assumptions(단순화 가정)가 한 번 더 나온다.","같은 표현이 되풀이되며 글의 중심을 잡는다."]}],"post":["simplifying(단순화하는) ↔ complicating(복잡하게 만드는)","모델의 기본 = 따지지 않고 받아들이기"]},{"slots":[["emerge","arise","s"],["variation"],["fundamental","elementary","s"],["accept","reject","a"],["complete"]],"opts":["accept","doubt","challenge","revise"],"or":["accept(받아들이다): just(그냥)와 move on(넘어가다)이 따지지 않고 쓰는 태도를 보여 주므로 맞음","doubt(의심하다): 측정값을 의심하면 그냥 넘어갈(move on = 넘어가다) 수 없음","challenge(이의를 제기하다): 측정값에 이의를 달면 take as a given(주어진 것으로 받아들이다)이라는 앞 문장과 반대가 됨","revise(수정하다): 값을 고치는 건 설명하려 하지도 않는다(don’t attempt to explain = 설명하려 하지 않다)는 태도와 맞지 않음"],"om":["받아들이다","의심하다","이의를 제기하다","수정하다"],"en":"In a model of atomic bonds, physicists don’t attempt to explain why electrons have their particular mass and charge, they just accept the measured values and move on.","ko":"원자 결합 모델에서 물리학자들은 전자가 왜 그런 특정한 질량과 전하를 갖는지 설명하려 하지 않는다. 그냥 측정된 값을 받아들이고 넘어간다.","hl":["they just accept the measured values and move on","don’t attempt to explain"],"khl":["그냥 측정된 값을 받아들이고 넘어간다","설명하려 하지 않는다"],"blocks":[{"t":"pair","h":"같은 말을 세 번 바꿔 말하기","x":[["take as a given","주어진 것으로 받아들이다 (첫 문장)"],["took as a given","주어진 것으로 받아들였다 (다윈과 월리스)"],["accept the measured values","측정된 값을 받아들이다 (물리학자)"]]},{"t":"p","h":"reject가 안 되는 이유","x":["reject(거부하다)는 받아들이지 않는다는 뜻이다.","측정값을 거부하면 다음 단계로 넘어갈(move on = 넘어가다) 수가 없다.","물리학자는 왜 그 값인지 묻지 않고 그냥 쓴다.","글 전체가 '그냥 받아들이기'를 말하고 있다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["arise(생겨나다)는 emerge(나타나다) 자리에 넣어도 뜻이 같다.","elementary particles(기본 입자)는 물리학에서 실제로 쓰는 말이다.","fundamental particles(기본 입자)와 같은 대상을 가리킨다."]}],"post":["accept(받아들이다) ↔ reject(거부하다)","물리학자 = 측정값 그대로 쓰고 넘어감"]},{"slots":[["particular"],["little","abundant","a"],["finest"],["measured"],["complete","full","s"]],"opts":["little","extensive","widespread","growing"],"or":["little(거의 없는): 그래서 그냥 took as a given(주어진 것으로 받아들였다)이라는 다음 문장과 이어져 맞음","extensive(폭넓은): 지식이 폭넓었다면 'somehow(어떻게든) 일어난다'며 얼버무릴 필요가 없음","widespread(널리 퍼진): 널리 알려져 있었다면 전제로 깔고 넘어갈 이유가 없음","growing(늘어나는): 지식이 늘고 있었다는 말은 '몰라도 모델을 만들 수 있다'는 예시의 요점을 흐림"],"om":["거의 없는","폭넓은","널리 퍼진","늘어나는"],"en":"When Wallace and Darwin presented their verbal model of biological evolution, there was little knowledge of how variation generation and inheritance worked. They just took as a given that these things happened somehow.","ko":"월리스와 다윈이 생물 진화에 대한 언어적 모델을 발표했을 때, 변이가 생겨나는 방식과 유전이 어떻게 작동하는지에 대한 지식은 거의 없었다. 그들은 이런 일들이 어떻게든 일어난다는 것을 그냥 주어진 것으로 받아들였다.","hl":["there was little knowledge","They just took as a given"],"khl":["지식은 거의 없었다","그냥 주어진 것으로 받아들였다"],"blocks":[{"t":"tap","h":"질문 하나","q":"잘 알고 있었다면 왜 '그냥 주어진 것으로' 받아들였을까?","a":["그럴 이유가 없다. 알면 설명하면 된다.","몰랐기 때문에 전제로 깔고 넘어간 것이다."]},{"t":"p","h":"abundant를 넣으면","x":["abundant(풍부한)는 넉넉하게 많다는 뜻이다.","지식이 풍부했는데 그냥 받아들이고 넘어갔다? 앞뒤가 안 맞는다.","이 예시는 '몰라도 모델을 만들 수 있다'를 보여 주려고 나왔다.","그러려면 지식은 little(거의 없는)이어야 한다."]},{"t":"p","h":"함정","x":["full accounting(완전한 설명)은 complete accounting(완전한 설명)과 같은 뜻이라 맞는 표현."]}],"post":["little(거의 없는) ↔ abundant(풍부한)","몰랐기에 전제로 깔고 간 다윈"]},{"slots":[["delineate","blur","a"],["emerge"],["inheritance"],["attempt"],["key"]],"opts":["delineate","expand","ignore","disguise"],"or":["delineate((범위를) 정하다): let’s say it’s cell phones(휴대 전화라고 해 보자)처럼 다룰 대상을 콕 집는 일과 맞음","expand(확장하다): 범위를 넓히는 장면이 아니라 다룰 대상을 정하는 장면임","ignore(무시하다): 관심 있는 시스템을 무시한다는 건 모델을 만드는 첫 단계와 정반대임","disguise(위장하다): 대상을 숨긴다는 뜻이라 휴대 전화처럼 대상을 드러내 보이는 예시와 안 맞음"],"om":["(범위를) 정하다","확장하다","무시하다","위장하다"],"en":"No matter how you choose to delineate your evolutionary system of interest — let’s say it’s cell phones — there will be some things that your model just needs to take as a given","ko":"관심 있는 진화 시스템의 범위를 어떻게 정하든(예를 들어 휴대 전화라고 해 보자), 모델이 그냥 주어진 것으로 받아들여야 하는 것들이 있기 마련이다.","hl":["delineate your evolutionary system of interest","let’s say it’s cell phones"],"khl":["범위를 어떻게 정하든","휴대 전화라고 해 보자"],"blocks":[{"t":"p","h":"모델을 만드는 첫 단계","x":["모델을 만들려면 먼저 무엇을 다룰지 선을 그어야 한다.","예를 들어 '휴대 전화의 진화'처럼 대상을 딱 정한다.","delineate(경계를 정하다)가 바로 이 선 긋기다.","blur(흐릿하게 하다)는 그 선을 지워 버리는 말이다."]},{"t":"p","h":"예시가 정답을 말해 준다","x":["let’s say it’s cell phones(휴대 전화라고 해 보자)는 대상을 하나 콕 집어 보이는 말이다.","콕 집는 것 = 경계를 분명히 하는 것.","흐릿하게 만들면서 동시에 콕 집을 수는 없다."]}],"post":["delineate(경계를 정하다) ↔ blur(흐릿하게 하다)","휴대 전화 = 범위를 딱 정한 예시"]},{"slots":[["particular","specific","s"],["finest","coarsest","a"],["need"],["measured"],["useful","valuable","s"]],"opts":["finest","broadest","loosest","widest"],"or":["finest(가장 세밀한): 바로 뒤 fundamental particles(기본 입자)처럼 가장 작은 단위까지 파고든 수준이라 맞음","broadest(가장 넓은): 넓게 보는 수준은 detail(세부)과 어울리지 않고 Even(~조차도)으로 강조할 이유도 없음","loosest(가장 느슨한): 느슨하게 대충 보는 수준은 아주 작은 입자까지 파고드는 다음 예시와 반대임","widest(가장 폭넓은): 폭넓게 보는 수준은 아주 작은 입자를 들여다보는 다음 예시와 반대임"],"om":["가장 세밀한","가장 넓은","가장 느슨한","가장 폭넓은"],"en":"Even at the finest level of detail, we need simplifying assumptions. Physicists, for example, must take as a given the mass and charge of fundamental particles.","ko":"가장 세밀한 수준에서도 우리는 단순화 가정이 필요하다. 예를 들어 물리학자들은 기본 입자의 질량과 전하를 주어진 것으로 받아들여야 한다.","hl":["Even at the finest level of detail","fundamental particles"],"khl":["가장 세밀한 수준에서도","기본 입자"],"blocks":[{"t":"p","h":"Even이 하는 일","x":["여기서 Even(~조차도)이 핵심이다.","가장 그럴 것 같지 않은 곳에서도 그렇다고 강조하는 말이다.","아주 작게, 정밀하게 파고들면 다 설명할 수 있을 것 같다.","그런데 거기서조차 단순화 가정이 필요하다는 것.","coarsest(가장 거친)는 원래 대충 보는 수준이라 Even(~조차도)으로 강조할 까닭이 없다."]},{"t":"pair","h":"바로 다음 예시와 맞추기","x":[["the finest level of detail","가장 세밀한 수준"],["fundamental particles","기본 입자 (더 쪼갤 수 없는 가장 작은 단위)"]]},{"t":"p","h":"함정","x":["specific(특정한)은 particular(특정한) 자리에, valuable(가치 있는)은 useful(유용한) 자리에 들어가도 자연스럽다.","둘 다 뜻의 방향이 같아서 고치지 않는다."]}],"post":["finest(가장 세밀한) ↔ coarsest(가장 거친)","가장 작은 입자에서조차 필요한 가정"]}],"quiz":[{"w":"simplify","m":"단순화하다","it":[["streamline","간소화하다","s"],["harvest","수확하다","n"],["complicate","복잡하게 만들다","a"],["clarify","명확하게 하다","s"],["sew","바느질하다","n"],["confuse","혼란스럽게 하다","a"],["greet","인사하다","n"]]},{"w":"accept","m":"받아들이다","it":[["fold","접다","n"],["reject","거부하다","a"],["embrace","받아들이다, 수용하다","s"],["bake","굽다","n"],["decline","거절하다","a"],["whistle","휘파람을 불다","n"],["acknowledge","인정하다","s"]]},{"w":"little","m":"(셀 수 없는 명사 앞에서) 거의 없는","it":[["scant","부족한, 거의 없는","s"],["brave","용감한","n"],["abundant","풍부한","a"],["wooden","나무로 된","n"],["meager","빈약한, 얼마 안 되는","s"],["plentiful","풍부한","a"],["polite","공손한","n"]]},{"w":"delineate","m":"(경계·범위를) 정하다, 윤곽을 그리다","it":[["chew","씹다","n"],["define","정의하다, (범위를) 정하다","s"],["distort","왜곡하다","a"],["rescue","구조하다","n"],["outline","윤곽을 그리다, 개요를 말하다","s"],["knit","뜨개질하다","n"],["misrepresent","잘못 전하다, 왜곡하다","a"]]},{"w":"fine","m":"세밀한, 미세한","it":[["coarse","거친","a"],["loyal","충실한","n"],["minute","미세한","s"],["hungry","배고픈","n"],["rough","거친, 대강의","a"],["precise","정밀한","s"],["sunny","화창한","n"]]}]},{"items":[{"slots":[["simplifying"],["inheritance"],["attempt","refuse","a"],["build"],["complete"]],"opts":["attempt","hesitate","fail","forget"],"or":["attempt(시도하다): 설명하려 하지 않고 측정값을 그냥 받아들인다(just accept = 그냥 받아들이다)는 뒤 내용과 맞음","hesitate(망설이다): don’t hesitate to explain(설명하기를 망설이지 않는다)은 적극적으로 설명한다는 뜻이라 just accept(그냥 받아들이다)와 부딪침","fail(실패하다): don’t fail to explain(반드시 설명한다)은 설명한다는 뜻이 되어 뒤 내용과 반대임","forget(잊다): don’t forget to explain(잊지 않고 설명한다)은 꼭 설명한다는 뜻이라 just accept(그냥 받아들인다)와 반대임"],"om":["시도하다","망설이다","실패하다","잊다"],"en":"In a model of atomic bonds, physicists don’t attempt to explain why electrons have their particular mass and charge, they just accept the measured values and move on.","ko":"원자 결합 모델에서 물리학자들은 전자가 왜 그런 특정한 질량과 전하를 갖는지 설명하려 하지 않는다. 그냥 측정된 값을 받아들이고 넘어간다.","hl":["don’t attempt to explain","they just accept the measured values"],"khl":["설명하려 하지 않는다","그냥 측정된 값을 받아들이고"],"blocks":[{"t":"p","h":"refuse를 넣고 다시 읽기","x":["\"전자가 왜 그런 질량을 갖는지 설명하기를 거부하지 않는다\"가 된다.","거부하지 않는다 = 설명한다는 말이다.","그런데 바로 뒤에서 그냥 측정값을 받아들이고 넘어간다고 한다.","설명한다면서 그냥 넘어간다? 앞뒤가 부딪친다."]},{"t":"p","h":"물리학자의 태도","x":["전자의 질량과 전하는 재서 알 뿐, 왜 그 값인지는 묻지 않는다.","원자 결합을 설명하는 데는 그 값만 있으면 충분하기 때문이다.","굳이 시도(attempt = 시도하다)하지 않는 것이 이 예시의 핵심이다."]}],"post":["attempt(시도하다) ↔ refuse(거부하다)","왜 그 질량인지 묻지 않고 넘어감"]},{"slots":[["delineate"],["inheritance","heredity","s"],["measured","observed","s"],["key"],["useful","useless","a"]],"opts":["useful","outdated","fragile","complex"],"or":["useful(유용한): 다 몰라도 쓸모 있는 모델을 만들 수 있다는 결론이라 맞음","outdated(구식의): 구식 모델을 만들 수 있다는 건 The key point(핵심)로 내세울 내용이 아님","fragile(부서지기 쉬운): 필자는 단순화 가정이 모델을 약하게 만든다고 보지 않음","complex(복잡한): 단순화 가정으로 만드는 모델이라 '복잡한' 모델은 흐름과 반대임"],"om":["유용한","구식의","부서지기 쉬운","복잡한"],"en":"The key point is that we can build useful models at one level of analysis without a complete accounting of what’s happening at all other levels.","ko":"핵심은 다른 모든 수준에서 일어나는 일을 완전히 설명하지 않고도 한 분석 수준에서 유용한 모델을 만들 수 있다는 것이다.","hl":["build useful models","without a complete accounting"],"khl":["유용한 모델을 만들 수 있다","완전히 설명하지 않고도"],"blocks":[{"t":"tap","h":"한 줄 요약 복원","q":"이 글을 한 줄로 줄이면?","a":["다 몰라도 쓸모 있는 모델은 만들 수 있다.","다윈도, 물리학자도 그렇게 했다."]},{"t":"p","h":"useless가 틀린 이유","x":["글쓴이는 단순화 가정을 나쁘게 보지 않는다.","다윈의 진화 모델도, 원자 결합 모델도 잘 작동했다.","쓸모없는 모델을 만들 수 있다는 건 굳이 The key point(핵심)라고 내세울 말이 아니다.","결론은 '그래도 쓸모 있다'여야 한다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","heredity(유전)는 inheritance(유전)와 같은 뜻이다.","observed values(관찰된 값)도 measured values(측정된 값)와 통한다."]}],"post":["useful(유용한) ↔ useless(쓸모없는)","다 몰라도 가능한 쓸모 있는 모델"]},{"slots":[["knowledge","ignorance","a"],["variation"],["finest"],["accept"],["complete","thorough","s"]],"opts":["knowledge","debate","interest","funding"],"or":["knowledge(지식): 몰랐기 때문에 somehow(어떻게든) 일어난다고 치고 넘어갔다는 다음 문장과 맞음","debate(논쟁): 논쟁이 없었다는 것만으로는 원리를 몰라 전제로 깔고 갔다는 내용이 설명되지 않음","interest(관심): 다윈과 월리스는 진화를 연구했으니 관심이 거의 없었다는 건 앞뒤가 안 맞음","funding(자금): of how ~ worked(~이 어떻게 작동하는지에 대한)와 짝이 맞지 않음"],"om":["지식","논쟁","관심","자금"],"en":"When Wallace and Darwin presented their verbal model of biological evolution, there was little knowledge of how variation generation and inheritance worked. They just took as a given that these things happened somehow.","ko":"월리스와 다윈이 생물 진화에 대한 언어적 모델을 발표했을 때, 변이가 생겨나는 방식과 유전이 어떻게 작동하는지에 대한 지식은 거의 없었다. 그들은 이런 일들이 어떻게든 일어난다는 것을 그냥 주어진 것으로 받아들였다.","hl":["little knowledge","happened somehow"],"khl":["지식은 거의 없었다","어떻게든 일어난다"],"blocks":[{"t":"p","h":"ignorance를 넣고 천천히 읽기","x":["little ignorance = 무지가 거의 없었다.","무지가 거의 없다 = 잘 알고 있었다.","그런데 다음 문장에서 그들은 이런 일이 somehow(어떻게든) 일어난다고 치고 넘어갔다.","잘 알았다면 '어떻게든'이라고 얼버무릴 필요가 없다."]},{"t":"p","h":"다윈 시대의 실제 상황","x":["다윈이 진화론을 발표하던 때에는 유전자가 무엇인지 아무도 몰랐다.","그래도 진화 모델은 완성됐다.","몰라도 모델은 만들 수 있다는 이 글의 첫 번째 증거다."]},{"t":"p","h":"함정","x":["thorough accounting(철저한 설명)은 complete accounting(완전한 설명) 자리에 넣어도 뜻이 같다."]}],"post":["knowledge(지식) ↔ ignorance(무지)","유전 원리 몰라도 완성된 진화 모델"]},{"slots":[["emerge"],["variation"],["attempt"],["key","minor","a"],["complete"]],"opts":["key","hidden","opposite","trivial"],"or":["key(핵심적인): 예시 셋을 묶는 마지막 결론 문장이라 맞음","hidden(숨겨진): 필자가 대놓고 밝히는 결론이라 숨겨진 점이 아님","opposite(정반대의): 앞 예시들과 같은 방향의 결론이라 정반대가 아님","trivial(사소한): 예시 셋을 묶어 힘주어 내리는 결론이라 사소한 점이 아님"],"om":["핵심적인","숨겨진","정반대의","사소한"],"en":"The key point is that we can build useful models at one level of analysis without a complete accounting of what’s happening at all other levels.","ko":"핵심은 다른 모든 수준에서 일어나는 일을 완전히 설명하지 않고도 한 분석 수준에서 유용한 모델을 만들 수 있다는 것이다.","hl":["The key point is","at one level of analysis"],"khl":["핵심은","한 분석 수준에서"],"blocks":[{"t":"flow","h":"예시 다음에 오는 자리","x":["휴대 전화 모델: 새 아이디어가 나오는 건 전제","다윈 모델: 변이와 유전은 전제","물리학 모델: 입자의 질량·전하는 전제","마지막 문장: 예시들을 묶는 결론"],"at":3},{"t":"p","h":"minor가 안 되는 이유","x":["예시를 셋이나 든 뒤 마지막에 오는 문장이다.","예시들이 공통으로 말하는 것을 한 문장으로 묶는다.","이런 자리는 글의 결론, 즉 핵심이다.","minor point(사소한 점)라고 하면 글쓴이가 자기 결론을 깎아내리는 셈이다."]}],"post":["key(핵심적인) ↔ minor(사소한)","예시 셋을 묶는 결론 문장"]},{"slots":[["delineate","define","s"],["emerge"],["need","avoid","a"],["attempt","seek","s"],["build"]],"opts":["need","question","overlook","postpone"],"or":["need(필요로 하다): 다음 예시의 물리학자도 입자 값을 must take as a given(주어진 것으로 받아들여야 한다)이라 맞음","question(의문을 제기하다): 가정에 의문을 품는다면 가정을 깔고 가는 예시 속 물리학자와 반대임","overlook(간과하다): 가정을 놓친다는 뜻이라 가정을 일부러 깔고 간다는 예시와 맞지 않음","postpone(미루다): 가정을 미루면 그 수준의 모델을 세울 수 없음"],"om":["필요로 하다","의문을 제기하다","간과하다","미루다"],"en":"Even at the finest level of detail, we need simplifying assumptions. Physicists, for example, must take as a given the mass and charge of fundamental particles.","ko":"가장 세밀한 수준에서도 우리는 단순화 가정이 필요하다. 예를 들어 물리학자들은 기본 입자의 질량과 전하를 주어진 것으로 받아들여야 한다.","hl":["we need simplifying assumptions","must take as a given"],"khl":["단순화 가정이 필요하다","주어진 것으로 받아들여야 한다"],"blocks":[{"t":"p","h":"avoid를 넣고 예시와 맞춰 보기","x":["avoid(피하다)를 넣어 보자.","그러면 '가장 세밀한 수준에서는 단순화 가정을 피한다'가 된다.","그런데 바로 다음 문장이 for example(예를 들어)로 시작한다.","예시 속 물리학자는 입자의 질량과 전하를 must take as a given(주어진 것으로 받아들여야 한다).","가정을 피하는 게 아니라 가정을 깔고 간다.","주장과 예시가 정반대가 된다."]},{"t":"p","h":"그대로 두는 define과 seek","x":["define your system(시스템을 정의하다)은 delineate your system(시스템의 범위를 정하다)과 같은 일이다.","don’t seek to explain(설명하려 들지 않는다)도 don’t attempt to explain(설명하려 하지 않는다)과 뜻이 같다.","둘 다 문장의 방향을 바꾸지 않는다."]}],"post":["need(필요로 하다) ↔ avoid(피하다)","물리학자도 깔고 가는 가정"]}],"quiz":[{"w":"attempt","m":"시도하다","it":[["boil","끓이다","n"],["try","시도하다","s"],["give up","포기하다","a"],["marry","결혼하다","n"],["endeavor","노력하다, 애쓰다","s"],["sneeze","재채기하다","n"],["quit","그만두다","a"]]},{"w":"useful","m":"유용한","it":[["helpful","도움이 되는","s"],["rainy","비가 오는","n"],["useless","쓸모없는","a"],["practical","실용적인","s"],["elderly","나이 든","n"],["worthless","가치 없는","a"],["silent","조용한","n"]]},{"w":"knowledge","m":"지식","it":[["pillow","베개","n"],["understanding","이해","s"],["ignorance","무지","a"],["ladder","사다리","n"],["unfamiliarity","잘 모름, 생소함","a"],["awareness","인식, 앎","s"],["harbor","항구","n"]]},{"w":"key","m":"핵심적인, 가장 중요한","it":[["minor","사소한","a"],["central","중심적인","s"],["frozen","얼어붙은","n"],["curly","곱슬곱슬한","n"],["essential","필수적인","s"],["trivial","하찮은","a"],["noisy","시끄러운","n"]]},{"w":"need","m":"필요로 하다","it":[["require","필요로 하다, 요구하다","s"],["giggle","킥킥 웃다","n"],["demand","요구하다, 필요로 하다","s"],["scrub","문질러 닦다","n"],["necessitate","필요하게 만들다","s"],["call for","필요로 하다, 요구하다","s"],["wander","거닐다","n"]]}]}],"comp":[{"no":"34","slots":[["particular"],["variation","uniformity","a"],["finest"],["accept"],["build","construct","s"]],"opts":["variation","stability","extinction","isolation"],"or":["variation(변이): 진화의 두 재료인 변이와 유전 중 하나라 inheritance(유전)와 짝이 맞음","stability(안정성): 모두 그대로면 진화가 일어나지 않아 진화 모델의 재료가 아님","extinction(멸종): generation(생성)과 붙으면 '멸종의 생성'이라는 어색한 말이 됨","isolation(고립): inheritance(유전)와 나란히 '생성'되는 진화의 재료가 아님"],"om":["변이","안정성","멸종","고립"],"en":"When Wallace and Darwin presented their verbal model of biological evolution, there was little knowledge of how variation generation and inheritance worked.","ko":"월리스와 다윈이 생물 진화에 대한 언어적 모델을 발표했을 때, 변이가 생겨나는 방식과 유전이 어떻게 작동하는지에 대한 지식은 거의 없었다.","hl":["how variation generation and inheritance worked","biological evolution"],"khl":["변이가 생겨나는 방식과 유전","생물 진화"],"blocks":[{"t":"p","h":"진화의 두 재료","x":["진화가 일어나려면 두 가지가 필요하다.","첫째, 생물마다 조금씩 다른 점이 생겨야 한다. 이게 variation(변이)이다.","둘째, 그 다른 점이 자식에게 전해져야 한다. 이게 inheritance(유전)이다.","uniformity(균일함)는 모두 똑같다는 뜻이라 진화의 재료가 될 수 없다."]},{"t":"p","h":"함정","x":["construct(세우다, 구성하다)는 build(만들다) 자리에 그대로 들어간다.","build a model과 construct a model은 둘 다 '모델을 만들다'."]}],"post":["variation(변이) ↔ uniformity(균일함)","진화의 재료 = 변이 + 유전"]},{"no":"34","slots":[["little","limited","s"],["need"],["measured"],["key","crucial","s"],["build","dismantle","a"]],"opts":["build","borrow","compare","sell"],"or":["build(만들다): 다 몰라도 쓸모 있는 모델을 세울 수 있다는 결론이라 맞음","borrow(빌리다): 글은 모델을 직접 세우는 과정을 다루며 빌리는 얘기가 없음","compare(비교하다): 여러 모델을 비교하는 내용은 앞 예시 어디에도 없음","sell(팔다): 모델을 판다는 건 분석 수준(level of analysis) 얘기와 무관함"],"om":["만들다","빌리다","비교하다","팔다"],"en":"The key point is that we can build useful models at one level of analysis without a complete accounting of what’s happening at all other levels.","ko":"핵심은 다른 모든 수준에서 일어나는 일을 완전히 설명하지 않고도 한 분석 수준에서 유용한 모델을 만들 수 있다는 것이다.","hl":["we can build useful models","without a complete accounting of what’s happening at all other levels"],"khl":["유용한 모델을 만들 수 있다","다른 모든 수준에서 일어나는 일을 완전히 설명하지 않고도"],"blocks":[{"t":"tap","h":"질문 하나","q":"글쓴이는 단순화 가정이 모델을 망친다고 볼까, 가능하게 한다고 볼까?","a":["가능하게 한다고 본다.","다 몰라도 일단 모델을 세울 수 있게 해 주는 장치다.","dismantle(해체하다)은 모델을 부순다는 말이라 이 결론과 정반대다."]},{"t":"p","h":"함정 둘","x":["limited knowledge(제한된 지식)는 little knowledge(거의 없는 지식)와 같은 그림이다.","crucial point(아주 중요한 점)도 key point(핵심)와 통한다.","둘을 고쳤다면 철자만 보고 판단한 것."]}],"post":["build(만들다) ↔ dismantle(해체하다)","단순화 가정 = 모델을 세우는 발판"]}],"compquiz":[{"w":"variation","m":"변이, 차이","it":[["blanket","담요","n"],["variety","다양성, 변화","s"],["uniformity","균일함","a"],["tunnel","터널","n"],["diversity","다양성","s"],["sameness","똑같음, 단조로움","a"],["recipe","요리법","n"]]},{"w":"build","m":"만들다, 세우다","it":[["construct","세우다, 구성하다","s"],["kneel","무릎을 꿇다","n"],["demolish","철거하다, 무너뜨리다","a"],["sniff","냄새를 맡다","n"],["create","만들어 내다","s"],["destroy","파괴하다","a"],["yawn","하품하다","n"]]}],"no":"34"},{"id":"2610g1-35","title":"어휘특훈 · 26년 10월 고1 35번","sub":"번아웃, 개인 탓에서 구조 문제로","tpl":"The {recognition} of burnout as an {occupational} phenomenon by the WHO in 2019 marked an {important} moment in the discourse on workplace mental health. This designation {reframes} clinical assessment and organizational responsibility, {shifting} attention to {systemic} prevention. It {invites} employers to {adopt} {structural} interventions rather than relying {solely} on individual-level remedies. In practice, this means clinicians should {collaborate} with occupational health and leadership to address {root} causes. It signaled a shift away from viewing burnout as a {personal} failing or a matter of individual resilience, toward understanding it as a structural issue {rooted} in organizational culture, leadership practices, and the {broader} socio-economic context of work. This reframing is {essential}, as it {opens} the door to systemic interventions and policy-level changes rather than placing the {burden} solely on individuals to cope or adapt.","fn":["*discourse: 담론, 논의","*designation: 지정","*clinical assessment: 임상 평가","*intervention: 개입","*resilience: 회복력"],"mean":{"recognition":"인정","acknowledgment":"인정, 승인","denial":"부인, 부정","occupational":"직업의, 업무상의","important":"중요한","insignificant":"하찮은, 중요하지 않은","reframes":"동사 reframe(새로운 틀로 보다)의 3인칭 단수 현재형","redefines":"동사 redefine(다시 정의하다)의 3인칭 단수 현재형","reshapes":"동사 reshape(새로 만들다, 재구성하다)의 3인칭 단수 현재형","shifting":"동사 shift(옮기다)의 -ing형. 분사구문","turning":"동사 turn(돌리다)의 -ing형. 분사구문","systemic":"체계적인, 시스템 전체의","individual":"개인의, 개별적인","invites":"동사 invite(권하다, 요청하다)의 3인칭 단수 현재형","forbids":"동사 forbid(금지하다)의 3인칭 단수 현재형","adopt":"도입하다, 채택하다","implement":"시행하다, 실행하다","reject":"거부하다","structural":"구조적인","cosmetic":"겉치레의, 겉모양만 손보는","solely":"오로지, 단지","exclusively":"오로지, 독점적으로","collaborate":"협력하다","partner":"(~와) 협력하다, 짝이 되다","cooperate":"협력하다","compete":"경쟁하다","root":"근본적인 (명사로는 '뿌리')","superficial":"피상적인, 겉으로 드러난","personal":"개인적인, 개인의","collective":"집단의, 공동의","rooted":"동사 root(뿌리를 두다)의 과거분사형. ~에 뿌리를 둔","grounded":"동사 ground(~에 기반을 두다)의 과거분사형. ~에 기반을 둔","embedded":"동사 embed(깊이 박다)의 과거분사형. ~에 깊이 박힌","broader":"형용사 broad(넓은)의 비교급. 더 넓은","wider":"형용사 wide(넓은)의 비교급. 더 넓은","narrower":"형용사 narrow(좁은)의 비교급. 더 좁은","essential":"꼭 필요한, 필수적인","vital":"필수적인, 매우 중요한","unnecessary":"불필요한","opens":"동사 open(열다)의 3인칭 단수 현재형","closes":"동사 close(닫다)의 3인칭 단수 현재형","burden":"부담, 짐","responsibility":"책임"},"sets":[{"items":[{"slots":[["recognition"],["important","insignificant","a"],["shifting"],["structural"],["personal"]],"opts":["important","awkward","unexpected","brief"],"or":["important(중요한): 글 전체가 이 인정이 가져온 큰 변화를 설명하므로 '중요한 순간'이 딱 맞음.","awkward(어색한): 이 인정을 어색한 순간으로 볼 근거가 본문에 없고, 글은 이 일을 긍정적인 전환점으로 평가함.","unexpected(예상치 못한): 놀랐다는 이야기는 글에 없고, 글은 이 인정이 가져온 변화와 의미만 설명함.","brief(짧은): '잠깐 스친 순간'이라는 뜻이 되어, 평가·책임·예방의 방향을 바꾼 큰 전환점이라는 흐름과 안 맞음."],"om":["중요한","어색한","예상치 못한","짧은"],"en":"The recognition of burnout as an occupational phenomenon by the WHO in 2019 marked an important moment in the discourse on workplace mental health.","ko":"2019년 WHO가 번아웃을 직업 관련 현상으로 인정한 것은 직장 정신 건강에 관한 논의에서 중요한 순간이 되었다.","hl":["marked an important moment","The recognition of burnout"],"khl":["중요한 순간이 되었다","번아웃을 직업 관련 현상으로 인정한 것"],"blocks":[{"t":"flow","h":"글 흐름 속 첫 문장","x":["2019년: WHO(세계보건기구)가 번아웃을 직업 현상으로 인정","의미: 개인 문제 → 구조 문제로 시선 이동","결과: 회사·정책 차원의 해결책","평가: 이 전환은 꼭 필요"],"at":0},{"t":"p","h":"insignificant를 넣으면","x":["insignificant(하찮은, 중요하지 않은)를 넣으면 이 인정이 하찮은 일이 된다.","그런데 글은 끝까지 이 인정이 가져온 변화를 설명한다.","마지막 문장은 아예 This reframing is essential(이러한 관점 전환은 꼭 필요하다)이라고 못 박는다.","하찮은 일로 이렇게 긴 글을 쓰지 않는다."]}],"post":["important(중요한) ↔ insignificant(하찮은)","WHO(세계보건기구) 인정 = 직장 정신 건강 논의의 전환점"]},{"slots":[["reframes","redefines","s"],["solely"],["collaborate","compete","a"],["broader","wider","s"],["burden"]],"opts":["collaborate","argue","interfere","bargain"],"or":["collaborate(협력하다): 근본 원인을 해결하려면 의사가 회사 쪽(산업 보건·경영진)과 손잡아야 하므로 맞음.","argue(다투다): 같은 목표(근본 원인 해결)를 가진 상대와 다투라는 말이 되어 흐름이 깨짐.","interfere(간섭하다): interfere with(~을 방해하다)가 되어, 함께 해결해야 할 상대의 일을 방해하라는 엉뚱한 말이 됨.","bargain(흥정하다): 근본 원인 해결은 거래할 문제가 아니라 함께 풀 과제라 맞지 않음."],"om":["협력하다","다투다","간섭하다","흥정하다"],"en":"In practice, this means clinicians should collaborate with occupational health and leadership to address root causes.","ko":"실제로 이것은 임상의들이 근본 원인을 해결하기 위해 산업 보건 분야 및 경영진과 협력해야 한다는 뜻이다.","hl":["collaborate with occupational health and leadership","to address root causes"],"khl":["경영진과 협력해야","근본 원인을 해결하기 위해"],"blocks":[{"t":"p","h":"compete를 넣고 읽기","x":["\"임상의는 산업 보건 분야, 경영진과 경쟁해야 한다\"가 된다.","그런데 이들의 목표는 하나다. 번아웃의 근본 원인 해결.","번아웃이 조직 문화에서 생긴다면 의사 혼자서는 못 고친다.","회사를 움직이는 사람들과 손을 잡아야 한다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["redefines(다시 정의하다)는 reframes(새로운 틀로 보다) 자리에 들어가도 뜻이 통한다.","wider(더 넓은)는 broader(더 넓은)와 같은 말이다."]}],"post":["collaborate(협력하다) ↔ compete(경쟁하다)","의사 혼자 X, 회사와 함께 원인 해결"]},{"slots":[["occupational"],["systemic","individual","a"],["adopt"],["rooted","grounded","s"],["essential"]],"opts":["systemic","temporary","emotional","medical"],"or":["systemic(체계적인): 뒤에 나오는 structural interventions(구조적인 개입), policy-level changes(정책 차원의 변화)와 같은 편이라 맞음.","temporary(일시적인): 글은 근본 원인을 고치자는 주장이라 '잠깐만 막는 예방'은 방향이 반대임.","emotional(감정적인): 감정 관리는 개인 차원의 해결책에 가까워, 개인에서 조직으로 시선을 옮긴다는 흐름과 안 맞음.","medical(의학적인): 글은 의사 혼자의 치료를 넘어 회사·제도 차원으로 가자는 내용이라 핵심을 빗나감."],"om":["체계적인, 시스템 전체의","일시적인","감정적인","의학적인"],"en":"This designation reframes clinical assessment and organizational responsibility, shifting attention to systemic prevention.","ko":"이 지정은 임상 평가와 조직의 책임을 새로운 틀로 보게 하며, 관심을 체계적인 예방으로 옮긴다.","hl":["shifting attention to systemic prevention","organizational responsibility"],"khl":["관심을 체계적인 예방으로 옮긴다","조직의 책임"],"blocks":[{"t":"pair","h":"글에 계속 나오는 같은 편 단어","x":[["systemic prevention","체계적인 예방"],["structural interventions","구조적인 개입"],["a structural issue","구조적 문제"],["policy-level changes","정책 차원의 변화"]]},{"t":"p","h":"묶음에서 튀는 단어","x":["이 글은 '개인 말고 조직·제도'를 계속 말한다.","individual prevention(개인 차원의 예방)이 되면 다시 개인에게 짐을 돌리는 말이 된다.","글쓴이가 비판한 individual-level remedies(개인 차원의 해결책)와 같은 편이다.","shifting attention(관심을 옮기다)은 개인에게서 시스템으로 옮긴다는 뜻이다."]},{"t":"p","h":"함정","x":["grounded in(~에 기반을 둔)은 rooted in(~에 뿌리를 둔)과 같은 뜻이라 맞는 표현."]}],"post":["systemic(체계적인) ↔ individual(개인의)","관심 이동: 개인 → 시스템"]},{"slots":[["recognition","denial","a"],["invites"],["root"],["personal"],["broader"]],"opts":["recognition","criticism","neglect","misuse"],"or":["recognition(인정): 다음 문장의 This designation(이 지정)이 받으려면 WHO(세계보건기구)가 번아웃을 공식 인정한 것이어야 함.","criticism(비판): 번아웃을 직업 현상'으로서' 비판한다는 말은 어색하고, '이 지정'으로 받을 수도 없음.","neglect(방치): 방치했다면 조직의 책임 이야기가 시작될 수 없어 뒤 흐름과 정반대임.","misuse(오용): 번아웃을 잘못 사용했다는 뜻이 되어 문장 자체가 성립하지 않음."],"om":["인정","비판","방치","오용"],"en":"The recognition of burnout as an occupational phenomenon by the WHO in 2019 marked an important moment in the discourse on workplace mental health. This designation reframes clinical assessment and organizational responsibility, shifting attention to systemic prevention.","ko":"2019년 WHO가 번아웃을 직업 관련 현상으로 인정한 것은 직장 정신 건강에 관한 논의에서 중요한 순간이 되었다. 이 지정은 임상 평가와 조직의 책임을 새로운 틀로 보게 하며, 관심을 체계적인 예방으로 옮긴다.","hl":["The recognition of burnout as an occupational phenomenon","This designation"],"khl":["번아웃을 직업 관련 현상으로 인정한 것","이 지정은"],"blocks":[{"t":"p","h":"This designation이 가리키는 것","x":["designation(지정, 공식적으로 이름 붙이기)부터 보자.","This designation(이 지정)은 바로 앞 문장의 일을 가리킨다.","WHO(세계보건기구)가 번아웃을 직업 현상으로 공식 지정한 것.","denial(부인)이었다면 '지정'이라는 말로 받을 수 없다."]},{"t":"tap","h":"질문 하나","q":"WHO(세계보건기구)가 번아웃을 부인했다면, 회사가 구조를 바꿀 이유가 생길까?","a":["생기지 않는다.","인정했기 때문에 조직의 책임 이야기가 시작된 것이다."]}],"post":["recognition(인정) ↔ denial(부인)","WHO(세계보건기구)의 공식 지정 = 조직 책임의 출발"]},{"slots":[["important"],["shifting","turning","s"],["structural"],["essential","unnecessary","a"],["burden","responsibility","s"]],"opts":["essential","risky","controversial","premature"],"or":["essential(꼭 필요한): as(~ 때문에) 뒤 이유가 '정책 변화로 가는 문을 연다'는 좋은 결과라 긍정 평가가 맞음.","risky(위험한): 이유는 좋은 결과인데 결론이 '위험하다'면 이유와 결론이 따로 놂.","controversial(논란이 많은): 글쓴이는 이 전환을 의심 없이 지지하므로 논란을 말할 근거가 없음.","premature(시기상조인): '아직 이르다'는 부정적 평가라, 문을 열어 준다는 좋은 이유와 이어지지 않음."],"om":["꼭 필요한","위험한","논란이 많은","시기상조인"],"en":"This reframing is essential, as it opens the door to systemic interventions and policy-level changes rather than placing the burden solely on individuals to cope or adapt.","ko":"이러한 관점 전환은 꼭 필요하다. 개인에게만 대처하거나 적응해야 하는 부담을 지우는 대신, 체계적인 개입과 정책 차원의 변화로 가는 문을 열어 주기 때문이다.","hl":["This reframing is essential","as it opens the door"],"khl":["꼭 필요하다","문을 열어 주기 때문이다"],"blocks":[{"t":"p","h":"as(~ 때문에)가 정하는 방향","x":["as(~ 때문에) 뒤는 이유다.","이유: 체계적인 개입과 정책 변화로 가는 문을 열어 준다.","좋은 일로 가는 문을 열어 주니 평가도 좋아야 한다.","unnecessary(불필요한)를 넣으면 이유와 결론이 따로 논다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","turning attention to(관심을 ~로 돌리다)는 shifting attention to(관심을 ~로 옮기다)와 같은 말이다.","responsibility(책임)도 burden(부담) 자리에 넣으면 '책임을 개인에게만 지우다'로 자연스럽다."]}],"post":["essential(꼭 필요한) ↔ unnecessary(불필요한)","좋은 이유 → 좋은 평가"]}],"quiz":[{"w":"important","m":"중요한","it":[["significant","중요한, 의미 있는","s"],["wooden","나무로 된","n"],["trivial","하찮은","a"],["hungry","배고픈","n"],["crucial","결정적인, 아주 중요한","s"],["curly","곱슬곱슬한","n"],["insignificant","하찮은, 중요하지 않은","a"]]},{"w":"collaborate","m":"협력하다","it":[["sneeze","재채기하다","n"],["cooperate","협력하다","s"],["join forces","힘을 합치다","s"],["bake","굽다","n"],["team up","힘을 합치다","s"],["unite","단결하다, 힘을 합치다","s"],["fold","접다","n"]]},{"w":"systemic","m":"체계적인, 시스템 전체의","it":[["localized","국소적인, 한정된","a"],["system-wide","시스템 전체의","s"],["sunny","화창한","n"],["polite","공손한","n"],["pervasive","전반에 퍼진","s"],["widespread","널리 퍼진","s"],["frozen","얼어붙은","n"]]},{"w":"recognition","m":"인정","it":[["blanket","담요","n"],["acknowledgment","인정, 승인","s"],["denial","부인, 부정","a"],["tunnel","터널","n"],["acceptance","받아들임, 수용","s"],["rejection","거부","a"],["recipe","요리법","n"]]},{"w":"essential","m":"꼭 필요한, 필수적인","it":[["vital","필수적인","s"],["rainy","비가 오는","n"],["unnecessary","불필요한","a"],["elderly","나이 든","n"],["indispensable","없어서는 안 될","s"],["optional","선택적인","a"],["noisy","시끄러운","n"]]}]},{"items":[{"slots":[["reframes"],["systemic"],["solely"],["root","superficial","a"],["rooted"]],"opts":["root","minor","visible","recent"],"or":["root(근본적인): 번아웃이 조직 문화에 rooted(뿌리를 둔, root의 과거분사) 문제라고 하므로 '근본 원인'이 맞음.","minor(사소한): 사소한 원인만 고쳐서는 구조 문제가 해결되지 않아 글의 주장과 반대임.","visible(눈에 보이는): 겉으로 보이는 원인만 다루라는 말이 되어, 뿌리를 고치자는 흐름과 어긋남.","recent(최근의): 원인이 언제 생겼는지는 글에서 다루지 않고, 핵심은 원인의 깊이임."],"om":["근본적인","사소한","눈에 보이는","최근의"],"en":"In practice, this means clinicians should collaborate with occupational health and leadership to address root causes.","ko":"실제로 이것은 임상의들이 근본 원인을 해결하기 위해 산업 보건 분야 및 경영진과 협력해야 한다는 뜻이다.","hl":["to address root causes","In practice"],"khl":["근본 원인을 해결하기 위해","실제로"],"blocks":[{"t":"p","h":"뿌리와 겉","x":["root(뿌리)에서 나온 root causes(뿌리가 되는 원인)는 곧 근본 원인이다.","번아웃의 뿌리는 어디라고 했나?","조직 문화, 리더십 관행, 일의 사회·경제적 맥락.","superficial(피상적인) 원인만 건드리면 뿌리는 그대로 남는다."]},{"t":"pair","h":"뿌리라는 그림이 두 번","x":[["root causes","근본 원인"],["rooted in organizational culture","조직 문화에 뿌리를 둔"]]}],"post":["root(근본적인) ↔ superficial(피상적인)","번아웃의 뿌리 = 조직 문화·리더십"]},{"slots":[["occupational"],["invites","forbids","a"],["solely","exclusively","s"],["collaborate","partner","s"],["essential"]],"opts":["invites","blames","hires","pays"],"or":["invites(권하다, invite의 3인칭 단수형): invite(권하다) + 사람 + to부정사(~에게 …하라고 권하다) 구조로, 구조적 개입 도입을 권하는 흐름에 맞음.","blames(탓하다, blame의 3인칭 단수형): blame(탓하다)은 뒤에 to부정사를 받지 않고, 고용주를 탓하는 내용도 본문에 없음.","hires(고용하다, hire의 3인칭 단수형): 고용주를 '고용한다'는 말이 되어 뜻이 성립하지 않음.","pays(돈을 주다, pay의 3인칭 단수형): 이 지정이 고용주에게 돈을 준다는 말이 되어 뜻이 성립하지 않음."],"om":["권하다, 요청하다","탓하다","고용하다","돈을 주다"],"en":"It invites employers to adopt structural interventions rather than relying solely on individual-level remedies.","ko":"그것은 고용주들이 개인 차원의 해결책에만 기대기보다 구조적인 개입을 도입하도록 권한다.","hl":["invites employers to adopt structural interventions","rather than relying solely on individual-level remedies"],"khl":["구조적인 개입을 도입하도록 권한다","개인 차원의 해결책에만 기대기보다"],"blocks":[{"t":"p","h":"rather than이 만든 대조","x":["A rather than B(B보다는 A) 꼴이다.","A: 구조적인 개입","B: 개인 차원의 해결책만","글쓴이는 A 편이다. 그러니 고용주에게 A를 하라고 권해야 맞다.","forbids(금지하다)는 글쓴이가 바라는 쪽을 막아 버린다."]},{"t":"p","h":"함정","x":["exclusively(오로지)는 solely(오로지)와 같은 뜻이다.","partner with(~와 협력하다)는 collaborate with(~와 협력하다) 자리에 그대로 들어간다."]}],"post":["invite(권하다) ↔ forbid(금지하다)","고용주에게: 개인 처방 말고 구조 개선"]},{"slots":[["important"],["adopt","implement","s"],["personal"],["broader","narrower","a"],["burden"]],"opts":["broader","stricter","older","simpler"],"or":["broader(더 넓은, broad의 비교급): 조직 문화 → 리더십 → 사회·경제적 맥락으로 범위가 넓어지는 나열이라 맞음.","stricter(더 엄격한, strict의 비교급): 맥락이 엄격하다는 말은 어색하고, 범위가 넓어지는 흐름과 관계없음.","older(더 오래된, old의 비교급): 시간의 길이는 글의 관심사가 아니고, 개인을 넘어 큰 틀로 보자는 흐름과 무관함.","simpler(더 단순한, simple의 비교급): 글은 번아웃 원인을 복잡한 구조 문제로 보므로 '더 단순한 맥락'은 반대 방향임."],"om":["더 넓은","더 엄격한","더 오래된","더 단순한"],"en":"It signaled a shift away from viewing burnout as a personal failing or a matter of individual resilience, toward ructural(구조적인) ↔ cosmetic(겉치레의)","겉 손보기 X, 구조 고치기"]},{"no":"35","slots":[["recognition","acknowledgment","s"],["adopt","reject","a"],["structural"],["rooted","embedded","s"],["broader"]],"opts":["adopt","postpone","compare","measure"],"or":["adopt(도입하다): 번아웃이 구조 문제이니 해결도 구조에서, 고용주가 구조적 개입을 받아들여야 한다는 흐름에 맞음.","postpone(미루다): 꼭 필요한 해결책을 미루라고 권한다는 말이 되어 글쓴이의 주장과 반대임.","compare(비교하다): 무엇과 비교하는지 대상이 없고, 실제로 실행하라는 다음 문장(In practice(실제로))과 이어지지 않음.","measure(측정하다): 개입은 재는 대상이 아니라 실행하는 것이라 '개입을 측정하라'는 말은 어색함."],"om":["도입하다","미루다","비교하다","측정하다"],"en":"It invites employers to adopt structural interventions rather than relying solely on individual-level remedies.","ko":"그것은 고용주들이 개인 차원의 해결책에만 기대기보다 구조적인 개입을 도입하도록 권한다.","hl":["to adopt structural interventions","It invites employers"],"khl":["구조적인 개입을 도입하도록","권한다"],"blocks":[{"t":"flow","h":"원인에서 해결까지","x":["번아웃 = 구조의 문제","그러니 해결도 구조에서","고용주가 구조적 개입을 도입"],"at":2},{"t":"p","h":"reject를 넣으면","x":["\"고용주에게 구조적인 개입을 거부하라고 권한다\"가 된다.","그런데 바로 다음 문장에서 의사는 경영진과 손잡고 근본 원인을 해결해야 한다고 한다.","회사가 구조 개선을 거부하면 손잡을 상대가 없다.","권하는 건 받아들이는 쪽, adopt(도입하다)다."]},{"t":"p","h":"함정 둘","x":["acknowledgment(인정)는 recognition(인정)과 같은 뜻이다.","embedded in(~에 깊이 박힌)도 rooted in(~에 뿌리를 둔)과 통한다."]}],"post":["adopt(도입하다) ↔ reject(거부하다)","고용주의 몫 = 구조적 개입 도입"]}],"compquiz":[{"w":"structural","m":"구조적인","it":[["fundamental","근본적인","s"],["fluffy","푹신한","n"],["secondary","부차적인","a"],["hungry","배고픈","n"],["basic","기본적인, 기초의","s"],["minor","사소한","a"],["rainy","비가 오는","n"]]},{"w":"adopt","m":"도입하다, 채택하다","it":[["bathe","목욕하다","n"],["embrace","받아들이다","s"],["reject","거부하다","a"],["yawn","하품하다","n"],["take up","(새로) 시작하다, 받아들이다","s"],["abandon","버리다, 그만두다","a"],["kneel","무릎을 꿇다","n"]]}],"no":"35"},{"id":"2610g1-36","title":"어휘특훈 · 26년 10월 고1 36번","sub":"뇌에 닿아야 소리가 된다","tpl":"All sound begins with some kind of {motion}, something that {disturbs} molecules in air, water, steel, wood, or other {medium}. Isaac Newton {noted} that light waves are {colorless}; the perception of color only {occurs} in the brain of a {living} organism. The {same} is true of sound. Thus perception of sound {begins} at our eardrums—{before} it hits our eardrums, it is {nothing_more_than} the {disturbance} of molecules. We can {measure} that disturbance with gauges and instruments, but until it hits a brain, it is not sound. You may have heard the old philosophical {riddle}, “If a tree {falls} in the forest and no one is there to hear it, does it make a sound?” No, because sound is a {psychological} concept, a {product} of brains. That tree will disturb molecules and make a mess, but if no {creature} hears it, no bird, fox, or human, it has not made sound.","fn":["*molecule: 분자","*eardrum: 고막","*gauge: 측정기","*organism: 생물(체)"],"mean":{"motion":"움직임, 운동","movement":"움직임","stillness":"고요함, 정지 상태","disturbs":"동사 disturb(흩뜨리다, 어지럽히다)의 3인칭 단수형","shakes":"동사 shake(흔들다)의 3인칭 단수형","settles":"동사 settle(가라앉히다, 진정시키다)의 3인칭 단수형","medium":"매질(소리·빛 등을 전달하는 물질)","matter":"물질","noted":"동사 note(언급하다, 주목하다)의 과거형","observed":"동사 observe(관찰하다, 말하다)의 과거형","denied":"동사 deny(부인하다)의 과거형","colorless":"색이 없는","colorful":"색이 다채로운","occurs":"동사 occur(일어나다)의 3인칭 단수형","happens":"동사 happen(일어나다)의 3인칭 단수형","takes place":"take place(일어나다, 발생하다)의 3인칭 단수형","living":"살아 있는","lifeless":"생명이 없는, 죽은","same":"같은 것, 마찬가지","opposite":"반대(되는 것)","begins":"동사 begin(시작되다)의 3인칭 단수형","starts":"동사 start(시작되다)의 3인칭 단수형","ends":"동사 end(끝나다)의 3인칭 단수형","before":"~하기 전에","after":"~한 후에","nothing more than":"~에 지나지 않는, ~일 뿐인","no more than":"~에 불과한, ~일 뿐인","merely":"단지, 그저 ~일 뿐","far more than":"~보다 훨씬 더한 것","disturbance":"교란, 흐트러짐(흔들림)","agitation":"(분자의) 요동, 흔들림","stability":"안정, 안정 상태","measure":"측정하다","quantify":"수치로 나타내다, 양을 재다","riddle":"수수께끼","puzzle":"수수께끼, 난제","falls":"동사 fall(쓰러지다, 떨어지다)의 3인칭 단수형","stands":"동사 stand(서 있다)의 3인칭 단수형","psychological":"심리적인","mental":"정신적인, 마음의","physical":"물리적인, 물질적인","product":"산물, 결과물","cause":"원인","creature":"생명체, 생물"},"sets":[{"items":[{"slots":[["motion","stillness","a"],["noted"],["living"],["nothing_more_than"],["psychological"]],"opts":["motion","silence","darkness","color"],"or":["motion(움직임): 쉼표 뒤 something that disturbs molecules(분자를 흩뜨리는 무언가)가 풀어 주듯, 분자를 흔드는 건 움직임이라 맞음.","silence(침묵): 침묵은 아무것도 흔들지 못해, 분자를 흩뜨리는 무언가라는 뒷말과 정반대임.","darkness(어둠): 어둠은 빛이 없는 상태일 뿐이라, something that disturbs molecules(분자를 흩뜨리는 무언가)가 될 수 없음.","color(색): 색은 뒤에서 뇌 안에서만 생긴다고 한 것이라, 바깥에서 분자를 흩뜨리는 출발점이 될 수 없음."],"om":["움직임","침묵","어둠","색"],"en":"All sound begins with some kind of motion, something that disturbs molecules in air, water, steel, wood, or other medium.","ko":"모든 소리는 어떤 종류의 움직임, 즉 공기, 물, 강철, 나무, 또는 다른 매질 속의 분자를 흩뜨리는 무언가에서 시작된다.","hl":["some kind of motion","something that disturbs molecules"],"khl":["어떤 종류의 움직임","분자를 흩뜨리는 무언가"],"blocks":[{"t":"flow","h":"소리가 되기까지의 길","x":["움직임이 생긴다","분자가 흔들린다","흔들림이 고막에 닿는다","뇌가 받아들인다","그제야 소리"],"at":0},{"t":"p","h":"쉼표 뒤가 풀어 주는 말","x":["motion(움직임) 바로 뒤에 something that disturbs molecules(분자를 흩뜨리는 무언가)가 붙는다.","쉼표 뒤가 motion(움직임)이 무엇인지 다시 설명하는 자리다.","분자를 흔드는 건 움직임이다.","stillness(고요함)는 아무것도 흔들지 못한다.","소리의 출발점이 고요함이 될 수는 없다."]}],"post":["motion(움직임) ↔ stillness(고요함)","소리의 출발 = 분자를 흔드는 움직임"]},{"slots":[["disturbs","shakes","s"],["colorless","colorful","a"],["occurs","happens","s"],["measure"],["creature"]],"opts":["colorless","brilliant","vivid","painted"],"or":["colorless(색이 없는): 색은 뇌 안에서만(only = 오직) 생긴다는 세미콜론 뒷말과 맞으려면 빛 자체엔 색이 없어야 함.","brilliant(눈부신): 빛이 눈부신지는 '색이 어디서 생기나'라는 논점과 무관하고, 뒷말과 짝이 안 맞음.","vivid(선명한): 빛에 이미 선명한 색이 있다는 뜻이 되어 '색은 뇌에서만 생긴다'와 충돌함.","painted(칠해진, paint의 과거분사): 빛에 색이 칠해져 있다는 말이 되어, 빛엔 색이 없다는 뉴턴의 말과 정반대임."],"om":["색이 없는","눈부신","선명한","칠해진"],"en":"Isaac Newton noted that light waves are colorless; the perception of color only occurs in the brain of a living organism.","ko":"아이작 뉴턴은 빛의 파동에는 색이 없다고 언급했다. 색의 지각은 살아 있는 생물의 뇌 안에서만 일어난다.","hl":["light waves are colorless","only occurs in the brain"],"khl":["빛의 파동에는 색이 없다","뇌 안에서만 일어난다"],"blocks":[{"t":"pair","h":"세미콜론(;) 앞뒤를 나란히","x":[["light waves are colorless","빛의 파동에는 색이 없다"],["the perception of color only occurs in the brain","색의 지각은 뇌 안에서만 일어난다"]]},{"t":"p","h":"colorful을 넣으면 생기는 충돌","x":["빛에 색이 이미 다채롭게 들어 있다면?","색은 뇌에 오기 전부터 있는 셈이다.","그러면 \"뇌 안에서만(only = 오직)\" 색이 생긴다는 뒷말과 부딪친다.","빛 자체엔 색이 없고, 색은 뇌가 만든다.","그래서 colorless(색이 없는)가 맞다."]},{"t":"p","h":"그대로 둘 두 단어","x":["shakes(흔들다, shake의 3인칭 단수형)는 disturbs(흩뜨리다, disturb의 3인칭 단수형) 자리에 넣어도 분자를 흔든다는 뜻이 그대로다.","happens(일어나다, happen의 3인칭 단수형)는 occurs(일어나다, occur의 3인칭 단수형)와 같은 말이다."]}],"post":["colorless(색이 없는) ↔ colorful(색이 다채로운)","빛엔 색 없음, 색은 뇌에서 생김"]},{"slots":[["medium","matter","s"],["same","opposite","a"],["begins"],["riddle"],["product"]],"opts":["same","reverse","contrary","exception"],"or":["same(같은 것): 색과 소리가 '뇌에 닿아야 생긴다'는 같은 원리로 이어지므로 The same is true of(~도 마찬가지다)가 맞음.","reverse(반대): 바로 뒤 Thus(따라서)가 색과 같은 원리를 이어 가므로 '반대'라고 하면 앞뒤가 안 맞음.","contrary(정반대): 소리가 색과 정반대라는 뜻이 되어, 뒤의 같은 원리 설명(고막 전엔 흔들림뿐)과 충돌함.","exception(예외): 소리가 예외라면 고막·뇌에서 비로소 소리가 생긴다는 뒤 내용이 나올 수 없음."],"om":["같은 것","반대","정반대","예외"],"en":"The same is true of sound. Thus perception of sound begins at our eardrums—before it hits our eardrums, it is nothing more than the disturbance of molecules.","ko":"소리도 마찬가지다. 따라서 소리의 지각은 우리의 고막에서 시작된다. 고막에 닿기 전에 그것은 분자의 흔들림에 지나지 않는다.","hl":["The same is true of sound","Thus"],"khl":["소리도 마찬가지다","따라서"],"blocks":[{"t":"p","h":"Thus가 정하는 방향","x":["Thus(따라서)는 앞말을 그대로 이어받는 연결어다.","앞말: 색은 빛이 아니라 뇌에서 생긴다.","뒷말: 소리도 고막에 닿기 전엔 그냥 분자의 흔들림이다.","색과 소리가 같은 원리로 움직인다.","opposite(반대)를 넣으면 \"소리는 색과 반대다\"가 된다.","그런데 바로 뒤에 같은 원리가 이어지니 앞뒤가 안 맞는다."]},{"t":"p","h":"함정","x":["matter(물질)는 medium(매질) 자리에 넣어도 \"그 밖의 물질 속 분자\"로 뜻이 통한다.","고칠 단어는 하나뿐."]}],"post":["same(같은 것) ↔ opposite(반대)","색의 원리 = 소리의 원리"]},{"slots":[["noted"],["living"],["disturbance"],["psychological","physical","a"],["creature"]],"opts":["psychological","mechanical","chemical","geographical"],"or":["psychological(심리적인): 쉼표 뒤 a product of brains(뇌의 산물)가 다시 풀어 주듯, 뇌 안에서 생기는 마음의 일이라 맞음.","mechanical(기계적인): 측정기로 잴 수 있는 바깥의 흔들림 쪽 말이라, '뇌의 산물'과 반대 편임.","chemical(화학적인): 글은 화학 반응을 다루지 않고, '뇌의 산물'이라는 다시 말하기와도 이어지지 않음.","geographical(지리적인): 땅·지역에 관한 말이라 소리의 정체를 설명하는 글과 전혀 관계없음."],"om":["심리적인","기계적인","화학적인","지리적인"],"en":"No, because sound is a psychological concept, a product of brains.","ko":"아니다. 소리는 심리적 개념, 즉 뇌의 산물이기 때문이다.","hl":["a psychological concept","a product of brains"],"khl":["심리적 개념","뇌의 산물"],"blocks":[{"t":"p","h":"쉼표 뒤의 다시 말하기","x":["a psychological concept(심리적 개념), a product of brains(뇌의 산물).","쉼표 뒤 a product of brains(뇌의 산물)가 앞말을 다시 풀어 준다.","뇌가 만든 것이니 마음속 일, 곧 심리적인 것이다.","physical(물리적인)은 분자처럼 바깥 세계에 있는 것을 말한다.","\"물리적 개념, 즉 뇌의 산물\"은 스스로 모순이다."]},{"t":"p","h":"이 글이 갈라놓은 두 가지","x":["바깥에 있는 것: 분자의 흔들림 (물리적)","뇌 안에서 생기는 것: 소리 (심리적)","필자는 소리를 두 번째 쪽에 놓는다."]}],"post":["psychological(심리적인) ↔ physical(물리적인)","분자의 흔들림 = 물리, 소리 = 뇌의 산물"]},{"slots":[["motion","movement","s"],["living"],["nothing_more_than","no more than","s"],["disturbance","stability","a"],["measure"]],"opts":["disturbance","balance","arrangement","calm"],"or":["disturbance(흐트러짐, 흔들림): 다음 문장의 that disturbance(그 흔들림)가 가리킬 말이 앞 문장에 있어야 하므로 맞음.","balance(균형): 균형 잡힌 분자는 흔들리지 않아, 뒤의 that disturbance(그 흔들림)가 가리킬 대상이 사라짐.","arrangement(배열): 분자가 가만히 놓인 모습이라, 움직임에서 시작되는 소리의 흐름과 안 맞음.","calm(고요): 분자가 고요하다면 첫 문장의 '분자를 흔드는 움직임'과 정반대임."],"om":["교란, 흐트러짐","균형","배열","고요"],"en":"Thus perception of sound begins at our eardrums—before it hits our eardrums, it is nothing more than the disturbance of molecules. We can measure that disturbance with gauges and instruments, but until it hits a brain, it is not sound.","ko":"따라서 소리의 지각은 우리의 고막에서 시작된다. 고막에 닿기 전에 그것은 분자의 흔들림에 지나지 않는다. 우리는 그 흔들림을 측정기와 기구로 측정할 수 있지만, 그것이 뇌에 닿기 전까지는 소리가 아니다.","hl":["that disturbance","the disturbance of molecules"],"khl":["그 흔들림을","분자의 흔들림에"],"blocks":[{"t":"p","h":"바로 다음 문장이 되짚는 말","x":["다음 문장에 that disturbance(그 흔들림)가 나온다.","that(그)은 방금 말한 것을 가리킨다.","그러니 앞 문장에도 disturbance(흔들림)가 있어야 한다.","stability(안정)를 넣으면 \"그 흔들림\"이 가리킬 대상이 없어진다.","게다가 첫 문장부터 분자는 계속 흔들리는 중이다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","movement(움직임)는 motion(움직임)과 뜻이 같다.","no more than(~에 불과한)은 nothing more than(~에 지나지 않는)과 같은 표현이다.","철자가 낯설어도 뜻이 같으면 맞는 문장."]}],"post":["disturbance(흔들림) ↔ stability(안정)","고막 전 = 분자의 흔들림일 뿐"]}],"quiz":[{"w":"motion","m":"움직임","it":[["harvest","수확","n"],["movement","움직임","s"],["stillness","고요함, 정지","a"],["courage","용기","n"],["mobility","이동성, 움직일 수 있음","s"],["immobility","움직이지 않음","a"],["rumor","소문","n"]]},{"w":"colorless","m":"색이 없는","it":[["colorful","색이 다채로운","a"],["patient","참을성 있는","n"],["uncolored","색을 입히지 않은","s"],["honest","정직한","n"],["vivid","선명한, 생생한","a"],["pale","창백한, 색이 옅은","s"],["frequent","잦은","n"]]},{"w":"same","m":"같은","it":[["humid","습한","n"],["identical","동일한","s"],["opposite","반대의","a"],["ancient","고대의","n"],["equivalent","동등한","s"],["different","다른","a"],["polite","공손한","n"]]},{"w":"psychological","m":"심리적인","it":[["mental","정신적인","s"],["annual","해마다의","n"],["physical","물리적인, 신체의","a"],["coastal","해안의","n"],["cognitive","인지의","s"],["bodily","신체의","a"],["legal","법률의","n"]]},{"w":"disturbance","m":"교란, 흐트러짐","it":[["invitation","초대","n"],["agitation","요동, 동요","s"],["calm","고요, 평온","a"],["salary","급여","n"],["commotion","소동, 동요","s"],["stability","안정","a"],["journey","여행","n"]]}]},{"items":[{"slots":[["disturbs","settles","a"],["colorless"],["same"],["measure"],["product"]],"opts":["disturbs","freezes","protects","organizes"],"or":["disturbs(흩뜨리다, disturb의 3인칭 단수형): 마지막 문장 That tree will disturb molecules(그 나무는 분자를 흩뜨릴 것이다)와 같은 동사로 처음과 끝이 맞물림.","freezes(얼리다, freeze의 3인칭 단수형): 분자를 얼리면 움직임이 멈춰, 움직임에서 소리가 시작된다는 흐름과 반대임.","protects(보호하다, protect의 3인칭 단수형): 분자를 지켜 준다는 말은 소리가 생기는 과정과 관계없음.","organizes(정리하다, organize의 3인칭 단수형): 분자를 가지런히 정리하는 건 흔드는 것과 반대 그림이라 맞지 않음."],"om":["흩뜨리다","얼리다","보호하다","정리하다"],"en":"All sound begins with some kind of motion, something that disturbs molecules in air, water, steel, wood, or other medium.","ko":"모든 소리는 어떤 종류의 움직임, 즉 공기, 물, 강철, 나무, 또는 다른 매질 속의 분자를 흩뜨리는 무언가에서 시작된다.","hl":["disturbs molecules","some kind of motion"],"khl":["분자를 흩뜨리는","어떤 종류의 움직임"],"blocks":[{"t":"pair","h":"글의 처음과 끝을 나란히","x":[["something that disturbs molecules","분자를 흩뜨리는 무언가 (첫 문장)"],["That tree will disturb molecules","그 나무는 분자를 흩뜨릴 것이다 (마지막 문장)"]]},{"t":"p","h":"settles가 틀린 이유","x":["필자는 처음과 끝에서 같은 동사 disturb(흩뜨리다)를 쓴다.","쓰러지는 나무가 분자를 흔드는 장면이 소리의 첫 단계다.","settles(가라앉히다)는 흔들림을 멈추게 하는 말이다.","가라앉은 분자에서는 아무것도 시작되지 않는다."]}],"post":["disturb(흩뜨리다) ↔ settle(가라앉히다)","처음과 끝의 같은 동사 disturb(흩뜨리다)"]},{"slots":[["noted","denied","a"],["occurs","takes place","s"],["begins","starts","s"],["riddle"],["creature"]],"opts":["noted","doubted","rejected","questioned"],"or":["noted(언급하다, note의 과거형): 뉴턴의 말이 맞아야 The same is true of sound(소리도 마찬가지다)가 힘을 얻으므로 맞음.","doubted(의심하다, doubt의 과거형): 뉴턴이 빛에 색이 없다는 걸 의심했다면, 필자 주장의 받침대가 무너짐.","rejected(거부하다, reject의 과거형): 빛에 색이 있다는 말이 되어 '색은 뇌 안에서만 생긴다'와 정면으로 부딪침.","questioned(의문을 제기하다, question의 과거형): 의심과 같은 방향이라, 뉴턴의 말을 근거로 삼는 흐름이 깨짐."],"om":["언급했다","의심했다","거부했다","의문을 제기했다"],"en":"Isaac Newton noted that light waves are colorless; the perception of color only occurs in the brain of a living organism. The same is true of sound.","ko":"아이작 뉴턴은 빛의 파동에는 색이 없다고 언급했다. 색의 지각은 살아 있는 생물의 뇌 안에서만 일어난다. 소리도 마찬가지다.","hl":["Isaac Newton noted","The same is true of sound"],"khl":["아이작 뉴턴은","소리도 마찬가지다"],"blocks":[{"t":"tap","h":"질문 하나","q":"필자는 왜 갑자기 뉴턴을 꺼냈을까?","a":["유명한 과학자의 말로 자기 주장을 받치려고.","뉴턴의 말(빛엔 색이 없다)이 맞아야 \"소리도 마찬가지\"가 힘을 얻는다.","그러니 뉴턴은 그 말을 했어야(noted = 언급했다) 한다."]},{"t":"p","h":"denied를 넣고 다시 읽기","x":["\"뉴턴은 빛에 색이 없다는 것을 부인했다.\"","그러면 빛에 색이 있다는 말이 된다.","바로 뒤 \"색은 뇌 안에서만 생긴다\"와 정면으로 부딪친다."]},{"t":"p","h":"그대로 둘 두 표현","x":["takes place(일어나다, take place의 3인칭 단수형)는 occurs(일어나다, occur의 3인칭 단수형)와 뜻이 같다.","starts(시작되다, start의 3인칭 단수형)는 begins(시작되다, begin의 3인칭 단수형)와 같은 말이다."]}],"post":["note(언급하다) ↔ deny(부인하다)","뉴턴의 말 = 필자 주장의 받침대"]},{"slots":[["medium"],["living","lifeless","a"],["disturbance","agitation","s"],["measure"],["falls"]],"opts":["living","extinct","artificial","imaginary"],"or":["living(살아 있는): 지각은 보고 듣고 느끼는 일이라 살아 있는 생물의 뇌에서만 가능하므로 맞음.","extinct(멸종한): 멸종한 생물의 뇌는 지금 아무것도 지각할 수 없어 말이 안 됨.","artificial(인공의): 글 끝의 bird, fox, human(새, 여우, 사람)처럼 듣는 주체는 모두 실제 생명체임.","imaginary(상상 속의): 상상 속 생물의 뇌는 실제 지각을 설명하는 글의 흐름과 맞지 않음."],"om":["살아 있는","멸종한","인공의","상상 속의"],"en":"Isaac Newton noted that light waves are colorless; the perception of color only occurs in the brain of a living organism.","ko":"아이작 뉴턴은 빛의 파동에는 색이 없다고 언급했다. 색의 지각은 살아 있는 생물의 뇌 안에서만 일어난다.","hl":["the brain of a living organism","perception"],"khl":["살아 있는 생물의 뇌","지각"],"blocks":[{"t":"p","h":"lifeless를 넣고 읽어 보기","x":["\"색의 지각은 죽은 생물의 뇌에서만 일어난다.\"","지각은 보고 듣고 느끼는 일이다.","죽은 뇌는 아무것도 느끼지 못한다.","그래서 living(살아 있는) 뇌여야 한다."]},{"t":"p","h":"글 끝에서 다시 확인","x":["마지막 문장도 같은 생각이다.","no bird, fox, or human(새도 여우도 사람도 없다면) 소리가 아니다.","새·여우·사람은 모두 살아 있는 생명체다.","듣는 주인공은 늘 살아 있는 존재."]},{"t":"p","h":"함정","x":["agitation(요동)은 분자가 흔들리는 상태를 말한다.","disturbance(흔들림) 자리에 들어가도 뜻이 같다."]}],"post":["living(살아 있는) ↔ lifeless(생명이 없는)","지각하는 주체 = 살아 있는 뇌"]},{"slots":[["motion"],["occurs"],["begins","ends","a"],["psychological"],["creature"]],"opts":["begins","stops","fades","weakens"],"or":["begins(시작되다, begin의 3인칭 단수형): 고막 전엔 흔들림뿐이고 뇌에 닿아야 소리가 되므로, 고막은 지각이 시작되는 곳임.","stops(멈추다, stop의 3인칭 단수형): 고막에서 지각이 멈추면 뇌까지 가서 소리가 된다는 흐름이 끊김.","fades(흐려지다, fade의 3인칭 단수형): 흐려지려면 먼저 지각이 있어야 하는데, 고막 전엔 아직 지각이 없음.","weakens(약해지다, weaken의 3인칭 단수형): 아직 시작도 안 된 지각이 약해질 수는 없음."],"om":["시작된다","멈춘다","흐려진다","약해진다"],"en":"Thus perception of sound begins at our eardrums—before it hits our eardrums, it is nothing more than the disturbance of molecules.","ko":"따라서 소리의 지각은 우리의 고막에서 시작된다. 고막에 닿기 전에 그것은 분자의 흔들림에 지나지 않는다.","hl":["perception of sound begins at our eardrums","before it hits our eardrums"],"khl":["소리의 지각은 우리의 고막에서 시작된다","고막에 닿기 전에"],"blocks":[{"t":"flow","h":"고막은 출발선","x":["고막 전: 분자의 흔들림뿐","고막: 지각이 시작되는 곳","뇌: 비로소 소리가 됨"],"at":1},{"t":"p","h":"ends가 틀린 이유","x":["고막 앞쪽은 아직 소리가 아니다.","뇌에 닿아야 소리가 된다.","그러니 고막은 지각이 끝나는 곳이 아니라 막 시작되는 곳이다.","ends(끝나다)를 넣으면 뇌까지 가기도 전에 지각이 끝나 버린다."]}],"post":["begin(시작되다) ↔ end(끝나다)","고막 = 소리 지각의 출발선"]},{"slots":[["noted","observed","s"],["measure","quantify","s"],["riddle"],["psychological"],["product","cause","a"]],"opts":["product","source","origin","master"],"or":["product(산물): 흔들림이 뇌에 닿아 뇌가 소리를 만드니, 소리는 뇌가 만든 결과물임.","source(근원): 소리가 뇌의 근원이라는 말이 되어 원인과 결과가 뒤집힘.","origin(기원): 소리가 뇌를 낳는다는 뜻이 되어 '흔들림 → 뇌 → 소리' 순서가 뒤집힘.","master(주인): 소리가 뇌를 지배한다는 엉뚱한 말이 되어, 뇌가 소리를 만든다는 흐름과 반대임."],"om":["산물","근원","기원","주인"],"en":"No, because sound is a psychological concept, a product of brains.","ko":"아니다. 소리는 심리적 개념, 즉 뇌의 산물이기 때문이다.","hl":["a product of brains","psychological concept"],"khl":["뇌의 산물","심리적 개념"],"blocks":[{"t":"p","h":"무엇이 먼저인가","x":["원인: 분자의 흔들림이 뇌에 닿는다.","결과: 뇌가 그것을 소리로 만든다.","소리는 뇌가 만든 결과물(product = 산물)이다.","cause(원인)를 넣으면 소리가 뇌를 만든다는 말이 된다.","순서가 완전히 뒤집힌다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["observed(관찰하다, observe의 과거형)는 여기서 \"(관찰해서) 말했다\"는 뜻이라 noted(언급하다, note의 과거형) 자리에 맞는다.","quantify(수치로 재다)는 measure(측정하다)처럼 측정기로 하는 일이다.","둘 다 문장의 방향을 바꾸지 않는다."]}],"post":["product(산물) ↔ cause(원인)","흔들림 → 뇌 → 소리 (뇌가 만든 결과)"]}],"quiz":[{"w":"disturb","m":"흩뜨리다, 어지럽히다","it":[["borrow","빌리다","n"],["disrupt","방해하다, 혼란에 빠뜨리다","s"],["calm","진정시키다","a"],["describe","묘사하다","n"],["unsettle","동요시키다","s"],["settle","가라앉히다","a"],["deliver","배달하다","n"]]},{"w":"note","m":"언급하다, 주목하다","it":[["observe","관찰하다, 말하다","s"],["purchase","구입하다","n"],["overlook","간과하다","a"],["bake","굽다","n"],["remark","언급하다","s"],["ignore","무시하다","a"],["sail","항해하다","n"]]},{"w":"living","m":"살아 있는","it":[["noisy","시끄러운","n"],["alive","살아 있는","s"],["dead","죽은","a"],["cheap","값싼","n"],["animate","살아 있는, 생명이 있는","s"],["lifeless","생명이 없는","a"],["brief","짧은","n"]]},{"w":"begin","m":"시작되다","it":[["end","끝나다","a"],["invite","초대하다","n"],["start","시작되다","s"],["repair","수리하다","n"],["finish","끝나다","a"],["commence","시작되다","s"],["whisper","속삭이다","n"]]},{"w":"product","m":"산물, 결과물","it":[["blanket","담요","n"],["result","결과","s"],["cause","원인","a"],["ladder","사다리","n"],["outcome","결과","s"],["source","근원","a"],["pillar","기둥","n"]]}]}],"comp":[{"no":"36","slots":[["colorless"],["before","after","a"],["riddle","puzzle","s"],["psychological"],["creature"]],"opts":["before","once","because","while"],"or":["before(~하기 전에): 고막에서 지각이 시작되니 고막에 닿기 전엔 흔들림뿐이라는 뜻이 맞고, until it hits a brain(뇌에 닿기 전까지는)과도 짝을 이룸.","once(일단 ~하면): 고막에 닿은 뒤에도 흔들림뿐이라는 말이 되어, 고막에서 지각이 시작된다는 앞말과 충돌함.","because(~ 때문에): 고막에 닿기 때문에 흔들림일 뿐이라는 말은 원인 관계가 성립하지 않음.","while(~하는 동안): 닿는 동안만 흔들림이라는 말이 되어, 닿기 '전'의 상태를 말하는 흐름과 안 맞음."],"om":["~하기 전에","일단 ~하면","~ 때문에","~하는 동안"],"en":"Thus perception of sound begins at our eardrums—before it hits our eardrums, it is nothing more than the disturbance of molecules. We can measure that disturbance with gauges and instruments, but until it hits a brain, it is not sound.","ko":"따라서 소리의 지각은 우리의 고막에서 시작된다. 고막에 닿기 전에 그것은 분자의 흔들림에 지나지 않는다. 우리는 그 흔들림을 측정기와 기구로 측정할 수 있지만, 그것이 뇌에 닿기 전까지는 소리가 아니다.","hl":["before it hits our eardrums","until it hits a brain"],"khl":["고막에 닿기 전에","뇌에 닿기 전까지는"],"blocks":[{"t":"pair","h":"시간 표현 두 개를 나란히","x":[["before it hits our eardrums","고막에 닿기 전에 → 아직 분자의 흔들림"],["until it hits a brain","뇌에 닿기 전까지는 → 아직 소리가 아님"]]},{"t":"p","h":"after가 틀린 이유","x":["두 표현 모두 \"닿기 전\"엔 아직 소리가 아니라고 말한다.","after(~한 후에)를 넣으면 고막에 닿은 뒤에도 그냥 흔들림이라는 말이 된다.","그런데 앞에서 고막에서 지각이 시작된다고 했다.","고막을 지난 뒤엔 이미 지각이 시작된 상태다."]},{"t":"p","h":"함정","x":["puzzle(수수께끼)은 riddle(수수께끼)과 같은 뜻이라 고치지 않는다."]}],"post":["before(~하기 전에) ↔ after(~한 후에)","고막 전 = 흔들림, 뇌 전 = 소리 아님"]},{"no":"36","slots":[["disturbs"],["nothing_more_than","merely","s"],["falls","stands","a"],["psychological","mental","s"],["product"]],"opts":["falls","grows","blooms","sways"],"or":["falls(쓰러지다, fall의 3인칭 단수형): 마지막 문장의 make a mess(엉망을 만들다)처럼 큰 소리가 날 만한 장면이라 맞음.","grows(자라다, grow의 3인칭 단수형): 나무가 자라는 데는 소리를 따질 큰 움직임이 없어 수수께끼가 되지 않음.","blooms(꽃피다, bloom의 3인칭 단수형): 꽃이 피는 것도 조용한 일이라, 분자를 흔들고 엉망을 만드는 장면과 안 맞음.","sways(흔들리다, sway의 3인칭 단수형): 살랑 흔들리는 정도로는 make a mess(엉망을 만들다)가 되지 않고, 이 수수께끼의 장면은 쓰러지는 나무임."],"om":["쓰러지다","자라다","꽃피다","흔들리다"],"en":"You may have heard the old philosophical riddle, “If a tree falls in the forest and no one is there to hear it, does it make a sound?”","ko":"여러분은 \"숲에서 나무가 쓰러지는데 그 소리를 들을 사람이 아무도 없다면, 그 나무는 소리를 내는 것일까?\"라는 오래된 철학적 수수께끼를 들어 본 적이 있을 것이다.","hl":["If a tree falls in the forest","does it make a sound?"],"khl":["숲에서 나무가 쓰러지는데","소리를 내는 것일까?"],"blocks":[{"t":"tap","h":"수수께끼 장면 떠올리기","q":"가만히 서 있는 나무를 두고 \"소리가 나느냐\"고 물을까?","a":["묻지 않는다.","소리를 따질 만한 큰 움직임이 있어야 질문이 된다.","그래서 쓰러지는(falls) 나무다.","마지막 문장의 make a mess(엉망을 만들다)도 쓰러진 나무의 모습이다."]},{"t":"p","h":"그대로 둘 두 단어","x":["merely(그저 ~일 뿐)는 nothing more than(~에 지나지 않는)과 같은 뜻이다.","mental(정신적인)은 psychological(심리적인)처럼 마음, 곧 뇌 안의 일을 가리킨다."]}],"post":["fall(쓰러지다) ↔ stand(서 있다)","쓰러지는 나무 = 분자는 흔들지만 듣는 이 없음"]}],"compquiz":[{"w":"before","m":"~하기 전에","it":[["despite","~에도 불구하고","n"],["prior to","~ 이전에","s"],["after","~한 후에","a"],["beneath","~ 아래에","n"],["ahead of","~보다 앞서","s"],["following","~ 후에","a"],["among","~ 사이에","n"]]},{"w":"fall","m":"쓰러지다, 떨어지다","it":[["drop","떨어지다","s"],["whisper","속삭이다","n"],["rise","오르다, 일어서다","a"],["borrow","빌리다","n"],["collapse","무너지다, 쓰러지다","s"],["ascend","올라가다","a"],["paint","칠하다","n"]]}],"no":"36"},{"id":"2610g1-37","title":"어휘특훈 · 26년 10월 고1 37번","sub":"원격 협업이 만드는 인위적인 틈","tpl":"When people are {collaborating} face to face, they can {easily} see each other and the range of {different} communication cues being used, so the task space is a {subset} of the communication space. Ishii, a professor at the MIT Media Lab, {describes} this as {seamless} communication because there is no functional {separation} between the task and communication space. However, when people are working {remotely}, the task space is {often} {separated} from the communication space. For example, when video conferencing, people may have the face of their {collaborator} on one screen, while looking at a {shared} document on another. In t  상식(퀴즈에 나올 법한 자잘한 지식)","*as a function of: ~에 따라(~에 비례해)"],"mean":{"certain":"확신하는, 확실한","confident":"확신하는, 자신 있는","general":"일반적인 (general-knowledge: 일반 상식)","specialized":"전문화된, 전문적인","evaluate":"평가하다","assess":"평가하다","rate":"(점수·등급을) 매기다, 평가하다","ignore":"무시하다","intervals":"명사 interval(간격)의 복수형","Crucially":"결정적으로, 매우 중요하게","Importantly":"중요하게도","repeated":"동사 repeat(반복하다)의 과거분사형. were repeated = 반복되었다(수동태)","reused":"동사 reuse(다시 쓰다)의 과거분사형. 다시 쓰였다","replaced":"동사 replace(교체하다)의 과거분사형. 교체되었다","new":"새로운","familiar":"익숙한, 친숙한","compared":"동사 compare(비교하다)의 과거형","disregarded":"동사 disregard(무시하다)의 과거형","astonishing":"놀라운 (동사 astonish(깜짝 놀라게 하다)에서 온 형용사)","surprising":"놀라운","Regardless of":"~와 상관없이","Irrespective of":"~와 관계없이","Depending on":"~에 따라","belief":"믿음","faith":"믿음, 신뢰","disbelief":"불신, 믿지 않음","went up":"구동사 go up(올라가다)의 과거형","went down":"구동사 go down(내려가다)의 과거형","increased":"동사 increase(증가하다)의 과거형","repetition":"반복","novelty":"새로움, 참신함","often":"자주","frequently":"자주, 빈번하게","rarely":"드물게, 좀처럼 ~않는","true":"참인, 사실인","false":"거짓의","sounds":"동사 sound(~하게 들리다)의 3인칭 단수 현재형","seems":"동사 seem(~처럼 보이다)의 3인칭 단수 현재형","known":"동사 know(알다)의 과거분사형. become known as = ~로 알려지게 되다","illusory":"착각을 일으키는, 환상에 불과한","genuine":"진짜의"},"sets":[{"items":[{"slots":[["general","specialized","a"],["evaluate"],["Crucially"],["belief"],["often"]],"opts":["general","secret","personal","local"],"or":["general(일반적인): 바로 옆 trivia-like(잡학 같은)와 어울리고, 평범한 대학생이 참·거짓을 짐작할 수 있는 상식임","secret(비밀의): 비밀 지식이면 대학생들이 참·거짓을 짐작할 수 없고, 누구나 들어 봤을 trivia-like(잡학 같은) 상식과 정반대임","personal(개인적인): 개인 지식이면 남이 참·거짓을 판단할 수 없어 60개 문장을 함께 평가하는 실험이 안 됨","local(지역의): 특정 지역 지식으로 범위를 좁힐 근거가 없고, 누구나 들어 봤을 잡학 상식과 맞지 않음"],"om":["일반적인","비밀의","개인적인","지역의"],"en":"In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false.","ko":"1977년, 심리학자 Lynn Hasher와 David Goldstein은 한 무리의 대학생들에게 일반 상식 잡학 같은 문장 60개가 처럼 들림\"이다.","false(거짓의)를 넣으면 들을수록 거짓처럼 들린다는 말이 된다.","그건 진실 효과가 아니라 정반대 현상이다."]},{"t":"p","h":"함정","x":["Irrespective of(~와 관계없이)는 Regardless of(~와 상관없이)와 같은 뜻이라 고치지 않는다."]}],"post":["true(참인) ↔ false(거짓의)","반복 = 참처럼 들리게 만드는 힘"]}],"compquiz":[{"w":"repeated","m":"반복된","it":[["recurrent","되풀이되는","s"],["wooden","나무로 된","n"],["single","단 한 번의","a"],["frequent","잦은, 빈번한","s"],["thirsty","목마른","n"],["one-time","일회성의","a"],["square","정사각형의","n"]]},{"w":"true","m":"참인, 사실인","it":[["rural","시골의","n"],["accurate","정확한","s"],["false","거짓의","a"],["generous","관대한","n"],["correct","맞는, 옳은","s"],["untrue","사실이 아닌","a"],["salty","짠","n"]]}],"no":"38"},{"id":"2610g1-39","title":"어휘특훈 · 26년 10월 고1 39번","sub":"잠수와 몸 안팎의 압력 균형","tpl":"The human body on the Earth’s surface experiences {constant} air pressure equal to 16–18 tons per square meter of its body surface. However, this pressure is not {felt} because {external} pressure is {balanced} by {internal} pressure in the lungs and air cavities of the body. During dives, {in_addition_to} atmospheric pressure, the pressure of the water also {acts} on the human body. When {submerged} underwater, to {avoid} feeling the pressure of the surrounding environment, it is {necessary} to {maintain} the condition of {equal} external and internal pressure. To {achieve} this, air or a breathing mixture is {supplied} to the diver under pressure equal to the pressure applied by the surrounding water. Water pressure {increases} {proportionally} with depth. It increases by 1 bar for every 10 meters. It follows that a diver at a depth of 10 meters experiences a pressure of 2 bar, and to {stabilize} pressure, the supply of a breathing mixture under a pressure of 2 bar is {required}.","fn":["*cavity: (몸속의) 빈 공간","*atmospheric pressure: 대기압(공기가 누르는 압력)","*breathing mixture: 호흡용 혼합 기체","*bar: 바(압력의 단위)"],"mean":{"constant":"끊임없는, 일정한","steady":"일정한, 꾸준한","occasional":"가끔의","felt":"동사 feel(느끼다)의 과거분사형. is not felt = 느껴지지 않는다","noticed":"동사 notice(알아차리다)의 과거분사형. 알아차려지다","external":"외부의","internal":"내부의","inner":"안쪽의, 내부의","balanced":"동사 balance(균형을 맞추다)의 과거분사형. is balanced by = ~와 균형을 이루다","offset":"동사 offset(상쇄하다)의 과거분사형(원형과 모양이 같음). 상쇄되다","exceeded":"동사 exceed(넘어서다)의 과거분사형. is exceeded by = ~에 의해 넘어서지다(~보다 작다)","in addition to":"~에 더해, ~ 외에도","besides":"~ 외에도","instead of":"~ 대신에","acts":"동사 act(작용하다)의 3인칭 단수 현재형. act on = ~에 작용하다","presses":"동사 press(누르다)의 3인칭 단수 현재형","submerged":"동사 submerge(물속에 잠기게 하다)의 과거분사형. When submerged = 물속에 잠겼을 때","immersed":"동사 immerse(담그다)의 과거분사형. 물에 잠긴","avoid":"피하다","necessary":"필요한","essential":"필수적인","unnecessary":"불필요한","maintain":"유지하다","abandon":"버리다, 포기하다","equal":"같은","unequal":"같지 않은","achieve":"이루다, 달성하다","accomplish":"해내다, 이루다","prevent":"막다","supplied":"동사 supply(공급하다)의 과거분사형. is supplied = 공급된다","provided":"동사 provide(제공하다)의 과거분사형. 제공된다","increases":"동사 increase(증가하다)의 3인칭 단수 현재형","decreases":"동사 decrease(감소하다)의 3인칭 단수 현재형","proportionally":"비례하여","irregularly":"불규칙하게","stabilize":"안정시키다","equalize":"같게 하다, 균등하게 하다","destabilize":"불안정하게 하다","required":"동사 require(필요로 하다)의 과거분사형. is required = 필요하다","prohibited":"동사 prohibit(금지하다)의 과거분사형. 금지된다"},"sets":[{"items":[{"slots":[["constant","occasional","a"],["balanced"],["acts"],["necessary"],["increases"]],"opts":["constant","sudden","gentle","brief"],"om":["끊임없는","갑작스러운","약한","짧은"],"or":["constant(끊임없는): 땅 위에 있는 한 공기는 늘 몸을 누르므로 본문 흐름과 맞음.","sudden(갑작스러운): 공기 압력은 갑자기 생기는 것이 아니라 땅 위에서 늘 받는 것이라 맞지 않음.","gentle(약한): 1제곱미터당 16~18톤이라는 엄청난 무게와 어울리지 않음.","brief(짧은): 잠깐 받는 압력이라면 '늘 받지만 못 느낀다'는 이 글의 출발점이 무너짐."],"en":"The human body on the Earth’s surface experiences constant air pressure equal to 16–18 tons per square meter of its body surface. However, this pressure is not felt because external pressure is balanced by internal pressure in the lungs and air cavities of the body.","ko":"지구 표면에 있는 인간의 몸은 몸 표면 1제곱미터당 16~18톤에 해당하는 끊임없는 공기 압력을 받는다. 하지만 이 압력은 느껴지지 않는다. 외부 압력이 폐와 몸속 공기 공간의 내부 압력과 균형을 이루기 때문이다.","hl":["constant air pressure","this p ,"~ 때문에","~ 옆에","~에 따르면"],"or":["in addition to(~에 더해): 뒤의 also(~도)와 맞물려 대기압 위에 물의 압력이 하나 더 얹힌다는 뜻이 됨.","because of(~ 때문에): 대기압 때문에 물의 압력이 생긴다는 말이 되는데, 물의 압력은 물에서 오므로 원인 관계가 성립하지 않음.","next to(~ 옆에): 압력은 장소처럼 옆에 놓이는 것이 아니라 뜻이 통하지 않음.","according to(~에 따르면): 대기압이 정보의 출처가 될 수 없어 문장이 어색함."],"en":"During dives, in addition to atmospheric pressure, the pressure of the water also acts on the human body.","ko":"잠수하는 동안에는 대기압에 더해 물의 압력도 인간의 몸에 작용한다.","hl":["in addition to atmospheric pressure","the pressure of the water also acts"],"khl":["대기압에 더해","물의 압력도"],"blocks":[{"t":"tap","h":"질문 하나","q":"물속에 들어가면 공기 압력은 사라질까?","a":["사라지지 않는다.","글은 in addition to atmospheric pressure(대기압에 더해)라고 한다.","대기압은 그대로 있고, 물의 압력이 하나 더 얹힌다."]},{"t":"p","h":"also가 보내는 신호","x":["also(~도)는 하나가 더 있다는 말이다.","instead of(~ 대신에)를 넣으면 \"공기 압력 대신 물 압력도\"가 된다.","대신이면서 \"~도\"일 수는 없다."]},{"t":"p","h":"함정","x":["presses(누르다)는 acts(작용하다, act의 3인칭 단수 현재형) 자리에 써도 된다.","물이 몸에 작용한다는 건 결국 몸을 누른다는 것."]}],"post":["in addition to(~에 더해) ↔ instead of(~ 대신에)","물속 = 대기압 + 물의 압력"]},{"slots":[["felt"],["submerged"],["necessary","unnecessary","a"],["supplied"],["stabilize"]],"opts":["necessary","dangerous","boring","illegal"],"om":["필요한","위험한","지루한","불법인"],"or":["necessary(필요한): 다음 문장에서 To achieve this(이를 이루기 위해) 공기까지 넣어 주므로 꼭 필요한 조건이라는 흐름과 맞음.","dangerous(위험한): 압력을 못 느끼게 해 주는 조건을 위험하다고 하는 꼴이라 정반대임.","boring(지루한): 지루한지는 to avoid feeling(느끼지 않으려면)이 요구하는 조건과 관계없음.","illegal(불법인): 법을 어기는 일이라는 단서가 없고, 다음 문장은 오히려 그 상태를 이루려고 공기를 넣어 줌."],"en":"When submerged underwater, to avoid feeling the pressure of the surrounding environment, it is necessary to maintain the condition of equal external and internal pressure. To achieve this, air or a breathing mixture is supplied to the diver …","ko":"물속에 잠겼을 때 주변 환경의 압력을 느끼지 않으려면, 외부 압력과 내부 압력이 같은 상태를 유지하는 것이 필요하다. 이것을 이루기 위해, 공기나 호흡용 혼합 기체가 잠수부에게 공급된다 …","hl":["it is necessary to maintain","To achieve this"],"khl":["유지하는 것이 필요하다","이것을 이루기 위해"],"blocks":[{"t":"pair","h":"앞뒤 문장 나란히","x":[["it 리와 관련된 말이라 압력이 늘어나는 방식과 상관없음.","visibly(눈에 띄게): 수압은 눈에 보이는 것이 아니며 '10미터마다 1바'라는 비율 설명과 연결되지 않음."],"en":"Water pressure increases proportionally with depth. It increases by 1 bar for every 10 meters.","ko":"수압은 깊이에 비례하여 증가한다. 10미터마다 1바씩 증가한다.","hl":["proportionally with depth","for every 10 meters"],"khl":["깊이에 비례하여","10미터마다"],"blocks":[{"t":"p","h":"규칙이 있는지 확인","x":["10미터마다 1바.","딱 정해진 비율이다.","깊이가 두 배가 되면 늘어나는 압력도 두 배.","이게 proportionally(비례하여)다.","irregularly(불규칙하게)를 넣으면 바로 뒤의 \"10미터마다 1바\"라는 규칙과 맞지 않는다."]},{"t":"p","h":"함정","x":["accomplish(해내다)는 achieve(이루다) 자리에 들어가도 맞다."]}],"post":["proportionally(비례하여) ↔ irregularly(불규칙하게)","10미터 = 1바, 딱 떨어지는 비율"]},{"no":"39","slots":[["equal"],["supplied"],["increases"],["stabilize","equalize","s"],["required","prohibited","a"]],"opts":["required","recorded","discovered","invented"],"om":["필요한","기록된","발견된","발명된"],"or":["required(필요한): 바깥 2바에 맞춰 2바 기체를 넣어야 한다는 It follows that(따라서)의 결론과 맞음.","recorded(기록된): 기록된다는 말은 to stabilize pressure(압력을 안정시키려면) 해야 할 일을 말하지 못함.","discovered(발견된): 기체 공급은 발견하는 대상이 아니라 해 주는 일이라 어색함.","invented(발명된): 압력을 안정시키려는 목적과 '발명된다'는 말이 이어지지 않음."],"en":"It follows that a diver at a depth of 10 meters experiences a pressure of 2 bar, and to stabilize pressure, the supply of a breathing mixture under a pressure of 2 bar is required.","ko":"따라서 수심 10미터에 있는 잠수부는 2바의 압력을 받고, 압력을 안정시키려면 2바 압력의 호흡용 혼합 기체 공급이 필요하다.","hl":["the supply of a breathing mixture under a pressure of 2 bar is required","It follows that"],"khl":["호흡용 혼합 기체 공급이 필요하다","따라서"],"blocks":[{"t":"p","h":"It follows that(따라서)로 결론 확인","x":["글은 10미터 깊이의 잠수부가 2바의 압력을 받는다고 한다.","앞에서는 주변 물과 같은 압력으로 기체를 넣는다고 했다. under pressure equal to the pressure applied by the surrounding water(주변 물이 가하는 압력과 같은 압력으로).","그러니 2바로 기체를 넣어 주는 것이 필요하다.","prohibited(금지된)이면 결론이 \"그러니 넣지 마라\"가 된다."]},{"t":"p","h":"equalize는 그대로","x":["equalize(같게 하다)는 stabilize(안정시키다) 자리에서 \"안팎 압력을 맞춘다\"는 뜻이 된다.","이 글의 핵심 원리 그대로다."]}],"post":["require(필요로 하다) ↔ prohibit(금지하다)","10미터 깊이 = 2바 기체 공급"]}],"compquiz":[{"w":"proportionally","m":"비례하여","it":[["correspondingly","그에 상응하여","s"],["loudly","큰 소리로","n"],["disproportionately","불균형하게","a"],["in proportion","비례하여","s"],["secretly","몰래","n"],["unevenly","고르지 않게","a"],["cheerfully","쾌활하게","n"]]},{"w":"required","m":"필수의, 필요한","it":[["mandatory","의무적인","s"],["rural","시골의","n"],["optional","선택적인","a"],["essential","필수적인","s"],["salty","짠","n"],["voluntary","자발적인","a"],["curly","곱슬곱슬한","n"]]}],"no":"39"},{"id":"2610g1-40","title":"어휘특훈 · 26년 10월 고1 40번","sub":"미역취의 화학 경보 신호","tpl":"Researchers recently found that goldenrods that live in {peaceful} areas without much {threat} from predators will {issue} chemical alarm calls that are {incredibly} {specific}—{comprehensible} only to their {close} kin—on the {rare} occasion they are attacked. But goldenrods in more {hostile} territory signal to their neighbors using chemical phrases {easily} {understood} by all the goldenrod in the area, not just their biological kin. Instead of using {coded} whisper networks, these goldenrod {broadcast} the threat over loudspeaker, so to speak. It is the first time research has {confirmed} that these chemical communications are {beneficial} not only to the plant receiving them but also to the {sender}. When times are truly {tough}, you do not want to be left standing in a field alone. There will be no one to mate with, no one to help {bring_in} pollinators.","fn":["*goldenrod: 미역취(들판에 자라는 국화과 식물)","*kin: 친척, 혈족","*pollinator: 꽃가루 매개자(벌·나비처럼 꽃가루를 옮겨 주는 동물)"],"mean":{"peaceful":"평화로운","tranquil":"고요한, 평온한","dangerous":"위험한","threat":"위협","danger":"위험","issue":"(신호·경고 등을) 내다, 발하다","emit":"(신호·빛·냄새 등을) 내보내다, 내뿜다","incredibly":"엄청나게, 믿을 수 없을 정도로","remarkably":"놀랍도록, 두드러지게","specific":"특정한, 구체적인","general":"일반적인","comprehensible":"이해할 수 있는","understandable":"이해할 수 있는","unintelligible":"알아들을 수 없는","close":"(관계가) 가까운","rare":"드문","frequent":"잦은, 빈번한","hostile":"적대적인","threatening":"위협적인","favorable":"우호적인, 유리한","easily":"쉽게","readily":"손쉽게, 선뜻","barely":"거의 ~않게, 간신히","understood":"동사 understand(이해하다)의 과거분사형. 이해되는(앞의 phrases를 꾸밈)","coded":"암호화된(동사 code(암호로 바꾸다)의 과거분사형이 형용사로 쓰임)","secret":"비밀의","public":"공개된, 모두에게 열린","broadcast":"널리 알리다, 방송하다(주어 these goldenrod가 복수라 -s 없는 현재형)","conceal":"숨기다","confirmed":"동사 confirm(확인하다)의 과거분사형. has confirmed = 현재완료","verified":"동사 verify(검증하다, 확인하다)의 과거분사형. has verified = 현재완료","beneficial":"이로운","advantageous":"유리한, 이로운","harmful":"해로운","sender":"보내는 쪽, 발신자","recipient":"받는 쪽, 수령인","tough":"힘든, 어려운","harsh":"혹독한, 가혹한","easy":"편한, 수월한","bring in":"불러들이다, 끌어들이다","attract":"끌어들이다, 유인하다","repel":"쫓아내다, 물리치다"},"sets":[{"items":[{"slots":[["peaceful","dangerous","a"],["specific"],["hostile"],["broadcast"],["tough"]],"opts":["peaceful","violent","chaotic","perilous"],"om":["평화로운","폭력적인","혼란스러운","위험한"],"or":["peaceful(평화로운): 바로 뒤 without much threat from predators(포식자의 위협이 별로 없는)와 짝이 맞고, 다음 문장의 hostile(적대적인) 동네와 대조됨.","violent(폭력적인): 포식자 위협이 별로 없다는 바로 뒤 설명과 정반대임.","chaotic(혼란스러운): 위협이 적은 조용한 동네를 혼란스럽다고 할 근거가 본문에 없음.","perilous(위험한): 위협이 별로 없는 지역을 위험하다고 하면 한 문장 안에서 앞뒤가 부딪침."],"en":"Researchers recently found that goldenrods that live in peaceful areas without much threat from predators will issue chemical alarm calls that are incredibly specific—comprehensible only to their close kin—on the rare occasion they are attacked.","ko":"연구자들은 최근, 포식자의 위협이 별로 없는 평화로운 지역에 사는 미역취가 드물게 공격을 받으면 엄청나게 특정한(가까운 친척만 알아들을 수 있는) 화학 경보 신호를 낸다는 것을 발견했다.","hl":["peaceful areas","without much threat from predators"],"khl":["평화로운 지역","포식자의 위협이 별로 없는"],"blocks":[{"t":"pair","h":"두 동네 나란히 놓기","x":[["peaceful areas without much threat from predators","포식자 위협이 별로 없는 평화로운 동네"],["more hostile territory","더 적대적인(위험한) 동네"]]},{"t":"p","h":"dangerous가 틀린 이유","x":["바로 뒤에 without much threat from predators(포식자의 위협이 별로 없는)가 붙어 있다.","위험한 동네인데 위협은 별로 없다? 앞뒤가 안 맞는다.","게다가 다음 문장이 But(하지만)으로 더 hostile(적대적인) 동네를 꺼낸다.","But(하지만)이 대조가 되려면 첫 동네는 평화로워야 한다."]}],"post":["peaceful(평화로운) ↔ dangerous(위험한)","평화로운 동네 vs 적대 ":"연구자들은 최근, 포식자의 위협이 별로 없는 평화로운 지역에 사는 미역취가 드물게 공격을 받으면 엄청나게 특정한(가까운 친척만 알아들을 수 있는) 화학 경보 신호를 낸다는 것을 발견했다.","hl":["on the rare occasion they are attacked","without much threat"],"khl":["드물게 공격을 받으면","위협이 별로 없는"],"blocks":[{"t":"tap","h":"질문 하나","q":"포식자 위협이 별로 없는 동네에서 공격은 자주 일어날까?","a":["아니다. 드물다.","위협이 적다 → 공격도 드물다.","frequent(잦은)를 넣으면 한 문장 안에서 앞뒤가 엇갈린다."]},{"t":"p","h":"그대로 둘 단어","x":["threat(위협) 자리에 danger(위험)가 들어가도 뜻은 그대로다.","without much danger from predators(포식자로부터의 위험이 별로 없는)."]}],"post":["rare(드문) ↔ frequent(잦은)","위협 적음 = 공격도 드묾"]},{"slots":[["comprehensible"],["close"],["hostile","favorable","a"],["coded"],["tough"]],"opts":["hostile","secure","friendly","welcoming"],"om":["적대적인","안전한","우호적인","반갑게 맞아 주는"],"or":["hostile(적대적인): But(하지만)이 평화로운 동네의 반대편을 예고하고, 뒤의 tough(힘든) 시기와도 이어짐.","secure(안전한): 안전한 동네면 평화로운 동네와 같은 편이라 But(하지만)의 대조가 사라짐.","friendly(우호적인): 앞 동네와 같은 그림이라 대조가 되지 않음.","welcoming(반갑게 맞아 주는): 위협이 많아 모두에게 경보를 보내야 하는 상황과 맞지 않음."],"en":"But goldenrods in more hostile territory signal to their neighbors using chemical phrases easily understood by all the goldenrod in the area, not just their biological kin.","ko":"하지만 더 적대적인 지역의 미역취는, 생물학적 친척뿐 아니라 그 지역의 모든 미역취가 쉽게 알아듣는 화학 표현을 써서 이웃에게 신호를 보낸다.","hl":["more hostile territory","But"],"khl":["더 적대적인 지역","하지만"],"blocks":[{"t":"flow","h":"글 흐름 속 자리","x":["평화로운 동네: 친척만 알아듣는 신호","더 hostile(적대적인) 동네: 모두가 알아듣는 신호","비유: 속삭임 대신 확성기","발견: 보내는 쪽에도 이득","이유: 힘든 때 혼자 남으면 손해"],"at":1},{"t":"p","h":"But이 정하는 방향","x":["But(하지만)은 앞과 반대 그림이 온다는 예고다.","앞 그림은 peaceful(평화로운) 동네였다.","favorable(우호적인, 살기 좋은)은 평화로운 동네와 같은 편이다.","But(하지만) 뒤에 같은 그림이 오면 대조가 사라진다.","뒤의 When times are truly tough(정말 힘든 시기에는)도 위험한 환경 쪽을 가리킨다."]}],"post":["hostile(적대적인) ↔ favorable(우호적인)","But(하지만) = 평화로운 동네의 반대편"]},{"slots":[["incredibly","remarkably","s"],["understood"],["broadcast","conceal","a"],["beneficial"],["tough","harsh","s"]],"opts":["broadcast","hide","suppress","bury"],"om":["널리 알리다","숨기다","억누르다","묻어 두다"],"or":["broadcast(널리 알리다): over loud ,"a"],["chew","씹다","n"]]}]},{"items":[{"slots":[["peaceful"],["rare"],["easily"],["beneficial","harmful","a"],["bring_in"]],"opts":["beneficial","damaging","costly","fatal"],"om":["이로운","해를 끼치는","대가가 큰","치명적인"],"or":["beneficial(이로운): 이웃이 살아남아야 보내는 쪽도 짝과 꽃가루 매개자를 얻는다는 마지막 두 문장과 맞음.","damaging(해를 끼치는): 손해라면 위험한 동네의 미역취가 더 널리 알릴 이유가 없음.","costly(대가가 큰): 비용만 말하면 the first time(처음)으로 확인한 새 발견, 즉 보내는 쪽의 이득이 사라짐.","fatal(치명적인): 신호를 보내면 죽는다는 말이 되어 혼자 남지 않으려 한다는 마지막 이유와 정반대임."],"en":"It is the first time research has confirmed that these chemical communications are beneficial not only to the plant receiving them but also to the sender.","ko":"이런 화학적 의사소통이 그것을 받는 식물뿐 아니라 보내는 식물에게도 이롭다는 것을 연구가 확인한 것은 이번이 처음이다.","hl":["beneficial not only to the plant receiving them but also to the sender"],"khl":["받는 식물뿐 아니라 보내는 식물에게도 이롭다"],"blocks":[{"t":"tap","h":"보내는 쪽이 얻는 것","q":"경고를 보낸 미역취는 무엇을 얻을까?","a":["마지막 두 문장이 답이다.","힘든 때 혼자 남지 않는 것.","짝짓기 상대와, 꽃가루 매개자를 함께 불러 줄 이웃이 남는 것.","얻는 게 있으니 beneficial(이로운)."]},{"t":"p","h":"harmful이 안 되는 이유","x":["harmful(해로운)이면 신호를 보낼수록 손해다.","그런데 위험한 동네의 미역취일수록 더 널리 알린다.","손해 보는 일을 더 열심히 할 리 없다.","뒤 문장도 이웃이 살아남아야 나에게 좋다는 쪽이다."]}],"post":["beneficial(이로운) ↔ harmful(해로운)","알려 주는 쪽도 이득 = 이웃이 남아야 나도 삶"]},{"slots":[["peaceful","tranquil","s"],["comprehensible","unintelligible","a"],["hostile"],["broadcast"],["confirmed","verified","s"]],"opts":["comprehensible","confusing","unclear","puzzling"],"om":["이해할 수 있는","헷갈리게 하는","불분명한","어리둥절하게 하는"],"or":["comprehensible(이해할 수 있는): only to their close kin(오직 가까운 친척에게만)과 합쳐져 '친척만 알아듣는' 신호가 됨.","confusing(헷갈리게 하는): 친척을 헷갈리게 하는 경보는 경보 구실을 못함.","unclear(불분명한): 바로 앞 specific(특정한)과 부딪치고, 친척에게도 뜻이 전달되지 않음.","puzzling(어리둥절하게 하는): 친척만 어리둥절하게 한다는 말이 되어 경보의 목적과 반대임."],"en":"Researchers recently found that goldenrods that live in peaceful areas without much threat from predators will issue chemical alarm calls that are incredibly specific—comprehensible only to their close kin—on the rare occasion they are attacked.","ko":"연구자들은 최근, 포식자의 위협이 별로 없는 평화로운 지역에 사는 미역취가 드물게 공격을 받으면 엄청나게 특정한(가까운 친척만 알아들을 수 있는) 화학 경보 신호를 낸다는 것을 발견했다.","hl":["comprehensible only to their close kin","specific"],"khl":["가까운 친척만 알아들을 수 있는","특정한"],"blocks":[{"t":"p","h":"only가 쥐고 있는 열쇠","x":["only to their close kin(오직 가까운 친척에게만).","친척은 알아듣고, 남은 못 알아듣는다는 말이다.","unintelligible(알아들을 수 없는)을 넣으면 거꾸로 된다.","친척만 못 알아듣는 경보. 그건 경보가 아니다."]},{"t":"p","h":"앞말과 짝 맞추기","x":["바로 앞 specific(특정한)이 대상을 좁힌다.","대시 사이 말이 그 대상을 밝힌다. 가까운 친척.","알아들을 수 있어야 대상이 정해진다."]},{"t":"p","h":"뜻이 통하는 말","x":["tranquil(고요한)은 peaceful(평화로운)과 같은 편 말이다.","verified(검증했다)는 confirmed(확인했다)와 바꿔 써도 된다."]}],"post":["comprehensible(이해할 수 있는) ↔ unintelligible(알아들을 수 없는)","평화로운 동네 경보 = 친척 전용"]},{"slots":[["specific"],["hostile","threatening","s"],["easily","barely","a"],["coded"],["sender"]],"opts":["easily","rarely","hardly","poorly"],"om":["쉽게","좀처럼 ~않게","거의 ~않게","제대로 못 하게"],"or":["easily(쉽게): 다음 문장의 loudspeaker(확성기) 비유처럼 동네 모두가 알아듣는 신호라 맞음.","rarely(좀처럼 ~않게): all the goldenrod(모든 미역취)가 좀처럼 못 알아듣는다면 확성기 비유가 성립하지 않음.","hardly(거의 ~않게): 모두가 거의 못 알아듣는 신호는 not just their biological kin(생물학적 친척뿐 아니라)과 맞지 않음.","poorly(제대로 못 하게): 이해가 잘 안 되는 신호라면 이웃에게 위협을 널리 알릴 수 없음."],"en":"But goldenrods in more hostile territory signal to their neighbors using chemical phrases easily understood by all the goldenrod in the area, not just their biological kin.","ko":"하지만 더 적대적인 지역의 미역취는, 생물학적 친척뿐 아니라 그 지역의 모든 미역취가 쉽게 알아듣는 화학 표현을 써서 이웃에게 신호를 보낸다.","hl":["easily understood by all the goldenrod in the area","not just their biological kin"],"khl":["그 지역의 모든 미역취가 쉽게 알아듣는","생물학적 친척뿐 아니라"],"blocks":[{"t":"p","h":"확성기 비유로 확인","x":["다음 문장이 이 신호를 loudspeaker(확성기)에 빗댄다.","확성기 소리는 동네 누구나 듣는다.","barely(거의 ~않게) 알아듣는 신호라면 확성기가 될 수 없다.","all(모든)과 barely(거의 ~않게)는 한 줄에 함께 설 수 없다."]},{"t":"p","h":"바꿔도 되는 말","x":["threatening(위협적인)은 hostile(적대적인) 자리에 그대로 들어간다.","in more threatening territory(더 위협적인 지역에서)."]}],"post":["easily(쉽게) ↔ barely(거의 ~않게)","위험한 동네 신호 = 누구나 알아듣는 확성기"]},{"slots":[["issue"],["close"],["understood"],["sender"],["tough","easy","a"]],"opts":["tough","comfortable","relaxed","pleasant"],"om":["힘든","편안한","느긋한","즐거운, 쾌적한"],"or":["tough(힘든): 앞의 hostile territory(적대적인 지역)와 같은 그림이라 혼자 남기 싫은 이유가 됨.","comfortable(편안한): 편안한 때 혼자 남기 싫다는 말은 줄곧 이어진 위험한 환경 이야기와 동떨어짐.","relaxed(느긋한): 포식자가 많은 상황과 정반대 분위기임.","pleasant(즐거운, 쾌적한): 짝과 꽃가루 매개자를 잃을 걱정을 하는 상황과 어울리지 않음."],"en":"When times are truly tough, you do not want to be left standing in a field alone. There will be no one to mate with, no one to help bring in pollinators.","ko":"정말 힘든 시기에는 들판에 홀로 서 있는 채로 남겨지고 싶지 않다. 짝짓기할 상대도, 꽃가루 매개자를 불러들이도록 도와줄 상대도 없을 것이다.","hl":["When times are truly tough","left standing in a field alone"],"khl":["정말 힘든 시기에는","들판에 홀로 서 있는 채로"],"blocks":[{"t":"p","h":"말투가 바뀌는 곳","x":["여기서 갑자기 you(당신)가 나온다.","미역취 입장이 되어 보라는 말투다.","포식자가 들끓는 힘든 때를 떠올리게 한다.","easy(편한)를 넣으면 편한 때 혼자 남기 싫다는 말이 된다.","글은 줄곧 위험한 환경 이야기였다. 편한 시기는 끼어들 자리가 없다."]},{"t":"pair","h":"위험한 동네 = 힘든 시기","x":[["more hostile territory","더 적대적인 지역 (둘째 문장)"],["times are truly tough","정말 힘든 시기 (다섯째 문장)"]]}],"post":["tough(힘든) ↔ easy(편한)","힘든 시기 = 이웃이 꼭 필요한 때"]},{"slots":[["comprehensible","understandable","s"],["rare"],["beneficial","advantageous","s"],["sender","recipient","a"],["bring_in"]],"opts":["sender","receiver","neighbor","predator"],"om":["보내는 쪽","받는 쪽","이웃","포식자"],"or":["sender(보내는 쪽): not only A but also B(A뿐 아니라 B도)에서 A인 '받는 식물'의 반대편이라 맞음.","receiver(받는 쪽): 앞의 the plant receiving them(그것을 받는 식물)과 같은 말 되풀이라 구조가 무너짐.","neighbor(이웃): 이웃은 신호를 받는 쪽이라 역시 앞의 받는 식물과 겹침.","predator(포식자): 경보는 포식자에게서 지키려는 것이라 포식자에게 이롭다는 것은 정반대임."],"en":"It is the first time research has confirmed that these chemical communications are beneficial not only to the plant receiving them but also to the sender.","ko":"이런 화학적 의사소통이 그것을 받는 식물뿐 아니라 보내는 식물에게도 이롭다는 것을 연구가 확인한 것은 이번이 처음이다.","hl":["not only to the plant receiving them but also to the sender"],"khl":["그것을 받는 식물뿐 아니라 보내는 식물에게도"],"blocks":[{"t":"p","h":"not only A but also B","x":["A와 B는 서로 다른 두 쪽이어야 한다.","A
