이야기라 친척끼리의 속삭임과 맞지 않음."],"en":"Instead of using coded whisper networks, these goldenrod broadcast the threat over loudspeaker, so to speak.","ko":"암호화된 속삭임 망을 쓰는 대신, 이 미역취들은 말하자면 확성기로 위협을 널리 알린다.","hl":["coded whisper networks","Instead of"],"khl":["암호화된 속삭임 망","대신"],"blocks":[{"t":"p","h":"whisper와 짝이 되는 단어","x":["whisper(속삭임)는 가까운 사람만 듣게 하는 말이다.","public(공개된)은 모두에게 열린 말이다.","공개된 속삭임. 그 자체로 어색하다.","게다가 Instead of(~ 대신)가 속삭임 망을 확성기와 맞세운다.","확성기의 반대편이니 비밀스러워야 한다. coded(암호화된)."]},{"t":"p","h":"맞는 표현 하나","x":["attract(끌어들이다)는 bring in(불러들이다)과 같은 뜻이다.","help attract pollinators(꽃가루 매개자를 끌어들이도록 돕다)."]}],"post":["coded(암호화된) ↔ public(공개된)","속삭임 망 = 친척 전용 암호 신호"]},{"no":"40","slots":[["specific"],["easily","readily","s"],["broadcast"],["tough"],["bring_in","repel","a"]],"opts":["bring_in","drive_away","scare_off","keep_out"],"om":["불러들이다","쫓아내다","겁줘서 쫓다","못 들어오게 막다"],"or":["bring in(불러들이다): 꽃가루 매개자는 미역취에게 꼭 필요한 손님이라, 불러 줄 이웃이 없다는 아쉬움과 맞음.","drive away(쫓아내다): 필요한 손님을 쫓아낼 이웃이 없는 것이 아쉬울 리 없음.","scare off(겁줘서 쫓다): 꽃가루 매개자를 내쫓는 말이라 번식에 손해임.","keep out(못 들어오게 막다): 꽃가루 매개자를 막으면 번식이 어려워지므로 흐름과 반대임."],"en":"There will be no one to mate with, no one to help bring in pollinators.","ko":"짝짓기할 상대도, 꽃가루 매개자를 불러들이도록 도와줄 상대도 없을 것이다.","hl":["help bring in pollinators","no one to mate with"],"khl":["꽃가루 매개자를 불러들이도록 도와줄","짝짓기할 상대도"],"blocks":[{"t":"flow","h":"혼자 남으면 잃는 것","x":["힘든 시기, 들판에 나 혼자","짝짓기할 상대 없음","꽃가루 매개자를 함께 불러 줄 이웃 없음","결국 번식이 어려움"],"at":2},{"t":"p","h":"repel을 넣고 다시 읽기","x":["\"꽃가루 매개자를 쫓아내도록 도와줄 이웃이 없다\"가 된다.","꽃가루 매개자는 미역취에게 꼭 필요한 손님이다(각주 참고).","쫓아낼 이웃이 없는 게 왜 아쉬울까? 말이 안 된다.","readily(손쉽게)는 easily(쉽게) 자리에 그대로 둬도 되는 말이다."]}],"post":["bring in(불러들이다) ↔ repel(쫓아내다)","이웃 = 짝짓기 상대 + 꽃가루 매개자 부르는 동료"]}],"compquiz":[{"w":"coded","m":"암호화된","it":[["encrypted","암호화된","s"],["dusty","먼지투성이의","n"],["plain","암호가 없는, 평이한","a"],["encoded","부호화된","s"],["hungry","배고픈","n"],["decoded","해독된","a"],["rapid","빠른","n"]]},{"w":"bring in","m":"불러들이다, 끌어들이다","it":[["attract","끌어들이다","s"],["fold","접다","n"],["repel","쫓아내다","a"],["draw","끌어당기다","s"],["whistle","휘파람을 불다","n"],["drive away","쫓아 버리다","a"],["sneeze","재채기하다","n"]]}],"no":"40"},{"id":"2610g1-41-42","title":"어휘특훈 · 26년 10월 고1 41-42번","sub":"웹 디자인의 기본값과 지속 가능성","tpl":"Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all {interfere_with} the user’s control over their own experience. From a sustainability perspective, many of these patterns {encourage} overconsumption of data and attention. Infinite scroll keeps loading new content whether the user wants it or not, {increasing} data usage and device processing. Autoplay {forces} media to load and play even for people who may never watch it. These choices {consume} more energy on both the user’s device and the servers delivering the content. Take the decision by a popular music streaming platform to replace {static} album artwork with short video loops by default. This change {significantly} increases data usage and battery consumption, while the option to {disable} it is {buried} deep in the settings. As a result, most users consume more resources unless they {actively} search for a way to opt out. It is important to {acknowledge} that web design always {nudges} behavior in some way. Showing consequences and highlighting options are all forms of influence. The ethical line is not whether nudging exists, but whether it is {transparent}, reversible, and aligned with the user’s interests. In many cases, the most {responsible} approach is to make the {lower}-impact option the default, while keeping alternatives {clearly} available. Defaults are {powerful}, and when chosen carefully, they can reduce environmental impact without {removing} user agency.","fn":["*sustainability: 지속 가능성","*opt out: (설정·참여에서) 빠져나가다, 거부하다","*agency: (스스로 정하는) 주체성, 선택권"],"mean":{"interfere with":"방해하다","hinder":"방해하다","reinforce":"강화하다","encourage":"부추기다, 장려하다","discourage":"막다, 단념시키다","increasing":"동사 increase(늘리다)의 -ing형. 분사구문(그 결과 ~을 늘린다)","boosting":"동사 boost(끌어올리다)의 -ing형. 분사구문","reducing":"동사 reduce(줄이다)의 -ing형. 분사구문","forces":"동사 force(강요하다)의 3인칭 단수 현재형. force A to B = A가 B하도록 강제하다","causes":"동사 cause(~하게 하다, 일으키다)의 3인칭 단수 현재형. cause A to B = A가 B하게 만들다","forbids":"동사 forbid(금지하다)의 3인칭 단수 현재형","consume":"소비하다","expend":"(에너지·돈을) 쓰다, 소비하다","conserve":"아끼다, 보존하다","static":"정지된, 움직이지 않는","animated":"움직이는(영상처럼 움직임이 있는)","significantly":"상당히, 크게","substantially":"상당히, 크게","disable":"(기능을) 끄다, 비활성화하다","deactivate":"비활성화하다, 끄다","activate":"켜다, 활성화하다","buried":"동사 bury(묻다)의 과거분사형. 묻힌, 깊이 숨겨진","hidden":"동사 hide(숨기다)의 과거분사형. 숨겨진","showcased":"동사 showcase(눈에 띄게 진열하다)의 과거분사형. 돋보이게 진열된","actively":"적극적으로","acknowledge":"인정하다","recognize":"인정하다, 알아보다","deny":"부인하다","nudges":"동사 nudge(슬쩍 유도하다, 살짝 밀다)의 3인칭 단수 현재형","steers":"동사 steer(이끌다, 조종하다)의 3인칭 단수 현재형","transparent":"투명한, 숨김없는","deceptive":"속이는, 기만적인","responsible":"책임감 있는","lower":"형용사 low(낮은)의 비교급. 더 낮은(lower-impact = 영향이 더 적은)","higher":"형용사 high(높은)의 비교급. 더 높은(higher-impact = 영향이 더 큰)","clearly":"분명히, 뚜렷하게","powerful":"강력한, 힘이 센","influential":"영향력이 큰","removing":"동사 remove(없애다)의 -ing형. without 뒤의 동명사","eliminating":"동사 eliminate(없애다)의 -ing형. without 뒤의 동명사","preserving":"동사 preserve(지키다, 보존하다)의 -ing형. without 뒤의 동명사"},"sets":[{"items":[{"slots":[["interfere_with","reinforce","a"],["consume"],["disable"],["nudges"],["lower"]],"opts":["interfere_with","respect","protect","expand"],"om":["방해하다","존중하다","보호하다","넓히다"],"or":["interfere with(방해하다): 사용자 뜻과 상관없이 돌아가는 무한 스크롤·자동 재생이 사용자 통제를 가로막는다는 뜻이라 맞음.","respect(존중하다): 원하지 않아도 계속 뜨고 재생되는 패턴은 사용자 통제를 존중하는 게 아니라 무시하는 쪽임.","protect(보호하다): 뒤 문장들이 데이터·주의력 과소비라는 피해를 늘어놓아, 통제를 지켜 준다는 말과 충돌함.","expand(넓히다): 물건 하나 사려 해도 계정부터 요구하는 건 사용자 선택을 좁히는 일이라 통제를 넓힌다고 볼 수 없음."],"en":"Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all interfere with the user’s control over their own experience.","ko":"무한 스크롤, 자동 재생 영상, 물건 하나 사려는데도 계정부터 만들라고 하는 것 같은 패턴은 모두 사용자가 자기 경험을 스스로 통제하는 것을 방해한다.","hl":["interfere with the user’s control","requiring an account just to make a purchase"],"khl":["스스로 통제하는 것을 방해한다","물건 하나 사려는데도 계정부터 만들라고 하는"],"blocks":[{"t":"p","h":"예시 세 개가 정하는 방향","x":["무한 스크롤: 원하지 않아도 계속 뜬다.","자동 재생: 누르지 않아도 재생된다.","구매 전 계정 요구: 사려면 가입부터.","셋 다 사용자 뜻과 상관없이 돌아간다.","이걸 사용자 통제를 reinforce(강화한다)라고 부를 수는 없다."]},{"t":"p","h":"첫 문장의 역할","x":["첫 문장이 문제를 던진다. 사용자가 통제권을 잃는다.","뒤 문장들이 그 피해를 늘어놓는다. 데이터, 에너지, 배터리.","출발점이 '방해'여야 뒤의 비판이 이어진다."]}],"post":["interfere with(방해하다) ↔ reinforce(강화하다)","무한 스크롤·자동 재생 = 사용자 뜻과 무관하게 돌아감"]},{"slots":[["encourage","discourage","a"],["increasing","boosting","s"],["static"],["buried","hidden","s"],["actively"]],"opts":["encourage","limit","prevent","curb"],"om":["부추기다","제한하다","막다","억제하다"],"or":["encourage(부추기다): 뒤에 계속 불러오고 억지로 재생한다는 근거가 이어져 과소비를 부추긴다는 말과 맞음.","limit(제한하다): 과소비를 제한한다면 칭찬이 되는데, 바로 뒤 예시는 모두 데이터를 더 쓰게 만드는 내용임.","prevent(막다): 다음 문장의 increasing data usage(데이터 사용량을 늘리면서)와 정반대 방향이라 쓸 수 없음.","curb(억제하다): limit(제한하다)·prevent(막다)와 같은 '줄이는' 쪽이라, 에너지를 더 소비한다는 글 흐름을 뒤집음."],"en":"From a sustainability perspective, many of these patterns encourage overconsumption of data and attention.","ko":"지속 가능성의 관점에서 보면, 이런 패턴 중 상당수는 데이터와 주의력의 과소비를 부추긴다.","hl":["encourage overconsumption of data and attention","From a sustainability perspective"],"khl":["과소비를 부추긴다","지속 가능성의 관점에서 보면"],"blocks":[{"t":"pair","h":"주장 뒤에 오는 근거","x":[["encourage overconsumption","과소비를 부추긴다 (주장)"],["keeps loading new content","새 콘텐츠를 계속 불러온다 (근거 1)"],["forces media to load and play","미디어를 강제로 불러와 재생한다 (근거 2)"]]},{"t":"p","h":"discourage가 틀린 이유","x":["discourage(막다)를 넣으면 과소비를 막아 준다는 칭찬이 된다.","그런데 바로 뒤 예시는 모두 데이터를 더 쓰게 만든다.","주장과 근거가 반대로 가 버린다."]},{"t":"p","h":"속지 말 것","x":["boosting(끌어올리면서)은 increasing(늘리면서) 자리에 써도 같은 방향이다.","hidden(숨겨진)은 buried(묻힌)를 쉽게 풀어 쓴 말이다."]}],"post":["encourage(부추기다) ↔ discourage(막다)","무한 스크롤·자동 재생 = 데이터 과소비 유발"]},{"slots":[["forces"],["static","animated","a"],["significantly"],["acknowledge","recognize","s"],["transparent"]],"opts":["static","dynamic","moving","lively"],"om":["정지된","역동적인","움직이는","생기 넘치는"],"or":["static(정지된): 짧은 반복 영상으로 바꾸기 전의 앨범 그림이라 움직이지 않는 그림이어야 This change(이 변화)가 성립함.","dynamic(역동적인): 원래 그림이 이미 역동적이면 영상으로 바꿔도 달라지는 게 적어, 데이터가 크게 는다는 말과 안 맞음.","moving(움직이는): 움직이는 것을 움직이는 영상으로 바꾼 셈이라 replace A with B(A를 B로 바꾸다)의 대비가 사라짐.","lively(생기 넘치는): 그림의 분위기만 말할 뿐, 정지 그림에서 영상으로 바뀌는 '움직임' 대비를 만들지 못함."],"en":"Take the decision by a popular music streaming platform to replace static album artwork with short video loops by default. This change significantly increases data usage and battery consumption, while the option to disable it is buried deep in the settings.","ko":"한 인기 음악 스트리밍 플랫폼이 정지된 앨범 그림을 짧은 반복 영상으로 바꾸고 그것을 기본 설정으로 정한 결정을 예로 들어 보자. 이 변화는 데이터 사용량과 배터리 소모를 크게 늘리는데, 그 기능을 끄는 옵션은 설정 깊숙이 묻혀 있다.","hl":["replace static album artwork with short video loops","This change"],"khl":["정지된 앨범 그림을 짧은 반복 영상으로 바꾸고","이 변화는"],"blocks":[{"t":"tap","h":"질문 하나","q":"replace A with B(A를 B로 바꾸다). B가 영상이면 A는?","a":["영상이 아닌 것. 움직이지 않는 그림.","그래야 This change(이 변화)라는 말이 성립한다.","animated(움직이는)를 넣으면 움직이는 것을 움직이는 것으로 바꾼 셈이다.","바뀐 게 없는데 데이터가 크게 늘 리 없다."]},{"t":"p","h":"그대로 둘 단어","x":["recognize(인정하다)는 acknowledge(인정하다)와 같은 뜻으로 쓰인다.","It is important to recognize that ~(~라는 점을 인정하는 것이 중요하다)."]}],"post":["static(정지된) ↔ animated(움직이는)","앨범 그림 → 반복 영상 = 데이터·배터리 소모 증가"]},{"slots":[["encourage"],["consume"],["buried","showcased","a"],["responsible"],["powerful"]],"opts":["buried","displayed","advertised","promoted"],"om":["묻힌","표시된","광고된","홍보된"],"or":["buried(묻힌, bury의 과거분사): 끄는 옵션이 설정 깊숙이 숨어 대부분이 끄지 못한다는 As a result(그 결과) 문장과 이어져 맞음.","displayed(표시된, display의 과거분사): 눈에 보이게 표시돼 있으면 누구나 쉽게 꺼서, 대부분이 자원을 더 쓴다는 결과가 안 나옴.","advertised(광고된, advertise의 과거분사): 끄는 옵션을 광고한다면 비판할 이유가 없고, deep in the settings(설정 깊숙이)와도 안 어울림.","promoted(홍보된, promote의 과거분사): 홍보는 앞에 내세우는 일이라 설정 '깊숙이' 있다는 말과 충돌함."],"en":"This change significantly increases data usage and battery consumption, while the option to disable it is buried deep in  것으로 받아들인 상태다."]},{"t":"p","h":"셋 중 하나만","x":["hinder(방해하다)는 interfere with(방해하다)와, eliminating(없애기)은 removing(없애기)과 바꿔 써도 된다.","바뀐 단어 셋 중 고칠 건 하나뿐."]}],"post":["acknowledge(인정하다) ↔ deny(부인하다)","유도는 피할 수 없음 → 문제는 어떻게 유도하느냐"]}],"quiz":[{"w":"interfere with","m":"방해하다","it":[["hinder","방해하다","s"],["inherit","물려받다","n"],["assist","돕다","a"],["obstruct","가로막다","s"],["bake","굽다","n"],["facilitate","쉽게 하다, 촉진하다","a"],["pronounce","발음하다","n"]]},{"w":"encourage","m":"부추기다, 장려하다","it":[["discourage","막다, 단념시키다","a"],["promote","촉진하다","s"],["polish","닦다","n"],["deter","단념시키다, 막다","a"],["translate","번역하다","n"],["foster","조장하다, 기르다","s"],["swallow","삼키다","n"]]},{"w":"static","m":"정지된, 움직이지 않는","it":[["stationary","정지된","s"],["salty","짠","n"],["dynamic","역동적인","a"],["motionless","움직이지 않는","s"],["fragrant","향기로운","n"],["moving","움직이는","a"],["punctual","시간을 잘 지키는","n"]]},{"w":"bury","m":"묻다, 숨기다","it":[["expose","드러내다","a"],["conceal","숨기다","s"],["borrow","빌리다","n"],["hide","숨기다","s"],["shout","외치다","n"],["reveal","드러내다","a"],["measure","재다","n"]]},{"w":"acknowledge","m":"인정하다","it":[["admit","인정하다","s"],["knit","뜨개질하다","n"],["deny","부인하다","a"],["chop","잘게 썰다","n"],["recognize","인정하다, 알아보다","s"],["rent","빌리다","n"],["ignore","무시하다","a"]]}]},{"items":[{"slots":[["increasing"],["consume","conserve","a"],["disable"],["transparent"],["powerful"]],"opts":["consume","save","store","generate"],"om":["소비하다","절약하다","저장하다","만들어 내다"],"or":["consume(소비하다): 원치 않는 콘텐츠까지 불러오고 재생하면 기기·서버가 일을 더 해 에너지를 더 쓰므로 맞음.","save(절약하다): save more energy(에너지를 더 아낀다)는 글쓴이가 비판하는 패턴을 칭찬하는 말이 됨.","store(저장하다): 에너지 저장은 배터리 충전 같은 얘기라, 불러오고 재생하며 '쓰는' 흐름과 안 맞음.","generate(만들어 내다): 기기와 서버는 에너지를 쓰는 쪽이지 만들어 내는 쪽이 아니라 문맥에 안 맞음."],"en":"These choices consume more energy on both the user’s device and the servers delivering the content.","ko":"이런 선택은 사용자의 기기와 콘텐츠를 전달하는 서버 양쪽에서 더 많은 에너지를 소비한다.","hl":["consume more energy","both the user’s device and the servers"],"khl":["더 많은 에너지를 소비한다","사용자의 기기와 콘텐츠를 전달하는 서버 양쪽에서"],"blocks":[{"t":"p","h":"These choices가 가리키는 것","x":["These choices(이런 선택)는 바로 앞의 무한 스크롤과 자동 재생이다.","둘 다 원치 않는 콘텐츠까지 불러온다.","불러오고 재생하려면 기기도 서버도 일을 더 한다.","일을 더 하면 에너지를 더 쓴다. conserve(아끼다)가 아니다."]},{"t":"p","h":"more가 붙잡는 단어","x":["conserve more energy(에너지를 더 아낀다)는 이 패턴들을 칭찬하는 말이 된다.","글쓴이는 지금 이 패턴들을 비판하는 중이다.","비판하는 대상이 에너지를 아낀다고 말할 리 없다."]}],"post":["consume(소비하다) ↔ conserve(아끼다)","원치 않는 로딩 = 기기·서버 에너지 낭비"]},{"slots":[["forces","causes","s"],["significantly"],["transparent","deceptive","a"],["responsible"],["clearly"]],"opts":["transparent","secretive","misleading","covert"],"om":["투명한","비밀스러운","오해를 부르는","은밀한"],"or":["transparent(투명한): reversible(되돌릴 수 있는), aligned with the user’s interests(사용자 이익에 맞는)와 나란한 좋은 유도의 조건이라 맞음.","secretive(비밀스러운): 글쓴이가 비판한 '끄는 옵션 숨기기'와 같은 쪽이라 윤리의 기준이 될 수 없음.","misleading(오해를 부르는): 좋은 조건 둘과 나란히 서는 자리에 나쁜 성질이 끼어 줄이 무너짐.","covert(은밀한): 숨긴다는 뜻이라 숨기지 말라는 글의 결론과 정반대임."],"en":"The ethical line is not whether nudging exists, but whether it is transparent, reversible, and aligned with the user’s interests.","ko":"윤리적 경계선은 유도가 있느냐가 아니라, 그 유도가 투명하고 되돌릴 수 있으며 사용자의 이익에 맞느냐이다.","hl":["transparent, reversible, and aligned with the user’s interests","The ethical line"],"khl":["투명하고 되돌릴 수 있으며 사용자의 이익에 맞느냐","윤리적 경계선은"],"blocks":[{"t":"p","h":"세 기준을 한 줄에 세우기","x":["transparent(투명한): 숨기지 않는다.","reversible(되돌릴 수 있는): 원하면 다시 바꿀 수 있다.","aligned with the user’s interests(사용자의 이익에 맞는): 사용자에게 좋다.","셋 다 좋은 유도의 조건이다.","deceptive(속이는)는 이 줄에서 혼자 나쁜 쪽이다."]},{"t":"p","h":"앞 문단 사례와 연결","x":["음악 앱은 끄는 옵션을 설정 깊숙이 묻었다.","글쓴이가 비판한 건 바로 그 숨기기다.","그러니 윤리의 기준은 숨기지 않기, transparent(투명한)."]},{"t":"p","h":"맞는 표현 하나","x":["causes(~하게 만들다)는 forces(강요하다 force의 3인칭 단수 현재형) 자리에 넣어도 방향이 같다.","Autoplay causes media to load and play(자동 재생은 미디어가 불러와지고 재생되게 만든다)."]}],"post":["transparent(투명한) ↔ deceptive(속이는)","좋은 유도 = 투명 + 되돌림 가능 + 사용자 이익"]},{"slots":[["interfere_with"],["buried"],["nudges","steers","s"],["lower","higher","a"],["removing"]],"opts":["lower","greater","heavier","stronger"],"om":["더 낮은" o may never watch it(끝내 보지 않을 수도 있는 사람에게조차).","even(~조차)은 '그런 사람까지 억지로'라는 느낌을 준다.","forbids(금지하다)를 넣으면 재생을 막는다는 말이 된다.","재생을 막는 기능이 '자동 재생'일 수는 없다."]},{"t":"pair","h":"이름이 곧 뜻","x":[["autoplay","자동 재생 (누르지 않아도 틀어짐)"],["forces media to load and play","미디어를 억지로 불러와 재생시킴"]]}],"post":["force(강요하다) ↔ forbid(금지하다)","자동 재생 = 안 볼 사람에게도 강제 재생"]},{"slots":[["consume","expend","s"],["static"],["nudges"],["powerful","influential","s"],["removing","preserving","a"]],"opts":["removing","respecting","protecting","supporting"],"om":["없애기","존중하기","보호하기","뒷받침하기"],"or":["removing(없애기, remove의 -ing형): without removing(없애지 않고도)이 되어 '다른 선택지도 열어 두라'는 앞 문장과 같은 방향이라 맞음.","respecting(존중하기, respect의 -ing형): without respecting(존중하지 않고도)이 되어 선택권을 무시해도 된다는 말이 됨.","protecting(보호하기, protect의 -ing형): without protecting(보호하지 않고도)은 선택권을 버려도 된다는 뜻이라 앞 문장과 충돌함.","supporting(뒷받침하기, support의 -ing형): without supporting(뒷받침하지 않고도)도 선택권을 소홀히 한다는 뜻이라 글의 해법과 어긋남."],"en":"Defaults are powerful, and when chosen carefully, they can reduce environmental impact without removing user agency.","ko":"기본값은 힘이 세서, 신중하게 고르면 사용자의 선택권을 빼앗지 않고도 환경에 미치는 영향을 줄일 수 있다.","hl":["without removing user agency","when chosen carefully"],"khl":["사용자의 선택권을 빼앗지 않고도","신중하게 고르면"],"blocks":[{"t":"pair","h":"앞 문장과 짝 맞추기","x":[["while keeping alternatives clearly available","다른 선택지도 분명히 남겨 두면서"],["without removing user agency","사용자의 선택권을 빼앗지 않고도"]]},{"t":"p","h":"preserving이 틀린 이유","x":["preserving(지키기)을 넣으면 \"선택권을 지키지 않고도\"가 된다.","선택권은 버려도 된다는 말이다.","앞 문장은 다른 선택지를 분명히 열어 두라고 했다.","같은 해법을 두 번 말하는 자리라 방향이 같아야 한다."]},{"t":"p","h":"뜻이 같은 두 단어","x":["expend(쓰다, 소비하다)는 consume(소비하다)과 같은 뜻이다.","influential(영향력이 큰)은 powerful(강력한)과 통한다."]}],"post":["remove(없애다) ↔ preserve(지키다)","기본값으로 이끌되 선택권은 그대로"]}],"quiz":[{"w":"consume","m":"소비하다","it":[["expend","쓰다, 소비하다","s"],["conserve","아끼다, 보존하다","a"],["sneeze","재채기하다","n"],["use up","다 써 버리다","s"],["paint","칠하다","n"],["save","아끼다, 절약하다","a"],["whisper","속삭이다","n"]]},{"w":"transparent","m":"투명한, 숨김없는","it":[["opaque","불투명한, 불분명한","a"],["open","숨김없는, 공개된","s"],["edible","먹을 수 있는","n"],["secretive","비밀스러운","a"],["clear","투명한, 분명한","s"],["sleepy","졸린","n"],["wooden","나무로 된","n"]]},{"w":"low","m":"낮은, (정도가) 적은","it":[["high","높은","a"],["minimal","아주 적은, 최소의","s"],["polite","예의 바른","n"],["slight","약간의, 적은","s"],["hungry","배고픈","n"],["elevated","높아진, 높은","a"],["brave","용감한","n"]]},{"w":"force","m":"강요하다","it":[["compel","강요하다","s"],["coerce","강압하다, 억지로 시키다","s"],["fold","접다","n"],["oblige","(어쩔 수 없이) ~하게 하다","s"],["pressure","압박하다, 강요하다","s"],["dig","파다","n"],["giggle","킥킥 웃다","n"]]},{"w":"remove","m":"없애다","it":[["eliminate","없애다","s"],["add","더하다","a"],["whistle","휘파람을 불다","n"],["take away","빼앗다, 치우다","s"],["retain","유지하다","a"],["sew","바느질하다","n"],["yawn","하품하다","n"]]}]}],"comp":[{"no":"41-42","slots":[["increasing","reducing","a"],["forces"],["disable","deactivate","s"],["responsible"],["clearly"]],"opts":["increasing","lowering","limiting","cutting"],"om":["늘리면서","낮추면서","제한하면서","줄이면서"],"or":["increasing(늘리면서, increase의 -ing형): keeps loading(계속 불러온다)의 결과로 데이터·처리량이 쌓이므로 맞음.","lowering(낮추면서, lower의 -ing형): 계속 불러오는데 데이터 사용량이 준다는 모순된 말이 됨.","limiting(제한하면서, limit의 -ing형): 사용자가 원하든 말든 불러오는 패턴이 사용량을 제한한다는 건 앞뒤가 안 맞음.","cutting(줄이면서, cut의 -ing형): 뒤 문장의 consume more energy(에너지를 더 소비한다)와 정반대 방향임."],"en":"Infinite scroll keeps loading new content whether the user wants it or not, increasing data usage and device processing.","ko":"무한 스크롤은 사용자가 원하든 원하지 않든 새 콘텐츠를 계속 불러와서, 데이터 사용량과 기기 처리량을 늘린다.","hl":["increasing data usage and device processing","whether the user wants it or not"],"khl":["데이터 사용량과 기기 처리량을 늘린다","사용자가 원하든 원하지 않든"],"blocks":[{"t":"p","h":"keeps loading을 따라가기","x":["keeps loading(계속 불러온다)은 멈추지 않고 쌓인다는 말이다.","불러올수록 데이터는 쌓이고 기기는 바빠진다.","reducing(줄이면서)이면 계속 불러오는데 데이터가 준다는 이상한 말이 된다.","콤마 뒤 -ing는 앞 동작의 결과를 이어 준다. 결과는 증가."]},{"t":"p","h":"하나는 그대로","x":["deactivate(비활성화하다)는 disable(끄다)과 같은 뜻이다.","the option to deactivate it(그것을 비활성화하는 옵션)."]}],"post":["increase(늘리다) ↔ reduce(줄이다)","계속 불러오기 → 데이터·처리량 증가"]},{"no":"41-42","slots":[["static"],["significantly","substantially","s"],["disable","activate","a"],["actively"],["powerful"]],"opts":["disable","enable","launch","start"],"om":["끄다","켜다","실행하다","시작하다"],"or":["disable(끄다): by default(기본 설정으로) 이미 켜진 기능이라 필요한 건 끄는 옵션이고, opt out(빠져나가다)과도 같은 쪽이라 맞음.","enable(켜다): 이미 켜져 있는 기능을 또 켜는 옵션이 되어 말이 안 됨.","launch(실행하다): 실행 옵션이 숨겨져 있다면 오히려 자원을 덜 쓰게 되어 As a result(그 결과) 문장과 충돌함.","start(시작하다): 기본으로 이미 재생 중인 영상을 시작한다는 건 어색하고, a way to opt out(빠져나갈 방법)과도 반대임."],"en":"This change significantly increases data usage and battery consumption, while the option to disable it is buried deep in the settings. As a result, most users consume more resources unless they actively search for a way to opt out.","ko":"이 변화는 데이터 사용량과 배터리 소모를 크게 늘리는데, 그 기능을 끄는 옵션은 설정 깊숙이 묻혀 있다. 그 결과, 대부분의 사용자는 빠져나갈 방법을 적극적으로 찾지 않는 한 더 많은 자원을 소비하게 된다.","hl":["the option to disable it","a way to opt out"],"khl":["그 기능을 끄는 옵션은","빠져나갈 방법을"],"blocks":[{"t":"tap","h":"처음 상태 떠올리기","q":"이 앱에서 반복 영상은 처음부터 켜져 있을까, 꺼져 있을까?","a":["켜져 있다. by default(기본 설정으로) 바꿨으니까.","이미 켜진 기능에 필요한 건 끄는 옵션이다.","activate(켜다)를 넣으면 켜진 걸 또 켜는 옵션이 된다."]},{"t":"p","h":"opt out과 같은 편","x":["opt out(빠져나가다, 거부하다)은 다음 문장의 표현이다.","끄는 것 = 빠져나가는 것.","disable(끄다)과 opt out(빠져나가다)은 같은 쪽을 가리킨다.","substantially(상당히)는 significantly(상당히, 크게) 자리에 그대로 둬도 되는 말이다."]}],"post":["disable(끄다) ↔ activate(켜다)","기본값 켜짐 → 끄는 버튼은 숨김"]}],"compquiz":[{"w":"increase","m":"늘리다","it":[["boost","끌어올리다","s"],["decrease","줄이다","a"],["kneel","무릎 꿇다","n"],["raise","올리다","s"],["reduce","줄이다","a"],["bark","짖다","n"],["iron","다림질하다","n"]]},{"w":"disable","m":"(기능을) 끄다, 비활성화하다","it":[["deactivate","비활성화하다","s"],["enable","가능하게 하다, 켜다","a"],["sweep","쓸다","n"],["turn off","끄다","s"],["activate","켜다, 활성화하다","a"],["swim","수영하다","n"],["bless","축복하다","n"]]}],"no":"41-42"}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+'번<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+'번 · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+'번 지문</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
