<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>어휘특훈 · 영어II 능률(오) 4과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

<script id="data" type="application/json">{"kind":"v","id":"e2neohL4","title":"어휘특훈","sub":"영어II 능률(오) 4과","nums":[{"id":"e2-L4-4a","title":"어휘특훈 · 영어II 4과 본문 ❶+❷","sub":"Liz의 노트북 · 전자 쓰레기의 위험과 급증","tpl":"On her way to a study group meeting, Liz {accidentally} dropped her laptop on the street, seriously {damaging} it. Although it still turns on, the screen is {cracked}, and some keys are not working. She can have it repaired, but she is {hesitating} to do so. Sometimes repairs are {expensive}, and they often take a long time. {Besides}, the laptop is {about} five years old. In this case, getting rid of the old one and {purchasing} a new one might seem like a more {reasonable} option. In reality, however, it may not be the best thing to do. If Liz throws her laptop in the trash, she will be {contributing_to} a serious problem: e-waste. What exactly is e-waste? The term refers to discarded electronic devices and electrical appliances. Due to {toxic} materials contained in these products, such as lead, e-waste is a serious health and environmental {hazard}. To make matters worse, the amount of e-waste produced each year is {increasing} at an {alarming} rate. In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected. Experts predict that by 2030, the amount of e-waste generated annually will have {doubled} in just 16 years. For this reason, efforts are being made to {address} this problem, most of which are focused on making products {easier} to repair. Let’s take a look at some {practical} approaches from around the world.","fn":["*e-waste: 전자 쓰레기","*lead: 납","*metric ton: 메트릭톤(1,000kg)"],"mean":{"accidentally":"실수로","deliberately":"고의로, 일부러","unintentionally":"의도치 않게","damaging":"동사 damage(손상시키다)의 -ing형. 분사구문","repairing":"동사 repair(수리하다)의 -ing형","cracked":"금이 간, 갈라진","intact":"온전한, 손상되지 않은","hesitating":"동사 hesitate(망설이다)의 -ing형. is hesitating = 망설이고 있다","e ,"침착하게","자랑스럽게"],"en":"On her way to a study group meeting, Liz accidentally dropped her laptop on the street, seriously damaging it.","ko":"스터디 그룹 모임에 가는 길에 Liz는 실수로 노트북을 길에 떨어뜨렸고, 그 바람에 노트북이 심하게 망가졌다.","hl":["accidentally dropped","seriously damaging it"],"khl":["실수로","심하게 망가졌다"],"blocks":[{"t":"flow","h":"리즈의 하루, 순서대로","x":["모임에 가다가 노트북을 떨어뜨림","화면에 금이 가고 키가 안 눌림","고칠까 말까 망설임","새로 사는 게 더 나아 보임","하지만 그건 전자 쓰레기를 늘리는 길"],"at":0},{"t":"p","h":"deliberately(고의로)를 넣고 다시 읽기","x":["\"리즈는 일부러 노트북을 길에 떨어뜨렸다\"가 된다.","그런데 바로 뒤에서 리즈는 수리비와 시간을 걱정하며 망설인다.","일부러 망가뜨린 사람이 수리비를 걱정할 리 없다.","이 이야기는 누구에게나 생길 수 있는 사고로 시작해야 독자가 공감한다."]}],"post":["accidentally(실수로) ↔ deliberately(고의로)","길에서 떨어뜨린 노트북 = 누구나 겪는 사고"]},{"slots":[["hesitating","reluctant","s"],["purchasing","buying","s"],["toxic","harmless","a"],["hazard"],["alarming"]],"opts":["valuable","recycled","ordinary","toxic"],"or":["valuable(귀중한): 귀중한 물질 때문에 '건강 위험 요소'가 된다는 건 원인과 결과가 맞지 않음.","recycled(재활용된): 재활용된 물질은 위험의 원인이 아니라 해결 쪽 이야기임.","ordinary(평범한): 평범한 물질이라면 '심각한' 위험 요소라고 부를 근거가 사라짐.","toxic(유독한): 납 같은 물질 때문에 건강과 환경에 위험하다는 결론으로 바로 이어져 맞음."],"om":["귀중한","재활용된","평범한","유독한"],"en":"Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.","ko":"이 제품들에 들어 있는 납 같은 유독성 물질 때문에 전자 쓰레기는 건강과 환경에 심각한 위험 요소이다.","hl":["toxic materials","a serious health and environmental hazard"],"khl":["유독성 물질","심각한 위험 요소"],"blocks":[{"t":"p","h":"원인과 결과로 읽기","x":["Due to(~ 때문에) 뒤는 원인, 쉼표 뒤는 결과다.","결과: 전자 쓰레기는 건강과 환경에 심각한 위험 요소.","그렇다면 원인은 위험한 물질이어야 한다.","harmless(무해한) 물질 때문에 위험하다는 건 말이 안 된다.","예로 든 lead(납)도 대표적인 유독 물질이다."]},{"t":"p","h":"그대로 두는 두 단어","x":["reluctant(꺼리는)를 넣으면 is reluctant to(~하기를 꺼린다)가 되어 망설임과 같은 뜻이다.","buying(사는 것)은 purchasing(구입하는 것)과 같은 뜻이다.","둘 다 문장의 뜻을 바꾸지 않는다."]}],"post":["toxic(유독한) ↔ harmless(무해한)","납 같은 유독 물질 = 전자 쓰레기가 위험한 이유"]},{"slots":[["damaging"],["hesitating","eager","a"],["Besides","Moreover","s"],["doubled"],["practical"]],"opts":["planning","hesitating","hurrying","promising"],"or":["planning(계획하고 있는): 수리할 계획이라면 but(하지만)으로 이을 이유도, 뒤에 수리를 꺼리는 이유를 늘어놓을 이유도 없음.","hesitating(망설이고 있는): 앞의 but(하지만)과 뒤에 나오는 비싼 수리비·긴 시간이 모두 망설임을 가리켜 맞음.","hurrying(서두르고 있는): 서둘러 고치려는 사람에게 '수리는 비싸고 오래 걸린다'는 뒷문장이 이어질 수 없음.","promising(약속하고 있는): 누구에게 약속하는지 맥락이 없고, 수리를 꺼리는 흐름과도 반대임."],"om":["계획하고 있는","망설이고 있는","서두르고 있는","약속하고 있는"],"en":"She can have it repaired, but she is hesitating to do so. Sometimes repairs are expensive, and they often take a long time.","ko":"그녀는 노트북을 수리받을 수 있지만, 그렇게 하기를 망설이고 있다. 때로는 수리비가 비싸고, 수리하는 데 오랜 시간이 걸리는 경우도 많다.","hl":["she is hesitating to do so","but"],"khl":["망설이고 있다","있지만"],"blocks":[{"t":"p","h":"but(하지만)이 정하는 방향","x":["앞: 고칠 수는 있다.","but(하지만) 뒤에는 그 반대 마음이 와야 한다.","eager(몹시 하고 싶어 하는)를 넣으면 \"고칠 수 있지만, 몹시 고치고 싶다\"가 된다.","but(하지만)이 아무것도 뒤집지 못한다."]},{"t":"tap","h":"질문 하나","q":"바로 뒤 두 문장은 무엇을 설명할까?","a":["리즈가 망설이는 이유다.","수리는 비싸고 오래 걸린다.","게다가 노트북은 5년쯤 됐다.","이유가 줄줄이 나오니 앞은 '망설임'이어야 한다."]},{"t":"p","h":"함정","x":["Moreover(게다가)는 Besides(게다가)와 같은 연결어라 그대로 둔다."]}],"post":["hesitate(망설이다) ↔ be eager(몹시 하고 싶어 하다)","비싸고, 오래 걸리고, 낡음 = 망설이는 세 가지 이유"]},{"slots":[["about"],["reasonable"],["toxic"],["increasing","diminishing","a"],["easier"]],"opts":["shrinking","increasing","stabilizing","disappearing"],"or":["shrinking(줄어드는): 37% 증가, 16년 만에 두 배라는 뒤의 숫자와 정면으로 부딪침.","increasing(증가하는): 바로 뒤 2014년보다 37% 늘었다는 숫자와 딱 맞음.","stabilizing(안정되는): 안정되는 속도는 '걱정스럽다'고 할 수 없고 숫자도 계속 늘고 있음.","disappearing(사라지는): 사라지고 있다면 To make matters worse(설상가상으로)로 시작할 수 없음."],"om":["줄어드는","증가하는","안정되는","사라지는"],"en":"To make matters worse, the amount of e-waste produced each year is increasing at an alarming rate. In 2021, a total of 57.4 million metric tons of e-waste was generated worldwide, which was a 37% increase from 2014, the year when data about e-waste was first collected.","ko":"설상가상으로, 해마다 만들어지는 전자 쓰레기의 양은 걱정스러운 속도로 늘어나고 있다. 2021년에는 전 세계적으로 총 5,740만 메트릭톤의 전자 쓰레기가 발생했는데, 이는 전자 쓰레기 자료가 처음 수집된 해인 2014년보다 37% 늘어난 양이었다.","hl":["is increasing at an alarming rate","a 37% increase"],"khl":["걱정스러운 속도로 늘어나고 있다","37% 늘어난"],"blocks":[{"t":"pair","h":"단어와 숫자를 나란히","x":[["is increasing","늘어나고 있다 (말로 한 설명)"],["a 37% increase from 2014","2014년보다 37% 증가 (숫자 증거)"],["will have doubled in just 16 years","16년 만에 두 배 (앞으로의 예측)"]]},{"t":"p","h":"diminishing(줄어드는)이 틀린 이유","x":["뒤에 나오는 숫자 세 개가 모두 '늘어남'을 가리킨다.","diminishing(줄어드는)을 넣으면 말과 숫자가 서로 싸운다.","To make matters worse(설상가상으로)도 나쁜 소식을 하나 더 얹는 말이다.","쓰레기가 줄어드는 건 나쁜 소식이 아니다."]}],"post":["increase(증가하다) ↔ diminish(줄어들다)","2014년 대비 37% 증가 → 16년 만에 두 배"]},{"slots":[["expensive","costly","s"],["about","approximately","s"],["reasonable","irrational","a"],["hazard"],["address"]],"opts":["foolish","risky","reasonable","wasteful"],"or":["foolish(어리석은): 어리석어 보이는 선택이라면 however(하지만)로 다시 반박할 필요가 없음.","risky(위험한): 앞에서 위험 이야기는 없었고, 비용·시간을 따지면 새로 사는 쪽이 안전해 보이는 흐름임.","reasonable(합리적인): 수리가 비싸고 오래 걸리니 새로 사는 게 '더 합리적으로 보인다'는 흐름이 맞고, 뒤의 however(하지만)가 그 생각을 뒤집음.","wasteful(낭비가 심한): 리즈 눈에 낭비로 보인다면 망설일 이유가 없고, 그건 뒤에서 필자가 밝히는 '실제' 모습임."],"om":["어리석은","위험한","합리적인","낭비가 심한"],"en":"In this case, getting rid of the old one and purchasing a new one might seem like a more reasonable option. In reality, however, it may not be the best thing to do.","ko":"이런 경우에는 낡은 노트북을 버리고 새것을 사는 것이 더 합리적인 선택처럼 보일 수도 있다. 하지만 실제로는 그것이 최선이 아닐 수도 있다.","hl":["a more reasonable option","In reality, however"],"khl":["더 합리적인 선택","하지만 실제로는"],"blocks":[{"t":"pair","h":"겉보기 vs 실제","x":[["might seem like a more reasonable option","더 합리적인 선택처럼 보일 수도 있다 (겉보기)"],["In reality, however, it may not be the best","하지만 실제로는 최선이 아닐 수도 있다 (실제)"]]},{"t":"p","h":"seem(~처럼 보이다)과 however(하지만)의 짝","x":["seem(~처럼 보이다)은 겉으로 그럴듯하다는 말이다.","그 그럴듯한 생각을 however(하지만)가 뒤집는다.","irrational(비이성적인)을 넣으면 처음부터 어리석어 보이는 선택이 된다.","뒤집을 것이 없어져 however(하지만)가 할 일이 사라진다."]},{"t":"p","h":"함정","x":["costly(비싼)는 expensive(비싼) 자리에, approximately(대략)는 about(약) 자리에 들어가도 뜻이 같다.","바뀐 단어가 셋이어도 틀린 것은 하나."]}],"post":["reasonable(합리적인) ↔ irrational(비이성적인)","새로 사기 = 합리적으로 '보이는' 선택"]}],"quiz ch are focused on making products easier to repair.","ko":"이런 이유로 이 문제에 대처하려는 노력이 이루어지고 있는데, 그 대부분은 제품을 수리하기 더 쉽게 만드는 데 집중되어 있다.","hl":["making products easier to repair","efforts"],"khl":["수리하기 더 쉽게","노력"],"blocks":[{"t":"flow","h":"문제에서 해결로","x":["수리가 비싸고 오래 걸림","그래서 버리고 새로 삼","전자 쓰레기가 급증함","해결: 제품을 수리하기 쉽게 만들기"],"at":3},{"t":"p","h":"more complicated(더 복잡한)를 넣으면","x":["\"제품을 수리하기 더 복잡하게 만드는 노력\"이 된다.","그건 해결이 아니라 문제를 키우는 일이다.","뒤에 소개될 세계의 노력도 모두 수리를 쉽게 만드는 쪽이다."]},{"t":"p","h":"함정","x":["sensible(분별 있는, 합리적인)은 reasonable(합리적인)과, rising(증가하는)은 increasing(증가하는)과 같은 뜻이다."]}],"post":["easy(쉬운) ↔ complicated(복잡한)","전자 쓰레기 해결 = 수리하기 쉬운 제품"]}],"quiz":[{"w":"hazard","m":"위험 (요소)","it":[["risk","위험","s"],["ladder","사다리","n"],["safety","안전","a"],["danger","위험","s"],["harvest","수확","n"],["security","안전, 보안","a"],["rumor","소문","n"]]},{"w":"expensive","m":"비싼","it":[["costly","많은 돈이 드는","s"],["curious","호기심 많은","n"],["cheap","값싼","a"],["pricey","값비싼","s"],["punctual","시간을 잘 지키는","n"],["inexpensive","비싸지 않은","a"],["ancient","고대의","n"]]},{"w":"address","m":"(문제를) 다루다, 대처하다","it":[["tackle","씨름하다, 다루다","s"],["wander","돌아다니다","n"],["ignore","무시하다","a"],["deal with","처리하다","s"],["admire","존경하다","n"],["neglect","소홀히 하다","a"],["whistle","휘파람 불다","n"]]},{"w":"damage","m":"손상시키다","it":[["harm","해를 끼치다","s"],["applaud","박수 치다","n"],["repair","수리하다","a"],["impair","손상시키다","s"],["memorize","암기하다","n"],["mend","고치다","a"],["sneeze","재채기하다","n"]]},{"w":"easy","m":"쉬운","it":[["simple","간단한","s"],["loyal","충실한","n"],["difficult","어려운","a"],["effortless","힘 안 드는","s"],["sticky","끈적한","n"],["hard","어려운","a"],["brave","용감한","n"]]}]}],"no":"본문 ❶❷"},{"id":"e2-L4-4c","title":"어휘특훈 · 영어II 4과 본문 ❸+❹","sub":"수리할 권리 운동 · 네 가지 요구","tpl":"One reason many people {dispose_of} their damaged devices is that they are too difficult to repair. For example, a device may be difficult to {disassemble}, or its manufacturer may require that it be brought to an {official} service center to be fixed. Many companies do not {allow} their customers to take their damaged items to third-party repair shops. What is more, some products are {intentionally} designed to be difficult to repair. It is {common} for consumers to be unable to {acquire} the instructions for how to fix their items or the parts needed to complete repairs. The right-to-repair movement is trying to {solve} these problems by {promoting} legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice. To {protect} the rights of consumers, the right-to-repair movement demands four things. First, companies must make information about their products {available} to everyone. Second, third parties, including individuals, should be able to {obtain} the parts and tools required to make repairs. Third, the practice of preventing consumers from installing custom software on their own devices should be {prohibited} by law. Finally, it demands that manufacturers design devices in a way that makes repairs as easy as possible. {Advocates} of the movement say that if all these goals are {accomplished}, far less e-waste will be generated. {Thanks_to} their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation. This movement is gaining a {growing} influence in Europe as well, with more and more countries {joining} the cause.","fn":["*third-party: 제삼자의","*legislation: 법률 제정","*custom software: 맞춤형 소프트웨어","*cause: 대의, 이상"],"mean":{"dispose of":"~을 처분하다, 버리다","throw away":"버리다","repair":"수리하다","disassemble":"분해하다","take apart":"분해하다","official":"공식적인, 정식의","authorized":"공인된, 인가받은","unofficial":"비공식적인","allow":"허락하다","intentionally":"의도적으로, 고의로","deliberately":"고의로, 일부러","unintentionally":"의도치 않게","common":"흔한","typical":"전형적인, 흔한","rare":"드문","acquire":"얻다, 획득하다","lose":"잃다, 잃어버리다","solve":"해결하다","resolve":"해결하다","promoting":"동사 promote(추진하다, 장려하다)의 -ing형. 동명사","opposing":"동사 oppose(반대하다)의 -ing형. 동명사","protect":"보호하다","saf omly(무작위로): 아무렇게나 그렇게 된다는 말이 되어 회사의 책임을 묻는 흐름과 안 맞음.","temporarily(일시적으로): 잠깐만 고치기 어렵게 설계한다는 건 의미가 통하지 않음."],"om":["안전하게","의도적으로","무작위로","일시적으로"],"en":"Many companies do not allow their customers to take their damaged items to third-party repair shops. What is more, some products are intentionally designed to be difficult to repair.","ko":"많은 회사가 고객이 고장 난 물건을 제삼자 수리점에 가져가는 것을 허용하지 않는다. 게다가 어떤 제품은 고치기 어렵도록 의도적으로 설계된다.","hl":["intentionally designed","What is more"],"khl":["의도적으로 설계된다","게다가"],"blocks":[{"t":"p","h":"What is more(게다가)의 세기","x":["앞 문장: 회사가 다른 수리점을 막는다.","What is more(게다가)는 더 센 이야기를 얹는 말이다.","더 센 이야기: 아예 처음부터 고치기 어렵게 '일부러' 만든다.","unintentionally(의도치 않게)를 넣으면 회사 잘못이 '어쩌다 그렇게 된 것'으로 약해진다.","세게 얹는 자리에 힘 빠진 말이 들어가는 셈이다."]},{"t":"p","h":"함정","x":["take apart(분해하다)는 disassemble(분해하다)과 같은 뜻이라 맞는 표현."]}],"post":["intentionally(의도적으로) ↔ unintentionally(의도치 않게)","일부러 고치기 어렵게 = 회사의 꼼수"]},{"slots":[["official"],["solve"],["promoting"],["Advocates","Opponents","a"],["joining"]],"opts":["Victims","Customers","Neighbors","Advocates"],"or":["Victims(피해자들): 운동의 피해자라는 말은 운동을 소개하는 긍정적인 흐름과 안 맞음.","Customers(고객들): 운동에는 고객이 없고, 법을 만들게 한 '노력'의 주인으로도 어색함.","Neighbors(이웃들): 운동의 이웃이라는 말은 의미가 통하지 않음.","Advocates(지지자들): 목표가 이루어지면 쓰레기가 줄어든다고 말하는 사람들이고, 다음 문장 their efforts(그들의 노력)의 주인공이라 맞음."],"om":["피해자들","고객들","이웃들","지지자들"],"en":"Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated. Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair legislation.","ko":"이 운동의 지지자들은 이 모든 목표가 이루어지면 전자 쓰레기가 훨씬 적게 발생할 것이라고 말한다. 그들의 노력 덕분에 미국의 40개가 넘는 주가 수리할 권리 법률 제정에 착수했다.","hl":["Advocates of the movement","Thanks to their efforts"],"khl":["지지자들","그들의 노력 덕분에"],"blocks":[{"t":"tap","h":"질문 하나","q":"Thanks to their efforts(그들의 노력 덕분에)의 their(그들의)는 누구일까?","a":["바로 앞 문장의 주어다.","40개 넘는 주에서 법을 만들게 한 사람들.","운동을 밀어 온 사람들 = Advocates(지지자들)."]},{"t":"p","h":"Opponents(반대자들)가 안 되는 이유","x":["반대자라면 \"목표가 이루어지면 쓰레기가 훨씬 줄어든다\"고 운동을 칭찬할 리 없다.","게다가 반대자의 노력 '덕분에' 법이 생겼다는 말이 되어 버린다."]}],"post":["advocate(지지자) ↔ opponent(반대자)","지지자들의 노력 → 미국 40개 넘는 주가 입법 착수"]},{"slots":[["common","typical","s"],["acquire"],["promoting","opposing","a"],["obtain"],["growing","rising","s"]],"opts":["promoting","ignoring","delaying","criticizing"],"or":["promoting(추진하는 것): '직접 고치거나 원하는 기술자에게 맡길 권리'를 담은 법을 밀어붙여 문제를 푼다는 말이라 맞음.","ignoring(무시하는 것): 법을 무시해서 문제를 푼다는 건 뒤에서 40개 주가 입법에 나섰다는 내용과 맞지 않음.","delaying(미루는 것): 소비자 권리를 담은 법을 미루면 문제가 풀리지 않음.","criticizing(비판하는 것): 자기들이 원하는 내용을 담은 법을 비판할 이유가 없음."],"om":["추진하는 것","무시하는 것","미루는 것","비판하는 것"],"en":"The right-to-repair movement is trying to solve these problems by promoting legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice.","ko":"수리할 권리 운동은 다음과 같은 내용을 명시한 법률 제정을 추진함으로써 이 문제들을 해결하려 하고 있다. 어떤 제품을 소유하고 있다면 그것을 직접 고치거나 자신이 선택한 기술자에게 가져갈 권리가 있다는 것이다.","hl":["by promoting legislation","you have the right to fix it yourself"],"khl":["법률 제정을 추진함으로써","직접 고치거나"],"blocks":[{"t":"p","h":"법의 내용부터 확인","x":["콜론 뒤가 그 법의 내용이다.","내 물건이면 내가 고치거나, 내가 고른 기술자에게 맡길 수 있다.","이건 바로 이 운동이 원하는 것이다.","opposing(반대하는 것)을 넣으면 운동이 자기 소원을 담은 법에 반대하는 셈이다."]},{"t":"p","h":"함정 두 개","x":["typical(전형적인, 흔한)은 common(흔한) 자리에 넣어도 뜻이 통한다.","rising(커지는)은 growing(커지는)과 같은 뜻이고 a rising influence(커지는 영향력)로 관사도 맞는다."]}],"post":["promote(추진하다) ↔ oppose(반대하다)","내 물건은 내가 고칠 권리 = 운동이 미는 법"]}],"quiz":[{"w":"common","m":"흔한","it":[["widespread","널리 퍼진","s"],["brave","용감한","n"],["rare","드문","a"],["frequent","빈번한","s"],["sticky","끈적한","n"],["unusual","흔치 않은","a"],["wooden","나무로 된","n"]]},{"w":"available","m":"이용할 수 있는","it":[["accessible","이용 가능한, 접근 가능한","s"],["noisy","시끄러운","n"],["unavailable","이용할 수 없는","a"],["obtainable","구할 수 있는","s"],["humble","겸손한","n"],["inaccessible","접근할 수 없는","a"],["thirsty","목마른","n"]]},{"w":"intentionally","m":"의도적으로","it":[["deliberately","고의로","s"],["gently","부드럽게","n"],["accidentally","우연히, 실수로","a"],["purposely","일부러","s"],["briefly","잠시","n"],["unintentionally","의도치 않게","a"],["happily","행복하게","n"]]},{"w":"advocate","m":"옹호자, 지지자","it":[["supporter","지지자","s"],["passenger","승객","n"],["opponent","반대자","a"],["champion","옹호자","s"],["neighbor","이웃","n"],["critic","비판자","a"],["author","작가","n"]]},{"w":"promote","m":"추진하다, 장려하다","it":[["encourage","장려하다","s"],["sneeze","재채기하다","n"],["oppose","반대하다","a"],["advocate","옹호하다","s"],["borrow","빌리다","n"],["hinder","방해하다","a"],["whisper","속삭이다","n"]]}]},{"items":[{"slots":[["dispose_of"],["intentionally"],["protect"],["prohibited","permitted","a"],["Thanks_to"]],"opts":["prohibited","encouraged","required","protected"],"or":["prohibited(금지된): 소비자가 맞춤형 소프트웨어를 못 깔게 '막는 관행'은 법으로 금지되어야 한다는 말이라 맞음.","encouraged(장려된): 소비자를 막는 관행을 법이 장려하라는 건 소비자 보호와 정반대임.","required(요구된): 막는 관행을 법으로 의무화하라는 건 운동의 목적과 거꾸로임.","protected(보호된): 소비자를 막는 관행을 법이 보호하라는 건 앞뒤가 맞지 않음."],"om":["금지된","장려된","요구된","보호된"],"en":"Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law.","ko":"셋째, 소비자가 자기 기기에 맞춤형 소프트웨어를 설치하지 못하게 막는 관행은 법으로 금지되어야 한다.","hl":["should be prohibited by law","preventing consumers from installing"],"khl":["법으로 금지되어야","설치하지 못하게 막는"],"blocks":[{"t":"p","h":"주어가 무엇인지 먼저","x":["주어는 the practice(관행)다.","어떤 관행? 소비자가 소프트웨어를 깔지 '못하게 막는' 관행.","소비자 편인 운동이라면 이 관행을 없애고 싶어 한다.","permitted(허용된)를 넣으면 막는 관행을 법으로 허용하라는 말이 된다."]},{"t":"tap","h":"두 번 부정 정리","q":"'막는 관행을 금지하라'를 한마디로 줄이면?","a":["소비자가 소프트웨어를 자유롭게 깔게 하라.","'막는 것'을 막으면 결국 허용이 된다."]}],"post":["prohibit(금지하다) ↔ permit(허용하다)","요구 3 = 소프트웨어 설치 막기 금지"]},{"slots":[["official","unofficial","a"],["allow"],["solve","resolve","s"],["protect","safeguard","s"],["joining"]],"opts":["independent","illegal","amateur","official"],"or":["independent(독립적인): 제조사가 독립 수리점으로 가라고 요구한다면 바로 뒤의 '제삼자 수리점을 허용하지 않는다'와 부딪침.","illegal(불법의): 제조사가 불법 수리소를 요구한다는 건 말이 안 됨.","amateur(아마추어의): 제조사가 아마추어 수리소를 요구할 이유가 없음.","official(공식적인): 제조사가 '자기 공식 수리소'로만 가져오라고 요구해서 수리가 어렵다는 말이라 맞음."],"om":["독립적인","불법의","아마추어의","공식적인"],"en":"For example, a device may be difficult to disassemble, or its manufacturer may require that it be brought to an official service center to be fixed. Many companies do not allow their customers to take their damaged items to third-party repair shops.","ko":"예를 들어, 기기가 분해하기 어려울 수도 있고, 제조사가 수리를 받으려면 공식 서비스 센터로 가져오라고 요구할 수도 있다. 많은 회사가 고객이 고장 난 물건을 제삼자 수리점에 가져가는 것을 허용하지 않는다.","hl":["an official service center","third-party repair shops"],"khl":["공식 서비스 센터","제삼자 수리점"],"blocks":[{"t":"pair","h":"앞뒤 문장 나란히","x":[["brought to an official service center","공식 서비스 센터로 가져와야 한다 (제조사의 요구)"],["do not allow ... third-party repair shops","제삼자 수리점은 허용하지 않는다 (같은 이야기를 다시)"]]},{"t":"p","h":"unofficial(비공식의)이 틀린 이유","x":["제조사가 원하는 건 자기 손안에서만 고치게 하는 것이다.","비공식 수리소로 가라고 요구할 제조사는 없다.","바로 다음 문장도 '바깥 수리점은 안 된다'는 같은 이야기다."]},{"t":"p","h":"함정 두 개","x":["resolve(해결하다)는 solve(해결하다)와, safeguard(보호하다)는 protect(보호하다)와 같은 뜻이다.","바뀐 셋 중 둘은 맞는 표현."]}],"post":["official(공식적인) ↔ unofficial(비공식적인)","제조사 공식 수리소만 = 수리가 어려운 이유"]},{"slots":[["common"],["acquire","lose","a"],["prohibited","banned","s"],["accomplished"],["growing"]],"opts":["sell","hide","acquire","recycle"],"or":["sell(팔다): 소비자가 설명서와 부품을 팔지 못하는 건 수리를 막는 문제가 아님.","hide(숨기다): 소비자가 설명서를 숨기지 못한다는 건 수리 문제와 관계가 없음.","acquire(구하다, 얻다): 설명서와 부품을 '구하지 못하는' 것이 소비자의 문제라서 맞고, 뒤의 요구 1·2(정보 공개, 부품·도구 구할 권리)와도 이어짐.","recycle(재활용하다): 수리를 끝내는 데 필요한 부품을 재활용하지 못한다는 건 앞뒤 흐름과 안 맞음."],"om":["팔다","숨기다","구하다, 얻다","재활용하다"],"en":"It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs.","ko":"소비자가 자기 물건을 고치는 방법에 대한 설명서나 수리를 끝내는 데 필요한 부품을 구하지 못하는 것은 흔한 일이다.","hl":["unable to acquire the instructions","the parts needed to complete repairs"],"khl":["구하지 못하는","필요한 부품"],"blocks":[{"t":"p","h":"unable to(~할 수 없는)와 함께 읽기","x":["이 문장은 소비자가 겪는 '문제'를 말한다.","문제 = 설명서도 부품도 구할 수가 없다.","lose(잃어버리다)를 넣으면 \"설명서를 잃어버릴 수 없는 게 흔하다\"가 된다.","그건 문제도 아니고 말도 안 된다."]},{"t":"pair","h":"문제와 운동의 요구","x":[["unable to acquire the instructions or the parts","설명서·부품을 구하지 못함 (문제)"],["be able to obtain the parts and tools","부품과 도구를 구할 수 있어야 함 (요구 2)"]]},{"t":"p","h":"함정","x":["banned(금지된)는 prohibited(금지된)와 같은 뜻이다."]}],"post":["acquire(얻다) ↔ lose(잃다)","설명서·부품을 못 구함 = 수리를 막는 벽"]},{"slots":[["disassemble"],["allow"],["promoting"],["protect","threaten","a"],["available"]],"opts":["ignore","protect","limit","reduce"],"or":["ignore(무시하다): 소비자 권리를 무시하려고 요구를 내놓는다는 건 운동의 이름과 정반대임.","protect(보호하다): 내 물건을 내가 고칠 권리를 지키려고 네 가지를 요구한다는 말이라 맞음.","limit(제한하다): 권리를 제한하려는 요구라면 바로 뒤의 정보 공개·부품 제공 요구와 맞지 않음.","reduce(줄이다): 소비자 권리를 줄이려는 운동은 '수리할 권리' 운동이 될 수 없음."],"om":["무시하다","보호하다","제한하다","줄이다"],"en":"To protect the rights of consumers, the right-to-repair movement demands four things.","ko":"소비자의 권리를 보호하기 위해, 수리할 권리 운동은 네 가지를 요구한다.","hl":["To protect the rights of consumers","demands four things"],"khl":["권리를 보호하기 위해","네 가지를 요구한다"],"blocks":[{"t":"p","h":"운동의 이름에서 답 찾기","x":["이 운동의 이름은 the right-to-repair movement(수리할 권리 운동)다.","이름부터 소비자의 '권리'를 앞세운다.","threaten(위협하다)을 넣으면 권리를 위협하려고 네 가지를 요구하는 셈이다.","뒤에 나오는 네 요구는 모두 소비자에게 유리한 것들이다."]}],"post":["protect(보호하다) ↔ threaten(위협하다)","네 가지 요구 = 소비자 권리 지키기"]},{"slots":[["intentionally","deliberately","s"],["common"],["obtain"],["accomplished","given up","a"],["Thanks_to","Owing to","s"]],"opts":["delayed","rejected","forgotten","accomplished"],"or":["delayed(미뤄진): 목표가 미뤄지는데 쓰레기가 훨씬 줄어든다는 건 원인과 결과가 어긋남.","rejected(거부된): 목표가 거부되면 수리는 여전히 어렵고 쓰레기도 그대로임.","forgotten(잊힌): 목표를 잊으면 쓰레기가 줄어들 이유가 없음.","accomplished(이루어진): 네 목표가 '이루어지면' 쓰레기가 훨씬 줄어든다는 조건과 결과가 맞음."],"om":["미뤄진","거부된","잊힌","이루어진"],"en":"Advocates of the movement say that if all these goals are accomplished, far less e-waste will be generated.","ko":"이 운동의 지지자들은 이 모든 목표가 이루어지면 전자 쓰레기가 훨씬 적게 발생할 것이라고 말한다.","hl":["if all these goals are accomplished","far less e-waste"],"khl":["이 모든 목표가 이루어지면","훨씬 적게"],"blocks":[{"t":"p","h":"if(만약 ~라면) 조건과 결과","x":["조건: 네 가지 목표가 이루어지면.","결과: 전자 쓰레기가 훨씬 적게 생긴다.","수리가 쉬워져야 덜 버리고, 덜 버려야 쓰레기가 준다.","given up(포기된)을 넣으면 목표를 포기했는데 쓰레기가 준다는 엉뚱한 결과가 된다."]},{"t":"p","h":"함정 두 개","x":["deliberately(고의로)는 intentionally(의도적으로)와 같은 뜻이다.","Owing to(~ 때문에, ~ 덕분에)는 Thanks to(~ 덕분에) 자리에 들어가도 원인을 나타낸다."]}],"post":["accomplish(성취하다) ↔ give up(포기하다)","목표 달성 → 전자 쓰레기 훨씬 감소"]}],"quiz":[{"w":"prohibit","m":"금지하다","it":[["forbid","금지하다","s"],["arrive","도착하다","n"],["permit","허용하다","a"],["ban","금지하다","s"],["bake","굽다","n"],["allow","허락하다","a"],["shout","소리치다","n"]]},{"w":"official","m":"공식적인","it":[["authorized","공인된","s"],["sleepy","졸린","n"],["unofficial","비공식적인","a"],["formal","공식적인","s"],["muddy","진흙투성이의","n"],["informal","비공식의","a"],["curious","호기심 많은","n"]]},{"w":"acquire","m":"얻다, 획득하다","it":[["obtain","얻다","s"],["wooden","나무로 된","n"],["lose","잃다","a"],["gain","얻다","s"],["polite","공손한","n"],["forfeit","(권리 등을) 잃다, 몰수당하다","a"],["rural","시골의","n"]]},{"w":"protect","m":"보호하다","it":[["safeguard","보호하다","s"],["yawn","하품하다","n"],["endanger","위험에 빠뜨리다","a"],["defend","지키다","s"],["paint","칠하다","n"],["harm","해치다","a"],["knit","뜨개질하다","n"]]},{"w":"accomplish","m":"이루다, 성취하다","it":[["achieve","이루다","s"],["giggle","킥킥 웃다","n"],["abandon","포기하다","a"],["fulfill","이행하다, 이루다","s"],["sweep","쓸다","n"],["fail","실패하다","a"],["swim","수영하다","n"]]}]}],"no":"본문 ❸❹"},{"id":"e2-L4-4e","title":"어휘특훈 · 영어II 4과 본문 ❺","sub":"프랑스의 수리 가능성 지수","tpl":"In January 2021, the French government {passed} a bill that {requires} that every manufacturer {include} a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers. Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired {before} they purchase it. The index takes into account {several} elements, including the availability of repair information, the {ease} of disassembly, and the price of {spare} parts. A low number on a bright red label means that repairing the product will be difficult, {whereas} a high number on a green label {indicates} that the product is easy to repair. The index was designed to have two {positive} effects. Firstly, it {allows} consumers to make {informed} decisions when purchasing new devices and appliances. Secondly, it {encourages} manufacturers to make their products easier to repair. As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more {sustainable} society in the near future. The impact of the index, however, is {likely} to {spread} far beyond France. We live in a {global} economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index. If the index is {successful}, we can anticipate seeing more countries around the world following France’s {innovative} lead.","fn":["*repairability index: 수리 가능성 지수","*lawn mower: 잔디 깎는 기계","*landfill: 쓰레기 매립지","*lead: 선례, 본보기"],"mean":{"passed":"동사 pass(통과시키다)의 과거형","rejected":"동사 reject(거부하다)의 과거형","approved":"동사 approve(승인하다)의 과거형","requires":"동사 require(요구하다)의 3인칭 단수 현재형","mandates":"동사 mandate(법으로 요구하다, 의무화하다)의 3인칭 단수 현재형","before":"~하기 전에","after":"~한 후에","several":"몇몇의, 여러","various":"다양한, 여러","ease":"쉬움, 용이함","simplicity":"간단함, 단순함","spare":"여분의, 예비의","replacement":"교체용의, 교체(품)","whereas":"~인 반면에","while":"~인 반면에","indicates":"동사 indicate(나타내다)의 3인칭 단수 현재형","conceals":"동사 conceal(숨기다)의 3인칭 단수 현재형","signals":"동사 signal(신호로 알리다)의 3인칭 단수 현재형","positive":"긍정적인","beneficial":"유익한","include":"포함하다","omit":"빠뜨리다, 생략하다","allows":"동사 allow(허락하다, 가능하게 하다)의 3인칭 단수 현재형","enables":"동사 enable(가능하게 하다)의 3인칭 단수 현재형","forbids":"동사 forbid(금지하다)의 3인칭 단수 현재형","informed":"정보에 근거한","uninformed":"정보가 없는, 잘 모르는","encourages":"동사 encourage(장려하다)의 3인칭 단수 현재형","discourages":"동사 discourage(단념시키다, 막다)의 3인칭 단수 현재형","sustainable":"지속 가능한","wasteful":"낭비하는","likely"  많은 나라가"],"blocks":[{"t":"p","h":"lead(선례)라는 단어","x":["여기서 lead(선례)는 '앞장서서 보여 준 본보기'다.","다른 나라들이 따라오려면 새롭고 앞선 것이어야 한다.","outdated(시대에 뒤떨어진) 본보기를 일부러 따라 하는 나라는 없다."]},{"t":"p","h":"함정","x":["worldwide(전 세계적인)는 global(세계적인) 자리에 넣어도 뜻이 같다."]}],"post":["innovative(혁신적인) ↔ outdated(시대에 뒤떨어진)","프랑스 = 세계가 따를 새 본보기"]}],"compquiz":[{"w":"allow","m":"허락하다, 가능하게 하다","it":[["permit","허용하다","s"],["giggle","킥킥 웃다","n"],["forbid","금지하다","a"],["enable","가능하게 하다","s"],["sweep","쓸다","n"],["prohibit","금지하다","a"],["yawn","하품하다","n"]]},{"w":"innovative","m":"혁신적인","it":[["groundbreaking","획기적인","s"],["thirsty","목마른","n"],["outdated","시대에 뒤떨어진","a"],["pioneering","선구적인","s"],["fluffy","폭신한","n"],["old-fashioned","구식의","a"],["salty","짠","n"]]}],"sets":[{"items":[{"slots":[["passed","rejected","a"],["several"],["spare"],["positive"],["likely"]],"opts":["withdrew","canceled","opposed","passed"],"or":["withdrew(철회했다): 법안을 거둬들였다면 뒤에서 설명하는 지수가 실제로 쓰일 수 없음.","canceled(취소했다): 취소된 법안이라면 회사들이 지수에 맞춰 라벨을 붙일 의무도 없음.","opposed(반대했다): 정부가 반대한 법안이라면 프랑스의 혁신적 선례라고 부를 수 없음.","passed(통과시켰다): 법안이 통과되었기 때문에 지금 그 지수가 소비자에게 점수를 보여 주고 있어 맞음."],"om":["철회했다","취소했다","반대했다","통과시켰다"],"en":"In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances","ko":"2021년 1월, 프랑스 정부는 모든 제조사가 다섯 가지 범주의 전자 기기와 전기 제품에 '수리 가능성 지수'를 표시하도록 요구하는 법안을 통과시켰다","hl":["passed a bill","requires that every manufacturer include"],"khl":["법안을 통과시켰다","표시하도록 요구하는"],"blocks":[{"t":"flow","h":"이 지수가 움직이는 순서","x":["법안 통과","제조사가 제품에 점수 표시","소비자가 사기 전에 확인","제조사도 고치기 쉽게 만들기 시작","매립지 쓰레기 감소"],"at":0},{"t":"p","h":"rejected(거부했다)를 넣으면","x":["법안이 거부되면 지수는 세상에 나오지 못한다.","그런데 글은 이 지수가 어떻게 쓰이는지 자세히 설명한다.","다른 나라들이 프랑스를 따라 할 거라는 기대까지 나온다.","시작부터 거부된 법이라면 이 모든 이야기가 설 자리가 없다."]}],"post":["pass(통과시키다) ↔ reject(거부하다)","2021년 1월 프랑스 = 수리 가능성 지수 법안 통과"]},{"slots":[["requires","mandates","s"],["include","omit","a"],["ease","simplicity","s"],["encourages"],["global"]],"opts":["hide","delay","ignore","include"],"or":["hide(숨기다): 점수를 숨기면 소비자가 사기 전에 볼 수 없어 뒤의 lets consumers see(소비자가 보게 해 준다)와 부딪침.","delay(미루다): 법이 일부러 표시를 미루라고 요구할 이유가 없고, '구매 전에 확인'이라는 목적과 안 맞음.","ignore(무시하다): 법이 지수를 무시하라고 요구한다는 건 법을 만든 목적과 정반대임.","include(포함하다): 법이 제조사에게 제품에 수리 점수를 '넣으라고' 요구하는 자리이고, 뒤에서 소비자가 사기 전에 그 점수를 본다고 하니 맞음."],"om":["숨기다","미루다","무시하다","포함하다"],"en":"In January 2021, the French government passed a bill that requires that every manufacturer include a “repairability index” on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.","ko":"2021년 1월, 프랑스 정부는 모든 제조사가 다섯 종류의 전자 기기와 전기 가전제품, 즉 스마트폰, 노트북, 세탁기, 텔레비전, 잔디 깎는 기계에 ‘수리 가능성 지수’를 포함하도록 요구하는 법안을 통과시켰다.","hl":["include a “repairability index”","requires"],"khl":["‘수리 가능성 지수’를 포함하도록","요구하는"],"blocks":[{"t":"p","h":"이 법이 하는 일","x":["프랑스 법의 핵심은 하나다.","제품마다 수리 점수를 붙여라.","그래야 바로 뒤 문장처럼 소비자가 사기 전에 점수를 볼 수 있다.","omit(빠뜨리다)을 넣으면 법이 점수를 빼라고 요구하는 셈이다.","빼 버린 점수를 소비자가 볼 수는 없다."]},{"t":"p","h":"함정 두 개","x":["mandates(법으로 요구하다)는 requires(요구하다)와 같은 뜻이다.","simplicity(간단함)는 ease(쉬움)와 같은 뜻이라 the simplicity of disassembly(분해의 간단함)도 자연스럽다."]}],"post":["include(포함하다) ↔ omit(빠뜨리다, 생략하다)","프랑스 법 = 다섯 종류 제품에 수리 점수 표시 의무"]},{"slots":[["before","after","a"],["whereas"],["allows","enables","s"],["sustainable"],["innovative"]],"opts":["because","before","unless","although"],"or":["because(~하기 때문에): 샀기 때문에 수리 난이도를 본다는 건 인과가 뒤집힘.","before(~하기 전에): 사기 전에 점수를 봐야 '정보에 근거한 결정'을 할 수 있어 맞음.","unless(~하지 않는다면): 사지 않으면 볼 수 있다는 말이 되어 지수의 목적과 안 맞음.","although(~이긴 하지만): '사긴 하지만 수리 난이도를 본다'가 되어 앞뒤가 이어지지 않음."],"om":["~하기 때문에","~하기 전에","~하지 않는다면","~이긴 하지만"],"en":"Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.","ko":"0점에서 10점까지의 점수와 색상 표시 체계를 사용해, 이 지수는 소비자가 제품을 사기 전에 그 제품이 얼마나 쉽게 수리될 수 있는지 볼 수 있게 해 준다.","hl":["befor while(~인 반면에)은 whereas(~인 반면에)와 같은 뜻이다."]}],"post":["sustainable(지속 가능한) ↔ wasteful(낭비하는)","매립지 쓰레기 감소 → 지속 가능한 사회"]},{"slots":[["requires"],["indicates","conceals","a"],["allows"],["spread"],["innovative","pioneering","s"]],"opts":["indicates","denies","doubts","forgets"],"or":["indicates(나타내다): 초록 라벨의 높은 숫자가 '고치기 쉽다'는 사실을 보여 준다는 말이라 맞음.","denies(부인하다): 높은 점수가 고치기 쉽다는 걸 부인한다면 점수 체계가 거꾸로 됨.","doubts(의심하다): 라벨은 사실을 알려 주는 것이지 의심하는 주체가 아님.","forgets(잊다): 라벨이 무언가를 잊는다는 건 말이 안 됨."],"om":["나타내다","부인하다","의심하다","잊다"],"en":"A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.","ko":"밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하기가 어려울 것임을 뜻하는 반면, 초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타낸다.","hl":["indicates","means"],"khl":["나타낸다","뜻하는"],"blocks":[{"t":"pair","h":"whereas(~인 반면에) 양쪽 나란히","x":[["a low number on a bright red label means ... difficult","빨간 라벨 + 낮은 숫자 = 수리 어려움"],["a high number on a green label indicates ... easy","초록 라벨 + 높은 숫자 = 수리 쉬움"]]},{"t":"p","h":"means(뜻하다)와 같은 자리","x":["앞쪽의 means(뜻하다)와 뒤쪽 동사는 같은 역할을 한다.","둘 다 라벨이 무엇을 알려 주는지 말한다.","conceals(숨기다)를 넣으면 라벨이 정보를 숨기는 물건이 된다.","라벨은 보여 주려고 붙이는 것이다."]},{"t":"p","h":"함정","x":["pioneering(선구적인)은 innovative(혁신적인)와 같은 뜻이다."]}],"post":["indicate(나타내다) ↔ conceal(숨기다)","초록·높은 숫자 = 고치기 쉬움"]},{"slots":[["passed"],["spare"],["encourages"],["sustainable"],["successful","ineffective","a"]],"opts":["costly","delayed","ignored","successful"],"or":["costly(비용이 많이 드는): 돈만 많이 드는 제도는 다른 나라가 기꺼이 따라 할 이유가 되지 않음.","delayed(지연된): 시행이 늦어진 제도는 따라 할 본보기가 되기 어려움.","ignored(무시된): 아무도 신경 쓰지 않는 제도를 세계가 따를 리 없음.","successful(성공적인): 지수가 성공해야 다른 나라들이 프랑스를 따라 할 거라는 조건이 맞음."],"om":["비용이 많이 드는","지연된","무시된","성공적인"],"en":"If the index is successful, we can anticipate seeing more countries around the world following France’s innovative lead.","ko":"이 지수가 성공한다면, 우리는 세계의 더 많은 나라가 프랑스의 혁신적인 선례를 따르는 모습을 보게 될 것이라고 기대할 수 있다.","hl":["If the index is successful","following France’s innovative lead"],"khl":["이 지수가 성공한다면","혁신적인 선례를 따르는"],"blocks":[{"t":"tap","h":"질문 하나","q":"다른 나라가 어떤 제도를 따라 하는 건 언제일까?","a":["그 제도가 효과를 봤을 때.","실패한 제도를 본보기로 삼는 나라는 없다.","그래서 조건은 successful(성공적인)이어야 한다."]},{"t":"p","h":"ineffective(효과가 없는)를 넣으면","x":["\"지수가 효과가 없으면 더 많은 나라가 따라 할 것이다\"가 된다.","조건과 결과가 서로 등을 돌린다."]}],"post":["successful(성공적인) ↔ ineffective(효과가 없는)","성공하면 → 세계가 프랑스를 따라 함"]},{"slots":[["passed","approved","s"],["positive","beneficial","s"],["informed"],["likely","unlikely","a"],["global"]],"opts":["unable","reluctant","likely","afraid"],"or":["unable(~할 수 없는): 영향이 퍼질 수 없다면 바로 뒤의 근거와 부딪침.","reluctant(꺼리는): 영향이라는 말에는 '꺼린다'는 마음이 어울리지 않음.","likely(~할 가능성이 높은): 바로 뒤에 '세계 경제라서 외국 회사도 라벨을 붙인다'는 근거가 나와 퍼질 가능성이 높다는 말이 맞음.","afraid(두려워하는): 영향이 퍼지기를 두려워한다는 건 말이 안 됨."],"om":["~할 수 없는","~하기를 꺼리는","~할 가능성이 높은","~하기를 두려워하는"],"en":"The impact of the index, however, is likely to spread far beyond France. We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.","ko":"하지만 이 지수의 영향은 프랑스를 훨씬 넘어 퍼질 가능성이 높다. 우리는 세계 경제 속에 살고 있으며, 프랑스 시장에서 가전제품을 팔고 싶은 회사라면 어디든 수리 가능성 지수에 따라 제품에 라벨을 붙여야 할 것이다.","hl":["is likely to spread far beyond France","however"],"khl":["퍼질 가능성이 높다","하지만"],"blocks":[{"t":"p","h":"however(하지만)가 넓히는 무대","x":["앞: 프랑스가 지속 가능한 사회로 간다 (프랑스 안 이야기).","however(하지만)로 무대가 프랑스 밖으로 넓어진다.","\"프랑스만의 일이 아니다\"라는 반전이다.","unlikely(가능성이 낮은)를 넣으면 반전이 사라지고, 뒤의 세계 경제 근거와도 부딪친다."]},{"t":"p","h":"함정 두 개","x":["approved(승인했다)는 passed(통과시켰다)와, beneficial(유익한)은 positive(긍정적인)와 같은 방향이다.","둘 다 맞는 표현."]}],"post":["likely(가능성이 높은) ↔ unlikely(가능성이 낮은)","프랑스 안 → 세계로 퍼질 영향"]}],"quiz":[{"w":"informed","m":"정보에 근거한","it":[["knowledgeable","잘 아는","s"],["muddy","진흙투성이의","n"],["uninformed","정보가 없는","a"],["educated","배운, 교육받은","s"],["thirsty","목마른","n"],["ignorant","무지한","a"],["fluffy","폭신한","n"]]},{"w":"sustainable","m":"지속 가능한","it":[["eco-friendly","친환경적인","s"],["sleepy","졸린","n"],["unsustainable","지속 불가능한","a"],["green","친환경적인","s"],["curly","곱슬곱슬한","n"],["wasteful","낭비하는","a"],["loud","시끄러운","n"]]},{"w":"indicate","m":"나타내다","it":[["show","보여 주다","s"],["bake","굽다","n"],["conceal","숨기다","a"],["signal","신호로 알리다","s"],["sweep","쓸다","n"],["hide","숨기다","a"],["jog","조깅하다","n"]]},{"w":"successful","m":"성공적인","it":[["effective","효과적인","s"],["hungry","배고픈","n"],["unsuccessful","성공하지 못한","a"],["fruitful","성과가 있는","s"],["foggy","안개 낀","n"],["failed","실패한","a"],["shy","수줍은","n"]]},{"w":"likely","m":"~할 가능성이 높은","it":[["probable","있을 법한","s"],["dusty","먼지투성이의","n"],["unlikely","가능성이 낮은","a"],["expected","예상되는","s"],["salty","짠","n"],["improbable","있을 것 같지 않은","a"],["sleepy","졸린","n"]]}]}],"no":"본문 ❺"},{"id":"e2-L4-4f","title":"어휘특훈 · 영어II 4과 본문 ❻","sub":"수리 카페","tpl":"When consumers are given the {right} tools and materials, along with some {helpful} advice, they can repair much of the damage that {occurs} to electronic products {by_themselves}. That is why Repair Cafés were {started}. They are free meeting places where people can {gather} together and {fix} their {broken} devices. The cafés are staffed by {volunteer} {experts} who can give technical advice and teach people how to fix things. The first Repair Café was opened in the Netherlands in the city of Amsterdam in 2009. It was such a {success} that the idea {soon} spread to {neighboring} countries. Before long, there were Repair Cafés in over 30 countries around the world. Along with {preventing} damaged items from becoming e-waste, these cafés also {encourage} people to {share} their {invaluable} skills and knowledge about the repair and {maintenance} of electronics. They continue to {grow} in popularity, with more and more people signing up to volunteer.","fn":["*Repair Café: 수리 카페","*be staffed by ~: ~이 직원으로 배치되어 있다","*sign up: 등록하다"],"mean":{"right":"알맞은, 적절한","wrong":"잘못된","proper":"알맞은, 적절한","helpful":"도움이 되는, 유용한","useful":"유용한","pointless":"쓸데없는, 무의미한","occurs":"동사 occur( 페는 개인이 자기 기기를 유지 관리하고 그 수명을 늘릴 수 있게 해 준다.","hl":["By providing spaces where people can learn","enable individuals"],"khl":["배울 수 있는 공간을 제공함으로써","수 있게 해 준다"],"blocks":[{"t":"p","h":"By -ing(~함으로써) = 방법","x":["By(~함으로써) 뒤에는 방법이 온다.","방법: 배울 수 있는 공간을 준다.","결과: 사람들이 기기를 관리하고 오래 쓴다.","denying(주지 않는 것)을 넣으면 공간을 안 줘서 사람들을 돕는다는 말이 된다.","배울 곳이 없는데 관리법을 익힐 수는 없다."]}],"post":["provide(제공하다) ↔ deny(주지 않다)","배우는 공간 제공 = 수리 카페의 방법"]},{"slots":[["foster","nurture","s"],["huge","negligible","a"],["necessary","required","s"],["nearest"],["cleaner"]],"opts":["minor","brief","huge","doubtful"],"or":["minor(사소한): Furthermore(더 나아가)로 강조해 얹는 좋은 점이 사소하다면 흐름이 꺾임.","brief(짧은): 우리 '미래'에 주는 영향이 잠깐이라는 건 관점이 바뀐다는 말과 안 맞음.","huge(엄청난): 관점이 바뀌면 미래 전체가 깨끗하고 건강해진다는 결론과 이어져 맞음.","doubtful(의심스러운): 영향이 의심스럽다면 마지막의 확신에 찬 결론과 부딪침."],"om":["사소한","짧은","엄청난","의심스러운"],"en":"Furthermore, they foster a sustainable perspective that can have a huge positive impact on our future.","ko":"더 나아가, 수리 카페는 우리의 미래에 엄청나게 긍정적인 영향을 줄 수 있는 지속 가능한 관점을 길러 준다.","hl":["a huge positive impact","Furthermore"],"khl":["엄청나게 긍정적인 영향","더 나아가"],"blocks":[{"t":"p","h":"글 끝과 연결","x":["이 영향이 어디까지 가는지 글의 마지막 문장이 보여 준다.","지구 전체가 모두에게 더 깨끗하고 건강한 곳이 된다.","지구 전체가 바뀌는 영향을 negligible(무시해도 될 정도의)이라고 부를 수 없다."]},{"t":"p","h":"함정 두 개","x":["nurture(기르다)는 foster(기르다, 조성하다)와 같은 뜻이다.","required(필요한)는 necessary(필요한)와 같은 뜻이라 the required parts(필요한 부품)도 자연스럽다."]}],"post":["huge(엄청난) ↔ negligible(무시해도 될 정도의)","관점의 변화 → 지구 전체의 변화"]}],"quiz":[{"w":"extend","m":"늘리다, 연장하다","it":[["prolong","연장하다","s"],["bake","굽다","n"],["shorten","줄이다","a"],["lengthen","늘이다","s"],["whistle","휘파람 불다","n"],["reduce","줄이다","a"],["paint","칠하다","n"]]},{"w":"enjoy","m":"누리다, 즐기다","it":[["relish","즐기다","s"],["sweep","쓸다","n"],["dislike","싫어하다","a"],["savor","음미하다","s"],["knit","뜨개질하다","n"],["hate","몹시 싫어하다","a"],["jog","조깅하다","n"]]},{"w":"positive","m":"긍정적인","it":[["favorable","유리한, 호의적인","s"],["dusty","먼지투성이의","n"],["negative","부정적인","a"],["constructive","건설적인","s"],["curly","곱슬곱슬한","n"],["adverse","불리한, 해로운","a"],["loud","시끄러운","n"]]},{"w":"provide","m":"제공하다","it":[["offer","제공하다","s"],["giggle","킥킥 웃다","n"],["withhold","주지 않다","a"],["supply","공급하다","s"],["yawn","하품하다","n"],["deny","주지 않다, 거부하다","a"],["swim","수영하다","n"]]},{"w":"huge","m":"엄청난","it":[["enormous","거대한","s"],["muddy","진흙투성이의","n"],["tiny","아주 작은","a"],["massive","거대한","s"],["shy","수줍은","n"],["insignificant","사소한, 하찮은","a"],["salty","짠","n"]]}]}],"no":"본문 ❼"}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
