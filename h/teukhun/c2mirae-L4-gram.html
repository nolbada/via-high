<title>어법특훈 · 공통영어2 미래엔(김) 4과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

l devices like computer chips that can be implanted in the nervous system.","ko":"전통적으로 연구자들은 신경 임플란트의 다양한 기능을 연구해 왔는데, 그것은 신경계에 이식될 수 있는 컴퓨터 칩 같은 의료 기기이다.","hl":["neural implants, which are"],"khl":["그것은"],"blocks":[{"t":"p","h":"콤마는 that(~하는)을 막는 문","x":["글은 신경 임플란트가 뭔지부터 소개한다.","\"신경 임플란트, 그건 컴퓨터 칩 같은 의료 기기다.\"","이렇게 콤마(,) 뒤에서 앞말을 한 번 더 풀어 주는 걸 계속적 용법이라 한다.","계속적 용법 자리에는 which(그것은)나 who(그 사람은)만 들어간다.","that(~하는)은 콤마 뒤에 설 수 없다. 시험 단골 함정."]},{"t":"pair","h":"쉬운 예시","x":[["I have a bike, which is red.","나는 자전거가 있는데, 그건 빨간색이다. (콤마 뒤 which(그것은))"],["This is the bike that I bought.","이건 내가 산 자전거이다. (콤마 없을 땐 that(~하는)도 가능)"]]}],"post":["콤마(,) 뒤에는 that(~하는) 금지: , which are(그것은 ~이다)"]},{"slots":[["that1","","","명사 computer chips(컴퓨터 칩)를 꾸미는 관계대명사 that(~하는). 뒤에 주어가 빠져 있다."],["surrounding","","","concerns(우려)가 그것들을 \"둘러싸는\" 능동이라 surrounding(둘러싼)."],["has","have","a","간접의문문 how(어떻게) 뒤의 주어는 this fascinating technology(이 매혹적인 기술), 단수다."],["shown","","","has(~해 왔다) + p.p.(과거분사) = 현재완료. 임플란트가 직접 보여 준 능동이라 has shown(보여 주었다)."],["to_walk","","","명사 the ability(능력)를 뒤에서 꾸미는 to부정사 to walk(걸을)."]],"opts":["has","is","having","to have"],"or":["has(~해 왔다): 단수 주어 technology(기술)에 맞춘 현재완료 has been applied(적용되어 왔다)라 맞음.","is(~이다): is been(~이다 ~되어 온)처럼 be동사 뒤에 been(~되어 온)이 또 올 수 없음.","having(~해 온 것): -ing형은 혼자 동사 자리에 못 와서 how(어떻게) 뒤 문장에 동사가 없어짐.","to have(~해 온 것): to부정사도 동사 자리에 못 와서 주어 technology(기술) 뒤 동사가 비게 됨."],"point":"주어와 동사의 수일치","en":"First, let's explore how this fascinating technology has been applied.","ko":"먼저 이 매혹적인 기술이 어떻게 적용되어 왔는지 살펴보자.","hl":["this fascinating technology has been applied"],"khl":["이 매혹적인 기술이"],"blocks":[{"t":"p","h":"주인은 맨 끝 명사","x":["본문 ②가 시작되는 문장이다. 이제 의료 현장에 실제로 쓰인 예를 보겠다는 신호.","how(어떻게) 뒤에도 주어와 동사가 있다.","this fascinating technology(이 매혹적인 기술): this(이)와 fascinating(매혹적인)은 꾸미는 말.","진짜 주인은 technology(기술) 하나. 그래서 have(~해 왔다)가 아니라 has(~해 왔다)."]},{"t":"pair","h":"쉬운 예시","x":[["Tell me how this old machine has worked.","이 오래된 기계가 어떻게 작동해 왔는지 말해 줘. (주인 machine(기계 in implants, similar to computer memory chips. Such devices would allow us {to_capture|to capture} and enhance memories, and even upload and download them {using|using} the digital cloud. We could look through our memories like a social media feed, vividly {recall|recall} our favorite life moments, share memories with others, and back up our most valuable memories. Finally, AI-powered neural implants would revolutionize the way our brains {work|work}. The role of the brain would shift from learning and storing information to {processing|processing} the vast amounts of data {provided|provided} by the implants. Instead of simply {memorizing|memorizing} information, we would be able to download knowledge, use our creativity to interpret it, and {generate|generate} new ideas.","fn":["*futurist: 미래학자","*commercially available: 상용화된(시중에서 살 수 있는)","*revolutionize: 혁명을 일으키다"],"mean":{"is":"~이다, 있다(be의 현재형, 단수 주어)","are":"~이다, 있다(be의 현재형, 복수 주어)","being":"~인 것(be의 -ing형)","to be":"~인 것(be의 to부정사)","have been":"~해 왔다(be의 현재완료형, 복수 주어)","be":"~이다(be동사 원형)","were":"~였다, 있었다(be의 과거형, 복수 주어)","to spread":"퍼질 것, 퍼지는 것(spread의 to부정사)","other":"다른(+ 복수 명사)","another":"또 다른 하나의(+ 단수 명사)","others":"다른 것들, 다른 사람들(대명사)","the others":"나머지 전부(대명사)","each other":"서로(대명사)","that":"~라고, ~라는 것(접속사) / ~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","whose":"~의(소유격 관계대명사)","where":"~하는 곳(관계부사)","whom":"~을(목적격 관계대명사)","commercially":"상업적으로(부사)","commercial":"상업의, 상업적인(형용사)","commerce":"상업, 무역(명사)","commercialize":"상업화하다(동사원형)","commercials":"광고 방송들(명사 복수형)","change":"바꾸다(동사원형)","possible":"가능한(형용사)","possibly":"아마, 어쩌면(부사)","possibility":"가능성(명사)","possibilities":"가능성들(명사 복수형)","impossibility":"불가능(명사)","to install":"설치하는 것(install의 to부정사)","to play":"하는 것(play의 to부정사)","play":"(게임을) 하다(동사원형)","playing":"하는 것(play의 -ing형)","played":"했다(play의 과거형·과거분사형)","to playing":"하는 것으로(전치사 to + 동명사)","stream":"스트리밍하다(동사원형)","streaming":"스트리밍하는 것(stream의 -ing형)","streams":"스트리밍하다(stream의 3인칭 단수 현재형)","streamed":"스 "is2","are","a","There is/are(~이 있다) 뒤의 진짜 주어는 great potential(큰 잠재력). 셀 수 없는 명사라 단수 취급."],["provided","","","data(데이터)가 임플란트에 의해 \"제공되는\" 쪽이라 과거분사 provided(제공되는)."],["memorizing","","","Instead of(~ 대신에) 뒤라 동명사 memorizing(암기하는 것)."]],"opts":["is","be","have","were"],"or":["is(있다): 진짜 주어 potential(잠재력)이 셀 수 없는 명사라 단수 is가 맞음.","be(있다, 원형): 주어 뒤 동사 자리에 원형만 덜렁 올 수 없음.","have(가지다): There(거기에) 뒤에는 be동사가 와야 해서 have는 못 옴.","were(있었다, 복수형): 복수 과거형이라 단수 potential(잠재력)과 안 맞고, 미래 이야기라 시제도 안 맞음."],"point":"There is/are 수일치","en":"There is also great potential for memory-enhancing brain implants, similar to computer memory chips.","ko":"컴퓨터 메모리 칩과 비슷한, 기억력을 높여 주는 뇌 임플란트에도 큰 잠재력이 있다.","hl":["There is also great potential"],"khl":["큰 잠재력이 있다"],"blocks":[{"t":"p","h":"There(거기에)는 주인이 아니다","x":["두 번째 미래 모습. 뇌에 메모리 칩을 꽂듯 기억력을 높인다.","There is/are(~이 있다) 문장의 진짜 주인은 동사 뒤에 있다.","여기 주인은 potential(잠재력). 셀 수 없는 명사라 단수.","great(큰)이 붙어도 셀 수 없는 건 그대로. 그래서 is(있다)."]},{"t":"pair","h":"쉬운 예시","x":[["There is some milk in the fridge.","냉장고에 우유가 좀 있다. (셀 수 없는 milk(우유) → is(있다))"],["There are two cats on the sofa.","소파 위에 고양이 두 마리가 있다. (복수 cats(고양이들) → are(있다))"]]}],"post":["There is(~이 있다) + 셀 수 없는 명사 potential(잠재력)"]}],"quiz":[{"s":"The color of these flowers ___ beautiful.","o":["is","are"],"a":0,"ko":"이 꽃들의 색은 아름답다.","why":"주인은 The color(색). of these flowers(이 꽃들의)는 꼬리표.","wy":"are(~이다): 복수 동사라 단수 주인 The color(색)와 안 맞음."},{"s":"This song is ___ popular.","o":["real","really"],"a":1,"ko":"이 노래는 정말 인기가 많다.","why":"형용사 popular(인기 있는)를 꾸미니 부사.","wy":"real(진짜의): 형용사라 형용사 popular(인기 있는)를 꾸밀 수 없음."},{"s":"I have a robot ___ can dance.","o":["what","that"],"a":1,"ko":"나는 춤출 수 있는 로봇이 있다.","why":"명사 a robot(로봇)을 꾸미니 that(~하는).","wy":"what(~하는 것): 앞에 명사 a robot(로봇)이 있어서 못 옴."},{"s":"This map enabled us ___ the way.","o":["find","to find"],"a":1,"ko":"이 지도 덕분에 우리는 길을 찾을 수 있었다.","why":"enable(가능하게 하다) + 사람 + to 동사원형.","wy":"find(찾다): enable(가능하게 하다)은 목적어 뒤에 to 없는 원형을 받지 않음."},{"s":"There ___ a lot of water in the bottle.","o":["is","are"],"a":0,"ko":"병 안에 물이 많이 있다.","why":"셀 수 없는 water(물)는 단수라 is(있다).","wy":"are(있다, 복수형): a lot of(많은)가 붙어도 water(물)는 셀 수 없어 단수 취급."}]},{"items":[{"slots":[["is1","","","주어 The success(성공)가 단수라 is(~이다)."],["other","another","a","뒤의 industries(산업들)가 복수다. another(또 다른 하나의)는 단수 명사 앞에만 온다."],["possible","","","make it(그것을 ~하게 만들다) 뒤 목적격보어 자리라 형용사 possible(가능한)."],["to_play","","","enable(가능하게 하다) + 목적어 + to부정사 to play(하는 것)."],["work","","","주어 our brains(우리 뇌)가 복수라 work(작동하다)."]],"opts":["other","others","the others","each other"],"or":["other(다른): 복수 명사 industries(산업들) 앞에서 꾸미는 말이라 맞음.","others(다른 것들): 그 자체가 대명사라 뒤에 명사 industries(산업들)를 또 붙일 수 없음.","the others(나머지 전부): 대명사라 뒤에 명사 industries(산업들)가 올 수 없음.","each other(서로): \"서로\"라는 대명사라 명사 앞에서 꾸밀 수 없음."],"point":"other vs. another","en":"The success of AI-powered neural implants in health care is also expected to spread to other industries.","ko":"의료 분야에서 AI 기반 신경 임플란트가 거둔 성공은 다른 산업으로도 퍼질 것으로 예상된다.","hl":["to other industries"],"khl":["다른 산업으로도"],"blocks":[{"t":"p","h":"another(또 다른 하나의)는 한 개짜리","x":["병원에서 성공한 기술이 게임, 메시지, 음악 같은 다른 분야로 번진다는 얘기.","another(또 다른 하나의) = an(하나의) + other(다른). 안에 an(하나의)이 숨어 있다.","그래서 another(또 다른 하나의) 뒤에는 단수 명사 하나만.","industries(산업들)는 복수라 s 없는 other(다른)."]},{"t":"pair","h":"쉬운 예시","x":[["I have other friends in Seoul.","나는 서울에 다른 친구들이 있다. (other(다른) + 복수 friends(친구들))"],["Can I have another cookie?","쿠키 하나 더 먹어도 돼? (another(또 하나의) + 단수 cookie(쿠키))"]]},{"t":"p","h":"본문 ④ 짝꿍","x":["본문 ④에는 Another critical issue(또 다른 중요한 문제)가 나온다.","issue(문제)가 단수라 그쪽은 Another(또 다른 하나의)."]}],"post":["other(다른) + 복수 industries(산업들) / another(또 다른 하나의) + 단수"]},{"slots":[["that1","","","predict(예측하다) 뒤 \"~라고\"를 이끄는 접속사 that(~라고)."],["commercially","","","형용사 available(이용할 수 있는)을 꾸미는 부사 commercially(상업적으로)."],["possible","possibility","a","make it(그것을 ~하게 만들다) 뒤 보어 자리. \"가능하게\" 만드는 거라 형용사가 와야 한다."],["to_capture","","","allow(허락하다) + 목적어 us(우리) + to부정사 to capture(캡처하는 것)."],["generate","","","be able to(~할 수 있다) 뒤 원형들이 나란한 마지막 generate(만들어 내다)."]],"opts":["possible","possibly","possibilities","impossibility"],"or":["possible(가능한): make it(그것을 ~하게 만들다) 뒤 상태를 말하는 형용사 보어라 맞음.","possibly(아마): 부사라 목적격보어 자리에 못 옴.","possibilities(가능성들): 명사라 \"그것을 가능성들로 만든다\"가 되어 뜻과 구조가 깨짐.","impossibility(불가능): 명사라 보어로 안 맞고, 뜻도 정반대가 됨."],"point":"목적격보어 (형용사) · 가목적어 it","en":"For example, advances in neural implant technology will make it possible to install in our brains software that can read our minds.","ko":"예를 들어, 신경 임플란트 기술의 발전은 우리의 마음을 읽을 수 있는 소프트웨어를 뇌에 설치하는 것을 가능하게 할 것이다.","hl":["make it possible to install"],"khl":["설치하는 것을 가능하게 할"],"blocks":[{"t":"p","h":"it(그것)은 자리 맡기","x":["기술이 발전하면 마음 읽는 소프트웨어 설치가 \"가능해진다\".","to install ~ software(소프트웨어를 설치하는 것)가 너무 길다.","그래서 it(그것)이 먼저 자리를 맡고, 진짜 목적어는 뒤로 보냈다.","make(만들다) + it + 형용사 + to부정사 = ~하는 것을 …하게 만들다.","목적어의 상태를 말하는 자리라 형용사 possible(가능한)."]},{"t":"pair","h":"쉬운 예시","x":[["This app makes it easy to learn English.","이 앱은 영어 배우는 것을 쉽게 만들어 준다. (makes it easy(쉽게 만들다))"],["I found it hard to wake up early.","나는 일찍 일어나는 게 어렵다는 걸 알았다. (found it hard(어렵다고 알게 되다))"]]}],"post":["make it(그것을 ~하게 만들다) + 형용사 possible(가능한) + to install(설치하는 것)"]},{"slots":[["to_spread","","","be expected to(~할 것으로 예상되다) + 동사원형."],["change","","","will(~할 것이다) 뒤 become(~이 되다)과 나란한 원형 change(바꾸다)."],["stream","streams","a","to play(하는 것), (to) type(입력하는 것), and (to) stream(스트리밍하는 것). 셋 다 to 뒤 원형이어야 한다."],["using","","","목적어 the digital cloud(디지털 클라우드)를 받는 능동 분사구문 using(이용해서)."],["processing","","","전치사 to(~으로) 뒤라서 동명사 processing(처리하는 것)."]],"opts":["stream","to streaming","are streaming","being streamed"],"or":["stream(스트리밍하다): to play(하는 것), type(입력하는 것)과 같은 원형으로 나란해서 맞음.","to streaming(스트리밍하는 것으로): to부정사 자리라 to 뒤에 -ing가 못 옴.","are streaming(스트리밍하고 있다): are(~이다)가 붙은 진짜 동사라 앞의 원형 play(하다), type(입력하다)과 짝이 안 맞고, 주어 This(이것)와 수도 안 맞음.","being streamed(스트리밍되는 것): 수동 -ing형이라 우리가 직접 음악을 트는 뜻과 안 맞고, 뒤에 목적어 music(음악)도 올 수 없음."],"point":"병렬구조","en":"This could enable us to play games, type social media messages, and stream music simply by thinking.","ko":"이것은 우리가 오직 생각만으로 게임을 하고, 소셜 미디어 메시지를 입력하고, 음악을 스트리밍할 수 있게 해 줄 것이다.","hl":["to play games","type","stream music"],"khl":["게임을 하고","입력하고","스트리밍할"],"blocks":[{"t":"p","h":"to(~하는 것) 하나가 셋을 끈다","x":["생각만으로 할 수 있는 일 세 가지. 게임, 메시지, 음악.","맨 앞 to(~하는 것) 하나가 뒤의 셋을 다 끌고 간다.","to play(하는 것), (to) type(입력하는 것), and (to) stream(스트리밍하는 것). 반복되는 to는 생략.","그래서 셋 다 원형이어야 줄이 맞는다. streams(스트리밍하다)처럼 s를 붙이면 줄에서 튄다."]},{"t":"pair","h":"쉬운 예시","x":[["I like to read, write, and draw.","나는 읽고, 쓰고, 그리는 걸 좋아한다. (to read(읽는 것), write(쓰는 것), draw(그리는 것) = 모두 원형)"],["She wants to sing and dance.","그녀는 노래하고 춤추고 싶어 한다. (to sing and dance = 둘 다 원형)"]]}],"post":["A, B, and C 같은 모양: to play, type, and stream(하고, 입력하고, 스트리밍하다)"]},{"slots":[["other","","","복수 명사 industries(산업들) 앞이라 other(다른)."],["to_install","","","가목적어 it(그것)의 진짜 목적어 to install(설치하는 것)."],["is2","","","There is(~이 있다) + 셀 수 없는 명사 potential(잠재력). 단수라 is(있다)."],["using","used","a","기억을 올리고 내리는 건 \"우리\". 우리가 클라우드를 \"이용하는\" 능동이고 뒤에 목적어도 있다."],["memorizing","","","Instead of(~ 대신에) 뒤라 동명사 memorizing(암기하는 것)."]],"opts":["using","use","uses","to using"],"or":["using(이용해서): 우리가 직접 클라우드를 이용하는 능동 분사구문이고 뒤에 목적어 the digital cloud(디지털 클라우드)가 있어 맞음.","use(이용하다): 접속사 없이 동사가 또 생겨 문장이 깨짐.","uses(이용하다, 3인칭 단수형): 접속사 없이 동사가 붙고, 주어도 맞출 대상이 없음.","to using(이용하는 것으로): 앞에 전치사 to(~으로)를 받을 말이 없어 덩어리가 깨짐."],"point":"분사구문 (능동 v-ing)","en":"Such devices would allow us to capture and enhance memories, and even upload and download them using the digital cloud.","ko":"이런 장치는 우리가 기억을 캡처하고 향상시키게 해 주고, 디지털 클라우드를 이용해 기억을 업로드하고 다운로드하게까지 해 줄 것이다.","hl":["using the digital cloud"],"khl":["디지털 클라우드를 이용해"],"blocks":[{"t":"p","h":"누가 이용하나","x":["기억을 사진처럼 저장하고, 클라우드에 올렸다 내렸다 하는 미래.","클라우드를 이용하는 주인공은 우리(us = 우리).","우리가 \"이용하는\" 쪽이니 능동 -ing.","used(이용된)는 \"이용당하는\" 쪽. 게다가 뒤에 목적어 the digital cloud(디지털 클라우드)가 있으니 -ing가 확실."]},{"t":"pair","h":"쉬운 예시","x":[["I made a cake using eggs and milk.","나는 달걀과 우유를 이용해 케이크를 만들었다. (내가 이용함 → using(이용해서))"],["He fixed the bike using a small tool.","그는 작은 도구를 써서 자전거를 고쳤다. (그가 씀 → using(써서))"]]}],"post":["뒤에 목적어 the digital cloud(디지털 클라우드) 있고 우리가 이용 → using(이용해서)"]},{"slots":[["is1","","","주어 The success(성공)가 단수라 is(~이다)."],["that2","","","명사 software(소프트웨어)를 꾸미는 주격 관계대명사 that(~하는)."],["to_capture","","","allow(허락하다) + 목적어 us(우리) + to부정사 to capture(캡처하는 것)."],["recall","recalled","a","could(~할 수 있을 것이다) 뒤에 동사원형이 줄줄이 나란한 자리. 과거형은 조동사 뒤에 못 온다."],["provided","","","data(데이터)가 \"제공되는\" 쪽이라 과거분사 provided(제공되는)."]],"opts":["recall","recalls","to recalling","has recalled"],"or":["recall(회상하다): could(~할 수 있을 것이다) 뒤에서 look(살펴보다), share(공유하다)와 나란한 원형이라 맞음.","recalls(회상하다, 3인칭 단수형): 조동사 could(~할 수 있을 것이다) 뒤에 s 붙은 동사는 못 옴.","to recalling(회상하는 것으로): 조동사 뒤 원형 자리에 전치사 덩어리가 낄 수 없음.","has recalled(회상해 왔다): 조동사 뒤에 has(~해 왔다)가 올 수 없고, 주어 We(우리)와 수도 안 맞음."],"point":"병렬구조 (조동사 + 원형)","en":"We could look through our memories like a social media feed, vividly recall our favorite life moments, share memories with others, and back up our most valuable memories.","ko":"우리는 소셜 미디어 피드처럼 기억을 훑어보고, 인생에서 가장 좋았던 순간을 생생하게 떠올리고, 다른 사람들과 기억을 공유하고, 가장 소중한 기억을 백업할 수 있을 것이다.","hl":["could look through","vividly recall","share","back up"],"khl":["훑어보고","생생하게 떠올리고","공유하고","백업할"],"blocks":[{"t":"p","h":"could(~할 수 있을 것이다)가 넷을 끈다","x":["기억을 인스타 피드처럼 넘겨 보는 장면. 할 수 있는 일이 네 가지.","could look(훑어볼 수 있다), recall(떠올리다), share(공유하다), and back up(백업하다). 뒤의 셋 앞에는 could(~할 수 있다)가 숨어 있다.","조동사 could(~할 수 있을 것이다)는 한 번만 쓰고 뒤에선 생략.","생략돼도 조동사 뒤라 넷 다 원형. recalled(회상했다)는 줄에서 튄다."]},{"t":"pair","h":"쉬운 예시","x":[["I can run, jump, and swim.","나는 달리고, 뛰고, 수영할 수 있다. (can(~할 수 있다) 뒤 원형 셋)"],["You should wash your hands and brush your teeth.","너는 손을 씻고 이를 닦아야 한다. (should(~해야 한다) 뒤 원형 둘)"]]},{"t":"tap","h":"확인 질문","q":"vividly(생생하게)는 왜 recall(회상하다) 앞에 있나?","a":["동사 recall(회상하다)을 꾸미는 부사라서.","부사가 끼어 있어도 줄은 could(~할 수 있을 것이다) + 원형."]}],"post":["could(~할 수 있을 것이다) + look(훑어보다), recall(떠올리 할은 정보를 배우고 저장하는 것에서 임플란트가 제공하는 방대한 양의 데이터를 처리하는 것으로 바뀔 것이다.","hl":["data provided by the implants"],"khl":["임플란트가 제공하는 방대한 양의 데이터"],"blocks":[{"t":"p","h":"뇌의 직업이 바뀐다","x":["세 번째 미래 모습. 뇌가 \"외우는 창고\"에서 \"처리하는 공장\"으로 바뀐다.","데이터는 누가 주나? 임플란트가 준다.","데이터는 받는 쪽, 즉 \"제공되는\" 쪽이라 p.p.(과거분사).","by the implants(임플란트에 의해)의 by(~에 의해)가 수동이라는 결정적 힌트."]},{"t":"pair","h":"쉬운 예시","x":[["I finished the homework given by the teacher.","나는 선생님이 내주신 숙제를 끝냈다. (숙제가 주어짐 → given(주어진))"],["This is a book written by my uncle.","이것은 우리 삼촌이 쓴 책이다. (책이 쓰임 → written(쓰인))"]]}],"post":["명사 + p.p. + by(~에 의해): data provided by the implants(임플란트가 제공하는 데이터)"]},{"no":"본문 ③","slots":[["possible","","","make it(그것을 ~하게 만들다) 뒤 목적격보어 자리라 형용사 possible(가능한)."],["is2","","","There is(~이 있다) + 셀 수 없는 명사 potential(잠재력)이라 is(있다)."],["recall","","","could(~할 수 있을 것이다) 뒤 나란한 원형 recall(회상하다)."],["memorizing","memorize","a","Instead of(~ 대신에)의 of(~의)는 전치사. 전치사 뒤 동사는 -ing 옷을 입어야 한다."],["generate","","","be able to(~할 수 있다) 뒤 download(다운로드하다), use(사용하다)와 나란한 원형 generate(만들어 내다)."]],"opts":["memorizing","memorizes","to memorize","have memorized"],"or":["memorizing(암기하는 것): 전치사 Instead of(~ 대신에) 뒤 동명사라 맞음.","memorizes(암기하다, 3인칭 단수형): 전치사 뒤에 동사가 그대로 올 수 없음.","to memorize(암기하는 것): 전치사 of(~의) 뒤에는 to부정사가 못 옴.","have memorized(암기해 왔다): 동사 덩어리라 전치사 뒤에 못 옴."],"point":"전치사 + 동명사","en":"Instead of simply memorizing information, we would be able to download knowledge, use our creativity to interpret it, and generate new ideas.","ko":"단순히 정보를 암기하는 대신, 우리는 지식을 다운로드하고, 창의력을 써서 그것을 해석하고, 새로운 아이디어를 만들어 낼 수 있을 것이다.","hl":["Instead of simply memorizing"],"khl":["단순히 정보를 암기하는 대신"],"blocks":[{"t":"p","h":"외우기 대신 해석하기","x":["본문 ③의 마지막 문장. 외우는 일은 임플란트가 하고, 사람은 해석과 창조를 맡는다.","Instead of(~ 대신에)는 두 단어지만 한 덩어리 전치사.","전치사 뒤에 동사를 쓰려면 -ing.","simply(단순히)가 사이에 끼어도 규칙은 그대로. memorizing(암기하는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["Instead of watching TV, I read a book.","TV(텔레비전)를 보는 대신 나는 책을 읽었다. (Instead of + watching(보는 것))"],["He left without saying goodbye.","그는 작별 인사도 없이 떠났다. (without + saying(말하는 것))"]]},{"t":"p","h":"같은 지문 짝꿍","x":["앞 문장 from learning and storing(배우고 저장하는 것에서)도 전치사 from(~에서) 뒤 -ing.","to processing(처리하는 것으로)의 to(~으로)도 전치사라 -ing."]}],"post":["Instead of(~ 대신에) + -ing: Instead of memorizing(암기하는 대신)"]}],"compquiz":[{"s":"I ate the food ___ by my mom.","o":["cooking","cooked"],"a":1,"ko":"나는 엄마가 요리해 주신 음식을 먹었다.","why":"음식은 요리되는 쪽이고 by(~에 의해)가 있어 p.p.(과거분사).","wy":"cooking(요리하는): 음식이 직접 요리하는 게 아니라서 안 맞음."},{"s":"Instead of ___ TV, let's go outside.","o":["watch","watching"],"a":1,"ko":"TV를 보는 대신 밖에 나가자.","why":"전치사 Instead of(~ 대신에) 뒤는 -ing.","wy":"watch(보다): 전치사 뒤에 동사원형은 못 옴."}]},{"id":"tb4-g4d","no":"본문 ④⑤","title":"어법특훈 · 공통영어2 4과 본문 ④+⑤","sub":"AI 신경 임플란트의 윤리적 문제와 신경 윤리","tpl":"Before we can {fully|fully} embrace the era of AI-powered neural implants, many tricky ethical issues should {be_addressed|be addressed}. The integration of AI technology with the human brain {raises|raises} concerns about what {it_means|it means} to be human. Our brains {are_believed|are believed} to be {central|central} to our identity, existence, and value as human beings. However, an over-reliance on technology may delay our natural development and {create|create} confusion about whether we are human, AI, or something in between. {another|Another} critical issue is privacy. {theres1|There's} a risk {that1|that} organizations or hackers could access personal data without permission through AI-connected implants. This means {that2|that} our thoughts, emotions, and behaviors could {be_controlled|be controlled} by hackers. There's an additional risk that this technology could lead to even greater social inequality, given that it may not be {available|available} to all due to its high cost. Such unequal access to the technology could intensify the division between those {who1|who} can afford the implants and those who cannot. I hope {that3|that} we can overcome these challenges through careful consideration of neuroethics. This field highlights the social aspects of neural technology and {provides|provides} possible answers to what should {be_considered|be considered} {legal|legal} and ethical. I think it is important to establish a prior review process and thoroughly {assess|assess} the ethical aspects before any kind of brain research {is_conducted|is conducted}. This will ensure that science and technology progress in accordance with ethical principles. What do you think about this technology? Please share your opinion in the comments section below.","fn":["*embrace: 받아들이다","*over-reliance: 지나친 의존","*afford: (비용을) 감당하다","*neuroethics: 신경 윤리(뇌 연구·기술의 윤리)","*in accordance with: ~에 따라"],"mean":{"that":"~라는(동격 접속사) / ~라는 것(명사절 접속사) / ~하는(관계대명사)","which":"~하는(관계대명사)","whose":"~의(소유격 관계대명사)","whom":"~을(목적격 관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","provides":"제공하다(provide의 3인칭 단수 현재형)","provide":"제공하다(동사원형·현재형)","to provide":"제공하는 것, 제공하기 위해(provide의 to부정사)","have provided":"제공해 왔다(provide의 현재완료형, 복수 주어)","are providing":"제공하고 있다(provide의 진행형, 복수 주어)","be considered":"여겨지다(consider의 수동형)","consider":"여기다, 고려하다(동사원형)","considered":"여겼다(consider의 과거형·과거분사형)","considering":"여기는(consider의 -ing형)","to consider":"여기는 것(consider의 to부정사)","legal":"합법적인(형용사)","assess":"평가하다(동사원형)","is conducted":"수행되다(conduct의 수동형, 단수 주어)","conducts":"수행하다(conduct의 3인칭 단수 현재형)","are conducted":"수행되다(conduct의 수동형, 복수 주어)","is conducting":"수행하고 있다(conduct의 진행형)","have conducted":"수행해 왔다(conduct의 현재완료형, 복수 주어)","is":"~이다, 있다(be의 현재형, 단수 주어)","are":"~이다, 있다(be의 현재형, 복수 주어)","to address":"다루는 것(address의 to부정사)","addressing":"다루는(address의 -ing형)","address":"다루다, 해결하다(동사원형)","addressed":"다루었다(address의 과거형·과거분사형)","takes":"꺼내다(take의 3인칭 단수 현재형)","taking":"꺼내는 것(take의 -ing형)","gives":"주다(give의 3인칭 단수 현재형)","is given":"치러지다, 주어지다(give의 수동형)","follow":"따르다(동사원형)","be followed":"지켜지다(follow의 수동형)","fully":"완전히(부사)","be addressed":"다루어지다, 해결되다(address의 수동형)","raises":"제기하다(raise의 3인칭 단수 현재형)","raise":"제기하다(동사원형·현재형)","rais 는 것)."],["assess","","","to establish(세우는 것) ... and (to) assess(평가하는 것). to 뒤 원형이 나란히."]],"opts":["that","which","whose","whom"],"or":["that(~라는 것): hope(바라다)의 목적어가 되는 명사절을 이끌고 뒤가 완전한 문장이라 맞음.","which(~하는): 관계대명사라 앞에 꾸밀 명사가 있어야 하는데 동사 hope(바라다)가 있어 안 됨.","whose(~의): 바로 뒤에 꾸밀 명사가 와야 하는데 주어 we(우리)가 와서 안 됨.","whom(~을): 목적격 관계대명사라 앞에 사람 명사가 있어야 하고 뒤에 빈자리도 있어야 함."],"point":"that vs. what","en":"I hope that we can overcome these challenges through careful consideration of neuroethics.","ko":"나는 우리가 신경 윤리를 신중하게 고민함으로써 이러한 난제들을 극복할 수 있기를 바란다.","hl":["I hope that"],"khl":["극복할 수 있기를 바란다"],"blocks":[{"t":"p","h":"걱정 다음엔 해결책","x":["바로 앞에서 걱정 세 가지(정체성, 프라이버시, 불평등)를 늘어놓았다.","이제 글쓴이는 해결책을 꺼낸다. 바로 신경 윤리.","hope that ~(~이기를 바라다). that(~라는 것) 뒤에 바라는 내용이 통째로 온다.","뒤 문장은 주어 we(우리), 동사 can overcome(극복할 수 있다), 목적어 these challenges(이 난제들). 빈자리가 없다.","what(~하는 것)은 뒤에 빈자리가 있을 때만. 그래서 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I hope that you feel better.","나는 네가 나아지길 바란다. (뒤가 완전 → that(~라는 것))"],["I got what I wanted.","나는 내가 원하던 것을 얻었다. (wanted(원했다)의 목적어가 빠짐 → what(~하는 것))"]]}],"post":["hope(바라다) + that(~라는 것) + 완전한 문장"]},{"slots":[["are_believed","","","뇌가 \"여겨지는\" 쪽이라 수동 are believed(여겨진다). 주어 Our brains(우리 뇌)가 복수."],["that1","","","명사 a risk(위험)의 내용을 풀어 주는 동격 that(~라는). 뒤가 완전한 문장."],["who1","","","those who(~하는 사람들). 사람을 받는 주격 관계대명사 who(~하는)."],["provides","","","주어 This field(이 분야)의 highlights(강조한다)와 and(그리고)로 나란한 provides(제공한다)."],["is_conducted","conducts","a","연구는 스스로 뭔가를 수행하지 않는다. 사람이 연구를 \"수행하는\" 것이라 수동 be + p.p.(과거분사)."]],"opts":["is conducted","are conducted","is conducting","have conducted"],"or":["is conducted(수행되다): 연구가 수행되는 쪽이고 주어 research(연구)가 단수라 맞음.","are conducted(수행되다, 복수형): 복수 주어용이라 단수 research(연구)와 안 맞음.","is conducting(수행하고 있다): 연구가 무언가를 수행하는 게 아니고 뒤에 목적어도 없어 안 맞음.","have conducted(수행해 왔다): 능동 복수형이라 수동의 뜻도, 단수 주어도 안 맞음."],"point":"능동태 vs. 수동태","en":"I think it is important to establish a prior review process and thoroughly assess the ethical aspects before any ,"raising","to raise","have raised"],"or":["raises(제기하다, 3인칭 단수형): 주어 The integration(통합)이 단수라 맞음.","raising(제기하는): -ing형은 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to raise(제기하는 것): to부정사도 동사 자리에 못 와서 주어 뒤 동사가 비게 됨.","have raised(제기해 왔다): 복수 주어용이라 단수 The integration(통합)과 안 맞음."],"point":"수식받는 주어의 수일치","en":"The integration of AI technology with the human brain raises concerns about what it means to be human.","ko":"AI 기술과 인간의 뇌를 통합하는 것은 인간이라는 것이 무엇을 의미하는가에 대한 우려를 불러일으킨다.","hl":["The integration","raises concerns"],"khl":["통합하는 것은","불러일으킨다"],"blocks":[{"t":"p","h":"첫 번째 걱정: 나는 누구인가","x":["뇌에 AI(인공지능)가 섞이면 \"나는 사람일까?\"라는 질문이 생긴다.","주어 덩어리: The integration of AI technology with the human brain(AI 기술과 인간 뇌의 통합).","of AI technology(AI 기술의), with the human brain(인간 뇌와의)은 꼬리표.","바로 앞 brain(뇌)이 단수라서 맞는 게 아니다. 진짜 주인 integration(통합)이 단수라서 raises(제기한다)."]},{"t":"pair","h":"쉬운 예시","x":[["The box of apples is heavy.","사과 한 상자는 무겁다. (주인 box(상자) → is(~이다))"],["The students in the club play soccer.","그 동아리 학생들은 축구를 한다. (주인 students(학생들) → play(한다))"]]}],"post":["꼬리표 of ~ with ~(~와 …의) 떼고 주인 The integration(통합) → raises(제기한다)"]},{"slots":[["fully","","","동사 embrace(받아들이다)를 꾸미는 부사 fully(완전히)."],["create","to create","a","may(~할 수 있다) delay(지연시키다) and (may) create(야기하다). 조동사 뒤 원형끼리 나란해야 하니 to가 끼면 안 된다."],["be_controlled","","","생각·감정·행동이 해커에 의해 \"통제되는\" 쪽이라 be controlled(통제되다)."],["provides","","","주어 This field(이 분야)의 highlights(강조한다)와 and(그리고)로 나란한 provides(제공한다)."],["legal","","","be considered(여겨지다) 뒤 보어 자리라 형용사 legal(합법적인). ethical(윤리적인)과 나란히."]],"opts":["create","creation","be created","to creating"],"or":["create(야기하다): 조동사 may(~할 수 있다) 뒤 delay(지연시키다)와 같은 원형이라 맞음.","creation(창조): 명사라 뒤의 confusion(혼란)을 목적어로 받을 수 없음.","be created(만들어지다): 수동이라 뒤에 목적어 confusion(혼란)이 올 수 없고, 의존이 혼란을 만드는 능동이라 안 맞음.","to creating(만들어 내는 것으로): 조동사 may(~할 수 있다) 뒤 원형 자리에 전치사 덩어리가 낄 수 없음."],"point":"병렬구조 (조동사 + 원형)","en":"However, an over-reliance on technology may delay our natural development and create confusion about whether we are human, AI, or something in between.","ko":"그러나 기술에 지나치게 의존하면 우리의 자연스러운 발달이 늦어지고, 우리가 인간인지, AI인지, 아니면 그 중간의 무언가인지에 대한 혼란이 생길 수 있다.","hl":["may delay","create confusion"],"khl":["늦어지고","혼란이 생길 수 있다"],"blocks":[{"t":"p","h":"may(~할 수 있다)가 둘을 끈다","x":["기술에 너무 기대면 두 가지 나쁜 일이 생긴다. 발달이 늦어지고, 정체성이 헷갈린다.","may delay(지연시킬 수 있다) ... and create(야기하다). create(야기하다) 앞의 may(~할 수 있다)는 생략.","조동사 뒤라서 둘 다 원형.","to create(만들어 내는 것)를 쓰면 and(그리고) 저울이 기운다. 왼쪽은 원형 delay(지연시키다), 오른쪽만 to부정사."]},{"t":"pair","h":"쉬운 예시","x":[["I can run and jump.","나는 달리고 뛸 수 있다. (can + run and jump(달리고 뛰다))"],["You must wash and dry the dishes.","너는 설거지하고 그릇을 말려야 한다. (must + wash and dry(씻고 말리다))"]]}],"post":["may(~할 수 있다) delay and create(지연시키고 야기하다): and(그리고) 양쪽 원형"]},{"slots":[["it_means","","","간접의문문 순서 what + 주어 it + 동사 means(그것이 무엇을 의미하는지)."],["another","","","단수 명사 issue(문제) 앞이라 Another(또 다른 하나의)."],["that1","which","a","뒤 문장 organizations ... could access personal data(조직이 개인 정보에 접근할 수 있다)가 완전하다. which(~하는)는 뒤에 빈자리가 있어야 한다."],["who1","","","those who(~하는 사람들). 사람을 받는 주격 관계대명사 who(~하는)."],["be_considered","","","무엇이 합법적이라고 \"여겨지는\" 쪽이라 should be considered(여겨져야 한다)."]],"opts":["that","what","whom","how"],"or":["that(~라는): 명사 a risk(위험)의 내용을 완전한 문장으로 풀어 주는 동격 접속사라 맞음.","what(~하는 것): 앞에 명사 a risk(위험)가 있고 뒤 문장도 완전해서 못 옴.","whom(~을): 사람 명사를 받는 목적격 관계대명사인데 a risk(위험)는 사람이 아니고 뒤에 빈자리도 없음.","how(어떻게): 명사 a risk(위험) 바로 뒤에서 그 내용을 풀어 주는 말로 못 씀."],"point":"동격의 that vs. 관계대명사 which","en":"There's a risk that organizations or hackers could access personal data without permission through AI-connected implants.","ko":"조직이나 해커가 AI와 연결된 임플란트를 통해 허락 없이 개인 정보에 접근할 수 있다는 위험이 있다.","hl":["a risk that"],"khl":["접근할 수 있다는 위험"],"blocks":[{"t":"p","h":"어떤 위험? 내용 풀어 주기","x":["뇌와 연결된 임플란트가 해킹되면 내 머릿속 정보가 줄줄 샌다.","a risk that ~(~라는 위험). that(~라는) 뒤가 위험의 내용 그 자체.","뒤 문장은 주어 organizations or hackers(조직이나 해커), 동사 could access(접근할 수 있다), 목적어 personal data(개인 정보)까지 다 있다.","빈자리가 없으니 관계대명사 which(~하는)는 못 들어온다."]},{ <script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
</body>
</html>
