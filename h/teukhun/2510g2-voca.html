"]],"opts":["progeny","parents","rivals","predators"],"or":["progeny(자손): leave(남기다)는 죽은 뒤 뒤에 남기는 것이라 다음 세대인 자손이 맞음.","parents(부모): 부모는 이미 앞 세대라 죽으면서 새로 남길 수 있는 대상이 아님.","rivals(경쟁자): 경쟁자를 남기지 않는다는 말은 변화가 이어지지 못한다는 핵심과 상관없음.","predators(포식자): 세포의 죽음과 대 끊김을 말하는 자리에 포식자는 어울리지 않음."],"om":["자손","부모","경쟁자","포식자"],"en":"But changes that cause serious damage lead nowhere: the cell that suffers them dies, leaving no progeny.","ko":"그러나 심각한 손상을 일으키는 변화는 아무 데도 이르지 못한다. 그런 변화를 겪은 세포는 죽어서 자손을 남기지 않기 때문이다.","hl":["leaving no progeny","lead nowhere"],"khl":["자손을 남기지 않기","아무 데도 이르지 못한다"],"blocks":[{"t":"p","h":"leave(남기다)의 시간 방향","x":["leave(남기다)는 떠나면서 뒤에 두고 가는 것이다.","세포가 죽으면서 뒤에 남길 수 있는 건 다음 세대다.","ancestors(조상)는 이미 앞에 있었던 세대라 남길 수가 없다.","그래서 leaving no ancestors(조상을 남기지 않고)는 말 자체가 성립하지 않는다."]},{"t":"p","h":"함정 두 개","x":["come to nothing(아무 결과도 없이 끝나다)은 lead nowhere(아무 데도 이르지 못하다)와 같은 뜻이다.","perishes(죽다)도 dies(죽다)와 같은 뜻이다.","바뀐 단어가 셋이어도 틀린 건 하나."]}],"post":["progeny(자손) ↔ ancestors(조상)","심각한 손상 변화 = 다음 세대로 못 넘어감"]}],"quiz":[{"w":"better","m":"더 나은","it":[["superior","더 우수한","s"],["salty","짠","n"],["worse","더 나쁜","a"],["wooden","나무로 된","n"],["improved","개선된","s"],["inferior","더 못한","a"],["annual","해마다의","n"]]},{"w":"disrupt","m":"망가뜨리다, 혼란에 빠뜨리다","it":[["polish","닦다","n"],["disturb","방해하다, 어지럽히다","s"],["organize","정리하다","a"],["whisper","속삭이다","n"],["interrupt","중단시키다, 방해하다","s"],["arrange","정돈하다","a"],["rent","빌리다","n"]]},{"w":"increased","m":"증가한","it":[["elevated","높아진","s"],["musical","음악의","n"],["reduced","줄어든","a"],["honest","정직한","n"],["heightened","높아진, 고조된","s"],["decreased","감소한","a"],["rural","시골의","n"]]},{"w":"neutral","m":"중립적인, 어느 쪽에도 치우치지 않은","it":[["wooden","나무로 된","n"],["impartial","치우치지 않은","s"],["biased","편향된","a"],["punctual","시간을 잘 지키는","n"],["unbiased","편견 없는","s"],["prejudiced","편견을 가진","a"],["annual","해마다의","n"]]},{"w":"progeny","m":"자손","it":[["offspring","자손","s"],["furniture","가구","n"],["ancestors","조상","a"],["weather","날씨","n"],["descendants","자손, 후손","s"],["forefathers","선조","a"],["harvest","수확","n"]]}]}],"no":"29"},{"id":"2510g2-30","title":"어휘특훈 · 25년 10월 고2 30번","sub":"자유주의 문화와 유교 문화의 가족관","tpl":"Within liberal culture, the value of fair equality of opportunity for individuals {outweighs} the {preservation} of the family's integrity. In {contrast}, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a {fundamental} role in human {flourishing}, and living within a family institution is considered the {essential} way of life. Individuals are {primarily} understood as family members {before} they are regarded as state citizens. Therefore, for Confucians, the family possesses {inherent} value that should never be {abandoned}, even if it results in certain societal {inequalities}. Some cultures, like the liberal one, may choose to impose increasing {restrictions} on the role of families and implement more {egalitarian} government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity. On the other hand, other cultures, like the Confucian one, may {prefer} to primarily assign welfare responsibilities to the family, {accepting} inequalities {stemming} from the existence of the family as long as everyone's basic freedoms and rights are {safeguarded} in the state.","fn":["*liberal: 자유주의의","*Confucian: 유교의","*integrity: 온전함","*welfare: 복지"],"mean":{"outweighs":"동사 outweigh(~보다 더 중요하다)의 3인칭 단수형","overrides":"동사 override(~보다 우선하다)의 3인칭 단수형","preservation":"보존, 지킴","protection":"보호","contrast":"대조. In contrast = 이와 대조적으로","addition":"추가. In addition = 게다가","fundamental":"근본적인","marginal":"주변적인, 별로 중요하지 않은","central":"중심적인","flourishing":"동사 flourish(번영하다)의 -ing형. 번영, 잘 사는 것","thriving":"동사 thrive(번성하다)의 -ing형. 번영","decline":"쇠퇴","essential":"필수적인","optional":"선택 사항인","primarily":"주로, 무엇보다 먼저","mainly":"주로","before":"~하기 전에","after":"~한 후에","inherent":"본래의, 타고난","intrinsic":"본질적인","disposable":"쓰고 버릴 수 있는, 일회용의","abandoned":"동사 abandon(버리다)의 과거분사형. 버려지는","cherished":"동사 cherish(소중히 여기다)의 과거분사형. 소중히 여겨지는","given up":"동사 give up(포기하다)의 과거분사형. 포기되는","inequalities":"명사 inequality(불평등)의 복수형","disparities":"명사 disparity(격차)의 복수형","equalities":"명사 equality(평등)의 복수형","restrictions":"명사 restriction(제한)의 복수형","limits":"명사 limit(제한, 한계)의 복수형","egalitarian":"평등주의의","hierarchical":"계층적인, 위아래가 나뉜","prefer":"선호하다","refuse":"거절하다","accepting":"동사 accept(받아들이다)의 -ing형. 받아들이면서(분사구문)","tolerating":"동사 tolerate(용인하다, 참다)의 -ing형. 참고 받아들이면서","rejecting":"동사 reject(거부하다)의 -ing형. 거부하면서","stemming":"동사 stem(비롯되다)의 -ing형. ~에서 비롯되는","arising":"동사 arise(생겨나다)의 -ing형. ~에서 생겨나는","safeguarded":"동사 safeguard(보호하다)의 과거분사형. 보호되는","violated":"동사 violate(침해하다)의 과거분사형. 침해되는"},"comp":[{"no":"30","slots":[["outweighs"],["contrast","addition","a"],["fundamental"],["essential"],["primarily"]],"opts":["contrast","fact","short","general"],"or":["contrast(대조): In contrast(이와 대조적으로)로 자유주의 문화와 유교 문화를 맞세워 맞음.","fact(사실): In fact(사실은)는 앞말을 더 강조할 때 쓰는데, 뒤는 앞과 다른 문화 이야기라 안 맞음.","short(짧은): In short(요컨대)는 앞을 요약하는데, 뒤 문장은 요약이 아니라 새로운 문화를 소개함.","general(일반적인): In general(일반적으로)은 앞뒤를 맞세우지 못해 두 문화의 차이가 흐려짐."],"om":["이와 대조적으로","사실은","요컨대","일반적으로"],"en":"Within liberal culture, the value of fair equality of opportunity for individuals outweighs the preservation of the family's integrity. In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing","ko":"자유주의 문화 안에서는 개인을 위한 공정한 기회 평등의 가치가 가족의 온전함을 지키는 것보다 더 중요하다. 이와 대조적으로 유교 문화에서는 개인을 위한 공정한 기회 평등을 추구하는 것도 중요하지만, 가족이 인간의 번영에 근본적인 역할을 맡는다.","hl":["In contrast","outweighs the preservation of the family's integrity"],"khl":["이와 대조적으로","가족의 온전함을 지키는 것보다 더 중요하다"],"blocks":[{"t":"pair","h":"두 문화 맞세우기","x":[["Within liberal culture","자유주의 문화: 개인의 기회 평등이 가족보다 먼저"],["for Confucian culture","유교 문화: 가족이 삶의 중심"]]},{"t":"p","h":"addition(추가)이 안 되는 이유","x":["In addition(게다가)은 같은 쪽 이야기를 덧붙일 때 쓴다.","그런데 앞은 개인이 먼저, 뒤는 가족이 먼저다.","방향이 반대인 두 이야기 사이에는 대조의 연결어가 와야 한다.","글 끝의 On the other hand(반면)도 같은 대조를 한 번 더 보여 준다."]}],"post":["contrast(대조) ↔ addition(추가)","자유주의 = 개인 먼저, 유교 = 가족 먼저"]},{"no":"30","slots":[["inherent"],["abandoned","given up","s"],["egalitarian"],["prefer"],["accepting","rejecting","a"]],"opts":["accepting","opposing","eliminating","condemning"],"or":["accepting(받아들이는): 앞에서 불평등이 생겨도 가족을 지킨다고 했으니 불평등을 받아들인다는 말이 맞음.","opposing(반대하는): 가족에서 생기는 불평등에 반대한다면 가족에게 복지를 맡기는 선택과 부딪침.","eliminating(없애는): 불평등을 없애려 했다면 자유주의 문화처럼 가족의 역할을 줄였을 것임.","condemning(비난하는): 불평등을 비난하면서 그 원인인 가족에게 복지를 더 맡긴다는 건 앞뒤가 맞지 않음."],"om":["받아들이는","반대하는","없애는","비난하는"],"en":"On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.","ko":"반면 유교 문화 같은 다른 문화는 국가 안에서 모든 사람의 기본적인 자유와 권리가 보호되는 한, 가족의 존재에서 생겨나는 불평등을 받아들이면서 복지 책임을 주로 가족에게 맡기는 쪽을 선호할 수 있다.","hl":["accepting inequalities stemming from the existence of the family","may prefer to primarily assign welfare responsibilities to the family"],"khl":["불평등을 받아들이면서","복지 책임을 주로 가족에게 맡기는 쪽을 선호할 수 있다"],"blocks":[{"t":"flow","h":"유교 문화의 생각 고리","x":["사람은 먼저 가족 구성원","가족은 버릴 수 없는 가치","복지도 가족에게 맡김","집안 형편 차이로 불평등이 생김","그 불평등은 받아들임"],"at":4},{"t":"p","h":"rejecting(거부하는)을 넣으면","x":["가족에게 복지를 맡기면 집안마다 형편이 달라 차이가 생긴다.","그 차이를 거부하면서 가족에게 맡긴다는 건 앞뒤가 안 맞는다.","given up(포기된)은 abandoned(버려진)와 같은 뜻이라 고치지 않는다."]}],"post":["accept(받아들이다) ↔ reject(거부하다)","가족 중심의 대가 = 불평등 받아들이기"]}],"compquiz":[{"w":"contrast","m":"대조","it":[["difference","차이","s"],["ladder","사다리","n"],["similarity","유사성","a"],["rumor","소문","n"],["distinction","구별, 차이","s"],["likeness","닮음","a"],["festival","축제","n"]]},{"w":"accept","m":"받아들이다","it":[["tolerate","참다, 용인하다","s"],["decorate","장식하다","n"],["reject","거부하다","a"],["whisper","속삭이다","n"],["embrace","받아들이다","s"],["decline","거절하다","a"],["measure","측정하다","n"]]}],"sets":[{"items":[{"slots":[["outweighs"],["contrast"],["fundamental","marginal","a"],["essential"],["before"]],"opts":["fundamental","harmful","temporary","passive"],"or":["fundamental(근본적인): 같은 문장 뒤 the essential way of life(필수적인 삶의 방식)와 같은 무게라 맞음.","harmful(해로운): 가족이 해로운 역할을 한다면 가족을 결코 버리면 안 된다는 뒤 내용과 부딪침.","temporary(일시적인): 사람을 무엇보다 먼저 가족 구성원으로 본다는 다음 문장과 안 맞음. 잠깐 쓰고 마는 역할이 아님.","passive(수동적인): 수동적인 역할로는 가족이 복지 책임까지 맡는다는 마지막 문장을 설명할 수 없음."],"om":["근본적인","해로운","일시적인","수동적인"],"en":"In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life.","ko":"이와 대조적으로 유교 문화에서는 개인을 위한 공정한 기회 평등을 추구하는 것도 중요하지만, 가족이 인간의 번영에 근본적인 역할을 맡으며, 가족 제도 안에서 사는 것이 필수적인 삶의 방식으로 여겨진다.","hl":["a fundamental role in human flourishing","the essential way of life"],"khl":["근본적인 역할","필수적인 삶의 방식"],"blocks":[{"t":"flow","h":"글 전체 지도","x":["자유주의: 개인의 기회 평등이 먼저","유교: 가족이 삶의 중심","유교: 사람 = 먼저 가족 구성원","유교: 불평등이 생겨도 가족은 지킴","정리: 두 문화의 서로 다른 선택"],"at":1},{"t":"p","h":"marginal(주변적인)을 넣고 다시 읽기","x":["\"가족은 인간의 번영에 주변적인 역할을 한다\"가 된다.","그런데 같은 문장 뒷부분은 가족 안의 삶이 필수적인 삶의 방식이라고 한다.","한 문장 안에서 앞은 가족이 별것 아니라 하고, 뒤는 가족이 필수라고 하는 셈이다.","유교 문화에서 가족은 한가운데에 있다."]}],"post":["fundamental(근본적인) ↔ marginal(주변적인)","유교 문화 = 가족이 삶의 중심"]},{"slots":[["preservation","protection","s"],["flourishing","thriving","s"],["before","after","a"],["inherent"],["abandoned"]],"opts":["before","because","unless","once"],"or":["before(~하기 전에): primarily(무엇보다 먼저)와 짝을 이뤄 가족 구성원이 먼저, 시민이 나중이라는 순서를 만듦.","because(~하기 때문에): 시민이라서 가족 구성원이라는 말이 되어 두 신분의 순서를 말하는 문장이 무너짐.","unless(~하지 않는 한): 시민으로 여겨지지 않을 때만 가족 구성원이라는 말이 되어 이상함.","once(일단 ~하면): 시민이 된 다음에야 가족 구성원이 된다는 말이라 가족이 먼저라는 유교 관점과 반대임."],"om":["~하기 전에","~하기 때문에","~하지 않는 한","일단 ~하면"],"en":"Individuals are primarily understood as family members before they are regarded as state citizens.","ko":"개인은 국가의 시민으로 여겨지기 전에 무엇보다 먼저 가족 구성원으로 이해된다.","hl":["before they are regarded as state citizens","primarily"],"khl":["국가의 시민으로 여겨지기 전에","무엇보다 먼저"],"blocks":[{"t":"pair","h":"순서를 정하는 두 말","x":[["primarily","무엇보다 먼저, 주로"],["before","~하기 전에"],["family members → state citizens","가족 구성원이 먼저 → 국가 시민은 그다음"]]},{"t":"p","h":"after(~한 후에)가 틀린 이유","x":["after(~한 후에)를 넣으면 시민이 먼저, 가족 구성원이 나중이 된다.","그러면 primarily(무엇보다 먼저)와 부딪친다.","유교 문화에서 사람은 태어날 때부터 누군가의 자식이다.","국가보다 가족이 먼저다."]},{"t":"p","h":"고치지 않아도 되는 두 단어","x":["protection(보호)은 preservation(보존)과 같은 방향이다. 가족의 온전함을 지킨다는 뜻이 그대로다.","thriving(번영)은 flourishing(번영)과 같은 말이다."]}],"post":["before(~하기 전에) ↔ after(~한 후에)","가족 구성원이 먼저, 시민은 그다음"]},{"slots":[["primarily"],["inherent","intrinsic","s"],["abandoned","cherished","a"],["inequalities"],["restrictions"]],"opts":["abandoned","respected","celebrated","examined"],"or":["abandoned(버려지는): should never be abandoned(결코 버려져서는 안 된다)가 되어 불평등이 생겨도 가족은 지킨다는 뜻이 맞음.","respected(존중받는): '결코 존중받아서는 안 된다'가 되어 가족을 귀하게 여기는 유교 관점과 반대임.","celebrated(찬양받는): '결코 찬양받으면 안 되는 가치'는 가족이 본래의 가치를 지닌다는 앞말과 어긋남.","examined(검토되는): '결코 검토되면 안 된다'는 가족의 가치와도, 뒤의 불평등 이야기와도 이어지지 않음."],"om":["버려지는","존중받는","찬양받는","검토되는"],"en":"Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.","ko":"따라서 유교를 따르는 사람들에게 가족은 어떤 사회적 불평등을 낳더라도 결코 버려져서는 안 되는 본래의 가치를 지닌다.","hl":["should never be abandoned","even if it results in certain societal inequalities"],"khl":["결코 버려져서는 안 되는","어떤 사회적 불평등을 낳더라도"],"blocks":[{"t":"p","h":"even if(~하더라도)가 정하는 방향","x":["even if(~하더라도) 뒤에는 치러야 할 대가가 온다.","대가는 사회적 불평등이다.","그래도 가족은 지킨다. 이게 문장의 뼈대다.","cherished(소중히 여겨지는)를 넣으면 \"결코 소중히 여기면 안 된다\"가 된다.","가족을 중심에 둔 유교 문화와 정반대다."]},{"t":"p","h":"intrinsic(본질적인)은 그대로","x":["intrinsic(본질적인)은 inherent(본래의)와 같은 뜻이다.","밖에서 붙인 가치가 아니라 원래부터 지닌 가치라는 말이다."]}],"post":["abandon(버리다) ↔ cherish(소중히 여기다)","불평등이 생겨도 가족은 지킴"]},{"slots":[["inequalities"],["restrictions"],["egalitarian","hierarchical","a"],["prefer"],["safeguarded"]],"opts":["egalitarian","exclusive","privileged","selective"],"or":["egalitarian(평등주의의): 같은 문장 끝 in the pursuit of fair equality of opportunity(공정한 기회 평등을 추구하며)와 같은 방향이라 맞음.","exclusive(배타적인): 일부만 받는 프로그램이라 모두에게 공정한 기회를 주려는 목적과 반대임.","privileged(특권층의): 특권층을 위한 정부 프로그램은 평등을 추구한다는 말과 부딪침.","selective(선별적인): 골라서 주는 교육·의료는 기회를 고르게 나누려는 자유주의 문화의 목표와 안 맞음."],"om":["평등주의의","배타적인","특권층의","선별적인"],"en":"Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity.","ko":"자유주의 문화 같은 일부 문화는 공정한 기회 평등을 추구하면서 가족의 역할에 점점 더 많은 제한을 가하고, 교육, 의료, 그 밖의 사회적 적극적 권리를 위해 더 평등주의적인 정부 프로그램을 시행하기로 선택할 수 있다.","hl":["more egalitarian government programs","in the pursuit of fair equality of opportunity"],"khl":["더 평등주의적인 정부 프로그램","공정한 기회 평등을 추구하면서"],"blocks":[{"t":"tap","h":"질문 하나","q":"자유주의 문화가 정부 프로그램을 만드는 목적은?","a":["in the pursuit of fair equality of opportunity(공정한 기회 평등을 추구하며).","목적이 평등이면 수단도 평등해야 한다.","hierarchical(계층적인) 프로그램은 사람마다 위아래를 나눈다.","평등을 위해 위아래를 나눈다는 건 말이 안 된다."]},{"t":"p","h":"가족 대신 정부","x":["자유주의 문화는 가족의 역할을 줄인다.","그 빈자리를 정부가 교육과 의료로 채운다.","집안 형편과 상관없이 누구나 같은 출발선에 서게 하려는 것이다."]}],"post":["egalitarian(평등주의의) ↔ hierarchical(계층적인)","가족 역할 줄이고 정부가 평등하게 채우기"]},{"slots":[["outweighs","overrides","s"],["flourishing","decline","a"],["essential"],["stemming","arising","s"],["safeguarded"]],"opts":["flourishing","suffering","conflict","isolation"],"or":["flourishing(번영): 가족 안의 삶이 필수적인 삶의 방식이라는 같은 문장 뒷부분과 이어져 맞음.","suffering(고통): 가족이 인간의 고통에 근본적 역할을 한다면 가족을 결코 버리면 안 된다는 주장과 부딪침.","conflict(갈등): 가족을 갈등의 중심으로 보는 건 가족을 삶의 기본으로 보는 유교 관점과 반대임.","isolation(고립): 가족 제도 안에서 함께 사는 삶은 고립과 거리가 멀어 안 맞음."],"om":["번영","고통","갈등","고립"],"en":"In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life.","ko":"이와 대조적으로 유교 문화에서는 개인을 위한 공정한 기회 평등을 추구하는 것도 중요하지만, 가족이 인간의 번영에 근본적인 역할을 맡으며, 가족 제도 안에서 사는 것이 필수적인 삶의 방식으로 여겨진다.","hl":["human flourishing","living within a family institution"],"khl":["인간의 번영","가족 제도 안에서 사는 것"],"blocks":[{"t":"p","h":"좋은 말끼리 묶인 문장","x":["이 문장에서 가족은 좋은 쪽으로만 그려진다.","fundamental role(근본적인 역할), essential way of life(필수적인 삶의 방식).","그 사이에 decline(쇠퇴)이 끼면 혼자 튄다.","가족이 사람을 쇠퇴시키는 데 근본적인 역할을 한다면, 가족을 버리지 말라는 뒤 내용이 이어질 수 없다."]},{"t":"p","h":"그대로 둘 두 단어","x":["overrides(~보다 우선하다)는 outweighs(~보다 더 중요하다)와 같은 방향이다.","arising(생겨나는)은 stemming(비롯되는)과 같은 뜻이다. 둘 다 뒤에 from(~에서)이 붙는다."]}],"post":["flourishing(번영) ↔ decline(쇠퇴)","유교의 가족 = 사람이 잘 사는 바탕"]}],"quiz":[{"w":"fundamental","m":"근본적인","it":[["wooden","나무로 된","n"],["basic","기본적인","s"],["minor","사소한","a"],["punctual","시간을 잘 지키는","n"],["primary","주요한, 근본적인","s"],["peripheral","주변적인","a"],["noisy","시끄러운","n"]]},{"w":"before","m":"~ 전에","it":[["prior to","~ 이전에","s"],["beneath","~ 아래에","n"],["after","~ 후에","a"],["ahead of","~보다 앞서","s"],["beside","~ 옆에","n"],["following","~ 후에","a"],["across","~을 가로질러","n"]]},{"w":"abandon","m":"버리다","it":[["predict","예측하다","n"],["desert","버리다, 저버리다","s"],["keep","지키다, 유지하다","a"],["admire","존경하다","n"],["give up","포기하다","s"],["retain","보유하다, 유지하다","a"],["decorate","장식하다","n"]]},{"w":"egalitarian","m":"평등주의의","it":[["classless","계급 없는","s"],["fragile","깨지기 쉬운","n"],["elitist","엘리트주의의","a"],["ancient","고대의","n"],["democratic","민주적인","s"],["hierarchical","계층적인","a"],["fluent","유창한","n"]]},{"w":"flourish","m":"번영하다, 번성하다","it":[["thrive","번성하다","s"],["whisper","속삭이다","n"],["decline","쇠퇴하다","a"],["borrow","빌리다","n"],["prosper","번영하다","s"],["wither","시들다","a"],["invite","초대하다","n"]]}]},{"items":[{"slots":[["preservation"],["fundamental"],["essential","optional","a"],["before"],["abandoned"]],"opts":["essential","outdated","unusual","risky"],"or":["essential(필수적인): 앞의 fundamental role(근본적인 역할)과 같은 무게로 가족 안의 삶을 높이 평가해 맞음.","outdated(구식의): 가족 안의 삶을 구식으로 보는 건 가족을 결코 버리면 안 된다는 유교 관점과 반대임.","unusual(흔치 않은): 유교 문화에서 가족 안의 삶은 드문 예외가 아니라 기본임.","risky(위험한): 가족 안의 삶을 위험하다고 보면 사람을 먼저 가족 구성원으로 본다는 다음 문장과 안 맞음."],"om":["필수적인","구식의","흔치 않은","위험한"],"en":"the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life.","ko":"가족이 인간의 번영에 근본적인 역할을 맡으며, 가족 제도 안에서 사는 것이 필수적인 삶의 방식으로 여겨진다.","hl":["the essential way of life","a fundamental role"],"khl":["필수적인 삶의 방식","근본적인 역할"],"blocks":[{"t":"p","h":"optional(선택 사항인)을 넣고 읽어 보기","x":["\"가족 안에서 사는 것은 선택 사항인 삶의 방식이다.\"","해도 되고 안 해도 된다는 말이다.","그런데 바로 다음 문장은 사람을 무엇보다 먼저 가족 구성원으로 본다고 한다.","선택 사항이라면 '먼저'일 수 없다."]},{"t":"p","h":"and(그리고)로 이어진 두 말","x":["앞: 가족은 근본적인 역할을 한다.","뒤: 가족 안의 삶은 필수다.","and(그리고)는 같은 방향의 말을 잇는다.","앞이 근본이면 뒤도 필수여야 짝이 맞다."]}],"post":["essential(필수적인) ↔ optional(선택 사항인)","가족 안의 삶 = 선택이 아니라 기본"]},{"slots":[["contrast"],["primarily","mainly","s"],["inherent","disposable","a"],["inequalities","disparities","s"],["egalitarian"]],"opts":["inherent","borrowed","limited","hidden"],"or":["inherent(본래의): 원래부터 지닌 가치라서 결코 버리면 안 된다는 뒷말과 맞음.","borrowed(빌려 온): 남에게서 빌려 온 가치라면 '결코 버리면 안 된다'고 할 만큼 굳건하지 않음.","limited(제한된): 가치가 제한적이라면 불평등을 감수하면서까지 지킬 이유가 약해짐.","hidden(숨겨진): 유교 문화에서 가족의 가치는 숨겨진 게 아니라 삶의 중심으로 드러나 있음."],"om":["본래의","빌려 온","제한된","숨겨진"],"en":"Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities.","ko":"따라서 유교를 따르는 사람들에게 가족은 어떤 사회적 불평등을 낳더라도 결코 버려져서는 안 되는 본래의 가치를 지닌다.","hl":["inherent value","should never be abandoned"],"khl":["본래의 가치","결코 버려져서는 안 되는"],"blocks":[{"t":"p","h":"한 문장 안의 모순","x":["disposable(쓰고 버릴 수 있는)은 일회용 컵처럼 쓰고 버리는 것이다.","그런데 바로 뒤에서 should never be abandoned(결코 버려져서는 안 된다)라고 한다.","\"쓰고 버리는 가치인데 절대 버리면 안 된다\"는 말이 된다.","한 문장이 스스로 부딪친다."]},{"t":"p","h":"Therefore(따라서)가 이어 주는 것","x":["앞 문장: 사람은 먼저 가족 구성원이다.","그래서 가족은 사람에게서 떼어 낼 수 없는 원래의 가치다.","원인과 결과가 그대로 이어진다."]},{"t":"p","h":"함정","x":["mainly(주로)는 primarily(주로, 무엇보다 먼저) 자리에, disparities(격차)는 inequalities(불평등) 자리에 들어가도 뜻이 같다.","고칠 곳은 하나다."]}],"post":["inherent(본래의) ↔ disposable(쓰고 버릴 수 있는)","가족 = 떼어 낼 수 없는 원래의 가치"]},{"slots":[["fundamental","central","s"],["before"],["inequalities","equalities","a"],["restrictions"],["accepting"]],"opts":["inequalities","benefits","improvements","advantages"],"or":["inequalities(불평등): even if(~하더라도) 뒤에 올 대가로 맞고, 마지막 문장 accepting inequalities(불평등을 받아들이며)와도 이어짐.","benefits(혜택): 혜택이 생기는 건 양보할 일이 아니라서 even if(~하더라도)와 부딪침.","improvements(개선): 사회가 나아지는 건 감수할 대가가 아니라 even if(~하더라도) 뒤에 어울리지 않음.","advantages(이점): 이점은 대가가 아니라서 '이점이 생기더라도 가족을 지킨다'는 말이 어색함."],"om":["불평등","혜택","개선","이점"],"en":"Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities. … accepting inequalities stemming from the existence of the family","ko":"따라서 유교를 따르는 사람들에게 가족은 어떤 사회적 불평등을 낳더라도 결코 버려져서는 안 되는 본래의 가치를 지닌다. … 가족의 존재에서 생겨나는 불평등을 받아들이면서","hl":["even if it results in certain societal inequalities","accepting inequalities stemming from the existence of the family"],"khl":["어떤 사회적 불평등을 낳더라도","가족의 존재에서 생겨나는 불평등을 받아들이면서"],"blocks":[{"t":"pair","h":"앞뒤에서 같은 말 찾기","x":[["even if it results in certain societal inequalities","어떤 사회적 불평등을 낳더라도"],["accepting inequalities stemming from the existence of the family","가족의 존재에서 생겨나는 불평등을 받아들이면서"]]},{"t":"p","h":"글이 스스로 답을 준다","x":["마지막 문장에서 유교 문화는 불평등을 받아들인다.","같은 이야기를 앞에서 먼저 꺼낸 것이다.","equalities(평등)를 넣으면 \"평등을 낳더라도 가족을 지킨다\"가 된다.","평등은 감수할 대가가 아니라 좋은 결과다. even if(~하더라도)와 맞지 않는다."]},{"t":"p","h":"central(중심적인)은 맞다","x":["central role(중심적인 역할)은 fundamental role(근본적인 역할)과 같은 무게다."]}],"post":["inequality(불평등) ↔ equality(평등)","가족을 지키는 대가 = 사회적 불평등"]},{"slots":[["flourishing"],["abandoned"],["egalitarian"],["prefer","refuse","a"],["stemming"]],"opts":["prefer","hesitate","fail","forget"],"or":["prefer(선호하다): 가족에게 복지를 맡기는 쪽을 고른다는 뜻이라 가족 중심의 유교 문화와 맞음.","hesitate(망설이다): 가족을 삶의 중심으로 보는 문화가 가족에게 복지를 맡기길 망설일 이유가 없음.","fail(실패하다): '맡기는 데 실패한다'는 말은 두 문화의 선택을 비교하는 이 문장의 흐름과 안 맞음.","forget(잊다): 복지 책임을 맡기는 걸 잊는다는 건 일부러 고르는 선택이 아니라서 어색함."],"om":["선호하다","망설이다","실패하다","잊다"],"en":"On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.","ko":"반면 유교 문화 같은 다른 문화는 국가 안에서 모든 사람의 기본적인 자유와 권리가 보호되는 한, 가족의 존재에서 생겨나는 불평등을 받아들이면서 복지 책임을 주로 가족에게 맡기는 쪽을 선호할 수 있다.","hl":["may prefer to primarily assign welfare responsibilities to the family","On the other hand"],"khl":["복지 책임을 주로 가족에게 맡기는 쪽을 선호할 수 있다","반면"],"blocks":[{"t":"pair","h":"두 문화의 선택 나란히","x":[["impose increasing restrictions on the role of families","가족의 역할에 점점 더 많은 제한을 가하다 (자유주의)"],["primarily assign welfare responsibilities to the family","복지 책임을 주로 가족에게 맡기다 (유교)"]]},{"t":"p","h":"On the other hand(반면)의 역할","x":["앞 문장은 자유주의 문화가 가족 역할을 줄이는 이야기다.","On the other hand(반면) 뒤에는 그 반대 선택이 온다.","가족에게 더 맡기는 쪽이다.","refuse(거절하다)를 넣으면 유교 문화도 가족에게 안 맡기는 셈이 되어 앞 문장과 같은 방향이 된다.","대조가 사라진다."]}],"post":["prefer(선호하다) ↔ refuse(거절하다)","자유주의 = 정부가 복지, 유교 = 가족이 복지"]},{"slots":[["outweighs"],["restrictions","limits","s"],["accepting","tolerating","s"],["stemming"],["safeguarded","violated","a"]],"opts":["safeguarded","restricted","ignored","removed"],"or":["safeguarded(보호되는): as long as(~하는 한) 뒤에 오는 최소 조건이라 기본 자유가 지켜진다는 말이 맞음.","restricted(제한되는): 기본 자유가 제한되는 한 불평등을 받아들인다는 건 조건이 아니라 문제 상황임.","ignored(무시되는): 권리가 무시되는 걸 조건으로 거는 문화는 없어 as long as(~하는 한)와 안 맞음.","removed(없어지는): 기본 권리가 없어지는 것을 조건으로 내건다는 말이 되어 앞뒤가 맞지 않음."],"om":["보호되는","제한되는","무시되는","없어지는"],"en":"accepting inequalities stemming from the existence of the family as long as everyone's basic freedoms and rights are safeguarded in the state.","ko":"국가 안에서 모든 사람의 기본적인 자유와 권리가 보호되는 한, 가족의 존재에서 생겨나는 불평등을 받아들이면서","hl":["as long as everyone's basic freedoms and rights are safeguarded","accepting inequalities"],"khl":["기본적인 자유와 권리가 보호되는 한","불평등을 받아들이면서"],"blocks":[{"t":"tap","h":"질문 하나","q":"유교 문화가 불평등을 받아들이는 데 붙인 조건은?","a":["모든 사람의 기본 자유와 권리가 지켜질 것.","불평등은 참아도 기본 권리는 양보하지 않는다.","violated(침해되는)를 넣으면 \"권리가 짓밟히는 한 받아들인다\"가 된다.","조건이 아니라 재앙이다."]},{"t":"p","h":"그대로 둘 두 단어","x":["limits(제한)는 restrictions(제한)와 같은 말이다.","tolerating(참고 받아들이는)은 accepting(받아들이는)과 같은 방향이다.","둘 다 문장의 뜻을 바꾸지 않는다."]}],"post":["safeguard(보호하다) ↔ violate(침해하다)","불평등은 감수, 기본 권리는 보장"]}],"quiz":[{"w":"essential","m":"필수적인","it":[["vital","필수적인","s"],["loyal","충실한","n"],["optional","선택적인","a"],["annual","해마다의","n"],["crucial","결정적인, 아주 중요한","s"],["unnecessary","불필요한","a"],["curious","호기심 많은","n"]]},{"w":"inherent","m":"본래의, 타고난","it":[["generous","관대한","n"],["intrinsic","본질적인","s"],["extrinsic","외적인, 비본질적인","a"],["urgent","긴급한","n"],["innate","타고난","s"],["acquired","후천적인, 습득된","a"],["humble","겸손한","n"]]},{"w":"inequality","m":"불평등","it":[["disparity","격차, 불균형","s"],["harvest","수확","n"],["equality","평등","a"],["journey","여행","n"],["imbalance","불균형","s"],["parity","동등함","a"],["ceiling","천장","n"]]},{"w":"prefer","m":"선호하다","it":[["repair","수리하다","n"],["favor","더 좋아하다","s"],["dislike","싫어하다","a"],["measure","측정하다","n"],["choose","고르다","s"],["reject","거부하다","a"],["sneeze","재채기하다","n"]]},{"w":"safeguard","m":"보호하다","it":[["protect","보호하다","s"],["celebrate","축하하다","n"],["endanger","위험에 빠뜨리다","a"],["postpone","미루다","n"],["shield","지키다, 보호하다","s"],["threaten","위협하다","a"],["borrow","빌리다","n"]]}]}],"no":"30"},{"id":"2510g2-31","title":"어휘특훈 · 25년 10월 고2 31번","sub":"국가 권위를 세우는 통계","tpl":"Statistics in the twentieth century became the {systematic} collection of {quantitative} information needed by the state. This process occurred in all the {industrialised} countries as a {key} part of their becoming {modern} states. Desrosières writes: \"It is {difficult} to think {simultaneously} that the objects being measured really do {exist} and that this is only a {convention}\". Yet this is the case. Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks {supporting} the collection, {aggregation}, and organisation of {official} statistics are {devised} to {serve} the purposes of the state, for macroeconomic or for social policies. Theodore Porter described the use of statistics to {create} state authority: \"Quantification is a way of making decisions without {seeming} to decide\", characterising it as a \"social technology\" intended to {build} {trust} in authority.","fn":["*Desrosières: 데로지에르(프랑스의 통계학자)","*phenomena: 현상들(phenomenon의 복수형)","*macroeconomic: 거시 경제의","*quantification: 수량화, 정량화"],"mean":{"systematic":"체계적인","haphazard":"되는대로의, 무계획적인","quantitative":"양적인, 수량의","numerical":"숫자로 된, 수치의","industrialised":"산업화된(영국식 철자, 미국식은 industrialized)","developed":"선진의, 발전한","key":"핵심적인","central":"중심적인","minor":"사소한, 중요하지 않은","modern":"근대의, 현대의","traditional":"전통적인","difficult":"어려운","hard":"어려운","easy":"쉬운","simultaneously":"동시에","separately":"따로따로","exist":"존재하다","vanish":"사라지다","convention":"관례, 사람들이 정한 약속","construct":"사람이 만든 개념, 구성물","supporting":"동사 support(뒷받침하다)의 -ing형. 뒷받침하는","hindering":"동사 hinder(방해하다)의 -ing형. 방해하는","underlying":"밑바탕이 되는","aggregation":"집계, 모아 합침","compilation":"편집, 모아 정리함","official":"공식적인","private":"개인의, 민간의","devised":"동사 devise(고안하다)의 과거분사형. 고안된","designed":"동사 design(설계하다)의 과거분사형. 설계된","serve":"이바지하다, 도움이 되다","undermine":"약화시키다","fulfill":"이루다, 충족시키다","create":"만들어 내다","weaken":"약화하다","establish":"세우다, 확립하다","seeming":"동사 seem(~처럼 보이다)의 -ing형. 동명사","appearing":"동사 appear(~처럼 보이다)의 -ing형. 동명사","build":"쌓다","erode":"서서히 무너뜨리다, 약화시키다","trust":"신뢰","distrust":"불신"},"comp":[{"no":"31","slots":[["quantitative"],["key","minor","a"],["modern"],["difficult"],["simultaneously"]],"opts":["key","recent","sudden","foreign"],"or":["key(핵심적인): 모든 산업 국가에서 일어난 과정이고 국가 권위까지 세우는 통계라 핵심 부분이 맞음.","recent(최근의): '최근의 부분'은 뜻이 서지 않고, 근대 국가가 되는 데 얼마나 중요했는지를 말하는 자리와도 안 맞음.","sudden(갑작스러운): 체계적으로 모으는 일은 근대 국가가 되는 과정과 함께 자리 잡은 것이라 갑작스러운 부분이 아님.","foreign(외국의): 각 나라가 스스로 근대 국가가 되는 과정이라 외국의 부분이라는 말은 안 맞음."],"om":["핵심적인","최근의","갑작스러운","외국의"],"en":"Statistics in the twentieth century became the systematic collection of quantitative information needed by the state. This process occurred in all the industrialised countries as a key part of their becoming modern states.","ko":"20세기의 통계는 국가가 필요로 하는 수량 정보를 체계적으로 모으는 일이 되었다. 이 과정은 모든 산업화된 나라에서 그 나라들이 근대 국가가 되는 일의 핵심 부분으로 일어났다.","hl":["a key part of their becoming modern states","all the industrialised countries"],"khl":["핵심 부분","모든 산업화된 나라"],"blocks":[{"t":"p","h":"minor(사소한)를 넣고 다시 읽기","x":["\"통계는 근대 국가가 되는 데 사소한 부분이었다\"가 된다.","그런데 이 과정은 all(모든) 산업 국가에서 일어났다.","글 끝에서는 통계가 국가 권위까지 세운다고 한다.","사소한 부분이 국가 권위를 세울 수는 없다."]},{"t":"p","h":"all(모든)이라는 말의 무게","x":["어느 한 나라가 아니라 모든 산업 국가다.","예외가 없다는 건 그만큼 꼭 필요했다는 뜻이다."]}],"post":["key(핵심적인) ↔ minor(사소한)","통계 = 근대 국가의 핵심 부품"]},{"no":"31","slots":[["convention"],["supporting"],["official","private","a"],["serve","fulfill","s"],["build"]],"opts":["official","ancient","secret","fictional"],"or":["official(공식적인): 국가 목적에 이바지하도록 고안된 통계라서 국가가 내는 공식 통계가 맞음.","ancient(고대의): 이 글은 20세기 근대 국가의 통계 이야기라 고대와 맞지 않음.","secret(비밀의): 사람들의 신뢰를 쌓는 기술이라 숨긴 통계로는 그 역할을 못 함.","fictional(허구의): 매겨지는 가격과 팔리는 상품 같은 진짜 현상을 다루는 통계라 허구라는 말과 부딪침."],"om":["공식적인","고대의","비밀의","허구의"],"en":"Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.","ko":"매겨지는 가격이나 팔리는 상품 같은 현상은 존재하지만, 공식 통계의 수집, 집계, 정리를 뒷받침하는 범주와 분류 틀은 거시 경제 정책이나 사회 정책을 위한 국가의 목적에 이바지하도록 고안된다.","hl":["official statistics","to serve the purposes of the state"],"khl":["공식 통계","국가의 목적에 이바지하도록"] d to serve the purposes of the state, for macroeconomic or for social policies.","ko":"매겨지는 가격이나 팔리는 상품 같은 현상은 존재하지만, 공식 통계의 수집, 집계, 정리를 뒷받침하는 범주와 분류 틀은 거시 경제 정책이나 사회 정책을 위한 국가의 목적에 이바지하도록 고안된다.","hl":["classification frameworks supporting the collection","devised to serve the purposes of the state"],"khl":["뒷받침하는 범주와 분류 틀","국가의 목적에 이바지하도록 고안된다"],"blocks":[{"t":"tap","h":"질문 하나","q":"분류 틀은 왜 만들어졌나?","a":["devised to serve the purposes of the state(국가의 목적에 이바지하도록 고안됨).","국가가 통계를 잘 모으려고 만든 틀이다.","hindering(방해하는)을 넣으면 틀이 수집을 막는 셈이 되어 만든 이유가 사라진다."]},{"t":"p","h":"틀은 도구다","x":["가격과 상품 판매는 원래 세상에 있다.","하지만 그걸 어떤 칸에 나눠 담을지는 국가가 정한다.","칸은 모으고, 합치고, 정리하는 일을 돕는다.","compilation(모아 정리함)은 aggregation(집계) 자리에 써도 뜻이 통한다."]}],"post":["support(뒷받침하다) ↔ hinder(방해하다)","분류 틀 = 국가가 만든 통계 도구"]},{"slots":[["devised"],["serve"],["create","weaken","a"],["seeming"],["trust"]],"opts":["create","question","limit","conceal"],"or":["create(만들어 내다): 같은 문장 끝의 build trust in authority(권위에 대한 신뢰를 쌓다)와 같은 방향이라 맞음.","question(의문을 제기하다): 권위에 의문을 던지는 쓰임이라면 신뢰를 쌓는다는 마지막 말과 부딪침.","limit(제한하다): 국가 목적에 이바지하도록 만든 통계가 국가 권위를 제한한다는 건 앞 문장과 반대임.","conceal(숨기다): 권위를 숨기는 게 아니라 결정을 결정 같지 않게 보이게 해서 권위를 세우는 것임."],"om":["만들어 내다","의문을 제기하다","제한하다","숨기다"],"en":"Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of making decisions without seeming to decide\", characterising it as a \"social technology\" intended to build trust in authority.","ko":"시어도어 포터는 국가 권위를 만들어 내는 통계의 쓰임을 이렇게 묘사했다. \"수량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방법이다.\" 그리고 그것을 권위에 대한 신뢰를 쌓기 위한 '사회적 기술'이라고 규정했다.","hl":["the use of statistics to create state authority","build trust in authority"],"khl":["국가 권위를 만들어 내는 통계의 쓰임","권위에 대한 신뢰를 쌓기"],"blocks":[{"t":"flow","h":"글의 흐름","x":["20세기 통계 = 국가에 필요한 정보 모으기","모든 산업 국가가 근대 국가가 되는 핵심 과정","측정 대상은 진짜지만 분류는 사람이 정한 약속","분류 틀은 국가 목적에 맞게 고안됨","통계는 국가 권위를 세우는 사회적 기술"],"at":4},{"t":"p","h":"weaken(약화하다)이 튀는 이유","x":["글 처음부터 끝까지 통계는 국가 편이다.","국가가 필요로 하고, 국가 목적에 이바지한다.","그런 , 지지하다","it":[["uphold","지지하다, 떠받치다","s"],["sneeze","재채기하다","n"],["oppose","반대하다","a"],["decorate","장식하다","n"],["back","지지하다","s"],["undermine","약화시키다","a"],["whisper","속삭이다","n"]]},{"w":"create","m":"만들어 내다","it":[["establish","세우다, 확립하다","s"],["borrow","빌리다","n"],["destroy","파괴하다","a"],["predict","예측하다","n"],["generate","만들어 내다","s"],["abolish","폐지하다","a"],["admire","존경하다","n"]]},{"w":"build","m":"쌓다, 짓다","it":[["construct","세우다, 짓다","s"],["invite","초대하다","n"],["demolish","허물다","a"],["sneeze","재채기하다","n"],["develop","발전시키다","s"],["tear down","허물다","a"],["measure","측정하다","n"]]}]},{"items":[{"slots":[["systematic"],["key"],["modern","traditional","a"],["difficult"],["exist"]],"opts":["modern","rural","small","weak"],"or":["modern(근대의): industrialised(산업화된) 나라들이 20세기에 되어 간 모습이라 맞음.","rural(시골의): 산업화된 나라가 시골 국가가 된다는 건 산업화와 반대 방향임.","small(작은): 국가가 통계로 정보를 모으는 이야기는 나라의 크기와 상관이 없음.","weak(약한): 통계는 국가 권위를 세우는 도구라서 약한 국가가 된다는 건 글 끝과 부딪침."],"om":["근대의","시골의","작은","약한"],"en":"Statistics in the twentieth century became the systematic collection of quantitative information needed by the state. This process occurred in all the industrialised countries as a key part of their becoming modern states.","ko":"20세기의 통계는 국가가 필요로 하는 수량 정보를 체계적으로 모으는 일이 되었다. 이 과정은 모든 산업화된 나라에서 그 나라들이 근대 국가가 되는 일의 핵심 부분으로 일어났다.","hl":["becoming modern states","industrialised countries"],"khl":["근대 국가가 되는","산업화된 나라"],"blocks":[{"t":"pair","h":"시대와 방향이 같은 말","x":[["in the twentieth century","20세기에"],["industrialised countries","산업화된 나라들"],["becoming modern states","근대 국가가 되는 것"]]},{"t":"p","h":"traditional(전통적인)이 틀린 이유","x":["20세기, 산업화, 통계. 모두 새로운 시대를 가리키는 말이다.","traditional(전통적인) 국가가 된다면 거꾸로 옛날로 돌아가는 셈이다.","산업화된 나라가 체계적인 통계를 갖추며 가는 곳은 근대 국가다."]}],"post":["modern(근대의) ↔ traditional(전통적인)","통계 = 근대 국가가 되는 핵심 과정"]},{"slots":[["systematic","haphazard","a"],["quantitative","numerical","s"],["key","central","s"],["simultaneously"],["convention"]],"opts":["systematic","accidental","casual","emotional"],"or":["systematic(체계적인): 범주와 분류 틀을 갖춰 정리하는 국가 통계의 성격과 맞음.","accidental(우연한): 국가가 필요로 해서 모으는 정보라 우연히 모인다는 말과 안 맞음.","casual(대충 하는): 분류 틀까지 고안해 모으는 일을 대충 한다고 할 수 없음.","emotional(감정적인): 숫자 정보를 모으는 일에 감정적이라는 말은 어울리지 않음."],"om":["체계적인","우연한","대충 하는","감정적인"],"en":"Statistics in the twentieth century became the systematic collection of quantitative information needed by the state.","ko":"20세기의 통계는 국가가 필요로 하는 수량 정보를 체계적으로 모으는 일이 되었다.","hl":["the systematic collection","needed by the state"],"khl":["체계적으로 모으는 일","국가가 필요로 하는"],"blocks":[{"t":"p","h":"haphazard(되는대로의)를 넣고 읽기","x":["\"국가에 필요한 수량 정보를 되는대로 모은 것\"이 된다.","그런데 글 중간에 categories and classification frameworks(범주와 분류 틀)가 나온다.","칸을 나누고 틀을 짜서 모으는 일이다.","되는대로가 아니라 계획대로다."]},{"t":"p","h":"그대로 둘 두 단어","x":["numerical(숫자로 된)은 quantitative(양적인, 수량의) 자리에 써도 같은 뜻이다.","central(중심적인)은 key(핵심적인) 자리에 써도 된다. a central part(중심적인 부분)도 자연스럽다."]}],"post":["systematic(체계적인) ↔ haphazard(되는대로의)","국가 통계 = 틀을 짜서 모으기"]},{"slots":[["difficult","hard","s"],["exist","vanish","a"],["convention"],["supporting"],["aggregation"]],"opts":["exist","change","grow","compete"],"or":["exist(존재하다): 다음 문장의 products being sold exist(팔리는 상품은 존재한다)가 같은 말로 다시 확인해 줘서 맞음.","change(변하다): 핵심은 대상이 진짜 있느냐 없느냐인데, 변한다는 말은 '관례일 뿐'과 맞서는 짝이 되지 못함.","grow(자라다): 측정 대상이 자란다는 건 '관례일 뿐'이라는 생각과 부딪치는 말이 아님.","compete(경쟁하다): 측정 대상이 경쟁한다는 건 이 문장의 존재 이야기와 관계없음."],"om":["존재하다","변하다","자라다","경쟁하다"],"en":"Desrosières writes: \"It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention\". Yet this is the case. Phenomena such as prices being charged and products being sold exist, …","ko":"데로지에르는 이렇게 쓴다. \"측정되는 대상이 정말로 존재한다는 것과 이것이 하나의 관례일 뿐이라는 것을 동시에 생각하기는 어렵다.\" 그러나 실제로 그렇다. 매겨지는 가격이나 팔리는 상품 같은 현상은 존재한다. …","hl":["really do exist","products being sold exist"],"khl":["정말로 존재한다","현상은 존재한다"],"blocks":[{"t":"p","h":"do(정말로)가 붙은 이유","x":["really do exist(정말로 존재한다)에서 do(정말로)는 강조다.","\"정말 있다\"를 힘주어 말한 것이다.","바로 다음 문장도 가격과 상품 판매 같은 현상은 exist(존재한다)라고 못 박는다.","vanish(사라지다)를 넣으면 \"정말로 사라진다\"가 되어 다음 문장과 정면으로 부딪친다."]},{"t":"p","h":"고치지 않는 단어","x":["hard(어려운)는 difficult(어려운)와 같은 뜻이다.","It is hard to think(생각하기 어렵다)도 자연스러운 문장이다."]}],"post":["exist(존재하다) ↔ vanish(사라지다)","가격·판매는 진짜, 분류 칸은 약속"]},{"slots":[["official"],["devised"],["serve","undermine","a"],["create"],["build"]],"opts":["serve","ignore","escape","reveal"],"or":["serve(이바지하다): 국가가 필요로 하는 정보라는 첫 문장과 이어져 국가 목적에 이바지한다가 맞음.","ignore(무시하다): 국가가 만든 분류 틀이 국가의 목적을 무시한다는 건 앞뒤가 안 맞음.","escape(벗어나다): 국가 목적에서 벗어나도록 틀을 고안한다는 말이라 첫 문장 needed by the state(국가가 필요로 하는)와 부딪침.","reveal(드러내다): 통계는 결정을 결정 같지 않게 보이게 하는 도구라서 목적을 드러낸다는 말과 맞지 않음."],"om":["이바지하다","무시하다","벗어나다","드러내다"],"en":"Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies.","ko":"매겨지는 가격이나 팔리는 상품 같은 현상은 존재하지만, 공식 통계의 수집, 집계, 정리를 뒷받침하는 범주와 분류 틀은 거시 경제 정책이나 사회 정책을 위한 국가의 목적에 이바지하도록 고안된다.","hl":["devised to serve the purposes of the state","for macroeconomic or for social policies"],"khl":["국가의 목적에 이바지하도록 고안된다","거시 경제 정책이나 사회 정책을 위한"],"blocks":[{"t":"tap","h":"글 한 줄 요약","q":"통계의 분류 칸은 누구를 위해 짜였나?","a":["국가다.","첫 문장: needed by the state(국가가 필요로 하는).","이 문장: the purposes of the state(국가의 목적).","끝 문장: state authority(국가의 권위).","undermine(약화시키다)을 넣으면 혼자 국가에 맞서는 통계가 된다."]},{"t":"p","h":"devised(고안된)라는 말","x":["devised(고안된)는 사람이 일부러 생각해 만들었다는 뜻이다.","분류 칸은 자연에 원래 있는 게 아니다.","목적을 갖고 짠 것이다. 그 목적이 국가의 목적이다."]}],"post":["serve(이바지하다) ↔ undermine(약화시키다)","분류 칸 = 국가 목적에 맞게 짠 것"]},{"slots":[["supporting","underlying","s"],["serve"],["create","establish","s"],["seeming"],["trust","distrust","a"]],"opts":["trust","fear","anger","resistance"],"or":["trust(신뢰): 국가 권위를 만들어 내는 기술이라 사람들이 권위를 믿게 만든다는 말이 맞음.","fear(두려움): 숫자로 결정을 부드럽게 보이게 하는 기술이라 두려움을 쌓는 것과는 방향이 다름.","anger(분노): 권위에 대한 분노를 쌓는 기술은 국가 권위를 세운다는 앞말과 반대임.","resistance(저항): 저항을 쌓으면 권위가 흔들려 create state authority(국가 권위를 만들어 내다)와 부딪침."],"om":["신뢰","두려움","분노","저항"],"en":"Theodore Porter described the use of statistics to create state authority: \"Quantification is a way of making decisions without seeming to decide\", characterising it as a \"social technology\" intended to build trust in authority.","ko":"시어도어 포터는 국가 권위를 만들어 내는 통계의 쓰임을 이렇게 묘사했다. \"수량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방법이다.\" 그리고 그것을 권위에 대한 신뢰를 쌓기 위한 '사회적 기술'이라고 규정했다.","hl":["build trust in authority","making decisions without seeming to decide"],"khl":["권위에 대한 신뢰","결정하는 것처럼 보이지 않으면서 결정을 내리는"],"blocks":[{"t":"p","h":"숫자는 왜 믿음을 주나","x":["\"내가 정했다\"고 하면 사람들은 따진다.","\"숫자가 그렇게 말한다\"고 하면 덜 따진다.","결정하는 사람은 뒤로 숨고 숫자가 앞에 선다.","그래서 사람들은 권위를 믿게 된다.","distrust(불신)를 넣으면 통계가 권위를 무너뜨리는 기술이 된다."]},{"t":"p","h":"함정","x":["underlying(밑바탕이 되는)은 supporting(뒷받침하는)과 같은 방향이다.","establish(세우다)는 create(만들어 내다) 자리에 들어가도 state authority(국가 권위)와 잘 어울린다."]}],"post":["trust(신뢰) ↔ distrust(불신)","숫자 뒤에 숨은 결정 = 권위에 대한 믿음"]}],"quiz":[{"w":"modern","m":"근대의, 현대의","it":[["contemporary","현대의","s"],["fragile","깨지기 쉬운","n"],["ancient","고대의","a"],["loyal","충실한","n"],["current","현재의","s"],["traditional","전통적인","a"],["generous","관대한","n"]]},{"w":"systematic","m":"체계적인","it":[["organized","체계적인, 조직적인","s"],["urgent","긴급한","n"],["haphazard","되는대로의","a"],["humble","겸손한","n"],["methodical","체계적인, 꼼꼼한","s"],["random","무작위의","a"],["noisy","시끄러운","n"]]},{"w":"exist","m":"존재하다","it":[["live","살다, 존재하다","s"],["sneeze","재채기하다","n"],["vanish","사라지다","a"],["decorate","장식하다","n"],["survive","살아남다, 존속하다","s"],["disappear","사라지다","a"],["borrow","빌리다","n"]]},{"w":"serve","m":"이바지하다, 돕다","it":[["assist","돕다","s"],["borrow","빌리다","n"],["hinder","방해하다","a"],["invite","초대하다","n"],["aid","돕다","s"],["obstruct","가로막다","a"],["predict","예측하다","n"]]},{"w":"trust","m":"신뢰","it":[["confidence","신뢰, 자신감","s"],["harvest","수확","n"],["distrust","불신","a"],["journey","여행","n"],["faith","믿음","s"],["suspicion","의심","a"],["ceiling","천장","n"]]}]}],"no":"31"},{"id":"2510g2-32","title":"어휘특훈 · 25년 10월 고2 32번","sub":"칸칸이 나뉜 몸 연구","tpl":"Just as an expert in the taste and colour of wine will {gain} much by being {aware} of the chemistry that {underlies} those qualities, so each perspective on the body can {potentially} {enhance} the others. And yet every scientific tool, from microscopes to mathematics, and every aspect of the body, from the brain to the microorganism, requires such {depth} of expertise that this tends not to happen: we tend to study the human body in {silos}, each community {sectioned} from the others by its own {specialised} vocabulary. Research communities may be {dedicated} to one type of scientific tool or a {specific} component of the body, such as one type of cell. How different types of cell {communicate} with one another becomes its own specialist topic. Even simple forms of life on Earth are now {rarely} studied as a {whole}, and the human body is {evidently} much more {complex}. As long ago as 1890, The Times newspaper commented that knowledge 'had already become too {vast} to be {manageable}'. Today, nobody is an expert in the whole of anything.","fn":["*microorganism: 미생물","*silo: (곡식) 저장탑, 서로 단절된 칸"],"mean":{"gain":"얻다","lose":"잃다","aware":"알고 있는, 의식하는","conscious":"의식하는, 알고 있는","ignorant":"모르는, 무지한","underlies":"동사 underlie(~의 바탕에 있다)의 3인칭 단수 현재형","lies behind":"동사 lie behind(~의 뒤에 있다, 바탕이 되다)의 3인칭 단수 현재형","potentially":"잠재적으로, 어쩌면","enhance":"향상시키다, 높이다","enrich":"풍부하게 하다","weaken":"약화시키다","depth":"깊이","shallowness":"얕음, 천박함","silos":"명사 silo(저장탑, 서로 단절된 칸)의 복수형","isolation":"고립, 분리","sectioned":"동사 section(나누다, 구획하다)의 과거분사형","separated":"동사 separate(분리하다)의 과거분사형","specialised":"전문화된, 전문적인 (미국식 철자 specialized)","everyday":"일상적인, 평범한","dedicated":"전념하는, 헌신하는","devoted":"헌신하는, 전념하는","indifferent":"무관심한","specific":"특정한, 구체적인","general":"일반적인, 전반적인","communicate":"소통하다","interact":"상호 작용하다","rarely":"드물게, 좀처럼 ~않는","seldom":"좀처럼 ~않는","frequently":"자주","w lowed subjects to gaze up at their leaders, creating a sense of {awe} and distance. Consider the Palace of Versailles: its Hall of Mirrors, lined with reflective surfaces, not only {magnified} the {grandeur} of the space but also placed the king at the center of a {dazzling} display, {reinforcing} his {absolute} authority. The use of glass in palaces wasn't merely {aesthetic}; it was {strategic}. Open sightlines allowed for better {surveillance} and control, ensuring the safety and security of the ruling family. Courtiers and visitors were {constantly} aware of being observed, contributing to an atmosphere of careful {obedience} and respect. The very architecture {dictated} social behavior, with glass acting as a silent enforcer of the power dynamic.","fn":["*subject: (군주국의) 백성","*Hall of Mirrors: (베르사유 궁전의) 거울의 방","*sightline: 시선, 시야","*courtier: 궁정의 신하","*enforcer: 집행자"],"mean":{"impress":"깊은 인상을 주다","amaze":"깜짝 놀라게 하다","intimidate":"겁을 주다, 위압하다","reassure":"안심시키다","permanence":"영원함, 영속성","durability":"내구성, 오래감","fragility":"부서지기 쉬움, 연약함","visibility":"잘 보임, 가시성","concealment":"숨김, 은폐","emphasizing":"동사 emphasize(강조하다)의 -ing형. ~을 강조하면서(분사구문)","highlighting":"동사 highlight(강조하다, 돋보이게 하다)의 -ing형","downplaying":"동사 downplay(축소하다, 대수롭지 않게 보이게 하다)의 -ing형","elevated":"높은, 고귀한","lowly":"낮은, 비천한","awe":"경외감","contempt":"경멸","magnified":"동사 magnify(확대하다, 키우다)의 과거형","amplified":"동사 amplify(증폭하다, 키우다)의 과거형","diminished":"동사 diminish(줄이다, 약화시키다)의 과거형","grandeur":"웅장함, 장엄함","splendor":"화려함, 장려함","dazzling":"눈부신","brilliant":"찬란한, 눈부신","reinforcing":"동사 reinforce(강화하다)의 -ing형. ~을 강화하면서(분사구문)","undermining":"동사 undermine(약화시키다, 흔들다)의 -ing형","absolute":"절대적인","supreme":"최고의, 지고한","aesthetic":"미적인, 미학적인","decorative":"장식적인","strategic":"전략적인","calculated":"계산된, 계획적인","accidental":"우연한","surveillance":"감시","monitoring":"동사 monitor(감시하다, 지켜보다)의 명사형(동명사), 감시","privacy":"사생활, 남의 눈에서 벗어난 상태","constantly":"끊임없이, 늘","rarely":"드물게, 좀처럼 ~않는","obedience":"복종","defiance":"반항, 저항","dictated":"동사 dictate(좌우하다, 지시하다)의 과거형","governed":"동사 govern(지배하다, 좌우하다)의 과거형"},"comp":[{"no":"33","slots":[["intimidate"],["visibility"],["strategic","calculated","s"],["surveillance","privacy","a"],["constantly"]],"opts":["surveillance","decoration","entertainment","freedom"],"or":["surveillance(감시): 열린 시야 덕에 잘 지켜볼 수 있어 control(통제)과 나란히 놓이고, 다음 문장의 being observed(관찰되는 것)와도 이어져 맞음.","decoration(장식): 바로 앞 문장이 유리는 단지 미적인 것이 아니라고 했으니 장식으로 되돌아가면 안 됨.","entertainment(오락): 오락은 통치 가문의 안전과 보안을 지키는 일과 상관없음.","freedom(자유): 늘 관찰되며 조심스럽게 복종했다는 뒤 내용과 정반대임."],"om":["감시","장식","오락","자유"],"en":"Open sightlines allowed for better surveillance and control, ensuring the safety and security of the ruling family. Courtiers and visitors were constantly aware of being observed","ko":"탁 트인 시야는 더 나은 감시와 통제를 가능하게 해서 통치 가문의 안전과 보안을 지켜 주었다. 신하들과 방문객들은 자신이 관찰되고 있다는 것을 늘 의식했고","hl":["better surveillance and control","aware of being observed"],"khl":["더 나은 감시와 통제","관찰되고 있다는 것"],"blocks":[{"t":"p","h":"짝꿍 단어 control(통제)","x":["surveillance(감시)는 control(통제)과 and(그리고)로 묶여 있다.","지켜보고, 그래서 다스린다.","privacy(사생활)를 넣으면 '더 나은 사생활과 통제'가 된다.","숨을 곳이 많아지는데 통제는 잘된다? 짝이 안 맞는다.","다음 문장도 being observed(관찰되는 것)가 늘 있었다고 못 박는다."]},{"t":"p","h":"그대로 둘 단어","x":["calculated(계산된)는 strategic(전략적인) 자리에 넣어도 '목적을 갖고 계획했다'는 뜻이 그대로다."]}],"post":["surveillance(감시) ↔ privacy(사생활)","열린 시야 = 늘 지켜보는 눈"]},{"no":"33","slots":[["awe"],["reinforcing"],["surveillance"],["constantly"],["obedience","defiance","a"]],"opts":["obedience","rebellion","confusion","laziness"],"or":["obedience(복종): and respect(그리고 존경)와 나란히 놓여, 늘 감시받는 사람들이 몸가짐을 조심하는 분위기라 맞음.","rebellion(반란): 감시받는 신하들이 조심스럽게 반란을 일으킨다는 건 respect(존경)와 부딪침.","confusion(혼란): 혼란스러운 분위기는 권력이 질서를 잡는다는 마지막 문장과 맞지 않음.","laziness(게으름): 늘 관찰된다고 느끼면 오히려 긴장하게 되므로 게으름과는 거리가 멂."],"om":["복종","반란","혼란","게으름"],"en":"Courtiers and visitors were constantly aware of being observed, contributing to an atmosphere of careful obedience and respect.","ko":"신하들과 방문객들은 자신이 관찰되고 있다는 것을 늘 의식했고, 이것은 조심스러운 복종과 존경의 분위기를 만드는 데 한몫했다.","hl":["careful obedience and respect","aware of being observed"],"khl":["조심스러운 복종과 존경","관찰되고 있다는 것"],"blocks":[{"t":"flow","h":"원인에서 결과로","x":["유리창, 거울: 어디서든 보임","신하·방문객: 늘 누가 본다고 느낌","결과: 조심스러운 복종과 존경","결론: 건축이 행동을 좌우함"],"at":2},{"t":"p","h":"defiance(반항)를 넣으면","x":["'조심스러운 반항과 존경'이 된다.","반항과 존경을 한 줄에 놓으면 서로 싸운다.","게다가 감시받는 사람은 반항이 아니라 몸을 사린다.","careful(조심스러운)이라는 꾸밈말도 복종과 어울린다."]}],"post":["obedience(복종) ↔ defiance(반항)","늘 보인다는 느낌 = 조심스러운 복종"]}],"compquiz":[{"w":"surveillance","m":"감시","it":[["monitoring","감시, 관찰","s"],["recipe","조리법","n"],["neglect","방치, 소홀","a"],["observation","관찰, 감시","s"],["thunder","천둥","n"],["inattention","부주의, 무관심","a"],["luggage","짐, 수하물","n"]]},{"w":"obedience","m":"복종","it":[["compliance","준수, 따름","s"],["defiance","반항","a"],["pottery","도자기","n"],["submission","굴복, 복종","s"],["rebellion","반란, 반항","a"],["vitamin","비타민","n"],["harvest","수확","n"]]}],"sets":[{"items":[{"slots":[["impress"],["intimidate","reassure","a"],["visibility"],["grandeur"],["absolute"]],"opts":["intimidate","entertain","educate","comfort"],"or":["intimidate(겁을 주다): 뒤에 나오는 awe(경외감), distance(거리감), obedience(복종)와 한 줄로 이어져 맞음.","entertain(즐겁게 하다): 궁전은 즐기는 무대가 아니라 권력을 보여 주는 무대라고 글 전체가 말함.","educate(가르치다): 백성을 가르치는 이야기는 글 어디에도 없음.","comfort(위로하다): 위로는 백성을 내려다보며 거리감을 만드는 궁전의 목적과 반대임."],"om":["겁을 주다","즐겁게 하다","가르치다","위로하다"],"en":"Historically, palaces weren't just homes; they were carefully constructed stages designed to impress and intimidate.","ko":"역사적으로 궁전은 그저 집이 아니었다. 그것은 깊은 인상을 주고 겁을 주도록 설계되어 공들여 지어진 무대였다.","hl":["designed to impress and intimidate","weren't just homes"],"khl":["깊은 인상을 주고 겁을 주도록","그저 집이 아니었다"],"blocks":[{"t":"flow","h":"이 단어가 서 있는 자리","x":["궁전 = 인상을 주고 겁을 주는 무대","돌은 힘, 유리는 보이게 함","창문: 왕은 내려다보고 백성은 올려다봄","거울의 방: 왕의 절대 권위 강화","유리 = 감시와 통제의 도구"],"at":0},{"t":"p","h":"reassure(안심시키다)가 틀린 이유","x":["궁전이 무대라면 관객은 백성이다.","글은 끝까지 백성이 왕을 올려다보며 경외감을 느끼고, 감시 속에 몸을 사린다고 한다.","백성을 안심시키는 무대가 아니라 기를 죽이는 무대다.","왕이 든든하니 안심하라는 뜻 아니냐고? 뒤에 나오는 distance(거리감), obedience(복종)는 안심이 아니라 긴장의 말이다.","첫 문장의 이 단어가 글 전체의 방향을 정한다."]}],"post":["intimidate(겁을 주다) ↔ reassure(안심시키다)","궁전 = 기를 죽이는 무대"]},{"slots":[["permanence","durability","s"],["visibility","concealment","a"],["emphasizing","highlighting","s"],["awe"],["aesthetic"]],"opts":["visibility","warmth","silence","softness"],"or":["visibility(잘 보임): 유리는 투명해서 안팎이 보이고, 바로 뒤 창문으로 내려다보고 올려다보는 이야기가 이어져 맞음.","warmth(따뜻함): 따뜻함은 뒤에 나오는 '보기, 보이기' 이야기와 연결되지 않음.","silence(고요함): 유리가 고요함을 준다는 말은 이 글의 내용과 상관없음.","softness(부드러움): 유리는 부드럽지도 않고, 돌의 힘에 맞먹는 강력한 무엇이 되지도 못함."],"om":["잘 보임","따뜻함","고요함","부드러움"],"en":"While stone symbolized permanence and strength, glass offered something equally powerful: visibility.","ko":"돌이 영원함과 힘을 상징했다면, 유리는 그만큼 강력한 것, 즉 잘 보이게 하는 힘을 제공했다.","hl":["glass offered something equally powerful: visibility","stone symbolized permanence and strength"],"khl":["유리는 그만큼 강력한 것","돌이 영원함과 힘을 상징했다면"],"blocks":[{"t":"pair","h":"돌과 유리 나란히","x":[["stone: permanence and strength","돌: 영원함과 힘"],["glass: visibility","유리: 잘 보임"]]},{"t":"p","h":"유리의 성질 떠올리기","x":["유리는 투명하다.","그래서 유리가 주는 힘은 '보이게 하는 힘'이다.","concealment(숨김)를 넣으면 유리가 숨겨 준다는 말이 된다.","바로 다음 문장은 창문으로 내려다보고 올려다보는 이야기다. 숨기는 게 아니라 보이게 하는 것."]},{"t":"p","h":"고치면 안 되는 두 곳","x":["durability(오래감)는 permanence(영원함)처럼 돌의 오래가는 성질을 말한다.","highlighting(돋보이게 하면서)은 emphasizing(강조하면서)과 같은 뜻이다."]}],"post":["visibility(잘 보임) ↔ concealment(숨김)","돌 = 힘, 유리 = 보이게 하는 힘"]},{"slots":[["impress","amaze","s"],["elevated","lowly","a"],["dazzling"],["strategic"],["obedience"]],"opts":["elevated","ordinary","temporary","shared"],"or":["elevated(높은): look down upon(내려다보다)이 보여 주는 '위에 있는 자리'와 맞음.","ordinary(평범한): 평범한 지위를 굳이 강조할 이유가 없고 내려다본다는 그림과도 안 맞음.","temporary(일시적인): 왕의 자리가 잠깐이라는 말은 절대 권위 이야기와 부딪침.","shared(공유된): 백성과 나눠 가진 지위라면 위아래가 나뉘는 거리감이 생기지 않음."],"om":["높은","평범한","일시적인","공유된"],"en":"The introduction of large windows in palaces allowed rulers to literally look down upon their subjects, emphasizing their elevated position.","ko":"궁전에 큰 창문이 도입되면서 통치자들은 말 그대로 백성들을 내려다볼 수 있었고, 이는 그들의 높은 지위를 강조했다.","hl":["emphasizing their elevated position","literally look down upon"],"khl":["높은 지위를 강조했다","말 그대로 백성들을 내려다볼"],"blocks":[{"t":"p","h":"literally(말 그대로)의 힘","x":["look down upon(내려다보다)에는 '깔보다'라는 뜻도 있다.","그런데 literally(말 그대로)가 붙었다.","창문 덕에 정말로 위에서 아래를 내려다본다는 말이다.","몸이 높은 곳에 있으니 지위도 높아 보인다.","lowly(낮은)를 넣으면 내려다보는 사람이 낮은 지위라는 엉뚱한 그림이 된다."]},{"t":"p","h":"그대로 둘 단어","x":["amaze(깜짝 놀라게 하다)는 impress(깊은 인상을 주다) 자리에 넣어도 궁전이 관객을 압도한다는 뜻이 그대로다."]}],"post":["elevated(높은) ↔ lowly(낮은)","말 그대로 내려다봄 = 높은 지위"]},{"slots":[["emphasizing"],["awe"],["magnified","diminished","a"],["reinforcing"],["constantly"]],"opts":["magnified","concealed","ignored","questioned"],"or":["magnified(키웠다): 거울이 공간을 반사해 더 넓고 웅장하게 보이게 하니 맞음.","concealed(숨겼다): 거울로 둘러싼 방이 웅장함을 숨긴다는 건 거울의 성질과 반대임.","ignored(무시했다): 방이 웅장함을 무시한다는 말은 뜻이 통하지 않음.","questioned(의문을 제기했다): 방이 웅장함에 의문을 품을 수는 없고, not only A but also B(A뿐 아니라 B도)의 같은 방향 흐름도 깨짐."],"om":["키웠다","숨겼다","무시했다","의문을 제기했다"],"en":"Consider the Palace of Versailles: its Hall of Mirrors, lined with reflective surfaces, not only magnified the grandeur of the space but also placed the king at the center of a dazzling display, reinforcing his absolute authority.","ko":"베르사유 궁전을 생각해 보라. 반사하는 표면이 늘어선 거울의 방은 공간의 웅장함을 키웠을 뿐 아니라 왕을 눈부신 장관의 한가운데에 두어 그의 절대 권위를 강화했다.","hl":["not only magnified the grandeur","reinforcing his absolute authority"],"khl":["웅장함을 키웠을 뿐 아니라","절대 권위를 강화했다"],"blocks":[{"t":"p","h":"not only A but also B(A뿐 아니라 B도)","x":["A: 공간의 웅장함을 키웠다.","B: 왕을 눈부신 장관 한가운데에 두었다.","이 틀은 A와 B를 같은 방향으로 쌓는다.","B가 왕을 띄워 주는 쪽이니 A도 띄워 주는 쪽이어야 한다.","diminished(줄였다)를 넣으면 A는 깎고 B는 띄우는 셈이라 틀이 무너진다."]},{"t":"tap","h":"질문 하나","q":"벽이 온통 거울인 방에 들어가면 어떻게 보일까?","a":["방이 끝없이 이어진 것처럼 넓어 보인다.","거울은 공간을 키워 보이게 한다.","그래서 magnified(키웠다)."]}],"post":["magnify(키우다) ↔ diminish(줄이다)","거울의 방 = 웅장함 확대 + 왕을 한가운데에"]},{"slots":[["absolute"],["aesthetic","decorative","s"],["strategic","accidental","a"],["surveillance","monitoring","s"],["dictated"]],"opts":["strategic","careless","random","harmless"],"or":["strategic(전략적인): 바로 뒤에 감시와 통제, 안전이라는 목적이 이어져 맞음.","careless(부주의한): 첫 문장이 carefully constructed(공들여 지어진)라고 했으니 정반대임.","random(무작위의): 목적 없이 아무렇게나 썼다는 말은 감시·통제라는 뚜렷한 목적과 안 맞음.","harmless(무해한): 유리는 사람들을 조심스럽게 복종시키는 힘을 가졌으니 그냥 해롭지 않은 것으로 끝나지 않음."],"om":["전략적인","부주의한","무작위의","무해한"],"en":"The use of glass in palaces wasn't merely aesthetic; it was strategic. Open sightlines allowed for better surveillance and control, ensuring the safety and security of the ruling family.","ko":"궁전에서 유리를 쓴 것은 단지 미적인 것이 아니었다. 그것은 전략적이었다. 탁 트인 시야는 더 나은 감시와 통제를 가능하게 해서 통치 가문의 안전과 보안을 지켜 주었다.","hl":["it was strategic","wasn't merely aesthetic"],"khl":["그것은 전략적이었다","단지 미적인 것이 아니었다"],"blocks":[{"t":"p","h":"not merely A; B (단지 A가 아니라 B다)","x":["A는 예쁘게 보이려는 목적이다.","B는 그보다 더 큰 목적이어야 한다.","다음 문장이 그 목적을 밝힌다. 감시, 통제, 안전.","accidental(우연한)을 넣으면 '우연이었다'가 된다.","우연은 목적이 아니다. 뒤 문장과 이어지지 않는다."]},{"t":"p","h":"첫 문장과 맞춰 보기","x":["첫 문장: carefully constructed(공들여 지어진).","공들여 설계한 것이 우연일 수는 없다."]},{"t":"p","h":"함정","x":["바뀐 단어가 셋이다.","decorative(장식적인)는 aesthetic(미적인)과, monitoring(감시)은 surveillance(감시)와 같은 뜻이라 고치면 안 된다."]}],"post":["strategic(전략적인) ↔ accidental(우연한)","유리 = 예쁨 + 감시·통제라는 계산"]}],"quiz":[{"w":"intimidate","m":"겁을 주다, 위압하다","it":[["frighten","겁먹게 하다","s"],["reassure","안심시키다","a"],["knit","뜨개질하다","n"],["daunt","기죽게 하다","s"],["encourage","용기를 북돋우다","a"],["sneeze","재채기하다","n"],["rinse","헹구다","n"]]},{"w":"visibility","m":"잘 보임, 가시성","it":[["conspicuousness","눈에 잘 띔","s"],["invisibility","보이지 않음","a"],["appetite","식욕","n"],["clarity","선명함, 잘 보임","s"],["obscurity","잘 안 보임, 흐릿함","a"],["pension","연금","n"],["laundry","빨래","n"]]},{"w":"elevated","m":"높은, 고귀한","it":[["lofty","높은, 고귀한","s"],["lowly","낮은, 비천한","a"],["juicy","즙이 많은","n"],["exalted","지위가 높은","s"],["humble","(지위가) 낮은, 보잘것없는","a"],["rusty","녹슨","n"],["chilly","쌀쌀한","n"]]},{"w":"magnify","m":"확대하다, 키우다","it":[["amplify","증폭하다, 키우다","s"],["diminish","줄이다","a"],["polish","닦다","n"],["enlarge","확대하다","s"],["reduce","줄이다","a"],["borrow","빌리다","n"],["kneel","무릎 꿇다","n"]]},{"w":"strategic","m":"전략적인","it":[["calculated","계산된, 계획적인","s"],["accidental","우연한","a"],["furry","털이 많은","n"],["deliberate","의도적인","s"],["unplanned","계획에 없던","a"],["sandy","모래가 많은","n"],["edible","먹을 수 있는","n"]]}]},{"items":[{"slots":[["intimidate"],["permanence","fragility","a"],["elevated"],["grandeur"],["strategic"]],"opts":["permanence","weakness","change","poverty"],"or":["permanence(영원함): 돌은 오래가는 재료라 strength(힘)와 함께 왕권이 흔들리지 않음을 상징해 맞음.","weakness(약함): 같은 and(그리고)로 묶인 strength(힘)와 정면으로 부딪침.","change(변화): 돌은 변하지 않는 재료의 대표라 변화를 상징하지 않음.","poverty(가난): 궁전을 짓는 돌이 가난을 상징한다는 건 왕의 힘 이야기와 반대임."],"om":["영원함","약함","변화","가난"],"en":"While stone symbolized permanence and strength, glass offered something equally powerful: visibility.","ko":"돌이 영원함과 힘을 상징했다면, 유리는 그만큼 강력한 것, 즉 잘 보이게 하는 힘을 제공했다.","hl":["permanence and strength","equally powerful"],"khl":["영원함과 힘","그만큼 강력한 것"],"blocks":[{"t":"p","h":"and(그리고)로 묶인 짝","x":["permanence(영원함)와 strength(힘)는 and(그리고)로 묶여 있다.","둘 다 돌의 좋은 성질이어야 한다.","fragility(연약함)를 넣으면 '연약함과 힘'이 된다.","한 재료가 약하면서 강하다는 말이 되어 서로 싸운다."]},{"t":"p","h":"equally powerful(그만큼 강력한)","x":["유리가 준 것은 돌만큼 강력한 것이라고 했다.","그러려면 돌도 강력한 무언가를 상징해야 한다.","오래가고 단단한 돌 = 무너지지 않는 왕권."]}],"post":["permanence(영원함) ↔ fragility(연약함)","돌 = 오래가고 단단한 왕권"]},{"slots":[["visibility"],["awe","contempt","a"],["grandeur","splendor","s"],["dazzling","brilliant","s"],["surveillance"]],"opts":["awe","pity","boredom","closeness"],"or":["awe(경외감): gaze up at(올려다보다)과 이어져 높은 사람을 우러러보며 두려워하는 마음이라 맞음.","pity(동정): 올려다보는 지도자를 불쌍히 여긴다는 건 궁전이 의도한 효과와 반대임.","boredom(지루함): 지루함은 높은 지위를 강조하는 궁전의 무대 효과와 상관없음.","closeness(친밀감): 바로 뒤 and distance(그리고 거리감)와 정면으로 부딪침."],"om":["경외감","동정","지루함","친밀감"],"en":"Conversely, it also allowed subjects to gaze up at their leaders, creating a sense of awe and distance.","ko":"반대로 그것은 백성들이 지도자를 올려다보게 해서, 경외감과 거리감을 만들어 냈다.","hl":["a sense of awe and distance","gaze up at their leaders"],"khl":["경외감과 거리감","지도자를 올려다보게"],"blocks":[{"t":"pair","h":"Conversely(반대로): 위에서 보기와 아래에서 보기","x":[["rulers ... look down upon their subjects","왕은 백성을 내려다본다"],["subjects ... gaze up at their leaders","백성은 지도자를 올려다본다"]]},{"t":"p","h":"올려다볼 때의 마음","x":["높은 곳의 왕을 올려다보면 우러러보면서도 조금 두렵다.","그 마음이 awe(경외감)다.","contempt(경멸)는 내려다보며 깔보는 마음이다.","올려다보는 사람이 품기엔 방향이 거꾸로다."]},{"t":"p","h":"함정","x":["splendor(화려함)는 grandeur(웅장함)와, brilliant(찬란한)는 dazzling(눈부신)과 같은 쪽이다.","둘 다 거울의 방이 왕을 빛나게 한다는 내용을 그대로 지킨다."]}],"post":["awe(경외감) ↔ contempt(경멸)","올려다보기 = 경외감 + 거리감"]},{"slots":[["impress"],["emphasizing","downplaying","a"],["magnified","amplified","s"],["aesthetic"],["constantly"]],"opts":["emphasizing","forgetting","doubting","hiding"],"or":["emphasizing(강조하면서): 위에서 내려다보는 모습이 왕이 높은 곳에 있다는 걸 더 드러내므로 맞음.","forgetting(잊으면서): 지위를 잊는다는 말은 내려다보는 장면과 이어지지 않음.","doubting(의심하면서): 왕이 자기 지위를 의심한다는 건 절대 권위 이야기와 맞지 않음.","hiding(숨기면서): 창문은 보이게 하는 장치인데 지위를 숨긴다는 건 정반대임."],"om":["강조하면서","잊으면서","의심하면서","숨기면서"],"en":"The introduction of large windows in palaces allowed rulers to literally look down upon their subjects, emphasizing their elevated position.","ko":"궁전에 큰 창문이 도입되면서 통치자들은 말 그대로 백성들을 내려다볼 수 있었고, 이는 그들의 높은 지위를 강조했다.","hl":["emphasizing their elevated position","look down upon their subjects"],"khl":["높은 지위를 강조했다","백성들을 내려다볼"],"blocks":[{"t":"tap","h":"질문 하나","q":"큰 창문 앞에서 아래를 내려다보는 왕. 이 장면이 왕의 지위를 키울까, 줄일까?","a":["키운다.","높은 곳에 선 모습 자체가 '나는 너희 위에 있다'는 메시지다.","그래서 emphasizing(강조하면서)이 맞다."]},{"t":"p","h":"downplaying(축소하면서)을 넣으면","x":["'높은 지위를 대수롭지 않게 보이게 했다'가 된다.","궁전은 위압하려고 만든 무대라고 첫 문장에서 말했다.","지위를 낮춰 보이게 하는 무대는 그 목적과 반대다.","amplified(키웠다)는 magnified(키웠다)와 같은 뜻이라 고치지 않는다."]}],"post":["emphasize(강조하다) ↔ downplay(축소하다)","내려다보는 왕 = 높은 지위 과시"]},{"slots":[["permanence"],["elevated"],["dazzling"],["reinforcing","undermining","a"],["obedience"]],"opts":["reinforcing","mocking","questioning","sharing"],"or":["reinforcing(강화하면서): 왕을 눈부신 장관의 한가운데에 둔 결과 권위가 더 단단해졌다는 말이라 맞음.","mocking(조롱하면서): 왕의 방이 왕의 권위를 비웃는다는 건 말이 안 됨.","questioning(의문을 제기하면서): 권위에 의문을 던진다면 궁전이 왕을 띄우는 무대라는 글 전체와 반대임.","sharing(나누면서): 한가운데에 왕 한 사람만 세운 것이라 권위를 남과 나누는 그림이 아님."],"om":["강화하면서","조롱하면서","의문을 제기하면서","나누면서"],"en":"Consider the Palace of Versailles: its Hall of Mirrors, lined with reflective surfaces, not only magnified the grandeur of the space but also placed the king at the center of a dazzling display, reinforcing his absolute authority.","ko":"베르사유 궁전을 생각해 보라. 반사하는 표면이 늘어선 거울의 방은 공간의 웅장함을 키웠을 뿐 아니라 왕을 눈부신 장관의 한가운데에 두어 그의 절대 권위를 강화했다.","hl":["reinforcing his absolute authority","at the center of a dazzling display"],"khl":["절대 권위를 강화했다","눈부신 장관의 한가운데"],"blocks":[{"t":"p","h":"원인과 결과","x":["원인: 왕을 눈부신 거울 장관의 한가운데에 세웠다.","결과: 모두의 눈이 왕에게 쏠린다.","권위는 더 단단해진다.","undermining(약화시키면서)을 넣으면 왕을 빛나게 했는데 권위는 흔들렸다는 엉뚱한 결과가 된다."]},{"t":"p","h":"absolute(절대적인)와도 짝","x":["absolute authority(절대 권위)는 누구도 넘볼 수 없는 권위다.","그런 권위를 흔든다는 말은 이 예시를 꺼낸 이유를 지운다.","베르사유는 유리가 권력을 키운 대표 사례로 나온 것이다."]}],"post":["reinforce(강화하다) ↔ undermine(약화시키다)","거울의 방 한가운데 왕 = 권위 강화"]},{"slots":[["absolute","supreme","s"],["strategic"],["constantly","rarely","a"],["obedience"],["dictated","governed","s"]],"opts":["constantly","never","briefly","barely"],"or":["constantly(늘): 탁 트인 시야 탓에 어디서든 보인다고 느껴 늘 조심하게 된다는 말이라 맞음.","never(결코 ~않는): 관찰된다는 걸 전혀 몰랐다면 조심스러운 복종 분위기가 생길 이유가 없음.","briefly(잠깐): 잠깐만 의식했다면 분위기 전체를 바꿀 만큼의 힘이 생기지 않음.","barely(거의 ~않는): 거의 의식하지 못했다면 감시가 행동을 좌우했다는 마지막 문장과 부딪침."],"om":["늘","결코 ~않는","잠깐","거의 ~않는"],"en":"Courtiers and visitors were constantly aware of being observed, contributing to an atmosphere of careful obedience and respect. The very architecture dictated social behavior, with glass acting as a silent enforcer of the power dynamic.","ko":"신하들과 방문객들은 자신이 관찰되고 있다는 것을 늘 의식했고, 이것은 조심스러운 복종과 존경의 분위기를 만드는 데 한몫했다. 건축 그 자체가 사회적 행동을 지배했고, 유리는 권력 관계의 조용한 집행자 역할을 했다.","hl":["constantly aware of being observed","a silent enforcer"],"khl":["관찰되고 있다는 것을 늘 의식했고","조용한 집행자"],"blocks":[{"t":"p","h":"조용한 집행자란?","x":["a silent enforcer(조용한 집행자)는 말없이 규칙을 지키게 하는 존재다.","유리는 아무 말도 안 한다.","그런데 늘 보인다는 느낌만으로 사람들이 알아서 조심한다.","그러려면 그 느낌이 '늘' 있어야 한다.","rarely(드물게)를 넣으면 유리가 집행자 노릇을 못 한다."]},{"t":"p","h":"그대로 둘 단어","x":["supreme(최고의)은 absolute(절대적인) 자리에, governed(지배했다)는 dictated(좌우했다) 자리에 들어가도 뜻이 같다.","이번엔 바뀐 단어가 셋인데 고칠 것은 하나뿐이다."]}],"post":["constantly(늘) ↔ rarely(드물게)","늘 보인다는 느낌 = 유리라는 조용한 집행자"]}],"quiz":[{"w":"permanence","m":"영원함, 영속성","it":[["durability","내구성, 오래감","s"],["impermanence","덧없음, 일시성","a"],["mustard","겨자","n"],["stability","안정성","s"],["transience","덧없음, 일시성","a"],["eyebrow","눈썹","n"],["traffic","교통","n"]]},{"w":"emphasize","m":"강조하다","it":[["stress","강조하다","s"],["downplay","축소하다, 대수롭지 않게 보이게 하다","a"],["sweep","쓸다","n"],["highlight","강조하다, 돋보이게 하다","s"],["understate","줄여서 말하다","a"],["swallow","삼키다","n"],["iron","다림질하다","n"]]},{"w":"awe","m":"경외감","it":[["reverence","숭배, 경외","s"],["contempt","경멸","a"],["chimney","굴뚝","n"],["wonder","경이, 경탄","s"],["disrespect","무례, 경시","a"],["blanket","담요","n"],["pebble","조약돌","n"]]},{"w":"reinforce","m":"강화하다","it":[["strengthen","강화하다","s"],["undermine","약화시키다","a"],["peel","껍질을 벗기다","n"],["bolster","강화하다, 북돋우다","s"],["weaken","약화시키다","a"],["whistle","휘파람 불다","n"],["sew","바느질하다","n"]]},{"w":"constantly","m":"끊임없이, 늘","it":[["continually","계속해서","s"],["rarely","드물게","a"],["upstairs","위층에서","n"],["perpetually","끊임없이","s"],["occasionally","가끔","a"],["abroad","해외에서","n"],["aloud","소리 내어","n"]]}]}],"no":"33"},{"id":"2510g2-35","title":"어휘특훈 · 25년 10월 고2 35번","sub":"측정 단위와 임의적인 선택","tpl":"{Consider} units of measure, one kind of {descriptive} device we are {familiar} with using in physics. Spatial distances can be given in terms of feet or meters or some other unit, and the physics will be the {same} regardless. We conclude from this that physics does not {prefer} one unit of length over any other, and we may {choose} any one we like for reasons of {convenience}. We further conclude that any feature {depending_on} that choice, such as the {particular} numerical value {assigned} to the spatial {separation} between two locations, is not out there in the world {apart_from} a choice of unit. Temperatures can {likewise} be given in terms of the Fahrenheit or Celsius or Kelvin scale, and nothing in the physics {changes} when we {switch} from one scale to another. We {conclude} that the choice of scale is an {arbitrary} choice in description, and that any feature that depends on that choice is scale-{dependent}.","fn":["*Fahrenheit: 화씨","*Celsius: 섭씨","*Kelvin: 켈빈(절대 온도 단위)"],"mean":{"Consider":"동사 consider(생각해 보다, 고려하다)의 원형. 문장 맨 앞에 와서 명령문","Ignore":"동사 ignore(무시하다)의 원형. 명령문","Examine":"동사 examine(살펴보다)의 원형. 명령문","descriptive":"서술하는, 묘사하는","natural":"자연의, 원래 있는","familiar":"익숙한 (be familiar with = ~에 익숙하다)","unfamiliar":"낯선, 익숙하지 않은","same":"같은","different":"다른","prefer":"선호하다 (prefer A over B = B보다 A를 선호하다)","favor":"선호하다, 편들다","choose":"고르다, 선택하다","select":"고르다, 선택하다","convenience":"편리, 편의","inconvenience":"불편","practicality":"실용성","depending on":"동사 depend(달려 있다)의 -ing형. depend on = ~에 달려 있다","unrelated to":"~와 관계없는","based on":"~에 근거한, ~에 기초한","particular":"특정한","universal":"보편적인, 어디에나 똑같이 통하는","specific":"특정한, 구체적인","assigned":"동사 assign(배정하다, 매기다)의 과거분사형. 앞의 value(값)를 꾸밈","given":"동사 give(주다)의 과거분사형","separation":"떨어져 있음, 간격","distance":"거리","apart from":"~와 따로, ~와 별개로","independently of":"~와 독립적으로, ~와 상관없이","likewise":"마찬가지로","conversely":"반대로","similarly":"비슷하게, 마찬가지로","changes":"동사 change(바뀌다)의 3인칭 단수 현재형","remains":"동사 remain(남다, 그대로 있다)의 3인칭 단수 현재형","alters":"동사 alter(바뀌다)의 3인칭 단수 현재형","switch":"바꾸다, 전환하다","shift":"옮겨 가다, 바꾸다","conclude":"결론 내리다","deny":"부인하다","arbitrary":"임의적인, 마음대로 정한","inevitable":"피할 수 없는","dependent":"의존하는 (scale-dependent = 척도에 의존하는)","independent":"독립적인, 의존하지 않는"},"comp":[{"no":"35","slots":[["Consider"],["descriptive","natural","a"],["familiar"],["same"],["convenience","practicality","s"]],"opts":["descriptive","physical","mechanical","material"],"or":["descriptive(서술하는): 단위는 세상을 설명하는 방식일 뿐이라는 결론 an arbitrary choice in description(서술상의 임의적인 선택)과 이어져 맞음.","physical(물리적인): 단위가 세상에 실제로 있는 물체라면 '세상에 따로 있지 않다'는 결론과 부딪침.","mechanical(기계적인): 단위는 기계 장치가 아니라 숫자를 붙이는 약속임.","material(물질적인): 미터나 섭씨는 만질 수 있는 물질이 아니라 사람이 정한 기준임."],"om":["서술하는, 묘사하는","물리적인","기계적인","물질적인"],"en":"Consider units of measure, one kind of descriptive device we are familiar with using in physics. … We conclude that the choice of scale is an arbitrary choice in description, and that any feature that depends on that choice is scale-dependent.","ko":"측정 단위를 생각해 보자. 그것은 우리가 물리학에서 익숙하게 사용하는 서술 도구의 한 종류이다. … 우리는 척도의 선택이 서술상의 임의적인 선택이며, 그 선택에 달린 특성은 무엇이든 척도에 의존한다고 결론 내린다.","hl":["descriptive device","an arbitrary choice in description"],"khl":["서술 도구","서술상의 임의적인 선택"],"blocks":[{"t":"pair","h":"첫 문장과 끝 문장이 같은 말","x":[["descriptive device","서술 도구 (첫 문장)"],["an arbitrary choice in description","서술상의 임의적인 선택 (끝 문장)"]]},{"t":"p","h":"natural(자연의)이 틀린 이유","x":["natural(자연의)은 사람이 만들지 않고 세상에 원래 있다는 뜻이다.","이 글의 결론은 정반대다.","단위로 붙인 숫자는 is not out there in the world(세상에 따로 있는 것이 아니다).","단위는 사람이 세상을 설명하려고 만든 도구다."]},{"t":"p","h":"그대로 두는 단어","x":["practicality(실용성)는 convenience(편의)와 같은 쪽이다.","for reasons of practicality(실용적인 이유로)도 자연스럽다."]}],"post":["descriptive(서술하는) ↔ natural(자연의, 원래 있는)","단위 = 사람이 만든 설명 도구"]},{"no":"35","slots":[["depending_on"],["particular","universal","a"],["assigned","given","s"],["separation"],["apart_from"]],"opts":["particular","constant","absolute","eternal"],"or":["particular(특정한): 고른 단위에 따라 그때그때 정해지는 숫자라 맞음.","constant(변함없는): 단위를 바꾸면 숫자도 바뀌니 변함없는 값이 아님.","absolute(절대적인): 선택에 달려 있다는 말과 절대적이라는 말은 함께 설 수 없음.","eternal(영원한): 단위만 바꿔도 달라지는 숫자를 영원하다고 할 수 없음."],"om":["특정한","변함없는","절대적인","영원한"],"en":"We further conclude that any feature depending on that choice, such as the particular numerical value assigned to the spatial separation between two locations, is not out there in the world apart from a choice of unit.","ko":"우리는 더 나아가, 그 선택에 달려 있는 특성, 예컨대 두 지점 사이의 공간적 거리에 매겨진 특정한 수치 같은 것은 단위 선택과 따로 떨어져 세상에 존재하는 것이 아니 단위 = 물리학의 서술 도구"]},{"slots":[["familiar"],["same","different","a"],["prefer","favor","s"],["choose","select","s"],["convenience"]],"opts":["same","altered","opposite","reversed"],"or":["same(같은): regardless(상관없이)와 짝을 이뤄 단위를 바꿔도 물리학은 그대로라는 뜻이 되어 맞음.","altered(바뀐): 단위만 바꿨는데 물리학이 바뀐다면 아무 단위나 골라도 된다는 다음 결론이 무너짐.","opposite(정반대의): 피트로 나타내든 미터로 나타내든 물리 법칙이 뒤집힐 리 없음.","reversed(뒤집힌): 단위 선택에 따라 물리학이 뒤집힌다면 단위를 편의로 고를 수 없음."],"om":["같은","바뀐","정반대의","뒤집힌"],"en":"Spatial distances can be given in terms of feet or meters or some other unit, and the physics will be the same regardless. We conclude from this that physics does not prefer one unit of length over any other, and we may choose any one we like for reasons of convenience.","ko":"공간상의 거리는 피트나 미터, 또는 다른 어떤 단위로도 나타낼 수 있으며, 그와 상관없이 물리학은 똑같을 것이다. 우리는 이로부터 물리학이 어떤 길이 단위를 다른 단위보다 선호하지 않으며, 편의상의 이유로 우리가 원하는 어떤 단위든 고를 수 있다고 결론 내린다.","hl":["the physics will be the same regardless","does not prefer one unit of length over any other"],"khl":["그와 상관없이 물리학은 똑같을 것이다","선호하지 않으며"],"blocks":[{"t":"pair","h":"관찰과 결론 나란히","x":[["the physics will be the same regardless","단위와 상관없이 물리학은 똑같다 (관찰)"],["physics does not prefer one unit of length over any other","물리학은 어느 단위도 편애하지 않는다 (결론)"]]},{"t":"p","h":"different(다른)를 넣고 다시 읽기","x":["\"단위와 상관없이 물리학은 달라질 것이다\"가 된다.","regardless(상관없이)와 different(다른)는 서로 부딪친다.","상관없다면서 달라진다는 말이니까.","물리학이 달라진다면 \"아무 단위나 골라도 된다\"는 결론도 나올 수 없다."]},{"t":"p","h":"그대로 둘 두 단어","x":["favor(선호하다)는 prefer(선호하다)와, select(고르다)는 choose(고르다)와 같은 뜻이다.","favor A over B(B보다 A를 더 좋아하다)도 prefer A over B(B보다 A를 선호하다)처럼 쓴다."]}],"post":["same(같은) ↔ different(다른)","피트든 미터든 물리학은 그대로"]},{"slots":[["Consider","Examine","s"],["descriptive"],["familiar","unfamiliar","a"],["same"],["prefer"]],"opts":["familiar","bored","impatient","displeased"],"or":["familiar(익숙한): be familiar with(~에 익숙하다)로, 누구나 써 본 feet(피트)·meters(미터) 같은 단위와 맞음.","bored(지루해하는): 단위 사용이 지루하다는 감정은 글의 논리와 아무 관계가 없음.","impatient(참을성 없는): 단위를 쓰는 데 짜증을 낸다는 말은 측정 단위를 소개하는 문장과 안 맞음.","displeased(불쾌해하는): 필자는 단위를 불평하지 않고, 익숙한 예로 꺼내 들 뿐임."],"om":["익숙한","지루해하는","참을성 없는","불쾌해하는"],"en":"Consider units of measure, one kind of descriptive device we are familiar with using in physics. Spatial distances can be given in terms of feet or meters or some other unit, and the physics will be the same regardless.","ko":"측정 단위를 생각해 보자. 그것은 우리가 물리학에서 익숙하게 사용하는 서술 도구의 한 종류이다. 공간상의 거리는 피트나 미터, 또는 다른 어떤 단위로도 나타낼 수 있으며, 그와 상관없이 물리학은 똑같을 것이다.","hl":["we are familiar with using in physics","feet or meters"],"khl":["익숙하게 사용하는","피트나 미터"],"blocks":[{"t":"p","h":"왜 하필 단위로 시작할까","x":["어려운 이야기를 하려면 쉬운 예부터 꺼내야 한다.","필자가 고른 예는 누구나 아는 피트, 미터, 섭씨다.","그래서 familiar(익숙한)가 들어가야 한다.","unfamiliar(낯선)를 넣으면 \"우리가 잘 모르는 도구\"가 된다.","미터를 모르는 사람은 없다."]},{"t":"tap","h":"질문 하나","q":"피트와 미터는 낯선 단위일까?","a":["아니다.","매일 쓰는 단위라서 예로 고른 것이다.","익숙한 예에서 출발해 낯선 결론으로 가는 것이 이 글의 전략이다."]},{"t":"p","h":"고치면 안 되는 단어","x":["Examine(살펴보다)은 Consider(생각해 보다)와 같은 방향이다.","둘 다 \"자세히 들여다보자\"로 글을 여는 말이다."]}],"post":["familiar(익숙한) ↔ unfamiliar(낯선)","익숙한 예(피트·미터)로 시작하는 글"]},{"slots":[["convenience"],["depending_on","unrelated to","a"],["particular"],["assigned"],["separation"]],"opts":["depending_on","separate_from","free_from","opposed_to"],"or":["depending on(~에 달려 있는): 거리의 숫자는 단위를 무엇으로 고르느냐에 따라 달라지니 맞음.","separate from(~와 분리된): 선택과 분리된 특성이라면 문장 끝 apart from(~와 따로)과 정면으로 부딪침.","free from(~에서 자유로운): 선택의 영향을 안 받는다는 말이라 '세상에 따로 있지 않다'는 결론과 모순됨.","opposed to(~에 반대하는): 특성이 선택에 반대한다는 말은 뜻이 통하지 않음."],"om":["~에 달려 있는","~와 분리된","~에서 자유로운","~에 반대하는"],"en":"We further conclude that any feature depending on that choice, such as the particular numerical value assigned to the spatial separation between two locations, is not out there in the world apart from a choice of unit.","ko":"우리는 더 나아가, 그 선택에 달려 있는 특성, 예컨대 두 지점 사이의 공간적 거리에 매겨진 특정한 수치 같은 것은 단위 선택과 따로 떨어져 세상에 존재하는 것이 아니라고 결론 내린다.","hl":["any feature depending on that choice","apart from a choice of unit"],"khl":["그 선택에 달려 있는 특성","단위 선택과 따로 떨어져"],"blocks":[{"t":"p","h":"숫자 예로 확인","x":["두 지점 사이 거리가 3미터라고 하자.","피트로 나타내면 약 10피트가 된다.","거리는 그대로인데 숫자만 3에서 10으로 바뀐다.","즉 숫자는 단위 선택에 달려 있다(depending on = ~에 달려 있는).","unrelated to(~와 관계없는)를 넣으면 숫자가 단위와 상관없다는 말이 되어 이 예와 정반대다."]},{"t":"p","h":"문장 끝과 맞물리기","x":["문장 끝은 apart from a choice of unit(단위 선택과 따로)이다.","\"선택과 따로 떨어져서는 세상에 없다\"는 말이다.","앞에서 선택에 달려 있다고 했으니 끝과 딱 맞물린다."]}],"post":["depend on(~에 달려 있다) ↔ unrelated to(~와 관계없는)","3미터 = 약 10피트, 숫자만 단위 따라 바뀜"]},{"slots":[["apart_from","independently of","s"],["likewise","conversely","a"],["changes","alters","s"],["switch"],["conclude"]],"opts":["likewise","instead","contrarily","inversely"],"or":["likewise(마찬가지로): 길이에서 본 일을 온도에서 똑같이 보여 주는 문장이라 맞음.","instead(대신에): 길이 이야기를 버리는 게 아니라 같은 원리를 온도로 한 번 더 확인하는 것임.","contrarily(반대로): 온도도 길이와 똑같이 '물리학은 그대로'라서 반대가 아님.","inversely(거꾸로): 길이 사례와 거꾸로 되는 점이 하나도 없음."],"om":["마찬가지로","대신에","반대로","거꾸로"],"en":"Temperatures can likewise be given in terms of the Fahrenheit or Celsius or Kelvin scale, and nothing in the physics changes when we switch from one scale to another.","ko":"온도도 마찬가지로 화씨, 섭씨, 켈빈 척도로 나타낼 수 있으며, 한 척도에서 다른 척도로 바꿔도 물리학의 어떤 것도 바뀌지 않는다.","hl":["can likewise be given","nothing in the physics changes"],"khl":["마찬가지로","물리학의 어떤 것도 바뀌지 않는다"],"blocks":[{"t":"pair","h":"두 사례 겹쳐 보기","x":[["Spatial distances ... feet or meters","길이: 피트 또는 미터"],["the physics will be the same regardless","물리학은 그대로"],["Temperatures ... Fahrenheit or Celsius or Kelvin","온도: 화씨·섭씨·켈빈"],["nothing in the physics changes","물리학은 하나도 안 바뀜"]]},{"t":"p","h":"conversely(반대로)가 틀린 이유","x":["conversely(반대로)는 앞과 반대되는 내용이 올 때 쓴다.","그런데 온도 사례는 길이 사례와 판박이다.","단위만 바뀌고 물리학은 그대로.","그래서 \"마찬가지로\"가 맞다."]},{"t":"p","h":"함정 두 개","x":["independently of(~와 독립적으로)는 apart from(~와 따로)과 같은 뜻이다.","alters(바뀌다)는 changes(바뀌다)와 같은 뜻이다.","둘 다 고치면 안 된다."]}],"post":["likewise(마찬가지로) ↔ conversely(반대로)","길이 사례 = 온도 사례, 판박이"]}],"quiz":[{"w":"consider","m":"생각해 보다, 고려하다","it":[["contemplate","숙고하다","s"],["melt","녹다","n"],["ignore","무시하다","a"],["weigh","따져 보다","s"],["sneeze","재채기하다","n"],["disregard","무시하다","a"],["knit","뜨개질하다","n"]]},{"w":"same","m":"같은","it":[["hollow","속이 빈","n"],["identical","동일한","s"],["different","다른","a"],["thirsty","목마른","n"],["matching","똑같은, 꼭 맞는","s"],["distinct","별개의, 다른","a"],["brave","용감한","n"]]},{"w":"familiar","m":"익숙한","it":[["acquainted","잘 아는, 익숙한","s"],["generous","관대한","n"],["unfamiliar","낯선","a"],["accustomed","익숙한","s"],["fragile","깨지기 쉬운","n"],["strange","낯선","a"],["punctual","시간을 잘 지키는","n"]]},{"w":"depend on","m":"~에 달려 있다, ~에 의존하다","it":[["hinge on","~에 달려 있다","s"],["give up","포기하다","n"],["rely on","~에 의존하다","s"],["put off","미루다","n"],["rest on","~에 달려 있다","s"],["count on","~에 의지하다","s"],["look after","돌보다","n"]]},{"w":"likewise","m":"마찬가지로","it":[["similarly","비슷하게","s"],["loudly","큰 소리로","n"],["conversely","반대로","a"],["equally","마찬가지로","s"],["sleepily","졸린 듯이","n"],["differently","다르게","a"],["abroad","해외에","n"]]}]},{"items":[{"slots":[["prefer"],["choose"],["convenience","inconvenience","a"],["depending_on"],["particular"]],"opts":["convenience","difficulty","discomfort","complexity"],"or":["convenience(편의): 물리학이 어느 단위도 편애하지 않으니 남는 기준은 쓰기 편한지뿐이라 맞음.","difficulty(어려움): 일부러 어려운 단위를 고른다는 건 이유가 될 수 없음.","discomfort(불편함): 불편해서 고른다는 말은 앞뒤가 안 맞음.","complexity(복잡함): 복잡해서 고른다는 건 단위를 고르는 상식과 반대임."],"om":["편리, 편의","어려움","불편함","복잡함"],"en":"We conclude from this that physics does not prefer one unit of length over any other, and we may choose any one we like for reasons of convenience.","ko":"우리는 이로부터 물리학이 어떤 길이 단위를 다른 단위보다 선호하지 않으며, 편의상의 이유로 우리가 원하는 어떤 단위든 고를 수 있다고 결론 내린다.","hl":["for reasons of convenience","we may choose any one we like"],"khl":["편의상의 이유로","우리가 원하는 어떤 단위든 고를 수 있다"],"blocks":[{"t":"tap","h":"질문 하나","q":"물리학이 어느 단위도 편애하지 않는다면, 단위는 무엇을 기준으로 고를까?","a":["쓰기 편한 것으로 고른다.","미국에선 피트, 한국에선 미터처럼.","정답 단위가 없으니 남는 기준은 편리함뿐이다."]},{"t":"p","h":"inconvenience(불편)를 넣으면","x":["\"불편하다는 이유로 고른다\"가 된다.","불편해서 고르는 사람은 없다.","we may choose any one we like(우리가 원하는 어떤 것이든 고를 수 있다)와도 어울리지 않는다.","좋아하는 걸 고르는데 그 이유가 불편함일 수는 없다."]}],"post":["convenience(편리) ↔ inconvenience(불편)","정답 단위 없음 → 편한 걸로 고르기"]},{"slots":[["separation","distance","s"],["apart_from"],["likewise","similarly","s"],["switch"],["arbitrary","inevitable","a"]],"opts":["arbitrary","essential","objective","unavoidable"],"or":["arbitrary(임의적인): 화씨·섭씨·켈빈 중 무엇을 골라도 물리학이 그대로이니 아무거나 골라도 되는 선택이라 맞음.","essential(필수적인): 특정 척도가 꼭 필요하다면 척도를 바꿔도 아무것도 안 변한다는 앞 문장과 모순됨.","objective(객관적인): 세상에 원래 정해진 척도가 있다는 말이 되어, 선택은 세상에 따로 있지 않다는 흐름과 반대임.","unavoidable(피할 수 없는): 다른 척도로 언제든 바꿀 수 있으니 피할 수 없는 선택이 아님."],"om":["임의적인","필수적인","객관적인","피할 수 없는"],"en":"Temperatures can likewise be given in terms of the Fahrenheit or Celsius or Kelvin scale, and nothing in the physics changes when we switch from one scale to another. We conclude that the choice of scale is an arbitrary choice in description, and that any feature that depends on that choice is scale-dependent.","ko":"온도도 마찬가지로 화씨, 섭씨, 켈빈 척도로 나타낼 수 있으며, 한 척도에서 다른 척도로 바꿔도 물리학의 어떤 것도 바뀌지 않는다. 우리는 척도의 선택이 서술상의 임의적인 선택이며, 그 선택에 달린 특성은 무엇이든 척도에 의존한다고 결론 내린다.","hl":["an arbitrary choice in description","when we switch from one scale to another"],"khl":["서술상의 임의적인 선택","한 척도에서 다른 척도로 바꿔도"],"blocks":[{"t":"flow","h":"결론이 나오는 순서","x":["척도를 바꿀 수 있다 (화씨 ↔ 섭씨)","바꿔도 물리학은 그대로","어느 척도도 특별하지 않다","그러니 척도 선택은 임의적이다"],"at":3},{"t":"p","h":"inevitable(피할 수 없는)이 틀린 이유","x":["inevitable(피할 수 없는)은 \"그것밖에 길이 없다\"는 뜻이다.","하지만 바로 앞 문장에서 척도를 마음대로 바꿨다.","switch from one scale to another(한 척도에서 다른 척도로 바꾸다)가 되는 선택은 피할 수 없는 선택이 아니다."]},{"t":"p","h":"그대로 두는 단어","x":["distance(거리)는 separation(떨어진 간격)과 같은 대상을 가리킨다.","similarly(비슷하게)는 likewise(마찬가지로)와 같은 연결어다."]}],"post":["arbitrary(임의적인) ↔ inevitable(피할 수 없는)","화씨든 섭씨든 아무거나 = 임의적 선택"]},{"slots":[["changes"],["switch","shift","s"],["conclude","deny","a"],["arbitrary"],["dependent"]],"opts":["conclude","doubt","dispute","question"],"or":["conclude(결론 내리다): 앞에서 We conclude(우리는 결론 내린다), We further conclude(우리는 더 나아가 결론 내린다)로 쌓아 온 흐름의 마지막 결론이라 맞음.","doubt(의심하다): 온도 사례가 길이 사례와 똑같이 끝났는데 갑자기 결론을 의심할 이유가 없음.","dispute(반박하다): 필자가 직접 보여 준 증거를 스스로 반박하는 꼴이 됨.","question(의문을 제기하다): 바로 앞 문장이 근거를 다 채웠으므로 의문을 던질 자리가 아님."],"om":["결론 내리다","의심하다","반박하다","의문을 제기하다"],"en":"We conclude from this that physics does not prefer one unit of length over any other … We further conclude that … We conclude that the choice of scale is an arbitrary choice in description","ko":"우리는 이로부터 물리학이 어떤 길이 단위를 다른 단위보다 선호하지 않는다고 결론 내린다 … 우리는 더 나아가 ~라고 결론 내린다 … 우리는 척도의 선택이 서술상의 임의적인 선택이라고 결론 내린다","hl":["We conclude that the choice of scale","We further conclude"],"khl":["우리는 척도의 선택이","더 나아가"],"blocks":[{"t":"pair","h":"같은 동사가 세 번","x":[["We conclude from this that ...","우리는 이로부터 ~라고 결론 내린다 (길이)"],["We further conclude that ...","우리는 더 나아가 ~라고 결론 내린다 (길이)"],["We conclude that the choice of scale ...","우리는 척도의 선택이 ~라고 결론 내린다 (온도)"]]},{"t":"p","h":"deny(부인하다)를 넣으면","x":["\"척도 선택이 임의적이라는 것을 부인한다\"가 된다.","하지만 바로 앞에서 척도를 바꿔도 물리학은 그대로라고 했다.","증거를 다 보여 주고 마지막에 뒤집는 글은 없다.","같은 틀의 세 번째 결론이니 conclude(결론 내리다)가 맞다."]},{"t":"p","h":"고치면 안 되는 단어","x":["shift(옮겨 가다)는 switch(바꾸다)와 같은 뜻으로 쓰였다.","shift from A to B(A에서 B로 옮겨 가다)도 자연스러운 표현이다."]}],"post":["conclude(결론 내리다) ↔ deny(부인하다)","길이 결론 두 번 + 온도 결론 한 번"]},{"slots":[["apart_from"],["likewise"],["changes","remains","a"],["switch"],["conclude"]],"opts":["changes","persists","survives","endures"],"or":["changes(바뀌다): nothing ... changes(아무것도 바뀌지 않는다)로 '물리학은 그대로'를 다시 말해 맞음.","persists(지속되다): '아무것도 지속되지 않는다'가 되어 척도만 바꿔도 물리학이 통째로 사라진다는 말이 됨.","survives(살아남다): '아무것도 살아남지 않는다'는 물리학이 무너진다는 뜻이라 길이 사례와 정반대임.","endures(견디다): '아무것도 버티지 못한다'가 되어 단위와 상관없이 물리학은 똑같다는 흐름과 반대임."],"om":["바뀌다","지속되다","살아남다","견디다"],"en":"Temperatures can likewise be given in terms of the Fahrenheit or Celsius or Kelvin scale, and nothing in the physics changes when we switch from one scale to another.","ko":"온도도 마찬가지로 화씨, 섭씨, 켈빈 척도로 나타낼 수 있으며, 한 척도에서 다른 척도로 바꿔도 물리학의 어떤 것도 바뀌지 않는다.","hl":["nothing in the physics changes","likewise"],"khl":["물리학의 어떤 것도 바뀌지 않는다","마찬가지로"],"blocks":[{"t":"p","h":"nothing(아무것도 ~않다)과 함께 읽기","x":["nothing ... changes(아무것도 바뀌지 않는다) = 전부 그대로.","nothing ... remains(아무것도 남지 않는다) = 전부 사라짐.","단어 하나로 뜻이 정반대가 된다.","앞의 the physics will be the same(물리학은 똑같을 것이다)과 맞는 쪽은 \"전부 그대로\"다."]},{"t":"p","h":"온도계 하나로 상상","x":["물이 끓는 온도는 섭씨로 100도, 화씨로 212도다.","숫자는 다르지만 물이 끓는 현상은 똑같다.","척도를 바꿔도 물리학은 그대로라는 것이 이 문장의 내용이다."]}],"post":["change(바뀌다) ↔ remain(그대로 남다)","섭씨 100도 = 화씨 212도, 끓는 물은 그대로"]},{"slots":[["depending_on","based on","s"],["particular","specific","s"],["apart_from"],["conclude"],["dependent","independent","a"]],"opts":["dependent","invariant","neutral","immune"],"or":["dependent(의존하는): scale-dependent(척도에 의존하는)는 앞의 depends on that choice(그 선택에 달려 있다)를 한 단어로 줄인 말이라 맞음.","invariant(불변의): scale-invariant(척도가 바뀌어도 변하지 않는)는 '선택에 달려 있다'와 정반대임.","neutral(중립의): 척도에 대해 중립이라는 말은 척도에 따라 숫자가 달라지는 특성과 안 맞음.","immune(영향을 받지 않는): 척도의 영향을 받지 않는다면 선택에 달려 있다는 앞말과 모순됨."],"om":["의존하는","불변의","중립의","영향을 받지 않는"],"en":"We conclude that the choice of scale is an arbitrary choice in description, and that any feature that depends on that choice is scale-dependent.","ko":"우리는 척도의 선택이 서술상의 임의적인 선택이며, 그 선택에 달린 특성은 무엇이든 척도에 의존한다고 결론 내린다.","hl":["is scale-dependent","any feature that depends on that choice"],"khl":["척도에 의존한다","그 선택에 달린 특성"],"blocks":[{"t":"p","h":"같은 말을 두 번","x":["depends on that choice(그 선택에 달려 있다).","is scale-dependent(척도에 의존한다).","앞말을 뒤에서 한 단어로 다시 말한 것이다.","independent(독립적인)를 넣으면 \"선택에 달린 것은 척도와 상관없다\"가 된다.","한 문장 안에서 스스로를 부정하는 셈이다."]},{"t":"tap","h":"한 줄 요약","q":"이 글의 결론을 한 줄로 줄이면?","a":["단위와 척도는 우리가 고르는 것이다.","그 선택에 따라 바뀌는 숫자는 세상에 원래 있는 것이 아니다."]},{"t":"p","h":"함정","x":["based on(~에 근거한)은 depending on(~에 달려 있는)과 같은 방향이다.","specific(특정한)은 particular(특정한)와 뜻이 같다.","둘을 고쳤다면 철자만 외운 것."]}],"post":["dependent(의존하는) ↔ independent(독립적인)","선택에 달린 것 = 척도에 의존하는 것"]}],"quiz":[{"w":"convenience","m":"편리, 편의","it":[["ease","쉬움, 편함","s"],["harvest","수확","n"],["inconvenience","불편","a"],["usefulness","유용성","s"],["courage","용기","n"],["difficulty","어려움","a"],["envelope","봉투","n"]]},{"w":"arbitrary","m":"임의적인","it":[["random","무작위의","s"],["wooden","나무로 된","n"],["rational","합리적인","a"],["subjective","주관적인","s"],["humid","습한","n"],["objective","객관적인","a"],["elderly","나이 든","n"]]},{"w":"conclude","m":"결론 내리다","it":[["deduce","추론하다","s"],["polish","윤을 내다","n"],["infer","추론하다","s"],["whistle","휘파람 불다","n"],["judge","판단하다","s"],["gather","(들은 것으로) 짐작하다","s"],["decorate","장식하다","n"]]},{"w":"change","m":"바뀌다, 변하다","it":[["vary","달라지다","s"],["bake","굽다","n"],["remain","그대로 남다","a"],["alter","바뀌다","s"],["yawn","하품하다","n"],["stay","그대로 있다","a"],["pray","기도하다","n"]]},{"w":"dependent","m":"의존하는, ~에 달린","it":[["reliant","의존하는","s"],["bitter","쓴","n"],["independent","독립적인","a"],["contingent","~에 달려 있는","s"],["rural","시골의","n"],["autonomous","자율적인","a"],["sticky","끈적끈적한","n"]]}]}],"no":"35"},{"id":"2510g2-36","title":"어휘특훈 · 25년 10월 고2 36번","sub":"소금이 바다 생물의 물을 움직이는 원리","tpl":"Even though sea creatures live in it, they still need to {take_in} water for their bodies to {function} {properly}. They just need to {get_rid_of} any {extra} salt it might bring with it. Salt {absorbs} water like a sponge. If you put a {tiny} mountain of salt on a small plate, then add enough water to the side, making sure an edge {touches} the salt, the salt will absorb the water. Now you have a pile of {wet} salt. Notice that it has {increased} in size. The same {principle} {applies} to sea creatures. If the body fluids in a sea animal are {saltier} than the seawater it lives in, then the extra salt in the creature's body will absorb seawater. This can cause them to {swell_up}. On the other hand, if the amount of salt in the seawater is {higher} than the amount of salt in the body fluids of a sea animal, the extra salt in the water will {draw} fluids out of the creature's body, causing it to {dehydrate} and {shrink}.","fn":["*body fluid: 체액"],"mean":{"take in":"섭취하다, 받아들이다","expel":"내보내다, 배출하다","consume":"섭취하다, 소비하다","function":"기능하다, 작동하다","work":"작동하다
