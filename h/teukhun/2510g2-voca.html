<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;

  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}

.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}

.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}

.setlist{display:flex;flex-direction:column;gap:10px}

.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}

.tile.done small{color:var(--accent)}

.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}

.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}

.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>

{fresh}, wet swab in salt, and {gently} touch {various} spots on your tongue, recording where your taste seems strongest. Then, gargle with water to {thoroughly} clean your tongue, use a swab coated with sugar on the {same} spots, and record those results. Gargle again, and then swab with lemon juice. After a {final} gargle, try coffee. Compare your reactions with your friends'. Your taste pattern may {reveal} more than just taste preferences. Recent studies {suggest} links between taster status and behavioral disorders. For example, \"non-tasters\" tend to have a {higher} incidence of alcoholism, perhaps because liquor seems less bitter to them. {Conversely}, \"super-tasters\" may {avoid} {nutritious} but {mildly} bitter foods such as broccoli, thus {depriving} themselves of a {balanced} diet. So, although taste is not nearly as {glamorous} as vision, hearing, or even touch, it makes sense for you to pay {closer} attention to it because chemistry, at least in your mouth, could be {destiny}.","fn":["*swab: 면봉; 면봉으로 바르다","*gargle: 입을 헹구다; 입 헹구기","*taster status: 미각 유형(맛을 느끼는 정도에 따른 구분)","*behavioral disorder: 행동 장애","*incidence: 발생률","*alcoholism: 알코올 중독"],"mean":{"fresh":"새로운, 깨끗한","new":"새, 새로운","used":"사용한, 쓰던","gently":"부드럽게, 살살","lightly":"가볍게, 살짝","various":"다양한, 여러","different":"서로 다른, 여러","thoroughly":"철저히, 완전히","completely":"완전히","partially":"부분적으로","same":"같은","identical":"동일한","final":"마지막의","first":"첫 번째의","reveal":"드러내다","show":"보여 주다","conceal":"숨기다","suggest":"시사하다, 암시하다","disprove":"반증하다, 틀렸음을 증명하다","higher":"형용사 high(높은)의 비교급, 더 높은","greater":"형용사 great(큰)의 비교급, 더 큰","lower":"형용사 low(낮은)의 비교급, 더 낮은","Conversely":"반대로","In contrast":"대조적으로","Similarly":"마찬가지로","avoid":"피하다","shun":"피하다, 멀리하다","favor":"선호하다, 좋아하다","nutritious":"영양가 있는","unhealthy":"건강에 해로운","mildly":"약하게, 약간","slightly":"약간","depriving":"동사 deprive(빼앗다)의 -ing형. 분사구문(deprive A of B = A에게서 B를 빼앗다)","robbing":"동사 rob(빼앗다)의 -ing형. 분사구문(rob A of B = A에게서 B를 빼앗다)","balanced":"균형 잡힌","poor":"부실한, 형편없는","glamorous":"화려한, 매력적인","dull":"따분한, 재미없는","closer":"형용사 close(세심한, 면밀한)의 비교급, 더 세심한","less":"형용사 little(적은)의 비교급, 더 적은","destiny":"운명","fate":"운명"},"comp":[{"no":"21","slots":[["thoroughly","completely","s"],["suggest"],["higher"],["closer","less","a"],["destiny"]],"opts":["closer","lighter","looser","poorer"],"or":["closer(더 세심한): 미각이 운명을 좌우할 수 있다는 이유와 이어져 더 신경 쓰라는 말이 맞음.","lighter(더 가벼운): 가볍게 보라는 건 because(왜냐하면) 뒤의 '운명이 될 수 있다'와 맞지 않음.","looser(더 느슨한): 느슨하게 보라는 말은 실험까지 시킨 글 전체와 반대임.","poorer(더 부족한): 주의를 덜 기울이라는 뜻이 되어 글의 결론을 뒤집음."],"om":["더 세심한","더 가벼운","더 느슨한","더 부족한"],"en":"So, although taste is not nearly as glamorous as vision, hearing, or even touch, it makes sense for you to pay closer attention to it because chemistry, at least in your mouth, could be destiny.","ko":"그러니 미각이 시각, 청각, 심지어 촉각만큼 화려하지는 않더라도, 미각에 더 세심한 주의를 기울이는 것이 합리적이다. 적어도 입안에서는 화학 작용이 운명이 될 수 있기 때문이다.","hl":["pay closer attention to it","could be destiny"],"khl":["더 세심한 주의를 기울이는","운명이 될 수 있기"],"blocks":[{"t":"tap","h":"글 전체를 한 줄로","q":"이 글이 결국 독자에게 시키는 일은?","a":["미각을 그냥 넘기지 말고 직접 실험해 보라는 것.","입안의 화학 작용이 건강과 행동을 바꿀 수 있기 때문이다.","그래서 closer attention(더 세심한 주의)이다."]},{"t":"p","h":"less(더 적은)를 넣으면","x":["\"미각에 주의를 덜 기울이는 것이 합리적이다\"가 된다.","그런데 이유는 '미각이 운명이 될 수 있어서'다.","운명을 바꿀 수 있는 것에 관심을 끄라는 말은 앞뒤가 안 맞는다.","completely(완전히)는 thoroughly(철저히) 자리에 넣어도 혀를 싹 씻는다는 뜻 그대로다."]}],"post":["close(세심한) ↔ less(더 적은)","입안의 화학 작용 = 운명"]},{"no":"21","slots":[["fresh"],["various"],["Conversely"],["avoid","favor","a"],["balanced"]],"opts":["avoid","enjoy","crave","prefer"],"or":["avoid(피하다): 쓴맛에 예민한 사람이 쓴 음식을 멀리해서 식단이 무너진다는 결과와 맞음.","enjoy(즐기다): 브로콜리를 즐긴다면 균형 잡힌 식단을 놓칠 이유가 없음.","crave(몹시 원하다): 쓴맛에 예민한 사람이 쓴 음식을 갈망한다는 건 앞뒤가 안 맞음.","prefer(선호하다): 영양가 있는 음식을 좋아하면 식단은 오히려 좋아짐."],"om":["피하다","즐기다","몹시 원하다","선호하다"],"en":"Conversely, \"super-tasters\" may avoid nutritious but mildly bitter foods such as broccoli, thus depriving themselves of a balanced diet.","ko":"반대로 '초미각자'는 브로콜리처럼 영양가 있지만 약간 쓴 음식을 피해서, 균형 잡힌 식단을 스스로 놓칠 수 있다.","hl":["may avoid nutritious but mildly bitter foods","thus depriving themselves"],"khl":["약간 쓴 음식을 피해서","스스로 놓칠"],"blocks":[{"t":"flow","h":"초미각자에게 일어나는 일","x":["쓴맛을 남보다 강하게 느낀다","약간 쓴 브로콜리도 피한다","몸에 좋은 채소를 못 먹는다","균형 잡힌 식단을 놓친다"],"at":1},{"t":"p","h":"favor(선호하다)를 넣으면","x":["\"영양가 있는 채소를 좋아해서 균형 잡힌 식단을 놓친다\"가 된다.","좋은 음식을 즐겨 먹는데 식단이 무너질 수는 없다.","thus(그 결과) 뒤에 손해가 오려면 그 음식을 피해야 한다."]}],"post":["avoid(피하다) ↔ favor(선호하다)","초미각자 = 약한 쓴맛도 피함"]}],"compquiz":[{"w":"close","m":"세심한, 면밀한","it":[["careful","신중한, 세심한","s"],["cheerful","쾌활한","n"],["careless","부주의한","a"],["detailed","상세한, 꼼꼼한","s"],["juicy","즙이 많은","n"],["superficial","피상적인","a"],["tiny","아주 작은","n"]]},{"w":"avoid","m":"피하다","it":[["shun","피하다, 멀리하다","s"],["measure","재다","n"],["seek","찾다, 추구하다","a"],["evade","피하다","s"],["whistle","휘파람 불다","n"],["confront","맞서다","a"],["polish","닦다","n"]]}],"sets":[{"items":[{"slots":[["fresh","used","a"],["same"],["reveal"],["avoid"],["destiny"]],"opts":["fresh","dirty","dry","broken"],"or":["fresh(새로운): 맛이 섞이지 않게 깨끗한 새 면봉으로 시작해야 실험 결과를 믿을 수 있어 맞음.","dirty(더러운): 더러운 면봉에는 다른 것이 묻어 있어 소금 맛만 재는 실험이 망가짐.","dry(마른): 바로 뒤 wet(젖은)과 나란히 놓여 '마르고 젖은 면봉'이 되어 말이 안 됨.","broken(부러진): 부러진 면봉으로는 혀의 여러 부위에 살살 댈 수가 없음."],"om":["새로운, 깨끗한","더러운","마른","부러진"],"en":"Coat a fresh, wet swab in salt, and gently touch various spots on your tongue, recording where your taste seems strongest. Then, gargle with water to thoroughly clean your tongue, use a swab coated with sugar on the same spots, and record those results.","ko":"새 젖은 면봉에 소금을 묻혀 혀의 여러 부위에 살살 대 보고, 맛이 가장 강하게 느껴지는 곳을 기록하라. 그다음 물로 입을 헹궈 혀를 깨끗이 씻어 내고, 설탕을 묻힌 면봉을 같은 부위에 대 본 뒤 그 결과를 기록하라.","hl":["a fresh, wet swab","to thoroughly clean your tongue"],"khl":["새 젖은 면봉","혀를 깨끗이 씻어 내고"],"blocks":[{"t":"flow","h":"실험 순서","x":["소금: 새 면봉으로 혀 여러 곳에 대 보기","헹구기","설탕: 같은 자리에 대 보기","헹구기","레몬즙 → 헹구기 → 커피","친구들과 비교"],"at":0},{"t":"p","h":"used(사용한)를 넣으면","x":["\"이미 쓴 젖은 면봉에 소금을 묻혀라\"가 된다.","그 면봉에는 다른 맛이 남아 있을 수 있다.","이 실험은 맛이 바뀔 때마다 입을 헹구게 할 만큼 맛이 :["반대로","마찬가지로","그러므로","게다가"],"en":"For example, \"non-tasters\" tend to have a higher incidence of alcoholism, perhaps because liquor seems less bitter to them. Conversely, \"super-tasters\" may avoid nutritious but mildly bitter foods such as broccoli, thus depriving themselves of a balanced diet.","ko":"예를 들어 '미각 둔감자'는 알코올 중독 발생률이 더 높은 경향이 있는데, 아마 술이 그들에게 덜 쓰게 느껴지기 때문일 것이다. 반대로 '초미각자'는 브로콜리처럼 영양가 있지만 약간 쓴 음식을 피해서, 균형 잡힌 식단을 스스로 놓칠 수 있다.","hl":["Conversely, \"super-tasters\"","less bitter"],"khl":["반대로 '초미각자'","덜 쓰게"],"blocks":[{"t":"pair","h":"두 집단 맞세우기","x":[["\"non-tasters\" … less bitter","미각 둔감자: 쓴맛을 덜 느껴 술을 많이 마심"],["\"super-tasters\" … mildly bitter foods","초미각자: 약한 쓴맛도 싫어 채소를 피함"]]},{"t":"p","h":"Similarly(마찬가지로)가 안 되는 이유","x":["한쪽은 쓴맛을 너무 못 느낀다.","다른 쪽은 쓴맛을 너무 잘 느낀다.","방향이 정반대인 두 집단이라 Similarly(마찬가지로)로 묶을 수 없다.","둘 다 문제를 겪는다는 점만 같을 뿐, 이유는 거꾸로다."]},{"t":"p","h":"함정","x":["shun(피하다)은 avoid(피하다)와, robbing(빼앗기)은 depriving(빼앗기)과 같은 뜻이다.","rob A of B(A에게서 B를 빼앗다)는 deprive A of B(A에게서 B를 빼앗다)와 모양까지 같다."]}],"post":["conversely(반대로) ↔ similarly(마찬가지로)","둔감자 = 술 / 초미각자 = 채소 회피"]}],"quiz":[{"w":"fresh","m":"새로운, 깨끗한","it":[["new","새로운","s"],["loud","시끄러운","n"],["used","사용한, 쓰던","a"],["unused","쓰지 않은","s"],["brave","용감한","n"],["stale","신선하지 않은, 묵은","a"],["rural","시골의","n"]]},{"w":"thoroughly","m":"철저히, 완전히","it":[["completely","완전히","s"],["loudly","큰 소리로","n"],["partially","부분적으로","a"],["fully","완전히, 충분히","s"],["kindly","친절하게","n"],["superficially","피상적으로, 대충","a"],["secretly","몰래","n"]]},{"w":"reveal","m":"드러내다","it":[["disclose","밝히다, 드러내다","s"],["borrow","빌리다","n"],["conceal","숨기다","a"],["expose","드러내다","s"],["repair","수리하다","n"],["hide","숨기다","a"],["invite","초대하다","n"]]},{"w":"high","m":"높은","it":[["elevated","높은, 높아진","s"],["wooden","나무로 된","n"],["low","낮은","a"],["great","큰, 많은","s"],["polite","공손한","n"],["small","작은, 적은","a"],["sour","신","n"]]},{"w":"conversely","m":"반대로","it":[["on the other hand","반면에","s"],["suddenly","갑자기","n"],["similarly","마찬가지로","a"],["i )이 오면 그 주장을 받쳐 주는 사례가 나온다.","사례: 미각 둔감자는 알코올 중독률이 더 높다.","미각과 행동 사이에 연결이 있다는 증거다.","disprove(반증하다)를 넣으면 연결이 없다고 해 놓고 연결의 예를 드는 꼴이 된다."]},{"t":"p","h":"그대로 둘 두 단어","x":["new(새)는 fresh(새로운) 자리에서 쓰지 않은 면봉이라는 뜻을 그대로 낸다.","show(보여 주다)는 reveal(드러내다)처럼 미각 패턴이 무언가를 알려 준다는 뜻이다."]}],"post":["suggest(시사하다) ↔ disprove(반증하다)","미각 유형과 행동 장애, 연결 있음"]},{"slots":[["higher"],["Conversely","In contrast","s"],["nutritious","unhealthy","a"],["balanced"],["glamorous"]],"opts":["nutritious","harmful","fatty","toxic"],"or":["nutritious(영양가 있는): 그런 음식을 피해서 균형 잡힌 식단을 놓친다는 결과와 맞음.","harmful(해로운): 해로운 음식을 피하는 건 손해가 아니라 이득이라 '식단을 놓친다'와 반대임.","fatty(기름진): 브로콜리는 기름진 음식이 아니고, 기름진 음식을 피해도 식단이 무너지지 않음.","toxic(독성이 있는): 브로콜리를 독성 음식이라 부를 수 없고, 독을 피하는 건 당연한 일임."],"om":["영양가 있는","해로운","기름진","독성이 있는"],"en":"Conversely, \"super-tasters\" may avoid nutritious but mildly bitter foods such as broccoli, thus depriving themselves of a balanced diet.","ko":"반대로 '초미각자'는 브로콜리처럼 영양가 있지만 약간 쓴 음식을 피해서, 균형 잡힌 식단을 스스로 놓칠 수 있다.","hl":["nutritious but mildly bitter foods","depriving themselves of a balanced diet"],"khl":["영양가 있지만 약간 쓴 음식","균형 잡힌 식단을 스스로 놓칠"],"blocks":[{"t":"p","h":"but(하지만)이 묶는 두 성질","x":["nutritious but mildly bitter(영양가 있지만 약간 쓴)는 좋은 점과 아쉬운 점을 함께 말한다.","좋은 음식인데 맛이 좀 써서 피한다는 것이 문제의 핵심이다.","unhealthy(건강에 해로운)를 넣으면 \"해로운데 약간 쓴 음식\"이 된다.","그런 음식을 피하는 건 문제가 아니다."]},{"t":"p","h":"결과 쪽에서 확인","x":["thus(그 결과) 뒤에 균형 잡힌 식단을 놓친다는 손해가 나온다.","손해가 되려면 피한 음식이 몸에 좋은 것이어야 한다.","In contrast(대조적으로)는 Conversely(반대로) 자리에 그대로 둬도 된다."]}],"post":["nutritious(영양가 있는) ↔ unhealthy(건강에 해로운)","초미각자 = 몸에 좋은 브로콜리도 써서 피함"]},{"slots":[["various"],["final"],["reveal"],["depriving"],["glamorous","dull","a"]],"opts":["glamorous","boring","plain","ordinary"],"or":["glamorous(화려한): 시각·청각보다 주목을 덜 받는 미각이지만 그래도 신경 쓰라는 양보 흐름과 맞음.","boring(지루한): '시각만큼 지루하진 않지만'이 되어 미각의 약점이 아니라 장점을 말하게 되므로 although(비록 ~지만)의 흐름이 깨짐.","plain(평범한): 미각이 시각만큼 평범하지 않다는 말은 미각을 칭찬하는 셈이라 뒤의 '그래도'와 안 맞음.","ordinary(보통의): '시각만큼 보통이 아니다'는 미각을 높이는 말이라 although(비록 ~지만) 뒤에 올 iment, even if it is most likely to prove {fruitless}. You never know until you try.","fn":["*attribute: 특성, 속성","*methodology: 방법론","*hypothesis: 가설","*astronomer: 천문학자"],"mean":{"testify to":"~을 입증하다, ~의 증거가 되다","attest to":"~을 증명하다, ~의 증거가 되다","run counter to":"~에 반대되다, ~와 어긋나다","embrace":"받아들임, 포용","acceptance":"받아들임, 수용","ignorance":"무지, 모름","certainty":"확실함, 확신","worst":"가장 나쁜 (형용사 bad(나쁜)의 최상급)","best":"가장 좋은 (형용사 good(좋은)의 최상급)","suppose":"짐작하다, 가정하다","presume":"추정하다, 짐작하다","bothering":"동사 bother(굳이 ~하다, 애써 ~하다)의 -ing형. 전치사 without(~ 없이) 뒤의 동명사","rise":"등장, 부상","emergence":"등장, 출현","decline":"쇠퇴, 하락","coincided":"동사 coincide(동시에 일어나다)의 과거형","clashed":"동사 clash(충돌하다)의 과거형","liberation":"해방, 풀려남","suppression":"억압, 억누름","curiosity":"호기심","indifference":"무관심","valuable":"가치 있는","worthwhile":"가치 있는, 할 만한","worthless":"가치 없는","questionable":"의심스러운, 문제가 있는","dubious":"의심스러운, 미심쩍은","praiseworthy":"칭찬할 만한","assumed":"동사 assume(~라고 여기다, 가정하다)의 과거분사형. is assumed = 여겨진다(수동태)","believed":"동사 believe(믿다)의 과거분사형. is believed = 믿어진다(수동태)","conduct":"(실험·조사를) 하다, 실시하다","perform":"수행하다, 하다","abandon":"버리다, 그만두다","simply":"그저, 단순히","purely":"순전히, 오로지","once in a while":"가끔, 이따금","occasionally":"가끔, 때때로","crazy":"엉뚱한, 말도 안 되는","wild":"엉뚱한, 터무니없는","predictable":"예측할 수 있는, 뻔한","fruitless":"성과 없는, 헛된","rewarding":"보람 있는, 성과가 있는"},"comp":[{"no":"22","slots":[["ignorance"],["rise","decline","a"],["liberation"],["curiosity"],["conduct"]],"opts":["rise","collapse","absence","end"],"or":["rise(등장): 호기심이 풀려난 시기에 실험 철학이 함께 일어섰다는 흐름이라 맞음.","collapse(붕괴): 실험 철학이 무너졌다면 오늘날 실험 과학 이야기로 이어질 수 없음.","absence(없음): 실험 철학이 없었다면 그 시기에 무엇이 함께 일어났다고 말할 수 없음.","end(끝): 실험 철학이 끝났다는 말은 뒤의 experimental science today(오늘날의 실험 과학)와 부딪침."],"om":["등장","붕괴","없음","끝"],"en":"The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute. For all that experimental science today is often assumed to be supported by a philosophical framework …"," ut of curiosity(호기심에서)와 같은 단어로 이어져 맞음.","obedience(복종): 시키는 대로 따르는 태도는 승인된 방법론 쪽이라 글쓴이가 강조하는 것과 반대임.","caution(조심성): 조심성이 풀려났다면 완전히 엉뚱한 실험을 하라는 다윈의 말과 맞지 않음.","patience(인내심): 인내심은 실험 철학의 등장과 함께 새로 인정받은 성질로 글 어디에도 나오지 않음."],"om":["호기심","복종","조심성","인내심"],"en":"The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute. … \"One can conduct an experiment simply out of curiosity to see what will happen.\"","ko":"실험 철학의 등장은 호기심이 의심스러운 특성이 아니라 가치 있는 특성으로 풀려난 것과 같은 시기에 일어났다. … \"사람은 무슨 일이 일어나는지 보려고 그저 호기심에서 실험을 할 수도 있다.\"","hl":["the liberation of curiosity","out of curiosity"],"khl":["호기심이","그저 호기심에서"],"blocks":[{"t":"pair","h":"같은 단어가 두 번 나온다","x":[["the liberation of curiosity","호기심의 해방 (역사 이야기)"],["simply out of curiosity","그저 호기심에서 (해킹의 말)"]]},{"t":"p","h":"indifference(무관심)를 넣으면","x":["\"무관심이 가치 있는 특성으로 풀려났다\"가 된다.","무관심한 사람은 무슨 일이 일어날지 궁금해하지 않는다.","궁금하지 않으면 실험할 이유도 없다.","실험 철학이 함께 일어섰다는 말이 설 자리를 잃는다."]}],"post":["curiosity(호기심) ↔ indifference(무관심)","실험의 연료 = 궁금함"]},{"slots":[["suppose","presume","s"],["coincided"],["questionable","praiseworthy","a"],["conduct"],["once_in_a_while","occasionally","s"]],"opts":["questionable","respectable","reliable","desirable"],"or":["questionable(의심스러운): 호기심이 예전에 받던 나쁜 평가라 valuable(가치 있는)과 반대편에 서서 맞음.","respectable(존중할 만한): 좋은 쪽 말이라 valuable(가치 있는)과 대비가 되지 않음.","reliable(믿을 만한): 좋은 평가라 '이것이 아니라 가치 있는 것'이라는 대비가 성립하지 않음.","desirable(바람직한): 바람직한 것에서 가치 있는 것으로 풀려났다는 건 해방이라고 부를 수 없음."],"om":["의심스러운","존중할 만한","믿을 만한","바람직한"],"en":"The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute.","ko":"실험 철학의 등장은 호기심이 의심스러운 특성이 아니라 가치 있는 특성으로 풀려난 것과 같은 시기에 일어났다.","hl":["rather than a questionable attribute","liberation"],"khl":["의심스러운 특성이 아니라","풀려난"],"blocks":[{"t":"p","h":"풀려났다면 전에는 묶여 있었다","x":["liberation(해방)은 갇혀 있던 것이 풀려나는 일이다.","호기심은 예전에 나쁘게 여겨져 묶여 있었다.","그 나쁜 평가가 questionable(의심스러운)이다.","praiseworthy(칭찬할 만한)를 넣으면 원래도 좋은 평가였다는 말이 되어 \"해방\"이 성립하지 않는다."]},{"t":"p","h":"rather than(~이 아니라) 대비 확인","x":["valuable(가치 있는)과 praiseworthy(칭찬할 만한)는 둘 다 좋은 말이다.","좋은 말끼리는 \"A가 아니라 B\"로 맞세울 수 없다."]},{"t":"p","h":"함정 두 개","x":["presume(추정하다)은 suppose(짐작하다)와 같은 뜻이다.","occasionally(가끔)는 once in a while(가끔)과 같은 뜻이다.","둘 다 본문을 바꿔 썼을 뿐 맞는 표현."]}],"post":["questionable(의심스러운) ↔ praiseworthy(칭찬할 만한)","예전 호기심 = 미심쩍은 성질 취급"]},{"slots":[["embrace","acceptance","s"],["worst"],["coincided","clashed","a"],["simply"],["fruitless"]],"opts":["coincided","interfered","competed","disagreed"],"or":["coincided(동시에 일어났다): 실험 철학의 등장과 호기심의 해방은 서로 돕는 일이라 같은 시기에 일어났다는 말이 맞음.","interfered(방해했다): 호기심이 실험의 출발점이니 실험 철학이 호기심을 방해할 이유가 없음.","competed(경쟁했다): 둘은 같은 편이라 서로 경쟁했다는 말은 흐름과 맞지 않음.","disagreed(의견이 달랐다): 실험 철학과 호기심이 서로 어긋났다면 해킹의 말 out of curiosity(호기심에서)가 나올 수 없음."],"om":["동시에 일어났다","방해했다","경쟁했다","의견이 달랐다"],"en":"The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute. … \"One can conduct an experiment simply out of curiosity to see what will happen.\"","ko":"실험 철학의 등장은 호기심이 의심스러운 특성이 아니라 가치 있는 특성으로 풀려난 것과 같은 시기에 일어났다. … \"사람은 무슨 일이 일어나는지 보려고 그저 호기심에서 실험을 할 수도 있다.\"","hl":["coincided with","simply out of curiosity"],"khl":["같은 시기에 일어났다","그저 호기심에서"],"blocks":[{"t":"p","h":"실험과 호기심은 같은 편","x":["실험은 \"어떻게 될까?\"를 확인하는 일이다.","그 질문을 만드는 힘이 호기심이다.","그래서 둘은 함께 자랄 수밖에 없다.","clashed(충돌했다)를 넣으면 실험 철학과 호기심이 부딪쳤다는 말이 된다."]},{"t":"p","h":"뒤 문장이 확인 도장","x":["해킹은 그저 호기심에서 실험해도 된다고 말한다.","실험과 호기심이 충돌한다면 이 말이 나올 수 없다."]},{"t":"p","h":"그대로 두는 단어","x":["acceptance(받아들임)는 embrace(받아들임)와 같은 뜻이라 고치지 않는다."]}],"post":["coincide(동시에 일어나다) ↔ clash(충돌하다)","실험 철학의 등장 + 호기심의 해방 = 같은 시기"]},{"slots":[["ignorance"],["liberation"],["valuable"],["crazy","predictable","a"],["fruitless"]],"opts":["crazy","careful","ordinary","routine"],"or":["crazy(엉뚱한): 성과가 없을 가능성이 크더라도 해 보라는 말과 짝을 이뤄 맞음.","careful(신중한): 신중한 실험이라면 '실패할 가능성이 크더라도'라는 양보가 붙을 이유가 약함.","ordinary(평범한): 평범한 실험은 굳이 '가끔' 따로 해 보라고 권할 대상이 아님.","routine(일상적인): 늘 하는 실험은 '해 보기 전엔 모른다'는 모험의 말과 어울리지 않음."],"om":["엉뚱한","신중한","평범한","일상적인"],"en":"Indeed, in the view of Charles Darwin's son, the astronomer George Darwin, once in a while one should do a completely crazy experiment, even if it is most likely to prove fruitless. You never know until you try.","ko":"실제로 찰스 다윈의 아들인 천문학자 조지 다윈의 생각으로는, 아무 성과가 없을 가능성이 아주 크더라도 사람은 가끔 완전히 엉뚱한 실험을 해 봐야 한다. 해 보기 전까지는 절대 알 수 없다.","hl":["a completely crazy experiment","You never know until you try"],"khl":["완전히 엉뚱한 실험","해 보기 전까지는 절대 알 수 없다"],"blocks":[{"t":"p","h":"마지막 문장으로 거꾸로 확인","x":["마지막 문장은 You never know until you try(해 보기 전엔 절대 모른다)이다.","predictable(예측할 수 있는) 실험은 해 보기 전에도 결과를 안다.","그러면 마지막 문장과 정면으로 부딪친다.","결과를 짐작조차 못 하는 실험이어야 \"해 봐야 안다\"가 살아난다."]},{"t":"p","h":"even if(~이더라도)가 붙는 이유","x":["even if it is most likely to prove fruitless(헛될 가능성이 아주 크더라도).","실패할 가능성이 큰 실험이라는 뜻이다.","그런 실험이 바로 엉뚱한 실험이다."]}],"post":["crazy(엉뚱한) ↔ predictable(뻔한)","결과를 모르는 실험이라야 해 볼 가치가 있음"]},{"slots":[["bothering"],["valuable","worthwhile","s"],["conduct","perform","s"],["simply"],["fruitless","rewarding","a"]],"opts":["fruitless","successful","productive","meaningful"],"or":["fruitless(성과 없는): even if(~이더라도)가 '그래도 해 봐라'를 이끄니 뒤에는 나쁜 결과가 와야 해서 맞음.","successful(성공적인): '성공할 가능성이 크더라도 해 봐라'는 양보가 되지 않음.","productive(생산적인): 좋은 결과라서 even if(~이더라도)의 반대 방향과 맞지 않음.","meaningful(의미 있는): 의미 있을 가능성이 크다면 굳이 '그래도'라고 설득할 필요가 없음."],"om":["성과 없는","성공적인","생산적인","의미 있는"],"en":"Indeed, in the view of Charles Darwin's son, the astronomer George Darwin, once in a while one should do a completely crazy experiment, even if it is most likely to prove fruitless.","ko":"실제로 찰스 다윈의 아들인 천문학자 조지 다윈의 생각으로는, 아무 성과가 없을 가능성이 아주 크더라도 사람은 가끔 완전히 엉뚱한 실험을 해 봐야 한다.","hl":["even if it is most likely to prove fruitless","a completely crazy experiment"],"khl":["아무 성과가 없을 가능성이 아주 크더라도","완전히 엉뚱한 실험"],"blocks":[{"t":"tap","h":"even if(~이더라도) 뒤에는 무엇이 올까?","q":"\"___이더라도 해 봐라\"의 빈칸에 들어갈 말은 좋은 결과 These {discrepancies} were explained only when Einstein developed his general theory of relativity, which was able to match the observations. {Still}, the many {successes} of Newton's theory could not be {ignored}, and Einstein's theory would not have gained {acceptance} if it had not been able to explain these successes {equally} well. It did, and that is why we now view Einstein's theory as a {broader} theory of gravity than Newton's theory. Some scientists today are {seeking} a theory of gravity that will {go_beyond} Einstein's. If any new theory ever gains acceptance, it will have to match all the successes of Einstein's theory as well as work in new realms where Einstein's theory does not.","fn":["*general theory of relativity: 일반 상대성 이론","*realm: 영역, 분야"],"mean":{"discard":"버리다, 폐기하다","throw out":"버리다, 내다 버리다","preserve":"보존하다, 지키다","better":"더 나은 (형용사 good(좋은)의 비교급)","worse":"더 나쁜 (형용사 bad(나쁜)의 비교급)","evidence":"증거","data":"자료, 데이터","great":"훌륭한, 좋은","poor":"형편없는, 빈약한","vast":"방대한, 막대한","limited":"제한된, 많지 않은","discover":"발견하다","uncover":"찾아내다, 밝혀내다","overlook":"간과하다, 못 보고 넘어가다","predictions":"명사 prediction(예측)의 복수형","forecasts":"명사 forecast(예측, 예보)의 복수형","perfectly":"완벽하게","precisely":"정확히, 꼭 맞게","observations":"명사 observation(관찰, 관찰 결과)의 복수형","measurements":"명사 measurement(측정값)의 복수형","discrepancies":"명사 discrepancy(불일치, 차이)의 복수형","agreements":"명사 agreement(일치)의 복수형","Still":"그렇지만, 그럼에도","Nevertheless":"그럼에도 불구하고","successes":"명사 success(성공)의 복수형","achievements":"명사 achievement(업적, 성취)의 복수형","ignored":"동사 ignore(무시하다)의 과거분사형. be ignored = 무시되다(수동태)","dismissed":"동사 dismiss(묵살하다, 일축하다)의 과거분사형","acknowledged":"동사 acknowledge(인정하다)의 과거분사형","acceptance":"인정, 받아들여짐","approval":"승인, 인정","rejection":"거부, 거절","equally":"똑같이, 동등하게","less":"덜, 더 적게","broader":"더 넓은 (형용사 broad(넓은)의 비교급)","narrower":"더 좁은 (형용사 narrow(좁은)의 비교급)","seeking":"동사 seek(찾다, 구하다)의 -ing형. are seeking = 찾고 있다(진행형)","giving up on":"구동사 give up on(~을 포기하다)의 -ing형. are giving up on = 포기하고 있다","go bey in's theory as well as work in new realms where Einstein's theory does not.","ko":"오늘날 몇몇 과학자들은 아인슈타인의 이론을 넘어설 중력 이론을 찾고 있다. 어떤 새로운 이론이 언젠가 인정받는다면, 그 이론은 아인슈타인 이론이 통하지 않는 새로운 영역에서 통해야 할 뿐 아니라 아인슈타인 이론의 모든 성공에도 들어맞아야 할 것이다.","hl":["go beyond Einstein's","work in new realms where Einstein's theory does not"],"khl":["넘어설","아인슈타인 이론이 통하지 않는 새로운 영역에서 통해야"],"blocks":[{"t":"tap","h":"질문 하나","q":"새 이론이 인정받으려면 무엇을 해내야 할까?","a":["두 가지다.","아인슈타인 이론이 해낸 것은 전부 해내기.","아인슈타인 이론이 못 하는 곳에서도 통하기.","이 둘을 다 하면 아인슈타인을 넘어선 것이다."]},{"t":"p","h":"fall short of(~에 못 미치다)가 틀린 이유","x":["아인슈타인에 못 미치는 이론을 일부러 찾는 과학자는 없다.","마지막 문장의 조건과도 정면으로 어긋난다."]},{"t":"p","h":"그대로 두는 단어","x":["uncover(찾아내다)는 discover(발견하다)와 같은 자리에서 \"빈틈을 찾아냈다\"는 뜻을 만든다."]}],"post":["go beyond(~을 넘어서다) ↔ fall short of(~에 못 미치다)","새 이론 = 옛 성공 전부 + 새 영역"]}],"compquiz":[{"w":"ignore","m":"무시하다","it":[["disregard","무시하다","s"],["borrow","빌리다","n"],["acknowledge","인정하다","a"],["invite","초대하다","n"],["overlook","못 본 척하다, 간과하다","s"],["heed","주의를 기울이다","a"],["bury","묻다","n"]]},{"w":"go beyond","m":"~을 넘어서다","it":[["take after","닮다","n"],["surpass","능가하다","s"],["fall short of","~에 못 미치다","a"],["put off","미루다","n"],["exceed","넘어서다, 초과하다","s"],["fall behind","뒤처지다","a"],["look up to","존경하다","n"]]}],"sets":[{"items":[{"slots":[["discard","preserve","a"],["evidence"],["vast"],["predictions"],["discrepancies"]],"opts":["discard","prove","publish","praise"],"or":["discard(버리다): or replace(또는 교체하다)와 짝을 이뤄 '옛 이론을 내려놓는 일'을 말하니 맞음.","prove(증명하다): 더 나은 설명이 있어야 기존 이론을 증명한다는 건 거꾸로 된 말임.","publish(발표하다): 이론 발표와 '더 나은 설명이 있을 때에만'이라는 조건은 이어지지 않음.","praise(칭찬하다): 더 나은 설명이 나왔을 때 하는 일은 옛 이론 칭찬이 아니라 교체임."],"om":["버리다","증명하다","발표하다","칭찬하다"],"en":"We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.","ko":"우리는 어떤 과학 이론을 뒷받침하는 증거를 더 잘 설명할 방법이 있을 때에만 그 이론을 버리거나 다른 것으로 바꿀 수 있다.","hl":["discard or replace","only if we have a better way"],"khl":["버리거나 다른 것으로 바꿀","더 잘 설명할 방법이 있을 때에만"],"blocks":[{"t":"flow","h":"이 단어가 서 있는 자리","x":["규칙: 더 나은 설명이 있을 때만 옛 이론을 버림","예: 뉴턴 이론에서 빈틈이 발견됨","아인슈타인이 빈틈을 설명함","그래도 뉴턴의 성공까지 설명해야 했음","앞으로의 새 이론도 같은 조건"],"at":0},{"t":"p","h":"or(또는)로 묶인 두 단어","x":["discard or replace(버리거나 바꾸다).","or(또는)로 묶인 두 말은 같은 방향이어야 한다.","replace(바꾸다)는 옛 이론을 내려놓는 일이다.","preserve(지키다)는 반대로 붙잡아 두는 일이다.","\"지키거나 바꾼다\"는 서로 다른 방향을 억지로 묶은 말이 된다."]}],"post":["discard(버리다) ↔ preserve(지키다)","옛 이론 교체 조건 = 더 나은 설명"]},{"slots":[["evidence","data","s"],["vast","limited","a"],["predictions","forecasts","s"],["observations"],["Still"]],"opts":["vast","slim","shaky","partial"],"or":["vast(방대한): 뒤에 the many successes(수많은 성공)가 나오니 증거가 엄청나게 많다는 말이 맞음.","slim(빈약한): 증거가 빈약했다면 뉴턴의 성공을 무시할 수 없었다는 말과 맞지 않음.","shaky(불안한): 흔들리는 증거라면 아인슈타인이 굳이 그것까지 똑같이 설명할 필요가 없음.","partial(부분적인): 일부만 뒷받침했다면 but(하지만) 뒤의 '빈틈 발견'이 반전이 되지 못함."],"om":["방대한","빈약한","불안한","부분적인"],"en":"A vast body of evidence supports Newton's theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations.","ko":"방대한 양의 증거가 뉴턴의 중력 이론을 뒷받침하지만, 19세기 후반 무렵 과학자들은 그 이론의 예측이 관찰 결과와 완벽하게 들어맞지 않는 경우들을 발견하기 시작했다.","hl":["A vast body of evidence","but"],"khl":["방대한 양의 증거","뒷받침하지만"],"blocks":[{"t":"p","h":"but(하지만)이 만드는 반전","x":["but(하지만) 앞은 뉴턴 이론의 강한 모습이다.","but(하지만) 뒤는 뉴턴 이론의 빈틈이다.","반전이 되려면 앞쪽이 아주 강해야 한다.","limited(제한된) 증거라면 빈틈이 나와도 놀랄 일이 아니다."]},{"t":"p","h":"뒤에서 다시 확인","x":["the many successes of Newton's theory(뉴턴 이론의 수많은 성공).","성공이 수없이 많았다는 건 증거가 엄청났다는 뜻이다."]},{"t":"p","h":"고치면 안 되는 두 곳","x":["data(자료)는 evidence(증거)를 바꿔 쓴 말이라 \"자료를 설명할 방법\"으로 그대로 통한다.","forecasts(예측)는 predictions(예측)와 같은 뜻이다."]}],"post":["vast(방대한) ↔ limited(제한된)","뉴턴 이론 = 엄청난 증거 + 작은 빈틈"]},{"slots":[["better"],["discover","overlook","a"],["perfectly"],["Still","Nevertheless","s"],["ignored"]],"opts":["discover","hide","deny","forget"],"or":["discover(발견하다): 다음 문장의 These discrepancies(이 불일치들)가 가리킬 대상을 찾아낸 일이라 맞음.","hide(숨기다): 빈틈을 숨겼다면 아인슈타인이 그것을 설명할 계기가 생기지 않음.","deny(부인하다): 빈틈을 부인했다면 These discrepancies(이 불일치들)라고 받아 말할 수 없음.","forget(잊다): 잊어버린 불일치는 다음 문장에서 '설명되었다'의 대상이 될 수 없음."],"om":["발견하다","숨기다","부인하다","잊다"],"en":"… scientists had begun to discover cases where its predictions did not perfectly match observations. These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations.","ko":"… 과학자들은 그 이론의 예측이 관찰 결과와 완벽하게 들어맞지 않는 경우들을 발견하기 시작했다. 이 불일치들은 아인슈타인이 일반 상대성 이론을 세우고 나서야 비로소 설명되었는데, 그 이론은 관찰 결과와 들어맞을 수 있었다.","hl":["discover cases","These discrepancies"],"khl":["발견하기 시작했다","이 불일치들"],"blocks":[{"t":"pair","h":"앞뒤 문장을 이어 보기","x":[["discover cases where its predictions did not perfectly match","예측이 딱 들어맞지 않는 경우를 찾아냄"],["These discrepancies were explained","그 불일치들이 설명됨"]]},{"t":"p","h":"overlook(간과하다)를 넣으면","x":["과학자들이 빈틈을 못 보고 지나쳤다는 말이 된다.","그런데 다음 문장은 These(이)로 그 빈틈을 콕 집어 가리킨다.","아무도 못 본 빈틈을 \"이 불일치들\"이라고 부를 수 없다."]},{"t":"p","h":"함정","x":["Nevertheless(그럼에도 불구하고)는 Still(그렇지만)과 같은 방향 전환 연결어다.","고칠 대상이 아니다."]}],"post":["discover(발견하다) ↔ overlook(간과하다)","빈틈 발견 → 아인슈타인의 설명"]},{"slots":[["great"],["discrepancies"],["successes"],["acceptance"],["broader","narrower","a"]],"opts":["broader","older","simpler","weaker"],"or":["broader(더 넓은): 뉴턴이 설명한 것에 빈틈까지 더 설명하니 범위가 더 넓다는 말이 맞음.","older(더 오래된): 아인슈타인 이론은 뉴턴보다 나중에 나왔으니 사실과 반대임.","simpler(더 단순한): 앞 문장이 말한 이유는 단순함이 아니라 '똑같이 잘 설명했다'는 점임.","weaker(더 약한): 뉴턴의 성공도 설명하고 빈틈도 메웠는데 더 약하다는 건 앞뒤가 맞지 않음."],"om":["더 넓은","더 오래된","더 단순한","더 약한"],"en":"Einstein's theory would not have gained acceptance if it had not been able to explain these successes equally well. It did, and that is why we now view Einstein's theory as a broader theory of gravity than Newton's theory.","ko":"아인슈타인의 이론이 이 성공들을 똑같이 잘 설명하지 못했다면 인정받지 못했을 것이다. 아인슈타인의 이론은 그렇게 해냈고, 그래서 우리는 지금 아인슈타인의 이론을 뉴턴의 이론보다 더 넓은 중력 이론으로 본다.","hl":["a broader theory of gravity","that is why"],"khl":["더 넓은 중력 이론","그래서"],"blocks":[{"t":"tap","h":"한 줄로 복원","q":"아인슈타인 이론이 해낸 일을 더하기로 쓰면?","a":["뉴턴이 설명한 것 전부 + 뉴턴이 못 한 빈틈.","더한 만큼 범위가 커졌다.","그래서 broader(더 넓은)이다."]},{"t":"p","h":"that is why(그래서)가 이유를 묶는다","x":["It did(그렇게 해냈다)는 뉴턴의 성공을 똑같이 설명해 냈다는 뜻이다.","그 결과로 더 좁은 이론이 될 수는 없다.","narrower(더 좁은)는 이유와 결과를 거꾸로 붙인 말이다."]}],"post":["broader(더 넓은) ↔ narrower(더 좁은)","아인슈타인 = 뉴턴 전부 + 빈틈까지"]},{"slots":[["perfectly"],["successes","achievements","s"],["equally","less","a"],["seeking"],["go_beyond","surpass","s"]],"opts":["equally","partly","barely","rarely"],"or":["equally(똑같이): 새 이론은 옛 이론의 성공을 하나도 빠짐없이 설명해야 한다는 글의 조건과 맞음.","partly(부분적으로): 일부만 설명하면 된다는 말은 마지막 문장의 match all the successes(모든 성공에 들어맞다)와 부딪침.","barely(간신히): 간신히 설명하는 수준이라면 '더 넓은 이론'으로 볼 근거가 약해짐.","rarely(드물게): 드물게만 설명했다면 뉴턴의 성공을 무시할 수 없었다는 앞말과 이어지지 않음."],"om":["똑같이","부분적으로","간신히","드물게"],"en":"Still, the many successes of Newton's theory could not be ignored, and Einstein's theory would not have gained acceptance if it had not been able to explain these successes equally well.","ko":"그렇지만 뉴턴 이론의 수많은 성공은 무시될 수 없었고, 아인슈타인의 이론이 이 성공들을 똑같이 잘 설명하지 못했다면 인정받지 못했을 것이다.","hl":["explain these successes equally well","would not have gained acceptance"],"khl":["똑같이 잘 설명하지","인정받지 못했을 것이다"],"blocks":[{"t":"p","h":"가정법 문장 풀어 읽기","x":["would not have gained acceptance if it had not been able to(~하지 못했다면 인정받지 못했을 것이다).","거꾸로 말하면 \"해냈기 때문에 인정받았다\"이다.","무엇을 해냈나? 뉴턴의 성공을 똑같이 잘 설명하는 일이다.","less(덜)를 넣으면 \"덜 잘 설명하지 못했다면 인정 못 받았다\"가 되어 뜻이 엉킨다."]},{"t":"p","h":"마지막 문장도 같은 규칙","x":["새 이론은 match all the successes(모든 성공에 들어맞다)를 해내야 한다.","옛 이론만큼은 반드시 해내야 한다는 규칙이 두 번 나온다."]},{"t":"p","h":"세 군데가 바뀌었지만 고칠 곳은 하나","x":["achievements(업적)는 successes(성공)와 같은 뜻이다.","surpass(능가하다)는 go beyond(~을 넘어서다)와 같은 뜻이다."]}],"post":["equally(똑같이) ↔ less(덜)","새 이론의 첫 조건 = 옛 성공을 똑같이 설명"]}],"quiz":[{"w":"discard","m":"버리다, 폐기하다","it":[["whisper","속삭이다","n"],["abandon","버리다","s"],["keep","간직하다","a"],["decorate","장식하다","n"],["scrap","폐기하다","s"],["retain","보유하다","a"],["swallow","삼키다","n"]]},{"w":"vast","m":"방대한, 막대한","it":[["huge","거대한","s"],["wooden","나무로 된","n"],["tiny","아주 작은","a"],["punctual","시간을 잘 지키는","n"],["immense","막대한","s"],["small","작은","a"],["rural","시골의","n"]]},{"w":"discover","m":"발견하다","it":[["borrow","빌리다","n"],["find","찾다","s"],["conceal","숨기다","a"],["bake","굽다","n"],["uncover","밝혀내다","s"],["overlook","간과하다","a"],["invite","초대하다","n"]]},{"w":"broad","m":"넓은 (broader는 비교급)","it":[["wide","넓은","s"],["polite","공손한","n"],["narrow","좁은","a"],["frozen","얼어붙은","n"],["extensive","광범위한","s"],["restricted","제한된","a"],["annual","해마다의","n"]]},{"w":"equally","m":"똑같이, 동등하게","it":[["loudly","큰 소리로","n"],["evenly","고르게","s"],["unequally","불공평하게, 같지 않게","a"],["secretly","몰래","n"],["identically","똑같이","s"],["unevenly","고르지 않게","a"],["rapidly","빠르게","n"]]}]},{"items":[{"slots":[["better","worse","a"],["evidence"],["discover"],["observations"],["successes"]],"opts":["better","quicker","cheaper","shorter"],"or":["better(더 나은): 아인슈타인이 뉴턴보다 더 잘 설명해서 인정받은 예가 바로 뒤에 나오니 맞음.","quicker(더 빠른): 예시 어디에도 설명 속도 이야기는 없음.","cheaper(더 싼): 이론 교체의 기준은 비용이 아니라 증거를 설명하는 힘임.","shorter(더 짧은): 짧은 설명이 기준이라면 아인슈타인이 뉴턴의 성공까지 설명해야 했던 이유가 사라짐."],"om":["더 나은","더 빠른","더 싼","더 짧은"],"en":"We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it. The theories of Newton and Einstein offer great examples.","ko":"우리는 어떤 과학 이론을 뒷받침하는 증거를 더 잘 설명할 방법이 있을 때에만 그 이론을 버리거나 다른 것으로 바꿀 수 있다. 뉴턴과 아인슈타인의 이론이 좋은 예를 보여 준다.","hl":["a better way of explaining the evidence","offer great examples"],"khl":["더 잘 설명할 방법","좋은 예를 보여 준다"],"blocks":[{"t":"p","h":"첫 문장이 곧 규칙","x":["이 글의 첫 문장은 규칙이다.","옛 이론을 바꾸려면 더 잘 설명하는 이론이 있어야 한다.","뒤의 뉴턴과 아인슈타인은 이 규칙의 예다."]},{"t":"p","h":"worse(더 나쁜)를 넣고 읽기","x":["\"더 못 설명하는 방법이 있을 때만 이론을 바꾼다\"가 된다.","그러면 과학은 점점 뒤로 가게 된다.","아인슈타인은 뉴턴의 빈틈까지 설명했기 때문에 받아들여졌다.","예시가 규칙을 정면으로 부정하게 된다."]}],"post":["better(더 나은) ↔ worse(더 나쁜)","이론 교체의 규칙 = 더 잘 설명하기"]},{"slots":[["discard","throw out","s"],["evidence"],["discrepancies","agreements","a"],["ignored","dismissed","s"],["go_beyond"]],"opts":["discrepancies","coincidences","advantages","connections"],"or":["discrepancies(불일치): 앞 문장의 did not perfectly match(완벽하게 들어맞지 않았다)를 한 단어로 받은 말이라 맞음.","coincidences(우연의 일치): 들어맞지 않는 경우를 '우연히 맞은 것'으로 받으면 뜻이 뒤집힘.","advantages(장점): 예측이 빗나간 경우는 장점이 아니라 빈틈임.","connections(연결): 들어맞지 않은 경우를 '연결'이라고 부를 수 없음."],"om":["불일치","우연의 일치","장점","연결"],"en":"… cases where its predictions did not perfectly match observations. These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations.","ko":"… 그 이론의 예측이 관찰 결과와 완벽하게 들어맞지 않는 경우들 … 이 불일치들은 아인슈타인이 일반 상대성 이론을 세우고 나서야 비로소 설명되었는데, 그 이론은 관찰 결과와 들어맞을 수 있었다.","hl":["These discrepancies","did not perfectly match"],"khl":["이 불일치들","완벽하게 들어맞지 않는"],"blocks":[{"t":"p","h":"These(이)는 바로 앞을 가리킨다","x":["These(이)는 앞에서 말한 것을 다시 부를 때 쓴다.","바로 앞에 나온 건 예측과 관찰이 안 맞는 경우들이다.","그러니 These(이) 뒤의 명사는 \"안 맞음\"이어야 한다.","agreements(일치)를 넣으면 앞말을 정반대로 받게 된다."]},{"t":"p","h":"설명이 필요한 건 어느 쪽?","x":["딱 맞는 결과는 따로 설명할 필요가 없다.","안 맞는 결과가 있어야 새 이론이 필요해진다.","아인슈타인이 설명한 것은 뉴턴의 빈틈이었다."]},{"t":"p","h":"그대로 두는 두 단어","x":["throw out(버리다)은 discard(버리다)와 같은 뜻이다.","dismissed(묵살된)는 ignored(무시된)와 같은 자리에서 \"무시될 수 없었다\"를 그대로 만든다."]}],"post":["discrepancy(불일치) ↔ agreement(일치)","예측과 관찰의 어긋남 = 새 이론의 출발"]},{"slots":[["great","poor","a"],["predictions"],["perfectly","precisely","s"],["Still"],["broader"]],"opts":["great","confusing","misleading","useless"],"or":["great(훌륭한): 글쓴이가 첫 문장의 규칙을 보여 주려고 일부러 고른 예라 '좋은 예'가 맞음.","confusing(헷갈리는): 헷갈리는 예를 들면서 그 예로 규칙을 끝까지 설명하는 글쓴이는 없음.","misleading(오해하게 만드는): 오해를 부르는 예라면 뒤에서 규칙이 그대로 들어맞을 수 없음.","useless(쓸모없는): 글의 나머지 전체가 이 예로 채워져 있으니 쓸모없는 예일 수 없음."],"om":["훌륭한","헷갈리는","오해하게 만드는","쓸모없는"],"en":"We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it. The theories of Newton and Einstein offer great examples.","ko":"우리는 어떤 과학 이론을 뒷받침하는 증거를 더 잘 설명할 방법이 있을 때에만 그 이론을 버리거나 다른 것으로 바꿀 수 있다. 뉴턴과 아인슈타인의 이론이 좋은 예를 보여 준다.","hl":["offer great examples","only if we have a better way"],"khl":["좋은 예를 보여 준다","더 잘 설명할 방법이 있을 때에만"],"blocks":[{"t":"tap","h":"질문 하나","q":"글쓴이가 규칙을 말한 바로 뒤에 예를 꺼내는 이유는?","a":["규칙을 눈으로 보여 주려고.","보여 주려고 고른 예라면 당연히 잘 맞는 예다.","poor(형편없는)를 넣으면 글쓴이가 스스로 자기 예를 깎아내리는 셈이다."]},{"t":"p","h":"글 나머지가 증거","x":["뒤 문장들은 모두 뉴턴과 아인슈타인 이야기다.","빈틈 발견, 아인슈타인의 설명, 뉴턴 성공까지 설명하기.","하나하나가 첫 문장의 규칙과 딱 맞는다.","그래서 great examples(좋은 예)다."]},{"t":"p","h":"함정","x":["precisely(정확히)는 perfectly(완벽하게)와 같은 자리에서 \"딱 들어맞지 않았다\"를 만든다."]}],"post":["great(훌륭한) ↔ poor(형편없는)","뉴턴과 아인슈타인 = 규칙을 보여 주는 좋은 예"]},{"slots":[["vast"],["Still"],["successes"],["acceptance","rejection","a"],["seeking"]],"opts":["acceptance","opposition","suspicion","resistance"],"or":["acceptance(인정): '설명하지 못했다면 인정받지 못했을 것'이라는 가정이 되어 해냈기 때문에 인정받았다는 뜻이 맞음.","opposition(반대): '반대를 얻지 못했을 것'은 해낸 결과로 반대를 얻었다는 말이 되어 흐름과 반대임.","suspicion(의심): 성공을 똑같이 설명해 낸 결과가 의심이라는 건 앞뒤가 맞지 않음.","resistance(저항): 해낸 덕분에 저항을 얻었다는 뜻이 되어 broader theory(더 넓은 이론)라는 평가와 부딪침."],"om":["인정","반대","의심","저항"],"en":"Einstein's theory would not have gained acceptance if it had not been able to explain these successes equally well. It did, and that is why we now view Einstein's theory as a broader theory of gravity than Newton's theory.","ko":"아인슈타인의 이론이 이 성공들을 똑같이 잘 설명하지 못했다면 인정받지 못했을 것이다. 아인슈타인의 이론은 그렇게 해냈고, 그래서 우리는 지금 아인슈타인의 이론을 뉴턴의 이론보다 더 넓은 중력 이론으로 본다.","hl":["would not have gained acceptance","It did"],"khl":["인정받지 못했을 것이다","그렇게 해냈고"],"blocks":[{"t":"p","h":"not ~ if not(~하지 못했다면 …하지 못했다) 뒤집어 읽기","x":["설명하지 못했다면 → 얻지 못했다.","실제로는 It did(그렇게 해냈다).","그러니 실제로는 \"얻었다\".","얻은 것이 rejection(거부)이라면 성공의 대가로 거부를 받은 셈이다."]},{"t":"p","h":"마지막 문장에서 다시 등장","x":["If any new theory ever gains acceptance(새 이론이 언젠가 인정받는다면).","같은 표현이 마지막에 한 번 더 나온다.","이 글에서 gain acceptance(인정받다)는 이론이 목표로 하는 상이다."]}],"post":["acceptance(인정) ↔ rejection(거부)","뉴턴의 성공까지 설명 → 인정받은 아인슈타인"]},{"slots":[["observations","measurements","s"],["ignored"],["acceptance","approval","s"],["seeking","giving up on","a"],["go_beyond"]],"opts":["seeking","attacking","mocking","hiding"],"or":["seeking(찾고 있는): 바로 다음 문장이 새 이론이 인정받기 위한 조건을 말하니 과학자들이 그런 이론을 찾는 중이라는 말이 맞음.","attacking(공격하는): will go beyond(넘어설)는 아직 나오지 않은 미래의 이론이라 공격할 수 없음.","mocking(조롱하는): 아인슈타인을 넘어설 이론을 조롱한다는 건 과학이 발전해 온 이 글의 흐름과 반대임.","hiding(숨기는): 아직 찾지 못한 이론을 숨긴다는 말은 성립하지 않음."],"om":["찾고 있는","공격하는","조롱하는","숨기는"],"en":"Some scientists today are seeking a theory of gravity that will go beyond Einstein's. If any new theory ever gains acceptance, it will have to match all the successes of Einstein's theory as well as work in new realms where Einstein's theory does not.","ko":"오늘날 몇몇 과학자들은 아인슈타인의 이론을 넘어설 중력 이론을 찾고 있다. 어떤 새로운 이론이 언젠가 인정받는다면, 그 이론은 아인슈타인 이론이 통하지 않는 새로운 영역에서 통해야 할 뿐 아니라 아인슈타인 이론의 모든 성공에도 들어맞아야 할 것이다.","hl":["are seeking a theory of gravity","If any new theory ever gains acceptance"],"khl":["중력 이론을 찾고 있다","언젠가 인정받는다면"],"blocks":[{"t":"p","h":"will go beyond(넘어설)의 시제","x":["that will go beyond Einstein's(아인슈타인의 이론을 넘어설).","will(~할)은 아직 오지 않은 일이다.","그런 이론은 아직 없다.","아직 없는 것에 대해 할 수 있는 일은 찾는 것뿐이다."]},{"t":"p","h":"giving up on(포기하는)을 넣으면","x":["\"과학자들이 아인슈타인을 넘어설 이론을 포기하고 있다\"가 된다.","그런데 다음 문장은 그 이론이 갖춰야 할 조건을 자세히 말한다.","포기한 이론의 조건을 정리할 이유는 없다."]},{"t":"p","h":"그대로 두는 단어","x":["measurements(측정값)는 observations(관찰 결과)와 같은 자리에 들어간다.","approval(승인)은 acceptance(인정)와 같이 gain(얻다)과 짝을 이룬다."]}],"post":["seek(찾다) ↔ give up on(포기하다)","과학의 다음 과제 = 아인슈타인 너머의 이론 찾기"]}],"quiz":[{"w":"good","m":"좋은 (better는 비교급)","it":[["fine","좋은, 훌륭한","s"],["frozen","얼어붙은","n"],["bad","나쁜","a"],["distant","먼","n"],["excellent","훌륭한","s"],["poor","형편없는","a"],["noisy","시끄러운","n"]]},{"w":"discrepancy","m":"불일치, 차이","it":[["harvest","수확","n"],["inconsistency","불일치, 모순","s"],["agreement","일치","a"],["ladder","사다리","n"],["mismatch","어긋남","s"],["consistency","일관성, 일치","a"],["recipe","요리법","n"]]},{"w":"great","m":"훌륭한, 좋은","it":[["excellent","훌륭한","s"],["wooden","나무로 된","n"],["poor","형편없는","a"],["punctual","시간을 잘 지키는","n"],["outstanding","뛰어난","s"],["terrible","끔찍한","a"],["rural","시골의","n"]]},{"w":"acceptance","m":"인정, 받아들여짐","it":[["approval","승인","s"],["furniture","가구","n"],["rejection","거부","a"],["appetite","식욕","n"],["recognition","인정","s"],["refusal","거절","a"],["vacation","휴가","n"]]},{"w":"seek","m":"찾다, 구하다","it":[["bake","굽다","n"],["search for","찾다","s"],["avoid","피하다","a"],["decorate","장식하다","n"],["look for","찾다","s"],["shun","피하다","a"],["swallow","삼키다","n"]]}]}],"no":"23"},{"id":"2510g2-24","title":"어휘특훈 · 25년 10월 고2 24번","sub":"점심시간 두뇌 휴식의 힘","tpl":"Imagine {pausing} in the middle of a busy day, taking a moment to {refresh} your mind and {recharge} your energy. This power of a midday break is often {underestimated}. When you break away from {routine}, especially with activities designed to {stimulate} your brain, you {prevent} cognitive {tiredness} and {enhance} productivity for the rest of the day. Neurobic exercises — {simple} yet {effective} — are perfect for such breaks. They target different areas of your brain, keeping it {agile} and {alert}. These exercises create a mental oasis that refreshes and prepares you for the afternoon's challenges. This {strategic} pause is not just a break; it {boosts} your cognitive capabilities, ensuring your mind remains {sharp} and {focused}. Even briefly experimenting with neurobic exercises can work wonders for your cognitive state during lunch. Start with using your non-dominant hand for routine tasks like writing or eating. This simple switch challenges your brain, activating pathways that aren't typically engaged and promoting greater {flexibility} in thinking.","fn":["*neurobic exercise: 뉴로빅 운동(평소와 다른 방식으로 뇌를 자극하는 두뇌 운동)","*oasis: 오아시스, 쉼터","*non-dominant hand: 주로 쓰지 않는 손"],"mean":{"pausing":"동사 pause(잠시 멈추다)의 -ing형. 동명사","stopping":"동사 stop(멈추다)의 -ing형. 동명사","rushing":"동사 rush(서두르다)의 -ing형. 동명사","refresh":"새롭게 하다, 상쾌하게 하다","renew":"새롭게 하다, 회복시키다","exhaust":"지치게 하다, 고갈시키다","recharge":"재충전하다","restore":"회복시키다, 되찾게 하다","underestimated":"동사 underestimate(과소평가하다)의 과거분사형. 과  되어 필자가 자기 글을 스스로 깎아내리는 셈이다."]},{"t":"p","h":"그대로 두는 두 단어","x":["renew(새롭게 하다)는 refresh(새롭게 하다)와 같은 뜻이다.","fatigue(피로)는 tiredness(피로)와 같은 뜻이고, cognitive fatigue(인지적 피로)는 아주 자연스러운 짝이다.","본문과 철자가 달라도 뜻이 같으면 맞는 표현."]}],"post":["underestimated(과소평가된) ↔ overestimated(과대평가된)","휴식의 힘 = 사람들이 너무 낮게 보는 힘"]},{"slots":[["recharge","restore","s"],["routine"],["stimulate"],["prevent","induce","a"],["enhance"]],"opts":["prevent","worsen","increase","share"],"or":["prevent(막다): 휴식 활동의 효과라서 피로는 막아야 하는 대상이라 맞음.","worsen(악화시키다): 피로를 더 심하게 만든다면 생산성이 올라갈 수 없음.","increase(늘리다): 피로를 늘리는 활동을 휴식으로 권할 리가 없음.","share(나누다): 피로를 나눈다는 말은 문장의 원인-결과와 아무 관계가 없음."],"om":["막다","악화시키다","늘리다","나누다"],"en":"When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.","ko":"특히 두뇌를 자극하도록 고안된 활동으로 일상에서 벗어날 때, 여러분은 인지적 피로를 막고 남은 하루 동안의 생산성을 높인다.","hl":["prevent cognitive tiredness","break away from routine"],"khl":["인지적 피로를 막고","일상에서 벗어날 때"],"blocks":[{"t":"pair","h":"원인과 결과 나란히 놓기","x":[["When you break away from routine","원인: 일상에서 잠깐 벗어난다 (= 휴식)"],["you prevent cognitive tiredness and enhance productivity","결과: 피로는 막고, 생산성은 올린다"]]},{"t":"p","h":"induce(유발하다)가 틀린 이유","x":["induce(유발하다)를 넣으면 휴식이 피로를 일으킨다는 말이 된다.","쉬었더니 더 피곤해졌다면 그건 휴식이 아니다.","게다가 뒤에 enhance productivity(생산성을 높이다)가 이어진다.","피로가 생겼는데 생산성이 오를 수는 없다."]},{"t":"p","h":"함정","x":["restore(회복시키다)는 recharge(재충전하다) 자리에 넣어도 \"에너지를 되찾는다\"는 뜻이라 맞는 표현이다."]}],"post":["prevent(막다) ↔ induce(유발하다)","일상 탈출 → 피로 차단, 생산성 상승"]},{"slots":[["effective"],["agile","sluggish","a"],["alert"],["strategic"],["sharp"]],"opts":["agile","idle","rigid","fragile"],"or":["agile(민첩한): alert(초롱초롱한)와 짝을 이루며 운동 덕분에 생기는 좋은 머리 상태라 맞음.","idle(놀고 있는): 머리를 놀게 둔다는 말은 뇌의 여러 부분을 겨냥해 자극한다는 앞말과 반대임.","rigid(경직된): 마지막 문장의 greater flexibility(더 큰 유연성)와 정면으로 부딪침.","fragile(연약한): 운동이 뇌를 약하게 만든다는 말이 되어 글의 칭찬 방향과 안 맞음."],"om":["민첩한","놀고 있는","경직된","연약한"],"en":"They target different areas of your brain, keeping it agile and alert.","ko":"그것들은 뇌의 여러 부분을 겨냥하여, 뇌를 민첩하고 초롱초롱하게 유지해 준다.","hl":["agile and alert","target different areas"],"khl":["민첩하고 초롱초롱하게","여러 부분을 겨냥하여"],"blocks":[{"t":"p","h":"같은 무리의 단어들","x":["이 글에서 뇌 상태를 말하는 단어를 모아 보면 이렇다.","agile(민첩한), alert(초롱초롱한), sharp(또렷한), focused(집중된).","전부 머리가 잘 돌아가는 쪽이다.","sluggish(둔한)를 넣으면 이 무리에서 혼자 튄다."]},{"t":"p","h":"and(그리고) 양쪽 맞추기","x":["sluggish and alert(둔하고 초롱초롱한)는 한 머리에 함께 있을 수 없다.","and(그리고) 양쪽은 같은 방향이어야 한다."]}],"post":["agile(민첩한) ↔ sluggish(둔한)","뉴로빅 운동 → 민첩하고 초롱초롱한 뇌"]},{"slots":[["simple","straightforward","s"],["alert"],["strategic","aimless","a"],["boosts","strengthens","s"],["focused"]],"opts":["strategic","accidental","wasteful","lazy"],"or":["strategic(전략적인): 단순한 쉼이 아니라 능력을 키우려고 일부러 넣는 멈춤이라 맞음.","accidental(우연한): 우연히 생긴 멈춤이라면 \"단순한 휴식이 아니다\"라고 강조할 근거가 없음.","wasteful(낭비적인): 인지 능력을 높여 주는 멈춤을 낭비라고 부를 수 없음.","lazy(게으른): 게으른 멈춤이라는 말은 머리를 또렷하게 해 준다는 뒷말과 반대임."],"om":["전략적인","우연한","낭비적인","게으른"],"en":"This strategic pause is not just a break; it boosts your cognitive capabilities, ensuring your mind remains sharp and focused.","ko":"이 전략적인 멈춤은 단순한 휴식이 아니다. 그것은 여러분의 인지 능력을 높여 주어, 정신이 또렷하고 집중된 상태로 유지되도록 해 준다.","hl":["This strategic pause is not just a break","boosts your cognitive capabilities"],"khl":["전략적인 멈춤은 단순한 휴식이 아니다","인지 능력을 높여"],"blocks":[{"t":"p","h":"not just A(단순한 A가 아니다)의 힘","x":["not just a break(단순한 휴식이 아니다)는 \"그냥 쉬는 것 이상\"이라는 뜻이다.","이상인 이유는 세미콜론(;) 뒤에 나온다. 인지 능력을 높이기 때문.","목적이 분명한 멈춤이라서 strategic(전략적인)이다.","aimless(목적 없는)를 넣으면 \"목적 없는 멈춤인데 능력을 높인다\"가 되어 스스로 부딪친다."]},{"t":"tap","h":"질문 하나","q":"필자가 그냥 break(휴식)라는 말 대신 strategic pause(전략적인 멈춤)라고 부른 이유는?","a":["노는 시간이 아니라 오후를 위해 머리를 준비시키는 시간이라는 걸 강조하려고.","앞 문장에서도 운동이 오후의 도전을 위해 준비시켜 준다고 했다."]},{"t":"p","h":"그대로 두는 두 단어","x":["straightforward(간단한)는 simple(간단한) 자리에, strengthens(강화하다)는 boosts(증진시키다) 자리에 넣어도 뜻이 그대로다."]}],"post":["strategic(전략적인) ↔ aimless(목적 없는)","그냥 쉼이 아닌 목적 있는 멈춤"]}],"quiz":[{"w":"pause","m":"잠시 멈추다","it":[["stop","멈추다","s"],["borrow","빌리다","n"],["continue","계속하다","a"],["decorate","장식하다","n"],["halt","멈추다, 중단하다","s"],["proceed","계속 진행하다","a"],["whisper","속삭이다","n"]]},{"w":"underestimate","m":"과소평가하다","it":[["harvest","수확하다","n"],["undervalue","과소평가하다","s"],["overestimate","과대평가하다","a"],["dissolve","녹이다","n"],["underrate","낮게 평가하다","s"],["overrate","과대평가하다","a"],["invite","초대하다","n"]]},{"w":"prevent","m":"막다, 방지하다","it":[["avert","막다, 피하다","s"],["admire","존경하다","n"],["allow","허락하다","a"],["polish","닦다","n"],["hinder","방해하다, 막다","s"],["permit","허용하다","a"],["measure","측정하다","n"]]},{"w":"agile","m":"민첩한","it":[["loyal","충실한","n"],["nimble","재빠른","s"],["clumsy","서투른","a"],["ancient","고대의","n"],["quick","빠른","s"],["sluggish","둔한","a"],["noisy","시끄러운","n"]]},{"w":"strategic","m":"전략적인","it":[["deliberate","의도적인","s"],["fragile","깨지기 쉬운","n"],["random","무작위의","a"],["musical","음악의","n"],["calculated","계산된, 계획적인","s"],["unplanned","계획되지 않은","a"],["rural","시골의","n"]]}]},{"items":[{"slots":[["pausing"],["refresh","exhaust","a"],["recharge"],["underestimated"],["routine"]],"opts":["refresh","confuse","burden","distract"],"or":["refresh(새롭게 하다): 뒤 recharge your energy(에너지를 재충전하다)와 짝을 이루는 회복의 말이라 맞음.","confuse(혼란스럽게 하다): 잠깐 멈추는 목적이 머리를 헷갈리게 하는 것일 리 없음.","burden(짐을 지우다): 쉬려고 멈췄는데 마음에 짐을 더 얹는다면 휴식이 아님.","distract(산만하게 하다): 뒤에서 이 휴식이 머리를 집중된 상태로 지켜 준다고 하므로 반대임."],"om":["새롭게 하다","혼란스럽게 하다","짐을 지우다","산만하게 하다"],"en":"Imagine pausing in the middle of a busy day, taking a moment to refresh your mind and recharge your energy. … These exercises create a mental oasis that refreshes and prepares you for the afternoon's challenges.","ko":"분주한 하루의 한가운데에서 잠시 멈춰, 잠깐 시간을 내어 정신을 새롭게 하고 에너지를 재충전하는 것을 상상해 보라. … 이런 운동들은 여러분을 새롭게 하고 오후의 도전에 대비시켜 주는 정신적 오아시스를 만들어 낸다.","hl":["refresh your mind","recharge your energy","refreshes"],"khl":["정신을 새롭게 하고","에너지를 재충전하는","새롭게 하고"],"blocks":[{"t":"pair","h":"같은 단어가 두 번 나온다","x":[["to refresh your mind","첫 문장: 정신을 새롭게 하려고 잠깐 멈춤"],["a mental oasis that refreshes","중간 문장: 사람을 새롭게 해 주는 정신적 쉼터"]]},{"t":"p","h":"exhaust(지치게 하다)가 틀린 이유","x":["exhaust(지치게 하다)를 넣으면 \"정신을 지치게 하고 에너지를 재충전한다\"가 된다.","한 문장 안에서 지치게 하면서 충전할 수는 없다.","뒤에서 같은 운동을 oasis(오아시스, 쉼터)라고 부르는 것도 결정적이다.","쉼터는 사람을 지치게 하는 곳이 아니다."]}],"post":["refresh(새롭게 하다) ↔ exhaust(지치게 하다)","한낮 휴식 = 정신의 오아시스"]},{"slots":[["pausing","stopping","s"],["routine","monotony","s"],["stimulate"],["tiredness","vitality","a"],["enhance"]],"opts":["tiredness","curiosity","growth","creativity"],"or":["tiredness(피로): prevent(막다)의 목적어로 막아야 할 나쁜 것이 와야 하므로 맞음.","curiosity(호기심): 두뇌를 자극하는 활동이 호기심을 막는다는 건 거꾸로임.","growth(성장): 인지적 성장을 막는다면 생산성이 오른다는 뒷말과 부딪침.","creativity(창의성): 마지막 문장에서 사고의 유연성을 키운다고 했으니 창의성을 막을 리 없음."],"om":["피로","호기심","성장","창의성"],"en":"When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day.","ko":"특히 두뇌를 자극하도록 고안된 활동으로 일상에서 벗어날 때, 여러분은 인지적 피로를 막고 남은 하루 동안의 생산성을 높인다.","hl":["prevent cognitive tiredness","stimulate your brain"],"khl":["인지적 피로를 막고","두뇌를 자극하도록"],"blocks":[{"t":"p","h":"prevent(막다) 뒤에 오는 것","x":["prevent(막다) 뒤에는 생기면 곤란한 것이 온다.","병, 사고, 피로 같은 것들.","vitality(활력)를 넣으면 \"인지적 활력을 막는다\"가 된다.","활력을 막는 휴식은 이 글이 칭찬하는 휴식이 아니다."]},{"t":"tap","h":"한 번 더 생각","q":"점심시간에 머리를 쉬게 하면 오후에 무엇이 달라질까?","a":["덜 지치고, 일이 더 잘 된다.","그래서 prevent tiredness(피로를 막다), enhance productivity(생산성을 높이다)."]},{"t":"p","h":"함정 두 개","x":["stopping(멈추는 것)은 pausing(잠시 멈추는 것)과 같은 뜻이다.","monotony(단조로움)도 routine(판에 박힌 일과) 자리에서 \"지루한 일상에서 벗어나다\"라는 뜻이 그대로 산다.","둘 다 고치면 본문 철자만 외운 것."]}],"post":["tiredness(피로) ↔ vitality(활력)","막아야 할 것 = 오후의 두뇌 피로"]},{"slots":[["stimulate","energize","s"],["prevent"],["simple"],["effective","pointless","a"],["alert"]],"opts":["effective","costly","tiring","harmful"],"or":["effective(효과적인): yet(하지만) 앞의 simple(간단한)과 대조를 이루며 휴식에 딱 맞는 이유가 되어 맞음.","costly(비용이 많이 드는): 바로 뒤 예시가 안 쓰던 손으로 밥 먹기라 돈이 들 일이 없음.","tiring(피곤하게 하는): 피로를 막는 휴식에 딱 맞다는 말과 반대임.","harmful(해로운): 해로운 운동을 휴식 시간에 완벽하다고 권할 수 없음."],"om":["효과적인","비용이 많이 드는","피곤하게 하는","해로운"],"en":"Neurobic exercises — simple yet effective — are perfect for such breaks.","ko":"간단하지만 효과적인 뉴로빅 운동은 그런 휴식에 안성맞춤이다.","hl":["simple yet effective","are perfect for such breaks"],"khl":["간단하지만 효과적인","안성맞춤이다"],"blocks":[{"t":"p","h":"yet(하지만)이 정하는 방향","x":["simple yet(간단하지만) 다음 빈자리에서 yet(하지만)은 앞과 다른 느낌의 말을 부른다.","간단하다는 건 \"별거 아닐 것 같다\"는 느낌이다.","그 뒤엔 \"그런데도 효과는 있다\"가 와야 대조가 산다.","pointless(쓸모없는)를 넣으면 \"간단하지만 쓸모없는데 휴식에 완벽하다\"가 되어 말이 안 된다."]},{"t":"p","h":"그대로 두는 단어","x":["energize(활기를 북돋우다)는 stimulate(자극하다) 자리에 넣어도 두뇌를 깨운다는 뜻이 같다."]}],"post":["effective(효과적인) ↔ pointless(쓸모없는)","뉴로빅 운동 = 간단하지만 효과적"]},{"slots":[["agile"],["strategic"],["boosts","weakens","a"],["sharp"],["focused"]],"opts":["boosts","limits","wastes","hides"],"or":["boosts(증진시키다): 그 결과 머리가 또렷하고 집중된 상태로 유지된다는 뒷말과 이어져 맞음.","limits(제한하다): 능력을 묶어 두면 머리가 또렷하게 유지될 수 없음.","wastes(낭비하다): 능력을 허비하는 멈춤을 전략적이라고 부를 수 없음.","hides(숨기다): 능력을 숨긴다는 말은 머리가 더 잘 돌아간다는 결과와 이어지지 않음."],"om":["증진시키다","제한하다","낭비하다","숨기다"],"en":"This strategic pause is not just a break; it boosts your cognitive capabilities, ensuring your mind remains sharp and focused.","ko":"이 전략적인 멈춤은 단순한 휴식이 아니다. 그것은 여러분의 인지 능력을 높여 주어, 정신이 또렷하고 집중된 상태로 유지되도록 해 준다.","hl":["boosts your cognitive capabilities","ensuring your mind remains sharp and focused"],"khl":["인지 능력을 높여","또렷하고 집중된 상태로 유지되도록"],"blocks":[{"t":"p","h":"뒤따라오는 결과에서 거꾸로 보기","x":["ensuring(확실히 ~하게 하면서) 뒤는 앞 행동의 결과다.","결과가 \"머리가 또렷하고 집중된 상태\"다.","능력이 올라가야 이런 결과가 나온다.","weakens(약화시키다)를 넣으면 능력은 약해졌는데 머리는 또렷해진다는 이상한 말이 된다."]}],"post":["boost(증진시키다) ↔ weaken(약화시키다)","전략적 멈춤 → 인지 능력 상승"]},{"slots":[["effective","powerful","s"],["strategic","deliberate","s"],["sharp"],["focused"],["flexibility","rigidity","a"]],"opts":["flexibility","confusion","anxiety","laziness"],"or":["flexibility(유연성): 평소 안 쓰던 길을 깨우니 생각이 한쪽으로 굳지 않고 넓어져 맞음.","confusion(혼란): 뇌에 도전을 주는 좋은 전환이라 했으니 생각이 혼란스러워질 리 없음.","anxiety(불안): 휴식의 효과로 불안이 커진다는 말은 글 전체의 칭찬과 반대임.","laziness(게으름): 잠든 길을 깨워 활발하게 만드는데 생각이 게을러질 수 없음."],"om":["유연성","혼란","불안","게으름"],"en":"Start with using your non-dominant hand for routine tasks like writing or eating. This simple switch challenges your brain, activating pathways that aren't typically engaged and promoting greater flexibility in thinking.","ko":"글쓰기나 식사 같은 일상적인 일에 평소 잘 쓰지 않는 손을 쓰는 것부터 시작하라. 이 간단한 전환은 뇌에 도전을 주어, 보통은 쓰이지 않는 경로를 활성화하고 사고의 유연성을 더 키워 준다.","hl":["greater flexibility in thinking","activating pathways that aren't typically engaged"],"khl":["사고의 유연성을 더 키워","보통은 쓰이지 않는 경로를 활성화하고"],"blocks":[{"t":"p","h":"안 쓰던 손이 주는 그림","x":["오른손잡이가 왼손으로 숟가락질을 해 본다고 생각해 보자.","뇌는 평소 안 다니던 길을 새로 써야 한다.","늘 다니던 길만 쓰던 뇌가 다른 길도 쓸 줄 알게 된다.","이게 생각이 말랑말랑해지는 것, 즉 flexibility(유연성)다."]},{"t":"p","h":"rigidity(경직성)가 틀린 이유","x":["rigidity(경직성)를 넣으면 \"새 길을 깨웠더니 생각이 더 굳었다\"가 된다.","새로운 길을 여는 일과 생각이 굳는 일은 정반대다.","powerful(강력한)과 deliberate(의도적인)는 각각 effective(효과적인), strategic(전략적인)과 같은 방향이라 그대로 둔다."]}],"post":["flexibility(유연성) ↔ rigidity(경직성)","안 쓰던 손으로 밥 먹기 = 잠든 뇌 길 깨우기"]}],"quiz":[{"w":"refresh","m":"새롭게 하다, 상쾌하게 하다","it":[["punish","벌주다","n"],["renew","새롭게 하다","s"],["exhaust","지치게 하다","a"],["melt","녹다","n"],["revive","되살리다","s"],["tire","지치게 하다","a"],["rent","빌리다","n"]]},{"w":"tiredness","m":"피로","it":[["fatigue","피로","s"],["kindness","친절","n"],["energy","에너지, 활력","a"],["geography","지리","n"],["exhaustion","탈진, 기진맥진","s"],["vitality","활력","a"],["furniture","가구","n"]]},{"w":"effective","m":"효과적인","it":[["wooden","나무로 된","n"],["efficient","효율적인","s"],["ineffective","효과 없는","a"],["polite","공손한","n"],["productive","생산적인, 성과를 내는","s"],["useless","쓸모없는","a"],["annual","해마다의","n"]]},{"w":"boost","m":"증진시키다, 끌어올리다","it":[["increase","늘리다","s"],["pronounce","발음하다","n"],["reduce","줄이다","a"],["sew","바느질하다","n"],["raise","올리다","s"],["decrease","줄이다","a"],["greet","인사하다","n"]]},{"w":"flexibility","m":"유연성","it":[["honesty","정직","n"],["adaptability","적응력","s"],["rigidity","경직성","a"],["loneliness","외로움","n"],["versatility","다재다능함, 융통성","s"],["stiffness","뻣뻣함","a"],["punctuality","시간 엄수","n"]]}]}],"no":"24"},{"id":"2510g2-29","title":"어휘특훈 · 25년 10월 고2 29번","sub":"세포 분열의 실수가 진화를 만든다","tpl":"When a cell divides, the genomes of its two daughters are often not quite {identical} to each other or to that of the parent cell. On {rare} occasions, the error may represent a change for the {better}; more probably, it will cause no {significant} difference in the cell's {prospects}. But in some cases, the error will cause {serious} damage: for example, by {disrupting} the coding sequence for a {key} protein. Changes due to mistakes of the first type will tend to be {perpetuated}, because the altered cell has {an_increased} likelihood of reproducing itself. Changes due to mistakes of the second type—{neutral} changes—may be perpetuated or not: it is a matter of {chance} whether the altered cell or its cousins will {succeed}. But changes that cause serious damage {lead_nowhere}: the cell that suffers them {dies}, leaving no {progeny}. Through {endless} repetition of this cycle of mutation and natural selection organisms {evolve}: their genetic specifications change, sometimes giving organisms new ways to exploit the environment more effectively, to survive in competition with others, and to reproduce successfully.","fn":["*genome: 유전체(한 생물이 가진 유전 정보 전체)","*coding sequence: (단백질을 만드는) 암호 서열","*mutation: 돌연변이","*natural selection: 자연 선택","*specification: 세부 특성, 명세"],"mean":{"identical":"동일한, 똑같은","equivalent":"동등한, 같은","rare":"드문","frequent":"잦은, 빈번한","better":"더 나은 것. for the better = 더 좋은 쪽으로","worse":"더 나쁜 것. for the worse = 더 나쁜 쪽으로","significant":"의미 있는, 상당한","meaningful":"의미 있는","prospects":"명사 prospect(전망, 앞날)의 복수형","outlook":"전망, 앞날","serious":"심각한","severe":"극심한, 심각한","minor":"사소한, 가벼운","disrupting":"동사 disrupt(망가뜨리다, 혼란에 빠뜨리다)의 -ing형. 전치사 by 뒤 동명사","protecting":"동사 protect(보호하다)의 -ing형. 동명사","key":"핵심적인, 아주 중요한","crucial":"아주 중요한, 결정적인","perpetuated":"동사 perpetuate(영속시키다, 계속 이어지게 하다)의 과거분사형. be p.p. 수동태","preserved":"동사 preserve(보존하다)의 과거분사형. be p.p. 수동태","eliminated":"동사 eliminate(제거하다)의 과거분사형. be p.p. 수동태","an increased":"증가한(an은 모음 소리 앞의 관사)","a reduced":"줄어든(reduced는 자음 소리로 시작해 a)","neutral":"중립적인, 좋지도 나쁘지도 않은","harmful":"해로운","chance":"우연, 운","luck":"운","certainty":"확실성, 필연","succeed":"성공하다","thrive":"번성하다, 잘 자라다","lead nowhere":"아무 데도 이르지 못하다, 아무 결과도 남기지 못하다","come to nothing":"아무 결과도 없이 끝나다","spread":"퍼지다","dies":"동사 die(죽다)의 3인칭 단수 현재형","perishes":"동사 perish(죽다, 소멸하다)의 3인칭 단수 현재형","flourishes":"동사 flourish(번성하다)의 3인칭 단수 현재형","progeny":"자손","offspring":"자손, 새끼","ancestors":"명사 ancestor(조상)의 복수형","endless":"끝없는","ceaseless":"끊임없는","evolve":"진화하다","stagnate":"정체되다, 발전 없이 머물다"},"comp":[{"no":"29","slots":[["succeed"],["lead_nowhere","spread","a"],["dies"],["progeny","offspring","s"],["endless"]],"opts":["lead_nowhere","pay_off","take_over","catch_on"],"or":["lead nowhere(아무 데도 이르지 못하다): 콜론 뒤에서 세포가 죽고 자손도 없다고 설명하니 맞음.","pay off(성과를 내다): 세포가 죽어 버리는 변화가 성과를 낸다는 건 거꾸로임.","take over(장악하다): 자손 없이 죽는 세포의 변화가 무리를 장악할 수 없음.","catch on(널리 퍼지다): 다음 세대로 넘어가지 못하니 널리 퍼질 수 없음."],"om":["아무 데도 이르지 못하다","성과를 내다","장악하다","널리 퍼지다"],"en":"But changes that cause serious damage lead nowhere: the cell that suffers them dies, leaving no progeny.","ko":"그러나 심각한 손상을 일으키는 변화는 아무 데도 이르지 못한다. 그런 변화를 겪은 세포는 죽어서 자손을 남기지 않기 때문이다.","hl":["lead nowhere","leaving no progeny"],"khl":["아무 데도 이르지 못한다","자손을 남기지 않기"],"blocks":[{"t":"p","h":"콜론(:) 뒤가 앞을 풀어 준다","x":["콜론 뒤는 앞말의 설명이다.","설명: 세포가 죽는다. 자손도 없다.","그럼 그 변화는 다음 세대로 한 칸도 못 간다.","spread(퍼지다)를 넣으면 \"퍼진다. 왜냐하면 세포가 죽으니까\"가 되어 설명이 거꾸로 붙는다."]},{"t":"p","h":"그대로 두는 단어","x":["offspring(자손)은 progeny(자손)와 같은 뜻이다.","leaving no offspring(자손을 남기지 않고)은 아주 흔한 표현이다."]}],"post":["lead nowhere(아무 데도 이르지 못하다) ↔ spread(퍼지다)","심각한 손상 → 세포 죽음 → 자손 없음"]},{"no":"29","slots":[["chance"],["succeed"],["dies"],["endless","ceaseless","s"],["evolve","stagnate","a"]],"opts":["evolve","vanish","freeze","retreat"],"or":["evolve(진화하다): 콜론 뒤에서 유전적 특성이 바뀌고 새로운 생존 방법이 생긴다고 하니 맞음.","vanish(사라지다): 더 잘 살아남고 번식하는 방법을 얻는데 사라질 리 없음.","freeze(얼어붙다, 멈추다): 유전적 특성이 계속 바뀐다는 콜론 뒤 설명과 반대임.","retreat(물러나다): 환경을 더 잘 이용하게 된다는 말은 앞으로 나아가는 쪽이라 맞지 않음."],"om":["진화하다","사라지다","얼어붙다, 멈추다","물러나다"],"en":"Through endless repetition of this cycle of mutation and natural selection organisms evolve: their genetic specifications change, sometimes giving organisms new ways to exploit the environment more effectively, to survive in competition with others, and to reproduce successfully.","ko":"돌연변이와 자연 선택이라는 이 순환이 끝없이 반복되면서 생물은 진화한다. 그들의 유전적 특성이 바뀌고, 때로는 생물에게 환경을 더 효과적으로 이용하고, 다른 생물과의 경쟁에서 살아남고, 성공적으로 번식할 새로운 방법을 주기도 한다.","hl":["organisms evolve","their genetic specifications change"],"khl":["생물은 진화한다","유전적 특성이 바뀌고"],"blocks":[{"t":"flow","h":"글 전체가 모이는 자리","x":["세포가 나뉠 때 복사 실수가 생김","좋은 실수: 이어짐","중립 실수: 운에 맡김","나쁜 실수: 사라짐","이걸 끝없이 반복 → 생물이 진화"],"at":4},{"t":"p","h":"stagnate(정체되다)를 넣고 다시 읽기","x":["\"생물은 제자리에 머문다. 유전적 특성이 바뀐다.\"","머물러 있는데 바뀐다는 말은 서로 부딪친다.","ceaseless(끊임없는)는 endless(끝없는)와 같은 뜻이라 손댈 곳이 아니다."]}],"post":["evolve(진화하다) ↔ stagnate(정체되다)","돌연변이 + 자연 선택의 끝없는 반복 = 진화"]}],"compquiz":[{"w":"lead nowhere","m":"아무 데도 이르지 못하다","it":[["come to nothing","아무 결과도 없이 끝나다","s"],["take after","닮다","n"],["succeed","성공하다","a"],["put off","미루다","n"],["go nowhere","아무 진전이 없다","s"],["pay off","성과를 내다","a"],["look up to","존경하다","n"]]},{"w":"evolve","m":"진화하다","it":[["borrow","빌리다","n"],["develop","발달하다","s"],["stagnate","정체되다","a"],["decorate","장식하다","n"],["progress","진보하다","s"],["regress","퇴보하다","a"],["whisper","속삭이다","n"]]}],"sets":[{"items":[{"slots":[["identical"],["rare","frequent","a"],["better"],["significant"],["prospects"]],"opts":["rare","regular","countless","ordinary"],"or":["rare(드문): 세미콜론 뒤 more probably(더 높은 확률로)와 대비되어 좋은 변화는 드물다는 뜻이 되므로 맞음.","regular(정기적인): 실수가 정해진 때마다 좋은 변화가 된다는 건 우연한 실수와 맞지 않음.","countless(셀 수 없이 많은): 좋은 변화가 아주 많다면 \"그보다는 차이 없는 경우가 더 많다\"와 부딪침.","ordinary(평범한): '평범한 경우에 더 좋은 변화'라면 뒤의 더 흔한 경우와 대비가 사라짐."],"om":["드문","정기적인","셀 수 없이 많은","평범한"],"en":"On rare occasions, the error may represent a change for the better; more probably, it will cause no significant difference in the cell's prospects.","ko":"드물게는 그 오류가 더 나은 쪽으로의 변화가 될 수도 있다. 하지만 그보다 더 가능성 높은 것은, 그 오류가 세포의 앞날에 별다른 차이를 만들지 않는 것이다.","hl":["On rare occasions","more probably"],"khl":["드물게는","더 가능성 높은 것은"],"blocks":[{"t":"p","h":"more probably(더 가능성 높게)가 정하는 방향","x":["세미콜론 앞뒤가 저울처럼 놓여 있다.","앞: 좋은 변화가 되는 경우.","뒤: 아무 차이 없는 경우. 이쪽이 more probably(더 가능성 높게).","그러니 앞쪽은 덜 자주 일어나는 쪽이어야 한다.","frequent(잦은)를 넣으면 \"자주 좋아지지만, 그보다 더 흔한 건 차이 없음\"이 되어 저울이 꼬인다."]},{"t":"p","h":"상식으로 확인","x":["복사 실수가 운 좋게 더 좋은 결과를 내는 일.","로또 당첨처럼 드문 일이다."]}],"post":["rare(드문) ↔ frequent(잦은)","좋은 실수는 드묾, 차이 없는 실수가 더 흔함"]},{"slots":[["identical","equivalent","s"],["significant","meaningful","s"],["serious","minor","a"],["disrupting"],["key"]],"opts":["serious","slight","temporary","invisible"],"or":["serious(심각한): 핵심 단백질의 암호를 망가뜨리는 예시, 그리고 뒤의 세포가 죽는 결과와 맞음.","slight(약간의): 핵심 단백질 암호가 망가지는 일을 약간의 손상이라 할 수 없음.","temporary(일시적인): 뒤에서 이 손상을 겪은 세포는 죽는다고 하니 잠깐 지나가는 손상이 아님.","invisible(눈에 보이지 않는): 보이는지 아닌지는 이 글의 기준이 아니고, 결과가 세포의 죽음이라 정도가 핵심임."],"om":["심각한","약간의","일시적인","눈에 보이지 않는"],"en":"But in some cases, the error will cause serious damage: for example, by disrupting the coding sequence for a key protein.","ko":"그러나 어떤 경우에는 그 오류가 심각한 손상을 일으킬 것이다. 예를 들어, 핵심 단백질의 암호 서열을 망가뜨림으로써 그렇게 된다.","hl":["serious damage","disrupting the coding sequence for a key protein"],"khl":["심각한 손상","핵심 단백질의 암호 서열을 망가뜨림으로써"],"blocks":[{"t":"flow","h":"실수의 세 갈래","x":["드물게: 더 좋아짐","대부분: 별 차이 없음","어떤 경우: 크게 망가짐"],"at":2},{"t":"p","h":"같은 말이 뒤에서 다시 나온다","x":["두 문장 뒤에 changes that cause serious damage(심각한 손상을 일으키는 변화)가 또 나온다.","그 결과는 세포의 죽음이다.","minor(사소한)를 넣으면 세 번째 갈래가 \"가벼운 손상\"이 되어 뒤의 죽음과 이어지지 않는다.","But(그러나)도 앞의 \"별 차이 없음\"과 반대되는 큰 피해를 부른다."]},{"t":"p","h":"함정 두 개","x":["equivalent(동등한)는 identical(동일한)과, meaningful(의미 있는)은 significant(의미 있는)와 같은 뜻이다.","둘 다 그대로 두어야 한다."]}],"post":["serious(심각한) ↔ minor(사소한)","핵심 단백질 암호 망가짐 = 심각한 손상"]},{"slots":[["key","crucial","s"],["perpetuated","eliminated","a"],["an_increased"],["neutral"],["chance"]],"opts":["perpetuated","reversed","ignored","weakened"],"or":["perpetuated(영속되는): because(왜냐하면) 뒤에 바뀐 세포가 더 잘 복제된다고 하니 그 변화가 계속 이어지는 게 맞음.","reversed(되돌려지는): 더 잘 번식하는 세포의 변화가 원래대로 되돌아갈 이유가 없음.","ignored(무시되는): 변화가 무시된다는 말은 번식 가능성이 높아진다는 이유와 이어지지 않음.","weakened(약해지는): 더 많이 복제될수록 그 변화는 더 퍼지지, 약해지지 않음."],"om":["영속되는","되돌려지는","무시되는","약해지는"],"en":"Changes due to mistakes of the first type will tend to be perpetuated, because the altered cell has an increased likelihood of reproducing itself.","ko":"첫 번째 유형의 실수로 생긴 변화는 계속 이어지는 경향이 있을 것이다. 변화된 세포가 자신을 복제할 가능성이 커지기 때문이다.","hl":["tend to be perpetuated","an increased likelihood of reproducing itself"],"khl":["계속 이어지는","복제할 가능성이 커지기"],"blocks":[{"t":"pair","h":"이유와 결과 나란히","x":[["because the altered cell has an increased likelihood of reproducing itself","이유: 바뀐 세포가 자기 복제를 더 잘하게 됨"],["Changes … will tend to be perpetuated","결과: 그 변화가 대대로 이어짐"]]},{"t":"p","h":"eliminated(제거되는)가 틀린 이유","x":["eliminated(제거되는)를 넣으면 \"더 잘 번식하니까 사라진다\"가 된다.","번식을 잘하면 그 세포는 늘어난다.","늘어나는 세포에 담긴 변화도 함께 늘어난다.","첫 번째 유형은 앞에서 말한 a change for the better(더 좋은 쪽으로의 변화)다."]},{"t":"p","h":"그대로 두는 단어","x":["crucial(아주 중요한)은 key(핵심적인)와 같은 뜻이고, a crucial protein(아주 중요한 단백질)도 자연스럽다."]}],"post":["perpetuated(영속되는) ↔ eliminated(제거되는)","좋은 실수 → 번식 유리 → 대대로 이어짐"]},{"slots":[["neutral"],["chance","certainty","a"],["succeed"],["lead_nowhere"],["dies"]],"opts":["chance","effort","skill","planning"],"or":["chance(우연): 바로 앞 may be perpetuated or not(이어질 수도, 아닐 수도 있다)과 딱 맞음.","effort(노력): 세포가 노력해서 성공한다는 말은 이 글의 설명 방식과 맞지 않음.","skill(기술): 중립적인 변화는 세포에 아무 차이도 주지 않으니 실력으로 갈릴 수 없음.","planning(계획): 누군가 계획해서 정한다는 말은 \"될 수도, 안 될 수도\"와 부딪침."],"om":["우연","노력","기술","계획"],"en":"Changes due to mistakes of the second type—neutral changes—may be perpetuated or not: it is a matter of chance whether the altered cell or its cousins will succeed.","ko":"두 번째 유형의 실수로 생긴 변화, 즉 중립적인 변화는 이어질 수도 있고 그렇지 않을 수도 있다. 변화된 세포가 성공할지 그 사촌 세포가 성공할지는 우연의 문제이다.","hl":["a matter of chance","may be perpetuated or not"],"khl":["우연의 문제","이어질 수도 있고 그렇지 않을 수도"],"blocks":[{"t":"tap","h":"질문 하나","q":"좋지도 나쁘지도 않은 변화를 가진 세포와 그 사촌 세포. 누가 살아남을지 무엇이 정할까?","a":["아무것도 정하지 않는다. 둘 사이에 차이가 없으니까.","그래서 그때그때 운이다.","이것이 a matter of chance(우연의 문제)다."]},{"t":"p","h":"certainty(확실성)를 넣고 다시 읽기","x":["\"이어질 수도, 아닐 수도 있다. 그건 확실한 문제다.\"","콜론 앞은 \"모른다\"인데 콜론 뒤가 \"확실하다\"가 된다.","콜론 뒤는 앞의 설명이어야 하니 서로 부딪친다."]}],"post":["chance(우연) ↔ certainty(확실성)","중립 변화 = 살아남을지는 운"]},{"slots":[["prospects","outlook","s"],["succeed","thrive","s"],["dies","flourishes","a"],["progeny"],["endless"]],"opts":["dies","divides","grows","survives"],"or":["dies(죽다): 바로 뒤 leaving no progeny(자손을 남기지 않고)와 이어지고 lead nowhere(아무 데도 이르지 못하다)를 설명하므로 맞음.","divides(분열하다): 분열하면 자손 세포가 생기므로 자손이 없다는 말과 부딪침.","grows(자라다): 심각한 손상을 입은 세포가 자란다는 건 앞의 serious damage(심각한 손상)와 반대임.","survives(살아남다): 살아남는다면 변화가 아무 데도 이르지 못한다는 앞말과 맞지 않음."],"om":["죽다","분열하다","자라다","살아남다"],"en":"But changes that cause serious damage lead nowhere: the cell that suffers them dies, leaving no progeny.","ko":"그러나 심각한 손상을 일으키는 변화는 아무 데도 이르지 못한다. 그런 변화를 겪은 세포는 죽어서 자손을 남기지 않기 때문이다.","hl":["the cell that suffers them dies","leaving no progeny"],"khl":["그런 변화를 겪은 세포는 죽어서","자손을 남기지 않기"],"blocks":[{"t":"p","h":"뒤따라오는 결과에서 거꾸로 보기","x":["leaving no progeny(자손을 남기지 않고)는 앞 동사의 결과다.","자손이 없다는 건 그 세포에서 대가 끊겼다는 뜻이다.","flourishes(번성하다)를 넣으면 \"번성해서 자손을 하나도 남기지 않는다\"가 된다.","번성하는데 자손이 없을 수는 없다."]},{"t":"p","h":"그대로 두는 두 단어","x":["outlook(전망)은 prospects(앞날, 전망)와 같은 뜻이다.","thrive(번성하다)는 succeed(성공하다) 자리에서 \"누가 잘 살아남을지\"라는 뜻으로 자연스럽다.","thrive(번성하다)가 맞는 자리에 있으니 flourishes(번성하다)도 맞겠지 하고 넘어가면 함정에 걸린다."]}],"post":["die(죽다) ↔ flourish(번성하다)","심각한 손상 = 세포 죽음, 대 끊김"]}],"quiz":[{"w":"rare","m":"드문","it":[["uncommon","흔하지 않은","s"],["loud","시끄러운","n"],["common","흔한","a"],["wooden","나무로 된","n"],["infrequent","드문","s"],["frequent","잦은","a"],["honest","정직한","n"]]},{"w":"serious","m":"심각한","it":[["musical","음악의","n"],["severe","극심한","s"],["minor","사소한","a"],["punctual","시간을 잘 지키는","n"],["grave","중대한","s"],["slight","약간의","a"],["rural","시골의","n"]]},{"w":"perpetuate","m":"영속시키다, 계속 이어지게 하다","it":[["sustain","지속시키다","s"],["decorate","장식하다","n"],["abolish","폐지하다","a"],["whisper","속삭이다","n"],["preserve","보존하다","s"],["discontinue","중단하다","a"],["borrow","빌리다","n"]]},{"w":"chance","m":"우연, 운","it":[["furniture","가구","n"],["luck","운","s"],["design","의도, 계획","a"],["geography","지리","n"],["fortune","운","s"],["intention","의도","a"],["kindness","친절","n"]]},{"w":"die","m":"죽다","it":[["perish","죽다, 소멸하다","s"],["sew","바느질하다","n"],["survive","살아남다","a"],["translate","번역하다","n"],["expire","숨을 거두다, 끝나다","s"],["live","살다","a"],["rent","빌리다","n"]]}]},{"items":[{"slots":[["identical"],["rare"],["better","worse","a"],["significant"],["prospects"]],"opts":["better","weaker","slower","smaller"],"or":["better(더 나은 것): 두 문장 뒤 첫 번째 유형의 변화가 번식에 유리해 이어진다고 하니 좋은 쪽 변화가 맞음.","weaker(더 약한 것): 약해진 세포가 복제할 가능성이 커진다는 뒷말과 부딪침.","slower(더 느린 것): 더 느려지는 변화는 번식 가능성이 커진다는 첫 번째 유형의 설명과 맞지 않음.","smaller(더 작은 것): 크기 이야기는 글에 없고, 이 자리는 좋고 나쁨의 방향을 정하는 자리임."],"om":["더 나은 것","더 약한 것","더 느린 것","더 작은 것"],"en":"On rare occasions, the error may represent a change for the better; … Changes due to mistakes of the first type will tend to be perpetuated, because the altered cell has an increased likelihood of reproducing itself.","ko":"드물게는 그 오류가 더 나은 쪽으로의 변화가 될 수도 있다. … 첫 번째 유형의 실수로 생긴 변화는 계속 이어지는 경향이 있을 것이다. 변화된 세포가 자신을 복제할 가능성이 커지기 때문이다.","hl":["a change for the better","the first type"],"khl":["더 나은 쪽으로의 변화","첫 번째 유형"],"blocks":[{"t":"pair","h":"첫 번째 유형이 무엇인지 짝 맞추기","x":[["a change for the better","첫 번째로 소개된 실수: 더 좋은 쪽 변화"],["the altered cell has an increased likelihood of reproducing itself","첫 번째 유형의 결과: 번식 가능성이 커짐"]]},{"t":"p","h":"worse(더 나쁜 것)를 넣으면","x":["a change for the worse(더 나쁜 쪽으로의 변화)가 첫 번째 유형이 된다.","그런데 그 유형의 세포가 더 잘 번식한다고 한다.","나빠진 세포가 더 잘 번식할 수는 없다.","게다가 나쁜 쪽 변화는 세 번째 갈래 serious damage(심각한 손상)에서 따로 나온다."]}],"post":["better(더 나은 것) ↔ worse(더 나쁜 것)","첫 번째 유형 = 좋은 쪽 실수, 번식에 유리"]},{"slots":[["serious","severe","s"],["disrupting","protecting","a"],["key"],["perpetuated","preserved","s"],["an_increased"]],"opts":["disrupting","repairing","strengthening","completing"],"or":["disrupting(망가뜨리는 것): 콜론 앞 serious damage(심각한 손상)의 예시라 망가뜨리는 일이어야 맞음.","repairing(고치는 것): 암호를 고치는 일은 손상의 예시가 될 수 없음.","strengthening(강화하는 것): 암호를 튼튼하게 하는 건 손상과 반대 방향임.","completing(완성하는 것): 암호를 완성한다는 말은 심각한 손상의 예로 맞지 않음."],"om":["망가뜨리는 것","고치는 것","강화하는 것","완성하는 것"],"en":"But in some cases, the error will cause serious damage: for example, by disrupting the coding sequence for a key protein.","ko":"그러나 어떤 경우에는 그 오류가 심각한 손상을 일으킬 것이다. 예를 들어, 핵심 단백질의 암호 서열을 망가뜨림으로써 그렇게 된다.","hl":["by disrupting the coding sequence","serious damage"],"khl":["암호 서열을 망가뜨림으로써","심각한 손상"],"blocks":[{"t":"p","h":"for example(예를 들어)은 앞을 증명한다","x":["콜론 뒤 for example(예를 들어)은 앞말 serious damage(심각한 손상)의 예다.","예시는 손상이 어떻게 생기는지를 보여 줘야 한다.","protecting(보호하는 것)을 넣으면 \"심각한 손상, 예를 들어 핵심 단백질 암호를 보호해서\"가 된다.","보호가 손상의 예가 될 수는 없다."]},{"t":"p","h":"요리책 비유","x":["coding sequence(암호 서열)는 단백질을 만드는 요리법 같은 것이다.","중요한 요리법의 글자가 엉망이 되면 그 요리는 못 만든다.","그래서 세포가 크게 다친다."]},{"t":"p","h":"함정 두 개","x":["severe(극심한)는 serious(심각한)와, preserved(보존되는)는 perpetuated(영속되는)와 같은 방향이다.","손대면 안 되는 자리다."]}],"post":["disrupt(망가뜨리다) ↔ protect(보호하다)","핵심 단백질 요리법이 엉망 = 심각한 손상"]},{"slots":[["perpetuated"],["an_increased","a reduced","a"],["neutral"],["chance","luck","s"],["succeed"]],"opts":["an_increased","a_limited","a_minimal","an_uncertain"],"or":["an increased(증가한): 좋은 쪽 변화가 이어지는 이유이므로 번식 가능성은 커져야 맞음.","a limited(제한된): 번식 가능성이 묶여 있다면 그 변화가 대대로 이어질 이유가 없음.","a minimal(최소한의): 번식 가능성이 아주 작다면 변화가 퍼지는 게 아니라 끊김.","an uncertain(불확실한): 불확실하다는 건 중립 변화의 설명이지, 반드시 이어진다는 첫 번째 유형의 이유가 아님."],"om":["증가한","제한된","최소한의","불확실한"],"en":"Changes due to mistakes of the first type will tend to be perpetuated, because the altered cell has an increased likelihood of reproducing itself.","ko":"첫 번째 유형의 실수로 생긴 변화는 계속 이어지는
