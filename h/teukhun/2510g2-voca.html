humb that can {help}. In most butterflies the antennae end with a small club-shaped swelling, whereas in moths they are usually feathery or narrow to a fine tip. Butterflies tend to rest with their wings held {shut} above their body, whereas moths more usually rest with the upper sides of the wings on full view. {Further} distinctions can be made by looking for a {tiny} hook that {joins} fore- and hindwings, a feature only present in moths. The {stereotypical} differences, with moths cast as the {gloomy}, {nocturnal} cousins of {colourful} sun-loving butterflies are simply {wrong}. There are many {brightly} coloured moths and many which are {active} throughout the day. {Equally}, there are a few nocturnal butterflies and plenty that come clothed in shades of brown and grey. It's more {sensible} to think of them {together}: both butterflies and moths are beautiful and {fascinating} insects.","fn":["*rule of thumb: 경험에서 나온 대략적인 방법, 요령","*antennae: 더듬이(antenna의 복수형)","*club-shaped swelling: 곤봉 모양의 혹","*fore- and hindwings: 앞날개와 뒷날개","*nocturnal: 야행성의"],"mean":{"easy":"쉬운","simple":"간단한, 쉬운","challenging":"힘든, 까다로운","straightforward":"간단한, 복잡하지 않은","help":"도움이 되다","shut":"닫힌(동사 shut(닫다)의 과거분사형. 원형과 모양이 같음)","open":"열린, 펼쳐진","closed":"닫힌(동사 close(닫다)의 과거분사형)","Further":"그 이상의, 추가의","Additional":"추가의","tiny":"아주 작은","small":"작은","joins":"동사 join(잇다, 연결하다)의 3인칭 단수 현재형","separates":"동사 separate(분리하다, 떼어 놓다)의 3인칭 단수 현재형","stereotypical":"고정관념의, 판에 박힌","accurate":"정확한","conventional":"통념적인, 흔히 생각하는","gloomy":"우중충한, 우울한","cheerful":"쾌활한, 밝은","dull":"(색이) 칙칙한, 흐릿한","nocturnal":"야행성의, 밤에 활동하는","diurnal":"주행성의, 낮에 활동하는","colourful":"색이 화려한(영국식 철자. 미국식은 colorful)","vibrant":"선명한, 생기 넘치는","wrong":"틀린","mistaken":"잘못된, 틀린","valid":"타당한","brightly":"밝게","darkly":"어둡게","vividly":"선명하게","active":"활동하는, 활동적인","dormant":"활동을 멈춘, 잠든","Equally":"마찬가지로","Likewise":"마찬가지로","sensible":"합리적인, 분별 있는","foolish":"어리석은","together":"함께","separately":"따로","fascinating":"매력적인, 매혹적인","boring":"지루한","c : 날개를 납작하게 펴면 윗면이 보여 나방과 같아지고 whereas(~인 반면)의 대비가 사라짐.","outspread(활짝 펼친): 날개를 활짝 펼치면 나방의 쉬는 모습과 똑같아짐.","unfolded(펼쳐진): 펼친 날개는 나방 쪽 특징이라 나비를 구별하는 요령이 될 수 없음."],"om":["닫힌","납작하게 편","활짝 펼친","펼쳐진"],"en":"Butterflies tend to rest with their wings held shut above their body, whereas moths more usually rest with the upper sides of the wings on full view.","ko":"나비는 날개를 몸 위로 닫은 채 쉬는 경향이 있는 반면, 나방은 날개 윗면을 다 드러낸 채 쉬는 경우가 더 많다.","hl":["wings held shut","whereas"],"khl":["날개를 몸 위로 닫은 채","반면"],"blocks":[{"t":"pair","h":"whereas(~인 반면) 양쪽 나란히","x":[["Butterflies … wings held shut above their body","나비: 날개를 몸 위로 닫고 쉰다"],["moths … the upper sides of the wings on full view","나방: 날개 윗면을 다 펼쳐 보인다"]]},{"t":"p","h":"open(열린)을 넣으면","x":["나비도 날개를 펼치고 쉬는 셈이 된다.","그러면 날개 윗면이 다 보이는 나방과 똑같아진다.","whereas(~인 반면)는 서로 다른 점을 잇는 말이다.","둘이 같으면 구별 요령이 될 수 없다."]},{"t":"p","h":"고칠 필요 없는 두 단어","x":["simple(간단한)은 easy(쉬운) 자리에서 \"항상 간단하지는 않다\"로 뜻이 같다.","small(작은)은 tiny(아주 작은)보다 정도만 약할 뿐 작은 갈고리라는 그림은 그대로다."]}],"post":["shut(닫힌) ↔ open(열린)","나비 = 날개 닫고 휴식, 나방 = 날개 펴고 휴식"]},{"slots":[["joins"],["stereotypical","accurate","a"],["gloomy"],["colourful","vibrant","s"],["wrong"]],"opts":["stereotypical","factual","proven","genuine"],"or":["stereotypical(고정관념의): 바로 뒤에서 '그야말로 틀렸다'고 판정하니 사람들이 흔히 믿는 판에 박힌 차이여야 맞음.","factual(사실에 근거한): 사실에 근거한 차이가 틀렸다는 건 한 문장 안에서 스스로 부딪침.","proven(증명된): 이미 증명된 차이라면 '그야말로 틀렸다'고 할 수 없음.","genuine(진짜의): 진짜 차이가 틀렸다는 말은 앞뒤가 맞지 않음."],"om":["고정관념의","사실에 근거한","증명된","진짜의"],"en":"The stereotypical differences, with moths cast as the gloomy, nocturnal cousins of colourful sun-loving butterflies are simply wrong.","ko":"나방을 색이 화려하고 해를 좋아하는 나비의 우중충한 야행성 사촌으로 그리는 고정관념 속 차이는 그야말로 틀렸다.","hl":["The stereotypical differences","simply wrong"],"khl":["고정관념 속 차이","그야말로 틀렸다"],"blocks":[{"t":"p","h":"주어와 서술어 맞대 보기","x":["이 문장의 뼈대는 \"그 차이는 그야말로 틀렸다\"다.","accurate(정확한)를 넣으면 \"정확한 차이는 틀렸다\"가 된다.","정확한데 틀렸다는 말은 한 문장이 스스로 부딪치는 것이다.","틀렸다고 잘라 말할 수 있는 건 사람들이 흔히 믿는 판에 박힌 생각뿐이다."]},{"t":"p","h":"함정","x":["vibrant(선명  같은 뜻이다.","\"개체군과 서식지에 미치는 바깥 영향\"이라는 뜻이 그대로 통한다."]}],"post":["provide(제공하다) ↔ remove(없애다)","서식지 개선 = 새끼에게 숨을 곳 마련"]},{"no":"38","slots":[["broad","general","s"],["altering"],["represent"],["active"],["external","internal","a"]],"opts":["external","natural","genetic","seasonal"],"or":["external(외부의): 바로 뒤에서 이 관리가 '동물이 아니라 사람을 관리하는 일'이라고 하니 바깥에서 들어오는 영향이어야 맞음.","natural(자연의): 국립공원은 자연 그대로 두는 곳이라 자연의 영향을 줄이는 건 목적과 반대임.","genetic(유전적인): 유전 영향을 줄이는 일은 사람을 관리하는 일과 연결되지 않음.","seasonal(계절적인): 계절을 사람이 줄일 수는 없고, 사람 관리와도 관계없음."],"om":["외부의","자연의","유전적인","계절적인"],"en":"In such situations, management activities minimize external influences on populations and habitat, which often involves management of humans and not animals.","ko":"그런 경우 관리 활동은 개체군과 서식지에 미치는 외부 영향을 최소화하는데, 이는 흔히 동물이 아니라 사람을 관리하는 일이다.","hl":["minimize external influences","management of humans and not animals"],"khl":["외부 영향을 최소화하는데","동물이 아니라 사람을 관리하는 일"],"blocks":[{"t":"p","h":"사람은 어느 쪽에서 오는가","x":["국립공원의 동물과 서식지가 \"안쪽\"이다.","등산객, 차, 개발 같은 사람의 손길은 \"바깥\"에서 들어온다.","그래서 관리 대상이 동물이 아니라 사람이 된다.","internal(내부의)을 넣으면 동물 쪽 영향을 줄이는 셈이라 \"사람을 관리한다\"와 어긋난다."]},{"t":"tap","h":"글 전체를 한 줄로","q":"두 가지 관리 방식을 한 줄씩 정리하면?","a":["적극적 관리: 개체군이나 서식지에 직접 손을 댐.","소극적 관리: 손대지 않고 바깥 영향, 곧 사람을 막음."]},{"t":"p","h":"함정","x":["general(일반적인, 포괄적인)은 broad(넓은) 자리에 넣어도 \"두 가지 큰 범주\"라는 뜻이 그대로다."]}],"post":["external(외부의) ↔ internal(내부의)","소극적 관리 = 동물 말고 사람 관리"]}],"compquiz":[{"w":"provide","m":"제공하다","it":[["supply","공급하다","s"],["whisper","속삭이다","n"],["remove","없애다","a"],["admire","존경하다","n"],["offer","제공하다","s"],["withhold","주지 않다, 보류하다","a"],["borrow","빌리다","n"]]},{"w":"external","m":"외부의","it":[["outside","바깥의","s"],["fluent","유창한","n"],["internal","내부의","a"],["outer","바깥쪽의","s"],["inner","안쪽의","a"],["punctual","시간을 잘 지키는","n"],["generous","관대한","n"]]}],"sets":[{"items":[{"slots":[["numerous","few","a"],["imply"],["classified"],["broad"],["decreasing"]],"opts":["numerous","limited","scarce","rare"],"or":["numerous(수많은): but(하지만) 뒤에서 '모두 두 범주로 묶인다'로 정리하니 앞은 방법이 많다는 말이어야 맞음.","limited(제한된): 방법이 몇 개 없다면 굳이 두 범주로 묶어 정리할 필요가 없음.","scarce(드문): 글 속에 이주, 사냥, 서식지 변경, 포식자 통제 등 방법이 많이 나와 맞지 않음.","rare(드문): 방법이 드물다는 말은 뒤에 쏟아지는 여러 관리 방법과 부딪침."],"om":["수많은","제한된","부족한, 드문","보기 드문"],"en":"There are numerous ways wildlife is managed, but they all imply stewardship and can be classified into two broad categories: active management and inactive management.","ko":"야생 생물을 관리하는 방법은 수없이 많지만, 그것들은 모두 관리 책임을 수반하며 적극적 관리와 소극적 관리라는 두 가지 넓은 범주로 분류될 수 있다.","hl":["numerous ways","two broad categories"],"khl":["수없이 많지만","두 가지 넓은 범주"],"blocks":[{"t":"flow","h":"글 전체 지도","x":["방법은 많지만 두 범주로 묶임","적극적 관리 1: 이주·사냥으로 수를 직접 조절","적극적 관리 2: 서식지 바꾸기","적극적 관리 3: 포식자 통제, 서식지 개선","소극적 관리: 국립공원처럼 사람을 관리"],"at":0},{"t":"p","h":"but(하지만)이 만드는 대비","x":["앞: 방법이 많다.","뒤: 그래도 모두 두 가지로 묶인다.","많은 것을 둘로 정리하니까 but(하지만)이 붙는다.","few(거의 없는)를 넣으면 정리할 거리가 없어 but(하지만)이 힘을 잃는다."]}],"post":["numerous(수많은) ↔ few(거의 없는)","수많은 관리 방법 → 두 범주로 정리"]},{"slots":[["imply","entail","s"],["broad"],["decreasing","expanding","a"],["a_direct"],["respectively","in that order","s"]],"opts":["decreasing","doubling","boosting","maintaining"],"or":["decreasing(줄이기): respectively(각각)로 짝지으면 hunting(사냥)이 맡는 쪽이라 개체 수를 줄이는 말이어야 맞음.","doubling(두 배로 늘리기): 사냥으로 개체 수를 두 배로 만들 수는 없음.","boosting(늘리기): 앞의 increasing(늘리기)과 같은 말이 되어 사냥이 할 일이 사라짐.","maintaining(유지하기): 사냥은 수를 그대로 두는 게 아니라 줄이는 전략임."],"om":["줄이기","두 배로 늘리기","늘리기","유지하기"],"en":"Active management does something to the population ―such as increasing or decreasing its size ―in a direct manner through strategies like translocations or hunting, respectively.","ko":"적극적 관리는 개체군에 직접적인 방식으로 무언가를 한다. 이를테면 이주나 사냥 같은 전략을 통해 각각 그 규모를 늘리거나 줄이는 것이다.","hl":["increasing or decreasing","translocations or hunting, respectively"],"khl":["늘리거나 줄이는","이주나 사냥"],"blocks":[{"t":"pair","h":"respectively(각각)로 짝 맞추기","x":[["increasing ↔ translocations","늘리기 ↔ 이주(다른 곳의 동물을 데려옴)"],["decreasing ↔ hunting","줄이기 ↔ 사냥(수를 덜어 냄)"]]},{"t":"p","h":"expanding(늘리기)이 안 되는 이유 ies, other active management can be incorporated, such as predator control to minimize neonatal deaths or habitat improvement to provide required cover for neonates from predators.","ko":"개체 수가 관리 기관의 목표에 비해 너무 적으면, 다른 적극적 관리가 더해질 수 있다. 이를테면 갓 태어난 새끼의 죽음을 최소화하는 포식자 통제, 또는 새끼에게 포식자로부터 숨을 곳을 마련해 주는 서식지 개선이 그렇다.","hl":["too low","minimize neonatal deaths"],"khl":["너무 적으면","새끼의 죽음을 최소화하는"],"blocks":[{"t":"tap","h":"질문 하나","q":"새끼의 죽음을 줄이고 숨을 곳을 마련해 주는 건 언제 하는 일일까?","a":["개체 수를 늘려야 할 때다.","곧 수가 목표보다 너무 적을 때.","high(많은)를 넣으면 수가 넘치는데 더 늘리는 처방을 하는 셈이다."]},{"t":"flow","h":"조건 → 처방","x":["조건: 개체 수가 목표보다 너무 적음","처방 1: 포식자 통제로 새끼의 죽음 줄이기","처방 2: 서식지 개선으로 숨을 곳 주기","결과: 개체 수 회복"],"at":0}],"post":["low(적은) ↔ high(많은)","수가 너무 적음 → 새끼 지키기 처방"]},{"slots":[["minimize","reduce","s"],["provide","supply","s"],["represent"],["active","passive","a"],["humans"]],"opts":["active","inactive","neutral","theoretical"],"or":["active(적극적인): These efforts(이런 노력들)는 바로 앞의 포식자 통제와 서식지 개선, 곧 직접 손대는 관리라 맞음.","inactive(소극적인): 소극적 관리는 다음 문장의 국립공원 이야기이고, 앞의 노력들은 직접 개입하는 쪽임.","neutral(중립적인): 포식자를 통제하고 서식지를 고치는 일은 한발 물러선 중립과 거리가 멂.","theoretical(이론적인): 포식자 통제와 서식지 개선은 머릿속 이론이 아니라 실제 행동임."],"om":["적극적인","소극적인","중립적인","이론적인"],"en":"These efforts represent active approaches to management. Other populations may not be actively managed, like those in national parks.","ko":"이런 노력들은 관리에 대한 적극적인 접근법을 보여 준다. 국립공원의 개체군처럼, 적극적으로 관리되지 않는 개체군도 있다.","hl":["These efforts represent active approaches","may not be actively managed"],"khl":["적극적인 접근법","적극적으로 관리되지 않는"],"blocks":[{"t":"p","h":"These efforts(이런 노력들)가 가리키는 것","x":["These(이런)는 바로 앞에 나온 것을 다시 가리킨다.","앞에 나온 것은 포식자 통제와 서식지 개선이다.","둘 다 사람이 직접 손을 대는 관리다.","passive(소극적인)를 넣으면 직접 손대는 일을 소극적이라고 부르는 셈이다."]},{"t":"p","h":"다음 문장이 경계선","x":["다음 문장은 Other populations(다른 개체군들)로 시작한다.","여기서부터가 적극적으로 관리되지 않는 쪽이다.","그러니 이 문장은 적극적 관리 이야기를 닫는 자리다."]},{"t":"p","h":"그대로 둘 두 단어","x":["reduce(줄이다)는 minimize(최소화하다) 자리에서 새끼의 죽음을 줄인다는 뜻을 지킨다.","supply(공급하다)는 provide(제공하다)와 같은 방향이다."]}],"po z":[{"w":"broad","m":"넓은, 폭넓은","it":[["wide","넓은","s"],["narrow","좁은","a"],["polite","공손한","n"],["extensive","광범위한","s"],["limited","제한된","a"],["wooden","나무로 된","n"],["urgent","긴급한","n"]]},{"w":"direct","m":"직접적인","it":[["immediate","직접의, 즉각적인","s"],["fluent","유창한","n"],["indirect","간접적인","a"],["firsthand","직접 겪은, 직접의","s"],["roundabout","돌려서 하는, 우회적인","a"],["generous","관대한","n"],["ancient","고대의","n"]]},{"w":"represent","m":"나타내다, ~에 해당하다","it":[["exemplify","~의 좋은 예가 되다","s"],["sneeze","재채기하다","n"],["embody","구현하다, 담아내다","s"],["polish","닦다, 윤을 내다","n"],["constitute","~이 되다, ~을 이루다","s"],["amount to","~에 해당하다","s"],["dig","파다","n"]]},{"w":"incorporate","m":"포함시키다, 더하다","it":[["include","포함하다","s"],["exclude","제외하다","a"],["admire","존경하다","n"],["integrate","통합하다","s"],["omit","빼다, 생략하다","a"],["predict","예측하다","n"],["repair","수리하다","n"]]},{"w":"minimize","m":"최소화하다","it":[["lessen","줄이다","s"],["maximize","최대화하다","a"],["celebrate","축하하다","n"],["diminish","줄이다, 약화시키다","s"],["increase","늘리다","a"],["measure","측정하다","n"],["invite","초대하다","n"]]}]}],"no":"38"},{"id":"2510g2-39","title":"어휘특훈 · 25년 10월 고2 39번","sub":"폐기 경제에서 서비스 경제로","tpl":"Waste has {historically} been seen as a {necessary} driver of the economy. Sales are {tied} to the amount of a product supplied, which is directly {dependent} on the demand for that product. Therefore, if you design the product to {eventually} be wasted, you can ensure that the demand for more products will be {sustained}. Many strategies have been {incorporated} into product design and use to ensure that waste is {inevitable}, such as planned obsolescence, {limited} access to tools for repairs, and use of {cheap} materials. All these strategies ensure that the consumer will have limited access to the product in use and will eventually require a replacement. Those who {supported} the idea that waste is necessary to drive demand {failed} to realize that {prioritizing} the {elimination} of waste via repair and remanufacturing creates a {different} kind of demand: products as a service. Through this setup, companies simply {lease_out} products that were once sold directly to the customer. With this transition of ownership, companies {maintain} profit by offering maintenance and repair services and are {encouraged} to develop long-lasting products.","fn":["*planned obsolescence: 계획적 노후화(제품 수명을 일부러 짧게 만드는 것)","*remanufacturing: 재제조"],"mean":{"historically":"역사적으로","traditionally":"전통적으로","necessary":"필요한, 필수적인","vital":"필수적인, 매우 중요한","useless":"쓸모없는","tied":"동사 tie(묶다, 연결하다)의 과거분사형. 연결된","unrelated":"관련 없는","dependent":"의존하는, 좌우되는","reliant":"의존하는","eventually":"결국","ultimately":"결국, 궁극적으로","sustained":"동사 sustain(지속시키다)의 과거분사형. 지속되는","weakened":"동사 weaken(약화시키다)의 과거분사형. 약해진","incorporated":"동사 incorporate(포함하다, 통합하다)의 과거분사형. 포함된","built":"동사 build(짓다, 만들어 넣다)의 과거분사형. built into = ~에 들어간","inevitable":"피할 수 없는","unavoidable":"피할 수 없는","avoidable":"피할 수 있는","limited":"제한된","unrestricted":"제한 없는","cheap":"값싼","inexpensive":"비싸지 않은","durable":"내구성 있는, 오래가는","supported":"동사 support(지지하다)의 과거형","opposed":"동사 oppose(반대하다)의 과거형","failed":"동사 fail(실패하다, ~하지 못하다)의 과거형. fail to = ~하지 못하다","managed":"동사 manage(해내다)의 과거형. manage to = 용케 ~해내다","hurried":"동사 hurry(서두르다)의 과거형","pretended":"동사 pretend(~인 척하다)의 과거형","dared":"동사 dare(감히 ~하다)의 과거형","prioritizing":"동사 prioritize(우선시하다)의 -ing형. 동명사","emphasizing":"동사 emphasize(강조하다)의 -ing형. 동명사","neglecting":"동사 neglect(소홀히 하다)의 -ing형. 동명사","elimination":"제거","removal":"제거","accumulation":"축적, 쌓임","different":"다른","new":"새로운","lease out":"임대하다, 빌려주다","rent out":"세를 놓다, 빌려주다","maintain":"유지하다","lose":"잃다","encouraged":"동사 encourage(장려하다)의 과거분사형. 장려되는","motivated":"동사 motivate(동기를 부여하다)의 과거분사형. 동기를 얻은","reluctant":"꺼리는, 내키지 않는"},"comp":[{"no":"39","slots":[["historically"],["tied"],["sustained","weakened","a"],["inevitable"],["supported"]],"opts":["sustained","reduced","eliminated","ended"],"or":["sustained(지속되는): 제품이 버려져야 다시 사니까 수요가 계속 이어진다는 결론이라 맞음.","reduced(줄어드는): 버려지게 설계하는 목적이 수요를 줄이는 것일 리 없음.","eliminated(없어지는): 수요를 없애려고 제품을 버려지게 만드는 기업은 없음.","ended(끝나는): 수요가 끝나면 판매도 끝나 기업의 계산과 정반대임."],"om":["지속되는","줄어드는","없어지는","끝나는"],"en":"Therefore, if you design the product to eventually be wasted, you can ensure that the demand for more products will be sustained.","ko":"그러므로 제품이 결국 버려지도록 설계하면 더 많은 제품에 대한 수요가 유지되도록 보장할 수 있다.","hl":["will be sustained","design the product to eventually be wasted"],"khl":["수요가 유지되도록","결국 버려지도록 설계하면"],"blocks":[{"t":"p","h":"버려져야 다시 산다","x":["물건이 결국 망가지면 사람들은 새로 산다.","새로 사니까 수요가 끊기지 않는다.","weakened(약해진)를 넣으면 버려지게 만들수록 수요가 약해진다는 말이 된다.","그러면 기업이 이 전략을 쓸 이유가 없다."]}],"post":["sustained(지속되는) ↔ weakened(약해진)","버려지게 설계 = 수요가 끊기지 않게"]},{"no":"39","slots":[["supported"],["elimination","removal","s"],["different"],["maintain","lose","a"],["encouraged"]],"opts":["maintain","sacrifice","waste","abandon"],"or":["maintain(유지하다): 팔지 않아도 관리·수리 서비스로 수익을 지킨다는 말이라 맞음.","sacrifice(희생하다): 서비스를 제공해 수익을 희생한다면 기업이 이 방식을 택할 이유가 없음.","waste(낭비하다): 수익을 낭비한다는 말은 서비스가 돈벌이라는 흐름과 반대임.","abandon(포기하다): 수익을 포기하면서 오래가는 제품을 만들도록 장려된다는 건 앞뒤가 안 맞음."],"om":["유지하다","희생하다","낭비하다","포기하다"],"en":"With this transition of ownership, companies maintain profit by offering maintenance and repair services and are encouraged to develop long-lasting products.","ko":"이런 소유권의 전환으로 기업들은 유지 관리와 수리 서비스를 제공해 수익을 유지하고, 오래가는 제품을 개발하도록 장려된다.","hl":["maintain profit","by offering maintenance and repair services"],"khl":["수익을 유지하고","유지 관리와 수리 서비스를 제공해"],"blocks":[{"t":"p","h":"by가 방법을 말한다","x":["by offering maintenance and repair services(관리와 수리 서비스를 제공함으로써).","서비스가 수익을 만드는 방법이다.","lose(잃다)를 넣으면 \"서비스를 제공해서 수익을 잃는다\"가 된다.","돈 버는 방법을 말하는 자리에 손해가 들어간 셈이다."]},{"t":"p","h":"함정","x":["removal(제거)은 elimination(제거)과 같은 뜻이라 그대로 둔다."]}],"post":["maintain(유지하다) ↔ lose(잃다)","빌려주기 + 수리 서비스 = 계속 들어오는 수익"]}],"compquiz":[{"w":"sustain","m":"지속시키다, 유지하다","it":[["prolong","연장하다","s"],["discontinue","중단하다","a"],["sweep","쓸다","n"],["keep up","유지하다","s"],["halt","멈추다","a"],["dive","뛰어들다","n"],["sew","바느질하다","n"]]},{"w":"maintain","m":"유지하다","it":[["preserve","보존하다","s"],["abandon","버리다, 포기하다","a"],["sing","노래하다","n"],["retain","유지하다","s"],["lose","잃다","a"],["peel","껍질을 벗기다","n"],["kneel","무릎 꿇다","n"]]}],"sets":[{"items":[{"slots":[["necessary","useless","a"],["eventually"],["inevitable"],["failed"],["different"]],"opts":["necessary","negligible","harmful","minor"],"or":["necessary(필요한): 여섯째 문장에서 the idea that waste is necessary to drive demand(폐기가 수요를 이끄는 데 필요하다는 생각)로 같은 말이 다시 나와 맞음.","negligible(무시해도 될): 경제를 움직이는 driver(원동력)를 무시해도 된다는 말은 앞뒤가 안 맞음.","harmful(해로운): 해롭다고 봤다면 일부러 버려지게 설계할 리가 없음.","minor(사소한): 사소한 원동력이라면 제품 설계까지 바꿔 가며 폐기를 보장하지 않았을 것임."],"om":["필요한","무시해도 될","해로운","사소한"],"en":"Waste has historically been seen as a necessary driver of the economy. … Those who supported the idea that waste is necessary to drive demand failed to realize …","ko":"폐기는 역사적으로 경제의 필수적인 원동력으로 여겨져 왔다. … 폐기가 수요를 이끄는 데 필수적이라는 생각을 지지했던 사람들은 … 깨닫지 못했다","hl":["a necessary driver","waste is necessary to drive demand"],"khl":["필수적인 원동력","폐기가 수요를 이끄는 데 필수적"],"blocks":[{"t":"flow","h":"글 전체 지도","x":["옛 생각: 폐기는 경제에 꼭 필요함","이유: 버려져야 다시 사니까 수요가 유지됨","방법: 빨리 낡게, 고치기 어렵게, 싼 재료로","놓친 것: 수리·재제조도 새 수요를 만듦","새 방식: 팔지 않고 빌려주는 서비스"],"at":0},{"t":"p","h":"useless(쓸모없는)를 넣으면","x":["\"폐기는 경제에 쓸모없는 원동력으로 여겨졌다\"가 된다.","그런데 바로 다음 문장들은 폐기가 왜 돈이 되는지 설명한다.","여섯째 문장도 the idea that waste is necessary(폐기가 필요하다는 생각)라고 다시 말한다.","첫 문장은 옛 사람들의 믿음을 소개하는 자리다.","그 믿음은 \"폐기는 꼭 필요하다\"였다."]}],"post":["necessary(필요한) ↔ useless(쓸모없는)","옛 믿음 = 버려져야 경제가 돈다"]},{"slots":[["historically","traditionally","s"],["dependent"],["inevitable","avoidable","a"],["cheap","inexpensive","s"],["lease_out"]],"opts":["inevitable","rare","preventable","optional"],"or":["inevitable(피할 수 없는): 일부러 빨리 낡게 만드는 전략들이니 폐기를 피할 수 없게 만든다는 말이 맞음.","rare(드문): 폐기가 드물어지면 새 제품 수요가 줄어 전략의 목적과 반대임.","preventable(막을 수 있는): 폐기를 막을 수 있게 하는 건 수리 쪽이지 계획적 노후화의 목적이 아님.","optional(선택적인): 버릴지 말지 고를 수 있게 하면 교체 수요를 확실히 만들 수 없음."],"om":["피할 수 없는","드문","막을 수 있는","선택적인"],"en":"Many strategies have been incorporated into product design and use to ensure that waste is inevitable, such as planned obsolescence, limited access to tools for repairs, and use of cheap materials.","ko":"계획적 노후화, 수리 도구에 대한 제한된 접근, 값싼 재료의 사용과 같은 많은 전략들이 폐기를 피할 수 없게 보장하려고 제품 설계와 사용에 포함되어 왔다.","hl":["waste is inevitable","planned obsolescence"],"khl":["폐기를 피할 수 없게","계획적 노후화"],"blocks":[{"t":"p","h":"예시 셋이 가리키는 방향","x":["such as(~와 같은) 뒤에 전략 세 가지가 나온다.","planned obsolescence(계획적 노후화): 일부러 빨리 낡게 만들기.","limited access to tools for repairs(수리 도구에 대한 제한된 접근): 고치기 어렵게 하기.","use of cheap materials(값싼 재료의 사용): 쉽게 망가지게 하기.","셋 다 \"결국 버리게\" 만드는 장치다.","avoidable(피할 수 있는)을 넣으면 예시 셋과 정반대가 된다."]},{"t":"p","h":"그대로 두는 두 단어","x":["traditionally(전통적으로)는 historically(역사적으로)처럼 \"예전부터 쭉\"이라는 뜻이다.","inexpensive(비싸지 않은)는 cheap(값싼)과 같은 뜻이다.","철자가 달라도 문장 뜻은 그대로."]}],"post":["inevitable(피할 수 없는) ↔ avoidable(피할 수 있는)","계획적 노후화 = 결국 버리게 만드는 설계"]},{"slots":[["tied"],["incorporated"],["supported","opposed","a"],["lease_out","rent out","s"],["encouraged"]],"opts":["supported","rejected","questioned","criticized"],"or":["supported(지지했다): 폐기가 필요하다는 생각을 믿은 사람들이라 새 수요를 못 봤다는 failed to realize(깨닫지 못했다)와 맞음.","rejected(거부했다): 그 생각을 거부한 사람이라면 수리가 만드는 새 수요를 못 볼 이유가 없음.","questioned(의문을 제기했다): 의심한 사람들은 오히려 다른 길을 찾았을 쪽이라 '깨닫지 못했다'와 안 맞음.","criticized(비판했다): 비판한 사람은 글쓴이와 같은 편이라 글쓴이가 꼬집는 대상이 될 수 없음."],"om":["지지했다","거부했다","의문을 제기했다","비판했다"],"en":"Those who supported the idea that waste is necessary to drive demand failed to realize that prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand: products as a service.","ko":"폐기가 수요를 이끄는 데 필수적이라는 생각을 지지했던 사람들은 수리와 재제조를 통해 폐기를 없애는 것을 우선시하는 것이 다른 종류의 수요, 즉 서비스로서의 제품을 만들어 낸다는 것을 깨닫지 못했다.","hl":["Those who supported the idea","failed to realize"],"khl":["생각을 지지했던 사람들","깨닫지 못했다"],"blocks":[{"t":"tap","h":"질문 하나","q":"이 사람들은 무엇을 깨닫지 못했나?","a":["폐기를 없애도 돈 벌 길이 있다는 것.","수리·재제조가 새로운 수요를 만든다는 것.","이걸 못 본 이유는 \"폐기가 꼭 필요하다\"고 믿었기 때문이다."]},{"t":"p","h":"opposed(반대했다)를 넣고 다시 읽기","x":["\"폐기가 필요하다는 생각에 반대한 사람들은 깨닫지 못했다.\"","반대한 사람은 이미 폐기 없는 길을 보고 있는 쪽이다.","그런 사람이 그 길을 못 봤다는 건 말이 안 된다.","못 본 사람은 옛 생각을 믿고 따른 쪽이어야 한다."]},{"t":"p","h":"rent out(세를 놓다)은 그대로","x":["rent out(세를 놓다)은 lease out(임대하다)과 같은 뜻이다.","파는 대신 빌려준다는 흐름이 그대로 산다."]}],"post":["support(지지하다) ↔ oppose(반대하다)","옛 생각을 믿은 사람 = 새 수요를 못 본 사람"]},{"slots":[["necessary"],["eventually"],["limited"],["cheap","durable","a"],["elimination"]],"opts":["cheap","sturdy","premium","reliable"],"or":["cheap(값싼): 쉽게 망가지는 값싼 재료라야 폐기를 피할 수 없게 만드는 전략이 됨.","sturdy(튼튼한): 튼튼한 재료는 오래 버텨 교체를 늦추므로 전략 목록과 반대임.","premium(고급의): 고급 재료는 오래가는 제품을 만들어 폐기를 보장하는 전략이 아님.","reliable(믿을 만한): 믿을 만한 재료는 고장이 적어 교체 수요를 만들지 못함."],"om":["값싼","튼튼한","고급의","믿을 만한"],"en":"such as planned obsolescence, limited access to tools for repairs, and use of cheap materials. All these strategies ensure that the consumer will have limited access to the product in use and will eventually require a replacement.","ko":"계획적 노후화, 수리 도구에 대한 제한된 접근, 값싼 재료의 사용과 같은 것들이다. 이 모든 전략들은 소비자가 사용 중인 제품을 제한적으로만 쓰다가 결국 교체품이 필요하게 되도록 보장한다.","hl":["use of cheap materials","eventually require a replacement"],"khl":["값싼 재료의 사용","결국 교체품이 필요하게"],"blocks":[{"t":"p","h":"뒤 문장이 정답을 쥐고 있다","x":["바로 뒤 문장이 세 전략의 목적을 말한다.","eventually require a replacement(결국 교체품을 필요로 하다).","즉 세 전략은 모두 빨리 바꾸게 만드는 장치다.","durable(내구성 있는) 재료는 제품을 오래가게 한다.","오래가면 교체가 늦어진다.","목적과 정반대인 재료가 목록에 끼어든 셈이다."]},{"t":"p","h":"마지막 문장과도 부딪침","x":["글 끝에서 새 방식의 기업은 long-lasting products(오래가는 제품)를 만든다.","오래가는 재료는 새 방식의 특징이다.","옛 방식의 전략 목록에 들어갈 수 없다."]}],"post":["cheap(값싼) ↔ durable(내구성 있는)","값싼 재료 = 빨리 망가져 다시 사게 하는 장치"]},{"slots":[["dependent","reliant","s"],["sustained"],["failed","managed","a"],["prioritizing","emphasizing","s"],["maintain"]],"opts":["failed","hurried","pretended","dared"],"or":["failed(~하지 못했다): fail to realize(깨닫지 못하다). 낭비가 수요를 만든다고 믿은 사람들이 새 수요(서비스로서의 제품)를 못 봤다는 흐름이라 맞음.","hurried(서둘렀다): hurry to realize(서둘러 깨닫다)는 어색하고, 이들이 새 방식을 알아챘다는 말이 되어 비판 흐름과 반대임.","pretended(~인 척했다): pretend to realize(깨달은 척하다)는 이들이 무언가를 일부러 숨겼다는 엉뚱한 이야기가 되어 본문에 근거가 없음.","dared(감히 ~했다): dare to realize(감히 깨닫다)는 용기 있게 알아챘다는 뜻이라, 옛 생각에 갇혀 못 봤다는 흐름과 정반대임."],"om":["~하지 못했다","서둘렀다","~인 척했다","감히 ~했다"],"en":"Those who supported the idea that waste is necessary to drive demand failed to realize that prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand: products as a service.","ko":"폐기가 수요를 이끄는 데 필수적이라는 생각을 지지했던 사람들은 수리와 재제조를 통해 폐기를 없애는 것을 우선시하는 것이 다른 종류의 수요, 즉 서비스로서의 제품을 만들어 낸다는 것을 깨닫지 못했다.","hl":["failed to realize","a different kind of demand"],"khl":["깨닫지 못했다","다른 종류의 수요"],"blocks":[{"t":"pair","h":"두 생각 나란히","x":[["waste is necessary to drive demand","폐기가 있어야 수요가 생긴다 (옛 생각)"],["prioritizing the elimination of waste … creates a different kind of demand","폐기를 없애는 쪽도 다른 수요를 만든다 (놓친 사실)"]]},{"t":"p","h":"managed(해냈다)가 안 되는 이유","x":["managed to realize(용케 깨달았다)라면 이 사람들은 새 길을 본 셈이다.","그러면 옛 생각을 계속 지지할 이유가 없다.","글쓴이는 이들이 한쪽만 봤다고 꼬집는다.","그래서 \"못 봤다\"여야 한다."]},{"t":"p","h":"함정 두 개","x":["reliant(의존하는)는 dependent(의존하는)와 같은 뜻이고 뒤의 on(~에)과도 잘 어울린다.","emphasizing(강조하는 것)은 prioritizing(우선시하는 것)과 방향이 같다.","둘은 고치지 않는다."]}],"post":["fail(~하지 못하다) ↔ manage(해내다)","옛 생각 = 한쪽 수요만 본 좁은 시야"]}],"quiz":[{"w":"necessary","m":"필요한, 필수적인","it":[["essential","필수적인","s"],["unnecessary","불필요한","a"],["wooden","나무로 된","n"],["indispensable","없어서는 안 될","s"],["needless","불필요한","a"],["fluent","유창한","n"],["sleepy","졸린","n"]]},{"w":"inevitable","m":"피할 수 없는","it":[["unavoidable","피할 수 없는","s"],["preventable","막을 수 있는","a"],["generous","관대한","n"],["inescapable","피할 수 없는","s"],["avoidable","피할 수 있는","a"],["humid","습한","n"],["polite","공손한","n"]]},{"w":"support","m":"지지하다","it":[["back","지지하다","s"],["oppose","반대하다","a"],["whisper","속삭이다","n"],["endorse","지지하다, 승인하다","s"],["reject","거부하다","a"],["borrow","빌리다","n"],["paint","칠하다","n"]]},{"w":"cheap","m":"값싼","it":[["inexpensive","비싸지 않은","s"],["expensive","비싼","a"],["curious","호기심 많은","n"],["low-cost","저렴한","s"],["costly","값비싼","a"],["ancient","고대의","n"],["noisy","시끄러운","n"]]},{"w":"fail","m":"실패하다, ~하지 못하다","it":[["flop","실패하다","s"],["succeed","성공하다","a"],["swim","수영하다","n"],["fall short","못 미치다","s"],["triumph","승리하다, 성공하다","a"],["greet","인사하다","n"],["bake","굽다","n"]]}]},{"items":[{"slots":[["historically"],["tied","unrelated","a"],["incorporated"],["supported"],["different"]],"opts":["tied","irrelevant","indifferent","immune"],"or":["tied(연결된): 판매량이 공급량에 묶여 있어야 '그러므로 버려지게 설계하라'는 결론이 나옴.","irrelevant(무관한): 판매량이 공급량과 무관하면 다음 문장의 Therefore(그러므로)가 이어지지 않음.","indifferent(무관심한): 판매량이 공급량에 무관심하다는 건 뜻이 통하지 않고 연결 고리도 끊김.","immune(영향받지 않는): 판매량이 공급량의 영향을 안 받으면 수요를 유지할 이유가 사라짐."],"om":["연결된","무관한","무관심한","영향받지 않는"],"en":"Sales are tied to the amount of a product supplied, which is directly dependent on the demand for that product. Therefore, if you design the product to eventually be wasted, you can ensure that the demand for more products will be sustained.","ko":"판매량은 제품의 공급량에 묶여 있고, 그 공급량은 그 제품에 대한 수요에 직접 좌우된다. 그러므로 제품이 결국 버려지도록 설계하면 더 많은 제품에 대한 수요가 유지되도록 보장할 수 있다.","hl":["Sales are tied to","Therefore"],"khl":["판매량은 제품의 공급량에 묶여","그러므로"],"blocks":[{"t":"flow","h":"사슬처럼 이어지는 논리","x":["수요가 있다","그만큼 공급한다","공급한 만큼 팔린다","그러니 버려지게 만들면 수요가 계속된다"],"at":2},{"t":"p","h":"unrelated(관련 없는)로 끊어 보기","x":["판매량이 공급량과 관련 없다고 해 보자.","그러면 수요 → 공급 → 판매의 사슬이 끊긴다.","Therefore(그러므로) 뒤의 결론도 근거를 잃는다.","사슬의 한 고리라서 tied(연결된)여야 한다."]}],"post":["tied(연결된) ↔ unrelated(관련 없는)","수요 → 공급 → 판매 = 한 줄로 묶인 사슬"]},{"slots":[["eventually","ultimately","s"],["limited","unrestricted","a"],["failed"],["different"],["encouraged","motivated","s"]],"opts":["limited","free","open","easy"],"or":["limited(제한된): 수리 도구를 구하기 어렵게 해야 고치지 못하고 버리게 되므로 맞음.","free(자유로운): 수리 도구를 마음대로 쓰게 하면 고쳐 쓰게 되어 폐기 전략이 아님.","open(열려 있는): 도구에 누구나 접근하면 수리가 쉬워져 교체 수요가 줄어듦.","easy(쉬운): 수리가 쉬우면 폐기를 피할 수 없게 만든다는 목적과 정반대임."],"om":["제한된","자유로운","열려 있는","쉬운"],"en":"limited access to tools for repairs … All these strategies ensure that the consumer will have limited access to the product in use","ko":"수리 도구에 대한 제한된 접근 … 이 모든 전략들은 소비자가 사용 중인 제품을 제한적으로만 쓰게 되도록 보장한다","hl":["limited access to tools for repairs","will have limited access"],"khl":["수리 도구에 대한 제한된 접근","제한적으로만 쓰게"],"blocks":[{"t":"p","h":"같은 단어가 다시 나온다","x":["다음 문장에 limited access(제한된 접근)가 또 나온다.","이번엔 소비자가 제품을 제한적으로만 쓴다는 말이다.","앞의 \"수리 도구 제한\"이 원인이고, 뒤의 \"제품 사용 제한\"이 결과다.","unrestricted(제한 없는)로 바꾸면 원인과 결과가 어긋난다."]},{"t":"tap","h":"질문 하나","q":"고장 난 물건을 고칠 도구가 없으면?","a":["고치지 못한다.","결국 새로 산다.","이게 기업이 노린 교체 수요다."]},{"t":"p","h":"함정","x":["ultimately(결국)는 eventually(결국)와 같은 뜻이다.","motivated(동기를 얻은)는 encouraged(장려되는)와 같은 방향이라 to develop(개발하도록)과 잘 이어진다.","이 둘은 맞는 표현."]}],"post":["limited(제한된) ↔ unrestricted(제한 없는)","수리 도구 막기 → 결국 새로 사기"]},{"slots":[["necessary"],["inevitable"],["prioritizing","neglecting","a"],["different","new","s"],["maintain"]],"opts":["prioritizing","ignoring","delaying","discouraging"],"or":["prioritizing(우선시하는 것): 폐기 없애기를 앞세워야 수리 서비스라는 새 수요가 생기므로 맞음.","ignoring(무시하는 것): 폐기 없애기를 무시하면 옛 방식 그대로라 새 수요가 생기지 않음.","delaying(미루는 것): 폐기 없애기를 미루면 수리·재제조 서비스가 자랄 수 없음.","discouraging(막는 것): 폐기 없애기를 막는 건 옛 방식의 전략이지 새 수요의 출발점이 아님."],"om":["우선시하는 것","무시하는 것","미루는 것","막는 것"],"en":"… failed to realize that prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand: products as a service.","ko":"… 수리와 재제조를 통해 폐기를 없애는 것을 우선시하는 것이 다른 종류의 수요, 즉 서비스로서의 제품을 만들어 낸다는 것을 깨닫지 못했다.","hl":["prioritizing the elimination of waste","products as a service"],"khl":["폐기를 없애는 것을 우선시하는 것","서비스로서의 제품"],"blocks":[{"t":"pair","h":"옛 방식과 새 방식","x":[["design the product to eventually be wasted","결국 버려지게 설계 (옛 방식)"],["prioritizing the elimination of waste","폐기 없애기를 우선 (새 방식)"]]},{"t":"p","h":"neglecting(소홀히 하는 것)을 넣으면","x":["\"폐기 없애기를 소홀히 하면 새 수요가 생긴다\"가 된다.","그건 옛 방식을 그대로 하는 것이다.","옛 방식에서 새 수요가 나올 리 없다.","repair and remanufacturing(수리와 재제조)은 폐기를 줄이는 행동이라 \"우선시\"와 짝이 맞다."]},{"t":"p","h":"new(새로운)는 그대로","x":["a new kind of demand(새로운 종류의 수요)도 뜻이 통한다.","팔기가 아닌 빌려주기라는 처음 보는 수요라서다."]}],"post":["prioritize(우선시하다) ↔ neglect(소홀히 하다)","폐기 없애기 → 서비스라는 새 수요"]},{"slots":[["dependent"],["cheap"],["elimination"],["lease_out"],["encouraged","reluctant","a"]],"opts":["encouraged","unwilling","hesitant","unable"],"or":["encouraged(장려되는): 수리 서비스로 돈을 버니 오래가는 제품을 만들고 싶어진다는 흐름이라 맞음.","unwilling(내키지 않는): 제품을 오래 쓸수록 관리·수리로 돈을 버는 구조라 만들기 싫어할 이유가 없음.","hesitant(망설이는): 소유권이 기업에 남아 오래가는 제품이 곧 이익이라 망설일 까닭이 없음.","unable(할 수 없는): 기업이 오래가는 제품을 못 만든다는 근거가 본문 어디에도 없고 흐름과도 반대임."],"om":["장려되는","내키지 않는","망설이는","할 수 없는"],"en":"Through this setup, companies simply lease out products that were once sold directly to the customer. With this transition of ownership, companies maintain profit by offering maintenance and repair services and are encouraged to develop long-lasting products.","ko":"이런 구조를 통해 기업들은 한때 고객에게 직접 팔던 제품을 그냥 임대한다. 이런 소유권의 전환으로 기업들은 유지 관리와 수리 서비스를 제공해 수익을 유지하고, 오래가는 제품을 개발하도록 장려된다.","hl":["encouraged to develop long-lasting products","transition of ownership"],"khl":["오래가는 제품을 개발하도록 장려된다","소유권의 전환"],"blocks":[{"t":"p","h":"누구의 물건인가","x":["옛 방식: 제품을 팔면 고객의 물건이 된다.","새 방식: 빌려주니 제품은 계속 기업의 물건이다.","내 물건이 빨리 망가지면 손해 보는 건 기업이다.","그러니 기업은 오래가는 제품을 만들고 싶어진다.","reluctant(꺼리는)를 넣으면 이 손익 계산이 뒤집힌다."]},{"t":"tap","h":"한 줄로 정리","q":"새 방식에서 기업의 돈줄은?","a":["새 제품 판매가 아니라 관리·수리 서비스.","그래서 제품은 오래갈수록 좋다."]}],"post":["encouraged(장려되는) ↔ reluctant(꺼리는)","빌려주는 기업 = 오래가는 제품이 이익"]},{"slots":[["necessary","vital","s"],["incorporated","built","s"],["limited"],["elimination","accumulation","a"],["lease_out"]],"opts":["elimination","production","spread","increase"],"or":["elimination(제거): 수리와 재제조는 폐기를 없애는 수단이라 '폐기 제거'와 짝이 맞음.","production(생산): 수리를 통해 폐기를 생산한다는 건 말이 안 됨.","spread(확산): 수리와 재제조는 폐기를 퍼뜨리는 게 아니라 줄이는 일임.","increase(증가): 폐기를 늘리는 건 옛 방식이라 새 수요를 설명하지 못함."],"om":["제거","생산","확산","증가"],"en":"prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand … is mistake. On twenty-six occasions in the last fifty years, a second has been added to everyone's day to {adjust} for the Earth wobbling and the rate of its spin changing. For instance, when El Niño, a climatic system in the Pacific, causes wind speed to change {dramatically}, it can {slow} the rotation of the Earth {slightly}. Indeed, the Earth's spin is generally slowing because the moon's gravity is acting as a {drag}, so days are getting {longer} by about 1.7 milliseconds per century. Such events {disturb} the {similarity} between man-made time and more {flexible} time based on the Earth's {naturally} occurring rotation. When events like this happen, a bunch of humans make the decision to add a small slice of time to your day, without your knowledge. We try to force our {fixed}, man-made view of time on nature in the {false} hope that it will {yield}. It doesn't.","fn":["*psyche: 정신, 마음","*wobble: 흔들리다","*El Niño: 엘니뇨","*millisecond: 밀리초(1,000분의 1초)"],"mean":{"consistent":"일관된, 한결같은","variable":"변하기 쉬운, 가변적인","cemented":"동사 cement(굳히다, 고착시키다)의 과거형","instilled":"동사 instill(서서히 심어 주다)의 과거형","artificial":"인위적인, 인공의","natural":"자연스러운, 자연의","forced":"동사 force(강요하다)의 과거분사형. be forced to = 어쩔 수 없이 ~하다","compelled":"동사 compel(강요하다)의 과거분사형. be compelled to = 어쩔 수 없이 ~하다","acknowledge":"인정하다","admit":"인정하다","deny":"부인하다","adjust":"조정하다, 맞추다. adjust for = ~에 맞춰 조정하다","compensate":"보상하다, 메우다. compensate for = ~을 보정하다","dramatically":"극적으로, 크게","sharply":"급격히","slow":"늦추다, 느리게 하다","accelerate":"가속하다, 빠르게 하다","slightly":"약간","marginally":"아주 조금","drag":"끌어당기는 힘, 저항(속도를 늦추는 것)","brake":"브레이크, 제동 장치","boost":"밀어 올리는 힘, 촉진","longer":"형용사 long(긴)의 비교급. 더 긴","shorter":"형용사 short(짧은)의 비교급. 더 짧은","disturb":"방해하다, 흐트러뜨리다","disrupt":"방해하다, 지장을 주다","reinforce":"강화하다","similarity":"유사성, 닮음","correspondence":"일치, 부합","flexible":"유연한","rigid":"경직된, 딱딱한","naturally":"자연적으로, 저절로","artificially":"인공적으로","fixed":"고정된","inflexible":"융통성 없는, 고정된","changeable":"변하기 쉬운","false":"거짓된, 헛된","vain": ","적응력 있는"],"en":"Such events disturb the similarity between man-made time and more flexible time based on the Earth's naturally occurring rotation. … We try to force our fixed, man-made view of time on nature in the false hope that it will yield.","ko":"그런 일들은 사람이 만든 시간과 지구의 자연스러운 자전에 기반한 더 유연한 시간 사이의 유사성을 흐트러뜨린다. … 우리는 자연이 따라 줄 거라는 헛된 희망을 품고 고정된, 사람이 만든 시간관을 자연에 강요하려 한다.","hl":["our fixed, man-made view of time","more flexible time"],"khl":["고정된, 사람이 만든 시간관","더 유연한 시간"],"blocks":[{"t":"pair","h":"두 시간 나란히","x":[["man-made time","사람이 만든 시간: 고정됨, 늘 똑같음"],["time based on the Earth's naturally occurring rotation","자전에 기반한 시간: 유연함, 조금씩 변함"]]},{"t":"p","h":"changeable(변하기 쉬운)을 넣으면","x":["사람의 시간관이 변하기 쉽다는 말이 된다.","그런데 변하는 건 자연의 시간이다.","사람의 시간관은 변하지 않아서 문제다.","그래서 자연에 억지로 force(강요하다)하는 것이다."]},{"t":"p","h":"고치면 안 되는 두 단어","x":["compelled(강요받은)는 forced(강요받은)와 같은 뜻이다.","correspondence(일치)는 similarity(유사성)처럼 두 시간이 맞아떨어지는 정도를 말한다."]}],"post":["fixed(고정된) ↔ changeable(변하기 쉬운)","사람의 시간 = 고정, 자연의 시간 = 유연"]}],"quiz":[{"w":"artificial","m":"인위적인, 인공의","it":[["man-made","사람이 만든","s"],["natural","자연의","a"],["juicy","즙이 많은","n"],["synthetic","합성의, 인조의","s"],["genuine","진짜의","a"],["brave","용감한","n"],["sleepy","졸린","n"]]},{"w":"slow","m":"늦추다","it":[["decelerate","감속하다","s"],["accelerate","가속하다","a"],["borrow","빌리다","n"],["slacken","늦추다","s"],["quicken","빠르게 하다","a"],["paint","칠하다","n"],["whisper","속삭이다","n"]]},{"w":"acknowledge","m":"인정하다","it":[["admit","인정하다","s"],["deny","부인하다","a"],["bake","굽다","n"],["recognize","인정하다, 알아보다","s"],["ignore","무시하다","a"],["swim","수영하다","n"],["fold","접다","n"]]},{"w":"drag","m":"끌어당기는 힘, 저항","it":[["hindrance","방해","s"],["boost","촉진, 밀어 올림","a"],["ceiling","천장","n"],["obstacle","장애물","s"],["aid","도움","a"],["recipe","조리법","n"],["festival","축제","n"]]},{"w":"fixed","m":"고정된","it":[["unchanging","변하지 않는","s"],["flexible","유연한","a"],["hungry","배고픈","n"],["rigid","경직된","s"],["changeable","변하기 쉬운","a"],["polite","공손한","n"],["muddy","진흙투성이의","n"]]}]},{"items": :["between A and B(A와 B 사이)로 두 시간을 비교한다.","A는 man-made time(사람이 만든 시간).","B는 지구 자전에 기반한 시간.","자전은 엘니뇨에 흔들리고 달 때문에 느려진다.","그러니 B는 사정에 따라 변하는 유연한 시간이다.","rigid(경직된)를 넣으면 B가 오히려 사람의 시간처럼 딱딱해진다."]},{"t":"tap","h":"질문 하나","q":"사람의 시간과 자연의 시간 중 더 딱딱한 쪽은?","a":["사람의 시간.","끝 문장이 our fixed(우리의 고정된), man-made view(사람이 만든 관점)라고 말한다."]},{"t":"p","h":"함정","x":["compensate for(~을 보정하다)는 adjust for(~에 맞춰 조정하다)와 뜻이 통한다.","give in(굴복하다)은 yield(굴복하다)와 같은 뜻이다."]}],"post":["flexible(유연한) ↔ rigid(경직된)","자전에 기반한 시간 = 흔들리고 변하는 시간"]},{"slots":[["artificial"],["dramatically","sharply","s"],["drag"],["disturb","reinforce","a"],["fixed"]],"opts":["disturb","preserve","strengthen","confirm"],"or":["disturb(흐트러뜨리다): 자전이 흔들리고 느려지면 사람의 시간과 자연의 시간이 어긋나므로 맞음.","preserve(지키다): 두 시간의 닮음을 지켜 준다면 1초를 더할 필요가 없음.","strengthen(강화하다): 어긋남을 만드는 사건들이 두 시간을 더 닮게 할 수는 없음.","confirm(확인해 주다): 두 시간이 닮았다는 걸 확인해 준다면 실수를 인정한다는 흐름과 반대임."],"om":["흐트러뜨리다","지키다","강화하다","확인해 주다"],"en":"Such events disturb the similarity between man-made time and more flexible time based on the Earth's naturally occurring rotation. When events like this happen, a bunch of humans make the decision to add a small slice of time to your day, without your knowledge.","ko":"그런 일들은 사람이 만든 시간과 지구의 자연스러운 자전에 기반한 더 유연한 시간 사이의 유사성을 흐트러뜨린다. 이런 일이 일어나면 몇몇 사람들이 여러분도 모르게 여러분의 하루에 작은 시간 조각을 더하기로 결정한다.","hl":["disturb the similarity","add a small slice of time"],"khl":["유사성을 흐트러뜨린다","작은 시간 조각을 더하기로"],"blocks":[{"t":"p","h":"그 뒤에 무슨 일이 생기나","x":["바로 다음 문장: 사람들이 하루에 시간을 몰래 더한다.","왜 더할까? 두 시간이 어긋났기 때문이다.","reinforce(강화하다)를 넣으면 두 시간이 더 잘 맞게 된다.","잘 맞는데 시간을 더할 이유가 없다."]},{"t":"p","h":"Such events가 무엇인가","x":["Such events(그런 사건들)는 앞에 나온 일들이다.","엘니뇨로 자전이 느려지는 일.","달의 중력으로 하루가 길어지는 일.","모두 자연 쪽 시간이 움직이는 사건이다."]},{"t":"p","h":"sharply(급격히)는 그대로","x":["change sharply(급격히 바뀌다)는 change dramatically(극적으로 바뀌다)와 같은 뜻이다."]}],"post":["disturb(흐트러뜨리다) ↔ reinforce(강화하다)","자연이 움직임 → 두 시간이 어긋남 → 1초 추가"]},{"slots":[["acknowledge"],["longer"],["naturally"],["false"],["yield","resist","a"]],"opts":["yield","rebel","refuse","fight"],"or":["yield(굴복하다): 자연이 사람 시간표에 맞춰 줄 거라는 희망이 헛되다는 결론이라 맞음.","rebel(반항하다): 자연이 반항하길 바라며 시간관을 강요하는 사람은 없음.","refuse(거부하다): 자연이 거부하길 바란다는 건 희망이라는 말과 맞지 않음.","fight(맞서 싸우다): 강요하는 쪽이 상대가 맞서 싸우길 바랄 리 없음."],"om":["굴복하다","반항하다","거부하다","맞서 싸우다"],"en":"We try to force our fixed, man-made view of time on nature in the false hope that it will yield. It doesn't.","ko":"우리는 자연이 따라 줄 거라는 헛된 희망을 품고 고정된, 사람이 만든 시간관을 자연에 강요하려 한다. 자연은 따라 주지 않는다.","hl":["in the false hope that it will yield","It doesn't."],"khl":["자연이 따라 줄 거라는 헛된 희망","자연은 따라 주지 않는다"],"blocks":[{"t":"tap","h":"질문 하나","q":"억지로 강요하는 사람이 바라는 것은?","a":["상대가 따라 주는 것.","force(강요하다)와 hope(희망) 사이에는 \"따라 주길\"이 들어가야 한다."]},{"t":"p","h":"마지막 두 단어의 반전","x":["It doesn't(그러지 않는다).가 희망을 깨뜨린다.","자연은 따라 주지 않는다.","resist(저항하다)를 넣으면 \"자연이 저항하길 바랐는데, 저항하지 않는다\"가 된다.","그러면 자연이 순순히 따른다는 결론이 되어 글 전체와 부딪친다."]}],"post":["yield(굴복하다) ↔ resist(저항하다)","자연 = 사람 시간표에 굴복하지 않음"]},{"slots":[["acknowledge","admit","s"],["drag","brake","s"],["similarity"],["naturally","artificially","a"],["fixed"]],"opts":["naturally","mechanically","deliberately","manually"],"or":["naturally(자연적으로): 지구 자전은 누가 돌리는 게 아니라 저절로 일어나므로 맞음.","mechanically(기계적으로): 기계가 돌리는 자전이라는 말이 되어 사실과 맞지 않음.","deliberately(의도적으로): 누군가 일부러 자전을 일으킨다는 뜻이 되어 말이 안 됨.","manually(손으로): 사람이 손으로 돌리는 자전은 없음."],"om":["자연적으로","기계적으로","의도적으로","손으로"],"en":"Such events disturb the similarity between man-made time and more flexible time based on the Earth's naturally occurring rotation.","ko":"그런 일들은 사람이 만든 시간과 지구의 자연스러운 자전에 기반한 더 유연한 시간 사이의 유사성을 흐트러뜨린다.","hl":["the Earth's naturally occurring rotation","man-made time"],"khl":["지구의 자연스러운 자전","사람이 만든 시간"],"blocks":[{"t":"p","h":"대조로 짝짓기","x":["man-made(사람이 만든) 시간과 짝을 이루는 상대가 필요하다.","상대는 자연이 만든 시간이다.","artificially(인공적으로)를 넣으면 두 시간이 모두 사람이 만든 것이 된다.","비교가 무너진다."]},{"t":"p","h":"함정 두 개","x":["admit(인정하다)은 acknowledge(인정하다)와 같은 뜻이다.","acting as a brake(브레이크로 작용하다)는 acting as a drag(끌어당기는 힘으로 작용하다)처럼 자전을 늦춘다는 말이다."]}],"post":["naturally(자연적으로) ↔ artificially(인공적으로)","사람이 만든 시간 ↔ 자연이 만든 시간"]}],"quiz":[{"w":"consistent","m":"일관된, 한결같은","it":[["steady","꾸준한, 한결같은","s"],["inconsistent","일관성 없는","a"],["hungry","배고픈","n"],["constant","변함없는","s"],["irregular","불규칙한","a"],["wooden","나무로 된","n"],["generous","관대한","n"]]},{"w":"flexible","m":"유연한","it":[["adaptable","적응력 있는","s"],["rigid","경직된","a"],["salty","짠","n"],["elastic","탄력 있는","s"],["inflexible","융통성 없는","a"],["ancient","고대의","n"],["humid","습한","n"]]},{"w":"disturb","m":"방해하다, 흐트러뜨리다","it":[["disrupt","방해하다","s"],["settle","안정시키다","a"],["knit","뜨개질하다","n"],["upset","어지럽히다","s"],["calm","진정시키다","a"],["sneeze","재채기하다","n"],["pour","붓다","n"]]},{"w":"yield","m":"굴복하다, 따르다","it":[["give in","굴복하다","s"],["resist","저항하다","a"],["chew","씹다","n"],["surrender","항복하다","s"],["defy","반항하다","a"],["bake","굽다","n"],["dig","파다","n"]]},{"w":"naturally","m":"자연적으로, 저절로","it":[["inherently","본래, 본질적으로","s"],["artificially","인공적으로","a"],["loudly","큰 소리로","n"],["spontaneously","자연 발생적으로","s"],["unnaturally","부자연스럽게","a"],["politely","공손하게","n"],["weekly","매주","n"]]}]}],"no":"40"}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+'번<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+'번 · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+'번 지문</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
