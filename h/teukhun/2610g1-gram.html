o":"그들은 구인 게시판으로 가서 비슷한 직함의 일자리를 찾는다.","hl":["head","search"],"khl":["가서","찾는다"],"blocks":[{"t":"p","h":"and(그리고)는 저울이다","x":["and(그리고) 양쪽에는 같은 모양이 올라가야 균형이 맞는다.","왼쪽 접시: They head (그들은 간다)","오른쪽 접시: search (찾는다)","head(가다)가 현재형 동사니까 search(찾다)도 현재형 동사.","searching(찾는 것)을 올리면 저울이 기운다."]},{"t":"pair","h":"쉬운 예시","x":[["She opens the door and walks in.","그녀는 문을 열고 걸어 들어온다. (opens and walks = 열고 걸어 들어온다)"],["I like to swim and to run.","나는 수영하는 것과 달리는 것을 좋아한다. (to swim and to run(수영하는 것과 달리는 것))"]]}],"post":["and(그리고) 앞뒤는 같은 모양: head and search(가다와 찾다)"]},{"slots":[["there","","","주어 a repeating theme(반복되는 주제)가 단수라 is(’s, 있다)가 맞다."],["that","what","a","앞에 the belief(믿음)라는 명사가 있다. 그 내용을 설명할 땐 what(~하는 것)이 아니라 that(~라는)."],["alter","","","do little to(거의 ~하지 않다) + 동사원형. \"~하려는 일을 거의 안 한다\"."],["hoping","","","콤마 뒤에서 \"~하길 바라면서\"라고 덧붙이는 분사구문이다."],["rearranging","","","전치사 like(~와 같은) 뒤라서 동명사(-ing)가 맞다."]],"opts":["that","which","whose","whom"],"or":["that(~라는, 접속사): 명사 the belief(믿음)의 내용을 완전한 문장으로 풀어 주는 동격 that이라 맞음.","which(~하는, 관계대명사): 뒤에 빈자리가 있어야 하는데 things will change(상황이 바뀔 것이다)는 완전한 문장임.","whose(~의, 소유격 관계대명사): 바로 뒤에 꾸밀 명사가 와야 하는데 someday(언젠가)가 와서 안 됨.","whom(~을, 목적격 관계대명사): 사람 명사를 받는 말인데 the belief(믿음)는 사람이 아니고 뒤 문장도 완전함."],"point":"that vs. what","en":"Among unsatisfied professionals, there’s a repeating theme—the belief that someday things will miraculously change.","ko":"불만족한 직장인들 사이에는 반복되는 주제가 있다. 언젠가 상황이 기적처럼 바뀔 거라는 믿음이다.","hl":["the belief that","things will miraculously change"],"khl":["믿음","기적처럼 바뀔"],"blocks":[{"t":"p","h":"what(~하는 것)은 명사를 품고 다닌다","x":["what(~하는 것) = the thing which(~하는 것). 이미 \"것\"이라는 명사가 들어 있다.","그래서 what(~하는 것) 앞에는 명사가 또 올 수 없다.","the belief what은 \"믿음 ~하는 것\"처럼 명사가 둘이 된다.","the belief that(~라는 믿음): that(~라는) 뒤 문장이 믿음의 내용이다."]},{"t":"pair","h":"쉬운 예시","x":[["I heard the news that he won.","나는 그가 이겼다는 소식을 들었다. (명사 + that)"],["What he said was true.","그가 말한 것은 사실이었다. (명사 없이 what)"]]},{"t":"tap","h":"확인 질문","q":"that(~라는) 뒤 문장(things will .p.도 과거형도 안 됨.","feel(느끼다): 사역동사 make(~하게 하다) + 목적어 뒤는 동사원형이라 맞음.","feels(느끼다, 3인칭 단수형): 목적격보어 자리는 동사원형이라 s가 붙으면 안 됨."],"point":"목적격보어(준동사)","en":"Efforts like this make professionals feel like they are doing something.","ko":"이런 노력은 직장인들에게 뭔가를 하고 있다는 기분이 들게 한다.","hl":["make professionals feel","Efforts like this"],"khl":["기분이 들게 한다","이런 노력은"],"blocks":[{"t":"p","h":"시키는 동사는 to를 싫어한다","x":["make(만들다), let(허락하다), have(시키다)는 \"~하게 시키다\"라는 사역동사다.","이 셋 뒤의 사람은 바로 동사원형으로 움직인다.","make professionals feel: 직장인들이 느끼게 만든다.","to를 넣으면 틀린다. 시험에서 제일 많이 노리는 함정."]},{"t":"pair","h":"쉬운 예시","x":[["My mom made me clean my room.","엄마는 내가 방을 청소하게 했다. (made me clean = 내가 청소하게 했다)"],["Let me go.","나를 가게 해 줘. (let me go = 나를 가게 해 줘)"]]},{"t":"p","h":"헷갈리는 짝","x":["want(원하다), ask(부탁하다), tell(말하다)은 사역동사가 아니라 to가 붙는다.","She wants me to study. (그녀는 내가 공부하길 원한다.)"]}],"post":["make(만들다) + 사람 + 동사원형 (to 없음)"]}],"quiz":[{"s":"The students in my class ___ very kind.","o":["is","are"],"a":1,"ko":"우리 반 학생들은 매우 친절하다.","why":"주어는 The students(학생들). in my class(우리 반의)는 꼬리표.","wy":"is(~이다): 단수 동사라 복수 주어 The students(학생들)와 안 맞음."},{"s":"He finished his homework and ___ to bed.","o":["went","going"],"a":0,"ko":"그는 숙제를 끝내고 잠자리에 들었다.","why":"finished(끝냈다) and went(갔다). 동사끼리 나란히.","wy":"going(가는 것): -ing는 혼자 동사 자리에 못 와서 finished(끝냈다)와 짝이 안 맞음."},{"s":"There is a rumor ___ the school will close.","o":["what","that"],"a":1,"ko":"학교가 문을 닫을 거라는 소문이 있다.","why":"명사 a rumor(소문) 뒤, 완전한 문장이라 that.","wy":"what(~하는 것): 앞에 명사 a rumor(소문)가 있고 뒤 문장도 완전해서 못 옴."},{"s":"He answered the question ___.","o":["quickly","quick"],"a":0,"ko":"그는 질문에 빠르게 대답했다.","why":"동사 answered(대답했다)를 꾸미니 부사.","wy":"quick(빠른): 형용사라 동사 answered(대답했다)를 꾸밀 수 없음."},{"s":"The teacher made us ___ the poem.","o":["memorize","to memorize"],"a":0,"ko":"선생님은 우리에게 그 시를 외우게 했다.","why":"make(만들다) + 사람 + 동사원형.","wy":"to memorize(외우는 것): 사역동사 make(~하게 하다) 뒤에는 to 없이 동사원형이 와야 함."}]},{"items":[{"slots":[["there","","","주어 a repeating theme(반복되는 주제)가 단수라 is(’s, 있다)." 부사가 맞음.","completes(완성하다, 3인칭 단수형): to 뒤에 s 붙은 동사가 못 오고, switch up(확 바꾸다)과 동사가 겹침.","completed(완성했다, complete의 과거·과거분사형): to 뒤 원형 자리에 안 맞고, switch up(확 바꾸다)과 동사가 겹침."],"point":"형용사 자리 vs. 부사 자리","en":"You’ve got to completely switch up your approach.","ko":"여러분은 접근 방식을 완전히 바꿔야 한다.","hl":["completely switch up"],"khl":["완전히 바꿔야"],"blocks":[{"t":"p","h":"to와 동사 사이에 낀 말","x":["have got to + 동사원형 = ~해야 한다.","to 뒤의 진짜 동사는 switch up(바꾸다)이다.","그 사이에 끼어 동사를 꾸미는 말은 부사(-ly)다.","complete(완전한)는 형용사라 명사만 꾸민다. a complete change(완전한 변화)처럼.","complete(완전한)를 동사(완성하다)로 읽어도 뒤에 switch up(확 바꾸다)이 또 있어 동사가 겹친다."]},{"t":"pair","h":"쉬운 예시","x":[["I completely forgot your birthday.","나는 네 생일을 완전히 잊어버렸다. (동사 forgot ← 부사)"],["It was a complete surprise.","그건 완전한 깜짝 선물이었다. (명사 surprise ← 형용사)"]]}],"post":["동사(switch up) 꾸미면 -ly: completely switch up(완전히 확 바꾸다)"]},{"no":"21","slots":[["there","","","주어 a repeating theme(반복되는 주제)가 단수."],["hoping","","","덧붙인 분사구문."],["themselves","","","주어 they(그들) 자신."],["rearranging","rearrange","a","like는 여기서 \"~와 같은\"이라는 전치사. 전치사 뒤에 동사를 쓰려면 -ing."],["completely","","","switch up(확 바꾸다)을 꾸미는 부사."]],"opts":["rearranges","to rearrange","had rearranged","rearranging"],"or":["rearranges(재배치하다, 3인칭 단수형): 전치사 like(~와 같은) 뒤에 동사가 그대로 올 수 없음.","to rearrange(재배치하는 것): 전치사 like(~와 같은) 뒤에는 to부정사가 못 옴.","had rearranged(재배치했었다, 과거완료형): 동사라 전치사 뒤에 못 오고, It’s(그것은 ~이다)의 현재 시제와도 안 맞음.","rearranging(재배치하는 것, 동명사): 전치사 like(~와 같은) 뒤라 동명사가 맞음."],"point":"전치사 + 동명사","en":"It’s like rearranging deck chairs on the Titanic.","ko":"그것은 타이타닉호의 갑판 의자를 다시 배치하는 것과 같다.","hl":["like rearranging","It’s"],"khl":["다시 배치하는 것과 같다","그것은"],"blocks":[{"t":"p","h":"like(좋아하다 / ~와 같은)의 두 얼굴","x":["동사 like(좋아하다): I like pizza. (나는 피자를 좋아한다)","전치사 like(~와 같은): It’s like a dream. (그건 꿈 같다)","여기는 It’s(It is) 뒤라서 전치사 like, \"~와 같은\".","전치사 뒤에 동사가 오려면 -ing 옷을 입는다."]},{"t":"pair","h":"쉬운 예시","x":[["Thank you for helping me.","도와줘서 고마워. (for helping)"],["It’s like riding a bike.","그건 자전거 타는 것과 같다."]]}],"post":["전치사(like) 뒤 동사는 -ing: like rearranging(재배치하는 것과 같은)"]}],"compquiz":[{"s":"She ___ forgot my name.","o":["completely","complete"],"a":0,"ko":"그녀는 내 이름을 완전히 잊어버렸다.","why":"동사 forgot(잊어버렸다)을 꾸미니 부사.","wy":"complete(완전한): 형용사라 동사 forgot(잊어버렸다)을 꾸밀 수 없음."},{"s":"He left without ___ goodbye.","o":["saying","say"],"a":0,"ko":"그는 작별 인사도 없이 떠났다.","why":"전치사 without(~없이) 뒤는 -ing.","wy":"say(말하다): 전치사 without(~없이) 뒤에 동사원형은 못 옴."}]},{"id":"2610g1-22","no":"22","title":"어법특훈 · 26년 10월 고1 22번","sub":"시간은 사회가 만든 것","tpl":"Sociologists argue that our perception and usage of time {are1|are} not just basic properties of nature, like a clock {ticking|ticking} away in the background, {nor_are|nor are they} simply psychological phenomena of individual experience. Instead, {how1|how} we perceive and {understand|understand} time {is1|is} to a large degree {shaped|shaped} by tradition and cultural norms. Eviatar Zerubavel’s work, The Seven Day Circle: The History and Meaning of the Week, {demonstrates|demonstrates} how the week, a fundamental unit of time, {is2|is} a social invention {that1|that} {varies|varies} across cultures, {influencing|influencing} how people structure {their|their} activities and rhythms of life. Why do we consider a nine-to-five job routine? Why don’t many of us {work|work} on the weekends? Why do we usually pay our bills at the end of the month? Why {is3|is} the retirement age sixty-five? These numbers and patterns {arent|aren’t} really {dictated|dictated} by nature or any essential human characteristic, but are rather social creations {that2|that} we internalize and {come|come} to accept as “normal.”","fn":[],"mean":{"ticking":"째깍거리는(tick의 -ing형)","are":"~이다(be의 현재형, 복수 주어)","is":"~이다(be의 현재형, 단수 주어)","nor are they":"그것들도 ~이 아니다(nor + 동사 + 주어 도치)","nor they are":"그것들도 ~이 아니다(도치 안 한 틀린 어순)","nor is they":"그것들도 ~이 아니다(is는 단수형이라 they와 수 불일치)","nor are them":"그것들을 ~도 아니다(목적격 them이 주어 자리에 온 틀린 형태)","nor they is":"그것들도 ~이 아니다(도치도 수일치도 틀린 형태)","how":"~하는 방식, 어떻게(관계부사·의문사)","what":"~하는 것(선행사를 품은 관계대명사)","which":"~하는(관계대명사)","whose":"~의(소유격 관계대명사)","whom":"~을(목적격 관계대명사)","that":"~하는(관계대명사)","where":"~하는 곳(관계부사)","when":"~하는 때(관계부사)","understand":"이해하다(동사원형·현재형)","understanding":"이해하는 것, 이해하는(understand의 -ing형)","understands":"이해하다(understand의 3인칭 단수 현재형)","to understand":"이해하는 것(understand의 to부정사)","to understanding":"이해하는 것으로(전치사 to + 동명사)","isn’t":"~이 아니다(is not)","aren’t":"~이 아니다(are not)","wasn’t":"~이 아니었다(was not)","doesn’t":"~하지 않다(does not, 일반동사 부정)","don’t":"~하지 않다(do not, 일반동사 부정)","shaped":"형성된(shape의 과거분사형)","shaping":"형성하는(shape의 -ing형)","shape":"형성하다(동사원형)","shapes":"형성하다(shape의 3인칭 단수 현재형)","been shaped":"형성되어 온(have/has 뒤에서 쓰는 완료 수동형)","demonstrates":"보여 주다(demonstrate의 3인칭 단수 현재형)","demonstrate":"보여 주다(동사원형)","demonstrating":"보여 주는(demonstrate의 -ing형)","to demonstrate":"보여 주는 것(demonstrate의 to부정사)","have demonstrated":"보여 주었다(demonstrate의 현재완료형, 복수 주어용)","being":"~인 것, ~인(be의 -ing형)","be":"~이다(be동사 원형)","to be":"~인 것(be의 to부정사)","varies":"서로 다르다(vary의 3인칭 단수 현재형)","influencing":"영향을 주면서(influence의 -ing형, 분사구문)","influences":"영향을 주다(influence의 3인칭 단수 현재형)","influence":"영향을 주다(동사원형)","have influenced":"영향을 주어 왔다(influence의 현재완료형)","to influencing":"영향을 주는 것으로(전치사 to + 동명사)","their":"그들의(they의 소유격)","them":"그들을(they의 목적격)","they":"그들은, 그것들은(주격)","theirs":"그들의 것(소유대명사)","themselves":"그들 자신(they의 재귀대명사)","work":"일하다(동사원형)","working":"일하는 것, 일하는(work의 -ing형)","worked":"일했다(work의 과거형·과거분사형)","works":"일하다(work의 3인칭 단수 현재형)","to work":"일하는 것(work의 to부정사)","dictated":"정해진(dictate의 과거분사형)","dictating":"정하는(dictate의 -ing형)","dictate":"정하다, 좌우하다(동사원형)","dictates":"정하다(dictate의 3인칭 단수 현재형)","have dictated":"정해 왔다(dictate의 현재완료형)","come":"(~하게) 되다, 오다(동사원형)","coming":"오는 것, 오는(come의 -ing형)","building":"짓고 있는(build의 -ing형)","built":"지어진(build의 과거분사형)","lives":"살다(live의 3인칭 단수 현재형)","living":"사는 것, 사는(live의 -ing형)","can I":"(nor 뒤에서) 나도 ~ 못 한다(도치: 조동사 + 주어)","I can":"나는 할 수 있다(보통 어순)","wash":"씻다(동사원형)","washing":"씻는 것(wash의 -ing형)","made":"만들었다(make의 과거형)","making":"만들면서(make의 -ing형, 분사구문)","breaking":"깨뜨리는(break의 -ing형)","broken":"깨진(break의 과거분사형)"},"sets":[{"items":[{"slots":[["ticking","","","시계가 스스로 째깍거리니 능동 -ing가 a clock(시계)을 꾸민다."],["is1","","","주어 how(~하는 방식) ~ time(시간)은 \"~하는 방식\"이라는 덩어리 하나라 단수 is(~이다)."],["work","","","don’t(~하지 않다) 뒤라서 동사원형 work(일하다)."],["is3","","","주어 the retirement age(은퇴 나이)가 단수라 is(~이다)."],["arent","isn’t","a","주어는 These numbers and patterns(이 숫자와 패턴). and(그리고)로 묶인 복수라 aren’t(are not, ~이 아니다)."]],"opts":["wasn’t","aren’t","doesn’t","don’t"],"or":["wasn’t(~이 아니었다, was not): 단수 과거형이라 복수 주어와 안 맞고, 지금도 그렇다는 현재 이야기와도 안 맞음.","aren’t(~이 아니다, are not): 주어 numbers and patterns(숫자와 패턴)가 복수이고 dictated(정해진)와 수동태를 이루는 be동사라 맞음.","doesn’t(~하지 않다, does not): 일반동사 부정이라 dictated(정해진)와 수동태를 만들 수 없고 단수형이기도 함.","don’t(~하지 않다, do not): 수는 맞지만 do(조동사) 뒤엔 동사원형이 와야 해서 dictated(정해진)와 못 어울림."],"point":"주어-동사 수일치","en":"These numbers and patterns aren’t really dictated by nature or any essential human characteristic.","ko":"이러한 숫자와 패턴은 사실 자연이나 어떤 본질적인 인간 특성에 의해 정해진 것이 아니다.","hl":["numbers and patterns","aren’t"],"khl":["숫자와 패턴은","아니다"],"blocks":[{"t":"p","h":"and(그리고)는 1 + 1 = 2","x":["A and B로 묶인 주어는 둘 이상이다.","numbers(숫자들) + patterns(패턴들). 둘 다 s가 붙은 복수다.","그래서 be동사는 are(~이다), 부정하면 aren’t(are not, ~이 아니다).","isn’t(~이 아니다)는 주어가 하나일 때만 쓴다.","뒤에 이어지는 but are rather(오히려 ~이다)의 are(~이다)도 같은 주어를 받는 복수 동사다."]},{"t":"pair","h":"쉬운 예시","x":[["Tom and Jerry are friends.","톰과 제리는 친구다. (Tom and Jerry(톰과 제리) → are(~이다))"],["My cat and my dog sleep together.","내 고양이와 개는 같이 잔다. (둘 → sleep(잔다))"]]}],"post":["A and B 주어 = 복수: numbers and patterns aren’t(숫자와 패턴은 ~이 아니다)"]},{"slots":[["nor_are","","","nor(~도 아니다) 뒤라서 동사가 주어 앞으로 나온 도치 어순."],["how1","what","a","뒤 문장 we perceive and understand time(우리가 시간을 인식하고 이해한다)에 빠진 자리가 없다. what(~하는 것)은 빈자리가 있어야 쓴다."],["understand","","","perceive(인식하다)와 and(그리고)로 나란한 동사원형."],["shaped","","","방식은 전통에 의해 '만들어지는' 쪽이라 is shaped(형성되다)."],["demonstrates","","","주어 work(저서)가 단수라 -s."]],"opts":["which","whose","whom","how"],"or":["which(~하는, 관계대명사): 앞에 꾸밀 명사가 없고 뒤 문장도 빠진 자리 없이 완전해서 못 옴.","whose(~의, 소유격 관계대명사): 바로 뒤에 명사가 와야 하는데 we(우리)가 와서 안 됨.","whom(~을, 목적격 관계대명사): 앞에 받을 사람 명사가 없고 뒤에 빠진 목적어도 없음.","how(~하는 방식): 뒤 문장 we perceive and understand time(우리가 시간을 인식하고 이해하다)이 완전해서 맞음."],"point":"관계대명사 vs. 관계부사","en":"Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.","ko":"오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다.","hl":["how","perceive and understand time"],"khl":["시간을 인식하고 이해하는 방식은"],"blocks":[{"t":"p","h":"빈자리 검사","x":["what(~하는 것)은 뒤 문장에 빈자리가 있을 때 쓴다.","What I want is a rest.(내가 원하는 것은 휴식이다.)에서는 want(원하다)의 목적어 자리가 비어 있다.","이 문장: we perceive and understand time(우리가 시간을 인식하고 이해하다).","주어 we(우리), 동사 perceive(인식하다)·understand(이해하다), 목적어 time(시간)이 다 있다.","빈자리가 없으니 what(~하는 것)은 못 온다.","\"~하는 방식\"이라는 how(~하는 방식)가 맞다."]},{"t":"pair","h":"쉬운 예시","x":[["How you speak is important.","네가 말하는 방식이 중요하다. (빈자리 없음 → how)"],["What you said is true.","네가 말한 것은 사실이다. (said의 목적어가 빔 → what)"]]},{"t":"tap","h":"확인 질문","q":"how(~하는 방식) 대신 what(~하는 것)을 넣으면 time(시간)은 어떻게 되는가?","a":["time(시간)이 남는 단어가 된다.","what(~하는 것)이 이미 목적어 자리를 차지했는데 time(시간)이 또 있어 자리가 겹친다."]}],"post":["빈자리 없는 문장 앞은 how(~하는 방식), 빈자리 있는 문장 앞은 what(~하는 것)"]},{"slots":[["how1","","","뒤가 완전한 문장이라 \"~하는 방식\"의 how(~하는 방식)."],["is1","","","주어 how(~하는 방식) ~ time(시간)은 덩어리 하나라 단수 is(~이다)."],["shaped","shaping","a","방식은 전통에 의해 '만들어지는' 쪽이다. by tradition(전통에 의해)이 증거. shape(만들다)의 목적어도 없다."],["is2","","","the week(주)의 진짜 동사 자리라 is(~이다)."],["that1","","","a social invention(사회적 발명품)을 꾸미는 주격 관계대명사."]],"opts":["shape","shapes","shaped","been shaped"],"or":["shape(형성하다): be동사 is(~이다) 뒤에 동사원형이 그대로 올 수 없음.","shapes(형성하다, 3인칭 단수형): 이미 is(~이다)가 있어 동사가 겹침.","shaped(형성된, shape의 과거분사): 방식은 전통에 의해 만들어지는 쪽이라 is shaped by(~에 의해 형성되다)가 맞음.","been shaped(형성되어 온): been(be의 과거분사)은 have/has(완료형을 만드는 조동사) 뒤에서만 쓰는데 앞에 is(~이다)가 있어 안 됨."],"point":"능동태 vs. 수동태","en":"Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.","ko":"오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다.","hl":["is to a large degree shaped","by tradition"],"khl":["전통과 문화적 규범에 의해","형성된다"],"blocks":[{"t":"p","h":"끼어든 말 걷어내기","x":["is(~이다)와 shaped(형성된) 사이에 to a large degree(상당 부분)가 끼어 있다.","걷어내면 is shaped by tradition(전통에 의해 형성되다).","방식이 무언가를 만드는 게 아니다.","전통이 방식을 만든다. 방식은 만들어진다.","그래서 be + p.p. 수동태.","by(~에 의해)가 결정적 단서다."]},{"t":"pair","h":"쉬운 예시","x":[["This house was built by my grandfather.","이 집은 할아버지가 지으셨다. (집은 지어지는 쪽)"],["The song is loved by many people.","그 노래는 많은 사람에게 사랑받는다. (노래는 사랑받는 쪽)"]]}],"post":["by(~에 의해) + 행위자 보이면 be + p.p.: is shaped by tradition(전통에 의해 형성되다)"]},{"slots":[["shaped","","","방식이 만들어지는 쪽이라 수동."],["demonstrates","","","주어 work(저서)가 단수라 -s."],["is2","being","a","how(~하는 방식) 뒤 문장의 주어 the week(주)에게 진짜 동사가 필요하다. being(~인 것)은 동사 자격이 없다."],["varies","","","선행사 a social invention(사회적 발명품)이 단수라 varies(서로 다르다)."],["their","","","people(사람들)을 받으니 their(그들의)."]],"opts":["be","to be","is","are"],"or":["be(~이다, 원형): 주어 뒤 동사 자리에 원형은 못 옴.","to be(~인 것): to부정사는 진짜 동사 노릇을 못 해 how 뒤 문장에 동사가 없어짐.","is(~이다): how(~하는 방식) 뒤 문장의 주어 the week(주)가 단수라 단수 동사가 맞음.","are(~이다, 복수형): 주어 the week(주)는 단수라 복수 동사는 안 맞음."],"point":"정동사 vs. 준동사","en":"Eviatar Zerubavel’s work demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures.","ko":"Eviatar Zerubavel의 저서는 시간의 기본 단위인 주(週)가 어떻게 문화마다 다른 사회적 발명품인지 보여 준다.","hl":["the week","is a social invention"],"khl":["주(週)가","사회적 발명품인지"],"blocks":[{"t":"p","h":"how(~하는 방식) 뒤에도 문장이 하나","x":["how(~하는 방식) 뒤에는 주어 + 동사가 갖춰진 문장이 온다.","주어: the week(주).","콤마 사이 a fundamental unit of time(시간의 기본 단위)은 the week(주)를 다시 설명하는 말이다.","이 말을 걷어내면 the week(주) ___ a social invention(사회적 발명품).","동사 자리가 비어 있으니 being(준동사)이 아니라 is(진짜 동사)."]},{"t":"pair","h":"쉬운 예시","x":[["I know how the game works.","나는 그 게임이 어떻게 돌아가는지 안다. (the game(그 게임) + works(돌아간다))"],["My dad, a doctor, is very busy.","의사인 우리 아빠는 아주 바쁘다. (a doctor(의사) 걷어내면 My dad is(우리 아빠는 ~이다))"]]}],"post":["콤마 사이 설명 걷어내고 동사 확인: the week(주) ... is(~이다)"]},{"slots":[["varies","","","a social invention(사회적 발명품)이 단수라 varies(서로 다르다)."],["influencing","","","콤마 뒤에서 결과를 덧붙이는 분사구문."],["their","them","a","activities(활동) 앞은 '~의'를 뜻하는 소유격 자리. 목적격 them(그들을)은 명사 앞에 못 온다."],["work","","","don’t(~하지 않다) 뒤 동사원형."],["is3","","","주어 the retirement age(은퇴 나이)가 단수라 is(~이다)."]],"opts":["their","they","theirs","themselves"],"or":["their(그들의): 명사 activities(활동) 앞 소유격 자리이고 people(사람들)을 받아 맞음.","they(그들은): 주격이라 명사 앞에서 '~의' 뜻을 못 냄.","theirs(그들의 것): 그 자체로 명사라 뒤에 activities(활동)가 또 올 수 없음.","themselves(그들 자신): 재귀대명사라 명사 앞 소유격 자리에 못 옴."],"point":"대명사의 성·수·격 일치","en":"influencing how people structure their activities and rhythms of life","ko":"사람들이 자신들의 활동과 생활 리듬을 짜는 방식에 영향을 준다","hl":["people","their"],"khl":["사람들이","자신들의"],"blocks":[{"t":"p","h":"명사 앞엔 '~의' 모양","x":["their(그들의) 바로 뒤에 명사 activities(활동)가 있다.","명사 앞에서 '누구의'를 나타내는 건 소유격이다.","활동을 짜는 건 people(사람들). s가 없어도 복수다.","복수의 소유격은 their(그들의).","them(그들을)은 목적격이라 명사 앞에 못 온다.","they(그들은), theirs(그들의 것)도 명사 앞 자리에 못 온다."]},{"t":"pair","h":"쉬운 예시","x":[["The children washed their hands.","아이들은 손을 씻었다. (명사 hands(손들) 앞 → their(그들의))"],["I met them at the park.","나는 공원에서 그들을 만났다. (동사 met(만났다) 뒤 목적어 → them(그들을))"]]}],"post":["명사 앞은 소유격: their activities(그들의 활동)"]}],"quiz":[{"s":"Ben and his sister ___ in the same class.","o":["is","are"],"a":1,"ko":"벤과 그의 여동생은 같은 반이다.","why":"Ben and his sister(벤과 그의 여동생)는 둘, 복수.","wy":"is(~이다): 단수 동사라 둘을 묶은 Ben and his sister(벤과 그의 여동생)와 안 맞음."},{"s":"I like ___ she smiles.","o":["what","how"],"a":1,"ko":"나는 그녀가 웃는 모습이 좋다.","why":"she smiles(그녀가 웃는다)는 빈자리 없는 문장이라 how.","wy":"what(~하는 것): 뒤 문장 she smiles(그녀가 웃는다)에 빈자리가 없어서 못 옴."},{"s":"The bridge was ___ in 1990.","o":["built","building"],"a":0,"ko":"그 다리는 1990년에 지어졌다.","why":"다리는 지어지는 쪽, be + p.p.","wy":"building(짓고 있는): 다리가 무언가를 짓는 능동이 되어 지어지는 다리와 안 맞음."},{"s":"My uncle, a pilot, ___ in Seoul.","o":["living","lives"],"a":1,"ko":"조종사인 우리 삼촌은 서울에 산다.","why":"a pilot(조종사) 걷어내면 My uncle(우리 삼촌) 뒤는 동사 자리.","wy":"living(사는): -ing는 혼자 동사 자리에 못 와서 My uncle(우리 삼촌) 뒤 동사가 없어짐."},{"s":"The students opened ___ books.","o":["them","their"],"a":1,"ko":"학생들은 자신들의 책을 펼쳤다.","why":"명사 books(책들) 앞은 소유격 their(그들의).","wy":"them(그들을): 목적격이라 명사 books(책들) 앞에 못 옴."}]},{"items":[{"slots":[["nor_are","","","nor(~도 아니다) 뒤 도치 어순."],["how1","","","뒤가 완전한 문장이라 how(~하는 방식)."],["understand","","","perceive(인식하다)와 and(그리고)로 나란한 동사."],["work","working","a","don’t(do not, ~하지 않다) 뒤에는 동사원형이 와야 한다. -ing는 혼자 동사 노릇을 못 한다."],["arent","","","주어 These numbers and patterns(이 숫자와 패턴)가 복수라 aren’t(~이 아니다)."]],"opts":["work","worked","to work","works"],"or":["work(일하다): 도우미 동사 don’t(do not, ~하지 않다) 뒤라 동사원형이 맞음.","worked(일했다, work의 과거형): 시제는 don’t(~하지 않다)가 이미 맡아서 뒤에는 원형만 옴.","to work(일하는 것): don’t(~하지 않다) 뒤에 to부정사는 못 옴.","works(일하다, 3인칭 단수형): don’t(~하지 않다) 뒤라 s를 붙일 수 없음."],"point":"정동사 vs. 준동사","en":"Why don’t many of us work on the weekends?","ko":"왜 우리 중 많은 사람이 주말에는 일하지 않을까?","hl":["don’t","work"],"khl":["일하지 않을까"],"blocks":[{"t":"p","h":"do(하다)는 동사원형을 데리고 다닌다","x":["의문문·부정문의 do(하다), does(하다), did(했다)는 도우미 동사다.","도우미 뒤의 진짜 동사는 항상 원형이다.","don’t(~하지 않다)와 work(일하다) 사이에 many of us(우리 중 많은 사람)가 끼어 있어도 규칙은 같다.","working(일하는 것, -ing형)은 혼자서는 동사 노릇을 못 한다.","worked(일했다), works(일하다)도 틀린다. 시제와 수는 don’t(~하지 않다)가 이미 맡았다."]},{"t":"pair","h":"쉬운 예시","x":[["I don’t eat carrots.","나는 당근을 먹지 않는다. (don’t(~하지 않는다) + eat(먹다))"],["Does she play the piano?","그녀는 피아노를 치니? (Does(의문문 만드는 조동사) + play(치다))"]]}],"post":["don’t(~하지 않다) 뒤는 동사원형: don’t many of us work(우리 중 많은 사람이 일하지 않다)"]},{"slots":[["ticking","","","시계가 스스로 째깍거리는 능동 -ing."],["nor_are","nor they are","a","부정어 nor(~도 아니다)가 앞에 나오면 뒤는 의문문 순서(동사 + 주어)가 된다."],["is1","","","주어 how(~하는 방식) ~ time(시간)은 덩어리 하나라 단수."],["shaped","","","방식은 만들어지는 쪽이라 is shaped(형성되다)."],["demonstrates","","","주어 work(저서)가 단수라 -s."]],"opts":["nor is they","nor are them","nor are they","nor they is"],"or":["nor is they(그것들도 ~이 아니다): 도치는 됐지만 주어 they(그것들)는 복수라 is(~이다, 단수형)와 수가 안 맞음.","nor are them(그것들을 ~도 아니다): 주어 자리에 목적격 them(그것들을)은 못 옴.","nor are they(그것들도 ~이 아니다): 부정어 nor(~도 아니다) 뒤 도치(동사 + 주어)이고 they(그것들)가 복수라 are(~이다)가 맞음.","nor they is(그것들도 ~이 아니다): 도치가 안 됐고 they(그것들)와 is(~이다, 단수형)의 수도 안 맞음."],"point":"도치","en":"nor are they simply psychological phenomena of individual experience","ko":"그것들은 그저 개인 경험의 심리적 현상인 것도 아니다","hl":["nor are they"],"khl":["현상인 것도 아니다"],"blocks":[{"t":"p","h":"부정어가 앞에 서면 순서가 뒤집힌다","x":["nor(~도 아니다)는 \"~도 아니다\"라는 부정의 말이다.","nor(~도 아니다), never(절대 ~않다), not only(~뿐만 아니라)처럼 부정어가 앞에 나오면 뒤가 의문문 순서가 된다.","보통 순서: they are(그것들은 ~이다)","nor(~도 아니다) 뒤 순서: nor are they(그것들도 ~이 아니다)","they are(그것들은 ~이다)를 그대로 두면 틀린다."]},{"t":"pair","h":"쉬운 예시","x":[["I don’t like milk, nor does my brother.","나는 우유를 안 좋아하고, 형도 안 좋아한다. (nor(~도 아니다) + does(대신 받는 동사) + 주어)"],["Never have I seen a cat this big.","나는 이렇게 큰 고양이를 본 적이 없다. (Never(결코 ~않다) + have(완료 조동사) + I)"]]},{"t":"tap","h":"확인 질문","q":"nor(~도 아니다) 뒤 동사가 is(~이다)가 아니라 are(~이다)인 이유는?","a":["they(그것들)가 앞의 perception and usage(인식과 사용), 복수를 받기 때문이다.","순서가 뒤집혀도 수일치는 그대로 지킨다."]}],"post":["nor(~도 아니다) + 동사 + 주어: nor are they(그것들도 ~이 아니다)"]},{"slots":[["how1","","","뒤가 완전한 문장이라 how(~하는 방식)."],["understand","understanding","a","and(그리고) 앞 perceive(인식하다)가 we(우리)의 현재형 동사다. 뒤도 같은 모양 understand(이해하다)."],["is1","","","주어 how(~하는 방식) ~ time(시간)은 덩어리 하나라 단수 is(~이다)."],["shaped","","","방식은 만들어지는 쪽, 수동."],["is2","","","the week(주)의 진짜 동사."]],"opts":["to understand","understand","understands","to understanding"],"or":["to understand(이해하는 것): 앞 perceive(인식하다)는 동사인데 뒤만 to부정사라 짝이 안 맞음.","understand(이해하다): and(그리고) 앞 we perceive(우리가 인식하다)와 같은 현재형 동사라 맞음.","understands(이해하다, 3인칭 단수형): 주어 we(우리)는 복수라 s를 붙이면 안 됨.","to understanding(이해하는 것으로): 전치사 to가 끼어 동사 perceive(인식하다)와 짝을 이룰 수 없음."],"point":"병렬구조","en":"Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.","ko":"오히려 우리가 시간을 인식하고 이해하는 방식은 상당 부분 전통과 문화적 규범에 의해 형성된다.","hl":["perceive","understand"],"khl":["인식하고","이해하는"],"blocks":[{"t":"p","h":"and(그리고) 양쪽 키 맞추기","x":["and(그리고)는 같은 모양끼리만 잇는다.","앞: we perceive (우리가 인식한다)","뒤: (we) understand (이해한다)","perceive(인식하다)가 we(우리)의 현재형 동사니 understand(이해하다)도 같은 모양.","understanding(이해하는 것)을 넣으면 한쪽만 -ing 옷을 입어 짝이 안 맞는다."]},{"t":"pair","h":"쉬운 예시","x":[["We sing and dance every Friday.","우리는 금요일마다 노래하고 춤춘다. (sing and dance = 노래하고 춤춘다)"],["He cleaned and painted the room.","그는 방을 청소하고 칠했다. (cleaned and painted = 청소하고 칠했다)"]]}],"post":["and(그리고) 앞뒤 같은 모양: perceive and understand(인식하고 이해하다)"]},{"slots":[["is1","","","주어 how(~하는 방식) ~ time(시간)은 덩어리 하나라 단수."],["shaped","","","방식은 만들어지는 쪽."],["demonstrates","demonstrate","a","주어는 work(저서) 한 권. 콤마 사이 긴 말은 책 제목일 뿐이다."],["is2","","","the week(주)의 진짜 동사."],["that1","","","a social invention(사회적 발명품)을 꾸미는 주격 관계대명사."]],"opts":["demonstrating","to demonstrate","demonstrates","have demonstrated"],"or":["demonstrating(보여 주는): -ing는 혼자 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","to demonstrate(보여 주는 것): to부정사도 동사 자리에 못 와서 문장에 진짜 동사가 없어짐.","demonstrates(보여 주다, 3인칭 단수형): 주어 work(저서) 한 권이 단수라 s 붙은 현재형이 맞음.","have demonstrated(보여 주었다, 현재완료형): 동사 자리는 되지만 주어 work(저서)가 단수라 has(have의 3인칭 단수형)가 필요함."],"point":"수식받는 주어의 수일치","en":"Eviatar Zerubavel’s work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention.","ko":"Eviatar Zerubavel의 저서 『7일의 순환: 주(週)의 역사와 의미』는 시간의 기본 단위인 주가 어떻게 사회적 발명품인지 보여 준다.","hl":["work","demonstrates"],"khl":["저서","보여 준다"],"blocks":[{"t":"p","h":"긴 제목은 이름표일 뿐","x":["주어는 Zerubavel’s work(Zerubavel의 저서).","콤마 사이 긴 말은 그 책의 제목이다.","제목 안의 the History(역사), the Week(주)가 눈을 어지럽힌다.","제목을 걷어내면 work demonstrates(저서가 보여 주다).","책 한 권, 단수라 -s가 붙는다."]},{"t":"pair","h":"쉬운 예시","x":[["My best friend, Mina, lives next door.","내 가장 친한 친구 미나는 옆집에 산다. (friend(친구) → lives(산다))"],["The book about cats is fun.","고양이에 관한 그 책은 재미있다. (book(책) → is(~이다))"]]}],"post":["콤마 사이 제목 걷어내기: work demonstrates(저서가 보여 주다)"]},{"slots":[["is2","","","the week(주)의 진짜 동사."],["that1","","","a social invention(사회적 발명품)을 꾸미는 주격 관계대명사."],["varies","","","a social invention(사회적 발명품)이 단수라 varies(서로 다르다)."],["influencing","influences","a","진짜 동사(is, varies(서로 다르다))가 이미 있고 콤마 뒤에 and(그리고)가 없다. 덧붙이는 말은 -ing."],["their","","","people(사람들)을 받으니 their(그들의)."]],"opts":["influence","have influenced","to influencing","influencing"],"or":["influence(영향을 주다): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐.","have influenced(영향을 주어 왔다): 현재완료도 진짜 동사라 접속사 없이 붙일 수 없음.","to influencing(영향을 주는 것으로): 전치사 to + -ing가 되어 앞 문장과 이어지지 않음.","influencing(영향을 주면서): 진짜 동사 is(~이다), varies(서로 다르다)가 있고 콤마 뒤에 접속사가 없어 분사구문이 맞음."],"point":"정동사 vs. 준동사","en":"is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life","ko":"문화마다 다른 사회적 발명품이며, 사람들이 활동과 생활 리듬을 짜는 방식에 영향을 준다","hl":["varies","influencing"],"khl":["다른","영향을 준다"],"blocks":[{"t":"p","h":"접속사 없는 콤마 뒤","x":["두 동사를 이으려면 and(그리고) 같은 접속사가 필요하다.","이 문장에는 is(~이다), varies(서로 다르다)라는 진짜 동사가 이미 있다.","콤마 뒤에 and(그리고)가 없다.","그러니 influences(진짜 동사)는 못 온다.","동사 옷을 벗긴 influencing(그래서 ~에 영향을 주면서)으로 덧붙인다."]},{"t":"pair","h":"쉬운 예시","x":[["The bus broke down, making us late.","버스가 고장 나서 우리는 늦었다. (making = 덧붙임)"],["He fell asleep, leaving the TV on.","그는 TV를 켜 둔 채 잠들었다. (leaving = 덧붙임)"]]}],"post":["접속사 없는 콤마 뒤 동사는 -ing: ..., influencing(영향을 주면서)"]}],"quiz":[{"s":"Why don’t you ___ with us?","o":["coming","come"],"a":1,"ko":"우리랑 같이 가지 않을래?","why":"don’t(~하지 않다) 뒤는 동사원형.","wy":"coming(오는 것): don’t(do not, ~하지 않다) 뒤에는 동사원형만 옴."},{"s":"He can’t swim, nor ___.","o":["can I","I can"],"a":0,"ko":"그는 수영을 못 하고, 나도 못 한다.","why":"nor(~도 아니다) + 동사 + 주어.","wy":"I can(나는 할 수 있다): nor(~도 아니다) 뒤인데 도치가 안 돼서 틀림."},{"s":"We clean the room and ___ the dishes.","o":["washing","wash"],"a":1,"ko":"우리는 방을 청소하고 설거지를 한다.","why":"clean(청소하다) and wash(씻다), 같은 모양.","wy":"washing(씻는 것): and(그리고) 앞 clean(청소하다)과 모양이 달라 짝이 안 맞음."},{"s":"The movie, Star Wars, ___ very popular.","o":["is","are"],"a":0,"ko":"영화 스타워즈는 매우 인기가 있다.","why":"주어는 The movie(그 영화) 한 편, 단수.","wy":"are(~이다, 복수형): 주어는 The movie(그 영화) 한 편이고 Star Wars(스타워즈)는 제목일 뿐이라 단수 동사가 필요함."},{"s":"It rained all day, ___ the road wet.","o":["making","made"],"a":0,"ko":"하루 종일 비가 와서 길이 젖었다.","why":"접속사 없는 콤마 뒤 덧붙임은 -ing.","wy":"made(만들었다, make의 과거형): 접속사 없이 동사 rained(비가 왔다) 뒤에 동사가 또 올 수 없음."}]}],"comp":[{"no":"22","slots":[["is3","","","주어 the retirement age(은퇴 나이)가 단수라 is(~이다)."],["arent","","","주어 These numbers and patterns(이 숫자와 패턴)가 복수라 aren’t(are not, ~이 아니다)."],["dictated","dictating","a","숫자와 패턴은 자연에 의해 '정해지는' 쪽이다. by nature(자연에 의해)가 단서이고 dictate(정하다)의 목적어도 없다."],["that2","","","social creations(사회적 창조물)를 꾸미는 목적격 관계대명사."],["come","","","internalize(내면화하다)와 and(그리고)로 나란한 동사원형."]],"opts":["dictate","dictates","dictated","have dictated"],"or":["dictate(정하다): be동사 aren’t(~이 아니다) 뒤에 동사원형이 올 수 없음.","dictates(정하다, 3인칭 단수형): aren’t(~이 아니다)와 동사가 겹치고 복수 주어와 수도 안 맞음.","dictated(정해진, dictate의 과거분사): 숫자와 패턴은 정해지는 쪽이고 by nature(자연에 의해)가 있어 aren’t dictated(정해지지 않는다)가 맞음.","have dictated(정해 왔다): aren’t(~이 아니다) 뒤에 또 동사를 붙일 수 없고, 정하는 쪽이 되어 뜻도 반대임."],"point":"능동태 vs. 수동태","en":"These numbers and patterns aren’t really dictated by nature or any essential human characteristic.","ko":"이러한 숫자와 패턴은 사실 자연이나 어떤 본질적인 인간 특성에 의해 정해진 것이 아니다.","hl":["aren’t really dictated","by nature"],"khl":["자연이나 어떤 본질적인 인간 특성에 의해","정해진 것이 아니다"],"blocks":[{"t":"p","h":"정하는 쪽, 정해지는 쪽","x":["dictate는 \"정하다, 지시하다\".","자연이 정하고, 숫자와 패턴은 정해진다.","숫자와 패턴은 정해지는 쪽이다.","그래서 aren’t(~이 아니다) + dictated(p.p.).","dictating(정하는)을 쓰면 숫자가 무언가를 정한다는 말이 되는데, 정할 대상(목적어)도 없다."]},{"t":"pair","h":"쉬운 예시","x":[["English is spoken in many countries.","영어는 많은 나라에서 쓰인다. (영어는 쓰이는 쪽)"],["The cake was eaten by my brother.","케이크는 남동생이 먹었다. (케이크는 먹히는 쪽)"]]}],"post":["정해지는 쪽은 be + p.p.: aren’t dictated by nature(자연에 의해 정해지지 않는다)"]},{"no":"22","slots":[["work","","","don’t(~하지 않다) 뒤 동사원형."],["is3","","","주어 the retirement age(은퇴 나이)가 단수라 is(~이다)."],["arent","","","These numbers and patterns(이 숫자와 패턴)가 복수라 aren’t(~이 아니다)."],["that2","what","a","앞에 social creations(사회적 창조물)라는 명사가 있다. 명사를 뒤에서 꾸밀 땐 what(~하는 것)이 아니라 that(~하는)."],["come","","","internalize(내면화하다)와 and(그리고)로 나란한 동사원형."]],"opts":["whose","where","that","when"],"or":["whose(그것의, 소유격 관계대명사): 바로 뒤에 명사가 와야 하는데 we(우리)가 와서 안 됨.","where(~하는 곳, 관계부사): 뒤 문장이 완전해야 하는데 internalize(내면화하다)의 목적어가 빠져 있음.","that(~하는, 관계대명사): 명사 social creations(사회적 창조물) 뒤에서 internalize(내면화하다)의 빠진 목적어를 대신해 맞음.","when(~하는 때, 관계부사): creations(창조물)는 시간 명사가 아니고, 뒤에 목적어도 빠져 있음."],"point":"that vs. what","en":"but are rather social creations that we internalize and come to accept as “normal.”","ko":"오히려 우리가 내면화하여 '정상'으로 받아들이게 된 사회적 창조물이다.","hl":["social creations that","internalize"],"khl":["사회적 창조물","내면화하여"],"blocks":[{"t":"p","h":"앞에 명사가 있나?","x":["what(~하는 것)은 \"~하는 것\". 이미 명사(것)를 품고 있다.","그래서 what(~하는 것) 앞에는 꾸밀 명사가 오지 않는다.","이 문장엔 social creations(사회적 창조물)라는 명사가 앞에 있다.","명사를 뒤에서 꾸미는 건 that(또는 which).","internalize(내면화하다)의 목적어 자리가 비어 있고, that(~하는)이 그 자리를 대신한다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the bag that I bought.","이것은 내가 산 가방이다. (명사 bag + that)"],["This is what I bought.","이것이 내가 산 것이다. (명사 없이 what)"]]}],"post":["명사(creations) 뒤는 that(~하는), 명사 없으면 what(~하는 것)"]}],"compquiz":[{"s":"The window was ___ by the ball.","o":["breaking","broken"],"a":1,"ko":"창문이 공에 맞아 깨졌다.","why":"창문은 깨지는 쪽, by(~에 의해)가 단서.","wy":"breaking(깨뜨리는): 창문이 무언가를 깨는 능동이 되어 by the ball(공에 의해)과 안 맞음."},{"s":"This is the cake ___ my mom made.","o":["what","that"],"a":1,"ko":"이것은 엄마가 만든 케이크다.","why":"명사 cake(케이크) 뒤에는 that.","wy":"what(~하는 것): 앞에 명사 the cake(케이크)가 있어 what은 못 옴."}]},{"id":"2610g1-23","no":"23","title":"어법특훈 · 26년 10월 고1 23번","sub":"내부 고발자 보호의 필요성","tpl":"In recent years, the number of illegal actions in particular at the corporate level {has1|has} grown, or at least the number of cases {that0|that} came to light {increased|increased}. Such misconduct has often only been {exposed|exposed} because brave informants have {risked|risked} a great deal in order {to_put|to put} an end to it. Hence, it is no surprise {that1|that} whistleblower protection has come into focus. If violations of law and order {go|go} {undetected|undetected} and unpunished for years because employees of a company fear to report illegal activities for fear of reprisals or consequences, it can have several negative effects. It can harm the company {itself|itself}, but also third-parties, the economy in general, the general public, and even the rule of law could be {affected|affected}. {protecting1|Protecting} those {who|who} would assist in {reducing|reducing} unlawful or even {criminal|criminal} behaviour {has2|has} two main functions: Protecting the individual’s actions as well as {protecting2|protecting} the public good. A well-balanced whistleblower protection may have {positive|positive} effects on both of these.","fn":["*whistleblower: 내부 고발자","*reprisal: 보복"],"sets":[{"items":[{"slots":[["has1","have","a","주어는 the number(수) 하나다. of illegal actions(불법 행위의)는 꼬리표."],["that0","","","cases(사례)를 꾸미는 주격 관계대명사."],["increased","","","the number of cases(사례의 수)의 진짜 동사(과거형)."],["exposed","","","부정행위는 '드러나는' 쪽이라 been exposed(드러난, 수동)."],["risked","","","have(완료 조동사) + p.p. 현재완료."]],"opts":["are","having","has","to have"],"point":"수식받는 주어의 수일치","en":"In recent years, the number of illegal actions in particular at the corporate level has grown.","ko":"최근 몇 년 동안 특히 기업 차원에서 불법 행위의 수가 늘었다.","hl":["the number","has grown"],"khl":["불법 행위의 수가","늘었다"],"blocks":[{"t":"p","h":"the number vs. a number","x":["the number of(~의 수) + 명사: 주인은 number(수) 하나.","a number of(많은) + 명사: 주인은 뒤의 복수 명사.","이 문장은 the number of illegal actions(불법 행위의 수).","actions(행동들)가 복수처럼 보여도 진짜 주인은 the number(수).","그래서 have(현재완료 조동사, 복수 주어용)가 아니라 has(have의 3인칭 단수형)."]},{"t":"pair","h":"쉬운 예시","x":[["The number of students is 30.","학생 수는 30명이다. (the number(~의 수) → is(~이다))"],["A number of students are absent.","많은 학생이 결석했다. (a number of(많은) → are(~이다))"]]},{"t":"tap","h":"확인 질문","q":"뒤 문장 the number of cases that came to light increased(드러난 사례의 수가 늘었다)에서 무엇이 늘었나?","a":["the number(수)가 늘었다.","cases(사례들)가 아니라 수가 주인이다."]}],"post":["the number of(~의 수) + 복수명사 → 단수 동사: the number(수) ... has grown(늘었다)"],"or":["are(~이다, 복수형): 주어가 단수인데 복수 동사이고, 뒤 grown(자란)과 붙으면 '길러졌다'는 엉뚱한 수동이 됨.","having(가지고 있는): 주어 the number(수) 뒤에 동사가 와야 하는데 -ing는 동사 자리에 못 옴.","has(have의 3인칭 단수형): 주어 the number(수)가 하나라 단수형으로 현재완료 has grown(늘었다)을 만들어 맞음.","to have(가지는 것): to부정사는 동사 자리에 올 수 없어 문장에 동사가 없어짐."]},{"slots":[["increased","","","the number of cases(사례의 수)의 진짜 동사."],["exposed","exposing","a","misconduct(부정행위)는 제보자에 의해 '드러나는' 쪽이다. expose(드러내다) 뒤에 목적어도 없다."],["risked","","","have risked(걸어 왔다) 현재완료."],["to_put","","","in order to(~하기 위해) + 동사원형."],["that1","","","가짜 주어 it(그것)의 진짜 내용을 이끄는 that(~라는 것)."]],"opts":["expose","exposed","exposes","to expose"],"point":"능동태 vs. 수동태","en":"Such misconduct has often only been exposed because brave informants have risked a great deal in order to put an end to it.","ko":"이런 부정행위는 용감한 제보자들이 그것을 끝내기 위해 많은 것을 걸었기 때문에 비로소 드러난 경우가 많다.","hl":["Such misconduct","been exposed"],"khl":["이런 부정행위는","드러난"],"blocks":[{"t":"p","h":"목적어가 있나 확인","x":["expose(드러내다)는 \"~을 드러내다\"라는 뜻이라 뒤에 드러낼 대상이 와야 한다.","been exposing(드러내 오고 있는)이면 부정행위가 무언가를 드러내고 있다는 뜻이 된다.","그런데 뒤에 드러낼 대상(목적어)이 없다.","부정행위는 제보자에 의해 드러나는 쪽이다.","has been(~되어 왔다) + p.p. = 드러나 왔다."]},{"t":"pair","h":"쉬운 예시","x":[["The secret was finally revealed.","그 비밀이 마침내 밝혀졌다. (비밀은 밝혀지는 쪽)"],["My bike has been stolen.","내 자전거를 도둑맞았다. (자전거는 훔쳐지는 쪽)"]]}],"post":["목적어 없고 당하는 쪽이면 been + p.p.: has been exposed(드러나 왔다)"],"or":["expose(드러내다, 동사원형): been(be동사 p.p.) 뒤에는 동사원형이 올 수 없음.","exposed(드러난, 과거분사): 부정행위는 제보자에 의해 드러나는 쪽이라 been(be동사 p.p.) 뒤 p.p.로 수동태가 맞음.","exposes(드러내다, 3인칭 단수형): been(be동사 p.p.) 뒤에 현재형 동사가 또 올 수 없음.","to expose(드러내는 것): been(be동사 p.p.) 뒤 to부정사로는 '드러나다'는 수동의 뜻이 만들어지지 않음."]},{"slots":[["to_put","","","in order to(~하기 위해) + 동사원형."],["that1","what","a","가짜 주어 it(그것)의 진짜 내용이다. 뒤 문장 protection has come into focus(보호가 주목받게 되었다)가 완전해서 what(~하는 것)은 못 온다."],["go","","","주어 violations(위반들)가 복수라 go(~한 상태가 되다)."],["undetected","","","go(~한 상태가 되다) + p.p.: \"발견되지 않은 채로 있다\"."],["itself","","","the company(회사)를 강조하는 \"회사 그 자체\"."]],"opts":["that","which","whom","whose"],"point":"that vs. what","en":"Hence, it is no surprise that whistleblower protection has come into focus.","ko":"그러므로 내부 고발자 보호가 주목받게 된 것은 놀라운 일이 아니다.","hl":["it is no surprise that","whistleblower protection has come into focus"],"khl":["내부 고발자 보호가 주목받게 된 것은","놀라운 일이 아니다"],"blocks":[{"t":"p","h":"가짜 주어 it 찾기","x":["it is no surprise(놀랍지 않다)에서 it(그것)은 가짜 주어다.","진짜 주어는 뒤의 that절.","that(~라는 것) 뒤 문장: whistleblower protection has come into focus(내부 고발자 보호가 주목받게 되었다).","주어 protection(보호), 동사 has come(~하게 되었다)이 다 있는 완전한 문장이다.","빈자리가 없으니 what(~하는 것)이 아니라 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["It is true that he is kind.","그가 친절하다는 것은 사실이다. (It = that절)"],["It is strange that she left early.","그녀가 일찍 떠난 것은 이상하다. (It = that절)"]]}],"post":["It is ~ that(가짜 주어 it, 진짜 주어는 that 뒤 문장) + 완전한 문장 (what X)"],"or":["that(~라는 것): 가짜 주어 it(그것)의 진짜 내용을 이끌고, 뒤 문장이 빠진 곳 없이 완전해서 맞음.","which(어느 것, 관계대명사): 앞에 꾸밀 명사가 없고 뒤 문장에도 빠진 자리가 없어 못 옴.","whom(~하는 사람을): 받을 사람 명사도 없고 뒤에 빠진 목적어도 없어 못 옴.","whose(그 ~의): 앞에 받을 명사가 없어 가짜 주어 it(그것)의 내용을 이끌 수 없음."]},{"slots":[["itself","","","the company(회사)를 강조하는 재귀대명사."],["affected","","","the rule of law(법치)는 영향을 '받는' 쪽이라 be affected(영향을 받다)."],["protecting1","Protect","a","문장의 주어 자리다. 진짜 동사는 뒤의 has(가지다, 3인칭 단수형). 동사원형 Protect(보호하다)는 주어가 될 수 없다."],["who","","","사람 those(~하는 사람들)를 받고 뒤에 주어가 빠진 주격 관계대명사."],["reducing","","","전치사 in(~하는 데) 뒤라 동명사."]],"opts":["Protects","Protecting","Protected","Protection"],"point":"정동사 vs. 준동사","en":"Protecting those who would assist in reducing unlawful or even criminal behaviour has two main functions.","ko":"불법적이거나 심지어 범죄적인 행위를 줄이는 데 도움을 줄 사람들을 보호하는 것에는 두 가지 주요 기능이 있다.","hl":["Protecting","has two main functions"],"khl":["보호하는 것에는","있다"],"blocks":[{"t":"p","h":"문장의 진짜 동사는 하나","x":["이 문장의 진짜 동사는 has(가지고 있다)다.","has(가지다, 3인칭 단수형) 앞 전체가 주어 덩어리다.","주어 자리에 Protect(보호하다)를 두면 \"보호하라\"는 명령문처럼 되어 동사가 둘이 된다.","동사에 -ing를 붙이면 \"~하는 것\"이라는 명사가 되어 주어가 될 수 있다.","그래서 Protecting(보호하는 것)이 맞다."]},{"t":"pair","h":"쉬운 예시","x":[["Swimming is good exercise.","수영하는 것은 좋은 운동이다. (Swimming = 주어)"],["Reading books makes me happy.","책 읽는 것은 나를 행복하게 한다. (Reading = 주어)"]]}],"post":["주어 자리 동사는 -ing: Protecting(보호하는 것) ... has(가지다, 3인칭 단수형)"],"or":["Protects(보호하다, 3인칭 단수형): 동사라 주어 자리에 못 오고, 뒤 has(가지다)와 동사가 둘이 됨.","Protecting(보호하는 것, 동명사): 주어가 될 수 있고 뒤에 목적어 those(사람들)도 받을 수 있어 맞음.","Protected(보호받은, 과거분사): 동사 모양이라 주어 자리에 올 수 없음.","Protection(보호, 명사): 주어는 될 수 있지만 명사라 뒤의 목적어 those(사람들)를 바로 받을 수 없음."]},{"slots":[["who","","","those(사람들)를 받는 주격 관계대명사."],["reducing","","","전치사 in(~하는 데) 뒤 동명사."],["criminal","criminally","a","명사 behaviour(행위)를 꾸미는 자리다. 부사는 명사를 꾸밀 수 없다."],["has2","","","주어 Protecting(보호하는 것) ~ 덩어리는 단수라 has(가지다, 3인칭 단수형)."],["protecting2","","","as well as(~뿐 아니라) 앞의 Protecting(보호하는 것)과 같은 -ing."]],"opts":["criminal","criminals","crimes","criminalize"],"point":"형용사 자리 vs. 부사 자리","en":"those who would assist in reducing unlawful or even criminal behaviour","ko":"불법적이거나 심지어 범죄적인 행위를 줄이는 데 도움을 줄 사람들","hl":["unlawful","criminal behaviour"],"khl":["불법적이거나","범죄적인 행위"],"blocks":[{"t":"p","h":"화살표 긋기","x":["criminal(범죄의) → behaviour(행위). 화살표가 명사로 간다.","명사를 꾸미는 건 형용사의 일이다.","부사 criminally(범죄적으로)는 동사나 형용사를 꾸민다.","or(또는) 앞 unlawful(불법적인)도 형용사라 짝도 맞는다.","even(심지어)은 사이에 낀 부사일 뿐이다."]},{"t":"pair","h":"쉬운 예시","x":[["She is a careful driver.","그녀는 조심성 있는 운전자다. (명사 driver(운전자) ← 형용사)"],["She drives carefully.","그녀는 조심스럽게 운전한다. (동사 drives(운전한다) ← 부사)"]]}],"post":["명사 꾸미면 형용사: unlawful or even criminal behaviour(불법적이거나 심지어 범죄적인 행위)"],"or":["criminal(범죄의, 형용사): 명사 behaviour(행위)를 꾸미고 앞의 형용사 unlawful(불법적인)과 짝도 맞음.","criminals(범죄자들, 명사): 형용사 unlawful(불법적인)과 짝이 범죄들(명사 crime의 복수형)","criminalize":"범죄로 규정하다(동사)","positive":"긍정적인(형용사)","eaten":"먹힌(eat의 과거분사)","eating":"먹고 있는(eat의 -ing형)","Eat":"먹다(동사원형)","Eating":"먹는 것(eat의 -ing형, 동명사 주어)","quiet":"조용한(형용사)","quietly":"조용히(부사)","to pass":"합격하는 것, 합격하기 위해(to부정사)","passing":"합격하는 것(pass의 -ing형)","make":"만들다(동사원형)","making":"만드는 것(make의 -ing형)","swim":"수영하다(동사원형)","swimming":"수영하는 것(swim의 -ing형)"}},{"id":"2610g1-24","no":"24","title":"어법특훈 · 26년 10월 고1 24번","sub":"목표에 대한 환상의 함정","tpl":"Unfortunately, sometimes the idea of a goal {is|is} disconnected from the daily reality of {what|what} it will take to achieve it. We fall in love with the idea of a goal, {pushing|pushing} out of mind how {different|different} our day-to-day will need to be for us to make it {happen|happen}. In fact, research even {suggests|suggests} that positive fantasies about our future can lead us {to_put|to put} less effort into our goals because our fantasies {provide|provide} us with a false and premature sense of accomplishment. We romanticize a goal — {falling|falling} in love with the idea of a change. In the process, we gloss over the intricacies and challenges of {integrating|integrating} a complex new behavior into our life. As one study {nicely|nicely} summed it up, {fantasizing|fantasizing} about a positive future “{seduces|seduces} a person to {mentally|mentally} enjoy the {desired|desired} future in the here and now” — and because we don’t reflect on {why|why} our fantasy is not yet our future, “a necessity to act is not {induced|induced}.”","fn":["*premature: 너무 이른, 시기상조의","*gloss over: 대충 얼버무리고 넘어가다","*intricacy: 복잡한 사정","*seduce: 꾀다, 유혹하다","*induce: 일으키다, 유발하다"],"sets":[{"items":[{"slots":[["is","are","a","주어는 the idea(생각), 하나다. of a goal(목표라는)은 꾸며 주는 꼬리표라 is(~이다, 3인칭 단수형)가 맞다."],["what","","","of(~의) 뒤에서 \"~하는 것\"이라는 명사 덩어리를 만든다. take(필요로 하다)의 목적어가 빠져 있다."],["pushing","","","동사 fall(빠지다)은 이미 있다. 콤마 뒤에서 \"~하면서\"라고 덧붙이는 분사구문이다."],["suggests","","","주어 research(연구)는 셀 수 없는 명사라 단수 취급, suggests(보여 주다, 3인칭 단수형)가 맞다."],["provide","","","주어 our fantasies(우리의 환상들)가 복수라 provide(주다)가 맞다."]],"opts":["be","being","been","is"],"point":"수식받는 주어의 수일치","en":"Unfortunately, sometimes the idea of a goal is disconnected from the daily reality of what it will take to achieve it.","ko":"안타깝게도, 때때로 목표라는 생각은 그것을 이루는 데 필요한 일상의 현실과 동떨어져 있다.","hl":["the idea of a goal","is"],"khl":["목표라는 생각은","동떨어져 있다"],"blocks":[{"t":"p","h":"주인 찾기","x":["동사 앞 단어가 주인(주어)이라는 보장은 없다.","바로 앞 단어는 goal(목표)이지만 of a goal(목표라는)은 꼬리표다.","꼬리표를 떼면 the idea is(그 생각은 ~이다).","주인 the idea(그 생각)가 하나라서 is(~이다, 3인칭 단수형).","goal(목표)이 단수라서 is(~이다, 3인칭 단수형)인 것처럼 보여도, 근거는 idea(생각)다."]},{"t":"pair","h":"쉬운 예시","x":[["The color of the flowers is red.","그 꽃들의 색깔은 빨간색이다. (주인 The color(색깔) → is(~이다))"],["The keys to the car are on the desk.","그 차의 열쇠들은 책상 위에 있다. (주인 The keys(열쇠들) → are(있다))"]]}],"post":["꼬리표(of a goal = 목표의) 떼고 주인(the idea = 생각) 보고 is(~이다, 3인칭 단수형)"],"or":["be(~이다, 동사원형): 조동사 없이 동사원형이 동사 자리에 올 수 없음.","being(~인 것): -ing는 동사 자리에 못 와 문장에 진짜 동사가 없어짐.","been(be동사 p.p.): 조동사 없이 p.p. 혼자서는 동사가 될 수 없음.","is(~이다, 3인칭 단수형): 주인 the idea(생각)가 하나라 단수 be동사가 맞음."]},{"slots":[["is","","","주어 the idea(그 생각)가 단수라 is(~이다, 3인칭 단수형)."],["what","that","a","of(~의) 뒤에 명사 덩어리가 와야 하고, take(필요로 하다)의 목적어가 빠져 있다. 빠진 걸 채우는 건 what(~하는 것)."],["different","","","how(얼마나) 뒤에서 be의 보어 자리. 형용사 different(다른)가 맞다."],["happen","","","make(~하게 만들다) + 목적어 + 동사원형. make it happen(그것을 실현하다)."],["falling","","","목표를 낭만적으로 그리면서 \"사랑에 빠지면서\"라고 덧붙이는 분사구문이다."]],"opts":["whom","whose","they","what"],"point":"that vs. what","en":"Unfortunately, sometimes the idea of a goal is disconnected from the daily reality of what it will take to achieve it.","ko":"안타깝게도, 때때로 목표라는 생각은 그것을 이루는 데 필요한 일상의 현실과 동떨어져 있다.","hl":["of what it will take","the daily reality"],"khl":["필요한","일상의 현실"],"blocks":[{"t":"p","h":"빈자리 찾기","x":["it will take ___ to achieve it(그것을 이루는 데 ___이 들다).","\"그것을 이루는 데 ___이 들 것이다.\"","take(필요로 하다)의 목적어 자리가 비어 있다.","빈자리가 있는 문장 앞에서, 앞에 명사도 없다면 what(~하는 것).","what = the thing which(~하는 것).","that(~라는 것)은 빈자리를 채워 주지 못한다."]},{"t":"pair","h":"쉬운 예시","x":[["I know what you want.","나는 네가 원하는 것을 안다. (want의 목적어가 빔 → what)"],["I know that you are tired.","나는 네가 피곤하다는 것을 안다. (빠진 것 없음 → that)"]]},{"t":"tap","h":"확인 질문","q":"what(~하는 것) 뒤 문장 it will take to achieve it(그것을 이루는 데 ___이 필요할 것이다)에서 빠진 것은?","a":["take(필요로 하다)의 목적어(무엇이 필요한지).","그 빈자리를 채우며 of(~의)의 목적어 덩어리를 만드는 게 what(~하는 것)."]}],"post":["전치사(of = ~의) + what + 빈자리 있는 문장(take(필요로 하다) ___)"],"or":["whom(~하는 사람을): 앞에 받을 사람 명사가 없고, 필요한 '것'을 말하는 자리라 못 옴.","whose(그 ~의): 소유격이라 뒤에 명사가 와야 하는데 바로 it(그것)이 옴.","they(그들은): 대명사라 문장을 이어 줄 수 없고, 전치사 뒤에 '그들은 + 문장'이 올 수 없음.","what(~하는 것): 전치사 뒤 명사 덩어리를 만들고 take(필요로 하다)의 빠진 목적어를 채워 맞음."]},{"slots":[["what","","","of(~의) 뒤 명사 덩어리. take(필요로 하다)의 목적어가 빠져 있어 what(~하는 것)."],["pushing","push","a","동사 fall(빠지다)이 이미 있고 접속사가 없다. 동사를 하나 더 쓸 수 없으니 -ing로 덧붙인다."],["to_put","","","lead(이끌다) + 사람 + to부정사. \"~가 …하게 이끌다\"."],["falling","","","대시(—) 뒤에서 \"~하면서\"라고 덧붙이는 분사구문이다."],["nicely","","","동사 summed up(요약했다)을 꾸미는 부사다."]],"opts":["pushes","pushed","pushing","has pushed"],"point":"정동사 vs. 준동사","en":"We fall in love with the idea of a goal, pushing out of mind how different our day-to-day will need to be for us to make it happen.","ko":"우리는 목표라는 생각에 푹 빠져서, 그것을 이루려면 우리의 일상이 얼마나 달라져야 하는지를 마음 밖으로 밀어낸다.","hl":["We fall in love","pushing out of mind"],"khl":["푹 빠져서","마음 밖으로 밀어낸다"],"blocks":[{"t":"p","h":"기차 칸 세기","x":["접속사 없는 문장 하나는 기관차(진짜 동사)를 하나만 단다.","기관차: fall(빠지다).","콤마 뒤에 push(밀어내다)를 또 달면 기관차가 둘이 된다.","그래서 동사 옷을 벗긴 pushing(밀어내면서)으로 붙인다.","pushing(밀어내면서)의 목적어는 how(얼마나) 이하 덩어리다."]},{"t":"pair","h":"쉬운 예시","x":[["He ran to school, holding his bag.","그는 가방을 든 채 학교로 달려갔다. (ran(달려갔다) + holding(든 채))"],["She sat by the window, reading a book.","그녀는 책을 읽으며 창가에 앉아 있었다."]]}],"post":["동사(fall = 빠지다) 있고 접속사 없으면 덧붙임은 -ing: , pushing(밀어내면서)"],"or":["pushes(밀어내다, 3인칭 단수형): 접속사 없이 동사가 하나 더 붙고, 주어 We(우리)와 수도 안 맞음.","pushed(밀어냈다/밀린): 과거 동사로 보면 접속사 없이 동사가 둘이고, p.p.로 보면 우리가 밀려나는 쪽이 되어 뜻이 깨짐.","pushing(밀어내면서): 동사 fall(빠지다)이 이미 있고 접속사가 없어 -ing 분사구문이 맞음.","has pushed(밀어내 왔다): 접속사 없이 동사가 둘이 되고 주어 We(우리)와 수도 안 맞음."]},{"slots":[["pushing","","","콤마 뒤 덧붙인 분사구문."],["different","differently","a","how(얼마나) 뒤 덩어리를 원래 순서로 돌리면 our day-to-day will need to be different(우리의 일상은 달라야 할 것이다). be 뒤는 형용사 자리."],["suggests","","","research(연구)는 단수 취급이라 suggests(보여 주다, 3인칭 단수형)."],["integrating","","","전치사 of(~의) 뒤라서 동명사(-ing)."],["mentally","","","동사 enjoy(즐기다)를 꾸미는 부사다."]],"opts":["different","difference","differ","differs"],"point":"형용사 자리 vs. 부사 자리","en":"We fall in love with the idea of a goal, pushing out of mind how different our day-to-day will need to be for us to make it happen.","ko":"우리는 목표라는 생각에 푹 빠져서, 그것을 이루려면 우리의 일상이 얼마나 달라져야 하는지를 마음 밖으로 밀어낸다.","hl":["how different","will need to be"],"khl":["얼마나 달라져야","하는지"],"blocks":[{"t":"p","h":"how가 끌고 간 단어 제자리로","x":["how(얼마나)는 뒤의 단어 하나를 앞으로 끌고 나온다.","제자리로 돌려 보자. our day-to-day will need to be different(우리의 일상은 달라야 할 것이다).","\"우리의 일상은 달라야 할 것이다.\"","be 뒤에서 주어 상태를 말하는 자리는 형용사.","differently(다르게)는 동사를 꾸미는 부사라 be 뒤에 못 온다."]},{"t":"pair","h":"쉬운 예시","x":[["How happy you look!","너 정말 행복해 보인다! (look(~해 보이다) 뒤 → 형용사 happy(행복한))"],["How fast he runs!","그는 정말 빨리 달린다! (동사 runs(달린다)를 꾸밈 → 부사 fast(빨리))"]]}],"post":["how + 형용사 + 주어 + be: how different(얼마나 다른) ... to be"],"or":["different(다른, 형용사): 제자리로 돌리면 need to be different(달라야 하다)라 be 뒤 형용사 자리가 맞음.","difference(차이, 명사): how(얼마나) 뒤에 명사가 끌려 나올 수 없고 주어의 상태도 말하지 못함.","differ(다르다, 동사): be 뒤 보어 자리에 동사원형이 또 올 수 없음.","differs(다르다, 3인칭 단수형): be 뒤 보어 자리에 동사가 올 수 없음."]},{"slots":[["different","","","be의 보어 자리라 형용사."],["happen","to happen","a","make(~하게 하다)는 사역동사. make + 목적어 + 동사원형이라 to가 없다."],["to_put","","","lead(이끌다) + 사람 + to부정사."],["seduces","","","주어는 동명사 fantasizing(상상하는 것), 단수라 seduces(꾀다, 3인칭 단수형)."],["desired","","","미래는 \"바라는\" 쪽이 아니라 \"바람의 대상이 되는\" 쪽이라 과거분사."]],"opts":["happened","happen","happens","happening"],"point":"목적격보어(준동사)","en":"We fall in love with the idea of a goal, pushing out of mind how different our day-to-day will need to be for us to make it happen.","ko":"우리는 목표라는 생각에 푹 빠져서, 그것을 이루려면 우리의 일상이 얼마나 달라져야 하는지를 마음 밖으로 밀어낸다.","hl":["make it happen","for us"],"khl":["그것을 이루려면","우리의"],"blocks":[{"t":"p","h":"시키는 동사 뒤는 맨몸","x":["make it happen = 그것이 일어나게 만들다(이루다).","make(만들다)·let(두다)·have(시키다)는 \"~하게 하다\"라는 사역동사다.","이 셋 뒤의 목적어는 동사원형으로 바로 움직인다.","happen(일어나다)은 \"일어나다\"라서 happened(수동 모양)도 안 된다.","make it happen(그것을 실현하다)은 통째로 외워 두면 좋은 표현이다."]},{"t":"pair","h":"쉬운 예시","x":[["The movie made me cry.","그 영화는 나를 울게 했다. (made me cry = 나를 울게 했다)"],["Let me help you.","내가 도와줄게. (let me help = 내가 돕게 해 줘)"]]}],"post":["make(~하게 만들다) + it + 동사원형: make it happen(그것을 실현하다) (to 없음)"],"or":["happened(일어났다/과거분사): happen(일어나다)은 목적어를 받지 않는 동사라 수동의 p.p.로 쓸 수 없음.","happen(일어나다, 동사원형): 사역동사 make(~하게 하다) + 목적어 뒤에는 동사원형이 와서 맞음.","happens(일어나다, 3인칭 단수형): 목적격보어 자리에 s가 붙은 현재형 동사는 못 옴.","happening(일어나는 것): make(~하게 하다)는 목적격보어로 동사원형을 써서 -ing가 못 옴."]}],"quiz":[{"s":"The price of the shoes ___ too high.","o":["is","are"],"a":0,"ko":"그 신발의 가격은 너무 비싸다.","why":"주인은 The price(가격). of the shoes(그 신발의)는 꼬리표.","wy":"are(~이다, 복수형): 주인 The price(가격)가 단수라 복수 동사는 못 옴. of the shoes(신발의)는 꼬리표임."},{"s":"Tell me ___ you bought.","o":["what","that"],"a":0,"ko":"네가 산 것을 말해 줘.","why":"bought(샀다)의 목적어가 빔 → what.","wy":"that(~라는 것): bought(샀다)의 목적어가 비어 있고 앞에 받을 명사도 없어 못 옴."},{"s":"He came into the room, ___ a song.","o":["sang","singing"],"a":1,"ko":"그는 노래를 부르며 방에 들어왔다.","why":"동사 came(들어왔다)이 있으니 덧붙임은 -ing.","wy":"sang(노래했다): 동사 came(왔다)이 이미 있고 접속사가 없어 동사를 또 쓸 수 없음."},{"s":"You look so ___ today.","o":["different","differently"],"a":0,"ko":"너 오늘 정말 달라 보인다.","why":"look(~해 보이다) 뒤 보어 자리 → 형용사.","wy":"differently(다르게): 부사는 look(~하게 보이다) 뒤 보어 자리에 못 옴."},{"s":"My dad made me ___ the dishes.","o":["to wash","wash"],"a":1,"ko":"아빠는 내게 설거지를 하게 했다.","why":"make(~하게 만들다) + 사람 + 동사원형.","wy":"to wash(씻는 것): 사역동사 make(~하게 하다)는 목적격보어로 동사원형을 써서 to가 붙으면 안 됨."}]},{"items":[{"slots":[["suggests","","","research(연구)는 단수 취급이라 suggests(보여 주다, 3인칭 단수형)."],["provide","","","주어 our fantasies(우리의 환상들)가 복수라 provide(주다)."],["mentally","","","동사 enjoy(즐기다)를 꾸미는 부사."],["desired","desiring","a","미래가 무언가를 \"바라는\" 게 아니다. 사람이 미래를 바란다. 바람을 받는 쪽이라 desired(바라던)."],["induced","","","필요성이 스스로 일으키는 게 아니라 \"일으켜지는\" 쪽이라 수동태."]],"opts":["desires","to desire","desired","has desired"],"point":"능동 v-ing vs. 수동 p.p.","en":"Fantasizing about a positive future “seduces a person to mentally enjoy the desired future in the here and now.”","ko":"긍정적인 미래를 상상하는 것은 \"사람을 꾀어 바라던 미래를 바로 지금 여기서 마음속으로 즐기게 한다.\"","hl":["the desired future","enjoy"],"khl":["바라던 미래","즐기게"],"blocks":[{"t":"p","h":"누가 누구를 바라나","x":["desire(바라다): 바라는 건 사람이다.","미래는 사람에게 \"바람을 받는\" 쪽이다.","당하는(받는) 쪽이 명사를 꾸밀 땐 p.p.(-ed).","desiring future(바라는 미래)라고 하면 미래가 뭔가를 바라는 이상한 말이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I found the stolen bike.","나는 도둑맞은 자전거를 찾았다. (자전거는 훔침을 당함 → -ed)"],["Look at the running dog.","달리고 있는 개를 봐. (개가 직접 달림 → -ing)"]]}],"post":["바람을 받는 쪽이면 -ed: the desired future(바라던 미래)"],"or":["desires(바라다, 3인칭 단수형): 관사 the(그)와 명사 future(미래) 사이에 동사가 올 수 없음.","to desire(바라는 것): to부정사는 관사와 명사 사이에서 명사를 앞에서 꾸밀 수 없음.","desired(바라던, 과거분사): 미래는 사람이 바라는 대상, 즉 바람을 받는 쪽이라 p.p.가 명사를 꾸며 맞음.","has desired(바라 왔다): 동사 덩어리라 명사 future(미래)를 꾸미는 자리에 못 옴."]},{"slots":[["is","","","주어 the idea(그 생각)가 단수라 is(~이다, 3인칭 단수형)."],["to_put","","","lead(이끌다) + 사람 + to부정사."],["falling","","","대시 뒤 \"~하면서\" 분사구문."],["integrating","integrate","a","of(~의)는 전치사다. 전치사 뒤에 동사를 쓰려면 -ing 옷을 입어야 한다."],["why","","","reflect on(~을 돌아보다) 뒤에서 \"왜 ~인지\" 덩어리를 만든다. 뒤 문장이 완전하다."]],"opts":["integrated","integrates","to integrate","integrating"],"point":"전치사 + 동명사","en":"In the process, we gloss over the intricacies and challenges of integrating a complex new behavior into our life.","ko":"그 과정에서 우리는 복잡한 새 행동을 삶에 들여오는 일의 복잡함과 어려움을 대충 넘긴다.","hl":["of integrating","a complex new behavior"],"khl":["들여오는 일의","복잡한 새 행동을"],"blocks":[{"t":"p","h":"전치사는 명사만 태 cause they may provide clues about {how|how} to defeat the aging process. But their property of {being|being} able to {regenerate|regenerate} entire body parts, or even a whole organism, {makes|makes} them more {similar|similar} to trees than to us. Although we may learn some {fascinating|fascinating} things about their lack of apparent aging, it is not at all clear how {relevant|relevant} those findings will be to human aging. Sometimes biology is universal, especially if it {relates|relates} to fundamental mechanisms. But in other cases, even discoveries in rats or mice, {which|which} are mammals and {bio_closer|biologically} much closer to us, {are|are} difficult {to_translate|to translate} into humans. It may be a very long time before any findings {gained|gained} from hydra or jellyfish are {useful|useful} to us.","fn":["*hydra: 히드라(작은 민물 동물)","*immortal: 죽지 않는, 불멸의","*gerontologist: 노화학자","*regenerate: 재생하다","*organism: 생물(체)"],"mean":{"called":"불리는(call 부르다의 과거분사)","calling":"부르고 있는(call의 -ing형)","call":"부르다(동사원형)","calls":"부르다(call의 3인칭 단수 현재형)","have called":"불러 왔다(call의 현재완료)","does it":"그것이 ~하다(조동사 does + 주어 it, 도치 순서)","it does":"그것이 ~하다(주어 it + 조동사 does, 평서문 순서)","do it":"그것이 ~하다(조동사 do + 주어 it, 단수 it과 수가 안 맞음)","it do":"그것이 하다(주어 it + 동사원형 do, 수가 안 맞음)","it doing":"그것이 하는 중(주어 it + -ing형)","dying":"죽는 것(die의 동명사)","die":"죽다(동사원형)","died":"죽었다(die의 과거형)","dies":"죽다(die의 3인칭 단수 현재형)","to die":"죽는 것, 죽기(to부정사)","does":"~하다(do의 3인칭 단수 현재형, 조동사)","how":"~하는 방법, 얼마나","that":"~라는 것(접속사), ~하는(관계대명사)","whose":"누구의, 그것의(소유격 관계대명사)","whom":"누구를(목적격 관계대명사)","what":"~하는 것(관계대명사), 무엇","which":"그런데 그것은, ~하는(관계대명사)","where":"~하는 곳(관계부사), 어디","being":"~인 것(be의 동명사)","regenerate":"재생하다(동사원형)","regenerated":"재생했다/재생된(regenerate의 과거형·과거분사)","regenerates":"재생하다(regenerate의 3인칭 단수 현재형)","regenerating":"재생하는 것(regenerate의 -ing형)","regeneration":"재생(명사)","makes":"만들다(make의 3인칭 단수 현재형)","make":"만들다(동사원형)","making":"만드는 것(make의 -ing형)","to make":"만드는 것, 만들기(to부정사)","have made": n’t exhibit obvious signs of aging, they are often called biologically immortal.","ko":"히드라와 불멸의 해파리는 뚜렷한 노화의 징후를 보이지 않기 때문에, 흔히 생물학적으로 불멸이라고 불린다.","hl":["they are often called","biologically immortal"],"khl":["불린다","생물학적으로 불멸이라고"],"blocks":[{"t":"p","h":"부르는 쪽, 불리는 쪽","x":["call A B(A를 B라고 부르다). 사람들이 그들을 부른다.","그들(히드라와 해파리)은 \"불리는\" 쪽이다.","불리는 쪽이 주어가 되면 be + p.p. = are called(불린다).","are calling(부르고 있다)이면 \"그들이 누군가를 부르고 있다\"가 되는데, 부를 대상(목적어)도 없다."]},{"t":"pair","h":"쉬운 예시","x":[["People call him Tom.","사람들은 그를 톰이라고 부른다. (부르는 쪽 People(사람들))"],["He is called Tom.","그는 톰이라고 불린다. (불리는 쪽 He(그))"]]}],"post":["불리는 쪽이 주어면 be + p.p.: are called(불린다)"]},{"slots":[["called","","","그들은 불리는 쪽이라 수동태."],["does_it","it does","a","Nor(~도 아니다)가 문장 맨 앞에 오면 의문문처럼 순서가 뒤집힌다. does it(그것이 ~하다)."],["does","","","주어 their likelihood(가능성)가 단수라 does(do의 3인칭 단수형)."],["regenerate","","","be able to(~할 수 있다) + 동사원형."],["relevant","","","how(얼마나) 뒤에서 be의 보어 자리라 형용사."]],"opts":["do it","it do","does it","it doing"],"or":["do it(조동사 do + 주어 it): 순서는 도치가 맞지만 주어 it(그것)은 단수라 do가 아닌 does(do의 3인칭 단수형)가 필요함","it do(그것이 하다): Nor(~도 아니다) 뒤인데 주어가 먼저 와서 도치가 안 됐고, 단수 it에 do도 안 맞음","does it(그것이 ~하다, 도치 순서): Nor(~도 아니다)가 맨 앞이라 조동사 does(~하다) + 주어 it 의문문 순서가 맞음","it doing(그것이 하는 중): 도치도 안 됐고, -ing만으로는 mean(뜻하다) 앞 조동사 자리를 채우지 못함"],"point":"도치","en":"Nor does it even mean that they cannot die of biological causes.","ko":"그것은 그들이 생물학적 원인으로 죽을 수 없다는 뜻조차 아니다.","hl":["Nor does it","even mean"],"khl":["뜻조차","아니다"],"blocks":[{"t":"p","h":"부정어가 맨 앞이면 자리 바꾸기","x":["Nor(~도 아니다)는 부정의 말이다.","부정의 말이 문장 맨 앞에 서면 뒤는 의문문 순서가 된다.","원래: it does not even mean ...(그것은 ~라는 뜻도 아니다)","Nor(~도 아니다)가 앞에 오면: Nor does it even mean ...(그것은 ~라는 뜻조차 아니다)","Never(결코 ~않다), Little(거의 ~않다), Not only(~뿐만 아니라)가 맨 앞에 와도 똑같다."]},{"t":"pair","h":"쉬운 예시","x":[["I don’t like it. Nor does my sister.","나는 그게 싫다. 내 여동생도 마찬가지다. (Nor(~도 아니다) + does(대신 받는 동사) + 주어)"],["Never have I seen such a big dog.","나는 그렇게 큰 개를 본 적이 없다. (Never(결코 ~않다) + have(완료 조동사) + I)"]] e aging process(노화 과정)가 이미 있음"],"point":"what vs. how(빈자리 확인)","en":"Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.","ko":"히드라와 불멸의 해파리 같은 종은 노화 과정을 물리칠 방법에 대한 단서를 줄 수도 있어서 노화학자들을 들뜨게 한다.","hl":["how to defeat the aging process","clues"],"khl":["노화 과정을 물리칠 방법","단서"],"blocks":[{"t":"p","h":"빈자리가 있나 없나","x":["what to(무엇을 ~할지) + 동사: 동사의 목적어가 빠져야 한다. what to eat(무엇을 먹을지).","how to(~하는 방법) + 동사: 빠진 게 없다. how to cook rice(밥 짓는 방법).","to defeat the aging process(노화 과정을 물리치다).","defeat(물리치다)의 목적어 the aging process(노화 과정)가 이미 있다.","빈자리 없음 → how(~하는 방법)."]},{"t":"pair","h":"쉬운 예시","x":[["I don’t know what to say.","나는 무슨 말을 할지 모르겠다. (say의 목적어가 빔)"],["Show me how to use this.","이거 쓰는 방법을 알려 줘. (this가 있어 빈자리 없음)"]]},{"t":"tap","h":"확인 질문","q":"the aging process(노화 과정)를 지우면? clues about ___ to defeat(___을 물리칠지에 대한 단서).","a":["what(무엇).","defeat(물리치다)의 목적어가 비니까 what(무엇을 물리칠지)."]}],"post":["목적어까지 다 있으면 how to(~하는 방법): how to defeat the aging process(노화 과정을 물리칠 방법)"]},{"slots":[["dying","","","전치사 of(~의) 뒤 동명사."],["regenerate","","","be able to(~할 수 있다) + 동사원형."],["makes","make","a","주어는 their property(특성) 하나다. of(~의) 이하 긴 꼬리표 속 parts(부위들), organism(생물)에 속으면 안 된다."],["relates","","","주어 it(그것 = biology 생물학)이 단수라 relates(relate의 3인칭 단수형)."],["gained","","","발견은 \"얻어지는\" 쪽이라 과거분사."]],"opts":["makes","making","to make","have made"],"or":["makes(만들다, make의 3인칭 단수형): 꼬리표를 접은 주어 their property(그들의 특성)가 단수라 맞음","making(만드는 것, -ing형): 주어 뒤에 진짜 동사가 필요한데 -ing는 동사 자리에 못 옴","to make(만드는 것, to부정사): to부정사는 동사 노릇을 못 해 문장에 동사가 없어짐","have made(만들어 왔다, 현재완료): 단수 주어 property(특성)에 have(복수 주어용 조동사)는 수가 안 맞음"],"point":"수식받는 주어의 수일치","en":"But their property of being able to regenerate entire body parts, or even a whole organism, makes them more similar to trees than to us.","ko":"하지만 몸의 부위 전체, 심지어 생물 하나 전체를 재생할 수 있는 그들의 특성은 그들을 우리보다 나무와 더 비슷하게 만든다.","hl":["their property","makes"],"khl":["그들의 특성은","만든다"],"block seful","uses","usefulness"],"or":["use(사용하다, 동사원형): are(~이다) 뒤에 동사원형은 못 오고, 명사 '사용'으로 봐도 '발견 = 사용'이 되어 뜻이 안 됨","useful(쓸모 있는, 형용사): are(~이다) 뒤에서 주어 findings(발견들)의 상태를 말하는 보어라 형용사가 맞음","uses(사용하다, 3인칭 단수형): are(~이다) 뒤에 동사가 또 오면 동사가 두 개가 되고 복수 주어와도 안 맞음","usefulness(유용성, 명사): '발견들 = 유용성'이 되어 주어와 같을 수 없는 명사가 보어 자리에 옴"],"point":"형용사 자리 vs. 부사 자리","en":"It may be a very long time before any findings gained from hydra or jellyfish are useful to us.","ko":"히드라나 해파리에서 얻은 어떤 발견이 우리에게 쓸모 있어지기까지는 아주 오랜 시간이 걸릴지도 모른다.","hl":["are useful to us","any findings"],"khl":["우리에게 쓸모 있어지기까지는","어떤 발견이"],"blocks":[{"t":"p","h":"be 뒤는 상태 칸","x":["주인(주어): any findings(어떤 발견들).","gained from hydra or jellyfish(히드라나 해파리에서 얻은)는 꼬리표다.","꼬리표를 접으면 any findings are ___ to us(어떤 발견들이 우리에게 ___하다).","be동사 뒤는 주어가 \"어떤 상태\"인지 말하는 칸이다.","상태 칸에는 형용사 useful(쓸모 있는).","usefully(쓸모 있게)는 동사를 꾸미는 부사라 이 칸에 못 온다."]},{"t":"pair","h":"쉬운 예시","x":[["This map is useful to me.","이 지도는 나에게 쓸모 있다. (is(~이다) 뒤 → 형용사 useful(쓸모 있는))"],["He spent his time usefully.","그는 시간을 쓸모 있게 보냈다. (동사 spent를 꾸밈 → 부사)"]]}],"post":["be + 형용사: findings ... are useful to us(발견들이 우리에게 쓸모 있다)"]},{"slots":[["does_it","","","Nor(~도 아니다)가 맨 앞이라 does it(그것이 ~하다) 순서."],["makes","","","주어 their property(그들의 특성)가 단수라 makes(make의 3인칭 단수형)."],["fascinating","fascinated","a","흥미를 느끼는 건 사람이다. things(것들)는 흥미를 \"주는\" 쪽이라 -ing."],["which","","","콤마 뒤 rats or mice(쥐나 생쥐)를 보충 설명하는 관계대명사."],["to_translate","","","difficult(어려운) to + 동사원형 = ~하기 어려운."]],"opts":["fascinating","fascinate","fascinates","fascinatingly"],"or":["fascinating(흥미로운, -ing형): things(것들)가 흥미를 '주는' 쪽이라 능동 -ing가 맞음","fascinate(매혹하다, 동사원형): some(몇몇) 뒤에서 명사 things(것들)를 꾸밀 자리라 동사원형은 못 옴","fascinates(매혹하다, 3인칭 단수형): 명사를 꾸미는 자리에 -s 붙은 동사 형태는 올 수 없음","fascinatingly(흥미롭게, 부사): 부사는 명사 things(것들)를 꾸밀 수 없음"],"point":"능동 v-ing vs. 수동 p.p.","en":"Although we may learn some fascinating things about their lack of apparent aging, it is not at all clear how relevant those findings will be to human aging.","k idies {has|has} to be {matched|matched} by the contraction of the opportunity set of others. The electricity companies’ “freedom” is increased at the expense of the ordinary individual, {who|who} must suffer from increased taxation to pay for the subsidy. Moreover, from the perspective of pure efficiency, the subsidy {distorts|distorts} the economy because the electricity company is not {facing|facing} the full costs of {what|what} it does, even if it is successful in {limiting|limiting} emissions. Indeed, electricity prices may end up {lower|lower} than {they|they} should be and electricity consumption higher, {which|which} will {worsen|worsen} global warming, even though the emissions per unit of electricity {have|have} been reduced.","fn":["*subsidy: 보조금","*opportunity set: 선택 가능한 기회의 범위","*distort: 왜곡하다"],"mean":{"lead":"이어지다(동사원형)","that":"~하는(관계대명사), ~라는 것(접속사)","pollute":"오염시키다(동사원형·복수 현재형)","pollutes":"오염시키다(pollute의 3인칭 단수 현재형)","polluting":"오염시키는(pollute의 -ing형)","to pollute":"오염시키는 것(to부정사)","has polluted":"오염시켜 왔다(pollute의 현재완료, 단수형)","switching":"바꾸는 것, 벗어나는 것(switch의 동명사)","taking":"고려하는(take의 -ing형)","taken":"고려된(take의 과거분사)","take":"고려하다, 가져가다(동사원형)","takes":"고려하다(take의 3인칭 단수 현재형)","to taking":"고려하는 것에(전치사 to + 동명사)","obvious":"분명한(형용사)","obviously":"분명히(부사)","more obviously":"더 분명하게(부사 obviously의 비교급)","most obviously":"가장 분명하게(부사 obviously의 최상급)","very obviously":"아주 분명하게(very + 부사)","themselves":"그들 자신, 그들이 직접(재귀대명사)","has":"가지다, has to ~해야 한다(have의 3인칭 단수 현재형)","have":"가지다, 현재완료 조동사(동사원형·복수 현재형)","having":"가지는, 가지고 있는(have의 -ing형)","to have":"가지는 것(to부정사)","matched":"맞춰진(match의 과거분사)","matching":"맞추는(match의 -ing형)","match":"맞추다(동사원형)","matches":"맞추다(match의 3인칭 단수 현재형)","to match":"맞추는 것(to부정사)","who":"~하는 (사람), 그 사람은(주격 관계대명사)","whom":"~하는 (사람)을(목적격 관계대명사)","whose":"~의, 그것의(소유격 관계대명사)","where":"~하는 곳(관계부사), 어디","what":"~하는 것(관계대명사), 무엇","which":"그리고 그것은, ~하는(관계대명사)","distorts":"왜곡하다(distort의 3인칭 단수 현재형)","distort":"왜곡하다(동사원형)","distorting":"왜곡하는 ons per unit of electricity have been reduced.","ko":"실제로 전기 가격은 마땅한 수준보다 결국 더 낮아지고 전기 소비는 더 높아질 수 있는데, 이는 전기 단위당 배출량이 줄었더라도 지구 온난화를 악화시킬 것이다.","hl":["the emissions","have been reduced"],"khl":["배출량이","줄었더라도"],"blocks":[{"t":"p","h":"단수 꼬리에 속지 않기","x":["동사 바로 앞에 electricity(전기)라는 단수처럼 보이는 말이 있다.","하지만 per unit of electricity(전기 단위당)는 꾸미는 꼬리다.","진짜 주인은 the emissions(배출량들), 끝에 s가 붙은 복수.","복수 주인에 맞춰 have been reduced(줄어들었다)."]},{"t":"pair","h":"쉬운 예시","x":[["The pictures on the wall have been there for years.","벽에 걸린 그 그림들은 몇 년째 거기 있다. (pictures → have)"]]}],"post":["꼬리 per unit of electricity(전기 단위당) 떼고 the emissions(배출량들) → have(현재완료 조동사, 복수형)"]}],"compquiz":[{"s":"She smiled at me, ___ made me happy.","o":["that","which"],"a":1,"ko":"그녀가 나에게 미소 지었고, 그것이 나를 기쁘게 했다.","why":"콤마 뒤 관계대명사 자리에 that 불가, which.","wy":"that(~하는): 관계대명사 that은 콤마 뒤 계속적 용법으로 못 씀"},{"s":"The cookies in the jar ___ been eaten.","o":["has","have"],"a":1,"ko":"병 속의 쿠키들은 다 먹혔다.","why":"주인은 The cookies(복수).","wy":"has(현재완료 단수형): 주인은 복수 The cookies(쿠키들)이고 in the jar(병 속의)는 꼬리라 틀림"}]},{"id":"2610g1-31","no":"31","title":"어법특훈 · 26년 10월 고1 31번","sub":"스타트렉 경제학과 풍요","tpl":"Few people may {view|view} the Star Trek universe through an economic lens, but {doing|doing} so {provides|provides} a window into a world {that|that} might soon be upon us. All of classical economics is {based|based} on the notion {that2|that} there isn’t usually enough of anything to {give|give} everyone everything they want or need. Because of that, we {use|use} markets and pricing to allocate those goods, services, and resources to {where|where} they might {result|result} in the highest benefit. In Star Trek, however, there isn’t {much|much} scarcity. Technology has allowed that society {to_reproduce|to reproduce} any food they want, {transport|transport} themselves thousands of miles in the blink of an eye, communicate over light-years, and {travel|travel} among the stars. All of humanity in that world {has|has} been fully educated so that they can {participate|participate} in this prosperity. Everyone {is|is} an explorer, researcher, engineer, artist, doctor, or counselor. Generative AI has the potential to allow many dimensions of our own society {to_be|to be} {similarly|similarly} highly {abundant|abundant}.","fn":["*scarcity: 부족, 희소성","*allocate: 배분하다","*abundant: 풍부한"],"mean":{"view":"보다","doing":"하는 것(do의 -ing형, 동명사)","do":"하다(동사원형)","does":"하다(do의 3인칭 단수 현재형)","did":"했다(do의 과거형)","done":"된, 끝난(do의 과거분사)","provides":"제공하다(provide의 3인칭 단수 현재형)","provide":"제공하다(동사원형)","providing":"제공하는 것(provide의 -ing형)","to provide":"제공하는 것, 제공하기 위해(to부정사)","have provided":"제공해 왔다(provide의 현재완료형)","that":"~하는(관계대명사) / ~라는 것(접속사)","what":"~한 것(관계대명사, the thing which)","which":"~하는 (것)(사물 관계대명사)","whom":"~하는 (사람)(목적격 관계대명사)","whose":"~의(소유격 관계대명사)","where":"~하는 곳(관계부사)","based":"기초를 둔(base의 과거분사). be based on = ~에 기초하다","basing":"기초를 두는 것(base의 -ing형)","base":"기초를 두다(동사원형)","bases":"기초를 두다(base의 3인칭 단수 현재형)","to base":"기초를 두는 것(to부정사)","give":"주다","use":"이용하다, 쓰다","uses":"이용하다(use의 3인칭 단수 현재형)","using":"이용하는 것(use의 -ing형)","to use":"이용하는 것, 쓰는 것(to부정사)","is using":"이용하고 있다(use의 현재진행형)","result":"(결과로) 낳다. result in = ~을 낳다","much":"많은(셀 수 없는 명사 앞)","many":"많은(셀 수 있는 복수 명사 앞)","a few":"몇몇의(셀 수 있는 복수 명사 앞)","several":"여러 개의(셀 수 있는 복수 명사 앞)","a number of":"많은 ~들(복수 명사 앞)","to reproduce":"복제하는 것(to부정사)","reproduce":"복제하다(동사원형)","reproduced":"복제된(reproduce의 과거·과거분사)","reproduces":"복제하다(reproduce의 3인칭 단수 현재형)","reproducing":"복제하는 것(reproduce의 -ing형)","transport":"이동시키다, 운송하다(동사원형)","transports":"이동시키다(transport의 3인칭 단수 현재형)","transported":"이동시켰다/이동된(transport의 과거·과거분사)","transporting":"이동시키는 것(transport의 -ing형)","to transporting":"이동시키는 것으로(전치사 to + -ing형)","travel":"여행하다","has":"가지다(have의 3인칭 단수 현재형). has been = ~되어 왔다","have":"가지다(동사원형, 복수 주어용)","participate":"참여하다. participate in = ~에 참여하다","is":"~이다(be동사 3인칭 단수 현재형)","are":"~이다(be동사 복수 현재형)","were":"~였다(be동사 복수 과거형)","being":"~인 것(be의 -ing형)","to be":"~이 되는 것, ~인 것(to부정사)","similarly":"마찬가지로, 비슷하게","abundant":"풍부한(형용사)","abundance":"풍부함(명사)","abundantly":"풍부하게(부사)","more abundantly":"더 풍부하게(부사 비교급)","most abundantly":"가장 풍부하게(부사 최상급)","Eat":"먹다(동사원형)","Eating":"먹는 것(eat의 -ing형, 동명사)","make":"~하게 만들다(동사원형)","makes":"~하게 만들다(make의 3인칭 단수 현재형)","play":"(운동을) 하다(동사원형)","playing":"하는 것(play의 -ing형)","tell":"(이야기를) 들려주다(동사원형)","telling":"들려주는 것(tell의 -ing형)","beautiful":"아름다운(형용사)","beautifully":"아름답게(부사)"},"sets":[{"items":[{"slots":[["view","","","조동사 may(~일지도 모른다) 뒤라 동사원형이 맞다."],["doing","do","a","but(하지만) 뒤 문장의 주어 자리. 동사원형 do(하다)는 주어가 될 수 없다. \"~하는 것\"은 동명사 doing(하는 것, do의 -ing형)."],["that","","","선행사 a world(세상)가 사물이고 뒤에 주어가 빠져 있어 주격 that(~하는)."],["give","","","enough(충분한) ... to + 동사원형: ~할 만큼 충분한."],["much","","","scarcity(부족)는 셀 수 없는 명사라 much(많은)가 맞다."]],"opts":["done","doing","does","did"],"point":"동명사 주어","or":["done(된, do의 과거분사): 과거분사는 혼자 주어가 될 수 없고 '그렇게 된'이라는 뜻도 안 맞음","doing(하는 것, do의 -ing형): but(하지만) 뒤 문장의 주어 자리라 '~하는 것'인 동명사가 맞음","does(하다, do의 3인칭 단수형): 주어 자리에 동사가 오면 뒤의 provides(제공하다)와 동사가 두 개가 됨","did(했다, do의 과거형): 동사라 주어가 될 수 없고, 진짜 동사 provides(제공하다)가 따로 있어 문장이 깨짐"],"en":"Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.","ko":"스타트렉 세계를 경제학의 렌즈로 보는 사람은 거의 없겠지만, 그렇게 하는 것은 곧 우리에게 닥칠지도 모르는 세상을 들여다보는 창을 제공한다.","hl":["doing so provides"],"khl":["그렇게 하는 것은"],"blocks":[{"t":"p","h":"동사를 주어로 쓰려면 옷 갈아입기","x":["동사 do(하다)는 그대로 주어 자리에 설 수 없다.","주어가 되려면 \"~하는 것\"이라는 명사 옷을 입어야 한다.","그 옷이 -ing(동명사)다. doing so = 그렇게 하는 것.","so(그렇게)는 앞의 \"스타트렉을 경제학으로 보는 것\"을 받는다.","진짜 동사는 뒤의 provides(제공하다 provide의 3인칭 단수형)."]},{"t":"pair","h":"쉬운 예시","x":[["Swimming is fun.","수영하는 것은 재미있다. (주어 Swimming = 수영하는 것)"],["Reading books makes me happy.","책 읽는 것은 나를 행복하게 한다. (주어 Reading books = 책 읽는 것)"]]}],"post":["주어 자리 동사는 -ing: doing so(그렇게 하는 것) provides(제공하다 provide의 3인칭 단수형)"]},{"slots":[["provides","","","주어 doing so(그렇게 하는 것)는 단수라 provides(제공하다 provide의 3인칭 단수형)."],["based","basing","a","be based on = ~에 기초하다. 경제학은 생각 위에 \"세워지는\" 쪽이라 수동 p.p."],["use","","","주어 we(우리)의 진짜 동사라 use(이용하다)가 맞다."],["transport","","","to reproduce(복제하는 것) ..., transport(이동시키다) ...: 앞의 reproduce(복제하다)와 나란한 동사원형."],["is","","","주어 Everyone(모든 사람)은 단수 취급이라 is(~이다, be동사 3인칭 단수형)."]],"opts":["base","bases","based","to base"],"point":"능동태 vs. 수동태","or":["base(기초를 두다, 동사원형): is(~이다) 뒤에 동사원형이 바로 붙을 수 없음","bases(기초를 두다, 3인칭 단수형): is bases(~이다 + 기초를 두다)처럼 동사 두 개가 겹쳐 문장이 안 됨","based(기초를 둔, base의 과거분사): 경제학은 생각 위에 세워지는 쪽이라 is based on(~에 기초한다) 수동태가 맞음","to base(기초를 두는 것, to부정사): is to base on은 '기초를 둘 예정이다'라는 뜻이 되고 목적어도 없어 뜻이 안 맞음"],"en":"All of classical economics is based on the notion that there isn’t usually enough of anything to give everyone everything they want or need.","ko":"고전 경제학 전체는 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 줄 만큼 충분한 것이 보통 없다는 생각에 기초한다.","hl":["is based on","the notion"],"khl":["기초한다","생각에"],"blocks":[{"t":"p","h":"건물과 땅으로 생각하기","x":["base(기초를 두다)는 \"~에 기초를 두다\"라는 뜻으로, 원래 뒤에 목적어가 필요하다.","경제학이 무엇을 기초로 두는 게 아니다. 경제학이 생각 위에 \"세워진\" 쪽이다.","세워진 쪽 = 수동태 be + p.p. = is based on(~에 기초한다).","is basing on(기초를 두고 있다)은 \"기초를 두는 중\"인데 목적어도 없어서 틀린다."]},{"t":"pair","h":"쉬운 예시","x":[["This movie is based on a true story.","이 영화는 실화를 바탕으로 한다. (is based on = ~을 바탕으로 한다)"],["The house was built in 1990.","그 집은 1990년에 지어졌다. (집은 지어지는 쪽)"]]}],"post":["~에 기초하다 = be based on(~에 기초하다) (수동)"]},{"slots":[["that2","","","the notion(생각)의 내용을 설명하는 that(~라는). 뒤가 완전한 문장이다."],["where","","","to where = ~하는 곳으로. 뒤 문장(they might result in(그것들이 ~을 낳을 수도 있다) ...)이 완전해서 관계부사 where(~하는 곳)."],["much","many","a","scarcity(부족)는 셀 수 없는 명사다. many(많은)는 셀 수 있는 복수 명사에만 쓴다."],["has","","","주어 All of humanity(모든 인류)는 단수라 has(have의 3인칭 단수형)."],["abundant","","","to be(~이 되는 것) 뒤 보어 자리라 형용사."]],"opts":["much","a few","several","a number of"],"point":"수량형용사 much vs. many","or":["much(많은, 셀 수 없는 명사용): scarcity(부족)는 셀 수 없는 명사라 much가 맞음","a few(몇몇의): 셀 수 있는 복수 명사 앞에만 써서 s 없는 scarcity(부족)와 안 맞음","several(여러 개의): several books(여러 권의 책)처럼 셀 수 있는 복수 명사와 짝이라 scarcity(부족) 앞에 못 옴","a number of(많은 ~들): 뒤에 복수 명사가 와야 해서 셀 수 없는 scarcity(부족)와 안 맞음"],"en":"In Star Trek, however, there isn’t much scarcity.","ko":"그러나 스타트렉에서는 부족함이 별로 없다.","hl":["much scarcity"],"khl":["부족함이 별로 없다"],"blocks":[{"t":"p","h":"셀 수 있나 없나","x":["many(많은), a few(몇몇의), several(여러 개의)은 하나, 둘 셀 수 있는 명사(복수)와 짝이다.","much(많은), a little(약간의)은 셀 수 없는 명사와 짝이다.","scarcity(부족)는 하나, 둘 셀 수 없다. 끝에 s도 없다.","그래서 isn’t much scarcity(부족이 많지 않다)."]},{"t":"pair","h":"쉬운 예시","x":[["I don’t have much time.","나는 시간이 많지 않다. (time은 셀 수 없음 → much(많은))"],["I don’t have many friends.","나는 친구가 많지 않다. (friends는 셀 수 있음 → many(많은))"]]}],"post":["셀 수 없는 scarcity(부족) → much(많은)"]},{"slots":[["doing","","","주어 자리 동명사 doing(하는 것, do의 -ing형)."],["result","","","조동사 might(~일지도 모른다) 뒤라 동사원형."],["to_reproduce","reproducing","a","allow(~하게 해 주다) + 목적어 + to부정사. allow 뒤의 사람(사회)은 to + 동사원형으로 움직인다."],["participate","","","조동사 can(~할 수 있다) 뒤라 동사원형."],["to_be","","","allow(~하게 해 주다) + many dimensions(많은 측면) + to be(~이 되는 것). allow 뒤 to부정사."]],"opts":["reproduce","to reproduce","reproduced","reproduces"],"point":"목적격보어(준동사)","or":["reproduce(복제하다, 동사원형): allow(허락하다)는 let(~하게 해 주다)과 달리 to 없는 동사원형을 받지 않음","to reproduce(복제하는 것, to부정사): allow(~하게 해 주다) + 목적어 + to부정사 짝이라 맞음","reproduced(복제된, 과거분사): 그 사회가 직접 음식을 복제하는 쪽이라 '복제된'이라는 수동 뜻이 안 맞음","reproduces(복제하다, 3인칭 단수형): 이미 진짜 동사 has allowed(해 주었다)가 있어 동사가 또 올 수 없음"],"en":"Technology has allowed that society to reproduce any food they want, transport themselves thousands of miles in the blink of an eye, communicate over light-years, and travel among the stars.","ko":"기술 덕분에 그 사회는 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 수천 마일을 이동하고, 수 광년 너머로 소통하고, 별들 사이를 여행할 수 있게 되었다.","hl":["has allowed that society to reproduce"],"khl":["기술 덕분에 그 사회는"],"blocks":[{"t":"p","h":"allow는 to를 데리고 다닌다","x":["allow(~하게 해 주다) + 사람 + to + 동사원형 = 사람이 ~하게 허락하다(해 주다).","Technology has allowed that society to reproduce(기술이 그 사회가 복제하게 ":"산다(live의 3인칭 단수 현재형)","living":"사는 것, 사는(live의 -ing형)","sad":"슬픈(형용사)","sadly":"슬프게(부사)","wash":"씻다(동사원형)","washing":"씻는 것, 씻는(wash의 -ing형)"},"sets":[{"items":[{"slots":[["that","","","the very fact(바로 그 사실)의 내용을 설명하는 that(~라는). 뒤가 완전한 문장이다."],["makes","make","a","주어는 The very fact(바로 그 사실), 하나다. that ... space(~ 공간에서 일어난다는)는 사실의 내용을 설명하는 긴 꼬리표."],["inseparable","","","make(만들다) + 목적어 + 형용사. 공간을 떼어 놓을 수 없게 만든다."],["what","","","전치사 from(~로부터) 뒤, defines(규정하다)의 주어가 빠져 있고 앞에 명사가 없으니 what(~하는 것)."],["that2","","","the event(사건) 뒤, took(일어났다, take의 과거형)의 주어가 빠진 관계절이라 that(~하는)."]],"opts":["making","to make","having made","makes"],"or":["making(만드는 것, make의 -ing형): 주어 뒤 동사 자리인데 -ing는 혼자 동사가 못 됨","to make(만드는 것, to부정사): to부정사도 동사 자리에 올 수 없음","having made(만든 것, 완료형 -ing): -ing 형태라 동사 역할을 못 함","makes(만든다, make의 3인칭 단수 현재형): 주어 The very fact(바로 그 사실)가 단수이고 문장의 진짜 동사 자리라 맞음"],"point":"수식받는 주어의 수일치","en":"The very fact that all of our experiences “take place” in a physical space makes the space inseparable from what defines it.","ko":"우리의 모든 경험이 물리적 공간에서 ‘일어난다’는 바로 그 사실은 그 공간을 그것을 규정하는 것과 떼어 놓을 수 없게 만든다.","hl":["The very fact","makes"],"khl":["바로 그 사실은","만든다"],"blocks":[{"t":"p","h":"긴 꼬리표 접어 두기","x":["주어 뒤에 that(~라는)절이 길게 붙으면 꼬리표를 접어 본다.","The very fact(바로 그 사실) [that ... physical space(물리적 공간)] makes(만든다) ...","남는 것: The very fact makes the space inseparable(바로 그 사실이 공간을 떼어 놓을 수 없게 만든다).","주인 fact(사실)가 하나니까 makes(만든다).","꼬리표 속 experiences(경험들, 복수)를 보고 make(만들다)를 고르면 함정."]},{"t":"pair","h":"쉬운 예시","x":[["The fact that he won makes me happy.","그가 이겼다는 사실은 나를 행복하게 한다. (주인 The fact(그 사실) → makes(만들다))"],["The news that they are coming is great.","그들이 온다는 소식은 정말 좋다. (주인 The news(그 소식) → is(~이다))"]]}],"post":["that절 꼬리표 접고 주인 The very fact(바로 그 사실) 보기 → makes(만든다)"]},{"slots":[["inseparable","","","make(만들다) + 목적어 + 형용사 보어."],["what","that","a","전치사 from(~로부터) 바로 뒤이고, defines(규정하다)의 주어가 비어 있다. \"규정하는 것\"이라 what(~하는 것)."],["that2","","","the event(사건) 뒤 주어 빠진 관계절."],["are","","","The tree and the ground(나무와 땅), 둘이라 are(~이다)."],["challenges","","","주어 This intertwining(뒤얽힘)이 단수라 challenges(이의를 제기한다)."]],"opts":["which","whom","what","where"],"or":["which(~하는, 관계대명사): 앞에 꾸밀 명사(선행사)가 없어서 올 수 없음","whom(~하는 (사람)을, 목적격 관계대명사): 빈자리는 주어 자리인데 whom은 목적어용이고 선행사도 없음","what(~하는 것): 앞에 명사가 없고 defines(규정하다)의 주어가 비어 있어 '규정하는 것'인 what이 맞음","where(그곳에서, 관계부사): 뒤 문장에 주어가 빠져 있어 완전한 문장을 이끄는 where는 안 됨"],"point":"that vs. what","en":"The very fact that all of our experiences “take place” in a physical space makes the space inseparable from what defines it, from the event that took place in it.","ko":"우리의 모든 경험이 물리적 공간에서 ‘일어난다’는 바로 그 사실은 그 공간을, 그것을 규정하는 것, 즉 그 안에서 일어난 사건과 떼어 놓을 수 없게 만든다.","hl":["from what defines it","from the event that took place in it"],"khl":["그것을 규정하는 것","그 안에서 일어난 사건과"],"blocks":[{"t":"p","h":"what은 명사를 품고 다닌다","x":["what(~하는 것) = the thing which(~하는 것). 이미 \"것\"이라는 명사가 들어 있다.","from(~로부터) 뒤에는 명사가 와야 하는데, 앞에 명사가 없다.","그래서 명사를 품은 what(~하는 것)이 와야 한다.","what defines it(그것을 규정하는 것) = 그것을 규정하는 것.","바로 뒤의 the event that ...(~한 사건)은 앞에 명사 the event(사건)가 있어서 that(~하는)이다. 둘을 나란히 비교해 보자."]},{"t":"pair","h":"쉬운 예시","x":[["I learned a lot from what he said.","나는 그가 한 말에서 많은 것을 배웠다. (앞에 명사 없음 → what)"],["I learned a lot from the book that he gave me.","나는 그가 준 책에서 많은 것을 배웠다. (앞에 명사 the book(그 책) → that)"]]}],"post":["앞에 명사 없으면 what: from what defines it(그것을 규정하는 것으로부터)"]},{"slots":[["merely","","","not merely(단지 ~이 아닌), 부사."],["elegantly","","","동사 made the point(그 점을 표현했다)를 꾸미는 부사. 멋지게 표현했다."],["writing","wrote","a","이 문장의 진짜 동사는 made(표현했다)로 이미 있다. 접속사 없이 콤마 뒤에 붙이는 말은 -ing."],["created","","","공간이 소설 속에 \"만들어진\" 것이라 과거분사."],["themselves","","","주어 Beings(존재들) 자신을 둘러싸니 재귀대명사."]],"opts":["writing","writes","to writing","is writing"],"or":["writing(쓰면서, write의 -ing형): 진짜 동사 made(표현했다)가 이미 있으니 콤마 뒤 덧붙임은 -ing가 맞음","writes(쓴다, 3인칭 단수 현재형): 접속사 없이 동사가 하나 더 생기고 과거 made(표현했다)와 시제도 안 맞음","to writing(쓰는 것에): 콤마 뒤 덧붙임 자리에 to + -ing 형태는 오지 않음","is writing(쓰고 있다, 현재진행형): 접속사 없이 동사가 둘이 되고 is(~이다)의 주어도 없음"],"point":"정동사 vs. 준동사","en":"Belgian literary critic Georges Poulet made the point elegantly, writing of the space created in Marcel Proust’s great novel In Search of Lost Time.","ko":"벨기에 문학 비평가 조르주 풀레는 마르셀 프루스트의 위대한 소설 『잃어버린 시간을 찾아서』 속에 만들어진 공간에 대해 쓰면서 이 점을 멋지게 표현했다.","hl":["made the point elegantly","writing of"],"khl":["이 점을 멋지게 표현했다","쓰면서"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["접속사 없이 문장 하나에 진짜 동사는 하나다.","이 문장의 진짜 동사: made(표현했다).","콤마 뒤에 wrote(썼다)를 또 쓰면 접속사 없이 동사가 둘이 된다.","그래서 동사 옷을 벗긴 writing(~하면서)으로 붙인다.","write of(~에 대해 쓰다) ~ = ~에 대해 쓰다."]},{"t":"pair","h":"쉬운 예시","x":[["He walked home, singing a song.","그는 노래를 부르면서 집에 걸어갔다. (walked(걸어갔다) + singing(노래하면서))"],["She sat by the window, reading a book.","그녀는 책을 읽으면서 창가에 앉아 있었다."]]}],"post":["동사 made(표현했다) 있으면 콤마 뒤는 -ing: ..., writing of(~에 대해 쓰면서)"]},{"slots":[["themselves","","","주어 Beings(존재들) 자신이라 재귀대명사."],["where","which","a","뒤 they find themselves(그들이 자신을 발견하다)는 빠진 것 없는 완전한 문장이다. 장소 the places(장소들) + 완전한 문장이면 관계부사 where(그곳에서)."],["find","","","주어 they(그들, 복수), 현재형 find(발견하다)."],["oneself","","","주어 one(사람) 자신을 감싸니 oneself(자기 자신)."],["that3","","","a garment(옷) 뒤, is(~이다)의 주어가 빠진 관계절이라 that(~하는)."]],"opts":["what","where","whose","whom"],"or":["what(~하는 것): 앞에 명사 the places(장소들)가 있어 올 수 없고 뒤 문장에 빈자리도 없음","where(그곳에서, 관계부사): 장소 the places(장소들) 뒤이고 they find themselves(그들이 자신을 발견하다)가 완전한 문장이라 맞음","whose(그것의, 소유격 관계대명사): 바로 뒤에 꾸밀 명사가 와야 하는데 주어 they(그들)가 옴","whom(~하는 (사람)을): 사람이 아닌 장소 뒤이고 뒤 문장에 목적어 빈자리도 없음"],"point":"관계대명사 vs. 관계부사","en":"Beings surround themselves with the places where they find themselves.","ko":"존재들은 자신이 놓여 있는 장소로 스스로를 둘러싼다.","hl":["the places where","they find themselves"],"khl":["장소로","자신이 놓여 있는"],"blocks":[{"t":"p","h":"뒤 문장에 구멍이 있나","x":["they find themselves(그들이 자신을 발견하다). 주어 they(그들), 동사 find(발견하다), 목적어 themselves(그들 자신). 구멍이 없다.","구멍이 없으면 관계대명사 which(~하는), that(~하는)은 들어갈 수 없다.","관계대명사는 주어나 목적어 구멍을 채우는 말이기 때문이다.","구멍 없는 문장 + 장소 명사 = where(그곳에서).","find oneself(자신을 발견하다) ~ = 자신이 ~에 있음을 알게 되다, 즉 ~에 놓여 있다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the house where I live.","여기가 내가 사는 집이다. (I live = 내가 산다, 완전 → where(~하는 곳))"],["This is the house which I bought.","여기가 내가 산 집이다. (bought의 목적어 구멍 → which)"]]},{"t":"tap","h":"확인 질문","q":"where(그곳에서)를 다른 말로 바꾸면?","a":["in which(그 안에서).","the places in which they find themselves(그들이 놓여 있는 장소들)."]}],"post":["장소 + 완전한 문장 → where: the places where they find themselves(그들이 놓여 있는 장소)"]},{"slots":[["created","","","공간이 소설 속에서 \"만들어진\" 쪽이라 과거분사."],["themselves","","","주어 Beings(존재들) 자신을 둘러싸니 재귀대명사."],["where","","","장소 the places(장소들) + 완전한 문장이라 관계부사 where(그곳에서)."],["find","finding","a","where(그곳에서) 뒤 작은 문장에도 주어 they(그들)와 짝을 이룰 진짜 동사가 필요하다. -ing는 혼자 동사 역할을 못 한다."],["oneself","","","주어 one(사람) 자신을 감싸니 oneself(자기 자신)."]],"opts":["find","finds","to find","having found"],"or":["find(발견하다, 동사원형=현재형): 주어 they(그들)가 복수라 -s 없는 현재형이 맞음","finds(발견한다, 3인칭 단수 현재형): 주어 they(그들)가 복수라 -s가 붙으면 안 됨","to find(발견하는 것, to부정사): where(그곳에서)절 안에 진짜 동사가 필요한데 to부정사는 동사 자리에 못 옴","having found(발견한 것, 완료형 -ing): -ing 형태는 혼자 동사가 못 됨"],"point":"정동사 vs. 준동사","en":"Beings surround themselves with the places where they find themselves.","ko":"존재들은 자신이 놓여 있는 장소로 스스로를 둘러싼다.","hl":["where they find themselves","Beings surround themselves"],"khl":["자신이 놓여 있는","스스로를 둘러싼다"],"blocks":[{"t":"p","h":"작은 문장에도 동사 한 개","x":["where(그곳에서) 뒤에도 작은 문장이 하나 들어 있다.","작은 문장에도 주어와 진짜 동사가 있어야 한다.","주어 they(그들) + 동사 find(알게 되다).","finding(발견하는, -ing형)은 동사 옷을 벗은 모양이라 혼자 동사가 못 된다.","they(그들)가 복수라 finds(발견한다, 3인칭 단수형)도 안 된다."]},{"t":"pair","h":"쉬운 예시","x":[["This is the room where I sleep.","여기가 내가 자는 방이다. (where(~하는 곳) + I + sleep(자다))"],["I remember the day when we met.","나는 우리가 만난 날을 기억한다. (when(~한 때) + we(우리가) + met(만났다))"]]}],"post":["관계절 안에도 진짜 동사: where they find themselves(그들이 놓여 있는)"]}],"quiz":[{"s":"The fact that you tried hard ___ me proud.","o":["make","makes"],"a":1,"ko":"네가 열심히 노력했다는 사실이 나를 자랑스럽게 한다.","why":"주인은 The f is the medium of all experiences.","ko":"장소와 공간이 경험의 바로 핵심에 있다면, 우리는 공간적 틀이 모든 경험의 매개체일 가능성을 받아들여야 한다.","hl":["we must accept","the possibility"],"khl":["받아들여야 한다","가능성을"],"blocks":[{"t":"p","h":"조동사는 원형만 데리고 다닌다","x":["can(~할 수 있다), will(~할 것이다), must(~해야 한다), should(~해야 한다), may(~일지도 모른다)는 조동사다.","조동사 뒤에는 꾸밈없는 동사원형만 온다.","-s도, -ed도, -ing도, to도 붙지 않는다.","must accept(받아들여야 한다) = 받아들여야 한다.","글쓴이는 공간이 모든 경험의 매개체라는 생각을 받아들이자고 말한다."]},{"t":"pair","h":"쉬운 예시","x":[["You must wear a helmet.","너는 헬멧을 써야 한다. (must wear = 써야 한다)"],["She can swim well.","그녀는 수영을 잘할 수 있다. (can swim = 수영할 수 있다)"]]}],"post":["must(~해야 한다) + 동사원형: must accept(받아들여야 한다)"]},{"slots":[["created","","","공간이 소설 속에 만들어진 것이라 과거분사."],["themselves","them","a","주어 Beings(존재들)가 자기 자신을 둘러싼다. 주어와 목적어가 같은 대상이면 재귀대명사."],["where","","","장소 the places(장소들) + 완전한 문장이라 where(그곳에서)."],["oneself","","","주어 one(사람) 자신이라 oneself(자기 자신)."],["would","","","Without places(장소가 없다면)라는 가정이라 would be(~일 것이다)."]],"opts":["they","their","itself","themselves"],"or":["they(그들은, 주격): surround(둘러싸다)의 목적어 자리라 주격은 못 옴","their(그들의, 소유격): 뒤에 명사 없이 소유격만 목적어로 쓸 수 없음","itself(그것 자체를, 단수 재귀대명사): 주어 Beings(존재들)가 복수라 단수 itself와 맞지 않음","themselves(그들 자신을, 재귀대명사): 주어 Beings(존재들)와 목적어가 같은 대상이라 맞음"],"point":"대명사의 성·수·격 일치(재귀대명사)","en":"Beings surround themselves with the places where they find themselves, the way one wraps oneself up in a garment.","ko":"존재들은 자신이 놓여 있는 장소로 스스로를 둘러싼다. 마치 사람이 옷으로 자기 몸을 감싸듯이.","hl":["Beings surround themselves","wraps oneself up"],"khl":["존재들은","스스로를 둘러싼다"],"blocks":[{"t":"p","h":"거울 보기","x":["존재들이 둘러싸는 대상은 존재들 자신이다.","거울 속 자기를 가리킬 땐 -self(자신), -selves(자신들).","them(그들을)을 쓰면 다른 사람들을 둘러싼다는 뜻이 된다.","뒤의 one wraps oneself(사람이 자기 몸을 감싸다)도 같은 거울 구조다."]},{"t":"pair","h":"쉬운 예시","x":[["They introduced themselves.","그들은 자기소개를 했다. (They(그들) = themselves(그들 자신))"],["She wrapped herself in a blanket.","그녀는 담요로 몸을 감쌌다. (She(그녀) = herself(그녀 자신))"]]}],"post":["주어 = 목적어면 -selves: Beings surround themselves(존재들은 스스로를 둘러싼다)"]}],"qui
