enges ...","of(~의) 뒤의 세 단어는 무엇의 뒤얽힘인지 알려 주는 꼬리표다.","주인은 intertwining(뒤얽힘) 하나.","꼬리표에 단어가 셋이나 있어도 속으면 안 된다.","intertwining(뒤얽힘)은 -ing지만 여기서는 This(이)가 붙은 명사다."]},{"t":"pair","h":"쉬운 예시","x":[["The box of apples is heavy.","사과 상자는 무겁다. (주인 The box → is)"],["The mixing of red and blue makes purple.","빨강과 파랑을 섞으면 보라가 된다. (주인 The mixing → makes)"]]}],"post":["of(~의) 꼬리표 떼고 주인 This intertwining(이 뒤얽힘) 보기 → challenges(이의를 제기한다)"]},{"no":"33","slots":[["elegantly","","","made(표현했다)를 꾸미는 부사."],["writing","","","made(표현했다) 뒤 콤마로 덧붙인 분사구문."],["created","creating","a","공간 the space(그 공간)는 스스로 만드는 쪽이 아니라 소설 속에서 \"만들어진\" 쪽이다. 당하는 쪽이면 과거분사."],["find","","","주어 they(그들, 복수), 현재형 find(발견하다)."],["that3","","","a garment(옷) 뒤 주어 빠진 관계절."]],"opts":["creates","created","create","to creating"],"or":["creates(만든다, 3인칭 단수 현재형): made(표현했다)가 이미 진짜 동사라 접속사 없이 동사가 또 올 수 없음","created(만들어진, create의 과거분사): 공간은 소설 속에서 만들어진 쪽이라 수동 p.p.가 맞음","create(만들다, 동사원형): 명사 the space(그 공간) 뒤에서 꾸밀 수 없고 동사 자리도 아님","to creating(만드는 것에): to + -ing는 명사를 뒤에서 꾸미는 형태가 아님"],"point":"능동 v-ing vs. 수동 p.p.","en":"Belgian literary critic Georges Poulet made the point elegantly, writing of the space created in Marcel Proust’s great novel In Search of Lost Time.","ko":"벨기에 문학 비평가 조르주 풀레는 마르셀 프루스트의 위대한 소설 『잃어버린 시간을 찾아서』 속에 만들어진 공간에 대해 쓰면서 이 점을 멋지게 표현했다.","hl":["the space created","in Marcel Proust’s great novel"],"khl":["만들어진 공간","프루스트의 위대한 소설"],"blocks":[{"t":"p","h":"누가 만들었나","x":["공간을 만든 건 작가 프루스트다.","공간은 만들어진 쪽, 당하는 쪽이다.","당하는 쪽이 명사 뒤에서 꾸밀 땐 과거분사 created(만들어진).","the space created in the novel(소설 속에 만들어진 공간) = 소설 속에 만들어진 공간.","creating(만드는)을 쓰면 공간이 무언가를 만든다는 엉뚱한 뜻이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["I read a book written by my uncle.","나는 삼촌이 쓴 책을 읽었다. (책은 쓰인 쪽 → written)"],["Look at the boy running in the park.","공원에서 달리는 소년을 봐. (소년이 달리는 쪽 → running)"]]}],"post":["만들어진 쪽은 p.p.: the space created(만들어진 공간)"]}],"compquiz":[{"s":"The color of the leaves ___ beautiful.","o":["are","is"],"a":1,"ko":"그 나뭇잎들의 색깔은 아름답다.","why":"주인은 The color(그 색깔), 단수.","wy":"are(~이다): 주인은 The color(그 색깔, 단수)이고 of the leaves(나뭇잎들의)는 꼬리표라 복수 are는 안 맞음"},{"s":"I have a car ___ in Germany.","o":["made","making"],"a":0,"ko":"나는 독일에서 만들어진 차를 가지고 있다.","why":"차는 만들어진 쪽이라 p.p.","wy":"making(만드는): 차가 무언가를 만든다는 뜻이 되어 버림"}]},{"id":"2610g1-34","no":"34","title":"어법특훈 · 26년 10월 고1 34번","sub":"다 몰라도 쓸모 있는 모델","tpl":"No matter {how1|how} you choose {delineate|to delineate} your evolutionary system of interest — let’s say it’s cell phones — there will be some things {that1|that} your model just {needs|needs} to take as a given, such as the fact {that2|that} new ideas {emerge|emerge} at particular times. Indeed, all models must make simplifying assumptions of this nature. When Wallace and Darwin {presented|presented} their verbal model of biological evolution, there {was|was} little knowledge of {how2|how} variation generation and inheritance {worked|worked}. They just {took|took} as a given that these things happened somehow. Even at the finest level of detail, we {need|need} simplifying assumptions. Physicists, for example, must take as a given the mass and charge of fundamental particles. In a model of atomic bonds, physicists don’t attempt to explain why electrons have {their|their} particular mass and charge, they just accept the {measured|measured} values and {move|move} on. The key point {is|is} {that3|that} we can build {useful|useful} models at one level of analysis without a complete accounting of {what|what}’s happening at all other levels.","fn":["*delineate: 윤곽을 정하다, 규정하다","*variation: 변이","*inheritance: 유전"],"mean":{"to delineate":"규정하는 것, 범위를 정하는 것(delineate의 to부정사)","delineate":"규정하다, (범위를) 정하다(동사원형)","delineated":"규정했다, 규정된(delineate의 과거형·과거분사형)","delineating":"규정하는 것, 규정하는(delineate의 -ing형)","to delineating":"규정하는 것에(to + delineate의 -ing형)","that":"~하는(관계대명사) / ~라는, ~라는 것(접속사)","what":"~하는 것(관계대명사), 무엇(의문사)","which":"~하는(관계대명사, 사물 선행사)","whom":"~하는 (사람)을(목적격 관계대명사), 누구를","whomever":"누구든 ~하는 사람을","whose" other medium.","ko":"모든 소리는 어떤 종류의 움직임, 즉 공기, 물, 강철, 나무 또는 다른 매질 속의 분자를 흔드는 무언가에서 시작된다.","hl":["something that disturbs"],"khl":["분자를 흔드는 무언가"],"blocks":[{"t":"p","h":"자리가 이미 찼다","x":["what은 혼자서 \"~하는 것\"이라는 명사 역할까지 한다.","그런데 앞에 something(어떤 것)이 이미 있다.","something what(틀린 모양)이면 \"어떤 것 ~하는 것\"이 되어 명사가 둘.","명사를 뒤에서 꾸며 주는 건 that(~하는)이나 which(~하는)의 일이다.","that(~하는) 뒤는 주어가 빠진 disturbs molecules(분자를 흩뜨리다). that이 주어 역할을 한다."]},{"t":"pair","h":"쉬운 예시","x":[["I want something that is sweet.","나는 달콤한 무언가를 원한다. (something(무언가) + that(~하는))"],["What I want is something sweet.","내가 원하는 것은 달콤한 무언가다. (앞에 명사 없이 What)"]]}],"post":["명사 something(어떤 것) 뒤에는 that(~하는): something that disturbs(흩뜨리는 어떤 것)"]},{"slots":[["disturbs","","","선행사 something(어떤 것)이 단수라 disturbs(흩뜨리다, disturb의 3인칭 단수형)."],["noted","noting","a","주어 Isaac Newton(아이작 뉴턴)의 진짜 동사가 필요한 자리다. noting(언급하는 것, note의 -ing형)으로 바꾸면 문장에 동사가 없다."],["that2","","","noted(언급하다, note의 과거형)의 목적어 문장을 이끄는 that(~라는 것)."],["colorless","","","are(~이다) 뒤 보어 자리 형용사."],["occurs","","","주어 the perception(지각)이 단수라 occurs(일어나다, occur의 3인칭 단수형)."]],"opts":["to note","having noted","noted","been noted"],"or":["to note(언급하는 것, to부정사): 동사 옷을 벗은 모양이라 문장에 진짜 동사가 없어짐.","having noted(언급했으므로, 완료 -ing형): -ing 모양이라 진짜 동사가 못 됨.","noted(언급하다, note의 과거형): 주어 Isaac Newton(아이작 뉴턴)의 진짜 동사 자리이고 지나간 일이라 맞음.","been noted(언급된, be의 과거분사 + 과거분사): have(완료) 없이 혼자 못 쓰고, 뉴턴이 직접 말한 능동 뜻과도 안 맞음."],"point":"정동사 vs. 준동사","en":"Isaac Newton noted that light waves are colorless; the perception of color only occurs in the brain of a living organism.","ko":"아이작 뉴턴은 빛의 파동에는 색이 없으며, 색의 지각은 살아 있는 생물의 뇌에서만 일어난다고 언급했다.","hl":["Isaac Newton noted that"],"khl":["아이작 뉴턴은","언급했다"],"blocks":[{"t":"p","h":"주어가 있으면 동사도 있어야","x":["문장마다 주어와 진짜 동사가 한 쌍씩 있어야 한다.","주어: Isaac Newton(아이작 뉴턴). 진짜 동사: noted(언급했다).","that(~라는 것) 뒤의 are(~이다)는 that 문장 안의 동사라 바깥 문장 몫이 아니다.","noting(언급하는 것, note의 -ing형)이나 to note(언급하는 것, to부정사)는 동사 옷을 벗은 모양이라 진짜 동사가 못 된다."]},{"t":"pair","h":"쉬운 예시","x":[["My teacher said sked} a group of college students {how|how} certain they were {that|that} sixty general-knowledge trivia-like statements {were|were} either true or false. The students {were_asked|were asked} to {evaluate|evaluate} the sixty statements three times, at two-week intervals. {crucially|Crucially}, only twenty of the statements {were_repeated|were repeated} each time; the other forty were new. The researchers then compared the ‘truth-ratings’ of the {repeated|repeated} versus non-repeated statements. {what|What} they found {was|was} {astonishing|astonishing}. {regardless|Regardless} of {whether|whether} the statement was true or false, belief in the truth of the claim {went|went} up as a function of repetition. In other words, the more {often|often} you hear a statement, the {more|more} ‘{true|true}’ it {sounds|sounds}. This became {known|known} as the illusory truth effect.","fn":[],"mean":{"asked":"물었다(ask의 과거형)","asking":"묻는(ask의 -ing형)","to ask":"묻는 것(to부정사)","having asked":"물었던 것(완료 -ing형)","asks":"묻다(ask의 3인칭 단수 현재형)","how":"얼마나(의문사)","that":"~라는 것(접속사)","what":"~하는 것(관계대명사, the thing which)","What":"~하는 것(관계대명사, the thing which)","That":"~라는 것(접속사)","Which":"어느 것(의문사/관계대명사)","which":"어느 것(의문사/관계대명사)","Whom":"누구를(의문사/관계대명사 목적격)","whom":"~하는 (사람)을(관계대명사 목적격)","It":"그것(대명사)","were":"~였다(be의 복수 과거형)","was":"~였다(be의 단수 과거형)","is":"~이다(be의 3인칭 단수 현재형)","being":"~인 것, ~인 상태(be의 -ing형)","to be":"~이 되는 것, ~인 것(to부정사)","were asked":"요청받았다(be asked의 과거, 수동)","evaluate":"평가하다(원형)","evaluating":"평가하는(evaluate의 -ing형)","evaluated":"평가했다; 평가된(evaluate의 과거형/p.p.)","evaluates":"평가하다(evaluate의 3인칭 단수 현재형)","evaluation":"평가(명사)","Crucially":"결정적으로(부사)","were repeated":"반복되었다(be repeated의 과거, 수동)","repeated":"반복된(repeat의 p.p.)","astonishing":"놀라운(astonish의 -ing형, 형용사)","astonished":"놀란(astonish의 p.p., 형용사)","astonish":"놀라게 하다(원형)","astonishes":"놀라게 하다(astonish의 3인칭 단수 현재형)","astonishingly":"놀랍게도(부사)","Regardless":"상관없이(regardless of: ~와 상관없이)","whether":"~인지 (아닌지)(접속사)","if":"~인지; 만약 "asked"],"khl":["심리학자","물었다"],"blocks":[{"t":"p","h":"진짜 동사 찾기","x":["문장에는 진짜 동사가 꼭 하나 있어야 한다.","주인: psychologists Lynn Hasher and David Goldstein(심리학자 두 명, Lynn Hasher와 David Goldstein).","이 사람들이 \"물었다\". 그 자리가 asked(물었다, ask의 과거형).","asking(묻는, ask의 -ing형)으로 바꾸면 \"묻고 있는\"이 되어 문장에 동사가 사라진다.","뒤의 were(~였다, be의 복수 과거형)는 how(얼마나), that(~라는 것, 접속사) 안에 들어간 작은 문장의 동사다. 큰 문장의 동사가 아니다."]},{"t":"pair","h":"쉬운 예시","x":[["My sister asked me a question.","언니는 나에게 질문을 했다. (주어 My sister(언니) → 동사 asked(물었다))"],["The boy reading a book is my friend.","책을 읽고 있는 소년은 내 친구다. (reading(읽고 있는)은 꾸밈, 진짜 동사는 is(~이다))"]]}],"post":["주어(psychologists = 심리학자들) 뒤 진짜 동사 자리: asked(물었다, ask의 과거형)"]},{"slots":[["repeated","","","\"반복된\" 문장. statements(문장들)를 꾸미는 p.p."],["what","That","a","found(발견했다) 뒤에 목적어가 빠져 있다. 빠진 걸 품고 \"~한 것\"이 되는 건 What(~하는 것, 관계대명사)."],["was","","","What(~하는 것, 관계대명사) 덩어리(그들이 발견한 것)는 하나라 단수 was(~였다, be의 단수 과거형)."],["whether","","","전치사 of(~의) 뒤에는 if(~인지) 대신 whether(~인지 (아닌지))가 온다."],["went","","","주어 belief(믿음)의 진짜 동사 자리라 went(갔다, go의 과거형)."]],"opts":["What","Which","Whom","It"],"or":["What(~하는 것): found(발견했다)의 목적어가 빠진 문장을 이끌어 '그들이 발견한 것'이라는 주어가 됨","Which(어느 것): '어느 것을 발견했는지'가 되어 고를 대상이 없고, 관계사로 쓰려면 앞에 명사가 있어야 함","Whom(누구를): 사람을 가리키는데 발견한 것은 사람이 아니라 실험 결과임","It(그것): It they found was ~(틀린 문장)는 주어 뒤에 또 주어·동사가 붙어 문장이 성립하지 않음"],"point":"that vs. what","en":"What they found was astonishing.","ko":"그들이 발견한 것은 놀라웠다.","hl":["What they found","was"],"khl":["그들이 발견한 것은","놀라웠다"],"blocks":[{"t":"p","h":"빈자리 찾기","x":["find(발견하다)는 \"무엇을\" 발견했는지가 꼭 필요한 동사다.","they found(그들이 발견했다) ___ : 무엇을? 이 자리가 비어 있다.","빈자리를 품고 \"~한 것\"으로 묶어 주는 말이 what(~하는 것).","That(~라는 것, 접속사)은 빈자리 없는 완전한 문장 앞에만 온다.","그래서 What they found = 그들이 발견한 것."]},{"t":"pair","h":"쉬운 예시","x":[["What I want is a new bike.","내가 원하는 것은 새 자전거다. (want(원하다) 뒤 목적어 빠짐 → What)"],["I know that he is honest.","나는 그가 정직하다는 것을 안다. (뒤 문장 완전 → that)"]]},{"t":"tap","h":"확인 질문","q":"they found(그들이 발견했다) 뒤에 빠진 것이 있는가?","a":["있다. found(발견했다, find의 과거형)의 목적어(무엇을)가 빠졌다.","빠진 게 있으면 what(~하는 것), 없으면 that(~라는 것, 접속사)."]}],"post":["빠진 목적어 품는 What: What they found = 그들이 발견한 것"]},{"slots":[["what","","","found(발견했다, find의 과거형)의 목적어가 빠져 있어 What(~하는 것, 관계대명사)이 맞다."],["was","","","What(~하는 것, 관계대명사) 덩어리는 단수 취급이라 was(~였다, be의 단수 과거형)."],["astonishing","astonished","a","주인은 \"그들이 발견한 것(실험 결과)\". 결과가 놀라움을 주는 쪽이라 -ing."],["often","","","동사 hear(듣다)를 꾸미는 부사. the more often = 더 자주."],["known","","","become known as: ~로 알려지다. 알려지는 쪽이라 p.p."]],"opts":["astonish","astonishes","astonishingly","astonishing"],"or":["astonish(놀라게 하다, 원형): was(~였다, be의 단수 과거형) 뒤 보어 자리에 동사원형이 올 수 없음","astonishes(놀라게 하다의 3인칭 단수형): was(~였다, be의 단수 과거형)가 이미 동사라 동사를 또 쓸 수 없음","astonishingly(놀랍게도, 부사): be동사 뒤 보어 자리에는 형용사가 와야 함","astonishing(놀라운, astonish의 -ing형): 결과가 사람들을 놀라게 하는 쪽이라 -ing"],"point":"능동 v-ing vs. 수동 p.p.","en":"What they found was astonishing.","ko":"그들이 발견한 것은 놀라웠다.","hl":["astonishing","What they found"],"khl":["놀라웠다","그들이 발견한 것은"],"blocks":[{"t":"p","h":"누가 누구를 놀라게 하나","x":["-ing: 놀라움을 \"주는\" 쪽. astonishing(놀라운)","-ed: 놀라움을 \"느끼는\" 쪽. astonished(놀란)","여기 주인은 사람이 아니라 \"그들이 발견한 것\", 즉 실험 결과다.","결과가 사람들을 놀라게 했으니 astonishing(놀라운, astonish의 -ing형).","astonished(놀란, astonish의 p.p.)를 쓰면 결과가 놀람을 느꼈다는 말이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["The ending of the movie was surprising.","그 영화의 결말은 놀라웠다. (결말이 놀라움을 줌)"],["We were surprised at the ending.","우리는 그 결말에 놀랐다. (우리가 놀라움을 느낌)"]]}],"post":["결과가 놀라움을 주면 -ing: What they found was astonishing(그들이 발견한 것은 놀라웠다)"]},{"slots":[["asked","","","주어 psychologists(심리학자들)의 진짜 동사."],["how","","","how(얼마나) + 형용사 certain: 얼마나 확신하는지."],["that","","","certain that(~라고 확신하는) + 완전한 문장."],["were","was","a","that(~라는 것, 접속사) 뒤 문장의 주인은 statements(문장들), 복수다. 앞에 붙은 꾸밈말에 속으면 안 된다."],["were_asked","","","학생들이 평가하라는 \"요청을 받은\" 쪽이라 수동태 were asked(요청받았다)."]],"opts":["is","were","being","to be"],"or":["is(~이다, be의 3인칭 단수 현재형): 주어가 복수이고 시제도 과거여야 해서 맞지 않음","were(~였다, be의 복수 과거형): that(~라는 것, 접속사)절 주어 statements(문장들)가 복수이고 과거 일이라 were","being(~인 것, be의 -ing형): -ing형은 that(~라는 것, 접속사)절의 동사 자리에 못 옴","to be(~이 되는 것): to부정사는 that(~라는 것, 접속사)절의 동사 자리에 못 옴"],"point":"수식받는 주어의 수일치","en":"In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false.","ko":"1977년, 심리학자 Lynn Hasher와 David Goldstein은 한 무리의 대학생들에게 상식 퀴즈 같은 문장 60개가 참인지 거짓인지 얼마나 확신하는지 물었다.","hl":["statements were either true or false"],"khl":["문장 60개가","참인지 거짓인지"],"blocks":[{"t":"p","h":"앞에 붙은 꾸밈말 떼기","x":["sixty general-knowledge trivia-like statements(60개의 일반 상식 퀴즈 같은 문장들).","sixty(60개의), general-knowledge(일반 상식의), trivia-like(퀴즈 같은)는 모두 꾸밈말이다.","꾸밈말을 다 떼면 주인 statements(문장들)만 남는다.","statements(문장들)는 -s로 끝나는 복수. 그래서 was(~였다, be의 단수 과거형)가 아니라 were(~였다, be의 복수 과거형).","sixty(60개)라는 숫자만 봐도 여럿이다."]},{"t":"pair","h":"쉬운 예시","x":[["Many small red apples were on the table.","작고 빨간 사과 여러 개가 탁자 위에 있었다. (주인 apples(사과들) → were(있었다))"],["The old wooden box was heavy.","그 낡은 나무 상자는 무거웠다. (주인 box(상자) → was(~였다))"]]}],"post":["꾸밈말 떼고 주인(statements = 문장들) 보고: statements were(문장들이 ~였다)"]},{"slots":[["regardless","","","regardless of: ~와 상관없이. 한 덩어리로 쓴다."],["whether","","","전치사 of(~의) 뒤에는 whether(~인지 (아닌지))."],["often","","","동사 hear(듣다)를 꾸미는 부사. the more often = 더 자주."],["true","truly","a","sound(~하게 들리다) 뒤에는 상태를 말하는 형용사가 온다. 부사는 못 온다."],["sounds","","","주어 it(그것)이 단수라 sounds(~하게 들리다, sound의 3인칭 단수형)."]],"opts":["truthfully","truer","true","truest"],"or":["truthfully(진실하게, 부사): sound(~하게 들리다) 뒤 보어 자리에 부사는 못 옴","truer(더 참인, 비교급): 앞에 more(더)가 있어 비교급이 겹침","true(참인): sound(~하게 들리다) 뒤 보어 자리라 형용사이고, 앞의 more(더)가 이미 비교급을 만듦","truest(가장 참인, 최상급): the more(더 ~할수록) ~, the more ~ 비교 구문에 최상급은 맞지 않음"],"point":"형용사 자리 vs. 부사 자리","en":"In other words, the more often you hear a statement, the more ‘true’ it sounds.","ko":"다시 말해, 어떤 문장을 더 자주 들을수록 그것은 더 ‘참’처럼 들린다.","hl":["‘true’","it sounds"],"khl":["‘참’처럼","들린다"],"blocks":[{"t":"p","h":"감각동사 뒤는 형용사","x":["sound(들리다), look(보이다), feel(느껴지다), taste(맛이 나다), smell(냄새가 나다).","이 동사들 뒤에는 \"어떤 상태인지\"를 말하는 형용사가 온다.","it sounds true: 그것이 참처럼 들린다.","이 문장은 순서만 바뀌었다. it sounds more true(그것이 더 참처럼 들린다) → the more true it sounds(어순만 바꾼 같은 말).","우리말 \"참처럼\"에 끌려 부사 truly(정말로)를 쓰면 틀린다."]},{"t":"pair","h":"쉬운 예시","x":[["That sounds great!","그거 좋은 생각 같아! (sounds(~하게 들리다) + 형용사 great(좋은))"],["This soup tastes salty.","이 수프는 짠맛이 난다. (tastes(~한 맛이 나다) + 형용사 salty(짠))"]]}],"post":["sound(~하게 들리다) + 형용사: it sounds true(그것이 참처럼 들린다) (truly(진정으로)는 X)"]}],"quiz":[{"s":"My parents ___ me a nice present yesterday.","o":["giving","gave"],"a":1,"ko":"부모님은 어제 나에게 멋진 선물을 주셨다.","why":"주어 My parents(부모님) 뒤 진짜 동사 자리.","wy":"giving(주는): -ing형은 동사 자리에 못 와 문장에 동사가 없어짐"},{"s":"___ you need is some sleep.","o":["That","What"],"a":1,"ko":"네게 필요한 것은 잠이다.","why":"need(필요하다) 뒤 목적어가 빠져 있으니 What.","wy":"That(~라는 것): 완전한 문장 앞에만 오는데 need(필요하다) 뒤 목적어가 빠져 있음"},{"s":"The game was really ___.","o":["exciting","excited"],"a":0,"ko":"그 경기는 정말 흥미진진했다.","why":"경기가 신나는 기분을 주니 -ing.","wy":"excited(신이 난, excite의 p.p.): 경기가 신나는 기분을 느끼는 게 아니라 주는 쪽임"},{"s":"Two little black puppies ___ sleeping on the bed.","o":["was","were"],"a":1,"ko":"작고 까만 강아지 두 마리가 침대에서 자고 있었다.","why":"꾸밈말 떼면 주인은 puppies(복수).","wy":"was(~였다, 단수): 주인 puppies(강아지들)가 복수라 맞지 않음"},{"s":"Your idea sounds ___.","o":["wonderfully","wonderful"],"a":1,"ko":"네 생각은 멋지게 들린다.","why":"sound(~하게 들리다) 뒤에는 형용사.","wy":"wonderfully(멋지게, 부사): sound(~하게 들리다) 뒤 보어 자리에 부사는 못 옴"}]},{"items":[{"slots":[["astonishing","","","결과가 놀라움을 주는 쪽이라 -ing."],["regardless","","","regardless of: ~와 상관없이."],["whether","","","전치사 of(~의) 뒤에는 whether(~인지 (아닌지))."],["went","going","a","주어 belief(믿음)의 진짜 동사 자리. going(가는, go의 -ing형)이면 문장에 동사가 없다."],["often","","","동사 hear(듣다)를 꾸미는 부사."]],"opts":["gone","to go","went","having gone"],"or":["gone(간, go의 p.p.): have(완료)나 be(수동) 없이 p.p.만으로는 동사가 될 수 없음","to go(가는 것): to부정사는 동사 자리에 못 옴","went(갔다, go의 과거형): 주어 belief(믿음)의 진짜 동사이고 실험 결과라 과거형, went up(올라갔다)","having gone(가 버린 것): -ing형은 동사 자리에 못 옴"],"point":"정동사 vs. 준동사","en":"Regardless of whether the statement was true or false, belief in the truth of the claim went up as a function of repetition.","ko":"그 문장이 참이든 거짓이든 상관없이, 그 주장이 참이라는 믿음은 반복에 따라 올라갔다.","hl":["belief","went up"],"khl":["믿음은","올라갔다"],"blocks":[{"t":"p","h":"콤마 앞은 곁가지","x":["Regardless of whether(~인지와 상관없이) ... false(거짓의), 까지는 \"~와 상관없이\"라는 곁가지다.","whether(~인지 (아닌지)) 덩어리 안의 was(~였다, be의 단수 과거형)는 곁가지 속 동사다.","콤마 뒤가 진짜 문장. 주인은 belief(믿음).","in the truth of the claim(그 주장이 참이라는 것에 대한)은 belief(믿음)에 붙은 꼬리표.","주인 belief(믿음) 뒤에는 진짜 동사가 꼭 필요하다. 그래서 went(갔다, go의 과거형)."]},{"t":"pair","h":"쉬운 예시","x":[["After the rain stopped, the children ran outside.","비가 그친 뒤에 아이들은 밖으로 뛰어나갔다. (곁가지 속 stopped(그쳤다), 진짜 동사 ran(달렸다))"]]}],"post":["곁가지(Regardless of(~와 상관없이) ...) 뒤 주인(belief = 믿음) + 진짜 동사 went(갔다, go의 과거형)"]},{"slots":[["asked","","","주어 psychologists(심리학자들)의 진짜 동사."],["how","","","how(얼마나) + 형용사 certain(확신하는)."],["that","what","a","certain(확신하는) 뒤에서 \"~라고\"를 이끄는 자리. 뒤 문장이 완전하니 that(~라는 것, 접속사)."],["were","","","주어 statements(문장들)가 복수라 were(~였다, be의 복수 과거형)."],["were_asked","","","학생들이 요청을 받은 쪽이라 수동태."]],"opts":["whom","them","that","itself"],"or":["whom(~하는 (사람)을, 관계대명사): 사람 선행사 뒤 목적어가 빠진 자리용인데 뒤 문장은 완전함","them(그들을): 대명사라 뒤의 문장을 이끌 수 없음","that(~라는 것, 접속사): certain(확신하는) 뒤에서 빠진 것 없는 완전한 문장(statements were true or false = 문장들이 참인지 거짓인지)을 이끔","itself(그것 자체): 재귀대명사라 절을 이끌 수 없음"],"point":"that vs. what","en":"In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false.","ko":"1977년, 심리학자 Lynn Hasher와 David Goldstein은 한 무리의 대학생들에게 상식 퀴즈 같은 문장 60개가 참인지 거짓인지 얼마나 확신하는지 물었다.","hl":["how certain they were that","were either true or false"],"khl":["얼마나 확신하는지","참인지 거짓인지"],"blocks":[{"t":"p","h":"뒤 문장 검사하기","x":["that(~라는 것, 접속사) 뒤: sixty(60개의) ... statements were either true or false(문장들이 참이거나 거짓이었다 perspective, many of these patterns {encourage|encourage} overconsumption of data and attention. Infinite scroll keeps {loading|loading} new content whether the user wants it or not, {increasing|increasing} data usage and device processing. Autoplay forces media {to_load|to load} and play even for people {who|who} may never watch it. These choices consume more energy on both the user’s device and the servers {delivering|delivering} the content. Take the decision by a popular music streaming platform to replace static album artwork with short video loops by default. This change {significantly|significantly} increases data usage and battery consumption, while the option to disable it {is_buried|is buried} deep in the settings. As a result, most users consume more resources unless they {actively|actively} search for a way to opt out.\nIt is important to acknowledge {that|that} web design always nudges behavior in some way. Showing consequences and highlighting options {are|are} all forms of influence. The ethical line is not whether nudging exists, but whether it is transparent, reversible, and {aligned|aligned} with the user’s interests. In many cases, the most responsible approach is {to_make|to make} the lower-impact option the default, while {keeping|keeping} alternatives {clearly|clearly} available. Defaults are powerful, and when {chosen|chosen} carefully, they can reduce environmental impact without {removing|removing} user agency.","fn":["*sustainability: 지속 가능성","*opt out: (설정·참여에서) 빠져나가다, 거부하다","*agency: (스스로 정하는) 주체성, 선택권"],"mean":{"autoplaying":"자동 재생되는(autoplay의 -ing형)","requiring":"요구하는 것(require의 -ing형, 동명사)","interfere":"방해하다(interfere with = ~을 방해하다). 복수 주어의 현재형","interferes":"방해하다(interfere)의 3인칭 단수 현재형","interfering":"방해하는 / 방해하는 것(interfere의 -ing형)","to interfere":"방해하는 것 / 방해하기 위해(interfere의 to부정사)","has interfered":"방해해 왔다(interfere의 현재완료, 단수 주어용)","encourage":"부추기다, 장려하다. 복수 주어의 현재형","loading":"불러오는 것(load의 -ing형)","load":"불러오다(동사원형)","loaded":"불러왔다 / 불러와진(load의 과거형·과거분사)","loads":"불러오다(load)의 3인칭 단수 현재형","to load":"불러오는 것 / 불러오도록(load의 to부정사)","to loading":"틀린 형태(to부정사의 to 뒤에 -ing가 붙음)","increasing":"늘리면서, 늘리는(increase의 -ing형)","increase":"늘리다(동사원형)","increases":"늘리다(increase)의 3인칭 단수 현재형","to increasing":"틀린 형태(to부정사의 to 뒤에 -ing가 붙음)","has increased":"늘려 왔다(increase의 현재완료, 단수 주어용)","who":"~하는 (사람)(주격 관계대명사)","whom":"~하는 (사람을)(목적격 관계대명사)","whose":"~의, 그 사람의(소유격 관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","where":"~하는 (곳)(장소를 받는 관계부사)","delivering":"전달하는(deliver의 -ing형, 능동)","deliver":"전달하다(동사원형)","delivers":"전달하다(deliver)의 3인칭 단수 현재형","delivered":"전달했다 / 전달된(deliver의 과거형·과거분사)","to delivering":"틀린 형태(to부정사의 to 뒤에 -ing가 붙음)","significantly":"상당히, 크게(부사)","is buried":"묻혀 있다(bury의 수동태: be + p.p.)","buries":"묻다(bury)의 3인칭 단수 현재형","burying":"묻는 / 묻는 것(bury의 -ing형)","to bury":"묻는 것 / 묻기 위해(bury의 to부정사)","have buried":"묻어 왔다(bury의 현재완료, 복수 주어용)","actively":"적극적으로(부사)","active":"적극적인, 활발한(형용사)","activity":"활동(명사)","activeness":"적극성(명사)","more active":"더 적극적인(형용사 active의 비교급)","that":"~라는 것(명사절을 이끄는 접속사)","it":"그것(대명사, 단수)","them":"그것들을, 그들을(대명사 they의 목적격)","are":"~이다(be동사의 복수 현재형)","is":"~이다(be동사의 3인칭 단수 현재형)","being":"~인 것, ~인 상태(be의 -ing형)","to be":"~인 것, ~이 되도록(be의 to부정사)","be":"~이다(be동사의 동사원형)","has been":"~이어 왔다(be의 현재완료, 단수 주어용)","aligned":"맞춰진(align의 과거분사, 형용사 역할)","align":"맞추다, 일치시키다(동사원형)","alignment":"정렬, 일치(명사)","to aligning":"틀린 형태(to부정사의 to 뒤에 -ing가 붙음)","have aligned":"맞춰 왔다(align의 현재완료, 복수 주어용)","to make":"만드는 것(make의 to부정사, 보어 역할)","keeping":"유지하면서(keep의 -ing형)","clearly":"분명히(부사)","chosen":"선택된(choose의 과거분사)","removing":"없애는 것(remove의 -ing형, 동명사)","remove":"없애다(동사원형)","removed":"없앴다 / 없애진(remove의 과거형·과거분사)","removes":"없애다(remove)의 3인칭 단수 현재형","to remove":"없애는 것 / 없애기 위해(remove의 to부정사)","singing":"노래하는 것(sing의 -ing형)","to sing":"노래하는 것(sing의 to부정사)","letting":"들어오게 하면서(let의 -ing형)","lets":"~하게 하다, 허락하다(let)의 3인칭 단수 현재형","sleeping":"자고 있는(sleep의 -ing형)","slept":"잤다 / 잠잔(sleep의 과거형·과거분사)","speaks":"말하다(speak)의 3인칭 단수 현재형","is spoken":"말해진다, 쓰인다(speak의 수동태: be + p.p.)","delicious":"맛있는(형용사)","deliciously":"맛있게(부사)","wear":"입다(동사원형)","wearing":"입는 것(wear의 -ing형, 동명사)"},"sets":[{"items":[{"slots":[["autoplaying","","","videos(영상)가 스스로 자동 재생하는 쪽이라 -ing."],["requiring","","","infinite scroll(무한 스크롤), autoplaying videos(자동 재생 영상)와 나란히 such as(~ 같은) 뒤에 놓인 명사 자리. 동명사 requiring(요구하는 것)."],["interfere","interferes","a","주어는 Patterns(패턴들), 복수다. such as(~ 같은)부터 purchase(구매)까지는 예시를 든 꼬리표, all(모두)도 복수라는 힌트."],["encourage","","","many of these patterns(이 패턴들 중 다수)가 복수라 encourage(부추기다)."],["loading","","","keep(계속하다) 뒤에는 -ing."]],"opts":["interfere","interfering","to interfere","has interfered"],"or":["interfere(방해하다): 주어 Patterns(패턴들)가 복수라 복수 현재형 동사 그대로가 맞음.","interfering(방해하는): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐.","to interfere(방해하는 것): to부정사도 동사 자리에 못 와서 문장의 동사가 사라짐.","has interfered(방해해 왔다, 현재완료): 현재완료의 has(have의 3인칭 단수형)는 단수 주어용이라 복수 Patterns(패턴들)와 수가 안 맞음."],"point":"수식받는 주어의 수일치","en":"Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all interfere with the user’s control over their own experience.","ko":"무한 스크롤, 자동 재생 영상, 또는 그저 물건 하나 사는 데 계정을 요구하는 것 같은 패턴들은 모두 자기 경험에 대한 사용자의 통제를 방해한다.","hl":["Patterns","all interfere"],"khl":["패턴들은","방해한다"],"blocks":[{"t":"p","h":"긴 꼬리표 건너뛰기","x":["이 문장의 주인은 맨 앞 Patterns(패턴들).","such as(~ 같은) 뒤로 예시 세 개가 길게 붙었다.","예시가 길어도 전부 꼬리표다.","마지막 예시 속 a purchase(구매)가 단수라도 속으면 안 된다.","주인이 복수라 interfere(방해하다). all(모두)도 복수라는 힌트."]},{"t":"pair","h":"쉬운 예시","x":[["Fruits such as apples and bananas are healthy.","사과와 바나나 같은 과일은 건강에 좋다. (주인 Fruits(과일들) → are(~이다))"],["Sports like soccer make me happy.","축구 같은 운동은 나를 행복하게 한다. (주인 Sports(운동들) → make(만들다))"]]}],"post":["such as(~ 같은) 꼬리표 건너 주인 Patterns(패턴들) 보고: all interfere(모두 방해하다)"]},{"slots":[["encourage","","","many of these patterns(이 패턴들 중 다수)가 복수라 encourage(부추기다)."],["loading","to load","a","keep(계속하다)은 뒤에 -ing만 받는다. keeps loading(계속 불러온다)."],["increasing","","","앞에 동사 keeps(계속 ~한다)가 있으니 덧붙임은 -ing."],["to_load","","","force(억지로 ~하게 하다) + 목적어 + to부정사."],["who","","","선행사 people(사람들)이고 뒤에 주어가 빠져 who(~하는 사람)."]],"opts":["load","loaded","loads","loading"],"or":["load(불러오다, 동사원형): keeps(계속 ~한다)가 이미 동사라 동사원형을 바로 붙이면 동사가 둘이 됨.","loaded(불러와진, load의 과거분사): keep(계속하다) 뒤 p.p.는 '계속 불러와진' 상태라 뒤 목적어 new content(새 콘텐츠)를 받지 못함.","loads(불러오다 load의 3인칭 단수 현재형): keeps(계속 ~한다) 뒤에 동사를 또 붙인 꼴이라 동사가 둘이 됨.","loading(불러오는 것): keep(계속하다)은 뒤에 -ing를 받아 keeps loading(계속 불러온다)이 맞음."],"point":"동명사 vs. to부정사 목적어","en":"Infinite scroll keeps loading new content whether the user wants it or not","ko":"무한 스크롤은 사용자가 원하든 원하지 않든 새 콘텐츠를 계속 불러온다.","hl":["keeps loading"],"khl":["계속 불러온다"],"blocks":[{"t":"p","h":"-ing를 좋아하는 동사들","x":["keep(계속하다), enjoy(즐기다), finish(끝내다), stop(멈추다), mind(꺼리다), avoid(피하다)는 뒤에 -ing를 데려온다.","그래서 keep loading(계속 불러오다)이 맞는 형태.","to load(불러오는 것)를 쓰면 틀린다.","무한 스크롤이 멈추지 않고 \"계속\" 불러온다는 게 핵심이라 keep(계속하다)이 딱 맞다."]},{"t":"pair","h":"쉬운 예시","x":[["She kept smiling.","그녀는 계속 웃었다. (kept smiling = 계속 웃었다)"],["I finished doing my homework.","나는 숙제하는 것을 끝냈다. (finished doing = 하는 것을 끝냈다)"]]}],"post":["keep(계속하다) + -ing: keeps loading(계속 불러온다)"]},{"slots":[["loading","","","keep(계속하다) + -ing."],["increasing","increases","a","이 문장의 동사는 keeps(계속 ~한다)로 이미 있다. 접속사 없이 동사를 하나 더 붙일 수 없어 -ing로 덧붙인다."],["to_load","","","force(억지로 ~하게 하다) + 목적어 + to부정사."],["who","","","people(사람들)을 받는 주격 관계대명사."],["delivering","","","servers(서버)가 콘텐츠를 직접 전달하는 쪽이라 -ing."]],"opts":["increase","to increasing","increasing","has increased"],"or":["increase(늘리다, 동사원형): 접속사 없이 동사가 하나 더 생겨 문장이 깨짐.","to increasing(틀린 형태): to부정사의 to 뒤에는 동사원형이 와야 해서 to + -ing는 형태부터 틀림.","increasing(늘리면서): 진짜 동사 keeps(계속 ~한다)가 이미 있어 콤마 뒤 덧붙임은 -ing가 맞음.","has increased(늘려 왔다): 이것도 동사라 접속사 없이 keeps(계속 ~한다)와 동사가 둘이 됨."],"point":"정동사 vs. 준동사","en":"Infinite scroll keeps loading new content whether the user wants it or not, increasing data usage and device processing.","ko":"무한 스크롤은 사용자가 원하든 원하지 않든 새 콘텐츠를 계속 불러와, 데이터 사용량과 기기 처리량을 늘린다.","hl":["keeps","increasing"],"khl":["불러와","늘린다"],"blocks":[{"t":"p","h":"동사 개수 세기","x":["접속사 없이 문장 하나에 진짜 동사는 하나.","이 문장의 진짜 동사: keeps(계속 ~한다).","whether the user wants it or not(사용자가 원하든 원하지 않든)은 따로 떨어진 덩어리.","콤마 뒤에 increases(늘리다 increase의 3인칭 단수 현재형)를 쓰면 접속사 없이 동사가 하나 더 생긴다.","그래서 동사 옷을 벗긴 increasing(그래서 ~을 늘리면서)으로 붙인다."]},{"t":"pair","h":"쉬운 예시","x":[["He ran fast, breaking the record.","그는 빨리 달려서 기록을 깼다. (breaking = 덧붙임)"],["The baby cried, waking everyone up.","아기가 울어서 모두를 깨웠다. (waking = 덧붙임)"]]},{"t":"tap","h":"확인 질문","q":"이 문장에서 주인 Infinite scroll(무한 스크롤)의 진짜 동사는 몇 개인가?","a":["keeps(계속 ~한다) 하나.","wants(원하다 want의 3인칭 단수 현재형)는 whether(~든 아니든) 덩어리 안의 동사다."]}],"post":["진짜 동사 keeps(계속 ~한다) 하나면 덧붙임은 -ing: ..., increasing(늘리면서)"]},{"slots":[["increasing","","","keeps(계속 ~한다) 문장에 덧붙인 -ing."],["to_load","loading","a","force(억지로 ~하게 하다)는 목적어 뒤에 to부정사를 데려온다. -ing는 안 된다."],["who","","","people(사람들)을 받는 관계대명사."],["delivering","","","서버가 전달하는 쪽이라 -ing."],["significantly","","","동사 increases(늘리다)를 꾸미는 부사."]],"opts":["to load","load","loads","to loading"],"or":["to load(불러오도록): force(강요하다)는 목적어 뒤에 to부정사를 받아 forces media to load(미디어를 억지로 불러오게 한다)가 맞음.","load(불러오다, 동사원형): 목적어 뒤 동사원형은 make(만들다)·let(허락하다)·have(시키다) 몫이라 force(강요하다)에는 안 됨.","loads(불러오다 load의 3인칭 단수 현재형): forces(강요하다)가 이미 동사라 목적어 뒤에 동사를 또 쓸 수 없음.","to loading(틀린 형태): 여기 to는 to부정사의 to라 뒤에 동사원형이 와야 함."],"point":"목적격보어(준동사)","en":"Autoplay forces media to load and play even for people who may never watch it.","ko":"자동 재생은 미디어를 끝내 보지 않을 수도 있는 사람에게조차 미디어를 억지로 불러와 재생하게 한다.","hl":["forces media to load"],"khl":["억지로 불러와 재생하게 한다"],"blocks":[{"t":"p","h":"시키는 동사 두 부류","x":["make(만들다), let(허락하다), have(시키다): 목적어 뒤에 동사원형.","force(강요하다), want(원하다), ask(부탁하다), tell(말하다), allow(허락하다): 목적어 뒤에 to + 동사원형.","force(강요하다)는 두 번째 부류. forces media to load(미디어를 억지로 불러오게 한다).","and play(그리고 재생하다)는 to load(불러오다)와 나란히 선 to play(재생하다)에서 to가 생략된 것."]},{"t":"pair","h":"쉬운 예시","x":[["My mom forced me to eat vegetables.","엄마는 내가 억지로 채소를 먹게 했다. (forced me to eat = 내가 억지로 먹게 했다)"],["He asked me to help him.","그는 나에게 도와 달라고 부탁했다. (asked me to help = 나에게 도와 달라고 부탁했다)"]]}],"post":["force(강요하다) + 목적어 + to부정사: forces media to load(미디어를 억지로 불러오게 한다)"]},{"slots":[["to_load","","","force(억지로 ~하게 하다) + 목적어 + to부정사."],["who","where","a","뒤에 may never watch(결코 보지 않을 수도 있다)의 주어가 빠졌다. 주어 빈자리는 관계대명사 who(~하는 사람). people(사람들)은 장소도 아니다."],["delivering","","","서버가 직접 전달하는 쪽이라 -ing."],["significantly","","","increases(늘리다)를 꾸미는 부사."],["is_buried","","","선택지는 \"묻히는\" 쪽이라 수동태."]],"opts":["whom","whose","who","what"],"or":["whom(~하는 사람을): 목적격이라 주어 빈자리를 채우지 못함.","whose(~의): 소유격이라 바로 뒤에 명사가 와야 하는데 조동사 may(~일 수도 있다)가 옴.","who(~하는 사람): 선행사 people(사람들) 뒤 may never watch(결코 보지 않을 수도 있다)의 주어 자리가 비어 주격 who가 맞음.","what(~하는 것): 선행사를 이미 품은 말이라 앞에 people(사람들)이 있으면 쓸 수 없음."],"point":"관계대명사 vs. 관계부사","en":"Autoplay forces media to load and play even for people who may never watch it.","ko":"자동 재생은 미디어를 끝내 보지 않을 수도 있는 사람에게조차 미디어를 억지로 불러와 재생하게 한다.","hl":["people who may never watch it"],"khl":["보지 않을 수도 있는 사람"],"blocks":[{"t":"p","h":"빈자리 검사","x":["who(~하는 사람) 뒤를 본다: may never watch it(그것을 결코 보지 않을 수도 있다).","누가 안 보나? 주어가 비어 있다.","주어 빈자리를 채우는 건 관계대명사. 사람이면 who(~하는 사람).","where(~하는 곳)는 장소 뒤, 빠진 게 없는 문장 앞에 쓴다."]},{"t":"pair","h":"쉬운 예시","x":[["I know a boy who speaks French.","나는 프랑스어를 하는 소년을 안다. (주어 빈자리 → who)"],["This is the town where I was born.","이곳은 내가 태어난 마을이다. (I was born(내가 태어났다)이 완전 → where(~하는 곳))"]]}],"post":["주어 빈자리 + 사람 → who(~하는 사람): people who may never watch(결코 보지 않을 수도 있는 사람들)"]}],"quiz":[{"s":"Animals such as dogs and cats ___ smart.","o":["is","are"],"a":1,"ko":"개와 고양이 같은 동물들은 영리하다.","why":"주인은 Animals(동물들). such as(~ 같은) 뒤는 꼬리표.","wy":"is(~이다): 주인 Animals(동물들)가 복수라 단수 is와 수가 안 맞음."},{"s":"He kept ___ the same song.","o":["singing","to sing"],"a":0,"ko":"그는 같은 노래를 계속 불렀다.","why":"keep(계속하다) + -ing.","wy":"to sing(노래하는 것): keep(계속하다)은 to부정사를 목적어로 받지 않음."},{"s":"He opened the window, ___ in fresh air.","o":["letting","lets"],"a":0,"ko":"그는 창문을 열어 신선한 공기를 들였다.","why":"진짜 동사 opened(열었다)가 있으니 덧붙임은 -ing.","wy":"lets(~하게 하다 let의 3인칭 단수 현재형): 진짜 동사 opened(열었다)가 있어 접속사 없이 동사를 또 붙일 수 없음."},{"s":"The teacher told us ___ quiet.","o":["be","to be"],"a":1,"ko":"선생님은 우리에게 조용히 하라고 말씀하셨다.","why":"tell(말하다) + 사람 + to부정사.","wy":"be(~이다, 동사원형): tell(말하다)은 목적어 뒤에 동사원형이 아니라 to부정사를 씀."},{"s":"I have a friend ___ lives in Busan.","o":["where","who"],"a":1,"ko":"나는 부산에 사는 친구가 있다.","why":"lives(살다)의 주어가 빈자리, 사람이라 who(~하는 사람).","wy":"where(~하는 곳): friend(친구)는 장소가 아니고, lives(살다)의 주어 자리가 비어 관계부사를 못 씀."}]},{"items":[{"slots":[["who","","","people(사람들)을 받는 주격 관계대명사."],["delivering","delivered","a","servers(서버)가 콘텐츠를 직접 전달하는 쪽이다. 뒤에 목적어 the content(콘텐츠)도 있다. 당하는 p.p.는 안 된다."],["significantly","","","increases(늘리다)를 꾸미는 부사."],["is_buried","","","선택지는 묻히는 쪽이라 수동태."],["actively","","","동사 search(찾다)를 꾸미는 부사."]],"opts":["deliver","delivers","delivering","to delivering"],"or":["deliver(전달하다, 동사원형): consume(소비하다)이 이미 문장의 동사라 servers(서버) 뒤에 동사를 또 붙일 수 없음.","delivers(전달하다 deliver의 3인칭 단수 현재형): 접속사 없이 동사가 둘이 되고, servers(서버들)가 복수라 수도 안 맞음.","delivering(전달하는): 서버가 직접 전달하고 뒤에 목적어 the content(콘텐츠)가 있어 능동 -ing가 맞음.","to delivering(틀린 형태): to부정사의 to 뒤에 -ing가 와서 형태부터 틀림."],"point":"능동 v-ing vs. 수동 p.p.","en":"These choices consume more energy on both the user’s device and the servers delivering the content.","ko":"이러한 선택들은 사용자의 기기와 콘텐츠를 전달하는 서버 양쪽 모두에서 더 많은 에너지를 소비한다.","hl":["the servers delivering the content"],"khl":["콘텐츠를 전달하는 서버"],"blocks":[{"t":"p","h":"목적어가 있으면 -ing","x":["servers(서버)가 무엇을 하나? 콘텐츠를 전달한다. 직접 하는 쪽.","직접 하면 -ing, 당하면 p.p.","뒤에 the content(콘텐츠)라는 목적어가 붙어 있다.","p.p.는 당하는 쪽이라 뒤에 목적어를 데려오지 못한다."]},{"t":"pair","h":"쉬운 예시","x":[["The man driving the bus is my uncle.","버스를 운전하는 남자는 우리 삼촌이다. (남자가 운전함 → driving(운전하는))"],["I found a wallet lost on the street.","나는 길에서 잃어버린 지갑을 발견했다. (지갑이 잃어버려짐 → lost(잃어버린))"]]}],"post":["직접 하고 목적어 있으면 -ing: servers delivering the content(콘텐츠를 전달하는 서버)"]},{"slots":[["delivering","","","서버가 직접 전달하는 쪽이라 -ing."],["significantly","","","increases(늘리다)를 꾸미는 부사."],["is_buried","buries","a","the option(선택지)은 스스로 무언가를 묻지 않는다. 누군가에 의해 설정 깊숙이 \"묻힌\" 쪽이라 is buried(묻혀 있다)."],["actively","","","search(찾다)를 꾸미는 부사."],["that","","","acknowledge(인정하다)의 내용을 이끄는 that(~라는 것). 뒤 문장이 완전하다."]],"opts":["burying","is buried","to bury","have buried"],"or":["burying(묻는): -ing는 혼자 동사 자리에 못 와서 while(~인 반면) 뒤 문장에 동사가 없어짐.","is buried(묻혀 있다): the option(선택지)은 누군가에 의해 묻힌 쪽이라 be + p.p. 수동태가 맞음.","to bury(묻는 것): to부정사도 동사 자리에 못 오고, 뒤에 묻을 목적어도 없음.","have buried(묻어 왔다): 단수 주어 the option(선택지)과 have(복수용)가 수가 안 맞고, 능동이라 목적어도 필요함."],"point":"능동태 vs. 수동태","en":"This change significantly increases data usage and battery consumption, while the option to disable it is buried deep in the settings.","ko":"이 변화는 데이터 사용량과 배터리 소모를 크게 늘리는데, 그것을 끄는 선택지는 설정 깊숙이 묻혀 있다.","hl":["the option to disable it is buried"],"khl":["끄는 선택지는","묻혀 있다"],"blocks":[{"t":"p","h":"주인이 하나, 당하나","x":["while(~인 반면) 뒤 주인: the option(선택지). to disable it(그것을 끄는)은 꼬리표.","선택지가 무언가를 묻나? 아니다.","회사가 선택지를 설정 깊숙이 묻었다. 선택지는 묻힌 쪽.","묻힌 쪽 = be + p.p. = is buried(묻혀 있다).","buries(묻다 bury의 3인칭 단수 현재형)를 쓰면 선택지가 무언가를 묻는 꼴이 되고, 묻을 대상(목적어)도 없다."]},{"t":"pair","h":"쉬운 예시","x":[["The letter was written by Tom.","그 편지는 톰이 썼다. (편지가 쓰임 → was written = 쓰였다)"],["The treasure is buried under the tree.","보물은 나무 밑에 묻혀 있다. (보물이 묻힘 → is buried = 묻혀 있다)"]]},{"t":"tap","h":"질문 하나","q":"buried(묻힌) 뒤에 목적어가 있나?","a":["없다. deep in the settings(설정 깊숙이)는 장소 표현이다.","bury(묻다) 뒤에 목적어가 없으면 수동태 신호."]}],"post":["묻힌 쪽은 be + p.p.: the option(선택지) ... is buried(묻혀 있다)"]},{"slots":[["significantly","","","increases(늘리다)를 꾸미는 부사."],["is_buried","","","선택지는 묻히는 쪽이라 수동태."],["actively","active","a","동사 search(찾다)를 꾸미는 자리. 동사를 꾸미는 건 부사."],["that","","","acknowledge(인정하다)의 내용을 이끄는 that(~라는 것). 뒤 문장이 완전하다."],["are","","","주어 Showing consequences(결과를 보여 주는 것)와 highlighting options(선택지를 강조하는 것)가 둘이라 복수."]],"opts":["activity","activeness","more active","actively"],"or":["activity(활동): 명사라 they(그들)와 search(찾다) 사이에서 동사를 꾸밀 수 없음.","activeness(적극성): 이것도 명사라 동사를 꾸미는 자리에 못 옴.","more active(더 적극적인, active의 비교급): 형용사라 명사를 꾸미지 동사 search(찾다)는 꾸미지 못함.","actively(적극적으로): 동사 search(찾다)를 꾸미는 자리라 부사가 맞음."],"point":"형용사 자리 vs. 부사 자리","en":"As a result, most users consume more resources unless they actively search for a way to opt out.","ko":"그 결과, 대부분의 사용자는 거부할 방법을 적극적으로 찾지 않는 한 더 많은 자원을 소비한다.","hl":["actively search"],"khl":["적극적으로 찾지"],"blocks":[{"t":"p","h":"화살표 긋기","x":["actively(적극적으로) → search(찾다). 화살표가 동사로 간다.","동사를 꾸미는 건 부사(-ly).","형용사 active(적극적인, 활발한)는 명사를 꾸민다. an active student(활발한 학생)처럼.","they(그들)와 search(찾다) 사이에 끼어 있어도 동사를 꾸미는 자리다."]},{"t":"pair","h":"쉬운 예시","x":[["He quickly ran home.","그는 재빨리 집으로 달려갔다. (ran(달렸다) ← quickly(재빨리))"],["She is an active girl.","그녀는 활발한 소녀다. (girl(소녀) ← active(활발한))"]]}],"post":["동사 search(찾다)를 꾸미면 -ly: actively search(적극적으로 찾다)"]},{"slots":[["actively","","","search(찾다)를 꾸미는 부사."],["that","what","a","acknowledge(인정하다) 뒤 문장 web design always nudges behavior(웹 디자인은 늘 행동을 유도한다)는 주어·동사·목적어가 다 있는 완전한 문장이다. 완전하면 that(~라는 것)."],["are","","","-ing 주어 둘이 and(그리고)로 묶여 복수."],["aligned","","","transparent(투명한), reversible(되돌릴 수 있는)과 나란한 형용사 역할의 p.p."],["to_make","","","be동사 뒤 보어 자리, \"~하는 것\"이라는 to부정사."]],"opts":["that","whom","it","them"],"or":["that(~라는 것): 뒤 web design always nudges behavior(웹 디자인은 늘 행동을 유도한다)가 완전한 문장이라 접속사 that이 맞음.","whom(~하는 사람을): 관계대명사라 앞에 사람 선행사, 뒤에 목적어 빈자리가 있어야 하는데 둘 다 없음.","it(그것): 대명사는 문장을 이끌지 못해 acknowledge(인정하다) 뒤에 완전한 문장이 그냥 붙어 버림.","them(그것들을): 대명사라 문장을 이끌지 못하고, 받을 복수 명사도 없음."],"point":"that vs. what","en":"It is important to acknowledge that web design always nudges behavior in some way.","ko":"웹 디자인은 어떤 식으로든 늘 행동을 유도한다는 것을 인정하는 것이 중요하다.","hl":["acknowledge that"],"khl":["유도한다는 것을 인정하는"],"blocks":[{"t":"p","h":"what은 빈자리가 있어야 산다","x":["what(~하는 것)은 뒤 문장에 빈자리가 하나 있어야 한다.","web design(웹 디자인, 주어) always(늘) nudges(유도하다, 동사) behavior(행동, 목적어).","빈자리가 없다.","완전한 문장을 \"~라는 것\"으로 묶을 땐 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I think that you are right.","나는 네가 옳다고 생각한다. (완전 → that)"],["Tell me what you need.","네가 필요한 것을 말해 줘. (need의 목적어 빈자리 → what)"]]}],"post":["acknowledge(인정하다) + that(~라는 것) + 완전한 문장 (빈자리 없으면 what(~하는 것) X)"]},{"slots":[["that","","","acknowledge(인정하다)의 내용을 이끄는 that(~라는 것)."],["are","is","a","주어가 Showing consequences(결과를 보여 주는 것)와 highlighting options(선택지를 강조하는 것), 두 개가 and(그리고)로 묶였다. 둘이면 복수 are(~이다)."],["aligned","","","transparent(투명한), reversible(되돌릴 수 있는)과 나란히 be동사 뒤에 선 p.p."],["to_make","","","be동사 뒤 보어 자리의 to부정사."],["keeping","","","접속사 while(~하면서) 뒤에 주어 없이 -ing로 이어진다."]],"opts":["being","to be","are","has been"],"or":["being(~인 것): -ing는 혼자 동사 자리에 못 와서 문장에 동사가 없어짐.","to be(~인 것): to부정사도 동사 자리에 못 와서 문장이 성립하지 않음.","are(~이다): Showing consequences(결과를 보여 주는 것)와 highlighting options(선택지를 강조하는 것)가 and(그리고)로 묶인 복수 주어라 are가 맞음.","has been(~이어 왔다, 현재완료): 현재완료의 has(have의 3인칭 단수형)는 단수 주어용이라 주어 둘이 묶인 복수와 수가 안 맞음."],"point":"주어-동사 수일치(A and B)","en":"Showing consequences and highlighting options are all forms of influence.","ko":"결과를 보여 주는 것과 선택지를 강조하는 것은 모두 영향력의 한 형태이다.","hl":["Showing consequences and highlighting options are"],"khl":["보여 주는 것과","강조하는 것은"],"blocks":[{"t":"p","h":"and로 묶으면 둘","x":["동명사(-ing) 주어 하나는 단수다. Showing consequences(결과를 보여 주는 것) 하나만 있으면 is(~이다).","그런데 여기는 Showing(보여 주는 것) ...과 highlighting(강조하는 것) ...이 and(그리고)로 묶였다.","하나 + 하나 = 둘. 둘이면 복수.","options(선택지들)가 복수라서 are(~이다)인 게 아니다. 주인 두 개를 세어서 are(~이다)."]},{"t":"pair","h":"쉬운 예시","x":[["Reading books is fun.","책을 읽는 것은 재미있다. (동명사 하나 → is(~이다))"],["Reading and writing are important.","읽기와 쓰기는 중요하다. (둘 → are(~이다))"]]}],"post":["-ing 주어 둘이 and(그리고)로 묶이면 복수: Showing(보여 주는 것) ... and highlighting(강조하는 것) ... are(~이다)"]}],"quiz":[{"s":"I saw a cat ___ on the roof.","o":["slept","sleeping"],"a":1,"ko":"나는 지붕 위에서 자고 있는 고양이를 보았다.","why":"고양이가 직접 자는 쪽이라 -ing.","wy":"slept(잠잔, sleep의 과거분사): 고양이는 잠을 당하는 쪽이 아니라 직접 자는 쪽이라 p.p.는 안 됨."},{"s":"English ___ all over the world.","o":["is spoken","speaks"],"a":0,"ko":"영어는 전 세계에서 쓰인다.","why":"영어는 말해지는 쪽, be + p.p.","wy":"speaks(말하다 speak의 3인칭 단수 현재형): 영어는 스스로 말하는 게 아니라 말해지는 쪽이라 능동태가 안 됨."},{"s":"She ___ joined the club.","o":["actively","active"],"a":0,"ko":"그녀는 적극적으로 그 동아리에 가입했다.","why":"동사 joined(가입했다)를 꾸미니 부사.","wy":"active(적극적인): 형용사는 명사를 꾸미므로 동사 joined(가입했다)를 꾸밀 수 없음."},{"s":"I hope ___ you feel better soon.","o":["what","that"],"a":1,"ko":"네가 곧 나아지길 바란다.","why":"뒤가 완전한 문장이라 that(~라는 것).","wy":"what(~하는 것): you feel better soon(네가 곧 나아진다)은 빈자리 없는 완전한 문장이라 what을 쓸 수 없음."},{"s":"Running and swimming ___ good exercises.","o":["is","are"],"a":1,"ko":"달리기와 수영은 좋은 운동이다.","why":"-ing 주어 둘이 and(그리고)로 묶여 복수.","wy":"is(~이다): Running(달리기)과 swimming(수영) 둘이 and(그리고)로 묶여 복수라 단수 is와 수가 안 맞음."}]}],"comp":[{"no":"41-42","slots":[["that","","","acknowledge(인정하다)의 내용을 이끄는 that(~라는 것)."],["are","","","-ing 주어 둘이 and(그리고)로 묶여 복수."],["aligned","align","a","transparent(투명한), reversible(되돌릴 수 있는)과 and(그리고)로 나란히 be동사 뒤 보어 자리. 동사원형 align(맞추다)은 be동사 뒤에 올 수 없다."],["to_make","","","be동사 뒤 보어 자리의 to부정사."],["clearly","","","형용사 available(이용할 수 있는)을 꾸미는 부사."]],"opts":["aligned","alignment","to aligning","have aligned"],"or":["aligned(맞춰진, align의 과거분사): transparent(투명한), reversible(되돌릴 수 있는)과 나란히 be동사 뒤 보어 자리에 서는 형용사 역할이라 맞음.","alignment(정렬, 일치): 명사라 형용사 둘과 나란히 설 수 없고 뒤 with(~와)와도 이어지지 않음.","to aligning(틀린 형태): to부정사의 to 뒤에 -ing가 와서 형태부터 틀림.","have aligned(맞춰 왔다): be동사 뒤 보어 자리에 동사를 또 쓸 수 없고, 단수 주어 it(그것)과 have(복수용)도 수가 안 맞음."],"point":"병렬구조","en":"The ethical line is not whether nudging exists, but whether it is transparent, reversible, and aligned with the user’s interests.","ko":"윤리적 경계선은 유도가 존재하느냐가 아니라, 그것이 투명하고, 되돌릴 수 있으며, 사용자의 이익에 맞춰져 있느냐이다.","hl":["transparent, reversible, and aligned"],"khl":["투명하고, 되돌릴 수 있으며, 사용자의 이익에 맞춰져"],"blocks":[{"t":"p","h":"and 저울에 셋 올리기","x":["it is(그것은 ~이다) 뒤에 세 개가 나란히 선다.","transparent(투명한), reversible(되돌릴 수 있는), aligned(맞춰진).","셋 다 \"어떤 상태인지\"를 말하는 형용사 역할.","align(맞추다)은 동사원형이라 be동사 뒤 줄에 끼지 못한다.","be aligned with(~와 맞춰져 있다)로 기억."]},{"t":"pair","h":"쉬운 예시","x":[["The room is clean, bright, and quiet.","그 방은 깨끗하고, 밝고, 조용하다. (형용사 셋)"],["The shop is open and crowded.","그 가게는 문을 열었고 붐빈다. (open, crowded)"]]}],"post":["be동사 + 형용사, 형용사, p.p.: transparent(투명한), reversible(되돌릴 수 있는), and aligned(그리고 맞춰진)"]},{"no":"41-42","slots":[["to_make","","","be동사 뒤 보어 자리의 to부정사, \"~하는 것\"."],["keeping","","","while(~하면서) 뒤에 주어가 빠지고 -ing."],["clearly","","","available(이용할 수 있는)을 꾸미는 부사."],["chosen","","","Defaults(기본값)는 \"선택되는\" 쪽이라 p.p."],["removing","remove","a","without(~ 없이)은 전치사. 전치사 뒤에 동사를 쓰려면 -ing."]],"opts":["removing","removed","removes","to remove"],"or":["removing(없애는 것): 전치사 without(~ 없이) 뒤라 동명사 -ing가 맞음.","removed(없애진, remove의 과거분사): 전치사 뒤에 p.p.는 못 오고, 뒤 목적어 user agency(사용자의 선택권)도 받지 못함.","removes(없애다 remove의 3인칭 단수 현재형): 전치사 뒤에 동사를 그대로 쓸 수 없음.","to remove(없애는 것): without(~ 없이) 같은 전치사 뒤에는 to부정사가 못 오고 -ing만 옴."],"point":"전치사 + 동명사","en":"Defaults are powerful, and when chosen carefully, they can reduce environmental impact without removing user agency.","ko":"기본값은 강력하며, 신중하게 선택되면 사용자의 선택권을 없애지 않고도 환경에 미치는 영향을 줄일 수 있다.","hl":["without removing"],"khl":["없애지 않고도"],"blocks":[{"t":"p","h":"without은 전치사","x":["without(~ 없이)은 전치사다.","전치사 뒤는 명사 자리. 동사는 -ing를 입고 들어온다.","without removing(없애는 것 없이 = 없애지 않고).","user agency(사용자의 선택권)는 지키면서 환경 영향은 줄인다. 이게 글의 결론이다."]},{"t":"pair","h":"쉬운 예시","x":[["He left without saying goodbye.","그는 작별 인사도 없이 떠났다. (without saying)"],["I’m good at drawing.","나는 그림 그리기를 잘한다. (at drawing)"]]}],"post":["without(~ 없이) 뒤 동사는 -ing: without removing(없애지 않고)"]}],"compquiz":[{"s":"The cake was sweet, soft, and ___.","o":["deliciously","delicious"],"a":1,"ko":"그 케이크는 달고, 부드럽고, 맛있었다.","why":"was(~였다) 뒤 형용사 셋이 나란히.","wy":"deliciously(맛있게): was(~였다) 뒤 sweet(달콤한), soft(부드러운)와 나란한 보어 자리라 부사는 못 옴."},{"s":"She went out without ___ a coat.","o":["wearing","wear"],"a":0,"ko":"그녀는 코트도 입지 않고 나갔다.","why":"전치사 without(~ 없이) 뒤는 -ing.","wy":"wear(입다, 동사원형): 전치사 without(~ 없이) 뒤에는 동사원형이 올 수 없음."}]}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+'번<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+'번 · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+'번 지문</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
</body>
