<title>어법특훈 · 공통영어2 미래엔(김) 3과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

 War, he still had to face racial discrimination, working for very low wages on the farm.","ko":"그는 미국 남북전쟁 이후 자유의 몸이 되었지만, 농장에서 매우 낮은 임금을 받고 일하며 여전히 인종차별에 직면해야 했다.","hl":["Although he became a free man"],"khl":["자유의 몸이 되었지만"],"blocks":[{"t":"p","h":"뒤에 동사가 있나 보기","x":["Although(비록 ~이지만) 뒤: 주어 + 동사 문장.","Despite(~에도 불구하고) 뒤: 명사 덩어리만.","he became a free man(그는 자유인이 되었다). 동사 became(되었다)이 보인다.","그래서 Although(비록 ~이지만). 지문 앞부분 despite challenges(역경에도 불구하고)는 뒤가 명사라 despite(~에도 불구하고)였다."]},{"t":"pair","h":"쉬운 예시","x":[["Although it was cold, we played outside.","추웠지만 우리는 밖에서 놀았다. (it was = 주어+동사)"],["Despite the cold, we played outside.","추위에도 불구하고 우리는 밖에서 놀았다. (the cold(추위) = 명사)"]]},{"t":"tap","h":"확인 질문","q":"Despite(~에도 불구하고)를 꼭 쓰고 싶다면 뒤를 어떻게 바꿀까?","a":["Despite his freedom(그의 자유에도 불구하고)처럼 명사로 바꾼다.","문장을 그대로 두려면 Although(비록 ~이지만)."]}],"post":["주어+동사 앞은 Although(비록 ~이지만), 명사 앞은 despite(~에도 불구하고)"]},{"slots":[["that_until","","","It wasn't until ~ that ...(~하고 나서야 비로소 …했다) 짝이라 that이 맞다."],["been_used","used","a","they(그들 = 개들)는 이용을 '당한' 쪽. had used(이용했었다)로 쓰면 개가 무언가를 이용한 셈이 되고 목적어도 없다."],["hunt","","","to watch and (to) hunt(감시하고 사냥하기 위해). 두 번째 to가 빠진 원형이 맞다."],["that_lives","","","명사 the free lives(자유로운 삶)를 꾸미고 observed(관찰했다)의 목적어가 빠진 문장을 이끄는 that(~하는)이다."],["using","","","주어 Traylor(트레일러)가 직접 '사용하는' 쪽이라 분사구문 Using(사용하여)이 맞다."]],"opts":["using","been used","been using","use"],"or":["using(이용하는): had(~했었다) 뒤에는 과거분사가 와야 해서 -ing는 못 옴.","been used(이용된): had(~했었다)와 합쳐 과거완료 수동태, 개가 이용'당한' 쪽이라 맞음.","been using(이용하고 있던): 개가 무언가를 이용하는 능동이 되고, 이용할 목적어도 없음.","use(이용하다): had(~했었다) 뒤에 동사원형은 못 옴."],"point":"능동태 vs. 수동태","en":"Traylor had a strong fear of dogs because they had often been used on farms to watch and hunt slaves.","ko":"Traylor는 개를 몹시 두려워했는데, 개가 농장에서 노예를 감시하고 사냥하는 데 자주 이용되었기 때문이다.","hl":["had often been used"],"khl":["자주 이용되었기"],"blocks":[{"t":"p","h":"하는 쪽인가, 당하는 쪽인가","x":["they(그들)는 바로 앞 dogs(개들)를 가리킨다.","농장 주인들이 개를 이용했다. 개는 이용'당했다'.","당하는 쪽이면 be + p.p. 여기서는 had been u 사 speaks(말한다) ← 부사)"],["He has a clear voice.","그는 또렷한 목소리를 가졌다. (명사 voice(목소리) ← 형용사)"]]}],"post":["동사 꾸미면 -ly: expressed strongly(강하게 표현된) / 명사 꾸미면 형용사: a strong fear(강한 두려움)"],"no":"본문 ①②"},{"slots":[["who","","","사람 artists(예술가들)를 받아 never gave up(결코 포기하지 않았다)의 주어가 되는 who(~하는)가 맞다."],["that_until","","","It wasn't until ~ that ...(~하고 나서야 비로소 …했다) 짝이라 that이 맞다."],["that_lives","","","명사 the free lives(자유로운 삶)를 꾸미고 observed(관찰했다)의 목적어가 빠진 문장을 이끄는 that(~하는)이다."],["using","Used","a","Used(사용된)는 Traylor(트레일러)가 '사용당한' 뜻이 된다. 그가 직접 형태와 색을 사용했으니 Using(사용하여)."],["considered","","","그가 사람들에게 '여겨지는' 쪽이라 is considered(~로 여겨지다), 수동태가 맞다."]],"opts":["Using","Use","Uses","Having been used"],"or":["Using(사용하여): 주어 Traylor(트레일러)가 직접 사용하는 능동이라 분사구문 -ing가 맞음.","Use(사용하다): 동사원형이라 뒤 captured(포착했다)와 접속사 없이 동사가 둘이 됨.","Uses(사용한다): 동사라 captured(포착했다)와 겹치고 앞에 주어도 없음.","Having been used(사용된 채로): 수동이라 사람이 사용'당한' 뜻이 되고, 뒤 목적어 simple shapes(단순한 형태)와도 안 맞음."],"point":"능동 v-ing vs. 수동 p.p.","en":"Using simple shapes and colors, Traylor captured complex moments in American history from slavery to freedom.","ko":"단순한 형태와 색채를 사용하여 Traylor는 노예 제도에서 자유에 이르기까지 미국 역사의 복잡한 순간들을 포착했다.","hl":["Using simple shapes and colors"],"khl":["단순한 형태와 색채를 사용하여"],"blocks":[{"t":"p","h":"숨은 주어 찾기","x":["분사구문의 숨은 주어는 콤마 뒤 주어 Traylor(트레일러)다.","Traylor(트레일러)가 형태와 색을 '사용하는' 쪽. 능동이니 -ing.","뒤에 목적어 simple shapes and colors(단순한 형태와 색채)가 있는 것도 능동의 증거.","단순한 그림으로 노예에서 자유까지의 복잡한 역사를 담았다. 그래서 지금 미국 민속 예술의 중요한 인물로 여겨진다."]},{"t":"pair","h":"쉬운 예시","x":[["Using a map, we found the museum.","지도를 사용해서 우리는 박물관을 찾았다. (우리가 사용 → -ing)"],["Written in English, the book is hard for me.","영어로 쓰여 있어서 그 책은 나에게 어렵다. (책은 쓰인 쪽 → p.p.)"]]}],"post":["주어가 직접 하면 -ing: Using simple shapes(단순한 형태를 사용하여), Traylor(트레일러) captured(포착했다)"],"no":"본문 ①②"}],"compquiz":[{"s":"She sang the song ___.","o":["beautiful","beautifully"],"a":1,"ko":"그녀는 그 노래를 아름답게 불렀다.","why":"동사 sang(불렀다)을 꾸미니 부사.","wy":"beautiful(아름다운): 형용사라 동사 sang(불렀다)을 꾸밀 수 없음."},{"s":"___ his phone, he took a picture.","o":["Using","Used"],"a":0,"ko":"그는 휴대폰을 사용해서 사진을 찍었다.","why":"그가 직접 사용하니 -ing.","wy":"Used(사용된): 그가 사용당한 뜻이 되고 뒤 목적어 his phone(그의 휴대폰)과도 안 맞음."}]},{"id":"tb3g-3c","no":"본문 ③","title":"어법특훈 · 공통영어2 3과 본문 ③","sub":"Maud Lewis","tpl":"Next, we have Maud Lewis, a renowned artist {known|known} for her heart-warming paintings. {born|Born} in a small Canadian town in 1903, Lewis suffered from physical weaknesses such as {distorted|distorted} shoulders and fingers. This {limited|limited} her mobility and caused her {to_drop|to drop} out of school. {to_make|To make} a living, she began to paint and {sell|sell} Christmas cards. When her parents passed away, Lewis went to live with her aunt in Digby, Nova Scotia, {where|where} she met her future husband, Everett Lewis. After {marrying|marrying}, the couple spent the rest of their lives there, and Lewis continued to paint. She often depicted the Digby landscapes in paintings such as Edge of Digby Harbor. Her artwork used a mixture of bright and vivid oil paints and simple forms, {generating|generating} an original, innovative style. {although|Although} her physical limitations confined her to a small cottage, her talent and imagination were both {limitless|limitless}. In Red Sleigh, red maple leaves {appear|appear} on a special winter landscape, and Pair of Oxen shows {decorated|decorated} cows {standing|standing} in a flower field. With these features, Lewis' paintings create a magical quality, like {that_of|that} of a fairy tale. As her paintings gradually gained popularity, her story inspired many people and {was|was} later made into books and movies. Maud Lewis expressed her love for the world through her paintings and {became|became} an iconic figure in Canadian folk art.","fn":["*mobility: 이동성","*confine A to B: A를 B에 가두다","*iconic: 상징적인"],"mean":{"known":"알려진(know의 과거분사형)","knowing":"아는(know의 -ing형)","knew":"알았다(know의 과거형)","knows":"알다(know의 3인칭 단수 현재형)","be known":"알려지다(be + know의 과거분사형)", ]},{"t":"tap","h":"함정 확인","q":"her physical limitations(그녀의 신체적 제약)는 명사인데, 왜 Despite(~에도 불구하고)가 틀릴까?","a":["뒤에 confined her(그녀를 가두었다)라는 동사가 이어지기 때문이다.","명사 + 동사 = 문장. 문장을 이끄는 건 접속사 Although(비록 ~이지만)."]}],"post":["주어+동사 앞은 Although(비록 ~이지만): Although her physical limitations confined(비록 신체적 제약이 가두었지만)"]},{"slots":[["limitless","","","be동사 were(~였다) 뒤 보어 자리라 형용사 limitless(무한한)가 맞다."],["appear","appears","a","주어는 red maple leaves(붉은 단풍잎들), 복수다. s를 붙인 appears(나타난다)는 단수 주어용."],["decorated","","","소들이 '장식된' 쪽이라 과거분사 decorated(장식된)가 맞다."],["standing","","","소들이 직접 '서 있는' 쪽이라 현재분사 standing(서 있는)이 맞다."],["that_of","","","앞의 단수 명사 a magical quality(마법 같은 특성)를 대신 받는 that(그것)이 맞다."]],"opts":["appear","appearing","to appear","appearance"],"or":["appear(나타나다): 복수 주어 red maple leaves(붉은 단풍잎들)의 현재형 동사라 맞음.","appearing(나타나는): -ing는 혼자 동사 자리에 못 와서 앞 문장에 동사가 없어짐.","to appear(나타나는 것): to부정사는 동사 자리에 못 옴.","appearance(출현, 명사): 명사라 동사 자리에 못 옴."],"point":"주어-동사 수일치","en":"In Red Sleigh, red maple leaves appear on a special winter landscape, and Pair of Oxen shows decorated cows standing in a flower field.","ko":"〈빨간 썰매〉에는 붉은 단풍잎이 특별한 겨울 풍경 위에 나타나고, 〈한 쌍의 소〉는 꽃밭에 서 있는 장식된 소들을 보여 준다.","hl":["red maple leaves appear"],"khl":["붉은 단풍잎이","나타나고"],"blocks":[{"t":"p","h":"s는 한 번만","x":["주어가 복수면 명사에 s, 동사엔 s 없음.","leaves(잎들)에 이미 복수 표시가 있다. 동사 appear(나타나다)엔 s 없이.","appear(나타나다)는 목적어 없이 쓰는 동사라 수동태로도 못 쓴다.","단풍잎이 겨울 풍경에 나타난다. 계절을 섞은 Lewis(루이스)만의 상상력이다."]},{"t":"pair","h":"쉬운 예시","x":[["Birds sing in the morning.","새들은 아침에 노래한다. (Birds(새들) 복수 → sing(노래하다))"],["A bird sings in the morning.","새 한 마리가 아침에 노래한다. (A bird(새 한 마리) 단수 → sings(노래한다))"]]}],"post":["복수 주어 + s 없는 동사: red maple leaves appear(붉은 단풍잎들이 나타난다)"]}],"quiz":[{"s":"Seoul is a city ___ for its palaces.","o":["knowing","known"],"a":1,"ko":"서울은 궁궐로 알려진 도시이다.","why":"도시는 알려진 쪽이라 known(알려진).","wy":"knowing(아는): 도시가 무언가를 아는 셈이 되어 안 맞음."},{"s":"The noise caused me ___ up.","o":["wake","to wake"],"a":1,"ko":"그 소음 때문에 나는 잠에서 깼다.","why":"cause(유발하다) (나타나다)가 맞다."],["standing","","","소들이 직접 '서 있는' 쪽이라 현재분사 standing(서 있는)이 맞다."]],"opts":["generate","generating","generated","generation"],"or":["generate(만들어 내다): 동사원형이라 접속사 없이 동사가 하나 더 생김.","generating(만들어 내며): 동사 used(사용했다)가 이미 있어 덧붙임은 분사구문 -ing가 맞음.","generated(만들어 냈다, 과거형·과거분사형): 과거형이면 접속사 없이 동사가 둘이 되고, 과거분사면 목적어 an original style(독창적인 스타일)을 받을 수 없음.","generation(생성, 세대): 명사라 뒤에 목적어를 받을 수 없음."],"point":"정동사 vs. 준동사","en":"Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style.","ko":"그녀의 작품은 밝고 선명한 유화 물감의 혼합과 단순한 형태를 사용하여, 독창적이고 혁신적인 스타일을 만들어 냈다.","hl":["generating an original, innovative style"],"khl":["독창적이고 혁신적인 스타일을 만들어 냈다"],"blocks":[{"t":"p","h":"결과를 이어 붙이는 -ing","x":["콤마 + -ing는 앞 내용의 '결과'를 붙일 때도 쓴다.","밝은 물감과 단순한 형태를 썼다. 그 결과 독창적인 스타일이 생겼다.","and it generated(그리고 그것은 만들어 냈다)에서 접속사를 빼고 -ing로 줄인 꼴.","이 자리에 동사를 그대로 두면 접속사 없이 동사가 둘이 된다."]},{"t":"pair","h":"쉬운 예시","x":[["He studied hard, passing the test.","그는 열심히 공부해서 시험에 합격했다. (결과 → passing(합격하며))"],["The bus left early, making me late.","버스가 일찍 떠나서 나는 늦었다. (결과 → making(만들며))"]]}],"post":["동사 used(사용했다) 뒤 결과는 -ing: generating(만들어 내며)"]},{"slots":[["although","","","뒤에 주어 her physical limitations(그녀의 신체적 제약)와 동사 confined(가두었다)가 와서 접속사 Although(비록 ~이지만)가 맞다."],["limitless","limitlessly","a","were(~였다) 뒤는 주어를 설명하는 보어 자리. 부사 limitlessly(무한하게)는 보어가 될 수 없고 형용사 limitless(무한한)가 와야 한다."],["decorated","","","소들이 '장식된' 쪽이라 과거분사 decorated(장식된)가 맞다."],["standing","","","소들이 직접 '서 있는' 쪽이라 현재분사 standing(서 있는)이 맞다."],["was","","","her story(그녀의 이야기)가 '만들어진' 쪽이라 inspired(영감을 주었다)와 나란히 was made(만들어졌다)가 맞다."]],"opts":["limit","boundlessly","limitless","endlessly"],"or":["limit(한계, 제한하다): 관사 없는 단수 명사나 동사원형이라 보어로 안 맞고 뜻도 반대임.","boundlessly(끝없이): 부사라 be동사 뒤 주어의 상태를 말하는 보어 자리에 못 옴.","limitless(무한한): be동사 were(~였다) 뒤 보어 자리의 형용사라 맞음.","endlessly(끝없이): 부사라 be동사 뒤 보어 자리에 못 옴."],"point":"형용사 자리 vs. 부사 자리","en":"Although her physical limitations confined her to a small cottage 을 주었고 나중에 책과 영화로 만들어졌다.","hl":["inspired many people and was later made"],"khl":["영감을 주었고","만들어졌다"],"blocks":[{"t":"p","h":"and(그리고) 양쪽 짝 맞추기","x":["her story(그녀의 이야기)가 한 일 두 가지.","① inspired many people(많은 사람에게 영감을 주었다), ② was made into books and movies(책과 영화로 만들어졌다).","②는 이야기가 '만들어진' 쪽이라 수동 was made(만들어졌다).","둘 다 진짜 동사라 and(그리고)로 나란하다. to be(~이 되는 것)는 동사가 아니라 짝이 깨진다."]},{"t":"pair","h":"쉬운 예시","x":[["The song was popular and was played everywhere.","그 노래는 인기가 많았고 어디서나 연주되었다. (was played(연주되었다) = 수동)"],["He wrote a book and was invited to a show.","그는 책을 썼고 한 쇼에 초대되었다. (wrote(썼다)와 was invited(초대되었다)가 나란함)"]]}],"post":["동사 and 동사: inspired(영감을 주었다) and was made(만들어졌다)"],"no":"본문 ③"},{"slots":[["born","","","Lewis(루이스)가 '태어난' 쪽이라 수동의 분사구문 Born(태어난)이 맞다."],["where","","","장소 Digby, Nova Scotia(노바스코샤주 딕비) 뒤에 완전한 문장이 와서 where(그곳에서)가 맞다."],["limitless","","","be동사 were(~였다) 뒤 보어 자리라 형용사 limitless(무한한)가 맞다."],["that_of","","","앞의 단수 명사 a magical quality(마법 같은 특성)를 대신 받는 that(그것)이 맞다."],["became","becoming","a","and(그리고) 앞 expressed(표현했다)가 과거형 동사라 뒤도 과거형 동사 became(되었다). becoming(되는)은 동사가 아니다."]],"opts":["become","became","to become","been"],"or":["become(되다): 원형·현재형으로 보면 과거 expressed(표현했다)와 시제가 안 맞고, 과거분사로 보면 have(~해 왔다)가 없어 동사가 못 됨.","became(되었다): and(그리고) 앞 expressed(표현했다)와 나란한 과거형 동사라 맞음.","to become(되는 것): to부정사는 동사 자리에 못 와서 짝이 깨짐.","been(be의 과거분사): have(~해 왔다) 없이 동사 자리에 못 오고, 뜻도 '되다'가 아님."],"point":"병렬구조","en":"Maud Lewis expressed her love for the world through her paintings and became an iconic figure in Canadian folk art.","ko":"Maud Lewis는 그림을 통해 세상에 대한 사랑을 표현했고, 캐나다 민속 예술의 상징적인 인물이 되었다.","hl":["expressed her love","became an iconic figure"],"khl":["사랑을 표현했고","상징적인 인물이 되었다"],"blocks":[{"t":"p","h":"저울 양쪽에 같은 무게","x":["주어 Maud Lewis(모드 루이스)의 동사가 두 개다.","expressed(표현했다) and became(되었다). 둘 다 과거형.","becoming(되는)을 올리면 한쪽은 동사, 한쪽은 -ing라 저울이 기운다.","그림으로 세상을 사랑한 결과, 캐나다 민속 예술의 상징이 되었다. 이 지문의 결론이다."]},{"t":"pair","h":"쉬운 예시","x":[["She opened the box and found a ring.","그녀는 상자를 열고 반지를 발견했다. (opened(열었다) and found(발견했다))"],["He came home and took a shower.","그는 집에 와서 샤워를 했다. (came(왔다) and took(했다))"]]}],"post":["과거 and 과거: expressed(표현했다) and became(되었다)"],"no":"본문 ③"}],"compquiz":[{"s":"My story was funny and ___ made into a cartoon.","o":["to be","was"],"a":1,"ko":"내 이야기는 재미있었고 만화로 만들어졌다.","why":"and(그리고) 앞 was(~였다)와 나란한 동사, 수동 was made(만들어졌다).","wy":"to be(~이 되는 것): 동사 자리에 못 와서 and(그리고) 앞 동사와 짝이 안 맞음."},{"s":"He finished dinner and ___ the dishes.","o":["washing","washed"],"a":1,"ko":"그는 저녁을 다 먹고 설거지를 했다.","why":"finished(끝냈다) and washed(씻었다). 과거형 동사끼리.","wy":"washing(씻는 것): -ing는 동사 자리에 못 와서 finished(끝냈다)와 짝이 안 맞음."}]},{"id":"tb3g-3d","no":"본문 ④","title":"어법특훈 · 공통영어2 3과 본문 ④","sub":"Anna Ancher","tpl":"Now let's take a look at the final artist of this exhibition: Anna Ancher, a famous painter from Denmark. When {observing|observing} her paintings, you may notice a common theme —they all {feature|feature} female figures. {born|Born} in Skagen, Denmark, in 1859, she later moved to Copenhagen {to_attend|to attend} a private painting school. After that, she even studied abroad in Paris, {which|which} was unusual for women at the time. Thanks to her mother's encouragement, she was able to {take|take} advantage of these opportunities. Even after {getting|getting} married, Ancher persisted in {painting|painting}, {objecting|objecting} to the social pressure {that_p|that} married women were to solely focus on household duties. Ancher differed from other artists of that era, {who|who} depicted women as still life subjects. In contrast, she showcased them as active participants in everyday tasks, as {seen|seen} in her works The Maid in the Kitchen and Sewing Fisherman's Wife. She also {skillfully|skillfully} explored light and color, {contributing|contributing} to the rich Impressionist movement in Denmark. In her painting Sunlight in the Blue Room, the reflection of the sunlight on the blue wall {is|is} stunningly {portrayed|portrayed}. Ancher challenged the conventional roles of women in the 20th century and {displayed|displayed} her exceptional artistic talent. Her paintings continue to {amaze|amaze} us to this day. Thank you for joining this guided tour, and I hope my explanations have {aided|aided} you in {appreciating|appreciating} these paintings. Please take some time to further explore the exhibition.","fn":["*persist in: ~을 계속하다","*still life: 정물화","*Impressionist movement: 인상주의 운동"],"mean":{"observing":"관찰하는(observe의 -ing형)","observed":"관찰된(observe의 과거분사형)","observe":"관찰하다(동사원형)","observes":"관찰하다(observe의 3인칭 단수 현재형)","observation":"관찰(명사)","feature":"등장시키다(동사원형·복수 주어 현재형)","featuring":"등장시키는(feature의 -ing형)","to feature":"등장시키는 것(feature의 to부정사)","features":"등장시키다(feature의 3인칭 단수 현재형)","having featured":"등장시키고 나서(feature의 완료 -ing형)","Born":"태어난(bear의 과거분사형, 분사구문)","to attend":"다니기 위해(attend의 to부정사, 목적)","which":"그것은, ~하는(사물·앞 내용을 받는 관계대명사)","that":"~라는(동격 접속사) / ~하는(관계대명사)","what":"~하는 것(선행사를 품은 관계대명사)","who":"~하는(사람을 받는 관계대명사)","whom":"~을(사람을 받는 목적격 관계대명사)","take":"활용하다, 타다(동사원형)","taking":"타는, 잡는(take의 -ing형)","took":"활용했다(take의 과거형)","taken":"take의 과거분사형","takes":"활용하다(take의 3인칭 단수 현재형)","getting":"~하게 되는 것(get의 -ing형, 동명사)","get":"~하게 되다(동사원형)","got":"~하게 되었다(get의 과거형)","gets":"~하게 되다(get의 3인칭 단수 현재형)","to get":"~하게 되는 것(get의 to부정사)","painting":"그림 그리기(paint의 -ing형, 동명사)","objecting":"반대하며(object의 -ing형, 분사구문)","objected":"반대했다(object의 과거형)","object":"반대하다(동사원형)","objects":"반대하다(object의 3인칭 단수 현재형)","have objected":"반대해 왔다(object의 현재완료형)","seen":"보이는(see의 과거분사형)","skillfully":"능숙하게(부사)","skillful":"능숙한(형용사)","skill":"기술(명사)","skills":"기술들(skill의 복수형)","skilled":"숙련된(형용사)","contributing":"기여하며(contribute의 -ing형, 분사구문)","is":"~이다(be의 현재형, 단수 주어)","are":"~이다(be의 현재형, 복수 주어)","being":"~되는 것, ~인(be의 -ing형)","to be":"~이 되는 것(be의 to부정사)","been":"~였던(be의 과거분사형)","portrayed":"묘사된(portray의 과거분사형)","displayed":"보여 주었다(display의 과거형)","displaying":"보여 주는(display의 -ing형)","display":"보여 주다(동사원형)","d en observing(관찰할 때). 접속사 When(~할 때)은 뜻을 분명히 하려고 남겼다.","보는 사람이 주어 you(여러분)다. 능동이니 -ing.","뒤에 목적어 her paintings(그녀의 그림)가 있다. p.p.는 목적어를 못 받는다. 능동의 증거."]},{"t":"pair","h":"쉬운 예시","x":[["When crossing the street, look both ways.","길을 건널 때는 양쪽을 봐라. (내가 건넘 → crossing(건너는))"],["When asked a question, he smiled.","질문을 받았을 때 그는 웃었다. (그가 질문을 받음 → asked(질문받은))"]]}],"post":["When(~할 때) + -ing: When observing her paintings(그녀의 그림을 볼 때)"]},{"slots":[["born","","","그녀가 '태어난' 쪽이라 수동의 분사구문 Born(태어난)이 맞다."],["to_attend","","","'회화 학교에 다니기 위해'라는 목적의 to부정사 to attend(다니기 위해)가 맞다."],["which","that","a","that(~하는)은 콤마 뒤에 쓸 수 없다. 콤마 뒤에서 앞 내용을 받을 땐 which(그것은)."],["take","","","was able to(~할 수 있었다) 뒤라 동사원형 take(활용하다)가 맞다."],["getting","","","전치사 after(~ 후에) 뒤라 동명사 getting(~하게 되는 것)이 맞다."]],"opts":["which","what","who","whom"],"or":["which(그것은): 콤마 뒤 계속적 용법으로 앞 내용 '파리 유학'을 받고 was(~였다)의 주어 역할이라 맞음.","what(~하는 것): 콤마 뒤에서 앞 내용을 받는 계속적 용법으로 쓸 수 없음.","who(~하는, 사람용): 사람이 아닌 '유학한 일'을 받을 수 없음.","whom(~을): 목적격이라 was(~였다)의 주어 자리에 못 오고, 사람만 받음."],"point":"관계대명사 계속적 용법 (which vs. that)","en":"After that, she even studied abroad in Paris, which was unusual for women at the time.","ko":"그 후 그녀는 파리에서 유학까지 했는데, 그것은 당시 여성들에게 드문 일이었다.","hl":["which was unusual for women"],"khl":["그것은 당시 여성들에게 드문 일이었다"],"blocks":[{"t":"p","h":"콤마 뒤 금지 단어 that","x":["콤마 + which(그것은) = and it(그리고 그것은).","여기서 which(그것은)는 Paris(파리)가 아니라 '파리에서 유학한 일' 전체를 받는다.","that(~하는)은 콤마 뒤 계속적 용법에 쓸 수 없다. 시험 단골 함정.","당시 여성에게 드문 해외 유학. Ancher(앵커)는 시작부터 남달랐다."]},{"t":"pair","h":"쉬운 예시","x":[["He passed the test, which surprised me.","그는 시험에 합격했는데, 그것이 나를 놀라게 했다. (앞 내용 전체 → which)"],["I have a cat, which sleeps all day.","나는 고양이가 있는데, 그 고양이는 하루 종일 잔다. (콤마 뒤 → which)"]]}],"post":["콤마 + which(그것은) / 콤마 + that(~하는)은 불가"]},{"slots":[["take","","","was able to(~할 수 있었다) 뒤라 동사원형 take(활용하다)가 맞다."],["getting","get","a","after(~ 후에) 뒤에 주어가 없으니 전치사. 전치사 뒤는 동명사 getting(~하게 되는 것). 원형 get(~하게 되다)은 못 온다."],["painting","","","persist in(~을 계속하다) + 동명사. painting(그림 그리기)이 맞다."],["objecting","","","동사 persisted(계속했다)가 이미 있어 덧붙임은 분사구문 objecting(반대하며)이 맞다."],["who","","","콤마 뒤에서 사람 other artists(다른 예술가들)를 받아 depicted(묘사했다)의 주어가 되는 who(그들은)가 맞다."]],"opts":["getting","got","gets","to get"],"or":["getting(~하게 되는 것): 전치사 after(~ 후에) 뒤 동명사라 맞음.","got(~하게 되었다, get의 과거형): 주어 없이 전치사 뒤에 동사가 올 수 없음.","gets(~하게 되다, 3인칭 단수형): 주어 없이 전치사 뒤에 동사가 올 수 없음.","to get(~하게 되는 것): 전치사 뒤에는 to부정사가 못 옴."],"point":"전치사 + 동명사","en":"Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties.","ko":"결혼한 후에도 Ancher는 기혼 여성은 오직 집안일에만 집중해야 한다는 사회적 압력에 반대하며 그림을 계속 그렸다.","hl":["Even after getting married"],"khl":["결혼한 후에도"],"blocks":[{"t":"p","h":"전치사 뒤 동사는 -ing 옷","x":["Even after(~한 후에도) 뒤에 주어가 없다. 전치사로 쓰였다.","전치사 뒤에 동사가 오려면 -ing 옷을 입는다. getting married(결혼하는 것).","같은 문장 persisted in painting(그림 그리기를 계속했다)의 in(~을) 뒤도 -ing.","결혼한 뒤에도 붓을 놓지 않았다. 시대의 압력에 맞선 Ancher(앵커)의 고집이다."]},{"t":"pair","h":"쉬운 예시","x":[["After finishing my homework, I watched TV.","숙제를 끝낸 후에 나는 텔레비전을 보았다. (After(~ 후에) + -ing)"],["He is good at drawing.","그는 그림을 잘 그린다. (전치사 at(~에) + -ing)"]]}],"post":["전치사 after(~ 후에) + -ing: after getting married(결혼한 후에)"]},{"slots":[["who","","","콤마 뒤에서 사람 other artists(다른 예술가들)를 받아 depicted(묘사했다)의 주어가 되는 who(그들은)가 맞다."],["seen","","","작품에서 '보이는' 것이라 as seen in(~에서 보이듯이), 과거분사 seen(보이는)이 맞다."],["skillfully","skillful","a","explored(탐구했다)라는 동사를 꾸미는 자리. 형용사 skillful(능숙한)은 동사를 꾸밀 수 없다."],["contributing","","","동사 explored(탐구했다)가 이미 있어 결과를 덧붙이는 분사구문 contributing(기여하며)이 맞다."],["is","","","주어의 머리는 the reflection(반사), 단수라 is(~이다)가 맞다."]],"opts":["skill","skills","skillfully","skilled"],"or":["skill(기술, 명사): 명사라 동사를 꾸밀 수 없음.","skills(기술들, 명사 복수형): 명사라 동사를 꾸밀 수 없음.","skillfully(능숙하게): 동사 explored(탐구했다)를 앞에서 꾸미는 부사라 맞음.","skilled(숙련된, 형용사): 형용사라 동사 explored(탐구했다)를 꾸밀 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"She also skillfully explored light and color, contributing to the rich Impressionist movement in Denmark.","ko":"그녀는 또한 빛과 색채를 능숙하게 탐구하여, 덴마크의 풍성한 인상주의 운동에 기여했다.","hl":["skillfully explored light and color"],"khl":["빛과 색채를 능숙하게 탐구하여"],"blocks":[{"t":"p","h":"주어와 동사 사이에 낀 말","x":["She also skillfully explored(그녀는 또한 능숙하게 탐구했다).","주어 She(그녀)와 동사 explored(탐구했다) 사이에서 동사를 꾸미는 말은 부사.","skillful(능숙한)은 a skillful painter(능숙한 화가)처럼 명사를 꾸민다.","빛과 색을 능숙하게 다뤄 덴마크 인상주의에 이름을 남겼다."]},{"t":"pair","h":"쉬운 예시","x":[["She quickly finished her lunch.","그녀는 빠르게 점심을 끝냈다. (동사 finished(끝냈다) ← 부사)"],["She is a quick runner.","그녀는 빠른 주자다. (명사 runner(주자) ← 형용사)"]]}],"post":["동사 앞에서 꾸미면 -ly: skillfully explored(능숙하게 탐구했다)"]},{"slots":[["portrayed","","","햇빛의 반사가 '묘사된' 쪽이라 is portrayed(묘사되어 있다), 수동태가 맞다."],["displayed","displaying","a","and(그리고) 앞 challenged(이의를 제기했다)가 과거형 동사라 뒤도 과거형 displayed(보여 주었다). displaying(보여 주는)은 동사가 아니다."],["amaze","","","continue to(계속 ~하다) 뒤라 원형 amaze(놀라게 하다)가 맞다. 그림이 우리를 놀라게 하는 능동이다."],["aided","","","have(~해 왔다) + 과거분사, 현재완료라 aided(도왔다)가 맞다."],["appreciating","","","aid A in -ing(A가 ~하는 것을 돕다). 전치사 in(~하는 데) 뒤라 동명사 appreciating(감상하는 것)이 맞다."]],"opts":["display","displayed","having displayed","to display"],"or":["display(보여 주다): 동사원형이라 단수 주어 Ancher(앵커)와 수가 안 맞고, 과거 challenged(이의를 제기했다)와 시제도 안 맞음.","displayed(보여 주었다): and(그리고) 앞 challenged(이의를 제기했다)와 나란한 과거형 동사라 맞음.","having displayed(보여 주고 나서): -ing형이라 동사 자리에 못 와서 challenged(이의를 제기했다)와 짝이 깨짐.","to display(보여 주는 것): to부정사는 동사 자리에 못 와서 짝이 깨짐."],"point":"병렬구조","en":"Ancher challenged the conventional roles of women in the 20th century and displayed her exceptional artistic talent.","ko":"Ancher는 20세기 여성의 전통적인 역할에 이의를 제기했고, 뛰어난 예술적 재능을 보여 주었다.","hl":["challenged","displayed her exceptional artistic talent"],"khl":["이의를 제기했고","뛰어난 예술적 재능을 보여 주었다"],"blocks":[{"t":"p","h":"and(그리고)로 묶인 두 행동","x":["주어 Ancher(앵커)가 한 일 두 가지.","challenged(이의를 제기했다) and displayed(보여 주었다). 둘 다 과거형 동사.","displaying(보여 주는)을 넣으면 한쪽만 동사라 짝이 깨진다.","전통적인 여성 역할에 맞서고, 동시에 실력으로 증명했다. Ancher(앵커) 이야기의 결론이다."]},{"t":"pair","h": ed","","","햇빛의 반사가 '묘사된' 쪽이라 is portrayed(묘사되어 있다), 수동태가 맞다."],["displayed","","","and(그리고) 앞 challenged(이의를 제기했다)와 나란한 과거형 displayed(보여 주었다)가 맞다."]],"opts":["being","is","to be","been"],"or":["being(~되는 것): -ing는 혼자 동사 자리에 못 옴.","is(~이다): 주어의 머리 the reflection(반사)이 단수라 맞음.","to be(~이 되는 것): to부정사는 동사 자리에 못 옴.","been(be의 과거분사): have(~해 왔다) 없이 혼자 동사 자리에 못 옴."],"point":"수식받는 주어의 수일치","en":"In her painting Sunlight in the Blue Room, the reflection of the sunlight on the blue wall is stunningly portrayed.","ko":"그녀의 작품 〈푸른 방의 햇빛〉에서는 푸른 벽에 비친 햇빛의 반사가 굉장히 아름답게 묘사되어 있다.","hl":["the reflection","is stunningly portrayed"],"khl":["햇빛의 반사가","아름답게 묘사되어 있다"],"blocks":[{"t":"p","h":"꼬리 자르기","x":["머리 the reflection(반사) + 꼬리 of the sunlight on the blue wall(푸른 벽에 비친 햇빛의).","꼬리를 자르면 the reflection(반사)만 남는다. 단수.","꼬리가 길어도 동사는 머리를 보고 정한다.","햇빛이 벽에 비쳐 반짝이는 순간. Ancher(앵커)가 빛을 얼마나 잘 다뤘는지 보여 주는 작품이다."]},{"t":"pair","h":"쉬운 예시","x":[["The color of the leaves is red.","그 잎들의 색깔은 빨간색이다. (머리 The color(색깔) → is(~이다))"],["The pictures on the wall are old.","벽에 걸린 사진들은 오래되었다. (머리 The pictures(사진들) → are(~이다))"]]}],"post":["꼬리 떼고 머리(the reflection = 반사) 보고 동사 결정: is(~이다)"]},{"slots":[["portrayed","","","햇빛의 반사가 '묘사된' 쪽이라 is portrayed(묘사되어 있다), 수동태가 맞다."],["displayed","","","and(그리고) 앞 challenged(이의를 제기했다)와 나란한 과거형 displayed(보여 주었다)가 맞다."],["amaze","","","continue to(계속 ~하다) 뒤라 원형 amaze(놀라게 하다)가 맞다. 그림이 우리를 놀라게 하는 능동이다."],["aided","aid","a","have(~해 왔다) 뒤에는 과거분사가 와야 현재완료가 된다. 원형 aid(돕다)는 못 온다."],["appreciating","","","aid A in -ing(A가 ~하는 것을 돕다). 전치사 in(~하는 데) 뒤라 동명사 appreciating(감상하는 것)이 맞다."]],"opts":["aiding","aids","be aided","aided"],"or":["aiding(돕는): have(~해 왔다) 뒤에 -ing는 못 옴.","aids(돕다, 3인칭 단수형): have(~해 왔다) 뒤에 현재형 동사는 못 옴.","be aided(도움을 받다): have(~해 왔다) 뒤에 be 원형이 못 오고, 뒤 목적어 you(여러분)와도 안 맞음.","aided(aid의 과거분사형): have(~해 왔다) + p.p. 현재완료이고, 설명이 여러분을 '도운' 능동이라 맞음."],"point":"현재완료 (have + p.p.)","en":"Thank you for joining this guided tour, and I hope my explanations have aided you in appreciating these paintings.","ko":"이번 가이드 투어에 참여해 주셔서 감사하며, 제 설명이 여러분이 이 그림들을 감상하는 데 도움이 되었기를 바란다.","hl":["have aided you in appreciating"],"khl":["감상하는 데 도움이 되었기를"],"blocks":[{"t":"p","h":"have(~해 왔다)의 짝은 p.p.","x":["현재완료 = have(~해 왔다) + p.p. 지금까지의 일을 돌아보는 말.","my explanations have aided you(제 설명이 여러분을 도왔다).","설명이 여러분을 돕는 쪽이라 능동 현재완료. 수동 have been aided(도움을 받아 왔다)가 아니다.","투어를 마치며 도슨트가 건네는 마지막 인사다."]},{"t":"pair","h":"쉬운 예시","x":[["I have finished my homework.","나는 숙제를 다 끝냈다. (have + finished(끝낸))"],["She has helped me a lot.","그녀는 나를 많이 도와주었다. (has + helped(도운))"]]}],"post":["have + p.p.: have aided(도왔다)"]}],"quiz":[{"s":"My parents ___ in Busan.","o":["live","living"],"a":0,"ko":"우리 부모님은 부산에 사신다.","why":"주어 뒤 동사 자리라 live(살다).","wy":"living(사는): -ing는 혼자 동사 자리에 못 옴."},{"s":"I was able to ___ the bus.","o":["catch","catching"],"a":0,"ko":"나는 버스를 탈 수 있었다.","why":"was able to(~할 수 있었다) 뒤는 동사원형.","wy":"catching(잡는): to부정사의 to 뒤에 -ing는 못 옴."},{"s":"He stood at the door, ___ for his friend.","o":["waited","waiting"],"a":1,"ko":"그는 친구를 기다리며 문 앞에 서 있었다.","why":"동사 stood(서 있었다)가 있으니 덧붙임은 -ing.","wy":"waited(기다렸다): 접속사 없이 동사 stood(서 있었다) 뒤에 동사가 또 올 수 없음."},{"s":"The color of the flowers ___ beautiful.","o":["is","are"],"a":0,"ko":"그 꽃들의 색깔은 아름답다.","why":"머리 The color(색깔)가 단수라 is(~이다).","wy":"are(~이다, 복수용): 꼬리 flowers(꽃들)에 속은 답. 주어는 단수 The color(색깔)."},{"s":"I have ___ this book twice.","o":["reading","read"],"a":1,"ko":"나는 이 책을 두 번 읽었다.","why":"have + p.p. read(읽은).","wy":"reading(읽는): have(~해 왔다) 뒤에 -ing는 못 옴."}]}],"comp":[{"slots":[["getting","","","전치사 after(~ 후에) 뒤라 동명사 getting(~하게 되는 것)이 맞다."],["objecting","","","동사 persisted(계속했다)가 이미 있어 덧붙임은 분사구문 objecting(반대하며)이 맞다."],["that_p","which","a","뒤 문장 married women were to solely focus on household duties(기혼 여성은 오직 집안일에만 집중해야 한다)는 빈자리 없이 완전하다. 압력의 '내용'을 푸는 동격 that(~라는)이라 which(~하는)는 틀린다."],["who","","","콤마 뒤에서 사람 other artists(다른 예술가들)를 받아 depicted(묘사했다)의 주어가 되는 who(그들은)가 맞다."],["skillfully","","","동사 explored(탐구했다)를 꾸미니 부사 skillfully(능숙하게)가 맞다."]],"opts":["that","what","who","whom"],"or":["that(~라는): 명사 the social pressure(사회적 압력)의 내용을 완전한 문장으로 풀어 주는 동격 접속사라 맞음.","what(~하는 것): 앞에 명사가 있으면 못 쓰고, 뒤 문장도 완전함.","who(~하는, 사람용): 앞 명사 pressure(압력)는 사람이 아니고, 뒤 문장도 완전함.","whom(~을): 사람을 받는 목적격이라 pressure(압력)에 못 쓰고, 뒤에 목적어 빈자리도 없음."],"point":"동격 that vs. 관계대명사 which","en":"Even after getting married, Ancher persisted in painting, objecting to the social pressure that married women were to solely focus on household duties.","ko":"결혼한 후에도 Ancher는 기혼 여성은 오직 집안일에만 집중해야 한다는 사회적 압력에 반대하며 그림을 계속 그렸다.","hl":["the social pressure that married women were to solely focus on household duties"],"khl":["기혼 여성은 오직 집안일에만 집중해야 한다는 사회적 압력"],"blocks":[{"t":"p","h":"that(~라는) 뒤가 완전하면 내용 설명","x":["married women(기혼 여성) / were to focus(집중해야 했다) / on household duties(집안일에).","주어, 동사, 전치사 뒤 명사까지 다 있다. 빈자리가 없다.","빈자리가 없으면 관계대명사 which(~하는)가 아니라, 앞 명사의 내용을 푸는 동격 that(~라는).","'여자는 집안일만 하라'는 압력의 내용이다. Ancher(앵커)는 그 압력에 맞섰다."]},{"t":"pair","h":"쉬운 예시","x":[["I heard the news that he won the race.","나는 그가 경주에서 이겼다는 소식을 들었다. (뒤가 완전 → 동격 that)"],["I read the book which you gave me.","나는 네가 준 책을 읽었다. (gave(주었다)의 목적어 빠짐 → which)"]]},{"t":"tap","h":"덤으로 하나","q":"were to solely focus(오직 집중해야 했다)의 were to(~해야 했다)는 무슨 뜻일까?","a":["be to + 동사원형 = ~해야 한다(의무).","to와 동사원형 focus(집중하다) 사이에 부사 solely(오직)가 끼어 있다."]}],"post":["명사(the social pressure) + that(~라는) + 완전한 문장 = ~라는 압력"],"no":"본문 ④"},{"slots":[["feature","","","주어 they all(그것들 모두)의 동사 자리라 복수 현재형 feature(등장시키다)가 맞다."],["which","","","콤마 뒤에서 앞 내용(파리 유학)을 받아 was(~였다)의 주어가 되는 which(그것은)가 맞다."],["is","","","주어의 머리는 the reflection(반사), 단수라 is(~이다)가 맞다."],["aided","","","have(~해 왔다) + 과거분사, 현재완료라 aided(도왔다)가 맞다."],["appreciating","appreciate","a","aid A in -ing(A가 ~하는 것을 돕다). in(~하는 데)은 전치사라 원형 appreciate(감상하다)는 못 온다."]],"opts":["appreciated","appreciates","to appreciate","appreciating"],"or":["appreciated(감상했다, 과거형·과거분사형): 전치사 뒤에 동사나 과거분사가 그대로 올 수 없음.","appreciates(감상하다, 3인칭 단수형): 전치사 뒤에 동사가 올 수 없음.","to appreciate(감상하는 것): 전치사 in(~하는 데) 뒤에는 to부정사가 못 옴.","appreciating(감상하는 것): 전치사 in(~하는 데) 뒤 동명사라 맞음."],"point":"전치사 + 동명사","en":"Thank you for joining this guided tour, and I hope my explanations have aided you in appreciating these paintings.","ko":"이번 가이드 투어에 참여해 주셔서 감사하며, 제 설명이 여러분이 이 그림들을 감상하는 데 도움이 되었기를 바란다.","hl":["in appreciating these paintings"],"khl":["이 그림들을 감상하는 데"],"blocks":[{"t":"p","h":"전치사 두 개, 둘 다 -ing","x":["Thank you for joining(참여해 주셔서 감사합니다): 전치사 for(~에 대해) + -ing.","aided you in appreciating(여러분이 감상하는 데 도움이 된): 전치사 in(~하는 데) + -ing.","한 문장에 전치사 + -ing가 두 번. 시험은 둘 중 하나를 노린다.","세 예술가의 그림을 제대로 감상하도록 도왔기를 바란다는 마무리 인사다."]},{"t":"pair","h":"쉬운 예시","x":[["She is interested in learning Chinese.","그녀는 중국어를 배우는 데 관심이 있다. (in(~에) + -ing)"],["He left without saying goodbye.","그는 작별 인사도 없이 떠났다. (without(~ 없이) + -ing)"]]}],"post":["aid A in -ing(A가 ~하는 것을 돕다): aided you in appreciating(여러분이 감상하는 데 도움이 된)"],"no":"본문 ④"}],"compquiz":[{"s":"There is a rumor ___ our teacher will leave.","o":["that","which"],"a":0,"ko":"우리 선생님이 떠나실 거라는 소문이 있다.","why":"뒤가 완전한 문장이라 a rumor(소문)의 내용을 푸는 동격 that(~라는).","wy":"which(~하는): 뒤에 빈자리가 있어야 하는데 our teacher will leave(선생님이 떠나실 것이다)는 완전함."},{"s":"He is good at ___ pictures.","o":["taking","take"],"a":0,"ko":"그는 사진을 잘 찍는다.","why":"전치사 at(~에) 뒤는 -ing.","wy":"take(찍다): 전치사 at(~에) 뒤에 동사원형은 못 옴."}]}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
