<title>어법특훈 · 공통영어2 능률(민) 4과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#d9dee5;
  --accent:#0e6a6a; --accent-soft:#e1f1f0;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3372f; --bad-soft:#fbe6e4;
  --note:#fff1a6; --note-ink:#4a3d00;
  --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--sub);font-size:.9rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.q{font-weight:700;margin:0 0 12px;text-wrap:balance}
.passage{font-size:1.02rem;line-height:2.15;word-break:keep-all;overflow-wrap:break-word}
.passage .fn{display:block;font-size:.82rem;line-height:1.5;color:var(--sub);margin-top:10px}
button{font:inherit;color:inherit}
button.u{background:none;border:0;border-bottom:2px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;border-radius:2px}
button.u b{font-size:.72em;color:var(--accent);margin-right:3px;font-weight:700}
button.u:focus-visible,.opt:focus-visible,.btn:focus-visible,.ck:focus-visible,.setbtn:focus-visible,.tapq:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.u.right{background:var(--ok-soft);border-color:var(--ok)}
button.u.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.u:disabled{cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt,.ck{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.opt b{color:var(--accent);font-weight:700}
.opt.right,.ck.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.ck.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck small,.opt small{color:var(--sub);font-size:.82rem}
.ck .tag{font-size:.78rem;font-weight:700;color:var(--sub)}
.ck.right .tag{color:var(--ok)}
.ck.wrong .tag{color:var(--bad)}
.opt:disabled,.ck:disabled{cursor:default}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:flex;flex-direction:column;gap:16px}
.exp h3{margin:0 0 4px;font-size:.92rem;color:var(--accent);font-weight:700}
.exp p{margin:0}
.lines p+p{margin-top:2px}
.words{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.words li span{color:var(--sub)}
.words li.sw{color:var(--bad)}
.words li.sy b{color:var(--ok)}
.evi .en{font-weight:500}
mark{background:#ffe45c;color:inherit;border-radius:3px;padding:0 2px}
mark.k{font-weight:700}
.evi .ko{color:var(--sub);font-size:.95rem}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
.flow li.at{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li .e{font-weight:500}
.pairs li .k{color:var(--sub);font-size:.95rem;display:block}
.tapq{width:100%;text-align:left;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.tapa{margin-top:8px;padding-left:12px;border-left:3px solid var(--accent)}
.postit{background:var(--note);color:var(--note-ink);padding:12px 14px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);font-weight:500;transform:rotate(-.6deg)}
.postit p+p{margin-top:2px}
.stamps{display:flex;gap:10px}
.stamp{flex:1;border:2px dashed var(--line);border-radius:10px;text-align:center;padding:14px 4px;color:var(--sub);font-weight:700}
.stamp.done{border:3px solid var(--accent);color:var(--accent);background:var(--accent-soft);transform:rotate(-2deg)}
.setlist{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font-weight:700}
.setbtn small{color:var(--sub);font-weight:500}
.setbtn.done{border-color:var(--accent)}
.setbtn.done small{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:6px;display:flex;justify-content:center}
.sub{color:var(--sub);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.board h2{font-size:.95rem;margin:4px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;line-height:1.3}
.tile small{display:block;font-weight:500;color:var(--sub);font-size:.72rem;margin-top:2px}
.tile.done{border:2.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.done small{color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.lock{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.pt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px;font-size:.9rem}
.gs{font-size:1.05rem;line-height:1.9}
.chk li.bad{color:var(--bad)}
.chk li span{color:var(--sub)}
.nobadge{font-size:.8rem;color:var(--sub);font-weight:700}
.neg{background:linear-gradient(transparent 45%,#f6e27a 45%)}
mark{background:linear-gradient(transparent 45%,#f6e27a 45%)!important;padding:0}
.band{border-radius:10px;background:var(--bad-soft);border:1.5px solid var(--bad);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.band b{color:var(--bad);font-size:1rem}
.band span{font-weight:700}
.band small{color:var(--sub);font-size:.85rem}
.chs{display:flex;flex-direction:column;gap:10px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#f8f9fb}
.ch.ok{border-color:var(--ok);background:linear-gradient(90deg,#e3f4ea,#fff)}
.ch.me{border-color:var(--bad);background:linear-gradient(90deg,#fbe6e4,#fff)}
.chtop{display:flex;gap:10px;align-items:flex-start}
.chn{color:var(--sub);min-width:1.4em}
.chw{flex:1;display:flex;flex-direction:column;font-size:1.08rem;font-weight:500}
.chw small{font-size:.85rem;color:var(--sub);font-weight:400}
.chtag{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.chtag.ok{color:var(--ok);border-color:var(--ok);background:#fff}
.chtag.me{color:var(--bad);border-color:var(--bad);background:#fff}
.chr{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);color:#3a4654;font-size:.95rem}
.ch.ok .chr{border-left-color:var(--ok)}
.ch.me .chr{border-left-color:var(--bad)}
.note{background:#fff8d6;border:1.5px solid #f0d36a;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.note .nt{font-weight:700;color:#7a5d00;font-size:.9rem;margin-bottom:4px}
.note .nko{color:var(--sub);font-size:.92rem}
.ck.miss{border-color:var(--ok);border-style:dashed}
.top .back{padding:6px 12px;font-size:.85rem;align-self:center}
</style>
</head>

,["keep","","","help(돕다) + us(우리) + 동사원형. keep(유지하다)이 맞다."]],"opts":["by which","that","what","whose"],"or":["by which(그것에 의해): 박테리아가 the process(그 과정)에 의해 분해한다는 뜻이고 뒤 문장이 완전해서 맞음.","that(~하는): 관계대명사 that(~하는) 뒤에는 빈자리가 있어야 하는데 뒤 문장이 완전하고, 앞에 전치사도 붙일 수 없음.","what(~하는 것): 앞에 꾸밀 명사 the process(그 과정)가 이미 있어서 못 옴.","whose(~의): 뒤에 명사가 바로 붙어 '그 과정의 ~'가 되어야 하는데 the bacteria(그 박테리아)는 과정의 것이 아니고 관사도 있음."],"point":"전치사 + 관계대명사","en":"They also want to speed up the process by which the bacteria break down plastic.","ko":"그들은 또한 박테리아가 플라스틱을 분해하는 과정의 속도를 높이고 싶어 한다.","hl":["the process by which"],"khl":["분해하는 과정"],"blocks":[{"t":"p","h":"두 문장을 하나로","x":["① They want to speed up the process. (그들은 그 과정의 속도를 높이고 싶어 한다)","② The bacteria break down plastic by the process. (박테리아는 그 과정에 의해 플라스틱을 분해한다)","②의 the process(그 과정)를 which(그것)로 바꾸고 by(~에 의해)까지 함께 앞으로 데려온다.","그래서 by which(그것에 의해) + 완전한 문장."]},{"t":"p","h":"본문 속 위치","x":["과학자들의 두 가지 목표 중 두 번째다.","첫째, 박테리아를 밀웜 몸 밖에서 배양하기.","둘째, 박테리아가 플라스틱을 분해하는 속도 높이기."]},{"t":"pair","h":"쉬운 예시","x":[["This is the pen with which I write letters.","이것은 내가 편지를 쓰는 펜이다. (I write letters with the pen(나는 그 펜으로 편지를 쓴다))"],["This is the pen which I bought.","이것은 내가 산 펜이다. (bought(샀다)의 목적어가 빔 → which)"]]}],"post":["전치사 + which(그것) + 완전한 문장: the process by which the bacteria break down plastic(박테리아가 플라스틱을 분해하는 과정)"]}],"compquiz":[{"s":"The rain stopped us from ___ out.","o":["go","going"],"a":1,"ko":"비 때문에 우리는 나가지 못했다.","why":"전치사 from(~로부터) 뒤는 -ing.","wy":"go(가다): 동사원형은 전치사 from(~로부터) 뒤에 못 옴."},{"s":"This is the pen ___ I write letters.","o":["which","with which"],"a":1,"ko":"이것은 내가 편지를 쓰는 펜이다.","why":"뒤 문장이 완전하고 '그 펜으로'라서 with which(그것으로).","wy":"which(~하는): 뒤 I write letters(나는 편지를 쓴다)가 완전해서 빈자리가 없음."}]},{"id":"cs1-g4c","no":"본문 ③","title":"어법특훈 · 공통영어2 4과 본문 ③","sub":"버드나무로 오염된 토양 정화하기","tpl":"Mining and other industries {are0|are} causing soil pollution across the globe. {although|Although} polluted soil can {be_dug|be dug} up and transported to a landfill, this process {is1|is} expensive. Moreover, it only {moves|moves} the problem to another area and {does|does} not really solve it. Fortunately, there {is2|is} an eco-friendly and cost-effective way {to_restore|to restore} polluted soil— planting willow trees. These {amazing|amazing} trees have extensive and well-developed root systems. As a result, they {extract|naturally extract} a wide range of harmful materials from the soil. They can also {grow|grow} quickly, even in soil with a high acidity level or a lot of heavy metals in it. Research on the effectiveness of {using|using} willow trees for this purpose {is3|is} in development. Scientists have found {that|that} some species of willow trees are able to absorb harmful materials {better|better} than others. Therefore, this promising area should be further explored to find out which trees are the most {effective|effective}. In time, we may be able to {clean|clean} up our land with willow trees.","fn":["*willow tree: 버드나무","*acidity: 산성도","*heavy metal: 중금속","*extract: 추출하다, 뽑아내다"],"mean":{"are":"~이다(be의 현재형, 복수 주어)","is":"~이다(be의 현재형, 단수 주어)","be":"~이다(be의 원형)","being":"~인 것, ~인(be의 -ing형)","to be":"~인 것, ~이기 위해(be의 to부정사)","been":"~였던(be의 과거분사형)","has":"가지다(have의 3인칭 단수 현재형)","Although":"비록 ~이지만(접속사, 뒤에 주어 + 동사)","Despite":"~에도 불구하고(전치사, 뒤에 명사)","In spite of":"~에도 불구하고(전치사구, 뒤에 명사)","Because of":"~ 때문에(전치사구, 뒤에 명사)","Due to":"~ 때문에(전치사구, 뒤에 명사)","be dug":"파내어지다(dig의 수동형)","dig":"파다(동사원형)","digging":"파는 것, 파는(dig의 -ing형)","to dig":"파는 것(dig의 to부정사)","dug":"팠다(dig의 과거형·과거분사형)","moves":"옮기다(move의 3인칭 단수 현재형)","moving":"옮기는 것, 옮기는(move의 -ing형)","move":"옮기다(동사원형)","to move":"옮기는 것(move의 to부정사)","is moved":"옮겨지다(move의 수동형)","does":"하다(do의 3인칭 단수 현재형, 부정문을 만드는 조동사)","to restore":"복구하는, 복구하기 위해(restore의 to부정사)","restore":"복구하다(동사원형)","restores":"복구하다(restore의 3인칭 단수 현재형)","restored":"복구했다(restore의 과거형·과거분사형)","restoration":"복구(명사)","amazing":"놀라운, 놀라움을 주는(amaze의 -ing형)","amazed":"놀란(amaze의 과거분사형)","amaze":"놀라게 하다(동사원형)","amazes":"놀라게 하다(amaze의 3인칭 단수 현재형)","amazingly":"놀랍게도(부사)","naturally extract":"자연적으로 추출하다(능동, 복수 주어)","are naturally extracted":"자연적으로 추출되다(extract의 수동형)","naturally extracts":"자연적으로 추출하다(extract의 3인칭 단수 현재형)","naturally extracting":"자연적으로 추출하는(extract의 -ing형)","to naturally extract":"자연적으로 추출하는 것(extract의 to부정사)","grow":"자라다(동사원형)","using":"활용하는 것(use의 -ing형, 동명사)","use":"활용하다(동사원형)","uses":"활용하다(use의 3인칭 단수 현재형)","to use":"활용하는 것(use의 to부정사)","being used":"활용되는 것(use의 수동 -ing형)","that":"~라는 것(완전한 문장을 묶는 접속사)","what":"~하는 것(선행사를 품은 관계대명사)","which":"~하는(관계대명사) / 어느(의문사)","whose":"~의(소유격 관계대명사)","because of":"~ 때문에(전치사, 뒤에 명사)","better":"더 잘(well의 비교급)","best":"가장 잘(well의 최상급)","good":"좋은(형용사)","well":"잘(부사)","most":"가장 많이, 가장(much·many의 최상급)","effective":"효과적인(형용사)","effectively":"효과적으로(부사)","effect":"효과(명사)","efficiently":"효율적으로(부사)","effectiveness":"효과성, 효율성(명사)","clean":"깨끗이 하다(동사원형)","eat":"먹다(동사원형·현재형)","are eaten":"먹히다(eat의 수동형)","make":"만들다(동사원형)","be made":"만들어지다(make의 수동형)","washes":"씻다(wash의 3인칭 단수 현재형)","washing":"씻는 것, 씻는(wash의 -ing형)","save":"모으다, 아끼다(동사원형)","to save":"모으는, 아끼는(save의 to부정사)","draw":"그리다(동사원형)","drawing":"그리는 것(draw의 -ing형, 동명사)"},"sets":[{"items":[{"slots":[["are0","","","주어 Mining and other industries(광산업과 다른 산업들)는 A and B라 복수, are(~이다)가 맞다."],["although","Despite","a","뒤에 polluted soil can be dug up(오염된 흙이 파내어질 수 있다)이라는 주어 + 동사 문장이 온다. Despite(~에도 불구하고)는 전치사라 문장을 받을 수 없다."],["be_dug","","","오염된 흙은 사람이 파내는 대상이라 수동 be dug(파내어지다)가 맞다."],["is1","","","주어 this process(이 과정)가 단수라 is(~이다)가 맞다."],["moves","","","주어 it(이것)이 단수이고 문제를 옮기는 쪽이라 moves(옮기다)가 맞다."]],"opts":["Although","Because of","In spite of","Due to"],"or":["Although(비록 ~이지만): 접속사라 뒤에 주어 polluted soil(오염된 흙) + 동사 can be dug(파내어질 수 있다)를 받을 수 있어 맞음.","Because of(~ 때문에): 전치사구라 뒤에 문장이 못 오고, '비록 ~이지만'이라는 양보의 뜻과도 안 맞음.","In spite of(~에도 불구하고): 뜻은 비슷하지만 전치사구라 뒤에 주어 + 동사 문장을 받을 수 없음.","Due to(~ 때문에): 전치사구라 문장을 못 받고 뜻도 안 맞음."],"point":"접속사 vs. 전치사","en":"Although polluted soil can be dug up and transported to a landfill, this process is expensive.","ko":"비록 오염된 흙이 파내어져 매립지로 옮겨질 수는 있지만, 이 과정은 비용이 많이 든다.","hl":["Although polluted soil can be dug up"],"khl":["비록 오염된 흙이 파내어져"],"blocks":[{"t":"p","h":"흙을 퍼 나르는 방법의 한계","x":["광산업 같은 산업이 전 세계 흙을 더럽히고 있다.","오염된 흙을 파서 매립지로 옮길 수는 있다.","하지만 돈이 많이 든다.","게다가 문제를 다른 곳으로 옮길 뿐, 진짜로 해결하지 못한다.","'할 수는 있지만 문제다'라는 흐름이라 Although(비록 ~이지만)."]},{"t":"p","h":"문 앞의 문지기","x":["Although(비록 ~이지만)는 접속사, 문장(주어 + 동사)을 들여보낸다.","Despite(~에도 불구하고)는 전치사, 명사만 들여보낸다.","뒤에 polluted soil(오염된 흙) + can be dug(파내어질 수 있다)가 있으니 문장이다.","문장 앞 문지기는 접속사 Although(비록 ~이지만)."]},{"t":"pair","h":"쉬운 예시","x":[["Although it was raining, we played soccer.","비가 오고 있었지만 우리는 축구를 했다. (뒤에 문장 → Although(비록 ~이지만))"],["Despite the rain, we played soccer.","비에도 불구하고 우리는 축구를 했다. (뒤에 명사 the rain(비) → Despite)"]]}],"post":["Although(비록 ~이지만) + 문장 / Despite(~에도 불구하고) + 명사"]},{"slots":[["moves","","","주어 it(이것)이 단수이고 문제를 옮기는 쪽이라 moves(옮기다)가 맞다."],["does","","","주어 it(이것)이 단수라 부정문 도우미 does(하다)가 맞다."],["is2","are","a","there is(~이 있다) 뒤에 오는 명사가 진짜 주어다. an eco-friendly and cost-effective way(친환경적이고 비용 효율적인 방법 하나)가 단수라 is(~이다)여야 한다."],["to_restore","","","way(방법)를 뒤에서 꾸미는 to부정사 to restore(복구하는)가 맞다."],["amazing","","","나무가 보는 사람을 놀라게 하는 쪽이라 amazing(놀라운)이 맞다."]],"opts":["is","be","being","has"],"or":["is(~이 있다): 뒤의 진짜 주어 an eco-friendly and cost-effective way(친환경적이고 비용 효율적인 방법)가 단수라 맞음.","be(~이다): 문장의 동사 자리에 be 원형이 그대로 올 수 없음.","being(~인): -ing만으로는 동사가 못 되어 문장에 동사가 없어짐.","has(가지다): there(거기) 뒤에는 '있다'를 뜻하는 be동사가 오지 has(가지다)가 오지 않음."],"point":"주어와 동사의 수일치 (there is/are)","en":"Fortunately, there is an eco-friendly and cost-effective way to restore polluted soil— planting willow trees.","ko":"다행히도, 오염된 흙을 복구하는 친환경적이고 비용 대비 효과적인 방법이 있는데, 바로 버드나무를 심는 것이다.","hl":["there is an eco-friendly and cost-effective way"],"khl":["친환경적이고 비용 대비 효과적인 방법이 있는데"],"blocks":[{"t":"p","h":"반전의 Fortunately(다행히도)","x":["앞에서는 흙을 퍼 나르는 방법이 비싸고 근본 해결이 아니라고 했다.","그 다음 Fortunately(다행히도)로 분위기가 바뀐다.","해결책은 버드나무 심기.","친환경적이고 돈도 덜 드는 방법 하나를 소개하는 문장이다."]},{"t":"p","h":"there는 주어가 아니다","x":["there is/are(~이 있다)에서 there(거기)는 자리만 채우는 말이다.","진짜 주어는 동사 뒤에 온다.","an ... way(방법 하나)는 a(n)가 붙은 단수라 is(~이다).","중간의 eco-friendly and cost-effective(친환경적이고 비용 효율적인)에 and(그리고)가 있다고 복수로 착각하면 안 된다. 둘 다 way(방법) 하나를 꾸민다."]},{"t":"pair","h":"쉬운 예시","x":[["There is a cat on the roof.","지붕 위에 고양이 한 마리가 있다. (a cat(고양이 한 마리) → is)"],["There are two cats on the roof.","지붕 위에 고양이 두 마리가 있다. (two cats(고양이 두 마리) → are)"]]}],"post":["there is(~이 있다) + 단수 / there are(~이 있다) + 복수: there is an ... way(방법이 하나 있다)"]},{"slots":[["amazing","","","나무가 보는 사람을 놀라게 하는 쪽이라 amazing(놀라운)이 맞다."],["extract","are naturally extracted","a","주어 they(버드나무들)가 해로운 물질을 뽑아내는 쪽이고, 뒤에 목적어 a wide range of harmful materials(광범위한 해로운 물질들)가 있다. 수동태는 목적어를 받을 수 없다."],["grow","","","조동사 can(~할 수 있다) 뒤라 동사원형 grow(자라다)가 맞다."],["using","","","전치사 of(~의) 뒤라 동명사 using(활용하는 것)이 맞다."],["is3","","","주어는 맨 앞 Research(연구), 단수라 is(~이다)가 맞다."]],"opts":["naturally extract","naturally extracts","naturally extracting","to naturally extract"],"or":["naturally extract(자연적으로 추출하다): 주어 they(그것들)가 복수이고 목적어를 뽑아내는 능동이라 맞음.","naturally extracts(자연적으로 추출하다, 3인칭 단수형): 주어 they(그것들)는 복수라 s를 붙이면 안 됨.","naturally extracting(자연적으로 추출하는): -ing만으로는 동사가 못 되어 문장에 동사가 없어짐.","to naturally extract(자연적으로 추출하는 것): to부정사는 문장의 동사 자리에 못 옴."],"point":"능동태 vs. 수동태","en":"As a result, they naturally extract a wide range of harmful materials from the soil.","ko":"그 결과, 그것들은 토양에서 광범위한 해로운 물질들을 자연적으로 추출한다.","hl":["they naturally extract a wide range of harmful materials"],"khl":["광범위한 해로운 물질들을 자연적으로 추출한다"],"blocks":[{"t":"p","h":"뿌리가 빨대처럼","x":["버드나무는 넓고 잘 발달된 뿌리를 가졌다.","As a result(그 결과), 뿌리가 흙 속 해로운 물질을 쭉 빨아들인다.","나무가 '하는 쪽', 해로운 물질은 '당하는 쪽'.","그래서 they(버드나무들) + extract(추출하다) + 목적어, 능동이다."]},{"t":"p","h":"목적어가 보이면 능동","x":["능동: 주어가 목적어에게 무언가를 한다.","수동(be + p.p.): 주어가 당한다. 원래 목적어가 주어로 올라가서 뒤에는 목적어가 없다.","이 문장은 동사 뒤에 a wide range of harmful materials(광범위한 해로운 물질들)가 그대로 있다.","목적어가 남아 있으니 are naturally extracted(자연적으로 추출된다)는 들어갈 수 없다."]},{"t":"pair","h":"쉬운 예시","x":[["The kids eat their lunch quickly.","아이들은 점심을 빨리 먹는다. (목적어 their lunch(그들의 점심) → 능동)"],["The lunch is eaten quickly.","점심은 빨리 먹힌다. (뒤에 목적어 없음 → 수동)"]]}],"post":["뒤에 목적어 있으면 능동: they naturally extract harmful materials(그것들이 해로운 물질을 추출한다)"]},{"slots":[["using","","","전치사 of(~의) 뒤라 동명사 using(활용하는 것)이 맞다."],["is3","","","주어는 맨 앞 Research(연구), 단수라 is(~이다)가 맞다."],["that","what","a","found(알아냈다) 뒤 some species ... are able to absorb harmful materials(몇몇 종이 해로운 물질을 흡수할 수 있다)는 주어·목적어가 다 있는 완전한 문장이다. what(~하는 것)은 빈자리가 있어야 온다."],["better","","","than(~보다)이 있으니 비교급 better(더 잘)가 맞다."],["effective","","","be동사 are(~이다) 뒤 보어 자리라 형용사 effective(효과적인)가 맞다."]],"opts":["that","which","whose","because of"],"or":["that(~라는 것): found(알아냈다)의 목적어로 완전한 문장을 묶는 접속사라 맞음.","which(~하는): 관계대명사로 보면 앞에 꾸밀 명사도, 뒤에 빈자리도 없음.","whose(~의): 뒤에 바로 명사가 와서 '~의 명사'가 되어야 하는데, some species(몇몇 종)를 소유할 대상이 없음.","because of(~ 때문에): 전치사라 뒤에 명사만 오는데, some species ... are able to ...(몇몇 종이 ~할 수 있다)라는 주어 + 동사 문장이 옴."],"point":"that vs. what","en":"Scientists have found that some species of willow trees are able to absorb harmful materials better than others.","ko":"과학자들은 몇몇 종의 버드나무가 다른 종들보다 해로운 물질을 더 잘 흡수할 수 있다는 것을 알아냈다.","hl":["Scientists have found that"],"khl":["것을 알아냈다"],"blocks":[{"t":"p","h":"버드나무도 다 같지 않다","x":["연구는 아직 진행 중이다.","그런데 이미 알아낸 것이 하나 있다.","버드나무 중에서도 어떤 종은 해로운 물질을 더 잘 빨아들인다는 것.","그래서 다음 문장은 '어느 나무가 가장 효과적인지 더 탐구해야 한다'로 이어진다."]},{"t":"p","h":"빈자리 세기","x":["what(~하는 것) 뒤 문장에는 주어나 목적어 한 자리가 비어 있다.","that(~라는 것) 뒤 문장은 빈자리가 없다.","some species(몇몇 종)가 주어, are able to absorb(흡수할 수 있다)가 동사, harmful materials(해로운 물질)가 목적어.","빈자리 0개, 그래서 that(~라는 것)."]},{"t":"pair","h":"쉬운 예시","x":[["I found that he was right.","나는 그가 옳았다는 것을 알게 되었다. (뒤 문장 완전 → that)"],["I found what I lost.","나는 내가 잃어버린 것을 찾았다. (lost(잃어버렸다)의 목적어가 빔 → what)"]]}],"post":["found(알아냈다) + that(~라는 것) + 완전한 문장, what(~하는 것)은 빈자리 있을 때만"]},{"slots":[["is3","","","주어는 맨 앞 Research(연구), 단수라 is(~이다)가 맞다."],["that","","","found(알아냈다) 뒤 완전한 문장을 묶는 접속사 that(~라는 것)이 맞다."],["better","","","than(~보다)이 있으니 비교급 better(더 잘)가 맞다."],["effective","effectively","a","be동사 are(~이다) 뒤 보어 자리다. 주어 which trees(어느 나무들)의 상태를 말하니 형용사가 와야 한다. effectively(효과적으로)는 부사다."],["clean","","","be able to(~할 수 있다) 뒤라 동사원형 clean(깨끗이 하다)이 맞다."]],"opts":["effective","effect","effectiveness","efficiently"],"or":["effective(효과적인): be동사 are(~이다) 뒤에서 나무들의 상태를 말하는 형용사라 맞음. the most effective(가장 효과적인).","effect(효과): 명사라 '나무들 = 가장 효과'가 되어 뜻이 안 맞고, the most(가장)가 명사 앞에서 최상급을 만들 수도 없음.","effectiveness(효과성): 명사라 be동사 뒤 상태 자리에 맞지 않고, the most(가장) 뒤에 올 수 없음.","efficiently(효율적으로): -ly 부사라 be동사 are(~이다) 뒤에서 주어의 상태를 말할 수 없음."],"point":"형용사 자리 vs. 부사 자리","en":"Therefore, this promising area should be further explored to find out which trees are the most effective.","ko":"그러므로, 어느 나무들이 가장 효과적인지 알아내기 위해 이 유망한 분야는 더 깊이 탐구되어야 한다.","hl":["which trees are the most effective"],"khl":["어느 나무들이 가장 효과적인지"],"blocks":[{"t":"p","h":"다음 숙제는 '최고의 나무' 찾기","x":["어떤 종은 다른 종보다 물질을 더 잘 흡수한다고 했다.","Therefore(그러므로) 어느 나무가 가장 효과적인지 더 연구해야 한다.","이 분야를 promising(유망한), 즉 앞날이 기대되는 분야라고 부른다.","결국 버드나무로 땅을 깨끗하게 할 날이 올지도 모른다."]},{"t":"p","h":"be동사 뒤는 상태","x":["be동사(~이다) 뒤 자리는 주어가 어떤 상태인지 말하는 자리다.","상태는 형용사가 말한다. which trees(어느 나무들) = the most effective(가장 효과적인).","-ly 부사는 동작을 꾸미는 말이라 be동사 뒤 상태 자리에 못 온다.","the most(가장)는 형용사 앞에 붙어 최상급을 만든다."]},{"t":"pair","h":"쉬운 예시","x":[["This medicine is very effective.","이 약은 매우 효과적이다. (be동사 뒤 형용사)"],["She is the most careful driver.","그녀는 가장 조심성 있는 운전자다. (the most(가장) + 형용사)"]]}],"post":["be동사 + 형용사: are the most effective(가장 효과적이다)"]}],"quiz":[{"s":"___ it was raining, we played soccer.","o":["Although","Despite"],"a":0,"ko":"비가 오고 있었지만 우리는 축구를 했다.","why":"뒤에 주어 + 동사 문장이 오니 접속사 Although(비록 ~이지만).","wy":"Despite(~에도 불구하고): 전치사라 뒤에 문장이 못 옴."},{"s":"There ___ a good way to learn English.","o":["is","are"],"a":0,"ko":"영어를 배우는 좋은 방법이 하나 있다.","why":"진짜 주어 a good way(좋은 방법 하나)가 단수라 is(~이다).","wy":"are(~이다): 복수 주어용이라 단수 a good way(좋은 방법)와 안 맞음."},{"s":"The kids ___ their lunch quickly.","o":["eat","are eaten"],"a":0,"ko":"아이들은 점심을 빨리 먹는다.","why":"뒤에 목적어 their lunch(그들의 점심)가 있으니 능동.","wy":"are eaten(먹히다): 수동이라 뒤에 목적어를 받을 수 없음."},{"s":"I found ___ he was right.","o":["what","that"],"a":1,"ko":"나는 그가 옳았다는 것을 알게 되었다.","why":"뒤 문장이 완전하니 that(~라는 것).","wy":"what(~하는 것): 뒤에 빈자리가 있어야 하는데 he was right(그가 옳았다)는 완전함."},{"s":"This medicine is very ___.","o":["effective","effectively"],"a":0,"ko":"이 약은 매우 효과적이다.","why":"be동사 뒤 상태 자리라 형용사.","wy":"effectively(효과적으로): 부사라 be동사 뒤 상태 자리에 못 옴."}]},{"items":[{"slots":[["are0","","","주어 Mining and other industries(광산업과 다른 산업들)는 A and B라 복수, are(~이다)가 맞다."],["although","","","뒤에 주어 + 동사 문장이 오니 접속사 Although(비록 ~이지만)가 맞다."],["be_dug","dig","a","주어 polluted soil(오염된 흙)은 파내어지는 쪽이다. 또 and 뒤 transported(옮겨진)와 짝을 이루려면 be dug(파내어지다)처럼 수동이어야 한다."],["is1","","","주어 this process(이 과정)가 단수라 is(~이다)가 맞다."],["moves","","","주어 it(이것)이 단수이고 문제를 옮기는 쪽이라 moves(옮기다)가 맞다."]],"opts":["be dug","digging","to dig","dug"],"or":["be dug(파내어지다): 흙은 파내어지는 쪽이라 can(~할 수 있다) + be + p.p. 수동이 맞음.","digging(파는): 조동사 can(~할 수 있다) 뒤에는 동사원형이 와야 해서 -ing가 못 옴.","to dig(파는 것): 조동사 can(~할 수 있다) 뒤에 to가 붙을 수 없음.","dug(팠다, 과거형·과거분사형): can(~할 수 있다) 바로 뒤에 과거형이나 p.p.가 올 수 없음. be가 있어야 수동이 됨."],"point":"능동태 vs. 수동태","en":"Although polluted soil can be dug up and transported to a landfill, this process is expensive.","ko":"비록 오염된 흙이 파내어져 매립지로 옮겨질 수는 있지만, 이 과정은 비용이 많이 든다.","hl":["can be dug up and transported"],"khl":["파내어져 매립지로 옮겨질 수는"],"blocks":[{"t":"p","h":"흙은 스스로 파지 않는다","x":["dig up(파내다)을 하는 건 사람이나 기계다.","soil(흙)은 파내어지는 쪽, 당하는 쪽이다.","당하는 쪽이 주어면 be + p.p.(수동).","can(~할 수 있다) + be dug(파내어지다) + and (be) transported(옮겨지다). 두 동작 모두 흙이 당한다."]},{"t":"p","h":"and(그리고) 양쪽 맞추기","x":["and(그리고) 뒤 transported(옮겨진)는 be가 생략된 p.p.다.","앞쪽도 같은 모양이어야 균형이 맞는다.","dig(파다)를 넣으면 흙이 직접 판다는 뜻도 되고, 뒤 transported(옮겨진)와 짝도 깨진다."]},{"t":"pair","h":"쉬운 예시","x":[["The cake can be made by hand.","그 케이크는 손으로 만들어질 수 있다. (케이크는 당하는 쪽 → be made(만들어지다))"],["The box can be opened and checked.","그 상자는 열리고 확인될 수 있다. (be + opened and checked(열리고 확인되다))"]]}],"post":["당하는 주어 soil(흙) + can be p.p.(~될 수 있다): can be dug up and transported(파내어져 옮겨질 수 있다)"]},{"slots":[["is1","","","주어 this process(이 과정)가 단수라 is(~이다)가 맞다."],["moves","moving","a","주어 it(이것) 뒤에 문장의 진짜 동사가 필요하다. 또 and 뒤 does not solve(해결하지 않는다)와 나란한 동사여야 한다. -ing는 혼자 동사가 못 된다."],["does","","","주어 it(이것)이 단수라 부정문 도우미 does(하다)가 맞다."],["is2","","","there is(~이 있다) 뒤 진짜 주어 way(방법)가 단수라 is(~이다)가 맞다."],["to_restore","","","way(방법)를 뒤에서 꾸미는 to부정사 to restore(복구하는)가 맞다."]],"opts":["moves","move","to move","is moved"],"or":["moves(옮기다): 주어 it(이것)이 단수라 s 붙은 현재형 동사가 맞고, and 뒤 does not solve(해결하지 않는다)와 짝이 맞음.","move(옮기다): 주어 it(이것)은 단수라 s 없는 형태가 안 맞음.","to move(옮기는 것): to부정사는 문장의 동사 자리에 못 옴.","is moved(옮겨지다): 수동이라 뒤에 목적어 the problem(그 문제)을 받을 수 없음."],"point":"정동사 vs. 준동사 (병렬)","en":"Moreover, it only moves the problem to another area and does not really solve it.","ko":"게다가, 이것은 문제를 다른 곳으로 옮길 뿐이며 실제로 그것을 해결하지는 않는다.","hl":["it only moves the problem","does not really solve it"],"khl":["옮길 뿐이며","해결하지는 않는다"],"blocks":[{"t":"p","h":"폭탄 돌리기","x":["오염된 흙을 퍼서 매립지로 옮기면 여기 흙은 깨끗해진다.","하지만 오염은 매립지로 자리만 옮긴다.","그래서 본문은 Moreover(게다가)로 단점을 하나 더 얹는다.","문제를 옮길 뿐, 해결은 아니다. 이 한계 때문에 버드나무가 등장한다."]},{"t":"p","h":"동사 두 개를 and(그리고)로","x":["주어 it(이것) 하나에 동사가 두 개 걸려 있다.","① only moves(옮길 뿐이다) ② does not really solve(실제로 해결하지 않는다).","둘 다 주어 it(이것)의 진짜 동사라 모양이 같아야 한다.","moving(옮기는)은 동사가 아니라서 저울이 기운다."]},{"t":"pair","h":"쉬운 예시","x":[["She cleans the room and washes the dishes.","그녀는 방을 청소하고 설거지를 한다. (cleans and washes(청소하고 씻다))"],["He only talks and does not listen.","그는 말만 하고 듣지 않는다. (talks and does not listen(말하고 듣지 않는다))"]]}],"post":["주어 it(이것) + moves ... and does not solve(옮기고 ~ 해결하지 않는다): 동사끼리 나란히"]},{"slots":[["to_restore","","","way(방법)를 뒤에서 꾸미는 to부정사 to restore(복구하는)가 맞다."],["amazing","amazed","a","trees(나무들)는 놀라움을 느끼는 쪽이 아니라 보는 사람을 놀라게 (건강한): keep(유지하다) + the environment(환경) 뒤에서 환경의 상태를 말하는 형용사라 맞음.","health(건강): 명사라 '환경 = 건강'이 되어 뜻이 안 맞고, and 뒤 형용사 clean(깨끗한)과도 짝이 안 맞음.","healthiness(건강함): 명사라 목적어의 상태를 말하는 자리에 맞지 않음.","to be healthy(건강한 것): keep(유지하다)은 목적어 뒤에 to부정사를 받지 않고 형용사를 바로 받음."],"point":"목적격보어 (형용사)","en":"In return, we need to look for more ways to keep the environment healthy and clean.","ko":"그 보답으로, 우리는 환경을 건강하고 깨끗하게 유지할 더 많은 방법을 찾을 필요가 있다.","hl":["keep the environment healthy and clean"],"khl":["환경을 건강하고 깨끗하게 유지할"],"blocks":[{"t":"p","h":"대자연이 준 한 번의 기회","x":["밀웜, 버드나무, 조류 연료는 자연이 준 해결책 몇 개일 뿐이다.","대자연이 우리에게 한 번 더 기회를 준 것 같다.","In return(그 보답으로), 우리는 환경을 건강하고 깨끗하게 지킬 방법을 더 찾아야 한다.","그렇게 하면 지구의 미래는 밝을 수 있다. 본문의 결론이다."]},{"t":"p","h":"keep(유지하다) + 목적어 + 형용사","x":["keep(유지하다) A + 형용사 = A를 ~한 상태로 유지하다.","형용사는 A가 어떤 상태인지 말한다. 환경 = 건강한, 깨끗한.","부사 -ly는 동작을 꾸미는 말이라 상태를 말할 수 없다.","and(그리고) 뒤 clean(깨끗한)도 형용사라 앞도 형용사 healthy(건강한)."]},{"t":"pair","h":"쉬운 예시","x":[["Keep your hands clean.","손을 깨끗하게 유지해라. (hands(손) = clean(깨끗한))"],["The blanket kept me warm.","담요가 나를 따뜻하게 해 주었다. (me(나) = warm(따뜻한))"]]}],"post":["keep(유지하다) + 목적어 + 형용사: keep the environment healthy and clean(환경을 건강하고 깨끗하게 유지하다)"]}],"quiz":[{"s":"The girl, however, ___ to school by bus.","o":["go","goes"],"a":1,"ko":"그러나 그 소녀는 버스로 학교에 간다.","why":"주어 The girl(그 소녀)이 단수라 goes(가다).","wy":"go(가다): 단수 주어 The girl(그 소녀)에는 s가 붙어야 함."},{"s":"Birds can ___ nests.","o":["make","be made"],"a":0,"ko":"새들은 둥지를 만들 수 있다.","why":"뒤에 목적어 nests(둥지들)가 있으니 능동.","wy":"be made(만들어지다): 수동이라 뒤에 목적어를 받을 수 없음."},{"s":"I like the song ___ is on the radio.","o":["what","that"],"a":1,"ko":"나는 라디오에서 나오는 그 노래를 좋아한다.","why":"앞 명사 the song(그 노래)을 꾸미는 that(~하는).","wy":"what(~하는 것): 앞에 명사 the song(그 노래)이 있어서 못 옴."},{"s":"The plants ___ to the sun all day.","o":["expose","are exposed"],"a":1,"ko":"그 식물들은 하루 종일 햇빛에 노출된다.","why":"식물은 노출되는 쪽이라 be exposed to(~에 노출되다).","wy":"expose(노출시키다): 노출시킬 목적어가 없고, 식물은 당하는 쪽임."},{"s":"Keep your hands ___.","o":["clean","cleanly"],"a":0,"ko":"손을 깨끗하게 유지해라.","why":"keep(유지하다) + 목적어 + 형용사.","wy":"cleanly(깨끗하게): 부사라 목적어 your hands(너의 손)의 상태를 말할 수 없음."}]}],"comp":[{"no":"본문 ④","slots":[["that2","","","앞 명사 a natural fuel(천연 연료)을 꾸미고 뒤에 주어가 빠져 있어 주격 관계대명사 that(~하는)이 맞다."],["made","","","연료는 만들어지는 쪽이라 is made(만들어진다)의 p.p. made(만들어진)가 맞다."],["adding","","","전치사 without(~ 없이) 뒤라 동명사 adding(더하는 것)이 맞다."],["other","others","a","뒤에 명사 nutrients(영양분들)가 있다. others(다른 것들)는 대명사라 뒤에 명사를 붙일 수 없다."],["are_exposed","","","조류는 빛에 노출되는 쪽이라 수동 are exposed(노출되다)가 맞다."]],"opts":["other","another","the others","each"],"or":["other(다른): 뒤의 복수 명사 nutrients(영양분들)를 꾸미는 형용사라 맞음. any other(다른 어떤).","another(또 하나의): an(하나의) + other(다른)라 뒤에 단수 명사가 와야 하는데 nutrients(영양분들)는 복수임.","the others(나머지 것들): 대명사라 뒤에 명사를 붙일 수 없음.","each(각각의): 뒤에 단수 명사가 와야 하고, any(어떤) 뒤에 바로 올 수도 없음."],"point":"other vs. others","en":"Researchers have found that they can grow algae on old coffee grounds without adding any other nutrients.","ko":"연구자들은 다른 어떤 영양분도 더하지 않고 오래된 커피 찌꺼기에서 조류를 기를 수 있다는 것을 알아냈다.","hl":["any other nutrients"],"khl":["다른 어떤 영양분도"],"blocks":[{"t":"p","h":"꾸미는 말 vs. 혼자 서는 말","x":["other(다른)는 형용사, 뒤에 명사를 데리고 다닌다. other nutrients(다른 영양분들).","others(다른 것들)는 대명사, 이미 명사라서 혼자 선다.","others nutrients(다른 것들 영양분들)는 명사가 두 번 겹친 꼴이다.","커피 찌꺼기 말고는 다른 영양분이 필요 없다는 것이 이 문장의 핵심이다."]},{"t":"pair","h":"쉬운 예시","x":[["I have other plans for today.","나는 오늘 다른 계획들이 있다. (other(다른) + plans(계획들))"],["Some like tea, and others like milk.","어떤 사람들은 차를, 다른 사람들은 우유를 좋아한다. (others(다른 사람들) 혼자)"]]}],"post":["other(다른) + 명사 / others(다른 것들)는 혼자: any other nutrients(다른 어떤 영양분)"]},{"no":"본문 ④","slots":[["creates","","","주어 it(그것)이 단수이고 배출물을 만드는 쪽이라 creates(만들다)가 맞다."],["a_few","a little","a","뒤 solutions(해결책들)는 셀 수 있는 복수 명사다. a little(약간의)은 물처럼 셀 수 없는 명사 앞에만 쓴다."],["healthy","","","keep(유지하다) + 목적어 + 형용사. 목적어의 상태를 말하는 자리라 healthy(건강한)가 맞다."],["clean","","","and(그리고)로 healthy(건강한)와 나란한 형용사 clean(깨끗한)이 맞다."],["do","","","앞에 나온 look for more ways(더 많은 방법을 찾다)를 대신 받는 대동사 do(하다)가 맞다."]],"opts":["a few","much","a great deal of","every"],"or":["a few(몇몇의): 셀 수 있는 복수 명사 solutions(해결책들) 앞이라 맞음. just a few(겨우 몇 개의).","much(많은): 셀 수 없는 명사 앞에 쓰는 말이라 solutions(해결책들)와 안 맞고, just(겨우)와 뜻도 안 맞음.","a great deal of(많은 양의): 셀 수 없는 명사 앞에 쓰는 말이라 복수 solutions(해결책들)와 안 맞음.","every(모든): 뒤에 단수 명사가 와야 하는데 solutions(해결책들)는 복수임."],"point":"수량형용사 (a few vs. a little)","en":"These are just a few solutions we can find in nature.","ko":"이것들은 우리가 자연에서 찾을 수 있는 몇 가지 해결책에 불과하다.","hl":["just a few solutions"],"khl":["몇 가지 해결책에 불과하다"],"blocks":[{"t":"p","h":"세는 것과 못 세는 것","x":["셀 수 있는 복수 명사 앞: a few(몇몇의), many(많은).","셀 수 없는 명사 앞: a little(약간의), much(많은).","solutions(해결책들)는 하나, 둘 셀 수 있고 -s도 붙어 있다.","그래서 a few(몇몇의). These(이것들) = 밀웜, 버드나무, 조류 연료, 딱 세 가지."]},{"t":"pair","h":"쉬운 예시","x":[["I have a few friends in this town.","나는 이 마을에 친구가 몇 명 있다. (friends(친구들)는 셀 수 있음 → a few)"],["I have a little water in my bottle.","내 병에는 물이 조금 있다. (water(물)는 셀 수 없음 → a little)"]]}],"post":["a few(몇몇의) + 셀 수 있는 복수 명사: just a few solutions(겨우 몇 가지 해결책)"]}],"compquiz":[{"s":"I have ___ plans for today.","o":["other","others"],"a":0,"ko":"나는 오늘 다른 계획들이 있다.","why":"뒤에 명사 plans(계획들)가 있으니 형용사 other(다른).","wy":"others(다른 것들): 대명사라 뒤에 명사 plans(계획들)를 붙일 수 없음."},{"s":"I have ___ friends in this town.","o":["a few","a little"],"a":0,"ko":"나는 이 마을에 친구가 몇 명 있다.","why":"friends(친구들)는 셀 수 있는 복수라 a few(몇몇의).","wy":"a little(약간의): 셀 수 없는 명사 앞에만 씀."}]}],"unit":""}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
(function(){var m=/[?&]n=([\d,_-]+)/.exec(location.search);if(m){var W=m[1].replace(/-/g,'_').split(',');D.nums=D.nums.filter(function(n){return W.indexOf(String(n.no).replace(/-/g,'_'))>=0;});}})();
var G=D.kind==='g';
var CIR=['①','②','③','④','⑤'];
var TEACH=/[?&]t=1/.test(location.search);
var KEY='teukhun-'+D.kind+'-'+D.id;
var app=document.getElementById('app');
var st;
function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>';}
function mix(s){return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*(?:[ ,]+[A-Za-z][A-Za-z'’\-]*)*/g,function(m){return '<span lang="en" translate="no">'+m+'</span>';});}
function disp(k){return k.replace(/_/g,' ');}
function hlt(t,ph){var h=esc(t);(ph||[]).forEach(function(p,j){var e=esc(p);h=h.replace(e,'<mark'+(j===0?' class="k"':'')+'>'+e+'</mark>');});return h;}
function lines(a){return '<div class="lines">'+a.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}
function hk(x){var i=x.indexOf(':');if(i<0)return '<mark>'+mix(x)+'</mark>';return '<mark>'+mix(x.slice(0,i))+'</mark>'+mix(x.slice(i));}
function hw(x){var i=x.indexOf(' : ');if(i<0)return '<mark>'+mix(x)+'</mark>';return mix(x.slice(0,i+3))+'<mark>'+mix(x.slice(i+3))+'</mark>';}
function postit(p){return '<div class="postit">'+p.map(function(x){return '<p>'+mix(x)+'</p>';}).join('')+'</div>';}

/* ---------- runs ---------- */
var N=D.nums.length;
function runList(){
  var r=[];
  D.nums.forEach(function(n,i){r.push({key:'r1-'+n.no,label:n.no,round:1,n:i});});
  D.nums.forEach(function(n,i){r.push({key:'r2-'+n.no,label:n.no,round:2,n:i});});
  r.push({key:'c1',label:'종합 1',round:3});
  r.push({key:'c2',label:'종합 2',round:4});
  return r;
}
function buildRun(run){
  var items=[],quiz=[];
  if(run.round<=2){
    var S=D.nums[run.n].sets[run.round-1];
    S.items.forEach(function(it){items.push({it:it,n:run.n});});
    S.quiz.forEach(function(q){q._m=D.nums[run.n].mean;quiz.push(q);});
  }else{
    var c=run.round-3;
    D.nums.forEach(function(n,i){items.push({it:n.comp[c],n:i});});
    var pool=D.nums.map(function(n){var q=n.compquiz[c];q._m=n.mean;return q;}),used={},want=Math.min(5,pool.length);
    for(var k=0;k<want;k++){var x=(Math.round(k*(pool.length-1)/Math.max(1,want-1))+c*2)%pool.length;while(used[x])x=(x+1)%pool.length;used[x]=1;}
    Object.keys(used).map(Number).sort(function(a,b){return a-b;}).forEach(function(x){quiz.push(pool[x]);});
  }
  return {items:items,quiz:quiz};
}
function roundDone(round,done){
  return D.nums.every(function(n){return done[(round===1?'r1-':'r2-')+n.no];});
}
function unlocked(run,done){
  return true;
  if(run.round===1)return true;
  if(run.round===2)return roundDone(1,done);
  if(run.round===3)return roundDone(2,done);
  return !!done.c1;
}

/* ---------- views ---------- */
function home(){st={screen:'home'};render();window.scrollTo(0,0);}
function start(run){
  var b=buildRun(run);
  st={screen:'item',run:run,items:b.items,quiz:b.quiz,i:0,pick:null,fixPick:null,wrong:false,s1:[],s2:[],qj:0,qsel:{},qdone:false,qres:[],qpick:null,tap:{}};
  render();window.scrollTo(0,0);
}
function homeView(){
  var done=loadDone(),runs=runList();
  var h='<div class="top"><button class="btn ghost back" id="toapp">‹ 앱으로</button><h1>'+esc(D.title)+'</h1><span>'+esc(D.sub||'')+'</span></div>';
  [[1,'1라운드'],[2,'2라운드']].forEach(function(r){
    var ok=runs.filter(function(x){return x.round===r[0];});
    var cnt=ok.filter(function(x){return done[x.key];}).length;
    var open=unlocked(ok[0],done);
    h+='<div class="card board"><h2>'+r[1]+' <span class="sub">'+cnt+' / '+ok.length+'</span></h2>';
    h+='<div class="grid">';
    ok.forEach(function(x){
      var d=done[x.key];
      h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+esc(x.label)+(D.unit==null?'번':D.unit)+'<small>'+(d?'완료':esc(D.nums[x.n].sub||''))+'</small></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="card board"><h2>종합</h2>';
  var c1=runs[runs.length-2],c2=runs[runs.length-1];
  h+='<div class="grid">';
  [c1,c2].forEach(function(x){
    var d=done[x.key],open=unlocked(x,done);
    h+='<button class="tile'+(d?' done':'')+'" data-run="'+x.key+'"'+(open?'':' disabled')+'>'+x.label+'<small>'+(d?'완료':N+'문제')+'</small></button>';
  });
  h+='</div></div>';
  return h;
}
function runTitle(){var r=st.run;return r.round<=2?(r.label+(D.unit==null?'번':D.unit)+' · '+r.round+'라운드'):r.label;}
function header(){
  var I=st.items.length,Q=st.quiz.length,total=I+Q;
  var done=st.screen==='item'?st.i:st.screen==='quiz'?I+st.qj:total;
  var label=st.screen==='item'?('문제 '+(st.i+1)+' / '+I):st.screen==='quiz'?('마무리 '+(st.qj+1)+' / '+Q):'완료';
  return '<div class="top"><h1>'+esc(D.title)+' · '+esc(runTitle())+'</h1><span>'+label+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function footer(confirm){return '<div class="foot"><button class="btn ghost" id="home" data-confirm="'+(confirm?'1':'0')+'">목록으로</button></div>';}
var homeT=null;
function wireHome(){
  var b=document.getElementById('home');
  if(!b)return;
  b.onclick=function(){
    if(b.dataset.confirm!=='1'||b.dataset.arm==='1'){clearTimeout(homeT);home();return;}
    b.dataset.arm='1';b.textContent='한 번 더 누르면 목록으로';
    homeT=setTimeout(function(){b.dataset.arm='0';b.textContent='목록으로';},3000);
  };
}
function cur(){return st.items[st.i];}
function num(){return D.nums[cur().n];}
function slotOf(k,it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][0]===k)return i;return -1;}
function ansIdx(it){for(var i=0;i<it.slots.length;i++)if(it.slots[i][2]==='a')return i;return -1;}
function shown(s,orig){return (s[1]?s[1]:orig);}
function passage(){
  var it=cur().it,nm=num();
  var html=esc(nm.tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g,function(_,k,txt){
    var orig=txt!==undefined?txt:disp(k);
    var n=slotOf(k,it);
    if(n<0)return orig;
    var cls='u',dis='';
    if(st.pick!==null){
      dis=' disabled';
      if(n===ansIdx(it))cls+=' right';
      else if(n===st.pick)cls+=' wrong';
    }
    return '<button class="'+cls+'" data-n="'+n+'"'+dis+'><b>'+CIR[n]+'</b>'+shown(it.slots[n],orig)+'</button>';
  });
  var fn=nm.fn&&nm.fn.length?'<span class="fn">'+nm.fn.map(esc).join('<br>')+'</span>':'';
  return '<div class="passage" lang="en" translate="no">'+html+fn+'</div>';
}
function origText(k){
  var m=num().tpl.match(new RegExp('\\{'+k+'(?:\\|([^}]*))?\\}'));
  return m&&m[1]!==undefined?m[1]:disp(k);
}
function block(b,bi){
  var h='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'');
  if(b.t==='p')h+=lines(b.x);
  else if(b.t==='flow'){h+='<ol class="flow">'+b.x.map(function(x,j){return '<li class="'+(j===b.at?'at':'')+'">'+mix(x)+'</li>';}).join('')+'</ol>';}
  else if(b.t==='pair'){h+='<ul class="pairs">'+b.x.map(function(x){return '<li><span class="e" lang="en" translate="no">'+esc(x[0])+'</span><span class="k">'+mix(x[1])+'</span></li>';}).join('')+'</ul>';}
  else if(b.t==='tap'){
    var open=st.tap[st.i+'-'+bi];
    h+='<button class="tapq" data-tap="'+bi+'">'+mix(b.q)+'</button>';
    if(open)h+='<div class="tapa">'+lines(b.a)+'</div>';
  }
  return h+'</div>';
}
function negQ(t){return t.replace(/(적절하지 않은|틀린)/g,'<span class="neg">$1</span>');}
function M(w){var mm=st.screen==='quiz'&&st.quiz[st.qj]&&st.quiz[st.qj]._m?st.quiz[st.qj]._m:(st.screen==='item'?num().mean:{});return (mm||{})[w]||'';}
function SM(w){var m=M(w);if(!m)return '';var x=m.match(/^(?:동사|명사|형용사|부사)?\s*[A-Za-z][A-Za-z ’'\-]*\(([^)]+)\)/);if(x)return x[1].split(',')[0].trim();return m.split(/[.,]/)[0].trim();}
function wm(w){var m=G?M(w):SM(w);return m?w+'('+m+')':w;}
function itemView(){
  var it=cur().it,a=ansIdx(it),nm=num();
  var h=header();
  var noTag=st.run.round>2?'<p class="nobadge">'+esc(nm.no)+(D.unit==null?'번 지문':'')+'</p>':'';
  h+='<div class="card">'+noTag+'<p class="q">'+negQ('윗글의 밑줄 친 ①~⑤ 중, '+(G?'어법상 틀린':'문맥상 쓰임이 적절하지 않은')+' 것은?')+'</p>'+passage()+'</div>';
  var right=G?origText(it.slots[a][0]):it.slots[a][0];
  var aw=shown(it.slots[a],G?origText(it.slots[a][0]):disp(it.slots[a][0]));
  if(st.pick!==null&&st.s1[st.i]){
    var answered=st.s2[st.i]!==undefined;
    h+='<div class="card" id="fix"><p class="q">'+CIR[a]+' '+en(aw)+(G?' 를 바르게 고치면?':' 의 본문 속 원래 단어는?')+'</p><div class="opts">';
    it.opts.forEach(function(o,j){
      var cls='opt',dis='';
      if(answered){dis=' disabled';if(o===right)cls+=' right';else if(j===st.fixPick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-o="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(disp(o))+'</span></button>';
    });
    h+='</div></div>';
  }
  if(st.wrong)h+=wrongCard(it,a,aw,right);
  return h+footer(true);
}
function slotReason(it,s,n,a){
  if(G){return s[3]||'';}
  var w=s[1]||disp(s[0]),o=disp(s[0]);
  if(s[2]==='a')return '본문은 '+wm(o)+'. '+wm(w)+'는 반대 방향이라 문맥에 맞지 않음.';
  if(s[2]==='s')return '본문은 '+wm(o)+'. '+wm(w)+'도 같은 뜻이라 맞는 표현.';
  return '본문 그대로라 맞는 표현.';
}
function slotKo(s){
  if(G)return M(s[2]==='a'?s[1]:origText(s[0]));
  var w=s[1]||disp(s[0]);return M(w);
}
function chCard(num,big,ko,reason,kind){
  var tag=kind==='ok'?'<span class="chtag ok">정답</span>':kind==='me'?'<span class="chtag me">내가 고름</span>':'';
  return '<div class="ch '+(kind||'')+'"><div class="chtop"><span class="chn">'+num+'</span><div class="chw"><span lang="en" translate="no">'+esc(big)+'</span>'+(ko?'<small>'+esc(ko)+'</small>':'')+'</div>'+tag+'</div>'+(reason?'<p class="chr">'+mix(reason)+'</p>':'')+'</div>';
}
function wrongCard(it,a,aw,right){
  var h='<div class="card exp" id="exp">';
  var sa=it.slots[a];
  var bandKo=G?esc(it.point):esc(disp(sa[0])+' '+M(disp(sa[0])));
  h+='<div class="band"><b>오답</b><span>정답 '+CIR[a]+' '+en(aw)+' → '+en(disp(right))+'</span><small>'+bandKo+'</small></div>';
  h+='<div class="evi"><p class="en" lang="en" translate="no">'+hlt(it.en,it.hl)+'</p><p class="ko">'+hlt(it.ko,it.khl)+'</p></div>';
  h+='<div><h3>밑줄 풀이</h3><div class="chs">';
  it.slots.forEach(function(s,n){
    var w=G?(s[2]==='a'?s[1]:origText(s[0])):(s[1]||disp(s[0]));
    var kind=n===a?'ok':(n===st.pick&&!st.s1[st.i])?'me':'';
    h+=chCard(CIR[n],w,slotKo(s),slotReason(it,s,n,a),kind);
  });
  h+='</div></div>';
  if(st.s1[st.i]&&st.s2[st.i]===false){
    h+='<div><h3>'+(G?'고치기 보기 풀이':'원래 단어 보기 풀이')+'</h3><div class="chs">';
    it.opts.forEach(function(o,j){
      var ok=o===right,me=j===st.fixPick;
      var ko=G?M(o):(it.om?it.om[j]:'');
      var r=it.or&&it.or[j]?it.or[j]:ok?(G?'이 자리에 맞는 형태. '+(sa[3]||''):'본문 원래 단어.'):(G?disp(o)+'는 이 자리에 맞지 않는 형태.':'본문 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
      h+=chCard(CIR[j],disp(o),ko,r,ok?'ok':me?'me':'');
    });
    h+='</div></div>';
  }
  it.blocks.forEach(function(b,bi){h+=block(b,bi);});
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답의 근거</p><p lang="en" translate="no">'+(G?hlt(it.en,it.hl):esc(it.en))+'</p><p class="nko">'+(G?hlt(it.ko,it.khl):esc(it.ko))+'</p>'+it.post.map(function(p){return '<p>'+(G?hk(p):mix(p))+'</p>';}).join('')+'</div>';
  var why;
  if(!st.s1[st.i]){
    var ps=it.slots[st.pick],pw=G?origText(ps[0]):(ps[1]||disp(ps[0]));
    why=CIR[st.pick]+' '+pw+(slotKo(ps)?' = '+slotKo(ps):'')+' : '+slotReason(it,ps,st.pick,a)+' 틀린 곳은 '+CIR[a]+' '+aw+'.';
  }else{
    var po=it.opts[st.fixPick];
    var pko=G?M(po):(it.om?it.om[st.fixPick]:'');
    why=disp(po)+(pko?' = '+pko:'')+' : '+(it.or&&it.or[st.fixPick]?it.or[st.fixPick]:G?'이 자리에 맞지 않는 형태. 바른 형태는 '+disp(right)+'. '+(sa[3]||''):'본문 원래 단어가 아님. 본문은 '+disp(right)+'('+M(disp(right))+').');
  }
  h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+(G?hw(why):mix(why))+'</p></div>';
  h+='<button class="btn" id="next">'+(st.i<st.items.length-1?'다음 문제':'마무리')+'</button></div>';
  return h;
}
var TAG={s:'비슷',a:'반대',n:'관계없음'};
function quizView(){
  var q=st.quiz[st.qj],h=header();
  if(G){
    h+='<div class="card"><p class="q">빈칸에 알맞은 것은?</p><p class="gs" lang="en" translate="no">'+esc(q.s).replace('___','<b>_____</b>')+'</p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt',dis='';
      if(st.qdone){dis=' disabled';if(j===q.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
      h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span>'+en(o)+'</span></button>';
    });
    h+='</div></div>';
    if(st.qdone&&!st.qres[st.qj]){
      var full=q.s.replace('___',q.o[q.a]);
      h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+en(q.o[q.a])+'</span><small>'+esc(q.ko)+'</small></div>';
      h+='<div class="chs">'+q.o.map(function(o,j){return chCard(j===0?'A':'B',o,M(o),j===q.a?q.why:(q.wy||'이 빈칸에는 맞지 않는 형태.'),j===q.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
      h+='<div class="note"><p class="nt">이것만은 노트에 쓰자</p><p lang="en" translate="no">'+esc(q.s).replace('___','<mark>'+esc(q.o[q.a])+'</mark>')+'</p><p class="nko">'+esc(q.ko)+'</p><p><mark>'+mix(q.why)+'</mark></p></div>';
      h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음':'결과 보기')+'</button></div>';
    }
    return h+footer(true);
  }
  var T=vq(q,st.qj);
  h+='<div class="card"><p class="q">'+en(q.w)+' ('+esc(q.m)+') 와 뜻이 '+(T.ant?'<span class="neg">반대인</span>':'비슷한')+' 말은?</p><div class="opts">';
  T.o.forEach(function(x,j){
    var cls='opt',dis='';
    if(st.qdone){dis=' disabled';if(j===T.a)cls+=' right';else if(j===st.qpick)cls+=' wrong';}
    h+='<button class="'+cls+'" data-g="'+j+'"'+dis+'><span><b>'+CIR[j]+'</b> '+en(x[0])+'</span></button>';
  });
  h+='</div></div>';
  if(st.qdone&&!st.qres[st.qj]){
    var R={s:'비슷한 말',a:'반대말',n:'관계없는 단어'};
    h+='<div class="card exp" id="exp"><div class="band"><b>오답</b><span>정답 '+CIR[T.a]+' '+en(T.o[T.a][0])+'</span><small>'+esc(T.o[T.a][1])+'</small></div>';
    h+='<div class="chs">'+T.o.map(function(x,j){return chCard(CIR[j],x[0],x[1],q.w+'의 '+R[x[2]]+'.',j===T.a?'ok':j===st.qpick?'me':'');}).join('')+'</div>';
    var l1=q.it.filter(function(x){return x[2]==='s';}).map(function(x){return q.w+' = '+x[0]+' ('+x[1]+')';});
    var l2=q.it.filter(function(x){return x[2]==='a';}).map(function(x){return q.w+' ↔ '+x[0]+' ('+x[1]+')';});
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 1 · 정답</p>'+l1.concat(l2).map(function(l){return '<p>'+mix(l)+'</p>';}).join('')+'</div>';
    var me=T.o[st.qpick];
    h+='<div class="note"><p class="nt">이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</p><p>'+mix(me[0]+' ('+me[1]+') : '+q.w+'의 '+R[me[2]]+'.')+'</p></div>';
    h+='<button class="btn" id="qnext">'+(st.qj<st.quiz.length-1?'다음 단어':'결과 보기')+'</button></div>';
  }
  return h+footer(true);
}
/* vocab quiz as one-tap tiles: odd turns ask antonym when one exists */
function vq(q,k){
  var S=q.it.filter(function(x){return x[2]==='s';}),A=q.it.filter(function(x){return x[2]==='a';}),Nn=q.it.filter(function(x){return x[2]==='n';});
  var ant=(k%2===1)&&A.length>0;
  var ans=ant?A[0]:S[0];
  var d=[ant?S[0]:(A[0]||Nn[2]),Nn[0],Nn[1]];
  var o=[ans].concat(d);
  var r=(q.w.length+k)%4;
  o=o.slice(4-r).concat(o.slice(0,4-r));
  return {o:o,a:o.indexOf(ans),ant:ant};
}
function resultView(){
  var I=st.items.length,Q=st.quiz.length;
  var a=st.s1.filter(Boolean).length,b=st.s2.filter(Boolean).length,c=st.qres.filter(Boolean).length;
  var h=header();
  h+='<div class="card exp"><div><h3>이번 세트</h3><p>'+(G?'틀린 곳 찾기 ':'어색한 단어 찾기 ')+a+' / '+I+'</p><p>'+(G?'바르게 고치기 ':'원래 단어 고르기 ')+b+' / '+I+'</p><p>마무리 '+c+' / '+Q+'</p></div>';
  h+='<div class="stamps"><div class="stamp done">'+esc(runTitle())+'<br>완료</div></div></div>';
  h+='<div class="card exp"><h3>이 세트의 포스트잇</h3><div class="recap">';
  st.items.forEach(function(x){h+=postit(x.it.post);});
  h+='</div></div>';
  return h+footer(false);
}
function render(){
  app.innerHTML=st.screen==='home'?homeView():st.screen==='item'?itemView():st.screen==='quiz'?quizView():resultView();
  wireHome();
}
function findRun(k){var r=runList();for(var i=0;i<r.length;i++)if(r[i].key===k)return r[i];}
function finish(){var d=loadDone();d[st.run.key]=1;saveDone(d);st.screen='result';}
function goNext(){
  if(st.i<st.items.length-1){st.i++;st.pick=null;st.fixPick=null;st.wrong=false;}
  else if(!st.quiz.length){finish();}
  else{st.screen='quiz';st.qj=0;st.qsel={};st.qdone=false;st.qpick=null;}
  render();window.scrollTo(0,0);
}
function qNext(){
  if(st.qj<st.quiz.length-1){st.qj++;st.qsel={};st.qdone=false;st.qpick=null;}
  else finish();
  render();window.scrollTo(0,0);
}
var busy=false;
function later(f){busy=true;setTimeout(function(){busy=false;f();},700);}
function toExp(){var x=document.getElementById('exp');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t||busy)return;
  if(t.dataset.run!==undefined){start(findRun(t.dataset.run));return;}
  if(t.id==='toapp'){if(history.length>1)history.back();else location.href='../';return;}
  if(st.screen==='item'){
    var it=cur().it,a=ansIdx(it);
    if(t.classList.contains('u')&&st.pick===null){
      var n=+t.dataset.n;st.pick=n;st.s1[st.i]=(n===a);
      if(!st.s1[st.i]){st.s2[st.i]=false;st.wrong=true;render();toExp();return;}
      render();var f=document.getElementById('fix');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;
    }
    if(t.dataset.o!==undefined&&st.s2[st.i]===undefined){
      var j=+t.dataset.o,right=G?origText(it.slots[a][0]):it.slots[a][0];
      st.fixPick=j;st.s2[st.i]=(it.opts[j]===right);
      if(st.s2[st.i]){render();later(goNext);return;}
      st.wrong=true;render();toExp();return;
    }
    if(t.dataset.tap!==undefined){var k=st.i+'-'+t.dataset.tap;st.tap[k]=!st.tap[k];var y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.id==='next'){goNext();return;}
  }
  if(st.screen==='quiz'){
    var q=st.quiz[st.qj];
    if(t.dataset.g!==undefined&&!st.qdone){var g=+t.dataset.g;st.qpick=g;st.qres[st.qj]=(g===(G?q.a:vq(q,st.qj).a));st.qdone=true;render();if(st.qres[st.qj])later(qNext);else toExp();return;}
    if(t.dataset.c!==undefined&&!st.qdone){var c=+t.dataset.c;st.qsel[c]=!st.qsel[c];render();return;}
    if(t.id==='confirm'){var ok=true;q.it.forEach(function(x,j){if((x[2]!=='n')!==!!st.qsel[j])ok=false;});st.qres[st.qj]=ok;st.qdone=true;render();if(ok)later(qNext);else toExp();return;}
    if(t.id==='qnext'){qNext();return;}
  }
});
home();
})();

</script>
