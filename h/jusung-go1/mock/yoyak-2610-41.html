<script>
var DATA={"meta": {"sch": "jusung-go1", "src": "common/sx-data-2610.js", "dir": "mock", "pidx": 16, "lesson": "26년 10월 41~42번", "title": "", "label": "", "page": "yoyak-2610-41"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "무한 스크롤, 자동 재생 같은 패턴은 사용자의 통제를 [[interfere|방해하고]], 데이터와 주의력의 과잉 소비를 [[encourage|부추긴다]].", "en": ["Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all interfere with the user's control over their own experience.", "From a sustainability perspective, many of these patterns encourage overconsumption of data and attention."], "kos": ["무한 스크롤, 자동 재생 영상, 혹은 단지 구매를 하기 위해 계정을 요구하는 것과 같은 패턴들은 모두 사용자들이 자기 자신의 경험을 통제하는 것을 방해한다.", "지속 가능성의 관점에서 이러한 패턴들 중 많은 것들이 데이터와 주의력의 과잉 소비를 부추긴다."]}, {"tag": "본문 3~5번", "ns": [3, 4, 5], "line": "원하든 말든 콘텐츠를 불러와 데이터 사용을 [[increasing|늘리고]], 기기와 서버 모두에서 에너지를 더 [[consume|소비한다]].", "en": ["Infinite scroll keeps loading new content whether the user wants it or not, increasing data usage and device processing.", "Autoplay forces media to load and play even for people who may never watch it.", "These choices consume more energy on both the user's device and the servers delivering the content."], "kos": ["무한 스크롤은 사용자가 그것을 원하든 원하지 않든 새로운 콘텐츠를 계속해서 로딩하고, 이는 데이터 사용과 기기의 처리 작업을 증가시킨다.", "자동 재생은 매체가 그것을 절대 시청하지 않을 사람들에게조차도 로딩하고 재생하도록 강요한다.", "이러한 선택들은 사용자의 기기와 콘텐츠를 전달하는 서버 모두에서 더 많은 에너지를 소비한다."]}, {"tag": "본문 6~8번", "ns": [6, 7, 8], "line": "한 음악 플랫폼은 [[static|정지된]] 앨범 표지를 반복 영상으로 바꾸고, 끄는 선택지는 설정 깊이 [[buried|묻어]] 두었다.", "en": ["Take the decision by a popular music streaming platform to replace static album artwork with short video loops by default.", "This change significantly increases data usage and battery consumption, while the option to disable it is buried deep in the settings.", "As a result, most users consume more resources unless they actively search for a way to opt out."], "kos": ["한 인기 음악 스트리밍 플랫폼이 기본값으로 정적인 앨범 표지를 짧은 영상의 반복으로 대체하기로 한 결정을 예로 들어 보자.", "이러한 변화는 데이터 사용과 배터리 소비를 상당히 증가시키고, 반면 그것을 비활성화하는 선택은 설정 메뉴 속 깊이 숨겨져 있다.", "그 결과 대부분의 사용자들은 그들이 적극적으로 빠져나올 방법을 찾지 않으면 더 많은 자원을 소비한다."]}, {"tag": "본문 9~11번", "ns": [9, 10, 11], "line": "웹 디자인은 늘 행동을 [[nudges|유도한다]]. 중요한 건 그것이 투명하고 되돌릴 수 있는지다.", "en": ["It is important to acknowledge that web design always nudges behavior in some way.", "Showing consequences and highlighting options are all forms of influence.", "The ethical line is not whether nudging exists, but whether it is transparent, reversible, and aligned with the user's interests."], "kos": ["웹 디자인이 항상 어떤 방식으로든 행동을 유도한다는 것을 인정하는 것은 중요하다.", "결과를 보여 주는 것과 선택지를 강조하는 것은 모두 영향력의 형태이다.", "윤리적 기준은 행동 유도가 존재하느냐가 아니라, 그것이 투명하고, 되돌릴 수 있으며, 사용자의 이익과 일치하는지이다."]}, {"tag": "본문 12~13번", "ns": [12, 13], "line": "영향이 적은 선택지를 기본값으로 하면 사용자 [[agency|주체성]]을 지키면서 환경 영향을 [[reduce|줄일]] 수 있다.", "en": ["In many cases, the most responsible approach is to make the lower-impact option the default, while keeping alternatives clearly available.", "Defaults are powerful, and when chosen carefully, they can reduce environmental impact without removing user agency."], "kos": ["많은 경우, 가장 책임 있는 접근 방법은 대안들을 분명하게 이용할 수 있도록 유지하면서 (환경에 미치는) 영향이 더 적은 선택지를 기본값으로 만드는 것이다.", "기본값들은 영향력이 크고, 신중하게 선택될 경우 그것들은 사용자 주체성을 없애지 않으면서 환경적 영향을 줄일 수 있다."]}], "story": [{"a": "interfere", "form": "interfere", "n": 1, "sq": 1, "sum": "[[hinder]] the control users have", "hook": "사용자의 통제를 방해한다는 문장의 interfere(방해하다) → 요약문에서는 hinder(방해하다)로 바꿨어요.", "b": "hinder", "k": "방해하다 → 방해하다", "en": "Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all interfere with the user's control over their own experience.", "ko": "무한 스크롤, 자동 재생 영상, 혹은 단지 구매를 하기 위해 계정을 요구하는 것과 같은 패턴들은 모두 사용자들이 자기 자신의 경험을 통제하는 것을 방해한다."}, {"a": "encourage", "form": "encourage", "n": 2, "sq": 1, "sum": "many of them [[urge]] people", "hook": "과잉 소비를 부추긴다는 문장의 encourage(부추기다) → 요약문에서는 urge(부추기다)로 바꿨어요.", "b": "urge", "k": "부추기다 → 부추기다", "en": "From a sustainability perspective, many of these patterns encourage overconsumption of data and attention.", "ko": "지속 가능성의 관점에서 이러한 패턴들 중 많은 것들이 데이터와 주의력의 과잉 소비를 부추긴다."}, {"a": "increase", "form": "increasing", "n": 3, "sq": 2, "sum": "can [[raise]] data usage", "hook": "데이터 사용을 증가시킨다는 문장의 increase(증가시키다) → 요약문에서는 raise(올리다)로 바꿨어요.", "b": "raise", "k": "증가시키다 → 올리다", "en": "Infinite scroll keeps loading new content whether the user wants it or not, increasing data usage and device processing.", "ko": "무한 스크롤은 사용자가 그것을 원하든 원하지 않든 새로운 콘텐츠를 계속해서 로딩하고, 이는 데이터 사용과 기기의 처리 작업을 증가시킨다."}, {"a": "consume", "form": "consume", "n": 5, "sq": 2, "sum": "these choices [[use]] more energy", "hook": "에너지를 더 많이 소비한다는 문장의 consume(소비하다) → 요약문에서는 use(쓰다)로 바꿨어요.", "b": "use", "k": "소비하다 → 쓰다", "en": "These choices consume more energy on both the user's device and the servers delivering the content.", "ko": "이러한 선택들은 사용자의 기기와 콘텐츠를 전달하는 서버 모두에서 더 많은 에너지를 소비한다."}, {"a": "static", "form": "static", "n": 6, "sq": 3, "sum": "replaced [[still]] album art", "hook": "정적인 앨범 표지를 바꿨다는 문장의 static(정지된) → 요약문에서는 still(정지된)로 바꿨어요.", "b": "still", "k": "정지된 → 정지된", "en": "Take the decision by a popular music streaming platform to replace static album artwork with short video loops by default.", "ko": "한 인기 음악 스트리밍 플랫폼이 기본값으로 정적인 앨범 표지를 짧은 영상의 반복으로 대체하기로 한 결정을 예로 들어 보자."}, {"a": "bury", "form": "buried", "n": 7, "sq": 3, "sum": "was [[hidden]] deep in the settings", "hook": "끄는 선택지가 설정 깊이 묻혀 있다는 문장의 bury(묻다) → 요약문에서는 hide(숨기다)로 바꿨어요.", "b": "hide", "k": "묻다 → 숨기다", "en": "This change significantly increases data usage and battery consumption, while the option to disable it is buried deep in the settings.", "ko": "이러한 변화는 데이터 사용과 배터리 소비를 상당히 증가시키고, 반면 그것을 비활성화하는 선택은 설정 메뉴 속 깊이 숨겨져 있다."}, {"a": "nudge", "form": "nudges", "n": 9, "sq": 4, "sum": "always [[guide]] behavior", "hook": "웹 디자인이 항상 행동을 유도한다는 문장의 nudge(살짝 유도하다) → 요약문에서는 guide(이끌다)로 바꿨어요.", "b": "guide", "k": "살짝 유도하다 → 이끌다", "en": "It is important to acknowledge that web design always nudges behavior in some way.", "ko": "웹 디자인이 항상 어떤 방식으로든 행동을 유도한다는 것을 인정하는 것은 중요하다."}, {"a": "reduce", "form": "reduce", "n": 13, "sq": 4, "sum": "can [[cut]] harm to the environment", "hook": "환경적 영향을 줄일 수 있다는 문장의 reduce(줄이다) → 요약문에서는 cut(줄이다)으로 바꿨어요.", "b": "cut", "k": "줄이다 → 줄이다", "en": "Defaults are powerful, and when chosen carefully, they can reduce environmental impact without removing user agency.", "ko": "기본값들은 영향력이 크고, 신중하게 선택될 경우 그것들은 사용자 주체성을 없애지 않으면서 환경적 영향을 줄일 수 있다."}, {"a": "agency", "form": "agency", "n": 13, "sq": 4, "sum": "user [[freedom]]", "hook": "사용자 주체성을 없애지 않는다는 문장의 agency(주체성) → 요약문에서는 freedom(자유)으로 바꿨어요.", "b": "freedom", "k": "주체성 → 자유", "en": "Defaults are powerful, and when chosen carefully, they can reduce environmental impact without removing user agency.", "ko": "기본값들은 영향력이 크고, 신중하게 선택될 경우 그것들은 사용자 주체성을 없애지 않으면서 환경적 영향을 줄일 수 있다."}], "passage": [{"n": 1, "en": "Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all interfere with the user's control over their own experience.", "ko": "무한 스크롤, 자동 재생 영상, 혹은 단지 구매를 하기 위해 계정을 요구하는 것과 같은 패턴들은 모두 사용자들이 자기 자신의 경험을 통제하는 것을 방해한다."}, {"n": 2, "en": "From a sustainability perspective, many of these patterns encourage overconsumption of data and attention.", "ko": "지속 가능성의 관점에서 이러한 패턴들 중 많은 것들이 데이터와 주의력의 과잉 소비를 부추긴다."}, {"n": 3, "en": "Infinite scroll keeps loading new content whether the user wants it or not, increasing data usage and device processing.", "ko": "무한 스크롤은 사용자가 그것을 원하든 원하지 않든 새로운 콘텐츠를 계속해서 로딩하고, 이는 데이터 사용과 기기의 처리 작업을 증가시킨다."}, {"n": 4, "en": "Autoplay forces media to load and play even for people who may never watch it.", "ko": "자동 재생은 매체가 그것을 절대 시청하지 않을 사람들에게조차도 로딩하고 재생하도록 강요한다."}, {"n": 5, "en": "These choices consume more energy on both the user's device and the servers delivering the content.", "ko": "이러한 선택들은 사용자의 기기와 콘텐츠를 전달하는 서버 모두에서 더 많은 에너지를 소비한다."}, {"n": 6, "en": "Take the decision by a popular music streaming platform to replace static album artwork with short video loops by default.", "ko": "한 인기 음악 스트리밍 플랫폼이 기본값으로 정적인 앨범 표지를 짧은 영상의 반복으로 대체하기로 한 결정을 예로 들어 보자."}, {"n": 7, "en": "This change significantly increases data usage and battery consumption, while the option to disable it is buried deep in the settings.", "ko": "이러한 변화는 데이터 사용과 배터리 소비를 상당히 증가시키고, 반면 그것을 비활성화하는 선택은 설정 메뉴 속 깊이 숨겨져 있다."}, {"n": 8, "en": "As a result, most users consume more resources unless they actively search for a way to opt out.", "ko": "그 결과 대부분의 사용자들은 그들이 적극적으로 빠져나올 방법을 찾지 않으면 더 많은 자원을 소비한다."}, {"n": 9, "en": "It is important to acknowledge that web design always nudges behavior in some way.", "ko": "웹 디자인이 항상 어떤 방식으로든 행동을 유도한다는 것을 인정하는 것은 중요하다."}, {"n": 10, "en": "Showing consequences and highlighting options are all forms of influence.", "ko": "결과를 보여 주는 것과 선택지를 강조하는 것은 모두 영향력의 형태이다."}, {"n": 11, "en": "The ethical line is not whether nudging exists, but whether it is transparent, reversible, and aligned with the user's interests.", "ko": "윤리적 기준은 행동 유도가 존재하느냐가 아니라, 그것이 투명하고, 되돌릴 수 있으며, 사용자의 이익과 일치하는지이다."}, {"n": 12, "en": "In many cases, the most responsible approach is to make the lower-impact option the default, while keeping alternatives clearly available.", "ko": "많은 경우, 가장 책임 있는 접근 방법은 대안들을 분명하게 이용할 수 있도록 유지하면서 (환경에 미치는) 영향이 더 적은 선택지를 기본값으로 만드는 것이다."}, {"n": 13, "en": "Defaults are powerful, and when chosen carefully, they can reduce environmental impact without removing user agency.", "ko": "기본값들은 영향력이 크고, 신중하게 선택될 경우 그것들은 사용자 주체성을 없애지 않으면서 환경적 영향을 줄일 수 있다."}], "questions": [{"id": 1, "summary": "Design patterns like infinite scroll and autoplay (A) the control users have over their own experience, and many of them (B) people to use too much data and attention.", "ko": "무한 스크롤과 자동 재생 같은 디자인 패턴은 사용자가 자기 경험에 대해 가진 통제를 <b>(A) 방해하고</b>, 그중 많은 것이 사람들에게 데이터와 주의력을 너무 많이 쓰도록 <b>(B) 부추긴다</b>.", "opts": [["hinder", "urge"], ["hinder", "forbid"], ["support", "urge"], ["support", "forbid"], ["ignore", "teach"]], "optko": ["방해하다 – 부추기다", "방해하다 – 금지하다", "돕다 – 부추기다", "돕다 – 금지하다", "무시하다 – 가르치다"], "ans": 0, "wrong": [null, "forbid(금지하다)가 틀려요. 이런 패턴은 데이터와 주의력의 과잉 소비를 막는 게 아니라 부추겨요(encourage).", "support(돕다)가 틀려요. 이런 패턴은 사용자의 통제를 돕는 게 아니라 방해해요(interfere with).", "둘 다 틀려요. 패턴은 통제를 돕는 게 아니라 방해하고, 과잉 소비를 금지하는 게 아니라 부추겨요.", "둘 다 틀려요. 통제를 무시한다(ignore)는 말이 아니라 방해한다는 말이고, 가르친다(teach)는 말도 본문에 없어요."], "evid": [{"n": 1, "hl": ["all interfere with the user"]}, {"n": 2, "hl": ["many of these patterns encourage overconsumption of data and attention"]}], "swaps": [["interfere", "hinder", "방해하다 → 방해하다"], ["encourage", "urge", "부추기다 → 부추기다"]], "swapnote": "interfere(방해하다)는 hinder(방해하다)로, encourage(부추기다)는 urge(부추기다)로 바뀌었어요. overconsumption(과잉 소비)은 use too much(너무 많이 쓰다)로 풀어 썼어요.", "use": [{"w": "hinder", "ex": "The rain hindered our trip.", "ko": "비가 우리 여행을 방해했다.", "wk": "방해하다", "hk": "방해했다"}, {"w": "urge", "ex": "My mom urged me to eat more.", "ko": "엄마는 나에게 더 먹으라고 재촉했다.", "wk": "부추기다, 재촉하다", "hk": "재촉했다"}], "flow": "본문 1번에서 무한 스크롤, 자동 재생, 구매하려면 계정을 요구하는 것 같은 패턴이 사용자의 통제를 방해한다고 하고, 2번에서 지속 가능성으로 보면 이런 패턴이 데이터와 주의력의 과잉 소비를 부추긴다고 해요.", "jd": [["Design patterns like infinite scroll and autoplay", "무한 스크롤과 자동 재생 같은 디자인 패턴은"], ["[[hinder]] the control users have", "사용자가 가진 통제를 [[방해한다]]"], ["over their own experience,", "자기 경험에 대해,"], ["and many of them [[urge]] people", "그리고 그중 많은 것이 사람들을 [[부추긴다]]"], ["to use too much data and attention.", "데이터와 주의력을 너무 많이 쓰도록."]], "fc": [["본문 1번", "패턴이 사용자의 통제를 방해한다", "무한 스크롤, 자동 재생 같은 패턴은 사용자의 통제를 {{interfere|방해해요}}."], ["본문 2번", "너무 많이 쓰게 만든다", "이런 패턴은 데이터와 주의력의 {{overconsumption|과잉 소비}}를 {{encourage|부추겨요}}."], ["정답 포인트", "{{interfere|방해하다}} = {{hinder|방해하다}}, {{encourage|부추기다}} = {{urge|부추기다}}", "본문 단어가 다른 말로 바뀌어 나와요."]], "evid_full": [{"en": "Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all interfere with the user's control over their own experience.", "ko": "무한 스크롤, 자동 재생 영상, 혹은 단지 구매를 하     return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../yoyak.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+(EVK[String(q.id)]||q.evid_full.map(function(e){return [e.n]})).map(function(e){return e[0]+'번'}).join(', ')+'</p>';
    var EVS=EVK[String(q.id)];
    if(EVS)EVS.forEach(function(e){h+='<div class="ev"><div class="kk"><b class="evn">'+e[0]+'번</b> '+e[1]+'</div></div>'});
    else q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button><button class="btn sec" data-a="home">목록으로</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+='<button class="btn pri" data-a="sw">바꿔 말하기 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}

var EVK={};
var REL={};
function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
