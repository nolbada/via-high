var DATA={"meta": {"sch": "jusung-go1", "src": "common/sx-data-2610.js", "dir": "mock", "pidx": 0, "lesson": "26년 10월 21번", "title": "", "label": "", "page": "yoyak-2610-21"}, "scenes": [{"tag": "본문 1번", "ns": [1], "line": "[[unsatisfied|만족하지 못한]] 직업인들은 언젠가 기적처럼 [[perfect|완벽한]] 일자리를 우연히 만날 거라 믿는다.", "en": ["Among unsatisfied professionals, there's a repeating theme — the belief that someday (a mysterious day in the future) things will miraculously change and they'll stumble into the perfect job or career."], "kos": ["만족하지 못하는 직업인들 사이에는 되풀이해서 나타나는 주제가 있다. 그것은 언젠가 (미래의 알 수 없는 날에) 상황이 기적적으로 바뀌어 자신들이 우연히 완벽한 일자리나 경력을 마주칠 것이라는 믿음이다."]}, {"tag": "본문 2~3번", "ns": [2, 3], "line": "그러면서 지금 상황을 바꾸려는 일은 [[little|거의 하지 않는다]]. 일이 싫으면 무엇을 할까?", "en": ["At the same time, they (typically) do little to meaningfully alter their current situation.", "They don't like their job, so what do they do?"], "kos": ["그러면서도 그들은 (대체로) 자신의 현재 상황을 의미 있게 바꾸기 위해 하는 일이 거의 없다.", "그들이 자신의 일자리를 좋아하지 않는데, 그래서 그들은 무엇을 하는가?"]}, {"tag": "본문 4번", "ns": [4], "line": "구인란에서 [[similar|비슷한]] 직함의 일자리를 찾으며 마법 같은 변화를 바란다.", "en": ["They head to job boards and search for roles with a similar job title, hoping that the universe will sprinkle a bit of magic on their career if they just hit the refresh button in a different department or company."], "kos": ["그들은 구인란으로 가서 비슷한 직책의 일자리를 검색하고, 그들이 다른 부서나 회사에서 그저 새로 고침 버튼만 누르면 우주가 자신의 경력에 약간의 마법 가루를 뿌려 주기를 바란다."]}, {"tag": "본문 5번", "ns": [5], "line": "무언가 하는 기분은 들지만, 새 자리에서도 [[quickly|금방]] 전처럼 [[disenchanted|환상이 깨진다]].", "en": ["Efforts like this make professionals feel like they are doing something, when really they're just setting themselves up to take a new role and quickly become just as disenchanted as they were before."], "kos": ["이와 같은 노력은 직업인들로 하여금 자신들이 무언가를 하고 있는 것처럼 느끼게 하지만, 그때 실제로 그들은 단지 새로운 일자리를 구한 뒤 그들이 이전에 그랬던 것처럼 빠르게 환상이 깨질 상황에 스스로를 처하게 할 뿐이다."]}, {"tag": "본문 6~8번", "ns": [6, 7, 8], "line": "타이타닉호의 의자 옮기기일 뿐이다. [[approach|접근 방식]]을 [[completely|완전히]] 바꿔야 한다. 같은 게임은 같은 상을 준다.", "en": ["It's like rearranging deck chairs on the Titanic.", "You've got to completely switch up your approach.", "If you keep playing the same game, you'll win the same prizes."], "kos": ["이는 타이타닉호의 갑판 의자들을 재배치하는 것과 같다.", "여러분은 자신의 접근 방식을 완전히 바꾸어야 한다.", "여러분이 계속해서 같은 게임을 한다면, 똑같은 보상을 얻게 될 것이다."]}], "story": [{"a": "unsatisfied", "form": "unsatisfied", "n": 1, "sq": 1, "sum": "Many [[unhappy]] workers", "hook": "만족하지 못한 직업인들이라는 문장의 unsatisfied(만족하지 못한) → 요약문에서는 unhappy(불만인)로 바꿨어요.", "b": "unhappy", "k": "만족하지 못한 → 불만인", "en": "Among unsatisfied professionals, there's a repeating theme — the belief that someday (a mysterious day in the future) things will miraculously change and they'll stumble into the perfect job or career.", "ko": "만족하지 못하는 직업인들 사이에는 되풀이해서 나타나는 주제가 있다. 그것은 언젠가 (미래의 알 수 없는 날에) 상황이 기적적으로 바뀌어 자신들이 우연히 완벽한 일자리나 경력을 마주칠 것이라는 믿음이다."}, {"a": "perfect", "form": "perfect", "n": 1, "sq": 1, "sum": "find the [[ideal]] job", "hook": "완벽한 일자리를 우연히 만난다는 문장의 perfect(완벽한) → 요약문에서는 ideal(이상적인)로 바꿨어요.", "b": "ideal", "k": "완벽한 → 이상적인", "en": "Among unsatisfied professionals, there's a repeating theme — the belief that someday (a mysterious day in the future) things will miraculously change and they'll stumble into the perfect job or career.", "ko": "만족하지 못하는 직업인들 사이에는 되풀이해서 나타나는 주제가 있다. 그것은 언젠가 (미래의 알 수 없는 날에) 상황이 기적적으로 바뀌어 자신들이 우연히 완벽한 일자리나 경력을 마주칠 것이라는 믿음이다."}, {"a": "little", "form": "little", "n": 2, "sq": 1, "sum": "make [[minimal]] effort", "hook": "상황을 바꾸려고 하는 일이 거의 없다는 문장의 little(거의 없는 것) → 요약문에서는 minimal(아주 적은)로 바꿨어요.", "b": "minimal", "k": "거의 없는 것 → 아주 적은", "en": "At the same time, they (typically) do little to meaningfully alter their current situation.", "ko": "그러면서도 그들은 (대체로) 자신의 현재 상황을 의미 있게 바꾸기 위해 하는 일이 거의 없다."}, {"a": "similar", "form": "similar", "n": 4, "sq": 2, "sum": "look for [[comparable]] positions", "hook": "비슷한 직함의 일자리를 검색한다는 문장의 similar(비슷한) → 요약문에서는 comparable(비슷한)로 바꿨어요.", "b": "comparable", "k": "비슷한 → 비슷한", "en": "They head to job boards and search for roles with a similar job title, hoping that the universe will sprinkle a bit of magic on their career if they just hit the refresh button in a different department or company.", "ko": "그들은 구인란으로 가서 비슷한 직책의 일자리를 검색하고, 그들이 다른 부서나 회사에서 그저 새로 고침 버튼만 누르면 우주가 자신의 경력에 약간의 마법 가루를 뿌려 주기를 바란다."}, {"a": "quickly", "form": "quickly", "n": 5, "sq": 2, "sum": "they [[soon]] become", "hook": "빠르게 다시 환상이 깨진다는 문장의 quickly(빠르게) → 요약문에서는 soon(곧, 금방)으로 바꿨어요.", "b": "soon", "k": "빠르게 → 곧(금방)", "en": "Efforts like this make professionals feel like they are doing something, when really they're just setting themselves up to take a new role and quickly become just as disenchanted as they were before.", "ko": "이와 같은 노력은 직업인들로 하여금 자신들이 무언가를 하고 있는 것처럼 느끼게 하지만, 그때 실제로 그들은 단지 새로운 일자리를 구한 뒤 그들이 이전에 그랬던 것처럼 빠르게 환상이 깨질 상황에 스스로를 처하게 할 뿐이다."}, {"a": "disenchanted", "form": "disenchanted", "n": 5, "sq": 2, "sum": "become [[disappointed]] again", "hook": "전처럼 환상이 깨진다는 문장의 disenchanted(환상이 깨진) → 요약문에서는 disappointed(실망한)로 바꿨어요.", "b": "disappointed", "k": "환상이 깨진 → 실망한", "en": "Efforts like this make professionals feel like they are doing something, when really they're just setting themselves up to take a new role and quickly become just as disenchanted as they were before.", "ko": "이와 같은 노력은 직업인들로 하여금 자신들이 무언가를 하고 있는 것처럼 느끼게 하지만, 그때 실제로 그들은 단지 새로운 일자리를 구한 뒤 그들이 이전에 그랬던 것처럼 빠르게 환상이 깨질 상황에 스스로를 처하게 할 뿐이다."}, {"a": "completely", "form": "completely", "n": 7, "sq": 3, "sum": "[[entirely]] change", "hook": "접근 방식을 완전히 바꿔야 한다는 문장의 completely(완전히) → 요약문에서는 entirely(완전히)로 바꿨어요.", "b": "entirely", "k": "완전히 → 완전히", "en": "You've got to completely switch up your approach.", "ko": "여러분은 자신의 접근 방식을 완전히 바꾸어야 한다."}, {"a": "approach", "form": "approach", "n": 7, "sq": 3, "sum": "change your [[method]]", "hook": "너의 접근 방식을 바꾸라는 문장의 approach(접근 방식) → 요약문에서는 method(방법)로 바꿨어요.", "b": "method", "k": "접근 방식 → 방법", "en": "You've got to completely switch up your approach.", "ko": "여러분은 자신의 접근 방식을 완전히 바꾸어야 한다."}], "passage": [{"n": 1, "en": "Among unsatisfied professionals, there's a repeating theme — the belief that someday (a mysterious day in the future) things will miraculously change and they'll stumble into the perfect job or career.", "ko": "만족하지 못하는 직업인들 사이에는 되풀이해서 나타나는 주제가 있다. 그것은 언젠가 (미래의 알 수 없는 날에) 상황이 기적적으로 바뀌어 자신들이 우연히 완벽한 일자리나 경력을 마주칠 것이라는 믿음이다."}, {"n": 2, "en": "At the same time, they (typically) do little to meaningfully alter their current situation.", "ko": "그러면서도 그들은 (대체로) 자신의 현재 상황을 의미 있게 바꾸기 위해 하는 일이 거의 없다."}, {"n": 3, "en": "They don't like their job, so what do they do?", "ko": "그들이 자신의 일자리를 좋아하지 않는데, 그래서 그들은 무엇을 하는가?"}, {"n": 4, "en": "They head to job boards and search for roles with a similar job title, hoping that the universe will sprinkle a bit of magic on their career if they just hit the refresh button in a different department or company.", "ko": "그들은 구인란으로 가서 비슷한 직책의 일자리를 검색하고, 그들이 다른 부서나 회사에서 그저 새로 고침 버튼만 누르면 우주가 자신의 경력에 약간의 마법 가루를 뿌려 주기를 바란다."}, {"n": 5, "en": "Efforts like this make professionals feel like they are doing something, when really they're just setting themselves up to take a new role and quickly become just as disenchanted as they were before.", "ko": "이와 같은 노력은 직업인들로 하여금 자신들이 무언가를 하고 있는 것처럼 느끼게 하지만, 그때 실제로 그들은 단지 새로운 일자리를 구한 뒤 그들이 이전에 그랬던 것처럼 빠르게 환상이 깨질 상황에 스스로를 처하게 할 뿐이다."}, {"n": 6, "en": "It's like rearranging deck chairs on the Titanic.", "ko": "이는 타이타닉호의 갑판 의자들을 재배치하는 것과 같다."}, {"n": 7, "en": "You've got to completely switch up your approach.", "ko": "여러분은 자신의 접근 방식을 완전히 바꾸어야 한다."}, {"n": 8, "en": "If you keep playing the same game, you'll win the same prizes.", "ko": "여러분이 계속해서 같은 게임을 한다면, 똑같은 보상을 얻게 될 것이다."}], "questions": [{"id": 1, "summary": "Many unhappy workers believe that someday they will find the (A) job by chance, while they make (B) effort to change their present situation.", "ko": "많은 불만인 직장인들은 언젠가 우연히 <b>(A) 이상적인</b> 일자리를 찾게 될 거라 믿으면서도, 지금 상황을 바꾸려는 노력은 <b>(B) 아주 적게</b> 한다.", "opts": [["ideal", "great"], ["ideal", "minimal"], ["boring", "minimal"], ["boring", "great"], ["dangerous", "constant"]], "optko": ["이상적인 – 큰", "이상적인 – 아주 적은", "지루한 – 아주 적은", "지루한 – 큰", "위험한 – 끊임없는"], "ans": 1, "wrong": ["great(큰)가 틀려요. 본문은 그들이 지금 상황을 바꾸려고 하는 일이 거의 없다고 해요(do little).", null, "boring(지루한)이 틀려요. 그들이 언젠가 마주칠 거라 믿는 건 완벽한(perfect) 일자리예요. 지루한 일자리를 꿈꾸는 사람은 없죠.", "둘 다 틀려요. 그들이 꿈꾸는 건 지루한 일자리가 아니라 완벽한 일자리이고, 노력은 큰 게 아니라 거의 없어요.", "둘 다 틀려요. 위험한(dangerous) 일자리를 꿈꾸는 게 아니고, 끊임없는(constant) 노력은 거의 하지 않는다는 본문과 반대예요."], "evid": [{"n": 1, "hl": ["things will miraculously change", "stumble into the perfect job or career"]}, {"n": 2, "hl": ["they (typically) do little to meaningfully alter their current situation"]}], "swaps": [["perfect", "ideal", "완벽한 → 이상적인"], ["little", "minimal", "거의 없는 것 → 아주 적은"], ["unsatisfied", "unhappy", "만족하지 못한 → 불만인"]], "swapnote": "perfect(완벽한)는 ideal(이상적인)로, do little(거의 하지 않다)은 make minimal effort(아주 적은 노력을 하다)로 바뀌었어요. 꿈은 크고 노력은 작다는 대비가 핵심이에요.", "use": [{"w": "ideal", "ex": "This is an ideal place for a picnic.", "ko": "이곳은 소풍 가기에 이상적인 장소다.", "wk": "이상적인, 완벽한", "hk": "이상적인"}, {"w": "minimal", "ex": "The storm caused minimal damage.", "ko": "그 폭풍은 아주 적은 피해만 남겼다.", "wk": "아주 적은, 최소한의", "hk": "아주 적은"}], "flow": "본문 1번에서 만족하지 못한 직업인들은 언젠가 기적처럼 완벽한 일자리를 우연히 만날 거라 믿는다고 하고, 2번에서 그러면서도 지금 상황을 바꾸려고 하는 일은 거의 없다고 꼬집어요.", "jd": [["Many unhappy workers believe", "많은 불만인 직장인들은 믿는다"], ["that someday they will find the [[ideal]] job by chance,", "언젠가 우연히 [[이상적인]] 일자리를 찾게 될 거라고,"], ["while they make [[minimal]] effort", "그러면서 [[아주 적은]] 노력만 한다"], ["to change their present situation.", "지금 상황을 바꾸려는."]], "fc": [["본문 1번", "언젠가 기적이 올 거라는 믿음", "언젠가 {{perfect|완벽한}} 일자리를 우연히 만날 거라고 믿어요."], ["본문 2번", "그런데 바꾸려는 노력은 거의 없다", "지금 상황을 {{alter|바꾸는}} 일은 {{little|거의 없어요}}."], ["정답 포인트", "{{perfect|완벽한}} = {{ideal|이상적인}}, {{little|거의 없는 것}} = {{minimal|아주 적은}}", "본문 단어가 다른 말로 바뀌어 나와요."]], "evid_full": [{"en": "Among unsatisfied professionals, there's a repeating theme — the belief that someday (a mysterious day in the future) things will miraculously change and they'll stumble into the perfect job or career.", "ko": "만족하지 못하는 직업인들 사이에는 되풀이해서 나타나는 주제가 있다. 그것은 언젠가 (미래의 알 수 없는 날에) 상황이 기적적으로 바뀌어 자신들이 우연히 완벽한 일자리나 경력을 마주칠 것이라는 믿음이다.", "hl": ["things will miraculously change", "stumble into the perfect job or career"], "hlko": ["상황이 기적적으로 바뀌어", "우연히 완벽한 일자리나 경력을 마주칠 것이라는"], "n": 1}, {"en": "At the same time, they (typically) do little to meaningfully alter their current situation.", "ko": "그러면서도 그들은 (대체로) 자신의 현재 상황을 의미 있게 바꾸기 위해 하는 일이 거의 없다.", "hl": ["they (typically) do little to meaningfully alter their current situation"], "hlko": ["자신의 현재 상황을 의미 있게 바꾸기 위해 하는 일이 거의 없다"], "n": 2}]}, {"id": 2, "summary": "When they dislike their jobs, they look for (A) positions elsewhere, but such efforts only make them feel busy, and they soon become (B) again.", "ko": "그들은 자기 일자리가 싫으면 다른 곳에서 <b>(A) 비슷한</b> 일자리를 찾지만, 그런 노력은 바쁘다고 느끼게 할 뿐이고 그들은 곧 다시 <b>(B) 실망하게</b> 된다.", "opts": [["comparable", "satisfied"], ["unrelated", "disappointed"], ["unrelated", "satisfied"], ["comparable", "disappointed"], ["creative", "relaxed"]], "optko": ["비슷한 – 만족한", "관련 없는 – 실망한", "관련 없는 – 만족한", "비슷한 – 실망한", "창의적인 – 느긋한"], "ans": 3, "wrong": ["satisfied(만족한)가 틀려요. 본문은 새 일자리를 얻어도 전과 똑같이 빠르게 환상이 깨진다고 해요(disenchanted).", "unrelated(관련 없는)가 틀려요. 그들은 비슷한 직함(similar job title)의 일자리를 검색해요. 전혀 다른 일을 찾는 게 아니에요.", "둘 다 틀려요. 그들은 관련 없는 일이 아니라 비슷한 일을 찾고, 결국 만족하는 게 아니라 다시 환상이 깨져요.", null, "둘 다 틀려요. 창의적인(creative) 일자리나 느긋한(relaxed) 기분 이야기는 본문에 없어요. 비슷한 일을 찾고 다시 실망해요."], "evid": [{"n": 4, "hl": ["search for roles with a similar job title"]}, {"n": 5, "hl": ["make professionals feel like they are doing something", "quickly become just as disenchanted as they were before"]}], "swaps": [["similar", "comparable", "비슷한 → 비슷한"], ["disenchanted", "disappointed", "환상이 깨진 → 실망한"], ["role", "position", "일자리 → 일자리"], ["quickly", "soon", "빠르게 → 곧(금방)"]], "swapnote": "similar(비슷한)는 comparable(비슷한)로, disenchan   var lem=g[0],id=lem.toLowerCase();
  $('sw').textContent=key.toLowerCase()===id?lem:key+'  →  '+lem;
  $('sl').textContent=g[1];
  $('sn').textContent='';
  $('sheet').className='on';
  document.querySelectorAll('.w[data-k]').forEach(function(e){var gg=G[e.getAttribute('data-k')];if(gg&&gg[0].toLowerCase()===id)e.classList.add('got')});
}
document.addEventListener('click',function(e){
  var w=e.target.closest&&e.target.closest('.w');
  if(w){e.stopPropagation();tapWord(w.getAttribute('data-k'));return}
  if(!(e.target.closest&&e.target.closest('#sheet')))hideSheet();
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');
  else if(act==='q')go('q',+v);
  else if(act==='pick')pick(+v);
  else if(act==='rmnote'){var rid=String(v);var rn=NOTES[rid];delete NOTES[rid];jset(K_NOTE,NOTES);delete PUSHED['w:'+rid];jset('vhvs:'+SCH,PUSHED);try{WN.del(rn?rn.l:rid,SRC)}catch(x){}render()}
  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='star'){if(STAR[v])delete STAR[v];else STAR[v]=1;jset(K_STAR,STAR);render()}
  else if(act==='staronly'){swStarOnly=!swStarOnly;render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){return; /* 바꿔 말하기 단어는 선생님 질문 목록에 따로 올리지 않는다: 학생 목록 = 선생님 열람 목록 */
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}

function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
