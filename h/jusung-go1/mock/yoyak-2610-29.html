<script>
var DATA={"meta": {"sch": "jusung-go1", "src": "common/sx-data-2610.js", "dir": "mock", "pidx": 4, "lesson": "26년 10월 29번", "title": "", "label": "", "page": "yoyak-2610-29"}, "scenes": [{"tag": "본문 1~3번", "ns": [1, 2, 3], "line": "히드라와 불멸의 해파리는 늙는 티가 안 나서 불멸이라고 불리지만, 죽지 않는다는 뜻은 아니다.", "en": ["Since hydra and the immortal jellyfish don't exhibit obvious signs of aging, they are often called biologically immortal.", "This doesn't mean they don't die.", "Nor does it even mean that they cannot die of biological causes."], "kos": ["히드라와 불멸의 해파리는 명백한 노화의 징후들을 보이지 않기 때문에, 그것들은 흔히 생물학적으로 죽지 않는다고 여겨진다.", "이는 그것들이 죽지 않는다는 것을 의미하지는 않는다.", "심지어 그것들이 생물학적 원인으로 죽을 ‘수 없다’는 것을 의미하는 것도 아니다."]}, {"tag": "본문 4~5번", "ns": [4, 5], "line": "나이가 들어도 죽을 [[likelihood|가능성]]이 늘지 않아서, 노화를 [[defeat|물리칠]] 단서를 찾는 과학자들을 [[excite|흥분시킨다]].", "en": ["But, unlike most every animal, their likelihood of dying does not increase with age.", "Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process."], "kos": ["하지만, 대부분의 모든 동물과 달리, 그것들이 죽을 가능성은 나이가 들면서 증가하지 않는다.", "히드라와 불멸의 해파리와 같은 종들은 그것들이 노화 작용을 물리치는 방법에 관한 단서들을 제공할지도 모르기 때문에 노화학자들을 흥분시킨다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "하지만 몸을 통째로 [[regenerate|재생하는]] 모습은 사람보다 나무와 [[similar|비슷하다]]. 그래서 사람의 노화와 얼마나 관련 있을지 모른다.", "en": ["But their property of being able to regenerate entire body parts, or even a whole organism, makes them more similar to trees than to us.", "Although we may learn some fascinating things about their lack of apparent aging, it is not at all clear how relevant those findings will be to human aging."], "kos": ["하지만 전체 신체 부위나 심지어는 한 생물체 전체를 재생할 수 있는 그것들의 특성은 그것들을 우리보다는 나무들과 더 유사하게 만든다.", "비록 우리가 그것들의 명백한 노화의 결여에 관한 몇 가지 흥미로운 사실들을 알게 될 수 있을지라도, 그러한 발견들이 인간의 노화에 얼마나 관련이 있을지는 전혀 명확하지 않다."]}, {"tag": "본문 8~9번", "ns": [8, 9], "line": "[[fundamental|근본적인]] 원리는 모두에게 같기도 하지만, 우리와 가까운 쥐의 발견도 사람에게 [[translate|적용하기]] 어렵다.", "en": ["Sometimes biology is universal, especially if it relates to fundamental mechanisms.", "But in other cases, even discoveries in rats or mice, which are mammals and biologically much closer to us, are difficult to translate into humans."], "kos": ["때때로 생명 작용은 보편적인데, 특히 그것이 근본적인 메커니즘과 관련이 있다면 그러하다.", "하지만 다른 경우들에서는, 포유류이며 생물학적으로 우리에게 훨씬 더 가까운, 쥐나 생쥐에서의 발견들조차도 인간에게 적용하기가 어렵다."]}, {"tag": "본문 10번", "ns": [10], "line": "그러니 히드라의 발견이 우리에게 [[useful|유용해지기]]까지는 아주 오래 걸릴 수 있다.", "en": ["It may be a very long time before any findings gained from hydra or jellyfish are useful to us."], "kos": ["히드라나 해파리로부터 얻은 어떠한 발견들도 우리에게 유용해지기까지는 매우 오랜 시간이 걸릴지도 모른다."]}], "story": [{"a": "likelihood", "form": "likelihood", "n": 4, "sq": 1, "sum": "whose [[chance]] of dying", "hook": "나이가 들어도 죽을 가능성이 늘지 않는다는 문장의 likelihood(가능성) → 요약문에서는 chance(가능성)로 바꿨어요.", "b": "chance", "k": "가능성 → 가능성", "en": "But, unlike most every animal, their likelihood of dying does not increase with age.", "ko": "하지만, 대부분의 모든 동물과 달리, 그것들이 죽을 가능성은 나이가 들면서 증가하지 않는다."}, {"a": "excite", "form": "excite", "n": 5, "sq": 1, "sum": "[[thrill]] aging scientists", "hook": "히드라와 해파리가 노화학자들을 흥분시킨다는 문장의 excite(흥분시키다) → 요약문에서는 thrill(설레게 하다)로 바꿨어요.", "b": "thrill", "k": "흥분시키다 → 설레게 하다", "en": "Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.", "ko": "히드라와 불멸의 해파리와 같은 종들은 그것들이 노화 작용을 물리치는 방법에 관한 단서들을 제공할지도 모르기 때문에 노화학자들을 흥분시킨다."}, {"a": "defeat", "form": "defeat", "n": 5, "sq": 1, "sum": "how to [[beat]] aging", "hook": "노화 작용을 물리치는 방법이라는 문장의 defeat(물리치다) → 요약문에서는 beat(이기다)로 바꿨어요.", "b": "beat", "k": "물리치다 → 이기다", "en": "Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.", "ko": "히드라와 불멸의 해파리와 같은 종들은 그것들이 노화 작용을 물리치는 방법에 관한 단서들을 제공할지도 모르기 때문에 노화학자들을 흥분시킨다."}, {"a": "regenerate", "form": "regenerate", "n": 6, "sq": 2, "sum": "ability to [[regrow]] entire body parts", "hook": "몸 부위 전체를 재생할 수 있다는 문장의 regenerate(재생하다) → 요약문에서는 regrow(다시 자라게 하다)로 바꿨어요.", "b": "regrow", "k": "재생하다 → 다시 자라게 하다", "en": "But their property of being able to regenerate entire body parts, or even a whole organism, makes them more similar to trees than to us.", "ko": "하지만 전체 신체 부위나 심지어는 한 생물체 전체를 재생할 수 있는 그것들의 특성은 그것들을 우리보다는 나무들과 더 유사하게 만든다."}, {"a": "similar", "form": "similar", "n": 6, "sq": 2, "sum": "more [[comparable]] to trees", "hook": "우리보다 나무와 더 비슷하다는 문장의 similar(비슷한) → 요약문에서는 comparable(비슷한)로 바꿨어요.", "b": "comparable", "k": "비슷한 → 비슷한", "en": "But their property of being able to regenerate entire body parts, or even a whole organism, makes them more similar to trees than to us.", "ko": "하지만 전체 신체 부위나 심지어는 한 생물체 전체를 재생할 수 있는 그것들의 특성은 그것들을 우리보다는 나무들과 더 유사하게 만든다."}, {"a": "fundamental", "form": "fundamental", "n": 8, "sq": 3, "sum": "involves [[basic]] mechanisms", "hook": "근본적인 원리와 관련될 때라는 문장의 fundamental(근본적인) → 요약문에서는 basic(기본적인)으로 바꿨어요.", "b": "basic", "k": "근본적인 → 기본적인", "en": "Sometimes biology is universal, especially if it relates to fundamental mechanisms.", "ko": "때때로 생명 작용은 보편적인데, 특히 그것이 근본적인 메커니즘과 관련이 있다면 그러하다."}, {"a": "translate", "form": "translate", "n": 9, "sq": 3, "sum": "hard to [[apply]] to humans", "hook": "쥐의 발견도 인간에게 적용하기 어렵다는 문장의 translate(적용하다) → 요약문에서는 apply(적용하다)로 바꿨어요.", "b": "apply", "k": "적용하다 → 적용하다", "en": "But in other cases, even discoveries in rats or mice, which are mammals and biologically much closer to us, are difficult to translate into humans.", "ko": "하지만 다른 경우들에서는, 포유류이며 생물학적으로 우리에게 훨씬 더 가까운, 쥐나 생쥐에서의 발견들조차도 인간에게 적용하기가 어렵다."}, {"a": "useful", "form": "useful", "n": 10, "sq": 3, "sum": "become [[helpful]] to us", "hook": "우리에게 유용해지기까지 오래 걸린다는 문장의 useful(유용한) → 요약문에서는 helpful(도움이 되는)로 바꿨어요.", "b": "helpful", "k": "유용한 → 도움이 되는", "en": "It may be a very long time before any findings gained from hydra or jellyfish are useful to us.", "ko": "히드라나 해파리로부터 얻은 어떠한 발견들도 우리에게 유용해지기까지는 매우 오랜 시간이 걸릴지도 모른다."}], "passage": [{"n": 1, "en": "Since hydra and the immortal jellyfish don't exhibit obvious signs of aging, they are often called biologically immortal.", "ko": "히드라와 불멸의 해파리는 명백한 노화의 징후들을 보이지 않기 때문에, 그것들은 흔히 생물학적으로 죽지 않는다고 여겨진다."}, {"n": 2, "en": "This doesn't mean they don't die.", "ko": "이는 그것들이 죽지 않는다는 것을 의미하지는 않는다."}, {"n": 3, "en": "Nor does it even mean that they cannot die of biological causes.", "ko": "심지어 그것들이 생물학적 원인으로 죽을 ‘수 없다’는 것을 의미하는 것도 아니다."}, {"n": 4, "en": "But, unlike most every animal, their likelihood of dying does not increase with age.", "ko": "하지만, 대부분의 모든 동물과 달리, 그것들이 죽을 가능성은 나이가 들면서 증가하지 않는다."}, {"n": 5, "en": "Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.", "ko": "히드라와 불멸의 해파리와 같은 종들은 그것들이 노화 작용을 물리치는 방법에 관한 단서들을 제공할지도 모르기 때문에 노화학자들을 흥분시킨다."}, {"n": 6, "en": "But their property of being able to regenerate entire body parts, or even a whole organism, makes them more similar to trees than to us.", "ko": "하지만 전체 신체 부위나 심지어는 한 생물체 전체를 재생할 수 있는 그것들의 특성은 그것들을 우리보다는 나무들과 더 유사하게 만든다."}, {"n": 7, "en": "Although we may learn some fascinating things about their lack of apparent aging, it is not at all clear how relevant those findings will be to human aging.", "ko": "비록 우리가 그것들의 명백한 노화의 결여에 관한 몇 가지 흥미로운 사실들을 알게 될 수 있을지라도, 그러한 발견들이 인간의 노화에 얼마나 관련이 있을지는 전혀 명확하지 않다."}, {"n": 8, "en": "Sometimes biology is universal, especially if it relates to fundamental mechanisms.", "ko": "때때로 생명 작용은 보편적인데, 특히 그것이 근본적인 메커니즘과 관련이 있다면 그러하다."}, {"n": 9, "en": "But in other cases, even discoveries in rats or mice, which are mammals and biologically much closer to us, are difficult to translate into humans.", "ko": "하지만 다른 경우들에서는, 포유류이며 생물학적으로 우리에게 훨씬 더 가까운, 쥐나 생쥐에서의 발견들조차도 인간에게 적용하기가 어렵다."}, {"n": 10, "en": "It may be a very long time before any findings gained from hydra or jellyfish are useful to us.", "ko": "히드라나 해파리로부터 얻은 어떠한 발견들도 우리에게 유용해지기까지는 매우 오랜 시간이 걸릴지도 모른다."}], "questions": [{"id": 1, "summary": "Hydra and the immortal jellyfish, whose (A) of dying does not rise as they grow older, (B) aging scientists because they may hold clues about how to beat aging.", "ko": "나이가 들어도 죽을 <b>(A) 가능성</b>이 늘지 않는 히드라와 불멸의 해파리는, 노화를 이기는 방법에 대한 단서를 가지고 있을지도 몰라서 노화를 연구하는 과학자들을 <b>(B) 설레게 한다</b>.", "opts": [["chance", "bore"], ["chance", "thrill"], ["pain", "thrill"], ["pain", "bore"], ["fear", "worry"]], "optko": ["가능성 – 지루하게 하다", "가능성 – 설레게 하다", "고통 – 설레게 하다", "고통 – 지루하게 하다", "두려움 – 걱정시키다"], "ans": 1, "wrong": ["bore(지루하게 하다)가 틀려요. 본문은 이 동물들이 노화학자들을 흥분시킨다(excite)고 해요. 노화를 이길 단서가 있을지도 모르니까요.", null, "pain(고통)이 틀려요. 본문이 말하는 건 죽는 고통이 아니라 죽을 가능성(likelihood)이에요. 나이가 들어도 그 가능성이 늘지 않아요.", "둘 다 틀려요. 늘지 않는 것은 고통이 아니라 죽을 가능성이고, 과학자들은 지루해하는 게 아니라 흥분해요.", "둘 다 틀려요. 두려움(fear)은 본문에 나오지 않고, 과학자들은 걱정하는(worry) 게 아니라 단서를 기대하며 흥분해요."], "evid": [{"n": 1, "hl": ["don't exhibit obvious signs of aging"]}, {"n": 4, "hl": ["their likelihood of dying does not increase with age"]}, {"n": 5, "hl": ["excite gerontologists", "provide clues about how to defeat the aging process"]}], "swaps": [["likelihood", "chance", "가능성 → 가능성"], ["excite", "thrill", "흥분시키다 → 설레게 하다"], ["defeat", "beat", "물리치다 → 이기다"]], "swapnote": "likelihood(가능성)는 chance(가능성)로, excite(흥분시키다)는 thrill(설레게 하다)로, defeat(물리치다)는 beat(이기다)로 바뀌었어요. gerontologists(노화학자들)는 aging scientists(노화를 연구하는 과학자들)로 풀어 썼어요.", "use": [{"w": "chance", "ex": "There is a good chance of rain today.", "ko": "오늘은 비가 올 가능성이 꽤 높다.", "wk": "가능성", "hk": "가능성"}, {"w": "thrill", "ex": "The news will thrill the fans.", "ko": "그 소식은 팬들을 설레게 할 것이다.", "wk": "몹시 흥분시키다, 설레게 하다", "hk": "설레게 할"}], "flow": "본문 1번에서 히드라와 불멸의 해파리는 노화의 징후를 보이지 않아 불멸이라고 불린다고 하고, 2~3번에서 그렇다고 죽지 않는다는 뜻은 아니라고 해요. 4번에서 다만 나이가 들어도 죽을 가능성이 늘지 않는다고 하고, 5번에서 그래서 노화학자들이 흥분한다고 해요.", "jd": [["Hydra and the immortal jellyfish,", "히드라와 불멸의 해파리는,"], ["whose [[chance]] of dying does not rise", "죽을 [[가능성]]이 늘지 않는"], ["as they grow older,", "나이가 들어도,"], ["[[thrill]] aging scientists", "노화를 연구하는 과학자들을 [[설레게 한다]]"], ["because they may hold clues", "단서를 가지고 있을지도 모르기 때문에"], ["about how to beat aging.", "노화를 이기는 방법에 대한."]], "fc": [["본문 1~3번", "불멸이라 불리지만 죽기도 한다", "히드라와 해파리는 노화의 {{sign|징후}}가 안 보여 {{immortal|불멸의}} 동물이라 불려요. 그래도 죽을 수는 있어요."], ["본문 4~5번", "나이 들어도 죽을 가능성이 늘지 않는다", "죽을 {{likelihood|가능성}}이 나이와 함께 늘지 않아서 과학자들을 {{excite|흥분시켜요}}."], ["정답 포인트", "{{likelihood|가능성}} = {{chance|가능성}}, {{excite|흥분시키다}} = {{thrill|설레게 하다}}", "본문 단어가 쉬운 말로 바뀌어 나와요."]], "evid_full": [{"en": "Since hydra and the immortal jellyfish don't exhibit obvious signs of aging, they are often called biologically immortal.", "ko": "히드라와 불멸의 해파리는 명백한 노화의 징후들을 보이지 않기 때문에, 그것들은 흔히 생물학적으로 죽지 않는다고 여겨진다.", "hl": ["don't exhibit obvious signs of aging"], "hlko": ["명백한 노화의 징후들을 보이지 않기 때문에"], "n": 1}, {"en": "But, unlike most every animal, their likelihood of dying does not increase with age.", "ko": "하지만, 대부분의 모든 동물과 달리, 그것들이 죽을 가능성은 나이가 들면서 증가하지 않는다.", "hl": ["their likelihood of dying does not increase with age"], "hlko": ["그것들이 죽을 가능성은 나이가 들면서 증가하지 않는다"], "n": 4}, {"en": "Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.", "ko": "히드라와 불멸의 해파리와 같은 종들은 그것들이 노화 작용을 물리치는 방법에 관한 단서들을 제공할지도 모르기 때문에 노화학자들을 흥분시킨다.", "hl": ["excite gerontologists", "provide clues about how to defeat the aging process"], "hlko": ["노화학자들을 흥분시킨다", "노화 작용을 물리치는 방법에 관한 단서들을 제공할지도"], "n": 5}]}, {"id": 2, "summary": "Their ability to (A) entire body parts makes hydra and jellyfish more (B) to trees than to humans, so it is unclear how much the findings about them will apply to human aging.", "ko": "신체 부위 전체를 <b>(A) 다시 자라게 하는</b> 능력 때문에 히드라와 해파리는 인간보다 나무와 더 <b>(B) 비슷하므로</b>, 그것들에 대한 발견이 인간의 노화에 얼마나 적용될지는 분명하지 않다.", "opts": [["regrow", "opposite"], ["freeze", "comparable"], ["freeze", "opposite"], ["regrow", "comparable"], ["hide", "unrelated"]], "optko": ["다시 자라게 하다 – 정반대인", "얼리다 – 비슷한", "얼리다 – 정반대인", "다시 자라게 하다 – 비슷한", "숨기다 – 관계없는"], "ans": 3, "wrong": ["opp   o=o.replace(/([A-Za-z][A-Za-z' ]*[A-Za-z])\(([가-힣][가-힣 ,·]*)\)/g,'<mark>$1</mark>(<mark>$2</mark>)');
  o=o.replace(/([가-힣]+)\(([A-Za-z][A-Za-z' ]*[A-Za-z])\)/g,'<mark>$1</mark>(<mark>$2</mark>)');
  return o;
}
function useEx(u){
  var re=new RegExp('\\b'+u.w+'\\w*','i');
  return u.ex.split(new RegExp('('+re.source+')','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('');
}
function richKo(t,hl){
  var pos=[];(hl||[]).forEach(function(h){var i=t.indexOf(h);if(i>=0)pos.push([i,i+h.length])});
  pos.sort(function(a,b){return a[0]-b[0]});
  var c=0,o='';
  pos.forEach(function(p){if(p[0]<c)return;o+=esc(t.slice(c,p[0]))+'<mark>'+esc(t.slice(p[0],p[1]))+'</mark>';c=p[1]});
  return o+esc(t.slice(c));
}
function rich(t,hl){
  if(!hl||!hl.length)return words(t);
  var pos=[];hl.forEach(function(h){var i=t.indexOf(h);if(i>=0)pos.push([i,i+h.length])});
  pos.sort(function(a,b){return a[0]-b[0]});
  var c=0,o='';
  pos.forEach(function(p){if(p[0]<c)return;o+=words(t.slice(c,p[0]))+'<mark>'+words(t.slice(p[0],p[1]))+'</mark>';c=p[1]});
  return o+words(t.slice(c));
}
function sumHtml(q,done){
  var o='';
  q.summary.split(/(\(A\)|\(B\))/).forEach(function(p){
    if(p==='(A)'||p==='(B)'){
      if(done)o+='<span class="fill">'+words(q.opts[q.ans][p==='(A)'?0:1])+'</span>';
      else o+='<span class="blank">'+p+'</span>';
    }else o+=words(p);
  });
  return o;
}
function nNotes(){return Object.keys(NOTES).length}
function firstOpen(){for(var i=0;i<Qs.length;i++)if(PR.a[Qs[i].id]===undefined)return i;return -1}
function doneCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]!==undefined)n++});return n}
function okCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]===q.ans)n++});return n}
function hideSheet(){$('sheet').className=''}
var histPushed=false;
function go(v,i){
  if(i!==undefined)cur=i;
  if(v==='home'&&view!=='home'&&histPushed){histPushed=false;try{history.back();return}catch(e){}}
  if(v!=='home'&&view==='home'){try{history.pushState({v:v},'');histPushed=true}catch(e){}}
  view=v;try{if(v==='home')sessionStorage.removeItem('vhyv');else sessionStorage.setItem('vhyv',JSON.stringify({p:location.pathname,v:v,c:cur,t:Date.now()}))}catch(e){}
  hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)
}
window.addEventListener('popstate',function(){histPushed=false;view='home';try{sessionStorage.removeItem('vhyv')}catch(e){}hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)});
function sayBtn(){return ''}


/* 단어 누르기: 뜻을 보여 주고 단어노트에 자동으로 담는다 */
function tapWord(key){
  var g=G[key];if(!g)return;
  var lem=g[0],id=lem.toLowerCase();
  $('sw').textContent=key.toLowerCase()===id?lem:key+'  →  '+lem;
  $('sl').textContent=g[1];
  $('sn').textContent='';
  $('sheet').className='on';
  document.querySelectorAll('.w[data-k]').forEach(function(e){var gg=G[e.getAttribute('data-k')];if(gg&&gg[0].toLowerCase()===id)e.classList.add('got')});
}
document.addEventListener('click',function(e){
  var w=e.target.closest&&e.target.closest('.w');
  if(w){e.stopPropagation();tapWord(w.getAttribute('data-k'));return}
  if(!(e.target.closest&&e.target.closest('#sheet')))hideSheet();
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');
  else if(act==='q')go('q',+v);
  else if(act==='pick')pick(+v);
  else if(act==='rmnote'){var rid=String(v);var rn=NOTES[rid];delete NOTES[rid];jset(K_NOTE,NOTES);delete PUSHED['w:'+rid];jset('vhvs:'+SCH,PUSHED);try{WN.del(rn?rn.l:rid,SRC)}catch(x){}render()}
  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='star'){if(STAR[v])delete STAR[v];else STAR[v]=1;jset(K_STAR,STAR);render()}
  else if(act==='staronly'){swStarOnly=!swStarOnly;render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){return; /* 바꿔 말하기 단어는 선생님 질문 목록에 따로 올리지 않는다: 학생 목록 = 선생님 열람 목록 */
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={},swStarOnly=false;

function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
