"core": "군인 아닌 학자·전문가들 = '모뉴먼츠 맨'", "why": "They(그들) = 345명 → 군인이 아닌 학자·전문가라는 정체 설명"}, {"core": "처음 목표: 폭격 막기와 파괴된 건축·예술품 복원", "why": "When the MFAA was first formed(처음 결성됐을 때) → 이름 소개 뒤 처음 역할"}, {"core": "역할 확대의 배경: 나치가 훔쳐 숨긴 보물", "why": "It wasn't long before(머지않아) their role expanded(역할 확대) → 원래 역할 다음"}]}, {"id": "g1_jusung_L3-p2", "label": "3과 ② 보물찾기와 알타우제 광산", "sents": [{"en": "When the Monuments Men learned about this, they started looking for the stolen treasures.", "ko": "모뉴먼츠 맨은 이 사실을 알게 되자 도난당한 보물들을 찾기 시작했다."}, {"en": "Their search has since been called “the greatest treasure hunt in history.”", "ko": "그들의 수색은 이후 '역사상 가장 위대한 보물찾기'라고 불려 왔다."}, {"en": "When Germany began to lose the war, the stolen objects came under threat.", "ko": "독일이 전쟁에서 지기 시작하자, 도난당한 물건들은 위험에 처하게 되었다."}, {"en": "Hitler ordered his forces to destroy everything that could be useful to the Allied armies before they retreated from an area.", "ko": "히틀러는 군대에게 한 지역에서 후퇴하기 전에 연합군에게 쓸모 있을 만한 것은 모두 파괴하라고 명령했다."}, {"en": "Some Nazi leaders believed that this included not just military and industrial equipment but everything of value — even the stolen works of art.", "ko": "일부 나치 지도자들은 여기에 군사·산업 장비뿐 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품까지 포함된다고 여겼다."}, {"en": "One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria.", "ko": "도난당한 물품을 가장 많이 모아 둔 곳 중 하나는 오스트리아 알타우제의 소금 광산이었다."}, {"en": "Upon discovering its location, some of the Monuments Men rushed to the mines.", "ko": "그 위치를 알아내자마자 모뉴먼츠 맨 일부가 광산으로 서둘러 갔다."}, {"en": "They hoped to recover everything before it was too late.", "ko": "그들은 너무 늦기 전에 모든 것을 되찾기를 바랐다."}, {"en": "Meanwhile, the Nazi leader who was in charge of the area tried to destroy everything by setting off large explosives inside the mines.", "ko": "한편, 그 지역을 맡고 있던 나치 지도자는 광산 안에서 대형 폭발물을 터뜨려 모든 것을 파괴하려 했다."}, {"en": "This could have been disastrous.", "ko": "이것은 처참한 결과를 낳을 수도 있었다."}], "chunks": [[0, 1], [2, 4], [5, 6], [7, 9]], "half": 5, "ex": [{"hea  일"}, {"core": "독일 패색 → 히틀러의 파괴 명령, 예술품까지 위험", "why": "When Germany began to lose the war(독일이 지기 시작하자) → 시간 흐름, under threat(위협)"}, {"core": "최대 도난품 보관처 알타우제 광산으로 달려감", "why": "One of the largest collections(가장 큰 도난품 더미) → 위험해진 예술품 중 대표 장소"}, {"core": "되찾기 전 나치의 광산 폭파 시도, 대참사 위기", "why": "They hoped(그들은 바랐다) = 광산으로 달려간 모뉴먼츠 맨의 바람"}]}, {"id": "g1_jusung_L3-p3", "label": "3과 ③ 광부들의 기지와 두 달의 기한", "sents": [{"en": "Luckily, some local miners found the explosives in the mines and came up with a plan to protect their livelihood.", "ko": "다행히 그 지역 광부 몇 명이 광산에서 폭발물을 발견했고, 자신들의 생계를 지킬 계획을 세웠다."}, {"en": "They secretly removed the large explosives and put smaller ones at the entrances.", "ko": "그들은 몰래 대형 폭발물을 치우고 입구에 더 작은 폭발물을 놓았다."}, {"en": "Once they went off, the Nazi leader believed that everything was destroyed.", "ko": "그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 믿었다."}, {"en": "However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.", "ko": "그러나 작은 폭발은 입구를 막았을 뿐, 광산의 나머지 부분과 예술 작품들은 멀쩡하게 남겨 두었다."}, {"en": "When the Monuments Men arrived and squeezed their way into the mines, they must have been amazed to see what was inside.", "ko": "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 안에 있는 것을 보고 틀림없이 깜짝 놀랐을 것이다."}, {"en": "There were thousands of priceless objects, including paintings, statues, books, furniture, and more.", "ko": "그곳에는 그림, 조각상, 책, 가구 등 수천 점의 귀중한 물건이 있었다."}, {"en": "The Monuments Men thought it would take about one year to transport everything they found to a safe location.", "ko": "모뉴먼츠 맨은 발견한 모든 것을 안전한 곳으로 옮기는 데 약 1년이 걸릴 것이라고 생각했다."}, {"en": "However, because control of the area was going to change at the end of the war, they would have access to the mines for just two months.", "ko": "그러나 전쟁이 끝나면 그 지역의 통제권이 바뀔 예정이어서, 그들이 광산에 들어갈 수 있는 기간은 단 두 달뿐이었다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 7]], "half": 4, "ex": [{"head": "Luckily, some local miners found", "clue": ["Luckily,", "the explosives"], "core": "다행히 지역 광부들이 폭발물을 발견, 생계 지킬 계획", "why": "글의 출발: Luckily(다행히) = 대참사 위기 뒤의 반전"}, {"head": "They secretly removed the", "clue": ["They secretly removed", "smaller ones"], "core": "몰래 대형 폭발물 제거, 입구엔 작은 폭발물", "why": "They(그들) = 광부들 → 그들이 세운 '계획'의 내용"}, {"head": "Once they went off", "clue": ["Once they went off", "believed that everything was destroyed"], "core": "작은 폭발물이 터지자 나치 지도자는 다 파괴됐다고 믿음", "why": "they(그것들) = 앞의 작은 폭발물(smaller ones)이 터진 것"}, {"head": "However, while the small", "clue": ["However,", "the small explosions", "unharmed"], "core": "실제로는 입구만 막히고 광산·예술품은 무사", "why": "However(그러나) = '다 파괴됐다고 믿음'과 반대되는 진실"}, {"head": "When the Monuments Men arrived", "clue": ["squeezed their way into the mines", "what was inside"], "core": "모뉴먼츠 맨이 막힌 광산에 비집고 들어가 깜짝 놀람", "why": "squeezed(비집고) = 입구가 막혔기 때문 → 봉쇄 얘기 다음"}, {"head": "There were thousands of", "clue": ["There were thousands of priceless objects"], "core": "안에는 그림·조각상·책·가구 등 수천 점", "why": "There(그곳) = 광산 안, 앞 문장 what was inside(안에 있던 것)의 정체"}, {"head": "The Monuments Men thought it", "clue": ["about one year", "everything they found"], "core": "모두 옮기는 데 약 1년 걸릴 거라 예상", "why": "광산 안 수천 점 발견 → everything they found(찾은 모든 것)를 옮길 시간 = 1년 예상"}, {"head": "However, because control of", "clue": ["However,", "just two months"], "core": "그런데 통제권이 바뀌어 주어진 시간은 두 달뿐", "why": "However(그러나) = 1년 예상 ↔ 현실은 두 달"}], "postit": "광부들이 큰 폭발물 빼고 작은 것 설치 → 터지자 다 파괴된 줄 앎 → 입구만 막힘 → 비집고 들어가 수천 점 발견 → 1년 예상 → 현실은 두 달", "cex": [{"core": "광부들이 대형 폭발물을 몰래 작은 것으로 바꿈", "why": "글의 출발: Luckily(다행히) → 대참사 위기를 뒤집는 광부들의 계획"}, {"core": "나치는 다 파괴됐다 믿었지만 입구만 막히고 무사", "why": "Once they went off(그것들이 터지자) = 입구에 둔 작은 폭발물 → 나치의 착각"}, {"core": "막힌 광산 안에서 발견한 수천 점의 보물", "why": "squeezed their way(비집고 들어감) = 입구가 막혔기 때문 → 봉쇄 다음 발견"}, {"core": "옮기는 데 1년 예상, 주어진 시간은 두 달뿐", "why": "everything they found(찾은 모든 것) = 광산 속 수천 점 → 운반 기간 예상"}]}, {"id": "g1_jusung_L3-p4", "label": "3과 ④ 불가능한 수송과 전쟁 후의 노력", "sents": [{"en": "With insufficient packing supplies and only a few trucks, the transporting mission seemed impossible.", "ko": "포장 자재도 부족하고 트럭도 몇 대뿐이라 수송 임무는 불가능해 보였다."}, {"en": "Not only that, but food was in short supply.", "ko": "그뿐만 아니라 식량도 부족했다."}, {"en": "Even without eating proper meals, they worked up to twenty hours a day.", "ko": "제대로 된 식사도 못 한 채 그들은 하루에 최대 20시간씩 일했다."}, {"en": "They used coats and gas masks as packing materials and did everything they could to accomplish this vital mission in time.", "ko": "그들은 외투와 방독면을 포장재로 쓰며 이 중요한 임무를 제때 끝내기 위해 할 수 있는 모든 것을 했다."}, {"en": "In the end, the Monuments Men succeeded in rescuing thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges.", "ko": "마침내 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 페르메이르의 「천문학자」, 미켈란젤로의 「브뤼헤의 성모」 같은 중요한 작품을 포함해 수천 점의 도난 예술품을 구해 냈다."}, {"en": "The efforts of the Monuments Men did not end with the war.", "ko": "모뉴먼츠 맨의 노력은 전쟁이 끝났다고 끝나지 않았다."}, {"en": "For several years, they continued the work of recovering cultural treasures and identifying where they had been stolen from.", "ko": "여러 해 동안 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 밝혀내는 일을 계속했다."}, {"en": "In the end, the Monuments Men returned more than five million works of art and objects of cultural importance to their places of origin.", "ko": "마침내 모뉴먼츠 맨은 5백만 점이 넘는 예술 작품과 문화적으로 중요한 물건을 원래 있던 곳으로 돌려보냈다."}, {"en": "Not everything that was stolen by the Nazis has been found, but what the Monuments Men accomplished is truly amazing.", "ko": "나치가 훔친 것이 모두 발견된 것은 아니지만, 모뉴먼츠 맨이 이뤄 낸 일은 정말 놀랍다."}], "chunks": [[0, 1], [2, 4], [5, 6], [7, 8]], "half": 5, "ex": [{"head": "With insufficient packing supplies and", "clue": ["insufficient packing supplies", "seemed impossible"], "core": "포장 자재 부족·트럭 몇 대 → 불가능해 보이는 임무", "why": "글의 출발: 수송 임무(the transporting mission)가 불가능해 보인 이유 = 자재·트럭 부족"}, {"head": "Not only that, but", "clue": ["Not only that,", "food"], "core": "게다가 식량도 부족", "why": "Not only that(그뿐만 아니라) function utext(u){var p=P[cur],a=[];for(var k=u[0];k<=u[1];k++)a.push(p.sents[k].en);return a.join(' ')}
function draw(){var p=P[cur];var h='<div class="top"><button class="back" onclick="list()">목록</button></div><div class="lab" translate="no">'+esc(p.label)+'</div>';
var hs=halves(p);h+='<div class="seg"><button class="'+(lv==1?'on':'')+'" onclick="open_('+cur+',1)">1단계 덩어리</button>';if(hs.length==1)h+='<button class="'+(lv==2?'on':'')+'" onclick="open_('+cur+',2)">2단계 문장</button>';else h+='<button class="'+(lv==2&&hp==0?'on':'')+'" onclick="open_('+cur+',2,0)">2단계 앞</button><button class="'+(lv==2&&hp==1?'on':'')+'" onclick="open_('+cur+',2,1)">2단계 뒤</button>';h+='</div>';
h+='<div class="'+(lv==2?'l2':'')+'"><div class="card fix" lang="en" translate="no">'+esc(utext(units[0]))+'</div><div id="bx">';
order.forEach(function(k){var tx=utext(units[k]);h+='<div class="card mv" data-k="'+k+'" lang="en" translate="no">'+(lv==2?cardTx(tx):esc(tx))+'</div>'});
h+='</div></div><button class="btn go" id="sb" onclick="submit()">제출</button><div id="res"></div>';
h+=foot();$('v').innerHTML=h;bind()}
function cardTx(tx){var w=tx.split(' ');if(w.length<=8)return esc(tx);return '<span class="sh">'+esc(w.slice(0,7).join(' '))+' …</span><span class="fl">'+esc(tx)+'</span>'}
function foot(){return '<div class="foot"><button class="btn sec" onclick="list()">목록으로</button></div>'}
var locked=false;
function bind(){locked=false;var bx=$('bx');Array.prototype.forEach.call(bx.children,function(c){c.addEventListener('pointerdown',down)})}
var dg=null,ph=null,oy=0,sy=0,pc=null,px=0,py=0,pid=0;
function down(e){if(locked)return;pc=e.currentTarget;px=e.clientX;py=e.clientY;pid=e.pointerId;e.preventDefault();try{pc.setPointerCapture(e.pointerId)}catch(x){}
pc.addEventListener('pointermove',move);pc.addEventListener('pointerup',up);pc.addEventListener('pointercancel',up)}
function start(e){var c=pc,r=c.getBoundingClientRect();dg=c;oy=py-r.top;
ph=document.createElement('div');ph.className='card ph';ph.style.height=r.height+'px';c.parentNode.insertBefore(ph,c);
c.classList.add('drag');c.style.position='fixed';c.style.left=r.left+'px';c.style.width=r.width+'px';c.style.top=r.top+'px'}
function move(e){if(!pc)return;e.preventDefault();if(!dg){if(Math.abs(e.clientY-py)+Math.abs(e.clientX-px)<7)return;start(e)}
dg.style.top=(e.clientY-oy)+'px';
var bx=$('bx'),y=e.clientY,ch=Array.prototype.filter.call(bx.children,function(n){return n!==dg&&n!==ph}),put=null;
for(var i=0;i<ch.length;i++){var r=ch[i].getBoundingClientRect();if(y<r.top+r.height/2){put=ch[i];break}}
if(put)bx.insertBefore(ph,put);else bx.appendChild(ph);
if(e.clientY<60)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,12)}
function up(e){var c=pc;if(!c)return;pc=null;c.removeEventListener('pointermove',move);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);
if(!dg){if(e.type==='pointerup'&&c.querySelector('.fl'))c.classList.toggle('op');return}
dg=null;c.classList.remove('drag');c.style.position='';c.style.left='';c.style.top='';c.style.width='';ph.parentNode.insertBefore(c,ph);ph.remove();ph=null}
function submit(){if(locked)return;locked=true;var p=P[cur],bx=$('bx'),cs=bx.children,ok=0,n=cs.length;
for(var i=0;i<n;i++){var k=+cs[i].getAttribute('data-k'),g=(k==i+1);if(g)ok++;cs[i].classList.add(g?'ok':'ng');cs[i].classList.remove('mv');cs[i].insertAdjacentHTML('beforeend','<span class="mk">'+(g?'O':'X')+'</span>')}
var all=ok==n;if(all){st[p.id]=st[p.id]||{};if(lv==1)st[p.id][1]=1;else{st[p.id]['2_'+hp]=1;if(halves(p).length==1)st[p.id][2]=1}save()}
$('sb').style.display='none';
var h='<div class="band '+(all?'ok':'ng')+'">'+(all?'정답':'다시 확인')+'<small>'+n+'개 중 '+ok+'개 제자리</small></div>';
h+='<div class="exh">이 순서로 기억하기</div>';
var cs2={};units.forEach(function(u,ui){if(ui>0)cs2[u[0]]=1});
if(lv==1){p.chunks.forEach(function(c,ci){var cx=(p.cex&&p.cex[ci])||p.ex[c[0]];h+='<div class="ex ch"><span class="no">'+(ci+1)+'</span>'+(ci==0?'<span class="ck">시작</span>':'');for(var i=c[0];i<=c[1];i++){var s=p.sents[i];h+='<div class="en" lang="en" translate="no">'+mark(s.en,i==c[0]?p.ex[i]:{head:p.ex[i].head,clue:[]})+'</div><div class="ko">'+esc(s.ko)+'</div>'}h+=(cx.core?'<div class="core">'+esc(cx.core)+'</div>':'')+(cx.why?'<div class="why">'+esc(cx.why)+'</div>':'')+'</div>'})}else{var rg=halves(p)[hp];p.sents.forEach(function(s,i){if(i<rg[0]||i>rg[1])return;var x=p.ex[i];h+='<div class="ex'+(lv==1&&cs2[i]?' cb':'')+'"><span class="no">'+(i+1)+'</span>'+(i==rg[0]?'<span class="ck">시작</span>':'')+'<div class="en" lang="en" translate="no">'+mark(s.en,x)+'</div><div class="ko">'+esc(s.ko)+'</div>'+(x.core?'<div class="core">'+esc(x.core)+'</div>':'')+(x.why?'<div class="why">'+esc(x.why)+'</div>':'')+'</div>'});}
h+='<div class="post"><small>이 순서 이렇게 외우자</small>'+esc(p.postit)+'</div>';
var hs2=halves(p);h+='<button class="btn go" onclick="open_('+cur+','+lv+','+hp+')">다시 섞기</button>';
if(lv==1)h+='<button class="btn sec" onclick="open_('+cur+',2,0)">'+(hs2.length>1?'2단계 앞으로':'2단계 문장으로')+'</button>';
else if(hp+1<hs2.length)h+='<button class="btn sec" onclick="open_('+cur+',2,'+(hp+1)+')">2단계 뒤로</button>';
else if(cur+1<P.length)h+='<button class="btn sec" onclick="open_('+(cur+1)+',1)">다음 지문</button>';
$('res').innerHTML=h}
function mark(en,x){var hd=x.head||'',a=en,b='';if(hd&&en.indexOf(hd)==0){a=en.slice(0,hd.length);b=en.slice(hd.length)}else{a='';b=en}
var r=esc(b);(x.clue||[]).forEach(function(c){var t=esc(c);if(!t)return;var i=r.indexOf(t);if(i>=0&&r.lastIndexOf('<',i)<=r.lastIndexOf('>',i))r=r.slice(0,i)+'<span class="cl">'+t+'</span>'+r.slice(i+t.length)});
return (a?'<span class="hd">'+esc(a)+'</span>':'')+r}
list();
</script><a href="../index.html" style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#1d4ed8;color:#fff;font:700 13px/1 sans-serif;padding:11px 14px;border-radius:22px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)">⌂ 목록</a></body></html>
