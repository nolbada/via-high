왼손 마우스의 불편함 → 더 큰 어려움으로 전환"}], "postit": "팔 부러짐 상상 → 다친 팔로 힘든 일 → 예: 상자·자전거 → 인터넷은? 왼손 마우스 → 그래도 작은 문제"}, {"id": "g1_jusung_L4-p2", "label": "4과 ② 웹 접근성이란", "sents": [{"en": "For people with certain disabilities, many websites can be nearly impossible to use.", "ko": "특정 장애가 있는 사람들에게는 많은 웹 사이트가 거의 사용할 수 없는 수준일 수 있다."}, {"en": "This is the reason why web accessibility is important.", "ko": "이것이 웹 접근성이 중요한 이유이다."}, {"en": "Web accessibility is the practice of making sure that websites can be used by everyone, including people with disabilities.", "ko": "웹 접근성이란 장애가 있는 사람을 포함해 모든 사람이 웹 사이트를 쓸 수 있도록 하는 실천이다."}, {"en": "So what exactly makes a website accessible?", "ko": "그렇다면 정확히 무엇이 웹 사이트를 접근 가능하게 만들까?"}, {"en": "Here are some common features of accessible websites.", "ko": "다음은 접근성 있는 웹 사이트의 몇 가지 공통된 특징이다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 3], [4, 4]], "ex": [{"head": "For people with certain", "clue": ["certain disabilities", "nearly impossible"], "core": "특정 장애가 있으면 웹 사이트 사용이 거의 불가능", "why": "글의 출발: 앞서 말한 '더 큰 어려움' = 장애인의 웹 사용"}, {"head": "This is the reason", "clue": ["This is the reason why", "web accessibility"], "core": "그래서 웹 접근성이 중요", "why": "This(이것) = 웹 사이트를 거의 못 쓰는 상황 → 그래서 접근성이 중요"}, {"head": "Web accessibility is the", "clue": ["Web accessibility is the practice"], "core": "웹 접근성 = 장애인 포함 모두가 쓸 수 있게 하는 것", "why": "앞에서 처음 나온 web accessibility(웹 접근성)를 바로 정의"}, {"head": "So what exactly makes", "clue": ["So what exactly", "accessible"], "core": "그럼 무엇이 접근성을 만드나?", "why": "So(그렇다면) = 정의를 들었으니 구체적 방법을 묻는 질문"}, {"head": "Here are some common", "clue": ["Here are some common features"], "core": "접근성 있는 사이트의 공통 특징 소개", "why": "Here are(여기 있다) = 앞 질문에 대한 답을 시작 → 맨 끝"}], "postit": "장애인은 웹 사용 거의 불가 → 그래서 웹 접근성 중요 → 정의 → 무엇이 접근성을? → 공통 특징 소개"}, {"id": "g1_jusung_L4-p3", "label": "4과 ③ 이미지를 못 읽는 스크린 리더", "sents": [{"en": "Along with text, most websites include other forms of information, such as images.", "ko": "대부분의 웹 사이트는 텍스트와 함께 이미지 같은 다른 형식의 정보도 담고 있다."}, {"en": "Sometimes such visual information is important for understanding the text.", "ko": "때로는 그런 시각 정보가 텍스트를 이해하는 데 중요하다."}, {"en": "This is a problem for users with visual disabilities.", "ko": "이것은 시각 장애가 있는 사용자에게 문제가 된다."}, {"en": "When they go on a website, they often use programs called “screen readers,” which read online text aloud.", "ko": "그들은 웹 사이트에 들어갈 때 흔히 '스크린 리더'라는 프로그램을 쓰는데, 이 프로그램은 온라인 텍스트를 소리 내어 읽어 준다."}, {"en": "However, these programs cannot “read” images.", "ko": "하지만 이 프로그램들은 이미지를 '읽지' 못한다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 3], [4, 4]], "ex": [{"head": "Along with text, most websites", "clue": ["such as images"], "core": "웹 사이트엔 텍스트 말고 이미지 같은 정보도 있음", "why": "글의 출발: 화제 = 이미지 같은 텍스트 외 정보"}, {"head": "Sometimes such visual information", "clue": ["such visual information"], "core": "그런 시각 정보가 글 이해에 중요할 때가 있음", "why": "such visual information(그런 시각 정보) = 앞의 images(이미지)"}, {"head": "This is a problem", "clue": ["This is a problem", "visual disabilities"], "core": "시각 장애 사용자에겐 문제", "why": "This(이것) = 글 이해에 중요한 정보가 이미지(시각 정보)에 담겨 있다는 점"}, {"head": "When they go on a", "clue": ["they", "screen readers"], "core": "그들은 텍스트를 읽어 주는 '스크린 리더' 사용", "why": "they(그들) = 앞의 시각 장애 사용자"}, {"head": "However, these programs cannot", "clue": ["However, these programs", "images"], "core": "그런데 스크린 리더는 이미지를 못 읽음", "why": "these programs(이 프로그램들) = 스크린 리더, However = 글은 읽지만 이미지는 못 읽음"}], "postit": "이미지 정보 → 그런 시각 정보가 중요 → 시각 장애인에겐 문제 → 스크린 리더 사용 → 이미지는 못 읽음"}, {"id": "g1_jusung_L4-p4", "label": "4과 ④ 대체 텍스트", "sents": [{"en": "Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "ko": "접근성 있는 웹 사이트는 'alt text'라고도 하는 대체 텍스트를 제공해 이 문제를 해결한다."}, {"en": "Alt text is a brief description of non-textual information.", "ko": "대체 텍스트는 글이 아닌 정보에 대한 짧은 설명이다."}, {"en": "For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "ko": "예를 들어 이미지에 학생 무리가 나온다면, 대체 텍스트는 이미지 속 학생이 몇 명이고 무엇을 하고 있는지 설명할 것이다."}, {"en": "Screen readers can detect this alt text and read it aloud.", "ko": "스크린 리더는 이 대체 텍스트를 찾아내 소리 내어 읽어 줄 수 있다."}, {"en": "This way, alt text ensures that people with visual disabilities can access more of the information on a website.", "ko": "이런 방식으로 대체 텍스트는 시각 장애가 있는 사람들이 웹 사이트의 정보에 더 많이 접근할 수 있게 해 준다."}], "chunks": [[0, 0], [1, 1], [2, 3], [4, 4]], "ex": [{"head": "Accessible websites solve this", "clue": ["solve this problem", "alt text"], "core": "해결책 = 대체 텍스트(alt text) 제공", "why": "글의 출발: this problem(이 문제) = 스크린 리더가 이미지를 못 읽는 문제"}, {"head": "Alt text is a", "clue": ["Alt text is"], "core": "대체 텍스트 = 글 아닌 정보의 짧은 설명", "why": "앞에서 처음 나온 alt text를 바로 정의"}, {"head": "For instance, if an image", "clue": ["For instance,", "its alt text"], "core": "예: 학생 사진 → 몇 명이 무엇을 하는지 설명", "why": "For instance(예를 들어) = 정의 다음 구체적 예"}, {"head": "Screen readers can detect", "clue": ["this alt text", "read it aloud"], "core": "스크린 리더가 이 대체 텍스트를 찾아 읽어 줌", "why": "this alt text(이 대체 텍스트) = 앞 예시의 설명 글"}, {"head": "This way, alt text ensures", "clue": ["This way,", "more of the information"], "core": "이렇게 시각 장애인도 더 많은 정보에 접근", "why": "This way(이런 방식으로) = 앞의 과정 전체를 정리하는 마무리"}], "postit": "해결 = 대체 텍스트 → 정의 → 예: 학생 사진 설명·스크린 리더가 읽음 → 이렇게 더 많은 정보 접근"}, {"id": "g1_jusung_L4-p5", "label": "4과 ⑤ 대본과 자막", "sents": [{"en": "In some cases, audio content cannot be accessed or understood.", "ko": "어떤 경우에는 음성 콘텐츠에 접근하거나 그것을 이해할 수 없다."}, {"en": "Some people may have hearing disabilities, while others might be in places where they can't listen to audio, such as a quiet library.", "ko": "청각 장애가 있는 사람도 있고, 조용한 도서관처럼 소리를 들을 수 없는 곳에 있는 사람도 있다."}, {"en": "Therefore, accessible websites often offer other ways to access information that is presented in audio form.", "ko": "그래서 접근성 있는 웹 사이트는 흔히 음성으로 제공되는 정보에 접근할 다른 방법을 제공한다."}, {"en": "For example, they may provide transcripts or captions that can help users access this information.", "ko": "예를 들어, 사용자가 이 정보에 접근하도록 돕는 대본이나 자막을 제공할 수 있다."}, {"en": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays.", "ko": "대본은 음성 콘텐츠 전체를 글로 옮긴 것이고, 자막은 영상이 재생될 때 화면에 나타나는 음성의 글 버전이다."}, {"en": "Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video.", "ko": "자막에는 말한 내용의 글뿐 아니라 영상 속 음악과 다른 소리에 대한 설명도 들어 있다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 3], [4, 5]], "ex": [{"head": "In some cases, audio", "clue": ["audio content"], "core": "음성 콘텐츠에 접근·이해 못 하는 경우가 있음", "why": "글의 출발: 화제 = 음성 콘텐츠의 문제"}, {"head": "Some people may have", "clue": ["hearing disabilities", "while others", "quiet library"], "core": "청각 장애가 있거나, 도서관처럼 못 듣는 곳에 있거나", "why": "앞의 '접근 못 하는 경우'가 누구인지 → 두 부류 설명"}, {"head": "Therefore, accessible websites", "clue": ["Therefore,", "other ways"], "core": "그래서 음성 정보에 접근할 다른 방법 제공", "why": "Therefore(그러므로) = 못 듣는 사람들이 있으니 해결책"}, {"head": "For example, they may provide", "clue": ["For example,", "transcripts or captions"], "core": "예: 대본이나 자막", "why": "For example(예를 들어) = 앞의 '다른 방법'의 예, this information = 음성 정보"}, {"head": "Transcripts are text versions", "clue": ["Transcripts are", "while captions are"], "core": "대본 = 전체 음성의 글 / 자막 = 영상 속 음성의 글", "why": "앞에서 나온 transcripts·captions 두 단어를 각각 정의"}, {"head": "Captions include not only", "clue": ["Captions include", "not only", "but also"], "core": "자막엔 말뿐 아니라 음악·소리 설명도 포함", "why": "Captions(자막)만 다시 받아 더 자세히 → 정의 다음"}], "postit": "음성 접근 불가 → 청각 장애·도서관 → 그래서 다른 방법 → 예: 대본·자막 → 두 단어 정의·자막 추가 설명"}, {"id": "g1_jusung_L4-p6", "label": "4과 ⑥ 보기 쉽고 듣기 쉬운 콘텐츠", "sents": [{"en": "Having a visual disability doesn't necessarily mean a person can't see at all.", "ko": "시각 장애가 있다고 해서 반드시 전혀 못 본다는 뜻은 아니다."}, {"en": "Some people, including many elderly people, simply have poor eyesight.", "ko": "많은 노인을 포함해 어떤 사람들은 그저 시력이 나쁠 뿐이다."}, {"en": "This makes it difficult for them to read.", "ko": "이 때문에 그들은 글을 읽기가 어렵다."}, {"en": "For this reason, accessible websites have a background color that contrasts with the color of their text.", "ko": "이런 이유로 접근성 있는 웹 사이트는 글자 색과 대비되는 배경 색을 쓴다."}, {"en": "This makes the text clear enough for most people to see.", "ko": "이렇게 하면 대부분의 사람이 보기에 글자가 충분히 또렷해진다."}, {"en": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.", "ko": "음성 콘텐츠의 경우, 접근성 있는 웹 사이트는 사용자가 배경음 볼륨을 조절하거나 아예 끌 수 있게 한다."}, {"en": "This gives users both with and without hearing difficulties more control over their experience while they are using the sites.", "ko": "이것은 청각에 어려움이 있는 사용자든 없는 사용자든 사이트를 쓰는 동안 자신의 경험을 더 잘 조절할 수 있게 해 준다."}], "chunks": [[0, 0], [1, 1], [2, 2], [3, 4], [5, 6]], "ex": [{"head": "Having a visual disability", "clue": ["visual disability", "can't see at all"], "core": "시각 장애 ≠ 전혀 못 봄", "why": "글의 출발: 시각 장애에 대한 오해 바로잡기"}, {"head": "Some people, including many", "clue": ["Some people", "poor eyesight"], "core": "노인처럼 그냥 시력이 나쁜 사람들", "why": "Some people(어떤 사람들) = '전혀 못 보는 건 아닌' 사람의 예"}, {"head": "This makes it difficult for", "clue": ["This makes it difficult"], "core": "나쁜 시력 → 글 읽기 어려움", "why": "This(이것) = 앞의 poor eyesight(나쁜 시력)"}, {"head": "For this reason, accessible", "clue": ["For this reason,", "contrasts"], "core": "그래서 글자 색과 대비되는 배경 색", "why": "For this reason(이런 이유로) = 읽기 어렵다는 문제의 해결책"}, {"head": "This makes the text", "clue": ["This makes the text clear"], "core": "대비 덕분에 글자가 또렷", "why": "This(이것) = 앞의 대비되는 배경 색"}, {"head": "As for audio content", "clue": ["As for audio content,", "adjust the volume"], "core": "음성은 배경음 볼륨 조절·끄기 가능", "why": "As for(~에 관해서는) = 보기(시각) 얘기 끝 → 듣기(음성)로 화제 전환"}, {"head": "This gives users both with", "clue": ["This gives users", "hearing difficulties"], "core": "볼륨 조절 → 청각 장애 유무와 관계없이 더 많은 통제권", "why": "This(이것) = 앞의 볼륨 조절 기능"}], "postit": "시각 장애 ≠ 전혀 못 봄 → 시력 나쁜 사람 → 읽기 어려움 → 대비 배경색·또렷 → 음성은 볼륨 조절·통제권"}, {"id": "g1_jusung_L4-p7", "label": "4과 ⑦ 키보드만으로 탐색", "sents": [{"en": "Some users have disabilities that limit the movement of their hands.", "ko": "어떤 사용자들은 손의 움직임을 제한하는 장애가 있다."}, {"en": "They rely on their keyboards, rather than a mouse, to navigate websites.", "ko": "그들은 웹 사이트를 돌아다닐 때 마우스 대신 키보드에 의존한다."}, {"en": "On accessible websites, users can access everything on the site using only a keyboard.", "ko": "접근성 있는 웹 사이트에서는 키보드만으로 사이트의 모든 것에 접근할 수 있다."}, {"en": "This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "ko": "이는 링크, 버튼, 그리고 정보를 입력하는 공간인 필드에 키보드 탐색으로 접근할 수 있다는 뜻이다."}, {"en": "Users navigate the websites by making use of keys such as the space bar, the arrow keys, the enter key, and the tab key.", "ko": "사용자는 스페이스 바, 화살표 키, 엔터 키, 탭 키 같은 키를 이용해 웹 사이트를 탐색한다."}, {"en": "For example, they can use the tab key to jump from one part of a web page to another.", "ko": "예를 들어, 탭 키를 써서 웹 페이지의 한 부분에서 다른 부분으로 건너뛸 수 있다."}, {"en": "Both users with disabilities and those with temporarily injured hands can benefit from this kind of navigation.", "ko": "장애가 있는 사용자와 일시적으로 손을 다친 사용자 모두 이런 탐색 방식의 도움을 받을 수 있다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 6]], "ex": [{"head": "Some users have", "clue": ["movement of their hands"], "core": "손 움직임이 제한되는 장애", "why": "글의 출발: 화제 = 손을 쓰기 힘든 사용자"}, {"head": "They rely on their", "clue": ["They rely on their keyboards", "rather than a mouse"], "core": "그들은 마우스 대신 키보드 사용", "why": "They(그들) = 손 움직임이 제한된 사용자"}, {"head": "On accessible websites, users", "clue": ["using only a keyboard"], "core": "접근성 있는 사이트는 키보드만으로 전부 접근 가능", "why": "키보드에 의존한다 → 그러니 키보드만으로 다 되게 함"}, {"head": "This means that", "clue": ["This means", "keyboard navigation"], "core": "링크·버튼·입력칸을 키보드 탐색으로 접근", "why": "This means(이는 ~라는 뜻) = 앞의 '키보드만으로 모든 것'을 풀어 설명"}, {"head": "Users navigate the websites", "clue": ["navigate the websites", "keys such as"], "core": "스페이스 바·화살표·엔터·탭 키로 탐색", "why": "keyboard
