</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "교과서 3과 삽입 다지기", "sub": "공통영어2 3과 · 10문제", "key": "jusung-go1:in:L3", "pass": [{"label": "3과 ① 모뉴먼츠 맨의 탄생과 처음 역할", "sents": [{"en": "During World War II, there was a group of people who risked everything to protect priceless works of art from ruin.", "ko": "제2차 세계대전 동안, 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다."}, {"en": "In 1943, around 345 people from 14 different Allied nations came together to form the Monuments, Fine Arts, and Archives (MFAA) program.", "ko": "1943년, 14개 연합국에서 온 약 345명의 사람들이 모여 기념물·미술품·기록물(MFAA) 프로그램을 만들었다."}, {"en": "They were not trained soldiers but scholars and experts of various kinds, such as professors, historians, and architects.", "ko": "그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가 같은 다양한 분야의 학자와 전문가들이었다."}, {"en": "These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”", "ko": "이 용감한 남녀들은 유럽의 문화유산을 지키는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다."}, {"en": "When the MFAA was first formed, its main goal was to prevent the destruction of cultural landmarks.", "ko": "MFAA가 처음 만들어졌을 때, 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다."}, {"en": "The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings.", "ko": "모뉴먼츠 맨은 박물관, 교회 등 문화적으로 중요한 건물이 있는 지역을 폭격하지 말라고 연합군을 설득했다."}, {"en": "They also visited areas that had already been destroyed to restore damaged architecture and works of art.", "ko": "그들은 또한 훼손된 건축물과 예술 작품을 복원하려고 이미 파괴된 지역을 찾아갔다."}, {"en": "It wasn’t long before their role expanded.", "ko": "머지않아 그들의 역할은 더 커졌다."}, {"en": "During the war, the Nazis had been stealing works of art and other cultural treasures from countries across Europe.", "ko": "전쟁 중에 나치는 유럽 여러 나라에서 예술 작품과 문화재를 훔치고 있었다."}, {"en": "They hid these treasures in places like castles, mines, and caves.", "ko": "그들은 이 보물들을 성, 광산, 동굴 같은 곳에 숨겼다."}]}, {"label": "3과 ② 보물찾기와 알타우제 광산", "sents": [{"en": "When the Monuments Men learned about this, they started looking for the stolen treasures.", "ko": "모뉴먼츠 맨은 이 사실을 알게 되자 도난당한 보물들을 찾기 시작했다."}, {"en": "Their search has since been called “the greatest treasure hunt in history.”", "ko": "그들의 수색은 이후 '역사상 가장 위대한 보물찾기'라고 불려 왔다."}, {"en": "When Germany began to lose the war, the stolen objects came under threat.", "ko": "독일이 전쟁에서 지기 시작하자, 도난당한 물건들은 위험에 처하게 되었다."}, {"en": "Hitler ordered his forces to destroy everything that could be useful to the Allied armies before they retreated from an area.", "ko": "히틀러는 군대에게 한 지역에서 후퇴하기 전에 연합군에게 쓸모 있을 만한 것은 모두 파괴하라고 명령했다."}, {"en": "Some Nazi leaders believed that this included not just military and industrial equipment but everything of value — even the stolen works of art.", "ko": "일부 나치 지도자들은 여기에 군사·산업 장비뿐 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품까지 포함된다고 여겼다."}, {"en": "One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria.", "ko": "도난당한 물품을 가장 많이 모아 둔 곳 중 하나는 오스트리아 알타우제의 소금 광산이었다."}, {"en": "Upon discovering its location, some of the Monuments Men rushed to the mines.", "ko": "그 위치를 알아내자마자 모뉴먼츠 맨 일부가 광산으로 서둘러 갔다."}, {"en": "They hoped to recover everything before it was too late.", "ko": "그들은 너무 늦기 전에 모든 것을 되찾기를 바랐다."}, {"en": "Meanwhile, the Nazi leader who was in charge of the area tried to destroy everything by setting off large explosives inside the mines.", "ko": "한편, 그 지역을 맡고 있던 나치 지도자는 광산 안에서 대형 폭발물을 터뜨려 모든 것을 파괴하려 했다."}, {"en": "This could have been disastrous.", "ko": "이것은 처참한 결과를 낳을 수도 있었다."}]}, {"label": "3과 ③ 광부들의 기지와 두 달의 기한", "sents": [{"en": "Luckily, some local miners found the explosives in the mines and came up with a plan to protect their livelihood.", "ko": "다행히 그 지역 광부 몇 명이 광산에서 폭발물을 발견했고, 자신들의 생계를 지킬 계획을 세웠다."}, {"en": "They secretly removed the large explosives and put smaller ones at the entrances.", "ko": "그들은 몰래 대형 폭발물을 치우고 입구에 더 작은 폭발물을 놓았다."}, {"en": "Once they went off, the Nazi leader believed that everything was destroyed.", "ko": "그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 믿었다."}, {"en": "However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.", "ko": "그러나 작은 폭발은 입구를 막았을 뿐, 광산의 나머지 부분과 예술 작품들은 멀쩡하게 남겨 두었다."}, {"en": "When the Monuments Men arrived and squeezed their way into the mines, they must have been amazed to see what was inside.", "ko": "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 안에 있는 것을 보고 틀림없이 깜짝 놀랐을 것이다."}, {"en": "There were thousands of priceless objects, including paintings, statues, books, furniture, and more.", "ko": "그곳에는 그림, 조각상, 책, 가구 등 수천 점의 귀중한 물건이 있었다."}, {"en": "The Monuments Men thought it would take about one year to transport everything they found to a safe location.", "ko": "모뉴먼츠 맨은 발견한 모든 것을 안전한 곳으로 옮기는 데 약 1년이 걸릴 것이라고 생각했다."}, {"en": "However, because control of the area was going to change at the end of the war, they would have access to the mines for just two months.", "ko": "그러나 전쟁이 끝나면 그 지역의 통제권이 바뀔 예정이어서, 그들이 광산에 들어갈 수 있는 기간은 단 두 달뿐이었다."}]}, {"label": "3과 ④ 불가능한 수송과 전쟁 후의 노력", "sents": [{"en": "With insufficient packing supplies and only a few trucks, the transporting mission seemed impossible.", "ko": "포장 자재도 부족하고 트럭도 몇 대뿐이라 수송 임무는 불가능해 보였다."}, {"en": "Not only that, but food was in short supply.", "ko": "그뿐만 아니라 식량도 부족했다."}, {"en": "Even without eating proper meals, they worked up to twenty hours a day.", "ko": "제대로 된 식사도 못 한 채 그들은 하루에 최대 20시간씩 일했다."}, {"en": "They used coats and gas masks as packing materials and did everything they could to accomplish this vital mission in time.", "ko": "그들은 외투와 방독면을 포장재로 쓰며 이 중요한 임무를 제때 끝내기 위해 할 수 있는 모든 것을 했다."}, {"en": "In the end, the Monuments Men succeeded in rescuing thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges.", "ko": "마침내 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 페르메이르의 「천문학자」, 미켈란젤로의 「브뤼헤의 성모」 같은 중요한 작품을 포함해 수천 점의 도난 예술품을 구해 냈다."}, {"en": "The efforts of the Monuments Men did not end with the war.", "ko": "모뉴먼츠 맨의 노력은 전쟁이 끝났다고 끝나지 않았다."}, {"en": "For several years, they continued the work of recovering cultural treasures and identifying where they had been stolen from.", "ko": "여러 해 동안 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 밝혀내는 일을 계속했다."}, {"en": "In the end, the Monuments Men returned more than five million works of art and objects of cultural importance to their places of origin.", "ko": "마침내 모뉴먼츠 맨은 5백만 점이 넘는 예술 작품과 문화적으로 중요한 물건을 원래 있던 곳으로 돌려보냈다."}, {"en": "Not everything that was stolen by the Nazis has been found, but what the Monuments Men accomplished is truly amazing.", "ko": "나치가 훔친 것이 모두 발견된 것은 아니지만, 모뉴먼츠 맨이 이뤄 낸 일은 정말 놀랍다."}]}, {"label": "3과 ⑤ 모뉴먼츠 맨의 의미와 사라지는 언어", "sents": [{"en": "Without this determined group, the search for stolen works of art might never have begun.", "ko": "이 결연한 집단이 없었다면 도난 예술품 수색은 아예 시작되지 않았을지도 모른다."}, {"en": "In addition, countless historical and cultural landmarks would have been lost forever due to the destruction of war.", "ko": "또한 수많은 역사적·문화적 랜드마크가 전쟁의 파괴로 영원히 사라졌을 것이다."}, {"en": "It is worth remembering the Monuments Men’s contribution to the preservation of cultural heritage.", "ko": "문화유산 보존에 대한 모뉴먼츠 맨의 기여는 기억할 가치가 있다."}, {"en": "Thanks to their efforts, many incredible cultural sites and works of art have survived and can still be appreciated to this day.", "ko": "그들의 노력 덕분에 많은 놀라운 문화 유적과 예술 작품이 살아남아 오늘날까지도 감상될 수 있다."}, {"en": "Did you know that there are over 7,000 languages currently being used around the world?", "ko": "현재 전 세계에서 7,000개가 넘는 언어가 쓰이고 있다는 것을 알고 있었는가?"}, {"en": "Most of these languages are spoken by very small groups of people, and half of them could disappear within the next generation.", "ko": "이 언어들 대부분은 아주 적은 수의 사람들이 사용하며, 그중 절반은 다음 세대 안에 사라질 수도 있다."}, {"en": "This would be a great loss because language plays a big role in connecting people’s identity to their culture.", "ko": "언어는 사람들의 정체성을 그들의 문화와 이어 주는 큰 역할을 하기 때문에 이것은 큰 손실이 될 것이다."}, {"en": "This is why some organizations work to preserve them.", "ko": "이것이 일부 단체들이 언어를 지키기 위해 일하는 이유이다."}, {"en": "For example, a nonprofit organization called Wikitongues has set the goal of preserving all languages that are in danger of being lost.", "ko": "예를 들어, 위키텅스(Wikitongues)라는 비영리 단체는 사라질 위기에 놓인 모든 언어를 보존한다는 목표를 세웠다."}, {"en": "The organization works to achieve this by recording videos of individuals speaking these languages and making mother-tongue resources more accessible.", "ko": "이 단체는 그 언어를 쓰는 사람들의 영상을 기록하고 모국어 자료를 더 쉽게 접할 수 있게 함으로써 이 목표를 이루려 노력한다."}]}], "items": [{"id": "in-g1_jusung_L3-01", "p": 0, "s": 6, "pos": [1, 3, 4, 6, 10], "cue": ["also(또한) → 한 일이 먼저 나와야 함, persuaded the Allied forces not to bomb(연합군이 폭격하지 않도록 설득했다)", "They(그들) = 앞 문장의 The Monuments Men(모뉴먼츠 맨)", "already been destroyed(이미 파괴된) ↔ 앞 문장의 not to bomb(폭격하지 않도록), 파괴 전 예방 + 파괴 후 복원"], "trap": [[4, "Monuments Men이라는 이름이 나온 직후라 They가 받을 말은 있지만 also(또한)가 더할 첫 번째 활동이 아직 없음"], [10, "맨 끝에 넣으면 They가 the Nazis(나치)가 되어 ‘나치가 예술 작품을 복원했다’는 뜻"]], "var": {"en": "In addition, they visited areas that had already been destroyed to restore damaged architecture and works of art.", "ko": "게다가 그들은 훼손된 건축물과 예술 작품을 복원하려고 이미 파괴된 지역을 찾아갔다.", "chg": "They also(그들은 또한) → In addition, they(게다가 그들은)", "note": "also가 In addition(게다가)으로 바뀌어도 앞에 첫 번째 활동(폭격 막기)이 필요"}, "fam": "첨가 가족: Moreover(게다가) / Furthermore(더욱이) / In addition(또한) / What is more(더욱이) / Besides(게다가)", "post": "폭격을 막는 설득 → 또한 이미 파괴된 곳의 복원 → 역할 확대"}, {"id": "in-g1_jusung_L3-02", "p": 0, "s": 9, "pos": [3, 5, 7, 8, 9], "cue": ["these treasures(이 보물들) = 앞 문장의 works of art and other cultural treasures(예술 작품과 다른 문화재)", "They(그들) = 앞 문장의 the Nazis(나치)", "hid(숨겼다, hide의 과거형) → 앞의 had been stealing(훔쳐 오고 있었다) 다음 행동"], "trap": [[8, "their role expanded(그들의 역할이 넓어졌다) 뒤에 넣으면 They가 모뉴먼츠 맨이 되어 ‘모뉴먼츠 맨이 보물을 숨겼다’는 뜻, these treasures(이 보물들)가 가리킬 보물도 아직 없음"], [7, "works of art(예술 작품)가 앞에 있지만 그건 복원 대상, hid(숨겼다) , "landmarks(랜드마크, 주요 건축물) → 앞의 works of art(예술 작품)에 더하는 내용"], "trap": [[3, "contribution(공헌) 뒤라 내용이 통해 보이지만 ‘없었다면’이라는 가정과 떨어져 would have been lost(사라졌을 것이다)가 붕 뜨고, In addition(또한)이 더할 같은 종류의 문장도 없음"], [5, "언어 얘기로 주제가 바뀐 뒤라 전쟁·랜드마크 얘기가 들어갈 수 없음"]], "var": {"en": "Moreover, countless historical and cultural landmarks would have been lost forever due to the destruction of war.", "ko": "게다가 수많은 역사적·문화적 랜드마크가 전쟁의 파괴로 영원히 사라졌을 것이다.", "chg": "In addition(또한) → Moreover(게다가)", "note": "앞머리가 바뀌어도 would have been(~했을 것이다)이 앞의 Without(~이 없었다면)을 요구"}, "fam": "첨가 가족: Moreover(게다가) / Furthermore(더욱이) / In addition(또한) / What is more(더욱이) / Besides(게다가)", "post": "그들이 없었다면 보물찾기도 없었음 → 랜드마크도 영원히 사라졌을 것 → 기억할 가치가 있는 공헌"}, {"id": "in-g1_jusung_L3-10", "p": 4, "s": 7, "pos": [5, 6, 7, 9, 10], "cue": ["This is why(이것이 ~하는 이유이다) → 앞 문장이 이유, language plays a big role(언어가 큰 역할을 한다)", "them(그것들) = languages(언어들)", "뒤 문장 For example, a nonprofit organization(예를 들어 한 비영리 단체) = some organizations(일부 단체들)의 예"], "trap": [[6, "‘언어가 사라질 수 있다’는 문장 뒤라 그럴듯하지만 뒤 문장 This would be a great loss(이것은 큰 손실일 것이다)의 This가 ‘언어의 사라짐’이 아닌 ‘보존 활동’을 가리키게 됨"], [9, "Wikitongues 문장 뒤에 넣으면 예(단체 하나)가 먼저, 일반적인 말(일부 단체들)이 나중에 나와 For example(예를 들어)의 순서가 깨짐"]], "var": {"en": "For this reason, some organizations work to preserve them.", "ko": "이런 이유로 일부 단체들이 언어를 지키기 위해 일한다.", "chg": "This is why(이것이 ~하는 이유이다) → For this reason(이런 이유로)", "note": "this reason(이 이유)이 가리키는 것도 앞 문장의 ‘언어의 큰 역할’"}, "fam": "결과 가족: As a result(그 결과) / Therefore(그러므로) / Thus(따라서) / Consequently(결과적으로) / For this reason(이런 이유로)", "post": "언어는 정체성과 문화를 이어 줌 → 그래서 단체들이 보존 활동 → 예시 Wikitongues"}]}</script><script>
var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='in:'+D.key;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var cur=0,lv=1,pick=-1,done=false;
function home(){var h='<h1>'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 IT.forEach(function(it,i){var s=st[it.id]||{};h+='<button class="row" onclick="op('+i+',1)"><b>'+esc(D.pass[it.p].label)+(IT.filter(function(x){return x.p==it.p}).length>1?' · '+(IT.slice(0,i+1).filter(function(x){return x.p==it.p}).length):'')+'</b><span class="st'+(s[1]?' on':'')+'">1단계</span><span class="st'+(s[2]?' on':'')+'">2단계</span></button>'});
 $('app').innerHTML=h;window.scrollTo(0,0)}

function draw(){var it=IT[cur],P=D.pass[it.p].sents,N=P.length,g=lv==1?{en:P[it.s].en,ko:P[it.s].ko}:{en:it['var'].en,ko:it['var'].ko};
 var h='<div class="top"><b>'+esc(D.pass[it.p].label)+'</b><button class="hb" onclick="home()">목록</button></div>';
 h+='<div class="seg"><button class="'+(lv==1?'on':'')+'" onclick="op('+cur+',1)">1단계 원문</button><button class="'+(lv==2?'on':'')+'" onclick="op('+cur+',2)">2단계 변형</button></div>';
 h+='<div class="giv"><small>주어진 문장</small><span lang="en" translate="no">'+esc(g.en)+'</span>'+(done?'<div class="ko">'+esc(g.ko)+'</div>':'')+'</div>';
 h+='<div class="ps" lang="en" translate="no">';
 for(var i=0;i<=N;i++){var k=it.pos.indexOf(i);
  if(k>=0){var cls='mk';if(done){if(i==it.s)cls+=' ok';else if(k==pick)cls+=' ng'}else if(k==pick)cls+=' sel';
   h+='<button class="'+cls+'" '+(done?'':'onclick="pk('+k+')"')+'>'+C[k]+'</button> ';
   if(done&&i==it.s)h+='<span class="ins">'+esc(g.en)+'</span> '}
  if(i<N&&i!=it.s)h+=esc(P[i].en)+' '}
 h+='</div>';
 if(!done)h+='<button class="go" '+(pick<0?'disabled':'')+' onclick="sub()">제출</button>';
 else{var ok=it.pos[pick]==it.s;h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답 '+C[pick]:'오답 · 정답 '+C[it.pos.indexOf(it.s)])+'</div>';
  h+='<div class="exh">이 자리인 이유</div>';it.cue.forEach(function(c){h+='<div class="why">'+esc(c)+'</div>'});
  (it.trap||[]).forEach(function(t){var k=it.pos.indexOf(t[0]);if(k<0)return;h+='<div class="trap"><b>'+C[k]+'</b> '+esc(t[1])+'</div>'});
  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
  if(it.fam)h+='<div class="post"><small>연결어 가족</small>'+esc(it.fam)+'</div>';
  if(it.post)h+='<div class="post"><small>흐름 기억</small>'+esc(it.post)+'</div>';
  h+='<button class="go" onclick="op('+cur+','+lv+')">다시 풀기</button>';
  if(lv==1)h+='<button class="go sec" onclick="op('+cur+',2)">2단계 변형 문장으로</button>';
  else if(cur+1<IT.length)h+='<button class="go sec" onclick="op('+(cur+1)+',1)">다음 문제</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h}
