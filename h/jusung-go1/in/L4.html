</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "교과서 4과 삽입 다지기", "sub": "공통영어2 4과 · 10문제", "key": "jusung-go1:in:L4", "pass": [{"label": "4과 ① 팔이 부러졌다면과 웹 접근성", "sents": [{"en": "Imagine you have fallen down and broken your right arm.", "ko": "넘어져서 오른팔이 부러졌다고 상상해 보자."}, {"en": "There are some things that would be difficult to do with your injured arm.", "ko": "다친 팔로는 하기 힘든 일들이 있을 것이다."}, {"en": "For example, you might not be able to carry heavy boxes or ride your bike.", "ko": "예를 들어, 무거운 상자를 나르거나 자전거를 타지 못할 수도 있다."}, {"en": "What about accessing the Internet?", "ko": "인터넷 사용은 어떨까?"}, {"en": "If you are right-handed, using a computer mouse or touchscreen with your left hand would be awkward and take a lot of time.", "ko": "오른손잡이라면 왼손으로 컴퓨터 마우스나 터치스크린을 쓰는 것은 어색하고 시간이 오래 걸릴 것이다."}, {"en": "However, this is a minor challenge compared to what some of us face on the Internet.", "ko": "하지만 이것은 우리 중 일부가 인터넷에서 겪는 어려움에 비하면 작은 문제이다."}, {"en": "For people with certain disabilities, many websites can be nearly impossible to use.", "ko": "특정 장애가 있는 사람들에게는 많은 웹 사이트가 거의 사용할 수 없는 수준일 수 있다."}, {"en": "This is the reason why web accessibility is important.", "ko": "이것이 웹 접근성이 중요한 이유이다."}, {"en": "Web accessibility is the practice of making sure that websites can be used by everyone, including people with disabilities.", "ko": "웹 접근성이란 장애가 있는 사람을 포함해 모든 사람이 웹 사이트를 쓸 수 있도록 하는 실천이다."}, {"en": "So what exactly makes a website accessible?", "ko": "그렇다면 정확히 무엇이 웹 사이트를 접근 가능하게 만들까?"}, {"en": "Here are some common features of accessible websites.", "ko": "다음은 접근성 있는 웹 사이트의 몇 가지 공통된 특징이다."}]}, {"label": "4과 ② 이미지와 대체 텍스트", "sents": [{"en": "Along with text, most websites include other forms of information, such as images.", "ko": "대부분의 웹 사이트는 텍스트와 함께 이미지 같은 다른 형식의 정보도 담고 있다."}, {"en": "Sometimes such visual information is important for understanding the text.", "ko": "때로는 그런 시각 정보가 텍스트를 이해하는 데 중요하다."}, {"en": "This is a problem for users with visual disabilities.", "ko": "이것은 시각 장애가 있는 사용자에게 문제가 된다."}, {"en": "When they go on a website, they often use programs called “screen readers,” which read online text aloud.", "ko": "그들은 웹 사이트에 들어갈 때 흔히 '스크린 리더'라는 프로그램을 쓰는데, 이 프로그램은 온라인 텍스트를 소리 내어 읽어 준다."}, {"en": "However, these programs cannot “read” images.", "ko": "하지만 이 프로그램들은 이미지를 '읽지' 못한다."}, {"en": "Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "ko": "접근성 있는 웹 사이트는 'alt text'라고도 하는 대체 텍스트를 제공해 이 문제를 해결한다."}, {"en": "Alt text is a brief description of non-textual information.", "ko": "대체 텍스트는 글이 아닌 정보에 대한 짧은 설명이다."}, {"en": "For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "ko": "예를 들어 이미지에 학생 무리가 나온다면, 대체 텍스트는 이미지 속 학생이 몇 명이고 무엇을 하고 있는지 설명할 것이다."}, {"en": "Screen readers can detect this alt text and read it aloud.", "ko": "스크린 리더는 이 대체 텍스트를 찾아내 소리 내어 읽어 줄 수 있다."}, {"en": "This way, alt text ensures that people with visual disabilities can access more of the information on a website.", "ko": "이런 방식으로 대체 텍스트는 시각 장애가 있는 사람들이 웹 사이트의 정보에 더 많이 접근할 수 있게 해 준다."}]}, {"label": "4과 ③ 대본·자막과 보기 쉬운 화면", "sents": [{"en": "In some cases, audio content cannot be accessed or understood.", "ko": "어떤 경우에는 음성 콘텐츠에 접근하거나 그것을 이해할 수 없다."}, {"en": "Some people may have hearing disabilities, while others might be in places where they can't listen to audio, such as a quiet library.", "ko": "청각 장애가 있는 사람도 있고, 조용한 도서관처럼 소리를 들을 수 없는 곳에 있는 사람도 있다."}, {"en": "Therefore, accessible websites often offer other ways to access information that is presented in audio form.", "ko": "그래서 접근성 있는 웹 사이트는 흔히 음성으로 제공되는 정보에 접근할 다른 방법을 제공한다."}, {"en": "For example, they may provide transcripts or captions that can help users access this information.", "ko": "예를 들어, 사용자가 이 정보에 접근하도록 돕는 대본이나 자막을 제공할 수 있다."}, {"en": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays.", "ko": "대본은 음성 콘텐츠 전체를 글로 옮긴 것이고, 자막은 영상이 재생될 때 화면에 나타나는 음성의 글 버전이다."}, {"en": "Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video.", "ko": "자막에는 말한 내용의 글뿐 아니라 영상 속 음악과 다른 소리에 대한 설명도 들어 있다."}, {"en": "Having a visual disability doesn't necessarily mean a person can't see at all.", "ko": "시각 장애가 있다고 해서 반드시 전혀 못 본다는 뜻은 아니다."}, {"en": "Some people, including many elderly people, simply have poor eyesight.", "ko": "많은 노인을 포함해 어떤 사람들은 그저 시력이 나쁠 뿐이다."}, {"en": "This makes it difficult for them to read.", "ko": "이 때문에 그들은 글을 읽기가 어렵다."}, {"en": "For this reason, accessible websites have a background color that contrasts with the color of their text.", "ko": "이런 이유로 접근성 있는 웹 사이트는 글자 색과 대비되는 배경 색을 쓴다."}, {"en": "This makes the text clear enough for most people to see.", "ko": "이렇게 하면 대부분의 사람이 보기에 글자가 충분히 또렷해진다."}]}, {"label": "4과 ④ 볼륨 조절과 키보드 탐색", "sents": [{"en": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.", "ko": "음성 콘텐츠의 경우, 접근성 있는 웹 사이트는 사용자가 배경음 볼륨을 조절하거나 아예 끌 수 있게 한다."}, {"en": "This gives users both with and without hearing difficulties more control over their experience while they are using the sites.", "ko": "이것은 청각에 어려움이 있는 사용자든 없는 사용자든 사이트를 쓰는 동안 자신의 경험을 더 잘 조절할 수 있게 해 준다."}, {"en": "Some users have disabilities that limit the movement of their hands.", "ko": "어떤 사용자들은 손의 움직임을 제한하는 장애가 있다."}, {"en": "They rely on their keyboards, rather than a mouse, to navigate websites.", "ko": "그들은 웹 사이트를 돌아다닐 때 마우스 대신 키보드에 의존한다."}, {"en": "On accessible websites, users can access everything on the site using only a keyboard.", "ko": "접근성 있는 웹 사이트에서는 키보드만으로 사이트의 모든 것에 접근할 수 있다."}, {"en": "This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "ko": "이는 링크, 버튼, 그리고 정보를 입력하는 공간인 필드에 키보드 탐색으로 접근할 수 있다는 뜻이다."}, {"en": "Users navigate the websites by making use of keys such as the space bar, the arrow keys, the enter key, and the tab key.", "ko": "사용자는 스페이스 바, 화살표 키, 엔터 키, 탭 키 같은 키를 이용해 웹 사이트를 탐색한다."}, {"en": "For example, they can use the tab key to jump from one part of a web page to another.", "ko": "예를 들어, 탭 키를 써서 웹 페이지의 한 부분에서 다른 부분으로 건너뛸 수 있다."}, {"en": "Both users with disabilities and those with temporarily injured hands can benefit from this kind of navigation.", "ko": "장애가 있는 사용자와 일시적으로 손을 다친 사용자 모두 이런 탐색 방식의 도움을 받을 수 있다."}, {"en": "Color blindness is a common visual disability.", "ko": "색맹은 흔한 시각 장애이다."}, {"en": "People with color blindness find it difficult to tell some colors apart.", "ko": "색맹인 사람들은 몇몇 색을 구별하기 어려워한다."}, {"en": "This can cause problems, especially when graphs and charts only use colors to show the differences between sets of information.", "ko": "이는 특히 그래프와 차트가 정보 사이의 차이를 색으로만 보여 줄 때 문제를 일으킬 수 있다."}]}, {"label": "4과 ⑤ 색 외 표시와 문화별 읽기 방향", "sents": [{"en": "Accessible websites use other indicators along with the colors.", "ko": "접근성 있는 웹 사이트는 색과 함께 다른 표시도 사용한다."}, {"en": "For example, a line in green may also be dotted, while a line in blue is solid.", "ko": "예를 들어, 초록색 선은 점선으로도 표시하고 파란색 선은 실선으로 표시할 수 있다."}, {"en": "This ensures that everyone can tell the two lines apart.", "ko": "이렇게 하면 누구나 두 선을 구별할 수 있다."}, {"en": "The accessibility features of websites don't just help people with disabilities.", "ko": "웹 사이트의 접근성 기능은 장애가 있는 사람들만 돕는 것이 아니다."}, {"en": "They can make online experiences easier for everyone, regardless of abilities or situations.", "ko": "그것들은 능력이나 상황에 관계없이 모든 사람의 온라인 경험을 더 편하게 만들어 줄 수 있다."}, {"en": "When websites are easy to navigate and understand, we can all benefit from a more inclusive online experience.", "ko": "웹 사이트가 탐색하고 이해하기 쉬우면, 우리 모두 더 포용적인 온라인 경험의 혜택을 누릴 수 있다."}, {"en": "Reading and writing systems are different across cultures.", "ko": "읽고 쓰는 방식은 문화마다 다르다."}, {"en": "People from Western cultures read and write from left to right, while those from some Middle Eastern cultures read and write from right to left.", "ko": "서양 문화권 사람들은 왼쪽에서 오른쪽으로 읽고 쓰는 반면, 일부 중동 문화권 사람들은 오른쪽에서 왼쪽으로 읽고 쓴다."}, {"en": "People from some Eastern cultures, like that of Japan, read and write from top to bottom.", "ko": "일본 같은 일부 동양 문화권 사람들은 위에서 아래로 읽고 쓴다."}, {"en": "Some global websites take these differences into consideration and adjust their websites for people in different regions.", "ko": "일부 글로벌 웹 사이트는 이런 차이를 고려해 지역별 사람들에게 맞게 사이트를 조정한다."}, {"en": "In countries where text is read from right to left, the website's search button is on the left and the logo is on the right.", "ko": "글을 오른쪽에서 왼쪽으로 읽는 나라에서는 웹 사이트의 검색 버튼이 왼쪽에, 로고가 오른쪽에 있다."}, {"en": "If you visit the same websites in a different language setting, you will see a different format.", "ko": "같은 웹 사이트라도 다른 언어 설정으로 들어가면 다른 구성을 보게 될 것이다."}]}], "items": [{"id": "in-g1_jusung_L4-01", "p": 0, "s": 2, "pos": [1, 2, 4, 6, 9], "cue": ["For example(예를 들어) → 앞 문장 some things that would be difficult(하기 어려울 몇 가지 일)의 예", "carry heavy boxes or ride your bike(무거운 상자를 나르거나 자전거를 타다) = some things(몇 가지 일)의 구체적 내용", "뒤 문장 What about ~?(~은 어떨까?) → 예를 든 뒤 새 화제(인터넷)로 전환"], "trap": [[1, "‘팔이 부러졌다’ 바로 뒤라 자연스러워 보이지만 예가 먼저 나오고 ‘어려운 일이 있다’는 일반적인 말이 뒤따르는 순서가 됨"], [4, "What about accessing the Internet?(인터넷 접속은 어떨까?) 뒤에는 인터넷 얘기가 와야 하는데 상자·자전거가 끼어듦"]], "var": {"en": "For instance, you might not be able to carry heavy boxes or ride your bike.", "ko": "예를 들어, 무거운 상자를 나르거나 자전거를 타지 못할 수도 있다.", "chg": "For example(예를 들어) → For instance(예를 들어)", "note": "모양이 달라도 같은 예시 신호, 앞에 some things(몇 가지 일)가 먼저 필요"}, "fam": "예시 가족: For example(예를 들어) / For instance(예를 들어) / such as(~와 같은) / To illustrate(예를 들어 설명하면)", "post": "다친 팔로 어려운 일들 → 예: 상자 나르기, 자전거 타기 → 인터넷은?"}, {"id": "in-g1_jusung_L4-02", "p": 0, "s": 5, "pos": [2, 3, 5, 7, 9], "cue": ["However(그러나) → 앞 문장 awkward and take a lot of time(불편하고 시간이 많이 걸리는)을 minor(작은) 문제로 뒤집음", "this(이것) = 왼손으로 마우스나 터치스크린을 쓰는 불편", "what some of us face(우리 중 일부가 겪는 것) → 뒤 문장 people with certain disabilities(특정 장애가 있는 사람들)로 연결"], "trap": [[7, "‘많은 웹 사이트가 거의 쓸 수 없다’ 뒤에 넣으면 this가 그 심각한 문제를 가리켜 minor challenge(작은 어려움)와 정반대"], [3, "상자·자전거 문장 뒤에 넣으면 on the Internet(인터넷에서)이 What about accessing the Internet?(인터넷 접속은 어떨까?)이라는 질문보다 먼저 나옴"]], "var": {"en": "However, this inconvenience is a minor challenge compared to what some of us face on the Internet.", "ko": "하지만 이 불편함은 우리 중 일부가 인터넷에서 겪는 어려움에 비하면 작은 문제이다.", "chg": "this(이것) → this inconvenience(이 불편함)", "note": "inconvenience(불편함)가 붙어 앞 문장의 awkward(불편한)를 받는다는 점이 더 분명"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "왼손 사용의 불편 → 그러나 그건 작은 문제 → 장애가 있는 사람에겐 웹 사이트 사용이 거의 불가능"}, {"id": "in-g1_jusung_L4-03", "p": 1, "s": 2, "pos": [2, 4, 6, 7, 9], "cue": ["This(이것) = 앞 문장 내용, visual information(시각 정보)이 글 이해에 중요하다는 점", "users with visual disabilities(시각 장애가 있는 사용자) → 뒤 문장 When they go on a website(그들이 웹 사이트에 들어갈 때)의 they(그들)"], "trap": [[4, "screen readers(화면 낭독기) 문장 뒤에 넣으면 This가 ‘화면 낭독기를 쓰는 것’을 가리키게 되고, 앞 문장 they(그들)가 받을 사람도 없어짐"], [6, "this problem(이 문제)이 앞에 있어 겹쳐 보이지만 이미 해결책 alt text(대체 텍스트)가 나온 뒤라 문제 제기가 뒤늦음"]], "var": {"en": "Such a situation is a problem for users with visual disabilities.", "ko": "그런 상황은 시각 장애가 있는 사용자에게 문제가 된다.", "chg": "This(이것) → Such a situation(그런 상황)", "note": "Such a situation(그런 상황)이 가리키는 것도 ‘시각 정보가 글 이해에 중요한’ 경우"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "시각 정보가 글 이해에 중요 → 시각 장애 사용자에게 문제 → 그들이 쓰는 화면 낭독기"}, {"id": "in-g1_jusung_L4-04", "p": 1, "s": 4, "pos": [1, 2, 4, 6, 8], "cue": ["However(그러나) → 앞 문장 read online text aloud(온라인 글을 소리 내어 읽다)와 반대되는 한계", "these programs(이 프로그램들) = 앞 문장의 programs called “screen readers”(화면 낭독기라는 프로그램)", "뒤 문장 this problem(이 문제) = 이미지를 못 읽는 문제"], "trap": [[6, "alt text(대체 텍스트) 소개 뒤에 넣으면 해결책이 나온 다음에 문제가 나오는 순서, these programs(이 프로그램들)도 가리킬 말과 멀어짐"], [2, "visual information(시각 정보) 얘기 뒤라 이미지와 이어지지만 these programs(이 프로그램들)가 가리킬 프로그램이 아직 없음"]], "var": {"en": "Unfortunately, these programs cannot “read” images.", "ko": "안타깝게도 이 프로그램들은 이미지를 '읽지' 못한다.", "chg": "However(그러나) → Unfortunately(안타깝게도)", "note": "앞머리가 바뀌어도 these programs(이 프로그램들)가 앞의 screen readers(화면 낭독기)를 요구"}, "fam": "역접 가족: However(그러나) / Yet(그렇지만) / Nevertheless(그럼에도 불구하고) / Still(그런데도) / On the other hand(반면에)", "post": "화면 낭독기가 글을 읽어 줌 → 그러나 이미지는 못 읽음 → 대체 텍스트로 해결"}, {"id": "in-g1_jusung_L4-05", "p": 2, "s": 2, "pos": [2, 4, 6, 8, 10], "cue": ["Therefore(그러므로) → 앞 문장이 이유, 청각 장애가 있거나 can't listen to audio(음성을 들을 수 없는) 곳에 있는 사람들", "other ways(다른 방법들) → 뒤 문장 For example(예를 들어)의 transcripts or captions(대본이나 자막)", "뒤 문장 they(그것들) = accessible websites(접근성 있는 웹 사이트)"], "trap": [[4, "transcripts or captions(대본이나 자막) 예시 뒤에 넣으면 예가 먼저, ‘다른 방법을 제공한다’는 일반적인 말이 나중이 되어 For example(예를 들어)의 순서가 깨짐"], [10, "‘배경색 대비’ 문장 뒤는 시각 얘기라 audio(음성) 정보와 관계없음"]], "var": {"en": "Thus, accessible websites often offer other ways to access information that is presented in audio form.", "ko": "따라서 접근성 있는 웹 사이트는 흔히 음성으로 제공되는 정보에 접근할 다른 방법을 제공한다.", "chg": "Therefore(그러므로) → Thus(따라서)", "note": "앞머리가 바뀌어도 ‘음성을 못 듣는 사람들’이라는 이유가 앞에 필요"}, "fam": "결과 가족: As a result(그 결과) / Therefore(그러므로) / Thus(따라서) / Consequently(결과적으로) / For this reason(이런 이유로)", "post": "음성을 못 듣는 사람들 → 그래서 다른 접근 방법 제공 → 예: 대본과 자막"}, {"id": "in-g1_jusung_L4-06", "p": 2, "s": 8, "pos": [5, 7, 8, 10, 11], "cue": ["This(이것) = 앞 문장의 poor eyesight(나쁜 시력)", "them(그들) = Some people, including many elderly people(많은 노인을 포함한 일부 사람들)", "뒤 문장 For this reason(이런 이유로) → 읽기 어렵다는 문제가 이유"], "trap": [[10, "배경색 대비 문장 뒤에 넣으면 This가 ‘글자와 대비되는 배경색’을 가리켜 ‘대비가 읽기를 어렵게 한다’는 정반대 뜻"], [7, "시각 장애 얘기 뒤라 통해 보이지만 them(그들)이 가리킬 poor eyesight(나쁜 시력)를 가진 사람들이 아직 안 나옴"]], "var": {"en": "As a result, it is difficult for them to read.", "ko": "그 결과 그들은 글을 읽기가 어렵다.", "chg": "This makes it difficult(이것이 ~을 어렵게 한다) → As a result, it is difficult(그 결과 ~이 어렵다)", "note": "This가 사라져도 As a result(그 결과)가 앞의 원인 poor eyesight(나쁜 시력)를 요구"}, "fam": "결과 가족: As a result(그 결과) / Therefore(그러므로) / Thus(따라서) / Consequently(결과적으로) / For this reason(이런 이유로)", "post": "시력이 나쁜 사람들 → 글 읽기 어려움 → 그래서 글자와 대비되는 배경색"}, {"id": "in-g1_jusung_L4-07", "p": 3, "s": 1, "pos": [1, 3, 5, 7, 10], "cue": ["This(이것) = 앞 문장 내용, adjust the volume(음량을 조절하다)하거나 turn it off(그것을 끄다)할 수 있게 한 것", "users both with and without hearing difficulties(청각에 어려움이 있는 사용자와 없는 사용자 모두) → audio content(음성 콘텐츠) 얘기 바로 뒤", "more control(더 많은 조절 권한) = adjust(조절하다)와 짝"], "trap": [[5, "‘키보드만으로 모든 것에 접근’ 뒤에 넣으면 control(조절)과 통해 보이지만 hearing difficulties(청각의 어려움)는 키보드 얘기와 관계없음"], [3, "손 움직임에 제한이 있는 사용자 얘기 뒤라 This가 ‘손의 장애’를 가리켜 뜻이 안 통함"]], "var": {"en": "This feature gives users both with and without hearing difficulties more control over their experience while they are using the sites.", "ko": "이 기능은 청각에 어려움이 있는 사용자든 없는 사용자든 사이트를 쓰는 동안 자신의 경험을 더 잘 조절할 수 있게 해 준다.", "chg": "This(이것) → This feature(이 기능)", "note": "feature(기능)가 붙어 앞 문장의 음량 조절·끄기를 받는다는 점이 더 분명"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "배경음 조절·끄기 기능 → 모든 사용자에게 더 많은 조절 권한 → 다음 주제인 손 움직임 장애"}, {"id": "in-g1_jusung_L4-08", "p": 3, "s": 3, "pos": [1, 3, 5, 8, 11], "cue": ["They(그들) = 앞 문장의 Some users(일부 사용자들), 손 움직임에 제한이 있는 사람들", "rather than a mouse(마우스 대신) → limit the movement of their hands(손의 움직임을 제한하다)의 결과", "뒤 문장 using only a keyboard(키보드만 사용해서) → keyboards(키보드)를 받아 이어감"], "trap": [[5, "키보드 얘기 뒤라 이어져 보이지만 ‘키보드에 의존한다’는 사정이 해결책(키보드만으로 접근 가능)보다 늦게 나오고, 뒤 문장 This means(이것은 ~라는 뜻)가 풀어 줄 ‘키보드만으로 접근 가능’과 끊김"], [11, "색맹 얘기 뒤에 넣으면 They가 People with color blindness(색맹이 있는 사람들)가 되어 키보드와 관계없음"]], "var": {"en": "These users rely on their keyboards, rather than a mouse, to navigate websites.", "ko": "이 사용자들은 웹 사이트를 돌아다닐 때 마우스 대신 키보드에 의존한다.", "chg": "They(그들) → These users(이 사용자들)", "note": "These users(이 사용자들)가 가리키는 것도 앞 문장의 Some users(일부 사용자들)"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "손 움직임에 제한이 있는 사용자 → 마우스 대신 키보드에 의존 → 키보드만으로 다 되는 사이트"}, {"id": "in-g1_jusung_L4-09", "p": 4, "s": 1, "pos": [1, 3, 5, 7, 9], "cue": ["For example(예를 들어) → 앞 문장 other indicators(다른 표시들)의 예", "dotted(점선으로 된)·solid(실선의) = 색 말고 쓰는 other indicators(다른 표시들)의 구체적 모습", "뒤 문장 the two lines(그 두 선) = a line in green(초록색 선)과 a line in blue(파란색 선)"], "trap": [[3, "the two lines(그 두 선) 문장 뒤에 넣으면 두 선이 소개되기도 전에 ‘그 두 선’이 먼저 나오는 꼴"], [5, "‘모두에게 더 쉬운 온라인 경험’ 뒤라 예시가 올 법하지만 그 내용은 색·선과 관계없는 일반적인 장점"]], "var": {"en": "For instance, a line in green may also be dotted, while a line in blue is solid.", "ko": "예를 들어, 초록색 선은 점선으로도 표시하고 파란색 선은 실선으로 표시할 수 있다.", "chg": "For example(예를 들어) → For instance(예를 들어)", "note": "모양이 달라도 같은 예시 신호, 앞에 other indicators(다른 표시들)가 먼저 필요"}, "fam": "예시 가족: For example(예를 들어) / For instance(예를 들어) / such as(~와 같은) / To illustrate(예를 들어 설명하면)", "post": "색과 함께 다른 표시 사용 → 예: 초록 점선과 파란 실선 → 누구나 두 선 구분 가능"}, {"id": "in-g1_jusung_L4-10", "p": 4, "s": 9, "pos": [3, 5, 6, 9, 11], "cue": ["these differences(이런 차이들) = 앞 세 문장의 읽고 쓰는 방향 차이, left to right(왼쪽에서 오른쪽으로)·right to left(오른쪽에서 왼쪽으로)·top to bottom(위에서 아래로)", "Some global websites(일부 글로벌 웹 사이트) → 뒤 문장 the website's search button(그 웹 사이트의 검색 버튼)의 the(그)가 받는 말", "adjust(조정하다) → 뒤 문장의 버튼·로고 위치가 조정의 예"], "trap": [[6, "문화 얘기가 시작되기 직전이라 these differences(이런 차이들)가 가리킬 차이가 아직 하나도 없음"], [11, "검색 버튼 문장 뒤에 넣으면 the website's(그 웹 사이트의)가 가리킬 웹 사이트가 소개되기 전에 예가 먼저 나옴"]], "var": {"en": "Some global websites take such cultural differences into consideration and adjust their websites for people in different regions.", "ko": "일부 글로벌 웹 사이트는 그런 문화적 차이를 고려해 지역별 사람들에게 맞게 사이트를 조정한다.", "chg": "these differences(이런 차이들) → such cultural differences(그런 문화적 차이들)", "note": "these가 such로 바뀌어도 앞에 문화별 차이가 먼저 나와야 하는 점은 그대로"}, "fam": "앞 명사를 받는 말: It(그것) / This(이것) / This + 명사(이 ~) / The + 명사(그 ~) / Such + 명사(그런 ~)", "post": "문화마다 다른 읽기·쓰기 방향 → 글로벌 웹 사이트가 이를 고려해 조정 → 버튼과 로고 위치의 예"}]}</script><script>
var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='in:'+D.key;
var C='①②③④⑤';

var st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

var cur=0,lv=1,pick=-1,done=false;
function home(){var h='<h1>'+esc(D.title)+'</h1><div class="sub">'+esc(D.sub)+'</div>';
 IT.forEach(function(it,i){var s=st[it.id]||{};h+='<button class="row" onclick="op('+i+',1)"><b>'+esc(D.pass[it.p].label)+(IT.filter(function(x){return x.p==it.p}).length>1?' · '+(IT.slice(0,i+1).filter(function(x){return x.p==it.p}).length):'')+'</b><span class="st'+(s[1]?' on':'')+'">1단계</span><span class="st'+(s[2]?' on':'')+'">2단계</span></button>'});
 $('app').innerHTML=h;window.scrollTo(0,0)}
function op(i,l){cur=i;lv=l;pick=-1;done=false;draw();window.scrollTo(0,0)}
function draw(){var it=IT[cur],P=D.pass[it.p].sents,N=P.length,g=lv==1?{en:P[it.s].en,ko:P[it.s].ko}:{en:it['var'].en,ko:it['var'].ko};
 var h='<div class="top"><b>'+esc(D.pass[it.p].label)+'</b><button class="hb" onclick="home()">목록</button></div>';
 h+='<div class="seg"><button class="'+(lv==1?'on':'')+'" onclick="op('+cur+',1)">1단계 원문</button><button class="'+(lv==2?'on':'')+'" onclick="op('+cur+',2)">2단계 변형</button></div>';
 h+='<div class="giv"><small>주어진 문장</small><span lang="en" translate="no">'+esc(g.en)+'</span>'+(done?'<div class="ko">'+esc(g.ko)+'</div>':'')+'</div>';
 h+='<div class="ps" lang="en" translate="no">';
 for(var i=0;i<=N;i++){var k=it.pos.indexOf(i);
  if(k>=0){var cls='mk';if(done){if(i==it.s)cls+=' ok';else if(k==pick)cls+=' ng'}else if(k==pick)cls+=' sel';
   h+='<button class="'+cls+'" '+(done?'':'onclick="pk('+k+')"')+'>'+C[k]+'</button> ';
   if(done&&i==it.s)h+='<span class="ins">'+esc(g.en)+'</span> '}
  if(i<N&&i!=it.s)h+=esc(P[i].en)+' '}
 h+='</div>';
 if(!done)h+='<button class="go" '+(pick<0?'disabled':'')+' onclick="sub()">제출</button>';
 else{var ok=it.pos[pick]==it.s;h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답 '+C[pick]:'오답 · 정답 '+C[it.pos.indexOf(it.s)])+'</div>';
  h+='<div class="exh">이 자리인 이유</div>';it.cue.forEach(function(c){h+='<div class="why">'+esc(c)+'</div>'});
  (it.trap||[]).forEach(function(t){var k=it.pos.indexOf(t[0]);if(k<0)return;h+='<div class="trap"><b>'+C[k]+'</b> '+esc(t[1])+'</div>'});
  if(lv==2)h+='<div class="chg"><b>바뀐 앞머리</b>'+esc(it['var'].chg)+(it['var'].note?'<div>'+esc(it['var'].note)+'</div>':'')+'</div>';
  if(it.fam)h+='<div class="post"><small>연결어 가족</small>'+esc(it.fam)+'</div>';
  if(it.post)h+='<div class="post"><small>흐름 기억</small>'+esc(it.post)+'</div>';
  h+='<button class="go" onclick="op('+cur+','+lv+')">다시 풀기</button>';
  if(lv==1)h+='<button class="go sec" onclick="op('+cur+',2)">2단계 변형 문장으로</button>';
  else if(cur+1<IT.length)h+='<button class="go sec" onclick="op('+(cur+1)+',1)">다음 문제</button>'}
 h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h}
function pk(k){pick=k;draw()}
function sub(){done=true;var it=IT[cur];if(it.pos[pick]==it.s){st[it.id]=st[it.id]||{};st[it.id][lv]=1;save()}draw()}
