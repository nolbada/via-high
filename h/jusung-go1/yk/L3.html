</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "공통영어2 3과 · 23단어", "key": "jusung-go1:yk:L3", "sec": 0, "pass": [{"label": "3과 ① 모뉴먼츠 맨의 탄생과 처음 역할", "sents": [{"en": "During World War II, there was a group of people who risked everything to protect priceless works of art from ruin.", "ko": "제2차 세계대전 동안, 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다."}, {"en": "In 1943, around 345 people from 14 different Allied nations came together to form the Monuments, Fine Arts, and Archives (MFAA) program.", "ko": "1943년, 14개 연합국에서 온 약 345명의 사람들이 모여 기념물·미술품·기록물(MFAA) 프로그램을 만들었다."}, {"en": "They were not trained soldiers but scholars and experts of various kinds, such as professors, historians, and architects.", "ko": "그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가 같은 다양한 분야의 학자와 전문가들이었다."}, {"en": "These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”", "ko": "이 용감한 남녀들은 유럽의 문화유산을 지키는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다."}, {"en": "When the MFAA was first formed, its main goal was to prevent the destruction of cultural landmarks.", "ko": "MFAA가 처음 만들어졌을 때, 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다."}, {"en": "The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings.", "ko": "모뉴먼츠 맨은 박물관, 교회 등 문화적으로 중요한 건물이 있는 지역을 폭격하지 말라고 연합군을 설득했다."}, {"en": "They also visited areas that had already been destroyed to restore damaged architecture and works of art.", "ko": "그들은 또한 훼손된 건축물과 예술 작품을 복원하려고 이미 파괴된 지역을 찾아갔다."}, {"en": "It wasn’t long before their role expanded.", "ko": "머지않아 그들의 역할은 더 커졌다."}, {"en": "During the war, the Nazis had been stealing works of art and other cultural treasures from countries across Europe.", "ko": "전쟁 중에 나치는 유럽 여러 나라에서 예술 작품과 문화재를 훔치고 있었다."}, {"en": "They hid these treasures in places like castles, mines, and caves.", "ko": "그들은 이 보물들을 성, 광산, 동굴 같은 곳에 숨겼다."}]}, {"label": "3과 ② 보물찾기와 알타우제 광산", "sents": [{"en": "When the Monuments Men learned about this, they started looking for the stolen treasures.", "ko": "모뉴먼츠 맨은 이 사실을 알게 되자 도난당한 보물들을 찾기 시작했다."}, {"en": "Their search has since been called “the greatest treasure hunt in history.”", "ko": "그들의 수색은 이후 '역사상 가장 위대한 보물찾기'라고 불려 왔다."}, {"en": "When Germany began to lose the war, the stolen objects came under threat.", "ko": "독일이 전쟁에서 지기 시작하자, 도난당한 물건들은 위험에 처하게 되었다."}, {"en": "Hitler ordered his forces to destroy everything that could be useful to the Allied armies before they retreated from an area.", "ko": "히틀러는 군대에게 한 지역에서 후퇴하기 전에 연합군에게 쓸모 있을 만한 것은 모두 파괴하라고 명령했다."}, {"en": "Some Nazi leaders believed that this included not just military and industrial equipment but everything of value — even the stolen works of art.", "ko": "일부 나치 지도자들은 여기에 군사·산업 장비뿐 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품까지 포함된다고 여겼다."}, {"en": "One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria.", "ko": "도난당한 물품을 가장 많이 모아 둔 곳 중 하나는 오스트리아 알타우제의 소금 광산이었다."}, {"en": "Upon discovering its location, some of the Monuments Men rushed to the mines.", "ko": "그 위치를 알아내자마자 모뉴먼츠 맨 일부가 광산으로 서둘러 갔다."}, {"en": "They hoped to recover everything before it was too late.", "ko": "그들은 너무 늦기 전에 모든 것을 되찾기를 바랐다."}, {"en": "Meanwhile, the Nazi leader who was in charge of the area tried to destroy everything by setting off large explosives inside the mines.", "ko": "한편, 그 지역을 맡고 있던 나치 지도자는 광산 안에서 대형 폭발물을 터뜨려 모든 것을 파괴하려 했다."}, {"en": "This could have been disastrous.", "ko": "이것은 처참한 결과를 낳을 수도 있었다."}]}, {"label": "3과 ③ 광부들의 기지와 두 달의 기한", "sents": [{"en": "Luckily, some local miners found the explosives in the mines and came up with a plan to protect their livelihood.", "ko": "다행히 그 지역 광부 몇 명이 광산에서 폭발물을 발견했고, 자신들의 생계를 지킬 계획을 세웠다."}, {"en": "They secretly removed the large explosives and put smaller ones at the entrances.", "ko": "그들은 몰래 대형 폭발물을 치우고 입구에 더 작은 폭발물을 놓았다."}, {"en": "Once they went off, the Nazi leader believed that everything was destroyed.", "ko": "그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 믿었다."}, {"en": "However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.", "ko": "그러나 작은 폭발은 입구를 막았을 뿐, 광산의 나머지 부분과 예술 작품들은 멀쩡하게 남겨 두었다."}, {"en": "When the Monuments Men arrived and squeezed their way into the mines, they must have been amazed to see what was inside.", "ko": "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 안에 있는 것을 보고 틀림없이 깜짝 놀랐을 것이다."}, {"en": "There were thousands of priceless objects, including paintings, statues, books, furniture, and more.", "ko": "그곳에는 그림, 조각상, 책, 가구 등 수천 점의 귀중한 물건이 있었다."}, {"en": "The Monuments Men thought it would take about one year to transport everything they found to a safe location.", "ko": "모뉴먼츠 맨은 발견한 모든 것을 안전한 곳으로 옮기는 데 약 1년이 걸릴 것이라고 생각했다."}, {"en": "However, because control of the area was going to change at the end of the war, they would have access to the mines for just two months.", "ko": "그러나 전쟁이 끝나면 그 지역의 통제권이 바뀔 예정이어서, 그들이 광산에 들어갈 수 있는 기간은 단 두 달뿐이었다."}]}, {"label": "3과 ④ 불가능한 수송과 전쟁 후의 노력", "sents": [{"en": "With insufficient packing supplies and only a few trucks, the transporting mission seemed impossible.", "ko": "포장 자재도 부족하고 트럭도 몇 대뿐이라 수송 임무는 불가능해 보였다."}, {"en": "Not only that, but food was in short supply.", "ko": "그뿐만 아니라 식량도 부족했다."}, {"en": "Even without eating proper meals, they worked up to twenty hours a day.", "ko": "제대로 된 식사도 못 한 채 그들은 하루에 최대 20시간씩 일했다."}, {"en": "They used coats and gas masks as packing materials and did everything they could to accomplish this vital mission in time.", "ko": "그들은 외투와 방독면을 포장재로 쓰며 이 중요한 임무를 제때 끝내기 위해 할 수 있는 모든 것을 했다."}, {"en": "In the end, the Monuments Men succeeded in rescuing thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges.", "ko": "마침내 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 페르메이르의 「천문학자」, 미켈란젤로의 「브뤼헤의 성모」 같은 중요한 작품을 포함해 수천 점의 도난 예술품을 구해 냈다."}, {"en": "The efforts of the Monuments Men did not end with the war.", "ko": "모뉴먼츠 맨의 노력은 전쟁이 끝났다고 끝나지 않았다."}, {"en": "For several years, they continued the work of recovering cultural treasures and identifying where they had been stolen from.", "ko": "여러 해 동안 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 밝혀내는 일을 계속했다."}, {"en": "In the end, the Monuments Men returned more than five million works of art and objects of cultural importance to their places of origin.", "ko": "마침내 모뉴먼츠 맨은 5백만 점이 넘는 예술 작품과 문화적으로 중요한 물건을 원래 있던 곳으로 돌려보냈다."}, {"en": "Not everything that was stolen by the Nazis has been found, but what the Monuments Men accomplished is truly amazing.", "ko": "나치가 훔친 것이 모두 발견된 것은 아니지만, 모뉴먼츠 맨이 이뤄 낸 일은 정말 놀랍다."}]}, {"label": "3과 ⑤ 모뉴먼츠 맨의 의미와 사라지는 언어", "sents": [{"en": "Without this determined group, the search for stolen works of art might never have begun.", "ko": "이 결연한 집단이 없었다면 도난 예술품 수색은 아예 시작되지 않았을지도 모른다."}, {"en": "In addition, countless historical and cultural landmarks would have been lost forever due to the destruction of war.", "ko": "또한 수많은 역사적·문화적 랜드마크가 전쟁의 파괴로 영원히 사라졌을 것이다."}, {"en": "It is worth remembering the Monuments Men’s contribution to the preservation of cultural heritage.", "ko": "문화유산 보존에 대한 모뉴먼츠 맨의 기여는 기억할 가치가 있다."}, {"en": "Thanks to their efforts, many incredible cultural sites and works of art have survived and can still be appreciated to this day.", "ko": "그들의 노력 덕분에 많은 놀라운 문화 유적과 예술 작품이 살아남아 오늘날까지도 감상될 수 있다."}, {"en": "Did you know that there are over 7,000 languages currently being used around the world?", "ko": "현재 전 세계에서 7,000개가 넘는 언어가 쓰이고 있다는 것을 알고 있었는가?"}, {"en": "Most of these languages are spoken by very small groups of people, and half of them could disappear within the next generation.", "ko": "이 언어들 대부분은 아주 적은 수의 사람들이 사용하며, 그중 절반은 다음 세대 안에 사라질 수도 있다."}, {"en": "This would be a great loss because language plays a big role in connecting people’s identity to their culture.", "ko": "언어는 사람들의 정체성을 그들의 문화와 이어 주는 큰 역할을 하기 때문에 이것은 큰 손실이 될 것이다."}, {"en": "This is why some organizations work to preserve them.", "ko": "이것이 일부 단체들이 언어를 지키기 위해 일하는 이유이다."}, {"en": "For example, a nonprofit organization called Wikitongues has set the goal of preserving all languages that are in danger of being lost.", "ko": "예를 들어, 위키텅스(Wikitongues)라는 비영리 단체는 사라질 위기에 놓인 모든 언어를 보존한다는 목표를 세웠다."}, {"en": "The organization works to achieve this by recording videos of individuals speaking these languages and making mother-tongue resources more accessible.", "ko": "이 단체는 그 언어를 쓰는 사람들의 영상을 기록하고 모국어 자료를 더 쉽게 접할 수 있게 함으로써 이 목표를 이루려 노력한다."}]}], "items": [{"id": "g1js3-01", "p": 0, "s": 0, "w": "priceless", "h": "priceless", "pos": "형", "m": "매우 귀중한, 값을 매길 수 없는", "form": "", "syn": [["invaluable", "매우 귀중한"], ["precious", "귀중한"]], "ant": [["worthless", "가치 없는"], ["cheap", "값싼"]], "trap": [], "dis": [["noisy", "시끄러운"]], "other": [], "tip": "priceless = invaluable = 매우 귀중한, -less가 붙어도 '값싼·값어치 없는' 아님", "story": "전쟁 중 귀중한 예술품을 지키려고 모든 걸 건 사람들 소개에서 나온 단어"}, {"id": "g1js3-02", "p": 0, "s": 0, "w": "ruin", "h": "ruin", "pos": "명", "m": "파괴, 파멸", "form": "", "syn": [["destruction", "파괴"], ["damage", "손상"]], "ant": [], "trap": [["remains", "유적, 잔해", "ruin의 다른 뜻 '(ruins) 폐허, 유적'과 비슷한 말"]], "dis": [["reward", "보상"], ["rumor", "소문"]], "other": [["(ruins) 폐허, 유적", "We visited the ruins of an old castle.", "우리는 옛 성의 유적을 방문했다."], ["망치다(동사)", "The rain ruined our picnic.", "비가 우리 소풍을 망쳤다."]], "tip": "from ruin = from destruction, 복수 ruins는 '유적' 뜻", "story": "전쟁 중 귀중한 예술품을 파괴로부터 지키려 한 사람들 소개에서 나온 단어"}, {"id": "g1js3-03", "p": 0, "s": 1, "w": "form", "h": "form", "pos": "동", "m": "만들다, 결성하다", "form": "", "syn": [["establish", "설립하다"], ["set up", "세우다"], ["create", "만들다"]], "ant": [["break up", "해체하다"]], "trap": [], "dis": [["borrow", "빌리다"]], "other": [["서식, 양식(명사)", "Fill out this form.", "이 서식을 작성해라."], ["형태(명사)", "Ice is a form of water.", "얼음은 물의 한 형태이다."]], "tip": "form a group = set up a group, 명사 f   else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';
 if(it.story)h+='<div class="post"><small>본문 기억</small>'+esc(it.story)+'</div>';
 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
</script></body></html>
