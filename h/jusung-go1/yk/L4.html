</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "공통영어2 4과 · 23단어", "key": "jusung-go1:yk:L4", "sec": 0, "pass": [{"label": "4과 ① 팔이 부러졌다면과 웹 접근성", "sents": [{"en": "Imagine you have fallen down and broken your right arm.", "ko": "넘어져서 오른팔이 부러졌다고 상상해 보자."}, {"en": "There are some things that would be difficult to do with your injured arm.", "ko": "다친 팔로는 하기 힘든 일들이 있을 것이다."}, {"en": "For example, you might not be able to carry heavy boxes or ride your bike.", "ko": "예를 들어, 무거운 상자를 나르거나 자전거를 타지 못할 수도 있다."}, {"en": "What about accessing the Internet?", "ko": "인터넷 사용은 어떨까?"}, {"en": "If you are right-handed, using a computer mouse or touchscreen with your left hand would be awkward and take a lot of time.", "ko": "오른손잡이라면 왼손으로 컴퓨터 마우스나 터치스크린을 쓰는 것은 어색하고 시간이 오래 걸릴 것이다."}, {"en": "However, this is a minor challenge compared to what some of us face on the Internet.", "ko": "하지만 이것은 우리 중 일부가 인터넷에서 겪는 어려움에 비하면 작은 문제이다."}, {"en": "For people with certain disabilities, many websites can be nearly impossible to use.", "ko": "특정 장애가 있는 사람들에게는 많은 웹 사이트가 거의 사용할 수 없는 수준일 수 있다."}, {"en": "This is the reason why web accessibility is important.", "ko": "이것이 웹 접근성이 중요한 이유이다."}, {"en": "Web accessibility is the practice of making sure that websites can be used by everyone, including people with disabilities.", "ko": "웹 접근성이란 장애가 있는 사람을 포함해 모든 사람이 웹 사이트를 쓸 수 있도록 하는 실천이다."}, {"en": "So what exactly makes a website accessible?", "ko": "그렇다면 정확히 무엇이 웹 사이트를 접근 가능하게 만들까?"}, {"en": "Here are some common features of accessible websites.", "ko": "다음은 접근성 있는 웹 사이트의 몇 가지 공통된 특징이다."}]}, {"label": "4과 ② 이미지와 대체 텍스트", "sents": [{"en": "Along with text, most websites include other forms of information, such as images.", "ko": "대부분의 웹 사이트는 텍스트와 함께 이미지 같은 다른 형식의 정보도 담고 있다."}, {"en": "Sometimes such visual information is important for understanding the text.", "ko": "때로는 그런 시각 정보가 텍스트를 이해하는 데 중요하다."}, {"en": "This is a problem for users with visual disabilities.", "ko": "이것은 시각 장애가 있는 사용자에게 문제가 된다."}, {"en": "When they go on a website, they often use programs called “screen readers,” which read online text aloud.", "ko": "그들은 웹 사이트에 들어갈 때 흔히 '스크린 리더'라는 프로그램을 쓰는데, 이 프로그램은 온라인 텍스트를 소리 내어 읽어 준다."}, {"en": "However, these programs cannot “read” images.", "ko": "하지만 이 프로그램들은 이미지를 '읽지' 못한다."}, {"en": "Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "ko": "접근성 있는 웹 사이트는 'alt text'라고도 하는 대체 텍스트를 제공해 이 문제를 해결한다."}, {"en": "Alt text is a brief description of non-textual information.", "ko": "대체 텍스트는 글이 아닌 정보에 대한 짧은 설명이다."}, {"en": "For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "ko": "예를 들어 이미지에 학생 무리가 나온다면, 대체 텍스트는 이미지 속 학생이 몇 명이고 무엇을 하고 있는지 설명할 것이다."}, {"en": "Screen readers can detect this alt text and read it aloud.", "ko": "스크린 리더는 이 대체 텍스트를 찾아내 소리 내어 읽어 줄 수 있다."}, {"en": "This way, alt text ensures that people with visual disabilities can access more of the information on a website.", "ko": "이런 방식으로 대체 텍스트는 시각 장애가 있는 사람들이 웹 사이트의 정보에 더 많이 접근할 수 있게 해 준다."}]}, {"label": "4과 ③ 대본·자막과 보기 쉬운 화면", "sents": [{"en": "In some cases, audio content cannot be accessed or understood.", "ko": "어떤 경우에는 음성 콘텐츠에 접근하거나 그것을 이해할 수 없다."}, {"en": "Some people may have hearing disabilities, while others might be in places where they can't listen to audio, such as a quiet library.", "ko": "청각 장애가 있는 사람도 있고, 조용한 도서관처럼 소리를 들을 수 없는 곳에 있는 사람도 있다."}, {"en": "Therefore, accessible websites often offer other ways to access information that is presented in audio form.", "ko": "그래서 접근성 있는 웹 사이트는 흔히 음성으로 제공되는 정보에 접근할 다른 방법을 제공한다."}, {"en": "For example, they may provide transcripts or captions that can help users access this information.", "ko": "예를 들어, 사용자가 이 정보에 접근하도록 돕는 대본이나 자막을 제공할 수 있다."}, {"en": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays.", "ko": "대본은 음성 콘텐츠 전체를 글로 옮긴 것이고, 자막은 영상이 재생될 때 화면에 나타나는 음성의 글 버전이다."}, {"en": "Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video.", "ko": "자막에는 말한 내용의 글뿐 아니라 영상 속 음악과 다른 소리에 대한 설명도 들어 있다."}, {"en": "Having a visual disability doesn't necessarily mean a person can't see at all.", "ko": "시각 장애가 있다고 해서 반드시 전혀 못 본다는 뜻은 아니다."}, {"en": "Some people, including many elderly people, simply have poor eyesight.", "ko": "많은 노인을 포함해 어떤 사람들은 그저 시력이 나쁠 뿐이다."}, {"en": "This makes it difficult for them to read.", "ko": "이 때문에 그들은 글을 읽기가 어렵다."}, {"en": "For this reason, accessible websites have a background color that contrasts with the color of their text.", "ko": "이런 이유로 접근성 있는 웹 사이트는 글자 색과 대비되는 배경 색을 쓴다."}, {"en": "This makes the text clear enough for most people to see.", "ko": "이렇게 하면 대부분의 사람이 보기에 글자가 충분히 또렷해진다."}]}, {"label": "4과 ④ 볼륨 조절과 키보드 탐색", "sents": [{"en": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.", "ko": "음성 콘텐츠의 경우, 접근성 있는 웹 사이트는 사용자가 배경음 볼륨을 조절하거나 아예 끌 수 있게 한다."}, {"en": "This gives users both with and without hearing difficulties more control over their experience while they are using the sites.", "ko": "이것은 청각에 어려움이 있는 사용자든 없는 사용자든 사이트를 쓰는 동안 자신의 경험을 더 잘 조절할 수 있게 해 준다."}, {"en": "Some users have disabilities that limit the movement of their hands.", "ko": "어떤 사용자들은 손의 움직임을 제한하는 장애가 있다."}, {"en": "They rely on their keyboards, rather than a mouse, to navigate websites.", "ko": "그들은 웹 사이트를 돌아다닐 때 마우스 대신 키보드에 의존한다."}, {"en": "On accessible websites, users can access everything on the site using only a keyboard.", "ko": "접근성 있는 웹 사이트에서는 키보드만으로 사이트의 모든 것에 접근할 수 있다."}, {"en": "This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "ko": "이는 링크, 버튼, 그리고 정보를 입력하는 공간인 필드에 키보드 탐색으로 접근할 수 있다는 뜻이다."}, {"en": "Users navigate the websites by making use of keys such as the space bar, the arrow keys, the enter key, and the tab key.", "ko": "사용자는 스페이스 바, 화살표 키, 엔터 키, 탭 키 같은 키를 이용해 웹 사이트를 탐색한다."}, {"en": "For example, they can use the tab key to jump from one part of a web page to another.", "ko": "예를 들어, 탭 키를 써서 웹 페이지의 한 부분에서 다른 부분으로 건너뛸 수 있다."}, {"en": "Both users with disabilities and those with temporarily injured hands can benefit from this kind of navigation.", "ko": "장애가 있는 사용자와 일시적으로 손을 다친 사용자 모두 이런 탐색 방식의 도움을 받을 수 있다."}, {"en": "Color blindness is a common visual disability.", "ko": "색맹은 흔한 시각 장애이다."}, {"en": "People with color blindness find it difficult to tell some colors apart.", "ko": "색맹인 사람들은 몇몇 색을 구별하기 어려워한다."}, {"en": "This can cause problems, especially when graphs and charts only use colors to show the differences between sets of information.", "ko": "이는 특히 그래프와 차트가 정보 사이의 차이를 색으로만 보여 줄 때 문제를 일으킬 수 있다."}]}, {"label": "4과 ⑤ 색 외 표시와 문화별 읽기 방향", "sents": [{"en": "Accessible websites use other indicators along with the colors.", "ko": "접근성 있는 웹 사이트는 색과 함께 다른 표시도 사용한다."}, {"en": "For example, a line in green may also be dotted, while a line in blue is solid.", "ko": "예를 들어, 초록색 선은 점선으로도 표시하고 파란색 선은 실선으로 표시할 수 있다."}, {"en": "This ensures that everyone can tell the two lines apart.", "ko": "이렇게 하면 누구나 두 선을 구별할 수 있다."}, {"en": "The accessibility features of websites don't just help people with disabilities.", "ko": "웹 사이트의 접근성 기능은 장애가 있는 사람들만 돕는 것이 아니다."}, {"en": "They can make online experiences easier for everyone, regardless of abilities or situations.", "ko": "그것들은 능력이나 상황에 관계없이 모든 사람의 온라인 경험을 더 편하게 만들어 줄 수 있다."}, {"en": "When websites are easy to navigate and understand, we can all benefit from a more inclusive online experience.", "ko": "웹 사이트가 탐색하고 이해하기 쉬우면, 우리 모두 더 포용적인 온라인 경험의 혜택을 누릴 수 있다."}, {"en": "Reading and writing systems are different across cultures.", "ko": "읽고 쓰는 방식은 문화마다 다르다."}, {"en": "People from Western cultures read and write from left to right, while those from some Middle Eastern cultures read and write from right to left.", "ko": "서양 문화권 사람들은 왼쪽에서 오른쪽으로 읽고 쓰는 반면, 일부 중동 문화권 사람들은 오른쪽에서 왼쪽으로 읽고 쓴다."}, {"en": "People from some Eastern cultures, like that of Japan, read and write from top to bottom.", "ko": "일본 같은 일부 동양 문화권 사람들은 위에서 아래로 읽고 쓴다."}, {"en": "Some global websites take these differences into consideration and adjust their websites for people in different regions.", "ko": "일부 글로벌 웹 사이트는 이런 차이를 고려해 지역별 사람들에게 맞게 사이트를 조정한다."}, {"en": "In countries where text is read from right to left, the website's search button is on the left and the logo is on the right.", "ko": "글을 오른쪽에서 왼쪽으로 읽는 나라에서는 웹 사이트의 검색 버튼이 왼쪽에, 로고가 오른쪽에 있다."}, {"en": "If you visit the same websites in a different language setting, you will see a different format.", "ko": "같은 웹 사이트라도 다른 언어 설정으로 들어가면 다른 구성을 보게 될 것이다."}]}], "items": [{"id": "g1js4-01", "p": 0, "s": 1, "w": "injured", "h": "injured", "pos": "형", "m": "다친, 부상당한", "form": "", "syn": [["hurt", "다친"], ["wounded", "부상당한"]], "ant": [["healthy", "건강한"]], "trap": [], "dis": [["lazy", "게으른"], ["empty", "비어 있는"]], "other": [], "tip": "injured = hurt = wounded, 동사 injure(다치게 하다)와 구별", "story": "오른팔이 부러져 하기 힘든 일들을 상상해 보는 부분에서 나온 단어"}, {"id": "g1js4-02", "p": 0, "s": 4, "w": "awkward", "h": "awkward", "pos": "형", "m": "불편한, 서툰", "form": "", "syn": [["clumsy", "서투른"], ["uncomfortable", "불편한"]], "ant": [], "trap": [["embarrassing", "민망한", "awkward의 다른 뜻 '(분위기가) 어색한'과 비슷한 말"]], "dis": [["cheerful", "쾌활한"], ["generous", "너그러운"]], "other": [["(분위기가) 어색한", "There was an awkward silence.", "어색한 침묵이 흘렀다."]], "tip": "awkward = clumsy(서툰) / 어색한, 문맥 구별 필수", "story": "왼손으로 마우스를 쓰면 서툴고 시간이 오래 걸리는 상황에서 나온 단어"}, {"id": "g1js4-03", "p": 0, "s": 5, "w": "minor", "h": "minor", "pos": "형", "m": "사소한, 작은", "form": "", "syn": [["small", "작은"], ["slight", "약간의"]], "ant": [["major", "주요한"], ["serious", "심각한"]], "trap": [], "dis": [["ancient", "고대의"]], "other function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
