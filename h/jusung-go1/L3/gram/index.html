<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e98a00"><title>교과서 3과 문법 분석</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--sub:#5b677a;--line:#d9e0ec;--pri:#1d4ed8;--off:#e9eef8;--note:#fffbe6;--noteL:#d9c76a;--noteT:#8a6d00;--noteLn:#efe6b3;
 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8}
@media(prefers-color-scheme:dark){:root{--bg:#0e131c;--card:#161d2a;--ink:#e8edf6;--sub:#9aa7bd;--line:#2a3548;--pri:#8ab4ff;--off:#222c3d;--note:#33290a;--noteL:#6b5a1a;--noteT:#f1dc8a;--noteLn:#4a3d12;
 --gd:#4ade80;--gl:#16361f;--bd:#8ab4ff;--bl:#1a2a4a;--kd:#f472b6;--kl:#401a30;--od:#fb923c;--ol:#43270f}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 56px}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.top a{color:var(--pri);text-decoration:none;font-weight:800;font-size:14px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
.top h1{font-size:19px;margin:0}
.c-g{--d:var(--gd);--l:var(--gl)}.c-b{--d:var(--bd);--l:var(--bl)}.c-k{--d:var(--kd);--l:var(--kl)}.c-o{--d:var(--od);--l:var(--ol)}
.psel{display:flex;gap:6px;margin:0 0 10px}
.psel button{flex:1;padding:8px 0;border-radius:10px;font:700 14px inherit;font-family:inherit;background:var(--card);color:var(--sub);border:1.5px solid var(--line);cursor:pointer}
.psel button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:800}
@media(prefers-color-scheme:dark){.psel button.on{color:#0b1220}}
h2{font-size:19px;margin:6px 2px 2px}.sub{font-size:13px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}
.no{font-size:12px;font-weight:800;color:var(--pri);margin-bottom:4px}
.drb{display:flex;gap:6px;margin:0 0 10px}
.drb button{flex:1;padding:8px 0;border-radius:10px;border:1.5px solid var(--d);background:var(--l);color:var(--ink);font:800 13px inherit;font-family:inherit;cursor:pointer}
.drb button.on{background:var(--d);color:#fff}
@media(prefers-color-scheme:dark){.drb button.on{color:#0b1220}}
.ps{font-size:16px;line-height:2;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:4px;margin-top:4px}.ps:first-of-type{border-top:0;margin-top:0}
.ps i{font-style:normal;font-size:12px;font-weight:800;color:var(--pri);flex:none;width:20px;padding-top:1px}
.hlk{background:var(--l);border-bottom:2px solid var(--d);border-radius:3px;padding:0 2px;cursor:pointer}
.hl{background:var(--l);border-bottom:2px solid var(--d);border-radius:3px;padding:0 2px}
.it{background:var(--l);border:1.5px solid var(--d);border-radius:14px;padding:12px 14px 13px;margin-bottom:10px}
.it h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;line-height:1.35}
.it h4 .tl{flex:1}
.tag{font-size:11.5px;color:#fff;background:var(--d);border-radius:99px;padding:2px 9px;flex:none;font-weight:800}
@media(prefers-color-scheme:dark){.tag{color:#0b1220}}
.quote{background:var(--card);border-radius:10px;padding:7px 10px;margin:0 0 8px;font-size:14.5px;line-height:1.7}
.quote .qk{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.it p{margin:7px 0 0;font-size:14px;line-height:1.65;color:var(--ink)}
.note{background:var(--note);border:1.5px dashed var(--noteL);border-radius:10px;padding:7px 11px;background-image:repeating-linear-gradient(transparent,transparent 25px,var(--noteLn) 25px,var(--noteLn) 26px)}
.note .nl{font-size:11.5px;font-weight:800;color:var(--noteT);margin-bottom:2px}.note .ln{font-size:14px;font-weight:700;line-height:26px;color:var(--ink)}
.bkb{margin-top:8px;border:1.5px solid var(--d);background:var(--card);color:var(--d);border-radius:999px;padding:6px 14px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.rf{font-size:11.5px;font-weight:800;color:var(--d);margin:0 2px 0 1px;vertical-align:baseline;position:relative;top:-.5em;line-height:0}
.flash{animation:fl 1.4s ease}@keyframes fl{0%,60%{box-shadow:0 0 0 4px #f5c84288}100%{box-shadow:none}}
.back{border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:8px 16px;font:700 13.5px inherit;font-family:inherit;margin-bottom:8px;cursor:pointer}
.rv{margin-top:8px;cursor:pointer}
.rv .q{border-left:4px solid var(--d);padding:5px 9px;font-size:14.5px;position:relative;padding-right:26px}
.rv .q:after{content:"▾";position:absolute;right:9px;top:5px;color:var(--d)}.rv.open .q:after{content:"▴"}
.rv .a{display:none;margin-top:5px;border:1.5px solid var(--d);background:var(--l);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.6}.rv.open .a{display:block}
.rv .a .at{font-weight:800;color:var(--d);margin-bottom:4px}
.rv .a .ex{font-size:13px;color:var(--sub);margin-top:6px}
.lab{font-size:13px;font-weight:800;margin:2px 2px 6px;color:var(--sub)}
</style></head><body><div class="wrap" id="app"></div>
<script>
var D={"secs": [{"no": 1, "id": "z1", "sents": [{"n": 1, "mk": "During World War II, [1|there was a group of people] [2|who] [4|risked] everything [3|to protect] priceless works of art from ruin.", "en": "During World War II, there was a group of people who risked everything to protect priceless works of art from ruin.", "ko": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다."}, {"n": 2, "mk": "In 1943, around 345 people from 14 different Allied nations came together [3|to form] [5|the Monuments, Fine Arts, and Archives] (MFAA) program.", "en": "In 1943, around 345 people from 14 different Allied nations came together to form the Monuments, Fine Arts, and Archives (MFAA) program.", "ko": "1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다."}, {"n": 3, "mk": "[6|They] were [7|not] trained soldiers [7|but] scholars and experts of various kinds, [8|such as] professors, historians, and architects.", "en": "They were not trained soldiers but scholars and experts of various kinds, such as professors, historians, and architects.", "ko": "그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다."}, {"n": 4, "mk": "These brave men and women [9|volunteered to protect] Europe’s cultural heritage and [10|became known as] the “Monuments Men.”", "en": "These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”", "ko": "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다."}], "items": [{"t": "there was a group of people : ~가 있었다 (유도부사 there)", "c": "k", "x": "there was a group of people에서 there는 ‘거기’라는 뜻이 아니라 ‘~가 있다’는 문장을 이끄는 유도부사이다. 진짜 주어는 동사 뒤의 a group of people이다. 주어가 단수(a group)이므로 동사도 was가 쓰였다.", "n": ["There + be동사 + 주어 = ~가 있다", "be동사는 뒤에 오는 주어에 수를 일치"], "q": "there was a group of people에서 진짜 주어는 무엇인가?", "a": "동사 뒤의 a group of people (그래서 단수 was)", "p": "there was a group of people"}, {"t": "주격 관계대명사 who : ~하는 (사람)", "c": "k", "x": "who risked everything ...은 앞의 people(사람들)을 꾸며 주는 관계대명사절이다. who는 관계절 안에서 risked의 주어 역할을 하는 주격 관계대명사이다. ‘모든 것을 건 사람들’로 해석한다.", "n": ["선행사(사람) + who + 동사 = ~하는 (사람)", "who는 관계절 안에서 주어 역할"], "q": "who risked everything에서 who가 꾸며 주는 말은 무엇이고, 관계절에서 하는 역할은?", "a": "people (사람들) / risked의 주어", "p": "who"}, {"t": "to부정사의 부사적 용법(목적) : ~하기 위해", "c": "k", "x": "risked everything to protect ...의 to protect는 ‘지키기 위해’라는 목적을 나타낸다. came together to form ...의 to form도 ‘만들기 위해(결성하기 위해)’라는 같은 쓰임이다. 둘 다 앞의 동작을 한 목적을 뒤에서 설명한다.", "n": ["to + 동사원형 (부사적 용법) = ~하기 위해 (목적)", "동작 뒤에 붙어 그 동작의 목적을 말함"], "q": "came together to form의 to form은 어떤 뜻인가?", "a": "~을 만들기 위해 (목적)", "p": "to protect"}, {"t": "risk : ~을 내걸다, 위태롭게 하다", "c": "g", "x": "risked everything은 ‘모든 것을 걸었다’는 뜻이다. risk(~을 내걸다)의 과거형이 risked이다. 사람들이 예술품을 지키기 위해 모든 것을 위험에 내놓았다는 의미이다.", "n": ["risk (v.) = ~을 내걸다, 위태롭게 하다 (n. 위험)", "risked = risk의 과거형"], "q": "risked는 어떤 동사의 과거형이고 뜻은?", "a": "risk의 과거형, ~을 내걸었다(위태롭게 했다)", "p": "risked"}, {"t": "A, B, and C : 세 개를 나열하는 병렬 연결", "c": "b", "x": "the Monuments, Fine Arts, and Archives는 세 개의 이름을 쉼표와 and로 이어 놓은 병렬 구조이다. 마지막 항목 앞에만 and를 쓰고 앞의 것들은 쉼표로 이어 준다. 같은 성격의 말(여기서는 명사)이 나란히 놓인다.", "n": ["A, B, and C = A와 B 그리고 C", "병렬되는 말은 같은 형태로 맞춤"], "q": "the Monuments, Fine Arts, and Archives에서 and는 무엇을 이어 주는가?", "a": "Monuments, Fine Arts, Archives 세 개의 명사", "p": "the Monuments, Fine Arts, and Archives"}, {"t": "They = MFAA 프로그램에 모인 약 345명의 사람들", "c": "o", "x": "They were not trained soldiers ...의 They는 바로 앞 문장의 around 345 people from 14 different Allied nations를 가리킨다. 즉 MFAA 프로그램을 만들기 위해 모인 사람들이다.", "n": ["They = around 345 people (MFAA 프로그램 구성원)", "대명사는 앞 문장에서 가리키는 대상 찾기"], "q": "They는 누구를 가리키는가?", "a": "14개 연합국에서 온 약 345명의 사람들", "p": "They"}, {"t": "not A but B : A가 아니라 B", "c": "k", "x": "They were not trained soldiers but scholars and experts에서 not A but B는 ‘A가 아니라 B’라는 뜻이다. A는 trained soldiers(훈련받은 군인), B는 scholars and experts(학자와 전문가)이다. 부정하는 것과 강조하는 것을 대비해 말할 때 쓴다.", "n": ["not A but B = A가 아니라 B", "A와 B는 같은 문법 형태로 맞춤"], "q": "not trained soldiers but scholars and experts를 해석하면?", "a": "훈련받은 군인이 아니라 학자와 전문가", "p": "not"}, {"t": "such as ~ : ~와 같은 (예시)", "c": "b", "x": "such as professors, historians, and architects는 앞의 ‘다양한 분야의 학자와 전문가’의 예를 든다. such as는 두 단어가 하나의 전치사처럼 쓰여 뒤에 명사를 이끈다. 뒤에는 professors, historians, architects가 and로 병렬되어 있다.", "n": ["such as + 명사(들) = ~와 같은 (예시)", "예시가 여러 개면 A, B, and C로 병렬"], "q": "such as 뒤에는 무엇이 오고 어떤 뜻인가?", "a": "명사(들)가 오며 ‘~와 같은’이라는 예시를 든다", "p": "such as"}, {"t": "volunteer to + 동사원형 : ~하겠다고 자원하다", "c": "g", "x": "volunteered to protect는 ‘보호하겠다고 자원했다’는 뜻이다. volunteer 뒤에는 to부정사가 와서 자원한 내용을 말한다. 본문의 volunteered는 volunteer의 과거형이다.", "n": ["volunteer + to부정사 = ~하겠다고 자원하다", "volunteered = volunteer의 과거형"], "q": "volunteered to protect를 해석하면?", "a": "보호하겠다고 자원했다", "p": "volunteered to protect"}, {"t": "become known as ~ : ~으로 알려지게 되다", "c": "g", "x": "became known as the “Monuments Men.”은 ‘모뉴먼츠 맨으로 알려지게 되었다’는 뜻이다. became은 become의 과거형이고, known은 know의 과거분사이다. as 뒤에 알려진 이름이 온다.", "n": ["known as ~ = ~으로 알려진", "became known as ~ = ~으로 알려지게 되었다"], "q": "became known as는 어떤 뜻이고, known은 어떤 동사의 형태인가?", "a": "~으로 알려지게 되었다 / know의 과거분사", "p": "became known as"}]}, {"no": 2, "id": "z2", "sents": [{"n": 5, "mk": "[1|When the MFAA was first formed], its main goal was [2|to prevent] the [3|destruction] of cultural landmarks.", "en": "When the MFAA was first formed, its main goal was to prevent the destruction of cultural landmarks.", "ko": "MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다."}, {"n": 6, "mk": "The Monuments Men [4|persuaded the Allied forces not to bomb] areas with museums, churches, or other culturally significant buildings.", "en": "The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings.", "ko": "모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다."}, {"n": 7, "mk": "They also visited [5|areas that had already been destroyed] [6|to restore damaged architecture and works of art].", "en": "They also visited areas that had already been destroyed to restore damaged architecture and works of art.", "ko": "그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다."}, {"n": 8, "mk": "[7|It wasn’t long before] [8|their] role expanded.", "en": "It wasn’t long before their role expanded.", "ko": "머지않아 그들의 역할은 확대되었다."}, {"n": 9, "mk": "During the war, the Nazis [9|had been stealing] works of art and other cultural treasures from countries across Europe.", "en": "During the war, the Nazis had been stealing works of art and other cultural treasures from countries across Europe.", "ko": "전쟁 중에, 나치는 유럽 전역의 나라들로부터 예술 작품들과 기타 문화재들을 훔치고 있었다."}, {"n": 10, "mk": "[11|They] hid these treasures in places like castles, [10|mines], and [10|caves].", "en": "They hid these treasures in places like castles, mines, and caves.", "ko": "그들은 이러한 보물들을 성, 광산, 동굴 같은 곳에 숨겼다."}, {"n": 11, "mk": "When the Monuments Men learned about this, they started looking for the [12|stolen] treasures.", "en": "When the Monuments Men learned about this, they started looking for the stolen treasures.", "ko": "모뉴먼츠 맨이 이에 대해 알게 되었을 때, 그들은 도난당한 보물들을 찾기 시작했다."}, {"n": 12, "mk": "Their search [13|has since been called] “the greatest treasure hunt in history.”", "en": "Their search has since been called “the greatest treasure hunt in history.”", "ko": "그 후 그들의 수색은 '역사상 가장 위대한 보물찾기'라고 불려 왔다."}, {"n": 13, "mk": "When Germany began to lose the war, the stolen objects [14|came under threat].", "en": "When Germany began to lose the war, the stolen objects came under threat.", "ko": "독일이 전쟁에서 패하기 시작했을 때, 도난당한 물건들은 위협을 받았다."}, {"n": 14, "mk": "Hitler [15|ordered his forces to destroy] everything that could be useful to the Allied armies before they retreated from an area.", "en": "Hitler ordered his forces to destroy everything that could be useful to the Allied armies before they retreated from an area.", "ko": "히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다."}, {"n": 15, "mk": "Some Nazi leaders believed that this included [16|not just military and industrial equipment but] everything of value—even the stolen works of art.", "en": "Some Nazi leaders believed that this included not just military and industrial equipment but everything of value—even the stolen works of art.", "ko": "일부 나치 지도자들은 이것이 군사 및 산업 장비뿐만 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품들까지 포함한다고 여겼다."}], "items": [{"c": "b", "t": "접속사 when + 수동태 : ~가 …되었을 때", "x": "When the MFAA was first formed에서 when은 ‘~할 때’를 뜻하는 접속사라서 뒤에 주어와 동사가 있는 절이 온다. was first formed는 be동사 + p.p.의 수동태이다. MFAA가 ‘만들어졌다’는 뜻이라서 형태가 수동이다.", "n": ["when + 주어 + 동사 = ~할 때", "be동사 + p.p. = ~되다 (수동태)"], "q": "When the MFAA was first formed에서 was formed는 어떤 태이고 무슨 뜻인가?", "a": "수동태 — 만들어졌다", "p": "When the MFAA was first formed"}, {"c": "k", "t": "명사적 용법의 to부정사 : ~하는 것 (보어)", "x": "its main goal was to prevent ...에서 to prevent는 be동사 뒤에서 보어 역할을 한다. 이처럼 to + 동사원형이 명사처럼 쓰이면 ‘~하는 것’으로 해석한다. 그래서 ‘주된 목표는 파괴를 막는 것이었다’가 된다.", "n": ["be동사 + to부정사(보어) = ~하는 것이다", "명사적 용법 : 주어 · 목적어 · 보어 역할"], "q": "its main goal was to prevent ...의 to prevent는 어떤 역할이고 어떻게 해석하는가?", "a": "보어 역할의 명사적 용법 — ‘막는 것’", "p": "to prevent the destruction of cultural landmarks"}, {"c": "g", "t": "destruction : 파괴, 파멸", "x": "destruction은 ‘파괴’라는 뜻의 명사이다. 동사 destroy(파괴하다)에서 나온 말이다. the destruction of cultural landmarks는 ‘문화적 랜드마크의 파괴’라는 뜻이다. 앞의 prevent는 ‘막다, 방지하다’라는 뜻의 동사이다.", "n": ["destruction n. 파괴, 파멸", "prevent v. 막다, 방지하다"], "q": "destruction의 뜻은 무엇이고, 어떤 동사에서 나온 말인가?", "a": "파괴, 파멸 / destroy(파괴하다)", "p": "destruction"}, {"c": "k", "t": "persuade + 목적어 + to부정사 : ~가 …하도록 설득하다", "x": "persuaded the Allied forces not to bomb ...에서 the Allied forces가 목적어이고 to bomb가 목적격보어이다. ‘연합군이 폭격하도록 설득했다’가 기본인데, to부정사를 부정할 때는 to 앞에 not을 붙인다. 그래서 not to bomb는 ‘폭격하지 않도록’이라는 뜻이다.", "n": ["persuade + 목적어 + to V = ~가 …하도록 설득하다", "부정 : persuade + 목적어 + not to V = ~가 …하지 않도록 설득하다"], "q": "‘연합군이 폭격하지 않도록 설득했다’는 persuaded the Allied forces ___ bomb로 어떻게 쓰는가?", "a": "not to bomb (not은 to 앞에 둔다)", "p": "persuaded the Allied forces not to bomb"}, {"c": "b", "t": "that + had been p.p. : 이미 ~되어 있던 (주격 관계대명사 + 과거완료 수동태)", "x": "areas that had already been destroyed에서 that은 주격 관계대명사로 선행사 areas를 꾸미며 뒤의 동사 had been destroyed의 주어 역할을 한다. had been destroyed는 had + been + p.p.의 과거완료 수동태이다. 방문한 시점보다 이전에 ‘이미 파괴되어 있었다’는 뜻이다.", "n": ["명사 + that + 동사 = ~하는[~된] 명사 (주격 관계대명사)", "had been p.p. = (그 전에) 이미 ~되었다 (과거완료 수동태)"], "q": "areas that had already been destroyed에서 that이 꾸미는 말은 무엇인가?", "a": "areas (선행사)", "p": "areas that had already been destroyed"}, {"c": "b", "t": "부사적 용법의 to부정사 : ~하기 위해 (목적)", "x": "to restore damaged architecture and works of art는 ‘훼손된 건축물과 예술 작품을 복원하기 위해’라는 뜻이다. 이때 to restore는 방문한 목적을 나타내는 부사적 용법이다. restore는 ‘복원하다, 복구하다’라는 뜻의 동사이고, damaged는 ‘훼손된’이라는 뜻의 분사형 형용사이다.", "n": ["to V = ~하기 위해 (목적, 부사적 용법)", "restore v. 복원하다, 복구하다"], "q": "to restore damaged architecture ...의 to restore는 어떤 의미로 쓰였는가?", "a": "~하기 위해 (목적)", "p": "to restore damaged architecture and works of art"}, {"c": "k", "t": "It is not long before ~ : 머지않아 ~하다", "x": "It wasn’t long before their role expanded는 ‘그들의 역할이 확대되기까지 오래 걸리지 않았다’, 즉 ‘머지않아 역할이 확대되었다’는 뜻이다. before 뒤에는 주어와 동사가 있는 절이 온다. 과거 이야기라서 is 대신 was를 썼다.", "n": ["It is not long before + 주어 + 동사 = 머지않아 ~하다", "It was not long before ~ = 머지않아 ~했다"], "q": "‘머지않아 그들의 역할은 확대되었다’를 It ___ ___ ___ their role expanded로 쓰면?", "a": "wasn’t long before", "p": "It wasn’t long before"}, {"c": "o", "t": "their = 모뉴먼츠 맨(Monuments Men)의", "x": "their role의 their는 앞 문장들에서 계속 나온 the Monuments Men(모뉴먼츠 맨)을 가리킨다. 그래서 their role은 ‘모뉴먼츠 맨의 역할’이다. expanded는 expand(확대되다)의 과거형이며, 여기서는 역할이 ‘넓어졌다’는 뜻이다.", "n": ["their = the Monuments Men", "expand v. 확대되다"], "q": "their role의 their는 누구를 가리키는가?", "a": "모뉴먼츠 맨 (the Monuments Men)", "p": "their"}, {"c": "k", "t": "had been + -ing : (그때까지) 계속 ~하고 있었다 (과거완료 진행형)", "x": "had been stealing은 had + been + -ing의 과거완료 진행형이다. 앞 문장에서 말한 과거 시점(모뉴먼츠 맨의 역할이 확대되던 때) 이전부터 그때까지 ‘계속 훔치고 있었다’는 동작의 진행을 나타낸다. steal은 ‘훔치다’라는 뜻의 동사이고, stealing은 그 -ing형이다.", "n": ["had been + -ing = (그때까지) 계속 ~하고 있었다", "steal v. 훔치다"], "q": "Nazis had been stealing works of art에서 had been stealing은 무슨 시제이고 어떤 뜻인가?", "a": "과거완료 진행형 — 계속 훔치고 있었다", "p": "had been stealing"}, {"c": "g", "t": "mine : 광산 / cave : 동굴", "x": "mines는 mine(광산)의 복수형이고, caves는 cave(동굴)의 복수형이다. castles, mines, and caves는 places like(~ 같은 장소)에 이어지는 세 개의 명사 나열이다. like는 여기서 ‘~ 같은’을 뜻하는 전치사이다.", "n": ["mine n. 광산 (mine은 ‘나의 것’이라는 뜻도 있음)", "cave n. 동굴"], "q": "mines와 caves의 뜻은 무엇이고 원형은 무엇인가?", "a": "광산, 동굴 / mine, cave", "p": "mines"}, {"c": "o", "t": "They = 나치(the Nazis)", "x": "They hid these treasures에서 They는 바로 앞 문장의 주어 the Nazis(나치)를 가리킨다. 나치가 훔친 예술 작품과 문화재를 성, 광산, 동굴에 숨겼다는 내용이다. hid는 hide(숨기다)의 과거형이다.", "n": ["They = the Nazis", "hid = hide(숨기다)의 과거형"], "q": "They hid these treasures의 They는 누구인가?", "a": "나치 (the Nazis)", "p": "They"}, {"c": "b", "t": "stolen : 도난당한 (분사형 형용사)", "x": "the stolen treasures에서 stolen은 steal(훔치다)의 과거분사로, 명사 treasures를 꾸미는 분사형 형용사이다. 보물은 ‘훔쳐지는’ 대상이라서 수동의 뜻인 ‘도난당한’으로 해석한다. 능동의 뜻이 아니라는 점에 주의한다.", "n": ["과거분사 + 명사 = ~된[~당한] 명사 (수동)", "steal – stole – stolen"], "q": "the stolen treasures를 해석하면? stolen의 원형은?", "a": "도난당한 보물들 / steal", "p": "stolen"}, {"c": "b", "t": "has been called : ~라고 불려 왔다 (현재완료 수동태)", "x": "has been called는 have + been + p.p.의 현재완료 수동태이다. ‘(그 후 지금까지) ~라고 불려 왔다’라는 뜻이다. since는 여기서 ‘그 이후로’를 뜻하는 부사이고, has와 been 사이에 들어갔다.", "n": ["have[has] been p.p. = (지금까지) ~되어 왔다", "call A B(A를 B라고 부르다)의 수동태 : A is called B"], "q": "Their search has since been called ...에서 has been called는 어떤 시제와 태인가?", "a": "현재완료 수동태", "p": "has since been called"}, {"c": "g", "t": "under threat : 위험에 빠진, 위협을 받는", "x": "came under threat은 come under threat(위협을 받게 되다)의 과거형이다. came은 come의 과거형이다. 전쟁에서 독일이 지기 시작하자 도난당한 물건들이 위험에 처하게 되었다는 뜻이다.", "n": ["under threat = 위험에 처한[빠진]", "come under threat = 위협을 받게 되다"], "q": "the stolen objects came under threat의 came은 무엇의 과거형이고, 전체 뜻은?", "a": "come의 과거형 / 위협을 받게 되었다", "p": "came under threat"}, {"c": "b", "t": "order + 목적어 + to V : ~에게 …하라고 명령하다 (5형식)", "x": "ordered his forces to destroy ...에서 his forces가 목적어이고 to destroy가 목적격보어이다. ‘그의 군대에게 파괴하라고 명령했다’라는 뜻이다. forces는 force의 복수형으로 ‘군대, 병력’이라는 뜻이다.", "n": ["order + 목적어 + to V = ~에게 …하라고 명령하다", "force n. 군대, 병력 (복수형 forces)"], "q": "ordered his forces to destroy에서 목적어와 목적격보어는 각각 무엇인가?", "a": "목적어 his forces, 목적격보어 to destroy", "p": "ordered his forces to destroy"}, {"c": "k", "t": "not just A but (also) B : A뿐만 아니라 B도", "x": "not just military and industrial equipment but everything of value에서 A는 military and industrial equipment이고 B는 everything of value이다. ‘군사 및 산업 장비뿐만 아니라 가치 있는 모든 것’이라는 뜻이다. 상관접속사 앞뒤에는 문법적으로 대등한 형태가 온다. of value는 ‘가치 있는’이라는 뜻으로 everything을 뒤에서 꾸민다.", "n": ["not just[only] A but (also) B = A뿐만 아니라 B도", "A와 B는 문법적으로 대등한 형태 (병렬)"], "q": "not just A but (also) B에서 강조되는 쪽은 A와 B 중 어느 쪽인가?", "a": "B", "p": "not just military and industrial equipment but everything of value"}]}, {"no": 3, "id": "z3", "sents": [{"n": 16, "mk": "[1|One of the largest collections of stolen items was] [2|hidden] in the salt mines of Altaussee, Austria.", "en": "One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria.", "ko": "도난당한 물품의 가장 큰 더미 중 하나는 오스트리아의 알타우제 소금 광산에 숨겨져 있었다."}, {"n": 17, "mk": "[3|Upon discovering] [4|its] location, some of the Monuments Men rushed to the mines.", "en": "Upon discovering its location, some of the Monuments Men rushed to the mines.", "ko": "그것의 위치를 알아내자마자, 모뉴먼츠 맨 중 일부가 광산으로 급히 움직였다."}, {"n": 18, "mk": "They hoped to [5|recover] everything before it was too late.", "en": "They hoped to recover everything before it was too late.", "ko": "그들은 너무 늦기 전에 모든 것을 되찾기를 희망했다."}, {"n": 19, "mk": "Meanwhile, the Nazi leader who was [6|in charge of] the area tried to destroy everything by setting off large explosives inside the mines.", "en": "Meanwhile, the Nazi leader who was in charge of the area tried to destroy everything by setting off large explosives inside the mines.", "ko": "한편, 그 지역을 담당하던 나치 지도자는 광산 내부에 대형 폭발물을 터뜨려 모든 것을 파괴하려고 했다."}, {"n": 20, "mk": "This [7|could have been disastrous].", "en": "This could have been disastrous.", "ko": "이는 처참할 수 있었다."}, {"n": 21, "mk": "Luckily, some local miners found the explosives in the mines and [8|came up with a plan to protect their livelihood].", "en": "Luckily, some local miners found the explosives in the mines and came up with a plan to protect their livelihood.", "ko": "다행히도, 지역의 일부 광부들이 광산에서 폭발물을 발견했고 자신들의 생계를 보호할 계획을 생각해 냈다."}, {"n": 22, "mk": "They secretly removed the large explosives and put [9|smaller ones] at the entrances.", "en": "They secretly removed the large explosives and put smaller ones at the entrances.", "ko": "그들은 몰래 대형 폭발물을 제거했고 입구에 더 작은 폭발물을 놓았다."}, {"n": 23, "mk": "Once [10|they] went off, the Nazi leader believed that everything was destroyed.", "en": "Once they went off, the Nazi leader believed that everything was destroyed.", "ko": "그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 여겼다."}, {"n": 24, "mk": "However, while the small explosions sealed off the entrances, [11|they left the rest of the mines and the works of art unharmed].", "en": "However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed.", "ko": "그러나 작은 폭발들이 입구를 봉쇄시키긴 했지만, 그것들은 광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다."}, {"n": 25, "mk": "When the Monuments Men arrived and squeezed their way into the mines, they [12|must have been amazed to see] [13|what was inside].", "en": "When the Monuments Men arrived and squeezed their way into the mines, they must have been amazed to see what was inside.", "ko": "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 내부에 있던 것을 보고 놀랐음에 틀림없다."}, {"n": 26, "mk": "There were thousands of priceless objects, including paintings, statues, books, furniture, and more.", "en": "There were thousands of priceless objects, including paintings, statues, books, furniture, and more.", "ko": "그곳에는 그림, 조각상, 책, 가구 등을 포함해 수천 점의 귀중한 물건들이 있었다."}], "items": [{"t": "one of the + 최상급 + 복수명사 : 가장 ~한 …들 중의 하나", "c": "k", "x": "One of the largest collections of stolen items에서 one of the 뒤에 최상급 largest와 복수명사 collections가 왔다. 주어의 중심은 단수인 One이라서 동사도 was이다. collections가 복수라고 were를 쓰면 틀린다.", "n": ["one of the + 최상급 + 복수명사 = 가장 ~한 …들 중의 하나", "주어로 쓰이면 단수 취급 (동사 was / is)"], "q": "One of the largest collections ... ___ hidden에서 was / were 중 무엇이고 왜인가?", "a": "was — 주어가 단수인 One이기 때문이다.", "p": "One of the largest collections of stolen items was"}, {"t": "was hidden : 숨겨져 있었다 (수동태)", "c": "b", "x": "was hidden은 be동사 + 과거분사(p.p.)로 ‘숨겨져 있었다’라는 수동태이다. 물품 더미는 스스로 숨는 것이 아니라 누군가에 의해 숨겨진 것이라서 수동태를 쓴다.", "n": ["be동사 + p.p. = ~되다, ~당하다 (수동태)"], "q": "was hidden의 형태와 뜻은 무엇인가?", "a": "be동사 + p.p.의 수동태 — 숨겨져 있었다", "p": "was hidden in the salt mines of Altaussee, Austria"}, {"t": "Upon + -ing : ~하자마자", "c": "b", "x": "Upon discovering its location에서 Upon은 전치사라서 뒤에 동사원형이 아니라 동명사(discovering)가 온다. ‘Upon + -ing’는 ‘~하자마자’라는 뜻으로, ‘위치를 알아내자마자’로 해석한다.", "n": ["on / upon + -ing = ~하자마자 (전치사 뒤에는 동명사)"], "q": "Upon discovering its location은 어떻게 해석하는가? Upon 뒤에 동명사가 오는 이유는?", "a": "위치를 알아내자마자. Upon이 전치사라서 목적어로 동명사가 온다.", "p": "Upon discovering"}, {"t": "its = 도난당한 물품의 가장 큰 더미 중 하나", "c": "o", "x": "its location의 its는 앞 문장의 주어인 One of the largest collections of stolen items(도난당한 물품의 가장 큰 더미 중 하나)를 가리킨다. 즉 ‘물품 더미가 숨겨진 곳’을 알아냈다는 뜻이다.", "n": ["its = 앞 문장의 collection(물품 더미)", "대명사 → 앞에서 가리키는 대상 찾기"], "q": "its location의 its는 무엇을 가리키는가?", "a": "도난당한 물품의 가장 큰 더미 (the collection of stolen items)", "p": "its"}, {"t": "recover : (잃은 것을) 되찾다", "c": "g", "x": "recover는 ‘(잃은 것을) 되찾다’라는 뜻으로 hoped to recover everything은 ‘모든 것을 되찾기를 희망했다’이다. recover에는 ‘(건강이) 회복되다’라는 뜻도 있다. 이 문장에서는 도난당한 물품이 대상이라서 ‘되찾다’가 알맞다.", "n": ["recover = (잃은 것을) 되찾다 / (건강이) 회복되다"], "q": "They hoped to recover everything에서 recover의 뜻은?", "a": "(잃은 것을) 되찾다", "p": "recover"}, {"t": "in charge of ~ : ~을 맡아서, 담당해서", "c": "g", "x": "was in charge of the area는 ‘그 지역을 담당하고 있었다’라는 뜻이다. in charge of 뒤에는 담당하는 대상이 온다. 앞의 who was in charge of the area가 the Nazi leader를 꾸며 준다.", "n": ["in charge of ~ = ~을 맡아서, 담당해서"], "q": "the Nazi leader who was in charge of the area를 해석하라.", "a": "그 지역을 담당하던 나치 지도자", "p": "in charge of"}, {"t": "could have p.p. : ~할 수 있었다 (하지만 하지 않았다)", "c": "k", "x": "This could have been disastrous는 could + have + p.p.의 형태이다. ‘처참할 수 있었다’라는 뜻으로, 일어날 수도 있었지만 실제로는 일어나지 않은 일을 말한다. 다음 문장에서 광부들이 폭발물을 발견해 막았다는 내용이 이어진다.", "n": ["could have p.p. = ~할 수 있었다 (과거의 가능성)", "could have been + 형용사 = ~일 수 있었다"], "q": "This could have been disastrous를 해석하라.", "a": "이는 처참할 수 있었다.", "p": "could have been disastrous"}, {"t": "come up with ~ : ~을 생각해 내다", "c": "g", "x": "came up with a plan은 ‘계획을 생각해 냈다’라는 뜻이다. came은 come의 과거형이다. found ... and came up with ...처럼 and로 두 개의 과거 동사가 이어져 있다.", "n": ["come up with ~ = ~을 생각해 내다 (과거형: came up with)"], "q": "came up with a plan에서 came은 어떤 동사의 어떤 형태인가?", "a": "동사 come의 과거형", "p": "came up with a plan to protect their livelihood"}, {"t": "smaller ones : 더 작은 것들, 곧 더 작은 폭발물", "c": "b", "x": "put smaller ones에서 ones는 앞에 나온 explosives(폭발물)를 대신하는 부정대명사 one의 복수형이다. 같은 단어를 다시 쓰지 않으려고 ones로 바꿔 쓴 것이라서 ‘더 작은 폭발물’이라는 뜻이다.", "n": ["one(s) = 앞에 나온 (셀 수 있는) 명사를 대신함", "smaller ones = smaller explosives"], "q": "smaller ones에서 ones는 무엇을 대신하는가?", "a": "앞에 나온 explosives(폭발물)", "p": "smaller ones"}, {"t": "they = 더 작은 폭발물들", "c": "o", "x": "Once they went off의 they는 바로 앞 문장에서 입구에 놓은 smaller ones(더 작은 폭발물들)를 가리킨다. 그래서 ‘그것들이 터지자’라고 해석한다. went는 go의 과거형이고, go off는 ‘(폭탄 등이) 터지다’이다. 뒤의 the Nazi leader를 가리키는 말이 아니다.", "n": ["they = smaller explosives", "go off = (폭탄 등이) 터지다"], "q": "Once they went off의 they는 누구(무엇)인가?", "a": "입구에 놓인 더 작은 폭발물들", "p": "they"}, {"t": "leave + 목적어 + 형용사 : ~을 …한 상태로 두다", "c": "b", "x": "left the rest of the mines and the works of art unharmed에서 left는 leave의 과거형이다. leave + 목적어 + 형용사는 ‘~을 …한 상태로 놔두다’라는 5형식 문장이다. unharmed(손상되지 않은)는 과거분사형 형용사로 목적어의 상태를 설명한다.", "n": ["leave + 목적어 + 형용사 = ~을 …한 상태로 놔두다 (5형식)", "unharmed = 손상되지 않은 (과거분사형 형용사)"], "q": "they left the rest of the mines ... unharmed에서 unharmed는 무엇의 상태를 설명하는가?", "a": "목적어인 광산의 나머지 부분과 예술 작품들", "p": "they left the rest of the mines and the works of art unharmed"}, {"t": "must have p.p. : ~했음에 틀림없다", "c": "k", "x": "they must have been amazed to see는 must + have + p.p.로 ‘~했음에 틀림없다’라는 과거에 대한 확신을 나타낸다. amazed는 ‘놀란’이라는 감정 형용사이고, 뒤의 to see는 감정의 원인을 나타내 ‘보고 (놀랐다)’로 해석한다.", "n": ["must have p.p. = ~했음에 틀림없다", "감정 형용사 + to부정사 = ~해서, ~하고 (감정의 원인)"], "q": "must have been amazed to see를 해석하라. to see가 나타내는 의미는?", "a": "놀랐음에 틀림없다 / 보고 놀란 것, 즉 감정의 원인", "p": "must have been amazed to see"}, {"t": "관계대명사 what : ~하는 것", "c": "b", "x": "to see what was inside에서 what은 ‘~하는 것’이라는 뜻의 관계대명사이다. what was inside는 ‘내부에 있던 것’이고, see의 목적어 역할을 한다. what 안에 선행사(the thing)가 이미 들어 있어서 앞에 따로 선행사가 없다.", "n": ["what + 동사 = ~하는 것 (선행사를 포함한 관계대명사)", "what절은 명사절로 목적어 등의 역할"], "q": "what was inside를 해석하라. what 앞에 선행사가 없는 이유는?", "a": "내부에 있던 것. what 안에 선행사(~하는 것)가 포함되어 있기 때문이다.", "p": "what was inside"}]}, {"no": 4, "id": "z4", "sents": [{"n": 27, "mk": "The Monuments Men [1|thought it would take about one year to transport] everything they found to a safe location.", "en": "The Monuments Men thought it would take about one year to transport everything they found to a safe location.", "ko": "모뉴먼츠 맨은 그들이 발견한 모든 것을 안전한 장소로 옮기는 데 대략 1년이 걸릴 것으로 생각했다."}, {"n": 28, "mk": "However, [2|because] control of the area [3|was going to change] at the end of the war, [4|they] would have access to the mines for just two months.", "en": "However, because control of the area was going to change at the end of the war, they would have access to the mines for just two months.", "ko": "그러나 전쟁이 끝날 때 그 지역의 통제권이 바뀔 예정이었기 때문에, 그들은 오직 두 달 동안만 광산에 접근하게 될 것이었다."}, {"n": 29, "mk": "With [5|insufficient] packing supplies and only a few trucks, the transporting mission [6|seemed impossible].", "en": "With insufficient packing supplies and only a few trucks, the transporting mission seemed impossible.", "ko": "불충분한 포장 자재와 오직 몇 대의 트럭으로 수송 임무는 불가능한 것처럼 보였다."}, {"n": 30, "mk": "[7|Not only that, but] food was [8|in short supply].", "en": "Not only that, but food was in short supply.", "ko": "그뿐만 아니라 식량 공급량도 부족했다."}, {"n": 31, "mk": "Even [9|without eating] proper meals, they worked up to twenty hours a day.", "en": "Even without eating proper meals, they worked up to twenty hours a day.", "ko": "제대로 된 식사도 하지 못한 채, 그들은 하루에 20시간까지 일했다."}, {"n": 32, "mk": "They used coats and gas masks as packing materials and did everything they could [10|to accomplish] this vital mission [11|in time].", "en": "They used coats and gas masks as packing materials and did everything they could to accomplish this vital mission in time.", "ko": "그들은 외투와 방독면을 포장 재료로 사용했고 이 중요한 임무를 시간 내에 완수하기 위해 그들이 할 수 있는 모든 것을 했다."}, {"n": 33, "mk": "In the end, the Monuments Men [12|succeeded in rescuing] thousands of stolen works of art, [13|including] important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges.", "en": "In the end, the Monuments Men succeeded in rescuing thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges.", "ko": "마침내, 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 요하네스 페르메이르의 「천문학자」, 그리고 미켈란젤로의 「브뤼헤의 성모」와 같은 중요한 작품들을 포함하여 수천 점의 도난당한 예술 작품을 구출하는 데 성공했다."}], "items": [{"t": "it takes + 시간 + to부정사 : ~하는 데 (시간)이 걸리다", "c": "k", "x": "it would take about one year to transport에서 it은 가주어이고, to transport 이하가 진주어이다. ‘수송하는 데 대략 1년이 걸릴 것이다’라는 뜻이다. thought 뒤에는 접속사 that이 생략되어 있고, everything they found도 everything (that) they found에서 목적격 관계대명사가 생략된 것이다. transport는 ‘수송하다, 옮기다’라는 뜻이다.", "n": ["It takes + 시간 + to부정사 = ~하는 데 (시간)이 걸리다", "thought (that) ~ : 명사절 접속사 that 생략 가능"], "q": "it would take about one year to transport에서 it은 무엇이고, 진주어는 무엇인가?", "a": "it은 가주어, to transport 이하가 진주어이다.", "p": "thought it would take about one year to transport"}, {"t": "접속사 because + 절 : ~ 때문에", "c": "b", "x": "because(~ 때문에)는 접속사라서 뒤에 control of the area was going to change처럼 주어와 동사가 있는 절이 온다. 전쟁이 끝날 때 통제권이 바뀔 예정이었다는 것이 두 달만 접근할 수 있는 이유이다.", "n": ["because + 주어 + 동사 = ~ 때문에", "because of + 명사(구) = ~ 때문에"], "q": "because 뒤에는 어떤 모양이 오는가?", "a": "주어 + 동사가 있는 절", "p": "because"}, {"t": "be going to + 동사원형 : ~할 예정이다", "c": "b", "x": "was going to change는 be going to + 동사원형에 be동사를 과거(was)로 쓴 것이다. ‘바뀔 예정이었다’라는 뜻이다. 주어 control은 단수라서 was를 쓴다.", "n": ["be going to + 동사원형 = ~할 예정이다, ~할 것이다", "was going to + 동사원형 = ~할 예정이었다"], "q": "was going to change는 무슨 뜻인가?", "a": "바뀔 예정이었다", "p": "was going to change"}, {"t": "they = 모뉴먼츠 맨 (The Monuments Men)", "c": "o", "x": "they would have access에서 they는 앞 문장의 주어인 The Monuments Men을 가리킨다. 광산에 두 달 동안만 접근할 수 있었던 사람들은 모뉴먼츠 맨이다.", "n": ["they = The Monuments Men", "대명사 → 앞에서 누구(무엇)인지 찾기"], "q": "they would have access to the mines의 they는 누구인가?", "a": "모뉴먼츠 맨", "p": "they"}, {"t": "insufficient : 불충분한", "c": "g", "x": "insufficient는 ‘불충분한’이라는 뜻의 형용사이다. in-이 붙어 sufficient(충분한)의 반대 뜻이 된다. insufficient packing supplies는 ‘불충분한 포장 자재’라는 뜻이다.", "n": ["insufficient a. = 불충분한"], "q": "insufficient packing supplies는 무슨 뜻인가?", "a": "불충분한 포장 자재", "p": "insufficient"}, {"t": "seem + 형용사 : ~처럼 보이다", "c": "k", "x": "seemed impossible은 seem + 형용사 구조이며, seemed는 seem의 과거형이다. 주어 the transporting mission이 ‘불가능한 것처럼 보였다’라는 뜻이다. seem 뒤에는 부사가 아니라 형용사 보어가 온다.", "n": ["seem + 형용사 = ~처럼 보이다", "seem 뒤 보어 자리에는 형용사"], "q": "the transporting mission seemed impossible은 어떻게 해석하는가?", "a": "수송 임무는 불가능한 것처럼 보였다.", "p": "seemed impossible"}, {"t": "not only A but (also) B : A뿐만 아니라 B도", "c": "k", "x": "Not only that, but food was in short supply에서 A는 that(앞에서 말한 어려움들)이고, B는 food was in short supply(식량 공급이 부족했다)이다. but 뒤의 also는 생략되어 있다. ‘그뿐만 아니라 식량도 부족했다’라는 뜻이다.", "n": ["not only A but (also) B = A뿐만 아니라 B도"], "q": "Not only that, but food was in short supply는 어떻게 해석하는가?", "a": "그뿐만 아니라 식량 공급도 부족했다.", "p": "Not only that, but"}, {"t": "in short supply : 공급이 부족한", "c": "g", "x": "in short supply는 ‘공급이 부족한’이라는 뜻의 숙어이다. supply는 ‘공급(량)’이라는 뜻의 명사이다. food was in short supply는 ‘식량이 부족했다’라는 뜻이다.", "n": ["in short supply = 공급이 부족한"], "q": "food was in short supply는 무슨 뜻인가?", "a": "식량 공급이 부족했다.", "p": "in short supply"}, {"t": "without + -ing : ~하지 않고, ~ 없이", "c": "b", "x": "without은 전치사라서 뒤에 동사를 바로 쓸 수 없고 명사나 동명사가 온다. without eating proper meals는 ‘제대로 된 식사를 하지 않고’라는 뜻이다.", "n": ["전치사 + 동명사(-ing) = 전치사의 목적어", "without -ing = ~하지 않고, ~ 없이"], "q": "without 뒤에 eating처럼 -ing가 온 이유는?", "a": "without이 전치사라서 목적어로 동명사가 온다.", "p": "without eating"}, {"t": "to부정사의 부사적 용법(목적) : ~하기 위해", "c": "k", "x": "to accomplish this vital mission은 ‘이 중요한 임무를 완수하기 위해’라는 뜻이다. 앞의 did everything they could가 어떤 목적이었는지 알려 주는 부사적 용법의 to부정사이다. accomplish는 ‘완수하다, 성취하다’라는 뜻의 동사이다.", "n": ["부사적 용법의 to부정사 = ~하기 위해 (목적)", "accomplish v. = 완수하다, 성취하다"], "q": "to accomplish this vital mission은 어떤 용법이고 뜻은?", "a": "부사적 용법(목적), 이 중요한 임무를 완수하기 위해", "p": "to accomplish"}, {"t": "in time : 시간 맞춰, 늦지 않게", "c": "g", "x": "in time은 ‘시간 맞춰, 늦지 않게’라는 뜻의 숙어이다. 정해진 때에 늦지 않게 맞춘다는 뜻이다. 여기서는 두 달이라는 기한에 늦지 않게 임무를 끝내려 했다는 의미이다.", "n": ["in time = 시간 맞춰, 늦지 않게"], "q": "to accomplish this vital mission in time에서 in time의 뜻은?", "a": "시간 맞춰, 늦지 않게", "p": "in time"}, {"t": "succeed in -ing : ~하는 데 성공하다", "c": "k", "x": "succeed in은 ‘~에 성공하다’라는 뜻이다. in은 전치사라서 뒤에 동명사 rescuing이 온다. succeeded는 succeed의 과거형이다. succeeded in rescuing은 ‘구출하는 데 성공했다’라는 뜻이다.", "n": ["succeed in + 명사(동명사) = ~에 성공하다", "전치사 in 뒤에는 동명사"], "q": "succeed in 뒤에 rescuing이 온 이유는?", "a": "in이 전치사라서 목적어로 동명사가 온다.", "p": "succeeded in rescuing"}, {"t": "including ~ : ~을 포함하여", "c": "b", "x": "including은 ‘~을 포함하여’라는 뜻으로 쓰이는 분사 형태의 표현이다. 뒤에 important pieces ... 같은 명사구가 와서 전치사처럼 쓰인다. 이 문장에서는 수천 점의 작품에 중요한 작품들이 포함된다는 뜻이다.", "n": ["including ~ = ~을 포함하여", "according to ~, based on ~ 처럼 분사 형태가 전치사처럼 쓰이는 표현이 있음"], "q": "including important pieces는 어떻게 해석하는가?", "a": "중요한 작품들을 포함하여", "p": "including"}]}, {"no": 5, "id": "z5", "sents": [{"n": 34, "mk": "The efforts of the Monuments Men did not end with the war.", "en": "The efforts of the Monuments Men did not end with the war.", "ko": "모뉴먼츠 맨의 노력은 전쟁과 함께 끝나지 않았다."}, {"n": 35, "mk": "For several years, [1|they] continued the work of [2|recovering cultural treasures and identifying] [3|where they] [4|had been stolen] from.", "en": "For several years, they continued the work of recovering cultural treasures and identifying where they had been stolen from.", "ko": "여러 해 동안, 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 식별하는 작업을 이어갔다."}, {"n": 36, "mk": "In the end, the Monuments Men returned more than five million works of art and objects of cultural importance to their places of origin.", "en": "In the end, the Monuments Men returned more than five million works of art and objects of cultural importance to their places of origin.", "ko": "마침내, 모뉴먼츠 맨은 5백만 점이 넘는 예술 작품과 문화적으로 중요한 물건들을 그것들의 원래 장소들로 돌려보냈다."}, {"n": 37, "mk": "[5|Not everything] that was stolen by the Nazis has been found, but [6|what the Monuments Men accomplished] is truly amazing.", "en": "Not everything that was stolen by the Nazis has been found, but what the Monuments Men accomplished is truly amazing.", "ko": "나치에 의해 도난당한 모든 것이 발견되지는 않았지만, 모뉴먼츠 맨이 이룬 것은 정말로 놀랍다."}, {"n": 38, "mk": "[7|Without] this [8|determined] group, the search for stolen works of art [7|might never have begun].", "en": "Without this determined group, the search for stolen works of art might never have begun.", "ko": "이 결연한 집단이 없었다면, 도난당한 예술 작품들의 수색은 시작되지 않았을지도 모른다."}, {"n": 39, "mk": "In addition, countless historical and cultural landmarks [9|would have been lost] forever [10|due to] the destruction of war.", "en": "In addition, countless historical and cultural landmarks would have been lost forever due to the destruction of war.", "ko": "또한, 수많은 역사적, 문화적 랜드마크가 전쟁의 파괴로 인해 영원히 사라져 버렸을 것이다."}, {"n": 40, "mk": "[11|It is worth remembering] the Monuments Men’s contribution to the preservation of cultural heritage.", "en": "It is worth remembering the Monuments Men’s contribution to the preservation of cultural heritage.", "ko": "문화유산 보존에 대한 모뉴먼츠 맨의 기여는 기억할 가치가 있다."}, {"n": 41, "mk": "[12|Thanks to] their efforts, many incredible cultural sites and works of art have survived and [13|can still be appreciated] to this day.", "en": "Thanks to their efforts, many incredible cultural sites and works of art have survived and can still be appreciated to this day.", "ko": "그들의 노력 덕분에, 많은 놀라운 문화 유적지들과 예술 작품들이 살아남아 오늘날까지도 여전히 감상될 수 있다."}], "items": [{"t": "they = 모뉴먼츠 맨 (Monuments Men)", "c": "o", "x": "they continued the work에서 they는 바로 앞 문장의 the Monuments Men(모뉴먼츠 맨)을 가리킨다. 전쟁이 끝난 뒤에도 일을 이어간 사람들이 모뉴먼츠 맨이라는 뜻이다. 뒤의 where they had been stolen의 they는 이와 달리 cultural treasures(문화재)를 가리킨다.", "n": ["they = the Monuments Men", "대명사 → 앞 문장에서 누구인지 찾기"], "q": "continued the work의 they는 누구인가?", "a": "모뉴먼츠 맨 (the Monuments Men)", "p": "they"}, {"t": "recovering ~ and identifying ~ : ~을 되찾고 ~을 식별하는 것", "c": "b", "x": "전치사 of 뒤에는 동명사가 와서 목적어 역할을 한다. recovering cultural treasures(문화재를 되찾는 것)와 identifying(식별하는 것)이 and로 연결되어 둘 다 of의 목적어이다. 병렬된 두 동명사는 같은 형태로 맞춘다.", "n": ["전치사 + 동명사(~ing) = ~하는 것", "A-ing and B-ing : 같은 형태끼리 병렬"], "q": "of 뒤의 recovering과 identifying은 and로 어떻게 연결되어 있는가?", "a": "둘 다 전치사 of의 목적어인 동명사로 병렬되어 있다.", "p": "recovering cultural treasures and identifying"}, {"t": "where + 주어 + 동사 : 어디서 ~하는지 (간접의문문)", "c": "k", "x": "간접의문문은 의문사 뒤가 ‘주어 + 동사’ 순서가 된다. where they had been stolen from은 identifying의 목적어로, ‘그것들(문화재)이 어디에서 도난당했는지’라는 뜻이다. from은 where와 짝을 이루어 ‘어디에서’를 나타낸다. 의문문 어순(where had they ...)으로 쓰지 않는다.", "n": ["의문사 + 주어 + 동사 = 어디서(무엇을) ~하는지", "간접의문문은 평서문 어순"], "q": "간접의문문에서 의문사 뒤의 어순은?", "a": "주어 + 동사 (평서문 어순)", "p": "where they"}, {"t": "had been stolen : 도난당했었다 (과거완료 수동태)", "c": "k", "x": "had been stolen은 had + been + p.p.의 과거완료 수동태이다. 작업을 이어간 때(과거)보다 더 먼저 도난당한 일이므로 과거완료를 쓴다. 보물은 훔쳐진 대상이라서 수동태이다. steal(훔치다)의 p.p.는 stolen이다.", "n": ["had + been + p.p. = (과거보다 앞서) ~되었었다", "steal – stole – stolen"], "q": "had been stolen에서 과거완료와 수동태를 만드는 부분은 각각 어디인가?", "a": "과거완료는 had, 수동태는 been + stolen(p.p.)", "p": "had been stolen"}, {"t": "Not everything ~ : 모든 것이 ~인 것은 아니다 (부분부정)", "c": "k", "x": "Not everything that was stolen ... has been found은 ‘모든 것이 ~인 것은 아니다’라는 부분부정이다. 훔쳐 간 것 중 일부는 아직 발견되지 않았다는 뜻이다. 전체를 부정하려면 Nothing ... 처럼 쓴다.", "n": ["not + all/every/everything = 모두 ~인 것은 아니다", "none / nothing = 전부 부정"], "q": "Not everything has been found의 뜻은?", "a": "모든 것이 발견된 것은 아니다 (일부는 발견됨)", "p": "Not everything"}, {"t": "관계대명사 what : ~하는 것", "c": "k", "x": "관계대명사 what은 ‘~하는 것’이라는 뜻으로 선행사를 포함한다. what the Monuments Men accomplished는 ‘모뉴먼츠 맨이 이룬 것’이라는 명사절이고, 문장 전체의 주어 역할을 한다. what 뒤에는 accomplished의 목적어가 빠진 불완전한 절이 온다.", "n": ["what = the thing(s) that = ~하는 것", "what절은 명사절(주어·목적어·보어)"], "q": "what the Monuments Men accomplished는 무슨 뜻이고 문장에서 무슨 역할인가?", "a": "모뉴먼츠 맨이 이룬 것 / 주어(명사절)", "p": "what the Monuments Men accomplished"}, {"t": "Without ~ : ~이 없었다면 (가정법 과거완료)", "c": "k", "x": "Without this determined group은 ‘이 집단이 없었다면’이라는 뜻으로 If it had not been for와 바꿔 쓸 수 있다. 과거 사실의 반대를 가정하므로 주절은 조동사 과거형 + have + p.p.이다. might never have begun은 ‘시작되지 않았을지도 모른다’라는 뜻이다.", "n": ["If it had not been for ~ = Without ~ = But for ~", "가정법 과거완료 : 주어 + 조동사 과거형 + have p.p."], "q": "Without this determined group은 어떤 If절로 바꿔 쓸 수 있는가?", "a": "If it had not been for this determined group", "p": "Without"}, {"t": "determined : 단단히 결심한, 결연한", "c": "g", "x": "determined는 동사 determine(결심하다)에서 나온 분사형 형용사로, ‘단단히 결심한, 결연한’이라는 뜻이다. this determined group은 ‘결연한 집단’, 즉 끝까지 해내려는 의지를 가진 모뉴먼츠 맨을 가리킨다.", "n": ["determined a. 결연한, 단호한", "determine v. 결심하다"], "q": "this determined group에서 determined의 뜻은?", "a": "결연한, 단호한 (단단히 결심한)", "p": "determined"}, {"t": "would have been lost : 사라졌을 것이다 (가정법 과거완료 수동태)", "c": "k", "x": "would have been lost는 조동사 과거형 + have been + p.p.의 가정법 과거완료 수동태이다. 앞 문장의 Without this determined gro  {"n": 43, "mk": "[3|Most of] these languages are spoken by very small groups of people, and half of them could disappear within the next generation.", "en": "Most of these languages are spoken by very small groups of people, and half of them could disappear within the next generation.", "ko": "이러한 언어들의 대부분은 매우 소규모 집단의 사람들에 의해 사용되며, 그중 절반은 다음 세대 이내에 사라질 수도 있다."}, {"n": 44, "mk": "This would be a great loss [4|because] language [5|plays a big role in] connecting people’s identity to their culture.", "en": "This would be a great loss because language plays a big role in connecting people’s identity to their culture.", "ko": "이는 큰 손실이 될 텐데 언어가 사람들의 정체성을 그들의 문화와 연결하는 데 큰 역할을 하기 때문이다."}, {"n": 45, "mk": "[6|This is why] some organizations work to preserve [7|them].", "en": "This is why some organizations work to preserve them.", "ko": "이것이 일부 단체가 언어를 보존하기 위해 일하는 이유이다."}, {"n": 46, "mk": "For example, a nonprofit organization [8|called Wikitongues] has set the goal of preserving all languages that are [9|in danger of being lost].", "en": "For example, a nonprofit organization called Wikitongues has set the goal of preserving all languages that are in danger of being lost.", "ko": "예를 들어, Wikitongues라는 비영리 단체는 소멸될 위험에 처한 모든 언어들을 보존한다는 목표를 세웠다."}, {"n": 47, "mk": "The organization works to achieve this by recording videos of individuals speaking these languages and [10|making mother-tongue resources more accessible].", "en": "The organization works to achieve this by recording videos of individuals speaking these languages and making mother-tongue resources more accessible.", "ko": "그 단체는 이 언어들을 사용하는 개인들의 영상을 기록하고 모국어 자원을 더 접근 가능하게 함으로써 이를 달성하기 위해 노력한다."}], "items": [{"t": "there are + 복수명사 : ~이 있다 (유도부사 구문)", "c": "k", "x": "Did you know that there are over 7,000 languages ...?에서 there are는 ‘~이 있다’라는 뜻이고, 실제 주어는 뒤의 over 7,000 languages이다. there는 ‘거기에’로 해석하지 않는다. that은 know의 목적어가 되는 명사절을 이끄는 접속사이다.", "n": ["There + be동사 + 주어 = ~이 있다", "be동사는 뒤의 주어에 수를 일치시킨다"], "q": "there a function marks(mk,s,mode,only,sn){
