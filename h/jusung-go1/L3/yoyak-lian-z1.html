<script>
var DATA={"meta": {"sch": "jusung-go1", "src": "jusung-go1/L3/sx-data.js", "pidx": 0, "lesson": "3과", "title": "문화유산을 지킨 모뉴먼츠 맨", "label": "❶", "page": "yoyak-lian-z1"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "세계대전 중, 14개 [[nations|국가]] 사람들이 모여 귀중한 예술 작품을 [[protect|지키기]] 위한 프로그램을 만들었다.", "en": ["During World War II, there was a group of people who risked everything to protect priceless works of art from ruin.", "In 1943, around 345 people from 14 different Allied nations came together to form the Monuments, Fine Arts, and Archives (MFAA) program."], "kos": ["제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다.", "1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다."]}, {"tag": "본문 3~4번", "ns": [3, 4], "line": "군인이 아닌 교수·건축가 같은 [[experts|전문가]]들이 스스로 [[volunteered|나섰다]]. 이름은 '모뉴먼츠 맨'!", "en": ["They were not trained soldiers but scholars and experts of various kinds, such as professors, historians, and architects.", "These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”"], "kos": ["그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다.", "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다."]}, {"tag": "본문 5~6번", "ns": [5, 6], "line": "목표는 문화재 파괴를 [[prevent|막는]] 것. 그래서 연합군을 [[persuaded|설득해]] 박물관 지역 폭격을 피했다.", "en": ["When the MFAA was first formed, its main goal was to prevent the destruction of cultural landmarks.", "The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings."], "kos": ["MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다.", "모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다."]}, {"tag": "본문 7~8번", "ns": [7, 8], "line": "이미 무너진 곳은 찾아가 [[restore|복원했고]], 머지않아 역할은 [[expanded|커졌다]].", "en": ["They also visited areas that had already been destroyed to restore damaged architecture and works of art.", "It wasn’t long before their role expanded."], "kos": ["그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다.", "머지않아 그들의 역할은 확대되었다."]}], "story": [{"a": "protect", "form": "protect", "n": 1, "sq": 1, "sum": "to [[safeguard]] priceless works of art", "hook": "귀중한 예술 작품을 파괴에서 지키려 했다는 문장의 protect(보호하다) → 요약문에서는 safeguard(지키다)로 바뀌었어요.", "b": "safeguard", "k": "보호하다 → 지키다", "en": "During World War II, there was a group of people who risked everything to protect priceless works of art from ruin.", "ko": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다."}, {"a": "nation", "form": "nations", "n": 2, "sq": 1, "sum": "14 Allied [[countries]]", "hook": "14개 나라에서 사람들이 모였다는 문장의 nations(국가들) → 요약문에서는 countries(나라들)로 바뀌었어요.", "b": "country", "k": "나라 → 국가, 나라", "en": "In 1943, around 345 people from 14 different Allied nations came together to form the Monuments, Fine Arts, and Archives (MFAA) program.", "ko": "1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다."}, {"a": "expert", "form": "experts", "n": 3, "sq": 2, "sum": "but [[specialists]] such as professors", "hook": "군인이 아니라 학자와 전문가였다는 문장의 experts(전문가들) → 요약문에서는 specialists(전문가들)로 바뀌었어요.", "b": "specialist", "k": "전문가 → 전문가", "en": "They were not trained soldiers but scholars and experts of various kinds, such as professors, historians, and architects.", "ko": "그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다."}, {"a": "volunteer", "form": "volunteered", "n": 4, "sq": 2, "sum": "they [[offered]] to protect", "hook": "스스로 나서서 문화유산을 지키겠다고 한 문장의 volunteered(자원했다) → 요약문에서는 offered(나섰다)로 바뀌었어요.", "b": "offer", "k": "자원하다 → 나서다, 제안하다", "en": "These brave men and women volunteered to protect Europe’s cultural heritage and became known as the “Monuments Men.”", "ko": "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다."}, {"a": "prevent", "form": "prevent", "n": 5, "sq": 3, "sum": "was to [[stop]] the destruction", "hook": "처음 목표가 파괴를 막는 것이었다는 문장의 prevent(막다) → 요약문에서는 stop(막다)으로 바뀌었어요.", "b": "stop", "k": "막다 → 막다, 멈추다", "en": "When the MFAA was first formed, its main goal was to prevent the destruction of cultural landmarks.", "ko": "MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다."}, {"a": "persuade", "form": "persuaded", "n": 6, "sq": 3, "sum": "members [[convinced]] the Allied forces", "hook": "연합군에게 폭격하지 말라고 설득한 문장의 persuaded(설득했다) → 요약문에서는 convinced(설득했다)로 바뀌었어요.", "b": "convince", "k": "설득하다 → 납득시키다, 설득하다", "en": "The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings.", "ko": "모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다."}, {"a": "restore", "form": "restore", "n": 7, "sq": 4, "sum": "to [[repair]] damaged buildings", "hook": "부서진 건축물과 작품을 되살렸다는 문장의 restore(복원하다) → 요약문에서는 repair(수리하다)로 바뀌었어요.", "b": "repair", "k": "복원하다 → 수리하다", "en": "They also visited areas that had already been destroyed to restore damaged architecture and works of art.", "ko": "그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다."}, {"a": "expand", "form": "expanded", "n": 8, "sq": 4, "sum": "their role [[grew]]", "hook": "이들의 역할이 더 커졌다는 마지막 문장의 expanded(확대되었다) → 요약문에서는 grew(커졌다)로 바뀌었어요.", "b": "grow", "k": "확대되다 → 커지다", "en": "It wasn’t long before their role expanded.", "ko": "머지않아 그들의 역할은 확대되었다."}], "passage": [{"n": 1, "en": "During World War II, there was a group of people who risked everything to protect priceless works of art from ruin.", "ko": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다."}, {"n": 2, "en": "In 1943, around 345 people from 14 different Allied nations came together to form the Monuments, Fine Arts, and Archives (MFAA) program.", "ko": "1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다."}, {"n": 3, "en": "They were not trained soldiers but scholars and experts of various kinds, such as professors, historians, and architects.", "ko": "그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다."}, {"n": 4, "en": "These brave men and women volunteered to protect   r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
