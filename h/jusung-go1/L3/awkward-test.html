<script>
var Q=[{"id": "ctx1", "kind": "ctx", "n": 1, "title": null, "tko": null, "paras": [[{"t": "During World War II, there was a group of people who "}, {"t": "avoided", "c": 1}, {"t": " everything to protect priceless works of art from ruin. In 1943, around 345 people from 14 different Allied nations came "}, {"t": "together", "c": 2}, {"t": " to form the Monuments, Fine Arts, and Archives (MFAA) program. They were not trained soldiers but scholars and experts of "}, {"t": "various", "c": 3}, {"t": " kinds, such as professors, historians, and architects. These brave men and women "}, {"t": "refused", "c": 4}, {"t": " to protect Europe’s cultural heritage and became known as the “Monuments Men.”"}]], "items": [{"c": 1, "w": "avoided", "r": "risked", "gw": "피했다", "gr": "걸었다", "fb": null, "fg": "During World War II, there was a group of people who <span class=\"d\">risked</span> everything to protect priceless works of art from ruin.", "ko": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다.", "why": "protect priceless works of art (대단히 귀중한 예술 작품을 지키기 위해)라고 했으니 모든 것을 risked (걸었다)가 자연스러워요. avoided (피했다)로 쓰면 모든 것을 피하면서 지킨다는 말이라 앞뒤가 맞지 않아요."}, {"c": 4, "w": "refused", "r": "volunteered", "gw": "거부했다", "gr": "자청했다", "fb": null, "fg": "These brave men and women <span class=\"d\">volunteered</span> to protect Europe’s cultural heritage and became known as the “Monuments Men.”", "ko": "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다.", "why": "These brave men and women (이러한 용감한 남성과 여성)은 문화유산을 보호하는 일에 나선 사람들이에요. 그래서 volunteered (자청했다)가 맞아요. refused (거부했다)는 용감하게 나선 모습과 반대예요."}], "keep": "together (함께)는 14개 나라에서 온 사람들이 함께 모였다는 뜻이라 맞아요. various (다양한)는 교수, 역사학자, 건축가처럼 여러 분야의 전문가라서 맞아요.", "flow": "모뉴먼츠 맨은 파괴로부터 예술 작품을 지키려고 모인 용감한 사람들이라는 글이에요. 지키려는 마음과 반대로 가는 말이 어색한 곳이에요.", "ko": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다. 1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다. 그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다. 이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다."}, {"id": "ctx2", "kind": "ctx", "n": 2, "title": null, "tko": null, "paras": [[{"t": "When the MFAA was first formed, its main goal was to "}, {"t": "accelerate", "c": 1}, {"t": " the destruction of cultural landmarks. The Monuments Men persuaded the Allied forces not to bomb areas with museums, churches, or other culturally significant buildings. They also visited areas that had already been "}, {"t": "destroyed", "c": 2}, {"t": " to restore damaged architecture and works of art."}], [{"t": "It wasn’t long before their role "}, {"t": "declined", "c": 3}, {"t": ". During the war, the Nazis had been stealing works of art and other cultural treasures from countries across Europe. They "}, {"t": "hid", "c": 4}, {"t": " these treasures in places like castles, mines, and caves. When the Monuments Men learned about this, they started looking for the "}, {"t": "stolen", "c": 5}, {"t": " treasures. Their search has since been called “the greatest treasure hunt in history.”"}], [{"t": "When Germany began to lose the war, the stolen objects came under threat. Hitler ordered his forces to destroy everything that could be "}, {"t": "useless", "c": 6}, {"t": " to the Allied armies before they retreated from an area. Some Nazi leaders believed that this included not just military and industrial equipment but everything of value—even the stolen works of art."}]], "items": [{"c": 1, "w": "accelerate", "r": "prevent", "gw": "가속하다", "gr": "막다", "fb": null, "fg": "When the MFAA was first formed, its main goal was to <span class=\"d\">prevent</span> the destruction of cultural landmarks.", "ko": "MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다.", "why": "MFAA의 목표를 말하는 문장이에요. 문화적 랜드마크를 지키려는 모임이라서 destruction (파괴)을 prevent (막다)해야 해요. accelerate (가속하다)는 파괴를 더 빠르게 한다는 뜻이라 맞지 않아요."}, {"c": 3, "w": "declined", "r": "expanded", "gw": "줄어들었다", "gr": "확대되었다", "fb": null, "fg": "It wasn’t long before their role <span class=\"d\">expanded</span>.", "ko": "머지않아 그들의 역할은 확대되었다.", "why": "It wasn’t long before (머지않아 ~했다) 뒤에는 앞에서 시작한 활동이 커졌다는 내용이 이어져요. 지역을 폭격하지 않도록 설득하고 복원하러 다니던 그들의 role (역할)은 expanded (확대되었다)예요. declined (줄어들었다)는 흐름과 어긋나요."}, {"c": 6, "w": "useless", "r": "useful", "gw": "쓸모없는", "gr": "유용한", "fb": null, "fg": "Hitler ordered his forces to destroy everything that could be <span class=\"d\">useful</span> to the Allied armies before they retreated from an area.", "ko": "히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다.", "why": "히틀러는 후퇴하기 전에 연합군에게 '유용할 수 있는' 모든 것을 파괴하라고 명령했어요. 적에게 도움이 될 것을 없애려는 거라서 useful (유용한)이에요. useless (쓸모없는)면 굳이 파괴할 이유가 없어요."}], "keep": "destroyed (파괴된)는 이미 파괴된 지역을 복원하러 갔다는 뜻이라 맞아요. hid (숨겼다)는 나치가 보물을 성, 광산, 동굴에 숨겼다는 뜻이라 맞아요. stolen (도난당한)도 나치가 훔친 보물이라 맞아요.", "flow": "MFAA의 목표, 모뉴먼츠 맨의 활동, 나치의 약탈과 히틀러의 명령이 차례로 나오는 글이에요. 문화유산을 지키려는 쪽과 빼앗고 없애려는 쪽을 구분하면 어색한 곳이 보여요.", "ko": "MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다. 모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다. 그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다. 머지않아 그들의 역할은 확대되었다. 전쟁 중에, 나치는 유럽 전역의 나라들로부터 예술 작품들과 기타 문화재들을 훔치고 있었다. 그들은 이러한 보물들을 성, 광산, 동굴 같은 곳에 숨겼다. 모뉴먼츠 맨이 이에 대해 알게 되었을 때, 그들은 도난당한 보물들을 찾기 시작했다. 그 후 그들의 수색은 '역사상 가장 위대한 보물찾기'라고 불려 왔다. 독일이 전쟁에서 패하기 시작했을 때, 도난당한 물건들은 위협을 받았다. 히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다. 일부 나치 지도자들은 이것이 군사 및 산업 장비뿐만 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품들까지 포함한다고 여겼다."}, {"id": "ctx3", "kind": "ctx", "n": 3, "title": null, "tko": null, "paras": [[{"t": "One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria. Upon "}, {"t": "discovering", "c": 1}, {"t": " its location, some of the Monuments Men rushed to the mines. They hoped to recover everything before it was too late."}], [{"t": "Meanwhile, the Nazi leader who was in charge of the area tried to "}, {"t": "protect", "c": 2}, {"t": " everything by setting off large explosives inside the mines. This could have been disastrous. "}, {"t": "Unluckily", "c": 3}, {"t": ", some local miners found the explosives in the mines and came up with a plan to protect their livelihood. They secretly "}, {"t": "removed", "c": 4}, {"t": " the large explosives and put smaller ones at the entrances. Once they went off, the Nazi leader believed that everything was destroyed. However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art "}, {"t": "harmed", "c": 5}, {"t": "."}], [{"t": "When the Monuments Men arrived and squeezed their way into the mines, they must have been "}, {"t": "amazed", "c": 6}, {"t": " to see what was inside. There were thousands of priceless objects, including paintings, statues, books, furniture, and more."}]], "items": [{"c": 2, "w": "protect", "r": "destroy", "gw": "보호하다", "gr": "파괴하다", "fb": null, "fg": "Meanwhile, the Nazi leader who was in charge of the area tried to <span class=\"d\">destroy</span> everything by setting off large explosives inside the mines.", "ko": "한편, 그 지역을 담당하던 나치 지도자는 광산 내부에 대형 폭발물을 터뜨려 모든 것을 파괴하려고 했다.", "why": "나치 지도자가 광산 안에서 대형 폭발물을 터뜨린 이유를 말하는 문장이에요. 이어서 This could have been disastrous (이는 처참할 수 있었다)라고 하니 그는 모든 것을 destroy (파괴하다)하려고 한 거예요. protect (보호하다)이면 처참할 이유가 없어요."}, {"c": 3, "w": "Unluckily", "r": "Luckily", "gw": "운 나쁘게도", "gr": "다행히도", "fb": null, "fg": "<span class=\"d\">Luckily</span>, some local miners found the explosives in the mines and came up with a plan to protect their livelihood.", "ko": "다행히도, 지역의 일부 광부들이 광산에서 폭발물을 발견했고 자신들의 생계를 보호할 계획을 생각해 냈다.", "why": "광부들이 폭발물을 발견하고 생계를 보호할 계획을 생각해 냈어요. 위험한 상황을 막아 준 일이라서 Luckily (다행히도)가 맞아요. Unluckily (운 나쁘게도)는 뒤 내용과 어긋나요."}, {"c": 5, "w": "harmed", "r": "unharmed", "gw": "해를 입은", "gr": "손상되지 않은", "fb": null, "fg": "However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art <span class=\"d\">unharmed</span>.", "ko": "그러나 작은 폭발들이 입구를 봉쇄시키긴 했지만, 그것들은 광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다.", "why": "However (그러나)로 시작해서 입구는 막혔지만 나머지 부분과 예술 작품은 괜찮았다는 내용이에요. 광부들의 계획이 성공했으므로 unharmed (손상되지 않은)가 맞아요. harmed (해를 입은)는 모뉴먼츠 맨이 놀란 이유와도 맞지 않아요."}], "keep": "discovering (알아내자마자)은 광산의 위치를 알아내고 급히 움직였다는 뜻이라 맞아요. removed (제거했다)는 광부들이 대형 폭발물을 몰래 치웠다는 뜻이라 맞아요. amazed (놀란)는 안에 있던 것을 보고 놀랐다는 뜻이라 맞아요.", "flow": "알타우제 소금 광산에 숨겨진 예술 작품을 두고 나치 지도자, 모뉴먼츠 맨, 광부들이 어떻게 움직였는지 이어지는 글이에요. 작품을 지키려는 쪽의 행동과 그 결과를 먼저 가려내면 돼요.", "ko": "도난당한 물품의 가장 큰 더미 중 하나는 오스트리아의 알타우제 소금 광산에 숨겨져 있었다. 그것의 위치를 알아내자마자, 모뉴먼츠 맨 중 일부가 광산으로 급히 움직였다. 그들은 너무 늦기 전에 모든 것을 되찾기를 희망했다. 한편, 그 지역을 담당하던 나치 지도자는 광산 내부에 대형 폭발물을 터뜨려 모든 것을 파괴하려고 했다. 이는 처참할 수 있었다. 다행히도, 지역의 일부 광부들이 광산에서 폭발물을 발견했고 자신들의 생계를 보호할 계획을 생각해 냈다. 그들은 몰래 대형 폭발물을 제거했고 입구에 더 작은 폭발물을 놓았다. 그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 여겼다. 그러나 작은 폭발들이 입구를 봉쇄시키긴 했지만, 그것들은 광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다. 모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 내부에 있던 것을 보고 놀랐음에 틀림없다. 그곳에는 그림, 조각상, 책, 가구 등을 포함해 수천 점의 귀중한 물건들이 있었다."}, {"id": "ctx4", "kind": "ctx", "n": 4, "title": null, "tko": null, "paras": [[{"t": "The Monuments Men thought it would take about one year to transport everything they found to a "}, {"t": "safe", "c": 1}, {"t": " location. However, because control of the area was going to change at the end of the war, they would have access to the mines for just two months. With insufficient packing supplies and only a few trucks, the transporting mission seemed "}, {"t": "possible", "c": 2}, {"t": ". Not only that, but food was in "}, {"t": "enough", "c": 3}, {"t": " supply. Even without eating proper meals, they worked up to twenty hours a day. They used coats and gas masks as packing materials and did everything they could to "}, {"t": "abandon", "c": 4}, {"t": " this vital mission in time."}], [{"t": "In the end, the Monuments Men succeeded in "}, {"t": "rescuing", "c": 5}, {"t": " thousands of stolen works of art, including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges."}]], "items": [{"c": 2, "w": "possible", "r": "impossible", "gw": "가능한", "gr": "불가능한", "fb": null, "fg": "With insufficient packing supplies and only a few trucks, the transporting mission seemed <span class=\"d\">impossible</span>.", "ko": "불충분한 포장 자재와 오직 몇 대의 트럭으로 수송 임무는 불가능한 것처럼 보였다.", "why": "포장 자재가 불충분하고 트럭도 몇 대뿐이었어요. 그래서 수송 임무는 impossible (불가능한 것처럼) 보였다고 해야 자연스러워요. possible (가능한)은 앞 내용과 어긋나요."}, {"c": 3, "w": "enough", "r": "short", "gw": "충분한", "gr": "부족한", "fb": null, "fg": "Not only that, but food was in <span class=\"d\">short</span> supply.", "ko": "그뿐만 아니라 식량 공급량도 부족했다.", "why": "Not only that (그뿐만 아니라)이 어려움을 하나 더 얹는 말이에요. 식량도 in short supply (공급이 부족한)여야 앞의 어려운 상황과 이어져요. in enough supply (충분한 공급)는 어려움이 아니에요."}, {"c": 4, "w": "abandon", "r": "accomplish", "gw": "포기하다", "gr": "완수하다", "fb": null, "fg": "They used coats and gas masks as packing materials and did everything they could to <span class=\"d\">accomplish</span> this vital mission in time.", "ko": "그들은 외투와 방독면을 포장 재료로 사용했고 이 중요한 임무를 시간 내에 완수하기 위해 그들이 할 수 있는 모든 것을 했다.", "why": "그들이 할 수 있는 모든 것을 했다는 말 뒤에는 임무를 시간 내에 accomplish (완수하다)하려고 했다는 내용이 와요. abandon (포기하다)은 모든 것을 했다는 말과 반대예요."}], "keep": "safe (안전한)는 발견한 것을 안전한 장소로 옮긴다는 뜻이라 맞아요. rescuing (구출하는 것)은 도난당한 예술 작품을 구출하는 데 성공했다는 뜻이라 맞아요.", "flow": "두 달 안에 모든 것을 옮겨야 했던 어려운 상황과, 그 상황에서도 임무를 해낸 이야기예요. 어려움을 말하는 곳과 해냈다고 말하는 곳을 나눠서 읽으면 어색한 곳이 보여요.", "ko": "모뉴먼츠 맨은 그들이 발견한 모든 것을 안전한 장소로 옮기는 데 대략 1년이 걸릴 것으로 생각했다. 그러나 전쟁이 끝날 때 그 지역의 통제권이 바뀔 예정이었기 때문에, 그들은 오직 두 달 동안만 광산에 접근하게 될 것이었다. 불충분한 포장 자재와 오직 몇 대의 트럭으로 수송 임무는 불가능한 것처럼 보였다. 그뿐만 아니라 식량 공급량도 부족했다. 제대로 된 식사도 하지 못한 채, 그들은 하루에 20시간까지 일했다. 그들은 외투와 방독면을 포장 재료로 사용했고 이 중요한 임무를 시간 내에 완수하기 위해 그들이 할 수 있는 모든 것을 했다. 마침내, 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 요하네스 페르메이르의 「천문학자」, 그리고 미켈란젤로의 「브뤼헤의 성모」와 같은 중요한 작품들을 포함하여 수천 점의 도난당한 예술 작품을 구출하는 데 성공했다. 모뉴먼츠 맨의 노력은 전쟁과 함께 끝나지 않았다."}, {"id": "ctx5", "kind": "ctx", "n": 5, "title": null, "tko": null, "paras": [[{"t": "The efforts of the Monuments Men did not end with the war. For several years, they "}, {"t": "ceased", "c": 1}, {"t": " the work of recovering cultural treasures and identifying where they had been stolen from. In the end, the Monuments Men "}, {"t": "returned", "c": 2}, {"t": " more than five million works of art and objects of cultural importance to their places of origin."}], [{"t": "Not everything that was stolen by the Nazis has been found, but what the Monuments Men accomplished is truly amazing. Without this "}, {"t": "undetermined", "c": 3}, {"t": " group, the search for stolen works of art might never have begun. In addition, countless historical and cultural landmarks would have been "}, {"t": "preserved", "c": 4}, {"t": " forever due to the destruction of war. It is "}, {"t": "worth", "c": 5}, {"t": " remembering the Monuments Men’s contribution to the preservation of cultural heritage. Thanks to their efforts, many incredible cultural sites and works of art have "}, {"t": "survived", "c": 6}, {"t": " and can still be appreciated to this day."}]], "items": [{"c": 1, "w": "ceased", "r": "continued", "gw": "중단했다", "gr": "이어갔다", "fb": null, "fg": "For several years, they <span class=\"d\">continued</span> the work of recovering cultural treasures and identifying where they had been stolen from.", "ko": "여러 해 동안, 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 식별하는 작업을 이어갔다.", "why": "첫 문장이 The efforts ... did not end with the war (노력은 전쟁과 함께 끝나지 않았다)예요. 그래서 여러 해 동안 작업을 continued (이어갔다)여야 해요. ceased (중단했다)는 첫 문장과 모순이에요."}, {"c": 3, "w": "undetermined", "r": "determined", "gw": "결정되지 않은", "gr": "결연한", "fb": null, "fg": "Without this <span class=\"d\">determined</span> group, the search for stolen works of art might never have begun.", "ko": "이 결연한 집단이 없었다면, 도난당한 예술 작품들의 수색은 시작되지 않았을지도 모른다.", "why": "도난당한 작품을 찾기 위해 모든 것을 건 집단이에요. 이 집단이 없었다면 수색이 시작되지 않았을지도 모른다는 칭찬의 문장이라서 determined (결연한)가 맞아요. undetermined (결정되지 않은)는 이 집단과 어울리지 않아요."}, {"c": 4, "w": "preserved", "r": "lost", "gw": "보존된", "gr": "사라진", "fb": null, "fg": "In addition, countless historical and cultural landmarks would have been <span class=\"d\">lost</span> forever due to the destruction of war.", "ko": "또한, 수많은 역사적, 문화적 랜드마크가 전쟁의 파괴로 인해 영원히 사라져 버렸을 것이다.", "why": "이 집단이 없었다면 랜드마크가 전쟁의 파괴로 영원히 lost (사라진)였을 것이라는 내용이에요. preserved (보존된)이면 파괴 때문에 보존되었다는 이상한 말이 돼요."}], "keep": "returned (돌려보냈다)는 예술 작품을 원래 장소로 돌려보냈다는 뜻이라 맞아요. worth (가치 있는)는 기억할 가치가 있다는 뜻이라 맞아요. survived (살아남았다)는 노력 덕분에 유적과 작품이 살아남았다는 뜻이라 맞아요.", "flow": "모뉴먼츠 맨의 노력이 전쟁 뒤에도 이어졌고, 그 성과가 얼마나 소중한지 평가하는 글이에요. 첫 문장의 '끝나지 않았다'와 평가하는 말의 방향을 보면 돼요.", "ko": "모뉴먼츠 맨의 노력은 전쟁과 함께 끝나지 않았다. 여러 해 동안, 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 식별하는 작업을 이어갔다. 마침내, 모뉴먼츠 맨은 5백만 점이 넘는 예술 작품과 문화적으로 중요한 물건들을 그것들의 원래 장소들로 돌려보냈다. 나치에 의해 도난당한 모든 것이 발견되지는 않았지만, 모뉴먼츠 맨이 이룬 것은 정말로 놀랍다. 이 결연한 집단이 없었다면, 도난당한 예술 작품들의 수색은 시작되지 않았을지도 모른다. 또한, 수많은 역사적, 문화적 랜드마크가 전쟁의 파괴로 인해 영원히 사라져 버렸을 것이다. 문화유산 보존에 대한 모뉴먼츠 맨의 기여는 기억할 가치가 있다. 그들의 노력 덕분에, 많은 놀라운 문화 유적지들과 예술 작품들이 살아남아 오늘날까지도 여전히 감상될 수 있다."}, {"id": "ctx6", "kind": "ctx", "n": 6, "title": null, "tko": null, "paras": [[{"t": "Did you know that there are over 7,000 languages currently being used around the world? Most of these languages are spoken by very small groups of people, and half of them could "}, {"t": "appear", "c": 1}, {"t": " within the next generation. This would be a great loss because language plays a big role in "}, {"t": "connecting", "c": 2}, {"t": " people’s identity to their culture. This is why some organizations work to "}, {"t": "lose", "c": 3}, {"t": " them. For example, a nonprofit organization called Wikitongues has set the goal of preserving all languages that are in "}, {"t": "danger", "c": 4}, {"t": " of being lost. The organization works to achieve this by recording videos of individuals speaking these languages and making mother-tongue resources more "}, {"t": "inaccessible", "c": 5}, {"t": "."}]], "items": [{"c": 1, "w": "appear", "r": "disappear", "gw": "나타나다", "gr": "사라지다", "fb": null, "fg": "Most of these languages are spoken by very small groups of people, and half of them could <span class=\"d\">disappear</span> within the next generation.", "ko": "이러한 언어들의 대부분은 매우 소규모 집단의 사람들에 의해 사용되며, 그중 절반은 다음 세대 이내에 사라질 수도 있다.", "why": "말하는 사람이 매우 적은 언어들 중 절반이 다음 세대 안에 disappear (사라지다)할 수도 있다는 내용이에요. 다음 문장이 This would be a great loss (이는 큰 손실이 될 것이다)라서 appear (나타나다)와는 맞지 않아요."}, {"c": 3, "w": "lose", "r": "preserve", "gw": "잃다", "gr": "보존하다", "fb": null, "fg": "This is why some organizations work to <span class=\"d\">preserve</span> them.", "ko": "이것이 일부 단체가 언어를 보존하기 위해 일하는 이유이다.", "why": "This is why (이것이 ~하는 이유이다) 뒤에는 언어를 지키려는 단체의 노력이 와요. 다음 문장에서도 Wikitongues가 모든 언어를 preserving (보존하는) 목표를 세웠다고 해요. lose (잃다)는 단체가 하려는 일과 반대예요."}, {"c": 5, "w": "inaccessible", "r": "accessible", "gw": "접근할 수 없는", "gr": "접근 가능한", "fb": null, "fg": "The organization works to achieve this by recording videos of individuals speaking these languages and making mother-tongue resources more <span class=\"d\">accessible</span>.", "ko": "그 단체는 이 언어들을 사용하는 개인들의 영상을 기록하고 모국어 자원을 더 접근 가능하게 함으로써 이를 달성하기 위해 노력한다.", "why": "모국어 자원을 기록해 언어를 지키려는 일이에요. 그래서 더 accessible (접근 가능한)하게 만든다는 내용이 맞아요. inaccessible (접근할 수 없는)이면 단체가 하려는 일과 반대예요."}], "keep": "connecting (연결하는 것)은 언어가 정체성을 문화와 연결한다는 뜻이라 맞아요. danger (위험)는 사라질 위험에 처한 언어들이라는 뜻이라 맞아요.", "flow": "사라질 위기에 처한 언어와 그것을 지키려는 단체의 이야기예요. 언어가 사라지는 위험과 그것을 막으려는 노력의 방향이 맞는지 보면 어색한 곳이 보여요.", "ko": "당신은 현재 전 세계에서 7,000개가 넘는 언어가 사용되고 있다는 것을 알고 있었는가? 이러한 언어들의 대부분은 매우 소규모 집단의 사람들에 의해 사용되며, 그중 절반은 다음 세대 이내에 사라질 수도 있다. 이는 큰 손실이 될 텐데 언어가 사람들의 정체성을 그들의 문화와 연결하는 데 큰 역할을 하기 때문이다. 이것이 일부 단체가 언어를 보존하기 위해 일하는 이유이다. 예를 들어, Wikitongues라는 비영리 단체는 소멸될 위험에 처한 모든 언어들을 보존한다는 목표를 세웠다. 그 단체는 이 언어들을 사용하는 개인들의 영상을 기록하고 모국어 자원을 더 접근 가능하게 함으로써 이를 달성하기 위해 노력한다."}, {"id": "gram1", "kind": "gram", "n": 1, "title": null, "tko": null, "paras": [[{"t": "During World War II, "}, {"t": "there was a group of people", "c": 1}, {"t": " "}, {"t": "whose", "c": 2}, {"t": " risked everything to protect priceless works of art from ruin", "c": 3}, {"t": ". In 1943, "}, {"t": "around 345 people from 14 different Allied nations came together to ", "c": 4}, {"t": "forming", "c": 5}, {"t": " the Monuments, Fine Arts, and Archives (MFAA) program", "c": 6}, {"t": ". "}, {"t": "They were not trained soldiers but scholars and experts of various kinds", "c": 7}, {"t": ", such as professors, historians, and architects. "}, {"t": "These brave men and women volunteered ", "c": 8}, {"t": "protecting", "c": 9}, {"t": " Europe’s cultural heritage", "c": 10}, {"t": " and became known as the “Monuments Men.”"}]], "items": [{"c": 2, "w": "whose", "r": "who", "gw": "~의", "gr": "~하는", "fb": "During World War II, there was a group of people <span class=\"d\">whose</span> risked everything to protect priceless works of art from ruin.", "fg": "During World War II, there was a group of people <span class=\"d\">who</span> risked everything to protect priceless works of art from ruin.", "ko": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다.", "why": "people (사람들) 뒤에서 '모든 것을 건 사람들'로 꾸미려면 뒤에 바로 동사 risked (걸었다)가 이어지는 주격 관계대명사가 필요해요. 선행사가 사람이라서 who(또는 that)이에요. whose (~의)는 뒤에 명사가 와야 해요."}, {"c": 5, "w": "forming", "r": "form", "gw": "만드는 것", "gr": "만들기 위해", "fb": "In 1943, around 345 people from 14 different Allied nations came together to <span class=\"d\">forming</span> the Monuments, Fine Arts, and Archives (MFAA) program.", "fg": "In 1943, around 345 people from 14 different Allied nations came together to <span class=\"d\">form</span> the Monuments, Fine Arts, and Archives (MFAA) program.", "ko": "1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다.", "why": "came together to form (만들기 위해 모였다)에서 '~하기 위해'는 to + 동사원형이에요. to 뒤에는 ~ing를 쓰지 않아요."}, {"c": 9, "w": "protecting", "r": "to protect", "gw": "보호하는", "gr": "보호하는 일을", "fb": "These brave men and women volunteered <span class=\"d\">protecting</span> Europe’s cultural heritage and became known as the “Monuments Men.”", "fg": "These brave men and women volunteered <span class=\"d\">to protect</span> Europe’s cultural heritage and became known as the “Monuments Men.”", "ko": "이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다.", "why": "volunteer (자청하다)는 뒤에 to + 동사원형을 써서 '~하는 일을 자청하다'가 돼요. volunteered protecting (자청하며 보호하는 것)처럼 ~ing를 바로 붙일 수 없어요."}], "keep": "there was a group of people (한 무리의 사람들이 있었다)과 They were not trained soldiers but scholars and experts of various kinds (그들은 훈련된 군인이 아니라 다양한 분야의 학자들과 전문가들이었다)는 문법에 맞아서 그대로 둬요.", "flow": "", "ko": "제2차 세계대전 동안, 대단히 귀중한 예술 작품들을 파괴로부터 지키기 위해 모든 것을 건 한 무리의 사람들이 있었다. 1943년에, 14개의 다른 연합국에서 온 약 345명의 사람들이 기념물, 미술품, 그리고 기록물 (MFAA) 프로그램을 만들기 위해 모였다. 그들은 훈련된 군인이 아니라 교수, 역사학자, 건축가와 같은 다양한 분야의 학자들과 전문가들이었다. 이러한 용감한 남성과 여성은 유럽의 문화유산을 보호하는 일을 자청했고 '모뉴먼츠 맨'으로 알려지게 되었다."}, {"id": "gram2", "kind": "gram", "n": 2, "title": null, "tko": null, "paras": [[{"t": "When the MFAA was first formed, "}, {"t": "its main goal was to prevent the destruction of cultural landmarks", "c": 1}, {"t": ". "}, {"t": "The Monuments Men persuaded the Allied forces not ", "c": 2}, {"t": "bombing", "c": 3}, {"t": " areas with museums, churches, or other culturally significant buildings", "c": 4}, {"t": ". They also visited areas "}, {"t": "that had already ", "c": 5}, {"t": "destroyed", "c": 6}, {"t": " to restore damaged architecture and works of art", "c": 7}, {"t": "."}], [{"t": "It wasn’t long before their role expanded. During the war, the Nazis had been stealing works of art and other cultural treasures from countries across Europe. They hid these treasures in places like castles, mines, and caves. When the Monuments Men learned about this, they started looking for the stolen treasures. "}, {"t": "Their search has since been called “the greatest treasure hunt in history.”", "c": 8}], [{"t": "When Germany began to lose the war, the stolen objects came under threat. Hitler ordered his forces to destroy everything "}, {"t": "what", "c": 9}, {"t": " could be useful to the Allied armies", "c": 10}, {"t": " before they retreated from an area. Some Nazi leaders believed that this included not just military and industrial equipment but everything of value—even the stolen works of art."}]], "items": [{"c": 3, "w": "bombing", "r": "to bomb", "gw": "폭격하지 않는 것", "gr": "폭격하지 않도록", "fb": "The Monuments Men persuaded the Allied forces not <span class=\"d\">bombing</span> areas with museums, churches, or other culturally significant buildings.", "fg": "The Monuments Men persuaded the Allied forces not <span class=\"d\">to bomb</span> areas with museums, churches, or other culturally significant buildings.", "ko": "모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다.", "why": "persuade (설득하다) + 목적어 + to + 동사원형은 '~하도록 설득하다'예요. '~하지 않도록'은 not to + 동사원형이라서 not to bomb (폭격하지 않도록)이에요."}, {"c": 6, "w": "destroyed", "r": "been destroyed", "gw": "파괴했던", "gr": "파괴되었던", "fb": "They also visited areas that had already <span class=\"d\">destroyed</span> to restore damaged architecture and works of art.", "fg": "They also visited areas that had already <span class=\"d\">been destroyed</span> to restore damaged architecture and works of art.", "ko": "그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다.", "why": "areas (지역들)는 '파괴된' 쪽이에요. had + been + p.p.로 수동을 만들어 had been destroyed (파괴되었던)가 돼요. had destroyed이면 지역이 무언가를 파괴한 뜻이 돼요."}, {"c": 9, "w": "what", "r": "that", "gw": "~하는 것", "gr": "~하는", "fb": "Hitler ordered his forces to destroy everything <span class=\"d\">what</span> could be useful to the Allied armies before they retreated from an area.", "fg": "Hitler ordered his forces to destroy everything <span class=\"d\">that</span> could be useful to the Allied armies before they retreated from an area.", "ko": "히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다.", "why": "everything (모든 것) 뒤에서 '유용할 수 있는 모든 것'으로 꾸미려면 뒤에 바로 동사 could가 이어지는 주격 관계대명사가 필요해요. 선행사가 있으니 that이에요. what (~하는 것)은 앞에 꾸밀 명사가 있을 땐 쓸 수 없어요."}], "keep": "its main goal was to prevent the destruction of cultural landmarks (주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다)와 Their search has since been called ... (그들의 수색은 그 후 ~라고 불려 왔다)는 문법에 맞아서 그대로 둬요.", "flow": "", "ko": "MFAA가 처음 만들어졌을 때, 그것의 주된 목표는 문화적 랜드마크의 파괴를 막는 것이었다. 모뉴먼츠 맨은 연합군이 박물관, 교회, 또는 다른 문화적으로 중요한 건물들이 있는 지역을 폭격하지 않도록 설득했다. 그들은 또한 훼손된 건축물과 예술 작품을 복원하고자 이미 파괴된 지역을 방문했다. 머지않아 그들의 역할은 확대되었다. 전쟁 중에, 나치는 유럽 전역의 나라들로부터 예술 작품들과 기타 문화재들을 훔치고 있었다. 그들은 이러한 보물들을 성, 광산, 동굴 같은 곳에 숨겼다. 모뉴먼츠 맨이 이에 대해 알게 되었을 때, 그들은 도난당한 보물들을 찾기 시작했다. 그 후 그들의 수색은 '역사상 가장 위대한 보물찾기'라고 불려 왔다. 독일이 전쟁에서 패하기 시작했을 때, 도난당한 물건들은 위협을 받았다. 히틀러는 그의 군대에게 그들이 한 지역에서 후퇴하기 전에 연합군에게 유용할 수 있는 모든 것을 파괴하라고 명령했다. 일부 나치 지도자들은 이것이 군사 및 산업 장비뿐만 아니라 가치 있는 모든 것, 심지어 훔친 예술 작품들까지 포함한다고 여겼다."}, {"id": "gram3", "kind": "gram", "n": 3, "title": null, "tko": null, "paras": [[{"t": "One of the largest collections of stolen items was hidden in the salt mines of Altaussee, Austria", "c": 1}, {"t": ". Upon discovering its location, some of the Monuments Men rushed to the mines. They hoped to recover everything before it was too late."}], [{"t": "Meanwhile, "}, {"t": "the Nazi leader who ", "c": 2}, {"t": "were", "c": 3}, {"t": " in charge of the area tried to destroy everything", "c": 4}, {"t": " by setting off large explosives inside the mines. This could have been disastrous. Luckily, "}, {"t": "some local miners found the explosives in the mines and ", "c": 5}, {"t": "coming", "c": 6}, {"t": " up with a plan to protect their livelihood", "c": 7}, {"t": ". They secretly removed the large explosives and put smaller ones at the entrances. Once they went off, "}, {"t": "the Nazi leader believed that everything was destroyed", "c": 8}, {"t": ". However, while the small explosions sealed off the entrances, they left the rest of the mines and the works of art unharmed."}], [{"t": "When the Monuments Men arrived and squeezed their way into the mines, "}, {"t": "they must have ", "c": 9}, {"t": "being", "c": 10}, {"t": " amazed to see what was inside", "c": 11}, {"t": ". There were thousands of priceless objects, including paintings, statues, books, furniture, and more."}]], "items": [{"c": 3, "w": "were", "r": "was", "gw": "~였다(복수)", "gr": "~였다(단수)", "fb": "Meanwhile, the Nazi leader who <span class=\"d\">were</span> in charge of the area tried to destroy everything by setting off large explosives inside the mines.", "fg": "Meanwhile, the Nazi leader who <span class=\"d\">was</span> in charge of the area tried to destroy everything by setting off large explosives inside the mines.", "ko": "한편, 그 지역을 담당하던 나치 지도자는 광산 내부에 대형 폭발물을 터뜨려 모든 것을 파괴하려고 했다.", "why": "who 뒤 동사는 선행사에 맞춰요. the Nazi leader (나치 지도자)는 한 명이라 단수이므로 was예요. were는 복수에 써요."}, {"c": 6, "w": "coming", "r": "came", "gw": "생각해 내는", "gr": "생각해 냈다", "fb": "Luckily, some local miners found the explosives in the mines and <span class=\"d\">coming</span> up with a plan to protect their livelihood.", "fg": "Luckily, some local miners found the explosives in the mines and <span class=\"d\">came</span> up with a plan to protect their livelihood.", "ko": "다행히도, 지역의 일부 광부들이 광산에서 폭발물을 발견했고 자신들의 생계를 보호할 계획을 생각해 냈다.", "why": "and는 같은 모양을 이어요. 앞의 found (발견했다)가 과거동사라서 뒤도 과거형 came up with (생각해 냈다)가 돼요. coming (오는 중인)은 동사가 될 수 없어요."}, {"c": 10, "w": "being", "r": "been", "gw": "~인 중인", "gr": "~였던", "fb": "When the Monuments Men arrived and squeezed their way into the mines, they must have <span class=\"d\">being</span> amazed to see what was inside.", "fg": "When the Monuments Men arrived and squeezed their way into the mines, they must have <span class=\"d\">been</span> amazed to see what was inside.", "ko": "모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 내부에 있던 것을 보고 놀랐음에 틀림없다.", "why": "must have 뒤에는 과거분사가 와요. be의 과거분사는 been이라서 must have been amazed (놀랐음에 틀림없다)예요. being은 have 뒤에 쓸 수 없어요."}], "keep": "One of the largest collections of stolen items was hidden (도난당한 물품의 가장 큰 더미 중 하나는 숨겨져 있었다)은 one에 맞춘 단수 was와 수동 hidden이라 맞아요. the Nazi leader believed that everything was destroyed (나치 지도자는 모든 것이 파괴되었다고 여겼다)도 맞아요.", "flow": "", "ko": "도난당한 물품의 가장 큰 더미 중 하나는 오스트리아의 알타우제 소금 광산에 숨겨져 있었다. 그것의 위치를 알아내자마자, 모뉴먼츠 맨 중 일부가 광산으로 급히 움직였다. 그들은 너무 늦기 전에 모든 것을 되찾기를 희망했다. 한편, 그 지역을 담당하던 나치 지도자는 광산 내부에 대형 폭발물을 터뜨려 모든 것을 파괴하려고 했다. 이는 처참할 수 있었다. 다행히도, 지역의 일부 광부들이 광산에서 폭발물을 발견했고 자신들의 생계를 보호할 계획을 생각해 냈다. 그들은 몰래 대형 폭발물을 제거했고 입구에 더 작은 폭발물을 놓았다. 그것들이 터지자, 나치 지도자는 모든 것이 파괴되었다고 여겼다. 그러나 작은 폭발들이 입구를 봉쇄시키긴 했지만, 그것들은 광산의 나머지 부분과 예술 작품들을 손상되지 않은 채로 남아 있게 했다. 모뉴먼츠 맨이 도착해 광산 안으로 비집고 들어갔을 때, 그들은 내부에 있던 것을 보고 놀랐음에 틀림없다. 그곳에는 그림, 조각상, 책, 가구 등을 포함해 수천 점의 귀중한 물건들이 있었다."}, {"id": "gram4", "kind": "gram", "n": 4, "title": null, "tko": null, "paras": [[{"t": "The Monuments Men thought "}, {"t": "it would take about one year to transport everything", "c": 1}, {"t": " they found to a safe location. However, "}, {"t": "because of", "c": 2}, {"t": " control of the area was going to change at the end of the war", "c": 3}, {"t": ", they would have access to the mines for just two months. With insufficient packing supplies and only a few trucks, "}, {"t": "the transporting mission seemed ", "c": 4}, {"t": "impossibly", "c": 5}, {"t": ". Not only that, but food was in short supply. Even without eating proper meals, they worked up to twenty hours a day. "}, {"t": "They used coats and gas masks as packing materials and did everything they could to ", "c": 6}, {"t": "accomplishing", "c": 7}, {"t": " this vital mission in time", "c": 8}, {"t": "."}], [{"t": "In the end, "}, {"t": "the Monuments Men succeeded in rescuing thousands of stolen works of art", "c": 9}, {"t": ", including important pieces such as Jan van Eyck’s Adoration of the Mystic Lamb, Johannes Vermeer’s The Astronomer, and Michelangelo’s Madonna of Bruges."}]], "items": [{"c": 2, "w": "because of", "r": "because", "gw": "~ 때문에(명사 앞)", "gr": "~이기 때문에(절 앞)", "fb": "However, <span class=\"d\">because of</span> control of the area was going to change at the end of the war, they would have access to the mines for just two months.", "fg": "However, <span class=\"d\">because</span> control of the area was going to change at the end of the war, they would have access to the mines for just two months.", "ko": "그러나 전쟁이 끝날 때 그 지역의 통제권이 바뀔 예정이었기 때문에, 그들은 오직 두 달 동안만 광산에 접근하게 될 것이었다.", "why": "because 뒤에는 control of the area was going to change (그 지역의 통제권이 바뀔 예정이었다)처럼 주어 + 동사가 있는 절이 와요. because of는 뒤에 명사만 올 수 있어서 맞지 않아요."}, {"c": 5, "w": "impossibly", "r": "impossible", "gw": "불가능하게", "gr": "불가능한", "fb": "With insufficient packing supplies and only a few trucks, the transporting mission seemed <span class=\"d\">impossibly</span>.", "fg": "With insufficient packing supplies and only a few trucks, the transporting mission seemed <span class=\"d\">impossible</span>.", "ko": "불충분한 포장 자재와 오직 몇 대의 트럭으로 수송 임무는 불가능한 것처럼 보였다.", "why": "seemed (~처럼 보였다) 뒤에는 형용사가 와요. impossible (불가능한)이 맞고, impossibly (불가능하게)는 부사라서 쓸 수 없어요."}, {"c": 7, "w": "accomplishing", "r": "accomplish", "gw": "완수하는 것", "gr": "완수하기 위해", "fb": "They used coats and gas masks as packing materials and did everything they could to <span class=\"d\">accomplishing</span> this vital mission in time.", "fg": "They used coats and gas masks as packing materials and did everything they could to <span class=\"d\">accomplish</span> this vital mission in time.", "ko": "그들은 외투와 방독면을 포장 재료로 사용했고 이 중요한 임무를 시간 내에 완수하기 위해 그들이 할 수 있는 모든 것을 했다.", "why": "did everything they could to accomplish (완수하기 위해 할 수 있는 모든 것을 했다)에서 '~하기 위해'는 to + 동사원형이에요. to 뒤에는 ~ing를 쓰지 않아요."}], "keep": "it would take about one year to transport everything (모든 것을 옮기는 데 대략 1년이 걸릴 것이다)은 It takes (걸리다) + 시간 + to부정사 모양이라서 맞아요. succeeded in rescuing (구출하는 데 성공했다)도 in 뒤에 ~ing라서 맞아요.", "flow": "", "ko": "모뉴먼츠 맨은 그들이 발견한 모든 것을 안전한 장소로 옮기는 데 대략 1년이 걸릴 것으로 생각했다. 그러나 전쟁이 끝날 때 그 지역의 통제권이 바뀔 예정이었기 때문에, 그들은 오직 두 달 동안만 광산에 접근하게 될 것이었다. 불충분한 포장 자재와 오직 몇 대의 트럭으로 수송 임무는 불가능한 것처럼 보였다. 그뿐만 아니라 식량 공급량도 부족했다. 제대로 된 식사도 하지 못한 채, 그들은 하루에 20시간까지 일했다. 그들은 외투와 방독면을 포장 재료로 사용했고 이 중요한 임무를 시간 내에 완수하기 위해 그들이 할 수 있는 모든 것을 했다. 마침내, 모뉴먼츠 맨은 얀 반 에이크의 「신비한 어린 양에 대한 경배」, 요하네스 페르메이르의 「천문학자」, 그리고 미켈란젤로의 「브뤼헤의 성모」와 같은 중요한 작품들을 포함하여 수천 점의 도난당한 예술 작품을 구출하는 데 성공했다. 모뉴먼츠 맨의 노력은 전쟁과 함께 끝나지 않았다."}, {"id": "gram5", "kind": "gram", "n": 5, "title": null, "tko": null, "paras": [[{"t": "The efforts of the Monuments Men did not end with the war. For several years, "}, {"t": "they continued the work of recovering cultural treasures and identifying where ", "c": 1}, {"t": "had they", "c": 2}, {"t": " been stolen from", "c": 3}, {"t": ". In the end, the Monuments Men returned more than five million works of art and objects of cultural importance to their places of origin."}], [{"t": "Not everything that was stolen by the Nazis has ", "c": 4}, {"t": "found", "c": 5}, {"t": ", but "}, {"t": "what the Monuments Men accomplished is truly amazing", "c": 6}, {"t": ". Without this determined group, the search for stolen works of art might never have begun. In addition, "}, {"t": "countless historical and cultural landmarks would have been lost forever due to the destruction of war", "c": 7}, {"t": ". "}, {"t": "It is worth ", "c": 8}, {"t": "to remember", "c": 9}, {"t": " the Monuments Men’s contribution to the preservation of cultural heritage", "c": 10}, {"t": ". Thanks to their efforts, many incredible cultural sites and works of art have survived and can still be appreciated to this day."}]], "items": [{"c": 2, "w": "had they", "r": "they had", "gw": "그들이 ~했나(의문문 순서)", "gr": "그들이 ~했는지", "fb": "For several years, they continued the work of recovering cultural treasures and identifying where <span class=\"d\">had they</span> been stolen from.", "fg": "For several years, they continued the work of recovering cultural treasures and identifying where <span class=\"d\">they had</span> been stolen from.", "ko": "여러 해 동안, 그들은 문화재를 되찾고 그것들이 어디에서 도난당했는지 식별하는 작업을 이어갔다.", "why": "where 뒤는 질문이 아니라서 주어 + 동사 순서가 돼요. where they had been stolen from (그것들이 어디에서 도난당했는지)이 맞고, had they는 의문문 순서라서 쓸 수 없어요."}, {"c": 5, "w": "found", "r": "been found", "   $('ask').innerHTML='밑줄 친 곳 중 <b>'+(q.kind==='ctx'?'문맥상':'어법상')+' 어색한 것 '+n+'개</b>를 고르세요.';
  var ps=$('ps');ps.innerHTML='';ps.classList.toggle('locked',r.done);
  if(q.title){var tp=el('p','ptitle');tp.textContent=q.title+' ';var sp=el('span',null,'('+q.tko+')');sp.style.cssText='color:var(--sub);font-size:15px;font-weight:600';tp.appendChild(sp);ps.appendChild(tp)}
  var T=truth(q);
  q.paras.forEach(function(p){
    var pe=el('p');
    p.forEach(function(s){
      if(!s.c){pe.appendChild(document.createTextNode(s.t));return}
      var c=el('span','cd');c.setAttribute('data-c',s.c);c.appendChild(document.createTextNode(s.t));
      c.appendChild(el('sup',null,CIRC.charAt(s.c-1)));
      var picked=r.sel.indexOf(s.c)>=0,isT=T.indexOf(s.c)>=0;
      if(r.done){
        if(picked&&isT)c.classList.add('hit');else if(isT)c.classList.add('miss');else if(picked)c.classList.add('bad');
        if(isT){var it=q.items.filter(function(i){return i.c===s.c})[0];pe.appendChild(c);pe.appendChild(el('span','fx',' → '+it.r+' '));return}
      }else{
        if(picked)c.classList.add('sel');
        c.onclick=function(){toggle(q,s.c)};
      }
      pe.appendChild(c);
    });
    ps.appendChild(pe)});
  var sub=$('submit'),cnt=$('cnt');
  if(r.done){sub.classList.add('hide');cnt.classList.add('hide');result(q)}
  else{sub.classList.remove('hide');cnt.classList.remove('hide');$('res').classList.add('hide');upd(q)}
}
function upd(q){var r=R(q),n=q.items.length;$('cnt').innerHTML='선택한 곳 <b>'+r.sel.length+'</b> / '+n+(r.sel.length?' · '+r.sel.slice().sort(function(a,b){return a-b}).map(function(c){return CIRC.charAt(c-1)}).join(' '):'');$('submit').disabled=r.sel.length!==n}
function toggle(q,c){
  var r=R(q);if(r.done)return;
  var i=r.sel.indexOf(c);
  if(i>=0)r.sel.splice(i,1);else{if(r.sel.length>=q.items.length)return;r.sel.push(c)}
  save();
  var e=document.querySelector('.cd[data-c="'+c+'"]');if(e)e.classList.toggle('sel',r.sel.indexOf(c)>=0);upd(q);
}
$('submit').onclick=function(){var q=qById(S.cur),r=R(q);if(r.sel.length!==q.items.length)return;r.done=true;if(!isOk(q)){var _k=(q.ko||'').replace(/\s+/g,' ');WN.add({kind:'L3',part:PART,act:'awk',qid:q.id,label:'어색한 곳('+(q.kind==='ctx'?'문맥':'어법')+') · '+_k.slice(0,16)+'…'})}
if(!S.marked&&Q.every(function(x){return R(x).done})){S.marked=1;if(WN.MIX)WN.finish();if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}save();draw(q);setTimeout(function(){var x=$('res');if(x.scrollIntoView)x.scrollIntoView({behavior:'smooth',block:'start'})},30)};
function result(q){
  var r=R(q),res=$('res');res.innerHTML='';res.classList.remove('hide');
  var T=truth(q),got=r.sel.filter(function(c){return T.indexOf(c)>=0}).length,ok=isOk(q);
  res.appendChild(el('div','verdict '+(ok?'ok':'ng'),ok?'○ 모두 맞았어요':'× 어색한 곳 '+q.items.length+'개 중 '+got+'개를 찾았어요'));
  q.items.forEach(function(it,ii){
    var d=el('div','it'),h=el('div','ih');
    h.appendChild(el('span','no','('+(ii+1)+')'));
    var hit=r.sel.indexOf(it.c)>=0;
    h.appendChild(el('span','tag '+(hit?'y':'n'),(hit?'찾았어요 ':'놓쳤어요 ')+CIRC.charAt(it.c-1)));
    var ia=el('span','ia');ia.appendChild(el('span','x',it.w));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gw+')'));ia.appendChild(document.createTextNode(' → '));ia.appendChild(el('span','r',it.r));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gr+')'));
    h.appendChild(ia);d.appendChild(h);
    var f=el('div','fix');
    if(it.fb)f.appendChild(html('span','l bad','<small>틀린 문장</small>'+it.fb));
    f.appendChild(html('span','l good','<small>고친 문장</small>'+it.fg));d.appendChild(f);
    d.appendChild(el('div','kot',it.ko));
    d.appendChild(html('div','why',it.why));
    res.appendChild(d)});
  var wrongPick=r.sel.filter(function(c){return T.indexOf(c)<0});
  if(wrongPick.length){res.appendChild(html('div','note','<b>잘못 고른 곳</b> '+wrongPick.map(function(c){return CIRC.charAt(c-1)}).join(' ')+'은(는) 글의 흐름과 문법에 맞는 표현이라 그대로 둬요.'))}
  if(WN.MIX){WN.finish();res.appendChild(html('div','note','틀린 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에 담겨요.'))}
  else if(WN.MODE){res.appendChild(html('div','note','이제 안 봐도 되는 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에서 \'빼기\'로 뺄 수 있어요.'))}
  else if(WN.has('L3',PART,'awk',q.id)){res.appendChild(html('div','note','<a href="../wrong.html" style="color:#0f766e;text-decoration:underline">틀린 '+WN.ids('L3',PART,'awk').length+'개가 오답 노트에 담겼어요 ›</a>'))}
  res.appendChild(html('div','note','<b>글의 흐름</b> '+q.flow));
  res.appendChild(html('div','note','<b>그대로 두는 부분</b> '+q.keep));
  var kb=el('div','kobox');kb.textContent=q.ko;
  var row=el('div','row');
  var bk=el('button','btn','한글 해석 보기');bk.onclick=function(){var on=kb.classList.toggle('on');bk.textContent=on?'한글 해석 닫기':'한글 해석 보기'};
  res.appendChild(bk);res.appendChild(kb);
  var idx=Q.indexOf(q),nx=Q[idx+1];
  var again=el('button','big alt','이 문제 다시 풀기');again.onclick=function(){S.res[q.id]={sel:[],done:false};save();draw(q);window.scrollTo(0,0)};
  var next=el('button','big',nx?'다음 문제 · '+nm(nx):'목록으로');next.onclick=function(){if(nx)open(nx.id);else home()};
  row.appendChild(again);row.appendChild(next);res.appendChild(row);
}
$('toHome').onclick=home;
$('resetAll').onclick=function(){if(!confirm('푼 기록을 모두 지우고 처음부터 할까요?'))return;S={res:{},cur:null};save();home()};
if(S.cur&&qById(S.cur))open(S.cur);else home();
</script><script src="../../common/prog.js?v=261019"></script><script>if(!WN.MODE)PG.bar(PGK,"풀었어요")</script></body></html>
