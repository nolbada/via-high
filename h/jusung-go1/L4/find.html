</style><link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="주성고정답"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← 목록</a></div><h1 id="h"></h1><div class="sub">본문과 다른 문장을 찾아 눌러 보세요.</div><div class="how">문장을 누르면 본문 근거와 해설이 열려요. 본문과 다른 문장이면 초록색, 본문과 같은 내용이면 주황색으로 표시돼요. 맞는 문장도 눌러서 읽어 보면 본문이 더 잘 기억나요.</div><div class="nav" id="nav"></div><div id="root"></div><div class="foot">비타민 영어클리닉 · 주성고1</div></div><script src="../parts.js?v=261019"></script><script src="../wrong.js?v=261019"></script><script>
var D={"n": "4", "title": "4과 Good for All of Us", "parts": [["❶", "본문 ❶"], ["❷", "본문 ❷"], ["❸", "본문 ❸"], ["❹", "본문 ❹"], ["❺", "본문 ❺"], ["❻", "본문 ❻"], ["❼", "본문 ❼"], ["C", "Culture Notes"]], "groups": [{"part": "❶", "title": "팔이 부러졌다고 상상하기", "flow": "팔이 부러졌다고 상상하면, 그 팔로는 하기 어려운 일들이 생겨요.", "items": [{"no": 1, "en": "If you broke your right arm, some tasks would be hard to do with that arm.", "ans": "T", "ko": "만약 당신의 오른팔이 부러진다면, 그 팔로 하기 어려운 일들이 있을 것이다.", "eve": "Imagine you have fallen down and broken your right arm. There are some things that would be difficult to do with your injured arm.", "evk": "당신이 넘어져 당신의 오른팔이 부러졌다고 상상해 보라. 당신의 다친 팔로 하기에 어려울 몇몇 일들이 있다.", "why": "글 첫머리의 상상(**팔이 부러졌다**)과 'difficult to do with your injured arm'을 풀어 쓴 문장이에요. would be hard는 difficult를 바꿔 쓴 말이에요."}]}, {"part": "❶", "title": "팔을 다치면, 그리고 장애가 있으면", "flow": "팔을 다치면 자전거도, 왼손 마우스도 힘들고, 어떤 장애는 웹 사이트 이용을 거의 불가능하게 만들어요.", "items": [{"no": 1, "en": "It would be difficult for a person with a broken right arm to ride a bike.", "ans": "T", "ko": "팔이 부러진 사람이 자전거를 타는 것은 어려울 것이다.", "eve": "For example, you might not be able to carry heavy boxes or ride your bike.", "evk": "예를 들어, 당신은 무거운 상자를 옮기거나 자전거를 타지 못할 수도 있다.", "why": "**might not be able to ... ride your bike**(자전거를 타지 못할 수도 있다)를 difficult로 바꿔 쓴 맞는 문장이에요."}, {"no": 2, "en": "People who are right-handed can easily use a computer mouse with their left hand.", "ans": "F", "ko": "오른손잡이인 사람들은 왼손으로 컴퓨터 마우스를 쉽게 사용할 수 있다.", "eve": "If you are right-handed, using a computer mouse or touchscreen with your left hand would be awkward and take a lot of time.", "evk": "만약 당신이 오른손잡이라면, 당신의 왼손으로 컴퓨터 마우스나 터치스크린을 사용하는 것은 어색하고 많은 시간이 걸릴 것이다.", "why": "본문은 왼손으로 마우스를 쓰면 **어색하고(awkward) 시간이 많이 걸린다**고 해요. 'easily(쉽게)'는 정반대예요."}, {"no": 3, "en": "For some people, their disabilities make it almost impossible to use websites.", "ans": "T", "ko": "일부 사람들에게는 장애 때문에 웹 사이트를 사용하는 것이 거의 불가능하다.", "eve": "For people with certain disabilities, many websites can be nearly impossible to use.", "evk": "특정 장애가 있는 사람들에게는, 많은 웹 사이트가 사용하기에 거의 불가능할 수 있다.", "why": "**nearly impossible**(거의 불가능한)을 almost impossible로 바꿔 쓴 맞는 문장이에요."}]}, {"part": "❶", "title": "웹 접근성이란", "flow": "웹 접근성은 장애가 있는 사람을 포함해 모두가 웹 사이트를 쓸 수 있게 하는 실천이고, 이 글은 그 공통점을 소개해요.", "items": [{"no": 1, "en": "Web accessibility means making sure that only people without disabilities can use websites.", "ans": "F", "ko": "웹 접근성은 장애가 없는 사람들만 웹 사이트를 사용할 수 있도록 하는 것을 의미한다.", "eve": "Web accessibility is the practice of making sure that websites can be used by everyone, including people with disabilities.", "evk": "웹 접근성은 웹 사이트가 장애가 있는 사람들을 포함하여 반드시 모두에게 사용될 수 있도록 하는 실천이다.", "why": "정의는 **장애가 있는 사람들을 포함하여(including) 모두**가 쓸 수 있게 하는 실천이에요. 'only ... without disabilities'는 정반대예요."}, {"no": 2, "en": "The passage is going to introduce common characteristics of accessible websites.", "ans": "T", "ko": "이 글은 접근성 있는 웹 사이트의 공통된 특징들을 소개할 것이다.", "eve": "Here are some common features of accessible websites.", "evk": "여기 접근성 있는 웹 사이트들의 몇 가지 공통점이 있다.", "why": "**Here are some common features of accessible websites.**가 앞으로 나올 내용을 알려 줘요. common features를 common characteristics로 바꿔 쓴 문장이에요."}]}, {"part": "❷", "title": "텍스트 말고도 담긴 정보", "flow": "웹 사이트에는 텍스트 말고도 이미지 같은 여러 형식의 정보가 있어요.", "items": [{"no": 1, "en": "Many websites use pictures and other forms of information in addition to text.", "ans": "T", "ko": "많은 웹 사이트는 텍스트 외에도 사진과 다른 형식의 정보를 사용한다.", "eve": "Along with text, most websites include other forms of information, such as images.", "evk": "텍스트와 함께, 대부분의 웹 사이트는 이미지와 같은 다른 형식의 정보를 포함한다.", "why": "**Along with text ... other forms of information, such as images**를 in addition to text로 바꿔 쓴 맞는 문장이에요."}]}, {"part": "❷", "title": "이미지와 스크린 리더", "flow": "시각 정보는 이해에 중요하지만, 스크린 리더는 글만 읽고 이미지는 읽지 못해요.", "items": [{"no": 1, "en": "Some online images help users better understand the written content.", "ans": "T", "ko": "일부 온라인 이미지는 사용자가 글 내용을 더 잘 이해하도록 돕는다.", "eve": "Sometimes such visual information is important for understanding the text. This is a problem for users with visual disabilities.", "evk": "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다.", "why": "**such visual information is important for understanding the text**(시각 정보가 텍스트를 이해하는 데 중요하다)를 바꿔 쓴 문장이에요."}, {"no": 2, "en": "People who have trouble seeing can easily understand pictures on websites without help.", "ans": "F", "ko": "보는 데 어려움이 있는 사람들은 도움 없이도 웹 사이트의 사진을 쉽게 이해할 수 있다.", "eve": "Sometimes such visual information is important for understanding the text. This is a problem for users with visual disabilities. When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images.", "evk": "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다. 그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다.", "why": "시각 장애가 있는 사용자에게 시각 정보는 **문제(a problem)**예요. 스크린 리더가 이미지를 읽지 못하니, 도움 없이 쉽게 이해한다는 말은 틀려요."}, {"no": 3, "en": "Programs called “screen readers” are designed to read digital text out loud for users.", "ans": "T", "ko": "‘스크린 리더’라 불리는 프로그램은 사용자를 위해 디지털 텍스트를 소리 내어 읽어 주도록 만들어졌다.", "eve": "When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images.", "evk": "그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다.", "why": "**programs called “screen readers,” which read online text aloud**를 바꿔 쓴 문장이에요. aloud는 out loud와 같은 말이에요."}, {"no": 4, "en": "Screen readers can describe images just as well as they can read text.", "ans": "F", "ko": "스크린 리더는 텍스트를 읽는 것만큼 이미지도 잘 설명할 수 있다.", "eve": "When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images.", "evk": "그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다.", "why": "본문은 **these programs cannot “read” images**예요. 이미지를 읽지 못한다는 뜻이라 '텍스트만큼 잘 설명한다'는 틀려요."}]}, {"part": "❷", "title": "대체 텍스트", "flow": "대체 텍스트는 이미지를 글로 설명해 주고, 스크린 리더가 그것을 읽어 줘서 시각 장애인도 더 많은 정보에 접근해요.", "items": [{"no": 1, "en": "Alt text provides short descriptions of non-text information.", "ans": "T", "ko": "대체 텍스트는 글자가 아닌 정보에 대한 짧은 설명을 제공한다.", "eve": "Alt text is a brief description of non-textual information.", "evk": "대체 텍스트는 비문자 정보에 대한 간단한 설명이다.", "why": "**a brief description of non-textual information** 그대로예요. brief는 short와 같은 말이에요."}, {"no": 2, "en": "An image that shows students could have alt text mentioning their number and actions.", "ans": "T", "ko": "학생들을 보여 주는 이미지의 대체 텍스트는 학생 수와 행동을 언급할 수 있다.", "eve": "For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "evk": "예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다.", "why": "예시 문장의 **how many students ... and what they are doing**(몇 명이고 무엇을 하는지)을 number and actions로 바꿔 쓴 문장이에요."}, {"no": 3, "en": "Screen readers are able to recognize alt text and speak it to the user.", "ans": "T", "ko": "스크린 리더는 대체 텍스트를 인식하고 사용자에게 말해 줄 수 있다.", "eve": "Screen readers can detect this alt text and read it aloud.", "evk": "스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다.", "why": "**detect this alt text and read it aloud**를 recognize와 speak로 바꿔 쓴 문장이에요."}, {"no": 4, "en": "Alt text allows users with visual impairments to gain more access to online information.", "ans": "T", "ko": "대체 텍스트는 시각 장애가 있는 사용자가 온라인 정보에 더 많이 접근하게 해 준다.", "eve": "This way, alt text ensures that people with visual disabilities can access more of the information on a website.", "evk": "이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다.", "why": "**ensures that people with visual disabilities can access more of the information**의 바꿔 쓰기예요. visual disabilities는 visual impairments와 같은 말이에요."}]}, {"part": "❸", "title": "음성을 들을 수 없는 사람들", "flow": "청각 장애가 있거나 조용한 도서관처럼 소리를 들을 수 없는 곳에 있는 사람은 음성 콘텐츠에 접근하기 어려워요.", "items": [{"no": 1, "en": "Some people may not be able to listen to audio because they have hearing disabilities.", "ans": "T", "ko": "일부 사람들은 청각 장애가 있어서 음성을 들을 수 없을지도 모른다.", "eve": "Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library.", "evk": "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다.", "why": "**Some people may have hearing disabilities**를 이유 형태로 바꾼 맞는 문장이에요."}, {"no": 2, "en": "People in quiet libraries can freely listen to audio content.", "ans": "F", "ko": "조용한 도서관에 있는 사람들은 음성 콘텐츠를 자유롭게 들을 수 있다.", "eve": "Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library.", "evk": "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다.", "why": "본문은 조용한 도서관 같은 장소에서는 음성을 **들을 수 없다(can’t listen to audio)**고 해요. 'freely(자유롭게)'는 정반대예요."}]}, {"part": "❸", "title": "대본과 자막", "flow": "그래서 대본(전체 음성)과 자막(재생 중 나타남) 같은 다른 방법을 제공해요.", "items": [{"no": 1, "en": "Accessible websites often provide more than one way to access audio information.", "ans": "T", "ko": "접근성 있는 웹 사이트는 음성 정보에 접근하는 방법을 흔히 한 가지 이상 제공한다.", "eve": "Therefore, accessible websites often offer other ways to access information that is presented in audio form.", "evk": "그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다.", "why": "**often offer other ways to access information**(다른 방법들을 제공한다)을 more than one way로 바꾼 문장이에요."}, {"no": 2, "en": "Transcripts are short summaries of the audio content.", "ans": "F", "ko": "대본은 음성 콘텐츠의 짧은 요약이다.", "eve": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays.", "evk": "대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다.", "why": "대본은 **text versions of the entire audio content**(전체 음성 콘텐츠의 텍스트 버전)예요. '짧은 요약'은 틀려요. entire(전체)가 핵심이에요."}, {"no": 3, "en": "Captions appear in videos at the same time as the videos play.", "ans": "T", "ko": "자막은 영상이 재생되는 것과 동시에 영상 안에 나타난다.", "eve": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays.", "evk": "대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다.", "why": "자막은 **appear in a video as it plays**(재생될 때 영상 안에 나타난다)예요. as it plays는 at the same time as the videos play와 같은 뜻이에요."}]}, {"part": "❸", "title": "자막이 알려 주는 소리", "flow": "자막은 말뿐 아니라 음악과 다른 소리까지 설명해요.", "items": [{"no": 1, "en": "Captions can describe sounds such as music in a video.", "ans": "T", "ko": "자막은 영상 속 음악 같은 소리를 설명할 수 있다.", "eve": "Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video.", "evk": "자막은 발화된 단어의 텍스트 버전뿐만 아니라 영상 내의 음악과 다른 소리들에 대한 설명도 포함한다.", "why": "**descriptions of the music and other sounds in the video**를 바꿔 쓴 맞는 문장이에요."}]}, {"part": "❹", "title": "시각 장애와 시력", "flow": "시각 장애가 있어도 전혀 못 보는 것은 아니에요(부분 부정).", "items": [{"no": 1, "en": "People with visual disabilities are always completely blind.", "ans": "F", "ko": "시각 장애가 있는 사람들은 항상 완전히 눈이 먼 상태이다.", "eve": "Having a visual disability doesn’t necessarily mean a person can’t see at all.", "evk": "시각 장애를 지니고 있는 것은 반드시 한 사람이 전혀 보지 못한다는 것을 의미하지는 않는다.", "why": "본문은 **doesn’t necessarily mean a person can’t see at all**(반드시 전혀 못 본다는 뜻은 아니다)이에요. 'always completely'는 부분 부정과 정반대예요."}]}, {"part": "❹", "title": "대조되는 배경색", "flow": "시력이 나쁜 사람(특히 노인)을 위해 글자색과 대조되는 배경색을 써서 글을 또렷하게 만들어요.", "items": [{"no": 1, "en": "Some elderly people have trouble reading because of poor eyesight.", "ans": "T", "ko": "일부 노인들은 좋지 않은 시력 때문에 읽는 데 어려움을 겪는다.", "eve": "Some people, including many elderly people, simply have poor eyesight. This makes it difficult for them to read.", "evk": "많은 노인들을 포함해서 일부 사람들은 그저 좋지 않은 시력을 가지고 있다. 이는 그들이 읽는 것을 어렵게 만든다.", "why": "**including many elderly people, simply have poor eyesight. This makes it difficult for them to read.**를 합쳐 쓴 문장이에요."}, {"no": 2, "en": "Accessible websites use the same color for both background and text.", "ans": "F", "ko": "접근성 있는 웹 사이트는 배경과 글자에 같은 색을 사용한다.", "eve": "For this reason, accessible websites have a background color that contrasts with the color of their text.", "evk": "이러한 이유로, 접근성 있는 웹 사이트는 텍스트 색과 대조를 이루는 배경 색을 지니고 있다.", "why": "본문은 배경색이 텍스트 색과 **대조를 이룬다(contrasts with)**예요. 같은 색이면 글씨가 안 보이니 정반대예요."}, {"no": 3, "en": "Users can control the background sound on accessible websites.", "ans": "T", "ko": "사용자는 접근성 있는 웹 사이트에서 배경음을 조절할 수 있다.", "eve": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.", "evk": "음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다.", "why": "**adjust the volume of background sound or to turn it off**를 바꿔 쓴 맞는 문장이에요."}]}, {"part": "❹", "title": "배경음 조절", "flow": "배경음은 조절하거나 끌 수 있어서 모두가 자기 경험을 더 잘 통제해요.", "items": [{"no": 1, "en": "Adjusting or turning off background sound helps users manage their experience on the websites.", "ans": "T", "ko": "배경음을 조절하거나 끄는 것은 사용자가 웹 사이트에서의 경험을 관리하도록 돕는다.", "eve": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether. This gives users both with and without hearing difficulties more control over their experience while they are using the sites.", "evk": "음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다. 이는 청각 장애가 있는 사용자와 없는 사용자 모두에게 그들이 사이트를 사용하는 동안 그들의 경험에 대한 더 많은 통제권을 준다.", "why": "**more control over their experience**(경험에 대한 더 많은 통제권)를 manage their experience로 바꿔 쓴 문장이에요."}]}, {"part": "❺", "title": "손의 움직임과 키보드", "flow": "손의 움직임이 제한된 사람은 마우스 대신 키보드에 의존해요.", "items": [{"no": 1, "en": "Some people have conditions that make it hard for them to use their hands freely.", "ans": "T", "ko": "일부 사람들은 손을 자유롭게 사용하기 어렵게 만드는 상태를 가지고 있다.", "eve": "Some users have disabilities that limit the movement of their hands.", "evk": "일부 사용자들은 그들의 손의 움직임을 제한하는 장애를 가지고 있다.", "why": "**disabilities that limit the movement of their hands**(손의 움직임을 제한하는 장애)를 바꿔 쓴 문장이에요."}, {"no": 2, "en": "Users with limited hand movement usually depend on a mouse to browse the web.", "ans": "F", "ko": "손의 움직임이 제한된 사용자들은 보통 웹을 둘러보기 위해 마우스에 의존한다.", "eve": "They rely on their keyboards, rather than a mouse, to navigate websites.", "evk": "그들은 웹 사이트를 탐색하기 위해 마우스보다는 키보드에 의존한다.", "why": "본문은 **rely on their keyboards, rather than a mouse**(마우스보다는 키보드에 의존)예요. 마우스와 키보드가 뒤바뀐 문장이에요."}]}, {"part": "❺", "title": "키보드로 접근하는 곳", "flow": "링크·버튼·필드(정보 입력 공간)도 키보드 탐색으로 접근할 수 있어요.", "items": [{"no": 1, "en": "Links, buttons, and fields cannot be reached through keyboard navigation.", "ans": "F", "ko": "링크, 버튼, 필드는 키보드 탐색으로는 닿을 수 없다.", "eve": "This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "evk": "이는 링크, 버튼 그리고 정보가 입력되는 공간인 필드가 키보드 탐색을 통해 접근될 수 있다는 것을 의미한다.", "why": "본문은 **can be accessed through keyboard navigation**(키보드 탐색을 통해 접근될 수 있다)이에요. cannot은 정반대예요."}, {"no": 2, "en": "The passage describes fields as spaces where users can enter information.", "ans": "T", "ko": "이 글은 필드를 사용자가 정보를 입력할 수 있는 공간이라고 설명한다.", "eve": "This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "evk": "이는 링크, 버튼 그리고 정보가 입력되는 공간인 필드가 키보드 탐색을 통해 접근될 수 있다는 것을 의미한다.", "why": "**fields, which are spaces where information is entered**를 능동 표현으로 바꾼 문장이에요."}]}, {"part": "❺", "title": "탭 키와 키보드 탐색", "flow": "탭 키로 페이지의 한 부분에서 다른 부분으로 건너뛰고, 장애인뿐 아니라 일시적으로 손을 다친 사람도 도움을 받아요.", "items": [{"no": 1, "en": "The tab key helps users move quickly between different sections of a web page.", "ans": "T", "ko": "탭 키는 사용자가 웹 페이지의 서로 다른 부분 사이를 빠르게 이동하도록 돕는다.", "eve": "For example, they can use the tab key to jump from one part of a web page to another.", "evk": "예를 들어, 그들은 웹 페이지의 한 부분에서 다른 부분으로 뛰어넘기 위해 탭 키를 사용할 수 있다.", "why": "**use the tab key to jump from one part of a web page to another**의 바꿔 쓰기예요. jump는 move quickly와 같은 흐름이에요."}, {"no": 2, "en": "Only people with permanent disabilities can benefit from keyboard navigation.", "ans": "F", "ko": "영구적인 장애가 있는 사람들만 키보드 탐색의 혜택을 받을 수 있다.", "eve": "Both users with disabilities and those with temporarily injured hands can benefit from this kind of navigation.", "evk": "장애를 가진 사용자와 일시적으로 손을 다친 사용자 모두가 이러한 종류의 탐색으로부터 득을 본다.", "why": "본문은 장애가 있는 사용자와 **일시적으로(temporarily) 손을 다친 사용자 모두**가 득을 본다고 해요. 'Only'가 틀렸어요."}]}, {"part": "❻", "title": "색맹과 색상 지표", "flow": "색맹인 사람은 색을 구별하기 어려워서 색만 쓰면 문제가 되고, 접근성 있는 사이트는 다른 지표도 함께 써요.", "items": [{"no": 1, "en": "People with color blindness have trouble distinguishing certain colors.", "ans": "T", "ko": "색맹인 사람들은 특정 색을 구별하는 데 어려움을 겪는다.", "eve": "Color blindness is a common visual disability. People with color blindness find it difficult to tell some colors apart.", "evk": "색맹은 흔한 시각 장애이다. 색맹인 사람들은 몇몇 색들을 구별하는 것을 어렵다고 여긴다.", "why": "**find it difficult to tell some colors apart**의 바꿔 쓰기예요. tell apart는 distinguish와 같은 말이에요."}, {"no": 2, "en": "Using only colors to present data in charts may be confusing for some viewers.", "ans": "T", "ko": "차트에서 데이터를 보여 주는 데 색상만 사용하면 일부 보는 사람에게 혼란스러울 수 있다.", "eve": "This can cause problems, especially when graphs and charts only use colors to show the differences between sets of information.", "evk": "이는 특히 그래프와 차트가 정보 세트들 간의 차이를 나타내기 위해 색상만을 사용할 때 문제를 일으킬 수 있다.", "why": "**This can cause problems, especially when graphs and charts only use colors**를 confusing으로 바꿔 쓴 문장이에요."}, {"no": 3, "en": "Accessible websites avoid using indicators other than color to present information.", "ans": "F", "ko": "접근성 있는 웹 사이트는 정보를 보여 주기 위해 색상 이외의 지표 사용을 피한다.", "eve": "Accessible websites use other indicators along with the colors.", "evk": "접근성 있는 웹 사이트는 색상과 더불어 다른 지표들도 사용한다.", "why": "본문은 접근성 있는 웹 사이트가 색상과 함께 **다른 지표들도 사용한다(use other indicators)**예요. 'avoid(피한다)'는 정반대예요."}]}, {"part": "❻", "title": "점선·실선으로 구별", "flow": "초록 점선과 파란 실선처럼 색과 모양을 함께 쓰면 모두가 선을 구별할 수 있어요.", "items": [{"no": 1, "en": "A graph might use both color and pattern differences to make lines easier to tell apart.", "ans": "T", "ko": "그래프는 선을 더 구별하기 쉽게 하려고 색과 무늬 차이를 모두 사용할 수 있다.", "eve": "For example, a line in green may also be dotted, while a line in blue is solid. This ensures that everyone can tell the two lines apart.", "evk": "예를 들어, 녹색 선은 점선일 수도 있는 반면에, 파란색 선은 실선이다. 이는 모든 이가 두 선을 구별할 수 있도록 한다.", "why": "녹색 선은 **dotted(점선)**, 파란 선은 solid(실선)로 색과 모양을 함께 써요. pattern differences는 점선·실선의 차이를 말해요."}]}, {"part": "❼", "title": "모두에게 이로운 접근성", "flow": "접근성 기능은 장애인만이 아니라 모두에게 이롭고, 더 차별 없는 온라인 경험을 줘요.", "items": [{"no": 1, "en": "Website accessibility helps everyone, not just people with disabilities.", "ans": "T", "ko": "웹 사이트 접근성은 장애가 있는 사람들뿐만 아니라 모든 사람을 돕는다.", "eve": "The accessibility features of websites don’t just help people with disabilities.", "evk": "웹 사이트의 접근성 특징들은 단지 장애가 있는 사람들만을 돕는 것이 아니다.", "why": "**don’t just help people with disabilities**(장애인만 돕는 것이 아니다)를 바꿔 쓴 문장이에요."}, {"no": 2, "en": "Easy-to-use websites let all users enjoy a more inclusive online experience.", "ans": "T", "ko": "사용하기 쉬운 웹 사이트는 모든 사용자가 더 차별 없는 온라인 경험을 누리게 해 준다.", "eve": "When websites are easy to navigate and understand, we can all benefit from a more inclusive online experience.", "evk": "웹 사이트가 탐색하고 이해하기에 더 쉬울 때, 우리는 더 차별 없는 온라인 경험으로부터 득을 볼 수 있다.", "why": "**we can all benefit from a more inclusive online experience**의 바꿔 쓰기예요."}]}, {"part": "C", "title": "읽고 쓰는 방식은 문화마다 달라요", "flow": "읽고 쓰는 방식은 문화마다 달라서, 서양은 왼쪽에서 오른쪽, 중동은 오른쪽에서 왼쪽이에요.", "items": [{"no": 1, "en": "Ways of reading and writing vary among cultures.", "ans": "T", "ko": "읽고 쓰는 방식은 문화마다 다르다.", "eve": "Reading and writing systems are different across cultures.", "evk": "읽기와 쓰기 체계는 문화마다 다르다.", "why": "**Reading and writing systems are different across cultures.**를 바꿔 쓴 맞는 문장이에요. vary는 be different와 같은 뜻이에요."}, {"no": 2, "en": "In Middle Eastern societies, text is usually read starting from the left side.", "ans": "F", "ko": "중동 사회에서는 글이 보통 왼쪽에서 시작해 읽힌다.", "eve": "People from Western cultures read and write from left to right, while those from some Middle Eastern cultures read and write from right to left.", "evk": "서양 문화 출신의 사람들은 왼쪽에서 오른쪽으로 읽고 쓰는 반면, 일부 중동 문화 출신의 사람들은 오른쪽에서 왼쪽으로 읽고 쓴다.", "why": "중동 문화는 **오른쪽에서 왼쪽**으로 읽고 써요. 왼쪽에서 시작하는 것은 서양 문화예요."}]}, {"part": "C", "title": "방향 차이와 웹 사이트", "flow": "동양에는 위에서 아래로 읽는 문화도 있고, 세계적 웹 사이트는 이런 차이를 고려해 로고·검색 버튼 위치를 바꿔요.", "items": [{"no": 1, "en": "People in some Eastern countries read and write in an upward direction.", "ans": "F", "ko": "일부 동양 국가의 사람들은 위쪽 방향으로 읽고 쓴다.", "eve": "People from some Eastern cultures, like that of Japan, read and write from top to bottom.", "evk": "일본과 같은 일부 동양 문화 출신 사람들은 위에서 아래로 읽고 쓴다.", "why": "일본 같은 일부 동양 문화는 **위에서 아래로(from top to bottom)** 읽고 써요. upward(위쪽으로)는 반대예요."}, {"no": 2, "en": "Many international websites change their layout depending on how people read in each region.", "ans": "T", "ko": "많은 국제 웹 사이트는 각 지역에서 사람들이 읽는 방식에 따라 레이아웃을 바꾼다.", "eve": "Some global websites take these differences into consideration and adjust their websites for people in different regions. In countries where text is read from right to left, the website’s search button is on the left and the logo is on the right.", "evk": "몇몇 세계적인 웹 사이트는 이러한 차이를 고려하고 다른 지역의 사람들을 위해 그들의 웹 사이트를 조정한다. 글이 오른쪽에서 왼쪽으로 읽히는 국가에서는 웹 사이트의 검색 버튼이 왼쪽에 있고 로고가 오른쪽에 있다.", "why": "**Some global websites take these differences into consideration and adjust their websites**를 바꿔 쓴 문장이에요. 검색 버튼·로고 위치가 바뀌는 것이 예시예요."}, {"no": 3, "en": "When a language is read from right to left, the website’s logo appears on the left.", "ans": "F", "ko": "언어가 오른쪽에서 왼쪽으로 읽힐 때 웹 사이트의 로고는 왼쪽에 나타난다.", "eve": "In countries where text is read from right to left, the website’s search button is on the left and the logo is on the right.", "evk": "글이 오른쪽에서 왼쪽으로 읽히는 국가에서는 웹 사이트의 검색 버튼이 왼쪽에 있고 로고가 오른쪽에 있다.", "why": "본문은 검색 버튼이 **왼쪽**, 로고가 **오른쪽**이에요. 로고와 검색 버튼 위치가 뒤바뀐 문장이에요."}]}]};

if(WEMPTY){nav.style.display='none';wnEmpty(wn)}else if(!D.groups.length){nav.style.display='none';var _e=document.createElement('div');_e.style.cssText='margin:24px 0;padding:18px;border:1px solid #d6d3d1;border-radius:12px;text-align:center;font-size:16px';_e.textContent='이 범위에는 본문과 다른 문장 찾기 문제가 없어요.';wn.parentNode.insertBefore(_e,wn.nextSibling)}
function wnWrong(g){WN.add({kind:'L4',part:PART,act:'find',qid:String(g._i),label:'본문 '+g.part+' · '+g.title});wnRender(wn,false)}
var secs={};
D.parts.forEach(function(p){var b=el('button',null,p[1]);b.onclick=function(){secs[p[0]].scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b)});
var bClose=el('button','closeall','답 모두 닫기');bClose.onclick=function(){S={};save();paint();window.scrollTo({top:0,behavior:'smooth'})};nav.insertBefore(bClose,nav.firstChild);nav.appendChild(prog);
var cards=[];
D.parts.forEach(function(p){
  var h=el('h2',null,p[1]);root.appendChild(h);secs[p[0]]=h;
  D.groups.forEach(function(g,gi){
    if(g.part!==p[0])return;
    var card=el('div','grp'),head=el('div','gh');
    head.appendChild(el('div','gt',g.title));
    var cnt=el('span','cnt','');head.appendChild(cnt);card.appendChild(head);
    var nF=g.items.filter(function(i){return i.ans==='F'}).length;
    card.appendChild(el('div','ask',nF?('본문과 다른 문장이 '+nF+'개 있어요. 찾아서 눌러 보세요.'):'본문과 다른 문장이 있을 수도, 없을 수도 있어요. 모두 눌러서 확인해 보세요.'));
    var btns=[];
    g.items.forEach(function(it,ii){
      var b=el('div','it');b.setAttribute('role','button');b.tabIndex=0;
      var line=el('div');line.appendChild(el('span','no',(ii+1)+'.'));line.appendChild(document.createTextNode(' '+it.en));b.appendChild(line);
      var pn=el('div','pn');
      pn.appendChild(el('div','ko',it.ko));
      var ev=el('div','ev');ev.appendChild(el('span','e',it.eve));if(it.evk)ev.appendChild(el('span','k',it.evk));
      pn.appendChild(el('span','tag','본문 근거'));pn.appendChild(ev);
      pn.appendChild(el('span','tag','해설'));var w=el('div','why');rich(w,it.why);pn.appendChild(w);
      b.appendChild(pn);
      var id=gi+'-'+ii;
      function open(){
        if(b.classList.contains('open'))return;
        var fd=btns.filter(function(x){return S[x.id]&&x.it.ans==='F'}).length;
        if(it.ans==='T'&&fd<nF)wnWrong(g);
        S[id]=1;save();paint(true);
      }
      b.onclick=open;b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
      card.appendChild(b);btns.push({b:b,id:id,it:it,pn:pn});
    });
    var tools=el('div','tools');
    var bAll=el('button',null,'나머지 해설 모두 열기');bAll.onclick=function(){var fd=btns.filter(function(x){return S[x.id]&&x.it.ans==='F'}).length;if(fd<nF)wnWrong(g);btns.forEach(function(x){S[x.id]=1});save();paint(true)};
    var bReset=el('button',null,'이 소단락 다시 하기');bReset.onclick=function(){btns.forEach(function(x){delete S[x.id]});save();paint()};
    tools.appendChild(bAll);tools.appendChild(bReset);card.appendChild(tools);
    var flow=el('div','flow');flow.appendChild(el('span','tag','이 소단락 정리'));flow.appendChild(document.createTextNode(g.flow));card.appendChild(flow);
    root.appendChild(card);
    cards.push({g:g,btns:btns,cnt:cnt,flow:flow,nF:nF});
  });
});
function paint(user){
  var done=0;
  cards.forEach(function(c){
    var found=0,all=true;
    c.btns.forEach(function(x){
      var o=!!S[x.id];
      x.b.classList.toggle('open',o);
      x.b.classList.remove('ok','no2');
      var old=x.b.querySelector('.badge');if(old)old.remove();
      if(o){
        var f=x.it.ans==='F';x.b.classList.add(f?'ok':'no2');
        if(f)found++;
        var bd=el('span','badge',f?'✔ 본문과 다른 문장 · 잘 찾았어요':'본문과 같은 내용이에요 · 맞는 문장');
        x.b.insertBefore(bd,x.pn);
      }
      if(!o)all=false;
    });
    var fin=found===c.nF&&(c.nF>0||c.btns.every(function(x){return !!S[x.id]}));
    c.cnt.textContent=c.nF?('다른 문장 '+found+'/'+c.nF+' 찾음'):(c.btns.every(function(x){return !!S[x.id]})?'모두 확인':'확인 중');
    c.cnt.classList.toggle('done',fin);
    c.flow.classList.toggle('on',fin);
    if(fin)done++;
  });
  prog.textContent='소단락 '+done+'/'+cards.length+' 확인';
  if(user&&cards.length&&done===cards.length&&!S._m){S._m=1;save();if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}
  if(WN.MODE&&cards.length)wnRender(wn,done===cards.length);
}
paint();
