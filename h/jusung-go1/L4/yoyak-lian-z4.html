<script>
var DATA={"meta": {"sch": "jusung-go1", "src": "jusung-go1/L4/sx-data.js", "pidx": 3, "lesson": "4과", "title": "웹 접근성 (Web Accessibility)", "label": "❹", "page": "yoyak-lian-z4"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "손의 움직임을 [[limit|제한하는]] 장애가 있는 사람들은 마우스 대신 키보드에 [[rely|의존한다]].", "en": ["Some users have disabilities that limit the movement of their hands.", "They rely on their keyboards, rather than a mouse, to navigate websites."], "kos": ["일부 사용자들은 그들의 손의 움직임을 제한하는 장애를 가지고 있다.", "그들은 웹 사이트를 탐색하기 위해 마우스보다는 키보드에 의존한다."]}, {"tag": "본문 4~5번", "ns": [4, 5], "line": "링크, 버튼, 필드까지 키보드만으로 [[accessed|접근]]하고, 스페이스 바, 화살표, 엔터, 탭 키를 쓴다.", "en": ["This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "Users navigate the websites by making use of keys such as the space bar, the arrow keys, the enter key, and the tab key."], "kos": ["이는 링크, 버튼 그리고 정보가 입력되는 공간인 필드가 키보드 탐색을 통해 접근될 수 있다는 것을 의미한다.", "사용자는 스페이스 바, 화살표 키, 엔터 키 그리고 탭 키와 같은 키를 사용함으로써 웹 사이트를 탐색한다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "탭 키로 한 부분에서 다른 부분으로 [[jump|뛰어넘으면]], 잠깐 손을 다친 사람도 [[benefit|득을 본다]].", "en": ["For example, they can use the tab key to jump from one part of a web page to another.", "Both users with disabilities and those with temporarily injured hands can benefit from this kind of navigation."], "kos": ["예를 들어, 그들은 웹 페이지의 한 부분에서 다른 부분으로 뛰어넘기 위해 탭 키를 사용할 수 있다.", "장애를 가진 사용자와 일시적으로 손을 다친 사용자 모두가 이러한 종류의 탐색으로부터 득을 본다."]}, {"tag": "본문 8~12번", "ns": [8, 10, 11, 12], "line": "색맹은 색 구별이 [[difficult|어려워서]], 색 말고 점선·실선 같은 표시도 함께 쓰고, 모두가 두 선을 구별하게 [[ensures|보장한다]].", "en": ["Color blindness is a common visual disability. People with color blindness find it difficult to tell some colors apart.", "Accessible websites use other indicators along with the colors.", "For example, a line in green may also be dotted, while a line in blue is solid.", "This ensures that everyone can tell the two lines apart."], "kos": ["색맹은 흔한 시각 장애이다. 색맹인 사람들은 몇몇 색들을 구별하는 것을 어렵다고 여긴다.", "접근성 있는 웹 사이트는 색상과 더불어 다른 지표들도 사용한다.", "예를 들어, 녹색 선은 점선일 수도 있는 반면에, 파란색 선은 실선이다.", "이는 모든 이가 두 선을 구별할 수 있도록 한다."]}], "story": [{"a": "limit", "form": "limit", "n": 1, "sq": 1, "sum": "disabilities that [[restrict]] their hand movement", "hook": "손의 움직임을 막는 장애 이야기에 나온 limit(제한하다) → 요약문에서는 restrict(제한하다)로 바꿨어요.", "b": "restrict", "k": "제한하다 → 제한하다, 제약하다", "en": "Some users have disabilities that limit the movement of their hands.", "ko": "일부 사용자들은 그들의 손의 움직임을 제한하는 장애를 가지고 있다."}, {"a": "rely", "form": "rely", "n": 2, "sq": 1, "sum": "so they [[depend]] on keyboards", "hook": "마우스 대신 키보드에 기댄다는 문장의 rely(의존하다) → 요약문에서는 depend(의존하다)로 바꿨어요.", "b": "depend", "k": "의존하다 → 기대다, 의존하다", "en": "They rely on their keyboards, rather than a mouse, to navigate websites.", "ko": "그들은 웹 사이트를 탐색하기 위해 마우스보다는 키보드에 의존한다."}, {"a": "access", "form": "accessed", "n": 4, "sq": 2, "sum": "can be [[reached]] with the keyboard alone", "hook": "링크, 버튼, 필드에 키보드로 간다는 문장의 accessed(접근되다) → 요약문에서는 reached(닿다)로 바꿨어요.", "b": "reach", "k": "접근하다 → 닿다, 도달하다", "en": "This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "ko": "이는 링크, 버튼 그리고 정보가 입력되는 공간인 필드가 키보드 탐색을 통해 접근될 수 있다는 것을 의미한다."}, {"a": "jump", "form": "jump", "n": 6, "sq": 3, "sum": "lets users [[leap]] from one part of a web page to another", "hook": "탭 키로 한 부분에서 다른 부분으로 건너뛰는 문장의 jump(뛰어넘다) → 요약문에서는 leap(뛰어오르다)으로 바꿨어요.", "b": "leap", "k": "뛰어넘다 → 뛰어오르다, 건너뛰다", "en": "For example, they can use the tab key to jump from one part of a web page to another.", "ko": "예를 들어, 그들은 웹 페이지의 한 부분에서 다른 부분으로 뛰어넘기 위해 탭 키를 사용할 수 있다."}, {"a": "benefit", "form": "benefit", "n": 7, "sq": 3, "sum": "is [[helpful]] both to users with disabilities", "hook": "장애가 있는 사람도 잠깐 다친 사람도 덕을 본다는 문장의 benefit(득을 보다) → 요약문에서는 helpful(도움이 되는)로 바꿨어요.", "b": "helpful", "k": "득을 보다 → 도움이 되는", "en": "Both users with disabilities and those with temporarily injured hands can benefit from this kind of navigation.", "ko": "장애를 가진 사용자와 일시적으로 손을 다친 사용자 모두가 이러한 종류의 탐색으로부터 득을 본다."}, {"a": "difficult", "form": "difficult", "n": 8, "sq": 4, "sum": "find it [[hard]] to tell some colors apart", "hook": "색맹이 색을 구별하기 힘들다는 문장의 difficult(어려운) → 요약문에서는 hard(힘든)로 바꿨어요.", "b": "hard", "k": "어려운 → 힘든, 어려운", "en": "Color blindness is a common visual disability. People with color blindness find it difficult to tell some colors apart.", "ko": "색맹은 흔한 시각 장애이다. 색맹인 사람들은 몇몇 색들을 구별하는 것을 어렵다고 여긴다."}, {"a": "ensure", "form": "ensures", "n": 12, "sq": 4, "sum": "which [[guarantees]] that everyone can tell the two lines apart", "hook": "점선과 실선이면 모두 두 선을 구별한다는 문장의 ensures(확실히 하다) → 요약문에서는 guarantees(보장하다)로 바꿨어요.", "b": "guarantee", "k": "확실히 하다 → 보장하다", "en": "This ensures that everyone can tell the two lines apart.", "ko": "이는 모든 이가 두 선을 구별할 수 있도록 한다."}], "passage": [{"n": 1, "en": "Some users have disabilities that limit the movement of their hands.", "ko": "일부 사용자들은 그들의 손의 움직임을 제한하는 장애를 가지고 있다."}, {"n": 2, "en": "They rely on their keyboards, rather than a mouse, to navigate websites.", "ko": "그들은 웹 사이트를 탐색하기 위해 마우스보다는 키보드에 의존한다."}, {"n": 3, "en": "On accessible websites, users can access everything on the site using only a keyboard.", "ko": "접근성 있는 웹 사이트에서, 사용자는 키보드만을 사용하여 사이트에 있는 모든 것에 접근할 수 있다."}, {"n": 4, "en": "This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "ko": "이는 링크, 버튼 그리고 정보가 입력되는 공간인 필드가 키보드 탐색을 통해 접근될 수 있다는 것을 의미한다."}, {"n": 5, "en": "Users navigate the websites by making use of keys such as the space bar, the arrow keys, the enter key, and the tab key.", "ko": "사용자는 스페이스 바, 화살표 키, 엔터 키 그리고 탭 키와 같은 키를 사용함으로써 웹 사이트를 탐색한다."}, {"n": 6, "en": "For example, they can use the tab key to jump from one part of a web page to another.", "ko": "예를 들어, 그들은 웹 페이지의 한 부분에서 다른 부분으로 뛰어넘기 위해 탭 키를 사용할 수 있다."}, {"n": 7, "en": "Both users with disabilities and those with temporarily injured hands can benefit from this kind of navigation.", "ko": "장애를 가진 사용자와 일시적으로 손을 다친 사용자 모두가 이러한 종류의 탐색으로부터 득을 본다."}, {"n": 8, "en": "Color blindness is a common visual disability. People with color blindness find it difficult to tell some colors apart.", "ko": "색맹은 흔한 시각 장애이다. 색맹인 사람들은 몇몇 색들을 구별하는 것을 어렵다고 여긴다."}, {"n": 9, "en": "This can cause problems, especially when graphs and charts only use colors to show the differences between sets of information.", "ko": "이는 특히 그래프와 차트가 정보 세트들 간의 차이를 나타내기 위해 색상만을 사용할 때 문제를 일으킬 수 있다."}, {"n": 10, "en": "Accessible websites use other indicators along with the colors.", "ko": "접근성 있는 웹 사이트는 색상과 더불어 다른 지표들도 사용한다."}, {"n": 11, "en": "For example, a line in green may also be dotted, while a line in blue is solid.", "ko": "예를 들어, 녹색 선은 점선일 수도 있는 반면에, 파란색 선은 실선이다."}, {"n": 12, "en": "This ensures that everyone can tell the two lines apart.", "ko": "이는 모든 이가 두 선을 구별할 수 있도록 한다."}], "questions": [{"id": 1, "summary": "Some users have disabilities that (A) their hand movement, so they (B) on keyboards instead of a mouse to navigate websites.", "ko": "일부 사용자들은 손의 움직임을 <b>(A) 제한하는</b> 장애가 있어서, 마우스 대신 키보드에 <b>(B) 의존해</b> 웹 사이트를 탐색한다.", "opts": [["restrict", "insist"], ["improve", "depend"], ["restrict", "depend"], ["improve", "insist"], ["allow", "insist"]], "optko": ["제한하다 – 고집하다", "나아지게 하다 – 의존하다", "제한하다 – 의존하다", "나아지게 하다 – 고집하다", "허락하다 – 고집하다"], "ans": 2, "wrong": ["insist(고집하다, 우기다)가 틀려요. 키보드를 우기는 게 아니라 마우스를 못 써서 키보드에 기대는(rely on) 거예요.", "improve(나아지게 하다)가 틀려요. 장애는 손의 움직임을 나아지게 하는 게 아니라 제한(limit)해요.", null, "둘 다 틀려요. 장애가 손의 움직임을 나아지게 한다는 말도, 키보드를 고집한다는 말도 본문에 없어요.", "둘 다 틀려요. allow(허락하다)가 아니라 손의 움직임을 제한(limit)하고, insist(고집하다)가 아니라 키보드에 의존(rely)해요."], "evid": [{"n": 1, "hl": ["limit the movement of their hands"]}, {"n": 2, "hl": ["rely on their keyboards"]}], "swaps": [["limit", "restrict", "제한하다 → 제한하다, 제약하다"], ["rely", "depend", "의존하다 → 기대다, 의존하다"], ["movement of their hands", "their hand movement", "손의 움직임 → 손 움직임"]], "swapnote": "limit(제한하다)는 restrict(제한하다)로, rely on(~에 의존하다)은 depend on(~에 기대다)으로 바뀌어 나와요. 뜻이 같은 짝으로 외워 두세요.", "use": [{"w": "restrict", "ex": "Heavy rain can restrict traffic on the road.", "ko": "폭우는 도로의 교통을 제한할 수 있다.", "wk": "제한하다", "hk": "제한할"}, {"w": "depend", "ex": "Young children depend on their parents.", "ko": "어린아이들은 부모에게 의존한다.", "wk": "의존하다", "hk": "의존한다"}], "flow": "본문 1번에서 손을 자유롭게 못 쓰는 장애가 나오고, 2번에서 그래서 마우스 대신 키보드에 의존한다고 이어져요.", "jd": [["Some users have disabilities that [[restrict]] their hand movement,", "일부 사용자들은 손의 움직임을 [[제한하는]] 장애가 있다,"], ["so they [[depend]] on keyboards", "그래서 그들은 키보드에 [[의존한다]]"], ["instead of a mouse", "마우스 대신"], ["to navigate websites.", "웹 사이트를 탐색하기 위해."]], "fc": [["본문 1번", "손의 움직임이 불편한 사용자들", "장애 때문에 손을 자유롭게 쓰기 어려워요."], ["본문 2번", "마우스 대신 키보드에 기댄다", "키보드로 웹 사이트를 돌아다녀요."], ["정답 포인트", "{{limit|제한하다}} = {{restrict|제한하다}}, {{rely|의존하다}} = {{depend|의존하다}}", "본문 단어가 뜻이 같은 말로 바뀌어 나와요."]], "evid_full": [{"en": "Some users have disabilities that limit the movement of their hands.", "ko": "일부 사용자들은 그들의 손의 움직임을 제한하는 장애를 가지고 있다.", "hl": ["limit the movement of their hands"], "hlko": ["그들의 손의 움직임을 제한하는"], "n": 1}, {"en": "They rely on their keyboards, rather than a mouse, to navigate websites.", "ko": "그들은 웹 사이트를 탐색하기 위해 마우스보다는 키보드에 의존한다.", "hl": ["rely on their keyboards"], "hlko": ["키보드에 의존한다"], "n": 2}]}, {"id": 2, "summary": "On accessible websites, links, buttons, and fields can be (A) with the keyboard alone, since users move around by (B) keys such as the tab key.", "ko": "접근성 있는 웹 사이트에서는 사용자가 탭 키 같은 키를 <b>(B) 활용해</b> 이동하기 때문에, 링크, 버튼, 필드를 키보드만으로 <b>(A) 접근할</b> 수 있다.", "opts": [["reached", "ignoring"], ["avoided", "utilizing"], ["hidden", "ignoring"], ["replaced", "avoiding"], ["reached", "utilizing"]], "optko": ["닿을 수 있는 – 무시하는", "피해지는 – 활용하는", "숨겨진 – 무시하는", "대체된 – 피하는", "닿을 수 있는 – 활용하는"], "ans": 4, "wrong": ["ignoring(무시하다)이 틀려요. 사용자는 키를 무시하는 게 아니라 키를 사용(make use of)해서 웹 사이트를 돌아다녀요.", "avoided(피하다)가 틀려요. 링크와 버튼은 피하는 게 용함으로써"], "n": 5}]}, {"id": 3, "summary": "The tab key lets users (A) from one part of a web page to another, and this kind of keyboard navigation is (B) both to users with disabilities and to people with temporarily injured hands.", "ko": "탭 키는 웹 페이지의 한 부분에서 다른 부분으로 <b>(A) 뛰어넘게</b> 해 주며, 이런 키보드 탐색은 장애가 있는 사용자와 일시적으로 손을 다친 사람들 모두에게 <b>(B) 도움이 된다</b>.", "opts": [["leap", "harmful"], ["leap", "helpful"], ["stay", "helpful"], ["stay", "harmful"], ["wait", "useless"]], "optko": ["뛰어넘다 – 해로운", "뛰어넘다 – 도움이 되는", "머무르다 – 도움이 되는", "머무르다 – 해로운", "기다리다 – 쓸모없는"], "ans": 1, "wrong": ["harmful(해로운)이 틀려요. 본문은 키보드 탐색이 둘 다에게 득(benefit)이 된다고 해요.", null, "stay(머무르다)가 틀려요. 탭 키는 한곳에 머무르는 게 아니라 한 부분에서 다른 부분으로 뛰어넘게(jump) 해 줘요.", "둘 다 틀려요. 머무른다는 말도, 해롭다는 말도 본문과 반대예요.", "둘 다 틀려요. 기다린다는 말도, 쓸모없다는 말도 본문에 없어요. 오히려 둘 다 득을 봐요."], "evid": [{"n": 6, "hl": ["jump from one part of a web page to another"]}, {"n": 7, "hl": ["temporarily injured hands", "benefit from this kind of navigation"]}], "swaps": [["jump", "leap", "뛰어넘다 → 뛰어오르다, 건너뛰다"], ["benefit", "helpful", "득을 보다 → 도움이 되는"], ["those with", "people with", "~를 가진 사람들 → ~를 가진 사람들"]], "swapnote": "jump(뛰어넘다)는 leap(뛰어오르다)으로 바뀔 수 있어요. benefit(득을 보다)은 helpful(도움이 되는)이나 useful(유용한)처럼 모양이 달라지기도 해요.", "use": [{"w": "leap", "ex": "The cat can leap over the fence.", "ko": "그 고양이는 울타리를 뛰어넘을 수 있다.", "wk": "뛰어넘다, 뛰어오르다", "hk": "뛰어넘을"}, {"w": "helpful", "ex": "A map is helpful when you travel.", "ko": "여행할 때 지도는 도움이 된다.", "wk": "도움이 되는", "hk": "도움이 된다"}], "flow": "본문 6번에서 탭 키로 한 부분에서 다른 부분으로 건너뛰는 예시가 나오고, 7번에서 장애가 있는 사람도, 잠시 손을 다친 사람도 도움을 받는다고 정리해요.", "jd": [["The tab key lets users [[leap]]", "탭 키는 사용자들이 [[뛰어넘도록]] 해 준다"], ["from one part of a web page to another,", "웹 페이지의 한 부분에서 다른 부분으로,"], ["and this kind of keyboard navigation is [[helpful]]", "그리고 이런 종류의 키보드 탐색은 [[도움이 된다]]"], ["both to users with disabilities", "장애가 있는 사용자 모두에게"], ["and to people with temporarily injured hands.", "그리고 일시적으로 손을 다친 사람들에게도."]], "fc": [["본문 6번", "탭 키로 한 부분에서 다른 부분으로", "{{ju /* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}



function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){return; /* 바꿔 말하기 단어는 선생님 질문 목록에 따로 올리지 않는다: 학생 목록 = 선생님 열람 목록 */
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={},swStarOnly=false;
var K_STAR='vhsw:'+SCH+':'+(function(){try{return LS.getItem('wn_name')||''}catch(e){return ''}})();
var STAR=jget(K_STAR,{});
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../yoyak.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+(EVK[String(q.id)]||q.evid_full.map(function(e){return [e.n]})).map(function(e){return e[0]+'번'}).join(', ')+'</p>';
    var EVS=EVK[String(q.id)];
    if(EVS)EVS.forEach(function(e){h+='<div class="ev"><div class="kk"><b class="evn">'+e[0]+'번</b> '+e[1]+'</div></div>'});
    else q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button><button class="btn sec" data-a="home">목록으로</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+='<button class="btn pri" data-a="sw">바꿔 말하기 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}

var EVK={};
var REL={};
function relBox(s){
  var r=REL[String(s.a).toLowerCase()];if(!r)return '';
  var it=[{t:s.b,k:String(s.k).split(' → ')[1]||'',c:'k'}];
  r.s.forEach(function(x){it.push({t:x[0],k:x[1],c:'s'})});
  r.a.forEach(function(x){it.push({t:x[0],k:x[1],c:'a'})});
  var P={1:[[50,80]],2:[[26,78],[74,78]],3:[[16,70],[50,86],[84,70]],4:[[14,62],[36,86],[64,86],[86,62]],5:[[12,56],[28,86],[50,92],[72,86],[88,56]]}[it.length],svg='',nd='';
  it.forEach(function(x,j){
    svg+='<line x1="50%" y1="26%" x2="'+P[j][0]+'%" y2="'+(P[j][1]-7)+'%" stroke="'+(x.c=='a'?'#c0392b':'#2f5d50')+'" stroke-width="2"/>';
    nd+='<div class="rn '+x.c+'" style="left:'+P[j][0]+'%;top:'+P[j][1]+'%">'+esc(x.t)+(x.k?'<small>'+esc(x.k)+'</small>':'')+'</div>';
  });
  var left=String(s.k).split(' → ')[0];
  var h='<div class="relx"><div class="rmap"><svg>'+svg+'</svg><div class="rn c" style="left:50%;top:26%">'+esc(s.a)+'<small>'+esc(left)+'</small></div>'+nd+'</div>'
   +'<div class="rleg"><span><i style="border-color:#2f5d50"></i>바꿔 쓸 수 있는 말</span>'+(r.a.length?'<span><i style="border-color:#c0392b"></i>반대말</span>':'')+'</div>'
   +'<div class="pit"><div><em>본문</em>'+r.bj+'</div><div><em>요약문</em><b>'+esc(s.b)+'</b>('+esc(String(s.k).split(' → ')[1]||'')+')로 바뀜</div>'+(r.tr?'<div class="tp"><em>함정</em>'+esc(r.tr)+'</div>':'')+'</div></div>';
  return h;
}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button><button data-a="staronly" class="'+(swStarOnly?'on':'')+'">별표만 '+Object.keys(STAR).length+'</button></div><div class="card">';
  if(swStarOnly)L=L.filter(function(s){return STAR[s.id]});
  if(!L.length)h+='<div class="empty">별표 친 단어가 없어요. 안 외워지는 단어에 별표를 눌러 두세요.</div>';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button><button data-a="star" data-v="'+esc(s.id)+'" class="stb'+(STAR[s.id]?' on':'')+'">별표</button></div>';
    if(o)h+=relBox(s);else if(REL[String(s.a).toLowerCase()]){var rr=REL[String(s.a).toLowerCase()];h+='<div class="hch">유 '+(1+rr.s.length)+(rr.a.length?' · 반 '+rr.a.length:'')+'</div>'}
    if(c&&!REL[String(s.a).toLowerCase()])h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p><button class="btn sec" data-a="home">목록으로</button>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
