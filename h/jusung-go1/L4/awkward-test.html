var Q=[{"id": "ctx1", "kind": "ctx", "n": 1, "title": null, "tko": null, "paras": [[{"t": "Imagine you have fallen down and broken your right arm. There are some things that would be "}, {"t": "difficult", "c": 1}, {"t": " to do with your injured arm. For example, you might not be able to carry heavy boxes or ride your bike. What about accessing the Internet? If you are right-handed, using a computer mouse or touchscreen with your "}, {"t": "right", "c": 2}, {"t": " hand would be awkward and take a lot of time."}], [{"t": "However, this is a "}, {"t": "major", "c": 3}, {"t": " challenge compared to what some of us face on the Internet. For people with certain disabilities, many websites can be nearly "}, {"t": "possible", "c": 4}, {"t": " to use. This is the reason why web accessibility is "}, {"t": "important", "c": 5}, {"t": ". Web accessibility is the practice of making sure that websites can be used by everyone, including people with disabilities. So what exactly makes a website "}, {"t": "accessible", "c": 6}, {"t": "? Here are some common features of accessible websites."}]], "items": [{"c": 2, "w": "right", "r": "left", "gw": "오른쪽의", "gr": "왼쪽의", "fb": null, "fg": "If you are right-handed, using a computer mouse or touchscreen with your <span class=\"d\">left</span> hand would be awkward and take a lot of time.", "ko": "만약 당신이 오른손잡이라면, 당신의 왼손으로 컴퓨터 마우스나 터치스크린을 사용하는 것은 어색하고 많은 시간이 걸릴 것이다.", "why": "If you are right-handed (만약 당신이 오른손잡이라면)라고 했고 다친 팔은 오른팔이에요. 그래서 쓸 수 있는 건 left hand (왼손)뿐이고, 왼손으로 마우스를 쓰면 어색하고 오래 걸린다는 내용이 이어져요. right hand (오른손)는 다친 팔이라 앞뒤가 맞지 않아요."}, {"c": 3, "w": "major", "r": "minor", "gw": "큰", "gr": "작은", "fb": null, "fg": "However, this is a <span class=\"d\">minor</span> challenge compared to what some of us face on the Internet.", "ko": "그러나 이것은 우리 중 몇몇이 인터넷에서 직면하는 것에 비해 작은 문제이다.", "why": "compared to what some of us face on the Internet (우리 중 몇몇이 인터넷에서 직면하는 것에 비해)가 이어져요. 장애가 있는 사람들이 겪는 훨씬 큰 어려움과 비교하면 다친 팔의 불편은 minor (작은) 문제예요."}, {"c": 4, "w": "possible", "r": "impossible", "gw": "가능한", "gr": "불가능한", "fb": null, "fg": "For people with certain disabilities, many websites can be nearly <span class=\"d\">impossible</span> to use.", "ko": "특정 장애가 있는 사람들에게는, 많은 웹 사이트가 사용하기에 거의 불가능할 수 있다.", "why": "For people with certain disabilities (특정 장애가 있는 사람들에게는) 어려움이 훨씬 크다는 문장이에요. many websites can be nearly impossible to use (많은 웹 사이트가 사용하기에 거의 불가능할 수 있다)라야 어려움이 크다는 흐름이 이어져요. nearly possible (거의 가능한)은 문제가 되지 않아요."}], "keep": "difficult (어려운)는 다친 팔로 하기에 어려운 일들이라 맞고, important (중요한)는 웹 접근성이 중요한 이유라서 맞아요. accessible (접근 가능한)도 접근성 있는 웹 사이트 이야기라서 그대로 둬요.", "flow": "다친 팔로 겪는 불편에서 시작해서, 장애가 있는 사람들이 웹에서 겪는 더 큰 어려움을 말하고, 그래서 웹 접근성이 중요하다는 쪽으로 이어지는 글이에요. 작은 불편과 큰 어려움을 비교하는 흐름이 깨지는 곳이 답이에요.", "ko": "당신이 넘어져 당신의 오른팔이 부러졌다고 상상해 보라. 당신의 다친 팔로 하기에 어려울 몇몇 일들이 있다. 예를 들어, 당신은 무거운 상자를 옮기거나 자전거를 타지 못할 수도 있다. 인터넷에 접속하는 것은 어떨까? 만약 당신이 오른손잡이라면, 당신의 왼손으로 컴퓨터 마우스나 터치스크린을 사용하는 것은 어색하고 많은 시간이 걸릴 것이다. 그러나 이것은 우리 중 몇몇이 인터넷에서 직면하는 것에 비해 작은 문제이다. 특정 장애가 있는 사람들에게는, 많은 웹 사이트가 사용하기에 거의 불가능할 수 있다. 이것이 웹 접근성이 중요한 이유이다. 웹 접근성은 웹 사이트가 장애가 있는 사람들을 포함하여 반드시 모두에게 사용될 수 있도록 하는 실천이다. 그렇다면 무엇이 정확히 웹 사이트를 접근 가능하게 만들까? 여기 접근성 있는 웹 사이트들의 몇 가지 공통점이 있다."}, {"id": "ctx2", "kind": "ctx", "n": 2, "title": null, "tko": null, "paras": [[{"t": "Along with text, most websites "}, {"t": "include", "c": 1}, {"t": " other forms of information, such as images. Sometimes such "}, {"t": "virtual", "c": 2}, {"t": " information is important for understanding the text. This is a problem for users with visual disabilities. When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images."}], [{"t": "Accessible websites solve this problem by providing alternative text, also known as “alt text.” Alt text is a "}, {"t": "detailed", "c": 3}, {"t": " description of non-textual information. For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing. Screen readers can detect this alt text and read it "}, {"t": "aloud", "c": 4}, {"t": ". This way, alt text ensures that people with visual disabilities can access more of the information on a website."}]], "items": [{"c": 2, "w": "virtual", "r": "visual", "gw": "가상의", "gr": "시각적인", "fb": null, "fg": "Sometimes such <span class=\"d\">visual</span> information is important for understanding the text. This is a problem for users with visual disabilities.", "ko": "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다.", "why": "Sometimes such <b>visual</b> information is important for understanding the text (때로는 그러한 ~ 정보가 텍스트를 이해하는 데 중요하다) 바로 다음 문장이 This is a problem for users with visual disabilities (이는 시각 장애를 가진 사용자에게 문제이다)예요. 눈으로 보는 정보 이야기라서 visual (시각적인)이에요."}, {"c": 3, "w": "detailed", "r": "brief", "gw": "자세한", "gr": "간단한", "fb": null, "fg": "Alt text is a <span class=\"d\">brief</span> description of non-textual information.", "ko": "대체 텍스트는 비문자 정보에 대한 간단한 설명이다.", "why": "Alt text is a <b>brief</b> description of non-textual information (대체 텍스트는 글자가 아닌 정보에 대한 ~ 설명이다)에서 대체 텍스트는 이미지를 대신해 짧게 읽어 주는 글이에요. 그래서 brief (간단한)가 맞아요."}], "keep": "include (포함하다)는 웹 사이트가 이미지 같은 정보를 포함한다는 뜻이라 맞고, aloud (소리 내어)는 스크린 리더가 소리 내어 읽어 준다는 설명과 이어져서 그대로 둬요.", "flow": "스크린 리더가 이미지를 읽지 못하는 문제를 대체 텍스트로 해결한다는 글이에요. 문제, 해결, 효과 순서로 읽으며 어색한 단어를 찾아요.", "ko": "텍스트와 함께, 대부분의 웹 사이트는 이미지와 같은 다른 형식의 정보를 포함한다. 때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다. 그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다. 접근성 있는 웹 사이트는 ‘alt text’라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다. 대체 텍스트는 비문자 정보에 대한 간단한 설명이다. 예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다. 스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다. 이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다. 접근성 있는 웹 사이트는 색상과 더불어 다른 지표들도 사용한다."}, {"id": "ctx3", "kind": "ctx", "n": 3, "title": null, "tko": null, "paras": [[{"t": "In some cases, audio content cannot be accessed or "}, {"t": "understood", "c": 1}, {"t": ". Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library. Therefore, accessible websites often "}, {"t": "restrict", "c": 2}, {"t": " other ways to access information that is presented in audio form."}], [{"t": "For example, they may provide transcripts or captions that can help users "}, {"t": "access", "c": 3}, {"t": " this information. Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays. Captions "}, {"t": "exclude", "c": 4}, {"t": " not only the text version of the spoken words but also descriptions of the music and other sounds in the video."}]], "items": [{"c": 2, "w": "restrict", "r": "offer", "gw": "제한하다", "gr": "제공하다", "fb": null, "fg": "Therefore, accessible websites often <span class=\"d\">offer</span> other ways to access information that is presented in audio form.", "ko": "그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다.", "why": "Therefore (그러므로) 뒤에는 앞 내용의 결과가 와요. 소리를 못 듣는 사람이 있으니 접근성 있는 웹 사이트는 다른 접근 방법을 offer (제공하다)해요. restrict (제한하다)는 '접근성 있는'과 반대예요."}, {"c": 4, "w": "exclude", "r": "include", "gw": "제외하다", "gr": "포함하다", "fb": null, "fg": "Captions <span class=\"d\">include</span> not only the text version of the spoken words but also descriptions of the music and other sounds in the video.", "ko": "자막은 발화된 단어의 텍스트 버전뿐만 아니라 영상 내의 음악과 다른 소리들에 대한 설명도 포함한다.", "why": "Captions <b>include</b> not only the text version of the spoken words but also descriptions of the music (자막은 발화된 단어의 텍스트 버전뿐만 아니라 음악에 대한 설명도 ~한다)에서 not only A but also B는 둘 다 담는다는 뜻이에요. 그래서 include (포함하다)예요."}], "keep": "understood (이해된)는 audio content cannot be accessed or understood (음성 콘텐츠는 접근되거나 이해될 수 없다)에서 맞고, access (접근하다)도 help users access this information (사용자가 이 정보에 접근하도록 돕다)에서 맞아서 그대로 둬요.", "flow": "소리를 들을 수 없는 사람도 내용을 알 수 있도록 대본과 자막을 제공한다는 글이에요. 접근성을 높이는 방향으로 읽히는지 확인해요.", "ko": "일부 경우에, 음성 콘텐츠는 접근되거나 이해될 수 없다. 어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다. 그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다. 예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다. 대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다. 자막은 발화된 단어의 텍스트 버전뿐만 아니라 영상 내의 음악과 다른 소리들에 대한 설명도 포함한다."}, {"id": "ctx4", "kind": "ctx", "n": 4, "title": null, "tko": null, "paras": [[{"t": "Having a visual disability doesn’t necessarily mean a person can’t see at all. Some people, including many elderly people, simply have poor eyesight. This makes it "}, {"t": "easy", "c": 1}, {"t": " for them to read. For this reason, accessible websites have a background color that "}, {"t": "contrasts", "c": 2}, {"t": " with the color of their text. This makes the text "}, {"t": "unclear", "c": 3}, {"t": " enough for most people to see."}], [{"t": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it "}, {"t": "on", "c": 4}, {"t": " altogether. This gives users both with and without hearing difficulties more "}, {"t": "control", "c": 5}, {"t": " over their experience while they are using the sites."}]], "items": [{"c": 1, "w": "easy", "r": "difficult", "gw": "쉬운", "gr": "어려운", "fb": null, "fg": "Some people, including many elderly people, simply have poor eyesight. This makes it <span class=\"d\">difficult</span> for them to read.", "ko": "많은 노인들을 포함해서 일부 사람들은 그저 좋지 않은 시력을 가지고 있다. 이는 그들이 읽는 것을 어렵게 만든다.", "why": "Some people ... simply have poor eyesight (일부 사람들은 그저 시력이 좋지 않다)라고 했어요. 시력이 나쁘면 This makes it <b>difficult</b> for them to read (이는 그들이 읽는 것을 ~하게 만든다)에서 읽기가 어려워져요. 그래서 difficult (어려운)예요."}, {"c": 3, "w": "unclear", "r": "clear", "gw": "불명확한", "gr": "명확한", "fb": null, "fg": "This makes the text <span class=\"d\">clear</span> enough for most people to see.", "ko": "이는 대부분의 사람들이 보기에 텍스트를 충분히 명확하게 만들어 준다.", "why": "배경 색이 텍스트 색과 대조를 이루는 이유는 글자를 또렷하게 보이게 하려는 거예요. This makes the text <b>clear</b> enough for most people to see (이는 대부분의 사람들이 보기에 텍스트를 충분히 ~하게 만든다)에서 clear (명확한)가 맞아요."}, {"c": 4, "w": "on", "r": "off", "gw": "켜다", "gr": "끄다", "fb": null, "fg": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it <span class=\"d\">off</span> altogether.", "ko": "음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다.", "why": "allow users to adjust the volume of background sound or to turn it <b>off</b> altogether (사용자가 배경음의 음량을 조절하거나 완전히 ~도록 해준다)에서 altogether (완전히)와 어울리는 건 turn it off (완전히 끄다)예요. 소리를 조절하는 기능을 말하고 있어요."}], "keep": "contrasts (대조를 이루다)는 배경 색이 텍스트 색과 대조를 이룬다는 뜻이라 맞고, control (통제권)은 사용자에게 더 많은 통제권을 준다는 설명이라 그대로 둬요.", "flow": "시력이 나쁜 사람과 청각 장애가 있는 사람 모두가 쓰기 쉬운 웹 사이트의 특징을 말하는 글이에요. 배경 색과 음량 조절은 모두 사용자가 편하게 보고 듣도록 돕는 기능이에요.", "ko": "시각 장애를 지니고 있는 것은 반드시 한 사람이 전혀 보지 못한다는 것을 의미하지는 않는다. 많은 노인들을 포함해서 일부 사람들은 그저 좋지 않은 시력을 가지고 있다. 이는 그들이 읽는 것을 어렵게 만든다. 이러한 이유로, 접근성 있는 웹 사이트는 텍스트 색과 대조를 이루는 배경 색을 지니고 있다. 이는 대부분의 사람들이 보기에 텍스트를 충분히 명확하게 만들어 준다. 음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다. 이는 청각 장애가 있는 사용자와 없는 사용자 모두에게 그들이 사이트를 사용하는 동안 그들의 경험에 대한 더 많은 통제권을 준다."}, {"id": "ctx5", "kind": "ctx", "n": 5, "title": null, "tko": null, "paras": [[{"t": "Some users have disabilities that limit the "}, {"t": "movement", "c": 1}, {"t": " of their hands. They rely on their keyboards, rather than a mouse, to navigate websites. On accessible websites, users can access everything on the site using only a keyboard. This means that links, buttons, and fields, which are spaces where information is entered, can be "}, {"t": "limited", "c": 2}, {"t": " through keyboard navigation. Users navigate the websites by "}, {"t": "making use of", "c": 3}, {"t": " keys such as the space bar, the arrow keys, the enter key, and the tab key. For example, they can use the tab key to jump from one part of a web page to another. Both users with disabilities and those with "}, {"t": "permanently", "c": 4}, {"t": " injured hands can benefit from this kind of navigation."}]], "items": [{"c": 2, "w": "limited", "r": "accessed", "gw": "제한된", "gr": "접근된", "fb": null, "fg": "This means that links, buttons, and fields, which are spaces where information is entered, can be <span class=\"d\">accessed</span> through keyboard navigation.", "ko": "이는 링크, 버튼 그리고 정보가 입력되는 공간인 필드가 키보드 탐색을 통해 접근될 수 있다는 것을 의미한다.", "why": "앞 문장에서 users can access everything on the site using only a keyboard (사용자는 키보드만으로 사이트의 모든 것에 접근할 수 있다)라고 했어요. 이어서 링크, 버튼, 필드도 키보드 탐색을 통해 접근될 수 있다(can be accessed)는 뜻이에요. limited (제한된)는 앞 내용과 반대예요."}, {"c": 4, "w": "permanently", "r": "temporarily", "gw": "영구적으로", "gr": "일시적으로", "fb": null, "fg": "Both users with disabilities and those with <span class=\"d\">temporarily</span> injured hands can benefit from this kind of navigation.", "ko": "장애를 가진 사용자와 일시적으로 손을 다친 사용자 모두가 이러한 종류의 탐색으로부터 득을 본다.", "why": "Both users with disabilities and those with <b>temporarily</b> injured hands (장애를 가진 사용자와 ~ 손을 다친 사용자 모두)에서 둘은 서로 다른 사람들이에요. 장애 사용자와 달리 잠시 손을 다친(temporarily injured) 사람도 키보드 탐색이 도움이 된다는 뜻이에요. permanently (영구적으로)이면 장애 사용자와 구분이 사라져요."}], "keep": "movement (움직임)는 손의 움직임을 제한하는 장애라서 맞고, making use of (~을 이용하는 것)도 키를 이용해 탐색한다는 뜻이라 그대로 둬요.", "flow": "마우스를 못 쓰는 사람도 키보드만으로 웹 사이트를 모두 쓸 수 있다는 글이에요. 키보드로 '접근할 수 있다'는 쪽 흐름이 깨지는 곳을 찾아요.", "ko": "일부 사용자들은 그들의 손의 움직임을 제한하는 장애를 가지고 있다. 그들은 웹 사이트를 탐색하기 위해 마우스보다는 키보드에 의존한다. 접근성 있는 웹 사이트에서, 사용자는 키보드만을 사용하여 사이트에 있는 모든 것에 접근할 수 있다. 이는 링크, 버튼 그리고 정보가 입력되는 공간인 필드가 키보드 탐색을 통해 접근될 수 있다는 것을 의미한다. 사용자는 스페이스 바, 화살표 키, 엔터 키 그리고 탭 키와 같은 키를 사용함으로써 웹 사이트를 탐색한다. 예를 들어, 그들은 웹 페이지의 한 부분에서 다른 부분으로 뛰어넘기 위해 탭 키를 사용할 수 있다. 장애를 가진 사용자와 일시적으로 손을 다친 사용자 모두가 이러한 종류의 탐색으로부터 득을 본다."}, {"id": "ctx6", "kind": "ctx", "n": 6, "title": null, "tko": null, "paras": [[{"t": "Color blindness is a "}, {"t": "common", "c": 1}, {"t": " visual disability. People with color blindness find it "}, {"t": "easy", "c": 2}, {"t": " to tell some colors apart. This can cause problems, especially when graphs and charts only use colors to show the "}, {"t": "similarities", "c": 3}, {"t": " between sets of information. Accessible websites use other indicators along with the colors. For example, a line in green may also be dotted, while a line in blue is solid. This "}, {"t": "ensures", "c": 4}, {"t": " that everyone can tell the two lines apart.  The accessibility features of websites don’t just help people with disabilities. They can make online experiences "}, {"t": "easier", "c": 5}, {"t": " for everyone, regardless of abilities or situations. When websites are easy to navigate and understand, we can all benefit from a more "}, {"t": "exclusive", "c": 6}, {"t": " online experience."}]], "items": [{"c": 2, "w": "easy", "r": "difficult", "gw": "쉬운", "gr": "어려운", "fb": null, "fg": "Color blindness is a common visual disability. People with color blindness find it <span class=\"d\">difficult</span> to tell some colors apart.", "ko": "색맹은 흔한 시각 장애이다. 색맹인 사람들은 몇몇 색들을 구별하는 것을 어렵다고 여긴다.", "why": "People with color blindness find it <b>difficult</b> to tell some colors apart (색맹인 사람들은 몇몇 색들을 구별하는 것이 ~다고 여긴다)에서 색맹은 색을 구별하기 어려운 장애예요. 다음 문장 This can cause problems (이는 문제를 일으킬 수 있다)와도 이어져요."}, {"c": 3, "w": "similarities", "r": "differences", "gw": "공통점", "gr": "차이", "fb": null, "fg": "This can cause problems, especially when graphs and charts only use colors to show the <span class=\"d\">differences</span> between sets of information.", "ko": "이는 특히 그래프와 차트가 정보 세트들 간의 차이를 나타내기 위해 색상만을 사용할 때 문제를 일으킬 수 있다.", "why": "graphs and charts only use colors to show the <b>differences</b> between sets of information (그래프와 차트가 정보 세트들 간의 ~를 나타내기 위해 색상만 사용할 때)에서 그래프는 서로 다른 정보를 색으로 구분해요. 색을 구별하지 못하면 차이를 알 수 없다는 게 문제예요."}, {"c": 6, "w": "exclusive", "r": "inclusive", "gw": "배타적인", "gr": "차별 없는", "fb": null, "fg": "When websites are easy to navigate and understand, we can all benefit from a more <span class=\"d\">inclusive</span> online experience.", "ko": "웹 사이트가 탐색하고 이해하기에 더 쉬울 때, 우리는 더 차별 없는 온라인 경험으로부터 득을 볼 수 있다.", "why": "we can all benefit from a more <b>inclusive</b> online experience (우리는 모두 더 ~한 온라인 경험으로부터 득을 볼 수 있다)에서 접근성이 좋으면 모두가 쓸 수 있는 경험이 돼요. 그래서 inclusive (차별 없는)예요."}], "keep": "common (흔한)은 색맹이 흔한 시각 장애라서 맞고, ensures (보장하다)는 모두가 두 선을 구별할 수 있도록 보장한다는 뜻이에요. easier (더 쉬운)도 모두에게 온라인 경험을 더 쉽게 만든다는 뜻이라 그대로 둬요.", "flow": "색맹처럼 색을 구별하기 어려운 사람을 위해 색 말고 다른 표시도 쓰자는 글이에요. 어려움, 문제, 해결, 모두에게 이득 순서를 따라가요.", "ko": "여기 접근성 있는 웹 사이트들의 몇 가지 공통점이 있다. 색맹은 흔한 시각 장애이다. 색맹인 사람들은 몇몇 색들을 구별하는 것을 어렵다고 여긴다. 이는 특히 그래프와 차트가 정보 세트들 간의 차이를 나타내기 위해 색상만을 사용할 때 문제를 일으킬 수 있다. 접근성 있는 웹 사이트는 색상과 더불어 다른 지표들도 사용한다. 예를 들어, 녹색 선은 점선일 수도 있는 반면에, 파란색 선은 실선이다. 이는 모든 이가 두 선을 구별할 수 있도록 한다. 웹 사이트의 접근성 특징들은 단지 장애가 있는 사람들만을 돕는 것이 아니다. 그것들은 능력이나 상황과 상관없이 모두에게 온라인 경험을 더 용이하게 만들어 줄 수 있다. 웹 사이트가 탐색하고 이해하기에 더 쉬울 때, 우리는 더 차별 없는 온라인 경험으로부터 득을 볼 수 있다."}, {"id": "ctx7", "kind": "ctx", "n": 7, "title": null, "tko": null, "paras": [[{"t": "Reading and writing systems are "}, {"t": "similar", "c": 1}, {"t": " across cultures. People from Western cultures read and write from left to right, while those from some Middle Eastern cultures read and write from right to left. People from some Eastern cultures, like that of Japan, read and write from top to bottom. Some global websites take these "}, {"t": "differences", "c": 2}, {"t": " into consideration and "}, {"t": "adjust", "c": 3}, {"t": " their websites for people in different regions. In countries where text is read from right to left, the website’s search button is on the left and the logo is on the right. If you visit the same websites in a different language setting, you will see "}, {"t": "the same", "c": 4}, {"t": " format."}]], "items": [{"c": 1, "w": "similar", "r": "different", "gw": "비슷한", "gr": "다른", "fb": null, "fg": "Reading and writing systems are <span class=\"d\">different</span> across cultures.", "ko": "읽기와 쓰기 체계는 문화마다 다르다.", "why": "Reading and writing systems are <b>different</b> across cultures (읽기와 쓰기 체계는 문화마다 ~하다) 바로 뒤에서 서양은 왼쪽에서 오른쪽, 중동은 오른쪽에서 왼쪽으로 읽는다고 해요. 서로 다른 예가 나오니 different (다른)예요."}, {"c": 4, "w": "the same", "r": "a different", "gw": "똑같은", "gr": "다른", "fb": null, "fg": "If you visit the same websites in a different language setting, you will see <span class=\"d\">a different</span> format.", "ko": "만약 당신이 동일한 웹 사이트를 다른 언어 설정으로 방문한다면, 당신은 다른 구성 방식을 보게 될 것이다.", "why": "If you visit the same websites in a different language setting (동일한 웹 사이트를 다른 언어 설정으로 방문한다면) 지역에 맞게 조정된다는 흐름이에요. you will see a different format (다른 구성 방식을 보게 될 것이다)이 돼요. the same (똑같은)은 앞 내용과 반대예요."}], "keep": "differences (차이점)는 앞에서 말한 다른 점을 가리켜서 맞고, adjust (조정하다)는 지역에 맞게 웹 사이트를 조정한다는 뜻이라 그대로 둬요.", "flow": "문화마다 읽고 쓰는 방향이 달라서 웹 사이트도 지역에 맞게 조정한다는 글이에요. '다르다'는 주제가 끝까지 이어지는지 확인해요.", "ko": "읽기와 쓰기 체계는 문화마다 다르다. 서양 문화 출신의 사람들은 왼쪽에서 오른쪽으로 읽고 쓰는 반면, 일부 중동 문화 출신의 사람들은 오른쪽에서 왼쪽으로 읽고 쓴다. 일본과 같은 일부 동양 문화 출신 사람들은 위에서 아래로 읽고 쓴다. 몇몇 세계적인 웹 사이트는 이러한 차이를 고려하고 다른 지역의 사람들을 위해 그들의 웹 사이트를 조정한다. 글이 오른쪽에서 왼쪽으로 읽히는 국가에서는 웹 사이트의 검색 버튼이 왼쪽에 있고 로고가 오른쪽에 있다. 만약 당신이 동일한 웹 사이트를 다른 언어 설정으로 방문한다면, 당신은 다른 구성 방식을 보게 될 것이다."}, {"id": "gram1", "kind": "gram", "n": 1, "title": null, "tko": null, "paras": [[{"t": "Imagine you have fallen down and broken your right arm. "}, {"t": "There are some things that would be difficult to do with your injured arm", "c": 1}, {"t": ". For example, you might not be able to carry heavy boxes or ride your bike. What about accessing the Internet? If you are right-handed, "}, {"t": "using a computer mouse or touchscreen with your left hand would ", "c": 2}, {"t": "have been", "c": 3}, {"t": " awkward and take a lot of time", "c": 4}, {"t": "."}], [{"t": "However, "}, {"t": "this is a minor challenge compared to what some of us face on the Internet.", "c": 5}, {"t": " For people with certain disabilities, many websites can be nearly impossible to use. "}, {"t": "This is the reason why web accessibility is important", "c": 6}, {"t": ". "}, {"t": "Web accessibility is the practice of making sure ", "c": 7}, {"t": "what", "c": 8}, {"t": " websites can be used by everyone", "c": 9}, {"t": ", including people with disabilities. So "}, {"t": "what exactly makes a website ", "c": 10}, {"t": "accessibly", "c": 11}, {"t": "? Here are some common features of accessible websites."}]], "items": [{"c": 3, "w": "have been", "r": "be", "gw": "~이었을 것이다", "gr": "~일 것이다", "fb": "If you are right-handed, using a computer mouse or touchscreen with your left hand would <span class=\"d\">have been</span> awkward and take a lot of time.", "fg": "If you are right-handed, using a computer mouse or touchscreen with your left hand would <span class=\"d\">be</span> awkward and take a lot of time.", "ko": "만약 당신이 오른손잡이라면, 당신의 왼손으로 컴퓨터 마우스나 터치스크린을 사용하는 것은 어색하고 많은 시간이 걸릴 것이다.", "why": "would 뒤에는 동사원형이 와요. would be awkward and take a lot of time (어색하고 많은 시간이 걸릴 것이다)처럼 be와 take가 같은 모양으로 이어져요. would have been (~했을 것이다)이면 and take와 모양이 안 맞아요."}, {"c": 8, "w": "what", "r": "that", "gw": "~하는 것", "gr": "~라는 것", "fb": "Web accessibility is the practice of making sure <span class=\"d\">what</span> websites can be used by everyone, including people with disabilities.", "fg": "Web accessibility is the practice of making sure <span class=\"d\">that</span> websites can be used by everyone, including people with disabilities.", "ko": "웹 접근성은 웹 사이트가 장애가 있는 사람들을 포함하여 반드시 모두에게 사용될 수 있도록 하는 실천이다.", "why": "making sure (확실히 하는 것) 뒤의 '~라는 것'은 접속사 that이에요. 뒤가 websites can be used ...로 완전한 문장이에요. what 뒤에는 빠진 말이 있어야 해요."}, {"c": 11, "w": "accessibly", "r": "accessible", "gw": "접근 가능하게", "gr": "접근 가능한", "fb": "So what exactly makes a website <span class=\"d\">accessibly</span>?", "fg": "So what exactly makes a website <span class=\"d\">accessible</span>?", "ko": "그렇다면 무엇이 정확히 웹 사이트를 접근 가능하게 만들까?", "why": "what exactly makes a website accessible (무엇이 웹 사이트를 접근 가능하게 만들까)는 make + 목적어 + 형용사 모양이에요. website를 설명하는 말은 형용사 accessible (접근 가능한)이에요."}], "keep": "There are some things that would be difficult ... (어려울 일들이 있다)는 that이 things를 꾸며서 맞아요. this is a minor challenge compared to what some of us face (우리 중 몇몇이 직면하는 것에 비해 작은 문제)는 what이 '~하는 것'이라 맞고, This is the reason why web accessibility is important (이것이 웹 접근성이 중요한 이유이다)는 reason 뒤 why라서 맞아요.", "flow": "", "ko": "당신이 넘어져 당신의 오른팔이 부러졌다고 상상해 보라. 당신의 다친 팔로 하기에 어려울 몇몇 일들이 있다. 예를 들어, 당신은 무거운 상자를 옮기거나 자전거를 타지 못할 수도 있다. 인터넷에 접속하는 것은 어떨까? 만약 당신이 오른손잡이라면, 당신의 왼손으로 컴퓨터 마우스나 터치스크린을 사용하는 것은 어색하고 많은 시간이 걸릴 것이다. 그러나 이것은 우리 중 몇몇이 인터넷에서 직면하는 것에 비해 작은 문제이다. 특정 장애가 있는 사람들에게는, 많은 웹 사이트가 사용하기에 거의 불가능할 수 있다. 이것이 웹 접근성이 중요한 이유이다. 웹 접근성은 웹 사이트가 장애가 있는 사람들을 포함하여 반드시 모두에게 사용될 수 있도록 하는 실천이다. 그렇다면 무엇이 정확히 웹 사이트를 접근 가능하게 만들까? 여기 접근성 있는 웹 사이트들의 몇 가지 공통점이 있다."}, {"id": "gram2", "kind": "gram", "n": 2, "title": null, "tko": null, "paras": [[{"t": "Along with text, most websites include other forms of information, such as images. "}, {"t": "Sometimes such visual information is important for understanding the text", "c": 1}, {"t": ". This is a problem for users with visual disabilities. When they go on a website, "}, {"t": "they often use programs called “screen readers,” ", "c": 2}, {"t": "that", "c": 3}, {"t": " read online text aloud", "c": 4}, {"t": ". However, these programs cannot “read” images."}], [{"t": "Accessible websites solve this problem by providing alternative text, also known as “alt text.", "c": 5}, {"t": "” Alt text is a brief description of non-textual information. For instance, "}, {"t": "if an image ", "c": 6}, {"t": "will show", "c": 7}, {"t": " a group of students", "c": 8}, {"t": ", its alt text would explain how many students are in the image and what they are doing. "}, {"t": "Screen readers can detect this alt text and read it aloud", "c": 9}, {"t": ". This way, "}, {"t": "alt text ensures ", "c": 10}, {"t": "what", "c": 11}, {"t": " people with visual disabilities can access more of the information on a website", "c": 12}, {"t": "."}]], "items": [{"c": 3, "w": "that", "r": "which", "gw": "~인", "gr": "그것은 ~인", "fb": "When they go on a website, they often use programs called “screen readers,” <span class=\"d\">that</span> read online text aloud. However, these programs cannot “read” images.", "fg": "When they go on a website, they often use programs called “screen readers,” <span class=\"d\">which</span> read online text aloud. However, these programs cannot “read” images.", "ko": "그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다.", "why": "programs called “screen readers,” (‘스크린 리더’라 불리는 프로그램) 뒤 쉼표(,)에서 덧붙여 설명할 땐 which예요. 쉼표 뒤에는 that을 쓰지 않아요."}, {"c": 7, "w": "will show", "r": "shows", "gw": "보여 줄 것이다", "gr": "보여 준다", "fb": "For instance, if an image <span class=\"d\">will show</span> a group of students, its alt text would explain how many students are in the image and what they are doing.", "fg": "For instance, if an image <span class=\"d\">shows</span> a group of students, its alt text would explain how many students are in the image and what they are doing.", "ko": "예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다.", "why": "if an image <b>shows</b> a group of students (만약 이미지가 한 무리의 학생들을 보여 준다면)는 조건의 if절이에요. if절에서는 미래의 일도 현재형으로 써서 shows (보여 준다)예요."}, {"c": 11, "w": "what", "r": "that", "gw": "~하는 것", "gr": "~라는 것", "fb": "This way, alt text ensures <span class=\"d\">what</span> people with visual disabilities can access more of the information on a website.", "fg": "This way, alt text ensures <span class=\"d\">that</span> people with visual disabilities can access more of the information on a website.", "ko": "이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다.", "why": "alt text ensures <b>that</b> people with visual disabilities can access more of the information (대체 텍스트는 시각 장애를 가진 사람들이 더 많은 정보에 접근할 수 있도록 보장한다)에서 ensure (보장하다) 뒤의 '~라는 것'은 that이에요. 뒤가 완전한 문장이에요."}], "keep": "Sometimes such visual information is important for understanding the text (그런 시각적 정보가 텍스트를 이해하는 데 중요하다)는 전치사 for 뒤라서 understanding이 맞아요. Accessible websites solve this problem by providing alternative text (접근성 있는 웹 사이트는 대체 텍스트를 제공함으로써 해결한다)는 by 뒤 providing이 맞아요. Screen readers can detect this alt text and read it aloud (스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다)는 can 뒤 detect와 read가 같은 모양이라 맞아요.", "flow": "", "ko": "텍스트와 함께, 대부분의 웹 사이트는 이미지와 같은 다른 형식의 정보를 포함한다. 때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다. 그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다. 접근성 있는 웹 사이트는 ‘alt text’라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다. 대체 텍스트는 비문자 정보에 대한 간단한 설명이다. 예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다. 스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다. 이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다. 접근성 있는 웹 사이트는 색상과 더불어 다른 지표들도 사용한다."}, {"id": "gram3", "kind": "gram", "n": 3, "title": null, "tko": null, "paras": [[{"t": "In some cases, "}, {"t": "audio content cannot be accessed or understood", "c": 1}, {"t": ". "}, {"t": "Some people may have hearing disabilities, while others might be in places ", "c": 2}, {"t": "which", "c": 3}, {"t": " they can’t listen to audio, such as a quiet library", "c": 4}, {"t": ". Therefore, "}, {"t": "accessible websites often offer other ways to access information that is presented in audio form", "c": 5}, {"t": "."}], [{"t": "For example, "}, {"t": "they may provide transcripts or captions ", "c": 6}, {"t": "what", "c": 7}, {"t": " can help users access this information", "c": 8}, {"t": ". Transcripts are text versions of the entire audio content, "}, {"t": "while captions are text versions of the audio that appear in a video as it ", "c": 9}, {"t": "playing", "c": 10}, {"t": ". "}, {"t": "Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video", "c": 11}, {"t": "."}]], "items": [{"c": 3, "w": "which", "r": "where", "gw": "~하는 것", "gr": "~하는(장소)", "fb": "Some people may have hearing disabilities, while others might be in places <span class=\"d\">which</span> they can’t listen to audio, such as a quiet library.", "fg": "Some people may have hearing disabilities, while others might be in places <span class=\"d\">where</span> they can’t listen to audio, such as a quiet library.", "ko": "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다.", "why": "places (장소들) 뒤에 완전한 문장 they can’t listen to audio (그들이 음성을 들을 수 없다)가 이어져요. 장소 뒤의 완전한 문장은 where예요. which 뒤에는 빠진 말이 있어야 해요."}, {"c": 7, "w": "what", "r": "that", "gw": "~하는 것", "gr": "~하는", "fb": "For example, they may provide transcripts or captions <span class=\"d\">what</span> can help users access this information.", "fg": "For example, they may provide transcripts or captions <span class=\"d\">that</span> can help users access this information.", "ko": "예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다.", "why": "transcripts or captions <b>that</b> can help users (사용자를 도울 수 있는 대본이나 자막)에서 앞의 transcripts or captions를 꾸미는 말은 that이에요. what은 앞에 명사가 있으면 쓰지 않아요."}, {"c": 10, "w": "playing", "r": "plays", "gw": "재생하는", "gr": "재생된다", "fb": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it <span class=\"d\">playing</span>.", "fg": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it <span class=\"d\">plays</span>.", "ko": "대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다.", "why": "as it <b>plays</b> in a video (영상이 재생될 때)에서 as (~할 때) 뒤에는 주어 it과 동사가 와야 해요. it이 단수라서 plays (재생된다)예요. playing만 쓰면 동사가 아니에요."}], "keep": "audio content cannot be accessed or understood (음성 콘텐츠는 접근되거나 이해될 수 없다)는 접근을 당하는 쪽이라 수동 모양이 맞아요. accessible websites often offer other ways to access information that is presented in audio form (접근성 있는 웹 사이트는 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다)은 information이 단수라 is presented가 맞아요. Captions include not only ... but also ... (자막은 ~뿐만 아니라 ~도 포함한다)는 짝이 맞아요.", "flow": "", "ko": "일부 경우에, 음성 콘텐츠는 접근되거나 이해될 수 없다. 어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다. 그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다. 예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다. 대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다. 자막은 발화된 단어의 텍스트 버전뿐만 아니라 영상 내의 음악과 다른 소리들에 대한 설명도 포함한다."}, {"id": "gram4", "kind": "gram", "n": 4, "title": null, "tko": null, "paras": [[{"t": "Having a visual disability doesn’t ", "c": 1}, {"t": "necessary", "c": 2}, {"t": " mean a person can’t see at all", "c": 3}, {"t": ". Some people, including many elderly people, simply have poor eyesight. "}, {"t": "This makes it difficult for them to read", "c": 4}, {"t": ". For this reason, "}, {"t": "accessible websites have a background color that ", "c": 5}, {"t": "contrast", "c": 6}, {"t": " with the color of their text.", "c": 7}, {"t": " "}, {"t": "This makes the text ", "c": 8}, {"t": "enough clear", "c": 9}, {"t": " for most people to see", "c": 10}, {"t": "."}], [{"t": "As for audio content, "}, {"t": "accessible websites allow users to adjust the volume of background sound or to turn it off altogether", "c": 11}, {"t": ". "}, {"t": "This gives users both with and without hearing difficulties more control over their experience while they are using the sites", "c": 12}, {"t": "."}]], "items": [{"c": 2, "w": "necessary", "r": "necessarily", "gw": "필요한", "gr": "반드시", "fb": "Having a visual disability doesn’t <span class=\"d\">necessary</span> mean a person can’t see at all.", "fg": "Having a visual disability doesn’t <span class=\"d\">necessarily</span> mean a person can’t see at all.", "ko": "시각 장애를 지니고 있는 것은 반드시 한 사람이 전혀 보지 못한다는 것을 의미하지는 않는다.", "why": "doesn’t <b>necessarily</b> mean (반드 n class=\"d\">which</span> text is read from right to left, the website’s search button is on the left and the logo is on the right.", "fg": "In countries <span class=\"d\">where</span> text is read from right to left, the website’s search button is on the left and the logo is on the right.", "ko": "글이 오른쪽에서 왼쪽으로 읽히는 국가에서는 웹 사이트의 검색 버튼이 왼쪽에 있고 로고가 오른쪽에 있다.", "why": "countries (국가들) 뒤에 완전한 문장 text is read from right to left (글이 오른쪽에서 왼쪽으로 읽힌다)가 이어져요. 장소 뒤의 완전한 문장은 where예요."}], "keep": "People from Western cultures read and write ... while those from some Middle Eastern cultures ... (서양 문화 출신 사람들은 읽고 쓰는 반면 일부 중동 문화 출신 사람들은)에서 those는 앞의 People을 대신해서 맞아요. If you visit the same websites ..., you will see a different format (동일한 웹 사이트를 방문한다면 다른 구성 방식을 보게 될 것이다)은 if절 현재형 + will이라 맞아요.", "flow": "", "ko": "읽기와 쓰기 체계는 문화마다 다르다. 서양 문화 출신의 사람들은 왼쪽에서 오른쪽으로 읽고 쓰는 반면, 일부 중동 문화 출신의 사람들은 오른쪽에서 왼쪽으로 읽고 쓴다. 일본과 같은 일부 동양 문화 출신 사람들은 위에서 아래로 읽고 쓴다. 몇몇 세계적인 웹 사이트는 이러한 차이를 고려하고 다른 지역의 사람들을 위해 그들의 웹 사이트를 조정한다. 글이 오른쪽에서 왼쪽으로 읽히는 국가에서는 웹 사이트의 검색 버튼이 왼쪽에 있고 로고가 오른쪽에 있다. 만약 당신이 동일한 웹 사이트를 다른 언어 설정으로 방문한다면, 당신은 다른 구성 방식을 보게 될 것이다."}];

function wnEmpty(host){
  var m=document.createElement('div');m.style.cssText='margin:24px 0;padding:18px;border:1px solid #d6d3d1;border-radius:12px;text-align:center;font-size:16px';
  m.innerHTML='오답 노트에 담긴 문제가 없어요.<div style="margin-top:8px"><a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트로 가기 ›</a></div>';
  host.parentNode.insertBefore(m,host.nextSibling)}
function home(){
  S.cur=null;save();show('home');
  var _hw=$('wnote');if(!_hw){_hw=wnNote($('ptxt').parentNode.querySelector('.how'));}wnRender(_hw,WN.MODE&&Q.length>0&&Q.every(function(x){return R(x).done}));
  if(WEMPTY&&!$('wnempty')){wnEmpty(_hw);_hw.nextSibling.id='wnempty'}
  var done=0,ok=0;Q.forEach(function(q){if(R(q).done){done++;if(isOk(q))ok++}});
  $('pb').style.width=(100*done/Q.length)+'%';
  $('ptxt').textContent=done+'/'+Q.length+'개 풀었어요 · '+ok+'개 맞았어요';
  var first=Q.filter(function(q){return !R(q).done})[0];
  var c=$('cont');
  if(first){c.classList.remove('hide');c.textContent=(done?'이어서 풀기 · ':'시작하기 · ')+nm(first);c.onclick=function(){open(first.id)}}
  else{c.classList.add('hide')}
  var L=$('lists');L.innerHTML='';
  [['ctx','문맥상 어색한 것 찾기'],['gram','어법상 어색한 것 찾기']].forEach(function(g){
    L.appendChild(el('h2',null,g[1]));var box=el('div','list');
    Q.filter(function(q){return q.kind===g[0]}).forEach(function(q){
      var r=R(q),b=el('button','li');
      var left=el('div');left.appendChild(document.createTextNode(nm(q)));left.appendChild(el('small',null,'어색한 곳 '+q.items.length+'개 고르기'));
      var st=el('span','st',r.done?(isOk(q)?'○ 정답':'× 다시 보기'):(r.sel.length?'푸는 중':'아직 안 풂'));
      if(r.done)st.classList.add(isOk(q)?'ok':'ng');else if(r.sel.length)st.classList.add('ing');
      b.appendChild(left);b.appendChild(st);b.onclick=function(){open(q.id)};box.appendChild(b)});
    L.appendChild(box)});
}
function qById(id){return Q.filter(function(q){return q.id===id})[0]}
function open(id){S.cur=id;save();draw(qById(id));show('quiz')}
function draw(q){
  var r=R(q),n=q.items.length,idx=Q.indexOf(q);
  $('qn').textContent=nm(q)+' ('+(idx+1)+'/'+Q.length+')';
  $('ask').innerHTML='밑줄 친 곳 중 <b>'+(q.kind==='ctx'?'문맥상':'어법상')+' 어색한 것 '+n+'개</b>를 고르세요.';
  var ps=$('ps');ps.innerHTML='';ps.classList.toggle('locked',r.done);
  if(q.title){var tp=el('p','ptitle');tp.textContent=q.title+' ';var sp=el('span',null,'('+q.tko+')');sp.style.cssText='color:var(--sub);font-size:15px;font-weight:600';tp.appendChild(sp);ps.appendChild(tp)}
  var T=truth(q);
  q.paras.forEach(function(p){
    var pe=el('p');
    p.forEach(function(s){
      if(!s.c){pe.appendChild(document.createTextNode(s.t));return}
      var c=el('span','cd');c.setAttribute('data-c',s.c);c.appendChild(document.createTextNode(s.t));
      c.appendChild(el('sup',null,CIRC.charAt(s.c-1)));
      var picked=r.sel.indexOf(s.c)>=0,isT=T.indexOf(s.c)>=0;
      if(r.done){
        if(picked&&isT)c.classList.add('hit');else if(isT)c.classList.add('miss');else if(picked)c.classList.add('bad');
        if(isT){var it=q.items.filter(function(i){return i.c===s.c})[0];pe.appendChild(c);pe.appendChild(el('span','fx',' → '+it.r+' '));return}
      }else{
        if(picked)c.classList.add('sel');
        c.onclick=function(){toggle(q,s.c)};
      }
      pe.appendChild(c);
    });
    ps.appendChild(pe)});
  var sub=$('submit'),cnt=$('cnt');
  if(r.done){sub.classList.add('hide');cnt.classList.add('hide');result(q)}
  else{sub.classList.remove('hide');cnt.classList.remove('hide');$('res').classList.add('hide');upd(q)}
}
function upd(q){var r=R(q),n=q.items.length;$('cnt').innerHTML='선택한 곳 <b>'+r.sel.length+'</b> / '+n+(r.sel.length?' · '+r.sel.slice().sort(function(a,b){return a-b}).map(function(c){return CIRC.charAt(c-1)}).join(' '):'');$('submit').disabled=r.sel.length!==n}
function toggle(q,c){
  var r=R(q);if(r.done)return;
  var i=r.sel.indexOf(c);
  if(i>=0)r.sel.splice(i,1);else{if(r.sel.length>=q.items.length)return;r.sel.push(c)}
  save();
  var e=document.querySelector('.cd[data-c="'+c+'"]');if(e)e.classList.toggle('sel',r.sel.indexOf(c)>=0);upd(q);
}
$('submit').onclick=function(){var q=qById(S.cur),r=R(q);if(r.sel.length!==q.items.length)return;r.done=true;if(!isOk(q)){var _k=(q.ko||'').replace(/\s+/g,' ');WN.add({kind:'L4',part:PART,act:'awk',qid:q.id,label:'어색한 곳('+(q.kind==='ctx'?'문맥':'어법')+') · '+_k.slice(0,16)+'…'})}
if(!S.marked&&Q.every(function(x){return R(x).done})){S.marked=1;if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}save();draw(q);setTimeout(function(){var x=$('res');if(x.scrollIntoView)x.scrollIntoView({behavior:'smooth',block:'start'})},30)};
function result(q){
  var r=R(q),res=$('res');res.innerHTML='';res.classList.remove('hide');
  var T=truth(q),got=r.sel.filter(function(c){return T.indexOf(c)>=0}).length,ok=isOk(q);
  res.appendChild(el('div','verdict '+(ok?'ok':'ng'),ok?'○ 모두 맞았어요':'× 어색한 곳 '+q.items.length+'개 중 '+got+'개를 찾았어요'));
  q.items.forEach(function(it,ii){
    var d=el('div','it'),h=el('div','ih');
    h.appendChild(el('span','no','('+(ii+1)+')'));
    var hit=r.sel.indexOf(it.c)>=0;
    h.appendChild(el('span','tag '+(hit?'y':'n'),(hit?'찾았어요 ':'놓쳤어요 ')+CIRC.charAt(it.c-1)));
    var ia=el('span','ia');ia.appendChild(el('span','x',it.w));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gw+')'));ia.appendChild(document.createTextNode(' → '));ia.appendChild(el('span','r',it.r));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gr+')'));
    h.appendChild(ia);d.appendChild(h);
    var f=el('div','fix');
    if(it.fb)f.appendChild(html('span','l bad','<small>틀린 문장</small>'+it.fb));
    f.appendChild(html('span','l good','<small>고친 문장</small>'+it.fg));d.appendChild(f);
    d.appendChild(el('div','kot',it.ko));
    d.appendChild(html('div','why',it.why));
    res.appendChild(d)});
  var wrongPick=r.sel.filter(function(c){return T.indexOf(c)<0});
  if(wrongPick.length){res.appendChild(html('div','note','<b>잘못 고른 곳</b> '+wrongPick.map(function(c){return CIRC.charAt(c-1)}).join(' ')+'은(는) 글의 흐름과 문법에 맞는 표현이라 그대로 둬요.'))}
  if(WN.MODE){res.appendChild(html('div','note','이제 안 봐도 되는 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에서 \'빼기\'로 뺄 수 있어요.'))}
  else if(WN.has('L4',PART,'awk',q.id)){res.appendChild(html('div','note','<a href="../wrong.html" style="color:#0f766e;text-decoration:underline">틀린 '+WN.ids('L4',PART,'awk').length+'개가 오답 노트에 담겼어요 ›</a>'))}
  res.appendChild(html('div','note','<b>글의 흐름</b> '+q.flow));
  res.appendChild(html('div','note','<b>그대로 두는 부분</b> '+q.keep));
  var kb=el('div','kobox');kb.textContent=q.ko;
  var row=el('div','row');
  var bk=el('button','btn','한글 해석 보기');bk.onclick=function(){var on=kb.classList.toggle('on');bk.textContent=on?'한글 해석 닫기':'한글 해석 보기'};
  res.appendChild(bk);res.appendChild(kb);
  var idx=Q.indexOf(q),nx=Q[idx+1];
  var again=el('button','big alt','이 문제 다시 풀기');again.onclick=function(){S.res[q.id]={sel:[],done:false};save();draw(q);window.scrollTo(0,0)};
  var next=el('button','big',nx?'다음 문제 · '+nm(nx):'목록으로');next.onclick=function(){if(nx)open(nx.id);else home()};
  row.appendChild(again);row.appendChild(next);res.appendChild(row);
}
$('toHome').onclick=home;
$('resetAll').onclick=function(){if(!confirm('푼 기록을 모두 지우고 처음부터 할까요?'))return;S={res:{},cur:null};save();home()};
if(S.cur&&qById(S.cur))open(S.cur);else home();
</script><script src="../../common/prog.js?v=261019"></script><script>if(!WN.MODE)PG.bar(PGK,"풀었어요")</script></body></html>
