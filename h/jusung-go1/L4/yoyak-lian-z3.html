var DATA={"meta": {"sch": "jusung-go1", "src": "jusung-go1/L4/sx-data.js", "pidx": 2, "lesson": "4과", "title": "웹 접근성 (Web Accessibility)", "label": "❸", "page": "yoyak-lian-z3"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "음성 콘텐츠는 어떤 경우 [[accessed|접근]]할 수 없다. 청각 [[disabilities|장애]]가 있거나 조용한 도서관에 있는 사람이 그렇다.", "en": ["In some cases, audio content cannot be accessed or understood.", "Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library."], "kos": ["일부 경우에, 음성 콘텐츠는 접근되거나 이해될 수 없다.", "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다."]}, {"tag": "본문 3번", "ns": [3], "line": "그래서 접근성 좋은 사이트는 다른 방법을 [[offer|제공]]한다.", "en": ["Therefore, accessible websites often offer other ways to access information that is presented in audio form."], "kos": ["그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다."]}, {"tag": "본문 4~5번", "ns": [4, 5], "line": "그 방법은 대본과 자막. 대본은 [[entire|전체]] 음성 내용을 글로 옮긴 것이다.", "en": ["For example, they may provide transcripts or captions that can help users access this information.", "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays."], "kos": ["예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다.", "대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다."]}, {"tag": "본문 8번", "ns": [8], "line": "시력이 나쁜 사람은 읽기가 [[difficult|힘들다]].", "en": ["Some people, including many elderly people, simply have poor eyesight. This makes it difficult for them to read."], "kos": ["많은 노인들을 포함해서 일부 사람들은 그저 좋지 않은 시력을 가지고 있다. 이는 그들이 읽는 것을 어렵게 만든다."]}, {"tag": "본문 9~10번", "ns": [9, 10], "line": "글자색과 대비되는 배경 색으로 글자를 [[clear|또렷하게]] 만든다.", "en": ["For this reason, accessible websites have a background color that contrasts with the color of their text.", "This makes the text clear enough for most people to see."], "kos": ["이러한 이유로, 접근성 있는 웹 사이트는 텍스트 색과 대조를 이루는 배경 색을 지니고 있다.", "이는 대부분의 사람들이 보기에 텍스트를 충분히 명확하게 만들어 준다."]}, {"tag": "본문 11번", "ns": [11], "line": "배경음 크기는 [[adjust|조절]]하거나 [[altogether|완전히]] 끌 수 있다.", "en": ["As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether."], "kos": ["음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다."]}, {"tag": "본문 12번", "ns": [12], "line": "그래서 모두가 자기 경험을 더 [[control|통제]]할 수 있다.", "en": ["This gives users both with and without hearing difficulties more control over their experience while they are using the sites."], "kos": ["이는 청각 장애가 있는 사용자와 없는 사용자 모두에게 그들이 사이트를 사용하는 동안 그들의 경험에 대한 더 많은 통제권을 준다."]}], "story": [{"a": "access", "form": "accessed", "n": 1, "sq": 1, "sum": "Audio content can be [[inaccessible]] to some people", "hook": "음성을 접근할 수 없는 경우가 있다는 첫 문장의 accessed(접근되다) → 요약문에서는 inaccessible(접근할 수 없는)로 바꿨어요.", "b": "inaccessible", "k": "접근하다 → 접근할 수 없는", "en": "In some cases, audio content cannot be accessed or understood.", "ko": "일부 경우에, 음성 콘텐츠는 접근되거나 이해될 수 없다."}, {"a": "disability", "form": "disabilities", "n": 2, "sq": 1, "sum": "those with hearing [[impairments]]", "hook": "소리를 못 듣는 사람이 나오는 문장의 disabilities(장애) → 요약문에서는 impairments(장애)로 바뀌었어요.", "b": "impairment", "k": "장애 → 장애", "en": "Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library.", "ko": "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다."}, {"a": "offer", "form": "offer", "n": 3, "sq": 2, "sum": "websites often [[supply]] text versions of audio", "hook": "소리 대신 다른 길을 열어 준다는 문장의 offer(제공하다) → 요약문에서는 supply(공급하다, 제공하다)로 바꿨어요.", "b": "supply", "k": "제공하다 → 공급하다, 제공하다", "en": "Therefore, accessible websites often offer other ways to access information that is presented in audio form.", "ko": "그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다."}, {"a": "entire", "form": "entire", "n": 5, "sq": 2, "sum": "which cover the [[complete]] audio content", "hook": "대본은 음성 내용을 빠짐없이 옮긴 것이라는 문장의 entire(전체의) → 요약문에서는 complete(완전한, 전체의)로 바꿨어요.", "b": "complete", "k": "전체의 → 완전한, 전체의", "en": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays.", "ko": "대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다."}, {"a": "difficult", "form": "difficult", "n": 8, "sq": 3, "sum": "find reading [[tough]]", "hook": "시력이 나쁘면 읽기가 힘들다는 문장의 difficult(어려운) → 요약문에서는 tough(힘든)로 바꿨어요.", "b": "tough", "k": "어려운 → 힘든", "en": "Some people, including many elderly people, simply have poor eyesight. This makes it difficult for them to read.", "ko": "많은 노인들을 포함해서 일부 사람들은 그저 좋지 않은 시력을 가지고 있다. 이는 그들이 읽는 것을 어렵게 만든다."}, {"a": "clear", "form": "clear", "n": 10, "sq": 3, "sum": "makes the text [[visible]] to most people", "hook": "글자가 또렷해진다는 문장의 clear(또렷한) → 요약문에서는 visible(눈에 보이는)로 바꿨어요.", "b": "visible", "k": "또렷한 → 눈에 보이는", "en": "This makes the text clear enough for most people to see.", "ko": "이는 대부분의 사람들이 보기에 텍스트를 충분히 명확하게 만들어 준다."}, {"a": "adjust", "form": "adjust", "n": 11, "sq": 4, "sum": "users to [[regulate]] the loudness", "hook": "배경음 크기를 맞춘다는 문장의 adjust(조절하다) → 요약문에서는 regulate(조절하다)로 바꿨어요.", "b": "regulate", "k": "조절하다 → 조절하다", "en": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.", "ko": "음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다."}, {"a": "altogether", "form": "altogether", "n": 11, "sq": 4, "sum": "turn it off [[completely]]", "hook": "소리를 아예 끈다는 문장의 altogether(완전히) → 요약문에서는 completely(완전히)로 바꿨어요.", "b": "completely", "k": "완전히 → 완전히", "en": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.", "ko": "음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다."}, {"a": "control", "form": "control", "n": 12, "sq": 4, "sum": "more [[influence]] over their experience", "hook": "내 경험을 내가 정한다는 마무리 문장의 control(통제권) → 요약문에서는 influence(영향력)로 바꿨어요.", "b": "influence", "k": "통제권 → 영향력", "en": "This gives users both with and without hearing difficulties more control over their experience while they are using the sites.", "ko": "이는 청각 장애가 있는 사용자와 없는 사용자 모두에게 그들이 사이트를 사용하는 동안 그들의 경험에 대한 더 많은 통제권을 준다."}], "passage": [{"n": 1, "en": "In some cases, audio content cannot be accessed or understood.", "ko": "일부 경우에, 음성 콘텐츠는 접근되거나 이해될 수 없다."}, {"n": 2, "en": "Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library.", "ko": "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다."}, {"n": 3, "en": "Therefore, accessible websites often offer other ways to access information that is presented in audio form.", "ko": "그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다."}, {"n": 4, "en": "For example, they may provide transcripts or captions that can help users access this information.", "ko": "예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다."}, {"n": 5, "en": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays.", "ko": "대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다."}, {"n": 6, "en": "Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video.", "ko": "자막은 발화된 단어의 텍스트 버전뿐만 아니라 영상 내의 음악과 다른 소리들에 대한 설명도 포함한다."}, {"n": 7, "en": "Having a visual disability doesn’t necessarily mean a person can’t see at all.", "ko": "시각 장애를 지니고 있는 것은 반드시 한 사람이 전혀 보지 못한다는 것을 의미하지는 않는다."}, {"n": 8, "en": "Some people, including many elderly people, simply have poor eyesight. This makes it difficult for them to read.", "ko": "많은 노인들을 포함해서 일부 사람들은 그저 좋지 않은 시력을 가지고 있다. 이는 그들이 읽는 것을 어렵게 만든다."}, {"n": 9, "en": "For this reason, accessible websites have a background color that contrasts with the color of their text.", "ko": "이러한 이유로, 접근성 있는 웹 사이트는 텍스트 색과 대조를 이루는 배경 색을 지니고 있다."}, {"n": 10, "en": "This makes the text clear enough for most people to see.", "ko": "이는 대부분의 사람들이 보기에 텍스트를 충분히 명확하게 만들어 준다."}, {"n": 11, "en": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.", "ko": "음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다."}, {"n": 12, "en": "This gives users both with and without hearing difficulties more control over their experience while they are using the sites.", "ko": "이는 청각 장애가 있는 사용자와 없는 사용자 모두에게 그들이 사이트를 사용하는 동안 그들의 경험에 대한 더 많은 통제권을 준다."}], "questions": [{"id": 1, "summary": "Audio content can be (A) to some people, such as those with hearing (B) or those who are in a quiet library.", "ko": "음성 콘텐츠는 일부 사람들에게 <b>(A) 접근할 수 없는</b> 것이 될 수 있다. 청각 <b>(B) 장애</b>가 있는 사람이나 조용한 도서관에 있는 사람이 그렇다.", "opts": [["inaccessible", "advantages"], ["available", "impairments"], ["available", "preferences"], ["inaccessible", "impairments"], ["unnecessary", "talents"]], "optko": ["접근할 수 없는 – 장점", "이용할 수 있는 – 장애", "이용할 수 있는 – 선호", "접근할 수 없는 – 장애", "불필요한 – 재능"], "ans": 3, "wrong": ["advantages(장점)가 틀려요. 청각 때문에 소리를 못 듣는 사람 이야기라서 장점이 아니라 장애(disabilities)예요.", "available(이용할 수 있는)이 틀려요. 본문은 음성을 접근하거나 이해할 수 없는(cannot be accessed) 경우라고 해요.", "둘 다 틀려요. 음성을 이용할 수 있다는 말도, 선호(preferences)를 말하는 것도 본문에 없어요.", null, "둘 다 틀려요. 음성이 불필요하다는 말도, 재능(talents) 이야기도 본문에 없어요."], "evid": [{"n": 1, "hl": ["cannot be accessed or understood"]}, {"n": 2, "hl": ["hearing disabilities", "quiet library"]}], "swaps": [["access", "inaccessible", "접근하다 → 접근할 수 없는"], ["disability", "impairment", "장애 → 장애"], ["cannot be accessed or understood", "can be inaccessible", "접근되거나 이해될 수 없다 → 접근할 수 없는 것이 될 수 있다"]], "swapnote": "disabilities(장애)는 시험에서 impairments(장애)로 바뀌어 나와요. cannot be accessed(접근될 수 없다)도 inaccessible(접근할 수 없는) 한 단어로 바뀔 수 있어요.", "use": [{"w": "inaccessible", "ex": "The old building is inaccessible to people in wheelchairs.", "ko": "그 오래된 건물은 휠체어를 탄 사람들이 접근할 수 없다.", "wk": "접근할 수 없는", "hk": "접근할 수 없다"}, {"w": "impairment", "ex": "He has a hearing impairment, so he uses a hearing aid.", "ko": "그는 청각 장애가 있어서 보청기를 사용한다.", "wk": "장애", "hk": "청각 장애"}], "flow": "본문 1번에서 음성 콘텐츠는 접근하거나 이해할 수 없는 경우가 있다고 해요. 2번에서 그 예로 청각 장애가 있는 사람, 조용한 도서관에 있는 사람을 들어요.", "jd": [["Audio content can be [[inaccessible]]", "음성 콘텐츠는 [[접근할 수 없는]] 것이 될 수 있다"], ["to some people,", "일부 사람들에게,"], ["such as those with hearing [[impairments]]", "청각 [[장애]]가 있는 사람들처럼"], ["or those who are in a quiet library.", "또는 조용한 도서관에 있는 사람들처럼."]], "fc": [["본문 1번", "음성 콘텐츠는 접근하기 어려울 때가 있다", "듣거나 이해할 수 없는 경우가 있어요."], ["본문 2번", "청각 장애가 있는 사람, 조용한 도서관에 있는 사람", "소리를 들을 수 없는 두 가지 예시예요."], ["정답 포인트", "{{disabilities|장애}} = {{impairments|장애}}, {{cannot be accessed|접근될 수 없다}} = {{inaccessible|접근할 수 없는}}", "본문 표현이 뜻이 같은 말로 바뀌어 나와요."]], "evid_full": [{"en": "In some cases, audio content cannot be accessed or understood.", "ko": "일부 경우에, 음성 콘텐츠는 접근되거나 이해될 수 없다.", "hl": ["cannot be accessed or understood"], "hlko": ["접근되거나 이해될 수 없다"], "n": 1}, {"en": "Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library.", "ko": "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다.", "hl": ["hearing disabilities", "quiet library"], "hlko": ["청각 장애", "조용한 도서관"], "n": 2}]}, {"id": 2, "summary": "Accessible websites often (A) text versions of audio, such as transcripts, which cover the (B) audio content, and captions, which appear in a video while it plays.", "ko": "접근성 있는 웹 사이트는 흔히 대본처럼 <b>(B) 전체</b> 음성 콘텐츠를 다루는 것과, 영상이 재생되는 동안 나타나는 자막 같은 음성의 텍스트 버전을 <b>(A) 제공한다</b>.", "opts": [["supply", "complete"], ["supply", "short"], ["remove", "complete"], ["remove", "short"], ["avoid", "partial"]], "optko": ["제공하다 – 전체의", "제공하다 – 짧은", "없애다 – 전체의", "없애다 – 짧은", "피하다 – 부분적인"], "ans": 0, "wrong": [null, "short(짧은)가 틀려요. 대본은 음성 내용 전체(entire)를 글로 옮긴 거예요.", "remove(없애다)가 틀려요. 접근성 있는 웹 사이트는 대본이나 자막을 없애는 게 아니라 제공(offer)해요.", "둘 다 틀려요. 텍스트 버전을 없앤다는 말도, 짧다는 말도 본문에 없어요.", "둘 다 틀려요. 텍스트 버전을 피한다는 말도, 일부분만 옮긴다는 말도 본문에 없어요."], "evid": [{"n": 3, "hl": ["offer other ways"]}, {"n": 5, "hl": ["text versions of the entire audio content", "as it plays"]}], "swaps": [["offer", "supply", "제공하다 → 공급하다, 제공하다"], ["entire", "complete", "전체의 → 완전한, 전체의"], ["transcripts", "text versions of audio", "대본 → 음성의 텍스트 버전"]], "swapnote": "offer(제공하다)는 provide(제공하다), supply(공급하다)로 바뀌고, entire(전체의)는 whole(전체의), complete(완전한)로 바뀌어 나와요.", "use": [{"w": "supply", "ex": "The school will supply books for all students.", "ko": "학교는 모든 학생에게 책을 제공할 것이다.", "wk": "제공하다, 공급하다", "hk": "제공할"}, {"w": "complete", "ex": "Please read the complete story before class.", "ko": "수업 전에 이야기 전체를 읽어 오세요.", "wk": "완전한, 전체의", "hk": "전체"}], "flow": "본문 3번에서 접근성 있는 사이트는 음성 정보를 접근할 다른 방법을 제공한다고 해요. 4~5번에서 그 방법이 대본(전체 내용)과 자막(영상과 함께 나옴)이라고 설명해요.", "jd": [["Accessible websites often [[supply]]", "접근성 있는 웹 사이트는 흔히 [[제공한다]]"], ["text versions of audio,", "음성의 텍스트 버전을,"], ["such as transcripts, which cover the [[complete]] audio content,", "[[전체]] 음성 콘텐츠를 다루는 대본 같은 것과,"], ["and captions, which appear in a video while it plays.", "영상이 재생되는 동안 영상 안에 나타나는 자막을."]], "fc": [["본문 3번", "그래서! 다른 방법을 제공한다", "소리 대신 정보를 얻을 길을 열어 줘요. {{offer|제공하다}}"], ["본문 5번", "대본은 전체, 자막은 영상과 함께", "대본 = {{entire|전체의}} 음성의 글, 자막 = 재생될 때 나오는 글"], ["정답 포인트", "{{offer|제공하다}} = {{supply|공급하다}}, {{entire|전체의}} = {{complete|완전한}}", "대본과 자막은 모두 음성의 텍스트 버전이에요."]], "evid_full": [{"en": "Therefore, accessible websites often offer other ways to access information that is presented in audio form.", "ko": "그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다.", "hl": ["offer other ways"], "hlko": ["다른 방법들을 제공한다"], "n": 3}, {"en": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear i   var pos=[];(hl||[]).forEach(function(h){var i=t.indexOf(h);if(i>=0)pos.push([i,i+h.length])});
  pos.sort(function(a,b){return a[0]-b[0]});
  var c=0,o='';
  pos.forEach(function(p){if(p[0]<c)return;o+=esc(t.slice(c,p[0]))+'<mark>'+esc(t.slice(p[0],p[1]))+'</mark>';c=p[1]});
  return o+esc(t.slice(c));
}
function rich(t,hl){
  if(!hl||!hl.length)return words(t);
  var pos=[];hl.forEach(function(h){var i=t.indexOf(h);if(i>=0)pos.push([i,i+h.length])});
  pos.sort(function(a,b){return a[0]-b[0]});
  var c=0,o='';
  pos.forEach(function(p){if(p[0]<c)return;o+=words(t.slice(c,p[0]))+'<mark>'+words(t.slice(p[0],p[1]))+'</mark>';c=p[1]});
  return o+words(t.slice(c));
}

}

  var lem=g[0],id=lem.toLowerCase();
  var n=NOTES[id]||{l:lem,k:g[1],c:0,t:0};
  n.c=(n.c||0)+1;n.t=Date.now();n.q=curQ;NOTES[id]=n;jset(K_NOTE,NOTES);
  if(!PUSHED['w:'+id]){PUSHED['w:'+id]=1;jset('vhvs:'+SCH,PUSHED);try{WN.add([{w:lem,m:g[1],src:SRC,how:'탭',ask:true}])}catch(e){}}
  $('sw').textContent=key.toLowerCase()===id?lem:key+'  →  '+lem;
  $('sl').textContent=g[1];
  $('sn').textContent='단어노트에 담았어요 (지금 '+nNotes()+'개)';
  $('sheet').className='on';

}
document.addEventListener('click',function(e){

  if(!(e.target.closest&&e.target.closest('#sheet')))hideSheet();
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');

  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}

    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
