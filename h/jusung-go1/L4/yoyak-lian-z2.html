var DATA={"meta": {"sch": "jusung-go1", "src": "jusung-go1/L4/sx-data.js", "pidx": 1, "lesson": "4과", "title": "웹 접근성 (Web Accessibility)", "label": "❷", "page": "yoyak-lian-z2"}, "scenes": [{"tag": "본문 3~4번", "ns": [3, 4], "line": "웹 사이트에는 글과 함께 이미지도 있고, 이런 시각 정보가 글을 이해하는 데 [[important|중요할]] 때가 있다.", "en": ["Along with text, most websites include other forms of information, such as images.", "Sometimes such visual information is important for understanding the text. This is a problem for users with visual disabilities."], "kos": ["텍스트와 함께, 대부분의 웹 사이트는 이미지와 같은 다른 형식의 정보를 포함한다.", "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다."]}, {"tag": "본문 5번", "ns": [5], "line": "시각 장애가 있는 사용자의 스크린 리더는 글은 소리로 읽어 주지만 이미지는 [[read|읽지]] 못한다.", "en": ["When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images."], "kos": ["그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "그래서 접근성 있는 웹 사이트는 대체 텍스트로 이 문제를 [[solve|해결한다]]. 대체 텍스트는 짧은 [[description|설명]]이다.", "en": ["Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "Alt text is a brief description of non-textual information."], "kos": ["접근성 있는 웹 사이트는 ‘alt text’라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다.", "대체 텍스트는 비문자 정보에 대한 간단한 설명이다."]}, {"tag": "본문 8~9번", "ns": [8, 9], "line": "학생들 사진이라면 몇 명이 무엇을 하는지 [[explain|설명해]] 두고, 스크린 리더가 그것을 [[detect|감지해서]] 읽어 준다.", "en": ["For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "Screen readers can detect this alt text and read it aloud."], "kos": ["예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다.", "스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다."]}, {"tag": "본문 10번", "ns": [10], "line": "덕분에 시각 장애가 있는 사람도 더 많은 정보에 [[access|접근할]] 수 있다고 대체 텍스트가 [[ensures|보장한다]].", "en": ["This way, alt text ensures that people with visual disabilities can access more of the information on a website."], "kos": ["이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다."]}], "story": [{"a": "important", "form": "important", "n": 4, "sq": 1, "sum": "Visual information can be [[crucial]] for understanding a text", "hook": "이미지 같은 시각 정보가 글을 이해하는 데 필요하다는 문장의 important(중요한) → 요약문에서는 crucial(매우 중요한)로 바꿨어요.", "b": "crucial", "k": "중요한 → 매우 중요한", "en": "Sometimes such visual information is important for understanding the text. This is a problem for users with visual disabilities.", "ko": "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다."}, {"a": "read", "form": "read", "n": 5, "sq": 1, "sum": "cannot [[interpret]] images", "hook": "스크린 리더가 이미지를 읽지 못한다는 문장의 read(읽다) → 요약문에서는 interpret(해석하다)로 바꿨어요.", "b": "interpret", "k": "읽다 → 해석하다", "en": "When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images.", "ko": "그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다."}, {"a": "solve", "form": "solve", "n": 6, "sq": 2, "sum": "Accessible websites [[resolve]] the problem", "hook": "대체 텍스트로 문제를 푼다는 문장의 solve(해결하다) → 요약문에서는 resolve(해결하다)로 바꿨어요.", "b": "resolve", "k": "해결하다 → 해결하다", "en": "Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "ko": "접근성 있는 웹 사이트는 ‘alt text’라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다."}, {"a": "description", "form": "description", "n": 7, "sq": 2, "sum": "a short [[explanation]] of information that is not text", "hook": "대체 텍스트가 무엇인지 정의하는 문장의 description(설명) → 요약문에서는 explanation(설명)으로 바꿨어요.", "b": "explanation", "k": "설명 → 설명", "en": "Alt text is a brief description of non-textual information.", "ko": "대체 텍스트는 비문자 정보에 대한 간단한 설명이다."}, {"a": "explain", "form": "explain", "n": 8, "sq": 3, "sum": "would [[describe]] how many students are shown", "hook": "학생들 사진의 예를 드는 문장의 explain(설명하다) → 요약문에서는 describe(묘사하다)로 바꿨어요.", "b": "describe", "k": "설명하다 → 묘사하다", "en": "For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "ko": "예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다."}, {"a": "detect", "form": "detect", "n": 9, "sq": 3, "sum": "screen readers can [[recognize]] it", "hook": "스크린 리더가 대체 텍스트를 찾아내는 문장의 detect(감지하다) → 요약문에서는 recognize(인식하다)로 바꿨어요.", "b": "recognize", "k": "감지하다 → 인식하다", "en": "Screen readers can detect this alt text and read it aloud.", "ko": "스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다."}, {"a": "ensure", "form": "ensures", "n": 10, "sq": 4, "sum": "Alt text [[guarantees]]", "hook": "대체 텍스트의 결과를 정리하는 마지막 문장의 ensures(보장하다) → 요약문에서는 guarantees(보장하다)로 바꿨어요.", "b": "guarantee", "k": "보장하다 → 보장하다", "en": "This way, alt text ensures that people with visual disabilities can access more of the information on a website.", "ko": "이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다."}, {"a": "access", "form": "access", "n": 10, "sq": 4, "sum": "can [[obtain]] more of a website's information", "hook": "시각 장애가 있는 사람도 정보에 닿게 된다는 마지막 문장의 access(접근하다) → 요약문에서는 obtain(얻다)으로 바꿨어요.", "b": "obtain", "k": "접근하다 → 얻다", "en": "This way, alt text ensures that people with visual disabilities can access more of the information on a website.", "ko": "이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다."}], "passage": [{"n": 1, "en": "So what exactly makes a website accessible?", "ko": "그렇다면 무엇이 정확히 웹 사이트를 접근 가능하게 만들까?"}, {"n": 2, "en": "Here are some common features of accessible websites.", "ko": "여기 접근성 있는 웹 사이트들의 몇 가지 공통점이 있다."}, {"n": 3, "en": "Along with text, most websites include other forms of information, such as images.", "ko": "텍스트와 함께, 대부분의 웹 사이트는 이미지와 같은 다른 형식의 정보를 포함한다."}, {"n": 4, "en": "Sometimes such visual information is important for understanding the text. This is a problem for users with visual disabilities.", "ko": "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다."}, {"n": 5, "en": "When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images.", "ko": "그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다."}, {"n": 6, "en": "Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "ko": "접근성 있는 웹 사이트는 ‘alt text’라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다."}, {"n": 7, "en": "Alt text is a brief description of non-textual information.", "ko": "대체 텍스트는 비문자 정보에 대한 간단한 설명이다."}, {"n": 8, "en": "For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "ko": "예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다."}, {"n": 9, "en": "Screen readers can detect this alt text and read it aloud.", "ko": "스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다."}, {"n": 10, "en": "This way, alt text ensures that people with visual disabilities can access more of the information on a website.", "ko": "이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다."}], "questions": [{"id": 1, "summary": "Visual information can be (A) for understanding a text, but the programs that read text aloud cannot (B) images for users with visual disabilities.", "ko": "시각 정보는 글을 이해하는 데 <b>(A) 매우 중요할</b> 수 있는데, 글을 소리 내어 읽어 주는 프로그램은 시각 장애가 있는 사용자를 위해 이미지를 <b>(B) 해석할</b> 수 없다.", "opts": [["crucial", "produce"], ["harmful", "produce"], ["harmful", "interpret"], ["crucial", "interpret"], ["optional", "ignore"]], "optko": ["매우 중요한 – 만들어 내다", "해로운 – 만들어 내다", "해로운 – 해석하다", "매우 중요한 – 해석하다", "선택적인 – 무시하다"], "ans": 3, "wrong": ["produce(만들어 내다)가 틀려요. 프로그램은 이미지를 만들어 내는 게 아니라 '읽지(read)' 못해요.", "둘 다 틀려요. 시각 정보는 해롭지(harmful) 않고 중요하며, 프로그램이 이미지를 만들어 낸다는 말도 없어요.", "harmful(해로운)이 틀려요. 본문은 시각 정보가 텍스트를 이해하는 데 중요하다(important)고 해요.", null, "둘 다 틀려요. 시각 정보는 선택이 아니라 중요하고, 프로그램은 이미지를 무시하는 게 아니라 읽을 수 없는 거예요."], "evid": [{"n": 4, "hl": ["important for understanding the text"]}, {"n": 5, "hl": ["these programs cannot “read” images"]}], "swaps": [["important", "crucial", "중요한 → 매우 중요한"], ["read", "interpret", "읽다 → 해석하다"], ["images", "visual information", "이미지 → 시각 정보"]], "swapnote": "important(중요한)는 시험에서 crucial(매우 중요한), essential(꼭 필요한)로 바뀌어 나와요. 본문의 'read(읽다)'는 interpret(해석하다)로 바뀔 수 있어요.", "use": [{"w": "crucial", "ex": "Sleep is crucial for good health.", "ko": "잠은 건강에 매우 중요하다.", "wk": "매우 중요한", "hk": "매우 중요하다"}, {"w": "interpret", "ex": "Scientists interpret the data to find patterns.", "ko": "과학자들은 패턴을 찾으려고 자료를 해석한다.", "wk": "해석하다", "hk": "해석한다"}], "flow": "본문 3번에서 웹 사이트에 텍스트뿐 아니라 이미지도 있다고 해요. 4번에서 이 시각 정보가 글을 이해하는 데 중요하다고 하고, 5번에서 스크린 리더는 이미지를 읽을 수 없다는 문제가 나와요.", "jd": [["Visual information can be [[crucial]] for understanding a text,", "시각 정보는 글을 이해하는 데 [[매우 중요할]] 수 있는데,"], ["but the programs that read text aloud", "글을 소리 내어 읽어 주는 프로그램은"], ["cannot [[interpret]] images", "이미지를 [[해석할]] 수 없다"], ["for users with visual disabilities.", "시각 장애가 있는 사용자를 위해."]], "fc": [["본문 3~4번", "텍스트 옆에는 이미지가 있다", "이런 시각 정보가 글을 이해하는 데 중요할 때가 있어요."], ["본문 5번", "그런데! 스크린 리더는 이미지를 못 읽는다", "글은 소리로 읽어 주지만 그림은 읽을 수 없어요."], ["정답 포인트", "{{important|중요한}} = {{crucial|매우 중요한}}, {{read|읽다}} = {{interpret|해석하다}}", "본문 단어가 뜻이 같은 말로 바뀌어 나와요."]], "evid_full": [{"en": "Sometimes such visual information is important for understanding the text. This is a problem for users with visual disabilities.", "ko": "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다.", "hl": ["important for understanding the text"], "hlko": ["텍스트를 이해하는 데 중요하다"], "n": 4}, {"en": "When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images.", "ko": "그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다.", "hl": ["these programs cannot “read” images"], "hlko": ["이러한 프로그램들은 이미지를 ‘읽을’ 수 없다"], "n": 5}]}, {"id": 2, "summary": "Accessible websites (A) the problem by providing alt text, which is a short (B) of information that is not text.", "ko": "접근성 있는 웹 사이트는 대체 텍스트를 제공함으로써 그 문제를 <b>(A) 해결하는데</b>, 이것은 글자가 아닌 정보에 대한 짧은 <b>(B) 설명</b>이다.", "opts": [["resolve", "explanation"], ["resolve", "copy"], ["ignore", "copy"], ["ignore", "explanation"], ["create", "advertisement"]], "optko": ["해결하다 – 설명", "해결하다 – 복사본", "무시하다 – 복사본", "무시하다 – 설명", "만들어 내다 – 광고"], "ans": 0, "wrong": [null, "copy(복사본)가 틀려요. 대체 텍스트는 이미지를 복사한 게 아니라 간단히 설명한 글(description)이에요.", "둘 다 틀려요. 문제를 무시하는 게 아니라 해결해요. 또 복사본이라는 말도 본문에 없어요.", "ignore(무시하다)가 틀려요. 접근성 있는 웹 사이트는 문제를 무시하지 않고 해결해요(solve).", "둘 다 틀려요. 문제를 만들어 내는 게 아니라 해결해요. 또 광고(advertisement)라는 말도 없어요."], "evid": [{"n": 6, "hl": ["solve this problem"]}, {"n": 7, "hl": ["brief description of non-textual information"]}], "swaps": [["solve", "resolve", "해결하다 → 해결하다"], ["brief", "short", "간단한 → 짧은"], ["description", "explanation", "설명 → 설명"], ["non-textual", "not text", "글자가 아닌 → 글자가 아닌"]], "swapnote": "solve(해결하다)는 resolve(해결하다)나 fix(고치다)로, description(설명)은 explanation(설명)으로 바뀌어 나올 수 있어요.", "use": [{"w": "resolve", "ex": "They tried to resolve the problem quickly.", "ko": "그들은 그 문제를 빨리 해결하려고 했다.", "wk": "해결하다", "hk": "해결하려고"}, {"w": "explanation", "ex": "The teacher gave a clear explanation of the rule.", "ko": "선생님은 그 규칙에 대해 분명한 설명을 해 주셨다.", "wk": "설명", "hk": "설명"}], "flow": "본문 6번에서 접근성 있는 웹 사이트는 대체 텍스트(alt text)를 제공해 이 문제를 해결한다고 해요. 7번에서 대체 텍스트가 무엇인지 '글자가 아닌 정보에 대한 간단한 설명'이라고 정의해요.", "jd": [["Accessible websites [[resolve]] the problem", "접근성 있는 웹 사이트는 그 문제를 [[해결한다]]"], ["by providing alt text,", "대체 텍스트를 제공함으로써,"], ["which is a short [[explanation]]", "이것은 짧은 [[설명]]인데,"], ["of information that is not text.", "글자가 아닌 정보에 대한."]], "fc": [["본문 6번", "대체 텍스트로 문제를 해결한다", "그림을 읽지 못하는 문제의 해결책이에요."], ["본문 7번", "대체 텍스트 = 짧은 설명", "글자가 아닌 정보를 말로 설명해 줘요."], ["정답 포인트", "{{solve|해결하다}} = {{resolve|해결하다}}, {{description|설명}} = {{explanation|설명}}", "쉬운 말이 약간 어려운 말로 바뀌어 나와요."]], "evid_full": [{"en": "Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "ko": "접근성 있는 웹 사이트는 ‘alt text’라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다.", "hl": ["solve this problem"], "hlko": ["이 문제를 해결한다"], "n": 6}, {"en": "Alt text is a brief description of non-textual information.", "ko": "대체 텍스트는 비문자 정보에 대한 간단한 설명이다.", "hl": ["brief description of non-textual information"], "hlko": ["비문자 정보에 대한 간단한 설명"], "n": 7}]}, {"id": 3, "summary": "The alt text for a picture of students would (A) how many students are shown and what they are doing, and screen readers can (B) it and read it aloud.", "ko": "학생들 사진에 대한 대체 텍스트는 몇 명의 학생이 있고 무엇을 하고 있는지를 <b>(A) 묘사하고</b>, 스크린 리더는 그것을 <b>(B) 인식해서</b> 소리 내어 읽어 줄 수 있다.", "opts": [["describe", "delete"], ["hide", "delete"], ["describe", "recognize"], ["hide", "recognize"], ["predict", "change"]], "optko": ["묘사하다 – 삭제하다", "숨기다 – 삭제하다", "묘사하다 – 인식하다", "숨기다 – 인식하다", "예측하다 – 바꾸다"], "ans": 2, "wrong": ["delete(삭제하다)가 틀려요. 스크린 리더는 대체 텍스트를 지우는 게 아니라 찾아내서(detect) 읽어 줘요.", "둘 다 틀려요. 대체 텍스트는 내용을 숨기거나 지우는 게 아니라 설명해 줘요.", null, "hide(숨기다)가 틀려요. 대체 텍스트는 학생 수와 행동을 숨기는 게 아니라 설명해(explain) 줘요.", "둘 다 틀려요. 앞날을 예측하거나 글을 바꾼다는 말은 본문에 없어요."], "evid": [{"n": 8, "hl": ["how many students", "what they are doing"]}, {"n": 9, "hl": ["detect this alt text", "read it aloud"]}], "swaps": [["explain", "describe", "설명하다 → 묘사하다"], ["detect", "recognize", "감지하다 → 인식하다"], ["group", "picture", "한 무리 → 사진"]], "swapnote": "explain(설명하다)은 describe(묘사하다)로, detect(감지하다)는 recognize(인식하다), identify(확인하다)로 바뀌어 나올 수 있어요.", "use": [{"w": "describe", "ex": "Can you describe the man you saw?", "ko": "네가 본 남자를 묘사해 줄 수 있니?", "wk": "묘사하다", "hk": "묘사해"}, {"w": "recognize", "ex": "I recognized her voice at once.", "ko": "나는 그녀의 목소리를 바로 알아보았다.", "wk": "인식하다, 알아보     var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
