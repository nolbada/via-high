<style>

에는 주어가 없다"], "q": "some things that would be difficult의 that이 꾸미는 말은?", "a": "things", "p": "that"}, {"t": "injured : 다친, 부상을 당한", "c": "g", "x": "injured는 형용사로 ‘부상을 당한, 다친’이라는 뜻이다. 동사 injure(~을 다치게 하다)의 과거분사에서 나온 분사형 형용사로, 여기서는 명사 arm을 꾸민다. your injured arm은 ‘당신의 다친 팔’이다.", "n": ["injured a. 부상을 당한, 다친", "injure v. ~을 다치게 하다"], "q": "injured arm의 injured는 어떤 동사에서 나온 말인가?", "a": "injure(~을 다치게 하다)", "p": "injured"}, {"t": "What about + -ing ~? : ~하는 것은 어때?", "c": "b", "x": "What about 뒤에는 명사나 동명사(-ing)가 온다. What about accessing the Internet?은 ‘인터넷에 접속하는 것은 어떨까?’라는 뜻이다. about이 전치사라서 동사 access가 accessing으로 바뀐다. access는 ‘(컴퓨터로) ~에 접속하다’라는 뜻의 동사이다.", "n": ["What about + -ing ~? = ~하는 것은 어때?", "access v. (컴퓨터로) ~에 접속하다"], "q": "What about 뒤에 동사를 쓸 때 어떤 형태로 쓰는가?", "a": "동명사(-ing)", "p": "What about accessing"}, {"t": "right-handed : 오른손잡이인 (복합형용사)", "c": "b", "x": "right-handed는 right(오른쪽의)와 handed(손을 가진)가 하이픈으로 이어져 하나의 형용사가 된 복합형용사이다. 뜻은 ‘오른손잡이인’이다. 여기서는 If you are right-handed처럼 be동사 뒤에서 주어 you를 설명한다.", "n": ["right-handed a. 오른손잡이인", "여러 단어가 하이픈으로 이어져 하나의 형용사 역할 = 복합형용사"], "q": "right-handed는 어떤 단어들이 합쳐진 말인가?", "a": "right + handed", "p": "right-handed"}, {"t": "동명사구 주어 : ~하는 것은", "c": "k", "x": "using a computer mouse or touchscreen with your left hand는 using으로 시작하는 동명사구이고, 문장의 주어 역할을 한다. 해석은 ‘왼손으로 마우스나 터치스크린을 사용하는 것은’이다. 동명사구 주어는 하나의 행위를 뜻하므로 단수로 취급한다.", "n": ["동명사구 주어 = ~하는 것은 (단수 취급)", "-ing ~ + 동사 : 동명사구가 문장의 주어"], "q": "이 문장에서 주어는 어디까지인가?", "a": "using ... with your left hand 전체(동명사구)", "p": "using a computer mouse"}, {"t": "compared to ~ : ~에 비해", "c": "b", "x": "compared to는 ‘~에 비해’라는 뜻으로, 분사구문이 굳어져 전치사처럼 쓰이는 표현이다. 이 문장에서는 this is a minor challenge가 compared to 뒤의 내용과 비교된다. 즉 ‘우리 중 몇몇이 직면하는 것에 비해 작은 문제’라는 뜻이다.", "n": ["compared to ~ = ~에 비해", "전치사처럼 쓰이는 분사 표현 : including ~, based on ~"], "q": "compared to ~의 뜻은?", "a": "~에 비해", "p": "compared to"}, {"t": "what some of us face : 관계대명사 what", "c": "k", "x": "what은 the thing(s) that의 뜻을 가진 관계대명사로 ‘~하는 것’이라고 해석한다. what some of us face에서 face(~에 직면하다)의 목적어가 빠져 있고, 그 자리를 what이 대신한다. 그래서 ‘우리 중 몇몇이 직면하는 것’이 된다.", "n": ["what + 불완전한 절 = ~하는 것", "what = the thing(s) that"], "q": "what some of us face에서 what은 face의 무엇인가?", "a": "목적어(직면하는 것)", "p": "what some of us face"}, {"t": "impossible to use : 사용하기에 불가능한", "c": "b", "x": "to use는 형용사 impossible을 꾸미는 부사적 용법의 to부정사이다. ‘~하기에’라고 해석하여 ‘사용하기에 불가능한’이 된다. 주어인 many websites는 ‘사용되는’ 대상이다.", "n": ["형용사 + to부정사 = ~하기에 (…한)", "impossible a. 불가능한"], "q": "impossible to use는 어떻게 해석하는가?", "a": "사용하기에 불가능한", "p": "impossible to use"}, {"t": "disabilities : 장애 (disability의 복수형)", "c": "g", "x": "disability는 ‘장애’라는 뜻의 명사이다. 본문의 disabilities는 disability의 복수형이다. 자음 + y로 끝나는 명사는 y를 i로 바꾸고 -es를 붙인다. people with certain disabilities는 ‘특정 장애가 있는 사람들’이다.", "n": ["disability n. 장애", "disability - disabilities (자음+y → y를 i로 바꾸고 -es)"], "q": "disabilities의 단수형은?", "a": "disability", "p": "disabilities"}, {"t": "the reason why + 주어 + 동사 : ~하는 이유 (관계부사 why)", "c": "k", "x": "why는 선행사 the reason을 꾸미는 관계부사이다. 뒤에 web accessibility is important처럼 주어와 동사가 모두 있는 완전한 절이 온다. the reason why는 ‘~하는 이유’라는 뜻이고, why는 for which로 바꿔 쓸 수 있다.", "n": ["the reason (why) + 완전한 절 = ~하는 이유", "관계부사 why = for which"], "q": "관계부사 why 뒤에는 완전한 절이 오는가, 불완전한 절이 오는가?", "a": "완전한 절", "p": "the reason why"}, {"t": "make sure that ~ : 반드시 ~하도록 하다", "c": "g", "x": "make sure that은 ‘반드시 ~하도록 하다, 확실히 하다’라는 뜻의 숙어이다. 전치사 of 뒤에서 동명사 making이 되었고, that절의 내용은 ‘웹 사이트가 모두에게 사용될 수 있다’이다. practice는 여기서 ‘실천’이라는 뜻의 명사이고, the practice of ~ing는 ‘~하는 실천’이다.", "n": ["make sure that ~ = 반드시 ~하도록 하다", "전치사의 목적어 자리에는 동명사 : of making"], "q": "of 뒤에 make가 making으로 쓰인 이유는?", "a": "전치사의 목적어이므로 동명사로 쓴다", "p": "making sure that"}, {"t": "make + 목적어 + 형용사 : ~을 …하게 만들다 (5형식)", "c": "b", "x": "what exactly makes a website accessible에서 주어는 what(무엇이), 동사는 makes, 목적어는 a website, 목적격 보어는 accessible이다. 이처럼 make + 목적어 + 형용사는 ‘~을 …하게 만들다’라는 뜻이다. 보어 자리에는 부사가 아니라 형용사를 쓴다.", "n": ["make + 목적어 + 형용사 = ~을 …하게 만들다", "5형식 : 주어 + 동사 + 목적어 + 목적격 보어"], "q": "makes a website accessible에서 목적격 보어는?", "a": "accessible", "p": "makes a website accessible"}, {"t": "Here are + 주어 : 여기 ~이 있다 (장소부사 도치)", "c": "b", "x": "장소를 나타내는 부사 Here가 문장 맨 앞에 오면 ‘동사 + 주어’ 순서로 바뀐다. 이 문장의 주어는 some common features이고, 복수라서 동사가 are이다. features는 feature(특징)의 복수형이고, common은 ‘공통의’라는 뜻이다.", "n": ["Here + be동사 + 주어 = 여기 ~이 있다", "feature n. 특징 (복수형 features)"], "q": "Here are some common features에서 주어는?", "a": "some common features", "p": "Here are some common features"}]}, {"no": 2, "id": "z2", "sents": [{"n": 12, "mk": "[1|Along with] text, most websites include other forms of information, [2|such as] images.", "en": "Along with text, most websites include other forms of information, such as images.", "ko": "텍스트와 함께, 대부분의 웹 사이트는 이미지와 같은 다른 형식의 정보를 포함한다."}, {"n": 13, "mk": "Sometimes [3|such visual information] is important [4|for understanding] the text. This is a problem for users with visual disabilities.", "en": "Sometimes such visual information is important for understanding the text. This is a problem for users with visual disabilities.", "ko": "때로는 그러한 시각적 정보가 텍스트를 이해하는 데 중요하다. 이는 시각 장애를 가진 사용자에게 문제이다."}, {"n": 14, "mk": "When [9|they] go on a website, they often use programs [5|called “screen readers,”] [6|which] read online text aloud. However, these programs cannot “read” images.", "en": "When they go on a website, they often use programs called “screen readers,” which read online text aloud. However, these programs cannot “read” images.", "ko": "그들이 웹 사이트에 접속할 때, 그들은 종종 ‘스크린 리더’라 불리는 프로그램을 사용하는데, 이것은 온라인 텍스트를 소리 내어 읽어 준다. 그러나 이러한 프로그램들은 이미지를 ‘읽을’ 수 없다."}, {"n": 15, "mk": "Accessible websites solve this problem [4|by providing] alternative text, [7|also known as] “alt text.”", "en": "Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "ko": "접근성 있는 웹 사이트는 ‘alt text’라고도 알려진 대체 텍스트를 제공함으로써 이 문제를 해결한다."}, {"n": 16, "mk": "Alt text is a brief description of non-textual information.", "en": "Alt text is a brief description of non-textual information.", "ko": "대체 텍스트는 비문자 정보에 대한 간단한 설명이다."}, {"n": 17, "mk": "For instance, if an image shows a group of students, its alt text would explain [8|how many students are in the image and what] [10|they] [8|are doing].", "en": "For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "ko": "예를 들어, 만약 이미지가 한 무리의 학생들을 보여 준다면, 그것의 대체 텍스트는 이미지에 얼마나 많은 학생들이 있으며 그들이 무엇을 하고 있는지 설명할 것이다."}, {"n": 18, "mk": "Screen readers can [11|detect] this alt text and read it aloud.", "en": "Screen readers can detect this alt text and read it aloud.", "ko": "스크린 리더는 이 대체 텍스트를 감지하고 소리 내어 읽어 줄 수 있다."}, {"n": 19, "mk": "This way, alt text [12|ensures] [13|that people with visual disabilities can access more of the information on a website].", "en": "This way, alt text ensures that people with visual disabilities can access more of the information on a website.", "ko": "이러한 방식으로, 대체 텍스트는 시각 장애를 가진 사람들이 웹 사이트에서 더 많은 정보에 접근할 수 있도록 보장한다."}], "items": [{"t": "along with ~ : ~에 덧붙여, ~와 마찬가지로", "c": "g", "x": "Along with text는 ‘텍스트와 함께, 텍스트에 덧붙여’라는 뜻이다. 웹 사이트가 텍스트뿐 아니라 이미지 같은 다른 정보도 포함한다는 내용을 이끈다.", "n": ["along with ~ = ~에 덧붙여, ~와 마찬가지로"], "q": "Along with text, most websites include other forms of information.에서 Along with text의 뜻은?", "a": "텍스트와 함께(텍스트에 덧붙여)", "p": "Along with"}, {"t": "such as ~ : ~와 같은", "c": "b", "x": "such as는 두 단어가 한 덩어리로 쓰이는 구전치사로 ‘~와 같은’이라는 뜻이다. such as images처럼 뒤에 예시가 되는 명사가 온다. 앞의 other forms of information의 예로 images를 든 것이다.", "n": ["such as + 명사 = ~와 같은 (예시)"], "q": "such as images는 앞의 무엇에 대한 예시인가?", "a": "other forms of information (다른 형식의 정보)", "p": "such as"}, {"t": "한정사 such + 형용사 + 명사 : 그러한 ~", "c": "b", "x": "such visual information에서 such는 ‘그러한’이라는 뜻의 한정사로 명사 information을 꾸민다. 앞 문장에서 말한 이미지 같은 정보를 다시 가리킨다. 앞의 such as와는 쓰임이 다르다.", "n": ["such + (형용사) + 명사 = 그러한 ~"], "q": "such visual information을 해석하라.", "a": "그러한 시 audio, such as a quiet library.", "en": "Some people may have hearing disabilities, while others might be in places where they can’t listen to audio, such as a quiet library.", "ko": "어떤 사람들은 청각 장애를 가지고 있을 수도 있는데 반하여, 다른 사람들은 조용한 도서관과 같이 그들이 음성을 들을 수 없는 장소에 있을지도 모른다."}, {"n": 22, "mk": "Therefore, accessible websites often offer other [6|ways to access information] [7|that is presented in audio form].", "en": "Therefore, accessible websites often offer other ways to access information that is presented in audio form.", "ko": "그러므로 접근성 있는 웹 사이트들은 흔히 음성 형식으로 제시되는 정보에 접근할 수 있는 다른 방법들을 제공한다."}, {"n": 23, "mk": "For example, [8|they] may provide transcripts or captions [9|that can help users access this information].", "en": "For example, they may provide transcripts or captions that can help users access this information.", "ko": "예를 들어, 그것들은 사용자가 이 정보에 접근하는 데 도움이 될 수 있는 대본이나 자막을 제공할 수도 있다."}, {"n": 24, "mk": "Transcripts are text versions of the entire audio content, [3|while] captions are text versions of the audio that appear in a video as it plays.", "en": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays.", "ko": "대본은 전체 음성 콘텐츠의 텍스트 버전인 반면, 자막은 영상이 재생될 때 영상 안에 나타나는 음성의 텍스트 버전이다."}, {"n": 25, "mk": "Captions include [10|not only the text version of the spoken words but also descriptions of the music and other sounds in the video].", "en": "Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video.", "ko": "자막은 발화된 단어의 텍스트 버전뿐만 아니라 영상 내의 음악과 다른 소리들에 대한 설명도 포함한다."}], "items": [{"t": "cannot be accessed or understood : 조동사 수동태 + 병렬", "c": "k", "x": "cannot be accessed or understood는 조동사 + be + p.p.의 수동태이다. 음성 콘텐츠는 ‘접근되고 이해되는’ 대상이라서 수동태를 쓴다. 접속사 or가 accessed와 understood를 연결하며, 둘 다 be 뒤에 오는 같은 과거분사 형태이다.", "n": ["조동사 + be + p.p. = ~될 수 있다 (수동태)", "A or B : 같은 형태끼리 병렬 연결"], "q": "cannot be accessed or understood에서 or는 무엇과 무엇을 연결하는가?", "a": "과거분사 accessed와 understood", "p": "cannot be accessed or understood"}, {"t": "audio : 소리의, 음성의", "c": "g", "x": "audio는 ‘소리의, 음성의’라는 뜻의 형용사이다. audio content는 ‘음성 콘텐츠’를 뜻한다. 명사로 쓰이면 ‘소리, 음향’이라는 뜻이다.", "n": ["audio (a.) 소리의, 음성의 / (n.) 소리, 음향"], "q": "audio content는 무슨 뜻인가?", "a": "음성 콘텐츠", "p": "audio content"}, {"t": "접속사 while : ~인 반면에 (대조)", "c": "k", "x": "while은 두 내용을 대조하는 접속사로 ‘~인 반면에’라는 뜻이다. 21번 문장에서는 Some people ... while others ...로 ‘어떤 사람들은 ~인데 반하여 다른 사람들은 ~’라고 대비한다. 24번 문장에서는 Transcripts ... while captions ...로 대본과 자막의 차이를 대비한다.", "n": ["A, while B = A인 반면에 B (대조)", "Some ~, others ... = 어떤 ~는 …, 다른 ~는 …"], "q": "Transcripts are ..., while captions are ...에서 while의 뜻은?", "a": "~인 반면에 (대조)", "p": "while"}, {"t": "관계부사 where : 장소 선행사 + where", "c": "k", "x": "places where they can’t listen to audio에서 where는 선행사 places를 꾸미는 관계부사이다. where 뒤에는 they can’t listen처럼 완전한 절이 온다. ‘그곳에서 음성을 들을 수 없는 장소’라는 뜻이며 where는 in which로 바꿔 쓸 수 있다.", "n": ["장소 선행사 + where + 완전한 절", "where = in which (장소)"], "q": "places where they can’t listen to audio에서 where 뒤에 완전한 절이 오는 이유는?", "a": "where가 접속사와 부사 역할을 함께 하는 관계부사이기 때문", "p": "where"}, {"t": "hearing : 청각, 청력", "c": "g", "x": "hearing은 여기서 명사로 ‘청각, 청력’이라는 뜻이다. hearing disabilities는 ‘청각 장애’를 뜻한다. 동사 hear(듣다)에서 나온 명사로, 동사의 -ing 형태와 구별해서 뜻을 함께 외운다.", "n": ["hearing (n.) 청각, 청력", "hearing disability = 청각 장애"], "q": "hearing disabilities는 무슨 뜻인가?", "a": "청각 장애", "p": "hearing disabilities"}, {"t": "형용사적 용법의 to부정사 : ways to access", "c": "b", "x": "ways to access information에서 to access는 앞의 명사 ways를 꾸미는 형용사적 용법의 to부정사이다. ‘정보에 접근할 수 있는 방법들’이라는 뜻이다. other ways는 ‘다른 방법들’이라는 뜻의 other + 복수명사이다.", "n": ["명사 + to부정사 = ~할, ~하는 (형용사적 용법)", "other + 복수명사 = 다른 ~들"], "q": "ways to access information에서 to access는 무엇을 꾸미는가?", "a": "앞의 명사 ways", "p": "ways to access information"}, {"t": "주격 관계대명사 that + 수동태 : information that is presented", "c": "b", "x": "information that is presented에서 that은 선행사 information을 받는 주격 관계대명사이다. that이 관계사절의 주어 역할을 하므로 바로 뒤에 동사 is presented가 온다. is presented는 be + p.p.의 수동태로 ‘제시되는’이라는 뜻이다.", "n": ["선행사 + that(주격) + 동사 = ~하는", "is presented = 제시되다 (수동태)"], "q": "information that is presented에서 that의 역할은?", "a": "선행사 information을 받는 주격 관계대명사 (관계사절의 주어)", "p": "that is presented in audio form"}, {"t": "they = 접근성 있는 웹 사이트들", "c": "o", "x": "For example, they may provide ...의 they는 바로 앞 문장의 주어인 accessible websites를 가리킨다. 접근성 있는 웹 사이트들이 대본이나 자막을 제공할 수도 있다는 뜻이다.", "n": ["they = accessible websites"], "q": "they may provide transcripts or captions의 they는 누구(무엇)인가?", "a": "접근성 있는 웹 사이트들 (accessible websites)", "p": "they"}, {"t": "help + 목적어 + 동사원형 : ~가 …하도록 돕다", "c": "b", "x": "that can help users access this information에서 that은 transcripts or captions를 받는 주격 관계대명사이다. help는 ‘help + 목적어 + 동사원형’의 형태로 쓰여 ‘users가 정보에 접근하도록 돕다’라는 뜻이다. 이때 목적어 users 뒤에 to access가 아니라 동사원형 access가 왔다.", "n": ["help + 목적어 + 동사원형(또는 to부정사) = ~가 …하도록 돕다"], "q": "help users access this information을 해석하면?", "a": "사용자가 이 정보에 접근하도록 돕다", "p": "help users access this information"}, {"t": "not only A but also B : A뿐만 아니라 B도", "c": "k", "x": "not only the text version of the spoken words but also descriptions of the music ...에서 A와 B는 문법적으로 대등한 같은 형태(명사구)이다. 자막이 ‘발화된 단어의 텍스트 버전뿐만 아니라 음악과 다른 소리들에 대한 설명도’ 포함한다는 뜻이다. 이 문장에서는 목적어 자리에 쓰였고, 상관접속사가 주어로 쓰일 때는 B에 동사의 수를 일치시킨다.", "n": ["not only A but also B = A뿐만 아니라 B도 (A, B는 같은 형태)", "주어일 때 동사는 B에 수일치"], "q": "not only A but also B가 주어로 쓰이면 동사는 무엇에 수를 일치시키는가?", "a": "B", "p": "not only the text version of the spoken words but also descriptions of the music and other sounds in the video"}]}, {"no": 4, "id": "z4", "sents": [{"n": 26, "mk": "[2|Having a visual disability] [1|doesn’t necessarily mean] a person can’t see at all.", "en": "Having a visual disability doesn’t necessarily mean a person can’t see at all.", "ko": "시각 장애를 지니고 있는 것은 반드시 한 사람이 전혀 보지 못한다는 것을 의미하지는 않는다."}, {"n": 27, "mk": "Some people, including many elderly people, simply have [3|poor eyesight]. This [5|makes it difficult for] [4|them] [5|to read].", "en": "Some people, including many elderly people, simply have poor eyesight. This makes it difficult for them to read.", "ko": "많은 노인들을 포함해서 일부 사람들은 그저 좋지 않은 시력을 가지고 있다. 이는 그들이 읽는 것을 어렵게 만든다."}, {"n": 28, "mk": "For this reason, accessible websites have a background color [6|that] contrasts with the color of their text.", "en": "For this reason, accessible websites have a background color that contrasts with the color of their text.", "ko": "이러한 이유로, 접근성 있는 웹 사이트는 텍스트 색과 대조를 이루는 배경 색을 지니고 있다."}, {"n": 29, "mk": "This makes the text [7|clear enough for most people to see].", "en": "This makes the text clear enough for most people to see.", "ko": "이는 대부분의 사람들이 보기에 텍스트를 충분히 명확하게 만들어 준다."}, {"n": 30, "mk": "As for audio content, accessible websites [8|allow users to adjust the volume of background sound or to] [9|turn it off altogether].", "en": "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether.", "ko": "음성 콘텐츠에 관해 말하자면, 접근성 있는 웹 사이트는 사용자가 배경음의 음량을 조절하거나 완전히 끌 수 있도록 해준다."}, {"n": 31, "mk": "This gives users [10|both with and without hearing difficulties] more control over their experience while they are using the sites.", "en": "This gives users both with and without hearing difficulties more control over their experience while they are using the sites.", "ko": "이는 청각 장애가 있는 사용자와 없는 사용자 모두에게 그들이 사이트를 사용하는 동안 그들의 경험에 대한 더 많은 통제권을 준다."}], "items": [{"t": "not necessarily : 반드시 ~인 것은 아니다 (부분부정)", "c": "k", "x": "doesn’t necessarily mean은 ‘반드시 ~을 의미하는 것은 아니다’라는 뜻의 부분부정이다. not과 necessarily가 함께 쓰여 ‘모든 경우가 그렇지는 않다’고 말한다. 그래서 시각 장애가 있어도 전혀 못 보는 것은 아닌 사람이 있다는 뜻이 된다. necessarily는 ‘필연적으로, 불가피하게’라는 뜻의 부사이다.", "n": ["not necessarily ~ = 반드시 ~인 것은 아니다 (부분부정)", "necessarily adv. 필연적으로, 불가피하게"], "q": "doesn’t necessarily mean은 어떻게 해석하는가?", "a": "반드시 ~을 의미하는 것은 아니다 (부분부정)", "p": "doesn’t necessarily mean"}, {"t": "동명사구 주어 : 단수 취급 (Having ... doesn’t)", "c": "b", "x": "Having a visual disability는 ‘시각 장애를 지니고 있는 것’이라는 동명사구 주어이다. 동명사구 주어는 단수로 취급해서 동사가 doesn’t이다. 또 mean 뒤에는 명사절 접속사 that이 생략되어 a person can’t see at all이 목적어 역할을 한다.", "n": ["동명사구 주어 = 단수 취급 (doesn’t / is)", "mean (that) 주어 + 동사 : that 생략"], "q": "Having a visual disability 뒤의 동사가 doesn’t인 이유는?", "a": "동명사구 주어는 단수로 취급하기 때문이다.", "p": "Having a visual disability"}, {"t": "poor eyesight : 좋지 않은 시력", "c": "g", "x": "poor는 ‘가난한’ 외에 ‘서투른, 잘 못하는’, ‘(환경·상황 등이) 좋지 않은’ 등의 뜻이 있다. 여기서 poor eyesight는 ‘좋지 않은 시력’이라는 뜻이다. eyesight는 ‘시력’이라는 뜻의 명사이다.", "n": ["poor eyesight = 좋지 않은 시력", "eyesight n. 시력"], "q": "poor eyesight는 무슨 뜻인가?", "a": "좋지 않은 시력", "p": "poor eyesight"}, {"t": "them = 시력이 좋지 않은 일부 사람들", "c": "o", "x": "for them to read의 them은 바로 앞 문장의 Some people을 가리킨다. 즉 많은 노인들을 포함해서 시력이 좋지 않은 사람들이다. 이 사람들에게 읽는 것이 어렵다는 내용이다.", "n": ["them = some people", "대명사 → 앞에서 누구인지 찾기"], "q": "for them to read의 them은 누구인가?", "a": "시력이 좋지 않은 일부 사람들 (some people)", "p": "them"}, {"t": "make + 가목적어 it + 형용사 + (for 의미상 주어) + to부정사", "c": "k", "x": "makes it difficult for them to read에서 it은 가목적어이고 진짜 목적어는 뒤의 to read이다. to부정사가 길어서 목적어 자리에 it을 대신 쓰고 진목적어를 뒤로 보냈다. 이때 it은 해석하지 않고, ‘그들이 읽는 것을 어렵게 만든다’로 해석한다. for them은 to read의 의미상 주어이다. 문장 맨 앞의 This는 앞 문장의 내용(시력이 좋지 않은 것)을 가리킨다.", "n": ["주어 + make + 가목적어 it + 형용사 + to V(진목적어)", "가목적어 it은 해석하지 않는다"], "q": "makes it difficult for them to read에서 it은 무엇이고 어떻게 해석하는가?", "a": "가목적어이다. 해석하지 않고 to read가 진목적어이다.", "p": "makes it difficult for them to read"}, {"t": "주격 관계대명사 that : a background color that contrasts", "c": "k", "x": "a background color that contrasts with the color of their text에서 that은 주격 관계대명사이다. 선행사는 a background color이고, that 뒤에 주어 없이 바로 동사 contrasts가 이어진다. 선행사가 단수라서 동사도 contrasts로 단수형을 썼다. ‘텍스트 색과 대조를 이루는 배경 색’으로 해석한다. contrast with는 ‘~와 대조를 이루다’라는 뜻이다.", "n": ["선행사 + that + 동사 = ~하는 (주격 관계대명사)", "관계절의 동사는 선행사에 수일치 (contrasts)"], "q": "that contrasts with ~에서 that의 선행사와 역할은?", "a": "선행사는 a background color이고, that은 주격 관계대명사이다.", "p": "that"}, {"t": "형용사 + enough + (for 의미상 주어) + to부정사 : ~하기에 충분히 …한", "c": "k", "x": "clear enough for most people to see는 ‘대부분의 사람들이 보기에 충분히 명확한’이라는 뜻이다. enough는 형용사 clear 뒤에 놓이고, 그 뒤에 to부정사가 온다. for most people은 to see의 의미상 주어이다. 문장 전체는 makes the text clear로 5형식(make + 목적어 + 형용사)이다.", "n": ["형용사[부사] + enough + to V = ~하기에 충분히 …한", "make + 목적어 + 형용사 = 목적어를 …하게 만들다"], "q": "clear enough for most people to see를 해석하면?", "a": "대부분의 사람들이 보기에 충분히 명확한", "p": "clear enough for most people to see"}, {"t": "allow + 목적어 + to부정사 + 병렬 연결 (to adjust ... or to turn ...)", "c": "b", "x": "allow users to adjust ...는 ‘사용자가 ~하도록 해준다’라는 뜻의 5형식이다. allow + 목적어 + to부정사 형태로 쓴다. or가 to adjust와 to turn off를 병렬로 연결해서 ‘조절하거나 끌 수 있도록’으로 해석한다. adjust는 ‘~을 조절하다’라는 뜻이다.", "n": ["allow + 목적어 + to V = 목적어가 ~하도록 해주다", "A or B 병렬 : to adjust ... or to turn ..."], "q": "or는 무엇과 무엇을 연결하는가?", "a": "to adjust the volume ...과 to turn it off altogether", "p": "allow users to adjust the volume of background sound or to turn it off"}, {"t": "turn ~ off : ~을 끄다 · altogether : 완전히", "c": "g", "x": "turn off는 ‘~을 끄다’라는 뜻의 구동사이다. 목적어가 it 같은 대명사일 때는 turn it off처럼 동사와 부사 사이에 쓴다. altogether는 ‘완전히, 전적으로’라는 뜻의 부사이다. 그래서 turn it off altogether는 ‘그것을 완전히 끄다’이다.", "n": ["turn ~ off = ~을 끄다 (대명사 목적어는 turn it off)", "altogether adv. 완전히, 전적으로"], "q": "turn it off altogether는 무슨 뜻이고, 왜 it이 off 앞에 있는가?", "a": "그것을 완전히 끄다. 대명사 목적어는 동사와 부사 사이에 온다.", "p": "turn it off altogether"}, {"t": "both A and B : A와 B 둘 다", "c": "k", "x": "both with and without hearing difficulties는 ‘청각 장애가 있는 사용자와 없는 사용자 모두’라는 뜻이다. both A and B에서 A는 with hearing difficulties이고 B는 without hearing difficulties이다. 문장은 gives users ... more control처럼 4형식(간접목적어 users + 직접목적어 more control)이다.", "n": ["both A and B = A와 B 둘 다 (A, B는 문법적으로 같은 형태)", "give + 간접목적어 + 직접목적어 = ~에게 …을 주다"], "q": "both with and without hearing difficulties에서 A와 B는 각각 무엇인가?", "a": "A = with hearing difficulties, B = without hearing difficulties", "p": "both with and without hearing difficulties"}]}, {"no": 5, "id": "z5", "sents": [{"n": 32, "mk": "Some users have disabilities [1|that] limit the movement of [2|their] hands.", "en": "Some users have disabilities that limit the movement of their hands.", "ko": "일부 사용자들은 그들의 손의 움직임을 제한하는 장애를 가지고 있다."}, {"n": 33, "mk": "They [3|rely on] their keyboards, [4|rather than] a mouse, [5|to navigate websites].", "en": "They rely on their keyboards, rather than a mouse, to navigate websites.", "ko": "그들은 웹 사이트를 탐색하기 위해 마우스보다는 키보드에 의존한다."}, {"n": 34, "mk": "On accessible websites, users can access everything on the site [6|using only a keyboard].", "en": "On accessible websites, users can access everything on the site using only a keyboard.", "ko": "접근성 있는 웹 사이트에서, 사용자는 키보드만을 사용하여 사이트에 있는 모든 것에 접근할 수 있다."}, {"n": 35, "mk": "This means that links, buttons, and fields, [7|which] are spaces [8|where] information is entered, [9|can be accessed] through keyboard navigation.", "en": "This means that links, buttons, and fields, which are spaces where information is entered, can be accessed through keyboard navigation.", "ko": "이는 링크, 버튼 그리고 정보가 입력되는 공간인 필드가 키보드 탐색을 통해 접근될 수 있다는 것을 의미한다."}, {"n": 36, "mk": "Users navigate the websites [10|by making use of] keys [11|such as the space bar, the arrow keys, the enter key, and the tab key].", "en": "Users navigate the websites by making use of keys such as the space bar, the arrow keys, the enter key, and the tab key.", "ko": "사용자는 스페이스 바, 화살표 키, 엔터 키 그리고 탭 키와 같은 키를 사용함으로써 웹 사이트를 탐색한다."}, {"n": 37, "mk": "For example, [2|they] can use the tab key [5|to jump] from one part of a web page to another.", "en": "For example, they can use the tab key to jump from one part of a web page to another.", "ko": "예를 들어, 그들은 웹 페이지의 한 부분에서 다른 부분으로 뛰어넘기 위해 탭 키를 사용할 수 있다."}, {"n": 38, "mk": "[12|Both] users with disabilities [12|and] [2|those] with temporarily injured hands can [13|benefit from] this kind of navigation.", "en": "Both users with disabilities and those with temporarily injured hands can benefit from this kind of navigation.", "ko": "장애를 가진 사용자와 일시적으로 손을 다친 사용자 모두가 이러한 종류의 탐색으로부터 득을 본다."}], "items": [{"t": "주격 관계대명사 that : ~하는 (disabilities를 꾸밈)", "c": "k", "x": "disabilities that limit the movement of their hands에서 that은 앞의 disabilities(장애)를 꾸미는 주격 관계대명사이다. that 뒤에 주어 없이 바로 동사 limit이 오기 때문에 주격이다. 선행사 disabilities가 복수라서 동사도 limit으로 쓴다. ‘손의 움직임을 제한하는 장애’라는 뜻이다.", "n": ["선행사 + that + 동사 = ~하는 (주격 관계대명사)", "관계사절의 동사는 선행사의 수에 일치"], "q": "disabilities that limit에서 that의 역할은 무엇이고 동사가 limit인 이유는?", "a": "주격 관계대명사. 선행사 disabilities가 복수라서 limit이다.", "p": "disabilities that limit the movement of their hands"}, {"t": "their, they, those = 사용자들 (users)", "c": "o", "x": "their hands의 their는 주어 Some users(일부 사용자들)를 가리킨다. 37번 문장의 they도 앞에서 말한 users(사용자들)이다. 38번 문장의 those with temporarily injured hands는 ‘일시적으로 손을 다친 사용자들’이라는 뜻으로, those가 users를 대신한다.", "n": ["their = users의", "they = users", "those with ~ = ~를 가진 사용자들"], "q": "their hands의 their는 누구를 가리키는가?", "a": "Some users (일부 사용자들)", "p": "their"}, {"t": "rely on ~ : ~에 의존하다", "c": "g", "x": "rely on은 ‘~에 의존하다, 의지하다’라는 뜻이다. They rely on their keyboards는 ‘그들은 키보드에 의존한다’라는 뜻이다. 주어 They가 복수라서 rely에 -s가 붙지 않았다. depend on과 비슷한 뜻이다.", "n": ["rely on ~ = ~에 의존하다 (= depend on ~)"], "q": "rely on their keyboards는 무슨 뜻인가?", "a": "그들의 키보드에 의존하다", "p": "rely on"}, {"t": "rather than ~ : ~보다는, ~대신에", "c": "k", "x": "rather than a mouse는 ‘마우스보다는’이라는 뜻이다. 키보드와 마우스를 비교해서 키보드를 고른다는 것을 보여 준다. rather than 뒤에는 a mouse처럼 비교 대상이 되는 말이 온다.", "n": ["A rather than B = B보다는 A, B가 아니라 A"], "q": "their keyboards, rather than a mouse에서 둘 중 무엇에 의존하는가?", "a": "키보드", "p": "rather than a mouse"}, {"t": "부사적 용법의 to부정사 : ~하기 위해 (목적)", "c": "b", "x": "to navigate websites는 ‘웹 사이트를 탐색하기 위해’라는 뜻으로, rely on their keyboards를 하는 목적을 나타낸다. 37번 문장의 to jump from one part of a web page to another도 ‘한 부분에서 다른 부분으로 뛰어넘기 위해’라는 목적이다. navigate는 ‘(웹 사이트 등)을 돌아다니다, 이동하다’라는 뜻의 동사이다.", "n": ["to + 동사원형 = ~하기 위해 (부사적 용법, 목적)"], "q": "to navigate websites는 어떤 용법이고 무슨 뜻인가?", "a": "부사적 용법(목적) — 웹 사이트를 탐색하기 위해", "p": "to navigate websites"}, {"t": "현재분사 using ~ : ~을 사용하여", "c": "b", "x": "using only a keyboard는 ‘키보드만을 사용하여’라는 뜻으로 접근하는 방법을 나타내는 현재분사구(분사구문)이다. using이 이끄는 구가 주절 users can access everything on the site를 꾸민다. using의 의미상 주어는 주절의 주어 users이다. only a keyboard는 ‘오직 키보드만’이라는 뜻이다.", "n": ["-ing + 목적어 = ~을 사용하여 (방법·수단)", "의미상 주어 = 주절의 주어"], "q": "using only a keyboard의 의미상 주어는 누구인가?", "a": "users (주절의 주어)", "p": "using only a keyboard"}, {"t": "계속적 용법의 주격 관계대명사 which", "c": "k", "x": "fields, which are spaces ...에서 which 앞에는 쉼표(,)가 있고 선행사는 fields이다. which 뒤에 바로 동사 are가 오므로 주격 관계대명사이다. 쉼표 뒤의 which는 앞말을 보충 설명하며 ‘필드, 그것은 정보가 입력되는 공간이다’라고 풀어서 이해한다. 이런 계속적 용법에는 that을 쓰지 않는다.", "n": ["선행사, which + 동사 = 선행사에 대한 보충 설명 (계속적 용법)", "계속적 용법에는 that 사용 불가"], "q": "fields, which are spaces에서 which의 선행사는 무엇이고 that으로 바꿀 수 있는가?", "a": "fields. 쉼표 뒤라서 that으로 바꿀 수 없다.", "p": "which are spaces where information is entered"}, {"t": "관계부사 where : ~하는 (장소)", "c": "b", "x": "spaces where information is entered에서 where는 선행사 spaces(공간)를 꾸미는 관계부사이다. where 뒤에 information is entered라는 주어와 동사가 모두 있는 완전한 절이 온다. where는 in which와 같은 뜻이다. ‘정보가 입력되는 공간’이라는 뜻이다. information is entered는 ‘입력되다’는 수동태이다.", "n": ["장소 선행사 + where + 완전한 절", "where = in/at/on which"], "q": "spaces where information is entered에서 where 뒤가 완전한 절인 이유는?", "a": "관계부사는 부사 역할이라 뒤에 주어·동사가 갖춰진 완전한 절이 온다.", "p": "spaces where information is entered"}, {"t": "조동사 + be + p.p. : ~될 수 있다 (수동태)", "c": "b", "x": "can be accessed through keyboard navigation은 ‘키보드 탐색을 통해 접근될 수 있다’라는 뜻이다. 주어 links, buttons, and fields는 접근하는 쪽이 아니라 접근되는 쪽이라서 수동태를 쓴다. 조동사 can 뒤에는 be + 과거분사(accessed)가 온다. access는 ‘~에 접근하다’라는 뜻의 동사이다.", "n": ["조동사 + be + p.p. = ~될 수 있다"], "q": "can be accessed는 능동과 수동 중 무엇이고 왜인가?", "a": "수동태 — 주어(링크·버튼·필드)가 접근되는 대상이다.", "p": "can be accessed through keyboard navigation"}, {"t": "make use of ~ : ~을 이용하다 (by making use of ~)", "c": "g", "x": "make use of는 ‘~을 이용하다’라는 뜻이고 use와 비슷하다. by making use of keys는 ‘키를 사용함으로써’라는 뜻이다. 전치사 by 뒤에는 동명사가 와서 making이 되었다. ‘~함으로써’처럼 방법을 말할 때 쓴다.", "n": ["make use of ~ = ~을 이용하다 (= use)", "by + 동명사 = ~함으로써"], "q": "by making use of keys에서 making 형태인 이유는?", "a": "전치사 by의 목적어 자리라서 동명사를 쓴다.", "p": "by making use of"}, {"t": "such as ~ : ~와 같은 · 병렬연결", "c": "k", "x": "such as는 ‘~와 같은’이라는 뜻으로 예를 들 때 쓰는 구전치사이고 뒤에는 명사(구)가 온다. keys such as the space bar, the arrow keys, the enter key, and the tab key에서 4개의 키가 and로 이어져 병렬을 이룬다. 이처럼 병렬 연결에서는 같은 형태(the + 명사)로 맞춘다.", "n": ["명사 + such as + 명사(구) = ~와 같은 (예시)", "A, B, C, and D = 같은 형태끼리 병렬"], "q": "such as 뒤에 이어진 4개의 키는 어떤 관계로 연결되어 있는가?", "a": "and로 연결된 병렬 관계(같은 형태의 명사구)", "p": "such as the space bar, the arrow keys, the enter key, and the tab key"}, {"t": "both A and B : A와 B 모두", "c": "k", "x": "Both users with disabilities and those with temporarily injured hands에서 Both ... and가 두 대상을 묶어 ‘A와 B 모두’라는 뜻을 만든다. A는 users with disabilities이고 B는 those with temporarily injured hands이다. A와 B는 서로 비슷한 형태로 맞춘다. Both A and B가 주어일 때는 복수로 취급한다.", "n": ["both A and B = A와 B 모두", "A, B는 같은 형태 (병렬), 주어일 때 복수 취급"], "q": "Both ... and가 연결하는 두 대상은 무엇인가?", "a": "users with disabilities / those with temporarily injured hands", "p": "Both users with disabilities and those with temporarily injured hands"}, {"t": "benefit from ~ : ~로부터 득을 보다", "c": "g", "x": "benefit은 명사로는 ‘이익, 이점’이고 동사로는 ‘~에게 유익하다’ 또는 ‘이익을 얻다(from)’라는 뜻이다. can benefit from this kind of navigation에서는 뒤에 from이 와서 ‘이런 종류의 탐색으로부터 득을 본다’라는 뜻이다. this kind of는 ‘이런 종류의’라는 뜻이다.", "n": ["benefit from ~ = ~로부터 이익을 얻다", "this kind of + 명사 = 이런 종류의 ~"], "q": "can benefit from this kind of navigation은 무슨 뜻인가?", "a": "이런 종류의 탐색으로부터 득을 볼 수 있다", "p": "benefit from"}]}, {"no": 6, "id": "z6", "sents": [{"n": 39, "mk": "Color blindness is a common visual disability. People with color blindness [1|find it difficult] to [2|tell some colors apart].", "en": "Color blindness is a common visual disability. People with color blindness find it difficult to tell some colors apart.", "ko": "색맹은 흔한 시각 장애이다. 색맹인 사람들은 몇몇 색들을 구별하는 것을 어렵다고 여긴다."}, {"n": 40, "mk": "This can cause problems, especially [3|when graphs and charts only use colors] [4|to show the differences between sets of information].", "en": "This can cause problems, especially when graphs and charts only use colors to show the differences between sets of information.", "ko": "이는 특히 그래프와 차트가 정보 세트들 간의 차이를 나타내기 위해 색상만을 사용할 때 문제를 일으킬 수 있다."}, {"n": 41, "mk": "Accessible websites use [5|other indicators] along with the colors.", "en": "Accessible websites use other indicators along with the colors.", "ko": "접근성 있는 웹 사이트는 색상과 더불어 다른 지표들도 사용한다."}, {"n": 42, "mk": "For example, a line in green may also be [7|dotted], [6|while] a line in blue is [7|solid].", "en": "For example, a line in green may also be dotted, while a line in blue is solid.", "ko": "예를 들어, 녹색 선은 점선일 수도 있는 반면에, 파란색 선은 실선이다."}, {"n": 43, "mk": "This [8|ensures that] everyone can [2|tell the two lines apart].", "en": "This ensures that everyone can tell the two lines apart.", "ko": "이는 모든 이가 두 선을 구별할 수 있도록 한다."}, {"n": 44, "mk": "The accessibility features of websites don’t just help people with disabilities.", "en": "The accessibility features of websites don’t just help people with disabilities.", "ko": "웹 사이트의 접근성 특징들은 단지 장애가 있는 사람들만을 돕는 것이 아니다."}, {"n": 45, "mk": "[9|They] can [10|make online experiences easier] for everyone, [11|regardless of abilities or situations].", "en": "They can make online experiences easier for everyone, regardless of abilities or situations.", "ko": "그것들은 능력이나 상황과 상관없이 모두에게 온라인 경험을 더 용이하게 만들어 줄 수 있다."}, {"n": 46, "mk": "When websites are [12|easy to navigate and understand], we can all [13|benefit from] a more [13|inclusive] online experience.", "en": "When websites are easy to navigate and understand, we can all benefit from a more inclusive online experience.", "ko": "웹 사이트가 탐색하고 이해하기에 더 쉬울 때, 우리는 더 차별 없는 온라인 경험으로부터 득을 볼 수 있다."}], "items": [{"t": "find + it(가목적어) + difficult + to부정사 : ~하는 것을 어렵다고 여기다", "c": "k", "x": "find it difficult to tell some colors apart에서 it은 가목적어이고, 진짜 목적어는 뒤의 to tell some colors apart이다. to부정사구가 길어서 it을 먼저 쓰고 뒤로 보낸 것이다. difficult는 목적격보어이다. ‘몇몇 색들을 구별하는 것을 어렵다고 여긴다’라고 해석한다.", "n": ["find + it + 형용사 + to V = ~하는 것을 …하다고 여기다", "it = 가목적어, to V = 진목적어"], "q": "find it difficult to tell에서 it과 to tell은 각각 무엇인가?", "a": "it = 가목적어 / to tell ~ = 진목적어", "p": "find it difficult to tell some colors apart"}, {"t": "tell ~ apart : ~을 구별하다", "c": "g", "x": "tell some colors apart는 ‘몇몇 색들을 구별하다’라는 뜻이다. tell ~ apart는 ‘~을 구별하다, 분간하다’라는 뜻의 구동사이다. 43번 문장의 tell the two lines apart는 ‘두 선을 구별하다’라는 뜻이다. 목적어가 tell과 apart 사이에 들어간다.", "n": ["tell A apart = A를 구별하다", "목적어는 tell과 apart 사이에 온다"], "q": "tell the two lines apart의 뜻은?", "a": "두 선을 구별하다", "p": "tell some colors apart"}, {"t": "접속사 when + 절 : ~할 때", "c": "b", "x": "when graphs and charts only use colors는 ‘그래프와 차트가 색상만을 사용할 때’라는 뜻이다. when은 접속사라서 뒤에 주어(graphs and charts)와 동사(use)가 온다. 문제를 일으킬 수 있는 때를 설명하는 부사절이다.", "n": ["when + 주어 + 동사 = ~할 때 (접속사)"], "q": "when graphs and charts only use colors는 어떻게 해석하는가?", "a": "그래프와 차트가 색상만을 사용할 때", "p": "when graphs and charts only use colors"}, {"t": "부사적 용법의 to부정사 : ~하기 위해", "c": "b", "x": "to show the differences between sets of information은 ‘정보 세트들 간의 차이를 나타내기 위해’라는 뜻이다. 색상을 사용하는 목적을 나타내는 부사적 용법의 to부정사이다. differences는 difference(차이)의 복수형이고, sets는 set(세트, 묶음)의 복수형이다.", "n": ["to + 동사원형 = ~하기 위해 (목적, 부사적 용법)"], "q": "to show the differences ~의 to부정사는 어떤 뜻으로 쓰였는가?", "a": "~을 나타내기 위해 (목적)", "p": "to show the differences between sets of information"}, {"t": "other + 복수명사 : 다른 ~들", "c": "b", "x": "other indicators는 ‘다른 지표들’이라는 뜻이다. other는 뒤에 복수명사가 와서 ‘다른 ~들’을 나타낸다. indicator는 ‘지표, 척도’라는 뜻의 명사이고, 여기서는 복수형 indicators이다. along with the colors는 ‘색상과 더불어’라는 뜻이다.", "n": ["other + 복수명사 = 다른 ~들", "indicator = 지표, 척도 / along with ~ = ~와 더불어"], "q": "other indicators는 무슨 뜻이고, indicators는 어떤 형태인가?", "a": "다른 지표들 / indicator(지표)의 복수형", "p": "other indicators"}, {"t": "접속사 while : ~인 반면에", "c": "b", "x": "while a line in blue is solid는 ‘파란색 선은 실선인 반면에’라는 뜻이다. 이 문장의 while은 두 내용을 대조하는 접속사이다. 앞의 녹색 선은 점선일 수 있다는 내용과 파란색 선은 실선이라는 내용이 대비된다. 뒤에 주어(a line in blue)와 동사(is)가 온다.", "n": ["while + 주어 + 동사 = ~인 반면에 (대조)"], "q": "이 문장에서 while은 어떤 뜻인가?", "a": "~인 반면에 (두 내용을 대조)", "p": "while a line in blue is solid"}, {"t": "dotted : 점이 찍힌 · solid : 죽 이어진", "c": "g", "x": "dotted는 ‘점이 찍힌, 점무늬가 있는’이라는 뜻이다. 동사 dot(점을 찍다)에서 나온 분사형 형용사이다. solid는 ‘고체의’라는 뜻도 있지만 여기서는 ‘죽 이어진, 연속적인’이라는 뜻이다. 그래서 a line ... is solid는 ‘실선이다’라고 해석한다.", "n": ["dotted = 점이 찍힌 (점선의)", "solid = 고체의 / 죽 이어진, 연속적인 (실선의)"], "q": "선을 설명할 때 dotted와 solid는 각각 무슨 뜻인가?", "a": "dotted = 점선의 / solid = 실선의 (죽 이어진)", "p": "dotted"}, {"t": "ensure + that절 : ~하도록 확실히 하다", "c": "b", "x": "This ensures that everyone can tell the two lines apart.에서 that은 접속사이고 뒤에 주어(everyone)와 동사(can tell)가 이어진다. ensure는 ‘~을 확실하게 하다, 보장하다’라는 뜻의 동사이고, 주어가 3인칭 단수 This라서 ensures가 되었다. ‘이는 모든 이가 두 선을 구별할 수 있도록 한다’라고 해석한다.", "n": ["ensure + that + 주어 + 동사 = ~하도록 확실히 하다", "접속사 that 뒤에는 완전한 절"], "q": "ensures that everyone can tell ~에서 ensures의 -s는 왜 붙었는가?", "a": "주어 This가 3인칭 단수이기 때문", "p": "ensures that everyone can tell the two lines apart"}, {"t": "They = 웹 사이트의 접근성 특징들", "c": "o", "x": "They can make online experiences easier의 They는 바로 앞 문장의 주어 The accessibility features of websites를 가리킨다. features가 복수라서 복수 대명사 They로 받았다. ‘웹 사이트의 접근성 특징들’이 온라인 경험을 쉽게 만든다는 뜻이다.", "n": ["They = 웹 사이트의 접근성 특징들", "대명사 → 앞 문장의 주어에서 찾기"], "q": "They can make online experiences easier의 They는 무엇인가?", "a": "웹 사이트의 접근성 특징들 (The accessibility features of websites)", "p": "They"}, {"t": "make + 목적어 + 형용사 : ~가 …하게 만들다 (5형식)", "c": "k", "x": "make online experiences easier는 ‘온라인 경험을 더 쉽게 만들다’라는 뜻이다. make + 목적어(online experiences) + 목적격보어(easier)의 5형식이다. 목적격보어 자리에는 부사가 아니라 형용사(easier)가 온다. easier는 easy(쉬운)의 비교급이다.", "n": ["make + 목적어 + 형용사 = ~가 …하게 만들다", "보어 자리에는 형용사 (부사 X)"], "q": "make online experiences easier에서 easie function refOf(t){var r=t.split(' = ')[1]||'',q=r.match(/\(([^)]*)\)\s*$/);return q?q[1]:r}
function marks(mk,s,mode,only,sn){
