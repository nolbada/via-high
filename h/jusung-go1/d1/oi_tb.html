: "하지만 이건 작은 문제, 장애가 있는 사람에게 웹 사이트는 거의 사용 불가능"}, "clues": [["If you are right-handed", "주어진 글의 질문(인터넷 접속은?)에 대한 첫 대답 = (B)"], ["However, this is a minor challenge", "(C)의 this = (B)의 왼손으로 마우스 쓰기의 어려움, However로 더 큰 문제로 전환"], ["This is the reason", "(A)의 This = (C)의 장애인에게 웹 사이트가 거의 사용 불가능하다는 것"]], "flow": ["(오른팔을 다쳤다면) 인터넷에 접속하는 것은 어떨까?", "왼손으로 마우스를 쓰면 어색하고 오래 걸림", "하지만 장애가 있는 사람에겐 웹 사이트 자체가 거의 사용 불가능", "그래서 웹 접근성이 중요함, 웹 접근성 = 모두가 쓸 수 있게 하는 실천"]}, {"id": "g1_jusung_L4-2", "src": "g1_jusung_L4.txt", "label": "4과 이미지에 대한 텍스트 설명", "type": "order", "given": "Along with text, most websites include other forms of information, such as images. Sometimes such visual information is important for understanding the text.", "parts": {"A": "However, these programs cannot “read” images. Accessible websites solve this problem by providing alternative text, also known as “alt text.”", "B": "Alt text is a brief description of non-textual information. For instance, if an image shows a group of students, its alt text would explain how many students are in the image and what they are doing.", "C": "This is a problem for users with visual disabilities. When they go on a website, they often use programs called “screen readers,” which read online text aloud."}, "answer": "C-A-B", "hint": {"given": "웹 사이트에는 이미지 같은 시각 정보가 있고, 그것이 중요할 때가 있음", "A": "그러나 이 프로그램들은 이미지를 못 읽음, 접근성 있는 사이트는 대체 텍스트(alt text)로 해결", "B": "대체 텍스트 = 비문자 정보에 대한 짧은 설명, 학생 사진 예시", "C": "이것은 시각 장애인에게 문제, 그들은 스크린 리더라는 프로그램을 씀"}, "clues": [["This is a problem", "(C)의 This = 주어진 글의 중요한 시각 정보(이미지)"], ["these programs", "(A)의 these programs = (C)의 screen readers"], ["Alt text is a brief description", "(A)에서 처음 소개된 alt text를 (B)에서 정의하고 예를 듦"]], "flow": ["웹 사이트에는 이미지 같은 시각 정보가 있고 이해에 중요할 때가 있음", "시각 장애인에게는 문제, 그들은 화면 글을 읽어 주는 스크린 리더를 씀", "그런데 스크린 리더는 이미지를 못 읽음, 그래서 대체 텍스트(alt text)를 제공", "대체 텍스트 = 이미지에 대한 짧은 설명(학생이 몇 명, 무엇을 하는지)"]}, {"id": "g1_jusung_L4-3", "src": "g1_jusung_L4.txt", "label": "4과 멀티미디어 콘텐츠를 위한 대본과 자막", "type": "order", "given": "In some cases, audio content cannot be accessed or understood. Some people may have hearing disabilities, while others might be in places where they can't listen to audio, such as a quiet library.", "parts": {"A": "Transcripts are text versions of the entire audio content, while captions are text versions of the audio that appear in a video as it plays. Captions include not only the text version of the spoken words but also descriptions of the music and other sounds in the video.", "B": "For example, they may provide transcripts or captions that can help users access this information.", "C": "Therefore, accessible websites often offer other ways to access information that is presented in audio form."}, "answer": "C-B-A", "hint": {"given": "음성 콘텐츠를 못 듣는 경우가 있음(청각 장애, 조용한 도서관)", "A": "대본 = 음성 전체의 글 버전, 자막 = 영상 속 음성의 글 버전(음악·소리 설명도 포함)", "B": "예를 들어 대본이나 자막을 제공함", "C": "그러므로 접근성 있는 사이트는 음성 정보에 접근할 다른 방법을 제공함"}, "clues": [["Therefore", "(C)는 주어진 글의 문제(음성을 못 들음)에 대한 결과·해결책"], ["For example, they may provide", "(B)의 they = (C)의 accessible websites, other ways의 예시"], ["Transcripts are ... captions are", "(B)에서 처음 나온 transcripts와 captions를 (A)에서 하나씩 설명"]], "flow": ["음성 콘텐츠를 못 듣는 사람이 있음(청각 장애, 조용한 도서관)", "그래서 접근성 있는 사이트는 음성 정보를 볼 다른 방법을 제공", "예를 들어 대본이나 자막", "대본 = 음성 전체 글, 자막 = 영상 속 글(음악·소리 설명까지)"]}, {"id": "g1_jusung_L4-4", "src": "g1_jusung_L4.txt", "label": "4과 보고 듣기에 쉬운 콘텐츠", "type": "insert", "sentence": "For this reason, accessible websites have a background color that contrasts with the color of their text.", "segs": ["Having a visual disability doesn't necessarily mean a person can't see at all.", "Some people, including many elderly people, simply have poor eyesight.", "This makes it difficult for them to read.", "This makes the text clear enough for most people to see.", "As for audio content, accessible websites allow users to adjust the volume of background sound or to turn it off altogether. This gives users both with and without hearing difficulti
