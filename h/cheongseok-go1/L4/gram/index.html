<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e98a00"><title>교과서 4과 문법 분석</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--sub:#5b677a;--line:#d9e0ec;--pri:#1d4ed8;--off:#e9eef8;--note:#fffbe6;--noteL:#d9c76a;--noteT:#8a6d00;--noteLn:#efe6b3;
 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;font-size:16px}

.top{display:flex;align-items:center;gap:10px;margin:2px 0 10px}

"en": "Here are three areas where changes are already happening.", "ko": "여기 이미 변화가 일어나고 있는 세 영역이 있다."}], "items": [{"t": "in trouble : 궁지[위기]에 처한", "c": "g", "x": "in trouble은 ‘궁지[위기]에 처한’이라는 뜻이다. Our environment is in trouble은 ‘우리의 환경은 어려움에 처해 있다’는 뜻으로, 글 전체의 문제 제기를 알리는 첫 문장이다.", "n": ["in trouble = 궁지[위기]에 처한"], "q": "Our environment is in trouble에서 in trouble은 무슨 뜻인가?", "a": "궁지[위기]에 처한", "p": "in trouble"}, {"t": "with + 명사 + 현재분사 : ~이 …하면서(한 채로)", "c": "k", "x": "With the planet becoming warmer는 with + 명사(the planet) + 현재분사(becoming)의 with 분사구문이다. ‘지구가 더 따뜻해지면서’라는 부대상황을 나타낸다. 명사와 분사가 능동 관계(지구가 따뜻해지다)라서 현재분사를 썼다. 수동 관계이면 과거분사를 쓴다.", "n": ["with + 명사(구) + 현재분사(구) = ~이 …하면서 (능동 관계)", "with + 명사(구) + 과거분사(구) = ~이 …된 채로 (수동 관계)"], "q": "With the planet becoming warmer에서 becoming이 현재분사인 이유는?", "a": "the planet이 ‘따뜻해지는’ 주체라서 명사와 분사가 능동 관계이기 때문이다.", "p": "With the planet becoming warmer"}, {"t": "is being produced : 현재진행형 수동태", "c": "k", "x": "is being produced는 be동사 + being + p.p.의 현재진행형 수동태이다. ‘(지금) 생산되고 있다’는 뜻이다. 주어 waste(쓰레기)는 스스로 만드는 것이 아니라 ‘생산되는’ 쪽이라서 수동태이다. produce는 ‘~을 생산하다’이고 produced는 그 과거분사형이다.", "n": ["be동사 + being + p.p. = ~되고 있는 중이다 (현재진행형 수동태)"], "q": "More and more waste is also being produced의 동사 형태와 뜻은?", "a": "현재진행형 수동태(is being + p.p.) — 생산되고 있다", "p": "being produced"}, {"t": "cause : ~을 야기하다, 초래하다", "c": "g", "x": "cause는 동사로 ‘~을 야기하다, 초래하다’이고 명사로는 ‘원인’이다. is causing은 cause의 -ing형을 써서 ‘(지금) 야기하고 있다’는 현재진행형이 된 것이다. causing problems with soil and water pollution은 ‘토양과 수질 오염에 관련한 문제를 야기하고 있다’는 뜻이다.", "n": ["cause (v.) = ~을 야기하다, 초래하다", "cause (n.) = 원인"], "q": "is causing에서 causing은 어떤 동사의 어떤 형태이며 뜻은?", "a": "동사 cause(~을 야기하다)의 -ing형", "p": "causing"}, {"t": "It is clear that ~ : ~라는 것은 분명하다 (가주어-진주어)", "c": "k", "x": "It is clear that humans are ...에서 It은 가주어이고 진짜 주어는 that humans ... nature까지의 that절이다. that절이 길어서 뒤로 보내고 자리에 it을 넣은 것이다. 해석은 ‘인간이 ~라는 것은 분명하다’처럼 that절부터 푼다.", "n": ["It + be + 형용사 + that + 주어 + 동사 = ~라는 것은 …하다 (가주어 it, 진주어 that절)"], "q": "It is clear that humans are ...에서 진짜 주어는 무엇인가?", "a": "that humans are a major contributor to the destruction of nature (that절)", "p": "It is clear that"}, {"t": "contributor : 원인 제공자, 기부자", "c": "g", "x": "contributor는 ‘원인 제공자, 기부자’라는 뜻의 명사이다. 동사 contribute(기여하다, (~의) 한 원인이 되다)에 사람을 뜻하는 -or이 붙은 것이다. a major contributor to the destruction of nature는 ‘자연 파괴의 주요 원인 제공자’이다.", "n": ["contribute(v.) + -or → contributor(n.) = 원인 제공자, 기부자", "a contributor to ~ = ~의 원인 제공자"], "q": "contributor는 어떤 동사에 무엇이 붙어서 만들어진 말인가?", "a": "동사 contribute + -or", "p": "contributor"}, {"t": "will + 주어 + be able to : ~할 수 있게 될까?", "c": "b", "x": "be able to는 can과 같은 ‘~할 수 있다’는 뜻이다. can은 will 뒤에 함께 쓸 수 없어서, 미래의 가능을 말할 때 will be able to를 쓴다. Will we be able to protect ...?는 ‘우리가 보호할 수 있게 될까?’라는 의문문이다. 의문문이라서 Will이 주어 we 앞으로 나왔다.", "n": ["be able to + 동사원형 = ~할 수 있다", "will be able to = ~할 수 있게 될 것이다 (will can은 불가)"], "q": "‘~할 수 있게 될 것이다’는 will can과 will be able to 중 무엇으로 쓰는가?", "a": "will be able to (조동사 두 개를 나란히 쓸 수 없다)", "p": "Will we be able to"}, {"t": "stop + 목적어 + from + -ing : ~가 …하지 못하게 막다", "c": "k", "x": "stop climate change from reaching은 ‘기후 변화가 도달하지 못하게 막다’는 뜻이다. stop 뒤에 목적어(climate change)가 오고 from 뒤에는 동명사(reaching)를 쓴다. keep, block, hinder 등으로 바꿔 쓸 수 있다. Can we ...?는 ‘우리가 ~할 수 있을까?’라는 뜻이다.", "n": ["stop + O + from + -ing = O가 ~하지 못하게 막다", "= keep[block, hinder] + O + from + -ing"], "q": "stop climate change from reaching dangerous levels를 해석하라.", "a": "기후 변화가 위험 수준에 도달하지 못하게 막다", "p": "stop climate change from reaching"}, {"t": "동명사구 주어 : 단수 취급 + seem + 형용사", "c": "b", "x": "Achieving these goals seems difficult에서 주어는 동명사구 Achieving these goals이다. 동명사구 주어는 단수 취급해서 동사가 seems이다. goals(복수)를 보고 seem을 쓰면 안 된다. seem + 형용사는 ‘~해 보인다’라는 뜻이다.", "n": ["동명사구 주어 = 단수 취급 (동사 seems)", "seem + 형용사 = ~해 보인다"], "q": "Achieving these goals ___ difficult에서 seems와 seem 중 무엇이고 왜인가?", "a": "seems — 동명사구 주어는 단수로 취급한다.", "p": "Achieving these goals seems"}, {"t": "may have p.p. : ~했을지도 모른다", "c": "b", "x": "may have provided는 may + have + p.p.로 ‘~했을지도 모른다’는 과거에 대한 추측이다. 여기서는 ‘자연이 해결책을 제공했을지도 모른다’는 뜻이다. provided는 동사 provide(~을 제공하다)의 과거분사형이다.", "n": ["may + have + p.p. = ~했을지도 모른다 (과거에 대한 약한 추측)", "must have p.p. = ~했음이 틀림없다"], "q": "may have provided는 무슨 뜻인가?", "a": "제공했을지도 모른다 (과거에 대한 추측)", "p": "may have provided"}, {"t": "provide A with B : A에게 B를 제공하다", "c": "b", "x": "provide us with solutions는 ‘우리에게 해결책을 제공하다’라는 뜻이다. provide 뒤에 받는 사람(us)이 먼저 오고 with 뒤에 제공하는 것(solutions)이 온다. 같은 뜻으로 provide solutions to us처럼 쓸 수도 있다.", "n": ["provide A with B = A에게 B를 제공하다", "= provide B for[to] A"], "q": "provide us with solutions에서 제공받는 대상과 제공되는 것은 각각 무엇인가?", "a": "제공받는 대상 = us, 제공되는 것 = solutions", "p": "us with"}, {"t": "관계부사 where : ~하는 (장소)", "c": "k", "x": "three areas where changes are already happening에서 where는 앞의 장소 선행사 areas를 꾸미는 관계부사이다. where 뒤는 changes are already happening처럼 완전한 문장이 온다. ‘변화가 이미 일어나고 있는 영역’이라고 푼다. Here are ...는 장소 부사가 앞에 나온 도치 구문이다.", "n": ["장소 선행사 + where + 완전한 절 = ~하는 (장소)", "where = in[at, on] + which"], "q": "three areas where changes are already happening에서 where 뒤가 완전한 절인 이유는?", "a": "where가 관계부사라서 전치사 + 관계대명사 역할을 하여 뒤에 빠진 문장 성분이 없다.", "p": "where changes are already happening"}]}, {"no": 2, "id": "z2", "sents": [{"n": 11, "mk": "[1|About fifty percent of plastic is produced] for single-use products.", "en": "About fifty percent of plastic is produced for single-use products.", "ko": "플라스틱의 약 50%는 일회용 제품을 위해 생산된다."}, {"n": 12, "mk": "That means [2|the items are used just once and then discarded].", "en": "That means the items are used just once and then discarded.", "ko": "그것은 제품들이 딱 한 번 사용된 후 버려진다는 것을 의미한다."}, {"n": 13, "mk": "Do you ever [3|stop to think] about [4|where these plastic items go] after you [5|throw them away]?", "en": "Do you ever stop to think about where these plastic items go after you throw them away?", "ko": "여러분이 플라스틱을 버린 후에 이것들이 어디로 가는지 생각하기 위해 멈춰(곰곰이 생각해) 본 적이 있는가?"}, {"n": 14, "mk": "[6|Recycling can help reduce] the amount of plastic in our landfills.", "en": "Recycling can help reduce the amount of plastic in our landfills.", "ko": "재활용하는 것은 우리의 매립지의(매립지로 가는) 플라스틱의 양을 줄이는 것을 도울 수 있다."}, {"n": 15, "mk": "However, [1|less than ten percent of the world’s plastic waste] [7|has been recycled so far].", "en": "However, less than ten percent of the world’s plastic waste has been recycled so far.", "ko": "그러나, 지금까지 세계 플라스틱 쓰레기의 10% 미만이 재활용되어 왔다."}, {"n": 16, "mk": "Often, plastic waste is moved to [8|places where] [9|it] is just dumped or burned.", "en": "Often, plastic waste is moved to places where it is just dumped or burned.", "ko": "종종, 플라스틱 쓰레기는 그저 내버려지거나 태워지는 곳으로 보내진다."}, {"n": 17, "mk": "Furthermore, between 8 and 14 million metric tons of plastic [10|end up in the ocean] every year.", "en": "Furthermore, between 8 and 14 million metric tons of plastic end up in the ocean every year.", "ko": "게다가, 8백만에서 1천4백만 톤의 플라스틱이 매년 바다에 유입된다."}, {"n": 18, "mk": "This [11|puts many marine species in danger].", "en": "This puts many marine species in danger.", "ko": "이것은 많은 해양 종들을 위험에 빠뜨린다."}, {"n": 19, "mk": "[12|With this in mind], scientists are [12|turning to] mealworms.", "en": "With this in mind, scientists are turning to mealworms.", "ko": "이것을 염두에 두고, 과학자들은 밀웜에 의지하고(몰두하고) 있다."}, {"n": 20, "mk": "Mealworms are the larvae of a certain species of beetle.", "en": "Mealworms are the larvae of a certain species of beetle.", "ko": "밀웜은 특정 종류의 딱정벌레의 유충이다."}, {"n": 21, "mk": "Special bacteria live inside them.", "en": "Special bacteria live inside them.", "ko": "특별한 박테리아가 그들 안에 산다."}, {"n": 22, "mk": "These bacteria can [13|break down] plastic.", "en": "These bacteria can break down plastic.", "ko": "이 박테리아는 플라스틱을 분해할 수 있다."}, {"n": 23, "mk": "This means that mealworms can actually [13|feed on] plastic.", "en": "This means that mealworms can actually feed on plastic.", "ko": "이것은 밀웜이 사실상 플라스틱을 먹고 살 수 있다는 것을 의미한다."}, {"n": 24, "mk": "Scientists are now looking for ways to cultivate the bacteria outside of mealworms.", "en": "Scientists are now looking for ways to cultivate the bacteria outside of mealworms.", "ko": "과학자들은 이제 밀웜의 체외에서 박테리아를 배양하는 방법을 찾고 있다."}, {"n": 25, "mk": "[16|They] also want to speed up the process [14|by which the bacteria break down plastic].", "en": "They also want to speed up the process by which the bacteria break down plastic.", "ko": "그들은 또한 박테리아가 플라스틱을 분해하는 과정의 속도를 올리기를 원한다."}, {"n": 26, "mk": "This may [15|help us keep our landfills plastic-free].", "en": "This may help us keep our landfills plastic-free.", "ko": "이것은 우리가 우리의 매립지를 플라스틱 없는 상태를 유지하도록 도울지도 모른다."}], "items": [{"t": "~ percent of + 명사 : 동사의 수는 of 뒤 명사에 일치", "c": "k", "x": "About fifty percent of plastic is produced에서 percent of 뒤의 plastic은 셀 수 없는 명사라서 동사가 단수 is이다. less than ten percent of the world’s plastic waste has에서도 waste가 단수 취급이라서 has를 쓴다. of 뒤 명사가 복수이면 동사도 복수로 쓴다.", "n": ["~ percent of + 단수·불가산명사 + 단수동사", "~ percent of + 복수명사 + 복수동사"], "q": "About fifty percent of plastic ___ produced에서 is/are 중 무엇이고 왜인가?", "a": "is — percent of 뒤의 plastic이 셀 수 없는 명사(단수 취급)이기 때문이다.", "p": "About fifty percent of plastic is produced"}, {"t": "명사절 접속사 that 생략 · 수동태의 병렬 : ~라는 것을, 사용된 후 버려진다", "c": "b", "x": "That means the items are used ...는 means 뒤에 접속사 that(~라는 것을)이 생략된 문장이다. 뒤에는 주어 + 동사가 있는 절이 온다. are used just once and then discarded는 are used와 (are) discarded가 and로 이어진 수동태 병렬이며, discarded는 동사 discard(~을 버리다)의 과거분사이다.", "n": ["means (that) + 주어 + 동사 = ~라는 것을 의미하다", "are p.p. and (are) p.p. = ~되고 …된다 (수동태 병렬)"], "q": "discarded는 어떤 동사 형태이고, 그 앞에 생략된 말은 무엇인가?", "a": "discard(~을 버리다)의 과거분사. 앞에 are가 생략된 수동태 병렬이다.", "p": "the items are used just once and then discarded"}, {"t": "stop + to부정사 : ~하기 위해 멈추다", "c": "k", "x": "stop to think는 ‘생각하기 위해 멈추다’라는 뜻이다. to think는 멈추는 목적을 나타낸다. stop thinking(동명사)이면 ‘생각하는 것을 멈추다’가 되어 뜻이 달라진다. 이 문장은 ‘멈춰서 곰곰이 생각해 본 적이 있는가’를 묻는다.", "n": ["stop + to부정사 = ~하기 위해 멈추다", "stop + -ing = ~하는 것을 멈추다"], "q": "stop to think와 stop thinking은 뜻이 어떻게 다른가?", "a": "stop to think = 생각하려고 멈추다 / stop thinking = 생각하는 것을 멈추다", "p": "stop to think"}, {"t": "간접의문문 : 의문사 + 주어 + 동사", "c": "b", "x": "where these plastic items go는 think about 뒤에 온 간접의문문이다. 의문문이 다른 문장 안에 들어가면 where + 주어 + 동사 순서가 된다. do나 does를 쓰지 않고 go라고 쓴다. 뜻은 ‘이 플라스틱 제품들이 어디로 가는지’이다.", "n": ["간접의문문 어순 = 의문사 + 주어 + 동사", "직접의문문 Where do items go? → 간접의문문 where items go"], "q": "where these plastic items go에서 do가 없는 이유는?", "a": "간접의문문이라서 의문사 + 주어 + 동사 어순이 되고 do를 쓰지 않는다.", "p": "where these plastic items go"}, {"t": "throw ~ away : ~을 버리다", "c": "g", "x": "throw ~ away는 ‘~을 버리다’라는 뜻의 구동사이다. 목적어가 them처럼 대명사이면 throw them away처럼 away 앞에 놓는다. after you throw them away에서 after는 접속사이므로 뒤에 you throw라는 절이 온다. 뜻은 ‘그것들을 버린 후에’이다.", "n": ["throw ~ away = ~을 버리다", "대명사 목적어는 throw + 대명사 + away 순서"], "q": "throw them away를 throw away them이라고 쓸 수 있는가?", "a": "없다. 목적어가 대명사이면 throw them away 순서로 쓴다.", "p": "throw them away"}, {"t": "동명사 주어 · help + 동사원형 : ~하는 것은, ~하는 것을 돕다", "c": "b", "x": "Recycling can help reduce ...에서 Recycling은 ‘재활용하는 것’이라는 뜻의 동명사 주어이다. 동명사 주어는 단수로 취급한다. help 뒤에는 동사원형이나 to부정사가 올 수 있어서 help reduce(= help to reduce)는 ‘줄이는 것을 돕다’라는 뜻이다.", "n": ["동명사 주어 = ~하는 것은 (단수 취급)", "help + 동사원형/to부정사 = ~하는 것을 돕다"], "q": "help reduce 대신 쓸 수 있는 다른 형태는?", "a": "help to reduce (help 뒤에는 동사원형이나 to부정사가 온다.)", "p": "Recycling can help reduce"}, {"t": "현재완료 수동태 has been recycled : 재활용되어 왔다", "c": "b", "x": "has been recycled는 have + been + p.p. 형태의 현재완료 수동태이다. ‘지금까지 재활용되어 왔다’라는 뜻이다. 문장 끝의 so far(지금까지)가 현재완료와 잘 어울리는 단서이다. 주어 ten percent of ... waste가 단수 취급이라서 have가 아니라 has를 쓴다.", "n": ["have/has been p.p. = ~되어 왔다 (현재완료 수동태)", "so far = 지금까지"], "q": "has been recycled는 어떤 시제와 태이고 무슨 뜻인가?", "a": "현재완료 수동태 — 재활용되어 왔다", "p": "has been recycled so far"}, {"t": "관계부사 where : ~하는 (장소)", "c": "k", "x": "places where it is just dumped or burned에서 where는 앞의 장소(places)를 꾸미는 관계부사이다. where 뒤에는 주어 + 동사가 모두 있는 완전한 절이 온다. where는 in which와 같다. is dumped or burned는 수동태 병렬이며 ‘그저 내버려지거나 태워지는 곳’이라는 뜻이다.", "n": ["선행사(장소) + where + 완전한 절", "where = 전치사 + which (in/at which)"], "q": "where 뒤에는 완전한 절과 불완전한 절 중 무엇이 오는가?", "a": "완전한 절 (it is dumped or burned처럼 주어가 있다.)", "p": "places where it is just dumped or burned"}, {"t": "it = plastic waste (플라스틱 쓰레기)", "c": "o", "x": "where it is just dumped or burned의 it은 주어인 plastic waste(플라스틱 쓰레기)를 가리킨다. waste는 셀 수 없는 명사라서 단수 대명사 it으로 받는다. 플라스틱 쓰레기가 그저 내버려지거나 태워진다는 뜻이다.", "n": ["it = plastic waste", "불가산명사는 it으로 받는다"], "q": "where it is just dumped or burned의 it은 무엇인가?", "a": "플라스틱 쓰레기 (plastic waste)", "p": "it"}, {"t": "end up in ~ : 결국 ~에 있게 되다", "c": "g", "x": "end up in the ocean은 ‘결국 바다에 있게 되다, 바다로 흘러들다’라는 뜻이다. 주어 tons(톤, 복수)에 맞춰 동사 end가 원형으로 쓰였다. 뒤에 장소나 상황이 온다. between 8 and 14 million metric tons는 ‘8백만에서 1천4백만 톤’이라는 뜻이다.", "n": ["end up in ~ = 결국 ~에 있게 되다", "end up in + 장소·상황"], "q": "end up in the ocean은 무슨 뜻인가?", "a": "결국 바다에 있게 되다 (바다로 흘러들다)", "p": "end up in the ocean"}, {"t": "put ~ in danger : ~을 위험에 빠뜨리다", "c": "g", "x": "puts many marine species in danger는 ‘많은 해양 종들을 위험에 빠뜨린다’라는 뜻이다. 주어 This가 3인칭 단수라서 put에 s가 붙은 puts가 쓰였다. marine은 ‘바다의, 해양의’, species는 ‘종’이라는 뜻이며 단수와 복수의 모양이 같다.", "n": ["put ~ in danger = ~을 위험에 빠뜨리다", "marine = 바다의, 해양의 / species = 종"], "q": "puts에 s가 붙은 이유는?", "a": "주어 This가 3인칭 단수이고 현재 시제이기 때문이다.", "p": "puts many marine species in danger"}, {"t": "with ~ in mind · turn to ~ : ~을 염두에 두고, ~에 의지하다", "c": "g", "x": "With this in mind는 ‘이것을 염두에 두고’라는 뜻이다. this는 앞 문장의 내용, 곧 플라스틱이 해양 생물을 위험에 빠뜨린다는 것을 말한다. are turning to mealworms는 ‘밀웜에 의지하고 있다’라는 뜻이며 turn to ~(~에 의지하다)에 현재진행형이 쓰였다.", "n": ["with ~ in mind = ~을 염두에 두고", "turn to ~ = ~에 의지하다 (are turning = 현재진행형)"], "q": "turn to ~는 무슨 뜻인가?", "a": "~에 의지하다", "p": "With this in mind"}, {"t": "break ~ down · feed on ~ : ~을 분해하다, ~을 먹고 살다", "c": "g", "x": "can break down plastic은 ‘플라스틱을 분해할 수 있다’라는 뜻이다. break ~ down은 ‘~을 분해하다’라는 구동사이고, can 뒤라서 동사원형 break가 쓰였다. can actually feed on plastic에서 feed on ~은 ‘~을 먹고 살다’라는 뜻이며 actually는 ‘사실상’이라는 뜻이다.", "n": ["break ~ down = ~을 분해하다", "feed on ~ = ~을 먹고 살다"], "q": "feed on plastic은 무슨 뜻인가?", "a": "플라스틱을 먹고 살다", "p": "break down … feed on"}, {"t": "전치사 + 관계대명사 by which : ~가 …하는 (방법·과정)", "c": "k", "x": "the process by which the bacteria break down plastic은 ‘박테리아가 플라스틱을 분해하는 과정’이라는 뜻이다. by which는 앞의 the process를 가리키며, 원래 문장은 the bacteria break down plastic by the process이다. 전치사 by가 which 앞으로 나왔고 which 뒤에는 완전한 절이 온다.", "n": ["선행사 + 전치사 + which + 완전한 절", "the process by which ~ = ~가 …하는 과정"], "q": "by which 뒤에는 완전한 절과 불완전한 절 중 무엇이 오는가?", "a": "완전한 절 (the bacteria break down plastic)", "p": "by which the bacteria break down plastic"}, {"t": "help + 목적어 + 동사원형 · keep + 목적어 + 형용사 : 5형식", "c": "k", "x": "help us keep our landfills plastic-free는 ‘우리가 매립지를 플라스틱 없는 상태로 유지하도록 돕다’라는 뜻이다. help + 목적어(us) + 동사원형(keep)의 형태이다. keep our landfills plastic-free는 keep + 목적어 + 형용사로 ‘~를 …한 상태로 유지하다’이다. plastic-free는 ‘플라스틱이 없는’이라는 뜻이다.", "n": ["help + 목적어 + 동사원형 = ~가 …하도록 돕다", "keep + 목적어 + 형용사 = ~를 …한 상태로 유지하다"], "q": "keep our landfills plastic-free에서 plastic-free의 역할은?", "a": "목적어 our landfills의 상태를 설명하는 형용사(목적격보어)이다.", "p": "help us keep our landfills plastic-free"}, {"t": "They = scientists (과학자들)", "c": "o", "x": "They also want to speed up ...의 They는 앞 문장의 주어 Scientists(과학자들)를 가리킨다. 밀웜이 아니라 박테리아의 분해 과정의 속도를 올리고 싶어 하는 사람은 과학자들이다.", "n": ["They = scientists", "대명사 → 앞 문장의 주어에서 찾기"], "q": "They also want to speed up의 They는 누구인가?", "a": "과학자들 (scientists)", "p": "They"}]}, {"no": 3, "id": "z3", "sents": [{"n": 27, "mk": "Mining and other industries [2|are causing] soil pollution [1|across the globe].", "en": "Mining and other industries are causing soil pollution across the globe.", "ko": "광산업과 다른 산업들이 전 세계적으로 토양 오염을 일으키고 있다."}, {"n": 28, "mk": "[3|Although] polluted soil [4|can be dug up and transported] to a landfill, this process is expensive.", "en": "Although polluted soil can be dug up and transported to a landfill, this process is expensive.", "ko": "비록 오염된 흙이 파져서 매립지로 옮겨질 수는 있지만, 이 과정은 비용이 많이 든다."}, {"n": 29, "mk": "Moreover, [5|it] only moves the problem to [7|another area] and does not really solve [6|it].", "en": "Moreover, it only moves the problem to another area and does not really solve it.", "ko": "게다가, 이것은 단지 문제를 다른 곳으로 옮기는 것이며 그것(문제)을 실제로 해결하지 않는다."}, {"n": 30, "mk": "Fortunately, [8|there is] an [9|eco-friendly and cost-effective] [10|way to restore] polluted soil— planting willow trees.", "en": "Fortunately, there is an eco-friendly and cost-effective way to restore polluted soil— planting willow trees.", "ko": "다행히도, 오염된 흙을 복구하는 친환경적이고 비용 대비 효과적인 방법이 있는데, 바로 버드나무를 심는 것이다."}, {"n": 31, "mk": "These amazing trees have extensive and well-developed root systems.", "en": "These amazing trees have extensive and well-developed root systems.", "ko": "이 놀라운 나무들은 광범위하고 잘 발달된 뿌리 체계를 가지고 있다."}, {"n": 32, "mk": "As a result, they naturally [11|extract a wide range of harmful materials from the soil].", "en": "As a result, they naturally extract a wide range of harmful materials from the soil.", "ko": "결과적으로, 그들은 토양으로부터 광범위한 해로운 물질들을 자연적으로 추출한다."}, {"n": 33, "mk": "They can also grow quickly, even in soil with a high acidity level or a lot of heavy metals in it.", "en": "They can also grow quickly, even in soil with a high acidity level or a lot of heavy metals in it.", "ko": "그들은 심지어 산도가 높거나 안에 중금속을 많이 품은 토양에서도 빠르게 자랄 수 있다."}, {"n": 34, "mk": "Research on the effectiveness of using willow trees for this purpose is in development.", "en": "Research on the effectiveness of using willow trees for this purpose is in development.", "ko": "이러한 목적으로 버드나무를 활용하는 것의 효율성에 대한 연구가 진행되고 있다."}, {"n": 35, "mk": "Scientists have found that some species of willow trees [12|are able to] absorb harmful materials better than others.", "en": "Scientists have found that some species of willow trees are able to absorb harmful materials better than others.", "ko": "과학자들은 몇몇 종류의 버드나무가 다른 것(종류)들에 비해 해로운 물질을 더 잘 흡수할 수 있다는 것을 알아냈다."}, {"n": 36, "mk": "Therefore, this promising area [4|should be further explored] to find out [13|which trees are the most effective].", "en": "Therefore, this promising area should be further explored to find out which trees are the most effective.", "ko": "그러므로, 어떤 (종류의) 나무들이 가장 효과적인지를 찾아내기 위해 이 촉망받는 분야는 더 깊게 탐구되어야 한다."}, {"n": 37, "mk": "In time, we [12|may be able to] clean up our land with willow trees.", "en": "In time, we may be able to clean up our land with willow trees.", "ko": "조만간, 우리는 버드나무로 우리의 땅을 깨끗하게 할 수 있을지도 모른다."}], "items": [{"t": "across the globe : 세계 곳곳에, 전 세계에", "c": "g", "x": "across the globe는 ‘지구 전체에 걸쳐’라는 뜻으로 ‘전 세계적으로’를 나타내는 숙어이다. 본문에서는 토양 오염이 어느 한 곳이 아니라 세계 곳곳에서 일어나고 있음을 말한다. around the world와 비슷한 뜻이다.", "n": ["across the globe = 세계 곳곳에, 전 세계에", "across the globe ≒ around the world"], "q": "soil pollution across the globe에서 across the globe는 무슨 뜻인가?", "a": "세계 곳곳에, 전 세계에", "p": "across the globe"}, {"t": "are causing : 현재진행형", "c": "b", "x": "are causing은 be동사(are) + 동사원형 + -ing 모양의 현재진행형이다. ‘일으키고 있다’처럼 지금 계속 진행되는 일을 나타낸다. 주어 Mining and other industries가 복수라서 be동사는 are이다.", "n": ["be동사 + -ing = ~하고 있다 (현재진행형)", "주어가 복수 → are + -ing"], "q": "are causing은 어떤 시제이고 무슨 뜻인가?", "a": "현재진행형 — 일으키고 있다", "p": "are causing"}, {"t": "접속사 Although + 절 : 비록 ~이지만", "c": "b", "x": "Although(비록 ~이지만)는 접속사라서 뒤에 polluted soil can be dug up and transported처럼 주어와 동사가 있는 절이 온다. 앞 절의 내용과 반대되는 내용이 콤마 뒤 this process is expensive에 이어진다. 명사만 올 때는 despite나 in spite of를 쓴다.", "n": ["Although + 주어 + 동사 ~, 주절 = 비록 ~이지만 …", "although 뒤에는 절, despite / in spite of 뒤에는 명사(구)"], "q": "Although 뒤에는 어떤 모양이 오는가?", "a": "주어 + 동사가 있는 절", "p": "Although"}, {"t": "조동사 + be p.p. : ~될 수 있다 / ~되어야 한다 (조동사 수동태)", "c": "k", "x": "can be dug up and transported는 can + be + p.p.의 수동태로 ‘파내져서 운반될 수 있다’라는 뜻이다. dug up(동사 dig up ‘~을 파내다’의 과거분사)과 transported(동사 transport ‘~을 운송하다’의 과거분사)가 and로 이어진 병렬 구조이다. 36번 문장의 should be further explored(더 깊게 탐구되어야 한다)도 같은 모양이다. 조동사 뒤에 수동태를 이어 쓸 때는 be동사의 원형 be를 쓰고 그 뒤에 p.p.가 온다.", "n": ["조동사 + be + p.p. = ~될 수 있다 / ~되어야 한다", "can be dug up and transported = 파내져서 운반될 수 있다"], "q": "should be further explored는 어떤 구조이고 무슨 뜻인가?", "a": "조동사 + be + p.p. 수동태 — 더 깊게 탐구되어야 한다", "p": "can be dug up and transported"}, {"t": "it = 이 과정 (오염된 흙을 매립지로 옮기는 과정)", "c": "o", "x": "it only moves the problem의 it은 바로 앞 문장의 this process(이 과정)를 가리킨다. 즉 오염된 흙을 파서 매립지로 옮기는 과정이 문제를 다른 곳으로 옮기기만 한다는 뜻이다.", "n": ["it = this process (오염된 흙을 매립지로 옮기는 과정)", "대명사 → 앞 문장에서 가리키는 대상 찾기"], "q": "it only moves the problem에서 it은 무엇을 가리키는가?", "a": "this process, 즉 오염된 흙을 매립지로 옮기는 과정", "p": "it"}, {"t": "it = 문제 (the problem)", "c": "o", "x": "does not really solve it의 it은 같은 문장의 the problem(문제)을 가리킨다. ‘문제를 다른 곳으로 옮기기만 하고 그 문제를 실제로 해결하지는 않는다’는 뜻이다.", "n": ["it = the problem", "같은 문장 앞쪽의 명사를 대신하는 it"], "q": "does not really solve it의 it은 무엇을 가리키는가?", "a": "the problem (문제)", "p": "it"}, {"t": "another + 단수명사 : 또 다른 ~, 다른 ~", "c": "b", "x": "another area의 another는 an + other가 합쳐진 말로, 뒤에 단수명사가 온다. 여기서는 ‘다른 한 곳’이라는 뜻으로 문제가 옮겨 가는 곳을 말한다. 복수명사가 오면 other areas처럼 other를 쓴다.", "n": ["another + 단수명사 = 또 다른 ~", "other + 복수명사 = 다른 ~들"], "q": "another area 대신 복수형으로 쓰면 어떻게 되는가?", "a": "other areas", "p": "another area"}, {"t": "there is + 명사 : ~이 있다 (유도부사 구문)", "c": "b", "x": "there is an eco-friendly and cost-effective way에서 there는 ‘거기’라는 뜻이 아니라 ‘~이 있다’를 만드는 유도부사이다. 진짜 주어는 be동사 뒤의 a way이고, 단수라서 be동사는 is이다. 뒤에 복수명사가 오면 there are를 쓴다.", "n": ["There is / are + 주어 = ~이 있다", "진짜 주어는 be동사 뒤의 명사 → 수일치"], "q": "there is an eco-friendly and cost-effective way에서 be동사가 is인 이유는?", "a": "진짜 주어 a way가 단수이기 때문", "p": "there is"}, {"t": "eco-friendly : 친환경적인 / cost-effective : 비용 대비 효과적인", "c": "g", "x": "eco-friendly(친환경적인)와 cost-effective(비용 효과가 높은)는 and로 이어져 way를 꾸민다. 버드나무 심기가 환경에 해롭지 않고 들인 비용에 비해 효과가 좋은 방법이라는 뜻이다. 둘 다 두 단어가 하이픈(-)으로 붙은 복합형용사이다.", "n": ["eco-friendly = 친환경적인", "cost-effective = 비용 대비 효과적인"], "q": "eco-friendly and cost-effective way는 어떤 방법인가?", "a": "친환경적이고 비용 대비 효과가 좋은 방법", "p": "eco-friendly and cost-effective"}, {"t": "a way to restore : 복구하는 방법 (형용사적 용법의 to부정사)", "c": "b", "x": "to restore polluted soil은 앞의 명사 way를 뒤에서 꾸미는 형용사적 용법의 to부정사이다. ‘오염된 흙을 복구하는 방법’이라는 뜻이다. restore는 ‘~을 되찾다, 회복하다, 복구하다’라는 동사이다.", "n": ["명사 + to부정사 = ~하는 (명사를 뒤에서 꾸밈)", "a way to restore = 복구하는 방법"], "q": "to restore polluted soil은 무엇을 꾸미는가?", "a": "명사 way (복구하는 방법)", "p": "way to restore"}, {"t": "extract A from B : B에서 A를 추출하다", "c": "g", "x": "extract A from B는 ‘B에서 A를 뽑아내다’라는 뜻이다. 본문에서는 A가 a wide range of harmful materials(아주 다양한 해로운 물질들), B가 the soil(토양)이다. 버드나무가 토양에서 해로운 물질을 뽑아낸다는 내용이다. a wide range of ~는 ‘아주 다양한 ~’이라는 뜻이다.", "n": ["extract A from B = B에서 A를 추출하다", "a wide range of ~ = 아주 다양한 ~"], "q": "they extract harmful materials from the soil에서 A와 B는 각각 무엇인가?", "a": "A = harmful materials(해로운 물질), B = the soil(토양)", "p": "extract a wide range of harmful materials from the soil"}, {"t": "be able to + 동사원형 : ~할 수 있다", "c": "k", "x": "are able to absorb는 ‘흡수할 수 있다’라는 뜻으로 can과 비슷하다. 37번 문장의 may be able to clean up처럼 조동사 뒤에서는 can을 쓸 수 없어서 be able to로 바꿔 쓴다. 두 문장 모두 to 뒤에는 동사원형이 온다.", "n": ["be able to + 동사원형 = ~할 수 있다 (= can)", "조동사 뒤에는 can 대신 be able to"], "q": "조동사 may 뒤에서 ‘~할 수 있다’는 어떻게 쓰는가?", "a": "may be able to + 동사원형", "p": "are able to"}, {"t": "간접의문문 : which trees are the most effective", "c": "k", "x": "find out 뒤의 which trees are the most effective는 의문문이 다른 문장 안으로 들어간 간접의문문이다. 의문사 which trees 뒤에 ‘주어 + 동사’ 순서가 아니라 trees가 이미 의문사와 한 덩어리인 주어이므로 are the most effective가 바로 이어진다. 전체가 find out의 목적어 역할을 하여 ‘어떤 나무들이 가장 효과적인지’라는 뜻이 된다.", "n": ["의문사 + (주어) + 동사 = 간접의문문 (평서문 어순)", "find out + 의문사절 = ~인지 알아내다"], "q": "find out which trees are the most effective는 무슨 뜻인가?", "a": "어떤 나무들이 가장 효과적인지 알아내다", "p": "which trees are the most effective"}]}, {"no": 4, "id": "z4", "sents": [{"n": 38, "mk": "Statistics show that [1|about thirty to forty percent of people in the world drink] coffee each day.", "en": "Statistics show that about thirty to forty percent of people in the world drink coffee each day.", "ko": "통계 자료는 세계의 약 30~40%의 사람들이 매일 커피를 마신다는 것을 보여 준다."}, {"n": 39, "mk": "The coffee-making process, however, [2|generates] used coffee grounds, [3|which are normally sent to landfills].", "en": "The coffee-making process, however, generates used coffee grounds, which are normally sent to landfills.", "ko": "그러나, 커피 만드는 과정은 커피 찌꺼기를 발생시키는데, 이것들은 보통 매립지로 보내진다."}, {"n": 40, "mk": "There, [4|they] can create a harmful greenhouse gas.", "en": "There, they can create a harmful greenhouse gas.", "ko": "거기에서, 그것들은 해로운 온실가스를 만들 수 있다."}, {"n": 41, "mk": "Unfortunately, there’s no way to [5|stop everyone in the world from drinking] coffee.", "en": "Unfortunately, there’s no way to stop everyone in the world from drinking coffee.", "ko": "불행하게도, 세계의 모든 사람들이 커피를 마시는 것을 멈추게 할 방법은 없다."}, {"n": 42, "mk": "However, we can reduce greenhouse gas emissions [6|by turning used coffee grounds into biofuel].", "en": "However, we can reduce greenhouse gas emissions by turning used coffee grounds into biofuel.", "ko": "그러나, 우리는 사용된 커피 찌꺼기를 바이오 연료로 바꿈으로써 온실가스 배출을 줄일 수는 있다."}, {"n": 43, "mk": "Biofuel is a natural fuel [7|that is made from plant or animal sources].", "en": "Biofuel is a natural fuel that is made from plant or animal sources.", "ko": "바이오 연료는 식물이나 동물성 원료로 만들어진 천연 연료이다."}, {"n": 44, "mk": "Researchers [8|have found that] they can grow algae on old coffee grounds without adding any other nutrients.", "en": "Researchers have found that they can grow algae on old coffee grounds without adding any other nutrients.", "ko": "연구자들은 그들이 오래된 커피 찌꺼기에서 어떤 다른 영양분도 더하지 않고 조류를 자라게 할 수 있다는 것을 알아냈다."}, {"n": 45, "mk": "If these algae [9|are exposed to] twenty hours of light and four hours of darkness each day, they eventually produce high-quality biofuel.", "en": "If these algae are exposed to twenty hours of light and four hours of darkness each day, they eventually produce high-quality biofuel.", "ko": "만약 이 조류가 20시간의 빛과 4시간의 어둠에 매일 노출되면, 그들은 마침내 양질의 바이오 연료를 생산한다."}, {"n": 46, "mk": "The biofuel is [10|renewable and sustainable], and it creates only a small amount of emissions.", "en": "The biofuel is renewable and sustainable, and it creates only a small amount of emissions.", "ko": "이 바이오 연료는 재생 가능하고 지속 가능하며, 적은 양의 배출물만 나온다."}, {"n": 47, "mk": "These are just a few solutions [11|we can find in nature].", "en": "These are just a few solutions we can find in nature.", "ko": "이것들은 우리가 자연에서 찾을 수 있는 소수의 해결책들에 불과하다."}, {"n": 48, "mk": "There could be many more possible solutions to the problems [11|we currently face].", "en": "There could be many more possible solutions to the problems we currently face.", "ko": "우리가 현재 직면한 문제들에 대해 가능성 있는 훨씬 더 많은 해결책들이 있을 수 있다."}, {"n": 49, "mk": "[12|It seems that] Mother Nature has given us one more chance.", "en": "It seems that Mother Nature has given us one more chance.", "ko": "대자연은 우리에게 또 한 번의 기회를 준 것처럼 보인다."}, {"n": 50, "mk": "[13|In return], we need to look for more ways [14|to keep the environment healthy and clean].", "en": "In return, we need to look for more ways to keep the environment healthy and clean.", "ko": "보답으로, 우리는 환경을 건강하고 깨끗하게 지킬 더 많은 방법을 찾을 필요가 있다."}, {"n": 51, "mk": "If we [15|do], the future of our planet may be bright after all.", "en": "If we do, the future of our planet may be bright after all.", "ko": "우리가 그렇게 한다면, 우리 지구의 미래는 결국 밝을지도 모른다."}], "items": [{"t": "~ percent of + 명사 : of 뒤 명사에 수일치", "c": "b", "x": "about thirty to forty percent of people in the world drink에서 percent는 단수·복수 모양이 같아서, 동사의 수는 of 뒤의 명사에 맞춘다. of 뒤가 복수 명사 people이라서 동사도 복수형 drink를 쓴다. Statistics show that의 that은 접속사로, 뒤의 절 전체가 ‘보여 주는 내용’이 된다.", "n": ["~ percent of + 복수명사 + 복수 동사", "~ percent of + 단수명사 + 단수 동사"], "q": "thirty percent of people ... drink에서 동사가 drinks가 아니라 drink인 이유는?", "a": "percent of 뒤의 명사 people이 복수이기 때문이다.", "p": "about thirty to forty percent of people in the world drink"}, {"t": "generate : 생산하다, 발생시키다", "c": "g", "x": "generates는 동사 generate(생산하다, 발생시키다)에 -s가 붙은 형태이다. 주어 The coffee-making process가 3인칭 단수라서 현재형에 -s를 쓴다. 커피를 만드는 과정이 used coffee grounds(사용된 커피 찌꺼기)를 ‘발생시킨다’는 뜻이다. 비슷한 뜻의 단어로 produce가 있다.", "n": ["generate = 생산하다, 발생시키다 (유의어 produce)", "주어가 3인칭 단수 → generates"], "q": "generates는 어떤 동사의 어떤 형태이고, 뜻은 무엇인가?", "a": "동사 generate(생산하다, 발생시키다)의 3인칭 단수 현재형", "p": "generates"}, {"t": "which : 계속적 용법의 관계대명사", "c": "k", "x": "쉼표 뒤의 which are normally sent to landfills는 coffee grounds를 보충 설명한다. which는 ‘그런데 그것들은(=and they)’처럼 앞에서부터 이어서 해석한다. 선행사 grounds가 복수라서 동사도 are이고, are sent는 ‘보내진다’라는 수동태이다. grounds는 ‘찌꺼기’라는 뜻으로 보통 복수형으로 쓴다.", "n": [", which = and + 대명사 (계속적 용법, 앞에서부터 해석)", "선행사가 복수 grounds → which are sent"], "q": "쉼표 뒤 which are normally sent to landfills에서 which의 선행사는 무엇인가?", "a": "used coffee grounds (커피 찌꺼기)", "p": "which are normally sent to landfills"}, {"t": "they = used coffee grounds (커피 찌꺼기)", "c": "o", "x": "There, they can create a harmful greenhouse gas에서 they는 바로 앞 문장의 used coffee grounds(사용된 커피 찌꺼기)를 가리킨다. There는 ‘거기에서’라는 뜻으로 앞 문장의 landfills(매립지)를 가리킨다. 즉 매립지로 보내진 커피 찌꺼기가 해로운 온실가스를 만들 수 있다는 뜻이다.", "n": ["they = used coffee grounds", "There = at landfills (매립지에서)"], "q": "There, they can create ...의 they는 무엇을 가리키는가?", "a": "사용된 커피 찌꺼기 (used coffee grounds)", "p": "they"}, {"t": "stop + 목적어 + from + -ing : ~가 …하는 것을 막다", "c": "k", "x": "stop everyone in the world from drinking coffee는 ‘세계의 모든 사람들이 커피를 마시는 것을 막다’라는 뜻이다. stop 뒤에 막을 대상(everyone)이 오고, from 뒤에는 동명사(drinking)를 쓴다. no way to stop ...에서 to stop은 way를 꾸미는 형용사적 용법의 to부정사라서 ‘막을 방법’으로 해석한다.", "n": ["stop + O + from + -ing = O가 ~하는 것을 막다", "no way to + 동사원형 = ~할 방법이 없다"], "q": "stop everyone in the world from drinking coffee에서 from 뒤에는 어떤 모양이 오는가?", "a": "동명사 (drinking)", "p": "stop everyone in the world from drinking"}, {"t": "turn A into B / by + -ing : A를 B로 바꿈으로써", "c": "b", "x": "by turning used coffee grounds into biofuel에서 by는 전치사라서 뒤에 동명사 turning이 왔다. turn A into B는 ‘A를 B로 바꾸다’라는 뜻이다. 여기서 A는 used coffee grounds, B는 biofuel이다. used는 ‘사용된’이라는 뜻의 분사형 형용사로 coffee grounds를 꾸민다.", "n": ["by + -ing = ~함으로써 (전치사 + 동명사)", "turn A into B = A를 B로 바꾸다"], "q": "turn used coffee grounds into biofuel에서 A와 B는 각각 무엇인가?", "a": "A = used coffee grounds, B = biofuel", "p": "by turning used coffee grounds into biofuel"}, {"t": "that is made from ~ : 주격 관계대명사 that + 수동태", "c": "b", "x": "that is made from plant or animal sources는 앞의 a natural fuel을 꾸미는 관계대명사절이다. that이 관계절의 주어 역할을 하는 주격 관계대명사라서, 바로 뒤에 동사 is made가 온다. be made from은 ‘~로 만들어지다’라는 수동태이고, plant or animal sources는 or로 두 말을 이어서 ‘식물이나 동물성 원료’라고 해석한다.", "n": ["명사 + 주격 관계대명사 that + 동사 = ~하는 (명사)", "be made from ~ = ~로 만들어지다"], "q": "that is made from plant or animal sources는 무엇을 꾸미며, that의 역할은 무엇인가?", "a": "a natural fuel을 꾸미고, 관계절의 주어 역할을 하는 주격 관계대명사이다.", "p": "that is made from plant or animal sources"}, {"t": "have found that + 절 : 현재완료 + 접속사 that", "c": "b", "x": "Researchers have found that ...의 have found는 have + p.p. 형태의 현재완료이다. found는 find(알아내다)의 과거분사형이다. that은 접속사로, 뒤의 절 they can grow algae ...가 ‘알아낸 내용’이 된다. 뒤의 without adding any other nutrients는 ‘어떤 다른 영양분도 더하지 않고’라는 뜻으로, without 뒤에 동명사 adding이 왔다.", "n": ["have + p.p. = 현재완료 (find - found - found)", "without + -ing = ~하지 않고"], "q": "have found의 found는 어떤 동사의 어떤 형태인가?", "a": "동사 find(알아내다)의 과거분사형", "p": "have found that"}, {"t": "expose A to B : A를 B에 노출시키다", "c": "g", "x": "are exposed to는 expose A to B(A를 B에 노출시키다)의 수동태로, ‘~에 노출되다’라는 뜻이다. 주어 these algae(이 조류)가 노출되는 쪽이라서 be동사 + p.p.를 쓴다. If 조건절에서는 미래의 일도 현재시제로 쓰는데, 여기서는 매일 반복되는 일반적인 사실이라서 현재시제 are exposed를 썼다. darkness는 dark(어두운)에 -ness가 붙어 명사가 된 말이다.", "n": ["expose A to B = A를 B에 노출시키다", "be exposed to ~ = ~에 노출되다"], "q": "If these algae are exposed to ...는 어떤 뜻인가?", "a": "이 조류가 ~에 노출되면", "p": "are exposed to"}, {"t": "renewable and sustainable : 재생 가능한 그리고 지속 가능한", "c": "g", "x": "renewable은 ‘재생 가능한’, sustainable은 ‘지속 가능한’이라는 뜻이다. 둘 다 ‘~할 수 있는’을 뜻하는 -able로 끝나는 형용사이다. and로 이어져 is의 보어 역할을 하며, 바이오 연료가 계속 다시 만들어 쓸 수 있고 유지될 수 있다는 의미이다.", "n": ["renewable = 재생 가능한", "sustainable = 지속 가능한"], "q": "renewable and sustainable은 각각 무슨 뜻인가?", "a": "재생 가능한 / 지속 가능한", "p": "renewable and sustainable"}, {"t": "목적격 관계대명사의 생략 : solutions (that) we can find", "c": "k", "x": "solutions we can find in nature와 problems we currently face에는 명사 뒤에 ‘주어 + 동사’가 바로 이어진다. 원래는 solutions (that) we can find, problems (that) we currently face처럼 목적격 관계대명사 that이 있었는데 생략된 것이다. find와 face 뒤에 목적어가 없는 것이 단서이다. 앞의 명사를 꾸며서 ‘우리가 찾을 수 있는 해결책’, ‘우리가 현재 직면한 문제’라고 해석한다.", "n": ["명사 + (that/which) + 주어 + 동사 : 목적격 관계대명사 생략", "목적어가 빠진 불완전한 절 → 앞 명사를 꾸밈"], "q": "solutions we can find in nature에서 생략된 말은 무엇이며, 어떻게 알 수 있는가?", "a": "목적격 관계대명사 that(which). find 뒤에 목적어가 없기 때문이다.", "p": "we can find in nature"}, {"t": "It seems that + 완전한 절 : ~인 것처럼 보인다", "c": "k", "x": "It seems that Mother Nature has given us one more chance는 ‘대자연이 우리에게 또 한 번의 기회를 준 것처럼 보인다’라는 뜻이다. seem 뒤의 that절은 주어와 동사, 목적어를 모두 갖춘 완전한 절이다. 절 안의 has given은 현재완료이고, give us one more chance는 ‘우리에게(간접목적어) 기회를(직접목적어) 주다’라는 4형식이다.", "n": ["It seems + (that +) 완전한 절 = ~인 것처럼 보인다", "Mother Nature = 대자연"], "q": "It seems that 뒤에는 어떤 모양이 오는가?", "a": "주어와 동사를 갖춘 완전한 절", "p": "It seems that"}, {"t": "in return : 보답으로", "c": "g", "x": "In return은 ‘보답으로, 답례로’라는 뜻이다. 앞 문장에서 대자연이 우리에게 또 한 번의 기회를 주었으니, ‘그 보답으로’ 우리가 환경을 지킬 방법을 더 찾아야 한다는 흐름이다. 쉼표로 문장 앞에서 부사처럼 쓰였다. ‘대신에’라는 뜻으로도 쓴다.", "n": ["in return = 보답으로, 답례로 (또는 대신에)"], "q": "In return, we need to ...에서 in return의 뜻은?", "a": "보답으로 (대자연이 기회를 준 것에 대한 보답)", "p": "In return"}, {"t": "keep + 목적어 + 형용사 : ~를 …하게 유지하다", "c": "b", "x": "to keep the environment healthy and clean은 ‘환경을 건강하고 깨끗하게 지키다’라는 뜻이다. keep 뒤에 목적어(the environment)와 목적격 보어인 형용사 healthy and clean이 and로 이어져 있다. 앞의 ways를 꾸미는 형용사적 용법의 to부정사라서 ‘지킬 방법’이라고 해석한다.", "n": ["keep + O + 형용사 = O를 ~한 상태로 유지하다", "ways to + 동사원형 = ~할 방법"], "q": "keep the environment healthy and clean에서 healthy and clean의 역할은?", "a": "목적어 the environment를 설명하는 목적격 보어(형용사)", "p": "to keep the environment healthy and clean"}, {"t": "대동사 do : If we do", "c": "b", "x": "If we do에서 do는 앞 문장에서 한 말을 대신하는 대동사이다. 여기서 do는 look for more ways to keep the environment healthy and clean을 가리킨다. 같은 일반동사구를 다시 쓰지 않으려고 do로 바꾼 것이다. 즉 ‘우리가 환경을 지킬 방법을 더 찾는다면’이라는 뜻이다.", "n": ["do = 앞에 나온 일반동사(구)의 반복을 피하는 대동사", "If we do = If we look for more ways ..."], "q": "If we do에서 do는 무엇을 대신하는가?", "a": "look for more ways to keep the environment healthy and clean", "p": "do"}]}], "label": "교과서 4과"}

var CAT={g:'어휘',b:'문법',k:'핵심문법',o:'대명사'};
var S={sec:1,drill:null};try{var _m=/[?&]s=(\d+)/.exec(location.search);if(_m&&D.secs.some(function(x){return x.no==+_m[1]}))S.sec=+_m[1]}catch(e){}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sec(){return D.secs.filter(function(s){return s.no==S.sec})[0]}
function refOf(t){var r=t.split(' = ')[1]||'',q=r.match(/\(([^)]*)\)\s*$/);return q?q[1]:r}
function marks(mk,s,mode,only,sn){
  /* mode: 'all' 모든 칠하기(누르면 해설로) / 'color' 한 색만 / 'item' 한 항목만 */
  var out='',pos=0,re=/\[(\d+)\|([^\]]*)\]/g,m;
  while((m=re.exec(mk))){
    out+=esc(mk.slice(pos,m.index));
    var i=+m[1],c=s.items[i-1].c,t=esc(m[2]);
    if(mode=='all')out+='<span class="hlk c-'+c+'" data-i="'+i+'" data-sn="'+sn+'">'+t+'</span>'+(c=='o'?'<sup class="rf c-o">(='+esc(refOf(s.items[i-1].t))+')</sup>':'');
    else if(mode=='color'&&c==only)out+='<span class="hl c-'+c+'">'+t+'</span>';
    else if(mode=='item'&&i==only)out+='<span class="hl c-'+c+'">'+t+'</span>';
    else out+=t;
    pos=re.lastIndex}
  return out+esc(mk.slice(pos))}
function noteBox(n){return '<div class="note"><div class="nl">노트 정리</div>'+n.map(function(l){return '<div class="ln">'+esc(l)+'</div>'}).join('')+'</div>'}
function drillBar(cur){return '<div class="drb">'+['g','b','k','o'].map(function(k){return '<button type="button" class="c-'+k+(cur==k?' on':'')+'" data-dr="'+k+'">'+CAT[k]+'</button>'}).join('')+'</div>'}
function firstSent(s,i){for(var k=0;k<s.sents.length;k++){if(new RegExp('\\['+i+'\\|').test(s.sents[k].mk))return s.sents[k]}return s.sents[0]}
function vDrill(){
  var k=S.drill,h='<button type="button" class="back" data-dr="">‹ 문법 분석으로</button><h2>'+CAT[k]+' 모아보기</h2>'+drillBar(k);
  D.secs.forEach(function(s){
    var cards=s.sents.filter(function(x){var re=/\[(\d+)\|/g,m;while((m=re.exec(x.mk)))if(s.items[m[1]-1].c==k)return true;return false});
    if(!cards.length)return;
    h+='<div class="lab" style="margin-top:12px">본문 '+s.no+'</div>';
    cards.forEach(function(x){
      var seen={},rows='',re=/\[(\d+)\|/g,m;
      while((m=re.exec(x.mk))){var ix=+m[1];if(s.items[ix-1].c==k&&!seen[ix]){seen[ix]=1;var it=s.items[ix-1];
        rows+='<div class="rv c-'+k+'"><div class="q"><span class="hl" style="font-weight:700">'+esc(it.p)+'</span><div style="margin-top:3px">'+esc(it.q)+'</div></div><div class="a"><div class="at">'+esc(it.a)+'</div>'+noteBox(it.n)+'<div class="ex">'+esc(it.x)+'</div></div></div>'}}
      h+='<div class="card"><div class="no">'+x.n+'</div><div style="font-size:16px;line-height:1.8">'+marks(x.mk,s,'color',k)+'</div><div class="sub" style="margin:3px 0 4px">'+esc(x.ko)+'</div>'+rows+'</div>'});
  });
  return h}
function vMain(){
  var s=sec(),a=s.sents[0].n,b=s.sents[s.sents.length-1].n;
  var h='<div class="psel">'+D.secs.map(function(x){return '<button type="button" data-s="'+x.no+'" class="'+(S.sec==x.no?'on':'')+'">본문 '+x.no+'</button>'}).join('')+'</div>';
  h+='<h2>본문 '+s.no+'</h2><div class="sub" style="margin-bottom:8px">'+a+'~'+b+'번</div>';
  h+='<div class="lab">형광펜 이름별로 모아보기</div>'+drillBar('');
  h+='<div class="card">'+s.sents.map(function(x){return '<div class="ps" id="ps-'+x.n+'"><i>'+x.n+'</i><span>'+marks(x.mk,s,'all',null,x.n)+'</span></div>'}).join('')+'</div>';
  h+=s.items.map(function(it,i){var q=firstSent(s,i+1);
    return '<div class="it c-'+it.c+'" id="it-'+(i+1)+'"><h4><span class="tl">'+esc(it.t)+'</span><span class="tag">'+CAT[it.c]+'</span></h4>'+
    '<div class="quote">'+q.n+'. '+marks(q.mk,s,'item',i+1)+'<div class="qk">'+esc(q.ko)+'</div></div>'+
    noteBox(it.n)+'<p>'+esc(it.x)+'</p><button type="button" class="bkb" data-back="'+(i+1)+'">↑ 본문으로 돌아가기</button></div>'}).join('');
  return h}
function render(){
  var top='<div class="top"><a href="../../index.html" id="bk">‹ 원문</a><h1>교과서 4과 문법 분석</h1></div>';
  document.getElementById('app').innerHTML=top+(S.drill?vDrill():vMain());
  window.scrollTo(0,0)}
function goTo(el){if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
var BK={n:null,i:null,sn:null};
document.addEventListener('click',function(e){
  var hk=e.target.closest('.hlk');if(hk){BK.n=S.sec;BK.sn=hk.dataset.sn;BK.i=hk.dataset.i;goTo(document.getElementById('it-'+hk.dataset.i));return}
  var bb=e.target.closest('.bkb');if(bb){var i=bb.dataset.back,s=sec(),tgt=(BK.i==i&&BK.n==s.no&&BK.sn)?BK.sn:firstSent(s,i).n;goTo(document.getElementById('ps-'+tgt));return}
  var rv=e.target.closest('.rv');if(rv){rv.classList.toggle('open');return}
  var bk=e.target.closest('#bk');if(bk){try{if(history.length>1&&document.referrer&&document.referrer.indexOf(location.host)>=0){e.preventDefault();history.back()}}catch(x){}return}
  var d=e.target.closest('[data-dr]');if(d){S.drill=d.dataset.dr||null;render();return}
  var p=e.target.closest('[data-s]');if(p){S.sec=+p.dataset.s;render();return}
});
render();
</script></body></html>
