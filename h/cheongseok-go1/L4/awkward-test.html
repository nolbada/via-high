<script>
var Q=[{"id": "ctx1", "kind": "ctx", "n": 1, "title": null, "tko": null, "paras": [[{"t": "Our environment is in "}, {"t": "trouble", "c": 1}, {"t": ". With the planet becoming "}, {"t": "colder", "c": 2}, {"t": ", sea levels are rising and natural disasters such as forest fires and floods are "}, {"t": "increasing", "c": 3}, {"t": ". More and more waste is also being "}, {"t": "consumed", "c": 4}, {"t": ". Plastic, in particular, is causing problems with soil and water pollution. It is clear that humans are a major contributor to the destruction of nature. Will we be able to "}, {"t": "protect", "c": 5}, {"t": " the environment from mountains of plastic? Can we stop climate change from reaching dangerous levels? Achieving these goals seems "}, {"t": "easy", "c": 6}, {"t": ". Nature, however, may have provided us with solutions to these problems. Here are three areas where changes are already happening."}]], "items": [{"c": 2, "w": "colder", "r": "warmer", "gw": "더 차가워지는", "gr": "더 따뜻해지는", "fb": null, "fg": "With the planet becoming <span class=\"d\">warmer</span>, sea levels are rising and natural disasters such as forest fires and floods are increasing.", "ko": "지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다.", "why": "뒤에 sea levels are rising (해수면이 상승하고 있다)이 이어져요. 해수면이 오르는 건 얼음이 녹기 때문이니, 지구가 warmer (더 따뜻해지는) 되고 있다고 해야 앞뒤가 이어져요. colder (더 차가워지는)이면 얼음이 얼어서 해수면이 내려가야 하니 뒤 내용과 정반대가 돼요."}, {"c": 4, "w": "consumed", "r": "produced", "gw": "소비되는", "gr": "생산되는", "fb": null, "fg": "More and more waste is also being <span class=\"d\">produced</span>.", "ko": "또한 점점 더 많은 쓰레기가 생산되고 있다.", "why": "이 문장은 쓰레기가 '점점 늘어난다'는 문제를 말해요. waste (쓰레기)는 만들어지는 것이라 being produced (생산되고 있다)가 자연스러워요. consumed (소비되는)는 '다 써서 없어진다'는 느낌이라 쓰레기가 늘어난다는 문제와 맞지 않아요. 바로 뒤에서 plastic (플라스틱)이 문제를 일으킨다고 이어지는 것도 '쓰레기가 많이 생긴다'는 흐름이에요."}, {"c": 6, "w": "easy", "r": "difficult", "gw": "쉬운", "gr": "어려운", "fb": null, "fg": "Achieving these goals seems <span class=\"d\">difficult</span>.", "ko": "이러한 목표들을 이루는 것은 어려워 보인다.", "why": "앞에서 '플라스틱 산에서 환경을 지킬 수 있을까? 기후 변화를 막을 수 있을까?'라고 걱정스럽게 물었어요. 그다음 Nature, however (그러나 자연은)로 방향이 바뀌며 '자연이 해결책을 줬을지도 모른다'고 해요. 이 반전이 자연스러우려면 앞 문장은 difficult (어려운)여야 해요. easy (쉬운)이면 걱정할 일이 없어서 however (그러나)가 어색해요."}], "keep": "trouble (어려움, 곤경)은 첫 문장 'Our environment is in trouble (우리의 환경은 어려움에 처해 있다)'이라 글의 주제와 딱 맞아요. increasing (증가하는)은 산불과 홍수 같은 재해가 '늘고 있다'는 뜻이라 맞아요. protect (보호하다)는 'protect the environment from mountains of plastic (산더미 같은 플라스틱으로부터 환경을 보호하다)'로 자연스러워요.", "flow": "환경 문제를 걱정하며 시작하는 글이에요. 지구가 변하면서 해수면이 오르고 재해가 늘고, 쓰레기도 늘어난다는 '나쁜 소식'이 쭉 이어지다가, 마지막에 '그런데 자연이 해결책을 줬을지도 모른다'로 방향이 바뀌어요. 그래서 나쁜 상황을 말하는 곳에는 부정적인 말이, 목표가 어렵다는 곳에는 '어려워 보인다'가 와야 해요.", "ko": "우리의 환경은 어려움에 처해 있다. 지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다. 또한 점점 더 많은 쓰레기가 생산되고 있다. 특히 플라스틱은 토양과 수질 오염에 관련한 문제를 야기하고 있다. 인간이 자연 파괴의 주요 원인 제공자라는 것은 분명하다. 산더미 같은 플라스틱으로부터 우리가 환경을 보호할 수 있게 될까? 기후 변화가 위험 수준에 도달하지 못하게 우리가 할 수 있을까? 이러한 목표들을 이루는 것은 어려워 보인다. 그러나 자연은 우리에게 이런 문제들에 대한 해결책을 제공했을지도 모른다. 여기 이미 변화가 일어나고 있는 세 영역이 있다."}, {"id": "ctx2", "kind": "ctx", "n": 2, "title": "Dealing with Plastic Waste", "tko": "플라스틱 쓰레기 처리하기", "paras": [[{"t": "About fifty percent of plastic is produced for single-use products. That means the items are used just once and then "}, {"t": "retained", "c": 1}, {"t": ". Do you ever stop to think about where these plastic items go after you throw them away? Recycling can help "}, {"t": "raise", "c": 2}, {"t": " the amount of plastic in our landfills. However, less than ten percent of the world’s plastic waste has been recycled so far. Often, plastic waste is moved to places where it is just dumped or burned. Furthermore, between 8 and 14 million metric tons of plastic end up in the ocean every year. This puts many marine species in "}, {"t": "danger", "c": 3}, {"t": ". With this in mind, scientists are turning to mealworms. Mealworms are the larvae of a certain species of beetle. Special bacteria live inside them. These bacteria can break down plastic. This means that mealworms can actually feed on plastic. Scientists are now looking for ways to "}, {"t": "destroy", "c": 4}, {"t": " the bacteria outside of mealworms. They also want to speed up the process by which the bacteria break down plastic. This may help us keep our landfills "}, {"t": "plastic-free", "c": 5}, {"t": "."}]], "items": [{"c": 1, "w": "retained", "r": "discarded", "gw": "보관되는", "gr": "버려지는", "fb": null, "fg": "That means the items are used just once and then <span class=\"d\">discarded</span>.", "ko": "그것은 제품들이 딱 한 번 사용된 후 버려진다는 것을 의미한다.", "why": "single-use products (일회용 제품)는 한 번 쓰고 끝나는 물건이에요. 그래서 'used just once and then discarded (딱 한 번 사용된 후 버려진다)'가 되어야 해요. 바로 다음 문장이 'after you throw them away (버린 후에)'로 이어지는 것도 단서예요. retained (보관되는)이면 일회용이라는 뜻과 반대가 돼요."}, {"c": 2, "w": "raise", "r": "reduce", "gw": "늘리다", "gr": "줄이다", "fb": null, "fg": "Recycling can help <span class=\"d\">reduce</span> the amount of plastic in our landfills.", "ko": "재활용하는 것은 우리의 매립지의(매립지로 가는) 플라스틱의 양을 줄이는 것을 도울 수 있다.", "why": "재활용(recycling)은 쓰레기를 줄이려고 하는 거예요. 그래서 landfills (매립지)에 가는 플라스틱의 양을 reduce (줄이다)하는 걸 돕는다고 해야 해요. raise (늘리다)이면 재활용이 쓰레기를 더 늘린다는 뜻이 되어 상식과 맞지 않아요. 바로 뒤 However (그러나)로 '재활용된 건 10%도 안 된다'는 아쉬운 내용이 오는 것도 이 흐름을 받쳐 줘요."}, {"c": 4, "w": "destroy", "r": "cultivate", "gw": "파괴하다", "gr": "배양하다(키우다)", "fb": null, "fg": "Scientists are now looking for ways to <span class=\"d\">cultivate</span> the bacteria outside of mealworms.", "ko": "과학자들은 이제 밀웜의 체외에서 박테리아를 배양하는 방법을 찾고 있다.", "why": "박테리아는 밀웜 안에서 플라스틱을 분해하는 '좋은 일꾼'이에요. 과학자들은 이 박테리아를 밀웜 밖에서도 쓰고 싶으니 cultivate (배양하다, 키우다)가 맞아요. destroy (파괴하다)이면 소중한 박테리아를 없애자는 말이라서, 바로 뒤의 '분해 속도를 올리고 싶다'는 문장과도 안 이어져요."}], "keep": "danger (위험)는 'puts many marine species in danger (많은 해양 종들을 위험에 빠뜨린다)'라서 바다에 플라스틱이 쌓이는 문제와 맞아요. plastic-free (플라스틱이 없는)는 매립지를 '플라스틱 없는 상태로 유지한다'는 좋은 결과라서 연구의 목표와 잘 이어져요.", "flow": "플라스틱 쓰레기 문제를 설명하고 밀웜(mealworms)이라는 벌레가 해결책이 될 수 있다는 글이에요. 앞부분은 '쓰레기가 얼마나 문제인지', 뒷부분은 '밀웜의 박테리아로 플라스틱을 없애려는 연구'예요. 문제를 줄이려는 방향인지, 늘리려는 방향인지를 따라가면 어색한 말이 보여요.", "ko": "플라스틱의 약 50%는 일회용 제품을 위해 생산된다. 그것은 제품들이 딱 한 번 사용된 후 버려진다는 것을 의미한다. 여러분이 플라스틱을 버린 후에 이것들이 어디로 가는지 생각하기 위해 멈춰(곰곰이 생각해) 본 적이 있는가? 재활용하는 것은 우리의 매립지의(매립지로 가는) 플라스틱의 양을 줄이는 것을 도울 수 있다. 그러나, 지금까지 세계 플라스틱 쓰레기의 10% 미만이 재활용되어 왔다. 종종, 플라스틱 쓰레기는 그저 내버려지거나 태워지는 곳으로 보내진다. 게다가, 8백만에서 1천4백만 톤의 플라스틱이 매년 바다에 유입된다. 이것은 많은 해양 종들을 위험에 빠뜨린다. 이것을 염두에 두고, 과학자들은 밀웜에 의지하고(몰두하고) 있다. 밀웜은 특정 종류의 딱정벌레의 유충이다. 특별한 박테리아가 그들 안에 산다. 이 박테리아는 플라스틱을 분해할 수 있다. 이것은 밀웜이 사실상 플라스틱을 먹고 살 수 있다는 것을 의미한다. 과학자들은 이제 밀웜의 체외에서 박테리아를 배양하는 방법을 찾고 있다. 그들은 또한 박테리아가 플라스틱을 분해하는 과정의 속도를 올리기를 원한다. 이것은 우리가 우리의 매립지를 플라스틱 없는 상태를 유지하도록 도울지도 모른다."}, {"id": "ctx3", "kind": "ctx", "n": 3, "title": "Purifying Polluted Soil", "tko": "오염된 토양 정화하기", "paras": [[{"t": "Mining and other industries are causing soil pollution across the globe. Although polluted soil can be dug up and transported to a landfill, this process is "}, {"t": "cheap", "c": 1}, {"t": ". Moreover, it only moves the problem to another area and does not really solve it. "}, {"t": "Unfortunately", "c": 2}, {"t": ", there is an eco-friendly and cost-effective way to restore polluted soil<hp:fwSpace/>—<hp:fwSpace/>planting willow trees. These amazing trees have extensive and well-developed root systems. As a result, they naturally extract a wide range of "}, {"t": "harmless", "c": 3}, {"t": " materials from the soil. They can also grow quickly, even in soil with a high acidity level or a lot of heavy metals in it. Research on the effectiveness of using willow trees for this purpose is in development. Scientists have found that some species of willow trees are able to "}, {"t": "absorb", "c": 4}, {"t": " harmful materials better than others. Therefore, this promising area should be further explored to find out which trees are the most effective. In time, we may be able to "}, {"t": "clean up", "c": 5}, {"t": " our land with willow trees."}]], "items": [{"c": 1, "w": "cheap", "r": "expensive", "gw": "값이 싼", "gr": "비용이 많이 드는", "fb": null, "fg": "Although polluted soil can be dug up and transported to a landfill, this process is <span class=\"d\">expensive</span>.", "ko": "비록 오염된 흙이 파져서 매립지로 옮겨질 수는 있지만, 이 과정은 비용이 많이 든다.", "why": "Although (비록 ~이지만)를 보세요. '흙을 파서 매립지로 옮길 수는 있지만 ~'이니 뒤에 단점이 와야 해요. 다음 문장도 Moreover (게다가)로 '문제를 옮기기만 한다'는 또 다른 단점을 이어요. 그러니 이 문장도 expensive (비용이 많이 드는)여야 맞아요. cheap (값이 싼)이면 장점이라서 Although와 Moreover가 모두 어색해져요."}, {"c": 2, "w": "Unfortunately", "r": "Fortunately", "gw": "불행하게도", "gr": "다행히도", "fb": null, "fg": "<span class=\"d\">Fortunately</span>, there is an eco-friendly and cost-effective way to restore polluted soil — planting willow trees.", "ko": "다행히도, 오염된 흙을 복구하는 친환경적이고 비용 대비 효과적인 방법이 있는데, 바로 버드나무를 심는 것이다.", "why": "앞에서는 기존 방법의 단점만 말했어요. 이 문장에서는 eco-friendly and cost-effective way (친환경적이고 비용 대비 효과적인 방법)라는 좋은 소식을 알려요. 그래서 Fortunately (다행히도)가 맞아요. Unfortunately (불행하게도)는 나쁜 소식 앞에 쓰는 말이라서 좋은 방법이 있다는 내용과 충돌해요."}, {"c": 3, "w": "harmless", "r": "harmful", "gw": "무해한", "gr": "해로운", "fb": null, "fg": "As a result, they naturally extract a wide range of <span class=\"d\">harmful</span> materials from the soil.", "ko": "결과적으로, 그들은 토양으로부터 광범위한 해로운 물질들을 자연적으로 추출한다.", "why": "이 글의 목적은 오염된 흙을 깨끗하게 하는 거예요. 버드나무가 뽑아내는 것은 흙 속의 harmful (해로운) 물질이어야 해요. 뒤의 문장에서도 absorb harmful materials (해로운 물질을 흡수하다)라고 같은 말이 나와요. harmless (무해한)이면 해롭지 않은 걸 뽑아내서 오염이 해결되지 않아요."}], "keep": "absorb (흡수하다)는 버드나무가 해로운 물질을 '빨아들인다'는 뜻으로 알맞아요. clean up (깨끗이 하다)은 마지막 문장 'clean up our land with willow trees (버드나무로 우리 땅을 깨끗하게 하다)'로 글의 결론과 맞아요.", "flow": "오염된 흙을 어떻게 깨끗하게 할지 다루는 글이에요. 흙을 파서 매립지로 옮기는 기존 방법의 단점을 먼저 말하고, 그다음에 버드나무(willow trees)를 심는 더 좋은 방법을 소개해요. '단점 → 다행히 좋은 방법'으로 방향이 바뀌는 글이라, 나쁜 점을 말하는 곳과 좋은 점을 말하는 곳을 나눠 읽으면 돼요.", "ko": "광산업과 다른 산업들이 전 세계적으로 토양 오염을 일으키고 있다. 비록 오염된 흙이 파져서 매립지로 옮겨질 수는 있지만, 이 과정은 비용이 많이 든다. 게다가, 이것은 단지 문제를 다른 곳으로 옮기는 것이며 그것(문제)을 실제로 해결하지 않는다. 다행히도, 오염된 흙을 복구하는 친환경적이고 비용 대비 효과적인 방법이 있는데, 바로 버드나무를 심는 것이다. 이 놀라운 나무들은 광범위하고 잘 발달된 뿌리 체계를 가지고 있다. 결과적으로, 그들은 토양으로부터 광범위한 해로운 물질들을 자연적으로 추출한다. 그들은 심지어 산도가 높거나 안에 중금속을 많이 품은 토양에서도 빠르게 자랄 수 있다. 이러한 목적으로 버드나무를 활용하는 것의 효율성에 대한 연구가 진행되고 있다. 과학자들은 몇몇 종류의 버드나무가 다른 것(종류)들에 비해 해로운 물질을 더 잘 흡수할 수 있다는 것을 알아냈다. 그러므로, 어떤 (종류의) 나무들이 가장 효과적인지를 찾아내기 위해 이 촉망받는 분야는 더 깊게 탐구되어야 한다. 조만간, 우리는 버드나무로 우리의 땅을 깨끗하게 할 수 있을지도 모른다."}, {"id": "ctx4", "kind": "ctx", "n": 4, "title": "Producing Algae Biofuel", "tko": "조류 바이오 연료 생산하기", "paras": [[{"t": "Statistics show that about thirty to forty percent of people in the world drink coffee each day. The coffee-making process, however, generates used coffee grounds, which are normally sent to landfills. There, they can create a "}, {"t": "beneficial", "c": 1}, {"t": " greenhouse gas. "}, {"t": "Unfortunately", "c": 2}, {"t": ", there’s no way to stop everyone in the world from drinking coffee. However, we can "}, {"t": "boost", "c": 3}, {"t": " greenhouse gas emissions by turning used coffee grounds into biofuel. Biofuel is a natural fuel that is made from plant or animal sources. Researchers have found that they can grow algae on old coffee grounds without adding any other nutrients. If these algae are exposed to twenty hours of light and four hours of darkness each day, they eventually "}, {"t": "produce", "c": 4}, {"t": " high-quality biofuel. The biofuel is renewable and sustainable, and it creates only a small amount of emissions."}], [{"t": "These are just a few solutions we can find in nature. There could be many more possible solutions to the problems we currently face. It seems that Mother Nature has given us one more chance. In return, we need to look for more ways to keep the environment healthy and clean. If we do, the future of our planet may be "}, {"t": "dark", "c": 5}, {"t": " after all."}]], "items": [{"c": 1, "w": "beneficial", "r": "harmful", "gw": "이로운", "gr": "해로운", "fb": null, "fg": "There, they can create a <span class=\"d\">harmful</span> greenhouse gas.", "ko": "거기에서, 그것들은 해로운 온실가스를 만들 수 있다.", "why": "커피 찌꺼기를 매립지로 보내면 거기서 greenhouse gas (온실가스)가 생겨요. 온실가스는 지구를 덥게 하는 나쁜 것이라 harmful (해로운)이 맞아요. beneficial (이로운)이면 나쁜 것을 좋다고 하는 말이 되고, 바로 뒤 Unfortunately (불행하게도)로 이어지는 걱정스러운 흐름과도 맞지 않아요."}, {"c": 3, "w": "boost", "r": "reduce", "gw": "늘리다", "gr": "줄이다", "fb": null, "fg": "However, we can <span class=\"d\">reduce</span> greenhouse gas emissions by turning used coffee grounds into biofuel.", "ko": "그러나, 우리는 사용된 커피 찌꺼기를 바이오 연료로 바꿈으로써 온실가스 배출을 줄일 수는 있다.", "why": "However (그러나)로 시작하니 앞의 나쁜 소식 '커피 마시는 걸 막을 방법은 없다'와 반대되는 희망적인 말이 와야 해요. 커피 찌꺼기를 바이오 연료로 바꿔서 온실가스 배출을 reduce (줄이다)한다면 앞뒤가 이어져요. boost (늘리다)이면 온실가스를 더 늘리자는 말이라서 해결책이 되지 않아요."}, {"c": 5, "w": "dark", "r": "bright", "gw": "어두운", "gr": "밝은", "fb": null, "fg": "If we do, the future of our planet may be <span class=\"d\">bright</span> after all.", "ko": "우리가 그렇게 한다면, 우리 지구의 미래는 결국 밝을지도 모른다.", "why": "마지막 문장은 'If we do (우리가 그렇게 한다면)', 즉 환경을 지키는 방법을 더 찾는다면의 결과예요. 노력의 결과는 bright (밝은) 미래여야 맞아요. after all (결국)도 '걱정했지만 결국 좋아질 수 있다'는 뜻이에요. dark (어두운)이면 노력해도 소용없다는 뜻이 되어 앞 문장 'Mother Nature has given us one more chance (대자연이 우리에게 또 한 번의 기회를 줬다)'와 어긋나요."}], "keep": "Unfortunately (불행하게도)는 '세계의 모든 사람이 커피를 마시는 것을 멈추게 할 방법은 없다'는 아쉬운 내용이라 알맞아요. produce (생산하다)는 조류가 마침내 high-quality biofuel (양질의 바이오 연료)을 만들어 낸다는 뜻이라 자연스러워요.", "flow": "커피 찌꺼기로 바이오 연료를 만드는 글이에요. 커피 찌꺼기가 매립지에서 온실가스를 만드는 '문제'를 말한 뒤, 이것을 바이오 연료로 바꿔서 배출을 '줄이는' 해결책으로 이어져요. 마지막 문장은 '이렇게 노력하면 지구의 미래가 어떻게 될까'를 말해요. 문제를 말하는 곳과 해결을 말하는 곳, 결론을 말하는 곳을 구분하세요.", "ko": "우리의 환경은 어려움에 처해 있다. 그러나 자연은 우리에게 이런 문제들에 대한 해결책을 제공했을지도 모른다. 통계 자료는 세계의 약 30~40%의 사람들이 매일 커피를 마신다는 것을 보여 준다. 그러나, 커피 만드는 과정은 커피 찌꺼기를 발생시키는데, 이것들은 보통 매립지로 보내진다. 거기에서, 그것들은 해로운 온실가스를 만들 수 있다. 불행하게도, 세계의 모든 사람들이 커피를 마시는 것을 멈추게 할 방법은 없다. 그러나, 우리는 사용된 커피 찌꺼기를 바이오 연료로 바꿈으로써 온실가스 배출을 줄일 수는 있다. 바이오 연료는 식물이나 동물성 원료로 만들어진 천연 연료이다. 연구자들은 그들이 오래된 커피 찌꺼기에서 어떤 다른 영양분도 더하지 않고 조류를 자라게 할 수 있다는 것을 알아냈다. 만약 이 조류가 20시간의 빛과 4시간의 어둠에 매일 노출되면, 그들은 마침내 양질의 바이오 연료를 생산한다. 이 바이오 연료는 재생 가능하고 지속 가능하며, 적은 양의 배출물만 나온다. 이것들은 우리가 자연에서 찾을 수 있는 소수의 해결책들에 불과하다. 우리가 현재 직면한 문제들에 대해 가능성 있는 훨씬 더 많은 해결책들이 있을 수 있다. 대자연은 우리에게 또 한 번의 기회를 준 것처럼 보인다. 보답으로, 우리는 환경을 건강하고 깨끗하게 지킬 더 많은 방법을 찾을 필요가 있다. 우리가 그렇게 한다면, 우리 지구의 미래는 결국 밝을지도 모른다."}, {"id": "gram1", "kind": "gram", "n": 1, "title": null, "tko": null, "paras": [[{"t": "Our environment is in trouble. With the planet becoming warmer, "}, {"t": "sea levels are rising and natural disasters such as forest fires and floods is increasing", "c": 1}, {"t": ". "}, {"t": "More and more waste is also being produced", "c": 2}, {"t": ". Plastic, in particular, is causing problems with soil and water pollution. "}, {"t": "It is clear that humans are a major contributor to the destruction of nature", "c": 3}, {"t": ". Will we be able to protect the environment from mountains of plastic? Can we stop climate change from reaching dangerous levels? "}, {"t": "Achieving these goals seems difficultly.", "c": 4}, {"t": " Nature, however, may have provided us with solutions to these problems. "}, {"t": "Here are three areas what changes are already happening.", "c": 5}]], "items": [{"c": 1, "w": "is", "r": "are", "gw": "이다 (단수)", "gr": "이다 (복수)", "fb": "sea levels are rising and natural disasters such as forest fires and floods <span class=\"d\">is</span> increasing", "fg": "sea levels are rising and natural disasters such as forest fires and floods <span class=\"d\">are</span> increasing", "ko": "지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다.", "why": "and 뒤의 주어는 natural disasters (자연재해들)예요. 재해가 여러 개라서 복수 동사 are를 써야 해요. such as forest fires and floods (산불과 홍수 같은)는 재해의 예를 든 말일 뿐이고 주어는 아니에요. 바로 앞 sea levels are rising (해수면이 상승하고 있다)과 같은 모양이라고 생각하면 기억하기 쉬워요."}, {"c": 4, "w": "difficultly", "r": "difficult", "gw": "어렵게 (부사)", "gr": "어려운 (형용사)", "fb": "Achieving these goals seems <span class=\"d\">difficultly.</span>", "fg": "Achieving these goals seems <span class=\"d\">difficult.</span>", "ko": "이러한 목표들을 이루는 것은 어려워 보인다.", "why": "seems (~처럼 보인다) 뒤에는 '어떤 상태인지'를 말하는 말이 와야 해요. 이런 말은 difficult (어려운) 같은 형용사예요. difficultly는 '어렵게'라는 뜻의 부사라서 seems 뒤에 쓸 수 없어요. 앞에서 걱정스럽게 던진 두 질문을 받아 '이 목표들은 어려워 보인다'고 정리하는 문장이에요."}, {"c": 5, "w": "what", "r": "where", "gw": "~인 것", "gr": "~하는 곳", "fb": "Here are three areas <span class=\"d\">what</span> changes are already happening.", "fg": "Here are three areas <span class=\"d\">where</span> changes are already happening.", "ko": "여기 이미 변화가 일어나고 있는 세 영역이 있다.", "why": "three areas (세 영역)는 '장소 같은 곳'이에요. 뒤의 changes are already happening (변화가 이미 일어나고 있다)은 주어와 동사가 다 있는 완전한 문장이라, 앞의 장소를 '거기서'로 이어 주는 where (~하는 곳)가 필요해요. what (~하는 것)은 앞에 꾸밀 명사가 없을 때 쓰는 말이라 areas 뒤에는 쓰지 않아요."}], "keep": "'More and more waste is also being produced (점점 더 많은 쓰레기가 생산되고 있다)'는 쓰레기가 '생산되는' 쪽이라 is being produced (생산되고 있다)가 맞아요. 'It is clear that humans are a major contributor to the destruction of nature (인간이 자연 파괴의 주요 원인 제공자라는 것은 분명하다)'는 It is clear that ~ (~라는 것은 분명하다)로 알맞아요.", "flow": "환경 문제를 소개하는 첫 부분이에요. 밑줄 친 다섯 곳 중에서 '주어와 동사의 수가 맞는지', '어려워 보인다에 알맞은 말의 모양', '장소 뒤에서 거기서로 이어 주는 말'을 살펴보세요.", "ko": "우리의 환경은 어려움에 처해 있다. 지구가 더 따뜻해지면서, 해수면이 상승하고 있고 산불과 홍수 같은 자연재해도 증가하고 있다. 또한 점점 더 많은 쓰레기가 생산되고 있다. 특히 플라스틱은 토양과 수질 오염에 관련한 문제를 야기하고 있다. 인간이 자연 파괴의 주요 원인 제공자라는 것은 분명하다. 산더미 같은 플라스틱으로부터 우리가 환경을 보호할 수 있게 될까? 기후 변화가 위험 수준에 도달하지 못하게 우리가 할 수 있을까? 이러한 목표들을 이루는 것은 어려워 보인다. 그러나 자연은 우리에게 이런 문제들에 대한 해결책을 제공했을지도 모른다. 여기 이미 변화가 일어나고 있는 세 영역이 있다."}, {"id": "gram2", "kind": "gram", "n": 2, "title": "Dealing with Plastic Waste", "tko": "플라스틱 쓰레기 처리하기", "paras": [[{"t": "About fifty percent of plastic is produced for single-use products. "}, {"t": "That means the items are used just once and then discard", "c": 1}, {"t": ". "}, {"t": "Do you ever stop to think about where these plastic items go after you throw away them?", "c": 2}, {"t": " Recycling can help reduce the amount of plastic in our landfills. However, less than ten percent of the world’s plastic waste has been recycled so far. Often, "}, {"t": "plastic waste is moved to places which it is just dumped or burned", "c": 3}, {"t": ". Furthermore, between 8 and 14 million metric tons of plastic end up in the ocean every year. This puts many marine species in danger. With this in mind, scientists are turning to mealworms. Mealworms are the larvae of a certain species of beetle. Special bacteria live inside them. These bacteria can break down plastic. This means that mealworms can actually feed on plastic. "}, {"t": "Scientists are now looking for ways to cultivate the bacteria outside of mealworms", "c": 4}, {"t": ". They also want to speed up the process by which the bacteria break down plastic. "}, {"t": "This may help us keep our landfills plastic-free", "c": 5}, {"t": "."}]], "items": [{"c": 1, "w": "discard", "r": "discarded", "gw": "버리다", "gr": "버려진", "fb": "That means the items are used just once and then <span class=\"d\">discard</span>", "fg": "That means the items are used just once and then <span class=\"d\">discarded</span>", "ko": "그것은 제품들이 딱 한 번 사용된 후 버려진다는 것을 의미한다.", "why": "items (제품들)는 사람이 쓰고 버리는 물건이라 '버려지다'는 말이어야 해요. are used (사용된다)와 and then discarded (그다음에 버려진다)가 같은 모양으로 이어지니 discarded (버려진)로 써야 해요. 원래 모양 discard (버리다)는 are 뒤에 쓸 수 없어요. 일회용품은 한 번 쓰이고 그냥 버려진다는 흐름이에요."}, {"c": 2, "w": "away them", "r": "them away", "gw": "버려 버리다 (away them)", "gr": "버리다 (them away)", "fb": "Do you ever stop to think about where these plastic items go after you throw <span class=\"d\">away</span> <span class=\"d\">them?</span>", "fg": "Do you ever stop to think about where these plastic items go after you throw <span class=\"d\">them</span> <span class=\"d\">away?</span>", "ko": "여러분이 플라스틱을 버린 후에 이것들이 어디로 가는지 생각하기 위해 멈춰(곰곰이 생각해) 본 적이 있는가?", "why": "throw away (버리다)는 두 단어가 한 덩어리인 동사예요. 버리는 대상이 them (그것들) 같은 대명사일 때는 두 단어 '사이'에 넣어서 throw them away라고 써요. throw away them처럼 뒤에 붙이면 틀려요. 이 문장은 '플라스틱을 버린 후 어디로 가는지 생각해 본 적 있어?' 하고 독자에게 묻는 문장이에요."}, {"c": 3, "w": "which", "r": "where", "gw": "~인 것", "gr": "~하는 곳", "fb": "plastic waste is moved to places <span class=\"d\">which</span> it is just dumped or burned", "fg": "plastic waste is moved to places <span class=\"d\">where</span> it is just dumped or burned", "ko": "종종, 플라스틱 쓰레기는 그저 내버려지거나 태워지는 곳으로 보내진다.", "why": "places (장소들) 뒤에서 it is just dumped or burned (그것이 그저 내버려지거나 태워진다)가 이어져요. 이 뒤의 문장은 주어 it과 동사가 다 있는 완전한 문장이라 which (그것)가 올 수 없어요. 장소를 '거기서'로 이어 주는 where (~하는 곳)를 써야 해요. 앞의 where 메모와 같은 규칙이에요."}], "keep": "'Scientists are now looking for ways to cultivate the bacteria outside of mealworms (과학자들은 이제 밀웜의 체외에서 박테리아를 배양하는 방법을 찾고 있다)'는 ways to ~ (~하는 방법)로 알맞아요. 'This may help us keep our landfills plastic-free (이것은 우리가 매립지를 플라스틱 없는 상태로 유지하도록 도울지도 모른다)'도 help us keep (우리가 지키도록 돕다)의 모양이 맞아요.", "flow": "플라스틱 쓰레기와 밀웜 이야기예요. 밑줄 친 곳에서 '버려진다는 말의 모양', 'throw away (버리다) 뒤에 대신 쓰는 말의 자리', '장소 뒤에서 거기서로 이어 주는 말'을 살펴보세요.", "ko": "플라스틱의 약 50%는 일회용 제품을 위해 생산된다. 그것은 제품들이 딱 한 번 사용된 후 버려진다는 것을 의미한다. 여러분이 플라스틱을 버린 후에 이것들이 어디로 가는지 생각하기 위해 멈춰(곰곰이 생각해) 본 적이 있는가? 재활용하는 것은 우리의 매립지의(매립지로 가는) 플라스틱의 양을 줄이는 것을 도울 수 있다. 그러나, 지금까지 세계 플라스틱 쓰레기의 10% 미만이 재활용되어 왔다. 종종, 플라스틱 쓰레기는 그저 내버려지거나 태워지는 곳으로 보내진다. 게다가, 8백만에서 1천4백만 톤의 플라스틱이 매년 바다에 유입된다. 이것은 많은 해양 종들을 위험에 빠뜨린다. 이것을 염두에 두고, 과학자들은 밀웜에 의지하고(몰두하고) 있다. 밀웜은 특정 종류의 딱정벌레의 유충이다. 특별한 박테리아가 그들 안에 산다. 이 박테리아는 플라스틱을 분해할 수 있다. 이것은 밀웜이 사실상 플라스틱을 먹고 살 수 있다는 것을 의미한다. 과학자들은 이제 밀웜의 체외에서 박테리아를 배양하는 방법을 찾고 있다. 그들은 또한 박테리아가 플라스틱을 분해하는 과정의 속도를 올리기를 원한다. 이것은 우리가 우리의 매립지를 플라스틱 없는 상태를 유지하도록 도울지도 모른다."}, {"id": "gram3", "kind": "gram", "n": 3, "title": "Purifying Polluted Soil", "tko": "오염된 토양 정화하기", "paras": [[{"t": "Mining and other industries are causing soil pollution across the globe. "}, {"t": "Although polluted soil can be digging up and transported to a landfill", "c": 1}, {"t": ", this process is expensive. Moreover, "}, {"t": "it only moves the problem to another area and do not really solve it", "c": 2}, {"t": ". Fortunately, "}, {"t": "there is an eco-friendly and cost-effective way to restore polluted soil", "c": 3}, {"t": "<hp:fwSpace/>—<hp:fwSpace/>planting willow trees. These amazing trees have extensive and well-developed root systems. As a result, they naturally extract a wide range of harmful materials from the soil. They can also grow quickly, even in soil with a high acidity level or a lot of heavy metals in it. "}, {"t": "Research on the effectiveness of use willow trees for this purpose is in development.", "c": 4}, {"t": " Scientists have found that some species of willow trees are able to absorb harmful materials better than others. Therefore, this promising area should be further explored "}, {"t": "to find out which trees are the most effective", "c": 5}, {"t": ". In time, we may be able to clean up our land with willow trees."}]], "items": [{"c": 1, "w": "digging", "r": "dug", "gw": "파고 있는", "gr": "파내진", "fb": "Although polluted soil can be <span class=\"d\">digging</span> up and transported to a landfill", "fg": "Although polluted soil can be <span class=\"d\">dug</span> up and transported to a landfill", "ko": "비록 오염된 흙이 파져서 매립지로 옮겨질 수는 있지만, 이 과정은 비용이 많이 든다.", "why": "soil (흙)은 사람이 파내는 대상이라 '파내진다'는 말이어야 해요. can be 뒤에는 과거분사가 와서 can be dug up (파내질 수 있다)이 돼요. 뒤의 transported (옮겨진)와 and로 연결되어 둘 다 같은 모양이어야 해요. digging (파는)은 흙이 스스로 판다는 뜻이 되어 틀려요."}, {"c": 2, "w": "do", "r": "does", "gw": "하다 (복수)", "gr": "하다 (단수)", "fb": "it only moves the problem to another area and <span class=\"d\">do</span> not really solve it", "fg": "it only moves the problem to another area and <span class=\"d\">does</span> not really solve it", "ko": "게다가, 이것은 단지 문제를 다른 곳으로 옮기는 것이며 그것(문제)을 실제로 해결하지 않는다.", "why": "and 앞뒤 동사는 같은 주어 it (이 과정)에 이어져요. 앞 동사가 moves (옮긴다)로 -s가 붙은 단수 모양이니, 뒤도 does not solve (해결하지 않는다)로 맞춰야 해요. do not (하지 않는다)은 I, you, they 같은 주어에 쓰는 말이라 it에는 쓸 수 없어요. 앞에서 본 주어와 동사의 수 맞추기와 같은 규칙이에요."}, {"c": 4, "w": "use", "r": "using", "gw": "사용하다", "gr": "사용하는 것", "fb": "Research on the effectiveness of <span class=\"d\">use</span> willow trees for this purpose is in development.", "fg": "Research on the effectiveness of <span class=\"d\">using</span> willow trees for this purpose is in development.", "ko": "이러한 목적으로 버드나무를 활용하는 것의 효율성에 대한 연구가 진행되고 있다.", "why": "of (~의) 같은 전치사 뒤에는 '~하는 것'이라는 뜻의 -ing 모양이나 명사가 와요. 그래서 effectiveness of using willow trees (버드나무를 사용하는 것의 효율성)가 맞아요. use를 그대로 쓰면 of 뒤에 동사가 바로 오는 꼴이라 틀려요. 이 문장은 '버드나무로 흙을 깨끗이 하는 연구가 진행 중'이라는 뜻이에요."}], "keep": "'there is an eco-friendly and cost-effective way to restore polluted soil (오염된 흙을 복구하는 친환경적이고 비용 대비 효과적인 방법이 있다)'은 there is a way (방법이 있다)로 맞아요. 'to find out which trees are the most effective (어떤 나무들이 가장 효과적인지 찾아내기 위해)'도 which trees are ~ (어떤 나무들이 ~인지)의 어순이 알맞아요.", "flow": "오염된 흙을 버드나무로 정화하는 글이에요. 밑줄 친 곳에서 '파내다는 말의 모양', 'and 뒤 동사와 주어의 짝', '전치사 뒤에 오는 동사의 모양'을 차례로 살펴보세요.", "ko": "광산업과 다른 산업들이 전 세계적으로 토양 오염을 일으키고 있다. 비록 오염된 흙이 파져서 매립지로 옮겨질 수는 있지만, 이 과정은 비용이 많이 든다. 게다가, 이것은 단지 문제를 다른 곳으로 옮기는 것이며 그것(문제)을 실제로 해결하지 않는다. 다행히도, 오염된 흙을 복구하는 친환경적이고 비용 대비 효과적인 방법이 있는데, 바로 버드나무를 심는 것이다. 이 놀라운 나무들은 광범위하고 잘 발달된 뿌리 체계를 가지고 있다. 결과적으로, 그들은 토양으로부터 광범위한 해로운 물질들을 자연적으로 추출한다. 그들은 심지어 산도가 높거나 안에 중금속을 많이 품은 토양에서도 빠르게 자랄 수 있다. 이러한 목적으로 버드나무를 활용하는 것의 효율성에 대한 연구가 진행되고 있다. 과학자들은 몇몇 종류의 버드나무가 다른 것(종류)들에 비해 해로운 물질을 더 잘 흡수할 수 있다는 것을 알아냈다. 그러므로, 어떤 (종류의) 나무들이 가장 효과적인지를 찾아내기 위해 이 촉망받는 분야는 더 깊게 탐구되어야 한다. 조만간, 우리는 버드나무로 우리의 땅을 깨끗하게 할 수 있을지도 모른다."}, {"id": "gram4", "kind": "gram", "n": 4, "title": "Producing Algae Biofuel", "tko": "조류 바이오 연료 생산하기", "paras": [[{"t": "Statistics show that about thirty to forty percent of people in the world drink coffee each day. The coffee-making process, however, generates used coffee grounds, "}, {"t": "which is normally sent to landfills", "c": 1}, {"t": ". There, they can create a harmful greenhouse gas. Unfortunately, "}, {"t": "there’s no way to stop everyone in the world from drinking coffee", "c": 2}, {"t": ". However, we can reduce greenhouse gas emissions by turning used coffee grounds into biofuel. "}, {"t": "Biofuel is a natural fuel that makes from plant or animal sources", "c": 3}, {"t": ". Researchers have found that they can grow algae on old coffee grounds without adding any other nutrients. If these algae are exposed to twenty       pe.appendChild(c);
    });
    ps.appendChild(pe)});
  var sub=$('submit'),cnt=$('cnt');
  if(r.done){sub.classList.add('hide');cnt.classList.add('hide');result(q)}
  else{sub.classList.remove('hide');cnt.classList.remove('hide');$('res').classList.add('hide');upd(q)}
}
function upd(q){var r=R(q),n=q.items.length;$('cnt').innerHTML='선택한 곳 <b>'+r.sel.length+'</b> / '+n+(r.sel.length?' · '+r.sel.slice().sort(function(a,b){return a-b}).map(function(c){return CIRC.charAt(c-1)}).join(' '):'');$('submit').disabled=r.sel.length!==n}
function toggle(q,c){
  var r=R(q);if(r.done)return;
  var i=r.sel.indexOf(c);
  if(i>=0)r.sel.splice(i,1);else{if(r.sel.length>=q.items.length)return;r.sel.push(c)}
  save();
  var e=document.querySelector('.cd[data-c="'+c+'"]');if(e)e.classList.toggle('sel',r.sel.indexOf(c)>=0);upd(q);
}
$('submit').onclick=function(){var q=qById(S.cur),r=R(q);if(r.sel.length!==q.items.length)return;r.done=true;if(!isOk(q)){var _k=(q.ko||'').replace(/\s+/g,' ');WN.add({kind:'L4',part:PART,act:'awk',qid:q.id,label:'어색한 곳('+(q.kind==='ctx'?'문맥':'어법')+') · '+_k.slice(0,16)+'…'})}
if(!S.marked&&Q.every(function(x){return R(x).done})){S.marked=1;if(!WN.MODE){try{if(window.PG)PG.mark(PGK)}catch(e){}}}save();draw(q);setTimeout(function(){var x=$('res');if(x.scrollIntoView)x.scrollIntoView({behavior:'smooth',block:'start'})},30)};
function result(q){
  var r=R(q),res=$('res');res.innerHTML='';res.classList.remove('hide');
  var T=truth(q),got=r.sel.filter(function(c){return T.indexOf(c)>=0}).length,ok=isOk(q);
  res.appendChild(el('div','verdict '+(ok?'ok':'ng'),ok?'○ 모두 맞았어요':'× 어색한 곳 '+q.items.length+'개 중 '+got+'개를 찾았어요'));
  q.items.forEach(function(it,ii){
    var d=el('div','it'),h=el('div','ih');
    h.appendChild(el('span','no','('+(ii+1)+')'));
    var hit=r.sel.indexOf(it.c)>=0;
    h.appendChild(el('span','tag '+(hit?'y':'n'),(hit?'찾았어요 ':'놓쳤어요 ')+CIRC.charAt(it.c-1)));
    var ia=el('span','ia');ia.appendChild(el('span','x',it.w));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gw+')'));ia.appendChild(document.createTextNode(' → '));ia.appendChild(el('span','r',it.r));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gr+')'));
    h.appendChild(ia);d.appendChild(h);
    var f=el('div','fix');
    if(it.fb)f.appendChild(html('span','l bad','<small>틀린 문장</small>'+it.fb));
    f.appendChild(html('span','l good','<small>고친 문장</small>'+it.fg));d.appendChild(f);
    d.appendChild(el('div','kot',it.ko));
    d.appendChild(html('div','why',it.why));
    res.appendChild(d)});
  var wrongPick=r.sel.filter(function(c){return T.indexOf(c)<0});
  if(wrongPick.length){res.appendChild(html('div','note','<b>잘못 고른 곳</b> '+wrongPick.map(function(c){return CIRC.charAt(c-1)}).join(' ')+'은(는) 글의 흐름과 문법에 맞는 표현이라 그대로 둬요.'))}
  if(WN.MODE){res.appendChild(html('div','note','이제 안 봐도 되는 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에서 \'빼기\'로 뺄 수 있어요.'))}
  else if(WN.has('L4',PART,'awk',q.id)){res.appendChild(html('div','note','<a href="../wrong.html" style="color:#0f766e;text-decoration:underline">틀린 '+WN.ids('L4',PART,'awk').length+'개가 오답 노트에 담겼어요 ›</a>'))}
  res.appendChild(html('div','note','<b>글의 흐름</b> '+q.flow));
  res.appendChild(html('div','note','<b>그대로 두는 부분</b> '+q.keep));
  var kb=el('div','kobox');kb.textContent=q.ko;
  var row=el('div','row');
  var bk=el('button','btn','한글 해석 보기');bk.onclick=function(){var on=kb.classList.toggle('on');bk.textContent=on?'한글 해석 닫기':'한글 해석 보기'};
  res.appendChild(bk);res.appendChild(kb);
  var idx=Q.indexOf(q),nx=Q[idx+1];
  var again=el('button','big alt','이 문제 다시 풀기');again.onclick=function(){S.res[q.id]={sel:[],done:false};save();draw(q);window.scrollTo(0,0)};
  var next=el('button','big',nx?'다음 문제 · '+nm(nx):'목록으로');next.onclick=function(){if(nx)open(nx.id);else home()};
  row.appendChild(again);row.appendChild(next);res.appendChild(row);
}
$('toHome').onclick=home;
$('resetAll').onclick=function(){if(!confirm('푼 기록을 모두 지우고 처음부터 할까요?'))return;S={res:{},cur:null};save();home()};
if(S.cur&&qById(S.cur))open(S.cur);else home();
</script><script src="../../common/prog.js?v=261019"></script><script>if(!WN.MODE)PG.bar(PGK,"풀었어요")</script></body></html>
