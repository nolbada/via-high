</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "교과서 3과 삽입 다지기", "sub": "공통영어2 3과 · 6문제", "key": "cheongseok-go1:in:L3", "pass": [{"label": "3과 ① 호랑이 책과 호랑이의 땅", "sents": [{"en": "Children around the world learned a bit more about Korean culture when writer Tae Keller published her book When You Trap a Tiger in 2020.", "ko": "2020년 작가 Tae Keller가 책 『When You Trap a Tiger』를 출판했을 때, 전 세계 아이들은 한국 문화에 대해 조금 더 알게 되었다."}, {"en": "Its story starts with a girl who meets a tiger.", "ko": "그 책의 이야기는 호랑이를 만나는 한 소녀로부터 시작된다."}, {"en": "Her grandmother knows the tiger as well.", "ko": "그녀의 할머니 역시 그 호랑이를 알고 있다."}, {"en": "When her grandmother gets sick, the girl makes a deal with the tiger.", "ko": "할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다."}, {"en": "Keller’s inspiration for her award-winning book was an old folktale that her halmoni (grandmother) used to tell her.", "ko": "Keller의 수상작에 영감을 준 것은 할머니가 들려주던 옛 설화였다."}, {"en": "It is called “The Sun and the Moon,” and it is about a brother, a sister, and a tiger.", "ko": "그 설화는 '해님 달님'이라고 불리며, 오빠와 여동생, 그리고 호랑이에 관한 이야기이다."}, {"en": "Keller wanted to revive the public’s interest in tigers by writing her own book.", "ko": "Keller는 자신의 책을 써서 호랑이에 대한 대중의 관심을 되살리고 싶어 했다."}, {"en": "How is the tiger related to Korean culture?", "ko": "호랑이는 한국 문화와 어떻게 관련되어 있을까?"}, {"en": "Long ago, tigers were so abundant in Korea that people often called the country the “Land of Tigers.”", "ko": "오래 전 한국에는 호랑이가 매우 많아서 사람들은 종종 이 나라를 '호랑이의 땅'이라고 불렀다."}, {"en": "It is estimated that tigers lived in Korea for at least 100,000 years.", "ko": "호랑이는 한국에 적어도 10만 년 동안 살았던 것으로 추정된다."}]}, {"label": "3과 ② 문화 속 호랑이와 설화", "sents": [{"en": "The first appearance of a tiger in Korean culture dates back to the rock art of the Bronze Age.", "ko": "한국 문화에서 호랑이가 처음 등장한 것은 청동기 시대의 바위 그림으로 거슬러 올라간다."}, {"en": "It depicts people hunting various animals, including tigers.", "ko": "그 바위 그림은 사람들이 호랑이를 포함한 여러 동물을 사냥하는 모습을 그리고 있다."}, {"en": "Since then, tigers have appeared in many aspects of Korean culture, from legends to art and musical instruments.", "ko": "그때부터 호랑이는 전설에서 미술과 악기에 이르기까지 한국 문화의 여러 분야에 등장해 왔다."}, {"en": "Some of you may have heard Korean folktales featuring tigers.", "ko": "여러분 중 일부는 호랑이가 나오는 한국 설화를 들어 봤을지도 모른다."}, {"en": "In fact, approximately forty percent of Korean folktales about animals include a tiger.", "ko": "실제로 동물에 관한 한국 설화의 약 40%에 호랑이가 나온다."}, {"en": "Tigers in Korean folktales are sometimes shown in a positive light and sometimes as foolish creatures.", "ko": "한국 설화 속 호랑이는 때로는 긍정적으로, 때로는 어리석은 존재로 그려진다."}, {"en": "For example, in one story, a tiger helps a human become rich after the human saves the tiger’s life.", "ko": "예를 들어, 한 이야기에서 호랑이는 자기 목숨을 구해 준 사람이 부자가 되도록 돕는다."}, {"en": "In another story, a tiger hears a mother tell her crying baby, “Don’t cry. Here’s a gotgam.”", "ko": "또 다른 이야기에서 호랑이는 한 엄마가 우는 아기에게 \"울지 마. 여기 곶감 있다.\"라고 말하는 것을 듣는다."}, {"en": "Because the baby stops crying, the tiger mistakenly thinks the gotgam is a very scary creature and runs away.", "ko": "아기가 울음을 그치자, 호랑이는 곶감이 아주 무서운 존재라고 착각하고 달아난다."}]}, {"label": "3과 ③ 엇갈린 감정과 올림픽 마스코트", "sents": [{"en": "It seems that people at the time had conflicting feelings about tigers.", "ko": "그 당시 사람들은 호랑이에 대해 엇갈린 감정을 가지고 있었던 것 같다."}, {"en": "They had respect for tigers’ power and courage.", "ko": "그들은 호랑이의 힘과 용기를 존경했다."}, {"en": "However, they were also scared of tigers because being injured or even killed by tigers was common in the past.", "ko": "하지만 과거에는 호랑이에게 다치거나 심지어 죽는 일이 흔했기 때문에 그들은 호랑이를 무서워하기도 했다."}, {"en": "They may have made tigers into foolish characters in order to be less scared of them.", "ko": "그들은 호랑이를 덜 무서워하려고 호랑이를 어리석은 캐릭터로 만들었을지도 모른다."}, {"en": "Tigers in Korea faced a decline in population due to hunting during the Joseon period and nearly went extinct during the Japanese colonial era.", "ko": "한국의 호랑이는 조선 시대에 사냥으로 수가 줄었고, 일제 강점기에는 거의 멸종했다."}, {"en": "With the disappearance of tigers in Korea, their use as a symbol of the nation faded away.", "ko": "한국에서 호랑이가 사라지면서, 나라의 상징으로 쓰이던 호랑이의 역할도 희미해졌다."}, {"en": "However, their symbolism was revived in modern times through their selection as the mascot for both Olympics hosted by Korea.", "ko": "하지만 한국에서 열린 두 번의 올림픽 마스코트로 뽑히면서 호랑이의 상징성은 현대에 되살아났다."}, {"en": "Hodori was the mascot for the Seoul Summer Olympics in 1988.", "ko": "호돌이는 1988년 서울 하계 올림픽의 마스코트였다."}, {"en": "It was a Siberian tiger, which represents courage.", "ko": "호돌이는 시베리아 호랑이였는데, 이 호랑이는 용기를 상징한다."}, {"en": "The PyeongChang Winter Olympics in 2018 created Soohorang, a white tiger, as its mascot.", "ko": "2018년 평창 동계 올림픽은 백호인 수호랑을 마스코트로 만들었다."}, {"en": "White tigers are considered sacred guardians.", "ko": "백호는 신성한 수호자로 여겨진다."}]}, {"label": "3과 ④ 오늘날의 호랑이", "sents": [{"en": "Tigers are also mentioned in the K-pop song “Tiger is Coming.”", "ko": "호랑이는 K-pop 노래 '범 내려온다'에도 등장한다."}, {"en": "One verse of the song is a reinterpreted version of “Sugungga,” which is a traditional Korean song.", "ko": "이 노래의 한 구절은 한국 전통 소리인 '수궁가'를 새롭게 해석한 것이다."}, {"en": "The song drew worldwide attention, and its video was viewed millions of times online.", "ko": "그 노래는 전 세계의 주목을 받았고, 뮤직비디오는 온라인에서 수백만 번 조회되었다."}, {"en": "These days, only a few wild tigers have been reported to be living in North Korea.", "ko": "요즘은 북한에 야생 호랑이 몇 마리만 살고 있다고 보고되어 있다."}, {"en": "However, the history, stories, and cultural meaning of tigers still have a place among modern Korean people.", "ko": "하지만 호랑이의 역사, 이야기, 문화적 의미는 여전히 현대 한국인 사이에 자리하고 있다."}, {"en": "Who can deny that the tiger is a symbol of Korea?", "ko": "호랑이가 한국의 상징이라는 것을 누가 부정할 수 있을까?"}, {"en": "In 2021, the National Folk Museum of Korea published a book that collects all the stories about tigers in Korea.", "ko": "2021년 국립민속박물관은 한국의 호랑이 이야기를 모두 모은 책을 펴냈다."}, {"en": "How about looking for tigers around you now?", "ko": "이제 여러분 주변에서 호랑이를 찾아보는 것은 어떨까?"}]}], "items": [{"id": "in-g1_cheongseok_L3-01", "p": 0, "s": 5, eless, their symbolism was revived in modern times through their selection as the mascot for both Olympics hosted by Korea.", "ko": "그럼에도 불구하고 한국에서 열린 두 번의 올림픽 마스코트로 뽑히면서 호랑이의 상징성은 현대에 되살아났다.", "chg": "However(그러나) → Nevertheless(그럼에도 불구하고)", "note": "앞머리가 바뀌어도 revived(되살아난)는 앞의 faded away(사라졌다)가 있어야 성립"}, "fam": "역접 가족: However(그러나) / Yet(그렇지만) / Nevertheless(그럼에도 불구하고) / Still(그런데도) / On the other hand(반면에)", "post": "호랑이 감소로 상징 약화 → 올림픽 마스코트로 부활 → 호돌이와 수호랑"}, {"id": "in-g1_cheongseok_L3-06", "p": 3, "s": 4, "pos": [1, 2, 4, 6, 7], "cue": ["However(그러나) → 앞 문장 only a few wild tigers(겨우 몇 마리의 야생 호랑이)와 반대되는 흐름", "still(여전히) → 실제 호랑이는 거의 없지만 의미는 남아 있다는 대비", "뒤 문장 Who can deny ~?(누가 부정할 수 있겠는가) = still have a place(여전히 자리가 있다)를 받는 강조 질문"], "trap": [[6, "symbol of Korea(한국의 상징)와 내용이 비슷해 보이지만 앞 문장과 같은 방향이라 However(그러나)를 쓸 수 없음"], [2, "K-pop 노래 얘기 중간이라 뒤집을 ‘호랑이가 줄었다’는 내용이 없음"]], "var": {"en": "Still, the history, stories, and cultural meaning of tigers have a place among modern Korean people.", "ko": "그런데도 호랑이의 역사, 이야기, 문화적 의미는 현대 한국인 사이에 자리하고 있다.", "chg": "However(그러나) → Still(그런데도)", "note": "문장 맨 앞의 Still(그런데도)도 역접, 앞에 ‘호랑이가 거의 없다’는 내용이 와야 하는 점은 동일"}, "fam": "역접 가족: However(그러나) / Yet(그렇지만) / Nevertheless(그럼에도 불구하고) / Still(그런데도) / On the other hand(반면에)", "post": "야생 호랑이는 거의 없음 → 그래도 문화 속 의미는 남아 있음 → 호랑이는 한국의 상징"}]}</script><script>
var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='in:'+D.key;
