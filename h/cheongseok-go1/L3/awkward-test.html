<script>
var Q=[{"id": "ctx1", "kind": "ctx", "n": 1, "title": null, "tko": null, "paras": [[{"t": "Children around the world learned a bit "}, {"t": "less", "c": 1}, {"t": " about Korean culture when writer Tae Keller published her book When You Trap a Tiger in 2020. Its story starts with a girl who "}, {"t": "meets", "c": 2}, {"t": " a tiger. Her grandmother "}, {"t": "knows", "c": 3}, {"t": " the tiger as well. When her grandmother gets sick, the girl makes a deal with the tiger. Keller’s inspiration for her award-winning book was an old folktale that her halmoni (grandmother) used to tell her. It is called “The Sun and the Moon,” and it is about a brother, a sister, and a tiger. Keller wanted to "}, {"t": "lose", "c": 4}, {"t": " the public’s interest in tigers by "}, {"t": "writing", "c": 5}, {"t": " her own book."}]], "items": [{"c": 1, "w": "less", "r": "more", "gw": "덜", "gr": "더", "fb": null, "fg": "Children around the world learned a bit <span class=\"d\">more</span> about Korean culture when writer Tae Keller published her book When You Trap a Tiger in 2020.", "ko": "전 세계 아이들은 작가 Tae Keller가 2020년에 그녀의 책 When You Trap a Tiger를 출판했을 때 한국 문화에 대해 조금 더 알게 되었다.", "why": "a bit more about Korean culture (한국 문화에 대해 조금 더)가 자연스러워요. 아이들이 책을 통해 한국 문화를 알게 되었다는 좋은 소식이라서, 알게 된 양이 늘어났다는 more (더)가 맞아요. less (덜)는 오히려 알게 된 게 줄었다는 뜻이 되어 책이 성공했다는 흐름과 안 맞아요."}, {"c": 4, "w": "lose", "r": "revive", "gw": "잃다", "gr": "되살리다", "fb": null, "fg": "Keller wanted to <span class=\"d\">revive</span> the public’s interest in tigers by writing her own book.", "ko": "Keller는 그녀 자신의 책을 씀으로써 호랑이에 대한 대중의 흥미를 되살리고 싶어 했다.", "why": "마지막 문장은 Keller (켈러)가 책을 쓴 이유예요. 할머니가 들려준 호랑이 설화를 책에 담았으니, 호랑이에 대한 관심을 revive (되살리다)하고 싶었다고 해야 맞아요. lose (잃다)이면 '책을 써서 관심을 잃게 하고 싶다'가 되어 책을 쓴 이유와 정반대예요."}], "keep": "meets (만난다)는 a girl who meets a tiger (호랑이를 만나는 소녀)로 이야기의 시작을 말하니 자연스러워요. knows (알고 있다)는 할머니도 그 호랑이를 안다는 뜻이라 as well (역시)과 잘 이어져요. writing (쓰는 것)은 by writing her own book (자신의 책을 씀으로써)이라 방법을 나타내서 맞아요.", "flow": "작가 Tae Keller (태 켈러)가 호랑이 이야기를 담은 책을 쓰게 된 사연이에요. 어릴 때 할머니에게 들은 옛이야기가 책의 씨앗이 되었고, 작가는 호랑이에 대한 사람들의 관심을 다시 키우고 싶어 했어요. '한국 문화를 더 알게 되었다'와 '호랑이에 대한 관심을 되살리고 싶었다'로 읽히는 곳을 확인하세요.", "ko": "전 세계 아이들은 작가 Tae Keller가 2020년에 그녀의 책 When You Trap a Tiger를 출판했을 때 한국 문화에 대해 조금 더 알게 되었다. 그것의 이야기는 호랑이를 만난 한 소녀로부터 시작된다. 그녀의 할머니 역시 그 호랑이를 알고 있다. 그녀의 할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다. Keller의 수상 도서에 영감을 준 것은 그녀의 할머니가 그녀에게 이야기해 주던 옛 설화였다. 그것은 ‘해님 달님’이라고 불리는데, 오빠와 여동생, 그리고 호랑이에 관한 내용이다. Keller는 그녀 자신의 책을 씀으로써 호랑이에 대한 대중의 흥미를 되살리고 싶어 했다. 호랑이는 한국의 문화와 어떻게 연관되는가?"}, {"id": "ctx2", "kind": "ctx", "n": 2, "title": null, "tko": null, "paras": [[{"t": "How is the tiger related to Korean culture? Long ago, tigers were so "}, {"t": "scarce", "c": 1}, {"t": " in Korea that people often called the country the “Land of Tigers.” It is estimated that tigers lived in Korea for at least 100,000 years. The "}, {"t": "first", "c": 2}, {"t": " appearance of a tiger in Korean culture dates back to the rock art of the Bronze Age. It depicts people hunting various animals, including tigers. Since then, tigers have "}, {"t": "disappeared", "c": 3}, {"t": " in many aspects of Korean culture, from legends to art and musical instruments."}], [{"t": "Some of you may have heard Korean folktales "}, {"t": "featuring", "c": 4}, {"t": " tigers. In fact, approximately forty percent of Korean folktales about animals include a tiger. Tigers in Korean folktales are sometimes shown in a positive light and sometimes as foolish creatures. For example, in one story, a tiger helps a human become rich after the human "}, {"t": "kills", "c": 5}, {"t": " the tiger’s life."}]], "items": [{"c": 1, "w": "scarce", "r": "abundant", "gw": "드문", "gr": "풍부한(많은)", "fb": null, "fg": "Long ago, tigers were so <span class=\"d\">abundant</span> in Korea that people often called the country the “Land of Tigers.”", "ko": "오래 전, 한국에는 호랑이가 매우 많아서 사람들은 종종 그 나라를 ‘호랑이의 땅’이라고 불렀다.", "why": "뒤에 사람들이 나라를 'Land of Tigers (호랑이의 땅)'라고 불렀다고 해요. 그렇게 부르려면 호랑이가 아주 많아야 하니 abundant (풍부한, 많은)가 맞아요. scarce (드문)이면 호랑이가 거의 없다는 뜻이라 '호랑이의 땅'이라는 이름과 안 맞아요."}, {"c": 3, "w": "disappeared", "r": "appeared", "gw": "사라졌다", "gr": "나타났다", "fb": null, "fg": "Since then, tigers have <span class=\"d\">appeared</span> in many aspects of Korean culture, from legends to art and musical instruments.", "ko": "그때부터, 호랑이는 전설에서부터 미술과 악기에 이르기까지 한국 문화의 많은 측면에 등장해 왔다.", "why": "앞 문장은 바위 그림에 호랑이가 처음 나타난 이야기예요. Since then (그때부터)가 이어지니 전설, 미술, 악기 같은 여러 곳에 호랑이가 계속 appeared (나타났다)가 되어야 해요. disappeared (사라졌다)이면 '전설부터 악기까지 사라졌다'가 되어 앞의 first appearance (첫 등장)와 이어지지 않아요."}, {"c": 5, "w": "kills", "r": "saves", "gw": "죽이다", "gr": "구하다", "fb": null, "fg": "For example, in one story, a tiger helps a human become rich after the human <span class=\"d\">saves</span> the tiger’s life.", "ko": "예를 들어, 한 이야기에서, 호랑이는 한 인간이 그 호랑이의 생명을 구해 준 이후 그가 부유해지도록 돕는다.", "why": "호랑이가 사람을 돕는 이유가 나오는 문장이에요. 호랑이가 사람을 부자로 만들어 줬다면, 그 전에 사람이 호랑이의 life (생명)를 saves (구해 주었다)여야 은혜를 갚는 이야기가 돼요. kills (죽이다)이면 죽은 호랑이가 사람을 도울 수 없고, 도울 이유도 없어요."}], "keep": "first (처음의)는 바위 그림에 호랑이가 처음 나왔다는 뜻이라 dates back to (~로 거슬러 올라간다)와 잘 맞아요. featuring (~이 등장하는)은 호랑이가 나오는 설화라는 뜻이라 알맞아요.", "flow": "호랑이가 한국 문화에서 얼마나 중요한 존재였는지 소개하는 부분이에요. 옛날엔 호랑이가 많아서 나라 이름이 'Land of Tigers (호랑이의 땅)'였고, 그 뒤로 전설부터 악기까지 여러 곳에 호랑이가 나타나요. 설화 속 호랑이는 은혜를 갚는 존재로도 나와요.", "ko": "호랑이는 한국의 문화와 어떻게 연관되는가? 오래 전, 한국에는 호랑이가 매우 많아서 사람들은 종종 그 나라를 ‘호랑이의 땅’이라고 불렀다. 호랑이는 한국에 적어도 십만 년을 살았다고 추정된다. 한국 문화에서 호랑이의 첫 번째 등장은 청동기 시대의 바위 그림으로 거슬러 올라간다. 그것은 호랑이를 포함하여 다양한 동물을 사냥하는 사람들을 묘사한다. 그때부터, 호랑이는 전설에서부터 미술과 악기에 이르기까지 한국 문화의 많은 측면에 등장해 왔다. 여러분 중 일부는 호랑이가 등장하는 한국 설화를 들어 봤을지도 모른다. 사실, 동물에 대한 한국 설화의 약 40%가 호랑이를 포함한다. 한국 설화에서 호랑이는 때로는 긍정적인 시각, 그리고 때로는 어리석은 존재로 보여진다. 예를 들어, 한 이야기에서, 호랑이는 한 인간이 그 호랑이의 생명을 구해 준 이후 그가 부유해지도록 돕는다."}, {"id": "ctx3", "kind": "ctx", "n": 3, "title": null, "tko": null, "paras": [[{"t": "In another story, a tiger hears a mother tell her crying baby, “Don’t cry. Here’s a gotgam.” Because the baby "}, {"t": "keeps", "c": 1}, {"t": " crying, the tiger mistakenly thinks the gotgam is a very scary creature and runs away. It seems that people at the time had "}, {"t": "conflicting", "c": 2}, {"t": " feelings about tigers. They had respect for tigers’ power and courage. However, they were also "}, {"t": "scared", "c": 3}, {"t": " of tigers because being injured or even killed by tigers was common in the past. They may have made tigers into foolish characters in order to be less scared of them."}], [{"t": "Tigers in Korea faced a "}, {"t": "rise", "c": 4}, {"t": " in population due to hunting during the Joseon period and nearly went extinct during the Japanese colonial era. With the "}, {"t": "appearance", "c": 5}, {"t": " of tigers in Korea, their use as a symbol of the nation faded away. However, their symbolism was "}, {"t": "revived", "c": 6}, {"t": " in modern times through their selection as the mascot for both Olympics hosted by Korea. Hodori was the mascot for the Seoul Summer Olympics in 1988. It was a Siberian tiger, which represents courage. The PyeongChang Winter Olympics in 2018 created Soohorang, a white tiger, as its mascot. White tigers are considered sacred guardians."}]], "items": [{"c": 1, "w": "keeps", "r": "stops", "gw": "계속하다", "gr": "멈추다", "fb": null, "fg": "Because the baby <span class=\"d\">stops</span> crying, the tiger mistakenly thinks the gotgam is a very scary creature and runs away.", "ko": "그 아기가 울기를 멈추기 때문에, 호랑이는 그 곶감이 매우 무서운 생명체라고 잘못 생각하고 달아난다.", "why": "앞 문장에서 어머니가 'Don't cry. Here's a gotgam (울지 마. 여기 곶감이 있단다)'이라고 해요. 그러자 호랑이는 곶감이 무서운 존재라 아기가 울음을 그쳤다고 생각하고 도망가요. 그러니 아기가 울음을 stops (멈춘다)여야 맞아요. keeps crying (계속 운다)이면 곶감이 무섭다고 생각할 이유가 없어요."}, {"c": 4, "w": "rise", "r": "decline", "gw": "증가", "gr": "감소", "fb": null, "fg": "Tigers in Korea faced a <span class=\"d\">decline</span> in population due to hunting during the Joseon period and nearly went extinct during the Japanese colonial era.", "ko": "한국의 호랑이들은 조선 시대 동안 사냥 때문에 개체 수 감소에 직면했고, 일제 강점기 동안 거의 멸종에 이르렀다.", "why": "뒤에 nearly went extinct (거의 멸종했다)가 이어져요. 사냥 때문에 호랑이가 줄어들다가 멸종 직전까지 갔다는 흐름이니 decline (감소)이 맞아요. rise (증가)이면 호랑이가 늘다가 갑자기 멸종했다는 뜻이 되어 앞뒤가 이어지지 않아요."}, {"c": 5, "w": "appearance", "r": "disappearance", "gw": "등장", "gr": "사라짐", "fb": null, "fg": "With the <span class=\"d\">disappearance</span> of tigers in Korea, their use as a symbol of the nation faded away.", "ko": "한국에서 호랑이가 사라지면서, 국가의 상징으로서의 그들의 용도도 희미해졌다.", "why": "문장 뒤쪽이 their use as a symbol of the nation faded away (국가의 상징으로서의 용도도 희미해졌다)예요. 호랑이가 한국에서 사라졌기 때문에 상징으로서도 약해졌다는 흐름이라 disappearance (사라짐)가 맞아요. appearance (등장)이면 호랑이가 나타났는데 상징은 희미해졌다는 뜻이 되어 이상해요."}], "keep": "conflicting (상충하는)은 respect (존경)와 scared (무서움)가 섞인 마음을 말해 맞아요. scared (무서워하는)는 호랑이에게 다치거나 죽는 일이 흔했다는 이유와 이어져요. revived (되살아났다)는 faded away (희미해졌다) 다음에 However (그러나)로 반대 방향을 알려 줘서 맞아요.", "flow": "곶감 이야기에서 시작해, 옛사람들이 호랑이를 존경하면서도 무서워했다는 흐름이에요. 그 뒤 조선 시대에 호랑이가 줄었고 한국에서 호랑이가 사라지자 상징성도 약해졌지만, 올림픽 마스코트로 다시 살아났다고 이어져요. '줄어든다 - 사라진다 - 되살아난다'의 방향을 확인하세요.", "ko": "또 다른 이야기에서, 호랑이는 한 어머니가 울고 있는 자신의 아기에게 “울지 마. 여기 곶감이 있단다.”라고 말하는 것을 듣는다. 그 아기가 울기를 멈추기 때문에, 호랑이는 그 곶감이 매우 무서운 생명체라고 잘못 생각하고 달아난다. 그 당시 사람들은 호랑이에 대해 상충되는 감정을 지니고 있었던 것으로 보인다. 그들은 호랑이의 힘과 용기에 대한 존경심이 있었다. 그러나, 과거에는 호랑이에게 상처를 입거나 심지어 죽임을 당하는 일이 흔했기 때문에 그들은 호랑이를 무서워하기도 했다. 그들은 호랑이를 덜 무서워하기 위해 호랑이를 어리석은 캐릭터로 만들었을지도 모른다. 한국의 호랑이들은 조선 시대 동안 사냥 때문에 개체 수 감소에 직면했고, 일제 강점기 동안 거의 멸종에 이르렀다. 한국에서 호랑이가 사라지면서, 국가의 상징으로서의 그들의 용도도 희미해졌다. 그러나, 한국에서 열린 두 올림픽의 마스코트로 선정되면서 그들의 상징성이 현대에 되살아났다. 호돌이는 1988년 서울 하계 올림픽의 마스코트였다. 그것은 시베리안 호랑이였는데, 그들은 용기를 상징한다. 2018년 평창 동계 올림픽은 백호인 수호랑을 그것의 마스코트로 만들었다. 백호는 신성한 수호자로 여겨진다."}, {"id": "ctx4", "kind": "ctx", "n": 4, "title": null, "tko": null, "paras": [[{"t": "Tigers are also mentioned in the K-pop song “Tiger is Coming.” One verse of the song is a "}, {"t": "reinterpreted", "c": 1}, {"t": " version of “Sugungga,” which is a traditional Korean song. The song "}, {"t": "lost", "c": 2}, {"t": " worldwide attention, and its video was viewed millions of times online."}], [{"t": "These days, only a few wild tigers have been reported to be living in North Korea. However, the history, stories, and cultural meaning of tigers still "}, {"t": "have", "c": 3}, {"t": " a place among modern Korean people. Who can "}, {"t": "allow", "c": 4}, {"t": " that the tiger is a symbol of Korea? In 2021, the National Folk Museum of Korea published a book that "}, {"t": "collects", "c": 5}, {"t": " all the stories about tigers in Korea. How about looking for tigers around you now?"}]], "items": [{"c": 2, "w": "lost", "r": "drew", "gw": "잃었다", "gr": "끌었다", "fb": null, "fg": "The song <span class=\"d\">drew</span> worldwide attention, and its video was viewed millions of times online.", "ko": "그 노래는 세계적인 주목을 끌었고, 그것의 영상은 온라인에서 수백만 회 시청되었다.", "why": "뒤에 its video was viewed millions of times online (영상은 온라인에서 수백만 회 시청되었다)이 나와요. 영상이 그렇게 많이 봤다면 노래가 worldwide attention (세계적인 주목)을 drew (끌었다)여야 맞아요. lost (잃었다)이면 주목을 잃었다는 말인데 수백만 번 봤다는 말과 반대예요."}, {"c": 4, "w": "allow", "r": "deny", "gw": "허락하다", "gr": "부정하다", "fb": null, "fg": "Who can <span class=\"d\">deny</span> that the tiger is a symbol of Korea?", "ko": "호랑이가 한국의 상징이라는 점을 누가 부정할 수 있을까?", "why": "Who can ~? (누가 ~할 수 있을까?)는 '아무도 ~할 수 없다'는 뜻의 질문이에요. 앞 문장은 호랑이의 이야기가 지금도 한국인 사이에 자리한다는 내용이니, 호랑이가 한국의 상징이라는 것을 누가 deny (부정하다)할 수 있겠느냐고 말해야 해요. allow (허락하다)는 that (~라는) 뒤의 내용과 어울리지 않아요."}], "keep": "reinterpreted (재해석된)는 옛 노래를 새롭게 바꿨다는 뜻이라 version (판)과 잘 어울려요. have (가지고 있다)는 a place (자리)와 함께 '자리하고 있다'가 되어 맞아요. collects (모은다)는 all the stories (모든 이야기)를 책 한 권에 모았다는 뜻이라 자연스러워요.", "flow": "호랑이 이야기의 마무리 부분이에요. 노래 'Tiger is Coming (범 내려온다)'이 세계의 관심을 모았고, 야생 호랑이는 거의 없어도 호랑이는 여전히 한국인의 상징이라는 결론으로 이어져요. 칭찬하는 분위기에서 '받았다'와 '부정할 수 없다'를 찾으면 돼요.", "ko": "호랑이는 한국의 문화와 어떻게 연관되는가? 호랑이는 또한 한국 대중가요 ‘범 내려온다’에도 언급된다. 이 노래의 한 구절(가사)은 ‘수궁가’의 재해석판인데, 수궁가는 한국의 전통 가곡이다. 그 노래는 세계적인 주목을 끌었고, 그것의 영상은 온라인에서 수백만 회 시청되었다. 오늘날, 단지 소수의 야생 호랑이만이 북한에 살고 있다고 보고되어 왔다. 그러나, 호랑이의 역사, 이야기, 그리고 문화적 의미는 현대 한국 사람들 사이에 여전히 자리하고 있다. 호랑이가 한국의 상징이라는 점을 누가 부정할 수 있을까? 2021년에, 국립 민속 박물관은 한국의 호랑이에 관한 모든 이야기를 모은 책을 출판했다. 이제 여러분 주변에서 호랑이를 찾아보는 것은 어떨까?"}, {"id": "gram1", "kind": "gram", "n": 1, "title": null, "tko": null, "paras": [[{"t": "Children around the world learned a bit more about Korean culture when writer Tae Keller published her book When You Trap a Tiger in 2020. Its story starts with a girl "}, {"t": "whose meets a tiger", "c": 1}, {"t": ". Her grandmother knows the tiger as well. "}, {"t": "When her grandmother gets sick", "c": 2}, {"t": ", the girl makes a deal with the tiger. Keller’s inspiration for her award-winning book was an old folktale "}, {"t": "what her halmoni (grandmother) used to tell her", "c": 3}, {"t": ". "}, {"t": "It is calling “The Sun and the Moon,”", "c": 4}, {"t": " and it is about a brother, a sister, and a tiger. "}, {"t": "Keller wanted to revive the public’s interest in tigers", "c": 5}, {"t": " by writing her own book."}]], "items": [{"c": 1, "w": "whose", "r": "who[that]", "gw": "~의", "gr": "~하는 (사람을 꾸밈)", "fb": "<span class=\"d\">whose</span> meets a tiger", "fg": "<span class=\"d\">who[that]</span> meets a tiger", "ko": "그것의 이야기는 호랑이를 만난 한 소녀로부터 시작된다.", "why": "a girl (소녀) 뒤에서 '호랑이를 만나는 소녀'라고 꾸며 주는 말이 필요해요. 소녀가 직접 만나는 것이니 사람 뒤에서 바로 동사 meets (만난다)로 이어지는 who[that]이 맞아요. whose (~의)는 뒤에 명사가 와야 하는데 여기는 동사 meets라서 틀려요."}, {"c": 3, "w": "what", "r": "that[which]", "gw": "~하는 것", "gr": "~하는 (명사를 꾸밈)", "fb": "<span class=\"d\">what</span> her halmoni (grandmother) used to tell her", "fg": "<span class=\"d\">that[which]</span> her halmoni (grandmother) used to tell her", "ko": "Keller의 수상 도서에 영감을 준 것은 그녀의 할머니가 그녀에게 이야기해 주던 옛 설화였다.", "why": "an old folktale (옛 설화) 뒤에서 '할머니가 들려주던 옛 설화'라고 꾸며 주는 말이 필요해요. 이미 앞에 꾸밀 명사 folktale이 있으니 that[which] (~하는)을 써요. what은 '~하는 것'이라는 뜻으로 앞에 명사가 없을 때 쓰는 말이라서 여기에는 맞지 않아요."}, {"c": 4, "w": "calling", "r": "called", "gw": "부르고 있다", "gr": "불린다", "fb": "It is <span class=\"d\">calling</span> “The Sun and the Moon,”", "fg": "It is <span class=\"d\">called</span> “The Sun and the Moon,”", "ko": "그것은 ‘해님 달님’이라고 불리는데, 오빠와 여동생, 그리고 호랑이에 관한 내용이다.", "why": "It은 앞 문장의 old folktale (옛 설화)를 가리켜요. 설화가 '해님 달님'이라고 불리는 것이니 '~라고 불린다'는 is called (불린다)가 맞아요. calling (부르는)이면 설화가 직접 누군가를 부르는 뜻이 되어 이야기에 안 맞아요."}], "keep": "When her grandmother gets sick (할머니가 아프게 되자)는 때를 나타내는 When (~할 때)이 이끄는 문장이라 맞아요. Keller wanted to revive the public's interest in tigers (Keller는 호랑이에 대한 대중의 관심을 되살리고 싶어 했다)에서 wanted to (~하고 싶었다) 뒤에 동사 원래 모양 revive (되살리다)가 와서 알맞아요.", "flow": "Tae Keller (태 켈러)가 책을 쓰게 된 이야기예요. 소녀 이야기, 할머니의 옛이야기, 이야기 제목이 차례로 나오니 '앞의 사람/물건을 꾸며 주는 말'과 '불린다'는 모양을 살펴보세요.", "ko": "전 세계 아이들은 작가 Tae Keller가 2020년에 그녀의 책 When You Trap a Tiger를 출판했을 때 한국 문화에 대해 조금 더 알게 되었다. 그것의 이야기는 호랑이를 만난 한 소녀로부터 시작된다. 그녀의 할머니 역시 그 호랑이를 알고 있다. 그녀의 할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다. Keller의 수상 도서에 영감을 준 것은 그녀의 할머니가 그녀에게 이야기해 주던 옛 설화였다. 그것은 ‘해님 달님’이라고 불리는데, 오빠와 여동생, 그리고 호랑이에 관한 내용이다. Keller는 그녀 자신의 책을 씀으로써 호랑이에 대한 대중의 흥미를 되살리고 싶어 했다. 호랑이는 한국의 문화와 어떻게 연관되는가?"}, {"id": "gram2", "kind": "gram", "n": 2, "title": null, "tko": null, "paras": [[{"t": "How is the tiger related to Korean culture? Long ago, "}, {"t": "tigers were so abundant in Korea that people often called the country the “Land of Tigers.”", "c": 1}, {"t": " "}, {"t": "It estimates that tigers lived in Korea for at least 100,000 years.", "c": 2}, {"t": " The first appearance of a tiger in Korean culture dates back to the rock art of the Bronze Age. "}, {"t": "It depicts people hunting various animals", "c": 3}, {"t": ", including tigers. Since then, tigers have appeared in many aspects of Korean culture, from legends to art and musical instruments."}], [{"t": "Some of you may have been heard Korean folktales featuring tigers.", "c": 4}, {"t": " In fact, approximately forty percent of Korean folktales about animals include a tiger. Tigers in Korean folktales are sometimes shown in a positive light and sometimes as foolish creatures. For example, in one story, "}, {"t": "a tiger helps a human become richly", "c": 5}, {"t": " after the human saves the tiger’s life."}]], "items": [{"c": 2, "w": "estimates", "r": "is estimated", "gw": "추정한다", "gr": "추정된다", "fb": "It <span class=\"d\">estimates</span> that tigers lived in Korea for at least 100,000 years.", "fg": "It <span class=\"d\">is</span> <span class=\"d\">estimated</span> that tigers lived in Korea for at least 100,000 years.", "ko": "호랑이는 한국에 적어도 십만 년을 살았다고 추정된다.", "why": "주어 It은 아무것도 가리키지 않는 말이고, 호랑이가 십만 년 살았다는 것은 '사람들이 추정하는' 내용이라 '추정된다'는 It is estimated that (~라고 추정된다)가 맞아요. It estimates이면 It이 직접 추정한다는 뜻이 되어 틀려요."}, {"c": 4, "w": "been", "r": "(삭제)", "gw": "들려졌다 (수동)", "gr": "들어 봤다", "fb": "Some of you may have <span class=\"d\">been</span> heard Korean folktales featuring tigers.", "fg": "Some of you may have heard Korean folktales featuring tigers.", "ko": "여러분 중 일부는 호랑이가 등장하는 한국 설화를 들어 봤을지도 모른다.", "why": "Some of you (여러분 중 일부)가 직접 듣는 쪽이니 may have heard (들어 봤을지도 모른다)가 맞아요. have been heard (들려졌다)는 '여러분이 들려졌다'는 뜻이 되어 이상해요. may have 다음엔 바로 과거분사 heard만 써요."}, {"c": 5, "w": "richly", "r": "rich", "gw": "부유하게 (부사)", "gr": "부자인 (형용사)", "fb": "a tiger helps a human become <span class=\"d\">richly</span>", "fg": "a tiger helps a human become <span class=\"d\">rich</span>", "ko": "예를 들어, 한 이야기에서, 호랑이는 한 인간이 그 호랑이의 생명을 구해 준 이후 그가 부유해지도록 돕는다.", "why": "become (~이 되다) 뒤에는 '어떻게'가 아니라 '무엇이/어떤 상태'가 되는지가 와요. 그래서 상태를 말하는 형용사 rich (부유한)가 맞아요. richly (풍부하게)는 동작을 꾸며 주는 말이라 become 뒤에 쓰지 않아요."}], "keep": "tigers were so abundant in Korea that people often called the country ~ (한국에 호랑이가 너무 많아서 사람들이 그 나라를 ~라고 불렀다)는 'so ~ that (너무 ~해서 ...하다)' 짝이 맞아요. It depicts people hunting various animals (그것은 다양한 동물을 사냥하는 사람들을 묘사한다)에서 depicts (묘사한다)는 It (그것)이 단수라 -s가 붙어 맞아요.", "flow": "한국 문화 속 호랑이를 소개하는 글이에요. '추정된다', '들어 봤을지도 모른다', '부유해지도록 돕는다'처럼 동사의 모양과 형용사/부사 선택이 문제예요.", "ko": "호랑이는 한국의 문화와 어떻게 연관되는가? 오래 전, 한국에는 호랑이가 매우 많아서 사람들은 종종 그 나라를 ‘호랑이의 땅’이라고 불렀다. 호랑이는 한국에 적어도 십만 년을 살았다고 추정된다. 한국 문화에서 호랑이의 첫 번째 등장은 청동기 시대의 바위 그림으로 거슬러 올라간다. 그것은 호랑이를 포함하여 다양한 동물을 사냥하는 사람들을 묘사한다. 그때부터, 호랑이는 전설에서부터 미술과 악기에 이르기까지 한국 문화의 많은 측면에 등장해 왔다. 여러분 중 일부는 호랑이가 등장하는 한국 설화를 들어 봤을지도 모른다. 사실, 동물에 대한 한국 설화의 약 40%가 호랑이를 포함한다. 한국 설화에서 호랑이는 때로는 긍정적인 시각, 그리고 때로는 어리석은 존재로 보여진다. 예를 들어, 한 이야기에서, 호랑이는 한 인간이 그 호랑이의 생명을 구해 준 이후 그가 부유해지도록 돕는다."}, {"id": "gram3", "kind": "gram", "n": 3, "title": null, "tko": null, "paras": [[{"t": "In another story, "}, {"t": "a tiger hears a mother tell her crying baby", "c": 1}, {"t": ", “Don’t cry. Here’s a gotgam.” Because the baby stops crying, the tiger mistakenly thinks the gotgam is a very scary creature and runs away. "}, {"t": "It is seemed that people at the time had conflicting feelings about tigers.", "c": 2}, {"t": " They had respect for tigers’ power and courage. However, they were also scared of tigers "}, {"t": "because of being injured or even killed by tigers was common in the past", "c": 3}, {"t": ". "}, {"t": "They may have made tigers into foolish characters", "c": 4}, {"t": " in order to be less scared of them."}], [{"t": "Tigers in Korea faced a decline in population due to hunting", "c": 5}, {"t": " during the Joseon period and nearly went extinct during the Japanese colonial era. With the disappearance of tigers in Korea, their use as a symbol of the nation faded away. However, their symbolism was revived in modern times through their selection as the mascot for both Olympics hosted by Korea. Hodori was the mascot for the Seoul Summer Olympics in 1988. It was a Siberian tiger, "}, {"t": "which represent courage", "c": 6}, {"t": ". The PyeongChang Winter Olympics in 2018 created Soohorang, a white tiger, as its mascot. White tigers are considered sacred guardians."}]], "items": [{"c": 2, "w": "is seemed", "r": "seems", "gw": "보여진다", "gr": "~인 것 같다", "fb": "It <span class=\"d\">is</span> <span class=\"d\">seemed</span> that people at the time had conflicting feelings about tigers.", "fg": "It <span class=\"d\">seems</span> that people at the time had conflicting feelings about tigers.", "ko": "그 당시 사람들은 호랑이에 대해 상충되는 감정을 지니     h.appendChild(el('span','tag '+(hit?'y':'n'),(hit?'찾았어요 ':'놓쳤어요 ')+CIRC.charAt(it.c-1)));
    var ia=el('span','ia');ia.appendChild(el('span','x',it.w));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gw+')'));ia.appendChild(document.createTextNode(' → '));ia.appendChild(el('span','r',it.r));ia.appendChild(document.createTextNode(' '));ia.appendChild(el('em',null,'('+it.gr+')'));
    h.appendChild(ia);d.appendChild(h);
    var f=el('div','fix');
    if(it.fb)f.appendChild(html('span','l bad','<small>틀린 문장</small>'+it.fb));
    f.appendChild(html('span','l good','<small>고친 문장</small>'+it.fg));d.appendChild(f);
    d.appendChild(el('div','kot',it.ko));
    d.appendChild(html('div','why',it.why));
    res.appendChild(d)});
  var wrongPick=r.sel.filter(function(c){return T.indexOf(c)<0});
  if(wrongPick.length){res.appendChild(html('div','note','<b>잘못 고른 곳</b> '+wrongPick.map(function(c){return CIRC.charAt(c-1)}).join(' ')+'은(는) 글의 흐름과 문법에 맞는 표현이라 그대로 둬요.'))}
  if(WN.MODE){res.appendChild(html('div','note','이제 안 봐도 되는 문제는 <a href="../wrong.html" style="color:#0f766e;text-decoration:underline">오답 노트</a>에서 \'빼기\'로 뺄 수 있어요.'))}
  else if(WN.has('L3',PART,'awk',q.id)){res.appendChild(html('div','note','<a href="../wrong.html" style="color:#0f766e;text-decoration:underline">틀린 '+WN.ids('L3',PART,'awk').length+'개가 오답 노트에 담겼어요 ›</a>'))}
  res.appendChild(html('div','note','<b>글의 흐름</b> '+q.flow));
  res.appendChild(html('div','note','<b>그대로 두는 부분</b> '+q.keep));
  var kb=el('div','kobox');kb.textContent=q.ko;
  var row=el('div','row');
  var bk=el('button','btn','한글 해석 보기');bk.onclick=function(){var on=kb.classList.toggle('on');bk.textContent=on?'한글 해석 닫기':'한글 해석 보기'};
  res.appendChild(bk);res.appendChild(kb);
  var idx=Q.indexOf(q),nx=Q[idx+1];
  var again=el('button','big alt','이 문제 다시 풀기');again.onclick=function(){S.res[q.id]={sel:[],done:false};save();draw(q);window.scrollTo(0,0)};
  var next=el('button','big',nx?'다음 문제 · '+nm(nx):'목록으로');next.onclick=function(){if(nx)open(nx.id);else home()};
  row.appendChild(again);row.appendChild(next);res.appendChild(row);
}
