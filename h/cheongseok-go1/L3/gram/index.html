<style>

 --gd:#15803d;--gl:#c6efcf;--bd:#1d4ed8;--bl:#cfe0fb;--kd:#be185d;--kl:#fbcfe3;--od:#c2570c;--ol:#ffe0b8}

<script>
var D={"secs": [{"no": 1, "id": "z1", "sents": [{"n": 1, "mk": "Children around the world learned [2|a bit] more about Korean culture [1|when] writer Tae Keller published her book When You Trap a Tiger in 2020.", "en": "Children around the world learned a bit more about Korean culture when writer Tae Keller published her book When You Trap a Tiger in 2020.", "ko": "전 세계 아이들은 작가 Tae Keller가 2020년에 그녀의 책 When You Trap a Tiger를 출판했을 때 한국 문화에 대해 조금 더 알게 되었다."}, {"n": 2, "mk": "[3|Its] story starts with a girl [4|who] meets a tiger.", "en": "Its story starts with a girl who meets a tiger.", "ko": "그것의 이야기는 호랑이를 만난 한 소녀로부터 시작된다."}, {"n": 3, "mk": "Her grandmother knows the tiger [5|as well].", "en": "Her grandmother knows the tiger as well.", "ko": "그녀의 할머니 역시 그 호랑이를 알고 있다."}, {"n": 4, "mk": "[1|When] her grandmother [6|gets sick], the girl [7|makes a deal] with the tiger.", "en": "When her grandmother gets sick, the girl makes a deal with the tiger.", "ko": "그녀의 할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다."}, {"n": 5, "mk": "Keller’s [8|inspiration] for her [8|award-winning] book was an old folktale [9|that] her halmoni (grandmother) [10|used to tell] her.", "en": "Keller’s inspiration for her award-winning book was an old folktale that her halmoni (grandmother) used to tell her.", "ko": "Keller의 수상 도서에 영감을 준 것은 그녀의 할머니가 그녀에게 이야기해 주던 옛 설화였다."}, {"n": 6, "mk": "[12|It] [11|is called] “The Sun and the Moon,” and it is about a brother, a sister, and a tiger.", "en": "It is called “The Sun and the Moon,” and it is about a brother, a sister, and a tiger.", "ko": "그것은 ‘해님 달님’이라고 불리는데, 오빠와 여동생, 그리고 호랑이에 관한 내용이다."}, {"n": 7, "mk": "Keller [13|wanted to revive] the public’s interest in tigers [14|by writing] her own book.", "en": "Keller wanted to revive the public’s interest in tigers by writing her own book.", "ko": "Keller는 그녀 자신의 책을 씀으로써 호랑이에 대한 대중의 흥미를 되살리고 싶어 했다."}], "items": [{"t": "접속사 when : ~할 때", "c": "k", "x": "when은 ‘~할 때’라는 뜻의 접속사라서 뒤에 주어와 동사가 있는 절이 온다. 첫 문장의 when writer Tae Keller published her book은 ‘작가 Tae Keller가 책을 출판했을 때’라는 뜻이다. When her grandmother gets sick처럼 문장 맨 앞에 오면 절 뒤에 쉼표를 찍고 주절이 이어진다.", "n": ["when + 주어 + 동사 = ~할 때", "when절이 앞에 오면 쉼표 뒤에 주절"], "q": "When her grandmother gets sick, the girl makes a deal에서 When절은 어디까지이고 뜻은 무엇인가?", "a": "When her grandmother gets sick까지. ‘그녀의 할머니가 아프게 되었을 때’", "p": "when writer Tae Keller published"}, {"t": "a bit : 조금, 약간", "c": "g", "x": "a bit은 ‘조금, 약간’이라는 뜻이다. learned a bit more about Korean culture는 ‘한국 문화에 대해 조금 더 알게 되었다’라는 뜻이다. 비교급 more 앞에 붙어 ‘정도가 조금’이라고 말해 준다. learned는 동사 learn(배우다, 알게 되다)의 과거형이다.", "n": ["a bit = 조금, 약간", "a bit + 비교급 = 조금 더 ~한"], "q": "a bit more about Korean culture는 무슨 뜻인가?", "a": "한국 문화에 대해 조금 더", "p": "a bit more about Korean culture"}, {"t": "Its = 책 When You Trap a Tiger의", "c": "o", "x": "Its story의 Its는 it의 소유격으로 ‘그것의’라는 뜻이다. 앞 문장에서 소개한 her book When You Trap a Tiger를 가리킨다. 그래서 Its story는 ‘그 책의 이야기’이다.", "n": ["its = it의 소유격 (그것의)", "Its story = 책 When You Trap a Tiger의 이야기"], "q": "Its story starts with a girl에서 Its는 무엇을 가리키는가?", "a": "책 When You Trap a Tiger", "p": "Its"}, {"t": "주격 관계대명사 who : 선행사 a girl", "c": "k", "x": "a girl who meets a tiger에서 who는 앞의 a girl을 꾸미는 관계대명사이다. who 바로 뒤에 동사 meets가 바로 오니까 who가 관계절의 주어 역할을 하는 주격이다. 선행사 a girl이 단수라서 동사도 meets처럼 단수형으로 쓴다. 해석은 ‘호랑이를 만난 한 소녀’이다.", "n": ["선행사(사람) + who + 동사 = ~하는 (사람)", "주격 관계대명사 뒤에는 동사가 바로 온다"], "q": "a girl who meets a tiger에서 who는 무슨 역할을 하는가? 동사 meets가 단수인 이유는?", "a": "관계절의 주어(주격 관계대명사). 선행사 a girl이 단수이기 때문이다.", "p": "a girl who meets a tiger"}, {"t": "as well : 또한, 역시", "c": "g", "x": "as well은 ‘또한, 역시’라는 뜻으로 too와 비슷하다. 보통 문장 맨 끝에 온다. Her grandmother knows the tiger as well은 ‘할머니 역시 그 호랑이를 알고 있다’라는 뜻이다. 소녀뿐 아니라 할머니도 호랑이를 안다는 점을 덧붙여 준다.", "n": ["as well = 또한, 역시 (=too)", "문장 끝에 쓴다"], "q": "Her grandmother knows the tiger as well에서 as well의 뜻은?", "a": "또한, 역시", "p": "as well"}, {"t": "get + 형용사 : ~해지다", "c": "b", "x": "gets sick은 get + 형용사 구조로 ‘아프게 되다’라는 뜻이다. 이때 get은 ‘~해지다, ~되다’의 뜻으로 상태가 변하는 것을 나타내고 뒤에는 형용사 sick이 온다. 주어가 her grandmother(3인칭 단수)라서 get에 -s가 붙은 gets이다.", "n": ["get + 형용사 = ~해지다, ~하게 되다", "get 뒤에 부사가 아니라 형용사"], "q": "gets sick에서 get의 뜻은 무엇이고 뒤에 오는 말의 품사는?", "a": "‘~해지다’. 뒤에는 형용사(sick)가 온다.", "p": "gets sick"}, {"t": "make a deal : 거래를 하다", "c": "g", "x": "make a deal은 ‘거래를 하다’라는 뜻의 숙어이다. 할머니가 아프게 되자 소녀가 호랑이와 거래를 한다는 장면이다. with the tiger가 거래 상대(호랑이와)를 나타낸다. makes는 make의 3인칭 단수 현재형이다.", "n": ["make a deal (with ~) = (~와) 거래를 하다"], "q": "the girl makes a deal with the tiger는 무슨 뜻인가?", "a": "그 소녀는 그 호랑이와 거래를 한다.", "p": "makes a deal with the tiger"}, {"t": "inspiration · award-winning : 영감 · 상을 받은", "c": "g", "x": "inspiration은 ‘영감’이라는 뜻의 명사이다. 동사 inspire에 -ation이 붙은 모양이며 e가 빠진다(inspir(e) + -ation). award-winning은 ‘상을 받은, 수상한’이라는 뜻의 형용사이고, award-winning book은 ‘수상 도서’이다. Keller’s inspiration for her award-winning book은 ‘Keller의 수상 도서에 영감을 준 것’이라는 뜻이다.", "n": ["inspire + -ation = inspiration (영감)", "award-winning = 상을 받은, 수상한"], "q": "inspiration은 어떤 동사에 무엇이 붙은 말인가? award-winning book은 무슨 뜻인가?", "a": "inspire + -ation (e 탈락). award-winning book = 수상 도서", "p": "inspiration for her award-winning book"}, {"t": "목적격 관계대명사 that : 선행사 an old folktale", "c": "k", "x": "an old folktale that her halmoni used to tell her에서 that은 앞의 an old folktale을 꾸미는 관계대명사이다. that 뒤에 her halmoni(주어)와 used to tell(동사)이 이어지고, tell의 목적어(이야기)가 비어 있다. 그 빈자리를 that이 채우는 목적격이다. ‘할머니가 그녀에게 이야기해 주던 옛 설화’라고 해석한다.", "n": ["선행사 + that + 주어 + 동사 (목적어 없음) = ~가 …하는 (선행사)", "목적격 관계대명사는 생략 가능"], "q": "an old folktale that her halmoni used to tell her에서 that 뒤에 빠져 있는 문장 성분은?", "a": "tell의 목적어(이야기). that이 그 자리를 대신하는 목적격 관계대명사이다.", "p": "that her halmoni (grandmother) used to tell her"}, {"t": "used to + 동사원형 : ~하곤 했다", "c": "k", "x": "used to tell은 ‘이야기해 주곤 했다’라는 뜻의 준조동사 표현이다. used to 뒤에는 동사원형이 오고 과거의 습관이나 반복된 일을 나타낸다. 지금은 하지 않는다는 느낌이 있다. (be used to + -ing는 ‘~에 익숙하다’라는 다른 뜻이다.)", "n": ["used to + 동사원형 = ~하곤 했다 (과거의 습관)", "be used to + -ing = ~에 익숙하다"], "q": "her halmoni used to tell her의 used to는 무슨 뜻이고 뒤에 어떤 형태가 오는가?", "a": "‘~하곤 했다’. 동사원형(tell)이 온다.", "p": "used to tell"}, {"t": "수동태 is called : ~라고 불린다", "c": "b", "x": "It is called “The Sun and the Moon”은 be동사 + 과거분사(p.p.)로 이루어진 수동태이다. ‘그것은 ‘해님 달님’이라고 불린다’라는 뜻이다. 능동태로 바꾸면 사람들이 it을 “The Sun and the Moon”이라고 부른다(call A B)는 구조이다. called는 call의 과거분사이다.", "n": ["be called + 보어 = ~라고 불리다 (수동태)", "call A B = A를 B라고 부르다"], "q": "It is called “The Sun and the Moon”은 어떤 태이고 무슨 뜻인가?", "a": "수동태(be + p.p.). ‘그것은 ‘해님 달님’이라고 불린다.’", "p": "is called “The Sun and the Moon,”"}, {"t": "It = 옛 설화 ‘해님 달님’", "c": "o", "x": "It is called ...의 It은 바로 앞 문장의 an old folktale(옛 설화)을 가리킨다. 그래서 ‘그 옛 설화는 ‘해님 달님’이라고 불린다’라는 뜻이다. 책이 아니라 할머니가 들려주던 이야기를 말한다.", "n": ["It = an old folktale (옛 설화)"], "q": "It is called “The Sun and the Moon,”의 It은 무엇을 가리키는가?", "a": "할머니가 이야기해 주던 옛 설화(an old folktale)", "p": "It"}, {"t": "want + to부정사 : ~하고 싶어 하다", "c": "b", "x": "wanted to revive는 ‘되살리고 싶어 했다’라는 뜻이다. want는 목적어로 to부정사를 취해서 want + to + 동사원형 모양으로 쓴다. wanted는 want의 과거형이다. revive는 ‘되살리다, 부활시키다’라는 뜻의 동사이다.", "n": ["want + to V = ~하고 싶어 하다", "revive = 되살리다, 부활시키다"], "q": "Keller wanted to revive ...의 wanted to revive는 무슨 뜻인가? want 뒤에는 어떤 형태가 오는가?", "a": "‘되살리고 싶어 했다’. to부정사(to + 동사원형)가 온다.", "p": "wanted to revive"}, {"t": "by + -ing : ~함으로써", "c": "k", "x": "by writing her own book은 ‘자신의 책을 씀으로써’라는 뜻이다. by는 전치사라서 뒤에 동명사(-ing)가 오고 방법이나 수단을 나타낸다. Keller가 호랑이에 대한 흥미를 되살리려는 방법이 책을 쓰는 것이다.", "n": ["by + -ing = ~함으로써 (수단·방법)", "전치사 뒤에는 동명사"], "q": "by writing her own book은 무슨 뜻이고 by 뒤에 -ing를 쓰는 이유는?", "a": "‘자신의 책을 씀으로써’. by가 전치사라서 동명사가 온다.", "p": "by writing her own book"}]}, {"no": 2, "id": "z2", "sents": [{"n": 8, "mk": "How is the tiger [1|related to] Korean culture?", "en": "How is the tiger related to Korean culture?", "ko": "호랑이는 한국의 문화와 어떻게 연관되는가?"}, {"n": 9, "mk": "Long ago, tigers were [2|so abundant in Korea that] people often [3|called the country the “Land of Tigers.”]", "en": "Long ago, tigers were so abundant in Korea that people often called the country the “Land of Tigers.”", "ko": "오래전, 한국에는 호랑이가 매우 많아서 사람들은 종종 그 나라를 ‘호랑이의 땅’이라고 불렀다."}, {"n": 10, "mk": "[4|It is estimated that] tigers lived in Korea for at least 100,000 years.", "en": "It is estimated that tigers lived in Korea for at least 100,000 years.", "ko": "호랑이는 한국에 적어도 십만 년을 살았다고 추정된다."}, {"n": 11, "mk": "The first appearance of a tiger in Korean culture [5|dates back to] the rock art of the Bronze Age.", "en": "The first appearance of a tiger in Korean culture dates back to the rock art of the Bronze Age.", "ko": "한국 문화에서 호랑이의 첫 번째 등장은 청동기 시대의 바위 그림으로 거슬러 올라간다."}, {"n": 12, "mk": "[6|It] depicts [7|people hunting various animals], including tigers.", "en": "It depicts people hunting various animals, including tigers.", "ko": "그것은 호랑이를 포함하여 다양한 동물을 사냥하는 사람들을 묘사한다."}, {"n": 13, "mk": "Since then, tigers [8|have appeared] in many aspects of Korean culture, from legends to art and musical instruments.", "en": "Since then, tigers have appeared in many aspects of Korean culture, from legends to art and musical instruments.", "ko": "그때부터, 호랑이는 전설에서부터 미술과 악기에 이르기까지 한국 문화의 많은 측면에 등장해 왔다."}, {"n": 14, "mk": "Some of you [9|may have heard] Korean folktales [7|featuring tigers].", "en": "Some of you may have heard Korean folktales featuring tigers.", "ko": "여러분 중 일부는 호랑이가 등장하는 한국 설화를 들어 봤을지도 모른다."}, {"n": 15, "mk": "In fact, approximately [10|forty percent of Korean folktales about animals include] a tiger.", "en": "In fact, approximately forty percent of Korean folktales about animals include a tiger.", "ko": "사실, 동물에 대한 한국 설화의 약 40%가 호랑이를 포함한다."}, {"n": 16, "mk": "Tigers in Korean folktales [11|are sometimes shown] [12|in a positive light] and sometimes as foolish creatures.", "en": "Tigers in Korean folktales are sometimes shown in a positive light and sometimes as foolish creatures.", "ko": "한국 설화에서 호랑이는 때로는 긍정적인 시각, 그리고 때로는 어리석은 존재로 보여진다."}, {"n": 17, "mk": "For example, in one story, a tiger [13|helps a human become rich] [14|after the human saves] the tiger’s life.", "en": "For example, in one story, a tiger helps a human become rich after the human saves the tiger’s life.", "ko": "예를 들어, 한 이야기에서, 호랑이는 한 인간이 그 호랑이의 생명을 구해 준 이후 그가 부유해지도록 돕는다."}], "items": [{"t": "be related to ~ : ~와 관계가 있다", "c": "g", "x": "be related to ~는 ‘~와 관계가 있다’라는 숙어이다. 본문의 How is the tiger related to Korean culture?는 호랑이가 한국 문화와 어떤 관계가 있는지 묻는다. related는 동사 relate(관련시키다)의 과거분사이고, 여기서는 ‘관련된’이라는 뜻으로 쓰였다.", "n": ["be related to ~ = ~와 관계가 있다"], "q": "‘호랑이는 한국 문화와 관계가 있다’를 영어로 쓰면 The tiger is ___ ___ Korean culture.", "a": "related to", "p": "related to"}, {"t": "so + 형용사/부사 ~ that … : 매우 ~해서 …하다", "c": "k", "x": "so abundant in Korea that people often called ...에서 so abundant ~ that …은 ‘매우 많아서 …했다’라는 결과를 나타낸다. so 뒤에는 형용사 abundant(풍부한)가 왔고, that 뒤에는 주어와 동사가 있는 절이 이어진다. 그래서 ‘호랑이가 매우 많아서 사람들이 그 나라를 호랑이의 땅이라고 불렀다’로 해석한다.", "n": ["so + 형용사/부사 + (that) + S + V = 매우 ~해서 …하다", "such + (a/an) + 형용사 + 명사 + (that) + S + V = 대단한 ~여서 …하다"], "q": "so abundant ~ that …은 어떻게 해석하는가?", "a": "매우 많아서 …하다", "p": "so abundant in Korea that"}, {"t": "call A B : A를 B라고 부르다", "c": "b", "x": "called the country the “Land of Tigers.”는 call A B 구조이다. A에 해당하는 the country가 목적어이고, B에 해당하는 the “Land of Tigers.”가 목적격 보어로서 ‘그 나라를 호랑이의 땅이라고 불렀다’는 뜻이 된다. 이처럼 call은 5형식 동사로 쓸 수 있고, 여기서 called는 call의 과거형이다.", "n": ["call + 목적어(A) + 목적격 보어(B) = A를 B라고 부르다"], "q": "called the country the “Land of Tigers.”에서 목적어와 목적격 보어는 각각 무엇인가?", "a": "목적어: the country, 목적격 보어: the “Land of Tigers.”", "p": "called the country the “Land of Tigers.”"}, {"t": "It is estimated that ~ : ~라고 추정된다 (가주어-진주어 & 수동태)", "c": "k", "x": "It is estimated that tigers lived in Korea ...에서 It은 가주어이고, 실제 주어(진주어)는 that tigers lived in Korea ...라는 that절이다. is estimated는 ‘추정되다’라는 수동태이다. 그래서 ‘호랑이가 한국에 살았다고 추정된다’로 해석한다.", "n": ["It + be + p.p. + that + 주어 + 동사 = ~라고 …된다", "It = 가주어, that절 = 진주어"], "q": "It is estimated that ~에서 진짜 주어(진주어)는 무엇인가?", "a": "that tigers lived in Korea for at least 100,000 years 들어 봤을지도 모른다", "p": "may have heard"}, {"t": "~ percent of … + 복수 명사 : 동사의 수일치", "c": "b", "x": "forty percent of Korean folktales about animals include a tiger에서 동사는 percent가 아니라 of 뒤의 명사에 수를 맞춘다. of 뒤의 Korean folktales가 복수이므로 복수 동사 include를 쓴다. 단수 명사가 오면 단수 동사(includes)를 쓴다.", "n": ["~ percent of + 복수 명사 + 복수 동사", "~ percent of + 단수/불가산 명사 + 단수 동사"], "q": "approximately forty percent of Korean folktales ... include에서 동사가 include인 이유는?", "a": "of 뒤의 folktales가 복수이기 때문에", "p": "forty percent of Korean folktales about animals include"}, {"t": "are shown : 수동태 (be + p.p.)", "c": "b", "x": "Tigers ... are sometimes shown in a positive light에서 호랑이는 ‘보여지는’ 대상이므로 are shown(be + p.p.)의 수동태를 쓴다. 누가 보여 주는지는 중요하지 않아서 행위자(by ~)를 쓰지 않았다. sometimes는 ‘때로는’이라는 뜻의 빈도 부사이다.", "n": ["be + p.p. = ~되다, ~지다 (수동태)", "주어가 동작을 받는 대상일 때 사용"], "q": "Tigers ... are sometimes shown에서 수동태가 쓰인 이유는?", "a": "호랑이가 ‘보여 주는’ 쪽이 아니라 ‘보여지는’ 대상이기 때문에", "p": "are sometimes shown"}, {"t": "in a ~ light : ~한 관점으로", "c": "g", "x": "in a positive light는 ‘긍정적인 관점으로’라는 뜻이다. positive(긍정적인) 자리에 다른 형용사를 넣어 in a negative light(부정적인 관점으로)처럼 쓸 수 있다. 여기서는 호랑이가 때로는 좋은 모습으로 그려진다는 뜻이다.", "n": ["in a positive light = 긍정적인 관점으로", "in a ~ light = ~한 관점으로"], "q": "in a positive light는 무슨 뜻인가?", "a": "긍정적인 관점으로", "p": "in a positive light"}, {"t": "help + 목적어 + 동사원형 : ~가 …하도록 돕다 / become + 형용사", "c": "b", "x": "helps a human become rich는 help + 목적어(a human) + 목적격 보어(become rich)의 5형식 구조이다. help의 목적격 보어로는 동사원형 become이 왔고, ‘한 인간이 부유해지도록 돕는다’는 뜻이다. become + 형용사는 ‘~해지다’라는 뜻이다. helps는 주어 a tiger가 3인칭 단수라서 s가 붙었다.", "n": ["help + 목적어 + 동사원형 = ~가 …하도록 돕다", "become + 형용사 = ~해지다"], "q": "a tiger helps a human become rich에서 목적어와 목적격 보어는 각각 무엇인가?", "a": "목적어: a human, 목적격 보어: become rich", "p": "helps a human become rich"}, {"t": "접속사 after + 절 : ~한 후에", "c": "b", "x": "after the human saves the tiger’s life에서 after는 접속사로서 뒤에 주어(the human)와 동사(saves)가 있는 절이 온다. ‘그 인간이 호랑이의 생명을 구한 후에’라는 뜻이다. saves는 주어 the human이 3인칭 단수라서 s가 붙은 형태이다.", "n": ["after + 주어 + 동사 = ~한 후에"], "q": "after the human saves the tiger’s life에서 after 뒤에는 어떤 모양이 왔는가?", "a": "주어 + 동사가 있는 절 (the human saves ...)", "p": "after the human saves the tiger’s life"}]}, {"no": 3, "id": "z3", "sents": [{"n": 18, "mk": "In another story, a tiger hears a mother tell her crying baby, “Don’t cry. Here’s a gotgam.”", "en": "In another story, a tiger hears a mother tell her crying baby, “Don’t cry. Here’s a gotgam.”", "ko": "또 다른 이야기에서, 호랑이는 한 어머니가 울고 있는 자신의 아기에게 “울지 마. 여기 곶감이 있단다.”라고 말하는 것을 듣는다."}, {"n": 19, "mk": "[5|Because] the baby [4|stops crying], the tiger mistakenly thinks the gotgam is a very scary creature and [1|runs away].", "en": "Because the baby stops crying, the tiger mistakenly thinks the gotgam is a very scary creature and runs away.", "ko": "그 아기가 울기를 멈추기 때문에, 호랑이는 그 곶감이 매우 무서운 생명체라고 잘못 생각하고 달아난다."}, {"n": 20, "mk": "[6|It seems that] people at the time had [2|conflicting] feelings about tigers.", "en": "It seems that people at the time had conflicting feelings about tigers.", "ko": "그 당시 사람들은 호랑이에 대해 상충되는 감정을 지니고 있었던 것으로 보인다."}, {"n": 21, "mk": "They had respect for tigers’ power and courage.", "en": "They had respect for tigers’ power and courage.", "ko": "그들은 호랑이의 힘과 용기에 대한 존경심이 있었다."}, {"n": 22, "mk": "However, they were also [3|scared of] tigers [5|because] [7|being injured or even killed by tigers] was common in the past.", "en": "However, they were also scared of tigers because being injured or even killed by tigers was common in the past.", "ko": "그러나, 과거에는 호랑이에게 상처를 입거나 심지어 죽임을 당하는 일이 흔했기 때문에 그들은 호랑이를 무서워하기도 했다."}, {"n": 23, "mk": "They [8|may have made] tigers into foolish characters [9|in order to] be less scared of them.", "en": "They may have made tigers into foolish characters in order to be less scared of them.", "ko": "그들은 호랑이를 덜 무서워하기 위해 호랑이를 어리석은 캐릭터로 만들었을지도 모른다."}, {"n": 24, "mk": "Tigers in Korea faced a decline in population [10|due to] hunting during the Joseon period and nearly went extinct during the Japanese colonial era.", "en": "Tigers in Korea faced a decline in population due to hunting during the Joseon period and nearly went extinct during the Japanese colonial era.", "ko": "한국의 호랑이들은 조선 시대 동안 사냥 때문에 개체 수 감소에 직면했고, 일제 강점기 동안 거의 멸종에 이르렀다."}, {"n": 25, "mk": "With the disappearance of tigers in Korea, [14|their] use [11|as] a symbol of the nation faded away.", "en": "With the disappearance of tigers in Korea, their use as a symbol of the nation faded away.", "ko": "한국에서 호랑이가 사라지면서, 국가의 상징으로서의 그들의 용도도 희미해졌다."}, {"n": 26, "mk": "However, [14|their] symbolism was revived in modern times through [14|their] selection [11|as] the mascot for both Olympics hosted by Korea.", "en": "However, their symbolism was revived in modern times through their selection as the mascot for both Olympics hosted by Korea.", "ko": "그러나, 한국에서 열린 두 올림픽의 마스코트로 선정되면서 그들의 상징성이 현대에 되살아났다."}, {"n": 27, "mk": "Hodori was the mascot for the Seoul Summer Olympics in 1988.", "en": "Hodori was the mascot for the Seoul Summer Olympics in 1988.", "ko": "호돌이는 1988년 서울 하계 올림픽의 마스코트였다."}, {"n": 28, "mk": "It was a Siberian tiger, [12|which] represents courage.", "en": "It was a Siberian tiger, which represents courage.", "ko": "그것은 시베리안 호랑이였는데, 그들은 용기를 상징한다."}, {"n": 29, "mk": "The PyeongChang Winter Olympics in 2018 created Soohorang, a white tiger, [11|as] its mascot.", "en": "The PyeongChang Winter Olympics in 2018 created Soohorang, a white tiger, as its mascot.", "ko": "2018년 평창 동계 올림픽은 백호인 수호랑을 그것의 마스코트로 만들었다."}, {"n": 30, "mk": "White tigers [13|are considered sacred guardians].", "en": "White tigers are considered sacred guardians.", "ko": "백호는 신성한 수호자로 여겨진다."}], "items": [{"t": "run away : 도망치다", "c": "g", "x": "runs away는 run away(도망치다)의 3인칭 단수 현재형이다. 호랑이가 곶감을 무서운 생명체라고 착각하고 도망가는 장면에서 쓰였다. 주어 the tiger가 단수라서 runs로 s가 붙었다.", "n": ["run away = 도망치다", "주어가 3인칭 단수면 runs away"], "q": "the tiger ... runs away에서 runs away의 뜻과 s가 붙은 이유는?", "a": "도망치다 / 주어 the tiger가 3인칭 단수라서", "p": "runs away"}, {"t": "conflicting : 모순되는, 상충되는", "c": "g", "x": "conflicting feelings는 서로 부딪치는 감정이라는 뜻이다. 사람들이 호랑이를 존경하면서 동시에 무서워했다는 내용과 이어진다. conflict(충돌하다)에서 나온 형용사이며 뒤의 명사 feelings를 꾸민다.", "n": ["conflicting a. = 모순되는, 상충되는", "conflicting feelings = 상충되는 감정"], "q": "conflicting feelings about tigers는 어떤 감정을 뜻하는가?", "a": "호랑이에 대한 존경과 두려움처럼 서로 상충되는 감정", "p": "conflicting feelings"}, {"t": "be scared of ~ : ~을 무서워하다", "c": "g", "x": "were also scared of tigers는 be scared of(~을 무서워하다)가 과거형 were로 쓰인 것이다. of 뒤에 무서워하는 대상(tigers)이 온다. 시제는 be동사 were로 나타낸다.", "n": ["be scared of ~ = ~을 무서워하다", "무서워하는 대상은 of 뒤에 쓴다"], "q": "they were also scared of tigers에서 무서워하는 대상은 무엇이고 어디에 쓰였는가?", "a": "tigers / of 뒤", "p": "scared of"}, {"t": "stop + -ing : ~하는 것을 멈추다", "c": "b", "x": "the baby stops crying에서 stops crying은 ‘우는 것을 멈추다’라는 뜻이다. stop 뒤에 동명사(crying)가 오면 하던 행동을 멈춘다는 의미이다. stop 뒤에 to부정사가 오면 ‘~하기 위해 멈추다’로 뜻이 달라지니 구별해야 한다.", "n": ["stop + -ing = ~하는 것을 멈추다", "stop + to부정사 = ~하기 위해 멈추다"], "q": "the baby stops crying은 무슨 뜻인가?", "a": "아기가 우는 것을 멈춘다", "p": "stops crying"}, {"t": "접속사 because + 절 : ~ 때문에", "c": "b", "x": "because는 접속사라서 뒤에 주어와 동사가 있는 절이 온다. Because the baby stops crying은 호랑이가 도망가는 이유를 말한다. 두 번째 문장에서도 because 뒤에 being injured ... was common이라는 절이 이어진다.", "n": ["because + 주어 + 동사 = ~ 때문에", "because of / due to + 명사(구) = ~ 때문에"], "q": "because 뒤에는 어떤 모양이 오는가?", "a": "주어 + 동사가 있는 절", "p": "Because"}, {"t": "it seems that ~ : ~인 것 같다, ~로 보인다", "c": "k", "x": "It seems that people ... had conflicting feelings에서 It은 뜻이 없는 형식상의 주어이고, 진짜 내용은 that 이하의 절이다. ‘그 당시 사람들이 상충되는 감정을 지니고 있었던 것으로 보인다’라는 추측을 나타낸다. that은 생략되어도 된다.", "n": ["It seems (that) + 완전한 절 = ~인 것 같다", "seem은 말하는 사람의 판단을 나타냄"], "q": "It seems that people ... had conflicting feelings의 뜻은?", "a": "그 당시 사람들이 상충되는 감정을 지니고 있었던 것으로 보인다", "p": "It seems that"}, {"t": "동명사 주어 (수동형) : being + p.p. ~ was", "c": "k", "x": "being injured or even killed by tigers가 문장에서 주어 역할을 하는 동명사구이다. ‘호랑이에게 상처를 입거나 죽임을 당하는 것’이라는 수동의 뜻이라 being + p.p.를 썼다. 동명사구 주어는 단수로 받기 때문에 동사도 was이다. injured와 killed는 or로 병렬 연결되어 있다.", "n": ["동명사 주어는 단수 취급 → 단수 동사", "수동형 동명사 = being + p.p."], "q": "being injured or even killed by tigers 뒤에 was가 온 이유는?", "a": "동명사구 주어는 단수로 취급하기 때문", "p": "being injured or even killed by tigers"}, {"t": "may have p.p. : ~했을지도 모른다", "c": "k", "x": "They may have made tigers into foolish characters는 may have p.p.로 과거 일에 대한 추측을 나타낸다. 사람들이 호랑이를 어리석은 캐릭터로 만들었을지도 모른다는 뜻이다. may 뒤에는 동사원형 have가 오고, made는 make의 과거분사이다.", "n": ["may have p.p. = ~했을지도 모른다 (과거에 대한 추측)", "may + 동사원형 = ~일지도 모른다 (현재·미래 추측)"], "q": "They may have made는 무슨 뜻인가?", "a": "그들이 만들었을지도 모른다 (과거에 대한 추측)", "p": "may have made"}, {"t": "in order to + 동사원형 : ~하기 위해", "c": "b", "x": "in order to be less scared of them은 ‘그들을 덜 무서워하기 위해’라는 목적을 나타낸다. in order to 뒤에는 동사원형 be가 온다. 사람들이 호랑이를 어리석은 캐릭터로 만들었을지도 모르는 이유(목적)가 바로 이 부분이다.", "n": ["in order to + 동사원형 = ~하기 위해 (목적)", "to부정사만 써도 목적의 뜻이 됨"], "q": "in order to be less scared of them의 뜻은?", "a": "그들을 덜 무서워하기 위해", "p": "in order to"}, {"t": "due to + 명사(구) : ~ 때문에", "c": "b", "x": "due to hunting에서 due to는 두 단어가 합쳐져 전치사처럼 쓰이므로 뒤에 명사 상당어구(hunting)가 온다. ‘사냥 때문에’ 개체 수가 줄었다는 원인을 나타낸다. 절(주어 + 동사)을 이어야 하면 because를 쓴다.", "n": ["due to + 명사(구) = ~ 때문에", "because + 절 = ~ 때문에"], "q": "due to hunting에서 due to 뒤에 온 것은 무엇이고 뜻은?", "a": "명사(hunting) / ‘사냥 때문에’", "p": "due to"}, {"t": "전치사 as : ~로서", "c": "b", "x": "their use as a symbol of the nation에서 as는 ‘~로서’라는 뜻의 전치사이다. as 뒤에는 자격이나 역할을 나타내는 명사(a symbol)가 온다. selection as the mascot, as its mascot에서도 같은 뜻으로 쓰였다.", "n": ["as + 명사 = ~로서 (자격·역할)", "as가 접속사이면 뒤에 절이 옴"], "q": "selection as the mascot에서 as의 뜻은?", "a": "~로서 (자격·역할을 나타내는 전치사)", "p": "as"}, {"t": "계속적 용법의 관계대명사 : , which", "c": "k", "x": "It was a Siberian tiger, which represents courage에서 which 앞에 쉼표가 있다. which는 앞의 a Siberian tiger를 가리키며 ‘그런데 그것은 용기를 상징한다’처럼 덧붙여 설명한다. 선행사가 단수이므로 동사도 represents로 쓰였다.", "n": [", which = 그리고 그것은 ~ (선행사에 대한 추가 설명)", "관계대명사 뒤 동사는 선행사에 수일치"], "q": "which represents courage의 which는 aning of tigers] still [2|have a place among] modern Korean people.", "en": "However, the history, stories, and cultural meaning of tigers still have a place among modern Korean people.", "ko": "그러나, 호랑이의 역사, 이야기, 그리고 문화적 의미는 현대 한국 사람들 사이에 여전히 자리하고 있다."}, {"n": 36, "mk": "Who can [3|deny] [12|that the tiger is a symbol of Korea]?", "en": "Who can deny that the tiger is a symbol of Korea?", "ko": "호랑이가 한국의 상징이라는 점을 누가 부정할 수 있을까?"}, {"n": 37, "mk": "In 2021, the National Folk Museum of Korea published a book [13|that collects] all the stories about tigers in Korea.", "en": "In 2021, the National Folk Museum of Korea published a book that collects all the stories about tigers in Korea.", "ko": "2021년에, 국립 민속 박물관은 한국의 호랑이에 관한 모든 이야기를 모은 책을 출판했다."}, {"n": 38, "mk": "[14|How about looking] for tigers around you now?", "en": "How about looking for tigers around you now?", "ko": "이제 여러분 주변에서 호랑이를 찾아보는 것은 어떨까?"}], "items": [{"t": "draw attention : 관심을 끌다", "c": "g", "x": "draw attention은 ‘관심을 끌다’라는 뜻의 숙어이다. 본문의 drew는 draw의 과거형이다. The song drew worldwide attention은 그 노래가 전 세계의 관심을 끌었다는 뜻이다.", "n": ["draw (one’s) attention = 관심을 끌다", "draw - drew - drawn"], "q": "drew worldwide attention에서 drew는 어떤 동사의 어떤 형태인가?", "a": "draw(끌다)의 과거형", "p": "drew worldwide attention"}, {"t": "have a place among ~ : ~ 사이에 자리를 차지하다", "c": "g", "x": "have a place among ~는 ‘~ 사이에 자리를 차지하다’라는 뜻이다. 본문에서는 호랑이의 역사와 이야기가 현대 한국 사람들 사이에 여전히 자리하고 있다는 의미로 쓰였다. among 대신 in을 쓰기도 한다.", "n": ["have a place in/among ~ = ~에 자리를 차지하다"], "q": "still have a place among modern Korean people은 무슨 뜻인가?", "a": "현대 한국 사람들 사이에 여전히 자리하고 있다", "p": "have a place among modern Korean people"}, {"t": "deny : 부인하다, 부정하다", "c": "g", "x": "deny는 ‘부인하다, 부정하다’라는 뜻의 동사이다. Who can deny that ~?은 ‘누가 ~라는 것을 부정할 수 있겠는가?’라는 뜻이다. 반의어는 admit(인정하다)이다.", "n": ["deny = 부인하다, 부정하다 (반의어 admit)"], "q": "deny의 뜻은 무엇인가?", "a": "부인하다, 부정하다", "p": "deny"}, {"t": "수동태 : are mentioned (be동사 + p.p.)", "c": "b", "x": "Tigers are also mentioned에서 호랑이는 ‘언급하 function marks(mk,s,mode,only,sn){

  var out='',pos=0,re=/\[(\d+)\|([^\]]*)\]/g,m;
  while((m=re.exec(mk))){

    var i=+m[1],c=s.items[i-1].c,t=esc(m[2]);
    if(mode=='all')out+='<span class="hlk c-'+c+'" data-i="'+i+'" data-sn="'+sn+'">'+t+'</span>'+(c=='o'?'<sup class="rf c-o">(='+esc(refOf(s.items[i-1].t))+')</sup>':'');

    else if(mode=='item'&&i==only)out+='<span class="hl c-'+c+'">'+t+'</span>';

  var rv=e.target.closest('.rv');if(rv){rv.classList.toggle('open');return}
  var bk=e.target.closest('#bk');if(bk){try{if(history.length>1&&document.referrer&&document.referrer.indexOf(location.host)>=0){e.preventDefault();history.back()}}catch(x){}return}
  var d=e.target.closest('[data-dr]');if(d){S.drill=d.dataset.dr||null;render();return}
  var p=e.target.closest('[data-s]');if(p){S.sec=+p.dataset.s;render();return}
});
render();
</script></body></html>
