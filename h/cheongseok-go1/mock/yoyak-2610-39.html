var DATA={"meta": {"sch": "jusung-go1", "src": "common/sx-data-2610.js", "dir": "mock", "pidx": 14, "lesson": "26년 10월 39번", "title": "", "label": "", "page": "yoyak-2610-39"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "지구 표면의 몸은 [[constant|일정한]] 기압을 받지만, [[external|외부]] 압력이 [[internal|내부]] 압력과 [[balanced|균형을 이뤄]] 느끼지 못한다.", "en": ["The human body on the Earth's surface experiences constant air pressure equal to 16-18 tons per square meter of its body surface.", "However, this pressure is not felt because external pressure is balanced by internal pressure in the lungs and air cavities of the body."], "kos": ["지구 표면 위에서의 인체는 신체 표면 1제곱 미터당 16에서 18톤에 달하는 일정한 기압을 겪는다.", "하지만 이러한 압력은 외부 압력이 신체의 폐와 공기가 들어 있는 공간의 내부의 압력과 균형이 맞춰지기 때문에 느껴지지 않는다."]}, {"tag": "본문 3~5번", "ns": [3, 4, 5], "line": "물속에선 수압까지 더해진다. 그래서 주변 물과 [[equal|같은]] 압력으로 잠수부에게 공기를 [[supplied|공급한다]].", "en": ["During dives, in addition to atmospheric pressure, the pressure of the water also acts on the human body.", "When submerged underwater, to avoid feeling the pressure of the surrounding environment, it is necessary to maintain the condition of equal external and internal pressure.", "To achieve this, air or a breathing mixture is supplied to the diver under pressure equal to the pressure applied by the surrounding water."], "kos": ["잠수하는 동안에는 대기압 외에 물의 압력 또한 인체에 영향을 준다.", "물속에 잠겼을 때, 주변 환경의 압력을 느끼는 것을 피하기 위해 동일한 외부와 내부 압력 상태를 유지하는 것이 필요하다.", "이를 달성하기 위해 공기 또는 호흡용 혼합물이 주변의 물에 의해 가해지는 압력과 동일한 압력으로 잠수부에게 제공된다."]}, {"tag": "본문 6~8번", "ns": [6, 7, 8], "line": "수압은 깊이에 따라 [[increases|증가한다]]. 10미터 깊이에선 압력을 [[stabilize|맞추려고]] 2기압의 혼합물이 [[required|필요하다]].", "en": ["Water pressure increases proportionally with depth.", "It increases by 1 bar for every 10 meters.", "It follows that a diver at a depth of 10 meters experiences a pressure of 2 bar, and to stabilize pressure, the supply of a breathing mixture under a pressure of 2 atmospheres is required."], "kos": ["수압은 깊이에 비례하여 증가한다.", "그것은 10미터마다 1바씩 증가한다.", "당연히 10미터 깊이에 있는 잠수부는 2바의 압력을 겪고, 압력을 맞추기 위해서는 2기압의 호흡용 혼합물의 제공이 요구된다."]}], "story": [{"a": "constant", "form": "constant", "n": 1, "sq": 1, "sum": "under [[steady]] air pressure", "hook": "인체가 일정한 기압을 겪는다는 문장의 constant(일정한) → 요약문에서는 steady(일정한)로 바꿨어요.", "b": "steady", "k": "일정한 → 일정한", "en": "The human body on the Earth's surface experiences constant air pressure equal to 16-18 tons per square meter of its body surface.", "ko": "지구 표면 위에서의 인체는 신체 표면 1제곱 미터당 16에서 18톤에 달하는 일정한 기압을 겪는다."}, {"a": "external", "form": "external", "n": 2, "sq": 1, "sum": "the pressure [[outside]]", "hook": "외부 압력이 균형을 이룬다는 문장의 external(외부의) → 요약문에서는 outside(바깥의)로 바꿨어요.", "b": "outside", "k": "외부의 → 바깥의", "en": "However, this pressure is not felt because external pressure is balanced by internal pressure in the lungs and air cavities of the body.", "ko": "하지만 이러한 압력은 외부 압력이 신체의 폐와 공기가 들어 있는 공간의 내부의 압력과 균형이 맞춰지기 때문에 느껴지지 않는다."}, {"a": "balance", "form": "balanced", "n": 2, "sq": 1, "sum": "is [[matched]] by", "hook": "외부 압력이 내부 압력과 균형이 맞춰진다는 문장의 balance(균형을 맞추다) → 요약문에서는 match(맞추다)로 바꿨어요.", "b": "match", "k": "균형을 맞추다 → 맞추다", "en": "However, this pressure is not felt because external pressure is balanced by internal pressure in the lungs and air cavities of the body.", "ko": "하지만 이러한 압력은 외부 압력이 신체의 폐와 공기가 들어 있는 공간의 내부의 압력과 균형이 맞춰지기 때문에 느껴지지 않는다."}, {"a": "internal", "form": "internal", "n": 2, "sq": 1, "sum": "the pressure [[inside]] the body", "hook": "폐와 몸속 공간의 내부 압력이라는 문장의 internal(내부의) → 요약문에서는 inside(안쪽의)로 바꿨어요.", "b": "inside", "k": "내부의 → 안쪽의", "en": "However, this pressure is not felt because external pressure is balanced by internal pressure in the lungs and air cavities of the body.", "ko": "하지만 이러한 압력은 외부 압력이 신체의 폐와 공기가 들어 있는 공간의 내부의 압력과 균형이 맞춰지기 때문에 느껴지지 않는다."}, {"a": "supply", "form": "supplied", "n": 5, "sq": 2, "sum": "air is [[provided]] to them", "hook": "공기가 잠수부에게 공급된다는 문장의 supply(공급하다) → 요약문에서는 provide(제공하다)로 바꿨어요.", "b": "provide", "k": "공급하다 → 제공하다", "en": "To achieve this, air or a breathing mixture is supplied to the diver under pressure equal to the pressure applied by the surrounding water.", "ko": "이를 달성하기 위해 공기 또는 호흡용 혼합물이 주변의 물에 의해 가해지는 압력과 동일한 압력으로 잠수부에게 제공된다."}, {"a": "equal", "form": "equal", "n": 5, "sq": 2, "sum": "at a pressure [[identical]]", "hook": "주변 물의 압력과 같은 압력이라는 문장의 equal(같은) → 요약문에서는 identical(똑같은)로 바꿨어요.", "b": "identical", "k": "같은 → 똑같은", "en": "To achieve this, air or a breathing mixture is supplied to the diver under pressure equal to the pressure applied by the surrounding water.", "ko": "이를 달성하기 위해 공기 또는 호흡용 혼합물이 주변의 물에 의해 가해지는 압력과 동일한 압력으로 잠수부에게 제공된다."}, {"a": "increase", "form": "increases", "n": 6, "sq": 3, "sum": "will [[rise]] by 1 bar", "hook": "수압이 깊이에 비례해 증가한다는 문장의 increase(증가하다) → 요약문에서는 rise(오르다)로 바꿨어요.", "b": "rise", "k": "증가하다 → 오르다", "en": "Water pressure increases proportionally with depth.", "ko": "수압은 깊이에 비례하여 증가한다."}, {"a": "stabilize", "form": "stabilize", "n": 8, "sq": 3, "sum": "keep the pressure [[even]]", "hook": "압력을 맞추기 위해서라는 문장의 stabilize(안정시키다) → 요약문에서는 keep the pressure even(압력을 고르게 유지하다)으로 바꿨어요.", "b": "even", "k": "안정시키다 → 고른", "en": "It follows that a diver at a depth of 10 meters experiences a pressure of 2 bar, and to stabilize pressure, the supply of a breathing mixture under a pressure of 2 atmospheres is required.", "ko": "당연히 10미터 깊이에 있는 잠수부는 2바의 압력을 겪고, 압력을 맞추기 위해서는 2기압의 호흡용 혼합물의 제공이 요구된다."}, {"a": "require", "form": "required", "n": 8, "sq": 3, "sum": "a diver at 10 meters [[needs]]", "hook": "2기압의 혼합물 공급이 요구된다는 문장의 require(요구하다) → 요약문에서는 need(필요하다)로 바꿨어요.", "b": "need", "k": "요구하다 → 필요하다", "en": "It follows that a diver at a depth of 10 meters experiences a pressure of 2 bar, and to stabilize pressure, the supply of a breathing mixture under a pressure of 2 atmospheres is required.", "ko": "당연히 10미터 깊이에 있는 잠수부는 2바의 압력을 겪고, 압력을 맞추기 위해서는 2기압의 호흡용 혼합물의 제공이 요구된다."}], "passage": [{"n": 1, "en": "The human body on the Earth's surface experiences constant air pressure equal to 16-18 tons per square meter of its body surface.", "ko": "지구 표면 위에서의 인체는 신체 표면 1제곱 미터당 16에서 18톤에 달하는 일정한 기압을 겪는다."}, {"n": 2, "en": "However, this pressure is not felt because external pressure is balanced by internal pressure in the lungs and air cavities of the body.", "ko": "하지만 이러한 압력은 외부 압력이 신체의 폐와 공기가 들어 있는 공간의 내부의 압력과 균형이 맞춰지기 때문에 느껴지지 않는다."}, {"n": 3, "en": "During dives, in addition to atmospheric pressure, the pressure of the water also acts on the human body.", "ko": "잠수하는 동안에는 대기압 외에 물의 압력 또한 인체에 영향을 준다."}, {"n": 4, "en": "When submerged underwater, to avoid feeling the pressure of the surrounding environment, it is necessary to maintain the condition of equal external and internal pressure.", "ko": "물속에 잠겼을 때, 주변 환경의 압력을 느끼는 것을 피하기 위해 동일한 외부와 내부 압력 상태를 유지하는 것이 필요하다."}, {"n": 5, "en": "To achieve this, air or a breathing mixture is supplied to the diver under pressure equal to the pressure applied by the surrounding water.", "ko": "이를 달성하기 위해 공기 또는 호흡용 혼합물이 주변의 물에 의해 가해지는 압력과 동일한 압력으로 잠수부에게 제공된다."}, {"n": 6, "en": "Water pressure increases proportionally with depth.", "ko": "수압은 깊이에 비례하여 증가한다."}, {"n": 7, "en": "It increases by 1 bar for every 10 meters.", "ko": "그것은 10미터마다 1바씩 증가한다."}, {"n": 8, "en": "It follows that a diver at a depth of 10 meters experiences a pressure of 2 bar, and to stabilize pressure, the supply of a breathing mixture under a pressure of 2 atmospheres is required.", "ko": "당연히 10미터 깊이에 있는 잠수부는 2바의 압력을 겪고, 압력을 맞추기 위해서는 2기압의 호흡용 혼합물의 제공이 요구된다."}], "questions": [{"id": 1, "summary": "On the surface of the Earth, the human body is under (A) air pressure, but we do not feel it because the pressure outside is (B) by the pressure inside the body.", "ko": "지구 표면에서 인체는 <b>(A) 일정한</b> 기압을 받지만, 바깥 압력이 몸 안쪽 압력에 의해 <b>(B) 맞춰지기</b> 때문에 우리는 그것을 느끼지 못한다.", "opts": [["steady", "doubled"], ["changing", "matched"], ["changing", "doubled"], ["steady", "matched"], ["weak", "hidden"]], "optko": ["일정한 – 두 배가 된", "변하는 – 맞춰진", "변하는 – 두 배가 된", "일 function words(t){
  var out='',last=0,m;WRE.lastIndex=0;
  while((m=WRE.exec(t))){
    out+=esc(t.slice(last,m.index));
    var key=m[0].toLowerCase().replace(/’/g,"'");
    if(G[key]){out+='<span class="w'+(NOTES[G[key][0].toLowerCase()]?' got':'')+'" data-k="'+esc(key)+'">'+esc(m[0])+'</span>'}
    else out+=esc(m[0]);
    last=m.index+m[0].length;
  }
  return out+esc(t.slice(last));
}
function mk(t){return esc(t).replace(/\{\{([^|}]+)\|([^}]+)\}\}/g,function(m,e,k){return '<mark>'+e+'</mark>(<mark>'+k+'</mark>)'})}
function hlp(t){
  var o=esc(t);
  o=o.replace(/([A-Za-z][A-Za-z' ]*[A-Za-z])\(([가-힣][가-힣 ,·]*)\)/g,'<mark>$1</mark>(<mark>$2</mark>)');
  o=o.replace(/([가-힣]+)\(([A-Za-z][A-Za-z' ]*[A-Za-z])\)/g,'<mark>$1</mark>(<mark>$2</mark>)');
  return o;
}
function useEx(u){
  var re=new RegExp('\\b'+u.w+'\\w*','i');
  return u.ex.split(new RegExp('('+re.source+')','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('');
}
function richKo(t,hl){
  var pos=[];(hl||[]).forEach(function(h){var i=t.indexOf(h);if(i>=0)pos.push([i,i+h.length])});
  pos.sort(function(a,b){return a[0]-b[0]});
  var c=0,o='';
  pos.forEach(function(p){if(p[0]<c)return;o+=esc(t.slice(c,p[0]))+'<mark>'+esc(t.slice(p[0],p[1]))+'</mark>';c=p[1]});
  return o+esc(t.slice(c));
}
function rich(t,hl){
  if(!hl||!hl.length)return words(t);
  var pos=[];hl.forEach(function(h){var i=t.indexOf(h);if(i>=0)pos.push([i,i+h.length])});
  pos.sort(function(a,b){return a[0]-b[0]});
  var c=0,o='';
  pos.forEach(function(p){if(p[0]<c)return;o+=words(t.slice(c,p[0]))+'<mark>'+words(t.slice(p[0],p[1]))+'</mark>';c=p[1]});
  return o+words(t.slice(c));
}
function sumHtml(q,done){
  var o='';
  q.summary.split(/(\(A\)|\(B\))/).forEach(function(p){
    if(p==='(A)'||p==='(B)'){
      if(done)o+='<span class="fill">'+words(q.opts[q.ans][p==='(A)'?0:1])+'</span>';
      else o+='<span class="blank">'+p+'</span>';
    }else o+=words(p);
  });
  return o;
}
function nNotes(){return Object.keys(NOTES).length}
function firstOpen(){for(var i=0;i<Qs.length;i++)if(PR.a[Qs[i].id]===undefined)return i;return -1}
function doneCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]!==undefined)n++});return n}
function okCount(){var n=0;Qs.forEach(function(q){if(PR.a[q.id]===q.ans)n++});return n}
function hideSheet(){$('sheet').className=''}
var histPushed=false;

  hideSheet();window.__goTop=1;render();window.__goTop=0;window.scrollTo(0,0)
}

/* 단어 누르기: 뜻을 보여 주고 단어노트에 자동으로 담는다 */
function tapWord(key){
  var g=G[key];if(!g)return;
  var lem=g[0],id=lem.toLowerCase();
  var n=NOTES[id]||{l:lem,k:g[1],c:0,t:0};
  n.c=(n.c||0)+1;n.t=Date.now();n.q=curQ;NOTES[id]=n;jset(K_NOTE,NOTES);
  if(!PUSHED['w:'+id]){PUSHED['w:'+id]=1;jset('vhvs:'+SCH,PUSHED);try{WN.add([{w:lem,m:g[1],src:SRC,how:'탭',ask:true}])}catch(e){}}
  $('sw').textContent=key.toLowerCase()===id?lem:key+'  →  '+lem;
  $('sl').textContent=g[1];
  $('sn').textContent='단어노트에 담았어요 (지금 '+nNotes()+'개)';
  $('sheet').className='on';
  document.querySelectorAll('.w[data-k]').forEach(function(e){var gg=G[e.getAttribute('data-k')];if(gg&&gg[0].toLowerCase()===id)e.classList.add('got')});
}
document.addEventListener('click',function(e){
  var w=e.target.closest&&e.target.closest('.w');
  if(w){e.stopPropagation();tapWord(w.getAttribute('data-k'));return}
  if(!(e.target.closest&&e.target.closest('#sheet')))hideSheet();
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');
  else if(act==='q')go('q',+v);
  else if(act==='pick')pick(+v);
  else if(act==='rmnote'){var rid=String(v);var rn=NOTES[rid];delete NOTES[rid];jset(K_NOTE,NOTES);delete PUSHED['w:'+rid];jset('vhvs:'+SCH,PUSHED);try{WN.del(rn?rn.l:rid,SRC)}catch(x){}render()}
  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}

  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
