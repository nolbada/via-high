var DATA={"meta": {"sch": "jusung-go1", "src": "common/sx-data-2610.js", "dir": "mock", "pidx": 7, "lesson": "26년 10월 32번", "title": "", "label": "", "page": "yoyak-2610-32"}, "scenes": [{"tag": "본문 1~2번", "ns": [1, 2], "line": "사람들은 고객 센터에 전화하거나 사무실로 [[comes|찾아올]] 때, 누군가 자기 [[concerns|걱정]]을 듣고 [[address|해결해]] 주길 바란다.", "en": ["People, whether customers or otherwise, want to feel heard.", "When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them."], "kos": ["사람들은, 고객이든 그렇지 않든, 경청받고 있다고 느끼기를 원한다.", "누군가가 고객 서비스 센터에 전화를 하거나, 관리자와 이야기하기를 요청하거나, 마음에 어떤 생각을 품은 채 여러분의 사무실로 찾아올 때, 그들은 누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼 느끼기를 원한다."]}, {"tag": "본문 3~5번", "ns": [3, 4, 5], "line": "경청받는다고 느끼려면 세 가지가 필요하다. 상대가 주의를 기울였고, 내 말을 [[understood|이해했다고]] 느껴야 한다.", "en": ["But for someone to feel heard, three things have to happen.", "First, they have to feel like the other person paid attention to what they said.", "Second, they have to feel like the other person understood what they said."], "kos": ["그러나 누군가가 경청받고 있다고 느끼기 위해서는, 세 가지가 이루어져야 한다.", "첫째, 그들은 상대방이 자신들이 말한 것에 주의를 기울인 것처럼 느껴야 한다.", "둘째, 그들은 상대방이 자신들이 말한 것을 이해한 것처럼 느껴야 한다."]}, {"tag": "본문 6~7번", "ns": [6, 7], "line": "셋째, 상대가 들었다는 것을 [[demonstrate|보여 줘야]] 한다. 이 마지막 부분이 [[key|핵심]]이다.", "en": ["And third, the other person has to demonstrate that they listened.", "This last part is key."], "kos": ["그리고 셋째, 상대방은 자신이 귀를 기울였다는 것을 보여 줘야 한다.", "이 마지막 부분이 핵심이다."]}, {"tag": "본문 8~10번", "ns": [8, 9, 10], "line": "아무 반응이 없는 사람을 떠올려 보자. 다 듣고 다 이해했을지도 모른다.", "en": ["Imagine talking to someone who provided no response.", "They might have attended to everything we said.", "They might even have understood it completely."], "kos": ["아무런 반응도 보여 주지 않는 사람과 이야기한다고 상상해 보라.", "그들은 우리가 말한 모든 것에 주의를 기울였을지도 모른다.", "그들은 심지어 그것을 완전히 이해했을지도 모른다."]}, {"tag": "본문 11번", "ns": [11], "line": "하지만 [[outward|겉으로 드러나는]] [[signal|신호]]가 없으면 그가 [[actually|실제로]] 들었는지 알 수 없다.", "en": ["But without some sort of outward signal that indicates they listened, it's impossible to know whether or not they actually did."], "kos": ["그러나 그들이 귀를 기울였음을 보여 주는 어떤 종류의 외적인 신호가 없이는, 그들이 실제로 그렇게 했는지 아닌지를 아는 것은 불가능하다."]}], "story": [{"a": "come", "form": "comes", "n": 2, "sq": 1, "sum": "[[visit]] your office", "hook": "사무실로 찾아온다는 문장의 come(오다) → 요약문에서는 visit(방문하다)으로 바꿨어요.", "b": "visit", "k": "오다 → 방문하다", "en": "When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "ko": "누군가가 고객 서비스 센터에 전화를 하거나, 관리자와 이야기하기를 요청하거나, 마음에 어떤 생각을 품은 채 여러분의 사무실로 찾아올 때, 그들은 누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼 느끼기를 원한다."}, {"a": "concern", "form": "concerns", "n": 2, "sq": 1, "sum": "every [[worry]] they have", "hook": "자기 우려 사항을 들어 준다는 문장의 concern(우려 사항) → 요약문에서는 worry(걱정)로 바꿨어요.", "b": "worry", "k": "우려 사항 → 걱정", "en": "When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "ko": "누군가가 고객 서비스 센터에 전화를 하거나, 관리자와 이야기하기를 요청하거나, 마음에 어떤 생각을 품은 채 여러분의 사무실로 찾아올 때, 그들은 누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼 느끼기를 원한다."}, {"a": "address", "form": "address", "n": 2, "sq": 1, "sum": "will [[handle]] it", "hook": "그것을 해결해 줄 것처럼이라는 문장의 address(해결하다) → 요약문에서는 handle(해결하다)로 바꿨어요.", "b": "handle", "k": "해결하다 → 해결하다", "en": "When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "ko": "누군가가 고객 서비스 센터에 전화를 하거나, 관리자와 이야기하기를 요청하거나, 마음에 어떤 생각을 품은 채 여러분의 사무실로 찾아올 때, 그들은 누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼 느끼기를 원한다."}, {"a": "understand", "form": "understood", "n": 5, "sq": 2, "sum": "[[grasp]] what was said", "hook": "상대가 말한 것을 이해했다는 문장의 understood(이해했다, 기본형 understand) → 요약문에서는 grasp(이해하다)로 바꿨어요.", "b": "grasp", "k": "이해하다 → 이해하다", "en": "Second, they have to feel like the other person understood what they said.", "ko": "둘째, 그들은 상대방이 자신들이 말한 것을 이해한 것처럼 느껴야 한다."}, {"a": "demonstrate", "form": "demonstrate", "n": 6, "sq": 2, "sum": "[[show]] that they listened", "hook": "귀를 기울였다는 것을 보여 줘야 한다는 문장의 demonstrate(보여 주다) → 요약문에서는 show(보여 주다)로 바꿨어요.", "b": "show", "k": "보여 주다 → 보여 주다", "en": "And third, the other person has to demonstrate that they listened.", "ko": "그리고 셋째, 상대방은 자신이 귀를 기울였다는 것을 보여 줘야 한다."}, {"a": "key", "form": "key", "n": 7, "sq": 3, "sum": "the [[essential]] part", "hook": "이 마지막 부분이 핵심이라는 문장의 key(핵심적인) → 요약문에서는 essential(핵심적인)로 바꿨어요.", "b": "essential", "k": "핵심적인 → 핵심적인", "en": "This last part is key.", "ko": "이 마지막 부분이 핵심이다."}, {"a": "outward", "form": "outward", "n": 11, "sq": 3, "sum": "some [[visible]] sign", "hook": "외적인 신호가 없으면이라는 문장의 outward(외적인) → 요약문에서는 visible(눈에 보이는)로 바꿨어요.", "b": "visible", "k": "외적인 → 눈에 보이는", "en": "But without some sort of outward signal that indicates they listened, it's impossible to know whether or not they actually did.", "ko": "그러나 그들이 귀를 기울였음을 보여 주는 어떤 종류의 외적인 신호가 없이는, 그들이 실제로 그렇게 했는지 아닌지를 아는 것은 불가능하다."}, {"a": "signal", "form": "signal", "n": 11, "sq": 3, "sum": "visible [[sign]]", "hook": "들었음을 보여 주는 신호라는 문장의 signal(신호) → 요약문에서는 sign(표시)으로 바꿨어요.", "b": "sign", "k": "신호 → 신호, 표시", "en": "But without some sort of outward signal that indicates they listened, it's impossible to know whether or not they actually did.", "ko": "그러나 그들이 귀를 기울였음을 보여 주는 어떤 종류의 외적인 신호가 없이는, 그들이 실제로 그렇게 했는지 아닌지를 아는 것은 불가능하다."}, {"a": "actually", "form": "actually", "n": 11, "sq": 3, "sum": "whether you [[really]] listened", "hook": "실제로 그랬는지 알 수 없다는 문장의 actually(실제로) → 요약문에서는 really(정말로)로 바꿨어요.", "b": "really", "k": "실제로 → 정말로", "en": "But without some sort of outward signal that indicates they listened, it's impossible to know whether or not they actually did.", "ko": "그러나 그들이 귀를 기울였음을 보여 주는 어떤 종류의 외적인 신호가 없이는, 그들이 실제로 그렇게 했는지 아닌지를 아는 것은 불가능하다."}], "passage": [{"n": 1, "en": "People, whether customers or otherwise, want to feel heard.", "ko": "사람들은, 고객이든 그렇지 않든, 경청받고 있다고 느끼기를 원한다."}, {"n": 2, "en": "When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "ko": "누군가가 고객 서비스 센터에 전화를 하거나, 관리자와 이야기하기를 요청하거나, 마음에 어떤 생각을 품은 채 여러분의 사무실로 찾아올 때, 그들은 누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼 느끼기를 원한다."}, {"n": 3, "en": "But for someone to feel heard, three things have to happen.", "ko": "그러나 누군가가 경청받고 있다고 느끼기 위해서는, 세 가지가 이루어져야 한다."}, {"n": 4, "en": "First, they have to feel like the other person paid attention to what they said.", "ko": "첫째, 그들은 상대방이 자신들이 말한 것에 주의를 기울인 것처럼 느껴야 한다."}, {"n": 5, "en": "Second, they have to feel like the other person understood what they said.", "ko": "둘째, 그들은 상대방이 자신들이 말한 것을 이해한 것처럼 느껴야 한다."}, {"n": 6, "en": "And third, the other person has to demonstrate that they listened.", "ko": "그리고 셋째, 상대방은 자신이 귀를 기울였다는 것을 보여 줘야 한다."}, {"n": 7, "en": "This last part is key.", "ko": "이 마지막 부분이 핵심이다."}, {"n": 8, "en": "Imagine talking to someone who provided no response.", "ko": "아무런 반응도 보여 주지 않는 사람과 이야기한다고 상상해 보라."}, {"n": 9, "en": "They might have attended to everything we said.", "ko": "그들은 우리가 말한 모든 것에 주의를 기울였을지도 모른다."}, {"n": 10, "en": "They might even have understood it completely.", "ko": "그들은 심지어 그것을 완전히 이해했을지도 모른다."}, {"n": 11, "en": "But without some sort of outward signal that indicates they listened, it's impossible to know whether or not they actually did.", "ko": "그러나 그들이 귀를 기울였음을 보여 주는 어떤 종류의 외적인 신호가 없이는, 그들이 실제로 그렇게 했는지 아닌지를 아는 것은 불가능하다."}], "questions": [{"id": 1, "summary": "People want to feel heard, so when they call customer service or visit your office, they want to feel that someone is listening to every (A) they have and will (B) it.", "ko": "사람들은 경청받는다고 느끼고 싶어 해서, 고객 서비스 센터에 전화하거나 여러분의 사무실을 방문할 때 누군가가 자신이 가진 모든 <b>(A) 걱정</b>을 듣고 있고 그것을 <b>(B) 해결해</b> 줄 것이라고 느끼고 싶어 한다.", "opts": [["worry", "ignore"], ["joke", "handle"], ["worry", "handle"], ["joke", "ignore"], ["secret", "forget"]], "optko": ["걱정 – 무시하다", "농담 – 해결하다", "걱정 – 해결하다", "농담 – 무시하다", "비밀 – 잊다"], "ans": 2, "wrong": ["ignore(무시하다)가 틀려요. 본문은 사람들이 누군가가 자기 우려 사항을 해결해 줄(address) 것처럼 느끼고 싶어 한다고 해요.", "joke(농담)가 틀려요. 사람들이 들어 주길 바라는 것은 농담이 아니라 우려 사항(concerns)이에요.", null, "둘 다 틀려요. 들어 주길 바라는 것은 농담이 아니라 걱정이고, 그것을 무시하는 게 아니라 해결해 주길 바라요.", "둘 다 틀려요. 비밀(secret)이 아니라 걱정을 말하고, 잊어 주는(forget) 게 아니라 해결해 주길 바라요."], "evid": [{"n": 1, "hl": ["want to feel heard"]}, {"n": 2, "hl": ["someone is listening to their concerns and going to address them"]}], "swaps": [["come", "visit", "오다 → 방문하다"], ["concern", "worry", "우려 사항 → 걱정"], ["address", "handle", "해결하다 → 해결하다"]], "swapnote": "comes into your office(사무실로 찾아오다)는 visit your office(사무실을 방문하다)로, concern(우려 사항)은 worry(걱정)로, address(해결하다)는 handle(해결하다)로 바뀌었어요.", "use": [{"w": "worry", "ex": "Tell me your worry.", "ko": "네 걱정을 나에게 말해 봐.", "wk": "걱정(거리)", "hk": "걱정"}, {"w": "handle", "ex": "The manager will handle the problem.", "ko": "관리자가 그 문제를 해결할 것이다.", "wk": "처리하다, 해결하다", "hk": "해결할"}], "flow": "본문 1번에서 사람들은 고객이든 아니든 경청받는다고 느끼고 싶어 한다고 하고, 2번에서 고객 서비스에 전화하거나 사무실에 찾아올 때 누군가가 자기 걱정을 듣고 해결해 줄 것처럼 느끼고 싶어 한다고 해요.", "jd": [["People want to feel heard,", "사람들은 경청받는다고 느끼고 싶어 한다,"], ["so when they call customer service or visit your office,", "그래서 고객 서비스 센터에 전화하거나 여러분의 사무실을 방문할 때,"], ["they want to feel", "그들은 느끼고 싶어 한다"], ["that someone is listening to every [[worry]] they have", "누군가가 자신이 가진 모든 [[걱정]]을 듣고 있고"], ["and will [[handle]] it.", "그것을 [[해결해]] 줄 것이라고."]], "fc": [["본문 1번", "누구나 들어 주길 원한다", "사람들은 고객이든 아니든 {{heard|경청받는다고}} 느끼고 싶어 해요."], ["본문 2번", "걱정을 듣고 해결해 주길", "누군가가 자기 {{concern|우려 사항}}을 듣고 {{address|해결해}} 줄 것처럼 느끼고 싶어 해요."], ["정답 포인트", "{{concern|우려 사항}} = {{worry|걱정}}, {{address|해결하다}} = {{handle|해결하다}}", "본문 단어가 쉬운 말로 바뀌어 나와요."]], "evid_full": [{"en": "People, whether customers or otherwise, want to feel heard.", "ko": "사람들은, 고객이든 그렇지 않든, 경청받고 있다고 느끼기를 원한다.", "hl": ["want to feel heard"], "hlko": ["경청받고 있다고 느끼기를 원한다"], "n": 1}, {"en": "When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "ko": "누군가가 고객 서비스 센터에 전화를 하거나, 관리자와 이야기하기를 요청하거나, 마음에 어떤 생각을 품은 채 여러분의 사무실로 찾아올 때, 그들은 누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼 느끼기를 원한다.", "hl": ["someone is listening to their concerns and going to address them"], "hlko": ["누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼"], "n": 2}]}, {"id": 2, "summary": "To make someone feel heard, the listener must pay attention, (A) what was said, and (B) that they listened.", "ko": "누군가가 경청받는다고 느끼게 하려면, 듣는 사람은 주의를 기울이고, 들은 말을 <b>(A) 이해하고</b>, 자신이 귀를 기울였다는 것을 <b>(B) 보여 줘야</b> 한다.", "opts": [["grasp", "show"], ["grasp", "hide"], ["forget", "show"], ["forget", "hide"], ["ignore", "deny"]], "optko": ["이해하다 – 보여 주다", "이해하다 – 숨기다", "잊다 – 보여 주다", "잊다 – 숨기다", "무시하다 – 부인하다"], "ans": 0, "wrong": [null, "hide(숨기다)가 틀려요. 세 번째 조건은 상대방이 자신이 귀를 기울였다는 것을 보여 주는(demonstrate) 거예요.", "forget(잊다)이 틀려요. 두 번째 조건은 상대방이 말한 것을 이해했다(understood)고 느끼는 거예요.", "둘 다 틀려요. 들은 말을 잊는 게 아니라 이해해야 하고, 들었다는 것을 숨기는 게 아니라 보여 줘야 해요.", "둘 다 틀려요. 들은 말을 무시하는(ignore) 게 아니라 이해해야 하고, 들었다는 것을 부인하는(deny) 게 아니라 보여 줘야 해요."], "evid": [{"n": 3, "hl": ["three things have to happen"]}, {"n": 4, "hl": ["the other person paid attention to what they said"]}, {"n": 5, "hl": ["the other person understood what they said"]}, {"n": 6, "hl": ["the other person has to demonstrate that they listened"]}], "swaps": [["understand", "grasp", "이해하다 → 이해하다"], ["demonstrate", "show", "보여 주다 → 보여 주다"]], "swapnote": "understood(이해했다, 기본형 understand)는 grasp(이해하다)로, demonstrate(보여 주다)는 show(보여 주다)로 바뀌었어요. 세 가지 조건을 순서대로 읽으면 주의 기울이기, 이해하   var a=e.target.closest&&e.target.closest('[data-a]');
  if(!a)return;
  var act=a.getAttribute('data-a'),v=a.getAttribute('data-v');
  if(act==='home')go('home');
  else if(act==='q')go('q',+v);
  else if(act==='pick')pick(+v);
  else if(act==='rmnote'){var rid=String(v);var rn=NOTES[rid];delete NOTES[rid];jset(K_NOTE,NOTES);delete PUSHED['w:'+rid];jset('vhvs:'+SCH,PUSHED);try{WN.del(rn?rn.l:rid,SRC)}catch(x){}render()}
  else if(act==='next'){if(cur<Qs.length-1)go('q',cur+1);else go('res')}
  else if(act==='res')go('res');
  else if(act==='notes')go('notes');
  else if(act==='resume'){var f=firstOpen();if(f<0)go('res');else go('q',f)}
  else if(act==='reset'){PR={a:{}};jset(K_PROG,PR);go('home')}
  else if(act==='filt'){filt=v;render()}
  else if(act==='chk'){go('chk')}
  else if(act==='sw'){go('sw')}
  else if(act==='rvall'){var o=v==='open';swList().forEach(function(s){if(o){swOpen[s.id]=true;pushSw(s.id)}else delete swOpen[s.id]});render()}
  else if(act==='dt'){swD[v]=!swD[v];render()}
  else if(act==='rv'){swOpen[v]=!swOpen[v];if(swOpen[v])pushSw(v);render()}
  else if(act==='mean'){var m=document.getElementById('m_'+v);if(m)m.style.display=m.style.display==='block'?'none':'block'}
});
function pick(i){
  var q=Qs[cur];if(PR.a[q.id]!==undefined)return;
  PR.a[q.id]=i;jset(K_PROG,PR);recordYy(q,i);render();
}
/* 점수 기록: vhy:<학교> = {<페이지>:{<문제>:{n:푼 횟수,w:틀린 횟수,k:마지막 정답(1/0),c:고른 번호,t:시각}}} -> REC 로 자동 연동(선생님 화면) */
function recordYy(q,i){
  try{
    var K='vhy:'+SCH,P=location.pathname.split('/').slice(-2).join('/'),Y=jget(K,{});
    var pg=Y[P]||(Y[P]={}),e=pg[q.id]||(pg[q.id]={n:0,w:0});
    e.n=(e.n||0)+1;if(i!==q.ans)e.w=(e.w||0)+1;e.k=(i===q.ans?1:0);e.c=i;e.t=Date.now();
    jset(K,Y);
  }catch(x){}
  /* 바꿔 말하기 단어는 푼 즉시 모두 선생님 질문 목록에 올린다 */
  try{swList().forEach(function(s){pushSw(s.id)})}catch(x){}
}


function jdHtml(q){
  var h='<div class="sl">';
  q.jd.forEach(function(c){
    var en=c[0].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(s)}).join('');
    var ko=c[1].split(/(\[\[.*?\]\])/).map(function(s){var m=s.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+esc(m[1])+'</mark>':esc(s)}).join('');
    h+='<div class="r"><b>'+en+'</b><span>'+ko+'</span></div>';
  });
  return h+'</div>';
}
function pushSw(id){return; /* 바꿔 말하기 단어는 선생님 질문 목록에 따로 올리지 않는다: 학생 목록 = 선생님 열람 목록 */
  if(String(id).indexOf('c')===0&&!/^sw:/.test(id))return;
  var s=swList().filter(function(x){return x.id===id})[0];if(!s||PUSHED[id])return;
  PUSHED[id]=1;jset('vhvs:'+SCH,PUSHED);
  try{WN.add([{w:s.a,m:s.k+' → '+s.b,src:SRC,how:'바꿔 말하기',ask:true}])}catch(e){}
}
function swList(){
  var L=(DATA.story||[]).map(function(s){return {a:s.a,form:s.form,b:s.b,k:s.k,id:'sw:'+s.a.toLowerCase(),n:s.n,sq:s.sq,sum:s.sum,hook:s.hook,en:s.en,ko:s.ko}}),seen={};
  L.forEach(function(s){seen[s.a.toLowerCase()]=1});
  /* 모든 문제의 '이 단어, 이렇게 바뀌었어요' 단어도 빠짐없이 바꿔 말하기 연습에 넣는다 */
  Qs.forEach(function(q,qi){(q.swaps||[]).forEach(function(w){var k=String(w[0]).toLowerCase();if(seen[k])return;seen[k]=1;L.push({a:w[0],form:w[0],b:w[1],k:w[2],id:'sw:'+k,n:0,sq:qi+1,sum:'',hook:'',en:'',ko:''})})});
  return L.map(function(s,i){return {s:s,i:i}}).sort(function(x,y){return (x.s.sq-y.s.sq)||(x.i-y.i)}).map(function(x){return x.s});
}
function hlWord(t,w){return t.split(new RegExp('(\\b'+w+'\\b)','i')).map(function(x,i){return i%2?'<mark>'+esc(x)+'</mark>':words(x)}).join('')}
function hlSum(t){return t.split(/(\[\[.*?\]\])/).map(function(x){var m=x.match(/^\[\[(.*)\]\]$/);return m?'<mark>'+words(m[1])+'</mark>':words(x)}).join('')}
var swOpen={},swD={};
/* 화면 */
function render(){
  var h='';
  if(view==='home')h=vHome();else if(view==='q')h=vQ();else if(view==='res')h=vRes();else if(view==='notes')h=vNotes();else if(view==='sw')h=vSw();else if(view==='chk')h=vChk();else h=vHome();
  var y=window.pageYOffset||0;
  $('app').innerHTML=h;
  if(!window.__goTop)window.scrollTo(0,y);
}
function yyLine(){
  try{var Y=jget('vhy:'+SCH,{}),pg=Y[location.pathname.split('/').slice(-2).join('/')]||{},n=0,r=0,w=0;
    Qs.forEach(function(q){var e=pg[q.id];if(e&&e.n){n++;if(e.k)r++;w+=e.w||0}});
    if(!n)return '';
    return '<p class="sub">내 기록: '+n+'문제 중 '+r+'문제 정답'+(w?' · 틀린 횟수 '+w+'번':'')+'</p>';
  }catch(x){return ''}
}
function vHome(){
  var d=doneCount(),f=firstOpen();
  var h='<a class="tag" href="../yoyak.html" style="text-decoration:none">목록</a><h1>'+DATA.meta.lesson+' '+esc(DATA.meta.title)+'</h1><p class="sub">요약문 연습 '+DATA.meta.label+' · '+Qs.length+'문제</p><div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div>';
  h+=yyLine();
  h+='<button class="btn pri" data-a="resume">'+(d===0?'시작하기':(f<0?'결과 보기':'이어서 풀기 ('+d+' / '+Qs.length+')'))+'</button>';
  h+='<button class="btn sec" data-a="notes">단어노트 '+nNotes()+'개</button><button class="btn sec" data-a="sw">바꿔 말하기 연습</button>'+(nFlag()?'<button class="btn flagbtn" data-a="chk">선생님 확인 단어 '+nFlag()+'개</button>':'');
  h+='<div class="foot"><button data-a="reset">문제 다시 풀기</button></div>';
  return h;
}
function vQ(){
  var q=Qs[cur],a=PR.a[q.id],done=a!==undefined;curQ=q.id;
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">'+(cur+1)+' / '+Qs.length+'</span></div>';
  if(!done)h+='<p class="hint">문장의 밑줄 단어를 누르면 뜻이 나와요. 보기를 누르면 답을 골라요.</p>';
  h+='<div class="card sum">'+sumHtml(q,done)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt'+(done?' lock':'');
    if(done){if(i===q.ans)cls+=' right';else if(i===a)cls+=' mine'}
    h+='<div class="'+cls+'"'+(done?'':' data-a="pick" data-v="'+i+'"')+'><span class="num">'+CN[i]+'</span><span class="ot">'+(done?words(o[0]):esc(o[0]))+'<span class="dash">–</span>'+(done?words(o[1]):esc(o[1]))+'</span>'+(done&&i===q.ans?'<span class="st">정답</span>':(done&&i===a?'<span class="st">내 답</span>':''))+'</div>';
  });
  h+='</div>';
  if(done){
    var ok=a===q.ans;
    h+='<div id="exp"><div class="card"><div class="row"><span class="badge">'+(cur+1)+'번</span><span class="chip">정답 '+CN[q.ans]+'</span><span class="msg '+(ok?'o':'x')+'">'+(ok?'맞았어요':'내 답 '+CN[a])+'</span></div>';
    h+='</div><div class="card"><p class="lb">직독직해 (끊어서 앞에서부터 이해해요)</p>'+jdHtml(q)+'<details><summary>자연스러운 해석 보기</summary><div class="ko">'+q.ko.replace(/\((A|B)\)\s*/g,'')+'</div></details></div>';
    h+='<div class="card"><p class="lb">보기 뜻</p><ul class="opl">';
    q.opts.forEach(function(o,i){h+='<li class="'+(i===q.ans?'a':'')+'">'+CN[i]+' '+(i===q.ans?'<mark>'+words(o[0])+' – '+words(o[1])+'</mark>':words(o[0])+' – '+words(o[1]))+'<span class="k">'+(i===q.ans?'<mark>'+esc(q.optko[i])+'</mark>  ← 정답':esc(q.optko[i]))+'</span></li>'});
    h+='</ul></div>';
    h+='<div class="card"><p class="lb">정답의 근거 · 본문 '+q.evid_full.map(function(e){return e.n+'번'}).join(', ')+'</p>';
    q.evid_full.forEach(function(e){h+='<div class="ev"><div class="en">'+rich(e.en,e.hl)+'</div><div class="kk">'+richKo(e.ko,e.hlko)+'</div></div>'});
    h+='</div>';
    h+='<div class="card"><p class="lb">이 단어, 이렇게 바뀌었어요</p>';
    q.swaps.forEach(function(s){h+='<div class="swap"><span class="a">'+words(s[0])+'</span><span class="arr">→</span><span class="b">'+words(s[1])+'</span><span class="ds">'+esc(s[2])+(/\s/.test(s[0])||/\s/.test(s[1])?'':' '+sayBtn(s[0],'듣기')+' '+sayBtn(s[1],'듣기'))+'</span></div>'});
    h+='<div class="note">'+esc(q.swapnote)+'</div></div>';
    h+='<div class="card"><p class="lb">쓰임 익히기</p><div class="use">';
    q.use.forEach(function(u){h+='<div class="u"><div class="uw">'+esc(u.w)+'<small class="uwk">('+esc(u.wk)+')</small></div><div class="ue">'+useEx(u)+'</div><div class="uk">'+esc(u.ko).replace(esc(u.hk),'<mark>'+esc(u.hk)+'</mark>')+'</div></div>'});
    h+='</div></div>';
    h+='<div class="card"><p class="lb">기억할 흐름</p><div class="fc">'+q.fc.map(function(c,i){return (i?'<div class="ar">▼</div>':'')+'<div class="c'+(i===q.fc.length-1?' last':'')+'"><span class="tg">'+esc(c[0])+'</span><div class="hd">'+mk(c[1])+'</div><div class="sb2">'+mk(c[2])+'</div></div>'}).join('')+'</div></div>';
    h+='<div class="card"><details><summary>다른 보기는 왜 아닐까요</summary><ul style="padding:0;margin:6px 0 0">';
    q.wrong.forEach(function(w,i){if(w)h+='<li><b>'+CN[i]+'</b> '+hlp(w)+'</li>'});
    h+='</ul></details></div>';
    h+='<button class="btn pri" data-a="next">'+(cur<Qs.length-1?'다음 문제':'결과 보기')+'</button></div>';
  }
  return h;
}
function vRes(){
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button></div><h1>'+Qs.length+'문제 중 '+okCount()+'문제 맞았어요</h1>';
  h+='<div class="nums">';
  Qs.forEach(function(q,i){var a=PR.a[q.id];h+='<button class="nb '+(a===undefined?'':(a===q.ans?'o':'x'))+'" data-a="q" data-v="'+i+'">'+(i+1)+'</button>'});
  h+='</div><p class="sub">단어노트에 '+nNotes()+'개가 쌓였어요.</p>';
  h+='<button class="btn pri" data-a="notes">단어노트 보기</button><button class="btn sec" data-a="reset">문제 다시 풀기</button><button class="btn sec" data-a="home">목록으로</button>';
  return h;
}
function sortedNotes(){return Object.keys(NOTES).map(function(k){return NOTES[k]}).sort(function(a,b){return b.t-a.t})}
function vNotes(){
  var L=sortedNotes();
  var h='<div class="top"><button class="back" data-a="home">목록</button><button class="back" data-a="sw">바꿔 말하기</button><span class="cnt">단어노트 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">밑줄 단어를 누르면 여기에 쌓여요.</div>';
  h+='<div class="card"><ul class="wl">';
  L.forEach(function(n){h+='<li><span class="lw">'+esc(n.l)+'</span><span class="lm">'+esc(n.k)+'</span>'+(n.c>1?'<span class="lc">'+n.c+'번</span>':'')+'<button class="rmw" data-a="rmnote" data-v="'+esc(n.l.toLowerCase())+'">빼기</button></li>'});
  return h+'</ul></div>';
}
function sk(id){return id.indexOf('sw:')===0?id.slice(3):id}
function wrongOf(id){var r=SRV[sk(id).toLowerCase()];return r&&r.c>0?r.c:0}
function flagList(){return Object.keys(SRV).map(function(k){return SRV[k]}).filter(function(r){return r.c>0}).sort(function(a,b){return b.c-a.c})}
function nFlag(){return flagList().length}
function srvLoad(){
  try{WN.list().then(function(r){
    if(!r||!r.ok||!r.items)return;SRV={};
    r.items.forEach(function(i){if(String(i.src||'').indexOf(SRC)>=0)SRV[String(i.w).toLowerCase()]={w:i.w,m:i.m,c:i.c||0}});
    if(view==='home'||view==='chk'||view==='sw')render();
  })}catch(e){}
}
function vChk(){
  var L=flagList();
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">선생님 확인 단어 '+L.length+'개</span></div>';
  if(!L.length)return h+'<div class="empty">틀린 단어가 없어요.</div>';
  h+='<p class="hint">선생님이 물어봤을 때 틀린 단어예요. 먼저 뜻을 떠올려 보고 확인해 보세요. 오답노트(H로드맵)에도 같이 있어요.</p><div class="card">';
  L.forEach(function(r){
    var id=r.w.toLowerCase(),o=swOpen['c'+id];
    h+='<div class="swr"><div class="swq"><span class="sa">'+esc(r.w)+'</span><span class="sb">'+(o?'<em>'+esc(r.m)+'</em>':'뜻은?')+'</span><small class="flag">'+r.c+'번 틀림</small><button data-a="rv" data-v="c'+esc(id)+'">'+(o?'가리기':'확인')+'</button></div></div>';
  });
  return h+'</div><a class="btn sec" style="display:block;text-align:center;text-decoration:none" href="https://nolbada.github.io/via/wn/">H로드맵 오답노트 열기</a>';
}
function sceneLine(t,cur){return esc(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,function(m,w,k){return '<b class="wc'+(w.toLowerCase()===String(cur).toLowerCase()?' me':'')+'">'+w+'</b>('+k+')'})}
function vSw(){
  var L=swList(),sc={};
  (DATA.scenes||[]).forEach(function(c){(c.line.match(/\[\[\w+\|/g)||[]).forEach(function(m){sc[m.slice(2,-1).toLowerCase()]=c})});
  var h='<div class="top"><button class="back" data-a="home">목록</button><span class="cnt">바꿔 말하기 '+L.length+'개</span></div>';
  h+='<p class="hint">왼쪽 단어가 요약문에서 어떤 말로 바뀔까요? <b>소리 내어 말해 본 뒤</b> 확인을 눌러요.</p>';
  h+='<div class="tabs"><button data-a="rvall" data-v="open">모두 열기</button><button data-a="rvall" data-v="hide">모두 가리기</button></div><div class="card">';
  L.forEach(function(s){
    var o=swOpen[s.id],c=sc[s.form.toLowerCase()],on=swD['s'+s.id],fl=wrongOf(s.id);
    h+='<div class="swr"><div class="swq"><span class="qn">'+s.sq+'번</span><span class="sa">'+words(s.a)+(fl?'<small class="flag">'+fl+'번 틀림</small>':'')+'</span><span class="sb">'+(o?'<em>'+words(s.b)+'</em>'+esc(s.k):'→ ?')+'</span>'+sayBtn(s.a,'듣기')+(o?sayBtn(s.b,'정답 듣기'):'')+'<button data-a="rv" data-v="'+esc(s.id)+'">'+(o?'가리기':'확인')+'</button></div>';
    if(c)h+='<button class="acc2" data-a="dt" data-v="s'+esc(s.id)+'">'+esc(c.tag)+' 줄거리<span>'+(on?'접기':'펼치기')+'</span></button>'+(on?'<div class="story">'+sceneLine(c.line,s.form)+'</div>':'');
    h+='</div>';
  });
  return h+'</div><p class="sumline">시험에서는 본문 단어가 뜻이 같은 다른 단어로 바뀌어 나와요.</p>';
}
/* 자동 새로고침(기록 연동)이 일어나도 보던 문제로 되돌린다 */
try{var sv=JSON.parse(sessionStorage.getItem('vhyv')||'null');if(sv&&sv.p===location.pathname&&Date.now()-sv.t<600000&&sv.v&&sv.v!=='home'){view=sv.v;cur=sv.c||0;try{history.pushState({v:view},'');histPushed=true}catch(e){}}}catch(e){}
render();srvLoad();window.addEventListener('pageshow',srvLoad);
</script>
</body>
</html>
