e amount of plastic in our landfills.", "ko": "재활용은 매립지의 플라스틱 양을 줄이는 데 도움이 될 수 있다."}, {"en": "However, less than ten percent of the world’s plastic waste has been recycled so far.", "ko": "하지만 지금까지 전 세계 플라스틱 쓰레기의 10%도 안 되는 양만 재활용되었다."}, {"en": "Often, plastic waste is moved to places where it is just dumped or burned.", "ko": "플라스틱 쓰레기는 흔히 그냥 버려지거나 태워지는 곳으로 옮겨진다."}, {"en": "Furthermore, between 8 and 14 million metric tons of plastic end up in the ocean every year.", "ko": "게다가 매년 800만~1,400만 톤의 플라스틱이 결국 바다로 들어간다."}, {"en": "This puts many marine species in danger.", "ko": "이것은 많은 해양 생물 종을 위험에 빠뜨린다."}], "chunks": [[0, 1], [2, 3], [4, 5], [6, 7]], "half": 4, "ex": [{"head": "About fifty percent of plastic", "clue": ["single-use products"], "core": "플라스틱 절반 = 일회용 제품용", "why": "글의 출발: 일회용 플라스틱이 절반"}, {"head": "That means the items are", "clue": ["That means", "the items"], "core": "일회용 = 한 번 쓰고 버려짐", "why": "That(그것) = 앞의 '일회용으로 생산됨', the items = 일회용 제품"}, {"head": "Do you ever stop to", "clue": ["these plastic items", "throw them away"], "core": "질문: 버린 플라스틱은 어디로 갈까?", "why": "these plastic items = 앞에서 버려진다고 한 일회용 제품"}, {"head": "Recycling can help reduce the", "clue": ["Recycling"], "core": "재활용 = 매립지 플라스틱을 줄이는 방법", "why": "'버린 뒤 어디로?'에 대한 첫 답: 재활용"}, {"head": "However, less than ten percent", "clue": ["However", "recycled"], "core": "하지만 실제 재활용은 10% 미만", "why": "However(하지만) = 앞의 '재활용이 도움이 됨'을 뒤집음"}, {"head": "Often, plastic waste is moved", "clue": ["Often", "dumped or burned"], "core": "재활용 안 된 쓰레기 = 버려지거나 태워짐", "why": "재활용 안 되는 90% 이상이 실제로 어디로 가는지 설명"}, {"head": "Furthermore, between 8 and 14", "clue": ["Furthermore", "the ocean"], "core": "게다가 매년 800만~1,400만 톤이 바다로", "why": "Furthermore(게다가) = 버려지고 태워지는 문제에 바다 문제를 하나 더 보탬"}, {"head": "This puts many marine species", "clue": ["This", "marine species"], "core": "바다 플라스틱 → 해양 생물 위험", "why": "This(이것) = 앞 문장의 바다로 가는 플라스틱"}], "postit": "절반이 일회용 → 버린 뒤 어디로? → 재활용, 하지만 10% 미만 → 버리거나 태움 → 게다가 바다·해양 생물 위험", "cex": [{"cor  "This means that mealworms can", "clue": ["This means"], "core": "결국 밀웜 = 플라스틱을 먹고 삶", "why": "This = 앞의 '박테리아가 플라스틱을 분해함'"}, {"head": "Scientists are now looking for", "clue": ["now", "the bacteria", "outside of mealworms"], "core": "연구 1: 밀웜 몸 밖에서 박테리아 배양", "why": "the bacteria = 앞의 플라스틱 분해 박테리아, now(이제) 연구 단계로"}, {"head": "They also want to speed", "clue": ["They also"], "core": "연구 2: 분해 속도 높이기", "why": "They = 앞의 Scientists, also(또한) = 배양 연구에 하나 더 보탬"}, {"head": "This may help us keep", "clue": ["This may help", "plastic-free"], "core": "기대: 플라스틱 없는 매립지", "why": "This = 앞의 배양과 속도 높이기 연구 → 연구 다음에 기대 효과"}], "postit": "밀웜 주목 → 딱정벌레 애벌레 → 몸속 박테리아가 플라스틱 분해 → 밀웜이 플라스틱 먹음 → 배양·속도 연구 → 플라스틱 없는 매립지", "cex": [{"core": "플라스틱 해결책으로 밀웜(딱정벌레 애벌레) 주목", "why": "글의 출발: With this in mind(이를 염두에 두고) = 플라스틱 문제 → 밀웜 등장"}, {"core": "밀웜 몸속 박테리아가 플라스틱 분해", "why": "Special bacteria(특별한 박테리아) → them(그것들) = 밀웜 몸속에 사는 박테리아"}, {"core": "밀웜은 플라스틱을 먹고 삶, 몸 밖 배양 연구", "why": "This means(이는 ~을 뜻한다) = 박테리아의 분해 능력 → 연구 단계로"}, {"core": "분해 속도 높이기 → 플라스틱 없는 매립지 기대", "why": "They also(그들은 또한) = 과학자들 → 배양 연구에 속도 연구 추가"}]}, {"id": "g1_cheongseok_L4-p4", "label": "4과 ④ 오염된 흙과 버드나무", "sents": [{"en": "Mining and other industries are causing soil pollution across the globe.", "ko": "광산업과 다른 산업들이 전 세계적으로 토양 오염을 일으키고 있다."}, {"en": "Although polluted soil can be dug up and transported to a landfill, this process is expensive.", "ko": "오염된 흙을 파내 매립지로 옮길 수는 있지만, 이 과정은 비용이 많이 든다."}, {"en": "Moreover, it only moves the problem to another area and does not really solve it.", "ko": "게다가 그것은 문제를 다른 곳으로 옮길 뿐 실제로 해결하지는 않는다."}, {"en": "Fortunately, there is an eco-friendly and cost-effective way to restore polluted soil—planting willow trees.", "ko": "다행히도 오염된 흙을 되살리는 친환경적이고 비용 효율적인 방법이 있는데, 바로 버드나무를 심는 것이다."}, {"en": "These amazing trees have extensive and well-developed root systems.", "ko": "이 놀라운 나무들은 넓게 퍼지고 잘 발달한 뿌리 체계를 가지고 있다."}, {"en": "As a result, they naturally extract a wide range of harmful materials from the soil.", "ko": "그 결과, 버드나무는 흙에서 다양한 해로운 물질을 자연스럽게 뽑아낸다."}, {"en": "They can also grow quickly, even in soil with a high acidity level or a lot of heavy metals in it.", "ko": "버드나무는 또한 산도가 높거나 중금속이 많은 흙에서도 빨리 자랄 수 있다."}, {"en": "Research on the effectiveness of using willow trees for this purpose is in development.", "ko": "이런 목적으로 버드나무를 이용하는 것의 효과에 대한 연구가 진행 중이다."}, {"en": "Scientists have found that some species of willow trees are able to absorb harmful materials better than others.", "ko": "과학자들은 일부 버드나무 종이 다른 종보다 해로운 물질을 더 잘 흡수할 수 있다는 것을 알아냈다."}, {"en": "Therefore, this promising area should be further explored to find out which trees are the most effective.", "ko": "그러므로 어떤 나무가 가장 효과적인지 알아내기 위해 이 유망한 분야를 더 탐구해야 한다."}, {"en": "In time, we may be able to clean up our land with willow trees.", "ko": "머지않아 우리는 버드나무로 우리 땅을 깨끗하게 할 수 있을지도 모른다."}], "chunks": [[0, 0], [1, 2], [3, 6], [7, 8], [9, 10]], "half": 7, "ex": [{"head": "Mining and other industries are", "clue": ["soil pollution"], "core": "광산업 등 산업 → 전 세계 토양 오염", "why": "글의 출발: 두 번째 분야, 토양 오염 문제"}, {"head": "Although polluted soil can be", "clue": ["this process", "expensive"], "core": "흙 파서 옮기기 = 가능하지만 비쌈", "why": "오염 문제 다음에 기존 처리법과 단점 1(비쌈)"}, {"head": "Moreover, it only moves the", "clue": ["Moreover", "it only moves the problem"], "core": "단점 2: 문제를 옮길 뿐 해결 못 함", "why": "Moreover(게다가) = '비싸다'에 단점을 하나 더, it = 흙을 파서 옮기는 과정"}, {"head": "Fortunately, there is an eco-friendly", "clue": ["Fortunately", "willow trees"], "core": "다행히 친환경·저비용 해결책 = 버드나무 심기", "why": "Fortunately(다행히) = 단점 이야기에서 해결책으로 전환"}, {"head": "These amazing trees have extensive", "clue": ["These amazing trees"], "core": "버드나무 = 넓고 잘 발달한 뿌리", "why": "These amazing trees = 앞의 willow trees(버드나무)"}, {"head": "As a result, they naturally", "clue": ["As a result", "they"], "core": "뿌리 덕분에 흙 속 해로운 물질을 뽑아냄", "why": "As a result(그 결과) = 잘 발달한 뿌리의 결과, they = 버드나무"}, {"head": "They can also grow quickly", "clue": ["also", "grow quickly"], "core": "버드
