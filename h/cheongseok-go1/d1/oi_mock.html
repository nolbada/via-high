</div><script>
var IT=[{"id": "m2610g1-21", "src": "mock_2610_g1.txt", "label": "26년 10월 21번", "type": "order", "given": "Among unsatisfied professionals, there's a repeating theme — the belief that someday (a mysterious day in the future) things will miraculously change and they'll stumble into the perfect job or career.", "parts": {"A": "They head to job boards and search for roles with a similar job title, hoping that the universe will sprinkle a bit of magic on their career if they just hit the refresh button in a different department or company.", "B": "Efforts like this make professionals feel like they are doing something, when really they're just setting themselves up to take a new role and quickly become just as disenchanted as they were before. It's like rearranging deck chairs on the Titanic.", "C": "At the same time, they (typically) do little to meaningfully alter their current situation. They don't like their job, so what do they do?"}, "answer": "C-A-B", "hint": {"given": "불만인 직업인들은 언젠가 기적처럼 완벽한 직업을 만날 거라고 믿음", "A": "그들은 구인란에서 비슷한 직책만 검색하며 마법 같은 변화를 바람", "B": "이런 노력은 뭔가 하는 기분만 줄 뿐, 결국 또 실망함 — 타이타닉 갑판 의자 옮기기와 같음", "C": "그러면서도 현재 상황을 바꾸려는 노력은 거의 안 함 — 그럼 그들은 무엇을 하나?"}, "clues": [["At the same time, they (typically) do little", "(C)의 At the same time = 주어진 글의 '기적을 믿는 마음'과 동시에 벌어지는 일, they = 불만인 직업인들"], ["so what do they do? → They head to job boards", "(C) 끝의 질문(무엇을 하나?)에 (A)가 답함 — 구인란으로 감"], ["Efforts like this", "(B)의 '이와 같은 노력' = (A)의 비슷한 직책 검색하기"]], "flow": ["불만인 직업인들: 언젠가 기적이 올 거라고 믿음", "하지만 현재 상황은 거의 안 바꿈 — 그럼 무엇을 하나?", "비슷한 직책만 검색하며 마법을 바람", "이런 노력은 하는 척일 뿐, 또 실망함(타이타닉 갑판 의자)"]}, {"id": "m2610g1-22", "src": "mock_2610_g1.txt", "label": "26년 10월 22번", "type": "insert", "sentence": "These numbers and patterns aren't really dictated by nature or any essential human characteristic, but are rather social creations that we internalize and come to accept as “normal.”", "segs": ["Sociologists argue that our perception and usage of time are not just basic properties of nature, like a clock ticking away in the background, nor are they simply psychological phenomena of individual experience. Instead, how we perceive and understand time is to a large degree shaped by tradition and cultural norms.", "Eviatar Zerubavel's work, The Seven Day Circle: The History and Meaning of the Week, demonstrates how the week, a fundamental unit of time, is a social invention that varies across cultures, influencing how people structure their activities and rhythms of life.", "Why do we consider a nine-to-five job routine?", "Why don't many of us work on the weekends?", "Why do we usually pay our bills at the end of the month? Why is the retirement age sixty-five?", ""], "answer": 5, "clues": [["These numbers and patterns", "'이러한 숫자와 양식' = 앞 질문들의 9시~5시, 주말, 월말, 65세 — 마지막 질문(65세)까지 다 나온 뒤에만 가리킬 수 있음"], ["social creations", "질문들에 대한 답 = 자연이 아니라 사회가 만든 것, 첫 문장 주장(시간은 자연 속성이 아님)으로 되돌아감"]], "flow": ["시간 인식은 자연의 속성도, 개인 심리도 아님 — 전통과 문화가 만든 것", "일주일도 문화마다 다른 사회적 발명품", "왜 9시~5시, 주말 휴무, 월말 납부, 65세 은퇴일까?", "이 숫자와 양식은 우리가 '정상'으로 받아들인 사회적 창조물"]}, {"id": "m2610g1-23", "src": "mock_2610_g1.txt", "label": "26년 10월 23번", "type": "insert", "sentence": "Such misconduct has often only been exposed because brave informants have risked a great deal in order to put an end to it.", "segs": ["In recent years, the number of illegal actions in particular at the corporate level has grown, or at least the number of cases that came to light increased.", "Hence, it is no surprise that whistleblower protection has come into focus. If violations of law and order go undetected and unpunished for years because employees of a company fear to report illegal activities for fear of reprisals or consequences, it can have several negative effects.", "It can harm the company itself, but also third-parties, the economy in general, the general public, and even the rule of law could be affected.", "Protecting those who would assist in reducing unlawful or even criminal behaviour has two main functions: Protecting the individual's actions as well as protecting the public good.", "A well-balanced whistleblower protection may have positive effects on both of these.", ""], "answer": 1, "clues": [["Such misconduct", "'그러한 위법 행위' = 바로 앞 문장의 기업 차원 위법 행위(illegal actions)"], ["came to light", "앞 문장의 '세상에 드러난 사건' → 주어진 문장의 '용기 있는 제보자 덕분에 드러남'으로 이어짐"], ["Hence, it is no surprise that whistleblower protection", "Hence(따라서)의 이유 = 주어진 문장의 '제보자가 큰 위험을 무릅씀', 주어진 문장이 빠지면 내부 고발자 이야기가 갑자기 나옴"]], "flow": ["최근 기업 위법 행위(또는 드러난 사건)가 늘어남", "용기 있는 제보자 덕분에 비로소 드러남", "그래서 내부 고발자 보호가 주목받음", "신고를 못 하면 기업·경제·대중·법치까지 피해", "보호는 개인 행위와 공익 둘 다 지킴"]}, {"id": "m2610g1-29", "src": "mock_2610_g1.txt", "label": "26년 10월 29번", "type": "order", "given": "Since hydra and the immortal jellyfish don't exhibit obvious signs of aging, they are often called biologically immortal.", "parts": {"A": "But, unlike most every animal, their likelihood of dying does not increase with age.", "B": "This doesn't mean they don't die. Nor does it even mean that they cannot die of biological causes.", "C": "Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process. But their property of being able to regenerate entire body parts, or even a whole organism, makes them more similar to trees than to us."}, "answer": "B-A-C", "hint": {"given": "히드라와 불멸의 해파리는 노화 징후가 없어 '생물학적으로 죽지 않는다'고 불림", "A": "하지만 다른 동물과 달리 나이가 들어도 죽을 가능성이 커지지 않음", "B": "이 말이 안 죽는다는 뜻도, 생물학적 원인으로 못 죽는다는 뜻도 아님", "C": "노화를 이길 단서를 줄 수 있어 노화학자들이 흥분함 — 하지만 몸을 재생하는 특성 때문에 우리보다 나무에 더 가까움"}, "clues": [["This doesn't mean", "(B)의 This = 주어진 글의 '죽지 않는다고 불리는 것'"], ["But, unlike most every animal", "(A)의 But = (B)의 '~라는 뜻은 아님'에 이어 '그래도 특별한 점은 있다'로 방향 전환"], ["excite gerontologists", "(C) = (A)의 '나이 들어도 죽을 가능성이 그대로'라는 특징 때문에 노화학자가 흥분함"]], "flow": ["히드라·해파리는 '생물학적으로 불멸'이라 불림", "그렇다고 안 죽는 것은 아님", "하지만 나이 들어도 죽을 가능성이 안 커짐", "노화학자가 관심(노화를 이길 단서) — 하지만 재생 능력 때문에 우리보다 나무와 비슷함"]}, {"id": "m2610g1-30", "src": "mock_2610_g1.txt", "label": "26년 10월 30번", "type": "order", "given": "The power plants prefer subsidies over regulations or taxes.", "parts": {"A": "Moreover, from the perspective of pure efficiency, the subsidy distorts the economy because the electricity company is not facing the full costs of what it does, even if it is successful in limiting emissions. Indeed, electricity prices may end up lower than they should be and electricity consumption higher, which will worsen global warming, even though the emissions per unit of electricity have been reduced.", "B": "The reason is obvious. They prefer to receive money from the government rather than pay the costs themselves.", "C": "But the “expansion” of their opportunity set through subsidies has to be matched by the contraction of the opportunity set of others. The electricity companies' “freedom” is increased at the expense of the ordinary individual, who must suffer from increased taxation to pay for the subsidy."}, "answer": "B-C-A", "hint": {"given": "발전소들은 규제나 세금보다 보조금을 더 좋아함", "A": "게다가 보조금은 경제를 왜곡해 전기 가격은 낮아지고 소비는 늘어 지구 온난화를 악화시킴", "B": "이유는 뻔함 — 비용을 직접 내기보다 정부 돈을 받고 싶어 함", "C": "하지만 보조금으로 그들의 기회가 늘면 다른 사람(세금 내는 개인)의 기회는 줄어듦"}, "clues": [["The reason is obvious", "(B) = 주어진 글의 '보조금을 더 좋아함'에 대한 이유"], ["But the \"expansion\" of their opportunity set through subsidies", "(C)의 But = (B)의 발전소 입장(돈 받는 게 좋음)에 대한 반론, their = 발전소"], ["Moreover", "(A)의 Moreover = (C)의 개인 피해에 더해 또 하나의 문제(경제 왜곡) 추가"]], "flow": ["발전소는 규제나 세금보다 보조금을 더 좋아함", "이유: 비용을 안 내고 정부 돈을 받으니까", "하지만 그만큼 세금 내는 개인이 손해", "게다가 경제를 왜곡해 전기 소비가 늘고 온난화 악화"]}, {"id": "m2610g1-31", "src": "mock_2610_g1.txt", "label": "26년 10월 31번", "type": "insert", "sentence": "In Star Trek, however, there isn't much scarcity.", "segs": ["Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "All of classical economics is based on the notion that there isn't usually enoug
