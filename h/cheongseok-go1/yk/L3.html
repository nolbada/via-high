</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "공통영어2 3과 · 24단어", "key": "cheongseok-go1:yk:L3", "sec": 0, "pass": [{"label": "3과 ① 호랑이 책과 호랑이의 땅", "sents": [{"en": "Children around the world learned a bit more about Korean culture when writer Tae Keller published her book When You Trap a Tiger in 2020.", "ko": "2020년 작가 Tae Keller가 책 『When You Trap a Tiger』를 출판했을 때, 전 세계 아이들은 한국 문화에 대해 조금 더 알게 되었다."}, {"en": "Its story starts with a girl who meets a tiger.", "ko": "그 책의 이야기는 호랑이를 만나는 한 소녀로부터 시작된다."}, {"en": "Her grandmother knows the tiger as well.", "ko": "그녀의 할머니 역시 그 호랑이를 알고 있다."}, {"en": "When her grandmother gets sick, the girl makes a deal with the tiger.", "ko": "할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다."}, {"en": "Keller’s inspiration for her award-winning book was an old folktale that her halmoni (grandmother) used to tell her.", "ko": "Keller의 수상작에 영감을 준 것은 할머니가 들려주던 옛 설화였다."}, {"en": "It is called “The Sun and the Moon,” and it is about a brother, a sister, and a tiger.", "ko": "그 설화는 '해님 달님'이라고 불리며, 오빠와 여동생, 그리고 호랑이에 관한 이야기이다."}, {"en": "Keller wanted to revive the public’s interest in tigers by writing her own book.", "ko": "Keller는 자신의 책을 써서 호랑이에 대한 대중의 관심을 되살리고 싶어 했다."}, {"en": "How is the tiger related to Korean culture?", "ko": "호랑이는 한국 문화와 어떻게 관련되어 있을까?"}, {"en": "Long ago, tigers were so abundant in Korea that people often called the country the “Land of Tigers.”", "ko": "오래 전 한국에는 호랑이가 매우 많아서 사람들은 종종 이 나라를 '호랑이의 땅'이라고 불렀다."}, {"en": "It is estimated that tigers lived in Korea for at least 100,000 years.", "ko": "호랑이는 한국에 적어도 10만 년 동안 살았던 것으로 추정된다."}]}, {"label": "3과 ② 문화 속 호랑이와 설화", "sents": [{"en": "The first appearance of a tiger in Korean culture dates back to the rock art of the Bronze Age.", "ko": "한국 문화에서 호랑이가 처음 등장한 것은 청동기 시대의 바위 그림으로 거슬러 올라간다."}, {"en": "It depicts people hunting various animals, including tigers.", "ko": "그 바위 그림은 사람들이 호랑이를 포함한 여러 동물을 사냥하는 모습을 그리고 있다."}, {"en": "Since then, tigers have appeared in many aspects of Korean culture, from legends to art and musical instruments.", "ko": "그때부터 호랑이는 전설에서 미술과 악기에 이르기까지 한국 문화의 여러 분야에 등장해 왔다."}, {"en": "Some of you may have heard Korean folktales featuring tigers.", "ko": "여러분 중 일부는 호랑이가 나오는 한국 설화를 들어 봤을지도 모른다."}, {"en": "In fact, approximately forty percent of Korean folktales about animals include a tiger.", "ko": "실제로 동물에 관한 한국 설화의 약 40%에 호랑이가 나온다."}, {"en": "Tigers in Korean folktales are sometimes shown in a positive light and sometimes as foolish creatures.", "ko": "한국 설화 속 호랑이는 때로는 긍정적으로, 때로는 어리석은 존재로 그려진다."}, {"en": "For example, in one story, a tiger helps a human become rich after the human saves the tiger’s life.", "ko": "예를 들어, 한 이야기에서 호랑이는 자기 목숨을 구해 준 사람이 부자가 되도록 돕는다."}, {"en": "In another story, a tiger hears a mother tell her crying baby, “Don’t cry. Here’s a gotgam.”", "ko": "또 다른 이야기에서 호랑이는 한 엄마가 우는 아기에게 \"울지 마. 여기 곶감 있다.\"라고 말하는 것을 듣는다."}, {"en": "Because the baby stops crying, the tiger mistakenly thinks the gotgam is a very scary creature and runs away.", "ko": "아기가 울음을 그치자, 호랑이는 곶감이 아주 무서운 존재라고 착각하고 달아난다."}]}, {"label": "3과 ③ 엇갈린 감정과 올림픽 마스코트", "sents": [{"en": "It seems that people at the time had conflicting feelings about tigers.", "ko": "그 당시 사람들은 호랑이에 대해 엇갈린 감정을 가지고 있었던 것 같다."}, {"en": "They had respect for tigers’ power and courage.", "ko": "그들은 호랑이의 힘과 용기를 존경했다."}, {"en": "However, they were also scared of tigers because being injured or even killed by tigers was common in the past.", "ko": "하지만 과거에는 호랑이에게 다치거나 심지어 죽는 일이 흔했기 때문에 그들은 호랑이를 무서워하기도 했다."}, {"en": "They may have made tigers into foolish characters in order to be less scared of them.", "ko": "그들은 호랑이를 덜 무서워하려고 호랑이를 어리석은 캐릭터로 만들었을지도 모른다."}, {"en": "Tigers in Korea faced a decline in population due to hunting during the Joseon period and nearly went extinct during the Japanese colonial era.", "ko": "한국의 호랑이는 조선 시대에 사냥으로 수가 줄었고, 일제 강점기에는 거의 멸종했다."}, {"en": "With the disappearance of tigers in Korea, their use as a symbol of the nation faded away.", "ko": "한국에서 호랑이가 사라지면서, 나라의 상징으로 쓰이던 호랑이의 역할도 희미해졌다."}, {"en": "However, their symbolism was revived in modern times through their selection as the mascot for both Olympics hosted by Korea.", "ko": "하지만 한국에서 열린 두 번의 올림픽 마스코트로 뽑히면서 호랑이의 상징성은 현대에 되살아났다."}, {"en": "Hodori was the mascot for the Seoul Summer Olympics in 1988.", "ko": "호돌이는 1988년 서울 하계 올림픽의 마스코트였다."}, {"en": "It was a Siberian tiger, which represents courage.", "ko": "호돌이는 시베리아 호랑이였는데, 이 호랑이는 용기를 상징한다."}, {"en": "The PyeongChang Winter Olympics in 2018 created Soohorang, a white tiger, as its mascot.", "ko": "2018년 평창 동계 올림픽은 백호인 수호랑을 마스코트로 만들었다."}, {"en": "White tigers are considered sacred guardians.", "ko": "백호는 신성한 수호자로 여겨진다."}]}, {"label": "3과 ④ 오늘날의 호랑이", "sents": [{"en": "Tigers are also mentioned in the K-pop song “Tiger is Coming.”", "ko": "호랑이는 K-pop 노래 '범 내려온다'에도 등장한다."}, {"en": "One verse of the song is a reinterpreted version of “Sugungga,” which is a traditional Korean song.", "ko": "이 노래의 한 구절은 한국 전통 소리인 '수궁가'를 새롭게 해석한 것이다."}, {"en": "The song drew worldwide attention, and its video was viewed millions of times online.", "ko": "그 노래는 전 세계의 주목을 받았고, 뮤직비디오는 온라인에서 수백만 번 조회되었다."}, {"en": "These days, only a few wild tigers have been reported to be living in North Korea.", "ko": "요즘은 북한에 야생 호랑이 몇 마리만 살고 있다고 보고되어 있다."}, {"en": "However, the history, stories, and cultural meaning of tigers still have a place among modern Korean people.", "ko": "하지만 호랑이의 역사, 이야기, 문화적 의미는 여전히 현대 한국인 사이에 자리하고 있다."}, {"en": "Who can deny that the tiger is a symbol of Korea?", "ko": "호랑이가 한국의 상징이라는 것을 누가 부정할 수 있을까?"}, {"en": "In 2021, the National Folk Museum of Korea published a book that collects all the stories about tigers in Korea.", "ko": "2021년 국립민속박물관은 한국의 호랑이 이야기를 모두 모은 책을 펴냈다."}, {"en": "How about looking for tigers around you now?", "ko": "이제 여러분 주변에서 호랑이를 찾아보는 것은 어떨까?"}]}], "items": [{"id": "g1cs3-01", "p": 0, "s": 0, "w": "pu var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='yk:'+D.key;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sget(k,d){try{var v=localStorage.getItem(KEY+':'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(KEY+':'+k,JSON.stringify(v))}catch(e){}}
function sdel(k){try{localStorage.removeItem(KEY+':'+k)}catch(e){}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function sent(it){return D.pass[it.p].sents[it.s]}
function under(en,w){var i=en.indexOf(w);if(i<0){var re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),m=re.exec(en);if(!m)return esc(en);i=m.index;w=m[0]}var pre=en.slice(0,i).replace(/(^|\s)(a|an|A|An)\s$/,function(m,a,b){return a+(b[0]=='A'?'A(n)':'a(n)')+' '});return esc(pre)+'<u>'+esc(w)+'</u>'+esc(en.slice(i+w.length))}
function optsOf(it){var o=[];it.syn.forEach(function(x){o.push({w:x[0],m:x[1],g:'syn'})});it.ant.forEach(function(x){o.push({w:x[0],m:x[1],g:'ant'})});it.trap.forEach(function(x){o.push({w:x[0],m:x[1],g:'trap',r:x[2]})});it.dis.forEach(function(x){o.push({w:x[0],m:x[1],g:'dis'})});return o}
function mk(idx){return {k:idx,o:shuf(optsOf(IT[idx]).map(function(x,i){return i})),sel:{},rev:false}}
function isOK(q){var it=IT[q.k],o=optsOf(it);for(var i=0;i<o.length;i++){var s=!!q.sel[i];if(s!==(o[i].g=='syn'))return false}return true}
function wrongs(){return sget('wrong',[])}
function setWrong(k,bad){var w=wrongs(),i=w.indexOf(k);if(bad&&i<0)w.push(k);if(!bad&&i>=0)w.splice(i,1);sset('wrong',w)}
function speak(w){try{var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
var S=null;
function home(){S=null;clearInterval(TM);var w=wrongs(),pv=sget('prac',null),px=sget('real',null),ex=sget('exam',null);

 if(w.length)h+='<button class="chipb" onclick="startPrac(1)">틀린 '+w.length+'개만 다시</button>';
 h+='<button class="mcard" onclick="startReal()"><b>실전 예행연습</b><span>'+(px?('이어서 · '+(px.i+1)+' / '+px.q.length):'시험처럼 한번에 · 틀린 것만 다시')+'</span></button>';
 h+='<button class="mcard" onclick="startExam()"><b>시험</b><span>'+(ex&&ex.done?('응시 완료 · '+ex.score+' / '+ex.q.length):'1회 · 타임어택'+(IT.length>25?' · 25문제':''))+'</span></button>';
 h+='<div class="small" style="margin:14px 4px">'+IT.length+'단어 · 틀린 단어 '+w.length+'개</div>';
 if(ex&&ex.done)h+='<button class="go sec" id="rx" onclick="twoTap(this,resetExam)">시험 기록 지우기</button>';
 $('app').innerHTML=h;window.scrollTo(0,0)}
function twoTap(b,f){if(b.getAttribute('data-a')){f();return}b.setAttribute('data-a',1);b.textContent='한 번 더 누르면 지워져요';setTimeout(function(){if(b){b.removeAttribute('data-a');b.textContent='시험 기록 지우기'}},2500)}

function startPrac(only){var pv=sget('prac',null);if(!only&&pv){S=pv;S.mode='prac'}else{var ks=only?shuf(wrongs()):shuf(IT.map(function(x,i){return i}));S={mode:'prac',only:!!only,i:0,q:ks.map(mk)}}rPrac()}
function qCard(q,interactive){var it=IT[q.k],s=sent(it),o=optsOf(it);

 if(!q.rev){h+='<div class="opts">';q.o.forEach(function(oi){var x=o[oi];h+='<button class="opt'+(q.sel[oi]?' sel':'')+'" lang="en" translate="no" '+(interactive?'onclick="tg('+oi+')"':'')+'>'+esc(x.w)+'</button>'});h+='</div>'}
 return h+'</div>'}
function tg(oi){var q=S.q[S.i];q.sel[oi]=!q.sel[oi];save();(S.mode=='prac'?rPrac:rReal)()}

 else{var ok=isOK(q);h+='<div class="band '+(ok?'ok':'ng')+'">'+(ok?'정답':'오답')+'</div>'+qCard(q,false)+mapCard(q)+'<button class="go" onclick="nxt()">'+(last?'결과 보기':'다음 문제')+'</button>'}

function chk(){var q=S.q[S.i];q.rev=true;var ok=isOK(q);if(S.only){if(ok){q.ok=1}setWrong(q.k,!ok)}else setWrong(q.k,!ok);save();rPrac()}
function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}

function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}
function mapCard(q){var it=IT[q.k],o=optsOf(it),st=function(i){var x=o[i],s=!!q.sel[i];if(x.g=='syn')return s?['맞힘','g']:['놓침','b'];return s?['잘못 고름','b']:['',''];};
 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);
  else if(x.g=='ant')R+=chip(x,'r',t[0]||'반대',t[0]?t[1]:'b');
  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
 h+='<div class="cols"><div class="col"><h4>바꿔 쓸 수 있음</h4>'+L+'</div><div class="col"><h4>반대 뜻</h4>'+(R||'<div class="small">없음</div>')+'</div></div></div>';
 if(T||X)h+='<div class="lower">'+(T?'<h4>다른 뜻 함정</h4>'+T:'')+(X?'<h4>관계없음</h4>'+X:'')+'</div>';
 if(it.form)h+='<div class="small" style="margin-top:8px">'+esc(it.w)+' = '+esc(it.form)+'</div>';
 if(it.other&&it.other.length){h+='<div class="oth"><b>'+esc(it.h)+'의 다른 뜻</b>';it.other.forEach(function(x){h+='<div><b style="display:inline;color:#1f2430;font-size:.92rem">'+esc(x[0])+'</b> <span class="ex" lang="en" translate="no">'+esc(x[1])+'</span><div class="ex">'+esc(x[2])+'</div></div>'});h+='</div>'}
 if(it.tip)h+='<div class="tip">'+esc(it.tip)+'</div>';
 if(it.story)h+='<div class="post"><small>본문 기억</small>'+esc(it.story)+'</div>';
 return h+'</div>'}
function drawAll(){[].forEach.call(document.querySelectorAll('.map'),function(map){var svg=map.querySelector('svg'),mc=map.querySelector('.mc'),m=map.getBoundingClientRect();if(!m.width)return;svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-2,h='';
 [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){var r=b.getBoundingClientRect(),L=b.classList.contains('l'),ex=(L?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;h+='<path class="'+(L?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>'});svg.innerHTML=h})}
window.addEventListener('resize',function(){setTimeout(drawAll,50)});
/* 실전 예행연습 / 시험 공통 */
function startReal(){var px=sget('real',null);if(px&&!px.done){S=px}else{S={mode:'real',i:0,q:shuf(IT.map(function(x,i){return i})).map(mk)}}rReal()}
var TM=null;
function startExam(){var ex=sget('exam',null);if(ex&&ex.done){S=ex;showRes();return}if(ex){S=ex}else{var ks=shuf(IT.map(function(x,i){return i})).slice(0,25);S={mode:'exam',i:0,q:ks.map(mk),end:Date.now()+ks.length*20000};save()}rReal();clearInterval(TM);TM=setInterval(tick,500)}
function tick(){if(!S||S.mode!='exam'){clearInterval(TM);return}var r=Math.max(0,Math.round((S.end-Date.now())/1000));var e=$('tm');if(e)e.textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);if(r<=0){clearInterval(TM);fin()}}
function rReal(){var q=S.q[S.i],last=S.i>=S.q.length-1,h=topBar(S.mode=='exam'?'시험 <span class="timer" id="tm"></span>':'실전 예행연습');
 h+=qCard(q,true);
 h+='<div style="display:flex;gap:8px">'+(S.i>0?'<button class="go sec" style="flex:1" onclick="mv(-1)">이전</button>':'')+'<button class="go" style="flex:2" onclick="'+(last?'fin()':'mv(1)')+'">'+(last?'제출':'다음')+'</button></div>';
 if(S.mode!='exam')h+='<button class="go sec" onclick="home()">목록으로</button>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(S.mode=='exam')tick()}
function mv(d){S.i+=d;save();rReal()}
function fin(){clearInterval(TM);S.q.forEach(function(q){q.rev=true;setWrong(q.k,!isOK(q))});S.done=1;S.score=S.q.filter(isOK).length;if(S.mode=='real')sdel('real');else save();showRes()}
function showRes(){var n=S.q.length,ok=S.score,bad=S.q.filter(function(q){return !isOK(q)});
 var h='<div class="top"><b>'+(S.mode=='exam'?'시험 결과':'실전 예행연습 결과')+'</b><button class="hb" style="margin-left:auto" onclick="home()">처음으로</button></div>';
 h+='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답</div>';
 if(bad.length){h+='<div class="small" style="margin:4px 2px 8px">틀린 단어</div>';bad.forEach(function(q){h+=qCard(q,false)+mapCard(q)})}
 if(bad.length&&S.mode=='real')h+='<button class="go" onclick="startPrac(1)">틀린 것만 다시</button>';
 h+='<button class="go sec" onclick="home()">목록으로</button>';$('app').innerHTML=h;window.scrollTo(0,0);setTimeout(drawAll,30)}
home();
