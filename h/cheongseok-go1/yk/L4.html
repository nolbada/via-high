</style></head><body class="notranslate"><div class="wrap" id="app"></div><script id="data" type="application/json">{"title": "유의어 꽉잡기", "sub": "공통영어2 4과 · 23단어", "key": "cheongseok-go1:yk:L4", "sec": 0, "pass": [{"label": "4과 ① 위기의 환경과 자연의 해결책", "sents": [{"en": "Our environment is in trouble.", "ko": "우리의 환경은 위기에 처해 있다."}, {"en": "With the planet becoming warmer, sea levels are rising and natural disasters such as forest fires and floods are increasing.", "ko": "지구가 더 따뜻해지면서 해수면이 상승하고 산불과 홍수 같은 자연재해가 늘고 있다."}, {"en": "More and more waste is also being produced.", "ko": "또한 점점 더 많은 쓰레기가 만들어지고 있다."}, {"en": "Plastic, in particular, is causing problems with soil and water pollution.", "ko": "특히 플라스틱은 토양 오염과 수질 오염 문제를 일으키고 있다."}, {"en": "It is clear that humans are a major contributor to the destruction of nature.", "ko": "인간이 자연 파괴의 주된 원인이라는 것은 분명하다."}, {"en": "Will we be able to protect the environment from mountains of plastic?", "ko": "우리는 산더미 같은 플라스틱으로부터 환경을 지킬 수 있을까?"}, {"en": "Can we stop climate change from reaching dangerous levels?", "ko": "우리는 기후 변화가 위험한 수준에 이르는 것을 막을 수 있을까?"}, {"en": "Achieving these goals seems difficult.", "ko": "이 목표들을 이루는 것은 어려워 보인다."}, {"en": "Nature, however, may have provided us with solutions to these problems.", "ko": "그러나 자연은 이 문제들에 대한 해결책을 우리에게 이미 주었을지도 모른다."}, {"en": "Here are three areas where changes are already happening.", "ko": "여기 이미 변화가 일어나고 있는 세 분야가 있다."}]}, {"label": "4과 ② 플라스틱 쓰레기 문제", "sents": [{"en": "About fifty percent of plastic is produced for single-use products.", "ko": "플라스틱의 약 50%는 일회용 제품을 위해 생산된다."}, {"en": "That means the items are used just once and then discarded.", "ko": "이는 그 제품들이 딱 한 번 쓰이고 버려진다는 뜻이다."}, {"en": "Do you ever stop to think about where these plastic items go after you throw them away?", "ko": "여러분은 이 플라스틱 제품들을 버린 뒤 그것들이 어디로 가는지 생각해 본 적이 있는가?"}, {"en": "Recycling can help reduce the amount of plastic in our landfills.", "ko": "재활용은 매립지의 플라스틱 양을 줄이는 데 도움이 될 수 있다."}, {"en": "However, less than ten percent of the world’s plastic waste has been recycled so far.", "ko": "하지만 지금까지 전 세계 플라스틱 쓰레기의 10%도 안 되는 양만 재활용되었다."}, {"en": "Often, plastic waste is moved to places where it is just dumped or burned.", "ko": "플라스틱 쓰레기는 흔히 그냥 버려지거나 태워지는 곳으로 옮겨진다."}, {"en": "Furthermore, between 8 and 14 million metric tons of plastic end up in the ocean every year.", "ko": "게다가 매년 800만~1,400만 톤의 플라스틱이 결국 바다로 들어간다."}, {"en": "This puts many marine species in danger.", "ko": "이것은 많은 해양 생물 종을 위험에 빠뜨린다."}]}, {"label": "4과 ③ 플라스틱 먹는 밀웜", "sents": [{"en": "With this in mind, scientists are turning to mealworms.", "ko": "이 문제를 염두에 두고, 과학자들은 밀웜에 주목하고 있다."}, {"en": "Mealworms are the larvae of a certain species of beetle.", "ko": "밀웜은 어떤 딱정벌레 종의 애벌레이다."}, {"en": "Special bacteria live inside them.", "ko": "그 몸속에는 특별한 박테리아가 산다."}, {"en": "These bacteria can break down plastic.", "ko": "이 박테리아는 플라스틱을 분해할 수 있다."}, {"en": "This means that mealworms can actually feed on plastic.", "ko": "이는 밀웜이 실제로 플라스틱을 먹고 살 수 있다는 뜻이다."}, {"en": "Scientists are now looking for ways to cultivate the bacteria outside of mealworms.", "ko": "과학자들은 현재 밀웜 몸 밖에서 그 박테리아를 배양하는 방법을 찾고 있다."}, {"en": "They also want to speed up the process by which the bacteria break down plastic.", "ko": "그들은 또한 박테리아가 플라스틱을 분해하는 과정의 속도를 높이고 싶어 한다."}, {"en": "This may help us keep our landfills plastic-free.", "ko": "이는 우리가 매립지를 플라스틱 없는 상태로 유지하는 데 도움이 될지도 모른다."}]}, {"label": "4과 ④ 오염된 흙과 버드나무", "sents": [{"en": "Mining and other industries are causing soil pollution across the globe.", "ko": "광산업과 다른 산업들이 전 세계적으로 토양 오염을 일으키고 있다."}, {"en": "Although polluted soil can be dug up and transported to a landfill, this process is expensive.", "ko": "오염된 흙을 파내 매립지로 옮길 수는 있지만, 이 과정은 비용이 많이 든다."}, {"en": "Moreover, it only moves the problem to another area and does not really solve it.", "ko": "게다가 그것은 문제를 다른 곳으로 옮길 뿐 실제로 해결하지는 않는다."}, {"en": "Fortunately, there is an eco-friendly and cost-effective way to restore polluted soil—planting willow trees.", "ko": "다행히도 오염된 흙을 되살리는 친환경적이고 비용 효율적인 방법이 있는데, 바로 버드나무를 심는 것이다."}, {"en": "These amazing trees have extensive and well-developed root systems.", "ko": "이 놀라운 나무들은 넓게 퍼지고 잘 발달한 뿌리 체계를 가지고 있다."}, {"en": "As a result, they naturally extract a wide range of harmful materials from the soil.", "ko": "그 결과, 버드나무는 흙에서 다양한 해로운 물질을 자연스럽게 뽑아낸다."}, {"en": "They can also grow quickly, even in soil with a high acidity level or a lot of heavy metals in it.", "ko": "버드나무는 또한 산도가 높거나 중금속이 많은 흙에서도 빨리 자랄 수 있다."}, {"en": "Research on the effectiveness of using willow trees for this purpose is in development.", "ko": "이런 목적으로 버드나무를 이용하는 것의 효과에 대한 연구가 진행 중이다."}, {"en": "Scientists have found that some species of willow trees are able to absorb harmful materials better than others.", "ko": "과학자들은 일부 버드나무 종이 다른 종보다 해로운 물질을 더 잘 흡수할 수 있다는 것을 알아냈다."}, {"en": "Therefore, this promising area should be further explored to find out which trees are the most effective.", "ko": "그러므로 어떤 나무가 가장 효과적인지 알아내기 위해 이 유망한 분야를 더 탐구해야 한다."}, {"en": "In time, we may be able to clean up our land with willow trees.", "ko": "머지않아 우리는 버드나무로 우리 땅을 깨끗하게 할 수 있을지도 모른다."}]}, {"label": "4과 ⑤ 커피 찌꺼기 연료와 자연이 준 기회", "sents": [{"en": "Statistics show that about thirty to forty percent of people in the world drink coffee each day.", "ko": "통계에 따르면 전 세계 사람의 약 30~40%가 매일 커피를 마신다."}, {"en": "The coffee-making process, however, generates used coffee grounds, which are normally sent to landfills.", "ko": "그러나 커피를 만드는 과정에서 커피 찌꺼기가 생기고, 이것은 보통 매립지로 보내진다."}, {"en": "There, they can create a harmful greenhouse gas.", "ko": "그곳에서 커피 찌꺼기는 해로운 온실가스를 만들어 낼 수 있다."}, {"en": "Unfortunately, there’s no way to stop everyone in the world from drinking coffee.", "ko": "안타깝게도 세상 모든 사람이 커피를 마시지 못하게 할 방법은 없다."}, {"en": "However, we can reduce greenhouse gas emissions by turning used coffee grounds into biofuel.", "ko": "하지만 커피 찌꺼기를 바이오 연료로 바꾸면 온실가스 배출을 줄일 수 있다."}, {"en": "Biofuel is a natural fuel that is made from plant or animal sources.", "ko": "바이오 연료는 식물이나 동물 원료로 만든 천연 연료이다."}, {"en": "Researchers have found that they can grow algae on old coffee grounds without adding any other nutrients.", "ko": "연구자들은 다른 영양분을 넣지 않고도 오래된 커피 찌꺼기에서 조류를 키울 수 있다는 것을 알아냈다."}, {"en": "If these algae are exposed to twenty hours of light and four hours of darkness each day, they eventually produce high-quality biofuel.", "ko": "이 조류를 매일 20시간의 빛과 4시간의 어둠에 노출시키면, 결국 질 좋은 바이오 연료를 만들어 낸다."}, {"en": "The biofuel is renewable and sustainable, and it creates only a small amount of emissions.", "ko": "이 바이오 연료는 재생 가능하고 지속 가능하며, 배출물도 아주 적다."}, {"en": "These are just a few solutions we can find in nature.", "ko": "이것들은 우리가 자연에서 찾을 수 있는 해결책 중 몇 가지일 뿐이다."}, {"en": "There could be many more possible solutions to the problems we currently face.", "ko": "우리가 지금 마주한 문제들에 대한 해결책은 훨씬 더 많이 있을 수 있다."}, {"en": "It seems that Mother Nature has given us one more chance.", "ko": "대자연이 우리에게 한 번 더 기회를 준 것 같다."}, {"en": "In return, we need to look for more ways to keep the environment healthy and clean.", "ko": "그 보답으로 우리는 환경을 건강하고 깨끗하게 지킬 방법을 더 찾아야 한다."}, {"en": "If we do, the future of our planet may be bright after all.", "ko": "우리가 그렇게 한다면, 지구의 미래는 결국 밝을지도 모른다."}]}], "items": [{"id": "g1cs4-01", "p": 0, "s": 0, "w": "trouble", "h": "trouble", "pos": "명", "m": "곤경, 어려움", "form": "", "syn": [["difficulty", "어려움"], ["danger", "위험"]], "ant": [], "trap": [["effort", "노력, 수고", "trouble의 다른 뜻 '수고, 애씀'과 비슷한 말"]], "dis": [["success", "성공"], ["silence", "침묵"]], "other": [["수고, 애씀", "Thank you for taking the trouble.", "수고해 주셔서 고마워요."]], "tip": "in trouble = in danger, take the trouble(수고하다) 뜻도 체크", "story": "지구 환경이 위기에 빠진 얘기에서 나온 단어"}, {"id": "g1cs4-02", "p": 0, "s": 1, "w": "rising", "h": "rise", "pos": "동", "m": "오르다, 상승하다", "form": "동사 rise의 -ing형 (are rising, 지금 진행 중이라 진행형)", "syn": [["go up", "오르다"], ["increase", "증가하다"]], "ant": [["fall", "떨어지다"], ["drop", "떨어지다"]], "trap": [], "dis": [["borrow", "빌리다"]], "other": [], "tip": "rise(자동사) vs ra var D=JSON.parse(document.getElementById('data').textContent),IT=D.items,KEY='yk:'+D.key;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sget(k,d){try{var v=localStorage.getItem(KEY+':'+k);return v?JSON.parse(v):d}catch(e){return d}}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function sent(it){return D.pass[it.p].sents[it.s]}
function under(en,w){var i=en.indexOf(w);if(i<0){var re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),m=re.exec(en);if(!m)return esc(en);i=m.index;w=m[0]}var pre=en.slice(0,i).replace(/(^|\s)(a|an|A|An)\s$/,function(m,a,b){return a+(b[0]=='A'?'A(n)':'a(n)')+' '});return esc(pre)+'<u>'+esc(w)+'</u>'+esc(en.slice(i+w.length))}
function optsOf(it){var o=[];it.syn.forEach(function(x){o.push({w:x[0],m:x[1],g:'syn'})});it.ant.forEach(function(x){o.push({w:x[0],m:x[1],g:'ant'})});it.trap.forEach(function(x){o.push({w:x[0],m:x[1],g:'trap',r:x[2]})});it.dis.forEach(function(x){o.push({w:x[0],m:x[1],g:'dis'})});return o}
function mk(idx){return {k:idx,o:shuf(optsOf(IT[idx]).map(function(x,i){return i})),sel:{},rev:false}}
function isOK(q){var it=IT[q.k],o=optsOf(it);for(var i=0;i<o.length;i++){var s=!!q.sel[i];if(s!==(o[i].g=='syn'))return false}return true}

var S=null;

function nxt(){if(S.i>=S.q.length-1){var ok=S.q.filter(isOK).length,n=S.q.length;if(!S.only)sdel('prac');$('app').innerHTML='<div class="band '+(ok==n?'ok':'ng')+'">'+n+'개 중 '+ok+'개 정답<small>틀린 단어는 "틀린 것만 다시"에 모여 있어요</small></div><button class="go" onclick="home()">목록으로</button>';return}S.i++;save();rPrac()}

function chip(x,cls,tag,tc,extra){return '<button class="mw '+cls+'" onclick="speak(\''+x.w.replace(/'/g,"\\'")+'\')"><span class="e" lang="en" translate="no">'+esc(x.w)+'</span>'+(tag?'<i class="'+tc+'">'+tag+'</i>':'')+'<span class="k">'+esc(x.m)+'</span>'+(extra||'')+'</button>'}

 var L='',R='',T='',X='';
 o.forEach(function(x,i){var t=st(i),miss=(x.g=='syn'&&!q.sel[i])?' miss':'';
  if(x.g=='syn')L+=chip(x,'l'+miss,t[0],t[1]);

  else if(x.g=='trap')T+=chip(x,'t',t[0]||'함정',t[0]?t[1]:'m','<span class="tr">'+esc(x.r||'')+'</span>');
  else X+=chip(x,'d',t[0],t[1]);});
 var h='<div class="card"><div class="map"><svg></svg><div class="mc"><b lang="en" translate="no">'+esc(it.h)+'</b><em>본문 뜻: '+esc(it.m)+'</em></div>';
