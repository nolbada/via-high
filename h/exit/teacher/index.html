<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#6d28d9"><title>TEST 링크 모음 (선생님)</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-title" content="TEST 선생님"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1a1730;--sub:#5f5b78;--line:#e0ddee;--pri:#6d28d9;--g1:#b45309;--g2:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#120f1e;--card:#1b1730;--ink:#ece9f7;--sub:#a29dbd;--line:#2f2a4a;--pri:#b79cff;--g1:#fbbf24;--g2:#8ab4ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}h1{font-size:24px;margin:4px 0 2px}.sub{color:var(--sub);font-size:15px;margin-bottom:14px}
.sec{font-size:20px;font-weight:800;margin:22px 2px 8px;padding-bottom:4px;border-bottom:2px solid var(--pri)}
.sch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.sch h2{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}.badge{font-size:13px;color:#fff;border-radius:999px;padding:1px 10px;white-space:nowrap}
.g1 .badge{background:var(--g1)}.g2 .badge{background:var(--g2)}
.r{display:flex;align-items:center;gap:8px;padding:10px 4px;border-top:1px solid var(--line)}.r:first-of-type{border-top:0}
.r a{flex:1;display:block;color:inherit;text-decoration:none}.r small{color:var(--sub)}
.cp{font:inherit;font-size:14px;color:var(--pri);background:none;border:1px solid var(--pri);border-radius:999px;padding:1px 12px;cursor:pointer}
</style></head><body><div class="wrap"><h1>TEST 링크 모음 (선생님)</h1><div id="L"></div></div>
<script>
var DATA=[
 {sch:'주성고 2학년',b:'영어II',list:[
  {n:'주요 문장 15',s:'4과 · 한글 보고 영어로 말하기 · 선생님이 정답지로 판별',u:'jusung-go2/key15-teacher.html'}
 ]}
];
function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
document.getElementById('L').innerHTML=DATA.map(function(g){return '<div class="sch g1"><h2>'+e(g.sch)+' <span class="badge">'+e(g.b)+'</span></h2>'+g.list.map(function(c){return '<div class="r"><a href="../../'+c.u+'"><span>'+e(c.n)+'<br><small>'+e(c.s)+'</small></span></a></div>'}).join('')+'</div>'}).join('');
</script></body></html>
