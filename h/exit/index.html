<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#6d28d9"><title>TEST 링크 모음</title>
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="TEST"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1a1730;--sub:#5f5b78;--line:#e0ddee;--pri:#6d28d9;--g1:#b45309;--g2:#1d4ed8;--g3:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#120f1e;--card:#1b1730;--ink:#ece9f7;--sub:#a29dbd;--line:#2f2a4a;--pri:#b79cff;--g1:#fbbf24;--g2:#8ab4ff;--g3:#2dd4bf}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}h1{font-size:24px;margin:4px 0 2px}.sub{color:var(--sub);font-size:15px;margin-bottom:14px}
.sec{font-size:20px;font-weight:800;margin:22px 2px 8px;padding-bottom:4px;border-bottom:2px solid var(--pri)}
.sch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.sch h2{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}.badge{font-size:13px;color:#fff;border-radius:999px;padding:1px 10px;white-space:nowrap}
.g1 .badge{background:var(--g1)}.g2 .badge{background:var(--g2)}.g3 .badge{background:var(--g3)}
.r{display:flex;align-items:center;gap:8px;padding:10px 4px;border-top:1px solid var(--line)}.r:first-of-type{border-top:0}
.r a{flex:1;display:block;color:inherit;text-decoration:none}.r small{color:var(--sub)}

</style></head><body><div class="wrap"><h1>TEST 링크 모음</h1><div class="sub">선생님용 · 교재별 내신 테스트 주소 (학생에게 전달하지 않음)</div><div id="L"></div></div>
<script>
var H='https://nolbada.github.io/via-high/h/';
var DATA=[
 {sec:'고1',g:'g1',b:'고1',items:[
  {n:'공통영어2 미래엔(김)',s:'금천고 · 3과 4과',u:'geumcheon-go1/exit.html'},
  {n:'공통영어2 능률(민병천)',s:'청석고 · 3과 4과',u:'cheongseok-go1/exit.html'},
  {n:'공통영어2 능률(오선영)',s:'주성고 · 3과 4과',u:'jusung-go1/exit.html'}]},
 {sec:'고2',g:'g2',b:'고2',items:[
  {n:'영어II NE능률(오선영)',s:'금천고 · 4과',u:'geumcheon-go2/exit.html'},
  {n:'영어II NE능률(오선영)',s:'청석고 · 4과',u:'cheongseok-go2/exit.html'},
  {n:'영어II NE능률(오선영)',s:'주성고 · 4과 · 모의고사',u:'jusung-go2/exit.html'}]},
 {sec:'중2',g:'g3',b:'중2',items:[
  {n:'동아(윤정미) 2학기 기말',s:'용아중 · 7과',u:'https://nolbada.github.io/via-mid/m/yonga-mid2/exam.html'},
  {n:'2학기 기말',s:'금천중 · 5~8과',u:'https://nolbada.github.io/via-mid/m/geumcheon-mid2/exam.html'}]}
];
function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var U=[];
document.getElementById('L').innerHTML=DATA.map(function(S){return '<div class="sec">'+S.sec+'</div><div class="sch '+S.g+'">'+S.items.map(function(c){var ab=/^https?:/.test(c.u);U.push(ab?c.u:H+c.u);
 return '<div class="r"><a href="'+(ab?c.u:'../'+c.u)+'"><span><span class="badge" style="margin-right:6px">'+S.b+'</span>'+e(c.n)+'<br><small>'+e(c.s)+'</small></span></a></div>'}).join('')+'</div>'}).join('');

</script></body></html>
