<title>학습 스탬프</title>

<style>
:root{--bg:#faf4e6;--ink:#2a1f14;--sub:#7a6a58;--line:#d9c9a8;--red:#b3261e;--redL:#fbe9e6;--card:#fffdf7;--ok:#1f7a4d;--okL:#e6f4ec}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;font-size:16px}
.w{max-width:560px;margin:0 auto;padding:18px 14px 56px}
.top{padding:6px 2px 14px}
.nm{font-size:30px;font-weight:800;letter-spacing:-.5px}
.meta{margin-top:4px;color:var(--sub);font-size:15px}
.meta b{color:var(--red)}
.card{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px 14px 12px;margin:10px 0}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 8px;margin-top:6px}
.sp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#b9a98a;position:relative}
.sp.on{background:var(--red);border:2px solid var(--red);color:#fff}
.sp.on::after{content:"";position:absolute;width:11px;height:20px;border:solid #fff;border-width:0 4px 4px 0;transform:translate(0,-2px) rotate(45deg)}
.sp.on span{opacity:0}
.sp.eve{font-size:12px;letter-spacing:-.3px}
.cap{display:flex;justify-content:space-between;align-items:baseline}
.cap b{font-size:17px}.cap span{font-size:14px;color:var(--sub)}
.tile{background:var(--card);border:2px dashed var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.tile.now{border:2px solid var(--red);box-shadow:0 2px 0 var(--red)}
.tile.dn{border-color:#a8d4bb;background:var(--okL)}
.th{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.th b{font-size:20px}
.tag{font-size:13px;padding:3px 9px;border-radius:10px;border:1px solid var(--line);color:var(--sub);background:#fff}
.tile.now .tag{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.tile.dn .tag{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.rows{padding:0 8px 10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid #eee3cb}
.row:first-child{border-top:0}
.ck{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid #bfae8c;background:#fff;position:relative;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.on::after{content:"";position:absolute;left:8px;top:2px;width:8px;height:16px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.ck.auto{border-style:dashed}
.tx{flex:1;min-width:0}
.tx .a{font-weight:700;font-size:16.5px}
.tx .b{font-size:14.5px;color:var(--sub)}
.tx .p{font-size:13px;color:var(--red);font-weight:700}
.row.dn .a{color:#5f7f6e}
.op{flex:none;padding:9px 14px;border-radius:10px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.row.dn .op{background:#fff;color:var(--ink);border:1px solid var(--line)}
.bh{margin:22px 4px 0;font-size:15px;font-weight:800;color:var(--sub);letter-spacing:1px}
.bot{display:block;margin:26px 0 0;padding:14px;text-align:center;border-radius:12px;background:#fff;border:2px solid var(--ink);color:var(--ink);font-weight:800;text-decoration:none;font-size:17px}
</style>
</head>

function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var man={};try{man=JSON.parse(ls('qc:'+D.tok)||'{}')||{}}catch(e){man={}}
var dn={};
function rowDone(r){return r.auto?!!dn[r.k]:!!man[r.k]}
function tileDone(t){return t.rows.every(rowDone)}
function dday(){var p=D.iso.split('-'),a=new Date(+p[0],+p[1]-1,+p[2]),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function draw(){
  var tl=D.tiles,fin=tl.map(tileDone),nb=tl.filter(function(t){return !t.bonus}).length,nowI=fin.slice(0,nb).indexOf(false),cnt=fin.slice(0,nb).filter(Boolean).length,dd=dday();
  var h='<div class="top"><div class="nm">'+esc(D.name)+'</div><div class="meta">'+esc(D.sname)+' · '+esc(D.exam)+(dd>=0?' · <b>D-'+dd+'</b>':'')+'</div></div>';
  h+='<div class="card"><div class="cap"><b>'+(dd>=0?'D-'+dd+' ':'')+'학습 스탬프</b><span>'+cnt+' / '+nb+'회</span></div><div class="stamps">';
  tl.forEach(function(t,i){h+='<div class="sp'+(fin[i]?' on':'')+((t.eve||t.bonus)?' eve':'')+'"><span>'+(t.eve?'전날':(t.bonus?'추가':(i+1)))+'</span></div>'});
  h+='</div></div>';
  var bshown=false;
  tl.forEach(function(t,i){
    if(t.bonus&&!bshown){bshown=true;h+='<div class="bh">추가</div>'}
    var cls='tile'+(fin[i]?' dn':(i===nowI?' now':''));
    h+='<div class="'+cls+'"><div class="th"><b>'+esc(t.title)+'</b><span class="tag">'+(fin[i]?'완료':(i===nowI?'지금':(t.bonus?'추가':'예정')))+'</span></div><div class="rows">';
    t.rows.forEach(function(r,j){
      var d=rowDone(r);
      h+='<div class="row'+(d?' dn':'')+'"><button class="ck'+(d?' on':'')+(r.auto?' auto':'')+'" data-t="'+i+'" data-r="'+j+'" aria-label="완료"'+(r.auto?' disabled':'')+'></button>'
        +'<div class="tx"><div class="a">'+esc(r.a)+'</div><div class="b">'+esc(r.b)+'</div>'+(r.p&&!d?'<div class="p">유형 '+esc(r.p)+' 진행</div>':'')+'</div>'
        +'<a class="op" href="../'+esc(D.school)+'/'+esc(r.u)+'">열기</a></div>';
    });
    h+='</div></div>';
  });
  h+='<a class="bot" href="../'+esc(D.school)+'/index.html">목록으로</a>';
  app.innerHTML=h;
  var bs=app.querySelectorAll('.ck');
  Array.prototype.forEach.call(bs,function(b){b.onclick=function(){
    var r=D.tiles[+b.getAttribute('data-t')].rows[+b.getAttribute('data-r')];
    if(r.auto)return;
    if(man[r.k])delete man[r.k];else man[r.k]=1;
    ss('qc:'+D.tok,JSON.stringify(man));draw();
  }});
}
draw();
})();
</script>
</body>
</html>
