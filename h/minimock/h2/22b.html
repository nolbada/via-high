<title>고2 미니모의고사 22회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}

.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}

.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .at{font-size:13px;color:var(--sub)}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}

.qchip.o{border-color:var(--good);background:var(--goodbg)}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}

.cr{color:#A3102E;font-weight:700}

평해 보여도 매끄럽거나 고른 것은 아니라는 문장이고, (6)의 <b>Rather<\/b>(오히려)는 이 말을 받아 이어집니다", "둘 사이에 (1)이 들어가면 이 연결이 끊깁니다", "또 인력, 저항력, 마찰력은 (6)에서 처음 나오므로 (1)은 (6) 뒤에 와야 합니다."]}, {"n": "④", "t": "(7) They affect how smoothly or directly information can move … 의 앞", "g": "그것들은 정보가 전 세계 사이버 공간 안에서 지점에서 지점으로 얼마나 매끄럽거나 곧바로 움직일 수 있는지에 영향을 준다.", "ok": true, "e": ["(6)에서 아이스 링크 표면이 인력, 저항력, 마찰력을 만든다는 예가 나옵니다", "그 뒤에 (1)이 와서 온라인에도 여러 요인이 비슷한 마찰을 만들 수 있다고 말합니다", "이어지는 (7)의 <b>They<\/b>는 (1)의 요인들을 가리킵니다."]}, {"n": "⑤", "t": "(8) Thus, while the earth might appear to be increasingly flat … 의 앞", "g": "그러므로 국제적인 온라인 의사소통의 관점에서 지구가 점점 더 평평하게 보일 수도 있지만, 마찰이 없는 것과는 거리가 멀다.", "ok": false, "e": ["(6)은 아이스 링크의 예이고 (7)에서 사이버 공간 이야기로 넘어갑니다", "이 둘을 이어 주는 자리가 필요한데, ⑤는 (7) 뒤라서 그 자리가 아닙니다."]}], "tr": ["이와 매우 유사한 방식으로, 다수의 기술적, 정치적, 경제적, 문화적, 그리고 언어적인 요인이 존재할 수 있으며 비슷한 종류의 인력이나 저항력, 혹은 마찰력을 만들 수 있다.", "국제적인 오픈 온라인 액세스는 ‘평평한 지구’라는 은유를 사용하여 이해될 수 있다.", "이것은 하키 퍽이 아이스 링크의 평평한 표면 위를 미끄러지는 것만큼 쉽게 정보가 전 세계로 이동하는 세상을 나타낸다.", "그러나 이러한 틀은 특히 우리가 그 은유를 확장했을 때 오해의 소지가 있을 수 있다.", "아이스 링크를 가로질러 본 사람이라면 누구든 확인할 수 있듯이, 아이스 링크의 표면이 평평하고 트여 있는 것처럼 보인다고 해서 반드시 그 표면이 매끄럽고 고르다는 것을 의미하지는 않는다.", "오히려, 그런 표면은 그 위를 가로질러 움직이는 어떤 대상에게 어느 정도의 인력, 저항력 혹은 마찰력을 만드는 다수의 움푹 팬 부분과 금, 그리고 요철로 덮여 있는 경향이 있다.", "그것들은 정보가 전 세계 사이버 공간 안에서 지점에서 지점으로 얼마나 매끄럽거나 곧바로 움직일 수 있는지에 영향을 준다.", "그러므로 국제적인 온라인 의사소통의 관점에서 지구가 점점 더 평평하게 보일 수도 있지만, 그것은 마찰이 없는 것과는 거리가 멀다."], "ps": [{"n": 1, "ch": [{"e": "<b>In much the same way<\/b>,", "k": "그와 아주 비슷한 방식으로,"}, {"e": "an array of technological, political, economic, cultural, and linguistic factors", "k": "다수의 기술적, 정치적, 경제적, 문화적, 그리고 언어적인 요인이"}, {"e": "can exist", "k": "존재할 수 있으며"}, {"e": "and create a <b>similar<\/b> kind of pull or drag or friction.", "k": "비슷한 종류의 인력이나 저항력, 혹은 마찰력을 만들어 낼 수 있다."}], "easy": "온라인에서도 여러 요인들이, 아이스 링크에서처럼 끌어당기거나 막는 마찰 같은 것을 만들어 낼 수 있어요.", "gist": "주어진 문장. 앞에 나온 아이스 링크의 마찰 이야기를 온라인 세계로 옮겨 오는 연결 고리 역할을 한다."}, {"n": 2, "ch": [{"e": "Open international online access", "k": "국제적인 오픈 온라인 액세스는"} 다\u0002 / \u0001그것이 회사를 파산시킬지도 모른다고\u0002 / \u0001아무도 그것을 사지 않을 테니까\u0002", "core": "그것은 처음이었고 혁신적이었다.", "tags": ["주어 It + 동사 was + 보어 the first time (2형식). such ~ used = 관계부사절(that/when 생략): time 수식", "and: 절 병렬. 주어 it + 동사 was + 보어 revolutionary. so = 부사: revolutionary 수식 (so ~ that 구문)", "that ~ = 결과 부사절(so ~ that): revolutionary 수식 (결과). 안쪽: people worried", "worried의 내용절 (that 생략). 결과절 안에 포함됨", "because ~ = 부사절(이유): bankrupt 수식"], "steps": [{"t": "이 문장은 <b>절 + and + 절</b>이다. 두 번째 절에 so ~ that과 because가 겹쳐 길어 보인다."}, {"t": "첫 번째 절의 뼈대부터 찾는다.", "sub": ["S: It (그것)", "V: was (be ~이었다)", "C: the first time (처음 ~한 때)", "뼈대 = <b>It was the first time</b>", "<b>such a design had been used</b>는 time을 꾸미는 관계부사절(that 또는 when 생략)이다. '그런 디자인이 사용된'. 과거완료 수동태이다."]}, {"t": "두 번째 절의 뼈대는 <b>it was so revolutionary</b>이다.", "sub": ["S: it, V: was, C: revolutionary (혁명적인, 혁신적인)", "<b>so ~ that</b> (너무 ~해서 …하다) 구문이다."]}, {"t": "<b>that people worried ...</b>는 so ~ that의 <b>결과절</b>이다. 뼈대는 <b>people worried (that) it might bankrupt the company</b>이다.", "sub": ["worry = 걱정하다, bankrupt = 파산시키다, company = 회사", "worried 뒤 that은 생략되어 있다."]}, {"t": "<b>because nobody would buy it</b>은 <b>이유 부사절</b>이다. '아무도 그것을 사지 않을 것이므로'라는 뜻으로 might bankrupt를 꾸민다.", "sub": ["nobody = 아무도 ~않다"]}], "sum": "그런 디자인은 처음이었고, 너무 혁신적이어서 파산 걱정까지 나옴"}, {"i": "06", "q": "10", "s": "A-2", "title": "S+V+O + must have p.p.", "eng": "In his lifetime<sup>1</sup>, / he must have painted hundreds of houses, / inside and out<sup>2</sup>.", "notes": [["1", "in one's lifetime", "생애 동안"], ["2", "inside and out", "안팎으로"]], "lit": "그의 생애 동안 / 그는 수백 채의 집을 칠했음이 틀림없다 / 안팎으로", "nat": "평생에 걸쳐 그는 수백 채의 집을 안팎으로 칠했을 것이다.", "ana": "<b>must have p.p.</b>는 '~했음이 틀림없다'로 과거 사실에 대한 강한 추측이다. '~했어야 했다'라는 뜻의 should have p.p.와 혼동하지 않도록 주의한다.", "pe": "\u0001In his lifetime<sup>1</sup>\u0002, / he must have painted hundreds of houses, / \u0001inside and out<sup>2</sup>\u0002.", "pk": "\u0001그의 생애 동안\u0002 / 그는 수백 채의 집을 칠했음이 틀림없다 / \u0001안팎으로\u0002 ok his time<sup>1</sup> \u0001dipping<sup>2</sup> the brush in the paint bucket<sup>3</sup>\u0002 / and how he \u0001carefully\u0002 wiped off<sup>4</sup> both sides of the brush / \u0001as he pulled it out\u0002 / \u0001in order not to waste<sup>5</sup> any paint\u0002.", "pk": "그는 알아차렸다 / Henry가 \u0001붓을 페인트 통에 담그는 데\u0002 얼마나 공을 들이는지 / 그리고 붓의 양면을 얼마나 \u0001조심스럽게\u0002 훑어 내는지 / \u0001붓을 꺼내면서\u0002 / \u0001페인트를 조금도 낭비하지 않으려고\u0002", "core": "그는 Henry가 시간을 들이는지와 붓의 양면을 훑어 내는지를 알아차렸다.", "tags": ["주어 He + 동사 noticed (3형식)", "<b>how절</b> = noticed의 목적어(명사절). 안쪽: Henry took his time. dipping ~ = 분사구: took his time 수식 (take one's time -ing)", "and how ~ = 위 how절과 병렬인 목적어절. carefully = 부사: wiped off 수식", "as ~ = 부사절(시간): wiped off 수식", "in order not to waste = to부정사(부사적: 목적): wiped off 수식"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어가 how절 두 개의 병렬이라서 아주 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: He (그)", "V: noticed (notice 알아차리다의 과거형)", "O: how절 2개 (명사절, 알아차린 내용)", "뼈대 = <b>He noticed how ~ and how ~</b>"]}, {"t": "첫 번째 how절은 <b>how Henry took his time dipping the brush in the paint bucket</b>이다. 'Henry가 붓을 페인트 통에 담그는 데 얼마나 공을 들이는지'.", "sub": ["take one's time -ing = ~하는 데 시간을 들이다, dip = 담그다, brush = 붓, bucket = 통", "dipping ~은 took his time을 꾸미는 분사구이다."]}, {"t": "<b>and how he carefully wiped off both sides of the brush</b>는 두 번째 how절로 첫 번째와 병렬이다. '그가 붓의 양면을 얼마나 조심스럽게 닦아 내는지'.", "sub": ["wipe off = 닦아 내다, carefully = 조심스럽게, both sides = 양면"]}, {"t": "<b>as he pulled it out</b>는 <b>시간 부사절</b>이다. '붓을 꺼내면서'라는 뜻으로 wiped off를 꾸민다. it = the brush (붓)"}, {"t": "끝의 <b>in order not to waste any paint</b>는 <b>to부정사(부사적: 목적)</b>의 부정형이다. '페인트를 조금도 낭비하지 않으려고'. wiped off를 꾸민다.", "sub": ["waste = 낭비하다, in order not to V = V하지 않기 위해"]}], "sum": "Henry가 붓에 묻은 페인트를 아끼려 신경 쓰는 모습 알아챔"}], "qs": [{"q": "07", "type": "문장 삽입", "src": "2019년 9월 38번", "ans": "④", "tr": [["1", "[주어진 문장] 그와 아주 비슷한 방식으로, 다수의 기술적·정치적·경제적·문화적·언어적 요인들이 존재하면서 비슷한 종류의 끌어당김이나 저항, 마찰을 만들어 낼 수 있다."], ["2", "개방된 국제 온라인 접근은 '평평한 지구'라는 은유로 이해된다."], ["3", "그것은 하키 퍽이 아이스링크의 평평한 면을 미끄러지듯, 정보가 지구 전역을 그만큼 쉽게 오가는 세계를 나타낸다."], ["4", "그러나 이 틀은 오해를 부를 수 있다. 특히 그 비유를 더 밀고 나가면 그렇다."], ["5", "아이스링크를 건너 본 사람이면 누구나 알듯이, 링크 표면이 평평하고 트여 보인다고 해서 그 표면이 매끄럽거나 고르다는 뜻은 아니다."], ["6", "오히려 그런 표면은 그 위를 지나는 어떤 물체에든 어느 정도의 끌어당김이나 저항, 마찰을 일으키는 수많은 팬 자국과 갈라진 틈, 돌기로 덮여 있기 마련이다."], ["7", "[④] 그것들은 정보가 전 지구적 사이버 공간에서 지점과 지점 사이를 얼마나 매끄럽고 곧바르게 이동할 수 있는지에 영향을 미친다."], ["8", "따라서 국제 온라인 소통의 관점에서 보면 지구가 점점 더 평평해 보일지 몰라도, 결코 마찰이 없지는 않다."]], "evh": "5→[④]→6번 문장", "ev": [{"en": true, "h": "Rather, such surfaces tend to be covered by a wide array of dips and cracks and bumps that create a certain degree of pull or drag or friction ... / [주어진 문장] In much the same way, an array of technological, political, economic, cultural, and linguistic factors can exist and create a similar kind of pull or drag or friction. / They affect how smoothly or directly information can move ..."}, {"en": false, "h": "주어진 문장의 <b>In much the same way</b>(그와 아주 비슷한 방식으로)는 바로 앞에 '링크 표면의 팬 자국이 마찰을 만든다'는 물리적 비유가 나와야 성립한다. 또 그다음 문장의 주어 <b>They</b>가 받을 대상은 얼음판의 흠집이 아니라 <b>기술적·정치적 요인들</b>이어야 정보 이동 이야기로 넘어간다. 앞뒤가 모두 맞는 자리는 ④뿐이다."}], "opts": [{"n": "①", "t": "This framework, however, can be misleading ~ 앞", "a": false, "x": true, "trap": false, "e": "아직 마찰이라는 개념이 등장하지 않아 the same way가 가리킬 대상이 없다."}, {"n": "②", "t": "As anyone who has crossed an ice rink ~ 앞", "a": false, "x": true, "trap": false, "e": "비유를 확장하겠다고 예고만 한 자리라 아직 비교 대상이 없다."}, {"n": "③", "t": "Rather, such surfaces tend to be covered ~ 앞", "a": false, "x": true, "trap": true, "e": "여기서 끊으면 Rather가 반박할 앞말과 떨어져 흐름이 끊긴다."}, {"n": "④", "t": "They affect how smoothly or directly ~ 앞", "a": true, "x": false, "trap": false, "e": "얼음판의 마찰(앞) → 온라인의 여러 요인도 마찰을 만든다(주어진 문장) → 그것들이 정보 이동에 영향을 준다(뒤)로 They의 지시 대상이 딱 맞는다."}, {"n": "⑤", "t": "Thus, while the earth might appear ~ 앞", "a": false, "x": true, "trap": false, "e": "Thus로 결론을 내리는 자리라 새 요인을 처음 소개하기에는 늦다."}], "w": [["an array of", "다수의, 다양한"], ["friction", "마찰"], ["metaphor", "은유"], ["represent", "나타내다"], ["framework", "틀, 체계"], ["misleading", "오해를 일으키는"], ["extend", "확장하다"], ["not necessarily", "반드시 ~인 것은 아닌"], ["dip", "움푹 팬 곳"], ["bump", "튀어나온 곳"], ["a certain degree of", "어느 정도의"], ["frictionless", "마찰이 없는"]]}, {"q": "08", "type": "요약문 완성", "src": "2022년 6월 40번", "ans": "②", "tr": [["1", "수행 심리학의 커다란 아이러니는, 선수 한 사람 한 사람에게 할 수 있는 한 최대로 자신이 이길 것이라 믿으라고 가르친다는 점이다."], ["2", "누구도 의심하지 않는다. 누구도 자기 안의 회의에 빠지지 않는다."], ["3", "그것이 스포츠 심리학의 논리이다. 그러나 이길 수 있는 사람은 단 한 명뿐이다. 그것이 스포츠의 논리이다."], ["4", "과학자와 운동선수의 차이에 주목하라."], ["5", "의심은 과학자의 밑천이다."], ["6", "발전은 이론을 반박하는 증거에 집중하고 그에 맞춰 이론을 개선함으로써 이루어진다."], ["7", "회의는 과학적 진보의 로켓 연료다."], ["8", "그러나 운동선수에게 의심은 독이다."], ["9", "발전은 증거를 무시함으로써 이루어진다. 그것은 의심과 불확실성에 흔들리지 않는 사고방식을 만드는 일이다."], ["10", "다시 말하지만, 이성적인 관점에서 이것은 다름 아닌 미친 짓이다."], ["11", "질 가능성이 얼마든지 있다는 것을 알면서도 왜 선수는 자신이 이길 것이라고 스스로 확신해야 하는가?"], ["12", "이기기 위해서는 자기 믿음을 증거가 아니라 마음이 유용하게 감당해 낼 수 있는 것에 맞춰야 하기 때문이다."], ["13", "[요약문] 과학적 진보를 이루려면 (A)회의적인 태도가 필요한 과학자들과 달리, 스포츠 심리학은 성공하려면 선수들이 이길 수 있을지에 대한 불확실감을 (B)없애야 한다고 말한다."]], "evh": "5·7·9번 문장", "ev": [{"en": true, "h": "Doubt is a scientist's stock in trade. ... Skepticism is the rocket fuel of scientific advance. ... it is about creating a mindset that is immune to doubt and uncertainty."}, {"en": false, "h": "(A)는 <b>Doubt is a scientist's stock in trade</b>와 <b>Skepticism is the rocket fuel</b>에서 곧장 나오므로 skeptical(회의적인)이다. (B)는 선수 쪽 설명인 <b>immune to doubt and uncertainty</b>(의심과 불확실성에 흔들리지 않는)에서 나오므로 '없애다'인 eliminate가 맞다."}], "opts": [{"n": "①", "t": "confident … keep", "a": false, "x": true, "trap": false, "e": "과학자에게 필요한 것은 자신감이 아니라 의심이다."}, {"n": "②", "t": "skeptical … eliminate", "a": true, "x": false, "trap": false, "e": "과학자 = 회의적 태도, 선수 = 불확실감 제거라는 본문의 대비를 그대로 옮겼다."}, {"n": "③", "t": "arrogant … express", "a": false, "x": true, "trap": false, "e": "과학자를 오만하다고 말한 적이 없고, 선수도 불안을 표현하는 것이 아니라 지운다."}, {"n": "④", "t": "critical … keep", "a": false, "x": true, "trap": true var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제예요. <b>In much the same way</b>(그와 아주 비슷한 방식으로) 앞에는 <b>얼음판의 마찰</b>이, 뒤에는 <b>They</b>(그것들)가 그 요인들을 받아야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>In much the same way</mark>, an array of technological, political, economic, cultural, and linguistic factors can exist and create a similar kind of <mark>pull or drag or friction</mark>.</div><p class=\"ko\"><mark>그와 아주 비슷한 방식으로</mark>, 다수의 기술적, 정치적, 경제적, 문화적, 언어적 요인이 존재하며 비슷한 종류의 <mark>인력이나 저항력, 혹은 마찰력</mark>을 만들어 낼 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>“아주 비슷한 방식”이 받을 원래 장면 = 얼음판 흠집이 만드는 마찰</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 앞 문장 (④ 바로 앞)</span><div class=\"en\">Rather, such surfaces tend to be covered by a wide array of dips and cracks and bumps that create a certain degree of <mark>pull or drag or friction</mark> …</div><p class=\"ko\">오히려 그런 표면은 어느 정도의 <mark>인력, 저항력 혹은 마찰력</mark>을 만드는 다수의 움푹 팬 부분과 금, 요철로 덮여 있는 경향이 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>They(그것들) = 주어진 문장의 기술적·정치적·문화적 요인들</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 뒤 문장 (④ 바로 뒤)</span><div class=\"en\"><mark>They</mark> affect how smoothly or directly information can move from point to point in global cyberspace.</div><p class=\"ko\"><mark>그것들(= 요인들)은</mark> 전 세계 사이버 공간에서 정보가 얼마나 매끄럽게 혹은 곧바로 움직일 수 있는지에 영향을 준다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>얼음판 흠집이 퍽에 마찰을 만듦</span><span><em>주어진 문장</em>그와 비슷하게 여러 요인도 마찰을 만듦</span><span><em>7번</em>그 요인들이 정보 이동에 영향</span></div><div class=\"ck-eq\">⇒ 얼음판 마찰 → 비슷한 요인의 마찰 → 그 요인들(They), 세 고리가 다 맞는 자리 = ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">6번 문장과 7번 문장 사이<small>7번 They(그것들)가 받을 “요인들”이 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">5번 “링크 표면이 매끈하지 않다” 뒤라 그럴듯하지만, 6번 Rather(오히려)와 such surfaces(그런 표면)는 5번의 링크 표면을 바로 받아야 해요. 중간에 끼면 그 고리가 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">4번 This framework(이러한 틀)는 3번의 ‘평평한 지구’ 그림을 바로 받아야 해요. 게다가 얼음판 마찰이 아직 안 나와서 In much the same way(그와 아주 비슷하게)가 받을 대상이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">얼음판이 매끈하지 않다는 얘기(5·6번)가 나오기도 전이라, 무엇과 “비슷한 마찰”인지 알 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">7번 문장과 8번 문장 사이</span><span class=\"why\">이러면 7번 They(그것들)가 6번의 얼음 흠집을 가리켜, 얼음 흠집이 사이버 공간 정보를 막는다는 이상한 말이 돼요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In much the same way</span>,</div><div class=\"k\"><span class=\"cw\">그와 아주 비슷한 방식으로</span>,</div></div><div class=\"rc\"><div class=\"e\">an array of technological, political, economic, cultural, and linguistic factors</div><div class=\"k\">다수의 기술적, 정치적, 경제적, 문화적, 그리고 언어적인 요인이</div></div><div class=\"rc\"><div class=\"e\">can exist</div><div class=\"k\">존재할 수 있으며</div></div><div class=\"rc ckc\"><div class=\"e\">and create a similar kind of <span class=\"cw\">pull or drag or friction</span>.</div><div class=\"k\">비슷한 종류의 <span class=\"cw\">인력이나 저항력, 혹은 마찰력을</span> 만들어 낼 수 있다.</div></div><div class=\"rnat\">이와 매우 유사한 방식으로, 다수의 기술적, 정치적, 경제적, 문화적, 그리고 언어적인 요인이 존재할 수 있으며 비슷한 종류의 인력이나 저항력, 혹은 마찰력을 만들 수 있다.</div><div class=\"rst\">〈주어진 문장〉 <b>그와 아주 비슷하게</b>(In much the same way) 인터넷에도 언어·문화·기술 같은 걸림돌이 있어 메시지를 붙잡아요. = 지문의 요인들이 만드는 마찰.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Open international online access</div><div class=\"k\">국제적인 오픈 온라인 액세스는</div></div><div class=\"rc\"><div class=\"e\">is understood</div><div class=\"k\">이해될 수 있다</div></div><div class=\"rc\"><div class=\"e\">using the metaphor “flat earth.”</div><div class=\"k\">‘평평한 지구’라는 은유를 사용하여.</div></div><div class=\"rnat\">국제적인 오픈 온라인 액세스는 ‘평평한 지구’라는 은유를 사용하여 이해될 수 있다.</div><div class=\"rst\">외국 게임 친구와 인터넷으로 바로 연결되면, 세상이 평평한 운동장처럼 느껴져요. = 지문의 ‘평평한 지구’ 은유예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It represents a world</div><div class=\"k\">이것은 세상을 나타낸다</div></div><div class=\"rc\"><div class=\"e\">where information moves across the globe</div><div class=\"k\">정보가 전 세계로 이동하는</div></div><div class=\"rc\"><div class=\"e\">as easily as a hockey puck seems to slide</div><div class=\"k\">하키 퍽이 미끄러지는 것처럼 보이는 만큼 쉽게</div></div><div class=\"rc\"><div class=\"e\">across an ice rink’s flat surface.</div><div class=\"k\">아이스 링크의 평평한 표면 위를.</div></div><div class=\"rnat\">이것은 하키 퍽이 아이스 링크의 평평한 표면 위를 미끄러지는 것만큼 쉽게 정보가 전 세계로 이동하는 세상을 나타낸다.</div><div class=\"rst\">내 메시지가 얼음판 위 하키 퍽처럼 쓱 미끄러져 지구 반대편 친구에게 가요. = 지문 3번, 정보가 쉽게 이동하는 세상이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This framework, however,</div><div class=\"k\">그러나 이러한 틀은</div></div><div class=\"rc\"><div class=\"e\">can be misleading —</div><div class=\"k\">오해의 소지가 있을 수 있다 —</div></div><div class=\"rc\"><div class=\"e\">especially if we extend the metaphor.</div><div class=\"k\">특히 우리가 그 은유를 확장했을 때.</div></div><div class=\"rnat\">그러나 이러한 틀은 특히 우리가 그 은유를 확장했을 때 오해의 소지가 있을 수 있다.</div><div class=\"rst\"><b>그러나</b>(however) 이 비유를 너무 밀고 나가면 착각이 생겨요. 지문도 이 틀이 오해를 부를 수 있다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">As anyone who has crossed an ice rink can confirm,</div><div class=\"k\">아이스 링크를 가로질러 본 사람이라면 누구든 확인할 수 있듯이,</div></div><div class=\"rc\"><div class=\"e\">just because the surface of the rink appears flat and open</div><div class=\"k\">아이스 링크의 표면이 평평하고 트여 있는 것처럼 보인다고 해서</div></div><div class=\"rc\"><div class=\"e\">does not necessarily mean</div><div class=\"k\">반드시 ~을 의미하지는 않는다</div></div><div class=\"rc\"><div class=\"e\">that surface is smooth or even.</div><div class=\"k\">그 표면이 매끄럽고 고르다는 것을.</div></div><div class=\"rnat\">아이스 링크를 가로질러 본 사람이라면 누구든 확인할 수 있듯이, 아이스 링크의 표면이 평평하고 트여 있는 것처럼 보인다고 해서 반드시 그 표면이 매끄럽고 고르다는 것을 의미하지는 않는다.</div><div class=\"rst\">스케이트장에 가 본 친구는 알아요. 얼음판이 평평해 보여도 꼭 매끈하진 않아요. = 지문의 링크 표면 이야기.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Rather,</div><div class=\"k\">오히려,</div></div><div class=\"rc\"><div class=\"e\">such surfaces tend to be covered by</div><div class=\"k\">그런 표면은 ~으로 덮여 있는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">a wide array of dips and cracks and bumps</div><div class=\"k\">다수의 움푹 팬 부분과 금, 그리고 요철로,</div></div><div class=\"rc ckc\"><div class=\"e\">that create a certain degree of <span class=\"cw\">pull or drag or friction</span></div><div class=\"k\">어느 정도의 <span class=\"cw\">인력, 저항력 혹은 마찰력을</span> 만드는</div></div><div class=\"rc\"><div class=\"e\">on any object moving across it.</div><div class=\"k\">그 위를 가로질러 움직이는 어떤 대상에게.</div></div><div class=\"rnat\">오히려, 그런 표면은 그 위를 가로질러 움직이는 어떤 대상에게 어느 정도의 인력, 저항력 혹은 마찰력을 만드는 다수의 움푹 팬 부분과 금, 그리고 요철로 덮여 있는 경향이 있다.</div><div class=\"rst\"><b>오히려</b>(Rather) 얼음판엔 팬 곳·금·튀어나온 곳이 있어 퍽을 붙잡아요. = 지문의 <b>마찰</b>을 만드는 흠집들이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">They</span> affect</div><div class=\"k\"><span class=\"cw\">그것들(= 요인들)은</span> 영향을 준다</div></div><div class=\"rc\"><div class=\"e\">how smoothly or directly information can move</div><div class=\"k\">정보가 얼마나 매끄럽게 혹은 곧바로 움직일 수 있는지에</div></div><div class=\"rc\"><div class=\"e\">from point to point in global cyberspace.</div><div class=\"k\">전 세계 사이버 공간 안에서 지점에서 지점으로.</div></div><div class=\"rnat\">그것들은 정보가 전 세계 사이버 공간 안에서 지점에서 지점으로 얼마나 매끄럽거나 곧바로 움직일 수 있는지에 영향을 준다.</div><div class=\"rst\"><b>그것들</b>(They)이 내 메시지가 얼마나 매끄럽게 가는지 좌우해요. = 지문 7번, 얼음 흠집이 아니라 주어진 문장의 요인들이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Thus,</div><div class=\"k\">그러므로</div></div><div class=\"rc\"><div class=\"e\">while the earth might appear to be increasingly flat</div><div class=\"k\">지구가 점점 더 평평하게 보일 수도 있지만,</div></div><div class=\"rc\"><div class=\"e\">from the perspective of international online communication,</div><div class=\"k\">국제적인 온라인 의사소통의 관점에서,</div></div><div class=\"rc\"><div class=\"e\">it is far from frictionless.</div><div class=\"k\">그것은 마찰이 없는 것과는 거리가 멀다.</div></div><div class=\"rnat\">그러므로 국제적인 온라인 의사소통의 관점에서 지구가 점점 더 평평하게 보일 수도 있지만, 그것은 마찰이 없는 것과는 거리가 멀다.</div><div class=\"rst\">그래서 인터넷 세상은 평평해 보여도 마찰이 없는 건 전혀 아니에요. = 지문의 결론 far from frictionless(마찰이 없는 것과는 거리가 먼).</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"an array of\" data-m=\"다수의, 다양한\"><b>an array of</b>다수의, 다양한</button><button type=\"button\" class=\"wdb\" data-w=\"friction\" data-m=\"마찰\"><b>friction</b>마찰</button><button type=\"button\" class=\"wdb\" data-w=\"metaphor\" data-m=\"은유\"><b>metaphor</b>은유</button><button type=\"button\" class=\"wdb\" data-w=\"misleading\" data-m=\"오해를 일으키는\"><b>misleading</b>오해를 일으키는</button><button type=\"button\" class=\"wdb\" data-w=\"a certain degree of\" data-m=\"어느 정도의\"><b>a certain degree of</b>어느 정도의</button><button type=\"button\" class=\"wdb\" data-w=\"frictionless\" data-m=\"마찰이 없는\"><b>frictionless</b>마찰이 없는</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심을 <b>말만 바꿔 옮긴 것</b>이에요. <b>Unlike</b>(~와 달리)로 과학자와 선수를 맞세웠으니, 과학자 쪽 단서로 (A), 선수 쪽 단서로 (B)를 한 칸씩 짝지으세요.</p><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 과학자 쪽 첫 단서</span><div class=\"en\"><mark>Doubt</mark> is a scientist’s stock in trade.</div><p class=\"ko\"><mark>의심은</mark> 과학자의 일상적인 업무이다.</p></div><div class=\"ck-via\"><i>▼</i><span>Doubt(의심)를 Skepticism(회의론)으로 다시 말해 줌</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 문장 · (A) 결정적 단서</span><div class=\"en\"><mark>Skepticism</mark> is the rocket fuel of scientific advance.</div><p class=\"ko\"><mark>회의론은</mark> 과학적 진보의 추진 연료이다.</p></div><div class=\"ck-via\"><i>▼</i><span>11번 But(하지만)으로 선수 쪽으로 넘어감</span></div><div class=\"ck-step key\"><span class=\"lab\">12번 문장 · (B) 결정적 단서</span><div class=\"en\">Progress is made by ignoring the evidence; it is about creating a mindset that is <mark>immune to doubt and uncertainty</mark>.</div><p class=\"ko\">진보는 증거를 무시함으로써 만들어진다. 그것은 <mark>의심과 불확실성에 영향을 받지 않는</mark> 사고방식을 만드는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>Skepticism(회의론) → (A) skeptical(회의적인), immune to doubt(의심에 흔들리지 않는) → (B) eliminate(없애다)</span></div><div class=\"ck-step\"><span class=\"lab\">요약문 (16번) · 짝 맞추기</span><div class=\"en\">Unlike scientists whose <mark>skeptical</mark> attitude is needed to make scientific progress, sports psychology says that to succeed, athletes must <mark>eliminate</mark> feelings of uncertainty about whether they can win.</div><p class=\"ko\">과학적 진보를 위해 <mark>회의적인</mark> 태도가 요구되는 과학자들과 달리, 스포츠 심리학은 선수들이 이길 수 있는지에 대한 불확실한 감정을 <mark>없애야</mark> 한다고 말한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">skeptical 회의적인 … eliminate 없애는<small>10번 Skepticism(회의론) → skeptical(회의적인), 12번 immune to doubt(의심에 흔들리지 않는) → eliminate(없애다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">critical 비판적인 … keep 유지하는</span><span class=\"why\">(A) critical(비판적인)은 skeptical(회의적인)과 비슷해서 끌려요. 하지만 (B) keep(유지하다)이면 불확실한 감정을 간직하라는 말이 돼, 2번 No man doubts(누구도 의심하지 않는다)와 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">confident 자신 있는 … keep 유지하는</span><span class=\"why\">둘 다 틀려요. 8번은 과학자에게 Doubt(의심)가 필수라고 했지 자신감이 아니고, 12번은 선수가 불확실함에 immune(영향받지 않는)해야 하니 유지가 아니라 없애야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">arrogant 오만한 … express 표현하는</span><span class=\"why\">둘 다 틀려요. 과학자가 오만하다는 말은 지문에 없고, 불확실한 감정을 드러내라는 건 12번 immune to doubt(의심에 흔들리지 않는)와 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">stubborn 고집 센 … eliminate 없애는</span><span class=\"why\">(B)는 맞지만 (A)가 틀려요. 고집 세게 버티는 건 선수 쪽 모습이고, 9번 과학자는 이론을 반박하는 증거에 집중해 이론을 고쳐요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The great irony of performance psychology</div><div class=\"k\">퍼포먼스 심리학의 큰 아이러니는</div></div><div class=\"rc\"><div class=\"e\">is that it teaches each sportsman to believe,</div><div class=\"k\">그것(= 퍼포먼스 심리학)이 각 운동선수가 믿도록 가르친다는 것이다,</div></div><div class=\"rc\"><div class=\"e\">as far as he is able,</div><div class=\"k\">능력이 있는 한,</div></div><div class=\"rc\"><div class=\"e\">that he will win.</div><div class=\"k\">이길 것이라고.</div></div><div class=\"rnat\">퍼포먼스 심리학의 큰 아이러니는 각 운동선수들이 능력이 있는 한, 이길 것이라고 믿도록 가르친다는 것이다.</div><div class=\"rst\">체육대회 달리기 대표 민수에게 코치님은 “넌 무조건 이겨”라고 믿게 해요. = 지문의 스포츠 심리학이 가르치는 <b>아이러니</b>(irony 역설).</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">No man doubts.</div><div class=\"k\">어느 누구도 의심하지 않는다.</div></div><div class=\"rnat\">어느 누구도 의심하지 않는다.</div><div class=\"rst\">민수는 “내가 질까?” 하고 <b>의심하지 않아요</b>. 지문도 어느 선수도 의심하지 않는다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">No man indulges his inner skepticism.</div><div class=\"k\">어느 누구도 내면의 회의에 빠지지 않는다.</div></div><div class=\"rnat\">어느 누구도 내면의 회의에 빠지지 않는다.</div><div class=\"rst\">속으로 슬쩍 드는 걱정에도 빠지지 않아요. = 지문의 내면의 회의(skepticism)에 빠지지 않음.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">That is the logic of sports psychology.</div><div class=\"k\">그것이 스포츠 심리학의 논리이다.</div></div><div class=\"rnat\">그것이 스포츠 심리학의 논리이다.</div><div class=\"rst\">이게 코치님의 방식이에요. 지문은 이것을 스포츠 심리학의 논리라고 불러요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">But only one man can win.</div><div class=\"k\">하지만 오직 한 사람만이 이길 ‘수 있다’.</div></div><div class=\"rnat\">하지만 오직 한 사람만이 이길 ‘수 있다’.</div><div class=\"rst\"><b>하지만</b>(But) 결승선에 1등으로 들어오는 건 한 명뿐이에요. 지문도 오직 한 사람만 이길 수 있다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">That is the logic of sport.</div><div class=\"k\">그것이 스포츠의 논리이다.</div></div><div class=\"rnat\">그것이 스포츠의 논리이다.</div><div class=\"rst\">모두가 이긴다고 믿어도 1등은 하나, 그게 지문이 말하는 스포츠의 논리예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Note the difference</div><div class=\"k\">차이점을 주목하라</div></div><div class=\"rc\"><div class=\"e\">between a scientist and an athlete.</div><div class=\"k\">과학자와 운동선수 사이의.</div></div><div class=\"rnat\">과학자와 운동선수의 차이점을 주목하라.</div><div class=\"rst\">이제 과학 동아리 지은이와 민수를 비교해 봐요. 지문도 과학자와 선수의 차이에 주목하라고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Doubt</span> is a scientist’s stock in trade.</div><div class=\"k\"><span class=\"cw\">의심은</span> 과학자의 일상적인 업무이다.</div></div><div class=\"rnat\">의심은 과학자의 일상적인 업무이다.</div><div class=\"rst\">지은이는 실험 결과를 늘 “정말 맞아?” 하고 <b>의심</b>(Doubt)해요. = 의심은 과학자의 일상 업무라는 지문의 말.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Progress is made by focusing on the evidence</div><div class=\"k\">진보는 증거에 집중함으로써 이루어진다</div></div><div class=\"rc\"><div class=\"e\">that refutes a theory</div><div class=\"k\">이론을 반박하는</div></div><div class=\"rc\"><div class=\"e\">and by improving the theory accordingly.</div><div class=\"k\">그리고 그에 따라 이론을 개선함으로써.</div></div><div class=\"rnat\">진보는 이론을 반박하는 증거에 집중하고 그에 따라 이론을 개선함으로써 이루어진다.</div><div class=\"rst\">예상과 다른 결과가 나오면 거기에 집중해서 가설을 고쳐요. = 지문의 반박 증거에 집중해 이론을 개선함.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Skepticism</span> is the rocket fuel of scientific advance.</div><div class=\"k\"><span class=\"cw\">회의론은</span> 과학적 진보의 추진 연료이다.</div></div><div class=\"rnat\">회의론은 과학적 진보의 추진 연료이다.</div><div class=\"rst\">그래서 지은이에겐 <b>회의</b>(Skepticism)가 실력을 키우는 로켓 연료예요. 요약문 (A) 회의적인(skeptical)의 근거예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">But doubt, to an athlete, is poison.</div><div class=\"k\">하지만 운동선수에게 의심은 독이다.</div></div><div class=\"rnat\">하지만 운동선수에게 의심은 독이다.</div><div class=\"rst\"><b>하지만</b>(But) 출발선에 선 민수에게 의심은 독이에요. 지문도 선수에게 의심은 독이라고 해요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><div class=\"rc\"><div class=\"e\">Progress is made by ignoring the evidence;</div><div class=\"k\">진보는 증거를 무시함으로써 만들어진다;</div></div><div class=\"rc\"><div class=\"e\">it is about creating a mindset</div><div class=\"k\">그것은 사고방식을 만드는 것이다</div></div><div class=\"rc ckc\"><div class=\"e\">that is <span class=\"cw\">immune to doubt and uncertainty</span>.</div><div class=\"k\"><span class=\"cw\">의심과 불확실성에 영향을 받지 않는</span>.</div></div><div class=\"rnat\">진보는 증거를 무시함으로써 만들어진다. 즉 (운동선수에게) 진보란 의심과 불확실성에 영향을 받지 않는 사고방식을 만드는 것이다.</div><div class=\"rst\">민수는 불리한 기록도 무시하고 의심에 <b>흔들리지 않는</b>(immune to) 마음을 만들어요. 요약문 (B) 없애다(eliminate)의 근거예요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Just to reiterate:</div><div class=\"k\">다시 한번 되풀이하자면,</div></div><div class=\"rc\"><div class=\"e\">From a rational perspective,</div><div class=\"k\">이성적인 시각에서 보면,</div></div><div class=\"rc\"><div class=\"e\">this is nothing less than crazy.</div><div class=\"k\">이건 미친 짓이나 다름없다.</div></div><div class=\"rnat\">다시 한번 되풀이하자면, 이성적인 시각에서 보면 이건 미친 짓이나 다름없다.</div><div class=\"rst\">다시 말하면, 머리로 따져 보면 이건 미친 짓 같아요. = 이성적 시각에선 미친 짓이라는 지문의 말.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Why should an athlete convince himself</div><div class=\"k\">왜 운동선수는 스스로 확신해야 하는가</div></div><div class=\"rc\"><div class=\"e\">he will win</div><div class=\"k\">이길 것이라고</div></div><div class=\"rc\"><div class=\"e\">when he knows</div><div class=\"k\">알면서도</div></div><div class=\"rc\"><div class=\"e\">that there is every possibility he will lose?</div><div class=\"k\">질 가능성이 얼마든지 있다는 것을?</div></div><div class=\"rnat\">왜 운동선수는 자신이 질 거라는 모든 가능성이 있다는 것을 알면서도 이길 것이라고 확신해야 하는가?</div><div class=\"rst\">질 수도 있다는 걸 아는 민수가 왜 “난 이긴다”고 믿어야 할까요? 지문도 똑같이 물어요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Because, to win,</div><div class=\"k\">왜냐하면 이기기 위해서는</div></div><div class=\"rc\"><div class=\"e\">one must proportion one’s belief,</div><div class=\"k\">자신의 신념을 할당해야 하기 때문이다,</div></div><div class=\"rc\"><div class=\"e\">not to the evidence,</div><div class=\"k\">증거에 맞추는 것이 아니라</div></div><div class=\"rc\"><div class=\"e\">but to whatever the mind can usefully get away with.</div><div class=\"k\">마음이 유용하게 해낼 수 있는 무엇이든지 간에.</div></div><div class=\"rnat\">선수는 이기기 위해서 증거가 아니라 마음이 유용하게 해낼 수 있는 무엇이든지 간에 자신의 신념을 할당해야 하기 때문이다.</div><div class=\"rst\">이기려면 기록(증거)이 아니라 마음이 힘을 내는 쪽에 믿음을 맞춰야 하니까요. = 지문 15번의 답이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc ckc\"><div class=\"e\">Unlike scientists whose <span class=\"cw\">skeptical attitude</span> is needed</div><div class=\"k\"><span class=\"cw\">회의적인 태도가</span> 요구되는 과학자들과는 달리,※ 문제지엔 빈칸 (A)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">to make scientific progress,</div><div class=\"k\">과학적 진보를 이루기 위해,</div></div><div class=\"rc\"><div class=\"e\">sports psychology says</div><div class=\"k\">스포츠 심리학은 말한다</div></div><div class=\"rc ckc\"><div class=\"e\">that to succeed, athletes must <span class=\"cw\">eliminate feelings of uncertainty</span></div><div class=\"k\">성공하기 위해서는 운동선수들이 <span class=\"cw\">불확실한 감정을 없애야</span> 한다고※ 문제지엔 빈칸 (B)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">about whether they can win.</div><div class=\"k\">그들이 이길 수 있는지에 대한.</div></div><div class=\"rnat\">[요약문] 과학적 진보를 이루기 위해 (A)회의적인 태도가 요구되는 과학자들과는 달리, 스포츠 심리학은 운동선수들이 성공하기 위해서는 그들이 이길 수 있는지에 대한 불확실한 감정을 (B)없애야 한다고 한다.</div><div class=\"rst\">정리: 지은이(과학자)는 <b>회의적</b>(skeptical)이어야 하고, 민수(선수)는 불확실한 마음을 <b>없애야</b>(eliminate) 해요. = 요약문.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"irony\" data-m=\"아이러니, 역설\"><b>irony</b>아이러니, 역설</button><button type=\"button\" class=\"wdb\" data-w=\"indulge\" data-m=\"(감정에) 빠지다\"><b>indulge</b>(감정에) 빠지다</button><button type=\"button\" class=\"wdb\" data-w=\"skepticism\" data-m=\"회의, 의심\"><b>skepticism</b>회의, 의심</button><button type=\"button\" class=\"wdb\" data-w=\"stock in trade\" data-m=\"밑천, 필수 도구\"><b>stock in trade</b>밑천, 필수 도구</button><button type=\"button\" class=\"wdb\" data-w=\"refute\" data-m=\"반박하다\"><b>refute</b>반박하다</button><button type=\"button\" class=\"wdb\" data-w=\"immune to\" data-m=\"~에 영향받지 않는\"><b>immune to</b>~에 영향받지 않는</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>를 찾는 문제. 원칙 → <b>For example</b>(예를 들어)로 사례 시작 → <b>Instead</b>(대신에)로 당시 관례 뒤집기 → <b>courage</b>(용기)로 평가하는 순서로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">His job is to <mark>filter through that noise</mark> until he gets to the essence.</div><p class=\"ko\">그의 일은 본질에 도달할 때까지 <mark>그 불필요한 것을 걸러내는 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>주어진 글의 원칙(걸러 내기)에 대한 사례를 엶</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 첫 번째 고리</span><div class=\"en\"><mark>For example</mark>, when he was the lead designer at a company, he was asked to collaborate on a record player.</div><p class=\"ko\"><mark>예를 들어</mark>, 그가 한 회사의 수석 디자이너였을 때, 레코드 플레이어를 공동 제작하도록 요청받았다.</p></div><div class=\"ck-via\"><i>▼</i><span>(B) 끝의 당시 표준(나무 덮개·거실 가구)을 뒤집음</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 두 번째 고리</span><div class=\"en\"><mark>Instead</mark>, he and his team removed the clutter and designed a player with a clear plastic cover on the top and nothing more.</div><p class=\"ko\"><mark>대신에</mark>, 그와 그의 팀은 불필요한 것을 제거했고 맨 위에 투명한 플라스틱 덮개만 있는 플레이어를 디자인했다.</p></div><div class=\"ck-via\"><i>▼</i><span>(C)의 “파산할까 걱정”까지 무릅쓴 결정을 용기로 평가</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 세 번째 고리</span><div class=\"en\"><mark>It took courage</mark>, as it always does, to eliminate the non-essential.</div><p class=\"ko\">항상 그러하듯, 본질적이지 않은 것을 제거하는 데에는 <mark>용기가 필요했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(B) – (C) – (A)<small>사례 시작 → 관례 뒤집기 → 용기와 결과, 세 고리가 다 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">(B)는 당시 표준(나무 덮개)만 말했는데 바로 (A)의 “없애는 용기·인기”가 나와요. (C)의 Instead(대신에)도 (A)의 “모두가 따름” 뒤라 뒤집을 대상이 어긋나요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글 바로 뒤 (A)의 It took courage(용기가 필요했다)는 무슨 일에 용기가 들었는지 앞에 없어요. 레코드 플레이어 얘기가 시작도 안 됐어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C)의 Instead(대신에)가 뒤집을 “당시 표준”이 앞에 없고, he and his team(그와 그의 팀)이 무슨 일을 맡았는지도 모른 채 시작돼요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">(C)가 먼저 오면 Instead(대신에)가 받을 관례가 없어요. For example(예를 들어)로 사례를 여는 (B)가 주어진 글 바로 뒤에 와야 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Dieter Rams, a German industrial designer,</div><div class=\"k\">독일의 산업 디자이너인 Dieter Rams는</div></div><div class=\"rc\"><div class=\"e\">is driven by the idea</div><div class=\"k\">그 생각에 이끌린다</div></div><div class=\"rc\"><div class=\"e\">that almost everything is noise.</div><div class=\"k\">거의 모든 것이 잡음(불필요한 것)이라는.</div></div><div class=\"rnat\">독일의 산업 디자이너인 Dieter Rams는 거의 모든 것이 잡음(불필요한 것)이라는 생각에 이끌린다.</div><div class=\"rst\">우리 반 꾸미기 담당 서진이는 “거의 다 <b>잡음</b>(noise 불필요한 것)이야”라고 생각해요. = 지문의 Dieter Rams(디터 람스)가 이끌리는 생각.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">He believes</div><div class=\"k\">그는 믿는다</div></div><div class=\"rc\"><div class=\"e\">very few things are essential.</div><div class=\"k\">아주 적은 수의 것들만이 본질적이라고.</div></div><div class=\"rnat\">그는 아주 적은 수의 것들만이 본질적이라고 믿는다.</div><div class=\"rst\">서진이는 정말 필요한 건 아주 몇 개뿐이라고 믿어요. 지문도 그가 본질적인 것은 아주 적다고 믿는대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc ckc\"><div class=\"e\">His job is to <span class=\"cw\">filter through that noise</span></div><div class=\"k\">그의 일은 <span class=\"cw\">그 불필요한 것을 걸러내는 것이다</span></div></div><div class=\"rc\"><div class=\"e\">until he gets to the essence.</div><div class=\"k\">그가 본질에 도달할 때까지.</div></div><div class=\"rnat\">그의 일은 그가 본질에 도달할 때까지 그 불필요한 것을 걸러내는 것이다.</div><div class=\"rst\">그래서 서진이 일은 쓸데없는 걸 <b>걸러 내고</b> 꼭 필요한 것만 남기는 거예요. = 지문의 잡음을 걸러 본질에 도달하기.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A) <span class=\"cw\">It took courage</span>, as it always does,</div><div class=\"k\">(A) 항상 그러하듯, <span class=\"cw\">용기가 필요했다</span>,</div></div><div class=\"rc\"><div class=\"e\">to eliminate the non-essential.</div><div class=\"k\">본질적이지 않은 것을 제거하는 데에는.</div></div><div class=\"rnat\">(A) 항상 그러하듯, 본질적이지 않은 것을 제거하는 것은 용기를 필요로 했다.</div><div class=\"rst\">필요 없는 걸 빼는 데는 늘 그렇듯 <b>용기</b>가 필요했어요. = 지문 (A)의 It took courage(용기가 필요했다).</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">5번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A) By the sixties</div><div class=\"k\">(A) 60년대까지</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">this aesthetic</span> started to become more and more popular.</div><div class=\"k\"><span class=\"cw\">이 미학은</span> 점점 더 인기 있어지기 시작했다.</div></div><div class=\"rnat\">(A) 60년대까지 이 미학은 점점 더 인기 있어지기 시작했다.</div><div class=\"rst\">시간이 지나자 <b>이</b> 깔끔한 스타일(this aesthetic 이 미학)이 점점 인기를 얻었어요. = 60년대에 인기를 얻었다는 지문의 말.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A) In time</div><div class=\"k\">(A) 시간이 흘러</div></div><div class=\"rc\"><div class=\"e\">it became the design</div><div class=\"k\">그것은 디자인이 되었다</div></div><div class=\"rc\"><div class=\"e\">every other record player followed.</div><div class=\"k\">모든 다른 레코드 플레이어가 따르는.</div></div><div class=\"rnat\">(A) 시간이 흘러 그것은 모든 다른 레코드 플레이어가 따르는 디자인이 되었다.</div><div class=\"rst\">결국 다른 반들도 모두 따라 하는 디자인이 됐어요. = 모든 레코드 플레이어가 따르는 디자인이 됐다는 지문의 결말.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">For example</span>,</div><div class=\"k\">(B) <span class=\"cw\">예를 들어</span>,</div></div><div class=\"rc\"><div class=\"e\">when he was the lead designer at a company,</div><div class=\"k\">그가 한 회사에서 수석 디자이너였을 때,</div></div><div class=\"rc\"><div class=\"e\">he was asked to collaborate on a record player.</div><div class=\"k\">그는 레코드 플레이어를 공동 제작하도록 요청받았다.</div></div><div class=\"rnat\">(B) 예를 들어, 그가 한 회사에서 수석 디자이너였을 때, 그는 레코드 플레이어를 공동 제작하도록 요청받았다.</div><div class=\"rst\"><b>예를 들어</b>(For example) 서진이가 학급 티셔츠 디자인을 맡았어요. 지문에선 그가 레코드 플레이어 공동 제작을 맡아요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B) The norm at the time was</div><div class=\"k\">(B) 당시의 표준은 ~이었다</div></div><div class=\"rc\"><div class=\"e\">to cover the turntable in a solid wooden lid</div><div class=\"k\">턴테이블을 단단한 나무 덮개로 가리는 것</div></div><div class=\"rc\"><div class=\"e\">or even to incorporate the player</div><div class=\"k\">혹은 심지어 플레이어를 통합하는 것</div></div><div class=\"rc\"><div class=\"e\">into a piece of living room furniture.</div><div class=\"k\">거실 가구의 일부로.</div></div><div class=\"rnat\">(B) 당시의 표준은 턴테이블을 단단한 나무 덮개로 가리는 것이거나 심지어는 플레이어를 거실 가구의 일부로 통합하는 것이었다.</div><div class=\"rst\">그때 반 티셔츠는 그림·글씨를 잔뜩 넣는 게 당연했어요. = 나무 덮개·거실 가구로 꾸미던 당시 표준(norm).</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">9번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">Instead</span>,</div><div class=\"k\">(C) <span class=\"cw\">대신에</span>,</div></div><div class=\"rc\"><div class=\"e\">he and his team removed the clutter</div><div class=\"k\">그와 그의 팀은 불필요한 것을 제거했고</div></div><div class=\"rc\"><div class=\"e\">and designed a player</div><div class=\"k\">플레이어를 디자인했다</div></div><div class=\"rc\"><div class=\"e\">with a clear plastic cover on the top and nothing more.</div><div class=\"k\">맨 위에 투명한 플라스틱 덮개가 있고 그 외에 아무것도 없는.</div></div><div class=\"rnat\">(C) 대신에, 그와 그의 팀은 불필요한 것을 제거하였고 맨 위에 투명한 플라스틱 덮개가 있고 그 외에 아무것도 없는 플레이어를 디자인했다.</div><div class=\"rst\"><b>대신에</b>(Instead) 서진이는 장식을 다 빼고 작은 로고 하나만 남겼어요. = 지문의 투명 덮개 하나뿐인 플레이어.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">10번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C) It was the first time</div><div class=\"k\">(C) 그것은 처음이었다</div></div><div class=\"rc\"><div class=\"e\">such a design had been used,</div><div class=\"k\">그러한 디자인이 사용된 것이,</div></div><div class=\"rc\"><div class=\"e\">and it was so revolutionary</div><div class=\"k\">그리고 그것은 너무 혁신적이어서</div></div><div class=\"rc\"><div class=\"e\">that people worried it might bankrupt the company</div><div class=\"k\">사람들은 그것이 회사를 파산시킬지도 모른다고 걱정했다</div></div><div class=\"rc\"><div class=\"e\">because nobody would buy it.</div><div class=\"k\">아무도 그것을 사지 않을 것이기 때문에.</div></div><div class=\"rnat\">(C) 그러한 디자인이 사용된 것은 처음이었고, 그것이 너무 혁신적이어서 아무도 그것을 사지 않을 것이기 때문에 그것이 회사를 파산시킬지도 모른다고 사람들은 걱정했다.</div><div class=\"rst\">이런 티셔츠는 처음이라 “아무도 안 입으면 어떡해?” 하는 걱정이 나왔어요. = 회사가 파산할까 걱정했다는 지문의 말.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"filter through\" data-m=\"~을 걸러 내다\"><b>filter through</b>~을 걸러 내다</button><button type=\"button\" class=\"wdb\" data-w=\"essence\" data-m=\"본질\"><b>essence</b>본질</button><button type=\"button\" class=\"wdb\" data-w=\"collaborate on\" data-m=\"~을 공동으로 작업하다\"><b>collaborate on</b>~을 공동으로 작업하다</button><button type=\"button\" class=\"wdb\" data-w=\"norm\" data-m=\"관례, 표준\"><b>norm</b>관례, 표준</button><button type=\"button\" class=\"wdb\" data-w=\"clutter\" data-m=\"불필요한 것\"><b>clutter</b>불필요한 것</button><button type=\"button\" class=\"wdb\" data-w=\"revolutionary\" data-m=\"혁신적인\"><b>revolutionary</b>혁신적인</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 순서는 <b>사건의 고리</b>를 잇는 문제예요. 아빠 소개 → <b>Once</b>(언젠가) 도우러 간 날 → <b>At one point</b>(어느 순간) 지켜봄 → <b>Finally</b>(마침내) 조언 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝 · (A)(6)</span><div class=\"en\">No one could paint a wall like him, which is why (a) his services were <mark>always in demand</mark>.</div><p class=\"ko\">누구도 그처럼 벽을 칠하지 못했고, 그것이 그의 일이 <mark>항상 수요가 많았던</mark> 이유였다.</p></div><div class=\"ck-via\"><i>▼</i><span>(A)의 아빠 소개 뒤, 구체적인 하루를 여는 시간 표현</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리</span><div class=\"en\"><mark>Once, while in college</mark>, Henry went to help his father paint a house.</div><p class=\"ko\"><mark>언젠가, 대학 시절에</mark>, Henry는 아버지가 집을 칠하는 것을 도우러 갔다.</p></div><div class=\"ck-via\"><i>▼</i><span>(C) 끝 “아빠 벽 세 개 대 아들 한 개” 차이 → 아빠가 멈추고 아들을 지켜봄</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 두 번째 고리</span><div class=\"en\"><mark>At one point</mark>, Henry’s father stopped working and watched him.</div><p class=\"ko\"><mark>어느 순간</mark>, Henry의 아버지는 하던 일을 멈추고 그를 바라보았다.</p></div><div class=\"ck-via\"><i>▼</i><span>(D)에서 조심만 하는 아들을 다 지켜본 뒤 → 조언</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 세 번째 고리</span><div class=\"en\"><mark>Finally</mark>, his father offered Henry some advice.</div><p class=\"ko\"><mark>마침내</mark>, 그의 아버지가 Henry에게 몇 가지 조언을 하였다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(C) – (D) – (B)<small>도우러 간 날 → 지켜봄 → 조언, 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(C) 뒤 바로 조언(B)도 그럴듯하지만, 조언은 아빠가 아들의 조심스러운 칠을 지켜본 (D) 뒤라야 해요. (B) 끝에 이미 일을 이어 간 아빠가 (D)에서 또 멈추는 꼴이 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(A) 바로 뒤에 (B)의 Finally(마침내) 조언이 나와요. 아들이 도우러 오기도 전이라 무엇을 보고 하는 조언인지 알 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">(A) 바로 뒤 (D)에서 아빠가 아들을 지켜보는데, 아들이 도우러 간 Once(언젠가) 장면 (C)가 아직 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(D)가 (C)보다 먼저면, 대학 시절 도우러 간 날(C)이 시작되기도 전에 둘이 이미 함께 칠하고 있게 돼요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A) Henry’s father was a house painter.</div><div class=\"k\">(A) Henry의 아버지는 가옥 페인트공이었다.</div></div><div class=\"rnat\">(A)(1) Henry의 아버지는 가옥 페인트공이었다.</div><div class=\"rst\">Henry(헨리)의 아빠는 남의 집에 페인트칠을 해 주는 페인트공이에요. = 지문 (A)의 첫 문장, 주인공 소개예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">In his lifetime,</div><div class=\"k\">평생 동안,</div></div><div class=\"rc\"><div class=\"e\">he must have painted hundreds of houses,</div><div class=\"k\">그는 수백 채의 집을 칠했음에 틀림없다,</div></div><div class=\"rc\"><div class=\"e\">inside and out.</div><div class=\"k\">안팎으로.</div></div><div class=\"rnat\">(A)(2) 평생 동안, 그는 수백 채의 집을 안팎으로 칠했음에 틀림없다.</div><div class=\"rst\">아빠는 평생 수백 채의 집을 안팎으로 칠했을 거예요. = 지문의 must have painted(칠했음에 틀림없다).</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">He was a happy, outgoing man</div><div class=\"k\">그는 행복하고 외향적인 사람이었다</div></div><div class=\"rc\"><div class=\"e\">who made friends easily.</div><div class=\"k\">쉽게 친구를 사귀는.</div></div><div class=\"rnat\">(A)(3) 그는 쉽게 친구를 사귀었던 행복하고, 외향적인 사람이었다.</div><div class=\"rst\">아빠는 늘 즐겁고 친구도 쉽게 사귀는 <b>외향적인</b>(outgoing) 사람이에요. = 지문 (A)(3).</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">It wasn’t hard to tell</div><div class=\"k\">~라고 말하는 것은 어렵지 않았다</div></div><div class=\"rc\"><div class=\"e\">that he loved his work</div><div class=\"k\">그가 자신의 일을 사랑했다고</div></div><div class=\"rc\"><div class=\"e\">as well as his life.</div><div class=\"k\">삶뿐 아니라.</div></div><div class=\"rnat\">(A)(4) 그가 자신의 삶뿐 아니라 일도 사랑했다고 말하는 것은 어렵지 않았다.</div><div class=\"rst\">누가 봐도 아빠는 삶뿐 아니라 자기 일도 정말 사랑했어요. = 지문 (A)(4).</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(A)(5)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">He was also an excellent painter.</div><div class=\"k\">그는 또한 뛰어난 페인트공이었다.</div></div><div class=\"rnat\">(A)(5) 그는 또한 뛰어난 페인트공이었다.</div><div class=\"rst\">게다가 실력도 최고인 페인트공이었어요. = 지문 (A)(5).</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(A)(6)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">No one could paint a wall like him,</div><div class=\"k\">누구도 그처럼 벽을 칠하지 못했고,</div></div><div class=\"rc\"><div class=\"e\">which is why</div><div class=\"k\">그것이 바로 이유이다</div></div><div class=\"rc\"><div class=\"e\">(a) his services were always in demand.</div><div class=\"k\">(a)그(= Henry의 아버지)의 일이 항상 수요가 많았던.</div></div><div class=\"rnat\">(A)(6) 누구도 그처럼 벽을 칠하지 못했고, 그것이 (a)그(Henry의 아버지)의 일이 항상 수요가 많았던 이유였다.</div><div class=\"rst\">아무도 아빠처럼 벽을 못 칠해서 (a) 아빠를 찾는 사람이 늘 많았어요. = 지문의 in demand(수요가 많은). (A)는 아빠 소개로 끝나요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">(C)(1)번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">Once, while in college,</span></div><div class=\"k\">(C) <span class=\"cw\">언젠가, 대학 시절에,</span></div></div><div class=\"rc\"><div class=\"e\">Henry went to help his father</div><div class=\"k\">Henry는 아버지를 도우러 갔다</div></div><div class=\"rc\"><div class=\"e\">paint a house.</div><div class=\"k\">집을 칠하는 것을.</div></div><div class=\"rnat\">(C)(1) 언젠가, 대학 시절에, Henry는 아버지가 집을 칠하는 것을 도와드리러 갔다.</div><div class=\"rst\"><b>언젠가</b>(Once) 대학생 Henry(헨리)가 아빠의 페인트칠을 도우러 갔어요. = 구체적인 하루가 시작되는 (C), (A) 바로 뒤예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(C)(2)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Henry was working inside</div><div class=\"k\">Henry는 집 안쪽에서 일하고 있었고</div></div><div class=\"rc\"><div class=\"e\">and noticed how skilled his father was</div><div class=\"k\">자신의 아버지가 얼마나 노련한지 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">at quickly applying a quality coat of paint</div><div class=\"k\">재빠르게 양질의 페인트칠을 발라 나가는 데 있어</div></div><div class=\"rc\"><div class=\"e\">to a wall.</div><div class=\"k\">벽에.</div></div><div class=\"rnat\">(C)(2) Henry는 집 안쪽에서 작업 중이었고 자신의 아버지가 벽에 재빠르게 양질의 페인트칠을 발라나가는 데 있어 얼마나 노련한지 알게 되었다.</div><div class=\"rst\">집 안에서 일하던 Henry(헨리)는 아빠가 벽을 빠르고 멋지게 칠하는 솜씨에 놀랐어요. = 지문 (C)(2).</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(C)(3)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">As a matter of fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">while carrying on a conversation with the homeowner,</div><div class=\"k\">집주인과 대화를 계속해 나가면서,</div></div><div class=\"rc\"><div class=\"e\">laughing the whole time,</div><div class=\"k\">시종일관 웃으며,</div></div><div class=\"rc\"><div class=\"e\">his father applied generous amounts of paint</div><div class=\"k\">그의 아버지는 넉넉한 양의 페인트를 발랐다</div></div><div class=\"rc\"><div class=\"e\">to the wall.</div><div class=\"k\">벽에.</div></div><div class=\"rnat\">(C)(3) 사실, 그의 아버지는 시종일관 웃으며 집주인과 대화를 계속해 나가면서 벽에는 넉넉한 양의 페인트를 발랐다.</div><div class=\"rst\">사실 아빠는 집주인과 웃으며 수다를 떨면서 페인트를 <b>넉넉히</b>(generous amounts) 발랐어요. = 지문 (C)(3).</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(C)(4)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(c) He painted three walls</div><div class=\"k\">(c)그(= Henry의 아버지)는 벽 세 개를 칠하였다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">compared to Henry’s one.</span></div><div class=\"k\"><span class=\"cw\">Henry의 하나에 비해.</span></div></div><div class=\"rnat\">(C)(4) (c)그(Henry의 아버지)는 Henry의 하나에 비해(Henry가 벽을 하나 칠할 동안) 세 개의 벽을 칠하였다.</div><div class=\"rst\">(c) 아빠가 벽 세 개를 칠할 동안 Henry(헨리)는 겨우 한 개였어요. = 지문 (C)(4)의 속도 차이.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">(D)(1)번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc ckc\"><div class=\"e\">(D) <span class=\"cw\">At one point,</span></div><div class=\"k\">(D) <span class=\"cw\">어느 순간,</span></div></div><div class=\"rc\"><div class=\"e\">Henry’s father stopped working</div><div class=\"k\">Henry의 아버지는 하던 일을 멈추고</div></div><div class=\"rc\"><div class=\"e\">and watched him.</div><div class=\"k\">그(= Henry)를 바라보았다.</div></div><div class=\"rnat\">(D)(1) 어느 순간, Henry의 아버지는 하던 일을 멈추고 그(Henry)를 바라보았다.</div><div class=\"rst\"><b>어느 순간</b>(At one point) 아빠가 일을 멈추고 Henry(헨리)를 지켜봤어요. = (C)의 속도 차이 뒤에 오는 (D)예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(D)(2)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(d) He noticed</div><div class=\"k\">(d)그(= Henry의 아버지)는 유심히 보았다</div></div><div class=\"rc\"><div class=\"e\">how Henry took his time dipping the brush</div><div class=\"k\">Henry가 얼마나 천천히 붓을 담그는지</div></div><div class=\"rc\"><div class=\"e\">in the paint bucket</div><div class=\"k\">페인트 양동이에</div></div><div class=\"rc\"><div class=\"e\">and how he carefully wiped off both sides of the brush</div><div class=\"k\">그리고 그(= Henry)가 붓의 양쪽을 얼마나 조심스럽게 닦아내는지</div></div><div class=\"rc\"><div class=\"e\">as he pulled it out</div><div class=\"k\">붓을 꺼내면서</div></div><div class=\"rc\"><div class=\"e\">in order not to waste any paint.</div><div class=\"k\">페인트를 조금이라도 낭비하지 않기 위해.</div></div><div class=\"rnat\">(D)(2) (d)그(Henry의 아버지)는 Henry가 얼마나 천천히 페인트 양동이에 붓을 담그는지 그리고 그(Henry)가 붓을 꺼내면서 페인트를 조금이라도 낭비하지 않기 위해 붓의 양쪽을 얼마나 조심스럽게 닦아내는지 유심히 보았다.</div><div class=\"rst\">(d) 아빠 눈에 Henry(헨리)는 붓을 천천히 담그고, 한 방울도 아까워 양쪽을 꼼꼼히 닦아 내요. = 지문 (D)(2).</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(D)(3)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Henry then spread a thin coat of paint</div><div class=\"k\">그런 다음 Henry는 페인트를 얇게 펴 발랐다</div></div><div class=\"rc\"><div class=\"e\">on the wall</div><div class=\"k\">벽에</div></div><div class=\"rc\"><div class=\"e\">without spilling a drop.</div><div class=\"k\">한 방울도 흘리지 않고.</div></div><div class=\"rnat\">(D)(3) 그런 다음 Henry는 (페인트를) 한 방울도 흘리지 않고 벽에 페인트를 얇게 펴 발랐다.</div><div class=\"rst\">그다음 Henry(헨리)는 <b>한 방울도 안 흘리고</b>(without spilling a drop) 얇게 칠했어요. = 지문 (D)(3).</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(D)(4)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">It was a slow, tedious process,</div><div class=\"k\">그것은 느리고, 지루한 과정이었지만,</div></div><div class=\"rc\"><div class=\"
