took his time dipping the brush in the paint bucket …</div><p class=\"ko\"><mark>(d)그</mark>는 Henry가 얼마나 천천히 페인트 양동이에 붓을 담그는지 유심히 보았다 … → 아버지</p></div><div class=\"ck-via\"><i>▼</i><span>같은 문장에 his father(그의 아버지)가 따로 나옴 → (e)는 아버지가 아님</span></div><div class=\"ck-step key\"><span class=\"lab\">(e) · (D)(4) · 결정적 단서</span><div class=\"en\">It was a slow, tedious process, but <mark>(e) he</mark> dared not laugh or “kid around” for fear of making a mess and <mark>embarrassing his father</mark>.</div><p class=\"ko\">느리고 지루한 과정이었지만, <mark>(e)그</mark>는 칠을 망쳐서 <mark>아버지를 난처하게 할까</mark> 두려워 감히 웃거나 농담하지 못했다. → Henry</p></div><div class=\"ck-via\"><i>▼</i><span>조언을 마치고 돌아서서 집주인과 대화를 이어 간 사람 = 아버지</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · (B)(6)</span><div class=\"en\">With that, <mark>(b) he</mark> turned and applied a thick coat of paint to the wall, resuming his conversation with the homeowner.</div><p class=\"ko\">그 말과 함께, <mark>(b)그</mark>는 돌아서서 벽에 페인트를 두툼하게 발랐고, 집주인과의 대화를 이어갔다. → 아버지</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(e) he 그 = Henry(헨리)<small>같은 문장에 his father(그의 아버지)가 따로 나와서, 아버지를 걱정하는 사람은 아들이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) He 그 = 아버지</span><span class=\"why\">뒤에 Henry(헨리)가 바로 나와서 헷갈리지만, (D)(1)에서 일을 멈추고 지켜본 아버지가 아들을 유심히 보는 장면이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) his 그의 = 아버지</span><span class=\"why\">(A)는 처음부터 끝까지 페인트공 아버지 소개예요. 누구보다 벽을 잘 칠해서 일이 많았던 사람은 아버지예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) he 그 = 아버지</span><span class=\"why\">(B)(1)에서 조언한 사람이 아버지이고, (C)(3)에서도 집주인과 대화하던 사람이 아버지예요. 그 대화를 이어 간 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) He 그 = 아버지</span><span class=\"why\">Henry’s one(헨리의 하나)과 비교하니 Henry(헨리)가 아닌 사람, 즉 (C)(2)에서 솜씨가 좋다고 한 아버지예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><div class=\"rc\"><div class=\"e\">(A) Henry’s father was a house painter.</div><div class=\"k\">(A) Henry의 아버지는 가옥 페인트공이었다.</div></div><div class=\"rnat\">(A)(1) Henry의 아버지는 가옥 페인트공이었다.</div><div class=\"rst\">Henry(헨리)의 아빠는 남의 집에 페인트칠을 해 주는 페인트공이에요. = 지문 (A)의 첫 문장, 주인공 소개예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><div class=\"rc\"><div class=\"e\">In his lifetime,</div><div class=\"k\">평생 동안,</div></div><div class=\"rc\"><div class=\"e\">he must have painted hundreds of houses,</div><div class=\"k\">그는 수백 채의 집을 칠했음에 틀림없다,</div></div><div class=\"rc\"><div class=\"e\">inside and out.</div><div class=\"k\">안팎으로.</div></div><div class=\"rnat\">(A)(2) 평생 동안, 그는 수백 채의 집을 안팎으로 칠했음에 틀림없다.</div><div class=\"rst\">아빠는 평생 수백 채의 집을 안팎으로 칠했을 거예요. = 지문의 must have painted(칠했음에 틀림없다).</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><div class=\"rc\"><div class=\"e\">He was a happy, outgoing man</div><div class=\"k\">그는 행복하고 외향적인 사람이었다</div></div><div class=\"rc\"><div class=\"e\">who made friends easily.</div><div class=\"k\">쉽게 친구를 사귀는.</div></div><div class=\"rnat\">(A)(3) 그는 쉽게 친구를 사귀었던 행복하고, 외향적인 사람이었다.</div><div class=\"rst\">아빠는 늘 즐겁고 친구도 쉽게 사귀는 <b>외향적인</b>(outgoing) 사람이에요. = 지문 (A)(3).</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><div class=\"rc\"><div class=\"e\">It wasn’t hard to tell</div><div class=\"k\">~라고 말하는 것은 어렵지 않았다</div></div><div class=\"rc\"><div class=\"e\">that he loved his work</div><div class=\"k\">그가 자신의 일을 사랑했다고</div></div><div class=\"rc\"><div class=\"e\">as well as his life.</div><div class=\"k\">삶뿐 아니라.</div></div><div class=\"rnat\">(A)(4) 그가 자신의 삶뿐 아니라 일도 사랑했다고 말하는 것은 어렵지 않았다.</div><div class=\"rst\">누가 봐도 아빠는 삶뿐 아니라 자기 일도 정말 사랑했어요. = 지문 (A)(4).</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(A)(5)번</span><div class=\"rc\"><div class=\"e\">He was also an excellent painter.</div><div class=\"k\">그는 또한 뛰어난 페인트공이었다.</div></div><div class=\"rnat\">(A)(5) 그는 또한 뛰어난 페인트공이었다.</div><div class=\"rst\">게다가 실력도 최고인 페인트공이었어요. = 지문 (A)(5).</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(A)(6)번</span><div class=\"rc\"><div class=\"e\">No one could paint a wall like him,</div><div class=\"k\">누구도 그처럼 벽을 칠하지 못했고,</div></div><div class=\"rc\"><div class=\"e\">which is why</div><div class=\"k\">그것이 바로 이유이다</div></div><div class=\"rc\"><div class=\"e\">(a) his services were always in demand.</div><div class=\"k\">(a)그(= Henry의 아버지)의 일이 항상 수요가 많았던.</div></div><div class=\"rnat\">(A)(6) 누구도 그처럼 벽을 칠하지 못했고, 그것이 (a)그(Henry의 아버지)의 일이 항상 수요가 많았던 이유였다.</div><div class=\"rst\">아무도 아빠처럼 벽을 못 칠해서 (a) 아빠를 찾는 사람이 늘 많았어요. = 지문의 in demand(수요가 많은). (A)는 아빠 소개로 끝나요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(C)(1)번</span><div class=\"rc\"><div class=\"e\">(C) Once, while in college,</div><div class=\"k\">(C) 언젠가, 대학 시절에,</div></div><div class=\"rc\"><div class=\"e\">Henry went to help his father</div><div class=\"k\">Henry는 아버지를 도우러 갔다</div></div><div class=\"rc\"><div class=\"e\">paint a house.</div><div class=\"k\">집을 칠하는 것을.</div></div><div class=\"rnat\">(C)(1) 언젠가, 대학 시절에, Henry는 아버지가 집을 칠하는 것을 도와드리러 갔다.</div><div class=\"rst\"><b>언젠가</b>(Once) 대학생 Henry(헨리)가 아빠의 페인트칠을 도우러 갔어요. = 구체적인 하루가 시작되는 (C), (A) 바로 뒤예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(C)(2)번</span><div class=\"rc\"><div class=\"e\">Henry was working inside</div><div class=\"k\">Henry는 집 안쪽에서 일하고 있었고</div></div><div class=\"rc\"><div class=\"e\">and noticed how skilled his father was</div><div class=\"k\">자신의 아버지가 얼마나 노련한지 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">at quickly applying a quality coat of paint</div><div class=\"k\">재빠르게 양질의 페인트칠을 발라 나가는 데 있어</div></div><div class=\"rc\"><div class=\"e\">to a wall.</div><div class=\"k\">벽에.</div></div><div class=\"rnat\">(C)(2) Henry는 집 안쪽에서 작업 중이었고 자신의 아버지가 벽에 재빠르게 양질의 페인트칠을 발라나가는 데 있어 얼마나 노련한지 알게 되었다.</div><div class=\"rst\">집 안에서 일하던 Henry(헨리)는 아빠가 벽을 빠르고 멋지게 칠하는 솜씨에 놀랐어요. = 지문 (C)(2).</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(C)(3)번</span><div class=\"rc\"><div class=\"e\">As a matter of fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">while carrying on a conversation with the homeowner,</div><div class=\"k\">집주인과 대화를 계속해 나가면서,</div></div><div class=\"rc\"><div class=\"e\">laughing the whole time,</div><div class=\"k\">시종일관 웃으며,</div></div><div class=\"rc\"><div class=\"e\">his father applied generous amounts of paint</div><div class=\"k\">그의 아버지는 넉넉한 양의 페인트를 발랐다</div></div><div class=\"rc\"><div class=\"e\">to the wall.</div><div class=\"k\">벽에.</div></div><div class=\"rnat\">(C)(3) 사실, 그의 아버지는 시종일관 웃으며 집주인과 대화를 계속해 나가면서 벽에는 넉넉한 양의 페인트를 발랐다.</div><div class=\"rst\">사실 아빠는 집주인과 웃으며 수다를 떨면서 페인트를 <b>넉넉히</b>(generous amounts) 발랐어요. = 지문 (C)(3).</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(C)(4)번</span><div class=\"rc\"><div class=\"e\">(c) He painted three walls</div><div class=\"k\">(c)그(= Henry의 아버지)는 벽 세 개를 칠하였다</div></div><div class=\"rc\"><div class=\"e\">compared to Henry’s one.</div><div class=\"k\">Henry의 하나에 비해.</div></div><div class=\"rnat\">(C)(4) (c)그(Henry의 아버지)는 Henry의 하나에 비해(Henry가 벽을 하나 칠할 동안) 세 개의 벽을 칠하였다.</div><div class=\"rst\">(c) 아빠가 벽 세 개를 칠할 동안 Henry(헨리)는 겨우 한 개였어요. = 지문 (C)(4)의 속도 차이.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(D)(1)번</span><div class=\"rc\"><div class=\"e\">(D) At one point,</div><div class=\"k\">(D) 어느 순간,</div></div><div class=\"rc\"><div class=\"e\">Henry’s father stopped working</div><div class=\"k\">Henry의 아버지는 하던 일을 멈추고</div></div><div class=\"rc\"><div class=\"e\">and watched him.</div><div class=\"k\">그(= Henry)를 바라보았다.</div></div><div class=\"rnat\">(D)(1) 어느 순간, Henry의 아버지는 하던 일을 멈추고 그(Henry)를 바라보았다.</div><div class=\"rst\"><b>어느 순간</b>(At one point) 아빠가 일을 멈추고 Henry(헨리)를 지켜봤어요. = (C)의 속도 차이 뒤에 오는 (D)예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(D)(2)번</span><div class=\"rc\"><div class=\"e\">(d) He noticed</div><div class=\"k\">(d)그(= Henry의 아버지)는 유심히 보았다</div></div><div class=\"rc\"><div class=\"e\">how Henry took his time dipping the brush</div><div class=\"k\">Henry가 얼마나 천천히 붓을 담그는지</div></div><div class=\"rc\"><div class=\"e\">in the paint bucket</div><div class=\"k\">페인트 양동이에</div></div><div class=\"rc\"><div class=\"e\">and how he carefully wiped off both sides of the brush</div><div class=\"k\">그리고 그(= Henry)가 붓의 양쪽을 얼마나 조심스럽게 닦아내는지</div></div><div class=\"rc\"><div class=\"e\">as he pulled it out</div><div class=\"k\">붓을 꺼내면서</div></div><div class=\"rc\"><div class=\"e\">in order not to waste any paint.</div><div class=\"k\">페인트를 조금이라도 낭비하지 않기 위해.</div></div><div class=\"rnat\">(D)(2) (d)그(Henry의 아버지)는 Henry가 얼마나 천천히 페인트 양동이에 붓을 담그는지 그리고 그(Henry)가 붓을 꺼내면서 페인트를 조금이라도 낭비하지 않기 위해 붓의 양쪽을 얼마나 조심스럽게 닦아내는지 유심히 보았다.</div><div class=\"rst\">(d) 아빠 눈에 Henry(헨리)는 붓을 천천히 담그고, 한 방울도 아까워 양쪽을 꼼꼼히 닦아 내요. = 지문 (D)(2).</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(D)(3)번</span><div class=\"rc\"><div class=\"e\">Henry then spread a thin coat of paint</div><div class=\"k\">그런 다음 Henry는 페인트를 얇게 펴 발랐다</div></div><div class=\"rc\"><div class=\"e\">on the wall</div><div class=\"k\">벽에</div></div><div class=\"rc\"><div class=\"e\">without spilling a drop.</div><div class=\"k\">한 방울도 흘리지 않고.</div></div><div class=\"rnat\">(D)(3) 그런 다음 Henry는 (페인트를) 한 방울도 흘리지 않고 벽에 페인트를 얇게 펴 발랐다.</div><div class=\"rst\">그다음 Henry(헨리)는 <b>한 방울도 안 흘리고</b>(without spilling a drop) 얇게 칠했어요. = 지문 (D)(3).</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">(D)(4)번 · 단서</span><div class=\"rc\"><div class=\"e\">It was a slow, tedious process,</div><div class=\"k\">그것은 느리고, 지루한 과정이었지만,</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">(e) he dared not laugh</span> or “kid around”</div><div class=\"k\"><span class=\"cw\">(e)그(= Henry)는 감히 웃거나</span> ‘농담을 하지도’ 못했다</div></div><div class=\"rc\"><div class=\"e\">for fear of making a mess</div><div class=\"k\">망칠까 두려워</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">embarrassing his father.</span></div><div class=\"k\">그리고 <span class=\"cw\">아버지를 난처하게 할까.</span></div></div><div class=\"rnat\">(D)(4) 그것은 느리고, 지루한 과정이었지만, (e)그(Henry)는 (칠을) 망쳐서 아버지를 난처하게 할까 두려워 감히 웃거나 ‘농담을 하지도’ 못했다.</div><div class=\"rst\">느리고 지루했지만 (e) <b>Henry</b>(헨리)는 망쳐서 아빠를 난처하게 할까 봐 웃지도 못했어요. = 지문 (D)(4).</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">(B)(1)번</span><div class=\"rc\"><div class=\"e\">(B) Finally,</div><div class=\"k\">(B) 마침내,</div></div><div class=\"rc\"><div class=\"e\">his father offered Henry some advice.</div><div class=\"k\">그의 아버지가 Henry에게 몇 가지 조언을 하였다.</div></div><div class=\"rnat\">(B)(1) 마침내, 그의 아버지가 Henry에게 몇 가지 조언을 하였다.</div><div class=\"rst\"><b>마침내</b>(Finally) 지켜보던 아빠가 Henry(헨리)에게 조언을 해 줘요. = 관찰 뒤에 오는 (B)예요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">(B)(2)번</span><div class=\"rc\"><div class=\"e\">“Don’t worry about spills and messes.</div><div class=\"k\">“흘리거나 망칠 것을 걱정하지 마라.</div></div><div class=\"rnat\">(B)(2) “흘리거나 망칠 것을 걱정하지 마라.</div><div class=\"rst\">“흘리거나 망칠까 봐 걱정하지 마.” = 지문 (B)(2), 조심만 하던 Henry(헨리)에게 하는 말이에요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">(B)(3)번</span><div class=\"rc\"><div class=\"e\">They can always be cleaned up.</div><div class=\"k\">그것들(= 흘리거나 망친 자국)은 언제든지 청소될 수 있어.</div></div><div class=\"rnat\">(B)(3) 그것들(흘리거나 망친 자국)은 언제든지 청소될 수 있어.</div><div class=\"rst\">“흘린 건 언제든 닦으면 돼.” = 지문의 They(그것들) = 흘리거나 망친 자국이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">(B)(4)번</span><div class=\"rc\"><div class=\"e\">Treat a wall the way you treat people —</div><div class=\"k\">사람을 다루는 방식으로 벽을 대하렴 —</div></div><div class=\"rc\"><div class=\"e\">be generous, have fun.</div><div class=\"k\">관대해지고, 즐기렴.</div></div><div class=\"rnat\">(B)(4) 사람을 다루는 방식으로 벽을 대하렴 — 관대해지고, 즐기렴.</div><div class=\"rst\">“사람 대하듯 벽을 대해. 너그럽게, 즐겁게.” = 지문의 be generous(관대해지렴), have fun(즐기렴).</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">(B)(5)번</span><div class=\"rc\"><div class=\"e\">Always put enough paint on the brush.”</div><div class=\"k\">늘 붓에 충분한 페인트를 묻히렴.”</div></div><div class=\"rnat\">(B)(5) 늘 붓에 충분한 페인트를 묻히렴.”</div><div class=\"rst\">“붓에는 늘 페인트를 <b>충분히</b>(enough) 묻혀.” = 지문 (B)(5), 아빠 조언의 마무리예요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">(B)(6)번</span><div class=\"rc\"><div class=\"e\">With that,</div><div class=\"k\">그 말과 함께,</div></div><div class=\"rc\"><div class=\"e\">(b) he turned</div><div class=\"k\">(b)그(= Henry의 아버지)는 돌아서서</div></div><div class=\"rc\"><div class=\"e\">and applied a thick coat of paint to the wall,</div><div class=\"k\">벽에 페인트를 두툼하게 발랐고,</div></div><div class=\"rc\"><div class=\"e\">resuming his conversation with the homeowner.</div><div class=\"k\">집주인과의 대화를 이어갔다.</div></div><div class=\"rnat\">(B)(6) 그 말과 함께, (b)그(Henry의 아버지)는 돌아서서 벽에 페인트를 두툼하게 발랐고, 집주인과의 대화를 이어갔다.</div><div class=\"rst\">(b) 그 말을 하고 아빠는 돌아서서 페인트를 두툼하게 바르며 집주인과 수다를 이어 갔어요. = 지문 (B)(6).</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">(B)(7)번</span><div class=\"rc\"><div class=\"e\">His father did spill a few drops</div><div class=\"k\">그의 아버지는 몇 방울을 흘렸지만</div></div><div class=\"rc\"><div class=\"e\">but made a better-looking wall</div><div class=\"k\">더 보기 좋은 벽을 만들어 냈다</div></div><div class=\"rc\"><div class=\"e\">while having fun.</div><div class=\"k\">즐기면서.</div></div><div class=\"rnat\">(B)(7) 그의 아버지는 (페인트) 몇 방울을 흘렸지만 즐기면서 더 보기 좋은 벽을 만들어 냈다.</div><div class=\"rst\">아빠는 몇 방울 <b>흘리긴 했지만</b>(did spill) 즐기면서 더 멋진 벽을 만들었어요. = 지문의 마지막 문장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"in demand\" data-m=\"수요가 많은\"><b>in demand</b>수요가 많은</button><button type=\"button\" class=\"wdb\" data-w=\"dip\" data-m=\"담그다\"><b>dip</b>담그다</button><button type=\"button\" class=\"wdb\" data-w=\"tedious\" data-m=\"지루한\"><b>tedious</b>지루한</button><button type=\"button\" class=\"wdb\" data-w=\"kid around\" data-m=\"농담하다, 장난치다\"><b>kid around</b>농담하다, 장난치다</button><button type=\"button\" class=\"wdb\" data-w=\"for fear of\" data-m=\"~할까 두려워\"><b>for fear of</b>~할까 두려워</button><button type=\"button\" class=\"wdb\" data-w=\"embarrass\" data-m=\"난처하게 하다\"><b>embarrass</b>난처하게 하다</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 장문에서는 <b>아버지가 한 일과 아들이 한 일</b>을 슬쩍 바꿔 놓은 선택지를 조심해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ (A)(3)</em>outgoing(외향적인), made friends easily(쉽게 친구를 사귀었다) → 같음</span><span><em>② ↔ (B)(5)</em>put enough paint on the brush(붓에 충분한 페인트를 묻혀라) → 같음</span><span><em>④ ↔ (C)(3)</em>carrying on a conversation with the homeowner(집주인과 대화를 계속하며) → 같음</span><span><em>⑤ ↔ (D)(1)</em>stopped working and watched him(일을 멈추고 그를 바라보았다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ③을 아버지 쪽 마지막 문장 (B)(7)과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 “한 방울도 안 흘림”을 아버지가 칠하는 장면에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">(B)(7) · 결정적 단서</span><div class=\"en\">His father <mark>did spill a few drops</mark> but made a better-looking wall while having fun.</div><p class=\"ko\">그의 아버지는 <mark>몇 방울을 흘렸지만</mark> 즐기면서 더 보기 좋은 벽을 만들어 냈다.</p></div><div class=\"ck-via\"><i>▼</i><span>한 방울도 안 흘린 사람은 아버지가 아니라 아들 Henry(헨리)예요</span></div><div class=\"ck-step\"><span class=\"lab\">(D)(3) · 바꿔 놓은 주인공</span><div class=\"en\">Henry then spread a thin coat of paint on the wall <mark>without spilling a drop</mark>.</div><p class=\"ko\">그런 다음 Henry는 <mark>한 방울도 흘리지 않고</mark> 벽에 페인트를 얇게 펴 발랐다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">페인트를 벽에 칠할 때 한 방울도 흘리지 않았다<small>(B)(7)에서 아버지는 did spill(흘리긴 했다)이라고 해요. 안 흘린 건 아들이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Henry에게 페인트를 붓에 충분히 묻히라고 조언했다</span><span class=\"why\">(B)(2) Don’t worry about spills(흘리는 건 걱정 마라)와 섞여 헷갈리지만, (B)(5) Always put enough paint on the brush(늘 붓에 충분한 페인트를 묻히렴)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">친구를 쉽게 사귀는 외향적인 사람이었다</span><span class=\"why\">(A)(3) outgoing man(외향적인 사람), made friends easily(쉽게 친구를 사귀었다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">집주인과 대화를 나누면서 페인트칠을 했다</span><span class=\"why\">(C)(3) while carrying on a conversation with the homeowner(집주인과 대화를 계속해 나가면서) 페인트를 발랐다와 같아요. (B)(6)에서도 대화를 이어 가요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">하던 일을 멈추고 Henry를 쳐다보았다</span><span class=\"why\">(D)(1) stopped working and watched him(하던 일을 멈추고 그를 바라보았다)과 같아요. him(그) = Henry(헨리)예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><div class=\"rc\"><div class=\"e\">(A) Henry’s father was a house painter.</div><div class=\"k\">(A) Henry의 아버지는 가옥 페인트공이었다.</div></div><div class=\"rnat\">(A)(1) Henry의 아버지는 가옥 페인트공이었다.</div><div class=\"rst\">Henry(헨리)의 아빠는 남의 집에 페인트칠을 해 주는 페인트공이에요. = 지문 (A)의 첫 문장, 주인공 소개예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><div class=\"rc\"><div class=\"e\">In his lifetime,</div><div class=\"k\">평생 동안,</div></div><div class=\"rc\"><div class=\"e\">he must have painted hundreds of houses,</div><div class=\"k\">그는 수백 채의 집을 칠했음에 틀림없다,</div></div><div class=\"rc\"><div class=\"e\">inside and out.</div><div class=\"k\">안팎으로.</div></div><div class=\"rnat\">(A)(2) 평생 동안, 그는 수백 채의 집을 안팎으로 칠했음에 틀림없다.</div><div class=\"rst\">아빠는 평생 수백 채의 집을 안팎으로 칠했을 거예요. = 지문의 must have painted(칠했음에 틀림없다).</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><div class=\"rc\"><div class=\"e\">He was a happy, outgoing man</div><div class=\"k\">그는 행복하고 외향적인 사람이었다</div></div><div class=\"rc\"><div class=\"e\">who made friends easily.</div><div class=\"k\">쉽게 친구를 사귀는.</div></div><div class=\"rnat\">(A)(3) 그는 쉽게 친구를 사귀었던 행복하고, 외향적인 사람이었다.</div><div class=\"rst\">아빠는 늘 즐겁고 친구도 쉽게 사귀는 <b>외향적인</b>(outgoing) 사람이에요. = 지문 (A)(3).</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><div class=\"rc\"><div class=\"e\">It wasn’t hard to tell</div><div class=\"k\">~라고 말하는 것은 어렵지 않았다</div></div><div class=\"rc\"><div class=\"e\">that he loved his work</div><div class=\"k\">그가 자신의 일을 사랑했다고</div></div><div class=\"rc\"><div class=\"e\">as well as his life.</div><div class=\"k\">삶뿐 아니라.</div></div><div class=\"rnat\">(A)(4) 그가 자신의 삶뿐 아니라 일도 사랑했다고 말하는 것은 어렵지 않았다.</div><div class=\"rst\">누가 봐도 아빠는 삶뿐 아니라 자기 일도 정말 사랑했어요. = 지문 (A)(4).</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(A)(5)번</span><div class=\"rc\"><div class=\"e\">He was also an excellent painter.</div><div class=\"k\">그는 또한 뛰어난 페인트공이었다.</div></div><div class=\"rnat\">(A)(5) 그는 또한 뛰어난 페인트공이었다.</div><div class=\"rst\">게다가 실력도 최고인 페인트공이었어요. = 지문 (A)(5).</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(A)(6)번</span><div class=\"rc\"><div class=\"e\">No one could paint a wall like him,</div><div class=\"k\">누구도 그처럼 벽을 칠하지 못했고,</div></div><div class=\"rc\"><div class=\"e\">which is why</div><div class=\"k\">그것이 바로 이유이다</div></div><div class=\"rc\"><div class=\"e\">(a) his services were always in demand.</div><div class=\"k\">(a)그(= Henry의 아버지)의 일이 항상 수요가 많았던.</div></div><div class=\"rnat\">(A)(6) 누구도 그처럼 벽을 칠하지 못했고, 그것이 (a)그(Henry의 아버지)의 일이 항상 수요가 많았던 이유였다.</div><div class=\"rst\">아무도 아빠처럼 벽을 못 칠해서 (a) 아빠를 찾는 사람이 늘 많았어요. = 지문의 in demand(수요가 많은). (A)는 아빠 소개로 끝나요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(C)(1)번</span><div class=\"rc\"><div class=\"e\">(C) Once, while in college,</div><div class=\"k\">(C) 언젠가, 대학 시절에,</div></div><div class=\"rc\"><div class=\"e\">Henry went to help his father</div><div class=\"k\">Henry는 아버지를 도우러 갔다</div></div><div class=\"rc\"><div class=\"e\">paint a house.</div><div class=\"k\">집을 칠하는 것을.</div></div><div class=\"rnat\">(C)(1) 언젠가, 대학 시절에, Henry는 아버지가 집을 칠하는 것을 도와드리러 갔다.</div><div class=\"rst\"><b>언젠가</b>(Once) 대학생 Henry(헨리)가 아빠의 페인트칠을 도우러 갔어요. = 구체적인 하루가 시작되는 (C), (A) 바로 뒤예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(C)(2)번</span><div class=\"rc\"><div class=\"e\">Henry was working inside</div><div class=\"k\">Henry는 집 안쪽에서 일하고 있었고</div></div><div class=\"rc\"><div class=\"e\">and noticed how skilled his father was</div><div class=\"k\">자신의 아버지가 얼마나 노련한지 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">at quickly applying a quality coat of paint</div><div class=\"k\">재빠르게 양질의 페인트칠을 발라 나가는 데 있어</div></div><div class=\"rc\"><div class=\"e\">to a wall.</div><div class=\"k\">벽에.</div></div><div class=\"rnat\">(C)(2) Henry는 집 안쪽에서 작업 중이었고 자신의 아버지가 벽에 재빠르게 양질의 페인트칠을 발라나가는 데 있어 얼마나 노련한지 알게 되었다.</div><div class=\"rst\">집 안에서 일하던 Henry(헨리)는 아빠가 벽을 빠르고 멋지게 칠하는 솜씨에 놀랐어요. = 지문 (C)(2).</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(C)(3)번</span><div class=\"rc\"><div class=\"e\">As a matter of fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">while carrying on a conversation with the homeowner,</div><div class=\"k\">집주인과 대화를 계속해 나가면서,</div></div><div class=\"rc\"><div class=\"e\">laughing the whole time,</div><div class=\"k\">시종일관 웃으며,</div></div><div class=\"rc\"><div class=\"e\">his father applied generous amounts of paint</div><div class=\"k\">그의 아버지는 넉넉한 양의 페인트를 발랐다</div></div><div class=\"rc\"><div class=\"e\">to the wall.</div><div class=\"k\">벽에.</div></div><div class=\"rnat\">(C)(3) 사실, 그의 아버지는 시종일관 웃으며 집주인과 대화를 계속해 나가면서 벽에는 넉넉한 양의 페인트를 발랐다.</div><div class=\"rst\">사실 아빠는 집주인과 웃으며 수다를 떨면서 페인트를 <b>넉넉히</b>(generous amounts) 발랐어요. = 지문 (C)(3).</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(C)(4)번</span><div class=\"rc\"><div class=\"e\">(c) He painted three walls</div><div class=\"k\">(c)그(= Henry의 아버지)는 벽 세 개를 칠하였다</div></div><div class=\"rc\"><div class=\"e\">compared to Henry’s one.</div><div class=\"k\">Henry의 하나에 비해.</div></div><div class=\"rnat\">(C)(4) (c)그(Henry의 아버지)는 Henry의 하나에 비해(Henry가 벽을 하나 칠할 동안) 세 개의 벽을 칠하였다.</div><div class=\"rst\">(c) 아빠가 벽 세 개를 칠할 동안 Henry(헨리)는 겨우 한 개였어요. = 지문 (C)(4)의 속도 차이.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(D)(1)번</span><div class=\"rc\"><div class=\"e\">(D) At one point,</div><div class=\"k\">(D) 어느 순간,</div></div><div class=\"rc\"><div class=\"e\">Henry’s father stopped working</div><div class=\"k\">Henry의 아버지는 하던 일을 멈추고</div></div><div class=\"rc\"><div class=\"e\">and watched him.</div><div class=\"k\">그(= Henry)를 바라보았다.</div></div><div class=\"rnat\">(D)(1) 어느 순간, Henry의 아버지는 하던 일을 멈추고 그(Henry)를 바라보았다.</div><div class=\"rst\"><b>어느 순간</b>(At one point) 아빠가 일을 멈추고 Henry(헨리)를 지켜봤어요. = (C)의 속도 차이 뒤에 오는 (D)예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(D)(2)번</span><div class=\"rc\"><div class=\"e\">(d) He noticed</div><div class=\"k\">(d)그(= Henry의 아버지)는 유심히 보았다</div></div><div class=\"rc\"><div class=\"e\">how Henry took his time dipping the brush</div><div class=\"k\">Henry가 얼마나 천천히 붓을 담그는지</div></div><div class=\"rc\"><div class=\"e\">in the paint bucket</div><div class=\"k\">페인트 양동이에</div></div><div class=\"rc\"><div class=\"e\">and how he carefully wiped off both sides of the brush</div><div class=\"k\">그리고 그(= Henry)가 붓의 양쪽을 얼마나 조심스럽게 닦아내는지</div></div><div class=\"rc\"><div class=\"e\">as he pulled it out</div><div class=\"k\">붓을 꺼내면서</div></div><div class=\"rc\"><div class=\"e\">in order not to waste any paint.</div><div class=\"k\">페인트를 조금이라도 낭비하지 않기 위해.</div></div><div class=\"rnat\">(D)(2) (d)그(Henry의 아버지)는 Henry가 얼마나 천천히 페인트 양동이에 붓을 담그는지 그리고 그(Henry)가 붓을 꺼내면서 페인트를 조금이라도 낭비하지 않기 위해 붓의 양쪽을 얼마나 조심스럽게 닦아내는지 유심히 보았다.</div><div class=\"rst\">(d) 아빠 눈에 Henry(헨리)는 붓을 천천히 담그고, 한 방울도 아까워 양쪽을 꼼꼼히 닦아 내요. = 지문 (D)(2).</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(D)(3)번</span><div class=\"rc\"><div class=\"e\">Henry then spread a thin coat of paint</div><div class=\"k\">그런 다음 Henry는 페인트를 얇게 펴 발랐다</div></div><div class=\"rc\"><div class=\"e\">on the wall</div><div class=\"k\">벽에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">without spilling a drop.</span></div><div class=\"k\"><span class=\"cw\">한 방울도 흘리지 않고.</span></div></div><div class=\"rnat\">(D)(3) 그런 다음 Henry는 (페인트를) 한 방울도 흘리지 않고 벽에 페인트를 얇게 펴 발랐다.</div><div class=\"rst\">그다음 Henry(헨리)는 <b>한 방울도 안 흘리고</b>(without spilling a drop) 얇게 칠했어요. = 지문 (D)(3).</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(D)(4)번</span><div class=\"rc\"><div class=\"e\">It was a slow, tedious process,</div><div class=\"k\">그것은 느리고, 지루한 과정이었지만,</div></div><div class=\"rc\"><div class=\"e\">but (e) he dared not laugh or “kid around”</div><div class=\"k\">(e)그(= Henry)는 감히 웃거나 ‘농담을 하지도’ 못했다</div></div><div class=\"rc\"><div class=\"e\">for fear of making a mess</div><div class=\"k\">망칠까 두려워</div></div><div class=\"rc\"><div class=\"e\">and embarrassing his father.</div><div class=\"k\">그리고 아버지를 난처하게 할까.</div></div><div class=\"rnat\">(D)(4) 그것은 느리고, 지루한 과정이었지만, (e)그(Henry)는 (칠을) 망쳐서 아버지를 난처하게 할까 두려워 감히 웃거나 ‘농담을 하지도’ 못했다.</div><div class=\"rst\">느리       const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
