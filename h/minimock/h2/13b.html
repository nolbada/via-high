<title>고2 미니모의고사 13회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}

.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}

.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */

.sc-h .at{font-size:13px;color:var(--sub)}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}

.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}

": "(a) manipulating", "g": "조작하는", "ok": false, "e": ["2번에서 학생들이 활동에 참여하고 사물을 '조작하는' 것이라는 문맥에 맞는 쓰임이다."]}, {"n": "②", "t": "(b) inherent", "g": "내재되어 있는", "ok": false, "e": ["3번에서 지식은 자료 그 자체에 '내재되어 있는' 것이 아니라 학생의 생각과 초인지에 있다는 문맥에 맞는 쓰임이다."]}, {"n": "③", "t": "(c) missing", "g": "누락된", "ok": false, "e": ["5번에서 '사고를 요구하는' 부분이 수업 경험에서 '누락된' 요소라는 문맥에 맞는 쓰임이다."]}, {"n": "④", "t": "(d) Uncertainty", "g": "불확실성 (→ 확실성)", "ok": true, "e": ["6번에서 토론·사고·논쟁 등이 가져오는 것은 지식에 대한 '확실성'이다", "따라서 Uncertainty는 Certainty가 되어야 하므로 문맥에 맞지 않는 쓰임이다."]}, {"n": "⑤", "t": "(e) extends", "g": "넘어선다", "ok": false, "e": ["8번에서 학생이 필요로 하는 것에 대한 견해가 '직접 해보는 활동'을 훨씬 '넘어선다'는 문맥에 맞는 쓰임이다."]}], "tr": ["상당한 기간 동안, 과학 교육자들은 ‘직접 해보는’ 활동이 과학 관련 활동에서 아이들이 참여를 통해 이해하게 되는 것에 대한 해답이라고 믿었다.", "많은 교사들은 단지 (과학 관련) 활동에 참여하고 사물을 (a) 조작하는 학생들이 (그 활동을 통해) 얻게 될 정보와 이해하게 될 지식을 개념 이해로 체계화할 것이라고 믿었다.", "교육자들은 지식이 (활동) 자료 그 자체에 (b) 내재되어 있는 것이 아니라 학생들이 그 활동에서 한 것에 대한 생각과 초인지에 있다는 것을 깨달으면서, 탐구에서 ‘직접 해보기’ 요소 쪽으로 (과학 교육의) 추가 너무 많이 기울었다는 것을 알아차리기 시작했다.", "이제 우리는 과학을 배우는 것에 대해 말할 때 ‘직접 해보는’이 위험한 문구라는 것을 안다.", "(c) 누락된 요소는 교육 경험에서 ‘사고를 요구하는’ 부분이다.", "어떤 활동에서든, 의도된 지식에 대한 (d) 불확실성(→ 확실성)은 각 학생의 개념 재창조로부터 비롯된다. 그리고 (과학 관련) 활동들 이후, 사려 깊은 교사의 지도하에 토론하고, 생각하고, 논쟁하고, 듣고, 자신의 선입견에 대해 평가하는 것이 이것(지식에 대한 확실성)을 가져올 수 있다.", "결국, 음식 싸움(음식을 던지며 노는 것)은 직접 해보는 활동이지만, 여러분이 배우게 될 거의 전부는 으깬 감자를 날리는 공기 역학에 관한 것이었다!", "자연 세계에 대한 그들(학생들)의 지식과 이론을 구축하기 위해 학생들이 필요로 하는 것에 대한 우리의 견해는 ‘직접 해보는 활동’을 훨씬 (e) 넘어선다.", "학생들이 과학 수업에서 자료를 사용하고 자료와 상호 작용하는 것도 중요하지만, 학습은 학생들의 ‘직접 해보는’ 경험에 대해 의미를 부여하는 것으로부터 나온다."], "ps": [{"n": 1, "ch": [{"e": "For quite some time,", "k": "상당한 기간 동안,"}, {"e": "science educators believed", "k": "과학 교육자들은 믿었다"}, {"e": "that “hands-on” activities", "k": "'직접 해보는' 활동이"}, {"e": "were the <b>answer<\/b> to", "k": "~에 대한 <b>해답<\/b>이라고"}, {"e": "children’s <b>understanding<\/b>", "k": "아이들이 이해하게 되는 것에"}, {"e": "through their <b>participation<\/b>", "k": "그들의 <b>참여<\/b>를 통해"}, {"e": "in science-related activities.", "k": "과학 관련 활동에서."}], " function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

dents merely<sup>1</sup> engaging in activities and manipulating<sup>2</sup> objects / would organize the information to be gained and the knowledge to be understood / into concept comprehension<sup>3</sup>.", "notes": [["1", "merely", "그저, 단지"], ["2", "manipulate", "조작하다"], ["3", "comprehension", "이해"]], "lit": "많은 교사들은 믿었다 / 학생들이 그저 활동에 참여하고 물건을 조작하기만 해도 / 얻어질 정보와 이해되어야 할 지식이 정리될 것이라고 / 개념 이해로", "nat": "많은 교사들은 학생들이 그저 활동에 참여하고 물건을 조작하기만 해도 얻어질 정보와 이해되어야 할 지식이 개념 이해로 정리될 것이라고 믿었다.", "ana": "believed의 목적어인 <b>that절</b> 안에서 engaging과 manipulating이 <b>동명사 병렬 주어</b>이며, to be gained와 to be understood가 <b>to부정사구 병렬</b>로 각 명사를 수식한다.", "pe": "Many teachers believed / that students \u0001merely<sup>1</sup>\u0002 engaging \u0001in activities\u0002 and manipulating<sup>2</sup> objects / would organize the information \u0001to be gained\u0002 and the knowledge \u0001to be understood\u0002 / \u0001into concept comprehension<sup>3</sup>\u0002.", "pk": "많은 교사들은 믿었다 / 학생들이 \u0001그저\u0002 \u0001활동에\u0002 참여하고 물건을 조작하기만 해도 / \u0001얻어질\u0002 정보와 \u0001이해되어야 할\u0002 지식이 정리될 것이라고 / \u0001개념 이해로\u0002", "core": "많은 교사들은 학생들이 활동에 참여하고 물건을 조작하면 정보와 지식이 정리될 것이라고 믿었다.", "tags": ["Many teachers believed: 주어 + 동사, 뒤에 <b>목적어 that절</b>", "that절 시작. engaging·manipulating = <b>동명사 병렬</b> 주어. merely = 부사: engaging 꾸밈. in activities = 전치사구(부사구): engaging 꾸밈, 거의 필수에 가까운 부사구(engage in)", "would organize the information and the knowledge: 3형식 SVO. to be gained·to be understood = to부정사(형용사적, 수동): 각각 information·knowledge 꾸밈", "into concept comprehension = 전치사구(부사구): organize 꾸밈, 거의 필수에 가까운 부사구(organize A into B) [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고 목적어가 <b>that절</b>이다. that절의 주어가 분사구로 길어진다."}, {"t": "큰 뼈대부터 찾는다.", "sub": ["S: Many teachers (많은 교사들)", "V: believed (believe 믿다의 과거형)", "O: that절 (명사절)", "뼈대 = <b>Many teachers believed that ~</b>"]}, {"t": "that절 안의 뼈대를 찾는다.", "sub": ["S: students (학생들)", "V: would organize (organize 정리하다)", "O: the information and the knowledge (정보와 지식)", "뼈대 = <b>students would organize the information and the knowledge</b>"]}, {"t": "주어 뒤 <b>merely engaging in activities and manipulating objects</b>는 <b>현재분사구</b>다. students를 뒤에서 꾸민다 (그저 활동에 참여하고 물건을 조작하기만 하는).", "sub": ["engage in (참여하다)와 manipulate (조작하다)가 병렬, merely (그저)는 부사", "동사가 아니라 students를 꾸미는 분사라서 would organize가 진짜 동사"]}, {"t": "<b>to be gained</b>와 <b>to be understood</b>는 <b>수동 to부정사(형용사적 용법)</b>다. 각각 information과 knowledge를 꾸민다 (얻어질 정보, 이해되어야 할 지식)."}, {"t": "끝의 <b>into concept comprehension</b>은 organize A into B (A를 B로 정리하다)의 B 자리다 (개념 이해로, comprehension 이해). 거의 필수에 가까운 부사구지만 수식어로 분류한다 (문형 기준)."}], "sum": "교사들, 활동·조작만으로 학생이 정보를 개념 이해로 정리한다고 믿음"}, {"i": "07", "q": "11", "s": "3", "title": "S+V+O(to부정사) + as절 (that절 중첩, not A but B)", "eng": "Educators began to notice / that the pendulum<sup>1</sup> had swung too far to the \"hands-on\" component of inquiry<sup>2</sup> / as they realized / that the knowledge was not inherent<sup>3</sup> in the materials themselves, / but in the thought and metacognition<sup>4</sup> about what students had done in the activity.", "notes": [["1", "pendulum", "진자"], ["2", "inquiry", "탐구"], ["3", "inherent", "내재하는"], ["4", "metacognition", "초인지"]], "lit": "교육자들은 알아차리기 시작했다 / 진자가 탐구의 '직접 해보기' 요소 쪽으로 너무 멀리 흔들려 갔다는 것을 / 그들이 깨달았기 때문에 / 지식이 자료 자체에 내재하는 것이 아니라는 것을, / 학생들이 그 활동에서 한 일에 대한 사고와 초인지에 있다는 것을", "nat": "교육자들은, 지식이 자료 자체에 내재하는 것이 아니라 학생들이 그 활동에서 한 일에 대한 사고와 초인지에 있다는 것을 깨달으면서, 진자가 탐구의 '직접 해보기' 요소 쪽으로 너무 멀리 흔들려 갔다는 것을 알아차리기 시작했다.", "ana": "notice와 realized 각각의 목적어로 <b>that절</b>이 중첩되어 있고, realized의 목적어절 안에서 <b>not A but B(A가 아니라 B)</b> 상관접속사가 쓰였다.", "pe": "Educators began to notice / that the pendulum<sup>1</sup> had swung \u0001too far\u0002 \u0001to the \"hands-on\" component \u0001of inquiry<sup>2</sup>\u0002\u0002 / \u0001as they realized\u0002 / \u0001that the knowledge was not inherent<sup>3</sup> in the materials themselves\u0002, / \u0001but in the thought and metacognition<sup>4</sup> about what students had done in the activity\u0002.", "pk": "교육자들은 알아차리기 시작했다 / 진자가 \u0001\u0001탐구의\u0002 '직접 해보기' 요소 쪽으로\u0002 \u0001너무 멀리\u0002 흔들려 갔다는 것을 / \u0001그들이 깨달았기 때문에\u0002 / \u0001지식이 자료 자체에 내재하는 것이 아니라는 것을\u0002, / \u0001학생들이 그 활동에서 한 일에 대한 사고와 초인지에 있다는 것을\u0002", "core": "교육자들은 진자가 흔들려 갔다는 것을 알아차리기 시작했다.", "tags": ["Educators began to notice: 주어 + began + to notice(3형식 SVO). 목적어는 뒤 that절", "<b>목적어 that절</b>: pendulum had swung (1형식). too far = 부사: swung 꾸밈. to the component = 전치사구: swung 꾸밈, 거의 필수에 가까운 부사구. of inquiry: component 꾸밈", "as절 = 접속사절(부사절, 때·이유): began to notice를 꾸밈. as they realized의 목적어가 아래 두 that절", "realized의 목적어절 안: the knowledge was not inherent in the materials. 전체가 as절 수식어에 포함", "<b>not A but B</b>: A(내재하는 것)가 아니라 B(사고와 초인지에 있음). what students had done = about의 목적어 명사절"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고 목적어가 <b>to부정사</b>이다. 그 안의 that절에 as절이 있고 그 안에 that절이 또 있어 아주 길어 보인다."}, {"t": "큰 뼈대부터 찾는다.", "sub": ["S: Educators (교육자들)", "V: began (begin 시작하다의 과거형)", "O: to notice that the pendulum had swung too far ~ (진자가 너무 멀리 흔들렸다는 것을 알아차리기) - begin은 to부정사를 목적어로 취함", "notice (알아차리다)의 목적어: that the pendulum had swung too far ~ (진자가 너무 멀리 흔들렸다는 것)", "뼈대 = <b>Educators began to notice that ~</b>"]}, {"t": "첫 번째 that절 안의 뼈대를 찾는다.", "sub": ["S: the pendulum (진자)", "V: had swung (swing 흔들리다의 과거완료형) - 1형식", "too far (너무 멀리)는 swung를 꾸미는 부사", "to the 'hands-on' component of inquiry (탐구의 '직접 해보기' 요소 쪽으로) - 거의 필수에 가까운 부사구지만 수식어로 분류. of inquiry는 component를 꾸밈"]}, {"t": "<b>as they realized ~</b>는 <b>부사절(때·이유)</b>이다. began을 꾸민다 (그들이 깨닫게 되면서). they = Educators.", "sub": ["realized의 목적어: that the knowledge was not inherent in the materials themselves (지식이 자료 자체에 내재하는 것이 아니라는 것)", "inherent 내재하는, themselves 그것들 자체"]}, {"t": "<b>but in the thought and metacognition about what students had done in the activity</b>는 not A but B의 B다 (사고와 초인지에 있다는 것). 앞의 not inherent in the materials와 짝을 이룬다.", "sub": ["about의 목적어: what students had done in the activity (학생들이 그 활동에서 한 일, what절)", "metacognition 초인지"]}], "sum": "교육자들, 지식은 자료가 아니라 활동 후의 사고에 있음을 깨달으며 진자가 한쪽으로 치우쳤음을 앎"}, {"i": "08", "q": "12", "s": "8", "title": "긴 주어(of what절) + S+V", "eng": "Our view of what students need to build their knowledge and theories<sup>1</sup> about the natural world / extends far beyond<sup>2</sup> a \"hands-on activity.\"", "notes": [["1", "theory", "이론"], ["2", "far beyond", "훨씬 뛰어넘어"]], "lit": "학생들이 자연 세계에 대한 지식과 이론을 구축하기 위해 필요로 하는 것에 대한 우리의 견해는 / '직접 해보는 활동'을 훨씬 뛰어넘어 확장된다", "nat": "학생들이 자연 세계에 대한 지식과 이론을 구축하기 위해 필요로 하는 것에 대한 우리의 견해는 '직접 해보는 활동'을 훨씬 뛰어넘는 것으로 확장된다.", "ana": "<b>what students need ~</b>는 전치사 of의 목적어로 쓰인 <b>관계대명사 what절</b>이며, 그 안에 to build ~라는 to부정사구가 need를 수식한다.", "pe": "Our view \u0001of what students need to build their knowledge and theories<sup>1</sup> about the natural world\u0002 / extends \u0001far beyond<sup>2</sup> a \"hands-on activity\u0002.\"", "pk": "\u0001학생들이 자연 세계에 대한 지식과 이론을 구축하기 위해 필요로 하는 것에 대한\u0002 우리의 견해는 / \u0001'직접 해보는 활동'을 훨씬 뛰어넘어\u0002 확장된다", "core": "우리의 견해는 확장된다.", "tags": ["Our view = 주어. of what ~ = 전치사구(형용사구): view 꾸밈. 안의 what절 = 전치사 of의 목적어 명사절, to build ~ = 목적의 to부정사", "extends: 1형식 SV. far beyond ~ = 전치사구(부사구): extends 꾸밈, 거의 필수에 가까운 부사구(extend는 범위를 거의 요구) [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 주어가 what절을 품은 전치사구로 길어져서 동사가 한참 뒤에 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Our view (우리의 견해)", "V: extends (extend 확장되다, 걸치다의 3인칭 단수형)", "뼈대 = <b>Our view extends</b>", "far beyond a 'hands-on activity' (직접 해보는 활동을 훨씬 넘어) - 전치사구. 거의 필수에 가까운 부사구지만 수식어로 분류 (문형 기준)"]}, {"t": "주어 뒤 <b>of what students need ~ natural world</b>는 전치사구(형용사구)다. view를 꾸민다 (학생들이 필요로 하는 것에 대한).", "sub": ["what절은 전치사 of의 목적어 명사절", "S: students (학생들), V: need (필요로 하다), O: what (것)", "to build their knowledge and theories about the natural world (자연 세계에 대한 자신들의 지식과 이론을 구축하기 위해) - to부정사 부사적 용법(목적), build 구축하다, theory 이론"]}, {"t": "주어와 동사 사이가 이렇게 길기 때문에 view를 먼저 잡고 extends까지 건너뛰어 읽는 것이 요령이다."}], "sum": "학생이 지식을 쌓는 데 필요한 것에 대한 우리의 견해, 직접 해보기를 훨씬 넘어섬"}], "qs": [{"q": "07", "type": "빈칸", "src": "2018년 3월 33번", "ans": "②", "tr": [["1", "명성에 대한 욕구는 방치(무시당한 경험)를 기원으로 둔다."], ["2", "과거 어딘가에서 극도로 하찮다고 느끼게 되었던 적이 없는 사람은 아무도 유명해지고 싶어 하지 않을 것이다."], ["3", "우리가 이전에 방치를 고통스럽게 경험해 본 적이 있을 때, 우리는 많은 감탄 어린 관심에 대한 욕구를 느낀다."], ["4", "아마도 누군가의 부모님이 감명을 주기 어려웠을 것이다."], ["5", "그들은 그 사람에게 별로 신경 쓰지 않았고, 다른 유명한 사람들에게 관심을 쏟거나 친절한 감정을 갖거나 표현할 수 없었거나, 혹은 그저 너무 열심히 일했기 때문에 다른 일들로 너무 바빴다."], ["6", "잠자리 이야기도 들려주지 않았고, 그 사람의 학교 성적표는 칭찬과 감탄의 대상이 아니었다."], ["7", "그것이 그 사람이 언젠가 온 세상이 관심을 가져줄 것이라고 꿈꾸는 이유이다."], ["8", "우리가 유명해지면, 우리 부모님도 우리에게 감탄할 수밖에 없을 것이다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "We sense the need for a great deal of admiring attention when we have been painfully exposed to earlier deprivation."}, {"en": false, "h": "과거에 방치를 고통스럽게 경험했을 때 많은 관심을 갈망하게 된다는 3번의 내용을 종합하면, 빈칸에는 '방치의 경험'이 들어가야 한다."}], "opts": [{"n": "①", "t": "spread of media", "a": false, "x": true, "trap": false, "e": "미디어의 확산에 관한 내용은 본문에 없다."}, {"n": "②", "t": "experience of neglect", "a": true, "x": false, "trap": false, "e": "어린 시절 방치의 경험이 명성에 대한 욕구의 뿌리라는 3~6번의 내용과 정확히 일치한다."}, {"n": "③", "t": "freedom from authority", "a": false, "x": true, "trap": false, "e": "권위로부터의 자유에 관한 언급은 본문에 없다."}, {"n": "④", "t": "curiosity about the unknown", "a": false, "x": true, "trap": true, "e": "미지의 것에 대한 호기심에 관한 언급은 본문에 없다."}, {"n": "⑤", "t": "misunderstanding of popularity", "a": false, "x": true, "trap": false, "e": "인기에 대한 오해에 관한 언급은 본문에 없다."}], "w": [["desire", "욕구"], ["fame", "명성"], ["have roots in", "~을 기원으로 하다"], ["insignificant", "하찮은"], ["admiring attention", "감탄 어린 관심"], ["expose", "노출시키다"], ["deprivation", "방치, 박탈"], ["impress", "감명을 주다"], ["bedtime story", "잠자리 이야기"], ["admiration", "감탄"]]}, {"q": "08", "type": "빈칸", "src": "2018년 6월 31번", "ans": "②", "tr": [["1", "당신은 당신의 아이들에게 낯선 사람들을 멀리하라고 조언하는가?"], ["2", "그것은 어른들에게는 무리한 요구이다."], ["3", "결국, 당신은 낯선 사람들을 만남으로써 친구 관계망을 넓히고 잠재적인 사업 파트너를 만든다."], ["4", "그러나 이 과정에서, 사람들의 성격을 이해하기 위해 그들을 분석하는 것이 전적으로 잠재적인 경제적 또는 사회적 이익에 관한 것만은 아니다."], ["5", "당신 자신의 안전뿐 아니라, 당신이 아끼는 사람들의 안전도 생각해야 한다."], ["6", "그런 이유로, 은퇴한 FBI 프로파일러인 Mary Ellen O'Toole은 그들을 이해하기 위해 (빈칸)해야 할 필요성을 강조한다."], ["7", "예를 들어, 낯선 사람이 예의 바르다는 이유만으로 좋은 이웃이라고 가정하는 것은 안전하지 않다."], ["8", "그들이 매일 아침 옷을 잘 차려입고 나가는 규칙적인 습관을 따르는 것을 보는 것이 그것이 전부라는 것을 의미하지는 않는다."], ["9", "사실, O'Toole은 당신이 범죄자를 상대할 때는 심지어 당신의 느낌조차 당신을 속일 수 있다고 말한다."], ["10", "그것은 범죄자들이 조작과 속임수의 기술을 완벽하게 익혔기 때문이다."]], "evh": "7·8번 문장", "ev": [{"en": true, "h": "It is not safe, for instance, to assume that a stranger is a good neighbor, just because they're polite. Seeing them follow a routine of going out every morning well-dressed doesn't mean that's the whole story."}, {"en": false, "h": "예의 바르다는 겉모습만으로 판단해서는 안 되고 겉모습 너머를 봐야 한다는 7·8번의 내용을 종합하면, 빈칸에는 '사람의 피상적인 특성을 넘어서라'는 내용이 들어가야 한다."}], "opts": [{"n": "①", "t": "narrow down your network in social media", "a": false, "x": true, "trap": false, "e": "소셜 미디어 인맥을 좁히는 것에 관한 내용은 본문에 없다."}, {"n": "②", "t": "go beyond a person's superficial qualities", "a": true, "x": false, "trap": false, "e": "예의 바름 같은 겉모습만으로 판단해서는 안 된다는 7·8번의 내용과 정확히 일치한다."}, {"n": "③", "t": "focus on intelligence rather than wealth", "a": false, "x": true, "trap": false, "e": "지성이나 부에 초점을 맞추라는 내용은 본문에 없다."}, {"n": "④", "t": "trust your first impressions of others", "a": false, "x": true, "trap": true, "e": "오히려 본문은 느낌조차 속을 수 있다고 했으므로 반대된다."}, {"n": "⑤", "t": "take advantage of criminals", "a": false, "x": true, "trap": false, "e": "범죄자를 이용하라는 내용은 본문에 없다."}], "w": [["keep away from", "~을 멀리하다"], ["tall order", "무리한 요구"], ["expand", "넓히다"], ["network of friends", "친구 관계망"], ["potential", "잠재적인"], ["analyze", "분석하다"], ["retired", "은퇴한"], ["profiler", "프로파일러"], ["emphasize", "강조하다"], ["assume", "가정하다"], ["routine", "규칙적인 습관"], ["deceit", "속임수"]]}, {"q": "09", "type": "무관 문장", "src": "2020년 9월 35번", "ans": "③", "tr": [["1", "주요 대양들은 모두 서로 연결되어 있어서, 대양의 지리적 경계는 대륙의 지리적 경계보다 덜 명확하다."], ["2", "결과적으로, 대양의 생물군집은 육지의 생물군집보다 뚜렷한 차이를 덜 보인다."], ["3", "①대양 자체는
