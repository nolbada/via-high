var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>첫 문장</b>(주제문)에 있어요. 뒤 문장들이 명성 욕구의 <b>뿌리</b>(roots 뿌리)를 어떻게 설명하는지, 되풀이되는 말 <b>하찮게 느낌·박탈·관심 못 받음</b>을 한 어구로 묶으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">The desire for fame <mark>has its roots in</mark> <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">명성에 대한 욕구는 ( ? )에 <mark>뿌리를 두고 있다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>뿌리 = 과거에 겪은 일. 어떤 일인지 2번이 알려 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 · 첫 번째 단서</span><div class=\"en\">No one would want to be famous who hadn’t also, somewhere in the past, been made to feel <mark>extremely insignificant</mark>.</div><p class=\"ko\">과거 어딘가에서 <mark>극도로 하찮다고</mark> 느끼게 된 적이 없는 사람은 유명해지기를 원하지 않을 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>2번을 다시 말해, 관심 욕구의 원인을 deprivation(박탈)으로 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 · 결정적 단서</span><div class=\"en\">We sense the need for a great deal of <mark>admiring attention</mark> when we have been painfully exposed to <mark>earlier deprivation</mark>.</div><p class=\"ko\">우리가 <mark>보다 일찍 박탈감을</mark> 고통스럽게 경험해 본 적이 있을 때 <mark>감탄하며 바라보는 많은 관심에 대한</mark> 욕구를 느낀다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>부모가 아이에게 관심을 기울이지 않음</span><span><em>6번</em>잠자리 이야기 없음, 통지표도 칭찬받지 못함</span></div><div class=\"ck-eq\">⇒ 두 장면의 공통점 = 관심을 받지 못하고 방치된 경험</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">experience of neglect 방치의 경험<small>3번 deprivation(박탈), 5번 never noticed(관심을 기울이지 않았다)를 한 어구로 묶어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">spread of media 미디어의 확산</span><span class=\"why\">famous(유명한)와 어울려 보이는 함정이에요. 지문은 미디어가 아니라 5·6번처럼 집에서 관심을 못 받은 경험을 원인으로 들어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">freedom from authority 권위로부터의 자유</span><span class=\"why\">부모가 등장하지만 부모의 권위에서 벗어나고 싶다는 말은 없어요. 8번은 오히려 부모가 감탄해 주길 바란다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">curiosity about the unknown 미지의 것에 대한 호기심</span><span class=\"why\">호기심 이야기는 지문에 없어요. 3번의 원인은 박탈감이지 궁금함이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">misunderstanding of popularity 인기에 대한 오해</span><span class=\"why\">인기를 잘못 이해했다는 말은 없어요. 2번은 하찮다고 느낀 경험 때문에 유명해지고 싶다고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">The desire for fame</div><div class=\"k\">명성에 대한 욕구는</div></div><div class=\"rc\"><div class=\"e\">has its roots in</div><div class=\"k\">~에 뿌리를 두고 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the experience of neglect</span>.</div><div class=\"k\"><span class=\"cw\">방치의 경험에</span>.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">명성에 대한 욕구는 방치의 경험(무시당한 경험)을 기반으로 한다.</div><div class=\"rst\">반에서 유독 “나 좀 봐 줘!” 하는 친구가 있죠. 지문은 유명해지고 싶은 마음의 <b>뿌리</b>가 바로 빈칸에 있다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">No one would want</div><div class=\"k\">어느 누구도 원하지 않을 것이다</div></div><div class=\"rc\"><div class=\"e\">to be famous</div><div class=\"k\">유명해지기를</div></div><div class=\"rc\"><div class=\"e\">who hadn’t also,</div><div class=\"k\">또한 ~한 적이 없는 사람이</div></div><div class=\"rc\"><div class=\"e\">somewhere in the past,</div><div class=\"k\">과거 어딘가에서,</div></div><div class=\"rc\"><div class=\"e\">been made to feel</div><div class=\"k\">느끼게 된</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">extremely insignificant</span>.</div><div class=\"k\"><span class=\"cw\">극도로 하찮다고</span>.</div></div><div class=\"rnat\">과거 어디에선가 극도로 (자신이) 하찮다고 느끼게 되었던(느꼈던) 적이 없는 사람은 어느 누구도 유명해지고 싶어 하지 않을 것이다.</div><div class=\"rst\">그 친구도 예전에 아무도 자기를 안 봐 줘서 <b>엄청 하찮게 느낀 적</b>이 있어요. 지문은 그런 경험 없이는 아무도 유명해지길 원하지 않는대요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">We sense the need</div><div class=\"k\">우리는 욕구를 느낀다</div></div><div class=\"rc ckc\"><div class=\"e\">for a great deal of <span class=\"cw\">admiring attention</span></div><div class=\"k\"><span class=\"cw\">감탄하며 바라보는 많은 관심에 대한</span></div></div><div class=\"rc\"><div class=\"e\">when we have been painfully exposed</div><div class=\"k\">우리가 고통스럽게 경험해 본 적이 있을 때</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">earlier deprivation</span>.</div><div class=\"k\"><span class=\"cw\">보다 일찍 박탈감을</span>.</div></div><div class=\"rnat\">우리가 보다 일찍 박탈감을 고통스럽게 경험해 본 적이 있을 때, 우리는 감탄하며 바라보는 많은 관심에 대한(많은 이들로부터 대단하다고 주목받고 싶은) 욕구를 느낀다.</div><div class=\"rst\">어릴 때 관심을 <b>빼앗긴</b>(deprivation 박탈) 아픈 기억이 있으면, 많은 사람의 감탄 어린 관심을 바라게 돼요. = 지문 3번의 핵심이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Perhaps</div><div class=\"k\">아마도</div></div><div class=\"rc\"><div class=\"e\">one’s parents</div><div class=\"k\">누군가의 부모님들은</div></div><div class=\"rc\"><div class=\"e\">were hard to impress.</div><div class=\"k\">감동시키기가 어려웠을 것이다.</div></div><div class=\"rnat\">아마도 누군가의 부모님들은 감동시키기가 어려웠을 것이다.</div><div class=\"rst\">예를 들면 그 친구 부모님은 웬만해선 “잘했다!” 소리를 안 하셨을 거예요. = 지문의 감동시키기 어려운 부모예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\">They <span class=\"cw\">never noticed one much</span>,</div><div class=\"k\">그들(= 부모)은 <span class=\"cw\">결코 그(= 아이)에게 관심을 많이 기울이지 않았고</span>,</div></div><div class=\"rc\"><div class=\"e\">they were so busy</div><div class=\"k\">너무 바빴으며</div></div><div class=\"rc\"><div class=\"e\">with other things,</div><div class=\"k\">다른 일들을 하느라,</div></div><div class=\"rc\"><div class=\"e\">focusing on other famous people,</div><div class=\"k\">다른 유명한 사람들에게 집중하고 있었거나,</div></div><div class=\"rc\"><div class=\"e\">unable to have or express</div><div class=\"k\">갖거나 표현할 수 없었거나,</div></div><div class=\"rc\"><div class=\"e\">kind feelings,</div><div class=\"k\">친절한 감정을,</div></div><div class=\"rc\"><div class=\"e\">or just working too hard.</div><div class=\"k\">또는 그저 너무 열심히 일하고 있었다.</div></div><div class=\"rnat\">그들(부모)은 결코 그(아이)에게 관심을 많이 기울이지 않았고, 다른 일들을 하느라 너무 바빴으며 다른 유명한 사람들에게 집중하고 있었거나, 친절한 감정을 갖거나 표현할 수 없었거나, 또는 그저 너무 열심히 일하고 있었다.</div><div class=\"rst\">부모님이 바쁘고, 다른 일만 보고, 따뜻한 말도 못 해 줘서 친구에게 <b>관심을 거의 안 줬어요</b>. = 지문의 never noticed(관심을 기울이지 않았다).</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">There were no bedtime stories</div><div class=\"k\">잠자기 전에 들려주는 이야기는 없었고</div></div><div class=\"rc\"><div class=\"e\">and one’s school reports</div><div class=\"k\">그(= 아이)의 학교 통지표들은</div></div><div class=\"rc\"><div class=\"e\">weren’t the subject</div><div class=\"k\">대상이 아니었다</div></div><div class=\"rc\"><div class=\"e\">of praise and admiration.</div><div class=\"k\">칭찬과 감탄의.</div></div><div class=\"rnat\">잠자기 전에 들려주는 이야기는 없었고, 그(아이)의 학교 통지표들은 칭찬과 감탄의 대상이 아니었다.</div><div class=\"rst\">자기 전에 책 읽어 주는 사람도 없었고, 성적표를 가져가도 칭찬 한 마디 없었어요. 지문도 칭찬과 감탄의 대상이 아니었다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">That’s why</div><div class=\"k\">그것이 ~하는 이유이다</div></div><div class=\"rc\"><div class=\"e\">one dreams</div><div class=\"k\">누군가가 꿈꾸는</div></div><div class=\"rc\"><div class=\"e\">that one day</div><div class=\"k\">어느 날</div></div><div class=\"rc\"><div class=\"e\">the world will pay attention.</div><div class=\"k\">세상이 관심을 가져 주기를.</div></div><div class=\"rnat\">그것이 누군가가 어느 날 세상이 관심을 가져 주기를 꿈꾸는 이유이다.</div><div class=\"rst\"><b>그래서</b>(That’s why) 친구는 언젠가 온 세상이 자기를 봐 주는 날을 꿈꿔요. = 지문 7번이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">When we’re famous,</div><div class=\"k\">우리가 유명하면,</div></div><div class=\"rc\"><div class=\"e\">our parents</div><div class=\"k\">우리의 부모도</div></div><div class=\"rc\"><div class=\"e\">will have to admire us too.</div><div class=\"k\">우리에게 감탄할 수밖에 없을 것이다.</div></div><div class=\"rnat\">우리가 유명하면, 우리의 부모도 틀림없이 우리에게 감탄할 수밖에 없을 것이다.</div><div class=\"rst\">유명해지면 부모님도 “와!” 하고 감탄할 수밖에 없으니까요. 결국 빈칸은 관심 못 받은 <b>방치의 경험</b>(experience of neglect)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"has its roots in\" data-m=\"~에 뿌리를 두다\"><b>has its roots in</b>~에 뿌리를 두다</button><button type=\"button\" class=\"wdb\" data-w=\"insignificant\" data-m=\"하찮은\"><b>insignificant</b>하찮은</button><button type=\"button\" class=\"wdb\" data-w=\"admiring attention\" data-m=\"감탄 어린 관심\"><b>admiring attention</b>감탄 어린 관심</button><button type=\"button\" class=\"wdb\" data-w=\"deprivation\" data-m=\"박탈, 결핍\"><b>deprivation</b>박탈, 결핍</button><button type=\"button\" class=\"wdb\" data-w=\"neglect\" data-m=\"방치, 무관심\"><b>neglect</b>방치, 무관심</button><button type=\"button\" class=\"wdb\" data-w=\"admiration\" data-m=\"감탄\"><b>admiration</b>감탄</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 바로 뒤 <b>for instance</b>(예를 들어)가 신호예요. 뒤에 나오는 예시 두 개가 <b>겉모습만 보고 판단하면 안 된다</b>는 말이니, 그 예시를 한 어구로 묶는 보기를 고르세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (6번)</span><div class=\"en\">For that reason, Mary Ellen O’Toole … emphasizes the need <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> in order to understand them.</div><p class=\"ko\">그런 이유로, O’Toole은 그들을 이해하기 위해 ( ? )할 필요성을 강조한다</p></div><div class=\"ck-via\"><i>▼</i><span>for instance(예를 들어) = 빈칸 내용을 보여 주는 예</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 첫 번째 예시</span><div class=\"en\">It is not safe, <mark>for instance</mark>, to assume that a stranger is a good neighbor, <mark>just because they’re polite</mark>.</div><p class=\"ko\"><mark>예를 들어</mark>, <mark>단지 그들이 예의 바르다는 이유만으로</mark> 낯선 사람이 좋은 이웃이라고 가정하는 것은 안전하지 않다.</p></div><div class=\"ck-via\"><i>▼</i><span>예의 바름에 이어, 잘 차려입은 겉모습도 전부가 아니라고 해요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 · 두 번째 예시</span><div class=\"en\">Seeing them follow a routine of going out every morning well-dressed doesn’t mean <mark>that’s the whole story</mark>.</div><p class=\"ko\">그들이 매일 아침 잘 차려입고 외출하는 일과를 따르는 것을 보는 것이 <mark>그것이 전부라는 것을</mark> 의미하지는 않는다.</p></div><div class=\"ck-via\"><i>▼</i><span>범죄자는 속이는 데 능숙해서 겉모습·느낌을 믿으면 안 돼요</span></div><div class=\"ck-step\"><span class=\"lab\">9~10번 · 이유 덧붙이기</span><div class=\"en\">In fact, O’Toole says that when you are dealing with a criminal, <mark>even your feelings may fail you</mark>.</div><p class=\"ko\">사실, O’Toole은 범죄자를 다룰 때 <mark>심지어 당신의 느낌조차도 당신에게 도움이 되지 않을 수 있다고</mark> 말한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">go beyond a person's superficial qualities 사람의 피상적 특성을 넘어서다<small>예의 바름(7번)·잘 차려입음(8번) = 겉모습, 그 너머를 봐야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">trust your first impressions of others 다른 사람의 첫인상을 믿다</span><span class=\"why\">정반대예요. 7번은 예의 바르다는 첫인상만 믿는 게 안전하지 않다고 했고, 9번은 느낌조차 믿을 수 없다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">narrow down your network in social media 소셜 미디어 인맥을 좁히다</span><span class=\"why\">3번에서 network(인맥)가 나오지만 낯선 사람을 만나 넓힌다는 말이에요. 소셜 미디어 이야기는 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">focus on intelligence rather than wealth 부보다 지능에 집중하다</span><span class=\"why\">4번 economic benefit(경제적 이익)과 엮은 함정이에요. 지능과 부를 비교하는 내용은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">take advantage of criminals 범죄자를 이용하다</span><span class=\"why\">10번에서 오히려 범죄자가 조작과 사기로 사람을 속인다고 해요. 범죄자를 이용하라는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Do you advise your kids</div><div class=\"k\">당신은 당신의 아이들에게 조언하는가</div></div><div class=\"rc\"><div class=\"e\">to keep away from strangers?</div><div class=\"k\">낯선 사람들을 멀리하라고?</div></div><div class=\"rnat\">당신은 당신의 아이들에게 낯선 사람들을 멀리하라고 조언하는가?</div><div class=\"rst\">어른들이 “모르는 사람 따라가지 마!” 하고 말하죠. 지문도 아이들에게 낯선 사람을 멀리하라고 하는지 물어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">That’s a tall order</div><div class=\"k\">그것은 터무니없는 요구이다</div></div><div class=\"rc\"><div class=\"e\">for adults.</div><div class=\"k\">어른들에게는.</div></div><div class=\"rnat\">그것은 어른들에게는 터무니없는 요구이다.</div><div class=\"rst\">그런데 어른한테는 그 말이 무리예요. = 지문의 a tall order(터무니없는 요구).</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">After all,</div><div class=\"k\">결국에는,</div></div><div class=\"rc\"><div class=\"e\">you expand your network of friends</div><div class=\"k\">당신은 인맥을 넓히고</div></div><div class=\"rc\"><div class=\"e\">and create potential business partners</div><div class=\"k\">잠재적인 사업 파트너를 만든다</div></div><div class=\"rc\"><div class=\"e\">by meeting strangers.</div><div class=\"k\">낯선 사람들을 만남으로써.</div></div><div class=\"rnat\">결국에는, 당신은 낯선 사람들을 만남으로써 당신의 인맥을 넓히고 잠재적인 사업 파트너를 만든다.</div><div class=\"rst\">새 학원, 새 반에 가면 처음 보는 친구를 만나야 친구가 늘어요. 지문도 낯선 사람을 만나 인맥을 넓힌대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Throughout this process,</div><div class=\"k\">이 과정에서,</div></div><div class=\"rc\"><div class=\"e\">however,</div><div class=\"k\">그러나,</div></div><div class=\"rc\"><div class=\"e\">analyzing people</div><div class=\"k\">사람들을 분석하는 것은</div></div><div class=\"rc\"><div class=\"e\">to understand their personalities</div><div class=\"k\">그들의 성격을 이해하기 위해</div></div><div class=\"rc\"><div class=\"e\">is not all about</div><div class=\"k\">~에 대한 것만은 아니다</div></div><div class=\"rc\"><div class=\"e\">potential economic or social benefit.</div><div class=\"k\">잠재적인 경제적 또는 사회적 이익.</div></div><div class=\"rnat\">그러나 이 과정에서 사람들의 성격을 이해하기 위해 그들을 분석하는 것은 잠재적인 경제적 또는 사회적 이익에 대한 것만은 아니다.</div><div class=\"rst\"><b>그러나</b>(however) 새 친구를 살펴보는 건 “친해지면 좋겠다”만을 위한 게 아니에요. = 이익만의 문제가 아니라는 지문의 말.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">There is your safety</div><div class=\"k\">당신의 안전도 있다</div></div><div class=\"rc\"><div class=\"e\">to think about,</div><div class=\"k\">생각해 보아야 할,</div></div><div class=\"rc\"><div class=\"e\">as well as the safety</div><div class=\"k\">~의 안전뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">of your loved ones.</div><div class=\"k\">당신이 사랑하는 사람들의.</div></div><div class=\"rnat\">당신이 사랑하는 사람들의 안전뿐만 아니라, 생각해 보아야 할 당신의 안전도 있다.</div><div class=\"rst\">나랑 가족이 <b>안전</b>한지도 생각해야 해요. 지문도 나와 사랑하는 사람들의 안전을 말해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">For that reason,</div><div class=\"k\">그런 이유로,</div></div><div class=\"rc\"><div class=\"e\">Mary Ellen O’Toole,</div><div class=\"k\">Mary Ellen O’Toole은,</div></div><div class=\"rc\"><div class=\"e\">who is a retired FBI profiler,</div><div class=\"k\">은퇴한 FBI 프로파일러인,</div></div><div class=\"rc\"><div class=\"e\">emphasizes the need</div><div class=\"k\">필요성을 강조한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to go beyond a person’s superficial qualities</span></div><div class=\"k\"><span class=\"cw\">개인의 피상적 특성을 넘어설</span>※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">in order to understand them.</div><div class=\"k\">그들을 이해하기 위해.</div></div><div class=\"rnat\">그런 이유로, 은퇴한 FBI 프로파일러인 Mary Ellen O’Toole은 그들을 이해하기 위해 (빈칸)할 필요성을 강조한다.</div><div class=\"rst\">그래서 전직 FBI(미국 연방수사국) 수사관은 사람을 이해하려면 빈칸, 곧 <b>겉모습 너머를 봐야</b> 한다고 강조해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">It is not safe,</div><div class=\"k\">안전하지 않다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">for instance</span>,</div><div class=\"k\"><span class=\"cw\">예를 들어</span>,</div></div><div class=\"rc\"><div class=\"e\">to assume that a stranger is a good neighbor,</div><div class=\"k\">낯선 사람이 좋은 이웃이라고 가정하는 것은,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">just because they’re polite</span>.</div><div class=\"k\"><span class=\"cw\">단지 그들이 예의 바르다는 이유만으로</span>.</div></div><div class=\"rnat\">예를 들어, 단지 낯선 사람이 예의 바르다는 이유로 그들이 좋은 이웃이라고 가정하는 것은 안전하지 않다.</div><div class=\"rst\"><b>예를 들어</b>(for instance) 인사를 잘한다고 다 좋은 이웃은 아니에요. 지문은 <b>예의 바르다는 이유만으로</b> 믿으면 위험하대요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Seeing them follow a routine</div><div class=\"k\">그들이 규칙적인 일과를 따르는 것을 보는 것은</div></div><div class=\"rc\"><div class=\"e\">of going out every morning well-dressed</div><div class=\"k\">매일 아침 잘 차려입고 외출하는</div></div><div class=\"rc\"><div class=\"e\">doesn’t mean</div><div class=\"k\">의미하지는 않는다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that’s the whole story</span>.</div><div class=\"k\"><span class=\"cw\">그것이 전부라는 것을</span>.</div></div><div class=\"rnat\">그들이 매일 아침 잘 차려입고 외출하는 일상을 따르는 것을 보는 것이 전부를 의미하지는 않는다.</div><div class=\"rst\">매일 아침 깔끔하게 차려입고 나가는 이웃도 그게 <b>전부</b>는 아닐 수 있어요. = 지문의 whole story(전부).</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">O’Toole says</div><div class=\"k\">O’Toole은 말한다</div></div><div class=\"rc\"><div class=\"e\">that when you are dealing with a criminal,</div><div class=\"k\">당신이 범죄자를 다룰 때,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">even your feelings may fail you</span>.</div><div class=\"k\"><span class=\"cw\">심지어 당신의 느낌조차도 당신에게 도움이 되지 않을 수 있다고</span>.</div></div><div class=\"rnat\">사실, O’Toole은 당신이 범죄자를 다룰 때, 심지어 당신이 가진 (범죄자에 대한) 느낌조차도 당신에게 도움이 되지 않을 수 있다고 말한다.</div><div class=\"rst\"><b>사실</b>(In fact) 나쁜 사람 앞에서는 “좋은 사람 같아” 하는 느낌조차 틀릴 수 있어요. = 지문 9번이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">That’s because</div><div class=\"k\">그것은 ~때문이다</div></div><div class=\"rc\"><div class=\"e\">criminals have perfected the art</div><div class=\"k\">범죄자들이 기술을 완벽하게 해왔기</div></div><div class=\"rc\"><div class=\"e\">of manipulation and deceit.</div><div class=\"k\">조작과 사기의.</div></div><div class=\"rnat\">그것은 범죄자들이 조작과 사기의 기술을 완벽하게 해왔기 때문이다.</div><div class=\"rst\">나쁜 사람은 속이는 기술이 아주 뛰어나니까요. 그래서 빈칸은 겉모습을 넘어서라(go beyond 넘어서다)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"tall order\" data-m=\"무리한 요구\"><b>tall order</b>무리한 요구</button><button type=\"button\" class=\"wdb\" data-w=\"potential\" data-m=\"잠재적인\"><b>potential</b>잠재적인</button><button type=\"button\" class=\"wdb\" data-w=\"emphasize\" data-m=\"강조하다\"><b>emphasize</b>강조하다</button><button type=\"button\" class=\"wdb\" data-w=\"superficial\" data-m=\"피상적인, 겉모습의\"><b>superficial</b>피상적인, 겉모습의</button><button type=\"button\" class=\"wdb\" data-w=\"assume\" data-m=\"가정하다, 추정하다\"><b>assume</b>가정하다, 추정하다</button><button type=\"button\" class=\"wdb\" data-w=\"deceit\" data-m=\"속임수, 사기\"><b>deceit</b>속임수, 사기</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 <b>바다는 경계가 흐릿하고 물이 생물을 여기저기 옮긴다</b>예요. 물이 움직인다는 같은 소재를 쓰지만 <b>방향이 반대</b>인 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글 전체 화제</span><div class=\"en\">The major oceans are all <mark>interconnected</mark>, so that their geographical boundaries are <mark>less clear</mark> than those of the continents.</div><p class=\"ko\">주요 대양들은 모두 <mark>서로 연결되어 있어서</mark>, 그것들의 지리적 경계는 대륙의 그것보다 <mark>덜 명확하다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>①의 움직이는 물이 생물을 옮겨서 경계가 흐려져요</span></div><div class=\"ck-step\"><span class=\"lab\">②(4번) · 화제 이어 가기</span><div class=\"en\">These moving waters <mark>carry marine organisms</mark> from place to place, …</div><p class=\"ko\">이 이동하는 물은 여기저기로 <mark>해양 생물을 운반하고</mark>, …</p></div><div class=\"ck-via\"><i>▼</i><span>“여기저기 옮긴다”를 받아야 할 자리에 “덜 옮기고 가둔다”가 와요</span></div><div class=\"ck-step key\"><span class=\"lab\">③(5번) · 이탈 지점</span><div class=\"en\">In other words, coastal ocean currents not only move animals <mark>much less often than expected</mark>, but they also <mark>trap animals</mark> within near-shore regions.</div><p class=\"ko\">즉, 연안 해류는 <mark>예상보다 훨씬 덜 자주</mark> 동물을 이동시킬 뿐만 아니라, 연안 지역 내에 <mark>동물을 가둔다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>③을 빼면 ② 생물 운반 → ④ 점진적 변화 → ⑤ 경계 없음으로 이어져요</span></div><div class=\"ck-step\"><span class=\"lab\">④·⑤(6·7번) · 다시 제자리</span><div class=\"en\">There are <mark>no firm boundaries</mark> within the open oceans …</div><p class=\"ko\">훤히 트인 대양 내에는 <mark>확실한 경계는 없다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">연안 해류는 동물을 훨씬 덜 자주 옮기고 연안에 가둔다<small>글은 물이 생물을 옮겨 경계가 흐릿하다는데, ③만 반대로 가둔다고 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">해수 환경 사이 변화는 매우 점진적이고 넓게 퍼져 있다</span><span class=\"why\">gradients(변화도) 같은 어려운 말 때문에 튀어 보이지만, 변화가 아주 점진적이라 경계가 흐릿하다는 1번 화제를 Furthermore(게다가)로 보태요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">각 대양 분지의 물이 천천히 회전해 바다가 끊임없이 움직인다</span><span class=\"why\">바다가 움직인다는 말로 ②의 These moving waters(이 이동하는 물)를 준비해요. 화제와 바로 이어져요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">움직이는 물이 해양 생물과 유충을 여기저기 옮긴다</span><span class=\"why\">These moving waters(이 이동하는 물)가 ①을 받고, 생물이 옮겨지니 2번처럼 생물 군집 차이가 적어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">트인 대양에는 확실한 경계가 없다</span><span class=\"why\">no firm boundaries(확실한 경계는 없다)로 1번 less clear(덜 명확하다)를 다시 말하며 글을 마무리해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc ckc\"><div class=\"e\">The major oceans are all <span class=\"cw\">interconnected</span>,</div><div class=\"k\">주요 대양들은 모두 <span class=\"cw\">서로 연결되어 있어서</span>,</div></div><div class=\"rc\"><div class=\"e\">so that their geographical boundaries</div><div class=\"k\">그것들(= 대양들)의 지리적 경계는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are less clear</span></div><div class=\"k\"><span class=\"cw\">덜 명확하다</span></div></div><div class=\"rc\"><div class=\"e\">than those of the continents.</div><div class=\"k\">대륙의 그것(= 지리적 경계)보다.</div></div><div class=\"rnat\">주요 대양은 모두 서로 연결되어 있어서, 대양의 지리적 경계는 대륙의 지리적 경계보다 덜 명확하다.</div><div class=\"rst\">학교 운동장은 반마다 금을 그을 수 있지만, 수영장은 레인끼리 물이 다 <b>이어져</b> 있어요. 지문도 바다는 서로 연결돼 경계가 덜 분명하대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">As a result,</div><div class=\"k\">결과적으로,</div></div><div class=\"rc\"><div class=\"e\">their biotas show</div><div class=\"k\">그것들(= 대양들)의 생물 군집은 보여 준다</div></div><div class=\"rc\"><div class=\"e\">fewer clear differences</div><div class=\"k\">명확한 차이를 덜</div></div><div class=\"rc\"><div class=\"e\">than those on land.</div><div class=\"k\">육지에서의 그것(= 생물 군집)보다.</div></div><div class=\"rnat\">결과적으로, 대양의 생물 군집은 육지에서의 생물 군집보다 명확한 차이를 덜 보여 준다.</div><div class=\"rst\">그래서 수영장 이쪽 물과 저쪽 물은 별 차이가 없어요. = 지문의 바다 생물 군집은 육지보다 차이가 적다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">① The oceans themselves</div><div class=\"k\">① 대양 자체는</div></div><div class=\"rc\"><div class=\"e\">are continually moving</div><div class=\"k\">끊임없이 움직인다</div></div><div class=\"rc\"><div class=\"e\">because the water</div><div class=\"k\">물이 ~하기 때문에</div></div><div class=\"rc\"><div class=\"e\">within each ocean basin</div><div class=\"k\">각 대양 분지 내에서</div></div><div class=\"rc\"><div class=\"e\">slowly rotates.</div><div class=\"k\">천천히 회전하기.</div></div><div class=\"rnat\">① 각 대양 분지 내에서 물이 천천히 회전하기 때문에 대양 자체가 끊임없이 움직인다.</div><div class=\"rst\">① 수영장 물은 순환 장치로 천천히 빙빙 돌아요. = 지문의 대양 물이 천천히 회전해 계속 움직인다는 말.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">② These moving waters</div><div class=\"k\">② 이 이동하는 물은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">carry marine organisms</span></div><div class=\"k\"><span class=\"cw\">해양 생물을 운반하고</span></div></div><div class=\"rc\"><div class=\"e\">from place to place,</div><div class=\"k\">여기저기로,</div></div><div class=\"rc\"><div class=\"e\">and also help</div><div class=\"k\">또한 돕는다</div></div><div class=\"rc\"><div class=\"e\">the dispersal of their young or larvae.</div><div class=\"k\">그들(= 해양 생물)의 새끼나 유충의 분산을.</div></div><div class=\"rnat\">② 이 이동하는 물은 해양 생물을 여기저기로 운반하고, 또한 그들의 새끼나 유충의 분산을 돕는다.</div><div class=\"rst\">② 그렇게 도는 물이 떠 있는 장난감 공을 <b>이쪽저쪽으로 옮겨</b> 줘요. = 지문의 물이 해양 생물과 새끼를 여기저기 운반한다는 말.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">③ In other words,</div><div class=\"k\">③ 즉,</div></div><div class=\"rc\"><div class=\"e\">coastal ocean currents</div><div class=\"k\">연안 해류는</div></div><div class=\"rc\"><div class=\"e\">not only move animals</div><div class=\"k\">동물을 이동시킬 뿐만 아니라</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">much less often than expected</span>,</div><div class=\"k\"><span class=\"cw\">예상보다 훨씬 덜 자주</span>,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but they also trap animals</span></div><div class=\"k\"><span class=\"cw\">또한 동물을 가둔다</span></div></div><div class=\"rc\"><div class=\"e\">within near-shore regions.</div><div class=\"k\">연안 지역 내에.</div></div><div class=\"rnat\">③ 즉, 연안 해류는 예상보다 훨씬 덜 자주 동물을 이동시킬 뿐만 아니라 또한 연안 지역 내에 동물을 가둔다.</div><div class=\"rst\">③ 갑자기 “물이 공을 <b>훨씬 덜 옮기고</b> 가장자리에 <b>가둔다</b>”는 말이 나와요. 옮긴다는 흐름과 반대라 지문에서 튀어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">④ Furthermore,</div><div class=\"k\">④ 게다가,</div></div><div class=\"rc\"><div class=\"e\">the gradients</div><div class=\"k\">변화도는</div></div><div class=\"rc\"><div class=\"e\">between the environments</div><div class=\"k\">환경 사이의</div></div><div class=\"rc\"><div class=\"e\">of different areas of ocean water mass</div><div class=\"k\">다양한 지역의 해수 덩어리의</div></div><div class=\"rc\"><div class=\"e\">are very gradual</div><div class=\"k\">매우 점진적이며</div></div><div class=\"rc\"><div class=\"e\">and often extend over wide areas</div><div class=\"k\">종종 넓은 지역에 걸쳐 있다</div></div><div class=\"rc\"><div class=\"e\">that are inhabited by</div><div class=\"k\">~에 의해 서식되는</div></div><div class=\"rc\"><div class=\"e\">a great variety of organisms</div><div class=\"k\">매우 다양한 종류의 유기체에</div></div><div class=\"rc\"><div class=\"e\">of differing ecological tolerances.</div><div class=\"k\">서로 다른 생태학적 내성을 가진.</div></div><div class=\"rnat\">④ 게다가 다양한 지역의 해수 덩어리 환경 사이에서 변화도는 매우 점진적이며, 종종 상이한 생태학적 내성을 가진 매우 다양한 종류의 유기체에 의해 서식되는 넓은 지역에 걸쳐 있다.</div><div class=\"rst\">④ <b>게다가</b>(Furthermore) 수영장 물 온도는 이쪽에서 저쪽으로 아주 조금씩 바뀌어요. = 지문의 점진적인 변화도예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\">⑤ <span class=\"cw\">There are no firm boundaries</span></div><div class=\"k\">⑤ <span class=\"cw\">확실한 경계는 없다</span></div></div><div class=\"rc\"><div class=\"e\">within the open oceans</div><div class=\"k\">훤히 트인 대양 내에는</div></div><div class=\"rc\"><div class=\"e\">although there may be barriers</div><div class=\"k\">비록 장애물이 있을 수는 있지만</div></div><div class=\"rc\"><div class=\"e\">to the movement of organisms.</div><div class=\"k\">유기체의 이동에.</div></div><div class=\"rnat\">⑤ 비록 유기체의 이동에 장애물이 있을 수 있지만, 훤히 트인 대양 내에 확실한 경계는 없다.</div><div class=\"rst\">⑤ 그래서 넓은 수영장 안에는 딱 잘린 선이 없어요. = 지문의 <b>확실한 경계는 없다</b>(no firm boundaries)는 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"interconnected\" data-m=\"서로 연결된\"><b>interconnected</b>서로 연결된</button><button type=\"button\" class=\"wdb\" data-w=\"geographical boundaries\" data-m=\"지리적 경계\"><b>geographical boundaries</b>지리적 경계</button><button type=\"button\" class=\"wdb\" data-w=\"biota\" data-m=\"생물 군집\"><b>biota</b>생물 군집</button><button type=\"button\" class=\"wdb\" data-w=\"dispersal\" data-m=\"분산, 퍼뜨림\"><b>dispersal</b>분산, 퍼뜨림</button><button type=\"button\" class=\"wdb\" data-w=\"trap\" data-m=\"가두다\"><b>trap</b>가두다</button><button type=\"button\" class=\"wdb\" data-w=\"gradient\" data-m=\"변화도\"><b>gradient</b>변화도</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>비교 신호</b>를 잡는 문제. <b>larger than in ordinary muscles</b>(일반 근육에서보다 더 크게)라고 했으니, 바로 앞에 <b>일반 근육</b>의 약한 전류 이야기가 먼저 나와야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 비교 신호</span><div class=\"en\">In the electric organ the muscle cells are connected <mark>in larger chunks</mark>, which makes the total current intensity <mark>larger than in ordinary muscles</mark>.</div><p class=\"ko\">전기 기관 안에서 근육 세포는 <mark>더 큰 덩어리로</mark> 연결되어 있고, 그것은 <mark>일반 근육에서보다</mark> 총 전류 강도를 더 크게 만든다.</p></div><div class=\"ck-via\"><i>▼</i><span>비교 대상 ordinary muscles(일반 근육)가 처음 나오는 곳</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · 앞 문장 (② 바로 앞)</span><div class=\"en\">A <mark>weak electric current</mark> is created also in <mark>ordinary muscle cells</mark> when they contract.</div><p class=\"ko\">근육 세포가 수축할 때 <mark>일반적인 근육 세포 안에서도</mark> 또한 <mark>약한 전류가</mark> 생긴다.</p></div><div class=\"ck-via\"><i>▼</i><span>센 전류를 만드는 법을 말한 뒤, 그 신호를 어떻게 바꾸는지로 넘어가요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 뒤 문장 (② 바로 뒤)</span><div class=\"en\">The fish <mark>varies the signals</mark> by changing the form of the electric field or the frequency of discharging.</div><p class=\"ko\">물고기는 전기장의 형태 또는 방출 주파수를 바꿈으로써 <mark>신호를 다양하게 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>일반 근육 세포도 수축할 때 약한 전류가 생김</span><span><em>주어진 문장</em>전기 기관은 큰 덩어리로 연결돼 일반 근육보다 전류가 셈</span><span><em>6번</em>물고기가 그 신호의 모양·주파수를 바꿈</span></div><div class=\"ck-eq\">⇒ 약한 전류 → 더 센 전류(비교) → 신호 바꾸기, 세 고리가 다 맞는 자리 = ②</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">5번 문장과 6번 문장 사이<small>5번 ordinary muscle cells(일반 근육 세포)를 바로 받아 “그보다 더 크게”로 비교해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">electric organ(전기 기관)이 4번에도 나와 끌리지만, 여기 넣으면 ordinary muscles(일반 근육)를 비교하는 말이 일반 근육 소개(5번)보다 먼저 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">6번은 이미 신호를 바꾸는 방법으로 넘어갔어요. 5번 일반 근육과 멀어져서 비교가 뚝 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">7번 문장과 8번 문장 사이</span><span class=\"why\">8번 This(이것)는 7번 “짧은 거리에서만 작동”을 받아 이점이라고 해요. 사이에 끼우면 This(이것)가 가리킬 대상이 어긋나요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">8번 문장과 9번 문장 사이</span><span class=\"why\">8·9번은 큰 무리에서 짧은 범위가 간섭을 줄인다는 설명이 이어지는 중이에요. 전류 세기 비교가 끼어들 자리가 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">In the electric organ</div><div class=\"k\">전기 기관 안에서</div></div><div class=\"rc\"><div class=\"e\">the muscle cells are connected</div><div class=\"k\">근육 세포는 연결되어 있고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in larger chunks</span>,</div><div class=\"k\"><span class=\"cw\">더 큰 덩어리로</span>,</div></div><div class=\"rc\"><div class=\"e\">which makes</div><div class=\"k\">그리고 그것은 만든다</div></div><div class=\"rc\"><div class=\"e\">the total current intensity larger</div><div class=\"k\">총 전류 강도를 더 크게</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">than in ordinary muscles</span>.</div><div class=\"k\"><span class=\"cw\">일반 근육에서보다</span>.</div></div><div class=\"rnat\">[주어진 문장] 전기 기관 안에서 근육 세포는 더 큰 덩어리로 연결되고, 이것은 일반 근육에서보다 총 전류 강도를 더 크게 만든다.</div><div class=\"rst\">〈주어진 문장〉 전기 기관은 근육 세포가 <b>더 큰 덩어리</b>로 이어져 있어, <b>일반 근육보다</b> 전류가 더 세요. = 지문의 비교 문장.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Electric communication</div><div class=\"k\">전기적 의사소통은</div></div><div class=\"rc\"><div class=\"e\">is mainly known</div><div class=\"k\">주로 알려져 있다</div></div><div class=\"rc\"><div class=\"e\">in fish.</div><div class=\"k\">물고기에서.</div></div><div class=\"rnat\">전기적 의사소통은 주로 물고기에서(물고기가 한다고) 알려져 있다.</div><div class=\"rst\">체육 시간에 친구들이 손뼉 신호로 말을 주고받듯, 물고기는 전기로 말해요. 지문도 전기 의사소통은 주로 물고기에서 알려졌대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The electric signals</div><div class=\"k\">전기 신호는</div></div><div class=\"rc\"><div class=\"e\">are produced</div><div class=\"k\">생성된다</div></div><div class=\"rc\"><div class=\"e\">in special electric organs.</div><div class=\"k\">특별한 전기 기관에서.</div></div><div class=\"rnat\">전기 신호는 특별한 전기 기관에서 생성된다.</div><div class=\"rst\">그 전기 신호는 몸속 특별한 '전기 기관'에서 만들어요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">When the signal is discharged</div><div class=\"k\">신호가 방출되면</div></div><div class=\"rc\"><div class=\"e\">the electric organ will be negatively loaded</div><div class=\"k\">전기 기관은 음전하를 띨 것이고</div></div><div class=\"rc\"><div class=\"e\">compared to the head</div><div class=\"k\">머리와 비교해서</div></div><div class=\"rc\"><div class=\"e\">and an electric field is created</div><div class=\"k\">전기장이 생긴다</div></div><div class=\"rc\"><div class=\"e\">around the fish.</div><div class=\"k\">물고기 주위에.</div></div><div class=\"rnat\">신호가 방출되면 머리와 비교해서 전기 기관이 음전하를 띨 것이고 전기장이 물고기 주위에 생긴다.</div><div class=\"rst\">신호를 내보내면 물고기 몸 둘레에 보이지 않는 전기 마당(전기장)이 생겨요. = 지문의 electric field(전기장).</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">( ① ) <span class=\"cw\">A weak electric current</span></div><div class=\"k\">( ① ) <span class=\"cw\">약한 전류가</span></div></div><div class=\"rc\"><div class=\"e\">is created also</div><div class=\"k\">또한 생긴다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in ordinary muscle cells</span></div><div class=\"k\"><span class=\"cw\">일반적인 근육 세포 안에서도</span></div></div><div class=\"rc\"><div class=\"e\">when they contract.</div><div class=\"k\">그것들(= 근육 세포들)이 수축할 때.</div></div><div class=\"rnat\">① 일반적인 근육 세포가 수축할 때 약한 전류가 그 안에서도 발생한다.</div><div class=\"rst\">사실 우리 팔 근육도 힘줄 때 아주 <b>약한 전류</b>가 생겨요. 지문도 <b>일반 근육 세포</b>에서도 약한 전류가 생긴대요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">( ② ) The fish varies the signals</div><div class=\"k\">( ② ) 물고기는 신호를 다양하게 한다</div></div><div class=\"rc\"><div class=\"e\">by changing the form</div><div class=\"k\">형태를 바꿈으로써</div></div><div class=\"rc\"><div class=\"e\">of the electric field</div><div class=\"k\">전기장의</div></div><div class=\"rc\"><div class=\"e\">or the frequency of discharging.</div><div class=\"k\">또는 방출 주파수를.</div></div><div class=\"rnat\">② 물고기는 전기장의 형태나 방출 주파수를 바꿈으로써 신호를 다양하게 한다.</div><div class=\"rst\">물고기는 손뼉 리듬을 바꾸듯 전기장 모양이나 내보내는 횟수를 바꿔 <b>신호를 다양하게</b> 해요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">( ③ ) The system</div><div class=\"k\">( ③ ) 그 체계는</div></div><div class=\"rc\"><div class=\"e\">is only working</div><div class=\"k\">오직 작동한다</div></div><div class=\"rc\"><div class=\"e\">over small distances,</div><div class=\"k\">짧은 거리에서만,</div></div><div class=\"rc\"><div class=\"e\">about one to two meters.</div><div class=\"k\">약 1~2미터 정도의.</div></div><div class=\"rnat\">③ 그 체계는 오직 약 1~2미터 정도의 짧은 거리에서만 작동한다.</div><div class=\"rst\">그런데 이 신호는 교실 한 칸쯤, 약 1~2미터 안에서만 통해요. = 지문의 짧은 거리.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">( ④ ) This is an advantage</div><div class=\"k\">( ④ ) 이것(= 앞 문장의 내용)은 이점이다</div></div><div class=\"rc\"><div class=\"e\">since the species</div><div class=\"k\">종들이 ~하기 때문에</div></div><div class=\"rc\"><div class=\"e\">using the signal system</div><div class=\"k\">신호 체계를 사용하는</div></div><div class=\"rc\"><div class=\"e\">often live in large groups</div><div class=\"k\">흔히 큰 무리를 지어 산다</div></div><div class=\"rc\"><div class=\"e\">with several other species.</div><div class=\"k\">다른 여러 종들과 함께.</div></div><div class=\"rnat\">④ 신호 체계를 사용하는 종들이 흔히 큰 무리를 지어서 다른 여러 종들과 함께 살기 때문에 이것은 이점이다.</div><div class=\"rst\"><b>이것</b>(This)은 오히려 좋은 점이에요. 이 물고기들은 여러 종과 큰 무리를 지어 살거든요. = 지문 8번.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">( ⑤ ) If many fish</div><div class=\"k\">( ⑤ ) 만약 많은 물고기가</div></div><div class=\"rc\"><div class=\"e\">send out signals</div><div class=\"k\">신호를 보내면</div></div><div class=\"rc\"><div class=\"e\">at the same time,</div><div class=\"k\">동시에,</div></div><div class=\"rc\"><div class=\"e\">the short range</div><div class=\"k\">짧은 범위는</div></div><div class=\"rc\"><div class=\"e\">decreases the risk of interference.</div><div class=\"k\">간섭의 위험을 줄여 준다.</div></div><div class=\"rnat\">⑤ 만약 많은 물고기가 동시에 신호를 보내면, 짧은 범위는 간섭의 위험을 줄여 준다.</div><div class=\"rst\">운동장에서 다 같이 손뼉 쳐도 가까운 친구 소리만 들리면 안 헷갈리죠. 지문도 짧은 범위가 간섭 위험을 줄인대요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"electric organ\" data-m=\"전기 기관\"><b>electric organ</b>전기 기관</button><button type=\"button\" class=\"wdb\" data-w=\"chunk\" data-m=\"덩어리\"><b>chunk</b>덩어리</button><button type=\"button\" class=\"wdb\" data-w=\"current intensity\" data-m=\"전류 강도\"><b>current intensity</b>전류 강도</button><button type=\"button\" class=\"wdb\" data-w=\"discharge\" data-m=\"방출하다\"><b>discharge</b>방출하다</button><button type=\"button\" class=\"wdb\" data-w=\"contract\" data-m=\"수축하다\"><b>contract</b>수축하다</button><button type=\"button\" class=\"wdb\" data-w=\"interference\" data-m=\"간섭\"><b>interference</b>간섭</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>뒤집는 신호</b>와 <b>마지막 결론 문장</b>을 묶어서 찾으세요. 4번 We now know(이제 우리는 안다)에서 hands-on(직접 해보기)만으로는 위험하다고 뒤집고, 5번·9번에서 <b>minds-on</b>(생각하기)이 빠진 요소라고 닫혀요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 예전 믿음</span><div class=\"en\">For quite some time, science educators believed that <mark>“hands-on” activities were the answer</mark> to children’s understanding …</div><p class=\"ko\">상당한 기간 동안, 과학 교육자들은 '직접 해보는' 활동이 아이들이 이해하게 되는 것에 대한 해답이라고 믿었다 …</p></div><div class=\"ck-via\"><i>▼</i><span>We now know(이제 우리는 안다)로 예전 믿음을 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 · 뒤집는 신호</span><div class=\"en\"><mark>We now know</mark> that “hands-on” is <mark>a dangerous phrase</mark> when speaking about learning science.</div><p class=\"ko\">우리는 이제 과학을 배우는 것에 대해 말할 때 '직접 해보는'이 <mark>위험한 문구라는 것을</mark> <mark>안다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그럼 뭐가 빠졌나? 바로 minds-on(생각하기)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · 핵심어 등장</span><div class=\"en\">The (c) missing ingredient is <mark>the “minds-on” part</mark> of the instructional experience.</div><p class=\"ko\">(c) 누락된 요소는 교육 경험에서 <mark>'사고를 요구하는' 부분이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>직접 해보기도 중요하지만, 배움은 그 경험을 생각해 의미를 붙일 때 나온다고 닫아요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 · 결정적 결론</span><div class=\"en\">While it is important for students to use and interact with materials in science class, <mark>the learning comes from the sense-making</mark> of students’ “hands-on” experiences.</div><p class=\"ko\">학생들이 과학 수업에서 자료를 사용하고 자료와 상호 작용하는 것이 중요하지만, 학습은 학생들의 '직접 해보는' 경험에 대해 <mark>의미를 부여하는 것</mark>으로부터 나온다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">Turn Minds-on Learning On in Science Class 과학 수업에서 ‘생각하기’ 학습을 작동시켜라<small>5번 minds-on(생각하기)과 9번 결론 sense-making(의미 부여하기)을 그대로 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Activity-oriented Learning Enters Science Education 활동 중심 학습이 과학 교육에 들어오다</span><span class=\"why\">[반대] 1·2번의 예전 믿음만 따온 함정이에요. 4번에서 hands-on(직접 해보기)만으로는 위험하다고 뒤집었으니 글의 주장과 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Hands-on Activities as a Source of Creativity 창의력의 원천인 직접 해보는 활동</span><span class=\"why\">[반대] 창의력 이야기는 없고, 오히려 7번처럼 직접 해보기만으로는 배우는 게 거의 없다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Figure Out What Students Like Most in Science Class 과학 수업에서 학생들이 가장 좋아하는 것을 알아내라</span><span class=\"why\">[지문에 없음] 학생이 뭘 좋아하는지 조사하는 내용은 없어요. 글은 5번 minds-on(생각하기)이 빠졌다는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Joy and Learning(즐거움과 학습): More Effective When Separated(분리될 때 더 효과적)</span><span class=\"why\">[지문에 없음] 7번 food fight(음식 싸움)를 즐거움으로 착각한 함정이에요. 즐거움과 학습을 떼어 놓으라는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">For quite some time,</div><div class=\"k\">상당한 기간 동안,</div></div><div class=\"rc\"><div class=\"e\">science educators believed</div><div class=\"k\">과학 교육자들은 믿었다</div></div><div class=\"rc\"><div class=\"e\">that “hands-on” activities</div><div class=\"k\">'직접 해보는' 활동이</div></div><div class=\"rc\"><div class=\"e\">were the answer to</div><div class=\"k\">~에 대한 해답이라고</div></div><div class=\"rc\"><div class=\"e\">children’s understanding</div><div class=\"k\">아이들이 이해하게 되는 것에</div></div><div class=\"rc\"><div class=\"e\">through their participation</div><div class=\"k\">그들의 참여를 통해</div></div><div class=\"rc\"><div class=\"e\">in science-related activities.</div><div class=\"k\">과학 관련 활동에서.</div></div><div class=\"rnat\">상당한 기간 동안, 과학 교육자들은 ‘직접 해보는’ 활동이 과학 관련 활동에서 아이들이 참여를 통해 이해하게 되는 것에 대한 해답이라고 믿었다.</div><div class=\"rst\">오랫동안 선생님들은 과학 시간에 학생이 <b>직접 해보기</b>(hands-on)만 하면 저절로 이해한다고 믿었어요. = 지문 1번의 예전 믿음.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Many teachers believed</div><div class=\"k\">많은 교사들은 믿었다</div></div><div class=\"rc\"><div class=\"e\">that students merely engaging in activities</div><div class=\"k\">단지 활동에 참여하는 학생들이</div></div><div class=\"rc\"><div class=\"e\">and (a) manipulating objects</div><div class=\"k\">그리고 사물을 (a) 조작하는</div></div><div class=\"rc\"><div class=\"e\">would organize the information to be gained</div><div class=\"k\">얻게 될 정보를 체계화할 것이라고</div></div><div class=\"rc\"><div class=\"e\">and the knowledge to be understood</div><div class=\"k\">그리고 이해하게 될 지식을</div></div><div class=\"rc\"><div class=\"e\">into concept comprehension.</div><div class=\"k\">개념 이해로.</div></div><div class=\"rnat\">많은 교사들은 단지 (과학 관련) 활동에 참여하고 사물을 (a) 조작하는 학생들이 (그 활동을 통해) 얻게 될 정보와 이해하게 될 지식을 개념 이해로 체계화할 것이라고 믿었다.</div><div class=\"rst\">실험 도구만 만지작거려도 머릿속에 개념이 정리될 거라 생각했어요. = 지문의 사물을 조작하는(manipulating 조작하는) 학생들.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Educators began to notice</div><div class=\"k\">교육자들은 알아차리기 시작했다</div></div><div class=\"rc\"><div class=\"e\">that the pendulum had swung too far</div><div class=\"k\">추가 너무 많이 기울었다는 것을</div></div><div class=\"rc\"><div class=\"e\">to the “hands-on” component of inquiry</div><div class=\"k\">탐구에서 '직접 해보기' 요소 쪽으로</div></div><div class=\"rc\"><div class=\"e\">as they realized</div><div class=\"k\">그들이 깨달으면서</div></div><div class=\"rc\"><div class=\"e\">that the knowledge was not (b) inherent</div><div class=\"k\">지식이 (b) 내재되어 있는 것이 아니라</div></div><div class=\"rc\"><div class=\"e\">in the materials themselves,</div><div class=\"k\">자료 그 자체에,</div></div><div class=\"rc\"><div class=\"e\">but in the thought and metacognition</div><div class=\"k\">생각과 초인지에 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">about what students had done in the activity.</div><div class=\"k\">학생들이 그 활동에서 한 것에 대한.</div></div><div class=\"rnat\">교육자들은 지식이 (활동) 자료 그 자체에 (b) 내재되어 있는 것이 아니라 학생들이 그 활동에서 한 것에 대한 생각과 초인지에 있다는 것을 깨달으면서, 탐구에서 ‘직접 해보기’ 요소 쪽으로 (과학 교육의) 추가 너무 많이 기울었다는 것을 알아차리기 시작했다.</div><div class=\"rst\">그런데 선생님들은 깨달았어요. 지식은 비커 속이 아니라, 실험한 걸 <b>곰곰이 생각하는 데</b> 있다는 걸요. = 지문 3번.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">We now know</span></div><div class=\"k\"><span class=\"cw\">우리는 이제 안다</span></div></div><div class=\"rc ckc\"><div class=\"e\">that “hands-on” is <span class=\"cw\">a dangerous phrase</span></div><div class=\"k\">'직접 해보는'이 <span class=\"cw\">위험한 문구라는 것을</span></div></div><div class=\"rc\"><div class=\"e\">when speaking about learning science.</div><div class=\"k\">과학을 배우는 것에 대해 말할 때.</div></div><div class=\"rnat\">이제 우리는 과학을 배우는 것에 대해 말할 때 ‘직접 해보는’이 위험한 문구라는 것을 안다.</div><div class=\"rst\"><b>이제 우리는 알아요</b>(We now know). 과학 공부에서 “직접 해보기면 끝!”은 위험한 말이에요. = 지문 4번.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">The (c) missing ingredient</div><div class=\"k\">(c) 누락된 요소는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is the “minds-on” part</span></div><div class=\"k\"><span class=\"cw\">'사고를 요구하는' 부분이다</span></div></div><div class=\"rc\"><div class=\"e\">of the instructional experience.</div><div class=\"k\">교육 경험에서.</div></div><div class=\"rnat\">(c) 누락된 요소는 교육 경험에서 ‘사고를 요구하는’ 부분이다.</div><div class=\"rst\">빠진 재료는 바로 <b>생각하기</b>(minds-on) 부분이에요. = 지문 5번, 실험 뒤에 “왜 그랬지?” 하고 머리를 켜는 거예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">(d) Certainty about the knowledge</div><div class=\"k\">지식에 대한 (d) 확실성은※ 문제지엔 Uncertainty(불확실성)로 되어 있음 — 12번 정답</div></div><div class=\"rc\"><div class=\"e\">intended in any activity</div><div class=\"k\">어떤 활동에서든 의도된</div></div><div class=\"rc\"><div class=\"e\">comes from each student’s re-creation of concepts</div><div class=\"k\">각 학생의 개념 재창조로부터 비롯된다</div></div><div class=\"rc\"><div class=\"e\">— and discussing, thinking, arguing,</div><div class=\"k\">— 그리고 토론하고, 생각하고, 논쟁하고,</div></div><div class=\"rc\"><div class=\"e\">listening, and evaluating</div><div class=\"k\">듣고, 평가하는 것이</div></div><div class=\"rc\"><div class=\"e\">one’s own preconceptions</div><div class=\"k\">자신의 선입견에 대해</div></div><div class=\"rc\"><div class=\"e\">after the activities,</div><div class=\"k\">활동들 이후,</div></div><div class=\"rc\"><div class=\"e\">under the leadership of a thoughtful teacher,</div><div class=\"k\">사려 깊은 교사의 지도하에,</div></div><div class=\"rc\"><div class=\"e\">can bring this about.</div><div class=\"k\">이것(= 지식에 대한 확실성)을 가져올 수 있다.</div></div><div class=\"rnat\">어떤 활동에서든, 의도된 지식에 대한 (d) 확실성은 각 학생의 개념 재창조로부터 비롯된다. 그리고 (과학 관련) 활동들 이후, 사려 깊은 교사의 지도하에 토론하고, 생각하고, 논쟁하고, 듣고, 자신의 선입견에 대해 평가하는 것이 이것(지식에 대한 확실성)을 가져올 수 있다.</div><div class=\"rst\">실험 뒤 선생님과 친구들이 토론하고 내 생각을 점검해야, 지식이 <b>확실해져요</b>(Certainty 확실성). = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">After all,</div><div class=\"k\">결국,</div></div><div class=\"rc\"><div class=\"e\">a food fight is a hands-on activity,</div><div class=\"k\">음식 싸움은 직접 해보는 활동이지만,</div></div><div class=\"rc\"><div class=\"e\">but about all you would learn</div><div class=\"k\">여러분이 배우게 될 거의 전부는</div></div><div class=\"rc\"><div class=\"e\">was something about the aerodynamics</div><div class=\"k\">공기 역학에 관한 것이었다</div></div><div class=\"rc\"><div class=\"e\">of flying mashed potatoes!</div><div class=\"k\">으깬 감자를 날리는!</div></div><div class=\"rnat\">결국, 음식 싸움(음식을 던지며 노는 것)은 직접 해보는 활동이지만, 여러분이 배우게 될 거의 전부는 으깬 감자를 날리는 공기 역학에 관한 것이었다!</div><div class=\"rst\">급식 시간에 감자를 던지며 놀아도 손은 바쁘지만, 배우는 건 감자가 어떻게 날아가는지뿐이에요. = 지문의 음식 싸움.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Our view of what students need</div><div class=\"k\">학생들이 필요로 하는 것에 대한 우리의 견해는</div></div><div class=\"rc\"><div class=\"e\">to build their knowledge and theories</div><div class=\"k\">그들(= 학생들)의 지식과 이론을 구축하기 위해</div></div><div class=\"rc\"><div class=\"e\">about the natural world</div><div class=\"k\">자연 세계에 대한</div></div><div class=\"rc\"><div class=\"e\">(e) extends far beyond</div><div class=\"k\">훨씬 (e) 넘어선다</div></div><div class=\"rc\"><div class=\"e\">a “hands-on activity.”</div><div class=\"k\">'직접 해보는 활동'을.</div></div><div class=\"rnat\">자연 세계에 대한 그들(학생들)의 지식과 이론을 구축하기 위해 학생들이 필요로 하는 것에 대한 우리의 견해는 ‘직접 해보는 활동’을 훨씬 (e) 넘어선다.</div><div class=\"rst\">그래서 학생에게 필요한 건 직접 해보는 활동을 <b>훨씬 넘어서는</b>(far beyond) 거예요. = 지문 8번.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">While it is important for students</div><div class=\"k\">학생들에게 중요하지만</div></div><div class=\"rc\"><div class=\"e\">to use and interact with materials</div><div class=\"k\">자료를 사용하고 자료와 상호 작용하는 것이</div></div><div class=\"rc\"><div class=\"e\">in science class,</div><div class=\"k\">과학 수업에서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the learning comes from</span></div><div class=\"k\"><span class=\"cw\">학습은 ~로부터 나온다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the sense-making</span></div><div class=\"k\"><span class=\"cw\">의미를 부여하는 것</span></div></div><div class=\"rc\"><div class=\"e\">of students’ “hands-on” experiences.</div><div class=\"k\">학생들의 '직접 해보는' 경험에 대해.</div></div><div class=\"rnat\">학생들이 과학 수업에서 자료를 사용하고 자료와 상호 작용하는 것도 중요하지만, 학습은 학생들의 ‘직접 해보는’ 경험에 대해 의미를 부여하는 것으로부터 나온다.</div><div class=\"rst\"><b>결국</b> 배움은 해본 경험에 <b>의미를 붙일 때</b> 나와요. 그래서 제목은 “과학 수업에서 생각하기 학습을 켜라”예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"hands-on\" data-m=\"직접 해 보는\"><b>hands-on</b>직접 해 보는</button><button type=\"button\" class=\"wdb\" data-w=\"manipulate\" data-m=\"조작하다\"><b>manipulate</b>조작하다</button><button type=\"button\" class=\"wdb\" data-w=\"inherent\" data-m=\"내재하는\"><b>inherent</b>내재하는</button><button type=\"button\" class=\"wdb\" data-w=\"metacognition\" data-m=\"초인지\"><b>metacognition</b>초인지</button><button type=\"button\" class=\"wdb\" data-w=\"missing ingredient\" data-m=\"빠져 있는 요소\"><b>missing ingredient</b>빠져 있는 요소</button><button type=\"button\" class=\"wdb\" data-w=\"sense-making\" data-m=\"의미 부여하기\"><b>sense-making</b>의미 부여하기</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">6번 문장 뒤쪽 <b>can bring this about</b>(이것을 가져올 수 있다)이 신호예요. 토론·생각·평가라는 <b>좋은 활동이 가져오는 것</b>이 this(이것)이니, 앞의 (d)는 긍정 방향이어야 해요. 그 방향과 어긋나는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">5번 · 글의 방향</span><div class=\"en\">The (c) <mark>missing ingredient</mark> is the “minds-on” part of the instructional experience.</div><p class=\"ko\">(c) <mark>누락된 요소는</mark> 교육 경험에서 '사고를 요구하는' 부분이다.</p></div><div class=\"ck-via\"><i>▼</i><span>생각하기가 채워지면 지식이 흐려질까, 단단해질까?</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (6번 앞부분)</span><div class=\"en\"><u>(d) Uncertainty</u> about the knowledge intended in any activity comes from each student’s re-creation of concepts …</div><p class=\"ko\">의도된 지식에 대한 ( 불확실성? )은 각 학생의 개념 재창조로부터 비롯된다 → 확실성이 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>this(이것) = (d)의 그것. 토론·생각·평가가 가져오는 건 확실한 이해예요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 뒷부분 · 결정적 단서</span><div class=\"en\">— and discussing, thinking, arguing, listening, and evaluating one’s own preconceptions after the activities, under the leadership of a thoughtful teacher, <mark>can bring this about</mark>.</div><p class=\"ko\">— 그리고 토론하고, 생각하고, 논쟁하고, 듣고, 자신의 선입견에 대해 평가하는 것이 사려 깊은 교사의 지도하에 <mark>이것(= 지식에 대한 확실성)을 가져올 수 있다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>배움은 의미를 붙일 때 나온다 = 생각하면 지식이 확실해진다</span></div><div class=\"ck-step\"><span class=\"lab\">9번 · 결론으로 확인</span><div class=\"en\">… <mark>the learning comes from</mark> the sense-making of students’ “hands-on” experiences.</div><p class=\"ko\">… <mark>학습은</mark> 학생들의 '직접 해보는' 경험에 대해 의미를 부여하는 것<mark>으로부터 나온다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">Certainty(확실성) ↔ Uncertainty(불확실성)</p><p class=\"gr\">토론·생각처럼 좋은 활동이 가져오는 결과는 certainty(확실성)예요. 좋은 원인에서 uncertainty(불확실성)가 나오면 방향이 거꾸로예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>After talking with my friends, I felt certain about the answer.</div><div class=\"ko\">친구들과 이야기하고 나니 답이 확실해졌어요. (토론 → 확실)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>After talking with my friends, I felt uncertain about the answer.</div><div class=\"ko\">실컷 토론했는데 오히려 답이 불확실해졌다? 이 글의 흐름과는 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I only played with the tools, so I am uncertain about the idea.</div><div class=\"ko\">도구만 만지고 놀아서 개념이 불확실해요. (생각 없음 → 불확실)</div></div><p class=\"gb\">지문 6번에서 토론·생각·평가가 can bring this about(이것을 가져올 수 있다)이라 했으니, (d)는 Uncertainty(불확실성)가 아니라 Certainty(확실성)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">(d) Uncertainty → Certainty (확실성)<small>토론·생각·평가가 가져오는 건 불확실성이 아니라 확실한 이해예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) inherent 내재되어 있는</span><span class=\"why\">not A but B(A가 아니라 B) 구조라 헷갈려요. 지식은 자료 자체에 inherent(내재되어 있는) 것이 아니라 생각과 초인지에 있다는 말이라 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) manipulating 조작하는</span><span class=\"why\">2번은 활동에 참여하고 사물을 직접 만지는 hands-on(직접 해보기) 장면이라 manipulating(조작하는)이 딱 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) missing 누락된</span><span class=\"why\">4번에서 hands-on(직접 해보기)만으로는 위험하다고 했으니, minds-on(생각하기)은 빠져 있던 missing(누락된) 요소가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) extends 넘어선다</span><span class=\"why\">7번 음식 싸움처럼 직접 해보기만으론 부족하니, 학생에게 필요한 것은 hands-on activity(직접 해보는 활동)를 far beyond(훨씬 넘어서는) 것이 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">For quite some time,</div><div class=\"k\">상당한 기간 동안,</div></div><div class=\"rc\"><div class=\"e\">science educators believed</div><div class=\"k\">과학 교육자들은 믿었다</div></div><div class=\"rc\"><div class=\"e\">that “hands-on” activities</div><div class=\"k\">'직접 해보는' 활동이</div></div><div class=\"rc\"><div class=\"e\">were the answer to</div><div class=\"k\">~에 대한 해답이라고</div></div><div class=\"rc\"><div class=\"e\">children’s understanding</div><div class=\"k\">아이들이 이해하게 되는 것에</div></div><div class=\"rc\"><div class=\"e\">through their participation</div><div class=\"k\">그들의 참여를 통해</div></div><div class=\"rc\"><div class=\"e\">in science-related activities.</div><div class=\"k\">과학 관련 활동에서.</div></div><div class=\"rnat\">상당한 기간 동안, 과학 교육자들은 ‘직접 해보는’ 활동이 과학 관련 활동에서 아이들이 참여를 통해 이해하게 되는 것에 대한 해답이라고 믿었다.</div><div class=\"rst\">오랫동안 선생님들은 과학 시간에 학생이 <b>직접 해보기</b>(hands-on)만 하면 저절로 이해한다고 믿었어요. = 지문 1번의 예전 믿음.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Many teachers believed</div><div class=\"k\">많은 교사들은 믿었다</div></div><div class=\"rc\"><div class=\"e\">that students merely engaging in activities</div><div class=\"k\">단지 활동에 참여하는 학생들이</div></div><div class=\"rc\"><div class=\"e\">and (a) manipulating objects</div><div class=\"k\">그리고 사물을 (a) 조작하는</div></div><div class=\"rc\"><div class=\"e\">would organize the information to be gained</div><div class=\"k\">얻게 될 정보를 체계화할 것이라고</div></div><div class=\"rc\"><div class=\"e\">and the knowledge to be understood</div><div class=\"k\">그리고 이해하게 될 지식을</div></div><div class=\"rc\"><div class=\"e\">into concept comprehension.</div><div class=\"k\">개념 이해로.</div></div><div class=\"rnat\">많은 교사들은 단지 (과학 관련) 활동에 참여하고 사물을 (a) 조작하는 학생들이 (그 활동을 통해) 얻게 될 정보와 이해하게 될 지식을 개념 이해로 체계화할 것이라고 믿었다.</div><div class=\"rst\">실험 도구를 <b>만지작거리기만</b>(manipulating 조작하는) 해도 머릿속에 개념이 정리될 거라 생각했어요. = 지문 (a).</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Educators began to notice</div><div class=\"k\">교육자들은 알아차리기 시작했다</div></div><div class=\"rc\"><div class=\"e\">that the pendulum had swung too far</div><div class=\"k\">추가 너무 많이 기울었다는 것을</div></div><div class=\"rc\"><div class=\"e\">to the “hands-on” component of inquiry</div><div class=\"k\">탐구에서 '직접 해보기' 요소 쪽으로</div></div><div class=\"rc\"><div class=\"e\">as they realized</div><div class=\"k\">그들이 깨달으면서</div></div><div class=\"rc\"><div class=\"e\">that the knowledge was not (b) inherent</div><div class=\"k\">지식이 (b) 내재되어 있는 것이 아니라</div></div><div class=\"rc\"><div class=\"e\">in the materials themselves,</div><div class=\"k\">자료 그 자체에,</div></div><div class=\"rc\"><div class=\"e\">but in the thought and metacognition</div><div class=\"k\">생각과 초인지에 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">about what students had done in the activity.</div><div class=\"k\">학생들이 그 활동에서 한 것에 대한.</div></div><div class=\"rnat\">교육자들은 지식이 (활동) 자료 그 자체에 (b) 내재되어 있는 것이 아니라 학생들이 그 활동에서 한 것에 대한 생각과 초인지에 있다는 것을 깨달으면서, 탐구에서 ‘직접 해보기’ 요소 쪽으로 (과학 교육의) 추가 너무 많이 기울었다는 것을 알아차리기 시작했다.</div><div class=\"rst\">그런데 지식은 비커 속에 <b>들어 있는</b>(inherent 내재된) 게 아니라, 실험한 걸 곰곰이 생각하는 데 있었어요. = 지문 (b).</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">We now know</div><div class=\"k\">우리는 이제 안다</div></div><div class=\"rc\"><div class=\"e\">that “hands-on” is a dangerous phrase</div><div class=\"k\">'직접 해보는'이 위험한 문구라는 것을</div></div><div class=\"rc\"><div class=\"e\">when speaking about learning science.</div><div class=\"k\">과학을 배우는 것에 대해 말할 때.</div></div><div class=\"rnat\">이제 우리는 과학을 배우는 것에 대해 말할 때 ‘직접 해보는’이 위험한 문구라는 것을 안다.</div><div class=\"rst\"><b>이제 우리는 알아요</b>(We now know). 과학 공부에서 “직접 해보기면 끝!”은 위험한 말이에요. = 지문 4번.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\">The (c) <span class=\"cw\">missing ingredient</span></div><div class=\"k\">(c) <span class=\"cw\">누락된 요소는</span></div></div><div class=\"rc\"><div class=\"e\">is the “minds-on” part</div><div class=\"k\">'사고를 요구하는' 부분이다</div></div><div class=\"rc\"><div class=\"e\">of the instructional experience.</div><div class=\"k\">교육 경험에서.</div></div><div class=\"rnat\">(c) 누락된 요소는 교육 경험에서 ‘사고를 요구하는’ 부분이다.</div><div class=\"rst\"><b>빠진</b>(missing 누락된) 재료는 바로 생각하기(minds-on) 부분이에요. = 지문 (c).</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(d) Certainty</span> about the knowledge</div><div class=\"k\">지식에 대한 (d) <span class=\"cw\">확실성은</span>※ 문제지엔 Uncertainty(불확실성)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">intended in any activity</div><div class=\"k\">어떤 활동에서든 의도된</div></div><div class=\"rc\"><div class=\"e\">comes from each student’s re-creation of concepts</div><div class=\"k\">각 학생의 개념 재창조로부터 비롯된다</div></div><div class=\"rc\"><div class=\"e\">— and discussing, thinking, arguing,</div><div class=\"k\">— 그리고 토론하고, 생각하고, 논쟁하고,</div></div><div class=\"rc\"><div class=\"e\">listening, and evaluating</div><div class=\"k\">듣고, 평가하는 것이</div></div><div class=\"rc\"><div class=\"e\">one’s own preconceptions</div><div class=\"k\">자신의 선입견에 대해</div></div><div class=\"rc\"><div class=\"e\">after the activities,</div><div class=\"k\">활동들 이후,</div></div><div class=\"rc\"><div class=\"e\">under the leadership of a thoughtful teacher,</div><div class=\"k\">사려 깊은 교사의 지도하에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">can bring this about</span>.</div><div class=\"k\"><span class=\"cw\">이것(= 지식에 대한 확실성)을 가져올 수 있다.</span></div></div><div class=\"rnat\">어떤 활동에서든, 의도된 지식에 대한 (d) 불확실성(→ 확실성)은 각 학생의 개념 재창조로부터 비롯된다. 그리고 (과학 관련) 활동들 이후, 사려 깊은 교사의 지도하에 토론하고, 생각하고, 논쟁하고, 듣고, 자신의 선입견에 대해 평가하는 것이 이것(지식에 대한 확실성)을 가져올 수 있다.</div><div class=\"rst\">실험 뒤 토론하고 내 생각을 점검해야 지식이 <b>확실해져요</b>. 그래서 (d) Uncertainty(불확실성)는 Certainty(확실성)로 고쳐야 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">After all,</div><div class=\"k\">결국,</div></div><div class=\"rc\"><div class=\"e\">a food fight is a hands-on activity,</div><div class=\"k\">음식 싸움은 직접 해보는 활동이지만,</div></div><div class=\"rc\"><div class=\"e\">but about all you would learn</div><div class=\"k\">여러분이 배우게 될 거의 전부는</div></div><div class=\"rc\"><div class=\"e\">was something about the aerodynamics</div><div class=\"k\">공기 역학에 관한 것이었다</div></div><div class=\"rc\"><div class=\"e\">of flying mashed potatoes!</div><div class=\"k\">으깬 감자를 날리는!</div></div><div class=\"rnat\">결국, 음식 싸움(음식을 던지며 노는 것)은 직접 해보는 활동이지만, 여러분이 배우게 될 거의 전부는 으깬 감자를 날리는 공기 역학에 관한 것이었다!</div><div class=\"rst\">급식 시간에 감자를 던지며 놀아도 손은 바쁘지만, 배우는 건 감자가 어떻게 날아가는지뿐이에요. = 지문의 음식 싸움.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Our view of what students need</div><div class=\"k\">학생들이 필요로 하는 것에 대한 우리의 견해는</div></div><div class=\"rc\"><div class=\"e\">to build their knowledge and theories</div><div class=\"k\">그들(= 학생들)의 지식과 이론을 구축하기 위해</div></div><div class=\"rc\"><div class=\"e\">about the natural world</div><div class=\"k\">자연 세계에 대한</div></div><div class=\"rc\"><div class=\"e\">(e) extends far beyond</div><div class=\"k\">훨씬 (e) 넘어선다</div></div><div class=\"rc\"><div class=\"e\">a “hands-on activity.”</div><div class=\"k\">'직접 해보는 활동'을.</div></div><div class=\"rnat\">자연 세계에 대한 그들(학생들)의 지식과 이론을 구축하기 위해 학생들이 필요로 하는 것에 대한 우리의 견해는 ‘직접 해보는 활동’을 훨씬 (e) 넘어선다.</div><div class=\"rst\">그래서 학생에게 필요한 건 직접 해보는 활동을 <b>훨씬 넘어서는</b>(extends far beyond) 거예요. = 지문 (e).</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">While it is important for students</div><div class=\"k\">학생들에게 중요하지만</div></div><div class=\"rc\"><div class=\"e\">to use and interact with materials</div><div class=\"k\">자료를 사용하고 자료와 상호 작용하는 것이</div></div><div class=\"rc\"><div class=\"e\">in science class,</div><div class=\"k\">과학 수업에서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the learning comes from</span></div><div class=\"k\"><span class=\"cw\">학습은 ~로부터 나온다</span></div></div><div class=\"rc\"><div class=\"e\">the sense-making</div><div class=\"k\">의미를 부여하는 것</div></div><div class=\"rc\"><div class=\"e\">of students’ “hands-on” experiences.</div><div class=\"k\">학생들의 '직접 해보는' 경험에 대해.</div></div><div class=\"rnat\">학생들이 과학 수업에서 자료를 사용하고 자료와 상호 작용하는 것도 중요하지만, 학습은 학생들의 ‘직접 해보는’ 경험에 대해 의미를 부여하는 것으로부터 나온다.</div><div class=\"rst\"><b>결국</b> 배움은 해본 경험에 <b>의미를 붙일 때</b> 나와요. = 지문 9번, 생각하기가 지식을 확실하게 만든다는 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"certainty\" data-m=\"확실성\"><b>certainty</b>확실성</button><button type=\"button\" class=\"wdb\" data-w=\"re-creation\" data-m=\"재창조, 재구성\"><b>re-creation</b>재창조, 재구성</button><button type=\"button\" class=\"wdb\" data-w=\"evaluate\" data-m=\"평가하다\"><b>evaluate</b>평가하다</button><button type=\"button\" class=\"wdb\" data-w=\"preconception\" data-m=\"선입견\"><b>preconception</b>선입견</button><button type=\"button\" class=\"wdb\" data-w=\"bring about\" data-m=\"가져오다, 일으키다\"><b>bring about</b>가져오다, 일으키다</button><button type=\"button\" class=\"wdb\" data-w=\"far beyond\" data-m=\"훨씬 뛰어넘어\"><b>far beyond</b>훨씬 뛰어넘어</button></div>"};

function renderExp(){

  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
