<title>고2 미니모의고사 13회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}
.ch.open .ct{display:block}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

.wc{padding:14px 0;border-bottom:1px solid var(--line)}

식이다.", "Nuer족은 또한 가족 중 나이 많은 구성원만 세는 문화를 가지고 있다.", "그들은 가진 자녀의 수를 세는 것이 불행을 가져올 수 있다고 믿고, 실제 가진 것보다 더 적은 수의 자녀를 알리는 것을 선호한다."], "ps": [{"n": 1, "ch": [{"e": "The Nuer are one of the largest ethnic groups", "k": "Nuer족은 가장 큰 <b>민족 집단<\/b> 중 하나이며"}, {"e": "in South Sudan,", "k": "남수단에서,"}, {"e": "primarily residing in the Nile River Valley.", "k": "주로 Nile River Valley에 <b>거주한다<\/b>."}], "easy": "Nuer족은 남수단에서 가장 큰 민족 집단 중 하나이고, 주로 나일강 유역에 산다는 뜻이에요.", "gist": "Nuer족이 어떤 민족인지 소개하는 첫 문장이에요. ①번 선지의 근거예요."}, {"n": 2, "ch": [{"e": "The Nuer are a cattle-raising people,", "k": "Nuer족은 <b>소를 기르는<\/b> 민족이며,"}, {"e": "whose everyday lives revolve around their cattle.", "k": "그들<span class=\"r\">(= Nuer족)<\/span>의 일상생활은 소를 <b>중심으로 돈다<\/b>."}], "easy": "Nuer족은 소를 키우는 사람들이고, 생활이 소를 중심으로 돌아간다는 뜻이에요.", "gist": "소가 Nuer족 삶의 중심이라는 설명이에요."}, {"n": 3, "ch": [{"e": "They have various terms related to cattle,", "k": "그들<span class=\"r\">(= Nuer족)<\/span>은 소와 <b>관련된<\/b> 다양한 용어를 가지고 있어서,"}, {"e": "so they can distinguish between hundreds of types of cows,", "k": "(그들은) 수백 종의 소를 <b>구별할 수 있다<\/b>,"}, {"e": "based on color, markings, and shape of horns.", "k": "색깔, 무늬, 뿔의 모양에 <b>따라<\/b>."}], "easy": "소를 가리키는 말이 아주 많아서, 색·무늬·뿔 모양으로 수백 종류의 소를 구별한다는 뜻이에요.", "gist": "소 이야기를 더 자세히 풀어요. ②번 선지의 근거예요."}, {"n": 4, "ch": [{"e": "They prefer to be called", "k": "그들<span class=\"r\">(= Nuer족)<\/span>은 불리는 것을 <b>선호한다<\/b>"}, {"e": "by the names of the cattle they raise.", "k": "그들이 기르는 소의 이름으로."}], "easy": "자기가 키우는 소의 이름으로 불리는 것을 좋아한다는 뜻이에요.", "gist": "소와 사람의 관계를 보여 주는 내용이에요. ③번 선지의 근거예요."}, {"n": 5, "ch": [{"e": "The commonest daily foods for the Nuer are dairy products,", "k": "Nuer족의 가장 흔한 일상 음식은 <b>유제품<\/b>이며,"}, {"e": "especially milk for the young", "k": "특히 어린아이들을 위한 우유"}, {"e": "and soured milk, like yogurt, for adults.", "k": "그리고 어른들을 위한, 요구르트 같은 <b>시큼한 우유<\/b>이다."}], "easy": "가장 흔한 매일의 음식은 유제품이고, 특히 어린이에게는 우유, 어른에게는 요구르트 같은 시큼한 우유라는 뜻이에요.", "gist": "Nuer족의 대표 음식을 말해요. ④번 선지의 근거예요."}, {"n": 6, " alse, "e": ["비전문가들 사이에 퍼진 미심쩍은 사실은 글에서 다루는 내용이 아닙니다", "밑줄 친 부분은 전문가가 제공하는 정보를 뜻합니다."]}, {"n": "②", "t": "readily applicable information offered by specialized experts", "g": "특화된 전문가들이 제공한 손쉽게 적용할 수 있는 정보를", "ok": true, "e": ["8번의 밑줄은 전문가를 신뢰하지 않을 때 알지 못하게 되는 것입니다", "그것은 <b>전문가가 제공하는 손쉽게 적용할 수 있는 정보<\/b>입니다."]}, {"n": "③", "t": "common knowledge that hardly influences crucial decisions", "g": "중대한 결정에 거의 영향을 주지 않는 일반적인 지식을", "ok": false, "e": ["중대한 결정에 영향을 주지 않는 일반 지식이 아닙니다", "8번의 밑줄은 전문가가 제공하는 정보를 뜻합니다."]}, {"n": "④", "t": "practical information produced by both specialists and lay people", "g": "전문가들과 전문가가 아닌 사람들 양쪽에 의해 생산된 실용적인 정보를", "ok": false, "e": ["3·4번에서 비전문가에게 배우는 경우도 있다고 해서 고르기 쉽습니다", "하지만 8번은 지정된 <b>전문가<\/b>를 신뢰하지 않을 때 알지 못하게 되는 정보를 말하므로, 비전문가가 만든 정보라는 맥락은 정답이 될 수 없습니다."]}, {"n": "⑤", "t": "biased knowledge that is widespread in the local community", "g": "지역 공동체에 널리 퍼진 편향된 지식을", "ok": false, "e": ["지역 공동체에 퍼진 편향된 지식이 아닙니다", "8번의 밑줄은 지정된 전문가가 제공하는 정보를 뜻합니다."]}], "tr": ["과학자들은 도덕적이거나 윤리적인 결정에 대한 특별한 강점(결정을 좌지우지할 능력)이 없고, 물리학자가 꿀벌 군집이 붕괴하는 원인을 판단할 자격이 없는 것처럼 기후 과학자는 의료 개혁에 대해 논할 자격이 없다.", "특화된 분야에서 전문 지식을 기르는 바로 그 특징은 다른 많은 분야에서의 무지로 연결된다.", "경우에 따라서는 농부, 어부, 환자, 토착민과 같은 전문가가 아닌 사람들이 과학자들이 배울 수 있는, 관련 있는 경험을 가지고 있을 수도 있다.", "실제로, 최근 몇 년 동안 과학자들은 이러한 점을 알아차리기 시작했는데, 예를 들어 북극 기후 영향 평가는 현지의 토착 집단에게서 수집한 관측 내용을 포함한다.", "그러므로 우리의 (전문가들에 대한) 신뢰는 제한되고 집중될 필요가 있다.", "이것은 아주 '특정한' 것이어야 한다.", "맹목적인 신뢰는 우리를 최소한 신뢰가 아예 없는 것만큼 곤경에 빠뜨릴 것이다.", "그러나 우리의 지명된 전문가들, 즉 우리가 살고 있는 자연 세계에 대한 어려운 문제를 해결하는 데 삶을 바친 사람들에 대한 일정 수준의 신뢰 없이는, 우리는 사실상 아침 통근을 준비해야 할지 말지를(특화된 전문가들이 제공하는 손쉽게 적용할 수 있는 정보를) 알지 못하고 마비될 것이다."], "ps": [{"n": 1, "ch": [{"e": "Scientists have no special purchase", "k": "과학자들은 특별한 <b>강점<\/b>이 없다"}, {"e": "on moral or ethical decisions;", "k": "도덕적이거나 윤리적인 결정에 대한;"}, {"e": "a climate scientist is no more qualified", "k": "기후 과학자는 더 <b>자격이 있는 것이 아니다<\/b>"}, {"e": "to comment on health care reform", "k": "의료 개혁에 대해 논평할"}, {"e": "than a physicist is", "k": "물리학자가 (자격이 function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}

function buildQuestions(){

"rc\"><div class=\"e\">The image shows Buchaechum,</div><div class=\"k\">그 이미지는 부채춤을 보여줍니다,</div></div><div class=\"rc\"><div class=\"e\">a traditional Korean fan dance.</div><div class=\"k\">전통적인 한국의 부채 무용인.</div></div><div class=\"rnat\">그 이미지는 전통적인 한국의 부채 무용인 부채춤을 보여줍니다.</div><div class=\"rst\">\"그 그림은 우리 부채춤이에요.\" 지문도 이미지가 전통 한국 부채춤(Buchaechum)을 보여 준다고 짚어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It is clear</div><div class=\"k\">분명합니다</div></div><div class=\"rc\"><div class=\"e\">that in the image the dancers are wearing traditional Korean dress.</div><div class=\"k\">그 이미지에서 무용수들이 전통적인 한국 의상을 입고 있는 것이.</div></div><div class=\"rnat\">그 이미지에서 무용수들이 전통적인 한국 의상을 입고 있는 것이 분명합니다.</div><div class=\"rst\">\"옷만 봐도 딱 한복이에요.\" 지문도 무용수들이 한국 전통 의상을 입은 게 분명하다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">I searched online</div><div class=\"k\">저는 온라인으로 검색했고</div></div><div class=\"rc\"><div class=\"e\">for images of an Indian fan dance,</div><div class=\"k\">인도 부채 무용의 이미지를,</div></div><div class=\"rc\"><div class=\"e\">and, of course, it looks very different</div><div class=\"k\">물론 그것은 매우 다르게 보입니다</div></div><div class=\"rc\"><div class=\"e\">from a Korean one.</div><div class=\"k\">한국의 것(= 춤)과는.</div></div><div class=\"rnat\">저는 온라인으로 인도 부채 무용의 이미지를 검색했고, 물론 그것은 한국의 춤과는 매우 다르게 보입니다.</div><div class=\"rst\">인터넷으로 진짜 인도 춤 사진을 찾아보니 완전 달라요. 지문도 인도 부채 무용은 한국 것과 매우 다르다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">I know</div><div class=\"k\">저는 압니다</div></div><div class=\"rc\"><div class=\"e\">your company is putting a lot of effort</div><div class=\"k\">귀사가 많은 노력을 하고 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">into presenting authentic flavors,</div><div class=\"k\">진정한 맛을 제공하는 데,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but I'm afraid</span></div><div class=\"k\"><span class=\"cw\">하지만 걱정됩니다</span></div></div><div class=\"rc\"><div class=\"e\">that this one small mistake</div><div class=\"k\">이 하나의 작은 실수가</div></div><div class=\"rc\"><div class=\"e\">could damage your company's reputation.</div><div class=\"k\">귀사의 평판에 손상을 줄 수 있을까 봐.</div></div><div class=\"rnat\">저는 귀사가 진정한 맛을 제공하는 데 많은 노력을 하고 있다는 것을 알지만, 이 하나의 작은 실수가 귀사의 평판에 손상을 주는 게 아닌지 걱정됩니다.</div><div class=\"rst\">\"맛을 위해 애쓰시는 건 알아요. <b>하지만</b>(but) 이 작은 실수로 회사 이미지가 나빠질까 걱정돼요.\" 지문도 평판(reputation)을 걱정해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">I sincerely hope</div><div class=\"k\">저는 진심으로 바랍니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that you correct this</span></div><div class=\"k\"><span class=\"cw\">귀사가 이것(= 이 작은 실수)을 바로잡기를</span></div></div><div class=\"rc\"><div class=\"e\">as soon as possible.</div><div class=\"k\">가능한 한 빨리.</div></div><div class=\"rnat\">저는 귀사가 이것을 가능한 한 빨리 바로잡기를 진심으로 바랍니다.</div><div class=\"rst\">\"그러니 그림을 빨리 바꿔 주세요!\" 지문의 <b>바로잡기를 바란다</b>(hope that you correct this)가 바로 편지의 목적이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Sincerely,</div><div class=\"k\">진심을 담아,</div></div><div class=\"rc\"><div class=\"e\">Susan Lee</div><div class=\"k\">Susan Lee (드림)</div></div><div class=\"rnat\">진심을 담아, Susan Lee (드림)</div><div class=\"rst\">메일 끝에 내 이름을 쓰듯, 지문도 보낸 사람 수전 리(Susan Lee)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"concerning\" data-m=\"~에 관하여\"><b>concerning</b>~에 관하여</button><button type=\"button\" class=\"wdb\" data-w=\"authentic\" data-m=\"진정한, 진짜의\"><b>authentic</b>진정한, 진짜의</button><button type=\"button\" class=\"wdb\" data-w=\"flavor\" data-m=\"맛\"><b>flavor</b>맛</button><button type=\"button\" class=\"wdb\" data-w=\"reputation\" data-m=\"평판\"><b>reputation</b>평판</button><button type=\"button\" class=\"wdb\" data-w=\"correct\" data-m=\"바로잡다\"><b>correct</b>바로잡다</button><button type=\"button\" class=\"wdb\" data-w=\"as soon as possible\" data-m=\"가능한 한 빨리\"><b>as soon as possible</b>가능한 한 빨리</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 선택지의 <b>‘행운’</b>처럼 뜻을 정반대로 바꾼 단어가 지문의 <b>misfortune(불행)</b>과 부딪히는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 1번</em>primarily residing in the Nile River Valley(주로 나일강 유역에 거주한다) → 같음</span><span><em>② ↔ 3번</em>various terms related to cattle(소와 관련된 다양한 용어) → 같음</span><span><em>③ ↔ 4번</em>called by the names of the cattle(소의 이름으로 불리기) 선호 → 같음</span><span><em>④ ↔ 5번</em>commonest daily foods(가장 흔한 일상 음식) = dairy products(유제품) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ⑤를 8번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>⑤의 ‘자녀 수 세기’를 8번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">They believe that counting the number of children one has could result in <mark>misfortune</mark> …</div><p class=\"ko\">그들은 자신이 가진 자녀의 수를 세는 것이 <mark>불행을 야기할 수 있다고</mark> 믿는다 …</p></div><div class=\"ck-via\"><i>▼</i><span>불행이 올까 봐 오히려 자녀 수를 줄여서 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 뒷부분 · 확인</span><div class=\"en\">… and prefer to report <mark>fewer children</mark> than they have.</div><p class=\"ko\">… 그리고 실제로 가진 것보다 <mark>더 적은 수의 자녀를</mark> 알리는 것을 선호한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">어린 자녀의 수를 세는 것이 행운을 가져온다고 믿는다.<small>8번: 행운이 아니라 misfortune(불행)을 가져온다고 믿어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">자신들이 기르는 소의 이름으로 불리는 것을 선호한다.</span><span class=\"why\">사람이 소 이름으로 불린다니 이상해서 틀린 줄 알기 쉽지만, 4번 prefer to be called by the names of the cattle(소의 이름으로 불리는 것을 선호한다)와 그대로 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">주로 Nile River Valley에 거주한다.</span><span class=\"why\">1번 primarily residing in the Nile River Valley(주로 나일강 유역에 거주한다)와 같아요. primarily(주로)까지 그대로예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">소와 관련된 다양한 용어를 가지고 있다.</span><span class=\"why\">3번 They have various terms related to cattle(그들은 소와 관련된 다양한 용어를 가지고 있다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">가장 일반적인 일상 음식은 유제품이다.</span><span class=\"why\">5번 The commonest daily foods(가장 흔한 일상 음식) … are dairy products(유제품이다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The Nuer are one of the largest ethnic groups</div><div class=\"k\">Nuer족은 가장 큰 민족 집단 중 하나이며</div></div><div class=\"rc\"><div class=\"e\">in South Sudan,</div><div class=\"k\">남수단에서,</div></div><div class=\"rc\"><div class=\"e\">primarily residing in the Nile River Valley.</div><div class=\"k\">주로 Nile River Valley에 거주한다.</div></div><div class=\"rnat\">Nuer족은 남수단에서 가장 큰 민족 집단 중 하나이며, 주로 나일강 유역에 거주한다.</div><div class=\"rst\">새 친구 소개 카드를 읽는다고 생각해 봐요. 첫 줄은 \"어디 살아요?\" 지문도 누에르(Nuer)족이 남수단 <b>나일강 유역</b>(Nile River Valley)에 주로 산다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The Nuer are a cattle-raising people,</div><div class=\"k\">Nuer족은 소를 기르는 민족이며,</div></div><div class=\"rc\"><div class=\"e\">whose everyday lives revolve around their cattle.</div><div class=\"k\">그들(= Nuer족)의 일상생활은 소를 중심으로 돈다.</div></div><div class=\"rnat\">Nuer족은 소를 기르는 민족이며, 그들의 일상생활은 소를 중심으로 돌아간다.</div><div class=\"rst\">이 친구네는 하루 종일 소 생각뿐이에요. 지문도 누에르(Nuer)족의 일상이 <b>소를 중심으로 돈다</b>(revolve around)고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">They have various terms related to cattle,</div><div class=\"k\">그들(= Nuer족)은 소와 관련된 다양한 용어를 가지고 있어서,</div></div><div class=\"rc\"><div class=\"e\">so they can distinguish between hundreds of types of cows,</div><div class=\"k\">(그들은) 수백 종의 소를 구별할 수 있다,</div></div><div class=\"rc\"><div class=\"e\">based on color, markings, and shape of horns.</div><div class=\"k\">색깔, 무늬, 뿔의 모양에 따라.</div></div><div class=\"rnat\">그들은 소와 관련된 다양한 용어를 가지고 있어서, 색깔, 무늬, 뿔의 모양에 근거하여 수백 종류의 소를 구별할 수 있다.</div><div class=\"rst\">그래서 소 이름만 수백 개를 알아요. 지문도 소 관련 <b>용어</b>(terms)가 많아 색·무늬·뿔로 소를 구별한다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">They prefer to be called</div><div class=\"k\">그들(= Nuer족)은 불리는 것을 선호한다</div></div><div class=\"rc\"><div class=\"e\">by the names of the cattle they raise.</div><div class=\"k\">그들이 기르는 소의 이름으로.</div></div><div class=\"rnat\">그들은 자신이 기르는 소의 이름으로 불리는 것을 선호한다.</div><div class=\"rst\">별명도 자기네 소 이름으로 불러 달래요. 지문도 누에르(Nuer)족은 <b>기르는 소의 이름으로 불리기</b>를 좋아한다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The commonest daily foods for the Nuer are dairy products,</div><div class=\"k\">Nuer족의 가장 흔한 일상 음식은 유제품이며,</div></div><div class=\"rc\"><div class=\"e\">especially milk for the young</div><div class=\"k\">특히 어린아이들을 위한 우유</div></div><div class=\"rc\"><div class=\"e\">and soured milk, like yogurt, for adults.</div><div class=\"k\">그리고 어른들을 위한, 요구르트 같은 시큼한 우유이다.</div></div><div class=\"rnat\">Nuer족의 가장 흔한 일상 음식은 유제품인데, 특히 어린이를 위한 우유와 성인을 위한 요구르트 같은 시큼한 우유이다.</div><div class=\"rst\">급식 메뉴는 늘 우유와 요구르트! 지문도 가장 흔한 음식이 <b>유제품</b>(dairy products)이라고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">And wild fruits and nuts</div><div class=\"k\">그리고 야생 과일과 견과류는</div></div><div class=\"rc\"><div class=\"e\">are favorite snacks for the Nuer.</div><div class=\"k\">Nuer족이 좋아하는 간식이다.</div></div><div class=\"rnat\">그리고 야생 과일과 견과류는 Nuer족이 좋아하는 간식이다.</div><div class=\"rst\">간식으로는 과일과 견과류를 먹어요. 지문도 야생 과일과 견과류(nuts)가 좋아하는 간식이라고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The Nuer also have a culture</div><div class=\"k\">Nuer족은 또한 문화를 가지고 있다</div></div><div class=\"rc ckc\"><div class=\"e\">of counting <span class=\"cw\">only older members</span> of the family.</div><div class=\"k\">가족 중 <span class=\"cw\">나이 많은 구성원들만</span> 세는.</div></div><div class=\"rnat\">Nuer족은 또한 가족 중 나이 많은 구성원만 세는 문화를 가지고 있다.</div><div class=\"rst\">가족 수를 셀 땐 어른만 세요. 지문도 누에르(Nuer)족은 가족 중 <b>나이 많은 구성원만</b> 센다고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">They believe</div><div class=\"k\">그들(= Nuer족)은 믿는다</div></div><div class=\"rc\"><div class=\"e\">that counting the number of children one has</div><div class=\"k\">자신이 가진 자녀의 수를 세는 것이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">could result in misfortune</span></div><div class=\"k\"><span class=\"cw\">불행을 야기할 수 있다고</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">and prefer to report <span class=\"cw\">fewer children</span> than they have.</div><div class=\"k\">그리고 실제로 가진 것보다 <span class=\"cw\">더 적은 수의 자녀를</span> 알리는 것을 선호한다.</div></div><div class=\"rnat\">그들은 가진 자녀의 수를 세는 것이 불행을 가져올 수 있다고 믿고, 실제 가진 것보다 더 적은 수의 자녀를 알리는 것을 선호한다.</div><div class=\"rst\">아이 수를 세면 <b>불행</b>(misfortune)이 온다고 믿어서 일부러 적게 말해요. ⑤의 ‘행운’은 지문과 정반대예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"ethnic group\" data-m=\"민족 집단\"><b>ethnic group</b>민족 집단</button><button type=\"button\" class=\"wdb\" data-w=\"revolve around\" data-m=\"~을 중심으로 돌아가다\"><b>revolve around</b>~을 중심으로 돌아가다</button><button type=\"button\" class=\"wdb\" data-w=\"distinguish between\" data-m=\"~을 구별하다\"><b>distinguish between</b>~을 구별하다</button><button type=\"button\" class=\"wdb\" data-w=\"dairy product\" data-m=\"유제품\"><b>dairy product</b>유제품</button><button type=\"button\" class=\"wdb\" data-w=\"misfortune\" data-m=\"불행\"><b>misfortune</b>불행</button><button type=\"button\" class=\"wdb\" data-w=\"report\" data-m=\"알리다, 보고하다\"><b>report</b>알리다, 보고하다</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>예시를 통한 비유</b>예요. ‘아침 출근 준비를 할지 말지’를 아는 데 필요한 건 <b>전문가(experts)가 주는 바로 쓸 수 있는 정보</b>(일기예보 같은 것)라는 걸 같은 8번 문장 앞부분에서 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (8번 끝)</span><div class=\"en\">… we are paralyzed, in effect not knowing <mark>whether to make ready for the morning commute or not</mark>.</div><p class=\"ko\">… 우리는 <mark>아침 통근을 준비해야 할지 말지를</mark> 사실상 알지 못한 채 마비된다.</p></div><div class=\"ck-via\"><i>▼</i><span>무엇이 없을 때 마비되는지, 같은 문장 앞에 조건이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 앞부분 · 결정적 단서</span><div class=\"en\">But without some degree of trust in <mark>our designated experts</mark> — the men and women who have devoted their lives to sorting out tough questions about the natural world …</div><p class=\"ko\">그러나 자연 세계에 대한 어려운 문제들을 해결하는 데 삶을 바친 사람들, 즉 <mark>우리의 지명된 전문가들에 대한</mark> 일정 수준의 신뢰 없이는 …</p></div><div class=\"ck-via\"><i>▼</i><span>아무나 믿는 게 아니라, 딱 그 분야 전문가만 믿어야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 신뢰의 방향</span><div class=\"en\">It needs to be <mark>very particular</mark>.</div><p class=\"ko\">그것(= 우리의 신뢰)은 <mark>아주 '특정한' 것이어야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>the morning commute</em>아침 출근길 = 매일 겪는 일상</span><span><em>준비할지 말지</em>우산을 챙길지, 일찍 나갈지 = 날씨·도로 정보로 정함</span><span><em>without trust</em>전문가 말을 안 믿으면 그 정보를 못 씀</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 전문가가 주는, 바로 생활에 써먹을 수 있는 정보(가 없는 상태) → ②</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">readily applicable information offered by specialized experts 전문 분야의 전문가가 제공하는 손쉽게 적용할 수 있는 정보<small>8번의 designated experts(지명된 전문가들)를 믿어야 출근 준비 같은 일상 판단을 할 수 있어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">practical information produced by both specialists and lay people 전문가와 비전문가 모두가 만든 실용적인 정보</span><span class=\"why\">3·4번에 lay people(비전문가)의 경험 이야기가 나와서 끌리지만, 8번 밑줄 앞 조건은 오직 designated experts(지명된 전문가들)에 대한 신뢰예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">questionable facts that have been popularized by non-experts 비전문가들이 대중화한 의심스러운 사실</span><span class=\"why\">8번은 전문가를 믿어야 한다는 말이라, 비전문가의 의심스러운 사실과는 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">common knowledge that hardly influences crucial decisions 중요한 결정에 거의 영향을 주지 않는 상식</span><span class=\"why\">8번에서 그 정보가 없으면 paralyzed(마비된다)고 했으니, 결정에 영향이 거의 없다는 말과 어긋나요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">biased knowledge that is widespread in the local community 지역 사회에 퍼진 편향된 지식</span><span class=\"why\">4번의 local native groups(현지 토착 집단)는 관측 자료의 예일 뿐이에요. 편향된 지식을 믿으라는 말은 지문에 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Scientists have no special purchase</div><div class=\"k\">과학자들은 특별한 강점이 없다</div></div><div class=\"rc\"><div class=\"e\">on moral or ethical decisions;</div><div class=\"k\">도덕적이거나 윤리적인 결정에 대한;</div></div><div class=\"rc\"><div class=\"e\">a climate scientist is no more qualified</div><div class=\"k\">기후 과학자는 더 자격이 있는 것이 아니다</div></div><div class=\"rc\"><div class=\"e\">to comment on health care reform</div><div class=\"k\">의료 개혁에 대해 논평할</div></div><div class=\"rc\"><div class=\"e\">than a physicist is</div><div class=\"k\">물리학자가 (자격이 있는 것)보다</div></div><div class=\"rc\"><div class=\"e\">to judge the causes of bee colony collapse.</div><div class=\"k\">꿀벌 군집 붕괴의 원인을 판단할 (자격이 있는 것).</div></div><div class=\"rnat\">과학자들은 도덕적이거나 윤리적인 결정에 대한 특별한 강점(결정을 좌지우지할 능력)이 없고, 물리학자가 꿀벌 군집이 붕괴하는 원인을 판단할 자격이 없는 것처럼 기후 과학자는 의료 개혁에 대해 논할 자격이 없다.</div><div class=\"rst\">학교 준비물을 생각해 봐요. 수학쌤이 체육복 고르는 법까지 잘 아는 건 아니죠. 지문도 과학자도 <b>자기 분야 밖</b>에선 특별한 강점이 없다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The very features</div><div class=\"k\">바로 그 특징들은</div></div><div class=\"rc\"><div class=\"e\">that create expertise in a specialized domain</div><div class=\"k\">특화된 분야에서 전문 지식을 만들어 내는</div></div><div class=\"rc\"><div class=\"e\">lead to ignorance in many others.</div><div class=\"k\">다른 많은 분야에서는 무지로 이어진다.</div></div><div class=\"rnat\">특화된 분야에서 전문 지식을 기르는 바로 그 특징은 다른 많은 분야에서의 무지로 연결된다.</div><div class=\"rst\">수학을 잘하게 만든 공부 습관이 미술에선 도움이 안 될 수도 있어요. 지문도 한 분야의 <b>전문 지식</b>(expertise)이 다른 분야에선 무지로 이어진다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In some cases</div><div class=\"k\">어떤 경우에는</div></div><div class=\"rc\"><div class=\"e\">lay people — farmers, fishermen, patients, native peoples —</div><div class=\"k\">전문가가 아닌 사람들 — 농부, 어부, 환자, 토착민 —이</div></div><div class=\"rc\"><div class=\"e\">may have relevant experiences</div><div class=\"k\">관련 있는 경험을 가지고 있을 수도 있다</div></div><div class=\"rc\"><div class=\"e\">that scientists can learn from.</div><div class=\"k\">그것(= 관련 있는 경험)으로부터 과학자들이 배울 수 있는.</div></div><div class=\"rnat\">경우에 따라서는 농부, 어부, 환자, 토착민과 같은 전문가가 아닌 사람들이 과학자들이 배울 수 있는, 관련 있는 경험을 가지고 있을 수도 있다.</div><div class=\"rst\">급식실 조리사님이 오히려 음식 상식을 더 잘 알 때가 있어요. 지문도 농부·어부 같은 <b>비전문가</b>(lay people)의 경험에서 과학자가 배울 수 있다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Indeed,</div><div class=\"k\">실제로,</div></div><div class=\"rc\"><div class=\"e\">in recent years,</div><div class=\"k\">최근 몇 년 동안</div></div><div class=\"rc\"><div class=\"e\">scientists have begun to recognize this:</div><div class=\"k\">과학자들은 이것(= 앞 문장의 내용)을 알아차리기 시작했다:</div></div><div class=\"rc\"><div class=\"e\">the Arctic Climate Impact Assessment includes observations</div><div class=\"k\">북극 기후 영향 평가는 관측 내용을 포함한다</div></div><div class=\"rc\"><div class=\"e\">gathered from local native groups.</div><div class=\"k\">현지 토착 집단에게서 수집한.</div></div><div class=\"rnat\">실제로, 최근 몇 년 동안 과학자들은 이러한 점을 알아차리기 시작했는데, 예를 들어 북극 기후 영향 평가는 현지의 토착 집단에게서 수집한 관측 내용을 포함한다.</div><div class=\"rst\">실제로 과학자들도 이 점을 알아요. 지문도 북극 기후 평가에 현지 토착민의 관찰을 넣었다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">So our trust needs to be limited,</div><div class=\"k\">그러므로 우리의 신뢰는 제한될 필요가 있고,</div></div><div class=\"rc\"><div class=\"e\">and focused.</div><div class=\"k\">집중될 필요가 있다.</div></div><div class=\"rnat\">그러므로 우리의 (전문가들에 대한) 신뢰는 제한되고 집중될 필요가 있다.</div><div class=\"rst\">그러니 아무 말이나 다 믿으면 안 돼요. 지문도 우리의 신뢰는 <b>제한되고 집중되어야</b> 한다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">It needs to be very particular.</span></div><div class=\"k\"><span class=\"cw\">그것(= 우리의 신뢰)은 아주 '특정한' 것이어야 한다.</span></div></div><div class=\"rnat\">이것은 아주 '특정한' 것이어야 한다.</div><div class=\"rst\">날씨는 기상청, 시간표는 담임쌤처럼 딱 맞는 사람을 믿어요. 지문도 신뢰는 <b>아주 특정해야</b>(very particular) 한다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Blind trust will get us into at least as much trouble</div><div class=\"k\">맹목적인 신뢰는 우리를 최소한 같은 정도의 곤경에 빠뜨릴 것이다</div></div><div class=\"rc\"><div class=\"e\">as no trust at all.</div><div class=\"k\">신뢰가 아예 없는 것만큼.</div></div><div class=\"rnat\">맹목적인 신뢰는 우리를 최소한 신뢰가 아예 없는 것만큼 곤경에 빠뜨릴 것이다.</div><div class=\"rst\">아무나 다 믿는 건 아무도 안 믿는 것만큼 위험해요. 지문도 <b>맹목적인 신뢰</b>(blind trust)가 큰 곤경을 부른다고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">But without some degree of trust</div><div class=\"k\">그러나 일정 수준의 신뢰 없이는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in our designated experts —</span></div><div class=\"k\"><span class=\"cw\">우리의 지명된 전문가들에 대한 —</span></div></div><div class=\"rc\"><div class=\"e\">the men and women</div><div class=\"k\">사람들, 즉</div></div><div class=\"rc\"><div class=\"e\">who have devoted their lives</div><div class=\"k\">삶을 바친 (사람들)</div></div><div class=\"rc\"><div class=\"e\">to sorting out tough questions</div><div class=\"k\">어려운 문제들을 해결하는 데</div></div><div class=\"rc\"><div class=\"e\">about the natural world we live in —</div><div class=\"k\">우리가 살고 있는 자연 세계에 대한 —</div></div><div class=\"rc\"><div class=\"e\">we are paralyzed,</div><div class=\"k\">우리는 마비된다,</div></div><div class=\"rc\"><div class=\"e\">in effect not knowing</div><div class=\"k\">사실상 알지 못하고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">whether to make ready for the morning commute or not.</span></div><div class=\"k\"><span class=\"cw\">아침 통근을 준비해야 할지 말지를.</span></div></div><div class=\"rnat\">그러나 우리의 지명된 전문가들, 즉 우리가 살고 있는 자연 세계에 대한 어려운 문제를 해결하는 데 삶을 바친 사람들에 대한 일정 수준의 신뢰 없이는, 우리는 사실상 아침 통근을 준비해야 할지 말지를(특화된 전문가들이 제공하는 손쉽게 적용할 수 있는 정보를) 알지 못하고 마비될 것이다.</div><div class=\"rst\">그래도 일기예보를 하나도 안 믿으면 우산을 챙길지조차 못 정해요. 이게 밑줄의 뜻, <b>전문가의 바로 쓸 정보</b> 없이 출근 준비도 못 하는 상태예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"qualified\" data-m=\"자격이 있는\"><b>qualified</b>자격이 있는</button><button type=\"button\" class=\"wdb\" data-w=\"expertise\" data-m=\"전문 지식\"><b>expertise</b>전문 지식</button><button type=\"button\" class=\"wdb\" data-w=\"ignorance\" data-m=\"무지\"><b>ignorance</b>무지</button><button type=\"button\" class=\"wdb\" data-w=\"lay people\" data-m=\"비전문가\"><b>lay people</b>비전문가</button><button type=\"button\" class=\"wdb\" data-w=\"designated\" data-m=\"지명된, 지정된\"><b>designated</b>지명된, 지정된</button><button type=\"button\" class=\"wdb\" data-w=\"paralyze\" data-m=\"마비시키다\"><b>paralyze</b>마비시키다</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제 문제는 <b>but(하지만)</b>과 <b>needs to be(~해야 한다)</b>가 붙은 6번, 그리고 <b>That is why(그래서 ~이다)</b>로 결론을 내는 7번을 보세요. 반복되는 핵심어는 <b>rule(규칙)</b>과 <b>realistic(현실적인)</b>이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 제시</span><div class=\"en\">There is an important difference between having an ideal and <mark>making a rule to live by</mark>.</div><p class=\"ko\">이상을 갖는 것과 <mark>따라 살아갈 규칙을 만드는 것</mark> 사이에는 중요한 차이가 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>이상(ideal)을 그대로 규칙으로 삼으면 왜 안 되는지 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 문제점</span><div class=\"en\">Making the ideal into a rule is <mark>digging oneself a trap</mark>.</div><p class=\"ko\">이상을 규칙으로 만드는 것은 <mark>스스로 함정을 파는 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>but(하지만) 뒤 needs to be(~해야 한다)로 글쓴이의 주장이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">The rule needs to be clear, … <mark>but it also needs to be realistic</mark>, if it is not to undermine your self-esteem.</div><p class=\"ko\">규칙은 명확해야 하고, … 하지만 당신의 자존감을 약화시키지 않으려면 <mark>그것(= 규칙)은 또한 현실적이어야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>That is why(그래서 ~이다)로 6번을 한 번 더 정리해요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 결론</span><div class=\"en\"><mark>That is why</mark> it makes more sense to do the best you can — rather than aim for perfection.</div><p class=\"ko\"><mark>이것(= 앞 문장의 내용)이 바로</mark> 완벽함을 목표로 하기보다는 할 수 있는 최선을 다하는 것이 더 타당한 <mark>이유이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">why rules to live by need to be realistic 살아가는 규칙이 현실적이어야 하는 이유<small>1번의 rule to live by(따라 살아갈 규칙)와 6번의 realistic(현실적인)을 그대로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">difficulties of setting realistic goals 현실적인 목표를 세우는 것의 어려움</span><span class=\"why\">[반대] realistic(현실적인)이라는 단어가 같아서 끌리지만, 지문은 현실적인 규칙이 ‘어렵다’가 아니라 6번처럼 ‘필요하다’고 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">common characteristics of perfectionists 완벽주의자들의 공통적인 특징</span><span class=\"why\">[지문에 없음] 7번에 perfection(완벽함)이 나오지만, 완벽주의자가 어떤 사람인지 특징을 늘어놓는 글이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">how self-esteem affects our relationships 자존감이 우리의 인간관계에 어떻게 영향을 미치는가</span><span class=\"why\">[지문에 없음] 6번의 self-esteem(자존감)은 비현실적인 규칙이 해치는 대상일 뿐, 인간관계 이야기는 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">negative effects of detailed goals on our lives 세부적인 목표가 우리 삶에 미치는 부정적 영향</span><span class=\"why\">[반대] 6번은 규칙이 clear(명확해야) 한다고 했어요. 문제는 구체적인 게 아니라 완벽한(flawless 결점 없는) 이상을 규칙으로 삼는 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There is an important difference</div><div class=\"k\">중요한 차이가 있다</div></div><div class=\"rc\"><div class=\"e\">between having an ideal</div><div class=\"k\">이상을 갖는 것</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and making a rule to live by.</span></div><div class=\"k\"><span class=\"cw\">그리고 따라 살아갈 규칙을 만드는 것 사이에는.</span></div></div><div class=\"rnat\">이상을 갖는 것과 따라 살아갈 규칙을 만드는 것 사이에는 중요한 차이가 있다.</div><div class=\"rst\">시험 공부 계획표를 짠다고 해 봐요. ‘전교 1등’ 꿈과 ‘매일 지킬 규칙’은 달라요. 지문도 <b>이상</b>(ideal)과 <b>규칙</b>(rule)은 다르다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The ideal may be a perfect and flawless standard</div><div class=\"k\">이상은 완벽하고 결점 없는 기준일 수 있다</div></div><div class=\"rc\"><div class=\"e\">that one would be proud to attain.</div><div class=\"k\">어떤 사람이 달성하기에 자랑스러워할.</div></div><div class=\"rnat\">이상은 어떤 사람이 달성하기에 자랑스러워할, 완벽하고 결점 없는 기준일 수 있다.</div><div class=\"rst\">‘모든 과목 100점’은 이루면 정말 자랑스러울 목표예요. 지문도 이상은 완벽하고 결점 없는(flawless) 기준이라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Such an ideal provides you with a guide,</div><div class=\"k\">그러한 이상은 당신에게 지침을 제공하지만,</div></div><div class=\"rc\"><div class=\"e\">but it should not be a daily standard.</div><div class=\"k\">그것(= 그러한 이상)은 일상적인 기준이 되어서는 안 된다.</div></div><div class=\"rnat\">그러한 이상은 당신에게 지침을 제공하지만, 그것이 일상적인 기준이 되어서는 안 된다.</div><div class=\"rst\">그 꿈은 방향을 알려 주지만, 매일 지킬 기준은 아니에요. 지문도 이상은 지침(guide)일 뿐 일상 기준이 되면 안 된다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Making the ideal into a rule</div><div class=\"k\">이상을 규칙으로 만드는 것은</div></div><div class=\"rc\"><div class=\"e\">is digging oneself a trap.</div><div class=\"k\">스스로 함정을 파는 것이다.</div></div><div class=\"rnat\">이상을 (일상적인) 규칙으로 만드는 것은 스스로 함정을 파는 것이다.</div><div class=\"rst\">‘오늘도 100점처럼 완벽하게!’를 규칙으로 삼으면 매일 실패해요. 지문도 이상을 규칙으로 만드는 건 <b>스스로 함정을 파는 것</b>이라고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">If you constantly fall into the trap,</div><div class=\"k\">만약 당신이 지속적으로 그 함정에 빠진다면,</div></div><div class=\"rc\"><div class=\"e\">you feel so bad about yourself</div><div class=\"k\">당신은 자기 자신에 대해 너무 실망하여</div></div><div class=\"rc\"><div class=\"e\">that it becomes increasingly hard to keep going.</div><div class=\"k\">계속 나아가는 것이 점점 더 어려워진다.</div></div><div class=\"rnat\">만약 당신이 지속적으로 그 함정에 빠진다면, 당신은 자기 자신에 너무 실망하여 계속 나아가는 것이 점점 더 어려워진다.</div><div class=\"rst\">매일 못 지키면 ‘난 안 돼’ 하며 공부할 힘이 빠져요. 지문도 함정에 계속 빠지면 계속 나아가기가 점점 어려워진다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">The rule needs to be clear,</div><div class=\"k\">규칙은 명확해야 하고,</div></div><div class=\"rc\"><div class=\"e\">and to direct you toward the ideal</div><div class=\"k\">당신을 이상으로 이끌어야 하지만</div></div><div class=\"rc\"><div class=\"e\">if that is what you want,</div><div class=\"k\">만약 그것이 당신이 원하는 것이라면,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but it also needs to be realistic,</span></div><div class=\"k\"><span class=\"cw\">그것(= 규칙)은 또한 현실적이어야 한다,</span></div></div><div class=\"rc\"><div class=\"e\">if it is not to undermine your self-esteem.</div><div class=\"k\">그것이 당신의 자존감을 약화시키지 않으려면.</div></div><div class=\"rnat\">규칙은 명확해야 하고, 만약 그것이 당신이 원하는 것이라면 당신을 이상으로 이끌어야 하지만, 그것이 당신의 자존감을 약화시키지 않으려면 현실적이어야 하기도 한다.</div><div class=\"rst\">그래서 ‘하루 수학 문제 20개’처럼 분명하지만 지킬 만해야 해요. 지문도 규칙은 <b>현실적이어야</b>(realistic) 자존감을 안 해친다고 해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">That is why</span></div><div class=\"k\"><span class=\"cw\">이것(= 앞 문장의 내용)이 바로 ~ 이유이다</span></div></div><div class=\"rc\"><div class=\"e\">it makes more sense</div><div class=\"k\">더 타당한 것이</div></div><div class=\"rc\"><div class=\"e\">to do the best you can —</div><div class=\"k\">당신이 할 수 있는 최선을 다하는 것이</div></div><div class=\"rc\"><div class=\"e\">rather than aim for perfection.</div><div class=\"k\">완벽함을 목표로 하기보다는.</div></div><div class=\"rnat\">그것이 바로 완벽함을 목표로 하기보다는 당신이 할 수 있는 최선을 다하는 것이 더 타당한 이유이다.</div><div class=\"rst\"><b>그래서</b>(That is why) 완벽한 100점보다 오늘 할 수 있는 최선이 더 나아요. 지문의 결론도 완벽 대신 최선을 다하라는 거예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"ideal\" data-m=\"이상\"><b>ideal</b>이상</button><button type=\"button\" class=\"wdb\" data-w=\"flawless\" data-m=\"결점 없는\"><b>flawless</b>결점 없는</button><button type=\"button\" class=\"wdb\" data-w=\"attain\" data-m=\"달성하다\"><b>attain</b>달성하다</button><button type=\"button\" class=\"wdb\" data-w=\"realistic\" data-m=\"현실적인\"><b>realistic</b>현실적인</button><button type=\"button\" class=\"wdb\" data-w=\"undermine\" data-m=\"약화시키다\"><b>undermine</b>약화시키다</button><button type=\"button\" class=\"wdb\" data-w=\"self-esteem\" data-m=\"자존감\"><b>self-esteem</b>자존감</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">콤마 뒤 <b>분사구문</b>은 주절의 주어와 <b>능동 관계인지</b>부터 보세요. 고양이가 공간을 직접 채우니 능동 → <b>-ing(현재분사)</b>예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (8번)</span><div class=\"en\">A cat in a small box will behave like a fluid, <u>④ filled</u> up all the space.</div><p class=\"ko\">작은 상자 안의 고양이는 액체처럼 행동할 것이다, 그 모든 공간을 ( 채워진? 채우며? )</p></div><div class=\"ck-via\"><i>▼</i><span>콤마 뒤 분사구문의 주어는 따로 없으니, 주절 주어를 그대로 가져와요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 앞부분 · 주어 찾기</span><div class=\"en\"><mark>A cat in a small box</mark> will behave like a fluid,</div><p class=\"ko\"><mark>작은 상자 안의 고양이는</mark> 액체처럼 행동할 것이다,</p></div><div class=\"ck-via\"><i>▼</i><span>뒤에 목적어 all the space(그 모든 공간)가 있고, 고양이가 직접 채워요 → 능동 → filling(채우며)</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 뒷부분 · 결정적 단서</span><div class=\"en\"><mark>filling up</mark> all the space.</div><p class=\"ko\">그 모든 공간을 <mark>채우며</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">분사구문의 -ing(현재분사)와 p.p.(과거분사) 구별</p><p class=\"gr\">분사구문의 주어는 주절 주어와 같아요. 주어가 직접 하면 -ing(현재분사), 주어가 당하면 p.p.(과거분사)이고, 뒤에 목적어가 있으면 대부분 -ing(현재분사)예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The boy sat on the sofa, eating chips.</div><div class=\"ko\">그 소년은 과자를 먹으며 소파에 앉았다. (소년이 직접 먹으니 eating, 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The boy sat on the sofa, eaten chips.</div><div class=\"ko\">소년이 과자에게 먹히는 게 아니라서 eaten(먹힌)은 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Surprised by the noise, the dog ran away.</div><div class=\"ko\">소리에 놀라서 개가 도망갔다. (개가 놀람을 당하니 Surprised, 맞아요)</div></div><p class=\"gb\">지문 8번도 a cat(고양이)이 all the space(그 모든 공간)를 직접 채우니, filled(채워진)가 아니라 filling(채우며)이어야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">filled → filling (채우며)<small>고양이가 공간을 ‘채우는’ 쪽이고 뒤에 목적어가 있으니 현재분사 filling(채우며)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">that 강조구문의 that(~한 것은)</span><span class=\"why\">3번은 it wasn't(~것은 아니었다) + with this in mind(이런 생각을 하면서) + that(~한 것은)으로 이어지는 강조구문이에요. 강조할 말을 it was(~였다)와 that(~한 것) 사이에 끼운 거라 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">강조구문: It was(~였다) + 강조할 말 + that(~한 것은)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It was in the library that I met Tom.</div><div class=\"ko\">내가 톰을 만난 건 바로 도서관에서였다. (in the library를 강조, that이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It was in the library what I met Tom.</div><div class=\"ko\">강조구문에서는 what(~하는 것)을 쓸 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>It was my friend that broke the cup.</div><div class=\"ko\">컵을 깬 건 바로 내 친구였다. (my friend를 강조, 맞아요)</div></div><p class=\"gb\">지문 3번도 with this in mind(이런 생각을 하면서)를 it wasn't(~것은 아니었다)와 that(~한 것은) 사이에 끼워 강조했으니 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">similarly 유사하게</span><span class=\"why\">4번에서 similarly(유사하게)는 동사 adapt(적응하다)를 꾸며 ‘어떻게’ 적응하는지 말해 줘요. 동사를 꾸미는 자리라 부사가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">동사를 꾸미는 부사 자리</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She sings similarly to her mom.</div><div class=\"ko\">그녀는 엄마와 비슷하게 노래한다. (동사 sings를 꾸미니 부사 similarly, 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She sings similar to her mom.</div><div class=\"ko\">similar(비슷한)는 형용사라 동사 sings를 꾸밀 수 없어서 틀려요.</div></div><p class=\"gb\">지문 4번도 can adapt(적응할 수 있다)를 꾸며 물처럼 ‘유사하게’ 적응한다는 뜻이라 부사 similarly(유사하게)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">it 비인칭 주어</span><span class=\"why\">5번의 the time(시간) 뒤 it takes(시간이 걸리다) for cats to take up(고양이가 차지하는 데)은 시간이 걸린다는 고정 표현이에요. 이 표현은 늘 it(그것)이 주어라 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">It takes(시간이 걸리다) + 시간 + for A(A가) + to do(~하는 데)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It takes ten minutes for me to walk to school.</div><div class=\"ko\">내가 학교까지 걸어가는 데 10분이 걸린다. (it이 주어, 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>They takes ten minutes for me to walk to school.</div><div class=\"ko\">이 표현의 주어는 늘 it이라 they(그들)는 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I know the time it takes to get there.</div><div class=\"ko\">나는 거기 가는 데 걸리는 시간을 안다. (the time 뒤에 it takes가 이어져서 맞아요)</div></div><p class=\"gb\">지문 5번도 the time(시간) 뒤에 it takes(시간이 걸리다)가 이어져 ‘고양이가 채우는 데 걸리는 시간’이 되니 it(그것)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">behave 행동하다</span><span class=\"why\">9번은 will try(노력할 것이다) and(그리고) behave(행동할 것이다)로, 조동사 will(~할 것이다) 뒤 동사원형 두 개가 나란히 이어져요. 그래서 원형 behave(행동하다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">병렬 구조: will(~할 것이다) + 동사원형 and(그리고) 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I will clean my room and do my homework.</div><div class=\"ko\">나는 방을 청소하고 숙제를 할 것이다. (will 뒤 clean과 do 둘 다 원형, 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I will clean my room and doing my homework.</div><div class=\"ko\">will 뒤에 이어지는데 doing(-ing)이라 짝이 안 맞아 틀려요.</div></div><p class=\"gb\">지문 9번도 will try(노력할 것이다)와 짝을 이루는 동사라 원형 behave(행동하다)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Are cats liquid or solid?</div><div class=\"k\">고양이는 액체일까 고체일까?</div></div><div class=\"rnat\">고양이는 액체일까 고체일까?</div><div class=\"rst\">고양이는 액체일까 고체일까? 지문은 이 엉뚱한 질문으로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">That's the kind of question</div><div class=\"k\">그것은 그런 종류의 질문이다</div></div><div class=\"rc\"><div class=\"e\">that could win a scientist an Ig Nobel Prize,</div><div class=\"k\">과학자에게 이그노벨상을 안겨 줄 수 있는,</div></div><div class=\"rc\"><div class=\"e\">a parody of the Nobel Prize</div><div class=\"k\">노벨상의 패러디인 (이그노벨상)</div></div><div class=\"rc\"><div class=\"e\">that honors research</div><div class=\"k\">연구에 경의를 표하는</div></div><div class=\"rc\"><div class=\"e\">that “makes people laugh, then think.”</div><div class=\"k\">'사람들을 웃게 한 후 생각하게 만드는'.</div></div><div class=\"rnat\">그것은 '사람들을 웃게 한 후 생각을 하게 만드는' 연구에 경의를 표하는 노벨상의 패러디인, 이그노벨상을 과학자가 타게 할 수 있는 종류의 질문이다.</div><div class=\"rst\">이 질문은 ‘웃기고 나서 생각하게 하는’ 연구에 주는 이그노벨상(Ig Nobel Prize)감이에요. 지문은 that(~하는)으로 질문과 연구를 꾸며요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">But it wasn't</div><div class=\"k\">하지만 ~ 것은 아니었다</div></div><div class=\"rc\"><div class=\"e\">with this in mind</div><div class=\"k\">이런 생각(= 앞 문장의 내용)을 하면서</div></div><div class=\"rc\"><div class=\"e\">that Marc-Antoine Fardin, a physicist at Paris Diderot University,</div><div class=\"k\">파리 Diderot 대학의 물리학자인 Marc-Antoine Fardin이</div></div><div class=\"rc\"><div class=\"e\">set out to find out</div><div class=\"k\">알아내기 시작한</div></div><div class=\"rc\"><div class=\"e\">whether house cats flow.</div><div class=\"k\">집고양이가 흐르는지 아닌지를.</div></div><div class=\"rnat\">하지만 파리 Diderot 대학의 물리학자인 Marc-Antoine Fardin이 이런 생각을 하면서 집고양이가 (액체처럼) 흐늘거리며 움직이는지 아닌지를 알아내기 시작한 것은 아니었다.</div><div class=\"rst\">하지만 물리학자 파르댕(Fardin)이 상 받으려고 연구한 건 아니에요. 지문은 it wasn't(~것은 아니었다) ~ that(~한 것은) 강조구문이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Fardin noticed</div><div class=\"k\">Fardin은 알아챘다</div></div><div class=\"rc\"><div class=\"e\">that these furry pets can adapt</div><div class=\"k\">털로 덮인 이 반려동물이 적응할 수 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">to the shape of the container</div><div class=\"k\">용기의 모양에</div></div><div class=\"rc\"><div class=\"e\">they sit in</div><div class=\"k\">그들이 들어가 앉아 있는</div></div><div class=\"rc\"><div class=\"e\">similarly to what fluids such as water do.</div><div class=\"k\">물과 같은 액체가 하는 것과 유사하게.</div></div><div class=\"rnat\">Fardin은 털로 덮인 이 반려동물이 물과 같은 액체가 하는 것과 유사하게 그들이 들어가 앉아 있는 용기의 모양에 맞게 조절할 수 있다는 것을 알아냈다.</div><div class=\"rst\">그는 고양이가 물처럼 그릇 모양에 맞춰 몸을 바꾸는 걸 봤어요. 동사를 꾸며서 부사 similarly(유사하게)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">So he applied rheology,</div><div class=\"k\">그래서 그는 유동학을 적용했다,</div></div><div class=\"rc\"><div class=\"e\">the branch of physics</div><div class=\"k\">물리학의 한 분야인</div></div><div class=\"rc\"><div class=\"e\">that deals with the deformation of matter,</div><div class=\"k\">물질의 변형을 다루는,</div></div><div class=\"rc\"><div class=\"e\">to calculate the time</div><div class=\"k\">시간을 계산하기 위해</div></div><div class=\"rc\"><div class=\"e\">it takes for cats</div><div class=\"k\">고양이가 ~하는 데 걸리는 (시간)</div></div><div class=\"rc\"><div class=\"e\">to take up the space of a vase or bathroom sink.</div><div class=\"k\">꽃병이나 욕실 세면대의 공간을 채우는.</div></div><div class=\"rnat\">그래서 그는 고양이가 꽃병 또는 욕실 세면대의 공간을 채우는 데 걸리는 시간을 계산하기 위해 물질의 변형을 다루는 물리학의 한 분야인 유동학을 적용했다.</div><div class=\"rst\">그래서 고양이가 꽃병·세면대를 채우는 시간을 계산했어요. 지문의 it takes(시간이 걸리다) 구조예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The conclusion?</div><div class=\"k\">결론은?</div></div><div class=\"rnat\">결론은?</div><div class=\"rst\">그래서 결론은? 지문은 질문 하나로 답을 기대하게 만들어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Cats can be either liquid or solid,</div><div class=\"k\">고양이는 액체일 수도 고체일 수도 있다,</div></div><div class=\"rc\"><div class=\"e\">depending on the circumstances.</div><div class=\"k\">상황에 따라.</div></div><div class=\"rnat\">고양이는 환경에 따라 액체가 될 수 있고 고체도 될 수 있다.</div><div class=\"rst\">고양이는 상황에 따라 액체도, 고체도 될 수 있어요. 지문은 either A or B(A이거나 B)로 두 가지를 다 열어 둬요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">A cat in a small box</span></div><div class=\"k\"><span class=\"cw\">작은 상자 안의 고양이는</span></div></div><div class=\"rc\"><div class=\"e\">will behave like a fluid,</div><div class=\"k\">액체처럼 행동할 것이다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">filling up all the space.</span></div><div class=\"k\"><span class=\"cw\">그 모든 공간을 채우며.</span> ※ 문제지엔 filled로 되어 있음</div></div><div class=\"rnat\">작은 상자 안의 고양이는 그 모든 공간을 채우며, 액체처럼 행동할 것이다.</div><div class=\"rst\">작은 상자 속 고양이는 상자를 꽉 <b>채우며</b> 액체처럼 굴어요. 고양이가 채우는 쪽이라 filled(채워진)가 아니라 <b>filling</b>(채우며)이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">But a cat in a bathtub full of water</div><div class=\"k\">하지만 물로 가득 찬 욕조 안의 고양이는</div></div><div class=\"rc\"><div class=\"e\">will try to minimize its contact with it</div><div class=\"k\">그것(= 물)과 자신의 접촉을 최소화하려고 노력할 것이고</div></div><div class=\"rc\"><div class=\"e\">and behave very much like a solid.</div><div class=\"k\">고체와 매우 유사하게 행동할 것이다.</div></div><div class=\"rnat\">하지만 물로 가득 찬 욕조의 고양이는 그것과 자신의 접촉을 최소화하려고 노력하면서 고체와 매우 유사하게 움직일 것이다.</div><div class=\"rst\"><b>하지만</b>(But) 물 가득한 욕조에선 물에 덜 닿으려고 고체처럼 굴어요. 지문은 try(노력하다)와 behave(행동하다)가 나란히 원형이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"parody\" data-m=\"패러디, 풍자\"><b>parody</b>패러디, 풍자</button><button type=\"button\" class=\"wdb\" data-w=\"physicist\" data-m=\"물리학자\"><b>physicist</b>물리학자</button><button type=\"button\" class=\"wdb\" data-w=\"adapt to\" data-m=\"~에 적응하다\"><b>adapt to</b>~에 적응하다</button><button type=\"button\" class=\"wdb\" data-w=\"container\" data-m=\"용기, 그릇\"><b>container</b>용기, 그릇</button><button type=\"button\" class=\"wdb\" data-w=\"deformation\" data-m=\"변형\"><b>deformation</b>변형</button><button type=\"button\" class=\"wdb\" data-w=\"take up\" data-m=\"차지하다\"><b>take up</b>차지하다</button><button type=\"button\" class=\"wdb\" data-w=\"minimize\" data-m=\"최소화하다\"><b>minimize</b>최소화하다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">4번 <b>don't know(알지 못한다)</b> 때문에 기부를 망설이던 문제를, 6번 <b>go straight(곧장 간다)</b>가 해결해 줘요. 해결된 뒤 기부자의 마음은 <b>확신</b> 쪽이니, 그 방향과 어긋나는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">4번 · 문제 상황</span><div class=\"en\">Many people are hesitant to give to nonprofits, because <mark>they don't know</mark> where or how their money is actually going to be used.</div><p class=\"ko\">많은 사람들은 그들의 돈이 실제로 어디에서 혹은 어떻게 사용될지 <mark>알지 못하기 때문에</mark> 비영리 단체에 기부하는 것을 망설인다.</p></div><div class=\"ck-via\"><i>▼</i><span>This way(이런 식으로) = 5번처럼 운영비를 따로 맡기면</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 해결책</span><div class=\"en\">This way, all the donations you collect <mark>go straight to the people</mark> you are working to help —</div><p class=\"ko\">이런 식으로, 당신이 거둔 모든 기부금들은 당신이 돕고 있는 <mark>그 사람들에게 곧장 가게 되고</mark> —</p></div><div class=\"ck-via\"><i>▼</i><span>돈이 곧장 간다는 걸 아는데 불확실? 방향이 거꾸로예요</span></div><div class=\"ck-step key\"><span class=\"lab\">문제지 ③번 자리 (6번)</span><div class=\"en\">making your donors feel <u>③ uncertain</u> their dollars are doing good things — and that only creates <mark>more generosity</mark> on their part.</div><p class=\"ko\">기부자들이 그들의 돈이 좋은 일을 하고 있다고 ( 불확실하게? ) 느끼게 만들며 — 그것은 더 많은 관대함을 만들어 낼 뿐이다 → 확신하게(certain)가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">uncertain(불확실한) ↔ certain(확신하는)</p><p class=\"gr\">모르는 상태면 uncertain(불확실한), 잘 알게 되면 certain(확신하는)이에요. 뒤에 more generosity(더 많은 관대함) 같은 좋은 결과가 오면 원인도 확신 쪽이어야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I saw my score, so I feel certain I passed.</div><div class=\"ko\">점수를 봤으니 나는 통과했다고 확신해요. (알게 됨 → 확신, 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I saw my score, so I feel uncertain I passed.</div><div class=\"ko\">점수를 직접 봤는데 불확실하다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I don't know the answer, so I feel uncertain.</div><div class=\"ko\">답을 몰라서 나는 불확실하게 느껴요. (모름 → 불확실, 맞아요)</div></div><p class=\"gb\">지문 6번도 기부금이 go straight(곧장 간다)해서 돈이 어디 쓰이는지 알게 되니, uncertain(불확실한)이 아니라 certain(확신하는)이어야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">uncertain → certain (확신하는)<small>돈이 곧장 전달되니 기부자는 확신하고(certain), 그래서 관대함(generosity)이 더 커져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">hesitant 망설이는</span><span class=\"why\">4번 뒤에 because they don't know(그들은 알지 못하기 때문에)가 이유로 나와요. 돈이 어디 쓰일지 모르면 기부를 망설이는 게 자연스러워서 hesitant(망설이는)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">includes 포함하다</span><span class=\"why\">1번에서 openness(개방성)가 중요하다고 했어요. 2번은 그 예로 웹사이트가 지도와 모든 우물 사진을 includes(포함하다)한다는 거라 방향이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">encourages 장려하다</span><span class=\"why\">7번은 Being open(개방적인 것)이 받은 돈에 responsible(책임감 있는)하도록 돕는다는 말이에요. 좋은 쪽으로 이끄니 encourages(장려하다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">less 덜</span><span class=\"why\">8번은 사람들이 돈의 행방을 알면 a fancy office(멋진 사무실)나 high salaries(높은 급여)에 돈을 쓸 가능성이 줄어든다는 말이에요. 그래서 less(덜)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Openness is important</div><div class=\"k\">개방성은 중요하다</div></div><div class=\"rc\"><div class=\"e\">no matter what your business or venture.</div><div class=\"k\">당신의 사업 또는 벤처 사업이 무엇이든 간에.</div></div><div class=\"rnat\">개방성은 당신의 사업 또는 벤처 사업이 무엇이든지 간에 중요하다.</div><div class=\"rst\">학급 기부함을 떠올려 봐요. 지문은 어떤 일을 하든 <b>개방성</b>(openness)이 중요하다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The Charity Water website</div><div class=\"k\">Charity Water 웹사이트는</div></div><div class=\"rc\"><div class=\"e\">includes a Google Map location</div><div class=\"k\">구글 지도의 위성 위치기능을 포함하고 있다</div></div><div class=\"rc\"><div class=\"e\">and photographs of every well.</div><div class=\"k\">그리고 모든 우물의 사진을.</div></div><div class=\"rnat\">Charity Water 웹사이트는 구글 지도의 위성 위치기능과 모든 우물의 사진을 포함하고 있다.</div><div class=\"rst\">반장이 모은 돈으로 산 물건 사진을 게시판에 다 붙여요. 지문도 웹사이트에 모든 우물(well)의 사진과 위치를 넣었다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">When you look at the site,</div><div class=\"k\">당신이 그 사이트를 볼 때,</div></div><div class=\"rc\"><div class=\"e\">you can see</div><div class=\"k\">당신은 볼 수 있다</div></div><div class=\"rc\"><div class=\"e\">what Charity Water is doing.</div><div class=\"k\">Charity Water가 하고 있는 일을.</div></div><div class=\"rnat\">당신이 그 사이트를 볼 때, 당신은 Charity Water가 하고 있는 일을 볼 수 있다.</div><div class=\"rst\">게시판만 보면 돈이 어디 쓰였는지 바로 보여요. 지문도 사이트를 보면 단체가 하는 일을 볼 수 있다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Many people are hesitant to give to nonprofits,</div><div class=\"k\">많은 사람들은 비영리 단체에 기부하는 것을 망설인다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">because they don't know</span></div><div class=\"k\"><span class=\"cw\">왜냐하면 그들은 알지 못하기 때문에</span></div></div><div class=\"rc\"><div class=\"e\">where or how their money is actually going to be used.</div><div class=\"k\">그들의 돈이 실제로 어디에서 혹은 어떻게 사용될지를.</div></div><div class=\"rnat\">많은 사람들은 그들의 돈이 실제로 어디에서 혹은 어떻게 사용되는지를 알 수 없기 때문에, 비영리 단체에 기부하는 것을 망설인다.</div><div class=\"rst\">돈이 어디 갈지 <b>모르면</b>(don't know) 친구들은 내기를 망설여요. 지문도 그래서 사람들이 기부를 망설인다(hesitant)고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">This is why</div><div class=\"k\">이것(= 앞 문장의 내용)이 바로 ~ 이유이다</div></div><div class=\"rc\"><div class=\"e\">it can be a good idea</div><div class=\"k\">좋은 생각일 수 있는</div></div><div class=\"rc\"><div class=\"e\">to get individuals or an organization</div><div class=\"k\">개인이나 단체가</div></div><div class=\"rc\"><div class=\"e\">to underwrite your operational costs.</div><div class=\"k\">당신의 운영 비용을 부담하도록 하는 것이.</div></div><div class=\"rnat\">이것이 개인이나 단체가 당신의 운영 비용을 부담하도록 하는 것이 좋은 생각일 수 있는 이유이다.</div><div class=\"rst\">그래서 담임쌤이 기부함 관리비를 따로 내 주는 거예요. 지문도 누군가에게 운영비를 부담하게(underwrite) 하라고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">This way,</div><div class=\"k\">이런 식으로,</div></div><div class=\"rc\"><div class=\"e\">all the donations you collect</div><div class=\"k\">당신이 거둔 모든 기부금들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">go straight to the people</span></div><div class=\"k\"><span class=\"cw\">그 사람들에게 곧장 가게 되고</span></div></div><div class=\"rc\"><div class=\"e\">you are working to help —</div><div class=\"k\">당신이 돕고 있는 —</div></div><div class=\"rc\"><div class=\"e\">making your donors feel certain</div><div class=\"k\">기부자들로 하여금 확신하게 느끼게 만들며 ※ 문제지엔 uncertain으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">their dollars are doing good things —</div><div class=\"k\">그들의 돈이 좋은 일을 하고 있다고 —</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and that only creates more generosity</span></div><div class=\"k\"><span class=\"cw\">그리고 그것(= 앞에서 말한 내용)은 더 많은 관대함을 만들어 낼 뿐이다</span></div></div><div class=\"rc\"><div class=\"e\">on their part.</div><div class=\"k\">그들(= 기부자들) 쪽에서.</div></div><div class=\"rnat\">이런 식으로, 당신이 거둔 모든 기부금들은 당신이 돕고 있는 사람들에게 곧장 가게 되고, 이것은 기부자들로 하여금 기부금이 좋은 일을 하고 있다는 것을 확신하게 느끼게 만들며, 그것은 기부자들이 더 아량을 베풀게 한다.</div><div class=\"rst\">그러면 모은 돈이 <b>곧장</b> 필요한 친구에게 가니 다들 <b>확신</b>하고 더 내요. 그래서 uncertain(불확실한)이 아니라 certain(확신하는)이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Being open also encourages you</div><div class=\"k\">개방적인 것은 또한 당신이 ~하도록 장려한다</div></div><div class=\"rc\"><div class=\"e\">to be responsible</div><div class=\"k\">책임감을 가지도록</div></div><div class=\"rc\"><div class=\"e\">with the money you take in.</div><div class=\"k\">당신이 받는 돈에 대해서.</div></div><div class=\"rnat\">개방적이게 되는 것은 또한 당신이 받는 돈에 대해서 책임감을 느끼도록 장려한다.</div><div class=\"rst\">다 공개하니 반장도 돈을 더 책임감 있게 써요. 지문도 개방성이 책임감(responsible)을 장려한다(encourages)고 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">If people are aware</div><div class=\"k\">만약 사람들이 알게 된다면</div></div><div class=\"rc\"><div class=\"e\">of where their money goes,</div><div class=\"k\">그들의 돈이 어디로 가는지를,</div></div><div class=\"rc\"><div class=\"e\">you'll be less likely</div><div class=\"k\">당신은 가능성이 덜할 것이다</div></div><div class=\"rc\"><div class=\"e\">to spend it</div><div class=\"k\">그것(= 그 돈)을 쓸</div></div><div class=\"rc\"><div class=\"e\">on a fancy office or high salaries.</div><div class=\"k\">멋진 사무실이나 높은 급여에.</div></div><div class=\"rnat\">만약에 사람들이 그들의 돈이 어디로 가는지를 알게 된다면, 당신은 멋진 사무실이나 높은 급여에 그 돈을 쓰게 될 가능성이 덜할 것이다.</div><div class=\"rst\">모두가 보고 있으니 반장 간식비로 쓸 일이 줄어요. 지문도 멋진 사무실이나 높은 급여에 쓸 가능성이 덜하다(less)고 해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"openness\" data-m=\"개방성\"><b>openness</b>개방성</button><button type=\"button\" class=\"wdb\" data-w=\"hesitant\" data-m=\"망설이는\"><b>hesitant</b>망설이는</button><button type=\"button\" class=\"wdb\" data-w=\"nonprofit\" data-m=\"비영리 단체\"><b>nonprofit</b>비영리 단체</button><button type=\"button\" class=\"wdb\" data-w=\"underwrite\" data-m=\"~을 대신 부담하다\"><b>underwrite</b>~을 대신 부담하다</button><button type=\"button\" class=\"wdb\" data-w=\"donor\" data-m=\"기부자\"><b>donor</b>기부자</button><button type=\"button\" class=\"wdb\" data-w=\"generosity\" data-m=\"관대함\"><b>generosity</b>관대함</button></div>"};

    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}

    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
