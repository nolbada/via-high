<title>고2 미니모의고사 17회 01–06번</title>
<style>

.tabs{display:flex;gap:0}

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();

ment<sup>4</sup> to the organization or their jobs.", "notes": [["1", "allocate", "할당하다"], ["2", "facilitate", "촉진하다"], ["3", "engagement", "참여, 관여"], ["4", "commitment", "헌신"]], "lit": "기업들은 또한 그런 프로그램을 마련하는 데 필요한 자원을 할당하는 것을 걱정할 수도 있다 / 아니면 어쩌면 그들은 두려워할 수도 있다 / 직원들의 참여를 다른 곳에서 촉진하는 것이 조직이나 업무에 대한 헌신을 약화시킬까 봐", "nat": "기업들은 또한 그런 프로그램을 마련하는 데 필요한 자원을 할당하는 것을 걱정할 수도 있고, 혹은 직원들이 다른 곳에서 참여하도록 하는 것이 조직이나 업무에 대한 헌신을 약화시킬까 봐 두려워할 수도 있다.", "ana": "동명사구 <b>allocating</b>이 be concerned about의 목적어이고, fear의 목적어인 that절 안에서는 동명사구 <b>facilitating ~</b>이 주어이다.", "pe": "Corporations \u0001also\u0002 may be concerned \u0001about allocating<sup>1</sup> the resources needed to set up such programs\u0002, / or \u0001perhaps\u0002 they fear / that facilitating<sup>2</sup> employees’ engagement<sup>3</sup> \u0001elsewhere\u0002 may weaken their commitment<sup>4</sup> \u0001to the organization or their jobs\u0002.", "pk": "기업들은 \u0001또한\u0002 \u0001그런 프로그램을 마련하는 데 필요한 자원을 할당하는 것을\u0002 걱정할 수도 있다 / 아니면 \u0001어쩌면\u0002 그들은 두려워할 수도 있다 / 직원들의 참여를 \u0001다른 곳에서\u0002 촉진하는 것이 \u0001조직이나 업무에 대한\u0002 헌신을 약화시킬까 봐", "core": "기업들은 걱정할 수도 있고, 어쩌면 그들은 촉진하는 것이 헌신을 약화시킬까 봐 두려워할 수도 있다.", "tags": ["Corporations may be concerned: 2형식 SVC. also = 부사: concerned 꾸밈. about allocating ~ = 전치사구(부사구): concerned 꾸밈. needed to ~: resources 꾸밈", "or + they fear: 3형식 SVO, 뒤에 목적어 that절. perhaps = 부사: 문장 전체 꾸밈", "<b>목적어 that절</b>: facilitating ~ (동명사구 주어) may weaken their commitment. elsewhere = 부사: facilitating 꾸밈. to ~ = 전치사구(형용사구): commitment 꾸밈"], "steps": [{"t": "이 문장은 <b>절 두 개가 or로 연결</b>된 문장이다. 뒤 절의 that절 안에서는 <b>동명사구가 주어</b>로 쓰여 길어졌다."}, {"t": "앞 절의 뼈대를 찾는다.", "sub": ["S: Corporations (기업들)", "V: may be (be ~일지도 모른다)", "C: concerned (걱정하는) → be + 분사형 형용사라 2형식", "also (또한)는 부사", "뼈대 = <b>Corporations may be concerned</b>"]}, {"t": "<b>about allocating the resources needed to set up such programs</b>는 concerned를 꾸미는 전치사구이다.", "sub": ["about 뒤 allocating은 <b>동명사</b>: allocate (할당하다) + O: the resources (자원)", "<b>needed to set up such programs</b>는 resources를 꾸미는 <b>과거분사구</b> (그런 프로그램을 마련하는 데 필요한). set up (마련하다)"]}, {"t": "뒤 절의 뼈대를 찾는다.", "sub": ["S: they (= Corporations, 기업들)", "V: fear (두려워하다)", "O: that절", "perhaps (아마)는 문장 전체를 꾸미는 부사"]}, {"t": "that절 안은 <b>동명사구가 주어</b>이다.", "sub": ["S: facilitating employees' engagement elsewhere (직원들의 참여를 다른 곳에서 촉진하는 것). facilitate (촉진하다), engagement (참여), elsewhere (다른 곳에서)", "V: may weaken (weaken 약화시키다) + O: their commitment (그들의 헌신). their = employees (직원들)", "to the organization or their jobs (조직이나 업무에 대한)는 commitment를 꾸미는 전치사구"]}], "sum": "기업은 자원 할당이나 직원들의 헌신 약화를 걱정할 수 있음"}, {"i": "07", "q": "05", "s": "2", "title": "S+V+O(동명사) + 분사구문 + 전치사+관계대명사", "eng": "The spotlight effect<sup>1</sup> means seeing ourselves at center stage<sup>2</sup>, / thus intuitively<sup>3</sup> overestimating the extent<sup>4</sup> to which others’ attention is aimed at us.", "notes": [["1", "spotlight effect", "스포트라이트 효과"], ["2", "center stage", "무대 중심"], ["3", "intuitively", "직관적으로"], ["4", "extent", "정도"]], "lit": "스포트라이트 효과는 우리 자신을 무대 중심에 있다고 보는 것을 의미한다 / 그래서 다른 사람들의 관심이 우리에게 향하는 정도를 직관적으로 과대평가하게 만든다", "nat": "스포트라이트 효과는 우리 자신을 무대 중심에 있다고 보는 것을 의미하며, 그래서 다른 사람들의 관심이 우리에게 향하는 정도를 직관적으로 과대평가하게 만든다.", "ana": "동명사 <b>seeing</b>과 <b>overestimating</b>이 병렬 구조를 이루며, <b>전치사+관계대명사(to which)</b>가 the extent를 수식한다.", "pe": "The spotlight effect<sup>1</sup> means seeing ourselves \u0001at center stage<sup>2</sup>\u0002, / \u0001thus intuitively<sup>3</sup> overestimating the extent<sup>4</sup> to which others’ attention is aimed at us\u0002.", "pk": "스포트라이트 효과는 우리 자신을 \u0001무대 중심에 있다고\u0002 보는 것을 의미한다 / \u0001그래서 다른 사람들의 관심이 우리에게 향하는 정도를 직관적으로 과대평가하게 만든다\u0002", "core": "스포트라이트 효과는 우리 자신을 보는 것을 의미한다.", "tags": ["The spotlight effect means seeing ourselves: means + 동명사 목적어, see A at B = 3형식 + 전치사구. at center stage = 전치사구(부사구): seeing을 꾸밈 [기준: 모양 규칙]", "thus ~ overestimating = 분사구문(부사적, 결과): means를 꾸밈. <b>the extent to which</b> = 전치사 + 관계대명사 (정도)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>인데 목적어가 <b>동명사구</b>이고, 뒤에 분사구문과 관계절이 이어져 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The spotlight effect (스포트라이트 효과)", "V: means (mean 의미하다의 3인칭 단수형)", "O: seeing ourselves at center stage (우리 자신을 무대 중심에 있다고 보는 것)", "뼈대 = <b>The spotlight effect means seeing ourselves ...</b>"]}, {"t": "O 안은 <b>see A at B</b> (A가 B에 있다고 보다)이다.", "sub": ["동명사 seeing, A = ourselves (우리 자신), at center stage (무대 중심에)"]}, {"t": "<b>thus intuitively overestimating ~</b>는 <b>분사구문(결과)</b>이다. '그래서 ~하게 된다'. 앞 절 전체를 꾸민다.", "sub": ["thus (그래서), intuitively (직관적으로), overestimate (과대평가하다) + O: the extent (정도)"]}, {"t": "<b>to which others' attention is aimed at us</b>는 <b>전치사 + 관계대명사 관계절</b>로 extent를 꾸민다. 'the extent to which ~' = '~하는 정도'.", "sub": ["S: others' attention (다른 사람들의 관심), V: is aimed (aim 겨누다의 수동태), at us (우리에게)", "which 뒤는 완전한 절이다."]}], "sum": "스포트라이트 효과: 남들이 나를 보는 정도를 과대평가"}, {"i": "08", "q": "06", "s": "2", "title": "S+V+O + as절 3개 병렬", "eng": "Perhaps more than any other texts, they reflect<sup>1</sup> society as it wishes to be, / as it wishes to be seen, / and as it unconsciously<sup>2</sup> reveals itself to be, at least to writers.", "notes": [["1", "reflect", "반영하다"], ["2", "unconsciously", "무의식적으로"]], "lit": "아마도 다른 어떤 텍스트보다도, 그것들은 사회를 반영한다 사회가 되고자 하는 모습으로 / 보이고자 하는 모습으로 / 그리고 적어도 작가들에게는 무의식적으로 드러내는 모습으로", "nat": "아마도 다른 어떤 텍스트보다도, 그것들은 사회가 되고자 하는 모습으로, 보이고자 하는 모습으로, 그리고 적어도 작가들에게는 무의식적으로 드러내는 모습으로 사회를 반영한다.", "ana": "세 개의 <b>as절</b>이 콤마와 and로 <b>병렬</b> 연결되어 사회를 반영하는 방식을 설명한다.", "pe": "\u0001Perhaps more than any other texts\u0002, they reflect<sup>1</sup> society \u0001as it wishes to be,\u0002 / \u0001as it wishes to be seen\u0002, / and \u0001as it unconsciously<sup>2</sup> reveals itself to be\u0002, \u0001at least to writers\u0002.", "pk": "\u0001아마도 다른 어떤 텍스트보다도\u0002, 그것들은 사회를 반영한다 \u0001사회가 되고자 하는 모습으로\u0002 / \u0001보이고자 하는 모습으로\u0002 / 그리고 \u0001적어도 작가들에게는\u0002 \u0001무의식적으로 드러내는 모습으로\u0002", "core": "그것들은 사회를 반영한다.", "tags": ["Perhaps more than ~ = 부사구(비교): 문장 전체 꾸밈. they reflect society: 3형식 SVO. as it wishes to be = as절(부사구): reflect 꾸밈, <b>A as B</b>의 as B는 수식어", "as it wishes to be seen = as절(부사구): reflect를 꾸밈. <b>as절 3개 병렬</b>의 둘째. to be seen은 수동", "and + as it reveals itself to be = as절(부사구), 병렬 셋째. unconsciously = 부사: reveals 꾸밈. at least to writers = 삽입 전치사구(부사구): reveals 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>인데 뒤에 <b>as절이 3개 병렬</b>되어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: they (= texts, 텍스트들)", "V: reflect (반영하다)", "O: society (사회)", "Perhaps more than any other texts (아마도 다른 어떤 텍스트보다도)는 비교를 나타내는 부사구", "뼈대 = <b>they reflect society</b>"]}, {"t": "뒤의 <b>as절</b> 세 개는 모두 reflect를 꾸미는 수식어이다. 'society as it ~' (사회를 ~하는 모습 그대로). 기준: reflect A as B는 3형식 + as절 수식어로 본다."}, {"t": "as절 세 개를 순서대로 본다.", "sub": ["<b>as it wishes to be</b>: it = society. 사회가 되고자 하는 모습으로 (wish to be 되고자 하다)", "<b>as it wishes to be seen</b>: 사회가 보이고자 하는 모습으로 (to be seen 보이다, 수동)", "<b>and as it unconsciously reveals itself to be</b>: 사회가 무의식적으로 드러내는 모습으로 (reveal A to be B)", "<b>at least to writers</b> (적어도 작가들에게는)는 삽입된 전치사구(부사구)"]}], "sum": "텍스트는 사회의 원하는·보이고 싶은·무의식의 모습을 반영"}], "qs": [{"q": "01", "type": "목적", "src": "2017년 9월 18번", "ans": "①", "tr": [["1", "저는 당신이 동남아시아 여행 중에 발견한 고대 유적에 관해 국립박물관에서 열린 당신의 강연에 큰 기쁨과 함께 참석했습니다."], ["2", "저는 현재 Dreamers Academy에서 세계사를 가르치고 있으며, 그런 역사적 장소를 방문한 경험이 있는 당신 같은 분이 저희 반을 방문해 주신다면 학생들이 정말 좋아할 것이라고 생각합니다."], ["3", "저는 당신이 저희 반에 특별 강연을 해 주시고 여행에 관한 이야기를 나눠 주시기를 바랍니다."], ["4", "저는 제 수업 일정표를 첨부했으며, 당신이 시간이 되는 언제든 일정을 조율할 수 있습니다."], ["5", "일정이 가능하신지 알려주시려면 714-456-7932로 전화 주시면 됩니다."], ["6", "대단히 감사합니다."]], "evh": "2·3번 문장", "ev": [{"en": true, "h": "I am currently teaching World History at Dreamers Academy ~ / It is my hope that you would be willing to give a special lecture to my class and share stories about your travels."}, {"en": false, "h": "역사 유적 방문 경험이 있는 상대에게 자기 학급 방문을 기대한다는 2번과, 특별 강연을 부탁하는 3번을 종합하면 이 글의 목적은 특별 강연 요청이다."}], "opts": [{"n": "①", "t": "특별 강연을 부탁하려고", "a": true, "x": false, "trap": false, "e": "학급을 위한 특별 강연을 요청하는 2·3번 문장의 내용과 정확히 일치한다."}, {"n": "②", "t": "변경된 강연 일정을 안내하려고", "a": false, "x": true, "trap": false, "e": "강연 일정 변경에 관한 내용은 없다."}, {"n": "③", "t": "유적지 탐방 참가를 신청하려고", "a": false, "x": true, "trap": true, "e": "유적지 탐방 신청이 아니라 강연 요청이 목적이다."}, {"n": "④", "t": "유적 발굴 시 유의 사항을 알리려고", "a": false, "x": true, "trap": false, "e": "발굴 유의사항에 관한 내용은 없다."}, {"n": "⑤", "t": "유익한 강연에 대해 감사를 표하려고", "a": false, "x": true, "trap": false, "e": "이미 참석했던 강연에 대한 감사는 도입부일 뿐, 편지의 실제 목적은 새로운 강연 요청이다."}], "w": [["attend", "참석하다"], ["ancient remains", "고대 유적"], ["discover", "발견하다"], ["currently", "현재"], ["appreciate", "감사히 여기다"], ["historical site", "역사적 장소"], ["be willing to", "기꺼이 ~하다"], ["arrangement", "조치, 준비"], ["available", "시간이 있는"], ["permit", "가능하게 하다"]]}, {"q": "02", "type": "제목", "src": "2023년 6월 24번", "ans": "⑤", "tr": [["1", "새로운 상황, 생각, 감정에 반응하여 새로운 단어와 표현이 끊임없이 생겨난다."], ["2", "&lt;옥스퍼드 영어사전&gt;은 언어에 새로 들어온 새로운 단어와 표현의 추가분을 발행한다."], ["3", "어떤 사람들은 이런 종류의 일을 한탄하며 이를 올바른 영어로부터의 이탈로 여긴다."], ["4", "하지만 영어의 철자법과 구두법을 어떻게든 공식화하려는 시도가 있었던 것은 겨우 18세기에 이르러서였다."], ["5", "우리가 21세기에 쓰는 언어는 셰익스피어에게는 사실상 이해할 수 없는 것일 테고, 그가 우리에게 말하는 방식 역시 마찬가지일 것이다."], ["6", "앨빈 토플러는 셰익스피어가 현재 영어에서 일반적으로 쓰이는 45만 개의 단어 중 아마 25만 개 정도만 이해할 수 있을 것이라고 추산했다."], ["7", "다시 말해서, 말하자면, 만약 셰익스피어가 오늘날 런던에 나타난다면, 그는 평균적으로 우리 어휘에 있는 9개의 단어당 5개만을 이해할 것이다."]], "evh": "5·7번 문장", "ev": [{"en": true, "h": "The language we speak in the twenty-first century would be virtually unintelligible to Shakespeare ~ / if Shakespeare were to materialize in London today he would understand, on average, only five out of every nine words in our vocabulary."}, {"en": false, "h": "오늘날의 언어가 셰익스피어에게는 이해 불가능할 정도로 달라졌다는 5번과, 그가 우리 어휘의 5/9만 이해할 것이라는 7번을 종합하면, 언어의 변화가 셰익스피어조차 이해하기 어렵게 만들 정도라는 것이 제목의 핵심이다."}], "opts": [{"n": "①", "t": "Original Meanings of Words Fade with Time", "a": false, "x": true, "trap": true, "e": "단어의 원래 의미가 사라진다는 내용이 아니라 언어 전체의 변화를 다룬다."}, {"n": "②", "t": "Dictionary: A Gradual Continuation of the Past", "a": false, "x": true, "trap": false, "e": "사전은 과거의 점진적 연속이 아니라 새 단어의 등재를 보여줄 뿐이다."}, {"n": "③", "t": "Literature: The Driving Force Behind New Words", "a": false, "x": true, "trap": false, "e": "문학이 새 단어를 만든다는 내용은 없다."}, {"n": "④", "t": "How Can We Bridge the Ever-Widening Language Gap?", "a": false, "x": true, "trap": false, "e": "언어 격차를 메우는 방법에 관한 내용이 아니다."}, {"n": "⑤", "t": "Language Evolution Makes Even Shakespeare Semi-literate!", "a": true, "x": false, "trap": false, "e": "언어의 변화가 너무 커서 셰익스피어조차 절반 가까이 이해하지 못할 것이라는 5·7번의 내용과 정확히 일치한다."}], "w": [["emerge", "생기다, 나타나다"], ["supplement", "추가, 보충"], ["deplore", "한탄하다"], ["drift", "표류, 이동"], ["formalize", "공식화하다"], ["punctuation", "구두법"], ["virtually", "사실상"], ["unintelligible", "이해할 수 없는"], ["materialize", "나타나다"], ["vocabulary", "어휘"]]}, {"q": "03", "type": "함의추론", "src": "2020년 3월 21번", "ans": "②", "tr": [["1", "한번은 제가 아이들에게 완충장치(buffer)라는 개념을 설명하려고 한 적이 있었습니다."], ["2", "그때 우리는 함께 차 안에 있었고, 저는 게임을 이용해 그 개념을 설명하려고 했습니다."], ["3", "저는 우리가 3마일 떨어진 목적지까지 멈추지 않고 가야 한다고 상상해 보라고 말했습니다."], ["4", "우리는 우리 앞과 주변에서 무슨 일이 일어날지 예측할 수 없었습니다."], ["5", "우리는 신호등이 초록불로 얼마나 오래 있을지, 혹은 앞차가 갑자기 브레이크를 밟을지 알 수 없었습니다."], ["6", "충돌을 피하는 유일한 방법은 우리 차와 앞차 사이에 여분의 공간을 두는 것이었습니다."], ["7", "이 공간이 완충장치 역할을 합니다."], ["8", "그것은 우리에게 다른 차들의 갑작스러운 움직임에 반응하고 적응할 시간을 줍니다."], ["9", "마찬가지로, 우리는 그저 완충장치를 만듦으로써 우리의 일과 삶에서 꼭 필요한 일을 하는 데 생기는 마찰을 줄일 수 있습니다."]], "evh": "6·8번 문장", "ev": [{"en": true, "h": "The only way to keep from crashing was to put extra space between our car and the car in front of us. / It gives us time to respond and adapt to any sudden moves by other cars."}, {"en": false, "h": "앞차와의 사이에 여분의 공간을 두어 충돌을 막는다는 6번과, 그 공간이 갑작스러운 상황에 대응할 시간을 준다는 8번을 종합하면, creating a buffer는 예상치 못한 일에 대비해 여유를 미리 마련해 두는 것을 의미한다."}], "opts": [{"n": "①", "t": "knowing that learning is more important than winning", "a": false, "x": true, "trap": false, "e": "배움과 승리의 비교에 관한 내용이 아니다."}, {"n": "②", "t": "always being prepared for unexpec     const i=+b.dataset.i,p=b.dataset.p;

    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
