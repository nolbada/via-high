<title>고2 미니모의고사 22회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}

.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}

.cell.bad{background:var(--badbg);border-color:var(--bad)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}

.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}

.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}

.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}

.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}

/* ---- 새 직독직해·해설 화면 ---- */

details.sub2{margin:12px 0 0}

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>It's time to</b>(이제 ~할 때다)처럼 <b>명령문과 같은 힘을 가진 표현</b>에 있어요. 1~4번은 어린 시절 놀이를 떠올리게 하는 준비이고, 반복되는 <b>imagination</b>(상상력)을 지금 생활로 가져오라는 게 핵심이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 명령문으로 시작</span><div class=\"en\"><mark>Think back</mark> to when you were a kid.</div><p class=\"ko\">당신이 어린아이였을 때를 <mark>회상해 보라</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>어린 시절 놀이 = 상상력, 그 상상력이 주는 감정을 정리해요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 상상력의 좋은 점</span><div class=\"en\"><mark>Being imaginative</mark> gives us feelings of happiness and adds excitement to our lives.</div><p class=\"ko\"><mark>상상력이 풍부한 것은</mark> 우리에게 행복감을 주고 우리의 삶에 흥분을 더해 준다.</p></div><div class=\"ck-via\"><i>▼</i><span>It's time to(이제 ~할 때다) = 필자가 하라고 권하는 말</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\"><mark>It's time</mark> to get back to those emotions.</div><p class=\"ko\"><mark>이제</mark> 그런 감정들(= 행복감, 흥분 같은 감정들)로 다시 돌아갈 <mark>때이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7번</em>상상력으로 책을 쓰거나 무언가를 발명하기</span><span><em>8번</em>상상 속으로 들어가면 창의력에 끝이 없음</span><span><em>9번</em>상상력이 일상의 일을 흥미롭게 해서 집중하게 해 줌</span></div><div class=\"ck-eq\">⇒ 세 문장의 공통점 = 어른이 된 지금 생활 속에서도 상상력을 쓰라는 이유</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">어린 시절처럼 생활 속에서 상상력을 발휘하라.<small>5번 get back to(~로 돌아가다) + 9번 everyday tasks(일상적인 일)를 한 줄로 묶은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">아이들이 상상력을 통해 스스로 문제를 해결하게 하라.</span><span class=\"why\">[지문에 없음] 1번 when you were a kid(당신이 어린아이였을 때)는 ‘당신’의 어린 시절이에요. 상상력을 쓸 사람은 아이들이 아니라 지금의 독자(you 당신)예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">다양한 취미 활동을 통해 경험의 폭을 넓혀라.</span><span class=\"why\">[지문에 없음] 여러 취미를 해 보라는 말은 없어요. 지문에서 계속 반복되는 건 취미가 아니라 imagination(상상력)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">생활 속에서 즐거움을 찾는 방법을 이웃과 나눠라.</span><span class=\"why\">[지문에 없음] 이웃과 나누라는 말은 한 번도 안 나와요. 6번도 자신에 대해(about yourself) 더 행복해진다고 할 뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">아이들의 눈높이에 맞추어 아이들의 행동을 이해하라.</span><span class=\"why\">[지문에 없음] 아이들을 이해하라는 글이 아니에요. 1~3번은 내가 어릴 때 어떻게 놀았는지 떠올리라는 질문이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Think back</div><div class=\"k\">회상해 보라</div></div><div class=\"rc\"><div class=\"e\">to when you were a kid.</div><div class=\"k\">당신이 어린아이였을 때를.</div></div><div class=\"rnat\">당신이 어린아이였을 때를 회상해 보라.</div><div class=\"rst\">어릴 때 놀이터에서 놀던 나를 떠올려 봐요. 지문도 <b>회상해 보라</b>(Think back)는 명령문으로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">How did you play?</div><div class=\"k\">당신은 어떻게 놀았는가?</div></div><div class=\"rnat\">당신은 어떻게 놀았는가?</div><div class=\"rst\">미끄럼틀을 우주선이라 하고, 모래를 밥이라며 놀았죠. 지문은 “어떻게 놀았나?” 하고 물어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">How did using your imagination</div><div class=\"k\">상상력을 이용하는 것이</div></div><div class=\"rc\"><div class=\"e\">make you feel?</div><div class=\"k\">당신에게 어떻게 느껴졌는가?</div></div><div class=\"rnat\">상상력을 이용하는 것이 어떻게 느껴졌는가?</div><div class=\"rst\">그렇게 상상하며 놀 때 기분이 어땠나요? 지문도 상상력을 쓰는 게 어떻게 느껴졌는지 물어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Being imaginative</span></div><div class=\"k\"><span class=\"cw\">상상력이 풍부한 것은</span></div></div><div class=\"rc\"><div class=\"e\">gives us feelings of happiness</div><div class=\"k\">우리에게 행복감을 주고</div></div><div class=\"rc\"><div class=\"e\">and adds excitement to our lives.</div><div class=\"k\">우리의 삶에 흥분을 더해 준다.</div></div><div class=\"rnat\">상상력이 풍부한 것은 우리에게 행복감을 주고 우리의 삶에 흥분을 더해 준다.</div><div class=\"rst\">그냥 신났고 행복했어요. = 지문의 “<b>상상력이 풍부한 것</b>은 행복감과 흥분을 준다”예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">It's time</span></div><div class=\"k\"><span class=\"cw\">이제 때이다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to get back to those emotions.</span></div><div class=\"k\">그런 감정들(= 행복감, 흥분 같은 감정들)로 <span class=\"cw\">다시 돌아갈.</span></div></div><div class=\"rnat\">이제 그런 감정들로 다시 돌아갈 때이다.</div><div class=\"rst\"><b>이제 그 신나는 기분으로 돌아갈 때</b>(It's time)예요. 필자가 진짜 하고 싶은 말이 바로 이 문장이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">If you can return</div><div class=\"k\">만약 당신이 돌아갈 수 있다면</div></div><div class=\"rc\"><div class=\"e\">to the joyful feelings</div><div class=\"k\">그 즐거운 감정들로</div></div><div class=\"rc\"><div class=\"e\">that you had through play,</div><div class=\"k\">당신이 놀이를 통해 느꼈던,</div></div><div class=\"rc\"><div class=\"e\">you'll find</div><div class=\"k\">당신은 알게 될 것이다</div></div><div class=\"rc\"><div class=\"e\">that you feel happier</div><div class=\"k\">당신이 더 행복감을 느낀다는 것을</div></div><div class=\"rc\"><div class=\"e\">about yourself.</div><div class=\"k\">자신에 대해.</div></div><div class=\"rnat\">당신이 놀이를 통해 느꼈던 즐거운 감정들로 돌아갈 수 있다면, 당신은 자신에 대해 더 행복감을 느낀다는 것을 알게 될 것이다.</div><div class=\"rst\">그 즐거움을 되찾으면 내 자신이 더 좋아져요. 지문도 놀이에서 느낀 기쁨으로 돌아가면 더 행복해진다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">You can use your imagination</div><div class=\"k\">당신은 당신의 상상력을 이용할 수 있다</div></div><div class=\"rc\"><div class=\"e\">to write books</div><div class=\"k\">책을 쓰기 위해</div></div><div class=\"rc\"><div class=\"e\">or invent something.</div><div class=\"k\">또는 무언가를 발명하기 위해.</div></div><div class=\"rnat\">당신은 책을 쓰거나 무언가를 발명하기 위해 상상력을 이용할 수 있다.</div><div class=\"rst\">상상력으로 나만의 웹툰을 그리거나 새 물건을 만들어 볼 수 있어요. = 지문의 책 쓰기, 발명하기예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">There is no end</div><div class=\"k\">끝이 없다</div></div><div class=\"rc\"><div class=\"e\">to how creative you can be</div><div class=\"k\">당신이 얼마나 창의적일 수 있는지에는</div></div><div class=\"rc\"><div class=\"e\">when you move into your imagination.</div><div class=\"k\">당신이 상상 속으로 들어갈 때.</div></div><div class=\"rnat\">당신이 상상 속으로 들어갈 때 당신이 얼마나 창의적일 수 있는지에는 끝이 없다.</div><div class=\"rst\">상상 속으로 들어가면 아이디어가 끝도 없이 나와요. 지문도 창의력에는 끝이 없다고 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">It will also keep you focused</div><div class=\"k\">그것(= 상상력)은 또한 당신이 계속 집중하도록 해 줄 것이다</div></div><div class=\"rc\"><div class=\"e\">on completing the tasks at hand</div><div class=\"k\">당면한 일을 끝내는 데</div></div><div class=\"rc\"><div class=\"e\">because imagination makes</div><div class=\"k\">상상력이 만들기 때문에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">everyday tasks more interesting.</span></div><div class=\"k\"><span class=\"cw\">일상적인 일을 더 흥미롭게.</span></div></div><div class=\"rnat\">상상력은 일상적인 일을 더 흥미롭게 만들어서 (그것은) 또한 당신이 당면한 일을 끝내는 데 계속 집중하도록 해 줄 것이다.</div><div class=\"rst\">지루한 방 청소도 “보물찾기”라고 상상하면 끝까지 해내요. 지문 말대로 상상력은 일상의 일을 흥미롭게 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"think back to\" data-m=\"~을 회상하다\"><b>think back to</b>~을 회상하다</button><button type=\"button\" class=\"wdb\" data-w=\"imaginative\" data-m=\"상상력이 풍부한\"><b>imaginative</b>상상력이 풍부한</button><button type=\"button\" class=\"wdb\" data-w=\"get back to\" data-m=\"~로 돌아가다\"><b>get back to</b>~로 돌아가다</button><button type=\"button\" class=\"wdb\" data-w=\"joyful\" data-m=\"즐거운\"><b>joyful</b>즐거운</button><button type=\"button\" class=\"wdb\" data-w=\"there is no end to\" data-m=\"~에는 끝이 없다\"><b>there is no end to</b>~에는 끝이 없다</button><button type=\"button\" class=\"wdb\" data-w=\"at hand\" data-m=\"당면한\"><b>at hand</b>당면한</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>질문 → 답</b>에서 나와요. 2번 “다 나쁜가?”에 3번 <b>Not at all</b>(전혀 그렇지 않다)로 답한 뒤, 4~7번이 <b>It has</b>(그것은 ~해 왔다)로 아웃소싱의 <b>좋은 점</b>을 줄줄이 늘어놓아요.</p><div class=\"ck-step\"><span class=\"lab\">2·3번 문장 · 방향 전환 신호</span><div class=\"en\"><mark>Not at all.</mark></div><p class=\"ko\"><mark>전혀 그렇지 않다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>“나쁘지 않다”는 답의 첫 번째 근거, 화제어 outsourcing(아웃소싱)이 등장해요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\"><mark>The outsourcing of much of the work of cooking</mark> to corporations <mark>has relieved women of</mark> what has traditionally been their exclusive responsibility for feeding the family</div><p class=\"ko\"><mark>요리하는 일의 많은 부분을 아웃소싱하는 것은</mark>(기업에게) 가족들을 먹이는, 전통적으로 여성들의 한정된 책임이었던 것에서 <mark>여성들을 해방시켰다</mark></p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>가정 내 갈등을 막아 줌</span><span><em>6번</em>집안의 다른 부담을 덜고 시간을 아껴 줌</span><span><em>7번</em>식단을 다양하게, 요리 못해도 색다른 요리를 즐김</span></div><div class=\"ck-eq\">⇒ It(그것) = 요리의 아웃소싱 → 전부 이득을 나열 = 주제는 ‘요리 외주화의 이득’</div></div><div class=\"ck-via\"><i>▼</i><span>also(또한)로 이득을 하나 더 보태요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 이득 하나 더</span><div class=\"en\">It has <mark>also allowed us</mark> to diversify our diets substantially</div><p class=\"ko\">그것(= 요리의 아웃소싱)은 <mark>또한</mark> 우리가 자신의 식단을 상당히 다양화하도록 <mark>해 주었다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">아웃소싱을 통해 줄어든 가정 요리 의무에서 오는 이득<small>4번 outsourcing(아웃소싱) + relieved(덜어 주었다)와 5~7번의 이득 나열을 한 줄로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">음식 서비스 산업 쇠퇴의 이면에 있는 이유</span><span class=\"why\">[반대] 1번의 decline(감소)은 음식 산업이 아니라 ‘집에서 하는 요리’가 줄었다는 말이에요. 오히려 기업(corporations)이 요리를 맡아 주는 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">상업용 조리 기구의 현재 경향</span><span class=\"why\">[범위 좁음] 8번에 microwave(전자레인지)가 나오지만 이득을 마무리하는 한 마디일 뿐, 조리 기구의 유행을 다루지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">식사 양식 변화의 환경적 영향</span><span class=\"why\">[지문에 없음] 환경 이야기는 한 번도 안 나와요. 5~7번은 가정과 사람들에게 주는 이득이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">집에서 건강한 식사를 요리하기 위한 비용 효율적 방법</span><span class=\"why\">[반대] 지문은 집에서 요리하는 법이 아니라 요리를 밖에 맡겨서(outsourcing 아웃소싱) 생긴 좋은 점을 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">If cooking is as central</div><div class=\"k\">만약 요리가 중요하다면</div></div><div class=\"rc\"><div class=\"e\">to human identity, biology, and culture</div><div class=\"k\">인간의 정체성, 생물학, 그리고 문화에</div></div><div class=\"rc\"><div class=\"e\">as the biological anthropologist Richard Wrangham suggests,</div><div class=\"k\">생물인류학자 Richard Wrangham이 말하는 만큼,</div></div><div class=\"rc\"><div class=\"e\">it stands to reason</div><div class=\"k\">당연하다</div></div><div class=\"rc\"><div class=\"e\">that the decline of cooking in our time</div><div class=\"k\">우리 시대에서의 요리 감소가</div></div><div class=\"rc\"><div class=\"e\">would have serious consequences</div><div class=\"k\">심각한 결과를 초래할 것임은</div></div><div class=\"rc\"><div class=\"e\">for modern life,</div><div class=\"k\">현대 생활에,</div></div><div class=\"rc\"><div class=\"e\">and so it has.</div><div class=\"k\">그리고 실제로 그랬다.</div></div><div class=\"rnat\">생물인류학자 Richard Wrangham이 말하는 만큼 요리가 인간의 정체성, 생물학, 그리고 문화에 중요하다면, 우리 시대에서의 요리 감소가 현대 생활에 심각한 결과를 초래할 것임은 당연하고, 실제로 그랬다.</div><div class=\"rst\">요즘 우리 집은 직접 요리하는 날이 줄었어요. 지문도 요리가 줄어든(decline 감소) 게 생활에 큰 결과를 가져왔다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Are they all bad?</div><div class=\"k\">그것들(= 요리 감소가 가져온 결과들)이 모두 나쁜가?</div></div><div class=\"rnat\">그것들이 모두 나쁜가?</div><div class=\"rst\">집에서 밥 대신 반찬가게 반찬을 사 오면, 그게 다 나쁜 걸까요? 지문도 “그 결과가 모두 나쁜가?” 하고 물어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Not at all.</span></div><div class=\"k\"><span class=\"cw\">전혀 그렇지 않다.</span></div></div><div class=\"rnat\">전혀 그렇지 않다.</div><div class=\"rst\"><b>전혀 아니에요</b>(Not at all). 지문 3번의 이 답에서 글의 방향이 ‘좋은 점’ 쪽으로 확 꺾여요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The outsourcing of much of the work of cooking</span></div><div class=\"k\"><span class=\"cw\">요리하는 일의 많은 부분을 아웃소싱하는 것은</span></div></div><div class=\"rc\"><div class=\"e\">to corporations</div><div class=\"k\">기업에게</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">has relieved women of</span></div><div class=\"k\"><span class=\"cw\">여성들을 해방시켰다,</span></div></div><div class=\"rc\"><div class=\"e\">what has traditionally been their exclusive responsibility</div><div class=\"k\">전통적으로 여성들의 한정된 책임이었던 것에서</div></div><div class=\"rc\"><div class=\"e\">for feeding the family,</div><div class=\"k\">가족들을 먹이는,</div></div><div class=\"rc\"><div class=\"e\">making it easier for them</div><div class=\"k\">그들(= 여성들)에게 더 쉽도록</div></div><div class=\"rc\"><div class=\"e\">to work outside the home and have careers.</div><div class=\"k\">집 밖에서 일하고 직업을 가지는 것이.</div></div><div class=\"rnat\">요리하는 일의 많은 부분을 기업에게 아웃소싱하는 것은 전통적으로 여성들의 한정된, 가족들을 먹이는 책임이었던 것에서 여성들을 해방시켰으며 그들이 집 밖에서 일하고 직업을 가지는 것을 더 쉽게 했다.</div><div class=\"rst\">음식을 가게에 맡기니 매일 밥 차리던 어른이 그 일에서 풀려나 회사 일도 해요. = 지문의 <b>아웃소싱</b>(outsourcing)이 여성들을 해방시켰다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It has headed off</div><div class=\"k\">그것(= 요리의 아웃소싱)은 막아 주었다</div></div><div class=\"rc\"><div class=\"e\">many of the domestic conflicts</div><div class=\"k\">많은 가정 내 갈등을</div></div><div class=\"rc\"><div class=\"e\">that such a large shift</div><div class=\"k\">그렇게 큰 변화가</div></div><div class=\"rc\"><div class=\"e\">in gender roles and family dynamics</div><div class=\"k\">성 역할과 가족 역학에서의</div></div><div class=\"rc\"><div class=\"e\">was bound to spark.</div><div class=\"k\">틀림없이 촉발했을.</div></div><div class=\"rnat\">그것은 성 역할과 가족 역학에서의 그렇게 큰 변화가 틀림없이 촉발하였을 많은 가정 내 갈등을 막아 주었다.</div><div class=\"rst\">“오늘 밥 누가 해?” 하며 다투는 일도 줄었어요. 지문도 아웃소싱이 가정 내 갈등을 막아 주었다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">It has relieved</div><div class=\"k\">그것(= 요리의 아웃소싱)은 덜어 주었다</div></div><div class=\"rc\"><div class=\"e\">other pressures in the household,</div><div class=\"k\">가정의 다른 고난들을,</div></div><div class=\"rc\"><div class=\"e\">including longer workdays and overscheduled children,</div><div class=\"k\">더 긴 근무일과 바쁜 자녀들을 포함하여,</div></div><div class=\"rc\"><div class=\"e\">and saved us time</div><div class=\"k\">그리고 우리에게 시간을 절약해 주었다</div></div><div class=\"rc\"><div class=\"e\">that we can now invest</div><div class=\"k\">우리가 이제 투자할 수 있는</div></div><div class=\"rc\"><div class=\"e\">in other pursuits.</div><div class=\"k\">다른 일에.</div></div><div class=\"rnat\">그것은 더 긴 근무일과 바쁜 자녀들을 포함하여 가정의 다른 고난을 덜어 주었으며, 이제 우리가 다른 일에 투자할 수 있는 시간을 절약해 주었다.</div><div class=\"rst\">늦게 퇴근하는 가족도, 학원 가는 나도 덜 바빠지고 시간이 생겨요. = 지문의 다른 부담을 덜고 시간을 아껴 줬다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">It has also allowed us</span></div><div class=\"k\">그것(= 요리의 아웃소싱)은 <span class=\"cw\">또한 우리가 ~하도록 해 주었다</span></div></div><div class=\"rc\"><div class=\"e\">to diversify our diets substantially,</div><div class=\"k\">자신의 식단을 상당히 다양화하도록,</div></div><div class=\"rc\"><div class=\"e\">making it possible</div><div class=\"k\">그리고 ~을 가능하게 만들었다</div></div><div class=\"rc\"><div class=\"e\">even for people with no cooking skills and little money</div><div class=\"k\">요리 기술이 없고 돈이 거의 없는 사람들조차</div></div><div class=\"rc\"><div class=\"e\">to enjoy a whole different cuisine.</div><div class=\"k\">완전히 색다른 요리를 즐기는 것을.</div></div><div class=\"rnat\">그것은 또한 우리가 자신의 식단을 상당히 다양화하도록 해 주었으며, 요리 기술이 없고 돈이 거의 없는 사람들조차 완전히 색다른 요리를 즐기는 것을 가능하게 만들었다.</div><div class=\"rst\">요리를 못하는 나도 오늘은 쌀국수, 내일은 타코를 먹어요. = 지문의 식단을 다양하게 해 줬다는 말이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">All that's required</div><div class=\"k\">필요한 모든 것은</div></div><div class=\"rc\"><div class=\"e\">is a microwave.</div><div class=\"k\">전자레인지 하나뿐이다.</div></div><div class=\"rnat\">필요한 것은 전자레인지뿐이다.</div><div class=\"rst\">필요한 건 전자레인지 하나뿐이에요. 지문도 이 한 줄로 아웃소싱의 이득 이야기를 마무리해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"it stands to reason\" data-m=\"~은 당연하다\"><b>it stands to reason</b>~은 당연하다</button><button type=\"button\" class=\"wdb\" data-w=\"outsourcing\" data-m=\"아웃소싱, 외부 위탁\"><b>outsourcing</b>아웃소싱, 외부 위탁</button><button type=\"button\" class=\"wdb\" data-w=\"relieve A of B\" data-m=\"A에게서 B를 덜어 주다\"><b>relieve A of B</b>A에게서 B를 덜어 주다</button><button type=\"button\" class=\"wdb\" data-w=\"head off\" data-m=\"~을 막다\"><b>head off</b>~을 막다</button><button type=\"button\" class=\"wdb\" data-w=\"diversify\" data-m=\"다양화하다\"><b>diversify</b>다양화하다</button><button type=\"button\" class=\"wdb\" data-w=\"cuisine\" data-m=\"요리\"><b>cuisine</b>요리</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 문장은 <b>not A but B</b>(A가 아니라 B) 구조예요. A가 <b>머리(지성)의 한계</b>이니, B는 그 반대편인 <b>재료(공급량)</b> 쪽이에요. 6번과 10번이 같은 말을 되풀이해요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">The future of our high-tech goods may lie <mark>not in the limitations of our minds</mark>, but in <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">첨단 기술 제품의 미래는 <mark>우리 지성의 한계</mark>가 아니라 ( ? )에 달려 있을지도 모른다</p></div><div class=\"ck-via\"><i>▼</i><span>지성(ingenuity 창의력)은 넘치는데, 따라가지 못하는 쪽은 재료라고 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">Our ingenuity will soon <mark>outpace</mark> <mark>our material supplies</mark>.</div><p class=\"ko\">우리의 창의력은 곧 <mark>우리의 자재 공급량을</mark> <mark>앞지를 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>But(그러나)으로 마지막에 결론: 공급을 늘려야(확보해야) 기술이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 문장 · 한 번 더 확인</span><div class=\"en\">But <mark>without increasing</mark> <mark>today's limited supplies</mark>, we have no chance of developing the alternative green technologies …</div><p class=\"ko\">그러나 <mark>오늘날의 제한된 공급량을</mark> <mark>늘리지 않는다면</mark>, 우리는 … 친환경 대체 기술들을 개발할 가망이 없다</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">그것들을 생산할 재료를 확보하는 우리의 능력<small>6번 material supplies(자재 공급량), 10번 increasing supplies(공급량 늘리기)를 그대로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">그것들을 최대한 친환경적으로 만들려는 우리의 노력</span><span class=\"why\">8번 green technologies(친환경 기술)에 끌린 함정이에요. 10번은 친환경 기술도 재료 공급을 늘려야 만들 수 있다고 해서, 핵심은 친환경이 아니라 재료예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">혁신적 기술의 더 넓은 보급</span><span class=\"why\">기술을 퍼뜨리는 이야기는 없어요. 6번은 기술을 만드는 머리는 충분하고 모자란 건 재료라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">자원 공급을 제한하지 않으려는 정부 정책</span><span class=\"why\">정부(정책)는 지문에 한 번도 안 나와요. 10번 limited supplies(제한된 공급량)는 정책 때문이 아니라 재료 자체가 모자란다는 뜻이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">기능의 지속적인 업데이트와 개선</span><span class=\"why\">기능을 개선하는 건 ‘머리(지성)’ 쪽 일이에요. 1번은 미래가 머리 쪽(minds 지성)에 있지 않다고 했으니 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The future of our high-tech goods</div><div class=\"k\">우리의 첨단 기술 제품들의 미래는</div></div><div class=\"rc\"><div class=\"e\">may lie</div><div class=\"k\">달려있을지도 모른다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">not in the limitations of our minds,</span></div><div class=\"k\"><span class=\"cw\">우리 지성의 한계에 있는 것이 아니라,</span></div></div><div class=\"rc\"><div class=\"e\">but in ______.</div><div class=\"k\">오히려 (빈칸) 그것들을 생산하기 위한 재료들을 확보하는 우리의 능력에.</div></div><div class=\"rnat\">우리의 첨단 기술 제품들의 미래는 우리 지성의 한계가 아니라, 오히려 ______에 달려있을지도 모른다.</div><div class=\"rst\">레고로 멋진 성을 짓고 싶어요. 지문은 문제는 내 <b>아이디어가 아니라</b>(not in) ( ? )에 있다고 말해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In previous eras,</div><div class=\"k\">이전의 시대에서,</div></div><div class=\"rc\"><div class=\"e\">such as the Iron Age and the Bronze Age,</div><div class=\"k\">철기 시대와 청동기 시대 같은,</div></div><div class=\"rc\"><div class=\"e\">the discovery of new elements</div><div class=\"k\">새로운 원소의 발견은</div></div><div class=\"rc\"><div class=\"e\">brought forth</div><div class=\"k\">낳았다</div></div><div class=\"rc\"><div class=\"e\">seemingly unending numbers of new inventions.</div><div class=\"k\">겉보기에 끝이 없는 듯한 무수한 새로운 발명들을.</div></div><div class=\"rnat\">철기 시대와 청동기 시대 같은 이전의 시대에서, 새로운 원소의 발견은 겉보기에 끝이 없는 듯한 무수한 새로운 발명들을 낳았다.</div><div class=\"rst\">예전엔 새 블록 종류가 나올 때마다 새 작품이 끝없이 쏟아졌어요. = 지문의 새 원소 발견이 새 발명을 낳았다예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Now</div><div class=\"k\">이제</div></div><div class=\"rc\"><div class=\"e\">the combinations</div><div class=\"k\">그 조합은</div></div><div class=\"rc\"><div class=\"e\">may truly be unending.</div><div class=\"k\">정말로 끝이 없을지도 모른다.</div></div><div class=\"rnat\">이제 그 조합은 정말로 끝이 없을지도 모른다.</div><div class=\"rst\">이제는 블록을 섞는 방법이 정말 끝이 없어요. 지문도 그 조합이 끝이 없을지 모른다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">We are now witnessing</div><div class=\"k\">우리는 현재 목격하고 있다</div></div><div class=\"rc\"><div class=\"e\">a fundamental shift</div><div class=\"k\">근본적인 변화를</div></div><div class=\"rc\"><div class=\"e\">in our resource demands.</div><div class=\"k\">우리의 자원 수요에 있어서.</div></div><div class=\"rnat\">우리는 현재 (우리의) 자원 수요에 있어서 근본적인 변화를 목격하고 있다.</div><div class=\"rst\">그래서 필요한 블록 종류가 확 바뀌고 있어요. = 지문의 자원 수요에 근본적인 변화가 생겼다예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">At no point in human history</div><div class=\"k\">인류 역사의 그 어떤 지점에서도</div></div><div class=\"rc\"><div class=\"e\">have we used more elements,</div><div class=\"k\">우리는 '더 많은' 원소를 사용한 적이 없다,</div></div><div class=\"rc\"><div class=\"e\">in more combinations,</div><div class=\"k\">'더 많은' 조합으로,</div></div><div class=\"rc\"><div class=\"e\">and in increasingly refined amounts.</div><div class=\"k\">그리고 점점 더 정밀한 양으로.</div></div><div class=\"rnat\">인류 역사의 그 어떤 지점에서도, 우리는 (현재보다) '더 많은' 조합으로, 그리고 점점 더 정밀한 양으로 '더 많은' 원소를 사용한 적이 없다.</div><div class=\"rst\">지금처럼 많은 종류의 블록을, 이렇게 정밀하게 쓴 적은 없어요. 지문도 원소를 이렇게 많이 쓴 적이 없다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Our ingenuity</div><div class=\"k\">우리의 창의력은</div></div><div class=\"rc ckc\"><div class=\"e\">will soon <span class=\"cw\">outpace</span></div><div class=\"k\">곧 <span class=\"cw\">앞지를 것이다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">our material supplies.</span></div><div class=\"k\"><span class=\"cw\">우리의 자재 공급량을.</span></div></div><div class=\"rnat\">우리의 창의력은 곧 우리의 자재 공급량을 앞지를 것이다.</div><div class=\"rst\">그런데 내 아이디어가 곧 <b>가진 블록 수를 앞질러</b>(outpace 앞지르다) 버려요. 지문도 창의력이 자재 공급량을 앞지른다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">This situation</div><div class=\"k\">이러한 상황은</div></div><div class=\"rc\"><div class=\"e\">comes at a defining moment</div><div class=\"k\">결정적인 순간에 온다</div></div><div class=\"rc\"><div class=\"e\">when the world is struggling</div><div class=\"k\">세계가 애쓰고 있는</div></div><div class=\"rc\"><div class=\"e\">to reduce its reliance on fossil fuels.</div><div class=\"k\">화석 연료에 대한 의존을 줄이기 위해.</div></div><div class=\"rnat\">이러한 상황은 세계가 화석 연료에 대한 의존을 줄이기 위해 애쓰고 있는 결정적인 순간에 온다.</div><div class=\"rst\">하필 지금은 오래된 블록을 줄이고 새 판으로 바꾸려는 중요한 때예요. = 지문의 화석 연료 의존을 줄이려는 순간이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Fortunately,</div><div class=\"k\">다행히,</div></div><div class=\"rc\"><div class=\"e\">rare metals are key ingredients</div><div class=\"k\">희귀 금속들은 핵심 재료이다</div></div><div class=\"rc\"><div class=\"e\">in green technologies</div><div class=\"k\">친환경 기술에 있어</div></div><div class=\"rc\"><div class=\"e\">such as electric cars, wind turbines, and solar panels.</div><div class=\"k\">전기 자동차, 풍력 발전기, 그리고 태양광 패널과 같은.</div></div><div class=\"rnat\">다행히, 희귀 금속들은 전기 자동차, 풍력 발전기, 그리고 태양광 패널과 같은 친환경 기술에 있어 핵심 재료이다.</div><div class=\"rst\">다행히 귀한 특수 블록이 새 판의 핵심 부품이에요. 지문도 희귀 금속이 친환경 기술의 핵심 재료라고 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">They help</div><div class=\"k\">그것들은 돕는다</div></div><div class=\"rc\"><div class=\"e\">to convert free natural resources</div><div class=\"k\">무료 천연 자원을 전환시키는 것을</div></div><div class=\"rc\"><div class=\"e\">like the sun and wind</div><div class=\"k\">태양과 바람 같은</div></div><div class=\"rc\"><div class=\"e\">into the power</div><div class=\"k\">동력으로</div></div><div class=\"rc\"><div class=\"e\">that fuels our lives.</div><div class=\"k\">우리의 생활에 연료를 공급하는.</div></div><div class=\"rnat\">그것들은 태양과 바람 같은 무료 천연 자원을 우리의 생활에 연료를 공급하는 동력으로 전환시키는 것을 돕는다.</div><div class=\"rst\">그 블록이 있어야 바람개비·태양판 모형이 진짜로 돌아가요. 지문의 태양과 바람을 동력으로 바꿔 준다예요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">But <span class=\"cw\">without increasing</span></div><div class=\"k\">그러나 <span class=\"cw\">늘리지 않는다면</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">today's limited supplies,</span></div><div class=\"k\"><span class=\"cw\">오늘날의 제한된 공급량을,</span></div></div><div class=\"rc\"><div class=\"e\">we have no chance</div><div class=\"k\">우리는 가망이 없다</div></div><div class=\"rc\"><div class=\"e\">of developing</div><div class=\"k\">개발할</div></div><div class=\"rc\"><div class=\"e\">the alternative green technologies</div><div class=\"k\">친환경 대체 기술들을</div></div><div class=\"rc\"><div class=\"e\">we need to slow climate change.</div><div class=\"k\">기후 변화를 늦추기 위해서 우리가 필요로 하는.</div></div><div class=\"rnat\">그러나 오늘날의 제한된 공급량을 늘리지 않는다면, 우리는 기후 변화를 늦추기 위해서 우리가 필요로 하는 친환경 대체 기술들을 개발할 가망이 없다.</div><div class=\"rst\"><b>그 블록을 더 구하지 못하면</b>(without increasing) 새 판은 못 만들어요. 그래서 빈칸은 ‘재료를 확보하는 능력’이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"bring forth\" data-m=\"낳다, 만들어 내다\"><b>bring forth</b>낳다, 만들어 내다</button><button type=\"button\" class=\"wdb\" data-w=\"limitation\" data-m=\"한계\"><b>limitation</b>한계</button><button type=\"button\" class=\"wdb\" data-w=\"ingenuity\" data-m=\"창의력\"><b>ingenuity</b>창의력</button><button type=\"button\" class=\"wdb\" data-w=\"outpace\" data-m=\"앞지르다\"><b>outpace</b>앞지르다</button><button type=\"button\" class=\"wdb\" data-w=\"reliance on\" data-m=\"~에 대한 의존\"><b>reliance on</b>~에 대한 의존</button><button type=\"button\" class=\"wdb\" data-w=\"rare metal\" data-m=\"희귀 금속\"><b>rare metal</b>희귀 금속</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 앞에 <b>이미 동사가 있는지</b>부터 세어 보세요. 5번은 which involves(포함한다)가 이미 동사라서, 명사 wire(전선)를 꾸미는 자리에는 <b>분사</b>만 올 수 있어요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (5번)</span><div class=\"en\">… which involves pulling an electric wire <u>④ attaches</u> to a portable generator through a river.</div><p class=\"ko\">포함한다(동사) + 당기는 것 + 전선을 + ( ? ) 휴대용 발전기에 — 동사가 또 올 자리가 없어요</p></div><div class=\"ck-via\"><i>▼</i><span>which(그런데 이 방법은) 절의 동사는 involves(포함한다) 하나로 이미 끝났어요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 동사 세기</span><div class=\"en\">which <mark>involves</mark> pulling an electric wire</div><p class=\"ko\">이 방법(= 전류 어로법)은 전선을 당기는 일을 <mark>포함한다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>전선은 스스로 붙는 게 아니라 ‘붙여진’ 것 → 수동 과거분사 attached(부착된)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">an electric wire <mark>attached to a portable generator</mark></div><p class=\"ko\"><mark>휴대용 발전기에 부착된</mark> 전선을</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">동사 자리와 분사 자리 구별: 한 절에 동사는 하나</p><p class=\"gr\">한 절(주어+동사)에는 동사가 하나만 와요. 동사가 이미 있으면 명사 뒤에서 꾸미는 말은 분사로 써요. 명사가 직접 하면 -ing(~하는), 당하면 p.p.(~된)예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a bag made in Korea.</div><div class=\"ko\">나는 한국에서 만들어진 가방이 있다. (동사 have가 이미 있고 가방은 ‘만들어진’ 것이라 made가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a bag makes in Korea.</div><div class=\"ko\">동사 have가 있는데 makes(만든다)라는 동사를 또 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Look at the boy running fast.</div><div class=\"ko\">빨리 달리는 소년을 봐. (소년이 직접 달리니 running이 맞아요)</div></div><p class=\"gb\">지문 5번도 which(이 방법은) 절에 동사 involves(포함한다)가 이미 있어요. 그래서 wire(전선)를 꾸미는 자리는 동사 attaches(붙인다)가 아니라, 전선이 ‘붙여진’ 것이니 attached(부착된)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">attaches → attached (부착된)<small>동사 involves(포함한다)가 이미 있으니, wire(전선)를 꾸미는 과거분사 attached(부착된)가 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">is ~이다</span><span class=\"why\">1번의 주어는 The old-fashioned method(예전 방법)이고, which fish samplers use(물고기 견본 담당자들이 사용하는)는 주어를 꾸미는 관계절이에요. 진짜 주어 method(방법)가 단수라서 is(~이다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수일치: 관계절이 끼어도 진짜 주어에 맞춰요</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The book which my friends like is funny.</div><div class=\"ko\">내 친구들이 좋아하는 그 책은 재미있다. (진짜 주어 book 책이 단수라서 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The book which my friends like are funny.</div><div class=\"ko\">바로 앞 friends(친구들)에 속아 are를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The boys who live next door are kind.</div><div class=\"ko\">옆집에 사는 소년들은 친절하다. (진짜 주어 boys 소년들이 복수라서 are가 맞아요)</div></div><p class=\"gb\">지문 1번도 samplers(담당자들)가 아니라 The old-fashioned method(예전 방법)가 주어라서 단수 is(~이다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">captive 포획된, 갇힌</span><span class=\"why\">2번은 holding it captive(그것을 포획한 상태로 놔두는 것)예요. hold(~한 상태로 두다) + 목적어 it(그것 = 물고기) 뒤에는 물고기가 ‘어떤 상태인지’ 말하는 보어가 와야 해서 형용사 captive(갇힌)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">hold(~한 상태로 두다)·keep(유지하다) + 목적어 + 형용사 보어</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Keep the door open.</div><div class=\"ko\">문을 열린 채로 둬라. (open 열린 = 형용사가 문의 상태를 말해서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Keep the door openly.</div><div class=\"ko\">openly(공개적으로)는 부사라 문의 상태를 말할 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Please keep your room clean.</div><div class=\"ko\">방을 깨끗하게 유지해 주세요. (clean 깨끗한 = 형용사 보어라서 맞아요)</div></div><p class=\"gb\">지문 2번도 물고기(it)를 ‘갇힌’ 상태로 두는 것이라 형용사 captive(갇힌)가 보어로 딱 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">its 그것의</span><span class=\"why\">4번 to continue its journey(그것의 여정을 지속하도록)에서 여정의 주인은 앞의 the fish(그 물고기) 한 마리예요. 단수 명사를 가리키니 단수 소유격 its(그것의)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">대명사 수일치: 가리키는 명사가 단수면 its(그것의), 복수면 their(그것들의)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The dog wagged its tail.</div><div class=\"ko\">그 개는 (그것의) 꼬리를 흔들었다. (dog 개 한 마리라서 its가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The dog wagged their tail.</div><div class=\"ko\">개는 한 마리인데 복수 their(그들의)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The birds built their nests.</div><div class=\"ko\">새들이 (그들의) 둥지를 지었다. (birds 새들이 복수라서 their가 맞아요)</div></div><p class=\"gb\">지문 4번도 the fish gets tagged(그 물고기는 꼬리표가 붙여진다)처럼 단수 동사 gets(~되다)를 쓴 한 마리라서 its(그것의)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">weighing 무게를 다는 것</span><span class=\"why\">6번 for measuring and weighing(길이를 재고 무게를 달기 위해)에서 전치사 for(~을 위해) 뒤에는 동명사가 와요. and(그리고)로 앞의 measuring(재는 것)과 나란히 이어지니 weighing(무게를 다는 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">전치사 뒤 동명사 + and(그리고) 병렬: 같은 모양으로 맞추기</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She is good at singing and dancing.</div><div class=\"ko\">그녀는 노래하는 것과 춤추는 것을 잘한다. (at 뒤 singing, dancing이 같은 -ing라서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She is good at singing and dance.</div><div class=\"ko\">and 뒤에 dance(춤추다)만 써서 앞의 singing과 모양이 안 맞아 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Thanks for helping me.</div><div class=\"ko\">나를 도와줘서 고마워. (for 뒤에 동명사 helping 돕는 것이 와서 맞아요)</div></div><p class=\"gb\">지문 6번도 for(~을 위해) 뒤에서 measuring(재는 것)과 and(그리고)로 이어지니 weighing(무게를 다는 것)이 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The old-fashioned method</div><div class=\"k\">예전 방법은</div></div><div class=\"rc\"><div class=\"e\">which fish samplers use</div><div class=\"k\">물고기 견본 담당자(sampler)들이 사용하는</div></div><div class=\"rc\"><div class=\"e\">is to watch fish near a dam</div><div class=\"k\">댐 근처에서 물고기를 보고</div></div><div class=\"rc\"><div class=\"e\">and push a button</div><div class=\"k\">버튼을 누르는 것이다</div></div><div class=\"rc\"><div class=\"e\">each time a fish swims up the ladder.</div><div class=\"k\">물고기가 수로 위로 뛰어오를 때마다.</div></div><div class=\"rnat\">Fish sampler(물고기 견본 담당자)들이 사용하는 예전 방법은 댐 근처에서 물고기를 보고 물고기가 수로 위로 뛰어오를 때마다 버튼을 누르는 것이다.</div><div class=\"rst\">물고기 조사원의 옛 방법은 댐 옆에서 지켜보다 물고기가 올라갈 때마다 버튼을 누르는 거예요. 주어 method(방법)가 단수라 is(~이다)예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">They also get to measure a fish occasionally,</div><div class=\"k\">그들(= sampler들)은 또한 종종 물고기를 측정하게 되는데</div></div><div class=\"rc\"><div class=\"e\">which involves capturing the fish</div><div class=\"k\">이 작업(= 물고기를 측정하는 일)은 물고기를 잡아두는 것을 포함한다</div></div><div class=\"rc\"><div class=\"e\">in a tank</div><div class=\"k\">탱크 안에</div></div><div class=\"rc\"><div class=\"e\">that has had the oxygen sucked out of it</div><div class=\"k\">그것(= 탱크)에서 산소가 제거된</div></div><div class=\"rc\"><div class=\"e\">and holding it captive</div><div class=\"k\">그리고 그것(= 물고기)을 포획한 상태로 놔두는 것을</div></div><div class=\"rc\"><div class=\"e\">until it stops moving.</div><div class=\"k\">그것(= 물고기)이 움직임을 멈출 때까지.</div></div><div class=\"rnat\">또한 그들은 종종 물고기를 측정하게 되는데 이 작업은 산소가 제거된 탱크 안에 물고기를 잡아두고 물고기가 움직임을 멈출 때까지 포획한 상태로 놔두는 것을 포함한다.</div><div class=\"rst\">가끔은 물고기를 탱크에 잡아 두고 멈출 때까지 가둬 둬요. holding it captive(그것을 갇힌 상태로 두기)에서 captive(갇힌)는 상태를 말하는 형용사예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Once it's still,</div><div class=\"k\">일단 그것(= 물고기)이 잠잠해지면,</div></div><div class=\"rc\"><div class=\"e\">they can put a tape measure to it</div><div class=\"k\">그들(= sampler들)은 그것(= 물고기)에 줄자를 댈 수 있다</div></div><div class=\"rc\"><div class=\"e\">before returning it</div><div class=\"k\">그것(= 물고기)을 되돌려 놓기 전에</div></div><div class=\"rc\"><div class=\"e\">to a recuperation tank.</div><div class=\"k\">회복 탱크에.</div></div><div class=\"rnat\">일단 물고기가 잠잠해지면, 그들은 회복 탱크에 물고기를 되돌려 놓기 전에 물고기의 길이를 줄자로 측정한다.</div><div class=\"rst\">물고기가 잠잠해지면 줄자로 길이를 재고 회복 탱크에 다시 넣어요. = 지문 3번, 측정한 뒤 회복 탱크로 돌려보낸다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Finally</div><div class=\"k\">마지막으로</div></div><div class=\"rc\"><div class=\"e\">the fish gets tagged</div><div class=\"k\">그 물고기는 꼬리표가 붙여져서</div></div><div class=\"rc\"><div class=\"e\">and released back onto the ladder</div><div class=\"k\">수로 위로 다시 풀려나게 된다</div></div><div class=\"rc\"><div class=\"e\">to continue its journey.</div><div class=\"k\">그것(= 물고기)의 여정을 지속할 수 있도록.</div></div><div class=\"rnat\">마지막으로 그 물고기는 꼬리표가 붙여져서 그것의 여정을 지속할 수 있도록 수로 위로 다시 풀려나게 된다.</div><div class=\"rst\">마지막에 꼬리표를 달아 다시 풀어 줘요. 물고기 한 마리의 여정이라 its(그것의) journey(여정)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">More and more samplers</div><div class=\"k\">점점 더 많은 sampler들이</div></div><div class=\"rc\"><div class=\"e\">are using electrofishing,</div><div class=\"k\">전류 어로법을 사용하고 있는데,</div></div><div class=\"rc ckc\"><div class=\"e\">which <span class=\"cw\">involves</span> pulling</div><div class=\"k\">이 방법(= 전류 어로법)은 당기는 일을 <span class=\"cw\">포함한다</span></div></div><div class=\"rc\"><div class=\"e\">an electric wire</div><div class=\"k\">전선을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">attached to a portable generator</span></div><div class=\"k\"><span class=\"cw\">휴대용 발전기에 부착된</span> ※ 문제지엔 attaches로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">through a river.</div><div class=\"k\">강을 가로질러서.</div></div><div class=\"rnat\">점점 더 많은 sampler들이 전류 어로법을 사용하고 있는데, 이 방법은 강을 가로질러서 휴대용 발전기에 부착된 전선을 당기는 일을 포함한다.</div><div class=\"rst\">요즘은 발전기에 <b>연결된</b> 전선을 강에 끌고 가는 전류 어로법을 써요. 동사 involves(포함한다)가 있으니 꾸미는 말은 attached(부착된)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The fish are stunned</div><div class=\"k\">물고기들은 기절해서</div></div><div class=\"rc\"><div class=\"e\">and almost magically drawn to the wire,</div><div class=\"k\">거의 마법처럼 전선으로 끌려오고,</div></div><div class=\"rc\"><div class=\"e\">at which point</div><div class=\"k\">그 순간</div></div><div class=\"rc\"><div class=\"e\">samplers catch them in a net</div><div class=\"k\">sampler들은 그들(= 물고기들)을 그물로 잡아,</div></div><div class=\"rc\"><div class=\"e\">and take them to a holding place</div><div class=\"k\">그들(= 물고기들)을 축양 장소로 옮겨놓는다</div></div><div class=\"rc\"><div class=\"e\">for measuring and weighing</div><div class=\"k\">길이를 재고 무게를 달아 보기 위해</div></div><div class=\"rc\"><div class=\"e\">before returning them to the stream.</div><div class=\"k\">그들(= 물고기들)을 시냇물로 되돌려 보내기 전에.</div></div><div class=\"rnat\">그 물고기들은 기절해서 거의 마법처럼 전선으로 끌려오고, 그 순간 sampler들은 그물로 물고기를 잡아, 시냇물로 물고기를 되돌려 보내기 전 길이를 재고 무게를 달아 보기 위해 축양 장소에 옮겨놓는다.</div><div class=\"rst\">물고기가 기절해 전선으로 끌려오면 그물로 잡아 길이를 재고 무게를 달아요. for(~을 위해) 뒤라 measuring(재기)·weighing(무게 달기)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"old-fashioned\" data-m=\"구식의\"><b>old-fashioned</b>구식의</button><button type=\"button\" class=\"wdb\" data-w=\"captive\" data-m=\"포획된, 갇힌 (hold A captive A를 가둬 두다)\"><b>captive</b>포획된, 갇힌 (hold A captive A를 가둬 두다)</button><button type=\"button\" class=\"wdb\" data-w=\"recuperation\" data-m=\"회복\"><b>recuperation</b>회복</button><button type=\"button\" class=\"wdb\" data-w=\"release\" data-m=\"방류하다, 풀어 주다\"><b>release</b>방류하다, 풀어 주다</button><button type=\"button\" class=\"wdb\" data-w=\"attach A to B\" data-m=\"A를 B에 붙이다\"><b>attach A to B</b>A를 B에 붙이다</button><button type=\"button\" class=\"wdb\" data-w=\"stun\" data-m=\"기절시키다\"><b>stun</b>기절시키다</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. 바늘(needle)을 ‘조금이라도 앞으로’ 옮긴다는 말이니, 바로 앞 <b>6·7번</b>의 “원한 만큼은 아니어도 <b>여전히 성공</b>”을 찾아 속뜻으로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (10번)</span><div class=\"en\">helping <mark>move the needle forward</mark> is vastly better than <mark>not helping at all</mark>.</div><p class=\"ko\"><mark>바늘을 앞으로 이동시키는 것을 돕는 것</mark>이 <mark>전혀 돕지 않는 것보다</mark> 훨씬 더 낫다.</p></div><div class=\"ck-via\"><i>▼</i><span>바늘을 ‘앞으로’ = 완벽하진 않아도 실제로 나아진 결과</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">Even if what emerges <mark>isn't as well-funded as you wished</mark> … <mark>you'll have still succeeded</mark> in ensuring that kids in troubled areas have access to clean water.</div><p class=\"ko\">비록 나타난 것이 <mark>여러분이 원했던 만큼 자금이 충분하게 지원되지 않</mark>더라도 … 힘든 지역의 아이들이 깨끗한 물에 접근하도록 보장하는 데 <mark>여러분은 여전히 성공해 있을 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>필자가 ‘중요한 것’이라고 못 박은 자리</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 무엇이 중요한가</span><div class=\"en\"><mark>That's what counts</mark>, that they will be safer because of your idea and your effort.</div><p class=\"ko\">여러분의 아이디어와 노력 덕분에 '그들(= 힘든 지역의 아이들)'이 더 안전하리라는 것, <mark>그것이 중요한 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>the needle</em>상황이 나아진 정도를 가리키는 눈금 바늘</span><span><em>forward</em>완벽하진 않아도 조금이라도 앞으로</span><span><em>8·9번</em>완벽하지 않고 할 일도 남았지만 그래도</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 상황이 허락하는 만큼 실제 변화를 만들어 내기 → ③</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">상황이 허락하는 최대한으로 변화를 만들어 내기<small>원한 만큼은 아니어도(6번) 아이들이 더 안전해지는 변화(7번)를 만드는 게 바늘을 앞으로 옮기는 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">가난한 아이들의 교육을 돕기 위해 기부금을 모으기</span><span class=\"why\">6번 kids in troubled areas(힘든 지역의 아이들)에 끌린 함정이에요. 지문의 예는 교육·기부가 아니라 깨끗한 물(clean water)을 위한 법안이고, 이것도 하나의 예일 뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">완벽함을 기리는 데 시간과 돈을 쓰기</span><span class=\"why\">1번 don't let the perfect become the enemy of the good(완벽함이 괜찮음의 적이 되게 두지 말라)와 정반대예요. 8번도 “완벽한가? 아니다”라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">좋은 대의를 위해 비용 절감 전략을 제안하기</span><span class=\"why\">6번 well-funded(자금이 충분한)는 돈이 원하는 만큼 안 나와도 괜찮다는 말이지, 비용을 줄이자는 전략이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">원래 목표를 바꾸기 전에 자원을 점검하기</span><span class=\"why\">3번은 기꺼이 아이디어를 바꾸라고(alter 바꾸다) 해요. 바꾸기 전에 점검하라는 말은 지문에 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Everyone's heard</div><div class=\"k\">모두 들어 본 적이 있다</div></div><div class=\"rc\"><div class=\"e\">the expression</div><div class=\"k\">그 표현을,</div></div><div class=\"rc\"><div class=\"e\">don't let the perfect become the enemy of the good.</div><div class=\"k\">'완벽함이 괜찮음의 적이 되게 두지 말라'는.</div></div><div class=\"rnat\">모두 '완벽함이 괜찮음의 적이 되게 두지 말라'는 표현을 들어 본 적이 있다.</div><div class=\"rst\">“완벽하지 않으면 안 해!” 하면 아무것도 못 해요. = 지문의 ‘완벽함이 괜찮음의 적이 되게 두지 말라’예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">If you want to get over an obstacle</div><div class=\"k\">여러분이 장애물을 극복하고 싶다면,</div></div><div class=\"rc\"><div class=\"e\">so that your idea can become</div><div class=\"k\">여러분의 아이디어가 ~이 될 수 있도록</div></div><div class=\"rc\"><div class=\"e\">the solution-based policy</div><div class=\"k\">해결을 기반으로 한 방책</div></div><div class=\"rc\"><div class=\"e\">you've long dreamed of,</div><div class=\"k\">여러분이 오랫동안 꿈꿔 왔던,</div></div><div class=\"rc\"><div class=\"e\">you can't have</div><div class=\"k\">여러분은 가져서는 안 된다</div></div><div class=\"rc\"><div class=\"e\">an all-or-nothing mentality.</div><div class=\"k\">전부 아니면 전무라고 여기는 사고방식을.</div></div><div class=\"rnat\">여러분이 장애물을 극복해서 여러분의 아이디어가 여러분이 오랫동안 꿈꿔 왔던, 해결을 기반으로 한 방책이 될 수 있도록 하고 싶다면, 전부 아니면 전무라고 여기는 사고방식을 가져서는 안 된다.</div><div class=\"rst\">학급 회의에서 내 의견을 통과시키고 싶다면 ‘전부 아니면 꽝’ 생각은 버려야 해요. 지문도 전부 아니면 전무의(all-or-nothing) 생각을 버리라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">You have to be willing</div><div class=\"k\">여러분은 기꺼이 ~해야 한다</div></div><div class=\"rc\"><div class=\"e\">to alter your idea</div><div class=\"k\">여러분의 아이디어를 바꾸고</div></div><div class=\"rc\"><div class=\"e\">and let others influence</div><div class=\"k\">다른 사람들이 영향을 미치도록 하는 것을</div></div><div class=\"rc\"><div class=\"e\">its outcome.</div><div class=\"k\">그것(= 여러분의 아이디어)의 결과에.</div></div><div class=\"rnat\">여러분은 기꺼이 여러분의 아이디어를 바꾸고 다른 사람이 그것의 결과에 영향을 미치도록 해야 한다.</div><div class=\"rst\">친구들 의견을 듣고 내 안을 조금 고칠 줄도 알아야 해요. = 지문의 아이디어를 바꾸고 남이 결과에 영향을 주게 하라예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">You have to be okay</div><div class=\"k\">여러분은 괜찮다고 여겨야 한다</div></div><div class=\"rc\"><div class=\"e\">with the outcome being a little different,</div><div class=\"k\">결과가 조금 다르거나,</div></div><div class=\"rc\"><div class=\"e\">even a little less,</div><div class=\"k\">심지어 조금 '못'하여도,</div></div><div class=\"rc\"><div class=\"e\">than you wanted.</div><div class=\"k\">여러분이 원했던 것보다.</div></div><div class=\"rnat\">여러분은 결과가 여러분이 원했던 것과 조금 다르거나, 심지어 조금 '못'하여도 괜찮다고 여겨야 한다.</div><div class=\"rst\">결과가 내가 원한 것보다 조금 달라도, 조금 <b>못해도</b>(less) 괜찮다고 여겨요. 지문도 그래야 한다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Say</div><div class=\"k\">~라고 가정해 보자</div></div><div class=\"rc\"><div class=\"e\">you're pushing for</div><div class=\"k\">여러분이 추진하고 있다고</div></div><div class=\"rc\"><div class=\"e\">a clean water act.</div><div class=\"k\">수질 오염 방지법(clean water act)을.</div></div><div class=\"rnat\">여러분이 수질 오염 방지법을 추진하고 있다고 가정해보자.</div><div class=\"rst\">예를 들어 “교실에 정수기를 놓자”고 건의했다고 해 봐요. = 지문의 수질 오염 방지법을 추진하는 상황이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Even if what emerges</div><div class=\"k\">비록 나타난 것이</div></div><div class=\"rc\"><div class=\"e\">isn't as well-funded as you wished,</div><div class=\"k\">여러분이 원했던 만큼 자금이 충분하게 지원되지 않거나,</div></div><div class=\"rc\"><div class=\"e\">or doesn't match</div><div class=\"k\">또는 일치하지 않더라도</div></div><div class=\"rc\"><div class=\"e\">how you originally conceived the bill,</div><div class=\"k\">여러분이 처음에 그 법안을 고안한 방식과,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">you'll have still succeeded</span></div><div class=\"k\"><span class=\"cw\">여러분은 여전히 성공해 있을 것이다</span></div></div><div class=\"rc\"><div class=\"e\">in ensuring</div><div class=\"k\">보장하는 데</div></div><div class=\"rc\"><div class=\"e\">that kids in troubled areas</div><div class=\"k\">힘든 지역의 아이들이</div></div><div class=\"rc\"><div class=\"e\">have access to clean water.</div><div class=\"k\">깨끗한 물에 접근하도록.</div></div><div class=\"rnat\">비록 나타난 것이 여러분이 원했던 만큼의 자금이 충분하게 지원되지 않거나, 여러분이 처음에 그 법안을 고안한 방식과 일치하지 않더라도, 여러분은 힘든 지역의 아이들이 깨끗한 물에 접근하도록 하는 데 여전히 성공해 있을 것이다.</div><div class=\"rst\">원한 큰 정수기는 아니어도 작은 정수기가 왔다면 <b>여전히 성공</b>(still succeeded)이에요. 지문도 아이들이 깨끗한 물을 얻었으니 성공이래요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">That's what counts,</span></div><div class=\"k\"><span class=\"cw\">그것이 중요한 것이다,</span></div></div><div class=\"rc\"><div class=\"e\">that they will be safer</div><div class=\"k\">'그들(= 힘든 지역의 아이들)'이 더 안전하리라는 것이,</div></div><div class=\"rc\"><div class=\"e\">because of your idea and your effort.</div><div class=\"k\">여러분의 아이디어와 노력 덕분에.</div></div><div class=\"rnat\">여러분의 아이디어와 노력 덕분에 '그들'이 더 안전하리라는 것이 중요한 것이다.</div><div class=\"rst\">친구들이 깨끗한 물을 마시게 됐다는 것, <b>그게 중요한 거예요</b>(That's what counts). 지문의 핵심 문장이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Is it perfect?</div><div class=\"k\">그것이 완벽한가?</div></div><div class=\"rc\"><div class=\"e\">No.</div><div class=\"k\">아니다.</div></div><div class=\"rnat\">완벽한가? 아니다.</div><div class=\"rst\">완벽한가요? 아니에요. 지문도 스스로 묻고 “아니다”라고 답해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Is there more work to be done?</div><div class=\"k\">해야 할 일이 더 있는가?</div></div><div class=\"rc\"><div class=\"e\">Absolutely.</div><div class=\"k\">당연하다.</div></div><div class=\"rnat\">해야 할 일이 더 있는가? 당연하다.</div><div class=\"rst\">더 할 일이 남았나요? 물론이에요. 지문도 해야 할 일이 더 있다고 인정해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">But in almost every case,</div><div class=\"k\">하지만 거의 모든 경우에,</div></div><div class=\"rc ckc\"><div class=\"e\">helping <span class=\"cw\">move the needle forward</span></div><div class=\"k\"><span class=\"cw\">바늘을 앞으로 이동시키는 것을 돕는 것</span>(상황이 허락하는 한 최선의 변화를 만들기)이</div></div><div class=\"rc\"><div class=\"e\">is vastly better</div><div class=\"k\">훨씬 더 낫다</div></div><div class=\"rc ckc\"><div class=\"e\">than <span class=\"cw\">not helping at all.</span></div><div class=\"k\"><span class=\"cw\">전혀 돕지 않는 것보다.</span></div></div><div class=\"rnat\">하지만 거의 모든 경우에, 바늘을 앞으로 이동시키는 것을 돕는 것(상황이 허락하는 한 최선의 변화를 만들기)이 전혀 돕지 않는 것보다 훨씬 더 낫다.</div><div class=\"rst\">그래도 <b>바늘을 조금이라도 앞으로</b>(move the needle forward) 옮기는 게 아예 안 하는 것보다 훨씬 나아요. = 할 수 있는 만큼 변화를 만드는 것(③)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"all-or-nothing\" data-m=\"전부 아니면 전무의\"><b>all-or-nothing</b>전부 아니면 전무의</button><button type=\"button\" class=\"wdb\" data-w=\"alter\" data-m=\"바꾸다\"><b>alter</b>바꾸다</button><button type=\"button\" class=\"wdb\" data-w=\"push for\" data-m=\"~을 추진하다, 강하게 요구하다\"><b>push for</b>~을 추진하다, 강하게 요구하다</button><button type=\"button\" class=\"wdb\" data-w=\"conceive\" data-m=\"구상하다\"><b>conceive</b>구상하다</button><button type=\"button\" class=\"wdb\" data-w=\"what counts\" data-m=\"중요한 것 (count 중요하다)\"><b>what counts</b>중요한 것 (count 중요하다)</button><button type=\"button\" class=\"wdb\" data-w=\"vastly\" data-m=\"훨씬\"><b>vastly</b>훨씬</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>대시(—)</b> 뒤라서 ‘과학자들이 의심해 온 것’의 내용 자체예요. 쌍둥이 예시 끝의 <b>식사(diet)가 유전자를 껐다</b>와 마지막 8번의 <b>음식이 유전자 발현에 영향</b>을 한 줄로 묶으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">The growing field of genetics is showing us what many scientists have suspected for years — <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">유전학은 많은 과학자들이 몇 년간 의심했던 것, 즉 ( ? )을 보여 주고 있다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 내용(이 정보)을 알면 유전자는 우리가 ‘조절할 수 있는’ 것이 돼요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 방향 잡기</span><div class=\"en\">This information helps us better understand <mark>that genes are under our control</mark> and not something we must obey.</div><p class=\"ko\">이 정보는 <mark>유전자가 우리의 통제하에 있는 것이지</mark> 우리가 복종해야만 하는 무언가가 아님을 더 잘 이해하도록 돕는다.</p></div><div class=\"ck-via\"><i>▼</i><span>같은 유전자인데 한 명만 건강한 이유 = 먹은 음식</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">the healthy twin <mark>had a diet</mark> <mark>that turned off the cancer gene</mark></div><p class=\"ko\">건강한 쌍둥이가 <mark>암 유전자를 차단하는</mark> <mark>식사를 했다</mark>는 것이다</p></div><div class=\"ck-via\"><i>▼</i><span>The notion(그 생각) = 1번에서 과학자들이 의심해 온 것</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 빈칸을 다시 말함</span><div class=\"en\">The notion <mark>that food has a specific influence</mark> <mark>on gene expression</mark> is relatively new.</div><p class=\"ko\"><mark>유전자 발현에</mark> <mark>음식이 특정한 영향을 끼친다는</mark> 그 생각은 비교적 새롭다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">음식은 유전적 청사진에 즉각 영향을 줄 수 있다<small>6번 diet(식사)가 유전자를 끔 + 8번 food(음식)가 gene expression(유전자 발현)에 영향을 그대로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">음식에 대한 우리의 선호는 유전자의 영향을 받는다</span><span class=\"why\">음식과 유전자가 다 나와서 끌리지만 방향이 거꾸로예요. 지문은 유전자가 음식을 정하는 게 아니라, 8번처럼 음식(food)이 유전자에 영향을 준다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">일란성 쌍둥이는 같은 유전적 구성을 갖는다</span><span class=\"why\">3번 내용이 맞긴 하지만 예시의 출발점일 뿐이에요. 2번 “유전자는 우리의 통제하에 있다”로 이어지지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">균형 잡힌 식단은 정신 건강에 필수적이다</span><span class=\"why\">정신 건강 이야기는 없어요. 4~6번은 암(cancer)에 걸리느냐 마느냐, 즉 몸의 병 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">유전공학은 일부 치명적인 질병을 치료할 수 있다</span><span class=\"why\">유전공학 기술로 병을 고친다는 말은 없어요. 6번에서 암 유전자를 끈 건 기술이 아니라 diet(식사)예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The growing field of genetics</div><div class=\"k\">발전하고 있는 유전학 분야는</div></div><div class=\"rc\"><div class=\"e\">is showing us</div><div class=\"k\">우리에게 보여주고 있다</div></div><div class=\"rc\"><div class=\"e\">what many scientists have suspected for years</div><div class=\"k\">많은 과학자들이 몇 년간 의심했던 것을,</div></div><div class=\"rc\"><div class=\"e\">— ______.</div><div class=\"k\">즉 (빈칸) 음식이 유전자 청사진에 직접 영향을 줄 수 있다는 것을.</div></div><div class=\"rnat\">발전하고 있는 유전학 분야는 우리에게 많은 과학자들이 몇 년간 의심했던 것, 즉 ______을 보여주고 있다.</div><div class=\"rst\">과학자들은 오래전부터 ‘이거 혹시?’ 하고 짐작해 온 게 있어요. 유전학이 그걸 보여 준대요. 그게 바로 빈칸이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This information</div><div class=\"k\">이 정보는</div></div><div class=\"rc\"><div class=\"e\">helps us better understand</div><div class=\"k\">우리가 더 잘 이해할 수 있도록 돕는다</div></div><div class=\"rc\"><div class=\"e\">that genes are under our control</div><div class=\"k\">유전자가 우리의 통제하에 있는 것이지</div></div><div class=\"rc\"><div class=\"e\">and not something we must obey.</div><div class=\"k\">우리가 복종해야만 하는 무언가가 아님을.</div></div><div class=\"rnat\">이 정보는 유전자가 우리의 통제하에 있는 것이지 우리가 복종해야만 하는 무언가가 아님을 (우리가) 더 잘 이해할 수 있도록 돕는다.</div><div class=\"rst\">그걸 알면 몸의 설계도(유전자)가 내 맘대로 못 바꾸는 명령이 아니라 <b>내가 조절할 수 있는 것</b>이 돼요. = 지문의 under our control(통제하에)이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Consider identical twins;</div><div class=\"k\">일란성 쌍둥이를 생각해 보자;</div></div><div class=\"rc\"><div class=\"e\">both individuals are given</div><div class=\"k\">두 사람은 모두 부여받는다</div></div><div class=\"rc\"><div class=\"e\">the same genes.</div><div class=\"k\">같은 유전자를.</div></div><div class=\"rnat\">일란성 쌍둥이를 생각해 보자. 두 사람은 모두 같은 유전자를 부여받는다.</div><div class=\"rst\">우리 반 일란성 쌍둥이 두 친구를 떠올려 봐요. 둘은 똑같은 유전자를 받았어요. 지문도 일란성 쌍둥이 예를 들어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In mid-life,</div><div class=\"k\">중년이 되었을 때,</div></div><div class=\"rc\"><div class=\"e\">one twin develops cancer,</div><div class=\"k\">쌍둥이 중 한 사람은 암에 걸리고,</div></div><div class=\"rc\"><div class=\"e\">and the other lives</div><div class=\"k\">다른 한 사람은 산다</div></div><div class=\"rc\"><div class=\"e\">a long healthy life without cancer.</div><div class=\"k\">암 없이 오래 건강한 삶을.</div></div><div class=\"rnat\">중년이 되었을 때, 쌍둥이 중 한 사람은 암에 걸리고, 다른 한 사람은 암 없이 오래 건강한 삶을 산다.</div><div class=\"rst\">그런데 어른이 돼서 한 명은 큰 병에 걸리고, 다른 한 명은 오래 건강하게 살아요. 지문의 한 명은 암, 한 명은 건강이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">A specific gene</div><div class=\"k\">특정한 유전자가</div></div><div class=\"rc\"><div class=\"e\">instructed one twin</div><div class=\"k\">쌍둥이 중 한 사람에게 명령했으나</div></div><div class=\"rc\"><div class=\"e\">to develop cancer,</div><div class=\"k\">암에 걸리도록,</div></div><div class=\"rc\"><div class=\"e\">but in the other</div><div class=\"k\">하지만 다른 한 사람에게는</div></div><div class=\"rc\"><div class=\"e\">the same gene</div><div class=\"k\">같은 유전자가</div></div><div class=\"rc\"><div class=\"e\">did not initiate the disease.</div><div class=\"k\">그 질병을 일으키지 않았다.</div></div><div class=\"rnat\">특정한 유전자가 쌍둥이 중 한 사람이 암에 걸리도록 명령했으나, 다른 한 사람에게는 같은 유전자가 그 질병을 일으키지 않았다.</div><div class=\"rst\">같은 유전자가 한 명에게는 “병 걸려!” 했는데, 다른 한 명에게는 그 명령이 안 먹혔어요. = 지문의 같은 유전자가 병을 안 일으켰다예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">One possibility is</div><div class=\"k\">한 가능성은</div></div><div class=\"rc\"><div class=\"e\">that the healthy twin</div><div class=\"k\">건강한 쌍둥이가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">had a diet</span></div><div class=\"k\"><span class=\"cw\">식사를 했다는 것이다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that turned off the cancer gene</span></div><div class=\"k\"><span class=\"cw\">암 유전자를 차단하는,</span></div></div><div class=\"rc\"><div class=\"e\">— the same gene</div><div class=\"k\">즉 그 같은 유전자를</div></div><div class=\"rc\"><div class=\"e\">that instructed the other person to get sick.</div><div class=\"k\">다른 한 사람이 병에 걸리도록 명령했던.</div></div><div class=\"rnat\">한 가능성은 쌍둥이 중 건강한 사람이 암 유전자, 즉 다른 한 사람이 병에 걸리도록 명령했던 그 같은 유전자를 차단하는 식사를 했다는 것이다.</div><div class=\"rst\">어쩌면 건강한 쪽은 늘 채소 반찬을 챙겨 먹었을지 몰라요. 그 <b>식사</b>(diet)가 병 유전자를 껐을 수 있다는 게 지문의 핵심 단서예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">For many years,</div><div class=\"k\">여러 해 동안,</div></div><div class=\"rc\"><div class=\"e\">scientists have recognized</div><div class=\"k\">과학자들은 인정해 왔다</div></div><div class=\"rc\"><div class=\"e\">other environmental factors,</div><div class=\"k\">다른 환경적인 요인들이,</div></div><div class=\"rc\"><div class=\"e\">such as chemical toxins (tobacco for example),</div><div class=\"k\">화학적 독소(예를 들어 담배)와 같은,</div></div><div class=\"rc\"><div class=\"e\">can contribute to cancer</div><div class=\"k\">암의 원인이 될 수 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">through their actions on genes.</div><div class=\"k\">그것들(= 환경적인 요인들)이 유전자에 행하는 작용을 통해.</div></div><div class=\"rnat\">여러 해 동안 과학자들은 화학적 독소(예를 들어 담배)와 같은 다른 환경적인 요인들이 유전자에 행하는 (그것들의) 작용을 통해 암의 원인이 될 수 있다는 것을 인정해 왔다.</div><div class=\"rst\">담배 같은 나쁜 물질이 유전자에 작용해 병을 부른다는 건 오래전부터 알려져 있었어요. 지문도 환경 요인 이야기를 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">The notion</div><div class=\"k\">그 생각은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that food has a specific influence</span></div><div class=\"k\"><span class=\"cw\">음식이 특정한 영향을 끼친다는</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">on gene expression</span></div><div class=\"k\"><span class=\"cw\">유전자 발현에</span></div></div><div class=\"rc\"><div class=\"e\">is relatively new.</div><div class=\"k\">비교적 새롭다.</div></div><div class=\"rnat\">음식이 유전자 발현에 특정한 영향을 끼친다는 생각은 비교적 새롭다.</div><div class=\"rst\">하지만 <b>음식이 유전자에 직접 영향</b>을 준다는 생각은 아직 새로워요. 그래서 빈칸은 ‘음식이 유전자 설계도에 영향을 준다’예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"genetics\" data-m=\"유전학\"><b>genetics</b>유전학</button><button type=\"button\" class=\"wdb\" data-w=\"suspect\" data-m=\"의심하다, 짐작하다\"><b>suspect</b>의심하다, 짐작하다</button><button type=\"button\" class=\"wdb\" data-w=\"identical twins\" data-m=\"일란성 쌍둥이\"><b>identical twins</b>일란성 쌍둥이</button><button type=\"button\" class=\"wdb\" data-w=\"initiate\" data-m=\"시작하다, 일으키다\"><b>initiate</b>시작하다, 일으키다</button><button type=\"button\" class=\"wdb\" data-w=\"turn off\" data-m=\"끄다, 차단하다\"><b>turn off</b>끄다, 차단하다</button><button type=\"button\" class=\"wdb\" data-w=\"gene expression\" data-m=\"유전자 발현\"><b>gene expression</b>유전자 발현</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
