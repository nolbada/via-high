<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});

 "두 번째 예시. 낚시에서는 역할이 뒤바뀌어 ‘나’가 이끈다. 공식적인 지위와 상관없이 목표에 따라 리더와 추종자가 바뀐다.", "link": "하지만 내가 낚시 전문가라면, 공식적인 지위나 내가 어제 콘서트에 대해서는 당신을 따랐다는 사실과는 관계없이, 우리가 낚시할 장소에 대해서는 당신이 나를 따를 수 있다."}]}, {"no": "08", "typ": "빈칸", "src": "2018년 9월 34번", "evn": [4, 5], "ev_en": "The great explosion of scientific creativity in Europe was certainly helped by the sudden spread of information brought about by Gutenberg’s use of movable type in printing and by the legitimation of everyday languages, which rapidly replaced Latin as the medium of discourse. / In sixteenth-century Europe it became much easier to make a creative contribution not necessarily because more creative individuals were born then than in previous centuries or because social supports became more favorable, but because information became more widely accessible.", "ev_ko": [[4, "유럽에서 과학적 창의성의 엄청난 폭발은 인쇄술에서 구텐베르크의 가동 활자의 사용으로 야기된 갑작스러운 정보의 확산과 담론의 수단으로서의 라틴어를 급속히 대체한 일상어의 합법화에 의해서 분명히 도움을 받았다."], [5, "16세기 유럽에서 그 무렵 반드시 이전 세기에서보다 더 창의적인 사람들이 태어났거나 사회적 지원이 더 호의적이었기 때문이 아니라 정보가 더욱 널리 접근 가능하게 되었기 때문에, 창의적인 기여를 하는 것이 훨씬 더 쉬워졌다."]], "why": ["4번은 구텐베르크의 인쇄술로 <b>정보가 갑자기 확산<\/b>되고 라틴어 대신 <b>일상어<\/b>가 합법화되었다고 합니다", "5번은 창의적인 기여가 쉬워진 이유가 '더 창의적인 사람이 태어나서'나 '사회적 지원이 호의적이어서'가 <b>아니라<\/b>고 합니다", "그러므로 빈칸에는 정보의 확산을 담은 <b>information became more widely accessible<\/b>가 들어갑니다."], "ch": [{"n": "①", "t": "the number of rich people increased", "g": "부유한 사람들의 수가 증가했기", "ok": false, "e": ["'부유한 사람들의 수가 증가했기'라는 내용은 지문에 없습니다."]}, {"n": "②", "t": "information became more widely accessible", "g": "정보가 더욱 널리 접근 가능하게 되었기", "ok": true, "e": ["4번의 정보의 급속한 확산과 일상어의 합법화와 일치합니다."]}, {"n": "③", "t": "people were able to learn Latin more easily", "g": "사람들이 더 쉽게 라틴어를 배울 수 있었기", "ok": false, "e": ["4번은 라틴어를 쉽게 배우게 된 것이 아니라 일상어가 라틴어를 대체했다고 합니다."]}, {"n": "④", "t": "education provided equal opportunities for all", "g": "교육이 모두에게 동등한 기회들을 제공했기", "ok": false, "e": ["교육 기회에 관한 내용은 지문에 없습니다."]}, {"n": "⑤", "t": "new methods of scientific research were introduced", "g": "과학 연구의 새로운 방법들이 도입되었기", "ok": false, "e": ["연구 방법에 관한 내용은 지문에 없습니다."]}], "tr": ["수 세기 동안 대체로 유럽의 과학과 지식은 라틴어로 기록되었다. (그 언어는) 더 이상 어느 누구도 사용하지 않았고 학교에서 배워야만 했던 언어(였다).", "아마 1퍼센트도 안 되는 아주 극소수의 사람들이 그 언어(라틴어)로 된 책을 읽고 그래서 그 시대의 지적 담론에 참여할 만큼 충분히 라틴어를 공부할 수단을 가졌다.", "게다가 사람들은 거의 책에 접근하지 못했는데, 그것은 손으로 쓰였고 희귀하고 비쌌다.", "유럽에서 과학적 창의성의 엄청난 폭발은 인쇄술에서 구텐베르크의 가동 활자의 사용으로 야기된 갑작스러운 정보의 확산과 담론의 수단으로서의 라틴어를 급속히 대체한 일상어의 합법화에 의해서 분명히 도움을 받았다.", "16세기 유럽에서 그 무렵 반드시 이전 세기에서보다 더 창의적인 사람들이 태어났거나 사회적 지원이 더 호의적이었기 때문이 아니라 정보가 더욱 널리 접근 가능하게 되었기 때문에, 창의적인 기여를 하는 것이 훨씬 더 쉬워졌다."], "ps": [{"n": 1, "ch": [{"e": "For many centuries", "k": "수 세기 동안"}, {"e": "European science, and knowledge in general,", "k": "유럽의 과학과, 대체로 지식은"}, {"e": "was <b>recorded<\/b> in Latin", "k": "라틴어로 <b>기록되었다<\/b>"}, {"e": "— a language that no one spoke any longer", "k": "— 더 이상 어느 누구도 사용하지 않았던 언어"}, {"e": "and that had to be learned in schools.", "k": "그리고 학교에서 배워야만 했던 (언어)."}], "easy": "오랫동안 유럽의 과학과 지식은 라틴어로 적혔어요. 라틴어는 아무도 쓰지 않아서 학교에서 따로 배워야 하는 언어였어요.", "gist": "배경 설명. 지식이 라틴어로 기록되던 시대였고, 그 언어는 따로 배워야 했다."}, {"n": 2, "ch": [{"e": "Very few individuals,", "k": "아주 극소수의 사람들이,"}, {"e": "probably less than one percent,", "k": "아마 1퍼센트도 안 되는,"}, {"e": "had the <b>means<\/b> to study Latin", "k": "라틴어를 공부할 <b>수단<\/b>을 가졌다"}, {"e": "enough to read books in that language", "k": "그 언어<span class=\"r\">(= 라틴어)<\/span>로 된 책을 읽을 만큼 충분히"}, {"e": "and therefore to <b>participate in<\/b>", "k": "그리고 그래서 ~에 <b>참여할<\/b>"}, {"e": "the <b>intellectual discourse<\/b> of the times.", "k": "그 시대의 <b>지적 담론<\/b>에."}], "easy": "라틴어를 책 읽을 만큼 공부할 수 있는 사람은 1%도 안 되는 극소수였어요. 그래서 그 시대의 지적인 토론에 낄 수 있는 사람도 적었어요.", "gist": "라틴어를 공부할 수 있는 사람이 극소수여서, 지적 담론에 참여하는 사람도 극소수였다는 내용이다."}, {"n": 3, "ch": [{"e": "<b>Moreover<\/b>,", "k": "게다가"}, {"e": "few people had <b>access to<\/b> books,", "k": "사람들은 거의 책에 <b>접근<\/b>하지 못했는데,"}, {"e": "which were <b>handwritten<\/b>, <b>scarce<\/b>, and expensive.", "k": "그것은<span class=\"r\">(= 책)<\/span> 손으로 쓰였고 희귀하고 비쌌다."}], "easy": "게다가 책은 손으로 쓴 것이라 구하기 힘들고 비싸서, 책을 볼 수 있는 사람도 거의 없었어요.", "gist": "접근하기 어려웠던 이유를 하나 더 보탠다. 책 자체가 손으로 쓴 것이고 희귀하고 비쌌다."}, {"n": 4, "ch": [{"e": "The great <b>explosion<\/b> of scientific creativity in Europe", "k": "유럽에서 과학적 창의성의 엄청난 <b>폭발<\/b>은"}, {"e": "was certainly helped", "k": "분명히 도움을 받았다"}, {"e": "by the <b>sudden spread of information<\/b>", "k": "갑작스러운 <b>정보의 확산<\/b>에 의해"}, {"e": "brought about by Gutenberg’s use of movable type in printing", "k": "인쇄술에서 구텐베르크의 가동 활자의 사용으로 야기된"}, {"e": "and by the <b>legitimation of everyday languages<\/b>,", "k": "그리고 <b>일상어의 합법화<\/b>에 의해,"}, {"e": "which rapidly replaced Latin", "k": "(일상어가) 라틴어를 급속히 대체한"}, {"e": "as the medium of discourse.", "k": "담론의 수단으로서의."}], "easy": "유럽에서 과학적 창의성이 폭발한 건, 인쇄술 덕분에 정보가 갑자기 퍼진 것과 일상 언어가 정식으로 인정받아 라틴어를 대신하게 된 것의 도움이 분명히 컸어요.", "gist": "앞의 장벽(라틴어, 비싼 책)에 이어, 창의성이 폭발한 계기를 말한다. 정보의 확산과 일상어의 합법화가 나온다.", "link": "유럽에서 과학적 창의성의 엄청난 폭발은 구텐베르크가 인쇄술에서 가동 활자를 사용해 일으킨 갑작스러운 정보의 확산과, 담론의 수단으로서의 라틴어를 급속히 대체한 일상어의 합법화에 의해 분명히 도움을 받았다."}, {"n": 5, "ch": [{"e": "In <b>sixteenth-century<\/b> Europe", "k": "16세기 유럽에서"}, {"e": "it became much easier", "k": "훨씬 더 쉬워졌다"}, {"e": "to make a <b>creative contribution<\/b>", "k": "창의적인 기여를 하는 것이"}, {"e": "not necessarily because more creative individuals were born then", "k": "그 무렵 더 창의적인 사람들이 태어났기 때문이 반드시 아니고"}, {"e": "than in previous centuries", "k": "이전 세기에서보다"}, {"e": "or because social supports became more favorable,", "k": "혹은 사회적 지원이 더 호의적이었기 때문이 아니라,"}, {"e": "but because <b>information became more widely accessible<\/b>.", "k": "<b>정보가 더욱 널리 접근 가능하게 되었기<\/b> 때문에.<span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}], "easy": "16세기에 창의적인 일을 하기 쉬워진 건, 창의적인 사람이 더 많이 태어나서도 아니고 사회적 지원이 좋아져서도 아니에요. 정보를 더 널리 접할 수 있게 되었기 때문이에요.", "gist": "빈칸 문장. ‘A나 B 때문이 아니라 C 때문’의 형태로, C가 4번에서 말한 정보의 확산과 이어진다."}]}, {"no": "09", "typ": "순서", "src": "2013년 9월 B형 38번", "evn": [2, 5, 7, 3, 8], "ev_en": "As a result, all toothpaste tubes now bear a scary-sounding warning. / (B) It was like this one: / If more than used for brushing is accidentally swallowed, get medical help or contact a poison control center right away.” / (A) In the months following the new warning, toothpaste consumer lines fielded hundreds of questions from worried parents, and poison control centers were flooded with calls as well. / (C) The only reason to see a doctor, however, is if the vomiting gets so serious that dehydration becomes an issue.", "ev_ko": [[2, "결과적으로, 이제 모든 치약튜브는 끔찍하게 들리는 경고를 담고 있다."], [5, "(B) 그것은 이런 것과 같았다."], [7, "(B) 만약 양치질을 위해 사용되는 양 이상이 우연히 삼켜진다면, 즉시 의학적인 도움을 얻거나 독극물 관리 센터로 연락하시오.”"], [3, "(A) 그 새로운 경고문(이 실린) 다음 몇 달 안에, 치약회사 고객센터들은 걱정하는 부모들로부터의 수백 개의 질문을 처리했고, 독극물 관리 센터 또한 전화로 넘쳐났다."], [8, "(C) 하지만 의사를 보러 가는 유일한 이유(경우)는 구토가 너무 심각해져서 탈수증이 문제가 될 때입니다."]], "why": ["주어진 글은 (2)번에서 모든 치약튜브에 <b>a scary-sounding warning<\/b>(끔찍하게 들리는 경고)이 붙는다는 내용으로 끝납니다", "(B)의 (5)번 <b>It was like this one<\/b>에서 It이 이 경고를 받으며, (B)의 (6)(7)번은 그 경고문의 구체적인 내용을 보여 줍니다", "그래서 (B)가 맨 처음입니다", "(A)의 (3)번 <b>the new warning<\/b>은 (B)에서 소개한 경고문을 가리키며, 그 경고문 이후에 걱정하는 부모들의 문의가 쏟아졌다는 내용입니다", "(C)의 첫 문장인 (8)번에는 <b>however<\/b>(하지만)가 들어 있어, (A)의 '구토를 할 수도 있고 하지 않을 수도 있다'는 안내에 이어 병원에 가야 하는 경우를 말합니다", "그래서 (C)가 마지막입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)의 the new warning이 가리키는 경고문은 (B)에서 소개됩니다", "그러므로 (B)가 (A)보다 앞에 와야 합니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": true, "e": ["주어진 글의 a scary-sounding warning → (B)의 It(경고문의 내용) → (A)의 the new warning(경고 이후 부모들의 문의) → (C)(병원에 가야 하는 경우)의 순서로 자연스럽게 이어집니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["(C)는 첫 문장에 however(하지만)가 들어 있고, 구토에 관해 병원에 가야 하는 경우를 말합니다", "이는 (A)의 '구토를 할 수도 있고 하지 않을 수도 있다'는 안내 다음에 와야 자연스럽습니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C)의 첫 문장에는 however(하지만)가 있어 앞에 받을 내용이 필요합니다", "주어진 글 바로 뒤에는 a scary-sounding warning을 It으로 받는 (B)가 와야 합니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(C)가 맨 앞에 올 수 없다는 점은 ④와 같습니다", "또한 (A)의 the new warning이 가리키는 경고문은 (B)에서 소개되므로 (B)가 (A)보다 먼저 와야 합니다."]}], "tr": ["1997년 4월에 미국 Food and Drug Administration(식약청)은 치약 제조업자들이 자발적인 안전지침을 충분히 철저하게 지키지 않고 있다고 규정했다.", "결과적으로, 이제 모든 치약튜브는 끔찍하게 들리는 경고를 담고 있다.", "(A) 그 새로운 경고문(이 실린) 다음 몇 달 안에, 치약회사 고객센터들은 걱정하는 부모들로부터의 수백 개의 질문을 처리했고, 독극물 관리 센터 또한 전화로 넘쳐났다.", "(A) 그들은 부모들에게 같은 말을 했다. 당신의 아이는 괜찮으며 구토를 할 수도 있고 하지 않을 수도 있습니다.", "(B) 그것은 이런 것과 같았다.", "(B) “6세 미만 아이들의 손이 닿지 않게 두시오.", "(B) 만약 양치질을 위해 사용되는 양 이상이 우연히 삼켜진다면, 즉시 의학적인 도움을 얻거나 독극물 관리 센터로 연락하시오.”", "(C) 하지만 의사를 보러 가는 유일한 이유(경우)는 구토가 너무 심각해져서 탈수증이 문제가 될 때입니다.", "(C) 그렇다. 당신은 맛있는 치약을 실컷 먹을 수 있고 메스꺼움과 설사보다 더 심각한 어떤 것도 경험하지 않을 것이다(심각해봤자 메스꺼움이나 설사일 뿐이다)."], "ps": [{"n": 1, "ch": [{"e": "In April 1997,", "k": "1997년 4월에"}, {"e": "the U.S. <b>Food and Drug Administration<\/b>", "k": "미국 식약청(Food and Drug Administration)은"}, {"e": "<b>ruled<\/b> that toothpaste <b>manufacturers<\/b>", "k": "치약 <b>제조업자<\/b>들이 ~라고 <b>규정했다<\/b>"}, {"e": "weren’t <b>adhering<\/b> closely enough", "k": "충분히 철저하게 <b>지키지<\/b> 않고 있다고"}, {"e": "to <b>voluntary<\/b> safety guidelines.", "k": "<b>자발적인<\/b> 안전지침을."}], "easy": "1997년 4월, 미국 식약청은 치약을 만드는 회사들이 스스로 지키기로 한 안전 지침을 충분히 지키지 않고 있다고 판단했어요.", "gist": "주어진 글의 시작. 식약청의 판단이라는 사건을 제시한다."}, {"n": 2, "ch": [{"e": "<b>As a result<\/b>,", "k": "결과적으로,"}, {"e": "all toothpaste tubes now <b>bear<\/b>", "k": "이제 모든 치약튜브는 담고 있다"}, {"e": "a <b>scary-sounding warning<\/b>.", "k": "끔찍하게 들리는 경고를."}], "easy": "그 결과 지금은 모든 치약튜브에 무섭게 들리는 경고 문구가 붙어 있어요.", "gist": "주어진 글의 끝. 이 a scary-sounding warning을 (B)의 It이 받는다."}, {"n": 3, "ch": [{"e": "(A) In the months following the new warning,", "k": "(A) 그 새로운 경고문<span class=\"r\">(= (B)에서 소개한 경고문)<\/span> 다음 몇 달 안에,"}, {"e": "toothpaste consumer lines <b>fielded<\/b> hundreds of questions", "k": "치약회사 고객센터들은 수백 개의 질문을 처리했고"}, {"e": "from worried parents,", "k": "걱정하는 부모들로부터의,"}, {"e": "and poison control centers were <b>flooded with calls<\/b> as well.", "k": "독극물 관리 센터 또한 전화로 <b>넘쳐 n eat your fill of delicious toothpaste", "k": "당신은 맛있는 치약을 실컷 먹을 수 있다"}, {"e": "and not come away with anything", "k": "그리고 어떤 것도 경험하지 않을 것이다"}, {"e": "more serious than <b>nausea<\/b> and <b>diarrhea<\/b>.", "k": "메스꺼움과 설사보다 더 심각한."}], "easy": "맞아요, 맛있는 치약을 실컷 먹어도 심해 봐야 메스꺼움이나 설사 정도예요.", "gist": "마무리. 치약을 아무리 많이 삼켜도 메스꺼움과 설사에 걸릴 뿐이라고 다시 확인한다."}]}, {"no": "10", "typ": "무관문장", "src": "2017년 11월 35번", "evn": [4, 5], "ev_en": "② This is an ingredient in large numbers of cyber-related fraud, and cyber-related fraud is by far the most common form of crime that hits individuals. / ③ Thanks to advances in cyber security systems, reports of this crime have lowered dramatically.", "ev_ko": [[4, "② 이것(신원 도용)은 상당수의 사이버 관련 사기의 한 구성 요소이며, 사이버 관련 사기는 단연코 개인들을 공격하는 가장 흔한 범죄 형태이다."], [5, "③ 사이버 보안 시스템의 진보 덕분에, 이 범죄(사이버 관련 사기)의 보고는 급격히 감소해 왔다."]], "why": ["글은 신원 도용이 <b>사이버 관련 사기<\/b>의 한 구성 요소이며, 사이버 관련 사기가 개인을 공격하는 <b>가장 흔한 범죄 형태<\/b>라고 말합니다(4번)", "그런데 5번은 이 범죄의 <b>보고가 급격히 감소해 왔다<\/b>고 말합니다", "4번의 흐름과 어긋납니다", "또한 6번은 신원 도용의 <b>구체적인 피해 사례<\/b>를 들고 있어, 피해가 줄었다는 5번과 연결되지 않습니다", "그러므로 ③이 흐름과 관계없는 문장입니다."], "ch": [{"n": "①", "t": "①", "g": "", "ok": false, "e": ["신용 증명물(credentials)을 얻어 전자 시스템에 자신이 당신이라고 확신시킨다는 내용입니다", "2번의 ‘신용 증명물 확인으로 대체’와 이어집니다."]}, {"n": "②", "t": "②", "g": "", "ok": false, "e": ["신원 도용이 사이버 관련 사기의 한 구성 요소이고, 그 사기가 가장 흔한 범죄라는 내용입니다", "앞 문장과 자연스럽게 이어집니다."]}, {"n": "③", "t": "③", "g": "", "ok": true, "e": ["이 범죄의 보고가 급격히 감소해 왔다는 내용입니다", "사이버 관련 사기가 가장 흔한 범죄라는 4번, 그리고 피해 사례를 드는 6번과 흐름이 어긋납니다."]}, {"n": "④", "t": "④", "g": "", "ok": false, "e": ["For example로 시작해 신원 도용자가 할 수 있는 구체적인 피해 사례를 듭니다", "4번의 내용과 이어집니다."]}, {"n": "⑤", "t": "⑤", "g": "", "ok": false, "e": ["피해자가 보통 개인이라고 여겨지지만 회사들도 곤경에 빠진다는 내용으로, 신원 도용의 피해를 이어 갑니다."]}], "tr": ["신원 도용은 디지털 세계에서 다양한 형태를 띨 수 있다.", "왜냐하면 어떤 사람의 신체적 외모와 존재 같은 신원에 대한 많은 전통적인 단서들이 기계를 기반으로 한 ‘신용 증명물(신용 증명서)’ 확인으로 대체되기 때문이다.", "① 누군가가 로그인 이름, 비밀번호, 카드, (보안) 토큰들(과 같은) 당신의 신용 증명물을 얻을 수 있고, 그로 인해서(얻음으로 인해서) 전자 시스템에 그들(그 누군가)이 당신이라고 확신시킬 수 있다.", "② 이것(신원 도용)은 상당수의 사이버 관련 사기의 한 구성 요소이며, 사이버 관련 사기는 단연코 개인들을 공격하는 가장 흔한 범죄 형태이다.", "③ 사이버 보안 시스템의 진보 덕분에, 이 범죄(사이버 관련 사기)의 보고는 급격히 감소해 왔다.", "④ 예를 들어, 신원 도용자들은 당신은 절대 볼 수 없겠지만 값을 지불하게 될 물건이나 서비스를 구매할 수도 있고, 지불금을 가로챌 수도, 더 과감하게는 당신의 은행 계좌를 비워버릴 수도 있다.", "⑤ 비록 신원 도용의 피해자들은 보통 개인이라고 여겨지지만, 크고 작은 회사들 또한 종종 곤경에 빠진다."], "ps": [{"n": 1, "ch": [{"e": "Identity theft can take many <b>forms<\/b>", "k": "신원 도용은 다양한 <b>형태<\/b>를 띨 수 있다"}, {"e": "in the digital world.", "k": "디지털 세계에서."}], "easy": "디지털 세계에서는 신원 도용이 여러 모습으로 일어날 수 있어요.", "gist": "글의 화제. 이 글은 디지털 세계의 신원 도용을 이야기한다."}, {"n": 2, "ch": [{"e": "<b>That’s because<\/b> many of the traditional <b>clues<\/b> about identity", "k": "왜냐하면 신원에 대한 많은 전통적인 <b>단서<\/b>들이"}, {"e": "— someone’s physical appearance and <b>presence<\/b> —", "k": "— 어떤 사람의 신체적 외모와 <b>존재<\/b> —"}, {"e": "are <b>replaced<\/b> by", "k": "~으로 <b>대체되기<\/b> 때문이다"}, {"e": "<b>machine-based<\/b> checking of “credentials”.", "k": "기계를 기반으로 한 ‘신용 증명물’ 확인으로."}], "easy": "신원을 알려 주던 전통적인 단서(겉모습, 존재)가 이제는 기계가 ‘신용 증명물’을 확인하는 방식으로 바뀌고 있기 때문이에요.", "gist": "1번의 이유. 신원 확인 방식이 기계 기반의 ‘신용 증명물’ 확인으로 대체되고 있다는 설명이다."}, {"n": 3, "ch": [{"e": "① Someone is able to <b>acquire<\/b> your <b>credentials<\/b>", "k": "① 누군가가 당신의 <b>신용 증명물<\/b>을 <b>얻을<\/b> 수 있고"}, {"e": "— sign-on names, passwords, cards, tokens —", "k": "— 로그인 이름, 비밀번호, 카드, (보안) 토큰들 —"}, {"e": "and in so doing", "k": "그로 인해서"}, {"e": "is able to <b>convince<\/b> an electronic system", "k": "전자 시스템에 <b>확신시킬<\/b> 수 있다"}, {"e": "that they are you.", "k": "그들<span class=\"r\">(= 누군가)<\/span>이 당신이라고."}], "easy": "누군가 로그인 이름, 비밀번호, 카드, 토큰 같은 당신의 신용 증명물을 얻을 수 있고, 그렇게 해서 전자 시스템이 자기를 당신이라고 믿게 만들 수 있어요.", "gist": "①번 문장. 신용 증명물을 얻어 전자 시스템을 믿게 만드는 방식을 말한다. 2번의 ‘신용 증명물 확인’과 이어진다."}, {"n": 4, "ch": [{"e": "② <b>This<\/b> is an <b>ingredient<\/b> in large numbers of cyber-related <b>fraud<\/b>,", "k": "② 이것<span class=\"r\">(= 신원 도용)<\/span>은 상당수의 사이버 관련 <b>사기<\/b>의 한 <b>구성 요소<\/b>이며,"}, {"e": "and cyber-related fraud is <b>by o creative resolutions. / I see these limits as elements that actually help me; it is the limitations that help me free my creative imagination.", "ev_ko": [[3, "그림에는 ‘제한된 팔레트를 가지고 작업하기’라고 불리는 한 용어가 있다. 이것은 실제로 이용 가능한 것보다 더 적은 색상을 가지고 작업하려는 의도적인 선택이다."], [4, "더 적은 선택권으로 예술가는 더 쉽게 일할 수 있다. 더 적은 색상은 실제로 그녀(예술가)가 창조적인 해결을 하도록 격려한다."], [6, "나는 이러한 제한들을 실제로 나에게 도움이 되는 요소들로 여긴다. 내가 나의 창조적인 상상력을 자유롭게 하도록 도와주는 것이 바로 이 제한들이다."]], "why": ["글은 <b>제한<\/b>이 오히려 도움이 된다는 이야기를 합니다", "3번과 4번에서 화가는 <b>더 적은 색상<\/b>으로 작업할 때 오히려 창조적인 해결을 하게 됩니다", "6번에서 글쓴이는 제한들이 <b>나에게 도움이 되는 요소<\/b>이고 상상력을 자유롭게 해 준다고 말합니다", "그러므로 제목은 <b>Limitations Are Advantages<\/b>(제한이 이점이다)입니다."], "ch": [{"n": "①", "t": "Artists Are Late Bloomers", "g": "예술가는 늦게 재능을 키워나가는 사람이다(대기만성형이다)", "ok": false, "e": ["지문에 예술가가 늦게 성공한다는 내용은 없습니다."]}, {"n": "②", "t": "Limitations Are Advantages", "g": "제한이 이점이다", "ok": true, "e": ["3·4번의 제한된 팔레트, 6번의 ‘제한들이 나에게 도움이 된다’와 일치합니다."]}, {"n": "③", "t": "Inspiration Leads to Innovation", "g": "영감은 혁신으로 이어진다", "ok": false, "e": ["11번에 영감(inspiration)이 나오지만, 영감이 혁신으로 이어진다는 내용은 없습니다."]}, {"n": "④", "t": "Masterpieces Motivate Children", "g": "걸작들은 아이들에게 동기를 부여한다", "ok": false, "e": ["7~9번에서 Vik Muniz가 고전 작품을 재현하는 내용은 있지만, 걸작이 아이들에게 동기를 준다는 내용은 없습니다."]}, {"n": "⑤", "t": "Creation Makes Us More Human", "g": "창조는 우리를 더 인간적으로 만든다", "ok": false, "e": ["지문에 이런 내용은 없습니다."]}], "tr": ["예술가나 아이는 그들 앞에 있는 것은 무엇이든지 모두 도구, 장난감 또는 환경으로 그대로 받아들이며 그 시점부터 일을 진행한다.", "창조적인 과정에 대해 기운을 북돋우는 것의 일부분은 그것이 보잘것없는 재료와 초라한 발단으로부터 시작할 수 있다는 것이다.", "그림에는 ‘제한된 팔레트를 가지고 작업하기’라고 불리는 한 용어가 있다. 이것은 실제로 이용 가능한 것보다 더 적은 색상을 가지고 작업하려는 의도적인 선택이다.", "더 적은 선택권으로 예술가는 더 쉽게 일할 수 있다. 더 적은 색상은 실제로 그녀(예술가)가 창조적인 해결을 하도록 격려한다.", "디자이너로서, 나는 흔히 로고, 색상 팔레트, 슬로건 등 기존의 요소들을 가지고 작업하도록 요청받는다.", "나는 이러한 제한들을 실제로 나에게 도움이 되는 요소들로 여긴다. 내가 나의 창조적인 상상력을 자유롭게 하도록 도와주는 것이 바로 이 제한들이다.", "현대 예술가 Vik Muniz는 고전 예술작품을 모사하기 위해 평범한 재료들을 사용한다.", "그는 레오나르도 다 빈치의 〈최후의 만찬〉을 묘사하기 위해 초콜릿 시럽을 사용했고, 〈모나리자〉를 땅콩 버터와 젤리로 재현했다.", "그는 스파게티부터 장난감 병정까지 그의 주위에 있는 것을 그의 간 부사구와 that절 안의 부정 진행형 때문에 길어 보인다."}, {"t": "큰 뼈대부터 찾는다.", "sub": ["S: the U.S. Food and Drug Administration (미국 식품의약국, administration 행정기관)", "V: ruled (rule 판결하다의 과거형)", "O: that절", "뼈대 = <b>the U.S. Food and Drug Administration ruled that ~</b> (줄여서 FDA)", "In April 1997은 '1997년 4월에'"]}, {"t": "that절의 뼈대는 다음과 같다.", "sub": ["S: toothpaste manufacturers (치약 제조업체들, toothpaste 치약, manufacturer 제조업체)", "V: weren't adhering (adhere to ~을 고수하다, were not adhering 지키고 있지 않았다 — 과거진행형 부정)", "뼈대 = <b>manufacturers weren't adhering to ... guidelines</b>"]}, {"t": "<b>to ... guidelines</b>는 adhere to(~을 고수하다)에 딸린, 거의 필수에 가까운 부사구이다. <b>closely enough</b>는 '충분히 철저하게'라는 부사이고, <b>voluntary safety guidelines</b>는 '자발적 안전 지침'이다.", "sub": ["voluntary 자발적인, safety 안전, guideline 지침"]}], "sum": "FDA, 치약 업체들이 안전 지침을 철저히 지키지 않는다고 판결"}, {"i": "06", "q": "10", "s": "3", "title": "S+V+O 동사구 병렬 + in so doing", "eng": "Someone is able to acquire your credentials<sup>1</sup> — sign-on names, passwords, cards, tokens — / and in so doing<sup>2</sup> is able to convince<sup>3</sup> an electronic system that they are you.", "notes": [["1", "credential", "신원 증명물"], ["2", "in so doing", "그렇게 함으로써"], ["3", "convince", "확신시키다"]], "lit": "누군가는 당신의 신원 증명물을 얻을 수 있다 — 서명 이름, 비밀번호, 카드, 토큰 — / 그리고 그렇게 함으로써 전자 시스템에게 그들이 당신이라고 확신시킬 수 있다", "nat": "누군가가 서명 이름, 비밀번호, 카드, 토큰 같은 당신의 신원 증명물을 얻을 수 있고, 그렇게 함으로써 전자 시스템에게 자신이 당신이라고 확신시킬 수 있다.", "ana": "<b>in so doing</b>은 '그렇게 함으로써'라는 뜻의 분사구문이며, convince의 목적어로 <b>that절</b>이 이어진다.", "pe": "Someone is able to acquire your credentials<sup>1</sup> — \u0001sign-on names, passwords, cards, tokens\u0002 — / and \u0001in so doing<sup>2</sup>\u0002 is able to convince<sup>3</sup> an \u0001electronic\u0002 system that they are you.", "pk": "누군가는 당신의 신원 증명물을 얻을 수 있다 — \u0001서명 이름, 비밀번호, 카드, 토큰\u0002 — / 그리고 \u0001그렇게 함으로써\u0002 전자 시스템에게 그들이 당신이라고 확신시킬 수 있다", "core": "누군가는 신원 증명물을 얻을 수 있고, 전자 시스템에게 그들이 당신이라고 확신시킬 수 있다.", "tags": ["Someone is able to acquire your credentials: 3형식 SVO. 대시 이하 = 동격 나열: credentials를 설명", "and + is able to convince A that ~: <b>convince + O + that절</b> (4형식). electronic = 형용사: system 꾸밈. in so doing = 전치사구(부사구): convince 꾸밈 (수단)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식) and V+O(4형식)</b>으로, 한 주어에 <b>동사구가 2개 병렬</b>이다. 대시 삽입과 that절이 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Someone (누군가)", "V1: is able to acquire (be able to ~할 수 있다, acquire 얻다)", "O1: your credentials (당신의 신원 증명물, credential 신원 증명)", "V2: is able to convince (convince 확신시키다)", "O2: an electronic system (전자 시스템) + that they are you"]}, {"t": "대시 사이 <b>sign-on names, passwords, cards, tokens</b>는 credentials를 구체적으로 나열한 <b>삽입 동격</b>이다. (sign-on name 로그인 이름, password 비밀번호, card 카드, token 토큰)"}, {"t": "<b>in so doing</b>은 '그렇게 함으로써'라는 부사구이다.", "sub": ["in + 동명사 doing의 형태이고, 문형 기준: 전치사 뒤 -ing = 동명사로 본다 (so는 '그렇게')"]}, {"t": "<b>that they are you</b>는 convince 뒤에 이어지는 that절이다. 'convince A that ~'은 'A에게 ~라고 확신시키다'이다.", "sub": ["they = Someone (누군가)", "you = 당신 (신원이 도용된 사람)"]}], "sum": "누군가 신원 정보를 얻어, 시스템에 내가 곧 '나'라고 믿게 만들 수 있음"}, {"i": "07", "q": "11", "s": "3", "title": "There is + 과거분사 후치 + 동격 + 비교급", "eng": "There is a term in painting called “working with a limited palette<sup>1</sup>;” / a deliberate choice<sup>2</sup> to work with fewer colors than actually available<sup>3</sup>.", "notes": [["1", "palette", "팔레트"], ["2", "deliberate", "의도적인"], ["3", "available", "이용 가능한"]], "lit": "회화에는 '제한된 팔레트로 작업하기'라고 불리는 용어가 있다 / 실제로 이용 가능한 것보다 더 적은 색을 가지고 작업하기로 하는 의도적인 선택(인)", "nat": "회화에는 '제한된 팔레트로 작업하기'라는 용어가 있는데, 이는 실제로 이용 가능한 것보다 더 적은 색을 가지고 작업하기로 하는 의도적인 선택이다.", "ana": "세미콜론 뒤 a deliberate choice는 앞의 용어와 <b>동격</b>이며, fewer colors than actually available은 <b>비교급</b> 구문이다.", "pe": "There is a term \u0001in painting\u0002 \u0001called “working with a limited palette<sup>1</sup>\u0002;” / \u0001a deliberate choice<sup>2</sup> to work with fewer colors than actually available<sup>3</sup>\u0002.", "pk": "\u0001회화에는\u0002 \u0001'제한된 팔레트로 작업하기'라고 불리는\u0002 용어가 있다 / 실제로 이용 가능한 것보다 더 적은 색을 가지고 작업하기로 하는 의도적인 선택(인)", "core": "용어가 있다.", "tags": ["<b>There is a term</b>: there 구문 (주어는 term). in painting = 전치사구(형용사구): term 꾸밈. called ~ = 과거분사구(형용사적): term 꾸밈", "a deliberate choice ~ = 동격 명사구: 앞 용어를 설명. to work ~ = to부정사(형용사적): choice 꾸밈. fewer ~ than 비교"], "steps": [{"t": "이 문장은 <b>There is 구문(1형식)</b>이다. 세미콜론 뒤 동격 명사구가 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다. There is ~는 '~이 있다'이다.", "sub": ["S: a term (용어, term 용어)", "V: is (there is ~이 있다)", "뼈대 = <b>There is a term</b>", "in painting은 '회화에는' (painting 회화)"]}, {"t": "<b>called 'working with a limited palette'</b>는 term을 뒤에서 꾸미는 <b>과거분사구</b>이다. '~라고 불리는'이다.", "sub": ["palette 팔레트, limited 제한된"]}, {"t": "세미콜론 뒤 <b>a deliberate choice to work with fewer colors than actually available</b>는 앞의 용어를 풀어 주는 <b>동격 명사구</b>이다.", "sub": ["deliberate 의도적인, choice 선택", "to work with fewer colors는 choice를 꾸미는 to부정사 (더 적은 색으로 작업하는)"]}, {"t": "<b>than actually available</b>은 비교 대상이다. (colors that are) actually available(실제로 이용 가능한)에서 생략이 있다."}], "sum": "회화의 '제한된 팔레트' 용어, 일부러 색 수를 줄이는 선택"}, {"i": "08", "q": "12", "s": "11", "title": "S+V+O + where 부사절", "eng": "The artist sees inspiration<sup>1</sup> / where the ordinary<sup>2</sup> person sees only a limitation or an obstacle<sup>3</sup>.", "notes": [["1", "inspiration", "영감"], ["2", "ordinary", "보통의"], ["3", "obstacle", "장애물"]], "lit": "예술가는 영감을 본다 / 보통 사람이 단지 제한이나 장애물만을 보는 곳에서", "nat": "예술가는 보통 사람이 단지 제한이나 장애물만을 보는 곳에서 영감을 본다.", "ana": "<b>where</b>가 이끄는 관계부사절이 앞 문장 전체의 상황을 수식한다.", "pe": "The artist sees inspiration<sup>1</sup> / \u0001where the ordinary<sup>2</sup> person sees only a limitation or an obstacle<sup>3</sup>\u0002.", "pk": "예술가는 영감을 본다 / \u0001보통 사람이 단지 제한이나 장애물만을 보는 곳에서\u0002", "core": "예술가는 영감을 본다.", "tags": ["The artist sees inspiration: 3형식 SVO", "where절 = 관계부사절(부사적, 장소·상황): sees를 꾸밈 ('~하는 곳에서'). 안은 3형식 SVO (sees a limitation)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식) + where 부사절</b>이다. 짧지만 where의 쓰임이 핵심이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The artist (예술가)", "V: sees (see 보다)", "O: inspiration (영감)", "뼈대 = <b>The artist sees inspiration</b>"]}, {"t": "<b>where the ordinary person sees only a limitation or an obstacle</b>는 '~하는 곳에서'라는 <b>부사절</b>이다. 빼도 문장이 완결되기 때문이다.", "sub": ["S: the ordinary person (보통 사람, ordinary 평범한)", "V: sees (see 보다)", "O: only a limitation or an obstacle (단지 제한이나 장애물만, limitation 제한, obstacle 장애물)"]}, {"t": "함정: 같은 동사 see가 두 번 나오며 대비된다. 같은 상황에서 예술가는 영감을, 보통 사람은 장애물을 본다."}], "sum": "예술가는 보통 사람이 장애물만 보는 곳에서 영감을 봄"}], "qs": [{"q": "07", "type": "빈칸", "src": "2022년 6월 31번", "ans": "③", "tr": [["1", "추종자는 부하라는 지위로 정의되거나 리더의 바람을 따르는 행동으로 정의될 수 있다."], ["2", "그러나 추종자도 이끌 힘이 있다."], ["3", "추종자는 리더에게 힘을 주기도 하고 그 반대도 마찬가지다."], ["4", "이것은 Ronald Heifetz와 같은 일부 리더십 분석가들이 '추종자'라는 단어를 사용하는 것을 피하고 권력 관계에서 다른 사람들을 '시민' 또는 '구성원'으로 지칭하게 만들었다."], ["5", "Heifetz가 추종자에 대한 지나치게 단순한 시각이 오해를 낳을 수 있다고 말하는 것은 옳다."], ["6", "현대의 삶에서, 대부분의 사람들은 결국 리더이면서 동시에 추종자가 되며, 그 범주는 상당히 ___________해질 수 있다."], ["7", "추종자로서의 우리의 행동은 우리의 목표가 바뀜에 따라 바뀐다."], ["8", "만약 내가 음악에 대한 판단을 나 자신보다 당신을 더 신뢰한다면, 나는 우리가 어떤 콘서트에 갈지에 대해 당신의 리드를 따를지도 모른다(비록 지위상으로는 당신이 공식적으로 나의 부하일지라도)."], ["9", "하지만 만약 내가 낚시 전문가라면, 당신은 우리가 어디서 낚시를 할지에 대해 나의 리드를 따를지도 모른다, 우리의 공식적인 지위나 어제 내가 콘서트에 대해 당신의 리드를 따랐다는 사실과는 상관없이."]], "evh": "7·8·9번 문장", "ev": [{"en": true, "h": "Our behavior as followers changes as our objectives change. / If I trust your judgment in music more than my own, I may follow your lead ~ / But if I am an expert on fishing, you may follow my lead ~ regardless of our formal positions"}, {"en": false, "h": "목표에 따라 리더와 추종자 역할이 바뀐다는 7번과, 음악·낚시라는 서로 다른 상황에서 역할이 뒤바뀐다는 8·9번의 구체적 예시를 종합하면, 리더와 추종자의 범주는 고정되지 않고 '유동적'이라는 ③이 빈칸에 가장 적절하다."}], "opts": [{"n": "①", "t": "rigid", "a": false, "x": true, "trap": false, "e": "고정적이라는 뜻으로, 상황에 따라 역할이 바뀐다는 내용과 정반대다."}, {"n": "②", "t": "unfair", "a": false, "x": true, "trap": false, "e": "불공정함에 관한 내용이 아니다."}, {"n": "③", "t": "fluid", "a": true, "x": false, "trap": false, "e": "상황(음악·낚시)에 따라 리더와 추종자 역할이 바뀐다는 7~9번의 내용과 정확히 일치한다."}, {"n": "④", "t": "stable", "a": false, "x": true, "trap": true, "e": "안정적이라는 뜻으로, 상황에 따라 바뀐다는 내용과 반대다."}, {"n": "⑤", "t": "apparent", "a": false, "x": true, "trap": false, "e": "명백함에 관한 내용이 아니다."}], "w": [["subordinate", "부하"], ["go along with", "~을 따르다"], ["empower", "힘을 주다"], ["vice versa", "반대로"], ["analyst", "분석가"], ["constituent", "구성원"], ["wind up V-ing", "결국 ~하게 되다"], ["objective", "목표"], ["formally", "공식적으로"], ["regardless of", "~와 관계없이"]]}, {"q": "08", "type": "빈칸", "src": "2018년 9월 34번", "ans": "②", "tr": [["1", "수 세기 동안 유럽의 과학, 그리고 대체로 지식은 라틴어로 기록되었는데, 그것은 더 이상 아무도 말하지 않았고 학교에서 배워야만 했던 언어였다."], ["2", "아마 1퍼센트도 안 되는 극소수의 사람들만이 그 언어로 된 책을 읽을 수 있을 만큼 라틴어를 충분히 공부할 수단을 가졌고, 그래서 그 시대의 지적 담론에 참여할 수 있었다."], ["3", "게다가 사람들은 손으로 쓰여지고 희귀하며 비쌌던 책에 접근하지 못했다."], ["4", "유럽에서 과학적 창의성이 엄청나게 폭발적으로 증가한 것은 구텐베르크가 인쇄에 가동 활자를 사용함으로써 초래된 정보의 급속한 확산과, 담론의 매체로서 라틴어를 빠르게 대체한 일상어의 공식적 인정에 의해서 분명히 도움을 받았다."], ["5", "16세기 유럽에서 창의적인 기여를 하는 것이 훨씬 쉬워진 것은, 그 이전 세기보다 더 창의적인 사람들이 태어났기 때문이거나 사회적 지원이 더 호의적이었기 때문이 아니라, ___________ 때문이었다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "The great explosion of scientific creativity in Europe was certainly helped by the sudden spread of information brought about by Gutenberg's use of movable type in printing and by the legitimation of everyday languages"}, {"en": false, "h": "구텐베르크의 인쇄술로 정보가 급속히 확산되고 일상어가 공식화되었다는 4번의 내용을 통해, 정보에 대한 접근성이 더 널리 가능해졌다는 ②가 빈칸에 가장 적절하다."}], "opts": [{"n": "①", "t": "the number of rich people increased", "a": false, "x": true, "trap": false, "e": "부유한 사람의 수 증가에 관한 내용은 없다."}, {"n": "②", "t": "information became more widely accessible", "a": true, "x": false, "trap": false, "e": "인쇄술로 정보가 급속히 확산되었다는 4번의 내용과 정확히 일치한다."}, {"n": "③", "t": "people were able to learn Latin more easily", "a": false, "x": true, "trap": false, "e": "라틴어를 배우기 쉬워진 것이 아니라 일상어가 라틴어를 대체했다는 내용이다."}, {"n": "④", "t": "education provided equal opportunities for all", "a": false, "x": true, "trap": true, "e": "교육 기회 평등에 관한 내용은 없다."}, {"n": "⑤", "t": "new methods of scientific research were introduced", "a": false, "x": true, "trap": false, "e": "새로운 연구 방법 도입에 관한 내용이 아니다."}], "w": [["means", "수단"], ["discourse", "담론"], ["access to", "~에 대한 접근"], ["handwritten", "손으로 쓴"], ["scarce", "희귀한"], ["movable type", "가동 활자"], ["legitimation", "공식화, 합법적 인정"], ["everyday language", "일상어"], ["medium", "매체"], ["favorable", "호의적인"]]}, {"q": "09", "type": "순서", "src": "2013년 9월 38번", "ans": "②", "tr": [["1", "1997년 4월, 미국 식품의약국(FDA)은 치약 제조업체들이 자발적 안전 지침을 충분히 철저하게 지키지 않고 있다고 판결했다."], ["2", "그 결과, 이제 모든 치약 튜브는 무섭게 들리는 경고 문구를 달고 있다."], ["3", "(B) 그것은 이런 것과 비슷했다: '6세 미만 아이들의 손이 닿지 않게 하시오. 양치질을 위해 사용하는 양보다 더 많은 양이 우연히 삼켜졌다면, 즉시 의학적 도움을 받거나 독극물 관리 센터로 연락하시오.'"], ["4", "(A) 이 새로운 경고 문구가 나온 후 몇 달 동안, 치약 소비자 상담 창구는 걱정하는 부모들로부터 수백 건의 질문을 처리했고, 독극물 관리 센터도 전화로 넘쳐났다. 그들은 부모들에게 같은 말을 했다. 당신의 아이는 괜찮으며 구토를 할 수도 있고 하지 않을 수도 있다고."], ["5", "(C) 하지만 병원에 가야 할 유일한 이유는 구토가 너무 심해져서 탈수 증상이 문제가 될 때뿐이다. 맞다, 당신은 맛있는 치약을 마음껏 먹어도 메스꺼움과 설사보다 더 심각한 어떤 것도 겪지 않을 것이다."]], "evh": "(B)의 It was like this one / (A)의 In the months following the new warning", "ev": [{"en": true, "h": "It was like this one: ~ / In the months following the new warning, toothpaste consumer lines fielded hundreds of questions from worried parents"}, {"en": false, "h": "주어진 글이 말하는 '무서운 경고 문구'가 무엇인지 (B)가 구체적으로 보여준 뒤, 그 경고문 이후의 반응을 다루는 (A)가 이어지고, 마지막으로 병원에 가야 할 진짜 기준을 정리하는 (C)가 결론으로 오는 순서가 자연스럽다."}], "opts": [{"n": "①", "t": "(A)-(C)-(B)", "a": false, "x": true, "trap": false, "e": "(A)의 the new warning이 가리킬 구체적 경고 문구가 (B)에서 먼저 제시되어야 하므로 (A)가 먼저 올 수 없다."}, {"n": "②", "t": "(B)-(A)-(C)", "a": true, "x": false, "trap": false, "e": "경고 문구의 내용(B) → 그에 대한 부모들의 반응(A) → 실제 병원에 가야 할 기준(C)의 순서가 논리적으로 자연스럽다."}, {"n": "③", "t": "(B)-(C)-(A)", "a": false, "x": true, "trap": true, "e": "(C)는 (A)에서 언급된 걱정과 문의에 대한 결론이므로 (A) 뒤에 와야 한다."}, {"n": "④", "t": "(C)-(A)-(B)", "a": false, "x": true, "trap": false, "e": "(C)의 결론이 아직 제시되지 않은 경고 문구(B)보다 먼저 나올 수 없다."}, {"n": "⑤", "t": "(C)-(B)-(A)", "a": f     h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;

    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
