<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

 생물들이 큰 생물들보다 더 빠르게 열을 생산해야 한다는 것을 의미한다."], [6, "(B) 그러므로 그들은 완전히 다른 생활 방식을 이끌어야 한다(완전히 다른 생활 방식으로 살아야 한다)."], [8, "(B) 매일 단지 살아남기 위해서, 쥐는 자신의 몸무게의 약 50퍼센트를 먹어야 한다."], [9, "(C) 대조적으로, 우리 인간은 우리의 에너지 요구량을 공급하기 위해 단지 우리 몸무게의 약 2퍼센트만 먹으면 된다."], [10, "(C) 동물들이 기묘하게도 획일적인 하나의 영역은 그들(동물들)이 평생 동안 가지는 심장 박동의 수이다."], [3, "(A) 심장 박동 수의 막대한 차이에도 불구하고, 거의 모든 포유동물은 만약 그것들이 평균 수명을 산다면 약 8억 회의 심장 박동 수를 가진다."]], "why": ["생물의 크기에 따라 열 손실의 정도가 다르기 때문에 생활 방식이 달라지고, 그에 따라 심장 박동 수에 차이가 있다는 내용의 글입니다", "먼저 2번의 <b>little creatures(작은 생물들)와 large creatures(큰 생물들)<\/b>의 차이 때문에 6번의 <b>different lifestyles(다른 생활 방식)<\/b>가 나옵니다", "그래서 6번의 <b>They(그들)<\/b>는 2번의 little creatures와 large creatures를 가리키고, 주어진 글 다음에는 (B)가 옵니다", "다음으로 9번의 <b>by contrast(대조적으로)<\/b>가 쥐의 에너지 요구량을 말하는 8번과 인간의 에너지 요구량을 대조하므로 (B) 다음에는 (C)가 옵니다", "마지막으로 10번이 꺼낸 일생 동안의 심장 박동 수 이야기를 (A)의 3번이 이어서 설명하므로 (C) 다음에는 (A)가 옵니다", "따라서 정답은 ③입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)의 3번은 <b>Despite the vast differences in heart rates<\/b>(심장 박동 수의 막대한 차이에도 불구하고)로 시작합니다", "이 ‘차이’는 (B)의 7번(코끼리 30회, 쥐 600회)에서 먼저 보여 줘야 이해됩니다", "(A)를 주어진 글 바로 뒤에 두면 가리킬 내용이 앞에 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": false, "e": ["(B)의 8번(쥐는 몸무게의 약 50퍼센트를 먹는다) 바로 뒤에 <b>by contrast<\/b>(대조적으로)로 시작하는 (C)의 9번(인간은 약 2퍼센트)이 와야 합니다", "사이에 (A)가 끼면 이 대조가 끊깁니다", "또 (A)의 3번은 (C)의 10번이 꺼낸 ‘일생 동안의 심장 박동 수’를 이어받는 내용이라 (C) 뒤에 와야 합니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": true, "e": ["2번의 작은 생물과 큰 생물을 6번 <b>They<\/b>가 받아 (B)가 오고, 8번(쥐)과 9번(<b>by contrast<\/b>, 인간)이 이어져 (C)가 옵니다", "10번이 꺼낸 일생 동안의 심장 박동 수를 3번 이후의 (A)가 이어받습니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C)의 9번은 <b>by contrast<\/b>(대조적으로)라서 대조할 앞 내용이 있어야 합니다", "쥐가 몸무게의 약 50퍼센트를 먹는다는 8번은 (B)에 있는데 (B)가 뒤에 옵니다", "또 주어진 글의 작은 생물과 큰 생물을 받는 6번 <b>They<\/b>도 (B)에 있으므로 (B)가 먼저 와야 합니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(C)를 먼저 두면 9번의 <b>by contrast<\/b>가 대조할 8번이 뒤에 놓입니다", "또 6번의 <b>They< ) (a)그녀(the old woman)가 나에게 다가왔다."], [10, "(C)(1) 그녀는 영어를 조금 할 줄 알았고, 나에게 선로에서 사고가 발생했다고 말했다."], [12, "(C)(3) 그 노부인은 (c)그녀(the woman in the ticket booth)에게서 기차 노선도와 시간표를 얻었고 나에게 돌아와서 그곳에 가려면 우리가 서너 번 기차를 (갈아)타야 할 거라고 말해주었다."], [6, "(B)(1) 그래서 우리는 한 기차역에서 다른 기차역으로 갔고, 그러는 동안 서로에 대해 알아갔다."], [9, "(B)(4) 나는 (b)그녀(the old woman)에게 그녀가 얼마나 더 가야 하는지 물었고, 그녀의 집이 반대 방향으로 두 시간 거리에 있다는 것이 드러났다."], [14, "(D)(1) 그녀는 단지 내가 (잘) 도착하는지를 확실히 하기 위해서 기차를 갈아탔고 그 모든 길을 여행했다."]], "why": ["(A)의 마지막 (A)(5)에서 노부인이 ‘나’에게 다가오고, (C)의 첫 문장 (C)(1) <b>She spoke some English<\/b>(그녀는 영어를 조금 할 줄 알았다)가 그 노부인의 말로 바로 이어집니다", "(C)(3)에서 노부인이 서너 번 <b>기차를 갈아타야 한다<\/b>고 알려 주고, (B)의 첫 문장 (B)(1) <b>So we went from one train station to the next<\/b>(그래서 우리는 한 기차역에서 다른 기차역으로 갔다)가 그 이동을 이어받습니다", "(B)(4)에서 노부인의 집이 반대 방향으로 두 시간 거리라는 사실이 드러난 뒤에, (D)의 첫 문장 (D)(1) <b>She had jumped from train to train and traveled the whole way just to make sure I made it<\/b>(그녀는 단지 내가 도착하는지를 확실히 하기 위해 기차를 갈아타며 그 모든 길을 여행했다)이 이어집니다", "따라서 (C) – (B) – (D) 순서입니다."], "ch": [{"n": "①", "t": "(B) – (D) – (C)", "g": "", "ok": false, "e": ["(A) 바로 뒤에 (B)가 오면 <b>So we went from one train station to the next<\/b>(그래서 우리는 한 기차역에서 다른 기차역으로 갔다)의 <b>So<\/b>가 이어받을 내용이 없습니다", "기차를 갈아타야 한다고 알려 주는 (C)(3)이 먼저 나와야 합니다."]}, {"n": "②", "t": "(C) – (B) – (D)", "g": "", "ok": true, "e": ["(A)(5)에서 노부인이 다가옴 → (C)(1) 노부인이 영어로 사고를 알려 줌, (C)(3) 서너 번 갈아타야 함 → (B)(1) 그렇게 역에서 역으로 이동함 → (D)(1) 그녀가 끝까지 함께한 이유가 드러남, 순서로 자연스럽게 이어집니다."]}, {"n": "③", "t": "(C) – (D) – (B)", "g": "", "ok": false, "e": ["(D)(1)의 <b>She had jumped from train to train and traveled the whole way<\/b>(그녀는 기차를 갈아타며 그 모든 길을 여행했다)는 함께 이동한 여정을 되돌아보는 문장입니다", "여정이 나오는 (B)가 (D)보다 먼저 와야 합니다."]}, {"n": "④", "t": "(D) – (B) – (C)", "g": "", "ok": false, "e": ["(D)(1)은 <b>jumped from train to train<\/b>(기차를 갈아탔다)처럼 이미 지나간 여정을 되짚는 문장입니다", "기차를 갈아타야 한다는 (C)(3)과 이동·작별이 나오는 (B)가 먼저 나온 뒤에 와야 하므로, (A) 바로 뒤에 올 수 없습니다."]}, {"n": "⑤", "t": "(D) – (C) – (B)", "g": "", "ok": false, "e": ["(D)(1)은 이미 지나간 여정을 되짚는 문장이라 (A) 바로 뒤에 오면 되짚을 내용이 아직 없습니다", "또 (D)(2)에서 ‘나’가 <b>You are the nicest person I’ve ever met<\/b>(당신은 제가 만난 사람 중 가장 친절한 사람이에요)라고 말하는 이유가 (B)의 여정 뒤에 나와야 이해됩니다."]}], "tr": ["(A)(1) 나는 스위스에서 기차를 타고 있었다.", "(A)(2) 기차가 정차했고, 스피커 너머 차장의 목소리가 독일어, 그리고 이탈리아어, 그 다음에 프랑스어로 메시지를 전했다.", "(A)(3) 나는 (나의) 휴가 이전에 그 언어들 중 어떠한 것도 배우지 않는 실수를 했다.", "(A)(4) 그 안내 (방송) 후 모두가 기차에서 내리기 시작했고, 한 노부인이 내가 혼란스러워하고 스트레스를 받는 것을 보았다.", "(A)(5) (a)그녀(the old woman)가 나에게 다가왔다.", "(B)(1) 그래서 우리는 한 기차역에서 다른 기차역으로 갔고, 그러는 동안 서로에 대해 알아갔다.", "(B)(2) 그것은 총 2.5시간의 여정이었고, 우리가 마침내 목적지에 도착했을 때 우리는 내려서 작별 인사를 했다.", "(B)(3) 나는 로마로 가는 기차를 타는 시간에 맞춰 도착했고, 그녀는 나에게 그녀도 타야 할 기차가 있다고 말했다.", "(B)(4) 나는 (b)그녀(the old woman)에게 그녀가 얼마나 더 가야 하는지 물었고, 그녀의 집이 반대 방향으로 두 시간 거리에 있다는 것이 드러났다.", "(C)(1) 그녀는 영어를 조금 할 줄 알았고, 나에게 선로에서 사고가 발생했다고 말했다.", "(C)(2) 그녀는 나에게 내가 어디로 가려고 하는지 물었고, 그 다음 그녀는 기차에서 내려 티켓 부스에 있는 여성에게 갔다.", "(C)(3) 그 노부인은 (c)그녀(the woman in the ticket booth)에게서 기차 노선도와 시간표를 얻었고 나에게 돌아와서 그곳에 가려면 우리가 서너 번 기차를 (갈아)타야 할 거라고 말해주었다.", "(C)(4) 내가 혼자서 그것을 알아내는 것은 가망이 없었을 것이기 때문에 나는 (d)그녀(the old woman)가 같은 방향으로 간다는 것이 정말 기뻤다.", "(D)(1) 그녀는 단지 내가 (잘) 도착하는지를 확실히 하기 위해서 기차를 갈아탔고 그 모든 길을 여행했다.", "(D)(2) “당신은 제가 만나 본 (사람 중에서) 가장 친절한 사람이에요.”라고 나는 말했다.", "(D)(3) 그녀는 부드럽게 미소 짓고는 나를 안아주었고 (내가) 기차를 놓치지 않으려면 서두르는 게 좋겠다고 나에게 말했다.", "(D)(4) 이 여성은 단지 그녀의 나라를 방문한 혼란스러워하는 여행객을 돕기 위해 그녀의 집에서 몇 시간이나 떨어진 곳으로 (e)그녀(the old woman)를 데려가는 기차에 앉아 온종일을 보냈다.", "(D)(5) 내가 아무리 많은 나라를 방문하거나 아무리 많은 장소를 보더라도, 나는 세계에서 가장 아름다운 나라는 스위스라고 항상 말한다."], "ps": [{"n": 1, "ch": [{"e": "(A)(1) I was <b>on a train<\/b>", "k": "(A)(1) 나는 기차를 타고 있었다"}, {"e": "in Switzerland.", "k": "스위스에서."}], "easy": "나는 스위스에서 기차를 타고 있었어요.", "gist": "이야기의 배경. 스위스의 기차 안이다."}, {"n": 2, "ch": [{"e": "(A)(2) The train <b>came to a stop,<\/b>", "k": "(A)(2) 기차가 <b>정차했고,<\/b>"}, {"e": "and the conductor’s voice", "k": "차장의 목소리가"}, {"e": "over the loudspeaker", "k": "스피커 너머"}, {"e": "delivered a message", "k": "메시지를 전했다"}, {"e": "in German, then Italian, then French.", "k": "독일어, 그 다음 이탈   });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
