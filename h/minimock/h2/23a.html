<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}

.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}

.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}

.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}

.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}

.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}

.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}

.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}

/* ---- 새 직독직해·해설 화면 ---- */

y are doing</b>는 beliefs를 꾸미는 전치사구(형용사구)이다. about의 목적어가 <b>what절(명사절)</b>이다.", "sub": ["S: they (= scientists, 과학자들), V: are doing, O: what (무엇)"]}, {"t": "<b>when they use them</b>은 <b>부사절(때)</b>이다. are doing을 꾸민다.", "sub": ["S: they, V: use (사용하다), O: them (= These elements, 이 요소들)"]}], "sum": "공유된 관행을 쓴다고 과학자들의 믿음까지 통일된 것은 아님"}, {"i": "06", "q": "04", "s": "5", "title": "S+V+C(to부정사) + enable A to V + without 동명사", "eng": "Indeed, one role of a paradigm is / to enable<sup>1</sup> scientists to work successfully / without having to provide a detailed account<sup>2</sup> of what they are doing or what they believe about it.", "notes": [["1", "enable", "~할 수 있게 하다"], ["2", "account", "설명"]], "lit": "실제로 패러다임의 한 가지 역할은 ~이다 / 과학자들이 성공적으로 일할 수 있게 해 주는 것 / 그들이 무엇을 하고 있는지 또는 그것에 관해 무엇을 믿는지에 대한 자세한 설명을 제공해야 할 필요 없이", "nat": "실제로 패러다임의 한 가지 역할은, 자기가 무엇을 하고 있고 그것에 관해 무엇을 믿는지 일일이 설명하지 않고도 과학자들이 성공적으로 연구할 수 있게 해 주는 것이다.", "ana": "<b>enable A to V</b>는 'A가 ~할 수 있게 하다'로, 목적격보어 자리에 to부정사가 오는 대표 동사이다. 뒤의 <b>without having to provide</b>는 전치사 without 뒤에 동명사 having이 온 형태이고, 그 안의 have to가 '~해야 한다'는 의무를 담고 있다. 맨 끝에는 <b>what</b>절 두 개가 or로 병렬되어 of의 목적어가 된다.", "pe": "\u0001Indeed\u0002, one role \u0001of a paradigm\u0002 is / to enable<sup>1</sup> scientists to work \u0001successfully\u0002 / \u0001without having to provide a detailed account<sup>2</sup> of what they are doing or what they believe about it\u0002.", "pk": "\u0001실제로\u0002 \u0001패러다임의\u0002 한 가지 역할은 ~이다 / 과학자들이 \u0001성공적으로\u0002 일할 수 있게 해 주는 것 / \u0001그들이 무엇을 하고 있는지 또는 그것에 관해 무엇을 믿는지에 대한 자세한 설명을 제공해야 할 필요 없이\u0002", "core": "패러다임의 한 가지 역할은 과학자들이 일할 수 있게 해 주는 것이다.", "tags": ["Indeed = 부사: 문장 수식. 주어 one role + 동사 is. of a paradigm = 전치사구(형용사구): role 수식", "<b>보어</b> to enable ~ (명사적 to부정사). enable + 목적어 scientists + 목적격보어 to work (5형식). successfully = 부사: work 수식", "without ~ = 전치사구(부사구): work 수식 (조건·상황)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이고 보어가 <b>to부정사</b>이다. 그 안에 5형식 동사와 without 구문이 있어 길어졌다."}, {"t": "뼈대부터 찾는다.", r, which was published in 1994."}, {"en": false, "h": "문장 맨 앞의 <b>With Jan Novák</b>은 '~와 함께'라는 뜻이다. 즉 자서전은 <b>공동 집필</b>이지 단독 집필이 아니다. 강조하려고 전치사구를 문두로 보낸 형태라, 앞부분을 흘려 읽으면 그대로 함정에 걸린다."}], "opts": [{"n": "①", "t": "Prague 근교의 작은 마을에서 성장했다.", "a": false, "x": true, "trap": false, "e": "문장 2 Forman grew up in a small town near Prague와 일치한다."}, {"n": "②", "t": "Prague 대학교에서 영화를 공부했다.", "a": false, "x": true, "trap": false, "e": "문장 4 studied film at the film school of the University of Prague와 일치한다."}, {"n": "③", "t": "미국으로 이주한 후에도 계속 영화를 만들었다.", "a": false, "x": true, "trap": false, "e": "문장 6 he emigrated to the U.S. and continued to make films와 일치한다."}, {"n": "④", "t": "영화 Amadeus로 오스카 최고 감독상을 수상했다.", "a": false, "x": true, "trap": true, "e": "문장 8 swept eight Oscars including one for best director와 일치한다."}, {"n": "⑤", "t": "Turnaround: A Memoir를 단독으로 집필했다.", "a": true, "x": false, "trap": false, "e": "With Jan Novák이 앞에 있으므로 공동 집필이다. '단독으로'가 사실과 다르다."}], "w": [["Academy Award", "아카데미상"], ["filmmaker", "영화 제작자"], ["orphan", "고아로 만들다"], ["relative", "친척"], ["throughout", "~에 걸쳐"], ["act as", "~로 활동하다"], ["assistant director", "조감독"], ["emigrate", "이주하다"], ["category", "부문"], ["celebration", "기리기, 기념"], ["sweep", "휩쓸다"], ["autobiography", "자서전"], ["memoir", "회고록"]]}, {"q": "03", "type": "글의 제목", "src": "2014년 11월 21번", "ans": "④", "tr": [["1", "종이는 정보를 보존하는 데에만 유용한 것이 아니다."], ["2", "포장 재료로서의 역할에서, 종이는 정보를 감추는 일도 잘 해낸다."], ["3", "설렘과 기대감을 그 무엇보다 잘 만들어 내는 이 재료가 없다면 생일은 어떤 모습일까?"], ["4", "천에 싸인 선물이나 찬장에 숨겨 둔 선물도 받아 봤지만, 포장지가 주는 마력을 지닌 것은 없었다."], ["5", "선물은 종이에 싸여 있지 않으면 정말로 선물이 아니다."], ["6", "물건을 감추고 드러냄으로써 그 물건을 선물로 바꾸고, 주고받는 행위를 의례로 만드는 것이 바로 종이다."], ["7", "이것은 단순한 문화적 연상이 아니다."], ["8", "그 재료는 이 역할에 이상적으로 들어맞게 하는 근본적인 속성을 지니고 있다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "It is the paper that, by concealing and revealing an object, ritualizes the act of giving and receiving, turning that object into a gift."}, {"en": false, "h": "<b>It is the paper that ~</b>는 the pa function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });

  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){

}

}

"><b>donation</b>기부</button><button type=\"button\" class=\"wdb\" data-w=\"drop off\" data-m=\"가져다 놓다\"><b>drop off</b>가져다 놓다</button><button type=\"button\" class=\"wdb\" data-w=\"non-perishable\" data-m=\"상하지 않는\"><b>non-perishable</b>상하지 않는</button><button type=\"button\" class=\"wdb\" data-w=\"distribute\" data-m=\"나누어 주다\"><b>distribute</b>나누어 주다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 문장 맨 앞에 숨은 <b>With</b>(~와 함께) 같은 짧은 전치사구가 ‘단독’ 같은 선택지 말과 부딪히는지 꼭 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 2번</em>grew up in a small town near Prague(프라하 근처 작은 마을에서 자랐다) → 같음</span><span><em>② ↔ 4번</em>studied film(영화를 공부했다) at the University of Prague(프라하 대학에서) → 같음</span><span><em>③ ↔ 6번</em>미국으로 이주(emigrated)한 뒤 continued to make films(계속 영화를 만들었다) → 같음</span><span><em>④ ↔ 8번</em>Amadeus(아마데우스) swept eight Oscars including one for best director(최우수 감독상 포함 8개 휩쓸었다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ⑤를 9번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>⑤의 ‘단독으로’를 9번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 앞부분 · 결정적 단서</span><div class=\"en\"><mark>With Jan Novák</mark>, Forman wrote his autobiography, …</div><p class=\"ko\"><mark>Jan Novák과 함께</mark>, Forman은 그의 자서전을 집필했고, …</p></div><div class=\"ck-via\"><i>▼</i><span>함께 쓴 그 자서전이 바로 ⑤의 책이에요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 뒷부분 · 무슨 책인지</span><div class=\"en\">… Turnaround: A Memoir, which was published in 1994.</div><p class=\"ko\">… Turnaround: A Memoir를, 그것은 1994년에 출판되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">Turnaround(전환): A Memoir(회고록)를 단독으로 집필했다.<small>9번: 얀 노바크(Jan Novák)와 함께 쓴 공동 집필이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">영화 Amadeus로 오스카 최고 감독상을 수상했다.</span><span class=\"why\">8번 문장이 길어서 헷갈리지만, swept eight Oscars(8개의 오스카를 휩쓸었다) including one for best director(최우수 감독상 하나를 포함하여)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Prague 근교의 작은 마을에서 성장했다.</span><span class=\"why\">2번 grew up in a small town near Prague(프라하 근처의 작은 마을에서 자랐다)와 같아요. near(근처) = 근교예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Prague 대학교에서 영화를 공부했다.</span><span class=\"why\">4번 studied film at the film school of the University of Prague(프라하 대학의 영화 학교에서 영화를 공부했다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">미국으로 이주한 후에도 계속 영화를 만들었다.</span><span class=\"why\">6번 Later(나중에) 미국으로 이주(emigrated)한 뒤 continued to make films(계속해서 영화를 만들었다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Even though he won many Academy Awards,</div><div class=\"k\">많은 아카데미상을 수상하긴 했지만,</div></div><div class=\"rc\"><div class=\"e\">Miloš Forman was not a U.S. born filmmaker.</div><div class=\"k\">Miloš Forman은 미국에서 태어난 영화 제작자는 아니었다.</div></div><div class=\"rnat\">많은 아카데미상을 받기는 했지만, Miloš Forman은 미국에서 태어난 영화 제작자는 아니었다.</div><div class=\"rst\">영화 동아리에서 감독 소개 카드를 만든다고 해 봐요. 첫 칸: 아카데미상(Academy Awards)을 많이 받았지만 미국 태생은 아님. 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Forman grew up</div><div class=\"k\">Forman은 자랐다</div></div><div class=\"rc\"><div class=\"e\">in a small town near Prague.</div><div class=\"k\">Prague 근처의 작은 마을에서.</div></div><div class=\"rnat\">Forman은 Prague 근처의 작은 마을에서 자랐다.</div><div class=\"rst\">둘째 칸: 프라하 근처 작은 마을에서 자람. 지문 2번의 <b>프라하 근처</b>(near Prague)이고, 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Orphaned when his parents died</div><div class=\"k\">그의 부모가 사망했을 때 고아가 되었기 때문에</div></div><div class=\"rc\"><div class=\"e\">during World War II,</div><div class=\"k\">제2차 세계 대전 중에,</div></div><div class=\"rc\"><div class=\"e\">he was raised by his relatives.</div><div class=\"k\">그는 친척들에 의해 길러졌다.</div></div><div class=\"rnat\">제2차 세계 대전 중 부모를 잃고 고아가 된 그는 친척들 손에서 자랐다.</div><div class=\"rst\">셋째 칸: 제2차 세계 대전 때 부모님을 잃고 친척 손에 자람. 지문 3번 그대로 적어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In the 1950s,</div><div class=\"k\">1950년대에,</div></div><div class=\"rc\"><div class=\"e\">Forman studied film</div><div class=\"k\">Forman은 영화를 공부했다</div></div><div class=\"rc\"><div class=\"e\">at the film school of the University of Prague.</div><div class=\"k\">Prague 대학의 영화 학교에서.</div></div><div class=\"rnat\">1950년대에 Forman은 Prague 대학의 영화 학교에서 영화를 공부했다.</div><div class=\"rst\">넷째 칸: 1950년대에 프라하 대학 영화 학교에서 공부함. 지문 4번 = 선택지 ②예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Throughout the late 1950s and early 1960s,</div><div class=\"k\">1950년대 후반과 1960년대 초반에 걸쳐,</div></div><div class=\"rc\"><div class=\"e\">Forman acted as either writer or assistant director</div><div class=\"k\">Forman은 작가 또는 조감독으로 활동했다</div></div><div class=\"rc\"><div class=\"e\">on several films.</div><div class=\"k\">몇 편의 영화에서.</div></div><div class=\"rnat\">1950년대 후반과 1960년대 초반에 걸쳐, Forman은 몇 편의 영화에서 작가 또는 조감독으로 활동했다.</div><div class=\"rst\">다섯째 칸: 1950년대 후반~60년대 초, 여러 영화에서 작가나 조감독으로 일함. 지문 5번의 경력이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Later,</div><div class=\"k\">나중에,</div></div><div class=\"rc\"><div class=\"e\">he emigrated to the U.S.</div><div class=\"k\">그는 미국으로 이주했고</div></div><div class=\"rc\"><div class=\"e\">and continued to make films.</div><div class=\"k\">계속해서 영화를 만들었다.</div></div><div class=\"rnat\">나중에 그는 미국으로 이주해 계속 영화를 만들었다.</div><div class=\"rst\">여섯째 칸: 나중에 미국으로 건너가서도 영화를 계속 만듦. 지문 6번 = 선택지 ③이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">In 1975,</div><div class=\"k\">1975년에,</div></div><div class=\"rc\"><div class=\"e\">he directed One Flew over the Cuckoo’s Nest,</div><div class=\"k\">그는 One Flew over the Cuckoo’s Nest를 감독했고,</div></div><div class=\"rc\"><div class=\"e\">which became only the second film in history</div><div class=\"k\">그것은 역사상 두 번째 영화가 되었다</div></div><div class=\"rc\"><div class=\"e\">to win Oscars in all the five major categories.</div><div class=\"k\">주요 5개 부문 모두에서 Oscar를 수상한.</div></div><div class=\"rnat\">1975년에 그는 〈뻐꾸기 둥지 위로 날아간 새〉를 감독했고, 이 작품은 주요 5개 부문을 모두 석권한 역사상 두 번째 영화가 되었다.</div><div class=\"rst\">일곱째 칸: 1975년 감독한 영화가 주요 5개 부문 오스카를 다 받은 역사상 두 번째 영화가 됨. 지문 7번이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Afterward,</div><div class=\"k\">이후,</div></div><div class=\"rc\"><div class=\"e\">the movie Amadeus,</div><div class=\"k\">영화 Amadeus는,</div></div><div class=\"rc\"><div class=\"e\">a celebration of the genius of Mozart,</div><div class=\"k\">모차르트의 천재성을 기리는,</div></div><div class=\"rc\"><div class=\"e\">which he also directed,</div><div class=\"k\">그가 역시 감독한,</div></div><div class=\"rc\"><div class=\"e\">swept eight Oscars</div><div class=\"k\">8개의 Oscar를 휩쓸었다</div></div><div class=\"rc\"><div class=\"e\">including one for best director.</div><div class=\"k\">최우수 감독상 하나를 포함하여.</div></div><div class=\"rnat\">그 후 그가 역시 감독한, 모차르트의 천재성을 기리는 영화 〈아마데우스〉는 최우수 감독상을 포함해 오스카 8개 부문을 휩쓸었다.</div><div class=\"rst\">여덟째 칸: 모차르트 영화 아마데우스(Amadeus)로 감독상 포함 오스카 8개를 휩쓺. 지문 8번 = 선택지 ④예요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">With Jan Novák,</span></div><div class=\"k\"><span class=\"cw\">Jan Novák과 함께,</span></div></div><div class=\"rc\"><div class=\"e\">Forman wrote his autobiography,</div><div class=\"k\">Forman은 그의 자서전을 집필했고,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Turnaround: A Memoir</span>,</div><div class=\"k\"><span class=\"cw\">Turnaround: A Memoir</span>를,</div></div><div class=\"rc\"><div class=\"e\">which was published in 1994.</div><div class=\"k\">그것은 1994년에 출판되었다.</div></div><div class=\"rnat\">Jan Novák과 함께, Forman은 자서전 〈Turnaround: A Memoir〉를 집필했고 그것은 1994년에 출판되었다.</div><div class=\"rst\">마지막 칸이 핵심! 자서전은 <b>얀 노바크와 함께</b>(With Jan Novák) 썼어요. 그래서 지문 9번과 ⑤ “단독”이 어긋나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"filmmaker\" data-m=\"영화 제작자\"><b>filmmaker</b>영화 제작자</button><button type=\"button\" class=\"wdb\" data-w=\"relative\" data-m=\"친척\"><b>relative</b>친척</button><button type=\"button\" class=\"wdb\" data-w=\"assistant director\" data-m=\"조감독\"><b>assistant director</b>조감독</button><button type=\"button\" class=\"wdb\" data-w=\"emigrate\" data-m=\"이주하다\"><b>emigrate</b>이주하다</button><button type=\"button\" class=\"wdb\" data-w=\"orphan\" data-m=\"고아로 만들다\"><b>orphan</b>고아로 만들다</button><button type=\"button\" class=\"wdb\" data-w=\"autobiography\" data-m=\"자서전\"><b>autobiography</b>자서전</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 글쓴이가 <b>강조 구문</b>까지 써서 힘준 문장을 찾으세요. 6번 <b>It is the paper that</b>(~하는 것은 바로 종이이다)가 “종이가 물건을 선물로 바꾼다”고 결론을 내려요.</p><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 다른 포장과 비교</span><div class=\"en\">I have received presents wrapped in cloth, or hidden in a cupboard, but <mark>nothing has the magic of wrapping paper</mark>.</div><p class=\"ko\">저는 천에 싸인, 혹은 찬장에 숨겨진 선물을 받아 봤습니다, 하지만 <mark>그 무엇도 포장지의 마력을 지니고 있지 않다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>but(하지만) 뒤 ‘종이만의 마력’을 더 세게 못 박아요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 종이 = 선물의 조건</span><div class=\"en\">A present really isn’t a present <mark>unless it is wrapped in a paper</mark>.</div><p class=\"ko\"><mark>그것(= 선물)이 종이에 싸여 있지 않다면</mark> 선물은 정말로 선물이 아니다.</p></div><div class=\"ck-via\"><i>▼</i><span>강조 구문으로 “선물로 만드는 것은 바로 종이”라고 결론 내려요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 결론</span><div class=\"en\"><mark>It is the paper that</mark>, by concealing and revealing an object, … <mark>turning that object into a gift</mark>.</div><p class=\"ko\">물건을 감추고 드러냄으로써 <mark>그 물건을 선물로 바꾸고</mark>, 주고받는 행위를 의례로 만드는 것이 <mark>바로 종이</mark>다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">Paper(종이): What Makes an Object a Present(물건을 선물로 만드는 것)<small>6번의 종이(paper)와 선물(gift)을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Various Useful Materials for Wrapping(포장에 쓰이는 다양하고 유용한 재료들)</span><span class=\"why\">[범위 넓음] 4번에 천(cloth)·찬장(cupboard)이 나오지만, 그건 종이만 못하다는 비교예요. 글은 여러 재료가 아니라 종이 하나만 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Conflicting Views on Wrapping(포장에 관한 상반된 견해들)</span><span class=\"why\">[지문에 없음] 포장을 두고 서로 다른 의견이 나오지 않아요. 글쓴이는 처음부터 끝까지 종이 포장을 칭찬해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Wrapping(포장): An Old Custom We Should End(우리가 끝내야 할 오래된 관습)</span><span class=\"why\">[반대] 5번에서 종이에 싸이지 않으면 선물이 아니라고 해요. 포장을 없애자는 게 아니라 꼭 필요하다는 글이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">How Can We Choose Proper Wrapping Paper(알맞은 포장지를 어떻게 고를 수 있을까)?</span><span class=\"why\">[지문에 없음] 어떤 포장지를 고르라는 방법은 한 줄도 없어요. 8번도 종이의 속성이 포장에 딱 맞다는 말일 뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Paper is not only useful</div><div class=\"k\">종이는 단지 유용한 것만은 아니다</div></div><div class=\"rc\"><div class=\"e\">for preserving information.</div><div class=\"k\">정보를 보존하는 것을 위해서만.</div></div><div class=\"rnat\">종이는 정보를 보존하는 데에만 유용한 것이 아니다.</div><div class=\"rst\">친구 생일 선물을 준비한다고 떠올려 봐요. 종이는 공책처럼 글을 남기는 데만 쓰이는 게 아니에요. 지문 1번도 정보 보존만이 아니라고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In its role as a wrapping material,</div><div class=\"k\">포장 재료로서의 역할에서,</div></div><div class=\"rc\"><div class=\"e\">paper also does a good job of hiding it.</div><div class=\"k\">종이는 또한 그것(= 정보)을 감추는 것도 잘한다.</div></div><div class=\"rnat\">포장 재료로서의 역할에서, 종이는 정보를 감추는 일도 잘 해낸다.</div><div class=\"rst\">포장지로 감싸면 안에 뭐가 들었는지 딱 가려 줘요. 지문 2번도 종이가 내용을 <b>감추는</b> 일을 잘한다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">What would birthdays be like</div><div class=\"k\">생일은 어떤 모습일까</div></div><div class=\"rc\"><div class=\"e\">without this material,</div><div class=\"k\">이 재료(= 종이)가 없다면,</div></div><div class=\"rc\"><div class=\"e\">which performs the role of building excitement and anticipation</div><div class=\"k\">흥분감과 기대감을 만드는 역할을 수행하는</div></div><div class=\"rc\"><div class=\"e\">better than all others?</div><div class=\"k\">다른 어떤 것들보다도 더 잘?</div></div><div class=\"rnat\">설렘과 기대감을 그 무엇보다 잘 만들어 내는 이 재료가 없다면 생일은 어떤 모습일까?</div><div class=\"rst\">포장지 없는 생일 파티는 “뭐지?” 하는 두근거림이 없겠죠. 지문 3번도 종이가 기대감을 가장 잘 만든다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I have received presents</div><div class=\"k\">저는 선물을 받아 봤습니다</div></div><div class=\"rc\"><div class=\"e\">wrapped in cloth,</div><div class=\"k\">천에 싸인,</div></div><div class=\"rc\"><div class=\"e\">or hidden in a cupboard,</div><div class=\"k\">혹은 찬장에 숨겨진,</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">nothing has the magic of wrapping paper.</span></div><div class=\"k\">하지만 <span class=\"cw\">그 무엇도 포장지의 마력을 지니고 있지 않다.</span></div></div><div class=\"rnat\">천에 싸인 선물이나 찬장에 숨겨 둔 선물도 받아 봤지만, 포장지가 주는 마력을 지닌 것은 없었다.</div><div class=\"rst\">천 주머니나 찬장에 숨긴 선물도 받아 봤지만, 포장지만큼 설레진 않았어요. 지문 4번 <b>포장지의 마력</b>(magic of wrapping paper)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">A present really isn’t a present</div><div class=\"k\">선물은 정말로 선물이 아니다</div></div><div class=\"rc\"><div class=\"e\">unless it is wrapped in a paper.</div><div class=\"k\">그것(= 선물)이 종이에 싸여 있지 않다면.</div></div><div class=\"rnat\">선물은 종이에 싸여 있지 않으면 정말로 선물이 아니다.</div><div class=\"rst\">포장 안 한 선물을 그냥 건네면 선물 같지가 않아요. 지문 5번도 <b>종이에 싸여 있지 않으면</b>(unless) 선물이 아니라고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">It is the paper that,</span></div><div class=\"k\"><span class=\"cw\">~은 바로 종이이다,</span></div></div><div class=\"rc\"><div class=\"e\">by concealing and revealing an object,</div><div class=\"k\">물건을 숨기고 드러냄으로써,</div></div><div class=\"rc\"><div class=\"e\">ritualizes the act of giving and receiving,</div><div class=\"k\">주고받는 행위를 의례화하며,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">turning that object into a gift.</span></div><div class=\"k\"><span class=\"cw\">그 물건을 선물로 변화시키며.</span></div></div><div class=\"rnat\">물건을 감추고 드러냄으로써 그 물건을 선물로 바꾸고, 주고받는 행위를 의례로 만드는 것이 바로 종이다.</div><div class=\"rst\">포장지를 찢어 열 때 비로소 ‘선물’이 돼요. 지문 6번이 핵심! <b>바로 종이가</b> 물건을 선물로 바꿔요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">This is not just a cultural association.</div><div class=\"k\">이것(= 종이에 싸인 물건을 진정한 선물로 여기는 것)은 단지 문화적인 연상은 아니다.</div></div><div class=\"rnat\">이것은 단순한 문화적 연상이 아니다.</div><div class=\"rst\">이건 그냥 우리 반만의 습관이 아니에요. 지문 7번도 단순한 문화적 연상이 아니라고 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The material has fundamental properties</div><div class=\"k\">그 재료(= 종이)는 근본적인 속성을 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">that make it ideal for this role.</div><div class=\"k\">그것(= 종이)을 이 역할(= 포장)에 가장 이상적으로 만드는.</div></div><div class=\"rnat\">그 재료는 이 역할에 이상적으로 들어맞게 하는 근본적인 속성을 지니고 있다.</div><div class=\"rst\">종이는 접기 쉽고, 가리고, 찢으면 열려서 포장에 딱 맞아요. 지문 8번도 종이의 근본 속성이 이 역할에 이상적이라고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"wrapping material\" data-m=\"포장 재료\"><b>wrapping material</b>포장 재료</button><button type=\"button\" class=\"wdb\" data-w=\"anticipation\" data-m=\"기대감\"><b>anticipation</b>기대감</button><button type=\"button\" class=\"wdb\" data-w=\"conceal\" data-m=\"숨기다\"><b>conceal</b>숨기다</button><button type=\"button\" class=\"wdb\" data-w=\"reveal\" data-m=\"드러내다\"><b>reveal</b>드러내다</button><button type=\"button\" class=\"wdb\" data-w=\"ritualize\" data-m=\"의례화하다\"><b>ritualize</b>의례화하다</button><button type=\"button\" class=\"wdb\" data-w=\"fundamental\" data-m=\"근본적인\"><b>fundamental</b>근본적인</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>Indeed</b>(실제로) 뒤에서 “<b>one role of a paradigm</b>(패러다임의 한 가지 역할)”이라고 직접 이름 붙인 문장을 잡으세요. 1번 <b>use</b>(사용하다) vs <b>believe</b>(믿다) 대비가 그 역할로 이어져요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 대비</span><div class=\"en\">Scientists use paradigms <mark>rather than believing them</mark>.</div><p class=\"ko\">과학자들은 패러다임을 <mark>믿기보다는</mark> 사용한다.</p></div><div class=\"ck-via\"><i>▼</i><span>thus(따라서)로 1번을 정리: 같이 쓰기만 하면 믿음이 같을 필요는 없어요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 믿음은 달라도 된다</span><div class=\"en\">These elements of shared practice thus <mark>need not presuppose</mark> any comparable unity in scientists’ beliefs …</div><p class=\"ko\">공유된 관행의 이러한 요소들은 따라서 과학자들의 믿음에서 어떤 비슷한 통일성도 <mark>전제로 할 필요가 없다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>Indeed(실제로)로 패러다임이 “무슨 일을 하는지” 역할을 콕 집어요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">Indeed, <mark>one role of a paradigm</mark> <mark>is to enable scientists to work successfully</mark> without having to provide a detailed account …</div><p class=\"ko\">실제로, <mark>패러다임의 한 가지 역할은</mark> 자세한 설명을 제공할 필요 없이 <mark>과학자들이 성공적으로 일할 수 있도록 하는 것이다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>표준 해석이 없어도 패러다임은 연구를 이끈다, 즉 ‘쓰임’이 핵심이에요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 쿤(Kuhn)의 말로 확인</span><div class=\"en\">Lack of a standard interpretation … will not prevent a paradigm <mark>from guiding research</mark>.</div><p class=\"ko\">표준적인 해석의 부족은 … 패러다임이 <mark>연구를 이끄는 것</mark>을 막지 못할 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">functional aspects of a paradigm in scientific research 과학 연구에서 패러다임의 기능적 측면<small>5번 one role(한 가지 역할)과 7번 guiding research(연구를 이끄는 것) = 기능이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">roles of a paradigm in grouping like-minded researchers(생각이 같은 연구자들을 묶는 패러다임의 역할)</span><span class=\"why\">[반대] roles(역할)가 같아서 끌리지만, 4번은 믿음의 통일성(unity)이 필요 없다고 해요. 생각이 같은 사람끼리 묶는 게 아니라 생각이 달라도 같이 일하게 해 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">difficulty in drawing novel theories from existing paradigms(기존 패러다임에서 새 이론을 끌어내는 어려움)</span><span class=\"why\">[지문에 없음] 새 이론을 만드는 어려움은 한 번도 안 나와요. 지문은 이미 있는 패러다임을 어떻게 쓰는지만 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">significant influence of personal beliefs in scientific fields(과학 분야에서 개인적 믿음의 큰 영향)</span><span class=\"why\">[반대] 1번 rather than believing(믿기보다는), 5번 믿음을 설명할 필요 없이 일한다고 해요. 믿음의 영향이 크다는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">key factors that promote the rise of innovative paradigms(혁신적 패러다임의 등장을 촉진하는 핵심 요인)</span><span class=\"why\">[지문에 없음] 새 패러다임이 어떻게 생겨나는지는 말하지 않아요. 2번처럼 이미 공유된 도구·절차를 쓰는 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Scientists use paradigms</div><div class=\"k\">과학자들은 패러다임을 사용한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">rather than believing them.</span></div><div class=\"k\"><span class=\"cw\">그것들을 믿기보다는.</span></div></div><div class=\"rnat\">과학자들은 패러다임을 믿는다기보다 '사용한다'.</div><div class=\"rst\">과학 시간 모둠 실험을 떠올려 봐요. 우리는 실험 안내서를 ‘믿는’ 게 아니라 그냥 ‘써요’. 지문 1번도 패러다임을 <b>믿기보다 사용한다</b>고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The use of a paradigm in research</div><div class=\"k\">연구에서 패러다임의 사용은</div></div><div class=\"rc\"><div class=\"e\">typically addresses related problems</div><div class=\"k\">일반적으로 관련된 문제들을 다룬다</div></div><div class=\"rc\"><div class=\"e\">by employing shared concepts, symbolic expressions,</div><div class=\"k\">공유된 개념, 상징적인 표현을 사용함으로써,</div></div><div class=\"rc\"><div class=\"e\">experimental and mathematical tools and procedures,</div><div class=\"k\">실험적이고 수학적인 도구와 절차,</div></div><div class=\"rc\"><div class=\"e\">and even some of the same theoretical statements.</div><div class=\"k\">그리고 심지어 동일한 이론적 진술의 일부까지.</div></div><div class=\"rnat\">연구에서 패러다임의 사용은 일반적으로, 공유된 개념·상징적 표현·실험적이고 수학적인 도구와 절차, 심지어 동일한 이론적 진술 일부까지 동원해 관련 문제를 다루는 방식으로 이루어진다.</div><div class=\"rst\">안내서에는 같은 용어, 기호, 도구 쓰는 법, 순서가 다 들어 있어요. 지문 2번도 패러다임이 공유된 개념·도구·절차로 문제를 다룬다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Scientists need only understand how</div><div class=\"k\">과학자들은 '어떻게' 이해하기만 하면 된다</div></div><div class=\"rc\"><div class=\"e\">to use these various elements</div><div class=\"k\">이러한 다양한 요소들을 사용할지</div></div><div class=\"rc\"><div class=\"e\">in ways that others would accept.</div><div class=\"k\">다른 사람들이 받아들일 방식으로.</div></div><div class=\"rnat\">과학자들은 다른 사람들이 받아들일 방식으로 이런 다양한 요소를 '어떻게' 사용할지만 이해하면 된다.</div><div class=\"rst\">모둠원은 그 안내서를 다른 친구들도 인정할 방식으로 쓸 줄만 알면 돼요. 지문 3번도 남이 받아들일 방식으로 쓰는 법만 알면 된다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">These elements of shared practice</div><div class=\"k\">공유된 관행의 이러한 요소들은</div></div><div class=\"rc\"><div class=\"e\">thus need not presuppose</div><div class=\"k\">따라서 전제로 할 필요가 없다</div></div><div class=\"rc\"><div class=\"e\">any comparable unity in scientists’ beliefs</div><div class=\"k\">과학자들의 믿음에서 어떤 비슷한 통일성도</div></div><div class=\"rc\"><div class=\"e\">about what they are doing</div><div class=\"k\">그들이 무엇을 하고 있는지에 관한</div></div><div class=\"rc\"><div class=\"e\">when they use them.</div><div class=\"k\">그들이 그것들을 사용할 때.</div></div><div class=\"rnat\">따라서 이런 공유된 관행의 요소들은, 과학자들이 그것을 쓸 때 무엇을 하고 있다고 믿는지에 관해 어떤 비슷한 통일성도 전제할 필요가 없다.</div><div class=\"rst\">그래서 “이 실험이 왜 되는지” 생각이 서로 달라도 괜찮아요. 지문 4번도 믿음이 <b>똑같을 필요가 없다</b>(need not presuppose)고 해요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Indeed,</div><div class=\"k\">실제로,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">one role of a paradigm</span></div><div class=\"k\"><span class=\"cw\">패러다임의 한 가지 역할은</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is to enable scientists to work successfully</span></div><div class=\"k\"><span class=\"cw\">과학자들이 성공적으로 일할 수 있도록 하는 것이다</span></div></div><div class=\"rc\"><div class=\"e\">without having to provide a detailed account</div><div class=\"k\">자세한 설명을 제공할 필요 없이</div></div><div class=\"rc\"><div class=\"e\">of what they are doing or what they believe about it.</div><div class=\"k\">그들이 무엇을 하고 있는지 혹은 그것에 관해 무엇을 믿는지에 대한.</div></div><div class=\"rnat\">실제로 패러다임의 한 가지 역할은, 자기가 무엇을 하고 있고 그것에 관해 무엇을 믿는지 일일이 설명하지 않고도 과학자들이 성공적으로 연구할 수 있게 해 주는 것이다.</div><div class=\"rst\">안내서 덕분에 일일이 설명 안 해도 실험을 척척 끝내요. 지문 5번의 <b>패러다임의 역할</b>(one role of a paradigm)이 바로 이거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Thomas Kuhn noted that scientists</div><div class=\"k\">Thomas Kuhn이 언급하기를 과학자들은</div></div><div class=\"rc\"><div class=\"e\">“can agree in their identification of a paradigm</div><div class=\"k\">“패러다임을 식별하는 데 있어서 동의할 수 있다</div></div><div class=\"rc\"><div class=\"e\">without agreeing on,</div><div class=\"k\">동의하지 않고도,</div></div><div class=\"rc\"><div class=\"e\">or even attempting to produce,</div><div class=\"k\">혹은 심지어 만들어 내려 시도하지 않고도,</div></div><div class=\"rc\"><div class=\"e\">a full interpretation or rationalization of it.</div><div class=\"k\">그것의 완벽한 해석 혹은 이론적 설명을.</div></div><div class=\"rnat\">Thomas Kuhn은 과학자들이 \"패러다임의 완전한 '해석'이나 '이론적 설명'에는 동의하지 않거나 심지어 만들어 내려 시도조차 하지 않으면서도, 패러다임을 '식별'하는 데서는 동의할 수 있다\"고 언급했다.</div><div class=\"rst\">모둠원 모두 “이 안내서로 하자”엔 동의해도, 완벽한 해설까진 안 맞춰요. 지문 6번 쿤(Kuhn)의 말도 그렇다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Lack of a standard interpretation</div><div class=\"k\">표준적인 해석의 부족은</div></div><div class=\"rc\"><div class=\"e\">or of an agreed reduction to rules</div><div class=\"k\">혹은 합의된 규칙으로의 축약의 부족은</div></div><div class=\"rc\"><div class=\"e\">will not prevent a paradigm</div><div class=\"k\">패러다임을 막지 못할 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">from guiding research.</span>”</div><div class=\"k\"><span class=\"cw\">연구를 이끄는 것으로부터.</span>”</div></div><div class=\"rnat\">표준적인 해석이나 합의된 규칙 축약이 없다고 해서 패러다임이 연구를 이끄는 것을 막지는 못할 것이다.</div><div class=\"rst\">정해진 해설이 없어도 안내서는 실험을 계속 이끌어 줘요. 그래서 지문 7번은 패러다임이 <b>연구를 이끈다</b>는 기능으로 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"paradigm\" data-m=\"패러다임\"><b>paradigm</b>패러다임</button><button type=\"button\" class=\"wdb\" data-w=\"employ\" data-m=\"사용하다\"><b>employ</b>사용하다</button><button type=\"button\" class=\"wdb\" data-w=\"procedure\" data-m=\"절차\"><b>procedure</b>절차</button><button type=\"button\" class=\"wdb\" data-w=\"presuppose\" data-m=\"전제로 하다\"><b>presuppose</b>전제로 하다</button><button type=\"button\" class=\"wdb\" data-w=\"unity\" data-m=\"통일성\"><b>unity</b>통일성</button><button type=\"button\" class=\"wdb\" data-w=\"interpretation\" data-m=\"해석\"><b>interpretation</b>해석</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주어가 길게 늘어진 문장은 <b>본동사가 어디 있는지</b>부터 찾으세요. 주어 셋을 다 읽었는데 <b>-ing(분사)</b>만 있고 동사가 없으면, 그 자리를 동사로 고쳐야 해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (4번)</span><div class=\"en\">… and its importance for our existence as social animals <u>③ setting</u> it apart from the communication systems …</div><p class=\"ko\">… 그리고 사회적 동물로서 우리의 존재에 있어 그것(= 언어)의 중요성은 ( ? ) 다른 동물들의 소통체계와</p></div><div class=\"ck-via\"><i>▼</i><span>However(그러나) 뒤부터 쉼표와 and(그리고)로 이어진 명사 세 덩어리가 모두 주어예요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 앞부분 · 주어가 셋</span><div class=\"en\">However, <mark>the complexity of human language</mark>, its ability to convey nuanced emotions and ideas, and <mark>its importance</mark> for our existence as social animals …</div><p class=\"ko\">그러나, <mark>인간 언어의 복잡함</mark>, 미묘한 차이가 있는 감정과 생각을 전달하는 그것(= 언어)의 능력, 그리고 사회적 동물로서 우리의 존재에 있어 <mark>그것(= 언어)의 중요성은</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>주어 뒤에 동사가 하나도 없어요 → 분사 setting(구별해 주는)이 아니라 본동사 set(구별해 주다)</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">… <mark>set it apart</mark> from the communication systems used by other animals.</div><p class=\"ko\">… 다른 동물들에 의해 사용되는 소통체계와 <mark>그것(= 언어)을 구별해 준다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">문장의 본동사 자리: 동사와 분사(~하는 꼴) 구별</p><p class=\"gr\">영어 문장에는 주어 뒤에 꼭 본동사가 있어야 해요. 주어가 아무리 길어도 -ing(분사)는 본동사 자리를 채울 수 없어요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My brother and my sister play soccer.</div><div class=\"ko\">형과 누나는 축구를 한다. (주어 둘 뒤에 본동사 play가 있어서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My brother and my sister playing soccer.</div><div class=\"ko\">본동사 없이 playing(축구하는)만 있어서 문장이 안 돼요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The boy wearing a red cap plays soccer.</div><div class=\"ko\">빨간 모자를 쓴 소년은 축구를 한다. (wearing은 꾸밈말, 본동사는 plays라서 맞아요)</div></div><p class=\"gb\">지문 4번도 주어가 complexity(복잡함), ability(능력), importance(중요성) 셋인데 동사가 없어요. 그래서 setting(구별해 주는)이 아니라 복수 본동사 set(구별해 주다)이 와야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">setting → set (구별해 준다)<small>주어 셋(복수) 뒤 본동사 자리라 분사(~하는 꼴)는 못 오고 복수 동사 set(구별해 주다)이 와요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">by which ~에 의해</span><span class=\"why\">6번 the single most common variable(유일하고 가장 보편적인 변인) 뒤예요. 그 뒤 different cultural groups are identified(서로 다른 문화 집단이 식별된다)는 주어·동사가 다 갖춰진 완전한 절이라, 전치사+관계대명사 by which(그것에 의해)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">전치사 + 관계대명사(by which 그것에 의해) + 완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the bus by which I go to school.</div><div class=\"ko\">이것이 내가 학교에 가는 버스다. (I go to school이 완전한 절이라 by which가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is the bus which I go to school.</div><div class=\"ko\">I go to school이 완전한데 전치사 없이 which만 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the bus which I take.</div><div class=\"ko\">이것이 내가 타는 버스다. (take 뒤 목적어가 비었으니 which만 써도 맞아요)</div></div><p class=\"gb\">지문 6번도 different cultural groups are identified(서로 다른 문화 집단이 식별된다)가 완전한 절이라 by which(그것에 의해)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">do 분명 ~하다</span><span class=\"why\">2번 주어는 Many animals(많은 동물들)로 복수예요. 동사 communicate(소통하다) 앞에서 do(분명 ~하다)가 동사를 강조하고, 그 뒤엔 동사원형이 와서 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">강조의 do(정말 ~하다) + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I do like apples.</div><div class=\"ko\">나는 정말 사과를 좋아한다. (do 뒤에 동사원형 like가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I do likes apples.</div><div class=\"ko\">강조의 do 뒤인데 likes처럼 -s를 붙여서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She does like apples.</div><div class=\"ko\">그녀는 정말 사과를 좋아한다. (주어가 한 명이면 does, 뒤는 동사원형 like라서 맞아요)</div></div><p class=\"gb\">지문 2번도 복수 주어 Many animals(많은 동물들) 뒤라 do(분명 ~하다) + communicate(소통하다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">have been taught 가르쳐져 왔다</span><span class=\"why\">3번 주어 some nonhuman primates(몇몇 영장류들)는 가르치는 쪽이 아니라 배우는 쪽이에요. 그래서 수동 been taught(가르쳐진)가 맞고, 뒤에 to use(사용하도록)가 이어져요.</span><div class=\"gm wx\"><p class=\"gt\">현재완료 수동태: have been(~되어 왔다) + 과거분사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The dogs have been taught to sit.</div><div class=\"ko\">그 개들은 앉도록 배워 왔다. (개들이 가르침을 받으니 수동 been taught가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The dogs have taught to sit.</div><div class=\"ko\">개들이 누군가를 가르친 게 아닌데 능동 have taught를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My uncle has taught math for ten years.</div><div class=\"ko\">삼촌은 10년 동안 수학을 가르쳐 왔다. (삼촌이 직접 가르치니 능동이 맞아요)</div></div><p class=\"gb\">지문 3번도 영장류가 사람에게 손짓을 배운 쪽이라 have been taught(가르쳐져 왔다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">name 명명하다</span><span class=\"why\">7번 the way(방식) 뒤에 think about(~에 대해 생각하다), perceive(인지하다), and name(명명하다)이 and(그리고)로 나란히 이어져요. 앞의 두 동사와 같은 동사원형 name(명명하다)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">병렬 구조: and(그리고)로 이은 말은 같은 꼴로</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I read, draw, and sing every day.</div><div class=\"ko\">나는 매일 읽고, 그리고, 노래한다. (세 동사 모두 같은 꼴이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I read, draw, and singing every day.</div><div class=\"ko\">앞 둘은 동사인데 마지막만 singing(노래하는 것)으로 바꿔서 틀려요.</div></div><p class=\"gb\">지문 7번도 think(생각하다), perceive(인지하다) 다음 and(그리고) 뒤라 같은 꼴 name(명명하다)이 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Language is one of the primary features</div><div class=\"k\">언어는 주요한 특징들 중 하나이다</div></div><div class=\"rc\"><div class=\"e\">that distinguishes humans from other animals.</div><div class=\"k\">인간을 다른 동물들로부터 구분하는.</div></div><div class=\"rnat\">언어는 인간을 다른 동물과 구분해 주는 주요한 특징 중 하나이다.</div><div class=\"rst\">말을 한다는 게 사람과 동물을 가르는 큰 특징이에요. 지문 1번의 that distinguishes(구분하는)는 앞 features(특징들)를 꾸며요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Many animals,</div><div class=\"k\">많은 동물들은,</div></div><div class=\"rc\"><div class=\"e\">including dolphins, whales, and birds,</div><div class=\"k\">돌고래, 고래, 그리고 새를 포함하여,</div></div><div class=\"rc\"><div class=\"e\">do indeed communicate with one another</div><div class=\"k\">분명 서로 소통을 한다</div></div><div class=\"rc\"><div class=\"e\">through patterned systems of sounds, scents, and other chemicals, or movements.</div><div class=\"k\">소리, 냄새, 그리고 다른 화학물질의 양식 체계나 움직임을 통해.</div></div><div class=\"rnat\">돌고래, 고래, 새를 비롯한 많은 동물은 소리·냄새·화학 물질·움직임 같은 일정한 체계를 통해 실제로 서로 소통한다.</div><div class=\"rst\">돌고래·고래·새도 소리·냄새·몸짓으로 분명 서로 대화해요. 지문 2번 <b>do</b>(분명 ~하다)가 동사 communicate(소통하다)를 강조해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Furthermore,</div><div class=\"k\">게다가,</div></div><div class=\"rc\"><div class=\"e\">some nonhuman primates have been taught</div><div class=\"k\">인간이 아닌 몇몇 영장류들은 가르쳐져 왔다</div></div><div class=\"rc\"><div class=\"e\">to use sign language</div><div class=\"k\">손짓을 사용하도록</div></div><div class=\"rc\"><div class=\"e\">to communicate with humans.</div><div class=\"k\">인간들과 소통하기 위해.</div></div><div class=\"rnat\">게다가 인간이 아닌 몇몇 영장류는 인간과 소통하기 위해 손짓 언어를 쓰도록 가르쳐져 왔다.</div><div class=\"rst\">게다가 어떤 원숭이 무리는 손짓을 배워 사람과 대화해요. 배운 쪽이라 지문 3번은 수동 <b>have been taught</b>(가르쳐져 왔다)예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">그러나,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the complexity of human language,</span></div><div class=\"k\"><span class=\"cw\">인간 언어의 복잡함,</span></div></div><div class=\"rc\"><div class=\"e\">its ability to convey nuanced emotions and ideas,</div><div class=\"k\">미묘한 차이가 있는 감정과 생각을 전달하는 그것(= 언어)의 능력,</div></div><div class=\"rc\"><div class=\"e\">and its importance for our existence as social animals</div><div class=\"k\">그리고 사회적 동물로서 우리의 존재에 있어 그것(= 언어)의 중요성은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">set it apart</span></div><div class=\"k\"><span class=\"cw\">그것(= 언어)을 구별해 준다</span> ※ 문제지엔 setting으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">from the communication systems used by other animals.</div><div class=\"k\">다른 동물들에 의해 사용되는 소통체계와.</div></div><div class=\"rnat\">그러나 인간 언어의 복잡함, 미묘한 감정과 생각을 전달하는 능력, 그리고 사회적 동물로서 우리 존재에 갖는 중요성은 그것을 다른 동물이 쓰는 소통 체계와 구별해 준다.</div><div class=\"rst\"><b>하지만</b>(However) 사람 말의 복잡함·섬세한 감정 전달·중요성 세 가지가 동물과 구별해 줘요. 주어 셋 뒤 본동사라 지문 4번은 <b>set</b>(구별해 주다)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In many ways,</div><div class=\"k\">여러모로,</div></div><div class=\"rc\"><div class=\"e\">language is the essence of culture.</div><div class=\"k\">언어는 문화의 근간이다.</div></div><div class=\"rnat\">여러모로 언어는 문화의 근간이다.</div><div class=\"rst\">여러모로 말은 문화의 바탕이에요. 지문 5번은 language is the essence(언어는 근간이다)로 짧게 정리해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">It provides the single most common variable</div><div class=\"k\">그것은 유일하고 가장 보편적인 변인을 제공한다</div></div><div class=\"rc\"><div class=\"e\">by which different cultural groups are identified.</div><div class=\"k\">그것에 의해 서로 다른 문화 집단이 식별되는.</div></div><div class=\"rnat\">그것은 서로 다른 문화 집단을 식별하게 해 주는, 단 하나의 가장 보편적인 변인을 제공한다.</div><div class=\"rst\">어느 나라 말을 쓰는지로 어느 문화 사람인지 알아봐요. 뒤가 완전한 절이라 지문 6번은 <b>by which</b>(그것에 의해)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Language not only facilitates</div><div class=\"k\">언어는 촉진할 뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">the cultural diffusion of innovations,</div><div class=\"k\">혁신의 문화적 확산을,</div></div><div class=\"rc\"><div class=\"e\">it also helps to shape the way</div><div class=\"k\">또한 방식을 형성하도록 돕는다</div></div><div class=\"rc\"><div class=\"e\">we think about, perceive, and name our environment.</div><div class=\"k\">우리가 환경에 대해 생각하고, 인지하고, 명명하는.</div></div><div class=\"rnat\">언어는 혁신의 문화적 확산을 촉진할 뿐 아니라, 우리가 환경을 생각하고 인지하고 명명하는 방식을 형성하도록 돕기도 한다.</div><div class=\"rst\">말은 새 생각을 퍼뜨리고, 주변을 생각하고 보고 이름 붙이는 방식도 만들어요. 세 동사가 나란히라 지문 7번은 <b>name</b>(명명하다)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"distinguish\" data-m=\"구분하다\"><b>distinguish</b>구분하다</button><button type=\"button\" class=\"wdb\" data-w=\"primate\" data-m=\"영장류\"><b>primate</b>영장류</button><button type=\"button\" class=\"wdb\" data-w=\"convey\" data-m=\"전달하다\"><b>convey</b>전달하다</button><button type=\"button\" class=\"wdb\" data-w=\"nuanced\" data-m=\"미묘한 차이가 있는\"><b>nuanced</b>미묘한 차이가 있는</button><button type=\"button\" class=\"wdb\" data-w=\"essence\" data-m=\"근간, 본질\"><b>essence</b>근간, 본질</button><button type=\"button\" class=\"wdb\" data-w=\"facilitate\" data-m=\"촉진하다\"><b>facilitate</b>촉진하다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이 글의 방향은 처음부터 끝까지 <b>선택지가 많을수록 손해</b>예요. 8번 <b>Yet</b>(그러나)은 “말로는 더 원한다”를 뒤집는 신호이니, 그 뒤에 좋은 느낌의 낱말이 오면 방향이 거꾸로예요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 글의 방향</span><div class=\"en\"><mark>However</mark>, there may be a price to pay in terms of happiness.</div><p class=\"ko\"><mark>그러나</mark>, 행복의 관점에서 지불해야 할 값이 있을지도 모른다.</p></div><div class=\"ck-via\"><i>▼</i><span>잼 실험으로 확인: 적게 고른 쪽이 더 행복해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 실험 결과</span><div class=\"en\"><mark>Those who had fewer choices</mark> <mark>were happier with the tasting</mark>.</div><p class=\"ko\"><mark>더 적은 선택의 항목을 가진 사람들이</mark> <mark>맛봄에 있어 더 행복했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>ironic(모순적인): 결과와 달리 사람들은 말로는 더 원해요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 · 사람들의 말</span><div class=\"en\">The ironic thing about this is that people nearly always say they want more choices.</div><p class=\"ko\">이것에 대해 모순적인 것은 사람들이 거의 항상 그들이 더 많은 선택의 항목을 원한다고 말한다는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>Yet(그러나)으로 뒤집었는데 ‘안심한다’면 방향이 그대로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (8번)</span><div class=\"en\">Yet, the more options they have, the more <u>④ relieved</u> they become.</div><p class=\"ko\">그러나, 더 많은 선택의 항목을 가질수록 그들은 더 ( 안심한다? ) → 마비된다가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>많을수록 손해라는 방향과 맞는 말은 ‘마비된다’예요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 · 결정적 단서</span><div class=\"en\"><mark>Yet</mark>, the more options they have, <mark>the more paralyzed they become</mark>.</div><p class=\"ko\"><mark>그러나</mark>, 그들이 더 많은 선택의 항목을 가질수록, <mark>그들은 더 마비된다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">relieved(안심하는) ↔ paralyzed(마비된)</p><p class=\"gr\">선택지가 많을수록 손해라는 글이면, 많아질 때의 느낌도 나쁜 쪽이어야 해요. relieved(안심하는)는 좋은 쪽, paralyzed(마비된, 꼼짝 못하는)는 나쁜 쪽이에요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The menu was too long, so I was paralyzed.</div><div class=\"ko\">메뉴가 너무 길어서 나는 꼼짝도 못 했다. (너무 많음 → 마비)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The menu was too long, so I was relieved.</div><div class=\"ko\">메뉴가 너무 길어서 안심했다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The test was over, so I was relieved.</div><div class=\"ko\">시험이 끝나서 나는 안심했다. (걱정이 사라짐 → 안심)</div></div><p class=\"gb\">지문 8번도 Yet(그러나) 뒤에서 선택이 많을수록 나빠진다고 해야 하니, relieved(안심하는)가 아니라 paralyzed(마비된)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">relieved → paralyzed (마비된)<small>선택지가 많을수록 안심이 아니라 마비돼요. 그래야 Yet(그러나)이 7번을 뒤집어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">more 더 많은</span><span class=\"why\">7번은 실험 결과와 어긋나서 ironic(모순적인)이라고 한 문장이에요. 사람들이 말로는 more choices(더 많은 선택)를 원한다는 게 바로 그 모순이라 more(더 많은)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">depressed 우울한</span><span class=\"why\">2번에서 행복 면에서 치를 값(a price to pay)이 있다고 했어요. 그 값이 바로 우울함이라 3번 depressed(우울한)가 방향에 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">fewer 더 적은</span><span class=\"why\">4번에서 6가지만 받은 쪽이 적게 받은 쪽이에요. 6번에서도 a smaller selection(더 적은 선택의 폭)을 가진 사람이 더 많이 샀으니 5번 fewer(더 적은)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">prompting 촉진하며</span><span class=\"why\">9번 가게 주인은 fewer choices(더 적은 선택)를 줘서 손님을 편하게 해요. 편해지면 쉽게 고르니까 10번 prompting(촉진하며)이 긍정 방향에 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The overabundance of options</div><div class=\"k\">선택의 풍부함은</div></div><div class=\"rc\"><div class=\"e\">in today’s marketplace</div><div class=\"k\">오늘날의 시장에서</div></div><div class=\"rc\"><div class=\"e\">gives you more freedom of choice.</div><div class=\"k\">당신에게 더 많은 선택의 자유를 준다.</div></div><div class=\"rnat\">오늘날 시장의 선택지 과잉은 여러분에게 더 큰 선택의 자유를 준다.</div><div class=\"rst\">맛 종류가 엄청 많은 아이스크림 가게를 떠올려 봐요. 고를 게 많으면 자유로워 보이죠. 지문 1번도 선택이 많으면 자유가 커진다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However,</span></div><div class=\"k\"><span class=\"cw\">그러나,</span></div></div><div class=\"rc\"><div class=\"e\">there may be a price to pay</div><div class=\"k\">지불해야 할 값이 있을지도 모른다</div></div><div class=\"rc\"><div class=\"e\">in terms of happiness.</div><div class=\"k\">행복의 관점에서.</div></div><div class=\"rnat\">그러나 행복이라는 관점에서 보면 치러야 할 대가가 있을지도 모른다.</div><div class=\"rst\"><b>그런데</b>(However) 그 대신 기분이 나빠지는 값을 치를 수도 있어요. 지문 2번도 행복 면에서 값이 있다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">According to research by psychologists David Myers and Robert Lane,</div><div class=\"k\">심리학자 David Myers와 Robert Lane의 연구에 따르면,</div></div><div class=\"rc\"><div class=\"e\">all this choice often makes people depressed.</div><div class=\"k\">이러한 모든 선택은 종종 사람들을 우울하게 만든다.</div></div><div class=\"rnat\">심리학자 David Myers와 Robert Lane의 연구에 따르면, 이 모든 선택은 종종 사람들을 우울하게 만든다.</div><div class=\"rst\">너무 많으면 “뭘 고르지…” 하다가 오히려 우울해져요. 지문 3번 <b>depressed</b>(우울한)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Researchers gave some shoppers</div><div class=\"k\">연구자들은 어떤 쇼핑객들에게 주었다</div></div><div class=\"rc\"><div class=\"e\">24 choices of jams to taste</div><div class=\"k\">맛볼 24가지 선택의 잼들을</div></div><div class=\"rc\"><div class=\"e\">and others only 6 choices.</div><div class=\"k\">그리고 다른 사람들에게는 오직 6가지를.</div></div><div class=\"rnat\">연구자들은 어떤 쇼핑객에게는 맛볼 잼 24가지를, 다른 쇼핑객에게는 6가지만 주었다.</div><div class=\"rst\">한 친구에게는 맛보기 24가지, 다른 친구에게는 6가지만 줬다고 해 봐요. 지문 4번 잼 실험이 이거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Those who had fewer choices</span></div><div class=\"k\"><span class=\"cw\">더 적은 선택의 항목을 가진 사람들이</span></div></div><div class=\"rc\"><div class=\"e\">were happier with the tasting.</div><div class=\"k\">맛봄에 있어 더 행복했다.</div></div><div class=\"rnat\">선택지가 더 적었던 사람들이 시식에서 더 행복해했다.</div><div class=\"rst\">6가지만 맛본 친구가 더 즐거워했어요. 지문 5번도 <b>더 적은</b>(fewer) 선택을 받은 쪽이 더 행복했다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Even more surprisingly,</div><div class=\"k\">훨씬 더 놀랍게도,</div></div><div class=\"rc\"><div class=\"e\">the ones with a smaller selection</div><div class=\"k\">더 적은 선택의 항목을 가진 사람들은</div></div><div class=\"rc\"><div class=\"e\">purchased jam 31% of the time,</div><div class=\"k\">그 당시 31%가 잼을 구매했다,</div></div><div class=\"rc\"><div class=\"e\">while those with a wider range of choices</div><div class=\"k\">반면 더 넓은 범위의 선택의 항목을 가진 사람들은</div></div><div class=\"rc\"><div class=\"e\">only purchased jam 3% of the time.</div><div class=\"k\">오직 그 당시 3%만이 잼을 구매했다.</div></div><div class=\"rnat\">더 놀랍게도, 선택지가 적었던 쪽은 31퍼센트가 잼을 샀지만 선택지가 많았던 쪽은 겨우 3퍼센트만 잼을 샀다.</div><div class=\"rst\">게다가 적게 고른 쪽은 31%가 샀고, 많이 고른 쪽은 3%만 샀어요. 지문 6번 숫자가 그 차이를 보여 줘요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The ironic thing about this</div><div class=\"k\">이것에 대해 모순적인 것은</div></div><div class=\"rc\"><div class=\"e\">is that people nearly always say</div><div class=\"k\">사람들이 거의 항상 말한다는 것이다</div></div><div class=\"rc\"><div class=\"e\">they want more choices.</div><div class=\"k\">그들이 더 많은 선택의 항목을 원한다고.</div></div><div class=\"rnat\">여기서 모순적인 점은 사람들이 거의 언제나 더 많은 선택지를 원한다고 말한다는 것이다.</div><div class=\"rst\">웃긴 건, 친구들은 늘 “맛이 더 많으면 좋겠다”고 말해요. 지문 7번의 모순(ironic)이 이거예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Yet,</span></div><div class=\"k\"><span class=\"cw\">그러나,</span></div></div><div class=\"rc\"><div class=\"e\">the more options they have,</div><div class=\"k\">그들이 더 많은 선택의 항목을 가질수록,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the more paralyzed they become.</span></div><div class=\"k\"><span class=\"cw\">그들은 더 마비된다.</span> ※ 문제지엔 relieved로 되어 있음</div></div><div class=\"rnat\">그러나 선택지가 많아질수록 그들은 더 ④안심하게[→마비되게] 된다.</div><div class=\"rst\"><b>그러나</b>(Yet) 맛이 많아질수록 아무것도 못 고르고 얼어붙어요. 그래서 지문 8번은 안심이 아니라 <b>마비된다</b>(paralyzed)예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Savvy restaurant owners</div><div class=\"k\">사리에 밝은 음식점 주인들은</div></div><div class=\"rc\"><div class=\"e\">provide fewer choices.</div><div class=\"k\">더 적은 선택의 항목을 제공한다.</div></div><div class=\"rnat\">사리에 밝은 음식점 주인들은 선택지를 더 적게 제공한다.</div><div class=\"rst\">눈치 빠른 가게 사장님은 일부러 메뉴를 적게 둬요. 지문 9번 똑똑한 음식점 주인도 선택지를 줄여요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">This allows customers to feel more relaxed,</div><div class=\"k\">이것은 고객들이 더 편안함을 느끼게 하고,</div></div><div class=\"rc\"><div class=\"e\">prompting them to choose easily</div><div class=\"k\">그들이 쉽게 선택하도록 촉진하며</div></div><div class=\"rc\"><div class=\"e\">and leave more satisfied with their choices.</div><div class=\"k\">그들의 선택에 더 만족하며 떠나게 한다.</div></div><div class=\"rnat\">이것은 고객이 더 편안함을 느끼게 하고, 쉽게 선택해서 자기 선택에 더 만족한 채로 떠나도록 이끈다.</div><div class=\"rst\">그러면 손님이 편하게 금방 고르고, 만족해서 나가요. 지문 10번도 쉽게 고르도록 <b>촉진하며</b>(prompting) 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"overabundance\" data-m=\"과다, 풍부함\"><b>overabundance</b>과다, 풍부함</button><button type=\"button\" class=\"wdb\" data-w=\"in terms of\" data-m=\"~의 관점에서\"><b>in terms of</b>~의 관점에서</button><button type=\"button\" class=\"wdb\" data-w=\"ironic\" data-m=\"모순적인\"><b>ironic</b>모순적인</button><button type=\"button\" class=\"wdb\" data-w=\"paralyzed\" data-m=\"마비된\"><b>paralyzed</b>마비된</button><button type=\"button\" class=\"wdb\" data-w=\"savvy\" data-m=\"사리에 밝은\"><b>savvy</b>사리에 밝은</button><button type=\"button\" class=\"wdb\" data-w=\"prompt\" data-m=\"촉진하다\"><b>prompt</b>촉진하다</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
