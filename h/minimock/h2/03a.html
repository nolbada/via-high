<title>고2 미니모의고사 3회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}
.ch.open .ct{display:block}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}
.sc .ce{font-size:18px;line-height:1.5;font-weight:800;color:#c62828}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

.wc{padding:14px 0;border-bottom:1px solid var(--line)}

function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}

cation을 꾸미는 형용사구"]}, {"t": "맨 뒤 <b>leaving nothing for his hopes, desires, or struggles</b>는 <b>분사구문(결과)</b>이다.", "sub": ["의미상 주어 = 앞 내용 전체(소망이 노력 없이 충족되는 것)", "leave nothing for ~ = ~에게 아무것도 남기지 않다 (hope 희망, desire 욕구, struggle 분투)"]}, {"t": "함정: 부정문처럼 보이지 않아도 ‘더 무거운 저주가 있을지 의심스럽다’는 뜻이라서 사실상 그런 저주는 없다는 강조이다."}], "sum": "노력 없이 모든 소망이 채워지는 것보다 무거운 저주는 없음"}, {"i": "05", "q": "04", "s": "1", "title": "S+V+O(that절) + one을 꾸미는 관계절", "eng": "Some beginning researchers<sup>1</sup> mistakenly<sup>2</sup> believe / that a good hypothesis<sup>3</sup> is one / that is guaranteed<sup>4</sup> to be right.", "notes": [["1", "beginning researcher", "초보 연구자"], ["2", "mistakenly", "잘못하여, 착각하여"], ["3", "hypothesis", "가설"], ["4", "be guaranteed to", "반드시 ~하도록 보장되다"]], "lit": "일부 초보 연구자들은 잘못 생각한다 / 좋은 가설이란 그런 것이라고 / 반드시 옳다고 보장된", "nat": "일부 초보 연구자는 좋은 가설이란 반드시 맞을 것이 보장된 가설이라고 잘못 생각한다.", "ana": "<b>that</b>이 두 번 나오는데 역할이 다릅니다. 앞의 that은 believe의 목적어를 이끄는 <b>명사절 접속사</b>, 뒤의 that은 <b>one을 선행사로 하는 주격 관계대명사</b>입니다. 여기서 <b>one = a hypothesis</b>로, 앞에 나온 명사를 되받는 대명사예요. it으로 바꾸면 '바로 그 가설'이 되어 뜻이 달라집니다. <b>be guaranteed to V</b>는 '반드시 ~하게 되어 있다'입니다.", "pe": "Some \u0001beginning\u0002 researchers<sup>1</sup> \u0001mistakenly<sup>2</sup>\u0002 believe / that a \u0001good\u0002 hypothesis<sup>3</sup> is one / \u0001that is guaranteed<sup>4</sup> to be right\u0002.", "pk": "일부 \u0001초보\u0002 연구자들은 \u0001잘못\u0002 생각한다 / \u0001좋은\u0002 가설이란 그런 것이라고 / \u0001반드시 옳다고 보장된\u0002", "core": "일부 연구자들은 가설이 그런 것이라고 생각한다.", "tags": ["주어 researchers + 동사 believe. beginning = 형용사(분사): researchers를 꾸밈. mistakenly = 부사: believe를 꾸밈", "believe의 목적어 = that절(명사절). a hypothesis is one (SVC). good = 형용사: hypothesis를 꾸밈", "that is guaranteed ~ = 관계절(형용사절, 주격): one(대명사)을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 that절 안에 관계절이 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: some beginning researchers (일부 초보 연구자들. beginning 초보의, researcher 연구자)", "V: believe (믿다)", "O: that ~ (명사절)", "mistakenly = 잘못 (believe를 꾸미는 부사)", "뼈대 = <b>Some beginning researchers believe [that ~]</b>"]}, {"t": "that절 안의 뼈대이다.", "sub": ["S: a good hypothesis (좋은 가설. hypothesis 가설)", "V: is", "C: one (= 가설 하나, a hypothesis를 대신한 말)", "뼈대 = <b>a good hypothesis is one</b>"]}, {"t": "<b>that is guaranteed to be right</b>는 <b>관계절(형용사절, 주격)</b>로 대명사 one을 꾸민다.", "sub": ["is guaranteed (guarantee 보장하다의 수동태 = 보장되다)", "to be right = 옳을 것이라고. right는 옳은"]}, {"t": "함정: one은 숫자 하나가 아니라 앞의 hypothesis를 대신하는 대명사이다. 그래서 관계절이 one을 꾸민다."}], "sum": "초보 연구자, 반드시 맞는다고 보장된 가설을 좋은 가설로 착각"}, {"i": "06", "q": "04", "s": "4", "title": "목적 to부정사 + S+V+O 병렬 + 삽입", "eng": "To get new knowledge, / you, as a researcher-explorer<sup>1</sup>, / need to leave the safety<sup>2</sup> of the shore<sup>3</sup> / and venture into<sup>4</sup> uncharted waters<sup>5</sup>.", "notes": [["1", "explorer", "탐험가"], ["2", "safety", "안전한 곳"], ["3", "shore", "해안, 물가"], ["4", "venture into", "~로 과감히 나아가다"], ["5", "uncharted waters", "미개척 영역"]], "lit": "새로운 지식을 얻기 위해서는 / 연구자이자 탐험가인 당신은 / 안전한 해안을 떠나야 한다 / 그리고 미개척 바다로 과감히 나아가야 한다", "nat": "새로운 지식을 얻으려면, 연구자이자 탐험가인 당신은 안전한 해안을 떠나 미개척 바다로 모험을 떠나야 한다.", "ana": "맨 앞 <b>To get</b>은 '~하기 위해'라는 목적의 to부정사이고, 진짜 주어는 콤마 뒤의 <b>you</b>입니다. 그 뒤 <b>as a researcher-explorer</b>는 콤마 두 개로 묶인 <b>삽입어구</b>라 통째로 괄호 치고 읽으세요. 그러면 you need to leave ~ and venture ~가 한눈에 들어옵니다. <b>venture</b> 앞에 to가 없는 이유는 need to의 <b>to를 공유하는 병렬</b>이기 때문입니다.", "pe": "\u0001To get new knowledge\u0002, / you, \u0001as a researcher-explorer<sup>1</sup>\u0002, / need to leave the safety<sup>2</sup> \u0001of the shore<sup>3</sup>\u0002 / and venture \u0001into<sup>4</sup> \u0001uncharted\u0002 waters<sup>5</sup>\u0002.", "pk": "\u0001새로운 지식을 얻기 위해서는\u0002 / \u0001연구자이자 탐험가인\u0002 당신은 / 안전한 해안을 떠나야 한다 / 그리고 \u0001\u0001미개척\u0002 바다로\u0002 과감히 나아가야 한다", "core": "당신은 안전한 해안을 떠나 과감히 나아가야 한다.", "tags": ["To get ~ = to부정사(부사적: 목적): need to leave를 꾸밈", "주어 you. as a researcher-explorer = 삽입 부사구: you를 보충", "need + to leave + the safety. of the shore = 전치사구(형용사구): safety를 꾸밈", "and (to) venture = 동사 병렬. into ~ waters = 거의 필수에 가까운 부사구(venture into) [기준: 문형 기준]. uncharted = 형용사: waters를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 앞에 목적의 to부정사가 붙고 주어 뒤에 삽입어구가 끼며 동사가 병렬되어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: you (당신)", "V: need (필요로 하다)", "O: to leave ~ (to부정사)", "뼈대 = <b>you need to leave ~ and (to) venture ~</b>"]}, {"t": "<b>To get new knowledge</b>는 <b>to부정사(부사적 용법, 목적)</b>로 need를 꾸민다. 새로운 지식을 얻기 위해라는 뜻이다."}, {"t": "쉼표 사이의 <b>as a researcher-explorer</b>는 삽입 부사구이다. 연구자이자 탐험가로서라는 뜻이다."}, {"t": "목적어는 두 동작이 병렬되어 있다.", "sub": ["to leave the safety of the shore = 해안의 안전을 떠나다 (safety 안전, shore 해안). of the shore는 safety를 꾸미는 형용사구", "and (to) venture into uncharted waters = 미개척 바다로 과감히 나아가다. venture into는 거의 필수 전치사구, uncharted는 미개척의(지도에 없는), waters는 바다"]}, {"t": "함정: 앞의 To get ~은 주어가 아니라 목적을 말하는 부사 덩어리이다. 콤마 뒤에 주어 you가 따로 있다."}], "sum": "새 지식을 얻으려면 안전한 해안을 떠나 미개척 바다로 나아가야 함"}, {"i": "07", "q": "05", "s": "3", "title": "S+V+C + 주격 관계절 + 간접의문 how절", "eng": "The Blue Books were a series of<sup>1</sup> management training manuals<sup>2</sup> / that told / how GE managers were to<sup>3</sup> get tasks done<sup>4</sup> / in the organization<sup>5</sup>.", "notes": [["1", "series of", "일련의"], ["2", "manual", "지침서, 안내서"], ["3", "be to V", "~해야 한다"], ["4", "get tasks done", "업무를 처리하다"], ["5", "organization", "조직"]], "lit": "Blue Books는 일련의 관리자 교육 지침서였다 / 알려 주는 / GE 관리자들이 어떻게 업무를 처리해야 하는지를 / 조직 안에서", "nat": "Blue Books는 GE 관리자들이 조직 안에서 어떻게 업무를 처리해야 하는지를 알려 주는 일련의 관리자 교육 지침서였다.", "ana": "<b>that</b>은 manuals를 꾸미는 <b>주격 관계대명사</b>이고, told의 목적어는 <b>how로 시작하는 간접의문문</b>입니다. 간접의문문은 <b>의문사 + 주어 + 동사</b> 어순이라 how did they get이 아니라 how they were to get이 됩니다. 그리고 <b>be to V</b>는 여기서 '~해야 한다(의무)'이고, <b>get + 목적어 + 과거분사</b>는 '(목적어가) ~되게 하다'입니다 — 업무는 '처리되는' 쪽이라 done입니다.", "pe": "The Blue Books were a series \u0001of<sup>1</sup> management training manuals<sup>2</sup>\u0002 / \u0001that told\u0002 / \u0001how GE managers were to<sup>3</sup> get r children (자녀에 대한 부모의 정서적 지지의 중요성)", "a": false, "x": true, "trap": true, "e": "love and concern이라는 표현 때문에 가장 그럴듯해 보입니다. 그러나 글은 그 사랑이 <b>과잉 보호로 흐를 때의 위험</b>을 지적합니다. 정서적 지지를 <b>더 하라</b>는 글이 아닙니다."}, {"n": "④", "t": "necessity of parents letting their child experience difficulties (부모가 자녀에게 어려움을 겪게 해 줄 필요성)", "a": true, "x": false, "trap": false, "e": "3번의 preventing ~ from acquiring과 5번의 needs to deal with some failure가 그대로 이 문장입니다."}, {"n": "⑤", "t": "differences between the parents' and child's points of view (부모와 자녀의 관점 차이)", "a": false, "x": true, "trap": false, "e": "관점을 <b>비교</b>하는 글이 아닙니다. 자녀의 시각은 서술되지 않습니다."}], "w": [["hardship", "고난, 역경"], ["spare A from B", "A가 B를 겪지 않게 해 주다"], ["noble", "숭고한, 고귀한"], ["stem from", "~에서 비롯되다"], ["in the long term", "장기적으로"], ["prevent A from B", "A가 B하지 못하게 막다"], ["acquire", "얻다, 습득하다"], ["interpersonal skills", "대인 관계 능력"], ["gratification", "만족, 충족"], ["struggle", "분투하다"]]}, {"q": "04", "type": "글의 제목", "src": "2021년 3월 24번", "ans": "①", "tr": [["1", "일부 초보 연구자는 좋은 가설이란 반드시 맞을 것이 보장된 가설이라고 잘못 생각한다(예: '술은 반응 속도를 늦출 것이다')."], ["2", "그러나 검증하기도 전에 당신의 가설이 참이라는 것을 이미 알고 있다면, 그 가설을 검증해 봐야 새로운 것은 아무것도 알려 주지 못한다."], ["3", "기억하라, 연구란 새로운 지식을 만들어 내야 하는 것이다."], ["4", "새로운 지식을 얻으려면 연구자이자 탐험가인 당신은 안전한 해안(이미 확립된 사실)을 떠나 미개척 바다로 모험을 떠나야 한다 (아인슈타인의 말처럼 \"우리가 무엇을 하고 있는지 이미 알고 있다면 그것을 연구라고 부르지 않겠지요, 안 그런가요?\")."], ["5", "그 미개척 바다에서 무슨 일이 일어날지에 대한 당신의 예측이 틀렸다 해도 괜찮다. 과학자는 실수해도 된다 (Bates가 말했듯 \"연구란 막다른 길인지 확인하려고 골목을 올라가 보는 과정이다\")."], ["6", "실제로 과학자들은 들어맞는 예측보다 들어맞지 않는 예측에서 더 많이 배운다."]], "evh": "5 · 6번 문장", "ev": [{"en": true, "h": "Scientists are allowed to make mistakes / scientists often learn more from predictions that do not turn out than from those that do."}, {"en": false, "h": "제목 유형은 <b>글이 반복해서 편드는 쪽</b>을 찾습니다. 이 글은 처음부터 끝까지 <b>맞을 것이 뻔한 가설은 쓸모없다 → 틀려도 된다 → 오히려 틀린 예측에서 더 배운다</b>로 한 방향입니다. 6번의 do not turn out이 결정타예요. 제목은 이 흐름을 한 줄로 압축한 것이어야 합니다."}], "opts": [{"n": "①", "t": "Researchers, Don't Be Afraid to Be Wrong (연구자여, 틀리는 것을 두려워하지   let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}

function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">목적 문제는 편지 첫 문장의 <b>감사드리고 싶다(want to thank)</b>를 찾으면 끝나요. 뒤 문장들은 <b>무엇이 고마운지</b> 덧붙이는 확인용이에요.</p><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">On behalf of the Lakeview Senior Apartment Complex, <mark>I want to thank</mark> the Smalltown Transit Authority <mark>for adding a stop on Route 16</mark> to serve the residents.</div><p class=\"ko\">Lakeview 노인 아파트 단지를 대표하여, <mark>16번 노선에 정류장을 추가해 주신 것에 대해</mark> 저는 Smalltown 교통 당국에 <mark>감사드리고 싶습니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>감사한 내용(정류장 추가)이 실제로 어떻게 운행되는지 덧붙여요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 추가된 정류장 설명</span><div class=\"en\">Since you accepted our petition, the bus company will initiate the service <mark>to the front door of our complex</mark> every day …</div><p class=\"ko\">귀하께서 저희 청원을 받아들여 주셨기 때문에, 버스 회사는 <mark>저희 단지 정문까지</mark> 매일 서비스를 시작할 것입니다 …</p></div><div class=\"ck-via\"><i>▼</i><span>appreciate(감사하다)로 한 번 더 고마움을 말하며 마무리해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 감사 다시 확인</span><div class=\"en\"><mark>We very much appreciate</mark> the chance to travel independently to town …</div><p class=\"ko\">저희는 시내로 혼자서 자유롭게 갈 수 있는 기회에 <mark>매우 감사드리며</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">버스 정류장 추가 설치에 감사하려고<small>3번 thank(감사하다) + adding a stop(정류장 추가)을 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">버스 정류장 환경 개선을 촉구하려고</span><span class=\"why\">[반대] 정류장 이야기는 맞지만, 3번은 고쳐 달라는 게 아니라 이미 추가해 준 것에 감사해요. 불만이나 요구는 한 줄도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">버스 배차 간격의 단축을 요구하려고</span><span class=\"why\">[지문에 없음] 4번에 운행 시간(오전 10시~오후 3시 등)이 나오지만 " class=\"wdb\" data-w=\"permit\" data-m=\"허용하다\"><b>permit</b>허용하다</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>however(그러나)</b> 뒤와 마지막 <b>needs to(~해야 한다)</b> 문장에 있어요. 1~2번의 ‘고생 안 시키기’를 3번이 뒤집고, 5번이 ‘<b>어려움을 겪어야 한다</b>’로 못 박아요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 뒤집힐 생각</span><div class=\"en\"><mark>To want to spare children from having to go through unpleasant experiences</mark> is a noble aim …</div><p class=\"ko\">자녀가 <mark>불쾌한 경험을 겪지 않도록</mark> 해 주고 싶어 하는 것은 고귀한 목적이며 …</p></div><div class=\"ck-via\"><i>▼</i><span>however(그러나)로 앞의 ‘고귀한 목적’을 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 방향 전환</span><div class=\"en\">What these parents don't realize, <mark>however</mark>, is that … in the long term they may be <mark>preventing their children</mark> from acquiring self-confidence …</div><p class=\"ko\"><mark>그러나</mark> 이 부모들이 깨닫지 못하는 것은 … 장기적으로는 그들이 자녀들이 자신감 … 을 얻지 못하도록 <mark>자녀들을 막고 있을지도 모른다</mark>는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>needs to(~해야 한다)로 필자의 결론을 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">For healthy development, <mark>the child needs to deal with some failure</mark>, struggle through some difficult periods, and experience some painful emotions.</div><p class=\"ko\">건강한 발달을 위해, <mark>아이는 어느 정도의 실패를 다룰 필요가 있고</mark>, 어려운 시기를 헤쳐 나가야 하며, 고통스러운 감정도 경험해야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">necessity of parents letting their child experience difficulties 부모가 자녀에게 어려움을 겪게 해 줄 필요성<small>5번 needs to(~해야 한다) = necessity(필요성), 실패(failure)·어려운 시기 = difficulties(어려움)</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">importance of parental emotional support for children 자녀에 대한 부모의 정서적 지지의 중요성</span><span class=\"why\">[반대] 2번의 사랑과 걱정(love and concern)은 3번 however(그러나)로 뒤집히는 쪽이에요. 감싸 주기보다 5번처럼 힘든 감정도 겪게 하라는 글이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">benefits of traditional child-rearing practices 전통적 양육 방식의 이점</span><span class=\"why\">[지문에 없음] 옛날 방식과 요즘 방식을 비교하는 말은 없어요. 4번의 19세기 작가는 주장을 거드는 인용일 뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">critical factors in children's physical development 아동 신체 발달의 결정적 요인</span><span class=\"why\">[지문에 없음] 5번 development(발달)는 몸이 아니라 자신감·정신력(3번) 같은 마음의 성장이에요. 키·체력 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">differences between the parents' and child's points of view 부모와 자녀의 관점 차이</span><span class=\"why\">[지문에 없음] 3번은 부모가 깨닫지 못하는 것을 말할 뿐, 부모와 아이의 생각 차이를 비교하지 않아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Many parents</div><div class=\"k\">많은 부모들은</div></div><div class=\"rc\"><div class=\"e\">who have experienced personal hardship</div><div class=\"k\">개인적인 고난을 겪어 본</div></div><div class=\"rc\"><div class=\"e\">desire a better life</div><div class=\"k\">더 나은 삶을 바란다</div></div><div class=\"rc\"><div class=\"e\">for their children.</div><div class=\"k\">자녀들을 위해.</div></div><div class=\"rnat\">개인적인 고난을 겪어 본 많은 부모는 자녀에게 더 나은 삶을 주고 싶어 한다.</div><div class=\"rst\">자전거를 배우는 동생을 떠올려 봐요. 넘어질까 봐 부모님이 뒤를 꼭 잡아 줘요. 지문도 고생해 본 부모는 아이가 더 편하게 살길 바란대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">To want to spare children</div><div class=\"k\">자녀가 ~하지 않게 해 주고 싶어 하는 것은</div></div><div class=\"rc\"><div class=\"e\">from having to go through unpleasant experiences</div><div class=\"k\">불쾌한 경험을 겪지 않도록</div></div><div class=\"rc\"><div class=\"e\">is a noble aim,</div><div class=\"k\">고귀한 목적이며,</div></div><div class=\"rc\"><div class=\"e\">and it naturally stems from</div><div class=\"k\">그리고 그것은 자연스럽게 비롯된다</div></div><div class=\"rc\"><div class=\"e\">love and concern for the child.</div><div class=\"k\">아이에 대한 사랑과 걱정에서.</div></div><div class=\"rnat\">아이가 불쾌한 일을 겪지 않게 해 주고 싶어 하는 마음은 숭고한 목표이며, 그것은 아이에 대한 사랑과 걱정에서 자연스럽게 나온다.</div><div class=\"rst\">“넘어지면 아프잖아” 하는 마음은 사랑에서 나와요. 지문도 아이가 <b>불쾌한 일을 안 겪게</b> 하려는 마음은 고귀하다고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">What these parents don't realize, <span class=\"cw\">however</span>, is that</div><div class=\"k\"><span class=\"cw\">그러나</span> 이 부모들이 깨닫지 못하는 것은 ~이다</div></div><div class=\"rc\"><div class=\"e\">while in the short term</div><div class=\"k\">단기적으로는</div></div><div class=\"rc\"><div class=\"e\">they may be making the lives of their children more pleasant,</div><div class=\"k\">그들(= 부모들)이 자녀들의 삶을 더 즐겁게 만들고 있을지도 모르지만,</div></div><div class=\"rc\"><div class=\"e\">in the long term</div><div class=\"k\">장기적으로는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they may be preventing their children</span></div><div class=\"k\"><span class=\"cw\">그들(= 부모들)이 자녀들을 막고 있을지도 모른다</span></div></div><div class=\"rc\"><div class=\"e\">from acquiring self-confidence, mental strength, and important interpersonal skills.</div><div class=\"k\">자신감, 정신력, 그리고 중요한 대인 관계 기술을 얻지 못하도록.</div></div><div class=\"rnat\">그러나 이 부모들이 깨닫지 못하는 것은, 단기적으로는 아이의 삶을 더 즐겁게 만들어 줄지 몰라도 장기적으로는 아이가 자신감과 정신력, 그리고 중요한 대인 관계 능력을 갖추지 못하게 막고 있을 수 있다는 점이다.</div><div class=\"rst\"><b>그런데</b>(however) 계속 잡아 주면 지금은 편해도, 결국 혼자 타는 힘을 못 길러요. 지문도 장기적으로 자신감·정신력을 <b>막는다</b>고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Samuel Smiles, a nineteenth-century English author,</div><div class=\"k\">19세기 영국 작가인 Samuel Smiles는</div></div><div class=\"rc\"><div class=\"e\">wrote,</div><div class=\"k\">이렇게 썼다.</div></div><div class=\"rc\"><div class=\"e\">“It is doubtful</div><div class=\"k\">“의심스럽다</div></div><div class=\"rc\"><div class=\"e\">whether any heavier curse could be forced on man</div><div class=\"k\">어떤 더 무거운 저주가 인간에게 가해질 수 있는지</div></div><div class=\"rc\"><div class=\"e\">than the complete gratification of all his wishes</div><div class=\"k\">그의 모든 소망이 완전히 충족되는 것보다</div></div><div class=\"rc\"><div class=\"e\">without effort on his part,</div><div class=\"k\">그 자신의 노력 없이,</div></div><div class=\"rc\"><div class=\"e\">leaving nothing for his hopes, desires, or struggles.”</div><div class=\"k\">그의 희망, 욕구, 분투를 위해 아무것도 남기지 않은 채.”</div></div><div class=\"rnat\">19세기 영국 작가 Samuel Smiles는 이렇게 썼다. \"자기 노력 없이 모든 소망이 완전히 충족되어 희망도 욕구도 분투도 남지 않게 되는 것보다 인간에게 더 무거운 저주가 있을지 의심스럽다.\"</div><div class=\"rst\">“다 해 주면 오히려 손해”라는 옛 작가 말을 빌려요. 지문의 19세기 작가도 노력 없이 다 이뤄지는 건 저주라고 했어요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">For healthy development,</div><div class=\"k\">건강한 발달을 위해,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the child needs to deal with some failure</span>,</div><div class=\"k\"><span class=\"cw\">아이는 어느 정도의 실패를 다룰 필요가 있고</span>,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">struggle through some difficult periods</span>,</div><div class=\"k\"><span class=\"cw\">어려운 시기를 헤쳐 나가야 하며</span>,</div></div><div class=\"rc\"><div class=\"e\">and experience some painful emotions.</div><div class=\"k\">고통스러운 감정도 경험해야 한다.</div></div><div class=\"rnat\">건강하게 자라려면 아이는 어느 정도 실패를 겪고, 힘든 시기를 헤쳐 나가며, 마음 아픈 감정도 경험해야 한다.</div><div class=\"rst\">그래서 동생도 몇 번 넘어지고 무릎이 까져 봐야 진짜 잘 타요. 지문 결론도 아이는 <b>실패와 어려움을 겪어야 한다</b>(needs to)예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"hardship\" data-m=\"고난, 역경\"><b>hardship</b>고난, 역경</button><button type=\"button\" class=\"wdb\" data-w=\"spare\" data-m=\"(A가 B를) 겪지 않게 해 주다\"><b>spare</b>(A가 B를) 겪지 않게 해 주다</button><button type=\"button\" class=\"wdb\" data-w=\"noble\" data-m=\"숭고한, 고귀한\"><b>noble</b>숭고한, 고귀한</button><button type=\"button\" class=\"wdb\" data-w=\"in the long term\" data-m=\"장기적으로\"><b>in the long term</b>장기적으로</button><button type=\"button\" class=\"wdb\" data-w=\"self-confidence\" data-m=\"자신감\"><b>self-confidence</b>자신감</button><button type=\"button\" class=\"wdb\" data-w=\"interpersonal skills\" data-m=\"대인 관계 능력\"><b>interpersonal skills</b>대인 관계 능력</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 글이 <b>끝까지 편드는 쪽</b>을 찾아요. 1번의 ‘맞을 게 뻔한 가설’을 <b>However(하지만)</b>가 뒤집고, 5~7번이 ‘<b>틀려도 괜찮다 → 틀린 데서 더 배운다</b>’로 한 방향이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 뒤집힐 생각</span><div class=\"en\">Some beginning researchers <mark>mistakenly believe</mark> that a good hypothesis is one that is guaranteed to be right …</div><p class=\"ko\">일부 초보 연구자들은 좋은 가설이란 맞는 것으로 보장된 가설이라고 <mark>잘못 믿는다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만)로 ‘맞을 게 뻔한 가설’이 쓸모없다고 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 방향 전환</span><div class=\"en\"><mark>However</mark>, if we already know your hypothesis is true before you test it, testing your hypothesis <mark>won't tell us anything new</mark>.</div><p class=\"ko\"><mark>하지만</mark>, 우리가 당신의 가설이 사실이라는 것을 이미 안다면 … 당신의 가설을 검증하는 것은 <mark>우리에게 아무런 새로운 것도 알려 주지 못할 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>새 지식을 찾아 나서면 틀릴 수 있는데, 그래도 괜찮대요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">If your predictions about what will happen in these uncharted waters <mark>are wrong</mark>, <mark>that's okay</mark>:</div><p class=\"ko\">이 미개척 영역에서 무슨 일이 일어날 것인지에 관한 당신의 예측이 <mark>틀리다면</mark>, <mark>그것은 괜찮다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Indeed(정말로)로 ‘틀린 예측이 더 가르쳐 준다’까지 밀어붙여요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 결론 굳히기</span><div class=\"en\">Indeed, scientists often <mark>learn more</mark> from predictions that <mark>do not turn out</mark> than from those that do.</div><p class=\"ko\">정말로, 과학자들은 종종 들어맞는 예측에서보다 <mark>들어맞지 않는</mark> 예측에서 <mark>더 많이 배운다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">Researchers 연구자여, Don't Be Afraid to Be Wrong 틀리는 것을 두려워하지 말라<small>5번 wrong(틀린) + okay(괜찮다), 7번 learn more(더 배운다)를 한 줄로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">One Small Mistake Can Ruin Your Whole Research 작은 실수 하나가 연구 전체를 망칠 수 있다</span><span class=\"why\">[반대] 6번은 과학자는 실수해도 된다(allowed to make mistakes)고 했어요. 실수가 연구를 망친다는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Hypotheses Are Different from Wild Guesses 가설은 마구잡이 추측과 다르다</span><span class=\"why\">[지문에 없음] 가설(hypothesis)은 나오지만, 마구잡이 추측과 비교하는 말은 없어요. 지문은 ‘틀려도 되는 가설’을 편들어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Why Researchers Are Reluctant to Share Their Data 연구자들이 자료 공유를 꺼리는 이유</span><span class=\"why\">[지문에 없음] 자료를 나누거나 숨기는 이야기는 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Why Hard Facts Don't Change Our Minds 확실한 사실이 우리 생각을 바꾸지 못하는 이유</span><span class=\"why\">[지문에 없음] 4번의 기정 사실(established facts)은 ‘떠나야 할 안전한 해변’일 뿐, 생각을 못 바꾼다는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Some beginning researchers mistakenly believe</div><div class=\"k\">일부 초보 연구자들은 잘못 믿는다</div></div><div class=\"rc\"><div class=\"e\">that a good hypothesis is one</div><div class=\"k\">좋은 가설이란 (바로) 그런 것이라고</div></div><div class=\"rc\"><div class=\"e\">that is guaranteed to be right</div><div class=\"k\">맞는 것으로 보장된 (가설)</div></div><div class=\"rc\"><div class=\"e\">(e.g., alcohol will slow down reaction time).</div><div class=\"k\">(예를 들어, '알코올은 반응 시간을 늦출 것이다').</div></div><div class=\"rnat\">일부 초보 연구자는 좋은 가설이란 반드시 맞을 것이 보장된 가설이라고 잘못 생각한다(예: '술은 반응 속도를 늦출 것이다').</div><div class=\"rst\">과학 수행평가 실험 주제를 정할 때, 어떤 친구는 “당연히 맞을 것”만 고르면 좋다고 <b>잘못</b> 생각해요. 지문의 초보 연구자들도 그래요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However,</span></div><div class=\"k\"><span class=\"cw\">하지만,</span></div></div><div class=\"rc\"><div class=\"e\">if we already know your hypothesis is true</div><div class=\"k\">우리가 당신의 가설이 사실이라는 것을 이미 안다면</div></div><div class=\"rc\"><div class=\"e\">before you test it,</div><div class=\"k\">당신이 그것(= 가설)을 검증하기 전에,</div></div><div class=\"rc\"><div class=\"e\">testing your hypothesis</div><div class=\"k\">당신의 가설을 검증하는 것은</div></div><div class=\"rc\"><div class=\"e\">won't tell us anything new.</div><div class=\"k\">우리에게 아무런 새로운 것도 알려 주지 못할 것이다.</div></div><div class=\"rnat\">그러나 검증하기도 전에 당신의 가설이 참이라는 것을 이미 알고 있다면, 그 가설을 검증해 봐야 새로운 것은 아무것도 알려 주지 못한다.</div><div class=\"rst\"><b>하지만</b>(However) 결과를 이미 아는 실험은 해 봐야 새로 알게 되는 게 없어요. 지문도 그런 검증은 새로운 걸 못 알려 준대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Remember,</div><div class=\"k\">기억하라,</div></div><div class=\"rc\"><div class=\"e\">research is supposed to produce new knowledge.</div><div class=\"k\">연구란 새로운 지식을 만들어 내야 하는 것이다.</div></div><div class=\"rnat\">기억하라, 연구란 &lt;b&gt;새로운&lt;/b&gt; 지식을 만들어 내야 하는 것이다.</div><div class=\"rst\">실험하는 이유는 몰랐던 걸 알아내려는 거잖아요. 지문도 연구는 <b>새로운 지식</b>을 만들어야 한다고 해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">To get new knowledge,</div><div class=\"k\">새로운 지식을 얻으려면,</div></div><div class=\"rc\"><div class=\"e\">you, as a researcher-explorer,</div><div class=\"k\">연구자이자 탐험가로서 당신은,</div></div><div class=\"rc\"><div class=\"e\">need to leave the safety of the shore (established facts)</div><div class=\"k\">해변의 안전함(기정 사실)을 떠나야 한다</div></div><div class=\"rc\"><div class=\"e\">and venture into uncharted waters</div><div class=\"k\">그리고 미개척 영역으로 과감히 들어가야 한다</div></div><div class=\"rc\"><div class=\"e\">(as Einstein said, “If we knew what we were doing, it would not be called research, would it?”).</div><div class=\"k\">(아인슈타인이 말했듯이, “우리가 무엇을 하고 있는지 안다면, 그것은 연구라고 불리지 않을 것이다, 그렇지?”).</div></div><div class=\"rnat\">새로운 지식을 얻으려면 연구자이자 탐험가인 당신은 안전한 해안(이미 확립된 사실)을 떠나 미개척 바다로 모험을 떠나야 한다 (아인슈타인의 말처럼 \"우리가 무엇을 하고 있는지 이미 알고 있다면 그것을 연구라고 부르지 않겠지요, 안 그런가요?\").</div><div class=\"rst\">그러려면 익숙한 동네를 벗어나 처음 가 보는 길로 들어가야 해요. 지문도 안전한 해변을 떠나 미개척 바다로 가래요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">If your predictions</div><div class=\"k\">당신의 예측이</div></div><div class=\"rc\"><div class=\"e\">about what will happen in these uncharted waters</div><div class=\"k\">이 미개척 영역에서 무슨 일이 일어날 것인지에 관한</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are wrong,</span></div><div class=\"k\"><span class=\"cw\">틀리다면,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that's okay:</span></div><div class=\"k\"><span class=\"cw\">그것은 괜찮다.</span></div></div><div class=\"rnat\">그 미개척 바다에서 무슨 일이 일어날지에 대한 당신의 예측이 틀렸다 해도 괜찮다.</div><div class=\"rst\">처음 가는 길이니 예상이 빗나갈 수도 있어요. 지문은 그래도 <b>괜찮다</b>(that's okay)고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Scientists are allowed to make mistakes</span></div><div class=\"k\"><span class=\"cw\">과학자는 실수해도 된다</span></div></div><div class=\"rc\"><div class=\"e\">(as Bates said, “Research is the process of going up alleys to see if they are blind”).</div><div class=\"k\">(Bates가 말했듯이, “연구란 골목길을 올라가 보며 막다른 길인지 확인하는 과정이다”).</div></div><div class=\"rnat\">과학자는 실수해도 된다 (Bates가 말했듯 \"연구란 막다른 길인지 확인하려고 골목을 올라가 보는 과정이다\").</div><div class=\"rst\">골목에 들어갔다가 막다른 길이면 돌아 나오면 돼요. 지문도 과학자는 <b>실수해도 된다</b>고 해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Indeed,</div><div class=\"k\">정말로,</div></div><div class=\"rc\"><div class=\"e\">scientists often learn more</div><div class=\"k\">과학자들은 종종 더 많이 배운다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">from predictions that do not turn out</span></div><div class=\"k\"><span class=\"cw\">들어맞지 않는 예측에서</span></div></div><div class=\"rc\"><div class=\"e\">than from those that do.</div><div class=\"k\">들어맞는 것(= 예측들)에서보다.</div></div><div class=\"rnat\">실제로 과학자들은 들어맞는 예측보다 &lt;b&gt;들어맞지 않는&lt;/b&gt; 예측에서 더 많이 배운다.</div><div class=\"rst\">오히려 빗나간 예상에서 “아, 이건 아니구나” 하고 <b>더 많이 배워요</b>. 지문 결론도 그래서 틀리는 걸 두려워 말라는 거예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"hypothesis\" data-m=\"가설\"><b>hypothesis</b>가설</button><button type=\"button\" class=\"wdb\" data-w=\"mistakenly\" data-m=\"잘못하여, 착각하여\"><b>mistakenly</b>잘못하여, 착각하여</button><button type=\"button\" class=\"wdb\" data-w=\"venture into\" data-m=\"~로 과감히 나아가다\"><b>venture into</b>~로 과감히 나아가다</button><button type=\"button\" class=\"wdb\" data-w=\"uncharted waters\" data-m=\"미개척 영역\"><b>uncharted waters</b>미개척 영역</button><button type=\"button\" class=\"wdb\" data-w=\"prediction\" data-m=\"예측\"><b>prediction</b>예측</button><button type=\"button\" class=\"wdb\" data-w=\"turn out\" data-m=\"(예측대로) 들어맞다\"><b>turn out</b>(예측대로) 들어맞다</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">콤마 앞에 <b>주어·동사 없는 덩어리</b>가 오면 분사구문이에요. 콤마 뒤 <b>주절의 주어</b>를 찾고, 그 주어가 직접 하면 <b>-ing(능동)</b>, 당하면 <b>p.p.(수동)</b>예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (5번)</span><div class=\"en\"><u>④ Cited</u> the need for managers to write their own answers …, Welch swept away the old order …</div><p class=\"ko\">( ? ) 관리자들이 스스로 답을 쓸 필요성을 — 콤마 앞에 주어·동사가 없는 덩어리</p></div><div class=\"ck-via\"><i>▼</i><span>콤마 뒤 주절의 주어는 Welch(웰치)예요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 주절의 주어 찾기</span><div class=\"en\">… to day-to-day management challenges, <mark>Welch swept away the old order</mark> …</div><p class=\"ko\">매일매일의 경영 과제에 대한, <mark>Welch는 낡은 질서를 일소했다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>Welch(웰치)가 필요성을 직접 ‘드는’ 쪽 + 뒤에 목적어 the need(필요성)가 있음 → 능동 -ing(~하면서)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\"><mark>Citing the need for managers</mark> to write their own answers …</div><p class=\"ko\"><mark>관리자들이 ~할 필요성을 언급하면서</mark> 그들 자신의 답을 쓸 …</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">분사구문의 능동 -ing(~하면서)와 수동 p.p.(~된 채로) 구별</p><p class=\"gr\">분사구문의 생략된 주어는 콤마 뒤 주절의 주어와 같아요. 그 주어가 직접 하면 -ing(~하면서), 당하면 p.p.(~된 채로)이고, 뒤에 목적어가 있으면 거의 늘 -ing(~하면서)예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Hearing the news, Mina cried.</div><div class=\"ko\">소식을 듣고 미나는 울었다. (미나가 직접 들으니 Hearing 듣고 가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Heard the news, Mina cried.</div><div class=\"ko\">미나가 소식을 ‘듣게 되는’ 게 아니라 직접 듣는데 Heard를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Written in English, the book is hard.</div><div class=\"ko\">영어로 쓰여 있어서 그 책은 어렵다. (책은 ‘쓰이는’ 쪽이라 Written 쓰인 이 맞아요)</div></div><p class=\"gb\">지문 5번도 주절 주어 Welch(웰치)가 필요성을 직접 ‘드는’ 사람이고 뒤에 목적어 the need(필요성)가 있어요. 그래서 Cited(언급된)가 아니라 Citing(언급하면서)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">Cited → Citing (언급하면서)<small>주어 Welch(웰치)가 직접 이유를 드는 쪽이고 뒤에 목적어 the need(필요성)가 있으니 능동 Citing(언급하면서)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">had not been used 사용되지 않았었다</span><span class=\"why\">4번의 주어는 these books(이 책들)예요. 책은 스스로 쓰는 게 아니라 ‘사용되는’ 쪽이라 수동 been used(사용된)가 맞고, 주절 had(가지고 있었다)보다 더 앞서 15년 동안 이어진 일이라 과거완료 had been(~되어 있었다)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">수동태 과거완료: had been(~되어 있었다) + p.p.(과거분사)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The bike had not been used for years.</div><div class=\"ko\">그 자전거는 몇 년 동안 사용되지 않았었다. (자전거는 ‘사용되는’ 쪽이라 수동이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The bike had not used for years.</div><div class=\"ko\">been(되어)이 빠져서 자전거가 직접 무언가를 쓴 것처럼 돼 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I had not used the bike for years.</div><div class=\"ko\">나는 몇 년 동안 그 자전거를 사용하지 않았었다. (사람이 직접 쓰니 능동이 맞아요)</div></div><p class=\"gb\">지문 4번도 these books(이 책들)가 15년 동안 ‘사용되지 않았던’ 것이라 had not been used(사용되지 않았었다)가 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">that 그것들이 ~하는</span><span class=\"why\">3번은 manuals(지침서들) 바로 뒤에 that(~하는)이 오고, 그다음에 주어 없이 동사 told(알려 주었다)가 와요. 앞 명사를 꾸미면서 주어 자리를 채우는 주격 관계대명사라 that(~하는)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~하는): 명사 + that(~하는) + 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a book that tells funny stories.</div><div class=\"ko\">나는 웃긴 이야기를 들려주는 책이 있다. (book 책 뒤에 that + 동사 tells가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a book what tells funny stories.</div><div class=\"ko\">앞에 꾸밀 명사 book(책)이 있는데 what(~하는 것)을 써서 틀려요.</div></div><p class=\"gb\">지문 3번도 a series of management training manuals(일련의 경영 교육 지침서) 뒤에 that(~하는) + told(알려 주었다)라서 that(~하는)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">done 처리된</span><span class=\"why\">3번의 get tasks done(업무를 처리하다)에서 tasks(업무)는 스스로 하는 게 아니라 ‘처리되는’ 쪽이에요. get(~하게 하다) + 목적어 + p.p.(~된) 구조라 과거분사 done(처리된)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">get(~하게 하다) + 목적어 + p.p.(목적어가 ~되게)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I got my homework done.</div><div class=\"ko\">나는 숙제를 끝냈다. (숙제는 ‘끝내지는’ 쪽이라 done 끝내진 이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I got my homework doing.</div><div class=\"ko\">숙제가 스스로 하는 게 아닌데 doing(하는)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I got my hair cut.</div><div class=\"ko\">나는 머리를 잘랐다. (머리카락은 ‘잘리는’ 쪽이라 cut 잘린 이 맞아요)</div></div><p class=\"gb\">지문 3번도 tasks(업무)가 ‘처리되는’ 쪽이라 get tasks done(업무를 처리하다)의 done(처리된)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">look them up 그것들을 찾아보다</span><span class=\"why\">6번은 are taught to find(찾도록 배운다) rather than(~보다는) 뒤라서, find(찾다)와 나란히 동사원형 look(보다)이 와요. 또 them(그것들) 같은 대명사는 look up(찾아보다) 사이에 끼워 look them up(그것들을 찾아보다)으로 써야 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">rather than(~보다는) 병렬 + 이어동사 사이의 대명사 목적어</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I want to walk rather than take a bus.</div><div class=\"ko\">나는 버스를 타기보다는 걷고 싶다. (to walk와 나란히 동사원형 take 타다 가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Look up them in the dictionary.</div><div class=\"ko\">them(그것들) 같은 대명사를 up 뒤에 둬서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Look them up in the dictionary.</div><div class=\"ko\">사전에서 그것들을 찾아봐라. (대명사가 look과 up 사이에 있어서 맞아요)</div></div><p class=\"gb\">지문 6번도 to find(찾도록)와 나란히 look(보다)이 오고, them(그것들 = 해결책들)이 look(보다)과 up(위로) 사이에 있어서 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Jack Welch is considered</div><div class=\"k\">Jack Welch는 여겨진다</div></div><div class=\"rc\"><div class=\"e\">to be one of the USA's top business leaders.</div><div class=\"k\">미국 최고의 경영 지도자 중 한 명으로.</div></div><div class=\"rnat\">Jack Welch는 미국 최고의 경영 지도자 중 한 명으로 여겨진다.</div><div class=\"rst\">잭 웰치(Jack Welch)는 미국 최고의 경영자 중 한 명으로 여겨져요. is considered to be(~로 여겨지다)는 수동 표현이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In a gesture</div><div class=\"k\">한 가지 몸짓으로</div></div><div class=\"rc\"><div class=\"e\">that was at once symbolic and real,</div><div class=\"k\">그것(= 그 몸짓)이 상징적이면서 동시에 실제적이기도 한,</div></div><div class=\"rc\"><div class=\"e\">Welch directed the ceremonial burning</div><div class=\"k\">Welch는 의식처럼 불태우도록 지시했다</div></div><div class=\"rc\"><div class=\"e\">of the old-fashioned GE Blue Books.</div><div class=\"k\">구식 GE Blue Books를.</div></div><div class=\"rnat\">상징적이면서 동시에 실제적이기도 한 몸짓으로, Welch는 구식 GE Blue Books를 의식처럼 불태우도록 지시했다.</div><div class=\"rst\">웰치(Welch)는 옛날 지침서인 블루북(Blue Books)을 불태우라고 했어요. 상징이면서 실제 행동이기도 했대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The Blue Books were a series of management training manuals</div><div class=\"k\">Blue Books는 일련의 경영 교육 지침서였다</div></div><div class=\"rc\"><div class=\"e\">that told</div><div class=\"k\">그것들(= 지침서들)이 알려 주는</div></div><div class=\"rc\"><div class=\"e\">how GE managers were to get tasks done</div><div class=\"k\">GE 관리자들이 어떻게 업무를 처리해야 하는지를</div></div><div class=\"rc\"><div class=\"e\">in the organization.</div><div class=\"k\">조직 안에서.</div></div><div class=\"rnat\">Blue Books는 GE 관리자들이 조직 안에서 어떻게 업무를 처리해야 하는지를 알려 주는 일련의 관리자 교육 지침서였다.</div><div class=\"rst\">블루북은 관리자들이 일을 어떻게 처리할지 알려 주는 책이었어요. 업무는 ‘처리되는’ 쪽이라 get tasks <b>done</b>(처리된)이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Despite the fact</div><div class=\"k\">사실에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">that these books for training</div><div class=\"k\">이 교육용 책들이</div></div><div class=\"rc\"><div class=\"e\">had not been used</div><div class=\"k\">사용되지 않았었다는</div></div><div class=\"rc\"><div class=\"e\">for some 15 years,</div><div class=\"k\">약 15년 동안,</div></div><div class=\"rc\"><div class=\"e\">they still had great influence</div><div class=\"k\">그것들(= 이 책들)은 여전히 큰 영향을 미치고 있었다</div></div><div class=\"rc\"><div class=\"e\">over the actions of GE managers.</div><div class=\"k\">GE 관리자들의 행동에.</div></div><div class=\"rnat\">이 교육용 책들이 15년쯤 사용되지 않았다는 사실에도 불구하고, 그것들은 여전히 GE 관리자들의 행동에 큰 영향을 미치고 있었다.</div><div class=\"rst\">15년쯤 아무도 안 썼는데도 관리자들 행동에 여전히 큰 영향을 줬어요. 책은 ‘사용되는’ 쪽이라 <b>had not been used</b>(사용되지 않았었다)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Citing the need for managers</span></div><div class=\"k\"><span class=\"cw\">관리자들이 ~할 필요성을 언급하면서</span> ※ 문제지엔 Cited로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">to write their own answers</div><div class=\"k\">그들 자신의 답을 쓸</div></div><div class=\"rc\"><div class=\"e\">to day-to-day management challenges,</div><div class=\"k\">매일매일의 경영 과제에 대한,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Welch swept away the old order</span></div><div class=\"k\"><span class=\"cw\">Welch는 낡은 질서를 일소했다</span></div></div><div class=\"rc\"><div class=\"e\">by removing the Blue Books</div><div class=\"k\">Blue Books를 제거함으로써</div></div><div class=\"rc\"><div class=\"e\">from the organization's culture.</div><div class=\"k\">조직 문화에서.</div></div><div class=\"rnat\">관리자들이 일상적인 경영 과제에 대해 스스로 답을 써야 할 필요를 &lt;b&gt;들면서&lt;/b&gt;, Welch는 조직 문화에서 Blue Books를 없애 버림으로써 낡은 질서를 쓸어냈다.</div><div class=\"rst\">웰치가 “스스로 답을 써야 한다”며 필요성을 직접 <b>들면서</b> 책을 없앴어요. 주어 웰치가 하는 쪽이라 <b>Citing</b>(언급하면서)이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Now, GE managers are taught</div><div class=\"k\">이제 GE 관리자들은 배운다</div></div><div class=\"rc\"><div class=\"e\">to find their own solutions</div><div class=\"k\">그들 자신의 해결책을 찾도록</div></div><div class=\"rc\"><div class=\"e\">rather than look them up</div><div class=\"k\">그것들(= 해결책들)을 찾아보기보다는</div></div><div class=\"rc\"><div class=\"e\">in a dusty old book.</div><div class=\"k\">먼지투성이 낡은 책에서.</div></div><div class=\"rnat\">이제 GE 관리자들은 먼지 쌓인 낡은 책에서 답을 찾아보는 대신 스스로 해결책을 찾도록 교육받는다.</div><div class=\"rst\">이제 관리자들은 낡은 책에서 찾기보다 스스로 해결책을 찾도록 배워요. find(찾다)와 나란히 look them up(그것들을 찾아보다)이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"ceremonial\" data-m=\"의식적인\"><b>ceremonial</b>의식적인</button><button type=\"button\" class=\"wdb\" data-w=\"old-fashioned\" data-m=\"구식의\"><b>old-fashioned</b>구식의</button><button type=\"button\" class=\"wdb\" data-w=\"get A done\" data-m=\"A를 처리하다, 끝내다\"><b>get A done</b>A를 처리하다, 끝내다</button><button type=\"button\" class=\"wdb\" data-w=\"despite the fact\" data-m=\"~라는 사실에도 불구하고\"><b>despite the fact</b>~라는 사실에도 불구하고</button><button type=\"button\" class=\"wdb\" data-w=\"cite\" data-m=\"(이유로) 들다, 인용하다\"><b>cite</b>(이유로) 들다, 인용하다</button><button type=\"button\" class=\"wdb\" data-w=\"sweep away\" data-m=\"쓸어 없애다, 일소하다\"><b>sweep away</b>쓸어 없애다, 일소하다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 첫 문장이면 <b>뒤 문장들이 되풀이하는 패턴</b>을 한 말로 묶으세요. 나방이 <b>올리면</b> 박쥐도 <b>올리는</b> 주고받기(경쟁) + 잡아먹히느냐(생사) + 소리(감각)예요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">… bats and their prey have <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> for millions of years.</div><p class=\"ko\">박쥐와 그 먹잇감은 수백만 년 동안 ( ? )</p></div><div class=\"ck-via\"><i>▼</i><span>나방의 귀(청각)가 왜 생겼는지 알려 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · ‘생사’와 ‘감각’ 단서</span><div class=\"en\">It's believed that <mark>hearing in moths</mark> arose specifically <mark>in response to the threat</mark> of being eaten by bats.</div><p class=\"ko\"><mark>나방의 청각이</mark> 특히 박쥐에게 잡아먹힌다는 <mark>위협에 대한 반응으로</mark> 생겨났다고 여겨진다.</p></div><div class=\"ck-via\"><i>▼</i><span>한쪽이 올리면 다른 쪽도 따라 올리는 주고받기 = 경쟁(arms race 군비 경쟁)</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">… moths have evolved the ability to detect sounds <mark>at ever higher frequencies</mark>, and, as they have, the frequencies of bats' vocalizations <mark>have risen, too</mark>.</div><p class=\"ko\">… 나방은 <mark>점점 더 높은 주파수의</mark> 소리를 감지하는 능력을 진화시켰고, 그것들이 그랬던 것처럼, <mark>박쥐의 발성 주파수도 높아졌다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>나방: 더 높은 소리 듣기 ↔ 박쥐: 더 높은 소리 내기</span><span><em>5번</em>나방: 비늘·털로 소리 흡수하는 ‘음향 위장’</span><span><em>6번</em>스텔스 항공기도 레이더 전파에 비슷한 일을 함</span></div><div class=\"ck-eq\">⇒ 공통점 = 소리(감각)로 공격·방어를 주고받는 끝없는 맞대응 = 군비 경쟁</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">been engaged in a life-or-death sensory arms race 생사를 건 감각 군비 경쟁을 벌여 왔다<small>2번 잡아먹힐 위협 = life-or-death(생사), 청각·주파수 = sensory(감각), 4번 맞대응 = arms race(군비 경쟁)</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">invented weapons that are not part of their bodies 몸의 일부가 아닌 무기를 만들어 냈다</span><span class=\"why\">6번 스텔스 항공기에 끌리기 쉽지만, 그건 사람이 만든 비슷한 예일 뿐이에요. 5번에서 나방의 비늘과 털은 오히려 몸의 일부예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">been in a fierce war over scarce food sources 부족한 먹이 자원을 두고 치열한 전쟁을 벌여 왔다</span><span class=\"why\">둘이 먹이를 두고 다투는 게 아니라, 2번처럼 박쥐가 나방을 잡아먹는 관계예요. 지문은 소리(주파수) 대결만 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">evolved to cope with other noise-producing wildlife 소음을 내는 다른 야생동물에 대처하도록 진화했다</span><span class=\"why\">2번에서 나방의 청각은 다른 동물이 아니라 바로 박쥐에게 잡아먹히는 위협 때문에 생겼어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">adapted to flying in night skies absent of any lights 빛이 전혀 없는 밤하늘을 나는 데 적응했다</span><span class=\"why\">빛이나 어둠에 적응하는 이야기는 없어요. 4·5번은 모두 주파수와 음파, 즉 소리 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">As always happens with natural selection,</div><div class=\"k\">자연 선택에서 항상 일어나는 것처럼,</div></div><div class=\"rc\"><div class=\"e\">bats and their prey have</div><div class=\"k\">박쥐와 그들(= 박쥐)의 먹잇감은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">been engaged in a life-or-death sensory arms race</span></div><div class=\"k\"><span class=\"cw\">생사가 걸린 감각의 군비 경쟁에 참여해 왔다</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">for millions of years.</div><div class=\"k\">수백만 년 동안.</div></div><div class=\"rnat\">자연 선택에서 항상 그렇듯, 박쥐와 그 먹잇감은 수백만 년 동안 &lt;b&gt;생사가 걸린 감각의 군비 경쟁에 참여해 왔다&lt;/b&gt;.</div><div class=\"rst\">깜깜한 방에서 하는 숨바꼭질을 떠올려 봐요. 지문도 박쥐(술래)와 나방(숨는 쪽)이 수백만 년 동안 <b>목숨 건 소리 대결</b>을 해 왔다는 얘기예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">It's believed</div><div class=\"k\">여겨진다</div></div><div class=\"rc\"><div class=\"e\">that hearing in moths arose</div><div class=\"k\">나방의 청각이 생겨났다고</div></div><div class=\"rc ckc\"><div class=\"e\">specifically <span class=\"cw\">in response to the threat</span></div><div class=\"k\">특히 <span class=\"cw\">위협에 대한 반응으로</span></div></div><div class=\"rc\"><div class=\"e\">of being eaten by bats.</div><div class=\"k\">박쥐에게 잡아먹힌다는.</div></div><div class=\"rnat\">나방의 청각은 박쥐에게 잡아먹힌다는 위협에 대한 반응으로 특별히 생겨난 것으로 여겨진다.</div><div class=\"rst\">숨는 친구는 잡히기 싫어서 귀를 쫑긋 세워요. 지문도 나방의 <b>귀(청각)</b>는 박쥐에게 잡아먹힐 <b>위협</b> 때문에 생겼대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">(Not all insects can hear.)</div><div class=\"k\">(모든 곤충이 들을 수 있는 것은 아니다.)</div></div><div class=\"rnat\">(모든 곤충이 들을 수 있는 것은 아니다.)</div><div class=\"rst\">아무나 귀가 밝은 건 아니에요. 지문도 모든 곤충이 다 들을 수 있는 건 아니라고 덧붙여요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Over millions of years,</div><div class=\"k\">수백만 년에 걸쳐,</div></div><div class=\"rc\"><div class=\"e\">moths have evolved the ability</div><div class=\"k\">나방은 능력을 진화시켰다</div></div><div class=\"rc\"><div class=\"e\">to detect sounds</div><div class=\"k\">소리를 감지하는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">at ever higher frequencies</span>,</div><div class=\"k\"><span class=\"cw\">점점 더 높은 주파수의</span>,</div></div><div class=\"rc\"><div class=\"e\">and, as they have,</div><div class=\"k\">그리고 그것들(= 나방)이 그랬던 것처럼,</div></div><div class=\"rc ckc\"><div class=\"e\">the frequencies of bats' vocalizations <span class=\"cw\">have risen, too</span>.</div><div class=\"k\"><span class=\"cw\">박쥐의 발성 주파수도 높아졌다</span>.</div></div><div class=\"rnat\">수백만 년에 걸쳐 나방은 점점 더 높은 주파수의 소리를 감지하는 능력을 진화시켰고, 그들이 그렇게 했던 것처럼 박쥐의 발성 주파수도 높아졌다.</div><div class=\"rst\">숨는 쪽이 높은 소리까지 들으면, 술래는 더 높은 소리를 내며 찾아요. 지문도 나방이 <b>더 높은</b> 소리를 듣자 박쥐 소리도 <b>높아졌대요</b>.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Some moth species have also evolved</div><div class=\"k\">일부 나방 종은 또한 진화시켰다</div></div><div class=\"rc\"><div class=\"e\">scales on their wings</div><div class=\"k\">날개의 비늘과</div></div><div class=\"rc\"><div class=\"e\">and a fur-like coat on their bodies;</div><div class=\"k\">몸에 모피 같은 외피를;</div></div><div class=\"rc\"><div class=\"e\">both act as “acoustic camouflage,”</div><div class=\"k\">둘 다(= 비늘과 외피) '음향 위장'으로 작용한다,</div></div><div class=\"rc\"><div class=\"e\">by absorbing sound waves</div><div class=\"k\">음파를 흡수함으로써</div></div><div class=\"rc\"><div class=\"e\">in the frequencies emitted by bats,</div><div class=\"k\">박쥐에 의해 방출되는 주파수의,</div></div><div class=\"rc\"><div class=\"e\">thereby preventing those sound waves</div><div class=\"k\">그렇게 해서 그 음파가</div></div><div class=\"rc\"><div class=\"e\">from bouncing back.</div><div class=\"k\">되돌아가는 것을 막는다.</div></div><div class=\"rnat\">일부 나방 종은 또한 날개의 비늘과 몸의 모피 같은 외피를 진화시켰다. 둘 다 '음향 위장'의 역할을 하는데, 박쥐에 의해 방출되는 주파수의 음파를 흡수하고, 그 때문에 그 음파가 되돌아가는 것을 방지한다.</div><div class=\"rst\">숨는 친구가 이불을 뒤집어써서 소리를 먹어 버려요. 지문도 나방의 비늘·털이 박쥐 소리를 흡수하는 ‘음향 위장’이래요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The B-2 bomber and other “stealth” aircraft</div><div class=\"k\">B-2 폭격기와 다른 '스텔스' 항공기는</div></div><div class=\"rc\"><div class=\"e\">have fuselages</div><div class=\"k\">기체를 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">made of materials</div><div class=\"k\">재료로 만들어진</div></div><div class=\"rc\"><div class=\"e\">that do something similar</div><div class=\"k\">그것들(= 재료들)이 유사한 일을 하는</div></div><div class=\"rc\"><div class=\"e\">with radar beams.</div><div class=\"k\">레이더 전파에 대해.</div></div><div class=\"rnat\">B-2 폭격기와 다른 '스텔스' 항공기는 레이더 전파에 대해 유사한 일을 하는 재료로 만들어진 기체를 가지고 있다.</div><div class=\"rst\">사람이 만든 비행기도 같은 꾀를 써요. 지문도 스텔스 항공기는 레이더 전파에 비슷한 일을 하는 재료로 만들어졌대요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"prey\" data-m=\"먹잇감\"><b>prey</b>먹잇감</button><button type=\"button\" class=\"wdb\" data-w=\"in response to\" data-m=\"~에 대한 반응으로\"><b>in response to</b>~에 대한 반응으로</button><button type=\"button\" class=\"wdb\" data-w=\"detect\" data-m=\"감지하다\"><b>detect</b>감지하다</button><button type=\"button\" class=\"wdb\" data-w=\"frequency\" data-m=\"주파수\"><b>frequency</b>주파수</button><button type=\"button\" class=\"wdb\" data-w=\"camouflage\" data-m=\"위장\"><b>camouflage</b>위장</button><button type=\"button\" class=\"wdb\" data-w=\"arms race\" data-m=\"군비 경쟁\"><b>arms race</b>군비 경쟁</button></div>"};

  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
