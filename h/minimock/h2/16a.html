<title>고2 미니모의고사 16회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){

  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

"]], "evh": "5번 문장", "ev": [{"en": true, "h": "Don't assume that there is some inherent value to the way you have always done things. Keep focused on becoming the best you can be, not how you have always been."}, {"en": false, "h": "과거 방식에 집착하지 말고 목표 달성에 가장 알맞은 새로운 모습으로 바뀌어야 한다는 내용이 반복되므로 이것이 ④의 근거이다."}], "opts": [{"n": "①", "t": "우선순위를 결정한 뒤 일을 시작하라.", "a": false, "x": true, "trap": false, "e": "우선순위 결정에 대한 언급은 본문에 없다."}, {"n": "②", "t": "신중하게 판단하고 신속하게 결정하라.", "a": false, "x": true, "trap": false, "e": "신중함이나 신속한 결정에 대한 언급은 본문에 없다."}, {"n": "③", "t": "전문성 개발을 위해 끊임없이 공부하라.", "a": false, "x": true, "trap": false, "e": "학습이나 공부에 대한 언급은 본문에 없다."}, {"n": "④", "t": "목표 달성을 위해 기존의 방식을 버려라.", "a": true, "x": false, "trap": false, "e": "과거 방식을 제쳐 두고 목표에 맞는 새로운 모습을 추구해야 한다는 내용과 정확히 일치한다."}, {"n": "⑤", "t": "실패를 성장과 개선을 위한 기회로 이용하라.", "a": false, "x": true, "trap": true, "e": "실패에 대한 언급은 본문에 없다 — 가장 많이 걸리는 오답(자기계발 상식과 혼동하기 쉬움)."}], "w": [["cling to", "고수하다"], ["historically", "과거에"], ["assume", "가정하다"], ["inherent", "고유한"]]}, {"q": "02", "type": "표 불일치", "src": "2021년 9월 25번", "ans": "⑤", "tr": [["1", "위 표는 2018년과 2019년의 한국 궁궐에 대한 한국인과 외국인 방문객 수를 보여준다."], ["2", "2018년부터 2019년까지 2년간, 덕수궁 총 방문객 수는 창경궁의 그것보다 더 많았다."], ["3", "창경궁 총 방문객 수는 2018년에서 2019년으로 감소한 반면, 덕수궁 총 방문객 수는 같은 기간 증가했다."], ["4", "2018년과 2019년 모두, 두 궁궐은 외국인 방문객보다 한국인 방문객이 더 많았다."], ["5", "2018년, 덕수궁 한국인 방문객 수는 창경궁 한국인 방문객 수의 절반보다 적었다."], ["6", "2019년, 창경궁 한국인 방문객 수는 외국인 방문객 수의 10배보다 많았다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "In 2019, the number of Korean visitors to Changgyeonggung Palace was more than 10 times the number of foreign visitors."}, {"en": false, "h": "2019년 창경궁 외국인 방문객은 9만 4천 명으로 그 10배는 94만 명인데, 한국인 방문객은 87만 4천 명에 그쳐 10배에 못 미치므로 표와 일치하지 않는다."}], "opts": [{"n": "①", "t": "For the two-year period of 2018 to 2019, the overall total number of visitors to Deoksugung Palace was larger than that to Changgyeonggung Palace.", "a": false, "x": false, "trap": false, "e": "덕수궁 총합 3,627천 명이 창경궁 총합 3,029   if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{

  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){

}

  $('#b').onclick=()=>{view='word';render();};
}

  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>명령문</b>에 있어요. 1~2번 경영대학원 이야기는 비유일 뿐이고, 3번 <b>Follow</b>(따르라)·4번 <b>Don't assume</b>(생각하지 마라)·5번 <b>Keep focused</b>(계속 집중해라)가 반복하는 ‘늘 해 오던 방식을 버려라’를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 비유의 핵심</span><div class=\"en\">he or she first <mark>puts aside</mark> whatever has been done historically, and focuses instead on what the policy should be.</div><p class=\"ko\">그나 그녀는(= 경영자) 과거에 행해졌던 것은 어떤 것이든 일단 <mark>제쳐 두고</mark>, 대신 그 정책이 (앞으로) 어떤 것이 되어야 하는지에 집중한다.</p></div><div class=\"ck-via\"><i>▼</i><span>경영자 이야기를 ‘당신’에게로 옮겨 와요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 명령문 시작</span><div class=\"en\"><mark>Follow the same approach</mark> as you examine how you should look, speak and act to best achieve your objectives.</div><p class=\"ko\">당신의 목표를 가장 잘 달성하기 위해 어떻게 보이고, 말하고, 행동해야 할지 검토할 때 <mark>같은 접근법을 따르라</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>‘같은 접근법’이 무엇인지 부정 명령문으로 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\"><mark>Don't assume</mark> that there is some inherent value to <mark>the way you have always done things</mark>.</div><p class=\"ko\"><mark>당신이 늘 일을 해 왔던 방식에</mark> 어떤 고유한 가치가 있다고 <mark>생각하지 마라</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>명령문으로 결론을 반복해요: 옛 모습이 아니라 최고의 모습</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 한 번 더 확인</span><div class=\"en\"><mark>Keep focused on becoming the best you can be</mark>, not how you have always been.</div><p class=\"ko\">당신이 늘 있어왔던 방식이 아니라, <mark>될 수 있는 최고가 되는 것에 계속 집중해라</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">목표 달성을 위해 기존의 방식을 버려라.<small>3번 objectives(목표) + 4번 the way you have always done things(늘 해 오던 방식)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">우선순위를 결정한 뒤 일을 시작하라.</span><span class=\"why\">[지문에 없음] 2번에 policy(정책) 검토가 나오지만, 무엇을 먼저 할지 순서를 정하라는 말은 없어요. 지문의 핵심은 옛 방식을 제쳐 두는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">신중하게 판단하고 신속하게 결정하라.</span><span class=\"why\">[지문에 없음] 1번 management decisions(경영 의사결정)라는 말 때문에 끌리지만, 판단의 속도 이야기는 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">전문성 개발을 위해 끊임없이 공부하라.</span><span class=\"why\">[지문에 없음] 1번 business school(경영대학원)은 비유의 배경일 뿐이에요. 공부를 계속하라는 문장은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">실패를 성장과 개선을 위한 기회로 이용하라.</span><span class=\"why\">[지문에 없음] 실패 이야기는 없어요. 4번은 실패가 아니라 늘 해 오던 방식(the way you have always done things)을 버리라고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In business school</div><div class=\"k\">경영대학원에서는</div></div><div class=\"rc\"><div class=\"e\">they teach an approach to management decisions</div><div class=\"k\">경영 의사결정에 대한 접근법을 가르친다</div></div><div class=\"rc\"><div class=\"e\">that is designed to overcome</div><div class=\"k\">극복하기 위해 고안된</div></div><div class=\"rc\"><div class=\"e\">our natural tendency to cling to the familiar,</div><div class=\"k\">익숙한 것을 고수하고자 하는 우리의 타고난 성향을,</div></div><div class=\"rc\"><div class=\"e\">whether or not it works.</div><div class=\"k\">그것이(= 익숙한 것) 효과가 있든 없든 간에.</div></div><div class=\"rnat\">경영대학원에서는 그것이 효과가 있든 없든 익숙한 것을 고수하려는 우리의 타고난 성향을 극복하도록 고안된 경영 의사결정 접근법을 가르친다.</div><div class=\"rst\">늘 쓰던 공부법이 안 맞아도 사람은 익숙해서 계속 써요. = 지문 1번, 익숙한 것에 <b>매달리는 성향</b>(cling to the familiar)을 극복하는 방법을 가르친대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">If an executive wants to examine a company policy,</div><div class=\"k\">경영자가 어떤 회사 정책을 검토하고 싶으면,</div></div><div class=\"rc\"><div class=\"e\">he or she first puts aside</div><div class=\"k\">그나 그녀는(= 경영자) 일단 제쳐 두고</div></div><div class=\"rc\"><div class=\"e\">whatever has been done historically,</div><div class=\"k\">과거에 행해졌던 것은 어떤 것이든,</div></div><div class=\"rc\"><div class=\"e\">and focuses instead on</div><div class=\"k\">대신 집중한다</div></div><div class=\"rc\"><div class=\"e\">what the policy should be.</div><div class=\"k\">그 정책이 (앞으로) 어떤 것이 되어야 하는지에.</div></div><div class=\"rnat\">만약 경영자가 회사 정책을 검토하고 싶다면, 그는 먼저 과거에 해왔던 것은 무엇이든 제쳐 두고, 대신 그 정책이 어떻게 되어야 하는지에 집중한다.</div><div class=\"rst\">새 학기 공부 계획을 짤 때, 작년에 하던 방식은 일단 <b>제쳐 두고</b>(puts aside) ‘어떻게 해야 하지?’부터 생각해요. = 지문 2번 경영자의 방식이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Follow the same approach</div><div class=\"k\">같은 접근법을 따르라</div></div><div class=\"rc\"><div class=\"e\">as you examine</div><div class=\"k\">당신이 검토할 때</div></div><div class=\"rc\"><div class=\"e\">how you should look, speak and act</div><div class=\"k\">당신이 어떻게 보이고, 말하고, 행동해야 할지</div></div><div class=\"rc\"><div class=\"e\">to best achieve your objectives.</div><div class=\"k\">당신의 목표를 가장 잘 달성하기 위해서.</div></div><div class=\"rnat\">당신의 목표를 가장 잘 달성하기 위해 당신이 어떻게 보이고 말하고 행동해야 하는지 검토할 때도 같은 접근법을 따르라.</div><div class=\"rst\">내가 어떻게 말하고 행동해야 목표를 이룰지 볼 때도 <b>같은 방법을 따르라</b>(Follow the same approach)고 지문 3번은 말해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Don't assume</span></div><div class=\"k\"><span class=\"cw\">생각하지 마라</span></div></div><div class=\"rc\"><div class=\"e\">that there is some inherent value</div><div class=\"k\">어떤 고유한 가치가 있다고</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">the way you have always done things.</span></div><div class=\"k\"><span class=\"cw\">당신이 늘 일을 해 왔던 방식에.</span></div></div><div class=\"rnat\">당신이 늘 해왔던 방식에 어떤 고유한 가치가 있다고 가정하지 마라.</div><div class=\"rst\">“난 원래 이렇게 해 왔으니까 이게 맞아” 하고 <b>생각하지 마세요</b>(Don't assume). = 지문 4번, 늘 하던 방식에 특별한 가치가 있는 게 아니에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Keep focused on becoming the best you can be,</span></div><div class=\"k\"><span class=\"cw\">될 수 있는 최고가 되는 것에 계속 집중해라,</span></div></div><div class=\"rc\"><div class=\"e\">not how you have always been.</div><div class=\"k\">당신이 늘 있어왔던 방식이 아니라.</div></div><div class=\"rnat\">당신이 늘 그래왔던 모습이 아니라, 될 수 있는 최고의 모습이 되는 데 계속 집중하라.</div><div class=\"rst\">예전의 나 말고, 내가 될 수 있는 <b>최고의 나</b>에 집중해요. 지문 5번이 결론, 옛 방식을 버리고 목표를 향해 바뀌라는 거예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"cling to\" data-m=\"~을 고수하다, ~에 매달리다\"><b>cling to</b>~을 고수하다, ~에 매달리다</button><button type=\"button\" class=\"wdb\" data-w=\"the familiar\" data-m=\"익숙한 것\"><b>the familiar</b>익숙한 것</button><button type=\"button\" class=\"wdb\" data-w=\"put aside\" data-m=\"~을 제쳐 두다\"><b>put aside</b>~을 제쳐 두다</button><button type=\"button\" class=\"wdb\" data-w=\"historically\" data-m=\"과거에\"><b>historically</b>과거에</button><button type=\"button\" class=\"wdb\" data-w=\"assume\" data-m=\"가정하다, (당연히) 생각하다\"><b>assume</b>가정하다, (당연히) 생각하다</button><button type=\"button\" class=\"wdb\" data-w=\"inherent\" data-m=\"고유한, 타고난\"><b>inherent</b>고유한, 타고난</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">표 불일치는 선지의 <b>배수·비율</b>(몇 배, 절반)부터 직접 계산하세요. 대소 비교는 눈으로 끝나지만, <b>몇 배</b>는 곱해 봐야 틀린 게 보여요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번 문장: 2년 총합, 덕수궁이 창경궁보다 많음 → 표와 같음</span><span><em>②</em>3번 문장: 창경궁 감소, 덕수궁 증가 → 표와 같음</span><span><em>③</em>4번 문장: 두 해 모두 두 궁 다 한국인이 더 많음 → 표와 같음</span><span><em>④</em>5번 문장: 2018년 덕수궁 한국인이 창경궁 한국인의 절반보다 적음 → 표와 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 표와 같아요 → 남은 ⑤의 ‘10배’를 직접 곱해 보기</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><span class=\"lab\">⑤ 앞부분 (6번)</span><div class=\"en\">In 2019, the number of <mark>Korean visitors</mark> to Changgyeonggung Palace</div><p class=\"ko\">2019년에, 창경궁의 <mark>한국인 방문객</mark>의 수는</p></div><div class=\"ck-via\"><i>▼</i><span>외국인 9만 4천 명 × 10 = 94만 명인데, 한국인은 87만 4천 명뿐이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 결정적 단서</span><div class=\"en\">was <mark>more than 10 times</mark> the number of foreign visitors.</div><p class=\"ko\">외국인 방문객 수의 <mark>10배보다 더 많았다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">2019년 창경궁 한국인 방문객이 외국인의 10배보다 많았다<small>외국인 9만 4천 명의 10배는 94만 명인데 한국인은 87만 4천 명이라 10배가 안 돼요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">2018년 덕수궁 한국인 방문객이 창경궁 한국인의 절반보다 적었다(less than half)</span><span class=\"why\">5번과 표가 같아요. 이것도 계산 선지라 헷갈리지만, 창경궁 한국인 수를 반으로 나눠 보면 덕수궁 쪽이 그보다 적어서 맞는 문장이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2년 동안 덕수궁 총 방문객이 창경궁보다 많았다(larger)</span><span class=\"why\">2번과 표가 같아요. 2018년과 2019년을 더한 overall total(전체 총합)을 비교하면 덕수궁이 더 커요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">창경궁은 감소하고(decreased) 덕수궁은 증가했다(increased)</span><span class=\"why\">3번과 표가 같아요. 창경궁 총합은 줄고 덕수궁 총합은 늘어서, 두 궁의 방향이 서로 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">두 해 모두 두 궁 다 한국인 방문객이 외국인보다 많았다(more)</span><span class=\"why\">4번과 표가 같아요. 2018년·2019년, 덕수궁·창경궁 네 칸 모두 Korean(한국인) 수가 foreign(외국인) 수보다 커요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The tables above show</div><div class=\"k\">위 표는 보여준다</div></div><div class=\"rc\"><div class=\"e\">the number of Korean and foreign visitors</div><div class=\"k\">한국인 및 외국인 방문객의 수를</div></div><div class=\"rc\"><div class=\"e\">to Korean palaces in 2018 and 2019.</div><div class=\"k\">2018년과 2019년의 한국 궁궐에 대한.</div></div><div class=\"rnat\">위 표는 2018년과 2019년의 한국 궁궐에 대한 한국인과 외국인 방문객 수를 보여준다.</div><div class=\"rst\">우리 학교 축제와 옆 학교 축제에 온 ‘학생’과 ‘손님’ 수를 두 해 동안 센 표라고 생각해요. = 지문 1번, 덕수궁·창경궁의 한국인·외국인 방문객 표예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">① For the two-year period of 2018 to 2019,</div><div class=\"k\">① 2018년부터 2019년까지 2년의 기간 동안,</div></div><div class=\"rc\"><div class=\"e\">the overall total number of visitors to Deoksugung Palace</div><div class=\"k\">덕수궁의 전반적인 총 방문객의 수는</div></div><div class=\"rc\"><div class=\"e\">was larger than that to Changgyeonggung Palace.</div><div class=\"k\">창경궁의 그것(총 방문객의 수)보다 더 컸다.</div></div><div class=\"rnat\">2018년부터 2019년까지 2년간, 덕수궁 총 방문객 수는 창경궁의 그것보다 더 많았다.</div><div class=\"rst\">두 해를 더하면 우리 학교 축제에 온 사람이 더 많아요. = 지문 2번, 2년 <b>전체 총합</b>(overall total)은 덕수궁이 더 커요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">② While the total number of visitors to Changgyeonggung Palace</div><div class=\"k\">② 창경궁의 총 방문객의 수가</div></div><div class=\"rc\"><div class=\"e\">decreased from 2018 to 2019,</div><div class=\"k\">2018년에서 2019년으로 감소한 반면,</div></div><div class=\"rc\"><div class=\"e\">the total number of visitors to Deoksugung Palace</div><div class=\"k\">덕수궁의 총 방문객의 수는</div></div><div class=\"rc\"><div class=\"e\">increased during the same period.</div><div class=\"k\">같은 기간 동안 증가했다.</div></div><div class=\"rnat\">창경궁 총 방문객 수는 2018년에서 2019년으로 감소한 반면, 덕수궁 총 방문객 수는 같은 기간 증가했다.</div><div class=\"rst\">옆 학교 축제는 작년보다 사람이 줄고, 우리 학교는 늘었어요. = 지문 3번 창경궁 <b>decreased</b>(감소했다)·덕수궁 <b>increased</b>(증가했다)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">③ During both 2018 and 2019,</div><div class=\"k\">③ 2018년과 2019년 두 해 모두,</div></div><div class=\"rc\"><div class=\"e\">the two palaces had more Korean visitors</div><div class=\"k\">두 개의 궁은 한국인 방문객이 더 많았다</div></div><div class=\"rc\"><div class=\"e\">than foreign visitors.</div><div class=\"k\">외국인 방문객보다.</div></div><div class=\"rnat\">2018년과 2019년 모두, 두 궁궐은 외국인 방문객보다 한국인 방문객이 더 많았다.</div><div class=\"rst\">두 축제 모두, 두 해 내내 손님보다 학생이 더 많이 왔어요. = 지문 4번, 두 궁 다 한국인이 외국인보다 <b>더 많았다</b>(more)는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">④ In 2018,</div><div class=\"k\">④ 2018년에,</div></div><div class=\"rc\"><div class=\"e\">the number of Korean visitors to Deoksugung Palace</div><div class=\"k\">덕수궁의 한국인 방문객의 수는</div></div><div class=\"rc\"><div class=\"e\">was less than half</div><div class=\"k\">절반보다 더 적었다</div></div><div class=\"rc\"><div class=\"e\">the number of Korean visitors to Changgyeonggung Palace.</div><div class=\"k\">창경궁의 한국인 방문객 수의.</div></div><div class=\"rnat\">2018년, 덕수궁 한국인 방문객 수는 창경궁 한국인 방문객 수의 절반보다 적었다.</div><div class=\"rst\">첫해 우리 학교 축제에 온 학생은 옆 학교 학생의 반도 안 돼요. = 지문 5번, 2018년 덕수궁 한국인이 창경궁의 <b>절반보다 더 적었다</b>(less than half)예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">⑤ In 2019,</div><div class=\"k\">⑤ 2019년에,</div></div><div class=\"rc\"><div class=\"e\">the number of Korean visitors to Changgyeonggung Palace</div><div class=\"k\">창경궁의 한국인 방문객의 수는</div></div><div class=\"rc ckc\"><div class=\"e\">was <span class=\"cw\">more than 10 times</span></div><div class=\"k\"><span class=\"cw\">10배보다 더 많았다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the number of foreign visitors.</span></div><div class=\"k\"><span class=\"cw\">외국인 방문객 수의.</span></div></div><div class=\"rnat\">2019년, 창경궁 한국인 방문객 수는 외국인 방문객 수의 10배보다 많았다.</div><div class=\"rst\">옆 학교 손님의 10배보다 학생이 많다고요? 지문의 2019년 창경궁 외국인은 9만 4천 명, 10배면 94만 명인데 한국인은 87만 4천 명이라 <b>10배보다 많다</b>는 틀렸어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"overall total\" data-m=\"전체 총합\"><b>overall total</b>전체 총합</button><button type=\"button\" class=\"wdb\" data-w=\"decreased\" data-m=\"감소했다 (decrease 감소하다)\"><b>decreased</b>감소했다 (decrease 감소하다)</button><button type=\"button\" class=\"wdb\" data-w=\"increased\" data-m=\"증가했다 (increase 증가하다)\"><b>increased</b>증가했다 (increase 증가하다)</button><button type=\"button\" class=\"wdb\" data-w=\"less than half\" data-m=\"절반보다 적은\"><b>less than half</b>절반보다 적은</button><button type=\"button\" class=\"wdb\" data-w=\"more than 10 times\" data-m=\"10배보다 더 많은\"><b>more than 10 times</b>10배보다 더 많은</button><button type=\"button\" class=\"wdb\" data-w=\"foreign visitors\" data-m=\"외국인 방문객\"><b>foreign visitors</b>외국인 방문객</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>however</b>(그러나)·<b>must</b>(~해야 한다)·<b>should</b>(~해야 한다)가 있는 문장에 있어요. 1번 칭찬 뒤 2번 But(그러나)으로 돈벌이만 쫓는 문제를 말하고, 3번에서 방향을 틀어 4번 <b>책임</b>(responsibilities)으로 결론을 맺어요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 반대편 이야기</span><div class=\"en\">But they are leaders of companies that appear to have only one purpose: the single-minded pursuit of <mark>short-term profit</mark> and “shareholder value.”</div><p class=\"ko\">그러나 그들은 <mark>단기의 이익</mark>과 '주주 가치'의 한결같은 추구라는 유일한 하나의 목표를 가진 것으로 보이는 회사의 지도자들이다.</p></div><div class=\"ck-via\"><i>▼</i><span>however(그러나)로 돈벌이 이야기를 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 결론 신호</span><div class=\"en\">I believe, <mark>however</mark>, that the media industry … <mark>must act differently</mark> than other industries</div><p class=\"ko\"><mark>그러나</mark> 나는 미디어 산업이 … 다른 산업들과 <mark>다르게 행동해야 한다고</mark> 믿는다</p></div><div class=\"ck-via\"><i>▼</i><span>‘다르게 행동해야’가 무엇인지 should(~해야 한다)로 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 요지</span><div class=\"en\">the right to use them <mark>should necessarily carry</mark> serious and long-lasting <mark>responsibilities</mark> to <mark>promote the public good</mark>.</div><p class=\"ko\">그것들을(= 이 자산들) 사용할 권리는 <mark>공공의 이익을 증진할</mark> 중대하고 오래 지속되는 <mark>책임을</mark> <mark>반드시 가져야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">미디어 산업은 공익을 증진할 책임이 있다.<small>4번 responsibilities(책임) + promote the public good(공공의 이익을 증진하다)을 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">방송 통신과 관련된 법 개정이 시급하다.</span><span class=\"why\">[지문에 없음] 3번 public airwaves(공중파)가 나와서 끌리지만, 법을 바꾸자는 말은 없어요. 필자는 법이 아니라 미디어의 책임을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">공익 방송 시청률이 점점 하락하고 있다.</span><span class=\"why\">[지문에 없음] 시청률이나 하락하는 숫자 이야기는 한 번도 안 나와요. 4번 public good(공공의 이익)과 단어만 비슷해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">미디어 산업은 시설의 현대화를 꾀하고 있다.</span><span class=\"why\">[지문에 없음] 4번 priceless assets(귀한 자산)는 시설이 아니라 공중파·디지털 스펙트럼, 아이들의 마음에 닿는 통로예요. 현대화 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">미디어에 대한 비판적 시각을 기를 필요가 있다.</span><span class=\"why\">[지문에 없음] 시청자에게 비판적 시각을 기르라는 말은 없어요. 필자는 미디어 산업 쪽이 must act differently(다르게 행동해야 한다)고 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Many of the leaders</div><div class=\"k\">지도자들 중 다수는</div></div><div class=\"rc\"><div class=\"e\">I know in the media industry</div><div class=\"k\">내가 미디어 업계에서 아는</div></div><div class=\"rc\"><div class=\"e\">are intelligent, capable, and honest.</div><div class=\"k\">지적이고, 유능하고, 정직하다.</div></div><div class=\"rnat\">내가 미디어 업계에서 아는 지도자들 중 다수는 지적이고, 유능하고, 정직하다.</div><div class=\"rst\">우리 학교 방송부 선배들은 똑똑하고 성실하고 정직해요. = 지문 1번, 미디어 업계 지도자들 다수가 유능하고 정직하다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">But they are leaders of companies</div><div class=\"k\">그러나 그들은 회사의 지도자들이다</div></div><div class=\"rc\"><div class=\"e\">that appear to have only one purpose:</div><div class=\"k\">유일한 하나의 목표를 가진 것으로 보이는</div></div><div class=\"rc\"><div class=\"e\">the single-minded pursuit of short-term profit and “shareholder value.”</div><div class=\"k\">단기의 이익과 '주주 가치'의 한결같은 추구라는.</div></div><div class=\"rnat\">그러나 그들은 단기의 이익과 '주주 가치'의 한결같은 추구라는 유일한 하나의 목표를 가진 것으로 보이는 회사의 지도자들이다.</div><div class=\"rst\"><b>그런데</b> 방송부가 인기만 노려 조회수 올리는 데만 정신이 팔려 있대요. = 지문 2번, 회사들이 <b>단기 이익</b>만 쫓는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\">I believe, <span class=\"cw\">however,</span></div><div class=\"k\"><span class=\"cw\">그러나 나는 믿는다,</span></div></div><div class=\"rc\"><div class=\"e\">that the media industry,</div><div class=\"k\">미디어 산업이</div></div><div class=\"rc\"><div class=\"e\">by its very nature and role in our society and global culture,</div><div class=\"k\">우리 사회와 세계 문화에서의 (그것의) 바로 그 본질과 역할로 인해,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">must act differently than other industries</span> —</div><div class=\"k\"><span class=\"cw\">다른 산업들과 다르게 행동해야 한다고</span> —</div></div><div class=\"rc\"><div class=\"e\">especially because they have the free use of</div><div class=\"k\">특히 (그것들이) 자유롭게 이용하고</div></div><div class=\"rc\"><div class=\"e\">our public airwaves and our digital spectrum,</div><div class=\"k\">우리의 공중파와 (우리의) 디지털 스펙트럼을,</div></div><div class=\"rc\"><div class=\"e\">and have almost unlimited access to</div><div class=\"k\">거의 제한이 없는 접근을 하기 때문에</div></div><div class=\"rc\"><div class=\"e\">our children's hearts and minds.</div><div class=\"k\">우리 아이들의 감정과 생각에.</div></div><div class=\"rnat\">그러나 나는 미디어 산업이 우리 사회와 세계 문화에서의 (그것의) 바로 그 본질과 역할로 인해, 다른 산업들과 다르게 행동해야 한다고 믿는데, 특히 (그것들이) 우리의 공중파와 (우리의) 디지털 스펙트럼을 자유롭게 이용하고, 우리 아이들의 감정과 생각에 거의 제한이 없는 접근을 하기 때문이다.</div><div class=\"rst\"><b>하지만</b>(however) 필자는 방송부는 달라야 한다고 믿어요. 교내 방송을 마음껏 쓰고 아이들 귀에 바로 닿으니까요. = 지문 3번이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">These are priceless assets,</div><div class=\"k\">이것들은 귀한 자산이고,</div></div><div class=\"rc\"><div class=\"e\">and the right to use them</div><div class=\"k\">그것들을(= 이 자산들) 사용할 권리는</div></div><div class=\"rc\"><div class=\"e\">should necessarily carry</div><div class=\"k\">반드시 가져야 한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">serious and long-lasting responsibilities</span></div><div class=\"k\"><span class=\"cw\">중대하고 오래 지속되는 책임을</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to promote the public good.</span></div><div class=\"k\"><span class=\"cw\">공공의 이익을 증진할.</span></div></div><div class=\"rnat\">이것들은 귀한 자산이고, 그것들을 사용할 권리는 공공의 이익을 증진할 중대하고 오래 지속되는 책임을 반드시 가져야 한다.</div><div class=\"rst\">그 방송 시간은 정말 귀한 거라, 쓰는 만큼 모두에게 도움이 되는 방송을 할 <b>책임</b>이 따라요. 지문 4번이 요지, 공공의 이익을 증진할 책임이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"single-minded\" data-m=\"한결같은, 오로지 한 가지만 생각하는\"><b>single-minded</b>한결같은, 오로지 한 가지만 생각하는</button><button type=\"button\" class=\"wdb\" data-w=\"pursuit\" data-m=\"추구\"><b>pursuit</b>추구</button><button type=\"button\" class=\"wdb\" data-w=\"shareholder value\" data-m=\"주주 가치\"><b>shareholder value</b>주주 가치</button><button type=\"button\" class=\"wdb\" data-w=\"airwaves\" data-m=\"공중파, 방송 전파\"><b>airwaves</b>공중파, 방송 전파</button><button type=\"button\" class=\"wdb\" data-w=\"priceless assets\" data-m=\"귀한(값진) 자산\"><b>priceless assets</b>귀한(값진) 자산</button><button type=\"button\" class=\"wdb\" data-w=\"public good\" data-m=\"공공의 이익\"><b>public good</b>공공의 이익</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 동사 앞에 <b>이미 동사가 있는지</b>, 두 동사를 잇는 <b>접속사(and 등)가 있는지</b> 보세요. 동사는 있는데 접속사가 없으면 뒤 동사는 <b>분사구문 -ing</b>(~하면서)로 바꿔야 해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (7번)</span><div class=\"en\">Lions and tigers, for instance, first eat the blood, … of the animals they kill, often <u>⑤ leave</u> the muscle meat for eagles.</div><p class=\"ko\">사자나 호랑이는 먼저 먹는다 … 흔히 기름기 없는 고기는 독수리를 위해 ( 남긴다? ) — 동사 eat 뒤에 접속사 없이 또 동사</p></div><div class=\"ck-via\"><i>▼</i><span>주어 Lions and tigers(사자나 호랑이)의 동사는 eat(먹는다)로 이미 나왔어요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 · 이미 있는 동사</span><div class=\"en\">Lions and tigers, for instance, <mark>first eat</mark> the blood, hearts, livers, and brains</div><p class=\"ko\">사자나 호랑이는, 예를 들어, 피, 심장, 간, 그리고 뇌를 <mark>먼저 먹는다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>쉼표 뒤에 and(그리고)가 없으니 동사를 또 쓸 수 없어요 → leaving(남기면서)</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">of the animals they kill, <mark>often leaving</mark> the muscle meat for eagles.</div><p class=\"ko\">그들이(= 사자나 호랑이) 죽인 동물의, 흔히 기름기 없는 고기는 독수리를 위해 <mark>남기면서</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">분사구문: 접속사 없이 동사 두 개를 이을 때는 -ing(~하면서)</p><p class=\"gr\">한 문장에 주어 하나, 동사 하나가 기본이에요. 쉼표 뒤에 and(그리고) 같은 접속사 없이 동작을 하나 더 붙이려면 동사를 -ing(~하면서)로 바꿔 분사구문으로 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My dog ate the meat, leaving the vegetables.</div><div class=\"ko\">우리 개는 고기를 먹었다, 채소는 남기면서. (접속사가 없으니 leaving(남기면서)이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My dog ate the meat, left the vegetables.</div><div class=\"ko\">접속사 없이 동사 ate(먹었다)와 left(남겼다)를 나란히 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My dog ate the meat and left the vegetables.</div><div class=\"ko\">and(그리고)로 이으면 동사 left(남겼다)를 그대로 써도 맞아요.</div></div><p class=\"gb\">지문 7번도 eat(먹는다)가 이미 동사이고 쉼표 뒤에 and(그리고)가 없어요. 그래서 leave(남기다)가 아니라 leaving(남기면서)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">leave → leaving (남기면서)<small>eat(먹는다)가 이미 동사이고 접속사가 없으니 분사구문 leaving(남기면서)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">preferred 선호했다</span><span class=\"why\">4번 the evidence suggests(증거는 시사한다) 뒤 that(~라는 것)절의 동사 자리예요. 여기 suggest(시사하다)는 ‘해야 한다’는 제안이 아니라 사실을 보여 주는 뜻이라 과거 사실 preferred(선호했다)가 그대로 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">suggest(시사하다)가 ‘사실을 보여 주다’ 뜻이면 that(~라는 것)절은 그냥 시제대로</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The dirty plate suggests that Minsu ate the cake.</div><div class=\"ko\">더러운 접시는 민수가 케이크를 먹었다는 것을 보여 준다. (이미 일어난 사실이라 과거형 ate(먹었다)가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The dirty plate suggests that Minsu eat the cake.</div><div class=\"ko\">‘먹어야 한다’는 제안이 아니라 사실을 말하는데 동사원형 eat(먹다)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Mom suggested that we eat more vegetables.</div><div class=\"ko\">엄마는 우리가 채소를 더 먹어야 한다고 제안했다. (이건 ‘제안하다’ 뜻이라 동사원형 eat(먹다)이 맞아요)</div></div><p class=\"gb\">지문 4번은 증거가 과거 인류가 실제로 비계·내장을 더 좋아했다는 사실을 보여 주니 preferred(선호했다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">do 그러하다</span><span class=\"why\">1번 as we do today(오늘날 우리가 그러하듯)의 do(그러하다)는 앞의 동사 ate(먹었다)를 대신하는 대동사예요. 주어 we(우리)의 지금 일이라 현재형 do(그러하다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">대동사 do(그러하다): 앞에 나온 일반동사를 되풀이하지 않고 do(그러하다)로 대신함</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My friend likes pizza, as I do.</div><div class=\"ko\">내 친구는 피자를 좋아한다, 나도 그러하듯. (do = like pizza(피자를 좋아하다)라서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My friend likes pizza, as I am.</div><div class=\"ko\">likes(좋아하다)는 일반동사인데 be동사 am으로 받아서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My friend likes pizza, as I does.</div><div class=\"ko\">주어가 I(나)인데 does를 써서 틀려요.</div></div><p class=\"gb\">지문 1번도 일반동사 ate(먹었다)를 받는 자리이고 주어가 we(우리)라 do(그러하다)가 딱 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">relatively 비교적</span><span class=\"why\">3번 a relatively recent phenomenon(비교적 최근의 현상)에서 relatively(비교적)는 형용사 recent(최근의)를 꾸며요. 형용사를 꾸미는 건 부사라서 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">형용사를 꾸미는 말은 부사: a + 부사 + 형용사 + 명사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It was a really cold day.</div><div class=\"ko\">정말 추운 날이었다. (부사 really(정말)가 형용사 cold(추운)를 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It was a real cold day.</div><div class=\"ko\">형용사 real(진짜의)이 형용사 cold(추운)를 꾸밀 수 없어서 틀려요.</div></div><p class=\"gb\">지문 3번도 relatively(비교적)가 형용사 recent(최근의)를 꾸미니 부사가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">while giving 주는 반면</span><span class=\"why\">5번 the Inuit were careful to save(이누이트족이 주의 깊게 보관했다) 뒤에 ‘개에게 주는 반면’이 붙는 자리예요. 이누이트족이 직접 주는 쪽이라 능동 giving(주는)이고, 접속사 while(~하는 반면)을 남긴 분사구문이라 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">접속사 + 분사구문: while(~하는 동안/반면) + -ing(능동)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I did my homework while listening to music.</div><div class=\"ko\">나는 음악을 들으면서 숙제를 했다. (내가 직접 듣는 거라 능동 listening(듣는)이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I did my homework while listened to music.</div><div class=\"ko\">while(~하면서) 뒤에 주어 없이 과거형 listened(들었다)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I did my homework while I listened to music.</div><div class=\"ko\">주어 I(나)를 다 쓰면 과거형 listened(들었다)도 맞아요.</div></div><p class=\"gb\">지문 5번도 주어가 없는 while(~하는 반면) 뒤라서, 이누이트족이 직접 주는 능동 giving(주는)이 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Some researchers assumed</div><div class=\"k\">몇몇 연구자들은 추정했다</div></div><div class=\"rc\"><div class=\"e\">early human beings ate</div><div class=\"k\">초기 인류가 먹었다고</div></div><div class=\"rc\"><div class=\"e\">mainly the muscle flesh of animals,</div><div class=\"k\">주로 동물의 근육 살코기를,</div></div><div class=\"rc\"><div class=\"e\">as we do today.</div><div class=\"k\">오늘날 우리가 그러하듯.</div></div><div class=\"rnat\">몇몇 연구자들은 초기 인류가 오늘날 우리가 그러하듯 주로 동물의 근육 살코기(기름기 없는 살코기)를 먹었을 것으로 추정했다.</div><div class=\"rst\">몇몇 연구자는 옛날 사람도 지금 우리처럼 살코기를 먹었다고 생각했어요. as we do(우리가 그러하듯)의 do(그러하다)는 앞의 ate(먹었다)를 대신해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">By “meat,”</div><div class=\"k\">'고기'라는 말로,</div></div><div class=\"rc\"><div class=\"e\">they meant</div><div class=\"k\">그들은(= 몇몇 연구자들) 의미했다</div></div><div class=\"rc\"><div class=\"e\">the muscle of the animal.</div><div class=\"k\">동물의 근육을.</div></div><div class=\"rnat\">그들에게 '고기'는 동물의 기름기 없는 고기를 의미했다.</div><div class=\"rst\">그 연구자들이 말한 ‘고기’는 동물의 근육, 즉 살코기였어요. = 지문 2번이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Yet focusing on the muscle</div><div class=\"k\">하지만 근육에 주목하는 것은</div></div><div class=\"rc\"><div class=\"e\">appears to be</div><div class=\"k\">~인 것으로 보인다</div></div><div class=\"rc\"><div class=\"e\">a relatively recent phenomenon.</div><div class=\"k\">비교적 최근의 현상.</div></div><div class=\"rnat\">하지만 기름기 없는 고기에 주목하는 것은 비교적 최근의 현상으로 보인다.</div><div class=\"rst\">하지만 살코기를 중심으로 먹는 건 <b>비교적</b>(relatively) 최근 일이래요. 부사 relatively(비교적)가 형용사 recent(최근의)를 꾸며요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In every history on the subject,</div><div class=\"k\">이 주제에 관한 모든 역사에서,</div></div><div class=\"rc\"><div class=\"e\">the evidence suggests</div><div class=\"k\">그 증거는 시사한다</div></div><div class=\"rc\"><div class=\"e\">that early human populations preferred</div><div class=\"k\">초기 인류가 선호했다는 것을</div></div><div class=\"rc\"><div class=\"e\">the fat and organ meat of the animal</div><div class=\"k\">동물의 비계와 내장육을</div></div><div class=\"rc\"><div class=\"e\">over its muscle meat.</div><div class=\"k\">그 동물의 기름기 없는 고기보다.</div></div><div class=\"rnat\">이 주제에 관한 모든 역사에서, 초기 인류가 기름기 없는 고기보다는 동물의 비계와 내장육을 더 선호했다는 것을 시사하는 증거가 있다.</div><div class=\"rst\">증거를 보면 옛날 사람은 살코기보다 비계와 내장을 더 <b>좋아했어요</b>(preferred 선호했다). 이미 있었던 사실이라 과거형이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Vilhjalmur Stefansson, an arctic explorer,</div><div class=\"k\">북극 탐험가 Vilhjalmur Stefansson(비얄무르 스테판손)은,</div></div><div class=\"rc\"><div class=\"e\">found that the Inuit were careful</div><div class=\"k\">이누이트족이 주의 깊게 했다는 것을 알아냈다</div></div><div class=\"rc\"><div class=\"e\">to save fatty meat and organs for human consumption</div><div class=\"k\">인간의 섭취를 위해 지방이 많은 고기와 내장은 보관하는 데</div></div><div class=\"rc\"><div class=\"e\">while giving muscle meat to the dogs.</div><div class=\"k\">반면 기름기 없는 고기는 개에게 줬다.</div></div><div class=\"rnat\">북극 탐험가 Vilhjalmur Stefansson(비얄무르 스테판손)은 이누이트족이 인간의 섭취를 위해 지방이 많은 고기와 내장은 주의 깊게 보관하는 반면 기름기 없는 고기는 개에게 줬다는 사실을 알아냈다.</div><div class=\"rst\">이누이트족도 비계와 내장은 사람 몫으로 챙기고, 살코기는 개에게 줬어요. while giving(주는 반면)은 접속사를 남긴 분사구문이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In this way,</div><div class=\"k\">이런 식으로,</div></div><div class=\"rc\"><div class=\"e\">humans ate</div><div class=\"k\">인간은 먹었다</div></div><div class=\"rc\"><div class=\"e\">as other large, meat-eating mammals eat.</div><div class=\"k\">다른 큰 육식 포유동물이 먹는 것처럼.</div></div><div class=\"rnat\">이런 식으로, 인간은 다른 큰 육식 포유동물이 먹는 것처럼 먹었다.</div><div class=\"rst\">이런 식으로 사람도 다른 큰 육식 동물처럼 먹었다는 거예요. = 지문 6번이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Lions and tigers,</div><div class=\"k\">사자나 호랑이는,</div></div><div class=\"rc\"><div class=\"e\">for instance,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">first eat</span> the blood, hearts, livers, and brains</div><div class=\"k\">피, 심장, 간, 그리고 뇌를 <span class=\"cw\">먼저 먹는다</span></div></div><div class=\"rc\"><div class=\"e\">of the animals they kill,</div><div class=\"k\">그들이(= 사자나 호랑이) 죽인 동물의,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">often leaving</span> the muscle meat for eagles.</div><div class=\"k\">흔히 기름기 없는 고기는 독수리를 위해 <span class=\"cw\">남기면서</span>. ※ 문제지엔 leave로 되어 있음</div></div><div class=\"rnat\">예를 들어, 사자나 호랑이는 그들이 죽인 동물의 피, 심장, 간, 그리고 뇌를 먼저 먹고, 흔히 기름기 없는 고기는 독수리를 위해 남긴다.</div><div class=\"rst\">사자와 호랑이도 피·심장·간·뇌를 <b>먼저 먹고</b>, 살코기는 독수리에게 <b>남기면서</b>(leaving) 가요. 동사 eat(먹는다) 뒤라 leave(남기다)는 못 와요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">These organs</div><div class=\"k\">이런 내장은</div></div><div class=\"rc\"><div class=\"e\">tend to be much higher in fat.</div><div class=\"k\">지방이 훨씬 더 많은 경향이 있다.</div></div><div class=\"rnat\">이런 내장은 지방이 훨씬 더 많은 경향이 있다.</div><div class=\"rst\">이런 내장에는 지방이 훨씬 많아요. 그래서 동물들이 내장부터 먹는다는 거예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"muscle flesh\" data-m=\"근육 살코기\"><b>muscle flesh</b>근육 살코기</button><button type=\"button\" class=\"wdb\" data-w=\"relatively\" data-m=\"비교적\"><b>relatively</b>비교적</button><button type=\"button\" class=\"wdb\" data-w=\"phenomenon\" data-m=\"현상\"><b>phenomenon</b>현상</button><button type=\"button\" class=\"wdb\" data-w=\"organ meat\" data-m=\"내장육\"><b>organ meat</b>내장육</button><button type=\"button\" class=\"wdb\" data-w=\"consumption\" data-m=\"섭취\"><b>consumption</b>섭취</button><button type=\"button\" class=\"wdb\" data-w=\"mammal\" data-m=\"포유동물\"><b>mammal</b>포유동물</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">5번은 산악인의 <b>방법</b>(by ~함으로써)을 말하고, 6번은 그 방법의 <b>목적</b>(몸이 적응할 시간)을 말해요. 쉬어 가며 오르는 건 고산병을 <b>막는 쪽</b>이니, 그 방향과 거꾸로인 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 고산병의 원인</span><div class=\"en\">the <mark>lack of oxygen</mark> makes them feel tired, dizzy, and sick.</div><p class=\"ko\">다시 말해서 <mark>산소의 부족</mark>이 그들을 피곤하고 어지럽고 아프다고 느끼게 만드는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>문제지 ④번 자리엔 get(걸리다)이 있지만, 쉬어 가며 오르는 건 고산병을 ‘피하는’ 방법이라 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (5번)</span><div class=\"en\">they <mark>avoid</mark> altitude sickness by climbing to one level and then resting for a few days.</div><p class=\"ko\">그들은 어느 지점까지 오르고 나서 며칠을 쉬어줌으로써 고산병을 <mark>피한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>쉬는 이유 = 산소 부족에 적응할 시간 벌기 → 고산병 예방</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 결정적 단서</span><div class=\"en\">This gives their bodies time <mark>to adapt to the lack of oxygen</mark> before climbing even higher.</div><p class=\"ko\">이것은 그들의 몸이 시간을 갖게 해 준다 <mark>산소의 부족에 적응할</mark> 훨씬 더 높은 곳을 오르기 전에.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">get(걸리다, 얻다) ↔ avoid(피하다)</p><p class=\"gr\">‘조심하는 행동’ 뒤에는 나쁜 일을 avoid(피하다)가 와요. 쉬기·준비하기 같은 예방 행동으로 병을 get(걸리다)한다고 하면 원인과 결과의 방향이 거꾸로예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I avoid a cold by washing my hands.</div><div class=\"ko\">나는 손을 씻음으로써 감기를 피한다. (예방 행동 → 피한다)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I get a cold by washing my hands.</div><div class=\"ko\">손을 씻어서 감기에 걸린다? 예방 행동인데 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I get a cold by playing in the rain.</div><div class=\"ko\">나는 빗속에서 놀아서 감기에 걸린다. (나쁜 행동 → 걸린다)</div></div><p class=\"gb\">지문 5번의 resting for a few days(며칠 쉬는 것)는 6번처럼 몸이 적응하게 돕는 예방 행동이라, get(걸리다)이 아니라 avoid(피하다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">get → avoid (피하다)<small>쉬어 가며 오르는 건 몸이 적응할 시간을 벌어 고산병을 avoid(피하다)하려는 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">outstanding 뛰어난</span><span class=\"why\">4번 This(이것)는 3번 ‘고지대 사람 몸은 산소 부족에 익숙하다’를 가리켜요. 산소가 적은 곳에 익숙한 선수가 산소 많은 저지대로 오면 더 잘하니 outstanding(뛰어난)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">lack 부족</span><span class=\"why\">1번에서 높이 오를수록 산소가 decreases(감소한다)라고 했어요. 그래서 피곤하고 어지러운 원인은 산소의 lack(부족)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">normally 정상적으로</span><span class=\"why\">3번 because(~때문에) 뒤에서 몸이 산소 부족에 used to(익숙해진) 상태라고 했어요. 익숙하니 고지대 사람은 normally(정상적으로) 숨 쉬는 게 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">adapt 적응하다</span><span class=\"why\">5번에서 며칠씩 resting(쉬는 것)을 하는 이유가 6번이에요. 더 높이 오르기 전에 몸이 산소 부족에 adapt(적응하다)할 시간을 주는 거라 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">As you climb higher and higher,</div><div class=\"k\">더욱 더 높이 등반할수록,</div></div><div class=\"rc\"><div class=\"e\">the amount of oxygen in the atmosphere decreases.</div><div class=\"k\">대기 속의 산소의 양은 감소한다.</div></div><div class=\"rnat\">더 높이 더 높이 오를수록, 대기 속 산소의 양은 감소한다.</div><div class=\"rst\">학교 뒷산을 높이 오를수록 공기 속 산소가 줄어요. = 지문 1번, 높이 갈수록 산소 양이 <b>감소한다</b>(decreases)는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">When people from lower areas visit areas of high altitude,</div><div class=\"k\">저지대 사람들이 고지대 지역을 방문할 때는,</div></div><div class=\"rc\"><div class=\"e\">they may suffer from altitude sickness;</div><div class=\"k\">그들은 고산병을 겪을 수도 있는데,</div></div><div class=\"rc\"><div class=\"e\">the lack of oxygen makes them feel tired, dizzy, and sick.</div><div class=\"k\">다시 말해서 산소의 부족이 그들을 피곤하고 어지럽고 아프다고 느끼게 만드는 것이다.</div></div><div class=\"rnat\">저지대 사람들이 고지대 지역을 방문할 때, 그들은 고산병을 겪을 수 있는데, 산소의 부족은 그들을 피곤하고 어지럽고 아프게 느끼게 만든다.</div><div class=\"rst\">평지에 사는 우리가 높은 산에 가면 고산병에 걸릴 수 있어요. 산소가 <b>부족해서</b>(lack 부족) 피곤하고 어지러워요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">People living in high altitudes</div><div class=\"k\">고지대에 살고 있는 사람들은</div></div><div class=\"rc\"><div class=\"e\">are able to breathe normally</div><div class=\"k\">정상적으로 호흡할 수 있다</div></div><div class=\"rc\"><div class=\"e\">because their bodies have become used to the shortage of oxygen.</div><div class=\"k\">그들의 몸이 산소의 부족에 적응되어 있기 때문에.</div></div><div class=\"rnat\">고지대에 사는 사람들은 그들의 몸이 산소 부족에 익숙해졌기 때문에 정상적으로 호흡할 수 있다.</div><div class=\"rst\">산 위 마을 친구는 산소가 적어도 <b>정상적으로</b>(normally) 숨 쉬어요. 몸이 산소 부족에 익숙해졌거든요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This also means</div><div class=\"k\">이것은 또한 의미한다</div></div><div class=\"rc\"><div class=\"e\">that athletes from those areas</div><div class=\"k\">그런 지역(고지대)에 사는 운동선수들이</div></div><div class=\"rc\"><div class=\"e\">can achieve outstanding performances at lower altitudes.</div><div class=\"k\">저지대에서 뛰어난 성적을 거둘 수 있다는 것을.</div></div><div class=\"rnat\">이것은 또한 그 지역 출신 선수들이 저지대에서 뛰어난 성적을 거둘 수 있다는 것을 의미한다.</div><div class=\"rst\">그래서 그 친구가 평지 운동회에 오면 달리기에서 <b>뛰어난</b>(outstanding) 성적을 내요. = 지문 4번이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">When mountaineers attempt to climb high peaks,</div><div class=\"k\">산악인들이 높은 봉우리를 오르려고 할 때,</div></div><div class=\"rc ckc\"><div class=\"e\">they <span class=\"cw\">avoid</span> altitude sickness</div><div class=\"k\">그들은 고산병을 <span class=\"cw\">피한다</span>.</div></div><div class=\"rc ckc\"><div class=\"e\">by climbing to one level and then <span class=\"cw\">resting for a few days.</span></div><div class=\"k\">어느 지점까지 오르고 나서 <span class=\"cw\">며칠을 쉬어줌으로써.</span></div></div><div class=\"rnat\">산악인들이 높은 봉우리를 오르려고 시도할 때, 그들은 한 지점까지 오른 다음 며칠 쉬는 것으로써 고산병을 피한다.</div><div class=\"rst\">등산부는 높은 산을 오를 때 한 지점까지 가서 며칠 쉬어요. 그래야 고산병을 <b>피해요</b>(avoid 피하다). 문제지의 get(걸리다)은 거꾸로예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">This gives their bodies time</div><div class=\"k\">이것은 그들의 몸이 시간을 갖게 해 준다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to adapt to the lack of oxygen</span></div><div class=\"k\"><span class=\"cw\">산소의 부족에 적응할</span></div></div><div class=\"rc\"><div class=\"e\">before climbing even higher.</div><div class=\"k\">훨씬 더 높은 곳을 오르기 전에.</div></div><div class=\"rnat\">이것은 그들의 몸이 훨씬 더 높이 오르기 전에 산소 부족에 적응할 시간을 준다.</div><div class=\"rst\">그렇게 쉬면 몸이 산소 부족에 <b>적응할</b>(adapt) 시간이 생겨요. = 지문 6번, 쉬는 이유가 바로 이거예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"atmosphere\" data-m=\"대기\"><b>atmosphere</b>대기</button><button type=\"button\" class=\"wdb\" data-w=\"altitude sickness\" data-m=\"고산병\"><b>altitude sickness</b>고산병</button><button type=\"button\" class=\"wdb\" data-w=\"dizzy\" data-m=\"어지러운\"><b>dizzy</b>어지러운</button><button type=\"button\" class=\"wdb\" data-w=\"shortage\" data-m=\"부족\"><b>shortage</b>부족</button><button type=\"button\" class=\"wdb\" data-w=\"outstanding performances\" data-m=\"뛰어난 성적\"><b>outstanding performances</b>뛰어난 성적</button><button type=\"button\" class=\"wdb\" data-w=\"adapt to\" data-m=\"~에 적응하다\"><b>adapt to</b>~에 적응하다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 바로 뒤 <b>because</b>(~ 때문에)가 이유를 알려 줘요. 빛이 눈에 오기까지 <b>시차</b>(time lag)가 있으니, 앞의 별 이야기처럼 가까운 물체도 <b>과거의 모습</b>이라는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (7번)</span><div class=\"en\"><mark>Besides faraway things</mark>, even the immediate objects around us are <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> because there is still a time lag …</div><p class=\"ko\">멀리 떨어진 것들 외에도, 심지어 우리 주변 가까운 물체들조차 ( ? )이다 — 빛이 눈에 오는 데 시차가 있기 때문에</p></div><div class=\"ck-via\"><i>▼</i><span>Besides faraway things(멀리 떨어진 것들 외에도) = 앞의 우주 이야기를 이어받아요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 앞의 근거</span><div class=\"en\">When you look into space, you are looking into <mark>an ancient past</mark>.</div><p class=\"ko\">당신이 우주를 들여다볼 때, 당신은 <mark>아주 오래된 과거를</mark> 들여다보고 있는 것이다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>이미 죽은 별도 이동해 오는 빛 때문에 아직 보임</span><span><em>5번</em>6,000만 광년 떨어진 별에서 지구를 보면 공룡이 보임</span><span><em>6번</em>우주의 끝을 보면 우주의 시작이 보일지도 모름</span></div><div class=\"ck-eq\">⇒ 세 장면의 공통점 = 빛이 오는 동안 시간이 흘러서, 보이는 건 늘 과거의 모습</div></div><div class=\"ck-via\"><i>▼</i><span>because(~ 때문에) 뒤 이유: 가까워도 빛이 오는 데 시간이 걸려요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">because there is still a <mark>time lag</mark> for the reflection of light to reach our eyes.</div><p class=\"ko\">이는 빛의 반사가 우리 눈에 도달하는 데 (걸리는) <mark>시간상의 차이(시차)</mark>가 여전히 존재하기 때문이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">all afterimages of the past 모두 과거의 잔상들<small>2번 an ancient past(아주 오래된 과거) + 7번 time lag(시차)를 한 말로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">results of the big bang 빅뱅의 결과들</span><span class=\"why\">6번에 우주의 beginning(시작)이 나와서 끌리지만, 그건 ‘과거가 보인다’는 예시일 뿐이에요. 7번 because(~ 때문에) 뒤 이유는 빅뱅이 아니라 빛의 time lag(시차)예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">derived from exploration 탐험에서 얻어진</span><span class=\"why\">지문에 탐험 이야기는 없어요. 7번은 물체를 직접 찾아가는 게 아니라 빛이 우리 눈에 도달하는 시간을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">mixes of light(빛), colors(색), and shading(음영) 빛·색·음영의 혼합</span><span class=\"why\">light(빛)라는 단어만 같아요. 7번은 빛이 섞이는 게 아니라 빛이 오는 데 걸리는 time lag(시차)가 핵심이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">signs directly encoded in our genes 유전자에 직접 새겨진 신호</span><span class=\"why\">유전자 이야기는 지문에 없어요. 8번 감각도 유전자가 아니라 정보가 뇌로 전달되기를 기다려야 한다는 시간 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Science can only tell us</div><div class=\"k\">과학은 우리에게 말해줄 수 있을 뿐이고</div></div><div class=\"rc\"><div class=\"e\">how the world appears to us,</div><div class=\"k\">세상이 우리에게 어떻게 보이는지를,</div></div><div class=\"rc\"><div class=\"e\">not how it is independent of our observation of it,</div><div class=\"k\">그것이(= 세상) 우리의 관찰과 별개로 어떤지가 아니라,</div></div><div class=\"rc\"><div class=\"e\">and therefore right now will always elude science.</div><div class=\"k\">그렇기 때문에 '지금 현재'는 항상 과학을 교묘히 피해갈 것이다.</div></div><div class=\"rnat\">과학은 세상이 우리가 관찰하는 것과 별개로 어떤지가 아니라, 다만 세상이 우리에게 어떻게 보이는지만을 말해줄 수 있으며, 그렇기 때문에 '지금 이 순간'은 항상 과학을 교묘히 벗어날 것이다.</div><div class=\"rst\">친구들과 캠핑 가서 밤하늘을 봐요. 과학은 ‘우리 눈에 어떻게 보이는지’만 알려 줘서, 진짜 ‘<b>지금 이 순간</b>’은 늘 놓친대요. = 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">When you look into space,</div><div class=\"k\">당신이 우주를 들여다볼 때,</div></div><div class=\"rc ckc\"><div class=\"e\">you are looking into <span class=\"cw\">an ancient past.</span></div><div class=\"k\">당신은 <span class=\"cw\">아주 오래된 과거를</span> 들여다보고 있는 것이다.</div></div><div class=\"rnat\">당신이 우주를 들여다볼 때, 당신은 아주 오래된 과거를 들여다보고 있는 것이다.</div><div class=\"rst\">망원경으로 별을 보는 건 사실 <b>아주 오래된 과거</b>를 보는 거예요. = 지문 2번, 우주를 보면 옛날을 보는 셈이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Some of the stars are already long dead</div><div class=\"k\">몇몇 별들은 이미 오랫동안 생명(빛)을 잃은 상태이지만</div></div><div class=\"rc\"><div class=\"e\">yet we still see them</div><div class=\"k\">그럼에도 불구하고 우리는 여전히 그것들을(= 별들) 본다</div></div><div class=\"rc\"><div class=\"e\">because of their traveling light.</div><div class=\"k\">그것들의(= 별들의) 이동하는 빛 때문에.</div></div><div class=\"rnat\">몇몇 별들은 이미 오래전에 죽었지만, 우리는 그것들이 보낸 빛이 이동해 오고 있기 때문에 여전히 그것들을 본다.</div><div class=\"rst\">지금 반짝이는 별 중엔 이미 사라진 별도 있어요. 그 별이 보낸 빛이 아직 오는 중이라 보이는 거예요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Let's say that we are on one of those stars</div><div class=\"k\">우리가 그런 별들 중 하나에 있다고 해보자</div></div><div class=\"rc\"><div class=\"e\">situated roughly sixty million light-years away.</div><div class=\"k\">대략 6,000만 광년쯤 떨어져 위치한.</div></div><div class=\"rnat\">우리가 대략 6,000만 광년 떨어진 곳에 위치한 그러한 별들 중 하나에 있다고 해보자.</div><div class=\"rst\">이번엔 거꾸로, 우리가 6,000만 광년 떨어진 별 위에 서 있다고 상상해 봐요. = 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">If we had a really awesome telescope pointed at the earth,</div><div class=\"k\">만일 우리가 지구를 향하고 있는 정말 기막히게 좋은 망원경을 가지고 있다면,</div></div><div class=\"rc\"><div class=\"e\">we would see the dinosaurs walking around.</div><div class=\"k\">우리는 공룡들이 걸어 다니는 것을 볼 수 있을 것이다.</div></div><div class=\"rnat\">만약 우리가 지구를 향한 정말 굉장한 망원경을 가지고 있다면, 우리는 공룡들이 돌아다니는 것을 볼 수 있을 것이다.</div><div class=\"rst\">거기서 엄청 좋은 망원경으로 지구를 보면 공룡이 걸어 다니는 게 보여요. 빛이 그만큼 늦게 도착하니까요. = 지문 5번이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The end of the universe is probably so old</div><div class=\"k\">우주의 끝은 아마도 너무 오래되어서</div></div><div class=\"rc\"><div class=\"e\">that if we had that telescope,</div><div class=\"k\">만일 우리가 그러한 망원경을 가지고 있다면,</div></div><div class=\"rc\"><div class=\"e\">we might be able to see the beginning.</div><div class=\"k\">우리는 그 (우주의) 시작을 볼 수 있을지도 모른다.</div></div><div class=\"rnat\">우주의 끝은 아마도 너무 오래되어서 만약 우리가 그러한 망원경을 가지고 있다면, 우리는 그 우주의 시작을 볼 수 있을지도 모른다.</div><div class=\"rst\">우주의 끝은 너무 오래돼서, 그 망원경이면 우주의 시작까지 보일지도 몰라요. = 지문 6번, 멀수록 더 옛날이 보여요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Besides faraway things,</div><div class=\"k\">멀리 떨어진 것들 외에도,</div></div><div class=\"rc\"><div class=\"e\">even the immediate objects around us are</div><div class=\"k\">심지어 우리 주변에 아주 가까이 있는 물체들조차</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">all afterimages of the past</span></div><div class=\"k\"><span class=\"cw\">모두 과거의(과거에 존재했던 것의) 잔상들인데,</span> ※ 문제지엔 빈칸</div></div><div class=\"rc ckc\"><div class=\"e\">because there is still a <span class=\"cw\">time lag</span></div><div class=\"k\">이는 여전히 <span class=\"cw\">시간상의 차이(시차)</span>가 존재하기 때문이다</div></div><div class=\"rc\"><div class=\"e\">for the reflection of light to reach our eyes.</div><div class=\"k\">빛의 반사가 우리 눈에 도달하는 데 (걸리는).</div></div><div class=\"rnat\">멀리 떨어진 것들 외에도, 심지어 우리 주변에 아주 가까이 있는 물체들조차도 모두 과거의 잔상인데, 이는 빛의 반사가 우리 눈에 도달하기까지 여전히 시차가 존재하기 때문이다.</div><div class=\"rst\">옆에 앉은 친구 얼굴도 빛이 눈에 오는 <b>시차</b>(time lag)가 있어서, 아주 잠깐 전 모습이에요. 그래서 빈칸은 <b>모두 과거의 잔상</b>이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Every sensation our body feels</div><div class=\"k\">우리 몸이 느끼는 모든 감각은</div></div><div class=\"rc\"><div class=\"e\">has to wait</div><div class=\"k\">기다려야만 한다</div></div><div class=\"rc\"><div class=\"e\">for the information to be carried to the brain.</div><div class=\"k\">그 (감각) 정보가 뇌에 전달되기까지.</div></div><div class=\"rnat\">우리 몸이 느끼는 모든 감각은 그 정보가 뇌에 전달되기까지 기다려야만 한다.</div><div class=\"rst\">친구가 내 어깨를 툭 쳐도, 그 느낌이 뇌에 닿을 때까지 <b>기다려야</b> 해요. = 지문 8번, 감각도 늘 조금 늦게 온다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"elude\" data-m=\"교묘히 벗어나다\"><b>elude</b>교묘히 벗어나다</button><button type=\"button\" class=\"wdb\" data-w=\"ancient\" data-m=\"아주 오래된, 고대의\"><b>ancient</b>아주 오래된, 고대의</button><button type=\"button\" class=\"wdb\" data-w=\"light-year\" data-m=\"광년\"><b>light-year</b>광년</button><button type=\"button\" class=\"wdb\" data-w=\"immediate\" data-m=\"아주 가까이 있는, 바로 옆의\"><b>immediate</b>아주 가까이 있는, 바로 옆의</button><button type=\"button\" class=\"wdb\" data-w=\"time lag\" data-m=\"시차, 시간상의 차이\"><b>time lag</b>시차, 시간상의 차이</button><button type=\"button\" class=\"wdb\" data-w=\"reflection\" data-m=\"반사\"><b>reflection</b>반사</button></div>"};

function qHtml(i,a){

  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}

  return h+'</div></details>';
}

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}

  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
