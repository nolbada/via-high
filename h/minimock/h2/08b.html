/span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) She 그녀 = 셰릴</span><span class=\"why\">(D) 2의 대답을 듣고 놀란 사람이에요. 바로 뒤 (D) 4에서 셰릴이 이런 반응을 예상 못 했다고 확인해 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) she 그녀 = 셰릴</span><span class=\"why\">(D) 4에서 이런 일을 처음 해 본 셰릴이 (D) 5에서 “안아 드려도 될까요?” 하고 반응해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A) 1번</span><div class=\"rc\"><div class=\"e\">(A) Is it possible</div><div class=\"k\">(A) 가능할까</div></div><div class=\"rc\"><div class=\"e\">that two words can change</div><div class=\"k\">두 단어가 바꿀 수 있는 것이</div></div><div class=\"rc\"><div class=\"e\">someone’s day, someone’s life?</div><div class=\"k\">누군가의 하루를, 누군가의 인생을?</div></div><div class=\"rnat\">(A) 1 두 단어가 누군가의 하루를, 누군가의 인생을 바꿀 수 있는 것이 가능할까?</div><div class=\"rst\">단 두 마디 말이 누군가의 하루, 아니 인생까지 바꿀 수 있을까요? 지문은 이 질문으로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A) 2번</span><div class=\"rc\"><div class=\"e\">What if</div><div class=\"k\">만약 ~라면 어떻게 될까</div></div><div class=\"rc\"><div class=\"e\">those same two words</div><div class=\"k\">그 똑같은 두 단어가</div></div><div class=\"rc\"><div class=\"e\">could change the world?</div><div class=\"k\">세상을 바꿀 수 있다면?</div></div><div class=\"rnat\">(A) 2 만약 그 동일한 두 단어가 세상을 바꿀 수 있다면 어떻게 될까?</div><div class=\"rst\">그 두 마디가 세상까지 바꾼다면요? 지문이 질문을 더 크게 키워요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A) 3번</span><div class=\"rc\"><div class=\"e\">Well,</div><div class=\"k\">자,</div></div><div class=\"rc\"><div class=\"e\">Cheryl Rice is on a quest</div><div class=\"k\">Cheryl Rice가 탐색 중이다</div></div><div class=\"rc\"><div class=\"e\">to find out.</div><div class=\"k\">알아내기 위해(= 두 단어가 세상을 바꿀 수 있는지).</div></div><div class=\"rnat\">(A) 3 자, Cheryl Rice가 (이를) 알아내기 위해 탐색 중이다.</div><div class=\"rst\">셰릴이라는 여자가 그 답을 찾는 중이래요. 이 이야기의 주인공은 셰릴이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A) 4번</span><div class=\"rc\"><div class=\"e\">This quest</div><div class=\"k\">이 탐색은(= Cheryl Rice의)</div></div><div class=\"rc\"><div class=\"e\">accidentally began</div><div class=\"k\">우연히 시작되었다</div></div><div class=\"rc\"><div class=\"e\">in November, 2016</div><div class=\"k\">2016년 11월에</div></div><div class=\"rc\"><div class=\"e\">in a grocery store.</div><div class=\"k\">한 식료품 가게에서.</div></div><div class=\"rnat\">(A) 4 이 탐색은 2016년 11월에 한 식료품 가게에서 우연히 시작되었다.</div><div class=\"rst\">그 탐색은 2016년 11월, 동네 마트에서 우연히 시작됐어요. = 지문의 시간·장소예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(A) 5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(a) She</span></div><div class=\"k\"><span class=\"cw\">(a) 그녀</span>(= Cheryl)는</div></div><div class=\"rc\"><div class=\"e\">was standing in the checkout line</div><div class=\"k\">계산대 줄에 서 있었다</div></div><div class=\"rc\"><div class=\"e\">behind a woman</div><div class=\"k\">한 여자의 뒤에</div></div><div class=\"rc\"><div class=\"e\">who looked to be in her 60’s.</div><div class=\"k\">60대로 보이는.</div></div><div class=\"rnat\">(A) 5 (a)그녀(Cheryl)는 계산대 줄에서 60대로 보이는 한 여자의 뒤에 서 있었다.</div><div class=\"rst\">셰릴이 계산대 줄에 서 있고, 앞에 60대쯤 된 아주머니가 있어요. 그래서 <b>(a) 그녀 = 셰릴</b>이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(A) 6번</span><div class=\"rc\"><div class=\"e\">When it was the woman’s turn to pay,</div><div class=\"k\">그 여자가 계산할 차례가 되었을 때,</div></div><div class=\"rc\"><div class=\"e\">the cashier greeted her by name</div><div class=\"k\">계산원이 그녀(= 그 여자)의 이름을 부르며 인사했고,</div></div><div class=\"rc\"><div class=\"e\">and asked her</div><div class=\"k\">그녀에게 물었다</div></div><div class=\"rc\"><div class=\"e\">how she was doing.</div><div class=\"k\">어떻게 지냈는지.</div></div><div class=\"rnat\">(A) 6 그 여자가 계산할 차례가 되었을 때, 계산원이 그녀의 이름을 부르며 인사했고, 그녀에게 어떻게 지냈는지 물었다.</div><div class=\"rst\">아주머니 차례가 되자 계산원이 이름을 부르며 “요즘 어떠세요?” 하고 <b>물어요</b>. 대답은 다음 단락에 나와요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(C) 1번</span><div class=\"rc\"><div class=\"e\">(C) The woman looked down,</div><div class=\"k\">(C) 그 여자는 아래를 내려다보고,</div></div><div class=\"rc\"><div class=\"e\">shook her head and said,</div><div class=\"k\">그녀의 머리를 흔들며 말했다,</div></div><div class=\"rc\"><div class=\"e\">“Not so good.</div><div class=\"k\">“그다지 좋지 않아요.</div></div><div class=\"rc\"><div class=\"e\">My husband just lost his job.</div><div class=\"k\">제 남편이 이제 막 직장을 잃었거든요.</div></div><div class=\"rnat\">(C) 1 그 여자는 아래를 내려다보고, 그녀의 머리를 흔들며 말했다, “그다지 좋지 않아요. 제 남편이 이제 막 직장을 잃었거든요.</div><div class=\"rst\">아주머니가 고개를 숙이고 “<b>별로예요</b>. 남편이 막 직장을 잃었어요.” 하고 답해요. 6번 질문에 대한 대답이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(C) 2번</span><div class=\"rc\"><div class=\"e\">I don’t know</div><div class=\"k\">“저는 모르겠어요</div></div><div class=\"rc\"><div class=\"e\">how I’m going to get through</div><div class=\"k\">제가 어떻게 견뎌야 할지</div></div><div class=\"rc\"><div class=\"e\">the holidays.”</div><div class=\"k\">이 연휴를.”</div></div><div class=\"rnat\">(C) 2 저는 이 연휴를 어떻게 견뎌야 할지 모르겠어요.”</div><div class=\"rst\">“이번 연휴를 어떻게 버틸지 모르겠어요.” 지문 속 아주머니의 걱정이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">(C) 3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Then <span class=\"cw\">(c) she</span></div><div class=\"k\">그리고 나서 <span class=\"cw\">(c) 그녀</span>(= 계산대의 그 여자. Cheryl이 아님)는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">gave the cashier</span></div><div class=\"k\"><span class=\"cw\">계산원에게 주었다</span></div></div><div class=\"rc\"><div class=\"e\">some food stamps.</div><div class=\"k\">몇 개의 푸드 스탬프(식료품 할인 구매권)를.</div></div><div class=\"rnat\">(C) 3 그리고 나서 (c)그녀(woman)는 몇 개의 푸드 스탬프(식료품 할인 구매권)를 계산원에게 주었다.</div><div class=\"rst\">그러고는 아주머니가 계산원에게 식료품 할인 구매권을 내요. 돈을 내는 사람은 계산 차례인 <b>(c) 그녀 = 아주머니</b>예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(C) 4번</span><div class=\"rc\"><div class=\"e\">Cheryl’s heart ached.</div><div class=\"k\">Cheryl의 마음은 아팠다.</div></div><div class=\"rnat\">(C) 4 Cheryl의 마음은 아팠다.</div><div class=\"rst\">뒤에서 듣던 셰릴은 마음이 아파요. 지문도 셰릴의 마음이 아팠대요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(C) 5번</span><div class=\"rc\"><div class=\"e\">She wanted to help</div><div class=\"k\">그녀(= Cheryl)는 돕고 싶었지만</div></div><div class=\"rc\"><div class=\"e\">but didn’t know how.</div><div class=\"k\">어떻게 해야 할지 몰랐다.</div></div><div class=\"rnat\">(C) 5 그녀는 돕고 싶었지만 어떻게 할지 몰랐다.</div><div class=\"rst\">셰릴은 돕고 싶은데 어떻게 해야 할지 몰라요. = 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(C) 6번</span><div class=\"rc\"><div class=\"e\">“Should I offer to pay</div><div class=\"k\">“내가 지불하겠다고 제안해야 할까</div></div><div class=\"rc\"><div class=\"e\">for her groceries,</div><div class=\"k\">그녀(= 계산대의 그 여자)의 식료품비를,</div></div><div class=\"rc\"><div class=\"e\">ask for her husband’s resume?”</div><div class=\"k\">그녀의 남편의 이력서를 요청해야 할까?”</div></div><div class=\"rnat\">(C) 6 “내가 그녀의 식료품비를 지불하겠다고 제안해야 할까? 그녀의 남편의 이력서를 요청해야 할까?”</div><div class=\"rst\">“장바구니 값을 내가 낸다고 할까? 남편 이력서를 달라고 할까?” 셰릴이 속으로 고민만 해요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(C) 7번</span><div class=\"rc\"><div class=\"e\">She did nothing</div><div class=\"k\">그녀(= Cheryl)는 아무것도 하지 않았다</div></div><div class=\"rc\"><div class=\"e\">— yet.</div><div class=\"k\">아직까지는.</div></div><div class=\"rnat\">(C) 7 그녀는 아무것도 하지 않았다. 아직까지는.</div><div class=\"rst\">결국 셰릴은 아직 아무것도 못 했어요. 지문의 ‘아직은’이 뒤에 무슨 일이 있을 거라고 예고해요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(C) 8번</span><div class=\"rc\"><div class=\"e\">And the woman left the store.</div><div class=\"k\">그리고 그 여자는 가게를 떠났다.</div></div><div class=\"rnat\">(C) 8 그리고 그 여자는 가게를 떠났다.</div><div class=\"rst\">그리고 아주머니는 <b>가게를 나가요</b>. 이제 장면이 가게 밖으로 옮겨 가요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">(B) 1번</span><div class=\"rc\"><div class=\"e\">(B) As Cheryl walked into the parking lot,</div><div class=\"k\">(B) Cheryl이 주차장으로 걸어갔을 때,</div></div><div class=\"rc\"><div class=\"e\">she spotted the woman</div><div class=\"k\">그녀는 그 여자를 발견했고</div></div><div class=\"rc\"><div class=\"e\">returning her shopping cart,</div><div class=\"k\">쇼핑카트를 반납하고 있는</div></div><div class=\"rc\"><div class=\"e\">and she remembered something</div><div class=\"k\">그리고 그녀는 무언가를 기억해냈다</div></div><div class=\"rc\"><div class=\"e\">in her purse</div><div class=\"k\">자신의 지갑에 있는</div></div><div class=\"rc\"><div class=\"e\">that could help her.</div><div class=\"k\">그녀(= 그 여자)를 도울 수 있는.</div></div><div class=\"rnat\">(B) 1 Cheryl이 주차장으로 걸어갔을 때, 그녀는 쇼핑카트를 반납하고 있는 그 여자를 발견했고, 그녀(Cheryl)의 지갑에 있는 그녀(그 여자)를 도울 수 있는 무언가를 기억해냈다(자신의 지갑에 그녀를 도울 수 있는 무언가가 있다는 것을 기억해냈다).</div><div class=\"rst\">셰릴이 <b>주차장</b>에 갔더니, 카트를 돌려놓는 아주머니가 보여요. 지갑 속 도와줄 물건도 떠올라요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">(B) 2번</span><div class=\"rc\"><div class=\"e\">She approached the woman</div><div class=\"k\">그녀(= Cheryl)는 그 여자에게 다가가서</div></div><div class=\"rc\"><div class=\"e\">and said,</div><div class=\"k\">말했다,</div></div><div class=\"rc\"><div class=\"e\">“Excuse me,</div><div class=\"k\">“실례합니다,</div></div><div class=\"rc\"><div class=\"e\">I couldn’t help overhearing</div><div class=\"k\">저는 엿들을 수밖에 없었어요</div></div><div class=\"rc\"><div class=\"e\">what you said to the cashier.</div><div class=\"k\">당신이 계산원에게 했던 말을.</div></div><div class=\"rnat\">(B) 2 그녀는 그 여자에게 다가가서 말했다, “실례합니다, 저는 당신이 계산원에게 했던 말을 엿들을 수밖에 없었어요.</div><div class=\"rst\">셰릴이 다가가서 “계산원에게 하신 말씀을 듣게 됐어요.” 하고 말을 걸어요. = 지문 속 셰릴의 말이에요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">(B) 3번</span><div class=\"rc\"><div class=\"e\">It sounds like you’re going through</div><div class=\"k\">당신은 겪고 있는 것처럼 들려요</div></div><div class=\"rc\"><div class=\"e\">a really hard time</div><div class=\"k\">매우 힘든 시간을</div></div><div class=\"rc\"><div class=\"e\">right now.</div><div class=\"k\">바로 지금.</div></div><div class=\"rnat\">(B) 3 당신은 바로 지금 매우 힘든 시간을 겪고 있는 것처럼 들리더군요.</div><div class=\"rst\">“지금 정말 힘든 시간을 보내고 계신 것 같아요.” 셰릴이 아주머니 마음을 알아줘요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">(B) 4번</span><div class=\"rc\"><div class=\"e\">I’m so sorry.</div><div class=\"k\">정말 유감이에요.</div></div><div class=\"rnat\">(B) 4 정말 유감이에요.</div><div class=\"rst\">“정말 안타까워요.” 지문 속 셰릴의 위로예요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">(B) 5번</span><div class=\"rc\"><div class=\"e\">I’d like to give you</div><div class=\"k\">저는 당신에게 드리고 싶어요</div></div><div class=\"rc\"><div class=\"e\">something.”</div><div class=\"k\">무언가를.”</div></div><div class=\"rnat\">(B) 5 제가 당신에게 무언가를 드리고 싶어요.”</div><div class=\"rst\">“드리고 싶은 게 있어요.” 지문이 무엇을 줄지 궁금하게 만들어요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">(B) 6번</span><div class=\"rc ckc\"><div class=\"e\">And <span class=\"cw\">(b) she</span></div><div class=\"k\">그리고 <span class=\"cw\">(b) 그녀</span>(= Cheryl)는</div></div><div class=\"rc\"><div class=\"e\">handed her</div><div class=\"k\">그녀(= 그 여자)에게 건넸다</div></div><div class=\"rc\"><div class=\"e\">a small card.</div><div class=\"k\">작은 카드를.</div></div><div class=\"rnat\">(B) 6 그리고 (b)그녀(Cheryl)는 그녀에게 작은 카드를 건넸다.</div><div class=\"rst\">그리고 셰릴이 아주머니에게 <b>작은 카드</b>를 건네요. 건네는 사람이니 <b>(b) 그녀 = 셰릴</b>이에요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">(D) 1번</span><div class=\"rc\"><div class=\"e\">(D) When the woman read</div><div class=\"k\">(D) 그 여자가 읽었을 때</div></div><div class=\"rc\"><div class=\"e\">the card’s only two words,</div><div class=\"k\">카드의 단 두 단어를,</div></div><div class=\"rc\"><div class=\"e\">she began to cry.</div><div class=\"k\">그녀는 울기 시작했다.</div></div><div class=\"rnat\">(D) 1 그 여자가 카드의(카드에 적힌) 단 두 단어를 읽었을 때, 그녀는 울기 시작했다.</div><div class=\"rst\">아주머니가 그 카드에 적힌 <b>단 두 단어</b>를 읽고 울기 시작해요. (B)의 카드가 여기서 이어져요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">(D) 2번</span><div class=\"rc\"><div class=\"e\">And through her tears,</div><div class=\"k\">그리고 눈물을 흘리며,</div></div><div class=\"rc\"><div class=\"e\">she said,</div><div class=\"k\">그녀(= 그 여자)는 말했다,</div></div><div class=\"rc\"><div class=\"e\">“You have no idea</div><div class=\"k\">“당신은 전혀 모를 거예요</div></div><div class=\"rc\"><div class=\"e\">how much this means to me.”</div><div class=\"k\">이것이 나에게 얼마나 큰 의미인지.”</div></div><div class=\"rnat\">(D) 2 그리고 눈물을 흘리며, 그녀는 말했다, “당신은 이것이 나에게 얼마나 큰 의미인지 전혀 모를 거예요.”</div><div class=\"rst\">아주머니는 눈물을 흘리며 “이게 저한테 얼마나 큰 의미인지 모르실 거예요.” 하고 말해요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">(D) 3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(d) She</span></div><div class=\"k\"><span class=\"cw\">(d) 그녀</span>(= Cheryl)는</div></div><div class=\"rc\"><div class=\"e\">was a little startled</div><div class=\"k\">조금 놀랐다</div></div><div class=\"rc\"><div class=\"e\">by her reply.</div><div class=\"k\">그녀(= 그 여자)의 대답에.</div></div><div class=\"rnat\">(D) 3 (d)그녀(Cheryl)는 그녀의 대답에 조금 놀랐다.</div><div class=\"rst\">대답을 들은 셰릴이 조금 놀라요. 놀란 사람은 대답을 들은 쪽이니 <b>(d) 그녀 = 셰릴</b>이에요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">(D) 4번</span><div class=\"rc\"><div class=\"e\">Having never done anything like this before,</div><div class=\"k\">이러한 일을 이전에는 해 본 적이 없었기 때문에,</div></div><div class=\"rc\"><div class=\"e\">Cheryl hadn’t anticipated</div><div class=\"k\">Cheryl은 예상하지 못했다</div></div><div class=\"rc\"><div class=\"e\">the reaction</div><div class=\"k\">그러한 반응을</div></div><div class=\"rc\"><div class=\"e\">she might receive.</div><div class=\"k\">자신이 받게 될.</div></div><div class=\"rnat\">(D) 4 이러한 일을 이전에는 해 본 적이 없었기 때문에, Cheryl은 그녀가 받는 그러한 반응을 예상하지 못했다(Cheryl은 자신이 그러한 반응을 받게 될 것이라고 예상하지 못했다).</div><div class=\"rst\">셰릴은 이런 일을 처음 해 봐서 이런 반응이 올 줄 몰랐어요. = 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"25\"><span class=\"rn\">(D) 5번</span><div class=\"rc ckc\"><div class=\"e\">All <span class=\"cw\">she</span> could think</div><div class=\"k\"><span class=\"cw\">(e) 그녀</span>(= Cheryl)가 생각해낼 수 있었던 전부는</div></div><div class=\"rc\"><div class=\"e\">to respond</div><div class=\"k\">반응하고자</div></div><div class=\"rc\"><div class=\"e\">was,</div><div class=\"k\">~였다,</div></div><div class=\"rc\"><div class=\"e\">“Oh, my.</div><div class=\"k\">“오, 세상에,</div></div><div class=\"rc\"><div class=\"e\">Would it be OK to give you a hug?”</div><div class=\"k\">당신에게 포옹을 드려도 괜찮을까요?”</div></div><div class=\"rnat\">(D) 5 (e)그녀(Cheryl)가 (재빨리) 반응하고자 생각해낼 수 있었던 전부는, “오, 세상에, 당신에게 포옹을 드려도 괜찮을까요?”였다(그녀는 “오, 세상에, 당신을 안아드려도 괜찮을까요?”라고 반응하는 것 외에는 다른 것을 생각해낼 수 없었다).</div><div class=\"rst\">셰릴이 겨우 떠올린 말은 “안아 드려도 될까요?”예요. 포옹을 청하는 사람이니 <b>(e) 그녀 = 셰릴</b>이에요.</div></div><div class=\"rds\" data-ord=\"26\"><span class=\"rn\">(D) 6번</span><div class=\"rc\"><div class=\"e\">After they embraced,</div><div class=\"k\">그들이 껴안고 난 후,</div></div><div class=\"rc\"><div class=\"e\">she walked back to her car</div><div class=\"k\">그녀(= Cheryl)는 그녀의 차로 걸어 돌아가</div></div><div class=\"rc\"><div class=\"e\">and began to cry too.</div><div class=\"k\">역시 울기 시작했다.</div></div><div class=\"rnat\">(D) 6 그들이 껴안고 난 후, 그녀는 그녀의 차로 걸어 돌아가 울기 시작했다.</div><div class=\"rst\">둘이 꼭 안은 뒤, 셰릴은 차로 돌아가서 자기도 울기 시작해요. 지문의 ‘역시 울었다’예요.</div></div><div class=\"rds\" data-ord=\"27\"><span class=\"rn\">(D) 7번</span><div class=\"rc\"><div class=\"e\">The words on the card?</div><div class=\"k\">그 카드에 있던 (두) 단어는?</div></div><div class=\"rc\"><div class=\"e\">“You Matter.”</div><div class=\"k\">“당신은 소중합니다.”</div></div><div class=\"rnat\">(D) 7 그 카드에 있던 (두) 단어는? “당신은 소중합니다.”</div><div class=\"rst\">카드 속 두 단어는 “당신은 소중합니다.” 첫 질문의 답이에요. 두 마디가 하루를 바꿨어요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"checkout line\" data-m=\"계산대 줄\"><b>checkout line</b>계산대 줄</button><button type=\"button\" class=\"wdb\" data-w=\"greet\" data-m=\"인사하다\"><b>greet</b>인사하다</button><button type=\"button\" class=\"wdb\" data-w=\"approach\" data-m=\"다가가다\"><b>approach</b>다가가다</button><button type=\"button\" class=\"wdb\" data-w=\"startled\" data-m=\"놀란\"><b>startled</b>놀란</button><button type=\"button\" class=\"wdb\" data-w=\"anticipate\" data-m=\"예상하다\"><b>anticipate</b>예상하다</button><button type=\"button\" class=\"wdb\" data-w=\"embrace\" data-m=\"포옹하다\"><b>embrace</b>포옹하다</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 셰릴이 <b>고민만 한 것</b>(Should I ~? ~해야 할까?)과 <b>실제로 한 것</b>을 구분하는 게 핵심이에요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ (A) 5</em>was standing in the checkout line(계산대 줄에 서 있었다) → 같음</span><span><em>② ↔ (B) 2</em>couldn’t help overhearing(엿들을 수밖에 없었다) → 같음</span><span><em>③ ↔ (B) 6</em>handed her a small card(작은 카드를 건넸다) → 같음</span><span><em>⑤ ↔ (D) 6</em>walked back to her car and began to cry(차로 돌아가 울기 시작했다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ④를 (C) 단락과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>④의 ‘식료품 구입비’를 누가 냈는지 찾아요</span></div><div class=\"ck-step\"><span class=\"lab\">(C) 3번 문장 · 계산한 사람</span><div class=\"en\">Then (c) she <mark>gave the cashier</mark> some food stamps.</div><p class=\"ko\">그리고 나서 (c) 그녀(= 그 여자)는 몇 개의 식료품 할인 구매권을 <mark>계산원에게 주었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>셰릴이 대신 내는 건 ‘해야 할까?’ 하는 질문일 뿐이에요</span></div><div class=\"ck-step\"><span class=\"lab\">(C) 6번 문장 · 고민만 함</span><div class=\"en\">“<mark>Should I offer to pay</mark> for her groceries, ask for her husband’s resume?”</div><p class=\"ko\">“그녀의 식료품비를 <mark>내가 지불하겠다고 제안해야 할까</mark>, 그녀의 남편의 이력서를 요청해야 할까?”</p></div><div class=\"ck-via\"><i>▼</i><span>고민 끝에 실제로 한 행동 = 아무것도 안 함</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) 7번 문장 · 결정적 단서</span><div class=\"en\">She <mark>did nothing</mark> — yet.</div><p class=\"ko\">그녀(= 셰릴)는 아직까지는 <mark>아무것도 하지 않았다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">식료품 구입비를 대신 지불했다.<small>(C) 3: 아주머니가 직접 냈고, (C) 7: 셰릴은 아무것도 하지 않았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">대화를 우연히 엿들었다고 말했다.</span><span class=\"why\">(B) 2의 couldn’t(~할 수 없었다)를 보고 ‘안 엿들었다’로 착각하기 쉬워요. couldn’t help overhearing(엿들을 수밖에 없었다)이라 엿들은 게 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">계산대 줄에 서 있었다.</span><span class=\"why\">(A) 5 was standing in the checkout line(계산대 줄에 서 있었다)과 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">작은 카드를 건넸다.</span><span class=\"why\">(B) 6 handed her a small card(그녀에게 작은 카드를 건넸다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">차로 돌아와서 울었다.</span><span class=\"why\">(D) 6 walked back to her car and began to cry too(차로 걸어 돌아가 역시 울기 시작했다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A) 1번</span><div class=\"rc\"><div class=\"e\">(A) Is it possible</div><div class=\"k\">(A) 가능할까</div></div><div class=\"rc\"><div class=\"e\">that two words can change</div><div class=\"k\">두 단어가 바꿀 수 있는 것이</div></div><div class=\"rc\"><div class=\"e\">someone’s day, someone’s life?</div><div class=\"k\">누군가의 하루를, 누군가의 인생을?</div></div><div class=\"rnat\">(A) 1 두 단어가 누군가의 하루를, 누군가의 인생을 바꿀 수 있는 것이 가능할까?</div><div class=\"rst\">단 두 마디 말이 누군가의 하루, 아니 인생까지 바꿀 수 있을까요? 지문은 이 질문으로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A) 2번</span><div class=\"rc\"><div class=\"e\">What if</div><div class=\"k\">만약 ~라면 어떻게 될까</div></div><div class=\"rc\"><div class=\"e\">those same two words</div><div class=\"k\">그 똑같은 두 단어가</div></div><div class=\"rc\"><div class=\"e\">could change the world?</div><div class=\"k\">세상을 바꿀 수 있다면?</div></div><div class=\"rnat\">(A) 2 만약 그 동일한 두 단어가 세상을 바꿀 수 있다면 어떻게 될까?</div><div class=\"rst\">그 두 마디가 세상까지 바꾼다면요? 지문이 질문을 더 크게 키워요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A) 3번</span><div class=\"rc\"><div class=\"e\">Well,</div><div class=\"k\">자,</div></div><div class=\"rc\"><div class=\"e\">Cheryl Rice is on a quest</div><div class=\"k\">Cheryl Rice가 탐색 중이다</div></div><div class=\"rc\"><div class=\"e\">to find out.</div><div class=\"k\">알아내기 위해(= 두 단어가 세상을 바꿀 수 있는지).</div></div><div class=\"rnat\">(A) 3 자, Cheryl Rice가 (이를) 알아내기 위해 탐색 중이다.</div><div class=\"rst\">셰릴이라는 여자가 그 답을 찾는 중이래요. 이 이야기의 주인공은 셰릴이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A) 4번</span><div class=\"rc\"><div class=\"e\">This quest</div><div class=\"k\">이 탐색은(= Cheryl Rice의)</div></div><div class=\"rc\"><div class=\"e\">accidentally began</div><div class=\"k\">우연히 시작되었다</div></div><div class=\"rc\"><div class=\"e\">in November, 2016</div><div class=\"k\">2016년 11월에</div></div><div class=\"rc\"><div class=\"e\">in a grocery store.</div><div class=\"k\">한 식료품 가게에서.</div></div><div class=\"rnat\">(A) 4 이 탐색은 2016년 11월에 한 식료품 가게에서 우연히 시작되었다.</div><div class=\"rst\">그 탐색은 2016년 11월, 동네 마트에서 우연히 시작됐어요. = 지문의 시간·장소예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(A) 5번</span><div class=\"rc\"><div class=\"e\">(a) She</div><div class=\"k\">(a) 그녀(= Cheryl)는</div></div><div class=\"rc\"><div class=\"e\">was standing in the checkout line</div><div class=\"k\">계산대 줄에 서 있었다</div></div><div class=\"rc\"><div class=\"e\">behind a woman</div><div class=\"k\">한 여자의 뒤에</div></div><div class=\"rc\"><div class=\"e\">who looked to be in her 60’s.</div><div class=\"k\">60대로 보이는.</div></div><div class=\"rnat\">(A) 5 (a)그녀(Cheryl)는 계산대 줄에서 60대로 보이는 한 여자의 뒤에 서 있었다.</div><div class=\"rst\">셰릴이 계산대 줄에 서 있고, 앞에 60대쯤 된 아주머니가 있어요. 지문의 <b>계산대 줄</b> = 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(A) 6번</span><div class=\"rc\"><div class=\"e\">When it was the woman’s turn to pay,</div><div class=\"k\">그 여자가 계산할 차례가 되었을 때,</div></div><div class=\"rc\"><div class=\"e\">the cashier greeted her by name</div><div class=\"k\">계산원이 그녀(= 그 여자)의 이름을 부르며 인사했고,</div></div><div class=\"rc\"><div class=\"e\">and asked her</div><div class=\"k\">그녀에게 물었다</div></div><div class=\"rc\"><div class=\"e\">how she was doing.</div><div class=\"k\">어떻게 지냈는지.</div></div><div class=\"rnat\">(A) 6 그 여자가 계산할 차례가 되었을 때, 계산원이 그녀의 이름을 부르며 인사했고, 그녀에게 어떻게 지냈는지 물었다.</div><div class=\"rst\">아주머니 차례가 되자 계산원이 이름을 부르며 “요즘 어떠세요?” 하고 <b>물어요</b>. 대답은 다음 단락에 나와요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(C) 1번</span><div class=\"rc\"><div class=\"e\">(C) The woman looked down,</div><div class=\"k\">(C) 그 여자는 아래를 내려다보고,</div></div><div class=\"rc\"><div class=\"e\">shook her head and said,</div><div class=\"k\">그녀의 머리를 흔들며 말했다,</div></div><div class=\"rc\"><div class=\"e\">“Not so good.</div><div class=\"k\">“그다지 좋지 않아요.</div></div><div class=\"rc\"><div class=\"e\">My husband just lost his job.</div><div class=\"k\">제 남편이 이제 막 직장을 잃었거든요.</div></div><div class=\"rnat\">(C) 1 그 여자는 아래를 내려다보고, 그녀의 머리를 흔들며 말했다, “그다지 좋지 않아요. 제 남편이 이제 막 직장을 잃었거든요.</div><div class=\"rst\">아주머니가 고개를 숙이고 “<b>별로예요</b>. 남편이 막 직장을 잃었어요.” 하고 답해요. 6번 질문에 대한 대답이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(C) 2번</span><div class=\"rc\"><div class=\"e\">I don’t know</div><div class=\"k\">“저는 모르겠어요</div></div><div class=\"rc\"><div class=\"e\">how I’m going to get through</div><div class=\"k\">제가 어떻게 견뎌야 할지</div></div><div class=\"rc\"><div class=\"e\">the holidays.”</div><div class=\"k\">이 연휴를.”</div></div><div class=\"rnat\">(C) 2 저는 이 연휴를 어떻게 견뎌야 할지 모르겠어요.”</div><div class=\"rst\">“이번 연휴를 어떻게 버틸지 모르겠어요.” 지문 속 아주머니의 걱정이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">(C) 3번 · 단서</span><div class=\"rc\"><div class=\"e\">Then (c) she</div><div class=\"k\">그리고 나서 (c) 그녀(= 계산대의 그 여자. Cheryl이 아님)는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">gave the cashier</span></div><div class=\"k\"><span class=\"cw\">계산원에게 주었다</span></div></div><div class=\"rc\"><div class=\"e\">some food stamps.</div><div class=\"k\">몇 개의 푸드 스탬프(식료품 할인 구매권)를.</div></div><div class=\"rnat\">(C) 3 그리고 나서 (c)그녀(woman)는 몇 개의 푸드 스탬프(식료품 할인 구매권)를 계산원에게 주었다.</div><div class=\"rst\">그러고는 아주머니가 <b>직접</b> 계산원에게 식료품 할인 구매권을 내요. 계산은 아주머니가 했어요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(C) 4번</span><div class=\"rc\"><div class=\"e\">Cheryl’s heart ached.</div><div class=\"k\">Cheryl의 마음은 아팠다.</div></div><div class=\"rnat\">(C) 4 Cheryl의 마음은 아팠다.</div><div class=\"rst\">뒤에서 듣던 셰릴은 마음이 아파요. 지문도 셰릴의 마음이 아팠대요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(C) 5번</span><div class=\"rc\"><div class=\"e\">She wanted to help</div><div class=\"k\">그녀(= Cheryl)는 돕고 싶었지만</div></div><div class=\"rc\"><div class=\"e\">but didn’t know how.</div><div class=\"k\">어떻게 해야 할지 몰랐다.</div></div><div class=\"rnat\">(C) 5 그녀는 돕고 싶었지만 어떻게 할지 몰랐다.</div><div class=\"rst\">셰릴은 돕고 싶은데 어떻게 해야 할지 몰라요. = 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(C) 6번</span><div class=\"rc ckc\"><div class=\"e\">“<span class=\"cw\">Should I offer to pay</span></div><div class=\"k\">“<span class=\"cw\">내가 지불하겠다고 제안해야 할까</span></div></div><div class=\"rc\"><div class=\"e\">for her groceries,</div><div class=\"k\">그녀(= 계산대의 그 여자)의 식료품비를,</div></div><div class=\"rc\"><div class=\"e\">ask for her husband’s resume?”</div><div class=\"k\">그녀의 남편의 이력서를 요청해야 할까?”</div></div><div class=\"rnat\">(C) 6 “내가 그녀의 식료품비를 지불하겠다고 제안해야 할까? 그녀의 남편의 이력서를 요청해야 할까?”</div><div class=\"rst\">“장바구니 값을 <b>내가 낸다고 할까</b>? 남편 이력서를 달라고 할까?” 셰릴은 속으로 고민만 해요. ④와 헷갈리는 자리예요.</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">(C) 7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">She did nothing</span></div><div class=\"k\">그녀(= Cheryl)는 <span class=\"cw\">아무것도 하지 않았다</span></div></div><div class=\"rc\"><div class=\"e\">— yet.</div><div class=\"k\">아직까지는.</div></div><div class=\"rnat\">(C) 7 그녀는 아무것도 하지 않았다. 아직까지는.</div><div class=\"rst\">결국 셰릴은 <b>아무것도 하지 않았어요</b>. 그래서 ④ “대신 지불했다”는 지문과 어긋나요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(C) 8번</span><div class=\"rc\"><div class=\"e\">And the woman left the store.</div><div class=\"k\">그리고 그 여자는 가게를 떠났다.</div></div><div class=\"rnat\">(C) 8 그리고 그 여자는 가게를 떠났다.</div><div class=\"rst\">그리고 아주머니는 <b>가게를 나가요</b>. 이제 장면이 가게 밖으로 옮겨 가요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">(B) 1번</span><div class=\"rc\"><div class=\"e\">(B) As Cheryl walked into the parking lot,</div><div class=\"k\">(B) Cheryl이 주차장으로 걸어갔을 때,</div></div><div class=\"rc\"><div class=\"e\">she spotted the woman</div><div class=\"k\">그녀는 그 여자를 발견했고</div></div><div class=\"rc\"><div class=\"e\">returning her shopping cart,</div><div class=\"k\">쇼핑카트를 반납하고 있는</div></div><div class=\"rc\"><div class=\"e\">and she remembered something</div><div class=\"k\">그리고 그녀는 무언가를 기억해냈다</div></div><div class=\"rc\"><div class=\"e\">in her purse</div><div class=\"k\">자신의 지갑에 있는</div></div><div class=\"rc\"><div class=\"e\">that could help her.</div><div class=\"k\">그녀(= 그 여자)를 도울 수 있는.</div></div><div class=\"rnat\">(B) 1 Cheryl이 주차장으로 걸어갔을 때, 그녀는 쇼핑카트를 반납하고 있는 그 여자를 발견했고, 그녀(Cheryl)의 지갑에 있는 그녀(그 여자)를 도울 수 있는 무언가를 기억해냈다(자신의 지갑에 그녀를 도울 수 있는 무언가가 있다는 것을 기억해냈다).</div><div class=\"rst\">셰릴이 <b>주차장</b>에 갔더니, 카트를 돌려놓는 아주머니가 보여요. 지갑 속 도와줄 물건도 떠올라요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">(B) 2번</span><div class=\"rc\"><div class=\"e\">She approached the woman</div><div class=\"k\">그녀(= Cheryl)는 그 여자에 >그녀(= 그 여자)에게 건넸다</div></div><div class=\"rc\"><div class=\"e\">a small card.</div><div class=\"k\">작은 카드를.</div></div><div class=\"rnat\">(B) 6 그리고 (b)그녀(Cheryl)는 그녀에게 작은 카드를 건넸다.</div><div class=\"rst\">그리고 셰릴이 아주머니에게 <b>작은 카드</b>를 건네요. 지문 그대로 선택지 ③과 같아요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">(D) 1번</span><div class=\"rc\"><div class=\"e\">(D) When the woman read</div><div class=\"k\">(D) 그 여자가 읽었을 때</div></div><div class=\"rc\"><div class=\"e\">the card’s only two words,</div><div class=\"k\">카드의 단 두 단어를,</div></div><div class=\"rc\"><div class=\"e\">she began to cry.</div><div class=\"k\">그녀는 울기 시작했다.</div></div><div class=\"rnat\">(D) 1 그 여자가 카드의(카드에 적힌) 단 두 단어를 읽었을 때, 그녀는 울기 시작했다.</div><div class=\"rst\">아주머니가 그 카드에 적힌 <b>단 두 단어</b>를 읽고 울기 시작해요. (B)의 카드가 여기서 이어져요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">(D) 2번</span><div class=\"rc\"><div class=\"e\">And through her tears,</div><div class=\"k\">그리고 눈물을 흘리며,</div></div><div class=\"rc\"><div class=\"e\">she said,</div><div class=\"k\">그녀(= 그 여자)는 말했다,</div></div><div class=\"rc\"><div class=\"e\">“You have no idea</div><div class=\"k\">“당신은 전혀 모를 거예요</div></div><div class=\"rc\"><div class=\"e\">how much this means to me.”</div><div class=\"k\">이것이 나에게 얼마나 큰 의미인지.”</div></div><div class=\"rnat\">(D) 2 그리고 눈물을 흘리며, 그녀는 말했다, “당신은 이것이 나에게 얼마나 큰 의미인지 전혀 모를 거예요.”</div><div class=\"rst\">아주머니는 눈물을 흘리며 “이게 저한테 얼마나 큰 의미인지 모르실 거예요.” 하고 말해요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">(D) 3번</span><div class=\"rc\"><div class=\"e\">(d) She</div><div class=\"k\">(d) 그녀(= Cheryl)는</div></div><div class=\"rc\"><div class=\"e\">was a little startled</div><div class=\"k\">조금 놀랐다</div></div><div class=\"rc\"><div class=\"e\">by her reply.</div><div class=\"k\">그녀(= 그 여자)의 대답에.</div></div><div class=\"rnat\">(D) 3 (d)그녀(Cheryl)는 그녀의 대답에 조금 놀랐다.</div><div class=\"rst\">대답을 들은 셰릴이 조금 놀라요. 놀란 사람은 대답을 들은 쪽이니 <b>(d) 그녀 = 셰릴</b>이에요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">(D) 4번</span><div class=\"rc\"><div class=\"e\">Having never done anything like this before,</div><div class=\"k\">이러한 일을 이전에는 해 본 적이 없었기 때문에,</div></div><div class=\"rc\"><div class=\"e\">Cheryl hadn’t anticipated</div><div class=\"k\">Cheryl은 예상하지 못했다</div></div><div class=\"rc\"><div class=\"e\">the reaction</div><div class=\"k\">그러한 반응을</div></div><div class=\"rc\"><div class=\"e\">she might receive.</div><div class=\"k\">자신이 받게 될.</div></div><div class=\"rnat\">(D) 4 이러한 일을 이전에는 해 본 적이 없었기 때문에, Cheryl은 그녀가 받는 그러한 반응을 예상하지 못했다(Cheryl은 자신이 그러한 반응을 받게 될 것이라고 예상하지 못했다).</div><div class=\"rst\">셰릴은 이런 일을 처음 해 봐서 이런 반응이 올 줄 몰랐어요. = 지문 그대로예요.</div></div><div class=\"rds\" data-ord=\"25\"><span class=\"rn\">(D) 5번</span><div class=\"rc\"><div class=\"e\">All she could think</div><div class=\"k\">(e) 그녀(= Cheryl)가 생각해낼 수 있었던 전부는</div></div><div class=\"rc\"><div class=\"e\">to respond</div><div class=\"k\">반응하고자</div></div><div class=\"rc\"><div class=\"e\">was,</div><div class=\"k\">~였다,</div></div><div class=\"rc\"><div class=\"e\">“Oh, my.</div><div class=\"k\">“오, 세상에,</div></div><div class=\"rc\"><div class=\"e\">Would it be OK to give you a hug?”</div><div class=\"k\">당신에게 포옹을 드려도 괜찮을까요?”</div></div><div class=\"rnat\">(D) 5 (e)그녀(Cheryl)가 (재빨리) 반응하고자 생각해낼 수 있었던 전부는, “오, 세상에, 당신에게 포옹을 드려도 괜찮을까요?”였다(그녀는 “오, 세상에, 당신을 안아드려도 괜찮을까요?”라고 반응하는 것 외에는 다른 것을 생각해낼 수 없었다).</div><div class=\"rst\">셰릴이 겨우 떠올린 말은 “안아 드려도 될까요?”예요. 포옹을 청하는 사람이니 <b>(e) 그녀 = 셰릴</b>이에요.</div></div><div class=\"rds\" data-ord=\"26\"><span class=\"rn\">(D) 6번</span><div class=\"rc\"><div class=\"e\">After they embraced,</div><div class=\"k\">그들이 껴안고 난 후,</div></div><div class=\"rc\"><div class=\"e\">she walked back to her car</div><div class=\"k\">그녀(= Cheryl)는 그녀의 차로 걸어 돌아가</div></div><div class=\"rc\"><div class=\"e\">and began to cry too.</div><div class=\"k\">역시 울기 시작했다.</div></div><div class=\"rnat\">(D) 6 그들이 껴안고 난 후, 그녀는 그녀의 차로 걸어 돌아가 울기 시작했다.</div><div class=\"rst\">둘이 꼭 안은 뒤, 셰릴은 <b>차로 돌아가서</b> 자기도 울기 시작해요. = 선택지 ⑤와 같아요.</div></div><div class=\"rds\" data-ord=\"27\"><span class=\"rn\">(D) 7번</span><div class=\"rc\"><div class=\"e\">The words on the card?</div><div class=\"k\">그 카드에 있던 (두) 단어는?</div></div><div class=\"rc\"><div class=\"e\">“You Matter.”</div><div class=\"k\">“당신은 소중합니다.”</div></div><div class=\"rnat\">(D) 7 그 카드에 있던 (두) 단어는? “당신은 소중합니다.”</div><div class=\"rst\">카드 속 두 단어는 “당신은 소중합니다.” 첫 질문의 답이에요. 두 마디가 하루를 바꿨어요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"groceries\" data-m=\"식료품\"><b>groceries</b>식료품</button><button type=\"button\" class=\"wdb\" data-w=\"offer to\" data-m=\"~하겠다고 제안하다\"><b>offer to</b>~하겠다고 제안하다</button><button type=\"button\" class=\"wdb\" data-w=\"resume\" data-m=\"이력서\"><b>resume</b>이력서</button><button type=\"button\" class=\"wdb\" data-w=\"spot\" data-m=\"발견하다\"><b>spot</b>발견하다</button><button type=\"button\" class=\"wdb\" data-w=\"overhear\" data-m=\"엿듣다, 우연히 듣다\"><b>overhear</b>엿듣다, 우연히 듣다</button><button type=\"button\" class=\"wdb\" data-w=\"purse\" data-m=\"지갑\"><b>purse</b>지갑</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);

 var w=e.target.closest('.wdb');

  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" data-q="'+d.no+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
