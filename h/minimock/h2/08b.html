<title>고2 미니모의고사 8회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}
.rst:before{content:"결국 이 얘기  ";font-size:11.5px;font-weight:800;color:#8a6d00}

환 사이의)는 relationship을 꾸미는 형용사구. gene (유전자), chronic disease (만성질환)"]}, {"t": "<b>in just that way</b>는 전치사구(부사구)이다. happened를 꾸민다 (바로 그런 방식으로). way (방식)."}, {"t": "<b>building on the work of scientists from decades — even centuries — ago</b>는 분사구문(부사적)이다. happened를 꾸민다 (~을 발판 삼아).", "sub": ["build on (~을 기반으로 삼다), work (연구), scientist (과학자)", "decades (수십 년) — even centuries (심지어 수 세기)는 대시로 삽입되어 강조"]}], "sum": "과학은 원래 이렇게 작동, 유전자-만성질환 이해도 옛 연구 위에서 이뤄짐"}, {"i": "05", "q": "09", "s": "3", "title": "S+V+O(that절) + because절 + 콜론 설명", "eng": "Scientists propose / that this occurs / because, although we experience three dimensions<sup>1</sup>, / only two had a strong influence on our evolution: / the vertical dimension as defined by gravity<sup>2</sup> / and, in mobile species<sup>3</sup>, / the front/back dimension as defined by the positioning of sensory and feeding mechanisms<sup>4</sup>.", "notes": [["1", "dimension", "차원"], ["2", "gravity", "중력"], ["3", "mobile species", "이동하는 종"], ["4", "mechanism", "기관, 메커니즘"]], "lit": "과학자들은 제안한다 / 이것이 일어난다고 / 왜냐하면, 비록 우리가 세 가지 차원을 경험하지만 / 오직 둘만이 우리의 진화에 강한 영향을 주었기 때문이다 / 중력에 의해 정의되는 수직 차원 / 그리고 이동하는 종에서는 / 감각·섭식 기관의 위치에 의해 정의되는 전후 차원", "nat": "과학자들은 우리가 삼차원을 경험하지만 그중 두 가지 차원만 진화에 강한 영향을 주었기 때문에 이런 일이 일어난다고 본다 — 중력으로 정의되는 수직 차원과, 이동하는 종의 경우 감각·섭식 기관의 위치로 정의되는 전후 차원이다.", "ana": "<b>because</b> 뒤에 <b>although 양보절이 통째로 삽입</b>되어 있어, because의 진짜 내용(only two had ~)이 한참 뒤에야 나옵니다. 콜론(:) 뒤에서 그 <b>두 차원을 구체적으로 나열</b>하는데, <b>as defined by ~</b>가 각각 vertical dimension과 front/back dimension을 뒤에서 꾸미는 <b>과거분사구</b>로 반복 사용됩니다. <b>in mobile species</b>는 중간에 끼어든 <b>삽입구</b>입니다.", "pe": "Scientists propose / that this occurs / \u0001because, although we experience three dimensions<sup>1</sup>\u0002, / \u0001only two had a strong influence on our evolution\u0002: / \u0001the vertical dimension as defined by gravity<sup>2</sup>\u0002 / \u0001and, in mobile species<sup>3</sup>\u0002, / \u0001the front/back dimension as defined by the positioning of sensory and feeding mechanisms<sup>4</sup>\u0002.", "pk": "과학자들은 제안한다 / 이것이 일어난다고 / \u0001왜냐하면, 비록 우리가 세 가지 차원을 경험하지만\u0002 / \u0001오직 둘만이 우리의 진화에 강한 영향을 주었기 때문이다\u0002 / \u0001중력에 의해 정의되는 수직 차원\u0002 / \u0001그리고 이동하는 종에서는\u0002 / \u0001감각·섭식 기관의 위치에 의해 정의되는 전후 차원\u0002", "core": "과학자들은 이것이 일어난다고 제안한다.", "tags": ["주어 Scientists + 동사 propose (SVO). 목적어는 다음 that절", "that절 = propose의 목적어 (명사절). 주어 this + 동사 occurs", "because절 시작 = 부사절: occurs를 꾸밈 (이유). although we ~ = 부사절 삽입: 양보, 이유절 안", "because의 진짜 내용: only two had ~ (이유절 안). 콜론 뒤에서 그 둘을 설명", "콜론 뒤 설명 ①: 명사구 = two를 구체적으로 설명하는 동격. as defined by ~ = 과거분사구: dimension을 꾸밈", "and = 설명 ②와 병렬. in mobile species = 전치사구(부사구) 삽입: 뒤 설명을 꾸밈", "콜론 뒤 설명 ②: 명사구 = two를 설명하는 동격. as defined by ~ = 과거분사구: dimension을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 that절 안에 because절, 그 안에 although절, 콜론 설명까지 겹겹이 들어 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Scientists (과학자들)", "V: propose (제안하다, 주장하다)", "O: that절", "뼈대 = <b>Scientists propose that ...</b>"]}, {"t": "that절 안의 뼈대는 <b>this occurs</b> (S: this 이것, V: occurs (occur 일어나다의 3인칭 단수형))이다."}, {"t": "<b>because, although we experience three dimensions, only two had a strong influence on our evolution</b>은 부사절(이유)이다. occurs를 꾸민다.", "sub": ["중간에 낀 although we experience three dimensions는 양보절 (비록 우리가 세 차원을 경험하지만). dimension (차원), experience (경험하다)", "진짜 이유는 only two had a strong influence on our evolution (오직 둘만이 우리의 진화에 강한 영향을 주었다). influence (영향), evolution (진화)"]}, {"t": "콜론(:) 뒤는 그 두 개가 무엇인지 설명하는 동격 명사구이다.", "sub": ["① the vertical dimension as defined by gravity (중력으로 정의되는 수직 차원). as defined by ~는 dimension을 꾸미는 과거분사구. vertical (수직의), define (정의하다), gravity (중력)", "② and, in mobile species, the front/back dimension as defined by the positioning of sensory and feeding mechanisms (그리고 이동하는 종에서는 감각·섭식 기관의 위치로 정의되는 전후 차원). in mobile species는 삽입. mobile (이동하는), species (종), positioning (위치), sensory (감각의), feeding (섭식), mechanism (기관)"]}], "sum": "세 차원 중 진화에 영향을 준 수직·전후 두 차원이 원인이라고 설명"}, {"i": "06", "q": "10", "s": "A-6", "title": "When절 + S+V 병렬(3형식 / 4형식)", "eng": "When it was the woman's turn<sup>1</sup> to pay, / the cashier greeted<sup>2</sup> her by name / and asked her how she was doing.", "notes": [["1", "turn", "차례"], ["2", "greet", "인사하다"]], "lit": "그 여성이 지불할 차례가 되었을 때 / 계산원은 그녀를 이름으로 불러 인사했다 / 그리고 그녀에게 어떻게 지내는지 물었다", "nat": "그 여성이 계산할 차례가 되자, 계산원은 그녀를 이름으로 부르며 인사하고 어떻게 지내는지 물었다.", "ana": "<b>When절</b> 뒤 주절의 동사 <b>greeted ~ and asked ~</b>는 <b>and로 이어진 병렬</b>입니다. <b>asked her how she was doing</b>은 <b>간접의문문</b>이 asked의 직접목적어로 쓰인 구조로, 의문문 어순(how was she doing)이 아니라는 점에 주의하세요.", "pe": "\u0001When it was the woman's turn<sup>1</sup> to pay\u0002, / the cashier greeted<sup>2</sup> her \u0001by name\u0002 / and asked her how she was doing.", "pk": "\u0001그 여성이 지불할 차례가 되었을 때\u0002 / 계산원은 그녀를 \u0001이름으로\u0002 불러 인사했다 / 그리고 그녀에게 어떻게 지내는지 물었다", "core": "계산원은 그녀에게 인사했고 그녀에게 어떻게 지내는지 물었다.", "tags": ["When절 = 부사절: greeted를 꾸밈 (시간). 안의 to pay는 turn을 꾸미는 to부정사(형용사적)", "주어 cashier + 동사 greeted + 목적어 her. by name = 전치사구(부사구): greeted를 꾸밈 (방법)", "and asked = 동사 병렬. asked + 간접목적어 her + 직접목적어 how절 (SVOO). how she was doing = 간접의문문 (평서문 어순)"], "steps": [{"t": "이 문장은 <b>When절 + 동사 둘(3형식, 4형식)</b>이다. 주어 the cashier 하나가 동사 둘을 이끈다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the cashier (계산원)", "V①: greeted (greet 인사하다의 과거형) + O: her (그녀)", "V②: asked (ask 묻다의 과거형) + 간접목적어 her + 직접목적어 how she was doing (4형식)", "뼈대 = <b>the cashier greeted her and asked her ...</b>"]}, {"t": "<b>When it was the woman's turn to pay</b>는 부사절(시간)이다. 주절을 꾸민다.", "sub": ["it = 비인칭 주어. turn (차례), pay (지불하다)", "to pay는 turn을 꾸미는 to부정사 (지불할 차례)"]}, {"t": "<b>by name</b>은 전치사구(부사구)이다. greeted를 꾸민다 (이름으로)."}, {"t": "<b>how she was doing</b>는 asked의 직접목적어(간접의문문)이다. 평서문 어순 she was doing (그녀가 어떻게 지내는지). she = the woman (그 여성)."}], "sum": "그 여성 차례가 되자, 계산원은 이름을 부르며 안부를 물음"}, {"i": "07", "q": "10", "s": "D-4", "title": "완료 분사구문 + S+V+O", "eng": "Having never done anything like this before, / Cheryl hadn't anticipated<sup>1</sup> / the reaction<sup>2</sup> she might receive.", "notes": [["1", "anticipate", "예상하다"], ["2", "reaction", "반응"]], "lit": "전에 이런 일을 해 본 적이 전혀 없었기에 / Cheryl은 예상하지 못했다 / 자신이 받을지도 모르는 반응을", "nat": "전에 이런 일을 해 본 적이 없었기에, Cheryl은 자신이 어떤 반응을 받게 될지 예상하지 못했다.", "ana": "문장 맨 앞 <b>Having never done ~</b>은 <b>완료형 분사구문</b>(= As she had never done ~)으로, 주절보다 <b>한 시제 앞선 일</b>임을 나타냅니다. <b>the reaction (that) she might receive</b>에서는 <b>목적격 관계대명사가 생략</b>되어 reaction 뒤에 곧바로 주어(she)가 옵니다.", "pe": "\u0001Having never done anything like this before\u0002, / Cheryl hadn't anticipated<sup>1</sup> / the reaction<sup>2</sup> \u0001she might receive\u0002.", "pk": "\u0001전에 이런 일을 해 본 적이 전혀 없었기에\u0002 / Cheryl은 예상하지 못했다 / \u0001자신이 받을지도 모르는\u0002 반응을", "core": "Cheryl은 반응을 예상하지 못했다.", "tags": ["Having p.p. = 완료형 분사구문(부사구): hadn't anticipated를 꾸밈 (이유, 한 시제 앞선 일)", "주어 Cheryl + 동사 hadn't anticipated (과거완료 부정)", "목적어 reaction. she might receive = 관계절(형용사절, 목적격 관계대명사 생략): reaction을 꾸밈"], "steps": [{"t": "이 문장은 <b>완료형 분사구문 + S+V+O(3형식)</b>이다. 앞 분사구문이 길 뿐 뼈대는 짧다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Cheryl", "V: hadn't anticipated (anticipate 예상하다의 과거완료 부정)", "O: the reaction (반응)", "뼈대 = <b>Cheryl hadn't anticipated the reaction</b>"]}, {"t": "<b>Having never done anything like this before</b>는 완료형 분사구문(부사적, 이유)이다. hadn't anticipated를 꾸민다. Having p.p.는 주절보다 한 시제 앞선 일을 나타낸다. never (전혀 ~않다), before (전에), like this (이와 같은). 의미상 주어는 Cheryl이다."}, {"t": "<b>she might receive</b>는 관계절(형용사절)이다. reaction을 꾸민다. 목적격 관계대명사가 생략되었다. might (~할지도 모른다), receive (받다)."}], "sum": "Cheryl, 처음 해 보는 일이라 받을 반응을 예상 못 함"}, {"i": "08", "q": "10", "s": "D-5", "title": "All + 관계절 주어 + S+V+C(인용문)", "eng": "All she could think to respond<sup>1</sup> was, / \"Oh, my. / Would it be OK to give you a hug?\"", "notes": [["1", "respond", "대답하다"], ["2", "give a hug", "안아주다"]], "lit": "그녀가 대답으로 생각해낼 수 있었던 전부는 ~였다 / '오, 이런 / 안아 드려도 될까요?'", "nat": "그녀가 대답으로 떠올릴 수 있었던 말은 고작 '오, 이런. 안아 드려도 될까요?'뿐이었다.", "ana": "<b>All (that) she could think to respond</b>에서 All 뒤에 <b>목적격 관계대명사 that이 생략</b>되어 있고, 이 전체가 문장의 <b>주어</b>이며 동사는 <b>was</b>입니다. 뒤이어 나오는 <b>Would it be OK to ~?</b>는 <b>가주어 it + 진주어 to부정사</b> 구조의 정중한 의문문입니다.", "pe": "All \u0001she could think to respond<sup>1</sup>\u0002 was, / \"Oh, my. / Would it be OK to give you a hug?\"", "pk": "\u0001그녀가 대답으로 생각해낼 수 있었던\u0002 전부는 ~였다 / '오, 이런 / 안아 드려도 될까요?'", "core": "전부는 '오, 이런. 안아 드려도 될까요?'였다.", "tags": ["주어 All + 동사 was. she could think to respond = 관계절(형용사절, 목적격 관계대명사 생략): All을 꾸밈", "보어 자리의 인용문: 감탄 Oh, my (이어지는 문장과 함께 보어)", "인용문 안: <b>가주어 it</b> + be OK + 진주어 to give you a hug (명사적 용법)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어가 All + 관계절이라 길고, 보어가 인용문이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: All she could think to respond (그녀가 대답으로 떠올릴 수 있었던 전부)", "V: was (be의 과거형, ~였다)", "C: “Oh, my. ~?” (인용문)", "뼈대 = <b>All ... was “...”</b>"]}, {"t": "<b>she could think to respond</b>는 관계절(형용사절)이다. All을 꾸민다. 목적격 관계대명사가 생략되었다. could (~할 수 있었다), think (생각해 내다), respond (대답하다)."}, {"t": "인용문 안을 본다.", "sub": ["Oh, my (오, 이런)는 감탄", "Would it be OK to give you a hug? = 가주어 it + 진주어 to give you a hug (안아 드려도 될까요?)", "hug (포옹), OK (괜찮은), would는 정중하게 묻는 표현"]}], "sum": "그녀가 떠올린 대답은 안아 드려도 되냐는 한마디"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2019년 6월 32번", "ans": "①", "tr": [["1", "기업가 Derek Sivers의 말처럼, '첫 번째 추종자는 외로운 괴짜를 리더로 바꿔 놓는 존재다.'"], ["2", "만약 당신이 다른 일곱 명과 함께 앉아 있었는데 여섯 명은 틀린 답을 고르고 나머지 한 명만 맞는 답을 골랐다면, 순응하는 정도는 급격히 떨어졌다."], ["3", "'지지해 주는 동료가 있으면 다수가 주는 압박의 상당 부분이 사라졌다'고 Asch는 적었다."], ["4", "단지 ___________을 아는 것만으로도 무리를 거스르기가 훨씬 쉬워진다."], ["5", "정서적인 힘은 소수 안에서도 발견될 수 있다."], ["6", "Margaret Mead의 말을 빌리면, '사려 깊은 시민으로 이루어진 작은 집단이 세상을 바꿀 수 있다는 것을 결코 의심하지 말라. 실제로 그것이야말로 지금껏 세상을 바꿔 온 유일한 것이다.'"], ["7", "당신이 혼자가 아니라고 느끼기 위해, 무리 전체가 함께할 필요는 없다."], ["8", "Sigal Barsade와 Hakan Ozcelik의 연구에 따르면, 기업이나 정부 조직에서 친구 한 명만 있어도 외로움을 상당히 줄이는 데 충분하다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "To feel that you're not alone, you don't need a whole crowd to join you."}, {"en": false, "h": "빈칸 뒤에 이어지는 5~8번은 모두 '<b>단 한 명의 동료만으로도 충분하다</b>'는 같은 메시지를 반복합니다. 7번이 그 결론을 가장 압축적으로 담고 있으므로, 빈칸에는 '<b>내가 유일하게 저항하는 사람이 아니다</b>'라는 사실이 들어가야 합니다."}], "opts": [{"n": "①", "t": "you're not the only resister", "a": true, "x": false, "trap": false, "e": "7번의 '당신은 혼자가 아니다'라는 메시지와 정확히 일치합니다. 한 명의 동료를 아는 것만으로 무리를 거스르기 쉬워진다는 흐름에 맞습니다."}, {"n": "②", "t": "the leader cannot be defeated", "a": false, "x": true, "trap": false, "e": "리더가 패배할 수 없다는 내용은 언급되지 않습니다."}, {"n": "③", "t": "conforming to the rule is good", "a": false, "x": true, "trap": false, "e": "글 전체가 오히려 순응을 거부하는 힘을 다루므로 정반대 방향입니다."}, {"n": "④", "t": "men are supposed to live alone", "a": false, "x": true, "trap": false, "e": "혼자 살아야 한다는 내용과는 무관합니다."}, {"n": "⑤", "t": "competition discourages cooperation", "a": false, "x": true, "trap": true, "e": "경쟁과 협력의 관계는 이 글의 소재가 아닙니다."}], "w": [["entrepreneur", "기업가"], ["transform A into B", "A를 B로 바꾸다"], ["conformity", "순응, 동조"], ["dramatically", "급격히"], ["deplete", "고갈시키다"], ["substantially", "상당히"], ["reject", "거부하다"], ["thoughtful", "사려 깊은"], ["significantly", "상당히"], ["loneliness", "외로움"]]}, {"q": "08", "type": "글의 순서", "src": "2019년 11월 37번", "ans": "④", "tr": [["1", "19세기 말의 생리학적 발견들처럼, 오늘날의 생물학적 획기적 발견은 인간 유기체가 작동하는 방식에 대한 우리의 이해를 근본적으로 바꾸어 왔으며, 의료 행위 역시 근본적이고 철저하게 바꿀 것이다."], ["2", "(C) '획기적 발견'이라는 단어는, 그러나 많은 사람들의 마음속에서 순식간에 모든 것을 명백하게 만드는 놀랍고 전례 없는 발견을 의미하는 것처럼 보인다."], ["3", "과학은 실제로 그렇게 작동하지 않는다."], ["4", "(A) 당신이 초등학교 때 처음으로 배웠을 과학적 방법을 기억하는가?"], ["5", "그것은 관찰, 가설, 실험, 검증, 수정, 재검증을 계속 반복하는 길고 어려운 과정을 지닌다."], ["6", "(B) 그것이 과학이 작동하는 방식이며, 우리 유전자와 만성질환 사이의 관계에 대한 획기적 이해도 바로 그런 식으로, 수십 년 — 심지어 수백 년 — 전 과학자들의 연구를 발판 삼아 이루어졌다."], ["7", "사실, 그것은 지금도 일어나고 있으며, 연구가 계속됨에 따라 이야기는 계속 펼쳐지는 중이다."]], "evh": "(C) 마지막 · (A) 처음", "ev": [{"en": true, "h": "Science doesn't actually work that way. / Remember the scientific method, which you probably first learned about back in elementary school?"}, {"en": false, "h": "순서 문제는 <b>however(그러나)</b>가 만드는 대립부터 찾 function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){

}
function renderResult(){

}

var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 뒤 문장들이 <b>같은 말을 되풀이</b>해요. “한 명만 내 편이어도 군중에 맞서기 쉬워진다” — 2·3·7번이 반복하는 <b>‘나 혼자가 아니다’</b>를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (4번)</span><div class=\"en\">Merely knowing that <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> makes it substantially easier to <mark>reject the crowd</mark>.</div><p class=\"ko\">단지 ( ? )라는 것을 아는 것만으로도 <mark>군중을 거부하는 것이</mark> 상당히 더 쉬워진다.</p></div><div class=\"ck-via\"><i>▼</i><span>무엇을 알면 군중을 거부하기 쉬운지, 앞의 실험에서 확인해요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 실험 장면</span><div class=\"en\">… six group members picked the wrong answer, but <mark>the remaining one chose the correct answer</mark>, conformity dropped dramatically.</div><p class=\"ko\">여섯 명이 틀린 답을 골랐지만, <mark>남아 있는 한 명이 옳은 답을 선택한다면</mark>, 순응은 급격하게 떨어진다.</p></div><div class=\"ck-via\"><i>▼</i><span>옳은 답을 고른 그 한 명 = 지지하는 파트너</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 실험 결론</span><div class=\"en\">The presence of <mark>a supporting partner</mark> depleted the majority of much of its pressure</div><p class=\"ko\"><mark>지지하는 파트너</mark> 한 명의 존재는 다수에게서 그 압력의 많은 부분을 고갈시켰다(빼앗았다)</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 뒤에서 같은 말을 한 번 더 정리해 준 문장</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">To feel that <mark>you’re not alone</mark>, you don’t need a whole crowd to join you.</div><p class=\"ko\"><mark>당신이 혼자가 아니라고</mark> 느끼기 위해, 당신과 함께할 전체 군중이 필요하지는 않다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">you're not the only resister 당신이 유일한 저항자가 아니다<small>7번 not alone(혼자가 아닌)을 resister(저항자)로 바꿔 말한 것이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">conforming to the rule is good 규칙에 순응하는 것이 좋다</span><span class=\"why\">2번 conformity(순응)를 그대로 써서 끌려요. 하지만 지문은 순응이 dropped(떨어졌다)고, 빈칸 뒤도 reject the crowd(군중을 거부하다)라서 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">the leader cannot be defeated 지도자는 패배할 수 없다</span><span class=\"why\">1번에 leader(지도자)가 나오지만, 첫 추종자가 괴짜를 지도자로 만든다는 말이에요. 지도자를 이기는 얘기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">men are supposed to live alone 사람은 혼자 살아야 한다</span><span class=\"why\">7번 you’re not alone(당신은 혼자가 아니다), 8번 친구 한 명이 외로움을 줄인다는 말과 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">competition discourages cooperation 경쟁은 협력을 막는다</span><span class=\"why\">지문 어디에도 경쟁 얘기는 없어요. 지문은 한 명의 지지자가 주는 힘을 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">As entrepreneur Derek Sivers put it,</div><div class=\"k\">기업가 Derek Sivers가 말했듯이,</div></div><div class=\"rc\"><div class=\"e\">“The first follower is what</div><div class=\"k\">“첫 번째 추종자가 ~하는 것이다</div></div><div class=\"rc\"><div class=\"e\">transforms a lone nut</div><div class=\"k\">바꾸는, 외로운 괴짜를</div></div><div class=\"rc\"><div class=\"e\">into a leader.”</div><div class=\"k\">지도자로.”</div></div><div class=\"rnat\">기업가 Derek Sivers가 말했듯이, “첫 추종자가 외로운 괴짜를 지도자로 바꾸는 것이다.”</div><div class=\"rst\">반에서 혼자 튀는 의견을 내면 괴짜 취급받아요. 그런데 한 명이 따라 주면 리더가 돼요. 지문 첫 문장이 이 얘기예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">If you were sitting</div><div class=\"k\">당신이 앉아 있다면</div></div><div class=\"rc\"><div class=\"e\">with seven other people</div><div class=\"k\">다른 일곱 명과 함께</div></div><div class=\"rc\"><div class=\"e\">and six group members picked the wrong answer,</div><div class=\"k\">그리고 여섯 명의 구성원이 틀린 답을 골랐지만,</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">the remaining one chose the correct answer</span>,</div><div class=\"k\"><span class=\"cw\">남아 있는 한 명이 옳은 답을 선택한다면</span>,</div></div><div class=\"rc\"><div class=\"e\">conformity dropped dramatically.</div><div class=\"k\">순응은 급격하게 떨어진다.</div></div><div class=\"rnat\">만약 당신이 일곱 명의 다른 사람들과 함께 앉아 있고 (그 중) 여섯 명의 구성원들이 틀린 답을 골랐지만 남아 있는 한 명이 옳은 답을 선택한다면, 순응은 급격하게 떨어진다.</div><div class=\"rst\">수학 시간, 여섯 명이 틀린 답에 손을 들어도 <b>한 명이 정답</b>에 들면 나도 정답에 손 들기 쉬워져요. 지문의 실험이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">“The presence of <span class=\"cw\">a supporting partner</span></div><div class=\"k\">“<span class=\"cw\">지지하는 파트너</span> 한 명의 존재는</div></div><div class=\"rc\"><div class=\"e\">depleted</div><div class=\"k\">고갈시켰다</div></div><div class=\"rc\"><div class=\"e\">the majority</div><div class=\"k\">다수에게서</div></div><div class=\"rc\"><div class=\"e\">of much of its pressure,”</div><div class=\"k\">그것의(= 다수의) 압력의 많은 부분을”</div></div><div class=\"rc\"><div class=\"e\">Asch wrote.</div><div class=\"k\">라고 Asch는 썼다.</div></div><div class=\"rnat\">“지지하는 파트너 한 명의 존재는 다수에게서 그것의 압력의(다수가 가하는 압력의) 많은 부분을 고갈시켰다.”라고 Asch는 썼다.</div><div class=\"rst\">내 편 한 명이 다수의 눈치 압박을 확 줄여 줘요. 지문은 이걸 <b>지지하는 파트너</b>의 힘이라고 말해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Merely knowing that</div><div class=\"k\">단지 ~을 아는 것만으로도</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">you’re not the only resister</span></div><div class=\"k\"><span class=\"cw\">당신이 유일한 저항자가 아니라는 것을</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">makes it substantially easier</div><div class=\"k\">상당히 더 쉬워진다</div></div><div class=\"rc\"><div class=\"e\">to reject the crowd.</div><div class=\"k\">군중을 거부하는 것이.</div></div><div class=\"rnat\">단지 당신이 유일한 저항자가 아니라는 것을 아는 것만으로도 군중을 거부하는 것이 상당히 더 쉬워진다(군중에게 반대하는 것이 상당히 쉬워진다).</div><div class=\"rst\">그래서 “<b>나만 반대하는 게 아니구나</b>” 하고 알기만 해도 반 분위기에 맞서기 쉬워요. 이게 빈칸 자리예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Emotional strength</div><div class=\"k\">정서적인 힘은</div></div><div class=\"rc\"><div class=\"e\">can be found</div><div class=\"k\">발견될 수 있다</div></div><div class=\"rc\"><div class=\"e\">even in small numbers.</div><div class=\"k\">심지어 소수에게서도.</div></div><div class=\"rnat\">정서적인 힘은 심지어 소수에게서도 발견될 수 있다.</div><div class=\"rst\">용기는 꼭 많은 사람한테서 나오지 않아요. 친구 한두 명이면 충분해요. 지문은 소수에게도 힘이 있대요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In the words of Margaret Mead,</div><div class=\"k\">Margaret Mead의 말에 따르면,</div></div><div class=\"rc\"><div class=\"e\">“Never doubt</div><div class=\"k\">“의심하지 마라</div></div><div class=\"rc\"><div class=\"e\">that a small group of thoughtful citizens</div><div class=\"k\">생각이 깊은 시민들의 작은 집단이</div></div><div class=\"rc\"><div class=\"e\">can change the world;</div><div class=\"k\">세상을 바꿀 수 있다는 것을;</div></div><div class=\"rc\"><div class=\"e\">indeed, it’s the only thing</div><div class=\"k\">사실은, 그것(= 작은 집단)이 유일한 것이다</div></div><div class=\"rc\"><div class=\"e\">that ever has.”</div><div class=\"k\">지금까지 그렇게 해 온(= 세상을 바꿔 온).”</div></div><div class=\"rnat\">Margaret Mead의 말에 따르면, “소수의 생각이 깊은 시민이 세상을 바꿀 수 있다는 것을 의심하지 마라. 사실은 그것이 지금까지 그렇게 한 유일한 것이다(지금까지 세상을 바꿔온 것은 소수의 생각이 깊은 시민뿐이었다).”</div><div class=\"rst\">작은 모둠 하나가 반 전체를 바꾸기도 해요. 지문 속 미드(Mead)의 말처럼 작은 집단이 세상을 바꿔 왔대요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">To feel that <span class=\"cw\">you’re not alone</span>,</div><div class=\"k\"><span class=\"cw\">당신이 혼자가 아니라고</span> 느끼기 위해,</div></div><div class=\"rc\"><div class=\"e\">you don’t need</div><div class=\"k\">당신은 필요하지 않다</div></div><div class=\"rc\"><div class=\"e\">a whole crowd</div><div class=\"k\">전체 군중이</div></div><div class=\"rc\"><div class=\"e\">to join you.</div><div class=\"k\">당신과 함께할.</div></div><div class=\"rnat\">당신이 혼자가 아니라고 느끼기 위해, 당신은 당신과 함께할 전체 군중이 필요하지는 않다.</div><div class=\"rst\"><b>혼자가 아니라고</b> 느끼는 데 반 전체가 필요하진 않아요. 4번 빈칸을 다시 정리해 준 문장이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Research by Sigal Barsade and Hakan Ozcelik</div><div class=\"k\">Sigal Barsade와 Hakan Ozcelik의 연구는</div></div><div class=\"rc\"><div class=\"e\">shows that</div><div class=\"k\">보여 준다</div></div><div class=\"rc\"><div class=\"e\">in business and government organizations,</div><div class=\"k\">기업과 정부 조직에서</div></div><div class=\"rc\"><div class=\"e\">just having one friend</div><div class=\"k\">단지 한 명의 친구를 갖는 것이</div></div><div class=\"rc\"><div class=\"e\">is enough to significantly decrease loneliness.</div><div class=\"k\">외로움을 상당히 줄이기에 충분하다는 것을.</div></div><div class=\"rnat\">Sigal Barsade와 Hakan Ozcelik의 연구는 기업과 정부 조직에서 단지 한 명의 친구를 갖는 것이 외로움을 상당히 줄이기에 충분하다는 것을 보여준다.</div><div class=\"rst\">전학 와도 친구 한 명만 생기면 덜 외로워요. 지문의 연구도 친구 하나면 외로움이 크게 준다고 보여 줘요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"conformity\" data-m=\"순응, 동조\"><b>conformity</b>순응, 동조</button><button type=\"button\" class=\"wdb\" data-w=\"deplete\" data-m=\"고갈시키다\"><b>deplete</b>고갈시키다</button><button type=\"button\" class=\"wdb\" data-w=\"substantially\" data-m=\"상당히\"><b>substantially</b>상당히</button><button type=\"button\" class=\"wdb\" data-w=\"reject\" data-m=\"거부하다\"><b>reject</b>거부하다</button><button type=\"button\" class=\"wdb\" data-w=\"resister\" data-m=\"저항자\"><b>resister</b>저항자</button><button type=\"button\" class=\"wdb\" data-w=\"loneliness\" data-m=\"외로움\"><b>loneliness</b>외로움</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주어진 글의 <b>breakthrough</b>(획기적 발견)를 <b>however</b>(하지만)로 반박하는 (C)가 먼저예요. 그다음 “그럼 진짜 과학은?” → 과학적 방법(A) → <b>That’s how</b>(그것이 ~방식) (B) 순으로 고리를 이으세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">… today’s biological breakthrough has fundamentally altered our understanding of how the human organism works …</div><p class=\"ko\">오늘날 생물학의 획기적인 발견은 인체가 작동하는 방식에 대한 우리의 이해를 근본적으로 바꾸어 왔으며 …</p></div><div class=\"ck-via\"><i>▼</i><span>주어진 글의 breakthrough(획기적 발견)를 다시 꺼내 however(하지만)로 오해를 짚어요</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리</span><div class=\"en\">The word “breakthrough,” <mark>however</mark>, seems to imply … an amazing, unprecedented revelation that, in an instant, makes everything clear.</div><p class=\"ko\"><mark>하지만</mark> ‘획기적인 발견’이라는 단어는 순식간에 모든 것을 명백하게 만드는 놀라운 발견을 의미하는 것처럼 보인다.</p></div><div class=\"ck-via\"><i>▼</i><span>“그렇게 작동하지 않는다” → 그럼 실제로는 어떻게 작동하는지가 다음에 와야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">(C) 끝 · 다음을 예고</span><div class=\"en\">Science doesn’t actually work <mark>that way</mark>.</div><p class=\"ko\">실제로 과학은 <mark>그렇게</mark> 작동하지 않는다.</p></div><div class=\"ck-via\"><i>▼</i><span>순식간이 아닌 진짜 과학 방식 = 초등학교 때 배운 과학적 방법</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 두 번째 고리</span><div class=\"en\"><mark>Remember the scientific method</mark>, which you probably first learned about back in elementary school?</div><p class=\"ko\">당신이 아마 초등학교 때 처음으로 배웠던 <mark>과학적 방법을 기억하는가</mark>?</p></div><div class=\"ck-via\"><i>▼</i><span>That(그것) = (A) 3번의 길고 어려운 과정</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 세 번째 고리</span><div class=\"en\"><mark>That’s how science works</mark>, and the breakthrough understanding … happened in just that way</div><p class=\"ko\">그것이 <mark>과학이 작동하는 방식</mark>이며, 획기적인 이해는 바로 그러한 방식으로 일어났다</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">(C) – (A) – (B)<small>however(하지만) 반박 → 과학적 방법 소개 → That(그것)으로 받기, 세 고리가 다 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">(B)의 breakthrough(획기적 발견)가 주어진 글과 겹쳐 끌려요. 하지만 That’s how(그것이 ~방식)의 That(그것)이 가리킬 3번 ‘길고 어려운 과정’이 아직 안 나왔어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글 바로 뒤에 과학적 방법이 갑자기 나와요. 또 (C)의 that way(그렇게)를 (B)가 받으면 That(그것)이 가리킬 과정이 바로 앞에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">(B)가 맨 앞이면 That(그것)이 가리킬 과정이 없어요. 또 (C)의 however(하지만)가 주어진 글이 아니라 (B)를 반박하게 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">(C) 끝 ‘그렇게 작동하지 않는다’ 뒤에 (B) That’s how(그것이 ~방식)가 오면, That(그것)이 가리킬 3번 ‘길고 어려운 과정’이 아직 안 나왔어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Like the physiological discoveries</div><div class=\"k\">생리학적 발견들처럼</div></div><div class=\"rc\"><div class=\"e\">of the late nineteenth century,</div><div class=\"k\">19세기 말의,</div></div><div class=\"rc\"><div class=\"e\">today’s biological breakthrough</div><div class=\"k\">오늘날 생물학의 획기적인 발견은</div></div><div class=\"rc\"><div class=\"e\">has fundamentally altered</div><div class=\"k\">근본적으로 바꾸어 왔으며</div></div><div class=\"rc\"><div class=\"e\">our understanding</div><div class=\"k\">우리의 이해를</div></div><div class=\"rc\"><div class=\"e\">of how the human organism works</div><div class=\"k\">인체가 작동하는 방식에 대한</div></div><div class=\"rc\"><div class=\"e\">and will change medical practice</div><div class=\"k\">그리고 의료 행위를 변화시킬 것이다</div></div><div class=\"rc\"><div class=\"e\">fundamentally and thoroughly.</div><div class=\"k\">근본적으로 그리고 완전히.</div></div><div class=\"rnat\">19세기 말의 생리학적 발견들처럼 오늘날 생물학의 획기적인 발견은 인체가 작동하는 방식에 대한 우리의 이해를 근본적으로 바꾸어 왔으며, 의료 행위를 근본적으로 그리고 완전히 변화시킬 것이다.</div><div class=\"rst\">뉴스에서 “암 치료의 <b>획기적 발견</b>!” 하고 떠들어요. 지문 첫 문장도 오늘날의 생물학 발견이 의학을 확 바꿀 거래요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A) <span class=\"cw\">Remember the scientific method</span>,</div><div class=\"k\">(A) <span class=\"cw\">과학적 방법을 기억하는가</span>,</div></div><div class=\"rc\"><div class=\"e\">which you probably first learned about</div><div class=\"k\">당신이 아마 처음으로 배웠던(= 과학적 방법)</div></div><div class=\"rc\"><div class=\"e\">back in elementary school?</div><div class=\"k\">초등학교 때?</div></div><div class=\"rnat\">(A) 당신이 아마 초등학교 때 처음으로 배웠던 과학적 방법을 기억하는가?</div><div class=\"rst\">과학 시간에 배운 <b>과학적 방법</b> 기억나요? 지문은 초등학교 때 처음 배운 그 방법을 떠올려 보래요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">It has <span class=\"cw\">a long and difficult process</span></div><div class=\"k\">그것(= 과학적 방법)은 <span class=\"cw\">길고도 어려운 과정을</span> 지닌다</div></div><div class=\"rc\"><div class=\"e\">of observation, hypothesis,</div><div class=\"k\">관찰, 가설,</div></div><div class=\"rc\"><div class=\"e\">experiment, testing, modifying,</div><div class=\"k\">실험, 검증, 수정,</div></div><div class=\"rc\"><div class=\"e\">retesting, and retesting again and again and again.</div><div class=\"k\">재검증, 그리고 되풀이되는 재검증의.</div></div><div class=\"rnat\">(A) 그것은 관찰, 가설, 실험, 검증, 수정, 재검증, 그리고 되풀이되는 재검증의 길고도 어려운 과정을 지닌다.</div><div class=\"rst\">관찰하고, 가설 세우고, 실험하고, 고치고, 또 실험하고 또 실험해요. 지문 속 길고 힘든 과정이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">That’s how science works</span>,</div><div class=\"k\">(B) 그것(= (A) 3번의 길고 어려운 과정)이 <span class=\"cw\">과학이 작동하는 방식</span>이며,</div></div><div class=\"rc\"><div class=\"e\">and the breakthrough understanding</div><div class=\"k\">그리고 획기적인 이해는</div></div><div class=\"rc\"><div class=\"e\">of the relationship</div><div class=\"k\">관계에 대한</div></div><div class=\"rc\"><div class=\"e\">between our genes and chronic disease</div><div class=\"k\">우리 유전자와 만성질병 간의</div></div><div class=\"rc\"><div class=\"e\">happened in just that way,</div><div class=\"k\">바로 그러한 방식으로 일어났다,</div></div><div class=\"rc\"><div class=\"e\">building on the work of scientists</div><div class=\"k\">과학자들의 연구를 기반으로 하여</div></div><div class=\"rc\"><div class=\"e\">from decades — even centuries — ago.</div><div class=\"k\">수십 년, 심지어 수세기 전으로부터의.</div></div><div class=\"rnat\">(B) 그것이 과학이 작동하는 방식이며, 우리 유전자와 만성질병 간의 관계에 대한 획기적인 이해는 수십 년, 심지어 수세기 전으로부터의 과학자들의 연구를 기반으로 하여, 바로 그러한 방식으로 일어났다.</div><div class=\"rst\"><b>그게 바로 과학이 일하는 방식</b>이에요. 유전자와 만성병의 관계를 밝힌 발견도 옛 과학자들 연구 위에서 그렇게 나왔대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">it is still happening;</div><div class=\"k\">그것은 아직도 일어나고 있으며,</div></div><div class=\"rc\"><div class=\"e\">the story continues to unfold</div><div class=\"k\">그 이야기는 계속 펼쳐진다</div></div><div class=\"rc\"><div class=\"e\">as the research presses on.</div><div class=\"k\">연구가 계속됨에 따라.</div></div><div class=\"rnat\">(B) 사실, 그것은 아직도 일어나고 있으며, 연구가 계속됨에 따라 그 이야기는 계속 펼쳐진다.</div><div class=\"rst\">그리고 그 이야기는 지금도 끝나지 않았어요. 지문 말처럼 연구가 계속되며 이야기가 이어져요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C) The word “breakthrough,”</div><div class=\"k\">(C) ‘획기적인 발견’이라는 단어는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">however</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span></div></div><div class=\"rc\"><div class=\"e\">seems to imply</div><div class=\"k\">의미하는 것처럼 보인다</div></div><div class=\"rc\"><div class=\"e\">in many people’s minds</div><div class=\"k\">많은 이들의 마음속에서</div></div><div class=\"rc\"><div class=\"e\">an amazing, unprecedented revelation</div><div class=\"k\">놀랍고 전례 없는 발견을</div></div><div class=\"rc\"><div class=\"e\">that, in an instant,</div><div class=\"k\">그것(= 그 발견)이 순식간에</div></div><div class=\"rc\"><div class=\"e\">makes everything clear.</div><div class=\"k\">모든 것을 명백하게 만드는.</div></div><div class=\"rnat\">(C) 하지만 많은 이들의 마음속에서 ‘획기적인 발견’이라는 단어는 순식간에 모든 것을 명백하게 만드는 놀랍고 전례 없는 발견을 의미하는 것처럼 보인다.</div><div class=\"rst\"><b>하지만</b> 우리는 ‘획기적 발견’ 하면, 어느 날 번쩍! 하고 모든 게 풀리는 장면을 떠올려요. = 지문의 사람들 생각이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Science doesn’t actually work</div><div class=\"k\">과학은 실제로 작동하지 않는다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that way</span>.</div><div class=\"k\"><span class=\"cw\">그렇게</span>.(= 순식간에 모든 것을 명백하게 만드는 방식으로)</div></div><div class=\"rnat\">(C) 실제로 과학은 그렇게 작동하지 않는다.</div><div class=\"rst\">실제 과학은 <b>그렇게</b> 번쩍 풀리지 않아요. 그럼 진짜로는 어떻게 될까요? 지문이 다음에 답해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"breakthrough\" data-m=\"획기적 발견\"><b>breakthrough</b>획기적 발견</button><button type=\"button\" class=\"wdb\" data-w=\"fundamentally\" data-m=\"근본적으로\"><b>fundamentally</b>근본적으로</button><button type=\"button\" class=\"wdb\" data-w=\"hypothesis\" data-m=\"가설\"><b>hypothesis</b>가설</button><button type=\"button\" class=\"wdb\" data-w=\"chronic disease\" data-m=\"만성질환\"><b>chronic disease</b>만성질환</button><button type=\"button\" class=\"wdb\" data-w=\"unprecedented\" data-m=\"전례 없는\"><b>unprecedented</b>전례 없는</button><button type=\"button\" class=\"wdb\" data-w=\"revelation\" data-m=\"뜻밖의 발견\"><b>revelation</b>뜻밖의 발견</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심 문장을 <b>말만 바꿔 옮긴 것</b>이에요. (A)는 3번의 위아래·앞뒤 <b>차원</b>을 한 말로 묶고, (B)는 5번 <b>not as relevant</b>(그만큼 중요하지 않다)를 바꿔 말한 자리예요.</p><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · (A)의 근거</span><div class=\"en\">… <mark>only two had a strong influence on our evolution</mark>: the vertical dimension as defined by gravity and, in mobile species, the front/back dimension …</div><p class=\"ko\"><mark>오직 두 가지만이 우리의 진화에 강한 영향을 주었기</mark> 때문이다: 중력에 의해 정의되는 수직적 차원과, 이동하는 종에서 앞/뒤 차원</p></div><div class=\"ck-via\"><i>▼</i><span>위아래·앞뒤 차원이 영향을 준 것 = 수직·수평, 멀고 가까움을 느끼는 공간 감각</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 무엇에 영향을 줬나</span><div class=\"en\">These influence <mark>our perception of vertical versus horizontal</mark>, far versus close …</div><p class=\"ko\">이것들은 우리의 <mark>수직 대 수평</mark>, 원거리 대 근거리 인식에 영향을 준다 …</p></div><div class=\"ck-via\"><i>▼</i><span>However(그러나)로 좌우 축 이야기로 넘어가요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · (B)의 근거</span><div class=\"en\">However, the left-right axis <mark>is not as relevant</mark> in nature.</div><p class=\"ko\">그러나 왼쪽-오른쪽 축은 자연에서 <mark>그만큼 중요하지 않다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>3·4번의 위아래·앞뒤·멀고 가까움 = spatial(공간적인), 5번 not as relevant(그만큼 중요하지 않은) = not significant(중요하지 않은)</span></div><div class=\"ck-step key\"><span class=\"lab\">요약문 (8번) · 짝 맞추기</span><div class=\"en\">Having affected the evolution of our <mark>spatial perception</mark>, … the left-right axis, which is <mark>not significant in nature</mark>, doesn’t come instantly to us.</div><p class=\"ko\">우리의 (A) <mark>공간적 인식</mark>의 진화에 영향을 미쳐서 … (B) <mark>자연에서 중요하지 않은</mark> 왼쪽-오른쪽 축은 즉시 이해되지 않는다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">spatial 공간적인 … significant 중요한<small>3·4번의 방향·거리 감각 → spatial(공간적인), 5번 relevant(중요한) → significant(중요한)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">spatial 공간적인 … scarce 드문</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 5번은 좌우 축이 자연에서 not as relevant(그만큼 중요하지 않다)고 했지, 드물다고 하지 않았어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">auditory 청각의 … different 다른</span><span class=\"why\">둘 다 틀려요. 지문은 소리가 아니라 위아래·앞뒤 방향 얘기이고, 5번은 좌우 축이 중요하지 않다고 했지 다르다고 하지 않았어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">cultural 문화적인 … accessible 접근하기 쉬운</span><span class=\"why\">둘 다 틀려요. 3번은 gravity(중력), evolution(진화) 같은 자연 얘기라 문화가 아니고, 접근하기 쉽다는 말도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">cultural 문화적인 … desirable 바람직한</span><span class=\"why\">둘 다 틀려요. (A)는 3번 진화에 영향 준 차원이라 문화가 아니고, (B)의 desirable(바람직한)은 5번 relevant(중요한)와 뜻이 달라요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">A young child may be puzzled</div><div class=\"k\">어린 아이는 당황할 수 있다</div></div><div class=\"rc\"><div class=\"e\">when asked to distinguish between</div><div class=\"k\">~을 구분하라고 요구 받을 때</div></div><div class=\"rc\"><div class=\"e\">the directions of right and left.</div><div class=\"k\">오른쪽과 왼쪽의 방향을.</div></div><div class=\"rnat\">어린 아이는 오른쪽과 왼쪽을 구분하라고 요구 받을 때 당황할 수 있다.</div><div class=\"rst\">체육 시간에 쌤이 “오른쪽으로 돌아!” 하면 꼭 반대로 도는 아이가 있어요. 지문도 어린아이가 좌우 구분에 당황한대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">But that same child</div><div class=\"k\">그러나 그 같은 아이는</div></div><div class=\"rc\"><div class=\"e\">may have no difficulty</div><div class=\"k\">어려움이 없을 수 있다</div></div><div class=\"rc\"><div class=\"e\">in determining the directions</div><div class=\"k\">방향을 결정하는 데에는</div></div><div class=\"rc\"><div class=\"e\">of up and down or back and front.</div><div class=\"k\">위아래 혹은 뒤와 앞의.</div></div><div class=\"rnat\">그러나 그 아이는 위아래 혹은 뒤와 앞의 방향을 결정하는 데에는 어려움이 없을 것이다.</div><div class=\"rst\">그런데 그 아이도 “위로 점프!”, “앞으로 나와!”는 한 번도 안 틀려요. 지문 말처럼 위아래·앞뒤는 쉬워요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Scientists propose that this occurs</div><div class=\"k\">과학자들은 이것(= 좌우는 헷갈리는데 위아래·앞뒤는 어렵지 않은 현상)이 일어난다고 주장한다</div></div><div class=\"rc\"><div class=\"e\">because, although we experience three dimensions,</div><div class=\"k\">~때문에, 비록 우리가 삼차원을 경험하지만,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">only two had a strong influence on our evolution</span>:</div><div class=\"k\"><span class=\"cw\">오직 두 가지만이 우리의 진화에 강한 영향을 주었기</span></div></div><div class=\"rc\"><div class=\"e\">the vertical dimension as defined by gravity</div><div class=\"k\">중력에 의해 정의되는 수직적 차원과</div></div><div class=\"rc\"><div class=\"e\">and, in mobile species,</div><div class=\"k\">그리고 이동하는 종에서</div></div><div class=\"rc\"><div class=\"e\">the front/back dimension</div><div class=\"k\">앞/뒤 차원이다</div></div><div class=\"rc\"><div class=\"e\">as defined by the positioning of sensory and feeding mechanisms.</div><div class=\"k\">감각과 먹이 섭취 메커니즘의 배치로 정의되는.</div></div><div class=\"rnat\">과학자들은 우리가 삼차원을 경험하지만 오직 두 가지만이 우리의 진화에 강한 영향을 주었기 때문에 이것이 일어난다고 주장하는데, (그것들은) 중력에 의해 정의되는 수직적 차원과 이동하는 종에서 감각과 먹이 섭취 메커니즘의 배치로 정의되는 앞/뒤 차원이다.</div><div class=\"rst\">우리 몸은 오랫동안 <b>위아래</b>(중력)와 <b>앞뒤</b>(눈·입이 앞에 있음) 두 방향만 중요하게 겪으며 진화했대요. = 지문의 과학자 설명이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">These influence</div><div class=\"k\">이것들(= 수직 차원과 앞/뒤 차원)은 영향을 준다</div></div><div class=\"rc\"><div class=\"e\">our perception of vertical versus horizontal,</div><div class=\"k\">우리의 수직 대 수평,</div></div><div class=\"rc\"><div class=\"e\">far versus close,</div><div class=\"k\">원거리 대 근거리 인식에,</div></div><div class=\"rc\"><div class=\"e\">and the search for dangers</div><div class=\"k\">그리고 위험의 탐색에</div></div><div class=\"rc\"><div class=\"e\">from above (such as an eagle)</div><div class=\"k\">(독수리 같은) 위로부터 오는</div></div><div class=\"rc\"><div class=\"e\">or below (such as a snake).</div><div class=\"k\">혹은 (뱀 같은) 아래로부터 오는.</div></div><div class=\"rnat\">이것들은 우리의 수직 대 수평, 원거리 대 근거리 인식에, 그리고 (독수리 같은) 위로부터 오는 위험 혹은 (뱀 같은) 아래로부터 오는 위험의 탐색에 영향을 준다.</div><div class=\"rst\">그래서 높고 낮음, 멀고 가까움을 잘 느끼고, 하늘의 독수리·땅의 뱀도 잘 살펴요. 지문 속 이 두 차원의 영향이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">그러나</div></div><div class=\"rc\"><div class=\"e\">the left-right axis</div><div class=\"k\">왼쪽-오른쪽 축은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is not as relevant</span></div><div class=\"k\"><span class=\"cw\">그만큼 중요하지 않다</span></div></div><div class=\"rc\"><div class=\"e\">in nature.</div><div class=\"k\">자연에서.</div></div><div class=\"rnat\">그러나 왼쪽-오른쪽 축은 자연에서 그만큼 중요하지 않다.</div><div class=\"rst\"><b>그러나</b> 좌우는 자연에서 <b>그만큼 중요하지 않았어요</b>. 이게 (B) 자리의 핵심이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">A bear is equally dangerous</div><div class=\"k\">곰은 똑같이 위험하다</div></div><div class=\"rc\"><div class=\"e\">from its left or the right side,</div><div class=\"k\">왼쪽이나 오른쪽에서,</div></div><div class=\"rc\"><div class=\"e\">but not if it is upside down.</div><div class=\"k\">하지만 위아래로 뒤집혀 있다면 그렇지 않다.</div></div><div class=\"rnat\">곰은 왼쪽이나 오른쪽에서 동일하게 위험하지만, 위아래로 뒤집혀 있다면 그렇지 않다.</div><div class=\"rst\">곰은 왼쪽에서 오든 오른쪽에서 오든 똑같이 무서워요. 지문 말처럼 좌우가 생사를 가르지 않아요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">when observing a scene</div><div class=\"k\">장면을 볼 때,</div></div><div class=\"rc\"><div class=\"e\">containing plants, animals, and man-made objects</div><div class=\"k\">식물, 동물, 그리고 사람이 만든 물체를 포함하는</div></div><div class=\"rc\"><div class=\"e\">such as cars or street signs,</div><div class=\"k\">차나 도로 표지판 같은,</div></div><div class=\"rc\"><div class=\"e\">we can only tell</div><div class=\"k\">우리는 구분할 수 있을 뿐이다</div></div><div class=\"rc\"><div class=\"e\">when left and right have been inverted</div><div class=\"k\">왼쪽과 오른쪽이 뒤집혀 있을 때를</div></div><div class=\"rc\"><div class=\"e\">if we observe those artificial items.</div><div class=\"k\">우리가 그 인공적인 물체들을 관찰한다면.</div></div><div class=\"rnat\">사실, 식물, 동물, 그리고 차나 도로 표지판 같은 사람이 만든 물체를 포함하는 장면을 볼 때, 우리가 그 인공적인 물체들을 관찰한다면 우리는 왼쪽과 오른쪽이 뒤집혀 있을 때 겨우 구분할 수 있을 뿐이다.</div><div class=\"rst\">숲 사진을 좌우로 뒤집어도 잘 몰라요. 지문처럼 자동차·표지판 같은 사람이 만든 물건을 봐야 겨우 알아채요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\">Having affected the evolution of our <span class=\"cw\">spatial perception</span>,</div><div class=\"k\">우리의 <span class=\"cw\">공간적 인식</span>의 진화에 영향을 미쳐서, ※ 문제지엔 (A) 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">vertical and front/back dimensions are easily perceived,</div><div class=\"k\">수직과 앞/뒤 차원은 쉽게 인식되지만,</div></div><div class=\"rc\"><div class=\"e\">but the left-right axis,</div><div class=\"k\">왼쪽-오른쪽 축은,</div></div><div class=\"rc ckc\"><div class=\"e\">which is <span class=\"cw\">not significant in nature</span>,</div><div class=\"k\"><span class=\"cw\">자연에서 중요하지 않은</span> ※ 문제지엔 (B) 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">doesn’t come instantly to us.</div><div class=\"k\">우리에게 즉시 이해되지 않는다.</div></div><div class=\"rnat\">우리의 (A) 공간적 인식의 진화에 영향을 미쳐서 수직과 앞/뒤 차원은 쉽게 인식되지만, 자연에서 (B) 중요하지 않은 왼쪽-오른쪽 축은 우리에게 즉시 이해되지 않는다.</div><div class=\"rst\">정리하면, 위아래·앞뒤는 <b>공간</b> 감각(spatial 공간적인)을 키워 쉽고, 자연에서 <b>중요하지 않은</b>(not significant) 좌우는 헷갈려요. = 지문 요약문이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"distinguish\" data-m=\"구별하다\"><b>distinguish</b>구별하다</button><button type=\"button\" class=\"wdb\" data-w=\"dimension\" data-m=\"차원\"><b>dimension</b>차원</button><button type=\"button\" class=\"wdb\" data-w=\"gravity\" data-m=\"중력\"><b>gravity</b>중력</button><button type=\"button\" class=\"wdb\" data-w=\"perception\" data-m=\"인지, 지각\"><b>perception</b>인지, 지각</button><button type=\"button\" class=\"wdb\" data-w=\"relevant\" data-m=\"관련 있는, 중요한\"><b>relevant</b>관련 있는, 중요한</button><button type=\"button\" class=\"wdb\" data-w=\"invert\" data-m=\"뒤집다\"><b>invert</b>뒤집다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기 순서는 <b>장면이 이어지는 고리</b>를 잡으세요. 안부 질문 → <b>대답</b>(C) → 가게를 나감 → <b>주차장</b>(B) → 건넨 카드 → <b>카드를 읽음</b>(D) 순이에요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 (A) 끝</span><div class=\"en\">When it was the woman’s turn to pay, the cashier greeted her by name and <mark>asked her</mark> how she was doing.</div><p class=\"ko\">그 여자가 계산할 차례가 되었을 때, 계산원이 이름을 부르며 인사했고, 어떻게 지냈는지 <mark>그녀에게 물었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>“어떻게 지내세요?” 질문에 대한 대답이 바로 와요</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리</span><div class=\"en\">The woman looked down, shook her head and said, “<mark>Not so good.</mark> My husband just lost his job.</div><p class=\"ko\">그 여자는 아래를 내려다보고 머리를 흔들며 말했다, “<mark>그다지 좋지 않아요.</mark> 제 남편이 이제 막 직장을 잃었거든요.</p></div><div class=\"ck-via\"><i>▼</i><span>셰릴은 아직 아무것도 못 했고, 여자가 가게를 떠나요</span></div><div class=\"ck-step\"><span class=\"lab\">(C) 끝 · 장면 이동</span><div class=\"en\">And <mark>the woman left the store.</mark></div><p class=\"ko\">그리고 <mark>그 여자는 가게를 떠났다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>가게를 나간 여자를 → 주차장에서 다시 발견해요</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 두 번째 고리</span><div class=\"en\">As Cheryl <mark>walked into the parking lot,</mark> she spotted the woman returning her shopping cart …</div><p class=\"ko\">Cheryl이 <mark>주차장으로 걸어갔을 때,</mark> 그녀는 쇼핑카트를 반납하고 있는 그 여자를 발견했고 …</p></div><div class=\"ck-via\"><i>▼</i><span>셰릴이 건넨 물건 = 작은 카드</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝 · 다음을 예고</span><div class=\"en\">And (b) she handed her <mark>a small card.</mark></div><p class=\"ko\">그리고 (b) 그녀는 그녀에게 <mark>작은 카드를</mark> 건넸다.</p></div><div class=\"ck-via\"><i>▼</i><span>(B)에서 받은 카드를 → (D)에서 읽어요</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 세 번째 고리</span><div class=\"en\">When the woman read <mark>the card’s only two words,</mark> she began to cry.</div><p class=\"ko\">그 여자가 <mark>카드의 단 두 단어를</mark> 읽었을 때, 그녀는 울기 시작했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(C) – (B) – (D)<small>대답 → 주차장에서 카드 건넴 → 카드 읽기, 세 고리가 다 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(C)까지는 맞지만, (D)에서 카드를 읽는데 카드를 건네는 장면(B)이 아직 안 나왔어요. the card(그 카드)는 건넨 뒤에 와야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(B)는 여자가 가게를 나간 뒤 주차장 장면이에요. 그런데 (C) 8번 가게를 떠나는 장면보다 먼저 와요. 안부 질문의 대답(C)도 맨 끝으로 밀려요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">(A)의 안부 질문 바로 뒤에 the card(그 카드)를 읽어요. 아직 아무도 카드를 준 적이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">맨 앞 (D)에서 건네받지도 않은 카드를 읽어요. 안부 질문에 대한 대답(C)도 너무 늦게 나와요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A) 1번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A) Is it possible</div><div class=\"k\">(A) 가능할까</div></div><div class=\"rc\"><div class=\"e\">that two words can change</div><div class=\"k\">두 단어가 바꿀 수 있는 것이</div></div><div class=\"rc\"><div class=\"e\">someone’s day, someone’s life?</div><div class=\"k\">누군가의 하루를, 누군가의 인생을?</div></div><div class=\"rnat\">(A) 1 두 단어가 누군가의 하루를, 누군가의 인생을 바꿀 수 있는 것이 가능할까?</div><div class=\"rst\">단 두 마디 말이 누군가의 하루, 아니 인생까지 바꿀 수 있을까요? 지문은 이 질문으로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A) 2번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">What if</div><div class=\"k\">만약 ~라면 어떻게 될까</div></div><div class=\"rc\"><div class=\"e\">those same two words</div><div class=\"k\">그 똑같은 두 단어가</div></div><div class=\"rc\"><div class=\"e\">could change the world?</div><div class=\"k\">세상을 바꿀 수 있다면?</div></div><div class=\"rnat\">(A) 2 만약 그 동일한 두 단어가 세상을 바꿀 수 있다면 어떻게 될까?</div><div class=\"rst\">그 두 마디가 세상까지 바꾼다면요? 지문이 질문을 더 크게 키워요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A) 3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">Well,</div><div class=\"k\">자,</div></div><div class=\"rc\"><div class=\"e\">Cheryl Rice is on a quest</div><div class=\"k\">Cheryl Rice가 탐색 중이다</div></div><div class=\"rc\"><div class=\"e\">to find out.</div><div class=\"k\">알아내기 위해(= 두 단어가 세상을 바꿀 수 있는지).</div></div><div class=\"rnat\">(A) 3 자, Cheryl Rice가 (이를) 알아내기 위해 탐색 중이다.</div><div class=\"rst\">셰릴이라는 여자가 그 답을 찾는 중이래요. 이 이야기의 주인공은 셰릴이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A) 4번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">This quest</div><div class=\"k\">이 탐색은(= Cheryl Rice의)</div></div><div class=\"rc\"><div class=\"e\">accidentally began</div><div class=\"k\">우연히 시작되었다</div></div><div class=\"rc\"><div class=\"e\">in November, 2016</div><div class=\"k\">2016년 11월에</div></div><div class=\"rc\"><div class=\"e\">in a grocery store.</div><div class=\"k\">한 식료품 가게에서.</div></div><div class=\"rnat\">(A) 4 이 탐색은 2016년 11월에 한 식료품 가게에서 우연히 시작되었다.</div><div class=\"rst\">그 탐색은 2016년 11월, 동네 마트에서 우연히 시작됐어요. = 지문의 시간·장소예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(A) 5번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(a) She</div><div class=\"k\">(a) 그녀(= Cheryl)는</div></div><div class=\"rc\"><div class=\"e\">was standing in the checkout line</div><div class=\"k\">계산대 줄에 서 있었다</div></div><div class=\"rc\"><div class=\"e\">behind a woman</div><div class=\"k\">한 여자의 뒤에</div></div><div class=\"rc\"><div class=\"e\">who looked to be in her 60’s.</div><div class=\"k\">60대로 보이는.</div></div><div class=\"rnat\">(A) 5 (a)그녀(Cheryl)는 계산대 줄에서 60대로 보이는 한 여자의 뒤에 서 있었다.</div><div class=\"rst\">셰릴이 계산대 줄에 서 있고, 앞에 60대쯤 된 아주머니가 있어요. 그래서 <b>(a) 그녀 = 셰릴</b>이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">(A) 6번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">When it was the woman’s turn to pay,</div><div class=\"k\">그 여자가 계산할 차례가 되었을 때,</div></div><div class=\"rc\"><div class=\"e\">the cashier greeted her by name</div><div class=\"k\">계산원이 그녀(= 그 여자)의 이름을 부르며 인사했고,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">asked her</span></div><div class=\"k\"><span class=\"cw\">그녀에게 물었다</span></div></div><div class=\"rc\"><div class=\"e\
