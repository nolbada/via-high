<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>고2 미니모의고사 5회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
</style>
</head>

const WORDS={"sets": [{"id": "g2r05p2", "title": "고2 미니모의고사 5회 07–12번", "range": "07–12번", "words": [{"src": "01", "w": "peculiar", "m": "독특한, 특이한", "s": ["unusual", "이례적인"], "a": ["common", "흔한"]}, {"src": "02", "w": "strict", "m": "엄격한", "s": ["severe", "엄격한"], "a": ["loose", "느슨한"]}, {"src": "03", "w": "contaminate", "m": "오염시키다", "s": ["pollute", "오염시키다"], "a": null}, {"src": "04", "w": "ultimately", "m": "궁극적으로, 결국", "s": ["eventually", "결국"], "a": null}, {"src": "05", "w": "maintain", "m": "유지하다", "s": null, "a": ["abandon", "버리다"]}, {"src": "06", "w": "reduce", "m": "줄이다", "s": null, "a": null}, {"src": "07", "w": "appreciate", "m": "이해하다, 인정하다", "s": null, "a": null}, {"src": "08", "w": "contribute", "m": "기여하다", "s": null, "a": null}, {"src": "09", "w": "collective", "m": "집단의", "s": null, "a": ["individual", "개인의"]}, {"src": "10", "w": "nevertheless", "m": "그럼에도 불구하고", "s": ["however", "그러나"], "a": null}, {"src": "11", "w": "potential", "m": "잠재력", "s": null, "a": null}, {"src": "12", "w": "evolve", "m": "발전하다, 진화하다", "s": ["develop", "발달하다"], "a": null}, {"src": "13", "w": "characteristic", "m": "특징", "s": ["trait", "특성"], "a": null}, {"src": "14", "w": "appealing", "m": "매력적인", "s": null, "a": ["unattractive", "매력 없는"]}, {"src": "15", "w": "prevent", "m": "막다", "s": null, "a": ["cause", "일으키다"]}, {"src": "16", "w": "regulate", "m": "조절하다", "s": ["control", "조절하다"], "a": null}, {"src": "17", "w": "optimal", "m": "최적의", "s": null, "a": null}, {"src": "18", "w": "approve", "m": "승인하다, 찬성하다", "s": null, "a": ["oppose", "반대하다"]}, {"src": "19", "w": "minimize", "m": "최소화하다", "s": null, "a": ["maximize", "극대화하다"]}, {"src": "20", "w": "persist", "m": "지속되다", "s": ["continue", "계속되다"], "a": ["cease", "그치다"]}], "dist": [["shrink", "줄어들다"], ["ordinary", "평범한"], ["temporary", "일시적인"]]}]};
var D=[{"no": "07", "typ": "빈칸 추론", "src": "2023년 6월 31번", "evn": [6, 7, 8], "ev_en": "Facing increasingly strict regulation, greenhouse growers realized they had to develop new methods if they were going to maintain product quality with fewer pesticides. / In response, they shifted to a cultivation method that circulates water in closed-loop systems and grows flowers in a rock wool substrate. / The new system not only reduced the pollution released into the environment; it also increased profits by giving companies greater control over growing conditions.", "ev_ko": [[6, "점점 더 엄격해지는 규제에 직면하자, 온실 재배자들은 더 적은 농약으로 상품의 품질을 유지하려면 새로운 방법들을 개발해야만 한다는 것을 깨달았다."], [7, "이에 대응해, 그들은 폐쇄 루프 체계에서 물을 순환시키고 암면 배양판에서 꽃을 키우는 재배 방식으로 전환했다."], [8, "그 새로운 체계는 환경에 배출되는 오염을 감소시켰을 뿐만 아니라, 회사들에게 재배 조건에 대한 더 큰 통제력을 줌으로써 이익도 증가시켰다."]], "why": ["빈칸에는 <b>더 엄격한 규제가 무엇을 유발하는지<\/b>가 들어갑니다", "그 답은 3~8번의 네덜란드 꽃 산업 사례에 있습니다", "6번에서 농가들은 새로운 방법을 <b>개발해야(develop new methods)<\/b> 한다고 깨닫습니다", "7번에서 그들은 <b>shifted to a cultivation method<\/b>, 즉 새 재배 방식으로 전환합니다", "8번의 <b>The new system<\/b>은 오염을 줄이고 이익도 늘립니다", "결국 엄격한 규제가 끌어낸 것은 <b>새로운 방법 = 혁신(innovation)<\/b>입니다."], "ch": [{"n": "①", "t": "innovation", "g": "혁신", "ok": true, "e": ["6·7·8번의 new methods, a cultivation method(새 재배 방식), The new system이 모두 '혁신'이라는 한 단어로 묶입니다."]}, {"n": "②", "t": "resistance", "g": "저항", "ok": false, "e": ["규제에 <b>저항<\/b>했다는 내용이 아닙니다", "규제에 맞서 버텼다는 내용이 아니라 농가들이 <b>새 방법을 찾아냈다<\/b>는 내용입니다(6~7번)."]}, {"n": "③", "t": "fairness", "g": "공정성", "ok": false, "e": ["<b>공정성<\/b>에 관한 내용은 지문에 나오지 않습니다", "규제가 공평한지를 따지는 글이 아닙니다."]}, {"n": "④", "t": "neglect", "g": "태만, 방치", "ok": false, "e": ["규제를 <b>태만하게 넘겼다<\/b>면 8번의 오염 감소와 이익 증가를 설명할 수 없습니다", "지문의 결과와 반대입니다."]}, {"n": "⑤", "t": "unity", "g": "단합", "ok": false, "e": ["기업들이 <b>단합했다<\/b>는 내용은 없습니다", "사례의 중심은 한 산업이 재배 방식을 바꾼 것입니다."]}], "tr": ["경영 전략과 환경에 대한 연구 과정에서, Michael Porter는 기업들이 규제로부터 이익을 얻고 있는 것처럼 보인다는 독특한 패턴을 알아차렸다.", "그는 또한 더 엄격한 규제가 더 약한 규제보다 더 많은 혁신을 유발하고 있다는 것을 발견했다.", "네덜란드의 화훼 산업이 한 가지 예시를 제공한다.", "수년 동안, 네덜란드의 세계적으로 유명한 튤립과 다른 절화(꽃)를 생산하는 회사들은 비료와 농약으로 그 나라의 물과 토양을 오염시키고 있기도 했다.", "1991년에 네덜란드 정부는 2000년까지 농약 사용을 절반으로 줄이도록 고안된 정책을 채택했는데, 이는 그들이 결국 달성해 낸 목표였다.", "점점 더 엄격해지는 규제에 직면하자, 온실 재배자들은 더 적은 농약으로 상품의 품질을 유지하려면 새로운 방법들을 개발해야만 한다는 것을 깨달았다.", "이에 대응해, 그들은 폐쇄 루프 체계에서 물을 순환시키고 암면 배양판에서 꽃을 키우는 재배 방식으로 전환했다.", "그 새로운 체계는 환경에 배출되는 오염을 감소시켰을 뿐만 아니라, 회사들에게 재배 조건에 대한 더 큰 통제력을 줌으로써 이익도 증가시켰다."], "ps": [{"n": 1, "ch": [{"e": "In the course of his research", "k": "그의<span class=\"r\">(= Michael Porter의)<\/span> 연구 과정에서"}, {"e": "on business strategy and the environment,", "k": "경영 전략과 환경에 대한,"}, {"e": "Michael Porter <b>noticed<\/b>", "k": "Michael Porter는 <b>알아차렸다<\/b>"}, {"e": "a <b>peculiar<\/b> pattern:", "k": "<b>독특한<\/b> 패턴 하나를:"}, {"e": "Businesses seemed to be <b>profiting from<\/b>", "k": "기업들이 <b>~에서 이익을 얻고<\/b> 있는 것처럼 보였다"}, {"e": "regulation.", "k": "규제에서."}], "easy": "Michael Porter가 경영 전략과 환경을 연구하다가 이상한 패턴을 하나 알아챘어요. 기업들이 규제 덕분에 오히려 이익을 보는 것처럼 보였던 거예요.", "gist": "글의 출발점. 규제가 오히려 기업에 이득이 되는 것처럼 보인다는 의외의 발견을 던진다."}, {"n": 2, "ch": [{"e": "He also <b>discovered<\/b>", "k": "그는 또한 발견했다"}, {"e": "that the <b>stricter<\/b> regulations", "k": "더 <b>엄격한<\/b> 규제가"}, {"e": "were <b>prompting<\/b> more <b>innovation<\/b>", "k": "더 많은 <b>혁신<\/b>을 <b>유발하고<\/b> 있다는 것을<span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}, {"e": "than the weaker ones.", "k": "더 약한 것들<span class=\"r\">(= 규제들)<\/span>보다."}], "easy": "그는 규제가 엄격할수록 규제가 약할 때보다 혁신이 더 많이 일어난다는 것도 발견했어요.", "gist": "빈칸 문장. 엄격한 규제가 끌어내는 것이 무엇인지를 묻는 핵심 문장이고, 뒤의 사례가 그 답을 보여 준다."}, {"n": 3, "ch": [{"e": "The Dutch flower industry", "k": "네덜란드의 화훼(꽃) 산업이"}, {"e": "provides an <b>illustration<\/b>.", "k": "한 가지 <b>예시<\/b>를 제공한다."}], "easy": "네덜란드의 꽃 산업이 그 예예요.", "gist": "앞 문장의 주장을 뒷받침할 사례(네덜란드 꽃 산업)로 넘어가는 신호 문장."}, {"n": 4, "ch": [{"e": "For many years,", "k": "수년 동안,"}, {"e": "the companies producing", "k": "생산하는 회사들은"}, {"e": "Holland’s <b>world-renowned<\/b> tulips", "k": "네덜란드의 <b>세계적으로 유명한<\/b> 튤립과"}, {"e": "and other cut flowers", "k": "다른 절화(꺾어 파는 꽃)를"}, {"e": "were also <b>contaminating<\/b>", "k": "또한 <b>오염시키고<\/b> 있었다"}, {"e": "the country’s water and soil", "k": "그 나라의<span class=\"r\">(= 네덜란드의)<\/span> 물과 토양을"}, {"e": "with fertilizers and pesticides.", "k": "비료와 농약으로."}], "easy": "오랫동안 네덜란드의 유명한 튤립과 꽃 회사들은 비료와 농약으로 나라의 물과 흙을 오염시키기도 했어요.", "gist": "사례의 배경. 규제가 생기기 전 꽃 산업은 환경을 오염시키고 있었다."}, {"n": 5, "ch": [{"e": "In 1991,", "k": "1991년에,"}, {"e": "the Dutch government <b>adopted<\/b> a policy", "k": "네덜란드 정부는 정책을 <b>채택했다<\/b>"}, {"e": "designed to <b>cut<\/b> pesticide use <b>in half<\/b>", "k": "농약 사용을 <b>절반으로 줄이도록<\/b> 고안된"}, {"e": "by 2000 —", "k": "2000년까지 —"}, {"e": "a goal they ultimately achieved.", "k": "그들이 결국 달성해 낸 목표였다."}], "easy": "1991년 네덜란드 정부는 2000년까지 농약을 절반으로 줄이는 정책을 정했고, 그 목표는 결국 이루어졌어요.", "gist": "'엄격한 규제'의 구체적 내용. 정부가 농약 사용량을 절반으로 줄이라고 요구했다."}, {"n": 6, "ch": [{"e": "<b>Facing<\/b> increasingly strict regulation,", "k": "점점 더 엄격해지는 규제에 <b>직면하자<\/b>,"}, {"e": "greenhouse growers realized", "k": "온실 재배자들은 깨달았다"}, {"e": "they had to <b>develop new methods<\/b>", "k": "그들이 <b>새로운 방법들을 개발해야만<\/b> 한다는 것을"}, {"e": "if they were going to maintain product quality", "k": "상품의 품질을 유지하려면"}, {"e": "with fewer pesticides.", "k": "더 적은 농약으로."}], "easy": "규제가 점점 엄격해지자 온실 농가들은 농약을 덜 쓰면서도 품질을 지키려면 새로운 방법을 만들어야 한다는 걸 깨달았어요.", "gist": "규제에 대한 반응 ①. 농가들은 새로운 방법을 개발해야 한다고 깨닫는다. 빈칸의 '혁신' 단서."}, {"n": 7, "ch": [{"e": "<b>In response<\/b>,", "k": "이에 <b>대응해<\/b>,"}, {"e": "they shifted to a <b>cultivation<\/b> method", "k": "그들<span class=\"r\">(= 온실 재배자들)<\/span>은 <b>재배<\/b> 방식으로 전환했다"}, {"e": "that circulates water", "k": "물을 순환시키는"}, {"e": "in closed-loop systems", "k": "폐쇄 루프 체계에서"}, {"e": "and grows flowers", "k": "그리고 꽃을 키우는"}, {"e": "in a rock wool substrate.", "k": "암면 배양판에서."}], "easy": "그래서 농가들은 물을 닫힌 순환 시스템으로 돌리고, 암면 배양판에서 꽃을 키우는 방식으로 바꿨어요.", "gist": "규제에 대한 반응 ②. 실제로 새로운 재배 방식으로 바꿨다(혁신의 구체적 모습).", "link": "이에 대응해, 그들은 폐쇄 루프 체계에서 물을 순환시키고 암면 배양판에서 ersity of scientific theories", "g": "과학 이론의 다양성", "ok": false, "e": ["7번에 different problems, different fields가 나와 비슷해 보입니다", "하지만 그 문장의 핵심은 <b>이론의 다양성<\/b>이 아닙니다", "다른 분야의 과학자들도 <b>장을 마련해 준다<\/b>(set the stage)는 협력입니다."]}, {"n": "⑤", "t": "the collective nature of knowledge", "g": "지식의 집단적 속성", "ok": true, "e": ["5번의 nobody operates alone, 8번의 shared within a community가 '집단적 속성(collective)'으로 표현되었습니다."]}], "tr": ["지식의 집단적 속성을 이해하는 것은 우리가 세상을 어떻게 바라보는가에 대한 우리의 잘못된 개념을 바로잡아 줄 수 있다.", "사람들은 영웅을 사랑한다.", "개인들은 주요한 획기적 발견에 대한 공로를 인정받는다.", "Marie Curie는 마치 그녀가 방사능을 발견하기 위해 홀로 연구한 것처럼, Newton은 마치 그가 혼자 힘으로 운동의 법칙을 발견한 것처럼 간주된다.", "진실은 실제 세계에서 어느 누구도 홀로 일하지 않는다는 것이다.", "과학자들은 중요한 생각에 공헌하는 학생들과 함께하는 실험실을 가지고 있을 뿐만 아니라 유사한 연구를 하고 유사한 생각을 하는 동료들도 가지고 있으며, 그들이 없다면 과학자는 아무런 성과도 얻지 못할 것이다.", "그러고 나서, 다른 문제들에 대해, 때로는 다른 분야에서 연구하지만 그럼에도 불구하고 자신들의 발견과 생각들을 통해 장을 마련해 주는 다른 과학자들이 있다.", "일단 우리가 지식이 모두 (한 명의) 머릿속에 있지 않고, 공동체 속에서 공유된다는 것을 이해하기 시작하면, 우리의 영웅은 바뀐다.", "개인에게 초점을 맞추는 대신에, 우리는 더 큰 집단에 초점을 맞추기 시작한다."], "ps": [{"n": 1, "ch": [{"e": "<b>Appreciating<\/b>", "k": "<b>이해하는 것은<\/b>"}, {"e": "the collective nature of knowledge", "k": "지식의 집단적 속성을<span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}, {"e": "can correct", "k": "바로잡아 줄 수 있다"}, {"e": "our <b>false notions<\/b>", "k": "우리의 <b>잘못된 개념<\/b>을"}, {"e": "of how we see the world.", "k": "우리가 세상을 어떻게 바라보는가에 대한."}], "easy": "지식은 여럿이 함께 만든다는 걸 알면, 세상을 잘못 보던 생각을 바로잡을 수 있어요.", "gist": "빈칸 문장이자 글의 주제. 뒤 문장들이 이 빈칸의 내용을 풀어 준다."}, {"n": 2, "ch": [{"e": "People love heroes.", "k": "사람들은 영웅을 사랑한다."}], "easy": "사람들은 영웅을 좋아해요.", "gist": "'잘못된 개념'의 시작. 사람들은 영웅 한 명에게 눈길을 준다."}, {"n": 3, "ch": [{"e": "Individuals are given <b>credit for<\/b>", "k": "개인들은 ~에 대한 <b>공로를 인정받는다<\/b>"}, {"e": "major <b>breakthroughs<\/b>.", "k": "주요한 <b>획기적 발견<\/b>에 대한."}], "easy": "큰 발견은 한 개인의 공으로 돌려져요.", "gist": "영웅 중심 시각 ①. 큰 발견의 공을 개인에게 돌린다."}, {"n": 4, "ch": [{"e": "Marie Curie is treated", "k": "Marie Curie는 간주된다"}, {"e": "<b>as if<\/b> she worked alone", "k": "마치 그녀<sp aits<\/b>(성격 특성)가 나오고, (A)의 <b>These traits<\/b>가 그 특성을 가리키므로 그다음은 (A)입니다", "(A)는 <b>For example<\/b>로 자영업 부모의 예를 듭니다", "(C)는 그 부모의 영향을 이어받아 부모의 독립성을 목격한 경험을 풀고, <b>Similarly<\/b>로 비슷한 예를 하나 더합니다", "그래서 (C)가 마지막입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)를 맨 앞에 두면 <b>These traits<\/b>가 가리킬 특성이 앞에 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": true, "e": ["become one → Whether someone does or doesn't → These traits → For example(부모 예시) → 그 예를 이어 가는 (C)로 자연스럽게 이어집니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["(B)가 성격 특성으로 끝나므로 <b>These traits<\/b>가 바로 이어져야 합니다", "사이에 (C)가 끼면 가리킬 대상과 떨어집니다", "또 (C)는 부모의 독립성을 목격한다는 구체적인 이야기인데, 부모 이야기는 (A)의 <b>For example<\/b>(자영업 부모)에서 먼저 나옵니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C)가 맨 앞이면 주어진 글에서 곧바로 부모의 독립성 이야기로 건너뜁니다", "또 (A)의 <b>These traits<\/b>가 가리킬 특성이 (B)에 있는데 (B)가 뒤에 옵니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(C)가 맨 앞이면 주어진 글에서 곧바로 부모의 독립성 이야기로 건너뜁니다", "또 (C)의 부모 이야기는 (A)의 <b>For example<\/b>(자영업 부모) 뒤에 이어져야 자연스럽습니다."]}], "tr": ["연구들은 기업가가 되도록 '타고난' 사람은 없으며, 누구든지 기업가가 될 잠재력을 가지고 있다는 것을 보여 준다.", "(A) 이러한 특성들은 시간이 흐르면서 드러나고 개인의 사회적 배경으로부터 발달한다.", "(A) 예를 들어, 자영업을 하는 부모를 가진 사람들은 기업가가 될 가능성이 더 높다.", "(B) 어떤 사람이 그렇게 하는지 그렇게 하지 않는지(기업가가 되느냐 되지 않느냐)는 환경, 인생 경험, 그리고 개인의 선택의 작용이다(상호 작용으로 결정된다).", "(B) 하지만, 기업가와 흔히 연관되어 있는 성격 특성과 특징이 있다.", "(C) 직장에서의 아버지나 어머니의 독립성을 목격한 후에, 개인은 독립을 매력적이라고 생각하게 될 가능성이 더 높다.", "(C) 마찬가지로, 개인적으로 기업가를 아는 사람들은 기업가 지인이나 롤 모델이 없는 사람들보다 새로운 회사를 시작하는 것에 관여할 가능성이 두 배 이상 높다."], "ps": [{"n": 1, "ch": [{"e": "Studies show", "k": "연구들은 보여 준다"}, {"e": "that <b>no one<\/b> is “born” to be an <b>entrepreneur<\/b>", "k": "기업가가 되도록 ‘타고난’ 사람은 <b>없다<\/b>는 것을"}, {"e": "and that everyone has the <b>potential<\/b>", "k": "그리고 누구나 <b>잠재력<\/b>을 가지고 있다는 것을"}, {"e": "to become one.", "k": "기업가가<span class=\"r\">(= an entrepreneur)<\/span> 될."}], "easy": "연구에 따르면 기업가로 타고나는 사람은 없고, 누구나 기업가가 될 가능성은 고 생각할."}], "easy": "직장에서 독립적으로 일하는 부모님을 본 사람은 독립을 멋지다고 느낄 가능성이 더 높아요.", "gist": "(C)의 첫 문장. (A)의 '자영업 부모' 예시를 이어 가며 부모의 영향을 더 자세히 풀어 준다."}, {"n": 7, "ch": [{"e": "<b>Similarly<\/b>,", "k": "<b>마찬가지로<\/b>,"}, {"e": "people who personally know an entrepreneur", "k": "개인적으로 기업가를 아는 사람들은"}, {"e": "are more than twice as likely", "k": "가능성이 두 배 이상 높다"}, {"e": "to be involved in starting a new firm", "k": "새로운 회사를 시작하는 데 관여할"}, {"e": "as those with no entrepreneur acquaintances or role models.", "k": "기업가 지인이나 롤 모델이 없는 사람들보다."}], "easy": "마찬가지로 아는 기업가가 있는 사람은 그런 지인이나 롤 모델이 없는 사람보다 창업에 뛰어들 가능성이 두 배 넘게 높아요.", "gist": "(C)의 마지막 문장. Similarly로 또 하나의 비슷한 예(기업가를 아는 사람)를 더한다.", "link": "마찬가지로, 개인적으로 기업가를 아는 사람들은 기업가 지인이나 롤 모델이 없는 사람들보다 새로운 회사를 시작하는 데 관여할 가능성이 두 배 이상 높다."}]}, {"no": "10", "typ": "무관한 문장", "src": "2018년 3월 35번", "evn": [1, 4], "ev_en": "In addition to controlling temperatures when handling fresh produce, control of the atmosphere is important. / ③ Though living things emit carbon dioxide when they breathe, carbon dioxide is widely considered to be a pollutant.", "ev_ko": [[1, "신선한 농산물을 취급할 때 온도를 조절하는 것뿐만 아니라 공기의 관리가 중요하다."], [4, "③ 비록 생명체는 (그들이) 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다."]], "why": ["무관한 문장 문제는 <b>첫 문장이 정한 화제<\/b>에서 벗어난 문장을 찾습니다", "1번이 정한 화제는 신선 농산물을 다룰 때의 <b>공기 관리<\/b>입니다", "①②④⑤는 습기·기체 농도·에틸렌 가스·공기 순환으로 모두 저장 중 공기 관리 이야기입니다", "반면 ③은 생명체가 내뿜는 이산화탄소가 <b>오염 물질<\/b>이라는 일반적인 진술입니다", "저장이나 품질 관리와 이어지지 않으므로 ③이 흐름과 관계없습니다."], "ch": [{"n": "①", "t": "Some moisture is needed in the air to prevent dehydration during storage, but too much moisture can encourage growth of molds.", "g": "저장하는 동안 탈수를 막기 위해 공기 중에 약간의 습기가 필요하지만, 과도한 습기는 곰팡이의 증식을 조장할 수 있다.", "ok": false, "e": ["저장 중 <b>습기 조절<\/b> 이야기로, 1번의 공기 관리를 바로 이어받습니다."]}, {"n": "②", "t": "Some commercial storage units have controlled atmospheres, with the levels of both carbon dioxide and moisture being regulated carefully.", "g": "일부 상업 저장 시설들은 이산화탄소와 습기 두 가지 모두의 수준이 조심스럽게 조절되는 공기 농도 조절 장치들을 갖고 있다.", "ok": false, "e": ["실제 저장 시설이 이산화탄소와 습기 <b>농도를 조절하는 예<\/b>입니다", "화제 안에 있습니다."]}, {"n": "③", "t": "Though living things emit carbon dioxide when they breathe, carbon dioxide is widely considered to be a pollutant.", "g": "비록 생명체는 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다.", "ok": true, "e": ["이산화탄소를 <b>오염 물질<\/b>이라고 하는 일반 진술입니다", "농산물 저장이나 품질과 연결되지 않아 흐름에서 벗어납니다."]}, {"n": "④", "t": "Sometimes other gases, such as ethylene gas, may be introduced at controlled levels to help achieve optimal quality of bananas and other fresh produce.", "g": "바나나나 다른 신선한 농산물의 최상의 품질을 달성하는 것을 돕기 위해, 때때로 에틸렌 가스 같은 다른 기체들이 조절된 수준에서 투입될 수 있다.", "ok": false, "e": ["이산화탄소 말고 <b>다른 기체(에틸렌)<\/b>를 조절해 넣어 농산물의 <b>최상의 품질<\/b>을 얻는다는 내용입니다", "화제에 맞습니다."]}, {"n": "⑤", "t": "Related to the control of gases and moisture is the need for some circulation of air among the stored foods.", "g": "저장된 식품들 사이에 약간의 공기 순환이 필요하다는 점은 기체와 습기의 조절과 관련이 있다.", "ok": false, "e": ["<b>Related to the control of gases and moisture<\/b>로 앞 내용을 명시적으로 받아 공기 순환으로 이어 갑니다."]}], "tr": ["신선한 농산물을 취급할 때 온도를 조절하는 것뿐만 아니라 공기의 관리가 중요하다.", "① 저장하는 동안 탈수를 막기 위해서 공기 중에 약간의 습기가 필요하지만, 과도한 습기는 곰팡이의 증식을 조장할 수 있다.", "② 일부 상업 저장 시설들은 이산화탄소와 습기 두 가지 모두의 수준이 조심스럽게 조절되는 공기 농도 조절 장치들을 갖고 있다.", "③ 비록 생명체는 (그들이) 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다.", "④ 바나나나 다른 신선한 농산물의 최상의 품질을 달성하는 것을 돕기 위해서 때때로 에틸렌 가스 같은 다른 기체들이 조절된 수준에서 투입될 수 있다.", "⑤ 저장된 식품들 사이에 약간의 공기 순환의 필요성은 기체와 습기의 조절과 관련이 있다."], "ps": [{"n": 1, "ch": [{"e": "<b>In addition to<\/b> controlling temperatures", "k": "온도를 조절하는 것<b>뿐만 아니라<\/b>"}, {"e": "when handling fresh produce,", "k": "신선한 농산물을 취급할 때,"}, {"e": "control of the atmosphere is important.", "k": "공기의 관리가 중요하다."}], "easy": "신선한 농산물을 다룰 때는 온도 조절만큼 공기 관리도 중요해요.", "gist": "글의 화제. 이 글은 농산물 저장 중 '공기 관리'를 이야기한다. 무관한 문장은 이 화제에서 벗어난 문장이다."}, {"n": 2, "ch": [{"e": "① Some <b>moisture<\/b> is needed in the air", "k": "① 공기 중에 약간의 <b>습기<\/b>가 필요하다"}, {"e": "to prevent <b>dehydration<\/b> during storage,", "k": "저장하는 동안 <b>탈수<\/b>를 막기         const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function sHtml(s,evn){
  const ev=evn.indexOf(s.n)>=0;
  let x=`<div class="s${ev?' ev':''}"><div class="sn"><span class="lb">문장 ${s.n}</span>${ev?'<span class="lb ev">정답 근거</span>':''}</div>`;
  s.ch.forEach(c=>{x+=`<div class="ch"><div class="ce">${c.e}</div><div class="ck">${c.k}</div></div>`;});
  const lays=[];
  if(s.link)lays.push(['이어 읽으면',s.link]);
  if(s.easy)lays.push(['쉬운 말로',s.easy]);
  if(s.gist)lays.push(['결국 이 얘기',s.gist]);
  lays.forEach(l=>{x+=`<div class="lay"><span class="lb">${l[0]}</span>${l[1]}</div>`;});
  if(lays.length)x+=`<button class="stg" data-names="${lays.map(l=>l[0]).join('|')}">${lays[0][0]}</button>`;
  return x+'</div>';
}
function qHtml(i,a){
  const d=D[i],ok=isRight(i,a);
  let h=`<details class="qd" ${ok?'':'open'}><summary>${esc(d.no)}번 · ${esc(d.typ)}<small>${esc(d.src)}</small><span class="res2 ${ok?'o':'x'}">${ok?'○ 정답':'✕ 오답'}</span></summary><div class="qx">`;
  h+=`<p class="ansline"><b>정답 ${ansText(i)}</b>${ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>'}</p>`;
  h+='<h4>정답 근거</h4>';
  h+=`<p class="en">${esc(d.ev_en)}</p>`;
  h+='<ul class="kolist">'+d.ev_ko.map(p=>`<li><span class="n">${p[0]}번</span>${p[1]}</li>`).join('')+'</ul>';
  h+='<div class="why">'+d.why.map(s=>`<p>${s}</p>`).join('')+'</div>';
  if(d.ps&&d.ps.length){
    h+=`<details class="dk"><summary>지문 직독직해</summary><div class="dkbody"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>`+d.ps.map(s=>sHtml(s,d.evn)).join('')+`</div></details>`;
  }
  h+='<h4>선택지 하나씩</h4>';
  d.ch.forEach(c=>{
    h+=`<div class="c ${c.ok?'ok':''}"><div class="ct"><span class="tg">${c.ok?'정답':'오답'}</span>${esc(c.n)} ${esc(c.t)}${c.g?` <span class="r">(${esc(c.g)})</span>`:''}</div>`+c.e.map(s=>`<p>${s}</p>`).join('')+'</div>';
  });
  if(!(d.ps&&d.ps.length))h+='<h4>지문 해석</h4><ol>'+d.tr.map(t=>`<li>${t}</li>`).join('')+'</ol>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+'<div class="wrap">';
  h+=`<div class="score">${rec.s} <small>/ ${N}</small></div><h2>빠른 정답</h2><div class="quick">`;
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+=`<div>${esc(D[i].no)}) 정답: <b>${ansText(i)}</b> ${ok?'<b class="o">○</b>':'<b class="x">✕</b> <span class="sub">(내 답 '+CIRC[rec.a[i]-1]+')</span>'}</div>`;}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  if(ch){ch.classList.toggle('open');return;}
  const st=e.target.closest('.stg');
  if(st){
    const s=st.closest('.s'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
