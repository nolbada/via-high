<!doctype html>

<head>

<title>고2 미니모의고사 5회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}

.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}

.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}

/* ---- 새 직독직해·해설 화면 ---- */

.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}

.sc .lay{border-radius:10px}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});

ersity of scientific theories", "g": "과학 이론의 다양성", "ok": false, "e": ["7번에 different problems, different fields가 나와 비슷해 보입니다", "하지만 그 문장의 핵심은 <b>이론의 다양성<\/b>이 아닙니다", "다른 분야의 과학자들도 <b>장을 마련해 준다<\/b>(set the stage)는 협력입니다."]}, {"n": "⑤", "t": "the collective nature of knowledge", "g": "지식의 집단적 속성", "ok": true, "e": ["5번의 nobody operates alone, 8번의 shared within a community가 '집단적 속성(collective)'으로 표현되었습니다."]}], "tr": ["지식의 집단적 속성을 이해하는 것은 우리가 세상을 어떻게 바라보는가에 대한 우리의 잘못된 개념을 바로잡아 줄 수 있다.", "사람들은 영웅을 사랑한다.", "개인들은 주요한 획기적 발견에 대한 공로를 인정받는다.", "Marie Curie는 마치 그녀가 방사능을 발견하기 위해 홀로 연구한 것처럼, Newton은 마치 그가 혼자 힘으로 운동의 법칙을 발견한 것처럼 간주된다.", "진실은 실제 세계에서 어느 누구도 홀로 일하지 않는다는 것이다.", "과학자들은 중요한 생각에 공헌하는 학생들과 함께하는 실험실을 가지고 있을 뿐만 아니라 유사한 연구를 하고 유사한 생각을 하는 동료들도 가지고 있으며, 그들이 없다면 과학자는 아무런 성과도 얻지 못할 것이다.", "그러고 나서, 다른 문제들에 대해, 때로는 다른 분야에서 연구하지만 그럼에도 불구하고 자신들의 발견과 생각들을 통해 장을 마련해 주는 다른 과학자들이 있다.", "일단 우리가 지식이 모두 (한 명의) 머릿속에 있지 않고, 공동체 속에서 공유된다는 것을 이해하기 시작하면, 우리의 영웅은 바뀐다.", "개인에게 초점을 맞추는 대신에, 우리는 더 큰 집단에 초점을 맞추기 시작한다."], "ps": [{"n": 1, "ch": [{"e": "<b>Appreciating<\/b>", "k": "<b>이해하는 것은<\/b>"}, {"e": "the collective nature of knowledge", "k": "지식의 집단적 속성을<span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}, {"e": "can correct", "k": "바로잡아 줄 수 있다"}, {"e": "our <b>false notions<\/b>", "k": "우리의 <b>잘못된 개념<\/b>을"}, {"e": "of how we see the world.", "k": "우리가 세상을 어떻게 바라보는가에 대한."}], "easy": "지식은 여럿이 함께 만든다는 걸 알면, 세상을 잘못 보던 생각을 바로잡을 수 있어요.", "gist": "빈칸 문장이자 글의 주제. 뒤 문장들이 이 빈칸의 내용을 풀어 준다."}, {"n": 2, "ch": [{"e": "People love heroes.", "k": "사람들은 영웅을 사랑한다."}], "easy": "사람들은 영웅을 좋아해요.", "gist": "'잘못된 개념'의 시작. 사람들은 영웅 한 명에게 눈길을 준다."}, {"n": 3, "ch": [{"e": "Individuals are given <b>credit for<\/b>", "k": "개인들은 ~에 대한 <b>공로를 인정받는다<\/b>"}, {"e": "major <b>breakthroughs<\/b>.", "k": "주요한 <b>획기적 발견<\/b>에 대한."}], "easy": "큰 발견은 한 개인의 공으로 돌려져요.", "gist": "영웅 중심 시각 ①. 큰 발견의 공을 개인에게 돌린다."}, {"n": 4, "ch": [{"e": "Marie Curie is treated", "k": "Marie Curie는 간주된다"}, {"e": "<b>as if<\/b> she worked alone", "k": "마치 그녀<sp ."}, {"n": 8, "ch": [{"e": "<b>Once<\/b> we start understanding", "k": "일단 우리가 이해하기 시작하면"}, {"e": "that knowledge isn’t all in the head,", "k": "지식이 모두 (한 명의) 머릿속에 있지 않고,"}, {"e": "that it’s <b>shared<\/b> within a community,", "k": "그것<span class=\"r\">(= 지식)<\/span>이 공동체 속에서 <b>공유된다는<\/b> 것을,"}, {"e": "our heroes change.", "k": "우리의 영웅은 바뀐다."}], "easy": "지식이 한 사람 머릿속에만 있는 게 아니라 공동체 안에서 나눠진다는 걸 이해하면, 우리가 생각하는 영웅도 달라져요.", "gist": "빈칸의 정답 단서. shared within a community(공동체 속에서 공유됨) = 지식의 집단적 속성."}, {"n": 9, "ch": [{"e": "<b>Instead of<\/b> focusing on the individual,", "k": "개인에게 초점을 맞추는 <b>대신에<\/b>,"}, {"e": "we begin to focus", "k": "우리는 초점을 맞추기 시작한다"}, {"e": "on a larger group.", "k": "더 큰 집단에."}], "easy": "한 개인 대신 더 큰 집단을 바라보게 돼요.", "gist": "결론. 개인에서 집단으로 시선이 옮겨 간다. 그래서 빈칸은 the collective nature of knowledge."}]}, {"no": "09", "typ": "글의 순서", "src": "2018년 3월 36번", "evn": [4, 5, 2, 3, 6], "ev_en": "(B) Whether someone does or doesn't is a function of environment, life experiences, and personal choices. / However, there are personality traits and characteristics commonly associated with entrepreneurs. / (A) These traits are developed over time and evolve from an individual's social context. / For example, people with parents who were self-employed are more likely to become entrepreneurs. / (C) After witnessing a father's or mother's independence in the workplace, an individual is more likely to find independence appealing.", "ev_ko": [[4, "(B) 어떤 사람이 그렇게 하는지 그렇게 하지 않는지(기업가가 되느냐 되지 않느냐)는 환경, 인생 경험, 그리고 개인의 선택의 작용이다(상호 작용으로 결정된다)."], [5, "(B) 하지만, 기업가와 흔히 연관되어 있는 성격 특성과 특징이 있다."], [2, "(A) 이러한 특성들은 시간이 흐르면서 발달하고 개인의 사회적 배경으로부터 진화한다."], [3, "(A) 예를 들어, 자영업을 하는 부모를 가진 사람들은 기업가가 될 가능성이 더 높다."], [6, "(C) 직장에서의 아버지나 어머니의 독립성을 목격한 후에, 개인은 독립을 매력적이라고 생각하게 될 가능성이 더 높다."]], "why": ["순서 문제는 <b>지시어와 연결어<\/b>를 따라가면 됩니다", "주어진 글 끝에 <b>become one<\/b>(기업가가 되다)이 나옵니다", "(B)의 <b>Whether someone does or doesn't<\/b>는 이 '되느냐 되지 않느냐'를 받으므로 <b>(B)가 먼저<\/b>입니다", "(B) 끝에 <b>personality traits<\/b>(성격 특성)가 나오고, (A)의 <b>These traits<\/b>가 그 특성을 가리키므로 그다음은 (A)입니다", "(A)는 <b>For example<\/b>로 자영업 부모의 예를 듭니다", "(C)는 그 부모의 영향을 이어받아 부모의 독립성을 목격한 경험을 풀고, <b>Similarly<\/b>로 비슷한 예를 하나 더합니다", "그래서 (C)가 마지막입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)를 맨 앞에 두면 <b>These traits<\/b>가 가리킬 특성이 앞에 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": true, "e": ["become one → Whether someone does or doesn't → These traits → For example(부모 예시) → 그 예를 이어 가는 (C)로 자연스럽게 이어집니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["(B)가 성격 특성으로 끝나므로 <b>These traits<\/b>가 바로 이어져야 합니다", "사이에 (C)가 끼면 가리킬 대상과 떨어집니다", "또 (C)는 부모의 독립성을 목격한다는 구체적인 이야기인데, 부모 이야기는 (A)의 <b>For example<\/b>(자영업 부모)에서 먼저 나옵니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C)가 맨 앞이면 주어진 글에서 곧바로 부모의 독립성 이야기로 건너뜁니다", "또 (A)의 <b>These traits<\/b>가 가리킬 특성이 (B)에 있는데 (B)가 뒤에 옵니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(C)가 맨 앞이면 주어진 글에서 곧바로 부모의 독립성 이야기로 건너뜁니다", "또 (C)의 부모 이야기는 (A)의 <b>For example<\/b>(자영업 부모) 뒤에 이어져야 자연스럽습니다."]}], "tr": ["연구들은 기업가가 되도록 '타고난' 사람은 없으며, 누구든지 기업가가 될 잠재력을 가지고 있다는 것을 보여 준다.", "(A) 이러한 특성들은 시간이 흐르면서 발달하고 개인의 사회적 배경으로부터 진화한다.", "(A) 예를 들어, 자영업을 하는 부모를 가진 사람들은 기업가가 될 가능성이 더 높다.", "(B) 어떤 사람이 그렇게 하는지 그렇게 하지 않는지(기업가가 되느냐 되지 않느냐)는 환경, 인생 경험, 그리고 개인의 선택의 작용이다(상호 작용으로 결정된다).", "(B) 하지만, 기업가와 흔히 연관되어 있는 성격 특성과 특징이 있다.", "(C) 직장에서의 아버지나 어머니의 독립성을 목격한 후에, 개인은 독립을 매력적이라고 생각하게 될 가능성이 더 높다.", "(C) 마찬가지로, 개인적으로 기업가를 아는 사람들은 기업가 지인이나 롤 모델이 없는 사람들보다 새로운 회사를 시작하는 것에 관여할 가능성이 두 배 이상 높다."], "ps": [{"n": 1, "ch": [{"e": "Studies show", "k": "연구들은 보여 준다"}, {"e": "that <b>no one<\/b> is “born” to be an <b>entrepreneur<\/b>", "k": "기업가가 되도록 ‘타고난’ 사람은 <b>없다<\/b>는 것을"}, {"e": "and that everyone has the <b>potential<\/b>", "k": "그리고 누구나 <b>잠재력<\/b>을 가지고 있다는 것을"}, {"e": "to become one.", "k": "기업가가<span class=\"r\">(= an entrepreneur)<\/span> 될."}], "easy": "연구에 따르면 기업가로 타고나는 사람은 없고, 누구나 기업가가 될 가능성은 고 생각할."}], "easy": "직장에서 독립적으로 일하는 부모님을 본 사람은 독립을 멋지다고 느낄 가능성이 더 높아요.", "gist": "(C)의 첫 문장. (A)의 '자영업 부모' 예시를 이어 가며 부모의 영향을 더 자세히 풀어 준다."}, {"n": 7, "ch": [{"e": "<b>Similarly<\/b>,", "k": "<b>마찬가지로<\/b>,"}, {"e": "people who personally know an entrepreneur", "k": "개인적으로 기업가를 아는 사람들은"}, {"e": "are more than twice as likely", "k": "가능성이 두 배 이상 높다"}, {"e": "to be involved in starting a new firm", "k": "새로운 회사를 시작하는 데 관여할"}, {"e": "as those with no entrepreneur acquaintances or role models.", "k": "기업가 지인이나 롤 모델이 없는 사람들보다."}], "easy": "마찬가지로 아는 기업가가 있는 사람은 그런 지인이나 롤 모델이 없는 사람보다 창업에 뛰어들 가능성이 두 배 넘게 높아요.", "gist": "(C)의 마지막 문장. Similarly로 또 하나의 비슷한 예(기업가를 아는 사람)를 더한다.", "link": "마찬가지로, 개인적으로 기업가를 아는 사람들은 기업가 지인이나 롤 모델이 없는 사람들보다 새로운 회사를 시작하는 데 관여할 가능성이 두 배 이상 높다."}]}, {"no": "10", "typ": "무관한 문장", "src": "2018년 3월 35번", "evn": [1, 4], "ev_en": "In addition to controlling temperatures when handling fresh produce, control of the atmosphere is important. / ③ Though living things emit carbon dioxide when they breathe, carbon dioxide is widely considered to be a pollutant.", "ev_ko": [[1, "신선한 농산물을 취급할 때 온도를 조절하는 것뿐만 아니라 공기의 관리가 중요하다."], [4, "③ 비록 생명체는 (그들이) 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다."]], "why": ["무관한 문장 문제는 <b>첫 문장이 정한 화제<\/b>에서 벗어난 문장을 찾습니다", "1번이 정한 화제는 신선 농산물을 다룰 때의 <b>공기 관리<\/b>입니다", "①②④⑤는 습기·기체 농도·에틸렌 가스·공기 순환으로 모두 저장 중 공기 관리 이야기입니다", "반면 ③은 생명체가 내뿜는 이산화탄소가 <b>오염 물질<\/b>이라는 일반적인 진술입니다", "저장이나 품질 관리와 이어지지 않으므로 ③이 흐름과 관계없습니다."], "ch": [{"n": "①", "t": "Some moisture is needed in the air to prevent dehydration during storage, but too much moisture can encourage growth of molds.", "g": "저장하는 동안 탈수를 막기 위해 공기 중에 약간의 습기가 필요하지만, 과도한 습기는 곰팡이의 증식을 조장할 수 있다.", "ok": false, "e": ["저장 중 <b>습기 조절<\/b> 이야기로, 1번의 공기 관리를 바로 이어받습니다."]}, {"n": "②", "t": "Some commercial storage units have controlled atmospheres, with the levels of both carbon dioxide and moisture being regulated carefully.", "g": "일부 상업 저장 시설들은 이산화탄소와 습기 두 가지 모두의 수준이 조심스럽게 조절되는 공기 농도 조절 장치들을 갖고 있다.", "ok": false, "e": ["실제 저장 시설이 이산화탄소와 습기 <b>농도를 조절하는 예<\/b>입니다", "화제 안에 있습니다."]}, {"n": "③", "t": "Though living things emit carbon dioxide when they breathe, carbon dioxide is widely considered to be a pollutant.", "g": "비록 생명체는 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다.", "ok": true, "e": ["이산화탄소를 <b>오염 물질<\/b>이라고 하는 일반 진술입니다", "농산물 저장이나 품질과 연결되지 않아 흐름에서 벗어납니다."]}, {"n": "④", "t": "Sometimes other gases, such as ethylene gas, may be introduced at controlled levels to help achieve optimal quality of bananas and other fresh produce.", "g": "바나나나 다른 신선한 농산물의 최상의 품질을 달성하는 것을 돕기 위해, 때때로 에틸렌 가스 같은 다른 기체들이 조절된 수준에서 투입될 수 있다.", "ok": false, "e": ["이산화탄소 말고 <b>다른 기체(에틸렌)<\/b>를 조절해 넣어 농산물의 <b>최상의 품질<\/b>을 얻는다는 내용입니다", "화제에 맞습니다."]}, {"n": "⑤", "t": "Related to the control of gases and moisture is the need for some circulation of air among the stored foods.", "g": "저장된 식품들 사이에 약간의 공기 순환이 필요하다는 점은 기체와 습기의 조절과 관련이 있다.", "ok": false, "e": ["<b>Related to the control of gases and moisture<\/b>로 앞 내용을 명시적으로 받아 공기 순환으로 이어 갑니다."]}], "tr": ["신선한 농산물을 취급할 때 온도를 조절하는 것뿐만 아니라 공기의 관리가 중요하다.", "① 저장하는 동안 탈수를 막기 위해서 공기 중에 약간의 습기가 필요하지만, 과도한 습기는 곰팡이의 증식을 조장할 수 있다.", "② 일부 상업 저장 시설들은 이산화탄소와 습기 두 가지 모두의 수준이 조심스럽게 조절되는 공기 농도 조절 장치들을 갖고 있다.", "③ 비록 생명체는 (그들이) 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다.", "④ 바나나나 다른 신선한 농산물의 최상의 품질을 달성하는 것을 돕기 위해서 때때로 에틸렌 가스 같은 다른 기체들이 조절된 수준에서 투입될 수 있다.", "⑤ 저장된 식품들 사이에 약간의 공기 순환의 필요성은 기체와 습기의 조절과 관련이 있다."], "ps": [{"n": 1, "ch": [{"e": "<b>In addition to<\/b> controlling temperatures", "k": "온도를 조절하는 것<b>뿐만 아니라<\/b>"}, {"e": "when handling fresh produce,", "k": "신선한 농산물을 취급할 때,"}, {"e": "control of the atmosphere is important.", "k": "공기의 관리가 중요하다."}], "easy": "신선한 농산물을 다룰 때는 온도 조절만큼 공기 관리도 중요해요.", "gist": "글의 화제. 이 글은 농산물 저장 중 '공기 관리'를 이야기한다. 무관한 문장은 이 화제에서 벗어난 문장이다."}, {"n": 2, "ch": [{"e": "① Some <b>moisture<\/b> is needed in the air", "k": "① 공기 중에 약간의 <b>습기<\/b>가 필요하다"}, {"e": "to prevent <b>dehydration<\/b> during storage,", "k": "저장하는 동안 <b>탈수<\/b>를 막기 function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

nat": "일부 상업용 저장 설비는 이산화탄소와 수분 농도를 세심하게 조절하는 공기 조절 장치를 갖추고 있다.", "ana": "<b>with + 명사 + being p.p.</b>는 '~가 …된 채로'인 <b>부대상황</b>입니다. being이 보이면 그 앞 명사가 <b>의미상 주어</b>이고, 뒤의 분사와 <b>수동 관계</b>라는 뜻입니다. 이 with 덩어리 전체가 부사 역할이므로, 문장의 진짜 동사는 앞의 <b>have</b> 하나입니다. <b>both A and B</b>는 the levels를 꾸미는 말이라 농도가 두 가지임을 알려 줍니다.", "pe": "Some \u0001commercial\u0002<sup>1</sup> storage units<sup>2</sup> have controlled atmospheres<sup>3</sup>, / \u0001with the levels of both carbon dioxide<sup>4</sup> and moisture\u0002 / \u0001being regulated<sup>5</sup> carefully\u0002.", "pk": "일부 \u0001상업용\u0002 저장 설비는 조절된 공기를 갖추고 있다 / \u0001이산화탄소와 수분 양쪽의 농도가\u0002 / \u0001세심하게 조절된 채로\u0002", "core": "일부 저장 설비는 조절된 공기를 갖추고 있다.", "tags": ["주어 storage units. 동사 <b>have</b>가 진짜 동사 하나", "<b>with + 명사</b>: ~가 …된 채로 (부대상황). 이 명사가 의미상 주어", "<b>being p.p.</b>: 명사와 수동 관계. with 덩어리 전체가 부사 역할"]}, {"i": "07", "q": "10", "s": "6", "title": "보어 도치 — 분사구가 문두로 나간 문장", "eng": "Related to<sup>1</sup> the control of gases and moisture / is the need for some circulation<sup>2</sup> of air / among the stored<sup>3</sup> foods.", "notes": [["1", "be related to", "~와 관련되다"], ["2", "circulation", "순환"], ["3", "stored food", "저장된 식품"]], "lit": "기체와 수분의 조절과 관련된 것은 / 공기 순환의 필요성이다 / 저장된 식품들 사이의", "nat": "기체와 수분 조절과 맞물려 있는 것이, 저장된 식품 사이로 공기가 어느 정도 순환되어야 한다는 점이다.", "ana": "<b>보어가 문두로 나간 도치</b>입니다. 원래 어순은 <b>The need for some circulation of air is related to the control of gases and moisture</b>입니다. Related를 동사로 착각하면 주어를 찾지 못합니다 — <b>진짜 주어는 is 뒤의 the need</b>입니다. 문장이 <b>과거분사로 시작하고 곧바로 be동사</b>가 나오면 도치를 의심하세요. <b>among</b>은 셋 이상 사이를 뜻합니다.", "pe": "Related to<sup>1</sup> the control of gases and moisture / is the need for some circulation<sup>2</sup> of air / \u0001among the stored<sup>3</sup> foods\u0002.", "pk": "기체와 수분의 조절과 관련된 것은 / 공기 순환의 필요성이다 / \u0001저장된 식품들 사이의\u0002", "core": "공기 순환의 필요성이 기체와 수분의 조절과 관련되어 있다.", "tags": ["<b>보어 도치</b>: 과거분사 Related to가 문두로 나감. 동사로 착각하지 않기", "진짜 주어는 is 뒤의 <b>the need</b>", "among = 셋 이상 사이. 공기 순환이 일어나는 곳"]}, {"i": "08", "q": "11", "s": "3", "title": "과거분사 involved의 후치 수식 + 관계사 that", "eng": "The scenarios<sup>1</sup> involved in<sup>2</sup> the surveys / varied<sup>3</sup> in the number of pedestrian<sup>4</sup> and passenger<sup>5</sup> lives / that could be saved, / among other factors<sup>6</sup>.", "notes": [["1", "scenario", "시나리오, 상황"], ["2", "involved in", "~에 포함된"], ["3", "vary in", "~에서 서로 다르다"], ["4", "pedestrian", "보행자"], ["5", "passenger", "승객"], ["6", "factor", "요인"]], "lit": "그 설문에 포함된 시나리오들은 / 보행자와 승객의 생명 수에서 서로 달랐다 / 구할 수 있는 / 여러 요인 중에서도", "nat": "설문에 포함된 상황들은 여러 요인 가운데서도 특히 구할 수 있는 보행자와 승객의 목숨 수에서 서로 달랐다.", "ana": "<b>involved</b>는 동사가 아니라 앞의 <b>The scenarios</b>를 꾸미는 <b>과거분사</b>입니다(= which were involved). 이것을 동사로 보면 뒤의 varied가 갈 곳이 없어집니다 — <b>진짜 동사는 varied</b>입니다. <b>vary in A</b>는 'A에서 서로 다르다'입니다. 맨 뒤 <b>that could be saved</b>는 lives를 꾸미는 관계사절이고, <b>among other factors</b>는 '여러 요인 중에서도'라는 삽입 표현입니다.", "pe": "The scenarios<sup>1</sup> \u0001involved in<sup>2</sup> the surveys\u0002 / varied<sup>3</sup> in the number of pedestrian<sup>4</sup> and passenger<sup>5</sup> lives / \u0001that could be saved\u0002, / \u0001among other factors<sup>6</sup>\u0002.", "pk": "\u0001그 설문에 포함된\u0002 시나리오들은 / 보행자와 승객의 생명 수에서 서로 달랐다 / \u0001구할 수 있는\u0002 / \u0001여러 요인 중에서도\u0002", "core": "시나리오들은 보행자와 승객의 생명 수에서 서로 달랐다.", "tags": ["주어 scenarios. <b>과거분사 involved</b>가 뒤에서 꾸밈 (동사 아님)", "진짜 동사 <b>varied</b>. vary in A = A에서 서로 다르다", "<b>관계절 that</b>: lives를 꾸밈", "삽입 표현: 여러 요인 중에서도"]}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2023년 6월 31번", "ans": "①", "tr": [["1", "경영 전략과 환경을 연구하던 과정에서 Michael Porter는 독특한 패턴 하나를 발견했다. 기업들이 규제에서 오히려 이익을 얻고 있는 것처럼 보였던 것이다."], ["2", "그는 또한 더 엄격한 규제가 느슨한 규제보다 더 많은 혁신을 이끌어 내고 있다는 것도 알아냈다."], ["3", "네덜란드의 화훼 산업이 그 실례를 보여 준다."], ["4", "여러 해 동안, 네덜란드의 세계적으로 유명한 튤립과 절화를 생산하던 회사들은 비료와 살충제로 그 나라의 물과 토양을 오염시키고 있기도 했다."], ["5", "1991년 네덜란드 정부는 2000년까지 살충제 사용량을 절반으로 줄이겠다는 정책을 채택했고, 그 목표는 결국 이루어졌다."], ["6", "점점 엄격해지는 규제에 부딪히자, 온실 재배 농가들은 살충제를 덜 쓰면서도 제품의 질을 유지하려면 새로운 방법을 개발해야 한다는 것을 깨달았다."], ["7", "그에 대응해 그들은 순환식 폐쇄 시스템으로 물을 돌리고 암면 배양판에서 꽃을 키우는 재배 방식으로 전환했다."], ["8", "그 새 시스템은 환경으로 배출되는 오염을 줄였을 뿐 아니라, 재배 조건을 더 정밀하게 통제할 수 있게 해 주어 이익까지 늘려 주었다."]], "evh": "6 · 7 · 8번 문장", "ev": [{"en": true, "h": "Facing increasingly strict regulation, greenhouse growers realized they had to develop new methods ... / In response, they shifted to a cultivation method that circulates water in closed-loop systems ... / The new system not only reduced the pollution ...; it also increased profits ..."}, {"en": false, "h": "빈칸이 앞쪽에 있으면 <b>뒤의 사례</b>가 빈칸을 설명합니다. 6번의 <b>develop new methods</b>, 7번의 <b>shifted to a cultivation method</b>, 8번의 <b>The new system</b>이 모두 같은 말을 반복합니다. 즉 엄격한 규제가 끌어낸 것은 <b>새로운 방법 = 혁신</b>입니다. 1번의 profiting from regulation도 그 결과입니다."}], "opts": [{"n": "①", "t": "innovation", "a": true, "x": false, "trap": false, "e": "6·7·8번의 new methods, new cultivation method, The new system이 전부 innovation 한 단어로 묶입니다."}, {"n": "②", "t": "resistance", "a": false, "x": true, "trap": true, "e": "규제에 <b>저항</b>했다는 내용이 아닙니다. 농가들은 반발한 것이 아니라 <b>새 방법을 찾아냈습니다</b>."}, {"n": "③", "t": "fairness", "a": false, "x": true, "trap": false, "e": "공정성은 지문에 등장하지 않습니다. 규제의 형평성을 따지는 글이 아닙니다."}, {"n": "④", "t": "neglect", "a": false, "x": true, "trap": false, "e": "방치했다면 오염이 줄고 이익이 늘었다는 8번을 설명할 수 없습니다. 결과와 어긋납니다."}, {"n": "⑤", "t": "unity", "a": false, "x": true, "trap": false, "e": "기업들이 <b>뭉쳤다</b>는 이야기는 없습니다. 사례는 한 산업의 기술 전환입니다."}], "w": [["in the course of", "~하는 과정에서"], ["peculiar", "독특한, 특이한"], ["profit from", "~에서 이익을 얻다"], ["regulation", "규제"], ["prompt", "촉발하다, 유발하다"], ["contaminate", "오염시키다"], ["adopt a policy", "정책을 채택하다"], ["cut ~ in half", "~을 절반으로 줄이다"], ["cultivation method", "재배 방식"], ["release", "배출하다"]]}, {"q": "08", "type": "빈칸 추론", "src": "2018년 6월 34번", "ans": "⑤", "tr": [["1", "지식의 집단적 성격을 이해하는 것은, 우리가 세상을 보는 방식에 대한 잘못된 생각을 바로잡아 줄 수 있다."], ["2", "사람들은 영웅을 좋아한다."], ["3", "주요한 발견에 대해서는 개인에게 공이 돌아간다."], ["4", "Marie Curie는 마치 혼자 힘으로 방사능을 발견한 것처럼, Newton은 마치 혼자서 운동 법칙을 알아낸 것처럼 이야기된다."], ["5", "사실은 현실 세계에서 혼자 일하는 사람은 아무도 없다는 것이다."], ["6", "과학자들은 중요한 아이디어를 내놓는 학생들이 있는 연구실을 가졌을 뿐 아니라, 비슷한 연구를 하고 비슷한 생각을 하는 동료들도 두고 있는데, 그들이 없으면 그 과학자는 아무 성과도 내지 못한다."], ["7", "게다가 다른 문제를, 때로는 다른 분야에서 연구하면서도 자기 발견과 아이디어로 여건을 마련해 주는 또 다른 과학자들이 있다."], ["8", "지식이 머릿속에만 있는 것이 아니라 공동체 안에서 공유된다는 것을 이해하기 시작하면, 우리의 영웅상은 달라진다."], ["9", "개인에게 초점을 맞추는 대신 우리는 더 큰 집단에 초점을 맞추기 시작한다."]], "evh": "5 · 8 · 9번 문장", "ev": [{"en": true, "h": "The truth is that in the real world, nobody operates alone. / Once we start understanding that knowledge isn't all in the head, that it's shared within a community, our heroes change. / Instead of focusing on the individual, we begin to focus on a larger group."}, {"en": false, "h": "빈칸이 <b>첫 문장</b>에 있으면 <b>글 전체가 반복하는 말</b>을 넣어야 합니다. 5번의 <b>nobody operates alone</b>, 8번의 <b>shared within a community</b>, 9번의 <b>a larger group</b>이 계속 같은 방향을 가리킵니다. 즉 빈칸은 <b>지식이 여럿이 함께 만드는 것</b>이라는 뜻이어야 합니다."}], "opts": [{"n": "①", "t": "the process of trial and error", "a": false, "x": true, "trap": false, "e": "시행착오라는 말은 나오지 않습니다. 지문은 <b>혼자냐 여럿이냐</b>를 따집니다."}, {"n": "②", "t": "the changeable patterns of nature", "a": false, "x": true, "trap": false, "e": "자연의 변화 양상에 관한 글이 아닙니다. laws of motion, radioactivity는 <b>예시로 든 발견</b>일 뿐입니다."}, {"n": "③", "t": "the academic superiority of scholars", "a": false, "x": true, "trap": false, "e": "학자들이 <b>더 뛰어나다</b>는 우열 이야기가 아닙니다. 오히려 개인 영웅화를 <b>경계</b>합니다."}, {"n": "④", "t": "the diversity of scientific theories", "a": false, "x": true, "trap": true, "e": "7번에 different problems, different fields가 나와 눈에 걸립니다. 그러나 그 문장의 핵심은 다양성이 아니라 <b>서로 여건을 마련해 준다</b>는 협력입니다."}, {"n": "⑤", "t": "the collective nature of knowledge", "a": true, "x": false, "trap": false, "e": "5번의 nobody operates alone, 8번의 shared within a community를 한 마디로 묶은 표현입니다."}], "w": [["appreciate", "이해하다, 인정하다"], ["false notion", "잘못된 생각"], ["be given credit for", "~에 대해 공을 인정받다"], ["breakthrough", "획기적 발견"], ["as if", "마치 ~인 것처럼"], ["operate alone", "혼자 일하다"], ["contribute", "기여하다"], ["get nowhere", "아무 성과도 못 내다"], ["set the stage", "여건을 마련하다"], ["collective", "집단의"]]}, {"q": "09", "type": "글의 순서", "src": "2018년 3월 36번", "ans": "②", "tr": [["1", "연구에 따르면 누구도 기업가로 태어나는 것은 아니며, 누구나 기업가가 될 잠재력을 지니고 있다."], ["2", "(B) 어떤 사람이 실제로 기업가가 되느냐 마느냐는 환경, 인생 경험, 개인적 선택에 따라 결정된다."], ["3", "(B) 그러나 기업가에게 흔히 나타나는 성격 특성과 특징들이 있다."], ["4", "(A) 이런 특성들은 시간이 지나며 발달하고 개인의 사회적 맥락에서 형성된다."], ["5", "(A) 예를 들어 부모가 자영업을 하던 사람은 기업가가 될 가능성이 더 높다."], ["6", "(C) 아버지나 어머니가 일터에서 독립적으로 일하는 모습을 본 사람은 그런 독립을 매력적으로 느낄 가능성이 더 높다."], ["7", "(C) 마찬가지로, 기업가를 개인적으로 아는 사람은 그런 지인이나 역할 모델이 없는 사람보다 창업에 뛰어들 가능성이 두 배 이상 높다."]], "evh": "(B) 첫 문장 · (A) 첫 문장 · (C) 첫 문장", "ev": [{"en": true, "h": "Whether someone does or doesn't is a function of environment ... However, there are personality traits and characteristics commonly associated with entrepreneurs. / These traits are developed over time ... / After witnessing a father's or mother's independence in the workplace ..."}, {"en": false, "h": "순서 문제는 <b>지시어</b>만 따라가면 됩니다. (B)의 <b>Whether someone does or doesn't</b>는 주어진 글의 become one을 받으므로 <b>(B)가 먼저</b>입니다. (A)의 <b>These traits</b>는 (B) 끝의 personality traits and characteristics를 받으므로 그다음입니다. (C)의 <b>a father's or mother's</b>는 (A) 끝의 parents who were self-employed을 받으므로 마지막입니다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)를 맨 앞에 두면 <b>These traits</b>가 가리킬 특성이 앞에 없습니다. 지시어가 허공에 뜹니다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": true, "x": false, "trap": false, "e": "become one → Whether someone does → These traits → parents/father·mother로 지시어가 한 줄로 이어집니다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": false, "x": true, "trap": true, "e": "(B) 다음에 (C)가 오면 <b>a father's or mother's</b>가 받을 부모 이야기가 아직 나오지 않았습니다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": false, "e": "(C)의 witnessing이 무엇을 본 것인지 앞에서 설명되지 않습니다. 또 (B)의 However가 뒤집을 앞 내용도 사라집니다."}, {"n" ered to be a pollutant.", "a": true, "x": false, "trap": false, "e": "이산화탄소를 <b>오염 물질</b>로 규정하는 일반 진술로, 농산물 저장·품질과 연결되지 않습니다."}, {"n": "④", "t": "Sometimes other gases, such as ethylene gas, may be introduced at controlled levels to help achieve optimal quality of bananas and other fresh produce.", "a": false, "x": true, "trap": true, "e": "other gases라는 표현이 ②의 기체 조절을 이어받고, 목적도 <b>최적 품질</b>이라 화제에 정확히 맞습니다."}, {"n": "⑤", "t": "Related to the control of gases and moisture is the need for some circulation of air among the stored foods.", "a": false, "x": true, "trap": false, "e": "<b>Related to the control of gases and moisture</b>로 앞 내용을 명시적으로 받아 마무리합니다."}], "w": [["in addition to", "~에 더하여"], ["fresh produce", "신선 농산물"], ["atmosphere", "대기, 공기"], ["dehydration", "탈수"], ["mold", "곰팡이"], ["regulate", "조절하다"], ["emit", "내뿜다"], ["pollutant", "오염 물질"], ["optimal quality", "최적의 품질"], ["circulation", "순환"]]}, {"q": "11", "type": "장문 · 글의 제목", "src": "2017년 9월 41번", "ans": "⑤", "tr": [["1", "Science에 실린 새 연구는, 사람들이 대체로 보행자를 구하기 위해 승객을 희생하도록 프로그램된 자율주행차를 승인하면서도, 정작 자신은 그런 차를 타는 데는 열의가 없다는 것을 보여 준다."], ["2", "2015년에 실시된 미국 거주자 대상 여섯 차례의 온라인 설문에서 연구자들은 참가자들에게 자율주행차가 어떻게 행동하기를 원하는지 물었다."], ["3", "설문에 포함된 상황들은 여러 요인 가운데서도 특히 구할 수 있는 보행자와 승객의 목숨 수에서 서로 달랐다."], ["4", "예를 들어 참가자들은 자율주행차가 보행자 10명을 죽이기보다 승객 한 명을 희생시키는 것이 더 도덕적인지 질문받았다."], ["5", "설문 참가자들은 자율주행차가 공리적으로, 즉 보행자의 피해를 최소화하도록 프로그램되어야 한다고 답했는데, 이는 차 안에 있는 운전자와 승객의 안전보다 바깥에 있는 사람들의 안전을 앞세우는 입장이다."], ["6", "그러나 같은 응답자들은 자신과 자기 승객을 지켜 주는 차를 사고 싶다고 말했으며, 가족이 함께 탄 경우에는 특히 그러했다."], ["7", "이는 자기 보호형 자율주행차와 공리형 자율주행차가 모두 시판된다면, 다른 사람들은 후자를 타기를 바라면서도 정작 자신이 그것을 타려는 사람은 거의 없으리라는 것을 시사한다."], ["8", "개인의 이익과 공공의 이익 사이의 윤리적 긴장을 보여 주는 이 비일관성은, 분석된 다양한 설문 상황 전반에서 지속적으로 나타났다."]], "evh": "1 · 5 · 6번 문장", "ev": [{"en": true, "h": "... people generally approve of driverless ... cars programmed to sacrifice their passengers in order to save pedestrians, but these same people are not enthusiastic about riding in such autonomous vehicles themselves   h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  if(ch){ch.classList.toggle('open');return;}
  const st=e.target.closest('.stg');
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
