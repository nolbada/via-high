var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>앞쪽(2번)</b>에 있으면 <b>뒤의 사례</b>가 빈칸을 풀어 줘요. 엄격한 규제(regulation) 뒤에 줄줄이 나오는 <b>new</b>(새로운)라는 말을 따라가세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (2번)</span><div class=\"en\">He also discovered that <mark>the stricter regulations</mark> were prompting more <span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> than the weaker ones.</div><p class=\"ko\"><mark>더 엄격한 규제</mark>가 더 약한 규제보다 더 많은 ( ? )을 유발하고 있었다</p></div><div class=\"ck-via\"><i>▼</i><span>“엄격한 규제”가 실제로 무엇을 낳았는지 보여 주는 장면</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">Facing increasingly strict regulation, greenhouse growers realized they had to <mark>develop new methods</mark> …</div><p class=\"ko\">점점 더 엄격해지는 규제에 직면하자, 온실 재배자들은 <mark>새로운 방법들을 개발해야만</mark> 한다는 것을 깨달았다.</p></div><div class=\"ck-via\"><i>▼</i><span>new methods(새로운 방법) = 물을 순환시키는 새 재배 방식</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 새 방법의 정체</span><div class=\"en\">In response, they <mark>shifted to a cultivation method</mark> that circulates water in closed-loop systems …</div><p class=\"ko\">이에 대응해, 그들은 폐쇄 루프 체계에서 물을 순환시키는 <mark>재배 방식으로 전환했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>새 체계로 오염은 줄고 이익은 늘어남 = 1번의 “규제로 이익”</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 결과</span><div class=\"en\"><mark>The new system</mark> not only reduced the pollution … it also increased profits …</div><p class=\"ko\"><mark>그 새로운 체계는</mark> 오염을 줄였을 뿐만 아니라 … 이익도 늘렸다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">innovation 혁신<small>6번 new methods(새로운 방법)·7번 shifted(전환했다)·8번 new system(새 체계)이 모두 혁신이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">resistance 저항</span><span class=\"why\">규제엔 반발이 떠오르기 쉬운 함정이에요. 하지만 6·7번의 재배자들은 맞서지 않고 shifted to(~로 전환했다), 새 방식으로 바꿨어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">fairness 공정함</span><span class=\"why\">공정한지 따지는 장면이 없어요. 6~8번은 모두 새 방법을 만들어 낸 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">neglect 방치, 소홀</span><span class=\"why\">방치했다면 오염이 그대로였겠죠. 8번은 오염이 줄고 이익이 늘었다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">unity 단결</span><span class=\"why\">업계가 뭉쳤다는 말은 없어요. 7번은 힘을 합친 게 아니라 재배 방식을 새로 바꾼 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In the course of his research</div><div class=\"k\">그의(= Michael Porter의) 연구 과정에서</div></div><div class=\"rc\"><div class=\"e\">on business strategy and the environment,</div><div class=\"k\">경영 전략과 환경에 대한,</div></div><div class=\"rc\"><div class=\"e\">Michael Porter noticed</div><div class=\"k\">Michael Porter는 알아차렸다</div></div><div class=\"rc\"><div class=\"e\">a peculiar pattern:</div><div class=\"k\">독특한 패턴 하나를:</div></div><div class=\"rc\"><div class=\"e\">Businesses seemed to be profiting from</div><div class=\"k\">기업들이 ~에서 이익을 얻고 있는 것처럼 보였다</div></div><div class=\"rc\"><div class=\"e\">regulation.</div><div class=\"k\">규제에서.</div></div><div class=\"rnat\">경영 전략과 환경에 대한 연구 과정에서, Michael Porter는 기업들이 규제로부터 이익을 얻고 있는 것처럼 보인다는 독특한 패턴을 알아차렸다.</div><div class=\"rst\">교장 선생님이 텃밭 동아리에 규칙을 세게 정했는데, 이상하게 동아리가 더 잘 됐어요. = 지문 1번, 기업이 규제(regulation)로 이익을 얻는 독특한 패턴이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">He also discovered</div><div class=\"k\">그는 또한 발견했다</div></div><div class=\"rc\"><div class=\"e\">that the stricter regulations</div><div class=\"k\">더 엄격한 규제가</div></div><div class=\"rc ckc\"><div class=\"e\">were prompting more <span class=\"cw\">innovation</span></div><div class=\"k\">더 많은 <span class=\"cw\">혁신을</span> 유발하고 있다는 것을※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">than the weaker ones.</div><div class=\"k\">더 약한 것들(= 규제들)보다.</div></div><div class=\"rnat\">그는 또한 더 엄격한 규제가 더 약한 규제보다 더 많은 혁신을 유발하고 있다는 것을 발견했다.</div><div class=\"rst\">알고 보니 <b>규칙이 엄격할수록</b> 새 아이디어가 더 많이 나왔어요. = 지문 2번 빈칸 문장, 엄격한 규제가 혁신을 더 끌어냈다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The Dutch flower industry</div><div class=\"k\">네덜란드의 화훼(꽃) 산업이</div></div><div class=\"rc\"><div class=\"e\">provides an illustration.</div><div class=\"k\">한 가지 예시를 제공한다.</div></div><div class=\"rnat\">네덜란드의 화훼 산업이 한 가지 예시를 제공한다.</div><div class=\"rst\">그 예로 우리 학교 텃밭 동아리 얘기를 들어 볼게요. = 지문 3번, 네덜란드 꽃 산업이 그 예시예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">For many years,</div><div class=\"k\">수년 동안,</div></div><div class=\"rc\"><div class=\"e\">the companies producing</div><div class=\"k\">생산하는 회사들은</div></div><div class=\"rc\"><div class=\"e\">Holland’s world-renowned tulips</div><div class=\"k\">네덜란드의 세계적으로 유명한 튤립과</div></div><div class=\"rc\"><div class=\"e\">and other cut flowers</div><div class=\"k\">다른 절화(꺾어 파는 꽃)를</div></div><div class=\"rc\"><div class=\"e\">were also contaminating</div><div class=\"k\">또한 오염시키고 있었다</div></div><div class=\"rc\"><div class=\"e\">the country’s water and soil</div><div class=\"k\">그 나라의(= 네덜란드의) 물과 토양을</div></div><div class=\"rc\"><div class=\"e\">with fertilizers and pesticides.</div><div class=\"k\">비료와 농약으로.</div></div><div class=\"rnat\">수년 동안, 네덜란드의 세계적으로 유명한 튤립과 다른 절화(꽃)를 생산하는 회사들은 비료와 농약으로 그 나라의 물과 토양을 오염시키고 있기도 했다.</div><div class=\"rst\">동아리는 상추를 잘 키웠지만, 약과 비료를 많이 뿌려 흙과 물이 더러워졌어요. = 지문 4번, 꽃 회사들이 물과 토양을 오염시켰어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In 1991,</div><div class=\"k\">1991년에,</div></div><div class=\"rc\"><div class=\"e\">the Dutch government adopted a policy</div><div class=\"k\">네덜란드 정부는 정책을 채택했다</div></div><div class=\"rc\"><div class=\"e\">designed to cut pesticide use in half</div><div class=\"k\">농약 사용을 절반으로 줄이도록 고안된</div></div><div class=\"rc\"><div class=\"e\">by 2000 —</div><div class=\"k\">2000년까지 —</div></div><div class=\"rc\"><div class=\"e\">a goal they ultimately achieved.</div><div class=\"k\">그들이 결국 달성해 낸 목표였다.</div></div><div class=\"rnat\">1991년에 네덜란드 정부는 2000년까지 농약 사용을 절반으로 줄이도록 고안된 정책을 채택했는데, 이는 그들이 결국 달성해 낸 목표였다.</div><div class=\"rst\">학교가 “약은 절반만 써라” 규칙을 정했고, 동아리는 결국 해냈어요. = 지문 5번, 정부가 농약 절반 줄이기를 정하고 달성했어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Facing increasingly strict regulation,</div><div class=\"k\">점점 더 엄격해지는 규제에 직면하자,</div></div><div class=\"rc\"><div class=\"e\">greenhouse growers realized</div><div class=\"k\">온실 재배자들은 깨달았다</div></div><div class=\"rc ckc\"><div class=\"e\">they had to <span class=\"cw\">develop new methods</span></div><div class=\"k\">그들이 <span class=\"cw\">새로운 방법들을 개발해야만</span> 한다는 것을</div></div><div class=\"rc\"><div class=\"e\">if they were going to maintain product quality</div><div class=\"k\">상품의 품질을 유지하려면</div></div><div class=\"rc\"><div class=\"e\">with fewer pesticides.</div><div class=\"k\">더 적은 농약으로.</div></div><div class=\"rnat\">점점 더 엄격해지는 규제에 직면하자, 온실 재배자들은 더 적은 농약으로 상품의 품질을 유지하려면 새로운 방법들을 개발해야만 한다는 것을 깨달았다.</div><div class=\"rst\">규칙이 점점 세지자 “약을 덜 쓰고도 잘 키우려면 <b>새 방법</b>이 필요해” 하고 깨달았어요. = 지문 6번의 develop new methods(새로운 방법을 개발하다).</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">In response,</div><div class=\"k\">이에 대응해,</div></div><div class=\"rc ckc\"><div class=\"e\">they <span class=\"cw\">shifted to a cultivation method</span></div><div class=\"k\">그들(= 온실 재배자들)은 <span class=\"cw\">재배 방식으로 전환했다</span></div></div><div class=\"rc\"><div class=\"e\">that circulates water</div><div class=\"k\">물을 순환시키는</div></div><div class=\"rc\"><div class=\"e\">in closed-loop systems</div><div class=\"k\">폐쇄 루프 체계에서</div></div><div class=\"rc\"><div class=\"e\">and grows flowers</div><div class=\"k\">그리고 꽃을 키우는</div></div><div class=\"rc\"><div class=\"e\">in a rock wool substrate.</div><div class=\"k\">암면 배양판에서.</div></div><div class=\"rnat\">이에 대응해, 그들은 폐쇄 루프 체계에서 물을 순환시키고 암면 배양판에서 꽃을 키우는 재배 방식으로 전환했다.</div><div class=\"rst\">그래서 물을 버리지 않고 빙빙 돌려 쓰는 화분으로 <b>바꿨어요</b>. = 지문 7번, 새 재배 방식으로 전환했다(shifted to)는 말이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The new system</span></div><div class=\"k\"><span class=\"cw\">그 새로운 체계는</span></div></div><div class=\"rc\"><div class=\"e\">not only reduced the pollution</div><div class=\"k\">오염을 줄였을 뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">released into the environment;</div><div class=\"k\">환경으로 배출되는;</div></div><div class=\"rc\"><div class=\"e\">it also increased profits</div><div class=\"k\">그것(= 새로운 체계)은 또한 이익을 늘렸다</div></div><div class=\"rc\"><div class=\"e\">by giving companies</div><div class=\"k\">회사들에게 줌으로써</div></div><div class=\"rc\"><div class=\"e\">greater control over growing conditions.</div><div class=\"k\">재배 조건에 대한 더 큰 통제력을.</div></div><div class=\"rnat\">그 새로운 체계는 환경에 배출되는 오염을 감소시켰을 뿐만 아니라, 회사들에게 재배 조건에 대한 더 큰 통제력을 줌으로써 이익도 증가시켰다.</div><div class=\"rst\">새 화분 덕분에 흙도 깨끗해지고 상추가 잘 자라 동아리 수익도 늘었어요. 이렇게 새로 바꾼 것 = 빈칸 innovation(혁신)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"regulation\" data-m=\"규제\"><b>regulation</b>규제</button><button type=\"button\" class=\"wdb\" data-w=\"peculiar\" data-m=\"독특한, 특이한\"><b>peculiar</b>독특한, 특이한</button><button type=\"button\" class=\"wdb\" data-w=\"prompt\" data-m=\"촉발하다, 유발하다\"><b>prompt</b>촉발하다, 유발하다</button><button type=\"button\" class=\"wdb\" data-w=\"pesticide\" data-m=\"농약\"><b>pesticide</b>농약</button><button type=\"button\" class=\"wdb\" data-w=\"cultivation\" data-m=\"재배\"><b>cultivation</b>재배</button><button type=\"button\" class=\"wdb\" data-w=\"release\" data-m=\"배출하다\"><b>release</b>배출하다</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>첫 문장</b>에 있으면 글 전체가 되풀이하는 말이 답이에요. “영웅 한 명” 이야기 뒤에 나오는 <b>The truth is</b>(진실은) 이후의 말을 모으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">Appreciating <span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> can correct our false notions of how we see the world.</div><p class=\"ko\">( ? )을 이해하는 것은 세상을 보는 우리의 잘못된 개념을 바로잡아 줄 수 있다</p></div><div class=\"ck-via\"><i>▼</i><span>2~4번의 “혼자 해낸 영웅”이 잘못된 개념임을 뒤집음</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 진실 등장</span><div class=\"en\">The truth is that in the real world, <mark>nobody operates alone</mark>.</div><p class=\"ko\">진실은 실제 세계에서 <mark>어느 누구도 홀로 일하지 않는다</mark>는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>지식(knowledge)이 누구의 것인지 직접 말해 줌</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">Once we start understanding that knowledge isn’t all in the head, that it’s <mark>shared within a community</mark>, our heroes change.</div><p class=\"ko\">지식이 모두 한 사람 머릿속에 있지 않고 <mark>공동체 속에서 공유된다</mark>는 것을 이해하기 시작하면, 우리의 영웅은 바뀐다.</p></div><div class=\"ck-via\"><i>▼</i><span>초점이 개인 → 더 큰 집단으로</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 결론</span><div class=\"en\">Instead of focusing on the individual, we begin to focus on <mark>a larger group</mark>.</div><p class=\"ko\">개인에게 초점을 맞추는 대신에, 우리는 <mark>더 큰 집단</mark>에 초점을 맞추기 시작한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">the collective nature of knowledge 지식의 집단적 속성<small>5·8·9번이 모두 “혼자가 아니라 함께”를 되풀이해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">the academic superiority of scholars 학자들의 학문적 우월성</span><span class=\"why\">2~4번의 Marie Curie(마리 퀴리)·Newton(뉴턴) 영웅 얘기만 보면 끌려요. 하지만 5번 The truth is(진실은)가 그 생각을 잘못된 개념이라고 뒤집어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">the process of trial and error 시행착오의 과정</span><span class=\"why\">실패하며 배우는 장면은 없어요. 6·7번은 실패가 아니라 학생·동료·다른 과학자의 도움 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">the changeable patterns of nature 자연의 변하기 쉬운 패턴</span><span class=\"why\">자연이 변한다는 말은 지문에 없어요. 바뀌는 건 자연이 아니라 8번의 our heroes(우리의 영웅)예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">the diversity of scientific theories 과학 이론의 다양성</span><span class=\"why\">7번의 different fields(다른 분야)만 보면 끌리지만, 글은 이론이 다양하다는 게 아니라 지식이 여럿에게 나뉘어 있다는 얘기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Appreciating</div><div class=\"k\">이해하는 것은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the collective nature of knowledge</span></div><div class=\"k\"><span class=\"cw\">지식의 집단적 속성을</span>※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">can correct</div><div class=\"k\">바로잡아 줄 수 있다</div></div><div class=\"rc\"><div class=\"e\">our false notions</div><div class=\"k\">우리의 잘못된 개념을</div></div><div class=\"rc\"><div class=\"e\">of how we see the world.</div><div class=\"k\">우리가 세상을 어떻게 바라보는가에 대한.</div></div><div class=\"rnat\">지식의 집단적 속성을 이해하는 것은 우리가 세상을 어떻게 바라보는가에 대한 우리의 잘못된 개념을 바로잡아 줄 수 있다.</div><div class=\"rst\">과학 발표대회에서 우리 조가 1등을 했어요. 지식이 <b>여럿이 함께 만드는 것</b>임을 알면 생각이 바뀐대요. = 지문 1번 빈칸 문장이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">People love heroes.</div><div class=\"k\">사람들은 영웅을 사랑한다.</div></div><div class=\"rnat\">사람들은 영웅을 사랑한다.</div><div class=\"rst\">사람들은 영웅을 좋아해요. 그래서 다들 발표한 반장만 칭찬해요. = 지문 2번, 사람들은 영웅을 사랑한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Individuals are given credit for</div><div class=\"k\">개인들은 ~에 대한 공로를 인정받는다</div></div><div class=\"rc\"><div class=\"e\">major breakthroughs.</div><div class=\"k\">주요한 획기적 발견에 대한.</div></div><div class=\"rnat\">개인들은 주요한 획기적 발견에 대한 공로를 인정받는다.</div><div class=\"rst\">상장도 박수도 반장 한 명에게만 가요. = 지문 3번, 큰 발견의 공로(credit)를 개인이 받는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Marie Curie is treated</div><div class=\"k\">Marie Curie는 간주된다</div></div><div class=\"rc\"><div class=\"e\">as if she worked alone</div><div class=\"k\">마치 그녀(= Marie Curie)가 홀로 연구한 것처럼</div></div><div class=\"rc\"><div class=\"e\">to discover radioactivity</div><div class=\"k\">방사능을 발견하기 위해</div></div><div class=\"rc\"><div class=\"e\">and Newton</div><div class=\"k\">그리고 Newton은</div></div><div class=\"rc\"><div class=\"e\">as if he discovered</div><div class=\"k\">마치 그(= Newton)가 발견한 것처럼 간주된다</div></div><div class=\"rc\"><div class=\"e\">the laws of motion by himself.</div><div class=\"k\">운동의 법칙을 혼자 힘으로.</div></div><div class=\"rnat\">Marie Curie는 마치 그녀가 방사능을 발견하기 위해 홀로 연구한 것처럼, Newton은 마치 그가 혼자 힘으로 운동의 법칙을 발견한 것처럼 간주된다.</div><div class=\"rst\">마치 반장 혼자 실험하고 알아낸 것처럼요. 지문 4번의 Marie Curie(마리 퀴리)와 Newton(뉴턴)도 혼자 해낸 것처럼 여겨져요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">The truth is that</div><div class=\"k\">진실은 ~이다</div></div><div class=\"rc\"><div class=\"e\">in the real world,</div><div class=\"k\">실제 세계에서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">nobody operates alone</span>.</div><div class=\"k\"><span class=\"cw\">어느 누구도 홀로 일하지 않는다</span>는 것.</div></div><div class=\"rnat\">진실은 실제 세계에서 어느 누구도 홀로 일하지 않는다는 것이다.</div><div class=\"rst\"><b>진실은, 누구도 혼자 하지 않는다</b>는 거예요. = 지문 5번의 nobody operates alone(아무도 혼자 일하지 않는다), 빈칸의 첫 근거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Scientists not only have labs</div><div class=\"k\">과학자들은 실험실을 가지고 있을 뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">with students who contribute critical ideas,</div><div class=\"k\">중요한 생각에 공헌하는 학생들이 있는,</div></div><div class=\"rc\"><div class=\"e\">but also have colleagues</div><div class=\"k\">동료들도 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">who are doing similar work,</div><div class=\"k\">유사한 연구를 하고 있는,</div></div><div class=\"rc\"><div class=\"e\">thinking similar thoughts,</div><div class=\"k\">유사한 생각을 하는,</div></div><div class=\"rc\"><div class=\"e\">and without whom</div><div class=\"k\">그리고 그들(= 동료들)이 없다면</div></div><div class=\"rc\"><div class=\"e\">the scientist would get nowhere.</div><div class=\"k\">그 과학자는 아무 성과도 얻지 못할 것이다.</div></div><div class=\"rnat\">과학자들은 중요한 생각에 공헌하는 학생들과 함께하는 실험실을 가지고 있을 뿐만 아니라 유사한 연구를 하고 유사한 생각을 하는 동료들도 가지고 있으며, 그들이 없다면 과학자는 아무런 성과도 얻지 못할 것이다.</div><div class=\"rst\">반장 옆엔 아이디어를 낸 조원들과 비슷한 실험을 하던 옆 조 친구들이 있었어요. 그들 없인 아무것도 못 했죠. = 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">And then there are other scientists</div><div class=\"k\">그러고 나서 다른 과학자들이 있다</div></div><div class=\"rc\"><div class=\"e\">who are working on different problems,</div><div class=\"k\">다른 문제에 대해 연구하는,</div></div><div class=\"rc\"><div class=\"e\">sometimes in different fields,</div><div class=\"k\">때로는 다른 분야에서,</div></div><div class=\"rc\"><div class=\"e\">but nevertheless set the stage</div><div class=\"k\">하지만 그럼에도 불구하고 장을 마련해 준다</div></div><div class=\"rc\"><div class=\"e\">through their own findings and ideas.</div><div class=\"k\">자신들(= 그 다른 과학자들)의 발견과 생각들을 통해.</div></div><div class=\"rnat\">그러고 나서, 다른 문제들에 대해, 때로는 다른 분야에서 연구하지만 그럼에도 불구하고 자신들의 발견과 생각들을 통해 장을 마련해 주는 다른 과학자들이 있다.</div><div class=\"rst\">게다가 작년 선배들이 남긴 다른 주제의 실험 보고서가 밑바탕이 돼 줬어요. = 지문 7번, 다른 과학자들이 장을 마련해 준다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Once we start understanding</div><div class=\"k\">일단 우리가 이해하기 시작하면</div></div><div class=\"rc\"><div class=\"e\">that knowledge isn’t all in the head,</div><div class=\"k\">지식이 모두 (한 명의) 머릿속에 있지 않고,</div></div><div class=\"rc ckc\"><div class=\"e\">that it’s <span class=\"cw\">shared within a community</span>,</div><div class=\"k\">그것(= 지식)이 <span class=\"cw\">공동체 속에서 공유된다</span>는 것을,</div></div><div class=\"rc\"><div class=\"e\">our heroes change.</div><div class=\"k\">우리의 영웅은 바뀐다.</div></div><div class=\"rnat\">일단 우리가 지식이 모두 (한 명의) 머릿속에 있지 않고, 공동체 속에서 공유된다는 것을 이해하기 시작하면, 우리의 영웅은 바뀐다.</div><div class=\"rst\">지식이 반장 머릿속에만 있지 않고 <b>모두가 나눠 가진 것</b>임을 알면 영웅이 바뀌어요. = 지문 8번의 공동체 속에서 공유된다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">Instead of focusing on the individual,</div><div class=\"k\">개인에게 초점을 맞추는 대신에,</div></div><div class=\"rc\"><div class=\"e\">we begin to focus</div><div class=\"k\">우리는 초점을 맞추기 시작한다</div></div><div class=\"rc ckc\"><div class=\"e\">on <span class=\"cw\">a larger group</span>.</div><div class=\"k\"><span class=\"cw\">더 큰 집단에</span>.</div></div><div class=\"rnat\">개인에게 초점을 맞추는 대신에, 우리는 더 큰 집단에 초점을 맞추기 시작한다.</div><div class=\"rst\">이제 반장 한 명 대신 <b>우리 조 전체</b>에 박수를 쳐요. = 지문 9번의 더 큰 집단. 그래서 빈칸은 지식의 집단적 속성이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"false notion\" data-m=\"잘못된 생각\"><b>false notion</b>잘못된 생각</button><button type=\"button\" class=\"wdb\" data-w=\"breakthrough\" data-m=\"획기적 발견\"><b>breakthrough</b>획기적 발견</button><button type=\"button\" class=\"wdb\" data-w=\"contribute\" data-m=\"기여하다\"><b>contribute</b>기여하다</button><button type=\"button\" class=\"wdb\" data-w=\"get nowhere\" data-m=\"아무 성과도 못 내다\"><b>get nowhere</b>아무 성과도 못 내다</button><button type=\"button\" class=\"wdb\" data-w=\"set the stage\" data-m=\"여건을 마련하다\"><b>set the stage</b>여건을 마련하다</button><button type=\"button\" class=\"wdb\" data-w=\"collective\" data-m=\"집단의\"><b>collective</b>집단의</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서는 <b>고리</b> 찾기예요. 대신하는 말 <b>does or doesn’t</b>(그렇게 하느냐 마느냐) → 지시어 <b>These traits</b>(이러한 특성들) → <b>예시 이어 가기</b> 순으로 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">Studies show that no one is “born” to be an entrepreneur and that everyone has the potential to <mark>become one</mark>.</div><p class=\"ko\">연구들은 기업가로 타고난 사람은 없으며 누구나 <mark>기업가가 될</mark> 잠재력을 가지고 있다는 것을 보여 준다.</p></div><div class=\"ck-via\"><i>▼</i><span>does or doesn’t(그렇게 하느냐 마느냐) = 주어진 글의 become one(기업가가 되다)</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 첫 번째 고리</span><div class=\"en\"><mark>Whether someone does or doesn’t</mark> is a function of environment, life experiences, and personal choices.</div><p class=\"ko\"><mark>어떤 사람이 그렇게 하는지 그렇게 하지 않는지는</mark> 환경, 인생 경험, 개인의 선택의 작용이다.</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만)로 “그래도 흔한 성격 특성이 있다”를 꺼내 놓음</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝 · 다음 고리 준비</span><div class=\"en\">However, there are <mark>personality traits and characteristics</mark> commonly associated with entrepreneurs.</div><p class=\"ko\">하지만, 기업가와 흔히 연관되어 있는 <mark>성격 특성과 특징</mark>이 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>These traits(이러한 특성들) = (B) 끝의 personality traits(성격 특성)</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 두 번째 고리</span><div class=\"en\"><mark>These traits</mark> are developed over time and evolve from an individual’s social context.</div><p class=\"ko\"><mark>이러한 특성들은</mark> 시간이 흐르면서 발달하고 개인의 사회적 배경으로부터 진화한다.</p></div><div class=\"ck-via\"><i>▼</i><span>(A) 끝의 self-employed(자영업을 하던) 부모 → 그 부모의 독립성</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 세 번째 고리</span><div class=\"en\">After witnessing <mark>a father’s or mother’s independence</mark> in the workplace, …</div><p class=\"ko\">직장에서의 <mark>아버지나 어머니의 독립성을</mark> 목격한 후에, …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(B) – (A) – (C)<small>become one(기업가가 되다) → These traits(이러한 특성들) → 부모 예시, 세 고리가 모두 이어져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">(B) 끝은 성격 특성 이야기라 (C)의 부모 독립성이 바로 오면 끊겨요. These traits(이러한 특성들)가 (B) 끝을 받아야 해서 (A)가 먼저예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글엔 특성 이야기가 없어서 (A)의 These traits(이러한 특성들)가 가리킬 대상이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C)의 a father’s or mother’s(아버지나 어머니의)는 (A)의 자영업 부모를 받아야 하는데, 주어진 글엔 부모가 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">(C)가 맨 앞이면 부모 이야기가 갑자기 튀어나오고, (B)의 does or doesn’t(그렇게 하느냐 마느냐)도 주어진 글과 떨어져요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Studies show</div><div class=\"k\">연구들은 보여 준다</div></div><div class=\"rc\"><div class=\"e\">that no one is “born” to be an entrepreneur</div><div class=\"k\">기업가가 되도록 ‘타고난’ 사람은 없다는 것을</div></div><div class=\"rc\"><div class=\"e\">and that everyone has the potential</div><div class=\"k\">그리고 누구나 잠재력을 가지고 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">to become one.</div><div class=\"k\">기업가가(= an entrepreneur) 될.</div></div><div class=\"rnat\">연구들은 기업가가 되도록 '타고난' 사람은 없으며, 누구든지 기업가가 될 잠재력을 가지고 있다는 것을 보여 준다.</div><div class=\"rst\">학교 축제 떡볶이 부스 “사장”은 타고나는 게 아니에요. 누구나 될 수 있어요. = 지문 주어진 글, 기업가(entrepreneur)의 잠재력은 누구에게나 있대요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">2번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A) <span class=\"cw\">These traits</span></div><div class=\"k\">(A) <span class=\"cw\">이러한 특성들은</span>(= (B) 끝의 성격 특성과 특징)</div></div><div class=\"rc\"><div class=\"e\">are developed over time</div><div class=\"k\">시간이 흐르면서 발달하고</div></div><div class=\"rc\"><div class=\"e\">and evolve from</div><div class=\"k\">~에서 진화한다</div></div><div class=\"rc\"><div class=\"e\">an individual’s social context.</div><div class=\"k\">개인의 사회적 배경으로부터.</div></div><div class=\"rnat\">(A) 이러한 특성들은 시간이 흐르면서 발달하고 개인의 사회적 배경으로부터 진화한다.</div><div class=\"rst\"><b>이러한 특성들</b>(These traits)은 갑자기 생기지 않고, 자라면서 주변 사람들 속에서 조금씩 만들어져요. = 지문 (A), 사회적 배경에서 발달한대요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">people with parents</div><div class=\"k\">부모를 가진 사람들은</div></div><div class=\"rc\"><div class=\"e\">who were self-employed</div><div class=\"k\">자영업을 하던</div></div><div class=\"rc\"><div class=\"e\">are more likely to become entrepreneurs.</div><div class=\"k\">기업가가 될 가능성이 더 높다.</div></div><div class=\"rnat\">(A) 예를 들어, 자영업을 하는 부모를 가진 사람들은 기업가가 될 가능성이 더 높다.</div><div class=\"rst\"><b>예를 들어</b>(For example) 부모님이 가게를 하시는 친구가 부스 사장을 맡을 가능성이 더 높아요. = 지문 (A), 자영업 부모를 둔 사람이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">Whether someone does or doesn’t</span></div><div class=\"k\">(B) <span class=\"cw\">어떤 사람이 그렇게 하는지 그렇게 하지 않는지는</span>(= 기업가가 되는지 되지 않는지)</div></div><div class=\"rc\"><div class=\"e\">is a function of</div><div class=\"k\">~의 작용(~에 따라 결정되는 것)이다</div></div><div class=\"rc\"><div class=\"e\">environment, life experiences, and personal choices.</div><div class=\"k\">환경, 인생 경험, 그리고 개인의 선택의.</div></div><div class=\"rnat\">(B) 어떤 사람이 그렇게 하는지 그렇게 하지 않는지(기업가가 되느냐 되지 않느냐)는 환경, 인생 경험, 그리고 개인의 선택의 작용이다(상호 작용으로 결정된다).</div><div class=\"rst\">부스 사장을 <b>하느냐 마느냐</b>는 주변 환경, 해 본 경험, 내 선택에 달렸어요. = 지문 (B), does or doesn’t(그렇게 하느냐 마느냐)는 기업가가 되느냐 마느냐예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">5번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">하지만,</div></div><div class=\"rc ckc\"><div class=\"e\">there are <span class=\"cw\">personality traits and characteristics</span></div><div class=\"k\"><span class=\"cw\">성격 특성과 특징이</span> 있다</div></div><div class=\"rc\"><div class=\"e\">commonly associated with entrepreneurs.</div><div class=\"k\">기업가와 흔히 연관되어 있는.</div></div><div class=\"rnat\">(B) 하지만, 기업가와 흔히 연관되어 있는 성격 특성과 특징이 있다.</div><div class=\"rst\"><b>하지만</b>(However) 부스 사장들에게 흔히 보이는 성격 특징도 있긴 해요. = 지문 (B) 끝, 기업가와 연관된 성격 특성이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C) After witnessing</div><div class=\"k\">(C) 목격한 후에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a father’s or mother’s independence</span></div><div class=\"k\"><span class=\"cw\">아버지나 어머니의 독립성을</span></div></div><div class=\"rc\"><div class=\"e\">in the workplace,</div><div class=\"k\">직장에서의,</div></div><div class=\"rc\"><div class=\"e\">an individual is more likely</div><div class=\"k\">개인은 ~할 가능성이 더 높다</div></div><div class=\"rc\"><div class=\"e\">to find independence appealing.</div><div class=\"k\">독립을 매력적이라고 생각할.</div></div><div class=\"rnat\">(C) 직장에서의 아버지나 어머니의 독립성을 목격한 후에, 개인은 독립을 매력적이라고 생각하게 될 가능성이 더 높다.</div><div class=\"rst\">그 친구는 엄마·아빠가 스스로 가게를 꾸리는 모습을 보고 “내 일은 내가 하는 게 멋지다”고 느껴요. = 지문 (C), 부모의 독립성을 본 뒤예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Similarly</span>,</div><div class=\"k\"><span class=\"cw\">마찬가지로</span>,</div></div><div class=\"rc\"><div class=\"e\">people who personally know an entrepreneur</div><div class=\"k\">개인적으로 기업가를 아는 사람들은</div></div><div class=\"rc\"><div class=\"e\">are more than twice as likely</div><div class=\"k\">가능성이 두 배 이상 높다</div></div><div class=\"rc\"><div class=\"e\">to be involved in starting a new firm</div><div class=\"k\">새로운 회사를 시작하는 데 관여할</div></div><div class=\"rc\"><div class=\"e\">as those with no entrepreneur acquaintances or role models.</div><div class=\"k\">기업가 지인이나 롤 모델이 없는 사람들보다.</div></div><div class=\"rnat\">(C) 마찬가지로, 개인적으로 기업가를 아는 사람들은 기업가 지인이나 롤 모델이 없는 사람들보다 새로운 회사를 시작하는 것에 관여할 가능성이 두 배 이상 높다.</div><div class=\"rst\"><b>마찬가지로</b>(Similarly) 부스 사장을 해 본 선배를 아는 친구도 직접 부스를 열 가능성이 두 배 넘게 높아요. = 지문 (C)의 기업가 지인 이야기예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"entrepreneur\" data-m=\"기업가\"><b>entrepreneur</b>기업가</button><button type=\"button\" class=\"wdb\" data-w=\"potential\" data-m=\"잠재력\"><b>potential</b>잠재력</button><button type=\"button\" class=\"wdb\" data-w=\"a function of\" data-m=\"~에 따라 결정되는 것\"><b>a function of</b>~에 따라 결정되는 것</button><button type=\"button\" class=\"wdb\" data-w=\"personality trait\" data-m=\"성격 특성\"><b>personality trait</b>성격 특성</button><button type=\"button\" class=\"wdb\" data-w=\"self-employed\" data-m=\"자영업의\"><b>self-employed</b>자영업의</button><button type=\"button\" class=\"wdb\" data-w=\"acquaintance\" data-m=\"아는 사람, 지인\"><b>acquaintance</b>아는 사람, 지인</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>첫 문장 화제</b>를 잡고 하나씩 대 보는 문제예요. 화제는 <b>신선 농산물 저장 때의 공기 관리</b>예요. carbon dioxide(이산화탄소)라는 단어만 같고 화제가 다른 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글 전체 화제</span><div class=\"en\">In addition to controlling temperatures when handling fresh produce, <mark>control of the atmosphere</mark> is important.</div><p class=\"ko\">신선한 농산물을 취급할 때 온도를 조절하는 것뿐만 아니라 <mark>공기의 관리가</mark> 중요하다.</p></div><div class=\"ck-via\"><i>▼</i><span>공기 관리의 첫 항목 = 저장 중 습기 조절</span></div><div class=\"ck-step\"><span class=\"lab\">①(2번) · 화제 이어 가기</span><div class=\"en\">Some moisture is needed in the air to prevent dehydration <mark>during storage</mark>, …</div><p class=\"ko\"><mark>저장하는 동안</mark> 탈수를 막기 위해서 공기 중에 약간의 습기가 필요하다, …</p></div><div class=\"ck-via\"><i>▼</i><span>습기에 이산화탄소까지 함께 조절하는 저장 시설</span></div><div class=\"ck-step\"><span class=\"lab\">②(3번) · 화제 이어 가기</span><div class=\"en\">Some commercial storage units have <mark>controlled atmospheres</mark>, …</div><p class=\"ko\">일부 상업 저장 시설들은 <mark>공기 농도 조절 장치를</mark> 갖고 있다, …</p></div><div class=\"ck-via\"><i>▼</i><span>carbon dioxide(이산화탄소)라는 단어만 이어받고, 저장 이야기가 오염 물질 일반론으로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">③(4번) · 이탈 지점</span><div class=\"en\">Though living things emit carbon dioxide when they breathe, carbon dioxide is widely considered to be <mark>a pollutant</mark>.</div><p class=\"ko\">비록 생명체는 숨 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 <mark>오염 물질</mark>로 널리 여겨진다.</p></div><div class=\"ck-via\"><i>▼</i><span>③을 빼면 ②의 기체 조절 → ④의 다른 기체 조절로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">④(5번) · 다시 제자리</span><div class=\"en\">Sometimes other gases, … may be introduced <mark>at controlled levels</mark> to help achieve optimal quality …</div><p class=\"ko\">때때로 다른 기체들이 … 최상의 품질을 위해 <mark>조절된 수준에서</mark> 투입될 수 있다 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">이산화탄소는 오염 물질로 널리 여겨진다<small>저장용 공기 조절이 아니라 환경 오염 이야기라 흐름에서 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">에틸렌 가스 같은 기체를 조절된 수준으로 투입한다</span><span class=\"why\">ethylene gas(에틸렌 가스)라는 새 기체가 나와 튀어 보이지만, at controlled levels(조절된 수준에서)로 ②의 공기 조절을 그대로 이어 가요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">저장 중 습기는 약간 필요하지만 너무 많으면 곰팡이가 핀다</span><span class=\"why\">1번 화제(공기 관리)의 첫 예로 습기를 얼마나 둘지 말해요. during storage(저장하는 동안)로 저장 이야기를 지켜요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">일부 저장 시설은 이산화탄소와 습기를 조절한다</span><span class=\"why\">carbon dioxide and moisture(이산화탄소와 습기)를 함께 조절하는 저장 시설 이야기라 ①의 습기 조절을 넓혀 가요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">저장 식품 사이에 공기 순환이 필요하다</span><span class=\"why\">Related to the control of gases and moisture(기체와 습기의 조절과 관련된)로 앞의 조절 이야기를 받아 공기 순환으로 마무리해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">In addition to controlling temperatures</div><div class=\"k\">온도를 조절하는 것뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">when handling fresh produce,</div><div class=\"k\">신선한 농산물을 취급할 때,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">control of the atmosphere</span> is important.</div><div class=\"k\"><span class=\"cw\">공기의 관리가</span> 중요하다.</div></div><div class=\"rnat\">신선한 농산물을 취급할 때 온도를 조절하는 것뿐만 아니라 공기의 관리가 중요하다.</div><div class=\"rst\">마트에서 사 온 과일을 오래 두려면 온도만큼 <b>공기 관리</b>가 중요해요. = 지문 1번의 화제, 신선 농산물의 공기 관리예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">① Some moisture is needed in the air</div><div class=\"k\">① 공기 중에 약간의 습기가 필요하다</div></div><div class=\"rc\"><div class=\"e\">to prevent dehydration during storage,</div><div class=\"k\">저장하는 동안 탈수를 막기 위해서,</div></div><div class=\"rc\"><div class=\"e\">but too much moisture</div><div class=\"k\">하지만 과도한 습기는</div></div><div class=\"rc\"><div class=\"e\">can encourage growth of molds.</div><div class=\"k\">곰팡이의 증식을 조장할 수 있다.</div></div><div class=\"rnat\">① 저장하는 동안 탈수를 막기 위해서 공기 중에 약간의 습기가 필요하지만, 과도한 습기는 곰팡이의 증식을 조장할 수 있다.</div><div class=\"rst\">① 과일 상자 안이 너무 마르면 시들고, 너무 축축하면 곰팡이가 피어요. = 지문 ①, 저장 중 습기는 약간만 필요하다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">② Some commercial storage units</div><div class=\"k\">② 일부 상업 저장 시설들은</div></div><div class=\"rc ckc\"><div class=\"e\">have <span class=\"cw\">controlled atmospheres</span>,</div><div class=\"k\"><span class=\"cw\">공기 농도 조절 장치를</span> 갖고 있다,</div></div><div class=\"rc\"><div class=\"e\">with the levels of both carbon dioxide and moisture</div><div class=\"k\">이산화탄소와 습기 두 가지 모두의 수준이</div></div><div class=\"rc\"><div class=\"e\">being regulated carefully.</div><div class=\"k\">조심스럽게 조절되는.</div></div><div class=\"rnat\">② 일부 상업 저장 시설들은 이산화탄소와 습기 두 가지 모두의 수준이 조심스럽게 조절되는 공기 농도 조절 장치들을 갖고 있다.</div><div class=\"rst\">② 큰 마트 창고엔 이산화탄소와 습기를 꼼꼼히 맞추는 장치가 있대요. = 지문 ②, 공기 농도를 조절하는 저장 시설이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">③ Though living things emit carbon dioxide</div><div class=\"k\">③ 비록 생명체는 이산화탄소를 내뿜지만</div></div><div class=\"rc\"><div class=\"e\">when they breathe,</div><div class=\"k\">그들(= 생명체들)이 숨을 쉴 때,</div></div><div class=\"rc\"><div class=\"e\">carbon dioxide is widely considered</div><div class=\"k\">이산화탄소는 널리 여겨진다</div></div><div class=\"rc ckc\"><div class=\"e\">to be <span class=\"cw\">a pollutant</span>.</div><div class=\"k\"><span class=\"cw\">오염 물질이라고</span>.</div></div><div class=\"rnat\">③ 비록 생명체는 (그들이) 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다.</div><div class=\"rst\">③ 갑자기 “이산화탄소는 오염 물질”이라는 얘기가 나와요. 과일 보관이 아니라 <b>환경 오염</b> 이야기라 지문 흐름에서 튀어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">④ Sometimes other gases,</div><div class=\"k\">④ 때때로 다른 기체들이,</div></div><div class=\"rc\"><div class=\"e\">such as ethylene gas,</div><div class=\"k\">에틸렌 가스 같은,</div></div><div class=\"rc ckc\"><div class=\"e\">may be introduced <span class=\"cw\">at controlled levels</span></div><div class=\"k\"><span class=\"cw\">조절된 수준에서</span> 투입될 수 있다</div></div><div class=\"rc\"><div class=\"e\">to help achieve optimal quality</div><div class=\"k\">최상의 품질을 달성하는 것을 돕기 위해서</div></div><div class=\"rc\"><div class=\"e\">of bananas and other fresh produce.</div><div class=\"k\">바나나나 다른 신선한 농산물의.</div></div><div class=\"rnat\">④ 바나나나 다른 신선한 농산물의 최상의 품질을 달성하는 것을 돕기 위해서 때때로 에틸렌 가스 같은 다른 기체들이 조절된 수준에서 투입될 수 있다.</div><div class=\"rst\">④ 바나나를 알맞게 익히려고 에틸렌 가스를 조금씩 넣기도 해요. = 지문 ④, 다시 저장 공기를 조절하는 이야기예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">⑤ Related to the control of gases and moisture</div><div class=\"k\">⑤ 기체와 습기의 조절과 관련이 있는 것은</div></div><div class=\"rc\"><div class=\"e\">is the need</div><div class=\"k\">필요성이다</div></div><div class=\"rc\"><div class=\"e\">for some circulation of air</div><div class=\"k\">약간의 공기 순환의</div></div><div class=\"rc\"><div class=\"e\">among the stored foods.</div><div class=\"k\">저장된 식품들 사이에.</div></div><div class=\"rnat\">⑤ 저장된 식품들 사이에 약간의 공기 순환의 필요성은 기체와 습기의 조절과 관련이 있다.</div><div class=\"rst\">⑤ 과일 상자끼리 공기가 조금 통하게 틈을 두는 것도 필요해요. = 지문 ⑤, 기체·습기 조절과 이어지는 공기 순환이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fresh produce\" data-m=\"신선 농산물\"><b>fresh produce</b>신선 농산물</button><button type=\"button\" class=\"wdb\" data-w=\"dehydration\" data-m=\"탈수\"><b>dehydration</b>탈수</button><button type=\"button\" class=\"wdb\" data-w=\"mold\" data-m=\"곰팡이\"><b>mold</b>곰팡이</button><button type=\"button\" class=\"wdb\" data-w=\"emit\" data-m=\"내뿜다\"><b>emit</b>내뿜다</button><button type=\"button\" class=\"wdb\" data-w=\"pollutant\" data-m=\"오염 물질\"><b>pollutant</b>오염 물질</button><button type=\"button\" class=\"wdb\" data-w=\"circulation\" data-m=\"순환\"><b>circulation</b>순환</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>but</b>(하지만)·<b>however</b>(하지만)로 맞부딪치는 두 마음을 한꺼번에 담아야 해요. 1번의 “찬성하지만 안 탄다”가 5번(보행자 우선)과 6번(내 가족 우선)으로 되풀이돼요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 첫머리에서 모순 제시</span><div class=\"en\">… people generally <mark>approve of</mark> driverless, or autonomous, cars programmed to sacrifice their passengers in order to save pedestrians, but these same people <mark>are not enthusiastic about riding</mark> …</div><p class=\"ko\">사람들은 보행자를 구하려고 탑승자를 희생시키도록 프로그램된 자율자동차에 대체로 <mark>찬성하지만</mark>, 정작 자신이 타는 것에는 <mark>열광하지 않는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>1번의 “찬성”이 실제 설문 응답으로 나옴</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 말로는 보행자 우선</span><div class=\"en\">Survey participants said that AVs should be programmed to be utilitarian and to <mark>minimize harm to pedestrians</mark>, …</div><p class=\"ko\">설문 참여자들은 AV가 공리적이고 <mark>보행자에 대한 피해를 최소화하도록</mark> 프로그램되어야 한다고 말했다, …</p></div><div class=\"ck-via\"><i>▼</i><span>however(하지만)로 같은 사람이 정반대 선택</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">The same respondents, <mark>however</mark>, said they prefer to buy cars that <mark>protect them and their passengers</mark>, …</div><p class=\"ko\"><mark>하지만</mark> 이 동일한 응답자들은 <mark>자신과 자기 탑승자를 보호하는</mark> 차를 사는 것을 선호한다고 말했다, …</p></div><div class=\"ck-via\"><i>▼</i><span>남들은 보행자 우선 차를 타길 바라면서 나는 안 탐 = 탑승자냐 보행자냐의 딜레마</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 정리</span><div class=\"en\">This suggests that … few people would be willing to ride in the latter — even though they would prefer others to do so.</div><p class=\"ko\">이는 … 다른 사람들이 그렇게 하는 것은 선호할지라도 후자에 기꺼이 타려는 사람은 거의 없을 것임을 시사한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">The Dilemma(딜레마): AVs to Save Passengers or Pedestrians(자율주행차는 탑승자를 구할까, 보행자를 구할까?)<small>1번의 모순과 5·6번의 엇갈린 선택을 “딜레마” 한 단어로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Putting Safety First(안전 최우선): A New Trend in Car Industry(자동차 업계의 새로운 흐름)</span><span class=\"why\">[지문에 없음] 5번의 safety(안전)만 따온 함정이에요. 글은 누구의 안전을 먼저 둘지 마음이 엇갈린다는 얘기지, 업계의 새 흐름이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Will AVs Finally End Car Accidents(자율주행차가 마침내 교통사고를 끝낼까?)</span><span class=\"why\">[지문에 없음] 글은 사고 때 누구를 구할지 고르는 얘기예요. 사고가 없어진다는 말은 한 문장도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">How Driverless Cars Cause Unemployment(운전자 없는 차가 실업을 일으키는 방식)</span><span class=\"why\">[지문에 없음] 일자리·실업 얘기는 전혀 없어요. 1~8번 내내 탑승자 대 보행자 선택 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Safety Measures Required for Driverless Cars(자율주행차에 필요한 안전 대책)</span><span class=\"why\">[범위 좁음] 안전 대책이라는 한 면만 다뤄요. 2~4번 설문은 대책이 아니라 “누구를 희생할지”를 물어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">A new study published in Science</div><div class=\"k\">Science지에 게재된 새로운 연구는</div></div><div class=\"rc\"><div class=\"e\">reveals</div><div class=\"k\">밝혀 준다</div></div><div class=\"rc ckc\"><div class=\"e\">that people generally <span class=\"cw\">approve of</span></div><div class=\"k\">사람들이 대체로 <span class=\"cw\">찬성한다</span>는 것을</div></div><div class=\"rc\"><div class=\"e\">driverless, or autonomous, cars</div><div class=\"k\">운전자 없는, 즉 자율적인 자동차에 대해</div></div><div class=\"rc\"><div class=\"e\">programmed to sacrifice their passengers</div><div class=\"k\">탑승자를 희생시키도록 프로그램된</div></div><div class=\"rc\"><div class=\"e\">in order to save pedestrians,</div><div class=\"k\">보행자를 구하기 위해,</div></div><div class=\"rc\"><div class=\"e\">but these same people</div><div class=\"k\">하지만 이 동일한 사람들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are not enthusiastic about riding</span></div><div class=\"k\">타는 것에 <span class=\"cw\">열광하지 않는다</span></div></div><div class=\"rc\"><div class=\"e\">in such autonomous vehicles (AVs) themselves.</div><div class=\"k\">그러한(= 보행자를 위해 탑승자를 희생하도록 프로그램된) 자율자동차(AV)에 그들 자신이.</div></div><div class=\"rnat\">보행자를 지키기 위해 탑승자를 희생시키도록 프로그램된 운전자 없는, 즉 자율자동차에 대해 사람들이 대체로 찬성하지만, 이 동일한 사람들은 그러한 자율자동차(AV)를 자신이 타는 것에는 열광하지 않는다는 것을 Science지에 게재된 새로운 연구가 밝혀 준다.</div><div class=\"rst\">학교 설문에서 다들 “사고 땐 차가 길 가는 사람을 먼저 지켜야 해”에 찬성했어요. 그런데 그 차에 우리 가족이 탄다면? = 지문 1번의 모순이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In six online surveys</div><div class=\"k\">여섯 차례의 온라인 설문조사에서</div></div><div class=\"rc\"><div class=\"e\">of U.S. residents</div><div class=\"k\">미국 주민들을 대상으로 한</div></div><div class=\"rc\"><div class=\"e\">conducted in 2015,</div><div class=\"k\">2015년에 실시된,</div></div><div class=\"rc\"><div class=\"e\">researchers asked participants</div><div class=\"k\">연구자들은 참여자들에게 물었다</div></div><div class=\"rc\"><div class=\"e\">how they would want their AVs to behave.</div><div class=\"k\">그들(= 참여자들)의 AV가 어떻게 작동하기를 원하는지.</div></div><div class=\"rnat\">2015년에 미국 주민들을 대상으로 실시된 여섯 차례의 온라인 설문조사에서, 연구자들은 참여자들에게 그들의 AV가 어떻게 작동하기를 원하는지 물었다.</div><div class=\"rst\">연구자들은 미국 사람들에게 온라인 설문을 여섯 번 하며 “자율주행차(AV)가 어떻게 움직이면 좋겠어요?” 하고 물었어요. = 지문 2번.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The scenarios involved in the surveys</div><div class=\"k\">설문조사에 포함된 시나리오들은</div></div><div class=\"rc\"><div class=\"e\">varied in the number of pedestrian and passenger lives</div><div class=\"k\">보행자와 탑승자의 목숨 수를 달리했다</div></div><div class=\"rc\"><div class=\"e\">that could be saved,</div><div class=\"k\">구할 수 있는,</div></div><div class=\"rc\"><div class=\"e\">among other factors.</div><div class=\"k\">다른 요인들 중에서도.</div></div><div class=\"rnat\">설문조사에 포함된 시나리오들은 다른 요인들 중에서도 구할 수 있는 보행자와 탑승자의 목숨 수를 달리했다.</div><div class=\"rst\">설문 상황마다 구할 수 있는 보행자와 탑승자의 수를 이리저리 바꿨어요. = 지문 3번, 시나리오마다 목숨 수가 달랐다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">participants were asked</div><div class=\"k\">참여자들은 질문을 받았다</div></div><div class=\"rc\"><div class=\"e\">whether it would be more moral for AVs</div><div class=\"k\">AV가 ~하는 것이 더 도덕적인지</div></div><div class=\"rc\"><div class=\"e\">to sacrifice one passenger</div><div class=\"k\">한 명의 탑승자를 희생시키는 것이</div></div><div class=\"rc\"><div class=\"e\">rather than kill 10 pedestrians.</div><div class=\"k\">10명의 보행자를 사망하게 하는 것보다.</div></div><div class=\"rnat\">예를 들어, 참여자들은 AV가 10명의 보행자를 사망하게 하는 것보다 한 명의 탑승자를 희생시키는 것이 더 도덕적인지에 대해 질문을 받았다.</div><div class=\"rst\">예를 들면 “차에 탄 1명을 희생해 길 위의 10명을 구하는 게 더 옳을까?” 같은 질문이에요. = 지문 4번이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Survey participants said</div><div class=\"k\">설문 참여자들은 말했다</div></div><div class=\"rc\"><div class=\"e\">that AVs should be programmed</div><div class=\"k\">AV가 프로그램되어야 한다고</div></div><div class=\"rc\"><div class=\"e\">to be utilitarian</div><div class=\"k\">공리적이도록</div></div><div class=\"rc ckc\"><div class=\"e\">and to <span class=\"cw\">minimize harm to pedestrians</span>,</div><div class=\"k\">그리고 <span class=\"cw\">보행자에 대한 피해를 최소화하도록</span>,</div></div><div class=\"rc\"><div class=\"e\">a position</div><div class=\"k\">하나의 입장으로,(= 공리적이고 보행자 피해를 최소화해야 한다는 입장)</div></div><div class=\"rc\"><div class=\"e\">that would put the safety of those outside the vehicle</div><div class=\"k\">차량 밖에 있는 사람들의 안전을 놓게 될</div></div><div class=\"rc\"><div class=\"e\">ahead of the driver and passengers’ safety.</div><div class=\"k\">운전자와 탑승자의 안전보다 앞에.</div></div><div class=\"rnat\">설문 참여자들은 AV가 공리적이고 보행자에 대한 피해를 최소화하도록 프로그램되어야 한다고 말했는데, 이는 운전자와 탑승자의 안전보다 차량 밖에 있는 사람들의 안전을 우선시하는 입장이다.</div><div class=\"rst\">사람들은 “<b>차 밖 사람</b>을 먼저 지켜야 해!”라고 답했어요. = 지문 5번, 보행자 피해를 최소화하는 공리적(utilitarian) 입장이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">The same respondents, <span class=\"cw\">however</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span> 이 동일한 응답자들은,</div></div><div class=\"rc\"><div class=\"e\">said they prefer to buy cars</div><div class=\"k\">차를 사는 것을 선호한다고 말했다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">protect them and their passengers</span>,</div><div class=\"k\"><span class=\"cw\">자신과 자기 탑승자를 보호하는</span>,</div></div><div class=\"rc\"><div class=\"e\">especially if family members are involved.</div><div class=\"k\">특히 가족 구성원이 관련되었을 때.</div></div><div class=\"rnat\">하지만 이 동일한 응답자들은 자신과 자기 탑승자를 보호하는 차를 사는 것을 선호한다고, 특히 가족 구성원이 관련되었을 때 그렇다고 말했다.</div><div class=\"rst\"><b>하지만</b>(however) 같은 사람들이 막상 우리 가족 차를 살 땐 “<b>우리 가족을 지키는 차</b>”를 골라요. = 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">This suggests</div><div class=\"k\">이는 시사한다</div></div><div class=\"rc\"><div class=\"e\">that if both self-protective and utilitarian AVs</div><div class=\"k\">만약 자기방어적인 AV와 공리적인 AV가 모두</div></div><div class=\"rc\"><div class=\"e\">were allowed on the market,</div><div class=\"k\">시장에 허용된다면,</div></div><div class=\"rc\"><div class=\"e\">few people would be willing to ride in the latter</div><div class=\"k\">후자(= 공리적인 AV)에 기꺼이 타려는 사람은 거의 없을 것이라는 것을</div></div><div class=\"rc\"><div class=\"e\">— even though they would prefer</div><div class=\"k\">— 그들(= 사람들)이 선호할지라도</div></div><div class=\"rc\"><div class=\"e\">others to do so.</div><div class=\"k\">다른 사람들이 그렇게 하는 것을(= 공리적인 AV를 타는 것).</div></div><div class=\"rnat\">이는 만약 자기방어적인 AV와 공리적인 AV가 모두 시장에 허용된다면, 다른 사람들이 공리적인 AV를 타는 것은 선호할지라도 정작 후자에 기꺼이 타려는 사람은 거의 없을 것임을 시사한다.</div><div class=\"rst\">그래서 두 종류 차가 다 나오면, 남들은 착한 차를 타길 바라면서 정작 자기는 안 타요. = 지문 7번, 후자(the latter)를 꺼리는 마음이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The inconsistency,</div><div class=\"k\">불일치는,※ 문제지엔 빈칸(12번 정답)으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">which illustrates an ethical tension</div><div class=\"k\">윤리적 긴장을 보여 주는</div></div><div class=\"rc\"><div class=\"e\">between the good of the individual</div><div class=\"k\">개인의 이익과</div></div><div class=\"rc\"><div class=\"e\">and that of the public,</div><div class=\"k\">공공의 이익(= the good of the public) 사이의,</div></div><div class=\"rc\"><div class=\"e\">persisted across a wide range</div><div class=\"k\">광범위하게 걸쳐 지속되었다</div></div><div class=\"rc\"><div class=\"e\">of survey scenarios analyzed.</div><div class=\"k\">분석된 설문조사 시나리오 전체에.</div></div><div class=\"rnat\">개인의 이익과 공공의 이익 사이의 윤리적 긴장을 설명하는 이러한 불일치는 분석된 광범위한 설문조사 시나리오 전체에 걸쳐 지속되었다.</div><div class=\"rst\">말과 행동이 어긋나는 이 <b>모순</b>은 어떤 설문 상황에서도 계속됐어요. = 지문 8번, 개인의 이익과 공공의 이익 사이의 윤리적 긴장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"approve of\" data-m=\"~에 찬성하다\"><b>approve of</b>~에 찬성하다</button><button type=\"button\" class=\"wdb\" data-w=\"autonomous\" data-m=\"자율적인\"><b>autonomous</b>자율적인</button><button type=\"button\" class=\"wdb\" data-w=\"sacrifice\" data-m=\"희생시키다\"><b>sacrifice</b>희생시키다</button><button type=\"button\" class=\"wdb\" data-w=\"pedestrian\" data-m=\"보행자\"><b>pedestrian</b>보행자</button><button type=\"button\" class=\"wdb\" data-w=\"utilitarian\" data-m=\"공리적인\"><b>utilitarian</b>공리적인</button><button type=\"button\" class=\"wdb\" data-w=\"the latter\" data-m=\"후자\"><b>the latter</b>후자</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>마지막 문장</b>에 있으면 앞 문장들이 보여 준 상태에 <b>이름</b>을 붙이세요. 5번(말)과 6번(행동)이 <b>however</b>(하지만)로 서로 어긋나요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (8번)</span><div class=\"en\">The <span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>, which illustrates an <mark>ethical tension</mark> between the good of the individual and that of the public, persisted across a wide range of survey scenarios analyzed.</div><p class=\"ko\">개인의 이익과 공공의 이익 사이의 <mark>윤리적 긴장</mark>을 보여 주는 ( ? )는 설문 시나리오 전체에 걸쳐 지속되었다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 = 앞 세 문장이 보여 준 상태의 이름, 먼저 “말”</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 말</span><div class=\"en\">Survey participants said that AVs should be programmed <mark>to be utilitarian</mark> …</div><p class=\"ko\">설문 참여자들은 AV가 <mark>공리적이도록</mark> 프로그램되어야 한다고 말했다 …</p></div><div class=\"ck-via\"><i>▼</i><span>however(하지만): 같은 사람이 말과 반대로 행동</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">The same respondents, <mark>however</mark>, said they prefer to buy cars that protect them and their passengers, …</div><p class=\"ko\"><mark>하지만</mark> 이 동일한 응답자들은 자신과 자기 탑승자를 보호하는 차를 사는 것을 선호한다고 말했다, …</p></div><div class=\"ck-via\"><i>▼</i><span>남에겐 권하고 나는 안 탐 = 말과 행동이 어긋남</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 어긋남 확인</span><div class=\"en\">This suggests that … few people would be willing to ride in the latter — <mark>even though they would prefer others to do so</mark>.</div><p class=\"ko\">이는 … 다른 사람들이 그렇게 하는 것은 <mark>선호할지라도</mark> 후자에 기꺼이 타려는 사람은 거의 없을 것임을 시사한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">inconsistency 불일치, 모순<small>5번의 말(공리적이어야 함)과 6번의 행동(나를 지키는 차)이 어긋난 상태예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">guilt 죄책감</span><span class=\"why\">ethical tension(윤리적 긴장)만 보고 고르기 쉬운 함정이에요. 지문 어디에도 미안해한다는 말은 없고, 빈칸은 5번의 말과 6번의 선택이 어긋난 상태를 가리켜요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">inferiority 열등감</span><span class=\"why\">누가 누구보다 못하다고 느끼는 장면이 없어요. 8번은 개인과 공공의 이익 사이의 긴장 얘기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">pessimism 비관주의</span><span class=\"why\">자율주행차의 앞날을 어둡게 보는 말은 없어요. 7번도 “남은 타고 나는 안 탄다”는 어긋남이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">ignorance 무지</span><span class=\"why\">몰라서 그런 게 아니에요. 4·5번에서 상황을 다 듣고 스스로 답했고, 그 답과 6번 선택이 서로 어긋난 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">A new study published in Science</div><div class=\"k\">Science지에 게재된 새로운 연구는</div></div><div class=\"rc\"><div class=\"e\">reveals</div><div class=\"k\">밝혀 준다</div></div><div class=\"rc\"><div class=\"e\">that people generally approve of</div><div class=\"k\">사람들이 대체로 찬성한다는 것을</div></div><div class=\"rc\"><div class=\"e\">driverless, or autonomous, cars</div><div class=\"k\">운전자 없는, 즉 자율적인 자동차에 대해</div></div><div class=\"rc\"><div class=\"e\">programmed to sacrifice their passengers</div><div class=\"k\">탑승자를 희생시키도록 프로그램된</div></div><div class=\"rc\"><div class=\"e\">in order to save pedestrians,</div><div class=\"k\">보행자를 구하기 위해,</div></div><div class=\"rc\"><div class=\"e\">but these same people</div><div class=\"k\">하지만 이 동일한 사람들은</div></div><div class=\"rc\"><div class=\"e\">are not enthusiastic about riding</div><div class=\"k\">타는 것에 열광하지 않는다</div></div><div class=\"rc\"><div class=\"e\">in such autonomous vehicles (AVs) themselves.</div><div class=\"k\">그러한(= 보행자를 위해 탑승자를 희생하도록 프로그램된) 자율자동차(AV)에 그들 자신이.</div></div><div class=\"rnat\">보행자를 지키기 위해 탑승자를 희생시키도록 프로그램된 운전자 없는, 즉 자율자동차에 대해 사람들이 대체로 찬성하지만, 이 동일한 사람들은 그러한 자율자동차(AV)를 자신이 타는 것에는 열광하지 않는다는 것을 Science지에 게재된 새로운 연구가 밝혀 준다.</div><div class=\"rst\">학교 설문에서 다들 “사고 땐 차가 길 가는 사람을 먼저 지켜야 해”에 찬성했어요. 그런데 그 차에 우리 가족이 탄다면? = 지문 1번의 모순이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In six online surveys</div><div class=\"k\">여섯 차례의 온라인 설문조사에서</div></div><div class=\"rc\"><div class=\"e\">of U.S. residents</div><div class=\"k\">미국 주민들을 대상으로 한</div></div><div class=\"rc\"><div class=\"e\">conducted in 2015,</div><div class=\"k\">2015년에 실시된,</div></div><div class=\"rc\"><div class=\"e\">researchers asked participants</div><div class=\"k\">연구자들은 참여자들에게 물었다</div></div><div class=\"rc\"><div class=\"e\">how they would want their AVs to behave.</div><div class=\"k\">그들(= 참여자들)의 AV가 어떻게 작동하기를 원하는지.</div></div><div class=\"rnat\">2015년에 미국 주민들을 대상으로 실시된 여섯 차례의 온라인 설문조사에서, 연구자들은 참여자들에게 그들의 AV가 어떻게 작동하기를 원하는지 물었다.</div><div class=\"rst\">연구자들은 미국 사람들에게 온라인 설문을 여섯 번 하며 “자율주행차(AV)가 어떻게 움직이면 좋겠어요?” 하고 물었어요. = 지문 2번.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The scenarios involved in the surveys</div><div class=\"k\">설문조사에 포함된 시나리오들은</div></div><div class=\"rc\"><div class=\"e\">varied in the number of pedestrian and passenger lives</div><div class=\"k\">보행자와 탑승자의 목숨 수를 달리했다</div></div><div class=\"rc\"><div class=\"e\">that could be saved,</div><div class=\"k\">구할 수 있는,</div></div><div class=\"rc\"><div class=\"e\">among other factors.</div><div class=\"k\">다른 요인들 중에서도.</div></div><div class=\"rnat\">설문조사에 포함된 시나리오들은 다른 요인들 중에서도 구할 수 있는 보행자와 탑승자의 목숨 수를 달리했다.</div><div class=\"rst\">설문 상황마다 구할 수 있는 보행자와 탑승자의 수를 이리저리 바꿨어요. = 지문 3번, 시나리오마다 목숨 수가 달랐다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">participants were asked</div><div class=\"k\">참여자들은 질문을 받았다</div></div><div class=\"rc\"><div class=\"e\">whether it would be more moral for AVs</div><div class=\"k\">AV가 ~하는 것이 더 도덕적인지</div></div><div class=\"rc\"><div class=\"e\">to sacrifice one passenger</div><div class=\"k\">한 명의 탑승자를 희생시키는 것이</div></div><div class=\"rc\"><div class=\"e\">rather than kill 10 pedestrians.</div><div class=\"k\">10명의 보행자를 사망하게 하는 것보다.</div></div><div class=\"rnat\">예를 들어, 참여자들은 AV가 10명의 보행자를 사망하게 하는 것보다 한 명의 탑승자를 희생시키는 것이 더 도덕적인지에 대해 질문을 받았다.</div><div class=\"rst\">예를 들면 “차에 탄 1명을 희생해 길 위의 10명을 구하는 게 더 옳을까?” 같은 질문이에요. = 지문 4번이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Survey participants said</div><div class=\"k\">설문 참여자들은 말했다</div></div><div class=\"rc\"><div class=\"e\">that AVs should be programmed</div><div class=\"k\">AV가 프로그램되어야 한다고</div></div><div class=\"rc\"><div class=\"e\">to be utilitarian</div><div class=\"k\">공리적이도록</div></div><div class=\"rc\"><div class=\"e\">and to minimize harm to pedestrians,</div><div class=\"k\">그리고 보행자에 대한 피해를 최소화하도록,</div></div><div class=\"rc\"><div class=\"e\">a position</div><div class=\"k\">하나의 입장으로,(= 공리적이고 보행자 피해를 최소화해야 한다는 입장)</div></div><div class=\"rc\"><div class=\"e\">that would put the safety of those outside the vehicle</div><div class=\"k\">차량 밖에 있는 사람들의 안전을 놓게 될</div></div><div class=\"rc\"><div class=\"e\">ahead of the driver and passengers’ safety.</div><div class=\"k\">운전자와 탑승자의 안전보다 앞에.</div></div><div class=\"rnat\">설문 참여자들은 AV가 공리적이고 보행자에 대한 피해를 최소화하도록 프로그램되어야 한다고 말했는데, 이는 운전자와 탑승자의 안전보다 차량 밖에 있는 사람들의 안전을 우선시하는 입장이다.</div><div class=\"rst\">사람들은 “<b>차 밖 사람</b>을 먼저 지켜야 해!”라고 답했어요. = 지문 5번, 보행자 피해를 최소화하는 공리적(utilitarian) 입장이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">The same respondents, <span class=\"cw\">however</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span> 이 동일한 응답자들은,</div></div><div class=\"rc\"><div class=\"e\">said they prefer to buy cars</div><div class=\"k\">차를 사는 것을 선호한다고 말했다</div></div><div class=\"rc\"><div class=\"e\">that protect them and their passengers,</div><div class=\"k\">자신과 자기 탑승자를 보호하는,</div></div><div class=\"rc\"><div class=\"e\">especially if family members are involved.</div><div class=\"k\">특히 가족 구성원이 관련되었을 때.</div></div><div class=\"rnat\">하지만 이 동일한 응답자들은 자신과 자기 탑승자를 보호하는 차를 사는 것을 선호한다고, 특히 가족 구성원이 관련되었을 때 그렇다고 말했다.</div><div class=\"rst\"><b>하지만</b>(however) 같은 사람들이 막상 우리 가족 차를 살 땐 “<b>우리 가족을 지키는 차</b>”를 골라요. = 지문 6번이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">This suggests</div><div class=\"k\">이는 시사한다</div></div><div class=\"rc\"><div class=\"e\">that if both self-protective and utilitarian AVs</div><div class=\"k\">만약 자기방어적인 AV와 공리적인 AV가 모두</div></div><div class=\"rc\"><div class=\"e\">were allowed on the market,</div><div class=\"k\">시장에 허용된다면,</div></div><div class=\"rc\"><div class=\"e\">few people would be willing to ride in the latter</div><div class=\"k\">후자(= 공리적인 AV)에 기꺼이 타려는 사람은 거의 없을 것이라는 것을</div></div><div class=\"rc ckc\"><div class=\"e\">— <span class=\"cw\">even though they would prefer</span></div><div class=\"k\">— 그들(= 사람들)이 <span class=\"cw\">선호할지라도</span></div></div><div class=\"rc\"><div class=\"e\">others to do so.</div><div class=\"k\">다른 사람들이 그렇게 하는 것을(= 공리적인 AV를 타는 것).</div></div><div class=\"rnat\">이는 만약 자기방어적인 AV와 공리적인 AV가 모두 시장에 허용된다면, 다른 사람들이 공리적인 AV를 타는 것은 선호할지라도 정작 후자에 기꺼이 타려는 사람은 거의 없을 것임을 시사한다.</div><div class=\"rst\">그래서 두 종류 차가 다 나오면, 남들은 착한 차를 타길 바라면서 정작 자기는 안 타요. = 지문 7번, 후자(the latter)를 꺼리는 마음이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The inconsistency</span>,</div><div class=\"k\"><span class=\"cw\">불일치는</span>,※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\">which illustrates an <span class=\"cw\">ethical tension</span></div><div class=\"k\"><span class=\"cw\">윤리적 긴장을</span> 보여 주는</div></div><div class=\"rc\"><div class=\"e\">between the good of the individual</div><div class=\"k\">개인의 이익과</div></div><div class=\"rc\"><div class=\"e\">and that of the public,</div><div class=\"k\">공공의 이익(= the good of the public) 사이의,</div></div><div class=\"rc\"><div class=\"e\">persisted across a wide range</div><div class=\"k\">광범위하게 걸쳐 지속되었다</div></div><div class=\"rc\"><div class=\"e\">of survey scenarios analyzed.</div><div class=\"k\">분석된 설문조사 시나리오 전체에.</div></div><div class=\"rnat\">개인의 이익과 공공의 이익 사이의 윤리적 긴장을 설명하는 이러한 불일치는 분석된 광범위한 설문조사 시나리오 전체에 걸쳐 지속되었다.</div><div class=\"rst\">말과 행동이 <b>어긋나는 것</b>은 어떤 설문 상황에서도 계속됐어요. = 지문 8번의 빈칸, 그래서 답은 inconsistency(불일치)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"utilitarian\" data-m=\"공리적인\"><b>utilitarian</b>공리적인</button><button type=\"button\" class=\"wdb\" data-w=\"respondent\" data-m=\"응답자\"><b>respondent</b>응답자</button><button type=\"button\" class=\"wdb\" data-w=\"be willing to\" data-m=\"기꺼이 ~하다\"><b>be willing to</b>기꺼이 ~하다</button><button type=\"button\" class=\"wdb\" data-w=\"illustrate\" data-m=\"보여 주다, 예시하다\"><b>illustrate</b>보여 주다, 예시하다</button><button type=\"button\" class=\"wdb\" data-w=\"ethical tension\" data-m=\"윤리적 긴장\"><b>ethical tension</b>윤리적 긴장</button><button type=\"button\" class=\"wdb\" data-w=\"persist\" data-m=\"지속되다\"><b>persist</b>지속되다</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
