<title>고2 미니모의고사 5회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .at{font-size:13px;color:var(--sub)}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

var D=[{"no": "07", "typ": "빈칸 추론", "src": "2023년 6월 31번", "evn": [6, 7, 8], "ev_en": "Facing increasingly strict regulation, greenhouse growers realized they had to develop new methods if they were going to maintain product quality with fewer pesticides. / In response, they shifted to a cultivation method that circulates water in closed-loop systems and grows flowers in a rock wool substrate. / The new system not only reduced the pollution released into the environment; it also increased profits by giving companies greater control over growing conditions.", "ev_ko": [[6, "점점 더 엄격해지는 규제에 직면하자, 온실 재배자들은 더 적은 농약으로 상품의 품질을 유지하려면 새로운 방법들을 개발해야만 한다는 것을 깨달았다."], [7, "이에 대응해, 그들은 폐쇄 루프 체계에서 물을 순환시키고 암면 배양판에서 꽃을 키우는 재배 방식으로 전환했다."], [8, "그 새로운 체계는 환경에 배출되는 오염을 감소시켰을 뿐만 아니라, 회사들에게 재배 조건에 대한 더 큰 통제력을 줌으로써 이익도 증가시켰다."]], "why": ["빈칸에는 <b>더 엄격한 규제가 무엇을 유발하는지<\/b>가 들어갑니다", "그 답은 3~8번의 네덜란드 꽃 산업 사례에 있습니다", "6번에서 농가들은 새로운 방법을 <b>개발해야(develop new methods)<\/b> 한다고 깨닫습니다", "7번에서 그들은 <b>shifted to a cultivation method<\/b>, 즉 새 재배 방식으로 전환합니다", "8번의 <b>The new system<\/b>은 오염을 줄이고 이익도 늘립니다", "결국 엄격한 규제가 끌어낸 것은 <b>새로운 방법 = 혁신(innovation)<\/b>입니다."], "ch": [{"n": "①", "t": "innovation", "g": "혁신", "ok": true, "e": ["6·7·8번의 new methods, a cultivation method(새 재배 방식), The new system이 모두 '혁신'이라는 한 단어로 묶입니다."]}, {"n": "②", "t": "resistance", "g": "저항", "ok": false, "e": ["규제에 <b>저항<\/b>했다는 내용이 아닙니다", "규제에 맞서 버텼다는 내용이 아니라 농가들이 <b>새 방법을 찾아냈다<\/b>는 내용입니다(6~7번)."]}, {"n": "③", "t": "fairness", "g": "공정성", "ok": false, "e": ["<b>공정성<\/b>에 관한 내용은 지문에 나오지 않습니다", "규제가 공평한지를 따지는 글이 아닙니다."]}, {"n": "④", "t": "neglect", "g": "태만, 방치", "ok": false, "e": ["규제를 <b>태만하게 넘겼다<\/b>면 8번의 오염 감소와 이익 증가를 설명할 수 없습니다", "지문의 결과와 반대입니다."]}, {"n": "⑤", "t": "unity", "g": "단합", "ok": false, "e": ["기업들이 <b>단합했다<\/b>는 내용은 없습니다", "사례의 중심은 한 산업이 재배 방식을 바꾼 것입니다."]}], "tr": ["경영 전략과 환경에 대한 연구 과정에서, Michael Porter는 기업들이 규제로부터 이익을 얻고 있는 것처럼 보인다는 독특한 패턴을 알아차렸다.", "그는 또한 더 엄격한 규제가 더 약한 규제보다 더 많은 혁신을 유발하고 있다는 것을 발견했다.", "네덜란드의 ersity of scientific theories", "g": "과학 이론의 다양성", "ok": false, "e": ["7번에 different problems, different fields가 나와 비슷해 보입니다", "하지만 그 문장의 핵심은 <b>이론의 다양성<\/b>이 아닙니다", "다른 분야의 과학자들도 <b>장을 마련해 준다<\/b>(set the stage)는 협력입니다."]}, {"n": "⑤", "t": "the collective nature of knowledge", "g": "지식의 집단적 속성", "ok": true, "e": ["5번의 nobody operates alone, 8번의 shared within a community가 '집단적 속성(collective)'으로 표현되었습니다."]}], "tr": ["지식의 집단적 속성을 이해하는 것은 우리가 세상을 어떻게 바라보는가에 대한 우리의 잘못된 개념을 바로잡아 줄 수 있다.", "사람들은 영웅을 사랑한다.", "개인들은 주요한 획기적 발견에 대한 공로를 인정받는다.", "Marie Curie는 마치 그녀가 방사능을 발견하기 위해 홀로 연구한 것처럼, Newton은 마치 그가 혼자 힘으로 운동의 법칙을 발견한 것처럼 간주된다.", "진실은 실제 세계에서 어느 누구도 홀로 일하지 않는다는 것이다.", "과학자들은 중요한 생각에 공헌하는 학생들과 함께하는 실험실을 가지고 있을 뿐만 아니라 유사한 연구를 하고 유사한 생각을 하는 동료들도 가지고 있으며, 그들이 없다면 과학자는 아무런 성과도 얻지 못할 것이다.", "그러고 나서, 다른 문제들에 대해, 때로는 다른 분야에서 연구하지만 그럼에도 불구하고 자신들의 발견과 생각들을 통해 장을 마련해 주는 다른 과학자들이 있다.", "일단 우리가 지식이 모두 (한 명의) 머릿속에 있지 않고, 공동체 속에서 공유된다는 것을 이해하기 시작하면, 우리의 영웅은 바뀐다.", "개인에게 초점을 맞추는 대신에, 우리는 더 큰 집단에 초점을 맞추기 시작한다."], "ps": [{"n": 1, "ch": [{"e": "<b>Appreciating<\/b>", "k": "<b>이해하는 것은<\/b>"}, {"e": "the collective nature of knowledge", "k": "지식의 집단적 속성을<span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}, {"e": "can correct", "k": "바로잡아 줄 수 있다"}, {"e": "our <b>false notions<\/b>", "k": "우리의 <b>잘못된 개념<\/b>을"}, {"e": "of how we see the world.", "k": "우리가 세상을 어떻게 바라보는가에 대한."}], "easy": "지식은 여럿이 함께 만든다는 걸 알면, 세상을 잘못 보던 생각을 바로잡을 수 있어요.", "gist": "빈칸 문장이자 글의 주제. 뒤 문장들이 이 빈칸의 내용을 풀어 준다."}, {"n": 2, "ch": [{"e": "People love heroes.", "k": "사람들은 영웅을 사랑한다."}], "easy": "사람들은 영웅을 좋아해요.", "gist": "'잘못된 개념'의 시작. 사람들은 영웅 한 명에게 눈길을 준다."}, {"n": 3, "ch": [{"e": "Individuals are given <b>credit for<\/b>", "k": "개인들은 ~에 대한 <b>공로를 인정받는다<\/b>"}, {"e": "major <b>breakthroughs<\/b>.", "k": "주요한 <b>획기적 발견<\/b>에 대한."}], "easy": "큰 발견은 한 개인의 공으로 돌려져요.", "gist": "영웅 중심 시각 ①. 큰 발견의 공을 개인에게 돌린다."}, {"n": 4, "ch": [{"e": "Marie Curie is treated", "k": "Marie Curie는 간주된다"}, {"e": "<b>as if<\/b> she worked alone", "k": "마치 그녀<sp ."}, {"n": 8, "ch": [{"e": "<b>Once<\/b> we start understanding", "k": "일단 우리가 이해하기 시작하면"}, {"e": "that knowledge isn’t all in the head,", "k": "지식이 모두 (한 명의) 머릿속에 있지 않고,"}, {"e": "that it’s <b>shared<\/b> within a community,", "k": "그것<span class=\"r\">(= 지식)<\/span>이 공동체 속에서 <b>공유된다는<\/b> 것을,"}, {"e": "our heroes change.", "k": "우리의 영웅은 바뀐다."}], "easy": "지식이 한 사람 머릿속에만 있는 게 아니라 공동체 안에서 나눠진다는 걸 이해하면, 우리가 생각하는 영웅도 달라져요.", "gist": "빈칸의 정답 단서. shared within a community(공동체 속에서 공유됨) = 지식의 집단적 속성."}, {"n": 9, "ch": [{"e": "<b>Instead of<\/b> focusing on the individual,", "k": "개인에게 초점을 맞추는 <b>대신에<\/b>,"}, {"e": "we begin to focus", "k": "우리는 초점을 맞추기 시작한다"}, {"e": "on a larger group.", "k": "더 큰 집단에."}], "easy": "한 개인 대신 더 큰 집단을 바라보게 돼요.", "gist": "결론. 개인에서 집단으로 시선이 옮겨 간다. 그래서 빈칸은 the collective nature of knowledge."}]}, {"no": "09", "typ": "글의 순서", "src": "2018년 3월 36번", "evn": [4, 5, 2, 3, 6], "ev_en": "(B) Whether someone does or doesn't is a function of environment, life experiences, and personal choices. / However, there are personality traits and characteristics commonly associated with entrepreneurs. / (A) These traits are developed over time and evolve from an individual's social context. / For example, people with parents who were self-employed are more likely to become entrepreneurs. / (C) After witnessing a father's or mother's independence in the workplace, an individual is more likely to find independence appealing.", "ev_ko": [[4, "(B) 어떤 사람이 그렇게 하는지 그렇게 하지 않는지(기업가가 되느냐 되지 않느냐)는 환경, 인생 경험, 그리고 개인의 선택의 작용이다(상호 작용으로 결정된다)."], [5, "(B) 하지만, 기업가와 흔히 연관되어 있는 성격 특성과 특징이 있다."], [2, "(A) 이러한 특성들은 시간이 흐르면서 발달하고 개인의 사회적 배경으로부터 진화한다."], [3, "(A) 예를 들어, 자영업을 하는 부모를 가진 사람들은 기업가가 될 가능성이 더 높다."], [6, "(C) 직장에서의 아버지나 어머니의 독립성을 목격한 후에, 개인은 독립을 매력적이라고 생각하게 될 가능성이 더 높다."]], "why": ["순서 문제는 <b>지시어와 연결어<\/b>를 따라가면 됩니다", "주어진 글 끝에 <b>become one<\/b>(기업가가 되다)이 나옵니다", "(B)의 <b>Whether someone does or doesn't<\/b>는 이 '되느냐 되지 않느냐'를 받으므로 <b>(B)가 먼저<\/b>입니다", "(B) 끝에 <b>personality traits<\/b>(성격 특성)가 나오고, (A)의 <b>These traits<\/b>가 그 특성을 가리키므로 그다음은 (A)입니다", "(A)는 <b>For example<\/b>로 자영업 부모의 예를 듭니다", "(C)는 그 부모의 영향을 이어받아 부모의 독립성을 목격한 경험을 풀고, <b>Similarly<\/b>로 비슷한 예를 하나 더합니다", "그래서 (C)가 마지막입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)를 맨 앞에 두면 <b>These traits<\/b>가 가리킬 특성이 앞에 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": true, "e": ["become one → Whether someone does or doesn't → These traits → For example(부모 예시) → 그 예를 이어 가는 (C)로 자연스럽게 이어집니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["(B)가 성격 특성으로 끝나므로 <b>These traits<\/b>가 바로 이어져야 합니다", "사이에 (C)가 끼면 가리킬 대상과 떨어집니다", "또 (C)는 부모의 독립성을 목격한다는 구체적인 이야기인데, 부모 이야기는 (A)의 <b>For example<\/b>(자영업 부모)에서 먼저 나옵니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C)가 맨 앞이면 주어진 글에서 곧바로 부모의 독립성 이야기로 건너뜁니다", "또 (A)의 <b>These traits<\/b>가 가리킬 특성이 (B)에 있는데 (B)가 뒤에 옵니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(C)가 맨 앞이면 주어진 글에서 곧바로 부모의 독립성 이야기로 건너뜁니다", "또 (C)의 부모 이야기는 (A)의 <b>For example<\/b>(자영업 부모) 뒤에 이어져야 자연스럽습니다."]}], "tr": ["연구들은 기업가가 되도록 '타고난' 사람은 없으며, 누구든지 기업가가 될 잠재력을 가지고 있다는 것을 보여 준다.", "(A) 이러한 특성들은 시간이 흐르면서 발달하고 개인의 사회적 배경으로부터 진화한다.", "(A) 예를 들어, 자영업을 하는 부모를 가진 사람들은 기업가가 될 가능성이 더 높다.", "(B) 어떤 사람이 그렇게 하는지 그렇게 하지 않는지(기업가가 되느냐 되지 않느냐)는 환경, 인생 경험, 그리고 개인의 선택의 작용이다(상호 작용으로 결정된다).", "(B) 하지만, 기업가와 흔히 연관되어 있는 성격 특성과 특징이 있다.", "(C) 직장에서의 아버지나 어머니의 독립성을 목격한 후에, 개인은 독립을 매력적이라고 생각하게 될 가능성이 더 높다.", "(C) 마찬가지로, 개인적으로 기업가를 아는 사람들은 기업가 지인이나 롤 모델이 없는 사람들보다 새로운 회사를 시작하는 것에 관여할 가능성이 두 배 이상 높다."], "ps": [{"n": 1, "ch": [{"e": "Studies show", "k": "연구들은 보여 준다"}, {"e": "that <b>no one<\/b> is “born” to be an <b>entrepreneur<\/b>", "k": "기업가가 되도록 ‘타고난’ 사람은 <b>없다<\/b>는 것을"}, {"e": "and that everyone has the <b>potential<\/b>", "k": "그리고 누구나 <b>잠재력<\/b>을 가지고 있다는 것을"}, {"e": "to become one.", "k": "기업가가<span class=\"r\">(= an entrepreneur)<\/span> 될."}], "easy": "연구에 따르면 기업가로 타고나는 사람은 없고, 누구나 기업가가 될 가능성은 고 생각할."}], "easy": "직장에서 독립적으로 일하는 부모님을 본 사람은 독립을 멋지다고 느낄 가능성이 더 높아요.", "gist": "(C)의 첫 문장. (A)의 '자영업 부모' 예시를 이어 가며 부모의 영향을 더 자세히 풀어 준다."}, {"n": 7, "ch": [{"e": "<b>Similarly<\/b>,", "k": "<b>마찬가지로<\/b>,"}, {"e": "people who personally know an entrepreneur", "k": "개인적으로 기업가를 아는 사람들은"}, {"e": "are more than twice as likely", "k": "가능성이 두 배 이상 높다"}, {"e": "to be involved in starting a new firm", "k": "새로운 회사를 시작하는 데 관여할"}, {"e": "as those with no entrepreneur acquaintances or role models.", "k": "기업가 지인이나 롤 모델이 없는 사람들보다."}], "easy": "마찬가지로 아는 기업가가 있는 사람은 그런 지인이나 롤 모델이 없는 사람보다 창업에 뛰어들 가능성이 두 배 넘게 높아요.", "gist": "(C)의 마지막 문장. Similarly로 또 하나의 비슷한 예(기업가를 아는 사람)를 더한다.", "link": "마찬가지로, 개인적으로 기업가를 아는 사람들은 기업가 지인이나 롤 모델이 없는 사람들보다 새로운 회사를 시작하는 데 관여할 가능성이 두 배 이상 높다."}]}, {"no": "10", "typ": "무관한 문장", "src": "2018년 3월 35번", "evn": [1, 4], "ev_en": "In addition to controlling temperatures when handling fresh produce, control of the atmosphere is important. / ③ Though living things emit carbon dioxide when they breathe, carbon dioxide is widely considered to be a pollutant.", "ev_ko": [[1, "신선한 농산물을 취급할 때 온도를 조절하는 것뿐만 아니라 공기의 관리가 중요하다."], [4, "③ 비록 생명체는 (그들이) 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다."]], "why": ["무관한 문장 문제는 <b>첫 문장이 정한 화제<\/b>에서 벗어난 문장을 찾습니다", "1번이 정한 화제는 신선 농산물을 다룰 때의 <b>공기 관리<\/b>입니다", "①②④⑤는 습기·기체 농도·에틸렌 가스·공기 순환으로 모두 저장 중 공기 관리 이야기입니다", "반면 ③은 생명체가 내뿜는 이산화탄소가 <b>오염 물질<\/b>이라는 일반적인 진술입니다", "저장이나 품질 관리와 이어지지 않으므로 ③이 흐름과 관계없습니다."], "ch": [{"n": "①", "t": "Some moisture is needed in the air to prevent dehydration during storage, but too much moisture can encourage growth of molds.", "g": "저장하는 동안 탈수를 막기 위해 공기 중에 약간의 습기가 필요하지만, 과도한 습기는 곰팡이의 증식을 조장할 수 있다.", "ok": false, "e": ["저장 중 <b>습기 조절<\/b> 이야기로, 1번의 공기 관리를 바로 이어받습니다."]}, {"n": "②", "t": "Some commercial storage units have controlled atmospheres, with the levels of both carbon dioxide and moisture being regulated carefully.", "g": "일부 상업 저장 시설들은 이산화탄소와 습기 두 가지 모두의 수준이 조심스럽게 조절되는 공기 농도 조절 장치들을 갖고 있다.", "ok": false, "e": ["실제 저장 시설이 이산화탄소와 습기 <b>농도를 조절하는 예<\/b>입니다", "화제 안에 있습니다."]}, {"n": "③", "t": "Though living things emit carbon dioxide when they breathe, carbon dioxide is widely considered to be a pollutant.", "g": "비록 생명체는 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다.", "ok": true, "e": ["이산화탄소를 <b>오염 물질<\/b>이라고 하는 일반 진술입니다", "농산물 저장이나 품질과 연결되지 않아 흐름에서 벗어납니다."]}, {"n": "④", "t": "Sometimes other gases, such as ethylene gas, may be introduced at controlled levels to help achieve optimal quality of bananas and other fresh produce.", "g": "바나나나 다른 신선한 농산물의 최상의 품질을 달성하는 것을 돕기 위해, 때때로 에틸렌 가스 같은 다른 기체들이 조절된 수준에서 투입될 수 있다.", "ok": false, "e": ["이산화탄소 말고 <b>다른 기체(에틸렌)<\/b>를 조절해 넣어 농산물의 <b>최상의 품질<\/b>을 얻는다는 내용입니다", "화제에 맞습니다."]}, {"n": "⑤", "t": "Related to the control of gases and moisture is the need for some circulation of air among the stored foods.", "g": "저장된 식품들 사이에 약간의 공기 순환이 필요하다는 점은 기체와 습기의 조절과 관련이 있다.", "ok": false, "e": ["<b>Related to the control of gases and moisture<\/b>로 앞 내용을 명시적으로 받아 공기 순환으로 이어 갑니다."]}], "tr": ["신선한 농산물을 취급할 때 온도를 조절하는 것뿐만 아니라 공기의 관리가 중요하다.", "① 저장하는 동안 탈수를 막기 위해서 공기 중에 약간의 습기가 필요하지만, 과도한 습기는 곰팡이의 증식을 조장할 수 있다.", "② 일부 상업 저장 시설들은 이산화탄소와 습기 두 가지 모두의 수준이 조심스럽게 조절되는 공기 농도 조절 장치들을 갖고 있다.", "③ 비록 생명체는 (그들이) 숨을 쉴 때 이산화탄소를 내뿜지만, 이산화탄소는 오염 물질로 널리 알려져 있다.", "④ 바나나나 다른 신선한 농산물의 최상의 품질을 달성하는 것을 돕기 위해서 때때로 에틸렌 가스 같은 다른 기체들이 조절된 수준에서 투입될 수 있다.", "⑤ 저장된 식품들 사이에 약간의 공기 순환의 필요성은 기체와 습기의 조절과 관련이 있다."], "ps": [{"n": 1, "ch": [{"e": "<b>In addition to<\/b> controlling temperatures", "k": "온도를 조절하는 것<b>뿐만 아니라<\/b>"}, {"e": "when handling fresh produce,", "k": "신선한 농산물을 취급할 때,"}, {"e": "control of the atmosphere is important.", "k": "공기의 관리가 중요하다."}], "easy": "신선한 농산물을 다룰 때는 온도 조절만큼 공기 관리도 중요해요.", "gist": "글의 화제. 이 글은 농산물 저장 중 '공기 관리'를 이야기한다. 무관한 문장은 이 화제에서 벗어난 문장이다."}, {"n": 2, "ch": [{"e": "① Some <b>moisture<\/b> is needed in the air", "k": "① 공기 중에 약간의 <b>습기<\/b>가 필요하다"}, {"e": "to prevent <b>dehydration<\/b> during storage,", "k": "저장하는 동안 <b>탈수<\/b>를 막기  없는 사람보다 창업에 뛰어들 가능성이 두 배 이상 높다.", "ana": "<b>twice as ~ as</b>는 '두 배만큼 ~한'인 <b>배수 표현</b>이고, 앞에 more than이 붙어 '두 배 넘게'가 됩니다. 뒤의 <b>as</b>가 비교 대상을 이끄는 접속사라는 것을 놓치면 '~로서'로 잘못 읽습니다. 주어 <b>people</b> 뒤의 <b>who ~ entrepreneur</b>는 관계사절이고, 진짜 동사는 <b>are</b>입니다. <b>those with</b>는 '~을 가진 사람들'입니다.", "pe": "\u0001Similarly\u0002, / people / \u0001who personally<sup>1</sup> know an entrepreneur\u0002 / are \u0001more than twice\u0002 as likely<sup>2</sup> to be involved \u0001in<sup>3</sup> starting a new firm<sup>4</sup>\u0002 / \u0001as those with no entrepreneur acquaintances<sup>5</sup> or role models\u0002.", "pk": "\u0001마찬가지로\u0002 / 사람들은 / \u0001기업가를 개인적으로 아는\u0002 / \u0001새 회사를 창업하는 데\u0002 관여할 가능성이 \u0001두 배 넘게\u0002 높다 / \u0001기업가 지인이나 역할 모델이 없는 사람들보다\u0002", "core": "사람들은 관여할 가능성이 높다.", "tags": ["Similarly = 접속부사: 문장 전체를 꾸밈", "주어 people: 동사가 나올 때까지 기다림", "who ~ = 관계절(형용사절, 주격): people을 꾸밈", "동사 are + 보어 likely to be involved (SVC). more than twice = 부사구: as likely를 꾸밈. in starting ~ = 전치사구(부사구): be involved를 꾸밈, 거의 필수에 가까운 부사구", "as ~ = 비교 부사구(<b>배수 비교</b>): likely를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어 뒤 관계절과 배수 비교가 겹쳐 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: people (사람들)", "V: are (be ~이다)", "C: more than twice as likely (두 배 넘게 ~할 가능성이 있는, likely ~할 것 같은)", "뼈대 = <b>people are more than twice as likely</b>"]}, {"t": "주어 뒤 <b>who personally know an entrepreneur</b>는 <b>people을 꾸미는 관계절</b>이다. who = people (사람들)이다. 이 절이 are를 멀리 떼어 놓았다.", "sub": ["personally 개인적으로, entrepreneur 기업가"]}, {"t": "<b>to be involved in starting a new firm</b>은 likely를 꾸미는 to부정사이다 (be likely to V ~할 것 같다). 형용사 뒤 to부정사는 뼈대 밖 수식어로 둔다(문형 기준).", "sub": ["be involved in ~에 관여하다 (involve 포함시키다), start 시작하다, firm 회사. in 뒤의 starting은 동명사", "새 회사를 창업하는 데 관여할"]}, {"t": "<b>as those with no entrepreneur acquaintances or role models</b>는 비교 대상이다. 'twice as ~ as'의 두 번째 as이다.", "sub": ["those = people (사람들), acquaintance 지인, role model 역할 모델", "기업가 지인이나 역할 모델이 없는 사람들보다"]}, {"t": "함정: 뒤의 as는 '~로서'가 아니라 비교의 as이다. Similarly는 '마찬가지로'라는 접속 부사이다."}], "sum": "기업가를 아는 사람은 창업 가능성이 두 배 넘게 높음"}, {"i": "06", "q": "10", "s": "3", "title": "S+V+O + with+명사+being p.p.", "eng": "Some commercial<sup>1</sup> storage units<sup>2</sup> have controlled atmospheres<sup>3</sup>, / with the levels of both carbon dioxide<sup>4</sup> and moisture / being regulated<sup>5</sup> carefully.", "notes": [["1", "commercial", "상업의"], ["2", "storage unit", "저장 설비"], ["3", "atmosphere", "대기, 공기"], ["4", "carbon dioxide", "이산화탄소"], ["5", "regulate", "조절하다"]], "lit": "일부 상업용 저장 설비는 조절된 공기를 갖추고 있다 / 이산화탄소와 수분 양쪽의 농도가 / 세심하게 조절된 채로", "nat": "일부 상업용 저장 설비는 이산화탄소와 수분 농도를 세심하게 조절하는 공기 조절 장치를 갖추고 있다.", "ana": "<b>with + 명사 + being p.p.</b>는 '~가 …된 채로'인 <b>부대상황</b>입니다. being이 보이면 그 앞 명사가 <b>의미상 주어</b>이고, 뒤의 분사와 <b>수동 관계</b>라는 뜻입니다. 이 with 덩어리 전체가 부사 역할이므로, 문장의 진짜 동사는 앞의 <b>have</b> 하나입니다. <b>both A and B</b>는 the levels를 꾸미는 말이라 농도가 두 가지임을 알려 줍니다.", "pe": "Some \u0001commercial<sup>1</sup>\u0002 storage units<sup>2</sup> have \u0001controlled\u0002 atmospheres<sup>3</sup>, / \u0001with the levels of both carbon dioxide<sup>4</sup> and moisture\u0002 / \u0001being regulated<sup>5</sup> carefully\u0002.", "pk": "일부 \u0001상업용\u0002 저장 설비는 조절된 공기를 갖추고 있다 / \u0001이산화탄소와 수분 양쪽의 농도가\u0002 / \u0001세심하게 조절된 채로\u0002", "core": "일부 저장 설비는 공기를 갖추고 있다.", "tags": ["주어 units + 동사 have + 목적어 atmospheres. commercial = 형용사: units를 꾸밈. controlled = 형용사(분사): atmospheres를 꾸밈", "with the levels ~ = <b>with 분사구문</b>(부사적: 부대상황): have 문장을 꾸밈. levels가 의미상 주어", "being regulated carefully = with 분사구문의 분사 부분 (수동, 조절되는 채로)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 끝의 with 구문이 길어 보이게 만든다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Some commercial storage units (일부 상업용 저장 설비, commercial 상업용의, storage 저장, unit 설비)", "V: have (have 가지다)", "O: controlled atmospheres (조절된 공기 환경, controlled는 형용사, atmosphere 대기/공기)", "뼈대 = <b>Some commercial storage units have controlled atmospheres</b>"]}, {"t": "뒤의 <b>with the levels of both carbon dioxide and moisture being regulated carefully</b>는 <b>부대상황의 with 구문</b>이다. '~가 …된 채로'라는 뜻이다.", "sub": ["the levels of ~ = ~의 농도 (level 수준)", "both carbon dioxide and moisture = 이산화탄소와 수분 둘 다 (carbon dioxide 이산화탄소, moisture 수분)", "being regulated carefully = 세심하게 조절되는 (regulate 조절하다)"]}, {"t": "with 뒤 명사(the levels)가 being p.p.의 <b>의미상 주어</b>이며 수동 관계이다. 이 구문 전체가 부사처럼 쓰인다."}, {"t": "함정: 진짜 동사는 have 하나이다. being regulated는 문장의 동사가 아니다."}], "sum": "일부 저장 설비는 이산화탄소·수분 농도를 조절한 공기 환경 갖춤"}, {"i": "07", "q": "10", "s": "6", "title": "도치: 분사구가 문두 + 수동태 S+V(1형식)", "eng": "Related to<sup>1</sup> the control of gases and moisture / is the need for some circulation<sup>2</sup> of air / among the stored<sup>3</sup> foods.", "notes": [["1", "be related to", "~와 관련되다"], ["2", "circulation", "순환"], ["3", "stored food", "저장된 식품"]], "lit": "기체와 수분의 조절과 관련된 것은 / 공기 순환의 필요성이다 / 저장된 식품들 사이의", "nat": "기체와 수분 조절과 맞물려 있는 것이, 저장된 식품 사이로 공기가 어느 정도 순환되어야 한다는 점이다.", "ana": "<b>보어가 문두로 나간 도치</b>입니다. 원래 어순은 <b>The need for some circulation of air is related to the control of gases and moisture</b>입니다. Related를 동사로 착각하면 주어를 찾지 못합니다 — <b>진짜 주어는 is 뒤의 the need</b>입니다. 문장이 <b>과거분사로 시작하고 곧바로 be동사</b>가 나오면 도치를 의심하세요. <b>among</b>은 셋 이상 사이를 뜻합니다.", "pe": "Related \u0001to<sup>1</sup> the control \u0001of gases and moisture\u0002\u0002 / is the need \u0001for some circulation<sup>2</sup> of air\u0002 / \u0001among the \u0001stored<sup>3</sup>\u0002 foods\u0002.", "pk": "\u0001\u0001기체와 수분의\u0002 조절과\u0002 관련된 것은 / \u0001공기 순환의\u0002 필요성이다 / \u0001\u0001저장된\u0002 식품들 사이의\u0002", "core": "관련된 것은 필요성이다.", "tags": ["<b>수동태 도치</b>: Related가 문두로. to the control ~ = 전치사구(부사구): Related를 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]. of gases and moisture = 형용사구: control을 꾸밈", "동사 is + 주어 the need (주어가 뒤에 있음). for ~ air = 전치사구(형용사구): need를 꾸밈", "among ~ foods = 전치사구(형용사구): circulation을 꾸밈. stored = 형용사(분사): foods를 꾸밈"], "steps": [{"t": "이 문장은 <b>분사구가 앞으로 나간 도치 문장, 즉 수동태 1형식</b>이다. 분사구가 문장 맨 앞으로 나가 길어 보인다."}, {"t": "원래 어순으로 되돌려 뼈대를 찾는다.", "sub": ["원래 = The need ... is related to the control of gases and moisture", "S: the need (필요성, need 필요)", "V: is related (relate 관련시키다의 수동태, ~와 관련되어 있다)", "Related to the control of gases and moisture (기체와 수분의 조절과, related to ~와 관련된, control 조절, gas 기체, moisture 수분)에서 to 이하는 거의 필수에 가까운 부사구이지만 뼈대 밖 수식어로 둔다.", "수동태 주절은 1형식으로 본다(문형 기준).", "뼈대 = <b>(Related ~) is the need</b>"]}, {"t": "주어 <b>the need for some circulation of air among the stored foods</b>가 길다.", "sub": ["circulation 순환, air 공기", "among the stored foods = 저장된 식품들 사이의 (among 셋 이상 사이의, stored는 foods를 꾸미는 과거분사)"]}, {"t": "함정: Related를 문장의 동사로 보면 주어를 못 찾는다. 과거분사로 시작하고 바로 be동사가 나오면 도치를 의심한다."}], "sum": "기체·수분 조절과 맞물려, 식품 사이 공기 순환도 필요"}, {"i": "08", "q": "11", "s": "3", "title": "S+V(1형식) + 과거분사 후치 + 관계절", "eng": "The scenarios<sup>1</sup> involved in<sup>2</sup> the surveys / varied<sup>3</sup> in the number of pedestrian<sup>4</sup> and passenger<sup>5</sup> lives / that could be saved, / among other factors<sup>6</sup>.", "notes": [["1", "scenario", "시나리오, 상황"], ["2", "involved in", "~에 포함된"], ["3", "vary in", "~에서 서로 다르다"], ["4", "pedestrian", "보행자"], ["5", "passenger", "승객"], ["6", "factor", "요인"]], "lit": "그 설문에 포함된 시나리오들은 / 보행자와 승객의 생명 수에서 서로 달랐다 / 구할 수 있는 / 여러 요인 중에서도", "nat": "설문에 포함된 상황들은 여러 요인 가운데서도 특히 구할 수 있는 보행자와 승객의 목숨 수에서 서로 달랐다.", "ana": "<b>involved</b>는 동사가 아니라 앞의 <b>The scenarios</b>를 꾸미는 <b>과거분사</b>입니다(= which were involved). 이것을 동사로 보면 뒤의 varied가 갈 곳이 없어집니다 — <b>진짜 동사는 varied</b>입니다. <b>vary in A</b>는 'A에서 서로 다르다'입니다. 맨 뒤 <b>that could be saved</b>는 lives를 꾸미는 관계사절이고, <b>among other factors</b>는 '여러 요인 중에서도'라는 삽입 표현입니다.", "pe": "The scenarios<sup>1</sup> \u0001involved in<sup>2</sup> the surveys\u0002 / varied<sup>3</sup> \u0001in the number \u0001of pedestrian<sup>4</sup> and passenger<sup>5</sup> lives\u0002\u0002 / \u0001that could be saved\u0002, / \u0001among other factors<sup>6</sup>\u0002.", "pk": "\u0001그 설문에 포함된\u0002 시나리오들은 / \u0001보행자와 승객의 생명 수에서\u0002 서로 달랐다 / \u0001구할 수 있는\u0002 / \u0001여러 요인 중에서도\u0002", "core": "시나리오들은 서로 달랐다.", "tags": ["주어 scenarios. involved in ~ = 과거분사구(형용사적): scenarios를 꾸밈", "동사 varied (1형식). in the number of ~ lives = 거의 필수에 가까운 부사구(vary in) [기준: 문형 기준]. of ~ lives = 형용사구: number를 꾸밈", "that could be saved = 관계절(형용사절, 주격): lives를 꾸밈", "among other factors = 전치사구(부사구): varied를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 주어를 꾸미는 분사구와 목적어 없는 동사 뒤에 수식이 길게 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The scenarios (상황들, scenario 시나리오/상황)", "V: varied (vary 서로 다르다의 과거형)", "뼈대 = <b>The scenarios varied</b>"]}, {"t": "주어 뒤 <b>involved in the surveys</b>는 scenarios를 뒤에서 꾸미는 <b>과거분사구</b>이다. 'the surveys에 포함된'(involve 포함하다, survey 설문)이다.", "sub": ["함정: involved를 동사로 보면 varied가 갈 곳이 없다."]}, {"t": "<b>in the number of pedestrian and passenger lives</b>는 varied 뒤의 전치사구이다. vary in A는 'A에서 다르다'이고, in 이하는 거의 필수에 가까운 부사구이다.", "sub": ["number 수, pedestrian 보행자, passenger 승객, lives는 life 생명의 복수형"]}, {"t": "<b>that could be saved</b>는 lives를 꾸미는 <b>관계절</b>이다. that = lives이고, '구할 수 있는'(save 구하다)이다.", "sub": ["among other factors는 '여러 요인 중에서도'라는 부사구 (factor 요인)"]}], "sum": "설문 속 상황들, 구할 수 있는 보행자·승객 수 등에서 서로 다름"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2023년 6월 31번", "ans": "①", "tr": [["1", "경영 전략과 환경을 연구하던 과정에서 Michael Porter는 독특한 패턴 하나를 발견했다. 기업들이 규제에서 오히려 이익을 얻고 있는 것처럼 보였던 것이다."], ["2", "그는 또한 더 엄격한 규제가 느슨한 규제보다 더 많은 혁신을 이끌어 내고 있다는 것도 알아냈다."], ["3", "네덜란드의 화훼 산업이 그 실례를 보여 준다."], ["4", "여러 해 동안, 네덜란드의 세계적으로 유명한 튤립과 절화를 생산하던 회사들은 비료와 살충제로 그 나라의 물과 토양을 오염시키고 있기도 했다."], ["5", "1991년 네덜란드 정부는 2000년까지 살충제 사용량을 절반으로 줄이겠다는 정책을 채택했고, 그 목표는 결국 이루어졌다."], ["6", "점점 엄격해지는 규제에 부딪히자, 온실 재배 농가들은 살충제를 덜 쓰면서도 제품의 질을 유지하려면 새로운 방법을 개발해야 한다는 것을 깨달았다."], ["7", "그에 대응해 그들은 순환식 폐쇄 시스템으로 물을 돌리고 암면 배양판에서 꽃을 키우는 재배 방식으로 전환했다."], ["8", "그 새 시스템은 환경으로 배출되는 오염을 줄였을 뿐 아니라, 재배 조건을 더 정밀하게 통제할 수 있게 해 주어 이익까지 늘려 주었다."]], "evh": "6 · 7 · 8번 문장", "ev": [{"en": true, "h": "Facing increasingly strict regulation, greenhouse growers realized they had to develop new methods ... / In response, they shifted to a cultivation method that circulates water in closed-loop systems ... / The new system not only reduced the pollution ...; it also increased profits ..."}, {"en": false, "h": "빈칸이 앞쪽에 있으면 <b>뒤의 사례</b>가 빈칸을 설명합니다. 6번의 <b>develop new methods</b>, 7번의 <b>shifted to a cultivation method</b>, 8번의 <b>The new system</b>이 모두 같은 말을 반복합니다. 즉 엄격한 규제가 끌어낸 것은 <b>새로운 방법 = 혁신</b>입니다. 1번의 profiting from regulation도 그 결과입니다."}], "opts": [{"n": "①", "t": "innovation", "a": true, "x": false, "trap": false, "e": "6·7·8번의 new methods, new cultivation method, The new system이 전부 innovation 한 단어로 묶입니다."}, {"n": "②", "t": "resistance", "a": false, "x": true, "trap": true, "e": "규제에 <b>저항</b>했다는 내용이 아닙니다. 농가들은 반발한 것이 아니라 <b>새 방법을 찾아냈습니다</b>."}, {"n": "③", "t": "fairness", "a": false, "x": true, "trap": false, "e": "공정성은 지문에 등장하지 않습니다. 규제의 형평성을 따지는 글이 아닙니다."}, {"n": "④", "t": "neglect", "a": false, "x": true, "trap": false, "e": "방치했다면 오염이 줄고 이익이 늘었다는 8번을 설명할 수 없습니다. 결과와 어긋납니다."}, {"n": "⑤", "t": "unity", "a": false, "x": true, "trap": false, "e": "기업들이 <b>뭉쳤다</b>는 이야기는 없습니다. 사례는 한 산업의 기술 전환입니다."}], "w": [["in the course of", "~하는 과정에서"], ["peculiar", "독특한, 특이한"], ["profit from", "~에서 이익을 얻다"], ["regulation", "규제"], ["prompt", "촉발하다, 유발하다"], ["contaminate", "오염시키다"], ["adopt a policy", "정책을 채택하다"], ["cut ~ in half", "~을 절반으로 줄이다"], ["cultivation method", "재배 방식"], ["release", "배출하다"]]}, {"q": "08", "type": "빈칸 추론", "src": "2018년 6월 34번", "ans": "⑤", "tr": [["1", "지식의 집단적 성격을 이해하는 것은, 우리가 세상을 보는 방식에 대한 잘못된 생각을 바로잡아 줄 수 있다."], ["2", "사람들은 영웅을 좋아한다."], ["3", "주요한 발견에 대해서는 개인에게 공이 돌아간다."], ["4", "Marie Curie는 마치 혼자 힘으로 방사능을 발견한 것처럼, Newton은 마치 혼자서 운동 법칙을 알아낸 것처럼 이야기된다."], ["5", "사실은 현실 세계에서 혼자 일하는 사람은 아무도 없다는 것이다."], ["6", "과학자들은 중요한 아이디어를 내놓는 학생들이 있는 연구실을 가졌을 뿐 아니라, 비슷한 연구를 하고 비슷한 생각을 하는 동료들도 두고 있는데, 그들이 없으면 그 과학자는 아무 성과도 내지 못한다."], ["7", "게다가 다른 문제를, 때로는 다른 분야에서 연구하면서도 자기 발견과 아이디어로 여건을 마련해 주는 또 다른 과학자들이 있다."], ["8", "지식이 머릿속에만 있는 것이 아니라 공동체 안에서 공유된다는 것을 이해하기 시작하면, 우리의 영웅상은 달라진다."], ["9", "개인에게 초점을 맞추는 대신 우리는 더 큰 집단에 초점을 맞추기 시작한다."]], "evh": "5 · 8 · 9번 문장", "ev": [{"en": true, "h": "The truth is that in the real world, nobody operates alone. / Once we start understanding that knowledge isn't all in the head, that it's shared within a community, our heroes change. / Instead of focusing on the individual, we begin to focus on a larger group."}, {"en": false, "h": "빈칸이 <b>첫 문장</b>에 있으면 <b>글 전체가 반복하는 말</b>을 넣어야 합니다. 5번의 <b>nobody operates alone</b>, 8번의 <b>shared within a community</b>, 9번의 <b>a larger group</b>이 계속 같은 방향을 가리킵니다. 즉 빈칸은 <b>지식이 여럿이 함께 만드는 것</b>이라는 뜻이어야 합니다."}], "opts": [{"n": "①", "t": "the process of trial and error", "a": false, "x": true, "trap": false, "e": "시행착오라는 말은 나오지 않습니다. 지문은 <b>혼자냐 여럿이냐</b>를 따집니다."}, {"n": "②", "t": "the changeable patterns of nature", "a": false, "x": true, "trap": false, "e": "자연의 변화 양상에 관한 글이 아닙니다. laws of motion, radioactivity는 <b>예시로 든 발견</b>일 뿐입니다."}, {"n": "③", "t": "the academic superiority of scholars", "a": false, "x": true, "trap": false, "e": "학자들이 <b>더 뛰어나다</b>는 우열 이야기가 아닙니다. 오히려 개인 영웅화를 <b>경계</b>합니다."}, {"n": "④", "t": "the diversity of scientific theories", "a": false, "x": true, "trap": true, "e": "7번에 different problems, different fields가 나와 눈에 걸립니다. 그러나 그 문장의 핵심은 다양성이 아니라 <b>서로 여건을 마련해 준다</b>는 협력입니다."}, {"n": "⑤", "t": "the collective nature of knowledge", "a": true, "x": false, "trap": false, "e": "5번의 nobody operates alone, 8번의 shared within a community를 한 마디로 묶은 표현입니다."}], "w": [["appreciate", "이해하다, 인정하다"], ["false notion", "잘못된 생각"], ["be given credit for", "~에 대해 공을 인정받다"], ["breakthrough", "획기적 발견"], ["as if", "마치 ~인 것처럼"], ["operate alone", "혼자 일하다"], ["contribute", "기여하다"], ["get nowhere", "아무 성과도 못 내다"], ["set the stage", "여건을 마련하다"], ["collective", "집단의"]]}, {"q": "09", "type": "글의 순서", "src": "2018년 3월 36번", "ans": "②", "tr": [["1", "연구에 따르면 누구도 기업가로 태어나는 것은 아니며, 누구나 기업가가 될 잠재력을 지니고 있다."], ["2", "(B) 어떤 사람이 실제로 기업가가 되느냐 마느냐는 환경, function buildQuestions(){

      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());

        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){

    });
  });

}
