var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제예요. 이 글은 <b>몸의 신호를 잃게 만든 외부 메시지</b> 이야기예요. 메시지를 갑자기 <b>칭찬하는 문장</b>을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">①(3번) · 화제 잡기</span><div class=\"en\">As we grew older <mark>this inner wisdom became lost</mark> in a bewildering host of outer voices …</div><p class=\"ko\">우리가 나이가 들면서 갈피를 못 잡게 하는 다수의 외부 목소리 속에서 <mark>이 내면의 지혜는 길을 잃었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>These messages(이러한 메시지) = ②의 상충되는 메시지, 결과는 혼란</span></div><div class=\"ck-step\"><span class=\"lab\">③(5번) · 메시지 = 혼란</span><div class=\"en\">These messages created <mark>a confusion of desires, impulses, and aversions</mark> that have made us unable to just eat …</div><p class=\"ko\">이러한 메시지는 <mark>욕구, 충동, 그리고 혐오감의 혼란을</mark> 일으켰고, 그 혼란은 우리가 그저 먹는 것을 할 수 없게 만들어 왔다 …</p></div><div class=\"ck-via\"><i>▼</i><span>혼란을 만든 메시지가 갑자기 ‘도움을 줬다’로 뒤집힘</span></div><div class=\"ck-step key\"><span class=\"lab\">④(6번) · 이탈 지점</span><div class=\"en\">They have helped us <mark>see things in our right perspectives</mark>, thus having an insight into the world.</div><p class=\"ko\">그것들은 <mark>우리의 올바른 관점에서 상황을 보도록</mark> 우리를 도와주었고, 그리하여 (우리는) 세상에 대한 통찰력을 가지게 되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>④를 빼면 ③의 혼란 → ⑤의 해결책(몸의 소리 다시 듣기)으로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(7번) · 다시 제자리</span><div class=\"en\">… it is essential that we learn to <mark>turn our awareness inward</mark> and to hear again what our body is always telling us.</div><p class=\"ko\"><mark>우리의 인식을 안으로 돌리는</mark> 법과 우리 몸이 늘 말하고 있는 것을 다시 듣는 법을 배우는 것이 필수적이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">외부 메시지가 올바른 관점과 통찰력을 갖게 도와주었다<small>혼란을 만든 메시지를 갑자기 칭찬해서 흐름이 거꾸로 가요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">부모님·동료·과학 연구로부터 상충되는 메시지를 받았다</span><span class=\"why\">부모님·과학 연구 등 새 이야기가 나와 튀어 보이지만, ①의 outer voices(외부 목소리)가 누구인지 구체적으로 풀어 주는 문장이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">나이가 들며 내면의 지혜가 외부 목소리 속에서 길을 잃었다</span><span class=\"why\">this inner wisdom(이 내면의 지혜)이 2번의 instinctive awareness(본능적인 인식)를 받아서, 그것을 잃어버렸다고 화제를 잡아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">메시지가 혼란을 일으켜 딱 필요한 만큼 먹지 못하게 됐다</span><span class=\"why\">These messages(이러한 메시지)가 ②를 받아서 그 결과(confusion 혼란)를 말해요. ‘메시지 = 나쁜 영향’ 흐름 그대로예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">인식을 안으로 돌려 몸의 소리를 다시 들어야 한다</span><span class=\"why\">1·2번의 몸의 신호로 돌아가자는 결론이에요. inward(안으로)가 ①의 outer voices(외부 목소리)와 짝을 이뤄요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When we were infants,</div><div class=\"k\">우리가 유아였을 때,</div></div><div class=\"rc\"><div class=\"e\">we were tuned in to the signals from our body</div><div class=\"k\">우리는 우리 몸으로부터의 신호에 맞춰져 있었다</div></div><div class=\"rc\"><div class=\"e\">that told us when to eat and when to stop.</div><div class=\"k\">(그 신호는) 우리에게 언제 먹어야 하고 언제 멈춰야 하는지 알려 주는</div></div><div class=\"rnat\">우리가 유아였을 때, 우리는 언제 먹어야 하는지 그리고 언제 멈추어야 하는지 (우리에게) 알려 주는 우리 몸으로부터의 신호에 맞춰져 있었다.</div><div class=\"rst\">아기 때 내 동생은 배고프면 울고, 배부르면 고개를 홱 돌렸어요. 지문도 아기 때는 <b>몸의 신호</b>에 맞춰져 있었다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We had an instinctive awareness</div><div class=\"k\">우리는 본능적인 인식을 가지고 있었다</div></div><div class=\"rc\"><div class=\"e\">of what foods and how much food</div><div class=\"k\">어떤 음식과 얼마나 많은 음식인지에 대한</div></div><div class=\"rc\"><div class=\"e\">our body needed.</div><div class=\"k\">우리 몸이 필요로 하는지.</div></div><div class=\"rnat\">우리는 우리의 몸이 어떤 음식과 얼마나 많은 음식을 필요로 하는지에 대한 본능적인 인식을 가지고 있었다.</div><div class=\"rst\">뭘, 얼마나 먹어야 하는지 아무도 안 알려 줘도 동생 몸은 알았어요. = 지문의 <b>본능적인 인식</b>이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">① As we grew older</div><div class=\"k\">① 우리가 나이가 들면서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">this inner wisdom became lost</span></div><div class=\"k\"><span class=\"cw\">이 내면의 지혜는 길을 잃었다</span></div></div><div class=\"rc\"><div class=\"e\">in a bewildering host of outer voices</div><div class=\"k\">갈피를 못 잡게 하는 다수의 외부 목소리 속에서</div></div><div class=\"rc\"><div class=\"e\">that told us how we should eat.</div><div class=\"k\">우리에게 어떻게 먹어야 하는지 알려 주는</div></div><div class=\"rnat\">① 우리가 나이가 들면서, 이 내면의 지혜는 우리가 어떻게 먹어야 하는지를 (우리에게) 알려 주는, 갈피를 못 잡게 하는 다수의 외부 목소리 속에서 길을 잃었다.</div><div class=\"rst\">① 그런데 크면서 “이건 먹어, 저건 먹지 마” 하는 말이 쏟아지자, 몸이 보내던 신호를 <b>놓쳐 버려요</b>. = 내면의 지혜가 길을 잃음.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">② We received conflicting messages</div><div class=\"k\">② 우리는 상충되는 메시지를 받았다</div></div><div class=\"rc\"><div class=\"e\">from our parents, from our peers,</div><div class=\"k\">우리의 부모님으로부터, 동료로부터,</div></div><div class=\"rc\"><div class=\"e\">and from scientific research.</div><div class=\"k\">그리고 과학 연구로부터.</div></div><div class=\"rnat\">② 우리는 우리의 부모님, 동료, 그리고 과학 연구로부터 상충되는(서로 모순되는) 메시지를 받았다.</div><div class=\"rst\">② 부모님은 “다 먹어”, 친구는 “살쪄”, 뉴스는 또 다른 말을 해요. 지문의 서로 <b>상충되는 메시지</b>예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">③ These messages created</div><div class=\"k\">③ 이러한 메시지는 일으켰다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a confusion of desires, impulses, and aversions</span></div><div class=\"k\"><span class=\"cw\">욕구, 충동, 그리고 혐오감의 혼란을</span></div></div><div class=\"rc\"><div class=\"e\">that have made us unable</div><div class=\"k\">(그 혼란은) 우리를 ~할 수 없게 만들어 왔다</div></div><div class=\"rc\"><div class=\"e\">to just eat and to eat just enough.</div><div class=\"k\">그저 먹고 딱 필요한 만큼 먹는 것을.</div></div><div class=\"rnat\">③ 이러한 메시지는, 우리가 그저 먹고 딱 필요한 만큼 먹는 것을 할 수 없게 만들어 온 욕구, 충동, 그리고 혐오감의 혼란을 일으켰다.</div><div class=\"rst\">③ 이 말들 때문에 머릿속이 뒤죽박죽돼서, 그냥 배부른 만큼만 먹는 게 어려워졌어요. = 지문의 <b>혼란</b>이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">④ They have helped us</div><div class=\"k\">④ 그것들(= 이 메시지들)은 우리를 도와주었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">see things in our right perspectives</span>,</div><div class=\"k\"><span class=\"cw\">우리의 올바른 관점에서 상황을 보도록</span>,</div></div><div class=\"rc\"><div class=\"e\">thus having an insight into the world.</div><div class=\"k\">그리하여 (우리는) 세상에 대한 통찰력을 가지게 되었다.</div></div><div class=\"rnat\">④ 그것들은 우리가 우리의 올바른 관점에서 상황을 보도록 도와주었고, 그리하여 (우리는) 세상에 대한 통찰력을 가지게 되었다.</div><div class=\"rst\">④ 그런데 갑자기 “그 말들 덕분에 세상을 바르게 보게 됐다”고 칭찬해요. 혼란 얘기와 <b>정반대</b>라 이 문장이 튀어요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">⑤ If we are to return</div><div class=\"k\">⑤ 우리가 돌아가려면</div></div><div class=\"rc\"><div class=\"e\">to a healthy and balanced relationship with food,</div><div class=\"k\">음식과의 건강하고 균형 잡힌 관계로,</div></div><div class=\"rc\"><div class=\"e\">it is essential</div><div class=\"k\">필수적이다</div></div><div class=\"rc ckc\"><div class=\"e\">that we learn to <span class=\"cw\">turn our awareness inward</span></div><div class=\"k\">우리가 <span class=\"cw\">우리의 인식을 안으로 돌리는</span> 법을 배우는 것이</div></div><div class=\"rc\"><div class=\"e\">and to hear again</div><div class=\"k\">그리고 다시 듣는 법을 (배우는 것이)</div></div><div class=\"rc\"><div class=\"e\">what our body is always telling us.</div><div class=\"k\">우리 몸이 늘 우리에게 말하고 있는 것을.</div></div><div class=\"rnat\">⑤ 우리가 음식과의 건강하고 균형 잡힌 관계로 돌아가려면, 우리가 우리의 인식을 내부로 돌리고 우리의 몸이 우리에게 늘 무엇을 말하고 있는지(내면의 소리)를 다시 듣는 것을 배우는 것이 필수적이다.</div><div class=\"rst\">⑤ 다시 건강하게 먹으려면 남의 말 말고 <b>내 몸의 소리</b>를 다시 들어야 해요. = 지문의 인식을 안으로 돌리기.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"instinctive awareness\" data-m=\"본능적인 인식\"><b>instinctive awareness</b>본능적인 인식</button><button type=\"button\" class=\"wdb\" data-w=\"inner wisdom\" data-m=\"내면의 지혜\"><b>inner wisdom</b>내면의 지혜</button><button type=\"button\" class=\"wdb\" data-w=\"bewildering\" data-m=\"갈피를 못 잡게 하는, 당혹스러운\"><b>bewildering</b>갈피를 못 잡게 하는, 당혹스러운</button><button type=\"button\" class=\"wdb\" data-w=\"conflicting\" data-m=\"상충되는, 서로 모순되는\"><b>conflicting</b>상충되는, 서로 모순되는</button><button type=\"button\" class=\"wdb\" data-w=\"aversion\" data-m=\"반감, 혐오\"><b>aversion</b>반감, 혐오</button><button type=\"button\" class=\"wdb\" data-w=\"insight\" data-m=\"통찰력\"><b>insight</b>통찰력</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심 문장을 <b>말만 바꿔 옮긴 것</b>이에요. (A)는 1번 정의의 <b>greater</b>(더 큰 = 지나친), (B)는 9번 결론 <b>however</b>(그러나) 뒤의 <b>unscientific</b>(비과학적인)을 받아 짝지으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · (A)의 단서</span><div class=\"en\">Inappropriate precision means giving information or figures to <mark>a greater degree of apparent accuracy</mark> than suits the context.</div><p class=\"ko\">부적절한 정밀성이란 상황에 적절한 것보다 <mark>더 큰 정도의 명백한 정확성으로</mark> 정보나 수치를 제시하는 것을 의미한다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>영국 성인 95.45%가 동의한다는 세제 광고</span><span><em>5번</em>모두 조사한 게 아니라 표본일 뿐</span><span><em>7번</em>소수점 둘째 자리까지는 터무니없음</span></div><div class=\"ck-eq\">⇒ 예시의 공통점 = 상황보다 지나치게 정밀한 숫자 → (A)</div></div><div class=\"ck-via\"><i>▼</i><span>however(그러나)로 ‘정밀해 보이는 숫자’의 진짜 속셈이 나옴</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 단서</span><div class=\"en\">Frequently, however, inappropriate precision is <mark>an attempt to mask</mark> <mark>the unscientific nature of a study</mark>.</div><p class=\"ko\">그러나 흔히, 부적절한 정밀성은 <mark>연구의 비과학적인 본질을</mark> <mark>감추기 위한 시도</mark>이다.</p></div><div class=\"ck-via\"><i>▼</i><span>greater degree(더 큰 정도) = (A), mask(감추다) = conceal(숨기다), unscientific(비과학적인) = lack of (B)</span></div><div class=\"ck-step key\"><span class=\"lab\">요약문 (10번) · 짝 맞추기</span><div class=\"en\">Advertisers often give us information with a(n) <mark>excessive</mark> precision, but it can be considered as an intention to conceal the lack of <mark>reliability</mark> of their research.</div><p class=\"ko\">광고회사들은 종종 <mark>과도한</mark> 정밀성을 지닌 정보를 주지만, 그것은 그들의 연구의 <mark>신뢰성</mark> 부족을 숨기기 위한 의도로 간주될 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">excessive 과도한 … reliability 신뢰성<small>1번 greater(더 큰) → excessive(과도한), 9번 unscientific(비과학적인) → 신뢰성 부족이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">excessive 과도한 … popularity 인기</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 광고라서 인기가 떠오르지만, 9번이 감춘다고 한 건 연구의 unscientific nature(비과학적인 본질)이지 인기 부족이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">sufficient 충분한 … investment 투자</span><span class=\"why\">둘 다 틀려요. 1번은 상황에 맞는 것보다 greater(더 큰) 정밀성이라 ‘충분한’이 아니고, 투자 이야기는 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">reasonable 합리적인 … integrity 진실성</span><span class=\"why\">(A)가 틀려요. 4·7번에서 95.45%, 소수점 둘째 자리는 inappropriate(부적절한)·absurd(터무니없는)라고 했지 합리적이라고 하지 않았어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">reasonable 합리적인 … availability 이용 가능성</span><span class=\"why\">둘 다 틀려요. (A)는 1번 greater(더 큰)와 반대이고, 9번이 감추는 건 비과학적인 본질이지 이용 가능성이 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Inappropriate precision means</div><div class=\"k\">부적절한 정밀성이란 ~을 의미한다</div></div><div class=\"rc\"><div class=\"e\">giving information or figures</div><div class=\"k\">정보나 수치를 제시하는 것</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">a greater degree of apparent accuracy</span></div><div class=\"k\"><span class=\"cw\">더 큰 정도의 명백한 정확성으로</span></div></div><div class=\"rc\"><div class=\"e\">than suits the context.</div><div class=\"k\">상황에 적절한 것보다.</div></div><div class=\"rnat\">부적절한 정밀성이란 상황에 적절한 것보다 더 큰 정도의 명백한 정확성으로 정보나 수치를 제시하는 것을 의미한다.</div><div class=\"rst\">학교 앞에 새 떡볶이집이 생겼어요. 지문은 상황에 비해 <b>지나치게 정확해 보이는 숫자</b>가 ‘부적절한 정밀성’이라고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">advertisers often use the results of surveys</div><div class=\"k\">광고회사들은 종종 설문조사 결과를 사용한다</div></div><div class=\"rc\"><div class=\"e\">to prove what they say about their products.</div><div class=\"k\">그들(= 광고회사들)이 제품에 대해 말하려는 것을 입증하기 위해서.</div></div><div class=\"rnat\">예를 들어, 광고회사들은 그들의 제품에 대해 말하려는 것을 입증하기 위해서 종종 설문조사 결과를 사용한다.</div><div class=\"rst\">가게 앞 전단지에 설문 결과가 붙어 있어요. 지문도 광고회사가 설문 결과로 제품 자랑을 입증하려 한다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Sometimes they claim</div><div class=\"k\">때때로 그들(= 광고회사들)은 주장한다</div></div><div class=\"rc\"><div class=\"e\">a level of precision</div><div class=\"k\">정밀성의 수준을</div></div><div class=\"rc\"><div class=\"e\">not based reliably on evidence.</div><div class=\"k\">확실하게 증거에 근거하지 않은.</div></div><div class=\"rnat\">때때로 그들은 확실하게 증거에 근거하지 않은 정밀성의 수준을 주장한다.</div><div class=\"rst\">그런데 그 숫자, 진짜 조사해서 나온 걸까요? 지문은 증거에 확실히 근거하지 않은 정밀함을 주장하기도 한다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">So, if a company selling washing powder</div><div class=\"k\">그러므로 만약 세제를 파는 한 회사가</div></div><div class=\"rc\"><div class=\"e\">claims 95.45% of British adults agree</div><div class=\"k\">95.45퍼센트의 영국 성인이 동의한다고 주장한다면,</div></div><div class=\"rc\"><div class=\"e\">that this powder washes whiter than any other,</div><div class=\"k\">(무엇에 동의하냐면) 이 세제가 다른 어떤 것(= 다른 어떤 세제)보다 더 하얗게 세탁한다는 것에,</div></div><div class=\"rc\"><div class=\"e\">then this level of precision is clearly inappropriate.</div><div class=\"k\">(그러면) 이 정밀성의 수준은 분명히 부적절한 것이다.</div></div><div class=\"rnat\">그러므로 만약 세제를 파는 한 회사가 95.45퍼센트의 영국 성인이 이 세제가 다른 어떤 것(세제)보다 더 하얗게 세탁한다는 것에 동의한다고 주장한다면, (그러면) 이 정밀성의 수준은 분명히 부적절한 것이다.</div><div class=\"rst\">“학생 95.45%가 여기가 최고래요!” 이런 식이에요. 지문의 세제 광고 95.45%처럼 <b>분명히 부적절한</b> 숫자예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It is unlikely</div><div class=\"k\">~일 것 같지 않다</div></div><div class=\"rc\"><div class=\"e\">that all British adults were surveyed,</div><div class=\"k\">모든 영국 성인이 설문조사를 받았을</div></div><div class=\"rc\"><div class=\"e\">so the results are based only on a sample</div><div class=\"k\">그래서 그 결과는 단지 표본에 근거한 것이다</div></div><div class=\"rc\"><div class=\"e\">and not the whole population.</div><div class=\"k\">그리고 (영국) 전체 인구에 근거한 것이 아니다.</div></div><div class=\"rnat\">모든 영국 성인이 설문조사를 받았을 것 같지 않으므로, 그 결과는 (영국) 전체 인구가 아니라 단지 표본에 근거한 것이다.</div><div class=\"rst\">전교생한테 다 물어봤을 리 없잖아요. 지문도 영국 성인 전체가 아니라 <b>표본</b>일 뿐이라고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">At best the company should be claiming</div><div class=\"k\">기껏해야 그 회사는 주장하고 있어야 한다</div></div><div class=\"rc\"><div class=\"e\">that over 95% of those asked</div><div class=\"k\">'질문을 받은 사람들' 중 95퍼센트 이상이</div></div><div class=\"rc\"><div class=\"e\">agreed that their powder washes whiter than any other.</div><div class=\"k\">그들의 세제가 다른 어떤 것보다 더 하얗게 세탁한다는 것에 동의했다고.</div></div><div class=\"rnat\">기껏해야 그 회사는 '질문을 받은 사람들' 중 95퍼센트 이상이 그들의 세제가 다른 어떤 것보다 더 하얗게 세탁한다는 것에 동의했다고 주장하고 있어야 한다.</div><div class=\"rst\">기껏해야 “물어본 학생 중 95% 넘게 좋대요” 정도가 맞아요. 지문의 ‘질문을 받은 사람들 중 95% 이상’이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Even if the whole population had been surveyed,</div><div class=\"k\">설령 전체 인구가 설문조사를 받았다고 할지라도,</div></div><div class=\"rc\"><div class=\"e\">to have given the result to two decimal points</div><div class=\"k\">소수점 둘째 자리까지 결과를 제시하는 것은</div></div><div class=\"rc\"><div class=\"e\">would have been absurd.</div><div class=\"k\">터무니없는 것일 것이다.</div></div><div class=\"rnat\">전체 인구가 설문조사를 받았다고 할지라도, 소수점 둘째 자리까지 결과를 제시하는 것은 터무니없는 것일 것이다.</div><div class=\"rst\">전교생을 다 물어봤어도 소수점 둘째 자리까지 쓰는 건 웃겨요. 지문도 그건 <b>터무니없다</b>고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">The effect</div><div class=\"k\">그 효과(= 소수점 둘째 자리까지 결과를 제시하는 것의 효과)는</div></div><div class=\"rc\"><div class=\"e\">is to propose</div><div class=\"k\">~을 제시하려는 것이다</div></div><div class=\"rc\"><div class=\"e\">a high degree of scientific precision</div><div class=\"k\">높은 수준의 과학적 정밀성을</div></div><div class=\"rc\"><div class=\"e\">in the research.</div><div class=\"k\">그 연구에.</div></div><div class=\"rnat\">그 효과(소수점 둘째 자리까지 결과를 제시하는 것의 효과)는 그 연구에 높은 수준의 과학적 정밀성을 제시하려는 것이다.</div><div class=\"rst\">숫자를 이렇게 쓰면 엄청 과학적으로 조사한 것처럼 보여요. 지문의 ‘높은 수준의 과학적 정밀성’을 내세우는 효과예요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">Frequently, however,</div><div class=\"k\">그러나 흔히,</div></div><div class=\"rc\"><div class=\"e\">inappropriate precision is</div><div class=\"k\">부적절한 정밀성은 ~이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">an attempt to mask</span></div><div class=\"k\"><span class=\"cw\">감추기 위한 시도</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the unscientific nature of a study</span>.</div><div class=\"k\"><span class=\"cw\">연구의 비과학적인 본질을</span>.</div></div><div class=\"rnat\">그러나 흔히 부적절한 정밀성은 연구의 비과학적인 본질을 감추기 위한 시도이다.</div><div class=\"rst\"><b>그러나</b>(however) 사실은 대충 한 조사라는 걸 <b>감추려는</b> 거예요. = 지문의 비과학적인 본질 감추기.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Advertisers often give us information</div><div class=\"k\">광고회사들은 종종 우리에게 정보를 준다</div></div><div class=\"rc ckc\"><div class=\"e\">with a(n) <span class=\"cw\">excessive precision</span>,</div><div class=\"k\"><span class=\"cw\">과도한 정밀성을 지닌</span>, ※ 문제지엔 빈칸 (A)로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\">but it can be considered</div><div class=\"k\">하지만 그것(= <span class=\"cw\">과도한 정밀성을 지닌</span> 정보를 주는 것)은 ~로 간주될 수 있다</div></div><div class=\"rc\"><div class=\"e\">as an intention to conceal the lack of</div><div class=\"k\">~의 부족을 숨기기 위한 의도로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">reliability</span> of their research.</div><div class=\"k\"><span class=\"cw\">그들의 연구의 신뢰성</span>. ※ 문제지엔 빈칸 (B)로 되어 있음</div></div><div class=\"rnat\">광고회사들은 종종 우리에게 (A)과도한 정밀성을 지닌 정보를 주지만, 그것은 그들의 연구의 (B)신뢰성 부족을 숨기기 위한 의도로 간주될 수 있다.</div><div class=\"rst\">정리하면, 광고는 <b>과도하게</b>(excessive) 정밀한 숫자로 조사의 <b>신뢰성</b>(reliability) 부족을 숨겨요. 1·9번을 합친 요약이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"inappropriate precision\" data-m=\"부적절한 정밀성\"><b>inappropriate precision</b>부적절한 정밀성</button><button type=\"button\" class=\"wdb\" data-w=\"apparent accuracy\" data-m=\"겉보기의 정확성\"><b>apparent accuracy</b>겉보기의 정확성</button><button type=\"button\" class=\"wdb\" data-w=\"sample\" data-m=\"표본\"><b>sample</b>표본</button><button type=\"button\" class=\"wdb\" data-w=\"absurd\" data-m=\"터무니없는\"><b>absurd</b>터무니없는</button><button type=\"button\" class=\"wdb\" data-w=\"mask\" data-m=\"감추다, 가리다\"><b>mask</b>감추다, 가리다</button><button type=\"button\" class=\"wdb\" data-w=\"conceal\" data-m=\"숨기다\"><b>conceal</b>숨기다</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제예요. <b>that</b>(그것)과 <b>such a feeling</b>(그런 느낌)이 가리킬 ‘느낌’이 바로 앞에 있고, 뒤 문장의 <b>this idea</b>(이 생각)가 그걸 이어 받는 자리를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>There's a reason for that</mark>: traditionally, park designers attempted <mark>to create such a feeling</mark> by planting tall trees at park boundaries …</div><p class=\"ko\">그것에 대한 <mark>이유가 있다</mark>: 전통적으로 공원 설계자들은 공원 경계에 키 큰 나무를 심어 <mark>그런 느낌을 만들어내려고</mark> 시도했다 …</p></div><div class=\"ck-via\"><i>▼</i><span>that(그것)·such a feeling(그런 느낌) = 도시와 뚜렷이 분리된 느낌</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 · 앞 문장 (⑤ 바로 앞)</span><div class=\"en\">When entering a city park, people often imagine <mark>a sharp separation</mark> from streets, cars, and buildings.</div><p class=\"ko\">도시 공원에 들어설 때, 사람들은 흔히 거리, 자동차, 그리고 건물과의 <mark>뚜렷한 분리를</mark> 상상한다.</p></div><div class=\"ck-via\"><i>▼</i><span>this idea(이 생각) = 분리의 생각, landscape architects(조경가) = 주어진 문장의 park designers(공원 설계자)</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 · 뒤 문장 (⑤ 바로 뒤)</span><div class=\"en\"><mark>What's behind this idea</mark> is not only landscape architects' desire … but a much longer history of Western thought …</div><p class=\"ko\"><mark>이 생각의 배경에는</mark> 조경가의 욕망뿐만 아니라 … 훨씬 더 오래된 서구 사상의 역사도 있다 …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>8번</em>공원에 들어서면 도시와 뚜렷이 분리된 느낌</span><span><em>주어진 문장</em>그 이유: 설계자가 나무·돌담으로 그 느낌을 만듦</span><span><em>9번</em>이 생각의 배경: 설계자의 욕망 + 서구 사상</span></div><div class=\"ck-eq\">⇒ 느낌 → 이유(설계자) → 더 깊은 배경, 세 고리가 다 맞는 자리 = ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">8번 문장과 9번 문장 사이<small>8번의 ‘분리’가 that(그것)이 되고, 9번 this idea(이 생각)가 다시 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">7번 문장과 8번 문장 사이</span><span class=\"why\">7번 trees(나무)가 주어진 문장의 tall trees(키 큰 나무)와 겹쳐 끌려요. 하지만 7번엔 such a feeling(그런 느낌)이 가리킬 ‘느낌’이 없고, 이유가 8번의 분리보다 먼저 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">4번은 공원을 만드는 순간이 자연에 대한 생각을 드러낸다는 말이라 ‘분리된 느낌’이 없어요. 5번 Indeed(실제로)도 4번을 바로 이어 받아야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">5번이 공원과 public space(공공 공간)를 구별하고 6번이 그 공공 공간의 예를 드는 중이에요. 끼어들면 이 설명이 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">6번은 광장·보도 같은 공공 공간 목록이라 that(그것)이 가리킬 느낌이 없어요. 7번이 공원만의 특징(나무·풀)으로 대조를 이어 가요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">There's a reason for that:</span></div><div class=\"k\">그것(= 사람들이 도시와의 뚜렷한 분리를 상상하는 것)에 대한 <span class=\"cw\">이유가 있다:</span></div></div><div class=\"rc\"><div class=\"e\">traditionally, park designers attempted</div><div class=\"k\">전통적으로, 공원 설계자들은 시도했다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to create such a feeling</span></div><div class=\"k\"><span class=\"cw\">그런 느낌(= 도시와 분리된 느낌)을 만들어내려고</span></div></div><div class=\"rc\"><div class=\"e\">by planting tall trees at park boundaries,</div><div class=\"k\">공원 경계에 키 큰 나무를 심고,</div></div><div class=\"rc\"><div class=\"e\">building stone walls,</div><div class=\"k\">돌담을 쌓고,</div></div><div class=\"rc\"><div class=\"e\">and constructing other means of partition.</div><div class=\"k\">다른 칸막이 수단을 세움으로써.</div></div><div class=\"rnat\">그것에 대한 이유가 있는데, 전통적으로 공원 설계자들은 공원 경계에 키 큰 나무를 심고, 돌담을 쌓고, 다른 칸막이 수단을 세워서 그런 느낌을 만들어내려고 했다.</div><div class=\"rst\">〈주어진 문장〉 그 느낌엔 <b>이유가 있어요</b>. 공원 설계자들이 경계에 큰 나무와 돌담을 세워 <b>그런 느낌</b>을 만들었다는 게 지문의 설명이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Parks take the shape</div><div class=\"k\">공원은 형태를 취한다</div></div><div class=\"rc\"><div class=\"e\">demanded by the cultural concerns of their time.</div><div class=\"k\">그 시대의 문화적 관심사에 의해 요구되는.</div></div><div class=\"rnat\">공원은 그것이 속한 시대의 문화적 관심사가 요구하는 형태를 취한다.</div><div class=\"rst\">우리 동네 공원도 그 시대 사람들이 원하던 모양으로 만들어졌어요. 지문은 공원이 시대의 문화적 관심사를 따른다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Once parks are in place,</div><div class=\"k\">일단 공원이 마련되면,</div></div><div class=\"rc\"><div class=\"e\">they are no inert stage —</div><div class=\"k\">그것(= 공원)은 비활성화된(정지된) 단계가 아니다 —</div></div><div class=\"rc\"><div class=\"e\">their purposes and meanings are made and remade</div><div class=\"k\">그것의 목적과 의미는 만들어지고 다시 만들어진다</div></div><div class=\"rc\"><div class=\"e\">by planners and by park users.</div><div class=\"k\">계획자와 공원 이용자에 의해.</div></div><div class=\"rnat\">일단 공원이 마련되면, 그것은 비활성화된(정지된) 단계가 아닌데, 그것의 목적과 의미는 계획자와 공원 이용자에 의해 만들어지고 다시 만들어진다.</div><div class=\"rst\">공원은 한 번 만들고 끝이 아니에요. 계획하는 사람과 놀러 오는 우리가 쓰임새를 계속 새로 만들어요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Moments of park creation are particularly telling,</div><div class=\"k\">공원을 조성하는 순간들은 특히 의미가 있다,</div></div><div class=\"rc\"><div class=\"e\">however,</div><div class=\"k\">그러나</div></div><div class=\"rc\"><div class=\"e\">for they reveal and actualize ideas</div><div class=\"k\">왜냐하면 그것들(= 공원을 조성하는 순간들)은 생각을 드러내고 실현하기 때문이다</div></div><div class=\"rc\"><div class=\"e\">about nature and its relationship to urban society.</div><div class=\"k\">자연과 그것(= 자연)이 도시 사회와 갖는 관계에 대한.</div></div><div class=\"rnat\">그러나 공원을 조성하는 순간들은 특히 의미가 있는데, 자연과 그것이 도시 사회와 갖는 관계에 대한 생각을 드러내고 실현하기 때문이다.</div><div class=\"rst\">그래도 공원을 처음 만드는 순간이 특히 중요해요. 지문은 그때 자연과 도시의 관계에 대한 생각이 드러난다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">① Indeed,</div><div class=\"k\">① 실제로,</div></div><div class=\"rc\"><div class=\"e\">what distinguishes a park</div><div class=\"k\">공원을 구별하는 것은</div></div><div class=\"rc\"><div class=\"e\">from the broader category of public space</div><div class=\"k\">더 넓은 범주의 공공 공간과</div></div><div class=\"rc\"><div class=\"e\">is the representation of nature</div><div class=\"k\">자연의 표현이다</div></div><div class=\"rc\"><div class=\"e\">that parks are meant to embody.</div><div class=\"k\">공원이 구현하려고 하는.</div></div><div class=\"rnat\">① 실제로 공원을 더 넓은 범주의 공공 공간과 구별하는 것은 공원이 구현하려고 하는 자연의 표현이다.</div><div class=\"rst\">① 실제로 공원을 다른 공공 공간과 구별해 주는 건 <b>자연</b>을 담고 있다는 점이에요. = 지문 5번이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">② Public spaces include</div><div class=\"k\">② 공공 공간에는 포함된다</div></div><div class=\"rc\"><div class=\"e\">parks, concrete plazas, sidewalks,</div><div class=\"k\">공원, 콘크리트 광장, 보도,</div></div><div class=\"rc\"><div class=\"e\">even indoor atriums.</div><div class=\"k\">심지어 실내 아트리움까지.</div></div><div class=\"rnat\">② 공공 공간에는 공원, 콘크리트 광장, 보도, 심지어 실내 아트리움도 포함된다.</div><div class=\"rst\">② 공공 공간에는 공원 말고도 광장, 인도, 건물 안 넓은 홀까지 있어요. 지문의 공공 공간 목록이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">③ Parks typically have</div><div class=\"k\">③ 일반적으로 공원에는 있다</div></div><div class=\"rc\"><div class=\"e\">trees, grass, and other plants</div><div class=\"k\">나무, 풀, 그리고 다른 식물들이</div></div><div class=\"rc\"><div class=\"e\">as their central features.</div><div class=\"k\">그것의 중심적인 특색으로.</div></div><div class=\"rnat\">③ 일반적으로 공원에는 그것의 중심적인 특색으로 나무, 풀, 그리고 다른 식물들이 있다.</div><div class=\"rst\">③ 그중 공원은 나무, 잔디, 꽃이 주인공이에요. 지문도 식물이 공원의 중심 특징이라고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">④ When entering a city park,</div><div class=\"k\">④ 도시 공원에 들어설 때,</div></div><div class=\"rc\"><div class=\"e\">people often imagine</div><div class=\"k\">사람들은 흔히 상상한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a sharp separation</span></div><div class=\"k\"><span class=\"cw\">뚜렷한 분리를</span></div></div><div class=\"rc\"><div class=\"e\">from streets, cars, and buildings.</div><div class=\"k\">거리, 자동차, 그리고 건물과의.</div></div><div class=\"rnat\">④ 도시 공원에 들어설 때, 사람들은 흔히 거리, 자동차, 그리고 건물과의 뚜렷한 분리를 상상한다.</div><div class=\"rst\">④ 그래서 공원에 들어서면 차 소리, 건물이 싹 사라지고 딴 세상에 온 것 같아요. = 지문 8번의 <b>뚜렷한 분리</b>예요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">⑤ <span class=\"cw\">What's behind this idea</span></div><div class=\"k\">⑤ <span class=\"cw\">이 생각(= 사람들이 공원과 도시의 분리를 상상하는 것)의 배경에는</span></div></div><div class=\"rc\"><div class=\"e\">is not only landscape architects' desire</div><div class=\"k\">조경가의 욕망뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">to design aesthetically suggestive park spaces,</div><div class=\"k\">미적으로 시사하는 바가 많은 공원 공간을 설계하려는,</div></div><div class=\"rc\"><div class=\"e\">but a much longer history of Western thought</div><div class=\"k\">훨씬 더 오래된 서구 사상의 역사도 있다</div></div><div class=\"rc\"><div class=\"e\">that envisions cities and nature</div><div class=\"k\">도시와 자연을 상상하는</div></div><div class=\"rc\"><div class=\"e\">as antithetical spaces and oppositional forces.</div><div class=\"k\">대조적인 공간이자 반대 세력으로.</div></div><div class=\"rnat\">⑤ 이 생각의 배경에는 미적으로 시사하는 바가 많은 공원 공간을 설계하려는 조경가의 욕망뿐만 아니라 도시와 자연을 대조적인 공간이자 반대 세력으로 상상하는 훨씬 더 오래된 서구 사상의 역사도 있다.</div><div class=\"rst\">⑤ <b>이 생각</b>(this idea) 뒤에는 설계자의 바람만이 아니라, 도시와 자연을 반대로 본 서양의 오랜 생각도 있다고 지문 9번은 말해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"distinguish\" data-m=\"구별하다\"><b>distinguish</b>구별하다</button><button type=\"button\" class=\"wdb\" data-w=\"partition\" data-m=\"칸막이, 구획\"><b>partition</b>칸막이, 구획</button><button type=\"button\" class=\"wdb\" data-w=\"embody\" data-m=\"구현하다\"><b>embody</b>구현하다</button><button type=\"button\" class=\"wdb\" data-w=\"sharp separation\" data-m=\"뚜렷한 분리\"><b>sharp separation</b>뚜렷한 분리</button><button type=\"button\" class=\"wdb\" data-w=\"landscape architect\" data-m=\"조경가\"><b>landscape architect</b>조경가</button><button type=\"button\" class=\"wdb\" data-w=\"antithetical\" data-m=\"대조적인, 대립적인\"><b>antithetical</b>대조적인, 대립적인</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기 순서는 <b>사건의 고리</b>를 잡으세요. 관솔불 독서 습관 → <b>the habit</b>(그 습관)을 싫어한 아버지 → 그래도 <b>though</b>(하지만) 계속된 비밀 생활과 불빛 → <b>Instead of a house fire</b>(불이 아니라) 독서 발견 순이에요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝</span><div class=\"en\">So William <mark>formed the habit</mark> of burning pine knots in the fireplace for his nightly reading light.</div><p class=\"ko\">그래서 William은 밤마다 책을 읽는 데 쓸 불빛을 위해 벽난로에 관솔을 태우는 <mark>습관이 생겼다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>the habit(그 습관) = (A)에서 생긴 관솔불 독서 습관</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 첫 번째 고리</span><div class=\"en\">But his father <mark>didn't like the habit</mark> and tried to stop it.</div><p class=\"ko\">하지만 그의 아버지는 <mark>그 습관을 좋아하지 않았고</mark> 그것을 그만두게 하려 애썼다.</p></div><div class=\"ck-via\"><i>▼</i><span>아버지가 막았는데도(though 하지만) 몰래 계속 → 그래서 ‘비밀’ 생활</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) 끝 → (B) · 두 번째 고리</span><div class=\"en\">William's “<mark>secret life</mark>” continued for some time, <mark>though</mark>.</div><p class=\"ko\"><mark>하지만</mark> William의 ‘<mark>비밀스러운 생활</mark>’은 얼마간 지속되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>(B) 끝에서 아버지가 불이 난 줄 알고 뛰어 내려옴 → 불이 아니라 책 읽는 아들</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) 끝 → (C) · 세 번째 고리</span><div class=\"en\"><mark>Instead of a house fire, however</mark>, he saw his son William lying peacefully before the fireplace …</div><p class=\"ko\"><mark>하지만 집에 난 불 대신에</mark>, 그는 벽난로 앞에 평화롭게 누워 있는 아들 William을 보았다 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">(D) – (B) – (C)<small>습관 → 반대 → 몰래 계속·불빛 → 불이 아니라 독서, 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(C)의 Instead of a house fire(집에 난 불 대신에)는 ‘불이 났다’는 착각이 먼저 있어야 해요. 그 착각은 (B) 끝 13번에 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(B)의 secret life(비밀스러운 생활)와 though(하지만)는 아버지가 막은 뒤라야 말이 돼요. 막는 장면은 (D)에 있어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(A) 바로 뒤에 Instead of a house fire(집에 난 불 대신에)가 나오면, 불 이야기가 한 번도 없어서 뜬금없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(C)가 맨 앞이면 불이 난 줄 아는 장면(B) 전에 ‘불이 아니었다’가 나와요. (D)의 the habit(그 습관)도 (A)와 떨어져요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">William Miller stayed up</div><div class=\"k\">(A-1) William Miller는 깨어 있었다</div></div><div class=\"rc\"><div class=\"e\">after the family had gone to bed,</div><div class=\"k\">가족이 잠자리에 든 뒤에,</div></div><div class=\"rc\"><div class=\"e\">then read until the morning.</div><div class=\"k\">그리고 아침까지 책을 읽었다.</div></div><div class=\"rnat\">(A-1) William Miller는 가족들이 모두 잠자리에 든 뒤, 잠들지 않고 깨어서 아침까지 책을 읽었다.</div><div class=\"rst\">윌리엄은 가족이 다 잠든 뒤에도 깨어 있다가 아침까지 책을 읽었어요. = 지문 (A)의 첫 장면이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">Candles were expensive,</div><div class=\"k\">(A-2) 초는 비쌌다,</div></div><div class=\"rc\"><div class=\"e\">but there were plenty of pine knots,</div><div class=\"k\">하지만 관솔은 많이 있었다,</div></div><div class=\"rc\"><div class=\"e\">and all (a) he had to do</div><div class=\"k\">그리고 (a)그(= William)가 해야 했던 일의 전부는</div></div><div class=\"rc\"><div class=\"e\">was gather them from the woods.</div><div class=\"k\">숲에서 그것들(= 관솔)을 모으는 것이었다.</div></div><div class=\"rnat\">(A-2) 초는 비쌌지만 관솔은 많이 있었고, (a)그(William)가 해야 했던 일의 전부는 숲에서 그것들을 모으는 것이었다(그는 단지 숲에서 그것들을 모으기만 하면 되었다).</div><div class=\"rst\">초는 비쌌지만 숲에 가면 불 잘 붙는 <b>관솔</b>(pine knots)이 잔뜩 있었어요. 지문 2번처럼 주워 오기만 하면 됐죠.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">So William <span class=\"cw\">formed the habit</span></div><div class=\"k\">(A-3) 그래서 William은 <span class=\"cw\">습관이 생겼다</span></div></div><div class=\"rc\"><div class=\"e\">of burning pine knots in the fireplace</div><div class=\"k\">벽난로에 관솔을 태우는</div></div><div class=\"rc\"><div class=\"e\">for his nightly reading light.</div><div class=\"k\">밤마다 책을 읽는 데 쓸 불빛을 위해.</div></div><div class=\"rnat\">(A-3) 그래서 William은 야간 독서등(밤마다 책을 읽는 데 필요한 불빛)을 위해서 벽난로에 관솔을 태우는 습관이 생겼다.</div><div class=\"rst\">그래서 밤마다 벽난로에 관솔을 태워 그 불빛으로 책을 읽는 <b>습관</b>이 생겼어요. = (A)의 끝.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc ckc\"><div class=\"e\">But his father <span class=\"cw\">didn't like the habit</span></div><div class=\"k\">(D-1) 하지만 그의 아버지는 <span class=\"cw\">그 습관(= 관솔불로 밤에 책을 읽는 습관)을 좋아하지 않았다</span></div></div><div class=\"rc\"><div class=\"e\">and tried to stop it.</div><div class=\"k\">그리고 그것(= 그 습관)을 그만두게 하려 애썼다.</div></div><div class=\"rnat\">(D-1) 하지만 그의 아버지는 그 습관을 좋아하지 않았고 그것을 그만두게 하려 애썼다.</div><div class=\"rst\"><b>하지만</b>(But) 아버지는 <b>그 습관</b>(the habit)이 싫어서 그만두게 하려 했어요. (A)의 습관을 받는 (D)의 시작이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">His father felt</div><div class=\"k\">(D-2) 그의 아버지는 느꼈다</div></div><div class=\"rc\"><div class=\"e\">that his son's late-night reading</div><div class=\"k\">아들의 늦은 밤 독서가</div></div><div class=\"rc\"><div class=\"e\">would cut into (e) his energy</div><div class=\"k\">(e)그의 힘(= William의 힘)을 줄일 것이라고</div></div><div class=\"rc\"><div class=\"e\">for the next day's work.</div><div class=\"k\">다음 날의 일을 위한.</div></div><div class=\"rnat\">(D-2) 그의 아버지는 아들의 늦은 밤 독서가 다음 날의 일을 위한(다음 날 일에 필요한) (e)그(William)의 힘을 줄일 것이라고 느꼈다.</div><div class=\"rst\">아버지는 밤늦게 책을 읽으면 다음 날 일할 힘이 줄어들 거라고 봤어요. = 지문 5번의 cut into(줄이다)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">And the farm required</div><div class=\"k\">(D-3) 그리고 농장은 필요로 했다</div></div><div class=\"rc\"><div class=\"e\">every ounce of work</div><div class=\"k\">최대한의 힘(노동)을</div></div><div class=\"rc\"><div class=\"e\">he could get from his son.</div><div class=\"k\">그(= 아버지)가 아들로부터 얻어낼 수 있는.</div></div><div class=\"rnat\">(D-3) 그리고 농장에서는 그가 아들로부터 얻어낼 수 있는 최대의 힘을 필요로 했다.</div><div class=\"rst\">농장 일은 아들의 힘이 조금도 빠짐없이 다 필요했거든요. 지문 6번의 최대한의 노동이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">He insisted</div><div class=\"k\">(D-4) 그(= 아버지)는 주장했다</div></div><div class=\"rc\"><div class=\"e\">that William retire for the night</div><div class=\"k\">William이 밤에 잠자리에 들어야 한다고</div></div><div class=\"rc\"><div class=\"e\">when the rest of the family did.</div><div class=\"k\">나머지 가족들이 그렇게 할(= 잠자리에 들) 때.</div></div><div class=\"rnat\">(D-4) 그는 나머지 가족들이 그렇게 할(잠자리에 들) 때 William이 (마찬가지로) 침대로 들어가야 한다고 주장했다.</div><div class=\"rst\">그래서 아버지는 가족이 잘 때 윌리엄도 같이 자라고 못 박았어요. 지문 7번의 아버지 주장이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">And his father thought</div><div class=\"k\">(D-5) 그리고 그의 아버지는 생각했다</div></div><div class=\"rc\"><div class=\"e\">the growing boy should sleep soundly</div><div class=\"k\">성장 중인 아이는 푹 자야 한다고</div></div><div class=\"rc\"><div class=\"e\">through the night.</div><div class=\"k\">밤 내내.</div></div><div class=\"rnat\">(D-5) 그리고 아버지는 성장 중인 아이는 밤 내내 푹 자야 한다고 생각했다.</div><div class=\"rst\">또 자라는 아이는 밤새 푹 자야 한다고 생각했어요. 지문 8번, 아버지가 반대한 두 번째 이유예요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">William's “<span class=\"cw\">secret life</span>”</div><div class=\"k\">(B-1) William의 <span class=\"cw\">'비밀스러운 생활'은</span></div></div><div class=\"rc\"><div class=\"e\">continued for some time,</div><div class=\"k\">얼마간 지속되었다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">though</span>.</div><div class=\"k\"><span class=\"cw\">하지만</span>.</div></div><div class=\"rnat\">(B-1) 하지만 William의 '비밀스러운 생활'은 얼마간 지속되었다.</div><div class=\"rst\"><b>그래도</b>(though) 윌리엄의 <b>‘비밀 생활’</b>은 한동안 계속됐어요. 아버지가 막았으니 몰래 한 거예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Night after night he read</div><div class=\"k\">(B-2) 밤마다 그는 책을 읽었다</div></div><div class=\"rc\"><div class=\"e\">as long as he could,</div><div class=\"k\">그가 할 수 있는 한 오랫동안,</div></div><div class=\"rc\"><div class=\"e\">then made (b) his way back upstairs,</div><div class=\"k\">그런 다음 (b)그(= William)는 다시 위층으로 올라갔고,</div></div><div class=\"rc\"><div class=\"e\">and slept until it was time</div><div class=\"k\">그리고 시간이 될 때까지 잠을 잤다</div></div><div class=\"rc\"><div class=\"e\">to do the morning chores.</div><div class=\"k\">아침 일을 해야 할.</div></div><div class=\"rnat\">(B-2) 밤마다 그는 자기가 할 수 있는 한 오랫동안 책을 읽었고, 그런 다음 (b)그(William)는 다시 위층으로 올라갔고, 아침 일을 해야 할 시간이 될 때까지 잠을 잤다.</div><div class=\"rst\">밤마다 실컷 읽다가 살금살금 위층으로 올라가 아침 일 할 때까지 잤어요. 지문 10번의 비밀 생활 모습이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">But one night</div><div class=\"k\">(B-3) 하지만 어느 날 밤</div></div><div class=\"rc\"><div class=\"e\">something happened</div><div class=\"k\">일이 일어났다</div></div><div class=\"rc\"><div class=\"e\">that he hadn't expected.</div><div class=\"k\">그가 예상하지 못했던.</div></div><div class=\"rnat\">(B-3) 하지만 어느 날 밤 그가 예상하지 못했었던 일이 일어났다.</div><div class=\"rst\"><b>그런데</b>(But) 어느 날 밤, 윌리엄이 생각도 못 한 일이 생겼어요. 지문 11번에서 사건이 시작돼요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">His father awoke</div><div class=\"k\">(B-4) 그의 아버지가 잠에서 깼다</div></div><div class=\"rc\"><div class=\"e\">and saw a glow downstairs.</div><div class=\"k\">그리고 아래층에서 (나오는) 불빛을 보았다.</div></div><div class=\"rnat\">(B-4) 그의 아버지가 잠에서 깨어 아래층에서 (나오는) 불빛을 보았다.</div><div class=\"rst\">아버지가 잠에서 깨서 아래층에 <b>불빛</b>이 있는 걸 봤어요. 지문 12번의 glow(불빛)예요.</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">13번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Thinking the house was on fire,</div><div class=\"k\">(B-5) 집에 불이 났다고 생각하고서,</div></div><div class=\"rc\"><div class=\"e\">(c) he came rushing down the stairs</div><div class=\"k\">(c)그(= William의 아버지)는 서둘러 계단을 내려왔다</div></div><div class=\"rc\"><div class=\"e\">to save his home and family</div><div class=\"k\">자신의 집과 가족을 구하기 위해</div></div><div class=\"rc\"><div class=\"e\">from going up in flames.</div><div class=\"k\">불길에 휩싸이지 않게.</div></div><div class=\"rnat\">(B-5) 집에 불이 난 줄 알고서, (c)그(William의 아버지)는 자신의 집과 가족이 불길에 휩싸이지 않게 하기 위해서 서둘러 계단을 내려왔다.</div><div class=\"rst\">집에 불이 난 줄 알고, 아버지는 집과 가족을 구하려고 계단을 뛰어 내려왔어요. = (B)의 끝.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Instead of a house fire, however,</span></div><div class=\"k\">(C-1) <span class=\"cw\">하지만 집에 난 불 대신에,</span></div></div><div class=\"rc\"><div class=\"e\">he saw his son William</div><div class=\"k\">그(= 아버지)는 아들 William을 보았다</div></div><div class=\"rc\"><div class=\"e\">lying peacefully before the fireplace</div><div class=\"k\">벽난로 앞에 평화롭게 누워 있는</div></div><div class=\"rc\"><div class=\"e\">reading a book he'd borrowed from a neighbor.</div><div class=\"k\">그(= William)가 이웃으로부터 빌린 책을 읽고 있는.</div></div><div class=\"rnat\">(C-1) 하지만 집에 난 불 대신에, 그는 아들 William이 이웃으로부터 빌린 책을 읽으면서 벽난로 앞에 평화롭게 누워 있는 것을 보았다.</div><div class=\"rst\"><b>그런데 불이 아니라</b>(Instead of a house fire) 벽난로 앞에 편히 누워 빌린 책을 읽는 아들이 있었어요. (C)의 시작이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">His father grabbed a broomstick</div><div class=\"k\">(C-2) 그의 아버지는 빗자루를 움켜쥐었다</div></div><div class=\"rc\"><div class=\"e\">and chased his son around the room,</div><div class=\"k\">그리고 방 안에서 아들을 쫓아다녔다,</div></div><div class=\"rc\"><div class=\"e\">yelling,</div><div class=\"k\">소리지르면서,</div></div><div class=\"rc\"><div class=\"e\">“Young man, if you don't get to bed right now,</div><div class=\"k\">'이 녀석, 지금 당장 자러 가지 않으면,</div></div><div class=\"rc\"><div class=\"e\">I'll kick you out of the house!”</div><div class=\"k\">집에서 내쫓아버릴 거야!'</div></div><div class=\"rnat\">(C-2) 그의 아버지는 빗자루를 움켜쥐고 \"이 녀석, 지금 당장 자러 가지 않으면, 집에서 내쫓아버릴 거야!\"라고 소리지르면서, 방 안에서 아들을 쫓아 다녔다.</div><div class=\"rst\">아버지는 빗자루를 들고 쫓아다니며 “당장 안 자면 집에서 내쫓을 거야!” 하고 소리쳤어요. 지문 15번 그대로예요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">William went up to bed,</div><div class=\"k\">(C-3) William은 잠자리로 향했다,</div></div><div class=\"rc\"><div class=\"e\">at least for this night.</div><div class=\"k\">적어도 이날 밤은.</div></div><div class=\"rnat\">(C-3) William은 적어도 이날 밤은, (바로) 잠자리로 향했다.</div><div class=\"rst\">윌리엄은 적어도 그날 밤만큼은 자러 올라갔어요. 지문 16번의 at least for this night(적어도 이날 밤은)예요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(d) He was only trying</div><div class=\"k\">(C-4) (d)그(= William)는 단지 애쓰고 있을 뿐이었다</div></div><div class=\"rc\"><div class=\"e\">to get an education</div><div class=\"k\">교육을 받으려고</div></div><div class=\"rc\"><div class=\"e\">that he couldn't get</div><div class=\"k\">그가 받을 수 없었던</div></div><div class=\"rc\"><div class=\"e\">from the teachers in the community.</div><div class=\"k\">그 마을의 선생님들로부터.</div></div><div class=\"rnat\">(C-4) (d)그(William)는 그 마을에 있는 선생님들로부터 (그가) 받을 수 없었던 교육을 받기 위해 애쓰고 있었을 뿐이었다.</div><div class=\"rst\">윌리엄은 그저 마을 선생님들에게서는 받을 수 없는 <b>배움</b>을 얻고 싶었을 뿐이에요. 이야기의 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"stayed up\" data-m=\"자지 않고 깨어 있었다 (stay up)\"><b>stayed up</b>자지 않고 깨어 있었다 (stay up)</button><button type=\"button\" class=\"wdb\" data-w=\"pine knot\" data-m=\"관솔(송진이 엉긴 소나무 옹이)\"><b>pine knot</b>관솔(송진이 엉긴 소나무 옹이)</button><button type=\"button\" class=\"wdb\" data-w=\"formed the habit of\" data-m=\"~하는 습관을 들였다 (form the habit of)\"><b>formed the habit of</b>~하는 습관을 들였다 (form the habit of)</button><button type=\"button\" class=\"wdb\" data-w=\"cut into\" data-m=\"~을 갉아먹다, 줄이다\"><b>cut into</b>~을 갉아먹다, 줄이다</button><button type=\"button\" class=\"wdb\" data-w=\"retire for the night\" data-m=\"잠자리에 들다\"><b>retire for the night</b>잠자리에 들다</button><button type=\"button\" class=\"wdb\" data-w=\"morning chores\" data-m=\"아침 집안일\"><b>morning chores</b>아침 집안일</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>그 문장 안의 단서</b>로 누구인지 확인하세요. (c) 앞의 <b>His father awoke</b>(그의 아버지가 깼다)처럼, 바로 앞 문장의 주어가 바뀌는 곳을 노려요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · 2번 문장</span><div class=\"en\">… and all <mark>(a) he</mark> had to do was gather them from the woods.</div><p class=\"ko\">… 그리고 <mark>(a)그</mark>가 해야 했던 일의 전부는 숲에서 관솔을 모으는 것이었다. → 윌리엄</p></div><div class=\"ck-via\"><i>▼</i><span>늦은 밤 독서를 하는 사람 = 아들, 그 아들의 다음 날 힘</span></div><div class=\"ck-step\"><span class=\"lab\">(e) · 5번 문장</span><div class=\"en\">His father felt that his son's late-night reading would cut into <mark>(e) his</mark> energy for the next day's work.</div><p class=\"ko\">아버지는 아들의 늦은 밤 독서가 다음 날 일을 위한 <mark>(e)그의</mark> 힘을 줄일 것이라고 느꼈다. → 윌리엄</p></div><div class=\"ck-via\"><i>▼</i><span>밤마다 몰래 책을 읽고 위층으로 올라가는 사람 = 비밀 생활의 주인 윌리엄</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · 10번 문장</span><div class=\"en\">Night after night he read as long as he could, then made <mark>(b) his</mark> way back upstairs …</div><p class=\"ko\">밤마다 그는 할 수 있는 한 오래 책을 읽고, 그런 다음 <mark>(b)그</mark>는 다시 위층으로 올라갔다 … → 윌리엄</p></div><div class=\"ck-via\"><i>▼</i><span>12번 주어가 His father(그의 아버지)로 바뀜 + 불이 난 줄 알고 내려온 사람</span></div><div class=\"ck-step key\"><span class=\"lab\">(c) · 13번 문장 · 결정적 단서</span><div class=\"en\"><mark>Thinking the house was on fire</mark>, <mark>(c) he</mark> came rushing down the stairs to save his home and family …</div><p class=\"ko\"><mark>집에 불이 났다고 생각하고서</mark>, <mark>(c)그</mark>는 집과 가족을 구하려고 서둘러 계단을 내려왔다 … → 아버지</p></div><div class=\"ck-via\"><i>▼</i><span>마을 선생님에게서 못 받은 교육을 얻으려 한 사람 = 몰래 책 읽던 윌리엄</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · 17번 문장</span><div class=\"en\"><mark>(d) He</mark> was only trying to get an education that he couldn't get from the teachers in the community.</div><p class=\"ko\"><mark>(d)그</mark>는 마을 선생님들에게서 받을 수 없었던 교육을 받으려고 애쓰고 있을 뿐이었다. → 윌리엄</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(c) he 그 = 윌리엄의 아버지<small>12번에서 깬 아버지가 불이 난 줄 알고 뛰어 내려온 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) his 그의 = 윌리엄</span><span class=\"why\">5번 주어가 His father(그의 아버지)라 아버지로 착각하기 쉬워요. 하지만 늦은 밤 독서로 다음 날 힘이 줄어드는 사람은 아들 윌리엄이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) he 그 = 윌리엄</span><span class=\"why\">1번에서 밤새 책을 읽은 윌리엄이 그대로 이어져요. 3번 So William(그래서 윌리엄은)이 관솔을 태우니, 관솔을 모으는 사람도 윌리엄이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) his 그의 = 윌리엄</span><span class=\"why\">9번 William's secret life(윌리엄의 비밀 생활)를 바로 이어 받아요. 밤마다 읽고 위층으로 올라간 사람은 윌리엄이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) He 그 = 윌리엄</span><span class=\"why\">16번에서 자러 간 윌리엄 얘기가 이어져요. 선생님들에게서 못 받은 교육을 책으로 얻으려 한 사람도 윌리엄이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">William Miller stayed up</div><div class=\"k\">(A-1) William Miller는 깨어 있었다</div></div><div class=\"rc\"><div class=\"e\">after the family had gone to bed,</div><div class=\"k\">가족이 잠자리에 든 뒤에,</div></div><div class=\"rc\"><div class=\"e\">then read until the morning.</div><div class=\"k\">그리고 아침까지 책을 읽었다.</div></div><div class=\"rnat\">(A-1) William Miller는 가족들이 모두 잠자리에 든 뒤, 잠들지 않고 깨어서 아침까지 책을 읽었다.</div><div class=\"rst\">윌리엄은 가족이 다 잠든 뒤에도 깨어 있다가, 아침까지 책을 읽었어요. 이 이야기의 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Candles were expensive,</div><div class=\"k\">(A-2) 초는 비쌌다,</div></div><div class=\"rc\"><div class=\"e\">but there were plenty of pine knots,</div><div class=\"k\">하지만 관솔은 많이 있었다,</div></div><div class=\"rc\"><div class=\"e\">and all (a) he had to do</div><div class=\"k\">그리고 (a)그(= William)가 해야 했던 일의 전부는</div></div><div class=\"rc\"><div class=\"e\">was gather them from the woods.</div><div class=\"k\">숲에서 그것들(= 관솔)을 모으는 것이었다.</div></div><div class=\"rnat\">(A-2) 초는 비쌌지만 관솔은 많이 있었고, (a)그(William)가 해야 했던 일의 전부는 숲에서 그것들을 모으는 것이었다(그는 단지 숲에서 그것들을 모으기만 하면 되었다).</div><div class=\"rst\">초는 비쌌지만 숲에 관솔이 잔뜩 있어서, 주워 오기만 하면 됐어요. 주워 오는 사람은 윌리엄이라 <b>(a) 그 = 윌리엄</b>.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">So William formed the habit</div><div class=\"k\">(A-3) 그래서 William은 습관이 생겼다</div></div><div class=\"rc\"><div class=\"e\">of burning pine knots in the fireplace</div><div class=\"k\">벽난로에 관솔을 태우는</div></div><div class=\"rc\"><div class=\"e\">for his nightly reading light.</div><div class=\"k\">밤마다 책을 읽는 데 쓸 불빛을 위해.</div></div><div class=\"rnat\">(A-3) 그래서 William은 야간 독서등(밤마다 책을 읽는 데 필요한 불빛)을 위해서 벽난로에 관솔을 태우는 습관이 생겼다.</div><div class=\"rst\">그래서 밤마다 벽난로에 관솔을 태워 그 불빛으로 책을 읽는 습관이 생겼어요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">But his father didn't like the habit</div><div class=\"k\">(D-1) 하지만 그의 아버지는 그 습관(= 관솔불로 밤에 책을 읽는 습관)을 좋아하지 않았다</div></div><div class=\"rc\"><div class=\"e\">and tried to stop it.</div><div class=\"k\">그리고 그것(= 그 습관)을 그만두게 하려 애썼다.</div></div><div class=\"rnat\">(D-1) 하지만 그의 아버지는 그 습관을 좋아하지 않았고 그것을 그만두게 하려 애썼다.</div><div class=\"rst\">하지만 아버지는 그 습관이 싫어서 그만두게 하려 했어요. 여기서 아버지가 등장해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">His father felt</div><div class=\"k\">(D-2) 그의 아버지는 느꼈다</div></div><div class=\"rc\"><div class=\"e\">that his son's late-night reading</div><div class=\"k\">아들의 늦은 밤 독서가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">would cut into (e) his energy</span></div><div class=\"k\"><span class=\"cw\">(e)그의 힘(= William의 힘)을 줄일 것이라고</span></div></div><div class=\"rc\"><div class=\"e\">for the next day's work.</div><div class=\"k\">다음 날의 일을 위한.</div></div><div class=\"rnat\">(D-2) 그의 아버지는 아들의 늦은 밤 독서가 다음 날의 일을 위한(다음 날 일에 필요한) (e)그(William)의 힘을 줄일 것이라고 느꼈다.</div><div class=\"rst\">아버지는 아들이 밤늦게 읽으면 다음 날 일할 힘이 줄 거라 걱정했어요. 힘이 주는 건 아들이라 <b>(e) 그의 = 윌리엄</b>.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">And the farm required</div><div class=\"k\">(D-3) 그리고 농장은 필요로 했다</div></div><div class=\"rc\"><div class=\"e\">every ounce of work</div><div class=\"k\">최대한의 힘(노동)을</div></div><div class=\"rc\"><div class=\"e\">he could get from his son.</div><div class=\"k\">그(= 아버지)가 아들로부터 얻어낼 수 있는.</div></div><div class=\"rnat\">(D-3) 그리고 농장에서는 그가 아들로부터 얻어낼 수 있는 최대의 힘을 필요로 했다.</div><div class=\"rst\">농장 일은 아들의 힘이 조금도 빠짐없이 다 필요했거든요. 이 문장의 ‘그’는 아들 힘을 얻으려는 아버지예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">He insisted</div><div class=\"k\">(D-4) 그(= 아버지)는 주장했다</div></div><div class=\"rc\"><div class=\"e\">that William retire for the night</div><div class=\"k\">William이 밤에 잠자리에 들어야 한다고</div></div><div class=\"rc\"><div class=\"e\">when the rest of the family did.</div><div class=\"k\">나머지 가족들이 그렇게 할(= 잠자리에 들) 때.</div></div><div class=\"rnat\">(D-4) 그는 나머지 가족들이 그렇게 할(잠자리에 들) 때 William이 (마찬가지로) 침대로 들어가야 한다고 주장했다.</div><div class=\"rst\">그래서 아버지는 가족이 잘 때 윌리엄도 같이 자라고 못 박았어요. = 지문 7번이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">And his father thought</div><div class=\"k\">(D-5) 그리고 그의 아버지는 생각했다</div></div><div class=\"rc\"><div class=\"e\">the growing boy should sleep soundly</div><div class=\"k\">성장 중인 아이는 푹 자야 한다고</div></div><div class=\"rc\"><div class=\"e\">through the night.</div><div class=\"k\">밤 내내.</div></div><div class=\"rnat\">(D-5) 그리고 아버지는 성장 중인 아이는 밤 내내 푹 자야 한다고 생각했다.</div><div class=\"rst\">또 자라는 아이는 밤새 푹 자야 한다고 생각했어요. = 지문 8번이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">William's “secret life”</div><div class=\"k\">(B-1) William의 '비밀스러운 생활'은</div></div><div class=\"rc\"><div class=\"e\">continued for some time,</div><div class=\"k\">얼마간 지속되었다,</div></div><div class=\"rc\"><div class=\"e\">though.</div><div class=\"k\">하지만.</div></div><div class=\"rnat\">(B-1) 하지만 William의 '비밀스러운 생활'은 얼마간 지속되었다.</div><div class=\"rst\">그래도 윌리엄의 ‘비밀 생활’은 한동안 계속됐어요. 다시 주인공이 윌리엄으로 돌아와요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Night after night he read</div><div class=\"k\">(B-2) 밤마다 그는 책을 읽었다</div></div><div class=\"rc\"><div class=\"e\">as long as he could,</div><div class=\"k\">그가 할 수 있는 한 오랫동안,</div></div><div class=\"rc\"><div class=\"e\">then made (b) his way back upstairs,</div><div class=\"k\">그런 다음 (b)그(= William)는 다시 위층으로 올라갔고,</div></div><div class=\"rc\"><div class=\"e\">and slept until it was time</div><div class=\"k\">그리고 시간이 될 때까지 잠을 잤다</div></div><div class=\"rc\"><div class=\"e\">to do the morning chores.</div><div class=\"k\">아침 일을 해야 할.</div></div><div class=\"rnat\">(B-2) 밤마다 그는 자기가 할 수 있는 한 오랫동안 책을 읽었고, 그런 다음 (b)그(William)는 다시 위층으로 올라갔고, 아침 일을 해야 할 시간이 될 때까지 잠을 잤다.</div><div class=\"rst\">밤마다 실컷 읽다가 살금살금 위층으로 올라가 잤어요. 몰래 읽은 사람이니 <b>(b) 그 = 윌리엄</b>.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">But one night</div><div class=\"k\">(B-3) 하지만 어느 날 밤</div></div><div class=\"rc\"><div class=\"e\">something happened</div><div class=\"k\">일이 일어났다</div></div><div class=\"rc\"><div class=\"e\">that he hadn't expected.</div><div class=\"k\">그가 예상하지 못했던.</div></div><div class=\"rnat\">(B-3) 하지만 어느 날 밤 그가 예상하지 못했었던 일이 일어났다.</div><div class=\"rst\">그런데 어느 날 밤, 윌리엄이 생각도 못 한 일이 생겼어요. = 지문 11번이에요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">His father awoke</span></div><div class=\"k\">(B-4) <span class=\"cw\">그의 아버지가 잠에서 깼다</span></div></div><div class=\"rc\"><div class=\"e\">and saw a glow downstairs.</div><div class=\"k\">그리고 아래층에서 (나오는) 불빛을 보았다.</div></div><div class=\"rnat\">(B-4) 그의 아버지가 잠에서 깨어 아래층에서 (나오는) 불빛을 보았다.</div><div class=\"rst\"><b>아버지가</b>(His father) 잠에서 깨서 아래층 불빛을 봤어요. 여기서 문장의 주어가 아버지로 바뀌어요!</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">13번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Thinking the house was on fire,</span></div><div class=\"k\">(B-5) <span class=\"cw\">집에 불이 났다고 생각하고서,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(c) he came rushing down the stairs</span></div><div class=\"k\"><span class=\"cw\">(c)그(= William의 아버지)는 서둘러 계단을 내려왔다</span></div></div><div class=\"rc\"><div class=\"e\">to save his home and family</div><div class=\"k\">자신의 집과 가족을 구하기 위해</div></div><div class=\"rc\"><div class=\"e\">from going up in flames.</div><div class=\"k\">불길에 휩싸이지 않게.</div></div><div class=\"rnat\">(B-5) 집에 불이 난 줄 알고서, (c)그(William의 아버지)는 자신의 집과 가족이 불길에 휩싸이지 않게 하기 위해서 서둘러 계단을 내려왔다.</div><div class=\"rst\">불이 난 줄 알고 집과 가족을 구하려 뛰어 내려온 사람은 방금 깬 아버지예요. 그래서 <b>(c) 그 = 아버지</b>!</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Instead of a house fire, however,</div><div class=\"k\">(C-1) 하지만 집에 난 불 대신에,</div></div><div class=\"rc\"><div class=\"e\">he saw his son William</div><div class=\"k\">그(= 아버지)는 아들 William을 보았다</div></div><div class=\"rc\"><div class=\"e\">lying peacefully before the fireplace</div><div class=\"k\">벽난로 앞에 평화롭게 누워 있는</div></div><div class=\"rc\"><div class=\"e\">reading a book he'd borrowed from a neighbor.</div><div class=\"k\">그(= William)가 이웃으로부터 빌린 책을 읽고 있는.</div></div><div class=\"rnat\">(C-1) 하지만 집에 난 불 대신에, 그는 아들 William이 이웃으로부터 빌린 책을 읽으면서 벽난로 앞에 평화롭게 누워 있는 것을 보았다.</div><div class=\"rst\">그런데 불이 아니라, 벽난로 앞에 편히 누워 빌린 책을 읽는 아들이 있었어요. = 지문 14번이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">His father grabbed a broomstick</div><div class=\"k\">(C-2) 그의 아버지는 빗자루를 움켜쥐었다</div></div><div class=\"rc\"><div class=\"e\">and chased his son around the room,</div><div class=\"k\">그리고 방 안에서 아들을 쫓아다녔다,</div></div><div class=\"rc\"><div class=\"e\">yelling,</div><div class=\"k\">소리지르면서,</div></div><div class=\"rc\"><div class=\"e\">“Young man, if you don't get to bed right now,</div><div class=\"k\">'이 녀석, 지금 당장 자러 가지 않으면,</div></div><div class=\"rc\"><div class=\"e\">I'll kick you out of the house!”</div><div class=\"k\">집에서 내쫓아버릴 거야!'</div></div><div class=\"rnat\">(C-2) 그의 아버지는 빗자루를 움켜쥐고 \"이 녀석, 지금 당장 자러 가지 않으면, 집에서 내쫓아버릴 거야!\"라고 소리지르면서, 방 안에서 아들을 쫓아 다녔다.</div><div class=\"rst\">아버지는 빗자루를 들고 쫓아다니며 “당장 안 자면 집에서 내쫓을 거야!” 하고 소리쳤어요. = 지문 15번이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">William went up to bed,</div><div class=\"k\">(C-3) William은 잠자리로 향했다,</div></div><div class=\"rc\"><div class=\"e\">at least for this night.</div><div class=\"k\">적어도 이날 밤은.</div></div><div class=\"rnat\">(C-3) William은 적어도 이날 밤은, (바로) 잠자리로 향했다.</div><div class=\"rst\">윌리엄은 적어도 그날 밤만큼은 자러 올라갔어요. = 지문 16번이에요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">(d) He was only trying</div><div class=\"k\">(C-4) (d)그(= William)는 단지 애쓰고 있을 뿐이었다</div></div><div class=\"rc\"><div class=\"e\">to get an education</div><div class=\"k\">교육을 받으려고</div></div><div class=\"rc\"><div class=\"e\">that he couldn't get</div><div class=\"k\">그가 받을 수 없었던</div></div><div class=\"rc\"><div class=\"e\">from the teachers in the community.</div><div class=\"k\">그 마을의 선생님들로부터.</div></div><div class=\"rnat\">(C-4) (d)그(William)는 그 마을에 있는 선생님들로부터 (그가) 받을 수 없었던 교육을 받기 위해 애쓰고 있었을 뿐이었다.</div><div class=\"rst\">그는 마을 선생님에게서 못 받는 배움을 얻고 싶었을 뿐이에요. 책을 읽던 사람이니 <b>(d) 그 = 윌리엄</b>.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"glow\" data-m=\"불빛, 빛\"><b>glow</b>불빛, 빛</button><button type=\"button\" class=\"wdb\" data-w=\"in flames\" data-m=\"불길에 휩싸인\"><b>in flames</b>불길에 휩싸인</button><button type=\"button\" class=\"wdb\" data-w=\"peacefully\" data-m=\"평화롭게\"><b>peacefully</b>평화롭게</button><button type=\"button\" class=\"wdb\" data-w=\"broomstick\" data-m=\"빗자루\"><b>broomstick</b>빗자루</button><button type=\"button\" class=\"wdb\" data-w=\"kick you out\" data-m=\"(너를) 쫓아내다\"><b>kick you out</b>(너를) 쫓아내다</button><button type=\"button\" class=\"wdb\" data-w=\"community\" data-m=\"지역 사회, 마을\"><b>community</b>지역 사회, 마을</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 선택지의 <b>‘자다가’</b>처럼 행동 하나만 슬쩍 바꾼 말을, 아버지가 본 장면(14번)의 <b>reading</b>(읽고 있는)과 맞대 봐요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 3번</em>burning pine knots(관솔을 태우는) for his nightly reading light(밤 독서 불빛) → 같음</span><span><em>⑤ ↔ 4·5번</em>didn't like the habit(그 습관을 좋아하지 않았다), late-night reading(늦은 밤 독서) 걱정 → 같음</span><span><em>② ↔ 12번</em>awoke(잠에서 깼다) and saw a glow downstairs(아래층 불빛을 보았다) → 같음</span><span><em>④ ↔ 15번</em>grabbed a broomstick(빗자루를 움켜쥐었다) and chased(쫓아다녔다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ③을 14번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 ‘벽난로 앞에서 자다가’를 14번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">14번 문장 · 결정적 단서</span><div class=\"en\">… he saw his son William <mark>lying peacefully before the fireplace</mark> <mark>reading a book</mark> he'd borrowed from a neighbor.</div><p class=\"ko\">… 그는 <mark>벽난로 앞에 평화롭게 누워 있는</mark>, 이웃에게 빌린 <mark>책을 읽고 있는</mark> 아들 William을 보았다.</p></div><div class=\"ck-via\"><i>▼</i><span>윌리엄이 잔 곳은 벽난로 앞이 아니라 위층이에요</span></div><div class=\"ck-step\"><span class=\"lab\">10번 문장 · 잠은 어디서?</span><div class=\"en\">Night after night he read as long as he could, then made (b) his way back upstairs, and <mark>slept</mark> until it was time to do the morning chores.</div><p class=\"ko\">밤마다 그는 할 수 있는 한 오래 책을 읽고, 다시 위층으로 올라가 아침 일을 할 시간까지 <mark>잠을 잤다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">William은 벽난로 앞에서 자다가 아버지에게 발각되었다.<small>14번: 자고 있던 게 아니라 누워서 책을 읽고 있었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">아버지는 William이 밤늦게 책 읽는 것을 싫어했다.</span><span class=\"why\">4번은 didn't like the habit(그 습관을 좋아하지 않았다)이라 ‘싫어했다’와 말이 달라 보여요. 하지만 그 습관이 바로 밤 독서이고, 5번도 late-night reading(늦은 밤 독서)을 걱정해서 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">William은 관솔을 태워 그 빛으로 책을 읽었다.</span><span class=\"why\">3번 burning pine knots(관솔을 태우는) for his nightly reading light(밤 독서 불빛을 위해)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">아버지는 밤에 일어나서 아래층의 불빛을 보았다.</span><span class=\"why\">12번 His father awoke(아버지가 잠에서 깼다) and saw a glow downstairs(아래층 불빛을 보았다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">아버지는 빗자루를 들고 William을 쫓아다녔다.</span><span class=\"why\">15번 grabbed a broomstick(빗자루를 움켜쥐었다) and chased his son(아들을 쫓아다녔다)과 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">William Miller stayed up</div><div class=\"k\">(A-1) William Miller는 깨어 있었다</div></div><div class=\"rc\"><div class=\"e\">after the family had gone to bed,</div><div class=\"k\">가족이 잠자리에 든 뒤에,</div></div><div class=\"rc\"><div class=\"e\">then read until the morning.</div><div class=\"k\">그리고 아침까지 책을 읽었다.</div></div><div class=\"rnat\">(A-1) William Miller는 가족들이 모두 잠자리에 든 뒤, 잠들지 않고 깨어서 아침까지 책을 읽었다.</div><div class=\"rst\">윌리엄은 가족이 다 잠든 뒤에도 깨어 있다가, 아침까지 책을 읽었어요. = 지문 1번, 이야기의 시작이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Candles were expensive,</div><div class=\"k\">(A-2) 초는 비쌌다,</div></div><div class=\"rc\"><div class=\"e\">but there were plenty of pine knots,</div><div class=\"k\">하지만 관솔은 많이 있었다,</div></div><div class=\"rc\"><div class=\"e\">and all (a) he had to do</div><div class=\"k\">그리고 (a)그(= William)가 해야 했던 일의 전부는</div></div><div class=\"rc\"><div class=\"e\">was gather them from the woods.</div><div class=\"k\">숲에서 그것들(= 관솔)을 모으는 것이었다.</div></div><div class=\"rnat\">(A-2) 초는 비쌌지만 관솔은 많이 있었고, (a)그(William)가 해야 했던 일의 전부는 숲에서 그것들을 모으는 것이었다(그는 단지 숲에서 그것들을 모으기만 하면 되었다).</div><div class=\"rst\">초는 비쌌지만 숲에 관솔이 잔뜩 있어서, 주워 오기만 하면 됐어요. = 지문 2번의 pine knots(관솔)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">So William formed the habit</div><div class=\"k\">(A-3) 그래서 William은 습관이 생겼다</div></div><div class=\"rc\"><div class=\"e\">of burning pine knots in the fireplace</div><div class=\"k\">벽난로에 관솔을 태우는</div></div><div class=\"rc\"><div class=\"e\">for his nightly reading light.</div><div class=\"k\">밤마다 책을 읽는 데 쓸 불빛을 위해.</div></div><div class=\"rnat\">(A-3) 그래서 William은 야간 독서등(밤마다 책을 읽는 데 필요한 불빛)을 위해서 벽난로에 관솔을 태우는 습관이 생겼다.</div><div class=\"rst\">그래서 밤마다 벽난로에 <b>관솔을 태워</b> 그 불빛으로 책을 읽었어요. = 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">But his father didn't like the habit</div><div class=\"k\">(D-1) 하지만 그의 아버지는 그 습관(= 관솔불로 밤에 책을 읽는 습관)을 좋아하지 않았다</div></div><div class=\"rc\"><div class=\"e\">and tried to stop it.</div><div class=\"k\">그리고 그것(= 그 습관)을 그만두게 하려 애썼다.</div></div><div class=\"rnat\">(D-1) 하지만 그의 아버지는 그 습관을 좋아하지 않았고 그것을 그만두게 하려 애썼다.</div><div class=\"rst\">하지만 아버지는 <b>그 습관이 싫어서</b> 그만두게 하려 했어요. = 선택지 ⑤와 같아요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">His father felt</div><div class=\"k\">(D-2) 그의 아버지는 느꼈다</div></div><div class=\"rc\"><div class=\"e\">that his son's late-night reading</div><div class=\"k\">아들의 늦은 밤 독서가</div></div><div class=\"rc\"><div class=\"e\">would cut into (e) his energy</div><div class=\"k\">(e)그의 힘(= William의 힘)을 줄일 것이라고</div></div><div class=\"rc\"><div class=\"e\">for the next day's work.</div><div class=\"k\">다음 날의 일을 위한.</div></div><div class=\"rnat\">(D-2) 그의 아버지는 아들의 늦은 밤 독서가 다음 날의 일을 위한(다음 날 일에 필요한) (e)그(William)의 힘을 줄일 것이라고 느꼈다.</div><div class=\"rst\">아버지는 밤늦게 책을 읽으면 다음 날 일할 힘이 줄어들 거라고 걱정했어요. ⑤를 한 번 더 받쳐 줘요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">And the farm required</div><div class=\"k\">(D-3) 그리고 농장은 필요로 했다</div></div><div class=\"rc\"><div class=\"e\">every ounce of work</div><div class=\"k\">최대한의 힘(노동)을</div></div><div class=\"rc\"><div class=\"e\">he could get from his son.</div><div class=\"k\">그(= 아버지)가 아들로부터 얻어낼 수 있는.</div></div><div class=\"rnat\">(D-3) 그리고 농장에서는 그가 아들로부터 얻어낼 수 있는 최대의 힘을 필요로 했다.</div><div class=\"rst\">농장 일은 아들의 힘이 조금도 빠짐없이 다 필요했거든요. 지문 6번이 아버지가 반대한 이유를 더해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">He insisted</div><div class=\"k\">(D-4) 그(= 아버지)는 주장했다</div></div><div class=\"rc\"><div class=\"e\">that William retire for the night</div><div class=\"k\">William이 밤에 잠자리에 들어야 한다고</div></div><div class=\"rc\"><div class=\"e\">when the rest of the family did.</div><div class=\"k\">나머지 가족들이 그렇게 할(= 잠자리에 들) 때.</div></div><div class=\"rnat\">(D-4) 그는 나머지 가족들이 그렇게 할(잠자리에 들) 때 William이 (마찬가지로) 침대로 들어가야 한다고 주장했다.</div><div class=\"rst\">그래서 아버지는 가족이 잘 때 윌리엄도 같이 자라고 못 박았어요. = 지문 7번의 retire for the night(잠자리에 들다)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">And his father thought</div><div class=\"k\">(D-5) 그리고 그의 아버지는 생각했다</div></div><div class=\"rc\"><div class=\"e\">the growing boy should sleep soundly</div><div class=\"k\">성장 중인 아이는 푹 자야 한다고</div></div><div class=\"rc\"><div class=\"e\">through the night.</div><div class=\"k\">밤 내내.</div></div><div class=\"rnat\">(D-5) 그리고 아버지는 성장 중인 아이는 밤 내내 푹 자야 한다고 생각했다.</div><div class=\"rst\">또 자라는 아이는 밤새 푹 자야 한다고 생각했어요. = 지문 8번의 sleep soundly(푹 자다)예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">William's “secret life”</div><div class=\"k\">(B-1) William의 '비밀스러운 생활'은</div></div><div class=\"rc\"><div class=\"e\">continued for some time,</div><div class=\"k\">얼마간 지속되었다,</div></div><div class=\"rc\"><div class=\"e\">though.</div><div class=\"k\">하지만.</div></div><div class=\"rnat\">(B-1) 하지만 William의 '비밀스러운 생활'은 얼마간 지속되었다.</div><div class=\"rst\">그래도 윌리엄의 ‘비밀 생활’은 한동안 계속됐어요. 아버지 몰래 읽은 거예요. = 지문 9번이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Night after night he read</div><div class=\"k\">(B-2) 밤마다 그는 책을 읽었다</div></div><div class=\"rc\"><div class=\"e\">as long as he could,</div><div class=\"k\">그가 할 수 있는 한 오랫동안,</div></div><div class=\"rc\"><div class=\"e\">then made (b) his way back upstairs,</div><div class=\"k\">그런 다음 (b)그(= William)는 다시 위층으로 올라갔고,</div></div><div class=\"rc\"><div class=\"e\">and slept until it was time</div><div class=\"k\">그리고 시간이 될 때까지 잠을 잤다</div></div><div class=\"rc\"><div class=\"e\">to do the morning chores.</div><div class=\"k\">아침 일을 해야 할.</div></div><div class=\"rnat\">(B-2) 밤마다 그는 자기가 할 수 있는 한 오랫동안 책을 읽었고, 그런 다음 (b)그(William)는 다시 위층으로 올라갔고, 아침 일을 해야 할 시간이 될 때까지 잠을 잤다.</div><div class=\"rst\">밤마다 실컷 읽다가 <b>위층으로 올라가 잤어요</b>. 잠은 벽난로 앞이 아니라 위층에서 잔 거예요. = 지문 10번, 그래서 ③의 ‘벽난로 앞에서 자다가’와 달라요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">But one night</div><div class=\"k\">(B-3) 하지만 어느 날 밤</div></div><div class=\"rc\"><div class=\"e\">something happened</div><div class=\"k\">일이 일어났다</div></div><div class=\"rc\"><div class=\"e\">that he hadn't expected.</div><div class=\"k\">그가 예상하지 못했던.</div></div><div class=\"rnat\">(B-3) 하지만 어느 날 밤 그가 예상하지 못했었던 일이 일어났다.</div><div class=\"rst\">그런데 어느 날 밤, 윌리엄이 생각도 못 한 일이 생겼어요. 지문 11번이 사건을 예고해요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">His father awoke</div><div class=\"k\">(B-4) 그의 아버지가 잠에서 깼다</div></div><div class=\"rc\"><div class=\"e\">and saw a glow downstairs.</div><div class=\"k\">그리고 아래층에서 (나오는) 불빛을 보았다.</div></div><div class=\"rnat\">(B-4) 그의 아버지가 잠에서 깨어 아래층에서 (나오는) 불빛을 보았다.</div><div class=\"rst\">아버지가 <b>잠에서 깨서 아래층 불빛</b>을 봤어요. = 선택지 ②와 같아요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Thinking the house was on fire,</div><div class=\"k\">(B-5) 집에 불이 났다고 생각하고서,</div></div><div class=\"rc\"><div class=\"e\">(c) he came rushing down the stairs</div><div class=\"k\">(c)그(= William의 아버지)는 서둘러 계단을 내려왔다</div></div><div class=\"rc\"><div class=\"e\">to save his home and family</div><div class=\"k\">자신의 집과 가족을 구하기 위해</div></div><div class=\"rc\"><div class=\"e\">from going up in flames.</div><div class=\"k\">불길에 휩싸이지 않게.</div></div><div class=\"rnat\">(B-5) 집에 불이 난 줄 알고서, (c)그(William의 아버지)는 자신의 집과 가족이 불길에 휩싸이지 않게 하기 위해서 서둘러 계단을 내려왔다.</div><div class=\"rst\">집에 불이 난 줄 알고, 아버지는 집과 가족을 구하려고 계단을 뛰어 내려왔어요. = 지문 13번이에요.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><div class=\"rc\"><div class=\"e\">Instead of a house fire, however,</div><div class=\"k\">(C-1) 하지만 집에 난 불 대신에,</div></div><div class=\"rc\"><div class=\"e\">he saw his son William</div><div class=\"k\">그(= 아버지)는 아들 William을 보았다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">lying peacefully before the fireplace</span></div><div class=\"k\"><span class=\"cw\">벽난로 앞에 평화롭게 누워 있는</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">reading a book he'd borrowed from a neighbor.</span></div><div class=\"k\"><span class=\"cw\">그(= William)가 이웃으로부터 빌린 책을 읽고 있는.</span></div></div><div class=\"rnat\">(C-1) 하지만 집에 난 불 대신에, 그는 아들 William이 이웃으로부터 빌린 책을 읽으면서 벽난로 앞에 평화롭게 누워 있는 것을 보았다.</div><div class=\"rst\">그런데 아들은 벽난로 앞에 편히 누워 <b>책을 읽고 있었어요</b>. 자고 있던 게 아니라서 ③이 틀려요!</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">His father grabbed a broomstick</div><div class=\"k\">(C-2) 그의 아버지는 빗자루를 움켜쥐었다</div></div><div class=\"rc\"><div class=\"e\">and chased his son around the room,</div><div class=\"k\">그리고 방 안에서 아들을 쫓아다녔다,</div></div><div class=\"rc\"><div class=\"e\">yelling,</div><div class=\"k\">소리지르면서,</div></div><div class=\"rc\"><div class=\"e\">“Young man, if you don't get to bed right now,</div><div class=\"k\">'이 녀석, 지금 당장 자러 가지 않으면,</div></div><div class=\"rc\"><div class=\"e\">I'll kick you out of the house!”</div><div class=\"k\">집에서 내쫓아버릴 거야!'</div></div><div class=\"rnat\">(C-2) 그의 아버지는 빗자루를 움켜쥐고 \"이 녀석, 지금 당장 자러 가지 않으면, 집에서 내쫓아버릴 거야!\"라고 소리지르면서, 방 안에서 아들을 쫓아 다녔다.</div><div class=\"rst\">아버지는 <b>빗자루를 들고 쫓아다니며</b> “당장 안 자면 내쫓을 거야!” 하고 소리쳤어요. = 선택지 ④와 같아요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">William went up to bed,</div><div class=\"k\">(C-3) William은 잠자리로 향했다,</div></div><div class=\"rc\"><div class=\"e\">at least for this night.</div><div class=\"k\">적어도 이날 밤은.</div></div><div class=\"rnat\">(C-3) William은 적어도 이날 밤은, (바로) 잠자리로 향했다.</div><div class=\"rst\">윌리엄은 적어도 그날 밤만큼은 자러 올라갔어요. = 지문 16번이에요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">(d) He was only trying</div><div class=\"k\">(C-4) (d)그(= William)는 단지 애쓰고 있을 뿐이었다</div></div><div class=\"rc\"><div class=\"e\">to get an education</div><div class=\"k\">교육을 받으려고</div></div><div class=\"rc\"><div class=\"e\">that he couldn't get</div><div class=\"k\">그가 받을 수 없었던</div></div><div class=\"rc\"><div class=\"e\">from the teachers in the community.</div><div class=\"k\">그 마을의 선생님들로부터.</div></div><div class=\"rnat\">(C-4) (d)그(William)는 그 마을에 있는 선생님들로부터 (그가) 받을 수 없었던 교육을 받기 위해 애쓰고 있었을 뿐이었다.</div><div class=\"rst\">윌리엄은 그저 마을 선생님에게서 못 받는 배움을 얻고 싶었을 뿐이에요. = 지문 17번, 이야기의 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"retire for the night\" data-m=\"잠자리에 들다\"><b>retire for the night</b>잠자리에 들다</button><button type=\"button\" class=\"wdb\" data-w=\"sleep soundly\" data-m=\"푹 자다\"><b>sleep soundly</b>푹 자다</button><button type=\"button\" class=\"wdb\" data-w=\"morning chores\" data-m=\"아침 집안일\"><b>morning chores</b>아침 집안일</button><button type=\"button\" class=\"wdb\" data-w=\"glow\" data-m=\"불빛, 빛\"><b>glow</b>불빛, 빛</button><button type=\"button\" class=\"wdb\" data-w=\"borrow\" data-m=\"빌리다\"><b>borrow</b>빌리다</button><button type=\"button\" class=\"wdb\" data-w=\"broomstick\" data-m=\"빗자루\"><b>broomstick</b>빗자루</button></div>"};

  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
