var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>맨 끝 문장</b>에 있으면 앞 문장들을 한 단어로 묶는 자리예요. 1~4번에 계속 나오는 <b>as if</b>(마치 ~인 것처럼)·<b>as though</b>(마치 ~인 것처럼)를 한 단어로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (5번)</span><div class=\"en\">You will be amazed at how much better you feel about yourself after just a few minutes of <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">단 몇 분간 ( ? ) 한 뒤에 자신에 대해 얼마나 더 좋게 느끼는지 놀랄 것이다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸의 정체를 글 첫머리에서 미리 알려 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 첫 번째 단서</span><div class=\"en\">You can actually become your own cheerleader by talking to yourself positively and then <mark>acting as if</mark> you were already the person that you wanted to be.</div><p class=\"ko\">자신에게 긍정적으로 말을 걸고 그러고 나서 이미 되고 싶던 그 사람<mark>인 것처럼 행동함으로써</mark> 자기 자신의 응원단장이 될 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>trying out for the role(역할 오디션을 보는) = 아직 아닌 사람을 연기하기</span></div><div class=\"ck-step key\"><span class=\"lab\">2·3번 문장 · 결정적 단서</span><div class=\"en\"><mark>Act as though</mark> you were trying out for the role of a positive, cheerful, happy, and likable person.</div><p class=\"ko\">마치 긍정적이고 명랑하고 행복하고 호감 가는 사람 역할의 오디션을 보는 <mark>것처럼 행동하라</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>1번</em>되고 싶은 사람인 것처럼 행동하기</span><span><em>2·3번</em>밝은 사람 역할 오디션 보듯 걷고 말하기</span><span><em>4번</em>방금 상 받은 것처럼 사람들 대하기</span></div><div class=\"ck-eq\">⇒ 공통점 = 실제로는 아직 아닌데 그런 척하기 → pretending(~인 척하기)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">pretending ~인 척하기<small>1~4번의 as if(마치 ~인 것처럼)·as though(마치 ~인 것처럼)를 한 단어로 묶은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">purchasing 구입하기</span><span class=\"why\">4번의 lottery(복권)·award(상)를 보고 돈·물건을 떠올리면 걸려요. 4번은 복권에 당첨된 것처럼 사람을 대하라는 말이지, 무언가를 사라는 말이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">competing 경쟁하기</span><span class=\"why\">2번 trying out for(~의 오디션을 보다)는 남과 겨루기가 아니라 밝은 사람 역할을 연기해 보라는 뜻이에요. 남을 이기는 장면은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">complaining 불평하기</span><span class=\"why\">1번은 talking to yourself positively(자신에게 긍정적으로 말하기)라고 했어요. 불평은 이 긍정적인 행동과 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">apologizing 사과하기</span><span class=\"why\">1~4번 어디에도 사과하는 장면이 없어요. 4번처럼 상 받은 사람인 듯 당당하게 대하라는 말과도 안 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">You can actually become</div><div class=\"k\">당신은 실제로 될 수 있다</div></div><div class=\"rc\"><div class=\"e\">your own cheerleader</div><div class=\"k\">자기 자신의 응원단장(치어리더)이</div></div><div class=\"rc\"><div class=\"e\">by talking to yourself positively</div><div class=\"k\">자신에게 긍정적으로 말을 걸고</div></div><div class=\"rc ckc\"><div class=\"e\">and then <span class=\"cw\">acting as if</span></div><div class=\"k\"><span class=\"cw\">그러고 나서 ~인 것처럼 행동함으로써</span></div></div><div class=\"rc\"><div class=\"e\">you were already the person</div><div class=\"k\">당신이 이미 그 사람인 것처럼</div></div><div class=\"rc\"><div class=\"e\">that you wanted to be.</div><div class=\"k\">당신이 되고 싶어 했던.</div></div><div class=\"rnat\">자신에게 긍정적으로 말을 걸고 나서 이미 되고 싶었던 바로 그 사람인 것처럼 행동함으로써, 당신은 실제로 자기 자신의 응원단장(치어리더)이 될 수 있다.</div><div class=\"rst\">장기자랑 무대가 떨리는 나. “나는 할 수 있어!” 하고 이미 멋진 사람<b>인 것처럼</b>(as if) 굴면 내가 나의 응원단장이 돼요. = 지문 1번이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Act as though</span></div><div class=\"k\"><span class=\"cw\">마치 ~인 것처럼 행동하라</span></div></div><div class=\"rc\"><div class=\"e\">you were trying out for</div><div class=\"k\">당신이 ~에 지원해 보는(오디션을 보는)</div></div><div class=\"rc\"><div class=\"e\">the role of a positive, cheerful, happy, and likable person.</div><div class=\"k\">긍정적이고 명랑하고 행복하고 호감이 가는 사람 역할을.</div></div><div class=\"rnat\">당신이 긍정적이고 명랑하고 행복하고 호감이 가는 사람의 역할을 해 보려고 오디션을 보는 것처럼 행동하라.</div><div class=\"rst\">밝고 인기 많은 친구 역할 오디션을 보는 것처럼 행동해 봐요. 지문도 <b>마치 ~인 것처럼</b>(as though) 행동하라고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Walk, talk, and act</div><div class=\"k\">걷고, 말하고, 행동하라</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as if you were already</span></div><div class=\"k\"><span class=\"cw\">이미 ~인 것처럼</span></div></div><div class=\"rc\"><div class=\"e\">that person.</div><div class=\"k\">그 사람(= 긍정적이고 쾌활하고 행복하고 호감 가는 사람)인.</div></div><div class=\"rnat\">이미 당신이 그 사람인 것처럼 걷고, 말하고, 행동하라.</div><div class=\"rst\">무대에 오를 때 이미 그 친구가 된 듯 걷고 말하고 움직여요. = 지문 3번의 “이미 그 사람인 것처럼 걷고, 말하고, 행동하라”예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Treat everyone you meet</div><div class=\"k\">당신이 만나는 모든 사람을 대하라</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as though you had just won an award</span></div><div class=\"k\"><span class=\"cw\">마치 방금 상을 받은 것처럼</span></div></div><div class=\"rc\"><div class=\"e\">for being the very best person</div><div class=\"k\">가장 최고의 사람이라는 이유로</div></div><div class=\"rc\"><div class=\"e\">in your industry</div><div class=\"k\">당신의 업계에서</div></div><div class=\"rc\"><div class=\"e\">or as though you had just won the lottery.</div><div class=\"k\">또는 마치 방금 복권에 당첨된 것처럼.</div></div><div class=\"rnat\">당신이 방금 업계에서 가장 최고인 사람에게 주는 상을 받았거나 방금 복권에 당첨된 것처럼, 당신이 만나는 모든 사람을 대하라.</div><div class=\"rst\">만나는 친구마다 방금 상 받은 사람처럼 웃으며 인사해요. 지문은 복권에 당첨된 것처럼 대하라고까지 말해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">You will be amazed</div><div class=\"k\">당신은 깜짝 놀랄 것이다</div></div><div class=\"rc\"><div class=\"e\">at how much better</div><div class=\"k\">얼마나 더 좋게</div></div><div class=\"rc\"><div class=\"e\">you feel about yourself</div><div class=\"k\">자신에 대해 느끼게 되는지</div></div><div class=\"rc ckc\"><div class=\"e\">after just a few minutes of <span class=\"cw\">pretending</span>.</div><div class=\"k\">단 몇 분간의 <span class=\"cw\">흉내 내기</span> 후에.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">단 몇 분간 &lt;b&gt;흉내 내기&lt;/b&gt;를 한 뒤에 자신에 대해 얼마나 더 좋게 느끼게 되었는지 알고 깜짝 놀랄 것이다.</div><div class=\"rst\">몇 분만 그렇게 <b>척해 봐도</b>(pretending ~인 척하기) 내 기분이 훨씬 좋아져서 깜짝 놀라요. 그래서 빈칸은 pretending(~인 척하기)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"act as if\" data-m=\"마치 ~인 것처럼 행동하다\"><b>act as if</b>마치 ~인 것처럼 행동하다</button><button type=\"button\" class=\"wdb\" data-w=\"cheerleader\" data-m=\"응원단장\"><b>cheerleader</b>응원단장</button><button type=\"button\" class=\"wdb\" data-w=\"likable\" data-m=\"호감 가는\"><b>likable</b>호감 가는</button><button type=\"button\" class=\"wdb\" data-w=\"treat\" data-m=\"대하다, 대우하다\"><b>treat</b>대하다, 대우하다</button><button type=\"button\" class=\"wdb\" data-w=\"lottery\" data-m=\"복권\"><b>lottery</b>복권</button><button type=\"button\" class=\"wdb\" data-w=\"be amazed at\" data-m=\"~에 깜짝 놀라다\"><b>be amazed at</b>~에 깜짝 놀라다</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 <b>wearing masks</b>(가면을 쓰고 있다)는 비유예요. 글자 그대로의 가면이 아니라, 앞의 <b>여러 배역</b>과 뒤의 <b>예시(5~7번)</b>가 말하는 속뜻으로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (3번)</span><div class=\"en\">writers such as Shakespeare are implying that all of us <mark>are constantly wearing masks</mark>.</div><p class=\"ko\">셰익스피어 같은 작가들은 우리 모두가 <mark>끊임없이 가면을 쓰고 있다</mark>는 것을 암시하고 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>가면 = 셰익스피어 인용문 속 “배역”을 바꿔 말한 것</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 비유의 출발점</span><div class=\"en\">And one man in his time <mark>plays many parts</mark>.</div><p class=\"ko\">한 사람이 평생 동안 <mark>여러 배역을 연기한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>밑줄 뒤 예시: 속마음을 감추고 겉모습을 바꿈</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 가면의 예 ①</span><div class=\"en\">Evil types such as Iago … <mark>are able to conceal</mark> their hostile intentions behind a friendly smile.</div><p class=\"ko\">이아고 같은 악한 인물들은 적대적인 의도를 친근한 미소 뒤에 <mark>숨길 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>연기를 잘하는 사람 = 사회적 환경에 맞춰 움직이는 사람</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">People with excellent acting skills <mark>can better navigate</mark> our complex social environments and get ahead.</div><p class=\"ko\">뛰어난 연기력을 가진 사람들은 우리의 복잡한 사회적 환경을 <mark>더 잘 헤쳐 나갈 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2번</em>한 사람이 상황마다 다른 배역을 맡는다</span><span><em>5·6번</em>미소로 속마음 감추기, 자신감 있게 연기하기</span><span><em>7번</em>복잡한 사회 환경을 연기력으로 헤쳐 나가기</span></div><div class=\"ck-eq\">⇒ 가면을 쓴다 = 사회적 상황에 맞춰 행동을 조절한다 → ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">adjusting our behavior based on the social context given 주어진 사회적 맥락에 맞춰 행동을 조절하기<small>2번 plays many parts(여러 배역을 연기한다)와 7번 navigate(헤쳐 나가다)를 한 번에 담은 속뜻이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">performing on stage to show off our acting skills 연기력을 뽐내기 위해 무대에서 공연하기</span><span class=\"why\">2번 stage(무대)와 7번 acting skills(연기력)를 그대로 가져온 함정이에요. 지문의 무대는 진짜 무대가 아니라 사회생활이고, 연기력도 뽐내려는 게 아니라 상황을 헤쳐 나가려는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">protecting our faces from harmful external forces 해로운 외부의 힘으로부터 얼굴을 보호하기</span><span class=\"why\">masks(가면)를 글자 그대로 읽은 함정이에요. 3번의 가면은 극장·배우를 나타내는 이미지라서 얼굴 보호와 상관없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">feeling confident by beating others in competition 경쟁에서 남을 이겨 자신감을 느끼기</span><span class=\"why\">6번 confidence(자신감)만 따왔어요. 6번은 자신감 있게 연기한다는 말이지, 남을 이겨서 자신감을 얻는다는 말이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">doing completely the opposite of what others expect 남들이 기대하는 것과 완전히 반대로 행동하기</span><span class=\"why\">5번 이아고는 상황에 맞게 친근한 미소를 지어 보여요. 남들 기대와 반대로 가는 게 아니라 오히려 상황에 맞추는 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Over the centuries</div><div class=\"k\">여러 세기에 걸쳐</div></div><div class=\"rc\"><div class=\"e\">various writers and thinkers,</div><div class=\"k\">다양한 작가와 사상가들은,</div></div><div class=\"rc\"><div class=\"e\">looking at humans</div><div class=\"k\">인간을 바라보며,</div></div><div class=\"rc\"><div class=\"e\">from an outside perspective,</div><div class=\"k\">바깥의 관점에서,</div></div><div class=\"rc\"><div class=\"e\">have been struck by</div><div class=\"k\">인상을 받아 왔다</div></div><div class=\"rc\"><div class=\"e\">the theatrical quality of social life.</div><div class=\"k\">사회적 삶의 연극적 속성에.</div></div><div class=\"rnat\">여러 세기에 걸쳐 다양한 작가와 사상가들은 인간을 바깥의 관점에서 바라보며 사회적 삶의 연극적 속성에 깊은 인상을 받아 왔다.</div><div class=\"rst\">학교에서 나를 밖에서 지켜보면, 내 하루는 꼭 연극 같아요. 지문도 사람들이 사회생활의 <b>연극적 속성</b>에 놀라 왔다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The most famous quote</div><div class=\"k\">가장 유명한 인용문은</div></div><div class=\"rc\"><div class=\"e\">expressing this</div><div class=\"k\">이것(= 사회생활의 연극적 속성)을 표현하는</div></div><div class=\"rc\"><div class=\"e\">comes from Shakespeare:</div><div class=\"k\">셰익스피어에게서 나온다:</div></div><div class=\"rc\"><div class=\"e\">“All the world’s a stage, /</div><div class=\"k\">“온 세상은 무대이고, /</div></div><div class=\"rc\"><div class=\"e\">And all the men and women</div><div class=\"k\">그리고 모든 남자와 여자는</div></div><div class=\"rc\"><div class=\"e\">merely players; /</div><div class=\"k\">그저 배우일 뿐이다; /</div></div><div class=\"rc\"><div class=\"e\">They have their exits and their entrances, /</div><div class=\"k\">그들은 각자 퇴장과 입장이 있고, /</div></div><div class=\"rc ckc\"><div class=\"e\">And one man in his time <span class=\"cw\">plays many parts</span>.”</div><div class=\"k\">한 사람이 평생 동안 <span class=\"cw\">여러 배역을 연기한다</span>.”</div></div><div class=\"rnat\">이것을 표현하는 가장 유명한 인용문은 셰익스피어에게서 나온다. \"온 세상은 무대이고, / 모든 남자와 여자는 그저 배우일 뿐이다. / 그들은 각자 퇴장과 입장이 있고, / 한 사람이 평생 여러 배역을 연기한다.\"</div><div class=\"rst\">교실에선 학생, 집에선 가족, 동아리에선 선배. 하루에 <b>여러 배역</b>을 맡아요. = 셰익스피어의 “한 사람이 여러 배역을 연기한다”예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If the theater and actors were traditionally represented</div><div class=\"k\">극장과 배우가 전통적으로 표현되어 왔다면</div></div><div class=\"rc\"><div class=\"e\">by the image of masks,</div><div class=\"k\">가면의 이미지로,</div></div><div class=\"rc\"><div class=\"e\">writers such as Shakespeare</div><div class=\"k\">셰익스피어 같은 작가들은</div></div><div class=\"rc\"><div class=\"e\">are implying that</div><div class=\"k\">~라는 것을 암시하고 있는 것이다</div></div><div class=\"rc\"><div class=\"e\">all of us</div><div class=\"k\">우리 모두가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are constantly wearing masks</span>.</div><div class=\"k\"><span class=\"cw\">끊임없이 가면을 쓰고 있다</span>(= 주어진 사회적 상황에 따라 행동을 조절한다는 뜻)</div></div><div class=\"rnat\">극장과 배우가 전통적으로 가면의 이미지로 표현되어 왔다면, 셰익스피어 같은 작가들은 우리 모두가 &lt;b&gt;끊임없이 가면을 쓰고 있다&lt;/b&gt;는 것(= 주어진 사회적 상황에 따라 우리의 행동을 조절한다는 것)을 암시하고 있는 것이다.</div><div class=\"rst\">그래서 우리는 늘 <b>가면</b>을 쓰는 셈이에요. 장소마다 거기에 맞게 행동을 바꾼다는 뜻이고, 이게 지문 3번의 속뜻이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Some people</div><div class=\"k\">어떤 사람들은</div></div><div class=\"rc\"><div class=\"e\">are better actors</div><div class=\"k\">더 나은 배우이다</div></div><div class=\"rc\"><div class=\"e\">than others.</div><div class=\"k\">다른 사람들보다.</div></div><div class=\"rnat\">어떤 사람들은 다른 사람들보다 더 나은 배우이다.</div><div class=\"rst\">그런데 친구들마다 이 연기 실력이 달라요. 지문도 어떤 사람은 남보다 <b>더 나은 배우</b>라고 해요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Evil types such as Iago</div><div class=\"k\">이아고 같은 악한 유형의 인물들은</div></div><div class=\"rc\"><div class=\"e\">in the play Othello</div><div class=\"k\">희곡 〈오셀로〉 속</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are able to conceal</span></div><div class=\"k\"><span class=\"cw\">숨길 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">their hostile intentions</div><div class=\"k\">그들(= 악한 인물들)의 적대적인 의도를</div></div><div class=\"rc\"><div class=\"e\">behind a friendly smile.</div><div class=\"k\">친근한 미소 뒤에.</div></div><div class=\"rnat\">희곡 〈오셀로〉 속 이아고와 같은 악한 유형의 인물들은 자신들의 적대적인 의도를 친근한 미소 뒤에 숨길 수 있다.</div><div class=\"rst\">속으로는 화났는데 웃으며 넘기는 친구처럼, 지문의 이아고도 나쁜 속마음을 친근한 미소 뒤에 <b>숨겨요</b>.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Others</div><div class=\"k\">다른 사람들은</div></div><div class=\"rc\"><div class=\"e\">are able to act</div><div class=\"k\">연기할(행동할) 수 있다</div></div><div class=\"rc\"><div class=\"e\">with more confidence and bravado</div><div class=\"k\">더 많은 자신감과 허세를 가지고</div></div><div class=\"rc\"><div class=\"e\">— they often become leaders.</div><div class=\"k\">— 그들(= 그런 사람들)은 흔히 리더가 된다.</div></div><div class=\"rnat\">다른 사람들은 더 많은 자신감과 허세를 가지고 연기할 수 있고, 그들은 흔히 리더가 된다.</div><div class=\"rst\">떨려도 당당한 척하며 반 앞에서 말하는 친구는 반장이 되기도 해요. = 지문의 자신감 있게 연기하는 사람은 리더가 된다예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">People with excellent acting skills</div><div class=\"k\">뛰어난 연기력을 가진 사람들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">can better navigate</span></div><div class=\"k\"><span class=\"cw\">더 잘 헤쳐 나갈 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">our complex social environments</div><div class=\"k\">우리의 복잡한 사회적 환경을</div></div><div class=\"rc\"><div class=\"e\">and get ahead.</div><div class=\"k\">그리고 앞서 나갈 수 있다.</div></div><div class=\"rnat\">뛰어난 연기력을 가진 사람들은 우리의 복잡한 사회적 환경을 더 잘 헤쳐 나갈 수 있고 앞서 나갈 수 있다.</div><div class=\"rst\">결국 상황에 맞게 잘 바꾸는 친구가 복잡한 학교생활을 <b>잘 헤쳐 나가요</b>. 그래서 밑줄은 “상황에 맞춰 행동 조절하기”(⑤)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"theatrical\" data-m=\"연극의, 연극적인\"><b>theatrical</b>연극의, 연극적인</button><button type=\"button\" class=\"wdb\" data-w=\"merely\" data-m=\"그저, 단지\"><b>merely</b>그저, 단지</button><button type=\"button\" class=\"wdb\" data-w=\"imply\" data-m=\"암시하다\"><b>imply</b>암시하다</button><button type=\"button\" class=\"wdb\" data-w=\"conceal\" data-m=\"숨기다\"><b>conceal</b>숨기다</button><button type=\"button\" class=\"wdb\" data-w=\"hostile\" data-m=\"적대적인\"><b>hostile</b>적대적인</button><button type=\"button\" class=\"wdb\" data-w=\"navigate\" data-m=\"헤쳐 나가다\"><b>navigate</b>헤쳐 나가다</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 <b>두 칸을 서로 다른 문장에서</b> 찾아요. (A)는 첫 문장의 <b>indicator</b>(지표), (B)는 7번 <b>compensate for</b>(상쇄하다)와 8번 <b>Similarly</b>(마찬가지로)의 예에서 찾으세요.</p><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · (A)의 단서</span><div class=\"en\">Distance is <mark>a reliable indicator</mark> of the relationship between two people.</div><p class=\"ko\">거리는 두 사람 사이의 관계를 알려 주는 <mark>믿을 만한 지표</mark>이다.</p></div><div class=\"ck-via\"><i>▼</i><span>지표인 이유: 관계가 가까울수록 거리가 좁아짐</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 관계에 따라 정해지는 거리</span><div class=\"en\">Strangers stand further apart than do acquaintances, … and friends stand further apart than romantic partners.</div><p class=\"ko\">모르는 사람 > 지인 > 친구 > 연인 순으로 멀리 떨어져 선다.</p></div><div class=\"ck-via\"><i>▼</i><span>3번처럼 규칙이 깨질 때(꽉 찬 엘리베이터) 사람이 하는 행동</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · (B)의 단서</span><div class=\"en\">By reducing closeness in one nonverbal channel (eye contact), one can <mark>compensate for</mark> unwanted closeness in another channel (proximity).</div><p class=\"ko\">한 비언어적 채널(눈맞춤)에서 가까움을 줄여서, 다른 채널(근접성)의 원치 않는 가까움을 <mark>상쇄할 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Similarly(마찬가지로): 멀면 오히려 눈맞춤을 늘림 → 줄이기만 하는 게 아니라 맞춤</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 반대 방향 예</span><div class=\"en\">you are likely to maintain <mark>constant eye contact</mark></div><p class=\"ko\"><mark>계속되는 눈맞춤을</mark> 유지하기 쉽다</p></div><div class=\"ck-via\"><i>▼</i><span>indicator(지표) → (A) determined(결정되는), compensate for(상쇄하다) → (B) adjust(조절하다)</span></div><div class=\"ck-step\"><span class=\"lab\">요약문 (9번) · 짝 맞추기</span><div class=\"en\">Physical distance between people <mark>is determined by relationship status</mark>, but … <mark>people adjust their nonverbal communication</mark> to establish a comfortable psychological distance.</div><p class=\"ko\">물리적 거리는 관계의 상태에 의해 <mark>(A) 결정되지만</mark>, … 사람들은 비언어적 소통을 <mark>(B) 조절한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">determined 결정되는 … adjust 조절한다<small>거리는 관계가 정하고(1·2번), 안 맞으면 눈맞춤을 줄이거나 늘려 맞춰요(7·8번)</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">measured 측정되는 … decrease 줄인다</span><span class=\"why\">7번 reducing(줄이다) 때문에 decrease(줄인다)가 끌려요. 하지만 8번은 멀리 앉으면 눈맞춤을 오히려 계속 유지한다고 했으니 줄이기만 하는 게 아니라 맞추는 거예요. measured(측정되는)도 1번 indicator(지표)와 달라요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">concealed 숨겨지는 … interpret 해석한다</span><span class=\"why\">2번처럼 거리는 관계를 그대로 드러내는 지표예요. 관계가 숨겨진다는 말은 없고, 7번은 눈맞춤을 해석하는 게 아니라 줄여서 상쇄하는 행동이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">influenced 영향받는 … ignore 무시한다</span><span class=\"why\">(A)는 비슷해 보여도 (B)가 틀려요. 6번에서 엘리베이터 버튼만 보며 심리적 공간을 만들려 애썼으니 소통을 무시하는 게 아니라 바꾸는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">predicted 예측되는 … stop 멈춘다</span><span class=\"why\">지문에 거리를 예측한다는 말이 없어요. 8번은 눈맞춤을 멈추는 게 아니라 constant eye contact(계속되는 눈맞춤)를 유지한다고 했어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Distance is</div><div class=\"k\">거리는 ~이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a reliable indicator</span></div><div class=\"k\"><span class=\"cw\">믿을 만한 지표</span></div></div><div class=\"rc\"><div class=\"e\">of the relationship</div><div class=\"k\">관계의</div></div><div class=\"rc\"><div class=\"e\">between two people.</div><div class=\"k\">두 사람 사이의.</div></div><div class=\"rnat\">거리는 두 사람 사이의 관계를 알려 주는 믿을 만한 지표이다.</div><div class=\"rst\">학원 엘리베이터 앞에 서 보면, 누구랑 얼마나 가까이 서는지로 사이가 보여요. = 지문의 거리는 관계의 <b>믿을 만한 지표</b>예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">Strangers stand further apart</div><div class=\"k\">모르는 사람들은 더 멀리 떨어져 선다</div></div><div class=\"rc\"><div class=\"e\">than do acquaintances,</div><div class=\"k\">지인들보다,</div></div><div class=\"rc\"><div class=\"e\">acquaintances stand further apart</div><div class=\"k\">지인들은 더 멀리 떨어져 서고</div></div><div class=\"rc\"><div class=\"e\">than friends,</div><div class=\"k\">친구들보다,</div></div><div class=\"rc\"><div class=\"e\">and friends stand further apart</div><div class=\"k\">그리고 친구들은 더 멀리 떨어져 선다</div></div><div class=\"rc\"><div class=\"e\">than romantic partners.</div><div class=\"k\">연인들보다.</div></div><div class=\"rnat\">모르는 사람들은 지인들보다 더 멀리 떨어져 서고, 지인들은 친구들보다 더 멀리 떨어져 서며, 친구들은 연인들보다 더 멀리 떨어져 선다.</div><div class=\"rst\">처음 보는 사람과는 멀리, 같은 반 아이와는 조금 가까이, 단짝과는 딱 붙어 서요. 지문도 관계에 따라 거리가 <b>정해진다</b>고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Sometimes, of course,</div><div class=\"k\">물론 때때로,</div></div><div class=\"rc\"><div class=\"e\">these rules are violated.</div><div class=\"k\">이런 규칙들은 깨지기도 한다.</div></div><div class=\"rnat\">물론 때때로 이런 규칙들은 깨지기도 한다.</div><div class=\"rst\">그런데 이 규칙이 깨질 때도 있어요. 지문은 여기서 “물론 때로는 규칙이 깨진다”고 방향을 틀어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Recall the last time</div><div class=\"k\">마지막 때를 떠올려 보라</div></div><div class=\"rc\"><div class=\"e\">you rode 20 stories</div><div class=\"k\">당신이 20개 층을 이동했던</div></div><div class=\"rc\"><div class=\"e\">in an elevator packed with</div><div class=\"k\">~로 가득 찬 엘리베이터 안에서</div></div><div class=\"rc\"><div class=\"e\">total strangers.</div><div class=\"k\">완전히 모르는 사람들로.</div></div><div class=\"rnat\">완전히 모르는 사람들로 가득 찬 엘리베이터를 타고 20개 층을 이동했던 마지막 때를 떠올려 보라.</div><div class=\"rst\">수업 끝나고 모르는 사람들로 꽉 찬 엘리베이터를 타고 20층까지 올라간 때를 떠올려 봐요. 지문이 드는 예예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The sardine-like experience</div><div class=\"k\">승객이 빽빽이 들어찬 그 경험은</div></div><div class=\"rc\"><div class=\"e\">no doubt</div><div class=\"k\">분명</div></div><div class=\"rc\"><div class=\"e\">made the situation</div><div class=\"k\">그 상황을</div></div><div class=\"rc\"><div class=\"e\">a bit uncomfortable.</div><div class=\"k\">조금 불편하게 만들었을 것이다.</div></div><div class=\"rnat\">승객이 빽빽이 들어찬 그 경험은 분명 그 상황을 조금 불편하게 만들었을 것이다.</div><div class=\"rst\">통조림 속 정어리처럼 끼어 있으니 좀 불편했죠. 지문도 그 경험이 상황을 불편하게 만들었다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">With your physical space violated,</div><div class=\"k\">당신의 물리적 공간이 침범된 상태에서,</div></div><div class=\"rc\"><div class=\"e\">you may have tried to create</div><div class=\"k\">당신은 만들어 내려 했을지도 모른다</div></div><div class=\"rc\"><div class=\"e\">“psychological” space</div><div class=\"k\">'심리적' 공간을</div></div><div class=\"rc\"><div class=\"e\">by avoiding eye contact,</div><div class=\"k\">눈맞춤을 피함으로써,</div></div><div class=\"rc\"><div class=\"e\">focusing instead on the elevator buttons.</div><div class=\"k\">대신 엘리베이터 버튼에 집중하면서.</div></div><div class=\"rnat\">물리적 공간이 침범당한 상태에서, 당신은 눈맞춤을 피하고 대신 엘리베이터 버튼에 집중하면서 '심리적' 공간을 만들어 내려 했을지도 모른다.</div><div class=\"rst\">그래서 다들 눈을 피하고 층 버튼만 쳐다봐요. = 지문의 눈맞춤을 피해 마음의 공간을 만드는 행동이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">By reducing closeness</div><div class=\"k\">가까움을 줄임으로써</div></div><div class=\"rc\"><div class=\"e\">in one nonverbal channel (eye contact),</div><div class=\"k\">한 비언어적 채널(눈맞춤)에서,</div></div><div class=\"rc ckc\"><div class=\"e\">one can <span class=\"cw\">compensate for</span></div><div class=\"k\">사람은 <span class=\"cw\">상쇄할 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">unwanted closeness</div><div class=\"k\">원치 않는 가까움을</div></div><div class=\"rc\"><div class=\"e\">in another channel (proximity).</div><div class=\"k\">다른 채널(근접성)에서의.</div></div><div class=\"rnat\">한 비언어적 채널(눈맞춤)에서 가까움을 줄임으로써, 사람은 다른 채널(근접성)에서 원치 않는 가까움을 상쇄할 수 있다.</div><div class=\"rst\">몸이 너무 가까우니 눈맞춤을 줄여서 그만큼을 <b>상쇄해요</b>(compensate for 상쇄하다). = 지문 7번, (B) 조절의 첫 번째 증거예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Similarly,</div><div class=\"k\">마찬가지로,</div></div><div class=\"rc\"><div class=\"e\">if you are talking with someone</div><div class=\"k\">만약 당신이 어떤 사람과 이야기하고 있다면</div></div><div class=\"rc\"><div class=\"e\">who is seated several feet away</div><div class=\"k\">몇 피트 떨어져 앉아 있는</div></div><div class=\"rc\"><div class=\"e\">at a large table,</div><div class=\"k\">큰 테이블에서,</div></div><div class=\"rc\"><div class=\"e\">you are likely to maintain</div><div class=\"k\">당신은 ~을 유지하기 쉽다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">constant eye contact</span></div><div class=\"k\"><span class=\"cw\">계속되는 눈맞춤을</span></div></div><div class=\"rc\"><div class=\"e\">— something you might feel uncomfortable doing</div><div class=\"k\">— 불편하게 느낄 수도 있는 그 일(= 계속 눈을 맞추는 것)을</div></div><div class=\"rc\"><div class=\"e\">if you were standing next to each other.</div><div class=\"k\">서로 옆에 서 있다면.</div></div><div class=\"rnat\">마찬가지로, 큰 테이블에서 몇 피트 떨어져 앉아 있는 누군가와 이야기하고 있다면, 아마 계속 눈을 마주칠 것이다. 서로 바로 옆에 서 있다면 그렇게 하기가 불편할 수도 있는 일이다.</div><div class=\"rst\"><b>마찬가지로</b>(Similarly) 급식 테이블 건너편 친구와는 눈을 계속 맞춰요. = 지문 8번, 멀면 늘리고 가까우면 줄이며 맞추는 거예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Physical distance between people</div><div class=\"k\">사람들 사이의 물리적 거리는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is determined by relationship status</span>,</div><div class=\"k\"><span class=\"cw\">관계의 상태에 의해 결정되지만</span>,※ 문제지엔 (A) 빈칸</div></div><div class=\"rc\"><div class=\"e\">but when the distance is not appropriate,</div><div class=\"k\">그 거리가 적절하지 않을 때</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">people adjust their nonverbal communication</span></div><div class=\"k\"><span class=\"cw\">사람들은 비언어적 소통을 조절한다</span>※ 문제지엔 (B) 빈칸</div></div><div class=\"rc\"><div class=\"e\">to establish a comfortable psychological distance.</div><div class=\"k\">편안한 심리적 거리를 확립하기 위해.</div></div><div class=\"rnat\">[요약문] 사람들 사이의 물리적 거리는 관계의 상태에 의해 &lt;b&gt;(A) 결정되지만&lt;/b&gt;, 그 거리가 적절하지 않을 때 사람들은 편안한 심리적 거리를 확립하기 위해 비언어적 소통을 &lt;b&gt;(B) 조절한다&lt;/b&gt;.</div><div class=\"rst\">정리하면, 거리는 사이에 따라 <b>결정되고</b>(determined), 안 맞으면 눈맞춤을 <b>조절해요</b>(adjust). 그래서 정답은 ①이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"reliable\" data-m=\"믿을 만한\"><b>reliable</b>믿을 만한</button><button type=\"button\" class=\"wdb\" data-w=\"indicator\" data-m=\"지표\"><b>indicator</b>지표</button><button type=\"button\" class=\"wdb\" data-w=\"acquaintance\" data-m=\"아는 사이, 지인\"><b>acquaintance</b>아는 사이, 지인</button><button type=\"button\" class=\"wdb\" data-w=\"violate\" data-m=\"침해하다, 어기다\"><b>violate</b>침해하다, 어기다</button><button type=\"button\" class=\"wdb\" data-w=\"compensate for\" data-m=\"~을 상쇄하다, 보완하다\"><b>compensate for</b>~을 상쇄하다, 보완하다</button><button type=\"button\" class=\"wdb\" data-w=\"proximity\" data-m=\"근접성\"><b>proximity</b>근접성</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">첫 문장이 <b>자동차 의존 = 문제</b>라고 화제를 정해요. 그 해법인 <b>프라이부르크의 지속 가능한 교통 정책</b>과 어긋나게, 자동차를 <b>칭찬하는</b> 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 글 전체 화제</span><div class=\"en\">There is growing evidence that <mark>dependence on automobile travel</mark> contributes to insufficient physical activity, …</div><p class=\"ko\"><mark>자동차 이동에 대한 의존이</mark> 신체 활동 부족 등의 원인이 된다는 증거가 늘고 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>문제(자동차 의존)의 해법으로 프라이부르크가 등장</span></div><div class=\"ck-step\"><span class=\"lab\">①(2번) · 해법 소개</span><div class=\"en\">The city of Freiburg in Germany has been successful in applying <mark>sustainable transport policies</mark> …</div><p class=\"ko\">독일의 프라이부르크시는 <mark>지속 가능한 교통 정책을</mark> 적용하는 데 성공해 왔다.</p></div><div class=\"ck-via\"><i>▼</i><span>자동차를 문제로 보던 글이 갑자기 자동차 덕을 칭찬함</span></div><div class=\"ck-step key\"><span class=\"lab\">②(3번) · 이탈 지점</span><div class=\"en\"><mark>Thanks to the automobile</mark>, the vast majority of Germans soon had a freedom of movement previously unknown.</div><p class=\"ko\"><mark>자동차 덕분에</mark>, 대다수의 독일인들은 곧 이전에 몰랐던 이동의 자유를 누리게 되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>②를 빼면 ①의 정책 → ③의 정책 내용으로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">③(4번) · 다시 제자리</span><div class=\"en\">Over the last three decades, transport policies in Freiburg have encouraged <mark>more walking, cycling</mark>, and use of public transport.</div><p class=\"ko\">지난 30년 동안 프라이부르크의 교통 정책은 <mark>더 많은 걷기, 자전거 타기</mark>, 대중교통 이용을 장려해 왔다.</p></div><div class=\"ck-via\"><i>▼</i><span>this period(이 기간) = ③의 지난 30년</span></div><div class=\"ck-step\"><span class=\"lab\">④(5번) · 정책의 성과</span><div class=\"en\"><mark>During this period</mark>, the number of bicycle trips has tripled, …</div><p class=\"ko\"><mark>이 기간 동안(= 지난 30년)</mark>, 자전거 이동의 수는 세 배로 늘었고, …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">자동차 덕분에 대다수 독일인이 이동의 자유를 누리게 되었다<small>자동차 의존을 줄이자는 글에서 혼자 자동차를 칭찬해 방향이 정반대예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">1990년 이후 자동차 보유율은 그대로이고 교통 부문 이산화탄소 배출은 줄었다</span><span class=\"why\">motorization rates(차량 보급 비율)라는 자동차 말이 나와 튀어 보이지만, 차가 늘지 않고 1번에서 문제였던 이산화탄소 배출이 줄었다는 정책 성과예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">독일 프라이부르크시가 지속 가능한 교통 정책을 성공적으로 시행해 왔다</span><span class=\"why\">1번의 문제(자동차 의존)에 대한 해법으로 sustainable transport policies(지속 가능한 교통 정책)를 소개해서 화제가 이어져요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">지난 30년간 프라이부르크의 교통 정책은 걷기·자전거·대중교통을 장려해 왔다</span><span class=\"why\">①의 정책이 실제로 무엇인지 보여 줘요. 걷기·자전거·대중교통은 1번의 자동차 의존과 신체 활동 부족을 줄이는 방법이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">이 기간에 자전거 통행량은 세 배, 대중교통은 두 배가 되고 자동차 이용 비율은 감소했다</span><span class=\"why\">this period(이 기간)가 ③의 지난 30년을 받아서, 정책 결과를 38%에서 32%처럼 숫자로 보여 줘요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There is growing evidence</div><div class=\"k\">늘어나는 증거가 있다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">dependence on automobile travel</span></div><div class=\"k\"><span class=\"cw\">자동차 이동에 대한 의존이</span></div></div><div class=\"rc\"><div class=\"e\">contributes to</div><div class=\"k\">~의 원인이 된다는</div></div><div class=\"rc\"><div class=\"e\">insufficient physical activity,</div><div class=\"k\">불충분한 신체 활동,</div></div><div class=\"rc\"><div class=\"e\">transport-related carbon dioxide emissions,</div><div class=\"k\">교통과 관련된 이산화탄소 배출,</div></div><div class=\"rc\"><div class=\"e\">and traffic congestion.</div><div class=\"k\">그리고 교통 혼잡의.</div></div><div class=\"rnat\">자동차 이동에 의존하는 것이 신체 활동 부족, 교통 관련 이산화탄소 배출, 교통 혼잡의 원인이 된다는 증거가 늘고 있다.</div><div class=\"rst\">매일 집 차로만 등교하면 운동은 부족하고, 매연도 나오고, 교문 앞은 꽉 막혀요. = 지문 1번의 <b>자동차 의존</b>이 부르는 문제예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">① The city of Freiburg in Germany</div><div class=\"k\">① 독일의 프라이부르크시는</div></div><div class=\"rc\"><div class=\"e\">has been successful in applying</div><div class=\"k\">적용하는 데 성공해 왔다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">sustainable transport policies</span></div><div class=\"k\"><span class=\"cw\">지속 가능한 교통 정책을</span></div></div><div class=\"rc\"><div class=\"e\">that may influence</div><div class=\"k\">그것(= 교통 정책)이 ~에 영향을 줄 수 있는</div></div><div class=\"rc\"><div class=\"e\">car-oriented countries</div><div class=\"k\">자동차 중심의 국가들에</div></div><div class=\"rc\"><div class=\"e\">around the world.</div><div class=\"k\">전 세계의.</div></div><div class=\"rnat\">① 독일 프라이부르크시는 전 세계 자동차 중심 국가들에 영향을 줄 만한 지속 가능한 교통 정책을 성공적으로 시행해 왔다.</div><div class=\"rst\">① 그래서 어떤 학교는 “걸어서·자전거로 오기” 규칙을 만들어 성공했어요. = 지문의 프라이부르크 <b>지속 가능한 교통 정책</b>이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">② <span class=\"cw\">Thanks to the automobile</span>,</div><div class=\"k\">② <span class=\"cw\">자동차 덕분에</span>,</div></div><div class=\"rc\"><div class=\"e\">the vast majority of Germans</div><div class=\"k\">대다수의 독일인들은</div></div><div class=\"rc\"><div class=\"e\">soon had a freedom of movement</div><div class=\"k\">곧 이동의 자유를 누리게 되었다</div></div><div class=\"rc\"><div class=\"e\">previously unknown.</div><div class=\"k\">이전에는 알려지지 않았던.</div></div><div class=\"rnat\">② 자동차 덕분에 대다수 독일인은 곧 이전에는 알지 못했던 이동의 자유를 누리게 되었다.</div><div class=\"rst\">② 그런데 갑자기 “차 덕분에 어디든 편하게 다닌다”고 차를 칭찬해요. 차를 줄이자는 흐름과 <b>정반대</b>라 지문에서 튀어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">③ Over the last three decades,</div><div class=\"k\">③ 지난 30년 동안,</div></div><div class=\"rc\"><div class=\"e\">transport policies in Freiburg</div><div class=\"k\">프라이부르크의 교통 정책은</div></div><div class=\"rc\"><div class=\"e\">have encouraged</div><div class=\"k\">장려해 왔다</div></div><div class=\"rc\"><div class=\"e\">more walking, cycling,</div><div class=\"k\">더 많은 걷기, 자전거 타기,</div></div><div class=\"rc\"><div class=\"e\">and use of public transport.</div><div class=\"k\">그리고 대중교통 이용을.</div></div><div class=\"rnat\">③ 지난 30년 동안 프라이부르크의 교통 정책은 걷기, 자전거 타기, 대중교통 이용을 더 장려해 왔다.</div><div class=\"rst\">③ 다시 학교 규칙 얘기예요. 걷기, 자전거, 버스를 타자고 계속 권했어요. = 지문의 지난 30년 동안의 정책이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\">④ <span class=\"cw\">During this period</span>,</div><div class=\"k\">④ <span class=\"cw\">이 기간 동안(= 지난 30년)</span>,</div></div><div class=\"rc\"><div class=\"e\">the number of bicycle trips has tripled,</div><div class=\"k\">자전거 이동의 수는 세 배로 늘었고,</div></div><div class=\"rc\"><div class=\"e\">travel by public transport has doubled,</div><div class=\"k\">대중교통 이동은 두 배로 늘었으며,</div></div><div class=\"rc\"><div class=\"e\">and the proportion of journeys by automobile</div><div class=\"k\">그리고 자동차 이동의 비율은</div></div><div class=\"rc\"><div class=\"e\">has declined from 38% to 32%.</div><div class=\"k\">38%에서 32%로 줄었다.</div></div><div class=\"rnat\">④ 이 기간에 자전거 통행량은 세 배가 되었고, 대중교통 이용은 두 배가 되었으며, 자동차 이용 비율은 38%에서 32%로 떨어졌다.</div><div class=\"rst\">④ 그동안 자전거로 오는 친구는 세 배, 버스로 오는 친구는 두 배가 됐어요. 지문도 자동차 비율이 38%에서 32%로 줄었대요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">⑤ Since 1990,</div><div class=\"k\">⑤ 1990년 이후,</div></div><div class=\"rc\"><div class=\"e\">motorization rates have stayed the same</div><div class=\"k\">차량 보급 비율은 그대로 유지되었고</div></div><div class=\"rc\"><div class=\"e\">and carbon dioxide emissions from transport have fallen,</div><div class=\"k\">교통에서 나오는 이산화탄소 배출량은 줄었다,</div></div><div class=\"rc\"><div class=\"e\">despite strong economic growth.</div><div class=\"k\">강한 경제 성장에도 불구하고.</div></div><div class=\"rnat\">⑤ 1990년 이후 강력한 경제 성장에도 불구하고 차량 보급 비율은 그대로였고 교통 부문의 이산화탄소 배출량은 줄어들었다.</div><div class=\"rst\">⑤ 학교가 커져도 차로 오는 수는 그대로고 매연은 줄었어요. = 지문의 경제가 성장해도 배출량이 줄었다는 성과예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"dependence\" data-m=\"의존\"><b>dependence</b>의존</button><button type=\"button\" class=\"wdb\" data-w=\"insufficient\" data-m=\"불충분한\"><b>insufficient</b>불충분한</button><button type=\"button\" class=\"wdb\" data-w=\"congestion\" data-m=\"혼잡\"><b>congestion</b>혼잡</button><button type=\"button\" class=\"wdb\" data-w=\"sustainable\" data-m=\"지속 가능한\"><b>sustainable</b>지속 가능한</button><button type=\"button\" class=\"wdb\" data-w=\"proportion\" data-m=\"비율\"><b>proportion</b>비율</button><button type=\"button\" class=\"wdb\" data-w=\"motorization rate\" data-m=\"차량 보급 비율\"><b>motorization rate</b>차량 보급 비율</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 제목은 <b>첫 문장(결론 예고)</b>과 <b>마지막 부분(우리 모두로 확장)</b>을 묶어요. 1번 “뇌는 우리를 <b>속이는</b> 이야기를 지어낸다” + 그 근거인 <b>분리뇌 환자 실험</b>이 둘 다 든 제목을 고르세요.</p><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · 결론 예고</span><div class=\"en\">our brains … <mark>excel at creating</mark> coherent (but not necessarily true) stories <mark>that deceive us</mark>.</div><p class=\"ko\">우리의 뇌는 <mark>우리를 속이는</mark> 일관성 있는(그러나 반드시 사실은 아닌) 이야기를 <mark>만들어 내는 데 뛰어나다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2~5번</em>왼쪽 눈에만 그림 → 우반구만 일하고 좌반구는 모름</span><span><em>6~9번</em>이유를 묻자 말 담당 좌반구가 답해야 함 → 침묵 예상</span><span><em>10~14번</em>대신 근거 없는 답을 꾸며 냄</span></div><div class=\"ck-eq\">⇒ 분리뇌 환자 실험 = 뇌가 이유를 지어내 우리를 속인다는 증거</div></div><div class=\"ck-via\"><i>▼</i><span>침묵할 거라는 9번 예상이 But instead(그러나 그 대신)로 뒤집힘</span></div><div class=\"ck-step\"><span class=\"lab\">10번 문장 · 실험의 반전</span><div class=\"en\">But instead, every subject <mark>fabricated a response</mark>.</div><p class=\"ko\">그러나 그 대신, 모든 피험자가 <mark>대답을 꾸며 냈다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>환자 이야기를 우리 모두의 이야기로 넓힘</span></div><div class=\"ck-step key\"><span class=\"lab\">16번 문장 · 결정적 단서</span><div class=\"en\">It turns out split-brain patients <mark>aren’t the only ones</mark> who fabricate reasons.</div><p class=\"ko\">분할 뇌 환자들만이 이유를 꾸며 내는 <mark>유일한 사람들은 아니라는 것이</mark> 드러난다.</p></div><div class=\"ck-via\"><i>▼</i><span>1번의 “속이는 이야기”를 다시 말하며 닫음</span></div><div class=\"ck-step key\"><span class=\"lab\">18번 문장 · 마무리</span><div class=\"en\">when information in that story is missing, <mark>our brains simply fill in the details</mark>.</div><p class=\"ko\">그 이야기에서 정보가 빠져 있을 때, <mark>우리의 뇌는 단순히 세부 사항을 채워 넣는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">The Deceptive Brain(속이는 뇌): Insights from a Split-Brain Patient Study(분리뇌 환자 연구가 알려 주는 것)<small>1번 deceive(속이다)와 2~14번 split-brain(분리뇌) 실험을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">How Our Brain's Hemispheres Interact in Storytelling 이야기 만들기에서 두 반구는 어떻게 상호작용하는가</span><span class=\"why\">[반대] 1번 stories(이야기)와 hemispheres(반구)가 다 나와서 끌려요. 하지만 4번에서 두 반구의 연결이 끊겨 정보가 건너가지 못한다고 했으니 상호작용과 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Which Side of the Brain Do We Tend to Use More(우리는 뇌의 어느 쪽을 더 많이 쓰는가)?</span><span class=\"why\">[지문에 없음] 어느 쪽 반구를 더 많이 쓰는지 비교하는 문장은 없어요. 글은 좌반구가 모르는 이유를 지어낸다는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">To Be Creative(창의적이려면), Activate Both Hemispheres of Your Brain(두 반구를 모두 활성화하라)!</span><span class=\"why\">[지문에 없음] creating(만들어 내기)을 창의성으로 오해한 함정이에요. 1번은 사실이 아닌 이야기를 만든다는 말이고, 두 반구를 쓰라는 조언은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">The Dominance of the Left Brain in Image Processing 이미지 처리에서 좌뇌의 우세</span><span class=\"why\">[반대] 3번에서 왼쪽 눈으로 본 이미지는 right hemisphere(우반구)가 맡았고, 5번에서 좌반구는 아무것도 몰랐어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">A neuropsychologist, Michael Gazzaniga</div><div class=\"k\">신경 심리학자인 Michael Gazzaniga는</div></div><div class=\"rc\"><div class=\"e\">conducted a study</div><div class=\"k\">연구를 수행했다</div></div><div class=\"rc\"><div class=\"e\">that shows that our brains</div><div class=\"k\">우리의 뇌가 ~임을 보여 주는</div></div><div class=\"rc ckc\"><div class=\"e\">(a) <span class=\"cw\">excel at creating</span></div><div class=\"k\"><span class=\"cw\">만들어 내는 데 뛰어나다</span></div></div><div class=\"rc\"><div class=\"e\">coherent (but not necessarily true) stories</div><div class=\"k\">일관성 있는(그러나 반드시 사실은 아닌) 이야기를</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that deceive us</span>.</div><div class=\"k\"><span class=\"cw\">우리를 속이는</span>.</div></div><div class=\"rnat\">신경 심리학자인 Michael Gazzaniga는 우리의 뇌가 우리를 속이는 일관성 있는(그러나 반드시 사실은 아닌) 이야기를 만들어 내는 데 뛰어나다는 것을 보여 주는 연구를 수행했다.</div><div class=\"rst\">우리 반 칸막이 게임을 떠올려 봐요. 지문 1번은 먼저 뇌가 사실이 아닐 수도 있는 <b>이야기를 지어내는 데 뛰어나다</b>고 결론부터 말해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In the study,</div><div class=\"k\">그 연구에서,</div></div><div class=\"rc\"><div class=\"e\">split-brain patients</div><div class=\"k\">분할 뇌 환자들은</div></div><div class=\"rc\"><div class=\"e\">were shown an image</div><div class=\"k\">이미지를 보게 되었고</div></div><div class=\"rc\"><div class=\"e\">such that it was visible</div><div class=\"k\">그것(= 이미지)이 보이도록</div></div><div class=\"rc\"><div class=\"e\">to only their left eye</div><div class=\"k\">오직 그들의 왼쪽 눈에만</div></div><div class=\"rc\"><div class=\"e\">and asked to select a related card</div><div class=\"k\">그리고 관련된 카드를 선택하도록 요청받았다</div></div><div class=\"rc\"><div class=\"e\">with their left hand.</div><div class=\"k\">왼손으로.</div></div><div class=\"rnat\">그 연구에서 분할 뇌 환자들은 왼쪽 눈에만 보이도록 이미지를 보게 되었고, 왼손으로 관련된 카드를 선택하도록 요청받았다.</div><div class=\"rst\">칸막이 왼쪽 친구에게만 그림을 보여 주고, 맞는 카드를 고르게 해요. = 지문의 왼쪽 눈에만 이미지를 보여 주고 왼손으로 카드 고르기예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Left-eye vision</div><div class=\"k\">왼쪽 눈의 시력과</div></div><div class=\"rc\"><div class=\"e\">and left-side body movement</div><div class=\"k\">왼쪽 몸의 움직임은</div></div><div class=\"rc\"><div class=\"e\">are controlled by</div><div class=\"k\">~에 의해 제어된다</div></div><div class=\"rc\"><div class=\"e\">the right hemisphere.</div><div class=\"k\">우반구에.</div></div><div class=\"rnat\">왼쪽 눈의 시력과 왼쪽 몸의 움직임은 우반구에 의해 제어된다.</div><div class=\"rst\">왼쪽 눈과 왼손을 맡는 건 뇌의 오른쪽, <b>우반구</b>예요. 그러니 그림을 본 친구가 곧 우반구예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In a split-brain patient,</div><div class=\"k\">분할 뇌 환자에게는,</div></div><div class=\"rc\"><div class=\"e\">the connection between the right and left hemispheres</div><div class=\"k\">우반구와 좌반구 사이의 연결이</div></div><div class=\"rc\"><div class=\"e\">has been broken,</div><div class=\"k\">끊어져 있다,</div></div><div class=\"rc\"><div class=\"e\">meaning</div><div class=\"k\">이는 ~을 의미한다</div></div><div class=\"rc\"><div class=\"e\">no information can cross</div><div class=\"k\">어떤 정보도 건너갈 수 없다는 것을</div></div><div class=\"rc\"><div class=\"e\">from one hemisphere to the other.</div><div class=\"k\">한쪽 반구에서 다른 쪽 반구로.</div></div><div class=\"rnat\">분할 뇌 환자에게는 우반구와 좌반구 사이의 연결이 끊어져 있다. 이는 어떤 정보도 한쪽 반구에서 다른 쪽 반구로 건너갈 수 없다는 것을 의미한다.</div><div class=\"rst\">두 친구 사이 칸막이가 꽉 막혀 아무 말도 건너가지 못해요. = 지문의 두 반구 연결이 끊겨 <b>정보가 건너갈 수 없다</b>예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Therefore, in this experiment,</div><div class=\"k\">따라서 이 실험에서,</div></div><div class=\"rc\"><div class=\"e\">the right hemisphere was doing all of the work,</div><div class=\"k\">우반구가 모든 일을 하고 있었고,</div></div><div class=\"rc\"><div class=\"e\">and the left hemisphere</div><div class=\"k\">그리고 좌반구는</div></div><div class=\"rc\"><div class=\"e\">was (b) unaware of</div><div class=\"k\">~을 알지 못하고 있었다※ 문제지엔 aware(알고 있는)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">what was happening.</div><div class=\"k\">무슨 일이 일어나고 있는지.</div></div><div class=\"rnat\">따라서 이 실험에서 우반구가 모든 일을 하고 있었고, 좌반구는 무슨 일이 일어나고 있는지 &lt;b&gt;알지 못하고 있었다&lt;/b&gt;(문제지엔 aware(알고 있었다)로 되어 있음 → 원래 unaware).</div><div class=\"rst\">그래서 일은 그림 본 친구가 다 했고, 반대편 친구는 무슨 일인지 <b>전혀 몰라요</b>. 지문 5번의 좌반구가 바로 이 친구예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Gazzaniga then asked participants</div><div class=\"k\">그 후 Gazzaniga는 참가자들에게 물었다</div></div><div class=\"rc\"><div class=\"e\">why they chose</div><div class=\"k\">그들이 왜 골랐는지</div></div><div class=\"rc\"><div class=\"e\">the card that they did.</div><div class=\"k\">그들이 고른 그 카드를.</div></div><div class=\"rnat\">그 후 Gazzaniga는 참가자들에게 그들이 왜 자신이 고른 그 카드를 골랐는지 물었다.</div><div class=\"rst\">이제 선생님이 “왜 그 카드 골랐어?” 하고 물어요. 지문에서도 연구자가 참가자에게 고른 이유를 물어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Because language is processed and generated</div><div class=\"k\">언어는 처리되고 생성되기 때문에</div></div><div class=\"rc\"><div class=\"e\">in the left hemisphere,</div><div class=\"k\">좌반구에서,</div></div><div class=\"rc\"><div class=\"e\">the left hemisphere is required</div><div class=\"k\">좌반구가 요구된다</div></div><div class=\"rc\"><div class=\"e\">to respond.</div><div class=\"k\">응답하도록.</div></div><div class=\"rnat\">언어는 좌반구에서 처리되고 생성되기 때문에, 좌반구가 응답하도록 요구된다.</div><div class=\"rst\">대답은 말 담당인 반대편 친구가 해야 해요. 지문도 언어는 <b>좌반구</b>에서 만들어지니 좌반구가 답해야 한대요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">그러나,</div></div><div class=\"rc\"><div class=\"e\">because of the experiment’s design,</div><div class=\"k\">실험의 설계 때문에,</div></div><div class=\"rc\"><div class=\"e\">only the right hemisphere knew</div><div class=\"k\">오직 우반구만이 알고 있었다</div></div><div class=\"rc\"><div class=\"e\">why the participant selected the card.</div><div class=\"k\">그 참가자가 왜 그 카드를 골랐는지.</div></div><div class=\"rnat\">그러나 실험의 설계 때문에, 오직 우반구만이 왜 그 참가자가 그 카드를 선택했는지 알고 있었다.</div><div class=\"rst\"><b>하지만</b> 이유를 아는 건 그림 본 친구, 즉 우반구뿐이에요. 지문은 실험 설계가 그렇게 짜여 있다고 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">As a result,</div><div class=\"k\">그 결과,</div></div><div class=\"rc\"><div class=\"e\">Gazzaniga expected the participants</div><div class=\"k\">Gazzaniga는 참가자들이 ~할 것이라고 예상했다</div></div><div class=\"rc\"><div class=\"e\">to be (c) silent</div><div class=\"k\">침묵할 (것이라고)</div></div><div class=\"rc\"><div class=\"e\">when asked to answer the question.</div><div class=\"k\">그 질문에 답하도록 요청받았을 때.</div></div><div class=\"rnat\">결과적으로 Gazzaniga는 참가자들이 그 질문에 답하도록 요청받았을 때 침묵할 것이라고 예상했다.</div><div class=\"rst\">그래서 선생님은 말 담당 친구가 아무 말도 못 할 거라고 예상했어요. = 지문의 참가자들이 <b>침묵할</b> 거라는 예상이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">But instead,</div><div class=\"k\">그러나 그 대신,</div></div><div class=\"rc\"><div class=\"e\">every subject</div><div class=\"k\">모든 피험자가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">fabricated a response</span>.</div><div class=\"k\"><span class=\"cw\">대답을 꾸며 냈다</span>.</div></div><div class=\"rnat\">하지만 그 대신에, 모든 피험자가 대답을 꾸며 냈다.</div><div class=\"rst\"><b>그런데</b> 모든 친구가 그럴듯한 대답을 <b>지어냈어요</b>. 지문 10번에서 예상이 뒤집혀요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The left hemisphere was being asked</div><div class=\"k\">좌반구는 요구를 받고 있었다</div></div><div class=\"rc\"><div class=\"e\">to provide a (d) rationalization</div><div class=\"k\">설명(그럴듯한 이유)을 제공하라는</div></div><div class=\"rc\"><div class=\"e\">for a behavior</div><div class=\"k\">행동에 대한</div></div><div class=\"rc\"><div class=\"e\">done by the right hemisphere.</div><div class=\"k\">우반구에 의해 행해진.</div></div><div class=\"rnat\">좌반구는 우반구에 의해 행해진 행동에 대한 설명(그럴듯한 이유)을 제공하라는 요구를 받고 있었다.</div><div class=\"rst\">말 담당 친구는 남이 한 행동의 이유를 대라는 요구를 받은 셈이에요. = 지문의 <b>그럴듯한 이유</b> 대기예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">The left hemisphere</div><div class=\"k\">좌반구는</div></div><div class=\"rc\"><div class=\"e\">didn’t know the answer.</div><div class=\"k\">그 답을 알지 못했다.</div></div><div class=\"rnat\">좌반구는 그 답을 알지 못했다.</div><div class=\"rst\">사실 그 친구는 답을 몰랐어요. 지문 12번도 좌반구는 그 답을 알지 못했다고 해요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">But that didn’t keep it</div><div class=\"k\">그러나 그것(= 답을 몰랐다는 사실)이 그것(= 좌반구)을 막지는 못했다</div></div><div class=\"rc\"><div class=\"e\">from fabricating an answer.</div><div class=\"k\">답을 꾸며 내는 것을.</div></div><div class=\"rnat\">그러나 그렇다고 해서 좌반구가 답을 꾸며 내는 것을 막지는 못했다.</div><div class=\"rst\">그래도 “그냥 예뻐서요” 하고 답을 꾸며 냈어요. 지문은 답을 모른다는 사실이 <b>지어내기</b>를 막지 못했다고 해요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">That answer, however,</div><div class=\"k\">그러나 그 답(= 좌반구가 꾸며 낸 답)은,</div></div><div class=\"rc\"><div class=\"e\">had no basis</div><div class=\"k\">근거가 없었다</div></div><div class=\"rc\"><div class=\"e\">in reality.</div><div class=\"k\">현실에.</div></div><div class=\"rnat\">하지만 그 답은 현실에 아무 근거가 없었다.</div><div class=\"rst\">하지만 그 답은 진짜 이유와 상관없었어요. = 지문의 그 답은 현실에 <b>근거가 없었다</b>예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Now</div><div class=\"k\">자,</div></div><div class=\"rc\"><div class=\"e\">if this study had been limited</div><div class=\"k\">만약 이 연구(= 분할 뇌 환자 연구)가 제한되었다면</div></div><div class=\"rc\"><div class=\"e\">to split-brain patients,</div><div class=\"k\">분할 뇌 환자들에게만,</div></div><div class=\"rc\"><div class=\"e\">it would be interesting</div><div class=\"k\">그것은 흥미롭겠지만</div></div><div class=\"rc\"><div class=\"e\">but not very (e) relevant to us.</div><div class=\"k\">우리와 그다지 관련 있지는 않을 것이다.</div></div><div class=\"rnat\">자, 만약 이 연구가 분할 뇌 환자에게만 제한되었다면, 흥미롭기는 하겠지만 우리와 그다지 관련 있지는 않을 것이다.</div><div class=\"rst\">이게 그 실험 친구들만의 일이라면 “신기하네” 하고 끝날 거예요. 지문도 그러면 우리와 별로 <b>관련 없다</b>고 해요.</div></div><div class=\"rds key\" data-ord=\"16\"><span class=\"rn\">16번 · 단서</span><div class=\"rc\"><div class=\"e\">It turns out</div><div class=\"k\">~로 드러난다</div></div><div class=\"rc ckc\"><div class=\"e\">split-brain patients <span class=\"cw\">aren’t the only ones</span></div><div class=\"k\">분할 뇌 환자들만이 <span class=\"cw\">유일한 사람들은 아니라는 것이</span></div></div><div class=\"rc\"><div class=\"e\">who fabricate reasons.</div><div class=\"k\">이유를 꾸며 내는.</div></div><div class=\"rnat\">분할 뇌 환자들만이 이유를 꾸며 내는 유일한 사람들이 아닌 것으로 드러난다.</div><div class=\"rst\">그런데 이유를 지어내는 건 그 친구들만이 아니래요. = 지문의 분할 뇌 환자만 <b>이유를 꾸며 내는 게 아니다</b>예요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">We all</div><div class=\"k\">우리 모두</div></div><div class=\"rc\"><div class=\"e\">do it.</div><div class=\"k\">그렇게 한다(= 이유를 꾸며 내는 것).</div></div><div class=\"rnat\">우리 모두 그렇게 한다.</div><div class=\"rst\"><b>우리 모두</b> 그래요. 지각한 날 “버스가 늦게 와서요” 하고 이유를 바로 만들어 내잖아요. 지문 17번이에요.</div></div><div class=\"rds key\" data-ord=\"18\"><span class=\"rn\">18번 · 단서</span><div class=\"rc\"><div class=\"e\">We all need</div><div class=\"k\">우리 모두는 필요로 한다</div></div><div class=\"rc\"><div class=\"e\">a coherent story about ourselves,</div><div class=\"k\">자신에 대한 일관성 있는 이야기를,</div></div><div class=\"rc\"><div class=\"e\">and when information in that story is missing,</div><div class=\"k\">그리고 그 이야기에서 정보가 빠져 있을 때,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">our brains simply fill in the details</span>.</div><div class=\"k\"><span class=\"cw\">우리의 뇌는 단순히 세부 사항을 채워 넣는다</span>.</div></div><div class=\"rnat\">우리 모두는 자신에 대한 일관성 있는 이야기를 필요로 하고, 그 이야기에서 정보가 빠져 있을 때 우리의 뇌는 단순히 세부 사항을 채워 넣는다.</div><div class=\"rst\">우리는 나에 대한 말이 되는 이야기가 필요해서, 빈 곳은 뇌가 <b>알아서 채워요</b>. 그래서 제목은 “속이는 뇌: 분리뇌 연구”(③)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"coherent\" data-m=\"일관성 있는\"><b>coherent</b>일관성 있는</button><button type=\"button\" class=\"wdb\" data-w=\"deceive\" data-m=\"속이다\"><b>deceive</b>속이다</button><button type=\"button\" class=\"wdb\" data-w=\"split-brain\" data-m=\"분리뇌의\"><b>split-brain</b>분리뇌의</button><button type=\"button\" class=\"wdb\" data-w=\"hemisphere\" data-m=\"(뇌) 반구\"><b>hemisphere</b>(뇌) 반구</button><button type=\"button\" class=\"wdb\" data-w=\"fabricate\" data-m=\"지어내다, 꾸며 내다\"><b>fabricate</b>지어내다, 꾸며 내다</button><button type=\"button\" class=\"wdb\" data-w=\"fill in\" data-m=\"채워 넣다\"><b>fill in</b>채워 넣다</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">낱말 문제는 <b>바로 앞 문장과의 논리</b>만 따져요. 4번에서 정보가 <b>건너갈 수 없다</b>고 했고 5번은 <b>Therefore</b>(따라서)로 그 결과를 말하니, 좌반구는 “알 수 없어야” 해요.</p><div class=\"ck-step\"><span class=\"lab\">4번 · 원인</span><div class=\"en\">the connection between the right and left hemispheres has been broken, meaning <mark>no information can cross</mark> from one hemisphere to the other.</div><p class=\"ko\">우반구와 좌반구 사이의 연결이 끊어져 있다, 즉 <mark>어떤 정보도 건너갈 수 없다는 것을</mark> 의미한다.</p></div><div class=\"ck-via\"><i>▼</i><span>Therefore(따라서): 정보가 못 건너가면 좌반구는 몰라야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 (b) 자리 (5번)</span><div class=\"en\">Therefore, in this experiment, the right hemisphere was doing all of the work, and the left hemisphere was <u>(b) aware</u> of what was happening.</div><p class=\"ko\">따라서 우반구가 모든 일을 했고, 좌반구는 무슨 일인지 ( 알고 있었다? ) → 알지 못하고 있었다가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>이유를 아는 건 우반구뿐 → 좌반구는 모름이 다시 확인돼요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 · 결정적 단서</span><div class=\"en\">However, because of the experiment’s design, <mark>only the right hemisphere knew</mark> why the participant selected the card.</div><p class=\"ko\">그러나 실험의 설계 때문에, 참가자가 왜 그 카드를 골랐는지 <mark>오직 우반구만이 알고 있었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>좌반구가 알았다면 답을 꾸며 낼 필요도 없었어요</span></div><div class=\"ck-step\"><span class=\"lab\">12번 · 결과로 확인</span><div class=\"en\">The left hemisphere <mark>didn’t know the answer</mark>.</div><p class=\"ko\">좌반구는 <mark>그 답을 알지 못했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">aware(알고 있는) ↔ unaware(알지 못하는)</p><p class=\"gr\">앞에 “정보가 못 건너간다·연결이 끊겼다” 같은 막힘 원인이 오면 결과는 unaware(알지 못하는)예요. 원인과 결과의 방향이 같아야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My phone was off, so I was unaware of the message.</div><div class=\"ko\">휴대폰이 꺼져 있어서 나는 그 메시지를 몰랐어요. (막힘 → 모름)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My phone was off, so I was aware of the message.</div><div class=\"ko\">휴대폰이 꺼져 있었는데 메시지를 알았다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My friend told me, so I was aware of the test.</div><div class=\"ko\">친구가 말해 줘서 나는 시험을 알고 있었어요. (전달 → 앎)</div></div><p class=\"gb\">지문 4번에서 no information can cross(어떤 정보도 건너갈 수 없다)라고 했으니, 5번 좌반구는 aware(알고 있는)가 아니라 unaware(알지 못하는)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(b) aware → unaware 알지 못하는<small>4번처럼 정보가 못 건너가니 좌반구는 몰라야 하고, 8·12번도 “우반구만 알았다”고 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) silent 침묵하는</span><span class=\"why\">10번에서 모두 대답을 꾸며 냈으니 silent(침묵하는)가 틀려 보여요. 하지만 9번은 실제 결과가 아니라 연구자의 expected(예상했다)이고, 10번 But instead(그러나 그 대신)가 그 예상을 뒤집으니 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) excel 뛰어나다</span><span class=\"why\">10·13번에서 모든 피험자가 답을 바로 꾸며 냈고, 18번에서 뇌가 빈 곳을 알아서 채운다고 했어요. 이야기를 잘 만들어 내니 excel(뛰어나다)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) rationalization 그럴듯한 이유 대기</span><span class=\"why\">6번에서 왜 그 카드를 골랐는지 물었고, 13번에서 답을 꾸며 냈어요. 우반구가 한 행동에 이유를 붙이는 것이니 rationalization(그럴듯한 이유 대기)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) relevant 관련 있는</span><span class=\"why\">15번은 환자에게만 해당하면 우리와 not very relevant(별로 관련 없는)일 거라는 가정이에요. 16·17번이 “우리 모두 그렇다”고 뒤집으니 흐름이 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">A neuropsychologist, Michael Gazzaniga</div><div class=\"k\">신경 심리학자인 Michael Gazzaniga는</div></div><div class=\"rc\"><div class=\"e\">conducted a study</div><div class=\"k\">연구를 수행했다</div></div><div class=\"rc\"><div class=\"e\">that shows that our brains</div><div class=\"k\">우리의 뇌가 ~임을 보여 주는</div></div><div class=\"rc\"><div class=\"e\">(a) excel at creating</div><div class=\"k\">만들어 내는 데 뛰어나다</div></div><div class=\"rc\"><div class=\"e\">coherent (but not necessarily true) stories</div><div class=\"k\">일관성 있는(그러나 반드시 사실은 아닌) 이야기를</div></div><div class=\"rc\"><div class=\"e\">that deceive us.</div><div class=\"k\">우리를 속이는.</div></div><div class=\"rnat\">신경 심리학자인 Michael Gazzaniga는 우리의 뇌가 우리를 속이는 일관성 있는(그러나 반드시 사실은 아닌) 이야기를 만들어 내는 데 뛰어나다는 것을 보여 주는 연구를 수행했다.</div><div class=\"rst\">우리 반 스피드퀴즈를 떠올려 봐요. 지문 1번은 뇌가 사실이 아닐 수도 있는 이야기를 <b>지어내는 데 뛰어나다</b>(excel at ~에 뛰어나다)고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In the study,</div><div class=\"k\">그 연구에서,</div></div><div class=\"rc\"><div class=\"e\">split-brain patients</div><div class=\"k\">분할 뇌 환자들은</div></div><div class=\"rc\"><div class=\"e\">were shown an image</div><div class=\"k\">이미지를 보게 되었고</div></div><div class=\"rc\"><div class=\"e\">such that it was visible</div><div class=\"k\">그것(= 이미지)이 보이도록</div></div><div class=\"rc\"><div class=\"e\">to only their left eye</div><div class=\"k\">오직 그들의 왼쪽 눈에만</div></div><div class=\"rc\"><div class=\"e\">and asked to select a related card</div><div class=\"k\">그리고 관련된 카드를 선택하도록 요청받았다</div></div><div class=\"rc\"><div class=\"e\">with their left hand.</div><div class=\"k\">왼손으로.</div></div><div class=\"rnat\">그 연구에서 분할 뇌 환자들은 왼쪽 눈에만 보이도록 이미지를 보게 되었고, 왼손으로 관련된 카드를 선택하도록 요청받았다.</div><div class=\"rst\">칸막이 한쪽 친구(오른쪽 뇌 담당)에게만 그림을 보여 주고, 맞는 카드를 고르게 해요. = 지문의 왼쪽 눈에만 이미지를 보여 주고 왼손으로 카드 고르기예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Left-eye vision</div><div class=\"k\">왼쪽 눈의 시력과</div></div><div class=\"rc\"><div class=\"e\">and left-side body movement</div><div class=\"k\">왼쪽 몸의 움직임은</div></div><div class=\"rc\"><div class=\"e\">are controlled by</div><div class=\"k\">~에 의해 제어된다</div></div><div class=\"rc\"><div class=\"e\">the right hemisphere.</div><div class=\"k\">우반구에.</div></div><div class=\"rnat\">왼쪽 눈의 시력과 왼쪽 몸의 움직임은 우반구에 의해 제어된다.</div><div class=\"rst\">왼쪽 눈과 왼손을 맡는 건 뇌의 오른쪽, <b>우반구</b>예요. 그래서 그림을 본 친구를 오른쪽 뇌 담당이라고 한 거예요. = 지문 3번.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">In a split-brain patient,</div><div class=\"k\">분할 뇌 환자에게는,</div></div><div class=\"rc\"><div class=\"e\">the connection between the right and left hemispheres</div><div class=\"k\">우반구와 좌반구 사이의 연결이</div></div><div class=\"rc\"><div class=\"e\">has been broken,</div><div class=\"k\">끊어져 있다,</div></div><div class=\"rc\"><div class=\"e\">meaning</div><div class=\"k\">이는 ~을 의미한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">no information can cross</span></div><div class=\"k\"><span class=\"cw\">어떤 정보도 건너갈 수 없다는 것을</span></div></div><div class=\"rc\"><div class=\"e\">from one hemisphere to the other.</div><div class=\"k\">한쪽 반구에서 다른 쪽 반구로.</div></div><div class=\"rnat\">분할 뇌 환자에게는 우반구와 좌반구 사이의 연결이 끊어져 있다. 이는 어떤 정보도 한쪽 반구에서 다른 쪽 반구로 건너갈 수 없다는 것을 의미한다.</div><div class=\"rst\">두 친구 사이 칸막이가 꽉 막혀 아무 말도 건너가지 못해요. = 지문의 두 반구 연결이 끊겨 <b>정보가 건너갈 수 없다</b>예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Therefore, in this experiment,</div><div class=\"k\">따라서 이 실험에서,</div></div><div class=\"rc\"><div class=\"e\">the right hemisphere was doing all of the work,</div><div class=\"k\">우반구가 모든 일을 하고 있었고,</div></div><div class=\"rc\"><div class=\"e\">and the left hemisphere</div><div class=\"k\">그리고 좌반구는</div></div><div class=\"rc ckc\"><div class=\"e\">was (b) <span class=\"cw\">unaware of</span></div><div class=\"k\">~을 <span class=\"cw\">알지 못하고 있었다</span>※ 문제지엔 aware(알고 있는)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">what was happening.</div><div class=\"k\">무슨 일이 일어나고 있는지.</div></div><div class=\"rnat\">따라서 이 실험에서 우반구가 모든 일을 하고 있었고, 좌반구는 무슨 일이 일어나고 있는지 &lt;b&gt;(b) 알지 못하고 있었다&lt;/b&gt;(문제지엔 aware(알고 있었다)로 되어 있음 → 원래 unaware).</div><div class=\"rst\">그림 본 친구가 다 했고, 반대편 친구는 <b>전혀 몰라요</b>(unaware 알지 못하는). 문제지의 aware(알고 있는)는 반대말이라 틀려요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Gazzaniga then asked participants</div><div class=\"k\">그 후 Gazzaniga는 참가자들에게 물었다</div></div><div class=\"rc\"><div class=\"e\">why they chose</div><div class=\"k\">그들이 왜 골랐는지</div></div><div class=\"rc\"><div class=\"e\">the card that they did.</div><div class=\"k\">그들이 고른 그 카드를.</div></div><div class=\"rnat\">그 후 Gazzaniga는 참가자들에게 그들이 왜 자신이 고른 그 카드를 골랐는지 물었다.</div><div class=\"rst\">이제 선생님이 “왜 그 카드 골랐어?” 하고 물어요. 지문에서도 연구자가 참가자에게 고른 이유를 물어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Because language is processed and generated</div><div class=\"k\">언어는 처리되고 생성되기 때문에</div></div><div class=\"rc\"><div class=\"e\">in the left hemisphere,</div><div class=\"k\">좌반구에서,</div></div><div class=\"rc\"><div class=\"e\">the left hemisphere is required</div><div class=\"k\">좌반구가 요구된다</div></div><div class=\"rc\"><div class=\"e\">to respond.</div><div class=\"k\">응답하도록.</div></div><div class=\"rnat\">언어는 좌반구에서 처리되고 생성되기 때문에, 좌반구가 응답하도록 요구된다.</div><div class=\"rst\">대답은 말 담당인 반대편 친구가 해야 해요. 지문도 언어는 <b>좌반구</b>에서 만들어지니 좌반구가 답해야 한대요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">그러나,</div></div><div class=\"rc\"><div class=\"e\">because of the experiment’s design,</div><div class=\"k\">실험의 설계 때문에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">only the right hemisphere knew</span></div><div class=\"k\"><span class=\"cw\">오직 우반구만이 알고 있었다</span></div></div><div class=\"rc\"><div class=\"e\">why the participant selected the card.</div><div class=\"k\">그 참가자가 왜 그 카드를 골랐는지.</div></div><div class=\"rnat\">그러나 실험의 설계 때문에, 오직 우반구만이 왜 그 참가자가 그 카드를 선택했는지 알고 있었다.</div><div class=\"rst\"><b>하지만</b> 이유를 아는 건 그림 본 친구, 즉 우반구뿐이에요. 지문은 실험 설계가 그렇게 짜여 있다고 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">As a result,</div><div class=\"k\">그 결과,</div></div><div class=\"rc\"><div class=\"e\">Gazzaniga expected the participants</div><div class=\"k\">Gazzaniga는 참가자들이 ~할 것이라고 예상했다</div></div><div class=\"rc\"><div class=\"e\">to be (c) silent</div><div class=\"k\">침묵할 (것이라고)</div></div><div class=\"rc\"><div class=\"e\">when asked to answer the question.</div><div class=\"k\">그 질문에 답하도록 요청받았을 때.</div></div><div class=\"rnat\">결과적으로 Gazzaniga는 참가자들이 그 질문에 답하도록 요청받았을 때 침묵할 것이라고 예상했다.</div><div class=\"rst\">그래서 선생님은 말 담당 친구가 아무 말도 못 할 거라고 예상했어요. = 지문의 <b>침묵할</b>(silent 침묵하는) 거라는 예상이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">But instead,</div><div class=\"k\">그러나 그 대신,</div></div><div class=\"rc\"><div class=\"e\">every subject</div><div class=\"k\">모든 피험자가</div></div><div class=\"rc\"><div class=\"e\">fabricated a response.</div><div class=\"k\">대답을 꾸며 냈다.</div></div><div class=\"rnat\">하지만 그 대신에, 모든 피험자가 대답을 꾸며 냈다.</div><div class=\"rst\"><b>그런데</b> 모든 친구가 그럴듯한 대답을 <b>지어냈어요</b>. 지문 10번에서 예상이 뒤집혀요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The left hemisphere was being asked</div><div class=\"k\">좌반구는 요구를 받고 있었다</div></div><div class=\"rc\"><div class=\"e\">to provide a (d) rationalization</div><div class=\"k\">설명(그럴듯한 이유)을 제공하라는</div></div><div class=\"rc\"><div class=\"e\">for a behavior</div><div class=\"k\">행동에 대한</div></div><div class=\"rc\"><div class=\"e\">done by the right hemisphere.</div><div class=\"k\">우반구에 의해 행해진.</div></div><div class=\"rnat\">좌반구는 우반구에 의해 행해진 행동에 대한 설명(그럴듯한 이유)을 제공하라는 요구를 받고 있었다.</div><div class=\"rst\">말 담당 친구는 남이 한 행동의 이유를 대라는 요구를 받았어요. = 지문의 <b>그럴듯한 이유</b>(rationalization) 대기예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">The left hemisphere</div><div class=\"k\">좌반구는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">didn’t know the answer</span>.</div><div class=\"k\"><span class=\"cw\">그 답을 알지 못했다</span>.</div></div><div class=\"rnat\">좌반구는 그 답을 알지 못했다.</div><div class=\"rst\">사실 그 친구는 답을 몰랐어요. 지문 12번도 좌반구는 그 답을 알지 못했다고 해요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">But that didn’t keep it</div><div class=\"k\">그러나 그것(= 답을 몰랐다는 사실)이 그것(= 좌반구)을 막지는 못했다</div></div><div class=\"rc\"><div class=\"e\">from fabricating an answer.</div><div class=\"k\">답을 꾸며 내는 것을.</div></div><div class=\"rnat\">그러나 그렇다고 해서 좌반구가 답을 꾸며 내는 것을 막지는 못했다.</div><div class=\"rst\">그래도 “그냥 예뻐서요” 하고 답을 꾸며 냈어요. 지문은 답을 모른다는 사실이 <b>지어내기</b>를 막지 못했다고 해요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">That answer, however,</div><div class=\"k\">그러나 그 답(= 좌반구가 꾸며 낸 답)은,</div></div><div class=\"rc\"><div class=\"e\">had no basis</div><div class=\"k\">근거가 없었다</div></div><div class=\"rc\"><div class=\"e\">in reality.</div><div class=\"k\">현실에.</div></div><div class=\"rnat\">하지만 그 답은 현실에 아무 근거가 없었다.</div><div class=\"rst\">하지만 그 답은 진짜 이유와 상관없었어요. = 지문의 그 답은 현실에 <b>근거가 없었다</b>예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Now</div><div class=\"k\">자,</div></div><div class=\"rc\"><div class=\"e\">if this study had been limited</div><div class=\"k\">만약 이 연구(= 분할 뇌 환자 연구)가 제한되었다면</div></div><div class=\"rc\"><div class=\"e\">to split-brain patients,</div><div class=\"k\">분할 뇌 환자들에게만,</div></div><div class=\"rc\"><div class=\"e\">it would be interesting</div><div class=\"k\">그것은 흥미롭겠지만</div></div><div class=\"rc\"><div class=\"e\">but not very (e) relevant to us.</div><div class=\"k\">우리와 그다지 관련 있지는 않을 것이다.</div></div><div class=\"rnat\">자, 만약 이 연구가 분할 뇌 환자에게만 제한되었다면, 흥미롭기는 하겠지만 우리와 그다지 관련 있지는 않을 것이다.</div><div class=\"rst\">이게 실험 친구들만의 일이면 “신기하네” 하고 끝나요. 지문도 그러면 우리와 별로 <b>관련 없다</b>(not very relevant)고 해요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">It turns out</div><div class=\"k\">~로 드러난다</div></div><div class=\"rc\"><div class=\"e\">split-brain patients aren’t the only ones</div><div class=\"k\">분할 뇌 환자들만이 유일한 사람들은 아니라는 것이</div></div><div class=\"rc\"><div class=\"e\">who fabricate reasons.</div><div class=\"k\">이유를 꾸며 내는.</div></div><div class=\"rnat\">분할 뇌 환자들만이 이유를 꾸며 내는 유일한 사람들이 아닌 것으로 드러난다.</div><div class=\"rst\">그런데 이유를 지어내는 건 그 친구들만이 아니래요. = 지문의 분할 뇌 환자만 <b>이유를 꾸며 내는 게 아니다</b>예요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">We all</div><div class=\"k\">우리 모두</div></div><div class=\"rc\"><div class=\"e\">do it.</div><div class=\"k\">그렇게 한다(= 이유를 꾸며 내는 것).</div></div><div class=\"rnat\">우리 모두 그렇게 한다.</div><div class=\"rst\"><b>우리 모두</b> 그래요. 지각한 날 “버스가 늦게 와서요” 하고 이유를 바로 만들어 내잖아요. 지문 17번이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">We all need</div><div class=\"k\">우리 모두는 필요로 한다</div></div><div class=\"rc\"><div class=\"e\">a coherent story about ourselves,</div><div class=\"k\">자신에 대한 일관성 있는 이야기를,</div></div><div class=\"rc\"><div class=\"e\">and when information in that story is missing,</div><div class=\"k\">그리고 그 이야기에서 정보가 빠져 있을 때,</div></div><div class=\"rc\"><div class=\"e\">our brains simply fill in the details.</div><div class=\"k\">우리의 뇌는 단순히 세부 사항을 채워 넣는다.</div></div><div class=\"rnat\">우리 모두는 자신에 대한 일관성 있는 이야기를 필요로 하고, 그 이야기에서 정보가 빠져 있을 때 우리의 뇌는 단순히 세부 사항을 채워 넣는다.</div><div class=\"rst\">우리는 나에 대한 말이 되는 이야기가 필요해서, 빈 곳은 뇌가 <b>알아서 채워요</b>. 1번 excel(뛰어나다)이 여기서 확인돼요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"excel at\" data-m=\"~에 뛰어나다\"><b>excel at</b>~에 뛰어나다</button><button type=\"button\" class=\"wdb\" data-w=\"aware\" data-m=\"알고 있는\"><b>aware</b>알고 있는</button><button type=\"button\" class=\"wdb\" data-w=\"hemisphere\" data-m=\"(뇌) 반구\"><b>hemisphere</b>(뇌) 반구</button><button type=\"button\" class=\"wdb\" data-w=\"fabricate\" data-m=\"지어내다, 꾸며 내다\"><b>fabricate</b>지어내다, 꾸며 내다</button><button type=\"button\" class=\"wdb\" data-w=\"rationalization\" data-m=\"그럴듯한 이유 대기\"><b>rationalization</b>그럴듯한 이유 대기</button><button type=\"button\" class=\"wdb\" data-w=\"relevant\" data-m=\"관련 있는\"><b>relevant</b>관련 있는</button></div>"};

    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';

    function upd(){

      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;

  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
