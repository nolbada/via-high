<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

mic growth.", "k": "강한 경제 성장에도 불구하고."}], "easy": "1990년 이후 경제가 크게 성장했는데도 차량 수는 그대로고 이산화탄소 배출은 줄었어요.", "gist": "첫 문장의 문제(이산화탄소 배출)가 실제로 줄었다는 마무리 성과."}]}, {"no": "11", "typ": "글의 제목 (장문)", "src": "2022년 11월 41번", "evn": [1, 16, 18], "ev_en": "A neuropsychologist, Michael Gazzaniga conducted a study that shows that our brains (a) excel at creating coherent (but not necessarily true) stories that deceive us. / It turns out split-brain patients aren’t the only ones who fabricate reasons. / We all need a coherent story about ourselves, and when information in that story is missing, our brains simply fill in the details.", "ev_ko": [[1, "신경 심리학자인 Michael Gazzaniga는 우리의 뇌가 우리를 속이는 일관성 있는(그러나 반드시 사실은 아닌) 이야기를 만들어 내는 데 뛰어나다는 것을 보여 주는 연구를 수행했다."], [16, "분할 뇌 환자들만이 이유를 꾸며 내는 유일한 사람들이 아닌 것으로 드러난다."], [18, "우리 모두는 자신에 대한 일관성 있는 이야기를 필요로 하고, 그 이야기에서 정보가 빠져 있을 때 우리의 뇌는 단순히 세부 사항을 채워 넣는다."]], "why": ["제목은 <b>글 전체의 주제<\/b>를 담아야 합니다", "1번에서 '우리 뇌는 우리를 <b>속이는<\/b> 이야기를 잘 만들어 낸다'고 먼저 말합니다", "2~15번은 이를 보여 주는 <b>분할 뇌 환자 연구<\/b>입니다", "16~18번은 이것이 환자만의 일이 아니라 <b>우리 모두의 일<\/b>이라고 넓힙니다", "그래서 제목에는 '속이는 뇌'와 '분할 뇌 환자 연구'가 모두 들어가야 합니다."], "ch": [{"n": "①", "t": "Which Side of the Brain Do We Tend to Use More?", "g": "우리는 뇌의 어느 쪽을 더 많이 사용하는 경향이 있는가?", "ok": false, "e": ["어느 쪽 뇌를 더 쓰는지 가르는 글이 아닙니다", "두 반구의 <b>연결이 끊긴 상태<\/b>에서 무슨 일이 벌어지는지를 다룹니다."]}, {"n": "②", "t": "How Our Brain’s Hemispheres Interact in Storytelling", "g": "스토리텔링에서 우리 뇌의 반구들이 상호작용하는 방식", "ok": false, "e": ["hemispheres와 story가 들어 있어 헷갈리기 쉽습니다", "하지만 이 실험은 두 반구가 정보를 <b>주고받지 못하는<\/b> 상황(4번)입니다", "글의 초점도 반구의 상호작용이 아니라 <b>뇌가 이야기를 꾸며 낸다<\/b>는 사실입니다."]}, {"n": "③", "t": "The Deceptive Brain: Insights from a Split-Brain Patient Study", "g": "속이는 뇌: 분할 뇌 환자 연구에서 얻는 통찰", "ok": true, "e": ["1번의 stories that deceive us(우리를 속이는 이야기)와 분할 뇌 환자 연구 전체를 한 줄에 담았습니다."]}, {"n": "④", "t": "To Be Creative, Activate Both Hemispheres of Your Brain!", "g": "창의적이 되려면 여러분의 두 반구를 모두 활성화하라!", "ok": false, "e": ["창의적이 되는 방법을 알려 주는 글이 아닙니다", "두 반구를 활성화하라는 내용도 없습니다."]}, {"n": "⑤", "t": "The Dominance of the Left Brain in Image Processing", "g": "이미지 처리에서 좌뇌의 우세", "ok": false, "e": ["왼쪽 눈의 시력은 <b>우반구<\/b>가 제어한다고 했습니다(3번)", "좌반구는 <b>언어<\/b>와 관련된 역할을 합니다(7번)", "좌뇌가 이미지 처리를 지배한다는 내용이 아닙니다."]}], "tr": ["신경 심리학자인 Michael Gazzaniga는 우리의 뇌가 우리를 속이는 일관성 있는(그러나 반드시 사실은 아닌) 이야기를 만들어 내는 데 뛰어나다는 것을 보여 주는 연구를 수행했다.", "그 연구에서 분할 뇌 환자들은 왼쪽 눈에만 보이도록 이미지를 보게 되었고, 왼손으로 관련된 카드를 선택하도록 요청받았다.", "왼쪽 눈의 시력과 왼쪽 몸의 움직임은 우반구에 의해 제어된다.", "분할 뇌 환자에게는 우반구와 좌반구 사이의 연결이 끊어져 있다. 이는 어떤 정보도 한쪽 반구에서 다른 쪽 반구로 건너갈 수 없다는 것을 의미한다.", "따라서 이 실험에서 우반구가 모든 일을 하고 있었고, 좌반구는 무슨 일이 일어나고 있는지 <b>알지 못하고 있었다<\/b>(문제지엔 aware(알고 있었다)로 되어 있음 → 원래 unaware).", "그 후 Gazzaniga는 참가자들에게 그들이 왜 자신이 고른 그 카드를 골랐는지 물었다.", "언어는 좌반구에서 처리되고 생성되기 때문에, 좌반구가 응답하도록 요구된다.", "그러나 실험의 설계 때문에, 오직 우반구만이 왜 그 참가자가 그 카드를 선택했는지 알고 있었다.", "결과적으로 Gazzaniga는 참가자들이 그 질문에 답하도록 요청받았을 때 침묵할 것이라고 예상했다.", "하지만 그 대신에, 모든 피험자가 대답을 꾸며 냈다.", "좌반구는 우반구에 의해 행해진 행동에 대한 설명(그럴듯한 이유)을 제공하라는 요구를 받고 있었다.", "좌반구는 그 답을 알지 못했다.", "그러나 그렇다고 해서 좌반구가 답을 꾸며 내는 것을 막지는 못했다.", "하지만 그 답은 현실에 아무 근거가 없었다.", "자, 만약 이 연구가 분할 뇌 환자에게만 제한되었다면, 흥미롭기는 하겠지만 우리와 그다지 관련 있지는 않을 것이다.", "분할 뇌 환자들만이 이유를 꾸며 내는 유일한 사람들이 아닌 것으로 드러난다.", "우리 모두 그렇게 한다.", "우리 모두는 자신에 대한 일관성 있는 이야기를 필요로 하고, 그 이야기에서 정보가 빠져 있을 때 우리의 뇌는 단순히 세부 사항을 채워 넣는다."], "ps": [{"n": 1, "ch": [{"e": "A neuropsychologist, Michael Gazzaniga", "k": "신경 심리학자인 Michael Gazzaniga는"}, {"e": "conducted a study", "k": "연구를 수행했다"}, {"e": "that shows that our brains", "k": "우리의 뇌가 ~임을 보여 주는"}, {"e": "(a) <b>excel<\/b> at creating", "k": "만들어 내는 데 <b>뛰어나다<\/b>"}, {"e": "coherent (but not necessarily true) stories", "k": "일관성 있는(그러나 반드시 사실은 아닌) 이야기를"}, {"e": "that deceive us.", "k": "우리를 <b>속이는<\/b>."}], "easy": "한 신경 심리학자가, 우리 뇌는 우리를 속이는 그럴듯한 이야기를 잘 만들어 낸다는 걸 보여 주는 연구를 했어요.", "gist": "글 전체의 주제 문장. 뇌는 일관된 이야기를 만들어 우리를 속인다.", "link": "신경 심리학자 Michael Gazzaniga는 우리의 뇌가 우리를 속이는 일관성 있는(그러나 반드시 사실은 아닌) 이야기를 만들어 내는 데 뛰어나다는 것을 보여 주는 연구를 수행했다."}, {"n": 2, "ch": [{"e": "In the study,", "k": "그 연구에서,"}, {"e": "s function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

mething을 꾸미는 관계절인데 <b>목적격 관계대명사가 생략</b>돼 있고, doing의 목적어 자리가 비어 있습니다. 마지막 <b>if you were standing</b>은 현재 사실과 반대를 말하는 <b>가정법 과거</b>예요 — 그래서 앞에 might이 왔습니다.", "pe": "\u0001Similarly\u0002, / \u0001if you are talking with someone who is seated<sup>1</sup> several feet away<sup>2</sup> at a large table\u0002, / you are likely to<sup>3</sup> maintain<sup>4</sup> \u0001constant\u0002 eye contact / — \u0001something you might feel uncomfortable<sup>5</sup> doing\u0002 / \u0001if you were standing next to each other\u0002.", "pk": "\u0001마찬가지로\u0002 / \u0001만약 당신이 큰 탁자에서 몇 걸음 떨어져 앉은 사람과 이야기하고 있다면\u0002 / 당신은 \u0001계속\u0002 눈을 맞추기 쉽다 / \u0001그것은 당신이 하기에 불편하게 느낄 만한 무언가다\u0002 / \u0001만약 당신이 서로 바로 옆에 서 있다면\u0002", "core": "당신은 눈을 맞추기 쉽다.", "tags": ["Similarly = 접속부사: 문장 전체를 꾸밈", "if ~ = 접속사절(부사절, 조건): are likely를 꾸밈. who is seated ~ = 관계절: someone을 꾸밈", "주어 you + <b>are likely to</b> maintain + 목적어 eye contact. constant = 형용사: eye contact를 꾸밈", "대시 뒤 something ~ = 동격 관계절(관계사 생략): eye contact를 꾸밈", "if you were standing ~ = 접속사절(부사절, <b>가정법 과거</b>): might feel을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 앞의 If절과 대시 뒤 부연이 붙어 길어 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: you (당신)", "V: are (be ~이다)", "C: likely (~할 것 같은). to maintain constant eye contact (계속 눈을 맞추다)는 likely를 꾸미는 to부정사라 뼈대 밖에 둔다(문형 기준). maintain 유지하다, constant 계속되는", "뼈대 = <b>you are likely</b>", "Similarly (마찬가지로)는 문장 전체를 꾸미는 부사"]}, {"t": "<b>if you are talking with someone ~</b>는 조건 부사절이다.", "sub": ["S: you, V: are talking (talk with ~와 이야기하다)", "someone을 who is seated several feet away at a large table이 꾸밈. is seated는 수동태(앉혀져 있는 = 앉아 있는)로 1형식으로 봄", "several feet away (몇 피트 떨어져, feet는 길이 단위 foot의 복수형), at a large table (큰 탁자에)"]}, {"t": "대시 뒤 <b>something you might feel uncomfortable doing</b>은 앞의 eye contact를 유지하는 일을 다시 설명하는 덩어리다. something과 you 사이에 목적격 관계대명사가 생략됐다.", "sub": ["S: you, V: might feel (feel ~하게 느끼다), C: uncomfortable (불편한)", "doing의 목적어가 빠져 있다 = something"]}, {"t": "<b>if you were standing next to each other</b>는 <b>가정법 과거</b> 조건절이다. 지금은 떨어져 있지만 '만약 서로 바로 옆에 서 있다면'이라는 가정이다. next to each other (서로 바로 옆에)."}], "sum": "떨어져 앉아 말하면 눈을 계속 맞추기 쉬우나, 바로 옆에 서면 불편할 행동"}, {"i": "06", "q": "10", "s": "6", "title": "S+V+C(2형식) + S+V(1형식) 병렬 + despite 양보", "eng": "Since 1990, / motorization rates<sup>1</sup> have stayed the same / and carbon dioxide emissions<sup>2</sup> from transport<sup>3</sup> have fallen, / despite<sup>4</sup> strong economic growth.", "notes": [["1", "motorization rate", "자동차 보유율"], ["2", "carbon dioxide emission", "이산화탄소 배출량"], ["3", "transport", "교통, 수송"], ["4", "despite", "~에도 불구하고"]], "lit": "1990년 이후로 / 자동차 보유율은 그대로 유지되어 왔다 / 그리고 교통에서 나오는 이산화탄소 배출량은 줄어들었다 / 강력한 경제 성장에도 불구하고", "nat": "1990년 이후 강력한 경제 성장에도 불구하고 자동차 보유율은 그대로였고 교통 부문의 이산화탄소 배출량은 줄어들었다.", "ana": "<b>Since + 과거 시점</b>이 나오면 뒤 동사는 거의 항상 <b>현재완료</b>입니다(have stayed / have fallen). 이 두 개가 and로 묶인 <b>병렬</b>이라는 것부터 잡으세요. 맨 뒤 <b>despite</b>는 <b>전치사</b>라서 뒤에 명사구만 옵니다 — although(접속사)와 바꿔 쓰려면 뒤에 주어+동사를 넣어야 합니다. 어법 문제 단골이니 표시해 두세요.", "pe": "\u0001Since 1990\u0002, / motorization rates<sup>1</sup> have stayed the same / and carbon dioxide emissions<sup>2</sup> \u0001from transport<sup>3</sup>\u0002 have fallen, / \u0001despite<sup>4</sup> strong economic growth\u0002.", "pk": "\u00011990년 이후로\u0002 / 자동차 보유율은 그대로 유지되어 왔다 / 그리고 \u0001교통에서 나오는\u0002 이산화탄소 배출량은 줄어들었다 / \u0001강력한 경제 성장에도 불구하고\u0002", "core": "자동차 보유율은 그대로였고 배출량은 줄어들었다.", "tags": ["Since 1990 = 전치사구(부사구): 두 현재완료를 꾸밈", "주어 rates + have stayed + 보어 the same (SVC)", "and 절 병렬: emissions + have fallen. from transport = 전치사구(형용사구): emissions를 꾸밈", "despite ~ = 전치사구(부사구, 양보): 앞 내용 전체를 꾸밈"], "steps": [{"t": "이 문장은 <b>두 절이 and로 이어진 현재완료 문장</b>이다. 앞에 Since 1990, 뒤에 despite 구가 붙어 길어 보인다."}, {"t": "첫 절의 뼈대부터 찾는다.", "sub": ["S: motorization rates (자동차 보유율)", "V: have stayed (stay 머무르다의 p.p., 현재완료)", "C: the same (똑같은 것)", "뼈대 = <b>motorization rates have stayed the same</b>"]}, {"t": "<b>and carbon dioxide emissions from transport have fallen</b>이 두 번째 절이다.", "sub": ["S: carbon dioxide emissions (이산화탄소 배출량). from transport (교통 부문에서 나오는)는 emissions를 꾸미는 전치사구", "V: have fallen (fall 줄어들다의 p.p., 현재완료)", "뼈대 = <b>emissions have fallen</b> (1형식)"]}, {"t": "<b>Since 1990</b> (1990년 이후로)은 두 현재완료 문장 전체를 꾸미는 전치사구다. since가 있어서 '그때부터 지금까지'로 읽는다."}, {"t": "<b>despite strong economic growth</b>는 양보 전치사구(부사구)다. '강력한 경제 성장에도 불구하고'라는 뜻이다. despite (~에도 불구하고), economic growth (경제 성장)."}], "sum": "1990년 이후 경제 성장에도 보유율은 그대로, 교통 부문 이산화탄소 배출은 감소"}, {"i": "07", "q": "11", "s": "A-2", "title": "수동태 병렬 + such that절", "eng": "In the study, / split-brain<sup>1</sup> patients were shown an image / such that<sup>2</sup> it was visible<sup>3</sup> to only their left eye / and asked to select<sup>4</sup> a related<sup>5</sup> card with their left hand.", "notes": [["1", "split-brain", "분리뇌의"], ["2", "such that", "~하도록"], ["3", "visible", "보이는"], ["4", "select", "고르다"], ["5", "related", "관련된"]], "lit": "그 연구에서 / 분리뇌 환자들은 이미지를 제시받았다 / 그것이 그들의 왼쪽 눈에만 보이도록 / 그리고 왼손으로 관련된 카드를 고르라는 요청을 받았다", "nat": "그 연구에서 분리뇌 환자들은 왼쪽 눈에만 보이도록 이미지를 제시받은 뒤, 왼손으로 관련된 카드를 고르라는 요청을 받았다.", "ana": "<b>were shown an image</b>는 show A B(A에게 B를 보여 주다)의 <b>수동태</b>라서 목적어(an image)가 그대로 남아 있습니다. 이걸 '환자들이 이미지를 보여 주었다'로 읽으면 완전히 뒤집힙니다. <b>such that</b>은 '~하도록, 그 결과 ~하게'라는 결과·목적 표현이고, and 뒤 <b>asked</b> 앞에는 <b>were가 생략</b>돼 있어 were shown과 <b>수동태 병렬</b>을 이룹니다.", "pe": "\u0001In the study\u0002, / \u0001split-brain<sup>1</sup>\u0002 patients were shown an image / \u0001such that<sup>2</sup> it was visible<sup>3</sup> to only their left eye\u0002 / and asked to select<sup>4</sup> a \u0001related<sup>5</sup>\u0002 card \u0001with their left hand\u0002.", "pk": "\u0001그 연구에서\u0002 / \u0001분리뇌\u0002 환자들은 이미지를 제시받았다 / \u0001그것이 그들의 왼쪽 눈에만 보이도록\u0002 / 그리고 \u0001왼손으로\u0002 \u0001관련된\u0002 카드를 고르라는 요청을 받았다", "core": "환자들은 이미지를 제시받고 카드를 고르라는 요청을 받았다.", "tags": ["In the study = 전치사구(부사구): 문장 전체를 꾸밈", "주어 patients + 수동태 were shown + an image (4형식 수동). split-brain = 형용사: patients를 꾸밈", "such that ~ = 접속사절(부사절, 결과·정도): were shown을 꾸밈", "and [were] asked to select = 수동태 병렬(were 생략). related = 형용사: card를 꾸밈. with their left hand = 전치사구(부사구): select를 꾸밈"], "steps": [{"t": "이 문장은 <b>4형식 수동태 두 개가 and로 병렬된</b> 문장이다. such that절이 중간에 끼어 길어 보인다."}, {"t": "첫 수동태의 뼈대부터 찾는다.", "sub": ["S: split-brain patients (분리뇌 환자들). split-brain 분리뇌의", "V: were shown (show 보여 주다의 수동태)", "O: an image (이미지). show A B(4형식)의 수동태라 직접목적어 an image가 남는다. 남은 목적어는 동사가 요구하는 자리라서 뼈대에 둔다 (문형 기준)", "뼈대 = <b>patients were shown an image</b>"]}, {"t": "<b>such that it was visible to only their left eye</b>는 '~하도록'이라는 결과·정도의 부사절이다.", "sub": ["S: it (= an image, 이미지)", "V: was (be), C: visible (보이는)", "to only their left eye (오직 왼쪽 눈에만)"]}, {"t": "<b>and asked to select a related card with their left hand</b>는 were가 생략된 두 번째 수동태다. 'were shown'과 '(were) asked'가 병렬이다.", "sub": ["ask A to V의 수동 = A가 V하도록 요청받다", "select 고르다, related 관련된, with their left hand (왼손으로)"]}, {"t": "<b>In the study</b> (그 연구에서)는 문장 전체를 꾸미는 전치사구다."}], "sum": "분리뇌 환자들, 이미지를 왼쪽 눈에만 보이게 제시받고 왼손으로 관련 카드를 고르도록 요청받음"}, {"i": "08", "q": "11", "s": "A-4", "title": "수동태 S+V(1형식) + 분사구문(결과) 안의 명사절", "eng": "In a split-brain patient, / the connection<sup>1</sup> between the right and left hemispheres<sup>2</sup> has been broken<sup>3</sup>, / meaning no information can cross<sup>4</sup> / from one hemisphere to the other.", "notes": [["1", "connection", "연결"], ["2", "hemisphere", "(뇌) 반구"], ["3", "break", "끊다, 부수다"], ["4", "cross from A to B", "A에서 B로 건너가다"]], "lit": "분리뇌 환자에게서는 / 좌우 반구 사이의 연결이 끊어져 있다 / 그것은 어떤 정보도 건너갈 수 없다는 뜻이다 / 한쪽 반구에서 다른 쪽 반구로", "nat": "분리뇌 환자에게는 좌우 반구를 잇는 연결이 끊어져 있어서, 어떤 정보도 한쪽 반구에서 다른 쪽으로 건너갈 수 없다.", "ana": "주어의 핵은 <b>the connection</b>이고 between ~ hemispheres는 전부 수식어라 동사는 <b>단수 취급(has been broken)</b>입니다. 콤마 뒤 <b>meaning</b>은 <b>결과의 분사구문</b>으로, '즉 ~라는 뜻이다'로 이어 읽으세요 — 앞 문장 전체를 받습니다. 그 뒤에는 <b>접속사 that이 생략</b>된 명사절이 옵니다. <b>the other</b>는 둘 중 나머지 하나이므로 반구가 <b>두 개</b>라는 것과 짝이 맞습니다.", "pe": "\u0001In a split-brain patient\u0002, / the connection<sup>1</sup> \u0001between the right and left hemispheres<sup>2</sup>\u0002 has been broken<sup>3</sup>, / \u0001meaning no information can cross<sup>4</sup>\u0002 / \u0001from one hemisphere to the other\u0002.", "pk": "\u0001분리뇌 환자에게서는\u0002 / \u0001좌우 반구 사이의\u0002 연결이 끊어져 있다 / \u0001그것은 어떤 정보도 건너갈 수 없다는 뜻이다\u0002 / \u0001한쪽 반구에서 다른 쪽 반구로\u0002", "core": "연결이 끊어져 있다.", "tags": ["In a split-brain patient = 전치사구(부사구): has been broken을 꾸밈", "주어 connection + has been broken (현재완료 수동). between ~ = 전치사구(형용사구): connection을 꾸밈", "meaning ~ = 분사구문(부사적: 결과): 앞 절을 꾸밈. no information can cross는 meaning의 목적어절", "from one hemisphere to the other = 전치사구(부사구): cross를 꾸밈, 분사구문 안"], "steps": [{"t": "이 문장은 <b>수동태 S+V(1형식)</b> 뒤에 분사구문이 붙은 문장이다. 분사구문 안에 절이 들어 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the connection (연결). between the right and left hemispheres (좌우 반구 사이의)는 connection을 꾸미는 전치사구", "V: has been broken (break 끊다의 p.p. broken, 현재완료 수동태). (문형 기준) 수동태 주절 = 1형식", "뼈대 = <b>the connection has been broken</b>", "hemisphere (뇌의 반구)"]}, {"t": "<b>In a split-brain patient</b> (분리뇌 환자에게서)는 문장 전체를 꾸미는 전치사구다."}, {"t": "<b>meaning no information can cross ~</b>는 동사가 아니라 <b>분사구문(결과)</b>이다 (= which means). '그것은 ~라는 뜻이다'로 읽는다.", "sub": ["mean (뜻하다)의 -ing형", "O: no information can cross ... (어떤 정보도 건너갈 수 없다는 것). 접속사 that이 생략된 명사절"]}, {"t": "mean의 목적어절 안의 뼈대를 찾는다.", "sub": ["S: no information (어떤 정보도)", "V: can cross (cross 건너가다)", "from one hemisphere to the other (한쪽 반구에서 다른 쪽으로) = 전치사구"]}], "sum": "분리뇌 환자는 좌우 반구 연결이 끊겨 정보가 한쪽에서 다른 쪽으로 건너갈 수 없음"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2016년 3월 31번", "ans": "①", "tr": [["1", "자신에게 긍정적으로 말을 걸고 나서 이미 되고 싶은 사람이 된 것처럼 행동함으로써, 당신은 실제로 자기 자신의 응원단장이 될 수 있다."], ["2", "긍정적이고 쾌활하고 행복하고 호감 가는 사람 역할의 오디션을 보고 있는 것처럼 행동하라."], ["3", "이미 그런 사람인 것처럼 걷고, 말하고, 행동하라."], ["4", "만나는 모든 사람을, 마치 당신이 업계 최고의 인물로 방금 상을 받은 것처럼, 또는 방금 복권에 당첨된 것처럼 대하라."], ["5", "단 몇 분간 ~인 척한 뒤에 자신에 대한 기분이 얼마나 좋아지는지 알면 깜짝 놀랄 것이다."]], "evh": "2 · 3번 문장", "ev": [{"en": true, "h": "Act as though you were trying out for the role of a positive, cheerful, happy, and likable person. / Walk, talk, and act as if you were already that person."}, {"en": false, "h": "빈칸이 <b>맨 마지막 문장</b>에 있으면 앞 문장들을 <b>한 단어로 요약</b>하는 자리입니다. 1~4번이 전부 <b>as if / as though + 가정법</b>, 즉 '실제로는 아직 아닌데 그런 것처럼 행동하라'는 말입니다. 이것을 한 단어로 바꾸면 <b>pretending(~인 척하기)</b>입니다. 빈칸 유형은 <b>새로운 단어를 찾는 것이 아니라 반복된 말을 압축하는 것</b>임을 기억하세요."}], "opts": [{"n": "①", "t": "pretending (~인 척하기)", "a": true, "x": false, "trap": false, "e": "as if / as though가 네 번 반복된 것을 한 단어로 줄이면 이것입니다."}, {"n": "②", "t": "competing (경쟁하기)", "a": false, "x": true, "trap": true, "e": "the very best person in your industry라는 표현 때문에 걸리지만, 남과 <b>겨루라</b>는 말은 없습니다. 이미 최고인 <b>척하라</b>는 말입니다."}, {"n": "③", "t": "purchasing (구입하기)", "a": false, "x": true, "trap": false, "e": "물건을 사는 이야기가 전혀 없습니다. lottery(복권)에서 연상만 되는 함정입니다."}, {"n": "④", "t": "complaining (불평하기)", "a": false, "x": true, "trap": false, "e": "글 전체가 <b>긍정적으로</b> 말하고 행동하라는 내용이라 정반대입니다."}, {"n": "⑤", "t": "apologizing (사과하기)", "a": false, "x": true, "trap": false, "e": "사과에 대한 언급이 한 줄도 없습니다."}], "w": [["cheerleader", "응원단장"], ["talk to oneself", "자신에게 말을 걸다"], ["act as if", "마치 ~인 것처럼 행동하다"], ["try out for", "~의 오디션을 보다"], ["likable", "호감 가는"], ["treat", "대하다, 대우하다"], ["award", "상"], ["industry", "업계, 분야"], ["lottery", "복권"], ["be amazed at", "~에 깜짝 놀라다"]]}, {"q": "08", "type": "밑줄 의미", "src": "2020년 6월 21번", "ans": "⑤", "tr": [["1", "여러 세기에 걸쳐 다양한 작가와 사상가들은 인간을 바깥에서 바라보며 사회생활의 연극적 성격에 깊은 인상을 받아 왔다."], ["2", "이를 표현한 가장 유명한 인용문은 셰익스피어에게서 나온다. \"온 세상은 무대이고 / 모든 남녀는 그저 배우일 뿐이다 / 그들은 각자 퇴장과 등장이 있고 / 한 사람이 평생 여러 배역을 연기한다.\""], ["3", "극장과 배우가 전통적으로 가면의 이미지로 표현되어 왔다면, 셰익스피어 같은 작가들이 말하려는 바는 우리 모두가 끊임없이 가면을 쓰고 있다는 것이다."], ["4", "어떤 사람은 남들보다 더 나은 배우다."], ["5", "희곡 '오셀로'에 나오는 이아고 같은 악한 인물들은 우호적인 미소 뒤에 적대적인 의도를 숨길 수 있다."], ["6", "또 어떤 사람들은 더 큰 자신감과 허세를 갖고 연기할 수 있는데, 그들은 흔히 지도자가 된다."], ["7", "뛰어난 연기력을 가진 사람은 복잡한 사회적 환경을 더 잘 헤쳐 나가고 앞서 나간다."]], "evh": "2 · 7번 문장", "ev": [{"en": true, "h": "one man in his time plays many parts / People with excellent acting skills can better navigate our complex social environments and get ahead."}, {"en": false, "h": "밑줄 의미 문제는 <b>밑줄 뒤에 나오는 예시</b>가 답을 정해 줍니다. 5번의 이아고는 <b>적의를 미소 뒤에 감추고</b>, 6번의 사람들은 <b>자신감 있는 모습을 연기</b>합니다. 둘 다 상황에 맞춰 <b>겉으로 보이는 자기를 바꾸는</b> 행동이에요. 게다가 2번 인용문의 <b>plays many parts</b>는 상황마다 다른 배역을 맡는다는 뜻입니다. 즉 가면 = <b>사회적 상황에 맞춘 행동 조절</b>입니다."}], "opts": [{"n": "①", "t": "protecting our faces from harmful external forces (해로운 외부의 힘으로부터 얼굴을 보호하기)", "a": false, "x": true, "trap": false, "e": "mask를 <b>글자 그대로</b> 읽은 함정입니다. 이 글의 가면은 비유이지 실제 보호 장비가 아닙니다."}, {"n": "②", "t": "performing on stage to show off our acting skills (연기력을 뽐내기 위해 무대에서 공연하기)", "a": false, "x": true, "trap": true, "e": "stage, actors, acting skills가 다 나와서 가장 그럴듯합니다. 그러나 진짜 무대에 서라는 것이 아니라 <b>사회생활이 무대 같다</b>는 비유입니다."}, {"n": "③", "t": "feeling confident by beating others in competition (경쟁에서 남을 이겨 자신감을 느끼기)", "a": false, "x": true, "trap": false, "e": "confidence라는 단어는 나오지만 <b>경쟁에서 이긴다</b>는 내용은 없습니다."}, {"n": "④", "t": "doing completely the opposite of what others expect (남들이 기대하는 것과 완전히 반대로 행동하기)", "a": false, "x": true, "trap": false, "e": "반대로 행동하라는 것이 아니라 <b>상황에 맞게</b> 행동한다는 것입니다."}, {"n": "⑤", "t": "adjusting our behavior based on the social context given (주어진 사회적 맥락에 맞춰 행동을 조절하기)", "a": true, "x": false, "trap": false, "e": "이아고의 위장, 자신감의 연기, plays many parts가 모두 이 한 줄로 모입니다."}], "w": [["be struck by", "~에 깊은 인상을 받다"], ["theatrical quality", "연극적 성격"], ["merely", "그저, 단지"], ["play many parts", "여러 배역을 연기하다"], ["imply", "암시하다"], ["constantly", "끊임없이"], ["conceal", "숨기다"], ["hostile intention", "적대적인 의도"], ["navigate", "헤쳐 나가다"], ["get ahead", "앞서 나가다"]]}, {"q": "09", "type": "요약문 완성", "src": "2022년 3월 40번", "ans": "①", "tr": [["1", "거리는 두 사람 사이의 관계를 알려 주는 믿을 만한 지표다."], ["2", "낯선 사람끼리는 아는 사이보다 더 떨어져 서고, 아는 사이는 친구보다, 친구는 연인보다 더 떨어져 선다."], ["3", "물론 이런 규칙이 깨질 때도 있다."], ["4", "생판 모르는 사람들로 가득 찬 엘리베이터를 타고 20층을 올라갔던 마지막 때를 떠올려 보라."], ["5", "정어리 통조림 같은 그 경험은 분명 상황을 조금 불편하게 만들었을 것이다."], ["6", "물리적 공간을 침해당한 채, 당신은 눈맞춤을 피하고 대신 엘리베이터 버튼에 시선을 두면서 \"심리적\" 공간을 만들어 내려 했을 것이다."], ["7", "한 비언어적 통로(눈맞춤)에서 가까움을 줄임으로써, 사람은 다른 통로(근접성)에서 원치 않게 가까워진 것을 보완할 수 있다."], ["8", "마찬가지로 큰 탁자에서 몇 걸음 떨어져 앉은 사람과 이야기할 때는 계속 눈을 맞추기 쉬운데, 이는 서로 바로 옆에 서 있다면 오히려 불편하게 느낄 만한 행동이다."], ["9", "[요약문] 사람 사이의 물리적 거리는 관계의 성격에 따라 (A) 결정되지만, 그 거리가 적절하지 않을 때 사람들은 편안한 심리적 거리를 만들기 위해 비언어적 소통을 (B) 조절한다."]], "evh": "1 · 7번 문장", "ev": [{"en": true, "h": "Distance is a reliable indicator of the relationship between two people. / By reducing closeness in one nonverbal channel (eye contact), one can compensate for unwanted closeness in another channel (proximity)."}, {"en": false, "h": "요약문은 <b>(A)와 (B)를 각각 다른 문장에서</b> 찾습니다. (A)는 1·2번 — 거리가 관계에 따라 <b>정해진다</b>(indicator, 낯선 사람 &gt; 지인 &gt; 친구 &gt; 연인)는 대목이니 <b>determined</b>. (B)는 6·7번 — 엘리베이터에서 눈맞춤을 피하고, 멀리 앉으면 오히려 눈을 더 맞춘다는 <b>맞춰 가는 행동</b>이니 <b>adjust</b>입니다. 두 칸 중 <b>확실한 한 칸을 먼저 확정</b>하고 선택지를 지우는 것이 요약문 문제의 정석입니다."}], "opts": [{"n": "①", "t": "determined … adjust (결정되는 … 조절한다)", "a": true, "x": false, "trap": false, "e": "1번의 reliable indicator = (A) determined, 6·7번의 보완 행동 = (B) adjust."}, {"n": "②", "t": "concealed … interpret (숨겨지는 … 해석한다)", "a": false, "x": true, "trap": false, "e": "거리는 <b>드러나는</b> 지표이지 숨겨지는 것이 아닙니다. (B)도 해석이 아니라 행동의 변경입니다."}, {"n": "③", "t": "influenced … ignore (영향받는 … 무시한다)", "a": false, "x": true, "trap": true, "e": "(A) influenced는 통할 듯하지만 (B)가 결정적으로 틀립니다. 사람들은 비언어적 소통을 <b>무시하는</b> 것이 아니라 오히려 <b>적극적으로 바꿔</b> 씁니다."}, {"n": "④", "t": "predicted … stop (예측되는 … 멈춘다)", "a": false, "x": true, "trap": false, "e": "거리를 미리 <b>예측</b>한다는 이야기가 아니고, 소통을 <b>멈추는</b> 것도 아닙니다."}, {"n": "⑤", "t": "measured … decrease (측정되는 … 줄인다)", "a": false, "x": true, "trap": false, "e": "거리를 재는 실험이 아니며, 눈맞춤은 상황에 따라 줄기도 하고 <b>늘기도</b> 합니다(8번). decrease로 묶을 수 없습니다."}], "w": [["reliable", "믿을 만한"], ["indicator", "지표"], ["acquaintance", "아는 사이, 지인"], ["violate", "침해하다, ibute to", "~의 원인이 되다"], ["insufficient", "불충분한"], ["carbon dioxide emission", "이산화탄소 배출"], ["traffic congestion", "교통 혼잡"], ["sustainable", "지속 가능한"], ["car-oriented", "자동차 중심의"], ["vast majority", "대다수"], ["proportion", "비율"], ["motorization rate", "자동차 보유율"]]}, {"q": "11", "type": "글의 제목 (장문)", "src": "2022년 11월 41번", "ans": "③", "tr": [["1", "신경심리학자 Michael Gazzaniga는 우리 뇌가 우리를 속이는, 일관성 있는(그러나 반드시 참은 아닌) 이야기를 만들어 내는 데 뛰어나다는 것을 보여 주는 연구를 수행했다."], ["2", "그 연구에서 분리뇌 환자들은 왼쪽 눈에만 보이도록 이미지를 제시받은 뒤, 왼손으로 관련된 카드를 고르라는 요청을 받았다."], ["3", "왼쪽 눈의 시각과 왼쪽 신체의 움직임은 우반구가 통제한다."], ["4", "분리뇌 환자에게는 좌우 반구를 잇는 연결이 끊어져 있어서, 어떤 정보도 한쪽 반구에서 다른 쪽으로 건너갈 수 없다."], ["5", "따라서 이 실험에서 모든 일은 우반구가 했고, 좌반구는 무슨 일이 벌어지는지 알지 못했다."], ["6", "그런 다음 Gazzaniga는 참가자들에게 왜 그 카드를 골랐는지 물었다."], ["7", "언어는 좌반구에서 처리되고 만들어지므로, 대답은 좌반구가 해야 한다."], ["8", "그러나 실험 설계상 그 참가자가 왜 그 카드를 골랐는지는 오직 우반구만 알고 있었다."], ["9", "그래서 Gazzaniga는 참가자들이 질문을 받으면 아무 말도 하지 못할 것이라고 예상했다."], ["10", "그런데 오히려 모든 피험자가 대답을 지어냈다."], ["11", "좌반구는 우반구가 한 행동에 대해 그럴듯한 이유를 대라는 요구를 받고 있었던 셈이다."], ["12", "좌반구는 답을 몰랐다."], ["13", "그러나 그렇다고 답을 지어내지 못한 것은 아니었다."], ["14", "다만 그 답은 현실에 아무 근거가 없었다."], ["15", "만약 이 연구가 분리뇌 환자에게만 해당하는 것이었다면, 흥미롭기는 해도 우리에게 그다지 관련 있는 이야기는 아닐 것이다."], ["16", "그런데 이유를 지어내는 사람이 분리뇌 환자만은 아닌 것으로 드러난다."], ["17", "우리 모두 그렇게 한다."], ["18", "우리는 모두 자신에 대한 일관성 있는 이야기가 필요하고, 그 이야기에서 정보가 빠져 있으면 우리 뇌는 그냥 세부 사항을 채워 넣는다."]], "evh": "1 · 16 · 18번 문장", "ev": [{"en": true, "h": "our brains excel at creating coherent (but not necessarily true) stories that deceive us / It turns out split-brain patients aren't the only ones who fabricate reasons. / our brains simply fill in the details"}, {"en": false, "h": "장문의 제목은 <b>첫 문장과 마지막 문장</b>을 이어 붙이면 거의 완성됩니다. 1번이 <b>뇌는 우리를 속이는 이야기를 잘 지어낸다</b>로 결론을 미리 말하고, 16~18번이 <b>그건 환자만이 아니라 우리 모두</b>라고 확장합니다. 그 사이에 있는 것이 <b>분리뇌 환자 실험</b>이에요. 즉 '속이는 뇌' + '분리뇌 연구'가 둘 다 들어간 제목이어야 합니다."}], "opts": [{"n": "①", "t": "Which Side of the Brain Do We Tend to Use More? (우리는 뇌의 어느 쪽을 더 많이 쓰는가?)", "a": false, "x": true, "trap": fal   for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';

}

    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;

  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;

  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{

    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};

    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{

}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';

    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';

}
function renderExp(){
  const rec=S.sub;

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
