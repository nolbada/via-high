<title>고2 미니모의고사 3회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}

.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .at{font-size:13px;color:var(--sub)}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}

단장(치어리더)<\/b>이"}, {"e": "by <b>talking to yourself<\/b> positively", "k": "자신에게 긍정적으로 <b>말을 걸고<\/b>"}, {"e": "and then <b>acting as if<\/b>", "k": "그러고 나서 <b>~인 것처럼 행동함으로써<\/b>"}, {"e": "you were already the person", "k": "당신이 이미 그 사람인 것처럼"}, {"e": "that you wanted to be.", "k": "당신이 되고 싶어 했던."}], "easy": "자신에게 긍정적으로 말하고, 이미 되고 싶은 사람인 것처럼 행동해 보세요. 그러면 스스로를 응원해 줄 수 있어요.", "gist": "글 전체의 주제 문장. 되고 싶은 사람인 '척' 행동하면 나 자신의 응원단장이 된다.", "link": "자신에게 긍정적으로 말을 걸고 이미 되고 싶었던 그 사람인 것처럼 행동함으로써, 당신은 실제로 자기 자신의 응원단장이 될 수 있다."}, {"n": 2, "ch": [{"e": "Act <b>as though<\/b>", "k": "<b>마치 ~인 것처럼<\/b> 행동하라"}, {"e": "you were <b>trying out for<\/b>", "k": "당신이 <b>~에 지원해 보는(오디션을 보는)<\/b>"}, {"e": "the role of a positive, cheerful, happy, and likable person.", "k": "긍정적이고 명랑하고 행복하고 호감이 가는 사람 역할을."}], "easy": "밝고 호감 가는 사람 역할의 오디션을 보는 것처럼 행동해 보세요.", "gist": "'그 사람'이 어떤 사람인지(긍정적·명랑·행복·호감) 구체적으로 알려 주는 문장."}, {"n": 3, "ch": [{"e": "Walk, talk, and act", "k": "걷고, 말하고, 행동하라"}, {"e": "<b>as if<\/b> you were already", "k": "이미 ~인 것처럼"}, {"e": "that person.", "k": "그 사람<span class=\"r\">(= 긍정적이고 쾌활하고 행복하고 호감 가는 사람)<\/span>인."}], "easy": "이미 그런 사람인 것처럼 걷고, 말하고, 행동해 보세요.", "gist": "행동 방법을 걷기·말하기·행동하기로 좀 더 구체화한 문장."}, {"n": 4, "ch": [{"e": "Treat everyone you meet", "k": "당신이 만나는 모든 사람을 대하라"}, {"e": "<b>as though<\/b> you had just won an award", "k": "마치 방금 상을 받은 것처럼"}, {"e": "for being the very best person", "k": "가장 최고의 사람이라는 이유로"}, {"e": "in your industry", "k": "당신의 업계에서"}, {"e": "or <b>as though<\/b> you had just won the lottery.", "k": "또는 마치 방금 복권에 당첨된 것처럼."}], "easy": "방금 업계 최고상을 받았거나 복권에 당첨된 것처럼 기분 좋게 사람들을 대해 보세요.", "gist": "역시 as though를 쓴 '이미 그런 것처럼' 행동 지침. 가정법이 또 한 번 반복된다.", "link": "당신이 방금 업계에서 가장 최고인 사람에게 주는 상을 받았거나 방금 복권에 당첨된 것처럼, 당신이 만나는 모든 사람을 대하라."}, {"n": 5, "ch": [{"e": "You will be <b>amazed<\/b>", "k": "당신은 <b>깜짝 놀랄<\/b> 것이다"}, {"e": "at how much better", "k": "얼마나 더 좋게"}, {"e": "you feel about yourself", "k": "자신에 대해 느끼게 되는지"}, {"e": "after just a few minutes of <b>pretending<\/b>.", "k": "단 몇 분간의 <b>흉내 내기<\/b> 후에.<span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}], "easy": "단 몇 분만 그런 척해 봐도 기분이 훨씬 좋아져서 놀랄 거예요.", "gist": "빈칸이 있는 마지막 문장. 앞 문장들의 as if / as though 행동을 한 단어(pretending)로 묶어 결과를 말한다."}]}, {"no": "08", "typ": "밑줄 의미", "src": "2020년 6월 21번", "evn": [5, 6, 7], "ev_en": "Evil types such as Iago in the play Othello are able to conceal their hostile intentions behind a friendly smile. / Others are able to act with more confidence and bravado — they often become leaders. / People with excellent acting skills can better navigate our complex social environments and get ahead.", "ev_ko": [[5, "희곡 〈오셀로〉 속 이아고와 같은 악한 유형의 인물들은 자신들의 적대적인 의도를 친근한 미소 뒤에 숨길 수 있다."], [6, "다른 사람들은 더 많은 자신감과 허세를 가지고 연기할 수 있고, 그들은 흔히 리더가 된다."], [7, "뛰어난 연기력을 가진 사람들은 우리의 복잡한 사회적 환경을 더 잘 헤쳐 나갈 수 있고 앞서 나갈 수 있다."]], "why": ["밑줄 의미 문제는 <b>밑줄 뒤에 나오는 예시<\/b>가 답을 정해 줍니다", "3번에서 '우리 모두가 끊임없이 가면을 쓰고 있다'고 한 뒤, 4~7번에서 예를 듭니다", "5번의 이아고는 <b>적의를 친근한 미소 뒤에 숨깁니다<\/b>. 6번의 사람들은 <b>자신감과 허세를 가지고 연기합니다<\/b>.", "둘 다 겉으로 드러나는 모습을 상황에 맞게 바꾸는 행동입니다", "7번은 이 능력이 뛰어난 사람이 복잡한 사회적 환경을 더 잘 헤쳐 나간다고 정리합니다", "2번 인용문의 <b>plays many parts(여러 배역을 연기한다)<\/b>도 같은 뜻입니다", "즉 '가면을 쓴다'는 것은 <b>주어진 사회적 상황에 맞춰 행동을 조절한다<\/b>는 뜻입니다."], "ch": [{"n": "①", "t": "protecting our faces from harmful external forces", "g": "해로운 외부의 힘으로부터 우리의 얼굴을 보호한다는", "ok": false, "e": ["mask를 <b>글자 그대로<\/b> 읽으면 안 됩니다", "이 글에서 가면은 비유입니다", "얼굴을 보호한다는 내용도 본문에 없습니다."]}, {"n": "②", "t": "performing on stage to show off our acting skills", "g": "우리의 연기력을 자랑하기 위해 무대 위에서 공연한다는", "ok": false, "e": ["본문에 acting skills가 그대로 나오고 연극 관련 표현도 많아서 헷갈리기 쉽습니다", "하지만 이 글은 연기 자체에 관한 글이 아닙니다", "사회적 상황에 따른 행동을 연기에 <b>빗대어<\/b> 표현한 글입니다."]}, {"n": "③", "t": "feeling confident by beating others in competition", "g": "경쟁에서 다른 사람들을 이김으로써 자신감을 느낀다는", "ok": false, "e": ["confidence(자신감)는 6번에 나옵니다", "하지만 경쟁에서 이겨서 자신감을 느낀다는 내용은 없습니다."]}, {"n": "④", "t": "doing completely the opposite of what others expect", "g": "다른 사람들이 기대하는 것과 완전히 반대로 행동한다는", "ok": false, "e": ["남들의 기대와 반대로 행동하라는 말은 없습니다", "<b>상황에 맞게<\/b> 행동을 조절한다는 내용입니다."]}, {"n": "⑤", "t": "adjusting our behavior based on the social context given", "g": "주어진 사회적 상황에 따라 우리의 행동을 조절한다는", "ok": true, "e": ["5번 이아고의 위장, 6번의 자신감 있는 연기, 2번의 plays many parts가 모두 이 한 줄로 모입니다."]}], "tr": ["여러 세기에 걸쳐 다양한 작가와 사상가들은 인간을 바깥의 관점에서 바라보며 사회적 삶의 연극적 속성에 깊은 인상을 받아 왔다.", "이것을 표현하는 가장 유명한 인용문은 셰익스피어에게서 나온다. \"온 세상은 무대이고, / 모든 남자와 여자는 그저 배우일 뿐이다. / 그들은 각자 퇴장과 입장이 있고, / 한 사람이 평생 여러 배역을 연기한다.\"", "극장과 배우가 전통적으로 가면의 이미지로 표현되어 왔다면, 셰익스피어 같은 작가들은 우리 모두가 <b>끊임없이 가면을 쓰고 있다<\/b>는 것(= 주어진 사회적 상황에 따라 우리의 행동을 조절한다는 것)을 암시하고 있는 것이다.", "어떤 사람들은 다른 사람들보다 더 나은 배우이다.", "희곡 〈오셀로〉 속 이아고와 같은 악한 유형의 인물들은 자신들의 적대적인 의도를 친근한 미소 뒤에 숨길 수 있다.", "다른 사람들은 더 많은 자신감과 허세를 가지고 연기할 수 있고, 그들은 흔히 리더가 된다.", "뛰어난 연기력을 가진 사람들은 우리의 복잡한 사회적 환경을 더 잘 헤쳐 나갈 수 있고 앞서 나갈 수 있다."], "ps": [{"n": 1, "ch": [{"e": "Over the centuries", "k": "여러 세기에 걸쳐"}, {"e": "various writers and thinkers,", "k": "다양한 작가와 사상가들은,"}, {"e": "looking at humans", "k": "인간을 바라보며,"}, {"e": "from an outside perspective,", "k": "바깥의 관점에서,"}, {"e": "have been <b>struck by<\/b>", "k": "<b>인상을 받아<\/b> 왔다"}, {"e": "the <b>theatrical<\/b> quality of social life.", "k": "사회적 삶의 <b>연극적<\/b> 속성에."}], "easy": "오랜 세월 많은 작가와 사상가가 사회생활이 연극 같다는 점에 거듭 깊은 인상을 받아 왔어요.", "gist": "글의 출발점. 사회생활은 연극 같다는 생각이 오래전부터 있었다.", "link": "여러 세기에 걸쳐 다양한 작가와 사상가들은 인간을 바깥의 관점에서 바라보며 사회적 삶의 연극적 속성에 깊은 인상을 받아 왔다."}, {"n": 2, "ch": [{"e": "The most famous quote", "k": "가장 유명한 인용문은"}, {"e": "expressing this", "k": "이것<span class=\"r\">(= 사회생활의 연극적 속성)<\/span>을 표현하는"}, {"e": "comes from Shakespeare:", "k": "셰익스피어에게서 나온다:"}, {"e": "“All the world’s a stage, /", "k": "“온 세상은 무대이고, /"}, {"e": "And all the men and women", "k": "그리고 모든 남자와 여자는"}, {"e": "merely players; /", "k": "그저 배우일 뿐이다; /"}, {"e": "They have their exits and their entrances, /", "k": "그들은 각자 퇴장과 입장이 있고, /"}, {"e": "And <b>one man<\/b> in his time <b>plays many parts<\/b>.”", "k": "한 사람이 평생 동안 <b>여러 배역을 연기한다<\/b>.”"}], "easy": "이 생각을 가장 유명하게 표현한 없습니다."]}, {"n": "⑤", "t": "The Dominance of the Left Brain in Image Processing", "g": "이미지 처리에서 좌뇌의 우세", "ok": false, "e": ["왼쪽 눈의 시력은 <b>우반구<\/b>가 제어한다고 했습니다(3번)", "좌반구는 <b>언어<\/b>와 관련된 역할을 합니다(7번)", "좌뇌가 이미지 처리를 지배한다는 내용이 아닙니다."]}], "tr": ["신경 심리학자인 Michael Gazzaniga는 우리의 뇌가 우리를 속이는 일관성 있는(그러나 반드시 사실은 아닌) 이야기를 만들어 내는 데 뛰어나다는 것을 보여 주는 연구를 수행했다.", "그 연구에서 분할 뇌 환자들은 왼쪽 눈에만 보이도록 이미지를 보게 되었고, 왼손으로 관련된 카드를 선택하도록 요청받았다.", "왼쪽 눈의 시력과 왼쪽 몸의 움직임은 우반구에 의해 제어된다.", "분할 뇌 환자에게는 우반구와 좌반구 사이의 연결이 끊어져 있다. 이는 어떤 정보도 한쪽 반구에서 다른 쪽 반구로 건너갈 수 없다는 것을 의미한다.", "따라서 이 실험에서 우반구가 모든 일을 하고 있었고, 좌반구는 무슨 일이 일어나고 있는지 <b>알지 못하고 있었다<\/b>(문제지엔 aware(알고 있었다)로 되어 있음 → 원래 unaware).", "그 후 Gazzaniga는 참가자들에게 그들이 왜 자신이 고른 그 카드를 골랐는지 물었다.", "언어는 좌반구에서 처리되고 생성되기 때문에, 좌반구가 응답하도록 요구된다.", "그러나 실험의 설계 때문에, 오직 우반구만이 왜 그 참가자가 그 카드를 선택했는지 알고 있었다.", "결과적으로 Gazzaniga는 참가자들이 그 질문에 답하도록 요청받았을 때 침묵할 것이라고 예상했다.", "하지만 그 대신에, 모든 피험자가 대답을 꾸며 냈다.", "좌반구는 우반구에 의해 행해진 행동에 대한 설명(그럴듯한 이유)을 제공하라는 요구를 받고 있었다.", "좌반구는 그 답을 알지 못했다.", "그러나 그렇다고 해서 좌반구가 답을 꾸며 내는 것을 막지는 못했다.", "하지만 그 답은 현실에 아무 근거가 없었다.", "자, 만약 이 연구가 분할 뇌 환자에게만 제한되었다면, 흥미롭기는 하겠지만 우리와 그다지 관련 있지는 않을 것이다.", "분할 뇌 환자들만이 이유를 꾸며 내는 유일한 사람들이 아닌 것으로 드러난다.", "우리 모두 그렇게 한다.", "우리 모두는 자신에 대한 일관성 있는 이야기를 필요로 하고, 그 이야기에서 정보가 빠져 있을 때 우리의 뇌는 단순히 세부 사항을 채워 넣는다."], "ps": [{"n": 1, "ch": [{"e": "A neuropsychologist, Michael Gazzaniga", "k": "신경 심리학자인 Michael Gazzaniga는"}, {"e": "conducted a study", "k": "연구를 수행했다"}, {"e": "that shows that our brains", "k": "우리의 뇌가 ~임을 보여 주는"}, {"e": "(a) <b>excel<\/b> at creating", "k": "만들어 내는 데 <b>뛰어나다<\/b>"}, {"e": "coherent (but not necessarily true) stories", "k": "일관성 있는(그러나 반드시 사실은 아닌) 이야기를"}, {"e": "that deceive us.", "k": "우리를 <b>속이는<\/b>."}], "easy": "한 신경 심리학자가, 우리 뇌는 우리를 속이는 그럴듯한 이야기를 잘 만들어 낸다는 걸 보여 주는 연구를 했어요.", "gist": "글 전체의 주제 문장. 뇌는 일관된 이야기를 만들어 우리를 속인다.", "link": "신경 심리학자 Michael Gazzaniga는 우리의 뇌가 우리를 속이는 일관성 있는(그러나 반드시 사실은 아닌) 이야기를 만들어 내는 데 뛰어나다는 것을 보여 주는 연구를 수행했다."}, {"n": 2, "ch": [{"e": "In the study,", "k": "그 연구에서,"}, {"e": "s 001hostile\u0002 intentions<sup>3</sup> / \u0001behind a \u0001friendly\u0002 smile\u0002.", "pk": "\u0001'오셀로'라는 희곡의 이아고 같은\u0002 \u0001악한\u0002 인물들은 / 그들의 \u0001적대적인\u0002 의도를 숨길 수 있다 / \u0001\u0001우호적인\u0002 미소 뒤에\u0002", "core": "인물들은 의도를 숨길 수 있다.", "tags": ["주어 types. Evil = 형용사: types를 꾸밈. such as ~ = 전치사구(형용사구, 예시): types를 꾸밈", "동사 <b>are able to</b> conceal + 목적어 intentions. hostile = 형용사: intentions를 꾸밈", "behind ~ = 전치사구(부사구): conceal을 꾸밈. friendly = 형용사: smile을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 주어 뒤 예시 덩어리 때문에 주어와 동사가 멀어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Evil types (악한 인물들). evil 악한", "V: are able to conceal (be able to ~할 수 있다 + conceal 숨기다. 동사 덩어리)", "O: their hostile intentions (그들의 적대적인 의도). their = Evil types, hostile 적대적인", "뼈대 = <b>Evil types are able to conceal their hostile intentions</b>"]}, {"t": "<b>such as Iago in the play Othello</b>는 types를 꾸미는 전치사구(형용사구)다. '희곡 오셀로의 이아고 같은'이라는 예시다. Iago (이아고, 인물 이름), play (희곡). 이 덩어리를 빼면 주어와 동사가 바로 이어진다."}, {"t": "<b>behind a friendly smile</b> (우호적인 미소 뒤에)은 conceal을 꾸미는 전치사구(부사구)다. friendly (우호적인)."}], "sum": "이아고 같은 악한 인물, 친근한 미소 뒤에 적대적 의도를 숨길 수 있음"}, {"i": "04", "q": "09", "s": "4", "title": "명령문 V+O + 관계절(관계부사 생략) + 과거분사구", "eng": "Recall<sup>1</sup> the last time / you rode 20 stories<sup>2</sup> in an elevator / packed with<sup>3</sup> total strangers<sup>4</sup>.", "notes": [["1", "recall", "떠올리다"], ["2", "story", "(건물의) 층"], ["3", "packed with", "~으로 가득 찬"], ["4", "total stranger", "생판 모르는 사람"]], "lit": "마지막으로 그때를 떠올려 보라 / 당신이 엘리베이터를 타고 20층을 올라갔던 / 생판 모르는 사람들로 가득 찬", "nat": "생판 모르는 사람들로 가득 찬 엘리베이터를 타고 20층을 올라갔던 마지막 때를 떠올려 보라.", "ana": "<b>Recall</b>로 시작하는 명령문입니다. the last time 뒤에 <b>관계부사 when이 생략</b>돼 있어서 곧바로 주어+동사(you rode)가 붙습니다 — 'the time / the day / the way' 뒤에서는 관계부사가 잘 생략됩니다. 맨 뒤 <b>packed with</b>는 an elevator를 꾸미는 <b>과거분사</b>이고(엘리베이터는 '채워진' 쪽), <b>stories</b>는 '이야기'가 아니라 <b>건물의 층</b>입니다.", "pe": "Recall<sup>1</sup> the last time / \u0001you rode 20 stories<sup>2</sup> i mething을 꾸미는 관계절인데 <b>목적격 관계대명사가 생략</b>돼 있고, doing의 목적어 자리가 비어 있습니다. 마지막 <b>if you were standing</b>은 현재 사실과 반대를 말하는 <b>가정법 과거</b>예요 — 그래서 앞에 might이 왔습니다.", "pe": "\u0001Similarly\u0002, / \u0001if you are talking with someone who is seated<sup>1</sup> several feet away<sup>2</sup> at a large table\u0002, / you are likely to<sup>3</sup> maintain<sup>4</sup> \u0001constant\u0002 eye contact / — \u0001something you might feel uncomfortable<sup>5</sup> doing\u0002 / \u0001if you were standing next to each other\u0002.", "pk": "\u0001마찬가지로\u0002 / \u0001만약 당신이 큰 탁자에서 몇 걸음 떨어져 앉은 사람과 이야기하고 있다면\u0002 / 당신은 \u0001계속\u0002 눈을 맞추기 쉽다 / \u0001그것은 당신이 하기에 불편하게 느낄 만한 무언가다\u0002 / \u0001만약 당신이 서로 바로 옆에 서 있다면\u0002", "core": "당신은 눈을 맞추기 쉽다.", "tags": ["Similarly = 접속부사: 문장 전체를 꾸밈", "if ~ = 접속사절(부사절, 조건): are likely를 꾸밈. who is seated ~ = 관계절: someone을 꾸밈", "주어 you + <b>are likely to</b> maintain + 목적어 eye contact. constant = 형용사: eye contact를 꾸밈", "대시 뒤 something ~ = 동격 관계절(관계사 생략): eye contact를 꾸밈", "if you were standing ~ = 접속사절(부사절, <b>가정법 과거</b>): might feel을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 앞의 If절과 대시 뒤 부연이 붙어 길어 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: you (당신)", "V: are (be ~이다)", "C: likely (~할 것 같은). to maintain constant eye contact (계속 눈을 맞추다)는 likely를 꾸미는 to부정사라 뼈대 밖에 둔다(문형 기준). maintain 유지하다, constant 계속되는", "뼈대 = <b>you are likely</b>", "Similarly (마찬가지로)는 문장 전체를 꾸미는 부사"]}, {"t": "<b>if you are talking with someone ~</b>는 조건 부사절이다.", "sub": ["S: you, V: are talking (talk with ~와 이야기하다)", "someone을 who is seated several feet away at a large table이 꾸밈. is seated는 수동태(앉혀져 있는 = 앉아 있는)로 1형식으로 봄", "several feet away (몇 피트 떨어져, feet는 길이 단위 foot의 복수형), at a large table (큰 탁자에)"]}, {"t": "대시 뒤 <b>something you might feel uncomfortable doing</b>은 앞의 eye contact를 유지하는 일을 다시 설명하는 덩어리다. something과 you 사이에 목적격 관계대명사가 생략됐다.", "sub": ["S: you, V: might feel (feel ~하게 느끼다), C: uncomfortable (불편한)", "doing의 목적어가 빠져 있다 = something"]}, {"t": "<b>if you were standing next to each other</b>는 <b>가정법 과거</b> 조건절이다. 지금은 떨어져 있지만 '만약 서로 바로 옆에 서 있다면'이라는 가정이다. next to each other (서로 바로 옆에)."}], "sum": "떨어져 앉아 말하면 눈을 계속 맞추기 쉬우나, 바로 옆에 서면 불편할 행동"}, {"i": "06", "q": "10", "s": "6", "title": "S+V+C(2형식) + S+V(1형식) 병렬 + despite 양보", "eng": "Since 1990, / motorization rates<sup>1</sup> have stayed the same / and carbon dioxide emissions<sup>2</sup> from transport<sup>3</sup> have fallen, / despite<sup>4</sup> strong economic growth.", "notes": [["1", "motorization rate", "자동차 보유율"], ["2", "carbon dioxide emission", "이산화탄소 배출량"], ["3", "transport", "교통, 수송"], ["4", "despite", "~에도 불구하고"]], "lit": "1990년 이후로 / 자동차 보유율은 그대로 유지되어 왔다 / 그리고 교통에서 나오는 이산화탄소 배출량은 줄어들었다 / 강력한 경제 성장에도 불구하고", "nat": "1990년 이후 강력한 경제 성장에도 불구하고 자동차 보유율은 그대로였고 교통 부문의 이산화탄소 배출량은 줄어들었다.", "ana": "<b>Since + 과거 시점</b>이 나오면 뒤 동사는 거의 항상 <b>현재완료</b>입니다(have stayed / have fallen). 이 두 개가 and로 묶인 <b>병렬</b>이라는 것부터 잡으세요. 맨 뒤 <b>despite</b>는 <b>전치사</b>라서 뒤에 명사구만 옵니다 — although(접속사)와 바꿔 쓰려면 뒤에 주어+동사를 넣어야 합니다. 어법 문제 단골이니 표시해 두세요.", "pe": "\u0001Since 1990\u0002, / motorization rates<sup>1</sup> have stayed the same / and carbon dioxide emissions<sup>2</sup> \u0001from transport<sup>3</sup>\u0002 have fallen, / \u0001despite<sup>4</sup> strong economic growth\u0002.", "pk": "\u00011990년 이후로\u0002 / 자동차 보유율은 그대로 유지되어 왔다 / 그리고 \u0001교통에서 나오는\u0002 이산화탄소 배출량은 줄어들었다 / \u0001강력한 경제 성장에도 불구하고\u0002", "core": "자동차 보유율은 그대로였고 배출량은 줄어들었다.", "tags": ["Since 1990 = 전치사구(부사구): 두 현재완료를 꾸밈", "주어 rates + have stayed + 보어 the same (SVC)", "and 절 병렬: emissions + have fallen. from transport = 전치사구(형용사구): emissions를 꾸밈", "despite ~ = 전치사구(부사구, 양보): 앞 내용 전체를 꾸밈"], "steps": [{"t": "이 문장은 <b>두 절이 and로 이어진 현재완료 문장</b>이다. 앞에 Since 1990, 뒤에 despite 구가 붙어 길어 보인다."}, {"t": "첫 절의 뼈대부터 찾는다.", "sub": ["S: motorization rates (자동차 보유율)", "V: have stayed (stay 머무르다의 p.p., 현재완료)", "C: the same (똑같은 것)", "뼈대 = <b>motorization rates have stayed the same</b>"]}, {"t": "<b>and carbon dioxide emissions from transport have fallen</b>이 두 번째 절이다.", "sub": ["S: carbon dioxide emissions (이산화탄소 배출량). from transport (교통 부문에서 나오는)는 emissions를 꾸미는 전치사구", "V: have fallen (fall 줄어들다의 p.p., 현재완료)", "뼈대 = <b>emissions have fallen</b> (1형식)"]}, {"t": "<b>Since 1990</b> (1990년 이후로)은 두 현재완료 문장 전체를 꾸미는 전치사구다. since가 있어서 '그때부터 지금까지'로 읽는다."}, {"t": "<b>despite strong economic growth</b>는 양보 전치사구(부사구)다. '강력한 경제 성장에도 불구하고'라는 뜻이다. despite (~에도 불구하고), economic growth (경제 성장)."}], "sum": "1990년 이후 경제 성장에도 보유율은 그대로, 교통 부문 이산화탄소 배출은 감소"}, {"i": "07", "q": "11", "s": "A-2", "title": "수동태 병렬 + such that절", "eng": "In the study, / split-brain<sup>1</sup> patients were shown an image / such that<sup>2</sup> it was visible<sup>3</sup> to only their left eye / and asked to select<sup>4</sup> a related<sup>5</sup> card with their left hand.", "notes": [["1", "split-brain", "분리뇌의"], ["2", "such that", "~하도록"], ["3", "visible", "보이는"], ["4", "select", "고르다"], ["5", "related", "관련된"]], "lit": "그 연구에서 / 분리뇌 환자들은 이미지를 제시받았다 / 그것이 그들의 왼쪽 눈에만 보이도록 / 그리고 왼손으로 관련된 카드를 고르라는 요청을 받았다", "nat": "그 연구에서 분리뇌 환자들은 왼쪽 눈에만 보이도록 이미지를 제시받은 뒤, 왼손으로 관련된 카드를 고르라는 요청을 받았다.", "ana": "<b>were shown an image</b>는 show A B(A에게 B를 보여 주다)의 <b>수동태</b>라서 목적어(an image)가 그대로 남아 있습니다. 이걸 '환자들이 이미지를 보여 주었다'로 읽으면 완전히 뒤집힙니다. <b>such that</b>은 '~하도록, 그 결과 ~하게'라는 결과·목적 표현이고, and 뒤 <b>asked</b> 앞에는 <b>were가 생략</b>돼 있어 were shown과 <b>수동태 병렬</b>을 이룹니다.", "pe": "\u0001In the study\u0002, / \u0001split-brain<sup>1</sup>\u0002 patients were shown an image / \u0001such that<sup>2</sup> it was visible<sup>3</sup> to only their left eye\u0002 / and asked to select<sup>4</sup> a \u0001related<sup>5</sup>\u0002 card \u0001with their left hand\u0002.", "pk": "\u0001그 연구에서\u0002 / \u0001분리뇌\u0002 환자들은 이미지를 제시받았다 / \u0001그것이 그들의 왼쪽 눈에만 보이도록\u0002 / 그리고 \u0001왼손으로\u0002 \u0001관련된\u0002 카드를 고르라는 요청을 받았다", "core": "환자들은 이미지를 제시받고 카드를 고르라는 요청을 받았다.", "tags": ["In the study = 전치사구(부사구): 문장 전체를 꾸밈", "주어 patients + 수동태 were shown + an image (4형식 수동). split-brain = 형용사: patients를 꾸밈", "such that ~ = 접속사절(부사절, 결과·정도): were shown을 꾸밈", "and [were] asked to select = 수동태 병렬(were 생략). related = 형용사: card를 꾸밈. with their left hand = 전치사구(부사구): select를 꾸밈"], "steps": [{"t": "이 문장은 <b>4형식 수동태 두 개가 and로 병렬된</b> 문장이다. such that절이 중간에 끼어 길어 보인다."}, {"t": "첫 수동태의 뼈대부터 찾는다.", "sub": ["S: split-brain patients (분리뇌 환자들). split-brain 분리뇌의", "V: were shown (show 보여 주다의 수동태)", "O: an image (이미지). show A B(4형식)의 수동태라 직접목적어 an image가 남는다. 남은 목적어는 동사가 요구하는 자리라서 뼈대에 둔다 (문형 기준)", "뼈대 = <b>patients were shown an image</b>"]}, {"t": "<b>such that it was visible to only their left eye</b>는 '~하도록'이라는 결과·정도의 부사절이다.", "sub": ["S: it (= an image, 이미지)", "V: was (be), C: visible (보이는)", "to only their left eye (오직 왼쪽 눈에만)"]}, {"t": "<b>and asked to select a related card with their left hand</b>는 were가 생략된 두 번째 수동태다. 'were shown'과 '(were) asked'가 병렬이다.", "sub": ["ask A to V의 수동 = A가 V하도록 요청받다", "select 고르다, related 관련된, with their left hand (왼손으로)"]}, {"t": "<b>In the study</b> (그 연구에서)는 문장 전체를 꾸미는 전치사구다."}], "sum": "분리뇌 환자들, 이미지를 왼쪽 눈에만 보이게 제시받고 왼손으로 관련 카드를 고르도록 요청받음"}, {"i": "08", "q": "11", "s": "A-4", "title": "수동태 S+V(1형식) + 분사구문(결과) 안의 명사절", "eng": "In a split-brain patient, / the connection<sup>1</sup> between the right and left hemispheres<sup>2</sup> has been broken<sup>3</sup>, / meaning no information can cross<sup>4</sup> / from one hemisphere to the other.", "notes": [["1", "connection", "연결"], ["2", "hemisphere", "(뇌) 반구"], ["3", "break", "끊다, 부수다"], ["4", "cross from A to B", "A에서 B로 건너가다"]], "lit": "분리뇌 환자에게서는 / 좌우 반구 사이의 연결이 끊어져 있다 / 그것은 어떤 정보도 건너갈 수 없다는 뜻이다 / 한쪽 반구에서 다른 쪽 반구로", "nat": "분리뇌 환자에게는 좌우 반구를 잇는 연결이 끊어져 있어서, 어떤 정보도 한쪽 반구에서 다른 쪽으로 건너갈 수 없다.", "ana": "주어의 핵은 <b>the connection</b>이고 between ~ hemispheres는 전부 수식어라 동사는 <b>단수 취급(has been broken)</b>입니다. 콤마 뒤 <b>meaning</b>은 <b>결과의 분사구문</b>으로, '즉 ~라는 뜻이다'로 이어 읽으세요 — 앞 문장 전체를 받습니다. 그 뒤에는 <b>접속사 that이 생략</b>된 명사절이 옵니다. <b>the other</b>는 둘 중 나머지 하나이므로 반구가 <b>두 개</b>라는 것과 짝이 맞습니다.", "pe": "\u0001In a split-brain patient\u0002, / the connection<sup>1</sup> \u0001between the right and left hemispheres<sup>2</sup>\u0002 has been broken<sup>3</sup>, / \u0001meaning no information can cross<sup>4</sup>\u0002 / \u0001from one hemisphere to the other\u0002.", "pk": "\u0001분리뇌 환자에게서는\u0002 / \u0001좌우 반구 사이의\u0002 연결이 끊어져 있다 / \u0001그것은 어떤 정보도 건너갈 수 없다는 뜻이다\u0002 / \u0001한쪽 반구에서 다른 쪽 반구로\u0002", "core": "연결이 끊어져 있다.", "tags": ["In a split-brain patient = 전치사구(부사구): has been broken을 꾸밈", "주어 connection + has been broken (현재완료 수동). between ~ = 전치사구(형용사구): connection을 꾸밈", "meaning ~ = 분사구문(부사적: 결과): 앞 절을 꾸밈. no information can cross는 meaning의 목적어절", "from one hemisphere to the other = 전치사구(부사구): cross를 꾸밈, 분사구문 안"], "steps": [{"t": "이 문장은 <b>수동태 S+V(1형식)</b> 뒤에 분사구문이 붙은 문장이다. 분사구문 안에 절이 들어 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the connection (연결). between the right and left hemispheres (좌우 반구 사이의)는 connection을 꾸미는 전치사구", "V: has been broken (break 끊다의 p.p. broken, 현재완료 수동태). (문형 기준) 수동태 주절 = 1형식", "뼈대 = <b>the connection has been broken</b>", "hemisphere (뇌의 반구)"]}, {"t": "<b>In a split-brain patient</b> (분리뇌 환자에게서)는 문장 전체를 꾸미는 전치사구다."}, {"t": "<b>meaning no information can cross ~</b>는 동사가 아니라 <b>분사구문(결과)</b>이다 (= which means). '그것은 ~라는 뜻이다'로 읽는다.", "sub": ["mean (뜻하다)의 -ing형", "O: no information can cross ... (어떤 정보도 건너갈 수 없다는 것). 접속사 that이 생략된 명사절"]}, {"t": "mean의 목적어절 안의 뼈대를 찾는다.", "sub": ["S: no information (어떤 정보도)", "V: can cross (cross 건너가다)", "from one hemisphere to the other (한쪽 반구에서 다른 쪽으로) = 전치사구"]}], "sum": "분리뇌 환자는 좌우 반구 연결이 끊겨 정보가 한쪽에서 다른 쪽으로 건너갈 수 없음"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2016년 3월 31번", "ans": "①", "tr": [["1", "자신에게 긍정적으로 말을 걸고 나서 이미 되고 싶은 사람이 된 것처럼 행동함으로써, 당신은 실제로 자기 자신의 응원단장이 될 수 있다."], ["2", "긍정적이고 쾌활하고 행복하고 호감 가는 사람 역할의 오디션을 보고 있는 것처럼 행동하라."], ["3", "이미 그런 사람인 것처럼 걷고, 말하고, 행동하라."], ["4", "만나는 모든 사람을, 마치 당신이 업계 최고의 인물로 방금 상을 받은 것처럼, 또는 방금 복권에 당첨된 것처럼 대하라."], ["5", "단 몇 분간 ~인 척한 뒤에 자신에 대한 기분이 얼마나 좋아지는지 알면 깜짝 놀랄 것이다."]], "evh": "2 · 3번 문장", "ev": [{"en": true, "h": "Act as though you were trying out for the role of a positive, cheerful, happy, and likable person. / Walk, talk, and act as if you were already that person."}, {"en": false, "h": "빈칸이 <b>맨 마지막 문장</b>에 있으면 앞 문장들을 <b>한 단어로 요약</b>하는 자리입니다. 1~4번이 전부 <b>as if / as though + 가정법</b>, 즉 '실제로는 아직 아닌데 그런 것처럼 행동하라'는 말입니다. 이것을 한 단어로 바꾸면 <b>pretending(~인 척하기)</b>입니다. 빈칸 유형은 <b>새로운 단어를 찾는 것이 아니라 반복된 말을 압축하는 것</b>임을 기억하세요."}], "opts": [{"n": "①", "t": "pretending (~인 척하기)", "a": true, "x": false, "trap": false, "e": "as if / as though가 네 번 반복된 것을 한 단어로 줄이면 이것입니다."}, {"n": "②", "t": "competing (경쟁하기)", "a": false, "x": true, "trap": true, "e": "the very best person in your industry라는 표현 때문에 걸리지만, 남과 <b>겨루라</b>는 말은 없습니다. 이미 최고인 <b>척하라</b>는 말입니다."}, {"n": "③", "t": "purchasing (구입하기)", "a": false, "x": true, "trap": false, "e": "물건을 사는 이야기가 전혀 없습니다. lottery(복권)에서 연상만 되는 함정입니다."}, {"n": "④", "t": "complaining (불평하기)", "a": false, "x": true, "trap": false, "e": "글 전체가 <b>긍정적으로</b> 말하고 행동하라는 내용이라 정반대입니다."}, {"n": "⑤", "t": "apologizing (사과하기)", "a": false, "x": true, "trap": false, "e": "사과에 대한 언급이 한 줄도 없습니다."}], "w": [["cheerleader", "응원단장"], ["talk to oneself", "자신에게 말을 걸다"], ["act as if", "마치 ~인 것처럼 행동하다"], ["try out for", "~의 오디션을 보다"], ["likable", "호감 가는"], ["treat", "대하다, 대우하다"], ["award", "상"], ["industry", "업계, 분야"], ["lottery", "복권"], ["be amazed at", "~에 깜짝 놀라다"]]}, {"q": "08", "type": "밑줄 의미", "src": "2020년 6월 21번", "ans": "⑤", "tr": [["1", "여러 세기에 걸쳐 다양한 작가와 사상가들은 인간을 바깥에서 바라보며 사회생활의 연극적 성격에 깊은 인상을 받아 왔다."], ["2", "이를 표현한 가장 유명한 인용문은 셰익스피어에게서 나온다. \"온 세상은 무대이고 / 모든 남녀는 그저 배우일 뿐이다 / 그들은 각자 퇴장과 등장이 있고 / 한 사람이 평생 여러 배역을 연기한다.\""], ["3", "극장과 배우가 전통적으로 가면의 이미지로 표현되어 왔다면, 셰익스피어 같은 작가들이 말하려는 바는 우리 모두가 끊임없이 가면을 쓰고 있다는 것이다."], ["4", "어떤 사람은 남들보다 더 나은 배우다."], ["5", "희곡 '오셀로'에 나오는 이아고 같은 악한 인물들은 우호적인 미소 뒤에 적대적인 의도를 숨길 수 있다."], ["6", "또 어떤 사람들은 더 큰 자신감과 허세를 갖고 연기할 수 있는데, 그들은 흔히 지도자가 된다."], ["7", "뛰어난 연기력을 가진 사람은 복잡한 사회적 환경을 더 잘 헤쳐 나가고 앞서 나간다."]], "evh": "2 · 7번 문장", "ev": [{"en": true, "h": "one man in his time plays many parts / People with excellent acting skills can better navigate our complex social environments and get ahead."}, {"en": false, "h": "밑줄 의미 문제는 <b>밑줄 뒤에 나오는 예시</b>가 답을 정해 줍니다. 5번의 이아고는 <b>적의를 미소 뒤에 감추고</b>, 6번의 사람들은 <b>자신감 있는 모습을 연기</b>합니다. 둘 다 상황에 맞춰 <b>겉으로 보이는 자기를 바꾸는</b> 행동이에요. 게다가 2번 인용문의 <b>plays many parts</b>는 상황마다 다른 배역을 맡는다는 뜻입니다. 즉 가면 = <b>사회적 상황에 맞춘 행동 조절</b>입니다."}], "opts": [{"n": "①", "t": "protecting our faces from harmful external forces (해로운 외부의 힘으로부터 얼굴을 보호하기)", "a": false, "x": true, "trap": false, "e": "mask를 <b>글자 그대로</b> 읽은 함정입니다. 이 글의 가면은 비유이지 실제 보호 장비가 아닙니다."}, {"n": "②", "t": "performing on stage to show off our acting skills (연기력을 뽐내기 위해 무대에서 공연하기)", "a": false, "x": true, "trap": true, "e": "stage, actors, acting skills가 다 나와서 가장 그럴듯합니다. 그러나 진짜 무대에 서라는 것이 아니라 <b>사회생활이 무대 같다</b>는 비유입니다."}, {"n": "③", "t": "feeling confident by beating others in competition (경쟁에서 남을 이겨 자신감을 느끼기)", "a": false, "x": true, "trap": false, "e": "confidence라는 단어는 나오지만 <b>경쟁에서 이긴다</b>는 내용은 없습니다."}, {"n": "④", "t": "doing completely the opposite of what others expect (남들이 기대하는 것과 완전히 반대로 행동하기)", "a": false, "x": true, "trap": false, "e": "반대로 행동하라는 것이 아니라 <b>상황에 맞게</b> 행동한다는 것입니다."}, {"n": "⑤", "t": "adjusting our behavior based on the social context given (주어진 사회적 맥락에 맞춰 행동을 조절하기)", "a": true, "x": false, "trap": false, "e": "이아고의 위장, 자신감의 연기, plays many parts가 모두 이 한 줄로 모입니다."}], "w": [["be struck by", "~에 깊은 인상을 받다"], ["theatrical quality", "연극적 성격"], ["merely", "그저, 단지"], ["play many parts", "여러 배역을 연기하다"], ["imply", "암시하다"], ["constantly", "끊임없이"], ["conceal", "숨기다"], ["hostile intention", "적대적인 의도"], ["navigate", "헤쳐 나가다"], ["get ahead", "앞서 나가다"]]}, {"q": "09", "type": "요약문 완성", "src": "2022년 3월 40번", "ans": "①", "tr": [["1", "거리는 두 사람 사이의 관계를 알려 주는 믿을 만한 지표다."], ["2", "낯선 사람끼리는 아는 사이보다 더 떨어져 서고, 아는 사이는 친구보다, 친구는 연인보다 더 떨어져 선다."], ["3", "물론 이런 규칙이 깨질 때도 있다."], ["4", "생판 모르는 사람들로 가득 찬 엘리베이터를 타고 20층을 올라갔던 마지막 때를 떠올려 보라."], ["5", "정어리 통조림 같은 그 경험은 분명 상황을 조금 불편하게 만들었을 것이다."], ["6", "물리적 공간을 침해당한 채, 당신은 눈맞춤을 피하고 대신 엘리베이터 버튼에 시선을 두면서 \"심리적\" 공간을 만들어 내려 했을 것이다."], ["7", "한 비언어적 통로(눈맞춤)에서 가까움을 줄임으로써, 사람은 다른 통로(근접성)에서 원치 않게 가까워진 것을 보완할 수 있다."], ["8", "마찬가지로 큰 탁자에서 몇 걸음 떨어져 앉은 사람과 이야기할 때는 계속 눈을 맞추기 쉬운데, 이는 서로 바로 옆에 서 있다면 오히려 불편하게 느낄 만한 행동이다."], ["9", "[요약문] 사람 사이의 물리적 거리는 관계의 성격에 따라 (A) 결정되지만, 그 거리가 적절하지 않을 때 사람들은 편안한 심리적 거리를 만들기 위해 비언어적 소통을 (B) 조절한다."]], "evh": "1 · 7번 문장", "ev": [{"en": true, "h": "Distance is a reliable indicator of the relationship between two people. / By reducing closeness in one nonverbal channel (eye contact), one can compensate for unwanted closeness in another channel (proximity)."}, {"en": false, "h": "요약문은 <b>(A)와 (B)를 각각 다른 문장에서</b> 찾습니다. (A)는 1·2번 — 거리가 관계에 따라 <b>정해진다</b>(indicator, 낯선 사람 &gt; 지인 &gt; 친구 &gt; 연인)는 대목이니 <b>determined</b>. (B)는 6·7번 — 엘리베이터에서 눈맞춤을 피하고, 멀리 앉으면 오히려 눈을 더 맞춘다는 <b>맞춰 가는 행동</b>이니 <b>adjust</b>입니다. 두 칸 중 <b>확실한 한 칸을 먼저 확정</b>하고 선택지를 지우는 것이 요약문 문제의 정석입니다."}], "opts": [{"n": "①", "t": "determined … adjust (결정되는 … 조절한다)", "a": true, "x": false, "trap": false, "e": "1번의 reliable indicator = (A) determined, 6·7번의 보완 행동 = (B) adjust."}, {"n": "②", "t": "concealed … interpret (숨겨지는 … 해석한다)", "a": false, "x": true, "trap": false, "e": "거리는 <b>드러나는</b> 지표이지 숨겨지는 것이 아닙니다. (B)도 해석이 아니라 행동의 변경입니다."}, {"n": "③", "t": "influenced … ignore (영향받는 … 무시한다)", "a": false, "x": true, "trap": true, "e": "(A) influenced는 통할 듯하지만 (B)가 결정적으로 틀립니다. 사람들은 비언어적 소통을 <b>무시하는</b> 것이 아니라 오히려 <b>적극적으로 바꿔</b> 씁니다."}, {"n": "④", "t": "predicted … stop (예측되는 … 멈춘다)", "a": false, "x": true, "trap": false, "e": "거리를 미리 <b>예측</b>한다는 이야기가 아니고, 소통을 <b>멈추는</b> 것도 아닙니다."}, {"n": "⑤", "t": "measured … decrease (측정되는 … 줄인다)", "a": false, "x": true, "trap": false, "e": "거리를 재는 실험이 아니며, 눈맞춤은 상황에 따라 줄기도 하고 <b>늘기도</b> 합니다(8번). decrease로 묶을 수 없습니다."}], "w": [["reliable", "믿을 만한"], ["indicator", "지표"], ["acquaintance", "아는 사이, 지인"], ["violate", "침해하다, ibute to", "~의 원인이 되다"], ["insufficient", "불충분한"], ["carbon dioxide emission", "이산화탄소 배출"], ["traffic congestion", "교통 혼잡"], ["sustainable", "지속 가능한"], ["car-oriented", "자동차 중심의"], ["vast majority", "대다수"], ["proportion", "비율"], ["motorization rate", "자동차 보유율"]]}, {"q": "11", "type": "글의 제목 (장문)", "src": "2022년 11월 41번", "ans": "③", "tr": [["1", "신경심리학자 Michael Gazzaniga는 우리 뇌가 우리를 속이는, 일관성 있는(그러나 반드시 참은 아닌) 이야기를 만들어 내는 데 뛰어나다는 것을 보여 주는 연구를 수행했다."], ["2", "그 연구에서 분리뇌 환자들은 왼쪽 눈에만 보이도록 이미지를 제시받은 뒤, 왼손으로 관련된 카드를 고르라는 요청을 받았다."], ["3", "왼쪽 눈의 시각과 왼쪽 신체의 움직임은 우반구가 통제한다."], ["4", "분리뇌 환자에게는 좌우 반구를 잇는 연결이 끊어져 있어서, 어떤 정보도 한쪽 반구에서 다른 쪽으로 건너갈 수 없다."], ["5", "따라서 이 실험에서 모든 일은 우반구가 했고, 좌반구는 무슨 일이 벌어지는지 알지 못했다."], ["6", "그런 다음 Gazzaniga는 참가자들에게 왜 그 카드를 골랐는지 물었다."], ["7", "언어는 좌반구에서 처리되고 만들어지므로, 대답은 좌반구가 해야 한다."], ["8", "그러나 실험 설계상 그 참가자가 왜 그 카드를 골랐는지는 오직 우반구만 알고 있었다."], ["9", "그래서 Gazzaniga는 참가자들이 질문을 받으면 아무 말도 하지 못할 것이라고 예상했다."], ["10", "그런데 오히려 모든 피험자가 대답을 지어냈다."], ["11", "좌반구는 우반구가 한 행동에 대해 그럴듯한 이유를 대라는 요구를 받고 있었던 셈이다."], ["12", "좌반구는 답을 몰랐다."], ["13", "그러나 그렇다고 답을 지어내지 못한 것은 아니었다."], ["14", "다만 그 답은 현실에 아무 근거가 없었다."], ["15", "만약 이 연구가 분리뇌 환자에게만 해당하는 것이었다면, 흥미롭기는 해도 우리에게 그다지 관련 있는 이야기는 아닐 것이다."], ["16", "그런데 이유를 지어내는 사람이 분리뇌 환자만은 아닌 것으로 드러난다."], ["17", "우리 모두 그렇게 한다."], ["18", "우리는 모두 자신에 대한 일관성 있는 이야기가 필요하고, 그 이야기에서 정보가 빠져 있으면 우리 뇌는 그냥 세부 사항을 채워 넣는다."]], "evh": "1 · 16 · 18번 문장", "ev": [{"en": true, "h": "our brains excel at creating coherent (but not necessarily true) stories that deceive us / It turns out split-brain patients aren't the only ones who fabricate reasons. / our brains simply fill in the details"}, {"en": false, "h": "장문의 제목은 <b>첫 문장과 마지막 문장</b>을 이어 붙이면 거의 완성됩니다. 1번이 <b>뇌는 우리를 속이는 이야기를 잘 지어낸다</b>로 결론을 미리 말하고, 16~18번이 <b>그건 환자만이 아니라 우리 모두</b>라고 확장합니다. 그 사이에 있는 것이 <b>분리뇌 환자 실험</b>이에요. 즉 '속이는 뇌' + '분리뇌 연구'가 둘 다 들어간 제목이어야 합니다."}], "opts": [{"n": "①", "t": "Which Side of the Brain Do We Tend to Use More? (우리는 뇌의 어느 쪽을 더 많이 쓰는가?)", "a": false, "x": true, "trap": fal function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
