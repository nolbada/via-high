<title>고2 미니모의고사 21회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}

.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}

.th ol{list-style:none;margin:0;padding:0;counter-reset:n}

.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}

/* ---- 새 직독직해·해설 화면 ---- */

details.sub2{margin:12px 0 0}

(function(W){

  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);

    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){

    var d=document.createElement('div');

    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';

    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');

      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){

  },del:DEL,gate:gate,flush:flush,name:name};
  flush();

잡는다<\/b>"}, {"e": "to play a huge response", "k": "엄청난 반응을 연기할"}, {"e": "to some big news.", "k": "어떤 놀라운 소식에 대한."}], "easy": "배우들은 어떤 큰 소식을 들은 장면에서 아주 크게 반응하는 연기를 할 기회를 반겨요.", "gist": "글의 시작. 배우들이 큰 소식에 엄청난 반응을 연기하는 모습을 말한다."}, {"n": 2, "ch": [{"e": "One character says to another,", "k": "한 인물이 다른 인물에게 말한다,"}, {"e": "“You just won a million dollars!”", "k": "“당신은 방금 백만 달러를 땄어요!”"}], "easy": "한 인물이 다른 인물에게 “방금 백만 달러에 당첨됐어요!” 하고 말해요.", "gist": "배우의 연기 예시. 큰 소식을 전하는 장면이다."}, {"n": 3, "ch": [{"e": "And the actor <b>immediately<\/b>", "k": "그리고 그 배우는 <b>즉시<\/b>"}, {"e": "jumps up and down", "k": "펄쩍펄쩍 뛰며"}, {"e": "and yells about winning a million dollars.", "k": "백만 달러를 얻은 것에 대해서 소리를 지른다."}], "easy": "그러면 그 배우는 곧바로 펄쩍펄쩍 뛰면서 백만 달러에 당첨됐다고 소리쳐요.", "gist": "배우는 소식을 듣자마자 바로 반응한다."}, {"n": 4, "ch": [{"e": "But what would a person do?", "k": "그러나 (실제) 사람은 어떻게 행동할까?"}], "easy": "그런데 진짜 사람이라면 어떻게 할까요?", "gist": "질문으로 방향을 바꾼다. 배우의 연기와 실제 사람의 반응을 대비시킨다."}, {"n": 5, "ch": [{"e": "Stanislavski,", "k": "Stanislavski(스타니슬라프스키)는,"}, {"e": "a famous Russian theater director,", "k": "유명한 러시아의 연극 연출가인,"}, {"e": "spoke of <b>reflective delay<\/b>.", "k": "<b>성찰적 지연<\/b>에 대해서 말했다.<span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}], "easy": "러시아의 유명한 연극 연출가 Stanislavski는 ‘성찰적 지연’에 대해 말했어요.", "gist": "빈칸 문장. 바로 뒤에 이어지는 문장이 그 내용을 풀어 준다."}, {"n": 6, "ch": [{"e": "It often takes time", "k": "종종 시간이 걸린다"}, {"e": "for a person to <b>process information<\/b>", "k": "인간이 <b>정보를 처리하는<\/b> 데에는"}, {"e": "— whether it’s very good or very bad.", "k": "— 그것<span class=\"r\">(= 정보)<\/span>이 매우 좋든 아주 나쁘든 간에."}], "easy": "사람은 정보를 받아들이고 처리하는 데 시간이 걸려요. 그 소식이 아주 좋은 것이든 아주 나쁜 것이든 마찬가지예요.", "gist": "빈칸의 뜻을 풀어 주는 핵심 문장. 정보를 처리하는 데는 종종 시간이 걸린다."}, {"n": 7, "ch": [{"e": "Think back to a time in your life", "k": "당신의 삶에서 어떤 때를 회상해 보라"}, {"e": "when some big news was delivered.", "k": "어떤 놀라운 소식이 전해졌던."}], "easy": "살면서 큰 소식을 전해 들었던 때를 떠올려 보세요.", "gist": "독자에게 직접 말을 건네며 자기 경험을 떠올리게 한다."}, {"n": 8, "ch": [{"e": "What did you do?", "k": "당신은 무엇을 했는가?"}], "easy": "그때 무엇을 했나요?", "gist": "경험을 되짚게 하는 질문."}, {"n": 9, "ch": [{"e": "Did you <b>immediately<\/b> jump up and down,", "k": "당신은 <b>즉시<\/b> 펄쩍펄쩍 뛰고,"}, {"e": "scream with joy or pain?", "k": "기쁨으로 혹은 고통으로 소리를 질렀는가?"}], "easy": "바로 펄쩍 뛰고, 기쁘거나 아파서 소리를 질렀나요?", "gist": "배우처럼 바로 반응하는 경우인지 묻는다."}, {"n": 10, "ch": [{"e": "Or did you just <b>sit down<\/b> for a moment,", "k": "아니면 당신은 단지 잠시 <b>앉아 있었는가<\/b>,"}, {"e": "saying nothing?", "k": "아무 말도 없이?"}], "easy": "아니면 아무 말 없이 그냥 잠깐 앉아 있었나요?", "gist": "곧바로 반응하지 않고 시간을 두는 경우인지 묻는다."}, {"n": 11, "ch": [{"e": "How long did it take", "k": "얼마나 시간이 걸렸는가"}, {"e": "to really understand", "k": "정말로 이해하는 데"}, {"e": "that you won that award", "k": "당신이 그 상금을 받았다는 것을"}, {"e": "before you responded?", "k": "당신이 반응하기 전에?"}], "easy": "반응하기 전에, 내가 상금을 받았다는 걸 진짜로 이해하는 데 시간이 얼마나 걸렸나요?", "gist": "소식을 이해하기까지 걸린 시간을 묻는다."}, {"n": 12, "ch": [{"e": "Be a person.", "k": "실제 사람처럼 되어라."}], "easy": "배우처럼 말고, 실제 사람처럼 행동하세요.", "gist": "결론 조언. 배우의 연기가 아니라 실제 사람처럼 하라고 말한다."}, {"n": 13, "ch": [{"e": "Don’t just go for <b>emotion<\/b>", "k": "바로 <b>감정<\/b>으로 달려들지 말라"}, {"e": "or the <b>obvious response<\/b>.", "k": "혹은 <b>뻔한 반응<\/b>으로."}], "easy": "감정이나 뻔한 반응에 곧바로 뛰어들지 마세요.", "gist": "마무리 조언. 감정이나 뻔한 반응으로 바로 가지 말라는 당부다."}]}, {"no": "08", "typ": "빈칸 추론", "src": "2022학년도 수능 33번", "evn": [4, 5, 6], "ev_en": "This is a significant insight, as it shows that prospects are poor for a centrally directed solution to the problem of the commons coming from a state power in comparison with a local solution for which users assume personal responsibility. / Ostrom also emphasizes the importance of democratic decision processes and that all users must be given access to local forums for solving problems and conflicts among themselves. / Political institutions at central, regional, and local levels must allow users to devise their own regulations and independently ensure observance.", "ev_ko": [[4, "이것은 중요한 통찰인데, 이용자가 개인적 책임을 지는 지역적인 해결책에 비해 국가 권력에서 나오는 공유지 문제에 대한 중앙 (정부) 통제적인 해결책의 전망이 열악하다는 것을 그것(통찰)이 보여 주기 때문이다."], [5, "Ostrom은 또한 민주적 의사 결정 과정의 중요성과, 모든 이용자에게 그들 자신 사이의 문제와 갈등을 해결하기 위한 지역 포럼에 대한 이용 권한이 주어져야 한다는 것을 강조한다."], [6, "중앙, 지방 및 지역 차원의 정치 기관들은 이용자가 그들의 자체 규정을 고안하고, (규정의) 준수를 독립적으로 보장하도록 허용해야 한다."]], "why": ["빈칸에는 <b>규칙의 영향을 받는 행위자들이 가져야 할 권리<\/b>가 들어갑니다", "바로 뒤 문장 4는 국가 권력의 중앙 통제보다 <b>이용자가 개인적 책임을 지는 지역적 해결책<\/b>이 낫다고 합니다", "문장 5는 <b>민주적 의사 결정 과정<\/b>의 중요성을 강조합니다", "문장 6은 이용자가 <b>자체 규정을 고안<\/b>하도록 허용해야 한다고 합니다", "모두 이용자가 규칙을 정하는 일에 참여한다는 내용이므로 <b>규칙을 변경하는 결정에 참여할<\/b> 권리가 알맞습니다."], "ch": [{"n": "①", "t": "participate in decisions to change the rules", "g": "규칙을 변경하는 결정에 참여할", "ok": true, "e": ["문장 4의 이용자가 책임지는 지역적 해결책, 문장 5의 <b>democratic decision processes<\/b>(민주적 의사 결정 과정), 문장 6의 <b>devise their own regulations<\/b>(자체 규정 고안)가 모두 규칙 결정에 참여한다는 뜻입니다."]}, {"n": "②", "t": "claim individual ownership of the resources", "g": "자원에 대한 개인의 소유권을 주장할", "ok": false, "e": ["문장 4에서 중앙 통제 대신 이용자가 <b>개인적 책임<\/b>을 지는 해결책이 낫다고 하고, 이어서 개인의 결정과 권한을 중요하게 말하므로 <b>individual(개인)<\/b>이라는 키워드 때문에 헷갈리기 쉽습니다", "하지만 자원에 대한 개인의 <b>소유권<\/b>은 지문에서 언급하지 않습니다."]}, {"n": "③", "t": "use those resources to maximize their profits", "g": "자신의 이익을 최대화하기 위해 그 자원을 이용할", "ok": false, "e": ["자원을 이용해 <b>이익을 극대화<\/b>한다는 내용은 지문에 나오지 않습니다."]}, {"n": "④", "t": "demand free access to the communal resources", "g": "공동 자원에 대한 자유로운 이용 권한을 요구할", "ok": false, "e": ["문장 5의 <b>access<\/b>는 자원을 공짜로 쓴다는 뜻이 아니라 <b>지역 포럼(local forums)에 대한 이용 권한<\/b>입니다."]}, {"n": "⑤", "t": "request proper distribution based on their merits", "g": "자신의 공로를 바탕으로 적당한 분배를 요청할", "ok": false, "e": ["<b>공로에 따른 분배<\/b>에 관한 내용은 지문에 나오지 않습니다."]}], "tr": ["Elinor Ostrom은 공유지의 문제에 대한 안정적인 제도적 해결책을 가져오는 데 매우 중요한 몇 가지 요인들이 있다는 것을 알게 되었다.", "예를 들어, 그녀는 자원의 이용 및 관리 규칙의 영향을 받는 행위자들은 규칙을 변경하는 결정에 참여할 권리를 가져야 한다고 지적했다.", "그러한 이유로, 이용자의 행동을 감시하고 통제하는 사람들 또한 이용자여야 하고/하거나 모든 이용자에 의해 위임을 받았어야 한다.", "이것은 중요한 통찰인데, 이용자가 개인적 책임을 지는 지역적인 해결책에 비해 국가 권력에서 나오는 공유지 문제에 대한 중앙 (정부) 통제적인 해결책의 전망이 lly directed<\/b> solution", "k": "<b>중앙 (정부) 통제적인<\/b> 해결책의"}, {"e": "to the problem of the commons", "k": "공유지 문제에 대한"}, {"e": "coming from a state power", "k": "국가 권력에서 나오는"}, {"e": "in comparison with a local solution", "k": "지역적인 해결책에 비해"}, {"e": "for which users assume personal responsibility.", "k": "이용자가 개인적 책임을 지는."}], "easy": "이건 중요한 통찰이에요. 국가가 위에서 내려 주는 해결책은, 사용자들이 스스로 책임지는 지역 해결책보다 공유지 문제에서 전망이 어둡다는 걸 보여 주거든요.", "gist": "이 통찰이 왜 중요한지 설명. 중앙 통제식 해결책보다 이용자가 책임지는 지역 해결책이 낫다는 뜻이다."}, {"n": 5, "ch": [{"e": "Ostrom <b>also emphasizes<\/b>", "k": "Ostrom은 또한 강조한다"}, {"e": "the importance of democratic decision processes", "k": "민주적 의사 결정 과정의 중요성과"}, {"e": "and that all users must be given <b>access<\/b>", "k": "그리고 모든 이용자에게 <b>이용 권한<\/b>이 주어져야 한다는 것을"}, {"e": "to local forums", "k": "지역 포럼에 대한"}, {"e": "for solving problems and conflicts", "k": "문제와 갈등을 해결하기 위한"}, {"e": "among themselves.", "k": "그들 자신 사이의."}], "easy": "Ostrom은 민주적으로 결정하는 과정이 중요하다고 했어요. 또 모든 사용자가 자기들끼리의 문제와 갈등을 풀 지역 모임을 이용할 수 있어야 한다고도 했어요.", "gist": "Ostrom의 주장에 민주적 의사 결정과 지역 포럼 이용 권한이 더해진다."}, {"n": 6, "ch": [{"e": "<b>Political institutions<\/b> at central, regional, and local levels", "k": "중앙, 지방 및 지역 차원의 <b>정치 기관들<\/b>은"}, {"e": "must allow users", "k": "이용자가 ~하도록 허용해야 한다"}, {"e": "to <b>devise<\/b> their own regulations", "k": "그들의 자체 규정을 <b>고안하고<\/b>"}, {"e": "and independently ensure observance.", "k": "(규정의) 준수를 독립적으로 보장하도록."}], "easy": "각 단계의 정치 기관은 사용자들이 직접 규칙을 만들고, 그 규칙을 지키게 하는 일도 독립적으로 할 수 있게 해 줘야 해요.", "gist": "마무리. 사용자가 직접 규정을 만들고 지키게 하는 것이 제도의 몫이라고 정리한다.", "link": "중앙, 지방 및 지역 차원의 정치 기관들은 이용자가 그들의 자체 규정을 고안하고, 규정의 준수를 독립적으로 보장하도록 허용해야 한다."}]}, {"no": "09", "typ": "요약문 완성", "src": "2018년 6월 40번", "evn": [4, 5, 6], "ev_en": "His wife reluctantly accepted and he quickly noticed that the hotter she was, the faster she counted. / When her temperature was 38 degrees Celsius, for instance, she counted to 60 in 45 seconds. / He repeated the experiment a few more times, and found that wh }, {"e": "and have the <b>appearance<\/b> of jamming,", "k": "그리고 즉흥 연주의 모습을 가졌을지도 모르지만,"}, {"e": "but in the end they know nothing.", "k": "결국 그들은 아무것도 모른다."}], "easy": "겉으로는 재즈 뮤지션처럼 보이고 즉흥 연주를 하는 것 같지만, 결국 아는 게 없어요.", "gist": "겉모습과 실제의 대비. 겉은 그럴듯하지만 실제 지식은 없다."}, {"n": 12, "ch": [{"e": "They’re <b>playing intellectual air guitar<\/b>.", "k": "그들은 <b>지적인 기타 연주 흉내<\/b>를 내고 있다."}], "easy": "확실한 지식이 받쳐 주지 않은 채, 겉으로만 창의적인 것처럼 보이는 능력을 뽐내고 있다는 뜻이에요.", "gist": "밑줄 문장. 기타 연주 흉내라는 비유로, 지식 없이 겉모습만 그럴듯하다는 뜻을 정리한다."}]}, {"no": "11", "typ": "장문 · 제목", "src": "2018년 9월 41번", "evn": [2, 10, 13], "ev_en": "More than half indicated that they were confident that their answers were correct — but in fact, only three percent of the people got more than half of the questions right. / If we believe something about the world, we are more likely to passively accept as truth any information that confirms our beliefs, and actively dismiss information that doesn’t. / This makes us more confident in said beliefs, and even less likely to entertain facts that contradict them.", "ev_ko": [[2, "절반이 넘는 사람들(응답자들)이 그들의 답이 정확하다는 것을 확신했다고 말했지만, 사실은 오직 그 사람들의 3퍼센트만이 질문의 절반 이상을 정확하게 맞혔다."], [10, "만약 우리가 세상에 대해 무언가를 믿는다면, 우리는 우리의 믿음을 확인해 주는 어떠한 정보라도 (그것을) 사실로서 더 소극적으로 받아들이고, 그렇지 않은 정보는 더 적극적으로 무시하는 경향이 있다."], [13, "이것은 우리가 앞서 언급된 믿음에 더 확신을 갖게 만들고, 심지어 그것들에 모순되는 사실들은 마음에 덜 품는 경향이 있게 만든다."]], "why": ["제목은 글 전체의 핵심을 담아야 합니다", "문장 2에서 사람들은 자기 답이 맞다고 <b>확신<\/b>하지만 실제로 많이 맞힌 사람은 3퍼센트뿐입니다", "문장 10에서는 믿음을 확인해 주는 정보는 받아들이고 그렇지 않은 정보는 <b>무시<\/b>한다고 합니다", "문장 13에서는 믿음에 더 확신을 갖고 <b>모순되는 사실<\/b>은 덜 받아들입니다", "즉 글 전체가 <b>믿음이 사실을 이긴다<\/b>는 이야기입니다."], "ch": [{"n": "①", "t": "Belief Wins Over Fact", "g": "믿음은 사실을 이긴다, 설득시킨다", "ok": true, "e": ["<b>belief(믿음)<\/b>가 <b>fact(사실)<\/b>를 이긴다는 글의 뼈대를 그대로 담고 있습니다."]}, {"n": "②", "t": "Still Judge by Appearance?", "g": "아직도 겉모습으로 판단하는가?", "ok": false, "e": ["<b>겉모습(외모)<\/b>으로 판단하는 이야기는 지문에 나오지 않습니다."]}, {"n": "③", "t": "All You Need Is Motivation", "g": "당신이 필요한 모든 것은 동기 부여이다", "ok": false, "e": ["지문의 motivated는 문장 11의 <b>motivated reasoning(의도적 합리화)<\/b>이라는 용어의 일부입니다", "동기 부여만 있으면 된다는 내용이 아닙니다."]}, {"n": "④", "t": "Facilitate Rational Reasoning", "g": "이성적인 합리화를 가능하게 해라", "ok": false, "e": ["합리적인 추론을 <b>가능하게 하는 방법<\/b>은 지문에 나오지 않습니다", "지문은 사람들이 믿음에 맞는 정보만 받아들이는 경향을 보여 줍니다."]}, {"n": "⑤", "t": "Correct Errors at the Right Time", "g": "맞는 순간에, 즉 적시에 오류를 고쳐라", "ok": false, "e": ["오류를 고치라는 <b>조언<\/b>이 아닙니다", "문장 5는 사람들이 사실적 믿음을 고치는 것에 <b>저항한다<\/b>는 관찰을 전합니다."]}], "tr": ["2000년에, Illinois(일리노이) 대학의 James Kuklinski(제임스 쿠클린스키)는 1,000명이 넘는 Illinois(일리노이)의 거주자들이 복지에 대한 질문을 받았던 영향력 있는 실험을 이끌었다.", "절반이 넘는 사람들(응답자들)이 그들의 답이 정확하다는 것을 확신했다고 말했지만, 사실은 오직 그 사람들의 3퍼센트만이 질문의 절반 이상을 정확하게 맞혔다.", "아마도 더 충격적인 것은, 그들이 정확했다고(정확하게 알고 있다고) ‘가장’ 확신했던 사람들이 대체로 그 주제에 대해 가장 적게 알았던 사람들이었다.", "Kuklinski는 이러한 종류의 응답을 ‘내가 맞다는 것을 나는 안다’는 증후군이라고 불렀다.", "“이것은 대부분의 사람들이 그들의 사실적 믿음을 고치는 것에 저항할 뿐만 아니라, 또한 그것들(자기가 믿고 있는 사실들)을 가장 고쳐야 할 필요가 있는 바로 그 사람들이 그렇게 할(고칠) 가능성이 가장 적다는 것을 나타낸다.”라고 그가 썼다.", "어떻게 우리는 그렇게 틀리고도 우리가 맞다고 그렇게 확신할 수 있을까?", "(정)답의 일부는 우리의 뇌가 고정된 방식에 있다.", "일반적으로, 사람들은 일관성을 추구하는 경향이 있다.", "사람들이 그들의 기존의 견해들을 강화하는 쪽으로(의) 시각을 가지고 정보를 해석하는 경향이 있다는 것을 보여주는 심리학적인 연구조사가 상당히 많다.", "만약 우리가 세상에 대해 무언가를 믿는다면, 우리는 우리의 믿음을 확인해 주는 어떠한 정보라도 (그것을) 사실로서 더 소극적으로 받아들이고, 그렇지 않은 정보는 더 적극적으로 무시하는 경향이 있다.", "이것은 ‘의도적 합리화’라고 알려져 있다.", "일관성이 있는 정보가 정확하든 아니든 간에, 우리는 그것을 우리의 믿음에 대한 확인으로서, 사실로 받아들일지도 모른다.", "이것은 우리가 앞서 언급된 믿음에 더 확신을 갖게 만들고, 심지어 그것들에 모순되는 사실들은 마음에 덜 품는 경향이 있게 만든다."], "ps": [{"n": 1, "ch": [{"e": "In 2000,", "k": "2000년에,"}, {"e": "James Kuklinski of the University of Illinois", "k": "Illinois 대학의 James Kuklinski는"}, {"e": "led an <b>influential<\/b> experiment", "k": "영향력 있는 실험을 이끌었다"}, {"e": "in which more than 1,000 Illinois residents", "k": "1,000명이 넘는 Illinois의 거주자들이"}, {"e": "were asked questions about welfare.", "k": "복지에 대한 질문을 받았던."}], "easy": "2000년에 Illinois 대학의 James Kuklinski가 영향력 있는 실험을 이끌었어요. 1,000명이 넘는 Illinois 주민에게 복지에 대한 질문을 했어요.", "gist": "실험 소개. 복지에 대한 질문을 주민들에게  대부분의 사람들이 그들의 사실적 믿음을 고치는 것에 저항할 뿐만 아니라, 그것들을 가장 고쳐야 할 필요가 있는 바로 그 사람들이 그렇게 할 가능성이 가장 적다는 것을 나타낸다.”라고 그가 썼다."}, {"n": 6, "ch": [{"e": "How can we have things so wrong", "k": "어떻게 우리는 그렇게 틀리고도"}, {"e": "and be so sure", "k": "그렇게 확신할 수 있을까"}, {"e": "that we’re right?", "k": "우리가 맞다고?"}], "easy": "어떻게 그렇게 틀리고도 자기가 옳다고 굳게 믿을 수 있을까요?", "gist": "질문 던지기. 이제부터 그 이유를 설명한다."}, {"n": 7, "ch": [{"e": "Part of the answer", "k": "답의 일부는"}, {"e": "lies in the way", "k": "방식에 있다"}, {"e": "our brains are <b>wired<\/b>.", "k": "우리의 뇌가 <b>고정된<\/b>."}], "easy": "그 답의 일부는 우리 뇌가 짜여 있는 방식에 있어요.", "gist": "원인 제시. 이유를 뇌가 작동하는 방식에서 찾는다."}, {"n": 8, "ch": [{"e": "Generally,", "k": "일반적으로,"}, {"e": "people tend to seek", "k": "사람들은 추구하는 경향이 있다"}, {"e": "<b>consistency<\/b>.", "k": "<b>일관성<\/b>을.<span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}], "easy": "보통 사람들은 일관성을 찾으려는 경향이 있어요.", "gist": "핵심 문장. 사람들이 추구하는 것이 일관성이라고 말하고, 뒤 문장들이 그 뜻을 풀어 준다."}, {"n": 9, "ch": [{"e": "There is a <b>substantial<\/b> body of psychological research", "k": "상당히 많은 심리학적인 연구조사가 있다"}, {"e": "showing that people tend to interpret information", "k": "사람들이 정보를 해석하는 경향이 있다는 것을 보여주는"}, {"e": "with an eye toward", "k": "~하는 쪽으로 시각을 가지고"}, {"e": "<b>reinforcing<\/b> their preexisting views.", "k": "그들의 기존의 견해들을 <b>강화하는<\/b>."}], "easy": "사람들은 정보를 자기가 원래 가진 생각을 더 굳히는 쪽으로 해석하는 경향이 있다는 심리학 연구가 꽤 많아요.", "gist": "앞 문장을 뒷받침하는 연구. 사람들이 정보를 기존 견해를 강화하는 쪽으로 해석한다."}, {"n": 10, "ch": [{"e": "If we believe something about the world,", "k": "만약 우리가 세상에 대해 무언가를 믿는다면,"}, {"e": "we are more likely to", "k": "우리는 ~할 가능성이 더 높다"}, {"e": "<b>passively<\/b> accept as truth", "k": "사실로서 <b>소극적으로<\/b> 받아들일"}, {"e": "any information that confirms our beliefs,", "k": "우리의 믿음을 확인해 주는 어떠한 정보라도,"}, {"e": "and <b>actively<\/b> dismiss", "k": "그리고 <b>적극적으로<\/b> 무시할"}, {"e": "information that doesn’t.", "k": "그렇지 않은 정보는."}], "easy": "내가 믿는 걸 뒷받침하는 정보는 그냥 사실로 받아들이고, 그렇지 않은 정보는 적극적으로 무시하기 쉬워요.", "gist": "연구 내용의 구체적 설명. 믿음에 맞는 정보는 받아들이고 안 맞는 정보는 무시한다."}, {"n": 11, "ch": [{"e": "This is known as", "k": "이것은 ~라고 알려져 있다"}, {"e": "“motivated reasoning.”", "k": "‘의도적 합리화’."}], "easy": "이런 걸 ‘의도적 합리화’라고 해요.", "gist": "용어 소개. 앞 문장의 현상에 이름이 붙는다."}, {"n": 12, "ch": [{"e": "<b>Whether or not<\/b> the consistent information is accurate,", "k": "일관성이 있는 정보가 정확하든 아니든 간에,"}, {"e": "we might accept it", "k": "우리는 그것<span class=\"r\">(= 일관성이 있는 정보)<\/span>을 받아들일지도 모른다"}, {"e": "as fact,", "k": "사실로,"}, {"e": "as confirmation of our beliefs.", "k": "우리의 믿음에 대한 확인으로서."}], "easy": "믿음과 맞아떨어지는 정보라면, 정확한지 아닌지와 상관없이 내 믿음이 맞다는 증거로 받아들일 수 있어요.", "gist": "핵심. 정보가 정확한지가 아니라 내 믿음과 맞는지가 기준이 될 수 있다."}, {"n": 13, "ch": [{"e": "This makes us more <b>confident<\/b>", "k": "이것은 우리를 더 <b>확신<\/b>하게 만든다"}, {"e": "in said beliefs,", "k": "앞서 언급된 믿음에 대해,"}, {"e": "and even less likely to <b>entertain<\/b>", "k": "그리고 심지어 마음에 덜 품게 한다"}, {"e": "facts that contradict them.", "k": "그것들에 모순되는 사실들을."}], "easy": "그러면 그 믿음에 더 확신이 생기고, 그 믿음과 어긋나는 사실은 더더욱 받아들이지 않게 돼요.", "gist": "마무리. 믿음에 대한 확신은 커지고, 어긋나는 사실은 더 받아들이지 않게 된다."}]}, {"no": "12", "typ": "장문 · 빈칸", "src": "2018년 9월 42번", "evn": [9, 10, 12], "ev_en": "There is a substantial body of psychological research showing that people tend to interpret information with an eye toward reinforcing their preexisting views. / If we believe something about the world, we are more likely to passively accept as truth any information that confirms our beliefs, and actively dismiss information that doesn’t. / Whether or not the consistent information is accurate, we might accept it as fact, as confirmation of our beliefs.", "ev_ko": [[9, "사람들이 그들의 기존의 견해들을 강화하는 쪽으로(의) 시각을 가지고 정보를 해석하는 경향이 있다는 것을 보여주는 심리학적인 연구조사가 상당히 많다."], [10, "만약 우리가 세상에 대해 무언가를 믿는다면, 우리는 우리의 믿음을 확인해 주는 어떠한 정보라도 (그것을) 사실로서 더 소극적으로 받아들이고, 그렇지 않은 정보는 더 적극적으로 무시하는 경향이 있다."], [12, "일관성이 있는 정보가 정확하든 아니든 간에, 우리는 그것을 우리의 믿음에 대한 확인으로서, 사실로 받아들일지도 모른다."]], "why": ["빈칸에는 <b>사람들이 일반적으로 추구하는 것<\/b>이 들어갑니다", "바로 뒤 문장 9는 사람들이 정보를 <b>기존의 견해를 강화하는 쪽<\/b>으로 해석한다고 합니다", "문장 10은 믿 function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}

function renderQuiz(){
