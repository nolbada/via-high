ss=\"n\">②</span><span><span class=\"t\">사회적 상호작용</span><span class=\"why\">다른 사람과 주고받는 이야기가 아니에요. 7~11번은 내가 혼자 소식을 듣고 잠시 멍하니 있던 순간을 떠올려 보라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">의도하지 않은 결과</span><span class=\"why\">뜻밖의 결과가 생긴다는 내용은 없어요. 지문의 초점은 결과가 아니라 반응하기 전의 시간(11번 How long did it take(얼마나 걸렸나))이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">개인의 기여</span><span class=\"why\">누가 무엇에 보탬이 됐는지는 한 번도 안 나와요. 6번은 정보를 처리하는 데 시간이 걸린다는 말뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Actors sometimes jump at the chance</div><div class=\"k\">배우들은 때로 기회를 잡는다</div></div><div class=\"rc\"><div class=\"e\">to play a huge response</div><div class=\"k\">엄청난 반응을 연기할</div></div><div class=\"rc\"><div class=\"e\">to some big news.</div><div class=\"k\">어떤 놀라운 소식에 대한.</div></div><div class=\"rnat\">배우들은 때로 어떤 놀라운 소식에 대해 엄청난 반응을 연기할 기회를 잡는다.</div><div class=\"rst\">연극부 연습 시간, 배우 역할 친구들은 깜짝 소식 장면을 제일 좋아해요. = 지문 1번, 큰 반응을 연기할 기회를 잡는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">One character says to another,</div><div class=\"k\">한 인물이 다른 인물에게 말한다,</div></div><div class=\"rc\"><div class=\"e\">“You just won a million dollars!”</div><div class=\"k\">“당신은 방금 백만 달러를 땄어요!”</div></div><div class=\"rnat\">한 인물이 다른 인물에게, “당신은 방금 백만 달러를 땄어요!”라고 말한다.</div><div class=\"rst\">대본에서 한 친구가 “너 백만 달러 당첨됐어!” 하고 외쳐요. 지문 2번의 바로 그 대사예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">And the actor immediately</div><div class=\"k\">그리고 그 배우는 즉시</div></div><div class=\"rc\"><div class=\"e\">jumps up and down</div><div class=\"k\">펄쩍펄쩍 뛰며</div></div><div class=\"rc\"><div class=\"e\">and yells about winning a million dollars.</div><div class=\"k\">백만 달러를 얻은 것에 대해서 소리를 지른다.</div></div><div class=\"rnat\">그리고 그 배우는 즉시 펄쩍펄쩍 뛰며 백만 달러를 얻은 것에 대해서 소리를 지른다.</div><div class=\"rst\">듣자마자 상대 역 친구가 펄쩍펄쩍 뛰며 소리를 질러요. = 지문 3번, 배우는 즉시(immediately) 반응한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">But what would a person do?</div><div class=\"k\">그러나 (실제) 사람은 어떻게 행동할까?</div></div><div class=\"rnat\">그러나 (실제) 사람은 어떻게 행동할까?</div><div class=\"rst\">그때 연극부 선생님이 물어요. “진짜 사람이라면 정말 저렇게 할까?” = 지문 4번의 질문이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Stanislavski,</div><div class=\"k\">Stanislavski(스타니슬라프스키)는,</div></div><div class=\"rc\"><div class=\"e\">a famous Russian theater director,</div><div class=\"k\">유명한 러시아의 연극 연출가인,</div></div><div class=\"rc ckc\"><div class=\"e\">spoke of <span class=\"cw\">reflective delay</span>.</div><div class=\"k\"><span class=\"cw\">성찰적 지연</span>에 대해서 말했다.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">유명한 러시아의 연극 연출가인 Stanislavski(스타니슬라프스키)는 성찰적 지연에 대해서 말했다.</div><div class=\"rst\">선생님은 유명한 연출가 Stanislavski(스타니슬라프스키)가 말한 <b>( 빈칸 )</b>을 알려 줘요. 이게 무엇인지 뒤 문장들이 풀어 줘요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">It often takes time</span></div><div class=\"k\"><span class=\"cw\">종종 시간이 걸린다</span></div></div><div class=\"rc\"><div class=\"e\">for a person to process information</div><div class=\"k\">인간이 정보를 처리하는 데에는</div></div><div class=\"rc\"><div class=\"e\">— whether it’s very good or very bad.</div><div class=\"k\">— 그것(= 정보)이 매우 좋든 아주 나쁘든 간에.</div></div><div class=\"rnat\">인간이 정보를 처리하는 데에는 — 그것(정보)이 매우 좋든 아주 나쁘든 간에 — 종종 시간이 걸린다.</div><div class=\"rst\"><b>사람은 소식을 받아들이는 데 시간이 걸려요.</b> 좋은 소식이든 나쁜 소식이든요. = 지문 6번, 빈칸의 정답 설명이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Think back to a time in your life</div><div class=\"k\">당신의 삶에서 어떤 때를 회상해 보라</div></div><div class=\"rc\"><div class=\"e\">when some big news was delivered.</div><div class=\"k\">어떤 놀라운 소식이 전해졌던.</div></div><div class=\"rnat\">당신의 삶에서 어떤 놀라운 소식이 전해졌던 때를 회상해 보라.</div><div class=\"rst\">선생님이 “너희도 큰 소식을 들었던 때를 떠올려 봐” 해요. = 지문 7번의 Think back(되돌아보라)이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">What did you do?</div><div class=\"k\">당신은 무엇을 했는가?</div></div><div class=\"rnat\">당신은 무엇을 했는가?</div><div class=\"rst\">“그때 너희는 뭘 했니?” 하고 다시 물어요. 지문 8번 질문 그대로예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Did you immediately jump up and down,</div><div class=\"k\">당신은 즉시 펄쩍펄쩍 뛰고,</div></div><div class=\"rc\"><div class=\"e\">scream with joy or pain?</div><div class=\"k\">기쁨으로 혹은 고통으로 소리를 질렀는가?</div></div><div class=\"rnat\">당신은 즉시 펄쩍펄쩍 뛰고, 기쁨으로 혹은 고통으로 소리를 질렀는가?</div><div class=\"rst\">반장 당선 소식을 듣고 바로 펄쩍 뛰며 소리 질렀나요? = 지문 9번, 즉시 뛰고 소리쳤냐는 질문이에요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Or did you just <span class=\"cw\">sit down for a moment</span>,</div><div class=\"k\">아니면 당신은 단지 <span class=\"cw\">잠시 앉아 있었는가</span>,</div></div><div class=\"rc\"><div class=\"e\">saying nothing?</div><div class=\"k\">아무 말도 없이?</div></div><div class=\"rnat\">아니면 당신은 단지 잠시, 아무 말도 없이 앉아 있었는가?</div><div class=\"rst\">아니면 <b>잠깐 말없이 그냥 앉아 있었나요?</b> 대부분은 이쪽이에요. = 지문 10번, 진짜 사람의 반응이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">How long did it take</span></div><div class=\"k\"><span class=\"cw\">얼마나 시간이 걸렸는가</span></div></div><div class=\"rc\"><div class=\"e\">to really understand</div><div class=\"k\">정말로 이해하는 데</div></div><div class=\"rc\"><div class=\"e\">that you won that award</div><div class=\"k\">당신이 그 상금을 받았다는 것을</div></div><div class=\"rc\"><div class=\"e\">before you responded?</div><div class=\"k\">당신이 반응하기 전에?</div></div><div class=\"rnat\">당신이 반응하기 전에 당신이 그 상금을 받았다는 것을 정말로 이해하는 데 얼마나 시간이 걸렸는가?</div><div class=\"rst\">“내가 진짜 됐구나” 실감하기까지 시간이 좀 걸렸죠. = 지문 11번, 이해하는 데 얼마나 걸렸냐는 질문이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Be a person.</div><div class=\"k\">실제 사람처럼 되어라.</div></div><div class=\"rnat\">실제 사람처럼 되어라.</div><div class=\"rst\">그래서 선생님은 “배우 말고 진짜 사람처럼 해 봐”라고 해요. = 지문 12번 Be a person(실제 사람처럼 되어라)이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Don’t just go for emotion</div><div class=\"k\">바로 감정으로 달려들지 말라</div></div><div class=\"rc\"><div class=\"e\">or the obvious response.</div><div class=\"k\">혹은 뻔한 반응으로.</div></div><div class=\"rnat\">바로 감정이나 뻔한 반응으로 달려들지 말라.</div><div class=\"rst\">바로 소리부터 지르지 말고, 생각하는 틈을 두라는 거예요. 그래서 빈칸은 숙고에서 오는 지연(reflective delay)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"jump at the chance\" data-m=\"기회에 달려들다\"><b>jump at the chance</b>기회에 달려들다</button><button type=\"button\" class=\"wdb\" data-w=\"theater director\" data-m=\"연극 연출가\"><b>theater director</b>연극 연출가</button><button type=\"button\" class=\"wdb\" data-w=\"reflective\" data-m=\"숙고하는, 성찰하는\"><b>reflective</b>숙고하는, 성찰하는</button><button type=\"button\" class=\"wdb\" data-w=\"process information\" data-m=\"정보를 처리하다\"><b>process information</b>정보를 처리하다</button><button type=\"button\" class=\"wdb\" data-w=\"think back to\" data-m=\"~을 되돌아보다\"><b>think back to</b>~을 되돌아보다</button><button type=\"button\" class=\"wdb\" data-w=\"obvious\" data-m=\"뻔한\"><b>obvious</b>뻔한</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 뒤 <b>For that reason</b>(그러한 이유로)부터 끝까지가 빈칸의 근거예요. 3·5·6번이 모두 <b>이용자가 직접 규칙을 정하고 지킨다</b>로 모이는지 확인하세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (2번)</span><div class=\"en\">She pointed out, for instance, that the actors affected by the rules for the use and care of resources must have the right to <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">규칙의 영향을 받는 행위자들은 ( ? ) 권리를 가져야 한다</p></div><div class=\"ck-via\"><i>▼</i><span>For that reason(그러한 이유로) = 빈칸 내용 때문에 생기는 일</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 바로 이어지는 결과</span><div class=\"en\">For that reason, the people who monitor and control the behavior of users <mark>should also be users</mark> …</div><p class=\"ko\">그러한 이유로, 이용자의 행동을 감시하고 통제하는 사람들은 <mark>또한 이용자여야 하고</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>Ostrom also(또한)로 같은 생각을 한 번 더 강조해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 결정 방식</span><div class=\"en\">Ostrom also emphasizes the importance of <mark>democratic decision processes</mark> and that all users must be given access to local forums …</div><p class=\"ko\">Ostrom은 또한 <mark>민주적 의사 결정 과정의 중요성과</mark> 모든 이용자에게 지역 포럼 이용 권한이 주어져야 한다는 것을 강조한다</p></div><div class=\"ck-via\"><i>▼</i><span>마지막 문장이 ‘이용자가 직접 규칙을 만든다’로 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">Political institutions at central, regional, and local levels must allow users <mark>to devise their own regulations</mark> and independently ensure observance.</div><p class=\"ko\">정치 기관들은 이용자가 <mark>그들의 자체 규정을 고안하고</mark> 준수를 독립적으로 보장하도록 허용해야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">규칙을 바꾸는 결정에 참여할<small>3번 감시자도 이용자, 5번 민주적 결정, 6번 자체 규정 고안 = 이용자가 규칙 정하기에 참여해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">자원에 대한 개인의 소유권을 주장할</span><span class=\"why\">4번 personal responsibility(개인적 책임)의 ‘개인’에 끌리면 걸려요. 지문은 자원을 내 것으로 갖는 게 아니라 책임지고 함께 규칙을 정한다는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">이익을 극대화하기 위해 그 자원을 사용할</span><span class=\"why\">이익을 늘린다는 말은 지문에 없어요. 2번의 대상은 자원을 쓰는 권리가 아니라 the rules(규칙)에 관한 권리예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">공동 자원에 대한 무료 이용을 요구할</span><span class=\"why\">5번 access(이용 권한)는 자원을 공짜로 쓰는 권한이 아니라, 문제를 해결하는 지역 포럼에 참여할 권한이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">각자의 공로에 따른 적절한 분배를 요구할</span><span class=\"why\">누가 얼마나 기여했는지, 어떻게 나눌지는 한 번도 안 나와요. 3~6번은 모두 규칙을 누가 정하느냐의 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Elinor Ostrom found</div><div class=\"k\">Elinor Ostrom은 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">that there are several factors</div><div class=\"k\">몇 가지 요인들이 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">critical to bringing about</div><div class=\"k\">가져오는 데 매우 중요한</div></div><div class=\"rc\"><div class=\"e\">stable institutional solutions</div><div class=\"k\">안정적인 제도적 해결책을</div></div><div class=\"rc\"><div class=\"e\">to the problem of the commons.</div><div class=\"k\">공유지의 문제에 대한.</div></div><div class=\"rnat\">Elinor Ostrom은 공유지의 문제에 대한 안정적인 제도적 해결책을 가져오는 데 매우 중요한 몇 가지 요인들이 있다는 것을 알게 되었다.</div><div class=\"rst\">우리 반 공용 축구공을 서로 쓰겠다고 매일 싸워요. 어떻게 해야 잘 해결될까요? = 지문 1번, 공유지 문제를 푸는 요인 이야기예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">She pointed out, for instance,</div><div class=\"k\">그녀는 예를 들어 지적했다</div></div><div class=\"rc\"><div class=\"e\">that the actors affected by the rules</div><div class=\"k\">규칙의 영향을 받는 행위자들은</div></div><div class=\"rc\"><div class=\"e\">for the use and care of resources</div><div class=\"k\">자원의 이용 및 관리에 대한</div></div><div class=\"rc\"><div class=\"e\">must have the right to participate in decisions to change the rules.</div><div class=\"k\">규칙을 변경하는 결정에 참여할 권리를 가져야 한다고.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">예를 들어, 그녀는 자원의 이용 및 관리 규칙의 영향을 받는 행위자들은 규칙을 변경하는 결정에 참여할 권리를 가져야 한다고 지적했다.</div><div class=\"rst\">공을 쓰는 우리 반 아이들이 <b>( 빈칸 )</b> 권리를 가져야 해요. = 지문 2번, 규칙의 영향을 받는 사람들의 권리예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">For that reason,</div><div class=\"k\">그러한 이유로,</div></div><div class=\"rc\"><div class=\"e\">the people who monitor and control the behavior of users</div><div class=\"k\">이용자의 행동을 감시하고 통제하는 사람들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">should also be users</span></div><div class=\"k\"><span class=\"cw\">또한 이용자여야 하고</span></div></div><div class=\"rc\"><div class=\"e\">and/or have been given a mandate by all users.</div><div class=\"k\">그리고/또는 모든 이용자에 의해 위임을 받았어야 한다.</div></div><div class=\"rnat\">그러한 이유로, 이용자의 행동을 감시하고 통제하는 사람들 또한 이용자여야 하고/하거나 모든 이용자에 의해 위임을 받았어야 한다.</div><div class=\"rst\"><b>그래서</b>(For that reason) 공 사용을 감시하는 당번도 공을 쓰는 우리 반 아이여야 해요. = 지문 3번이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">This is a significant insight,</div><div class=\"k\">이것은 중요한 통찰이다,</div></div><div class=\"rc\"><div class=\"e\">as it shows</div><div class=\"k\">그것(= 통찰)이 보여 주기 때문이다</div></div><div class=\"rc\"><div class=\"e\">that prospects are poor</div><div class=\"k\">전망이 열악하다는 것을</div></div><div class=\"rc\"><div class=\"e\">for a centrally directed solution</div><div class=\"k\">중앙 (정부) 통제적인 해결책의</div></div><div class=\"rc\"><div class=\"e\">to the problem of the commons</div><div class=\"k\">공유지 문제에 대한</div></div><div class=\"rc\"><div class=\"e\">coming from a state power</div><div class=\"k\">국가 권력에서 나오는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in comparison with a local solution</span></div><div class=\"k\"><span class=\"cw\">지역적인 해결책에 비해</span></div></div><div class=\"rc\"><div class=\"e\">for which users assume personal responsibility.</div><div class=\"k\">이용자가 개인적 책임을 지는.</div></div><div class=\"rnat\">이것은 중요한 통찰인데, 이용자가 개인적 책임을 지는 지역적인 해결책에 비해 국가 권력에서 나오는 공유지 문제에 대한 중앙 (정부) 통제적인 해결책의 전망이 열악하다는 것을 그것(통찰)이 보여 주기 때문이다.</div><div class=\"rst\">교장실에서 정해 내려보낸 규칙보다, 우리가 책임지고 만든 규칙이 더 잘 지켜져요. = 지문 4번, 지역적 해결책이 낫다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Ostrom also emphasizes</div><div class=\"k\">Ostrom은 또한 강조한다</div></div><div class=\"rc ckc\"><div class=\"e\">the importance of <span class=\"cw\">democratic decision processes</span></div><div class=\"k\"><span class=\"cw\">민주적 의사 결정 과정의 중요성과</span></div></div><div class=\"rc\"><div class=\"e\">and that all users must be given access</div><div class=\"k\">그리고 모든 이용자에게 이용 권한이 주어져야 한다는 것을</div></div><div class=\"rc\"><div class=\"e\">to local forums</div><div class=\"k\">지역 포럼에 대한</div></div><div class=\"rc\"><div class=\"e\">for solving problems and conflicts</div><div class=\"k\">문제와 갈등을 해결하기 위한</div></div><div class=\"rc\"><div class=\"e\">among themselves.</div><div class=\"k\">그들 자신 사이의.</div></div><div class=\"rnat\">Ostrom은 또한 민주적 의사 결정 과정의 중요성과, 모든 이용자에게 그들 자신 사이의 문제와 갈등을 해결하기 위한 지역 포럼에 대한 이용 권한이 주어져야 한다는 것을 강조한다.</div><div class=\"rst\">공 문제로 다투면 학급회의에서 모두 손 들고 정해요. = 지문 5번, <b>민주적 의사 결정</b>과 지역 포럼 이야기예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Political institutions at central, regional, and local levels</div><div class=\"k\">중앙, 지방 및 지역 차원의 정치 기관들은</div></div><div class=\"rc\"><div class=\"e\">must allow users</div><div class=\"k\">이용자가 ~하도록 허용해야 한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to devise their own regulations</span></div><div class=\"k\"><span class=\"cw\">그들의 자체 규정을 고안하고</span></div></div><div class=\"rc\"><div class=\"e\">and independently ensure observance.</div><div class=\"k\">(규정의) 준수를 독립적으로 보장하도록.</div></div><div class=\"rnat\">중앙, 지방 및 지역 차원의 정치 기관들은 이용자가 그들의 자체 규정을 고안하고, (규정의) 준수를 독립적으로 보장하도록 허용해야 한다.</div><div class=\"rst\">학교도 우리가 <b>규칙을 직접 만들고</b> 스스로 지키게 맡겨 줘야 해요. 그래서 빈칸은 ‘규칙을 바꾸는 결정에 참여할’이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"commons\" data-m=\"공유지\"><b>commons</b>공유지</button><button type=\"button\" class=\"wdb\" data-w=\"mandate\" data-m=\"위임\"><b>mandate</b>위임</button><button type=\"button\" class=\"wdb\" data-w=\"prospect\" data-m=\"전망\"><b>prospect</b>전망</button><button type=\"button\" class=\"wdb\" data-w=\"assume personal responsibility\" data-m=\"개인적 책임을 지다\"><b>assume personal responsibility</b>개인적 책임을 지다</button><button type=\"button\" class=\"wdb\" data-w=\"devise\" data-m=\"고안하다\"><b>devise</b>고안하다</button><button type=\"button\" class=\"wdb\" data-w=\"observance\" data-m=\"준수\"><b>observance</b>준수</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 실험 결과를 <b>말만 바꿔 옮긴 것</b>이에요. 4번 <b>the hotter</b>(더 뜨거울수록) <b>the faster</b>(더 빨리)에서 (B) 방향을, 6번 숫자(60초를 37초에)에서 (A)를 정하세요.</p><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">… he quickly noticed that <mark>the hotter she was</mark>, <mark>the faster she counted</mark>.</div><p class=\"ko\">그는 <mark>그녀가 더 뜨거울수록(열이 날수록)</mark> <mark>더 빨리 센다는 것을</mark> 이내 알아차렸다.</p></div><div class=\"ck-via\"><i>▼</i><span>38도에 45초 → 39.5도에 37초, 열이 오를수록 더 빨리 셌어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 숫자로 확인</span><div class=\"en\">… when her temperature reached 39.5 degrees Celsius, she counted one minute <mark>in just 37 seconds</mark>.</div><p class=\"ko\">그녀의 체온이 섭씨 39.5도에 도달했을 때, 그녀가 1분을 <mark>고작 37초 만에</mark> 센다는 것을</p></div><div class=\"ck-via\"><i>▼</i><span>37초밖에 안 지났는데 1분이라고 느낌 = (A) more(더 많은), 열이 오름 = (B) increased(증가했다)</span></div><div class=\"ck-step key\"><span class=\"lab\">요약문 (8번) · 짝 맞추기</span><div class=\"en\">… his wife felt <mark>more time had passed</mark> than actually had <mark>as her body temperature increased</mark>.</div><p class=\"ko\">그의 아내는 <mark>그녀의 체온이 증가함에 따라서</mark> 실제로 흐른 것보다 <mark>더 많은 시간이 흘렀다고</mark> 느꼈다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">more 더 많은 … increased 증가했다<small>실제 37초를 1분으로 느꼈으니 (A) more(더 많이), 그때 열은 올라갔으니 (B) increased(증가하다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">less 더 적은 … increased 증가했다</span><span class=\"why\">6번 ‘고작 37초’의 짧다는 느낌에 끌리면 걸려요. 짧았던 건 실제 시간이고, 아내는 그 짧은 시간을 1분이라고 느꼈으니 더 많이 흘렀다고 느낀 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">more 더 많은 … decreased 감소했다</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 4번 the hotter(더 뜨거울수록), 5·6번 38도 → 39.5도처럼 체온은 올라갔어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">less 더 적은 … decreased 감소했다</span><span class=\"why\">둘 다 틀려요. 1분을 37초 만에 셌으니 시간을 더 길게 느낀 것이고, 체온도 39.5도까지 올라갔어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">less 더 적은 … changed 변했다</span><span class=\"why\">(A)가 틀려요. 2번에서 아내는 남편이 잠깐 나가도 오래 나가 있었다고 불평했어요. 시간을 더 길게 느낀 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The wife of American physiologist Hudson Hoagland</div><div class=\"k\">미국인 생리학자 Hudson Hoagland의 아내가</div></div><div class=\"rc\"><div class=\"e\">became sick</div><div class=\"k\">아프게 되었다</div></div><div class=\"rc\"><div class=\"e\">with a severe flu.</div><div class=\"k\">심각한 독감으로.</div></div><div class=\"rnat\">미국인 생리학자 Hudson Hoagland(허드슨 호글랜드)의 아내가 심각한 독감으로 아프게 되었다.</div><div class=\"rst\">독감으로 열이 펄펄 나서 누워 있던 날이 있었어요. = 지문 1번, 박사의 아내가 심한 독감에 걸린 장면이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Dr. Hoagland was curious enough</div><div class=\"k\">Hoagland 박사는 호기심이 충분히 많아서</div></div><div class=\"rc\"><div class=\"e\">to notice that</div><div class=\"k\">알아챌 정도였다</div></div><div class=\"rc\"><div class=\"e\">whenever he left his wife’s room</div><div class=\"k\">그가 아내의 방을 떠날 때마다</div></div><div class=\"rc\"><div class=\"e\">for a short while,</div><div class=\"k\">짧은 시간 동안,</div></div><div class=\"rc\"><div class=\"e\">she complained</div><div class=\"k\">그녀가 불평하는 것을</div></div><div class=\"rc\"><div class=\"e\">that he had been gone for a long time.</div><div class=\"k\">그가 오랜 시간 떠나 있었다고.</div></div><div class=\"rnat\">Hoagland 박사는 그가 짧은 시간 동안 아내의 방을 떠날 때마다, 그녀가 그가 너무 오랜 시간 떠나있는 것 같다고 불평하는 것을 알아챌 만큼 충분히 호기심이 많았다(세심했다).</div><div class=\"rst\">가족이 잠깐 물 뜨러 나갔는데 “왜 이렇게 오래 걸려!” 했어요. = 지문 2번, 잠깐 나가도 오래 나가 있었다고 불평했다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In the interest of scientific investigation,</div><div class=\"k\">과학적 연구를 위해,</div></div><div class=\"rc\"><div class=\"e\">he asked his wife to count to 60,</div><div class=\"k\">그는 아내에게 60까지 세 달라고 부탁했다,</div></div><div class=\"rc\"><div class=\"e\">with each count corresponding to</div><div class=\"k\">각 숫자가 ~와 일치하도록</div></div><div class=\"rc\"><div class=\"e\">what she felt was one second,</div><div class=\"k\">그녀가 1초라고 느끼는 것과,</div></div><div class=\"rc\"><div class=\"e\">while he kept a record of her temperature.</div><div class=\"k\">그동안 그는 그녀의 체온을 기록해 두었다.</div></div><div class=\"rnat\">과학적 연구를 위해 그는 그의 아내에게 그녀가 매 카운트가 1초라고 생각하는 것과 일치하도록 60까지 세 달라고 부탁했고, 그동안 그는 그녀의 체온을 기록에 남겼다.</div><div class=\"rst\">가족이 “1초씩 느낌대로 60까지 세 봐” 하고 체온을 재요. = 지문 3번, 박사가 60까지 세게 하고 체온을 기록한 실험이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">His wife reluctantly accepted</div><div class=\"k\">그의 아내는 마지못해 승낙했다</div></div><div class=\"rc\"><div class=\"e\">and he quickly noticed</div><div class=\"k\">그리고 그는 이내 알아차렸다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">the hotter she was</span>,</div><div class=\"k\"><span class=\"cw\">그녀가 더 뜨거울수록(열이 날수록)</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the faster she counted</span>.</div><div class=\"k\"><span class=\"cw\">더 빨리 센다는 것을</span>.</div></div><div class=\"rnat\">그의 아내는 마지못해서 승낙했고 그는 이내 그녀가 더 뜨거울수록(열이 날수록) 더 빨리 센다는 것을 알아차렸다.</div><div class=\"rst\">투덜대며 셌는데, <b>열이 높을수록 더 빨리</b> 셌어요. = 지문 4번의 the hotter(더 뜨거울수록) the faster(더 빨리)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">When her temperature was 38 degrees Celsius,</div><div class=\"k\">그녀의 체온이 섭씨 38도였을 때,</div></div><div class=\"rc\"><div class=\"e\">for instance,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">she counted to 60</div><div class=\"k\">그녀는 60을 세었다</div></div><div class=\"rc\"><div class=\"e\">in 45 seconds.</div><div class=\"k\">45초 안에.</div></div><div class=\"rnat\">예를 들어 그녀의 체온이 섭씨 38도였을 때, 그녀는 45초 안에 60을 세었다.</div><div class=\"rst\">38도일 땐 60을 세는 데 실제로는 45초밖에 안 걸렸어요. 지문 5번의 예시 숫자예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">He repeated the experiment</div><div class=\"k\">그는 이 실험을 반복했다</div></div><div class=\"rc\"><div class=\"e\">a few more times,</div><div class=\"k\">몇 번 더,</div></div><div class=\"rc\"><div class=\"e\">and found</div><div class=\"k\">그리고 발견했다</div></div><div class=\"rc\"><div class=\"e\">that when her temperature reached 39.5 degrees Celsius,</div><div class=\"k\">그녀의 체온이 섭씨 39.5도에 도달했을 때,</div></div><div class=\"rc\"><div class=\"e\">she counted one minute</div><div class=\"k\">그녀가 1분을 센다는 것을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in just 37 seconds</span>.</div><div class=\"k\"><span class=\"cw\">고작 37초 만에</span>.</div></div><div class=\"rnat\">그는 이 실험을 몇 번 더 반복했고, 그녀의 체온이 섭씨 39.5도에 도달했을 때, 그녀가 고작 37초 만에 1분을 센다는 것을 발견했다.</div><div class=\"rst\">39.5도가 되자 고작 <b>37초 만에</b> 1분을 다 셌어요. = 지문 6번, 열이 오를수록 더 빨라졌다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The doctor thought</div><div class=\"k\">박사는 생각했다</div></div><div class=\"rc\"><div class=\"e\">that his wife must have some kind of ‘internal clock’</div><div class=\"k\">그의 아내가 틀림없이 어떤 종류의 ‘체내 시계’를 갖고 있다고</div></div><div class=\"rc\"><div class=\"e\">inside her brain</div><div class=\"k\">그녀의 뇌 안에</div></div><div class=\"rc\"><div class=\"e\">that ran faster</div><div class=\"k\">더 빠르게 뛰는</div></div><div class=\"rc\"><div class=\"e\">as the fever went up.</div><div class=\"k\">열이 오름에 따라서.</div></div><div class=\"rnat\">박사는 그의 아내가 틀림없이 그녀의 뇌 안에 열이 오름에 따라서 더 빠르게 뛰는 어떤 종류의 ‘체내 시계’를 갖고 있다고 생각했다.</div><div class=\"rst\">머릿속 시계가 열 때문에 빨리 돌아간 거예요. = 지문 7번, 열이 오를수록 빨리 뛰는 체내 시계(internal clock)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The results of Dr. Hoagland’s investigation</div><div class=\"k\">Hoagland 박사의 연구 결과는</div></div><div class=\"rc\"><div class=\"e\">showed</div><div class=\"k\">보여주었다</div></div><div class=\"rc ckc\"><div class=\"e\">that his wife felt <span class=\"cw\">more time had passed</span></div><div class=\"k\">그의 아내가 <span class=\"cw\">더 많은 시간이 흘렀다고</span> 느꼈다는 것을※ 문제지엔 (A) 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">than actually had</div><div class=\"k\">실제로 흐른 것보다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as her body temperature increased</span>.</div><div class=\"k\"><span class=\"cw\">그녀의 체온이 증가함에 따라서</span>.※ 문제지엔 (B) 빈칸으로 되어 있음</div></div><div class=\"rnat\">Hoagland 박사의 연구 결과는 그녀의 체온이 (B)증가함에 따라서 그의 아내가 실제로 시간이 흐른 것보다 (A)더 많은 시간이 흘렀다고 느꼈다는 것을 보여주었다.</div><div class=\"rst\">정리하면, 열이 <b>오를수록</b>(increased) 실제보다 <b>더 많은</b>(more) 시간이 흘렀다고 느껴요. 이게 요약문의 (A)(B)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"physiologist\" data-m=\"생리학자\"><b>physiologist</b>생리학자</button><button type=\"button\" class=\"wdb\" data-w=\"complain\" data-m=\"불평하다\"><b>complain</b>불평하다</button><button type=\"button\" class=\"wdb\" data-w=\"correspond to\" data-m=\"~에 해당하다\"><b>correspond to</b>~에 해당하다</button><button type=\"button\" class=\"wdb\" data-w=\"keep a record of\" data-m=\"~을 기록하다\"><b>keep a record of</b>~을 기록하다</button><button type=\"button\" class=\"wdb\" data-w=\"reluctantly\" data-m=\"마지못해\"><b>reluctantly</b>마지못해</button><button type=\"button\" class=\"wdb\" data-w=\"internal clock\" data-m=\"체내 시계\"><b>internal clock</b>체내 시계</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. air guitar(기타 없이 치는 시늉)가 무엇을 비유하는지 <b>바로 앞 9·11번</b>에서 찾아, 글자 대신 속뜻으로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (12번)</span><div class=\"en\">They’re playing <mark>intellectual air guitar</mark>.</div><p class=\"ko\">그들은 <mark>지적인 기타 연주 흉내를</mark> 내고 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>They(그들) = 9번에서 소개한 사람들</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · They의 정체</span><div class=\"en\">You get people who are great improvisers but don’t have <mark>depth of knowledge</mark>.</div><p class=\"ko\">훌륭한 즉흥 연주자이지만 <mark>지식의 깊이가 없는</mark> 사람들을 얻게 된다.</p></div><div class=\"ck-via\"><i>▼</i><span>겉모습은 연주(jamming)인데 속은 비었다 = 소리 안 나는 기타</span></div><div class=\"ck-step key\"><span class=\"lab\">11번 문장 · air guitar의 정체</span><div class=\"en\">They may look like jazz musicians and have <mark>the appearance of jamming</mark>, but in the end <mark>they know nothing</mark>.</div><p class=\"ko\">그들은 재즈 뮤지션처럼 보이고 <mark>즉흥 연주의 모습을 가졌을지도 모르지만</mark>, <mark>결국 그들은 아무것도 모른다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>air guitar</em>기타 없이 치는 시늉 = 겉으로만 연주하는 척</span><span><em>intellectual</em>지적인 = 음악이 아니라 지식·생각 쪽 이야기</span><span><em>7·8번</em>지식의 축적 없이 창의적 활용만 강조</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 탄탄한 지식 없이 겉으로만 창의적인 척하기 → ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">확고한 지식에 뿌리내리지 않은, 겉보기에만 창의적인 능력을 드러내는 것<small>9번 지식의 깊이가 없음 + 11번 겉모습만 즉흥 연주 = 속 빈 창의성이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">깊이 있는 지식을 보여 주며 전문가인 척하는 것</span><span class=\"why\">‘~인 척’이 맞아 보여서 끌려요. 하지만 9번에서 이 사람들은 depth of knowledge(지식의 깊이)가 없다고 했어요. 깊은 지식을 보여 준다는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">창의성을 높이기 위해 필요한 경험을 쌓는 것</span><span class=\"why\">7번은 처음부터 지식을 쌓지 않은 채 창의적 활용만 한다고 해요. 무언가를 쌓는 사람이 아니라 쌓지 않은 사람 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">탄탄한 음악 지식과 결합된 예술적 재능을 보여 주는 것</span><span class=\"why\">지식과 재능을 둘 다 갖춘 건 1번이 말하는 이상적인 모습이에요. 밑줄의 사람들은 11번처럼 결국 아무것도 몰라요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">교양 있는 청중을 끌기 위해 음악을 연주하는 것</span><span class=\"why\">guitar(기타)를 글자 그대로 음악 연주로 읽은 함정이에요. 청중 이야기는 없고, 10번처럼 직장에서 볼 수 있는 사람을 비유한 말이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Any learning environment</div><div class=\"k\">어떤 학습 환경이든</div></div><div class=\"rc\"><div class=\"e\">that deals with only</div><div class=\"k\">오직 ~만을 다루는</div></div><div class=\"rc\"><div class=\"e\">the database instincts</div><div class=\"k\">데이터베이스(에 기반한) 직감이나</div></div><div class=\"rc\"><div class=\"e\">or only the improvisatory instincts</div><div class=\"k\">혹은 오직 즉흥적인 직감만을</div></div><div class=\"rc\"><div class=\"e\">ignores one half of our ability.</div><div class=\"k\">우리 능력의 절반을 무시한다.</div></div><div class=\"rnat\">오직 데이터베이스(에 기반한) 직감이나 즉흥적인 직감만을 다루는 어떠한 학습 환경도 우리 능력의 절반을 무시한다.</div><div class=\"rst\">학교 밴드부에서 악보 공부만 하거나 즉흥 연주만 하면 실력의 절반을 버리는 거예요. = 지문 1번, 한쪽만 다루면 능력의 절반을 무시한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It is bound to fail.</div><div class=\"k\">그것은 반드시 실패할 것이다.</div></div><div class=\"rnat\">그것은 반드시 실패할 것이다.</div><div class=\"rst\">그런 연습은 결국 무대에서 실패해요. = 지문 2번 It is bound to fail(반드시 실패할 것이다)이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It makes me think of jazz guitarists:</div><div class=\"k\">이는 나에게 재즈 기타리스트들을 떠올리게 한다:</div></div><div class=\"rc\"><div class=\"e\">They’re not going to make it</div><div class=\"k\">그들(= 재즈 기타리스트들)은 성공하지 못할 것이다</div></div><div class=\"rc\"><div class=\"e\">if they know a lot about music theory</div><div class=\"k\">만약 음악 이론에 대해 많이 알고 있지만</div></div><div class=\"rc\"><div class=\"e\">but don’t know how to jam</div><div class=\"k\">즉흥적으로 연주하는 법을 모른다면</div></div><div class=\"rc\"><div class=\"e\">in a live concert.</div><div class=\"k\">라이브 콘서트에서.</div></div><div class=\"rnat\">이는 나에게 재즈 기타리스트들을 떠올리게 한다. 만약 그들이 음악 이론에 대해 많이 알고 있지만 라이브 콘서트에서 즉흥적으로 연주하는 법을 모른다면 그들은 성공하지 못할 것이다.</div><div class=\"rst\">음악 이론은 줄줄 외워도 공연에서 즉흥 연주를 못 하면 소용없어요. = 지문 3번, 재즈 기타리스트 이야기예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Some schools and workplaces</div><div class=\"k\">일부 학교들과 직장들은</div></div><div class=\"rc\"><div class=\"e\">emphasize a stable,</div><div class=\"k\">안정적이고,</div></div><div class=\"rc\"><div class=\"e\">rote-learned database.</div><div class=\"k\">기계적으로 암기한 데이터베이스를 강조한다.</div></div><div class=\"rnat\">일부 학교들과 직장들은 안정적이고, 기계적으로 암기한 데이터베이스를 강조한다.</div><div class=\"rst\">어떤 밴드부는 악보를 통째로 외우게만 시켜요. = 지문 4번, 기계적으로 암기한 데이터베이스(rote-learned database)를 강조한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">They ignore the improvisatory instincts</div><div class=\"k\">그들(= 그 학교들과 직장들)은 즉흥적인 직감들을 무시한다</div></div><div class=\"rc\"><div class=\"e\">drilled into us</div><div class=\"k\">우리에게 주입된</div></div><div class=\"rc\"><div class=\"e\">for millions of years.</div><div class=\"k\">수백만 년 동안.</div></div><div class=\"rnat\">그들은 수백만 년 동안 우리에게 주입된 즉흥적인 직감들을 무시한다.</div><div class=\"rst\">그러면 손이 알아서 노는 즉흥 감각은 버려져요. = 지문 5번, 즉흥적인 직감을 무시한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Creativity suffers.</div><div class=\"k\">(그 때문에) 창의력이 악화된다.</div></div><div class=\"rnat\">(그 때문에) 창의력이 악화된다.</div><div class=\"rst\">그래서 새로운 연주가 안 나와요. = 지문 6번 Creativity suffers(창의력이 악화된다)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Others emphasize</div><div class=\"k\">다른 것들(= 학교들과 직장들)은 강조한다</div></div><div class=\"rc\"><div class=\"e\">creative usage of a database,</div><div class=\"k\">데이터베이스의 창의적인 활용을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">without installing a fund of knowledge</span></div><div class=\"k\"><span class=\"cw\">지식의 축적을 갖추지 않은 채로</span></div></div><div class=\"rc\"><div class=\"e\">in the first place.</div><div class=\"k\">처음부터.</div></div><div class=\"rnat\">다른 것들(학교들과 직장들)은 처음부터 지식의 축적을 갖추지(장착하지) 않은 채로 데이터베이스의 창의적인 활용을 강조한다.</div><div class=\"rst\">반대로 어떤 밴드부는 기초도 안 배우고 “일단 자유롭게 쳐 봐!”만 해요. = 지문 7번, <b>지식의 축적 없이</b> 창의적 활용만 강조한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">They ignore our need</div><div class=\"k\">그들(= 다른 학교들과 직장들)은 우리의 필요를 무시한다</div></div><div class=\"rc\"><div class=\"e\">to obtain a deep understanding of a subject,</div><div class=\"k\">어떤 주제에 대해 깊은 이해를 얻고자 하는,</div></div><div class=\"rc\"><div class=\"e\">which includes memorizing and storing</div><div class=\"k\">이는 암기하고 저장하는 것을 포함한다</div></div><div class=\"rc\"><div class=\"e\">a richly structured database.</div><div class=\"k\">충분히 구조화된 데이터베이스를.</div></div><div class=\"rnat\">그들은 어떤 주제에 대해 깊은 이해를 얻고자 하는 우리의 필요를 무시하는데, 이는 충분히 구조화된 데이터베이스를 암기하고 저장하는 것을 포함한다.</div><div class=\"rst\">코드와 음악 원리를 깊이 익히고 외우는 과정을 건너뛴 거예요. = 지문 8번, 깊은 이해를 얻을 필요를 무시한다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">You get people</div><div class=\"k\">당신은 사람들을 얻게 된다</div></div><div class=\"rc\"><div class=\"e\">who are great improvisers</div><div class=\"k\">훌륭한 즉흥 연주자이지만</div></div><div class=\"rc ckc\"><div class=\"e\">but don’t have <span class=\"cw\">depth of knowledge</span>.</div><div class=\"k\"><span class=\"cw\">지식의 깊이가 없는</span>.</div></div><div class=\"rnat\">당신은 훌륭한 즉흥 연주자이지만 지식의 깊이가 없는 사람들을 얻게 된다.</div><div class=\"rst\">그러면 무대에선 멋있게 즉흥 연주를 하는데 <b>아는 건 얕은</b> 친구가 생겨요. = 지문 9번, 지식의 깊이가 없는 사람들이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">You may know someone like this</div><div class=\"k\">당신은 이러한 사람을 알지도 모른다</div></div><div class=\"rc\"><div class=\"e\">where you work.</div><div class=\"k\">당신이 일하는 곳에서.</div></div><div class=\"rnat\">당신은 당신이 일하는 곳에서 이러한 사람을 알지도 모른다(당신 주변에도 이러한 사람이 있을 수 있다).</div><div class=\"rst\">우리 동아리에도 이런 친구가 꼭 한 명은 있죠. = 지문 10번, 일하는 곳에서 이런 사람을 알 수도 있다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc\"><div class=\"e\">They may look like jazz musicians</div><div class=\"k\">그들(= 이러한 사람들)은 재즈 뮤지션처럼 보일지도 모른다</div></div><div class=\"rc ckc\"><div class=\"e\">and have <span class=\"cw\">the appearance of jamming</span>,</div><div class=\"k\">그리고 <span class=\"cw\">즉흥 연주의 모습을 가졌을지도 모르지만</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">but in the end <span class=\"cw\">they know nothing</span>.</div><div class=\"k\"><span class=\"cw\">결국 그들은 아무것도 모른다</span>.</div></div><div class=\"rnat\">그들은 재즈 뮤지션처럼 보이며 즉흥 연주의 모습을 가졌을지도(즉흥 연주를 할 수 있을지도) 모르지만, 결국 그들은 아무것도 모른다.</div><div class=\"rst\">폼은 진짜 재즈 기타리스트 같은데, 막상 물어보면 <b>아무것도 몰라요</b>. = 지문 11번, 겉모습만 즉흥 연주라는 말이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc ckc\"><div class=\"e\">They’re playing <span class=\"cw\">intellectual air guitar</span>.</div><div class=\"k\">그들은 <span class=\"cw\">지적인 기타 연주 흉내를</span> 내고 있다.</div></div><div class=\"rnat\">그들은 지적인 기타 연주 흉내를 내고 있다(확실한 지식에 근거를 둔 것이 아니라 겉보기에 창의적인(창의적인 것처럼 보이는) 능력을 과시하고 있다).</div><div class=\"rst\"><b>기타 없이 허공에 치는 시늉</b>처럼, 지식 없이 창의적인 척만 하는 거예요. = 지문 12번 air guitar(에어 기타)의 뜻, 정답 ⑤예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"improvisatory\" data-m=\"즉흥의\"><b>improvisatory</b>즉흥의</button><button type=\"button\" class=\"wdb\" data-w=\"be bound to\" data-m=\"반드시 ~하게 되어 있다\"><b>be bound to</b>반드시 ~하게 되어 있다</button><button type=\"button\" class=\"wdb\" data-w=\"jam\" data-m=\"즉흥 연주를 하다\"><b>jam</b>즉흥 연주를 하다</button><button type=\"button\" class=\"wdb\" data-w=\"rote-learned\" data-m=\"기계적으로 암기한\"><b>rote-learned</b>기계적으로 암기한</button><button type=\"button\" class=\"wdb\" data-w=\"fund of knowledge\" data-m=\"지식의 축적\"><b>fund of knowledge</b>지식의 축적</button><button type=\"button\" class=\"wdb\" data-w=\"appearance\" data-m=\"겉모습\"><b>appearance</b>겉모습</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>실험 결과</b>(확신은 높은데 정답률은 낮음)와 <b>그 이유</b>(믿음에 맞는 정보만 받아들임)를 한 줄로 묶어야 해요. 2번에서 시작해 13번 결론까지 ‘<b>사실보다 믿음이 세다</b>’가 반복돼요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 실험 결과</span><div class=\"en\">More than half indicated that they were confident that their answers were correct — but in fact, <mark>only three percent of the people</mark> got more than half of the questions right.</div><p class=\"ko\">절반이 넘는 사람들이 자기 답이 정확하다고 확신했지만, 사실은 <mark>오직 그 사람들의 3퍼센트만이</mark> 질문의 절반 이상을 맞혔다.</p></div><div class=\"ck-via\"><i>▼</i><span>6번 질문(어떻게 틀리고도 확신할까?)에 대한 답</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 문장 · 이유</span><div class=\"en\">… we are more likely to passively accept as truth any information that confirms our beliefs, and <mark>actively dismiss</mark> information that doesn’t.</div><p class=\"ko\">우리는 믿음을 확인해 주는 정보는 사실로 소극적으로 받아들이고, 그렇지 않은 정보는 <mark>적극적으로 무시할</mark> 가능성이 더 높다.</p></div><div class=\"ck-via\"><i>▼</i><span>믿음은 더 단단해지고 사실은 밀려나요</span></div><div class=\"ck-step key\"><span class=\"lab\">13번 문장 · 결정적 결론</span><div class=\"en\">This makes us <mark>more confident</mark> in said beliefs, and even less likely to entertain <mark>facts that contradict them</mark>.</div><p class=\"ko\">이것은 우리가 그 믿음을 <mark>더 확신하게</mark> 만들고, <mark>그것들에 모순되는 사실들을</mark> 마음에 덜 품게 한다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2·3번</em>확신은 큰데 아는 건 적음</span><span><em>5번</em>틀린 믿음을 고치려 하지 않음</span><span><em>10·13번</em>믿음에 맞는 정보만 받고 반대 사실은 밀어냄</span></div><div class=\"ck-eq\">⇒ 공통점 = 사실보다 믿음이 더 힘이 세다 → ①</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">믿음이 사실을 이긴다<small>2번의 근거 없는 확신과 13번의 반대 사실 밀어내기를 한 줄로 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">필요한 것은 동기뿐이다</span><span class=\"why\">[지문에 없음] 11번 motivated reasoning(의도적 합리화)의 motivated(동기가 부여된)에 끌린 함정이에요. 동기가 필요하다는 조언이 아니라 믿음을 지키려는 생각 습관의 이름이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">여전히 겉모습으로 판단하는가?</span><span class=\"why\">[지문에 없음] 겉모습으로 판단하는 이야기는 없어요. 10번처럼 판단의 기준은 겉모습이 아니라 이미 가진 믿음이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">합리적 추론을 촉진하라</span><span class=\"why\">[지문에 없음] 글은 10번처럼 사람들이 믿음에 맞는 정보만 고르는 비합리적 모습을 설명해요. 합리적으로 추론하자는 해결책은 나오지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">적절한 때에 오류를 바로잡아라</span><span class=\"why\">[반대] 5번은 사람들이 믿음을 고치는 것에 resist(저항하다)한다는 사실을 말해요. 오류를 바로잡으라는 조언이 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In 2000,</div><div class=\"k\">2000년에,</div></div><div class=\"rc\"><div class=\"e\">James Kuklinski of the University of Illinois</div><div class=\"k\">Illinois 대학의 James Kuklinski는</div></div><div class=\"rc\"><div class=\"e\">led an influential experiment</div><div class=\"k\">영향력 있는 실험을 이끌었다</div></div><div class=\"rc\"><div class=\"e\">in which more than 1,000 Illinois residents</div><div class=\"k\">1,000명이 넘는 Illinois의 거주자들이</div></div><div class=\"rc\"><div class=\"e\">were asked questions about welfare.</div><div class=\"k\">복지에 대한 질문을 받았던.</div></div><div class=\"rnat\">2000년에, Illinois(일리노이) 대학의 James Kuklinski(제임스 쿠클린스키)는 1,000명이 넘는 Illinois(일리노이)의 거주자들이 복지에 대한 질문을 받았던 영향력 있는 실험을 이끌었다.</div><div class=\"rst\">담임쌤이 우리 반 전체에게 상식 퀴즈를 냈어요. = 지문 1번, 1,000명 넘는 사람에게 복지 질문을 던진 실험이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">More than half indicated</div><div class=\"k\">절반이 넘는 사람들이 말했다</div></div><div class=\"rc\"><div class=\"e\">that they were confident</div><div class=\"k\">그들이 확신한다고</div></div><div class=\"rc\"><div class=\"e\">that their answers were correct —</div><div class=\"k\">그들의 답이 정확하다는 것을 —</div></div><div class=\"rc\"><div class=\"e\">but in fact,</div><div class=\"k\">하지만 사실은,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">only three percent of the people</span></div><div class=\"k\"><span class=\"cw\">오직 그 사람들의 3퍼센트만이</span></div></div><div class=\"rc\"><div class=\"e\">got more than half of the questions right.</div><div class=\"k\">질문의 절반 이상을 정확하게 맞혔다.</div></div><div class=\"rnat\">절반이 넘는 사람들(응답자들)이 그들의 답이 정확하다는 것을 확신했다고 말했지만, 사실은 오직 그 사람들의 3퍼센트만이 질문의 절반 이상을 정확하게 맞혔다.</div><div class=\"rst\">반 넘게 “난 다 맞았어!” 했는데 실제로 절반 이상 맞힌 친구는 거의 없었어요. = 지문 2번, 확신했지만 3퍼센트만 절반 넘게 맞혔다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Perhaps more disturbingly,</div><div class=\"k\">아마도 더 충격적인 것은,</div></div><div class=\"rc\"><div class=\"e\">the ones who were the most confident they were right</div><div class=\"k\">그들이 옳다고 가장 확신했던 사람들이</div></div><div class=\"rc\"><div class=\"e\">were generally the ones</div><div class=\"k\">대체로 ~한 사람들이었다는 점이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">who knew the least about the topic</span>.</div><div class=\"k\"><span class=\"cw\">그 주제에 대해 가장 적게 알았던</span>.</div></div><div class=\"rnat\">아마도 더 충격적인 것은, 그들이 정확했다고(정확하게 알고 있다고) ‘가장’ 확신했던 사람들이 대체로 그 주제에 대해 가장 적게 알았던 사람들이었다.</div><div class=\"rst\">더 놀라운 건, 제일 큰소리친 친구가 제일 많이 틀렸다는 거예요. = 지문 3번, 가장 확신한 사람이 가장 적게 알았다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Kuklinski calls this sort of response</div><div class=\"k\">Kuklinski는 이러한 종류의 응답을 부른다</div></div><div class=\"rc\"><div class=\"e\">the “I know I’m right” syndrome.</div><div class=\"k\">‘내가 맞다는 것을 나는 안다’는 증후군이라고.</div></div><div class=\"rnat\">Kuklinski는 이러한 종류의 응답을 ‘내가 맞다는 것을 나는 안다’는 증후군이라고 불렀다.</div><div class=\"rst\">쌤은 이걸 “I know I'm right”(내가 맞다는 걸 안다) 증후군이라고 불러요. = 지문 4번에서 붙인 이름이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">“It implies not only</div><div class=\"k\">“이것은 ~일 뿐만 아니라 나타낸다</div></div><div class=\"rc\"><div class=\"e\">that most people will resist</div><div class=\"k\">대부분의 사람들이 저항할 것이라는 점</div></div><div class=\"rc\"><div class=\"e\">correcting their factual beliefs,”</div><div class=\"k\">그들의 사실적 믿음을 고치는 것에,”</div></div><div class=\"rc\"><div class=\"e\">he wrote,</div><div class=\"k\">그가 썼다,</div></div><div class=\"rc\"><div class=\"e\">“but also that the very people</div><div class=\"k\">“또한 바로 그 사람들이</div></div><div class=\"rc\"><div class=\"e\">who most need to correct them</div><div class=\"k\">그것들(= 자기가 믿고 있는 사실들)을 가장 고쳐야 할 필요가 있는</div></div><div class=\"rc\"><div class=\"e\">will be least likely to do so.”</div><div class=\"k\">그렇게 할(고칠) 가능성이 가장 적다는 점을.”</div></div><div class=\"rnat\">“이것은 대부분의 사람들이 그들의 사실적 믿음을 고치는 것에 저항할 뿐만 아니라, 또한 그것들(자기가 믿고 있는 사실들)을 가장 고쳐야 할 필요가 있는 바로 그 사람들이 그렇게 할(고칠) 가능성이 가장 적다는 것을 나타낸다.”라고 그가 썼다.</div><div class=\"rst\">그 친구는 틀렸다고 알려 줘도 안 고쳐요. 제일 고쳐야 할 친구가 제일 안 고치죠. = 지문 5번, Kuklinski(쿠클린스키)의 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">How can we have things so wrong</div><div class=\"k\">어떻게 우리는 그렇게 틀리고도</div></div><div class=\"rc\"><div class=\"e\">and be so sure</div><div class=\"k\">그렇게 확신할 수 있을까</div></div><div class=\"rc\"><div class=\"e\">that we’re right?</div><div class=\"k\">우리가 맞다고?</div></div><div class=\"rnat\">어떻게 우리는 그렇게 틀리고도 우리가 맞다고 그렇게 확신할 수 있을까?</div><div class=\"rst\">어떻게 그렇게 틀리고도 그렇게 자신만만할까요? = 지문 6번의 질문이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Part of the answer</div><div class=\"k\">답의 일부는</div></div><div class=\"rc\"><div class=\"e\">lies in the way</div><div class=\"k\">방식에 있다</div></div><div class=\"rc\"><div class=\"e\">our brains are wired.</div><div class=\"k\">우리의 뇌가 고정된.</div></div><div class=\"rnat\">(정)답의 일부는 우리의 뇌가 고정된 방식에 있다.</div><div class=\"rst\">답의 일부는 우리 뇌가 원래 그렇게 생겨 먹었다는 데 있어요. = 지문 7번, 뇌가 짜인 방식이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Generally,</div><div class=\"k\">일반적으로,</div></div><div class=\"rc\"><div class=\"e\">people tend to seek</div><div class=\"k\">사람들은 추구하는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">consistency.</div><div class=\"k\">일관성을.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">일반적으로, 사람들은 일관성을 추구하는 경향이 있다.</div><div class=\"rst\">사람은 원래 내 생각과 <b>앞뒤가 맞는 것</b>을 찾아요. = 지문 8번, 일관성(consistency)을 추구한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">There is a substantial body of psychological research</div><div class=\"k\">상당히 많은 심리학적인 연구조사가 있다</div></div><div class=\"rc\"><div class=\"e\">showing that people tend to interpret information</div><div class=\"k\">사람들이 정보를 해석하는 경향이 있다는 것을 보여주는</div></div><div class=\"rc\"><div class=\"e\">with an eye toward</div><div class=\"k\">~하는 쪽으로 시각을 가지고</div></div><div class=\"rc\"><div class=\"e\">reinforcing their preexisting views.</div><div class=\"k\">그들의 기존의 견해들을 강화하는.</div></div><div class=\"rnat\">사람들이 그들의 기존의 견해들을 강화하는 쪽으로(의) 시각을 가지고 정보를 해석하는 경향이 있다는 것을 보여주는 심리학적인 연구조사가 상당히 많다.</div><div class=\"rst\">그 친구는 무슨 말을 들어도 자기 생각을 더 굳히는 쪽으로 해석해요. = 지문 9번, 기존 견해를 강화하는 쪽으로 해석한다는 연구예요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">If we believe something about the world,</div><div class=\"k\">만약 우리가 세상에 대해 무언가를 믿는다면,</div></div><div class=\"rc\"><div class=\"e\">we are more likely to</div><div class=\"k\">우리는 ~할 가능성이 더 높다</div></div><div class=\"rc\"><div class=\"e\">passively accept as truth</div><div class=\"k\">사실로서 소극적으로 받아들일</div></div><div class=\"rc\"><div class=\"e\">any information that confirms our beliefs,</div><div class=\"k\">우리의 믿음을 확인해 주는 어떠한 정보라도,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">actively dismiss</span></div><div class=\"k\">그리고 <span class=\"cw\">적극적으로 무시할</span></div></div><div class=\"rc\"><div class=\"e\">information that doesn’t.</div><div class=\"k\">그렇지 않은 정보는.</div></div><div class=\"rnat\">만약 우리가 세상에 대해 무언가를 믿는다면, 우리는 우리의 믿음을 확인해 주는 어떠한 정보라도 (그것을) 사실로서 더 소극적으로 받아들이고, 그렇지 않은 정보는 더 적극적으로 무시하는 경향이 있다.</div><div class=\"rst\">“네 답 맞아”는 바로 믿고, “틀렸어”는 귀를 막아요. = 지문 10번, 믿음을 확인해 주는 정보만 받아들이고 나머지는 무시한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">This is known as</div><div class=\"k\">이것은 ~라고 알려져 있다</div></div><div class=\"rc\"><div class=\"e\">“motivated reasoning.”</div><div class=\"k\">‘의도적 합리화’.</div></div><div class=\"rnat\">이것은 ‘의도적 합리화’라고 알려져 있다.</div><div class=\"rst\">이런 걸 “motivated reasoning”(의도적 합리화)이라고 해요. = 지문 11번에서 붙인 이름이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Whether or not the consistent information is accurate,</div><div class=\"k\">일관성이 있는 정보가 정확하든 아니든 간에,</div></div><div class=\"rc\"><div class=\"e\">we might accept it</div><div class=\"k\">우리는 그것(= 일관성이 있는 정보)을 받아들일지도 모른다</div></div><div class=\"rc\"><div class=\"e\">as fact,</div><div class=\"k\">사실로,</div></div><div class=\"rc\"><div class=\"e\">as confirmation of our beliefs.</div><div class=\"k\">우리의 믿음에 대한 확인으로서.</div></div><div class=\"rnat\">일관성이 있는 정보가 정확하든 아니든 간에, 우리는 그것을 우리의 믿음에 대한 확인으로서, 사실로 받아들일지도 모른다.</div><div class=\"rst\">내 생각과 맞기만 하면 정확하든 아니든 사실로 믿어 버려요. = 지문 12번, 일관된 정보는 정확성과 상관없이 받아들인다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">13번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">This makes us <span class=\"cw\">more confident</span></div><div class=\"k\">이것은 <span class=\"cw\">우리를 더 확신하게 만든다</span></div></div><div class=\"rc\"><div class=\"e\">in said beliefs,</div><div class=\"k\">앞서 언급된 믿음에 대해,</div></div><div class=\"rc\"><div class=\"e\">and even less likely to entertain</div><div class=\"k\">그리고 심지어 마음에 덜 품게 한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">facts that contradict them</span>.</div><div class=\"k\"><span class=\"cw\">그것들에 모순되는 사실들을</span>.</div></div><div class=\"rnat\">이것은 우리가 앞서 언급된 믿음에 더 확신을 갖게 만들고, 심지어 그것들에 모순되는 사실들은 마음에 덜 품는 경향이 있게 만든다.</div><div class=\"rst\">그래서 더 확신하고 반대 사실은 더 안 들어요. = 지문 13번, <b>믿음이 사실을 이기는</b> 거예요. 그래서 제목은 ①이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"influential\" data-m=\"영향력 있는\"><b>influential</b>영향력 있는</button><button type=\"button\" class=\"wdb\" data-w=\"indicate\" data-m=\"밝히다, 나타내다\"><b>indicate</b>밝히다, 나타내다</button><button type=\"button\" class=\"wdb\" data-w=\"disturbingly\" data-m=\"충격적이게도\"><b>disturbingly</b>충격적이게도</button><button type=\"button\" class=\"wdb\" data-w=\"syndrome\" data-m=\"증후군\"><b>syndrome</b>증후군</button><button type=\"button\" class=\"wdb\" data-w=\"resist\" data-m=\"저항하다\"><b>resist</b>저항하다</button><button type=\"button\" class=\"wdb\" data-w=\"substantial\" data-m=\"상당한\"><b>substantial</b>상당한</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 뒤에 같은 뜻이 <b>세 번 되풀이</b>돼요. reinforcing their preexisting views(기존 견해를 강화하는), confirms our beliefs(믿음을 확인해 주는), the consistent information(일관성이 있는 정보) = 내 생각과 <b>앞뒤가 맞는 것</b>이에요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (8번)</span><div class=\"en\">Generally, people tend to seek <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">일반적으로, 사람들은 ( ? )을 추구하는 경향이 있다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 바로 뒤에서 연구로 뒷받침해요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 첫 번째 되풀이</span><div class=\"en\">… people tend to interpret information with an eye toward <mark>reinforcing their preexisting views</mark>.</div><p class=\"ko\">사람들이 <mark>그들의 기존의 견해들을 강화하는</mark> 쪽으로 정보를 해석하는 경향이 있다</p></div><div class=\"ck-via\"><i>▼</i><span>기존 견해 강화 = 내 믿음을 확인해 주는 정보만 받기</span></div><div class=\"ck-step\"><span class=\"lab\">10번 문장 · 두 번째 되풀이</span><div class=\"en\">… we are more likely to passively accept as truth <mark>any information that confirms our beliefs</mark> …</div><p class=\"ko\">우리는 <mark>우리의 믿음을 확인해 주는 어떠한 정보라도</mark> 사실로서 소극적으로 받아들일 가능성이 더 높다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸과 같은 뿌리의 말(consistent 일관성이 있는)이 직접 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">12번 문장 · 결정적 단서</span><div class=\"en\">Whether or not <mark>the consistent information</mark> is accurate, we might accept it as fact …</div><p class=\"ko\"><mark>일관성이 있는 정보가</mark> 정확하든 아니든 간에, 우리는 그것을 사실로 받아들일지도 모른다</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">일관성(consistency)<small>9·10·12번이 모두 ‘내 믿음과 앞뒤가 맞는 정보’를 고른다고 말해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">정확성(accuracy)</span><span class=\"why\">12번 accurate(정확한)가 보여서 끌려요. 하지만 Whether or not(~이든 아니든)이라서, 정확한지와 상관없이 받아들인다는 말이에요. 2번도 확신과 정답률이 따로 놀아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">다양성(diversity)</span><span class=\"why\">10번에서 내 믿음과 다른 정보는 actively dismiss(적극적으로 무시하다)한다고 했어요. 여러 생각을 찾는 것과 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">인기(popularity)</span><span class=\"why\">남들이 좋아하는지는 한 번도 안 나와요. 9번처럼 기준은 남이 아니라 나의 preexisting views(기존 견해)예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">협업(collaboration)</span><span class=\"why\">함께 일하는 장면은 없어요. 9~13번은 모두 한 사람이 정보를 자기 믿음에 맞춰 해석하는 방식이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In 2000,</div><div class=\"k\">2000년에,</div></div><div class=\"rc\"><div class=\"e\">James Kuklinski of the University of Illinois</div><div class=\"k\">Illinois 대학의 James Kuklinski는</div></div><div class=\"rc\"><div class=\"e\">led an influential experiment</div><div class=\"k\">영향력 있는 실험을 이끌었다</div></div><div class=\"rc\"><div class=\"e\">in which more than 1,000 Illinois residents</div><div class=\"k\">1,000명이 넘는 Illinois의 거주자들이</div></div><div class=\"rc\"><div class=\"e\">were asked questions about welfare.</div><div class=\"k\">복지에 대한 질문을 받았던.</div></div><div class=\"rnat\">2000년에, Illinois(일리노이) 대학의 James Kuklinski(제임스 쿠클린스키)는 1,000명이 넘는 Illinois(일리노이)의 거주자들이 복지에 대한 질문을 받았던 영향력 있는 실험을 이끌었다.</div><div class=\"rst\">담임쌤이 우리 반 전체에게 상식 퀴즈를 냈어요. = 지문 1번, 1,000명 넘는 사람에게 복지 질문을 던진 실험이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">More than half indicated</div><div class=\"k\">절반이 넘는 사람들이 말했다</div></div><div class=\"rc\"><div class=\"e\">that they were confident</div><div class=\"k\">그들이 확신한다고</div></div><div class=\"rc\"><div class=\"e\">that their answers were correct —</div><div class=\"k\">그들의 답이 정확하다는 것을 —</div></div><div class=\"rc\"><div class=\"e\">but in fact,</div><div class=\"k\">하지만 사실은,</div></div><div class=\"rc\"><div class=\"e\">only three percent of the people</div><div class=\"k\">오직 그 사람들의 3퍼센트만이</div></div><div class=\"rc\"><div class=\"e\">got more than half of the questions right.</div><div class=\"k\">질문의 절반 이상을 정확하게 맞혔다.</div></div><div class=\"rnat\">절반이 넘는 사람들(응답자들)이 그들의 답이 정확하다는 것을 확신했다고 말했지만, 사실은 오직 그 사람들의 3퍼센트만이 질문의 절반 이상을 정확하게 맞혔다.</div><div class=\"rst\">반 넘게 “난 다 맞았어!” 했는데 실제로 절반 이상 맞힌 친구는 거의 없었어요. = 지문 2번, 확신했지만 3퍼센트만 절반 넘게 맞혔다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Perhaps more disturbingly,</div><div class=\"k\">아마도 더 충격적인 것은,</div></div><div class=\"rc\"><div class=\"e\">the ones who were the most confident they were right</div><div class=\"k\">그들이 옳다고 가장 확신했던 사람들이</div></div><div class=\"rc\"><div class=\"e\">were generally the ones</div><div class=\"k\">대체로 ~한 사람들이었다는 점이다</div></div><div class=\"rc\"><div class=\"e\">who knew the least about the topic.</div><div class=\"k\">그 주제에 대해 가장 적게 알았던.</div></div><div class=\"rnat\">아마도 더 충격적인 것은, 그들이 정확했다고(정확하게 알고 있다고) ‘가장’ 확신했던 사람들이 대체로 그 주제에 대해 가장 적게 알았던 사람들이었다.</div><div class=\"rst\">더 놀라운 건, 제일 큰소리친 친구가 제일 많이 틀렸다는 거예요. = 지문 3번, 가장 확신한 사람이 가장 적게 알았다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Kuklinski calls this sort of response</div><div class=\"k\">Kuklinski는 이러한 종류의 응답을 부른다</div></div><div class=\"rc\"><div class=\"e\">the “I know I’m right” syndrome.</div><div class=\"k\">‘내가 맞다는 것을 나는 안다’는 증후군이라고.</div></div><div class=\"rnat\">Kuklinski는 이러한 종류의 응답을 ‘내가 맞다는 것을 나는 안다’는 증후군이라고 불렀다.</div><div class=\"rst\">쌤은 이걸 “I know I'm right”(내가 맞다는 걸 안다) 증후군이라고 불러요. = 지문 4번에서 붙인 이름이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">“It implies not only</div><div class=\"k\">“이것은 ~일 뿐만 아니라 나타낸다</div></div><div class=\"rc\"><div class=\"e\">that most people will resist</div><div class=\"k\">대부분의 사람들이 저항할 것이라는 점</div></div><div class=\"rc\"><div class=\"e\">correcting their factual beliefs,”</div><div class=\"k\">그들의 사실적 믿음을 고치는 것에,”</div></div><div class=\"rc\"><div class=\"e\">he wrote,</div><div class=\"k\">그가 썼다,</div></div><div class=\"rc\"><div class=\"e\">“but also that the very people</div><div class=\"k\">“또한 바로 그 사람들이</div></div><div class=\"rc\"><div class=\"e\">who most need to correct them</div><div class=\"k\">그것들(= 자기가 믿고 있는 사실들)을 가장 고쳐야 할 필요가 있는</div></div><div class=\"rc\"><div class=\"e\">will be least likely to do so.”</div><div class=\"k\">그렇게 할(고칠) 가능성이 가장 적다는 점을.”</div></div><div class=\"rnat\">“이것은 대부분의 사람들이 그들의 사실적 믿음을 고치는 것에 저항할 뿐만 아니라, 또한 그것들(자기가 믿고 있는 사실들)을 가장 고쳐야 할 필요가 있는 바로 그 사람들이 그렇게 할(고칠) 가능성이 가장 적다는 것을 나타낸다.”라고 그가 썼다.</div><div class=\"rst\">그 친구는 틀렸다고 알려 줘도 안 고쳐요. 제일 고쳐야 할 친구가 제일 안 고치죠. = 지문 5번, Kuklinski(쿠클린스키)의 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">How can we have things so wrong</div><div class=\"k\">어떻게 우리는 그렇게 틀리고도</div></div><div class=\"rc\"><div class=\"e\">and be so sure</div><div class=\"k\">그렇게 확신할 수 있을까</div></div><div class=\"rc\"><div class=\"e\">that we’re right?</div><div class=\"k\">우리가 맞다고?</div></div><div class=\"rnat\">어떻게 우리는 그렇게 틀리고도 우리가 맞다고 그렇게 확신할 수 있을까?</div><div class=\"rst\">어떻게 그렇게 틀리고도 그렇게 자신만만할까요? = 지문 6번의 질문이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Part of the answer</div><div class=\"k\">답의 일부는</div></div><div class=\"rc\"><div class=\"e\">lies in the way</div><div class=\"k\">방식에 있다</div></div><div class=\"rc\"><div class=\"e\">our brains are wired.</div><div class=\"k\">우리의 뇌가 고정된.</div></div><div class=\"rnat\">(정)답의 일부는 우리의 뇌가 고정된 방식에 있다.</div><div class=\"rst\">답의 일부는 우리 뇌가 원래 그렇게 만들어져 있다는 데 있어요. = 지문 7번, 뇌가 짜인 방식이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Generally,</div><div class=\"k\">일반적으로,</div></div><div class=\"rc\"><div class=\"e\">people tend to seek</div><div class=\"k\">사람들은 추구하는 경향이 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">consistency</span>.</div><div class=\"k\"><span class=\"cw\">일관성을</span>.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">일반적으로, 사람들은 일관성을 추구하는 경향이 있다.</div><div class=\"rst\">사람은 원래 내 생각과 <b>앞뒤가 맞는 것</b>을 찾아요. = 지문 8번 빈칸, 그래서 정답은 일관성(consistency)이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">There is a substantial body of psychological research</div><div class=\"k\">상당히 많은 심리학적인 연구조사가 있다</div></div><div class=\"rc\"><div class=\"e\">showing that people tend to interpret information</div><div class=\"k\">사람들이 정보를 해석하는 경향이 있다는 것을 보여주는</div></div><div class=\"rc\"><div class=\"e\">with an eye toward</div><div class=\"k\">~하는 쪽으로 시각을 가지고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">reinforcing their preexisting views</span>.</div><div class=\"k\"><span class=\"cw\">그들의 기존의 견해들을 강화하는</span>.</div></div><div class=\"rnat\">사람들이 그들의 기존의 견해들을 강화하는 쪽으로(의) 시각을 가지고 정보를 해석하는 경향이 있다는 것을 보여주는 심리학적인 연구조사가 상당히 많다.</div><div class=\"rst\">그 친구는 무슨 말을 들어도 자기 생각을 더 굳히는 쪽으로 해석해요. = 지문 9번, 기존 견해를 강화하는 쪽으로 해석한다는 연구예요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">If we believe something about the world,</div><div class=\"k\">만약 우리가 세상에 대해 무언가를 믿는다면,</div></div><div class=\"rc\"><div class=\"e\">we are more likely to</div><div class=\"k\">우리는 ~할 가능성이 더 높다</div></div><div class=\"rc\"><div class=\"e\">passively accept as truth</div><div class=\"k\">사실로서 소극적으로 받아들일</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">any information that confirms our beliefs</span>,</div><div class=\"k\"><span class=\"cw\">우리의 믿음을 확인해 주는 어떠한 정보라도</span>,</div></div><div class=\"rc\"><div class=\"e\">and actively dismiss</div><div class=\"k\">그리고 적극적으로 무시할</div></div><div class=\"rc\"><div class=\"e\">information that doesn’t.</div><div class=\"k\">그렇지 않은 정보는.</div></div><div class=\"rnat\">만약 우리가 세상에 대해 무언가를 믿는다면, 우리는 우리의 믿음을 확인해 주는 어떠한 정보라도 (그것을) 사실로서 더 소극적으로 받아들이고, 그렇지 않은 정보는 더 적극적으로 무시하는 경향이 있다.</div><div class=\"rst\">“네 답 맞아”는 바로 믿고, “틀렸어”는 귀를 막아요. = 지문 10번, 믿음을 확인해 주는 정보만 받아들이고 나머지는 무시한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">This is known as</div><div class=\"k\">이것은 ~라고 알려져 있다</div></div><div class=\"rc\"><div class=\"e\">“motivated reasoning.”</div><div class=\"k\">‘의도적 합리화’.</div></div><div class=\"rnat\">이것은 ‘의도적 합리화’라고 알려져 있다.</div><div class=\"rst\">이런 걸 “motivated reasoning”(의도적 합리화)이라고 해요. = 지문 11번에서 붙인 이름이에요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Whether or not <span class=\"cw\">the consistent information</span> is accurate,</div><div class=\"k\"><span class=\"cw\">일관성이 있는 정보가</span> 정확하든 아니든 간에,</div></div><div class=\"rc\"><div class=\"e\">we might accept it</div><div class=\"k\">우리는 그것(= 일관성이 있는 정보)을 받아들일지도 모른다</div></div><div class=\"rc\"><div class=\"e\">as fact,</div><div class=\"k\">사실로,</div></div><div class=\"rc\"><div class=\"e\">as confirmation of our beliefs.</div><div class=\"k\">우리의 믿음에 대한 확인으로서.</div></div><div class=\"rnat\">일관성이 있는 정보가 정확하든 아니든 간에, 우리는 그것을 우리의 믿음에 대한 확인으로서, 사실로 받아들일지도 모른다.</div><div class=\"rst\">내 생각과 맞기만 하면 정확하든 아니든 사실로 믿어 버려요. = 지문 12번, 일관된 정보는 정확성과 상관없이 받아들인다는 말이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">This makes us more confident</div><div class=\"k\">이것은 우리를 더 확신하게 만든다</div></div><div class=\"rc\"><div class=\"e\">in said beliefs,</div><div class=\"k\">앞서 언급된 믿음에 대해,</div></div><div class=\"rc\"><div class=\"e\">and even less likely to entertain</div><div class=\"k\">그리고 심지어 마음에 덜 품게 한다</div></div><div class=\"rc\"><div class=\"e\">facts that contradict them.</div><div class=\"k\">그것들에 모순되는 사실들을.</div></div><div class=\"rnat\">이것은 우리가 앞서 언급된 믿음에 더 확신을 갖게 만들고, 심지어 그것들에 모순되는 사실들은 마음에 덜 품는 경향이 있게 만든다.</div><div class=\"rst\">그래서 더 확신하고 반대 사실은 더 안 들어요. 결국 사람은 정확성보다 <b>일관성</b>(consistency)을 좇아요. = 지문 13번이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"interpret\" data-m=\"해석하다\"><b>interpret</b>해석하다</button><button type=\"button\" class=\"wdb\" data-w=\"with an eye toward\" data-m=\"~을 염두에 두고\"><b>with an eye toward</b>~을 염두에 두고</button><button type=\"button\" class=\"wdb\" data-w=\"reinforce\" data-m=\"강화하다\"><b>reinforce</b>강화하다</button><button type=\"button\" class=\"wdb\" data-w=\"preexisting\" data-m=\"기존의\"><b>preexisting</b>기존의</button><button type=\"button\" class=\"wdb\" data-w=\"dismiss\" data-m=\"무시하다, 일축하다\"><b>dismiss</b>무시하다, 일축하다</button><button type=\"button\" class=\"wdb\" data-w=\"contradict\" data-m=\"모순되다\"><b>contradict</b>모순되다</button></div>"};

function mmInit(){

    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;

    w.insertBefore(b,w.firstChild);
    function upd(){

      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}

    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
