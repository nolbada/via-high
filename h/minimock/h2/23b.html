 Web design process 웹 디자인 과정을 단순화했다</span><span class=\"why\">지문은 웹 디자인이 아니라 수익과 비용을 장부에 어떻게 적었는지(5번) 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">decreased the salaries of the employees 직원들의 급여를 줄였다</span><span class=\"why\">직원이나 급여(salaries)는 지문 어디에도 나오지 않아요. 6번은 순이익과 현금 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">triggered conflicts on the content of Web ads 웹 광고 내용에 대한 갈등을 일으켰다</span><span class=\"why\">광고 내용으로 다퉜다는 말이 없어요. 7번에서 문제를 삼은 건 회계사들이고, 이유도 수익 인식 기준이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Many early dot-com investors</div><div class=\"k\">많은 초기 닷컴 투자자들은</div></div><div class=\"rc\"><div class=\"e\">focused almost entirely</div><div class=\"k\">거의 전적으로 집중했다</div></div><div class=\"rc\"><div class=\"e\">on revenue growth</div><div class=\"k\">수익 증가에만</div></div><div class=\"rc\"><div class=\"e\">instead of net income.</div><div class=\"k\">순수익 대신에.</div></div><div class=\"rnat\">많은 초기의 닷컴 투자자들은 순수익 대신에 거의 전적으로 수익 증가에만 집중했다.</div><div class=\"rst\">학교 축제 장터에서 부스를 연 친구들이 “진짜 남는 돈”보다 “매출이 얼마 찍혔나”에만 신경 써요. = 지문 1번, 순수익 말고 수익 증가에만 집중했다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Many early dot-com companies</div><div class=\"k\">많은 초기 닷컴 회사들은</div></div><div class=\"rc\"><div class=\"e\">earned most of their revenue</div><div class=\"k\">수입의 대부분을 벌어들였다</div></div><div class=\"rc\"><div class=\"e\">from selling advertising space</div><div class=\"k\">광고 게재 공간을 파는 것으로부터</div></div><div class=\"rc\"><div class=\"e\">on their Web sites.</div><div class=\"k\">그들의(= 닷컴 회사들의) 웹 사이트에 있는.</div></div><div class=\"rnat\">많은 초기의 닷컴 회사들은 그들의 수입의 대부분을 그들의 웹 사이트의 광고 게재 공간을 판매하는 것으로부터 벌어들였다.</div><div class=\"rst\">부스들은 주로 자기 부스 벽에 다른 부스 홍보 포스터 붙일 자리를 팔아서 돈을 벌어요. = 지문 2번, 웹 사이트 광고 공간을 팔아 번다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">To boost reported revenue,</div><div class=\"k\">보고되는 수익을 증가시키기 위해,</div></div><div class=\"rc\"><div class=\"e\">some sites began</div><div class=\"k\">몇몇 사이트들은 시작했다</div></div><div class=\"rc\"><div class=\"e\">exchanging ad space.</div><div class=\"k\">광고 게재 공간을 교환하기를.</div></div><div class=\"rnat\">보고되는 수익을 증가시키기 위해, 몇몇 사이트들은 광고 게재 공간을 교환하기 시작했다.</div><div class=\"rst\">그런데 매출 숫자를 크게 보이려고, 몇몇 부스가 포스터 자리를 서로 <b>맞바꾸기</b> 시작해요. = 지문 3번의 광고 공간 교환이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Company A would put an ad</div><div class=\"k\">A 회사는 광고를 게시하곤 했다</div></div><div class=\"rc\"><div class=\"e\">for its Web site</div><div class=\"k\">그것의(= A 회사의) 웹 사이트에 대한</div></div><div class=\"rc\"><div class=\"e\">on company B's Web site,</div><div class=\"k\">B 회사의 웹 사이트에,</div></div><div class=\"rc\"><div class=\"e\">and company B would put an ad</div><div class=\"k\">그리고 B 회사는 광고를 게시하곤 했다</div></div><div class=\"rc\"><div class=\"e\">for its Web site</div><div class=\"k\">그것의(= B 회사의) 웹 사이트에 대한</div></div><div class=\"rc\"><div class=\"e\">on company A's Web site.</div><div class=\"k\">A 회사의 웹 사이트에.</div></div><div class=\"rnat\">A 회사는 그것의 웹 사이트의 광고를 B 회사의 웹 사이트에 게시하곤 했고, B 회사는 그것의 웹 사이트의 광고를 A 회사의 웹 사이트에 게시하곤 했다.</div><div class=\"rst\">내 부스 벽엔 네 포스터, 네 부스 벽엔 내 포스터를 붙여 줘요. = 지문 4번, A 회사와 B 회사가 서로의 사이트에 광고를 건 거예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">No money ever changed hands</span>,</div><div class=\"k\"><span class=\"cw\">돈은 결코 주인이 바뀌지 않았지만</span>(돈이 실제로 넘어간 것은 아니지만),</div></div><div class=\"rc\"><div class=\"e\">but each company recorded</div><div class=\"k\">각각의 회사는 보고했다</div></div><div class=\"rc\"><div class=\"e\">revenue</div><div class=\"k\">수익을</div></div><div class=\"rc\"><div class=\"e\">(for the value of the space</div><div class=\"k\">(공간의 가치에 대한</div></div><div class=\"rc\"><div class=\"e\">that it gave up on its site)</div><div class=\"k\">그것이(= 각 회사가) 자신의 사이트에서 내어준)</div></div><div class=\"rc\"><div class=\"e\">and expense</div><div class=\"k\">그리고 비용을</div></div><div class=\"rc\"><div class=\"e\">(for the value of its ad</div><div class=\"k\">(그것의 광고의 가치에 대한</div></div><div class=\"rc\"><div class=\"e\">that it placed on the other company's site).</div><div class=\"k\">그것이(= 각 회사가) 다른 회사의 사이트에 게재했던)</div></div><div class=\"rnat\">어떠한 돈도 결코 주인이 바뀌지 않았지만(돈이 실제로 넘어간 것은 아니지만), 각각의 회사는 (각 회사가 자신의 사이트에서 내어준 공간의 가치에 대한) 수익과, (각 회사가 다른 회사의 사이트에 게재했던 그것의 광고의 가치에 대한) 비용을 보고했다.</div><div class=\"rst\"><b>실제로 오간 돈은 0원</b>(No money ever changed hands)인데, 장부엔 “포스터 자리 판 돈”과 “포스터 붙인 비용”을 둘 다 적어요. 이게 빈칸의 결정적 단서예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">This practice</div><div class=\"k\">이러한 관행은</div></div><div class=\"rc\"><div class=\"e\">did little to boost net income</div><div class=\"k\">순이익을 증가시키는 데 거의 도움이 되지 않았으며</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">resulted in no additional cash inflow</span></div><div class=\"k\"><span class=\"cw\">어떠한 추가적인 현금 유입도</span> 야기하지 않았다※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\">— <span class=\"cw\">but it did boost reported revenue</span>.</div><div class=\"k\">— <span class=\"cw\">그러나 그것은 정말로 '보고되는' 수익을 증가시키기는 했다</span>.</div></div><div class=\"rnat\">이러한 관행은 순이익을 증가시키는 데 거의 도움이 되지 않았으며 어떠한 추가적인 현금 유입도 야기하지 않았지만, 그것이 정말로 '보고되는' 수익을 증가시키기는 했다.</div><div class=\"rst\">그래서 진짜 남은 돈도, <b>새로 들어온 현금도 없어요</b>. 그래도 매출 숫자만은 커 보여요. 그래서 빈칸은 “추가적인 현금 유입이 없었다”예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">This practice</div><div class=\"k\">이러한 관행은</div></div><div class=\"rc\"><div class=\"e\">was quickly put to an end</div><div class=\"k\">빠르게 종결되었는데</div></div><div class=\"rc\"><div class=\"e\">because accountants felt</div><div class=\"k\">왜냐하면 회계사들이 느꼈기 때문이다</div></div><div class=\"rc\"><div class=\"e\">that it did not meet the criteria</div><div class=\"k\">그것이 기준을 충족시키지 않는다고</div></div><div class=\"rc\"><div class=\"e\">of the revenue recognition principle.</div><div class=\"k\">수익 인식에 대한 원칙의.</div></div><div class=\"rnat\">이러한 관행은 빠르게 종결되었는데, 왜냐하면 회계사들이 그것이 수익 인식에 대한 원칙의 기준을 충족시키지 않는다고 느꼈기 때문이다.</div><div class=\"rst\">결국 축제 담당 쌤이 “이건 진짜 매출이 아니야” 하고 바로 금지해요. = 지문 7번, 회계사들이 수익 인식 기준에 안 맞는다고 본 거예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"revenue\" data-m=\"수익, 매출\"><b>revenue</b>수익, 매출</button><button type=\"button\" class=\"wdb\" data-w=\"net income\" data-m=\"순이익\"><b>net income</b>순이익</button><button type=\"button\" class=\"wdb\" data-w=\"change hands\" data-m=\"주인이 바뀌다\"><b>change hands</b>주인이 바뀌다</button><button type=\"button\" class=\"wdb\" data-w=\"expense\" data-m=\"비용, 지출\"><b>expense</b>비용, 지출</button><button type=\"button\" class=\"wdb\" data-w=\"practice\" data-m=\"관행, 관례\"><b>practice</b>관행, 관례</button><button type=\"button\" class=\"wdb\" data-w=\"criteria\" data-m=\"기준\"><b>criteria</b>기준</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">1번의 <b>not only within the goods market</b>(재화 시장 안에서만이 아니라)이 빈칸을 미리 알려 줘요. 물건 말고 <b>다른 시장</b>이 들어가야 하고, 뒤의 예시가 전부 <b>wages</b>(임금)·<b>working classes</b>(노동자 계층) 이야기예요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (2번)</span><div class=\"en\">Monopoly effects can also emerge in the <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> market.</span></div><p class=\"ko\">독점 효과는 ( ? ) 시장에서도 일어날 수 있다</p></div><div class=\"ck-via\"><i>▼</i><span>also(또한) = 1번의 재화 시장 말고 다른 시장에서도</span></div><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 범위 신호</span><div class=\"en\">… it is <mark>not only within the goods market</mark> that a lack of competition is able to push prices up.</div><p class=\"ko\">경쟁 부족이 가격을 밀어올릴 수 있는 것은 <mark>재화 시장 안에서만이 아니라는 점을</mark> 깨달았다.</p></div><div class=\"ck-via\"><i>▼</i><span>첫 예시가 물건 값이 아니라 일하는 사람의 품삯이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">He pointed to the case of goldsmiths, who earned <mark>much higher wages</mark> than workers of a similar skill …</div><p class=\"ko\">금 세공업자들은 비슷한 기술을 지닌 노동자들보다 <mark>훨씬 더 높은 임금을 받았는데</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>금 세공업자만이 아니라 노동자 계층 전체로 넓혀요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 같은 방향 반복</span><div class=\"en\">He noted that <mark>large sections of the working classes</mark> were barred from entering skilled professions …</div><p class=\"ko\"><mark>노동자 계층의 상당 부분이</mark> 숙련된 전문직에 진입하지 못하도록 제한받았다는 점에 주목했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">labor 노동<small>wages(임금)·workers(노동자)·professions(전문직)를 한 단어로 묶은 시장이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">gold 금</span><span class=\"why\">3번 goldsmiths(금 세공업자)에서 따온 함정이에요. 금은 하나의 예일 뿐이고, 6번은 금과 상관없는 전문직 전체로 넓어져요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">street 거리</span><span class=\"why\">거리 시장(노점) 이야기는 지문에 없어요. 3~7번은 모두 일하는 사람의 임금 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">property 부동산, 재산</span><span class=\"why\">집이나 땅 같은 재산의 값은 나오지 않아요. 7번도 가정이 감당할 교육 비용과 임금 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">capital 자본</span><span class=\"why\">돈을 빌려주는 자본 시장 얘기가 아니에요. 4번에서 독점 가격을 매긴 건 서비스(services), 즉 일한 대가예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">The English political scientist John Stuart Mill</div><div class=\"k\">영국의 정치학자 John Stuart Mill은</div></div><div class=\"rc\"><div class=\"e\">realized</div><div class=\"k\">깨달았다</div></div><div class=\"rc ckc\"><div class=\"e\">that it is <span class=\"cw\">not only within the goods market</span></div><div class=\"k\"><span class=\"cw\">재화 시장 안에서만이 아니라는 점을</span></div></div><div class=\"rc\"><div class=\"e\">that a lack of competition</div><div class=\"k\">경쟁 부족이</div></div><div class=\"rc\"><div class=\"e\">is able to push prices up.</div><div class=\"k\">가격을 밀어올릴 수 있는 (것은).</div></div><div class=\"rnat\">영국의 정치학자 John Stuart Mill은 재화 시장 안에서만 경쟁 부족이 가격 상승을 유발하는 것은 아니라는 사실을 깨달았다.</div><div class=\"rst\">Mill(밀)이라는 학자는 “경쟁이 없으면 값이 오른다”는 게 매점 과자 같은 <b>물건에만</b> 해당하는 게 아니라는 걸 알았어요. = 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Monopoly effects</div><div class=\"k\">독점 효과는</div></div><div class=\"rc\"><div class=\"e\">can also emerge</div><div class=\"k\">또한 일어날 수 있다</div></div><div class=\"rc\"><div class=\"e\">in the labor market.</div><div class=\"k\">노동 시장에서도.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">독점 효과는 노동 시장에서도 또한 일어날 수 있다.</div><div class=\"rst\">동네 <b>알바 품삯</b>, 즉 사람이 일한 값에서도 똑같은 일이 생겨요. 그래서 빈칸은 노동(labor) 시장이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">He pointed to the case of goldsmiths,</div><div class=\"k\">그는(= Mill) 금 세공업자의 사례를 지적했다,</div></div><div class=\"rc ckc\"><div class=\"e\">who earned <span class=\"cw\">much higher wages</span></div><div class=\"k\">그들은 <span class=\"cw\">훨씬 더 높은 임금을 받았는데</span></div></div><div class=\"rc\"><div class=\"e\">than workers of a similar skill</div><div class=\"k\">비슷한 기술을 지닌 노동자들보다</div></div><div class=\"rc\"><div class=\"e\">because they were perceived to be trustworthy</div><div class=\"k\">그들이(= 금 세공업자들) 신뢰할 만하다고 여겨졌기 때문에</div></div><div class=\"rc\"><div class=\"e\">— a characteristic</div><div class=\"k\">— 하나의 특성인데</div></div><div class=\"rc\"><div class=\"e\">that is rare and not easily provable.</div><div class=\"k\">희귀하고 쉽게 증명될 수 없는.</div></div><div class=\"rnat\">그는 금 세공업자의 사례를 지적했는데, 그들은 (그들이) 신뢰할 만하다고(신뢰할 수 있는 사람들이라고) 여겨졌기 때문에 비슷한 기술을 지닌 (다른) 노동자들보다 훨씬 더 높은 임금을 받고 있었다 — (그들에 대한 신뢰는) 희귀하며 쉽게 증명될 수 없는 특성(이다).</div><div class=\"rst\">아파트 강아지 산책 알바에서 “믿을 만한 선배”만 열쇠를 받고 품삯을 훨씬 많이 받아요. = 지문 3번, 믿음 덕에 높은 임금을 받은 금 세공업자예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This created</div><div class=\"k\">이것은 만들어 냈다</div></div><div class=\"rc\"><div class=\"e\">a significant barrier to entry</div><div class=\"k\">상당한 진입 장벽을</div></div><div class=\"rc\"><div class=\"e\">so that those working with gold</div><div class=\"k\">그래서 금을 다루는 사람들은</div></div><div class=\"rc\"><div class=\"e\">could demand a monopoly price</div><div class=\"k\">독점 가격을 요구할 수 있었다</div></div><div class=\"rc\"><div class=\"e\">for their services.</div><div class=\"k\">자신들의 서비스에 대해.</div></div><div class=\"rnat\">이것이 상당한 진입 장벽을 만들어 냈고 그래서 금을 다루는 사람들은 자신들의 서비스에 대해 독점 가격을 요구할 수 있었다.</div><div class=\"rst\">믿음은 아무나 증명할 수 없으니 다른 애들은 끼어들 수가 없어요. 그래서 그 선배가 값을 마음대로 불러요. = 지문 4번의 진입 장벽과 독점 가격이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Mill realized</div><div class=\"k\">Mill은 깨달았다</div></div><div class=\"rc\"><div class=\"e\">that the goldsmiths' situation</div><div class=\"k\">금 세공업자들의 상황이</div></div><div class=\"rc\"><div class=\"e\">was not an isolated case.</div><div class=\"k\">유일한 사례가 아니라는 것을.</div></div><div class=\"rnat\">Mill은 금 세공업자의 상황이 유일한 사례가 아님을 깨달았다.</div><div class=\"rst\">Mill(밀)은 이런 일이 그 선배 한 명만의 일이 아니라는 걸 깨달아요. = 지문 5번, 금 세공업자만의 특별한 경우가 아니라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">He noted</div><div class=\"k\">그는(= Mill) 주목했다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">large sections of the working classes</span></div><div class=\"k\"><span class=\"cw\">노동자 계층의 상당 부분이</span></div></div><div class=\"rc\"><div class=\"e\">were barred from entering</div><div class=\"k\">진입하지 못하도록 제한받았다는 점에</div></div><div class=\"rc\"><div class=\"e\">skilled professions</div><div class=\"k\">숙련된 전문직에</div></div><div class=\"rc\"><div class=\"e\">because they entailed</div><div class=\"k\">그것들이(= 전문직들이) 수반하기 때문에</div></div><div class=\"rc\"><div class=\"e\">many years of education and training.</div><div class=\"k\">수년간의 교육과 훈련을.</div></div><div class=\"rnat\">그는 그들(전문직)이 상당 기간의 교육과 훈련을 수반하기 때문에 노동자 계층의 상당 부분이 전문직에 진입하지 못하도록 제한받았다는 점에 주목했다.</div><div class=\"rst\">피아노 반주처럼 몇 년씩 배워야 하는 일엔 많은 아이들이 아예 들어가지 못해요. = 지문 6번, 노동자 계층이 전문직에 못 들어간 거예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The cost of supporting someone</div><div class=\"k\">누군가를 뒷바라지하는 비용은</div></div><div class=\"rc\"><div class=\"e\">through this process</div><div class=\"k\">이 과정을 통해</div></div><div class=\"rc\"><div class=\"e\">was out of reach for most families,</div><div class=\"k\">대부분의 가정에게 버거운 일이어서,</div></div><div class=\"rc\"><div class=\"e\">so those who could afford it</div><div class=\"k\">그것을(= 뒷바라지 비용) 감당할 수 있는 사람들(만)이</div></div><div class=\"rc\"><div class=\"e\">were able to enjoy wages</div><div class=\"k\">임금을 누릴 수 있었다</div></div><div class=\"rc\"><div class=\"e\">far above what might be expected.</div><div class=\"k\">예상되는 것을 훨씬 뛰어넘는.</div></div><div class=\"rnat\">이런 (교육과 훈련의) 과정을 통해 누군가를 뒷바라지하는 비용은 대부분의 가정에게는 버거운 일이어서, 그것을 감당할 수 있는 사람들(만)이 예상되는 것을 훨씬 뛰어넘는 임금을 누릴 수 있었다.</div><div class=\"rst\">몇 년치 학원비를 낼 수 있는 집 아이만 그 일을 하게 되고, 생각보다 훨씬 많은 돈을 받아요. = 지문 7번, 감당할 수 있는 사람만 높은 임금을 누린 거예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"monopoly\" data-m=\"독점\"><b>monopoly</b>독점</button><button type=\"button\" class=\"wdb\" data-w=\"goldsmith\" data-m=\"금 세공업자\"><b>goldsmith</b>금 세공업자</button><button type=\"button\" class=\"wdb\" data-w=\"wage\" data-m=\"임금\"><b>wage</b>임금</button><button type=\"button\" class=\"wdb\" data-w=\"barrier\" data-m=\"장벽\"><b>barrier</b>장벽</button><button type=\"button\" class=\"wdb\" data-w=\"entail\" data-m=\"수반하다\"><b>entail</b>수반하다</button><button type=\"button\" class=\"wdb\" data-w=\"out of reach\" data-m=\"감당할 수 없는\"><b>out of reach</b>감당할 수 없는</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>만 찾으면 돼요. 부정으로 끝나는 말(<b>they're not</b> 그들은 그렇지 않다) → 바로잡는 말(<b>Actually</b> 사실) → 지시어(<b>By doing so</b> 그렇게 함으로써) 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">Effective personal branding <mark>isn't about talking about yourself</mark> all the time.</div><p class=\"ko\">효과적인 자기 상품화는 항상 <mark>당신 자신에 관해 이야기하는 것</mark>에 대한 것이 아니다.</p></div><div class=\"ck-via\"><i>▼</i><span>“나 얘기만 하면 안 된다” → 왜 안 되는지: 다들 내 소식을 기다리지 않아요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) · 첫 번째 고리</span><div class=\"en\">Although everyone would like to think that friends and family are eagerly waiting … about what you're doing, <mark>they're not</mark>.</div><p class=\"ko\">모든 사람들은 친구들이나 가족이 간절히 기다리고 있다고 생각하고 싶겠지만, <mark>그들(= 친구들이나 가족)은 그렇지 않다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>(B)의 부정 they're not(그들은 그렇지 않다)을 Actually(사실)가 받아서 진짜 모습을 알려 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 두 번째 고리</span><div class=\"en\"><mark>Actually</mark>, they're hoping you're sitting by your computer, waiting for news about them.</div><p class=\"ko\"><mark>사실</mark>, 그들은 당신이 그들에 대한 소식을 기다리며 컴퓨터 옆에 앉아 있기를 희망한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그러니 남 이야기를 더 하라는 결론이 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">(C) · 결론 문장</span><div class=\"en\">The best way to build your personal brand is <mark>to talk more about other people</mark>, events, and ideas than you talk about yourself.</div><p class=\"ko\">당신의 개인 브랜드를 구축하는 최선의 방법은 당신 자신에 대해 이야기하는 것보다 <mark>다른 사람들</mark>, 사건들, 그리고 생각들에 대해 더 많이 이야기하는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>By doing so(그렇게 함으로써) = (C)의 “남 이야기를 더 하기”</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 세 번째 고리</span><div class=\"en\"><mark>By doing so</mark>, you promote their victories and their ideas, and you become an influencer.</div><p class=\"ko\"><mark>그렇게 함으로써</mark>, 당신은 그들의 승리와 그들의 생각을 추켜 세워주고, 영향을 주는 사람이 된다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(B) – (C) – (A)<small>they're not(그렇지 않다) → Actually(사실) → By doing so(그렇게 함으로써), 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">주어진 글 끝도 isn't(~이 아니다)라는 부정이라 Actually(사실)가 붙을 듯해 끌려요. 하지만 (C)의 they(그들)가 가리킬 친구·가족이 (B)에서 처음 나오니 (B)가 먼저예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">(A)의 By doing so(그렇게 함으로써)가 가리킬 “남 이야기 하기”가 주어진 글에 아직 안 나왔어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">(B)의 they're not(그들은 그렇지 않다) 뒤에 Actually(사실)가 아닌 By doing so(그렇게 함으로써)가 오면, 가리킬 행동이 없어 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C)의 they(그들)가 가리킬 친구·가족이 아직 안 나왔어요. 또 (B)가 끝에 오면 they're not(그들은 그렇지 않다)으로 글이 어정쩡하게 끝나요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Your story</div><div class=\"k\">당신의 이야기는</div></div><div class=\"rc\"><div class=\"e\">is what makes you special.</div><div class=\"k\">당신을 특별하게 만드는 것이다.</div></div><div class=\"rnat\">(주어진 글) 당신의 이야기는 당신을 특별하게 만드는 것이다.</div><div class=\"rst\">반 단톡방에서 친구들이 나를 좋아하게 되는 건 <b>나만의 이야기</b> 덕분이에요. = 지문 1번, 내 이야기가 나를 특별하게 만든다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">But the tricky part</div><div class=\"k\">그러나 까다로운 부분은</div></div><div class=\"rc\"><div class=\"e\">is showing how special you are</div><div class=\"k\">당신이 얼마나 특별한지를 보여주는 것이다</div></div><div class=\"rc\"><div class=\"e\">without talking about yourself.</div><div class=\"k\">당신 자신에 대한 이야기를 하지 않고.</div></div><div class=\"rnat\">(주어진 글) 그러나 까다로운 부분은 당신 자신에 대한 이야기를 하지 않고 당신이 얼마나 특별한지를 보여주는 것이다.</div><div class=\"rst\"><b>그런데</b>(But) 어려운 점은, 내 자랑을 안 하면서 내가 특별하다는 걸 보여 줘야 한다는 거예요. = 지문 2번의 까다로운 부분이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Effective personal branding</div><div class=\"k\">효과적인 자기 상품화는</div></div><div class=\"rc\"><div class=\"e\">isn't about talking about yourself</div><div class=\"k\">당신 자신에 관해 이야기하는 것에 대한 것이 아니다</div></div><div class=\"rc\"><div class=\"e\">all the time.</div><div class=\"k\">항상.</div></div><div class=\"rnat\">(주어진 글) 효과적인 자기 상품화는 항상 당신 자신에 관해 이야기하는 것에 대한 것이 아니다.</div><div class=\"rst\">단톡방에서 하루 종일 내 얘기만 올린다고 인기가 생기진 않아요. = 지문 3번, 자기 얘기만 하는 게 좋은 자기 상품화가 아니라는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">By doing so</span>,</div><div class=\"k\"><span class=\"cw\">그렇게 함으로써</span>,</div></div><div class=\"rc\"><div class=\"e\">you promote their victories and their ideas,</div><div class=\"k\">당신은 그들의(= 다른 사람들의) 승리와 그들의 생각을 추켜 세워주고,</div></div><div class=\"rc\"><div class=\"e\">and you become an influencer.</div><div class=\"k\">영향을 주는 사람이 된다.</div></div><div class=\"rnat\">(A) 그렇게 함으로써 당신은 다른 사람들의 승리와 그들의 생각을 추켜 세워주고, 영향을 주는 사람이 된다.</div><div class=\"rst\"><b>그렇게 하면</b>(By doing so) 친구가 대회에서 상 탄 일을 내가 칭찬해 주게 되고, 나는 반에서 영향력 있는 친구가 돼요. = 지문 (A)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">You are seen as someone</div><div class=\"k\">당신은 ~한 사람으로 보여진다</div></div><div class=\"rc\"><div class=\"e\">who is not only helpful,</div><div class=\"k\">도움이 될 뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">but is also a valuable resource.</div><div class=\"k\">귀중한 자산이기도 한.</div></div><div class=\"rnat\">(A) 당신은 도움이 될 뿐만 아니라, 또한 귀중한 자산인 사람으로 보여진다.</div><div class=\"rst\">친구들은 나를 도움 되고 꼭 필요한 친구로 봐요. = 지문 5번, 도움이 될 뿐 아니라 귀중한 자산이라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">That helps your brand</div><div class=\"k\">그것은 당신의 브랜드에 도움이 된다</div></div><div class=\"rc\"><div class=\"e\">more than if you just talk about yourself</div><div class=\"k\">당신이 단지 당신 자신에 대해서만 이야기하는 것보다 더</div></div><div class=\"rc\"><div class=\"e\">over and over.</div><div class=\"k\">계속해서.</div></div><div class=\"rnat\">(A) 그것은 당신이 당신 자신의 이야기를 계속해서 하는 것보다 당신의 브랜드에 더 도움이 된다.</div><div class=\"rst\">이게 내 얘기만 계속 올리는 것보다 나를 훨씬 좋게 보이게 해요. = 지문 6번, 브랜드에 더 도움이 된다는 마무리예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Although everyone would like to think</div><div class=\"k\">비록 모든 사람들은 생각하고 싶겠지만</div></div><div class=\"rc\"><div class=\"e\">that friends and family</div><div class=\"k\">친구들이나 가족이</div></div><div class=\"rc\"><div class=\"e\">are eagerly waiting by their computers</div><div class=\"k\">컴퓨터 옆에서 간절히 기다리고 있다고</div></div><div class=\"rc\"><div class=\"e\">hoping to hear some news</div><div class=\"k\">어떤 소식을 듣기를 희망하며</div></div><div class=\"rc\"><div class=\"e\">about what you're doing,</div><div class=\"k\">당신이 무엇을 하고 있는지에 대한,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they're not</span>.</div><div class=\"k\"><span class=\"cw\">그들(= 친구들이나 가족)은 그렇지 않다</span>.</div></div><div class=\"rnat\">(B) 비록 모든 사람들은 친구들이나 가족이 당신이 무엇을 하고 있는지에 대한 어떤 소식을 듣는 것을 희망하며 컴퓨터 옆에서 간절히 기다리고 있다고 생각하고 싶겠지만, 그들(친구들이나 가족)은 그렇지 않다.</div><div class=\"rst\">“다들 내 새 소식 기다리겠지?” 싶지만, <b>사실 아무도 안 기다려요</b>(they're not 그렇지 않다). = 지문 (B)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Actually</span>,</div><div class=\"k\"><span class=\"cw\">사실</span>,</div></div><div class=\"rc\"><div class=\"e\">they're hoping</div><div class=\"k\">그들(= 친구들이나 가족)은 희망한다</div></div><div class=\"rc\"><div class=\"e\">you're sitting by your computer,</div><div class=\"k\">당신이 컴퓨터 옆에 앉아 있기를,</div></div><div class=\"rc\"><div class=\"e\">waiting for news about them.</div><div class=\"k\">그들에 대한 소식을 기다리며.</div></div><div class=\"rnat\">(C) 사실, 그들은 당신이 그들에 대한 소식을 기다리며 컴퓨터 옆에 앉아있기를 희망한다.</div><div class=\"rst\"><b>사실</b>(Actually) 친구들은 내가 <b>자기들 소식</b>을 기다려 주길 바라요. = 지문 (C), 그들이 자기 소식을 기다려 주길 바란다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">9번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">The best way</div><div class=\"k\">최선의 방법은</div></div><div class=\"rc\"><div class=\"e\">to build your personal brand</div><div class=\"k\">당신의 개인 브랜드를 구축하는</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">to talk more about other people, events, and ideas</span></div><div class=\"k\"><span class=\"cw\">다른 사람들, 사건들, 그리고 생각들에 대해 더 많이 이야기하는 것이다</span></div></div><div class=\"rc\"><div class=\"e\">than you talk about yourself.</div><div class=\"k\">당신 자신에 대해 이야기하는 것보다.</div></div><div class=\"rnat\">(C) 당신의 개인 브랜드를 구축하는 최선의 방법은 당신 자신에 대한 이야기를 하는 것보다는 다른 사람들, 사건들, 그리고 생각들에 대해 더 많이 얘기하는 것이다.</div><div class=\"rst\">그러니 단톡방에서 내 얘기보다 <b>친구들 얘기</b>를 더 해 주는 게 최고예요. = 지문 9번, 남 이야기를 더 하라는 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"tricky\" data-m=\"까다로운\"><b>tricky</b>까다로운</button><button type=\"button\" class=\"wdb\" data-w=\"personal branding\" data-m=\"자기 상품화\"><b>personal branding</b>자기 상품화</button><button type=\"button\" class=\"wdb\" data-w=\"eagerly\" data-m=\"간절히\"><b>eagerly</b>간절히</button><button type=\"button\" class=\"wdb\" data-w=\"promote\" data-m=\"추켜세우다, 홍보하다\"><b>promote</b>추켜세우다, 홍보하다</button><button type=\"button\" class=\"wdb\" data-w=\"influencer\" data-m=\"영향을 주는 사람\"><b>influencer</b>영향을 주는 사람</button><button type=\"button\" class=\"wdb\" data-w=\"valuable resource\" data-m=\"귀중한 자산\"><b>valuable resource</b>귀중한 자산</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 포유류와 새의 <b>소리</b>(sound) 비교, 방향은 <b>새가 훨씬 낫다</b>예요. mammals(포유류)라는 주어만 같고 소리 이야기가 빠진 문장을 찾으세요.</p><div class=\"ck-step key\"><span class=\"lab\">2번 · 화제와 방향</span><div class=\"en\">They commonly make their presence felt, and communicate, <mark>by sound</mark>, but <mark>birds are far better at it</mark>.</div><p class=\"ko\">그들은 보통 <mark>소리로</mark> 자기 존재를 알리고 의사소통을 하는데, 조류가 그것을 <mark>훨씬 더 잘한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>①②③ 모두 “포유류의 소리는 새만 못하다”를 반복해요</span></div><div class=\"ck-step\"><span class=\"lab\">①②③(3~5번) · 화제 이어 가기</span><div class=\"en\">Some mammals bellow, but <mark>few sing</mark>, apart from human beings and perhaps whales.</div><p class=\"ko\">인간과 아마도 고래를 제외하고는, 몇몇 포유류가 큰 소리로 울부짖기는 하지만 <mark>노래하는 것은 소수밖에 없다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>소리 비교가 갑자기 사는 곳·이동·먹이 이야기로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">④(6번) · 이탈 지점</span><div class=\"en\">Some mammals are different in <mark>where they live</mark>, how they move around and <mark>what they eat</mark>.</div><p class=\"ko\">몇몇 포유류는 <mark>사는 곳에서</mark>, 이동하는 방식에서, 그리고 <mark>먹는 것에 있어서</mark> 다르다.</p></div><div class=\"ck-via\"><i>▼</i><span>④를 빼면 ③의 “포유류는 노래 못함” → ⑤의 Yet(하지만) “새는 노래로 유명”이 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(7번) · 다시 제자리</span><div class=\"en\">Yet many birds are <mark>famed for their songs</mark> …</div><p class=\"ko\">하지만 많은 조류는 <mark>노래로 유명하며</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">몇몇 포유류는 사는 곳·이동 방식·먹는 것이 다르다<small>소리가 아니라 서식지·이동·먹이 이야기라 흐름에서 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">인간을 제외하면 포유류는 대체로 곡조가 아름답지 않다</span><span class=\"why\">소리 얘기가 아닌 것처럼 보이지만, melodious(곡조가 아름다운)는 소리의 아름다움이에요. 2번의 “새가 더 잘한다”를 포유류 쪽에서 이어 가요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">포유류는 여러 소리를 내지만 새의 의미 있는 소리 범주에는 못 미친다</span><span class=\"why\">2번의 sound(소리)와 birds are far better(새가 훨씬 낫다)를 그대로 풀어 준 첫 예시예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">몇몇 포유류는 울부짖지만 노래하는 것은 드물다</span><span class=\"why\">bellow(울부짖다)·sing(노래하다) 모두 소리예요. 포유류의 소리가 새만 못하다는 흐름 그대로예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">하지만 많은 새는 노래로 유명하다</span><span class=\"why\">Yet(하지만)으로 포유류에서 새로 넘어가 famed for their songs(노래로 유명한)로 “새가 낫다”를 마무리해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Both mammals and birds</div><div class=\"k\">포유류와 조류 둘 다</div></div><div class=\"rc\"><div class=\"e\">are noisy creatures.</div><div class=\"k\">시끄러운 동물이다.</div></div><div class=\"rnat\">포유류와 조류 둘 다 시끄러운 동물이다.</div><div class=\"rst\">동물원 체험학습에서 귀를 기울이면, 동물 우리도 새장도 다 시끌시끌해요. = 지문 1번, 포유류와 새 둘 다 시끄럽다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">They commonly make their presence felt,</div><div class=\"k\">그들(= 포유류와 조류)은 보통 자기 존재가 느껴지게 하고(자기 존재를 알리고),</div></div><div class=\"rc ckc\"><div class=\"e\">and communicate, <span class=\"cw\">by sound</span>,</div><div class=\"k\"><span class=\"cw\">소리로</span> 의사소통을 하는데,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but birds are far better at it</span>.</div><div class=\"k\">조류가 그것(= <span class=\"cw\">소리로</span> 존재를 알리거나 의사소통하는 것)을 훨씬 더 잘한다.</div></div><div class=\"rnat\">그들(포유류와 조류)은 보통 소리로 자기 존재가 느껴지게 하고(자기 존재를 알리고) 의사소통을 하는데, 조류가 그것(소리로 존재를 알리거나 의사소통하는 것)을 훨씬 더 잘한다.</div><div class=\"rst\">다들 <b>소리</b>로 “나 여기 있어!” 하고 알리지만, <b>새가 훨씬 잘해요</b>. = 지문 2번, 글의 화제와 방향이 정해지는 곳이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">① Many mammals produce different sounds</div><div class=\"k\">① 많은 포유류는 다른 소리를 내지만</div></div><div class=\"rc\"><div class=\"e\">for different objects,</div><div class=\"k\">각기 다른 목적을 위해,</div></div><div class=\"rc\"><div class=\"e\">but few can match</div><div class=\"k\">필적할 수 있는 것은 소수밖에 없다</div></div><div class=\"rc\"><div class=\"e\">the range of meaningful sounds</div><div class=\"k\">의미가 있는 소리의 범주에</div></div><div class=\"rc\"><div class=\"e\">that birds may give voice to.</div><div class=\"k\">조류가 낼 수 있는.</div></div><div class=\"rnat\">① 많은 포유류는 각기 다른 목적을 위해 다른 소리를 내지만, 조류가 낼 수 있는 의미가 있는 소리의 범주에 필적할 수 있는 것은 소수밖에 없다(거의 없다).</div><div class=\"rst\">① 원숭이도 여러 소리를 내지만, 새처럼 뜻이 담긴 소리를 다양하게 내진 못해요. = 지문 3번, 새의 소리 범주에 못 미친다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">② Apart from human beings,</div><div class=\"k\">② 인간을 제외하고,</div></div><div class=\"rc\"><div class=\"e\">mammals on the whole</div><div class=\"k\">포유류는 대체로</div></div><div class=\"rc\"><div class=\"e\">are not melodious</div><div class=\"k\">곡조가 아름답지 않으며</div></div><div class=\"rc\"><div class=\"e\">and there is little evidence</div><div class=\"k\">증거도 거의 없다</div></div><div class=\"rc\"><div class=\"e\">that they intend to be.</div><div class=\"k\">그들이 그러려고(= 아름다운 곡조를 만들려고) 한다는.</div></div><div class=\"rnat\">② 인간을 제외하고, 포유류는 대체로 곡조가 아름답지 않으며 그들이 그러려고(아름다운 곡조를 만들려고) 한다는 증거도 거의 없다.</div><div class=\"rst\">② 사람 말고 동물 우리에서 들리는 소리는 대체로 노래처럼 아름답진 않아요. = 지문 4번, 포유류는 곡조가 아름답지 않다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">③ Some mammals bellow,</div><div class=\"k\">③ 몇몇 포유류는 큰 소리로 울부짖지만,</div></div><div class=\"rc\"><div class=\"e\">but few sing,</div><div class=\"k\">노래하는 것은 소수밖에 없다,</div></div><div class=\"rc\"><div class=\"e\">apart from human beings and perhaps whales.</div><div class=\"k\">인간과 아마도 고래를 제외하고는.</div></div><div class=\"rnat\">③ 몇몇 포유류가 큰 소리로 울부짖기는 하지만, 인간과 아마도 고래를 제외하고는 노래하는 것은 소수밖에 없다(거의 노래하지 않는다).</div><div class=\"rst\">③ 사자는 “어흥!” 울부짖지만 노래하는 동물은 사람과 고래 정도예요. = 지문 5번, 노래하는 포유류는 드물다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">④ Some mammals are different</div><div class=\"k\">④ 몇몇 포유류는 다르다</div></div><div class=\"rc ckc\"><div class=\"e\">in <span class=\"cw\">where they live</span>,</div><div class=\"k\"><span class=\"cw\">사는 곳에서</span>,</div></div><div class=\"rc\"><div class=\"e\">how they move around</div><div class=\"k\">이동하는 방식에서,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">what they eat</span>.</div><div class=\"k\">그리고 <span class=\"cw\">먹는 것에 있어서</span>.</div></div><div class=\"rnat\">④ 몇몇 포유류는 사는 곳, 이동하는 방식, 그리고 먹는 것에 있어서 다르다.</div><div class=\"rst\">④ 갑자기 “동물마다 사는 곳·다니는 법·먹이가 달라요” 하는 얘기가 나와요. <b>소리가 아니라</b> 지문 흐름에서 튀어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">⑤ Yet many birds</div><div class=\"k\">⑤ 하지만 많은 조류는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are famed for their songs</span></div><div class=\"k\"><span class=\"cw\">노래로 유명하며</span></div></div><div class=\"rc\"><div class=\"e\">and some of the most glorious songsters</div><div class=\"k\">가장 명성이 높은 명금들(고운 소리를 우는 새) 중의 몇몇은</div></div><div class=\"rc\"><div class=\"e\">are the ones we encounter most often.</div><div class=\"k\">우리가 가장 자주 마주치는 것들이다.</div></div><div class=\"rnat\">⑤ 하지만 많은 조류는 노래로 유명하며 가장 명성이 높은 명금들(고운 소리를 우는 새) 중의 몇몇은 우리가 가장 자주 마주치는 것들이다.</div><div class=\"rst\">⑤ <b>하지만</b>(Yet) 새장에선 고운 노랫소리가 들리고, 그런 새는 동네에서도 자주 봐요. = 지문 7번, 새는 노래로 유명하다는 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"make one's presence felt\" data-m=\"자기 존재를 알리다\"><b>make one's presence felt</b>자기 존재를 알리다</button><button type=\"button\" class=\"wdb\" data-w=\"match\" data-m=\"필적하다\"><b>match</b>필적하다</button><button type=\"button\" class=\"wdb\" data-w=\"melodious\" data-m=\"곡조가 아름다운\"><b>melodious</b>곡조가 아름다운</button><button type=\"button\" class=\"wdb\" data-w=\"bellow\" data-m=\"큰 소리로 울부짖다\"><b>bellow</b>큰 소리로 울부짖다</button><button type=\"button\" class=\"wdb\" data-w=\"famed\" data-m=\"유명한\"><b>famed</b>유명한</button><button type=\"button\" class=\"wdb\" data-w=\"songster\" data-m=\"명금(고운 소리로 우는 새)\"><b>songster</b>명금(고운 소리로 우는 새)</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>마지막 결론 문장</b>을 먼저 보세요. 12번의 <b>gave us the insight</b>(통찰력을 주었다)와 <b>broke the case open</b>(사건을 해결했다)이 “눈 가리기가 숨긴 사실을 드러냈다”로 글을 닫아요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제</span><div class=\"en\"><mark>Eye-blocking is a nonverbal behavior</mark> that can occur when we feel threatened or don't like what we see.</div><p class=\"ko\"><mark>눈 가리기는</mark> 우리가 위협받는다고 느낄 때 또는 보고 있는 것이 마음에 들지 않을 때 일어날 수 있는 <mark>비언어적 행위이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7번</em>위치를 물을 때만 눈을 가림</span><span><em>8번</em>불을 질렀냐는 질문엔 흔들리지 않음</span><span><em>10번</em>결국 자리를 비웠다고 인정</span></div><div class=\"ck-eq\">⇒ 눈 가리기 → 숨겨 둔 사실(자리 비움)이 드러남</div></div><div class=\"ck-via\"><i>▼</i><span>사례 전체를 “눈 가리기가 사건을 풀었다”로 한 번에 묶어요</span></div><div class=\"ck-step key\"><span class=\"lab\">12번 문장 · 결정적 결론</span><div class=\"en\">In this case, the guard's eye-blocking behavior <mark>gave us the insight we needed</mark> to pursue a line of questioning that eventually <mark>broke the case open</mark>.</div><p class=\"ko\">이 경우에, 보안 요원의 눈 가리기 행위는 결국 <mark>사건을 해결한</mark> 일련의 심문을 계속하는 데 <mark>우리에게 필요한 통찰력을 주었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">Eye-blocking Reveals Hidden Information 눈 가리기는 숨겨진 정보를 드러낸다<small>1번의 화제(눈 가리기)와 12번의 결론(사건을 풀 통찰)을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">그 남자는 왜 불을 질렀는가?(Why Did the Man Set the Fire?)</span><span class=\"why\">[반대] 보안 요원은 불을 지르지 않았어요. 5번에서 불과 아무 관련이 없다고 밝혔고, 11번 불은 방화범들이 냈어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Factors Interrupting Eye-blocking(눈 가리기를 방해하는 요인들)</span><span class=\"why\">[지문에 없음] 눈 가리기를 막는 요인은 한 번도 나오지 않아요. 글은 눈 가리기가 무엇을 드러내는지(12번) 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Strategies to Hide Eye-blocking Behaviors(눈 가리기 행동을 숨기는 전략)</span><span class=\"why\">[반대] 글은 눈 가리기를 숨기는 법이 아니라, 6번처럼 그것을 관찰해서 단서로 쓰는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Hiring a Security Guard to Protect a Building(건물을 지킬 보안 요원 고용하기)</span><span class=\"why\">[범위 좁음] 4번의 security guard(보안 요원)만 따온 말이에요. 고용 이야기는 없고 보안 요원은 수사 사례 속 인물일 뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Eye-blocking is a nonverbal behavior</span></div><div class=\"k\"><span class=\"cw\">눈 가리기는 비언어적 행위이다</span></div></div><div class=\"rc\"><div class=\"e\">that can occur</div><div class=\"k\">일어날 수 있는</div></div><div class=\"rc\"><div class=\"e\">when we feel threatened</div><div class=\"k\">우리가 위협받는다고 느낄 때</div></div><div class=\"rc\"><div class=\"e\">or don't like what we see.</div><div class=\"k\">또는 보고 있는 것이 마음에 들지 않을 때.</div></div><div class=\"rnat\">눈 가리기(Eye-blocking)는 우리가 위협받는다고 느끼거나 보고 있는 것이 마음에 들지 않을 때 일어날 수 있는 비언어적 행위이다.</div><div class=\"rst\">친구가 무서운 걸 보거나 싫은 걸 볼 때 저도 모르게 눈을 가려요. = 지문 1번, <b>눈 가리기</b>(eye-blocking)가 몸으로 하는 말이라는 거예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Squinting and closing or shielding our eyes</div><div class=\"k\">눈을 가늘게 뜨는 것과 눈을 감거나 가리는 것은</div></div><div class=\"rc\"><div class=\"e\">are actions</div><div class=\"k\">행동들이다</div></div><div class=\"rc\"><div class=\"e\">that have evolved</div><div class=\"k\">진화해 온</div></div><div class=\"rc\"><div class=\"e\">to protect the brain</div><div class=\"k\">뇌를 보호하기 위해</div></div><div class=\"rc\"><div class=\"e\">from seeing undesirable images.</div><div class=\"k\">원하지 않는 이미지를 보는 것으로부터.</div></div><div class=\"rnat\">눈을 가늘게 뜨는 것과 (눈을) 감거나 가리는 것은 원하지 않는 이미지들을 뇌가 보지 못하게 하기 위해서 진화해온 행동들이다.</div><div class=\"rst\">눈을 찡그리거나 감는 건 보기 싫은 장면에서 뇌를 지키려고 생긴 행동이에요. = 지문 2번, 원하지 않는 이미지로부터 뇌를 보호한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">As an investigator, I used</div><div class=\"k\">수사관으로서 나는 이용했다</div></div><div class=\"rc\"><div class=\"e\">eye-blocking behaviors</div><div class=\"k\">눈 가리기 행위를</div></div><div class=\"rc\"><div class=\"e\">to assist in the arson investigation</div><div class=\"k\">방화 수사를 돕기 위해</div></div><div class=\"rc\"><div class=\"e\">of a tragic hotel fire</div><div class=\"k\">비극적인 호텔 화재의</div></div><div class=\"rc\"><div class=\"e\">in Puerto Rico.</div><div class=\"k\">Puerto Rico에서 일어난.</div></div><div class=\"rnat\">수사관으로서, 나는 Puerto Rico의 비극적인 호텔 화재의 방화 수사를 돕기 위해 eye-blocking 행위를 이용했다.</div><div class=\"rst\">글쓴이는 수사관이라 이 눈 가리기를 호텔 화재 수사에 써먹었어요. 우리 학교로 치면 교실 사건을 푸는 담임쌤이에요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">A security guard</div><div class=\"k\">보안 요원 한 명이</div></div><div class=\"rc\"><div class=\"e\">came under immediate suspicion</div><div class=\"k\">즉각적인 용의 선상에 올랐다</div></div><div class=\"rc\"><div class=\"e\">because the blaze broke out</div><div class=\"k\">화재가 발생했기 때문에</div></div><div class=\"rc\"><div class=\"e\">in an area where he was assigned.</div><div class=\"k\">그가 배정받은 구역에서.</div></div><div class=\"rnat\">보안 요원 한 명이 그가 배정받은 지역에서 화재가 발생했기 때문에 즉각적인 용의 선상에 올랐다.</div><div class=\"rst\">교실 창문이 깨졌는데, 마침 그 시간 창문 당번이던 친구가 바로 의심을 받아요. = 지문 4번, 맡은 구역에서 불이 나 보안 요원이 의심받은 거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">One of the ways</div><div class=\"k\">방법 중 하나는</div></div><div class=\"rc\"><div class=\"e\">we determined</div><div class=\"k\">우리가 밝힌</div></div><div class=\"rc\"><div class=\"e\">he had nothing to do with starting the fire</div><div class=\"k\">그가 불을 낸 것과 아무 관련이 없다는 것을</div></div><div class=\"rc\"><div class=\"e\">was by asking him some specific questions</div><div class=\"k\">그에게 몇 가지 구체적인 질문을 해 보는 것이었다</div></div><div class=\"rc\"><div class=\"e\">as to where he was before the fire,</div><div class=\"k\">불이 나기 전에 그가 어디 있었는지,</div></div><div class=\"rc\"><div class=\"e\">at the time of the fire,</div><div class=\"k\">불이 나던 당시에,</div></div><div class=\"rc\"><div class=\"e\">and whether or not he set the fire.</div><div class=\"k\">그리고 그가 불을 질렀는지 아닌지에 관해.</div></div><div class=\"rnat\">그가 불이 난 것과 아무 관련이 없다는 것을 (우리가) 밝힌 방법 중 하나는 불이 나기 전과, 불이 나던 당시에 그가 어디 있었는지, 그리고 그가 불을 질렀는지 아닌지에 관해 그에게 몇 가지 구체적인 질문을 해 보는 것이었다.</div><div class=\"rst\">쌤은 “그때 어디 있었니?”, “네가 깼니?”처럼 하나씩 콕 집어 물어봐요. = 지문 5번, 위치와 방화 여부를 구체적으로 물은 거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">After each question</div><div class=\"k\">각각의 질문 뒤에</div></div><div class=\"rc\"><div class=\"e\">I observed his face</div><div class=\"k\">나는 그의 얼굴을 관찰했다</div></div><div class=\"rc\"><div class=\"e\">for any telltale signs</div><div class=\"k\">어떤 숨길 수 없는 징후라도 있는지</div></div><div class=\"rc\"><div class=\"e\">of eye-blocking behavior.</div><div class=\"k\">눈 가리기 행위의.</div></div><div class=\"rnat\">각각의 질문 뒤에 나는 eye-blocking 행위의(eye-blocking과 관련된) 어떤 숨길 수 없는 징후라도 있는지 (살펴보고자) 그의 얼굴을 관찰했다.</div><div class=\"rst\">질문할 때마다 쌤은 친구 얼굴에 눈을 가리는 티가 나는지 살펴요. = 지문 6번, 숨길 수 없는 징후를 관찰한 거예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">He blocked his eyes</div><div class=\"k\">그는 눈을 가렸다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">only when questioned</span></div><div class=\"k\"><span class=\"cw\">질문을 받았을 때만</span></div></div><div class=\"rc\"><div class=\"e\">about where he was</div><div class=\"k\">그가 어디에 있었는지에 대한</div></div><div class=\"rc\"><div class=\"e\">when the fire started.</div><div class=\"k\">불이 났을 때.</div></div><div class=\"rnat\">그는 불이 났을 때 그가 어디에 있었는지에 대한 질문을 받았을 때만 그의 눈을 가렸다.</div><div class=\"rst\">친구는 <b>“그때 어디 있었니?”를 물을 때만</b> 눈을 가렸어요. = 지문 7번, 불났을 때 어디 있었는지 물을 때만 눈을 가린 거예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Oddly, in contrast,</div><div class=\"k\">희한하게도, 그에 반해,</div></div><div class=\"rc\"><div class=\"e\">he did not seem troubled</div><div class=\"k\">그는 불안해하는 것처럼 보이지 않았다</div></div><div class=\"rc\"><div class=\"e\">by the question,</div><div class=\"k\">그 질문에는,</div></div><div class=\"rc\"><div class=\"e\">“Did you set the fire?”</div><div class=\"k\">“당신이 불을 질렀습니까?”라는</div></div><div class=\"rnat\">그에 반해, 희한하게도 그는 “당신이 불을 질렀습니까?”라는 질문에는 불안해(하는 것처럼) 보이지 않았다.</div><div class=\"rst\"><b>그에 반해</b>(in contrast) “네가 깼니?”에는 전혀 흔들리지 않아요. = 지문 8번, 방화 질문엔 불안해하지 않았다는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">This told me</div><div class=\"k\">이것은 내게 알려 주었다</div></div><div class=\"rc\"><div class=\"e\">the real issue was his location</div><div class=\"k\">진짜 문제는 그의 위치였다는 점을※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">at the time of the fire.</div><div class=\"k\">화재 당시의.</div></div><div class=\"rnat\">이것은 진짜 문제는 화재 당시 그의 위치였다는 점을 내게 알려주었다.</div><div class=\"rst\">그래서 쌤은 알아요. 진짜 문제는 깬 게 아니라 <b>그때 있던 자리</b>(location 위치)라는 걸요. = 지문 9번이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">He was questioned further</div><div class=\"k\">그는 더 깊이 질문을 받았다</div></div><div class=\"rc\"><div class=\"e\">by the investigators</div><div class=\"k\">수사관들로부터</div></div><div class=\"rc\"><div class=\"e\">and eventually admitted to leaving his post</div><div class=\"k\">그리고 마침내 자기 자리를 떠나 있었다고 인정했다</div></div><div class=\"rc\"><div class=\"e\">to visit his girlfriend,</div><div class=\"k\">여자 친구를 만나러,</div></div><div class=\"rc\"><div class=\"e\">who also worked at the hotel.</div><div class=\"k\">그녀(= 여자 친구)도 그 호텔에서 일하던.</div></div><div class=\"rnat\">그는 수사관들로부터 심도 있게 질문을 받았고, 마침내 역시(같은) 호텔에서 일하던 여자 친구를 만나러 자기 자리를 떠나 있었다는 점을 인정했다.</div><div class=\"rst\">더 물어보니, 친구는 다른 반 친구를 보러 잠깐 자리를 비웠다고 털어놔요. = 지문 10번, 여자 친구를 만나러 자리를 떠났다는 고백이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Unfortunately,</div><div class=\"k\">불행하게도,</div></div><div class=\"rc\"><div class=\"e\">while he was gone,</div><div class=\"k\">그가 떠나 있는 동안,</div></div><div class=\"rc\"><div class=\"e\">the arsonists entered the area</div><div class=\"k\">방화범들이 구역에 들어와</div></div><div class=\"rc\"><div class=\"e\">he should have been guarding</div><div class=\"k\">그가 지키고 있어야 했던</div></div><div class=\"rc\"><div class=\"e\">and started the fire.</div><div class=\"k\">불을 낸 것이었다.</div></div><div class=\"rnat\">불행하게도, 그가 (자리를) 떠나 있는 동안, 방화범들이 그가 지키고 있어야 했던 구역에 들어와 불을 낸 것이었다.</div><div class=\"rst\">안타깝게도 그 사이 다른 아이들이 들어와 창문을 깼던 거예요. = 지문 11번, 자리를 비운 사이 방화범들이 불을 냈다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><div class=\"rc\"><div class=\"e\">In this case,</div><div class=\"k\">이 경우에,</div></div><div class=\"rc\"><div class=\"e\">the guard's eye-blocking behavior</div><div class=\"k\">보안 요원의 눈 가리기 행위는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">gave us the insight we needed</span></div><div class=\"k\"><span class=\"cw\">우리에게 필요한 통찰력을 주었다</span></div></div><div class=\"rc\"><div class=\"e\">to pursue a line of questioning</div><div class=\"k\">일련의 심문을 계속하는 데</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that eventually broke the case open</span>.</div><div class=\"k\"><span class=\"cw\">결국 사건을 해결한</span>.</div></div><div class=\"rnat\">이 경우에, 보안 요원의 eye-blocking 행위는 결국 사건을 해결하는 일련의 심문을 계속하는 데 필요한 통찰력을 우리에게 주었다.</div><div class=\"rst\"><b>결국 눈 가리기 하나가</b> 숨겨진 사실을 드러내 사건을 풀었어요. = 지문 12번, 눈 가리기가 사건 해결의 통찰을 줬다는 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"nonverbal\" data-m=\"비언어적인\"><b>nonverbal</b>비언어적인</button><button type=\"button\" class=\"wdb\" data-w=\"undesirable\" data-m=\"달갑지 않은\"><b>undesirable</b>달갑지 않은</button><button type=\"button\" class=\"wdb\" data-w=\"arson\" data-m=\"방화(죄)\"><b>arson</b>방화(죄)</button><button type=\"button\" class=\"wdb\" data-w=\"suspicion\" data-m=\"용의, 혐의\"><b>suspicion</b>용의, 혐의</button><button type=\"button\" class=\"wdb\" data-w=\"telltale\" data-m=\"숨길 수 없는\"><b>telltale</b>숨길 수 없는</button><button type=\"button\" class=\"wdb\" data-w=\"insight\" data-m=\"통찰(력)\"><b>insight</b>통찰(력)</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 문장의 <b>This</b>(이것)는 바로 앞 7·8번의 짝을 가리켜요. <b>위치를 물을 때만</b> 눈을 가렸고 <b>방화 질문엔 멀쩡</b>했으니, 진짜 문제는 그때의 “자리”예요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (9번)</span><div class=\"en\"><mark>This</mark> told me the real issue was his <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> at the time of the fire.</div><p class=\"ko\"><mark>이것은</mark> 진짜 문제는 화재 당시의 그의 ( ? )였다는 점을 알려 주었다</p></div><div class=\"ck-via\"><i>▼</i><span>This(이것)가 가리키는 첫 번째 사실</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">He blocked his eyes <mark>only when questioned about where he was</mark> when the fire started.</div><p class=\"ko\">그는 불이 났을 때 <mark>그가 어디에 있었는지에 대한</mark> <mark>질문을 받았을 때만</mark> 눈을 가렸다.</p></div><div class=\"ck-via\"><i>▼</i><span>in contrast(그에 반해): 방화 질문은 문제가 아니었어요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 대조로 굳히기</span><div class=\"en\">Oddly, <mark>in contrast</mark>, he did not seem troubled by the question, “Did you set the fire?”</div><p class=\"ko\">희한하게도, <mark>그에 반해</mark>, 그는 “당신이 불을 질렀습니까?”라는 그 질문에는 불안해하는 것처럼 보이지 않았다.</p></div><div class=\"ck-via\"><i>▼</i><span>더 물어보니 정말 자리를 비웠던 거예요</span></div><div class=\"ck-step\"><span class=\"lab\">10번 문장 · 확인</span><div class=\"en\">He was questioned further by the investigators and eventually <mark>admitted to leaving his post</mark> …</div><p class=\"ko\">그는 수사관들로부터 더 깊이 질문을 받았고 마침내 <mark>자기 자리를 떠나 있었다고 인정했다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">location 위치<small>where he was(그가 어디에 있었는지)를 한 단어로 바꾼 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">emotion 감정</span><span class=\"why\">눈 가리기가 감정 표현이라 끌리지만, 빈칸은 “무엇에 대해” 숨겼는지예요. 7번이 콕 집은 건 어디 있었는지예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">judgment 판단</span><span class=\"why\">그의 판단력이 문제라는 말은 없어요. 7번에서 눈을 가린 건 위치 질문 때뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">safety 안전</span><span class=\"why\">그의 안전이 걱정된 장면은 없어요. 10번에서 드러난 건 자리를 떠나 있었다는 사실이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">reaction 반응</span><span class=\"why\">반응(눈 가리기)은 단서이지 진짜 문제가 아니에요. 8번처럼 반응이 없던 질문도 있으니, 반응이 나온 위치 질문이 핵심이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Eye-blocking is a nonverbal behavior</div><div class=\"k\">눈 가리기는 비언어적 행위이다</div></div><div class=\"rc\"><div class=\"e\">that can occur</div><div class=\"k\">일어날 수 있는</div></div><div class=\"rc\"><div class=\"e\">when we feel threatened</div><div class=\"k\">우리가 위협받는다고 느낄 때</div></div><div class=\"rc\"><div class=\"e\">or don't like what we see.</div><div class=\"k\">또는 보고 있는 것이 마음에 들지 않을 때.</div></div><div class=\"rnat\">눈 가리기(Eye-blocking)는 우리가 위협받는다고 느끼거나 보고 있는 것이 마음에 들지 않을 때 일어날 수 있는 비언어적 행위이다.</div><div class=\"rst\">친구가 무서운 걸 보거나 싫은 걸 볼 때 저도 모르게 눈을 가려요. = 지문 1번, <b>눈 가리기</b>(eye-blocking)가 몸으로 하는 말이라는 거예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Squinting and closing or shielding our eyes</div><div class=\"k\">눈을 가늘게 뜨는 것과 눈을 감거나 가리는 것은</div></div><div class=\"rc\"><div class=\"e\">are actions</div><div class=\"k\">행동들이다</div></div><div class=\"rc\"><div class=\"e\">that have evolved</div><div class=\"k\">진화해 온</div></div><div class=\"rc\"><div class=\"e\">to protect the brain</div><div class=\"k\">뇌를 보호하기 위해</div></div><div class=\"rc\"><div class=\"e\">from seeing undesirable images.</div><div class=\"k\">원하지 않는 이미지를 보는 것으로부터.</div></div><div class=\"rnat\">눈을 가늘게 뜨는 것과 (눈을) 감거나 가리는 것은 원하지 않는 이미지들을 뇌가 보지 못하게 하기 위해서 진화해온 행동들이다.</div><div class=\"rst\">눈을 찡그리거나 감는 건 보기 싫은 장면에서 뇌를 지키려고 생긴 행동이에요. = 지문 2번, 원하지 않는 이미지로부터 뇌를 보호한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">As an investigator, I used</div><div class=\"k\">수사관으로서 나는 이용했다</div></div><div class=\"rc\"><div class=\"e\">eye-blocking behaviors</div><div class=\"k\">눈 가리기 행위를</div></div><div class=\"rc\"><div class=\"e\">to assist in the arson investigation</div><div class=\"k\">방화 수사를 돕기 위해</div></div><div class=\"rc\"><div class=\"e\">of a tragic hotel fire</div><div class=\"k\">비극적인 호텔 화재의</div></div><div class=\"rc\"><div class=\"e\">in Puerto Rico.</div><div class=\"k\">Puerto Rico에서 일어난.</div></div><div class=\"rnat\">수사관으로서, 나는 Puerto Rico의 비극적인 호텔 화재의 방화 수사를 돕기 위해 eye-blocking 행위를 이용했다.</div><div class=\"rst\">글쓴이는 수사관이라 이 눈 가리기를 호텔 화재 수사에 써먹었어요. 우리 학교로 치면 교실 사건을 푸는 담임쌤이에요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">A security guard</div><div class=\"k\">보안 요원 한 명이</div></div><div class=\"rc\"><div class=\"e\">came under immediate suspicion</div><div class=\"k\">즉각적인 용의 선상에 올랐다</div></div><div class=\"rc\"><div class=\"e\">because the blaze broke out</div><div class=\"k\">화재가 발생했기 때문에</div></div><div class=\"rc\"><div class=\"e\">in an area where he was assigned.</div><div class=\"k\">그가 배정받은 구역에서.</div></div><div class=\"rnat\">보안 요원 한 명이 그가 배정받은 지역에서 화재가 발생했기 때문에 즉각적인 용의 선상에 올랐다.</div><div class=\"rst\">교실 창문이 깨졌는데, 마침 그 시간 창문 당번이던 친구가 바로 의심을 받아요. = 지문 4번, 맡은 구역에서 불이 나 보안 요원이 의심받은 거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">One of the ways</div><div class=\"k\">방법 중 하나는</div></div><div class=\"rc\"><div class=\"e\">we determined</div><div class=\"k\">우리가 밝힌</div></div><div class=\"rc\"><div class=\"e\">he had nothing to do with starting the fire</div><div class=\"k\">그가 불을 낸 것과 아무 관련이 없다는 것을</div></div><div class=\"rc\"><div class=\"e\">was by asking him some specific questions</div><div class=\"k\">그에게 몇 가지 구체적인 질문을 해 보는 것이었다</div></div><div class=\"rc\"><div class=\"e\">as to where he was before the fire,</div><div class=\"k\">불이 나기 전에 그가 어디 있었는지,</div></div><div class=\"rc\"><div class=\"e\">at the time of the fire,</div><div class=\"k\">불이 나던 당시에,</div></div><div class=\"rc\"><div class=\"e\">and whether or not he set the fire.</div><div class=\"k\">그리고 그가 불을 질렀는지 아닌지에 관해.</div></div><div class=\"rnat\">그가 불이 난 것과 아무 관련이 없다는 것을 (우리가) 밝힌 방법 중 하나는 불이 나기 전과, 불이 나던 당시에 그가 어디 있었는지, 그리고 그가 불을 질렀는지 아닌지에 관해 그에게 몇 가지 구체적인 질문을 해 보는 것이었다.</div><div class=\"rst\">쌤은 “그때 어디 있었니?”, “네가 깼니?”처럼 하나씩 콕 집어 물어봐요. = 지문 5번, 위치와 방화 여부를 구체적으로 물은 거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">After each question</div><div class=\"k\">각각의 질문 뒤에</div></div><div class=\"rc\"><div class=\"e\">I observed his face</div><div class=\"k\">나는 그의 얼굴을 관찰했다</div></div><div class=\"rc\"><div class=\"e\">for any telltale signs</div><div class=\"k\">어떤 숨길 수 없는 징후라도 있는지</div></div><div class=\"rc\"><div class=\"e\">of eye-blocking behavior.</div><div class=\"k\">눈 가리기 행위의.</div></div><div class=\"rnat\">각각의 질문 뒤에 나는 eye-blocking 행위의(eye-blocking과 관련된) 어떤 숨길 수 없는 징후라도 있는지 (살펴보고자) 그의 얼굴을 관찰했다.</div><div class=\"rst\">질문할 때마다 쌤은 친구 얼굴에 눈을 가리는 티가 나는지 살펴요. = 지문 6번, 숨길 수 없는 징후를 관찰한 거예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">He blocked his eyes</div><div class=\"k\">그는 눈을 가렸다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">only when questioned</span></div><div class=\"k\"><span class=\"cw\">질문을 받았을 때만</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">about where he was</span></div><div class=\"k\"><span class=\"cw\">그가 어디에 있었는지에 대한</span></div></div><div class=\"rc\"><div class=\"e\">when the fire started.</div><div class=\"k\">불이 났을 때.</div></div><div class=\"rnat\">그는 불이 났을 때 그가 어디에 있었는지에 대한 질문을 받았을 때만 그의 눈을 가렸다.</div><div class=\"rst\">친구는 <b>“그때 어디 있었니?”를 물을 때만</b> 눈을 가렸어요. = 지문 7번, 불났을 때 어디 있었는지 물을 때만 눈을 가린 거예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Oddly, <span class=\"cw\">in contrast</span>,</div><div class=\"k\">희한하게도, <span class=\"cw\">그에 반해</span>,</div></div><div class=\"rc\"><div class=\"e\">he did not seem troubled</div><div class=\"k\">그는 불안해하는 것처럼 보이지 않았다</div></div><div class=\"rc\"><div class=\"e\">by the question,</div><div class=\"k\">그 질문에는,</div></div><div class=\"rc\"><div class=\"e\">“Did you set the fire?”</div><div class=\"k\">“당신이 불을 질렀습니까?”라는</div></div><div class=\"rnat\">그에 반해, 희한하게도 그는 “당신이 불을 질렀습니까?”라는 질문에는 불안해(하는 것처럼) 보이지 않았다.</div><div class=\"rst\"><b>그에 반해</b>(in contrast) “네가 깼니?”에는 전혀 흔들리지 않아요. = 지문 8번, 방화 질문엔 불안해하지 않았다는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">This told me</div><div class=\"k\">이것은 내게 알려 주었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the real issue was his location</span></div><div class=\"k\"><span class=\"cw\">진짜 문제는 그의 위치였다는 점을</span>※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">at the time of the fire.</div><div class=\"k\">화재 당시의.</div></div><div class=\"rnat\">이것은 진짜 문제는 화재 당시 그의 위치였다는 점을 내게 알려주었다.</div><div class=\"rst\">그래서 쌤은 알아요. 진짜 문제는 깬 게 아니라 <b>그때 있던 자리</b>(location 위치)라는 걸요. = 지문 9번이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">He was questioned further</div><div class=\"k\">그는 더 깊이 질문을 받았다</div></div><div class=\"rc\"><div class=\"e\">by the investigators</div><div class=\"k\">수사관들로부터</div></div><div class=\"rc\"><div class=\"e\">and eventually admitted to leaving his post</div><div class=\"k\">그리고 마침내 자기 자리를 떠나 있었다고 인정했다</div></div><div class=\"rc\"><div class=\"e\">to visit his girlfriend,</div><div class=\"k\">여자 친구를 만나러,</div></div><div class=\"rc\"><div class=\"e\">who also worked at the hotel.</div><div class=\"k\">그녀(= 여자 친구)도 그 호텔에서 일하던.</div></div><div class=\"rnat\">그는 수사관들로부터 심도 있게 질문을 받았고, 마침내 역시(같은) 호텔에서 일하던 여자 친구를 만나러 자기 자리를 떠나 있었다는 점을 인정했다.</div><div class=\"rst\">더 물어보니, 친구는 다른 반 친구를 보러 잠깐 자리를 비웠다고 털어놔요. = 지문 10번, 여자 친구를 만나러 자리를 떠났다는 고백이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Unfortunately,</div><div class=\"k\">불행하게도,</div></div><div class=\"rc\"><div class=\"e\">while he was gone,</div><div class=\"k\">그가 떠나 있는 동안,</div></div><div class=\"rc\"><div class=\"e\">the arsonists entered the area</div><div class=\"k\">방화범들이 구역에 들어와</div></div><div class=\"rc\"><div class=\"e\">he should have been guarding</div><div class=\"k\">그가 지키고 있어야 했던</div></div><div class=\"rc\"><div class=\"e\">and started the fire.</div><div class=\"k\">불을 낸 것이었다.</div></div><div class=\"rnat\">불행하게도, 그가 (자리를) 떠나 있는 동안, 방화범들이 그가 지키고 있어야 했던 구역에 들어와 불을 낸 것이었다.</div><div class=\"rst\">안타깝게도 그 사이 다른 아이들이 들어와 창문을 깼던 거예요. = 지문 11번, 자리를 비운 사이 방화범들이 불을 냈다는 말이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">In this case,</div><div class=\"k\">이 경우에,</div></div><div class=\"rc\"><div class=\"e\">the guard's eye-blocking behavior</div><div class=\"k\">보안 요원의 눈 가리기 행위는</div></div><div class=\"rc\"><div class=\"e\">gave us the insight we needed</div><div class=\"k\">우리에게 필요한 통찰력을 주었다</div></div><div class=\"rc\"><div class=\"e\">to pursue a line of questioning</div><div class=\"k\">일련의 심문을 계속하는 데</div></div><div class=\"rc\"><div class=\"e\">that eventually broke the case open.</div><div class=\"k\">결국 사건을 해결한.</div></div><div class=\"rnat\">이 경우에, 보안 요원의 eye-blocking 행위는 결국 사건을 해결하는 일련의 심문을 계속하는 데 필요한 통찰력을 우리에게 주었다.</div><div class=\"rst\"><b>결국 눈 가리기 하나가</b> 숨겨진 사실을 드러내 사건을 풀었어요. = 지문 12번, 눈 가리기가 사건 해결의 통찰을 줬다는 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"block one's eyes\" data-m=\"눈을 가리다\"><b>block one's eyes</b>눈을 가리다</button><button type=\"button\" class=\"wdb\" data-w=\"in contrast\" data-m=\"그에 반해\"><b>in contrast</b>그에 반해</button><button type=\"button\" class=\"wdb\" data-w=\"troubled\" data-m=\"불안해하는\"><b>troubled</b>불안해하는</button><button type=\"button\" class=\"wdb\" data-w=\"issue\" data-m=\"쟁점, 문제\"><b>issue</b>쟁점, 문제</button><button type=\"button\" class=\"wdb\" data-w=\"leave one's post\" data-m=\"자리를 뜨다\"><b>leave one's post</b>자리를 뜨다</button><button type=\"button\" class=\"wdb\" data-w=\"arsonist\" data-m=\"방화범\"><b>arsonist</b>방화범</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
