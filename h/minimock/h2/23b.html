<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}

h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}

.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}

.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}

.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}

.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}

/* explanation */

.quick div{padding:3px 0;font-size:17px}

.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}

.res2{margin-left:auto;font-size:14px}

.qx{padding:0 14px 14px}

.kolist{list-style:none;margin:6px 0;padding:0}

.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}

.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}

/* ---- 읽는 순서 ---- */

(function(W){

  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}

  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}

  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);

    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});

    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){

    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';

    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';

        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}

  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}

  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

이트에 게재했던 그것의 광고의 가치에 대한) 비용을 보고했다.", "이러한 관행은 순이익을 증가시키는 데 거의 도움이 되지 않았으며 어떠한 추가적인 현금 유입도 야기하지 않았지만, 그것이 정말로 '보고되는' 수익을 증가시키기는 했다.", "이러한 관행은 빠르게 종결되었는데, 왜냐하면 회계사들이 그것이 수익 인식에 대한 원칙의 기준을 충족시키지 않는다고 느꼈기 때문이다."], "ps": [{"n": 1, "ch": [{"e": "Many early dot-com investors", "k": "많은 초기 닷컴 투자자들은"}, {"e": "focused <b>almost entirely<\/b>", "k": "<b>거의 전적으로<\/b> 집중했다"}, {"e": "on <b>revenue growth<\/b>", "k": "<b>수익 증가<\/b>에만"}, {"e": "instead of <b>net income<\/b>.", "k": "<b>순수익<\/b> 대신에."}], "easy": "초기 닷컴 투자자들은 순수익 말고 수익이 늘어나는 것에 거의 전적으로 집중했어요.", "gist": "글의 출발점. 투자자들이 순수익이 아니라 수익 증가를 봤다는 배경을 깐다."}, {"n": 2, "ch": [{"e": "Many early dot-com companies", "k": "많은 초기 닷컴 회사들은"}, {"e": "<b>earned<\/b> most of their revenue", "k": "수입의 대부분을 <b>벌어들였다<\/b>"}, {"e": "from selling advertising space", "k": "광고 게재 공간을 파는 것으로부터"}, {"e": "on their Web sites.", "k": "그들의<span class=\"r\">(= 닷컴 회사들의)<\/span> 웹 사이트에 있는."}], "easy": "초기 닷컴 회사들은 수입 대부분을 자기 웹 사이트의 광고 자리를 팔아서 벌었어요.", "gist": "배경 설명. 이 회사들의 주된 수입원이 광고 공간 판매였다."}, {"n": 3, "ch": [{"e": "To <b>boost reported revenue<\/b>,", "k": "<b>보고되는 수익을 증가시키기<\/b> 위해,"}, {"e": "some sites began", "k": "몇몇 사이트들은 시작했다"}, {"e": "<b>exchanging<\/b> ad space.", "k": "광고 게재 공간을 <b>교환하기<\/b>를."}], "easy": "장부에 보고되는 수익을 키우려고 일부 사이트들이 광고 자리를 서로 맞바꾸기 시작했어요.", "gist": "핵심 사건의 시작. 보고되는 수익을 키우려는 목적으로 광고 공간 교환이 시작됐다."}, {"n": 4, "ch": [{"e": "Company A would put an ad", "k": "A 회사는 광고를 게시하곤 했다"}, {"e": "for its Web site", "k": "그것의<span class=\"r\">(= A 회사의)<\/span> 웹 사이트에 대한"}, {"e": "on company B's Web site,", "k": "B 회사의 웹 사이트에,"}, {"e": "and company B would put an ad", "k": "그리고 B 회사는 광고를 게시하곤 했다"}, {"e": "for its Web site", "k": "그것의<span class=\"r\">(= B 회사의)<\/span> 웹 사이트에 대한"}, {"e": "on company A's Web site.", "k": "A 회사의 웹 사이트에."}], "easy": "A 회사는 자기 사이트 광고를 B 회사 사이트에 올리고, B 회사는 자기 사이트 광고를 A 회사 사이트에 올렸어요.", "gist": "앞 문장의 '교환'이 구체적으로 어떤 것인지 A 회사와 B 회사의 예로 보여 준다."}, {"n": 5, "ch": [{"e": "No money <b>ever changed hands<\/b>,", "k": "돈은 결코 <b ck of competition is able to push prices up. / He pointed to the case of goldsmiths, who earned much higher wages than workers of a similar skill because they were perceived to be trustworthy — a characteristic that is rare and not easily provable. / He noted that large sections of the working classes were barred from entering skilled professions because they entailed many years of education and training.", "ev_ko": [[1, "영국의 정치학자 John Stuart Mill은 재화 시장 안에서만 경쟁 부족이 가격 상승을 유발하는 것은 아니라는 사실을 깨달았다."], [3, "그는 금 세공업자의 사례를 지적했는데, 그들은 (그들이) 신뢰할 만하다고(신뢰할 수 있는 사람들이라고) 여겨졌기 때문에 비슷한 기술을 지닌 (다른) 노동자들보다 훨씬 더 높은 임금을 받고 있었다 — (그들에 대한 신뢰는) 희귀하며 쉽게 증명될 수 없는 특성(이다)."], [6, "그는 그들(전문직)이 상당 기간의 교육과 훈련을 수반하기 때문에 노동자 계층의 상당 부분이 전문직에 진입하지 못하도록 제한받았다는 점에 주목했다."]], "why": ["1번이 <b>not only within the goods market<\/b>(재화 시장 안에서만은 아니다)이라고 했으므로, 빈칸에는 재화 시장이 <b>아닌 다른 시장<\/b>이 들어갑니다", "이어지는 3번의 <b>wages(임금)<\/b>, <b>workers(노동자)<\/b>와 6번의 <b>working classes(노동자 계층)<\/b>, <b>professions(전문직)<\/b>이 모두 일하는 사람과 임금에 관한 사례이므로 그 시장은 <b>노동 시장(labor market)<\/b>입니다."], "ch": [{"n": "①", "t": "labor", "g": "노동", "ok": true, "e": ["뒤에 나오는 사례가 모두 임금, 노동자, 전문직에 관한 것이므로 노동 시장이 맞습니다."]}, {"n": "②", "t": "street", "g": "거리", "ok": false, "e": ["거리 시장에 관한 내용은 지문에 나오지 않습니다."]}, {"n": "③", "t": "gold", "g": "금", "ok": false, "e": ["3번에 goldsmiths(금 세공업자)가 나오지만, 금은 노동 시장에서 독점 효과가 나타난 <b>사례<\/b>일 뿐 시장의 이름이 아닙니다."]}, {"n": "④", "t": "property", "g": "부동산", "ok": false, "e": ["부동산이나 재산 시장에 관한 내용은 지문에 나오지 않습니다."]}, {"n": "⑤", "t": "capital", "g": "자본", "ok": false, "e": ["자본 시장에 관한 설명은 지문에 나오지 않습니다", "글의 초점은 임금과 진입 장벽입니다."]}], "tr": ["영국의 정치학자 John Stuart Mill은 재화 시장 안에서만 경쟁 부족이 가격 상승을 유발하는 것은 아니라는 사실을 깨달았다.", "독점 효과는 노동 시장에서도 또한 일어날 수 있다.", "그는 금 세공업자의 사례를 지적했는데, 그들은 (그들이) 신뢰할 만하다고(신뢰할 수 있는 사람들이라고) 여겨졌기 때문에 비슷한 기술을 지닌 (다른) 노동자들보다 훨씬 더 높은 임금을 받고 있었다 — (그들에 대한 신뢰는) 희귀하며 쉽게 증명될 수 없는 특성(이다).", "이것이 상당한 진입 장벽을 만들어 냈고 그래서 금을 다루는 사람들은 자신들의 서비스에 대해 독점 가격을 요구할 수 있었다.", "Mill은 금 세공업자의 상황이 유일한 사례가 아님을 깨달았다.", "그는 그들(전문직)이 상당 기  "Eye-blocking 행위를 숨기는 전략", "ok": false, "e": ["눈 가리기 행위를 숨기는 전략에 관한 내용은 지문에 나오지 않습니다."]}, {"n": "⑤", "t": "Hiring a Security Guard to Protect a Building", "g": "건물을 지키기 위한 보안 요원 고용하기", "ok": false, "e": ["보안 요원을 고용하라는 글이 아닙니다", "보안 요원은 사례 속 인물일 뿐입니다."]}], "tr": ["눈 가리기(Eye-blocking)는 우리가 위협받는다고 느끼거나 보고 있는 것이 마음에 들지 않을 때 일어날 수 있는 비언어적 행위이다.", "눈을 가늘게 뜨는 것과 (눈을) 감거나 가리는 것은 원하지 않는 이미지들을 뇌가 보지 못하게 하기 위해서 진화해온 행동들이다.", "수사관으로서, 나는 Puerto Rico의 비극적인 호텔 화재의 방화 수사를 돕기 위해 eye-blocking 행위를 이용했다.", "보안 요원 한 명이 그가 배정받은 지역에서 화재가 발생했기 때문에 즉각적인 용의 선상에 올랐다.", "그가 불이 난 것과 아무 관련이 없다는 것을 (우리가) 밝힌 방법 중 하나는 불이 나기 전과, 불이 나던 당시에 그가 어디 있었는지, 그리고 그가 불을 질렀는지 아닌지에 관해 그에게 몇 가지 구체적인 질문을 해 보는 것이었다.", "각각의 질문 뒤에 나는 eye-blocking 행위의(eye-blocking과 관련된) 어떤 숨길 수 없는 징후라도 있는지 (살펴보고자) 그의 얼굴을 관찰했다.", "그는 불이 났을 때 그가 어디에 있었는지에 대한 질문을 받았을 때만 그의 눈을 가렸다.", "그에 반해, 희한하게도 그는 “당신이 불을 질렀습니까?”라는 질문에는 불안해(하는 것처럼) 보이지 않았다.", "이것은 진짜 문제는 화재 당시 그의 위치였다는 점을 내게 알려주었다.", "그는 수사관들로부터 심도 있게 질문을 받았고, 마침내 역시(같은) 호텔에서 일하던 여자 친구를 만나러 자기 자리를 떠나 있었다는 점을 인정했다.", "불행하게도, 그가 (자리를) 떠나 있는 동안, 방화범들이 그가 지키고 있어야 했던 구역에 들어와 불을 낸 것이었다.", "이 경우에, 보안 요원의 eye-blocking 행위는 결국 사건을 해결하는 일련의 심문을 계속하는 데 필요한 통찰력을 우리에게 주었다."], "ps": [{"n": 1, "ch": [{"e": "<b>Eye-blocking<\/b> is a <b>nonverbal<\/b> behavior", "k": "<b>눈 가리기<\/b>는 <b>비언어적<\/b> 행위이다"}, {"e": "that can occur", "k": "일어날 수 있는"}, {"e": "when we feel <b>threatened<\/b>", "k": "우리가 <b>위협받는다<\/b>고 느낄 때"}, {"e": "or don't like what we see.", "k": "또는 보고 있는 것이 마음에 들지 않을 때."}], "easy": "눈 가리기는 말이 아닌 몸짓이에요. 위협을 느끼거나 눈앞의 것이 싫을 때 나올 수 있어요.", "gist": "개념 정의. 글의 주제인 눈 가리기가 무엇인지 소개한다."}, {"n": 2, "ch": [{"e": "<b>Squinting<\/b> and closing or <b>shielding<\/b> our eyes", "k": "눈을 <b>가늘게 뜨는 것<\/b>과 눈을 감거나 <b>가리는 것<\/b>은"}, {"e": "are actions", "k": "행동들이다"}, {"e": "that have <b>evolved<\/b>", "k": "<b>진화해 온<\/b>"}, {"e": "to protect the brain", "k": "뇌를 보호하기 위해"}, {"e": "from seeing <b>undesirable<\/b> images.", "k": "원하지 않는 이미지를 보는 것으로부터."}], "easy": "눈을 찡그리거나 감거나 가리는 건, 뇌가 보기 싫은 장면을 보지 않도록 지키려고  He + 동사 was questioned (수동태). further = 부사: was questioned 꾸밈 / by ~ = 전치사구(부사구): 행위자", "and: 병렬. eventually = 부사: admitted 꾸밈. admitted: 1형식. to leaving his post = 전치사구: admitted 꾸밈, 거의 필수에 가까운 부사구. to visit ~ = 목적: leaving 꾸밈", "who ~ = 계속적 관계절(형용사절): his girlfriend 보충 설명"], "steps": [{"t": "이 문장은 <b>한 주어에 동사구 2개가 병렬</b>된 문장이다. 앞은 <b>S+V(수동, 1형식)</b>, 뒤는 <b>V+(admit to -ing)</b>이다. 끝의 계속적 관계절 때문에 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: He (그 — 앞 문장이 없어 지칭 확인 불가)", "V1: was questioned (question 질문하다, 수동태) — by the investigators (수사관들에게, investigator 수사관) + further 더 깊이", "V2: admitted to (admit to ~를 인정하다) + leaving his post (자기 자리를 떠난 것, leave 떠나다, post 자리/초소)", "뼈대 = <b>He was questioned ... and eventually admitted to leaving his post</b>"]}, {"t": "admitted to의 <b>to는 전치사</b>라서 뒤에 동명사 leaving이 왔다. to부정사의 to가 아니다. admit to -ing는 '~했다고 인정하다'로 읽고, to leaving 이하는 거의 필수에 가까운 전치사구로 본다."}, {"t": "<b>to visit his girlfriend</b>는 '여자 친구를 만나러'라는 <b>목적의 to부정사</b>이다 (visit 방문하다, eventually 마침내)."}, {"t": "<b>, who also worked at the hotel</b>은 his girlfriend를 보충 설명하는 <b>계속적 용법 관계절</b>이다. who = his girlfriend (여자 친구)이고, '그런데 그녀는 ~'처럼 이어 읽는다."}], "sum": "그, 수사관 추궁에 여자 친구 만나러 자리 비웠다고 인정"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2023년 3월 32번", "ans": "②", "tr": [["1", "많은 초기 닷컴 투자자들은 순이익 대신 거의 전적으로 수익 증가에만 집중했다."], ["2", "많은 초기 닷컴 회사들은 수입의 대부분을 자사 웹 사이트의 광고 게재 공간을 파는 데서 벌었다."], ["3", "보고되는 수익을 끌어올리기 위해, 몇몇 사이트는 광고 게재 공간을 서로 교환하기 시작했다."], ["4", "A 회사는 자기 사이트 광고를 B 회사 사이트에 걸고, B 회사는 자기 사이트 광고를 A 회사 사이트에 거는 식이었다."], ["5", "돈은 한 번도 오가지 않았지만, 각 회사는 (내어준 공간의 가치만큼) 수익을, 그리고 (상대 사이트에 실은 자기 광고의 가치만큼) 비용을 장부에 기록했다."], ["6", "이 관행은 순이익을 늘리는 데 거의 도움이 되지 않았고 ______ — 그러나 '보고되는' 수익은 정말로 늘려 주었다."], ["7", "이 관행은 수익 인식 원칙의 기준에 맞지 않는다고 회계사들이 판단하면서 금세 중단되었다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "No money ever changed hands, but each company recorded revenue and expense."}, {"en": false, "h": "핵심은 <b>No money ever changed hands</b>(돈이 한 번도 주인을 바꾸지 않았다)이다. 서로 광고를 걸어 주기만 했으니 장부에는 숫자가 올라가도 <b>실제 현금은 들어오지 않았다</b>. 빈칸은 이 사실을 그대로 바꿔 쓴 자리이다."}], "opts": [{"n": "①", "t": "simplified the Web design process", "a": false, "x": true, "trap": false, "e": "웹 디자인 과정에 관한 언급이 전혀 없다."}, {"n": "②", "t": "resulted in no additional cash inflow", "a": true, "x": false, "trap": false, "e": "No money ever changed hands를 '추가 현금 유입이 없었다'로 바꿔 쓴 표현이다."}, {"n": "③", "t": "decreased the salaries of the employees", "a": false, "x": true, "trap": false, "e": "직원 급여는 이 글에 나오지 않는다."}, {"n": "④", "t": "intensified competition among companies", "a": false, "x": true, "trap": true, "e": "A사와 B사는 경쟁이 아니라 서로 광고를 걸어 주는 <b>협력</b> 관계로 등장한다."}, {"n": "⑤", "t": "triggered conflicts on the content of Web ads", "a": false, "x": true, "trap": false, "e": "광고 내용을 두고 다툼이 있었다는 내용은 없다. 문제 삼은 것은 회계 처리 방식이다."}], "w": [["investor", "투자자"], ["revenue", "수익, 매출"], ["net income", "순이익"], ["earn", "(돈을) 벌다"], ["boost", "증가시키다"], ["exchange", "교환하다"], ["change hands", "주인이 바뀌다"], ["record", "기록하다"], ["expense", "비용, 지출"], ["give up", "~을 내어주다"], ["practice", "관행, 관례"], ["be put to an end", "종결되다"], ["accountant", "회계사"], ["criteria", "기준"], ["recognition", "인식, 인정"]]}, {"q": "08", "type": "빈칸 추론", "src": "2016년 6월 31번", "ans": "①", "tr": [["1", "영국의 정치학자 John Stuart Mill은 경쟁 부족이 가격을 밀어올리는 것이 재화 시장 안에서만 일어나는 일은 아니라는 사실을 깨달았다."], ["2", "독점 효과는 ______ 시장에서도 일어날 수 있다."], ["3", "그는 금 세공업자의 사례를 지적했는데, 그들은 신뢰할 만하다고 여겨졌기 때문에 비슷한 기술을 지닌 다른 노동자들보다 훨씬 높은 임금을 받았다 — 신뢰란 희귀하고 쉽게 증명되지 않는 특성이다."], ["4", "이것이 상당한 진입 장벽을 만들어 냈고, 그 덕에 금을 다루는 사람들은 자기 서비스에 독점 가격을 요구할 수 있었다."], ["5", "Mill은 금 세공업자의 상황이 유일한 사례가 아님을 깨달았다."], ["6", "그는 노동자 계층의 상당 부분이 전문직에 진입하지 못하도록 제한받았다는 점에 주목했는데, 그런 직업은 수년간의 교육과 훈련을 수반하기 때문이었다."], ["7", "이 과정을 통해 누군가를 뒷바라지하는 비용은 대부분의 가정에게는 감당할 수 없는 것이었고, 그래서 그것을 감당할 수 있는 사람들은 예상보다 훨씬 높은 임금을 누릴 수 있었다."]], "evh": "1번 문장", "ev": [{"en": true, "h": "John Stuart Mill realized that it is not only within the goods market that a lack of competition is able to push prices up."}, {"en": false, "h": "문장 1이 <b>not only within the goods market</b>이라고 못을 박았으므로, 빈칸에는 재화 시장이 <b>아닌 다른 시장</b>이 들어가야 한다. 이어지는 예시가 전부 <b>wages(임금)</b>·<b>workers</b>·<b>working classes</b>·<b>professions</b>이므로 그 시장은 <b>노동 시장</b>이다."}], "opts": [{"n": "①", "t": "labor", "a": true, "x": false, "trap": false, "e": "뒤따르는 예시가 모두 임금과 노동자·전문직에 관한 것이므로 노동 시장이 맞다."}, {"n": "②", "t": "street", "a": false, "x": true, "trap": false, "e": "거리 시장에 관한 언급이 없다."}, {"n": "③", "t": "gold", "a": false, "x": true, "trap": true, "e": "goldsmiths라는 단어에 끌리기 쉽지만, 금은 노동 시장을 설명하기 위한 <b>예시</b>일 뿐 시장 자체가 아니다."}, {"n": "④", "t": "property", "a": false, "x": true, "trap": false, "e": "부동산이나 재산 시장은 다루지 않는다."}, {"n": "⑤", "t": "capital", "a": false, "x": true, "trap": false, "e": "자본 시장에 관한 설명은 나오지 않는다. 글의 초점은 임금과 진입 장벽이다."}], "w": [["political scientist", "정치학자"], ["lack of competition", "경쟁 부족"], ["push up", "밀어올리다"], ["monopoly", "독점"], ["emerge", "일어나다, 생겨나다"], ["goldsmith", "금 세공업자"], ["wage", "임금"], ["perceive", "여기다, 생각하다"], ["trustworthy", "신뢰할 만한"], ["rare", "희귀한"], ["provable", "증명할 수 있는"], ["barrier", "장벽"], ["isolated", "유일한, 고립된"], ["bar A from v-ing", "A가 ~하지 못하게 막다"], ["profession", "전문직"], ["entail", "수반하다"], ["out of reach", "감당할 수 없는"], ["afford", "감당하다"]]}, {"q": "09", "type": "글의 순서", "src": "2018년 6월 35번", "ans": "③", "tr": [["1", "[주어진 글] 당신의 이야기가 당신을 특별하게 만든다. 하지만 어려운 지점은, 자기 이야기를 하지 않으면서 자기가 얼마나 특별한지를 보여 주는 일이다. 효과적인 자기 상품화는 늘 자기 자신에 관해 이야기하는 것이 아니다."], ["2", "[(B)] 친구와 가족이 컴퓨터 옆에서 당신이 무엇을 하고 있는지 소식을 들으려고 간절히 기다리고 있다고 다들 믿고 싶겠지만, 그렇지 않다."], ["3", "[(C)] 사실 그들은 당신이 컴퓨터 앞에 앉아 '그들에 관한' 소식을 기다려 주기를 바란다. 개인 브랜드를 구축하는 최선의 방법은 자기 이야기보다 다른 사람·사건·생각에 관해 더 많이 이야기하는 것이다."], ["4", "[(A)] 그렇게 함으로써 당신은 그들의 성취와 생각을 추켜세워 주고, 영향력 있는 사람이 된다. 당신은 도움이 될 뿐 아니라 귀중한 자산인 사람으로 보이게 된다. 그것이 자기 이야기만 계속 반복하는 것보다 당신의 브랜드에 더 도움이 된다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "(B) they're not. → (C) Actually, they're hoping you're sitting by your computer, waiting for news about them."}, {"en": false, "h": "(B)의 마지막이 <b>they're not</b>이라는 부정으 function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){

    });

  app.innerHTML=h;

    if(quiz.done)return;
