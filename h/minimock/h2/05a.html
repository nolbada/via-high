<title>고2 미니모의고사 5회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}
.evx .en{background:#fff;border:1px solid #d5eadc;font-size:15.5px;margin:0 0 8px}
.evx p{margin:6px 0;font-size:15.5px;line-height:1.75}
.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}
.ch.open .ct{display:block}

.sc .sc-h{cursor:default;padding:9px 14px}.sc .sc-h .chv{display:none}
.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}
.sc .ce{font-size:18px;line-height:1.5;font-weight:800;color:#c62828}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}
.rst:before{content:"결국 이 얘기  ";font-size:11.5px;font-weight:800;color:#8a6d00}

.rdb{display:flex;flex-direction:column}

.wc{padding:14px 0;border-bottom:1px solid var(--line)}

.wc .h .no{color:var(--sub);font-size:13px;min-width:20px}

function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}
document.addEventListener('click',function(e){
  const el=e.target.closest&&e.target.closest('.dw');if(!el)return;
  e.stopPropagation();e.preventDefault();
  const p=el.closest('[data-q]');const it=p&&dwItem(p.dataset.q,el.dataset.k);if(!it)return;
  const head=it[2]||it[0],mean=it[1];S.dw=S.dw||{};const on=!S.dw[head];

},true);

t": "<b>and that one of the advantages ~</b>는 또 하나의 that절이다.", "sub": ["S: one (하나). of the advantages (장점들 중)과 of human judgment (인간 판단의)는 모두 앞 명사를 꾸미는 전치사구", "V: is, C: the ability (능력). to detect change (변화를 감지할)는 ability를 꾸미는 to부정사(형용사적 용법)"]}, {"t": "함정: 두 번째 that절의 붙는 자리가 헷갈린다. 여기서는 noted의 목적어로 읽는다 (문형 기준). 앞의 it is not clear 뒤 that절과 병렬로 읽을 수도 있어서 헷갈리기 쉽다. '~라고 언급했다'."}], "sum": "변화하는 환경에서는 일관성이 늘 미덕은 아니고, 인간 판단은 변화 감지가 강점"}, {"i": "08", "q": "06", "s": "3", "title": "S+V+O + by 동명사 병렬(have+O+원형)", "eng": "Blattberg and Hoch examined<sup>1</sup> this possibility / by having<sup>2</sup> supermarket managers forecast<sup>3</sup> demand<sup>4</sup> for certain products / and then creating a composite<sup>5</sup> forecast / by averaging<sup>6</sup> these judgments with the forecasts of statistical models.", "notes": [["1", "examine", "조사하다, 검증하다"], ["2", "have + O + 동사원형", "O가 ~하게 하다"], ["3", "forecast", "예측하다; 예측"], ["4", "demand", "수요"], ["5", "composite", "종합된"], ["6", "average", "평균 내다"]], "lit": "Blattberg와 Hoch는 이 가능성을 검증했다 / 슈퍼마켓 관리자들에게 특정 제품의 수요를 예측하게 함으로써 / 그리고 그다음 종합 예측치를 만들어 냄으로써 / 이 판단들을 통계 모형의 예측과 평균 냄으로써", "nat": "두 사람은 슈퍼마켓 관리자들에게 특정 제품의 수요를 예측하게 한 뒤, 그 판단을 통계 모형의 예측과 평균 내어 종합 예측치를 만드는 방식으로 이 가능성을 검증했다.", "ana": "<b>by -ing</b>가 '~함으로써'인데, 여기서는 <b>having</b>과 <b>creating</b>이 and로 <b>병렬</b>이라 by 하나에 둘 다 걸립니다. <b>have + 목적어 + 동사원형</b>은 사역 구문이라 forecast에 -s나 to가 붙지 않습니다 — 이것을 명사 forecast로 읽으면 문장이 무너집니다. 뒤의 <b>by averaging</b>은 앞의 by와 다른 층위로, creating의 <b>방법</b>을 설명합니다.", "pe": "Blattberg and Hoch examined<sup>1</sup> this possibility / \u0001by having<sup>2</sup> supermarket managers forecast<sup>3</sup> demand<sup>4</sup> for certain products\u0002 / \u0001and then creating a composite<sup>5</sup> forecast\u0002 / \u0001by averaging<sup>6</sup> these judgments with the forecasts of statistical models\u0002.", "pk": "Blattberg와 Hoch는 이 가능성을 검증했다 / \u0001슈퍼마켓 관리자들에게 특정 제품의 수요를 예측하게 함으로써\u0002 / \u0001그리고 그다음 종합 예측치를 만들어 냄으로써\u0002 / \u0001이 판단들을 통계 모형 var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">목적 문제는 <b>But</b>(하지만)으로 생긴 문제 상황 다음에 나오는 <b>I'd like to</b>(~하고 싶습니다)·<b>Please</b>(~해 주세요) 문장이 진짜 용건이에요. 앞의 등록·예치금 이야기는 배경일 뿐이에요.</p><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 배경 (이미 등록함)</span><div class=\"en\">So I didn't hesitate to sign up and pay the non-refundable deposit <mark>for the second week program</mark>, which is from July 13 to 17.</div><p class=\"ko\">그래서 저는 망설이지 않고 7월 13일부터 17일까지인 <mark>둘째 주 프로그램을 위해</mark> 등록하고 환불이 불가능한 예치금을 지불했습니다.</p></div><div class=\"ck-via\"><i>▼</i><span>But(하지만)으로 꺾이며 첫날에 못 온다는 문제가 생겨요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 문제 상황</span><div class=\"en\"><mark>But</mark> today I remembered that our family is going to get back from a trip on July 13, and I'm afraid Bradley won't be able to make it on the very first day of the program.</div><p class=\"ko\"><mark>하지만</mark> 오늘 저는 우리 가족이 7월 13일에 여행에서 돌아올 예정이라는 것을 기억해 냈고, 걱정스럽게도 Bradley가 프로그램의 바로 첫날에 참가할 수 없을 것 같습니다.</p></div><div class=\"ck-via\"><i>▼</i><span>문제를 어떻게 풀고 싶은지 I'd like to(~하고 싶습니다)로 용건이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">Rather than make him skip the day, I'd like to check to see if he could <mark>switch to the third week program</mark>.</div><p class=\"ko\">그(= Bradley)가 그날을 빠지게 하기보다는, 저는 그가 <mark>셋째 주 프로그램으로</mark> 바꿀 수 있는지 확인해 보고 싶습니다.</p></div><div class=\"ck-via\"><i>▼</i><span>Please(~해 주세요)로 가능한지 답을 달라고 확인해요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 요청 마무리</span><div class=\"en\"><mark>Please let us know</mark> if that's possible.</div><p class=\"ko\">그것(= 셋째 주 프로그램으로 바꾸는 것)이 가능한지 <mark>저희에게 알려 주시기 바랍니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">캠프 참가 시기를 변경할 수 있는지 문의하려고<small>6번 switch to the third week(셋째 주로 바꾸다) + 7번 if that's possible(가능한지)을 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">캠프 등록 시 지불한 예치금 환불을 요구하려고</span><span class=\"why\">[반대] 4번의 deposit(예치금)만 보고 고르면 걸려요. 오히려 non-refundable(환불이 불가능한)이라고 했고, 돈을 돌려 달라는 말은 한 번도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">캠프 참가를 위해 여행 일정을 조정하려고</span><span class=\"why\">[지문에 없음] 5번의 여행 일정은 그대로 두고, 6번에서 캠프 주차를 바꾸려고 해요. 바꾸려는 건 여행이 아니라 캠프예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">캠프 일정이 분명하지 않은 것에 대해 항의하려고</span><span class=\"why\">[지문에 없음] 4번에 7월 13일부터 17일까지로 일정이 분명히 나와요. 3번에서는 캠프 소식에 thrilled(무척 설렌)라며 기뻐해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">예약한 캠프 프로그램의 변경된 내용을 확인하려고</span><span class=\"why\">[지문에 없음] 캠프 쪽에서 내용을 바꾼 게 아니에요. 6번에서 바꾸고 싶어 하는 쪽은 편지를 쓴 엄마이고, 묻는 건 셋째 주로 옮길 수 있는지예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Dear Coach Johnson,</div><div class=\"k\">Johnson 코치님께,</div></div><div class=\"rnat\">Johnson 코치님께,</div><div class=\"rst\">태권도 관장님께 보내는 문자를 떠올려 봐요. 지문도 존슨(Johnson) 코치님께 쓰는 편지로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">My name is Christina Markle,</div><div class=\"k\">제 이름은 Christina Markle이고,</div></div><div class=\"rc\"><div class=\"e\">Bradley Markle's mother.</div><div class=\"k\">Bradley Markle의 엄마입니다.</div></div><div class=\"rnat\">제 이름은 Christina Markle이고, Bradley Markle의 엄마입니다.</div><div class=\"rst\">“안녕하세요, 민준이 엄마예요.” 하고 자기소개를 하죠. 지문도 브래들리(Bradley)의 엄마라고 먼저 밝혀요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Bradley and I were thrilled</div><div class=\"k\">Bradley와 저는 무척 설렜습니다</div></div><div class=\"rc\"><div class=\"e\">to learn that you're holding</div><div class=\"k\">당신(= 코치님)이 열 것이라는 것을 알게 되어</div></div><div class=\"rc\"><div class=\"e\">your Gymnastics Summer Camp</div><div class=\"k\">당신의 체조 여름 캠프를</div></div><div class=\"rc\"><div class=\"e\">again this year.</div><div class=\"k\">올해 또다시.</div></div><div class=\"rnat\">Bradley와 저는 당신(코치)이 올해 또다시 여름 체조 캠프를 열 것이라는 것을 알게 되어 설렜습니다.</div><div class=\"rst\">“올해도 여름 캠프를 연다니 아이랑 너무 기뻤어요!” 지문도 체조 여름 캠프 소식에 무척 설렜다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">So I didn't hesitate</div><div class=\"k\">그래서 저는 망설이지 않았습니다</div></div><div class=\"rc\"><div class=\"e\">to sign up and pay the non-refundable deposit</div><div class=\"k\">등록하고 환불이 불가능한 예치금을 지불하는 것을</div></div><div class=\"rc\"><div class=\"e\">for the second week program,</div><div class=\"k\">둘째 주 프로그램을 위해,</div></div><div class=\"rc\"><div class=\"e\">which is from July 13 to 17.</div><div class=\"k\">그것(= 둘째 주 프로그램)은 7월 13일부터 17일까지입니다.</div></div><div class=\"rnat\">그래서 저는 7월 13일부터 17일까지의 둘째 주 프로그램에 등록하고 환불이 불가능한 예치금을 지불하기를 주저하지 않았습니다.</div><div class=\"rst\">그래서 바로 둘째 주 캠프를 신청하고 돌려받을 수 없는 돈도 냈어요. = 지문 4번, 7월 13~17일 <b>둘째 주</b> 등록 이야기예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But</span> today I remembered</div><div class=\"k\"><span class=\"cw\">하지만</span> 오늘 저는 기억해 냈습니다</div></div><div class=\"rc\"><div class=\"e\">that our family is going to get back from a trip</div><div class=\"k\">우리 가족이 여행에서 돌아올 예정이라는 것을</div></div><div class=\"rc\"><div class=\"e\">on July 13,</div><div class=\"k\">7월 13일에,</div></div><div class=\"rc\"><div class=\"e\">and I'm afraid</div><div class=\"k\">그리고 걱정스럽게도</div></div><div class=\"rc\"><div class=\"e\">Bradley won't be able to make it</div><div class=\"k\">Bradley가 참가할 수 없을 것 같습니다</div></div><div class=\"rc\"><div class=\"e\">on the very first day of the program.</div><div class=\"k\">프로그램의 바로 첫 날에.</div></div><div class=\"rnat\">하지만 오늘 저는 우리 가족이 7월 13일에 여행에서 돌아올 예정이라는 것을 기억해 냈고, 그래서 Bradley가 그 프로그램의 바로 첫 날에 참가할 수 없을 것 같습니다.</div><div class=\"rst\"><b>하지만</b>(But) 13일은 가족 여행에서 돌아오는 날이라 첫날을 못 가요. = 지문 5번, 여기서 문제 상황이 생겨요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Rather than make him skip the day,</div><div class=\"k\">그(= Bradley)가 그 날을 빠지게 하기보다는,</div></div><div class=\"rc\"><div class=\"e\">I'd like to check to see</div><div class=\"k\">저는 확인해 보고 싶습니다</div></div><div class=\"rc ckc\"><div class=\"e\">if he could <span class=\"cw\">switch</span></div><div class=\"k\"><span class=\"cw\">그가 바꿀 수 있는지</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to the third week program.</span></div><div class=\"k\"><span class=\"cw\">셋째 주 프로그램으로.</span></div></div><div class=\"rnat\">그(Bradley)가 그 날(프로그램의 첫 날)을 빠지게 하기보다는, 저는 그가 셋째 주 프로그램으로 변경할 수 있는지 알아보기 위해 확인을 하고 싶습니다.</div><div class=\"rst\">“첫날을 빼먹느니 <b>셋째 주로 바꿀 수 있을까요?</b>” 지문 6번의 switch(바꾸다)가 바로 편지의 목적이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Please let us know</span></div><div class=\"k\"><span class=\"cw\">저희에게 알려 주시기 바랍니다</span></div></div><div class=\"rc\"><div class=\"e\">if that's possible.</div><div class=\"k\">그것(= 셋째 주 프로그램으로 바꾸는 것)이 가능한지.</div></div><div class=\"rnat\">그것(셋째 주 프로그램으로의 변경)이 가능하다면 저희에게 알려주시기 바랍니다.</div><div class=\"rst\">“가능한지 꼭 알려 주세요.” 지문 7번도 <b>알려 달라</b>(let us know)며 그 문의를 마무리해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Thank you.</div><div class=\"k\">감사합니다.</div></div><div class=\"rnat\">감사합니다.</div><div class=\"rst\">“감사합니다.” 하고 인사를 덧붙이죠. 지문도 짧게 고맙다고 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Sincerely,</div><div class=\"k\">진심을 담아,</div></div><div class=\"rc\"><div class=\"e\">Christina Markle</div><div class=\"k\">Christina Markle (드림)</div></div><div class=\"rnat\">진심을 담아, Christina Markle (드림)</div><div class=\"rst\">문자 끝에 이름을 쓰듯, 지문도 보낸 사람 크리스티나 마클(Christina Markle)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"hesitate to\" data-m=\"~하기를 망설이다\"><b>hesitate to</b>~하기를 망설이다</button><button type=\"button\" class=\"wdb\" data-w=\"non-refundable\" data-m=\"환불이 불가능한\"><b>non-refundable</b>환불이 불가능한</button><button type=\"button\" class=\"wdb\" data-w=\"deposit\" data-m=\"예치금, 보증금\"><b>deposit</b>예치금, 보증금</button><button type=\"button\" class=\"wdb\" data-w=\"make it\" data-m=\"(시간에 맞춰) 가다, 참가하다\"><b>make it</b>(시간에 맞춰) 가다, 참가하다</button><button type=\"button\" class=\"wdb\" data-w=\"rather than\" data-m=\"~하기보다는\"><b>rather than</b>~하기보다는</button><button type=\"button\" class=\"wdb\" data-w=\"switch to\" data-m=\"~로 바꾸다\"><b>switch to</b>~로 바꾸다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">심경 변화는 <b>맨 앞 감정</b>과 <b>맨 뒤 감정</b>만 잡으면 돼요. 1번 <b>sadly</b>(슬프게)로 시작해, 아이들이 몰래 준비한 봉투(2~6번)를 받고 7·8번에서 말을 잃고 울어요. 이 눈물은 슬픔이 아니라 <b>감동</b>이에요.</p><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · 처음 감정</span><div class=\"en\">… but I had <mark>sadly</mark> stated to one of my four kids that <mark>regretfully</mark>, I was going to miss the reunion because I just couldn't afford the trip.</div><p class=\"ko\">하지만 저는 <mark>슬프게</mark> 말해 두었었습니다 나의 네 자녀 중 한 명에게 <mark>유감스럽게도</mark> 내가 그 동창회를 놓치게 될 것이라고 내가 도저히 그 여행을 할 형편이 못 되어서.</p></div><div class=\"ck-via\"><i>▼</i><span>형편이 안 돼 포기했는데, Then(그러던) 어느 날 봉투가 와요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 전환 지점</span><div class=\"en\"><mark>Then</mark> one evening my youngest daughter, Kelly, handed me an envelope and said, “Read this later.”</div><p class=\"ko\"><mark>그러던 어느 날 저녁,</mark> 나의 막내딸인 Kelly가 나에게 봉투 하나를 건넸습니다 그리고 말했습니다, “이것을 나중에 읽어 보세요.”</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>평생 한 번뿐이니 꼭 가라는 편지</span><span><em>4번</em>왕복 항공권과 현금 약 200달러</span><span><em>5번</em>사 남매가 돈을 모아 보내 주기로 함</span><span><em>6번</em>갚을 생각은 하지도 마세요</span></div><div class=\"ck-eq\">⇒ 못 가던 이유(돈)를 아이들이 다 해결해 줌 = 고마움이 쌓여요</div></div><div class=\"ck-via\"><i>▼</i><span>아이들의 선물을 다 본 뒤의 반응</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 나중 감정</span><div class=\"en\">I sat there <mark>in stunned silence</mark>.</div><p class=\"ko\">나는 거기에 앉아 있었습니다 <mark>놀라서 할 말을 잃은 채로</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>슬픈 눈물이 아니라 고마워서 흘린 눈물이에요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 감동의 눈물</span><div class=\"en\">And I <mark>wept</mark>.</div><p class=\"ko\">그리고 나는 <mark>눈물을 흘렸습니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">sorrowful → touched 슬픈 → 감동한<small>1번 sadly(슬프게) → 7·8번 할 말을 잃고 눈물, 아이들 선물 덕분이라 감동이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">excited → disappointed 신이 난 → 실망한</span><span class=\"why\">앞·뒤 둘 다 틀려요. 1번은 sadly(슬프게)라 신난 게 아니고, 8번 wept(눈물을 흘렸다)를 실망으로 읽으면 함정이에요. 4·5번 선물을 받은 뒤라 감동의 눈물이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">jealous → satisfied 질투하는 → 만족한</span><span class=\"why\">앞 감정이 틀려요. 1번에서 누구를 부러워하는 게 아니라 돈이 없어 동창회를 못 가서 슬퍼해요. 뒤도 만족보다 말을 잃고 우는 감동이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">panicked → relieved 공황 상태에 빠진 → 안도한</span><span class=\"why\">앞 감정이 틀려요. 1번은 급하게 당황한 게 아니라 regretfully(유감스럽게도) 포기한 슬픔이에요. 7번 stunned silence(놀라 할 말을 잃음)도 안도보다 감동이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">frightened → indifferent 겁먹은 → 무관심한</span><span class=\"why\">앞·뒤 둘 다 틀려요. 1번에 무서워할 일이 없고, 8번에서 눈물을 흘리니 무관심은 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Our class of 1960</div><div class=\"k\">우리 1960년 동기생들이</div></div><div class=\"rc\"><div class=\"e\">was going to be returning</div><div class=\"k\">다시 돌아올 예정이었습니다</div></div><div class=\"rc\"><div class=\"e\">for our momentous 50th reunion,</div><div class=\"k\">우리의 중요한 50주년 동창회를 위해,</div></div><div class=\"rc ckc\"><div class=\"e\">but I had <span class=\"cw\">sadly</span> stated</div><div class=\"k\">하지만 저는 <span class=\"cw\">슬프게</span> 말해 두었었습니다</div></div><div class=\"rc\"><div class=\"e\">to one of my four kids</div><div class=\"k\">나의 네 자녀 중 한 명에게</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">regretfully</span>,</div><div class=\"k\"><span class=\"cw\">유감스럽게도</span></div></div><div class=\"rc\"><div class=\"e\">I was going to miss the reunion</div><div class=\"k\">내가 그 동창회를 놓치게 될 것이라고</div></div><div class=\"rc\"><div class=\"e\">because I just couldn't afford the trip.</div><div class=\"k\">내가 도저히 그 여행을 할 형편이 못 되어서.</div></div><div class=\"rnat\">우리 1960년 동기생들이 우리의 중요한 50주년 동창회를 위해 다시 돌아올 것이었지만(모일 예정이었지만), (그 전에 이미) 나는 나의 네 자녀 중 한 명에게 내가 도저히 그 여행을 할 형편이 못 되어서 유감스럽게도 내가 동창회를 놓치게 될 것이라고 슬프게 말했었다(말해 놓은 상태였다).</div><div class=\"rst\">나는 50년 만의 동창회를 손꼽아 기다렸는데 “비행기 값이 없어 못 가겠다” 하며 <b>슬퍼해요</b>. = 지문 1번의 처음 감정, sadly(슬프게)예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Then one evening</div><div class=\"k\">그러던 어느 날 저녁,</div></div><div class=\"rc\"><div class=\"e\">my youngest daughter, Kelly,</div><div class=\"k\">나의 막내딸인 Kelly가</div></div><div class=\"rc\"><div class=\"e\">handed me an envelope</div><div class=\"k\">나에게 봉투 하나를 건넸습니다</div></div><div class=\"rc\"><div class=\"e\">and said,</div><div class=\"k\">그리고 말했습니다,</div></div><div class=\"rc\"><div class=\"e\">“Read this later.”</div><div class=\"k\">“이것을 나중에 읽어 보세요.”</div></div><div class=\"rnat\">그러던 어느 날 저녁, 나의 막내딸인 Kelly가 나에게 봉투 하나를 건네더니, \"이것을 나중에 읽어보세요.\"(라고) 말했다.</div><div class=\"rst\"><b>그러던 어느 날</b>(Then) 막내딸 켈리(Kelly)가 봉투를 내밀며 “나중에 읽어 보세요” 해요. 지문의 전환 지점이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">A letter inside the envelope</div><div class=\"k\">봉투 속의 편지는</div></div><div class=\"rc\"><div class=\"e\">lectured me all about</div><div class=\"k\">나에게 설교했습니다(잔소리를 늘어놓았습니다), ~에 관한 모든 것을</div></div><div class=\"rc\"><div class=\"e\">how important old friendships are at all ages</div><div class=\"k\">모든 연령대에서 오래된 우정이 얼마나 중요한지</div></div><div class=\"rc\"><div class=\"e\">and that I absolutely “must attend my 50th reunion</div><div class=\"k\">그리고 내가 반드시 “나의 50주년 동창회에 참석해야만 한다”는 것을</div></div><div class=\"rc\"><div class=\"e\">since it is a once in a lifetime event.”</div><div class=\"k\">“그것(= 50주년 동창회)이 평생 단 한 번뿐인 행사이기 때문에.”</div></div><div class=\"rnat\">그 봉투 속의 편지는 모든 연령대에서 오래된 우정이 얼마나 중요한지에 관한 온갖(모든) 것들을 (나에게 설교하고), 그리고 '그것이 평생 단 한 번뿐인 행사이기 때문에' 내가 반드시 '나의 50주년 동창회에 참석해야만 한다'며 나에게 설교했다(잔소리를 늘어놓았다).</div><div class=\"rst\">봉투 속 편지는 “친구는 평생 소중해요, 평생 한 번뿐이니 꼭 가세요!” 하고 잔소리를 해요. 지문 3번의 편지 내용이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Included within was</div><div class=\"k\">그 안에는 포함되어 있었습니다</div></div><div class=\"rc\"><div class=\"e\">a round-trip airline ticket</div><div class=\"k\">왕복 항공권과</div></div><div class=\"rc\"><div class=\"e\">to and from Syracuse</div><div class=\"k\">Syracuse 착발의</div></div><div class=\"rc\"><div class=\"e\">and roughly $200 cash.</div><div class=\"k\">대략 200달러의 현금이.</div></div><div class=\"rnat\">안에는 Syracuse 착발의 왕복 항공권과 대략 200달러의 현금이 포함되어 있었다.</div><div class=\"rst\">그 안에 왕복 비행기표와 용돈 약 200달러가 들어 있어요. = 지문 4번, 못 가던 이유인 돈 문제가 풀렸어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The letter stated</div><div class=\"k\">그 편지는 말했습니다(적혀 있었습니다)</div></div><div class=\"rc\"><div class=\"e\">that all four siblings had met</div><div class=\"k\">사 남매 모두가 만났고</div></div><div class=\"rc\"><div class=\"e\">and agreed to pool their money</div><div class=\"k\">그들(= 사 남매)의 돈을 모으는 데 동의했다고</div></div><div class=\"rc\"><div class=\"e\">to get me to the reunion.</div><div class=\"k\">나를 동창회에 보내기 위해.</div></div><div class=\"rnat\">그 편지에는 사 남매 모두가 만나서 나를 동창회에 보내기 위해 그들의 돈을 모으는 데 동의했다고 적혀 있었다.</div><div class=\"rst\">알고 보니 아이 넷이 몰래 모여 돈을 모았대요. 지문 5번, 사 남매가 부모님을 동창회에 보내려고 힘을 합쳤어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">“And don’t even think about payback!”</div><div class=\"k\">“그리고 갚을 생각은 하지도 마세요!”</div></div><div class=\"rnat\">\"그리고 (돈을) 갚을 생각은 하지도 마세요!\"</div><div class=\"rst\">“갚을 생각은 하지도 마세요!” 하고 못 박아요. 지문 6번의 이 한마디에 마음이 뭉클해져요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">I sat there</div><div class=\"k\">나는 거기에 앉아 있었습니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in stunned silence</span>.</div><div class=\"k\"><span class=\"cw\">놀라서 할 말을 잃은 채로</span>.</div></div><div class=\"rnat\">나는 놀라서 할 말을 잃은 채로 그곳에 앉아 있었다.</div><div class=\"rst\">나는 너무 놀라 <b>아무 말도 못 하고</b>(stunned silence) 앉아 있어요. = 지문의 나중 감정이 시작되는 곳이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">And I <span class=\"cw\">wept</span>.</div><div class=\"k\">그리고 나는 <span class=\"cw\">눈물을 흘렸습니다</span>.</div></div><div class=\"rnat\">그리고 나는 눈물을 흘렸다.</div><div class=\"rst\">그리고 나는 결국 <b>눈물을 흘려요</b>(wept). 슬퍼서가 아니라 고마워서 우는 거예요. = 지문의 나중 감정, 감동이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"momentous\" data-m=\"중요한, 중대한\"><b>momentous</b>중요한, 중대한</button><button type=\"button\" class=\"wdb\" data-w=\"reunion\" data-m=\"동창회, 재회\"><b>reunion</b>동창회, 재회</button><button type=\"button\" class=\"wdb\" data-w=\"regretfully\" data-m=\"유감스럽게도\"><b>regretfully</b>유감스럽게도</button><button type=\"button\" class=\"wdb\" data-w=\"afford\" data-m=\"~할 형편이 되다\"><b>afford</b>~할 형편이 되다</button><button type=\"button\" class=\"wdb\" data-w=\"pool their money\" data-m=\"돈을 모으다\"><b>pool their money</b>돈을 모으다</button><button type=\"button\" class=\"wdb\" data-w=\"stunned\" data-m=\"놀라 얼떨떨한\"><b>stunned</b>놀라 얼떨떨한</button><button type=\"button\" class=\"wdb\" data-w=\"wept\" data-m=\"울었다 (weep 울다)\"><b>wept</b>울었다 (weep 울다)</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>연구 결과 문장</b>과 <b>Therefore</b>(그러므로) 결론 문장을 묶어서 찾으세요. 3번 <b>poorer reading comprehension</b>(더 형편없는 독해력)과 6번 <b>may not help</b>(도움이 되지 않을 것이다)가 같은 방향, 화면 읽기는 별로라는 말이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 (화면 vs 종이)</span><div class=\"en\">Anne Mangen … studied the performance of readers <mark>of a computer screen</mark> compared to readers of paper.</div><p class=\"ko\">Oslo 대학교의 Anne Mangen은 종이로 읽는 독자들과 비교해서 <mark>컴퓨터 화면으로 읽는</mark> 독자들의 수행 능력을 연구했다.</p></div><div class=\"ck-via\"><i>▼</i><span>화면 읽기의 여러 전략(2번)이 결국 어떤 결과를 내는지 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 연구 결과</span><div class=\"en\">Those different strategies together lead to <mark>poorer reading comprehension</mark> in contrast to reading the same texts on paper.</div><p class=\"ko\">그러한 다양한 전략들은 모두 똑같은 글을 종이로 읽는 것과는 대조적으로 <mark>더 형편없는 독해력</mark>을 초래한다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>Moreover(게다가) 화면에는 하이퍼텍스트가 또 있음</span><span><em>5번</em>그 연결은 내가 만든 게 아니라 내 머릿속 틀에 안 맞음</span></div><div class=\"ck-eq\">⇒ 4·5번 = 화면 읽기가 별로인 이유를 하나 더 보탬</div></div><div class=\"ck-via\"><i>▼</i><span>Therefore(그러므로)로 이유를 묶어 결론을 내요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결론</span><div class=\"en\"><mark>Therefore</mark>, it <mark>may not help you understand</mark> and digest what you're reading at your own appropriate pace, and it may even distract you.</div><p class=\"ko\"><mark>그러므로</mark>, 그것(= 하이퍼텍스트)은 여러분이 읽고 있는 것을 여러분만의 적절한 속도로 <mark>이해하고 터득하는 데 도움이 되지 않을 것이며</mark>, 심지어 여러분을 산만하게 만들 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">Reading on the Screen Is Not That Effective 화면으로 읽는 것은 그다지 효과적이지 않다<small>3번 poorer(더 형편없는) + 6번 may not help(도움이 되지 않을 것이다)를 Not That Effective(그다지 효과적이지 않은)로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">E-books Increase Your Reading Speed(전자책은 읽기 속도를 높여 준다)</span><span class=\"why\">[반대] 6번의 pace(속도)만 따온 함정이에요. 지문은 화면이 내 속도에 맞춰 이해하는 데 도움이 안 된다고 하니, 화면 읽기를 좋게 말하는 ①과 방향이 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Importance of Teaching Reading Skills(읽기 기술을 가르치는 것의 중요성)</span><span class=\"why\">[지문에 없음] 2번의 strategies(전략들)는 화면에서 훑어보기·단어 찾기를 한다는 뜻이에요. 읽기 기술을 가르쳐야 한다는 말은 하나도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Children's Reading Habits and Technology Use(아이들의 읽기 습관과 기술 사용)</span><span class=\"why\">[지문에 없음] 1번 연구 대상은 그냥 readers(독자들)예요. 아이들의 습관 이야기는 나오지 않고, 화면과 종이의 독해력 비교가 중심이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">E-books(전자책): An Economic Alternative to Paper Books(종이책의 경제적 대안)</span><span class=\"why\">[지문에 없음] 돈이나 가격 이야기는 한 번도 안 나와요. 3번은 오히려 종이보다 화면이 이해에 불리하다고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Anne Mangen at the University of Oslo</div><div class=\"k\">Oslo 대학교의 Anne Mangen은</div></div><div class=\"rc\"><div class=\"e\">studied the performance of readers</div><div class=\"k\">독자들의 수행 능력을 연구했다</div></div><div class=\"rc\"><div class=\"e\">of a computer screen</div><div class=\"k\">컴퓨터 화면으로 읽는</div></div><div class=\"rc\"><div class=\"e\">compared to readers of paper.</div><div class=\"k\">종이로 읽는 독자들과 비교해서.</div></div><div class=\"rnat\">Oslo 대학교의 Anne Mangen은 종이로 읽는 독자들과 비교해서 컴퓨터 화면으로 읽는 독자들의 (독서) 수행 (능력)에 관해 연구했다.</div><div class=\"rst\">같은 국어 숙제를 태블릿으로 읽는 반과 종이로 읽는 반을 비교해 봐요. = 지문 1번, 망겐(Mangen)이 <b>화면 독자와 종이 독자</b>를 비교했어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Her investigation indicated</div><div class=\"k\">그녀(= Anne Mangen)의 연구는 보여주었다</div></div><div class=\"rc\"><div class=\"e\">that reading on a computer screen involves various strategies</div><div class=\"k\">컴퓨터 화면으로 읽는 것이 다양한 전략들을 포함한다는 것을</div></div><div class=\"rc\"><div class=\"e\">from browsing to simple word detection.</div><div class=\"k\">훑어보는 것부터 간단한 단어 찾기까지.</div></div><div class=\"rnat\">그녀의 연구는 컴퓨터 화면으로 읽는 것이 (단순히) 훑어보는 것부터 간단한 단어 찾기까지 다양한 전략들을 포함한다는 것을 보여주었다.</div><div class=\"rst\">태블릿 반은 쓱쓱 훑어보고 아는 단어만 콕콕 찾아 읽어요. 지문 2번도 화면 읽기에 훑어보기·단어 찾기 같은 여러 방법이 섞인다고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Those different strategies together</div><div class=\"k\">그러한 다양한 전략들은 모두</div></div><div class=\"rc ckc\"><div class=\"e\">lead to <span class=\"cw\">poorer reading comprehension</span></div><div class=\"k\"><span class=\"cw\">더 형편없는 독해력</span>을 초래한다</div></div><div class=\"rc\"><div class=\"e\">in contrast to reading the same texts on paper.</div><div class=\"k\">똑같은 글을 종이로 읽는 것과는 대조적으로.</div></div><div class=\"rnat\">그러한 다양한 전략들은 모두 똑같은 글을 종이로 읽는 것과는 대조적으로 더 형편없는 독해력을 초래한다.</div><div class=\"rst\">그랬더니 태블릿 반이 내용 문제를 <b>더 못 풀어요</b>. = 지문 3번, 종이보다 <b>더 형편없는 독해력</b>(poorer reading comprehension)이 결과예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Moreover, there is an additional feature of the screen:</div><div class=\"k\">게다가, 화면에는 한 가지 추가적인 특징이 있다.</div></div><div class=\"rc\"><div class=\"e\">hypertext.</div><div class=\"k\">하이퍼텍스트(가 바로 그것이다).</div></div><div class=\"rnat\">게다가, 화면에는 한 가지 추가적인 특징이 있다. 하이퍼텍스트(가 바로 그것이다).</div><div class=\"rst\"><b>게다가</b>(Moreover) 태블릿 글에는 누르면 딴 페이지로 가는 파란 링크가 있어요. 지문 4번이 말하는 하이퍼텍스트예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Above all,</div><div class=\"k\">무엇보다도,</div></div><div class=\"rc\"><div class=\"e\">a hypertext connection is not one</div><div class=\"k\">하이퍼텍스트 연결은 ~이 아니고</div></div><div class=\"rc\"><div class=\"e\">that you have made yourself,</div><div class=\"k\">여러분이 스스로 만든 것(= 연결)이</div></div><div class=\"rc\"><div class=\"e\">and it will not necessarily have a place</div><div class=\"k\">그것(= 하이퍼텍스트 연결)은 반드시 자리를 가지는 것은 아닐 것이다</div></div><div class=\"rc\"><div class=\"e\">in your own unique conceptual framework.</div><div class=\"k\">여러분만의 고유한 개념적 틀 안에.</div></div><div class=\"rnat\">무엇보다도, 하이퍼텍스트 연결은 여러분 스스로가 만든 것이 아니라서, 그것(하이퍼텍스트 연결)이 반드시 여러분만의 고유한 개념적 틀 안에 존재하는 것은 아닐 것이다.</div><div class=\"rst\">그 링크는 내가 이어 붙인 게 아니라서 머릿속 정리 노트에 쏙 들어가지 않아요. 지문 5번, 나만의 개념 틀에 자리가 없다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Therefore,</span></div><div class=\"k\"><span class=\"cw\">그러므로,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">it may not help you understand and digest</span></div><div class=\"k\">그것(= 하이퍼텍스트)은 <span class=\"cw\">이해하고 터득하는 데 도움이 되지 않을 것이며</span></div></div><div class=\"rc\"><div class=\"e\">what you're reading</div><div class=\"k\">여러분이 읽고 있는 것을</div></div><div class=\"rc\"><div class=\"e\">at your own appropriate pace,</div><div class=\"k\">여러분만의 적절한 속도로,</div></div><div class=\"rc\"><div class=\"e\">and it may even distract you.</div><div class=\"k\">심지어 여러분을 산만하게 만들 수 있다.</div></div><div class=\"rnat\">그러므로, 그것(하이퍼텍스트)은 여러분이 여러분만의 적절한 속도로 읽고 있는 것을 이해하고 터득하는 데에 도움이 되지 않을 것이며, 심지어 여러분을 산만하게 만들 수 있다.</div><div class=\"rst\"><b>그러니</b>(Therefore) 링크를 누르다 딴짓만 하고 이해는 안 돼요. 지문 6번의 결론이라 제목은 “화면 읽기는 그다지 효과적이지 않다”예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"compared to\" data-m=\"~와 비교하여\"><b>compared to</b>~와 비교하여</button><button type=\"button\" class=\"wdb\" data-w=\"indicate\" data-m=\"보여 주다, 나타내다\"><b>indicate</b>보여 주다, 나타내다</button><button type=\"button\" class=\"wdb\" data-w=\"detection\" data-m=\"찾기, 탐색\"><b>detection</b>찾기, 탐색</button><button type=\"button\" class=\"wdb\" data-w=\"in contrast to\" data-m=\"~와는 대조적으로\"><b>in contrast to</b>~와는 대조적으로</button><button type=\"button\" class=\"wdb\" data-w=\"conceptual framework\" data-m=\"개념 틀\"><b>conceptual framework</b>개념 틀</button><button type=\"button\" class=\"wdb\" data-w=\"digest\" data-m=\"이해하여 흡수하다\"><b>digest</b>이해하여 흡수하다</button><button type=\"button\" class=\"wdb\" data-w=\"distract\" data-m=\"산만하게 하다\"><b>distract</b>산만하게 하다</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>The key to the concept is that</b>(이 개념의 핵심은 ~라는 것이다) 문장에 그대로 있어요. 소비를 <b>reducing</b>(줄이는 것)과 행복을 <b>maximize</b>(극대화하다)가 한 문장에 붙어 있고, 4~6번은 그걸 받쳐 주는 근거예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 (정말 필요한가?)</span><div class=\"en\">The concept of ‘degrowth’ asks: “<mark>do I really need this object</mark>, or am I buying it because I like the feeling of buying something?”</div><p class=\"ko\">‘탈성장’이라는 개념은 질문을 던진다. “<mark>내가 정말 이 물건을 필요로 하는가</mark>, 아니면 무언가를 산다는 느낌을 좋아하기 때문에 그것(= 이 물건)을 사는 것인가?”</p></div><div class=\"ck-via\"><i>▼</i><span>1번 질문의 답을 The key(핵심)로 콕 집어 말해 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 요지</span><div class=\"en\"><mark>The key to the concept is that</mark> <mark>reducing your consumption</mark> will not reduce your wellbeing; rather, it will <mark>maximize your happiness</mark> …</div><p class=\"ko\"><mark>이 개념의 핵심은</mark> <mark>당신의 소비를 줄이는 것이</mark> 당신의 행복을 감소시키지 않으리라는 것이다. 오히려, 그것(= 소비를 줄이는 것)은 <mark>당신의 행복을 극대화할 것이다</mark> …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>60년 전보다 물건을 26배 더 씀</span><span><em>5번</em>그럼 26배 더 행복한가? (아니다)</span><span><em>6번</em>간디: 금과 보석도 배고픔·목마름을 못 채운다</span></div><div class=\"ck-eq\">⇒ 세 근거의 공통점 = 많이 산다고 행복해지지 않는다 (3번을 뒷받침)</div></div><div class=\"ck-via\"><i>▼</i><span>But(그러나)으로 4번의 많이 쓰기를 뒤집으며 3번 요지로 돌아와요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 요지 다시 확인</span><div class=\"en\"><mark>But</mark> ask yourself: are we 26 times happier?</div><p class=\"ko\"><mark>그러나</mark> 당신 자신에게 물어보라. 우리는 26배 더 행복한가?</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">불필요한 소비를 줄이면 행복감을 높일 수 있다.<small>3번 reducing your consumption(소비를 줄이는 것) + maximize your happiness(행복을 극대화하다)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">물질만능주의 사회에서는 절약이 중요하다.</span><span class=\"why\">[범위 좁음] 3번에 savings(저축한 돈)가 나와 끌리지만, 아끼는 것 자체가 목표가 아니라 그 시간·돈으로 행복해진다는 게 핵심이에요. 행복이 빠진 보기예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">행복을 위해서 현재에 집중해야 한다.</span><span class=\"why\">[지문에 없음] 지문은 “지금 이 순간”이 아니라 “덜 사는 것”을 말해요. 3번의 행복 비결은 소비를 줄이는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">시대의 변화에 따라 행복의 의미는 다를 수 있다.</span><span class=\"why\">[지문에 없음] 4번의 60 years ago(60년 전)는 소비량 비교일 뿐이에요. 행복의 뜻이 바뀐다는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">경제 활성화를 위해 소비자 중심 정책을 강화해야 한다.</span><span class=\"why\">[반대] 2번에서 탈성장은 anti-consumerism(반소비지상주의)에서 나왔다고 했어요. 소비를 늘려 경제를 살리자는 건 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The concept of ‘degrowth’ asks:</div><div class=\"k\">‘탈성장’이라는 개념은 질문을 던진다.</div></div><div class=\"rc\"><div class=\"e\">“do I really need this object,</div><div class=\"k\">“내가 정말 이 물건을 필요로 하는가,</div></div><div class=\"rc\"><div class=\"e\">or am I buying it</div><div class=\"k\">아니면 내가 그것(= 이 물건)을 사는 것인가</div></div><div class=\"rc\"><div class=\"e\">because I like the feeling of buying something?”</div><div class=\"k\">무언가를 산다는 느낌을 좋아하기 때문에?”</div></div><div class=\"rnat\">'탈성장'이라는 개념은 질문을 던진다. \"내가 정말 이 물건을 필요로 하는가, 아니면 내가 무언가를 산다는 느낌을 좋아하기 때문에 그것을 사는가?\"</div><div class=\"rst\">편의점에서 간식을 집다가 “이거 <b>진짜 필요해?</b> 아니면 그냥 사는 게 좋아서야?” 하고 물어봐요. = 지문 1번, 탈성장이 던지는 질문이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It originated from</div><div class=\"k\">그것(= 탈성장)은 ~로부터 유래했다</div></div><div class=\"rc\"><div class=\"e\">the ideas of ecological economics and anti-consumerism.</div><div class=\"k\">생태경제학과 반소비지상주의의 사상.</div></div><div class=\"rnat\">그것(탈성장)은 생태경제학과 반소비지상주의의 사상으로부터 유래했다.</div><div class=\"rst\">이 질문은 “지구를 아끼고 너무 많이 사지 말자”는 생각에서 나왔어요. 지문 2번의 생태경제학·반소비지상주의가 그 뿌리예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The key to the concept is that</span></div><div class=\"k\"><span class=\"cw\">이 개념의 핵심은 ~라는 것이다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">reducing your consumption</span></div><div class=\"k\"><span class=\"cw\">당신의 소비를 줄이는 것이</span></div></div><div class=\"rc\"><div class=\"e\">will not reduce your wellbeing;</div><div class=\"k\">당신의 행복을 감소시키지 않으리라는 것;</div></div><div class=\"rc ckc\"><div class=\"e\">rather, it will <span class=\"cw\">maximize your happiness</span></div><div class=\"k\">오히려, 그것(= 소비를 줄이는 것)은 <span class=\"cw\">당신의 행복을 극대화할 것이다</span></div></div><div class=\"rc\"><div class=\"e\">by allowing you to have more time and savings</div><div class=\"k\">당신으로 하여금 더 많은 시간과 저축한 돈을 갖게 함으로써</div></div><div class=\"rc\"><div class=\"e\">to spend on things like art, music, family, and community.</div><div class=\"k\">예술, 음악, 가족, 그리고 지역 사회와 같은 데에 쓸.</div></div><div class=\"rnat\">이 개념의 핵심은 당신의 소비를 줄이는 것이 당신의 행복을 감소시키지 않으리라는 것이다. 오히려, 그것은 당신으로 하여금 예술, 음악, 가족, 그리고 지역 사회와 같은 데에 쓸, 더 많은 시간과 저축한 돈을 갖게 함으로써 당신의 행복을 극대화할 것이다.</div><div class=\"rst\"><b>핵심</b>(The key)은 덜 사도 안 불행하고, 아낀 용돈과 시간으로 기타 연습·가족 나들이를 하면 더 행복하다는 거예요. 지문 3번이 요지예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Today we consume 26 times more stuff</div><div class=\"k\">오늘날 우리는 26배 더 많은 물건을 소비한다</div></div><div class=\"rc\"><div class=\"e\">than we did 60 years ago.</div><div class=\"k\">우리가 60년 전에 (소비)했던 것보다.</div></div><div class=\"rnat\">오늘날 우리는 우리가 60년 전에 (소비)했던 것보다 26배 더 많은 물건을 소비한다.</div><div class=\"rst\">요즘 우리는 60년 전 사람들보다 물건을 엄청 많이 사요. = 지문 4번, 60년 전보다 26배 더 소비한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But</span> ask yourself:</div><div class=\"k\"><span class=\"cw\">그러나</span> 당신 자신에게 물어보라.</div></div><div class=\"rc\"><div class=\"e\">are we 26 times happier?</div><div class=\"k\">우리는 26배 더 행복한가?</div></div><div class=\"rnat\">그러나 당신 자신에게 물어보라. '우리는 26배 더 행복한가?'</div><div class=\"rst\"><b>그런데</b>(But) 우리가 그때보다 26배 더 행복할까요? 지문 5번의 물음은 “아니다”라는 뜻이라 3번 요지를 받쳐 줘요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Consider what Mahatma Gandhi said:</div><div class=\"k\">Mahatma Gandhi(마하트마 간디)가 말했던 것을 생각해보라.</div></div><div class=\"rc\"><div class=\"e\">“Not all our gold and jewelry</div><div class=\"k\">“우리의 모든 금과 보석은</div></div><div class=\"rc\"><div class=\"e\">could satisfy our hunger</div><div class=\"k\">우리의 허기를 충족시킬 수도</div></div><div class=\"rc\"><div class=\"e\">and quench our thirst.”</div><div class=\"k\">우리의 갈증을 해소시킬 수도 없다.”</div></div><div class=\"rnat\">Mahatma Gandhi(마하트마 간디)가 말했던 것을 생각해보라. \"우리의 모든 금과 보석은 우리의 허기를 충족시킬 수도 우리의 갈증을 해소시킬 수도 없다.\"</div><div class=\"rst\">간디(Gandhi)도 금과 보석이 배고픔과 목마름을 못 채운다고 했어요. 지문 6번처럼, 많이 가진다고 행복해지지 않으니 덜 사자는 말이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"originate from\" data-m=\"~에서 비롯되다\"><b>originate from</b>~에서 비롯되다</button><button type=\"button\" class=\"wdb\" data-w=\"anti-consumerism\" data-m=\"반소비지상주의\"><b>anti-consumerism</b>반소비지상주의</button><button type=\"button\" class=\"wdb\" data-w=\"consumption\" data-m=\"소비\"><b>consumption</b>소비</button><button type=\"button\" class=\"wdb\" data-w=\"wellbeing\" data-m=\"행복, 안녕\"><b>wellbeing</b>행복, 안녕</button><button type=\"button\" class=\"wdb\" data-w=\"maximize\" data-m=\"극대화하다\"><b>maximize</b>극대화하다</button><button type=\"button\" class=\"wdb\" data-w=\"savings\" data-m=\"저축한 돈\"><b>savings</b>저축한 돈</button><button type=\"button\" class=\"wdb\" data-w=\"quench\" data-m=\"(갈증을) 해소하다\"><b>quench</b>(갈증을) 해소하다</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">문장 맨 앞 밑줄은 <b>뒤 절에 빠진 자리가 있는지</b>부터 보세요. 주어·동사·보어가 다 있는 <b>완전한 절</b>이면 what(~하는 것)이 아니라 <b>that</b>(~라는 것)이에요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (8번)</span><div class=\"en\"><u>④ What</u> cell metabolism and structure should be complex would not be surprising, …</div><p class=\"ko\">세포의 신진대사와 구조가 복잡해야 한다는 ( ? )은 놀랍지 않을 것이다 — 밑줄이 문장 맨 앞 주어 자리</p></div><div class=\"ck-via\"><i>▼</i><span>밑줄 뒤에 주어(cell metabolism and structure)와 동사·보어(should be complex)가 다 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">밑줄 뒤 절 뜯어보기</span><div class=\"en\">cell metabolism and structure <mark>should be complex</mark></div><p class=\"ko\">세포의 신진대사와 구조가 <mark>복잡해야 한다는 것은</mark></p></div><div class=\"ck-via\"><i>▼</i><span>완전한 절 덩어리 전체가 주어이고, 진짜 동사 would not be(~이 아닐 것이다)가 따로 와요 → that(~라는 것)</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">That cell metabolism and structure should be complex <mark>would not be surprising</mark></div><p class=\"ko\">세포의 신진대사와 구조가 복잡해야 한다는 것은 <mark>놀랍지 않을 것이다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">접속사 that(~라는 것)과 관계대명사 what(~하는 것) 구별 (주어 자리)</p><p class=\"gr\">what(~하는 것) 뒤에는 주어나 목적어가 빠진 불완전한 절이 와요. that(~라는 것) 뒤에는 다 갖춰진 완전한 절이 오고, 그 덩어리 전체가 문장의 주어가 될 수 있어요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>That he is kind is true.</div><div class=\"ko\">그가 친절하다는 것은 사실이다. (he is kind가 완전한 절이라 that이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>What he is kind is true.</div><div class=\"ko\">he is kind에 빠진 자리가 없는데 what을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>What he said is true.</div><div class=\"ko\">그가 말한 것은 사실이다. (said 뒤 목적어가 비었으니 what이 맞아요)</div></div><p class=\"gb\">지문 8번도 밑줄 뒤 cell metabolism and structure should be complex(세포의 신진대사와 구조가 복잡해야 한다)가 빠진 자리 없는 완전한 절이에요. 그래서 What(~하는 것)이 아니라 That(~라는 것)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">What → That (~라는 것)<small>뒤 절이 빠진 자리 없이 완전하니 what(~하는 것)이 아니라 that(~라는 것)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">was ~였다</span><span class=\"why\">4번 as large as the mother cell was(모세포가 컸던 만큼)는 the mother cell was large(모세포가 컸다)에서 large(큰)가 앞으로 나간 모양이에요. was(~였다)는 be(~이다)동사를 대신 받는 자리라 맞아요. 모세포는 과거에 컸으니 과거형 was(~였다)가 자연스러워요.</span><div class=\"gm wx\"><p class=\"gt\">as(~만큼) + 형용사 + as(~만큼) + 주어 + be(~이다)동사 (비교의 대동사)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My brother is now as tall as Dad was.</div><div class=\"ko\">형은 이제 아빠가 (예전에) 컸던 만큼 키가 크다. (Dad was tall에서 tall이 앞으로 나가 was만 남아서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My brother is now as tall as Dad did.</div><div class=\"ko\">tall(키가 큰)은 형용사라 be(~이다)동사로 받아야 하는데 did(했다)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She runs as fast as I do.</div><div class=\"ko\">그녀는 나만큼 빨리 달린다. (일반동사 runs(달린다)라서 do로 받는 게 맞아요)</div></div><p class=\"gb\">지문 4번도 large(큰)라는 형용사를 받는 자리라 did(했다)가 아니라 be(~이다)동사 was(~였다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">producing 생성하면서</span><span class=\"why\">3번 when its mother cell divides(모세포가 분열할 때)는 이미 주어 its mother cell(그것의 모세포)과 동사 divides(분열하다)가 있는 완전한 절이에요. 그 뒤에 콤마로 '~하면서'를 붙이니 분사구문 producing(생성하면서)이 맞고, 모세포가 직접 딸세포를 만드니 능동 -ing(~하는)예요.</span><div class=\"gm wx\"><p class=\"gt\">분사구문: 콤마 + -ing(~하면서, 능동)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Mom cut the pizza, making eight slices.</div><div class=\"ko\">엄마는 피자를 잘라 여덟 조각을 만들었다. (엄마가 직접 만드니 능동 making(만들면서)이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Mom cut the pizza, makes eight slices.</div><div class=\"ko\">동사 cut(잘랐다)이 이미 있는데 접속사 없이 makes(만든다)를 또 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She left the room, closing the door.</div><div class=\"ko\">그녀는 문을 닫으면서 방을 나갔다. (그녀가 직접 닫으니 능동 closing(닫으면서)이 맞아요)</div></div><p class=\"gb\">지문 3번도 divides(분열하다) 뒤에 콤마로 결과를 덧붙이고, 모세포가 직접 만드니 producing(생성하면서)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">differentiates 분화하다</span><span class=\"why\">6번 as it either prepares to divide or matures and differentiates(그것이 분열을 준비하거나 성숙하여 분화함에 따라)에서 주어는 it(그것)이에요. prepares(준비하다)·matures(성숙하다)와 나란히 이어지는 동사라서 같은 모양 3인칭 단수 현재 differentiates(분화하다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">병렬 구조: and(그리고)·or(또는)로 이어진 동사는 같은 모양</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>He wakes up, washes his face, and eats breakfast.</div><div class=\"ko\">그는 일어나서 세수하고 아침을 먹는다. (wakes·washes·eats 모두 같은 모양이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He wakes up, washes his face, and eating breakfast.</div><div class=\"ko\">앞 동사들은 -s인데 마지막만 eating(먹는 것)이라 모양이 깨져서 틀려요.</div></div><p class=\"gb\">지문 6번도 it(그것)이 prepares(준비하다)·matures(성숙하다)와 함께 differentiates(분화하다)하는 것이라 같은 모양이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">responsible 이바지하는, 책임이 있는</span><span class=\"why\">9번은 has only a small number of parts(소수의 부분들만 가지고 있다)로 문장이 끝난 뒤 콤마 + each(각각)가 붙은 모양이에요. each (being) responsible for(각각 ~을 담당하면서)에서 being(~인 상태로)이 생략된 분사구문이라 형용사 responsible(책임이 있는)이 맞아요. 동사 is(~이다)를 쓰면 접속사 없이 동사가 둘이 돼요.</span><div class=\"gm wx\"><p class=\"gt\">주어가 있는 분사구문: 명사 + (being) + 형용사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>We have three cats, each different in color.</div><div class=\"ko\">우리는 고양이 세 마리가 있는데, 각각 색이 다르다. (each (being) different, 형용사 different 다른 이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>We have three cats, each is different in color.</div><div class=\"ko\">접속사 없이 동사 have(가지다)와 is(~이다)가 둘이 되어 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>We have three cats, each differently in color.</div><div class=\"ko\">differently(다르게)는 부사라 '각각 어떤 상태인지'를 말하지 못해서 틀려요.</div></div><p class=\"gb\">지문 9번도 동사 has(가지고 있다)가 이미 있으니, each(각각) 뒤에는 동사 없이 형용사 responsible(책임이 있는)이 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Like whole individuals,</div><div class=\"k\">모든 개인과 마찬가지로,</div></div><div class=\"rc\"><div class=\"e\">cells have a life span.</div><div class=\"k\">세포도 수명을 가지고 있다.</div></div><div class=\"rnat\">모든 개인과 마찬가지로, 세포도 수명을 가지고 있다.</div><div class=\"rst\">사람처럼 세포도 태어나서 사는 기간, 즉 수명이 있어요. 지문 1번은 like(~처럼)로 사람과 세포를 비교하며 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">During their life cycle (cell cycle),</div><div class=\"k\">그들(= 세포들)의 생애 주기(세포 주기) 동안,</div></div><div class=\"rc\"><div class=\"e\">cell size, shape, and metabolic activities</div><div class=\"k\">세포의 크기, 모양, 그리고 신진대사 활동은</div></div><div class=\"rc\"><div class=\"e\">can change dramatically.</div><div class=\"k\">극적으로 변할 수 있다.</div></div><div class=\"rnat\">그들의 생애 주기(세포 주기) 동안, 세포의 크기, 모양, 그리고 신진대사 활동은 극적으로 변할 수 있다.</div><div class=\"rst\">세포가 사는 동안 크기·모양·하는 일이 크게 바뀔 수 있어요. 지문 2번의 주어는 세 개가 and(그리고)로 묶여 있어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">A cell is “born” as a twin</div><div class=\"k\">세포는 쌍둥이로 “태어난다”</div></div><div class=\"rc\"><div class=\"e\">when its mother cell divides,</div><div class=\"k\">그것(= 세포)의 모세포가 분열할 때,</div></div><div class=\"rc\"><div class=\"e\">producing two daughter cells.</div><div class=\"k\">두 개의 딸세포를 생성하면서.</div></div><div class=\"rnat\">세포는 모세포가 분열해서 두 개의 딸세포를 생성할 때 쌍둥이로 '태어난'다.</div><div class=\"rst\">엄마 세포가 둘로 나뉘면서 딸세포 두 개를 만들어요. 그래서 <b>producing</b>(생성하면서)은 콤마 뒤 분사구문이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Each daughter cell is smaller than the mother cell,</div><div class=\"k\">각각의 딸세포는 모세포보다 더 작으며,</div></div><div class=\"rc\"><div class=\"e\">and except for unusual cases,</div><div class=\"k\">특이한 경우를 제외하고는,</div></div><div class=\"rc\"><div class=\"e\">each grows</div><div class=\"k\">각각(= 각 딸세포)은 자란다</div></div><div class=\"rc\"><div class=\"e\">until it becomes as large as the mother cell was.</div><div class=\"k\">그것(= 딸세포)이 모세포만큼 커질 때까지.</div></div><div class=\"rnat\">각각의 딸세포는 모세포보다 더 작으며, 특이한 경우를 제외하고는, 각각(의 딸세포)은 모세포만큼 커질 때까지 자란다.</div><div class=\"rst\">딸세포는 처음엔 작지만 엄마 세포가 <b>컸던 만큼</b> 자라요. as large as(~만큼 큰) 뒤라 be(~이다)동사 was(~였다)로 받아요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">During this time,</div><div class=\"k\">이 기간 동안,</div></div><div class=\"rc\"><div class=\"e\">the cell absorbs water, sugars, amino acids, and other nutrients</div><div class=\"k\">세포는 물, 당, 아미노산, 그리고 다른 영양소들을 흡수하고</div></div><div class=\"rc\"><div class=\"e\">and assembles them into new, living protoplasm.</div><div class=\"k\">그것들(= 영양소들)을 모아서 새로운 살아있는 원형질로 만든다.</div></div><div class=\"rnat\">이 기간 동안, 세포는 물, 당, 아미노산, 그리고 다른 영양소들을 흡수하고 그것들을 모아서 새로운 살아있는 원형질로 만든다.</div><div class=\"rst\">자라는 동안 세포는 물·당 같은 영양소를 빨아들여 새 원형질을 만들어요. 동사 absorbs(흡수하다)와 assembles(모으다)가 나란히 이어져요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">After the cell has grown to the proper size,</div><div class=\"k\">세포가 적절한 크기로 성장하고 나면,</div></div><div class=\"rc\"><div class=\"e\">its metabolism shifts</div><div class=\"k\">그것(= 세포)의 신진대사가 변화한다</div></div><div class=\"rc\"><div class=\"e\">as it either prepares to divide</div><div class=\"k\">그것(= 세포)이 분열을 준비하거나</div></div><div class=\"rc\"><div class=\"e\">or matures and differentiates into a specialized cell.</div><div class=\"k\">성숙하여 분화 세포로 변이함에 따라.</div></div><div class=\"rnat\">세포가 적절한 크기로 성장하고 나면, 그것이 분열을 준비하거나 성숙하여 분화 세포로 변이함에 따라 그것의 신진대사가 변화한다.</div><div class=\"rst\">다 자라면 세포는 또 나뉘거나, 어른이 되어 특별한 세포가 돼요. prepares(준비하다)·matures(성숙하다)·<b>differentiates</b>(분화하다)가 같은 모양이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Both growth and development</div><div class=\"k\">성장과 발달 둘 다</div></div><div class=\"rc\"><div class=\"e\">require a complex and dynamic set of interactions</div><div class=\"k\">복잡하고 역동적인 일련의 상호작용이 필요하다</div></div><div class=\"rc\"><div class=\"e\">involving all cell parts.</div><div class=\"k\">세포의 모든 부분을 관여시키는.</div></div><div class=\"rnat\">성장과 발달 둘 다 세포의 모든 부분을 관여시키는 복잡하고 역동적인 일련의 상호작용이 필요하다.</div><div class=\"rst\">자라는 것도, 발달하는 것도 세포의 모든 부분이 함께 움직여야 해요. 지문 7번의 주어는 Both A and B(A와 B 둘 다)예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">That cell metabolism and structure <span class=\"cw\">should be complex</span></div><div class=\"k\">세포의 신진대사와 구조가 <span class=\"cw\">복잡해야 한다는 것은</span> ※ 문제지엔 What으로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">would not be surprising</span>,</div><div class=\"k\"><span class=\"cw\">놀랍지 않을 것이다</span>,</div></div><div class=\"rc\"><div class=\"e\">but actually,</div><div class=\"k\">하지만 실제로,</div></div><div class=\"rc\"><div class=\"e\">they are rather simple and logical.</div><div class=\"k\">그것들(= 세포의 신진대사와 구조)은 오히려 간단하고 논리적이다.</div></div><div class=\"rnat\">세포의 신진대사와 구조가 복잡해야 한다는 것은 놀랍지 않지만, 실제로, 그것들은 오히려 간단하고 논리적이다.</div><div class=\"rst\">“세포는 복잡하겠지?” 하는 건 당연하지만 실제론 간단해요. 뒤 절이 완전하니 What(~하는 것)이 아니라 <b>That</b>(~라는 것)이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Even the most complex cell</div><div class=\"k\">가장 복잡한 세포조차도</div></div><div class=\"rc\"><div class=\"e\">has only a small number of parts,</div><div class=\"k\">소수의 부분들만 가지고 있다,</div></div><div class=\"rc\"><div class=\"e\">each responsible for a distinct, well-defined aspect of cell life.</div><div class=\"k\">각각(= 각 부분)이 세포 생명의 분명하고 명확한 측면에 이바지하면서.</div></div><div class=\"rnat\">가장 복잡한 세포조차도 소수의 부분들로만 구성되어 있는데, 각각(각 부분)은 세포 생명(세포 활동)의 분명하고 명확한 측면에 이바지한다.</div><div class=\"rst\">가장 복잡한 세포도 부분이 몇 개뿐이고, 각각 맡은 일이 분명해요. each(각각) 뒤에 being(~인 상태로)이 빠져서 형용사 <b>responsible</b>(책임이 있는)이 와요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"life span\" data-m=\"수명\"><b>life span</b>수명</button><button type=\"button\" class=\"wdb\" data-w=\"metabolic activities\" data-m=\"물질대사 활동\"><b>metabolic activities</b>물질대사 활동</button><button type=\"button\" class=\"wdb\" data-w=\"daughter cell\" data-m=\"딸세포\"><b>daughter cell</b>딸세포</button><button type=\"button\" class=\"wdb\" data-w=\"absorb\" data-m=\"흡수하다\"><b>absorb</b>흡수하다</button><button type=\"button\" class=\"wdb\" data-w=\"differentiate into\" data-m=\"~로 분화하다\"><b>differentiate into</b>~로 분화하다</button><button type=\"button\" class=\"wdb\" data-w=\"well-defined\" data-m=\"명확히 규정된\"><b>well-defined</b>명확히 규정된</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">③ 바로 뒤 <b>and therefore cannot account for</b>(그렇기 때문에 설명할 수 없다)가 결정적이에요. 통계 모형이 새로운 사건을 못 다루는 <b>이유</b>가 와야 하니, 안정된 상황을 부인(deny)이 아니라 <b>가정</b>(assume)해야 방향이 맞아요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 사람의 강점</span><div class=\"en\">… one of the advantages of human judgment is <mark>the ability to detect change</mark>.</div><p class=\"ko\">… 인간의 판단력의 유리한 점 중 하나는 <mark>변화를 탐지하는 능력이라는 점</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>사람은 변화를 잘 잡는데, 통계 모형은 어떻다는 걸까요?</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (4번)</span><div class=\"en\">The logic was that statistical models <u>③ deny</u> stable conditions and therefore cannot account for the effects on demand of novel events …</div><p class=\"ko\">통계 모형은 안정된 상황을 ( 부인하고? ) 그렇기 때문에 새로운 사건의 영향을 설명할 수 없다 → 가정하고가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>therefore(그렇기 때문에) 뒤 결과가 '못 한다'이니, 앞 원인은 '변화 없다고 깔고 간다'여야 해요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 · 결정적 단서</span><div class=\"en\">… statistical models <mark>assume stable conditions</mark> and therefore <mark>cannot account for</mark> the effects on demand of novel events …</div><p class=\"ko\">통계 모형은 <mark>안정된 상황을 가정하고</mark> 그렇기 때문에 수요에 끼치는 영향을 <mark>설명할 수 없다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>however(그러나)로 사람은 반대로 새 요인을 넣을 수 있다고 대조해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 대조로 확인</span><div class=\"en\">Humans, <mark>however</mark>, can incorporate these novel factors in their judgments.</div><p class=\"ko\"><mark>그러나</mark> 인간은 이 새로운 요인들을 그들(= 인간)의 판단 속에 포함할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">deny(부인하다) ↔ assume(가정하다, 당연하게 여기다)</p><p class=\"gr\">결과가 cannot(~할 수 없다)이면 원인도 그 한계를 만드는 쪽이어야 해요. '변화가 없다고 assume(가정하다)'해야 변화를 못 잡고, deny(부인하다)하면 오히려 변화를 잘 잡는다는 반대 뜻이 돼요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>He assumed the bus would come on time, so he was late.</div><div class=\"ko\">그는 버스가 제때 올 거라고 당연히 여겨서 지각했다. (가정 → 대비 못 함, 방향이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He denied the bus would come on time, so he was late.</div><div class=\"ko\">버스가 제때 안 올 거라 생각했으면 일찍 나갔겠죠. 원인과 결과의 방향이 거꾸로라 틀려요.</div></div><p class=\"gb\">지문 4번도 and therefore cannot account for(그렇기 때문에 설명할 수 없다)가 뒤에 오니, 앞은 deny(부인하다)가 아니라 assume(가정하다)이어야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">deny → assume (가정하다)<small>안정된 상황을 가정하기 때문에 새로운 사건을 설명할 수 없는 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">incorporate 포함하다</span><span class=\"why\">5번은 however(그러나)로 4번 통계 모형과 대조돼요. 모형은 새 사건을 설명 못 하지만 사람은 그 새 요인을 판단에 incorporate(포함하다)할 수 있으니 방향이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">advantageous 이로운</span><span class=\"why\">1번에서 사람의 강점은 변화를 탐지하는 능력이라고 했어요. 그래서 2번 Thus(그렇기에) 변화하는 환경에서는 사람과 통계를 합치는 게 advantageous(이로운)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">past 지난</span><span class=\"why\">통계 모형은 이미 있었던 자료로 계산해서 새로운 일(4번 novel events(새로운 사건))을 못 따라가요. 그래서 3번 based on past data(지난 데이터에 근거한)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">accurate 정확한</span><span class=\"why\">모형의 약점(4번)과 사람의 강점(5번)을 합쳤으니 결과가 더 좋아야 해요. 6번 composite(종합된 것)이 둘 중 하나만 쓴 것보다 more accurate(더 정확한)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Robert Blattberg and Steven Hoch noted that,</div><div class=\"k\">Robert Blattberg와 Steven Hoch는 ~에 주목했다</div></div><div class=\"rc\"><div class=\"e\">in a changing environment,</div><div class=\"k\">변화하는 상황 속에서는</div></div><div class=\"rc\"><div class=\"e\">it is not clear that consistency is always a virtue</div><div class=\"k\">일관성이 항상 장점인지 명백하지 않다는 점,</div></div><div class=\"rc\"><div class=\"e\">and that one of the advantages of human judgment</div><div class=\"k\">그리고 인간의 판단력의 유리한 점 중 하나는</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">the ability to detect change</span>.</div><div class=\"k\"><span class=\"cw\">변화를 탐지하는 능력이라는 점에</span>.</div></div><div class=\"rnat\">Robert Blattberg와 Steven Hoch는 변화하는 상황 속에서는 일관성이 항상 장점인지 명백하지 않다는 점, 그리고 인간의 판단력의 유리한 점 중 하나는 변화를 탐지하는 능력이라는 점에 주목했다.</div><div class=\"rst\">매점 사장님은 “오늘 비 와서 컵라면 많이 팔리겠다” 하고 <b>변화를 알아채요</b>. = 지문 1번, 사람 판단의 강점은 변화를 탐지하는 능력이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Thus, in changing environments,</div><div class=\"k\">그렇기에, 변화하는 환경 속에서는</div></div><div class=\"rc\"><div class=\"e\">it might be advantageous</div><div class=\"k\">이로울지도 모른다</div></div><div class=\"rc\"><div class=\"e\">to combine human judgment and statistical models.</div><div class=\"k\">인간의 판단력과 통계 모형을 결합하는 것이.</div></div><div class=\"rnat\">그렇기에, 변화하는 환경 속에서는 인간의 판단력과 통계 모형을 결합하는 것이 이로울지도 모른다.</div><div class=\"rst\"><b>그래서</b>(Thus) 날씨가 자주 바뀔 땐 사장님 감과 컴퓨터 예측을 합치면 좋아요. 지문 2번의 advantageous(이로운)가 이 뜻이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Blattberg and Hoch examined this possibility</div><div class=\"k\">Blattberg와 Hoch는 이 가능성(= 판단과 통계 모형을 결합하는 것의 이로움)을 연구해 보았다</div></div><div class=\"rc\"><div class=\"e\">by having supermarket managers forecast demand</div><div class=\"k\">슈퍼마켓 관리자들에게 수요를 예측하게 함으로써</div></div><div class=\"rc\"><div class=\"e\">for certain products</div><div class=\"k\">특정 제품의</div></div><div class=\"rc\"><div class=\"e\">and then creating a composite forecast</div><div class=\"k\">그런 다음 종합적인 예측을 만들어서</div></div><div class=\"rc\"><div class=\"e\">by averaging these judgments</div><div class=\"k\">이런 판단들(= 관리자들의 예측)을 평균을 냄으로써</div></div><div class=\"rc\"><div class=\"e\">with the forecasts of statistical models based on past data.</div><div class=\"k\">지난 데이터에 근거한 통계 모형의 예측과.</div></div><div class=\"rnat\">Blattberg와 Hoch는 슈퍼마켓 관리자들에게 특정 제품의 수요를 예측하게 하고, 그런 다음 지난 데이터에 근거한 통계 모형의 예측과 이런 판단을 평균을 내어 종합적인 예측을 만들어내서 이 가능성을 연구해 보았다.</div><div class=\"rst\">실제로 사장님의 예상과 지난달 판매 기록으로 계산한 컴퓨터 예상을 평균 내 봐요. = 지문 3번, 관리자 예측과 통계 모형 예측의 평균이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">The logic was that</div><div class=\"k\">(이 연구의) 논리는 ~라는 것이었다</div></div><div class=\"rc ckc\"><div class=\"e\">statistical models <span class=\"cw\">assume stable conditions</span></div><div class=\"k\">통계 모형은 <span class=\"cw\">안정된 상황을 가정하고</span> ※ 문제지엔 deny로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\">and therefore <span class=\"cw\">cannot account for</span> the effects on demand</div><div class=\"k\">그렇기 때문에 수요에 끼치는 영향을 <span class=\"cw\">설명할 수 없다</span></div></div><div class=\"rc\"><div class=\"e\">of novel events</div><div class=\"k\">새로운 사건이</div></div><div class=\"rc\"><div class=\"e\">such as actions taken by competitors or the introduction of new products.</div><div class=\"k\">경쟁자들이 취한 조치나 신제품 소개와 같은.</div></div><div class=\"rnat\">(이 연구의) 논리는 통계 모형은 안정된 상황을 부정하고(→ 가정하고), 그렇기 때문에 경쟁자들이 취한 조치나 신제품 소개와 같은 새로운 사건이 수요에 끼치는 영향을 설명할 수 없다는 것이었다.</div><div class=\"rst\">컴퓨터는 “늘 똑같겠지” 하고 <b>가정해서</b>(assume) 옆 가게 할인 같은 새 일을 못 잡아요. 그래서 문제지의 deny(부인하다)는 틀려요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\">Humans, <span class=\"cw\">however</span>,</div><div class=\"k\"><span class=\"cw\">그러나</span> 인간은,</div></div><div class=\"rc\"><div class=\"e\">can incorporate these novel factors</div><div class=\"k\">이 새로운 요인들을 포함할 수 있다</div></div><div class=\"rc\"><div class=\"e\">in their judgments.</div><div class=\"k\">그들(= 인간)의 판단 속에.</div></div><div class=\"rnat\">하지만, 인간은 이 새로운 요인들을 판단에 포함할 수 있다.</div><div class=\"rst\"><b>하지만</b>(however) 사장님은 “옆 가게가 세일하네” 같은 새 소식을 바로 예상에 넣어요. 지문 5번의 incorporate(포함하다)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The composite — or average of human judgments and statistical models —</div><div class=\"k\">종합된 것, 즉 인간의 판단과 통계 모형의 평균이</div></div><div class=\"rc\"><div class=\"e\">proved to be more accurate</div><div class=\"k\">더 정확한 것으로 판명되었다</div></div><div class=\"rc\"><div class=\"e\">than either the statistical models or the managers working alone.</div><div class=\"k\">통계 모형 또는 관리자가 (각자) 혼자 처리하는 것보다.</div></div><div class=\"rnat\">종합된 것, 즉 인간의 판단과 통계 모형의 평균이 통계 모형 또는 관리자가 (각자) 혼자 처리하는 것보다 더 정확한 것으로 판명되었다.</div><div class=\"rst\">그래서 둘을 합친 예상이 사장님 혼자, 컴퓨터 혼자보다 <b>더 정확했어요</b>. = 지문 6번의 more accurate(더 정확한)예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"consistency\" data-m=\"일관성\"><b>consistency</b>일관성</button><button type=\"button\" class=\"wdb\" data-w=\"detect\" data-m=\"감지하다, 알아채다\"><b>detect</b>감지하다, 알아채다</button><button type=\"button\" class=\"wdb\" data-w=\"forecast\" data-m=\"예측하다; 예측\"><b>forecast</b>예측하다; 예측</button><button type=\"button\" class=\"wdb\" data-w=\"account for\" data-m=\"설명하다\"><b>account for</b>설명하다</button><button type=\"button\" class=\"wdb\" data-w=\"novel\" data-m=\"새로운\"><b>novel</b>새로운</button><button type=\"button\" class=\"wdb\" data-w=\"incorporate\" data-m=\"포함시키다, 통합하다\"><b>incorporate</b>포함시키다, 통합하다</button></div>"};
