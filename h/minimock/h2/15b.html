<title>고2 미니모의고사 15회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .at{font-size:13px;color:var(--sub)}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}

(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

var D=[{"no": "07", "typ": "빈칸", "src": "2023년 9월 31번", "evn": [4, 5, 6], "ev_en": "If I want you to consider an idea, and know you strongly reject popular opinion in favor of maintaining your independence and uniqueness, I would present the majority option first, which you would reject in favor of my actual preference. / We are often tricked when we try to maintain a position of defiance. / People use this reversal to make us “independently” choose an option which suits their purposes.", "ev_ko": [[4, "만약 내가 당신이 어떤 아이디어를 고려하기를 바라고, 당신이 당신의 독립성과 유일성을 유지하기 위해 대중적인 의견을 강력히 거부한다는 것을 안다면, 나는 대다수의 선택을 먼저 제시할 것이고, 당신은 내가 실제로 선호하는 것에 맞게 이(대다수의 선택)를 거부할 것이다."], [5, "우리가 반항의 입장을 유지하려고 할 때 우리는 종종 속는다."], [6, "사람들은 우리가 '독자적으로' 그들의 목적에 맞는 선택지를 고르도록 만들기 위해 이러한 반전을 사용한다."]], "why": ["빈칸 문장 (6)은 사람들의 목적에 맞게 우리가 선택을 하면서도, 우리 스스로는 <b>독자적으로 선택한다고 믿게<\/b> 만드는 '무엇'을 사용한다는 내용입니다", "문장 (4)를 보면, 당신이 독립성과 유일성 때문에 대중적인 의견에 반대한다는 것을 아는 경우 <b>대다수의 선택을 먼저 제시<\/b>합니다", "그러면 당신은 그것을 거부하게 됩니다", "(5)는 이처럼 반항의 입장을 유지하려다 우리가 종종 <b>속는다<\/b>고 말합니다", "이렇게 반항 심리를 이용해 거꾸로 선택하게 만드는 방식이 <b>반전(reversal)<\/b>입니다", "그래서 정답은 ①입니다."], "ch": [{"n": "①", "t": "reversal", "g": "반전", "ok": true, "e": ["(4)~(5)처럼 대다수의 선택을 먼저 내밀어 반항하는 사람이 그것을 거부하게 만드는 방식이 <b>반전(reversal)<\/b>입니다", "이 말이 (6)의 빈칸에 들어갑니다."]}, {"n": "②", "t": "imitation", "g": "모방", "ok": false, "e": ["(4)에서 사람들은 대다수의 선택을 <b>따라 하는 것이 아니라 거부<\/b>합니다", "모방은 이 내용과 맞지 않습니다."]}, {"n": "③", "t": "repetition", "g": "반복", "ok": false, "e": ["같은 것을 <b>반복<\/b>한다는 내용은 지문에 없습니다."]}, {"n": "④", "t": "conformity", "g": "순응", "ok": false, "e": ["(4)~(5)에서 사람들은 대다수의 의견에 <b>순응하는 것이 아니라 거부<\/b>합니다", "순응은 반대되는 내용입니다."]}, {"n": "⑤", "t": "collaboration", "g": "협력", "ok": false, "e": ["마케터와 소비자가 <b>협력<\/b>한다는 내용은 지문에 없습니다."]}], "tr": ["반항자들은 자신들이 반항자라고 생각할지도 모르지만, 영리한 마케터들은 나머지 우리에게 그러듯이 그들에게도 영향을 준다.", "'모두가 그것을 하고 있다'라고 말하는 것은 일부 사람들을 어떤 생각에 대해 흥미를 잃게 만들지도 모른다.", "이 사람들은 대안을 찾을 것이고, 그것은 (만약 영리하게 계획된다면) 정확히 마케터나 설득자가 당신이 믿기를 원하는 것일 수 있다.", "만약 내가 당신이 어떤 아이디어를 고려하기를 바라고, 당신이 }
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

", "notes": [["1", "chore", "집안일"], ["2", "method", "방법"], ["3", "appropriate", "적절한"]], "lit": "그들이 짧은 시간 안에 많은 집안일을 끝내야 할 필요가 있을 때, / 그들은 그녀의 방법을 사용했다, / 하지만 그들은 항상 적절한 식사 시간에 식사 휴식을 취하기로 합의했다.", "nat": "짧은 시간 안에 집안일을 많이 끝내야 할 때는 그녀의 방법을 사용했지만, 항상 적절한 식사 시간에는 식사 휴식을 취하기로 합의했다.", "ana": "<b>When절</b>은 시간을 나타내는 부사절이고, get a lot of chores done은 <b>get + 목적어 + 과거분사</b>(사역의 의미)이다.", "pe": "\u0001When they needed to get a lot of chores<sup>1</sup> done in a short period of time\u0002, / they used her method<sup>2</sup>, / but they agreed to \u0001always\u0002 take a meal break \u0001at the appropriate<sup>3</sup> meal hour\u0002.", "pk": "\u0001그들이 짧은 시간 안에 많은 집안일을 끝내야 할 필요가 있을 때\u0002, / 그들은 그녀의 방법을 사용했다, / 하지만 그들은 \u0001항상\u0002 \u0001적절한 식사 시간에\u0002 식사 휴식을 취하기로 합의했다.", "core": "그들은 그녀의 방법을 사용했지만, 식사 휴식을 취하기로 합의했다.", "tags": ["When절 = 시간 부사절: 뒤 문장을 꾸밈. get + 목적어 + 과거분사(chores done)", "they used her method: 3형식 SVO", "but: 대조 연결. they agreed to take a meal break: agree + to부정사(목적어). always = 부사, at the meal hour = 전치사구(부사구): take 꾸밈"], "steps": [{"t": "이 문장은 <b>When절 + 주절 + but절</b>의 세 덩어리다. 앞의 When절 안에 5형식이 있어 길어 보인다."}, {"t": "When절부터 본다. <b>When they needed to get a lot of chores done in a short period of time</b>은 시간 부사절이다.", "sub": ["S: they (그들), V: needed (need 필요로 하다), O: to get a lot of chores done (많은 집안일을 끝내는 것)", "get + O + p.p. = O를 ~되게 하다 (chores가 끝내지는 관계). chore 집안일", "in a short period of time (짧은 시간 안에) = 전치사구"]}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: they (그들)", "V: used (use 사용하다의 과거형)", "O: her method (그녀의 방법). method 방법", "뼈대 = <b>they used her method</b>"]}, {"t": "<b>but they agreed to always take a meal break at the appropriate meal hour</b>가 두 번째 절이다.", "sub": ["S: they, V: agreed (agree 합의하다의 과거형)", "O: to always take a meal break (항상 식사 휴식을 취하기로). always는 부사", "at the appropriate meal hour (적절한 식사 시간에) = 전치사구. appropriate 적절한"]}], "sum": "급할 땐 그녀의 방법을 쓰되, 식사 휴식은 제때 취하기로 합의"}], "qs": [{"q": "07", "type": "빈칸", "src": "2023년 9월 31번", "ans": "①", "tr": [["1", "반항자들은 자신들이 반항자라고 생각할지도 모르지만, 영리한 마케터들이 나머지 우리에게 하는 것과 똑같이 그들에게 영향을 미친다."], ["2", "'모두가 그것을 하고 있다'고 말하는 것은 어떤 사람들이 어떤 아이디어에 흥미를 잃게 만들 수도 있다."], ["3", "이 사람들은 대안을 찾을 것인데, 그 대안은 (영리하게 계획된다면) 정확히 마케터나 설득자가 당신이 믿기를 바라는 것일 수 있다."], ["4", "만약 내가 당신이 어떤 아이디어를 고려하기를 바라고, 당신이 독립성과 유일성을 유지하기 위해 대중적인 의견을 강하게 거부한다는 것을 안다면, 나는 다수 의견을 먼저 제시할 것이고, 당신은 나의 실제 선호에 맞게 이 다수의 선택을 거부할 것이다."], ["5", "우리는 반항의 입장을 유지하려고 할 때 우리는 종종 속는다."], ["6", "사람들은 우리가 목적에 맞게 우리 스스로 '독자적으로' 그들의 목적에 맞는 선택지를 고르도록 만들기 위해 이러한 반전을 사용한다."], ["7", "일부 브랜드들은 주류에 대한 우리의 반항을 완전히 활용해 자신들을 반항아로 자리매김해 왔고, 이는 훨씬 더 강력한 브랜드 충성도를 만들어냈다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "People use this reversal to make us \"independently\" choose an option which suits their purposes."}, {"en": false, "h": "빈칸을 포함한 문장 (6)은 사람들의 목적에 맞게 우리가 스스로 선택하면서도 실은 마케터가 원하는 것을 고르도록 만드는 '무엇'을 사용한다는 내용이다. 문장 (4)~(5)에 따르면, 당신이 독립성과 유일성을 지키려고 대중적 의견에 반대한다는 것을 아는 대신, 다수 선택을 먼저 제시하여 당신이 이를 거부하게 만드는데, 이처럼 반항의 심리를 이용해 정반대로 선택하게 만드는 것이 바로 '반전(reversal)'이다."}], "opts": [{"n": "①", "t": "reversal", "a": true, "x": false, "trap": false, "e": "빈칸을 포함한 문장 (6)의 '무엇'을 사용한다는 내용은, 마케터가 원하는 것과 반대되는 다수 의견을 먼저 제시해 반항 심리를 이용한다는 문장 (4)~(5)의 '반전' 전략을 가리킨다."}, {"n": "②", "t": "imitation", "a": false, "x": true, "trap": false, "e": "모방에 관한 내용은 본문에 없다."}, {"n": "③", "t": "repetition", "a": false, "x": true, "trap": false, "e": "반복에 관한 내용은 본문에 없다."}, {"n": "④", "t": "conformity", "a": false, "x": true, "trap": true, "e": "동조는 반항 심리를 이용하는 전략과 반대되는 개념이다."}, {"n": "⑤", "t": "collaboration", "a": false, "x": true, "trap": false, "e": "협력에 관한 내용은 본문에 없다."}], "w": [["rebel", "반항자, 반역자"], ["alternative", "대안"], ["independence", "독립성"], ["uniqueness", "유일성"], ["preference", "선호"], ["defiance", "반항, 저항"], ["mainstream", "주류(主流)"], ["brand loyalty", "브랜드 충성도"]]}, {"q": "08", "type": "빈칸", "src": "2022년 6월 34번", "ans": "①", "tr": [["1", "오늘날 세계 대부분에서 자본주의와 자유 시장은 경제적 자원을 분배하고 경제적 생산을 장려하기 위한 최고의 시스템을 구성하는 것으로 받아들여지고 있다."], ["2", "국가들은 사회주의와 공산주의 같은 다른 체제를 시도해 왔지만, 많은 경우 완전히 자유 시장으로 전환하거나 자유 시장의 일부 측면을 받아들였다."], ["3", "자유 시장 시스템의 광범위한 수용에도 불구하고, 시장이 완전히 자유로운 상태로 맡겨지는 경우는 드물다."], ["4", "정부의 개입은 법과 규정의 제정·집행에서부터 미국 담보 대출 기관 같은 실체를 통한 경제 직접 참여에 이르기까지 여러 형태를 취한다."], ["5", "하지만 아마도 정부 개입의 가장 중요한 형태는, 중앙은행과 국가 재무기관이 경제 주기의 흥망성쇠를 통제하고 영향을 미치려는 시도에서 나타날 것이다."]], "evh": "3·4번 문장", "ev": [{"en": true, "h": "Despite the widespread acceptance of the free-market system, ___. Government involvement takes many forms, ranging from the enactment and enforcement of laws and regulations to direct participation in the economy..."}, {"en": false, "h": "본문에 따르면, 오늘날 세계 대부분에서 자본주의와 자유 시장 체제가 시행되고 있지만 문장 (4)와 (5)에서 설명하듯이 정부의 개입이 여전히 존재한다. 이는 특히 법과 규정의 제정과 집행, 미국 담보 대출 기관을 통한 직접적 경제 참여, 중앙은행과 국가 재무기관을 통한 경기 주기 통제 같은 구체적인 예시를 통해 확인할 수 있다. 따라서 빈칸에는 '시장이 완전히 자유로운 상태로 맡겨지는 경우는 드물다'는 내용의 ①이 적절하다."}], "opts": [{"n": "①", "t": "markets are rarely left entirely free", "a": true, "x": false, "trap": false, "e": "시장이 완전히 자유로운 상태로 맡겨지는 경우는 드물다는 내용으로, 뒤이어 나오는 정부 개입의 다양한 형태와 정확히 일치한다."}, {"n": "②", "t": "governments are reluctant to intervene", "a": false, "x": true, "trap": true, "e": "정부가 개입을 꺼린다는 것이 아니라, 정부가 다양한 형태로 적극 개입한다는 반대 내용이다."}, {"n": "③", "t": "supply and demand are not always balanced", "a": false, "x": true, "trap": false, "e": "수요와 공급의 균형에 관한 내용은 본문에 없다."}, {"n": "④", "t": "economic inequality continues to get worse", "a": false, "x": true, "trap": false, "e": "경제적 불평등에 관한 내용은 본문에 없다."}, {"n": "⑤", "t": "competition does not guarantee the maximum profit", "a": false, "x": true, "trap": false, "e": "경쟁과 최대 이윤에 관한 내용은 본문에 없다."}], "w": [["constitute", "구성하다"], ["allocate", "분배하다"], ["widespread", "광범위한"], ["involvement", "개입"], ["enactment", "(법률의) 제정"], ["enforcement", "집행"], ["entity", "실체, 독립체"], ["intervene", "개입하다"]]}, {"q": "09", "type": "요약", "src": "2015년 9월 40번", "ans": "①", "tr": [["1", "Decision Research와 Oregon 대학 소속 Paul Slovic의 연구는, 평소에는 배려심이 많아 한 개인을 돕기 위해 일부러 나서기까지 하는 사람들이 군중의 고통에는 무관심해진다는 것을 보여준다."], ["2", "한 실험에서, 사람들은 해외의 굶주림을 줄이기 위해 기 var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞의 <b>this</b>(이)는 바로 앞 4·5번 장면을 가리켜요. 4번의 <b>남들이 고르는 걸 먼저 보여 주면 반대로 고른다</b>는 장면을 한 단어로 묶는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (6번)</span><div class=\"en\">People use this <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> to make us “independently” choose an option which suits their purposes.</div><p class=\"ko\">사람들은 우리가 ‘독자적으로’ 자기들 목적에 맞는 걸 고르게 하려고 이 ( ? )을 쓴다</p></div><div class=\"ck-via\"><i>▼</i><span>this(이)가 가리키는 바로 그 작전이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">I would <mark>present the majority option first</mark>, which <mark>you would reject</mark> in favor of my actual preference.</div><p class=\"ko\">나는 <mark>대다수의 선택을 먼저 제시할 것이고</mark>, 당신은 내가 실제로 선호하는 것을 택하며 <mark>그것(= 대다수의 선택)을 거부할 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>반대로 고르려다 오히려 속는다 = 뒤집기 작전에 걸림</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 한 줄 정리</span><div class=\"en\">We are often tricked when we try to maintain a <mark>position of defiance</mark>.</div><p class=\"ko\">우리가 <mark>반항의 입장을</mark> 유지하려고 할 때 우리는 종종 속는다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">reversal 반전, 뒤집기<small>남들 것을 먼저 보여 줘서 반대로(뒤집어) 고르게 하는 작전이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">conformity 순응, 따라 하기</span><span class=\"why\">4번의 사람은 popular opinion(대중적인 의견)을 거부해요. 남을 따라 하게 하는 게 아니라 반대로 가게 만드는 작전이라 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">imitation 모방</span><span class=\"why\">누군가를 흉내 내게 하는 장면은 없어요. 4번은 대다수의 선택을 따라 하지 않고 거부하게 만드는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">repetition 반복</span><span class=\"why\">같은 말을 여러 번 되풀이하는 장면이 없어요. 4번은 대다수의 선택을 한 번 먼저(first) 보여 줄 뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">collaboration 협력</span><span class=\"why\">마케터와 우리가 함께 일하는 게 아니라, 5번처럼 우리가 마케터에게 속는(tricked) 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Rebels may think</div><div class=\"k\">반항자들은 생각할지도 모른다</div></div><div class=\"rc\"><div class=\"e\">they’re rebels,</div><div class=\"k\">자신들이 반항자라고,</div></div><div class=\"rc\"><div class=\"e\">but clever marketers influence them</div><div class=\"k\">하지만 영리한 마케터들은 그들에게 영향을 준다</div></div><div class=\"rc\"><div class=\"e\">just like the rest of us.</div><div class=\"k\">나머지 우리에게 그러듯이 똑같이.</div></div><div class=\"rnat\">반항자들은 자신들이 반항자라고 생각할지도 모르지만, 영리한 마케터들은 나머지 우리에게 그러듯이 그들에게도 영향을 준다.</div><div class=\"rst\">반에 “난 남들 따라 안 해!” 하는 친구가 있어요. 그런데 지문 1번은 이런 반항자도 영리한 마케터에게 똑같이 영향을 받는대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Saying, “Everyone is doing it”</div><div class=\"k\">“모두가 그것을 하고 있다”라고 말하는 것은</div></div><div class=\"rc\"><div class=\"e\">may turn some people off</div><div class=\"k\">일부 사람들을 흥미를 잃게 만들지도 모른다</div></div><div class=\"rc\"><div class=\"e\">from an idea.</div><div class=\"k\">어떤 생각에 대해.</div></div><div class=\"rnat\">'모두가 그것을 하고 있다'라고 말하는 것은 일부 사람들을 어떤 생각에 대해 흥미를 잃게 만들지도 모른다.</div><div class=\"rst\">“요즘 다들 이 운동화 신어!”라고 하면 그 친구는 바로 흥미를 잃어요. = 지문 2번, ‘모두 한다’는 말이 오히려 마음을 돌려 버려요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">These people will look for alternatives,</div><div class=\"k\">이 사람들은 대안을 찾을 것이고,</div></div><div class=\"rc\"><div class=\"e\">which (if cleverly planned)</div><div class=\"k\">그것은 (만약 영리하게 계획된다면)</div></div><div class=\"rc\"><div class=\"e\">can be exactly what a marketer or persuader</div><div class=\"k\">정확히 마케터나 설득자가</div></div><div class=\"rc\"><div class=\"e\">wants you to believe.</div><div class=\"k\">당신이 믿기를 원하는 것일 수 있다.</div></div><div class=\"rnat\">이 사람들은 대안을 찾을 것이고, 그것은 (만약 영리하게 계획된다면) 정확히 마케터나 설득자가 당신이 믿기를 원하는 것일 수 있다.</div><div class=\"rst\">그래서 그 친구는 다른 운동화를 찾아요. 그런데 그 ‘다른 것’이 사실 가게 주인이 처음부터 팔고 싶던 거라면요? = 지문 3번이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">If I want you to consider an idea,</div><div class=\"k\">만약 내가 당신이 어떤 아이디어를 고려하기를 바라고,</div></div><div class=\"rc\"><div class=\"e\">and know you strongly reject popular opinion</div><div class=\"k\">당신이 대중적인 의견을 강력히 거부한다는 것을 안다면,</div></div><div class=\"rc\"><div class=\"e\">in favor of maintaining your independence and uniqueness,</div><div class=\"k\">당신의 독립성과 유일성을 유지하기 위해,</div></div><div class=\"rc ckc\"><div class=\"e\">I would <span class=\"cw\">present the majority option first</span>,</div><div class=\"k\">나는 <span class=\"cw\">대다수의 선택을 먼저 제시할 것이고</span>,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">which you would reject</span></div><div class=\"k\"><span class=\"cw\">당신은 그것(= 대다수의 선택)을 거부할 것이다</span></div></div><div class=\"rc\"><div class=\"e\">in favor of my actual preference.</div><div class=\"k\">내가 실제로 선호하는 것에 맞게.</div></div><div class=\"rnat\">만약 내가 당신이 어떤 아이디어를 고려하기를 바라고, 당신이 당신의 독립성과 유일성을 유지하기 위해 대중적인 의견을 강력히 거부한다는 것을 안다면, 나는 대다수의 선택을 먼저 제시할 것이고, 당신은 내가 실제로 선호하는 것에 맞게 이(대다수의 선택)를 거부할 것이다.</div><div class=\"rst\"><b>가게 주인은 일부러 인기 운동화를 먼저 보여 줘요.</b> 친구는 그걸 싫다 하고, 주인이 진짜 팔려던 걸 골라요. = 지문 4번의 작전이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">We are often tricked</div><div class=\"k\">우리는 종종 속는다</div></div><div class=\"rc\"><div class=\"e\">when we try to maintain</div><div class=\"k\">우리가 유지하려고 할 때</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a position of defiance</span>.</div><div class=\"k\"><span class=\"cw\">반항의 입장을</span>.</div></div><div class=\"rnat\">우리가 반항의 입장을 유지하려고 할 때 우리는 종종 속는다.</div><div class=\"rst\">“난 반대로 간다!” 하고 버티다가 오히려 속는 거예요. = 지문 5번, 반항(defiance)하려다 속는다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">People use <span class=\"cw\">this reversal</span></div><div class=\"k\">사람들은 <span class=\"cw\">이 반전을</span> 사용한다※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">to make us “independently” choose</div><div class=\"k\">우리가 '독자적으로' 선택하도록 만들기 위해</div></div><div class=\"rc\"><div class=\"e\">an option which suits their purposes.</div><div class=\"k\">그들의 목적에 맞는 선택지를.</div></div><div class=\"rnat\">사람들은 우리가 '독자적으로' 그들의 목적에 맞는 선택지를 고르도록 만들기 위해 이러한 반전을 사용한다.</div><div class=\"rst\">친구는 “내가 혼자 골랐어”라고 믿지만 사실 주인의 <b>뒤집기 작전</b>에 걸린 거예요. 그래서 빈칸은 reversal(반전, 뒤집기)이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Some brands have taken full advantage of our defiance</div><div class=\"k\">일부 브랜드들은 우리의 반항을 완전히 활용했고</div></div><div class=\"rc\"><div class=\"e\">towards the mainstream</div><div class=\"k\">주류에 대한</div></div><div class=\"rc\"><div class=\"e\">and positioned themselves as rebels;</div><div class=\"k\">스스로를 반항자로 자리 잡았다;</div></div><div class=\"rc\"><div class=\"e\">which has created even stronger brand loyalty.</div><div class=\"k\">이는 훨씬 더 강력한 브랜드 충성도를 만들어 왔다.</div></div><div class=\"rnat\">일부 브랜드들은 주류에 대한 우리의 반항을 완전히 활용하여 스스로를 반항자로 자리 잡아 왔고, 이는 훨씬 더 강력한 브랜드 충성도를 만들어 왔다.</div><div class=\"rst\">어떤 운동화 회사는 아예 “우리는 반항자 브랜드”라고 해요. 그러면 그 친구 같은 아이들이 더 꽉 붙어요. = 지문 7번의 브랜드 충성도예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"rebel\" data-m=\"반항자, 반역자\"><b>rebel</b>반항자, 반역자</button><button type=\"button\" class=\"wdb\" data-w=\"alternative\" data-m=\"대안\"><b>alternative</b>대안</button><button type=\"button\" class=\"wdb\" data-w=\"in favor of\" data-m=\"~을 위해, ~에 맞게\"><b>in favor of</b>~을 위해, ~에 맞게</button><button type=\"button\" class=\"wdb\" data-w=\"defiance\" data-m=\"반항, 저항\"><b>defiance</b>반항, 저항</button><button type=\"button\" class=\"wdb\" data-w=\"mainstream\" data-m=\"주류(主流)\"><b>mainstream</b>주류(主流)</button><button type=\"button\" class=\"wdb\" data-w=\"brand loyalty\" data-m=\"브랜드 충성도\"><b>brand loyalty</b>브랜드 충성도</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 문장은 <b>Despite</b>(~에도 불구하고)로 시작해요. 앞의 “자유 시장이 널리 받아들여짐”과 <b>반대 방향</b>이면서, 뒤 4·5번의 <b>정부 개입</b> 예시를 한 줄로 묶는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (3번)</span><div class=\"en\"><mark>Despite</mark> the widespread acceptance of the free-market system, <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">자유 시장 시스템이 널리 받아들여졌음에도 불구하고, ( ? )</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 바로 뒤에서 “정부가 끼어든다”를 예로 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\"><mark>Government involvement</mark> takes many forms, ranging from the enactment and enforcement of laws and regulations to direct participation in the economy …</div><p class=\"ko\"><mark>정부의 개입은</mark> 여러 형태를 취한다, 법과 규정의 제정과 집행에서부터 경제에 대한 직접적인 참여에 이르기까지 …</p></div><div class=\"ck-via\"><i>▼</i><span>가장 중요한 개입까지 덧붙여서, 시장이 혼자 굴러가지 않는다는 걸 굳혀요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 개입 예시 더하기</span><div class=\"en\">Perhaps the most important form of <mark>government involvement</mark>, however, comes in the attempts of central banks and national treasuries to control …</div><p class=\"ko\">그러나, 아마도 <mark>정부 개입의</mark> 가장 중요한 형태는 경기의 오르내림을 통제하려는 중앙은행과 국가 재무기관의 시도에서 나타날 것이다 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">markets are rarely left entirely free 시장이 완전히 자유로운 상태로 맡겨지는 경우는 드물다<small>Despite(~에도 불구하고)의 반대 방향 + 4·5번 정부 개입을 그대로 묶어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">governments are reluctant to intervene 정부들은 개입하기를 꺼린다</span><span class=\"why\">4·5번은 정부가 법, 직접 참여, 경기 조절로 계속 끼어든다는 얘기예요. 개입을 꺼린다는 건 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">supply and demand are not always balanced 수요와 공급이 항상 균형을 이루지는 않는다</span><span class=\"why\">지문에 supply(공급)·demand(수요)의 균형 얘기는 없어요. 뒤 문장들은 모두 Government involvement(정부의 개입) 얘기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">economic inequality continues to get worse 경제적 불평등이 계속 악화된다</span><span class=\"why\">불평등이 심해진다는 말은 지문 어디에도 없어요. 4·5번이 보여 주는 건 정부가 시장에 손을 댄다는 것뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">competition does not guarantee the maximum profit 경쟁이 최대 이윤을 보장하지 않는다</span><span class=\"why\">경쟁이나 이윤 얘기가 없어요. 빈칸 뒤 4번은 바로 정부의 개입으로 이어지니 이 내용과 맞지 않아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In most of the world,</div><div class=\"k\">세계 대부분에서,</div></div><div class=\"rc\"><div class=\"e\">capitalism and free markets</div><div class=\"k\">자본주의와 자유 시장은</div></div><div class=\"rc\"><div class=\"e\">are accepted today</div><div class=\"k\">오늘날 받아들여지고 있다</div></div><div class=\"rc\"><div class=\"e\">as constituting the best system</div><div class=\"k\">최고의 시스템을 구성하는 것으로</div></div><div class=\"rc\"><div class=\"e\">for allocating economic resources</div><div class=\"k\">경제적 자원을 분배하고</div></div><div class=\"rc\"><div class=\"e\">and encouraging economic output.</div><div class=\"k\">경제적 생산을 장려하기 위한.</div></div><div class=\"rnat\">오늘날 세계 대부분에서 자본주의와 자유 시장은 경제적 자원을 분배하고 경제적 생산을 장려하기 위한 최고의 시스템을 구성하는 것으로 받아들여지고 있다.</div><div class=\"rst\">우리 반 체육대회는 “학생들끼리 알아서 정하기”가 제일 좋은 방법이라고 다들 생각해요. = 지문 1번, 자유 시장이 최고의 시스템으로 받아들여진다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Nations have tried other systems,</div><div class=\"k\">국가들은 다른 시스템들을 시도했지만,</div></div><div class=\"rc\"><div class=\"e\">such as socialism and communism,</div><div class=\"k\">사회주의와 공산주의 같은,</div></div><div class=\"rc\"><div class=\"e\">but in many cases</div><div class=\"k\">하지만 많은 경우</div></div><div class=\"rc\"><div class=\"e\">they have either switched wholesale to</div><div class=\"k\">그들은 ~로 완전히 전환하거나</div></div><div class=\"rc\"><div class=\"e\">or adopted aspects of free markets.</div><div class=\"k\">자유 시장의 측면들을 받아들였다.</div></div><div class=\"rnat\">국가들은 사회주의와 공산주의 같은 다른 시스템들을 시도했지만, 많은 경우 그들은 자유 시장으로 완전히 전환하거나 자유 시장의 측면들을 받아들였다.</div><div class=\"rst\">예전엔 선생님이 다 정해 주는 방식도 해 봤지만, 결국 대부분 반이 “알아서 정하기”로 바꿨어요. = 지문 2번, 다른 체제를 해 보다 자유 시장으로 돌아왔다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Despite the widespread acceptance</div><div class=\"k\">광범위한 수용에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">of the free-market system,</div><div class=\"k\">자유 시장 시스템의,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">markets are rarely left entirely free</span>.</div><div class=\"k\"><span class=\"cw\">시장이 완전히 자유로운 상태로 맡겨지는 경우는 드물다</span>.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">자유 시장 시스템의 광범위한 수용에도 불구하고, 시장이 완전히 자유로운 상태로 맡겨지는 경우는 드물다.</div><div class=\"rst\"><b>그런데도</b>(Despite) 학생들끼리만 완전히 맡겨 두는 일은 거의 없어요. 그래서 빈칸은 “시장이 완전히 자유롭게 맡겨지는 일은 드물다”예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Government involvement</span></div><div class=\"k\"><span class=\"cw\">정부의 개입은</span></div></div><div class=\"rc\"><div class=\"e\">takes many forms,</div><div class=\"k\">여러 형태를 취한다,</div></div><div class=\"rc\"><div class=\"e\">ranging from the enactment and enforcement</div><div class=\"k\">제정과 집행에서부터</div></div><div class=\"rc\"><div class=\"e\">of laws and regulations</div><div class=\"k\">법과 규정의</div></div><div class=\"rc\"><div class=\"e\">to direct participation in the economy</div><div class=\"k\">경제에 대한 직접적인 참여에 이르기까지</div></div><div class=\"rc\"><div class=\"e\">through entities like the U.S.’s mortgage agencies.</div><div class=\"k\">미국의 담보 대출 기관과 같은 실체를 통한.</div></div><div class=\"rnat\">정부의 개입은 법과 규정의 제정과 집행에서부터 미국 담보 대출 기관과 같은 실체를 통한 직접적인 경제 참여에 이르기까지 다양한 형태를 취한다.</div><div class=\"rst\">선생님이 규칙을 정해 주고, 지키는지 보고, 가끔 직접 팀에 들어가 돕기도 해요. = 지문 4번, 정부의 <b>개입</b>이 여러 형태라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Perhaps the most important form</div><div class=\"k\">아마도 가장 중요한 형태는</div></div><div class=\"rc ckc\"><div class=\"e\">of <span class=\"cw\">government involvement</span>,</div><div class=\"k\"><span class=\"cw\">정부 개입의</span>,</div></div><div class=\"rc\"><div class=\"e\">however,</div><div class=\"k\">그러나,</div></div><div class=\"rc\"><div class=\"e\">comes in the attempts</div><div class=\"k\">시도에서 나타날 것이다</div></div><div class=\"rc\"><div class=\"e\">of central banks and national treasuries</div><div class=\"k\">중앙은행과 국가 재무기관의</div></div><div class=\"rc\"><div class=\"e\">to control and affect</div><div class=\"k\">통제하고 영향을 미치려는</div></div><div class=\"rc\"><div class=\"e\">the ups and downs of economic cycles.</div><div class=\"k\">경기 주기의 흥망성쇠를.</div></div><div class=\"rnat\">그러나 아마도 가장 중요한 형태의 정부 개입은 중앙은행과 국가 재무기관이 경기 주기의 흥망성쇠를 통제하고 영향을 미치려는 시도에서 나타날 것이다.</div><div class=\"rst\">제일 중요한 건, 반 분위기가 너무 들뜨거나 처질 때 선생님이 조절해 주는 거예요. = 지문 5번, 중앙은행이 경기의 오르내림을 조절하려 한다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"widespread\" data-m=\"광범위한\"><b>widespread</b>광범위한</button><button type=\"button\" class=\"wdb\" data-w=\"involvement\" data-m=\"개입\"><b>involvement</b>개입</button><button type=\"button\" class=\"wdb\" data-w=\"enactment\" data-m=\"(법률의) 제정\"><b>enactment</b>(법률의) 제정</button><button type=\"button\" class=\"wdb\" data-w=\"enforcement\" data-m=\"집행\"><b>enforcement</b>집행</button><button type=\"button\" class=\"wdb\" data-w=\"regulation\" data-m=\"규정\"><b>regulation</b>규정</button><button type=\"button\" class=\"wdb\" data-w=\"entity\" data-m=\"실체, 기관\"><b>entity</b>실체, 기관</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 실험 결과를 <b>말만 바꿔 옮긴 것</b>이에요. 7번에서 <b>누구에게</b> 기부가 많았는지로 (A)를, 9번에서 <b>무엇을 덧붙이자</b> 기부가 줄었는지로 (B)를 채우세요.</p><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · (A)의 근거</span><div class=\"en\">Slovic reported that donations to <mark>the individual</mark>, Rokia, were <mark>far greater</mark> than donations to the second choice …</div><p class=\"ko\">Slovic은 <mark>개인인 Rokia에 대한</mark> 기부금이 두 번째 선택에 대한 기부금보다 <mark>훨씬 더 많았다고</mark> 보고했다.</p></div><div class=\"ck-via\"><i>▼</i><span>But(하지만)으로 진짜 놀라운 결과가 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · (B)의 근거</span><div class=\"en\">… adding the statistical realities of <mark>the larger hunger problem</mark> to Rokia’s story <mark>significantly reduced</mark> the contributions to Rokia.</div><p class=\"ko\">… <mark>더 큰 기아 문제에 대한</mark> 통계적 현실을 Rokia의 이야기에 덧붙이는 것이 기부금을 <mark>상당히 감소시켰다는</mark> 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>the individual(개인) = (A) an individual(한 개인), the larger hunger problem(더 큰 기아 문제) = (B) larger(더 큰)</span></div><div class=\"ck-step\"><span class=\"lab\">요약문 (10번) · 짝 맞추기</span><div class=\"en\">… while people are more willing to help <mark>an individual</mark> in need, they become indifferent when given <mark>the larger perspective</mark> of hunger.</div><p class=\"ko\">… 사람들이 <mark>어려움에 처한 한 개인을</mark> 더 기꺼이 돕는 반면, 기아라는 <mark>더 큰 관점이</mark> 주어지면 그들은 무관심해진다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">an individual 한 개인 … larger 더 큰<small>7번의 the individual(개인), 9번의 the larger hunger problem(더 큰 기아 문제)을 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">the masses 군중 … broader 더 넓은</span><span class=\"why\">(B)는 비슷해 보여도 (A)가 반대예요. 1번에서 사람들은 the masses(군중)의 고통에는 오히려 무관심해진다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">an individual 한 개인 … simpler 더 단순한</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 9번에서 덧붙인 건 더 단순한 정보가 아니라 the larger hunger problem(더 큰 기아 문제)의 통계예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">the masses 군중 … fairer 더 공정한</span><span class=\"why\">둘 다 틀려요. 7번에서 기부가 많았던 건 군중이 아니라 개인 로키아이고, 공정한 관점이라는 말은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">a nation 한 국가 … clearer 더 명확한</span><span class=\"why\">둘 다 틀려요. 실험에서 돕는 대상은 국가가 아니라 7번의 개인 로키아이고, 9번은 더 명확한 정보가 아니라 더 큰 문제의 통계를 덧붙였어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Research by Paul Slovic</div><div class=\"k\">Paul Slovic의 연구는</div></div><div class=\"rc\"><div class=\"e\">of Decision Research and the University of Oregon</div><div class=\"k\">Decision Research와 Oregon 대학 소속의</div></div><div class=\"rc\"><div class=\"e\">shows that people</div><div class=\"k\">보여 준다 사람들이</div></div><div class=\"rc\"><div class=\"e\">who are otherwise caring</div><div class=\"k\">다른 경우에는 배려심이 많고</div></div><div class=\"rc\"><div class=\"e\">and would go out of their way</div><div class=\"k\">일부러 나설</div></div><div class=\"rc\"><div class=\"e\">to help another individual</div><div class=\"k\">다른 개인을 돕기 위해</div></div><div class=\"rc\"><div class=\"e\">become indifferent to</div><div class=\"k\">~에 무관심해진다는 것을</div></div><div class=\"rc\"><div class=\"e\">the suffering of the masses.</div><div class=\"k\">군중의 고통에.</div></div><div class=\"rnat\">Decision Research와 Oregon 대학 소속 Paul Slovic의 연구는, 다른 경우에는 배려심이 많고 남을 돕기 위해 일부러 나설 사람들이 군중의 고통에는 무관심해진다는 것을 보여준다.</div><div class=\"rst\">친구 한 명이 다치면 우리는 바로 달려가 도와요. 그런데 “수많은 사람이 힘들다”는 말에는 덤덤해져요. = 지문 1번, 군중의 고통엔 무관심해진다는 연구예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In one experiment,</div><div class=\"k\">한 실험에서,</div></div><div class=\"rc\"><div class=\"e\">people were given $5</div><div class=\"k\">사람들은 5달러를 받았다</div></div><div class=\"rc\"><div class=\"e\">to donate to lessen hunger overseas.</div><div class=\"k\">해외의 기아를 줄이기 위해 기부할.</div></div><div class=\"rnat\">한 실험에서, 사람들은 해외의 기아를 줄이기 위해 기부할 5달러를 받았다.</div><div class=\"rst\">학교에서 불우이웃 돕기 성금으로 쓸 5천 원을 받았다고 해 봐요. = 지문 2번, 실험에서 해외 기아를 줄이려고 기부할 5달러를 받은 장면이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The first choice</div><div class=\"k\">첫 번째 선택은</div></div><div class=\"rc\"><div class=\"e\">was to give the money</div><div class=\"k\">그 돈을 주는 것이었다</div></div><div class=\"rc\"><div class=\"e\">to a particular child, Rokia,</div><div class=\"k\">특정 아이 Rokia에게,</div></div><div class=\"rc\"><div class=\"e\">a seven-year-old in Mali.</div><div class=\"k\">말리에 사는 7살짜리인.</div></div><div class=\"rnat\">첫 번째 선택은 Mali(말리)에 있는, 7살짜리의 Rokia라는 특정 아이에게 돈을 주는 것이었다.</div><div class=\"rst\">첫 번째는 일곱 살 아이 로키아 한 명에게 주는 거예요. = 지문 3번, 말리에 사는 특정 아이에게 주는 선택이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The second choice</div><div class=\"k\">두 번째 선택은</div></div><div class=\"rc\"><div class=\"e\">was to help</div><div class=\"k\">돕는 것이었다</div></div><div class=\"rc\"><div class=\"e\">twenty-one million hungry Africans.</div><div class=\"k\">2천 1백만 명의 굶주린 아프리카인들을.</div></div><div class=\"rnat\">두 번째 선택은 2천 1백만 (명)의 굶주린 아프리카인들을 돕는 것이었다.</div><div class=\"rst\">두 번째는 “굶주리는 아프리카 사람 2천 1백만 명”을 돕는 거예요. = 지문 4번, 숫자로 된 큰 무리를 돕는 선택이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The third choice</div><div class=\"k\">세 번째 선택은</div></div><div class=\"rc\"><div class=\"e\">was to help Rokia,</div><div class=\"k\">Rokia를 돕는 것이었다,</div></div><div class=\"rc\"><div class=\"e\">but as just one</div><div class=\"k\">하지만 단지 하나로서</div></div><div class=\"rc\"><div class=\"e\">of many victims of hunger.</div><div class=\"k\">기아의 많은 희생자들 중.</div></div><div class=\"rnat\">세 번째 선택은 Rokia를 돕는 것이었지만, 단지 기아의 많은 희생자들 중 하나로서(돕는 것이었다).</div><div class=\"rst\">세 번째는 로키아를 돕되, “수많은 피해자 중 한 명”이라는 설명을 붙인 거예요. = 지문 5번의 세 번째 선택이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Can you guess</div><div class=\"k\">당신은 추측할 수 있는가</div></div><div class=\"rc\"><div class=\"e\">which choice was most popular?</div><div class=\"k\">어떤 선택이 가장 인기가 있었는지?</div></div><div class=\"rnat\">당신은 어떤 선택이 가장 인기가 있었는지 추측할 수 있는가?</div><div class=\"rst\">우리 반 친구들은 어디에 제일 많이 냈을까요? 지문 6번도 이렇게 물어요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Slovic reported that</div><div class=\"k\">Slovic은 보고했다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">donations to the individual, Rokia,</span></div><div class=\"k\"><span class=\"cw\">개인인 Rokia에 대한 기부금이,</span></div></div><div class=\"rc\"><div class=\"e\">were far greater</div><div class=\"k\">훨씬 더 많았다고</div></div><div class=\"rc\"><div class=\"e\">than donations to the second choice,</div><div class=\"k\">두 번째 선택에 대한 기부금보다,</div></div><div class=\"rc\"><div class=\"e\">the statistical portrayal of the hunger crisis.</div><div class=\"k\">기아 위기의 통계적 묘사인.</div></div><div class=\"rnat\">Slovic은 Rokia 개인을 향한 기부금이 기아 위기의 통계적 묘사인(기아 위기 상황을 통계적으로 보여주는), 두 번째 선택에 대한 기부금보다 훨씬 많았다고 보고했다.</div><div class=\"rst\">역시 <b>로키아 한 명</b>에게 낸 돈이 훨씬 많았어요. = 지문 7번, 개인에 대한 기부가 통계보다 훨씬 많았다는 결과예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">That’s not particularly surprising.</div><div class=\"k\">그것은 특별히 놀랍지는 않다.</div></div><div class=\"rnat\">그것은 특별히 놀랍지는 않다.</div><div class=\"rst\">사실 이건 우리도 예상했죠. 지문 8번도 별로 놀랍지 않다고 해요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">But what is surprising,</div><div class=\"k\">하지만 놀라운 것은,</div></div><div class=\"rc\"><div class=\"e\">and some would say discouraging,</div><div class=\"k\">그리고 어떤 사람들은 실망스럽다고 말할 텐데,</div></div><div class=\"rc\"><div class=\"e\">is that adding the statistical realities</div><div class=\"k\">통계적 현실을 덧붙이는 것(= 세 번째 선택)이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">of the larger hunger problem</span></div><div class=\"k\"><span class=\"cw\">더 큰 기아 문제에 대한</span></div></div><div class=\"rc\"><div class=\"e\">to Rokia’s story</div><div class=\"k\">Rokia의 이야기에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">significantly reduced the contributions</span></div><div class=\"k\"><span class=\"cw\">기부금을 상당히 감소시켰다는 것이다</span></div></div><div class=\"rc\"><div class=\"e\">to Rokia.</div><div class=\"k\">Rokia에 대한.</div></div><div class=\"rnat\">하지만 놀랍고, 누군가는 실망스럽다고 말할 것은, Rokia의 이야기에 더 큰 기아 문제에 대한 통계적 현실을 덧붙이는 것(세 번째 선택)이 Rokia에 대한 기부금을 상당히 감소시켰다는 것이다.</div><div class=\"rst\"><b>그런데</b>(But) 로키아 얘기에 “더 큰 기아 문제” 숫자를 붙이자 오히려 돈이 확 줄었어요. = 지문 9번의 놀라운 결과예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">An experiment shows that</div><div class=\"k\">한 실험은 보여 준다</div></div><div class=\"rc\"><div class=\"e\">while people are more willing to help</div><div class=\"k\">사람들이 더 기꺼이 돕는 반면</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">an individual in need,</span></div><div class=\"k\"><span class=\"cw\">어려움에 처한 한 개인을</span>※ 문제지엔 빈칸 (A)/(B)로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">they become indifferent</div><div class=\"k\">그들은 무관심해진다</div></div><div class=\"rc ckc\"><div class=\"e\">when given <span class=\"cw\">the larger perspective of hunger.</span></div><div class=\"k\"><span class=\"cw\">기아라는 더 큰 관점이 주어지면.</span>※ 문제지엔 빈칸 (A)/(B)로 되어 있음</div></div><div class=\"rnat\">한 실험은 사람들이 어려움에 처한 (A)한 개인은 더 기꺼이 돕는 반면에, 기아라는 (B)더 큰 관점이 주어지면 그들은 무관심해진다는 것을 보여준다.</div><div class=\"rst\">정리하면, <b>한 사람</b>(an individual)은 잘 돕지만 <b>더 큰</b>(larger) 그림을 보여 주면 덤덤해져요. 7·9번을 그대로 옮긴 요약이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"go out of one's way\" data-m=\"일부러 나서다\"><b>go out of one's way</b>일부러 나서다</button><button type=\"button\" class=\"wdb\" data-w=\"indifferent\" data-m=\"무관심한\"><b>indifferent</b>무관심한</button><button type=\"button\" class=\"wdb\" data-w=\"the masses\" data-m=\"군중, 일반 대중\"><b>the masses</b>군중, 일반 대중</button><button type=\"button\" class=\"wdb\" data-w=\"statistical\" data-m=\"통계적인\"><b>statistical</b>통계적인</button><button type=\"button\" class=\"wdb\" data-w=\"portrayal\" data-m=\"묘사\"><b>portrayal</b>묘사</button><button type=\"button\" class=\"wdb\" data-w=\"contribution\" data-m=\"기부, 기여\"><b>contribution</b>기부, 기여</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 <b>과학 연구 자료를 모으는 드론</b>이에요. drone(드론)이라는 단어만 같고 화제가 다른 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 글 전체 화제</span><div class=\"en\">Drones may be useful to <mark>collect all kinds of research data</mark>.</div><p class=\"ko\">드론은 <mark>모든 종류의 연구 자료를 수집하는 데</mark> 유용할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>For instance(예를 들면)로 기상학 자료 수집의 예를 들어요</span></div><div class=\"ck-step\"><span class=\"lab\">①(3번) · 화제의 첫 예</span><div class=\"en\">For instance, in meteorology <mark>drones can collect data</mark> on humidity, pressure, temperature …</div><p class=\"ko\">예를 들면, 기상학에서, 드론은 습도, 기압, 온도 … 에 대한 <mark>자료를 수집할 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>자료 수집 이야기가 갑자기 배달·교통 이야기로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">③(5번) · 이탈 지점</span><div class=\"en\">With <mark>drone delivery systems</mark>, fewer transportation carriers will be traveling on roads and polluting the atmosphere.</div><p class=\"ko\"><mark>드론 배달 시스템으로</mark>, 더 적은 수송 차량이 도로 위를 달릴 것이고 대기를 오염시킬 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>③을 빼면 ②의 드론 자료 → ④의 드론 자료로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">④(6번) · 다시 제자리</span><div class=\"en\">Drones can <mark>gather relevant data</mark> in places that were previously difficult or costly to reach …</div><p class=\"ko\">드론은 이전에 도달하기 어렵거나 많은 비용이 들었던 장소에서 <mark>유의미한 자료를 수집할 수 있다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">드론 배달 시스템으로 도로 위 수송 차량과 대기 오염이 줄어든다<small>연구 자료 수집이 아니라 배달·교통 이야기라 흐름에서 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">토네이도·허리케인이 올 때 드론 자료로 안전을 찾는다</span><span class=\"why\">안전 얘기라 튀어 보이지만, the data gathered by drones(드론이 수집한 자료)라고 해서 ①의 기상 자료를 그대로 이어 가요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">기상학에서 드론이 습도·기압·온도 등의 자료를 모은다</span><span class=\"why\">For instance(예를 들면)로 2번 “연구 자료 수집”의 첫 예를 들어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">가기 어렵던 곳에서도 드론이 유의미한 자료를 모은다</span><span class=\"why\">gather relevant data(유의미한 자료를 수집하다)로 다시 자료 수집 화제로 돌아와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">그런 지식이 기후 모형을 개선하고 예측을 정확하게 한다</span><span class=\"why\">Such knowledge(그러한 지식)가 ④의 대기와 기후에 대한 새로운 과학적 지식을 받아서 마무리해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The use of drones</div><div class=\"k\">드론의 사용은</div></div><div class=\"rc\"><div class=\"e\">in science</div><div class=\"k\">과학 분야에서</div></div><div class=\"rc\"><div class=\"e\">has been increasing.</div><div class=\"k\">증가해 왔다.</div></div><div class=\"rnat\">과학 분야에서 드론의 사용은 증가해 왔다.</div><div class=\"rst\">요즘 과학 동아리에서 드론을 쓰는 일이 점점 늘고 있어요. = 지문 1번, 과학에서 드론 사용이 늘었다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Drones may be useful</div><div class=\"k\">드론은 유용할 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to collect all kinds of research data.</span></div><div class=\"k\"><span class=\"cw\">모든 종류의 연구 자료를 수집하는 데.</span></div></div><div class=\"rnat\">드론은 모든 종류의 연구 자료를 수집하는 데 유용할 수 있다.</div><div class=\"rst\">드론은 동아리 실험에 필요한 <b>온갖 자료를 모으는 데</b> 딱이에요. = 지문 2번, 이게 글 전체 화제예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">① For instance,</div><div class=\"k\">① 예를 들면,</div></div><div class=\"rc\"><div class=\"e\">in meteorology</div><div class=\"k\">기상학에서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">drones can collect data</span></div><div class=\"k\"><span class=\"cw\">드론은 자료를 수집할 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">on humidity, pressure, temperature,</div><div class=\"k\">습도, 기압, 온도,</div></div><div class=\"rc\"><div class=\"e\">wind force, radiation, etc.</div><div class=\"k\">바람의 세기, 복사열 등에 대한.</div></div><div class=\"rnat\">① 예를 들면, 기상학에서, 드론은 습도, 기압, 온도, 바람의 세기, 복사열 등에 대한 자료를 수집할 수 있다.</div><div class=\"rst\">① 예를 들어 날씨 조사 때 드론을 띄우면 습도, 기온, 바람 세기 같은 걸 재 와요. = 지문의 기상학 자료 수집이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">② In case of nearing tornados or hurricanes,</div><div class=\"k\">② 토네이도나 허리케인이 다가오는 경우,</div></div><div class=\"rc\"><div class=\"e\">people can seek safety</div><div class=\"k\">사람들은 안전을 추구할 수 있다</div></div><div class=\"rc\"><div class=\"e\">with the help of the data</div><div class=\"k\">자료의 도움으로</div></div><div class=\"rc\"><div class=\"e\">gathered by drones.</div><div class=\"k\">드론에 의해 수집된.</div></div><div class=\"rnat\">② 토네이도나 허리케인이 다가오는 경우, 사람들은 드론에 의해 수집된 자료의 도움으로 안전을 추구할 수 있다.</div><div class=\"rst\">② 태풍이 다가오면 드론이 모은 그 자료 덕분에 사람들이 미리 안전한 곳을 찾아요. = 지문의 드론 자료로 안전을 찾는 장면이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">③ <span class=\"cw\">With drone delivery systems,</span></div><div class=\"k\">③ <span class=\"cw\">드론 배달 시스템으로,</span></div></div><div class=\"rc\"><div class=\"e\">fewer transportation carriers</div><div class=\"k\">더 적은 수송 차량이</div></div><div class=\"rc\"><div class=\"e\">will be traveling on roads</div><div class=\"k\">도로 위를 달릴 것이고</div></div><div class=\"rc\"><div class=\"e\">and polluting the atmosphere.</div><div class=\"k\">대기를 오염시킬 것이다.</div></div><div class=\"rnat\">③ 드론 배달 시스템으로, 더 적은 수송 차량이 도로 위를 달릴 것이고 (더 적은 차량이) 대기를 오염시킬 것이다.</div><div class=\"rst\">③ 갑자기 “드론으로 택배를 보내면 도로에 트럭이 줄어요”라는 얘기가 나와요. 자료 수집이 아니라 <b>배달</b> 얘기라 흐름에서 튀어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\">④ <span class=\"cw\">Drones can gather relevant data</span></div><div class=\"k\">④ <span class=\"cw\">드론은 유의미한 자료를 수집할 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">in places that were previously difficult or costly to reach</div><div class=\"k\">이전에 도달하기 어렵거나 많은 비용이 들었던 장소에서</div></div><div class=\"rc\"><div class=\"e\">— data that may provide</div><div class=\"k\">— 제공할 수 있는 자료,</div></div><div class=\"rc\"><div class=\"e\">new scientific knowledge</div><div class=\"k\">새로운 과학적 지식을</div></div><div class=\"rc\"><div class=\"e\">about the atmosphere and the climate.</div><div class=\"k\">대기와 기후에 대한.</div></div><div class=\"rnat\">④ 드론은 이전에 도달하기 어렵거나 많은 비용이 들었던 장소에서 유의미한 자료, (즉) 대기와 기후에 대한 새로운 과학적 지식을 제공할 수 있는 자료를 수집할 수 있다.</div><div class=\"rst\">④ 다시 자료 얘기예요. 사람이 올라가기 힘든 산꼭대기에서도 드론이 자료를 모아 와요. = 지문의 가기 어렵던 곳의 자료 수집이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">⑤ Such knowledge may improve</div><div class=\"k\">⑤ 그러한 지식은 개선할 수 있고</div></div><div class=\"rc\"><div class=\"e\">existing climate models</div><div class=\"k\">기존의 기후 모형을</div></div><div class=\"rc\"><div class=\"e\">and provide more accurate predictions.</div><div class=\"k\">더 정확한 예측을 제공할 수 있다.</div></div><div class=\"rnat\">⑤ 그러한 지식은 기존의 기후 모형을 개선할 수 있고 더 정확한 예측을 제공할 수 있다.</div><div class=\"rst\">⑤ 그렇게 모은 자료로 동아리 날씨 예보가 더 잘 맞게 돼요. = 지문 마무리, 그러한 지식이 기후 예측을 더 정확하게 한다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"meteorology\" data-m=\"기상학\"><b>meteorology</b>기상학</button><button type=\"button\" class=\"wdb\" data-w=\"humidity\" data-m=\"습도\"><b>humidity</b>습도</button><button type=\"button\" class=\"wdb\" data-w=\"transportation\" data-m=\"수송, 운송\"><b>transportation</b>수송, 운송</button><button type=\"button\" class=\"wdb\" data-w=\"atmosphere\" data-m=\"대기\"><b>atmosphere</b>대기</button><button type=\"button\" class=\"wdb\" data-w=\"relevant\" data-m=\"유의미한, 관련 있는\"><b>relevant</b>유의미한, 관련 있는</button><button type=\"button\" class=\"wdb\" data-w=\"prediction\" data-m=\"예측\"><b>prediction</b>예측</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>갈등이 풀리는 전환점</b>과 <b>마지막 결과</b>를 묶어서 찾으세요. 5번 “<b>누구도 틀리지 않았다</b>”에서 방향이 바뀌고, 7·8번에서 두 방식을 <b>번갈아</b> 쓰며 9번에서 문제가 사라져요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 처음 문제</span><div class=\"en\">My buddy and his wife were in <mark>constant conflict</mark> over when the housework should get done.</div><p class=\"ko\">나의 동료와 그의 아내는 언제 집안일이 처리되어야 하는지에 대해 <mark>끊임없는 갈등을 겪었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>누가 옳은지 싸우던 이야기가 “서로 다를 뿐”으로 바뀌어요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 전환점</span><div class=\"en\"><mark>Neither of them were wrong</mark>; they just had <mark>different preferences</mark>.</div><p class=\"ko\"><mark>그들 중 어느 누구도 틀리지 않았다</mark>; 그들은 단지 <mark>다른 선호를</mark> 가지고 있었다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7번</em>일이 많고 시간이 짧을 땐 그녀의 방법(한 번에 끝내기) + 식사 휴식</span><span><em>8번</em>일이 적고 시간이 넉넉할 땐 그의 방법(조금씩) + 일 하나는 끝내고 쉬기</span></div><div class=\"ck-eq\">⇒ 7·8번의 공통점 = 두 사람의 방식을 상황에 맞게 섞어 씀(조화)</div></div><div class=\"ck-via\"><i>▼</i><span>섞어 쓴 결과, 집안일이 더 이상 다툼거리가 아니게 돼요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결과</span><div class=\"en\">This way, both of them could feel productive, and the housework <mark>no longer</mark> had to be a huge sore spot between them.</div><p class=\"ko\">이런 방식으로, 그들 둘 다 생산적이라고 느낄 수 있었고, 집안일은 <mark>더 이상</mark> 그들 사이의 큰 문제일 필요가 없었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">How a Couple's Housework Styles Harmonize 부부의 집안일 방식이 조화를 이루는 방법<small>5번 “다를 뿐”과 7·8번 “두 방식 섞어 쓰기”, 9번 “문제 해결”을 모두 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">50/50 Plan(50 대 50 계획): Splitting Housework with Your Spouse(배우자와 집안일 나누기)</span><span class=\"why\">[지문에 없음] 집안일 얘기라 끌리지만, 지문은 일을 반씩 나누는 게 아니라 7·8번처럼 상황에 따라 그녀의 방법과 그의 방법을 골라 쓴다는 얘기예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Married Couples Are Constantly at Cold War(부부는 늘 냉전 중이다)</span><span class=\"why\">[반대] 1번의 constant conflict(끊임없는 갈등)만 따온 함정이에요. 9번에서 집안일은 더 이상 큰 문제가 아니게 됐어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">The Story of Mr Messy Who Marries Mrs Clean(깔끔한 여자와 결혼한 지저분한 남자 이야기)</span><span class=\"why\">[지문에 없음] 지저분함·깔끔함이 아니라 일하는 때와 방식의 차이예요. 5번에서도 누구도 틀리지 않았다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Differences Between Men's Work and Women's Work(남자의 일과 여자의 일의 차이)</span><span class=\"why\">[범위 넓음] 남녀 일반의 차이가 아니라 이 부부의 different preferences(다른 선호) 얘기이고, 결국 조화를 이룬 게 핵심이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">My buddy and his wife</div><div class=\"k\">나의 동료와 그의 아내는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">were in constant conflict</span></div><div class=\"k\"><span class=\"cw\">끊임없는 갈등을 겪었다</span></div></div><div class=\"rc\"><div class=\"e\">over when the housework should get done.</div><div class=\"k\">언제 집안일이 처리되어야 하는지에 대해.</div></div><div class=\"rnat\">나의 동료와 그의 아내는 언제 집안일이 처리되어야 하는지에 대해 끊임없는 갈등을 겪었다.</div><div class=\"rst\">나와 짝꿍은 사물함 청소를 같이 맡았어요. 그런데 청소를 언제 할지로 매번 다퉈요. = 지문 1번, 부부가 집안일 시점으로 늘 갈등한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">He wanted to work in spurts</div><div class=\"k\">그는 여러 번에 걸쳐 (조금씩) 일하고</div></div><div class=\"rc\"><div class=\"e\">and take frequent breaks</div><div class=\"k\">잦은 휴식을 취하기를 원했다</div></div><div class=\"rc\"><div class=\"e\">to watch a TV show</div><div class=\"k\">TV 프로그램을 보거나</div></div><div class=\"rc\"><div class=\"e\">or make a nice meal.</div><div class=\"k\">맛있는 음식을 만들어 먹기 위해.</div></div><div class=\"rnat\">그는 여러 번에 걸쳐 (조금씩) 일하고, TV 프로그램을 보거나 맛있는 음식을 만들어 먹는 잦은 휴식을(휴식을 자주) 취하기를 원했다.</div><div class=\"rst\">나는 조금 치우고 수다 떨고, 또 조금 치우고 물 마시러 가고 싶어요. = 지문 2번, 그는 조금씩 일하고 자주 쉬고 싶어 했어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">She wanted to get it all done</div><div class=\"k\">그녀(= 그의 아내)는 모든 것을 끝내기를 원했다</div></div><div class=\"rc\"><div class=\"e\">at a time</div><div class=\"k\">한 번에</div></div><div class=\"rc\"><div class=\"e\">and have the rest of the day</div><div class=\"k\">그리고 하루의 나머지를 갖기를</div></div><div class=\"rc\"><div class=\"e\">to hang out and relax.</div><div class=\"k\">놀고 휴식을 취하기 위해.</div></div><div class=\"rnat\">그녀(그의 아내)는 모든 것을 한 번에 끝내고, 놀고 휴식을 취하기 위해 하루의 나머지(시간)를 보내기를 원했다.</div><div class=\"rst\">짝꿍은 한 번에 싹 끝내고 나머지 시간엔 푹 쉬고 싶대요. = 지문 3번, 그녀는 한 번에 다 끝내고 쉬고 싶어 했어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I was able to point out to my buddy</div><div class=\"k\">나는 나의 동료에게 지적해 줄 수 있었다</div></div><div class=\"rc\"><div class=\"e\">that his wife wasn’t trying</div><div class=\"k\">그의 아내가 하려고 했던 것이 아니라는 것을</div></div><div class=\"rc\"><div class=\"e\">to be a strict trainer;</div><div class=\"k\">엄격한 트레이너가 되려고;</div></div><div class=\"rc\"><div class=\"e\">she was just more of</div><div class=\"k\">그녀는 단지 더 ~에 가까웠다</div></div><div class=\"rc\"><div class=\"e\">a sensing, thinking, judging sort of person,</div><div class=\"k\">감각형, 사고형, 판단형의 사람에,</div></div><div class=\"rc\"><div class=\"e\">and he was more of</div><div class=\"k\">그리고 그는 더 ~에 가까웠다</div></div><div class=\"rc\"><div class=\"e\">an intuition, feeling, perceiving sort of person.</div><div class=\"k\">직관형, 감정형, 인식형의 사람에.</div></div><div class=\"rnat\">나는 나의 동료에게 그의 아내가 엄격한 트레이너가 되려고 했던 것이 아니라는 것을 지적해 줄 수 있었다. 그녀는 단지 더 감각형, 사고형, 판단형의 사람이었고, 그는 단지 더 직관형, 감정형, 인식형의 사람이었다.</div><div class=\"rst\">담임쌤이 “짝꿍이 너 괴롭히려는 게 아니라 원래 성향이 그래” 하고 알려 줬어요. = 지문 4번, 아내는 엄격한 트레이너가 아니라 성향이 달랐을 뿐이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Neither of them were wrong;</span></div><div class=\"k\"><span class=\"cw\">그들 중 어느 누구도 틀리지 않았다;</span></div></div><div class=\"rc ckc\"><div class=\"e\">they just had <span class=\"cw\">different preferences</span>.</div><div class=\"k\">그들은 단지 <span class=\"cw\">다른 선호를</span> 가지고 있었다.</div></div><div class=\"rnat\">그들 중 어느 누구도 틀리지 않았다. 그들은 단지 다른 선호를 가지고 있었다(각자 선호하는 바가 달랐다).</div><div class=\"rst\"><b>누구도 틀리지 않았어요.</b> 그냥 좋아하는 방식이 다를 뿐이에요. = 지문 5번, 여기서 글의 방향이 바뀌어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Once they realized this,</div><div class=\"k\">일단 그들이 이것을 깨닫자,</div></div><div class=\"rc\"><div class=\"e\">they were able to compromise</div><div class=\"k\">그들은 타협할 수 있었다※ 문제지엔 빈칸으로 되어 있음(12번 정답)</div></div><div class=\"rc\"><div class=\"e\">regarding the housework.</div><div class=\"k\">집안일에 관해.</div></div><div class=\"rnat\">일단 그들이 이것을 깨닫자, 그들은 집안일에 관해 타협할 수 있었다.</div><div class=\"rst\">이걸 lass=\"rc\"><div class=\"e\">at a time</div><div class=\"k\">한 번에</div></div><div class=\"rc\"><div class=\"e\">and have the rest of the day</div><div class=\"k\">그리고 하루의 나머지를 갖기를</div></div><div class=\"rc\"><div class=\"e\">to hang out and relax.</div><div class=\"k\">놀고 휴식을 취하기 위해.</div></div><div class=\"rnat\">그녀(그의 아내)는 모든 것을 한 번에 끝내고, 놀고 휴식을 취하기 위해 하루의 나머지(시간)를 보내기를 원했다.</div><div class=\"rst\">동생은 한 번에 싹 끝내고 나머지 시간엔 푹 쉬고 싶대요. = 지문 3번, 그녀는 한 번에 다 끝내고 쉬고 싶어 했어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I was able to point out to my buddy</div><div class=\"k\">나는 나의 동료에게 지적해 줄 수 있었다</div></div><div class=\"rc\"><div class=\"e\">that his wife wasn’t trying</div><div class=\"k\">그의 아내가 하려고 했던 것이 아니라는 것을</div></div><div class=\"rc\"><div class=\"e\">to be a strict trainer;</div><div class=\"k\">엄격한 트레이너가 되려고;</div></div><div class=\"rc\"><div class=\"e\">she was just more of</div><div class=\"k\">그녀는 단지 더 ~에 가까웠다</div></div><div class=\"rc\"><div class=\"e\">a sensing, thinking, judging sort of person,</div><div class=\"k\">감각형, 사고형, 판단형의 사람에,</div></div><div class=\"rc\"><div class=\"e\">and he was more of</div><div class=\"k\">그리고 그는 더 ~에 가까웠다</div></div><div class=\"rc\"><div class=\"e\">an intuition, feeling, perceiving sort of person.</div><div class=\"k\">직관형, 감정형, 인식형의 사람에.</div></div><div class=\"rnat\">나는 나의 동료에게 그의 아내가 엄격한 트레이너가 되려고 했던 것이 아니라는 것을 지적해 줄 수 있었다. 그녀는 단지 더 감각형, 사고형, 판단형의 사람이었고, 그는 단지 더 직관형, 감정형, 인식형의 사람이었다.</div><div class=\"rst\">알고 보니 동생은 날 괴롭히려는 게 아니라 원래 성향이 그랬던 거예요. = 지문 4번, 아내는 엄격한 트레이너가 아니라 성향이 달랐을 뿐이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Neither of them were wrong;</span></div><div class=\"k\"><span class=\"cw\">그들 중 어느 누구도 틀리지 않았다;</span></div></div><div class=\"rc\"><div class=\"e\">they just had different preferences.</div><div class=\"k\">그들은 단지 다른 선호를 가지고 있었다.</div></div><div class=\"rnat\">그들 중 어느 누구도 틀리지 않았다. 그들은 단지 다른 선호를 가지고 있었다(각자 선호하는 바가 달랐다).</div><div class=\"rst\"><b>누구도 틀리지 않았어요.</b> 그냥 좋아하는 방식이 다를 뿐이에요. = 지문 5번, 여기서 글의 방향이 바뀌어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Once they realized this,</div><div class=\"k\">일단 그들이 이것을 깨닫자,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they were able to compromise</span></div><div class=\"k\"><span class=\"cw\">그들은 타협할 수 있었다</span>※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">regarding the housework.</div><div class=\"k\">집안일에 관해.</div></div><div class=\"rnat\">일단 그들이 이것을 깨닫자, 그들은 집안일에 관해 타협할 수 있었다.</div><div class=\"rst\">이걸 알고 나니 우리는 <b>서로 양보해서 맞출</b> 수 있었어요. 그래서 지문 6번 빈칸은 compromise(타협하다)예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">When they needed to get a lot of chores done</div><div class=\"k\">그들이 많은 집안일을 끝내야 할 필요가 있을 때</div></div><div class=\"rc\"><div class=\"e\">in a short period of time,</div><div class=\"k\">짧은 시간 안에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they used her method,</span></div><div class=\"k\"><span class=\"cw\">그들은 그녀의 방법을 사용했다,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but they agreed</span></div><div class=\"k\"><span class=\"cw\">하지만 그들은 동의했다</span></div></div><div class=\"rc\"><div class=\"e\">to always take a meal break</div><div class=\"k\">항상 식사 휴식을 취하기로</div></div><div class=\"rc\"><div class=\"e\">at the appropriate meal hour.</div><div class=\"k\">적절한 식사 시간에.</div></div><div class=\"rnat\">그들은 짧은 시간에 많은 집안일을 끝내야 할 필요가 있을 때는 그녀의 방법을 사용했지만, 적절한 식사 시간에 항상 식사 휴식을 취하기로(식사를 하기로) 동의했다.</div><div class=\"rst\">손님이 곧 올 땐 동생 방식으로 한 번에 치워요. 대신 밥때가 되면 꼭 같이 밥 먹고 해요. = 지문 7번이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">When they just had a few things to get done</div><div class=\"k\">그들이 단지 몇 가지 일만 처리하면 될 때</div></div><div class=\"rc\"><div class=\"e\">in no specific time frame,</div><div class=\"k\">특정한 시간 틀 없이,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they used his method</span></div><div class=\"k\"><span class=\"cw\">그들은 그의 방법을 사용했다</span></div></div><div class=\"rc\"><div class=\"e\">but agreed that they would see</div><div class=\"k\">하지만 보기로 동의했다</div></div><div class=\"rc\"><div class=\"e\">the specific task to completion</div><div class=\"k\">특정한 일이 완료되는 것을</div></div><div class=\"rc\"><div class=\"e\">before taking a break.</div><div class=\"k\">휴식을 취하기 전에.</div></div><div class=\"rnat\">그들은 구체적인 시간의 범위 없이(정해진 시간 없이) 단지 몇 가지 일만 있을(몇 가지 일만 처리해야 할) 때에는 그의 방법을 사용했지만, 그들이 휴식을 취하기 전에 특정한 일이 완료되는 것을 보는(완료하는) 것에는 동의했다.</div><div class=\"rst\">여유로운 주말엔 내 방식으로 쉬엄쉬엄 해요. 대신 책상 정리 하나는 다 끝내고 쉬어요. = 지문 8번이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">This way,</div><div class=\"k\">이런 방식으로,</div></div><div class=\"rc\"><div class=\"e\">both of them could feel productive,</div><div class=\"k\">그들 둘 다 생산적이라고 느낄 수 있었고,</div></div><div class=\"rc\"><div class=\"e\">and the housework no longer had to be</div><div class=\"k\">집안일은 더 이상 ~일 필요가 없었다</div></div><div class=\"rc\"><div class=\"e\">a huge sore spot between them.</div><div class=\"k\">그들 사이의 큰 문제.</div></div><div class=\"rnat\">이런 방식으로, 그들 모두 생산적이라고 느낄 수 있었고, 집안일은 더 이상 그들 사이에 큰 문제가 되지 않았다.</div><div class=\"rst\">이렇게 하니 둘 다 뿌듯하고, 방 청소는 <b>더 이상</b> 싸움거리가 아니에요. = 지문 9번, 타협이 잘 됐다는 결과예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"hang out\" data-m=\"놀다\"><b>hang out</b>놀다</button><button type=\"button\" class=\"wdb\" data-w=\"chore\" data-m=\"집안일, 허드렛일\"><b>chore</b>집안일, 허드렛일</button><button type=\"butt   h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
