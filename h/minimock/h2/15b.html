<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){

}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

", "notes": [["1", "chore", "집안일"], ["2", "method", "방법"], ["3", "appropriate", "적절한"]], "lit": "그들이 짧은 시간 안에 많은 집안일을 끝내야 할 필요가 있을 때, / 그들은 그녀의 방법을 사용했다, / 하지만 그들은 항상 적절한 식사 시간에 식사 휴식을 취하기로 합의했다.", "nat": "짧은 시간 안에 집안일을 많이 끝내야 할 때는 그녀의 방법을 사용했지만, 항상 적절한 식사 시간에는 식사 휴식을 취하기로 합의했다.", "ana": "<b>When절</b>은 시간을 나타내는 부사절이고, get a lot of chores done은 <b>get + 목적어 + 과거분사</b>(사역의 의미)이다.", "pe": "\u0001When they needed to get a lot of chores<sup>1</sup> done in a short period of time\u0002, / they used her method<sup>2</sup>, / but they agreed to \u0001always\u0002 take a meal break \u0001at the appropriate<sup>3</sup> meal hour\u0002.", "pk": "\u0001그들이 짧은 시간 안에 많은 집안일을 끝내야 할 필요가 있을 때\u0002, / 그들은 그녀의 방법을 사용했다, / 하지만 그들은 \u0001항상\u0002 \u0001적절한 식사 시간에\u0002 식사 휴식을 취하기로 합의했다.", "core": "그들은 그녀의 방법을 사용했지만, 식사 휴식을 취하기로 합의했다.", "tags": ["When절 = 시간 부사절: 뒤 문장을 꾸밈. get + 목적어 + 과거분사(chores done)", "they used her method: 3형식 SVO", "but: 대조 연결. they agreed to take a meal break: agree + to부정사(목적어). always = 부사, at the meal hour = 전치사구(부사구): take 꾸밈"], "steps": [{"t": "이 문장은 <b>When절 + 주절 + but절</b>의 세 덩어리다. 앞의 When절 안에 5형식이 있어 길어 보인다."}, {"t": "When절부터 본다. <b>When they needed to get a lot of chores done in a short period of time</b>은 시간 부사절이다.", "sub": ["S: they (그들), V: needed (need 필요로 하다), O: to get a lot of chores done (많은 집안일을 끝내는 것)", "get + O + p.p. = O를 ~되게 하다 (chores가 끝내지는 관계). chore 집안일", "in a short period of time (짧은 시간 안에) = 전치사구"]}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: they (그들)", "V: used (use 사용하다의 과거형)", "O: her method (그녀의 방법). method 방법", "뼈대 = <b>they used her method</b>"]}, {"t": "<b>but they agreed to always take a meal break at the appropriate meal hour</b>가 두 번째 절이다.", "sub": ["S: they, V: agreed (agree 합의하다의 과거형)", "O: to always take a meal break (항상 식사 휴식을 취하기로). always는 부사", "at the appropriate meal hour (적절한 식사 시간에) = 전치사구. appropriate 적절한"]}], "sum": "급할 땐 그녀의 방법을 쓰되, 식사 휴식은 제때 취하기로 합의"}], "qs": [{"q": "07", "type": "빈칸", "src": "2023년 9월 31번", "ans": "①", "tr": [["1", "반항자들은 자신들이 반항자라고 생각할지도 모르지만, 영리한 마케터들이 나머지 우리에게 하는 것과 똑같이 그들에게 영향을 미친다."], ["2", "'모두가 그것을 하고 있다'고 말하는 것은 어떤 사람들이 어떤 아이디어에 흥미를 잃게 만들 수도 있다."], ["3", "이 사람들은 대안을 찾을 것인데, 그 대안은 (영리하게 계획된다면) 정확히 마케터나 설득자가 당신이 믿기를 바라는 것일 수 있다."], ["4", "만약 내가 당신이 어떤 아이디어를 고려하기를 바라고, 당신이 독립성과 유일성을 유지하기 위해 대중적인 의견을 강하게 거부한다는 것을 안다면, 나는 다수 의견을 먼저 제시할 것이고, 당신은 나의 실제 선호에 맞게 이 다수의 선택을 거부할 것이다."], ["5", "우리는 반항의 입장을 유지하려고 할 때 우리는 종종 속는다."], ["6", "사람들은 우리가 목적에 맞게 우리 스스로 '독자적으로' 그들의 목적에 맞는 선택지를 고르도록 만들기 위해 이러한 반전을 사용한다."], ["7", "일부 브랜드들은 주류에 대한 우리의 반항을 완전히 활용해 자신들을 반항아로 자리매김해 왔고, 이는 훨씬 더 강력한 브랜드 충성도를 만들어냈다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "People use this reversal to make us \"independently\" choose an option which suits their purposes."}, {"en": false, "h": "빈칸을 포함한 문장 (6)은 사람들의 목적에 맞게 우리가 스스로 선택하면서도 실은 마케터가 원하는 것을 고르도록 만드는 '무엇'을 사용한다는 내용이다. 문장 (4)~(5)에 따르면, 당신이 독립성과 유일성을 지키려고 대중적 의견에 반대한다는 것을 아는 대신, 다수 선택을 먼저 제시하여 당신이 이를 거부하게 만드는데, 이처럼 반항의 심리를 이용해 정반대로 선택하게 만드는 것이 바로 '반전(reversal)'이다."}], "opts": [{"n": "①", "t": "reversal", "a": true, "x": false, "trap": false, "e": "빈칸을 포함한 문장 (6)의 '무엇'을 사용한다는 내용은, 마케터가 원하는 것과 반대되는 다수 의견을 먼저 제시해 반항 심리를 이용한다는 문장 (4)~(5)의 '반전' 전략을 가리킨다."}, {"n": "②", "t": "imitation", "a": false, "x": true, "trap": false, "e": "모방에 관한 내용은 본문에 없다."}, {"n": "③", "t": "repetition", "a": false, "x": true, "trap": false, "e": "반복에 관한 내용은 본문에 없다."}, {"n": "④", "t": "conformity", "a": false, "x": true, "trap": true, "e": "동조는 반항 심리를 이용하는 전략과 반대되는 개념이다."}, {"n": "⑤", "t": "collaboration", "a": false, "x": true, "trap": false, "e": "협력에 관한 내용은 본문에 없다."}], "w": [["rebel", "반항자, 반역자"], ["alternative", "대안"], ["independence", "독립성"], ["uniqueness", "유일성"], ["preference", "선호"], ["defiance", "반항, 저항"], ["mainstream", "주류(主流)"], ["brand loyalty", "브랜드 충성도"]]}, {"q": "08", "type": "빈칸", "src": "2022년 6월 34번", "ans": "①", "tr": [["1", "오늘날 세계 대부분에서 자본주의와 자유 시장은 경제적 자원을 분배하고 경제적 생산을 장려하기 위한 최고의 시스템을 구성하는 것으로 받아들여지고 있다."], ["2", "국가들은 사회주의와 공산주의 같은 다른 체제를 시도해 왔지만, 많은 경우 완전히 자유 시장으로 전환하거나 자유 시장의 일부 측면을 받아들였다."], ["3", "자유 시장 시스템의 광범위한 수용에도 불구하고, 시장이 완전히 자유로운 상태로 맡겨지는 경우는 드물다."], ["4", "정부의 개입은 법과 규정의 제정·집행에서부터 미국 담보 대출 기관 같은 실체를 통한 경제 직접 참여에 이르기까지 여러 형태를 취한다."], ["5", "하지만 아마도 정부 개입의 가장 중요한 형태는, 중앙은행과 국가 재무기관이 경제 주기의 흥망성쇠를 통제하고 영향을 미치려는 시도에서 나타날 것이다."]], "evh": "3·4번 문장", "ev": [{"en": true, "h": "Despite the widespread acceptance of the free-market system, ___. Government involvement takes many forms, ranging from the enactment and enforcement of laws and regulations to direct participation in the economy..."}, {"en": false, "h": "본문에 따르면, 오늘날 세계 대부분에서 자본주의와 자유 시장 체제가 시행되고 있지만 문장 (4)와 (5)에서 설명하듯이 정부의 개입이 여전히 존재한다. 이는 특히 법과 규정의 제정과 집행, 미국 담보 대출 기관을 통한 직접적 경제 참여, 중앙은행과 국가 재무기관을 통한 경기 주기 통제 같은 구체적인 예시를 통해 확인할 수 있다. 따라서 빈칸에는 '시장이 완전히 자유로운 상태로 맡겨지는 경우는 드물다'는 내용의 ①이 적절하다."}], "opts": [{"n": "①", "t": "markets are rarely left entirely free", "a": true, "x": false, "trap": false, "e": "시장이 완전히 자유로운 상태로 맡겨지는 경우는 드물다는 내용으로, 뒤이어 나오는 정부 개입의 다양한 형태와 정확히 일치한다."}, {"n": "②", "t": "governments are reluctant to intervene", "a": false, "x": true, "trap": true, "e": "정부가 개입을 꺼린다는 것이 아니라, 정부가 다양한 형태로 적극 개입한다는 반대 내용이다."}, {"n": "③", "t": "supply and demand are not always balanced", "a": false, "x": true, "trap": false, "e": "수요와 공급의 균형에 관한 내용은 본문에 없다."}, {"n": "④", "t": "economic inequality continues to get worse", "a": false, "x": true, "trap": false, "e": "경제적 불평등에 관한 내용은 본문에 없다."}, {"n": "⑤", "t": "competition does not guarantee the maximum profit", "a": false, "x": true, "trap": false, "e": "경쟁과 최대 이윤에 관한 내용은 본문에 없다."}], "w": [["constitute", "구성하다"], ["allocate", "분배하다"], ["widespread", "광범위한"], ["involvement", "개입"], ["enactment", "(법률의) 제정"], ["enforcement", "집행"], ["entity", "실체, 독립체"], ["intervene", "개입하다"]]}, {"q": "09", "type": "요약", "src": "2015년 9월 40번", "ans": "①", "tr": [["1", "Decision Research와 Oregon 대학 소속 Paul Slovic의 연구는, 평소에는 배려심이 많아 한 개인을 돕기 위해 일부러 나서기까지 하는 사람들이 군중의 고통에는 무관심해진다는 것을 보여준다."], ["2", "한 실험에서, 사람들은 해외의 굶주림을 줄이기 위해 기 const CMAP={"07-3": [["085", "관계대명사 what"], ["083", "관계대명사 계속적 용법"]], "07-7": [["083", "관계대명사 계속적 용법"], ["078", "관계대명사"]], "08-2": [["037-H1", "병렬 구조"]], "08-4": [["068", "현재분사 · 과거분사"]], "09-1": [["078", "관계대명사"], ["039", "명사절 접속사 that"]], "10-6": [["078", "관계대명사"]], "11-4": [["039", "명사절 접속사 that"]], "11-7": [["041", "시간 접속사"]]};
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  const cc=(CMAP[c.q+'-'+c.s]||[]);
  const back=encodeURIComponent(location.origin+location.pathname);
  let x='<div class="sc open"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='<div class="fin"><b>자연스러운 해석</b>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm)x+='<div class="fin"><b>한 줄 정리</b>'+esc(sm)+'</div>';
  x+='</div></div>';
  return x;
}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){

  if(q.type==='choice'){

  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;

function advance(){

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
