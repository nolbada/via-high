<title>고2 미니모의고사 11회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}
.evx .en{background:#fff;border:1px solid #d5eadc;font-size:15.5px;margin:0 0 8px}
.evx p{margin:6px 0;font-size:15.5px;line-height:1.75}
.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}
.ch.open .ct{display:block}

/* 직독직해 v2: 전체 펼침, 뼈대 빨강 / 살 회색 */

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}
.sc .ce{font-size:18px;line-height:1.5;font-weight:800;color:#c62828}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n1{background:#eef4fb;border-color:#d3e0f0;border-left-color:#2d62a8}.sc .fin.n1 b{color:#2d62a8}
.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}
.rst:before{content:"결국 이 얘기  ";font-size:11.5px;font-weight:800;color:#8a6d00}

.stp{margin:14px 0 4px;border:1.5px solid #f0e2b0;border-radius:12px;background:#fffdf3}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });

  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};

}
function advance(){

를 뒷받침하는 조치일 뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">호텔 내 식당의 개업을 홍보하려고</span><span class=\"why\">[지문에 없음] 2번의 restaurant(레스토랑)는 이미 손님이 다녀간 곳이에요. 새로 문을 연다는 말은 없고, 호텔도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">세탁 서비스에 대한 불만을 제기하려고</span><span class=\"why\">[지문에 없음] 2번에서 코트에 음료가 쏟아졌지만, 이 편지는 식당이 손님에게 쓴 사과 편지예요. 세탁 서비스에 불만을 말하는 내용은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">새로 발행된 쿠폰 사용 방법을 안내하려고</span><span class=\"why\">[범위 좁음] 6번의 coupon(쿠폰)은 사과의 뜻으로 보내는 선물이에요. 쓰는 방법을 설명하는 게 목적이 아니라 7번에서 또 사과해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Dear Ms. Blake,</div><div class=\"k\">Blake 씨께,</div></div><div class=\"rnat\">Blake 씨께,</div><div class=\"rst\">분식집 사장님이 단골손님에게 쓰는 사과 쪽지를 떠올려 봐요. 지문도 블레이크(Blake) 씨에게 쓰는 편지로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">I understand</div><div class=\"k\">저는 알고 있습니다</div></div><div class=\"rc\"><div class=\"e\">that on May 3, 2018</div><div class=\"k\">2018년 5월 3일에</div></div><div class=\"rc\"><div class=\"e\">when you were a guest</div><div class=\"k\">당신이 손님이었을 때</div></div><div class=\"rc\"><div class=\"e\">at our restaurant in the Four Hills Plaza,</div><div class=\"k\">Four Hills Plaza에 있는 저희 레스토랑에서</div></div><div class=\"rc\"><div class=\"e\">you experienced an unfortunate incident</div><div class=\"k\">당신이 불행한 일을 겪으셨다는 것을</div></div><div class=\"rc\"><div class=\"e\">that resulted in a beverage being spilled on your coat.</div><div class=\"k\">그 일(= 불행한 일)은 음료가 당신의 코트에 쏟아지는 결과를 낳았습니다.</div></div><div class=\"rnat\">저는 2018년 5월 3일에 당신이 Four Hills Plaza에 있는 저희 레스토랑에서 손님이었을 때 (저희 직원이) 당신의 코트에 음료수를 흘리게 된 불행한 일을 겪으셨다는 것을 알고 있습니다.</div><div class=\"rst\">지난번에 우리 가게 알바생이 손님 옷에 음료를 쏟았어요. 지문도 레스토랑에서 코트에 음료가 쏟아진 <b>불행한 일</b>(unfortunate incident)을 말해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Please accept</div><div class=\"k\">받아 주세요</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">my sincere apology.</span></div><div class=\"k\"><span class=\"cw\">저의 진심 어린 사과를.</span></div></div><div class=\"rnat\">부디 저의 진심 어린 사과를 받아 주세요.</div><div class=\"rst\">“정말 죄송합니다. 제 사과를 받아 주세요.” 지문의 <b>진심 어린 사과</b>(sincere apology)가 바로 편지의 목적이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Unfortunately</div><div class=\"k\">안타깝게도</div></div><div class=\"rc\"><div class=\"e\">the staff on duty at the time</div><div class=\"k\">그때 근무 중이던 직원들이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">did not reflect</span></div><div class=\"k\"><span class=\"cw\">반영하지 못했습니다(제대로)</span></div></div><div class=\"rc\"><div class=\"e\">our customer service policy.</div><div class=\"k\">저희의 고객 서비스 정책을.</div></div><div class=\"rnat\">안타깝게도 그때 근무 중이었던 직원들이 저희의 고객 서비스 정책을 (제대로) 반영하지 못했습니다.</div><div class=\"rst\">“그날 알바생이 가게 규칙대로 하지 못했어요.” 지문도 근무 직원들이 고객 서비스 정책을 제대로 반영하지 못했다고 인정해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">I have investigated the situation</div><div class=\"k\">저는 그 상황을 자세히 조사했고</div></div><div class=\"rc\"><div class=\"e\">and scheduled</div><div class=\"k\">일정을 잡았습니다</div></div><div class=\"rc\"><div class=\"e\">additional customer service training</div><div class=\"k\">추가적인 고객 서비스 교육의</div></div><div class=\"rc\"><div class=\"e\">for them.</div><div class=\"k\">그들(= 그때 근무했던 직원들)을 대상으로.</div></div><div class=\"rnat\">저는 그 상황을 자세히 조사했고 그들을 대상으로 한 추가적인 고객 서비스 교육 일정을 잡았습니다.</div><div class=\"rst\">“무슨 일인지 알아봤고, 알바생들 교육도 다시 잡았어요.” 지문도 상황을 조사하고 추가 교육(training) 일정을 잡았대요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">We'd like to have you back as a customer</div><div class=\"k\">저희는 당신을 다시 고객으로 모시고 싶어서</div></div><div class=\"rc\"><div class=\"e\">so I'm sending you</div><div class=\"k\">저는 당신에게 보내 드립니다</div></div><div class=\"rc\"><div class=\"e\">a coupon for two free entrees</div><div class=\"k\">2인 무료 주요리 쿠폰을</div></div><div class=\"rc\"><div class=\"e\">that can be used</div><div class=\"k\">그것(= 쿠폰)은 사용될 수 있습니다</div></div><div class=\"rc\"><div class=\"e\">at any of our five locations</div><div class=\"k\">저희 다섯 개 지점 중 어느 곳에서든</div></div><div class=\"rc\"><div class=\"e\">in New Parkland.</div><div class=\"k\">New Parkland에 있는.</div></div><div class=\"rnat\">저희는 당신을 다시 고객으로 오게 하고 싶어서(오시기를 바라며) New Parkland에 있는 저희의 다섯 개 장소(지점)들 중 어느 곳에서든 사용될 수 있는 2인 무료 주요리(를 위한) 쿠폰을 보내 드립니다.</div><div class=\"rst\">“또 와 주셨으면 해서 떡볶이 2인분 무료 쿠폰을 넣었어요.” 지문도 다섯 개 지점 어디서든 쓰는 2인 무료 주요리 쿠폰을 보내요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Again,</span></div><div class=\"k\"><span class=\"cw\">다시 한번,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">my apologies</span></div><div class=\"k\"><span class=\"cw\">저의 사과를 드립니다</span></div></div><div class=\"rc\"><div class=\"e\">for the incident.</div><div class=\"k\">그 일에 대해.</div></div><div class=\"rnat\">다시 한번, 저는 그 일에 대해 사과드립니다.</div><div class=\"rst\">“<b>다시 한번</b> 정말 죄송해요.” 지문도 Again(다시 한번)으로 사과를 되풀이해요. 목적이 사과라는 확실한 증거예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">I hope</div><div class=\"k\">저는 바랍니다</div></div><div class=\"rc\"><div class=\"e\">you give us the opportunity</div><div class=\"k\">당신이 저희에게 기회를 주시기를</div></div><div class=\"rc\"><div class=\"e\">to make this right.</div><div class=\"k\">이 일을 바로잡을.</div></div><div class=\"rnat\">저는 당신이 저희에게 이 일을 바로잡을 수 있는 기회를 주시기를 바랍니다.</div><div class=\"rst\">“이번 일을 바로잡을 기회를 주세요.” 지문도 일을 바로잡을(make this right) 기회를 달라고 부탁해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Sincerely,</div><div class=\"k\">진심을 담아,</div></div><div class=\"rc\"><div class=\"e\">Barbara Smith</div><div class=\"k\">Barbara Smith 드림</div></div><div class=\"rnat\">진심을 담아, Barbara Smith (드림)</div><div class=\"rst\">쪽지 끝에 사장님 이름을 쓰듯, 지문도 보낸 사람 바버라 스미스(Barbara Smith)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"incident\" data-m=\"일, 사건\"><b>incident</b>일, 사건</button><button type=\"button\" class=\"wdb\" data-w=\"beverage\" data-m=\"음료\"><b>beverage</b>음료</button><button type=\"button\" class=\"wdb\" data-w=\"sincere\" data-m=\"진심 어린, 진정한\"><b>sincere</b>진심 어린, 진정한</button><button type=\"button\" class=\"wdb\" data-w=\"on duty\" data-m=\"근무 중인\"><b>on duty</b>근무 중인</button><button type=\"button\" class=\"wdb\" data-w=\"reflect\" data-m=\"반영하다\"><b>reflect</b>반영하다</button><button type=\"button\" class=\"wdb\" data-w=\"investigate\" data-m=\"자세히 조사하다\"><b>investigate</b>자세히 조사하다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">안내문 불일치는 <b>선택지 순서 = 지문 순서</b>예요. 위에서부터 하나씩 대조하다가 <b>before(~ 전에)</b>처럼 <b>시점</b> 단어 하나로 갈리는 곳에서 멈추세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>5번 요금</span><span><em>②</em>9번 녹화 영상</span><span><em>③</em>11번 참가 증명서</span><span><em>④</em>14번 강연자 경력</span><span><em>⑤</em>16번 지불 시점</span></div><div class=\"ck-eq\">⇒ 선택지 다섯 개가 지문 순서대로 한 군데씩 걸려 있어요</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step key\"><span class=\"lab\">⑤ 차례 · 16번 문장 (결정적 단서)</span><div class=\"en\">Payment in full <mark>must be received</mark> <mark>before the workshop date</mark>.</div><p class=\"ko\"><mark>워크숍 날짜 전에</mark> 전액 지불이 <mark>받아져야 합니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>‘당일’은 2번의 11월 20일이에요. 16번은 그 날짜 ‘전에’ 내라고 했으니 당일은 늦어요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 워크숍 당일</span><div class=\"en\">Date: Friday, November 20th</div><p class=\"ko\">날짜: 11월 20일, 금요일</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">참가비는 워크숍 당일에 지불해야 한다.<small>16번은 before the workshop date(워크숍 날짜 전에) 전액을 내라고 했어요. 당일이 아니에요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">참가자는 요청 시 참가증을 받을 수 있다.</span><span class=\"why\">‘요청 시’라는 조건이 붙어 의심되지만, 11번 upon request(요청이 있으면)와 그대로 같아요. 일치해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">PBS 학생의 참가비는 45달러이다.</span><span class=\"why\">5번 요금 95달러 / 45달러 중 뒤쪽이 PBS student(PBS 학생)예요. 일치해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">참가자는 자신의 발표 녹화 영상을 받을 수 있다.</span><span class=\"why\">9번 A recording of your presentation(당신의 발표 녹화 영상)이 메모리 스틱으로 주어진대요. 일치해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">강연자는 15년이 넘는 교육 경력을 가지고 있다.</span><span class=\"why\">14번에서 15년이 넘도록 training(교육)을 제공해 왔다고 했어요. 일치해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Public Speaking Workshop</div><div class=\"k\">발표 워크숍</div></div><div class=\"rnat\">발표 워크숍</div><div class=\"rst\">발표 때마다 떨리는 내가 학원 게시판에서 포스터를 봤어요. = 지문 1번 제목, 발표 워크숍이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Date: Friday, November 20th</div><div class=\"k\">날짜: 11월 20일, 금요일</div></div><div class=\"rnat\">날짜: 11월 20일, 금요일</div><div class=\"rst\">달력부터 확인해요. 지문 2번: 11월 20일 금요일이에요. 이날이 바로 ‘워크숍 당일’이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Time: 9:00 a.m. – 1:30 p.m.</div><div class=\"k\">시간: 오전 9시 - 오후 1시 30분</div></div><div class=\"rnat\">시간: 오전 9시 - 오후 1시 30분</div><div class=\"rst\">아침 9시부터 오후 1시 30분까지래요. 점심 전후로 꽤 길어요. = 지문 3번</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Place: PI Business School(PBS)</div><div class=\"k\">장소: PI Business School(PBS)</div></div><div class=\"rnat\">장소: PI Business School(PBS)</div><div class=\"rst\">장소는 PBS(피비에스)라는 경영 학교예요. = 지문 4번</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Fees: $95 / $45</div><div class=\"k\">요금: 95달러 / 45달러</div></div><div class=\"rc\"><div class=\"e\">(Non-PBS student / PBS student)</div><div class=\"k\">(PBS 학생이 아닌 경우 / PBS 학생인 경우)</div></div><div class=\"rnat\">요금: 95달러/45달러 (PBS 학생이 아닌 경우/PBS 학생인 경우)</div><div class=\"rst\">요금은 그 학교 학생이 아니면 95달러, 학생이면 45달러예요. = 지문 5번 → ① 일치</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">About the Course</div><div class=\"k\">강의에 관하여</div></div><div class=\"rnat\">강의에 관하여</div><div class=\"rst\">“그럼 뭘 배우지?” 지문 6번은 강의 내용이 시작되는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">You will get practical help</div><div class=\"k\">당신은 실질적인 도움을 얻을 것입니다</div></div><div class=\"rc\"><div class=\"e\">in the preparation and delivery</div><div class=\"k\">준비와 전달에 대한</div></div><div class=\"rc\"><div class=\"e\">of presentations and/or speeches.</div><div class=\"k\">발표 및/또는 강연의.</div></div><div class=\"rnat\">당신은 발표 및/또는 강연의 준비와 전달에 대한 실질적인 도움을 얻을 것입니다.</div><div class=\"rst\">발 <div class=\"rc\"><div class=\"e\">For additional information,</div><div class=\"k\">추가 정보를 위해서는,</div></div><div class=\"rc\"><div class=\"e\">please visit our website.</div><div class=\"k\">저희 웹사이트에 방문하십시오.</div></div><div class=\"rnat\">추가 정보를 위해서는, 저희 웹사이트에 방문하십시오.</div><div class=\"rst\">더 궁금한 건 웹사이트에 들어가 보면 돼요. = 지문 17번</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"practical\" data-m=\"실질적인, 실용적인\"><b>practical</b>실질적인, 실용적인</button><button type=\"button\" class=\"wdb\" data-w=\"upon request\" data-m=\"요청이 있으면\"><b>upon request</b>요청이 있으면</button><button type=\"button\" class=\"wdb\" data-w=\"certificate\" data-m=\"증명서\"><b>certificate</b>증명서</button><button type=\"button\" class=\"wdb\" data-w=\"attendance\" data-m=\"참가, 참석\"><b>attendance</b>참가, 참석</button><button type=\"button\" class=\"wdb\" data-w=\"facilitator\" data-m=\"조력자, 진행자\"><b>facilitator</b>조력자, 진행자</button><button type=\"button\" class=\"wdb\" data-w=\"payment in full\" data-m=\"전액 지불\"><b>payment in full</b>전액 지불</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>첫 문장의 주장</b>과 <b>사례가 대비되는 지점</b>을 묶어서 찾으세요. 1번의 <b>next step</b>(다음 단계)과 2번의 <b>end result</b>(최종 결과)가 서로 맞서고, 스키 사례가 그 둘을 비교해 줘요.</p><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · 결정적 주장</span><div class=\"en\">The key to successful risk taking is to understand that the actions you're taking should be <mark>the natural next step</mark>.</div><p class=\"ko\">성공적인 위험 감수의 열쇠는 당신이 취하고 있는 행동이 <mark>자연스러운 다음 단계여야 한다는 것을</mark> 이해하는 것입니다.</p></div><div class=\"ck-via\"><i>▼</i><span>주장과 반대되는 실수를 바로 꺼내요: 다음 단계 ↔ 최종 결과</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 피해야 할 실수</span><div class=\"en\">One of the mistakes we often make … is our tendency <mark>to focus on the end result</mark>.</div><p class=\"ko\">우리가 자주 저지르는 실수 중 하나는 … <mark>최종 결과에 초점을 맞추는</mark> 우리의 경향입니다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3·4번</em>자신 없는 스키어: 맨 아래만 보고 → 너무 가파르다며 포기</span><span><em>5·6번</em>해내는 스키어: 첫 번째 모굴만 보고 → 다음 모굴 → 결국 맨 아래 도착</span></div><div class=\"ck-eq\">⇒ 두 사례의 차이 = 끝을 보느냐, 바로 다음 단계를 보느냐</div></div><div class=\"ck-via\"><i>▼</i><span>해내는 사람들은 초점을 ‘첫 번째 단계’로 바꿔요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 사례 속 정답 장면</span><div class=\"en\">The ones that decide to make it <mark>change their focus</mark> by analyzing what they need to do <mark>to master the first step</mark>, …</div><p class=\"ko\">해내기로 마음먹은 사람들은 <mark>첫 번째 단계를 숙달하기 위해</mark> 해야 할 것을 분석함으로써 <mark>그들의 초점을 바꿉니다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">Focus on the Next Step(다음 단계에 집중하라), Not the Final Result(최종 결과가 아니라)<small>1번의 next step(다음 단계)과 2번의 end result(최종 결과)를 둘 다 담아 대비했어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Start with Ultimate Goals in Mind(궁극적인 목표를 염두에 두고 시작하라)!</span><span class=\"why\">[반대] 2번에서 최종 결과에 초점 맞추는 게 바로 실수라고 했어요. 4번 스키어도 맨 아래(최종 목표)만 보다가 포기해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Separating the Possible from the Impossible(가능한 것과 불가능한 것 구별하기)</span><span class=\"why\">[지문에 없음] 6번의 impossible(불가능한)은 남들이 그렇게 생각했다는 말일 뿐이에요. 둘을 구별하는 방법은 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">The Wonders of Committed Efforts(헌신적인 노력의 경이로움)</span><span class=\"why\">[범위 넓음] 열심히 노력하라는 일반론이에요. 글의 핵심인 ‘다음 단계에 집중’이라는 방법이 빠져 있어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Success Through Risk Avoidance(위험 회피를 통한 성공)</span><span class=\"why\">[반대] 1번은 successful risk taking(성공적인 위험 감수)을 말해요. 위험을 피하라는 게 아니라 위험을 잘 감수하는 법이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">The key to successful risk taking</div><div class=\"k\">성공적인 위험 감수의 열쇠는</div></div><div class=\"rc\"><div class=\"e\">is to understand</div><div class=\"k\">이해하는 것입니다</div></div><div class=\"rc\"><div class=\"e\">that the actions you're taking</div><div class=\"k\">당신이 취하고 있는 행동이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">should be the natural next step.</span></div><div class=\"k\"><span class=\"cw\">자연스러운 다음 단계여야 한다는 것을.</span></div></div><div class=\"rnat\">성공적인 위험 감수의 열쇠는 여러분이 취하고 있는 행동이 자연스러운 다음 단계이어야 한다는 것을 이해하는 것이다.</div><div class=\"rst\">스키장에서 처음 상급 코스 꼭대기에 섰다고 해 봐요. 지문은 위험한 도전의 열쇠가 <b>자연스러운 다음 단계</b>(next step)만 생각하는 거라고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">One of the mistakes</div><div class=\"k\">실수 중 하나는</div></div><div class=\"rc\"><div class=\"e\">we often make</div><div class=\"k\">우리가 자주 저지르는</div></div><div class=\"rc\"><div class=\"e\">when confronting a risk situation</div><div class=\"k\">위험 상황에 맞닥뜨릴 때</div></div><div class=\"rc\"><div class=\"e\">is our tendency</div><div class=\"k\">우리의 경향입니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to focus on the end result.</span></div><div class=\"k\"><span class=\"cw\">최종 결과에 초점을 맞추는.</span></div></div><div class=\"rnat\">위험 상황에 맞닥뜨릴 때 우리가 종종 저지르는 실수 중의 하나는 최종 결과에 초점을 맞추는 우리의 경향이다.</div><div class=\"rst\">그런데 우리는 자꾸 저 아래 끝만 쳐다봐요. 지문도 흔한 실수가 <b>최종 결과</b>(end result)에 초점 맞추는 거라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Skiers</div><div class=\"k\">스키 타는 사람들이</div></div><div class=\"rc\"><div class=\"e\">who are unsure of themselves</div><div class=\"k\">스스로에 대해 확신하지 못하는</div></div><div class=\"rc\"><div class=\"e\">often do this.</div><div class=\"k\">자주 이렇게 합니다(= 최종 결과에 초점을 맞춘다).</div></div><div class=\"rnat\">스스로에 대해 확신하지 못하는 스키 타는 사람들이 자주 이렇게 한다.</div><div class=\"rst\">자신 없는 친구일수록 이래요. 지문도 스스로 확신 없는 스키어들이 자주 이렇게 끝만 본다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">They'll go to the edge of a difficult slope,</div><div class=\"k\">그들은 어려운 경사면의 끝으로 가서</div></div><div class=\"rc\"><div class=\"e\">look all the way down to the bottom,</div><div class=\"k\">맨 아래까지 죽 내려다보고</div></div><div class=\"rc\"><div class=\"e\">and determine</div><div class=\"k\">결정해 버립니다</div></div><div class=\"rc\"><div class=\"e\">that the slope is too steep</div><div class=\"k\">그 경사가 너무 가파르다고</div></div><div class=\"rc\"><div class=\"e\">for them to try.</div><div class=\"k\">그들이 시도하기에는.</div></div><div class=\"rnat\">그들은 급경사면의 끝으로 가서 맨 아래 부분까지의 모든 경로를 살펴보고는, 그 경사가 그들이 시도하기에는 너무 가파르다고 결정할 것이다.</div><div class=\"rst\">꼭대기에서 맨 아래까지 내려다보고 “너무 가팔라, 난 못 해!” 해 버려요. = 지문 4번, 시도도 전에 포기하는 모습이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">The ones that decide to make it</div><div class=\"k\">해내기로 마음먹은 사람들(= 스키 타는 사람들 중 일부)은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">change their focus</span></div><div class=\"k\"><span class=\"cw\">그들의 초점을 바꿉니다</span></div></div><div class=\"rc\"><div class=\"e\">by analyzing what they need to do</div><div class=\"k\">그들이 해야 할 필요가 있는 것을 분석함으로써</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to master the first step,</span></div><div class=\"k\"><span class=\"cw\">첫 번째 단계를 숙달하기 위해</span></div></div><div class=\"rc\"><div class=\"e\">like getting through the first mogul</div><div class=\"k\">첫 번째 모굴을 통과하는 것처럼</div></div><div class=\"rc\"><div class=\"e\">on the hill.</div><div class=\"k\">언덕 위의.</div></div><div class=\"rnat\">(반면에) 해내기로 마음먹은 사람들은 언덕 위의 첫 번째 모굴을 통과하는 것 같이, 첫 번째 단계를 숙달하기 위해 해야 할 필요가 있는 것을 분석함으로써 그들의 초점을 바꾼다.</div><div class=\"rst\">해내는 친구는 달라요. “일단 첫 번째 울퉁불퉁한 곳만 넘자.” 지문도 <b>첫 번째 단계</b>(first step)로 초점을 바꾼다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Once they get there,</div><div class=\"k\">일단 그들이 거기에 도달하면,(= 첫 번째 모굴에)</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they concentrate on the next mogul,</span></div><div class=\"k\"><span class=\"cw\">그들은 다음 모굴에 집중하고</span></div></div><div class=\"rc\"><div class=\"e\">and over the course of the run,</div><div class=\"k\">비탈 코스를 가는 동안</div></div><div class=\"rc\"><div class=\"e\">they end up at the bottom</div><div class=\"k\">그들은 마침내 밑바닥에 다다릅니다</div></div><div class=\"rc\"><div class=\"e\">of what others thought</div><div class=\"k\">다른 이들이 생각했던 것의</div></div><div class=\"rc\"><div class=\"e\">was an impossible mountain.</div><div class=\"k\">불가능한 산이라고.</div></div><div class=\"rnat\">일단 그들이 거기에 도달하면, 그들은 다음번 모굴에 집중하고, 비탈 코스를 가는 동안에 마침내 다른 이들은 불가능한 산이라고 생각했던 것의 밑바닥에 다다른다.</div><div class=\"rst\">첫 번째를 넘으면 다음 것만 보고, 그러다 보면 어느새 맨 아래예요. 그래서 지문은 결과가 아니라 <b>다음 단계</b>에 집중하라고 말해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"confront\" data-m=\"맞닥뜨리다\"><b>confront</b>맞닥뜨리다</button><button type=\"button\" class=\"wdb\" data-w=\"tendency\" data-m=\"경향\"><b>tendency</b>경향</button><button type=\"button\" class=\"wdb\" data-w=\"slope\" data-m=\"경사면, 비탈\"><b>slope</b>경사면, 비탈</button><button type=\"button\" class=\"wdb\" data-w=\"steep\" data-m=\"가파른\"><b>steep</b>가파른</button><button type=\"button\" class=\"wdb\" data-w=\"make it\" data-m=\"해내다\"><b>make it</b>해내다</button><button type=\"button\" class=\"wdb\" data-w=\"master\" data-m=\"숙달하다, 완전히 익히다\"><b>master</b>숙달하다, 완전히 익히다</button><button type=\"button\" class=\"wdb\" data-w=\"ultimate\" data-m=\"궁극적인, 최종의\"><b>ultimate</b>궁극적인, 최종의</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 비유가 끝나고 <b>This is where</b>(이것이 ~한 상황이다)와 <b>need to</b>(~할 필요가 있다)·<b>have to</b>(~해야 한다)가 나오는 곳에 있어요. 1~7번 트럭 비유는 전부 “맹점은 나 혼자 못 본다”는 <b>문제</b>이고, 8·9번이 <b>해결책</b>이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 정의</span><div class=\"en\">Personal blind spots are areas that are <mark>visible to others</mark> but <mark>not to you</mark>.</div><p class=\"ko\">개인의 맹점은 <mark>다른 사람들에게는 보이지만</mark> <mark>당신에게는 보이지 않는</mark> 부분입니다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>사이드 미러에 안 보이는 옆 차선 트럭</span><span><em>5·6번</em>안 보여도 트럭은 정말 있다 = 맹점도 정말 있다</span><span><em>7번</em>못 본다고 나를 못 치는 게 아니다</span></div><div class=\"ck-eq\">⇒ 비유의 공통점 = 맹점은 나 혼자서는 못 보지만 위험하다 (문제 제기)</div></div><div class=\"ck-via\"><i>▼</i><span>This(이것)가 앞의 문제를 받고, need to(~할 필요가 있다)로 해결책을 내놓아요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 요지</span><div class=\"en\">This is where you <mark>need to enlist the help of others</mark>.</div><p class=\"ko\">이것이 <mark>당신이 다른 사람들의 도움을 요청할 필요가 있는</mark> 상황입니다.</p></div><div class=\"ck-via\"><i>▼</i><span>have to(~해야 한다)로 어떤 사람이 필요한지 풀어 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 요지 구체화</span><div class=\"en\">You have to develop a crew of special people, people who are willing <mark>to hold up that mirror</mark>, …</div><p class=\"ko\">당신은 <mark>기꺼이 그 거울을 들어 줄 사람들</mark>, 즉 특별한 사람들로 이루어진 무리를 만들어야 합니다 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">자신의 맹점을 인지하도록 도와줄 수 있는 사람이 필요하다.<small>8번의 enlist the help of others(다른 사람들의 도움을 요청하다)와 9번의 거울 들어 줄 사람을 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">모르는 부분을 인정하고 질문하는 것이 중요하다.</span><span class=\"why\">[지문에 없음] 2번의 you don't know what you don't know(무엇을 모르는지 모른다)에 끌리는 함정이에요. 모르는 걸 알 수도 없으니 질문할 수도 없고, 그래서 남이 알려 줘야 한다는 글이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">폭넓은 인간관계는 성공에 결정적인 영향을 미친다.</span><span class=\"why\">[범위 넓음] 9번은 사람을 많이 사귀라는 게 아니라 맹점을 알려 줄 special people(특별한 사람들)이 필요하다는 말이에요. 성공 이야기도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">자기발전은 실수를 기회로 만드는 능력에서 비롯된다.</span><span class=\"why\">[지문에 없음] 2번에 developmental(발달상의)이 나오지만, 실수를 기회로 바꾸는 얘기는 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">주변에 관심을 가지고 타인을 도와주는 것이 바람직하다.</span><span class=\"why\">[반대] 도움을 주는 쪽이 거꾸로예요. 8번은 내가 다른 사람들의 도움을 ‘받아야’ 한다고 했어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Personal blind spots are areas</div><div class=\"k\">개인의 맹점은 부분입니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that are visible to others</span></div><div class=\"k\"><span class=\"cw\">다른 사람들에게는 보이지만</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but not to you.</span></div><div class=\"k\"><span class=\"cw\">당신에게는 보이지 않는.</span></div></div><div class=\"rnat\">개인의 맹점은 다른 사람들에게는 보이지만 당신에게는 그렇지(보이지) 않는 부분이다.</div><div class=\"rst\">급식 먹고 내 이에 고춧가루가 꼈어요. 친구들 눈엔 다 보이는데 나만 몰라요. 지문의 <b>맹점</b>(blind spot)이 바로 이런 거예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The developmental challenge of blind spots</div><div class=\"k\">맹점의 발달상의 어려움은</div></div><div class=\"rc\"><div class=\"e\">is that you don't know</div><div class=\"k\">당신이 모른다는 것입니다</div></div><div class=\"rc\"><div class=\"e\">what you don't know.</div><div class=\"k\">당신이 무엇을 모르는지.</div></div><div class=\"rnat\">맹점의(맹점이 지닌) 발달상의 어려움은 당신이 무엇을 모르는지 모른다는 것이다.</div><div class=\"rst\">문제는 내가 뭘 모르는지조차 모른다는 거예요. 지문도 맹점의 어려움이 “모르는 걸 모르는 것”이라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Like that area in the side mirror of your car</div><div class=\"k\">당신 차의 사이드 미러의 그 영역처럼</div></div><div class=\"rc\"><div class=\"e\">where you can't see that truck</div><div class=\"k\">당신이 그 트럭을 볼 수 없는</div></div><div class=\"rc\"><div class=\"e\">in the lane next to you,</div><div class=\"k\">당신 옆 차선에 있는</div></div><div class=\"rc\"><div class=\"e\">personal blind spots can easily be overlooked</div><div class=\"k\">개인의 맹점은 쉽게 간과될 수 있습니다</div></div><div class=\"rc\"><div class=\"e\">because you are completely unaware</div><div class=\"k\">당신이 완전히 인지하지 못하기 때문에</div></div><div class=\"rc\"><div class=\"e\">of their presence.</div><div class=\"k\">그것들(= 개인의 맹점)의 존재를.</div></div><div class=\"rnat\">당신이 당신 옆 차선에 있는 트럭을 볼 수 없는, 당신 차의 사이드 미러의 그 영역처럼 개인의 맹점은 당신이 그것들의 존재를 완전히 인지하지 못하기 때문에 쉽게 간과될 수 있다.</div><div class=\"rst\">우리 집 차 사이드 미러에 옆 차선 트럭이 안 보이는 자리가 있죠. 지문은 맹점이 그 자리처럼 있는 줄도 몰라 놓치기 쉽다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">They can be equally dangerous</div><div class=\"k\">그것들(= 개인의 맹점)은 똑같이 위험할 수 있습니다</div></div><div class=\"rc\"><div class=\"e\">as well.</div><div class=\"k\">또한.</div></div><div class=\"rnat\">그것들은 또한 똑같이 위험할 수 있다.</div><div class=\"rst\">고춧가루야 웃고 넘기지만, 어떤 맹점은 진짜 큰일이 나요. 지문도 맹점이 트럭만큼 위험할 수 있다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">That truck you don't see?</div><div class=\"k\">당신이 보지 못하는 그 트럭이요?</div></div><div class=\"rc\"><div class=\"e\">It's really there!</div><div class=\"k\">그것(= 그 트럭)은 정말 거기에 있습니다!</div></div><div class=\"rnat\">당신이 보지 않는(못하는) 그 트럭? 그것은 정말 거기에 있다!</div><div class=\"rst\">미러에 안 보인다고 트럭이 없는 게 아니에요. 지문도 “그 트럭은 정말 거기 있다!”고 말해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">So are your blind spots.</div><div class=\"k\">당신의 맹점도 마찬가지입니다(= 정말 거기에 있다).</div></div><div class=\"rnat\">당신의 맹점도 마찬가지다.</div><div class=\"rst\">내 고춧가루도 내가 못 볼 뿐 정말 있어요. 지문도 내 맹점도 마찬가지로 정말 있다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Just because you don't see them,</div><div class=\"k\">당신이 그것들을 보지 못한다고 해서(= 맹점들을)</div></div><div class=\"rc\"><div class=\"e\">doesn't mean</div><div class=\"k\">의미하는 것은 아닙니다</div></div><div class=\"rc\"><div class=\"e\">they can't run you over.</div><div class=\"k\">그것들(= 맹점들)이 당신을 칠 수 없다는 것을.</div></div><div class=\"rnat\">당신이 그것들을 보지 않는다고(못한다고) 해서 그것들이 당신을 칠 수 없다는 것을 의미하는 것은 아니다.</div><div class=\"rst\">못 본다고 안전한 게 아니에요. 지문도 안 보인다고 맹점이 나를 칠 수 없는 건 아니라고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">This is where</div><div class=\"k\">이것이 ~한 상황입니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">you need to enlist the help of others.</span></div><div class=\"k\"><span class=\"cw\">당신이 다른 사람들의 도움을 요청할 필요가 있는.</span></div></div><div class=\"rnat\">이것이 당신이 다른 사람들의 도움을 요청할 필요가 있는 상황이다.</div><div class=\"rst\"><b>그래서 필요한 게</b> 친구의 한마디예요. “야, 이에 뭐 꼈어!” 지문도 <b>다른 사람들의 도움</b>을 요청해야 한다고 해요. 이게 요지예요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">You have to develop a crew of special people,</div><div class=\"k\">당신은 특별한 사람들로 이루어진 무리를 만들어야 합니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">people who are willing to hold up that mirror,</span></div><div class=\"k\"><span class=\"cw\">기꺼이 그 거울을 들어 줄 사람들,</span></div></div><div class=\"rc\"><div class=\"e\">who not only know you well enough</div><div class=\"k\">당신을 충분히 잘 알 뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">to see that truck,</div><div class=\"k\">그 트럭(= 당신의 맹점)을 볼 수 있을 만큼,</div></div><div class=\"rc\"><div class=\"e\">but who also care enough about you</div><div class=\"k\">또한 당신을 충분히 아끼는</div></div><div class=\"rc\"><div class=\"e\">to let you know that it's there.</div><div class=\"k\">그것(= 그 트럭)이 거기에 있다는 것을 당신에게 알려 줄 만큼.</div></div><div class=\"rnat\">당신은 특별한 사람들, 즉 기꺼이 그 거울을 들고 그 트럭(당신의 맹점)을 볼 수 있을 만큼 당신을 충분히 잘 알 뿐만 아니라 또한 그것이 거기에 있다는 것을 당신에게 알려 줄 만큼 당신을 충분히 아끼는 사람들의 무리를 만들어야 한다.</div><div class=\"rst\">날 잘 알고 아껴서 솔직히 말해 주는 친구들이 거울을 들어 주는 사람이에요. 지문은 이런 사람들을 꼭 곁에 두라고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"blind spot\" data-m=\"맹점\"><b>blind spot</b>맹점</button><button type=\"button\" class=\"wdb\" data-w=\"visible\" data-m=\"(눈에) 보이는\"><b>visible</b>(눈에) 보이는</button><button type=\"button\" class=\"wdb\" data-w=\"overlook\" data-m=\"간과하다\"><b>overlook</b>간과하다</button><button type=\"button\" class=\"wdb\" data-w=\"unaware\" data-m=\"인지하지 못하는\"><b>unaware</b>인지하지 못하는</button><button type=\"button\" class=\"wdb\" data-w=\"presence\" data-m=\"존재\"><b>presence</b>존재</button><button type=\"button\" class=\"wdb\" data-w=\"enlist\" data-m=\"(도움을) 요청하다\"><b>enlist</b>(도움을) 요청하다</button><button type=\"button\" class=\"wdb\" data-w=\"willing\" data-m=\"기꺼이 ~하는\"><b>willing</b>기꺼이 ~하는</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄이 동사 자리면 <b>앞에 나온 동사가 무엇인지</b>부터 보세요. 앞 동사가 일반동사면 반복할 때 <b>does</b>(그렇게 하다)로 받고, is(~이다)로 받지 않아요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (4번)</span><div class=\"en\">It not only cleans clothes, but it <u>④ is</u> so with far less water, detergent, and energy …</div><p class=\"ko\">옷을 세탁할 뿐만 아니라, 훨씬 적은 물·세제·에너지로 ( ? ) 그렇게 한다 — 반복되는 건 ‘세탁하다’</p></div><div class=\"ck-via\"><i>▼</i><span>뒤의 so(그렇게)가 받는 것은 앞의 동사 cleans(세탁하다)예요</span></div><div class=\"ck-step\"><span class=\"lab\">같은 문장 앞쪽 동사</span><div class=\"en\">It not only <mark>cleans</mark> clothes,</div><p class=\"ko\">그것(= 세탁기)은 옷을 <mark>세탁할</mark> 뿐만 아니라,</p></div><div class=\"ck-via\"><i>▼</i><span>cleans(세탁하다)는 일반동사 → 반복은 does so(그렇게 하다) → is(~이다)는 틀려요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">but it <mark>does so</mark> with far less water, detergent, and energy than washing by hand requires.</div><p class=\"ko\">손빨래가 필요로 하는 것보다 훨씬 더 적은 물과 세제, 에너지로 <mark>그렇게 합니다(= 세탁합니다)</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">대동사 does(그렇게 하다)와 is(~이다) 구별</p><p class=\"gr\">앞에 나온 동사를 다시 쓰지 않으려고 대신 받는 말이 대동사예요. 앞 동사가 일반동사면 do(하다)·does(하다)·did(했다)로, am(~이다)·is(~이다) 같은 동사면 그 동사 그대로 받아요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She likes pizza, and I do too.</div><div class=\"ko\">그녀는 피자를 좋아하고, 나도 그렇다. (likes 좋아하다는 일반동사라 do로 받아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She likes pizza, and I am too.</div><div class=\"ko\">일반동사 likes(좋아하다)를 be동사 am으로 받아서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He is tall, and I am too.</div><div class=\"ko\">그는 키가 크고, 나도 그렇다. (is는 be동사라 am으로 받아요)</div></div><p class=\"gb\">지문 4번도 앞 동사가 일반동사 cleans(세탁하다)예요. 그래서 반복은 is so(그렇다)가 아니라 does so(그렇게 한다)로 받아야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">is → does (그렇게 하다)<small>앞 동사 cleans(세탁하다)가 일반동사라서 반복은 is(~이다)가 아니라 does(그렇게 하다)로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Compared ~와 비교하여</span><span class=\"why\">5번은 쉼표 뒤 주절의 주어가 modern washers(현대식 세탁기)예요. 세탁기는 스스로 비교하는 게 아니라 옛 세탁기와 ‘비교되는’ 쪽이라 수동 Compared(비교되어)가 맞아요. Comparing(비교하는)을 쓰면 세탁기가 직접 뭔가를 비교하는 말이 돼요.</span><div class=\"gm wx\"><p class=\"gt\">분사구문: 주절 주어가 당하는 쪽이면 p.p.(수동), 하는 쪽이면 -ing(능동)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Compared with my brother, I am tall.</div><div class=\"ko\">형과 비교하면, 나는 키가 크다. (나는 비교‘되는’ 쪽이라 Compared가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Comparing with my brother, I am tall.</div><div class=\"ko\">내가 직접 비교하는 게 아니라 비교되는 쪽인데 능동 Comparing을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Seen from the hill, the town looks small.</div><div class=\"ko\">언덕에서 보면, 그 마을은 작아 보인다. (마을은 보이는 쪽이라 수동 Seen이 맞아요)</div></div><p class=\"gb\">지문 5번도 modern washers(현대식 세탁기)가 the old washers(예전 세탁기)와 비교되는 쪽이라 Compared(비교되어)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">where 그곳에서</span><span class=\"why\">1번은 장소 riverbanks and streams(강기슭과 개울) 바로 뒤예요. 뒤의 they beat and rubbed it(그들은 그것을 때리고 문질렀다)이 주어·목적어를 다 갖춘 완전한 절이라 관계부사 where(그곳에서)가 맞아요. which(그것)는 뒤에 빈자리가 있어야 해요.</span><div class=\"gm wx\"><p class=\"gt\">관계부사 where(그곳에서) + 완전한 절 / 관계대명사 which(그것) + 불완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I went to the park, where I met Tom.</div><div class=\"ko\">나는 공원에 갔고, 그곳에서 톰을 만났다. (I met Tom이 완전해서 where가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I went to the park, which I met Tom.</div><div class=\"ko\">I met Tom(나는 톰을 만났다)에 빈자리가 없는데 which를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the house where I live.</div><div class=\"ko\">이곳이 내가 사는 집이다. (장소 house 집 + 완전한 절이라 where가 맞아요)</div></div><p class=\"gb\">지문 1번도 장소 streams(개울) 뒤에 they beat and rubbed it(그들은 그것을 때리고 문질렀다)이라는 완전한 절이 와서 where(그곳에서)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">automatically 자동적으로</span><span class=\"why\">2번은 관계대명사 that(~하는) 뒤, 동사 regulates(조절하다) 바로 앞이에요. 동사를 꾸며 ‘어떻게’ 조절하는지 말해 주는 자리라 부사 automatically(자동적으로)가 맞아요. 형용사 automatic(자동의)은 동사를 꾸밀 수 없어요.</span><div class=\"gm wx\"><p class=\"gt\">동사를 꾸미는 말은 부사(~하게)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She quickly ran home.</div><div class=\"ko\">그녀는 빨리 집으로 달려갔다. (동사 ran을 꾸미니 부사 quickly가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She quick ran home.</div><div class=\"ko\">quick(빠른)은 형용사라 동사 ran(달렸다)을 꾸밀 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The door opens automatically.</div><div class=\"ko\">그 문은 자동으로 열린다. (동사 opens를 꾸미니 부사 automatically가 맞아요)</div></div><p class=\"gb\">지문 2번도 automatically(자동적으로)가 동사 regulates(조절하다)를 꾸며 주니 부사가 딱 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">its 그것의</span><span class=\"why\">3번은 With(~으로) 뒤, 명사 electrical and mechanical system(전기적·기계적 시스템) 앞이라 ‘누구의’ 시스템인지 말하는 소유격 자리예요. 주인은 단수 the washing machine(세탁기)이니 its(그것의)가 맞아요. their(그들의)는 복수일 때, it's(그것은 ~이다)는 소유격이 아니에요.</span><div class=\"gm wx\"><p class=\"gt\">소유격 대명사: 가리키는 명사의 수에 맞춰 its(단수) / their(복수)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The dog wagged its tail.</div><div class=\"ko\">그 개는 꼬리를 흔들었다. (개 한 마리의 꼬리라 its가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The dog wagged it's tail.</div><div class=\"ko\">it's는 it is(그것은 ~이다)의 줄임말이라 소유격 자리에 쓰면 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The dogs wagged their tails.</div><div class=\"ko\">개들은 꼬리를 흔들었다. (여러 마리라 their가 맞아요)</div></div><p class=\"gb\">지문 3번도 시스템의 주인이 단수 the washing machine(세탁기)이라 its(그것의)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Before the washing machine was invented,</div><div class=\"k\">세탁기가 발명되기 전에,</div></div><div class=\"rc\"><div class=\"e\">people used washboards to scrub,</div><div class=\"k\">사람들은 비벼 빨기 위해 빨래판을 사용하거나</div></div><div class=\"rc\"><div class=\"e\">or they carried their laundry</div><div class=\"k\">또는 그들의 세탁물을 가져갔습니다</div></div><div class=\"rc\"><div class=\"e\">to riverbanks and streams,</div><div class=\"k\">강기슭과 개울로,</div></div><div class=\"rc\"><div class=\"e\">where they beat and rubbed it</div><div class=\"k\">그곳에서 그들은 그것(= 세탁물)을 때리고 문질렀습니다</div></div><div class=\"rc\"><div class=\"e\">against rocks.</div><div class=\"k\">바위에 대고.</div></div><div class=\"rnat\">세탁기가 발명되기 전에, 사람들은 빨래를 비벼 빨기 위해 빨래판을 사용하거나 세탁물을 강기슭과 개울로 가져갔는데, 그곳에서 그들은 세탁물을 아주 세게 계속 때리거나 바위에 대고 문질렀다.</div><div class=\"rst\">세탁기가 없던 옛날엔 빨래판에 비비거나 개울에 가서 바위에 빨래를 두드렸어요. 장소 개울 뒤에 완전한 절이 와서 where(그곳에서)예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Such backbreaking labor</div><div class=\"k\">그러한 매우 힘든 노동은</div></div><div class=\"rc\"><div class=\"e\">is still commonplace</div><div class=\"k\">여전히 흔합니다</div></div><div class=\"rc\"><div class=\"e\">in parts of the world,</div><div class=\"k\">세계의 일부 지역에서는,</div></div><div class=\"rc\"><div class=\"e\">but for most homeowners</div><div class=\"k\">하지만 대부분의 자택 소유자들에게는</div></div><div class=\"rc\"><div class=\"e\">the work is now done</div><div class=\"k\">그 일(= 세탁)은 이제 행해집니다</div></div><div class=\"rc\"><div class=\"e\">by a machine</div><div class=\"k\">기계에 의해</div></div><div class=\"rc\"><div class=\"e\">that automatically regulates water temperature,</div><div class=\"k\">자동적으로 물 온도를 조절하고</div></div><div class=\"rc\"><div class=\"e\">measures out the detergent,</div><div class=\"k\">세제를 덜어 내고</div></div><div class=\"rc\"><div class=\"e\">washes, rinses,</div><div class=\"k\">세탁하고, 헹구고</div></div><div class=\"rc\"><div class=\"e\">and spin-dries.</div><div class=\"k\">원심력으로 탈수하는.</div></div><div class=\"rnat\">그러한 매우 힘든 노동은 여전히 세계의 일부 지역에서는 흔히 일어나는 일이지만, 오늘날 자택을 소유하고 있는 대부분의 사람들에게 그 일(세탁하는 일)은 자동적으로 물 온도를 조절하고, 세제를 덜어 내고, 세탁하고, 헹구고, 원심력으로 탈수하는 기계에 의해 행해진다.</div><div class=\"rst\">지금도 그런 힘든 곳이 있지만, 대부분은 기계가 물 온도까지 <b>자동으로</b> 맞춰 줘요. 동사 regulates(조절하다)를 꾸미니 부사 automatically(자동적으로)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">With its electrical and mechanical system,</div><div class=\"k\">그것(= 세탁기)의 전기적이고 기계적인 시스템으로 인해,</div></div><div class=\"rc\"><div class=\"e\">the washing machine is one of</div><div class=\"k\">세탁기는 ~ 중 하나입니다</div></div><div class=\"rc\"><div class=\"e\">the most technologically advanced examples</div><div class=\"k\">가장 기술적으로 진보한 예들</div></div><div class=\"rc\"><div class=\"e\">of a large household appliance.</div><div class=\"k\">대형 가전제품의.</div></div><div class=\"rnat\">그것(세탁기)의 전기를 이용하고 기계로 작동되는 시스템으로 인해, 세탁기는 대형 가전제품의 가장 기술적으로 진보한 예들 중의 하나이다.</div><div class=\"rst\">그래서 세탁기는 가장 앞선 가전제품 중 하나예요. 시스템의 주인이 단수 세탁기라 its(그것의)예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">It not only <span class=\"cw\">cleans</span> clothes,</div><div class=\"k\">그것(= 세탁기)은 옷을 <span class=\"cw\">세탁할</span> 뿐만 아니라,</div></div><div class=\"rc ckc\"><div class=\"e\">but it <span class=\"cw\">does so</span></div><div class=\"k\"><span class=\"cw\">그렇게 합니다(= 세탁합니다)</span> ※ 문제지엔 is로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">with far less water, detergent, and energy</div><div class=\"k\">훨씬 더 적은 물과 세제, 에너지로</div></div><div class=\"rc\"><div class=\"e\">than washing by hand requires.</div><div class=\"k\">손빨래가 필요로 하는 것보다.</div></div><div class=\"rnat\">그것(세탁기)은 옷을 세탁할 뿐만 아니라, 손빨래가 필요로 하는 것보다 훨씬 더 적은 물과 세제, 그리고 에너지로 그렇게 한다(세탁한다).</div><div class=\"rst\">세탁기는 옷을 빨 뿐 아니라, 훨씬 적은 물로 <b>그렇게 해요</b>. 앞 동사 cleans(세탁하다)가 일반동사라 is(~이다)가 아니라 does(그렇게 하다)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Compared with the old washers</div><div class=\"k\">예전의 세탁기와 비교하여</div></div><div class=\"rc\"><div class=\"e\">that squeezed out excess water</div><div class=\"k\">초과한 물을 짜내던</div></div><div class=\"rc\"><div class=\"e\">by feeding clothes through rollers,</div><div class=\"k\">롤러에 옷을 넣어서,</div></div><div class=\"rc\"><div class=\"e\">modern washers are indeed</div><div class=\"k\">현대식의 세탁기는 정말로 ~입니다</div></div><div class=\"rc\"><div class=\"e\">an electrical-mechanical phenomenon.</div><div class=\"k\">전기적이고 기계적인 경이로운 물건.</div></div><div class=\"rnat\">롤러에 옷을 넣어서 초과한(남은) 물을 짜내는 예전의 세탁기와 비교하여, 현대식의 세탁기는 정말로 전기적으로 그리고 기계적으로 경이로운 물건이다.</div><div class=\"rst\">롤러로 물을 짜던 옛 세탁기와 비교하면 요즘 세탁기는 정말 놀라운 물건이에요. 세탁기는 비교되는 쪽이라 Compared(비교되어)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"washboard\" data-m=\"빨래판\"><b>washboard</b>빨래판</button><button type=\"button\" class=\"wdb\" data-w=\"scrub\" data-m=\"비벼 빨다\"><b>scrub</b>비벼 빨다</button><button type=\"button\" class=\"wdb\" data-w=\"backbreaking\" data-m=\"매우 힘든\"><b>backbreaking</b>매우 힘든</button><button type=\"button\" class=\"wdb\" data-w=\"commonplace\" data-m=\"아주 흔한\"><b>commonplace</b>아주 흔한</button><button type=\"button\" class=\"wdb\" data-w=\"regulate\" data-m=\"조절하다\"><b>regulate</b>조절하다</button><button type=\"button\" class=\"wdb\" data-w=\"detergent\" data-m=\"세제\"><b>detergent</b>세제</button><button type=\"button\" class=\"wdb\" data-w=\"household appliance\" data-m=\"가전제품\"><b>household appliance</b>가전제품</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 실험 <b>결과 문장</b>을 말만 바꿔 옮긴 것이에요. 6번 “<b>8% 덜 벌어도</b> 같은 배경과 일하고 싶다”가 (A), 9번 “선입견이 <b>자기 소득까지 줄였다</b>”가 (B)로 짝지어져요.</p><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서 (A)</span><div class=\"en\">The study showed that the teenagers were prepared <mark>to earn an average of 8% less</mark> if they could work with someone they thought came from the same ethnic or religious background.</div><p class=\"ko\">그 연구는 십 대들이 같은 배경에서 왔다고 생각되는 누군가와 함께 일할 수 있다면 <mark>평균 8% 더 적게 벌</mark> 준비가 되어 있다는 것을 보여 주었습니다.</p></div><div class=\"ck-via\"><i>▼</i><span>돈을 덜 받는 쪽을 골랐다 = 선입견이 돈 계산을 이겼다</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 단서 (B)</span><div class=\"en\">… to the point where they actually allowed that prejudice <mark>to reduce their own potential income</mark>.</div><p class=\"ko\">… 그 선입견이 <mark>그들 자신의 잠재적인 소득을 줄이는 것을</mark> 실제로 허용할 정도까지 (그 가정에 선입견을 적용했습니다).</p></div><div class=\"ck-via\"><i>▼</i><span>같은 배경과 일하려 함 = (A) preference(선호), 소득보다 선입견이 이김 = (B) outweigh(~보다 더 중요하다)</span></div><div class=\"ck-step\"><span class=\"lab\">요약문 (11번) · 짝 맞추기</span><div class=\"en\">A study in which teenagers expressed a(n) <mark>preference</mark> to work with someone of a similar background, … that an assumption-based prejudice <mark>can outweigh</mark> rational economic behavior.</div><p class=\"ko\">십 대들이 비슷한 배경의 누군가와 함께 일하는 것에 대한 (A) <mark>선호를</mark> 표현했던 한 연구는 … 가정에 근거한 선입견이 이성적인 경제 행위보다 (B) <mark>더 중요할 수 있다</mark>는 것을 시사합니다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">preference 선호 … outweigh ~보다 더 중요하다<small>6번의 일부러 고른 마음 → preference(선호), 9번의 소득을 줄여도 괜찮음 → outweigh(~보다 더 중요하다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">preference 선호 … strengthen 강화하다</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 9번에서 선입견이 자기 소득을 줄이게 했으니, 이성적인 경제 행위를 강화한 게 아니라 눌러 이긴 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">hesitation 망설임 … reinforce 강화하다</span><span class=\"why\">둘 다 틀려요. 6번은 같은 배경과 일하려고 돈까지 포기했으니 망설임이 아니라 선호예요. reinforce(강화하다)도 9번의 소득을 줄인 결과와 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">hesitation 망설임 … overwhelm 압도하다</span><span class=\"why\">(B)는 9번과 어울리지만 (A)가 틀려요. 십 대들은 비슷한 배경의 사람과 일하는 걸 망설인 게 아니라 6번처럼 오히려 원했어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">inability 할 수 없음 … underlie ~의 기저를 이루다</span><span class=\"why\">둘 다 틀려요. 2번에서 둘 중 한 명을 고를 선택권을 줬으니 함께 일할 수 없는 게 아니에요. 선입견이 이성적 행위의 바탕이 된다는 말도 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">A study investigated</div><div class=\"k\">한 연구는 조사했습니다</div></div><div class=\"rc\"><div class=\"e\">the economic cost of prejudice</div><div class=\"k\">선입견의 경제적인 비용을</div></div><div class=\"rc\"><div class=\"e\">based on blind assumptions.</div><div class=\"k\">맹목적인 가정에 근거한.</div></div><div class=\"rnat\">한 연구는 맹목적인 가정에 근거한 선입견의 경제적인 비용을 조사했다.</div><div class=\"rst\">방과후 과학 실험 짝을 고르는 날이에요. 지문도 맹목적인 가정에서 나온 <b>선입견</b>(prejudice)이 돈으로 얼마나 손해인지 조사한 연구예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Researchers gave a group of Danish teenagers</div><div class=\"k\">연구자들은 한 무리의 덴마크 십 대들에게 주었습니다</div></div><div class=\"rc\"><div class=\"e\">the choice of working with</div><div class=\"k\">함께 일하는 선택권을</div></div><div class=\"rc\"><div class=\"e\">one of two people.</div><div class=\"k\">두 사람 중 한 명과.</div></div><div class=\"rnat\">연구자들은 한 무리의 덴마크 십 대들에게 두 사람 중 한 명과 함께 일하는 선택권을 주었다.</div><div class=\"rst\">쌤이 처음 보는 두 학생 중 한 명을 짝으로 고르래요. 지문도 덴마크(Danish) 십 대들에게 두 사람 중 한 명을 고르게 했어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The teenager had never met</div><div class=\"k\">그 십 대는 만난 적이 없었습니다</div></div><div class=\"rc\"><div class=\"e\">either of them.</div><div class=\"k\">그들 중 어느 한 명도.</div></div><div class=\"rnat\">십 대는 그들 중 어느 한 명과도 만난 적이 없었다.</div><div class=\"rst\">둘 다 한 번도 본 적 없는 친구예요. 지문도 십 대가 두 사람 중 누구도 만난 적이 없었대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">One of the people</div><div class=\"k\">그 사람들 중 한 명은</div></div><div class=\"rc\"><div class=\"e\">had a name</div><div class=\"k\">이름을 가지고 있었습니다</div></div><div class=\"rc\"><div class=\"e\">that suggested</div><div class=\"k\">암시하는</div></div><div class=\"rc\"><div class=\"e\">they were from a similar ethnic or religious background</div><div class=\"k\">그 사람(= 두 사람 중 한 명)이 비슷한 인종적 또는 종교적 배경 출신이라는 것을</div></div><div class=\"rc\"><div class=\"e\">to the teenager.</div><div class=\"k\">그 십 대와.</div></div><div class=\"rnat\">그 사람들 중 한 명은 그 십 대와 유사한 인종적 또는 종교적 배경의 출신임을 암시하는 이름을 가지고 있었다.</div><div class=\"rst\">한 명은 이름표만 봐도 우리 동네 친구 같아요. 지문도 한 사람은 비슷한 배경 출신 같은 이름이었어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The other had a name</div><div class=\"k\">다른 한 사람은 이름을 가지고 있었습니다</div></div><div class=\"rc\"><div class=\"e\">that suggested</div><div class=\"k\">암시하는</div></div><div class=\"rc\"><div class=\"e\">they were from a different ethnic or religious background.</div><div class=\"k\">그 사람(= 다른 한 사람)이 다른 인종적 또는 종교적 배경 출신이라는 것을.</div></div><div class=\"rnat\">다른 한 사람은 다른 인종적 또는 종교적 배경의 출신임을 암시하는 이름을 가지고 있었다.</div><div class=\"rst\">다른 한 명은 이름이 낯선 다른 동네 친구 같아요. 지문도 다른 한 사람은 다른 배경 같은 이름이었어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">The study showed</div><div class=\"k\">그 연구는 보여 주었습니다</div></div><div class=\"rc\"><div class=\"e\">that the teenagers were prepared</div><div class=\"k\">십 대들이 준비가 되어 있다는 것을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to earn an average of 8% less</span></div><div class=\"k\"><span class=\"cw\">평균 8% 더 적게 벌</span></div></div><div class=\"rc\"><div class=\"e\">if they could work with someone</div><div class=\"k\">만약 그들이 누군가와 함께 일할 수 있다면</div></div><div class=\"rc\"><div class=\"e\">they thought came from the same ethnic or religious background.</div><div class=\"k\">그들이 생각하기에 같은 인종적 또는 종교적 배경에서 온.</div></div><div class=\"rnat\">그 연구는 만약 십 대들이 자신이 생각하기에 같은 인종적 또는 종교적 배경으로부터 온 누군가와 함께 일할 수 있다면 그들은 평균 8% 더 적게 벌 준비가 되어 있다는 것을 보여 주었다.</div><div class=\"rst\">그런데 대부분 상품 포인트를 덜 받아도 우리 동네 같은 친구를 골라요. 지문도 <b>8% 덜 벌어도</b> 같은 배경과 일하려 했대요. = (A) 선호</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">And this prejudice was evident</div><div class=\"k\">그리고 이러한 선입견은 분명했습니다</div></div><div class=\"rc\"><div class=\"e\">among teenagers with ethnic majority names</div><div class=\"k\">다수 인종의 이름을 가진 십 대들 사이에서</div></div><div class=\"rc\"><div class=\"e\">as well as those with ethnic minority names.</div><div class=\"k\">그리고 소수 인종의 이름을 가진 십 대들(= 십 대들) 사이에서도.</div></div><div class=\"rnat\">그리고 이러한 선입견은 소수 인종의 이름을 가진 십 대들뿐만 아니라 다수 인종의 이름을 가진 십 대들 사이에서도 분명했다.</div><div class=\"rst\">이건 어느 한쪽 아이들만 그런 게 아니에요. 지문도 다수 인종 이름이든 소수 인종 이름이든 이 선입견이 분명했대요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The teenagers were blindly making assumptions</div><div class=\"k\">십 대들은 맹목적으로 가정을 하고 있었습니다</div></div><div class=\"rc\"><div class=\"e\">about the race of their potential colleagues.</div><div class=\"k\">그들의 잠재적인 동료의 인종에 대한.</div></div><div class=\"rnat\">십 대들은 맹목적으로 그들의 잠재적인 동료의 인종에 대한 가정을 했다.</div><div class=\"rst\">이름표만 보고 “쟤는 우리 동네일 거야” 하고 맘대로 짐작한 거예요. 지문도 동료의 인종을 맹목적으로 가정했다고 해요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">They then applied prejudice to those assumptions,</div><div class=\"k\">그들은 그러고 나서 그 가정에 선입견을 적용했습니다,</div></div><div class=\"rc\"><div class=\"e\">to the point where</div><div class=\"k\">~할 정도까지</div></div><div class=\"rc\"><div class=\"e\">they actually allowed that prejudice</div><div class=\"k\">그들이 그 선입견이 ~하는 것을 실제로 허용할</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to reduce their own potential income.</span></div><div class=\"k\"><span class=\"cw\">그들 자신의 잠재적인 소득을 줄이는 것을.</span></div></div><div class=\"rnat\">그들은 그러고 나서 그 선입견이 '그들 자신의' 잠재적인 소득을 줄이는 것을 실제로 허용할 정도까지 선입견을 그 가정에 적용하였다.</div><div class=\"rst\">그 짐작 때문에 내 포인트를 스스로 깎은 셈이에요. 지문도 선입견이 <b>자기 소득을 줄이게</b> 했다고 해요. = (B) 더 중요해짐</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">The job required the two teenagers</div><div class=\"k\">그 일은 그 두 명의 십 대들에게 요구했습니다</div></div><div class=\"rc\"><div class=\"e\">to work together</div><div class=\"k\">함께 일할 것을</div></div><div class=\"rc\"><div class=\"e\">for just 90 minutes.</div><div class=\"k\">단지 90분간만.</div></div><div class=\"rnat\">그 일은 그 두 명의 십 대들에게 단지 '90분'간만 함께 일할 것을 요구했다.</div><div class=\"rst\">게다가 같이 할 시간은 겨우 실험 한 번이에요. 지문도 함께 일하는 시간이 단 90분뿐이었대요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">A study in which teenagers expressed a(n) <span class=\"cw\">preference</span></div><div class=\"k\">십 대들이 <span class=\"cw\">선호를</span> 표현했던 한 연구는 ※ 문제지엔 빈칸 (A)</div></div><div class=\"rc\"><div class=\"e\">to work with someone of a similar background,</div><div class=\"k\">비슷한 배경의 누군가와 함께 일하는 것에 대한,</div></div><div class=\"rc\"><div class=\"e\">even at a financial cost to themselves,</div><div class=\"k\">심지어 자신에게 오는 경제적인 손실에도,</div></div><div class=\"rc\"><div class=\"e\">suggests</div><div class=\"k\">시사합니다</div></div><div class=\"rc\"><div class=\"e\">that an assumption-based prejudice</div><div class=\"k\">가정에 근거한 선입견이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">can outweigh</span></div><div class=\"k\"><span class=\"cw\">~보다 더 중요할 수 있다는 것을</span> ※ 문제지엔 빈칸 (B)</div></div><div class=\"rc\"><div class=\"e\">rational economic behavior.</div><div class=\"k\">이성적인 경제 행위.</div></div><div class=\"rnat\">십 대들이 심지어 자신에게 오는 경제적인 손실에도 비슷한 배경의 누군가와 함께 일하는 것에 (A)선호를 표현했던 한 연구는 가정에 근거한 선입견이 이성적인 경제 행위보다 더 중요(B)할 수 있다는 것을 시사한다.</div><div class=\"rst\">정리하면, 비슷한 친구를 <b>더 원하는 마음</b>(preference 선호)이 손해 안 보려는 계산을 <b>이겨 버려요</b>(outweigh ~보다 더 중요하다). 6·9번을 옮긴 요약이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"prejudice\" data-m=\"선입견, 편견\"><b>prejudice</b>선입견, 편견</button><button type=\"button\" class=\"wdb\" data-w=\"assumption\" data-m=\"가정, 추정\"><b>assumption</b>가정, 추정</button><button type=\"button\" class=\"wdb\" data-w=\"ethnic\" data-m=\"인종적인\"><b>ethnic</b>인종적인</button><button type=\"button\" class=\"wdb\" data-w=\"evident\" data-m=\"분명한\"><b>evident</b>분명한</button><button type=\"button\" class=\"wdb\" data-w=\"potential\" data-m=\"잠재적인\"><b>potential</b>잠재적인</button><button type=\"button\" class=\"wdb\" data-w=\"outweigh\" data-m=\"~보다 더 중요하다\"><b>outweigh</b>~보다 더 중요하다</button></div>"};

  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
