0 billion cubic meters.</div><div class=\"k\">4000억 세제곱미터보다 더 컸다.</div></div><div class=\"rnat\">②2014년과 2018년 각각, 러시아와 이란 간의 천연가스 생산량 차이는 4000억 세제곱미터보다 더 컸다.</div><div class=\"rst\">2등과 3등 친구의 스티커 차이는 두 해 모두 아주 커요. = 지문 3번, 러시아와 이란의 <b>차이</b>(gap)가 4000억보다 크다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Canada ranked lower</div><div class=\"k\">캐나다는 더 낮은 순위를 기록했다</div></div><div class=\"rc\"><div class=\"e\">in 2018 than in 2014</div><div class=\"k\">2014년보다 2018년에</div></div><div class=\"rc\"><div class=\"e\">even though</div><div class=\"k\">비록 ~이지만</div></div><div class=\"rc\"><div class=\"e\">the amount of natural gas produced in Canada increased.</div><div class=\"k\">캐나다에서 생산된 천연가스 양은 증가했지만.</div></div><div class=\"rnat\">③캐나다에서 생산된 천연가스 양은 증가했지만, 캐나다는 2014년보다 2018년에 더 낮은 순위를 기록했다.</div><div class=\"rst\">한 친구는 스티커가 늘었는데도 등수는 내려갔어요. 다른 친구가 더 많이 모았거든요. = 지문 4번 캐나다의 <b>ranked lower</b>(더 낮은 순위)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Between 2014 and 2018,</div><div class=\"k\">2014년과 2018년 사이,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the increase in natural gas production in China</span></div><div class=\"k\"><span class=\"cw\">중국의 천연가스 생산량의 증가는</span></div></div><div class=\"rc ckc\"><div class=\"e\">was <span class=\"cw\">more than three times</span></div><div class=\"k\"><span class=\"cw\">3배 이상이었다</span></div></div><div class=\"rc\"><div class=\"e\">that in Qatar.</div><div class=\"k\">카타르의 그것(= 천연가스 생산량의 증가)의.</div></div><div class=\"rnat\">④2014년과 2018년 사이 중국의 천연가스 생산량의 증가는 카타르의 그것(천연가스 생산량의 증가)의 3배 이상이었다.</div><div class=\"rst\">중국 친구는 44장, 카타르 친구는 21장 늘었어요. 21의 3배는 63이라 <b>3배 이상</b>(more than three times)은 틀려요. 그래서 ④가 정답이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Australia,</div><div class=\"k\">호주는,</div></div><div class=\"rc\"><div class=\"e\">which was not included</div><div class=\"k\">그(= 호주)가 포함되지 않았던</div></div><div class=\"rc\"><div class=\"e\">among the top seven natural gas producing countries in 2014,</div><div class=\"k\">2014년 상위 7개 천연가스 생산 국가 중에,</div></div><div class=\"rc\"><div class=\"e\">ranked seventh in 2018.</div><div class=\"k\">2018년에 7위를 기록했다.</div></div><div class=\"rnat\">⑤2014년 상위 7개 천연가스 생산 국가에 포함되지 않았던 호주는 2018년에 7위를 기록했다.</div><div class=\"rst\">처음엔 순위표에 없던 친구가 나중에 7등으로 들어왔어요. = 지문 6번, 2014년에 없던 호주가 2018년 7위예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"natural gas\" data-m=\"천연가스\"><b>natural gas</b>천연가스</button><button type=\"button\" class=\"wdb\" data-w=\"respectively\" data-m=\"각각\"><b>respectively</b>각각</button><button type=\"button\" class=\"wdb\" data-w=\"gap\" data-m=\"차이, 격차\"><b>gap</b>차이, 격차</button><button type=\"button\" class=\"wdb\" data-w=\"rank lower\" data-m=\"더 낮은 순위를 기록하다\"><b>rank lower</b>더 낮은 순위를 기록하다</button><button type=\"button\" class=\"wdb\" data-w=\"even though\" data-m=\"비록 ~이지만\"><b>even though</b>비록 ~이지만</button><button type=\"button\" class=\"wdb\" data-w=\"more than three times\" data-m=\"3배 이상\"><b>more than three times</b>3배 이상</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>However</b>(하지만) 뒤에 있어요. 1~3번의 “감정은 나쁘다”는 남들 생각이고, 4~5번이 필자의 진짜 말이에요. 6~8번 예시도 모두 5번의 <b>survive</b>(생존하다)를 돕는 장면이에요.</p><div class=\"ck-step\"><span class=\"lab\">1~3번 · 뒤집힐 통념</span><div class=\"en\">Emotions usually get a bad reputation.</div><p class=\"ko\">감정은 보통 나쁜 평판을 얻는다.</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만)로 앞의 통념을 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 결론 신호</span><div class=\"en\"><mark>However,</mark> all emotions have a point.</div><p class=\"ko\"><mark>하지만,</mark> 모든 감정에는 나름의 의미가 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>‘나름의 의미’가 무엇인지 바로 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 주제</span><div class=\"en\">They played an important part in our evolutionary history and <mark>helped us survive</mark>.</div><p class=\"ko\">그것들은 우리의 진화의 역사에서 중요한 역할을 했고, <mark>우리가 생존하도록 도왔다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>혐오감(disgust) → 상한 음식 먹기 피하기</span><span><em>7번</em>행복(happiness) → 사람들과 잘 지내기</span><span><em>8번</em>분노(anger) → 먹이 찾기·포식자 물리치기</span></div><div class=\"ck-eq\">⇒ 세 예시의 공통점 = 감정이 살아남는 데 도움을 줌 (5번과 같은 말)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">contributions of emotions to human survival 감정이 인간의 생존에 기여한 것<small>5번 helped us survive(우리가 생존하도록 도왔다)를 survival(생존)로 바꿔 쓴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">reasons we need to hide our emotions 감정을 숨겨야 하는 이유</span><span class=\"why\">[반대] 2~3번의 “감정은 관리해야 한다”는 However(하지만)로 뒤집히는 통념이에요. 필자는 감정을 숨기라는 게 아니라 쓸모 있다고 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">difficulties of reading others' emotions 남의 감정을 읽기 어려운 점</span><span class=\"why\">[반대] 6번은 남의 얼굴에서 혐오감을 읽고 위험을 피했다는 말이에요. 읽기 어렵다는 게 아니라 읽어서 도움을 받았다는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">ways of expressing emotions in different cultures 문화마다 다른 감정 표현 방식</span><span class=\"why\">[지문에 없음] 문화(culture)를 비교하는 문장은 하나도 없어요. 지문은 우리 조상(ancestors) 모두의 진화 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">differences between emotional and physical responses 감정 반응과 신체 반응의 차이</span><span class=\"why\">[지문에 없음] 신체 반응과 비교하는 말은 없어요. 지문은 감정끼리, 혐오·행복·분노가 각각 생존을 도운 예만 들어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Emotions usually get</div><div class=\"k\">감정은 보통 얻는다</div></div><div class=\"rc\"><div class=\"e\">a bad reputation.</div><div class=\"k\">나쁜 평판을.</div></div><div class=\"rnat\">감정은 대체로 나쁜 평판을 얻는다.</div><div class=\"rst\">화를 내거나 울면 “감정적이다”라는 말을 듣죠. = 지문 1번, 감정은 보통 <b>나쁜 평판</b>(a bad reputation)을 얻는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">They are often seen</div><div class=\"k\">그것들(= 감정들)은 흔히 여겨진다</div></div><div class=\"rc\"><div class=\"e\">as something</div><div class=\"k\">무언가로</div></div><div class=\"rc\"><div class=\"e\">to be regulated or managed.</div><div class=\"k\">조절되거나 관리되어야 할.</div></div><div class=\"rnat\">감정은 흔히 규제되거나 관리되어야 할 무언가로 여겨진다.</div><div class=\"rst\">그래서 “꾹 참아야지” 하고 감정을 눌러야 할 것으로 여겨요. = 지문 2번, 조절되거나 관리되어야 할 것이라는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">People even think</div><div class=\"k\">사람들은 심지어 생각한다</div></div><div class=\"rc\"><div class=\"e\">emotions are harmful</div><div class=\"k\">감정이 해롭다고</div></div><div class=\"rc\"><div class=\"e\">if they get out of control.</div><div class=\"k\">그것들(= 감정들)이 통제를 벗어나면.</div></div><div class=\"rnat\">사람들은 심지어 감정이 통제를 벗어나면 해롭다고 생각하기도 한다.</div><div class=\"rst\">심지어 화가 폭발하면 큰일 난다고까지 생각해요. 지문 3번도 감정이 통제를 벗어나면 해롭다고 여긴다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However,</span></div><div class=\"k\"><span class=\"cw\">하지만,</span></div></div><div class=\"rc\"><div class=\"e\">all emotions have a point.</div><div class=\"k\">모든 감정에는 나름의 의미가 있다.</div></div><div class=\"rnat\">하지만, 모든 감정에는 존재 이유가 있다.</div><div class=\"rst\"><b>하지만</b>(However) 필자는 모든 감정에 이유가 있다고 말해요. 여기서부터가 진짜 하고 싶은 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">They played an important part</div><div class=\"k\">그것들(= 감정들)은 중요한 역할을 했다</div></div><div class=\"rc\"><div class=\"e\">in our evolutionary history</div><div class=\"k\">우리의 진화의 역사에서</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">helped us survive</span>.</div><div class=\"k\">그리고 <span class=\"cw\">우리가 생존하도록 도왔다</span>.</div></div><div class=\"rnat\">그것들은 우리의 진화의 역사에서 중요한 역할을 했고 우리가 살아남도록 도왔다.</div><div class=\"rst\">감정은 아주 옛날부터 사람이 <b>살아남게 도와준</b> 도구예요. = 지문 5번 helped us survive(우리가 생존하도록 도왔다), 이게 주제예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">by seeing disgust on someone's face</div><div class=\"k\">어떤 사람의 얼굴에서 혐오감을 봄으로써</div></div><div class=\"rc\"><div class=\"e\">when presented with moldy food,</div><div class=\"k\">(그 사람이) 곰팡이가 핀 음식을 받았을 때,</div></div><div class=\"rc\"><div class=\"e\">we were able to avoid</div><div class=\"k\">우리는 피할 수 있었다</div></div><div class=\"rc\"><div class=\"e\">eating something dangerous.</div><div class=\"k\">위험한 것을 먹는 것을.</div></div><div class=\"rnat\">예를 들어, 곰팡이가 핀 음식을 받았을 때 누군가의 얼굴에서 혐오감을 봄으로써, 우리는 위험한 것을 먹는 것을 피할 수 있었다.</div><div class=\"rst\">급식 반찬을 먹은 친구가 “웩” 하는 얼굴을 보면 나는 안 먹죠. 지문 6번도 남의 혐오감을 보고 상한 음식을 피했다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">By communicating happiness,</div><div class=\"k\">행복을 전달함으로써,</div></div><div class=\"rc\"><div class=\"e\">we were able to develop</div><div class=\"k\">우리는 발전시킬 수 있었다</div></div><div class=\"rc\"><div class=\"e\">beneficial social interactions.</div><div class=\"k\">유익한 사회적 상호작용을.</div></div><div class=\"rnat\">행복을 전달함으로써, 우리는 이로운 사회적 상호작용을 발달시킬 수 있었다.</div><div class=\"rst\">웃으며 인사하면 친구가 금방 생겨요. = 지문 7번, 행복을 전해서 사람들과 좋은 관계를 만들었다는 말이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Even anger was an important emotion</span></div><div class=\"k\"><span class=\"cw\">심지어 분노도 중요한 감정이었다</span></div></div><div class=\"rc\"><div class=\"e\">to our ancestors,</div><div class=\"k\">우리의 조상들에게,</div></div><div class=\"rc\"><div class=\"e\">motivating us</div><div class=\"k\">그것(= 분노)은 우리를 자극했다</div></div><div class=\"rc\"><div class=\"e\">to seek food when we were hungry,</div><div class=\"k\">우리가 배고플 때 음식을 찾고,</div></div><div class=\"rc\"><div class=\"e\">to fight off predators</div><div class=\"k\">포식자를 물리치고,</div></div><div class=\"rc\"><div class=\"e\">and to compete for scarce resources.</div><div class=\"k\">그리고 부족한 자원을 위해 경쟁하도록.</div></div><div class=\"rnat\">심지어 분노조차도 우리 조상들에게 중요한 감정이었는데, 배고플 때 먹이를 찾고 포식자를 물리치고 희소 자원을 두고 경쟁하도록 동기를 부여했기 때문이다.</div><div class=\"rst\">배고파서 짜증 나면 간식을 찾아 나서듯, 지문 8번은 분노도 먹이를 찾고 맞서 싸우게 해서 생존을 도왔다고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"reputation\" data-m=\"평판\"><b>reputation</b>평판</button><button type=\"button\" class=\"wdb\" data-w=\"regulate\" data-m=\"조절하다, 규제하다\"><b>regulate</b>조절하다, 규제하다</button><button type=\"button\" class=\"wdb\" data-w=\"evolutionary history\" data-m=\"진화의 역사\"><b>evolutionary history</b>진화의 역사</button><button type=\"button\" class=\"wdb\" data-w=\"disgust\" data-m=\"혐오감\"><b>disgust</b>혐오감</button><button type=\"button\" class=\"wdb\" data-w=\"beneficial\" data-m=\"이로운\"><b>beneficial</b>이로운</button><button type=\"button\" class=\"wdb\" data-w=\"predator\" data-m=\"포식자\"><b>predator</b>포식자</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">감정 형용사(<b>interesting</b>(흥미로운) / <b>interested</b>(흥미를 느끼는))는 꾸미는 대상이 <b>감정을 주는 쪽</b>인지 <b>느끼는 쪽</b>인지부터 보세요. find(~라고 여기다) + 목적어 + 보어 구조에서는 목적어를 보면 돼요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (5번)</span><div class=\"en\">… we find them especially <u>④ interested</u>.</div><p class=\"ko\">우리는 그것들을 특히 ( ? )라고 여긴다 — find + 목적어 them + 보어</p></div><div class=\"ck-via\"><i>▼</i><span>them(그것들)이 누구인지 확인해요 = 3-D 아트, 모션 픽처, 착시</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 목적어 them의 정체</span><div class=\"en\">Because <mark>they use these neural circuits</mark> in novel ways,</div><p class=\"ko\">그것들(= 3-D 아트, 모션 픽처, 착시)이 <mark>이 신경 회로들을</mark> 새로운 방식으로 사용하기 때문에,</p></div><div class=\"ck-via\"><i>▼</i><span>착시·영화는 흥미를 ‘주는’ 쪽 → -ing(흥미로운)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\"><mark>we find them</mark> <mark>especially interesting</mark>.</div><p class=\"ko\">우리는 그것들을 <mark>특히 흥미롭다고</mark> 여긴다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">감정 분사 -ing(감정을 주는)와 p.p.(감정을 느끼는) 구별</p><p class=\"gr\">사물이나 일이 감정을 '주면' -ing(흥미로운), 사람이 감정을 '느끼면' p.p.(흥미를 느끼는)를 써요. find(~라고 여기다) + 목적어 + 보어에서는 목적어가 주는 쪽인지 느끼는 쪽인지 보면 돼요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I find this game interesting.</div><div class=\"ko\">나는 이 게임이 흥미롭다고 생각해. (게임이 흥미를 주니까 interesting이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I find this game interested.</div><div class=\"ko\">게임이 흥미를 느낄 수는 없어서 interested(흥미를 느끼는)는 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I am interested in this game.</div><div class=\"ko\">나는 이 게임에 흥미가 있어. (내가 흥미를 느끼니까 interested가 맞아요)</div></div><p class=\"gb\">지문 5번도 find(~라고 여기다)의 목적어 them(그것들)이 3-D 아트·영화·착시예요. 흥미를 주는 쪽이니 interested(흥미를 느끼는)가 아니라 interesting(흥미로운)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">interested → interesting (흥미로운)<small>them(착시·영화 등)은 흥미를 느끼는 사람이 아니라 흥미를 주는 것이라 interesting(흥미로운)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">that ~하는</span><span class=\"why\">6번은 the way(방식) 바로 뒤에 that(~하는)이 와요. 뒤의 modern recordings are made(현대 녹음이 만들어진다)는 주어·동사가 다 갖춰진 완전한 절이라, 방법을 나타내는 관계부사 대신 that(~하는)을 쓴 거예요.</span><div class=\"gm wx\"><p class=\"gt\">the way(방식) + that(~하는) + 완전한 절 (the way how는 함께 못 씀)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like the way that you smile.</div><div class=\"ko\">나는 네가 웃는 방식이 좋아. (you smile이 완전하고 the way 뒤 that이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I like the way how you smile.</div><div class=\"ko\">the way(방식)와 how(어떻게)를 나란히 써서 틀려요. 둘 중 하나만 써요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like how you smile.</div><div class=\"ko\">나는 네가 웃는 방식이 좋아. (the way 없이 how만 써서 맞아요)</div></div><p class=\"gb\">지문 6번도 the way(방식) 뒤에 완전한 절 modern recordings are made(현대 녹음이 만들어진다)가 와서 that(~하는)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">to discern 식별하도록</span><span class=\"why\">2번은 neural circuits that evolved(진화한 신경 회로) 바로 뒤예요. evolved(진화했다)는 이미 동사라서, 뒤에는 '무엇을 하도록' 진화했는지 목적을 말하는 to discern(식별하도록)이 와야 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">목적을 나타내는 부정사: 동사 + to(~하도록) + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Birds evolved to fly.</div><div class=\"ko\">새는 날도록 진화했다. (evolved 뒤에 목적 to fly 날도록이 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Birds evolved fly.</div><div class=\"ko\">동사 evolved(진화했다) 뒤에 동사 fly(날다)를 바로 또 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I went to the store to buy milk.</div><div class=\"ko\">나는 우유를 사려고 가게에 갔다. (to buy 사려고 = 목적이라 맞아요)</div></div><p class=\"gb\">지문 2번도 evolved(진화했다) 다음이라 '식별하도록'이라는 목적의 to discern(식별하도록)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">which 그것들</span><span class=\"why\">3번은 3-D 아트·모션 픽처·착시 뒤에 콤마와 none of(~ 중 어느 것도 아닌)가 와요. 전치사 of(~의) 뒤에서 앞 명사들을 받아 문장을 이어 주니 관계대명사 which(그것들)가 맞아요. 대명사 them(그것들)을 쓰면 접속사가 없어 두 문장이 그냥 붙어 버려요.</span><div class=\"gm wx\"><p class=\"gt\">수량어 + of(~의) + which(관계대명사): 콤마 뒤에서 앞 명사를 받으며 문장을 이어 줌</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have three cats, all of which are white.</div><div class=\"ko\">나는 고양이가 세 마리 있는데, 그들 모두 하얗다. (of 뒤 which가 앞 cats를 받으며 이어 줘서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have three cats, all of them are white.</div><div class=\"ko\">them(그들)은 이어 주는 힘이 없어서 두 문장이 그냥 붙어 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have three cats, all of that are white.</div><div class=\"ko\">전치사 of(~의) 뒤에는 that을 못 써서 틀려요.</div></div><p class=\"gb\">지문 3번도 none of(~ 중 어느 것도) 뒤에서 3-D 아트·모션 픽처·착시를 받으며 문장을 이어 주니 which(그것들)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">are ~이다</span><span class=\"why\">4번은 leverage perceptual systems that(~하는 지각 체계를 이용한다) 뒤예요. that(~하는)이 꾸미는 말은 바로 앞 복수 명사 perceptual systems(지각 체계들)라서 복수 동사 are(~이다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~하는) + 동사: 동사의 수는 앞 명사(선행사)에 맞춤</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have friends that are kind.</div><div class=\"ko\">나는 친절한 친구들이 있다. (friends 친구들 = 복수라서 are가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have friends that is kind.</div><div class=\"ko\">friends(친구들)는 복수인데 is를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a friend that is kind.</div><div class=\"ko\">나는 친절한 친구가 한 명 있다. (a friend 친구 한 명 = 단수라서 is가 맞아요)</div></div><p class=\"gb\">지문 4번도 that(~하는) 앞이 복수 perceptual systems(지각 체계들)라서 복수 동사 are(~이다)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There is a reason</div><div class=\"k\">이유가 있다</div></div><div class=\"rc\"><div class=\"e\">why so many of us</div><div class=\"k\">우리 중 그토록 많은 사람이 ~하는</div></div><div class=\"rc\"><div class=\"e\">are attracted to recorded music</div><div class=\"k\">녹음된 음악에 끌리는</div></div><div class=\"rc\"><div class=\"e\">these days,</div><div class=\"k\">요즘,</div></div><div class=\"rc\"><div class=\"e\">especially considering</div><div class=\"k\">특히 ~을 고려하면</div></div><div class=\"rc\"><div class=\"e\">personal music players are common</div><div class=\"k\">개인용 음악 재생기가 흔하고</div></div><div class=\"rc\"><div class=\"e\">and people are listening to music through headphones a lot.</div><div class=\"k\">사람들이 헤드폰을 통해 음악을 많이 듣고 있음을.</div></div><div class=\"rnat\">요즘 개인용 음악 재생기가 흔하고 사람들이 헤드폰을 통해 음악을 많이 듣고 있음을 특히 고려하면, 우리 중 많은 사람들이 녹음된 음악에 끌리는 데는 이유가 있다.</div><div class=\"rst\">요즘 많은 사람이 헤드폰으로 녹음된 음악에 푹 빠지는 데는 이유가 있어요. 지문은 why(~하는) 이하로 그 이유를 꺼내요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Recording engineers and musicians</div><div class=\"k\">녹음 엔지니어들과 음악가들은</div></div><div class=\"rc\"><div class=\"e\">have learned to create special effects</div><div class=\"k\">특수 효과를 만들어 내는 법을 익혔다</div></div><div class=\"rc\"><div class=\"e\">that tickle our brains</div><div class=\"k\">우리의 뇌를 자극하는</div></div><div class=\"rc\"><div class=\"e\">by exploiting neural circuits</div><div class=\"k\">신경 회로를 이용함으로써</div></div><div class=\"rc\"><div class=\"e\">that evolved to discern</div><div class=\"k\">식별하도록 진화한</div></div><div class=\"rc\"><div class=\"e\">important features of our auditory environment.</div><div class=\"k\">우리의 청각 환경의 중요한 특징들을.</div></div><div class=\"rnat\">녹음 기술자들과 음악가들은 우리의 청각 환경에서 중요한 특징을 식별하도록 진화한 신경 회로를 활용해, 우리의 뇌를 자극하는 특수 효과를 만들어내는 법을 배웠다.</div><div class=\"rst\">음악을 만드는 사람들은 소리를 알아듣도록 발달한 뇌 회로를 이용해 뇌를 간질이는 효과를 만들어요. evolved(진화했다) 뒤 <b>to discern</b>(식별하도록)은 목적이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">These special effects are similar in principle</div><div class=\"k\">이러한 특수 효과들은 원리상 비슷하다</div></div><div class=\"rc\"><div class=\"e\">to 3-D art, motion pictures, or visual illusions,</div><div class=\"k\">3-D 아트, 모션 픽처, 또는 착시와,</div></div><div class=\"rc\"><div class=\"e\">none of which have been around</div><div class=\"k\">그것들(= 3-D 아트, 모션 픽처, 착시) 중 어느 것도 (우리) 주변에 있지 않았다</div></div><div class=\"rc\"><div class=\"e\">long enough</div><div class=\"k\">충분히 오랫동안</div></div><div class=\"rc\"><div class=\"e\">for our brains to have evolved special mechanisms</div><div class=\"k\">우리의 뇌가 특수한 기제를 진화시켰을 만큼</div></div><div class=\"rc\"><div class=\"e\">to perceive them.</div><div class=\"k\">그것들(= 3-D 아트, 모션 픽처, 착시)을 인식할.</div></div><div class=\"rnat\">이 특수 효과들은 3차원 미술, 영화, 혹은 시각적 착시와 원리상 유사한데, 이것들 중 어느 것도 우리의 뇌가 그것들을 지각하기 위한 특별한 기제를 진화시킬 만큼 충분히 오랫동안 존재하지 않았다.</div><div class=\"rst\">이건 3D 그림·영화·착시와 비슷해요. 이 중 어느 것도 뇌가 따로 적응할 만큼 오래되지 않았어요. 앞 명사들을 받는 <b>none of which</b>(그것들 중 어느 것도)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Rather,</div><div class=\"k\">오히려,</div></div><div class=\"rc\"><div class=\"e\">3-D art, motion pictures, and visual illusions</div><div class=\"k\">3-D 아트, 모션 픽처, 그리고 착시는</div></div><div class=\"rc\"><div class=\"e\">leverage perceptual systems</div><div class=\"k\">지각 체계를 이용한다</div></div><div class=\"rc\"><div class=\"e\">that are in place</div><div class=\"k\">자리하고 있는</div></div><div class=\"rc\"><div class=\"e\">to accomplish other things.</div><div class=\"k\">다른 일들을 해내기 위해서.</div></div><div class=\"rnat\">오히려, 3차원 미술, 영화, 그리고 시각적 착시는 다른 일들을 이루기 위해 갖추어진 지각 체계를 이용한다.</div><div class=\"rst\"><b>오히려</b>(Rather) 이것들은 원래 다른 일을 하려고 있던 지각 체계를 빌려 써요. 앞 명사 perceptual systems(지각 체계들)가 복수라서 are(~이다)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Because they use</div><div class=\"k\">그것들(= 3-D 아트, 모션 픽처, 착시)이 사용하기 때문에</div></div><div class=\"rc\"><div class=\"e\">these neural circuits</div><div class=\"k\">이 신경 회로들을</div></div><div class=\"rc\"><div class=\"e\">in novel ways,</div><div class=\"k\">새로운 방식으로,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">we find them</span></div><div class=\"k\">우리는 그것들(= 3-D 아트, 모션 픽처, 착시)을 <span class=\"cw\">~라고 여긴다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">especially interesting</span>.</div><div class=\"k\"><span class=\"cw\">특히 흥미롭다고</span>. ※ 문제지엔 interested로 되어 있음</div></div><div class=\"rnat\">그것들이 이 신경 회로들을 새로운 방식으로 사용하기 때문에, 우리는 그것들이 특히 흥미롭다고 여긴다.</div><div class=\"rst\">그 회로를 새롭게 쓰니까 우리는 그것들이 특히 <b>흥미롭다고</b> 느껴요. 흥미를 주는 쪽이라 interesting(흥미로운)이 맞아요. 여기가 정답 자리예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The same is true of</div><div class=\"k\">~에서도 마찬가지이다</div></div><div class=\"rc\"><div class=\"e\">the way that modern recordings are made.</div><div class=\"k\">현대 녹음이 만들어지는 방식.</div></div><div class=\"rnat\">현대 녹음이 만들어지는 방식도 마찬가지이다.</div><div class=\"rst\">요즘 녹음이 만들어지는 방식도 마찬가지예요. the way(방식) 뒤에 완전한 절이 와서 that(~하는)을 썼어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"attracted to\" data-m=\"~에 끌리는\"><b>attracted to</b>~에 끌리는</button><button type=\"button\" class=\"wdb\" data-w=\"exploit\" data-m=\"활용하다, 이용하다\"><b>exploit</b>활용하다, 이용하다</button><button type=\"button\" class=\"wdb\" data-w=\"neural circuit\" data-m=\"신경 회로\"><b>neural circuit</b>신경 회로</button><button type=\"button\" class=\"wdb\" data-w=\"discern\" data-m=\"식별하다, 분간하다\"><b>discern</b>식별하다, 분간하다</button><button type=\"button\" class=\"wdb\" data-w=\"perceive\" data-m=\"지각하다, 인식하다\"><b>perceive</b>지각하다, 인식하다</button><button type=\"button\" class=\"wdb\" data-w=\"leverage\" data-m=\"이용하다, 활용하다\"><b>leverage</b>이용하다, 활용하다</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞에 <b>not</b>(~않다)이 있어요. 그러니 아이들이 놀이에서 <b>배우는 것의 반대말</b>을 찾으세요. 2~5번에 계속 나오는 <b>control</b>(통제력)의 반대가 정답이에요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">Free play is nature's means of teaching children that they are <mark>not</mark> <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">자유 놀이는 아이들에게 그들이 ( ? )하지 <mark>않다</mark>는 것을 가르치는 자연의 수단이다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 바로 뒤에서 놀이 속 아이들이 어떤지 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">In play, away from adults, children <mark>really do have control</mark> and can practice asserting it.</div><p class=\"ko\">놀이에서, 어른들과 떨어져, 아이들은 <mark>정말로 통제력을 가지고</mark> 그것(= 통제력)을 행사하는 것을 연습할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>스스로 결정하고 문제를 해결하기</span><span><em>4번</em>몸과 두려움을 통제하는 법 배우기</span><span><em>5번</em>협상하고 분노를 다스리기</span></div><div class=\"ck-eq\">⇒ 세 놀이의 공통점 = 아이 스스로 해낼 힘이 있음 → 무력하지 않음</div></div><div class=\"ck-via\"><i>▼</i><span>세 놀이 중 하나에서 control(통제하다)이 또 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · control(통제) 한 번 더</span><div class=\"en\">they thereby learn <mark>how to control</mark> not only their bodies, but also their fear.</div><p class=\"ko\">그렇게 함으로써 그들은 신체뿐만 아니라 두려움 또한 <mark>통제하는 방법을</mark> 배운다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">helpless 무력한<small>have control(통제력을 가지다)의 반대말이라 not helpless(무력하지 않은)가 돼요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">sociable 사교적인</span><span class=\"why\">5번 사회적 놀이 장면에서 끌려오는 함정이에요. not(~않다)이 붙으면 “사교적이지 않다고 가르친다”가 되어 5번의 친구와 협상하는 법과 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">noisy 시끄러운</span><span class=\"why\">시끄러움은 지문에 한 번도 안 나와요. 2~5번은 소리가 아니라 통제력(control) 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">complicated 복잡한</span><span class=\"why\">아이가 복잡한지 단순한지는 지문의 화제가 아니에요. 2번은 아이들이 정말로 통제력을 가진다는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">selective 선택적인</span><span class=\"why\">3번 make their own decisions(스스로 결정을 내리다)와 비슷해 보여도, not(~않다)이 붙으면 “스스로 고르지 않는다”가 되어 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Free play is nature's means</div><div class=\"k\">자유 놀이는 자연의 수단이다</div></div><div class=\"rc\"><div class=\"e\">of teaching children</div><div class=\"k\">아이들에게 가르치는</div></div><div class=\"rc ckc\"><div class=\"e\">that they are not <span class=\"cw\">helpless</span>.</div><div class=\"k\">그들(= 아이들)이 <span class=\"cw\">무력하지</span> 않다는 것을. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">자유 놀이는 아이들에게 자신이 무력하지 않다는 것을 가르치는 자연의 수단이다.</div><div class=\"rst\">쉬는 시간에 친구들끼리 노는 건, 아이들에게 “너 혼자서도 할 수 있어”를 알려 주는 시간이에요. = 지문 1번, 아이들이 <b>무력하지 않다</b>는 것을 가르쳐요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">In play,</div><div class=\"k\">놀이에서,</div></div><div class=\"rc\"><div class=\"e\">away from adults,</div><div class=\"k\">어른들과 떨어져,</div></div><div class=\"rc ckc\"><div class=\"e\">children <span class=\"cw\">really do have control</span></div><div class=\"k\">아이들은 <span class=\"cw\">정말로 통제력을 가지고</span></div></div><div class=\"rc\"><div class=\"e\">and can practice asserting it.</div><div class=\"k\">그것(= 통제력)을 행사하는 것을 연습할 수 있다.</div></div><div class=\"rnat\">놀이에서 아이들은 어른들과 떨어져 정말로 통제력을 가지고 그것을 행사하는 것을 연습할 수 있다.</div><div class=\"rst\">어른이 없는 운동장에서는 아이들이 진짜 대장이에요. = 지문 2번, 아이들이 <b>정말로 통제력을 가지고</b>(really do have control) 그걸 써 봐요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In free play,</div><div class=\"k\">자유 놀이에서,</div></div><div class=\"rc\"><div class=\"e\">children learn</div><div class=\"k\">아이들은 배운다</div></div><div class=\"rc\"><div class=\"e\">to make their own decisions,</div><div class=\"k\">스스로 결정을 내리고,</div></div><div class=\"rc\"><div class=\"e\">solve their own problems,</div><div class=\"k\">자신의 문제를 해결하고,</div></div><div class=\"rc\"><div class=\"e\">create and follow rules,</div><div class=\"k\">규칙을 만들고 따르며,</div></div><div class=\"rc\"><div class=\"e\">and get along with others</div><div class=\"k\">그리고 다른 사람들과 어울리는 것을</div></div><div class=\"rc\"><div class=\"e\">as equals</div><div class=\"k\">동등한 사람으로서</div></div><div class=\"rc\"><div class=\"e\">rather than as obedient or rebellious subordinates.</div><div class=\"k\">복종적이거나 반항적인 부하로서보다는.</div></div><div class=\"rnat\">자유 놀이를 통해 아이들은 스스로 결정을 내리고, 자신만의 문제를 해결하고, 규칙을 만들고 따르며, 복종적이거나 반항적인 부하로서보다는 동등한 사람으로서 다른 사람들과 어울리는 것을 배운다.</div><div class=\"rst\">피구 편 나누기도, 규칙 정하기도, 싸움 해결도 아이들끼리 해요. = 지문 3번, 스스로 결정하고 친구와 동등하게 어울리는 법이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">In active outdoor play,</div><div class=\"k\">활동적인 야외 놀이에서,</div></div><div class=\"rc\"><div class=\"e\">children deliberately dose themselves</div><div class=\"k\">아이들은 의도적으로 스스로에게 준다</div></div><div class=\"rc\"><div class=\"e\">with moderate amounts of fear</div><div class=\"k\">적정량의 두려움을</div></div><div class=\"rc\"><div class=\"e\">and they thereby learn</div><div class=\"k\">그리고 그렇게 함으로써 그들은 배운다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">how to control</span></div><div class=\"k\"><span class=\"cw\">통제하는 방법을</span></div></div><div class=\"rc\"><div class=\"e\">not only their bodies,</div><div class=\"k\">그들의 신체뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">but also their fear.</div><div class=\"k\">두려움 또한.</div></div><div class=\"rnat\">활동적인 야외 놀이에서 아이들은 의도적으로 스스로에게 적정량의 두려움을 주고, 그렇게 함으로써 그들의 신체뿐만 아니라 두려움 또한 통제하는 방법을 배운다.</div><div class=\"rst\">정글짐 꼭대기에 일부러 올라가 살짝 무서움을 느껴 봐요. 지문 4번처럼 몸도 두려움도 <b>통제하는 방법</b>(how to control)을 배워요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In social play</div><div class=\"k\">사회적 놀이에서</div></div><div class=\"rc\"><div class=\"e\">children learn</div><div class=\"k\">아이들은 배운다</div></div><div class=\"rc\"><div class=\"e\">how to negotiate with others,</div><div class=\"k\">다른 사람들과 어떻게 협상하는지,</div></div><div class=\"rc\"><div class=\"e\">how to please others,</div><div class=\"k\">다른 사람들을 어떻게 기쁘게 하는지,</div></div><div class=\"rc\"><div class=\"e\">and how to manage and overcome</div><div class=\"k\">그리고 어떻게 다스리고 극복하는지를</div></div><div class=\"rc\"><div class=\"e\">the anger that can arise from conflicts.</div><div class=\"k\">갈등으로부터 생길 수 있는 분노를.</div></div><div class=\"rnat\">사회적 놀이에서 아이들은 어떻게 다른 사람들과 협상하는지, 어떻게 다른 사람들을 기쁘게 하는지, 그리고 어떻게 갈등으로부터 생길 수 있는 분노를 다스리고 극복하는지를 배운다.</div><div class=\"rst\">편이 안 맞아 화가 나도 말로 풀고 서로 기분을 맞춰 줘요. = 지문 5번, 협상하고 분노를 다스리는 법이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">None of these lessons</div><div class=\"k\">이러한 교훈들 중 어느 것도</div></div><div class=\"rc\"><div class=\"e\">can be taught</div><div class=\"k\">가르쳐질 수 없다</div></div><div class=\"rc\"><div class=\"e\">through verbal means;</div><div class=\"k\">언어적 수단을 통해서는;</div></div><div class=\"rc\"><div class=\"e\">they can be learned</div><div class=\"k\">그것들(= 교훈들)은 배워질 수 있다</div></div><div class=\"rc\"><div class=\"e\">only through experience,</div><div class=\"k\">오직 경험을 통해서만,</div></div><div class=\"rc\"><div class=\"e\">which free play provides.</div><div class=\"k\">그것(= 경험)은 자유 놀이가 제공하는 것이다.</div></div><div class=\"rnat\">이러한 교훈들 중 어느 것도 언어적 수단을 통해서는 배울 수 없고, 그것들은 오로지 경험을 통해서만 배울 수 있는데, 그것(경험)은 자유 놀이가 제공하는 것이다.</div><div class=\"rst\">이런 건 선생님 말씀만으로는 못 배우고 직접 놀아 봐야 알아요. = 지문 6번, 교훈은 말이 아니라 자유 놀이가 주는 <b>경험</b>으로만 배워요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"free play\" data-m=\"자유 놀이\"><b>free play</b>자유 놀이</button><button type=\"button\" class=\"wdb\" data-w=\"asserting\" data-m=\"행사하는 것 (assert 내세우다, 행사하다)\"><b>asserting</b>행사하는 것 (assert 내세우다, 행사하다)</button><button type=\"button\" class=\"wdb\" data-w=\"obedient\" data-m=\"순종적인\"><b>obedient</b>순종적인</button><button type=\"button\" class=\"wdb\" data-w=\"subordinates\" data-m=\"하급자들, 부하들 (subordinate 부하)\"><b>subordinates</b>하급자들, 부하들 (subordinate 부하)</button><button type=\"button\" class=\"wdb\" data-w=\"deliberately\" data-m=\"의도적으로\"><b>deliberately</b>의도적으로</button><button type=\"button\" class=\"wdb\" data-w=\"negotiate\" data-m=\"협상하다\"><b>negotiate</b>협상하다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 실험 장면이에요. 뒤의 6번이 <b>더 멀리 앞에서 멈춘 차</b>(the car which stopped further ahead)를 말하니, 두 차의 <b>멈춘 자리가 달라야</b> 해요. 같은 자리에서 멈추는 선택지는 모두 탈락이에요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (2번)</span><div class=\"en\">two toy cars were shown <mark>running synchronously</mark> on parallel tracks, <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">장난감 자동차 두 대가 평행한 트랙 위에서 <mark>동시에 달리는 모습으로</mark> 제시되었다, ( ? )</p></div><div class=\"ck-via\"><i>▼</i><span>아이들은 시간을 거리로 판단한다는 규칙을 알려 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 아이들의 착각 규칙</span><div class=\"en\">stopping times by stopping points and <mark>durations by distance</mark>,</div><p class=\"ko\">정지 시간은 정지 지점에 의해, 그리고 <mark>지속 시간은 거리에 의해</mark> (판단되지만),</p></div><div class=\"ck-via\"><i>▼</i><span>실험 결과: 더 멀리 간 차가 더 오래 달렸다고 착각해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">and that <mark>the car which stopped further ahead</mark>, ran for more time (incorrect).</div><p class=\"ko\">그리고 <mark>더 멀리 앞에서 멈춘 자동차가</mark> 더 오랜 시간 동안 달렸다고 (틀림).</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>조건 1</em>같이 출발해서 같이 멈춤 = 2번 동시에(synchronously)</span><span><em>조건 2</em>한 대는 더 멀리서 멈춤 = 6번 더 멀리 앞에서(further ahead)</span></div><div class=\"ck-eq\">⇒ 같은 시간에 더 멀리 가려면 → 한 대가 더 빨리 달려야 해요</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">one running faster and stopping further down the track 한 대는 더 빨리 달려 트랙의 더 먼 곳에서 멈춤<small>6번 stopped further ahead(더 멀리 앞에서 멈췄다)와 딱 맞는 실험 장면이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">both stopping at the same point further than expected 둘 다 예상보다 먼 같은 지점에서 멈춤</span><span class=\"why\">further(더 멀리)라는 말에 끌리는 함정이에요. 하지만 같은 지점에서 멈추면 6번의 “더 멀리 앞에서 멈춘 차”가 생길 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">one keeping the same speed as the other to the end 한 대가 끝까지 다른 차와 같은 속도를 유지함</span><span class=\"why\">같은 시간에 같은 속도로 달리면 같은 거리에서 멈춰요. 그러면 6번처럼 더 멀리 간 차가 없어서 아이들이 착각할 거리가 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">both alternating their speed but arriving at the same end 둘 다 속도를 바꿨지만 같은 끝에 도착함</span><span class=\"why\">같은 끝에 도착하면 거리가 같아요. 5번 durations by distance(지속 시간은 거리로) 착각이 일어나려면 거리가 달라야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">both slowing their speed and reaching the identical spot 둘 다 속도를 줄여 똑같은 지점에 도달함</span><span class=\"why\">똑같은 지점(the identical spot)이면 멈춘 자리가 같아요. 6번의 further ahead(더 멀리 앞에서)와 어긋나요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The Swiss psychologist Jean Piaget</div><div class=\"k\">스위스의 심리학자 Jean Piaget는</div></div><div class=\"rc\"><div class=\"e\">frequently analyzed</div><div class=\"k\">자주 분석했다</div></div><div class=\"rc\"><div class=\"e\">children's conception of time</div><div class=\"k\">아이들의 시간 개념을</div></div><div class=\"rc\"><div class=\"e\">via their ability</div><div class=\"k\">그들(= 아이들)의 능력을 통해서</div></div><div class=\"rc\"><div class=\"e\">to compare or estimate</div><div class=\"k\">비교하거나 추정하는</div></div><div class=\"rc\"><div class=\"e\">the time taken by pairs of events.</div><div class=\"k\">짝지어진 사건들에 의해 소요된 시간을.</div></div><div class=\"rnat\">스위스의 심리학자 Jean Piaget(장 피아제)는 짝지어진 사건들에 의해 소요된 시간을 비교하거나 추정하는 그들(아이들)의 능력을 통해서 아이들의 시간 개념을 자주 분석했다.</div><div class=\"rst\">유명한 심리학자가 아이들에게 “어느 게 더 오래 걸렸어?”를 물어보며 시간 감각을 살펴봤어요. = 지문 1번, 두 사건의 시간을 비교하게 했어요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">In a typical experiment,</div><div class=\"k\">한 대표적인 실험에서,</div></div><div class=\"rc\"><div class=\"e\">two toy cars were shown</div><div class=\"k\">장난감 자동차 두 대가 (아이들에게) 제시되었다</div></div><div class=\"rc\"><div class=\"e\">running synchronously</div><div class=\"k\">동시에 달리는 모습으로</div></div><div class=\"rc\"><div class=\"e\">on parallel tracks,</div><div class=\"k\">평행한 트랙 위에서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">one running faster</span></div><div class=\"k\"><span class=\"cw\">한 대는 더 빨리 달렸고</span></div></div><div class=\"rc\"><div class=\"e\">and stopping further down the track.</div><div class=\"k\">트랙의 더 먼 곳에서 정지했다. ※ 문제지엔 one running faster부터 이 부분까지 전체가 빈칸으로 되어 있음</div></div><div class=\"rnat\">한 대표적인 실험에서는 평행한 트랙에서 같은 시간에(동시에) 달리는 장난감 자동차 두 대가 (아이들에게) 제시되었는데, 한 대가 더 빨리 달렸으며 (다른 한 대보다) 트랙의 더 먼 곳에서 정지했다.</div><div class=\"rst\">장난감 자동차 두 대를 <b>동시에 출발시켜 동시에 멈추게</b> 했는데, 한 대가 더 빨라서 더 멀리 가서 섰어요. 이게 지문 2번의 빈칸 장면이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The children were then asked</div><div class=\"k\">그 다음에 아이들은 요구받았다</div></div><div class=\"rc\"><div class=\"e\">to judge whether the cars had run</div><div class=\"k\">그 자동차들이 달렸는지를 판단하도록</div></div><div class=\"rc\"><div class=\"e\">for the same time</div><div class=\"k\">같은 시간 동안</div></div><div class=\"rc\"><div class=\"e\">and to justify their judgment.</div><div class=\"k\">그리고 그들(= 아이들)의 판단이 옳다는 근거를 보이도록.</div></div><div class=\"rnat\">그 다음에 아이들은 그 자동차들이 같은 시간 동안 달렸는지를 판단하고, 그들의 판단이 옳다는 근거를 보이라는 요구를 받았다.</div><div class=\"rst\">그리고 아이에게 “두 차가 같은 시간 동안 달렸니? 왜 그렇게 생각해?” 하고 물었어요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Preschoolers and young school-age children</div><div class=\"k\">미취학 아동들과 어린 학령기 아동들은</div></div><div class=\"rc\"><div class=\"e\">confuse</div><div class=\"k\">혼동한다</div></div><div class=\"rc\"><div class=\"e\">temporal and spatial dimensions:</div><div class=\"k\">시간 차원과 공간 차원을:</div></div><div class=\"rnat\">미취학 아동들과 어린 학령기 아동들은 시간(차원)과 공간 차원을 혼동한다.</div><div class=\"rst\">어린아이들은 ‘얼마나 오래’와 ‘얼마나 멀리’를 헷갈려요. = 지문 4번, 시간과 공간을 혼동한다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Starting times are judged by starting points,</div><div class=\"k\">출발 시간은 출발 지점에 의해 판단되고,</div></div><div class=\"rc\"><div class=\"e\">stopping times by stopping points</div><div class=\"k\">정지 시간은 정지 지점에 의해,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">durations by distance</span>,</div><div class=\"k\">그리고 <span class=\"cw\">지속 시간은 거리에 의해</span> (판단되지만),</div></div><div class=\"rc\"><div class=\"e\">though each of these errors</div><div class=\"k\">비록 이러한 각각의 오류들이</div></div><div class=\"rc\"><div class=\"e\">does not necessitate the others.</div><div class=\"k\">나머지(= 다른 오류들)를 필연적으로 동반하지는 않는다.</div></div><div class=\"rnat\">출발 시간은 출발 지점에 의해, 정지 시간은 정지 지점에 의해, 그리고 지속 시간(달린 시간)은 거리에 의해 판단되지만, 이러한 각각의 오류들이 나머지(다른 오류들)를 필연적으로 동반하지는 않는다.</div><div class=\"rst\">그래서 아이 눈에는 <b>멀리 간 차 = 오래 달린 차</b>예요. = 지문 5번 durations by distance(지속 시간은 거리에 의해)예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Hence,</div><div class=\"k\">이런 이유로,</div></div><div class=\"rc\"><div class=\"e\">a child may claim</div><div class=\"k\">어떤 아이는 주장할지도 모른다</div></div><div class=\"rc\"><div class=\"e\">that the cars started and stopped running together (correct)</div><div class=\"k\">자동차들이 동시에 달리기 시작했고 동시에 멈추었다고 (옳음),</div></div><div class=\"rc ckc\"><div class=\"e\">and that <span class=\"cw\">the car which stopped further ahead</span>,</div><div class=\"k\">그리고 <span class=\"cw\">더 멀리 앞에서 멈춘 자동차가</span></div></div><div class=\"rc\"><div class=\"e\">ran for more time (incorrect).</div><div class=\"k\">더 오랜 시간 동안 달렸다고 (틀림).</div></div><div class=\"rnat\">이런 이유로, 어떤 아이는 자동차들이 동시에 달리기 시작했고 동시에 멈추었다고 (옳음), 그리고 더 멀리 앞에서 멈춘 자동차가 더 오랜 시간 동안 달렸다고 (틀림) 주장할지도 모른다.</div><div class=\"rst\">아이는 “같이 출발하고 같이 멈췄어”는 맞히지만, “멀리 간 차가 더 오래 달렸어”는 틀려요. 그래서 빈칸엔 한 대가 더 멀리 가서 멈춘 장면이 와요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"conception of time\" data-m=\"시간 개념\"><b>conception of time</b>시간 개념</button><button type=\"button\" class=\"wdb\" data-w=\"synchronously\" data-m=\"같은 시간에, 동시에\"><b>synchronously</b>같은 시간에, 동시에</button><button type=\"button\" class=\"wdb\" data-w=\"justify\" data-m=\"정당화하다, 근거를 보이다\"><b>justify</b>정당화하다, 근거를 보이다</button><button type=\"button\" class=\"wdb\" data-w=\"temporal\" data-m=\"시간의\"><b>temporal</b>시간의</button><button type=\"button\" class=\"wdb\" data-w=\"spatial\" data-m=\"공간의\"><b>spatial</b>공간의</button><button type=\"button\" class=\"wdb\" data-w=\"duration\" data-m=\"지속 시간\"><b>duration</b>지속 시간</button></div>"};

function qHtml(i,a){

  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}

  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
