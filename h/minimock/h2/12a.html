<title>고2 미니모의고사 12회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

var D=[{"no": "01", "typ": "주장", "src": "2021년 11월 20번", "evn": [4, 5, 6, 7], "ev_en": "Merely because it became a scarce resource, the demand for it increased. / If you are interested in persuading people, then the principle of scarcity can be effectively used. / If you are a salesperson trying to increase the sales of a certain product, then you must not merely point out the benefits the customer can derive from the said product, but also point out its uniqueness and what they will miss out on if they don't purchase the product soon. / In selling, you should keep in mind that the more limited something is, the more desirable it becomes.", "ev_ko": [[4, "단지 그것이 부족한 자원이 되었기 때문에, 그것에 대한 수요가 증가했다."], [5, "만약 여러분이 사람들을 설득하는 데 관심이 있다면, 희소성의 원리가 효과적으로 사용될 수 있다."], [6, "만약 여러분이 특정 상품의 판매를 늘리려고 애쓰는 판매원이라면, 여러분은 단지 고객이 그 상품으로부터 얻을 수 있는 혜택을 지적하는 것뿐 아니라, 그 상품의 고유함과 만약 그들이 상품을 곧 구매하지 않으면 놓치게 될 것도 강조해야 한다."], [7, "판매에 있어서 여러분은 무언가가 한정적일수록 그것이 더 가치 있게 된다는 것을 명심해야 한다."]], "why": ["4번은 항공편이 <b>부족한 자원<\/b>이 되자 수요가 늘었다는 사례이고, 5번은 사람을 설득할 때 <b>희소성의 원리<\/b>를 효과적으로 쓸 수 있다고 정리합니다", "6번은 판매원이 상품의 혜택만이 아니라 <b>고유함<\/b>과 <b>곧 사지 않으면 놓치게 될 것<\/b>을 강조해야 한다고 말합니다", "7번은 무언가가 <b>한정적일수록 더 가치 있게 된다<\/b>고 정리합니다", "이 문장들을 합치면 글쓴이의 주장은 '효과적으로 팔려면 상품의 <b>희소성<\/b>을 강조하라'입니다."], "ch": [{"n": "①", "t": "상품 판매 시 실현 가능한 판매 목표를 설정해야 한다.", "g": "", "ok": false, "e": ["판매 목표를 세우라는 말은 본문에 없습니다", "본문이 강조하는 것은 목표 설정이 아니라 상품의 희소성입니다."]}, {"n": "②", "t": "판매를 촉진하기 위해서는 가격 경쟁력을 갖추어야 한다.", "g": "", "ok": false, "e": ["가격이나 가격 경쟁력에 대한 언급은 본문에 없습니다", "판매가 늘어난 이유는 가격이 아니라 그 항공편이 귀해졌기(부족한 자원이 되었기) 때문입니다(4번)."]}, {"n": "③", "t": "효과적인 판매를 위해서는 상품의 희소성을 강조해야 한다.", "g": "", "ok": true, "e": ["6번에서 상품의 고유함과 놓치게 될 것을 강조하라고 했고, 7번에서 한정적일수록 가치 있게 된다고 했습니다", "둘 다 희소성을 강조하라는 내용이므로 정답입니다."]}, {"n": "④", "t": "고객의 신뢰를 얻기 위해서는 일관된 태도를 유지해야 한다.", "g": "", "ok": false, "e": ["고객의 신뢰나 일관된 태도에 대한 내용은 본문에 없습니다."]}, {"n": "⑤", "t": "고객의 특성에 맞춰 다양한 판매 전략을 수립하고 적용해야 한다.", "g": "", "ok": false, "e": ["고객 특성에 따라 전략을 달리하라는 말은 본문에 없습니다", "본문은 희소성이라는 하나의 원리를 이야기합니다."]}], "tr": ["2003년, 영국 항공은 경제성이 없는 것으로 드러나기 시작했기 때문에 런던-뉴욕 간 콩코드 항공편을 더 이상 하루에 두 번 운항할 수 없을 것이라고 발표했다.", "그런데 다음 날 바로 노선의 항공편 판매량이 증가했다.", "그 노선이나 항공사가 제공하는 서비스에 있어 달라진 것은 아무것도 없었다.", "단지 그것이 부족한 자원이 되었기 때문에, 그것에 대한 수요가 증가했다.", "만약 여러분이 사람들을 설득하는 데 관심이 있다면, 희소성의 원리가 효과적으로 사용될 수 있다.", "만약 여러분이 특정 상품의 판매를 늘리려고 애쓰는 판매원이라면, 여러분은 단지 고객이 그 상품으로부터 얻을 수 있는 혜택을 지적하는 것뿐 아니라, 그 상품의 고유함과 만약 그들이 상품을 곧 구매하지 않으면 놓치게 될 것도 강조해야 한다.", "판매에 있어서 여러분은 무언가가 한정적일수록 그것이 더 가치 있게 된다는 것을 명심해야 한다."], "ps": [{"n": 1, "ch": [{"e": "In 2003,", "k": "<b>2003년에<\/b>,"}, {"e": "British Airways made an announcement", "k": "영국 항공은 <b>발표했다<\/b>"}, {"e": "that they would no longer be able", "k": "그들<span class=\"r\">(= 영국 항공)<\/span>이 <b>더 이상 ~할 수 없을 것이라고<\/b>"}, {"e": "to operate the London to New York Concorde flight", "k": "런던에서 뉴욕까지 가는 콩코드 항공편을 운항할"}, {"e": "twice a day", "k": "하루에 두 번"}, {"e": "because it was starting to prove uneconomical.", "k": "그것<span class=\"r\">(= 그 항공편)<\/span>이 <b>경제성이 없는 것으로 드러나기<\/b> 시작하고 있었기 때문에."}], "link": "영국 항공은 그 항공편이 경제성이 없는 것으로 드러나기 시작했기 때문에, 런던-뉴욕 콩코드 항공편을 하루에 두 번 더 이상 운항할 수 없을 것이라고 발표했다.", "easy": "2003년에 영국 항공이 '돈이 안 돼서 콩코드 항공편을 하루에 두 번은 더 못 띄운다'고 발표했어요.", "gist": "이야기의 시작이에요. 콩코드 항공편에 대한 발표가 사례로 나와요."}, {"n": 2, "ch": [{"e": "Well,", "k": "그런데,"}, {"e": "the sales for the flight on this route", "k": "이 노선의 항공편 <b>판매량이<\/b>"}, {"e": "increased the very next day.", "k": "<b>바로 다음 날 증가했다<\/b>."}], "easy": "그런데 바로 다음 날 그 노선의 표는 오히려 더 많이 팔렸어요.", "gist": "예상과 반대되는 결과가 나와요. 운항이 줄어든다고 했는데 판매는 늘었어요."}, {"n": 3, "ch": [{"e": "There was nothing", "k": "<b>아무것도 없었다<\/b>"}, {"e": "that changed", "k": "바뀐 것이"}, {"e": "about the route or the service", "k": "그 노선이나 서비스에 대해"}, {"e": "offered by the airlines.", "k": "항공사가 제공하는."}], "easy": "노선도, 항공사가 제공하는 서비스도 달라진 건 하나도 없었어요.", "gist": "표가 더 팔린 이유가 노선이나 서비스 때문이 아니라는 걸 확인해 줘요."}, {"n": 4, "ch": [{"e": "Merely because it became", "k": "단지 그것<span class=\"r\">(= 그 항공편)<\/span>이 ~이 되었기 때문에"}, {"e": "a scarc     `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

: "녹음 기술자들과 음악가들은 특수 효과를 만들어내는 법을 배웠다 / 우리의 뇌를 자극하는 / 신경 회로를 활용함으로써 / 우리의 청각 환경의 중요한 특징들을 식별하도록 진화한", "nat": "녹음 기술자들과 음악가들은 우리의 청각 환경에서 중요한 특징을 식별하도록 진화한 신경 회로를 활용해, 우리의 뇌를 자극하는 특수 효과를 만들어내는 법을 배웠다.", "ana": "<b>have learned</b>는 <b>현재완료</b>이며, 문장 안에 <b>that tickle ~</b>과 <b>that evolved ~</b> 두 개의 <b>주격 관계대명사절</b>이 각각 special effects와 neural circuits를 수식한다.", "pe": "\u0001Recording\u0002 engineers and musicians have learned to create \u0001special\u0002 effects / \u0001that tickle our brains\u0002 / \u0001by exploiting<sup>1</sup> neural circuits<sup>2</sup>\u0002 / \u0001that evolved to discern<sup>3</sup> important features of our auditory environment<sup>4</sup>\u0002.", "pk": "\u0001녹음\u0002 기술자들과 음악가들은 \u0001특수\u0002 효과를 만들어내는 법을 배웠다 / \u0001우리의 뇌를 자극하는\u0002 / \u0001신경 회로를 활용함으로써\u0002 / \u0001우리의 청각 환경의 중요한 특징들을 식별하도록 진화한\u0002", "core": "엔지니어들과 음악가들은 효과를 만들어내는 법을 배웠다.", "tags": ["주어 engineers and musicians (Recording = 현재분사: engineers를 꾸밈) + 동사 <b>have learned</b> (현재완료) + 목적어 to create effects. special = 형용사: effects를 꾸밈", "that ~ = 관계절(형용사절): effects를 꾸밈 (주격 관계대명사)", "by + 동명사 = 전치사구(부사구): create를 꾸밈 (수단)", "that ~ = 관계절(형용사절): circuits를 꾸밈 (주격). evolved to discern ~ (식별하도록 진화한)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 관계절 두 개와 by 전치사구가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Recording engineers and musicians (녹음 기술자들과 음악가들)", "V: have learned (learn 배우다의 현재완료)", "O: to create special effects (특수 효과를 만들어내는 것)", "뼈대 = <b>Recording engineers and musicians have learned to create special effects</b>"]}, {"t": "Recording은 현재분사지만 engineers 앞에 붙어 '녹음 기술자'라는 한 덩어리로 읽는다. (recording 녹음, engineer 기술자)"}, {"t": "<b>that tickle our brains</b>는 effects를 꾸미는 주격 관계절이다.", "sub": ["tickle 자극하다, 간지럽히다. brain 뇌"]}, {"t": "<b>by exploiting neural circuits</b>는 전치사구(부사구)이다. create를 꾸미며 수단을 말한다. 전치사 by 뒤의 exploiting은 동명사이다.", "sub": ["exploit 활용하다, neural circuits 신경 회로"]}, {"t": "<b>that evolved to discern important features of our auditory environment</b>는 circuits를 꾸미는 주격 관계절이다.", "sub": ["evolve 진화하다의 과거형 evolved", "to discern = 식별하도록 (to부정사 부사적). discern 식별하다", "important features = 중요한 특징들. auditory environment = 청각 환경"]}], "sum": "녹음 기술자·음악가, 청각 환경을 식별하도록 진화한 신경 회로를 이용해 뇌를 자극하는 효과를 만듦"}, {"i": "07", "q": "05", "s": "3", "title": "S+V+O(to부정사 병렬) + as ~ rather than as ~", "eng": "In free play, / children learn to make their own decisions, solve their own problems, create and follow rules, and get along with others / as equals rather than as obedient<sup>1</sup> or rebellious<sup>2</sup> subordinates<sup>3</sup>.", "notes": [["1", "obedient", "순종적인"], ["2", "rebellious", "반항적인"], ["3", "subordinate", "하급자"]], "lit": "자유 놀이에서, / 아이들은 스스로 결정을 내리고, 스스로 문제를 해결하고, 규칙을 만들고 따르고, 그리고 다른 사람들과 잘 지내는 법을 배운다 / 순종적이거나 반항적인 하급자로서가 아니라 동등한 사람으로서", "nat": "자유 놀이에서 아이들은 순종적이거나 반항적인 하급자로서가 아니라 동등한 사람으로서, 스스로 결정을 내리고 문제를 해결하고 규칙을 만들고 따르며 다른 사람들과 잘 지내는 법을 배운다.", "ana": "learn to 뒤에 <b>make, solve, create and follow, get along with</b> 네 개의 동사구가 <b>병렬</b> 연결되어 있고, <b>rather than ~</b>은 '~라기보다는'이라는 비교 표현이다.", "pe": "\u0001In free play\u0002, / children learn to make their own decisions, solve their own problems, create and follow rules, and get along \u0001with others\u0002 / \u0001as equals rather than as obedient<sup>1</sup> or rebellious<sup>2</sup> subordinates<sup>3</sup>\u0002.", "pk": "\u0001자유 놀이에서\u0002, / 아이들은 스스로 결정을 내리고, 스스로 문제를 해결하고, 규칙을 만들고 따르고, 그리고 \u0001다른 사람들과\u0002 잘 지내는 법을 배운다 / \u0001순종적이거나 반항적인 하급자로서가 아니라 동등한 사람으로서\u0002", "core": "아이들은 결정을 내리고 문제를 해결하고 규칙을 만들고 따르고 어울리는 법을 배운다.", "tags": ["In free play = 전치사구(부사구): learn을 꾸밈 (장소·상황)", "주어 children + 동사 learn + 목적어 to부정사 4개 병렬. with others = 거의 필수에 가까운 부사구 (get along with): get along을 꾸밈 [기준: 문형 기준]", "as ~ rather than as ~ = 전치사구(부사구): learn을 꾸밈 (자격, ~라기보다는)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 to부정사가 여러 개 병렬이고 뒤에 비교 전치사구가 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: children (아이들)", "V: learn (learn 배우다)", "O: to V 네 개", "뼈대 = <b>children learn to V ~</b>", "In free play = 자유 놀이에서 (부사구)"]}, {"t": "to부정사 네 개의 덩어리는 다음과 같다.", "sub": ["① to make their own decisions = 스스로 결정을 내리는 법", "② (to) solve their own problems = 스스로 문제를 해결하는 법", "③ (to) create and follow rules = 규칙을 만들고 따르는 법 (create 만들다, follow 따르다)", "④ (to) get along with others = 다른 사람들과 잘 지내는 법 (get along with ~와 어울리다)"]}, {"t": "<b>as equals rather than as obedient or rebellious subordinates</b>는 전치사구(부사구)이다. learn을 꾸민다. '순종적이거나 반항적인 하급자로서가 아니라 동등한 사람으로서'라는 뜻이다.", "sub": ["equal 동등한 사람, obedient 순종적인, rebellious 반항적인, subordinate 하급자"]}, {"t": "함정: create and follow는 한 덩어리 ③이다. 동사 둘이 같은 목적어 rules를 가진다."}], "sum": "자유 놀이에서 아이들은 하급자가 아닌 동등한 사람으로서 결정·해결·규칙·어울림을 배움"}, {"i": "08", "q": "06", "s": "4", "title": "S+V+O(3형식) + 콜론 뒤 수동태 병렬 + though절", "eng": "Preschoolers and young school-age children confuse temporal<sup>1</sup> and spatial dimensions<sup>2</sup>: / Starting times are judged by starting points, stopping times by stopping points and durations by distance, / though each of these errors does not necessitate<sup>3</sup> the others.", "notes": [["1", "temporal", "시간의"], ["2", "spatial dimension", "공간적 차원"], ["3", "necessitate", "필요로 하다"]], "lit": "취학 전 아동과 어린 학령기 아동은 시간적 차원과 공간적 차원을 혼동한다: / 출발 시간은 출발점으로, 정지 시간은 정지점으로, 그리고 지속 시간은 거리로 판단된다, / 비록 이러한 오류들 각각이 다른 것들을 반드시 수반하지는 않지만", "nat": "취학 전 아동과 어린 학령기 아동은 시간적 차원과 공간적 차원을 혼동하는데, 이 오류들이 서로를 반드시 수반하지는 않지만, 출발 시간은 출발점으로, 정지 시간은 정지점으로, 지속 시간은 거리로 판단한다.", "ana": "<b>are judged by ~, (are judged) by ~, (are judged) by ~</b>는 <b>수동태</b>가 <b>병렬</b>로 반복된 구조이며, <b>though ~</b>는 <b>양보의 부사절</b>이다.", "pe": "Preschoolers and \u0001young school-age\u0002 children confuse \u0001temporal<sup>1</sup> and spatial\u0002 dimensions<sup>2</sup>: / Starting times are judged \u0001by starting points\u0002, stopping times \u0001by stopping points\u0002 and durations \u0001by distance\u0002, / \u0001though each of these errors does not necessitate<sup>3</sup> the others\u0002.", "pk": "취학 전 아동과 \u0001어린 학령기\u0002 아동은 \u0001시간적 차원과 공간적\u0002 차원을 혼동한다: / 출발 시간은 \u0001출발점으로\u0002, 정지 시간은 \u0001정지점으로\u0002, 그리고 지속 시간은 \u0001거리로\u0002 판단된다, / \u0001비록 이러한 오류들 각각이 다른 것들을 반드시 수반하지는 않지만\u0002", "core": "아동들은 차원들을 혼동한다. 출발 시간, 정지 시간, 지속 시간이 판단된다.", "tags": ["주어 Preschoolers and children + 동사 confuse + 목적어 dimensions. young school-age = 형용사: children을 꾸밈. temporal and spatial = 형용사: dimensions를 꾸밈", "주어 Starting times + 동사 <b>are judged</b> (수동태). by ~ = 전치사구(부사구): 판단 기준. 뒤 두 병렬도 are judged 생략, by 구가 각각 붙음", "though ~ = 양보 부사절: 앞 문장을 꾸밈 (비록 ~이지만)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 콜론 뒤 수동태 병렬과 생략, though절이 붙어 길어 보인다."}, {"t": "앞 절의 뼈대부터 찾는다.", "sub": ["S: Preschoolers and young school-age children (취학 전 아동과 어린 학령기 아동)", "V: confuse (confuse 혼동하다)", "O: temporal and spatial dimensions (시간적 차원과 공간적 차원)", "뼈대 = <b>Preschoolers and young children confuse dimensions</b>"]}, {"t": "콜론 뒤는 앞 내용을 구체적으로 설명한다. 수동태(1형식)가 병렬이다.", "sub": ["Starting times are judged by starting points = 출발 시간은 출발점으로 판단된다 (judge 판단하다)", "stopping times (are judged) by stopping points = 정지 시간은 정지점으로 (are judged 생략)", "and durations (are judged) by distance = 지속 시간은 거리로 (duration 지속 시간)"]}, {"t": "<b>though each of these errors does not necessitate the others</b>는 양보 부사절이다. '이 오류들이 서로를 반드시 수반하지는 않지만'이라는 뜻이다. (necessitate 반드시 수반하다, error 오류)"}, {"t": "함정: 두 번째, 세 번째 병렬 덩어리는 동사 are judged가 생략되어 있다. 'by ~' 부분만 남은 것이다."}], "sum": "어린 아동은 시간과 공간을 혼동해 시간을 점·거리로 판단하나 오류가 서로 따라오지는 않음"}], "qs": [{"q": "01", "type": "주장", "src": "2021년 11월 20번", "ans": "③", "tr": [["1", "2003년, 영국 항공은 경제성이 없는 것으로 드러나기 시작했기 때문에 런던-뉴욕 간 콩코드 항공편을 더 이상 하루에 두 번 운항할 수 없을 것이라고 발표했다."], ["2", "그런데 다음 날 바로 노선의 항공편 판매량이 증가했다."], ["3", "그 노선이나 항공사가 제공하는 서비스에 있어 달라진 것은 아무것도 없었다."], ["4", "단지 그것이 부족한 자원이 되었기 때문에, 그것에 대한 수요가 증가했다."], ["5", "만약 여러분이 사람들을 설득하는 데 관심이 있다면, 희소성의 원리가 효과적으로 사용될 수 있다."], ["6", "만약 여러분이 특정 상품의 판매를 늘리려고 애쓰는 판매원이라면, 여러분은 단지 고객이 그 상품으로부터 얻을 수 있는 혜택을 지적하는 것뿐 아니라, 그 상품의 고유함과 만약 그들이 상품을 곧 구매하지 않으면 놓치게 될 것도 강조해야 한다."], ["7", "판매에 있어서 여러분은 무언가가 한정적일수록 그것이 더 가치 있게 된다는 것을 명심해야 한다."]], "evh": "6·7번 문장", "ev": [{"en": true, "h": "If you are a salesperson trying to increase the sales of a certain product, then you must not merely point out the benefits the customer can derive from the said product, but also point out its uniqueness and what they will miss out on if they don't purchase the product soon. / In selling, you should keep in mind that the more limited something is, the more desirable it becomes."}, {"en": false, "h": "상품의 이점뿐 아니라 고유함과 희소성까지 강조해야 한다는 6번의 내용과, 한정적일수록 더 가치 있어진다는 7번의 결론을 종합하면, 이 글의 주장은 '효과적인 판매를 위해서는 상품의 희소성을 강조해야 한다'는 것이다."}], "opts": [{"n": "①", "t": "상품 판매 시 실현 가능한 판매 목표를 설정해야 한다.", "a": false, "x": true, "trap": false, "e": "판매 목표 설정에 관한 내용은 본문에 없다."}, {"n": "②", "t": "판매를 촉진하기 위해서는 가격 경쟁력을 갖추어야 한다.", "a": false, "x": true, "trap": false, "e": "가격 경쟁력(price)에 관한 언급은 전혀 없다."}, {"n": "③", "t": "효과적인 판매를 위해서는 상품의 희소성을 강조해야 한다.", "a": true, "x": false, "trap": false, "e": "상품의 고유함과 놓치게 될 것을 강조하라는 6번과, 한정적일수록 가치 있어진다는 7번의 내용과 정확히 일치한다."}, {"n": "④", "t": "고객의 신뢰를 얻기 위해서는 일관된 태도를 유지해야 한다.", "a": false, "x": true, "trap": true, "e": "신뢰나 일관된 태도에 관한 내용은 본문에 없다."}, {"n": "⑤", "t": "고객의 특성에 맞춰 다양한 판매 전략을 수립하고 적용해야 한다.", "a": false, "x": true, "trap": false, "e": "고객 특성별 전략 수립에 관한 내용은 본문에 없다."}], "w": [["uneconomical", "경제성이 없는, 비경제적인"], ["scarce resource", "희소 자원"], ["demand", "수요"], ["principle of scarcity", "희소성의 원리"], ["persuade", "설득하다"], ["point out", "지적하다, 가리키다"], ["uniqueness", "유일함, 고유성"], ["miss out on", "~을 놓치다"], ["keep in mind", "명심하다"], ["desirable", "가치 있는, 바람직한"]]}, {"q": "02", "type": "도표 불일치", "src": "2021년 6월 25번", "ans": "④", "tr": [["1", "위 표는 2014년과 2018년 전 세계 천연가스 생산 상위 7개 국가를 보여준다."], ["2", "①미국, 러시아, 이란은 2014년과 2018년 모두 상위 3개 천연가스 생산 국가였다."], ["3", "②2014년과 2018년 각각, 러시아와 이란 간의 천연가스 생산량 차이는 4000억 세제곱미터보다 더 컸다."], ["4", "③캐나다에서 생산된 천연가스 양은 증가했지만, 캐나다는 2014년보다 2018년에 더 낮은 순위를 기록했다."], ["5", "④2014년과 2018년 사이 중국의 천연가스 생산량의 증가는 카타르의 그것(천연가스 생산량의 증가)의 3배 이상이었다."], ["6", "⑤2014년 상 var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>must</b>(~해야 한다)·<b>should keep in mind</b>(명심해야 한다)가 있는 6·7번에 있어요. 콩코드 항공편은 예시일 뿐이니, 반복되는 <b>scarce</b>(부족한)·<b>scarcity</b>(희소성)·<b>limited</b>(한정적인)를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">1~4번 · 예시 이야기</span><div class=\"en\">Merely because it became <mark>a scarce resource</mark>, the demand for it increased.</div><p class=\"ko\">단지 그것이 <mark>부족한 자원</mark>이 되었기 때문에, 그것에 대한 수요가 증가했다.</p></div><div class=\"ck-via\"><i>▼</i><span>항공편 이야기를 ‘희소성의 원리’라는 일반 원리로 바꿔 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 원리로 넓히기</span><div class=\"en\">then <mark>the principle of scarcity</mark> can be effectively used.</div><p class=\"ko\">그렇다면 <mark>희소성의 원리가</mark> 효과적으로 사용될 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>must(~해야 한다)로 판매원이 할 일을 콕 집어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 판매원에게 시키는 말</span><div class=\"en\">you <mark>must not merely</mark> point out the benefits … <mark>but also point out its uniqueness</mark> and what they will miss out on …</div><p class=\"ko\">단지 혜택을 지적하는 것에 그쳐서는 안 되고 … <mark>그것(= 상품)의 고유함도 지적해야 한다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>should keep in mind(명심해야 한다)로 결론을 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 결론</span><div class=\"en\">In selling, you <mark>should keep in mind</mark> that <mark>the more limited something is</mark>, the more desirable it becomes.</div><p class=\"ko\">판매에 있어서, 여러분은 <mark>무언가가 더 한정적일수록</mark> 더 가치 있게 된다는 것을 <mark>명심해야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">효과적인 판매를 위해서는 상품의 희소성을 강조해야 한다.<small>5번 the principle of scarcity(희소성의 원리)와 7번 limited(한정적인)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">고객의 특성에 맞춰 다양한 판매 전략을 수립하고 적용해야 한다.</span><span class=\"why\">[지문에 없음] 지문은 여러 전략이 아니라 단 하나, 희소성(scarcity)만 말해요. 고객마다 다르게 하라는 문장은 한 번도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">상품 판매 시 실현 가능한 판매 목표를 설정해야 한다.</span><span class=\"why\">[지문에 없음] 6번 increase the sales(판매를 늘리다)가 나오지만, 목표를 어떻게 세우라는 말은 없어요. 판매를 늘리는 방법이 희소성 강조예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">판매를 촉진하기 위해서는 가격 경쟁력을 갖추어야 한다.</span><span class=\"why\">[지문에 없음] 가격 이야기는 없어요. 3번에서 노선·서비스는 그대로였고, 오직 운항이 줄어 부족해진 것(scarce 부족한)만 바뀌었어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">고객의 신뢰를 얻기 위해서는 일관된 태도를 유지해야 한다.</span><span class=\"why\">[지문에 없음] 신뢰나 일관된 태도는 지문에 나오지 않아요. 지문의 핵심은 7번, 한정적일수록(the more limited) 더 가치 있다는 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In 2003,</div><div class=\"k\">2003년에,</div></div><div class=\"rc\"><div class=\"e\">British Airways made an announcement</div><div class=\"k\">영국 항공은 발표했다</div></div><div class=\"rc\"><div class=\"e\">that they would no longer be able</div><div class=\"k\">그들(= 영국 항공)이 더 이상 ~할 수 없을 것이라고</div></div><div class=\"rc\"><div class=\"e\">to operate the London to New York Concorde flight</div><div class=\"k\">런던에서 뉴욕까지 가는 콩코드 항공편을 운항할</div></div><div class=\"rc\"><div class=\"e\">twice a day</div><div class=\"k\">하루에 두 번</div></div><div class=\"rc\"><div class=\"e\">because it was starting to prove uneconomical.</div><div class=\"k\">그것(= 그 항공편)이 경제성이 없는 것으로 드러나기 시작하고 있었기 때문에.</div></div><div class=\"rnat\">2003년, 영국 항공은 경제성이 없는 것으로 드러나기 시작했기 때문에 런던-뉴욕 간 콩코드 항공편을 더 이상 하루에 두 번 운항할 수 없을 것이라고 발표했다.</div><div class=\"rst\">학교 매점이 “인기 빵을 이제 하루 두 번씩은 못 팔아요” 하고 알렸어요. = 지문 1번, 콩코드 항공편을 하루 두 번 못 띄운다는 발표예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Well,</div><div class=\"k\">그런데,</div></div><div class=\"rc\"><div class=\"e\">the sales for the flight on this route</div><div class=\"k\">이 노선의 항공편 판매량이</div></div><div class=\"rc\"><div class=\"e\">increased the very next day.</div><div class=\"k\">바로 다음 날 증가했다.</div></div><div class=\"rnat\">그런데 다음 날 바로 노선의 항공편 판매량이 증가했다.</div><div class=\"rst\">그런데 바로 다음 날 그 빵이 더 많이 팔렸어요. 지문 2번도 발표 바로 다음 날 판매량이 늘었다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">There was nothing</div><div class=\"k\">아무것도 없었다</div></div><div class=\"rc\"><div class=\"e\">that changed</div><div class=\"k\">바뀐 것이</div></div><div class=\"rc\"><div class=\"e\">about the route or the service</div><div class=\"k\">그 노선이나 서비스에 대해</div></div><div class=\"rc\"><div class=\"e\">offered by the airlines.</div><div class=\"k\">항공사가 제공하는.</div></div><div class=\"rnat\">그 노선이나 항공사가 제공하는 서비스에 있어 달라진 것은 아무것도 없었다.</div><div class=\"rst\">빵 맛도, 가격표도 하나도 안 바뀌었어요. = 지문 3번, 노선이나 서비스는 그대로였다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Merely because it became</div><div class=\"k\">단지 그것(= 그 항공편)이 ~이 되었기 때문에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a scarce resource</span>,</div><div class=\"k\"><span class=\"cw\">부족한 자원</span>,</div></div><div class=\"rc\"><div class=\"e\">the demand for it increased.</div><div class=\"k\">그것(= 그 항공편)에 대한 수요가 증가했다.</div></div><div class=\"rnat\">단지 그것이 부족한 자원이 되었기 때문에, 그것에 대한 수요가 증가했다.</div><div class=\"rst\">그냥 <b>구하기 어려워졌다</b>는 이유만으로 다들 사고 싶어진 거예요. = 지문 4번의 <b>scarce resource</b>(부족한 자원)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">If you are interested</div><div class=\"k\">만약 여러분이 관심이 있다면</div></div><div class=\"rc\"><div class=\"e\">in persuading people,</div><div class=\"k\">사람들을 설득하는 데,</div></div><div class=\"rc ckc\"><div class=\"e\">then <span class=\"cw\">the principle of scarcity</span></div><div class=\"k\">그렇다면 <span class=\"cw\">희소성의 원리가</span></div></div><div class=\"rc\"><div class=\"e\">can be effectively used.</div><div class=\"k\">효과적으로 사용될 수 있다.</div></div><div class=\"rnat\">만약 여러분이 사람들을 설득하는 데 관심이 있다면, 희소성의 원리가 효과적으로 사용될 수 있다.</div><div class=\"rst\">그래서 친구를 설득할 때도 “이거 몇 개 안 남았어”가 잘 먹혀요. 지문 5번은 이걸 <b>희소성의 원리</b>(the principle of scarcity)라고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">If you are a salesperson</div><div class=\"k\">만약 여러분이 판매원이라면</div></div><div class=\"rc\"><div class=\"e\">trying to increase the sales</div><div class=\"k\">판매를 늘리려고 애쓰는</div></div><div class=\"rc\"><div class=\"e\">of a certain product,</div><div class=\"k\">특정 상품의,</div></div><div class=\"rc\"><div class=\"e\">then you must not merely point out</div><div class=\"k\">여러분은 단지 지적하는 것에 그쳐서는 안 된다</div></div><div class=\"rc\"><div class=\"e\">the benefits the customer can derive</div><div class=\"k\">고객이 얻을 수 있는 혜택을</div></div><div class=\"rc\"><div class=\"e\">from the said product,</div><div class=\"k\">그 상품으로부터,</div></div><div class=\"rc\"><div class=\"e\">but also point out its uniqueness</div><div class=\"k\">그것(= 상품)의 고유함도 지적해야 한다</div></div><div class=\"rc\"><div class=\"e\">and what they will miss out on</div><div class=\"k\">그리고 그들(= 고객)이 놓치게 될 것을</div></div><div class=\"rc\"><div class=\"e\">if they don't purchase the product soon.</div><div class=\"k\">그들(= 고객)이 그 상품을 곧 구매하지 않으면.</div></div><div class=\"rnat\">만약 여러분이 특정 상품의 판매를 늘리려고 애쓰는 판매원이라면, 여러분은 단지 고객이 그 상품으로부터 얻을 수 있는 혜택을 지적하는 것뿐 아니라, 그 상품의 고유함과 만약 그들이 상품을 곧 구매하지 않으면 놓치게 될 것도 강조해야 한다.</div><div class=\"rst\">매점 직원이라면 “맛있어요”만 말하지 말고 “여기서만 팔고 곧 없어져요”도 말해야 해요. 지문 6번의 <b>must</b>(~해야 한다)예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">In selling,</div><div class=\"k\">판매에 있어서,</div></div><div class=\"rc ckc\"><div class=\"e\">you <span class=\"cw\">should keep in mind</span></div><div class=\"k\">여러분은 <span class=\"cw\">명심해야 한다</span></div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">the more limited something is</span>,</div><div class=\"k\"><span class=\"cw\">무언가가 더 한정적일수록</span>,</div></div><div class=\"rc\"><div class=\"e\">the more desirable it becomes.</div><div class=\"k\">그것(= 무언가)은 더 가치 있게 된다.</div></div><div class=\"rnat\">판매에 있어서 여러분은 무언가가 한정적일수록 그것이 더 가치 있게 된다는 것을 명심해야 한다.</div><div class=\"rst\">결론은 <b>적을수록 더 갖고 싶어진다</b>는 것, 이걸 명심하라는 게 필자의 주장이에요. = 지문 7번 the more limited(더 한정적일수록)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"uneconomical\" data-m=\"경제성이 없는, 비경제적인\"><b>uneconomical</b>경제성이 없는, 비경제적인</button><button type=\"button\" class=\"wdb\" data-w=\"scarce resource\" data-m=\"희소 자원\"><b>scarce resource</b>희소 자원</button><button type=\"button\" class=\"wdb\" data-w=\"principle of scarcity\" data-m=\"희소성의 원리\"><b>principle of scarcity</b>희소성의 원리</button><button type=\"button\" class=\"wdb\" data-w=\"uniqueness\" data-m=\"유일함, 고유성\"><b>uniqueness</b>유일함, 고유성</button><button type=\"button\" class=\"wdb\" data-w=\"miss out on\" data-m=\"~을 놓치다\"><b>miss out on</b>~을 놓치다</button><button type=\"button\" class=\"wdb\" data-w=\"desirable\" data-m=\"가치 있는, 바람직한\"><b>desirable</b>가치 있는, 바람직한</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">도표 불일치에서 <b>배수</b>(three times 3배)가 나오면 꼭 직접 계산하세요. 두 해의 숫자를 빼서 <b>증가폭</b>을 먼저 구하고, 그다음에 곱해 보면 바로 걸러져요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번 문장: 미국·러시아·이란이 두 해 모두 상위 3개국 → 표와 같음</span><span><em>②</em>3번 문장: 러시아와 이란의 차이가 두 해 모두 4000억보다 큼 → 표와 같음</span><span><em>③</em>4번 문장: 캐나다는 생산량이 늘었지만 순위는 낮아짐 → 표와 같음</span><span><em>⑤</em>6번 문장: 호주는 2014년에 없다가 2018년 7위 → 표와 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 표와 같아요 → 남은 ④의 ‘3배’를 직접 계산</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · ④ 앞부분</span><div class=\"en\">Between 2014 and 2018, <mark>the increase in natural gas production in China</mark></div><p class=\"ko\">2014년과 2018년 사이, <mark>중국의 천연가스 생산량의 증가는</mark></p></div><div class=\"ck-via\"><i>▼</i><span>표에서 중국 132→176(44 증가), 카타르 160→181(21 증가). 21의 3배는 63이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · 배수 확인 · 결정적 단서</span><div class=\"en\">was <mark>more than three times</mark> that in Qatar.</div><p class=\"ko\">카타르의 그것의 <mark>3배 이상이었다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">중국의 증가폭이 카타르의 3배 이상(more than three times)이었다<small>중국 증가폭 44는 카타르 증가폭 21의 3배(63)에 못 미쳐요. 2배 정도일 뿐이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">캐나다는 생산량이 늘었지만(increased) 순위는 더 낮아졌다(ranked lower)</span><span class=\"why\">4번과 같아요. even though(비록 ~이지만)가 있어 앞뒤가 반대처럼 보여도, 양은 늘고 순위는 내려간 게 표와 맞아요. 다른 나라가 더 많이 늘었기 때문이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">미국, 러시아, 이란은 두 해 모두 상위 3개국(the top three)이었다</span><span class=\"why\">2번과 같아요. 2014년과 2018년 두 해 모두 미국·러시아·이란이 상위 3개국(the top three)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">두 해 모두 러시아와 이란의 차이(gap)가 4000억 세제곱미터보다 컸다</span><span class=\"why\">3번과 같아요. respectively(각각) 두 해 모두 차이가 400 billion cubic meters(4000억 세제곱미터)보다 커요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">호주는 2014년에 없다가(not included) 2018년 7위(seventh)로 등장했다</span><span
