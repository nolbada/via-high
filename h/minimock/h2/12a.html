<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

: "녹음 기술자들과 음악가들은 특수 효과를 만들어내는 법을 배웠다 / 우리의 뇌를 자극하는 / 신경 회로를 활용함으로써 / 우리의 청각 환경의 중요한 특징들을 식별하도록 진화한", "nat": "녹음 기술자들과 음악가들은 우리의 청각 환경에서 중요한 특징을 식별하도록 진화한 신경 회로를 활용해, 우리의 뇌를 자극하는 특수 효과를 만들어내는 법을 배웠다.", "ana": "<b>have learned</b>는 <b>현재완료</b>이며, 문장 안에 <b>that tickle ~</b>과 <b>that evolved ~</b> 두 개의 <b>주격 관계대명사절</b>이 각각 special effects와 neural circuits를 수식한다.", "pe": "\u0001Recording\u0002 engineers and musicians have learned to create \u0001special\u0002 effects / \u0001that tickle our brains\u0002 / \u0001by exploiting<sup>1</sup> neural circuits<sup>2</sup>\u0002 / \u0001that evolved to discern<sup>3</sup> important features of our auditory environment<sup>4</sup>\u0002.", "pk": "\u0001녹음\u0002 기술자들과 음악가들은 \u0001특수\u0002 효과를 만들어내는 법을 배웠다 / \u0001우리의 뇌를 자극하는\u0002 / \u0001신경 회로를 활용함으로써\u0002 / \u0001우리의 청각 환경의 중요한 특징들을 식별하도록 진화한\u0002", "core": "엔지니어들과 음악가들은 효과를 만들어내는 법을 배웠다.", "tags": ["주어 engineers and musicians (Recording = 현재분사: engineers를 꾸밈) + 동사 <b>have learned</b> (현재완료) + 목적어 to create effects. special = 형용사: effects를 꾸밈", "that ~ = 관계절(형용사절): effects를 꾸밈 (주격 관계대명사)", "by + 동명사 = 전치사구(부사구): create를 꾸밈 (수단)", "that ~ = 관계절(형용사절): circuits를 꾸밈 (주격). evolved to discern ~ (식별하도록 진화한)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 관계절 두 개와 by 전치사구가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Recording engineers and musicians (녹음 기술자들과 음악가들)", "V: have learned (learn 배우다의 현재완료)", "O: to create special effects (특수 효과를 만들어내는 것)", "뼈대 = <b>Recording engineers and musicians have learned to create special effects</b>"]}, {"t": "Recording은 현재분사지만 engineers 앞에 붙어 '녹음 기술자'라는 한 덩어리로 읽는다. (recording 녹음, engineer 기술자)"}, {"t": "<b>that tickle our brains</b>는 effects를 꾸미는 주격 관계절이다.", "sub": ["tickle 자극하다, 간지럽히다. brain 뇌"]}, {"t": "<b>by exploiting neural circuits</b>는 전치사구(부사구)이다. create를 꾸미며 수단을 말한다. 전치사 by 뒤의 exploiting은 동명사이다.", "sub": ["exploit 활용하다, neural circuits 신경 회로"]}, {"t": "<b>that evolved to discern important features of our auditory environment</b>는 circuits를 꾸미는 주격 관계절이다.", "sub": ["evolve 진화하다의 과거형 evolved", "to discern = 식별하도록 (to부정사 부사적). discern 식별하다", "important features = 중요한 특징들. auditory environment = 청각 환경"]}], "sum": "녹음 기술자·음악가, 청각 환경을 식별하도록 진화한 신경 회로를 이용해 뇌를 자극하는 효과를 만듦"}, {"i": "07", "q": "05", "s": "3", "title": "S+V+O(to부정사 병렬) + as ~ rather than as ~", "eng": "In free play, / children learn to make their own decisions, solve their own problems, create and follow rules, and get along with others / as equals rather than as obedient<sup>1</sup> or rebellious<sup>2</sup> subordinates<sup>3</sup>.", "notes": [["1", "obedient", "순종적인"], ["2", "rebellious", "반항적인"], ["3", "subordinate", "하급자"]], "lit": "자유 놀이에서, / 아이들은 스스로 결정을 내리고, 스스로 문제를 해결하고, 규칙을 만들고 따르고, 그리고 다른 사람들과 잘 지내는 법을 배운다 / 순종적이거나 반항적인 하급자로서가 아니라 동등한 사람으로서", "nat": "자유 놀이에서 아이들은 순종적이거나 반항적인 하급자로서가 아니라 동등한 사람으로서, 스스로 결정을 내리고 문제를 해결하고 규칙을 만들고 따르며 다른 사람들과 잘 지내는 법을 배운다.", "ana": "learn to 뒤에 <b>make, solve, create and follow, get along with</b> 네 개의 동사구가 <b>병렬</b> 연결되어 있고, <b>rather than ~</b>은 '~라기보다는'이라는 비교 표현이다.", "pe": "\u0001In free play\u0002, / children learn to make their own decisions, solve their own problems, create and follow rules, and get along \u0001with others\u0002 / \u0001as equals rather than as obedient<sup>1</sup> or rebellious<sup>2</sup> subordinates<sup>3</sup>\u0002.", "pk": "\u0001자유 놀이에서\u0002, / 아이들은 스스로 결정을 내리고, 스스로 문제를 해결하고, 규칙을 만들고 따르고, 그리고 \u0001다른 사람들과\u0002 잘 지내는 법을 배운다 / \u0001순종적이거나 반항적인 하급자로서가 아니라 동등한 사람으로서\u0002", "core": "아이들은 결정을 내리고 문제를 해결하고 규칙을 만들고 따르고 어울리는 법을 배운다.", "tags": ["In free play = 전치사구(부사구): learn을 꾸밈 (장소·상황)", "주어 children + 동사 learn + 목적어 to부정사 4개 병렬. with others = 거의 필수에 가까운 부사구 (get along with): get along을 꾸밈 [기준: 문형 기준]", "as ~ rather than as ~ = 전치사구(부사구): learn을 꾸밈 (자격, ~라기보다는)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 to부정사가 여러 개 병렬이고 뒤에 비교 전치사구가 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: children (아이들)", "V: learn (learn 배우다)", "O: to V 네 개", "뼈대 = <b>children learn to V ~</b>", "In free play = 자유 놀이에서 (부사구)"]}, {"t": "to부정사 네 개의 덩어리는 다음과 같다.", "sub": ["① to make their own decisions = 스스로 결정을 내리는 법", "② (to) solve their own problems = 스스로 문제를 해결하는 법", "③ (to) create and follow rules = 규칙을 만들고 따르는 법 (create 만들다, follow 따르다)", "④ (to) get along with others = 다른 사람들과 잘 지내는 법 (get along with ~와 어울리다)"]}, {"t": "<b>as equals rather than as obedient or rebellious subordinates</b>는 전치사구(부사구)이다. learn을 꾸민다. '순종적이거나 반항적인 하급자로서가 아니라 동등한 사람으로서'라는 뜻이다.", "sub": ["equal 동등한 사람, obedient 순종적인, rebellious 반항적인, subordinate 하급자"]}, {"t": "함정: create and follow는 한 덩어리 ③이다. 동사 둘이 같은 목적어 rules를 가진다."}], "sum": "자유 놀이에서 아이들은 하급자가 아닌 동등한 사람으로서 결정·해결·규칙·어울림을 배움"}, {"i": "08", "q": "06", "s": "4", "title": "S+V+O(3형식) + 콜론 뒤 수동태 병렬 + though절", "eng": "Preschoolers and young school-age children confuse temporal<sup>1</sup> and spatial dimensions<sup>2</sup>: / Starting times are judged by starting points, stopping times by stopping points and durations by distance, / though each of these errors does not necessitate<sup>3</sup> the others.", "notes": [["1", "temporal", "시간의"], ["2", "spatial dimension", "공간적 차원"], ["3", "necessitate", "필요로 하다"]], "lit": "취학 전 아동과 어린 학령기 아동은 시간적 차원과 공간적 차원을 혼동한다: / 출발 시간은 출발점으로, 정지 시간은 정지점으로, 그리고 지속 시간은 거리로 판단된다, / 비록 이러한 오류들 각각이 다른 것들을 반드시 수반하지는 않지만", "nat": "취학 전 아동과 어린 학령기 아동은 시간적 차원과 공간적 차원을 혼동하는데, 이 오류들이 서로를 반드시 수반하지는 않지만, 출발 시간은 출발점으로, 정지 시간은 정지점으로, 지속 시간은 거리로 판단한다.", "ana": "<b>are judged by ~, (are judged) by ~, (are judged) by ~</b>는 <b>수동태</b>가 <b>병렬</b>로 반복된 구조이며, <b>though ~</b>는 <b>양보의 부사절</b>이다.", "pe": "Preschoolers and \u0001young school-age\u0002 children confuse \u0001temporal<sup>1</sup> and spatial\u0002 dimensions<sup>2</sup>: / Starting times are judged \u0001by starting points\u0002, stopping times \u0001by stopping points\u0002 and durations \u0001by distance\u0002, / \u0001though each of these errors does not necessitate<sup>3</sup> the others\u0002.", "pk": "취학 전 아동과 \u0001어린 학령기\u0002 아동은 \u0001시간적 차원과 공간적\u0002 차원을 혼동한다: / 출발 시간은 \u0001출발점으로\u0002, 정지 시간은 \u0001정지점으로\u0002, 그리고 지속 시간은 \u0001거리로\u0002 판단된다, / \u0001비록 이러한 오류들 각각이 다른 것들을 반드시 수반하지는 않지만\u0002", "core": "아동들은 차원들을 혼동한다. 출발 시간, 정지 시간, 지속 시간이 판단된다.", "tags": ["주어 Preschoolers and children + 동사 confuse + 목적어 dimensions. young school-age = 형용사: children을 꾸밈. temporal and spatial = 형용사: dimensions를 꾸밈", "주어 Starting times + 동사 <b>are judged</b> (수동태). by ~ = 전치사구(부사구): 판단 기준. 뒤 두 병렬도 are judged 생략, by 구가 각각 붙음", "though ~ = 양보 부사절: 앞 문장을 꾸밈 (비록 ~이지만)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 콜론 뒤 수동태 병렬과 생략, though절이 붙어 길어 보인다."}, {"t": "앞 절의 뼈대부터 찾는다.", "sub": ["S: Preschoolers and young school-age children (취학 전 아동과 어린 학령기 아동)", "V: confuse (confuse 혼동하다)", "O: temporal and spatial dimensions (시간적 차원과 공간적 차원)", "뼈대 = <b>Preschoolers and young children confuse dimensions</b>"]}, {"t": "콜론 뒤는 앞 내용을 구체적으로 설명한다. 수동태(1형식)가 병렬이다.", "sub": ["Starting times are judged by starting points = 출발 시간은 출발점으로 판단된다 (judge 판단하다)", "stopping times (are judged) by stopping points = 정지 시간은 정지점으로 (are judged 생략)", "and durations (are judged) by distance = 지속 시간은 거리로 (duration 지속 시간)"]}, {"t": "<b>though each of these errors does not necessitate the others</b>는 양보 부사절이다. '이 오류들이 서로를 반드시 수반하지는 않지만'이라는 뜻이다. (necessitate 반드시 수반하다, error 오류)"}, {"t": "함정: 두 번째, 세 번째 병렬 덩어리는 동사 are judged가 생략되어 있다. 'by ~' 부분만 남은 것이다."}], "sum": "어린 아동은 시간과 공간을 혼동해 시간을 점·거리로 판단하나 오류가 서로 따라오지는 않음"}], "qs": [{"q": "01", "type": "주장", "src": "2021년 11월 20번", "ans": "③", "tr": [["1", "2003년, 영국 항공은 경제성이 없는 것으로 드러나기 시작했기 때문에 런던-뉴욕 간 콩코드 항공편을 더 이상 하루에 두 번 운항할 수 없을 것이라고 발표했다."], ["2", "그런데 다음 날 바로 노선의 항공편 판매량이 증가했다."], ["3", "그 노선이나 항공사가 제공하는 서비스에 있어 달라진 것은 아무것도 없었다."], ["4", "단지 그것이 부족한 자원이 되었기 때문에, 그것에 대한 수요가 증가했다."], ["5", "만약 여러분이 사람들을 설득하는 데 관심이 있다면, 희소성의 원리가 효과적으로 사용될 수 있다."], ["6", "만약 여러분이 특정 상품의 판매를 늘리려고 애쓰는 판매원이라면, 여러분은 단지 고객이 그 상품으로부터 얻을 수 있는 혜택을 지적하는 것뿐 아니라, 그 상품의 고유함과 만약 그들이 상품을 곧 구매하지 않으면 놓치게 될 것도 강조해야 한다."], ["7", "판매에 있어서 여러분은 무언가가 한정적일수록 그것이 더 가치 있게 된다는 것을 명심해야 한다."]], "evh": "6·7번 문장", "ev": [{"en": true, "h": "If you are a salesperson trying to increase the sales of a certain product, then you must not merely point out the benefits the customer can derive from the said product, but also point out its uniqueness and what they will miss out on if they don't purchase the product soon. / In selling, you should keep in mind that the more limited something is, the more desirable it becomes."}, {"en": false, "h": "상품의 이점뿐 아니라 고유함과 희소성까지 강조해야 한다는 6번의 내용과, 한정적일수록 더 가치 있어진다는 7번의 결론을 종합하면, 이 글의 주장은 '효과적인 판매를 위해서는 상품의 희소성을 강조해야 한다'는 것이다."}], "opts": [{"n": "①", "t": "상품 판매 시 실현 가능한 판매 목표를 설정해야 한다.", "a": false, "x": true, "trap": false, "e": "판매 목표 설정에 관한 내용은 본문에 없다."}, {"n": "②", "t": "판매를 촉진하기 위해서는 가격 경쟁력을 갖추어야 한다.", "a": false, "x": true, "trap": false, "e": "가격 경쟁력(price)에 관한 언급은 전혀 없다."}, {"n": "③", "t": "효과적인 판매를 위해서는 상품의 희소성을 강조해야 한다.", "a": true, "x": false, "trap": false, "e": "상품의 고유함과 놓치게 될 것을 강조하라는 6번과, 한정적일수록 가치 있어진다는 7번의 내용과 정확히 일치한다."}, {"n": "④", "t": "고객의 신뢰를 얻기 위해서는 일관된 태도를 유지해야 한다.", "a": false, "x": true, "trap": true, "e": "신뢰나 일관된 태도에 관한 내용은 본문에 없다."}, {"n": "⑤", "t": "고객의 특성에 맞춰 다양한 판매 전략을 수립하고 적용해야 한다.", "a": false, "x": true, "trap": false, "e": "고객 특성별 전략 수립에 관한 내용은 본문에 없다."}], "w": [["uneconomical", "경제성이 없는, 비경제적인"], ["scarce resource", "희소 자원"], ["demand", "수요"], ["principle of scarcity", "희소성의 원리"], ["persuade", "설득하다"], ["point out", "지적하다, 가리키다"], ["uniqueness", "유일함, 고유성"], ["miss out on", "~을 놓치다"], ["keep in mind", "명심하다"], ["desirable", "가치 있는, 바람직한"]]}, {"q": "02", "type": "도표 불일치", "src": "2021년 6월 25번", "ans": "④", "tr": [["1", "위 표는 2014년과 2018년 전 세계 천연가스 생산 상위 7개 국가를 보여준다."], ["2", "①미국, 러시아, 이란은 2014년과 2018년 모두 상위 3개 천연가스 생산 국가였다."], ["3", "②2014년과 2018년 각각, 러시아와 이란 간의 천연가스 생산량 차이는 4000억 세제곱미터보다 더 컸다."], ["4", "③캐나다에서 생산된 천연가스 양은 증가했지만, 캐나다는 2014년보다 2018년에 더 낮은 순위를 기록했다."], ["5", "④2014년과 2018년 사이 중국의 천연가스 생산량의 증가는 카타르의 그것(천연가스 생산량의 증가)의 3배 이상이었다."], ["6", "⑤2014년 상 function sHtmlP(s){

function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  if(c.steps&&c.steps.length){x+='<div class="lay th"><div class="hd">이 문장 읽는 순서</div><ol>'+c.steps.map(p=>'<li>'+p.t+(p.sub||[]).map(u=>'<div class="sub">'+u+'</div>').join('')+'</li>').join('')+'</ol></div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}

function renderNote(){
  const list=noteList();

      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){

  $('#b').onclick=()=>{view='word';render();};

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
