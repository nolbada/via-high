var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>In either situation</b>(어느 상황에서든)으로 시작하는 마지막 문장. 두 상황(작은 신발만 / 큰 신발만)에서 <b>공통으로 빠진 것</b>을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (8번)</span><div class=\"en\"><mark>In either situation</mark>, the government’s strategy did not provide any motivation to <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\"><mark>어느 상황에서든</mark> 정부의 전략은 ( ? )할 어떤 동기도 제공하지 못했다</p></div><div class=\"ck-via\"><i>▼</i><span>개수로 세던 때: 가장 쉬운 길 = 작은 신발만</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 첫 번째 상황</span><div class=\"en\">… the manager’s basic goal was to meet the quota in the easiest possible way — by producing <mark>only small shoes</mark>.</div><p class=\"ko\">관리자의 기본 목표는 가능한 가장 쉬운 방법, 즉 <mark>작은 신발만</mark> 생산함으로써 할당량을 충족시키는 것이었다.</p></div><div class=\"ck-via\"><i>▼</i><span>작은 신발만 나오니 큰 발 사람들의 필요가 안 채워짐</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 누가 곤란했나</span><div class=\"en\">This production strategy created a problem <mark>for people who had big feet</mark>, and so the government revised the system.</div><p class=\"ko\">이 생산 전략은 <mark>발이 큰 사람들에게</mark> 문제를 야기했고, 그래서 정부는 그 시스템을 수정했다.</p></div><div class=\"ck-via\"><i>▼</i><span>무게로 재도록 바꾸자 이번엔 반대로 큰 신발만</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">And again, the factory’s manager responded in the most efficient way, by producing <mark>nothing but huge shoes</mark>.</div><p class=\"ko\">그리고 다시, 관리자는 가장 효율적인 방법, 즉 <mark>크기가 엄청난 신발만</mark> 생산함으로써 대응했다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>개수로 셀 때 → 작은 신발만</span><span><em>7번</em>무게로 잴 때 → 엄청 큰 신발만</span></div><div class=\"ck-eq\">⇒ 두 상황 모두 빠진 것 = 사람들 발에 맞는 여러 크기의 신발</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">produce shoes in various sizes that met people's needs 사람들의 필요를 충족시키는 다양한 크기의 신발을 생산하다<small>작은 것만(3번)·큰 것만(7번)이라는 공통 실패를 그대로 뒤집은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">simplify the production process to reduce costs 비용을 줄이기 위해 생산 과정을 단순화하다</span><span class=\"why\">3·7번에서 관리자는 이미 가장 쉬운(easiest) 방법만 골랐어요. 너무 단순하게 한 게 문제였지, 단순화할 동기가 없던 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">improve the working environment for employees 직원들의 근무 환경을 개선하다</span><span class=\"why\">근무 환경 이야기는 지문에 한 줄도 없어요. 4번이 짚은 문제는 직원이 아니라 발이 큰 사람들의 신발이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">increase the number of factories to make more profit 더 많은 이윤을 내기 위해 공장 수를 늘리다</span><span class=\"why\">3번에 이윤 동기(profit motive)가 없었다는 말은 있지만, 공장 수를 늘리는 이야기는 없어요. 지문은 공장 한 곳의 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">adopt new technology to compete against foreign shoes 외국 신발과 경쟁하기 위해 신기술을 도입하다</span><span class=\"why\">신기술도 외국 신발도 지문에 나오지 않아요. 바뀐 건 5·6번의 “개수 → 무게”라는 규칙뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">This true story is about</div><div class=\"k\">이 실화는 ~에 관한 이야기이다</div></div><div class=\"rc\"><div class=\"e\">a government-owned shoe factory in Poland</div><div class=\"k\">정부 소유의 신발 공장, 폴란드에 있는</div></div><div class=\"rc\"><div class=\"e\">in the days when the country had</div><div class=\"k\">그 나라(= 폴란드)가 가지고 있었던 시절에</div></div><div class=\"rc\"><div class=\"e\">a much more socialist economy.</div><div class=\"k\">훨씬 더 사회주의적인 경제 체제를.</div></div><div class=\"rnat\">이 실화는 그 나라(폴란드)가 훨씬 더 사회주의적인 경제 체제를 가지고 있었던 시절에, 폴란드에 있는 정부 소유의 신발 공장에 관한 이야기이다.</div><div class=\"rst\">반티 만들기 장면으로 따라가 봐요. 지문은 옛날 폴란드에서 나라가 운영하던 신발 공장의 실화예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Every month,</div><div class=\"k\">매달,</div></div><div class=\"rc\"><div class=\"e\">the Polish government gave the factory materials,</div><div class=\"k\">폴란드 정부는 공장에 재료를 주었고,</div></div><div class=\"rc\"><div class=\"e\">and the manager was told</div><div class=\"k\">그리고 관리자는 지시받았다</div></div><div class=\"rc\"><div class=\"e\">to produce a fixed number of shoes.</div><div class=\"k\">정해진 수의 신발을 생산하라고.</div></div><div class=\"rnat\">매달, 폴란드 정부는 공장에 재료를 주었고, 공장의 관리자는 정해진 수의 신발을 생산하도록 지시받았다.</div><div class=\"rst\">선생님이 매달 천을 주면서 “반티 몇 장 만들어 와” 하고 개수만 정해 줘요. = 지문의 정해진 수(a fixed number)의 신발.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Because there was no profit motive involved,</div><div class=\"k\">수익을 내기 위한 동기가 포함되지 않았기 때문에,</div></div><div class=\"rc\"><div class=\"e\">the manager’s basic goal was</div><div class=\"k\">관리자의 기본적인 목표는 ~이었다</div></div><div class=\"rc\"><div class=\"e\">to meet the quota</div><div class=\"k\">할당량을 충족시키는 것</div></div><div class=\"rc\"><div class=\"e\">in the easiest possible way</div><div class=\"k\">가능한 가장 쉬운 방법으로,</div></div><div class=\"rc ckc\"><div class=\"e\">— by producing <span class=\"cw\">only small shoes</span>.</div><div class=\"k\">즉 <span class=\"cw\">작은 신발만</span> 생산함으로써.</div></div><div class=\"rnat\">수익을 내기 위한 동기가 포함되지 않았기 때문에, 관리자의 기본적인 목표는 가능한 가장 쉬운 방법, 즉 작은 신발만을 생산함으로써 할당량을 충족시키는 것이었다.</div><div class=\"rst\">반장은 잘 맞든 말든 상관없으니, 제일 쉬운 길로 <b>작은 사이즈만</b> 만들어요. = 지문의 작은 신발만(only small shoes) 만들기.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This production strategy</div><div class=\"k\">이 생산 전략(= 작은 신발만 만드는 것)은</div></div><div class=\"rc\"><div class=\"e\">created a problem</div><div class=\"k\">문제를 야기했고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">for people who had big feet</span>,</div><div class=\"k\"><span class=\"cw\">발이 큰 사람들에게</span>,</div></div><div class=\"rc\"><div class=\"e\">and so the government revised the system.</div><div class=\"k\">그래서 정부는 그 시스템을 수정했다.</div></div><div class=\"rnat\">이러한 생산 전략은 발이 큰 사람들에게 문제를 야기했고, 그래서 정부는 그 시스템을 수정했다.</div><div class=\"rst\">덩치 큰 친구들은 입을 옷이 없어 난리가 나요. 그래서 선생님이 규칙을 바꿔요. = 지문의 발이 큰 사람들의 문제.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Now the factory received</div><div class=\"k\">이제 그 공장은 받는다</div></div><div class=\"rc\"><div class=\"e\">the same amount of materials,</div><div class=\"k\">똑같은 양의 재료를,</div></div><div class=\"rc\"><div class=\"e\">but instead of producing a fixed number of shoes,</div><div class=\"k\">하지만 정해진 수의 신발을 생산하는 대신에,</div></div><div class=\"rc\"><div class=\"e\">the factory was expected to produce</div><div class=\"k\">그 공장은 생산하도록 요구받았다</div></div><div class=\"rc\"><div class=\"e\">a fixed number of tons of shoes.</div><div class=\"k\">정해진 톤(무게)의 신발을.</div></div><div class=\"rnat\">이제 그 공장은 똑같은 양의 재료를 받지만, 정해진 수의 신발을 생산하는 대신에 정해진 톤(무게)의 신발을 생산하도록 요구받았다.</div><div class=\"rst\">이번엔 “천은 똑같이 줄게, 대신 반티를 정해진 무게만큼 만들어 와”예요. = 지문의 정해진 톤(tons)의 신발.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In other words,</div><div class=\"k\">다시 말해서,</div></div><div class=\"rc\"><div class=\"e\">the factory’s output</div><div class=\"k\">그 공장의 생산품은</div></div><div class=\"rc\"><div class=\"e\">would now be weighed</div><div class=\"k\">이제 무게로 측정될 것이었다</div></div><div class=\"rc\"><div class=\"e\">rather than counted.</div><div class=\"k\">수로 세어지기보다는.</div></div><div class=\"rnat\">다시 말해서, 그 공장의 생산품은 이제 수로 세기보다는 무게로 측정될 것이었다.</div><div class=\"rst\"><b>다시 말해</b>(In other words) 이제 몇 장인지 세지 않고, 저울에 올려 무게만 재요. = 지문 6번이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">And again,</div><div class=\"k\">그리고 다시,</div></div><div class=\"rc\"><div class=\"e\">the factory’s manager responded</div><div class=\"k\">그 공장의 관리자는 대응했다</div></div><div class=\"rc\"><div class=\"e\">in the most efficient way,</div><div class=\"k\">가장 효율적인 방법으로,</div></div><div class=\"rc ckc\"><div class=\"e\">by producing <span class=\"cw\">nothing but huge shoes</span>.</div><div class=\"k\">즉 <span class=\"cw\">크기가 엄청난 신발만</span> 생산함으로써.</div></div><div class=\"rnat\">그리고 다시, 그 공장의 관리자는 가장 효율적인 방법, 즉 크기가 엄청난 신발만을 생산함으로써 대응했다.</div><div class=\"rst\">반장은 또 제일 쉬운 길을 찾아요. 무거운 <b>특대 사이즈만</b> 만들어요. = 지문의 엄청 큰 신발만(nothing but huge shoes).</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In either situation</span>,</div><div class=\"k\"><span class=\"cw\">어느 상황에서든</span>,</div></div><div class=\"rc\"><div class=\"e\">the government’s strategy</div><div class=\"k\">정부의 전략은</div></div><div class=\"rc\"><div class=\"e\">did not provide any motivation</div><div class=\"k\">어떤 동기도 제공하지 못했다</div></div><div class=\"rc ckc\"><div class=\"e\">to produce <span class=\"cw\">shoes in various sizes</span> that met people’s needs.</div><div class=\"k\">사람들의 필요를 충족시키는 <span class=\"cw\">다양한 크기의 신발</span>을 생산할.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">어느 상황에서든, 정부의 전략은 사람들의 필요를 충족시키는 다양한 크기의 신발을 생산할 어떤 동기도 제공하지 못했다.</div><div class=\"rst\"><b>어느 규칙이든</b>(In either situation) 친구들 몸에 맞는 여러 사이즈는 안 나왔어요. 그래서 빈칸은 “필요에 맞는 다양한 크기의 신발 생산”이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"profit motive\" data-m=\"이윤 동기\"><b>profit motive</b>이윤 동기</button><button type=\"button\" class=\"wdb\" data-w=\"meet the quota\" data-m=\"할당량을 맞추다\"><b>meet the quota</b>할당량을 맞추다</button><button type=\"button\" class=\"wdb\" data-w=\"production strategy\" data-m=\"생산 전략\"><b>production strategy</b>생산 전략</button><button type=\"button\" class=\"wdb\" data-w=\"revise\" data-m=\"수정하다, 손보다\"><b>revise</b>수정하다, 손보다</button><button type=\"button\" class=\"wdb\" data-w=\"output\" data-m=\"생산품, 생산량\"><b>output</b>생산품, 생산량</button><button type=\"button\" class=\"wdb\" data-w=\"nothing but\" data-m=\"오직 ~뿐\"><b>nothing but</b>오직 ~뿐</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 바로 앞의 <b>But</b>(하지만)과 빈칸 문장의 <b>also</b>(또한)가 방향을 정해요. 비판이 남이 아니라 <b>내 안</b>에서도 온다는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (4번)</span><div class=\"en\">Self-esteem can <mark>also</mark> <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">자존감은 <mark>또한</mark> ( ? )할 수 있다</p></div><div class=\"ck-via\"><i>▼</i><span>2번(부모·교사가 깎아내림) → But(하지만)으로 “남이 아닌 곳”으로 방향을 틂</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 방향 전환</span><div class=\"en\"><mark>But</mark> criticism doesn’t have to come <mark>from other people</mark>.</div><p class=\"ko\"><mark>하지만</mark> 비판이 <mark>다른 사람들로부터</mark> 올 필요는 없다.</p></div><div class=\"ck-via\"><i>▼</i><span>남이 아닌 그 비판의 정체 = 내 안의 목소리</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">Some teens have an <mark>“inner critic,”</mark> a voice inside that seems to find fault with everything they do.</div><p class=\"ko\">일부 십대들은 <mark>‘내면의 비판자’</mark>를 가지고 있는데, 그들이 하는 모든 것에서 잘못을 찾는 듯한 내면의 목소리이다.</p></div><div class=\"ck-via\"><i>▼</i><span>내 안의 목소리도 남의 비판만큼 자존감을 해친다 = 빈칸 내용</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 다시 확인</span><div class=\"en\">Over time, listening to <mark>a negative inner voice</mark> can harm a person’s self-esteem just as much as if the criticism were coming from another person.</div><p class=\"ko\">시간이 흐르면서 <mark>부정적인 내면의 소리를</mark> 듣는 것은 비판이 다른 사람에게서 오는 것만큼이나 자존감을 손상시킬 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">be damaged by how we see ourselves 우리가 스스로를 어떻게 보는가에 의해 손상되다<small>But(하지만)·also(또한)가 가리키는 “남이 아닌 나 자신”을 그대로 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">be lowered by peer pressure 또래 압력에 의해 낮아지다</span><span class=\"why\">또래 압력도 결국 다른 사람에게서 오는 비판이에요. 3번 But(하지만)이 “남이 아닌 곳”으로 방향을 틀었으니 거꾸로 가요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">make you feel more confident 더 자신감 있게 느끼게 하다</span><span class=\"why\">글은 자존감이 상하는 원인을 다뤄요. 2번 hurt(손상되다)·7번 harm(해치다)과 정반대 방향이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">be related to physical condition 신체 상태와 관련되다</span><span class=\"why\">몸 상태 이야기는 없어요. 5~8번은 몸이 아니라 마음속 inner voice(내면의 소리) 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">nourish parent-child relationships 부모-자식 관계를 키우다</span><span class=\"why\">6번에 부모가 나오지만, 비판적인 부모를 본떠 내면의 소리를 만든다는 부정적인 이야기예요. 관계를 키운다는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Before a person can overcome</div><div class=\"k\">어떤 사람이 극복할 수 있기 전에</div></div><div class=\"rc\"><div class=\"e\">self-esteem problems</div><div class=\"k\">자존감 문제를</div></div><div class=\"rc\"><div class=\"e\">and build healthy self-esteem,</div><div class=\"k\">그리고 건강한 자존감을 형성하기,</div></div><div class=\"rc\"><div class=\"e\">it helps to know</div><div class=\"k\">아는 것은 도움이 된다</div></div><div class=\"rc\"><div class=\"e\">what might cause them.</div><div class=\"k\">무엇이 그것들(= 자존감 문제들)을 유발할 수 있는지.</div></div><div class=\"rnat\">어떤 사람이 자존감 문제를 극복하고 건강한 자존감을 형성하기 전에, 무엇이 그것들(자존감 문제)을 유발할 수 있는지 아는 것은 도움이 된다.</div><div class=\"rst\">축구하다 자신감이 꺾인 친구를 떠올려 봐요. 지문은 자존감(self-esteem)을 세우려면 먼저 무엇이 그걸 깎는지 알아야 한다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Obviously,</div><div class=\"k\">분명히,</div></div><div class=\"rc\"><div class=\"e\">self-esteem can be hurt</div><div class=\"k\">자존감은 손상될 수 있다</div></div><div class=\"rc\"><div class=\"e\">when someone whose acceptance is important</div><div class=\"k\">그 사람의 인정이 중요한 누군가가</div></div><div class=\"rc\"><div class=\"e\">(like a parent or teacher)</div><div class=\"k\">(부모나 교사와 같은)</div></div><div class=\"rc\"><div class=\"e\">constantly puts you down.</div><div class=\"k\">계속해서 당신을 깎아 내릴 때.</div></div><div class=\"rnat\">분명히, 자존감은 (부모나 교사와 같은) 그 사람의 인정이 중요한 누군가가 계속해서 당신을 깎아 내릴 때 손상될 수 있다.</div><div class=\"rst\">코치님이 매번 “넌 왜 그것밖에 못 해?” 하고 깎아내리면 기가 죽어요. = 지문의 부모·교사처럼 중요한 사람의 깎아내리기.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But</span> criticism</div><div class=\"k\"><span class=\"cw\">하지만</span> 비판이</div></div><div class=\"rc\"><div class=\"e\">doesn’t have to come</div><div class=\"k\">올 필요는 없다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">from other people</span>.</div><div class=\"k\"><span class=\"cw\">다른 사람들로부터</span>.</div></div><div class=\"rnat\">하지만 비판이 다른 사람들로부터 올 필요는 없다.</div><div class=\"rst\"><b>하지만</b>(But) 그런 꾸중이 꼭 코치님한테서만 오는 건 아니에요. 지문도 비판이 남에게서 올 필요는 없다고 방향을 틀어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Self-esteem can also</div><div class=\"k\">자존감은 또한 ~할 수 있다</div></div><div class=\"rc\"><div class=\"e\">be damaged</div><div class=\"k\">손상될</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">by how we see ourselves</span>.</div><div class=\"k\"><span class=\"cw\">우리가 우리 스스로를 어떻게 보는가에 의해</span>.※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">자존감은 또한 우리가 우리 스스로를 어떻게 보는가에 의해 손상될 수 있다.</div><div class=\"rst\">내가 나를 “난 원래 못해” 하고 보는 것만으로도 기가 죽어요. 그래서 빈칸은 <b>우리가 스스로를 보는 방식</b>에 의해 손상된다예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Some teens have an “<span class=\"cw\">inner critic</span>,”</div><div class=\"k\">일부 십대들은 ‘<span class=\"cw\">내면의 비판자</span>’를 가지고 있는데,</div></div><div class=\"rc ckc\"><div class=\"e\">a voice inside</div><div class=\"k\">(이것은) 내면의 목소리(= ‘<span class=\"cw\">내면의 비판자</span>’)이다,</div></div><div class=\"rc\"><div class=\"e\">that seems to find fault</div><div class=\"k\">잘못을 발견하는 것처럼 보이는(= 목소리가)</div></div><div class=\"rc\"><div class=\"e\">with everything they do.</div><div class=\"k\">그들(= 십대들)이 하는 모든 것에서.</div></div><div class=\"rnat\">일부 십대들은 ‘내면의 비판자’를 가지고 있는데, (이것은) 그들이 하는 모든 것에서 잘못을 발견하는 것처럼 보이는 내면의 목소리이다.</div><div class=\"rst\">공 하나 놓칠 때마다 머릿속에서 “또 망쳤네” 하는 목소리가 들려요. = 지문의 <b>내면의 비판자</b>(inner critic)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">And people sometimes unintentionally</div><div class=\"k\">그리고 사람들은 때때로 의도치 않게</div></div><div class=\"rc\"><div class=\"e\">model their inner voice after</div><div class=\"k\">그들의 내면의 소리를 본떠서 만든다</div></div><div class=\"rc\"><div class=\"e\">a critical parent</div><div class=\"k\">비판적인 부모를</div></div><div class=\"rc\"><div class=\"e\">or someone else</div><div class=\"k\">혹은 다른 누군가를</div></div><div class=\"rc\"><div class=\"e\">whose opinion is important to them.</div><div class=\"k\">그들(= 사람들)에게 그 사람의 의견이 중요한.</div></div><div class=\"rnat\">그리고 사람들은 때때로 의도치 않게 비판적인 부모나 그 사람의 의견이 그들에게 중요한 다른 누군가를 본떠서 그들의 내면의 소리를 만든다.</div><div class=\"rst\">그 목소리는 어느새 코치님 말투를 그대로 따라 해요. = 지문의 비판적인 부모를 본떠 만든 내면의 소리예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Over time,</div><div class=\"k\">시간이 흐르면서,</div></div><div class=\"rc ckc\"><div class=\"e\">listening to <span class=\"cw\">a negative inner voice</span></div><div class=\"k\"><span class=\"cw\">부정적인 내면의 소리를</span> 듣는 것은</div></div><div class=\"rc\"><div class=\"e\">can harm a person’s self-esteem</div><div class=\"k\">개인의 자존감을 손상시킬 수 있다</div></div><div class=\"rc\"><div class=\"e\">just as much as</div><div class=\"k\">꼭 ~만큼이나</div></div><div class=\"rc\"><div class=\"e\">if the criticism were coming from another person.</div><div class=\"k\">그 비판이 다른 사람에게서 오는 것인 경우처럼.</div></div><div class=\"rnat\">시간이 흐르면서, 부정적인 내면의 소리를 듣는 것은 꼭 그 비판이 다른 사람에게서 온 것만큼이나 개인의 자존감을 손상시킬 수 있다.</div><div class=\"rst\">시간이 지나면 머릿속 꾸중도 코치님 꾸중<b>만큼이나</b> 자신감을 망가뜨려요. = 지문 7번, 남의 비판과 똑같이 해롭다는 말.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Some people get so used to</div><div class=\"k\">일부 사람들은 너무나 익숙해져서</div></div><div class=\"rc\"><div class=\"e\">their inner critic being there</div><div class=\"k\">그들의 내면의 비판자가 있는 것에</div></div><div class=\"rc\"><div class=\"e\">that they don’t even notice</div><div class=\"k\">심지어 알아차리지도 못한다</div></div><div class=\"rc\"><div class=\"e\">when they’re putting themselves down.</div><div class=\"k\">그들이 스스로를 깎아 내리고 있을 때.</div></div><div class=\"rnat\">일부 사람들은 그들의 내면의 비판자가 있는 것에 너무나 익숙해져서 스스로를 깎아 내리고 있을 때 심지어 그들은 알아차리지도 못한다.</div><div class=\"rst\">결국 그 목소리에 너무 익숙해져서, 내가 나를 깎아내리고 있다는 것조차 몰라요. = 지문의 마지막 문장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"self-esteem\" data-m=\"자존감\"><b>self-esteem</b>자존감</button><button type=\"button\" class=\"wdb\" data-w=\"overcome\" data-m=\"극복하다\"><b>overcome</b>극복하다</button><button type=\"button\" class=\"wdb\" data-w=\"criticism\" data-m=\"비판, 비난\"><b>criticism</b>비판, 비난</button><button type=\"button\" class=\"wdb\" data-w=\"find fault with\" data-m=\"~의 흠을 잡다\"><b>find fault with</b>~의 흠을 잡다</button><button type=\"button\" class=\"wdb\" data-w=\"unintentionally\" data-m=\"무심코, 의도치 않게\"><b>unintentionally</b>무심코, 의도치 않게</button><button type=\"button\" class=\"wdb\" data-w=\"harm\" data-m=\"해치다\"><b>harm</b>해치다</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 <b>사회적 증거</b>(social proof)와 그 바탕인 <b>신뢰</b>(trust)예요. friends(친구들)라는 단어만 같고 화제가 다른 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글 전체 화제</span><div class=\"en\">An interesting phenomenon that arose from social media is the concept of <mark>social proof</mark>.</div><p class=\"ko\">소셜 미디어에서 생겨난 흥미로운 현상은 <mark>‘사회적 증거’</mark>라는 개념이다.</p></div><div class=\"ck-via\"><i>▼</i><span>사회적 증거 + 친구 = 더 큰 힘, 핵심어 trust(신뢰) 등장</span></div><div class=\"ck-step\"><span class=\"lab\">①(3번) · 친구가 더하면 더 강해짐</span><div class=\"en\">… then social proof has even more power … relying on <mark>the trust</mark> that people put in the judgments of their close friends.</div><p class=\"ko\">사회적 증거는 친한 친구들의 판단에 두는 <mark>신뢰</mark>에 의존해 훨씬 더 큰 힘을 가진다.</p></div><div class=\"ck-via\"><i>▼</i><span>For example(예를 들어): ‘좋아요’ 많은 영상 = 사회적 증거</span></div><div class=\"ck-step\"><span class=\"lab\">②(4번) · 사회적 증거의 예</span><div class=\"en\">For example, a video about some issue may be controversial on its own but <mark>more credible</mark> if it got thousands of likes.</div><p class=\"ko\">예를 들어, 어떤 문제에 대한 영상은 그 자체로는 논란이 될 수 있지만 수천 개의 ‘좋아요’를 얻으면 <mark>더 신뢰할 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>신뢰·신뢰도 이야기가 갑자기 감정 표현 방법으로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">③(5번) · 이탈 지점</span><div class=\"en\">When expressing feelings of liking to friends, you can express them using <mark>nonverbal cues</mark> such as facial expressions.</div><p class=\"ko\">친구들에게 좋아함의 감정을 표현할 때, 표정과 같은 <mark>비언어적 신호를</mark> 이용해 표현할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>③을 빼면 ②의 영상 → ④의 친구가 추천한 영상으로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">④(6번) · 다시 제자리</span><div class=\"en\">If a friend recommends the video to you, … <mark>the credibility</mark> of the idea it presents will rise in direct proportion to the trust you place in the friend …</div><p class=\"ko\">친구가 영상을 추천하면, 그것이 제시하는 아이디어의 <mark>신뢰도</mark>는 그 친구에게 두는 신뢰에 정비례하여 상승할 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">친구에게 좋아하는 감정을 표정 같은 비언어적 신호로 표현하기<small>신뢰·사회적 증거가 아니라 감정 표현 방법 이야기라 흐름에서 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">친구가 추천한 영상은 그 친구를 믿는 만큼 신뢰도가 오른다</span><span class=\"why\">③처럼 friend(친구)가 나와 헷갈리지만, the video(그 영상)와 credibility(신뢰도)로 ②의 영상 예시를 그대로 이어 가요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">새 아이디어를 받아들이는 사람이 친구라면 사회적 증거의 힘이 더 커진다</span><span class=\"why\">1·2번의 사회적 증거에 친구를 더한 말이에요. 글의 핵심어 trust(신뢰)가 여기서 처음 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">‘좋아요’를 수천 개 얻은 영상은 더 믿을 만해진다</span><span class=\"why\">For example(예를 들어)로 사회적 증거의 실제 예를 보여 줘요. more credible(더 신뢰할 수 있는)이 화제와 딱 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">이것이 소셜 미디어의 힘이자 게시물이 입소문 나는 이유</span><span class=\"why\">This(이것)가 ②·④의 영상·친구 추천 이야기를 받아 “소셜 미디어의 힘”으로 1번 화제를 마무리해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">An interesting phenomenon</div><div class=\"k\">흥미로운 현상은</div></div><div class=\"rc\"><div class=\"e\">that arose from social media</div><div class=\"k\">소셜 미디어에서 생겨난</div></div><div class=\"rc ckc\"><div class=\"e\">is the concept of <span class=\"cw\">social proof</span>.</div><div class=\"k\">‘<span class=\"cw\">사회적 증거</span>’라는 개념이다.</div></div><div class=\"rnat\">소셜 미디어에서 생겨난 흥미로운 현상은 ‘사회적 증거’라는 개념이다.</div><div class=\"rst\">요즘 반에서 다들 보는 영상, 나도 괜히 보게 되죠? 지문은 이걸 소셜 미디어에서 생긴 <b>사회적 증거</b>(social proof)라고 불러요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It’s easier for a person</div><div class=\"k\">사람이 ~하기가 더 쉽다</div></div><div class=\"rc\"><div class=\"e\">to accept new values or ideas</div><div class=\"k\">새로운 가치나 아이디어를 받아들이기가</div></div><div class=\"rc\"><div class=\"e\">when they see</div><div class=\"k\">그들(= 사람들)이 볼 때</div></div><div class=\"rc\"><div class=\"e\">that others have already done so.</div><div class=\"k\">다른 사람들이 이미 그렇게(= 받아들이는 것을) 했다는 것을.</div></div><div class=\"rnat\">다른 사람들이 이미 그렇게 했다는(받아들였다는) 것을 알 때 사람은 새로운 가치나 아이디어를 받아들이기가 더 쉽다.</div><div class=\"rst\">반 애들이 다 쓰는 필통이면 나도 “괜찮은가 보다” 하고 쉽게 받아들여요. = 남들이 이미 받아들인 걸 보면 쉽다는 지문 2번.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If the person they see accepting the new idea</div><div class=\"k\">만약 그들(= 사람들)이 새로운 아이디어를 받아들이고 있다고 보는 그 사람이</div></div><div class=\"rc\"><div class=\"e\">happens to be a friend,</div><div class=\"k\">우연히 친구라면,</div></div><div class=\"rc\"><div class=\"e\">then social proof has even more power</div><div class=\"k\">그때 사회적 증거는 훨씬 더 큰 힘을 가진다</div></div><div class=\"rc\"><div class=\"e\">by exerting peer pressure</div><div class=\"k\">또래 압력을 행사함으로써</div></div><div class=\"rc ckc\"><div class=\"e\">as well as relying on <span class=\"cw\">the trust</span></div><div class=\"k\"><span class=\"cw\">신뢰에</span> 의존할 뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">that people put in the judgments of their close friends.</div><div class=\"k\">사람들이 그들의 친한 친구들의 판단에 두는.</div></div><div class=\"rnat\">① 만약 그들이 새로운 아이디어를 받아들이고 있다고 보는 그 사람이 우연히 친구라면, 그때 사회적 증거는 사람들이 그들의 친한 친구들의 판단에 두는 신뢰에 의존할 뿐만 아니라 또래 압력을 행사함으로써 훨씬 더 큰 힘을 가진다.</div><div class=\"rst\">① 그걸 쓰는 애가 내 단짝이면 더 확 끌려요. 친구 판단을 믿고 눈치도 보이니까요. = 지문의 <b>신뢰</b>(trust)와 또래 압력.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">a video about some issue</div><div class=\"k\">어떤 문제에 대한 영상은</div></div><div class=\"rc\"><div class=\"e\">may be controversial on its own</div><div class=\"k\">그 자체로는 논란이 될 수 있지만</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">more credible</span></div><div class=\"k\"><span class=\"cw\">더 신뢰할 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">if it got thousands of likes.</div><div class=\"k\">그것(= 영상)이 수천 개의 ‘좋아요’를 얻으면.</div></div><div class=\"rnat\">② 예를 들어, 어떤 문제에 대한 영상은 그 자체로는 논란이 될 수 있지만, 그것이 수천 개의 ‘좋아요’를 얻으면 더 신뢰할 수 있다.</div><div class=\"rst\">② 좀 이상해 보이는 영상도 ‘좋아요’가 수천 개면 “맞는 말인가?” 싶어요. = 지문의 더 믿을 만해진다(more credible).</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">When expressing feelings of liking</div><div class=\"k\">좋아함의 감정을 표현할 때</div></div><div class=\"rc\"><div class=\"e\">to friends,</div><div class=\"k\">친구들에게,</div></div><div class=\"rc\"><div class=\"e\">you can express them</div><div class=\"k\">당신은 그것들(= 좋아함의 감정)을 표현할 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\">using <span class=\"cw\">nonverbal cues</span></div><div class=\"k\"><span class=\"cw\">비언어적 신호를</span> 이용해</div></div><div class=\"rc\"><div class=\"e\">such as facial expressions.</div><div class=\"k\">표정과 같은.</div></div><div class=\"rnat\">③ 친구들에게 좋아함의 감정을 표현할 때, 당신은 표정과 같은 비언어적 신호를 이용해 그것들을 표현할 수 있다.</div><div class=\"rst\">③ 갑자기 “친구에게 좋아하는 마음은 표정으로도 전할 수 있다”는 얘기가 나와요. 믿음이 아니라 <b>감정 표현 방법</b>이라 튀어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">If a friend recommends the video to you,</div><div class=\"k\">만약 한 친구가 당신에게 영상을 추천한다면,</div></div><div class=\"rc\"><div class=\"e\">in many cases,</div><div class=\"k\">많은 경우에 있어,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the credibility</span> of the idea</div><div class=\"k\">그 아이디어의 <span class=\"cw\">신뢰도는</span></div></div><div class=\"rc\"><div class=\"e\">it presents</div><div class=\"k\">그것(= 영상)이 제시하는</div></div><div class=\"rc\"><div class=\"e\">will rise</div><div class=\"k\">상승할 것이다</div></div><div class=\"rc\"><div class=\"e\">in direct proportion to the trust</div><div class=\"k\">신뢰도에 정비례하여</div></div><div class=\"rc\"><div class=\"e\">you place in the friend</div><div class=\"k\">당신이 그 친구에게 두는</div></div><div class=\"rc\"><div class=\"e\">recommending the video.</div><div class=\"k\">영상을 추천하는.</div></div><div class=\"rnat\">④ 만약에 한 친구가 당신에게 영상을 추천한다면, 많은 경우에 있어, 그것(영상)이 제시하는 아이디어의 신뢰도는 당신이 영상을 추천하는 친구에게 두는 신뢰도에 정비례하여 상승할 것이다.</div><div class=\"rst\">④ 다시 영상 얘기예요. 단짝이 추천한 영상은 그 친구를 믿는 만큼 더 믿음이 가요. = 지문의 신뢰도(credibility)가 비례해 오른다.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">This is the power of social media</div><div class=\"k\">이것이 소셜 미디어의 힘이고</div></div><div class=\"rc\"><div class=\"e\">and part of the reason</div><div class=\"k\">그리고 이유의 일부이다</div></div><div class=\"rc\"><div class=\"e\">why videos or “posts”</div><div class=\"k\">왜 영상이나 ‘게시물’이</div></div><div class=\"rc\"><div class=\"e\">can become “viral.”</div><div class=\"k\">‘입소문이 날’ 수 있는지.</div></div><div class=\"rnat\">⑤ 이것이 소셜 미디어의 힘이고 영상이나 ‘게시물’이 ‘입소문이 날’ 수 있는 이유의 일부이다.</div><div class=\"rst\">⑤ 그래서 영상 하나가 반 전체, 학교 전체로 퍼져요. = 지문의 소셜 미디어의 힘, 입소문(viral)이 나는 이유예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"social proof\" data-m=\"사회적 증거\"><b>social proof</b>사회적 증거</button><button type=\"button\" class=\"wdb\" data-w=\"exert\" data-m=\"(영향력을) 행사하다\"><b>exert</b>(영향력을) 행사하다</button><button type=\"button\" class=\"wdb\" data-w=\"peer pressure\" data-m=\"또래 압력\"><b>peer pressure</b>또래 압력</button><button type=\"button\" class=\"wdb\" data-w=\"credible\" data-m=\"믿을 만한\"><b>credible</b>믿을 만한</button><button type=\"button\" class=\"wdb\" data-w=\"in direct proportion to\" data-m=\"~에 정비례하여\"><b>in direct proportion to</b>~에 정비례하여</button><button type=\"button\" class=\"wdb\" data-w=\"viral\" data-m=\"입소문이 나는\"><b>viral</b>입소문이 나는</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제예요. However(하지만)가 뒤집을 말은 “<b>땅과 물 모두</b> 영향을 받는다”예요. 주어진 문장의 land(땅)·water(물) 비교가 바로 그 말을 받아야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>However</mark>, the rigidity of rock means that land rises and falls with the tides <mark>by a much smaller amount than water</mark>, which is why we notice only the ocean tides.</div><p class=\"ko\"><mark>하지만</mark> 암석의 단단함은 땅이 <mark>물보다 훨씬 더 적은 양만큼</mark> 조수와 함께 오르내린다는 것을 의미하며, 이것이 우리가 바다의 조수만 알아차리는 이유이다.</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만)가 뒤집을 “땅도 물도 똑같이 늘어난다”가 여기</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 · 앞 문장 (③ 바로 앞)</span><div class=\"en\">The tidal stretching caused by the Moon’s gravity affects our entire planet, <mark>including both land and water</mark>, inside and out.</div><p class=\"ko\">달의 중력에 의해 발생되는 조수의 늘어남은 <mark>땅과 물 모두를 포함해</mark> 우리의 전체 행성에 안팎으로 영향을 미친다.</p></div><div class=\"ck-via\"><i>▼</i><span>주어진 문장의 “바다 조수만 보인다” → 바다의 만조 두 번 설명으로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 뒤 문장 (③ 바로 뒤)</span><div class=\"en\">The stretching <mark>also explains</mark> why there are generally two high tides (and two low tides) in the ocean each day.</div><p class=\"ko\">그 늘어남은 <mark>또한</mark> 왜 일반적으로 매일 바다에서 두 번의 만조(그리고 두 번의 간조)가 있는지 <mark>설명한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>늘어남은 땅과 물 모두에 영향</span><span><em>주어진 문장</em>하지만 땅은 훨씬 적게 → 바다 조수만 보임</span><span><em>5번</em>그 늘어남이 또 설명하는 것: 바다의 만조 두 번</span></div><div class=\"ck-eq\">⇒ 모두 → 하지만 땅은 적게 → 바다 이야기, 세 고리가 다 맞는 자리 = ③</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">4번 문장과 5번 문장 사이<small>4번의 both land and water(땅과 물 모두)를 However(하지만)로 바로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번에서 이미 늘어나고 눌린다고 해서 그럴듯하지만, 땅·물 이야기가 아직 안 나왔어요. However(하지만)가 뒤집을 “땅과 물 모두”는 4번에서야 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">3번 It(그것)은 2번의 stretching force(잡아 늘이는 힘)를 바로 받아요. 사이에 끼우면 It(그것)이 가리킬 대상이 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">5번이 “만조가 왜 두 번인지” 설명을 시작했고, 6번 Because(~ 때문에)가 그 이유를 이어 가요. 중간에 땅 이야기가 끼면 설명이 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">6·7번은 바다가 양쪽으로 부풀고 그곳을 지나는 이야기가 계속돼요. 바로 앞에 “땅과 물 모두”가 없어 However(하지만)가 뒤집을 게 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span></div></div><div class=\"rc\"><div class=\"e\">the rigidity of rock means</div><div class=\"k\">암석의 단단함은 의미한다</div></div><div class=\"rc\"><div class=\"e\">that land rises and falls with the tides</div><div class=\"k\">땅이 조수와 함께 오르락내리락한다는 것을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">by a much smaller amount than water</span>,</div><div class=\"k\"><span class=\"cw\">물보다 훨씬 더 적은 양만큼</span>,</div></div><div class=\"rc\"><div class=\"e\">which is why we notice only the ocean tides.</div><div class=\"k\">그리고 이것(= 땅이 물보다 훨씬 적게 오르내리는 것)이 우리가 오직 바다의 조수를 알아차리는 이유이다.</div></div><div class=\"rnat\">[주어진 문장] 하지만 암석의 단단함은 땅이 물보다 훨씬 더 적은 양만큼 조수와 함께 오르락내리락한다는 것을 의미하며, 이것이 우리가 오직 바다의 조수를 알아차리는 이유이다.</div><div class=\"rst\">〈주어진 문장〉 <b>하지만</b>(However) 딱딱한 돌땅은 물보다 훨씬 조금만 오르내려요. 그래서 우리 눈엔 바다 조수만 보여요. = 지문의 암석의 단단함.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The difference in the Moon’s gravitational pull</div><div class=\"k\">달 중력의 차이는</div></div><div class=\"rc\"><div class=\"e\">on different parts of our planet</div><div class=\"k\">우리 행성의 서로 다른 부분들에 대한</div></div><div class=\"rc\"><div class=\"e\">effectively creates</div><div class=\"k\">효과적으로 만든다</div></div><div class=\"rc\"><div class=\"e\">a “stretching force.”</div><div class=\"k\">‘잡아 늘이는 힘’을.</div></div><div class=\"rnat\">우리 행성의 서로 다른 부분들에 대한 달 중력의 차이는 효과적으로 ‘잡아 늘이는 힘’을 만든다.</div><div class=\"rst\">과학 시간에 고무줄을 양쪽으로 당겨 보듯, 달은 지구의 가까운 쪽과 먼 쪽을 다르게 당겨요. = 지문 2번의 <b>잡아 늘이는 힘</b>.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It makes our planet</div><div class=\"k\">그것(= ‘잡아 늘이는 힘’)은 우리 행성을 ~하게 만든다</div></div><div class=\"rc\"><div class=\"e\">slightly stretched out</div><div class=\"k\">약간 늘어나게</div></div><div class=\"rc\"><div class=\"e\">along the line of sight to the Moon</div><div class=\"k\">달을 보는 방향으로</div></div><div class=\"rc\"><div class=\"e\">and slightly compressed</div><div class=\"k\">그리고 약간 눌리게</div></div><div class=\"rc\"><div class=\"e\">along a line perpendicular to that.</div><div class=\"k\">그것(= 달을 보는 방향의 선)에 직각을 이루는 선을 따라.</div></div><div class=\"rnat\">( ① ) 그것은 우리 행성을 달을 보는 방향으로 약간 늘어나게 하고 그것에 직각을 이루는 선을 따라 약간 눌리게 한다.</div><div class=\"rst\">그러면 지구는 달 쪽으로 살짝 길쭉해지고, 옆으로는 살짝 눌려요. = 지문 3번의 늘어나고 눌리는 모양이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">The tidal stretching</div><div class=\"k\">조수의 늘어남은</div></div><div class=\"rc\"><div class=\"e\">caused by the Moon’s gravity</div><div class=\"k\">달의 중력에 의해 발생되는</div></div><div class=\"rc\"><div class=\"e\">affects our entire planet,</div><div class=\"k\">우리의 전체 행성에 영향을 미친다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">including both land and water</span>,</div><div class=\"k\"><span class=\"cw\">땅과 물 모두를 포함해</span>,</div></div><div class=\"rc\"><div class=\"e\">inside and out.</div><div class=\"k\">안팎으로.</div></div><div class=\"rnat\">( ② ) 달의 중력에 의해 발생되는 조수의 늘어남은 땅과 물을 포함한 우리의 전체 행성에 안팎으로 영향을 미친다.</div><div class=\"rst\">이 당김은 땅이든 물이든 <b>모두</b>(both land and water) 받아요. 지구 안팎이 다 늘어나요. = 지문 4번이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">The stretching <span class=\"cw\">also explains</span></div><div class=\"k\">그 늘어남은 <span class=\"cw\">또한 설명한다</span></div></div><div class=\"rc\"><div class=\"e\">why there are generally two high tides</div><div class=\"k\">왜 일반적으로 두 번의 만조가 있는지</div></div><div class=\"rc\"><div class=\"e\">(and two low tides)</div><div class=\"k\">(그리고 두 번의 간조)</div></div><div class=\"rc\"><div class=\"e\">in the ocean each day.</div><div class=\"k\">바다에서 매일.</div></div><div class=\"rnat\">( ③ ) 그 늘어남은 또한 왜 일반적으로 매일 바다에서 ‘두 번의’ 만조(그리고 두 번의 간조)가 발생하는지 설명한다.</div><div class=\"rst\">그 늘어남으로 바다에 하루 <b>두 번</b> 물이 차오르는(만조) 이유도 설명돼요. = 지문 5번이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Because Earth is stretched</div><div class=\"k\">지구가 늘어나기 때문에</div></div><div class=\"rc\"><div class=\"e\">much like a rubber band,</div><div class=\"k\">고무줄처럼,</div></div><div class=\"rc\"><div class=\"e\">the oceans bulge out</div><div class=\"k\">바다는 부풀어 나간다</div></div><div class=\"rc\"><div class=\"e\">both on the side facing toward the Moon</div><div class=\"k\">달을 향하는 쪽과</div></div><div class=\"rc\"><div class=\"e\">and on the side facing away from the Moon.</div><div class=\"k\">달에서 멀어지는 쪽, 두 곳 모두에서.</div></div><div class=\"rnat\">( ④ ) 지구가 고무줄처럼 늘어나기 때문에, 바다는 달을 향하는 쪽과 달에서 멀어지는 쪽 모두에서 부풀어 나간다.</div><div class=\"rst\">고무줄을 당기면 양 끝이 다 늘어나듯, 바다도 달 쪽과 반대쪽 두 곳에서 불룩해져요. = 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">As Earth rotates,</div><div class=\"k\">지구가 자전함에 따라,</div></div><div class=\"rc\"><div class=\"e\">we are carried through</div><div class=\"k\">우리는 통과하게 된다</div></div><div class=\"rc\"><div class=\"e\">both of these tidal bulges each day,</div><div class=\"k\">매일 이 두 개의 조수 팽창부를,</div></div><div class=\"rc\"><div class=\"e\">so we have high tide</div><div class=\"k\">그래서 우리는 만조를 겪는다</div></div><div class=\"rc\"><div class=\"e\">when we are in each of the two bulges</div><div class=\"k\">우리가 두 개의 팽창부 각각에 있을 때</div></div><div class=\"rc\"><div class=\"e\">and low tide at the midpoints in between.</div><div class=\"k\">그리고 그 사이의 중간 지점에서는 간조를 겪는다.</div></div><div class=\"rnat\">( ⑤ ) 지구가 자전함에 따라 우리는 매일 이 두 개의 조수 팽창부를 통과하게 되어서, 우리가 각각 두 개의 팽창부에 있을 때 만조를 겪고 그 사이의 중간 지점에서 간조를 겪는다.</div><div class=\"rst\">지구가 하루 한 바퀴 돌며 우리는 불룩한 두 곳을 지나요. 거기선 만조, 그 사이에선 간조예요. = 지문 7번이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"rigidity\" data-m=\"단단함, 경직성\"><b>rigidity</b>단단함, 경직성</button><button type=\"button\" class=\"wdb\" data-w=\"gravitational pull\" data-m=\"중력에 의한 당김\"><b>gravitational pull</b>중력에 의한 당김</button><button type=\"button\" class=\"wdb\" data-w=\"compress\" data-m=\"압축하다, 누르다\"><b>compress</b>압축하다, 누르다</button><button type=\"button\" class=\"wdb\" data-w=\"tidal\" data-m=\"조수의\"><b>tidal</b>조수의</button><button type=\"button\" class=\"wdb\" data-w=\"bulge out\" data-m=\"불룩하게 튀어나오다\"><b>bulge out</b>불룩하게 튀어나오다</button><button type=\"button\" class=\"wdb\" data-w=\"rotate\" data-m=\"자전하다, 회전하다\"><b>rotate</b>자전하다, 회전하다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 제목은 <b>첫 문장</b>과 <b>주장 신호</b>가 있는 문장을 묶어 찾으세요. 1번 “단어를 잃는다”로 열고, 8번 have to(~해야 한다)·18번 need to(~해야 한다)로 “되찾고 기억하라”고 닫아요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 제시</span><div class=\"en\">We lose <mark>our words</mark>.</div><p class=\"ko\">우리는 <mark>우리의 단어들을</mark> 잃는다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2~4번</em>intelligence(지능): 넓던 뜻 → 이제 기계도 “지능적”</span><span><em>5~7번</em>affective(감성적인): 깊던 뜻 → 감성 컴퓨팅, 원래 뜻은 잊음</span></div><div class=\"ck-eq\">⇒ 공통점 = 단어가 기계에 맞춰 바뀌며 원래 뜻을 잃음</div></div><div class=\"ck-via\"><i>▼</i><span>뜻을 잃는다 → 그러니 되찾아야 한다</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 첫 번째 주장</span><div class=\"en\">We <mark>have to struggle</mark> to recapture lost language, <mark>lost meanings</mark>, and perhaps, in time, lost experiences.</div><p class=\"ko\">우리는 잃어버린 언어, <mark>잃어버린 의미들</mark>, 그리고 아마도 조만간 잃어버릴 경험들을 되찾기 위해 <mark>전력을 다해야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>9~17번 ‘돌보는 기계’ 사례 뒤, 다시 주장으로 글을 닫음</span></div><div class=\"ck-step key\"><span class=\"lab\">18번 문장 · 결정적 결론</span><div class=\"en\">We <mark>need to remember</mark> these words and this conversation before we don’t know how to have it.</div><p class=\"ko\">우리가 대화하는 법을 모르게 되기 전에, 이러한 단어들과 이 대화를 <mark>기억해야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">Beware of Losing the Meaning of Words 단어의 의미를 잃는 것을 조심하라<small>1번(단어를 잃는다)과 8·18번(되찾고 기억해야 한다)의 경고를 그대로 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">What's Lost When a Language Dies(언어가 사라질 때 잃는 것)</span><span class=\"why\">[지문에 없음] 8번 lost language(잃어버린 언어)만 따온 함정이에요. 글은 한 언어가 사라지는 게 아니라 단어의 뜻이 기계 쪽으로 바뀌는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Artificial Intelligence(인공지능): Good or Evil(선인가 악인가)?</span><span class=\"why\">[지문에 없음] 인공지능이 좋은지 나쁜지 따지는 문장은 없어요. 2번의 artificial intelligence(인공지능)는 단어 뜻이 바뀐 예일 뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Will Robots Care for You in the Future(미래에 로봇이 당신을 돌볼까)?</span><span class=\"why\">[범위 좁음] 9~10번 ‘돌보는 기계’ 사례만 다뤄요. 그 사례도 로봇이 돌볼지가 아니라 caring(돌봄)이라는 단어 뜻을 따지는 장면이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Harmony Between Humans and Machines(인간과 기계의 조화)</span><span class=\"why\">[반대] 글쓴이는 19번에서 기계와 대화할 수 있다고 믿게 되는 걸 경계해요. 조화가 아니라 경고하는 글이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We lose</div><div class=\"k\">우리는 잃는다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">our words</span>.</div><div class=\"k\"><span class=\"cw\">우리의 단어들을</span>.</div></div><div class=\"rnat\">우리는 우리의 단어들을 잃는다.</div><div class=\"rst\">우리 학교 로봇 축제 장면으로 따라가요. 지문은 첫 줄부터 “우리는 <b>단어를 잃는다</b>”고 경고해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Intelligence once meant more</div><div class=\"k\">‘Intelligence(지능)’는 한때 더 많은 것을 의미했다</div></div><div class=\"rc\"><div class=\"e\">than what any artificial intelligence does.</div><div class=\"k\">어떤 인공지능이 (현재 의미)하는 것보다.</div></div><div class=\"rnat\">‘Intelligence(지능)’는 한때 어떤 인공지능이 (현재 의미)하는 것보다 더 많은 것을 의미했다.</div><div class=\"rst\">원래 ‘똑똑하다’는 말은 지금 AI(인공지능)가 하는 것보다 훨씬 넓은 뜻이었어요. = 지문의 intelligence(지능).</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It used to include</div><div class=\"k\">그것(= intelligence)은 ~을 포함하곤 했다</div></div><div class=\"rc\"><div class=\"e\">sensibility, sensitivity, awareness,</div><div class=\"k\">감각, 감성, 인지,</div></div><div class=\"rc\"><div class=\"e\">reason, wit, etc.</div><div class=\"k\">이성, 재치 등을.</div></div><div class=\"rnat\">그것은 감각, 감성, 인지, 이성, 재치 등을 포함하곤 했다.</div><div class=\"rst\">친구 마음을 알아채는 눈치, 재치, 따져 생각하는 힘까지 다 ‘똑똑함’이었어요. = 지문의 감성·인지·이성·재치.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">And yet</div><div class=\"k\">그럼에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">we readily call machines intelligent</div><div class=\"k\">우리는 주저 없이 기계가 지능적이라고 여긴다</div></div><div class=\"rc\"><div class=\"e\">now.</div><div class=\"k\">이제.</div></div><div class=\"rnat\">그럼에도 불구하고 이제 우리는 주저 없이 기계가 지능적이라고 여긴다.</div><div class=\"rst\"><b>그런데도</b>(And yet) 이제 우리는 계산만 빠른 로봇도 선뜻 “똑똑하다”고 불러요. = 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Affective is another word</div><div class=\"k\">‘Affective(감성적인)’는 또 다른 단어이다</div></div><div class=\"rc\"><div class=\"e\">that once meant</div><div class=\"k\">한때 의미했던(= 단어)</div></div><div class=\"rc\"><div class=\"e\">a lot more</div><div class=\"k\">훨씬 더 많은 것을</div></div><div class=\"rc\"><div class=\"e\">than what any machine can deliver.</div><div class=\"k\">(현재) 어떤 기계가 전달할 수 있는 것보다.</div></div><div class=\"rnat\">‘Affective(감성적인)’는 한때 (현재) 어떤 기계가 전달할 수 있는 것보다 훨씬 더 많은 것을 의미했던 또 다른 단어이다.</div><div class=\"rst\">‘감성적인’(affective)이라는 말도 원래는 어떤 기계도 못 따라올 만큼 깊은 뜻이었어요. = 지문 5번이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Yet we have become used to</div><div class=\"k\">하지만 우리는 ~에 익숙해져 왔다</div></div><div class=\"rc\"><div class=\"e\">describing machines</div><div class=\"k\">기계를 묘사하는 것에</div></div><div class=\"rc\"><div class=\"e\">that portray emotional states</div><div class=\"k\">(기계 스스로의) 감정 상태를 표현하거나</div></div><div class=\"rc\"><div class=\"e\">or can sense our emotional states</div><div class=\"k\">혹은 우리의 감정 상태를 감지할 수 있는</div></div><div class=\"rc\"><div class=\"e\">as exemplars of “affective computing.”</div><div class=\"k\">‘affective computing(감성 컴퓨팅)’의 전형으로.</div></div><div class=\"rnat\">하지만 우리는 (기계 스스로의) 감정 상태를 표현하거나 우리의 감정 상태를 감지할 수 있는 기계를 ‘affective computing(감성 컴퓨팅)’의 전형으로 묘사하는 것에 익숙해져 왔다.</div><div class=\"rst\"><b>하지만</b>(Yet) 축제에서 표정 짓는 로봇을 보고 다들 “감성 로봇이네” 하는 게 익숙해졌어요. = 지문의 감성 컴퓨팅.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">These new meanings</div><div class=\"k\">이러한 새로운 의미들은</div></div><div class=\"rc\"><div class=\"e\">become our new normal,</div><div class=\"k\">우리의 새로운 표준이 되고,</div></div><div class=\"rc\"><div class=\"e\">and we forget other meanings.</div><div class=\"k\">우리는 다른 의미들을 잊는다.</div></div><div class=\"rnat\">이러한 새로운 의미들은 우리의 새로운 표준이 되고, 우리는 다른 의미들을 잊는다.</div><div class=\"rst\">그 새 뜻이 당연해지면, 원래의 깊은 뜻은 잊혀요. = 지문 7번, 새 뜻이 새로운 표준(new normal)이 되고 다른 의미는 잊는대요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">We <span class=\"cw\">have to struggle</span></div><div class=\"k\">우리는 <span class=\"cw\">전력을 다해야 한다</span></div></div><div class=\"rc\"><div class=\"e\">to recapture lost language,</div><div class=\"k\">잃어버린 언어를 되찾기 위해,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">lost meanings</span>,</div><div class=\"k\"><span class=\"cw\">잃어버린 의미들을</span>,</div></div><div class=\"rc\"><div class=\"e\">and perhaps, in time,</div><div class=\"k\">그리고 아마도, 조만간,</div></div><div class=\"rc\"><div class=\"e\">lost experiences.</div><div class=\"k\">잃어버린(잃어버릴) 경험들을.</div></div><div class=\"rnat\">우리는 잃어버린 언어, 잃어버린 의미들, 그리고 아마도, 조만간, 잃어버린(잃어버릴) 경험들을 되찾기 위해 전력을 다해야 한다.</div><div class=\"rst\">그래서 우리는 <b>잃어버린 말과 뜻을 되찾으려 애써야</b> 해요. = 지문 8번, 글쓴이의 첫 주장이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">At one conference I attended,</div><div class=\"k\">내가 참석했던 한 회의에서,</div></div><div class=\"rc\"><div class=\"e\">the robots were called “caring machines,”</div><div class=\"k\">로봇들은 ‘caring machines(돌보는 기계)’라고 불렸는데,</div></div><div class=\"rc\"><div class=\"e\">and when I objected,</div><div class=\"k\">내가 이의를 제기했을 때,</div></div><div class=\"rc\"><div class=\"e\">I was told</div><div class=\"k\">나는 ~라는 말을 들었다</div></div><div class=\"rc\"><div class=\"e\">we were using this word</div><div class=\"k\">우리가 이 단어(= caring)를 사용하고 있다는</div></div><div class=\"rc\"><div class=\"e\">not because the robots care</div><div class=\"k\">로봇이 마음을 쓰기 때문이 아니라</div></div><div class=\"rc\"><div class=\"e\">but because they will take care of us.</div><div class=\"k\">그들(= 로봇들)이 우리를 돌볼 것이기 때문에.</div></div><div class=\"rnat\">내가 참석했던 한 회의에서 로봇들은 ‘caring machines(돌보는 기계)’라고 불렸는데, 내가 (그렇게 부르는 것에) 이의를 제기했을 때, 나는 로봇이 마음을 쓰기 때문이 아니라 그들이 우리를 돌볼 것이기 때문에 우리가 이 단어를 사용하고 있다는 말을 들었다.</div><div class=\"rst\">축제에서 로봇을 ‘돌보는 기계’라 불러서 내가 따지자, “마음을 써서가 아니라 우리를 돌봐 줘서”라는 답이 왔어요. = 지문 9번.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">The conference participants believed</div><div class=\"k\">회의 참가자들은 생각했다</div></div><div class=\"rc\"><div class=\"e\">caring is a behavior, a function,</div><div class=\"k\">돌보는 것은 행동, 즉 기능이지,</div></div><div class=\"rc\"><div class=\"e\">not a feeling.</div><div class=\"k\">감정이 아니라고.</div></div><div class=\"rnat\">회의 참가자들은 돌보는 것은 행동, 즉 기능이지 감정이 아니라고 생각했다.</div><div class=\"rst\">다른 사람들은 ‘돌본다’는 건 마음이 아니라 그냥 하는 일, 즉 기능이라고 생각했어요. = 지문 10번이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">They seemed puzzled:</div><div class=\"k\">그들(= 회의 참가자들)은 당황스러워 보였다.</div></div><div class=\"rc\"><div class=\"e\">Why did I care so much</div><div class=\"k\">왜 나는 그렇게 신경을 썼을까</div></div><div class=\"rc\"><div class=\"e\">about semantics?</div><div class=\"k\">의미론에?</div></div><div class=\"rnat\">그들은 당황스러워 보였다. 왜 나는 의미론에 그렇게 신경을 썼을까?</div><div class=\"rst\">그들은 “왜 그렇게 단어 뜻에 신경 써?” 하며 어리둥절해했어요. = 지문의 의미론(semantics)이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">What’s wrong</div><div class=\"k\">무슨 문제가 있는 걸까</div></div><div class=\"rc\"><div class=\"e\">with me?</div><div class=\"k\">나에게?</div></div><div class=\"rnat\">나에게 무슨 문제가 있는 걸까?</div><div class=\"rst\">“쟤 왜 저래?” 하는 눈빛이었죠. = 지문 12번, 나한테 무슨 문제가 있냐는 말이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">It is natural</div><div class=\"k\">당연하다</div></div><div class=\"rc\"><div class=\"e\">for words to change their meaning</div><div class=\"k\">단어들의 의미가 변하는 것은</div></div><div class=\"rc\"><div class=\"e\">over time</div><div class=\"k\">시간이 흐르면서</div></div><div class=\"rc\"><div class=\"e\">and with new circumstances.</div><div class=\"k\">그리고 새로운 환경에서.</div></div><div class=\"rnat\">시간이 흐르고 새로운 환경에서 단어들의 의미가 변하는 것은 당연하다.</div><div class=\"rst\">물론 시간이 지나 상황이 바뀌면 단어 뜻이 변하는 건 자연스러워요. = 지문 13번이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Intelligence and affective</div><div class=\"k\">‘Intelligence(지능)’와 ‘affective(감성적인)’는</div></div><div class=\"rc\"><div class=\"e\">have changed their meaning</div><div class=\"k\">의미를 변화시켜 왔다</div></div><div class=\"rc\"><div class=\"e\">to accommodate</div><div class=\"k\">수용하기 위해※ 문제지엔 빈칸으로 되어 있음(12번 정답)</div></div><div class=\"rc\"><div class=\"e\">what machines can do.</div><div class=\"k\">기계가 할 수 있는 것을.</div></div><div class=\"rnat\">‘Intelligence(지능)’와 ‘affective(감성적인)’는 기계가 할 수 있는 것을 수용하기 위해 의미를 변화시켜 왔다(의미가 변해 왔다).</div><div class=\"rst\">‘똑똑하다’, ‘감성적인’은 로봇이 할 수 있는 만큼으로 뜻이 <b>맞춰져</b> 왔어요. = 지문의 accommodate(수용하다).</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">But now</div><div class=\"k\">그러나 이제</div></div><div class=\"rc\"><div class=\"e\">the words caring, friend,</div><div class=\"k\">‘caring(돌보는)’, ‘friend(친구)’,</div></div><div class=\"rc\"><div class=\"e\">companionship, and conversation?</div><div class=\"k\">‘companionship(우정)’, 그리고 ‘conversation(대화)’ (같은) 단어들은 (어떻게 될까)?</div></div><div class=\"rnat\">그러나 이제 ‘caring(돌보는)’, ‘friend(친구)’, ‘companionship(우정)’, 그리고 ‘conversation(대화)’(같은) 단어들은 (어떻게 될까)?</div><div class=\"rst\"><b>그러나 이제</b>(But now) ‘돌봄’, ‘친구’, ‘우정’, ‘대화’라는 말은 어떻게 될까요? = 지문 15번의 질문이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">A lot is at stake</div><div class=\"k\">많은 것이 위태롭다</div></div><div class=\"rc\"><div class=\"e\">in these words.</div><div class=\"k\">이러한 단어들에서.</div></div><div class=\"rnat\">이러한 단어들에서 많은 것(단어)들이 위태롭다.</div><div class=\"rst\">이 단어들에는 <b>많은 것이 걸려 있어요</b>. = 지문의 at stake(위태로운)예요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">They are not yet lost.</div><div class=\"k\">그것들(= 이 단어들)은 아직 사라지지 않았다.</div></div><div class=\"rnat\">그것들은 아직 사라지지 않았다.</div><div class=\"rst\">다행히 아직 잃어버리진 않았어요. = 지문 17번, 아직 사라지지 않았다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"18\"><span class=\"rn\">18번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">We <span class=\"cw\">need to remember</span></div><div class=\"k\">우리는 <span class=\"cw\">기억해야 한다</span></div></div><div class=\"rc\"><div class=\"e\">these words and this conversation</div><div class=\"k\">이러한 단어들과 이 대화를</div></div><div class=\"rc\"><div class=\"e\">before we don’t know</div><div class=\"k\">우리가 모르게 되기 전에</div></div><div class=\"rc\"><div class=\"e\">how to have it.</div><div class=\"k\">그것(= 대화)을 하는 법을.</div></div><div class=\"rnat\">우리가 그것(대화)을 하는 법을 모르게 되기 전에, 이러한 단어들과 이 대화를 기억해야 한다.</div><div class=\"rst\">진짜 친구와 수다 떠는 법을 잊기 전에 <b>이 단어들과 대화를 기억해야</b> 해요. = 지문 18번, 글의 결론이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">Or before we think</div><div class=\"k\">아니면 우리가 ~라고 생각하기 전에</div></div><div class=\"rc\"><div class=\"e\">we can have it</div><div class=\"k\">우리가 그것(= 대화)을 할 수 있다고</div></div><div class=\"rc\"><div class=\"e\">with a machine.</div><div class=\"k\">기계와.</div></div><div class=\"rnat\">아니면 우리가 기계와 그것(대화)을 할 수 있다고 생각하기 전에.</div><div class=\"rst\">아니면 로봇이랑도 그런 대화가 된다고 착각하기 전에요. = 지문 19번, 그래서 제목은 “단어의 의미를 잃는 것을 조심하라”예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"readily\" data-m=\"선뜻, 쉽게\"><b>readily</b>선뜻, 쉽게</button><button type=\"button\" class=\"wdb\" data-w=\"portray\" data-m=\"묘사하다, 드러내다\"><b>portray</b>묘사하다, 드러내다</button><button type=\"button\" class=\"wdb\" data-w=\"exemplar\" data-m=\"전형, 본보기\"><b>exemplar</b>전형, 본보기</button><button type=\"button\" class=\"wdb\" data-w=\"new normal\" data-m=\"새로운 표준\"><b>new normal</b>새로운 표준</button><button type=\"button\" class=\"wdb\" data-w=\"recapture\" data-m=\"되찾다\"><b>recapture</b>되찾다</button><button type=\"button\" class=\"wdb\" data-w=\"at stake\" data-m=\"걸려 있는, 위태로운\"><b>at stake</b>걸려 있는, 위태로운</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 두 단어의 뜻이 <b>어느 방향으로</b> 바뀌었는지 묻는 자리예요. 2~6번에서 넓던 뜻이 <b>기계가 하는 만큼에 맞춰졌다</b>는 흐름을 그대로 받는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (14번)</span><div class=\"en\">Intelligence and affective have changed their meaning to <span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> <mark>what machines can do</mark>.</div><p class=\"ko\">‘지능’과 ‘감성적인’은 <mark>기계가 할 수 있는 것을</mark> ( ? )하기 위해 의미를 변화시켜 왔다</p></div><div class=\"ck-via\"><i>▼</i><span>원래 intelligence(지능)는 기계가 하는 것보다 넓었음</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 원래 뜻</span><div class=\"en\">Intelligence <mark>once meant more</mark> than what any artificial intelligence does.</div><p class=\"ko\">‘Intelligence(지능)’는 어떤 인공지능이 하는 것보다 <mark>한때 더 많은 것을 의미했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>넓던 뜻이 기계 쪽에 맞춰져, 기계도 “지능적”이라 부름</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">And yet we <mark>readily call machines intelligent</mark> now.</div><p class=\"ko\">그럼에도 불구하고 이제 우리는 <mark>주저 없이 기계가 지능적이라고 여긴다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>affective(감성적인)도 똑같이 기계에 맞춰짐</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 같은 일이 한 번 더</span><div class=\"en\">Yet we have become used to describing machines … as exemplars of “<mark>affective computing</mark>.”</div><p class=\"ko\">하지만 우리는 기계를 ‘<mark>affective computing(감성 컴퓨팅)</mark>’의 전형으로 묘사하는 것에 익숙해져 왔다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2·4번</em>지능: 넓던 뜻 → 기계도 지능적</span><span><em>5·6번</em>감성적인: 깊던 뜻 → 감성 컴퓨팅</span></div><div class=\"ck-eq\">⇒ 두 단어 모두 기계가 하는 만큼으로 뜻을 맞춰 넣음 = accommodate(수용하다, 맞추다)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">accommodate (맞게) 수용하다, 맞추다<small>기계가 하는 만큼으로 단어 뜻을 맞춰 넣었다는 2~6번 흐름 그대로예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">restrict 제한하다</span><span class=\"why\">뜻이 좁아졌으니 그럴듯하지만, 기계가 하는 일을 제한한 게 아니라 기계에 뜻을 맞춰 준 거예요. 4번에서 기계를 readily(선뜻) 지능적이라 불러 줬어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">praise 칭찬하다</span><span class=\"why\">기계를 칭찬하려고 뜻을 바꾼 게 아니에요. 7번처럼 새 뜻이 그냥 new normal(새로운 표준)이 된 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">monitor 감시하다</span><span class=\"why\">기계를 감시한다는 말은 지문에 없어요. 6번은 감정을 sense(감지하다)하는 기계를 ‘감성 컴퓨팅’이라 부르게 됐다는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">conceal 숨기다</span><span class=\"why\">기계가 하는 일을 숨긴 게 아니라, 오히려 4번에서 기계를 intelligent(지능적인)라고 드러내 불러요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We lose</div><div class=\"k\">우리는 잃는다</div></div><div class=\"rc\"><div class=\"e\">our words.</div><div class=\"k\">우리의 단어들을.</div></div><div class=\"rnat\">우리는 우리의 단어들을 잃는다.</div><div class=\"rst\">우리 학교 로봇 축제 장면으로 따라가요. 지문은 첫 줄부터 “우리는 <b>단어를 잃는다</b>”고 경고해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc ckc\"><div class=\"e\">Intelligence <span class=\"cw\">once meant more</span></div><div class=\"k\">‘Intelligence(지능)’는 <span class=\"cw\">한때 더 많은 것을 의미했다</span></div></div><div class=\"rc\"><div class=\"e\">than what any artificial intelligence does.</div><div class=\"k\">어떤 인공지능이 (현재 의미)하는 것보다.</div></div><div class=\"rnat\">‘Intelligence(지능)’는 한때 어떤 인공지능이 (현재 의미)하는 것보다 더 많은 것을 의미했다.</div><div class=\"rst\">원래 ‘똑똑하다’는 말은 지금 AI(인공지능)가 하는 것보다 훨씬 넓은 뜻이었어요. = 지문의 intelligence(지능).</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It used to include</div><div class=\"k\">그것(= intelligence)은 ~을 포함하곤 했다</div></div><div class=\"rc\"><div class=\"e\">sensibility, sensitivity, awareness,</div><div class=\"k\">감각, 감성, 인지,</div></div><div class=\"rc\"><div class=\"e\">reason, wit, etc.</div><div class=\"k\">이성, 재치 등을.</div></div><div class=\"rnat\">그것은 감각, 감성, 인지, 이성, 재치 등을 포함하곤 했다.</div><div class=\"rst\">친구 마음을 알아채는 눈치, 재치, 따져 생각하는 힘까지 다 ‘똑똑함’이었어요. = 지문의 감성·인지·이성·재치.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">And yet</div><div class=\"k\">그럼에도 불구하고</div></div><div class=\"rc ckc\"><div class=\"e\">we <span class=\"cw\">readily call machines intelligent</span></div><div class=\"k\">우리는 <span class=\"cw\">주저 없이 기계가 지능적이라고 여긴다</span></div></div><div class=\"rc\"><div class=\"e\">now.</div><div class=\"k\">이제.</div></div><div class=\"rnat\">그럼에도 불구하고 이제 우리는 주저 없이 기계가 지능적이라고 여긴다.</div><div class=\"rst\"><b>그런데도</b>(And yet) 이제 우리는 계산만 빠른 로봇도 선뜻 “똑똑하다”고 불러요. = 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Affective is another word</div><div class=\"k\">‘Affective(감성적인)’는 또 다른 단어이다</div></div><div class=\"rc\"><div class=\"e\">that once meant</div><div class=\"k\">한때 의미했던(= 단어)</div></div><div class=\"rc\"><div class=\"e\">a lot more</div><div class=\"k\">훨씬 더 많은 것을</div></div><div class=\"rc\"><div class=\"e\">than what any machine can deliver.</div><div class=\"k\">(현재) 어떤 기계가 전달할 수 있는 것보다.</div></div><div class=\"rnat\">‘Affective(감성적인)’는 한때 (현재) 어떤 기계가 전달할 수 있는 것보다 훨씬 더 많은 것을 의미했던 또 다른 단어이다.</div><div class=\"rst\">‘감성적인’(affective)이라는 말도 원래는 어떤 기계도 못 따라올 만큼 깊은 뜻이었어요. = 지문 5번이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Yet we have become used to</div><div class=\"k\">하지만 우리는 ~에 익숙해져 왔다</div></div><div class=\"rc\"><div class=\"e\">describing machines</div><div class=\"k\">기계를 묘사하는 것에</div></div><div class=\"rc\"><div class=\"e\">that portray emotional states</div><div class=\"k\">(기계 스스로의) 감정 상태를 표현하거나</div></div><div class=\"rc\"><div class=\"e\">or can sense our emotional states</div><div class=\"k\">혹은 우리의 감정 상태를 감지할 수 있는</div></div><div class=\"rc ckc\"><div class=\"e\">as exemplars of “<span class=\"cw\">affective computing</span>.”</div><div class=\"k\">‘affective computing(<span class=\"cw\">감성 컴퓨팅</span>)’의 전형으로.</div></div><div class=\"rnat\">하지만 우리는 (기계 스스로의) 감정 상태를 표현하거나 우리의 감정 상태를 감지할 수 있는 기계를 ‘affective computing(감성 컴퓨팅)’의 전형으로 묘사하는 것에 익숙해져 왔다.</div><div class=\"rst\"><b>하지만</b>(Yet) 축제에서 표정 짓는 로봇을 보고 다들 “감성 로봇이네” 하는 게 익숙해졌어요. = 지문의 감성 컴퓨팅.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">These new meanings</div><div class=\"k\">이러한 새로운 의미들은</div></div><div class=\"rc\"><div class=\"e\">become our new normal,</div><div class=\"k\">우리의 새로운 표준이 되고,</div></div><div class=\"rc\"><div class=\"e\">and we forget other meanings.</div><div class=\"k\">우리는 다른 의미들을 잊는다.</div></div><div class=\"rnat\">이러한 새로운 의미들은 우리의 새로운 표준이 되고, 우리는 다른 의미들을 잊는다.</div><div class=\"rst\">그 새 뜻이 당연해지면 원래의 깊은 뜻은 잊혀요. = 지문 7번, 새 뜻이 새로운 표준(new normal)이 되고 다른 의미는 잊혀요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">We have to struggle</div><div class=\"k\">우리는 전력을 다해야 한다</div></div><div class=\"rc\"><div class=\"e\">to recapture lost language,</div><div class=\"k\">잃어버린 언어를 되찾기 위해,</div></div><div class=\"rc\"><div class=\"e\">lost meanings,</div><div class=\"k\">잃어버린 의미들을,</div></div><div class=\"rc\"><div class=\"e\">and perhaps, in time,</div><div class=\"k\">그리고 아마도, 조만간,</div></div><div class=\"rc\"><div class=\"e\">lost experiences.</div><div class=\"k\">잃어버린(잃어버릴) 경험들을.</div></div><div class=\"rnat\">우리는 잃어버린 언어, 잃어버린 의미들, 그리고 아마도, 조만간, 잃어버린(잃어버릴) 경험들을 되찾기 위해 전력을 다해야 한다.</div><div class=\"rst\">그래서 우리는 <b>잃어버린 말과 뜻을 되찾으려 애써야</b> 해요. = 지문 8번, 글쓴이의 첫 주장이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">At one conference I attended,</div><div class=\"k\">내가 참석했던 한 회의에서,</div></div><div class=\"rc\"><div class=\"e\">the robots were called “caring machines,”</div><div class=\"k\">로봇들은 ‘caring machines(돌보는 기계)’라고 불렸는데,</div></div><div class=\"rc\"><div class=\"e\">and when I objected,</div><div class=\"k\">내가 이의를 제기했을 때,</div></div><div class=\"rc\"><div class=\"e\">I was told</div><div class=\"k\">나는 ~라는 말을 들었다</div></div><div class=\"rc\"><div class=\"e\">we were using this word</div><div class=\"k\">우리가 이 단어(= caring)를 사용하고 있다는</div></div><div class=\"rc\"><div class=\"e\">not because the robots care</div><div class=\"k\">로봇이 마음을 쓰기 때문이 아니라</div></div><div class=\"rc\"><div class=\"e\">but because they will take care of us.</div><div class=\"k\">그들(= 로봇들)이 우리를 돌볼 것이기 때문에.</div></div><div class=\"rnat\">내가 참석했던 한 회의에서 로봇들은 ‘caring machines(돌보는 기계)’라고 불렸는데, 내가 (그렇게 부르는 것에) 이의를 제기했을 때, 나는 로봇이 마음을 쓰기 때문이 아니라 그들이 우리를 돌볼 것이기 때문에 우리가 이 단어를 사용하고 있다는 말을 들었다.</div><div class=\"rst\">축제에서 로봇을 ‘돌보는 기계’라 불러서 내가 따지자, “마음을 써서가 아니라 우리를 돌봐 줘서”라는 답이 왔어요. = 지문 9번.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">The conference participants believed</div><div class=\"k\">회의 참가자들은 생각했다</div></div><div class=\"rc\"><div class=\"e\">caring is a behavior, a function,</div><div class=\"k\">돌보는 것은 행동, 즉 기능이지,</div></div><div class=\"rc\"><div class=\"e\">not a feeling.</div><div class=\"k\">감정이 아니라고.</div></div><div class=\"rnat\">회의 참가자들은 돌보는 것은 행동, 즉 기능이지 감정이 아니라고 생각했다.</div><div class=\"rst\">다른 사람들은 ‘돌본다’는 건 마음이 아니라 그냥 하는 일, 즉 기능이라고 생각했어요. = 지문 10번이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">They seemed puzzled:</div><div class=\"k\">그들(= 회의 참가자들)은 당황스러워 보였다.</div></div><div class=\"rc\"><div class=\"e\">Why did I care so much</div><div class=\"k\">왜 나는 그렇게 신경을 썼을까</div></div><div class=\"rc\"><div class=\"e\">about semantics?</div><div class=\"k\">의미론에?</div></div><div class=\"rnat\">그들은 당황스러워 보였다. 왜 나는 의미론에 그렇게 신경을 썼을까?</div><div class=\"rst\">그들은 “왜 그렇게 단어 뜻에 신경 써?” 하며 어리둥절해했어요. = 지문의 의미론(semantics)이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">What’s wrong</div><div class=\"k\">무슨 문제가 있는 걸까</div></div><div class=\"rc\"><div class=\"e\">with me?</div><div class=\"k\">나에게?</div></div><div class=\"rnat\">나에게 무슨 문제가 있는 걸까?</div><div class=\"rst\">“쟤 왜 저래?” 하는 눈빛이었죠. = 지문 12번, 나한테 무슨 문제가 있냐는 말이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">It is natural</div><div class=\"k\">당연하다</div></div><div class=\"rc\"><div class=\"e\">for words to change their meaning</div><div class=\"k\">단어들의 의미가 변하는 것은</div></div><div class=\"rc\"><div class=\"e\">over time</div><div class=\"k\">시간이 흐르면서</div></div><div class=\"rc\"><div class=\"e\">and with new circumstances.</div><div class=\"k\">그리고 새로운 환경에서.</div></div><div class=\"rnat\">시간이 흐르고 새로운 환경에서 단어들의 의미가 변하는 것은 당연하다.</div><div class=\"rst\">물론 시간이 지나 상황이 바뀌면 단어 뜻이 변하는 건 자연스러워요. = 지문 13번이에요.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><div class=\"rc\"><div class=\"e\">Intelligence and affective</div><div class=\"k\">‘Intelligence(지능)’와 ‘affective(감성적인)’는</div></div><div class=\"rc\"><div class=\"e\">have changed their meaning</div><div class=\"k\">의미를 변화시켜 왔다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to accommodate</span></div><div class=\"k\"><span class=\"cw\">수용하기 위해</span>※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">what machines can do.</div><div class=\"k\">기계가 할 수 있는 것을.</div></div><div class=\"rnat\">‘Intelligence(지능)’와 ‘affective(감성적인)’는 기계가 할 수 있는 것을 수용하기 위해 의미를 변화시켜 왔다(의미가 변해 왔다).</div><div class=\"rst\">‘똑똑하다’, ‘감성적인’은 로봇이 할 수 있는 만큼으로 뜻이 <b>맞춰져</b> 왔어요. = 지문 14번, 빈칸은 accommodate(수용하다, 맞추다)예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">But now</div><div class=\"k\">그러나 이제</div></div><div class=\"rc\"><div class=\"e\">the words caring, friend,</div><div class=\"k\">‘caring(돌보는)’, ‘friend(친구)’,</div></div><div class=\"rc\"><div class=\"e\">companionship, and conversation?</div><div class=\"k\">‘companionship(우정)’, 그리고 ‘conversation(대화)’ (같은) 단어들은 (어떻게 될까)?</div></div><div class=\"rnat\">그러나 이제 ‘caring(돌보는)’, ‘friend(친구)’, ‘companionship(우정)’, 그리고 ‘conversation(대화)’(같은) 단어들은 (어떻게 될까)?</div><div class=\"rst\"><b>그러나 이제</b>(But now) ‘돌봄’, ‘친구’, ‘우정’, ‘대화’라는 말은 어떻게 될까요? = 지문 15번의 질문이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">A lot is at stake</div><div class=\"k\">많은 것이 위태롭다</div></div><div class=\"rc\"><div class=\"e\">in these words.</div><div class=\"k\">이러한 단어들에서.</div></div><div class=\"rnat\">이러한 단어들에서 많은 것(단어)들이 위태롭다.</div><div class=\"rst\">이 단어들에는 <b>많은 것이 걸려 있어요</b>. = 지문의 at stake(위태로운)예요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">They are not yet lost.</div><div class=\"k\">그것들(= 이 단어들)은 아직 사라지지 않았다.</div></div><div class=\"rnat\">그것들은 아직 사라지지 않았다.</div><div class=\"rst\">다행히 아직 잃어버리진 않았어요. = 지문 17번, 아직 사라지지 않았다는 말이에요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">We need to remember</div><div class=\"k\">우리는 기억해야 한다</div></div><div class=\"rc\"><div class=\"e\">these words and this conversation</div><div class=\"k\">이러한 단어들과 이 대화를</div></div><div class=\"rc\"><div class=\"e\">before we don’t know</div><div class=\"k\">우리가 모르게 되기 전에</div></div><div class=\"rc\"><div class=\"e\">how to have it.</div><div class=\"k\">그것(= 대화)을 하는 법을.</div></div><div class=\"rnat\">우리가 그것(대화)을 하는 법을 모르게 되기 전에, 이러한 단어들과 이 대화를 기억해야 한다.</div><div class=\"rst\">진짜 친구와 수다 떠는 법을 잊기 전에 <b>이 단어들과 대화를 기억해야</b> 해요. = 지문 18번, 글의 결론이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">Or before we think</div><div class=\"k\">아니면 우리가 ~라고 생각하기 전에</div></div><div class=\"rc\"><div class=\"e\">we can have it</div><div class=\"k\">우리가 그것(= 대화)을 할 수 있다고</div></div><div class=\"rc\"><div class=\"e\">with a machine.</div><div class=\"k\">기계와.</div></div><div class=\"rnat\">아니면 우리가 기계와 그것(대화)을 할 수 있다고 생각하기 전에.</div><div class=\"rst\">아니면 로봇이랑도 그런 대화가 된다고 착각하기 전에요. = 지문 19번, 글의 마지막 경고예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"accommodate\" data-m=\"(맞게) 수용하다, 맞추다\"><b>accommodate</b>(맞게) 수용하다, 맞추다</button><button type=\"button\" class=\"wdb\" data-w=\"circumstance\" data-m=\"상황, 환경\"><b>circumstance</b>상황, 환경</button><button type=\"button\" class=\"wdb\" data-w=\"semantics\" data-m=\"의미론\"><b>semantics</b>의미론</button><button type=\"button\" class=\"wdb\" data-w=\"function\" data-m=\"기능\"><b>function</b>기능</button><button type=\"button\" class=\"wdb\" data-w=\"puzzled\" data-m=\"어리둥절한\"><b>puzzled</b>어리둥절한</button><button type=\"button\" class=\"wdb\" data-w=\"companionship\" data-m=\"우정, 동반자 관계\"><b>companionship</b>우정, 동반자 관계</button></div>"};

 var b=e.target.closest('.stbtn');

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}

  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;

    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
