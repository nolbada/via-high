<title>고2 미니모의고사 7회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}

.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

"]}], "tr": ["어떤 사람이 자존감 문제를 극복하고 건강한 자존감을 형성하기 전에, 무엇이 그것들(자존감 문제)을 유발할 수 있는지 아는 것은 도움이 된다.", "분명히, 자존감은 (부모나 교사와 같은) 그 사람의 인정이 중요한 누군가가 계속해서 당신을 깎아 내릴 때 손상될 수 있다.", "하지만 비판이 다른 사람들로부터 올 필요는 없다.", "자존감은 또한 우리가 우리 스스로를 어떻게 보는가에 의해 손상될 수 있다.", "일부 십대들은 ‘내면의 비판자’를 가지고 있는데, (이것은) 그들이 하는 모든 것에서 잘못을 발견하는 것처럼 보이는 내면의 목소리이다.", "그리고 사람들은 때때로 의도치 않게 비판적인 부모나 그 사람의 의견이 그들에게 중요한 다른 누군가를 본떠서 그들의 내면의 소리를 만든다.", "시간이 흐르면서, 부정적인 내면의 소리를 듣는 것은 꼭 그 비판이 다른 사람에게서 온 것만큼이나 개인의 자존감을 손상시킬 수 있다.", "일부 사람들은 그들의 내면의 비판자가 있는 것에 너무나 익숙해져서 스스로를 깎아 내리고 있을 때 심지어 그들은 알아차리지도 못한다."], "ps": [{"n": 1, "ch": [{"e": "<b>Before<\/b> a person can overcome", "k": "어떤 사람이 극복할 수 있기 <b>전에<\/b>"}, {"e": "self-esteem problems", "k": "자존감 문제를"}, {"e": "and build healthy self-esteem,", "k": "그리고 건강한 자존감을 형성하기,"}, {"e": "it helps to know", "k": "아는 것은 도움이 된다"}, {"e": "<b>what might cause them.<\/b>", "k": "무엇이 그것들<span class=\"r\">(= 자존감 문제들)<\/span>을 유발할 수 있는지."}], "easy": "자존감 문제를 이겨 내고 건강한 자존감을 만들려면, 먼저 그 문제가 왜 생기는지 알아 두면 도움이 돼요.", "gist": "글의 출발점. 자존감 문제의 원인을 아는 것이 먼저라고 말한다."}, {"n": 2, "ch": [{"e": "<b>Obviously,<\/b>", "k": "<b>분명히<\/b>,"}, {"e": "self-esteem can be <b>hurt<\/b>", "k": "자존감은 <b>손상될<\/b> 수 있다"}, {"e": "when someone whose acceptance is important", "k": "그 사람의 인정이 중요한 누군가가"}, {"e": "(like a parent or teacher)", "k": "(부모나 교사와 같은)"}, {"e": "constantly <b>puts you down<\/b>.", "k": "계속해서 당신을 <b>깎아 내릴<\/b> 때."}], "easy": "당연히, 부모나 선생님처럼 내가 인정받고 싶은 사람이 계속 나를 깎아내리면 자존감이 상처를 입을 수 있어요.", "gist": "첫 번째 원인. 중요한 사람의 계속되는 비난이 자존감을 손상시킨다."}, {"n": 3, "ch": [{"e": "<b>But<\/b> criticism", "k": "<b>하지만<\/b> 비판이"}, {"e": "doesn’t have to come", "k": "올 필요는 없다"}, {"e": "from other people.", "k": "다른 사람들로부터."}], "easy": "그런데 비판이 꼭 남한테서만 오는 건 아니에요.", "gist": "전환점(But). 비판의 출처가 남이 아닐 수도 있다는 쪽으로 방향이 바뀐다."}, {"n": 4, "ch": [{"e": "Self-esteem can <b>also<\/b>", "k": "자존감은 <b>또한<\/b> ~할 수 있다"}, {"e": "<b>be damaged<\/b>", "k": "<b>손상될<\/b>"}, {"e": "<b>by how we see ourselves.<\/b>", "k": "우리가 우리 스스로를 어떻게 보는가에 의해.<s function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

/b>'입니다.", "pe": "\u0001Obviously<sup>1</sup>\u0002, / self-esteem can be hurt<sup>2</sup> / \u0001when someone whose<sup>3</sup> acceptance<sup>4</sup> is important (like a parent or teacher)\u0002 / \u0001constantly puts you down<sup>5</sup>\u0002.", "pk": "\u0001분명히\u0002 / 자존감은 상처받을 수 있다 / \u0001그 사람의 인정이 중요한 누군가가 (부모나 교사처럼)\u0002 / \u0001끊임없이 당신을 깎아내릴 때\u0002", "core": "자존감은 상처받을 수 있다.", "tags": ["Obviously = 부사: 문장 전체를 꾸밈 (분명히)", "주어 self-esteem + 동사 <b>can be hurt</b> (수동태, SV)", "when절 = 부사절: can be hurt를 꾸밈 (시간). <b>whose</b> acceptance = 소유격 관계대명사, 뒤에 명사. 괄호 안 like ~는 someone의 예시", "when절의 동사부: 주어 someone과 멀리 떨어짐. <b>put ~ down</b> = ~을 깎아내리다"], "steps": [{"t": "이 문장은 <b>수동태 S+V(1형식) + when 부사절</b>이다. 부사절 안의 주어가 길어 동사가 멀리 떨어진다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: self-esteem (자존감)", "V: can be hurt (hurt 상처 입히다의 수동태) - 수동태 주절은 1형식", "뼈대 = <b>self-esteem can be hurt</b>", "Obviously (분명히)는 문장 전체를 꾸미는 부사"]}, {"t": "<b>when ~ down</b>은 <b>부사절(때)</b>이다. can be hurt를 꾸민다.", "sub": ["S: someone (누군가) - whose acceptance is important (그 사람의 인정이 중요한)가 someone을 꾸미는 관계절, whose 뒤에는 명사가 옴", "괄호 (like a parent or teacher) (부모나 교사처럼)는 someone의 예시", "V: puts ~ down (깎아내리다, put down 깎아내리다의 3인칭 단수형)", "O: you (당신)", "constantly (계속)는 puts를 꾸미는 부사"]}, {"t": "주어 someone과 동사 puts 사이에 whose절이 끼어서 멀어졌다는 점이 함정이다."}], "sum": "중요한 사람이 계속 깎아내리면 자존감이 상할 수 있음"}, {"i": "05", "q": "09", "s": "3", "title": "If절 + S+V+O + 전치사구 병렬", "eng": "If the person they see accepting the new idea happens to<sup>1</sup> be a friend, / then social proof<sup>2</sup> has even more power / by exerting<sup>3</sup> peer pressure<sup>4</sup> / as well as relying on the trust / that people put in the judgments<sup>5</sup> of their close friends.", "notes": [["1", "happen to", "마침 ~하다"], ["2", "social proof", "사회적 증거"], ["3", "exert", "(영향력을) 행사하다"], ["4", "peer pressure", "또래 압력"], ["5", "judgment", "판단"]], "lit": "그들이 새로운 생각을 받아들이는 것을 보는 그 사람이 마침 친구라면 / 그때 사회적 증거는 훨씬 더 큰 힘을 갖는다 / 또래 압력을 행사함으로써 / 신뢰에 기대는 것뿐만 아니라 / 사람들이 가까운 친구의 판단에 두는 (신뢰에)", "nat": "새로운 생각을 받아들이는 모습을 지켜본 그 사람이 마침 친구라면, 사회적 증거는 가까운 친구의 판단에 대한 신뢰에 기대는 데 더해 또래 압력까지 행사하면서 훨씬 더 큰 힘을 갖는다.", "ana": "<b>the person (whom) they see accepting ~</b>에서 <b>목적격 관계대명사가 생략</b>되었고, 원래 구조는 <b>see + 목적어 + -ing</b>(지각동사)입니다 — 목적어가 관계대명사로 빠져나가 accepting만 남은 것입니다. <b>happens to be</b>는 '<b>마침 ~이다</b>'로 우연을 나타냅니다. <b>by exerting ~ as well as relying on ~</b>은 전치사 by 뒤의 <b>동명사 두 개가 as well as로 병렬</b>된 것이고, 맨 뒤 <b>that</b>은 the trust를 받는 <b>목적격 관계대명사</b>입니다(put A in B의 A 자리).", "pe": "\u0001If the person they see accepting the new idea happens to<sup>1</sup> be a friend\u0002, / \u0001then\u0002 social proof<sup>2</sup> has \u0001even more\u0002 power / \u0001by exerting<sup>3</sup> peer pressure<sup>4</sup>\u0002 / \u0001as well as relying on the trust\u0002 / \u0001that people put in the judgments<sup>5</sup> of their close friends\u0002.", "pk": "\u0001그들이 새로운 생각을 받아들이는 것을 보는 그 사람이 마침 친구라면\u0002 / \u0001그때\u0002 사회적 증거는 \u0001훨씬 더 큰\u0002 힘을 갖는다 / \u0001또래 압력을 행사함으로써\u0002 / \u0001신뢰에 기대는 것뿐만 아니라\u0002 / \u0001사람들이 가까운 친구의 판단에 두는\u0002 (신뢰에)", "core": "사회적 증거는 힘을 갖는다.", "tags": ["If ~ = 부사절: has를 꾸밈 (조건). 안에 목적격 관계대명사 생략 (the person (whom) they see accepting ~, <b>see + O + -ing</b>), happens to be = 마침 ~이다", "then = 부사: has를 꾸밈 (if절과 호응). 주어 social proof + 동사 has + 목적어 power. even more = 형용사구: power를 꾸밈", "by exerting ~ = 전치사구(부사구): has를 꾸밈 (수단, by + 동명사)", "as well as relying on ~ = 전치사구(부사구) 병렬: by exerting과 짝, ~뿐만 아니라", "that ~ = 관계절(형용사절): the trust를 꾸밈 (목적격 관계대명사, put A in B)"], "steps": [{"t": "이 문장은 <b>If 부사절 + S+V+O(3형식)</b>이다. 부사절 속 구조와 뒤 by 병렬 때문에 길어 보인다."}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: social proof (사회적 증거)", "V: has (have 가지다의 3인칭 단수형)", "O: power (힘)", "뼈대 = <b>social proof has power</b>", "then (그렇다면)은 if절과 호응하는 부사, even more (훨씬 더 많은)는 power를 꾸밈"]}, {"t": "<b>If the person ~ happens to be a friend</b>는 <b>부사절(조건)</b>이다.", "sub": ["S: the person (그 사람)", "V: happens to be (마침 ~이다) - 2형식", "C: a friend (친구)", "they see accepting the new idea (그들이 새로운 생각을 받아들이는 것을 보는) - person을 꾸미는 관계절, 목적격 관계대명사 생략. see + O + -ing = O가 ~하는 것을 보다 (accept 받아들이다)"]}, {"t": "<b>by exerting peer pressure</b>는 전치사구(부사구)다. has를 꾸민다 (또래 압력을 행사함으로써, exert 행사하다)."}, {"t": "<b>as well as relying on the trust</b>는 by exerting과 병렬이다 (신뢰에 기대는 것뿐 아니라, rely on 기대다).", "sub": ["that people put in the judgments of their close friends (사람들이 가까운 친구의 판단에 두는) - trust를 꾸미는 관계절, 목적격 관계대명사 that"]}], "sum": "받아들이는 사람이 친구라면 또래 압력과 신뢰로 영향력 더 커짐"}, {"i": "06", "q": "09", "s": "6", "title": "If절 + S+V + 관계절 2개", "eng": "If a friend recommends<sup>1</sup> the video to you, / in many cases, / the credibility<sup>2</sup> of the idea it presents<sup>3</sup> / will rise in direct proportion to<sup>4</sup> the trust / you place in the friend recommending the video.", "notes": [["1", "recommend", "추천하다"], ["2", "credibility", "신뢰성"], ["3", "present", "제시하다"], ["4", "in direct proportion to", "~에 정비례하여"], ["5", "place trust in", "~을 신뢰하다"]], "lit": "친구가 그 영상을 당신에게 추천하면 / 많은 경우 / 그 영상이 제시하는 생각의 신뢰성은 / 신뢰에 정비례해 올라갈 것이다 / 당신이 그 영상을 추천하는 그 친구에게 두는 (신뢰에)", "nat": "친구가 그 영상을 추천해 주면, 많은 경우 그 영상이 담고 있는 생각의 신뢰도는 그 영상을 추천한 친구를 당신이 얼마나 믿느냐에 정비례해 올라간다.", "ana": "<b>the idea (which) it presents</b>와 <b>the trust (which) you place in ~</b>에서 <b>목적격 관계대명사가 두 번 생략</b>되었습니다. 명사 뒤에 <b>대명사·주어가 곧바로 오면 관계대명사 생략</b>을 의심하세요. 주어의 핵은 <b>the credibility</b>이므로 동사는 <b>will rise</b>입니다. <b>in direct proportion to</b>는 '~에 정비례하여'이고, 맨 뒤 <b>recommending the video</b>는 the friend를 꾸미는 <b>현재분사</b>입니다.", "pe": "\u0001If a friend recommends<sup>1</sup> the video to you\u0002, / \u0001in many cases\u0002, / the credibility<sup>2</sup> \u0001of the idea \u0001it presents<sup>3</sup>\u0002\u0002 / will rise \u0001in direct proportion to<sup>4</sup> the trust\u0002 / \u0001you place in the friend recommending the video\u0002.", "pk": "\u0001친구가 그 영상을 당신에게 추천하면\u0002 / \u0001많은 경우\u0002 / \u0001\u0001그 영상이 제시하는\u0002 생각의\u0002 신뢰성은 / \u0001신뢰에 정비례해\u0002 올라갈 것이다 / \u0001당신이 그 영상을 추천하는 그 친구에게 두는\u0002 (신뢰에)", "core": "신뢰성은 올라갈 것이다.", "tags": ["If ~ = 부사절: will rise를 꾸밈 (조건)", "in many cases = 전치사구(부사구) 삽입: 문장 전체를 꾸밈", "주어 credibility. of ~ = 전치사구(형용사구): credibility를 꾸밈. it presents = 관계절(형용사절, 목적격 관계대명사 생략): the idea를 꾸밈", "동사 <b>will rise</b>. in direct proportion to ~ = 전치사구(부사구): rise를 꾸밈 (~에 정비례하여)", "you place ~ = 관계절(형용사절, 목적격 관계대명사 생략): the trust를 꾸밈. recommending ~은 the friend를 꾸미는 현재분사"], "steps": [{"t": "이 문장은 <b>If 부사절 + S+V(1형식)</b>이다. 주어 쪽과 전치사구 쪽에 관계절이 숨어 있어 길어 보인다."}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: the credibility (신뢰도)", "V: will rise (rise 오르다)", "뼈대 = <b>the credibility will rise</b>", "of the idea (그 생각의)는 credibility를 꾸미는 형용사구", "it presents (그것이 제시하는) - the idea를 꾸미는 관계절, 목적격 관계대명사 생략 (it = the video, 영상)"]}, {"t": "<b>If a friend recommends the video to you</b>는 <b>부사절(조건)</b>이다 (친구가 그 영상을 당신에게 추천하면)."}, {"t": "<b>in many cases</b> (많은 경우)는 콤마로 삽입된 전치사구(부사구)다. 문장 전체를 꾸민다."}, {"t": "<b>in direct proportion to the trust</b>는 전치사구(부사구)다. will rise를 꾸민다 (신뢰에 정비례하여).", "sub": ["you place in the friend (당신이 그 친구에게 두는) - trust를 꾸미는 관계절, 목적격 관계대명사 생략", "recommending the video (그 영상을 추천하는) - friend를 꾸미는 현재분사구"]}], "sum": "친구가 추천한 영상, 그 친구를 믿는 만큼 신뢰도가 오름"}, {"i": "07", "q": "10", "s": "5", "title": "Because절 + S+V + both A and B", "eng": "Because Earth is stretched<sup>1</sup> much like a rubber band<sup>2</sup>, / the oceans bulge out<sup>3</sup> / both on the side facing toward<sup>4</sup> the Moon / and on the side facing away from<sup>5</sup> the Moon.", "notes": [["1", "stretch", "늘리다, 늘어나다"], ["2", "rubber band", "고무줄"], ["3", "bulge out", "불룩하게 튀어나오다"], ["4", "facing toward", "~을 향한"], ["5", "facing away from", "~에서 등을 돌린"]], "lit": "지구가 고무줄처럼 크게 늘어나기 때문에 / 바다는 불룩하게 튀어나온다 / 달을 향한 쪽에서도 / 그리고 달에서 등을 돌린 쪽에서도", "nat": "지구가 고무줄처럼 늘어나기 때문에, 바다는 달을 향한 쪽과 달의 반대쪽 양쪽 모두에서 불룩하게 부풀어 오른다.", "ana": "<b>is stretched</b>는 지구가 '늘리는' 것이 아니라 '<b>늘어나는</b>' 쪽이므로 <b>수동태</b>입니다. much는 '많이'가 아니라 뒤의 like를 강조해 '<b>꼭 ~처럼</b>'입니다. <b>both A and B</b>는 두 전치사구를 묶는 상관접속사이고, 각 구의 <b>facing</b>은 the side를 뒤에서 꾸미는 <b>현재분사</b>입니다 — <b>facing toward</b>(향한)와 <b>facing away from</b>(등진)의 방향 차이가 이 문장의 핵심입니다.", "pe": "\u0001Because Earth is stretched<sup>1</sup> much like a rubber band<sup>2</sup>\u0002, / the oceans bulge out<sup>3</sup> / both \u0001on the side \u0001facing toward<sup>4</sup> the Moon\u0002\u0002 / and \u0001on the side \u0001facing away from<sup>5</sup> the Moon\u0002\u0002.", "pk": "\u0001지구가 고무줄처럼 크게 늘어나기 때문에\u0002 / 바다는 불룩하게 튀어나온다 / \u0001\u0001달을 향한\u0002 쪽에서도\u0002 / 그리고 \u0001\u0001달에서 등을 돌린\u0002 쪽에서도\u0002", "core": "바다는 튀어나온다.", "tags": ["Because ~ = 부사절: bulge out을 꾸밈 (이유). is stretched = 수동태", "주어 oceans + 동사 bulge out (SV). 뼈대", "both ~ and: 상관접속사. on the side ~ = 전치사구(부사구): bulge를 꾸밈 (장소). facing ~ = 현재분사구(형용사구): side를 꾸밈", "and on the side ~ = 전치사구(부사구) 병렬: bulge를 꾸밈. facing away from = 현재분사구(형용사구): side를 꾸밈"], "steps": [{"t": "이 문장은 <b>Because 부사절 + S+V(1형식)</b>이다. 뒤에 분사가 붙은 전치사구가 병렬로 이어져 길어 보인다."}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: the oceans (바다들)", "V: bulge out (불룩하게 부풀다, bulge 부풀다)", "뼈대 = <b>the oceans bulge out</b>"]}, {"t": "<b>Because Earth is stretched much like a rubber band</b>는 <b>부사절(이유)</b>이다 (지구가 고무줄처럼 늘어나기 때문에, stretch 늘리다, rubber band 고무줄)."}, {"t": "<b>both A and B</b> 구조로 전치사구 두 개가 병렬된다. 둘 다 bulge out을 꾸민다.", "sub": ["A: on the side facing toward the Moon (달을 향한 쪽에서)", "B: on the side facing away from the Moon (달의 반대쪽에서)", "facing은 동사가 아니라 side (쪽)를 뒤에서 꾸미는 현재분사"]}], "sum": "지구가 고무줄처럼 늘어나, 바다가 달을 향한 쪽과 반대쪽 모두 부풂"}, {"i": "08", "q": "11", "s": "A-6", "title": "S+V+C + 관계절 + describe A as B", "eng": "Yet we have become used to<sup>1</sup> describing machines / that portray<sup>2</sup> emotional states<sup>3</sup> or can sense<sup>4</sup> our emotional states / as exemplars<sup>5</sup> of “affective computing.”", "notes": [["1", "become used to -ing", "~하는 데 익숙해지다"], ["2", "portray", "묘사하다, 드러내다"], ["3", "emotional state", "감정 상태"], ["4", "sense", "감지하다"], ["5", "exemplar", "전형, 본보기"]], "lit": "그렇지만 우리는 기계를 묘사하는 데 익숙해졌다 / 감정 상태를 드러내거나 우리의 감정 상태를 감지할 수 있는 (기계를) / “정서적 컴퓨팅”의 전형이라고", "nat": "그런데도 우리는 감정 상태를 드러내거나 우리 감정을 감지하는 기계를 “정서적 컴퓨팅”의 본보기라고 부르는 데 익숙해져 버렸다.", "ana": "<b>become used to + 동명사</b>는 '~하는 데 익숙해지다'입니다. <b>used to + 동사원형</b>('~하곤 했다')과 반드시 구별하세요 — 여기서 to는 <b>전치사</b>라 describing이 온 것입니다. <b>that portray ~ or can sense ~</b>는 machines를 받는 <b>주격 관계대명사절</b>이고 동사 두 개가 or로 <b>병렬</b>되어 있습니다. 문장의 큰 틀은 <b>describe A as B</b>인데, A(machines ~ states)가 길어서 <b>as exemplars</b>가 맨 뒤로 멀리 밀려났습니다.", "pe": "Yet we have become used \u0001to<sup>1</sup> describing machines\u0002 / \u0001that portray<sup>2</sup> emotional states<sup>3</sup> or can sense<sup>4</sup> our emotional states\u0002 / \u0001as exemplars<sup>5</sup> of “affective computing\u0002.”", "pk": "그렇지만 우리는 \u0001기계를 묘사하는 데\u0002 익숙해졌다 / \u0001감정 상태를 드러내거나 우리의 감정 상태를 감지할 수 있는\u0002 (기계를) / \u0001“정서적 컴퓨팅”의 전형이라고\u0002", "core": "그렇지만 우리는 익숙해졌다.", "tags": ["Yet = 접속사 (역접). 주어 we + 동사 have become + 보어 used (SVC). to describing ~ = 전치사구(부사구): used 뒤에 거의 필수에 가까운 부사구, to는 전치사라 동명사 [기준: 문형 기준]", "that ~ = 관계절(형용사절): machines를 꾸밈. 동사 portray와 can sense가 or로 병렬", "as exemplars of ~ = 전치사구(부사구): describe A as B의 B, describing을 꾸밈 (~로서)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이고 뒤에 관계절과 as 전치사구가 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: we (우리)", "V: have become (become ~이 되다의 현재완료형)", "C: used (익숙한)", "뼈대 = <b>we have become used</b>", "Yet (그런데도)은 역접 접속사"]}, {"t": "<b>to describing machines</b>는 used 뒤에 붙는 전치사구다. 이 to는 전치사라서 동명사 describing이 온다 (기계를 묘사하는 데). 거의 필수에 가까운 부사구지만 수식어로 분류한다 (문형 기준).", "sub": ["describe A as B = A를 B라고 묘사하다 (3형식 + as 전치사구)", "A: machines (기계들)"]}, {"t": "<b>that portray emotional states or can sense our emotional states</b>는 <b>관계절(형용사절)</b>이다. machines를 꾸민다.", "sub": ["동사 portray (나타내다)와 can sense (감지할 수 있다)가 or로 병렬", "emotional states (감정 상태)"]}, {"t": "<b>as exemplars of 'affective computing'</b>은 describe의 B 자리인 as 전치사구다 (정서적 컴퓨팅의 본보기로, exemplar 본보기). 관계절 때문에 describing과 멀어졌다."}], "sum": "감정을 드러내거나 감지하는 기계를 정서적 컴퓨팅의 본보기라 부르는 데 익숙해짐"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2017년 9월 34번", "ans": "④", "tr": [["1", "이것은 폴란드가 훨씬 더 사회주의적인 경제 체제였던 시절, 어느 국영 신발 공장에서 있었던 실화다."], ["2", "매달 폴란드 정부는 공장에 원자재를 주었고, 공장장은 정해진 수의 신발을 생산하라는 지시를 받았다."], ["3", "이윤 동기가 없었기 때문에 공장장의 기본 목표는 가능한 한 가장 쉬운 방법으로 할당량을 채우는 것이었고, 그 방법이란 작은 신발만 만드는 것이었다."], ["4", "이 생산 전략은 발이 큰 사람들에게 문제를 만들었고, 그래서 정부는 제도를 손보았다."], ["5", "이제 공장은 원자재를 전과 같은 양으로 받았지만, 정해진 켤레 수가 아니라 정해진 톤수만큼 신발을 만들어야 했다."], ["6", "다시 말해, 공장의 생산량은 이제 세는 것이 아니라 무게를 재는 방식이 되었다."], ["7", "그리고 또다시 공장장은 가장 효율적인 방식으로 대응했는데, 오직 거대한 신발만 만드는 것이었다."], ["8", "어느 쪽 상황에서도 정부의 전략은 ______할 동기를 전혀 제공하지 못했다."]], "evh": "3 · 7번 문장", "ev": [{"en": true, "h": "... the manager's basic goal was to meet the quota in the easiest possible way — by producing only small shoes. / And again, the factory's manager responded in the most efficient way, by producing nothing but huge shoes."}, {"en": false, "h": "빈칸이 <b>마지막 문장</b>에 있고 <b>In either situation</b>(두 상황 모두)으로 시작하면, 답은 <b>두 상황의 공통된 실패</b>입니다. 첫 제도에서는 <b>작은 신발만</b>, 바뀐 제도에서는 <b>거대한 신발만</b> 만들었습니다. 두 경우 모두 빠진 것은 <b>사람들이 실제로 신을 수 있는 다양한 크기의 신발</b>입니다. 4번의 '<b>발이 큰 사람들에게 문제가 생겼다</b>'가 그 힌트를 미리 깔아 둡니다."}], "opts": [{"n": "①", "t": "improve the working environment for employees", "a": false, "x": true, "trap": false, "e": "근무 환경은 글에 나오지 않습니다. 공장 이야기라는 이유만으로 고르기 쉬운 선지입니다."}, {"n": "②", "t": "simplify the production process to reduce costs", "a": false, "x": true, "trap": true, "e": "공장장은 오히려 <b>가장 쉬운·효율적인 방법</b>을 이미 찾아냈습니다. 문제는 단순화가 안 된 것이 아니라 <b>엉뚱하게 단순화한</b> 것입니다."}, {"n": "③", "t": "increase the number of factories to make more profit", "a": false, "x": true, "trap": false, "e": "공장을 늘린다는 이야기는 없고, 3번은 오히려 <b>이윤 동기가 없다</b>고 못 박습니다."}, {"n": "④", "t": "produce shoes in various sizes that met people's needs", "a": true, "x": false, "trap": false, "e": "작은 신발만(3번) → 거대한 신발만(7번)으로, 두 제도 모두 <b>사람들이 필요로 하는 다양한 크기</b>를 만들 이유를 주지 못했습니다. 4번의 '발이 큰 사람들'이 그 증거입니다."}, {"n": "⑤", "t": "adopt new technology to compete against foreign shoes", "a": false, "x": true, "trap": false, "e": "신기술이나 해외 경쟁은 언급되지 않습니다. 사회주의 경제라는 배경 자체가 경쟁과 거리가 멉니다."}], "w": [["government-owned", "국영의"], ["socialist economy", "사회주의 경제"], ["profit motive", "이윤 동기"], ["meet the quota", "할당량을 맞추다"], ["production strategy", "생산 전략"], ["revise", "개정하다, 손보다"], ["be expected to", "~하도록 요구되다"], ["output", "생산량"], ["weigh", "무게를 재다"], ["nothing but", "오직 ~뿐"]]}, {"q": "08", "type": "빈칸 추론", "src": "2013년 9월 B형 35번", "ans": "⑤", "tr": [["1", "자존감 문제를 이겨 내고 건강한 자존감을 세우려면, 그 전에 무엇이 그런 문제를 일으키는지를 아는 것이 도움이 된다."], ["2", "당연하게도, 부모나 교사처럼 그 사람의 인정이 중요한 누군가가 계속 당신을 깎아내리면 자존감은 상처를 입을 수 있다."], ["3", "하지만 비판이 반드시 다른 사람에게서 와야 하는 것은 아니다."], ["4", "자존감은 ______ 수도 있다."], ["5", "어떤 십 대들은 자기가 하는 모든 일에서 흠을 잡는 듯한 내면의 목소리, 즉 '내면의 비판자'를 갖고 있다."], ["6", "그리고 사람들은 때때로 무심코 비판적인 부모나 자신에게 의견이 중요한 다른 누군가를 본떠 자기 내면의 목소리를 만든다."], ["7", "시간이 지나면서 부정적인 내면의 목소리에 귀 기울이는 것은, 마치 그 비판이 다른 사람에게서 오는 것처럼이나 그 사람의 자존감을 해칠 수 있다."], ["8", "어떤 사람들은 내면의 비판자가 있는 것에 너무 익숙해져서 자신이 스스로를 깎아내리고 있다는 것조차 알아차리지 못한다."]], "evh": "3 · 5 · 7번 문장", "ev": [{"en": true, "h": "But criticism doesn't have to come from other people. / Some teens have an “inner critic,” a voice inside that seems to find fault with everything they do. / ... listening to a negative inner voice can harm a person's self-esteem just as much as if the criticism were coming from another person."}, {"en": false, "h": "빈칸 앞의 <b>But</b>과 <b>also</b>가 방향을 정해 줍니다. 2번까지는 <b>남이 주는 비판</b>이었고, 3번의 But이 '비판이 꼭 남에게서 오는 것은 아니다'로 축을 바꿉니다. 그 뒤 5·7번이 <b>내면의 비판자, 부정적인 내면의 목소리</b>를 설명하므로, 빈칸은 '<b>우리가 스스로를 어떻게 보는가에 따라 자존감이 상할 수 있다</b>'가 되어야 합니다."}], "opts": [{"n": "①", "t": "be lowered by peer pressure", "a": false, "x": true, "trap": true, "e": "또래 압력은 결국 <b>다른 사람</b>이 주는 압박이라, 3번의 '남에게서 오지 않는다'와 정면으로 부딪칩니다."}, {"n": "②", "t": "make you feel more confident", "a": false, "x": true, "trap": false, "e": "뒤 내용은 자존감이 <b>상하는</b> 이야기입니다. '더 자신 있게 만든다'는 정반대 방향입니다."}, {"n": "③", "t": "be related to physical condition", "a": false, "x": true, "trap": false, "e": "신체 상태는 글에 한 번도 나오지 않습니다."}, {"n": "④", "t": "nourish parent-child relationships", "a": false, "x": true, "trap": false, "e": "6번에 부모가 나오지만 그것은 <b>비판적인 부모를 본뜬다</b>는 부정적 예입니다. 관계를 키운다는 말이 아닙니다."}, {"n": "⑤", "t": "be damaged by how we see ourselves", "a": true, "x": false, "trap": false, "e": "5·7번의 <b>inner critic</b>과 <b>negative inner voice</b>가 곧 '스스로를 보는 방식'입니다. But 뒤에 이어질 유일한 흐름입니다."}], "w": [["overcome", "극복하다"], ["self-esteem", "자존감"], ["acceptance", "인정, 받아들임"], ["put ~ down", "~을 깎아내리다"], ["criticism", "비판, 비난"], ["find fault with", "~의 흠을 잡다"], ["unintentionally", "무심코"], ["model A after B", "A를 B를 본떠 만들다"], ["harm", "해치다"], ["get used to", "~에 익숙해지다"]]}, {"q": "09", "type": "무관한 문장", "src": "2021년 6월 35번", "ans": "③", "tr": [["1", "소셜 미디어에서 생겨난 흥미로운 현상 하나는 '사회적 증거'라는 개념이다."], ["2", "다른 사람들이 이미 그렇게 했다는 것을 볼 때, 사람은 새로운 가치관이나 생각을 더 쉽게 받아들인다."], ["3", "① 새로운 생각을 받아들이는 모습을 지켜본 그 사람이 마침 친구라면, 사회적 증거는 가까운 친구의 판단에 대한 신뢰에 기대는 데 더해 또래 압력까지 행사하면서 훨씬 더 큰 힘을 갖는다."], ["4", "② 예를 들어 어떤 사안에 관한 영상은 그 자체만으로는 논란이 될 수 있지만, '좋아요'를 수천 개 받으면 더 믿을 만해진다."], ["5", "③ 친구에게 좋아하는 감정을 표현할 때는 표정 같은 비언어적 신호를 사용해 표현할 수 있다."], ["6", "④ 친구가 그 영상을 추천해 주면, 많은 경우 그 영상이 담고 있는 생각의 신뢰도는 그 영상을 추천한 친구를 당신이 얼마나 믿느냐에 정비례해 올라간다."], ["7", "⑤ 이것이 소셜 미디어의 힘이며, 영상이나 '게시물'이 '입소문을 타게' 되는 이유의 일부다."]], "evh": "1 · 6번 문장", "ev": [{"en": true, "h": "An interesting phenomenon that arose from social media is the concept of social proof. / If a friend recommends the video to you, ... the credibility of the idea it presents will rise in direct proportion to the trust you place in the friend recommending the video."}, {"en": false, "h": "무관한 문장은 <b>같은 단어가 나오는데 논점이 다른</b> 문장입니다. 이 글의 축은 '<b>신뢰(trust) → 신뢰도(credibility) → 사회적 증거</b>'입니다. ③은 friends와 express라는 단어를 공유하지만 <b>표정 같은 비언어적 신호로 감정을 표현하는 법</b>이라는 완전히 다른 주제이고, 신뢰나 신뢰도와 아무 연결이 없습니다. ③을 빼면 ②의 예시 → ④의 강화 → ⑤의 결론으로 곧바로 이어집니다."}], "opts": [{"n": "①", "t": " function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
