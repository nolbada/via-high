<!doctype html>
<html lang="ko">
<head>

<title>고2 미니모의고사 6회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}

body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}

.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */

.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();

판되는 것은 1퍼센트 미만이라는 나의 추정"}, {"i": "06", "q": "05", "s": "3", "title": "과거분사구문 + S+V+O + 관계절 + allow+O+to V 분사구문", "eng": "Based in large part on<sup>1</sup> genetics<sup>2</sup>, / some people have a more efficient<sup>3</sup> version of the enzyme<sup>4</sup> / that degrades<sup>5</sup> caffeine, / allowing<sup>6</sup> the liver to rapidly clear it from the bloodstream<sup>7</sup>.", "notes": [["1", "based in large part on", "크게 ~에 근거하여"], ["2", "genetics", "유전(학)"], ["3", "efficient", "효율적인"], ["4", "enzyme", "효소"], ["5", "degrade", "분해하다"], ["6", "allow + O + to V", "O가 ~하게 해 주다"], ["7", "bloodstream", "혈류"]], "lit": "크게 유전에 근거하여 / 어떤 사람들은 더 효율적인 형태의 효소를 가지고 있다 / 카페인을 분해하는 / 그래서 간이 그것을 혈류에서 빠르게 제거할 수 있게 해 준다", "nat": "상당 부분 유전 때문에, 어떤 사람은 카페인을 분해하는 효소가 더 효율적인 형태여서 간이 카페인을 혈류에서 빠르게 없앨 수 있다.", "ana": "한 문장에 <b>분사구문이 두 개</b> 걸려 있습니다. 앞의 <b>Based on ~</b>은 과거분사 분사구문('~에 근거하여'), 뒤의 <b>allowing ~</b>은 현재분사 분사구문으로 <b>앞 문장 전체를 받아 '그래서 ~하게 된다'</b>는 결과를 나타냅니다. 둘 다 문장의 동사가 아니므로, 진짜 동사는 가운데의 <b>have</b> 하나뿐입니다. <b>that</b>은 the enzyme을 꾸미는 주격 관계대명사, <b>allow + 목적어 + to V</b>는 '~가 …하게 해 주다'입니다.", "pe": "\u0001Based in large part on<sup>1</sup> genetics<sup>2</sup>\u0002, / some people have a \u0001more efficient<sup>3</sup>\u0002 version \u0001of the enzyme<sup>4</sup>\u0002 / \u0001that degrades<sup>5</sup> caffeine\u0002, / \u0001allowing<sup>6</sup> the liver to rapidly clear it from the bloodstream<sup>7</sup>\u0002.", "pk": "\u0001크게 유전에 근거하여\u0002 / 어떤 사람들은 \u0001더 효율적인\u0002 형태의 효소를 가지고 있다 / \u0001카페인을 분해하는\u0002 / \u0001그래서 간이 그것을 혈류에서 빠르게 제거할 수 있게 해 준다\u0002", "core": "어떤 사람들은 형태를 가지고 있다.", "tags": ["Based on ~ = 과거분사구문(부사적: 이유): have를 꾸밈", "주어 people + 동사 have + 목적어 version. more efficient = 형용사구: version을 꾸밈. of the enzyme = 전치사구(형용사구): version을 꾸밈", "that degrades caffeine = 관계절(형용사절, 주격): enzyme을 꾸밈", "allowing ~ = 분사구문(부사적: 결과): have 문장을 꾸밈. allow + O + to V (5형식)"], "steps": [{"t": "이 문장은 <b>분사구문 + S+V+O(3형식)</b>에 뒤에 분사구문까지 붙은 문장이다. 앞뒤로 덩어리가 달려 길어 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: some people (어떤 사람들)", "V: have (가지고 있다)", "O: a more efficient version (더 효율적인 형태)", "뼈대 = <b>some people have a more efficient version</b>"]}, {"t": "맨 앞 <b>Based in large part on genetics</b>는 과거분사 분사구문이다. '상당 부분 유전에 근거하여'라는 뜻이다. 분사의 의미상 주어를 따로 짚기보다, 주절 내용 전체가 유전에 근거한다는 뜻으로 읽는다.", "sub": ["in large part = 상당 부분, genetics 유전, base on ~에 근거하다"]}, {"t": "<b>of the enzyme that degrades caffeine</b>에서 of the enzyme은 version을 꾸미는 전치사구이고, that degrades caffeine은 enzyme을 꾸미는 관계절이다. (enzyme 효소, degrade 분해하다, caffeine 카페인)"}, {"t": "<b>allowing the liver to rapidly clear it from the bloodstream</b>은 현재분사구문이다. 앞 내용의 결과를 말한다. 안에서 <b>allow+O+to V</b>(5형식)가 쓰였다.", "sub": ["allow A to V = A가 V하게 해 주다. liver 간 (rapidly 빠르게)", "it = caffeine (카페인). clear A from B = A를 B에서 없애다. bloodstream 혈류"]}], "sum": "유전 덕에 카페인 분해 효소가 더 효율적인 사람은 간이 카페인을 혈류에서 빠르게 제거"}, {"i": "07", "q": "05", "s": "8", "title": "S+V(1형식) + 도치된 조건절(should) + 가목적어 it", "eng": "One cup of tea or coffee in the morning will last<sup>1</sup> much of the day, / and should they have<sup>2</sup> a second cup, / even early in the afternoon, / they will find it difficult to<sup>3</sup> fall asleep<sup>4</sup> in the evening.", "notes": [["1", "last", "지속되다"], ["2", "should + S + V", "혹시 ~한다면(도치)"], ["3", "find it difficult to V", "~하기 어렵다고 느끼다"], ["4", "fall asleep", "잠들다"]], "lit": "아침에 마신 차나 커피 한 잔이 하루의 많은 시간 동안 지속될 것이다 / 그리고 혹시 그들이 두 번째 잔을 마신다면 / 심지어 이른 오후라 해도 / 그들은 저녁에 잠들기 어렵다는 것을 알게 될 것이다", "nat": "아침에 마신 차나 커피 한 잔이 하루 종일 남아 있어서, 혹시 이른 오후에라도 두 잔째를 마시면 저녁에 잠들기 힘들어진다.", "ana": "<b>should they have</b>는 의문문이 아니라 <b>If they should have</b>에서 <b>if를 지우고 should를 앞으로 보낸 도치</b>입니다. '<b>혹시 ~한다면</b>'으로 읽어야 하고, 물음표가 없는데 동사가 먼저 나오면 <b>if 생략 도치</b>를 의심하세요. 뒤의 <b>find it difficult to fall asleep</b>에서 <b>it은 가목적어</b>이고 진짜 목적어는 <b>to fall asleep</b>입니다 — it을 '그것'으로 옮기면 뜻이 사라집니다.", "pe": "One cup \u0001of tea or coffee in the morning\u0002 will last<sup>1</sup> \u0001much of the day\u0002, / and \u0001should they have<sup>2</sup> a second cup\u0002, / \u0001even early in the afternoon\u0002, / they will find it difficult to<sup>3</sup> fall asleep<sup>4</sup> \u0001in the evening\u0002.", "pk": "\u0001아침에 마신\u0002 차나 커피 한 잔이 \u0001하루의 많은 시간 동안\u0002 지속될 것이다 / 그리고 \u0001혹시 그들이 두 번째 잔을 마신다면\u0002 / \u0001심지어 이른 오후라 해도\u0002 / 그들은 \u0001저녁에\u0002 잠들기 어렵다는 것을 알게 될 것이다", "core": "한 잔은 지속될 것이고, 그들은 잠들기 어렵다는 것을 알게 될 것이다.", "tags": ["주어 One cup + 동사 will last (1형식). of tea or coffee, in the morning = 전치사구(형용사구): cup을 꾸밈. much of the day = 기간을 나타내는 명사구(부사적) [기준: 문형 기준]", "and + 도치 조건절 (If they should have의 if 생략). should they have = 접속사절(부사절): will find를 꾸밈", "even early in the afternoon = 부사구: 조건절 안을 꾸밈", "주어 they + 동사 will find + 목적어 it(<b>가목적어</b>) + 보어 difficult (5형식). to fall asleep = 진목적어. in the evening = 전치사구(부사구): fall asleep을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>과 <b>S+V+O+C(5형식)</b>이 and로 이어진 문장이다. 두 번째 절 앞 should 도치가 낯설어 길어 보인다."}, {"t": "첫 번째 절의 뼈대부터 찾는다.", "sub": ["S: One cup (한 잔). of tea or coffee, in the morning은 cup을 꾸미는 전치사구", "V: will last (last 지속되다)", "뼈대 = <b>One cup will last</b>", "much of the day = 하루의 많은 시간 동안 (기간을 나타내는 부사적 명사구)"]}, {"t": "<b>should they have a second cup</b>은 <b>if가 생략된 도치 조건절</b>이다. If they should have a second cup과 같다. '혹시 두 잔째를 마신다면'이라는 뜻이다.", "sub": ["have = 먹다, 마시다", "even early in the afternoon = 심지어 이른 오후에라도 (부사구)"]}, {"t": "두 번째 절의 뼈대는 5형식이다.", "sub": ["S: they (그들)", "V: will find (find 알게 되다)", "O: it (가목적어. 진짜 목적어는 뒤의 to fall asleep)", "C: difficult (어려운)", "뼈대 = <b>they will find it difficult to fall asleep</b>"]}, {"t": "끝의 <b>in the evening</b>은 부사구이다. fall asleep을 꾸민다. (fall asleep 잠들다)"}], "sum": "아침 한 잔은 하루 종일 가고, 오후에 한 잔 더 하면 저녁 잠들기 힘들어짐"}, {"i": "08", "q": "06", "s": "4", "title": "S+V(1형식) + 전치사구 + 계속적 which", "eng": "It spreads<sup>1</sup> outward<sup>2</sup>, / in a manner not unlike<sup>3</sup> transmissible disease<sup>4</sup>, / which itself typically<sup>5</sup> \"takes off<sup>6</sup>\" in cities.", "notes": [["1", "spread", "퍼지다"], ["2", "outward", "바깥으로"], ["3", "not unlike", "~와 다르지 않은"], ["4", "transmissible disease", "전염성 질병"], ["5", "typically", "대개, 일반적으로"], ["6", "take off", "급격히 번지다"]], "lit": "그것은 바깥으로 퍼져 나간다 / 전염성 질병과 다르지 않은 방식으로 / 그리고 그 질병 자체도 대개 도시에서 급격히 번진다", "nat": "그것은 전염병과 크게 다르지 않은 방식으로 바깥으로 퍼져 나가는데, 그 전염병 역시 대개 도시에서 급격히 번진다.", "ana": "<b>not unlike</b>는 <b>이중부정</b>이라 '<b>~와 비슷한</b>'이라는 강한 긍정입니다. not만 보고 '아니다'로 처리하면 뜻이 뒤집힙니다. 콤마 뒤 <b>which</b>는 <b>계속적 용법</b>으로 앞의 <b>transmissible disease</b>를 받아 '그런데 그 질병은'으로 이어 읽습니다. <b>itself</b>는 강조하는 재귀대명사이고, <b>take off</b>는 '이륙하다'가 아니라 여기서 <b>급속히 번지다</b>입니다.", "pe": "It spreads<sup>1</sup> \u0001outward<sup>2</sup>\u0002, / \u0001in a manner not unlike<sup>3</sup> transmissible disease<sup>4</sup>\u0002, / \u0001which itself typically<sup>5</sup> \"takes off<sup>6</sup>\" in cities\u0002.", "pk": "그것은 \u0001바깥으로\u0002 퍼져 나간다 / \u0001전염성 질병과 다르지 않은 방식으로\u0002 / \u0001그리고 그 질병 자체도 대개 도시에서 급격히 번진다\u0002", "core": "그것은 퍼져 나간다.", "tags": ["주어 It + 동사 spreads (1형식). outward = 부사: spreads를 꾸밈", "in a manner ~ = 전치사구(부사구): spreads를 꾸밈. <b>not unlike</b> = 이중부정, 강하지 않은 긍정 (~와 비슷한)", "<b>계속적 which</b> = 관계절(형용사절): disease를 받음. takes off = 급격히 번지다"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 뒤에 비유 전치사구와 계속적 관계절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (그것)", "V: spreads (spread 퍼지다)", "뼈대 = <b>It spreads</b>", "outward = 바깥으로 (부사)"]}, {"t": "<b>in a manner not unlike transmissible disease</b>는 전치사구(부사구)이다. spreads를 꾸민다.", "sub": ["not unlike = ~와 비슷한 (이중 부정. 크게 다르지 않은)", "manner 방식, transmissible disease 전염병"]}, {"t": "<b>which itself typically \"takes off\" in cities</b>는 계속적 관계절이다. which는 transmissible disease를 가리킨다. itself는 '그 전염병 자체도'라는 강조이다. (take off 급격히 번지다, typically 대개)"}, {"t": "함정: not unlike는 이중 부정이다. '비슷하다'는 뜻이다."}], "sum": "그것, 전염병과 닮은 방식으로 바깥으로 퍼짐"}], "qs": [{"q": "01", "type": "글의 요지", "src": "2020년 11월 22번", "ans": "③", "tr": [["1", "대다수의 기업과 학교, 조직은 판매 수치, 이력서에 적힌 수상 경력, 시험 점수 같은 개인의 성과라는 관점에서 '높은 성과'를 측정하고 보상한다."], ["2", "이 접근법의 문제는, 과학이 완전히 입증했다고 우리가 여겨 온 믿음, 곧 우리가 '적자생존'의 세계에 살고 있다는 믿음에 근거한다는 점이다."], ["3", "그 믿음은 최고의 성적, 가장 인상적인 이력서, 혹은 최고 점수를 가진 사람들만이 성공할 유일한 사람들이라고 우리에게 가르친다."], ["4", "공식은 단순하다. 남들보다 더 낫고 더 똑똑하고 더 창의적이면 성공한다는 것이다."], ["5", "그러나 이 공식은 부정확하다."], ["6", "새로운 연구 덕분에 우리는 이제, 자신의 최고 잠재력에 도달하는 일이 '적자생존'이 아니라 '최적자 생존(가장 잘 어울리는 자의 생존)'의 문제임을 안다."], ["7", "다시 말해, 성공은 당신이 얼마나 창의적이고 똑똑하고 추진력 있느냐가 아니라, 주변 사람들이라는 생태계와 얼마나 잘 관계 맺고 기여하고 그로부터 이득을 얻느냐의 문제다."]], "evh": "6 · 7번 문장", "ev": [{"en": true, "h": "achieving our highest potential is not about survival of the fittest but survival of the best fit. / success is not just about how creative or smart or driven you are, but how well you are able to connect with, contribute to, and benefit from the ecosystem of people around you."}, {"en": false, "h": "이 글은 <b>not A but B</b> 구조가 두 번 반복되는 전형적인 반전형 글입니다. 1~4번은 통념(개인의 성과 = 적자생존)을 길게 깔아 놓은 것이고, 5번의 <b>But this formula is inaccurate</b>가 방향을 꺾습니다. 요지는 반드시 <b>but 뒤</b>, 즉 6·7번에 있습니다 — <b>survival of the best fit</b>, <b>connect with · contribute to · benefit from</b>이 핵심어입니다. 앞부분이 길다고 그쪽을 요지로 잡으면 안 됩니다."}], "opts": [{"n": "①", "t": "효율적인 업무 배분은 조직의 생산성을 향상시킨다.", "a": false, "x": true, "trap": false, "e": "업무 배분(distribution)이나 생산성 이야기는 나오지 않습니다. organization이라는 단어만 겹칩니다."}, {"n": "②", "t": "유연한 사고방식은 원활한 의사소통에 도움이 된다.", "a": false, "x": true, "trap": false, "e": "'유연한 사고'는 글에 없는 말입니다. 7번의 connect with는 <b>관계 맺기</b>이지 의사소통 기술이 아닙니다."}, {"n": "③", "t": "사람들과 잘 어울려 일하는 능력이 성공을 가능하게 한다.", "a": true, "x": false, "trap": false, "e": "7번의 <b>connect with, contribute to, and benefit from the ecosystem of people around you</b>를 그대로 옮긴 문장입니다."}, {"n": "④", "t": "비판적 사고 능력은 정확성을 추구하는 태도에서 출발한다.", "a": false, "x": true, "trap": false, "e": "비판적 사고나 정확성은 언급되지 않습니다. 5번의 inaccurate를 보고 '정확성'으로 연결하면 안 됩니다."}, {"n": "⑤", "t": "치열한 경쟁 사회에서 최고의 실력을 갖추는 것이 필수적이다.", "a": false, "x": true, "trap": true, "e": "이것이 바로 글이 <b>부정하는 통념</b>(1~4번)입니다. but 앞의 내용을 요지로 고른 대표적인 함정입니다."}], "w": [["the vast majority of", "~의 대다수"], ["in terms of", "~의 관점에서"], ["accolade", "수상, 표창"], ["be based on", "~에 근거하다"], ["confirm", "입증하다"], ["survival of the fittest", "적자생존"], ["formula", "공식"], ["inaccurate", "부정확한"], ["potential", "잠재력"], ["connect with", "~와 관계를 맺다"], ["contribute to", "~에 기여하다"], ["ecosystem", "생태계"]]}, {"q": "02", "type": "심경 변화", "src": "2017학년도 수능 19번", "ans": "①", "tr": [["1", "활짝 웃으며, 귀여운 세 살배기 남자아이 Breaden은 과자와 바, 사탕이 놓인 통로를 걷고 있었다."], ["2", "그곳은 그에게 온갖 종류의 유혹이 있는 통로였다."], ["3", "\"우와!\" 그가 소리쳤다."], ["4", "바로 눈앞에는 손길을 기다리는 맛있어 보이는 초콜릿 바가 줄줄이 놓여 있었다."], ["5", "엄마는 그의 손을 잡고 있었다."], ["6", "외동아이인 Breaden은 늘 엄마의 관심의 중심이었고, 엄마는 마트에서 아이를 잃어버리지 않으려 조심하고 있었다."], ["7", "갑자기 엄마가 친구들에게 인사하려고 멈춰 섰다."], ["8", "Breaden도 멈췄다."], ["9", "눈을 크게 뜨고 입에 침이 고인 채, Breaden은 팔을 뻗어 초콜릿 바를 막 움켜쥐려던 순간 손에 꽉 쥐는 힘을 느꼈다."], ["10", "그는 올려다보았다."], ["11", "\"Breaden, 오늘은 안 돼!\""], ["12", "그는 그 말이 무슨 뜻인지 알았다."], ["13", "\"알았어요, 엄마.\" 그는 한숨을 쉬었다."], ["14", "그의 어깨가 축 처졌다."]], "evh": "1 · 3 · 13 · 14번 문장", "ev": [{"en": true, "h": "All smiling, Breaden ... \"Wow!\" he exclaimed. / \"Okay, Mommy,\" he sighed. His shoulders fell."}, {"en": false, "h": "심경 변화는 <b>맨 앞의 감정 표시</b>와 <b>맨 뒤의 몸짓</b> 두 군데만 정확히 잡으면 끝납니다. 앞은 1번의 <b>All smiling</b>과 3번의 <b>\"Wow!\" he exclaimed</b>, 그리고 4번의 <b>침이 고이는</b> 장면까지 모두 <b>들뜸(excited)</b>입니다. 뒤는 13번의 <b>sighed</b>와 14번의 <b>His shoulders fell</b>로, 원하던 것을 못 얻은 <b>실망(disappointed)</b>입니다. 중간의 엄마 이야기는 감정이 꺾이는 <b>계기</b>일 뿐입니다."}], "opts": [{"n": "①", "t": "excited → disappointed", "a": true, "x": false, "trap": false, "e": "앞의 All smiling · Wow! · mouth watering이 excited, 뒤의 sighed · shoulders fell이 disappointed입니다."}, {"n": "②", "t": "embarrassed → satisfied", "a": false, "x": true, "trap": false, "e": "아이가 <b>당황한</b> 장면이 없고, 끝에서 <b>만족</b>하지도 않습니다. 앞뒤가 모두 어긋납니다."}, {"n": "③", "t": "lonely → pleased", "a": false, "x": true, "trap": false, "e": "엄마가 계속 손을 잡고 있으므로 <b>외로울</b> 상황이 아니고, 결말도 기쁨이 아닙니다."}, {"n": "④", "t": "annoyed → relieved", "a": false, "x": true, "trap": true, "e": "초반은 짜증이 아니라 <b>신남</b>입니다. shoulders fell을 '긴장이 풀렸다'로 읽으면 relieved로 착각하기 쉽지만, 그것은 <b>낙담</b>의 몸짓입니다."}, {"n": "⑤", "t": "delighted → jealous", "a": false, "x": true, "trap": false, "e": "앞은 맞지만 뒤가 <b>질투</b>가 아닙니다. 비교 대상이 되는 다른 아이가 등장하지 않습니다. 앞만 맞고 뒤가 틀린 전형적인 반쪽 선지입니다."}], "w": [["aisle", "통로, 복도"], ["temptation", "유혹"], ["exclaim", "외치다"], ["row", "줄, 열"], ["only child", "외동아이"], ["cautious", "조심스러운"], ["mouth watering", "입에 침이 고이는"], ["stretch out", "(팔을) 뻗다"], ["be about to", "막 ~하려 하다"], ["grip", "꽉 쥠"], ["sigh", "한숨 쉬다"], ["shoulders fell", "어깨가 축 처졌다"]]}, {"q": "03", "type": "글의 주제", "src": "2014년 9월 22번", "ans": "④", "tr": [["1", "당신은 아마 스스로를 간지럽힐 수 없다는 것을 알 것이다."], ["2", "생판 모르는 사람을 간지럽히는 게 가능하긴 해도, 뇌는 그렇게 사회적으로 어색한 짓을 하지 못하도록 강하게 말린다."], ["3", "이런 사실들은 간지럽힘의 진화적 목적에 대한 통찰을 준다고, 『웃음: 과학적 탐구』의 저자 Robert R. Provine은 말한다."], ["4", "간지럽힘은 부분적으로 가까운 사이의 사회적 유대를 위한 기제이며, 가족과 친구 사이의 관계를 돈독하게 하는 데 도움이 된다고 그는 말한다."], ["5", "간지럽힘에 반응하는 웃음은 생후 첫 몇 달 사이에 시작된다."], ["6", "\"그것은 아기와 돌보는 사람 사이의 최초의 의사소통 형태 중 하나입니다.\"라고 Provine은 말한다."], ["7", "얼굴을 마주 보는 이 활동은 다른 상호작용의 길도 열어 준다."]], "evh": "4 · 7번 문장", "ev": [{"en": true, "h": "Tickling, he says, is partly a mechanism for social bonding between close companions and helps strengthen relationships between family members and friends. / The face-to-face activity also opens the door for other interactions."}, {"en": false, "h": "주제문은 4번 하나로 충분합니다 — <b>social bonding between close companions</b>, <b>strengthen relationships between family members and friends</b>. 1·2번은 '스스로는 못 간지럽힌다 · 남한테는 안 한다'는 <b>도입 사실</b>이고, 5·6번은 그 유대가 <b>언제부터</b> 시작되는지를 덧붙인 것입니다. 주제 선지는 <b>tickling(간지럽힘)</b>이 주인공이어야 하고 <b>가까운 사이의 유대</b>가 들어가야 합니다 — laughter가 주인공인 선지는 초점이 어긋난 것입니다."}], "opts": [{"n": "①", "t": "positive impacts of laughter on communication", "a": false, "x": true, "trap": true, "e": "주인공이 <b>laughter</b>로 바뀌었습니다. 웃음은 간지럽힘에 <b>반응해서</b> 나오는 결과일 뿐, 글의 중심은 tickling입니다."}, {"n": "②", "t": "harmful influence of tickling on new-born babies", "a": false, "x": true, "trap": false, "e": "<b>harmful</b>이 완전히 반대입니다. 글은 간지럽힘의 <b>긍정적 기능</b>을 말합니다."}, {"n": "③", "t": "effects of physical contact on cognitive development", "a": false, "x": true, "trap": false, "e": "<b>인지 발달</b>은 언급되지 않습니다. 글이 말하는 것은 인지가 아니라 <b>사회적 유대</b>입니다."}, {"n": "④", "t": "role of tickling in building bonds between close relations", "a": true, "x": false, "trap": false, "e": "4번의 social bonding between close companions를 그대로 옮긴 것으로, 주인공(tickling)과 초점(유대)이 모두 맞습니다."}, {"n": "⑤", "t": "importance of verbal interaction between parents and babies", "a": false, "x": true, "trap": false, "e": "간지럽힘은 <b>말이 아닌</b> 소통입니다. 6번의 communication을 보고 verbal로 넘겨짚으면 틀립니다."}], "w": [["tickle", "간지럽히다"], ["total stranger", "생판 남"], ["discourage A from -ing", "A가 ~하지 못하게 막다"], ["awkward", "어색한"], ["insight", "통찰"], ["evolutionary", "진화의"], ["mechanism", "기제"], ["social bonding", "사회적 유대"], ["companion", "동료, 벗"], ["strengthen", "강화하다"], ["kick in", "시작되다"], ["caregiver", "돌보는 사람"]]}, {"q": "04", "type": "어법", "src": "2017년 3월 28번", "ans": "③", "tr": [["1", "출판사에 원고를 팔기 위한 경쟁은 치열하다."], ["2", "출판사에 보내지는 원고 가운데 실제로 출판되는 것은 1퍼센트도 안 될 것이라고 나는 본다."], ["3", "너무나 많은 원고가 쓰이고 있기 때문에, 출판사는 매우 까다롭게 고를 수 있다."], ["4", "그들이 출판하기로 선택하는 원고는 상업적 가치가 있어야 할 뿐 아니라, 매우 훌륭하게 쓰였고 편집상·사실 관계의 오류가 없어야 한다."], ["5", "오류가 들어 있는 원고는 출판이 받아들여질 가능성이 거의 없다."], ["6", "대부분의 출판사는 원고에 실수가 너무 많은 작가와 시간을 낭비하고 싶어 하지 않을 것이다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "The material they choose to publish must not only have commercial value, but ③ being very competently written and free of editing and factual errors."}, {"en": false, "h": "밑줄이 <b>동사 자리</b>인지 <b>준동사 자리</b>인지부터 가릅니다. 이 문장은 <b>not only A but (also) B</b> 구조이고, A 자리에 조동사 must 뒤의 <b>동사원형 have</b>가 왔습니다. 병렬은 <b>같은 형태끼리</b> 이어야 하므로 B 자리에도 must에 걸리는 <b>동사원형 be</b>가 와야 합니다. 따라서 <b>being → be</b>. 상관접속사가 보이면 반드시 <b>양쪽 형태를 맞춰 보는</b> 습관을 들이세요."}], "opts": [{"n": "①", "t": "is (The competition to sell manuscripts to publishers ① is fierce)", "a": false, "x": true, "trap": false, "e": "주어의 핵은 <b>The competition</b>(단수)입니다. to sell 이하는 competition을 꾸미는 to부정사구일 뿐이므로 is가 맞습니다."}, {"n": "②", "t": "sent (the material ② sent to publishers)", "a": false, "x": true, "trap": false, "e": "the material을 뒤에서 꾸미는 <b>과거분사</b>입니다. 원고는 '보내진' 것이므로 수동이 맞고, 문장의 동사는 뒤의 is published입니다."}, {"n": "③", "t": "being → be", "a": true, "x": false, "trap": false, "e": "<b>not only A but B</b>에서 A가 조동사 must 뒤의 동사원형 have이므로, B도 <b>동사원형 be</b>여야 병렬이 성립합니다."}, {"n": "④", "t": "little (stands ④ little chance at being accepted)", "a": false, "x": true, "trap": true, "e": "chance는 셀 수 있는 명사이지만 여기서는 '<b>가능성</b>'이라는 뜻의 불가산 용법이라 <b>little</b>이 맞습니다. '거의 없다'는 부정의 뜻입니다."}, {"n": "⑤", "t": "whose (writers ⑤ whose material contains too many mistakes)", "a": false, "x": true, "trap": false, "e": "뒤에 <b>material</b>이라는 명사가 바로 붙어 있고 '작가<b>의</b> 원고'라는 소유 관계이므로 <b>소유격 관계대명사 whose</b>가 맞습니다."}], "w": [["manuscript", "원고"], ["fierce", "치열한"], ["estimate", "추정하다"], ["material", "자료, 원고"], ["selective", "까다롭게 고르는"], ["commercial value", "상업적 가치"], ["competently", "유능하게, 훌륭하게"], ["be free of", "~이 없다"], ["contain", "담고 있다"], ["stand little chance", "가능성이 거의 없다"], ["whose", "(소유격) ~의"]]}, {"q": "05", "type": "문맥상 어휘", "src": "2023년 9월 30번", "ans": "④", "tr": [["1", "카페인의 '충격'은 결국 사라진다."], ["2", "카페인은 간 속의 효소에 의해 몸에서 제거되는데, 그 효소가 시간이 지나면서 카페인을 서서히 분해한다."], ["3", "상당 부분 유전 때문에, 어떤 사람은 카페인을 분해하는 효소가 더 효율적인 형태여서 간이 카페인을 혈류에서 빠르게 없앨 수 있다."], ["4", "이런 드문 사람들은 저녁 식사와 함께 에스프레소를 마시고도 자정에 아무 문제 없이 깊이 잠들 수 있다."], ["5", "그러나 다른 사람들은 더 느리게 작용하는 형태의 효소를 갖고 있다."], ["6", "같은 양의 카페인을 몸에서 없애는 데 훨씬 더 오래 걸린다."], ["7", "그 결과 그들은 카페인의 영향에 매우 둔감하다(→ 민감하다)."], ["8", "아침에 마신 차나 커피 한 잔이 하루 종일 남아 있어서, 혹시 이른 오후에라도 두 잔째를 마시면 저녁에 잠들기 힘들어진다."], ["9", "노화 또한 카페인 제거 속도를 바꾼다. 나이가 들수록 뇌와 몸이 카페인을 없애는 데 더 오래 걸리고, 따라서 나이가 들면서 카페인의 수면 방해 영향에 더 민감해진다."]], "evh": "6 · 7 · 8번 문장", "ev": [{"en": true, "h": "It takes far longer for their system to eliminate the same amount of caffeine. As a result, they are very ④ insensitive to caffeine's effects. One cup of tea or coffee in the morning will last much of the day ..."}, {"en": false, "h": "어휘 문제는 <b>As a result · thus · so</b> 앞뒤를 붙여 읽으면 대부분 잡힙니다. 6번에서 '<b>제거에 훨씬 더 오래 걸린다</b>'고 했으니, 그 결과는 카페인 영향을 <b>더 오래·더 강하게 받는다</b>여야 합니다. 게다가 바로 뒤 8번이 '<b>한 잔이 하루 종일 간다 · 저녁에 못 잔다</b>'로 그 결과를 구체적으로 보여 줍니다. insensitive(둔감한)를 넣으면 6번과도 8번과도 충돌하므로 <b>sensitive</b>가 되어야 합니다. 9번 끝의 <b>more sensitive</b>도 같은 방향을 확인해 줍니다."}], "opts": [{"n": "①", "t": "removed (카페인은 간 속 효소에 의해 몸에서 제거된다)", "a": false, "x": true, "trap": false, "e": "바로 뒤의 <b>degrades it over time</b>(서서히 분해한다)과 같은 방향입니다. 첫 문장의 wear off와도 맞습니다."}, {"n": "②", "t": "allowing (효소가 간이 카페인을 빠르게 없애게 해 준다)", "a": false, "x": true, "trap": false, "e": "'더 효율적인 효소'의 결과이므로 <b>빠르게 제거하도록 해 준다</b>가 자연스럽습니다. 4번의 '자정에도 잘 잔다'가 이를 뒷받침합니다."}, {"n": "③", "t": "longer (같은 양을 없애는 데 훨씬 더 오래 걸린다)", "a": false, "x": true, "trap": false, "e": "5번의 <b>slower-acting</b>(더 느리게 작용하는)과 정확히 이어집니다."}, {"n": "④", "t": "insensitive → sensitive", "a": true, "x": false, "trap": false, "e": "제거가 느리면 영향을 <b>더 크게</b> 받습니다. 8번의 '한 잔이 하루 종일 간다'와 9번의 more sensitive가 모두 sensitive를 가리킵니다."}, {"n": "⑤", "t": "alters (노화 또한 카페인 제거 속도를 바꾼다)", "a": false, "x": true, "trap": true, "e": "콜론 뒤에서 '<b>나이가 들수록 더 오래 걸린다</b>'며 변화를 구체적으로 설명하므로 alters가 맞습니다."}], "w": [["wear off", "(효과가) 사라지다"], ["enzyme", "효소"], ["liver", "간"], ["degrade", "분해하다"], ["genetics", "유전(학)"], ["bloodstream", "혈류"], ["eliminate", "제거하다"], ["insensitive", "둔감한"], ["sensitive", "민감한"], ["alter", "바꾸다"], ["clearance", "제거"], ["sleep-disrupting", "수면을 방해하는"]]}, {"q": "06", "type": "빈칸 추론", "src": "2023학년도 수능 32번", "ans": "②", "tr": [["1", "사람들은 늘 다른 사람들 곁에 있고 그들에게서 배우고 싶어 했다."], ["2", "도시는 오랫동안 사회적 가능성의 원동력이자 예술, 음악, 패션의 주물 공장이었다."], ["3", "속어, 혹은 원한다면 '어휘 혁신'이라 부를 것은 늘 도시에서 시작되었다 — 그토록 자주 서로에게 노출된 온갖 다른 사람들이 만들어 낸 산물로서."], ["4", "그것은 전염병과 크게 다르지 않은 방식으로 바깥으로 퍼져 나가는데, 그 전염병 역시 대개 도시에서 급격히 번진다."], ["5", "저명한 언어학자 Leonard Bloomfield function buildQuestions(){

      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);

        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}

  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
