<title>고2 미니모의고사 14회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

e curriculum, students begin to link different subjects and classes. / If they practice abstracting in writing class, if they work on abstracting in painting or drawing class, and if, in all cases, they call it abstracting, they begin to understand how to think beyond disciplinary boundaries.", "ev_ko": [[3, "교육 과정 전반에 걸쳐 동일한 용어가 사용될 때, 학생들은 서로 다른 과목들과 수업들을 연결하기 시작한다."], [4, "그들이 글쓰기 수업에서 추상을 연습하고, 회화나 그림 그리기 수업에서 추상을 연습하고, 그리고 모든 경우에 그것을 추상이라고 칭한다면, 그들은 어떻게 학문의 경계를 넘어 사고하는지 이해하기 시작한다."]], "why": ["2번은 공통 언어가 학문 간 연결 고리를 발견하게 해 준다고 말합니다", "3번은 교육 과정 전반에서 같은 용어를 쓰면 학생들이 과목들을 연결하기 시작한다고 합니다", "4·5번은 그 예시와 사고의 전환이고, 6번은 학문들을 연결하는 일이 자연스러워진다는 결론입니다", "그래서 주제는 '교육 과정을 통합하기 위해 공통 언어를 사용하는 것의 필요성'입니다."], "ch": [{"n": "①", "t": "difficulties in finding meaningful links between disciplines", "g": "학문 간의 의미 있는 연결을 찾아내는 것의 어려움", "ok": false, "e": ["이 글은 어려움이 아니라, 공통 언어를 쓰면 학문 간 연결이 <b>자연스럽게<\/b> 이루어진다고 말합니다(3·6번)."]}, {"n": "②", "t": "drawbacks of applying a common language to various fields", "g": "다양한 분야에 공통 언어를 적용하는 것의 문제점", "ok": false, "e": ["공통 언어의 <b>문제점<\/b>이 아니라, 연결을 돕는 <b>이점<\/b>을 설명하는 글입니다(2·3번)."]}, {"n": "③", "t": "effects of diversifying the curriculum on students' creativity", "g": "교육 과정 다양화가 학생들의 창의력에 미치는 영향", "ok": false, "e": ["교육 과정을 <b>다양화<\/b>하는 것이 아니라, 공통 언어로 <b>통합<\/b>하는 것에 관한 글입니다."]}, {"n": "④", "t": "necessity of using a common language to integrate the curriculum", "g": "교육 과정을 통합하기 위해 공통 언어를 사용하는 것의 필요성", "ok": true, "e": ["공통 언어가 학문 간 연결과 통합을 가능하게 한다는 2·3·4·6번 내용과 일치합니다."]}, {"n": "⑤", "t": "usefulness of turning abstract thoughts into concrete expressions", "g": "추상적인 생각을 구체적인 표현으로 전환하는 것의 유용성", "ok": false, "e": ["4번에서 추상을 연습한다는 말은 공통 용어를 쓰는 <b>예시<\/b>일 뿐입니다", "글의 중심은 공통 언어로 학문을 연결하는 것입니다."]}], "tr": ["교육은 나뭇가지, 잔가지, 그리고 잎이 모두 공통의 핵심에서 나오는 방식을 밝히면서, 지식의 나무 줄기에 초점을 맞춰야 한다.", "다양한 분야의 실무자들이 혁신 과정에 대한 그들의 경험을 공유하고 그들의 창의적 활동 사이의 연결 고리를 발견할 수 있는 공통 언어를 제공하면서, 사고를 위한 도구는 이 핵심에서 비롯된다.", "교육 과정 전반에 걸쳐 동일한 용어가 사용될 때, 학생들은 서로 다른 과목들과 수업들을 연결하기 시작한다.", "그 function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function noteList(){
  const out=[],ck=S.checks[WS.id]||{};

    if(parts.length)out.push({i:i,w:w,parts:parts});

}

nat": "《Wheatfield—A Confrontation》을 위해, Denes와 자원봉사자들은 4에이커의 땅에서 쓰레기를 치운 다음 그 지역 위에 황금빛 물결치는 곡물을 심었다.", "ana": "<b>removed와 planted</b> 두 동사가 연속으로 이어지는 <b>시간 순서를 나타내는 병렬구조</b>이다.", "pe": "\u0001For 《Wheatfield — A Confrontation》\u0002, / Denes and her volunteers<sup>1</sup> removed trash \u0001from four acres<sup>2</sup> of land\u0002, / \u0001then\u0002 planted \u0001amber\u0002 waves \u0001of grain<sup>3</sup>\u0002 / \u0001atop the area\u0002.", "pk": "\u0001《Wheatfield—A Confrontation》을 위해\u0002, / Denes와 자원봉사자들은 \u00014에이커의 땅에서\u0002 쓰레기를 치웠다, / \u0001그런 다음\u0002 황금빛 물결치는 곡물을 심었다 / \u0001그 지역 위에\u0002.", "core": "Denes와 자원봉사자들은 쓰레기를 치우고 물결을 심었다.", "tags": ["For ~ = 전치사구(부사구): 문장 전체 꾸밈 ('~을 위해')", "Denes and volunteers removed trash (3형식). from four acres = 전치사구(부사구): removed 꾸밈, 거의 필수에 가까운 부사구(remove ~ from). of land: acres 꾸밈", "then planted waves: <b>동사 병렬</b>(removed, planted). then = 부사: planted 꾸밈. amber = 형용사: waves 꾸밈. of grain = 전치사구(형용사구): waves 꾸밈", "atop the area = 전치사구(부사구): planted를 꾸밈 ('그 지역 위에'), 거의 필수에 가까운 부사구(plant A atop B)"], "steps": [{"t": "이 문장은 <b>부사구 + S + V1 + O, then V2 + O</b>, 동사가 병렬된 3형식이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Denes and her volunteers (Denes와 그녀의 자원봉사자들, volunteer 자원봉사자)", "V1: removed (remove 치우다의 과거형) / O1: trash (쓰레기)", "V2: planted (plant 심다의 과거형) / O2: amber waves of grain (황금빛 물결치는 곡물)", "뼈대 = <b>Denes and her volunteers removed trash, then planted amber waves of grain</b>", "her = Denes"]}, {"t": "<b>For 《Wheatfield — A Confrontation》</b>은 '~을 위해'라는 부사구로 문장 전체를 꾸민다. 작품 제목이라 영어 그대로 둔다.", "sub": ["Wheatfield (밀밭), Confrontation (대면, 맞섬)"]}, {"t": "<b>from four acres of land</b>는 removed를 꾸미는 전치사구이다.", "sub": ["remove A from B = A를 B에서 치우다", "acre (에이커, 땅 넓이 단위)"]}, {"t": "<b>then planted amber waves of grain atop the area</b>에서 then(그런 다음)이 앞뒤 동사를 순서대로 잇는다. 함정: 병렬되는 것은 removed와 planted이다.", "sub": ["amber (황금빛), waves of grain (물결치는 곡물, wave 물결의 복수형 waves, grain 곡물)", "atop the area (그 지역 위에)는 planted를 꾸미는 전치사구"]}], "sum": "Denes와 자원봉사자들, 쓰레기를 치운 뒤 그 땅에 황금빛 곡물 심기"}, {"i": "05", "q": "04", "s": "5", "title": "S+V+O + because절 + 전치사+관계대명사", "eng": "He was trying to warn<sup>1</sup> hikers against taking the right trail<sup>2</sup> / because there is a bear in the area / through which it passes<sup>3</sup>.", "notes": [["1", "warn", "경고하다"], ["2", "trail", "길, 산길"], ["3", "pass through", "~을 지나가다"]], "lit": "그는 등산객들에게 오른쪽 길로 가지 말라고 경고하려 했다 / 그 지역에 곰이 있기 때문에 / 그 길이 지나가는(지역).", "nat": "그는 등산객들에게 오른쪽 길로 가지 말라고 경고하려 했는데, 그 길이 지나가는 지역에 곰이 있었기 때문이다.", "ana": "<b>because ~</b>는 이유를 나타내는 부사절이고, through which는 '전치사+관계대명사' 형태로 the area를 수식하는 <b>관계사절</b>이다.", "pe": "He was trying to warn<sup>1</sup> hikers \u0001against taking the right trail<sup>2</sup>\u0002 / \u0001because there is a bear in the area\u0002 / \u0001through which it passes<sup>3</sup>\u0002.", "pk": "그는 등산객들에게 \u0001오른쪽 길로 가지 말라고\u0002 경고하려 했다 / \u0001그 지역에 곰이 있기 때문에\u0002 / \u0001그 길이 지나가는(지역)\u0002.", "core": "그는 등산객들에게 경고하려 했다.", "tags": ["He was trying to warn hikers: 시도하다 + to부정사, warn A: 3형식 SVO. against ~ = 전치사구(부사구): warn 꾸밈, 거의 필수에 가까운 부사구(warn A against B) [기준: 모양 규칙]", "because절 = 이유 부사절: was trying to warn을 꾸밈. there is a bear = there 구문", "through which it passes = <b>전치사 + 관계대명사</b>절(형용사절): the area 꾸밈. 이 절도 because절 안"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식) + because절</b>이다. 맨 뒤의 <b>through which</b>가 낯설어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: He (그)", "V: was trying (try 애쓰다, 시도하다의 과거진행)", "O: to warn hikers (등산객들에게 경고하는 것, warn 경고하다)", "안쪽: warn + O: hikers (등산객들)", "뼈대 = <b>He was trying to warn hikers</b>", "기준: warn A against B의 against구는 거의 필수에 가까운 부사구이지만 수식어로 본다."]}, {"t": "<b>against taking the right trail</b>은 '오른쪽 길을 택하지 말라고'이다. against는 전치사라서 동명사 taking을 쓴다.", "sub": ["take (택하다, 가다)", "trail (산길)"]}, {"t": "<b>because there is a bear in the area</b>는 이유 부사절이다. there 구문이다.", "sub": ["there is (있다) / S: a bear (곰) / in the area (그 지역에)"]}, {"t": "<b>through which it passes</b>는 area를 꾸미는 <b>전치사 + 관계대명사</b> 관계절이다. it passes through the area에서 through the area가 앞으로 나온 모양이다.", "sub": ["it = the right trail (그 길)", "pass through ~ (~을 지나가다)"]}, {"t": "함정: through which 뒤는 완전한 문장(it passes)이다. 전치사가 which 앞으로 갔기 때문이다."}], "sum": "곰이 있는 지역을 지나는 오른쪽 길, 가지 말라고 등산객에게 경고하려 함"}, {"i": "06", "q": "05", "s": "4", "title": "If절 3개 병렬 + 주절", "eng": "If they practice abstracting<sup>1</sup> in writing class, / if they work on abstracting in painting or drawing class, / and if, in all cases, they call it abstracting, / they begin to understand how to think beyond disciplinary boundaries<sup>2</sup>.", "notes": [["1", "abstract", "추상화하다"], ["2", "disciplinary boundary", "학문의 경계"]], "lit": "만약 학생들이 글쓰기 수업에서 추상화를 연습하고, / 그림이나 회화 수업에서도 추상화를 연습하며, / 그리고 모든 경우에 그것을 '추상화하기'라고 부른다면, / 그들은 학문의 경계를 넘어 생각하는 법을 이해하기 시작한다.", "nat": "학생들이 글쓰기 수업에서도, 그림이나 회화 수업에서도 추상화를 연습하고 모든 경우에 그것을 '추상화하기'라고 부른다면, 그들은 학문의 경계를 넘어 생각하는 법을 이해하기 시작한다.", "ana": "<b>if절 세 개</b>가 and로 <b>병렬</b> 연결되어 하나의 조건을 이루는 구조이다.", "pe": "\u0001If they practice abstracting<sup>1</sup> in writing class\u0002, / \u0001if they work on abstracting in painting or drawing class\u0002, / \u0001and if, in all cases, they call it abstracting\u0002, / they begin to understand how to think \u0001beyond disciplinary boundaries<sup>2</sup>\u0002.", "pk": "\u0001만약 학생들이 글쓰기 수업에서 추상화를 연습하고\u0002, / \u0001그림이나 회화 수업에서도 추상화를 연습하며\u0002, / \u0001그리고 모든 경우에 그것을 '추상화하기'라고 부른다면\u0002, / 그들은 \u0001학문의 경계를 넘어\u0002 생각하는 법을 이해하기 시작한다.", "core": "그들은 생각하는 법을 이해하기 시작한다.", "tags": ["If절 ① = 조건 부사절: 주절 they begin ~을 꾸밈. <b>if절 3개 병렬</b>의 첫째", "If절 ② = 조건 부사절: 주절 꾸밈. 병렬 둘째", "and if절 ③ = 조건 부사절: 주절 꾸밈. 병렬 셋째. in all cases는 삽입", "they begin to understand: 3형식 SVO. how to think ~ = 의문사 + to부정사(목적어). beyond ~ = 전치사구(부사구): think 꾸밈, 거의 필수에 가까운 부사구(think beyond)"], "steps": [{"t": "이 문장은 <b>If절 세 개 병렬 + 주절 S+V+O(3형식)</b>이다. 조건절이 셋이라 주절이 맨 마지막에 나온다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: they (그들, 직독 해석에서는 학생들)", "V: begin (시작하다)", "O: to understand how to think (생각하는 법을 이해하는 것)", "뼈대 = <b>they begin to understand how to think</b>"]}, {"t": "첫째 조건절은 <b>If they practice abstracting in writing class</b>이다.", "sub": ["practice (연습하다)", "abstracting = abstract (추상화하다)의 동명사, 추상화하기", "writing class (글쓰기 수업)"]}, {"t": "둘째 <b>if they work on abstracting in painting or drawing class</b>와 셋째 <b>and if, in all cases, they call it abstracting</b>도 같은 조건절이다. and가 세 번째 if절 앞에서 세 조건절을 묶는다.", "sub": ["work on ~ (~에 공들이다), painting (회화), drawing (그림)", "in all cases (모든 경우에)는 삽입", "call it abstracting = call + O + C (그것을 abstracting이라 부르다)"]}, {"t": "<b>how to think beyond disciplinary boundaries</b>는 understand의 목적어('어떻게 생각할지')이다. 의문사 + to부정사 구조이다.", "sub": ["beyond ~ (~을 넘어서)", "disciplinary boundaries (학문의 경계, discipline 학문 분야, boundary 경계)"]}], "sum": "세 조건이 갖춰지면, 학문의 경계를 넘어 생각하는 법을 이해하기 시작"}, {"i": "07", "q": "06", "s": "2", "title": "Even though 양보절 + S+V+C + 관계대명사 what", "eng": "Even though the design, activities, and membership<sup>1</sup> of social media might change over time, / the content of what people posted / usually remains intact<sup>2</sup>.", "notes": [["1", "membership", "회원 구성"], ["2", "intact", "손상되지 않은, 그대로인"]], "lit": "소셜 미디어의 디자인, 활동, 회원 구성이 시간이 지나며 바뀌더라도, / 사람들이 게시한 내용은 / 대체로 그대로 남아 있다.", "nat": "소셜 미디어의 디자인, 활동, 회원 구성이 시간이 지나며 바뀌더라도, 사람들이 게시한 내용은 대체로 그대로 남아 있다.", "ana": "<b>Even though ~</b>는 양보를 나타내는 부사절이고, what people posted는 <b>선행사를 포함하는 관계대명사절</b>로 전치사 of의 목적어로 쓰였다.", "pe": "\u0001Even though the design, activities, and membership<sup>1</sup> of social media might change over time\u0002, / the content \u0001of what people posted\u0002 / \u0001usually\u0002 remains intact<sup>2</sup>.", "pk": "\u0001소셜 미디어의 디자인, 활동, 회원 구성이 시간이 지나며 바뀌더라도\u0002, / \u0001사람들이 게시한\u0002 내용은 / \u0001대체로\u0002 그대로 남아 있다.", "core": "내용은 그대로 남아 있다.", "tags": ["Even though절 = 양보 부사절: 주절 전체를 꾸밈 ('~하더라도')", "the content = 주어. of what ~ = 전치사구(형용사구): content 꾸밈. what people posted = 전치사 of의 목적어(<b>선행사 포함 what</b>)", "remains intact: 2형식 SVC (intact = 보어). usually = 부사: remains 꾸밈"], "steps": [{"t": "이 문장은 <b>Even though절 + S+V+C(2형식)</b>이다. 양보절의 주어에 명사가 셋 병렬되고, 주절 주어에 what절이 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The content (내용)", "V: remains (remain ~인 채로 남다)", "C: intact (손상되지 않은, 그대로인)", "뼈대 = <b>The content remains intact</b>", "remain 뒤에는 상태를 나타내는 보어가 필요한 2형식이다. usually (대체로)는 부사."]}, {"t": "<b>Even though the design, activities, and membership of social media might change over time</b>은 '~일지라도'라는 양보 부사절이다.", "sub": ["S: the design, activities, and membership (디자인, 활동, 회원 구성 — 명사 세 개 병렬, activities = activity 활동의 복수형)", "of social media (소셜 미디어의)", "V: might change (바뀔지도 모른다) / over time (시간이 지나며)"]}, {"t": "<b>of what people posted</b>는 content를 꾸미는 전치사구이다. what은 '~하는 것'이라는 뜻으로 of의 목적어(명사절)가 된다.", "sub": ["post (게시하다)의 과거형 posted, what people posted = 사람들이 게시한 것"]}], "sum": "소셜 미디어가 변해도, 사람들이 게시한 내용은 대체로 그대로"}, {"i": "08", "q": "06", "s": "5", "title": "Whenever절 + S+V(1형식) + 목적의 to부정사", "eng": "Whenever you want, / you can go back / to reexamine<sup>1</sup> those events from the past.", "notes": [["1", "reexamine", "다시 살펴보다"]], "lit": "당신이 원할 때마다, / 당신은 되돌아갈 수 있다 / 과거의 그 사건들을 다시 살펴보기 위해.", "nat": "원할 때면 언제든, 당신은 과거의 그 사건들로 되돌아가 다시 살펴볼 수 있다.", "ana": "<b>Whenever ~</b>는 '~할 때마다'라는 뜻의 복합관계부사절이고, to reexamine ~는 '~하기 위해'라는 <b>목적을 나타내는 to부정사</b>이다.", "pe": "\u0001Whenever you want\u0002, / you can go back / \u0001to reexamine<sup>1</sup> those events from the past\u0002.", "pk": "\u0001당신이 원할 때마다\u0002, / 당신은 되돌아갈 수 있다 / \u0001과거의 그 사건들을 다시 살펴보기 위해\u0002.", "core": "당신은 되돌아갈 수 있다.", "tags": ["Whenever절 = 부사절(<b>복합관계부사</b>, '~할 때마다'): 주절을 꾸밈", "you can go back: 1형식 SV (back은 go back 한 묶음)", "to reexamine ~ = to부정사(부사적: 목적): go back을 꾸밈. from the past = 전치사구(형용사구): events 꾸밈"], "steps": [{"t": "이 문장은 <b>Whenever절 + S+V(1형식) + to부정사</b>이다. 짧고 구조가 단순하다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: you (당신)", "V: can go back (go back 되돌아가다, can ~할 수 있다)", "뼈대 = <b>you can go back</b>", "back (뒤로)은 go back의 한 묶음"]}, {"t": "<b>Whenever you want</b>는 '원할 때마다'라는 부사절이다. whenever는 '~할 때마다, 언제든'이라는 복합관계부사이다. want 뒤의 to go back은 반복이라 생략되었다.", "sub": ["want (원하다)"]}, {"t": "<b>to reexamine those events from the past</b>는 '다시 살펴보기 위해'라는 <b>to부정사(목적)</b>로 go back을 꾸민다.", "sub": ["reexamine (다시 살펴보다)", "those events (그 사건들), from the past (과거의, events를 꾸밈)"]}], "sum": "원할 때마다, 과거의 사건으로 돌아가 다시 살펴볼 수 있음"}], "qs": [{"q": "01", "type": "주장", "src": "2016년 6월 20번", "ans": "②", "tr": [["1", "미루는 버릇에 빠져 있을 때, 어떻게 하면 꼼짝 못 하는 상태에서 벗어나 하루 중 가장 어려운 일을 해낼 수 있을까?"], ["2", "나는 \"개구리를 먹어라!\"라고 말한다."], ["3", "이 생각은 Mark Twain의 말에서 비롯된다: \"아침에 가장 먼저 살아 있는 개구리를 먹어라, 그러면 그날 남은 시간 동안 그보다 더 나쁜 일은 일어나지 않을 것이다.\""], ["4", "매일 아침, 할 일 목록에서 당신이 가장 두려워하는 항목을 처리하는 데 전념하고, 그것을 다른 무엇보다 먼저 하라."], ["5", "아침은 방해 요소가 적고 하루 업무 중에 쌓이는 스트레스에서 자유롭기 때문에, 글쓰기처럼 창의적인 일에서 생산적이어야 할 때 특히 이상적이다."], ["6", "하기 싫은 일에 먼저 뛰어들면서, 그 장애물을 극복하고도 여전히 하루 전체가 앞에 남아 있다는 것이 얼마나 기분 좋을지 상상해 보라."]], "evh": "4번 문장", "ev": [{"en": true, "h": "Every morning, commit to dealing with the item on your to-do list that you're dreading the most, and do it before anything else."}, {"en": false, "h": "가장 하기 싫은 일을 하루 중 가장 먼저 처리하라는 4번 문장을 종합하면, 필자의 주장은 '어렵고 싫은 일을 하루 중 가장 먼저 해야 한다'는 것이다."}], "opts": [{"n": "①", "t": "하기 싫은 일에 시간을 낭비하지 말아야 한다.", "a": false, "x": true, "trap": true, "e": "하기 싫은 일을 피하라는 것이 아니라 먼저 처리하라는 내용이다."}, {"n": "②", "t": "어렵고 싫은 일을 하루 중 가장 먼저 해야 한다.", "a": true, "x": false, "trap": false, "e": "가장 하기 싫은 일을 다른 무엇보다 먼저 처리하라는 4번 문장의 내용과 정확히 일치한다."}, {"n": "③", "t": "업무가 주는 과도한 스트레스에서 벗어나야 한다.", "a": false, "x": true, "trap": false, "e": "스트레스는 아침에 일하면 좋은 이유로 언급될 뿐, 중심 주장은 아니다."}, {"n": "④", "t": "힘든 일을 해결하려면 여러 명이 협동해야 한다.", "a": false, "x": true, "trap": false, "e": "협동에 관한 언급은 본문에 없다."}, {"n": "⑤", "t": "해야 할 일의 목록을 저녁에 작성해야 한다.", "a": false, "x": true, "trap": false, "e": "목록을 저녁에 작성하라는 내용은 본문에 없다."}], "w": [["procrastination", "미루는 버릇"], ["commit to", "전념하다"], ["dread", "두려워하다"], ["ideal", "이상적인"], ["distraction", "방해 요소"], ["accumulate", "쌓이다"], ["undesirable", "하기 싫은"], ["hurdle", "장애물"]]}, {"q": "02", "type": "심경 변화", "src": "2020년 3월 19번", "ans": "①", "tr": [["1", "Alice는 연설을 시작한 이후 처음으로 원고에서 고개를 들었다."], ["2", "그녀는 자리를 놓칠까 두려워, 연설을 끝낼 때까지 페이지 위의 글자에서 감히 시선을 떼지 못했었다."], ["3", "사실 그녀가 바란 것은 연설 중에 읽는 능력을 잃지 않는 것과 웃음거리가 되지 않고 끝까지 해내는 것, 이 두 가지뿐이었다."], ["4", "이제 강연장 전체가 일어서서 박수를 치고 있었다."], ["5", "그것은 그녀가 바랐던 것 이상이었다."], ["6", "환하게 웃으며, 그녀는 앞줄의 낯익은 얼굴들을 바라보았다."], ["7", "Tom은 박수를 치고 환호하며, 달려가서 그녀를 안고 축하해 주고 싶은 마음을 거의 참지 못하는 것처럼 보였다."], ["8", "그녀도 그를 어서 안아 주고 싶었다."]], "evh": "2·4·7번 문장", "ev": [{"en": true, "h": "She hadn't dared to break eye contact ~ for fear of losing her place. / the entire ballroom was standing, clapping. / Tom clapped and cheered"}, {"en": false, "h": "연설 중 자리를 놓칠까 두려워하던 긴장한 모습(2번)이, 연설이 끝난 뒤 사람들의 박수와 환호를 받으며 기쁨으로 바뀌는 모습(4·7번)으로 이어지므로 심경 변화는 'nervous → delighted'이다."}], "opts": [{"n": "①", "t": "nervous → delighted", "a": true, "x": false, "trap": false, "e": "자리를 놓칠까 두려워하던 긴장한 상태(2번)가 박수와 환호 속에 기쁨으로 바뀌는 모습(4·7번)과 정확히 일치한다."}, {"n": "②", "t": "embarrassed → scared", "a": false, "x": true, "trap": false, "e": "처음에는 창피함이 아니라 긴장·불안이었고, 끝에는 두려움이 아니라 기쁨을 느꼈다."}, {"n": "③", "t": "amazed → annoyed", "a": false, "x": true, "trap": false, "e": "처음에 놀란 것이 아니라 긴장한 상태였다."}, {"n": "④", "t": "hopeful → disappointed", "a": false, "x": true, "trap": true, "e": "끝에는 실망이 아니라 기대 이상의 기쁨을 느꼈다."}, {"n": "⑤", "t": "angry → grateful", "a": false, "x": true, "trap": false, "e": "화가 난 상태로 시작한 것이 아니다."}], "w": [["dare to", "감히 ~하다"], ["break eye contact", "시선을 떼다"], ["for fear of", "~할까 두려워"], ["make a fool of oneself", "웃음거리가 되다"], ["ballroom", "강연장, 연회장"], ["congratulate", "축하하다"]]}, {"q": "03", "type": "제목", "src": "2021년 9월 24번", "ans": "①", "tr": [["1", "화려한 고층 건물, 금융 본사, 관광 센터, 기념품 행상인들이 Battery Park City에 들어서기 전에, 세계무역센터 뒤편 지역은 거대하고 험악한 쓰레기 매립지였다."], ["2", "1982년, 예술가 Agnes Denes는 비록 일시적이긴 하지만 그 매립지를 원래의 뿌리로 되돌리기로 결심했다."], ["3", "Denes는 Public Art Fund로부터 맨해튼이 지금까지 본 가장 의미심장하고 환상적인 공공미
