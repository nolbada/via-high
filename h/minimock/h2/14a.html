<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

e curriculum, students begin to link different subjects and classes. / If they practice abstracting in writing class, if they work on abstracting in painting or drawing class, and if, in all cases, they call it abstracting, they begin to understand how to think beyond disciplinary boundaries.", "ev_ko": [[3, "교육 과정 전반에 걸쳐 동일한 용어가 사용될 때, 학생들은 서로 다른 과목들과 수업들을 연결하기 시작한다."], [4, "그들이 글쓰기 수업에서 추상을 연습하고, 회화나 그림 그리기 수업에서 추상을 연습하고, 그리고 모든 경우에 그것을 추상이라고 칭한다면, 그들은 어떻게 학문의 경계를 넘어 사고하는지 이해하기 시작한다."]], "why": ["2번은 공통 언어가 학문 간 연결 고리를 발견하게 해 준다고 말합니다", "3번은 교육 과정 전반에서 같은 용어를 쓰면 학생들이 과목들을 연결하기 시작한다고 합니다", "4·5번은 그 예시와 사고의 전환이고, 6번은 학문들을 연결하는 일이 자연스러워진다는 결론입니다", "그래서 주제는 '교육 과정을 통합하기 위해 공통 언어를 사용하는 것의 필요성'입니다."], "ch": [{"n": "①", "t": "difficulties in finding meaningful links between disciplines", "g": "학문 간의 의미 있는 연결을 찾아내는 것의 어려움", "ok": false, "e": ["이 글은 어려움이 아니라, 공통 언어를 쓰면 학문 간 연결이 <b>자연스럽게<\/b> 이루어진다고 말합니다(3·6번)."]}, {"n": "②", "t": "drawbacks of applying a common language to various fields", "g": "다양한 분야에 공통 언어를 적용하는 것의 문제점", "ok": false, "e": ["공통 언어의 <b>문제점<\/b>이 아니라, 연결을 돕는 <b>이점<\/b>을 설명하는 글입니다(2·3번)."]}, {"n": "③", "t": "effects of diversifying the curriculum on students' creativity", "g": "교육 과정 다양화가 학생들의 창의력에 미치는 영향", "ok": false, "e": ["교육 과정을 <b>다양화<\/b>하는 것이 아니라, 공통 언어로 <b>통합<\/b>하는 것에 관한 글입니다."]}, {"n": "④", "t": "necessity of using a common language to integrate the curriculum", "g": "교육 과정을 통합하기 위해 공통 언어를 사용하는 것의 필요성", "ok": true, "e": ["공통 언어가 학문 간 연결과 통합을 가능하게 한다는 2·3·4·6번 내용과 일치합니다."]}, {"n": "⑤", "t": "usefulness of turning abstract thoughts into concrete expressions", "g": "추상적인 생각을 구체적인 표현으로 전환하는 것의 유용성", "ok": false, "e": ["4번에서 추상을 연습한다는 말은 공통 용어를 쓰는 <b>예시<\/b>일 뿐입니다", "글의 중심은 공통 언어로 학문을 연결하는 것입니다."]}], "tr": ["교육은 나뭇가지, 잔가지, 그리고 잎이 모두 공통의 핵심에서 나오는 방식을 밝히면서, 지식의 나무 줄기에 초점을 맞춰야 한다.", "다양한 분야의 실무자들이 혁신 과정에 대한 그들의 경험을 공유하고 그들의 창의적 활동 사이의 연결 고리를 발견할 수 있는 공통 언어를 제공하면서, 사고를 위한 도구는 이 핵심에서 비롯된다.", "교육 과정 전반에 걸쳐 동일한 용어가 사용될 때, 학생들은 서로 다른 과목들과 수업들을 연결하기 시작한다.", "그 function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

}], "sum": "Denes와 자원봉사자들, 쓰레기를 치운 뒤 그 땅에 황금빛 곡물 심기"}, {"i": "05", "q": "04", "s": "5", "title": "S+V+O + because절 + 전치사+관계대명사", "eng": "He was trying to warn<sup>1</sup> hikers against taking the right trail<sup>2</sup> / because there is a bear in the area / through which it passes<sup>3</sup>.", "notes": [["1", "warn", "경고하다"], ["2", "trail", "길, 산길"], ["3", "pass through", "~을 지나가다"]], "lit": "그는 등산객들에게 오른쪽 길로 가지 말라고 경고하려 했다 / 그 지역에 곰이 있기 때문에 / 그 길이 지나가는(지역).", "nat": "그는 등산객들에게 오른쪽 길로 가지 말라고 경고하려 했는데, 그 길이 지나가는 지역에 곰이 있었기 때문이다.", "ana": "<b>because ~</b>는 이유를 나타내는 부사절이고, through which는 '전치사+관계대명사' 형태로 the area를 수식하는 <b>관계사절</b>이다.", "pe": "He was trying to warn<sup>1</sup> hikers \u0001against taking the right trail<sup>2</sup>\u0002 / \u0001because there is a bear in the area\u0002 / \u0001through which it passes<sup>3</sup>\u0002.", "pk": "그는 등산객들에게 \u0001오른쪽 길로 가지 말라고\u0002 경고하려 했다 / \u0001그 지역에 곰이 있기 때문에\u0002 / \u0001그 길이 지나가는(지역)\u0002.", "core": "그는 등산객들에게 경고하려 했다.", "tags": ["He was trying to warn hikers: 시도하다 + to부정사, warn A: 3형식 SVO. against ~ = 전치사구(부사구): warn 꾸밈, 거의 필수에 가까운 부사구(warn A against B) [기준: 모양 규칙]", "because절 = 이유 부사절: was trying to warn을 꾸밈. there is a bear = there 구문", "through which it passes = <b>전치사 + 관계대명사</b>절(형용사절): the area 꾸밈. 이 절도 because절 안"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식) + because절</b>이다. 맨 뒤의 <b>through which</b>가 낯설어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: He (그)", "V: was trying (try 애쓰다, 시도하다의 과거진행)", "O: to warn hikers (등산객들에게 경고하는 것, warn 경고하다)", "안쪽: warn + O: hikers (등산객들)", "뼈대 = <b>He was trying to warn hikers</b>", "기준: warn A against B의 against구는 거의 필수에 가까운 부사구이지만 수식어로 본다."]}, {"t": "<b>against taking the right trail</b>은 '오른쪽 길을 택하지 말라고'이다. against는 전치사라서 동명사 taking을 쓴다.", "sub": ["take (택하다, 가다)", "trail (산길)"]}, {"t": "<b>because there is a bear in the area</b>는 이유 부사절이다. there 구문이다.", "sub": ["there is (있다) / S: a bear (곰) / in the area (그 지역에)"]}, {"t": "<b>through which it passes</b>는 area를 꾸미는 <b>전치사 + 관계대명사</b> 관계절이다. it passes through the area에서 through the area가 앞으로 나온 모양이다.", "sub": ["it = the right trail (그 길)", "pass through ~ (~을 지나가다)"]}, {"t": "함정: through which 뒤는 완전한 문장(it passes)이다. 전치사가 which 앞으로 갔기 때문이다."}], "sum": "곰이 있는 지역을 지나는 오른쪽 길, 가지 말라고 등산객에게 경고하려 함"}, {"i": "06", "q": "05", "s": "4", "title": "If절 3개 병렬 + 주절", "eng": "If they practice abstracting<sup>1</sup> in writing class, / if they work on abstracting in painting or drawing class, / and if, in all cases, they call it abstracting, / they begin to understand how to think beyond disciplinary boundaries<sup>2</sup>.", "notes": [["1", "abstract", "추상화하다"], ["2", "disciplinary boundary", "학문의 경계"]], "lit": "만약 학생들이 글쓰기 수업에서 추상화를 연습하고, / 그림이나 회화 수업에서도 추상화를 연습하며, / 그리고 모든 경우에 그것을 '추상화하기'라고 부른다면, / 그들은 학문의 경계를 넘어 생각하는 법을 이해하기 시작한다.", "nat": "학생들이 글쓰기 수업에서도, 그림이나 회화 수업에서도 추상화를 연습하고 모든 경우에 그것을 '추상화하기'라고 부른다면, 그들은 학문의 경계를 넘어 생각하는 법을 이해하기 시작한다.", "ana": "<b>if절 세 개</b>가 and로 <b>병렬</b> 연결되어 하나의 조건을 이루는 구조이다.", "pe": "\u0001If they practice abstracting<sup>1</sup> in writing class\u0002, / \u0001if they work on abstracting in painting or drawing class\u0002, / \u0001and if, in all cases, they call it abstracting\u0002, / they begin to understand how to think \u0001beyond disciplinary boundaries<sup>2</sup>\u0002.", "pk": "\u0001만약 학생들이 글쓰기 수업에서 추상화를 연습하고\u0002, / \u0001그림이나 회화 수업에서도 추상화를 연습하며\u0002, / \u0001그리고 모든 경우에 그것을 '추상화하기'라고 부른다면\u0002, / 그들은 \u0001학문의 경계를 넘어\u0002 생각하는 법을 이해하기 시작한다.", "core": "그들은 생각하는 법을 이해하기 시작한다.", "tags": ["If절 ① = 조건 부사절: 주절 they begin ~을 꾸밈. <b>if절 3개 병렬</b>의 첫째", "If절 ② = 조건 부사절: 주절 꾸밈. 병렬 둘째", "and if절 ③ = 조건 부사절: 주절 꾸밈. 병렬 셋째. in all cases는 삽입", "they begin to understand: 3형식 SVO. how to think ~ = 의문사 + to부정사(목적어). beyond ~ = 전치사구(부사구): think 꾸밈, 거의 필수에 가까운 부사구(think beyond)"], "steps": [{"t": "이 문장은 <b>If절 세 개 병렬 + 주절 S+V+O(3형식)</b>이다. 조건절이 셋이라 주절이 맨 마지막에 나온다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: they (그들, 직독 해석에서는 학생들)", "V: begin (시작하다)", "O: to understand how to think (생각하는 법을 이해하는 것)", "뼈대 = <b>they begin to understand how to think</b>"]}, {"t": "첫째 조건절은 <b>If they practice abstracting in writing class</b>이다.", "sub": ["practice (연습하다)", "abstracting = abstract (추상화하다)의 동명사, 추상화하기", "writing class (글쓰기 수업)"]}, {"t": "둘째 <b>if they work on abstracting in painting or drawing class</b>와 셋째 <b>and if, in all cases, they call it abstracting</b>도 같은 조건절이다. and가 세 번째 if절 앞에서 세 조건절을 묶는다.", "sub": ["work on ~ (~에 공들이다), painting (회화), drawing (그림)", "in all cases (모든 경우에)는 삽입", "call it abstracting = call + O + C (그것을 abstracting이라 부르다)"]}, {"t": "<b>how to think beyond disciplinary boundaries</b>는 understand의 목적어('어떻게 생각할지')이다. 의문사 + to부정사 구조이다.", "sub": ["beyond ~ (~을 넘어서)", "disciplinary boundaries (학문의 경계, discipline 학문 분야, boundary 경계)"]}], "sum": "세 조건이 갖춰지면, 학문의 경계를 넘어 생각하는 법을 이해하기 시작"}, {"i": "07", "q": "06", "s": "2", "title": "Even though 양보절 + S+V+C + 관계대명사 what", "eng": "Even though the design, activities, and membership<sup>1</sup> of social media might change over time, / the content of what people posted / usually remains intact<sup>2</sup>.", "notes": [["1", "membership", "회원 구성"], ["2", "intact", "손상되지 않은, 그대로인"]], "lit": "소셜 미디어의 디자인, 활동, 회원 구성이 시간이 지나며 바뀌더라도, / 사람들이 게시한 내용은 / 대체로 그대로 남아 있다.", "nat": "소셜 미디어의 디자인, 활동, 회원 구성이 시간이 지나며 바뀌더라도, 사람들이 게시한 내용은 대체로 그대로 남아 있다.", "ana": "<b>Even though ~</b>는 양보를 나타내는 부사절이고, what people posted는 <b>선행사를 포함하는 관계대명사절</b>로 전치사 of의 목적어로 쓰였다.", "pe": "\u0001Even though the design, activities, and membership<sup>1</sup> of social media might change over time\u0002, / the content \u0001of what people posted\u0002 / \u0001usually\u0002 remains intact<sup>2</sup>.", "pk": "\u0001소셜 미디어의 디자인, 활동, 회원 구성이 시간이 지나며 바뀌더라도\u0002, / \u0001사람들이 게시한\u0002 내용은 / \u0001대체로\u0002 그대로 남아 있다.", "core": "내용은 그대로 남아 있다.", "tags": ["Even though절 = 양보 부사절: 주절 전체를 꾸밈 ('~하더라도')", "the content = 주어. of what ~ = 전치사구(형용사구): content 꾸밈. what people posted = 전치사 of의 목적어(<b>선행사 포함 what</b>)", "remains intact: 2형식 SVC (intact = 보어). usually = 부사: remains 꾸밈"], "steps": [{"t": "이 문장은 <b>Even though절 + S+V+C(2형식)</b>이다. 양보절의 주어에 명사가 셋 병렬되고, 주절 주어에 what절이 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The content (내용)", "V: remains (remain ~인 채로 남다)", "C: intact (손상되지 않은, 그대로인)", "뼈대 = <b>The content remains intact</b>", "remain 뒤에는 상태를 나타내는 보어가 필요한 2형식이다. usually (대체로)는 부사."]}, {"t": "<b>Even though the design, activities, and membership of social media might change over time</b>은 '~일지라도'라는 양보 부사절이다.", "sub": ["S: the design, activities, and membership (디자인, 활동, 회원 구성 — 명사 세 개 병렬, activities = activity 활동의 복수형)", "of social media (소셜 미디어의)", "V: might change (바뀔지도 모른다) / over time (시간이 지나며)"]}, {"t": "<b>of what people posted</b>는 content를 꾸미는 전치사구이다. what은 '~하는 것'이라는 뜻으로 of의 목적어(명사절)가 된다.", "sub": ["post (게시하다)의 과거형 posted, what people posted = 사람들이 게시한 것"]}], "sum": "소셜 미디어가 변해도, 사람들이 게시한 내용은 대체로 그대로"}, {"i": "08", "q": "06", "s": "5", "title": "Whenever절 + S+V(1형식) + 목적의 to부정사", "eng": "Whenever you want, / you can go back / to reexamine<sup>1</sup> those events from the past.", "notes": [["1", "reexamine", "다시 살펴보다"]], "lit": "당신이 원할 때마다, / 당신은 되돌아갈 수 있다 / 과거의 그 사건들을 다시 살펴보기 위해.", "nat": "원할 때면 언제든, 당신은 과거의 그 사건들로 되돌아가 다시 살펴볼 수 있다.", "ana": "<b>Whenever ~</b>는 '~할 때마다'라는 뜻의 복합관계부사절이고, to reexamine ~는 '~하기 위해'라는 <b>목적을 나타내는 to부정사</b>이다.", "pe": "\u0001Whenever you want\u0002, / you can go back / \u0001to reexamine<sup>1</sup> those events from the past\u0002.", "pk": "\u0001당신이 원할 때마다\u0002, / 당신은 되돌아갈 수 있다 / \u0001과거의 그 사건들을 다시 살펴보기 위해\u0002.", "core": "당신은 되돌아갈 수 있다.", "tags": ["Whenever절 = 부사절(<b>복합관계부사</b>, '~할 때마다'): 주절을 꾸밈", "you can go back: 1형식 SV (back은 go back 한 묶음)", "to reexamine ~ = to부정사(부사적: 목적): go back을 꾸밈. from the past = 전치사구(형용사구): events 꾸밈"], "steps": [{"t": "이 문장은 <b>Whenever절 + S+V(1형식) + to부정사</b>이다. 짧고 구조가 단순하다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: you (당신)", "V: can go back (go back 되돌아가다, can ~할 수 있다)", "뼈대 = <b>you can go back</b>", "back (뒤로)은 go back의 한 묶음"]}, {"t": "<b>Whenever you want</b>는 '원할 때마다'라는 부사절이다. whenever는 '~할 때마다, 언제든'이라는 복합관계부사이다. want 뒤의 to go back은 반복이라 생략되었다.", "sub": ["want (원하다)"]}, {"t": "<b>to reexamine those events from the past</b>는 '다시 살펴보기 위해'라는 <b>to부정사(목적)</b>로 go back을 꾸민다.", "sub": ["reexamine (다시 살펴보다)", "those events (그 사건들), from the past (과거의, events를 꾸밈)"]}], "sum": "원할 때마다, 과거의 사건으로 돌아가 다시 살펴볼 수 있음"}], "qs": [{"q": "01", "type": "주장", "src": "2016년 6월 20번", "ans": "②", "tr": [["1", "미루는 버릇에 빠져 있을 때, 어떻게 하면 꼼짝 못 하는 상태에서 벗어나 하루 중 가장 어려운 일을 해낼 수 있을까?"], ["2", "나는 \"개구리를 먹어라!\"라고 말한다."], ["3", "이 생각은 Mark Twain의 말에서 비롯된다: \"아침에 가장 먼저 살아 있는 개구리를 먹어라, 그러면 그날 남은 시간 동안 그보다 더 나쁜 일은 일어나지 않을 것이다.\""], ["4", "매일 아침, 할 일 목록에서 당신이 가장 두려워하는 항목을 처리하는 데 전념하고, 그것을 다른 무엇보다 먼저 하라."], ["5", "아침은 방해 요소가 적고 하루 업무 중에 쌓이는 스트레스에서 자유롭기 때문에, 글쓰기처럼 창의적인 일에서 생산적이어야 할 때 특히 이상적이다."], ["6", "하기 싫은 일에 먼저 뛰어들면서, 그 장애물을 극복하고도 여전히 하루 전체가 앞에 남아 있다는 것이 얼마나 기분 좋을지 상상해 보라."]], "evh": "4번 문장", "ev": [{"en": true, "h": "Every morning, commit to dealing with the item on your to-do list that you're dreading the most, and do it before anything else."}, {"en": false, "h": "가장 하기 싫은 일을 하루 중 가장 먼저 처리하라는 4번 문장을 종합하면, 필자의 주장은 '어렵고 싫은 일을 하루 중 가장 먼저 해야 한다'는 것이다."}], "opts": [{"n": "①", "t": "하기 싫은 일에 시간을 낭비하지 말아야 한다.", "a": false, "x": true, "trap": true, "e": "하기 싫은 일을 피하라는 것이 아니라 먼저 처리하라는 내용이다."}, {"n": "②", "t": "어렵고 싫은 일을 하루 중 가장 먼저 해야 한다.", "a": true, "x": false, "trap": false, "e": "가장 하기 싫은 일을 다른 무엇보다 먼저 처리하라는 4번 문장의 내용과 정확히 일치한다."}, {"n": "③", "t": "업무가 주는 과도한 스트레스에서 벗어나야 한다.", "a": false, "x": true, "trap": false, "e": "스트레스는 아침에 일하면 좋은 이유로 언급될 뿐, 중심 주장은 아니다."}, {"n": "④", "t": "힘든 일을 해결하려면 여러 명이 협동해야 한다.", "a": false, "x": true, "trap": false, "e": "협동에 관한 언급은 본문에 없다."}, {"n": "⑤", "t": "해야 할 일의 목록을 저녁에 작성해야 한다.", "a": false, "x": true, "trap": false, "e": "목록을 저녁에 작성하라는 내용은 본문에 없다."}], "w": [["procrastination", "미루는 버릇"], ["commit to", "전념하다"], ["dread", "두려워하다"], ["ideal", "이상적인"], ["distraction", "방해 요소"], ["accumulate", "쌓이다"], ["undesirable", "하기 싫은"], ["hurdle", "장애물"]]}, {"q": "02", "type": "심경 변화", "src": "2020년 3월 19번", "ans": "①", "tr": [["1", "Alice는 연설을 시작한 이후 처음으로 원고에서 고개를 들었다."], ["2", "그녀는 자리를 놓칠까 두려워, 연설을 끝낼 때까지 페이지 위의 글자에서 감히 시선을 떼지 못했었다."], ["3", "사실 그녀가 바란 것은 연설 중에 읽는 능력을 잃지 않는 것과 웃음거리가 되지 않고 끝까지 해내는 것, 이 두 가지뿐이었다."], ["4", "이제 강연장 전체가 일어서서 박수를 치고 있었다."], ["5", "그것은 그녀가 바랐던 것 이상이었다."], ["6", "환하게 웃으며, 그녀는 앞줄의 낯익은 얼굴들을 바라보았다."], ["7", "Tom은 박수를 치고 환호하며, 달려가서 그녀를 안고 축하해 주고 싶은 마음을 거의 참지 못하는 것처럼 보였다."], ["8", "그녀도 그를 어서 안아 주고 싶었다."]], "evh": "2·4·7번 문장", "ev": [{"en": true, "h": "She hadn't dared to break eye contact ~ for fear of losing her place. / the entire ballroom was standing, clapping. / Tom clapped and cheered"}, {"en": false, "h": "연설 중 자리를 놓칠까 두려워하던 긴장한 모습(2번)이, 연설이 끝난 뒤 사람들의 박수와 환호를 받으며 기쁨으로 바뀌는 모습(4·7번)으로 이어지므로 심경 변화는 'nervous → delighted'이다."}], "opts": [{"n": "①", "t": "nervous → delighted", "a": true, "x": false, "trap": false, "e": "자리를 놓칠까 두려워하던 긴장한 상태(2번)가 박수와 환호 속에 기쁨으로 바뀌는 모습(4·7번)과 정확히 일치한다."}, {"n": "②", "t": "embarrassed → scared", "a": false, "x": true, "trap": false, "e": "처음에는 창피함이 아니라 긴장·불안이었고, 끝에는 두려움이 아니라 기쁨을 느꼈다."}, {"n": "③", "t": "amazed → annoyed", "a": false, "x": true, "trap": false, "e": "처음에 놀란 것이 아니라 긴장한 상태였다."}, {"n": "④", "t": "hopeful → disappointed", "a": false, "x": true, "trap": true, "e": "끝에는 실망이 아니라 기대 이상의 기쁨을 느꼈다."}, {"n": "⑤", "t": "angry → grateful", "a": false, "x": true, "trap": false, "e": "화가 난 상태로 시작한 것이 아니다."}], "w": [["dare to", "감히 ~하다"], ["break eye contact", "시선을 떼다"], ["for fear of", "~할까 두려워"], ["make a fool of oneself", "웃음거리가 되다"], ["ballroom", "강연장, 연회장"], ["congratulate", "축하하다"]]}, {"q": "03", "type": "제목", "src": "2021년 9월 24번", "ans": "①", "tr": [["1", "화려한 고층 건물, 금융 본사, 관광 센터, 기념품 행상인들이 Battery Park City에 들어서기 전에, 세계무역센터 뒤편 지역은 거대하고 험악한 쓰레기 매립지였다."], ["2", "1982년, 예술가 Agnes Denes는 비록 일시적이긴 하지만 그 매립지를 원래의 뿌리로 되돌리기로 결심했다."], ["3", "Denes는 Public Art Fund로부터 맨해튼이 지금까지 본 가장 의미심장하고 환상적인 공공미   WS.words.forEach((w,i)=>{

    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    if(c[p]){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent='오답노트장에 담았어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1400);}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
