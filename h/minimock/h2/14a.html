var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>명령문</b>에 있어요. “개구리를 먹어라!”(Eat the frogs)는 비유일 뿐이고, 그 뜻을 풀어 준 5번 명령문 <b>do it before anything else</b>(그것을 다른 어떤 것보다 먼저 하라)를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 비유로 던진 주장</span><div class=\"en\">I say, “<mark>Eat the frogs!</mark>”</div><p class=\"ko\">나는 “<mark>개구리를 먹어라!</mark>”라고 말한다.</p></div><div class=\"ck-via\"><i>▼</i><span>개구리가 무슨 뜻인지 Mark Twain(마크 트웨인)의 말로 힌트를 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 비유의 출처</span><div class=\"en\">“Eat a live frog <mark>first thing in the morning</mark>, and nothing worse will happen to you the rest of the day.”</div><p class=\"ko\">“<mark>아침에 가장 먼저</mark> 살아 있는 개구리를 먹어라, 그러면 그날 남은 시간 동안 어떤 더 나쁜 일도 당신에게 일어나지 않을 것이다.”</p></div><div class=\"ck-via\"><i>▼</i><span>비유를 풀어서 명령문으로 못 박아요: 개구리 = 가장 두려운 일</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">Every morning, commit to dealing with the item on your to-do list that <mark>you’re dreading the most</mark>, and <mark>do it before anything else</mark>.</div><p class=\"ko\">매일 아침, … <mark>당신이 가장 두려워하는</mark> 그 항목을 처리하는 데 전념하라, <mark>그리고 그것을 다른 어떤 것보다 먼저 하라.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>또 명령문(imagine 상상해 보라)으로 ‘먼저 해치우면 좋다’를 다시 밀어요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 명령문으로 한 번 더</span><div class=\"en\">While diving into <mark>undesirable tasks first thing</mark>, imagine how good it will feel …</div><p class=\"ko\"><mark>원하지 않는 일에 먼저 뛰어들면서</mark>, 얼마나 기분 좋을지를 상상해 보라</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">어렵고 싫은 일을 하루 중 가장 먼저 해야 한다.<small>dreading the most(가장 두려워하는)·before anything else(다른 어떤 것보다 먼저)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">하기 싫은 일에 시간을 낭비하지 말아야 한다.</span><span class=\"why\">[반대] 5번은 하기 싫은 일을 피하라는 게 아니라 오히려 그 일부터 처리하라(commit to dealing with 처리하는 데 전념하라)고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">업무가 주는 과도한 스트레스에서 벗어나야 한다.</span><span class=\"why\">[지문에 없음] 6번에 stresses(스트레스)가 나오지만, 아침이 좋은 이유를 설명하는 근거일 뿐 필자가 시키는 말이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">힘든 일을 해결하려면 여러 명이 협동해야 한다.</span><span class=\"why\">[지문에 없음] 여러 명이 함께하라는 말은 한 번도 없어요. 지문은 ‘당신(you)’ 혼자 아침에 먼저 하라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">해야 할 일의 목록을 저녁에 작성해야 한다.</span><span class=\"why\">[지문에 없음] 5번에 to-do list(할 일 목록)는 나오지만 저녁에 쓰라는 말은 없어요. 시간 단서는 오직 Every morning(매일 아침)이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Engaged in procrastination,</div><div class=\"k\">미루느라 바쁠 때(미루게 될 때),</div></div><div class=\"rc\"><div class=\"e\">how do you move</div><div class=\"k\">당신은 어떻게 나아갈 수 있을까</div></div><div class=\"rc\"><div class=\"e\">from being stuck</div><div class=\"k\">꼼짝 못 하는 상태에서</div></div><div class=\"rc\"><div class=\"e\">to doing the day’s most difficult tasks?</div><div class=\"k\">하루의 가장 어려운 일들을 처리하는 것으로?</div></div><div class=\"rnat\">(무언가를) 미루느라 바쁠 때(미루게 될 때), 당신은 어떻게 꼼짝 못 하는 것에서(미루는 상태에서) 하루의 가장 어려운 일들을 처리하는 것으로 나아갈 수(변화할 수) 있을까?</div><div class=\"rst\">수학 숙제가 제일 싫어서 자꾸 미루다 보면 결국 손도 못 대요. 지문도 미루느라 꼼짝 못 할 때 어떻게 해야 하냐고 물어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">I say,</div><div class=\"k\">나는 말한다,</div></div><div class=\"rc ckc\"><div class=\"e\">“<span class=\"cw\">Eat the frogs!</span>”</div><div class=\"k\">“<span class=\"cw\">개구리를 먹어라!</span>”라고.</div></div><div class=\"rnat\">나는 \"개구리를 먹어라!\"라고 말한다.</div><div class=\"rst\">필자의 답은 딱 하나, <b>“개구리를 먹어라!”</b>(Eat the frogs!)예요. 여기서 개구리 = 제일 싫은 숙제예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The idea comes from</div><div class=\"k\">이 생각은 비롯된다</div></div><div class=\"rc\"><div class=\"e\">a Mark Twain quote:</div><div class=\"k\">Mark Twain의 말에서</div></div><div class=\"rnat\">이 생각은 Mark Twain(마크 트웨인)의 말에서 비롯된다.</div><div class=\"rst\">이 말은 원래 유명한 작가 Mark Twain(마크 트웨인)이 한 말이래요. 지문은 그 말에서 생각을 빌려 왔다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">“Eat a live frog</div><div class=\"k\">“살아 있는 개구리를 먹어라,</div></div><div class=\"rc\"><div class=\"e\">first thing in the morning,</div><div class=\"k\">아침에 가장 먼저,</div></div><div class=\"rc\"><div class=\"e\">and nothing worse will happen to you</div><div class=\"k\">그러면 어떤 더 나쁜 일도 당신에게 일어나지 않을 것이다</div></div><div class=\"rc\"><div class=\"e\">the rest of the day.”</div><div class=\"k\">그날 남은 시간 동안.”</div></div><div class=\"rnat\">\"아침에 가장 먼저 살아 있는 개구리를 먹어라, 그러면 그날 남은 시간 동안 어떤 더 나쁜 일도 당신에게 일어나지 않을 것이다.\"</div><div class=\"rst\">아침에 살아 있는 개구리부터 먹으면 그날 그보다 나쁜 일은 없대요. = 제일 싫은 숙제를 <b>아침에 먼저</b> 끝내면 하루가 편하다는 뜻이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Every morning,</div><div class=\"k\">매일 아침,</div></div><div class=\"rc\"><div class=\"e\">commit to dealing with the item</div><div class=\"k\">그 항목을 처리하는 데 전념하라</div></div><div class=\"rc\"><div class=\"e\">on your to-do list</div><div class=\"k\">당신의 할 일 목록에서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that you’re dreading the most,</span></div><div class=\"k\"><span class=\"cw\">당신이 가장 두려워하는,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and do it before anything else.</span></div><div class=\"k\"><span class=\"cw\">그리고 그것을 다른 어떤 것보다 먼저 하라.</span></div></div><div class=\"rnat\">매일 아침, 당신이 가장 두려워하는 할 일 목록의 항목을 처리하는 데 전념하고, 그것을 다른 어떤 것보다 먼저 하라.</div><div class=\"rst\"><b>그러니 매일 아침, 가장 싫은 수학 숙제부터 하세요.</b> 지문도 가장 두려운 일을 다른 무엇보다 먼저 하라고 말해요. 이게 주장이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Mornings are especially ideal</div><div class=\"k\">아침 (시간)은 특히 이상적이다</div></div><div class=\"rc\"><div class=\"e\">for when you need to be productive</div><div class=\"k\">당신이 생산적이어야 할 때</div></div><div class=\"rc\"><div class=\"e\">on creative tasks, such as writing,</div><div class=\"k\">글쓰기와 같은 창의적인 일에 있어,</div></div><div class=\"rc\"><div class=\"e\">because you have fewer distractions</div><div class=\"k\">왜냐하면 당신을 산만하게 하는 것이 더 적고</div></div><div class=\"rc\"><div class=\"e\">and your mind is free of the stresses</div><div class=\"k\">당신의 머리는 스트레스에서 자유롭기 때문이다</div></div><div class=\"rc\"><div class=\"e\">that accumulate over the course of a workday.</div><div class=\"k\">근무 시간 동안 쌓이는.</div></div><div class=\"rnat\">아침 (시간)은 당신이 글쓰기와 같은 창의적인 일에 있어 생산적이어야 할 때 특히 이상적인데, 왜냐하면 (아침 시간에는) 당신을 산만하게 하는 것이 더 적고 당신의 머리는 근무 시간 동안 쌓이는 스트레스에서 자유롭기 때문이다.</div><div class=\"rst\">아침엔 핸드폰 알림도 적고 머리도 맑아서 집중이 잘돼요. 지문도 아침은 방해가 적고 스트레스가 없어 좋다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">While diving into undesirable tasks first thing,</div><div class=\"k\">원하지 않는 일에 먼저 뛰어들면서,</div></div><div class=\"rc\"><div class=\"e\">imagine how good it will feel</div><div class=\"k\">얼마나 기분 좋을지를 상상해 보라</div></div><div class=\"rc\"><div class=\"e\">to have gotten over that hurdle</div><div class=\"k\">그 장애물을 극복하고도</div></div><div class=\"rc\"><div class=\"e\">and still have a whole day ahead of you.</div><div class=\"k\">아직 온전한 하루가 당신 앞에 남아 있어.</div></div><div class=\"rnat\">원하지 않는 일에 먼저 뛰어들면서, 그 장애물을 극복하고도 아직 온전한 하루가 당신 앞에 남아 있어 얼마나 기분 좋을지를 상상해 보라.</div><div class=\"rst\">싫은 숙제를 먼저 해치우고도 하루가 통째로 남아 있으면 얼마나 신날까요? 지문도 그 기분을 상상해 보라며 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"procrastination\" data-m=\"미루는 버릇, 미루기\"><b>procrastination</b>미루는 버릇, 미루기</button><button type=\"button\" class=\"wdb\" data-w=\"commit to\" data-m=\"~에 전념하다\"><b>commit to</b>~에 전념하다</button><button type=\"button\" class=\"wdb\" data-w=\"dread\" data-m=\"두려워하다\"><b>dread</b>두려워하다</button><button type=\"button\" class=\"wdb\" data-w=\"distraction\" data-m=\"방해 요소, 산만하게 하는 것\"><b>distraction</b>방해 요소, 산만하게 하는 것</button><button type=\"button\" class=\"wdb\" data-w=\"undesirable\" data-m=\"원하지 않는, 하기 싫은\"><b>undesirable</b>원하지 않는, 하기 싫은</button><button type=\"button\" class=\"wdb\" data-w=\"hurdle\" data-m=\"장애물\"><b>hurdle</b>장애물</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">심경 변화는 <b>맨 앞 감정</b>과 <b>맨 뒤 감정</b>만 잡으면 돼요. <b>Now</b>(이제)에서 연설이 끝나고 박수가 터지며 감정이 바뀌어요.</p><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 처음 감정</span><div class=\"en\">She hadn’t dared to break eye contact … <mark>for fear of losing her place</mark>.</div><p class=\"ko\">그녀는 시선을 떼는 것을 감히 하지 못했었다 … <mark>읽을 대목을 놓칠까 두려워서.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>바란 건 ‘웃음거리만 안 되기’뿐이었을 만큼 떨렸어요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 처음 감정 굳히기</span><div class=\"en\">she’d just hoped for two simple things … <mark>without making a fool of herself</mark>.</div><p class=\"ko\">그녀는 단지 두 가지 간단한 것만을 바랐을 뿐이었다 … <mark>자신을 웃음거리로 만들지 않고.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>Now(이제) 연설이 끝나고 상황이 확 바뀌어요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 전환 지점</span><div class=\"en\">Now the entire ballroom <mark>was standing, clapping</mark>.</div><p class=\"ko\">이제 강연장 전체가 <mark>일어서서 박수를 치고 있었다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>기대 이상의 반응에 나온 감정 표현</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 나중 감정</span><div class=\"en\"><mark>Smiling brightly</mark>, she looked at the familiar faces in the front row.</div><p class=\"ko\"><mark>밝게 웃으며,</mark> 그녀는 맨 앞줄에 있는 친숙한 얼굴들을 바라보았다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">nervous → delighted 긴장한 → 아주 기쁜<small>놓칠까 두려움(긴장) → 밝게 웃음(기쁨), 양 끝이 딱 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">hopeful → disappointed 희망에 찬 → 실망한</span><span class=\"why\">3번 hoped for(바랐다) 때문에 앞 감정이 그럴듯해 보여요. 하지만 뒤가 틀려요. 5번은 바란 것 이상이었다고 하고 6번은 밝게 웃어서 실망이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">embarrassed → scared 당황한 → 겁먹은</span><span class=\"why\">뒤 감정이 틀려요. 끝에서 Alice(앨리스)는 겁먹은 게 아니라 6번에서 밝게 웃고, 8번에서 Tom(톰)을 빨리 안고 싶어 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">amazed → annoyed 놀란 → 짜증 난</span><span class=\"why\">앞·뒤 둘 다 틀려요. 2번은 놀람이 아니라 놓칠까 두려운 긴장이고, 끝은 짜증이 아니라 기쁨이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">angry → grateful 화난 → 고마워하는</span><span class=\"why\">앞 감정이 틀려요. 2·3번 어디에도 화난 단서가 없고, 두려움과 떨림뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Alice looked up from her speech</div><div class=\"k\">Alice는 그녀의 연설문에서 고개를 들었다</div></div><div class=\"rc\"><div class=\"e\">for the first time</div><div class=\"k\">처음으로</div></div><div class=\"rc\"><div class=\"e\">since she began talking.</div><div class=\"k\">그녀가 말하기 시작한 이후.</div></div><div class=\"rnat\">Alice는 그녀가 연설을 시작한 이후 처음으로 자신의 연설문으로부터 고개를 들었다.</div><div class=\"rst\">학예회 날 발표문을 읽던 내가 처음으로 고개를 들어요. 지문의 Alice(앨리스)도 연설을 시작한 뒤 처음으로 고개를 들어요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">She hadn’t dared to break eye contact</div><div class=\"k\">그녀는 시선을 떼는 것을 감히 하지 못했었다</div></div><div class=\"rc\"><div class=\"e\">with the words on the pages</div><div class=\"k\">페이지에 있는 단어들에서</div></div><div class=\"rc\"><div class=\"e\">until she finished,</div><div class=\"k\">그녀가 끝낼 때까지,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">for fear of losing her place.</span></div><div class=\"k\"><span class=\"cw\">읽을 대목을 놓칠까 두려워서.</span></div></div><div class=\"rnat\">그녀는 읽을 대목을 놓칠까 두려워서 끝날 때까지 페이지에 있는 단어들에서 감히 시선을 뗄 수가 없었다.</div><div class=\"rst\">그전까지는 읽던 줄을 놓칠까 <b>무서워서</b> 종이에서 눈을 못 뗐어요. = 지문의 처음 감정, 긴장했어요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Actually,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">she’d just hoped for two simple things —</div><div class=\"k\">그녀는 단지 두 가지 간단한 것만을 바랐을 뿐이었다 —</div></div><div class=\"rc\"><div class=\"e\">not to lose the ability to read during the talk</div><div class=\"k\">연설 중에 읽는 능력을 잃어버리지 않는 것과</div></div><div class=\"rc\"><div class=\"e\">and to get through it</div><div class=\"k\">그것(연설)을 끝내는 것,</div></div><div class=\"rc\"><div class=\"e\">without making a fool of herself.</div><div class=\"k\">자신을 웃음거리로 만들지 않고.</div></div><div class=\"rnat\">사실, 그녀는 연설 중에 읽는 능력을 잃어버리지 않는 것과 자신을 웃음거리로 만들지 않고 그것(연설)을 끝내는 것, 단 두 가지만을 바랐을 뿐이었다.</div><div class=\"rst\">바란 건 딱 둘, 끝까지 읽기와 <b>웃음거리 안 되기</b>뿐이었어요. 지문도 그만큼 떨렸다는 걸 보여 줘요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Now the entire ballroom</div><div class=\"k\">이제 강연장 전체가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">was standing, clapping.</span></div><div class=\"k\"><span class=\"cw\">일어서서 박수를 치고 있었다.</span></div></div><div class=\"rnat\">이제 강연장에 있는 모두가 박수를 치며 일어서 있었다.</div><div class=\"rst\"><b>이제</b>(Now) 강당 전체가 일어나서 박수를 쳐요! 지문은 여기서 상황이 확 바뀌어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It was more than</div><div class=\"k\">그것은 ~ 이상이었다</div></div><div class=\"rc\"><div class=\"e\">she had hoped for.</div><div class=\"k\">그녀가 바랐던 것(보다).</div></div><div class=\"rnat\">그것은 그녀가 바랐던 것 이상이었다.</div><div class=\"rst\">생각했던 것보다 훨씬 좋은 반응이에요. 지문도 바랐던 것 이상이었다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Smiling brightly,</span></div><div class=\"k\"><span class=\"cw\">밝게 웃으며,</span></div></div><div class=\"rc\"><div class=\"e\">she looked at the familiar faces</div><div class=\"k\">그녀는 친숙한 얼굴들을 바라보았다</div></div><div class=\"rc\"><div class=\"e\">in the front row.</div><div class=\"k\">맨 앞줄에 있는.</div></div><div class=\"rnat\">밝게 웃으며, 그녀는 맨 앞줄에 있는 친숙한 얼굴들을 바라보았다.</div><div class=\"rst\">그래서 <b>활짝 웃으며</b>(Smiling brightly) 맨 앞줄의 낯익은 얼굴들을 바라봐요. = 지문의 나중 감정, 아주 기뻐요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Tom clapped and cheered</div><div class=\"k\">Tom은 박수를 치고 환호했고,</div></div><div class=\"rc\"><div class=\"e\">and looked like he could barely keep himself</div><div class=\"k\">(그가) 간신히 참는 것처럼 보였다</div></div><div class=\"rc\"><div class=\"e\">from running up to hug and congratulate her.</div><div class=\"k\">달려가서 그녀를 껴안고 축하해 주는 것을.</div></div><div class=\"rnat\">Tom은 박수를 치고 환호했고, (그가) 달려가서 그녀를 껴안고 축하해 주는 것을 간신히 참는 것처럼 보였다.</div><div class=\"rst\">맨 앞줄의 한 사람은 박수 치고 환호하며 당장 뛰어와 안아 줄 것 같아요. 지문의 Tom(톰)도 달려가 축하하고 싶어 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">She couldn’t wait</div><div class=\"k\">그녀도 기다릴 수 없었다</div></div><div class=\"rc\"><div class=\"e\">to hug him, too.</div><div class=\"k\">그를 껴안는 것을, 마찬가지로.</div></div><div class=\"rnat\">그녀도 마찬가지로 그를 너무 껴안고 싶었다.</div><div class=\"rst\">나도 얼른 달려가 안기고 싶어요. 지문도 Alice(앨리스)가 그를 안고 싶어 못 기다렸다며 기쁨으로 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"dare to\" data-m=\"감히 ~하다\"><b>dare to</b>감히 ~하다</button><button type=\"button\" class=\"wdb\" data-w=\"break eye contact\" data-m=\"시선을 떼다\"><b>break eye contact</b>시선을 떼다</button><button type=\"button\" class=\"wdb\" data-w=\"for fear of\" data-m=\"~할까 두려워서\"><b>for fear of</b>~할까 두려워서</button><button type=\"button\" class=\"wdb\" data-w=\"make a fool of oneself\" data-m=\"웃음거리가 되다\"><b>make a fool of oneself</b>웃음거리가 되다</button><button type=\"button\" class=\"wdb\" data-w=\"ballroom\" data-m=\"연회장, 강연장\"><b>ballroom</b>연회장, 강연장</button><button type=\"button\" class=\"wdb\" data-w=\"congratulate\" data-m=\"축하하다\"><b>congratulate</b>축하하다</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>대조 신호</b>(not A but B: A가 아니라 B)가 있는 문장과 <b>처음→나중의 변화</b>를 묶어서 찾으세요. 1번 <b>landfill</b>(쓰레기 매립지)이 4번 <b>a living installation</b>(살아 있는 설치 미술품)으로 바뀌어요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 출발점</span><div class=\"en\">the area behind the World Trade Center was <mark>a giant, gross landfill</mark>.</div><p class=\"ko\">세계 무역 센터 뒤편의 지역은 <mark>거대하고 혐오스러운 쓰레기 매립지였다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그 매립지를 예술가가 되살리기로 해요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 화제 등장</span><div class=\"en\">artist Agnes Denes decided to <mark>return that landfill back to its roots</mark>, although temporarily.</div><p class=\"ko\">예술가 Agnes Denes는 비록 일시적이긴 하지만 <mark>그 쓰레기 매립지를 다시 그것의(원래의) 뿌리로 되돌리기로</mark> 결정했다.</p></div><div class=\"ck-via\"><i>▼</i><span>not A but B(A가 아니라 B)로 이 작품의 정체를 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">Her concept was not a traditional sculpture, but <mark>a living installation</mark> that changed the way the public looked at art.</div><p class=\"ko\">그녀의 콘셉트는 전통적인 조형물이 아니라 <mark>살아 있는 설치 미술품이었다</mark></p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>4에이커에서 쓰레기 치우고 곡물 심기</span><span><em>7번</em>몇 달 농사 끝에 밀밭이 무성해짐</span><span><em>8번</em>밀 수확해서 푸드 뱅크에 기부</span></div><div class=\"ck-eq\">⇒ 매립지 → 살아서 자라는 밀밭 = 쓰레기 매립지에서 자라난 살아 있는 공공 미술</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">Living Public Art Grows from a Landfill 쓰레기 매립지에서 자라난 살아 있는 공공 미술<small>4번 living(살아 있는)·3번 public(공공의)·1번 landfill(쓰레기 매립지)을 모두 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">How City Expansion Could Affect Food Production 도시 확장이 식량 생산에 어떤 영향을 줄 수 있는가</span><span class=\"why\">[지문에 없음] 8번 wheat(밀)·food banks(푸드 뱅크)만 따온 함정이에요. 도시가 커져서 식량이 줄어든다는 얘기는 없고, 글의 중심은 예술 작품이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Why Does Art Fade Away in Urban Areas(왜 도시에서 예술이 사라지는가)?</span><span class=\"why\">[반대] 예술이 사라지는 게 아니라, 4번처럼 대중이 예술을 보는 방식을 바꾼 작품이 새로 생겨났어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">New York(뉴욕): Skyscraper Capital of the World(세계 고층 건물의 수도)</span><span class=\"why\">[범위 좁음] 1번 high-rises(고층 건물)는 배경 설명일 뿐이에요. 글은 건물이 아니라 그 옆 밀밭 작품 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Art Narrows the Gap Between the Old and Young 예술이 노인과 젊은이 사이의 격차를 좁힌다</span><span class=\"why\">[지문에 없음] 세대 차이에 대한 말은 한 문장도 없어요. 지문에 나오는 사람은 예술가와 자원봉사자, 뉴욕 사람들뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Before the fancy high-rises, financial headquarters, tourist centers, and souvenir peddlers</div><div class=\"k\">화려한 고층 건물, 금융 본사, 관광 센터, 기념품 행상인들이</div></div><div class=\"rc\"><div class=\"e\">made their way to Battery Park City,</div><div class=\"k\">Battery Park City로 나아가기 전에,</div></div><div class=\"rc\"><div class=\"e\">the area behind the World Trade Center</div><div class=\"k\">세계 무역 센터 뒤편의 지역은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">was a giant, gross landfill.</span></div><div class=\"k\"><span class=\"cw\">거대하고 혐오스러운 쓰레기 매립지였다.</span></div></div><div class=\"rnat\">화려한 고층 건물, 금융 본사, 관광 센터, 기념품 행상인들이 Battery Park City로 나아가기 전에, 세계 무역 센터 뒤편의 지역은 거대하고 혐오스러운 쓰레기 매립지였다.</div><div class=\"rst\">우리 학교 뒤에 쓰레기가 산처럼 쌓인 공터가 있다고 해 봐요. 지문의 Battery Park City(배터리 파크 시티) 지역도 원래 <b>거대한 쓰레기 매립지</b>(landfill)였어요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">In 1982,</div><div class=\"k\">1982년에</div></div><div class=\"rc\"><div class=\"e\">artist Agnes Denes decided</div><div class=\"k\">예술가 Agnes Denes는 결정했다</div></div><div class=\"rc\"><div class=\"e\">to return that landfill back to its roots,</div><div class=\"k\">그 쓰레기 매립지를 다시 그것의(원래의) 뿌리로 되돌리기로,</div></div><div class=\"rc\"><div class=\"e\">although temporarily.</div><div class=\"k\">비록 일시적이긴 하지만.</div></div><div class=\"rnat\">1982년에 예술가 Agnes Denes는 비록 일시적이긴 하지만 그 쓰레기 매립지를 다시 그것의(원래의) 뿌리로 되돌리기로 결정했다.</div><div class=\"rst\">미술 선생님이 그 공터를 원래 흙땅으로 되살리겠다고 나서요. = 지문의 Agnes Denes(아그네스 데네스)가 매립지를 뿌리로 되돌리기로 한 거예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Denes was commissioned by the Public Art Fund</div><div class=\"k\">Denes는 Public Art Fund로부터 의뢰를 받았다</div></div><div class=\"rc ckc\"><div class=\"e\">to create one of the most significant and fantastical <span class=\"cw\">pieces of public work</span></div><div class=\"k\">가장 의미심장하고 환상적인 <span class=\"cw\">공공 사업 작품</span> 중 하나를 만들어 달라는</div></div><div class=\"rc\"><div class=\"e\">Manhattan has ever seen.</div><div class=\"k\">맨해튼이 지금까지 본.</div></div><div class=\"rnat\">Denes는 Public Art Fund로부터 맨해튼에서 지금까지 본 가장 의미심장하고 환상적인 공공 사업 작품 중 하나를 만들어 달라는 의뢰를 받았다.</div><div class=\"rst\">시에서 “모두가 볼 멋진 작품을 만들어 주세요” 하고 부탁해요. 지문도 Public Art Fund(공공 미술 기금)가 작품을 의뢰했다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Her concept was not a traditional sculpture,</div><div class=\"k\">그녀의 콘셉트는 전통적인 조형물이 아니라</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but a living installation</span></div><div class=\"k\"><span class=\"cw\">살아 있는 설치 미술품이었다</span></div></div><div class=\"rc\"><div class=\"e\">that changed the way</div><div class=\"k\">방식을 바꾼</div></div><div class=\"rc\"><div class=\"e\">the public looked at art.</div><div class=\"k\">대중이 예술을 보는.</div></div><div class=\"rnat\">그녀의 콘셉트는 전통적인 조형물이 아니라 대중이 예술을 보는 방식을 바꾼, 살아 있는 설치 미술품이었다.</div><div class=\"rst\">그런데 만든 건 동상이 아니라 <b>살아서 자라는 작품</b>(a living installation)이에요. 지문은 이게 예술을 보는 눈을 바꿨다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In the name of art,</div><div class=\"k\">예술의 이름으로,</div></div><div class=\"rc\"><div class=\"e\">Denes put a beautiful golden wheat field</div><div class=\"k\">Denes는 아름다운 황금 밀밭을 만들었다</div></div><div class=\"rc\"><div class=\"e\">right in the shadow</div><div class=\"k\">바로 그림자 속에,</div></div><div class=\"rc\"><div class=\"e\">of the gleaming Twin Towers.</div><div class=\"k\">반짝이는 쌍둥이 빌딩의.</div></div><div class=\"rnat\">예술의 이름으로, Denes는 반짝이는 쌍둥이 빌딩의 그림자 바로 그곳에 아름다운 황금 밀밭을 만들었다.</div><div class=\"rst\">높은 빌딩 바로 옆 그늘에 황금빛 밀밭이 생겨요. 지문도 쌍둥이 빌딩 그림자 속에 밀밭을 만들었다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">For Wheatfield — A Confrontation,</div><div class=\"k\">〈Wheatfield — A Confrontation〉을 위해,</div></div><div class=\"rc\"><div class=\"e\">Denes and volunteers removed trash</div><div class=\"k\">Denes와 자원봉사자들은 쓰레기를 치웠다</div></div><div class=\"rc\"><div class=\"e\">from four acres of land,</div><div class=\"k\">4에이커의 땅에서,</div></div><div class=\"rc\"><div class=\"e\">then planted amber waves of grain</div><div class=\"k\">그런 다음 황색의 너울거리는 곡물을 심었다</div></div><div class=\"rc\"><div class=\"e\">atop the area.</div><div class=\"k\">그 지역 위에.</div></div><div class=\"rnat\">〈Wheatfield — A Confrontation〉을 위해, Denes와 자원봉사자들은 4에이커의 땅에서 쓰레기를 치운 다음 그 지역 위에 황색의 너울거리는 곡물을 심었다.</div><div class=\"rst\">선생님과 친구들이 4에이커 땅의 쓰레기를 치우고 곡물을 심어요. 지문의 작품 〈Wheatfield(밀밭)〉도 이렇게 시작돼요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">After months of farming and irrigation,</div><div class=\"k\">수개월의 농사와 관개 후에,</div></div><div class=\"rc\"><div class=\"e\">the wheat field was thriving and ready.</div><div class=\"k\">밀밭은 무성해졌고 준비가 되었다.</div></div><div class=\"rnat\">수개월의 농사와 관개 후에, 밀밭은 무성해졌고 준비가 되었다.</div><div class=\"rst\">몇 달 동안 물 주고 가꾸니 밀이 쑥쑥 자라요. 지문도 농사와 물대기 끝에 밀밭이 무성해졌다고 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The artist and her volunteers harvested</div><div class=\"k\">그 예술가와 그녀의 자원봉사자들은 수확해서</div></div><div class=\"rc\"><div class=\"e\">thousands of pounds of wheat</div><div class=\"k\">수천 파운드의 밀을</div></div><div class=\"rc\"><div class=\"e\">to give to food banks in the city,</div><div class=\"k\">도시의 푸드 뱅크에 기부했고,</div></div><div class=\"rc\"><div class=\"e\">nourishing both the minds and bodies</div><div class=\"k\">마음과 몸에 모두 영양분을 공급해 주었다</div></div><div class=\"rc\"><div class=\"e\">of New Yorkers.</div><div class=\"k\">뉴욕 사람들의.</div></div><div class=\"rnat\">그 예술가와 그녀의 자원봉사자들은 수천 파운드의 밀을 수확해서 도시의 푸드 뱅크에 기부했고, 뉴욕 사람들의 마음과 몸에 모두 영양분을 공급해 주었다.</div><div class=\"rst\">다 자란 밀을 거둬 푸드 뱅크에 보내요. 지문은 이 작품이 뉴욕 사람들의 마음과 몸을 모두 채워 줬다고 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"landfill\" data-m=\"쓰레기 매립지\"><b>landfill</b>쓰레기 매립지</button><button type=\"button\" class=\"wdb\" data-w=\"commission\" data-m=\"의뢰하다\"><b>commission</b>의뢰하다</button><button type=\"button\" class=\"wdb\" data-w=\"installation\" data-m=\"설치 미술(품)\"><b>installation</b>설치 미술(품)</button><button type=\"button\" class=\"wdb\" data-w=\"irrigation\" data-m=\"관개, 물 대기\"><b>irrigation</b>관개, 물 대기</button><button type=\"button\" class=\"wdb\" data-w=\"harvest\" data-m=\"수확하다\"><b>harvest</b>수확하다</button><button type=\"button\" class=\"wdb\" data-w=\"nourish\" data-m=\"영양분을 공급하다\"><b>nourish</b>영양분을 공급하다</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 <b>바로 앞에 꾸밈 받는 명사(선행사)</b>가 있는지부터 보세요. 앞에 명사가 있으면 <b>which</b>(~하는)나 <b>that</b>(~하는), 없을 때만 <b>what</b>(~하는 것)이에요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (6번)</span><div class=\"en\">… and open to misinterpretation <u>④ what</u> could have serious consequences.</div><p class=\"ko\">( ? ) 심각한 결과를 가져올 수도 있었던 오역의 가능성도 열려 있었다 — 앞은 명사, 뒤는 바로 동사 could have</p></div><div class=\"ck-via\"><i>▼</i><span>밑줄 바로 앞에 명사 misinterpretation(오역)이 버티고 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 선행사 확인</span><div class=\"en\">and open to <mark>misinterpretation</mark></div><p class=\"ko\"><mark>오역의</mark> 가능성도 열려 있었고</p></div><div class=\"ck-via\"><i>▼</i><span>선행사가 있고 뒤에 주어가 빠졌으니 → 주격 관계대명사 which(~하는)</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">misinterpretation <mark>which could have serious consequences</mark>.</div><p class=\"ko\"><mark>심각한 결과를 가져올 수도 있었던.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">관계대명사 what(~하는 것)과 which(~하는) 구별</p><p class=\"gr\">what(~하는 것)은 선행사를 품고 있어서 앞에 꾸밈 받는 명사가 없을 때만 써요. 앞에 명사(선행사)가 있으면 which(~하는)나 that(~하는)을 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I lost the pen which my dad gave me.</div><div class=\"ko\">나는 아빠가 주신 펜을 잃어버렸다. (앞에 명사 the pen 펜이 있으니 which)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I lost the pen what my dad gave me.</div><div class=\"ko\">앞에 선행사 the pen(펜)이 있는데 what을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I lost what my dad gave me.</div><div class=\"ko\">나는 아빠가 주신 것을 잃어버렸다. (앞에 명사가 없으니 what)</div></div><p class=\"gb\">지문 6번도 밑줄 앞에 명사 misinterpretation(오역)이 있고 뒤에 주어 없이 could have(가져올 수 있다)가 와요. 그래서 what(~하는 것)이 아니라 which(~하는)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">what → which (~하는)<small>앞에 선행사 misinterpretation(오역)이 있으니 what(~하는 것)이 아니라 which(~하는)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">whose 그것의</span><span class=\"why\">1번은 one(용어) 뒤에서 whose context(그것의 문맥)로 이어져요. 뒤에 명사 context(문맥)가 바로 붙고, '그 용어의 문맥'이라는 소유 관계라서 소유격 관계대명사 whose(그것의)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">소유격 관계대명사 whose(그것의) + 명사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a friend whose dog is big.</div><div class=\"ko\">나에게는 개가 큰 친구가 있다. (친구의 개 = 소유 관계라 whose가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a friend who dog is big.</div><div class=\"ko\">뒤에 명사 dog(개)가 바로 붙는데 who(누가)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the book whose cover is red.</div><div class=\"ko\">이것은 표지가 빨간 책이다. (책의 표지 = 소유 관계라 whose가 맞아요)</div></div><p class=\"gb\">지문 1번도 용어(one)의 문맥(context)이라는 소유 관계라 whose(그것의)가 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">reads ~라고 적혀 있다</span><span class=\"why\">2번은 a sign(표지판) … which reads(~라고 적혀 있는) 구조예요. which(~하는)가 가리키는 선행사가 단수 a sign(표지판)이라서 동사도 단수형 reads(적혀 있다)가 맞아요. 바로 앞 trail(산길)도 단수라 헷갈릴 일이 없어요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 뒤 동사는 선행사에 수 일치</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I saw a boy who plays soccer.</div><div class=\"ko\">나는 축구를 하는 소년을 보았다. (선행사 a boy 소년이 단수라 plays가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I saw a boy who play soccer.</div><div class=\"ko\">선행사가 단수 a boy(소년)인데 play(하다)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I saw boys who play soccer.</div><div class=\"ko\">나는 축구를 하는 소년들을 보았다. (선행사 boys 소년들이 복수라 play가 맞아요)</div></div><p class=\"gb\">지문 2번도 which(~하는)가 단수 a sign(표지판)을 받으니 reads(~라고 적혀 있다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">say 가정하다</span><span class=\"why\">4번은 let us say(가정해 보자)예요. let(~하게 하다) + 목적어 us(우리) 다음에는 동사원형이 와야 하므로(to 없이) say(말하다, 가정하다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">사역동사 let(~하게 하다) + 목적어 + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Let me help you.</div><div class=\"ko\">내가 너를 도와줄게. (let me 다음에 동사원형 help 돕다가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Let me to help you.</div><div class=\"ko\">let(~하게 하다) 뒤에 to help(돕는 것)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Let us play outside.</div><div class=\"ko\">밖에서 놀자. (let us 다음에 동사원형 play 놀다가 와서 맞아요)</div></div><p class=\"gb\">지문 4번도 let us(우리가 ~하게 하자) 다음이라 동사원형 say(가정하다)가 딱 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">explicitly 명백하게</span><span class=\"why\">7번은 to spell things out as explicitly as possible(가능한 한 명백하게 자세히 설명하는 것)이에요. 여기서 explicitly(명백하게)가 꾸미는 것은 동사 spell out(자세히 설명하다)이라서 형용사 explicit(명백한)이 아니라 부사가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">동사를 꾸미는 자리는 부사: as explicitly as possible(가능한 한 명백하게)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Run as fast as possible.</div><div class=\"ko\">가능한 한 빨리 달려라. (fast 빨리가 동사 run 달리다를 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Speak as clear as possible.</div><div class=\"ko\">동사 speak(말하다)를 꾸미는데 형용사 clear(분명한)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Speak as clearly as possible.</div><div class=\"ko\">가능한 한 분명하게 말해라. (부사 clearly 분명하게가 동사를 꾸며서 맞아요)</div></div><p class=\"gb\">지문 7번도 동사 spell out(자세히 설명하다)을 꾸미니 부사 explicitly(명백하게)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">An ambiguous term is one</div><div class=\"k\">모호한 용어란 (다음과 같은) 용어이다</div></div><div class=\"rc\"><div class=\"e\">which has more than a single meaning</div><div class=\"k\">하나 이상의 의미를 가지고 있는</div></div><div class=\"rc\"><div class=\"e\">and whose context does not clearly indicate</div><div class=\"k\">그리고 그 문맥이 명확하게 보여주지 못하는</div></div><div class=\"rc\"><div class=\"e\">which meaning is intended.</div><div class=\"k\">어떤 의미가 의도되었는지를.</div></div><div class=\"rnat\">모호한 용어란 하나 이상의 의미를 가지고 있으면서, 어떤 의미가 의도되었는지를 그 문맥이 명확하게 보여주지 못하는 용어이다.</div><div class=\"rst\">모호한 말은 뜻이 둘 이상인데, 앞뒤를 봐도 어느 뜻인지 모르는 말이에요. 1번은 one(용어)을 whose(그것의)로 이어 설명해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">For instance,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">a sign posted at a fork in a trail</div><div class=\"k\">산길의 갈림길에 세워진 표지판은</div></div><div class=\"rc\"><div class=\"e\">which reads “Bear To The Right”</div><div class=\"k\">“Bear To The Right”라고 적혀 있는</div></div><div class=\"rc\"><div class=\"e\">can be understood in two ways.</div><div class=\"k\">두 가지 방식으로 이해될 수 있다.</div></div><div class=\"rnat\">예를 들어, 어떤 산길에 난 갈림길에 세워진 \"Bear To The Right\"라는 문구의 표지판은 두 가지 방식으로 이해될 수 있다.</div><div class=\"rst\">예를 들어 산길 갈림길 표지판에 “Bear To The Right”(오른쪽으로 가시오 / 오른쪽에 곰)가 적혀 있어요. a sign(표지판)이 단수라 reads(적혀 있다)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The more probable meaning is that</div><div class=\"k\">좀 더 가능성 있어 보이는 의미는</div></div><div class=\"rc\"><div class=\"e\">it is instructing hikers</div><div class=\"k\">그것(= 표지판)이 등산객들에게 알려주고 있다는 것이다</div></div><div class=\"rc\"><div class=\"e\">to take the right trail, not the left.</div><div class=\"k\">왼쪽 말고 오른쪽 길로 가라고.</div></div><div class=\"rnat\">좀 더 가능성 있어 보이는 의미는 그 표지판이 등산객들에게 왼쪽 말고 오른쪽 길로 가라고 알려주고 있다는 것이다.</div><div class=\"rst\">보통은 “왼쪽 말고 오른쪽 길로 가라”는 뜻으로 읽혀요. 이게 더 가능성 있는 뜻이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">But let us say</div><div class=\"k\">하지만 가정해 보자</div></div><div class=\"rc\"><div class=\"e\">that the ranger who painted the sign</div><div class=\"k\">그 표지판을 만든 삼림 관리인이</div></div><div class=\"rc\"><div class=\"e\">meant to say just the opposite.</div><div class=\"k\">정반대로 말하려 했다고.</div></div><div class=\"rnat\">그러나 그 표지판을 만든 삼림 관리인이 정반대로 말하려 했다고 가정해 보자.</div><div class=\"rst\">하지만 표지판을 만든 사람은 정반대 뜻이었다고 해 봐요. let us say(가정해 보자)는 let(~하게 하다) + 동사원형이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">He was trying to warn hikers</div><div class=\"k\">그는 등산객들에게 경고하려고 노력하고 있었던 것이다</div></div><div class=\"rc\"><div class=\"e\">against taking the right trail</div><div class=\"k\">오른쪽 길로 가지 말라고</div></div><div class=\"rc\"><div class=\"e\">because there is a bear in the area</div><div class=\"k\">그 지역에 곰이 한 마리 있기 때문에</div></div><div class=\"rc\"><div class=\"e\">through which it passes.</div><div class=\"k\">그 길이 통과하는.</div></div><div class=\"rnat\">그는 등산객들에게 그 길이 통과하는 지역에 곰이 한 마리 있기 때문에 오른쪽 길로 가지 말라고 경고하려고 노력하고 있었던 것이다.</div><div class=\"rst\">그 사람은 “오른쪽 길엔 곰이 있으니 가지 마!” 하고 경고하려던 거예요. 그래서 같은 글이 정반대로 읽힌 거예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">The ranger’s language was therefore careless,</div><div class=\"k\">따라서 그 삼림 관리인의 표현은 부주의했고,</div></div><div class=\"rc ckc\"><div class=\"e\">and open to <span class=\"cw\">misinterpretation</span></div><div class=\"k\"><span class=\"cw\">오역의</span> 가능성도 열려 있었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">which could have serious consequences.</span></div><div class=\"k\"><span class=\"cw\">심각한 결과를 가져올 수도 있었던.</span> ※ 문제지엔 what으로 되어 있음</div></div><div class=\"rnat\">따라서 그 삼림 관리인의 표현은 부주의했고, 심각한 결과를 가져올 수도 있었던 오역의 가능성도 열려 있었다.</div><div class=\"rst\">그래서 그 말은 부주의했고, 큰일 날 수도 있는 <b>오역</b>(misinterpretation)을 부를 수 있었어요. 앞에 명사가 있으니 <b>which</b>(~하는)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The only way to avoid ambiguity</div><div class=\"k\">모호함을 피하는 유일한 방법은</div></div><div class=\"rc\"><div class=\"e\">is to spell things out</div><div class=\"k\">자세히 설명하는 것이다</div></div><div class=\"rc\"><div class=\"e\">as explicitly as possible:</div><div class=\"k\">가능한 한 명백하게:</div></div><div class=\"rc\"><div class=\"e\">“Keep left. Do not use trail to the right. Bears in the area.”</div><div class=\"k\">“왼쪽으로 가시오. 오른쪽 길로는 가지 마시오. 곰이 있는 지역입니다.”</div></div><div class=\"rnat\">모호함을 피하는 유일한 방법은 가능한 한 명백하게 자세히 설명하는 것이다: \"왼쪽으로 가시오. 오른쪽 길로는 가지 마시오. 곰이 있는 지역입니다.\"</div><div class=\"rst\">모호함을 피하려면 가능한 한 <b>명백하게</b>(explicitly) 다 풀어 써야 해요. “왼쪽으로 가시오. 곰 있음.”처럼요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"ambiguous\" data-m=\"모호한\"><b>ambiguous</b>모호한</button><button type=\"button\" class=\"wdb\" data-w=\"fork in a trail\" data-m=\"산길의 갈림길\"><b>fork in a trail</b>산길의 갈림길</button><button type=\"button\" class=\"wdb\" data-w=\"probable\" data-m=\"가능성 있는, 있을 법한\"><b>probable</b>가능성 있는, 있을 법한</button><button type=\"button\" class=\"wdb\" data-w=\"ranger\" data-m=\"삼림 관리인\"><b>ranger</b>삼림 관리인</button><button type=\"button\" class=\"wdb\" data-w=\"misinterpretation\" data-m=\"오역, 잘못된 해석\"><b>misinterpretation</b>오역, 잘못된 해석</button><button type=\"button\" class=\"wdb\" data-w=\"spell out\" data-m=\"자세히 설명하다\"><b>spell out</b>자세히 설명하다</button><button type=\"button\" class=\"wdb\" data-w=\"explicitly\" data-m=\"명백하게\"><b>explicitly</b>명백하게</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>must</b>(~해야 한다)로 시작하는 첫 문장과 계속 <b>반복되는 핵심어</b>를 묶어서 찾으세요. <b>a common language</b>(공통 언어) = <b>the same terms</b>(동일한 용어)가 과목들을 <b>link</b>(연결하다)한다는 말이 끝까지 되풀이돼요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 결론 신호</span><div class=\"en\">Education <mark>must</mark> focus on the trunk of the tree of knowledge, … all emerge from a common core.</div><p class=\"ko\">교육은 지식의 나무의 줄기에 초점을 <mark>맞춰야 한다</mark> … 모두 공통의 핵심에서 나오는</p></div><div class=\"ck-via\"><i>▼</i><span>그 공통의 핵심이 주는 것 = 공통 언어</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 핵심어 등장</span><div class=\"en\">Tools for thinking stem from this core, <mark>providing a common language</mark> …</div><p class=\"ko\">사고를 위한 도구는 이 핵심에서 비롯된다, <mark>공통 언어를 제공하면서</mark></p></div><div class=\"ck-via\"><i>▼</i><span>공통 언어를 교육 과정에 쓰면 어떻게 되는지 결과를 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\"><mark>When the same terms are employed</mark> across the curriculum, <mark>students begin to link</mark> different subjects and classes.</div><p class=\"ko\">교육 과정 전반에 걸쳐 <mark>동일한 용어가 사용될 때</mark>, 학생들은 서로 다른 과목들과 수업들을 <mark>연결하기 시작한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>글쓰기·그림 수업 모두 ‘추상’이라는 같은 말로 부르기</span><span><em>5번</em>생각을 한 방식에서 다른 방식으로 바꾸는 법을 알게 됨</span></div><div class=\"ck-eq\">⇒ 같은 용어를 쓰니 과목의 경계를 넘어 생각하게 됨 = 3번의 예시</div></div><div class=\"ck-via\"><i>▼</i><span>마지막에 ‘연결은 자연스럽게 된다’로 한 번 더 닫아요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결론 반복</span><div class=\"en\"><mark>Linking the disciplines comes naturally</mark> when the terms and tools are presented as part of a universal imagination.</div><p class=\"ko\">용어들과 도구들이 보편적 상상력의 일부로 제시될 때 <mark>학문들을 연결하는 것은 자연스럽게 이루어진다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">necessity of using a common language to integrate the curriculum 교육 과정을 통합하기 위해 공통 언어를 사용할 필요성<small>1번 must(~해야 한다) + 2번 common language(공통 언어) + 3·6번 link(연결하다)를 모두 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">drawbacks of applying a common language to various fields 다양한 분야에 공통 언어를 적용하는 것의 단점</span><span class=\"why\">[반대] common language(공통 언어)라는 핵심어는 맞지만 ‘단점’이 틀려요. 3번·6번은 공통 용어 덕분에 과목이 자연스럽게 연결되는 좋은 점만 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">difficulties in finding meaningful links between disciplines 학문 간 의미 있는 연결 고리를 찾는 것의 어려움</span><span class=\"why\">[반대] 6번은 연결이 comes naturally(자연스럽게 이루어진다)고 해요. 어렵다는 말이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">effects of diversifying the curriculum on students' creativity 교육 과정의 다양화가 학생들의 창의성에 미치는 영향</span><span class=\"why\">[반대] 지문은 과목을 여러 갈래로 다양하게 늘리라는 게 아니라, 1번처럼 공통의 핵심(a common core)으로 묶으라는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">usefulness of turning abstract thoughts into concrete expressions 추상적인 생각을 구체적인 표현으로 바꾸는 것의 유용성</span><span class=\"why\">[범위 좁음] 4·5번의 abstracting(추상)과 생각 바꾸기는 공통 용어를 쓰는 예시일 뿐이에요. 글 전체의 중심은 공통 언어로 과목 잇기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Education must focus on the trunk</div><div class=\"k\">교육은 줄기에 초점을 맞춰야 한다</div></div><div class=\"rc\"><div class=\"e\">of the tree of knowledge,</div><div class=\"k\">지식의 나무의,</div></div><div class=\"rc\"><div class=\"e\">revealing the ways</div><div class=\"k\">방식을 밝히면서</div></div><div class=\"rc\"><div class=\"e\">in which the branches, twigs, and leaves</div><div class=\"k\">나뭇가지, 잔가지, 그리고 잎이</div></div><div class=\"rc\"><div class=\"e\">all emerge from a common core.</div><div class=\"k\">모두 공통의 핵심에서 나오는.</div></div><div class=\"rnat\">교육은 나뭇가지, 잔가지, 그리고 잎이 모두 공통의 핵심에서 나오는 방식을 밝히면서, 지식의 나무 줄기에 초점을 맞춰야 한다.</div><div class=\"rst\">과목마다 따로 노는 공부 말고, 모든 과목의 <b>줄기</b>(몸통)를 먼저 봐야 해요. 지문도 교육은 지식 나무의 줄기에 초점을 <b>맞춰야 한다</b>(must)고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Tools for thinking stem from this core,</div><div class=\"k\">사고를 위한 도구는 이 핵심에서 비롯된다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">providing a common language</span></div><div class=\"k\"><span class=\"cw\">공통 언어를 제공하면서</span></div></div><div class=\"rc\"><div class=\"e\">with which practitioners in different fields</div><div class=\"k\">그것으로 다양한 분야의 실무자들이</div></div><div class=\"rc\"><div class=\"e\">may share their experience of the process of innovation</div><div class=\"k\">혁신 과정에 대한 그들의 경험을 공유하고</div></div><div class=\"rc\"><div class=\"e\">and discover links between their creative activities.</div><div class=\"k\">그들의 창의적 활동 사이의 연결 고리를 발견할 수 있는.</div></div><div class=\"rnat\">다양한 분야의 실무자들이 혁신 과정에 대한 그들의 경험을 공유하고 그들의 창의적 활동 사이의 연결 고리를 발견할 수 있는 공통 언어를 제공하면서, 사고를 위한 도구는 이 핵심에서 비롯된다.</div><div class=\"rst\">그 줄기에서 모든 과목이 같이 쓰는 <b>말</b>이 나와요. = 지문의 <b>공통 언어</b>(a common language)로 서로 경험을 나누는 거예요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">When the same terms are employed</span></div><div class=\"k\"><span class=\"cw\">동일한 용어가 사용될 때</span></div></div><div class=\"rc\"><div class=\"e\">across the curriculum,</div><div class=\"k\">교육 과정 전반에 걸쳐,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">students begin to link</span></div><div class=\"k\"><span class=\"cw\">학생들은 연결하기 시작한다</span></div></div><div class=\"rc\"><div class=\"e\">different subjects and classes.</div><div class=\"k\">서로 다른 과목들과 수업들을.</div></div><div class=\"rnat\">교육 과정 전반에 걸쳐 동일한 용어가 사용될 때, 학생들은 서로 다른 과목들과 수업들을 연결하기 시작한다.</div><div class=\"rst\">국어·과학·미술 쌤이 모두 <b>같은 말</b>을 쓰면 “어, 이거 국어 시간에 배운 거네!” 하고 과목을 잇게 돼요. 지문의 핵심 문장이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">If they practice abstracting in writing class,</div><div class=\"k\">그들이 글쓰기 수업에서 추상을 연습하고,</div></div><div class=\"rc\"><div class=\"e\">if they work on abstracting</div><div class=\"k\">추상을 연습하고</div></div><div class=\"rc\"><div class=\"e\">in painting or drawing class,</div><div class=\"k\">회화나 그림 그리기 수업에서,</div></div><div class=\"rc\"><div class=\"e\">and if, in all cases, they call it abstracting,</div><div class=\"k\">그리고 모든 경우에 그것을 추상이라고 칭한다면,</div></div><div class=\"rc\"><div class=\"e\">they begin to understand how to think</div><div class=\"k\">그들은 어떻게 사고하는지 이해하기 시작한다</div></div><div class=\"rc\"><div class=\"e\">beyond disciplinary boundaries.</div><div class=\"k\">학문의 경계를 넘어.</div></div><div class=\"rnat\">그들이 글쓰기 수업에서 추상을 연습하고, 회화나 그림 그리기 수업에서 추상을 연습하고, 그리고 모든 경우에 그것을 추상이라고 칭한다면, 그들은 어떻게 학문의 경계를 넘어 사고하는지 이해하기 시작한다.</div><div class=\"rst\">국어 시간에도, 미술 시간에도 ‘핵심만 뽑아내기’를 똑같이 <b>추상</b>(abstracting)이라고 불러요. 그러면 과목의 벽을 넘어 생각하게 된대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">They see how to transform their thoughts</div><div class=\"k\">그들은 그들의 생각을 어떻게 바꾸는지 알게 된다</div></div><div class=\"rc\"><div class=\"e\">from one mode of conception and expression</div><div class=\"k\">하나의 개념과 표현 방식에서</div></div><div class=\"rc\"><div class=\"e\">to another.</div><div class=\"k\">다른 방식으로.</div></div><div class=\"rnat\">그들은 그들의 생각을 어떻게 하나의 개념과 표현 방식에서 다른 방식으로 바꾸는지 알게 된다.</div><div class=\"rst\">글로 뽑아낸 핵심을 그림으로 바꿔 보는 법도 알게 돼요. 지문도 생각을 한 방식에서 다른 방식으로 바꾼다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Linking the disciplines comes naturally</span></div><div class=\"k\"><span class=\"cw\">학문들을 연결하는 것은 자연스럽게 이루어진다</span></div></div><div class=\"rc\"><div class=\"e\">when the terms and tools are presented</div><div class=\"k\">용어들과 도구들이 제시될 때</div></div><div class=\"rc\"><div class=\"e\">as part of a universal imagination.</div><div class=\"k\">보편적 상상력의 일부로.</div></div><div class=\"rnat\">용어들과 도구들이 보편적 상상력의 일부로 제시될 때, 학문들을 연결하는 것은 자연스럽게 이루어진다.</div><div class=\"rst\">그러니 같은 말과 도구만 쓰면 <b>과목 잇기가 저절로 돼요</b>. 지문도 학문 연결은 자연스럽게 이루어진다며 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"trunk\" data-m=\"(나무의) 줄기, 몸통\"><b>trunk</b>(나무의) 줄기, 몸통</button><button type=\"button\" class=\"wdb\" data-w=\"stem from\" data-m=\"~에서 비롯되다\"><b>stem from</b>~에서 비롯되다</button><button type=\"button\" class=\"wdb\" data-w=\"practitioners\" data-m=\"실무자들 (practitioner 실무자)\"><b>practitioners</b>실무자들 (practitioner 실무자)</button><button type=\"button\" class=\"wdb\" data-w=\"curriculum\" data-m=\"교육 과정\"><b>curriculum</b>교육 과정</button><button type=\"button\" class=\"wdb\" data-w=\"disciplinary boundaries\" data-m=\"학문의 경계\"><b>disciplinary boundaries</b>학문의 경계</button><button type=\"button\" class=\"wdb\" data-w=\"universal imagination\" data-m=\"보편적 상상력\"><b>universal imagination</b>보편적 상상력</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 문장은 <b>In other situations</b>(또 다른 상황에서)로 앞과 <b>대조</b>돼요. 앞에서 계속 말한 <b>‘온전히 남아 있음’</b>이 빠져나간다는 뜻이니, 그것을 한 단어로 묶는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (6번)</span><div class=\"en\"><mark>In other situations</mark>, <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> slips between our fingers, … as when an email … mysteriously disappears from our inbox.</div><p class=\"ko\">또 다른 상황에서는 ( ? )이 손가락 사이로 빠져나간다 — 받은 이메일이 사라지는 때처럼</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>2번</em>게시한 내용은 보통 온전히 남아 있음</span><span><em>3번</em>이메일·동영상·문자는 저장할 수 있음</span><span><em>5번</em>원할 때마다 과거로 돌아가 다시 볼 수 있음</span></div><div class=\"ck-eq\">⇒ 앞 장면들의 공통점 = 사라지지 않고 계속 남아 있음</div></div><div class=\"ck-via\"><i>▼</i><span>‘계속 남아 있음’을 한 줄로 요약한 문장 → 빈칸은 이게 빠져나가는 것</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">When <mark>perfect preservation</mark> is possible, time has been suspended.</div><p class=\"ko\"><mark>완벽한 보존이</mark> 가능할 때, 시간은 멈춰 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 뒤 예시: 영원할 문서도 실수 한 번에 사라져요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 한 번 더 확인</span><div class=\"en\">The slightest accidental tap of the finger can send an otherwise <mark>everlasting</mark> document into nothingness.</div><p class=\"ko\">손가락의 아주 사소한 우발적인 두드림은 그렇지 않으면 <mark>영원히 존재할</mark> 문서를 무(無)의 상태로 보낼 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">permanency 영속성<small>perfect preservation(완벽한 보존)·everlasting(영원한)을 한 단어로 묶은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">mysteriousness 불가사의함</span><span class=\"why\">6번 뒤쪽 mysteriously(불가사의하게)만 따온 함정이에요. 빠져나가는 건 ‘이상함’이 아니라 사라지지 않고 남아 있던 성질이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">scarcity 희소성</span><span class=\"why\">드물고 부족하다는 얘기는 지문에 없어요. 2~5번은 오히려 무엇이든 쉽게 저장된다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">creativity 창의성</span><span class=\"why\">새로 만들어 내는 장면이 하나도 없어요. 지문은 저장하고 남기는 것(preservation 보존)만 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">acceleration 가속</span><span class=\"why\">4번은 시간이 빨라지는 게 아니라 suspended(멈춰 있는) 상태라고 해요. 속도 이야기가 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Online environments vary widely</div><div class=\"k\">온라인 환경은 매우 다양하다</div></div><div class=\"rc\"><div class=\"e\">in how easily you can save</div><div class=\"k\">당신이 얼마나 쉽게 저장할 수 있는지에 있어서</div></div><div class=\"rc\"><div class=\"e\">whatever happens there,</div><div class=\"k\">거기에서 일어나는 일이 무엇이든 간에,</div></div><div class=\"rc\"><div class=\"e\">what I call its recordability and preservability.</div><div class=\"k\">즉 내가 온라인 환경의 ‘기록 가능성’과 ‘저장 가능성’이라고 부르는 것에 있어서.</div></div><div class=\"rnat\">온라인 환경은 거기에서 일어나는 일이 무엇이든 간에 당신이 얼마나 쉽게 저장할 수 있는지, (즉) 내가 온라인 환경의 '기록 가능성'과 '저장 가능성'이라고 부르는 것에 있어서 매우 다양하다.</div><div class=\"rst\">카톡이나 인스타그램 같은 앱마다 대화·사진을 얼마나 쉽게 저장할 수 있는지가 달라요. 지문은 이걸 기록 가능성·저장 가능성이라고 불러요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Even though the design, activities, and membership of social media</div><div class=\"k\">비록 소셜 미디어의 디자인, 활동, 그리고 멤버십이</div></div><div class=\"rc\"><div class=\"e\">might change over time,</div><div class=\"k\">시간이 지남에 따라 바뀔지도 모르지만,</div></div><div class=\"rc\"><div class=\"e\">the content of what people posted</div><div class=\"k\">사람들이 게시했던 것의 내용은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">usually remains intact.</span></div><div class=\"k\"><span class=\"cw\">보통 온전히 남아 있다.</span></div></div><div class=\"rnat\">비록 소셜 미디어의 디자인, 활동, 그리고 멤버십이 시간이 지남에 따라 바뀔지도 모르지만, 사람들이 게시했던 것의 내용은 보통 온전히 남아 있다.</div><div class=\"rst\">앱 화면 디자인이 바뀌어도 내가 올린 사진은 그대로 <b>남아 있어요</b>. = 지문의 ‘게시한 내용은 온전히 남는다’(remains intact)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Email, video, audio, and text messages</div><div class=\"k\">이메일, 동영상, 음성, 그리고 문자 메시지는</div></div><div class=\"rc\"><div class=\"e\">can be saved.</div><div class=\"k\">저장될 수 있다.</div></div><div class=\"rnat\">이메일, 동영상, 음성, 그리고 문자 메시지는 저장될 수 있다.</div><div class=\"rst\">친구랑 주고받은 메시지·영상·음성도 다 저장할 수 있어요. 지문도 이메일·동영상·문자가 저장된다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">When perfect preservation is possible,</span></div><div class=\"k\"><span class=\"cw\">완벽한 보존이 가능할 때,</span></div></div><div class=\"rc\"><div class=\"e\">time has been suspended.</div><div class=\"k\">시간은 멈춰 있다.</div></div><div class=\"rnat\">완벽한 보존이 가능할 때, 시간은 멈춰 있다.</div><div class=\"rst\"><b>완벽하게 보존</b>(perfect preservation)되면 그 순간이 멈춘 것처럼 그대로 있어요. = 지문 4번, 빈칸에 들어갈 ‘계속 남아 있음’을 미리 보여 주는 단서예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Whenever you want,</div><div class=\"k\">당신이 원할 때마다,</div></div><div class=\"rc\"><div class=\"e\">you can go back</div><div class=\"k\">당신은 되돌아갈 수 있다</div></div><div class=\"rc\"><div class=\"e\">to reexamine those events from the past.</div><div class=\"k\">과거의 그러한 사건들을 다시 돌아보기 위해.</div></div><div class=\"rnat\">당신이 원할 때마다, 당신은 과거(로부터)의 그러한 사건들을 다시 돌아보기 위해 되돌아갈 수 있다.</div><div class=\"rst\">그래서 작년 생일 사진도 언제든 다시 꺼내 볼 수 있어요. 지문도 원할 때마다 과거로 돌아가 다시 본다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In other situations,</span></div><div class=\"k\"><span class=\"cw\">또 다른 상황에서,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">permanency</span> slips between our fingers,</div><div class=\"k\"><span class=\"cw\">영속성은</span> 우리의 손가락 사이로 빠져나간다, ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">even challenging our reality testing</div><div class=\"k\">심지어 우리의 현실 검증에 이의를 제기하면서</div></div><div class=\"rc\"><div class=\"e\">about whether something existed at all,</div><div class=\"k\">어떤 것이 어떤 식으로든 존재했었는지에 대한,</div></div><div class=\"rc\"><div class=\"e\">as when an email that we seem to remember receiving</div><div class=\"k\">우리가 받았다고 기억하는 것처럼 보이는 이메일이 ~ 때처럼</div></div><div class=\"rc\"><div class=\"e\">mysteriously disappears from our inbox.</div><div class=\"k\">우리의 받은 편지함에서 불가사의하게 사라질.</div></div><div class=\"rnat\">또 다른 상황에서 영속성은 우리의 손가락 사이로 빠져나간다, 우리가 받았다고 기억하는 것처럼 보이는 이메일이 우리의 받은 편지함에서 불가사의하게 사라질 때처럼, 심지어 어떤 것이 어떤 식으로든 존재했었는지에 대한 우리의 현실 검증에 이의를 제기하면서.</div><div class=\"rst\"><b>그런데 다른 경우엔</b>(In other situations) 받은 카톡이 감쪽같이 사라져요. 그래서 빈칸은 ‘계속 남아 있음’(permanency = 영속성)이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">The slightest accidental tap of the finger</div><div class=\"k\">손가락의 아주 사소한 우발적인 두드림은</div></div><div class=\"rc ckc\"><div class=\"e\">can send an otherwise <span class=\"cw\">everlasting document</span></div><div class=\"k\">그렇지 않으면 <span class=\"cw\">영원히 존재할 문서를</span> 보낼 수 있다</div></div><div class=\"rc\"><div class=\"e\">into nothingness.</div><div class=\"k\">무(無)의 상태로.</div></div><div class=\"rnat\">손가락의 아주 사소한 우발적인 두드림은(손가락으로 우연히 살짝 톡 친 것은) 그렇게 하지 않았으면 영원히 존재할 문서를 무(無)의 상태로 보낼 수 있다.</div><div class=\"rst\">손가락 한 번 잘못 눌러서 <b>영원할</b>(everlasting) 줄 알았던 사진을 지워 버리는 것처럼요. 지문도 문서가 무로 사라진다고 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"recordability\" data-m=\"기록 가능성\"><b>recordability</b>기록 가능성</button><button type=\"button\" class=\"wdb\" data-w=\"preservability\" data-m=\"보존 가능성\"><b>preservability</b>보존 가능성</button><button type=\"button\" class=\"wdb\" data-w=\"intact\" data-m=\"손상되지 않은, 온전한\"><b>intact</b>손상되지 않은, 온전한</button><button type=\"button\" class=\"wdb\" data-w=\"suspend\" data-m=\"멈추다, 유예하다\"><b>suspend</b>멈추다, 유예하다</button><button type=\"button\" class=\"wdb\" data-w=\"reexamine\" data-m=\"다시 살펴보다\"><b>reexamine</b>다시 살펴보다</button><button type=\"button\" class=\"wdb\" data-w=\"reality testing\" data-m=\"현실 검증\"><b>reality testing</b>현실 검증</button><button type=\"button\" class=\"wdb\" data-w=\"everlasting\" data-m=\"영원한\"><b>everlasting</b>영원한</button></div>"};

      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
