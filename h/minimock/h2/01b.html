<title>고2 미니모의고사 1회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

간이 남아돈다고 했습니다."}, {"n": "⑤", "t": "isolated (고립된)", "a": false, "x": true, "trap": false, "e": "오히려 4번에 <b>socializing</b>(사교 활동)이 나옵니다. 고립과는 거리가 멉니다."}], "w": [["compared with", "~와 비교하여"], ["anthropologist", "인류학자"], ["surviving", "현존하는"], ["account for", "(비율을) 차지하다"], ["proportion", "비율"], ["quantity", "양"], ["via", "~을 통하여"], ["nomad", "유목민"], ["leisure activity", "여가 활동"], ["socializing", "사교 활동"], ["adopt", "채택하다"], ["in effect", "사실상"]]}, {"q": "08", "type": "빈칸 추론", "src": "2018년 3월 31번", "ans": "②", "tr": [["1", "무엇보다 중요하게, 돈은 예측 가능한 방식으로 희소해야(scarce) 한다."], ["2", "귀금속이 수천 년에 걸쳐 화폐로서 탐나는 존재였던 것은 그 자체로 아름답기 때문만이 아니라 고정된 양으로만 존재하기 때문이다."], ["3", "금과 은은 발견되고 채굴되는 속도만큼만 사회에 들어온다. 추가적인 귀금속은 생산될 수 없으며, 적어도 값싸게는 안 된다."], ["4", "쌀이나 담배 같은 상품은 재배할 수 있지만, 그래도 시간과 자원이 든다."], ["5", "짐바브웨의 Robert Mugabe 같은 독재자도 정부에 쌀 100조 톤을 생산하라고 명령할 수는 없었다."], ["6", "그는 수조 단위의 짐바브웨 달러 신권을 찍어 유통시킬 수는 있었고, 바로 그 때문에 그 돈은 결국 화폐보다 화장지로 쓰이는 편이 더 값어치 있게 되어 버렸다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "Precious metals have been desirable as money ... because they exist in fixed quantities."}, {"en": false, "h": "빈칸 문장 바로 다음에 <b>because</b>가 두 개 나옵니다. 그중 뒤엣것 — <b>they exist in fixed quantities</b>(고정된 양으로만 존재한다) — 이 빈칸을 그대로 풀어 쓴 말입니다.<br><br>3~6번은 전부 같은 얘기의 변주입니다. 금·은은 <b>더 못 만든다</b> → 쌀·담배는 만들 수는 있지만 <b>비용이 든다</b> → 짐바브웨 달러는 <b>얼마든지 찍어 냈다</b> → 그래서 <b>휴지만도 못해졌다</b>. 즉 <b>양을 마음대로 못 늘리는 것</b>이 돈의 조건입니다."}], "opts": [{"n": "①", "t": "invested (투자되는)", "a": false, "x": true, "trap": false, "e": "투자 이야기는 어디에도 없습니다."}, {"n": "②", "t": "scarce (희소한)", "a": true, "x": false, "trap": false, "e": "2번의 fixed quantities, 3번의 cannot be produced와 정확히 맞습니다."}, {"n": "③", "t": "transferred (이전되는)", "a": false, "x": true, "trap": false, "e": "돈이 옮겨 다니는 성질은 다루지 않습니다. 유통(distribute)은 짐바브웨의 <b>실패</b> 사례에만 나옵니다."}, {"n": "④", "t": "divisible (나눌 수 있는)", "a": false, "x": true, "trap": false, "e": "화폐의 조건으로 흔히 배우는 성질이라 매력적이지만, <b>이 지문</b>은 나누는 이야기를 하지 않습니다. <b>배경지식으로 고르면 걸리는</b> 함정."}, {"n": "⑤", "t": "deposited (예치되는)", "a": false, "x": true, "trap": false, "e": "은행·예금 이야기가 전혀 없습니다."}], "w": [["predictable", "예측 가능한"], ["precious metal", "귀금속"], ["desirable", "바람직한, 탐나는"], ["intrinsic", "내재적인, 본질적인"], ["fixed quantity", "고정된 양"], ["mine", "채굴하다"], ["commodity", "상품, 원자재"], ["resource", "자원"], ["dictator", "독재자"], ["distribute", "유통시키다, 분배하다"], ["eventually", "결국"], ["currency", "통화, 화폐"]]}, {"q": "09", "type": "무관한 문장", "src": "2016년 11월 35번", "ans": "④", "tr": [["1", "그저 배우기만 한 진리는 의족이나 틀니, 밀랍으로 만든 코처럼 우리 몸에 겉돌며 붙어 있을 뿐이다."], ["2", "① 반면에 우리 자신의 사고를 통해 얻은 진리는 타고난 팔다리와 같다. 그것만이 정말로 우리에게 속한다."], ["3", "② 사색가와 그저 학문만 쌓은 학자를 가르는 차이는 바로 여기에 있다."], ["4", "③ 그러므로 스스로 생각하는 사색가의 지적 소득은 완벽한 색의 조화로 생생하게 두드러지는 아름다운 그림과 같다."], ["5", "④ 그림에서 색은 우리 감정에 주요한 영향을 미치며, 따라서 우리가 미술을 감상하는 방식에서 큰 역할을 한다."], ["6", "⑤ 반면에 한낱 학자의 지적 습득은 밝은 색이 가득하지만 조화가 없는 커다란 팔레트와 같다."]], "evh": "4 · 6번 문장", "ev": [{"en": true, "h": "④ Color in painting is a major influence on our emotions ... / ⑤ The intellectual acquisition of the mere scholar ... is like a large palette ..."}, {"en": false, "h": "이 글의 주제는 <b>스스로 생각한 진리 vs 배우기만 한 지식</b>입니다. 그림·색·팔레트는 그 대비를 설명하기 위한 <b>비유</b>일 뿐입니다.<br><br>④는 비유였던 <b>‘그림의 색’ 자체가 주인공</b>이 되어 미술 감상론으로 빠져 버립니다. 사색가도 학자도 등장하지 않습니다.<br><br><b>결정적 증거</b> — ④를 빼고 ③ 다음에 ⑤를 바로 붙여 보세요. ③의 <b>아름다운 그림</b>과 ⑤의 <b>조화 없는 팔레트</b>가 <b>on the other hand</b>로 딱 이어집니다. ④가 그 연결을 끊고 있습니다."}], "opts": [{"n": "①", "t": "반면에 우리 자신의 사고를 통해 얻은 진리는…", "a": false, "x": true, "trap": false, "e": "1번의 ‘배우기만 한 진리’와 짝을 이루는 대비입니다. 필요합니다."}, {"n": "②", "t": "사색가와 한낱 학자를 가르는 차이는 여기에 있다.", "a": false, "x": true, "trap": false, "e": "앞의 대비를 <b>사색가 vs 학자</b>라는 주제어로 정리해 줍니다. 글의 축입니다."}, {"n": "③", "t": "사색가의 지적 소득은 아름다운 그림과 같다.", "a": false, "x": true, "trap": false, "e": "사색가 쪽 비유를 제시합니다. ⑤와 짝입니다."}, {"n": "④", "t": "그림에서 색은 우리 감정에 주요한 영향을 미치며…", "a": true, "x": false, "trap": false, "e": "비유로 쓰인 소재(그림·색)를 <b>주제로 착각</b>해 미술 감상론으로 빠졌습니다. 사색가·학자가 사라집니다."}, {"n": "⑤", "t": "반면에 한낱 학자의 지적 습득은 조화 없는 팔레트와 같다.", "a": fals function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}

var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>첫 문장</b>이면 뒤 문장 전체가 그 빈칸을 풀어 주는 증거예요. 숫자(일주일에 12~19시간)와 결론(<b>주말 닷새</b>)이 가리키는 삶의 모습을 한 단어로 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">Compared with farmers, hunter-gatherers led a more <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> life.</span></div><p class=\"ko\">농부와 비교하면 수렵채집인은 더 ( ? ) 삶을 살았다</p></div><div class=\"ck-via\"><i>▼</i><span>농부와 비교한 기준이 ‘일하는 시간’이라는 걸 알려 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 시간 비교</span><div class=\"en\">… gathering food only accounts for a small proportion of their time — <mark>far less</mark> than would be required to produce the same quantity of food via farming.</div><p class=\"ko\">식량을 모으는 일이 그들의 시간 중 작은 부분만 차지한다 — 농사로 같은 양을 생산하는 데 드는 것보다 <mark>훨씬 더 적다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>3번의 숫자(주 12~19시간, 14시간 미만)가 남긴 결과</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">That leaves <mark>a lot of time free</mark> for <mark>leisure activities</mark>, socializing, and so on.</div><p class=\"ko\">그것은 여가 활동, 사교 활동 등을 위해 <mark>많은 시간을 자유롭게</mark> 남겨 준다.</p></div><div class=\"ck-via\"><i>▼</i><span>In effect(사실상)로 앞 내용을 한 줄로 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 마지막 못 박기</span><div class=\"en\">In effect, hunter-gatherers work two days a week and have <mark>five-day weekends</mark>.</div><p class=\"ko\">사실상 수렵채집인은 일주일에 이틀 일하고 <mark>닷새의 주말</mark>을 보낸다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">leisurely 여유로운<small>4번 leisure activities(여가 활동)와 6번 주말 닷새를 그대로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">stressful 스트레스가 많은</span><span class=\"why\">‘먹을 걸 구해야 하니 힘들었겠지’라는 상식 함정이에요. 2·4·6번은 일이 적고 쉬는 시간이 많다고 해서 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">systematic 체계적인</span><span class=\"why\">계획을 짜서 체계적으로 일한다는 말은 없어요. 5번 부시맨은 열매가 많으니 심을 필요도 없다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">dangerous 위험한</span><span class=\"why\">사냥의 위험 이야기는 지문에 하나도 없어요. 2~6번은 모두 ‘시간이 남는다’는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">isolated 고립된</span><span class=\"why\">4번에 socializing(사교 활동)할 시간이 많다고 했어요. 혼자 고립된 삶과 반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Compared with farmers,</div><div class=\"k\">농부와 비교하면,</div></div><div class=\"rc\"><div class=\"e\">hunter-gatherers</div><div class=\"k\">수렵채집인은</div></div><div class=\"rc ckc\"><div class=\"e\">led a more <span class=\"cw\">leisurely</span> life.</div><div class=\"k\">더 <span class=\"cw\">여유로운</span> 삶을 살았다. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">농부와 비교하면 수렵채집인은 더 여유로운(leisurely) 삶을 살았다.</div><div class=\"rst\">우리 반 두 친구의 점심 준비를 비교해 봐요. 도시락을 직접 싸는 친구보다 급식 먹는 친구가 훨씬 <b>여유로워요</b>. = 지문 1번, 수렵채집인의 여유로운(leisurely) 삶이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Modern anthropologists</div><div class=\"k\">현대 인류학자들은</div></div><div class=\"rc\"><div class=\"e\">who have spent time with surviving hunter-gatherer groups</div><div class=\"k\">현존하는 수렵채집 집단과 시간을 보내 온</div></div><div class=\"rc\"><div class=\"e\">report</div><div class=\"k\">보고한다</div></div><div class=\"rc\"><div class=\"e\">that gathering food only accounts for a small proportion of their time</div><div class=\"k\">식량을 모으는 일이 그들(= 수렵채집인들)의 시간 중 작은 부분만 차지한다고</div></div><div class=\"rc ckc\"><div class=\"e\">— <span class=\"cw\">far less</span></div><div class=\"k\">— (그 시간은) <span class=\"cw\">훨씬 더 적다</span></div></div><div class=\"rc\"><div class=\"e\">than would be required</div><div class=\"k\">요구될 것(= 시간)보다</div></div><div class=\"rc\"><div class=\"e\">to produce the same quantity of food via farming.</div><div class=\"k\">농사를 통해 같은 양의 식량을 생산하는 데</div></div><div class=\"rnat\">현존하는 수렵채집 집단과 함께 지내 본 현대 인류학자들은, 식량을 모으는 데 드는 시간이 그들 하루의 아주 작은 부분에 불과하며 이는 농사로 같은 양의 식량을 얻는 데 필요한 시간보다 훨씬 적다고 보고한다.</div><div class=\"rst\">급식 친구는 점심 챙기는 데 시간이 거의 안 들어요. 도시락 싸는 시간보다 <b>훨씬 적죠</b>(far less). = 지문 2번, 식량 모으기가 시간의 작은 부분이라는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The !Kung Bushmen of the Kalahari,</div><div class=\"k\">칼라하리의 !Kung 부시맨은</div></div><div class=\"rc\"><div class=\"e\">for example,</div><div class=\"k\">예를 들어</div></div><div class=\"rc\"><div class=\"e\">typically spend twelve to nineteen hours a week collecting food,</div><div class=\"k\">보통 일주일에 열두 시간에서 열아홉 시간을 식량 모으는 데 쓰고</div></div><div class=\"rc\"><div class=\"e\">and the Hazda nomads of Tanzania</div><div class=\"k\">탄자니아의 Hazda 유목민은</div></div><div class=\"rc\"><div class=\"e\">spend less than fourteen hours.</div><div class=\"k\">열네 시간 미만을 쓴다.</div></div><div class=\"rnat\">예를 들어 칼라하리의 !Kung 부시맨은 보통 일주일에 열두 시간에서 열아홉 시간을 식량 채집에 쓰고, 탄자니아의 Hazda 유목민은 열네 시간도 채 쓰지 않는다.</div><div class=\"rst\">실제로 재 보니 급식 친구는 일주일에 몇 시간만 써요. = 지문 3번의 부시맨(주 12~19시간)과 하즈다 유목민(14시간 미만) 숫자예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">That leaves</div><div class=\"k\">그것은(= 식량 채집에 그만큼만 쓴다는 사실) 남겨 준다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a lot of time free</span></div><div class=\"k\"><span class=\"cw\">많은 시간을 자유롭게</span></div></div><div class=\"rc ckc\"><div class=\"e\">for <span class=\"cw\">leisure activities</span>, socializing, and so on.</div><div class=\"k\"><span class=\"cw\">여가 활동</span>, 사교 활동 등을 위해</div></div><div class=\"rnat\">그래서 여가 활동, 사교 활동 등에 쓸 시간이 많이 남는다.</div><div class=\"rst\">그러니 남는 시간에 친구들이랑 놀고 수다 떨어요. = 지문 4번, 여가 활동(leisure activities)과 사교 활동에 쓸 <b>시간이 많이 남는다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">When asked by an anthropologist</div><div class=\"k\">인류학자에게 질문받았을 때</div></div><div class=\"rc\"><div class=\"e\">why his people had not adopted farming,</div><div class=\"k\">왜 자기 부족(= 그 부시맨의 부족)이 농사를 채택하지 않았느냐고</div></div><div class=\"rc\"><div class=\"e\">one Bushman replied,</div><div class=\"k\">한 부시맨은 대답했다</div></div><div class=\"rc\"><div class=\"e\">“Why should we plant,</div><div class=\"k\">“우리가 왜 (씨를) 심어야 하죠,</div></div><div class=\"rc\"><div class=\"e\">when there are so many mongongo nuts in the world?”</div><div class=\"k\">세상에 mongongo 열매가 이렇게 많은데?”</div></div><div class=\"rnat\">왜 당신 부족은 농사를 짓지 않느냐고 인류학자가 묻자, 한 부시맨은 “세상에 몽공고 열매가 이렇게 많은데 왜 우리가 심어야 하죠?”라고 대답했다.</div><div class=\"rst\">“왜 도시락 안 싸?” 하고 물으면 “급식이 이렇게 많이 나오는데 왜 싸?” 해요. = 지문 5번 부시맨의 “열매가 이렇게 많은데 왜 심어요?”예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">In effect,</div><div class=\"k\">사실상,</div></div><div class=\"rc\"><div class=\"e\">hunter-gatherers work two days a week</div><div class=\"k\">수렵채집인은 일주일에 이틀 일하고</div></div><div class=\"rc ckc\"><div class=\"e\">and have <span class=\"cw\">five-day weekends</span>.</div><div class=\"k\"><span class=\"cw\">닷새의 주말</span>을 보낸다.</div></div><div class=\"rnat\">사실상 수렵채집인은 일주일에 이틀 일하고 닷새를 쉬는 셈이다.</div><div class=\"rst\">결국 급식 친구는 이틀만 바쁘고 닷새는 노는 셈이에요. = 지문 6번, 주 이틀 일하고 <b>주말이 닷새</b>. 그래서 빈칸은 여유로운(leisurely)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"compared with\" data-m=\"~와 비교하여\"><b>compared with</b>~와 비교하여</button><button type=\"button\" class=\"wdb\" data-w=\"anthropologist\" data-m=\"인류학자\"><b>anthropologist</b>인류학자</button><button type=\"button\" class=\"wdb\" data-w=\"nomad\" data-m=\"유목민\"><b>nomad</b>유목민</button><button type=\"button\" class=\"wdb\" data-w=\"proportion\" data-m=\"비율\"><b>proportion</b>비율</button><button type=\"button\" class=\"wdb\" data-w=\"adopt\" data-m=\"채택하다\"><b>adopt</b>채택하다</button><button type=\"button\" class=\"wdb\" data-w=\"in effect\" data-m=\"사실상\"><b>in effect</b>사실상</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>15%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>첫 문장</b>이면 뒤의 예시들이 공통으로 말하는 성질이 정답이에요. 금·은·쌀·짐바브웨 달러가 모두 <b>양을 마음대로 못 늘리느냐</b>를 기준으로 비교돼요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">Most importantly, money needs to be <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> in a predictable way.</span></div><p class=\"ko\">무엇보다 중요하게, 돈은 예측 가능한 방식으로 ( ? )해야 한다</p></div><div class=\"ck-via\"><i>▼</i><span>not only A but also B(A뿐만 아니라 B도)의 B 쪽이 돈의 진짜 조건</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">Precious metals have been desirable as money … not only because they have intrinsic beauty but also because they <mark>exist in fixed quantities</mark>.</div><p class=\"ko\">귀금속이 돈으로서 탐나는 것이었던 것은 아름다움 때문만이 아니라 <mark>고정된 양으로 존재하기</mark> 때문이기도 하다.</p></div><div class=\"ck-via\"><i>▼</i><span>‘고정된 양’을 ‘더 만들 수 없다’로 다시 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 같은 말 반복</span><div class=\"en\">… additional precious metals <mark>cannot be produced</mark>, at least not cheaply.</div><p class=\"ko\">추가적인 귀금속은 <mark>생산될 수 없다</mark>, 적어도 값싸게는 안 된다.</p></div><div class=\"ck-via\"><i>▼</i><span>4·5번 쌀은 마음대로 못 늘리지만, 돈은 마음대로 찍어 낼 수 있었어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 반대 사례</span><div class=\"en\">He was able to produce and distribute trillions of new Zimbabwe dollars, which is why they eventually became <mark>more valuable as toilet paper than currency</mark>.</div><p class=\"ko\">그는 수조 단위의 새 짐바브웨 달러를 찍어 유통시킬 수 있었고, 그래서 그 돈은 결국 <mark>화폐로서보다 화장지로서 더 값어치 있게</mark> 되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">scarce 희소한<small>2번 fixed quantities(고정된 양)와 3번 cannot be produced(생산될 수 없다)를 한 단어로 묶어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">divisible 나눌 수 있는</span><span class=\"why\">2번 quantities(양)만 보고 ‘잘게 나눈다’를 떠올리면 걸려요. 지문은 양을 나누는 게 아니라 양을 못 늘린다는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">invested 투자되는</span><span class=\"why\">돈을 어디에 투자하는 장면은 없어요. 6번은 너무 많이 찍어 내서 가치가 떨어진 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">transferred 이전되는</span><span class=\"why\">돈을 옮기거나 넘겨주는 이야기는 없어요. 2~6번은 모두 ‘양을 늘릴 수 있느냐’를 비교해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">deposited 예치되는</span><span class=\"why\">은행에 맡기는 이야기는 지문에 없어요. 짐바브웨 달러가 화장지처럼 된 건 너무 많아서예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Most importantly,</div><div class=\"k\">가장 중요하게는,</div></div><div class=\"rc ckc\"><div class=\"e\">money needs to be <span class=\"cw\">scarce</span></div><div class=\"k\">돈은 <span class=\"cw\">희소해야</span> 한다 ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">in a predictable way.</div><div class=\"k\">예측 가능한 방식으로.</div></div><div class=\"rnat\">무엇보다 중요하게, 돈은 예측 가능한 방식으로 희소해야(scarce) 한다.</div><div class=\"rst\">우리 반에서는 칭찬 스티커가 돈처럼 쓰여요. 이 스티커는 <b>드물어야</b> 값어치가 있어요. = 지문 1번, 돈은 희소해야(scarce) 한다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">Precious metals</div><div class=\"k\">귀금속은</div></div><div class=\"rc\"><div class=\"e\">have been desirable as money</div><div class=\"k\">돈으로서 탐나는 것이었다</div></div><div class=\"rc\"><div class=\"e\">across the millennia</div><div class=\"k\">수천 년에 걸쳐</div></div><div class=\"rc\"><div class=\"e\">not only because they have intrinsic beauty</div><div class=\"k\">그것들(= 귀금속)이 내재적인 아름다움을 지니고 있기 때문만이 아니라</div></div><div class=\"rc ckc\"><div class=\"e\">but also because they <span class=\"cw\">exist in fixed quantities</span>.</div><div class=\"k\"><span class=\"cw\">고정된 양으로 존재하기</span> 때문이기도 하다.</div></div><div class=\"rnat\">귀금속이 수천 년에 걸쳐 화폐로서 탐나는 존재였던 것은 그 자체로 아름답기 때문만이 아니라 고정된 양으로 존재하기 때문이기도 하다.</div><div class=\"rst\">쌤의 금색 스티커가 인기 있는 건 예뻐서만이 아니라 한 달에 <b>정해진 수만</b> 나오기 때문이에요. = 지문 2번, 귀금속은 고정된 양으로 존재해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Gold and silver enter society</div><div class=\"k\">금과 은은 사회에 들어온다</div></div><div class=\"rc\"><div class=\"e\">at the rate</div><div class=\"k\">속도로</div></div><div class=\"rc\"><div class=\"e\">at which they are discovered and mined;</div><div class=\"k\">그것들(= 금과 은)이 발견되고 채굴되는</div></div><div class=\"rc ckc\"><div class=\"e\">additional precious metals <span class=\"cw\">cannot be produced</span>,</div><div class=\"k\">추가적인 귀금속은 <span class=\"cw\">생산될 수 없다</span></div></div><div class=\"rc\"><div class=\"e\">at least not cheaply.</div><div class=\"k\">적어도 값싸게는 안 된다.</div></div><div class=\"rnat\">금과 은은 발견되고 채굴되는 속도만큼만 사회에 들어온다. 추가적인 귀금속은 생산될 수 없으며, 적어도 값싸게는 안 된다.</div><div class=\"rst\">금색 스티커는 쌤이 찾아서 줄 때만 생기고, 우리가 더 만들 수가 없어요. = 지문 3번, 귀금속은 더 생산될 수 없다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Commodities like rice and tobacco</div><div class=\"k\">쌀이나 담배 같은 상품은</div></div><div class=\"rc\"><div class=\"e\">can be grown,</div><div class=\"k\">재배할 수 있지만</div></div><div class=\"rc\"><div class=\"e\">but that still takes time and resources.</div><div class=\"k\">그래도 그것(= 재배하는 일)은 시간과 자원이 든다.</div></div><div class=\"rnat\">쌀이나 담배 같은 상품은 재배할 수 있지만, 그래도 시간과 자원이 든다.</div><div class=\"rst\">손그림 쿠폰은 직접 그릴 수 있지만, 한 장 그리는 데도 시간과 색연필이 들어요. = 지문 4번, 쌀·담배는 재배할 수 있어도 시간과 자원이 든대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">A dictator like Zimbabwe’s Robert Mugabe</div><div class=\"k\">짐바브웨의 Robert Mugabe 같은 독재자도</div></div><div class=\"rc\"><div class=\"e\">could not order the government</div><div class=\"k\">정부에 명령할 수는 없었다</div></div><div class=\"rc\"><div class=\"e\">to produce 100 trillion tons of rice.</div><div class=\"k\">쌀 100조 톤을 생산하라고.</div></div><div class=\"rnat\">짐바브웨의 Robert Mugabe 같은 독재자도 정부에 쌀 100조 톤을 생산하라고 명령할 수는 없었다.</div><div class=\"rst\">반장이라도 “손그림 쿠폰 100조 장 그려 와!” 하고 시킬 수는 없어요. = 지문 5번, 독재자도 쌀 100조 톤은 못 만들었어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">He</div><div class=\"k\">그는(= Mugabe)</div></div><div class=\"rc\"><div class=\"e\">was able to produce and distribute</div><div class=\"k\">생산하고 유통시킬 수는 있었다</div></div><div class=\"rc\"><div class=\"e\">trillions of new Zimbabwe dollars,</div><div class=\"k\">수조 단위의 새 짐바브웨 달러를,</div></div><div class=\"rc\"><div class=\"e\">which is why</div><div class=\"k\">그리고 그것(= 마음대로 찍어 낼 수 있었던 일)이 바로 ~의 이유이다 (→ 그래서)</div></div><div class=\"rc\"><div class=\"e\">they eventually became</div><div class=\"k\">그것들(= 짐바브웨 달러)이 결국 ~이 되었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">more valuable as toilet paper than currency</span>.</div><div class=\"k\"><span class=\"cw\">화폐로서보다 화장지로서 더 값어치 있게</span>.</div></div><div class=\"rnat\">그는 수조 단위의 짐바브웨 달러 신권을 찍어 유통시킬 수는 있었고, 바로 그 때문에 그 돈은 결국 화폐보다 화장지로 쓰이는 편이 더 값어치 있게 되어 버렸다.</div><div class=\"rst\">그런데 반장이 복사기로 스티커를 수조 장 찍어 냈더니 휴지보다 못해졌어요. = 지문 6번, 마구 찍은 짐바브웨 달러예요. 그래서 돈은 <b>희소해야</b> 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"predictable\" data-m=\"예측 가능한\"><b>predictable</b>예측 가능한</button><button type=\"button\" class=\"wdb\" data-w=\"precious metal\" data-m=\"귀금속\"><b>precious metal</b>귀금속</button><button type=\"button\" class=\"wdb\" data-w=\"intrinsic\" data-m=\"내재적인, 본질적인\"><b>intrinsic</b>내재적인, 본질적인</button><button type=\"button\" class=\"wdb\" data-w=\"dictator\" data-m=\"독재자\"><b>dictator</b>독재자</button><button type=\"button\" class=\"wdb\" data-w=\"distribute\" data-m=\"유통시키다, 분배하다\"><b>distribute</b>유통시키다, 분배하다</button><button type=\"button\" class=\"wdb\" data-w=\"currency\" data-m=\"통화, 화폐\"><b>currency</b>통화, 화폐</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 잡고 하나씩 대 보는 문제예요. 화제는 <b>스스로 생각한 진리 ↔ 배우기만 한 지식</b>이에요. 그림·색은 비유일 뿐인데, 그 <b>비유 자체가 주인공</b>이 된 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글의 화제</span><div class=\"en\">The truth that has been <mark>merely learned</mark> sticks to us like an artificial limb, a false tooth, or a nose of wax.</div><p class=\"ko\"><mark>단지 배우기만 한</mark> 진리는 의족이나 틀니, 혹은 밀랍 코처럼 우리에게 붙어 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>①의 ‘스스로 생각한 진리’ ↔ 1번 ‘배운 진리’를 두 사람의 차이로 바꿔요</span></div><div class=\"ck-step\"><span class=\"lab\">②(3번) · 두 사람으로 정리</span><div class=\"en\">On this rests <mark>the distinction between the thinker and the mere scholar</mark>.</div><p class=\"ko\">이것에 <mark>사색가와 한낱 학자 사이의 구별</mark>이 달려 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>②의 두 사람 중 사색가 쪽을 그림에 빗대요</span></div><div class=\"ck-step\"><span class=\"lab\">③(4번) · 사색가 = 아름다운 그림</span><div class=\"en\">The intellectual gain of the thinker who thinks for himself is, therefore, like a beautiful painting …</div><p class=\"ko\">그러므로 스스로 생각하는 사색가의 지적 소득은 아름다운 그림과 같다 …</p></div><div class=\"ck-via\"><i>▼</i><span>사색가·학자가 사라지고 ‘그림의 색’이 주인공인 미술 감상 이야기로 빠짐</span></div><div class=\"ck-step key\"><span class=\"lab\">④(5번) · 이탈 지점</span><div class=\"en\"><mark>Color in painting</mark> is a major influence on our emotions, and therefore plays a huge part in <mark>how we appreciate art</mark>.</div><p class=\"ko\"><mark>그림에서 색은</mark> 우리 감정에 주요한 영향을 미치며, 따라서 <mark>우리가 미술을 감상하는 방식에서</mark> 큰 역할을 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>④를 빼면 ③의 아름다운 그림 → ⑤의 on the other hand(반면에) 팔레트로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(6번) · 다시 제자리</span><div class=\"en\">The intellectual acquisition of <mark>the mere scholar</mark>, <mark>on the other hand</mark>, is like a large palette full of bright colors but without harmony.</div><p class=\"ko\"><mark>반면에</mark> <mark>한낱 학자의</mark> 지적 습득은 밝은 색으로 가득하지만 조화는 없는 커다란 팔레트와 같다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">그림의 색이 감정과 미술 감상에 미치는 영향<small>사색가·학자 비교가 아니라 미술 감상 이야기라 흐름에서 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">사색가의 지적 소득은 아름다운 그림과 같다</span><span class=\"why\">그림이 처음 나와서 ④와 같이 튀어 보이지만, 주어가 the thinker(사색가)의 지적 소득이에요. ②의 두 사람 중 사색가를 빗댄 말이라 화제 안이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">스스로 생각해 얻은 진리는 타고난 팔다리와 같다</span><span class=\"why\">On the other hand(반면에)로 1번 ‘배우기만 한 진리 = 의족’의 반대편을 보여 줘요. 화제의 나머지 반쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">사색가와 한낱 학자를 가르는 차이는 여기에 있다</span><span class=\"why\">On this(이것에)가 1번·①의 두 진리를 받아서, 그 차이를 사색가와 학자의 차이로 정리해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">한낱 학자의 지적 습득은 조화 없는 팔레트와 같다</span><span class=\"why\">on the other hand(반면에)로 ③의 사색가와 짝을 이뤄 학자 쪽을 빗대요. ③과 ⑤가 한 쌍이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The truth</div><div class=\"k\">진리는</div></div><div class=\"rc\"><div class=\"e\">that has been merely learned</div><div class=\"k\">단지 배우기만 한</div></div><div class=\"rc\"><div class=\"e\">sticks to us</div><div class=\"k\">우리에게 붙어 있다</div></div><div class=\"rc\"><div class=\"e\">like an artificial limb, a false tooth, or a nose of wax.</div><div class=\"k\">의족이나 틀니, 혹은 밀랍 코처럼.</div></div><div class=\"rnat\">그저 배우기만 한 진리는 의족이나 틀니, 밀랍으로 만든 코처럼 우리 몸에 겉돌며 붙어 있을 뿐이다.</div><div class=\"rst\">수학 풀이를 답지에서 외우기만 하면, 그 풀이는 내 것이 아니라 붙여 놓은 스티커 같아요. = 지문 1번, <b>배우기만 한 진리</b>는 의족·틀니 같대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">On the other hand,</div><div class=\"k\">반면에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the truth acquired through our own thinking</span></div><div class=\"k\"><span class=\"cw\">우리 자신의 사고를 통해 얻은 진리는</span></div></div><div class=\"rc\"><div class=\"e\">is like the natural limb;</div><div class=\"k\">타고난 팔다리와 같다;</div></div><div class=\"rc\"><div class=\"e\">it alone really belongs to us.</div><div class=\"k\">그것(= 스스로 생각해 얻은 진리)만이 정말로 우리에게 속한다.</div></div><div class=\"rnat\">① 반면에 우리 자신의 사고를 통해 얻은 진리는 타고난 팔다리와 같다. 그것만이 정말로 우리에게 속한다.</div><div class=\"rst\">① <b>반면에</b>(On the other hand) 내가 끙끙대며 직접 푼 풀이는 내 손발처럼 진짜 내 거예요. = 스스로 생각해 얻은 진리는 타고난 팔다리 같아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">On this</div><div class=\"k\">이것(= 앞에서 말한 내용)에</div></div><div class=\"rc\"><div class=\"e\">rests</div><div class=\"k\">달려 있다</div></div><div class=\"rc\"><div class=\"e\">the distinction between the thinker and the mere scholar.</div><div class=\"k\">사색가와 한낱 학자 사이의 구별은.</div></div><div class=\"rnat\">② 사색가와 그저 학문만 쌓은 학자를 가르는 차이는 바로 여기에 있다.</div><div class=\"rst\">② 직접 푸는 친구와 답지만 외우는 친구가 갈리는 게 바로 여기예요. = 지문의 사색가와 한낱 학자의 차이예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">The intellectual gain</div><div class=\"k\">지적 소득은</div></div><div class=\"rc\"><div class=\"e\">of the thinker who thinks for himself</div><div class=\"k\">스스로 생각하는 사색가의</div></div><div class=\"rc\"><div class=\"e\">is, therefore, like a beautiful painting</div><div class=\"k\">그러므로 아름다운 그림과 같다</div></div><div class=\"rc\"><div class=\"e\">that vividly stands out</div><div class=\"k\">생생하게 두드러지는</div></div><div class=\"rc\"><div class=\"e\">with perfect harmony of colors.</div><div class=\"k\">완벽한 색의 조화로.</div></div><div class=\"rnat\">③ 그러므로 스스로 생각하는 사색가의 지적 소득은 완벽한 색의 조화로 생생하게 두드러지는 아름다운 그림과 같다.</div><div class=\"rst\">③ 직접 푼 친구의 공책은 색이 잘 어울리는 그림처럼 깔끔하고 또렷해요. = 사색가의 지적 소득은 아름다운 그림 같대요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Color in painting</span></div><div class=\"k\"><span class=\"cw\">그림에서 색은</span></div></div><div class=\"rc\"><div class=\"e\">is a major influence on our emotions,</div><div class=\"k\">우리 감정에 주요한 영향을 미치며</div></div><div class=\"rc\"><div class=\"e\">and therefore plays a huge part</div><div class=\"k\">따라서 큰 역할을 한다</div></div><div class=\"rc\"><div class=\"e\">in how we appreciate art.</div><div class=\"k\">우리가 미술을 감상하는 방식에서.</div></div><div class=\"rnat\">④ 그림에서 색은 우리 감정에 주요한 영향을 미치며, 따라서 우리가 미술을 감상하는 방식에서 큰 역할을 한다.</div><div class=\"rst\">④ 그런데 갑자기 “그림의 색은 기분을 바꾸고 미술 감상에 중요하다”는 미술 시간 얘기가 나와요. 두 친구가 사라져서 <b>화제에서 튀어요</b>.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The intellectual acquisition</span></div><div class=\"k\"><span class=\"cw\">지적 습득은</span></div></div><div class=\"rc\"><div class=\"e\">of the mere scholar,</div><div class=\"k\">한낱 학자의</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">on the other hand</span>,</div><div class=\"k\"><span class=\"cw\">반면에</span></div></div><div class=\"rc\"><div class=\"e\">is like a large palette</div><div class=\"k\">커다란 팔레트와 같다</div></div><div class=\"rc\"><div class=\"e\">full of bright colors but without harmony.</div><div class=\"k\">밝은 색으로 가득하지만 조화는 없는.</div></div><div class=\"rnat\">⑤ 반면에 한낱 학자의 지적 습득은 밝은 색이 가득하지만 조화가 없는 커다란 팔레트와 같다.</div><div class=\"rst\">⑤ <b>반면에</b> 답지만 외운 친구의 공책은 형광펜 색은 많은데 뒤죽박죽이에요. = 학자의 지식은 조화 없는 팔레트래요. ③과 짝이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"merely\" data-m=\"단지\"><b>merely</b>단지</button><button type=\"button\" class=\"wdb\" data-w=\"artificial limb\" data-m=\"의족, 인공 팔다리\"><b>artificial limb</b>의족, 인공 팔다리</button><button type=\"button\" class=\"wdb\" data-w=\"acquire\" data-m=\"얻다, 습득하다\"><b>acquire</b>얻다, 습득하다</button><button type=\"button\" class=\"wdb\" data-w=\"distinction\" data-m=\"구별, 차이\"><b>distinction</b>구별, 차이</button><button type=\"button\" class=\"wdb\" data-w=\"mere\" data-m=\"한낱 ~에 불과한\"><b>mere</b>한낱 ~에 불과한</button><button type=\"button\" class=\"wdb\" data-w=\"acquisition\" data-m=\"습득, 획득\"><b>acquisition</b>습득, 획득</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>지시어</b>를 잡는 문제예요. <b>their</b>(그들의)가 가리킬 ‘사람 여럿’이 바로 앞에 있고, 바로 뒤 <b>such patients</b>(그러한 환자들)가 ‘뇌가 멈춘 환자’를 받아야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 지시어</span><div class=\"en\">In some cases, <mark>their brains</mark> had <mark>ceased to function altogether</mark>.</div><p class=\"ko\">어떤 경우에는 <mark>그들의 뇌가</mark> <mark>완전히 기능을 멈춘 상태였다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>their(그들의) = 심장은 뛰는데 회복 못 한 사람들</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 앞 문장 (④ 바로 앞)</span><div class=\"en\">Respirators could save many lives, but not all those <mark>whose hearts kept beating</mark> ever recovered any other significant functions.</div><p class=\"ko\">인공호흡기는 많은 생명을 구할 수 있었지만, <mark>심장이 계속 뛰던</mark> 사람들 모두가 그 밖의 중요한 기능을 회복한 것은 아니었다.</p></div><div class=\"ck-via\"><i>▼</i><span>such patients(그러한 환자들) = 주어진 문장의 ‘뇌가 완전히 멈춘 환자들’</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 뒤 문장 (④ 바로 뒤)</span><div class=\"en\">The realization that <mark>such patients</mark> could be a source of organs for transplantation led to the setting up of the Harvard Brain Death Committee …</div><p class=\"ko\"><mark>그러한 환자들</mark>이 이식용 장기의 공급원이 될 수 있다는 깨달음은 하버드 뇌사 위원회의 설립으로 이어졌다 …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>심장은 뛰지만 회복 못 한 사람들</span><span><em>주어진 문장</em>그중 어떤 경우엔 뇌가 완전히 멈춤</span><span><em>6번</em>그런 환자 = 장기 공급원 → 뇌사 위원회</span></div><div class=\"ck-eq\">⇒ 회복 못 함 → 뇌가 멈춤 → 뇌사 기준, 세 고리가 다 맞는 자리 = ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">5번 문장과 6번 문장 사이<small>앞의 ‘심장이 뛰던 사람들’을 their(그들의)로 받고, 뒤의 such patients(그러한 환자들)가 가리킬 대상이 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번 끝에 those who welcomed(반긴 사람들)라는 사람 여럿이 있어 their(그들의)가 붙을 것 같지만, 새 시대를 반긴 사람들의 뇌가 멈췄다는 건 말이 안 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">2번은 환자 한 명의 심장 이식 이야기라 their(그들의)가 가리킬 사람 여럿이 없어요. 3번 The patient’s death(그 환자의 사망)는 2번에 바로 붙어야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">4번 끝은 respirators(인공호흡기) 이야기라 their brains(그들의 뇌)가 받을 사람이 없어요. 회복 못 한 사람들은 5번에서야 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">7번 The recommendation(그 권고)은 6번의 위원회 권고에 바로 붙어야 해요. 또 6번 such patients(그러한 환자들)가 가리킬 대상이 앞에 없어져요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">In some cases,</div><div class=\"k\">어떤 경우에는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">their brains</span></div><div class=\"k\"><span class=\"cw\">그들(= 심장은 계속 뛰던 사람들)의 뇌가</span></div></div><div class=\"rc ckc\"><div class=\"e\">had <span class=\"cw\">ceased to function altogether</span>.</div><div class=\"k\"><span class=\"cw\">완전히 기능을 멈춘 상태였다</span>.</div></div><div class=\"rnat\">【주어진 문장】 어떤 경우에는 그들의 뇌가 완전히 기능을 멈춘 상태였다.</div><div class=\"rst\">〈주어진 문장〉 어떤 경우엔 <b>그들의</b>(their) 뇌가 아예 멈춰 있었대요. 가족과 의학 다큐를 보다 나온 말이에요. = 지문의 뇌가 완전히 기능을 멈춤.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Of all the medical achievements of the 1960s,</div><div class=\"k\">1960년대의 모든 의학적 업적 중에서</div></div><div class=\"rc\"><div class=\"e\">the most widely known</div><div class=\"k\">가장 널리 알려진 것은</div></div><div class=\"rc\"><div class=\"e\">was the first heart transplant,</div><div class=\"k\">최초의 심장 이식이었다,</div></div><div class=\"rc\"><div class=\"e\">performed by the South African surgeon Christiaan Barnard in 1967.</div><div class=\"k\">1967년에 남아프리카공화국의 외과 의사 Christiaan Barnard가 시행한.</div></div><div class=\"rnat\">1960년대의 의학적 업적 가운데 가장 널리 알려진 것은 남아프리카공화국의 외과 의사 Christiaan Barnard가 1967년에 시행한 최초의 심장 이식이었다.</div><div class=\"rst\">다큐는 먼저 1967년 바너드 의사가 처음으로 심장을 옮겨 심은 수술을 보여 줘요. = 지문 2번, 1960년대 가장 유명한 의학 업적이래요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The patient’s death 18 days later</div><div class=\"k\">18일 뒤의 그 환자의 사망은</div></div><div class=\"rc\"><div class=\"e\">did not weaken the spirits</div><div class=\"k\">사기를 꺾지 못했다</div></div><div class=\"rc\"><div class=\"e\">of those who welcomed a new era of medicine.</div><div class=\"k\">새로운 의학 시대를 반긴 사람들의.</div></div><div class=\"rnat\">( ① ) 18일 뒤 그 환자가 사망했지만 그것이 새로운 의학 시대를 반긴 사람들의 사기를 꺾지는 못했다.</div><div class=\"rst\">그 환자는 18일 뒤에 세상을 떠났지만, 사람들은 “새 시대가 왔다”며 기뻐했어요. = 지문 3번, 사기가 꺾이지 않았대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The ability to perform heart transplants</div><div class=\"k\">심장 이식을 시행할 수 있는 능력은</div></div><div class=\"rc\"><div class=\"e\">was linked to</div><div class=\"k\">~와 연결되어 있었다</div></div><div class=\"rc\"><div class=\"e\">the development of respirators,</div><div class=\"k\">인공호흡기의 발달과,</div></div><div class=\"rc\"><div class=\"e\">which had been introduced to hospitals in the 1950s.</div><div class=\"k\">그런데 그것(= 인공호흡기)은 1950년대에 병원에 도입되어 있었다.</div></div><div class=\"rnat\">( ② ) 심장 이식을 시행할 수 있게 된 것은 인공호흡기의 발달과 맞물려 있었는데, 인공호흡기는 이미 1950년대에 병원에 도입되어 있었다.</div><div class=\"rst\">다큐 해설이 “이 수술은 숨을 대신 쉬게 해 주는 기계 덕분이에요”라고 말해요. = 지문 4번, 심장 이식은 인공호흡기의 발달과 연결돼요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Respirators could save many lives,</div><div class=\"k\">인공호흡기는 많은 생명을 구할 수 있었지만,</div></div><div class=\"rc\"><div class=\"e\">but not all those</div><div class=\"k\">그 사람들 모두가 ~한 것은 아니었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">whose hearts kept beating</span></div><div class=\"k\"><span class=\"cw\">심장이 계속 뛰던</span></div></div><div class=\"rc\"><div class=\"e\">ever recovered any other significant functions.</div><div class=\"k\">그 밖의 어떤 중요한 기능이든 회복한 (것은).</div></div><div class=\"rnat\">( ③ ) 인공호흡기는 많은 생명을 구할 수 있었지만, 심장이 계속 뛰던 사람들 모두가 다른 의미 있는 기능까지 회복한 것은 아니었다.</div><div class=\"rst\">그 기계로 많은 사람이 살았지만, <b>심장은 뛰는데</b> 깨어나지 못한 사람들도 있었어요. = 지문 5번, 모두가 다른 기능을 회복한 건 아니래요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">The realization</div><div class=\"k\">깨달음은</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">such patients</span> could be a source of organs for transplantation</div><div class=\"k\"><span class=\"cw\">그러한 환자들</span>(= 뇌 기능이 멈춘 환자들)이 이식용 장기의 공급원이 될 수 있다는</div></div><div class=\"rc\"><div class=\"e\">led to the setting up of the Harvard Brain Death Committee,</div><div class=\"k\">하버드 뇌사 위원회의 설립으로 이어졌다,</div></div><div class=\"rc\"><div class=\"e\">and to its recommendation</div><div class=\"k\">그리고 그 위원회(= Harvard Brain Death Committee)의 권고로</div></div><div class=\"rc\"><div class=\"e\">that the absence of all “discernible central nervous system activity”</div><div class=\"k\">식별 가능한 모든 중추 신경계 활동의 부재가</div></div><div class=\"rc\"><div class=\"e\">should be “a new criterion for death”.</div><div class=\"k\">‘죽음의 새로운 기준’이 되어야 한다는.</div></div><div class=\"rnat\">( ④ ) 그런 환자들이 이식용 장기의 공급원이 될 수 있다는 깨달음은 하버드 뇌사 위원회의 설립으로, 그리고 “식별 가능한 모든 중추 신경계 활동”의 부재가 “죽음의 새로운 기준”이 되어야 한다는 그 위원회의 권고로 이어졌다.</div><div class=\"rst\"><b>그런 환자들</b>(such patients)이 장기를 나눠 줄 수 있다는 걸 알게 되면서 뇌사 위원회가 생겼어요. = 지문 6번, 뇌 활동이 없으면 죽음으로 보자는 권고예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The recommendation</div><div class=\"k\">그 권고는</div></div><div class=\"rc\"><div class=\"e\">has since been adopted,</div><div class=\"k\">그 후로 받아들여졌다,</div></div><div class=\"rc\"><div class=\"e\">with some modifications,</div><div class=\"k\">약간의 수정을 거쳐,</div></div><div class=\"rc\"><div class=\"e\">almost everywhere.</div><div class=\"k\">거의 모든 곳에서.</div></div><div class=\"rnat\">( ⑤ ) 그 권고는 이후 약간의 수정을 거쳐 거의 모든 곳에서 채택되었다.</div><div class=\"rst\">그 뒤로 거의 모든 나라가 이 기준을 조금씩 고쳐서 쓰고 있대요. = 지문 7번, 그 권고가 거의 모든 곳에서 채택됐어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"respirator\" data-m=\"인공호흡기\"><b>respirator</b>인공호흡기</button><button type=\"button\" class=\"wdb\" data-w=\"cease\" data-m=\"멈추다, 그치다\"><b>cease</b>멈추다, 그치다</button><button type=\"button\" class=\"wdb\" data-w=\"altogether\" data-m=\"완전히\"><b>altogether</b>완전히</button><button type=\"button\" class=\"wdb\" data-w=\"realization\" data-m=\"깨달음, 인식\"><b>realization</b>깨달음, 인식</button><button type=\"button\" class=\"wdb\" data-w=\"organ\" data-m=\"장기\"><b>organ</b>장기</button><button type=\"button\" class=\"wdb\" data-w=\"criterion\" data-m=\"기준\"><b>criterion</b>기준</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 제목은 글이 <b>이름 붙여 준 현상</b>과 <b>질문 신호</b>를 잡으세요. 7번이 앞 이야기를 <b>this memory illusion</b>(이 기억 착각)이라 부르고, 8번 How does this happen(어떻게 이런 일이 일어날까)?으로 그 원인을 파고들어요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 실험의 출발</span><div class=\"en\"><mark>I just made up</mark> these names.</div><p class=\"ko\"><mark>나는 방금</mark> 이 이름들을 <mark>지어냈다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>5번 ‘며칠 뒤 유명인 이름 체크’ 상황에서 결과가 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 착각이 일어남</span><div class=\"en\">There is a substantial probability that you will <mark>identify David Stenbill as a well-known person</mark>, <mark>although you will not know</mark> whether you encountered his name …</div><p class=\"ko\">그의 이름을 영화, 스포츠, 정치 중 어디서 접했는지는 <mark>알지 못하겠지만</mark>, 당신이 <mark>David Stenbill을 잘 알려진 사람으로 인식할</mark> 상당한 가능성이 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>6번의 일을 한 단어로 정리: 기억 착각</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 현상에 이름 붙이기</span><div class=\"en\">Larry Jacoby, the psychologist who first demonstrated <mark>this memory illusion</mark> in the laboratory, titled his article “Becoming Famous Overnight”.</div><p class=\"ko\">실험실에서 <mark>이 기억 착각</mark>을 처음으로 보여 준 심리학자 Larry Jacoby는 자신의 논문에 ‘하룻밤 사이에 유명해지기’라는 제목을 붙였다.</p></div><div class=\"ck-via\"><i>▼</i><span>현상을 소개한 뒤, 글의 나머지(9~12번)는 그 원인 설명</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 원인을 묻는 신호</span><div class=\"en\"><mark>How does this happen?</mark></div><p class=\"ko\"><mark>어떻게 이런 일이 일어날까?</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">What Causes the Illusion of Remembering(무엇이 기억한다는 착각을 일으키는가)?<small>7번의 memory illusion(기억 착각)과 8번의 원인 질문을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Useful and Accurate Ways of Identifying People 사람을 알아보는 유용하고 정확한 방법</span><span class=\"why\">[반대] 6번 identify(알아보다)만 따온 함정이에요. 지문은 지어낸 이름을 유명인으로 잘못 알아보는 착각 이야기라 ‘정확한 방법’과 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Strategies for Boosting Memory 기억력을 높이는 전략</span><span class=\"why\">[지문에 없음] 기억력을 키우는 방법은 한 줄도 없어요. 7번은 기억이 우리를 속이는 착각(illusion)을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">How Celebrities Maintain Popularity 유명인이 인기를 유지하는 방법</span><span class=\"why\">[지문에 없음] celebrities(유명인)가 자주 나오지만, 유명인이 인기를 지키는 이야기가 아니라 우리가 이름을 착각하는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Recognize(인식하라), Analyze(분석하라), and Standardize Names(이름을 표준화하라)!</span><span class=\"why\">[지문에 없음] 이름을 분석하거나 표준화하라는 명령은 없어요. 이름은 착각을 보여 주려고 지어낸 예일 뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">David Stenbill, Monica Bigoutski, Shana Tirana.</div><div class=\"k\">David Stenbill, Monica Bigoutski, Shana Tirana. (세 개의 이름)</div></div><div class=\"rnat\">David Stenbill, Monica Bigoutski, Shana Tirana.</div><div class=\"rst\">쉬는 시간에 짝꿍이 공책에 처음 보는 이름 세 개를 적어 보여 줘요. = 지문 1번의 세 이름이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">I just made up</span></div><div class=\"k\"><span class=\"cw\">나는 방금 지어냈다</span></div></div><div class=\"rc\"><div class=\"e\">these names.</div><div class=\"k\">이 이름들을(= 앞의 세 이름)</div></div><div class=\"rnat\">나는 방금 이 이름들을 지어냈다.</div><div class=\"rst\">짝꿍이 “이거 내가 방금 <b>지어낸</b> 이름이야” 해요. = 지문 2번, 글쓴이가 이름을 지어냈다(made up)는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If you encounter any of them</div><div class=\"k\">만약 당신이 그것들(= 지어낸 이름들) 중 어느 하나라도 마주친다면</div></div><div class=\"rc\"><div class=\"e\">within the next few minutes,</div><div class=\"k\">앞으로 몇 분 안에</div></div><div class=\"rc\"><div class=\"e\">you are likely to remember</div><div class=\"k\">당신은 기억할 가능성이 높다</div></div><div class=\"rc\"><div class=\"e\">where you saw them.</div><div class=\"k\">어디서 그것들을 봤는지.</div></div><div class=\"rnat\">앞으로 몇 분 안에 이 이름들 중 어느 하나라도 마주친다면, 당신은 그것을 어디서 봤는지 기억할 가능성이 높다.</div><div class=\"rst\">몇 분 안에 그 이름을 또 보면 “아, 아까 짝꿍 공책!” 하고 바로 떠올라요. = 지문 3번, 어디서 봤는지 기억할 가능성이 높대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">You know,</div><div class=\"k\">당신은 알고 있다,</div></div><div class=\"rc\"><div class=\"e\">and will know for a while,</div><div class=\"k\">그리고 한동안 알고 있을 것이다,</div></div><div class=\"rc\"><div class=\"e\">that these are not the names of minor celebrities.</div><div class=\"k\">이것들(= 이 이름들)이 그리 유명하지 않은 유명인들의 이름이 아니라는 것을.</div></div><div class=\"rnat\">당신은 이 이름들이 그리 유명하지 않은 유명인들의 이름이 아니라는 것을 알고 있고, 한동안은 계속 그렇게 알고 있을 것이다.</div><div class=\"rst\">지금은 그게 연예인 이름이 아니라는 것도 확실히 알아요. = 지문 4번, 덜 유명한 유명인 이름이 아니라는 걸 한동안 안대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">But suppose that</div><div class=\"k\">하지만 가정해 보자</div></div><div class=\"rc\"><div class=\"e\">a few days from now</div><div class=\"k\">지금부터 며칠 뒤에</div></div><div class=\"rc\"><div class=\"e\">you are shown a long list of names,</div><div class=\"k\">당신이 긴 이름 목록을 보게 된다고,</div></div><div class=\"rc\"><div class=\"e\">including those of some minor celebrities</div><div class=\"k\">그리 유명하지 않은 몇몇 유명인들의 그것들(= 이름들)을 포함하여</div></div><div class=\"rc\"><div class=\"e\">and “new” names of people</div><div class=\"k\">그리고 사람들의 ‘새로운’ 이름들</div></div><div class=\"rc\"><div class=\"e\">that you have never heard of;</div><div class=\"k\">당신이 한 번도 들어 본 적 없는;</div></div><div class=\"rc\"><div class=\"e\">your task will be to check every name of a celebrity on the list.</div><div class=\"k\">당신의 할 일은 목록에서 유명인의 이름을 전부 체크하는 것이다.</div></div><div class=\"rnat\">그런데 며칠 뒤 당신에게 긴 이름 목록이 주어진다고 해 보자. 거기에는 그리 유명하지 않은 유명인들의 이름과, 당신이 한 번도 들어 본 적 없는 사람들의 “새로운” 이름이 섞여 있고, 당신이 할 일은 목록에서 유명인의 이름을 전부 체크하는 것이다.</div><div class=\"rst\">그런데 며칠 뒤 쌤이 이름 목록을 주며 “연예인 이름에 다 체크해 봐” 해요. = 지문 5번, 진짜 유명인과 새 이름이 섞인 목록이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">There is a substantial probability</div><div class=\"k\">상당한 가능성이 있다</div></div><div class=\"rc ckc\"><div class=\"e\">that you will <span class=\"cw\">identify David Stenbill as a well-known person</span>,</div><div class=\"k\"><span class=\"cw\">당신이 David Stenbill을 잘 알려진 사람으로 인식할</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">although you will not know</span></div><div class=\"k\"><span class=\"cw\">비록 당신은 알지 못하겠지만</span></div></div><div class=\"rc\"><div class=\"e\">whether you encountered his name</div><div class=\"k\">그(= David Stenbill)의 이름을 접했는지</div></div><div class=\"rc\"><div class=\"e\">in the context of movies, sports, or politics.</div><div class=\"k\">영화, 스포츠, 혹은 정치의 상황에서.</div></div><div class=\"rnat\">당신이 David Stenbill을 잘 알려진 사람으로 지목할 가능성이 상당히 높다. 다만 그 이름을 영화에서 봤는지, 스포츠에서 봤는지, 정치에서 봤는지는 알지 못할 것이다.</div><div class=\"rst\">나도 모르게 짝꿍이 지어낸 이름에 체크해요. 어디서 봤는지는 <b>기억 안 나는데도</b>요. = 지문 6번, 유명인으로 착각한대요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Larry Jacoby,</div><div class=\"k\">Larry Jacoby는,</div></div><div class=\"rc\"><div class=\"e\">the psychologist who first demonstrated</div><div class=\"k\">처음으로 보여 준 심리학자인</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">this memory illusion</span> in the laboratory,</div><div class=\"k\"><span class=\"cw\">이 기억 착각</span>(= 지어낸 이름을 유명인으로 착각하는 현상)을 실험실에서,</div></div><div class=\"rc\"><div class=\"e\">titled his article</div><div class=\"k\">자신(= Larry Jacoby)의 논문에 제목을 붙였다</div></div><div class=\"rc\"><div class=\"e\">“Becoming Famous Overnight”.</div><div class=\"k\">‘하룻밤 사이에 유명해지기’라고.</div></div><div class=\"rnat\">실험실에서 이 기억 착각을 처음으로 보여 준 심리학자 Larry Jacoby는 자신의 논문에 “하룻밤 사이에 유명해지기”라는 제목을 붙였다.</div><div class=\"rst\">이런 걸 <b>기억 착각</b>(memory illusion)이라 불러요. = 지문 7번, 심리학자가 이걸 ‘하룻밤 사이에 유명해지기’라고 했대요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">How does this happen?</span></div><div class=\"k\"><span class=\"cw\">어떻게 이런 일</span>(= 위의 착각)이 일어날까?</div></div><div class=\"rnat\">어떻게 이런 일이 일어날까?</div><div class=\"rst\"><b>왜 이런 일이 생길까요</b>? = 지문 8번, 여기서부터 글이 착각의 원인을 설명해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Start by asking yourself</div><div class=\"k\">스스로에게 물어보는 것으로 시작해 보라</div></div><div class=\"rc\"><div class=\"e\">how you know</div><div class=\"k\">당신이 어떻게 아는지</div></div><div class=\"rc\"><div class=\"e\">whether or not someone is famous.</div><div class=\"k\">누군가가 유명한지 아닌지를.</div></div><div class=\"rnat\">누군가가 유명한지 아닌지를 당신이 어떻게 아는지 스스로에게 물어보는 것에서 시작해 보자.</div><div class=\"rst\">먼저 내가 어떤 연예인을 유명하다고 아는 방법부터 생각해 봐요. = 지문 9번, 유명한지 어떻게 아는지 스스로 물어보래요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">In some cases of truly famous people,</div><div class=\"k\">몇몇 정말로 유명한 사람의 경우에는</div></div><div class=\"rc\"><div class=\"e\">you have a mental file</div><div class=\"k\">당신은 머릿속 파일을 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">with rich information about a person</div><div class=\"k\">한 사람에 대한 풍부한 정보가 담긴</div></div><div class=\"rc\"><div class=\"e\">— think Albert Einstein, Michael Jackson, or Hillary Clinton.</div><div class=\"k\">— Albert Einstein, Michael Jackson, 혹은 Hillary Clinton을 떠올려 보라.</div></div><div class=\"rnat\">몇몇 정말로 유명한 사람의 경우에는, 그 사람에 대한 풍부한 정보가 담긴 머릿속 파일이 있다 — Albert Einstein, Michael Jackson, Hillary Clinton을 떠올려 보라.</div><div class=\"rst\">진짜 유명한 가수는 노래·나이·출연작까지 머릿속에 줄줄 나와요. = 지문 10번, 정보가 가득한 머릿속 파일(mental file)이 있대요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">But you will have no file of information</div><div class=\"k\">하지만 당신은 정보 파일이 전혀 없을 것이다</div></div><div class=\"rc\"><div class=\"e\">about David Stenbill</div><div class=\"k\">David Stenbill에 대한</div></div><div class=\"rc\"><div class=\"e\">if you encounter his name in a few days.</div><div class=\"k\">며칠 뒤에 그의 이름을 접한다면.</div></div><div class=\"rnat\">그러나 며칠 뒤 David Stenbill이라는 이름을 마주친다면 당신에게는 그에 대한 정보 파일이 전혀 없을 것이다.</div><div class=\"rst\">그런데 짝꿍이 지어낸 이름은 아무 정보도 안 떠올라요. = 지문 11번, 그 사람에 대한 정보 파일이 전혀 없대요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">All you will have</div><div class=\"k\">당신이 갖게 될 전부는</div></div><div class=\"rc\"><div class=\"e\">is a sense of familiarity.</div><div class=\"k\">친숙함이라는 느낌뿐이다. ※ 문제지엔 빈칸으로 되어 있음(12번 정답)</div></div><div class=\"rnat\">당신에게 있는 것이라고는 친숙함(familiarity)이라는 느낌뿐이다.</div><div class=\"rst\">남은 건 “어디서 본 것 같은데…” 하는 <b>익숙한 느낌</b>뿐이에요. = 지문 12번, 친숙함(familiarity)이라는 느낌이 착각의 원인이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"made up\" data-m=\"지어냈다 (make up 지어내다)\"><b>made up</b>지어냈다 (make up 지어내다)</button><button type=\"button\" class=\"wdb\" data-w=\"encounter\" data-m=\"마주치다, 접하다\"><b>encounter</b>마주치다, 접하다</button><button type=\"button\" class=\"wdb\" data-w=\"celebrity\" data-m=\"유명 인사\"><b>celebrity</b>유명 인사</button><button type=\"button\" class=\"wdb\" data-w=\"substantial\" data-m=\"상당한\"><b>substantial</b>상당한</button><button type=\"button\" class=\"wdb\" data-w=\"demonstrate\" data-m=\"입증하다, 보여 주다\"><b>demonstrate</b>입증하다, 보여 주다</button><button type=\"button\" class=\"wdb\" data-w=\"illusion\" data-m=\"착각, 환상\"><b>illusion</b>착각, 환상</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 문장은 바로 앞 <b>But</b>(하지만)의 대비로 풀어요. 진짜 유명인은 <b>정보 파일이 있고</b>, 지어낸 이름은 <b>파일이 없어요</b>. 정보 없이 남는 ‘느낌’ 하나를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (12번)</span><div class=\"en\">All you will have is a sense of <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">당신이 갖게 될 전부는 ( ? )이라는 느낌뿐이다</p></div><div class=\"ck-via\"><i>▼</i><span>9번 ‘유명한지 어떻게 아나?’에 대한 첫 번째 답</span></div><div class=\"ck-step\"><span class=\"lab\">10번 문장 · 진짜 유명인</span><div class=\"en\">In some cases of truly famous people, you have <mark>a mental file</mark> with <mark>rich information</mark> about a person …</div><p class=\"ko\">몇몇 정말로 유명한 사람의 경우에는 한 사람에 대한 <mark>풍부한 정보가 담긴</mark> <mark>머릿속 파일을</mark> 가지고 있다 …</p></div><div class=\"ck-via\"><i>▼</i><span>But(하지만)으로 10번과 정반대: 파일이 하나도 없음</span></div><div class=\"ck-step key\"><span class=\"lab\">11번 문장 · 결정적 단서</span><div class=\"en\">But you will have <mark>no file of information</mark> about David Stenbill if you encounter his name in a few days.</div><p class=\"ko\">하지만 며칠 뒤에 그의 이름을 접한다면 당신은 David Stenbill에 대한 <mark>정보 파일이 전혀 없을 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>정보는 없는데 ‘유명한 사람 같다’고 느끼는 장면이 이미 나왔어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 한 번 더 확인</span><div class=\"en\">There is a substantial probability that you will identify David Stenbill as a well-known person, <mark>although you will not know</mark> whether you encountered his name …</div><p class=\"ko\">비록 그 이름을 어디서 접했는지는 <mark>알지 못하겠지만</mark>, 당신이 David Stenbill을 잘 알려진 사람으로 인식할 가능성이 상당하다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">familiarity 친숙함<small>정보 파일은 없는데(11번) 어디서 본 것 같은 느낌만 남아요(6번)</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">belonging 소속감</span><span class=\"why\">a sense of belonging(소속감)이 자주 쓰는 짝이라 걸리기 쉬워요. 지문은 어딘가에 속한 느낌이 아니라, 이름이 ‘본 것 같은’ 느낌 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">predictability 예측 가능성</span><span class=\"why\">앞일을 예측하는 이야기는 없어요. 11번은 정보가 없다는 말이라, 남는 건 예측이 아니라 막연히 익숙한 느낌이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">fairness 공정함</span><span class=\"why\">공정한지 아닌지 따지는 장면은 지문에 하나도 없어요. 10·11번은 머릿속 정보 파일이 있느냐 없느냐만 비교해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">responsibility 책임</span><span class=\"why\">책임 이야기는 없어요. 6번처럼 어디서 봤는지 모르는데도 유명하다고 느끼게 만드는 건 익숙함이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">David Stenbill, Monica Bigoutski, Shana Tirana.</div><div class=\"k\">David Stenbill, Monica Bigoutski, Shana Tirana. (세 개의 이름)</div></div><div class=\"rnat\">David Stenbill, Monica Bigoutski, Shana Tirana.</div><div class=\"rst\">쉬는 시간에 짝꿍이 공책에 처음 보는 이름 세 개를 적어 보여 줘요. = 지문 1번의 세 이름이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">I just made up</div><div class=\"k\">나는 방금 지어냈다</div></div><div class=\"rc\"><div class=\"e\">these names.</div><div class=\"k\">이 이름들을(= 앞의 세 이름)</div></div><div class=\"rnat\">나는 방금 이 이름들을 지어냈다.</div><div class=\"rst\">짝꿍이 “이거 내가 방금 <b>지어낸</b> 이름이야” 해요. = 지문 2번, 글쓴이가 이름을 지어냈다(made up)는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If you encounter any of them</div><div class=\"k\">만약 당신이 그것들(= 지어낸 이름들) 중 어느 하나라도 마주친다면</div></div><div class=\"rc\"><div class=\"e\">within the next few minutes,</div><div class=\"k\">앞으로 몇 분 안에</div></div><div class=\"rc\"><div class=\"e\">you are likely to remember</div><div class=\"k\">당신은 기억할 가능성이 높다</div></div><div class=\"rc\"><div class=\"e\">where you saw them.</div><div class=\"k\">어디서 그것들을 봤는지.</div></div><div class=\"rnat\">앞으로 몇 분 안에 이 이름들 중 어느 하나라도 마주친다면, 당신은 그것을 어디서 봤는지 기억할 가능성이 높다.</div><div class=\"rst\">몇 분 안에 그 이름을 또 보면 “아, 아까 짝꿍 공책!” 하고 바로 떠올라요. = 지문 3번, 어디서 봤는지 기억할 가능성이 높대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">You know,</div><div class=\"k\">당신은 알고 있다,</div></div><div class=\"rc\"><div class=\"e\">and will know for a while,</div><div class=\"k\">그리고 한동안 알고 있을 것이다,</div></div><div class=\"rc\"><div class=\"e\">that these are not the names of minor celebrities.</div><div class=\"k\">이것들(= 이 이름들)이 그리 유명하지 않은 유명인들의 이름이 아니라는 것을.</div></div><div class=\"rnat\">당신은 이 이름들이 그리 유명하지 않은 유명인들의 이름이 아니라는 것을 알고 있고, 한동안은 계속 그렇게 알고 있을 것이다.</div><div class=\"rst\">지금은 그게 연예인 이름이 아니라는 것도 확실히 알아요. = 지문 4번, 덜 유명한 유명인 이름이 아니라는 걸 한동안 안대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">But suppose that</div><div class=\"k\">하지만 가정해 보자</div></div><div class=\"rc\"><div class=\"e\">a few days from now</div><div class=\"k\">지금부터 며칠 뒤에</div></div><div class=\"rc\"><div class=\"e\">you are shown a long list of names,</div><div class=\"k\">당신이 긴 이름 목록을 보게 된다고,</div></div><div class=\"rc\"><div class=\"e\">including those of some minor celebrities</div><div class=\"k\">그리 유명하지 않은 몇몇 유명인들의 그것들(= 이름들)을 포함하여</div></div><div class=\"rc\"><div class=\"e\">and “new” names of people</div><div class=\"k\">그리고 사람들의 ‘새로운’ 이름들</div></div><div class=\"rc\"><div class=\"e\">that you have never heard of;</div><div class=\"k\">당신이 한 번도 들어 본 적 없는;</div></div><div class=\"rc\"><div class=\"e\">your task will be to check every name of a celebrity on the list.</div><div class=\"k\">당신의 할 일은 목록에서 유명인의 이름을 전부 체크하는 것이다.</div></div><div class=\"rnat\">그런데 며칠 뒤 당신에게 긴 이름 목록이 주어진다고 해 보자. 거기에는 그리 유명하지 않은 유명인들의 이름과, 당신이 한 번도 들어 본 적 없는 사람들의 “새로운” 이름이 섞여 있고, 당신이 할 일은 목록에서 유명인의 이름을 전부 체크하는 것이다.</div><div class=\"rst\">그런데 며칠 뒤 쌤이 이름 목록을 주며 “연예인 이름에 다 체크해 봐” 해요. = 지문 5번, 진짜 유명인과 새 이름이 섞인 목록이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">There is a substantial probability</div><div class=\"k\">상당한 가능성이 있다</div></div><div class=\"rc\"><div class=\"e\">that you will identify David Stenbill as a well-known person,</div><div class=\"k\">당신이 David Stenbill을 잘 알려진 사람으로 인식할</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">although you will not know</span></div><div class=\"k\"><span class=\"cw\">비록 당신은 알지 못하겠지만</span></div></div><div class=\"rc\"><div class=\"e\">whether you encountered his name</div><div class=\"k\">그(= David Stenbill)의 이름을 접했는지</div></div><div class=\"rc\"><div class=\"e\">in the context of movies, sports, or politics.</div><div class=\"k\">영화, 스포츠, 혹은 정치의 상황에서.</div></div><div class=\"rnat\">당신이 David Stenbill을 잘 알려진 사람으로 지목할 가능성이 상당히 높다. 다만 그 이름을 영화에서 봤는지, 스포츠에서 봤는지, 정치에서 봤는지는 알지 못할 것이다.</div><div class=\"rst\">나도 모르게 짝꿍이 지어낸 이름에 체크해요. 어디서 봤는지는 <b>기억 안 나는데도</b>요. = 지문 6번, 유명인으로 착각한대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Larry Jacoby,</div><div class=\"k\">Larry Jacoby는,</div></div><div class=\"rc\"><div class=\"e\">the psychologist who first demonstrated</div><div class=\"k\">처음으로 보여 준 심리학자인</div></div><div class=\"rc\"><div class=\"e\">this memory illusion in the laboratory,</div><div class=\"k\">이 기억 착각(= 지어낸 이름을 유명인으로 착각하는 현상)을 실험실에서,</div></div><div class=\"rc\"><div class=\"e\">titled his article</div><div class=\"k\">자신(= Larry Jacoby)의 논문에 제목을 붙였다</div></div><div class=\"rc\"><div class=\"e\">“Becoming Famous Overnight”.</div><div class=\"k\">‘하룻밤 사이에 유명해지기’라고.</div></div><div class=\"rnat\">실험실에서 이 기억 착각을 처음으로 보여 준 심리학자 Larry Jacoby는 자신의 논문에 “하룻밤 사이에 유명해지기”라는 제목을 붙였다.</div><div class=\"rst\">이런 걸 <b>기억 착각</b>(memory illusion)이라 불러요. = 지문 7번, 심리학자가 이걸 ‘하룻밤 사이에 유명해지기’라고 했대요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">How does this happen?</div><div class=\"k\">어떻게 이런 일(= 위의 착각)이 일어날까?</div></div><div class=\"rnat\">어떻게 이런 일이 일어날까?</div><div class=\"rst\"><b>왜 이런 일이 생길까요</b>? = 지문 8번, 여기서부터 글이 착각의 원인을 설명해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Start by asking yourself</div><div class=\"k\">스스로에게 물어보는 것으로 시작해 보라</div></div><div class=\"rc\"><div class=\"e\">how you know</div><div class=\"k\">당신이 어떻게 아는지</div></div><div class=\"rc\"><div class=\"e\">whether or not someone is famous.</div><div class=\"k\">누군가가 유명한지 아닌지를.</div></div><div class=\"rnat\">누군가가 유명한지 아닌지를 당신이 어떻게 아는지 스스로에게 물어보는 것에서 시작해 보자.</div><div class=\"rst\">먼저 내가 어떤 연예인을 유명하다고 아는 방법부터 생각해 봐요. = 지문 9번, 유명한지 어떻게 아는지 스스로 물어보래요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">In some cases of truly famous people,</div><div class=\"k\">몇몇 정말로 유명한 사람의 경우에는</div></div><div class=\"rc ckc\"><div class=\"e\">you have <span class=\"cw\">a mental file</span></div><div class=\"k\">당신은 <span class=\"cw\">머릿속 파일을</span> 가지고 있다</div></div><div class=\"rc ckc\"><div class=\"e\">with <span class=\"cw\">rich information</span> about a person</div><div class=\"k\">한 사람에 대한 <span class=\"cw\">풍부한 정보가 담긴</span></div></div><div class=\"rc\"><div class=\"e\">— think Albert Einstein, Michael Jackson, or Hillary Clinton.</div><div class=\"k\">— Albert Einstein, Michael Jackson, 혹은 Hillary Clinton을 떠올려 보라.</div></div><div class=\"rnat\">몇몇 정말로 유명한 사람의 경우에는, 그 사람에 대한 풍부한 정보가 담긴 머릿속 파일이 있다 — Albert Einstein, Michael Jackson, Hillary Clinton을 떠올려 보라.</div><div class=\"rst\">진짜 유명한 가수는 노래·나이·출연작까지 머릿속에 줄줄 나와요. = 지문 10번, 정보가 가득한 머릿속 파일(mental file)이 있대요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">But you will have <span class=\"cw\">no file of information</span></div><div class=\"k\">하지만 당신은 <span class=\"cw\">정보 파일이 전혀 없을 것이다</span></div></div><div class=\"rc\"><div class=\"e\">about David Stenbill</div><div class=\"k\">David Stenbill에 대한</div></div><div class=\"rc\"><div class=\"e\">if you encounter his name in a few days.</div><div class=\"k\">며칠 뒤에 그의 이름을 접한다면.</div></div><div class=\"rnat\">그러나 며칠 뒤 David Stenbill이라는 이름을 마주친다면 당신에게는 그에 대한 정보 파일이 전혀 없을 것이다.</div><div class=\"rst\">그런데 짝꿍이 지어낸 이름은 아무 정보도 안 떠올라요. = 지문 11번, 그 사람에 대한 정보 파일이 전혀 없대요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><div class=\"rc\"><div class=\"e\">All you will have</div><div class=\"k\">당신이 갖게 될 전부는</div></div><div class=\"rc ckc\"><div class=\"e\">is a sense of <span class=\"cw\">familiarity</span>.</div><div class=\"k\"><span class=\"cw\">친숙함</span>이라는 느낌뿐이다. ※ 문제지엔 빈칸으로 되어 있음(12번 정답)</div></div><div class=\"rnat\">당신에게 있는 것이라고는 친숙함(familiarity)이라는 느낌뿐이다.</div><div class=\"rst\">남은 건 “어디서 본 것 같은데…” 하는 <b>익숙한 느낌</b>뿐이에요. = 지문 12번, 그래서 빈칸은 친숙함(familiarity)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"mental file\" data-m=\"머릿속 정보 파일\"><b>mental file</b>머릿속 정보 파일</button><button type=\"button\" class=\"wdb\" data-w=\"rich\" data-m=\"풍부한\"><b>rich</b>풍부한</button><button type=\"button\" class=\"wdb\" data-w=\"sense of\" data-m=\"~라는 느낌\"><b>sense of</b>~라는 느낌</button><button type=\"button\" class=\"wdb\" data-w=\"familiarity\" data-m=\"친숙함\"><b>familiarity</b>친숙함</button><button type=\"button\" class=\"wdb\" data-w=\"encounter\" data-m=\"마주치다, 접하다\"><b>encounter</b>마주치다, 접하다</button><button type=\"button\" class=\"wdb\" data-w=\"substantial\" data-m=\"상당한\"><b>substantial</b>상당한</button></div>"};
