<!doctype html>

<head>

<title>고2 미니모의고사 21회 01–06번</title>
<style>

header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();

]}], "tr": ["기준점 편향은 초기 정보의 상대적인 질이나 적절성에 관계없이, 여러분이 어떤 상황에서 나중에 도착한 정보에 비해 일찍 도착한 정보에 더 비중을 두는 경향이 있을 때 여러분이 저지르는 인지적 오류를 설명한다.", "여러분이 어떤 상황을 보기 시작할 때 여러분에게 처음에 제시되는 어떤 정보든 '기준점'을 형성할 수 있고, 여러분의 사고 방향을 그 기준점으로부터 멀어지게 바꾸는 것은 합리적으로 그래야 하는 것보다도 크게 더 어려워진다.", "응급 의료에서 기준점 편향의 고전적인 예는 '부상자 분류 편향'인데, 이 경우 여러분이 어떤 환자에 대해 발전시키거나 받는 어떤 첫인상이든 그 환자를 보는 다음 의료 종사자들에게 다 영향을 미치는 경향이 있다.", "예컨대, 가끔 가슴까지 아래로 퍼지는 쑤시는 턱 통증으로 응급 치료를 받으러 오는 환자 둘을 상상해 보라.", "환자를 예진하는 의료 종사자들이 차트를 어떻게 적는가의 차이가 — 가령, '턱 통증' 대 '가슴 통증' — 그 환자들이 어떤 치료를 받는가에 중대한 차이를 낳을지도 모르는 기준점을 만들어 낸다."], "ps": [{"n": 1, "ch": [{"e": "Anchoring bias describes", "k": "<b>기준점 편향<\/b>은 설명한다"}, {"e": "the cognitive error", "k": "<b>인지적 오류<\/b>를"}, {"e": "you make", "k": "여러분이 저지르는"}, {"e": "when you tend to give more weight", "k": "여러분이 더 비중을 두는 경향이 있을 때"}, {"e": "to information arriving early in a situation", "k": "어떤 상황에서 일찍 도착한 정보에"}, {"e": "compared to information arriving later", "k": "나중에 도착한 정보에 비해"}, {"e": "— regardless of the relative quality or relevance", "k": "— 상대적인 질이나 적절성에 관계없이"}, {"e": "of that initial information.", "k": "그 초기 정보의."}], "link": "기준점 편향은, 초기 정보의 상대적인 질이나 적절성에 관계없이, 어떤 상황에서 나중에 도착한 정보에 비해 일찍 도착한 정보에 더 비중을 두는 경향이 있을 때 저지르는 인지적 오류를 설명한다.", "easy": "처음 들어온 정보에 더 무게를 두는 실수를 기준점 편향이라고 해요. 그 처음 정보가 얼마나 좋은지와는 상관이 없어요.", "gist": "글의 핵심 용어인 기준점 편향의 뜻을 알려 주는 문장이에요."}, {"n": 2, "ch": [{"e": "Whatever data is presented to you first", "k": "여러분에게 처음에 제시되는 어떤 정보든"}, {"e": "when you start to look at a situation", "k": "여러분이 어떤 상황을 보기 시작할 때"}, {"e": "can form an “anchor”", "k": "'기준점'을 <b>형성할<\/b> 수 있고"}, {"e": "and it becomes significantly more challenging", "k": "그리고 크게 더 어려워진다"}, {"e": "to alter your mental course", "k": "여러분의 사고 방향을 바꾸는 것이"}, {"e": "away from this anchor", "k": "이 기준점으로부터 멀어지게"}, {"e": "than it logically should be.", "k": "합리적으로 그래야 하는 것보다."}], "link": "여러분이 어떤 상황을 보기 시작할 때 처음에 제시되는 어떤 정보든 '기준점'을 형성할 수 있고, 사고 방향을 그 기준점으로부터 멀어지게 바꾸는 것은 합리적으로 그래야 하는 것보다 크게 더 어려워진다.", "easy": "처음 본 정보가 닻처럼 생각을 y were attacking.", "notes": [["1", "unconscious", "무의식적인"], ["2", "rush", "달려들다"], ["3", "frenzy", "격분, 광란"], ["4", "victor", "승자"], ["5", "firsthand", "직접"]], "lit": "무의식적이고 통제되지 않은 행동으로 시작되었을지도 모르는 것이 / 즉 노래를 부르고 격분해 북을 두드리며 희생자들에게 달려드는 행동이 / 하나의 전략이 되었을 수도 있다 / 승자들이 자기 행동이 공격 대상에게 미치는 효과를 직접 목격하면서", "nat": "무의식적이고 통제되지 않은 행동, 즉 노래하고 격분해 북을 두드리며 적에게 달려드는 행동으로 시작되었을지 모르는 것이, 승자들이 그 효과를 직접 눈으로 확인하면서 하나의 전략으로 자리 잡았을 수 있다.", "ana": "<b>What</b>이 이끄는 명사절이 주어이고 동사는 한참 뒤의 <b>could have become</b>이다. <b>may have p.p.</b>는 '~였을지도 모른다', <b>could have p.p.</b>는 '~였을 수도 있다'로 과거 일에 대한 추측이다. 대시 사이는 앞의 act를 풀어 주는 삽입구이고, the effect와 those 뒤에는 각각 목적격 관계대명사가 생략되어 있다.", "pe": "What may have begun \u0001as an unconscious<sup>1</sup>, uncontrolled act\u0002 / - \u0001rushing<sup>2</sup> their victims with singing and beating drums in a frenzy<sup>3</sup>\u0002 - / could have become a strategy / \u0001as the victors<sup>4</sup> saw firsthand<sup>5</sup> the effect their actions had on those they were attacking\u0002.", "pk": "\u0001무의식적이고 통제되지 않은 행동으로\u0002 시작되었을지도 모르는 것이 / 즉 \u0001노래를 부르고 격분해 북을 두드리며 희생자들에게 달려드는 행동이\u0002 / 하나의 전략이 되었을 수도 있다 / \u0001승자들이 자기 행동이 공격 대상에게 미치는 효과를 직접 목격하면서\u0002", "core": "시작되었을지도 모르는 것이 하나의 전략이 되었을 수도 있다.", "tags": ["<b>주어</b> What절 (명사절): ~했을지도 모르는 것. as ~ act = 전치사구(부사구): begun을 꾸밈 (자격)", "rushing ~ = 현재분사구(동격 삽입): act의 내용을 풀어 줌", "동사 could have become + 보어 a strategy (2형식, 과거에 대한 추측)", "as ~ = 부사절(시간·이유): could have become 수식. 안쪽: the effect (that) their actions had on those ~, 관계절 생략"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어가 What절이라서 동사 could have become이 한참 뒤에 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: What may have begun as an unconscious, uncontrolled act (무의식적이고 통제되지 않은 행동으로 시작되었을지도 모르는 것, 명사절)", "V: could have become (become 되다. could have p.p. = ~했을 수도 있다)", "C: a strategy (전략)", "뼈대 = <b>[What ~] could have become a strategy</b>"]}, {"t": "주어 What절 안쪽이다.", "sub": ["may have begun (begin 시작되다의 과거분사. may have p.p. = ~했을지도 모른다)", "as an unconscious, uncontrolled act = 무의식적이고 통제되지 않은 행동으로 (unconscious 무의식적인, uncontrolled 통제되지 않은, act 행동)"]}, {"t": "대시 사이의 <b>rushing their victims with singing and beating drums in a frenzy</b>는 앞의 act를 풀어 주는 <b>현재분사구(삽입)</b>이다.", "sub": ["rush ~에게 달려들다, victim 희생자", "with singing and beating drums = 노래를 부르고 북을 두드리며", "in a frenzy = 격분하여"]}, {"t": "<b>as the victors saw firsthand the effect ~</b>는 <b>부사절(이유, 시간)</b>이다. 승자들이 직접 목격하면서라는 뜻이다.", "sub": ["S: the victors (승자들)  V: saw (see 보다의 과거형)  O: the effect (효과)  firsthand 직접", "(that) their actions had on those they were attacking = 목적격 관계절(that 생략), effect를 꾸밈. 그들의 행동이 공격하던 사람들에게 미친 (those = 사람들)"]}, {"t": "함정: What절이 길어서 동사가 안 보이지만, may have begun은 What절 안의 동사이고 문장의 동사는 could have become이다."}], "sum": "격분한 돌진이 승자들이 효과를 보며 전략으로 굳어졌을 수 있음"}, {"i": "05", "q": "04", "s": "6", "title": "S+V+O(that절 수동태) + 관계부사 where", "eng": "For many years / archaeologists<sup>1</sup> believed / that pottery<sup>2</sup> was first invented in the Near East<sup>3</sup> (around modern Iran) / where they had found pots dating back to<sup>4</sup> 9,000 B.C.", "notes": [["1", "archaeologist", "고고학자"], ["2", "pottery", "토기, 도자기"], ["3", "Near East", "근동"], ["4", "date back to", "~까지 거슬러 올라가다"]], "lit": "여러 해 동안 / 고고학자들은 믿었다 / 토기가 근동(오늘날의 이란 부근)에서 처음 발명되었다고 / 그곳에서 그들은 기원전 9000년까지 거슬러 올라가는 항아리를 발견했었던 것이다", "nat": "오랫동안 고고학자들은 토기가 근동, 즉 오늘날의 이란 부근에서 처음 만들어졌다고 믿었다. 그곳에서 기원전 9000년까지 거슬러 올라가는 항아리를 발견했기 때문이다.", "ana": "<b>that</b>절 안이 수동태 was invented이고, <b>where</b>는 the Near East를 받는 관계부사이다. <b>had found</b>는 믿었던 시점보다 더 앞선 발견을 나타내는 과거완료이며, <b>dating back to</b>는 pots를 꾸미는 현재분사구이다.", "pe": "\u0001For many years\u0002 / archaeologists<sup>1</sup> believed / that pottery<sup>2</sup> was \u0001first\u0002 invented \u0001in the Near East<sup>3</sup> (around modern Iran)\u0002 / \u0001where they had found pots dating back to<sup>4</sup> 9,000 B.C.\u0002", "pk": "\u0001여러 해 동안\u0002 / 고고학자들은 믿었다 / 토기가 \u0001근동(오늘날의 이란 부근)에서\u0002 \u0001처음\u0002 발명되었다고 / \u0001그곳에서 그들은 기원전 9000년까지 거슬러 올라가는 항아리를 발견했었던 것이다\u0002", "core": "고고학자들은 토기가 발명되었다고 믿었다.", "tags": ["For many years = 전치사구(부사구): believed를 꾸밈 (기간)", "주어 archaeologists + 동사 believed (3형식)", "<b>that절</b> = believed의 목적어(명사절). 안쪽: pottery was invented (수동태). first = 부사: invented 꾸밈 / in the Near East = 부사구: invented 수식", "where ~ = 계속적 관계부사절(형용사절): the Near East 수식. dating back to ~ = 현재분사구: pots 수식"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 that절 뒤에 관계부사 where절이 붙어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: archaeologists (고고학자들)", "V: believed (believe 믿다의 과거형)", "O: that ~ (명사절)", "For many years = 여러 해 동안 (부사구)", "뼈대 = <b>archaeologists believed [that ~]</b>"]}, {"t": "that절 안쪽이다.", "sub": ["S: pottery (토기)  V: was invented (invent 발명하다의 과거분사, 수동태 = 발명되었다)", "first = 처음  in the Near East = 근동에서 (around modern Iran은 오늘날 이란 부근)"]}, {"t": "<b>where they had found pots dating back to 9,000 B.C.</b>는 <b>관계부사절(형용사절)</b>로 the Near East를 꾸민다.", "sub": ["where = in the Near East (그곳에서)", "they = archaeologists  had found (find 발견하다의 과거분사, 과거완료) = 그 전에 발견했었던", "pots dating back to 9,000 B.C. = 기원전 9000년까지 거슬러 올라가는 항아리들 (date back to ~까지 거슬러 올라가다. dating은 pots를 꾸미는 현재분사)"]}, {"t": "함정: 과거완료 had found는 믿었던 시점보다 앞서 발견했다는 뜻이다. 믿은 이유가 where절에 들어 있다."}], "sum": "고고학자들, 항아리가 발견된 근동이 토기의 발상지라고 믿음"}, {"i": "06", "q": "05", "s": "2", "title": "Whatever절 주어 + S+V+O + 가주어 it 병렬 + 비교", "eng": "Whatever data is presented<sup>1</sup> to you first / when you start to look at a situation / can form an \"anchor<sup>2</sup>\" / and it becomes significantly more challenging<sup>3</sup> to alter<sup>4</sup> your mental course away from this anchor / than it logically should be.", "notes": [["1", "present", "제시하다"], ["2", "anchor", "닻, 기준점"], ["3", "challenging", "어려운"], ["4", "alter", "바꾸다"]], "lit": "당신에게 가장 먼저 제시되는 어떤 데이터든 / 당신이 어떤 상황을 살펴보기 시작할 때 / 하나의 '닻'을 형성할 수 있다 / 그리고 그 닻에서 벗어나 생각의 방향을 바꾸는 일이 상당히 더 어려워진다 / 논리적으로 마땅히 그래야 할 정도보다", "nat": "어떤 상황을 살펴보기 시작할 때 가장 먼저 제시된 데이터가 무엇이든 그것이 하나의 '닻'이 될 수 있고, 그러면 그 닻에서 벗어나 생각의 방향을 바꾸는 일이 논리적으로 마땅한 수준보다 훨씬 더 어려워진다.", "ana": "<b>Whatever data</b>가 이끄는 명사절 전체가 주어이고 동사는 <b>can form</b>이다. 뒤 절의 <b>it</b>은 가주어, <b>to alter ~</b>가 진주어이며, more challenging ~ <b>than</b>이 비교 구문을 이룬다.", "pe": "Whatever data is presented<sup>1</sup> \u0001to you first\u0002 / \u0001when you start to look at a situation\u0002 / can form an \"anchor<sup>2</sup>\" / and it becomes \u0001significantly\u0002 more challenging<sup>3</sup> to alter<sup>4</sup> your \u0001mental\u0002 course \u0001away from this anchor\u0002 / \u0001than it logically should be\u0002.", "pk": "\u0001당신에게 가장 먼저\u0002 제시되는 어떤 데이터든 / \u0001당신이 어떤 상황을 살펴보기 시작할 때\u0002 / 하나의 '닻'을 형성할 수 있다 / 그리고 \u0001그 닻에서 벗어나\u0002 생각의 방향을 바꾸는 일이 \u0001상당히\u0002 더 어려워진다 / \u0001논리적으로 마땅히 그래야 할 정도보다\u0002", "core": "어떤 데이터든 닻을 형성할 수 있고, 그 방향을 바꾸는 일이 더 어려워진다.", "tags": ["<b>주어</b> Whatever data is presented (명사절): 어떤 데이터든. to you first = 전치사구·부사: presented 수식", "when ~ = 부사절(시간): can form 수식", "동사 can form + 목적어 an anchor (3형식)", "and: 절 병렬. 가주어 it + becomes + 보어 challenging. significantly = 부사: 비교급 꾸밈. <b>진주어</b> to alter. mental: course 꾸밈. away from ~: alter 꾸밈", "than ~ = 비교 부사절: more challenging 수식"], "steps": [{"t": "이 문장은 <b>두 절이 and로 이어진 문장</b>이다. 앞은 whatever절이 주어인 S+V+O(3형식), 뒤는 가주어 it + S+V+C(2형식)이고 비교 than절까지 붙어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["앞 절  S: Whatever data is presented to you first ~ (당신에게 가장 먼저 제시되는 어떤 데이터든, 명사절)  V: can form (형성하다)  O: an “anchor” (닻)", "뒤 절  S: it (가주어)  V: becomes (become 되다의 3인칭 단수형)  C: more challenging (더 어려운)  진주어: to alter ~", "뼈대 = <b>[Whatever data ~] can form an anchor</b>, and <b>it becomes more challenging [to alter ~]</b>"]}, {"t": "앞 절의 주어 whatever절 안쪽이다.", "sub": ["whatever data = 어떤 데이터든 (복합관계형용사)", "is presented to you first (present 제시하다의 수동태) = 당신에게 먼저 제시되는", "when you start to look at a situation = 부사절(때), is presented를 꾸밈. 상황을 살펴보기 시작할 때"]}, {"t": "뒤 절의 진주어이다.", "sub": ["to alter your mental course away from this anchor = 이 닻에 function sHtmlP(s){
  let x='<div class="s"><div class="sn"><span class="lb">문장 '+s.n+'</span></div>';

function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  if(c.steps&&c.steps.length){x+='<div class="lay th"><div class="hd">이 문장 읽는 순서</div><ol>'+c.steps.map(p=>'<li>'+p.t+(p.sub||[]).map(u=>'<div class="sub">'+u+'</div>').join('')+'</li>').join('')+'</ol></div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}

/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;

    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;

    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};

    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();

function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;

    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);

  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];

    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{

    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;

/* ---- 해설 ---- */

function renderExp(){

/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
