<!doctype html>

<head>

<title>고2 미니모의고사 16회 07–12번</title>
<style>

header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}

h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){

var D=[{"no": "07", "typ": "요약문 완성", "src": "2019년 6월 40번", "evn": [2, 3, 4], "ev_en": "If the norms support openness, friendliness, and mutual respect, the contact has a greater chance of changing attitudes and reducing prejudice than if they do not. / Institutionally supported intergroup contact — that is, contact sanctioned by an outside authority or by established customs — is more likely to produce positive changes than unsupported contact. / Without institutional support, members of an in-group may be reluctant to interact with outsiders because they feel doing so is deviant or simply inappropriate.", "ev_ko": [[2, "그 규범들이 개방성, 친밀함, 그리고 상호 존중을 지지하는 경우에, 그 (집단 간) 접촉은 그것들이 그러지 않는(지지하지 않는) 경우보다 태도를 바꾸고 편견을 줄일 더 큰 가능성을 가진다."], [3, "제도적으로 지지되는 집단 간 접촉은, 즉 외부의 권위나 기존의 관습에 의해 승인된 접촉은 지지되지 않는 접촉보다 긍정적인 변화를 만들어낼 가능성이 더 크다."], [4, "제도적인 지지가 없다면, 내집단의 구성원들은 외부인들과 상호 작용하는 것을 꺼려할 수도 있는데, 왜냐하면 그들(내집단의 구성원들)은 그렇게 하는 것(외부인들과 상호 작용하는 것)이 일탈적이거나 그저 부적절하다고 느끼기 때문이다."]], "why": ["요약문 빈칸 문제는 본문의 핵심이 요약문에서 어떤 말로 바뀌어 쓰였는지 찾습니다", "본문은 집단 간 접촉이 제도적으로 뒷받침될 때 고정 관념을 줄이고 긍정적인 변화를 만든다고 합니다(1·3번)", "2번의 <b>prejudice<\/b>(편견)가 요약문의 <b>bias<\/b>로, 4번의 <b>institutional<\/b>(제도적인)이 <b>organizational<\/b>(조직적인)로 바뀌어 쓰였습니다", "그래서 (A)에는 bias, (B)에는 organizational이 들어갑니다."], "ch": [{"n": "①", "t": "bias ... organizational", "g": "편견 … 조직적인", "ok": true, "e": ["(A) <b>bias<\/b>(편견)는 2번의 prejudice를, (B) <b>organizational<\/b>(조직적인)은 4번의 institutional을 바꿔 쓴 말입니다", "본문 내용과 정확히 일치합니다."]}, {"n": "②", "t": "bias ... individualized", "g": "편견 … 개인화된", "ok": false, "e": ["(A)는 맞지만 (B) <b>individualized<\/b>(개인화된)가 틀립니다", "본문의 지지는 외부 권위나 기존 관습 같은 <b>제도적 지지<\/b>입니다(3번)."]}, {"n": "③", "t": "bias ... financial", "g": "편견 … 재정적인", "ok": false, "e": ["(A)는 맞지만 (B) <b>financial<\/b>(재정적인)이 틀립니다", "본문에는 재정적인 지원 이야기가 나오지 않습니다."]}, {"n": "④", "t": "balance ... organizational", "g": "균형 … 조직적인", "ok": false, "e": ["(B)는 맞지만 (A) <b>balance<\/b>(균형)가 틀립니다", "본문에서 줄어드는 것은 고정 관념과 편견(1·2번)이며 균형이 아닙니다."]}, {"n": "⑤", "t": "balance ... individualized", "g": "균형 … 개인화된", "ok": false, "e": ["(A) <b>balance<\/b>(균형)와 (B) <b>individualized<\/b>(개인화된)가 모두 틀립니다", "본문과 맞는 말은 bias와 organizational입니다."]}], "tr": ["집단 간 접촉은, 만약 그것이 집단 간의 평등을 장려하는 사회적 규범에 의해 뒷받침된다면, 고정 관념 형성을 줄이고 우호적인 태도를 만들어낼 가능성이 더 크다.", "그 규범들이 개방성, 친밀함, 그리고 상호 존중을 지지하는 경우에, 그 (집단 간) 접촉은 그것들이 그러지 않는(지지하지 않는) 경우보다 태도를 바꾸고 편견을 줄일 더 큰 가능성을 가진다.", "제도적으로 지지되는 집단 간 접촉은, 즉 외부의 권위나 기존의 관습에 의해 승인된 접촉은 지지되지 않는 접촉보다 긍정적인 변화를 만들어낼 가능성이 더 크다.", "제도적인 지지가 없다면, 내집단의 구성원들은 외부인들과 상호 작용하는 것을 꺼려할 수도 있는데, 왜냐하면 그들(내집단의 구성원들)은 그렇게 하는 것(외부인들과 상호 작용하는 것)이 일탈적이거나 그저 부적절하다고 느끼기 때문이다.", "그러나 제도적인 지지가 존재한다면, 집단들 사이의 접촉은 적절하고, 기대되며, 그리고 가치 있는 것으로 여겨질 가능성이 더 크다(커진다).", "예를 들어, 초등학교에서의 인종 차별 폐지와 관련해서, 인종 차별 폐지를 반대하기보다 지지했던 교사들(즉, 권위 있는 인물들)에 의해 지도된 수업에서 학생들이 더 많이 동기를 부여받고 더 많이 배웠다는 증거가 있다.", "집단 간 평등을 추구하는 사회적 규범에 의해 뒷받침된다면, 집단 간 접촉은 특히 그것(접촉)이 (B)조직적인 지지에 의해 이끌어질 때, (A)편견을 더 약화시키는 경향이 있다."], "ps": [{"n": 1, "ch": [{"e": "Intergroup contact", "k": "<b>집단 간 접촉<\/b>은"}, {"e": "is more likely to <b>reduce stereotyping<\/b>", "k": "<b>고정 관념 형성을 줄일<\/b> 가능성이 더 크고"}, {"e": "and create <b>favorable attitudes<\/b>", "k": "<b>우호적인 태도<\/b>를 만들어낼"}, {"e": "if it is <b>backed by social norms<\/b>", "k": "그것이<span class=\"r\">(= 집단 간 접촉)<\/span> <b>사회적 규범에 의해 뒷받침된다면<\/b>"}, {"e": "that promote equality among groups.", "k": "집단 간의 평등을 장려하는."}], "easy": "집단끼리 만나는 일은 평등을 장려하는 사회적 규범이 뒷받침해 줄 때, 고정 관념을 줄이고 좋은 태도를 만들 가능성이 더 커요.", "gist": "글의 주장. 규범의 뒷받침이 있을 때 집단 간 접촉의 효과가 커진다고 말한다."}, {"n": 2, "ch": [{"e": "If the norms support", "k": "그 규범들이 지지하는 경우에"}, {"e": "openness, friendliness, and mutual respect,", "k": "개방성, 친밀함, 그리고 상호 존중을,"}, {"e": "the contact has a greater chance", "k": "그 접촉은 더 큰 가능성을 가진다"}, {"e": "of changing attitudes and reducing <b>prejudice<\/b>", "k": "태도를 바꾸고 <b>편견<\/b>을 줄일"}, {"e": "than if they do not.", "k": "그것들이<span class=\"r\">(= 그 규범들)<\/span> 그러지 않는(지지하지 않는) 경우보다."}], "easy": "규범이 개방성·친밀함·상호 존중을 지지하면, 지지하지 않을 때보다 태도가 바뀌고 편견이 줄어들 가능성이 더 커요.", " ict<\/b> with other rights.", "k": "다른 권리와 <b>충돌할<\/b>."}], "easy": "잊힐 권리를 지지하는 이유가 있어도, 이 권리는 때때로 다른 권리와 충돌할 수 있어요.", "gist": "(C)의 첫 문장. the reason for supporting the right to be forgotten은 (A)에서 말한 이유에 해당하므로 (A) 다음에 (C)가 온다."}, {"n": 8, "ch": [{"e": "<b>For example<\/b>,", "k": "<b>예를 들어<\/b>,"}, {"e": "formal exceptions are sometimes made", "k": "공식적인 예외가 때때로 만들어진다"}, {"e": "for security or public health reasons.", "k": "안보 혹은 공공 보건의 이유로."}], "easy": "예를 들어 안보나 공공 보건 같은 이유로, 공식적인 예외가 만들어질 때도 있어요.", "gist": "(C)의 예시. 다른 권리와 충돌하는 경우를 하나 보여 준다."}]}, {"no": "10", "typ": "장문 · 글의 순서", "src": "2017년 11월 43번", "evn": [5, 8, 10], "ev_en": "(B) When they arrived there, the farmer tied one end of the rope to the car and the other to the donkey and began to shout, “Pull John! Pull Steve! Pull Mike! Pull Warrick!” / (C) When he was just going to move off to get into his car, Justin stopped, turned to the old man, and asked, “Tell me, sir, why did you have to call on all those names before giving Old Warrick the instruction to pull the car out of the ditch?” / (D) The farmer then led him to the barn at the back.", "ev_ko": [[5, "(B) 그들이 그곳에 도착했을 때, 농부는 밧줄의 한 쪽 끝은 차에 그리고 다른 쪽은 당나귀에 묶었고 \"당겨 John! 당겨 Steve! 당겨 Mike! 당겨 Warrick!\"이라고 소리치기 시작했다."], [8, "(C) 그가 차에 타기 위해 막 떠나려고 할 때, Justin은 멈춰서 노인을 돌아보며, \"어르신, 말씀해 주세요. Old Warrick에게 도랑에서 차를 끌어내라고 지시하기 전에, 왜 그 모든 이름들을 불러야만 했나요?\"라고 물었다."], [10, "(D) 그러고 나서, 그 농부는 그를 뒷쪽의 헛간으로 데리고 갔다."]], "why": ["(A)는 농부가 <b>Old Warrick이 자네를 꺼내 줄 것이라네<\/b>라고 말하며 끝납니다", "(D)는 <b>The farmer then led him to the barn<\/b>으로 시작해 농부가 Justin을 헛간으로 데려가고, 거기서 농부의 당나귀(<b>his donkey<\/b>)가 처음 소개됩니다", "(B)에서는 농부가 밧줄을 차와 당나귀에 묶고 <b>Pull Warrick!<\/b>이라고 외치자 당나귀가 차를 도랑에서 빼냅니다", "(C)에서 Justin은 <b>왜 그 모든 이름들을 불러야 했나요<\/b>라고 묻는데, 이 이름들은 (B)에서 농부가 외친 이름들입니다", "그래서 (D)–(B)–(C) 순서입니다."], "ch": [{"n": "①", "t": "(B) – (D) – (C)", "g": "", "ok": false, "e": ["(B)에는 <b>the donkey<\/b>가 나오는데, (A)에는 당나귀가 나오지 않고 (D)에서 <b>his donkey<\/b>가 처음 소개됩니다", "그래서 (D)가 (B)보다 먼저 와야 합니 function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

사절: 주절 꾸밈. be going to + 동사 = 막 ~하려 함", "Justin stopped, turned: <b>동사 3개 병렬</b>. to the old man = 전치사구(부사구): turned 꾸밈, 거의 필수에 가까운 부사구(turn to) [기준: 모양 규칙]", "and asked + 직접화법 인용문(목적어). 인용문 안: why did you have to call on ~ (의문사 의문문)"], "steps": [{"t": "이 문장은 <b>부사절 + S + V1, V2, and V3(+인용문)</b>이다. 동사가 셋 이어지고 인용문이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Justin (사람 이름)", "V1: stopped (stop 멈추다의 과거형)", "V2: turned (turn 돌아서다의 과거형)", "V3: asked (ask 묻다의 과거형)", "뼈대 = <b>Justin stopped, turned, and asked</b>"]}, {"t": "<b>to the old man</b> (노인을 향해)은 turn to 짝이라 turned와 거의 필수에 가까운 부사구이다. (문형 기준)"}, {"t": "맨 앞 <b>When he was just going to move off to get into his car</b>는 <b>시간 부사절</b>이다. '그가 막 차에 타려고 움직이려던 때'라는 뜻이다.", "sub": ["be going to V = 막 ~하려 하다, get into = ~에 타다, move off = 떠나다", "to get into his car (차에 타려고)는 move off의 목적을 나타내는 to부정사이다.", "just (막)는 going to를 꾸미는 부사이다."]}, {"t": "asked의 목적어는 따옴표 안 질문이다. 뼈대는 <b>why did you have to call on all those names</b> (왜 그 모든 이름을 부르셔야 했나요)이다.", "sub": ["call on = 부르다, 호소하다, have to = ~해야 하다"]}], "sum": "Justin, 막 떠나려다 멈춰 노인에게 왜 이름을 불렀는지 물음"}, {"i": "07", "q": "10", "s": "D-3", "title": "there 구문 + 세미콜론으로 병렬", "eng": "There was no other choice; / there was just this octogenarian<sup>1</sup> and his equally old donkey.", "notes": [["1", "octogenarian", "80대 노인"]], "lit": "다른 선택은 없었다; / 그저 이 80대 노인과 그와 똑같이 늙은 당나귀가 있을 뿐이었다.", "nat": "다른 선택의 여지가 없었다. 그저 이 80대 노인과 그만큼이나 늙은 당나귀뿐이었다.", "ana": "세미콜론(;)으로 두 개의 독립된 절이 연결되어, 앞 내용을 구체적으로 부연한다.", "pe": "There was no \u0001other\u0002 choice; / there was \u0001just\u0002 this octogenarian<sup>1</sup> and his \u0001equally old\u0002 donkey.", "pk": "\u0001다른\u0002 선택은 없었다; / \u0001그저\u0002 이 80대 노인과 \u0001그와 똑같이 늙은\u0002 당나귀가 있을 뿐이었다.", "core": "선택이 없었다. 노인과 당나귀가 있었다.", "tags": ["There was no choice: there 구문 (1형식 SV, 주어는 choice). other = 형용사: choice 꾸밈", "there was this octogenarian and his donkey: there 구문, 주어 병렬. just = 부사: 주어 꾸밈. equally old = 형용사구: donkey 꾸밈"], "steps": [{"t": "이 문장은 <b>there 구문 두 개</b>가 세미콜론(;)으로 이어진 문장이다. 같은 구조가 반복된다."}, {"t": "첫 번째 절의 뼈대부터 찾는다.", "sub": ["V: was (be ~이 있다)", "S: no other choice (진짜 주어, 다른 선택 하나도 없음)", "뼈대 = <b>There was no other choice</b>", "other (다른)는 choice를 꾸미는 형용사이다."]}, {"t": "세미콜론 뒤도 there 구문이다. 진짜 주어는 <b>this octogenarian and his equally old donkey</b> (이 80대 노인과 그와 똑같이 늙은 당나귀)이다.", "sub": ["octogenarian = 80대 사람, donkey = 당나귀", "주어가 and로 병렬되어 있다. just (그저)는 주어를 꾸미는 부사이다."]}, {"t": "<b>equally old</b> (똑같이 늙은)는 형용사구로 donkey를 꾸민다.", "sub": ["equally = 똑같이"]}, {"t": "세미콜론은 앞 절 내용을 뒤 절에서 풀어 주는 표시이다. 앞은 '선택이 없었다', 뒤는 '있는 것은 이 둘뿐이다'이다."}], "sum": "다른 선택은 없고 노인과 늙은 당나귀뿐"}, {"i": "08", "q": "10", "s": "D-4", "title": "S+V+O 문장 + 대시 삽입", "eng": "The farmer — with the donkey, a rope, and Justin — / made his way slowly to the stranded<sup>1</sup> vehicle.", "notes": [["1", "stranded", "오도가도 못하는"]], "lit": "농부는 — 당나귀와 밧줄, 그리고 Justin과 함께 — / 오도 가도 못하는 차량 쪽으로 천천히 나아갔다.", "nat": "농부는 당나귀와 밧줄, 그리고 Justin과 함께 오도 가도 못하는 차량을 향해 천천히 나아갔다.", "ana": "대시(—~—) 사이에 동반 대상을 나열하는 삽입구가 들어가 있다.", "pe": "The farmer — \u0001with the donkey, a rope, and Justin\u0002 — / made his way \u0001slowly\u0002 \u0001to the stranded<sup>1</sup> vehicle\u0002.", "pk": "농부는 — \u0001당나귀와 밧줄, 그리고 Justin과 함께\u0002 — / \u0001오도 가도 못하는 차량 쪽으로\u0002 \u0001천천히\u0002 나아갔다.", "core": "농부는 나아갔다.", "tags": ["The farmer = 주어. 대시 사이 with ~ = 전치사구(형용사구): farmer 꾸밈 (삽입)", "made his way: <b>make one's way</b> = 나아가다. slowly = 부사: made 꾸밈. to the vehicle = 전치사구(부사구): made 꾸밈, 거의 필수에 가까운 부사구(방향)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 주어 뒤에 대시(—)로 삽입구가 끼어 있어 동사가 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The farmer (농부)", "V: made (make의 과거형, make one's way = 나아가다)", "O: his way (자신의 길)", "뼈대 = <b>The farmer made his way</b>", "make one's way는 '나아가다'라는 숙어이다."]}, {"t": "대시 사이의 <b>with the donkey, a rope, and Justin</b>은 <b>전치사구(형용사구)</b>로 The farmer를 꾸민다. '당나귀와 밧줄, 그리고 Justin과 함께'라는 뜻이다. 삽입이라서 빼고 읽으면 뼈대가 보인다.", "sub": ["rope = 밧줄"]}, {"t": "<b>slowly</b> (천천히)는 made his way를 꾸미는 부사이다."}, {"t": "<b>to the stranded vehicle</b> (오도 가도 못하는 차량 쪽으로)은 방향을 나타내는 전치사구로 made his way와 거의 필수에 가까운 부사구이다. (문형 기준)", "sub": ["stranded = 오도 가도 못하는, vehicle = 차량"]}], "sum": "농부, 당나귀·밧줄·Justin과 함께 차량 쪽으로 천천히 이동"}], "qs": [{"q": "07", "type": "요약", "src": "2019년 6월 40번", "ans": "①", "tr": [["1", "집단 간 접촉은 그것이 집단 간 평등을 증진하는 사회적 규범에 의해 뒷받침될 때 고정관념을 줄이고 호의적인 태도를 만들어낼 가능성이 더 크다."], ["2", "만약 그 규범이 개방성, 우호성, 상호 존중을 지지한다면, 그 접촉은 그렇지 않을 때보다 태도를 변화시키고 편견을 줄일 가능성이 더 크다."], ["3", "제도적으로 뒷받침되는 집단 간 접촉 — 즉, 외부 권위나 확립된 관습에 의해 승인된 접촉 — 은 뒷받침되지 않는 접촉보다 긍정적인 변화를 만들어낼 가능성이 더 크다."], ["4", "제도적 지원이 없으면, 내집단 구성원들은 그렇게 하는 것이 일탈적이거나 그저 부적절하다고 느끼기 때문에 외부인과 교류하기를 꺼릴 수 있다."], ["5", "그러나 제도적 지원이 있으면, 집단 간 접촉은 적절하고, 예상되며, 가치 있는 것으로 여겨질 가능성이 더 크다."], ["6", "예를 들어, 초등학교의 인종 차별 폐지와 관련해서, 인종 차별 폐지를 반대하기보다 지지한 교사(즉, 권위자)가 진행한 수업에서 학생들이 더 큰 동기를 가지고 더 많이 배웠다는 증거가 있다."]], "evh": "1번 문장", "ev": [{"en": true, "h": "Intergroup contact is more likely to reduce stereotyping and create favorable attitudes if it is backed by social norms that promote equality among groups."}, {"en": false, "h": "사회적 규범의 뒷받침이 집단 간 접촉의 고정관념 감소 효과를 높인다는 것이 요약문 (A)=bias(편견), (B)=organizational(제도적)의 근거이다."}], "opts": [{"n": "①", "t": "bias ... organizational", "a": true, "x": false, "trap": false, "e": "제도적 지원이 있을 때 집단 간 접촉이 편견을 더 약화시킨다는 내용과 정확히 일치한다."}, {"n": "②", "t": "bias ... individualized", "a": false, "x": true, "trap": false, "e": "개인화된 지원이 아니라 제도적(organizational) 지원이 핵심이다."}, {"n": "③", "t": "bias ... financial", "a": false, "x": true, "trap": false, "e": "재정적 지원에 대한 언급은 본문에 없다."}, {"n": "④", "t": "balance ... organizational", "a": false, "x": true, "trap": true, "e": "빈칸 (A)는 '균형'이 아니라 '고정관념/편견'이 약화되는 것이 맞다 — 가장 많이 걸리는 오답."}, {"n": "⑤", "t": "balance ... individualized", "a": false, "x": true, "trap": false, "e": "위와 같은 이유로 (A), (B) 모두 부적절하다."}], "w": [["stereotyping", "고정관념 형성"], ["institutionally", "제도적으로"], ["in-group", "내집단"], ["desegregation", "인종 차별 폐지"]]}, {"q": "08", "type": "문장삽입", "src": "2022년 6월 38번", "ans": "④", "tr": [["1", "온도를 측정하는 한 가지 방법은 물체가 눈에 띄게 빛날 만큼 뜨거울 때 일어나는데, 불 속에 놓아둔 쇠 부지깽이가 그 예이다."], ["2", "( ① ) 빛나는 물체의 색깔은 그것의 온도와 관련이 있다: 온도가 오를수록, 물체는 처음엔 빨간색이었다가 주황색이 되고, 마침내 흰색이 되는데, 이것이 '가장 뜨거운' 색이다."], ["3", "( ② ) 온도와 빛나는 물체의 색깔 사이의 관계는 천문학자들에게 유용하다."], ["4", "( ③ ) 별의 색깔은 그것의 온도와 관련이 있으며, 사람들이 아직 그 먼 거리를 별까지 여행해서 더 정확한 방식으로 온도를 측정할 수 없기 때문에, 천문학자들은 그 색깔에 의존한다."], ["5", "( ④ ) 별의 내부는 훨씬 더 높은 온도이지만, 그것은 숨겨져 있다."], ["6", "( ⑤ ) 그러나 별의 색깔로부터 얻은 정보는 여전히 유용하다."], ["7", "[주어진 문장] 이 온도는 별의 표면, 즉 눈에 보이는 빛을 방출하고 있는 별의 부분의 온도이다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "The color of stars is related to their temperature ... astronomers rely on their color. (④) The interior of the star is at a much higher temperature, though it is concealed."}, {"en": false, "h": "주어진 문장은 '이 온도'가 별의 '표면' 온도임을 밝힌다. 색깔로 알아낸 온도(표면 온도)를 설명한 직후, 이와 대비되는 '내부는 훨씬 높은 온도'라는 내용 바로 앞인 ④ 자리에 들어가야 자연스럽다."}], "opts": [{"n": "①", "t": "①", "a": false, "x": true, "trap": false, "e": "아직 온도-색깔의 기본 관계를 설명하는 도입부라 '표면' 개념이 등장할 위치가 아니다."}, {"n": "②", "t": "②", "a": false, "x": true, "trap": false, "e": "천문학자에게 유용하다는 문장 앞뒤로 아직 구체적 원리 설명이 이어지는 중이다."}, {"n": "③", "t": "③", "a": false, "x": true, "trap": false, "e": "별의 색깔과 온도의 관계가 막 설명되는 지점으로 '표면'이라는 구체화가 아직 이르다."}, {"n": "④", "t": "④", "a": true, "x": false, "trap": false, "e": "색깔로 알아낸 온도가 '표면' 온도임을 밝힌 뒤, 이와 대비되는 '내부는 그보다 훨씬 뜨겁다'는 내용으로 자연스럽게 이어진다."}, {"n": "⑤", "t": "⑤", "a": false, "x": true, "trap": true, "e": "이미 내부 온도 이야기가 나온 뒤이므로 이 자리에 들어가면 '이 온도'가 가리키는 대상이 모호해진다 — 가장 많이 걸리는 오답."}], "w": [["emit", "방출하다"], ["be related to", "관련이 있다"], ["astronomer", "천문학자"], ["interior", "내부"]]}, {"q": "09", "type": "순서배열", "src": "2022년 11월 36번", "ans": "②", "tr": [["1", "잊힐 권리는 사생활 보호권과는 구별되지만 관련이 있는 권리이다."], ["2", "사생활 보호권은, 무엇보다도, 전통적으로 보호되거나 개인적인 것으로 여겨지는 정보가 공개되지 않을 권리이다."], ["3", "(A) 그러한 권리의 한 가지 동기는 개인들이 특정 사건이나 시기에 의해 규정되지 않고 자신의 삶을 살아갈 수 있게 하는 것이다. 예를 들어, 영국과 프랑스 같은 몇몇 나라들에서는 심지어 과거의 전과조차도 결국 '효력을 다해야' 하며 한 사람의 삶에 계속 영향을 미 }

  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';
  app.innerHTML=h;
}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
