function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">목적 문제는 앞의 사정 설명보다 <b>appeal to</b>(~에 호소하다)처럼 <b>부탁·요구가 나오는 문장</b>을 찾으세요. 1번의 매립지 계획을 7번에서 <b>abandoned</b>(포기되다)해 달라고 하는 게 이 글의 목적이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 무슨 계획인가</span><div class=\"en\">A plan was announced <mark>to install a new 400-acre landfill</mark> at Corcolle.</div><p class=\"ko\">Corcolle에 <mark>새로운 400에이커 규모의 쓰레기 매립지를 설치하려는</mark> 계획이 발표되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>매립지 바로 옆에 지켜야 할 유적지가 있다고 걱정을 꺼내요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 왜 문제인가</span><div class=\"en\">… we note that <mark>Hadrian’s Villa is only a short distance</mark> from the proposed landfill.</div><p class=\"ko\">… 우리는 Hadrian’s Villa가 제안된 쓰레기 매립지로부터 <mark>불과 얼마 안 되는 거리에 있다는 것에</mark> 주목하고 있습니다.</p></div><div class=\"ck-via\"><i>▼</i><span>걱정을 늘어놓은 뒤, appeal to(~에 호소하다)로 진짜 용건을 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\"><mark>We appeal to the Ministry of the Environment</mark> to announce immediately that the proposed project for a landfill at Corcolle <mark>will once and for all be abandoned</mark> to protect Hadrian’s Villa.</div><p class=\"ko\">우리는 Hadrian’s Villa를 보호하기 위해 Corcolle에 제안된 쓰레기 매립지 프로젝트가 <mark>최종적으로 포기될 것이라고</mark> 즉시 발표해 줄 것을 <mark>Ministry of the Environment(환경부)에 호소합니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">문화유산 주변 매립지 건설 계획 철회를 촉구하려고<small>7번 appeal to(호소하다) + abandoned(포기되다) = 계획 철회 촉구예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">유적지의 UNESCO 문화유산 지정을 요청하려고</span><span class=\"why\">[지문에 없음] 4번에서 UNESCO World Heritage Site(유네스코 세계 문화유산)는 이미 지정된 곳이라고 소개할 뿐이에요. 새로 지정해 달라는 말이 아니라 7번에서 매립지 포기를 요구해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">정부의 관광산업 육성 정책을 비판하려고</span><span class=\"why\">[지문에 없음] 4번 tourists(관광객들)는 유적지가 얼마나 소중한지 보여 주는 말일 뿐이에요. 관광 정책을 비판하는 문장은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">유적지 복원을 위한 모금 활동을 홍보하려고</span><span class=\"why\">[지문에 없음] 돈을 모으거나 유적지를 고친다는 말은 한 번도 안 나와요. 7번의 부탁은 환경부가 매립지 계획을 포기하라는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">지역 관광단지 개발에 대한 투자를 권유하려고</span><span class=\"why\">[반대] 글쓴이는 Corcolle(코르콜레) 개발을 막으려는 쪽이에요. 2번에서 지켜야 할 가치가 큰 곳이라고 했지, 투자하라는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">A plan was announced</div><div class=\"k\">계획이 발표되었다</div></div><div class=\"rc\"><div class=\"e\">to install a new 400-acre landfill</div><div class=\"k\">새로운 400에이커 규모의 쓰레기 매립지를 설치하려는</div></div><div class=\"rc\"><div class=\"e\">at Corcolle.</div><div class=\"k\">Corcolle에.</div></div><div class=\"rnat\">Corcolle에 새로운 400에이커 규모의 쓰레기 매립지를 설치하려는 계획이 발표되었다.</div><div class=\"rst\">우리 학교 바로 옆에 커다란 쓰레기장을 짓는다는 소식이 왔다고 해 봐요. = 지문 1번, 코르콜레(Corcolle)에 큰 <b>쓰레기 매립지</b>를 짓는 계획이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Corcolle is an area</div><div class=\"k\">Corcolle은 지역이다</div></div><div class=\"rc\"><div class=\"e\">of immense cultural and natural value</div><div class=\"k\">엄청난 문화적 및 자연적 가치가 있는</div></div><div class=\"rc\"><div class=\"e\">not only for Italy but for all of humanity.</div><div class=\"k\">이탈리아뿐 아니라 전 인류에게도.</div></div><div class=\"rnat\">Corcolle은 이탈리아뿐 아니라 전 인류에게도 엄청난 문화적 및 자연적 가치가 있는 지역이다.</div><div class=\"rst\">그 동네는 우리만이 아니라 모두가 아끼는 소중한 곳이에요. 지문 2번도 이탈리아뿐 아니라 전 인류에게 가치가 크다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">To speak only of the most obvious site</div><div class=\"k\">가장 분명한 장소에 대해서만 말하자면</div></div><div class=\"rc\"><div class=\"e\">that requires our watchful and eternal protection,</div><div class=\"k\">우리의 주의 깊고 영원한 보호를 필요로 하는,</div></div><div class=\"rc ckc\"><div class=\"e\">we note that <span class=\"cw\">Hadrian’s Villa is only a short distance</span></div><div class=\"k\">우리는 <span class=\"cw\">Hadrian’s Villa가 불과 얼마 안 되는 거리에 있다는 것에</span> 주목하고 있습니다</div></div><div class=\"rc\"><div class=\"e\">from the proposed landfill.</div><div class=\"k\">제안된 쓰레기 매립지로부터.</div></div><div class=\"rnat\">우리의 주의 깊고 영원한 보호가 필요한 가장 분명한 장소만 말하더라도, Hadrian's Villa는 제안된 매립지로부터 불과 얼마 떨어지지 않은 곳에 있다는 점에 주목한다.</div><div class=\"rst\">학교 옆에는 100년 된 옛 건물이 있어서 꼭 지켜야 해요. 지문 3번도 지켜야 할 유적지가 매립지와 <b>아주 가깝다</b>고 짚어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This unique UNESCO World Heritage Site</div><div class=\"k\">이 독특한 유네스코 세계 문화유산 보호지역(= Hadrian’s Villa)은</div></div><div class=\"rc\"><div class=\"e\">is visited each year</div><div class=\"k\">매년 방문 받습니다</div></div><div class=\"rc\"><div class=\"e\">by hundreds of thousands of tourists</div><div class=\"k\">수십만 명의 관광객들에 의해</div></div><div class=\"rc\"><div class=\"e\">from around the world.</div><div class=\"k\">전 세계에서 온.</div></div><div class=\"rnat\">이 독보적인 유네스코 세계 문화유산은 매년 전 세계 수십만 명의 관광객이 방문한다.</div><div class=\"rst\">그 건물을 보러 해마다 다른 나라 사람들도 많이 와요. 지문 4번, 이 유네스코 세계 문화유산을 매년 수십만 명이 찾아와요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It is unthinkable</div><div class=\"k\">상상도 할 수 없습니다</div></div><div class=\"rc\"><div class=\"e\">that it or its immediate surroundings</div><div class=\"k\">그것(= Hadrian’s Villa)이나 그것의 인접 환경이</div></div><div class=\"rc\"><div class=\"e\">should suffer degradation</div><div class=\"k\">수모를 겪어야 한다는 것은</div></div><div class=\"rc\"><div class=\"e\">of the kind that the proposed landfill clearly represents.</div><div class=\"k\">제안된 쓰레기 매립지가 명백히 나타내는 그러한 종류의.</div></div><div class=\"rnat\">그것 또는 그 인접 환경이 제안된 매립지가 분명히 나타내는 그러한 종류의 수모를 겪는 것은 상상도 할 수 없다.</div><div class=\"rst\">그런 곳 옆에 쓰레기 냄새가 퍼진다니, 상상도 못 할 일이죠. 지문 5번도 매립지 때문에 유적지가 망가지는 건 생각할 수도 없다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Even the Province of Rome</div><div class=\"k\">심지어 Province of Rome(로마 현)과</div></div><div class=\"rc\"><div class=\"e\">and the Ministry of Cultural Property and Activities</div><div class=\"k\">Ministry of Cultural Property and Activities(문화재 및 문화활동부)조차</div></div><div class=\"rc\"><div class=\"e\">have expressed their concerns.</div><div class=\"k\">그들의 우려를 표했습니다.</div></div><div class=\"rnat\">심지어 Province of Rome(로마 현)과 Ministry of Cultural Property and Activities(문화재 및 문화활동부)조차도 그들의 우려를 표했다.</div><div class=\"rst\">학부모회뿐 아니라 교육청까지 걱정한다고 말했어요. 지문 6번도 로마 현과 문화재 담당 부처조차 우려를 표했다고 해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">We appeal to the Ministry of the Environment</span></div><div class=\"k\"><span class=\"cw\">우리는 Ministry of the Environment(환경부)에 호소합니다</span></div></div><div class=\"rc\"><div class=\"e\">to announce immediately</div><div class=\"k\">즉시 발표할 것을</div></div><div class=\"rc\"><div class=\"e\">that the proposed project for a landfill at Corcolle</div><div class=\"k\">Corcolle에 제안된 쓰레기 매립지 프로젝트가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">will once and for all be abandoned</span></div><div class=\"k\"><span class=\"cw\">최종적으로 포기될 것이라고</span></div></div><div class=\"rc\"><div class=\"e\">to protect Hadrian’s Villa.</div><div class=\"k\">Hadrian’s Villa를 보호하기 위해.</div></div><div class=\"rnat\">우리는 Hadrian's Villa를 보호하기 위해 Corcolle에 제안된 매립지 프로젝트가 최종적으로 포기될 것이라고 즉시 발표할 것을 Ministry of the Environment(환경부)에 호소한다.</div><div class=\"rst\"><b>그래서 “쓰레기장 계획을 당장 없던 일로 해 주세요!”</b> 하고 부탁해요. 지문 7번, 환경부에 매립지 계획 포기를 호소하는 게 글의 목적이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"landfill\" data-m=\"쓰레기 매립지\"><b>landfill</b>쓰레기 매립지</button><button type=\"button\" class=\"wdb\" data-w=\"immense\" data-m=\"엄청난\"><b>immense</b>엄청난</button><button type=\"button\" class=\"wdb\" data-w=\"heritage\" data-m=\"유산\"><b>heritage</b>유산</button><button type=\"button\" class=\"wdb\" data-w=\"degradation\" data-m=\"수모, 훼손\"><b>degradation</b>수모, 훼손</button><button type=\"button\" class=\"wdb\" data-w=\"appeal to\" data-m=\"~에 호소하다\"><b>appeal to</b>~에 호소하다</button><button type=\"button\" class=\"wdb\" data-w=\"abandon\" data-m=\"포기하다\"><b>abandon</b>포기하다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. ③처럼 <b>두 가지(무대·영화)의 자리를 슬쩍 맞바꾼</b> 선택지는 지문의 <b>but</b>(하지만) 앞뒤를 꼭 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 2번</em>mother was German(어머니는 독일인) · father Swedish(아버지는 스웨덴인) → 같음</span><span><em>② ↔ 6번</em>17세였을 때(When she was 17) 그 학교에 다님 → 같음</span><span><em>④ ↔ 8번</em>1940년대 초에(In the early 1940s) 할리우드 스타 → 같음</span><span><em>⑤ ↔ 10번</em>fluent in five languages(다섯 개 언어에 유창) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ③을 7번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 ‘영화를 통해 데뷔’를 7번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 앞부분 · 결정적 단서</span><div class=\"en\">She made her debut <mark>on the stage</mark> …</div><p class=\"ko\">그녀는 <mark>무대에서</mark> 데뷔했지만 …</p></div><div class=\"ck-via\"><i>▼</i><span>but(하지만) 뒤가 더 좋아한 쪽: 연극이 아니라 영화예요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 뒷부분 · 더 관심 있던 쪽</span><div class=\"en\">… but was more interested <mark>in working in films</mark>.</div><p class=\"ko\">… 더 관심이 있었다 <mark>영화에서 일하는 것에</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">영화를 통해 데뷔했으나 연극에 더 관심이 있었다.<small>7번: 무대(연극)에서 데뷔했고, 영화에 더 관심이 있었어요. 둘이 뒤바뀌었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">1940년대 초에 할리우드에서 스타의 지위를 얻었다.</span><span class=\"why\">8번 1940년대 초에(In the early 1940s) gained star status in Hollywood(할리우드에서 스타의 지위를 얻었다)와 같아요. 영화 이야기가 나와서 ③과 헷갈리기 쉬워요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">어머니는 독일인이었고 아버지는 스웨덴인이었다.</span><span class=\"why\">2번 Her mother was German(어머니는 독일인이었다) and her father Swedish(아버지는 스웨덴인)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">17세에 Royal Dramatic Theater School에 다녔다.</span><span class=\"why\">6번 그녀가 17세였을 때(When she was 17) attended(다녔다)와 같아요. 학교 이름도 그대로예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">다섯 개의 언어에 유창했다.</span><span class=\"why\">10번 She was fluent in five languages(그녀는 다섯 개의 언어에 유창했다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Ingrid Bergman was born in Stockholm, Sweden</div><div class=\"k\">Ingrid Bergman은 스웨덴 스톡홀름에서 태어났다</div></div><div class=\"rc\"><div class=\"e\">on August 29, 1915.</div><div class=\"k\">1915년 8월 29일에.</div></div><div class=\"rnat\">Ingrid Bergman은 1915년 8월 29일 스웨덴 스톡홀름에서 태어났다.</div><div class=\"rst\">진로 시간에 배우 소개 카드를 만든다고 해 봐요. 첫 칸: 1915년 8월 29일 스웨덴 스톡홀름 출생. 지문 1번 그대로예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Her mother was German</div><div class=\"k\">그녀의 어머니는 독일인이었고</div></div><div class=\"rc\"><div class=\"e\">and her father Swedish.</div><div class=\"k\">아버지는 스웨덴인이었다.</div></div><div class=\"rnat\">그녀의 어머니는 독일인이었고 아버지는 스웨덴인이었다.</div><div class=\"rst\">둘째 칸: 엄마는 독일 사람, 아빠는 스웨덴 사람. 지문 2번이고, 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Her mother died</div><div class=\"k\">그녀의 어머니는 돌아가셨고</div></div><div class=\"rc\"><div class=\"e\">when she was three,</div><div class=\"k\">그녀가 세 살 때,</div></div><div class=\"rc\"><div class=\"e\">and her father passed away</div><div class=\"k\">그녀의 아버지는 돌아가셨다</div></div><div class=\"rc\"><div class=\"e\">when she was 12.</div><div class=\"k\">그녀가 열두 살 때.</div></div><div class=\"rnat\">그녀의 어머니는 그녀가 세 살 때, 아버지는 그녀가 12살 때 돌아가셨다.</div><div class=\"rst\">셋째 칸: 세 살 때 엄마를, 열두 살 때 아빠를 잃었어요. 지문 3번의 슬픈 어린 시절이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Eventually she was brought up</div><div class=\"k\">결국 그녀는 길러졌다</div></div><div class=\"rc\"><div class=\"e\">by her Uncle Otto and Aunt Hulda.</div><div class=\"k\">그녀의 숙부 Otto와 숙모 Hulda의 손에 (의해).</div></div><div class=\"rnat\">결국 그녀는 그녀의 숙부 Otto와 숙모 Hulda의 손에 길러졌다.</div><div class=\"rst\">넷째 칸: 그래서 삼촌 오토(Otto)와 숙모 훌다(Hulda)가 키워 주셨어요. 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">She was interested in acting</div><div class=\"k\">그녀는 연기에 관심이 있었다</div></div><div class=\"rc\"><div class=\"e\">from an early age.</div><div class=\"k\">어릴 적부터.</div></div><div class=\"rnat\">그녀는 어릴 적부터 연기에 관심이 있었다.</div><div class=\"rst\">다섯째 칸: 어릴 때부터 연기를 좋아했어요. 학예회 연극에 늘 나가는 친구처럼요. = 지문 5번이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">When she was 17,</div><div class=\"k\">그녀가 17세였을 때,</div></div><div class=\"rc\"><div class=\"e\">she attended the Royal Dramatic Theater School</div><div class=\"k\">그녀는 Royal Dramatic Theater School에 다녔다</div></div><div class=\"rc\"><div class=\"e\">in Stockholm.</div><div class=\"k\">스톡홀름에 있는.</div></div><div class=\"rnat\">그녀가 17세였을 때 그녀는 스톡홀름에 있는 Royal Dramatic Theater School에 다녔다.</div><div class=\"rst\">여섯째 칸: 17살에 스톡홀름의 연기 학교에 다녔어요. 지문 6번 = 선택지 ②예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">She made her debut <span class=\"cw\">on the stage</span></div><div class=\"k\">그녀는 <span class=\"cw\">무대에서 데뷔했지만</span></div></div><div class=\"rc\"><div class=\"e\">but was more interested</div><div class=\"k\">더 관심이 있었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in working in films</span>.</div><div class=\"k\"><span class=\"cw\">영화에서 일하는 것에</span>.</div></div><div class=\"rnat\">그녀는 연극 무대에서 데뷔했지만 영화에서 일하는 것에 더 관심이 있었다.</div><div class=\"rst\">일곱째 칸이 핵심! 첫 무대는 <b>연극 무대</b>였지만, 마음은 <b>영화</b> 쪽에 더 있었어요. 그래서 지문 7번과 ③이 거꾸로예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">In the early 1940s,</div><div class=\"k\">1940년대 초에</div></div><div class=\"rc\"><div class=\"e\">she gained star status in Hollywood,</div><div class=\"k\">그녀는 할리우드에서 스타의 지위를 얻었다,</div></div><div class=\"rc\"><div class=\"e\">playing many roles</div><div class=\"k\">많은 역할을 연기하며</div></div><div class=\"rc\"><div class=\"e\">as the heroine of the film.</div><div class=\"k\">영화의 여주인공으로.</div></div><div class=\"rnat\">1940년대 초에 그녀는 영화의 여주인공으로 많은 역할을 연기하며, 할리우드에서 스타의 지위를 얻었다.</div><div class=\"rst\">여덟째 칸: 1940년대 초 할리우드에서 영화 여주인공을 많이 맡아 스타가 됐어요. 지문 8번 = 선택지 ④예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Bergman was considered</div><div class=\"k\">Bergman은 ~라고 여겨졌다</div></div><div class=\"rc\"><div class=\"e\">to have tremendous acting talent,</div><div class=\"k\">엄청난 연기 재능과</div></div><div class=\"rc\"><div class=\"e\">an angelic natural beauty</div><div class=\"k\">천사 같은 자연스러운 미모,</div></div><div class=\"rc\"><div class=\"e\">and the willingness to work hard</div><div class=\"k\">그리고 열심히 일하고자 하는 의지를 지녔다고</div></div><div class=\"rc\"><div class=\"e\">to get the best out of films.</div><div class=\"k\">영화에서 가장 좋은 결과를 이끌어내기 위해서.</div></div><div class=\"rnat\">Bergman은 엄청난 연기 재능과 천사 같은 자연스러운 미모, 그리고 영화에서 최선을 이끌어내기 위해 열심히 노력하려는 의지를 지녔다고 여겨졌다.</div><div class=\"rst\">아홉째 칸: 연기도 잘하고, 예쁘고, 좋은 영화를 위해 열심히 노력하는 사람으로 여겨졌어요. 지문 9번이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">She was fluent in five languages</div><div class=\"k\">그녀는 다섯 개의 언어에 유창했으며</div></div><div class=\"rc\"><div class=\"e\">and appeared in a range of films, plays and TV productions.</div><div class=\"k\">다양한 영화, 연극, 그리고 TV 방송에 출연했다.</div></div><div class=\"rnat\">그녀는 다섯 개의 언어에 유창했고 다양한 영화, 연극, TV 방송에 출연했다.</div><div class=\"rst\">마지막 칸: 다섯 나라 말을 잘했고 영화·연극·텔레비전에 두루 나왔어요. 지문 10번 = 선택지 ⑤예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"passed away\" data-m=\"돌아가셨다 (pass away)\"><b>passed away</b>돌아가셨다 (pass away)</button><button type=\"button\" class=\"wdb\" data-w=\"brought up\" data-m=\"길러진 (bring up 기르다)\"><b>brought up</b>길러진 (bring up 기르다)</button><button type=\"button\" class=\"wdb\" data-w=\"attended\" data-m=\"~에 다녔다 (attend)\"><b>attended</b>~에 다녔다 (attend)</button><button type=\"button\" class=\"wdb\" data-w=\"made her debut\" data-m=\"데뷔했다\"><b>made her debut</b>데뷔했다</button><button type=\"button\" class=\"wdb\" data-w=\"status\" data-m=\"지위\"><b>status</b>지위</button><button type=\"button\" class=\"wdb\" data-w=\"fluent in\" data-m=\"~에 유창한\"><b>fluent in</b>~에 유창한</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>To be clear</b>(정확히 하자면)·<b>Because of this</b>(이 때문에)가 붙은 5·6번에 있어요. “해롭지 않은데도 뇌는 <b>위협</b>으로 본다”가 핵심이고, 8~14번은 전부 그 <b>사례</b>예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 배경</span><div class=\"en\">Our world today is <mark>comparatively harmless</mark>.</div><p class=\"ko\">오늘날 우리의 세계는 <mark>비교적 무해하다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>To be clear(정확히 하자면)로 글쓴이가 진짜 하고 싶은 말을 꺼내요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 결론 신호</span><div class=\"en\">To be clear, we have <mark>a Stone Age brain</mark> that lives in a modern world.</div><p class=\"ko\">정확히 하자면, 우리는 현대 세계에 사는 <mark>석기 시대의 뇌를</mark> 가지고 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>Because of this(이 때문에)로 석기 시대 뇌가 만드는 결과를 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 주제문</span><div class=\"en\">Because of this, many situations <mark>are considered a threat</mark> by our brains, although <mark>they are harmless</mark> to our survival.</div><p class=\"ko\">이 때문에, 많은 상황들은 우리의 생존에 <mark>무해함에도 불구하고</mark> 우리의 뇌에 의해 <mark>위협으로 간주된다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>8·9번</em>약속 있는데 차가 막힘 → 생명 위협은 아닌데 뇌는 위험으로 봄</span><span><em>12·13번</em>불쾌한 대화 → 도망칠 일도 아닌데 위험은 착각</span><span><em>14번</em>석기 시대 뇌는 있지도 않은 치명적 위험을 봄</span></div><div class=\"ck-eq\">⇒ 사례의 공통점 = 무해한 상황인데 뇌가 위협으로 봄 (6번과 같은 말)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">our perception of harmless situations as threatening 무해한 상황을 위협적인 것으로 인식하는 우리의 지각<small>6번의 harmless(무해한) + considered a threat(위협으로 간주된다)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">benefits of danger perception for humans' survival 인간 생존을 위한 위험 지각의 이점</span><span class=\"why\">[반대] 지문은 위험을 알아채는 게 좋다는 말이 아니라, 13번처럼 그 위험이 illusion(착각)이라고 해요. 이점이 아니라 잘못 보는 문제예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">the role of instinct in deciding to flee or fight 도망칠지 싸울지 결정할 때 본능의 역할</span><span class=\"why\">[범위 좁음] 7번에 flee or fight(도망치거나 싸우다)가 나오지만 과거 이야기 한 줄일 뿐이에요. 12번에서는 오히려 그럴 필요가 없다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">the human brain's evolution for telling friend from foe 친구와 적을 구별하기 위한 인간 뇌의 진화</span><span class=\"why\">[지문에 없음] 친구와 적을 가려내는 이야기는 없어요. 5번 Stone Age brain(석기 시대의 뇌)은 무해한 상황도 위험으로 본다는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">primitive people's ways of quickly dealing with dangers 원시인들이 위험에 빠르게 대처한 방법</span><span class=\"why\">[지문에 없음] 글의 주인공은 원시인이 아니라 지금 우리예요. 8번 traffic jam(교통 체증)처럼 오늘날 상황을 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Our world today</div><div class=\"k\">오늘날 우리의 세계는</div></div><div class=\"rc\"><div class=\"e\">is comparatively harmless.</div><div class=\"k\">비교적 무해하다.</div></div><div class=\"rnat\">오늘날 우리의 세계는 비교적 해가 없다.</div><div class=\"rst\">요즘 우리 학교생활은 꽤 안전해요. = 지문 1번, 오늘날 세상은 <b>비교적 해가 없다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We don’t have to be careful</div><div class=\"k\">우리는 주의할 필요가 없다</div></div><div class=\"rc\"><div class=\"e\">every moment</div><div class=\"k\">매 순간</div></div><div class=\"rc\"><div class=\"e\">that a tiger is behind us.</div><div class=\"k\">호랑이가 우리 뒤에 있는지.</div></div><div class=\"rnat\">우리는 호랑이가 우리 뒤에 있는지 매 순간 주의할 필요가 없다.</div><div class=\"rst\">등굣길에 호랑이가 뒤따라올까 봐 뒤돌아볼 일은 없죠. 지문 2번도 호랑이를 매 순간 조심할 필요가 없다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">We do not have to worry</div><div class=\"k\">우리는 걱정할 필요가 없다</div></div><div class=\"rc\"><div class=\"e\">about starving.</div><div class=\"k\">굶주림에 대해.</div></div><div class=\"rnat\">우리는 굶주림에 대해 걱정할 필요가 없다.</div><div class=\"rst\">급식이 나오니 굶을 걱정도 없어요. 지문 3번도 굶주림을 걱정할 필요가 없다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Our dangers today are,</div><div class=\"k\">오늘날 우리의 위험은,</div></div><div class=\"rc\"><div class=\"e\">for example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">high blood pressure or diabetes.</div><div class=\"k\">고혈압이나 당뇨병이다.</div></div><div class=\"rnat\">오늘날 우리의 위험은, 예를 들어, 고혈압이나 당뇨병이다.</div><div class=\"rst\">오히려 요즘 걱정은 군것질로 생기는 병 같은 거예요. 지문 4번, 오늘날 위험은 고혈압이나 당뇨병이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">To be clear,</div><div class=\"k\">정확히 하자면,</div></div><div class=\"rc ckc\"><div class=\"e\">we have <span class=\"cw\">a Stone Age brain</span></div><div class=\"k\">우리는 <span class=\"cw\">석기 시대의 뇌를</span> 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">that lives in a modern world.</div><div class=\"k\">현대 세계에 사는.</div></div><div class=\"rnat\">명확히 하자면, 우리는 현대 세계에 살고 있는 석기시대의 뇌를 가지고 있다.</div><div class=\"rst\"><b>그런데 우리 머릿속 뇌는 아직 석기 시대 그대로예요.</b> 지문 5번, 현대 세계에 사는 석기 시대의 뇌라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Because of this,</div><div class=\"k\">이 때문에,</div></div><div class=\"rc ckc\"><div class=\"e\">many situations <span class=\"cw\">are considered a threat</span></div><div class=\"k\">많은 상황들은 <span class=\"cw\">위협으로 간주된다</span></div></div><div class=\"rc\"><div class=\"e\">by our brains,</div><div class=\"k\">우리의 뇌에 의해,</div></div><div class=\"rc ckc\"><div class=\"e\">although <span class=\"cw\">they are harmless</span></div><div class=\"k\"><span class=\"cw\">그것들(= 그 상황들)이 무해함에도 불구하고</span></div></div><div class=\"rc\"><div class=\"e\">to our survival.</div><div class=\"k\">우리의 생존에.</div></div><div class=\"rnat\">이 때문에, 우리의 생존에는 무해한데도 많은 상황이 뇌에 의해 위협으로 여겨진다.</div><div class=\"rst\">그래서 별일 아닌데도 뇌는 “위험해!” 하고 놀라요. 지문 6번이 주제예요. 무해한 상황을 뇌는 <b>위협</b>으로 여겨요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">In the past,</div><div class=\"k\">과거에는,</div></div><div class=\"rc\"><div class=\"e\">danger meant</div><div class=\"k\">위험은 의미했다</div></div><div class=\"rc\"><div class=\"e\">we either had to flee or fight.</div><div class=\"k\">우리가 도망치거나 싸워야만 한다는 것을.</div></div><div class=\"rnat\">과거에는, 위험은 도망치거나 싸워야 함을 의미했다.</div><div class=\"rst\">옛날 사람에게 위험이란 호랑이를 보고 도망치거나 싸우는 일이었어요. = 지문 7번이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">If we have an appointment</div><div class=\"k\">만약 우리가 약속이 있는데</div></div><div class=\"rc\"><div class=\"e\">but are stuck in a traffic jam,</div><div class=\"k\">교통 체증에 갇혀 있다면,</div></div><div class=\"rc\"><div class=\"e\">that does not really threaten our lives.</div><div class=\"k\">그것은 실제로 우리의 생명을 위협하지는 않는다.</div></div><div class=\"rnat\">만약 우리가 약속이 있는데 교통 체증에 갇혀 있다면, 그것은 실제로 우리의 생명을 위협하지 않는다.</div><div class=\"rst\">학원 버스가 꽉 막혀 늦을 것 같아도 다치는 건 아니죠. 지문 8번도 교통 체증은 생명을 위협하지 않는다고 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">하지만,</div></div><div class=\"rc\"><div class=\"e\">our brain considers this a danger.</div><div class=\"k\">우리의 뇌는 이것을 위험으로 간주한다.</div></div><div class=\"rnat\">하지만, 우리의 뇌는 이것을 위험으로 여긴다.</div><div class=\"rst\"><b>하지만</b>(However) 내 심장은 쿵쾅거려요. 지문 9번, 뇌는 이걸 위험으로 여긴다는 말이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">That is the point.</div><div class=\"k\">그것이 핵심이다.</div></div><div class=\"rnat\">그것이 핵심이다.</div><div class=\"rst\">바로 이게 하고 싶은 말이에요. 지문 10번, 그것이 핵심이라고 콕 짚어요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">There is no danger,</div><div class=\"k\">위험은 없지만,</div></div><div class=\"rc\"><div class=\"e\">but our brain rates it as such.</div><div class=\"k\">우리의 뇌는 그것을 그러한 것(위험)으로 여긴다.</div></div><div class=\"rnat\">위험은 없지만, 우리의 뇌는 그것을 위험으로 여긴다.</div><div class=\"rst\">진짜 위험은 없는데, 뇌만 위험이라고 점수를 매겨요. = 지문 11번이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">If we have an unpleasant conversation with our partner,</div><div class=\"k\">만약 우리가 파트너와 불쾌한 대화를 나눈다면,</div></div><div class=\"rc\"><div class=\"e\">it does not threaten our lives,</div><div class=\"k\">그것은 우리의 생명을 위협하지 않으며</div></div><div class=\"rc\"><div class=\"e\">and we do not have to flee or fight.</div><div class=\"k\">우리는 도망치거나 싸울 필요가 없다.</div></div><div class=\"rnat\">만약 우리가 배우자와 불쾌한 대화를 나눈다면, 그것은 우리의 생명을 위협하지 않으며, 우리는 도망치거나 싸울 필요가 없다.</div><div class=\"rst\">친구와 말다툼을 해도 목숨이 걸린 일은 아니고, 도망칠 필요도 없어요. 지문 12번의 불쾌한 대화 이야기예요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The danger is an illusion.</span></div><div class=\"k\"><span class=\"cw\">그 위험은 착각이다.</span></div></div><div class=\"rnat\">그 위험은 착각이다.</div><div class=\"rst\">그러니 그때 느끼는 위험은 <b>착각</b>(illusion)이에요. 지문 13번이 짧게 못 박아요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Our Stone Age brain sees</div><div class=\"k\">우리의 석기 시대의 뇌는 본다</div></div><div class=\"rc\"><div class=\"e\">a mortal danger</div><div class=\"k\">치명적인 위험을</div></div><div class=\"rc\"><div class=\"e\">that is not there.</div><div class=\"k\">존재하지 않는.</div></div><div class=\"rnat\">우리의 석기시대 뇌는 존재하지 않는 치명적인 위험을 본다.</div><div class=\"rst\">석기 시대 뇌는 있지도 않은 무시무시한 위험을 봐요. 지문 14번이 6번 주제를 한 번 더 말해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"comparatively\" data-m=\"비교적\"><b>comparatively</b>비교적</button><button type=\"button\" class=\"wdb\" data-w=\"harmless\" data-m=\"해가 없는\"><b>harmless</b>해가 없는</button><button type=\"button\" class=\"wdb\" data-w=\"threat\" data-m=\"위협\"><b>threat</b>위협</button><button type=\"button\" class=\"wdb\" data-w=\"flee\" data-m=\"도망치다\"><b>flee</b>도망치다</button><button type=\"button\" class=\"wdb\" data-w=\"illusion\" data-m=\"착각\"><b>illusion</b>착각</button><button type=\"button\" class=\"wdb\" data-w=\"mortal\" data-m=\"치명적인\"><b>mortal</b>치명적인</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>반박이 시작되는 문장</b>과 그 뒤 근거를 묶어서 찾으세요. 7번이 “경쟁은 협력의 <b>반대</b>”라는 생각을 뒤집고, 8~11번이 “경쟁 안에 <b>협력</b>이 있다”로 닫혀요.</p><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 반대쪽 주장</span><div class=\"en\">They assert that competition kills off more prosocial behaviors, such as cooperation and respect.</div><p class=\"ko\">그들은 경쟁이 협력이나 존중 같은 보다 친사회적인 행동들을 없앤다고 주장한다.</p></div><div class=\"ck-via\"><i>▼</i><span>앞 사람들의 생각을 “중요한 걸 놓쳤다”고 반박해요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 뒤집기 신호</span><div class=\"en\">The assumption that competition is the opposite of cooperation <mark>is missing something crucial</mark>.</div><p class=\"ko\">경쟁이 협력의 반대라는 가정은 <mark>뭔가 중요한 것을 놓치고 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>놓친 그 “중요한 것”이 바로 이거예요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">To compete, <mark>both opponents have to cooperate on the rules</mark> …</div><p class=\"ko\">경쟁하기 위해서는, <mark>양쪽 상대 모두 규칙에 대해 협력해야 한다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>In fact(사실)로 경쟁과 협력이 뿌리부터 같다고 결론지어요</span></div><div class=\"ck-step key\"><span class=\"lab\">11번 문장 · 마지막 못 박기</span><div class=\"en\">In fact, the hormones that drive us to compete <mark>are the same hormones</mark> that drive us to collaborate.</div><p class=\"ko\">사실, 우리를 경쟁하도록 만드는 호르몬은 우리를 협력하도록 만드는 호르몬과 <mark>같은 호르몬이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">Competition(경쟁): Another Form of Cooperation(협력의 또 다른 형태)<small>8번(규칙에 협력)과 11번(같은 호르몬)을 한 줄로 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">How to Balance Competition and Cooperation 경쟁과 협력의 균형을 맞추는 방법</span><span class=\"why\">[지문에 없음] 두 단어가 다 들어 있어 끌리지만, 지문은 둘을 저울질하는 방법이 아니라 10번처럼 경쟁 속에 협력이 들어 있다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Are You Ready for a Collaborative Partner(협력할 동반자를 맞을 준비가 되었나요)?</span><span class=\"why\">[지문에 없음] 파트너를 구하라는 말은 없어요. 9번 team members(팀 구성원들)는 경쟁하려면 팀끼리 협력한다는 예시예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">No Room for Mutual Respect in Competition 경쟁에는 상호 존중의 여지가 없다</span><span class=\"why\">[반대] 6번의 반대쪽 사람들 주장일 뿐이에요. 7번에서 글쓴이는 그 생각이 중요한 걸 놓쳤다고 뒤집어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Achieve Cooperation via Active Communication 적극적인 의사소통을 통해 협력을 이뤄라</span><span class=\"why\">[지문에 없음] communication(의사소통) 이야기는 한 번도 안 나와요. 글의 화제는 경쟁과 협력의 관계예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Competition makes the world go round.</div><div class=\"k\">경쟁은 세상을 돌아가게 만든다.</div></div><div class=\"rnat\">경쟁은 세상을 돌아가게 만든다.</div><div class=\"rst\">반 대항 축구 대회를 떠올려 봐요. 이기려고 다들 열심히 뛰니 교실이 활기차요. = 지문 1번, 경쟁이 세상을 돌아가게 한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It is the engine of evolution</div><div class=\"k\">그것(= 경쟁)은 진화(발전)의 엔진이며</div></div><div class=\"rc\"><div class=\"e\">and the foundation of democracy.</div><div class=\"k\">민주주의의 기반이다.</div></div><div class=\"rnat\">그것은 진화(발전)의 엔진이며 민주주의의 기반이다.</div><div class=\"rst\">대회 덕분에 우리 반 실력이 쑥쑥 늘고, 반장도 투표로 공정하게 뽑아요. 지문 2번, 경쟁은 발전의 엔진이자 민주주의의 기반이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It prompts innovation,</div><div class=\"k\">그것(= 경쟁)은 혁신을 촉발하고,</div></div><div class=\"rc\"><div class=\"e\">drives global markets,</div><div class=\"k\">세계 시장을 움직이며,</div></div><div class=\"rc\"><div class=\"e\">and puts money in the pocket.</div><div class=\"k\">주머니에 돈을 넣어 준다(돈을 벌게 해 준다).</div></div><div class=\"rnat\">그것은 혁신을 촉발하고, 세계 시장을 이끌며, 주머니에 돈을 넣어준다.</div><div class=\"rst\">새 작전도 생기고, 매점도 붐비고, 상금도 걸려요. 지문 3번, 경쟁은 혁신을 일으키고 돈을 벌게 해 줘요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Still,</div><div class=\"k\">그럼에도 불구하고,</div></div><div class=\"rc\"><div class=\"e\">there are those</div><div class=\"k\">사람들이 있다</div></div><div class=\"rc\"><div class=\"e\">who have argued</div><div class=\"k\">주장해 온</div></div><div class=\"rc\"><div class=\"e\">that competition is a source of evil.</div><div class=\"k\">경쟁이 악의 근원이라고.</div></div><div class=\"rnat\">그럼에도, 경쟁이 악의 근원이라고 주장해 온 사람들이 있다.</div><div class=\"rst\"><b>그래도</b>(Still) “대회 때문에 반끼리 싸워!” 하는 친구들도 있어요. 지문 4번, 경쟁은 악의 근원이라는 사람들이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">They see competition</div><div class=\"k\">그들(= 경쟁이 악의 근원이라고 주장해 온 사람들)은 경쟁을 바라본다</div></div><div class=\"rc\"><div class=\"e\">in terms of destructiveness:</div><div class=\"k\">파괴성의 관점에서.</div></div><div class=\"rc\"><div class=\"e\">they don’t believe</div><div class=\"k\">그들은 믿지 않는다</div></div><div class=\"rc\"><div class=\"e\">it’s a constructive activity.</div><div class=\"k\">그것이 건설적인 활동이라고.</div></div><div class=\"rnat\">그들은 경쟁을 파괴성의 관점에서 바라본다: 그들은 그것이 건설적인 활동이라고 믿지 않는다.</div><div class=\"rst\">그 친구들은 대회가 반 분위기를 망칠 뿐이라고 봐요. 지문 5번, 경쟁을 파괴적이라고 보는 시각이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">They assert</div><div class=\"k\">그들은 주장한다</div></div><div class=\"rc\"><div class=\"e\">that competition kills off more prosocial behaviors,</div><div class=\"k\">경쟁이 보다 친사회적인 행동들을 없앤다고,</div></div><div class=\"rc\"><div class=\"e\">such as cooperation and respect.</div><div class=\"k\">협력이나 존중 같은.</div></div><div class=\"rnat\">그들은 경쟁이 협력이나 존중 같은 보다 친사회적인 행동들을 없앤다고 주장한다.</div><div class=\"rst\">“대회 하면 서로 돕고 존중하는 마음이 사라져.” 지문 6번, 경쟁이 협력과 존중을 없앤다는 주장이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The assumption</div><div class=\"k\">가정은</div></div><div class=\"rc\"><div class=\"e\">that competition is the opposite of cooperation</div><div class=\"k\">경쟁이 협력의 반대라는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is missing something crucial</span>.</div><div class=\"k\"><span class=\"cw\">뭔가 중요한 것을 놓치고 있다</span>.</div></div><div class=\"rnat\">경쟁이 협력의 반대라는 가정은 뭔가 중요한 것을 놓치고 있다.</div><div class=\"rst\"><b>하지만 그 생각은 중요한 걸 놓쳤어요.</b> 지문 7번, 경쟁이 협력의 반대라는 가정을 뒤집는 곳이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">To compete,</div><div class=\"k\">경쟁하기 위해서는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">both opponents have to cooperate on the rules</span>:</div><div class=\"k\"><span class=\"cw\">양쪽 상대 모두 규칙에 대해 협력해야 한다</span>.</div></div><div class=\"rc\"><div class=\"e\">there’s a mutual agreement of cooperation</div><div class=\"k\">협력에 대한 상호 합의가 있다</div></div><div class=\"rc\"><div class=\"e\">that governs the competition.</div><div class=\"k\">경쟁을 지배하는.</div></div><div class=\"rnat\">경쟁하기 위해서는, 양쪽 상대 모두 규칙에 대해 협력해야 한다: 경쟁을 지배하는 협력에 대한 상호 합의가 있다.</div><div class=\"rst\">축구를 하려면 두 반이 먼저 “손 쓰면 반칙” 같은 규칙에 같이 동의해야 해요. 지문 8번, 양쪽 모두 <b>규칙에 협력</b>해야 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">As well,</div><div class=\"k\">마찬가지로,</div></div><div class=\"rc\"><div class=\"e\">competitions are commonly among teams;</div><div class=\"k\">경쟁은 흔히 팀 사이에서도 존재한다.</div></div><div class=\"rc\"><div class=\"e\">each individual needs to cooperate with team members</div><div class=\"k\">각각의 개인은 팀 구성원들과 협력해야 할 필요가 있다</div></div><div class=\"rc\"><div class=\"e\">in order to compete effectively.</div><div class=\"k\">효과적으로 경쟁하기 위해서.</div></div><div class=\"rnat\">마찬가지로 경쟁은 흔히 팀 사이에서도 일어나는데, 각 개인은 효과적으로 경쟁하기 위해 팀 구성원과 협력해야 한다.</div><div class=\"rst\">또 이기려면 우리 반 친구끼리 패스를 주고받아야 해요. 지문 9번, 효과적으로 경쟁하려면 팀원과 협력해야 해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Healthy competition can’t happen</div><div class=\"k\">건강한 경쟁은 일어날 수 없다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">without cooperation</span>.</div><div class=\"k\"><span class=\"cw\">협력 없이는</span>.</div></div><div class=\"rnat\">건강한 경쟁은 협력 없이는 일어날 수 없다.</div><div class=\"rst\">그러니 협력 없이는 좋은 경기도 없어요. 지문 10번, 건강한 경쟁은 협력 없이 일어날 수 없다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">the hormones that drive us to compete</div><div class=\"k\">우리를 경쟁하도록 만드는 호르몬은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are the same hormones</span></div><div class=\"k\"><span class=\"cw\">(호르몬과) 같은 호르몬이다</span></div></div><div class=\"rc\"><div class=\"e\">that drive us to collaborate.</div><div class=\"k\">우리를 협력하도록 만드는.</div></div><div class=\"rnat\">사실, 우리를 경쟁하도록 만드는 호르몬은 우리를 협력하도록 만드는 호르몬과 같은 호르몬이다.</div><div class=\"rst\">사실 이기고 싶은 마음과 친구랑 힘을 합치고 싶은 마음은 같은 호르몬에서 나와요. = 지문 11번이에요. 그래서 제목이 “경쟁: 협력의 또 다른 형태”예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"foundation\" data-m=\"기반, 토대\"><b>foundation</b>기반, 토대</button><button type=\"button\" class=\"wdb\" data-w=\"constructive\" data-m=\"건설적인\"><b>constructive</b>건설적인</button><button type=\"button\" class=\"wdb\" data-w=\"prosocial\" data-m=\"친사회적인\"><b>prosocial</b>친사회적인</button><button type=\"button\" class=\"wdb\" data-w=\"assumption\" data-m=\"가정\"><b>assumption</b>가정</button><button type=\"button\" class=\"wdb\" data-w=\"opponent\" data-m=\"상대방\"><b>opponent</b>상대방</button><button type=\"button\" class=\"wdb\" data-w=\"mutual\" data-m=\"상호의\"><b>mutual</b>상호의</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">관계대명사 that(~하는) 뒤 동사는 <b>바로 앞 명사가 아니라 진짜 선행사</b>에 수를 맞춰요. 7번 that(~하는) 앞의 진짜 주인은 <b>very little</b>(거의 없는 것) <b>in the way of market demand</b>(시장 수요라고 할 만한 것)라서 <b>단수 is</b>(~이다)예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (7번)</span><div class=\"en\">… so that there is very little in the way of market demand that <u>④ are</u> not accommodated.</div><p class=\"ko\">수용되지 ( ? ) 시장 수요라고 할 만한 것이 거의 없게 — that 앞 선행사가 단수인지 복수인지 봐요</p></div><div class=\"ck-via\"><i>▼</i><span>that(~하는) 바로 앞 명사 market demand(시장 수요)는 셀 수 없는 명사예요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 · 선행사 찾기</span><div class=\"en\">so that there is <mark>very little</mark> in the way of <mark>market demand</mark></div><p class=\"ko\"><mark>시장 수요라고 할 만한 것이</mark> <mark>거의 없게</mark> 하기 위해서</p></div><div class=\"ck-via\"><i>▼</i><span>선행사가 단수(셀 수 없는 명사)이니 관계절 동사도 단수 is(~이다)예요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 결정적 단서</span><div class=\"en\">that <mark>is not accommodated</mark>.</div><p class=\"ko\"><mark>수용되지 않는</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">주격 관계대명사절 동사의 수일치</p><p class=\"gr\">that(~하는) 뒤 동사는 선행사에 수를 맞춰요. 셀 수 없는 명사나 little(거의 없는 것)은 단수라서 is(~이다)를 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>There is little food that is left.</div><div class=\"ko\">남아 있는 음식이 거의 없다. (food 음식은 셀 수 없는 명사라 단수 is)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>There is little food that are left.</div><div class=\"ko\">셀 수 없는 food(음식)인데 복수 are를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have two friends that are kind.</div><div class=\"ko\">나는 친절한 친구가 두 명 있다. (friends 친구들은 복수라 are)</div></div><p class=\"gb\">지문 7번도 that(~하는) 앞이 very little(거의 없는 것) in the way of market demand(시장 수요라고 할 만한 것)라서 단수예요. 그래서 복수 are(~이다)가 아니라 단수 is(~이다)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">are → is (~이다, 단수)<small>선행사 market demand(시장 수요)는 셀 수 없는 명사라 단수 동사 is(~이다)가 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">when ~할 때</span><span class=\"why\">4번은 for a period(어떤 기간 동안) before and during(전과 도중에) 뒤에 ③ 자리가 와요. 뒤에 a new entrant launches into a market(새 진입자가 시장에 진출한다)가 주어·동사를 다 갖춘 완전한 절이고, '언제'라는 시간을 말하니 when(~할 때)이 맞아요. which(그것)는 뒤가 빠진 불완전한 절일 때 써요.</span><div class=\"gm wx\"><p class=\"gt\">시간을 나타내는 when(~할 때) + 완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Call me when you arrive at school.</div><div class=\"ko\">학교에 도착하면 나에게 전화해. (when 뒤 you arrive가 주어·동사를 갖춘 완전한 절이라 맞아요)</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I remember the day when we first met.</div><div class=\"ko\">나는 우리가 처음 만난 날을 기억한다. (we first met이 완전하고 시간이라 when이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I remember the day which we first met.</div><div class=\"ko\">which(그것) 뒤에는 빠진 자리가 있어야 하는데 we first met은 완전해서 틀려요.</div></div><p class=\"gb\">지문 4번도 when(~할 때) 뒤에 a new entrant launches(새 진입자가 진출한다)가 완전한 절로 와서 when(~할 때)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">that ~하는</span><span class=\"why\">2번 an announcement of some intent(어떤 의도의 공표) 뒤에 ① 자리가 오고, 바로 다음이 주어 없이 might discourage(낙담시킬 수도 있다)예요. 주어가 빠졌으니 주격 관계대명사 that(~하는)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~하는) + 주어 없는 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a friend that lives in Busan.</div><div class=\"ko\">나는 부산에 사는 친구가 있다. (that 뒤 주어가 빠지고 lives 살다가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a friend lives in Busan.</div><div class=\"ko\">that 없이 동사 lives(살다)가 또 나와서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a friend what lives in Busan.</div><div class=\"ko\">앞에 a friend(친구)라는 선행사가 있으니 what(~하는 것)은 못 써서 틀려요.</div></div><p class=\"gb\">지문 2번도 intent(의도) 뒤에 주어 없이 might discourage(낙담시킬 수도 있다)가 와서 that(~하는)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">doing 하는 것</span><span class=\"why\">2번은 discourage rivals from(경쟁자들이 ~하지 못하게 하다) 뒤의 ② 자리예요. from(~로부터)은 전치사라서 뒤에 동사를 쓰려면 동명사 doing(하는 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">전치사 from(~로부터) + 동명사(~하는 것)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The rain kept us from playing soccer.</div><div class=\"ko\">비 때문에 우리는 축구를 하지 못했다. (from 뒤에 playing 하는 것이 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The rain kept us from play soccer.</div><div class=\"ko\">전치사 from 뒤에 동사원형 play(하다)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My friend stopped me from eating snacks.</div><div class=\"ko\">친구가 내가 과자를 먹지 못하게 막았다. (from 뒤에 eating 먹는 것이라 맞아요)</div></div><p class=\"gb\">지문 2번도 discourage rivals from(경쟁자들이 ~하지 못하게 하다) 뒤라서 doing(하는 것)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">untapped 아직 손대지 않은</span><span class=\"why\">8번 to find(찾는 것) 뒤 ⑤ 자리는 pockets of market demand(시장 수요 주머니)를 꾸며 주는 말이에요. 수요 주머니는 스스로 손대는 게 아니라 '아직 손대지 않아진' 쪽이라 과거분사 untapped(아직 손대지 않은)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">명사 앞 분사: 현재분사(능동, ~하는) / 과거분사(수동, ~된)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>We found a hidden door.</div><div class=\"ko\">우리는 숨겨진 문을 찾았다. (문은 '숨겨지는' 쪽이라 과거분사 hidden(숨겨진)이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>We found a hiding door.</div><div class=\"ko\">문이 스스로 숨는 게 아닌데 현재분사 hiding(숨는)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I ate an unopened snack.</div><div class=\"ko\">나는 뜯지 않은 과자를 먹었다. (과자는 '뜯기는' 쪽이라 과거분사 unopened(뜯지 않은)가 맞아요)</div></div><p class=\"gb\">지문 8번도 pockets(주머니)는 '손대지 않아진' 쪽이라 untapped(아직 손대지 않은)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Pre-emption means</div><div class=\"k\">선매 행위는 의미한다</div></div><div class=\"rc\"><div class=\"e\">that a strategy is designed</div><div class=\"k\">어떤 전략이 고안된다는 것을</div></div><div class=\"rc\"><div class=\"e\">to prevent a rival from starting some particular activity.</div><div class=\"k\">경쟁자가 어떤 특정한 활동을 시작하지 못하게 막기 위해.</div></div><div class=\"rnat\">선매 행위는 어떤 전략이 경쟁자가 어떤 특정한 활동을 시작하지 못하게 막고자 고안된다는 의미이다.</div><div class=\"rst\">선매 행위(pre-emption)는 경쟁자가 일을 시작하지 못하게 먼저 막는 전략이에요. 문방구가 옆 가게보다 먼저 손을 쓰는 것 = 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In some case</div><div class=\"k\">어떤 경우에</div></div><div class=\"rc\"><div class=\"e\">a pre-emptive move may simply be an announcement of some intent</div><div class=\"k\">선제적 조치는 단지 어떤 의도의 공표일 수도 있다</div></div><div class=\"rc\"><div class=\"e\">that might discourage rivals</div><div class=\"k\">경쟁자들을 낙담시킬 수도 있는</div></div><div class=\"rc\"><div class=\"e\">from doing the same.</div><div class=\"k\">같은 행동을 하지 못하게.</div></div><div class=\"rnat\">어떤 경우에 선제적 조치는 단지 경쟁자들이 같은 행동을 하지 못하게 낙담시킬 수도 있는 어떤 의도의 공표일 수도 있다.</div><div class=\"rst\">“우리 곧 새 볼펜 들여와요!” 하고 미리 알려서 옆 가게가 따라 하지 못하게 할 수도 있어요. 지문 2번, <b>that</b>(~하는) 뒤 주어가 빠진 자리예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The idea of pre-emption implies</div><div class=\"k\">선매 행위의 개념은 암시한다</div></div><div class=\"rc\"><div class=\"e\">that timing is sometimes very important —</div><div class=\"k\">타이밍이 때때로 아주 중요하다는 것을 —</div></div><div class=\"rc\"><div class=\"e\">a decision or an action at one point in time</div><div class=\"k\">어떤 시점의 결정이나 조치가</div></div><div class=\"rc\"><div class=\"e\">might be much more rewarding</div><div class=\"k\">훨씬 더 득이 될 수도 있다</div></div><div class=\"rc\"><div class=\"e\">than doing it at a different time point.</div><div class=\"k\">그것을 다른 시점에 행하는 것보다.</div></div><div class=\"rnat\">선매 행위의 개념은 타이밍이 때때로 아주 중요하다는 것을 암시한다. 즉, 어떤 시점의 결정이나 조치가 그것을 다른 시점에 행하는 것보다 훨씬 더 득이 될 수도 있는 것이다.</div><div class=\"rst\">그래서 언제 하느냐가 아주 중요해요. 지문 3번, 어떤 때의 결정이 다른 때보다 훨씬 이득일 수 있다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Pre-emption may involve up-weighting advertising</div><div class=\"k\">선매 행위는 광고의 가중치를 높이는 것을 포함할 수도 있다</div></div><div class=\"rc\"><div class=\"e\">for a period before and during</div><div class=\"k\">전과 도중의 기간에</div></div><div class=\"rc\"><div class=\"e\">when a new entrant launches into a market.</div><div class=\"k\">새로운 진입자가 시장에 진출하는.</div></div><div class=\"rnat\">선매 행위는 새로운 진입자가 시장에 진출하기 전과 도중의 기간에 광고의 가중치를 높이는 것을 포함할 수도 있다.</div><div class=\"rst\">새 가게가 문 열기 전과 여는 동안 광고를 확 늘리는 것도 방법이에요. 지문 4번, <b>when</b>(~할 때) 뒤가 완전한 절이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The intent is</div><div class=\"k\">그 취지는 ~이다</div></div><div class=\"rc\"><div class=\"e\">to make it more difficult</div><div class=\"k\">더 어렵게 하려는 것</div></div><div class=\"rc\"><div class=\"e\">for the new entrant’s advertising</div><div class=\"k\">신규 진입자의 광고가</div></div><div class=\"rc\"><div class=\"e\">to make an impression on potential buyers.</div><div class=\"k\">잠재적 구매자들에게 인상을 남기기.</div></div><div class=\"rnat\">그 취지는 신규 진입자의 광고가 잠재적 구매자들에게 인상을 남기기 더 어렵게 하려는 것이다.</div><div class=\"rst\">그러면 새 가게 광고가 손님 눈에 잘 안 띄어요. 지문 5번, 새 진입자의 광고가 인상을 남기기 어렵게 하려는 거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Product proliferation is</div><div class=\"k\">제품 확산은 ~이다</div></div><div class=\"rc\"><div class=\"e\">another potential pre-emption strategy.</div><div class=\"k\">또 다른 가능한 선매 행위 전략.</div></div><div class=\"rnat\">제품 확산은 또 다른 가능한 선매 행위 전략이다.</div><div class=\"rst\">제품을 잔뜩 늘어놓는 것도 또 다른 먼저 막기 전략이에요. 지문 6번, 제품 확산(product proliferation)이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">The general idea is</div><div class=\"k\">그 개념은 ~이다</div></div><div class=\"rc\"><div class=\"e\">to launch a large variety of product variants</div><div class=\"k\">아주 많은 제품 변형을 출시하는 것</div></div><div class=\"rc ckc\"><div class=\"e\">so that there is <span class=\"cw\">very little</span></div><div class=\"k\"><span class=\"cw\">거의 없게 하기 위해서</span></div></div><div class=\"rc ckc\"><div class=\"e\">in the way of <span class=\"cw\">market demand</span></div><div class=\"k\"><span class=\"cw\">시장 수요라고 할 만한 것이</span></div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">is not accommodated</span>.</div><div class=\"k\"><span class=\"cw\">수용되지 않는</span> ※ 문제지엔 are로 되어 있음</div></div><div class=\"rnat\">그 개념은 수용되지 않는 시장 수요라고 할 만한 것이 거의 없게 하기 위해서 아주 많은 제품 변형을 출시하는 것이다.</div><div class=\"rst\">색깔별, 굵기별 볼펜을 다 갖다 놓아 못 채운 수요가 <b>거의 없게</b> 해요. 지문 7번은 선행사가 단수라 동사가 <b>is</b>(~이다)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Arguably,</div><div class=\"k\">거의 틀림없이,</div></div><div class=\"rc\"><div class=\"e\">if a market is already filled with product variants</div><div class=\"k\">만약 시장이 이미 제품 변형으로 가득하다면</div></div><div class=\"rc\"><div class=\"e\">it is more difficult for competitors</div><div class=\"k\">경쟁자들로서는 더 어렵다</div></div><div class=\"rc\"><div class=\"e\">to find untapped pockets of market demand.</div><div class=\"k\">아직 손대지 않은 시장 수요 주머니(미개척된 시장 수요 영역)를 찾기가.</div></div><div class=\"rnat\">거의 틀림없이, 만약 시장이 이미 여러 제품 변형으로 가득하다면, 경쟁자들로서는 아직 손대지 않은 시장 수요 주머니(미개척된 시장 수요 영역)를 찾기가 더 어렵다.</div><div class=\"rst\">가게가 이미 온갖 볼펜으로 꽉 차 있으면, 옆 가게는 아직 남은 손님 자리를 찾기 어려워요. 지문 8번, <b>untapped</b>(아직 손대지 않은)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"pre-emptive\" data-m=\"선제적인\"><b>pre-emptive</b>선제적인</button><button type=\"button\" class=\"wdb\" data-w=\"discourage\" data-m=\"낙담시키다, 단념시키다\"><b>discourage</b>낙담시키다, 단념시키다</button><button type=\"button\" class=\"wdb\" data-w=\"rewarding\" data-m=\"득이 되는\"><b>rewarding</b>득이 되는</button><button type=\"button\" class=\"wdb\" data-w=\"entrant\" data-m=\"진입자\"><b>entrant</b>진입자</button><button type=\"button\" class=\"wdb\" data-w=\"variant\" data-m=\"변형\"><b>variant</b>변형</button><button type=\"button\" class=\"wdb\" data-w=\"untapped\" data-m=\"아직 손대지 않은\"><b>untapped</b>아직 손대지 않은</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">5번 <b>this idea</b>(이 생각)가 4번 “눈에 안 보이는 입자가 <b>있다</b>”를 가리켜요. 바로 뒤 6번이 <b>must be</b>(틀림없이 있다)로 그 생각을 <b>밀어주는 쪽</b>이니, 그 방향과 어긋나는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">4번 · 원래 생각</span><div class=\"en\">… the smell of baking bread suggested to them that small particles of bread <mark>existed beyond vision</mark>.</div><p class=\"ko\">… 빵 굽는 냄새는 그들에게 빵의 작은 입자들이 <mark>눈에 보이지 않는 상태로 존재한다는 것을</mark> 시사했다.</p></div><div class=\"ck-via\"><i>▼</i><span>날씨 순환이 그 생각을 반증했다(disproved)? 뒤를 확인해요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (5번)</span><div class=\"en\">The cycle of weather <u>③ disproved</u> this idea: a puddle of water on the ground gradually dries out, disappears, and then falls later as rain.</div><p class=\"ko\">날씨의 순환은 이 생각을 ( 반증했다? ) — 물웅덩이가 사라졌다가 비로 다시 내려와요</p></div><div class=\"ck-via\"><i>▼</i><span>웅덩이를 보고 “물 입자가 틀림없이 있다”고 결론 내려요 → 생각을 강화한 거예요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 결정적 단서</span><div class=\"en\">They reasoned that <mark>there must be particles of water</mark> … even though the little particles are too small to see.</div><p class=\"ko\">그들은 <mark>물 입자들이 틀림없이 존재하고</mark> …, 비록 그 작은 입자들이 너무 작아서 볼 수 없다 하더라도 물은 보존된다고 추론했다.</p></div><div class=\"ck-via\"><i>▼</i><span>반증(disproved)이 아니라 강화(reinforced)여야 6번과 이어져요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 바르게 고친 문장</span><div class=\"en\">The cycle of weather <mark>reinforced this idea</mark>:</div><p class=\"ko\">날씨의 순환은 <mark>이 생각을 강화했는데</mark>:</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">reinforced(강화했다) ↔ disproved(반증했다)</p><p class=\"gr\">뒤에 그 생각을 뒷받침하는 근거가 오면 reinforced(강화했다), 그 생각이 틀렸다는 근거가 오면 disproved(반증했다)예요. 뒤 문장의 방향을 꼭 확인해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My test score reinforced my belief that studying helps.</div><div class=\"ko\">시험 점수가 공부가 도움이 된다는 내 믿음을 강화했다. (점수가 올라 믿음이 더 굳어짐)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I studied hard and got a high score, which disproved my belief that studying helps.</div><div class=\"ko\">공부해서 점수가 올랐는데 그 믿음을 반증했다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The broken window disproved his story that nobody came in.</div><div class=\"ko\">깨진 창문이 아무도 안 들어왔다는 그의 말을 반증했다. (근거가 말과 반대라 맞아요)</div></div><p class=\"gb\">지문 6번에서 그리스인들은 물 입자가 틀림없이 있다고 결론 내려요. 날씨 순환이 생각을 뒷받침했으니 disproved(반증했다)가 아니라 reinforced(강화했다)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">disproved → reinforced (강화했다)<small>6번에서 물 입자가 틀림없이 있다고 했으니 생각을 강화(reinforced)한 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">conserved 보존되는</span><span class=\"why\">6번은 물이 수증기 → 구름 → 비로 모습만 바뀌고 없어지지 않는다는 말이에요. 보이지 않아도 물이 그대로 남아 있으니 conserved(보존되는)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">detected 감지되는</span><span class=\"why\">3번 too small for my eyes to see(눈으로 보기엔 너무 작은) but(하지만) 뒤라서 반대로 코로는 '느껴지는' 쪽이에요. 2번 aroma(향기)도 코로 맡았으니 detected(감지되는)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">existed 존재했다</span><span class=\"why\">4번은 빵 냄새가 났다는 것은 눈에 안 보이는 빵 입자가 '있다'는 뜻이라는 말이에요. 6번 there must be(틀림없이 있다)와도 같은 방향이라 existed(존재했다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">late 늦게</span><span class=\"why\">7번은 그리스인들이 이미 오래전에 원자 생각을 했으니, 지금의 나는 four thousand years(4천 년)나 늦었다는 농담이에요. 그래서 too late(너무 늦게)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">I was sitting outside a restaurant in Spain</div><div class=\"k\">나는 스페인의 한 식당 밖에 앉아 있었다</div></div><div class=\"rc\"><div class=\"e\">one summer evening,</div><div class=\"k\">어느 여름날 저녁,</div></div><div class=\"rc\"><div class=\"e\">waiting for dinner.</div><div class=\"k\">저녁 식사를 기다리며.</div></div><div class=\"rnat\">어느 여름날 저녁, 나는 저녁 식사를 기다리며 스페인의 한 식당 밖에 앉아 있었다.</div><div class=\"rst\">어느 여름 저녁, 나는 스페인의 한 식당 밖에 앉아 저녁을 기다렸어요. 급식 시간 직전 복도에서 기다리는 기분과 비슷해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The aroma of the kitchens</div><div class=\"k\">주방에서의 향기가</div></div><div class=\"rc\"><div class=\"e\">excited my taste buds.</div><div class=\"k\">내 미뢰들을 자극했다.</div></div><div class=\"rnat\">주방에서의 향기가 내 미뢰들을 자극했다.</div><div class=\"rst\">주방에서 나는 냄새에 침이 꼴깍 넘어갔어요. 지문 2번, 향기가 내 혀의 미뢰를 자극했다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">My future meal was coming to me</div><div class=\"k\">내가 먹을 식사는 나에게 오고 있었다</div></div><div class=\"rc\"><div class=\"e\">in the form of molecules</div><div class=\"k\">분자의 형태로</div></div><div class=\"rc\"><div class=\"e\">drifting through the air,</div><div class=\"k\">공중을 떠다니는,</div></div><div class=\"rc\"><div class=\"e\">too small for my eyes to see</div><div class=\"k\">나의 눈으로 보기에는 너무 작지만</div></div><div class=\"rc\"><div class=\"e\">but detected by my nose.</div><div class=\"k\">나의 코로는 감지되는.</div></div><div class=\"rnat\">내가 먹을 식사는 공중을 떠다니는, 나의 눈으로 보기에는 너무 작지만 나의 코로는 감지되는 분자의 형태로 나에게 오고 있었다.</div><div class=\"rst\">음식 알갱이는 너무 작아 눈엔 안 보여도 코로는 <b>느껴져요</b>(detected 감지되는). 지문 3번, 공중을 떠다니는 분자 이야기예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The ancient Greeks first came upon the idea of atoms this way;</div><div class=\"k\">고대 그리스인들은 이런 식으로 원자 개념을 우연히 처음 떠올렸는데,</div></div><div class=\"rc\"><div class=\"e\">the smell of baking bread suggested to them</div><div class=\"k\">빵 굽는 냄새는 그들에게 시사했다</div></div><div class=\"rc ckc\"><div class=\"e\">that small particles of bread <span class=\"cw\">existed beyond vision</span>.</div><div class=\"k\">빵의 작은 입자들이 <span class=\"cw\">눈에 보이지 않는 상태로 존재한다는 것을</span>.</div></div><div class=\"rnat\">고대 그리스인들은 이런 식으로 원자 개념을 우연히 처음 떠올렸는데, 빵 굽는 냄새는 그들에게 빵의 작은 입자들이 눈에 보이지 않는 상태로 존재한다는 것을 시사했다.</div><div class=\"rst\">옛날 그리스 사람들도 빵 냄새로 “안 보이는 작은 빵 알갱이가 <b>있구나</b>” 했어요. 지문 4번, 원자 생각의 시작이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">The cycle of weather <span class=\"cw\">reinforced this idea</span>:</div><div class=\"k\">날씨의 순환은 <span class=\"cw\">이 생각을 강화했는데</span>: ※ 문제지엔 disproved로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">a puddle of water on the ground</div><div class=\"k\">땅 위의 물웅덩이는</div></div><div class=\"rc\"><div class=\"e\">gradually dries out, disappears,</div><div class=\"k\">서서히 메말라서, 사라지더니,</div></div><div class=\"rc\"><div class=\"e\">and then falls later as rain.</div><div class=\"k\">나중에 비로 떨어진다.</div></div><div class=\"rnat\">날씨의 순환은 이 생각을 반증했는데(→ 강화했는데), 땅 위의 물웅덩이는 서서히 메말라서, 사라지더니, 나중에 비로 떨어진다.</div><div class=\"rst\">운동장 물웅덩이가 말라 사라졌다가 나중에 비로 다시 내려오죠. = 지문 5번, 이게 그 생각을 <b>더 굳혀 줬어요</b>(reinforced 강화했다).</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">They reasoned</div><div class=\"k\">그들(= 고대 그리스인들)은 추론했다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">there must be particles of water</span></div><div class=\"k\"><span class=\"cw\">물 입자들이 틀림없이 존재하고</span></div></div><div class=\"rc\"><div class=\"e\">that turn into steam, form clouds, and fall to earth,</div><div class=\"k\">수증기로 변하여, 구름을 형성하고, 땅으로 떨어지는</div></div><div class=\"rc\"><div class=\"e\">so that the water is conserved</div><div class=\"k\">그래서 그 물은 보존된다고</div></div><div class=\"rc\"><div class=\"e\">even though the little particles are too small to see.</div><div class=\"k\">비록 그 작은 입자들이 너무 작아서 볼 수 없다 하더라도.</div></div><div class=\"rnat\">그들(고대 그리스인들)은 수증기로 변하여, 구름을 형성하고, 땅으로 떨어지는 물 입자들이 틀림없이 존재하고, 그래서 비록 그 작은 입자들이 너무 작아서 볼 수 없다 하더라도 그 물은 보존된다고 추론했다.</div><div class=\"rst\">그래서 그리스인들은 “안 보여도 물 알갱이가 <b>틀림없이 있어</b>” 하고 추론했어요. 지문 6번, 물은 사라지지 않고 보존된다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">My paella in Spain had inspired me,</div><div class=\"k\">스페인에서 먹은 내 파에야는 나에게 영감을 주었다,</div></div><div class=\"rc\"><div class=\"e\">four thousand years too late,</div><div class=\"k\">4천 년이나 너무 늦게야,</div></div><div class=\"rc\"><div class=\"e\">to take the credit for atomic theory.</div><div class=\"k\">원자 이론에 대한 공로를 인정받도록.</div></div><div class=\"rnat\">스페인에서 먹은 내 파에야는 4천 년이나 너무 늦게야 내가 원자 이론에 대한 공로를 인정받도록 영감을 주었다.</div><div class=\"rst\">나는 파에야 냄새로 원자를 떠올렸지만 4천 년이나 너무 늦었어요. 지문 7번, 원자 이론 공로는 이미 그리스인 차지라는 농담이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"molecule\" data-m=\"분자\"><b>molecule</b>분자</button><button type=\"button\" class=\"wdb\" data-w=\"detect\" data-m=\"감지하다\"><b>detect</b>감지하다</button><button type=\"button\" class=\"wdb\" data-w=\"particle\" data-m=\"입자\"><b>particle</b>입자</button><button type=\"button\" class=\"wdb\" data-w=\"reinforce\" data-m=\"강화하다\"><b>reinforce</b>강화하다</button><button type=\"button\" class=\"wdb\" data-w=\"disprove\" data-m=\"반증하다\"><b>disprove</b>반증하다</button><button type=\"button\" class=\"wdb\" data-w=\"conserve\" data-m=\"보존하다\"><b>conserve</b>보존하다</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
