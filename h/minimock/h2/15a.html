<title>고2 미니모의고사 15회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .at{font-size:13px;color:var(--sub)}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

라진다는 뜻이다."}], "sum": "시기에 따라 같은 결정도 득이 달라지는 타이밍의 중요성"}, {"i": "07", "q": "06", "s": "3", "title": "S+V(진행형) + 전치사구 + 분사구 + 형용사구", "eng": "My future meal was coming to me / in the form of molecules<sup>1</sup> drifting<sup>2</sup> through the air, / too small for my eyes to see but detected<sup>3</sup> by my nose.", "notes": [["1", "molecule", "분자"], ["2", "drift", "떠다니다"], ["3", "detect", "감지하다"]], "lit": "내 미래의 식사가 나에게 오고 있었다 / 공중을 떠다니는 분자의 형태로, / 내 눈으로 보기에는 너무 작지만 내 코에 의해 감지되는.", "nat": "내 미래의 식사는 공중을 떠다니는 분자의 형태로 나에게 오고 있었는데, 그것은 내 눈으로 보기에는 너무 작았지만 코로는 감지되었다.", "ana": "<b>drifting through the air</b>는 molecules를 수식하는 <b>분사구</b>이고, too small for my eyes to see but detected by my nose는 콤마로 이어진 <b>형용사구·분사구 병렬</b>이다.", "pe": "My \u0001future\u0002 meal was coming \u0001to me\u0002 / \u0001in the form of molecules<sup>1</sup> drifting<sup>2</sup> through the air\u0002, / \u0001too small for my eyes to see but detected<sup>3</sup> by my nose\u0002.", "pk": "내 \u0001미래의\u0002 식사가 \u0001나에게\u0002 오고 있었다 / \u0001공중을 떠다니는 분자의 형태로\u0002, / \u0001내 눈으로 보기에는 너무 작지만 내 코에 의해 감지되는\u0002.", "core": "식사가 오고 있었다.", "tags": ["My meal was coming: 1형식 SV (진행). future = 형용사: meal 꾸밈. to me = 전치사구(부사구): was coming 꾸밈, 거의 필수에 가까운 부사구(come to) [기준: 모양 규칙]", "in the form of ~ = 전치사구(부사구): was coming 꾸밈. drifting ~ = 현재분사구(형용사적): molecules 꾸밈", "too small ~ but detected ~ = 형용사구·분사구 <b>병렬</b>: meal(또는 molecules)을 부연하는 수식어"], "steps": [{"t": "이 문장은 <b>S+V(1형식, 과거진행)</b>이다. 뒤에 전치사구와 분사구, 형용사구가 연달아 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: my future meal (나의 미래의 식사. 곧 먹게 될 식사)", "V: was coming (come 오다의 과거진행)", "to me = come이 거의 필수로 요구하는 전치사구 (나에게)", "뼈대 = <b>My future meal was coming to me</b>"]}, {"t": "<b>in the form of molecules</b>는 전치사구(부사구)로 was coming을 꾸민다. 분자의 형태로라는 뜻이다.", "sub": ["drifting through the air = 현재분사구, molecules를 꾸밈. 공중을 떠다니는 (drift 떠다니다)"]}, {"t": "맨 뒤는 분자를 설명하는 두 덩어리가 but으로 병렬된다.", "sub": ["too small for my eyes to see = 내 눈으로 보기에는 너무 작은 (too 형용사 for A to V, for my eyes는 to see의 의미상 주어)", "but detected by my nose = 하지만 내 코에 의해 감지되는 (detect 감지하다의 과거분사)", "molecules를 꾸미는 것으로 보는 기준이다. 식사 전체를 설명하는 것으로 읽어도 뜻은 통한다."]}, {"t": "함정: drifting과 detected는 동사가 아니라 명사를 꾸미는 분사이다. 동사는 was coming 하나이다."}], "sum": "곧 먹게 될 식사, 눈엔 안 보이고 코로만 감지되는 분자로 다가옴"}, {"i": "08", "q": "06", "s": "6", "title": "S+V+O(that절) + 관계절 동사 3개 + so that절", "eng": "They reasoned / that there must be particles<sup>1</sup> of water that turn into steam<sup>2</sup>, form clouds, and fall to earth, / so that the water is conserved<sup>3</sup> / even though the little particles are too small to see.", "notes": [["1", "particle", "입자"], ["2", "steam", "수증기"], ["3", "conserve", "보존되다"]], "lit": "그들은 추론했다 / 수증기로 변하고, 구름을 형성하고, 땅으로 떨어지는 물 입자들이 틀림없이 존재한다고, / 그래서 물이 보존된다고 / 비록 그 작은 입자들이 눈으로 보기에는 너무 작더라도.", "nat": "그들은 수증기로 변했다가 구름이 되고 땅으로 떨어지는 물 입자들이 틀림없이 존재해서, 그 입자들이 너무 작아 눈에 보이지 않더라도 물이 보존된다고 추론했다.", "ana": "<b>that절</b>은 reasoned의 <b>목적어 명사절</b>이고, turn into, form, fall은 particles of water를 선행사로 하는 관계대명사절 안에서 <b>세 개의 병렬 동사</b>이며, so that은 결과를 나타내는 부사절 접속사이다.", "pe": "They reasoned / that there must be particles<sup>1</sup> \u0001of water that turn into steam<sup>2</sup>, form clouds, and fall to earth\u0002, / \u0001so that the water is conserved<sup>3</sup>\u0002 / \u0001even though the little particles are too small to see\u0002.", "pk": "그들은 추론했다 / \u0001수증기로 변하고, 구름을 형성하고, 땅으로 떨어지는\u0002 물 입자들이 틀림없이 존재한다고, / \u0001그래서 물이 보존된다고\u0002 / \u0001비록 그 작은 입자들이 눈으로 보기에는 너무 작더라도\u0002.", "core": "그들은 입자들이 틀림없이 존재한다고 추론했다.", "tags": ["They reasoned: 주어 + 동사, 뒤에 <b>목적어 that절</b>", "that절: there must be particles (there 구문). of water ~ = 전치사구(형용사구): particles 꾸밈. 안의 that turn, form, fall = <b>동사 3개 병렬</b> 관계절", "so that절 = 결과 부사절: must be particles 꾸밈 ('그래서 ~')", "even though절 = 양보 부사절: 앞 내용 꾸밈 ('비록 ~더라도')"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고, 목적어 that절이 매우 길다. 관계절 안 동사 세 개와 so that절, even though절이 겹친다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: they (그들)", "V: reasoned (reason 추론하다의 과거형)", "O: that ~ (명사절)", "뼈대 = <b>They reasoned [that ~]</b>", "that절 안의 뼈대는 there 구문: there must be particles of water = 물 입자들이 틀림없이 존재한다 (particle 입자, must be ~임이 틀림없다)"]}, {"t": "<b>that turn into steam, form clouds, and fall to earth</b>는 <b>관계절(형용사절)</b>로 particles를 꾸민다. 동사 세 개가 병렬된다.", "sub": ["turn into = ~로 변하다 (steam 수증기)", "form clouds = 구름을 형성하다", "fall to earth = 땅으로 떨어지다"]}, {"t": "<b>so that the water is conserved</b>는 that절 안의 <b>결과 부사절</b>이다. 그래서 물이 보존된다는 뜻이다.", "sub": ["is conserved (conserve 보존하다의 수동태)"]}, {"t": "<b>even though the little particles are too small to see</b>는 <b>부사절(양보)</b>이다. 비록 작은 입자들이 보기에는 너무 작더라도라는 뜻이다 (too small to see 너무 작아서 볼 수 없는)."}, {"t": "함정: that turn, form, fall의 세 동사는 모두 관계대명사 that의 동사이고 particles(복수)에 맞춰 원형이다."}], "sum": "물이 눈에 안 보이는 입자로 순환하므로 보존된다고 추론"}], "qs": [{"q": "01", "type": "목적", "src": "2014년 9월 18번", "ans": "⑤", "tr": [["1", "Corcolle에 새로운 400에이커 규모의 쓰레기 매립지를 설치하려는 계획이 발표되었다."], ["2", "Corcolle은 이탈리아뿐 아니라 전 인류에게도 엄청난 문화적 및 자연적 가치가 있는 지역이다."], ["3", "우리의 주의 깊고 영원한 보호가 필요한 가장 분명한 장소만 말하더라도, Hadrian's Villa는 제안된 매립지로부터 불과 얼마 떨어지지 않은 곳에 있다는 점에 주목한다."], ["4", "이 독보적인 유네스코 세계 문화유산은 매년 전 세계 수십만 명의 관광객이 방문한다."], ["5", "그것 또는 그 인접 환경이 제안된 매립지가 분명히 나타내는 그러한 종류의 수모를 겪는 것은 상상도 할 수 없다."], ["6", "심지어 Province of Rome(로마 관할청)과 Ministry of Cultural Property and Activities(문화재 및 문화활동부)조차도 그들의 우려를 표했다."], ["7", "우리는 Hadrian's Villa를 보호하기 위해 Corcolle에 제안된 매립지 프로젝트가 최종적으로 포기될 것이라고 즉시 발표할 것을 Ministry of the Environment(환경부)에 호소한다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "We appeal to the Ministry of the Environment to announce immediately that the proposed project for a landfill at Corcolle will once and for all be abandoned to protect Hadrian's Villa."}, {"en": false, "h": "환경부에 매립지 계획을 철회해 달라고 촉구하는 7번 문장이 이 글의 핵심 목적을 보여준다."}], "opts": [{"n": "①", "t": "정부의 관광산업 육성 정책을 비판하려고", "a": false, "x": true, "trap": false, "e": "관광산업 육성 정책에 관한 내용은 본문에 없다."}, {"n": "②", "t": "유적지 복원을 위한 모금 활동을 홍보하려고", "a": false, "x": true, "trap": false, "e": "모금 활동에 관한 내용은 본문에 없다."}, {"n": "③", "t": "지역 관광단지 개발에 대한 투자를 권유하려고", "a": false, "x": true, "trap": false, "e": "투자 권유에 관한 내용은 본문에 없다."}, {"n": "④", "t": "유적지의 UNESCO 문화유산 지정을 요청하려고", "a": false, "x": true, "trap": true, "e": "Hadrian's Villa는 이미 유네스코 세계 문화유산으로 지정되어 있다."}, {"n": "⑤", "t": "문화유산 주변 매립지 건설 계획 철회를 촉구하려고", "a": true, "x": false, "trap": false, "e": "Hadrian's Villa를 보호하기 위해 Corcolle의 매립지 프로젝트를 철회해 달라고 호소하는 7번 문장의 내용과 정확히 일치한다."}], "w": [["landfill", "쓰레기 매립지"], ["immense", "엄청난"], ["heritage", "유산"], ["degradation", "수모, 비하"], ["province", "(행정 단위) 주"], ["ministry", "(정부의) 부처"], ["abandon", "포기하다"], ["appeal to", "~에 호소하다"]]}, {"q": "02", "type": "불일치", "src": "2021년 3월 28번", "ans": "③", "tr": [["1", "Ingrid Bergman은 1915년 8월 29일 스웨덴 스톡홀름에서 태어났다."], ["2", "그녀의 어머니는 독일인이었고 아버지는 스웨덴인이었다."], ["3", "그녀의 어머니는 그녀가 세 살 때, 아버지는 그녀가 12살 때 돌아가셨다."], ["4", "결국 그녀는 그녀의 삼촌 Otto와 이모 Hulda의 손에 자랐다."], ["5", "그녀는 어릴 적부터 연기에 관심이 있었다."], ["6", "그녀가 17세였을 때 그녀는 스톡홀름에 있는 Royal Dramatic Theater School에 다녔다."], ["7", "그녀는 연극 무대에서 데뷔했지만 영화에서 일하는 것에 더 관심이 있었다."], ["8", "1940년대 초에 그녀는 영화의 여주인공으로 많은 역할을 연기하며, 할리우드에서 스타의 지위를 얻었다."], ["9", "Bergman은 엄청난 연기 재능과 천사 같은 자연스러운 미모, 그리고 영화에서 최선을 이끌어내기 위해 열심히 노력하려는 의지를 지녔다고 여겨졌다."], ["10", "그녀는 다섯 개의 언어에 유창했고 다양한 영화, 연극, TV 방송에 출연했다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "She made her debut on the stage but was more interested in working in films."}, {"en": false, "h": "그녀가 무대에서 데뷔했지만 영화에서 일하는 것에 더 관심이 있었다는 7번 문장에 따르면, 영화를 통해 데뷔했다는 ③은 본문과 일치하지 않는다."}], "opts": [{"n": "①", "t": "어머니는 독일인이었고 아버지는 스웨덴인이었다.", "a": false, "x": true, "trap": false, "e": "2번 문장 'Her mother was German and her father Swedish'와 일치한다."}, {"n": "②", "t": "17세에 Royal Dramatic Theater School에 다녔다.", "a": false, "x": true, "trap": false, "e": "6번 문장 'When she was 17, she attended the Royal Dramatic Theater School'와 일치한다."}, {"n": "③", "t": "영화를 통해 데뷔했으나 연극에 더 관심이 있었다.", "a": true, "x": false, "trap": false, "e": "그녀는 무대(연극)에서 데뷔했지만 영화에 더 관심이 있었다고 했으므로, 본문과 반대로 서술되어 일치하지 않는다."}, {"n": "④", "t": "1940년대 초에 할리우드에서 스타의 지위를 얻었다.", "a": false, "x": true, "trap": true, "e": "8번 문장 'In the early 1940s, she gained star status in Hollywood'와 일치한다."}, {"n": "⑤", "t": "다섯 개의 언어에 유창했다.", "a": false, "x": true, "trap": false, "e": "10번 문장 'She was fluent in five languages'와 일치한다."}], "w": [["pass away", "돌아가시다"], ["bring up", "기르다, 양육하다"], ["attend", "~에 다니다"], ["status", "지위, 상태"], ["tremendous", "엄청난"], ["talent", "재능, 재주"], ["be fluent in", "~에 유창하다"], ["a range of", "다양한"]]}, {"q": "03", "type": "주제", "src": "2019년 11월 23번", "ans": "③", "tr": [["1", "오늘날 우리의 세계는 비교적 해가 없다."], ["2", "우리는 호랑이가 우리 뒤에 있는지 매 순간 주의할 필요가 없다."], ["3", "우리는 굶주림에 대해 걱정할 필요가 없다."], ["4", "오늘날 우리의 위험은, 예를 들어, 고혈압이나 당뇨병이다."], ["5", "명확히 하자면, 우리는 현대 세계에 살고 있는 석기시대의 뇌를 가지고 있다."], ["6", "이 때문에, 우리의 생존에는 무해한데도 많은 상황이 뇌에 의해 위협으로 여겨진다."], ["7", "과거에는, 위험은 도망치거나 싸워야 함을 의미했다."], ["8", "만약 우리가 약속이 있는데 교통 체증에 갇혀 있다면, 그것은 실제로 우리의 생명을 위협하지 않는다."], ["9", "하지만, 우리의 뇌는 이것을 위험으로 여긴다."], ["10", "그것이 핵심이다."], ["11", "위험은 없지만, 우리의 뇌는 그것을 위험으로 여긴다."], ["12", "만약 우리가 배우자와 불쾌한 대화를 나눈다면, 그것은 우리의 생명을 위협하지 않으며, 우리는 도망치거나 싸울 필요가 없다."], ["13", "그 위험은 착각이다."], ["14", "우리의 석기시대 뇌는 존재하지 않는 치명적인 위험을 본다."]], "evh": "5·6번 문장", "ev": [{"en": true, "h": "we have a Stone Age brain that lives in a modern world. Because of this, many situations are considered a threat by our brains, although they are harmless to our survival."}, {"en": false, "h": "현대 세계에 사는 석기시대 뇌 때문에 무해한 상황도 위협으로 여겨진다는 5·6번 문장을 종합하면 주제는 '무해한 상황을 위협으로 인식하는 우리의 인지'이다."}], "opts": [{"n": "①", "t": "the role of instinct in deciding to flee or fight", "a": false, "x": true, "trap": false, "e": "도망칠지 싸울지를 결정하는 본능의 역할에 관한 내용은 본문의 핵심이 아니다."}, {"n": "②", "t": "benefits of danger perception for humans' survival", "a": false, "x": true, "trap": true, "e": "위험 인식이 생존에 주는 이점이 아니라, 무해한 상황을 위협으로 착각하는 문제를 다루는 글이다."}, {"n": "③", "t": "our perception of harmless situations as threatening", "a": true, "x": false, "trap": false, "e": "현대의     if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}

function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
