<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();

function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

지도 모른다 / \u0001가까이 검토해 본 후\u0002 / 기사가 / \u0001당신이 막 공유하려던\u0002 / \u0001명백히\u0002 속이는 것이라는 것을 / 그것이 \u0001정말로\u0002 말하지 않는다는 것을 / 헤드라인이 약속하는 것을 / 또는 당신이 \u0001실제로\u0002 \u0001그것에\u0002 동의하지 않는다는 것을", "core": "당신은 발견할지도 모른다, 기사가 명백히 속이는 것이라는 것, 그것이 말하지 않는다는 것, 당신이 동의하지 않는다는 것을.", "tags": ["주어 You + 동사 may discover. 목적어는 아래 that절 3개", "on close inspection = 전치사구(부사구) 삽입: discover를 꾸밈 (시점)", "첫 번째 that절 (discover의 목적어, 명사절). 주어 an article", "you were about to share = 관계절(형용사절, 목적격 관계대명사 생략): article을 꾸밈", "첫 that절의 동사부: is + 보어 fraudulent (SVC). obviously = 부사: fraudulent를 꾸밈", "두 번째 that절 (병렬, 명사절). 주어 it + 동사 doesn't say. really = 부사: say를 꾸밈", "what절 = say의 목적어 (관계대명사 what, 명사절)", "or that절 = 세 번째 병렬 명사절. actually = 부사: disagree를 꾸밈. with it = 전치사구(부사구): 거의 필수에 가까운 부사구 (disagree with) [기준: 문형 기준]"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어가 that절 3개의 병렬이라서 아주 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: You (당신)", "V: may discover (discover 알아내다, 발견하다 + may ~할지도 모른다)", "O: that절 3개 (병렬 명사절)", "뼈대 = <b>You may discover that A, that B, or that C</b>", "<b>on close inspection</b> (가까이 살펴보면)은 삽입된 전치사구(부사구)로 may discover를 꾸민다. inspection = 검토, 살핌"]}, {"t": "첫 번째 that절은 <b>an article is obviously fraudulent</b> (기사가 명백히 속이는 것이다)이다.", "sub": ["S: an article, V: is, C: fraudulent (사기성의, 속이는)", "<b>you were about to share</b>는 article을 꾸미는 <b>관계절</b>이다. 목적격 관계대명사가 생략되었다. '당신이 막 공유하려던'. be about to V = 막 ~하려고 하다"]}, {"t": "두 번째 that절은 <b>it doesn't really say what the headline promises</b>이다.", "sub": ["S: it, V: doesn't say (say 말하다), really = 정말로", "<b>what the headline promises</b>는 say의 목적어가 되는 명사절이다. '헤드라인이 약속하는 것'. what = 것(the thing that), headline = 헤드라인, promise = 약속하다"]}, {"t": "세 번째 that절은 <b>you actually disagree with it</b> (당신이 실제로는 그것에 동의하지 않는다)이다. or로 앞 that절들과 이어진다.", "sub": ["disagree with = ~에 동의하지 않다 (거의 필수에 가까운 부사구, 문형 기준), actually = 실제로"]}], "sum": "자세히 보면 공유하려던 기사가 가짜이거나 제목과 다르거나 동의 안 됨"}, {"i": "03", "q": "08", "s": "4", "title": "현재완료 수동태 + that절 병렬 + 동명사 보어", "eng": "For decades, / people have been told<sup>1</sup> / that praise is vital<sup>2</sup> / for happy and healthy children / and that the most important job / in raising a child / is nurturing<sup>3</sup> her self-esteem<sup>4</sup>.", "notes": [["1", "be told", "듣게 되다"], ["2", "vital", "필수적인"], ["3", "nurture", "키우다, 양육하다"], ["4", "self-esteem", "자존감"]], "lit": "수십 년간 / 사람들은 들어왔다 / 칭찬이 필수적이라고 / 행복하고 건강한 아이들에게 / 그리고 가장 중요한 일은 / 아이를 양육하는 데 있어 / 그녀의 자존감을 키워주는 것이라고", "nat": "수십 년간 사람들은 칭찬이 행복하고 건강한 아이들에게 필수적이며 아이를 양육하는 데 있어 가장 중요한 일은 그녀의 자존감을 키워주는 것이라고 이야기를 들어왔다.", "ana": "<b>have been told that ~</b>은 <b>현재완료 수동태</b>이며, <b>that praise is vital ~</b>과 <b>that the most important job ~ is nurturing ~</b> 두 개의 <b>명사절</b>이 <b>and</b>로 병렬 연결되어 told의 내용을 이룹니다. <b>nurturing</b>은 be동사 is의 <b>보어로 쓰인 동명사</b>입니다.", "pe": "\u0001For decades\u0002, / people have been told<sup>1</sup> / that praise is vital<sup>2</sup> / \u0001for happy and healthy children\u0002 / and that the \u0001most important\u0002 job / \u0001in raising a child\u0002 / is nurturing<sup>3</sup> her self-esteem<sup>4</sup>.", "pk": "\u0001수십 년간\u0002 / 사람들은 들어왔다 / 칭찬이 필수적이라고 / \u0001행복하고 건강한 아이들에게\u0002 / 그리고 \u0001가장 중요한\u0002 일은 / \u0001아이를 양육하는 데 있어\u0002 / 그녀의 자존감을 키워주는 것이라고", "core": "사람들은 들어왔다, 칭찬이 필수적이고 가장 중요한 일은 자존감을 키워주는 것이라고.", "tags": ["For decades = 전치사구(부사구): have been told를 꾸밈 (기간)", "주어 people + 동사 <b>have been told</b> (현재완료 수동태)", "첫 that절 (told의 내용, 명사절): 주어 praise + 동사 is + 보어 vital", "for ~ = 전치사구(부사구): vital을 꾸밈 (대상)", "and that절 = 두 번째 병렬 명사절. 주어 job (most important = 형용사: job을 꾸밈)", "in raising a child = 전치사구(형용사구): job을 꾸밈", "두 번째 that절의 동사 is + 보어 nurturing (동명사)"], "steps": [{"t": "이 문장은 <b>S+V(수동태, 1형식)</b>이다. 뒤에 that절 두 개가 and로 이어져 길어 보인다. 수동태 뒤에 남은 that절은 뼈대 밖으로 본다(문형 기준)."}, {"t": "뼈대부터 찾는다.", "sub": ["S: people (사람들)", "V: have been told (tell 말하다, 알려 주다의 현재완료 수동태, '들어 왔다')", "뼈대 = <b>people have been told</b>", "<b>For decades</b> (수십 년간)는 have been told를 꾸미는 부사구이다. decade = 십 년"]}, {"t": "첫 번째 that절은 <b>praise is vital</b> (칭찬이 필수적이다)이다.", "sub": ["S: praise (칭찬), V: is, C: vital (필수적인)", "<b>for happy and healthy children</b> (행복하고 건강한 아이들에게)은 vital을 꾸미는 전치사구이다."]}, {"t": "<b>and that</b> 이하가 두 번째 that절이다. 뼈대는 <b>the most important job is nurturing her self-esteem</b>이다.", "sub": ["S: the most important job (가장 중요한 일), V: is, C: nurturing her self-esteem (그녀의 자존감을 키워 주는 것, 동명사 보어)", "nurture = 키우다, self-esteem = 자존감"]}, {"t": "<b>in raising a child</b> (아이를 키우는 데 있어)는 job을 꾸미는 전치사구이다. raise = 키우다", "sub": ["her는 앞의 a child를 가리킨다."]}], "sum": "수십 년간 칭찬과 자존감 키우기가 중요하다고 들어 옴"}, {"i": "04", "q": "08", "s": "6", "title": "부사적 to부정사(의미상 주어) + convince A that", "eng": "For your children to succeed and be happy, / you need / to convince<sup>1</sup> them / that success comes from effort<sup>2</sup>, / not from some talent<sup>3</sup> / that they're born with<sup>4</sup> or without.", "notes": [["1", "convince A that", "A에게 ~라고 확신시키다"], ["2", "effort", "노력"], ["3", "talent", "재능"], ["4", "be born with", "~을 타고나다"]], "lit": "당신의 아이들이 성공하고 행복하기 위해서 / 당신은 필요가 있다 / 그들을 확신시킬 / 성공이 노력으로부터 온다는 것을 / 어떤 재능으로부터가 아니라 / 그들이 가지거나 가지지 못하고 태어난", "nat": "당신의 아이들이 성공하고 행복하기 위해서, 당신은 그들에게 성공이 그들이 가지거나 가지지 못하고 태어난 어떤 재능으로부터가 아니라, 노력으로부터 온다는 것을 확신시켜 줄 필요가 있다.", "ana": "<b>For your children</b>은 to부정사(to succeed and be happy)의 <b>의미상 주어</b>입니다. <b>convince A that ~</b>은 'A에게 ~라고 확신시키다'라는 뜻이며, <b>that they're born with or without</b>은 <b>some talent</b>를 꾸미는 <b>목적격 관계대명사절</b>로 with/without의 목적어가 비어 있습니다.", "pe": "\u0001For your children to succeed and be happy\u0002, / you need / to convince<sup>1</sup> them / that success comes \u0001from effort<sup>2</sup>\u0002, / \u0001not from some talent<sup>3</sup>\u0002 / \u0001that they're born with<sup>4</sup> or without\u0002.", "pk": "\u0001당신의 아이들이 성공하고 행복하기 위해서\u0002 / 당신은 필요가 있다 / 그들을 확신시킬 / 성공이 \u0001노력으로부터\u0002 온다는 것을 / \u0001어떤 재능으로부터가 아니라\u0002 / \u0001그들이 가지거나 가지지 못하고 태어난\u0002", "core": "당신은 그들에게 성공이 노력으로부터 온다는 것을 확신시켜 줄 필요가 있다.", "tags": ["For A to R = to부정사(부사적: 목적): need를 꾸밈. For your children은 의미상 주어", "주어 you + 동사 need + 목적어 to부정사", "to convince them = need의 목적어. convince A that ~ (A에게 ~라고 확신시키다)", "that절 = convince의 목적어 (명사절). from effort = 전치사구(부사구): comes를 꾸밈, 거의 필수에 가까운 부사구 (come from) [기준: 문형 기준]", "not from ~ = 전치사구(부사구) 대조: comes를 꾸밈 (A가 아니라 B). 앞 from effort와 짝", "that ~ = 관계절(형용사절, 목적격): talent를 꾸밈. born with or without 뒤 목적어가 빠진 상태"], "steps": [{"t": "이 문장은 <b>to부정사 부사구 + S+V+O(3형식)</b>이다. 맨 앞 to부정사와 목적어 뒤의 that절 때문에 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: you (당신)", "V: need (need 필요하다)", "O: to convince them that ~ (그들에게 ~라고 확신시키는 것, to부정사 목적어)", "뼈대 = <b>you need to convince them that ~</b>", "them = your children (당신의 아이들)", "convince A that ~ = A에게 ~라고 확신시키다"]}, {"t": "맨 앞 <b>For your children to succeed and be happy</b>는 <b>to부정사(부사적: 목적)</b>이다. '아이들이 성공하고 행복하려면'이라는 뜻이다.", "sub": ["for your children은 to succeed의 의미상 주어이다. succeed = 성공하다"]}, {"t": "convince의 내용은 <b>that success comes from effort</b> (성공은 노력에서 온다)이다.", "sub": ["S: success (성공), V: comes (come 오다), from effort (노력에서)는 come from 짝이라 거의 필수에 가까운 부사구이다. (문형 기준)"]}, {"t": "<b>not from some talent</b> (어떤 재능에서가 아니라)는 앞 from effort와 대조되는 전치사구이다. '~이지 …가 아니다'라는 뜻의 not 짝이다.", "sub": ["talent = 재능"]}, {"t": "<b>that they're born with or without</b>은 talent를 꾸미는 <b>관계절</b>이다. 목적격이고, born with or without 뒤의 목적어가 빠졌다. '그들이 가지고 또는 못 가지고 태어난'이라는 뜻이다.", "sub": ["be born with = ~을 가지고 태어나다"]}], "sum": "아이가 성공하려면 재능 아닌 노력의 결과임을 알려 줘야 함"}, {"i": "05", "q": "09", "s": "G-1", "title": "동명사 주어 + S+V+C 병렬 보어", "eng": "Applying<sup>1</sup> a single plan / to everything / can be inefficient<sup>2</sup> / and sometimes comical<sup>3</sup>.", "notes": [["1", "apply", "적용하다"], ["2", "inefficient", "비효율적인"], ["3", "comical", "우스꽝스러운"]], "lit": "단 하나의 계획을 적용하는 것은 / 모든 것에 / 비효율적일 수 있다 / 그리고 때로는 우스꽝스러울 수 있다", "nat": "단 하나의 계획을 모든 것에 적용하는 것은 비효율적이고 때로는 우스꽝스러울 수 있다.", "ana": "<b>Applying a single plan to everything</b>은 문장의 <b>동명사 주어</b>이며, <b>be동사 can be</b> 뒤에 <b>inefficient</b>와 <b>comical</b>이라는 두 형용사가 <b>and</b>로 병렬 연결된 보어입니다.", "pe": "Applying<sup>1</sup> a \u0001single\u0002 plan / \u0001to everything\u0002 / can be inefficient<sup>2</sup> / and \u0001sometimes\u0002 comical<sup>3</sup>.", "pk": "\u0001단 하나의\u0002 계획을 적용하는 것은 / \u0001모든 것에\u0002 / 비효율적일 수 있다 / 그리고 \u0001때로는\u0002 우스꽝스러울 수 있다", "core": "적용하는 것은 비효율적이고 우스꽝스러울 수 있다.", "tags": ["동명사 주어: Applying a single plan (single = 형용사: plan을 꾸밈)", "to everything = 전치사구(부사구): applying을 꾸밈, 거의 필수에 가까운 부사구 (apply A to B) [기준: 문형 기준]", "동사 can be + 보어 inefficient (SVC)", "and 병렬 보어 comical. sometimes = 부사: comical을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어가 동명사구이고 보어가 and로 이어져 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Applying a single plan (하나의 계획을 적용하는 것, 동명사 주어)", "V: can be (be ~일 수 있다)", "C: inefficient and comical (비효율적이고 우스꽝스러운, and로 병렬)", "뼈대 = <b>Applying a single plan can be inefficient and comical</b>", "single = 단 하나의, inefficient = 비효율적인, comical = 우스꽝스러운"]}, {"t": "<b>to everything</b> (모든 것에)은 apply A to B의 B로 applying과 거의 필수에 가까운 부사구이다. (문형 기준)", "sub": ["apply = 적용하다"]}, {"t": "<b>sometimes</b> (때로는)는 comical만 꾸미는 부사이다. 그래서 '비효율적이고, 때로는 우스꽝스러울 수 있다'로 읽는다."}, {"t": "주어가 동명사라서 단수 취급하고, 동사는 can be이다."}], "sum": "하나의 계획을 모든 것에 쓰면 비효율적이고 때론 우스움"}, {"i": "06", "q": "09", "s": "A-2", "title": "if 조건절 + so ~ that + what절", "eng": "But if you used the same plan / for taking lecture notes<sup>1</sup>, / you'd move so slowly / that you'd miss / most / of what the instructor<sup>2</sup> said.", "notes": [["1", "lecture note", "강의 필기"], ["2", "instructor", "강사"], ["3", "so ~ that", "너무 ~해서 …하다"]], "lit": "하지만 만약 당신이 똑같은 계획을 사용한다면 / 강의 필기를 위해 / 당신은 너무 느리게 움직여서 / 당신은 놓칠 것이다 / 대부분을 / 강사가 말한 것의", "nat": "그러나 만약 여러분이 강의 필기를 위해 똑같은 계획을 사용한다면, 여러분은 너무 속도가 느려서 강사가 말한 것의 대부분을 놓칠 것이다.", "ana": "<b>if절</b>(조건) 뒤에 <b>so + 부사 + that절</b>(너무 ~해서 …하다) 구문이 이어집니다. <b>what the instructor said</b>는 miss의 목적어로 쓰인 <b>관계대명 f the crowded store</b>는 <b>전치사구(부사구)</b>로 come을 꾸민다. '붐비는 가게의 다른 곳에서'.", "sub": ["crowded = 붐비는, store = 가게"]}, {"t": "shut down과 wait는 둘 다 have to 뒤에 오는 동사원형이다. 병렬임을 놓치지 않는다."}], "sum": "그녀, 계산대 닫고 관리자가 오길 기다려야 할 처지"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2019년 9월 32번", "ans": "③", "tr": [["1", "가짜 뉴스 확산의 대부분은 무책임한 공유를 통해 일어난다."], ["2", "2016년 뉴욕시의 컬럼비아 대학과 프랑스의 기술 연구소인 Inria의 한 연구는 소셜 미디어에 공유된 링크로부터의 뉴스 중 59퍼센트가 먼저 읽히지 않았다는 것을 발견했다."], ["3", "사람들은 그들의 뉴스 피드나 다른 웹 사이트에서 호기심을 자극하는 헤드라인이나 사진을 보고 그런 다음 전체 기사(원문 기사)를 클릭해 넘어가 보지 않은 채로, 그들의 소셜 미디어 친구들에게 그 항목을 다시 게시하기 위해 공유 버튼을 클릭한다."], ["4", "그렇다면 그들은 가짜 뉴스를 공유하고 있는 것인지도 모른다."], ["5", "가짜 뉴스의 확산을 막기 위해서(당신이) 기사들을 공유하기 전에 그것들을 읽어 보라."], ["6", "당신이 당신의 소셜 미디어 친구들에게 무슨 정보를 보내는지를 알 만큼 그들을 충분히 존중하라."], ["7", "당신은 가까이 검토해 본 후 당신이 막 공유하려던 기사가 명백히 속이는 내용이거나, 그것이 헤드라인이 (보여줄 것이라고) 약속하는 바를 정말로 말하지 않는다는 것, 혹은 당신이 실제로 그것에 동의하지 않는다는 것을 발견할지도 모른다."]], "evh": "3·4번 문장", "ev": [{"en": true, "h": "People see an intriguing headline or photo ~ and then click the Share button to repost the item to their social media friends — without ever clicking through to the full article. Then they may be sharing fake news."}, {"en": false, "h": "빈칸 문제는 빈칸이 있는 문장 뒤에서 구체적으로 설명하는 내용이 근거입니다. 3·4번에서 사람들이 기사 전문을 <b>읽어 보지도 않고</b> 헤드라인만 보고 <b>공유</b>한다고 했으므로, 가짜 뉴스 확산의 원인은 바로 이런 '<b>무책임한 공유(irresponsible sharing)</b>'입니다."}], "opts": [{"n": "①", "t": "political campaigns", "a": false, "x": true, "trap": false, "e": "정치 캠페인(political campaigns)에 관한 내용은 본문에 없습니다."}, {"n": "②", "t": "irrational censorship", "a": false, "x": true, "trap": false, "e": "오히려 이 글은 검열(censorship)이 아니라 <b>공유 행위</b>를 다룹니다."}, {"n": "③", "t": "irresponsible sharing", "a": true, "x": false, "trap": false, "e": "기사를 읽지도 않고 헤드라인만 보고 공유하는 3·4번의 행동이 그대로 '<b>무책임한 공유</b>'입니다."}, {"n": "④", "t": "overheated marketing", "a": false, "x": true, "trap": false, "e": "마케팅(marketing)에 관한 내용은 본문과 무관합니다."}, {"n": "⑤", "t": "statistics manipulation", "a": false, "x": true, "trap": true, "e": "통계 조작(statistics manipulation)에 관한 내용은 없습니다."}], "w": [["irresponsible", "무책임한"], ["institute", "연구소, 기관"], ["intriguing", "호기심을 자극하는"], ["repost", "다시 게시하다"], ["click through", "웹 사이트로 클릭해 넘어가다"], ["inspection", "검점, 사찰"], ["fraudulent", "속이는, 사기의"], ["irrational", "불합리한, 비논리적인"], ["censorship", "검열"], ["manipulation", "조작, 속임수"]]}, {"q": "08", "type": "문장 삽입", "src": "2018년 6월 38번", "ans": "④", "tr": [["1", "[주어진 문장] 하지만 최근에 몇몇 연구자들은 사람들이 어떻게 칭찬을 받는지(사람들이 칭찬받는 방식)이 매우 중요하다는 것을 알아냈다."], ["2", "한 아이가 그녀의 학업 성적을 손에 들고 당신에게 폴짝 뛰어온다."], ["3", "아마도 그녀는 당신의 딸이거나, 사촌이거나, 이웃일 것이다."], ["4", "( ① ) 그녀는 자랑스럽게 당신에게 그녀의 시험지 하단에 있는 커다란 빨간색의 A를 보여준다."], ["5", "( ② ) 당신은 그녀를 어떻게 칭찬할 것인가?"], ["6", "( ③ ) 수십 년간 사람들은 칭찬이 행복하고 건강한 아이들에게 필수적이며 아이를 양육하는 데 있어 가장 중요한 일은 그녀의 자존감을 키워주는 것이라고 이야기를 들어왔다."], ["7", "( ④ ) 그들은 만일 당신이 당신에게 A를 보여준 아이에게 \"넌 정말 �똑한 여자아이구나!\"라고 말한다면, 당신이 그녀에게 득보다는 해를 입힐지도 모른다는 것을 알아냈다."], ["8", "( ⑤ ) 당신의 아이들이 성공하고 행복하기 위해서, 당신은 그들에게 성공이 그들이 가지거나 가지지 못하고 태어난 어떤 재능으로부터가 아니라, 노력으로부터 온다는 것을 확신시켜 줄 필요가 있다."]], "evh": "④ 앞뒤", "ev": [{"en": true, "h": "(③ 뒤) For decades, people have been told that praise is vital ~ nurturing her self-esteem. / (주어진 문장) Recently, however, some researchers found that how people are praised is very important. / (④ 뒤) They discovered that if you say ~"}, {"en": false, "h": "문장 삽입은 <b>지시어와 주어의 일치</b>가 결정적입니다. ④ 뒤 문장의 <b>They discovered</b>에서 <b>They</b>가 가리킬 대상이 필요한데, 그 바로 앞인 ③~④ 사이에는 <b>some researchers</b>라는 주어가 없습니다. 주어진 문장의 <b>some researchers found</b>가 바로 그 They의 정체이므로, 주어진 문장은 <b>④ 자리</b>에 들어가야 <b>they = researchers</b>가 자연스럽게 연결됩니다."}], "opts": [{"n": "①", "t": "(①) 앞", "a": false, "x": true, "trap": false, "e": "이 자리 앞뒤는 아직 <b>칭찬에 대한 배경 설명</b>이 시작되기 전, 아이가 성적표를 보여주는 상황만 나온 자리입니다."}, {"n": "②", "t": "(②) 앞", "a": false, "x": true, "trap": false, "e": "이 자리는 '어떻게 칭찬할 것인가'라는 <b>질문을 던지는 자리</b>로, 아직 최근 연구자들 이야기가 나오기엔 이릅니다."}, {"n": "③", "t": "(③) 앞", "a": false, "x": true, "trap": true, "e": "이 자리 뒤에는 <b>수십 년간의 통념(칭찬이 중요하다)</b>이 나오는데, 이는 <b>however로 반박되기 전</b>의 배경 설명이므로 주어진 문장이 여기 오면 흐름이 깨집니다."}, {"n": "④", "t": "(④) 앞", "a": true, "x": false, "trap": false, "e": "주어진 문장의 <b>some researchers found</b>가 ④ 뒤 문장의 <b>They discovered</b>와 정확히 연결됩니다."}, {"n": "⑤", "t": "(⑤) 앞", "a": false, "x": true, "trap": false, "e": "이 자리 뒤는 이미 결론(노력이 중요하다)으로 넘어간 자리라, 여기에 주어진 문장을 넣으면 <b>They</b>가 가리킬 대상이 어색해집니다."}], "w": [["proudly", "자랑스럽게, 의기양양하게"], ["be told", "(소문·소식 등을) 듣다"], ["raise", "양육하다, 기르다"], ["self-esteem", "자존감, 자부심"], ["harm", "해, 손해; 해를 끼치다"], ["convince", "확신시키다, 설득하다"]]}, {"q": "09", "type": "글의 순서", "src": "2015년 11월 36번", "ans": "⑤", "tr": [["1", "단 하나의 계획을 모든 것에 적용하는 것은 비효율적이고 때로는 우스꽝스러울 수 있다."], ["2", "아마도 여러분은 농부에게서 지불받은 돈을 잃어버려서 어머니에게 혼이 나는 게으른 아들에 관한 민담을 기억할 것이다."], ["3", "(C) '다음에 급료를 받을 때는 반드시 그것을 네 주머니에 넣어서 집에 가져와라'라고 어머니는 엄격하게 말한다. 그러나 다음날 그 소년은 낙농업 농부를 위해 일하러 가지만, 그는 돈 대신에 우유 한 통으로 대가를 지불한다."], ["4", "(B) 어머니를 화나게 하지 않기를 간절히 바라며, 그 소년은 충실하게 우유를 자신의 주머니에 쏟아붓는다. 그의 어머니의 계획은 훌륭했지만, 그것은 적절한 상황에서 쓰일 때만 효과가 있었다. 똑같은 개념이 여러분의 학습 계획에도 적용된다."], ["5", "(A) 예를 들어, 목표가 교과서를 공부하는 것이라면 완전한 문장으로 필기하는 것은 이치에 맞다. 그러나 만약 여러분이 강의 필기를 위해 똑같은 계획을 사용한다면, 여러분은 너무 (필기하는) 속도가 느려서 강사가 말한 것의 대부분을 놓칠 것이다. 비결은 여러분의 목표에 맞는 계획을 찾는 것이다."]], "evh": "(C) 첫 문장 · (B) 첫 문장 · (A) 첫 문장", "ev": [{"en": true, "h": "(C) 'Next time you get paid,' his mother says sternly... / (B) Anxious not to anger his mother, the boy dutifully pours the milk into his pocket. / (A) For example, writing out your notes in full sentences ~"}, {"en": false, "h": "순서 문제는 <b>대명사·정관사가 가리키는 대상</b>과 사건의 흐름을 따라가야 합니다. 주어진 글에서 아들이 <b>돈을 잃어버렸다(losing the money)</b>고 했으므로, 그 사건의 원인이 되는 어머니의 <b>지시(C)</b>가 먼저 나와야 합니다. (C)에서 소년이 <b>우유로 대가를 받는</b> 상황이 되므로, 그 우유를 <b>주머니에 쏟아붓는(B)</b>가 이어집니다. (B) 끝의 '<b>학습 계획에도 같은 개념이 적용된다</b>'는 문장이 <b>For example(A)</b>로 구체화되며 마무리됩니다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)는 <b>학습 계획의 예시</b>이므로, 아직 소년 이야기(우유 사건)가 나오지 않은 상태에서 예시부터 나올 수 없습니다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": fa   WS.words.forEach((w,i)=>{

    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    if(c[p]){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent='오답노트장에 담았어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1400);}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
