var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>Therefore</b>(그러므로) 뒤와 맨 끝 <b>명령문</b>(Ask 질문하라)에 있어요. 1~3번 ‘논리로 밀어붙이기’는 안 되는 방법이니, 반복되는 <b>well-chosen questions</b>(잘 고른 질문)를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 흔한 방법 뒤집기</span><div class=\"en\"><mark>But</mark> when you think about it, you'll realize that this doesn't often work.</div><p class=\"ko\"><mark>하지만</mark> 생각해 보면, 이것(= 논리적 주장과 항변)이 종종 효과가 없다는 것을 깨달을 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>안 통하는 방법 대신 ‘더 좋은 방법’을 꺼내요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 대안 제시</span><div class=\"en\">You'll have better luck if you ask <mark>well-chosen, open-ended questions</mark> that let someone <mark>challenge their own assumptions</mark>.</div><p class=\"ko\">누군가가 자기 자신의 가정(전제)을 <mark>의심하게 하는</mark> <mark>잘 선택된, 다양한 답이 가능한 질문</mark>을 한다면, 더 좋은 운이 따를 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>Therefore(그러므로)로 4~5번을 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결론 신호</span><div class=\"en\"><mark>Therefore,</mark> encouraging someone to question their own worldview will often yield better results than trying to force them …</div><p class=\"ko\"><mark>그러므로</mark> 누군가에게 자기 세계관에 의문을 갖도록 장려하는 것은 … 강요하려는 것보다 더 나은 결과를 가져올 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>명령문 = 필자가 하고 싶은 말 그 자체</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 명령문으로 못 박기</span><div class=\"en\"><mark>Ask someone well-chosen questions</mark> to look at their own views from another angle</div><p class=\"ko\">자기 자신의 관점을 다른 각도에서 바라보도록 <mark>누군가에게 잘 선택된 질문을 하라</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">설득하고자 할 때 상대방이 스스로 관점을 돌아보게 하는 질문을 하라.<small>7번 Ask(질문하라) + their own views(자기 자신의 관점)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">논쟁을 잘하려면 자신의 가치관에서 벗어나려는 시도를 하라.</span><span class=\"why\">[지문에 없음] 6번에서 자기 세계관(their own worldview)을 의심하는 사람은 ‘나’가 아니라 설득당하는 상대예요. 또 지문은 논쟁이 아니라 설득 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">타인의 신뢰를 얻기 위해서는 일관된 행동을 보여 주어라.</span><span class=\"why\">[지문에 없음] 신뢰나 일관된 행동은 한 번도 안 나와요. 지문의 방법은 행동이 아니라 질문(questions)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">협상을 잘하기 위해 질문에 담긴 상대방의 의도를 파악하라.</span><span class=\"why\">[반대] 질문을 하는 쪽은 상대가 아니라 ‘나’예요. 4번·7번은 내가 질문을 던지라고 하지, 상대 질문의 의도를 읽으라고 하지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">원만한 대인 관계를 유지하려면 상대를 배려하는 태도를 갖춰라.</span><span class=\"why\">[범위 넓음] 지문은 사람 사이 관계 전체가 아니라 마음을 바꾸게 하는 설득(convince 설득하다) 방법만 말해요. 배려라는 말도 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When trying to convince someone</div><div class=\"k\">누군가를 설득하려고 할 때,</div></div><div class=\"rc\"><div class=\"e\">to change their mind,</div><div class=\"k\">그(= 누군가)의 마음을 바꾸도록,</div></div><div class=\"rc\"><div class=\"e\">most people try</div><div class=\"k\">대부분의 사람들은 시도한다</div></div><div class=\"rc\"><div class=\"e\">to lay out a logical argument,</div><div class=\"k\">논리적 주장을 펼치려고</div></div><div class=\"rc\"><div class=\"e\">or make a passionate plea</div><div class=\"k\">또는 열정적인 항변을 한다</div></div><div class=\"rc\"><div class=\"e\">as to why their view is right</div><div class=\"k\">왜 자신(= 설득하는 사람)의 관점이 옳은지에 대해</div></div><div class=\"rc\"><div class=\"e\">and the other person's opinion is wrong.</div><div class=\"k\">그리고 다른 사람의 의견이 틀린지에 대해.</div></div><div class=\"rnat\">누군가에게 그들의 마음을 바꾸도록 설득하려고 할 때, 대부분의 사람들은 논리적 주장을 펼치려고 하거나 왜 자신의 견해가 옳고 다른 사람의 의견이 틀렸는지에 대해 열정적인 항변을 한다.</div><div class=\"rst\">밤늦게까지 게임하는 친구를 말릴 때, 우리는 “그건 틀렸어, 내 말이 맞아!” 하고 이유를 줄줄이 늘어놔요. = 지문 1번의 논리적 주장과 항변이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">But when you think about it,</div><div class=\"k\">하지만 그것에 대해 생각해 보면,</div></div><div class=\"rc\"><div class=\"e\">you'll realize</div><div class=\"k\">당신은 깨달을 것이다</div></div><div class=\"rc\"><div class=\"e\">that this doesn't often work.</div><div class=\"k\">이것(= 논리적 주장과 항변)이 종종 효과가 없다는 것을.</div></div><div class=\"rnat\">하지만 당신이 그것에 대해 생각해 보면, 당신은 이것이 종종 효과가 없다는 것을 깨달을 것이다.</div><div class=\"rst\"><b>하지만</b>(But) 잘 생각해 보면 이 방법은 거의 안 통해요. 지문 2번도 이것이 종종 효과가 없다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">As soon as someone figures out</div><div class=\"k\">누군가가 알아차리자마자</div></div><div class=\"rc\"><div class=\"e\">that you are on a mission</div><div class=\"k\">당신이 임무를 띠고 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">to change their mind,</div><div class=\"k\">그(= 누군가)의 마음을 바꾸려는,</div></div><div class=\"rc\"><div class=\"e\">the metaphorical shutters go down.</div><div class=\"k\">은유적인 셔터가 내려진다.</div></div><div class=\"rnat\">누군가가 당신이 자신의 마음을 바꾸려는 임무를 띠고 있다는 것을 알아차리자마자, 은유적인 셔터가 내려진다.</div><div class=\"rst\">친구는 “또 잔소리네” 하고 마음의 문을 탁 닫아요. = 지문 3번, 셔터(shutters)가 내려가는 거예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">You'll have better luck</div><div class=\"k\">당신은 더 좋은 운이 따를 것이다</div></div><div class=\"rc ckc\"><div class=\"e\">if you ask <span class=\"cw\">well-chosen, open-ended questions</span></div><div class=\"k\">만약 <span class=\"cw\">잘 선택된, 다양한 답이 가능한 질문을</span> 한다면</div></div><div class=\"rc ckc\"><div class=\"e\">that let someone <span class=\"cw\">challenge</span></div><div class=\"k\">그(= 질문)가 누군가로 하여금 <span class=\"cw\">의심하게 하는</span></div></div><div class=\"rc\"><div class=\"e\">their own assumptions.</div><div class=\"k\">자기 자신의 가정(전제)을.</div></div><div class=\"rnat\">만약 당신이 누군가가 자기 자신의 가정(전제)을 의심하도록 잘 선택된, 다양한 답이 가능한 질문을 한다면 당신은 더 좋은 운이 따를 것이다.</div><div class=\"rst\">대신 “아침에 일어날 때 기분 어때?”처럼 <b>잘 고른 질문</b>을 던져 봐요. 지문 4번처럼 친구가 자기 생각을 스스로 의심해 보게 돼요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">We tend to approve of an idea</div><div class=\"k\">우리는 어떤 견해를 인정하려는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">if we thought of it first</div><div class=\"k\">우리가 그것(= 그 견해)을 먼저 생각해 냈을 때</div></div><div class=\"rc\"><div class=\"e\">— or at least,</div><div class=\"k\">혹은 적어도</div></div><div class=\"rc\"><div class=\"e\">if we think we thought of it first.</div><div class=\"k\">우리가 그것을 먼저 생각해 냈다고 '생각할' 때.</div></div><div class=\"rnat\">우리는 우리가 어떤 견해를 먼저 생각해 냈을 때, 혹은 적어도 우리가 그것을 먼저 생각해 냈다고 '생각할' 때, 그것을 인정하려는 경향이 있다.</div><div class=\"rst\">사람은 자기가 먼저 떠올린 생각을 더 좋아해요. 친구가 “일찍 자야겠다”를 스스로 생각했다고 느끼면 받아들여요. = 지문 5번이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Therefore,</span></div><div class=\"k\"><span class=\"cw\">그러므로</span></div></div><div class=\"rc\"><div class=\"e\">encouraging someone</div><div class=\"k\">누군가에게 장려하는 것은</div></div><div class=\"rc\"><div class=\"e\">to question their own worldview</div><div class=\"k\">자기 자신의 세계관에 의문을 갖도록</div></div><div class=\"rc\"><div class=\"e\">will often yield better results</div><div class=\"k\">종종 더 나은 결과를 가져올 것이다</div></div><div class=\"rc\"><div class=\"e\">than trying to force them</div><div class=\"k\">그들에게 강요하려는 것보다</div></div><div class=\"rc\"><div class=\"e\">into accepting your opinion as fact.</div><div class=\"k\">당신의 의견을 사실로 받아들이도록.</div></div><div class=\"rnat\">그러므로 누군가에게 자기 자신의 세계관에 의문을 갖도록 장려하는 것은 당신의 의견을 사실로 받아들이도록 그들에게 강요하려는 것보다 종종 더 나은 결과를 가져올 것이다.</div><div class=\"rst\"><b>그러므로</b>(Therefore) 내 말을 억지로 믿게 하기보다 친구가 자기 생각에 물음표를 붙이게 하는 게 나아요. 지문 6번의 결론이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Ask someone well-chosen questions</span></div><div class=\"k\"><span class=\"cw\">누군가에게 잘 선택된 질문을 하라</span></div></div><div class=\"rc\"><div class=\"e\">to look at their own views</div><div class=\"k\">자기 자신의 관점을 바라보도록</div></div><div class=\"rc\"><div class=\"e\">from another angle,</div><div class=\"k\">다른 각도에서,</div></div><div class=\"rc\"><div class=\"e\">and this might trigger fresh insights.</div><div class=\"k\">그러면 이것(= 그렇게 질문하는 것)은 새로운 통찰을 유발할 것이다.</div></div><div class=\"rnat\">누군가에게 자기 자신의 관점을 다른 각도에서 바라보도록 잘 선택된 질문을 하라, 그러면 이것은 새로운 통찰을 유발할 것이다.</div><div class=\"rst\">그러니 <b>잘 고른 질문을 하세요</b>(Ask 질문하라). 친구가 다른 각도에서 자기를 보면 새 깨달음이 생겨요. 이게 지문 7번, 필자의 주장이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"convince\" data-m=\"설득하다\"><b>convince</b>설득하다</button><button type=\"button\" class=\"wdb\" data-w=\"open-ended\" data-m=\"다양한 답이 가능한\"><b>open-ended</b>다양한 답이 가능한</button><button type=\"button\" class=\"wdb\" data-w=\"challenge\" data-m=\"의심하다, 이의를 제기하다\"><b>challenge</b>의심하다, 이의를 제기하다</button><button type=\"button\" class=\"wdb\" data-w=\"assumption\" data-m=\"가정, 전제\"><b>assumption</b>가정, 전제</button><button type=\"button\" class=\"wdb\" data-w=\"approve of\" data-m=\"~을 인정하다\"><b>approve of</b>~을 인정하다</button><button type=\"button\" class=\"wdb\" data-w=\"trigger\" data-m=\"유발하다\"><b>trigger</b>유발하다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">심경 변화는 <b>맨 앞 감정</b>과 <b>맨 뒤 감정</b>만 잡으면 돼요. 편지를 <b>뜯기 전</b>(간절히 기다림)과 <b>읽은 뒤</b>(펄쩍 뜀)가 갈리는 지점이 편지 내용이에요.</p><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 처음 감정</span><div class=\"en\">She was sure this must be what she was <mark>eagerly waiting for</mark>.</div><p class=\"ko\">그녀는 이것이 그녀가 <mark>간절히 기다렸던 것</mark>이 틀림없다고 확신했다.</p></div><div class=\"ck-via\"><i>▼</i><span>기다리던 것이라 확신하니 망설임이 없어요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 기대가 행동으로</span><div class=\"en\"><mark>Without hesitation,</mark> she tore open the envelope.</div><p class=\"ko\"><mark>망설임 없이,</mark> 그녀는 봉투를 뜯어 열었다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>9번</em>저희 회사에 지원해 주셔서 감사합니다</span><span><em>10번</em>인턴십 프로그램에 초대하고 싶어요</span><span><em>11번</em>곧 만나기를 기대해요</span></div><div class=\"ck-eq\">⇒ 편지 내용 = 기다리던 합격 소식 → 감정이 바뀌는 지점</div></div><div class=\"ck-via\"><i>▼</i><span>합격 소식을 읽은 뒤의 몸짓</span></div><div class=\"ck-step key\"><span class=\"lab\">12번 문장 · 나중 감정</span><div class=\"en\">She <mark>jumped up and down</mark> and looked down at the letter again.</div><p class=\"ko\">그녀는 <mark>펄쩍 뛰었고</mark> 편지를 다시 내려보았다.</p></div><div class=\"ck-via\"><i>▼</i><span>빨리 알리고 싶을 만큼 신이 났어요</span></div><div class=\"ck-step\"><span class=\"lab\">13번 문장 · 한 번 더 확인</span><div class=\"en\">She <mark>couldn't wait</mark> to tell this news to her family.</div><p class=\"ko\">그녀는 이 소식을 가족에게 <mark>몹시</mark> 말하고 싶었다(기다릴 수 없었다).</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">anticipating → excited 기대하는 → 신이 난<small>간절히 기다림(기대) → 펄쩍 뜀(신남), 양 끝이 딱 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">confident → ashamed 자신감 있는 → 부끄러운</span><span class=\"why\">앞은 6번 She was sure(확신했다) 때문에 그럴듯해요. 하지만 뒤가 틀려요. 합격 편지를 받고 펄쩍 뛰었으니 부끄러울 일이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">curious → embarrassed 궁금한 → 당황한</span><span class=\"why\">앞은 궁금함보다 간절한 기다림(eagerly waiting 간절히 기다리던)이고, 뒤 12번 펄쩍 뛰기는 당황이 아니라 신남이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">surprised → confused 놀란 → 혼란스러운</span><span class=\"why\">앞·뒤 둘 다 틀려요. 편지는 이미 기다리던 것이라 놀람이 아니고, 13번처럼 가족에게 바로 알리고 싶을 만큼 분명한 기쁨이라 혼란이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">indifferent → grateful 무관심한 → 고마워하는</span><span class=\"why\">앞이 틀려요. 2~3번에서 소리치며 빗속으로 뛰어나갔으니 무관심과 정반대예요. 9번 Thank you(감사합니다)는 회사가 한 말이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Ester stood up</div><div class=\"k\">Ester는 일어났다</div></div><div class=\"rc\"><div class=\"e\">as soon as she heard</div><div class=\"k\">그녀가 듣자마자</div></div><div class=\"rc\"><div class=\"e\">the hum of a hover engine</div><div class=\"k\">호버 엔진의 웅웅거리는 소리를</div></div><div class=\"rc\"><div class=\"e\">outside.</div><div class=\"k\">밖에서.</div></div><div class=\"rnat\">Ester는 밖에서 호버 엔진의 웅웅거리는 소리를 듣자마자 일어났다.</div><div class=\"rst\">여름 과학캠프 합격 편지를 기다리던 중, 밖에서 집배원 오토바이 소리가 나요. 지문도 엔진 소리를 듣자마자 Ester(에스터)가 벌떡 일어나요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">\"Mail,\"</div><div class=\"k\">\"편지다,\"</div></div><div class=\"rc\"><div class=\"e\">she shouted</div><div class=\"k\">그녀는 소리쳤고</div></div><div class=\"rc\"><div class=\"e\">and ran down the third set of stairs</div><div class=\"k\">세 층계를 뛰어 내려갔고</div></div><div class=\"rc\"><div class=\"e\">and swung open the door.</div><div class=\"k\">문을 확 열었다.</div></div><div class=\"rnat\">\"편지다\"라고 소리치며 세 층계를 뛰어 내려가 문을 확 열었다.</div><div class=\"rst\">“편지다!” 외치며 계단을 뛰어 내려가 현관문을 확 열어요. 지문 2번처럼 그만큼 기다렸다는 뜻이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It was pouring now,</div><div class=\"k\">이제는 비가 마구 쏟아지고 있었다</div></div><div class=\"rc\"><div class=\"e\">but she ran out into the rain.</div><div class=\"k\">하지만 그녀는 빗속으로 달려 나갔다.</div></div><div class=\"rnat\">이제는 비가 마구 쏟아지고 있었지만, 그녀는 빗속으로 달려 나갔다.</div><div class=\"rst\">밖에 비가 쏟아지는데도 우산도 없이 뛰어나가요. 지문 3번, 비도 못 막을 만큼 마음이 급해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">She was facing</div><div class=\"k\">그녀는 마주하고 있었다</div></div><div class=\"rc\"><div class=\"e\">the mailbox.</div><div class=\"k\">우편함을.</div></div><div class=\"rnat\">그녀는 우편함을 마주하고 있었다.</div><div class=\"rst\">드디어 우편함 앞에 섰어요. 지문 4번도 Ester(에스터)가 우편함을 마주하고 있어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">There was a single, unopened letter</div><div class=\"k\">한 통의 뜯지 않은 편지가 있었다</div></div><div class=\"rc\"><div class=\"e\">inside.</div><div class=\"k\">안에는.</div></div><div class=\"rnat\">안에는 뜯지 않은 편지 한 통이 있었다.</div><div class=\"rst\">안에 아직 안 뜯은 편지가 딱 한 통 있어요. 지문 5번, 바로 그 편지예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">She was sure</div><div class=\"k\">그녀는 확신했다</div></div><div class=\"rc\"><div class=\"e\">this must be</div><div class=\"k\">이것(= 그 편지)이 ~임이 틀림없다고</div></div><div class=\"rc ckc\"><div class=\"e\">what she was <span class=\"cw\">eagerly waiting for</span>.</div><div class=\"k\">그녀가 <span class=\"cw\">간절히 기다렸던 것</span>.</div></div><div class=\"rnat\">그녀는 이것이 그녀가 간절히 기다렸던 것이 틀림없다고 확신했다.</div><div class=\"rst\">“이게 내가 <b>간절히 기다리던 거야!</b>” 하고 확신해요. = 지문 6번의 처음 감정, 기대(anticipating 기대하는)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Without hesitation,</span></div><div class=\"k\"><span class=\"cw\">망설임 없이,</span></div></div><div class=\"rc\"><div class=\"e\">she tore open the envelope.</div><div class=\"k\">그녀는 봉투를 뜯어 열었다.</div></div><div class=\"rnat\">망설임 없이 그녀는 봉투를 뜯어 열었다.</div><div class=\"rst\"><b>망설임 없이</b>(Without hesitation) 봉투를 쫙 뜯어요. 지문 7번처럼 기대가 커서 손이 먼저 움직여요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">She pulled out the paper</div><div class=\"k\">그녀는 종이를 꺼냈고</div></div><div class=\"rc\"><div class=\"e\">and unfolded it.</div><div class=\"k\">그것(= 종이)을 펼쳤다.</div></div><div class=\"rnat\">그녀는 종이를 꺼내 펼쳤다.</div><div class=\"rst\">종이를 꺼내 펼쳐요. 지문 8번, 이제 결과를 볼 차례예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The letter said,</div><div class=\"k\">편지에는 이렇게 쓰여 있었다,</div></div><div class=\"rc\"><div class=\"e\">‘Thank you for applying</div><div class=\"k\">'지원해 주셔서 감사합니다</div></div><div class=\"rc\"><div class=\"e\">to our company.</div><div class=\"k\">저희 회사에.</div></div><div class=\"rnat\">편지에는 이렇게 쓰여 있었다. \"저희 회사에 지원해 주셔서 감사합니다.</div><div class=\"rst\">첫 줄에 “지원해 줘서 고마워요”라고 쓰여 있어요. 지문 9번도 회사가 지원해 줘서 고맙다고 해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">We would like to invite you</div><div class=\"k\">저희는 당신을 초대하고 싶습니다</div></div><div class=\"rc\"><div class=\"e\">to our internship program.</div><div class=\"k\">저희 인턴십 프로그램에.</div></div><div class=\"rnat\">저희는 당신을 저희 인턴십 프로그램에 초대하고 싶습니다.</div><div class=\"rst\">이어서 “캠프에 초대할게요!” = 지문 10번, 인턴십 프로그램 초대예요. 기다리던 합격 소식에 감정이 바뀌어요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">We look forward</div><div class=\"k\">저희는 기대합니다</div></div><div class=\"rc\"><div class=\"e\">to seeing you soon.’</div><div class=\"k\">곧 당신을 뵙기를.'</div></div><div class=\"rnat\">저희는 곧 당신을 뵙기를 기대합니다.\"</div><div class=\"rst\">“곧 만나요”로 끝나요. 지문 11번까지 읽으니 합격이 확실해요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc ckc\"><div class=\"e\">She <span class=\"cw\">jumped up and down</span></div><div class=\"k\">그녀는 <span class=\"cw\">펄쩍 뛰었고</span></div></div><div class=\"rc\"><div class=\"e\">and looked down at the letter again.</div><div class=\"k\">편지를 다시 내려보았다.</div></div><div class=\"rnat\">그녀는 펄쩍 뛰며 편지를 다시 내려보았다.</div><div class=\"rst\"><b>펄쩍펄쩍 뛰며</b>(jumped up and down) 편지를 다시 봐요. = 지문 12번의 나중 감정, 신이 났어요(excited).</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">13번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">She <span class=\"cw\">couldn't wait</span></div><div class=\"k\">그녀는 <span class=\"cw\">몹시 ~하고 싶었다(기다릴 수 없었다)</span></div></div><div class=\"rc\"><div class=\"e\">to tell this news</div><div class=\"k\">이 소식을 말하는 것을</div></div><div class=\"rc\"><div class=\"e\">to her family.</div><div class=\"k\">가족에게.</div></div><div class=\"rnat\">그녀는 가족에게 이 소식을 빨리 말하고 싶었다.</div><div class=\"rst\">가족에게 <b>빨리 말하고 싶어</b> 못 참겠어요. 지문 13번 couldn't wait(몹시 ~하고 싶었다)도 들뜬 마음이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"hum\" data-m=\"웅웅거리는 소리\"><b>hum</b>웅웅거리는 소리</button><button type=\"button\" class=\"wdb\" data-w=\"pour\" data-m=\"(비가) 마구 쏟아지다\"><b>pour</b>(비가) 마구 쏟아지다</button><button type=\"button\" class=\"wdb\" data-w=\"eagerly\" data-m=\"간절히, 열심히\"><b>eagerly</b>간절히, 열심히</button><button type=\"button\" class=\"wdb\" data-w=\"hesitation\" data-m=\"망설임, 주저\"><b>hesitation</b>망설임, 주저</button><button type=\"button\" class=\"wdb\" data-w=\"unfold\" data-m=\"펼치다\"><b>unfold</b>펼치다</button><button type=\"button\" class=\"wdb\" data-w=\"look forward to\" data-m=\"~을 기대하다\"><b>look forward to</b>~을 기대하다</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 통념을 <b>뒤집는 말</b>에 있어요. ‘자연의 균형’을 <b>misleading</b>(오해의 소지가 있는)·<b>myth</b>(근거 없는 믿음)라고 깎은 뒤, 반복되는 <b>dynamic</b>(역동적인)을 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 통념 소개</span><div class=\"en\"><mark>but there is a risk</mark> that this principle may be confused with the old idea of a ‘balance of nature.’</div><p class=\"ko\">하지만 이 원칙이 ‘자연의 균형’이라는 오래된 개념과 혼동될 <mark>위험이 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>‘자연의 균형’이 왜 틀렸는지 이유를 대요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 통념 깎기</span><div class=\"en\">but <mark>deeply misleading</mark> because it supposes <mark>a static condition</mark>.</div><p class=\"ko\">하지만 그것이 <mark>정적인 상태</mark>를 전제로 하기 때문에 <mark>매우 오해의 소지가 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>static(정적인)의 반대말 dynamic(역동적인)으로 진실을 밝혀요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 요지</span><div class=\"en\"><mark>Ecosystems are dynamic</mark>, … they <mark>must and do change eventually</mark>.</div><p class=\"ko\"><mark>생태계는 역동적이다</mark> … 그것들은 <mark>결국 반드시 그리고 정말 변한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>생물 종은 생겨났다 사라짐</span><span><em>5번</em>기후는 변함</span><span><em>5번</em>동식물 군집은 달라진 환경에 적응함</span></div><div class=\"ck-eq\">⇒ 세 사례의 공통점 = 자연은 늘 변하고 있어요 (4번과 같은 말)</div></div><div class=\"ck-via\"><i>▼</i><span>6번에서 균형은 myth(근거 없는 믿음)라 하고, dynamic(역동적인)을 한 번 더</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 마무리 반복</span><div class=\"en\"><mark>Our planet is dynamic</mark>, and so are the arrangements by which its inhabitants live together.</div><p class=\"ko\"><mark>우리의 지구는 역동적이고</mark>, 그 서식자들이 함께 사는 방식도 그러하다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">자연은 정적이지 않고 역동적으로 계속 변한다.<small>3번 static(정적인)의 반대, 4·7번 dynamic(역동적인)을 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">동식물은 상호 경쟁을 통해 생태계의 균형을 이룬다.</span><span class=\"why\">[반대] 6번에서 ‘자연의 균형’(balance of nature)은 근거 없는 믿음(myth)이라고 했어요. 균형을 이룬다는 건 필자가 깎아내린 통념 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">생물 다양성이 높은 생태계가 기후 변화에 더 잘 적응한다.</span><span class=\"why\">[지문에 없음] 5번에 기후(climates)와 적응(adapt 적응하다)이 나오지만 변화의 사례일 뿐이에요. 다양성이 높고 낮은 생태계를 비교한 적이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">인간의 부적절한 개입은 자연의 균형을 깨뜨린다.</span><span class=\"why\">[반대] 1번의 파괴(disruption)를 줄이자는 건 출발점일 뿐이고, 필자는 지킬 ‘균형’ 자체가 없다고 해요. 깨질 균형을 전제하는 이 보기는 통념 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">모든 생물은 적자생존의 원칙에 순응하기 마련이다.</span><span class=\"why\">[지문에 없음] 적자생존이라는 말은 안 나와요. 5번의 종이 생겨났다 사라진다는 것도 경쟁이 아니라 자연이 변한다는 예예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Fears of damaging ecosystems</div><div class=\"k\">생태계를 손상하는 것에 대한 두려움은</div></div><div class=\"rc\"><div class=\"e\">are based on the sound conservationist principle</div><div class=\"k\">건전한 환경 보호주의자 원칙에 바탕을 둔다</div></div><div class=\"rc\"><div class=\"e\">that we should aim to minimize</div><div class=\"k\">우리가 최소화하는 것을 목표로 해야 한다는</div></div><div class=\"rc\"><div class=\"e\">the disruption we cause,</div><div class=\"k\">우리가 초래하는 파괴를,</div></div><div class=\"rc\"><div class=\"e\">but there is a risk</div><div class=\"k\">하지만 위험이 있다</div></div><div class=\"rc\"><div class=\"e\">that this principle may be confused</div><div class=\"k\">이 원칙이 혼동될지도 모른다는</div></div><div class=\"rc\"><div class=\"e\">with the old idea of a ‘balance of nature.’</div><div class=\"k\">'자연의 균형'이라는 오래된 개념과.</div></div><div class=\"rnat\">생태계를 손상하는 것에 대한 두려움은 우리가 초래하는 파괴를 최소화하는 것을 목표로 해야 한다는 건전한 환경 보호주의자 원칙을 바탕으로 하지만, 이 원칙이 '자연의 균형'이라는 오래된 개념과 혼동될지도 모른다는 위험이 있다.</div><div class=\"rst\">학교 연못을 지키려고 “쓰레기 버리지 말자”는 건 좋은 규칙이에요. 그런데 이걸 “연못은 늘 그대로여야 해”로 착각할 위험이 있대요. = 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This supposes</div><div class=\"k\">이것(= 자연의 균형)은 전제로 한다</div></div><div class=\"rc\"><div class=\"e\">a perfect order of nature</div><div class=\"k\">자연의 완벽한 질서를</div></div><div class=\"rc\"><div class=\"e\">that will seek to maintain itself</div><div class=\"k\">그것(= 질서)이 스스로를 유지하려고 노력하는</div></div><div class=\"rc\"><div class=\"e\">and that we should not change.</div><div class=\"k\">그리고 우리가 바꾸어서는 안 되는.</div></div><div class=\"rnat\">이것(자연의 균형)은 자기 자신을 유지하려고 노력하며 우리가 바꾸어서는 안 되는 완벽한 자연의 질서를 전제로 한다.</div><div class=\"rst\">“연못엔 완벽한 질서가 있으니 절대 손대면 안 돼!” 이게 바로 지문 2번이 말하는 ‘자연의 균형’이라는 생각이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It is a romantic, not to say idyllic, notion,</div><div class=\"k\">그것(= 자연의 균형)은 목가적이라고까지는 할 수 없어도 낭만적인 개념이고,</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">deeply misleading</span></div><div class=\"k\">하지만 <span class=\"cw\">매우 오해의 소지가 있다</span></div></div><div class=\"rc ckc\"><div class=\"e\">because it supposes a <span class=\"cw\">static condition</span>.</div><div class=\"k\">그것이 <span class=\"cw\">정적인 상태를</span> 전제로 하기 때문에.</div></div><div class=\"rnat\">그것은 목가적이라고까지는 할 수 없어도 낭만적인 개념이지만, 그것이 정적인 상태를 전제로 하기 때문에 매우 오해의 소지가 있다.</div><div class=\"rst\">듣기엔 멋지지만 <b>오해하기 쉬운</b> 말이에요. 연못이 <b>멈춰 있다</b>(static 정적인)고 믿게 만드니까요. 지문 3번이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Ecosystems are dynamic,</span></div><div class=\"k\"><span class=\"cw\">생태계는 역동적이다</span></div></div><div class=\"rc\"><div class=\"e\">and although some may endure,</div><div class=\"k\">그리고 일부는 지속할지도 모르지만</div></div><div class=\"rc\"><div class=\"e\">apparently unchanged,</div><div class=\"k\">겉보기에 변하지 않은 채로</div></div><div class=\"rc\"><div class=\"e\">for periods that are long</div><div class=\"k\">오랜 기간 동안</div></div><div class=\"rc\"><div class=\"e\">in comparison with the human lifespan,</div><div class=\"k\">인간의 수명과 비교하면</div></div><div class=\"rc\"><div class=\"e\">they must and do change eventually.</div><div class=\"k\">그것들(= 생태계)은 결국 반드시 그리고 정말 변한다.</div></div><div class=\"rnat\">생태계는 역동적이고, 일부는 겉보기에 변하지 않은 채로 인간의 수명과 비교하면 오랜 기간 동안 지속될지도 모르지만, 그것들은 결국 반드시 그리고 정말 변한다.</div><div class=\"rst\">사실 연못은 <b>늘 움직여요</b>(dynamic 역동적인). 몇 년째 똑같아 보여도 결국엔 꼭 바뀌어요. = 지문 4번의 요지예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Species come and go,</div><div class=\"k\">생물 종들은 생겨났다 사라지고,</div></div><div class=\"rc\"><div class=\"e\">climates change,</div><div class=\"k\">기후는 변화하며,</div></div><div class=\"rc\"><div class=\"e\">plant and animal communities adapt</div><div class=\"k\">동식물 군집은 적응한다</div></div><div class=\"rc\"><div class=\"e\">to altered circumstances,</div><div class=\"k\">달라진 환경에,</div></div><div class=\"rc\"><div class=\"e\">and when examined in fine detail</div><div class=\"k\">그리고 아주 상세하게 검토하면</div></div><div class=\"rc\"><div class=\"e\">such adaptation and consequent change</div><div class=\"k\">그런 적응과 결과적인 변화는</div></div><div class=\"rc\"><div class=\"e\">can be seen to be taking place constantly.</div><div class=\"k\">항상 일어나고 있는 것으로 보일 수 있다.</div></div><div class=\"rnat\">생물 종들은 생겨났다 사라지고, 기후는 변화하며, 동식물 군집은 달라진 환경에 적응하는데, 아주 상세하게 검토하면 그런 적응과 결과적인 변화는 항상 일어나고 있는 것으로 보일 수 있다.</div><div class=\"rst\">올챙이는 개구리가 되어 떠나고, 날씨가 바뀌면 수초도 그에 맞춰 바뀌어요. 지문 5번처럼 자세히 보면 변화가 매일 일어나요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The ‘balance of nature’</div><div class=\"k\">'자연의 균형'은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is a myth.</span></div><div class=\"k\"><span class=\"cw\">근거 없는 믿음(잘못된 통념)이다.</span></div></div><div class=\"rnat\">'자연의 균형'은 근거 없는 믿음이다.</div><div class=\"rst\">그러니 “연못은 늘 균형 그대로”라는 건 <b>근거 없는 믿음</b>(myth)이에요. 지문 6번이 딱 잘라 말해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Our planet is dynamic,</span></div><div class=\"k\"><span class=\"cw\">우리의 지구는 역동적이고,</span></div></div><div class=\"rc\"><div class=\"e\">and so are the arrangements</div><div class=\"k\">그리고 (사는) 방식도 그러하다,</div></div><div class=\"rc\"><div class=\"e\">by which its inhabitants live together.</div><div class=\"k\">그것(= 지구)의 서식자들이 함께 사는.</div></div><div class=\"rnat\">우리의 지구는 역동적이고, 그것(지구)의 서식자들이 함께 사는 방식도 그러하다.</div><div class=\"rst\">지구도 연못처럼 <b>늘 변하고</b>, 그 안의 생물들이 함께 사는 방식도 계속 바뀌어요. 지문 7번이 요지를 한 번 더 말하며 끝나요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"disruption\" data-m=\"파괴, 붕괴\"><b>disruption</b>파괴, 붕괴</button><button type=\"button\" class=\"wdb\" data-w=\"misleading\" data-m=\"오해의 소지가 있는\"><b>misleading</b>오해의 소지가 있는</button><button type=\"button\" class=\"wdb\" data-w=\"static\" data-m=\"정적인, 고정된\"><b>static</b>정적인, 고정된</button><button type=\"button\" class=\"wdb\" data-w=\"dynamic\" data-m=\"역동적인\"><b>dynamic</b>역동적인</button><button type=\"button\" class=\"wdb\" data-w=\"endure\" data-m=\"지속하다, 견디다\"><b>endure</b>지속하다, 견디다</button><button type=\"button\" class=\"wdb\" data-w=\"myth\" data-m=\"근거 없는 믿음, 잘못된 통념\"><b>myth</b>근거 없는 믿음, 잘못된 통념</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄이 <b>as(~만큼) ~ as</b>(…만큼) 비교 뒤에서 앞 동사를 <b>대신 받는 말</b>(대동사)이면, 앞 동사가 무엇인지부터 보세요. 앞이 <b>are</b>(~이다)면 뒤도 are(~이다)예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (7번)</span><div class=\"en\">Productivity improvements are as important to the economy as they <u>④ do</u> to the individual business that's making them.</div><p class=\"ko\">생산성 향상은 개별 기업에 ( ? ) 만큼 경제에 중요하다 — 앞 절의 동사가 무엇인지 확인</p></div><div class=\"ck-via\"><i>▼</i><span>as(~만큼) 비교의 앞뒤는 같은 모양이어야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 앞 절 · 대신 받을 동사 찾기</span><div class=\"en\">Productivity improvements <mark>are</mark> <mark>as important</mark> to the economy</div><p class=\"ko\">생산성 향상은 경제에 <mark>중요하다</mark>(are as important) …</p></div><div class=\"ck-via\"><i>▼</i><span>앞이 are important(중요하다)라서, 뒤에서 대신 받는 말도 are(~이다)</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">as important to the economy as they <mark>are</mark> to the individual business</div><p class=\"ko\">그것들(= 생산성 향상)이 개별 기업에 <mark>(중요한)</mark> 만큼</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">대동사: 앞이 are(~이다)면 뒤도 are(~이다), 일반동사면 do(하다)</p><p class=\"gr\">같은 말을 되풀이하지 않으려고 앞의 동사를 대신 받는 말이 대동사예요. 앞 동사가 are(~이다) 같은 ‘이다’ 동사면 뒤도 그 동사, 일반동사(like 좋아하다 등)면 do(하다)를 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Math is as hard to me as it is to you.</div><div class=\"ko\">수학은 너에게 어려운 만큼 나에게도 어렵다. (앞이 is라서 뒤도 is)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Math is as hard to me as it does to you.</div><div class=\"ko\">앞이 is(~이다)인데 뒤에서 does(하다)로 받아서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like pizza as much as you do.</div><div class=\"ko\">나는 네가 좋아하는 만큼 피자를 좋아한다. (앞이 일반동사 like 좋아하다라서 do)</div></div><p class=\"gb\">지문 7번도 앞이 are important(중요하다)예요. 그래서 as(~만큼) 뒤에서 대신 받는 말은 do(하다)가 아니라 are(~이다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">do → are (~이다)<small>앞의 are important(중요하다)를 대신 받으니 do(하다)가 아니라 are(~이다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">needed 필요한</span><span class=\"why\">6번 주어는 the machinery or employee training(기계 또는 직원 훈련)이고 진짜 동사는 뒤의 costs(비용이 들다)예요. 동사가 이미 있으니 ③은 앞 명사를 뒤에서 꾸미는 분사 자리이고, 훈련이 ‘필요로 되는’ 쪽이라 needed(필요한)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">명사 + p.p.(~된, ~한)가 뒤에서 꾸미기 — 문장에 동사가 이미 있을 때</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The money needed for the trip is small.</div><div class=\"ko\">여행에 필요한 돈은 적다. (동사는 is, needed 필요한은 money 돈을 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The money needs for the trip is small.</div><div class=\"ko\">needs(필요로 하다)와 is(~이다), 동사가 두 개라서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The cake made by my friend is sweet.</div><div class=\"ko\">친구가 만든 케이크는 달다. (made 만들어진이 cake 케이크를 꾸며서 맞아요)</div></div><p class=\"gb\">지문 6번도 진짜 동사는 costs(비용이 들다)라서, needed(필요한)는 training(훈련)을 꾸미는 분사로 딱 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">that ~할 정도로</span><span class=\"why\">2번은 cuts costs so deeply(비용을 너무 많이 줄인다) 뒤에 ① 자리가 와요. so(너무) + 부사 뒤에 결과를 말하는 that(~할 정도로)이 짝으로 오는 구조예요. 뒤의 doing so harms(그렇게 하는 것이 손상시킨다)도 주어·동사가 다 갖춰진 완전한 절이에요.</span><div class=\"gm wx\"><p class=\"gt\">so(너무) + 형용사·부사 + that(~해서 …하다) + 완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I was so tired that I fell asleep.</div><div class=\"ko\">나는 너무 피곤해서 잠들었다. (so tired 너무 피곤한 뒤에 that 절이 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I was so tired what I fell asleep.</div><div class=\"ko\">I fell asleep(나는 잠들었다)은 완전한 절이라 what(~하는 것)은 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He ran so fast that he won.</div><div class=\"ko\">그는 너무 빨리 달려서 이겼다. (부사 fast 빨리 뒤에도 that이 와요)</div></div><p class=\"gb\">지문 2번도 so deeply(너무 많이) 뒤에 완전한 절 doing so harms(그렇게 하는 것이 손상시킨다)가 오니 that(~할 정도로)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">basically 기본적으로</span><span class=\"why\">4번은 they're(그들은 ~이다)와 tapping into(~을 이용하는) 사이예요. 동사 부분을 꾸며 주는 자리라 부사 basically(기본적으로)가 맞아요. 형용사 basic(기본적인)은 명사를 꾸미는 말이라 여기 못 와요.</span><div class=\"gm wx\"><p class=\"gt\">동사를 꾸미는 부사 / 명사를 꾸미는 형용사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>He is basically saying no.</div><div class=\"ko\">그는 기본적으로 안 된다고 말하고 있다. (부사 basically 기본적으로가 saying 말하는을 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He is basic saying no.</div><div class=\"ko\">basic(기본적인)은 형용사라 동사 saying(말하는)을 꾸밀 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is a basic rule.</div><div class=\"ko\">이것은 기본적인 규칙이다. (명사 rule 규칙 앞이라 형용사 basic 기본적인이 맞아요)</div></div><p class=\"gb\">지문 4번도 basically(기본적으로)가 동사 tapping into(~을 이용하는)를 꾸미니 부사가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">are ~이다</span><span class=\"why\">8번 주어는 복수 Productivity improvements(생산성 향상들)예요. 이 주어에 raise(올리다)와 ⑤가 and(그리고)로 나란히 붙는 구조라, 복수 주어에 맞는 are(~이다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치: 복수 주어 + and(그리고)로 이어진 동사 둘 다 복수형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My friends play soccer and are good at it.</div><div class=\"ko\">내 친구들은 축구를 하고 축구를 잘한다. (복수 friends 친구들이라 are가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My friends play soccer and is good at it.</div><div class=\"ko\">주어가 복수 friends(친구들)인데 is(~이다)를 써서 틀려요.</div></div><p class=\"gb\">지문 8번도 복수 주어 improvements(향상들)가 raise(올리다)와 are(~이다)를 같이 거느리니 are(~이다)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Cutting costs</div><div class=\"k\">비용을 줄이는 것은</div></div><div class=\"rc\"><div class=\"e\">can improve profitability</div><div class=\"k\">수익성을 향상시킬 수 있다</div></div><div class=\"rc\"><div class=\"e\">but only up to a point.</div><div class=\"k\">하지만 단지 어느 정도까지이다.</div></div><div class=\"rnat\">비용을 줄이는 것은 수익성을 향상시킬 수 있지만 단지 어느 정도까지이다.</div><div class=\"rst\">학교 앞 분식집이 돈을 아끼면 이익이 좀 늘어요. 하지만 지문 1번처럼 그건 어느 정도까지만이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">If the manufacturer cuts costs</div><div class=\"k\">만약 제조업자가 비용을 줄인다면</div></div><div class=\"rc\"><div class=\"e\">so deeply</div><div class=\"k\">너무 많이</div></div><div class=\"rc\"><div class=\"e\">that doing so harms the product's quality,</div><div class=\"k\">그렇게 하는 것(= 비용을 줄이는 것)이 그 제품의 품질을 손상시킬 정도로,</div></div><div class=\"rc\"><div class=\"e\">then the increased profitability</div><div class=\"k\">그 증가된 수익성은</div></div><div class=\"rc\"><div class=\"e\">will be short-lived.</div><div class=\"k\">일시적일 것이다.</div></div><div class=\"rnat\">만약 제조업자가 비용을 너무 많이 줄여서 그렇게 하는 것이 그 제품의 품질을 손상시킨다면, 그 증가된 수익성은 일시적일 것이다.</div><div class=\"rst\">떡볶이 재료를 맛이 떨어질 <b>정도로</b> 너무 줄이면 손님이 끊겨요. 그래서 지문 2번은 이익이 잠깐뿐이라고 해요. (so ~ that = 너무 ~해서)</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">A better approach</div><div class=\"k\">더 나은 접근법은</div></div><div class=\"rc\"><div class=\"e\">is to improve productivity.</div><div class=\"k\">생산성을 향상시키는 것이다.</div></div><div class=\"rnat\">더 나은 접근법은 생산성을 향상시키는 것이다.</div><div class=\"rst\">더 좋은 방법은 같은 시간에 더 많이 만드는 거예요. = 지문 3번, 생산성(productivity)을 높이는 것이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">If businesses can get more production</div><div class=\"k\">만약 기업들이 더 많은 생산을 얻을 수 있다면</div></div><div class=\"rc\"><div class=\"e\">from the same number of employees,</div><div class=\"k\">같은 수의 직원들로부터</div></div><div class=\"rc\"><div class=\"e\">they're basically tapping into free money.</div><div class=\"k\">그들(= 기업)은 기본적으로 공짜 돈을 이용하는 것이다.</div></div><div class=\"rnat\">만약 기업들이 같은 수의 직원들로부터 더 많은 생산을 얻을 수 있다면, 그들은 기본적으로 공짜 돈을 이용하는 것이다.</div><div class=\"rst\">같은 직원 수로 떡볶이를 더 많이 만들면 공짜 돈이 생기는 셈이에요. 지문 4번 basically(기본적으로)가 동사를 꾸며요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">They get more product to sell,</div><div class=\"k\">그들(= 기업)은 판매할 상품을 더 많이 얻고,</div></div><div class=\"rc\"><div class=\"e\">and the price of each product falls.</div><div class=\"k\">각 제품의 가격이 떨어진다.</div></div><div class=\"rnat\">그들은 판매할 상품을 더 많이 얻고, 각 제품의 가격이 떨어진다.</div><div class=\"rst\">팔 떡볶이가 많아지고, 한 그릇 값은 내려가요. 지문 5번이 말하는 좋은 점이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">As long as the machinery or employee training</div><div class=\"k\">~하는 한 기계 또는 직원 훈련이</div></div><div class=\"rc\"><div class=\"e\">needed for productivity improvements</div><div class=\"k\">생산성 향상에 필요한</div></div><div class=\"rc\"><div class=\"e\">costs less than the value</div><div class=\"k\">가치보다 비용이 더 적게 든다</div></div><div class=\"rc\"><div class=\"e\">of the productivity gains,</div><div class=\"k\">생산성 향상으로 인한 이윤의</div></div><div class=\"rc\"><div class=\"e\">it's an easy investment</div><div class=\"k\">이것은 쉬운 투자이다</div></div><div class=\"rc\"><div class=\"e\">for any business to make.</div><div class=\"k\">어떤 기업이라도 할.</div></div><div class=\"rnat\">생산성 향상에 필요한 기계 또는 직원 훈련이 생산성 향상으로 인한 이윤의 가치보다 비용이 더 적게 드는 한, 이것은 어떤 기업이라도 하기 쉬운 투자이다.</div><div class=\"rst\">새 기계나 직원 교육에 드는 돈이 얻는 이익보다 적다면 해 볼 만해요. 지문 6번에서 needed(필요한)는 training(훈련)을 꾸며요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Productivity improvements are</div><div class=\"k\">생산성 향상은 ~하다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as important</span> to the economy</div><div class=\"k\"><span class=\"cw\">경제에 중요한 만큼</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as they are</span> to the individual business</div><div class=\"k\"><span class=\"cw\">그것들(= 생산성 향상)이 개별 기업에 (중요한) 만큼</span> ※ 문제지엔 do로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">that's making them.</div><div class=\"k\">그것들(= 생산성 향상)을 만들어 내는.</div></div><div class=\"rnat\">생산성 향상은 그것들을 만들어 내는 개별 기업에 중요한 만큼 경제에도 중요하다.</div><div class=\"rst\">이런 생산성은 분식집에게 중요한 <b>만큼</b> 동네 경제에도 중요해요. 앞이 <b>are</b>(~이다) important(중요한)라 뒤도 are(~이다)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Productivity improvements</div><div class=\"k\">생산성 향상은</div></div><div class=\"rc\"><div class=\"e\">generally raise the standard of living</div><div class=\"k\">일반적으로 삶의 수준을 올리고</div></div><div class=\"rc\"><div class=\"e\">for everyone</div><div class=\"k\">모든 사람을 위한</div></div><div class=\"rc\"><div class=\"e\">and are a good indication</div><div class=\"k\">그리고 좋은 지표가 된다</div></div><div class=\"rc\"><div class=\"e\">of a healthy economy.</div><div class=\"k\">건강한 경제의.</div></div><div class=\"rnat\">생산성 향상은 일반적으로 모든 사람을 위한 삶의 수준을 올리고 건강한 경제의 좋은 지표가 된다.</div><div class=\"rst\">그래서 생산성이 오르면 모두의 생활이 나아지고, 경제가 건강하다는 표시가 돼요. 지문 8번 복수 주어라 are(~이다)예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"profitability\" data-m=\"수익성\"><b>profitability</b>수익성</button><button type=\"button\" class=\"wdb\" data-w=\"short-lived\" data-m=\"일시적인, 덧없는\"><b>short-lived</b>일시적인, 덧없는</button><button type=\"button\" class=\"wdb\" data-w=\"productivity\" data-m=\"생산성\"><b>productivity</b>생산성</button><button type=\"button\" class=\"wdb\" data-w=\"tapping into\" data-m=\"~을 이용하는 (tap into ~을 이용하다)\"><b>tapping into</b>~을 이용하는 (tap into ~을 이용하다)</button><button type=\"button\" class=\"wdb\" data-w=\"machinery\" data-m=\"기계(류)\"><b>machinery</b>기계(류)</button><button type=\"button\" class=\"wdb\" data-w=\"indication\" data-m=\"지표, 표시\"><b>indication</b>지표, 표시</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">8번 <b>On the contrary</b>(그와는 반대로) 뒤에서 과학자는 패러다임을 <b>의심 없이 믿는 쪽</b>으로 방향이 정해져요. 그런데 9번에서 실험 기술을 탓하려면 결과가 패러다임과 <b>어긋나야</b> 해요. 이 방향과 반대인 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">7번 · 방향 잡기</span><div class=\"en\"><mark>Above all,</mark> Kuhn stressed that normal scientists are <mark>not trying to test the paradigm</mark>.</div><p class=\"ko\"><mark>무엇보다도</mark> Kuhn은 정상 과학자들이 <mark>패러다임을 '시험'하려 하지 않는다</mark>는 것을 강조했다.</p></div><div class=\"ck-via\"><i>▼</i><span>On the contrary(그와는 반대로) = 시험하는 대신 그냥 믿어요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 · 결정적 단서</span><div class=\"en\"><mark>On the contrary,</mark> they <mark>accept the paradigm unquestioningly</mark>,</div><p class=\"ko\"><mark>그와는 반대로,</mark> 그들은 <mark>패러다임을 의심 없이 받아들이고</mark></p></div><div class=\"ck-via\"><i>▼</i><span>패러다임과 ‘부합하는’ 결과라면 탓할 게 없어요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (9번)</span><div class=\"en\">If a normal scientist gets an experimental result which <u>⑤ corresponds</u> with the paradigm,</div><p class=\"ko\">만약 정상 과학자가 패러다임과 ( 부합하는 ) 실험 결과를 얻는다면 → ‘상충하는’이어야 해요</p></div><div class=\"ck-via\"><i>▼</i><span>패러다임 대신 실험을 탓한다 = 결과가 패러다임과 어긋났다는 뜻</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 · 결과로 확인</span><div class=\"en\">they will usually assume that their <mark>experimental technique is faulty</mark>, <mark>not that the paradigm is wrong</mark>.</div><p class=\"ko\">그들은 보통 <mark>패러다임이 틀렸다고가 아니라</mark> <mark>자신의 실험 기술에 결함이 있다고</mark> 생각한다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">corresponds with(~과 부합하다) ↔ conflicts with(~과 상충하다)</p><p class=\"gr\">‘내 실험이 틀렸나?’ 하고 의심하는 건 결과가 믿는 것과 어긋날(conflicts 상충하다) 때예요. 결과가 믿는 것과 맞으면(corresponds 부합하다) 의심할 이유가 없어요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My answer conflicts with the answer key, so I check my work again.</div><div class=\"ko\">내 답이 정답지와 어긋나서 내 풀이를 다시 확인해요. (어긋남 → 내 실수 의심)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My answer corresponds with the answer key, so I check my work again.</div><div class=\"ko\">정답지와 딱 맞는데 내 풀이를 의심한다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My answer corresponds with the answer key, so I feel happy.</div><div class=\"ko\">정답지와 맞아서 기뻐요. (맞음 → 안심)</div></div><p class=\"gb\">지문 9번에서 과학자는 실험 기술이 faulty(결함이 있는)하다고 의심해요. 그러니 결과는 패러다임과 corresponds(부합하다)가 아니라 conflicts(상충하다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">corresponds → conflicts (상충하다)<small>실험 기술을 탓하려면 결과가 패러다임과 어긋나야(conflicts 상충하다) 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">unquestioningly 의심 없이</span><span class=\"why\">8번 앞 7번에서 패러다임을 시험하지(test 시험하다) 않는다고 했고, On the contrary(그와는 반대로)로 이어지니 ‘의심 없이’ 받아들인다가 딱 맞는 방향이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">encounter 맞닥뜨리다</span><span class=\"why\">3번은 However successful(아무리 성공적일지라도)로 시작해요. 아무리 잘나가도 문제를 ‘맞닥뜨린다’는 양보 흐름이고, 대시 뒤에 그 문제들(불일치 등)이 나열되니 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">eliminate 없애다</span><span class=\"why\">4번은 그 작은 문제들(minor puzzles 작은 문제들)을 패러다임은 거의 바꾸지 않으면서 처리한다는 말이에요. 2번의 puzzle-solving(문제 해결)과 같은 방향이라 ‘없애다’가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">conservative 보수적인</span><span class=\"why\">5번은 So(따라서)로 4번을 정리해요. 세상을 떠들썩하게 할 발견이 아니라 기존 패러다임을 확장할 뿐이니 ‘보수적인’ 활동이 맞아요. 6번 novelties(참신함)를 노리지 않는다는 말과도 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">What exactly</div><div class=\"k\">정확히 무엇을</div></div><div class=\"rc\"><div class=\"e\">does normal science involve?</div><div class=\"k\">정상 과학은 포함하는가?</div></div><div class=\"rnat\">정상 과학은 정확히 무엇을 포함하는가?</div><div class=\"rst\">정상 과학이 뭘 하냐고요? 유명 요리책 레시피를 그대로 믿고 요리하는 사람을 떠올려 보세요. 지문 1번이 그 질문으로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">According to Thomas Kuhn</div><div class=\"k\">Thomas Kuhn에 따르면</div></div><div class=\"rc\"><div class=\"e\">it is primarily a matter</div><div class=\"k\">그것(= 정상 과학)은 주로 문제이다</div></div><div class=\"rc\"><div class=\"e\">of puzzle-solving.</div><div class=\"k\">'문제 해결'의.</div></div><div class=\"rnat\">Thomas Kuhn에 따르면, 그것은 주로 '문제 해결'의 문제이다.</div><div class=\"rst\">Kuhn(쿤)에 따르면 정상 과학은 주로 <b>문제 풀기</b>(puzzle-solving)예요. 레시피 안에서 작은 문제를 푸는 거죠.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">However successful a paradigm is,</div><div class=\"k\">패러다임이 아무리 성공적일지라도</div></div><div class=\"rc\"><div class=\"e\">it will always encounter certain problems</div><div class=\"k\">그것(= 패러다임)은 항상 특정한 문제들을 맞닥뜨릴 것이다</div></div><div class=\"rc\"><div class=\"e\">— phenomena which it cannot easily accommodate,</div><div class=\"k\">그것이 쉽게 수용할 수 없는 현상들,</div></div><div class=\"rc\"><div class=\"e\">or mismatches between the theory's predictions</div><div class=\"k\">또는 이론의 예측과</div></div><div class=\"rc\"><div class=\"e\">and the experimental facts.</div><div class=\"k\">실험에 입각한 사실 사이의 불일치를.</div></div><div class=\"rnat\">패러다임이 아무리 성공적일지라도, 그것은 항상 특정한 문제들을 맞닥뜨릴 것이다 — 그 패러다임이 쉽게 수용할 수 없는 현상, 또는 이론의 예측과 실험에 입각한 사실 사이의 불일치 말이다.</div><div class=\"rst\">아무리 좋은 레시피라도 가끔 맛이 이상한 문제를 <b>맞닥뜨려요</b>(encounter). 지문 3번, 예측과 실제 결과가 안 맞는 경우예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The job of the normal scientist</div><div class=\"k\">정상 과학자들의 임무는</div></div><div class=\"rc\"><div class=\"e\">is to try to eliminate these minor puzzles</div><div class=\"k\">이러한 작은 문제들을 없애려고 노력하는 것이다</div></div><div class=\"rc\"><div class=\"e\">while making as few changes as possible</div><div class=\"k\">가능한 한 거의 변화시키지 않으면서</div></div><div class=\"rc\"><div class=\"e\">to the paradigm.</div><div class=\"k\">패러다임에.</div></div><div class=\"rnat\">정상 과학자들의 임무는 패러다임을 가능한 한 거의 변화시키지 않으면서, 이러한 작은 문제들을 없애려고 노력하는 것이다.</div><div class=\"rst\">요리사는 레시피를 거의 안 바꾸고 그 작은 문제만 <b>없애요</b>(eliminate). 지문 4번, 정상 과학자의 임무예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">So normal science is a conservative activity</div><div class=\"k\">따라서 정상 과학은 보수적인 활동이다</div></div><div class=\"rc\"><div class=\"e\">— its practitioners are not trying</div><div class=\"k\">그것(= 정상 과학)을 실행하는 사람들은 노력하고 있지 않다</div></div><div class=\"rc\"><div class=\"e\">to make any earth-shattering discoveries,</div><div class=\"k\">세상을 떠들썩하게 하는 어떤 발견이라도 해내려고</div></div><div class=\"rc\"><div class=\"e\">but rather just to develop and extend</div><div class=\"k\">오히려 단지 발전시키고 확장하려고</div></div><div class=\"rc\"><div class=\"e\">the existing paradigm.</div><div class=\"k\">기존의 패러다임을.</div></div><div class=\"rnat\">따라서 정상 과학은 보수적인 활동이며, 그것을 실행하는 사람은 세상을 떠들썩하게 하는 어떤 발견이라도 해내려고 하는 것이 아니라, 오히려 단지 기존의 패러다임을 발전시키고 확장하고자 노력하고 있다.</div><div class=\"rst\"><b>그래서</b>(So) 깜짝 놀랄 새 요리를 만들려는 게 아니라 원래 레시피를 다듬어요. = 지문 5번의 <b>보수적인</b>(conservative) 활동이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In Kuhn's words,</div><div class=\"k\">Kuhn의 말에 따르면,</div></div><div class=\"rc\"><div class=\"e\">‘normal science does not aim</div><div class=\"k\">'정상 과학은 목표로 하지 않고</div></div><div class=\"rc\"><div class=\"e\">at novelties of fact or theory,</div><div class=\"k\">사실 또는 이론의 참신함을</div></div><div class=\"rc\"><div class=\"e\">and when successful finds none’.</div><div class=\"k\">성공적일 때에는 아무것도 찾지 못한다.'</div></div><div class=\"rnat\">Kuhn의 말에 따르면, '정상 과학은 사실 또는 이론의 참신함을 목표로 하지 않고, 성공적일 때에는 아무것도 찾지 못한다.'</div><div class=\"rst\">Kuhn(쿤)의 말처럼 새로운 걸 노리지 않고, 잘 되면 새로 찾는 것도 없어요. 지문 6번이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Above all,</div><div class=\"k\">무엇보다도</div></div><div class=\"rc\"><div class=\"e\">Kuhn stressed</div><div class=\"k\">Kuhn은 강조했다</div></div><div class=\"rc\"><div class=\"e\">that normal scientists are not trying</div><div class=\"k\">정상 과학자들이 노력하지 않는다는 것을</div></div><div class=\"rc\"><div class=\"e\">to test the paradigm.</div><div class=\"k\">패러다임을 '시험'하려고.</div></div><div class=\"rnat\">무엇보다도, Kuhn은 정상 과학자들이 패러다임을 '시험'하려 하지 않는다는 것을 강조했다.</div><div class=\"rst\">무엇보다 요리사는 “이 레시피 진짜 맞나?” 하고 <b>시험해 보지 않아요</b>. 지문 7번이 강조하는 점이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">On the contrary,</span></div><div class=\"k\"><span class=\"cw\">그와는 반대로,</span></div></div><div class=\"rc ckc\"><div class=\"e\">they accept the paradigm <span class=\"cw\">unquestioningly</span>,</div><div class=\"k\">그들(= 정상 과학자들)은 패러다임을 <span class=\"cw\">의심 없이</span> 받아들이고</div></div><div class=\"rc\"><div class=\"e\">and conduct their research</div><div class=\"k\">연구를 수행한다</div></div><div class=\"rc\"><div class=\"e\">within the limits it sets.</div><div class=\"k\">그것(= 패러다임)이 설정한 한계 내에서.</div></div><div class=\"rnat\">그와는 반대로, 그들은 패러다임을 의심 없이 받아들이고, 그것이 설정한 한계 내에서 그들의 연구를 수행한다.</div><div class=\"rst\"><b>오히려</b>(On the contrary) 레시피를 <b>의심 없이</b>(unquestioningly) 믿고 그 안에서만 요리해요. 지문 8번이 결정적 단서예요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">If a normal scientist gets an experimental result</div><div class=\"k\">만약 정상 과학자가 실험 결과를 얻는다면</div></div><div class=\"rc ckc\"><div class=\"e\">which <span class=\"cw\">conflicts with</span> the paradigm,</div><div class=\"k\">패러다임과 <span class=\"cw\">상충하는</span> ※ 문제지엔 corresponds로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">they will usually assume</div><div class=\"k\">그들(= 정상 과학자들)은 보통 생각한다</div></div><div class=\"rc ckc\"><div class=\"e\">that their <span class=\"cw\">experimental technique is faulty</span>,</div><div class=\"k\"><span class=\"cw\">자신의 실험 기술에 결함이 있다고</span></div></div><div class=\"rc\"><div class=\"e\">not that the paradigm is wrong.</div><div class=\"k\">패러다임이 틀렸다고는 아니고.</div></div><div class=\"rnat\">만약 정상 과학자가 패러다임과 상충하는(문제지엔 '부합하는') 실험 결과를 얻는다면, 그들은 보통 자신의 실험 기술에 결함이 있다고 생각하며, 패러다임이 틀렸다고는 생각하지 않는다.</div><div class=\"rst\">맛이 레시피와 <b>어긋나면</b>(conflicts) “내가 잘못 끓였나 봐” 하고 자기를 탓해요. 그래서 문제지의 corresponds(부합하다)는 틀려요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"encounter\" data-m=\"맞닥뜨리다, 마주하다\"><b>encounter</b>맞닥뜨리다, 마주하다</button><button type=\"button\" class=\"wdb\" data-w=\"eliminate\" data-m=\"없애다, 제거하다\"><b>eliminate</b>없애다, 제거하다</button><button type=\"button\" class=\"wdb\" data-w=\"conservative\" data-m=\"보수적인\"><b>conservative</b>보수적인</button><button type=\"button\" class=\"wdb\" data-w=\"novelty\" data-m=\"참신함, 새로운 것\"><b>novelty</b>참신함, 새로운 것</button><button type=\"button\" class=\"wdb\" data-w=\"unquestioningly\" data-m=\"의심 없이\"><b>unquestioningly</b>의심 없이</button><button type=\"button\" class=\"wdb\" data-w=\"faulty\" data-m=\"결함이 있는\"><b>faulty</b>결함이 있는</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>however</b>(그러나) 뒤 Wald(왈드)의 새 생각이에요. 지휘관의 생각(맞은 곳 강화)과 <b>반대</b>이면서, 바로 뒤 6번 <b>Those</b>(그것들)가 풀어 주는 ‘맞으면 못 돌아오는 곳’을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (5번)</span><div class=\"en\">Wald, however, saw that … these bullet holes had not destroyed the planes, and what needed more protection were <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">총알구멍은 비행기를 파괴하지 않았고, 더 보호가 필요한 곳은 ( ? )이라는 것을 알았다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 앞 however(그러나)가 이 생각을 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 뒤집힐 생각</span><div class=\"en\">commanders wanted to reinforce those areas because they seemed to <mark>get hit most often</mark>.</div><p class=\"ko\">그 부분들이 <mark>총알을 가장 자주 맞는</mark> 것처럼 보였기 때문에 지휘관들은 그러한 부분들을 강화하기를 원했다.</p></div><div class=\"ck-via\"><i>▼</i><span>Those(그것들) = 빈칸이 가리키는 곳을 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">Those were the parts where, if a plane was struck by a bullet, <mark>it would never be seen again</mark>.</div><p class=\"ko\">그것들은 만약 비행기가 총알을 맞았다면 그것이 <mark>절대로 다시 보이지 않았을</mark> 부분들이었다.</p></div><div class=\"ck-via\"><i>▼</i><span>못 돌아온 비행기 = 이야기를 못 해 주는 다른 사람들</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 생존 편향 확인</span><div class=\"en\">We're prone to listen to the success stories from survivors because <mark>the others aren't around</mark> to tell the tale.</div><p class=\"ko\">우리는 생존자들의 성공담을 듣는 경향이 있는데, <mark>다른 사람들(= 사망자들)은 주위에 없기 때문이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">the areas that were not hit 총알을 맞지 않은 부분들<small>6번 ‘맞았다면 다시는 못 돌아왔을 곳’ = 돌아온 비행기에서 안 맞은 곳이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">the data that analyzed broken parts 부서진 부분을 분석한 자료</span><span class=\"why\">4번에서 총알구멍(부서진 곳)을 보고 강화하자고 한 건 지휘관이에요. Wald(왈드)는 however(그러나)로 그 생각을 뒤집었으니 부서진 곳 자료는 정반대 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">high technologies to make airplanes 비행기를 만드는 첨단 기술</span><span class=\"why\">기술 이야기는 지문에 없어요. Wald(왈드)는 통계학자(statistician)이고, 7번처럼 계산(calculations)과 논리로 조종사를 구했어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">military plans for bombing the targets 목표물 폭격을 위한 군사 계획</span><span class=\"why\">폭격기(bomber planes)가 나오지만 문제는 폭격 계획이 아니라 3번처럼 비행기를 더 안전하게 만드는 방법이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">the commanders of the army 군 지휘관들</span><span class=\"why\">4번의 지휘관들(commanders)은 보호받을 대상이 아니라 잘못 판단한 사람들이에요. 6번 Those(그것들)는 사람 아닌 the parts(부분들)라서 어긋나요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">“Survivorship bias”</div><div class=\"k\">'생존 편향'은</div></div><div class=\"rc\"><div class=\"e\">is a common logical fallacy.</div><div class=\"k\">흔한 논리적 오류이다.</div></div><div class=\"rnat\">'생존 편향'은 흔한 논리적 오류이다.</div><div class=\"rst\">학교 자전거 대여소 이야기예요. 돌아온 자전거만 보고 판단하면 실수하기 쉬워요. = 지문 1번의 ‘생존 편향’(survivorship bias)이라는 오류예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We're prone to listen</div><div class=\"k\">우리는 듣는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">to the success stories from survivors</div><div class=\"k\">생존자들의 성공담을</div></div><div class=\"rc ckc\"><div class=\"e\">because <span class=\"cw\">the others aren't around</span></div><div class=\"k\">왜냐하면 <span class=\"cw\">다른 사람들(= 사망자들)은 주위에 없기 때문이다</span></div></div><div class=\"rc\"><div class=\"e\">to tell the tale.</div><div class=\"k\">이야기(실패담)를 해줄.</div></div><div class=\"rnat\">우리는 생존자들의 성공담을 듣는 경향이 있는데, 왜냐하면 이야기(실패담)를 해줄 다른 사람들(사망자들)은 주위에 없기 때문이다.</div><div class=\"rst\">고장 나서 길에 버려진 자전거는 대여소에 <b>돌아오지 못해서</b> 말이 없어요. 지문 2번처럼 살아남은 쪽 이야기만 들리는 거예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">A dramatic example from history</div><div class=\"k\">역사에서 보는 극적인 예시는</div></div><div class=\"rc\"><div class=\"e\">is the case of statistician Abraham Wald</div><div class=\"k\">통계학자 Abraham Wald의 경우이다</div></div><div class=\"rc\"><div class=\"e\">who, during World War II,</div><div class=\"k\">그는 제2차 세계 대전 동안</div></div><div class=\"rc\"><div class=\"e\">was hired by the U.S. Air Force</div><div class=\"k\">미국 공군에 의해 고용되었다</div></div><div class=\"rc\"><div class=\"e\">to determine how to make</div><div class=\"k\">어떻게 만들지 알아내기 위해</div></div><div class=\"rc\"><div class=\"e\">their bomber planes safer.</div><div class=\"k\">그들(= 미국 공군)의 폭격기를 더 안전하게.</div></div><div class=\"rnat\">역사에서 보는 극적인 예시는 제2차 세계 대전 동안 폭격기를 더 안전하게 만드는 방법을 알아내기 위해 미국 공군에 의해 고용된 통계학자 Abraham Wald(아브라함 왈드)의 경우이다.</div><div class=\"rst\">선생님이 자전거를 더 튼튼하게 만들 방법을 알아 오라고 반장에게 맡겨요. 지문 3번의 Wald(왈드)가 받은 임무와 같아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The planes that returned</div><div class=\"k\">돌아온 비행기들은</div></div><div class=\"rc\"><div class=\"e\">tended to have bullet holes</div><div class=\"k\">총알구멍을 가지고 있는 경향이 있었다</div></div><div class=\"rc\"><div class=\"e\">along the wings, body, and tail,</div><div class=\"k\">날개, 본체, 그리고 꼬리(부분)를 따라</div></div><div class=\"rc\"><div class=\"e\">and commanders wanted to reinforce</div><div class=\"k\">그리고 지휘관들은 강화하기를 원했다</div></div><div class=\"rc\"><div class=\"e\">those areas</div><div class=\"k\">그러한 부분들을</div></div><div class=\"rc\"><div class=\"e\">because they seemed to get hit most often.</div><div class=\"k\">그것들(= 그 부분들)이 총알을 가장 자주 맞는 것처럼 보였기 때문에.</div></div><div class=\"rnat\">돌아온 비행기들은 날개, 본체, 그리고 꼬리(부분)를 따라 총알구멍이 있었고, 그 부분들이 총알을 가장 자주 맞는 것처럼 보였기 때문에 지휘관들은 그러한 부분들을 강화하기를 원했다.</div><div class=\"rst\">돌아온 자전거엔 바구니·안장·짐받이에 흠집이 많아요. 그래서 다들 그 부분을 보강하자고 해요. = 지문 4번 지휘관들의 생각이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Wald, <span class=\"cw\">however</span>,</div><div class=\"k\"><span class=\"cw\">그러나</span> Wald는</div></div><div class=\"rc\"><div class=\"e\">saw</div><div class=\"k\">알게 되었다</div></div><div class=\"rc\"><div class=\"e\">that the important thing was</div><div class=\"k\">중요한 것은 ~라는 것을</div></div><div class=\"rc\"><div class=\"e\">that these bullet holes had not destroyed the planes,</div><div class=\"k\">이러한 총알구멍들이 비행기를 파괴한 것이 아니라는 것,</div></div><div class=\"rc\"><div class=\"e\">and what needed more protection</div><div class=\"k\">그리고 더 보호가 필요한 곳은</div></div><div class=\"rc ckc\"><div class=\"e\">were <span class=\"cw\">the areas that were not hit</span>.</div><div class=\"k\"><span class=\"cw\">총알을 맞지 않은 부분들이라는 것을</span>. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">그러나 Wald는 중요한 것이 이러한 총알구멍들이 비행기를 파괴한 것이 아니라는 것, 그리고 더 보호가 필요한 곳은 총알을 맞지 않은 부분들이라는 것을 알게 되었다.</div><div class=\"rst\"><b>그러나</b>(however) 반장은 흠집 난 곳이 고장의 원인이 아니고, <b>흠집이 없는 곳</b>을 지켜야 한다고 봐요. = 지문 5번, 이게 빈칸이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Those were the parts</div><div class=\"k\">그것들(= 총알을 맞지 않은 부분들)은 부분들이었다</div></div><div class=\"rc\"><div class=\"e\">where, if a plane was struck by a bullet,</div><div class=\"k\">만약 비행기가 총알을 맞았다면</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">it would never be seen again.</span></div><div class=\"k\">그것(= 비행기)이 <span class=\"cw\">절대로 다시 보이지 않았을</span> (부분).</div></div><div class=\"rnat\">그것들(총알을 맞지 않은 부분)은 만약 비행기가 총알을 맞았다면, 그것(비행기)이 절대로 다시 보이지 않았을(위치에 있는) 부분들이었다(그 부분들에 총알을 맞았다면 그 비행기는 절대로 다시 볼 수 없었을 것이다).</div><div class=\"rst\">브레이크가 망가진 자전거는 사고가 나서 <b>다시 못 돌아왔거든요</b>. 지문 6번, 맞으면 다시는 못 보는 곳이 바로 빈칸 자리예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">His calculations</div><div class=\"k\">그의(= Wald) 계산은</div></div><div class=\"rc\"><div class=\"e\">based on that logic</div><div class=\"k\">그 논리에 근거한</div></div><div class=\"rc\"><div class=\"e\">are still in use today,</div><div class=\"k\">오늘날에도 여전히 사용되고 있고</div></div><div class=\"rc\"><div class=\"e\">and they have saved many pilots.</div><div class=\"k\">그것(= 그의 계산)은 많은 조종사들의 목숨을 구했다.</div></div><div class=\"rnat\">그의 논리에 근거한 그의 계산은 오늘날에도 여전히 사용되고 있고, 그것은 많은 조종사들의 목숨을 구했다.</div><div class=\"rst\">이 생각 덕분에 지금도 많은 사람이 안전하게 타요. 지문 7번처럼 Wald(왈드)의 계산은 지금도 쓰이며 조종사들을 구했어요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"survivorship bias\" data-m=\"생존 편향\"><b>survivorship bias</b>생존 편향</button><button type=\"button\" class=\"wdb\" data-w=\"fallacy\" data-m=\"오류\"><b>fallacy</b>오류</button><button type=\"button\" class=\"wdb\" data-w=\"prone\" data-m=\"~하는 경향이 있는 (be prone to ~하는 경향이 있다)\"><b>prone</b>~하는 경향이 있는 (be prone to ~하는 경향이 있다)</button><button type=\"button\" class=\"wdb\" data-w=\"statistician\" data-m=\"통계학자\"><b>statistician</b>통계학자</button><button type=\"button\" class=\"wdb\" data-w=\"reinforce\" data-m=\"강화하다\"><b>reinforce</b>강화하다</button><button type=\"button\" class=\"wdb\" data-w=\"strike\" data-m=\"(총알 등이) 맞히다 (be struck by ~에 맞다)\"><b>strike</b>(총알 등이) 맞히다 (be struck by ~에 맞다)</button></div>"};

 var b=e.target.closest('.stbtn');

 var w=e.target.closest('.wdb');

});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" data-q="'+d.no+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
