<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

 "and looked down at the letter again.", "k": "편지를 다시 내려보았다."}], "easy": "Ester는 기뻐서 펄쩍펄쩍 뛰며 편지를 다시 내려다봤어요.", "gist": "심경 변화의 '나중 감정'이 나오는 문장이에요. 기뻐서 신이 난(excited) 모습이에요."}, {"n": 13, "ch": [{"e": "She couldn't wait", "k": "그녀는 <b>몹시 ~하고 싶었다<\/b>(기다릴 수 없었다)"}, {"e": "to tell this news", "k": "이 소식을 말하는 것을"}, {"e": "to her family.", "k": "가족에게."}], "easy": "Ester는 이 소식을 가족에게 빨리 말하고 싶어 했어요.", "gist": "기쁜 마음이 이어지는 마무리예요."}]}, {"no": "03", "typ": "요지", "src": "2021년 3월 22번", "evn": [4, 5, 7], "ev_en": "Ecosystems are dynamic, and although some may endure, apparently unchanged, for periods that are long in comparison with the human lifespan, they must and do change eventually. / Species come and go, climates change, plant and animal communities adapt to altered circumstances, and when examined in fine detail such adaptation and consequent change can be seen to be taking place constantly. / Our planet is dynamic, and so are the arrangements by which its inhabitants live together.", "ev_ko": [[4, "생태계는 역동적이고, 일부는 겉보기에 변하지 않은 채로 인간의 수명과 비교하면 오랜 기간 동안 지속될지도 모르지만, 그것들은 결국 반드시 그리고 정말 변한다."], [5, "생물 종들은 생겨났다 사라지고, 기후는 변화하며, 동식물 군집은 달라진 환경에 적응하는데, 아주 상세하게 검토하면 그런 적응과 결과적인 변화는 항상 일어나고 있는 것으로 보일 수 있다."], [7, "우리의 지구는 역동적이고, 그것(지구)의 서식자들이 함께 사는 방식도 그러하다."]], "why": ["요지 문제는 저자가 <b>반박하는 통념<\/b>과 <b>제시하는 진실<\/b>을 함께 봐야 합니다", "4번에서 생태계는 <b>역동적이며 결국 변한다<\/b>고 하고, 5번에서 그런 적응과 변화가 <b>항상 일어나고 있다<\/b>고 하며, 7번에서 <b>우리의 지구는 역동적<\/b>이라고 마무리합니다", "즉 자연은 정적이지 않고 끊임없이 변화한다는 것이 이 글의 요지입니다."], "ch": [{"n": "①", "t": "생물 다양성이 높은 생태계가 기후 변화에 더 잘 적응한다.", "g": "", "ok": false, "e": ["생물 다양성(biodiversity)과 기후 변화 적응력을 비교하는 내용은 본문에 없습니다."]}, {"n": "②", "t": "인간의 부적절한 개입은 자연의 균형을 깨뜨린다.", "g": "", "ok": false, "e": ["이 글은 '<b>자연의 균형<\/b>'이라는 개념 자체가 <b>잘못된 통념(myth)<\/b>이라고 말합니다", "6번 <b>The 'balance of nature' is a myth.<\/b>가 근거입니다", "사람의 개입이 균형을 깨뜨린다는 내용은 없습니다."]}, {"n": "③", "t": "자연은 정적이지 않고 역동적으로 계속 변한다.", "g": "", "ok": true, "e": ["4·5·7번의 <b>생태계는 역동적이며 결국 변한다<\/b>, <b>변화는 항상 일어나고 있다<\/b>, <b>지구는 역동적이다<\/b>라는 내용을 그대로 담고 있습니다."]}, {"n": "④", "t": "모든 생물은 적자생존의 원칙에 순응하기 마련이다.", "g": "", "ok": false, "e": ["적자생존(survival of the fittest)이라는 개념은 본문에 등장하지 않습니다."]}, {"n": "⑤", "t": "동식물은 상호 경쟁을 통해 생태계의 균형을 이룬다.", "g": "", "ok": false, "e": ["상호 경쟁(mutual competition)을 통한 균형에 관한 내용은 없습니다", "오히려 균형이라는 개념 자체를 부정합니다."]}], "tr": ["생태계를 손상하는 것에 대한 두려움은 우리가 초래하는 파괴를 최소화하는 것을 목표로 해야 한다는 건전한 환경 보호주의자 원칙을 바탕으로 하지만, 이 원칙이 '자연의 균형'이라는 오래된 개념과 혼동될지도 모른다는 위험이 있다.", "이것(자연의 균형)은 자기 자신을 유지하려고 노력하며 우리가 바꾸어서는 안 되는 완벽한 자연의 질서를 전제로 한다.", "그것은 목가적이라고까지는 할 수 없어도 낭만적인 개념이지만, 그것이 정적인 상태를 전제로 하기 때문에 매우 오해의 소지가 있다.", "생태계는 역동적이고, 일부는 겉보기에 변하지 않은 채로 인간의 수명과 비교하면 오랜 기간 동안 지속될지도 모르지만, 그것들은 결국 반드시 그리고 정말 변한다.", "생물 종들은 생겨났다 사라지고, 기후는 변화하며, 동식물 군집은 달라진 환경에 적응하는데, 아주 상세하게 검토하면 그런 적응과 결과적인 변화는 항상 일어나고 있는 것으로 보일 수 있다.", "'자연의 균형'은 근거 없는 믿음이다.", "우리의 지구는 역동적이고, 그것(지구)의 서식자들이 함께 사는 방식도 그러하다."], "ps": [{"n": 1, "ch": [{"e": "Fears of damaging ecosystems", "k": "생태계를 손상하는 것에 대한 <b>두려움<\/b>은"}, {"e": "are based on the sound conservationist principle", "k": "건전한 환경 보호주의자 <b>원칙<\/b>에 바탕을 둔다"}, {"e": "that we should aim to minimize", "k": "우리가 최소화하는 것을 목표로 해야 한다는"}, {"e": "the disruption we cause,", "k": "우리가 초래하는 파괴를,"}, {"e": "but there is a risk", "k": "하지만 위험이 있다"}, {"e": "that this principle may be confused", "k": "이 원칙이 혼동될지도 모른다는"}, {"e": "with the old idea of a ‘balance of nature.’", "k": "'자연의 균형'이라는 <b>오래된 개념<\/b>과."}], "easy": "생태계를 해치면 안 된다는 생각은 좋은 원칙이에요. 그런데 이 원칙이 '자연의 균형'이라는 옛 생각과 헷갈릴 위험이 있어요.", "gist": "글의 문제 제기예요. 좋은 원칙과 '자연의 균형'이라는 옛 개념을 섞어 버리면 안 된다고 말하기 시작해요."}, {"n": 2, "ch": [{"e": "This supposes", "k": "이것<span class=\"r\">(= 자연의 균형)<\/span>은 전제로 한다"}, {"e": "a perfect order of nature", "k": "자연의 <b>완벽한 질서<\/b>를"}, {"e": "that will seek to maintain itself", "k": "그것<span class=\"r\">(= 질서)<\/span>이 스스로를 유지하려고 노력하는"}, {"e": "and that we should not change.", "k": "그리고 우리가 바꾸어서는 안 되는."}], "easy": "'자연의 균형'은 자연에 완벽한 질서가 있고, 그 질서는 스스로 유지되며 우리가 바꾸면 안 된다고 가정해요.", "gist": "'자연의 균형'이라는 개념이 무엇을 가정 ther.", "k": "그것<span class=\"r\">(= 지구)<\/span>의 서식자들이 함께 사는."}], "easy": "지구도 계속 변하고, 지구에 사는 생물들이 함께 사는 방식도 계속 변해요.", "gist": "글 전체를 마무리하는 요지 문장이에요. 자연은 정적이지 않고 역동적이에요."}]}, {"no": "04", "typ": "어법", "src": "2017년 6월 28번", "evn": [7], "ev_en": "Productivity improvements are as important to the economy as they are to the individual business that's making them. (문제지에는 ④가 do로 되어 있음)", "ev_ko": [[7, "생산성 향상은 그것들을 만들어 내는 개별 기업에 중요한 만큼 경제에도 중요하다."]], "why": ["어법 문제는 밑줄 부분이 <b>대신 받는 말<\/b>이 무엇인지가 근거입니다", "앞 절이 <b>are important<\/b>라는 <b>be동사+형용사<\/b> 구조이므로, <b>as ~ as<\/b> 뒤에서 이를 대신하는 대동사도 <b>be동사(are)<\/b>여야 합니다", "do는 일반동사를 대신하는 대동사이므로 여기서는 어법상 틀립니다."], "ch": [{"n": "①", "t": "that", "g": "that: 너무 ~해서 …하다 (so ~ that 구문의 that)", "ok": false, "e": ["<b>so + 형/부 + that + S+V<\/b>(너무 ~해서 …하다) 구문의 <b>that<\/b>으로 적절하게 쓰였습니다."]}, {"n": "②", "t": "basically", "g": "basically: 기본적으로 (부사)", "ok": false, "e": ["동사 <b>are tapping<\/b>을 수식하는 <b>부사<\/b> 자리이므로 basically는 적절합니다."]}, {"n": "③", "t": "needed", "g": "needed: 필요한 (과거분사)", "ok": false, "e": ["<b>the machinery or employee training<\/b>을 뒤에서 꾸미는 <b>과거분사<\/b>입니다", "기계나 훈련은 '필요로 <b>되는<\/b>' 것이므로 수동 관계이고, 쓰임이 적절합니다."]}, {"n": "④", "t": "do", "g": "do: 하다 (대동사) → are로 고쳐야 함", "ok": true, "e": ["앞 절의 <b>are important<\/b>(be동사)를 대신해야 하므로 대동사 <b>do<\/b>가 아니라 <b>are<\/b>로 고쳐야 합니다."]}, {"n": "⑤", "t": "are", "g": "are: ~이다 (복수 주어의 be동사)", "ok": false, "e": ["주어 <b>Productivity improvements<\/b>가 복수이므로 be동사 <b>are<\/b>는 수 일치가 적절합니다."]}], "tr": ["비용을 줄이는 것은 수익성을 향상시킬 수 있지만 단지 어느 정도까지이다.", "만약 제조업자가 비용을 너무 많이 줄여서 그렇게 하는 것이 그 제품의 품질을 손상시킨다면, 그 증가된 수익성은 일시적일 것이다.", "더 나은 접근법은 생산성을 향상시키는 것이다.", "만약 기업들이 같은 수의 직원들로부터 더 많은 생산을 얻을 수 있다면, 그들은 기본적으로 공짜 돈을 이용하는 것이다.", "그들은 판매할 상품을 더 많이 얻고, 각 제품의 가격이 떨어진다.", "생산성 향상에 필요한 기계 또는 직원 훈련이 생산성 향상으로 인한 이윤의 가치보다 비용이 더 적게 드는 한, 이것은 어떤 기업이라도 하기 쉬운 투자이다.", "생산성 향상은 그것들을 만들어 내는 개별 기업에 중요한 만큼 경제에도 중요하다.", "생산성 향상은 일반적으로 모든 사람을 위한 삶의 수준을 올리고 건강한 경제의 좋은 지표가 된다."], "ps": [{"n": 1, "ch": [{"e": "Cutting costs", in problems)<\/b>는 흐름은 적절합니다."]}, {"n": "②", "t": "eliminate", "g": "eliminate: 없애다", "ok": false, "e": ["정상 과학자가 사소한 문제들을 <b>없애려고(eliminate)<\/b> 한다는 설명은 적절합니다."]}, {"n": "③", "t": "conservative", "g": "conservative: 보수적인", "ok": false, "e": ["기존 패러다임을 발전·확장하려 한다는 내용으로 볼 때 정상 과학이 <b>보수적인(conservative)<\/b> 활동이라는 설명은 적절합니다."]}, {"n": "④", "t": "unquestioningly", "g": "unquestioningly: 의심 없이", "ok": false, "e": ["정상 과학자들은 패러다임을 시험하지 않고 <b>의심 없이(unquestioningly)<\/b> 받아들이며, 그것이 설정한 한계 안에서 연구한다는 내용과 맞습니다", "적절합니다."]}, {"n": "⑤", "t": "corresponds", "g": "corresponds: 부합하다 (→ conflicts: 상충하다)", "ok": true, "e": ["실험 결과가 패러다임과 <b>부합한다(corresponds)<\/b>면 실험 기술을 의심할 이유가 없습니다", "문맥상 실험 기술의 결함을 의심하려면 결과가 패러다임과 <b>상충해야(conflicts)<\/b> 하므로 corresponds는 틀린 낱말입니다."]}], "tr": ["정상 과학은 정확히 무엇을 포함하는가?", "Thomas Kuhn에 따르면, 그것은 주로 '문제 해결'의 문제이다.", "패러다임이 아무리 성공적일지라도, 그것은 항상 특정한 문제들을 맞닥뜨릴 것이다 — 그 패러다임이 쉽게 수용할 수 없는 현상, 또는 이론의 예측과 실험에 입각한 사실 사이의 불일치 말이다.", "정상 과학자들의 임무는 패러다임을 가능한 한 거의 변화시키지 않으면서, 이러한 작은 문제들을 없애려고 노력하는 것이다.", "따라서 정상 과학은 보수적인 활동이며, 그것을 실행하는 사람은 세상을 떠들썩하게 하는 어떤 발견이라도 해내려고 하는 것이 아니라, 오히려 단지 기존의 패러다임을 발전시키고 확장하고자 노력하고 있다.", "Kuhn의 말에 따르면, '정상 과학은 사실 또는 이론의 참신함을 목표로 하지 않고, 성공적일 때에는 아무것도 찾지 못한다.'", "무엇보다도, Kuhn은 정상 과학자들이 패러다임을 '시험'하려 하지 않는다는 것을 강조했다.", "그와는 반대로, 그들은 패러다임을 의심 없이 받아들이고, 그것이 설정한 한계 내에서 그들의 연구를 수행한다.", "만약 정상 과학자가 패러다임과 상충하는(문제지엔 '부합하는') 실험 결과를 얻는다면, 그들은 보통 자신의 실험 기술에 결함이 있다고 생각하며, 패러다임이 틀렸다고는 생각하지 않는다."], "ps": [{"n": 1, "ch": [{"e": "What exactly", "k": "정확히 무엇을"}, {"e": "does normal science involve?", "k": "정상 과학은 <b>포함하는가<\/b>?"}], "easy": "정상 과학은 정확히 어떤 일을 하는 걸까요?", "gist": "질문으로 글을 시작해요."}, {"n": 2, "ch": [{"e": "According to Thomas Kuhn", "k": "Thomas Kuhn에 따르면"}, {"e": "it is primarily a matter", "k": "그것<span class=\"r\">(= 정상 과학)<\/span>은 주로 문제이다"}, {"e": "of <i>puzzle-solving<\/i>.", "k": "'문제 해결'의."}], "easy": "Kuhn은 정상 과학이 주로 '문제 해결'이라고 봤어요.", "gist": "1번 질문에 대한 답이에요. 정상 과학 = 문제 해결."}, {"n": 3, "ch": [{"e": "However successful a paradigm is,", "k": " function noteList(){

  });
  return out;
}

}

자가 비용을 줄인다면 / 너무 깊게 / 그렇게 하는 것이 해친다면 / 제품의 품질을 / 그러면 그 증가된 수익성은 / 일시적일 것이다", "nat": "만약 제조업자가 비용을 너무 많이 줄여서 그렇게 하는 것이 그 제품의 품질을 손상시킨다면, 그 증가된 수익성은 일시적일 것이다.", "ana": "<b>so + 부사 + that절</b>은 '너무 ~해서 …하다'라는 뜻입니다. that절의 주어 <b>doing so</b>는 앞의 <b>cuts costs so deeply</b>라는 행위를 가리키는 <b>동명사구</b>입니다.", "pe": "\u0001If the manufacturer cuts costs<sup>1</sup>\u0002 / \u0001so deeply<sup>2</sup>\u0002 / \u0001that doing so harms\u0002 / \u0001the product's quality\u0002, / \u0001then\u0002 the \u0001increased\u0002 profitability / will be short-lived<sup>3</sup>.", "pk": "\u0001만약 제조업자가 비용을 줄인다면\u0002 / \u0001너무 깊게\u0002 / \u0001그렇게 하는 것이 해친다면\u0002 / \u0001제품의 품질을\u0002 / \u0001그러면\u0002 그 \u0001증가된\u0002 수익성은 / 일시적일 것이다", "core": "수익성은 일시적일 것이다.", "tags": ["If절 시작 = 부사절: will be를 꾸밈 (조건). 동사 cuts costs", "so deeply = 부사구: cuts를 꾸밈. <b>so ~ that</b> (너무 ~해서 …하다)", "that절 = 부사절(결과): deeply를 꾸밈. 주어 doing so는 앞 행위를 가리키는 동명사구", "harms의 목적어 (that절 안)", "then = 부사: 주절을 꾸밈 (if절과 호응). 주어 profitability (increased = 분사 형용사: 꾸밈)", "동사 will be + 보어 short-lived (SVC)"], "steps": [{"t": "이 문장은 <b>If 조건절 + S+V+C(2형식)</b>이다. if절 안에 so ~ that 구문이 들어 있어서 길어 보인다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: the increased profitability (증가된 수익성. increased 증가된, profitability 수익성)", "V: will be (be ~일 것이다)", "C: short-lived (일시적인, 오래가지 못하는)", "뼈대 = <b>the increased profitability will be short-lived</b> (then 그러면, 부사)"]}, {"t": "맨 앞 <b>If the manufacturer cuts costs</b>는 조건 부사절이다.", "sub": ["S: the manufacturer (제조업자) / V: cuts (cut 줄이다의 3인칭 단수 현재형) / O: costs (비용)"]}, {"t": "<b>so deeply that ~</b>는 'so ~ that' 구문이다 (너무 깊게 ~해서 …하다). so deeply는 cuts를 꾸미고, that절은 그 결과를 말한다.", "sub": ["that절: S doing so (그렇게 하는 것 = 비용을 깊게 줄이는 것. 동명사구) / V harms (해치다) / O the product's quality (제품의 품질)"]}, {"t": "함정: so와 that이 떨어져 있어서 that을 관계대명사로 착각하기 쉽다. 여기서는 so와 짝을 이루는 접속사이다."}], "sum": "비용을 너무 깎아 품질이 떨어지면 늘어난 수익은 오래가지 못함"}, {"i": "06", "q": "05", "s": "3", "title": "However 양보절 + S+V+O + 대시 동격", "eng": "However successful a paradigm is, / it will always encounter<sup>1</sup> / certain problems / — phenomena<sup>2</sup> / which it cannot easily accommodate<sup>3</sup>, / or mismatches<sup>4</sup> / between the theory's predictions and the experimental facts.", "notes": [["1", "encounter", "맞닥뜨리다"], ["2", "phenomenon", "현상"], ["3", "accommodate", "수용하다"], ["4", "mismatch", "불일치"]], "lit": "아무리 패러다임이 성공적일지라도 / 그것은 항상 맞닥뜨릴 것이다 / 특정한 문제들을 / 현상들 / 그것이 쉽게 수용할 수 없는 (현상들) / 또는 불일치를 / 이론의 예측과 실험적 사실들 사이의", "nat": "패러다임이 아무리 성공적일지라도, 그것은 항상 특정한 문제들을 맞닥뜨릴 것이다 — 그 패러다임이 쉽게 수용할 수 없는 현상, 또는 이론의 예측과 실험에 입각한 사실 사이의 불일치 말이다.", "ana": "<b>However + 형용사 + S + V</b>는 '아무리 ~할지라도'라는 <b>양보 구문</b>입니다. 대시(—) 뒤의 <b>phenomena which ~</b>와 <b>mismatches ~</b>는 <b>certain problems</b>를 구체적으로 풀어 설명하는 <b>동격 관계</b>입니다.", "pe": "\u0001However successful a paradigm is\u0002, / it will \u0001always\u0002 encounter<sup>1</sup> / \u0001certain\u0002 problems / — \u0001phenomena<sup>2</sup>\u0002 / \u0001which it cannot easily accommodate<sup>3</sup>\u0002, / \u0001or mismatches<sup>4</sup>\u0002 / \u0001between the theory's predictions and the experimental facts\u0002.", "pk": "\u0001아무리 패러다임이 성공적일지라도\u0002 / 그것은 \u0001항상\u0002 맞닥뜨릴 것이다 / \u0001특정한\u0002 문제들을 / 현상들 / \u0001그것이 쉽게 수용할 수 없는\u0002 (현상들) / \u0001또는 불일치를\u0002 / \u0001이론의 예측과 실험적 사실들 사이의\u0002", "core": "그것은 문제들을 맞닥뜨릴 것이다.", "tags": ["However ~ = 양보 부사절: will encounter를 꾸밈 (아무리 ~할지라도). <b>However + 형용사 + S + V</b>", "주어 it + 동사 will encounter. always = 부사: encounter를 꾸밈", "목적어 problems (certain = 형용사: problems를 꾸밈)", "대시 뒤 phenomena = 동격: problems를 구체적으로 설명", "which ~ = 관계절(형용사절): phenomena를 꾸밈 (목적격 관계대명사)", "or mismatches = 동격 병렬: problems를 설명 (phenomena와 짝)", "between ~ = 전치사구(형용사구): mismatches를 꾸밈"], "steps": [{"t": "이 문장은 <b>However 양보절 + S+V+O(3형식)</b>이다. 대시(—) 뒤에 동격 설명이 길게 붙는다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: it (= a paradigm, 패러다임)", "V: will encounter (encounter 맞닥뜨리다)", "O: certain problems (특정한 문제들)", "뼈대 = <b>it will always encounter certain problems</b> (always 항상)"]}, {"t": "맨 앞 <b>However successful a paradigm is</b>는 'However + 형용사 + S + V'의 양보절이다 (아무리 ~할지라도).", "sub": ["S: a paradigm (패러다임) / V: is / C: successful (성공적인)"]}, {"t": "대시 뒤는 problems를 구체적으로 풀어 주는 동격이고, or로 둘이 이어진다.", "sub": ["① phenomena which it cannot easily accommodate (그것이 쉽게 수용할 수 없는 현상들)", "② or mismatches between the theory's predictions and the experimental facts (이론의 예측과 실험적 사실들 사이의 불일치)"]}, {"t": "①의 which는 목적격 관계대명사이다. phenomena를 꾸민다 (accommodate 수용하다, phenomena는 phenomenon 현상의 복수형).", "sub": ["②의 between A and B: A = the theory's predictions (이론의 예측), B = the experimental facts (실험적 사실들). mismatch 불일치"]}], "sum": "아무리 성공한 패러다임도 수용 못 할 현상이나 이론·실험 불일치를 만남"}, {"i": "07", "q": "06", "s": "3", "title": "S+V+C + who절 (수동태 + 목적 to부정사)", "eng": "A dramatic example from history / is the case of statistician<sup>1</sup> Abraham Wald / who, during World War II, / was hired<sup>2</sup> by the U.S. Air Force / to determine<sup>3</sup> / how to make their bomber planes<sup>4</sup> safer.", "notes": [["1", "statistician", "통계학자"], ["2", "be hired", "고용되다"], ["3", "determine", "알아내다, 결정하다"], ["4", "bomber plane", "폭격기"]], "lit": "역사에서 보는 극적인 예시는 / 통계학자 Abraham Wald의 경우인데 / 제2차 세계대전 동안 / 미국 공군에 의해 고용된 / 알아내기 위해 / 어떻게 그들의 폭격기를 더 안전하게 만들지", "nat": "역사에서 보는 극적인 예시는 제2차 세계 대전 동안 폭격기를 더 안전하게 만드는 방법을 알아내기 위해 미국 공군에 의해 고용된 통계학자 Abraham Wald의 경우이다.", "ana": "<b>who</b>는 Abraham Wald를 선행사로 하는 <b>주격 관계대명사</b>이며, <b>was hired</b>는 <b>수동태</b>입니다. <b>to determine ~</b>은 '~을 알아내기 위해'라는 <b>목적</b>의 to부정사이고, 그 안의 <b>how to make ~ safer</b>는 <b>의문사+to부정사</b> 구문입니다.", "pe": "A \u0001dramatic\u0002 example \u0001from history\u0002 / is the case \u0001of statistician<sup>1</sup> Abraham Wald\u0002 / \u0001who, during World War II\u0002, / \u0001was hired<sup>2</sup> by the U.S. Air Force\u0002 / \u0001to determine<sup>3</sup>\u0002 / \u0001how to make their bomber planes<sup>4</sup> safer\u0002.", "pk": "\u0001역사에서 보는 극적인\u0002 예시는 / \u0001통계학자 Abraham Wald의\u0002 경우인데 / \u0001제2차 세계대전 동안\u0002 / \u0001미국 공군에 의해 고용된\u0002 / \u0001알아내기 위해\u0002 / \u0001어떻게 그들의 폭격기를 더 안전하게 만들지\u0002", "core": "예시는 경우이다.", "tags": ["주어 example. dramatic = 형용사: example을 꾸밈. from history = 전치사구(형용사구): example을 꾸밈", "동사 is + 보어 case (SVC). of ~ = 전치사구(형용사구): case를 꾸밈", "who ~ = 관계절(형용사절) 시작: Abraham Wald를 꾸밈. during World War II = 삽입 전치사구(부사구): was hired를 꾸밈", "관계절의 동사부: <b>was hired</b> (수동태). by ~ = 행위자 전치사구", "to determine = to부정사(부사적: 목적): was hired를 꾸밈 (관계절 안)", "how절 = determine의 목적어 (의문사 + to부정사). make A safer (5형식)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 보어 뒤에 who 관계절이 붙어서 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: A dramatic example (극적인 예시. dramatic 극적인, example 예시)", "V: is (be ~이다)", "C: the case (경우)", "뼈대 = <b>A dramatic example is the case</b>"]}, {"t": "<b>from history</b>는 example을 꾸미고, <b>of statistician Abraham Wald</b>는 case를 꾸민다 (statistician 통계학자)."}, {"t": "<b>who ~ safer</b>는 관계절(형용사절)이다. Abraham Wald를 꾸민다.", "sub": ["V: was hired (hire 고용하다의 수동태) / by the U.S. Air Force (미국 공군에 의해)", "during World War II = 제2차 세계대전 동안 (삽입된 전치사구)"]}, {"t": "<b>to determine how to make their bomber planes safer</b>는 목적을 나타내는 to부정사이다 (알아내기 위해).", "sub": ["determine 알아내다 / how to ~ = 어떻게 ~할지 (determine의 목적어)", "make + O + C: make their bomber planes safer (그들의 폭격기를 더 안전하게 만들다). their = the U.S. Air Force. bomber 폭격기"]}], "sum": "역사 속 극적인 예, 폭격기를 안전하게 할 방법을 찾도록 공군에 고용된 통계학자 월드"}, {"i": "08", "q": "06", "s": "4", "title": "S+V+O 두 문장 (and) + because절", "eng": "The planes that returned / tended to have bullet holes<sup>1</sup> / along the wings, body, and tail, / and commanders wanted / to reinforce<sup>2</sup> those areas / because they seemed / to get hit<sup>3</sup> most often.", "notes": [["1", "bullet hole", "총알구멍"], ["2", "reinforce", "강화하다"], ["3", "get hit", "맞다, 타격을 입다"]], "lit": "돌아온 비행기들은 / 총알구멍을 가지고 있는 경향이 있었다 / 날개, 본체, 꼬리를 따라 / 그리고 지휘관들은 원했다 / 그 부분들을 강화하기를 / 왜냐하면 그것들이 보였기 때문에 / 가장 자주 맞은 것처럼", "nat": "돌아온 비행기들은 날개, 본체, 그리고 꼬리 부분을 따라 총알구멍이 있는 경향이 있었고, 그 부분들이 총알을 가장 자주 맞는 것처럼 보였기 때문에 지휘관들은 그러한 부분들을 강화하기를 원했다.", "ana": "<b>that returned</b>는 The planes를 꾸미는 <b>주격 관계대명사절</b>입니다. <b>tended to have</b>와 <b>wanted to reinforce</b>가 <b>and</b>로 병렬 연결된 두 개의 본동사이며, <b>because</b>는 이유를 나타내는 접속사입니다.", "pe": "The planes \u0001that returned\u0002 / tended to have bullet holes<sup>1</sup> / \u0001along the wings, body, and tail\u0002, / and commanders wanted / to reinforce<sup>2</sup> those areas / \u0001because they seemed\u0002 / \u0001to get hit<sup>3</sup> most often\u0002.", "pk": "\u0001돌아온\u0002 비행기들은 / 총알구멍을 가지고 있는 경향이 있었다 / \u0001날개, 본체, 꼬리를 따라\u0002 / 그리고 지휘관들은 원했다 / 그 부분들을 강화하기를 / \u0001왜냐하면 그것들이 보였기 때문에\u0002 / \u0001가장 자주 맞은 것처럼\u0002", "core": "비행기들은 총알구멍을 가지는 경향이 있었고, 지휘관들은 그 부분들을 강화하기를 원했다.", "tags": ["주어 planes. that returned = 관계절(형용사절): planes를 꾸밈 (주격 관계대명사)", "동사 <b>tended to have</b> (~하는 경향이 있다) + 목적어 bullet holes", "along ~ = 전치사구(부사구): have를 꾸밈 (위치)", "and = 동사 병렬 (tended / wanted). 주어 commanders + 동사 wanted", "목적어 to reinforce those areas (to부정사)", "because ~ = 부사절: wanted를 꾸밈 (이유). 안의 seemed", "to get hit = seemed의 to부정사 (~처럼 보이다). most often = 부사구: get hit을 꾸밈"], "steps": [{"t": "이 문장은 <b>and로 이은 두 개의 문장</b>이다. 앞은 S+V+O(3형식), 뒤는 S+V+O(3형식)이다."}, {"t": "앞 문장의 뼈대부터 찾는다.", "sub": ["S: The planes (비행기들)", "V: tended (tend 경향이 있다의 과거형. tend + to부정사는 3형식)", "O: to have bullet holes (총알구멍을 가지는 것. have 가지다, bullet hole 총알구멍)", "뼈대 = <b>The planes tended to have bullet holes</b>"]}, {"t": "<b>that returned</b>는 관계절(형용사절)이다. planes를 꾸민다 ('돌아온'. return 돌아오다). <b>along the wings, body, and tail</b>은 '날개, 본체, 꼬리를 따라'라는 전치사구이다. 총알구멍이 있는 위치를 말하며 bullet holes를 꾸민다 (wing 날개, tail 꼬리)."}, {"t": "and 뒤 문장의 뼈대를 찾는다.", "sub": ["S: commanders (지휘관들)", "V: wanted (원했다)", "O: to reinforce those areas (그 부분들을 강화하는 것. reinforce 강화하다, area 부분)", "뼈대 = <b>commanders wanted to reinforce those areas</b>"]}, {"t": "<b>because they seemed to get hit most often</b>는 이유 부사절이다. wanted를 꾸민다.", "sub": ["they = those areas (그 부분들)", "seem to ~ = ~처럼 보이다 (seemed는 2형식이고 to get hit ~이 보어), get hit = 맞다 (hit 때리다, 맞히다), most often 가장 자주"]}], "sum": "돌아온 비행기의 총알 자국 부위가 가장 자주 맞는 곳으로 보여 강화하길 원함"}], "qs": [{"q": "01", "type": "주장", "src": "2020년 11월 20번", "ans": "⑤", "tr": [["1", "누군가에게 그들의 마음을 바꾸도록 설득하려고 할 때, 대부분의 사람들은 논리적 주장을 펼치려고 하거나 왜 자신의 견해가 옳고 다른 사람의 의견이 틀렸는지에 대해 열정적인 항변을 한다."], ["2", "하지만 당신이 그것에 대해 생각해 보면, 당신은 이것이 종종 효과가 없다는 것을 깨달을 것이다."], ["3", "누군가가 당신이 자신의 마음을 바꾸려는 임무를 띠고 있다는 것을 알아차리자마자, 은유적인 셔터가 내려진다."], ["4", "만약 당신이 누군가가 자기 자신의 가정(전제)을 의심하도록 잘 선택된, 다양한 답이 가능한 질문을 한다면 당신은 더 좋은 운이 따를 것이다."], ["5", "우리는 우리가 어떤 견해를 먼저 생각해 냈을 때, 혹은 적어도 우리가 그것을 먼저 생각해 냈다고 '생각할' 때, 그것을 인정하려는 경향이 있다."], ["6", "그러므로 누군가에게 자기 자신의 세계관에 의문을 갖도록 장려하는 것은 당신의 의견을 사실로 받아들이도록 그들에게 강요하려는 것보다 종종 더 나은 결과를 가져올 것이다."], ["7", "누군가에게 자기 자신의 관점을 다른 각도에서 바라보도록 잘 선택된 질문을 하라, 그러면 이것은 새로운 통찰을 유발할 것이다."]], "evh": "4·7번 문장", "ev": [{"en": true, "h": "You'll have better luck if you ask well-chosen, open-ended questions that let someone challenge their own assumptions. / Ask someone well-chosen questions to look at their own views from another angle, and this might trigger fresh insights."}, {"en": false, "h": "주장 문제는 저자가 반복해서 제시하는 <b>구체적인 방법</b>이 핵심입니다. 4번과 7번 모두 '<b>잘 선택된 질문을 던져 상대가 스스로 자신의 관점을 돌아보게 하라</b>'고 말하고 있으므로, 이것이 이 글의 주장입니다."}], "opts": [{"n": "①", "t": "타인의 신뢰를 얻기 위해서는 일관된 행동을 보여 주어라.", "a": false, "x": true, "trap": false, "e": "일관된 행동(consistent behavior)에 관한 내용은 본문에 없습니다."}, {"n": "②", "t": "협상을 잘하기 위해 질문에 담긴 상대방의 의도를 파악하라.", "a": false, "x": true, "trap": true, "e": "상대의 <b>질문 의도를 파악하라</b>는 것이 아니라, 내가 <b>좋은 질문을 던지라</b>는 내용입니다."}, {"n": "③", "t": "논쟁을 잘하려면 자신의 가치관에서 벗어나려는 시도를 하라.", "a": false, "x": true, "trap": false, "e": "자신의 가치관이 아니라 <b>상대방</b>이 스스로의 가정을 의심하게 만들라는 내용입니다."}, {"n": "④", "t": "원만한 대인 관계를 유지하려면 상대를 배려하는 태도를 갖춰라.", "a": false, "x": true, "trap": false, "e": "대인 관계 유지(maintaining relationships)에 관한 내용은 본문과 무관합니다."}, {"n": "⑤", "t": "설득하고자 할 때 상대방이 스스로 관점을 돌아보게 하는 질문을 하라.", "a": true   if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';
  app.innerHTML=h;
}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    if(c[p]){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent='오답노트장에 담았어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1400);}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
