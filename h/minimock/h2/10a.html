<title>고2 미니모의고사 10회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}
.evx .en{background:#fff;border:1px solid #d5eadc;font-size:15.5px;margin:0 0 8px}
.evx p{margin:6px 0;font-size:15.5px;line-height:1.75}
.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}
.ch.open .ct{display:block}

.sc-h .chv{position:absolute;right:16px;top:17px;width:9px;height:9px;border-right:2.5px solid var(--sub);border-bottom:2.5px solid var(--sub);transform:rotate(45deg);transition:transform .15s}

/* 직독직해 v2: 전체 펼침, 뼈대 빨강 / 살 회색 */

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}
.sc .ce{font-size:18px;line-height:1.5;font-weight:800;color:#c62828}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n1{background:#eef4fb;border-color:#d3e0f0;border-left-color:#2d62a8}.sc .fin.n1 b{color:#2d62a8}
.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}
.rst:before{content:"결국 이 얘기  ";font-size:11.5px;font-weight:800;color:#8a6d00}

.rdb{display:flex;flex-direction:column}

.wc{padding:14px 0;border-bottom:1px solid var(--line)}
.wc .h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.wc .h .no{color:var(--sub);font-size:13px;min-width:20px}

 "and looked down at the letter again.", "k": "편지를 다시 내려보았다."}], "easy": "Ester는 기뻐서 펄쩍펄쩍 뛰며 편지를 다시 내려다봤어요.", "gist": "심경 변화의 '나중 감정'이 나오는 문장이에요. 기뻐서 신이 난(excited) 모습이에요."}, {"n": 13, "ch": [{"e": "She couldn't wait", "k": "그녀는 <b>몹시 ~하고 싶었다<\/b>(기다릴 수 없었다)"}, {"e": "to tell this news", "k": "이 소식을 말하는 것을"}, {"e": "to her family.", "k": "가족에게."}], "easy": "Ester는 이 소식을 가족에게 빨리 말하고 싶어 했어요.", "gist": "기쁜 마음이 이어지는 마무리예요."}]}, {"no": "03", "typ": "요지", "src": "2021년 3월 22번", "evn": [4, 5, 7], "ev_en": "Ecosystems are dynamic, and although some may endure, apparently unchanged, for periods that are long in comparison with the human lifespan, they must and do change eventually. / Species come and go, climates change, plant and animal communities adapt to altered circumstances, and when examined in fine detail such adaptation and consequent change can be seen to be taking place constantly. / Our planet is dynamic, and so are the arrangements by which its inhabitants live together.", "ev_ko": [[4, "생태계는 역동적이고, 일부는 겉보기에 변하지 않은 채로 인간의 수명과 비교하면 오랜 기간 동안 지속될지도 모르지만, 그것들은 결국 반드시 그리고 정말 변한다."], [5, "생물 종들은 생겨났다 사라지고, 기후는 변화하며, 동식물 군집은 달라진 환경에 적응하는데, 아주 상세하게 검토하면 그런 적응과 결과적인 변화는 항상 일어나고 있는 것으로 보일 수 있다."], [7, "우리의 지구는 역동적이고, 그것(지구)의 서식자들이 함께 사는 방식도 그러하다."]], "why": ["요지 문제는 저자가 <b>반박하는 통념<\/b>과 <b>제시하는 진실<\/b>을 함께 봐야 합니다", "4번에서 생태계는 <b>역동적이며 결국 변한다<\/b>고 하고, 5번에서 그런 적응과 변화가 <b>항상 일어나고 있다<\/b>고 하며, 7번에서 <b>우리의 지구는 역동적<\/b>이라고 마무리합니다", "즉 자연은 정적이지 않고 끊임없이 변화한다는 것이 이 글의 요지입니다."], "ch": [{"n": "①", "t": "생물 다양성이 높은 생태계가 기후 변화에 더 잘 적응한다.", "g": "", "ok": false, "e": ["생물 다양성(biodiversity)과 기후 변화 적응력을 비교하는 내용은 본문에 없습니다."]}, {"n": "②", "t": "인간의 부적절한 개입은 자연의 균형을 깨뜨린다.", "g": "", "ok": false, "e": ["이 글은 '<b>자연의 균형<\/b>'이라는 개념 자체가 <b>잘못된 통념(myth)<\/b>이라고 말합니다", "6번 <b>The 'balance of nature' is a myth.<\/b>가 근거입니다", "사람의 개입이 균형을 깨뜨린다는 내용은 없습니다."]}, {"n": "③", "t": "자연은 정적이지 않고 역동적으로 계속 변한다.", "g": "", "ok": true, "e": ["4·5·7번의 <b>생태계는 역동적이며 결국 변한다<\/b>, <b>변화는 항상 일어나고 있다<\/b>, <b>지구는 역동 in problems)<\/b>는 흐름은 적절합니다."]}, {"n": "②", "t": "eliminate", "g": "eliminate: 없애다", "ok": false, "e": ["정상 과학자가 사소한 문제들을 <b>없애려고(eliminate)<\/b> 한다는 설명은 적절합니다."]}, {"n": "③", "t": "conservative", "g": "conservative: 보수적인", "ok": false, "e": ["기존 패러다임을 발전·확장하려 한다는 내용으로 볼 때 정상 과학이 <b>보수적인(conservative)<\/b> 활동이라는 설명은 적절합니다."]}, {"n": "④", "t": "unquestioningly", "g": "unquestioningly: 의심 없이", "ok": false, "e": ["정상 과학자들은 패러다임을 시험하지 않고 <b>의심 없이(unquestioningly)<\/b> 받아들이며, 그것이 설정한 한계 안에서 연구한다는 내용과 맞습니다", "적절합니다."]}, {"n": "⑤", "t": "corresponds", "g": "corresponds: 부합하다 (→ conflicts: 상충하다)", "ok": true, "e": ["실험 결과가 패러다임과 <b>부합한다(corresponds)<\/b>면 실험 기술을 의심할 이유가 없습니다", "문맥상 실험 기술의 결함을 의심하려면 결과가 패러다임과 <b>상충해야(conflicts)<\/b> 하므로 corresponds는 틀린 낱말입니다."]}], "tr": ["정상 과학은 정확히 무엇을 포함하는가?", "Thomas Kuhn에 따르면, 그것은 주로 '문제 해결'의 문제이다.", "패러다임이 아무리 성공적일지라도, 그것은 항상 특정한 문제들을 맞닥뜨릴 것이다 — 그 패러다임이 쉽게 수용할 수 없는 현상, 또는 이론의 예측과 실험에 입각한 사실 사이의 불일치 말이다.", "정상 과학자들의 임무는 패러다임을 가능한 한 거의 변화시키지 않으면서, 이러한 작은 문제들을 없애려고 노력하는 것이다.", "따라서 정상 과학은 보수적인 활동이며, 그것을 실행하는 사람은 세상을 떠들썩하게 하는 어떤 발견이라도 해내려고 하는 것이 아니라, 오히려 단지 기존의 패러다임을 발전시키고 확장하고자 노력하고 있다.", "Kuhn의 말에 따르면, '정상 과학은 사실 또는 이론의 참신함을 목표로 하지 않고, 성공적일 때에는 아무것도 찾지 못한다.'", "무엇보다도, Kuhn은 정상 과학자들이 패러다임을 '시험'하려 하지 않는다는 것을 강조했다.", "그와는 반대로, 그들은 패러다임을 의심 없이 받아들이고, 그것이 설정한 한계 내에서 그들의 연구를 수행한다.", "만약 정상 과학자가 패러다임과 상충하는(문제지엔 '부합하는') 실험 결과를 얻는다면, 그들은 보통 자신의 실험 기술에 결함이 있다고 생각하며, 패러다임이 틀렸다고는 생각하지 않는다."], "ps": [{"n": 1, "ch": [{"e": "What exactly", "k": "정확히 무엇을"}, {"e": "does normal science involve?", "k": "정상 과학은 <b>포함하는가<\/b>?"}], "easy": "정상 과학은 정확히 어떤 일을 하는 걸까요?", "gist": "질문으로 글을 시작해요."}, {"n": 2, "ch": [{"e": "According to Thomas Kuhn", "k": "Thomas Kuhn에 따르면"}, {"e": "it is primarily a matter", "k": "그것<span class=\"r\">(= 정상 과학)<\/span>은 주로 문제이다"}, {"e": "of <i>puzzle-solving<\/i>.", "k": "'문제 해결'의."}], "easy": "Kuhn은 정상 과학이 주로 '문제 해결'이라고 봤어요.", "gist": "1번 질문에 대한 답이에요. 정상 과학 = 문제 해결."}, {"n": 3, "ch": [{"e": "However successful a paradigm is,", "k": " function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function dwToast(m){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1800);}
function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}
document.addEventListener('click',function(e){
  const el=e.target.closest&&e.target.closest('.dw');if(!el)return;
  e.stopPropagation();e.preventDefault();

  const head=it[2]||it[0],mean=it[1];S.dw=S.dw||{};const on=!S.dw[head];
  if(on)S.dw[head]=1;else delete S.dw[head];save();dwMark(head,on);
  if(on){try{WN.add([{w:head,m:mean,src:'미니모고',how:'별표',ask:true}]);}catch(err){}dwToast(head.replace(/\s+[AB](?=\s|$)/g,'').trim()+'  '+mean.replace(/\bA(?=[에를은는이가와과의도]|\s)|\bB(?=[에를은는이가와과의도]|\s)/g,'').replace(/\s+/g,' ').trim()+'  담음');}
  else{let pr=null;try{pr=WN.del(head,'미니모고');}catch(err){}
    if(pr&&pr.then)pr.then(function(r){if(r&&r.removed===false&&r.reason==='late'){S.dw[head]=1;save();dwMark(head,true);dwToast('이미 쌓인 단어라 뺄 수 없어요');}else if(r&&r.removed)dwToast(head+'  뺌');});
    else dwToast(head+'  뺌');}
},true);

b": ["S: this (이것) / V: must be (~임에 틀림없다) / C: what절", "must be = 강한 추측"]}, {"t": "<b>what she was eagerly waiting for</b>는 be의 보어가 되는 what절(명사절)이다 ('그녀가 간절히 기다리고 있던 것').", "sub": ["wait for ~ = ~를 기다리다. for 뒤의 목적어 자리가 비어 있고, 그 자리를 what이 채운다", "eagerly 간절히"]}], "sum": "그녀는 이것이 간절히 기다리던 바로 그것이라고 확신"}, {"i": "04", "q": "03", "s": "1", "title": "but으로 이은 두 문장 + 동격절 2개", "eng": "Fears of damaging ecosystems / are based on / the sound conservationist<sup>1</sup> principle / that we should aim to minimize<sup>2</sup> the disruption<sup>3</sup> we cause, / but there is a risk / that this principle may be confused with<sup>4</sup> / the old idea of a 'balance of nature.'", "notes": [["1", "conservationist", "환경 보호주의의"], ["2", "minimize", "최소화하다"], ["3", "disruption", "파괴, 붕괴"], ["4", "be confused with", "~과 혼동되다"]], "lit": "생태계를 손상하는 것에 대한 두려움은 / 근거를 두고 있다 / 건전한 환경 보호주의 원칙에 / 우리가 초래하는 파괴를 최소화하는 것을 목표로 해야 한다는 / 하지만 위험이 있다 / 이 원칙이 혼동될지도 모른다는 / 자연의 균형이라는 오래된 개념과", "nat": "생태계를 손상하는 것에 대한 두려움은 우리가 초래하는 파괴를 최소화하는 것을 목표로 해야 한다는 건전한 환경 보호주의 원칙을 바탕으로 하지만, 이 원칙이 '자연의 균형'이라는 오래된 개념과 혼동될지도 모른다는 위험이 있다.", "ana": "첫 번째 <b>that</b>은 principle과 <b>동격</b>을 이루는 명사절 접속사이고, 두 번째 <b>that</b>은 a risk와 <b>동격</b>을 이루는 명사절 접속사입니다. <b>be based on</b>과 <b>but there is a risk that ~</b>이 <b>but</b>으로 대비를 이룹니다.", "pe": "Fears \u0001of damaging ecosystems\u0002 / are based on / \u0001the \u0001sound conservationist<sup>1</sup>\u0002 principle\u0002 / \u0001that we should aim to minimize<sup>2</sup> the disruption<sup>3</sup> we cause\u0002, / but there is a risk / \u0001that this principle may be confused with<sup>4</sup>\u0002 / \u0001the old idea of a 'balance of nature\u0002.'", "pk": "\u0001생태계를 손상하는 것에 대한\u0002 두려움은 / 근거를 두고 있다 / \u0001\u0001건전한 환경 보호주의\u0002 원칙에\u0002 / \u0001우리가 초래하는 파괴를 최소화하는 것을 목표로 해야 한다는\u0002 / 하지만 위험이 있다 / \u0001이 원칙이 혼동될지도 모른다는\u0002 / \u0001자연의 균형이라는 오래된 개념과\u0002", "core": "두려움은 근거하고 있지만, 위험이 있다.", "tags": ["주어 Fears. of ~ = 전치사구(형용사구): Fears를 꾸밈 (of 뒤 동명사)", "수동태 <b>are based</b> (1형식). on + 다음 덩어리 = 전치사구(부사구): are based를 꾸밈, 거의 필수에 가까운 부사구(be based on)[천일문S 표기 A] [기준: 모양 규칙]", "the sound ~ principle = on의 목적어(전치사구의 일부): are based를 꾸밈. sound conservationist = 형용사: principle을 꾸밈", "that ~ = 동격절: principle의 내용을 설명. 안의 (that) we cause는 disruption을 꾸미는 관계절", "but = 접속사 (대비). there is + 진짜 주어 a risk (1형식)", "that ~ = 동격절: risk의 내용을 설명. <b>be confused with</b> = ~와 혼동되다", "with의 목적어 idea (동격절 안, 혼동되는 대상)"], "steps": [{"t": "이 문장은 <b>but으로 이은 두 개의 문장</b>이다. 각 문장 뒤에 동격 that절이 붙어서 길어 보인다."}, {"t": "앞 문장의 뼈대부터 찾는다.", "sub": ["S: Fears (두려움들. fear 두려움)", "V: are based (base 근거를 두다의 수동태, 1형식)", "on the sound conservationist principle = be based on ~에 근거하다", "(문형 기준) 수동태 주절은 1형식이고, on ~은 거의 필수에 가까운 부사구이지만 뼈대에는 넣지 않음", "뼈대 = <b>Fears are based</b> (on the principle)"]}, {"t": "주어 뒤 <b>of damaging ecosystems</b>는 Fears를 꾸민다 (생태계를 손상하는 것에 대한. damage 손상하다, ecosystem 생태계). sound(건전한), conservationist(환경 보호주의의)는 principle(원칙)을 꾸미는 형용사이다."}, {"t": "<b>that we should aim to minimize the disruption we cause</b>는 principle의 내용을 설명하는 동격절이다.", "sub": ["aim to ~ = ~하는 것을 목표로 하다, minimize 최소화하다, disruption 파괴", "we cause = 목적격 관계대명사가 생략된 관계절. disruption을 꾸민다 (cause 초래하다)"]}, {"t": "but 뒤 문장의 뼈대를 찾는다.", "sub": ["there is + 진짜 주어 a risk (위험이 있다. 1형식)", "뼈대 = <b>there is a risk</b>"]}, {"t": "<b>that this principle may be confused with the old idea of a 'balance of nature.'</b>는 risk의 내용을 설명하는 동격절이다.", "sub": ["S: this principle / V: may be confused (혼동될지도 모른다) / with ~ (be confused with ~와 혼동되다)", "balance of nature 자연의 균형"]}], "sum": "생태계 훼손 우려는 건전한 원칙에 근거하나, '자연의 균형'과 혼동될 위험도 있음"}, {"i": "05", "q": "04", "s": "2", "title": "If절 (so ~ that 결과절) + S+V+C", "eng": "If the manufacturer cuts costs<sup>1</sup> / so deeply<sup>2</sup> / that doing so harms / the product's quality, / then the increased profitability / will be short-lived<sup>3</sup>.", "notes": [["1", "cut costs", "비용을 줄이다"], ["2", "deeply", "깊게, 심하게"], ["3", "short-lived", "일시적인"]], "lit": "만약 제조업자가 비용을 줄인다면 / 너무 깊게 / 그렇게 하는 것이 해친다면 / 제품의 품질을 / 그러면 그 증가된 수익성은 / 일시적일 것이다", "nat": "만약 제조업자가 비용을 너무 많이 줄여서 그렇게 하는 것이 그 제품의 품질을 손상시킨다면, 그 증가된 수익성은 일시적일 것이다.", "ana": "<b>so + 부사 + that절</b>은 '너무 ~해서 …하다'라는 뜻입니다. that절의 주어 <b>doing so</b>는 앞의 <b>cuts costs so deeply</b>라는 행위를 가리키는 <b>동명사구</b>입니다.", "pe": "\u0001If the manufacturer cuts costs<sup>1</sup>\u0002 / \u0001so deeply<sup>2</sup>\u0002 / \u0001that doing so harms\u0002 / \u0001the product's quality\u0002, / \u0001then\u0002 the \u0001increased\u0002 profitability / will be short-lived<sup>3</sup>.", "pk": "\u0001만약 제조업자가 비용을 줄인다면\u0002 / \u0001너무 깊게\u0002 / \u0001그렇게 하는 것이 해친다면\u0002 / \u0001제품의 품질을\u0002 / \u0001그러면\u0002 그 \u0001증가된\u0002 수익성은 / 일시적일 것이다", "core": "수익성은 일시적일 것이다.", "tags": ["If절 시작 = 부사절: will be를 꾸밈 (조건). 동사 cuts costs", "so deeply = 부사구: cuts를 꾸밈. <b>so ~ that</b> (너무 ~해서 …하다)", "that절 = 부사절(결과): deeply를 꾸밈. 주어 doing so는 앞 행위를 가리키는 동명사구", "harms의 목적어 (that절 안)", "then = 부사: 주절을 꾸밈 (if절과 호응). 주어 profitability (increased = 분사 형용사: 꾸밈)", "동사 will be + 보어 short-lived (SVC)"], "steps": [{"t": "이 문장은 <b>If 조건절 + S+V+C(2형식)</b>이다. if절 안에 so ~ that 구문이 들어 있어서 길어 보인다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: the increased profitability (증가된 수익성. increased 증가된, profitability 수익성)", "V: will be (be ~일 것이다)", "C: short-lived (일시적인, 오래가지 못하는)", "뼈대 = <b>the increased profitability will be short-lived</b> (then 그러면, 부사)"]}, {"t": "맨 앞 <b>If the manufacturer cuts costs</b>는 조건 부사절이다.", "sub": ["S: the manufacturer (제조업자) / V: cuts (cut 줄이다의 3인칭 단수 현재형) / O: costs (비용)"]}, {"t": "<b>so deeply that ~</b>는 'so ~ that' 구문이다 (너무 깊게 ~해서 …하다). so deeply는 cuts를 꾸미고, that절은 그 결과를 말한다.", "sub": ["that절: S doing so (그렇게 하는 것 = 비용을 깊게 줄이는 것. 동명사구) / V harms (해치다) / O the product's quality (제품의 품질)"]}, {"t": "함정: so와 that이 떨어져 있어서 that을 관계대명사로 착각하기 쉽다. 여기서는 so와 짝을 이루는 접속사이다."}], "sum": "비용을 너무 깎아 품질이 떨어지면 늘어난 수익은 오래가지 못함"}, {"i": "06", "q": "05", "s": "3", "title": "However 양보절 + S+V+O + 대시 동격", "eng": "However successful a paradigm is, / it will always encounter<sup>1</sup> / certain problems / — phenomena<sup>2</sup> / which it cannot easily accommodate<sup>3</sup>, / or mismatches<sup>4</sup> / between the theory's predictions and the experimental facts.", "notes": [["1", "encounter", "맞닥뜨리다"], ["2", "phenomenon", "현상"], ["3", "accommodate", "수용하다"], ["4", "mismatch", "불일치"]], "lit": "아무리 패러다임이 성공적일지라도 / 그것은 항상 맞닥뜨릴 것이다 / 특정한 문제들을 / 현상들 / 그것이 쉽게 수용할 수 없는 (현상들) / 또는 불일치를 / 이론의 예측과 실험적 사실들 사이의", "nat": "패러다임이 아무리 성공적일지라도, 그것은 항상 특정한 문제들을 맞닥뜨릴 것이다 — 그 패러다임이 쉽게 수용할 수 없는 현상, 또는 이론의 예측과 실험에 입각한 사실 사이의 불일치 말이다.", "ana": "<b>However + 형용사 + S + V</b>는 '아무리 ~할지라도'라는 <b>양보 구문</b>입니다. 대시(—) 뒤의 <b>phenomena which ~</b>와 <b>mismatches ~</b>는 <b>certain problems</b>를 구체적으로 풀어 설명하는 <b>동격 관계</b>입니다.", "pe": "\u0001However successful a paradigm is\u0002, / it will \u0001always\u0002 encounter<sup>1</sup> / \u0001certain\u0002 problems / — \u0001phenomena<sup>2</sup>\u0002 / \u0001which it cannot easily accommodate<sup>3</sup>\u0002, / \u0001or mismatches<sup>4</sup>\u0002 / \u0001between the theory's predictions and the experimental facts\u0002.", "pk": "\u0001아무리 패러다임이 성공적일지라도\u0002 / 그것은 \u0001항상\u0002 맞닥뜨릴 것이다 / \u0001특정한\u0002 문제들을 / 현상들 / \u0001그것이 쉽게 수용할 수 없는\u0002 (현상들) / \u0001또는 불일치를\u0002 / \u0001이론의 예측과 실험적 사실들 사이의\u0002", "core": "그것은 문제들을 맞닥뜨릴 것이다.", "tags": ["However ~ = 양보 부사절: will encounter를 꾸밈 (아무리 ~할지라도). <b>However + 형용사 + S + V</b>", "주어 it + 동사 will encounter. always = 부사: encounter를 꾸밈", "목적어 problems (certain = 형용사: problems를 꾸밈)", "대시 뒤 phenomena = 동격: problems를 구체적으로 설명", "which ~ = 관계절(형용사절): phenomena를 꾸밈 (목적격 관계대명사)", "or mismatches = 동격 병렬: problems를 설명 (phenomena와 짝)", "between ~ = 전치사구(형용사구): mismatches를 꾸밈"], "steps": [{"t": "이 문장은 <b>However 양보절 + S+V+O(3형식)</b>이다. 대시(—) 뒤에 동격 설명이 길게 붙는다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: it (= a paradigm, 패러다임)", "V: will encounter (encounter 맞닥뜨리다)", "O: certain problems (특정한 문제들)", "뼈대 = <b>it will always encounter certain problems</b> (always 항상)"]}, {"t": "맨 앞 <b>However successful a paradigm is</b>는 'However + 형용사 + S + V'의 양보절이다 (아무리 ~할지라도).", "sub": ["S: a paradigm (패러다임) / V: is / C: successful (성공적인)"]}, {"t": "대시 뒤는 problems를 구체적으로 풀어 주는 동격이고, or로 둘이 이어진다.", "sub": ["① phenomena which it cannot easily accommodate (그것이 쉽게 수용할 수 없는 현상들)", "② or mismatches between the theory's predictions and the experimental facts (이론의 예측과 실험적 사실들 사이의 불일치)"]}, {"t": "①의 which는 목적격 관계대명사이다. phenomena를 꾸민다 (accommodate 수용하다, phenomena는 phenomenon 현상의 복수형).", "sub": ["②의 between A and B: A = the theory's predictions (이론의 예측), B = the experimental facts (실험적 사실들). mismatch 불일치"]}], "sum": "아무리 성공한 패러다임도 수용 못 할 현상이나 이론·실험 불일치를 만남"}, {"i": "07", "q": "06", "s": "3", "title": "S+V+C + who절 (수동태 + 목적 to부정사)", "eng": "A dramatic example from history / is the case of statistician<sup>1</sup> Abraham Wald / who, during World War II, / was hired<sup>2</sup> by the U.S. Air Force / to determine<sup>3</sup> / how to make their bomber planes<sup>4</sup> safer.", "notes": [["1", "statistician", "통계학자"], ["2", "be hired", "고용되다"], ["3", "determine", "알아내다, 결정하다"], ["4", "bomber plane", "폭격기"]], "lit": "역사에서 보는 극적인 예시는 / 통계학자 Abraham Wald의 경우인데 / 제2차 세계대전 동안 / 미국 공군에 의해 고용된 / 알아내기 위해 / 어떻게 그들의 폭격기를 더 안전하게 만들지", "nat": "역사에서 보는 극적인 예시는 제2차 세계 대전 동안 폭격기를 더 안전하게 만드는 방법을 알아내기 위해 미국 공군에 의해 고용된 통계학자 Abraham Wald의 경우이다.", "ana": "<b>who</b>는 Abraham Wald를 선행사로 하는 <b>주격 관계대명사</b>이며, <b>was hired</b>는 <b>수동태</b>입니다. <b>to determine ~</b>은 '~을 알아내기 위해'라는 <b>목적</b>의 to부정사이고, 그 안의 <b>how to make ~ safer</b>는 <b>의문사+to부정사</b> 구문입니다.", "pe": "A \u0001dramatic\u0002 example \u0001from history\u0002 / is the case \u0001of statistician<sup>1</sup> Abraham Wald\u0002 / \u0001who, during World War II\u0002, / \u0001was hired<sup>2</sup> by the U.S. Air Force\u0002 / \u0001to determine<sup>3</sup>\u0002 / \u0001how to make their bomber planes<sup>4</sup> safer\u0002.", "pk": "\u0001역사에서 보는 극적인\u0002 예시는 / \u0001통계학자 Abraham Wald의\u0002 경우인데 / \u0001제2차 세계대전 동안\u0002 / \u0001미국 공군에 의해 고용된\u0002 / \u0001알아내기 위해\u0002 / \u0001어떻게 그들의 폭격기를 더 안전하게 만들지\u0002", "core": "예시는 경우이다.", "tags": ["주어 example. dramatic = 형용사: example을 꾸밈. from history = 전치사구(형용사구): example을 꾸밈", "동사 is + 보어 case (SVC). of ~ = 전치사구(형용사구): case를 꾸밈", "who ~ = 관계절(형용사절) 시작: Abraham Wald를 꾸밈. during World War II = 삽입 전치사구(부사구): was hired를 꾸밈", "관계절의 동사부: <b>was hired</b> (수동태). by ~ = 행위자 전치사구", "to determine = to부정사(부사적: 목적): was hired를 꾸밈 (관계절 안)", "how절 = determine의 목적어 (의문사 + to부정사). make A safer (5형식)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 보어 뒤에 who 관계절이 붙어서 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: A dramatic example (극적인 예시. dramatic 극적인, example 예시)", "V: is (be ~이다)", "C: the case (경우)", "뼈대 = <b>A dramatic example is the case</b>"]}, {"t": "<b>from history</b>는 example을 꾸미고, <b>of statistician Abraham Wald</b>는 case를 꾸민다 (statistician 통계학자)."}, {"t": "<b>who ~ safer</b>는 관계절(형용사절)이다. Abraham Wald를 꾸민다.", "sub": ["V: was hired (hire 고용하다의 수동태) / by the U.S. Air Force (미국 공군에 의해)", "during World War II = 제2차 세계대전 동안 (삽입된 전치사구)"]}, {"t": "<b>to determine how to make their bomber planes safer</b>는 목적을 나타내는 to부정사이다 (알아내기 위해).", "sub": ["determine 알아내다 / how to ~ = 어떻게 ~할지 (determine의 목적어)", "make + O + C: make their bomber planes safer (그들의 폭격기를 더 안전하게 만들다). their = the U.S. Air Force. bomber 폭격기"]}], "sum": "역사 속 극적인 예, 폭격기를 안전하게 할 방법을 찾도록 공군에 고용된 통계학자 월드"}, {"i": "08", "q": "06", "s": "4", "title": "S+V+O 두 문장 (and) + because절", "eng": "The planes that returned / tended to have bullet holes<sup>1</sup> / along the wings, body, and tail, / and commanders wanted / to reinforce<sup>2</sup> those areas / because they seemed / to get hit<sup>3</sup> most often.", "notes": [["1", "bullet hole", "총알구멍"], ["2", "reinforce", "강화하다"], ["3", "get hit", "맞다, 타격을 입다"]], "lit": "돌아온 비행기들은 / 총알구멍을 가지고 있는 경향이 있었다 / 날개, 본체, 꼬리를 따라 / 그리고 지휘관들은 원했다 / 그 부분들을 강화하기를 / 왜냐하면 그것들이 보였기 때문에 / 가장 자주 맞은 것처럼", "nat": "돌아온 비행기들은 날개, 본체, 그리고 꼬리 부분을 따라 총알구멍이 있는 경향이 있었고, 그 부분들이 총알을 가장 자주 맞는 것처럼 보였기 때문에 지휘관들은 그러한 부분들을 강화하기를 원했다.", "ana": "<b>that returned</b>는 The planes를 꾸미는 <b>주격 관계대명사절</b>입니다. <b>tended to have</b>와 <b>wanted to reinforce</b>가 <b>and</b>로 병렬 연결된 두 개의 본동사이며, <b>because</b>는 이유를 나타내는 접속사입니다.", "pe": "The planes \u0001that returned\u0002 / tended to have bullet holes<sup>1</sup> / \u0001along the wings, body, and tail\u0002, / and commanders wanted / to reinforce<sup>2</sup> those areas / \u0001because they seemed\u0002 / \u0001to get hit<sup>3</sup> most often\u0002.", "pk": "\u0001돌아온\u0002 비행기들은 / 총알구멍을 가지고 있는 경향이 있었다 / \u0001날개, 본체, 꼬리를 따라\u0002 / 그리고 지휘관들은 원했다 / 그 부분들을 강화하기를 / \u0001왜냐하면 그것들이 보였기 때문에\u0002 / \u0001가장 자주 맞은 것처럼\u0002", "core": "비행기들은 총알구멍을 가지는 경향이 있었고, 지휘관들은 그 부분들을 강화하기를 원했다.", "tags": ["주어 planes. that returned = 관계절(형용사절): planes를 꾸밈 (주격 관계대명사)", "동사 <b>tended to have</b> (~하는 경향이 있다) + 목적어 bullet holes", "along ~ = 전치사구(부사구): have를 꾸밈 (위치)", "and = 동사 병렬 (tended / wanted). 주어 commanders + 동사 wanted", "목적어 to reinforce those areas (to부정사)", "because ~ = 부사절: wanted를 꾸밈 (이유). 안의 seemed", "to get hit = seemed의 to부정사 (~처럼 보이다). most often = 부사구: get hit을 꾸밈"], "steps": [{"t": "이 문장은 <b>and로 이은 두 개의 문장</b>이다. 앞은 S+V+O(3형식), 뒤는 S+V+O(3형식)이다."}, {"t": "앞 문장의 뼈대부터 찾는다.", "sub": ["S: The planes (비행기들)", "V: tended (tend 경향이 있다의 과거형. tend + to부정사는 3형식)", "O: to have bullet holes (총알구멍을 가지는 것. have 가지다, bullet hole 총알구멍)", "뼈대 = <b>The planes tended to have bullet holes</b>"]}, {"t": "<b>that returned</b>는 관계절(형용사절)이다. planes를 꾸민다 ('돌아온'. return 돌아오다). <b>along the wings, body, and tail</b>은 '날개, 본체, 꼬리를 따라'라는 전치사구이다. 총알구멍이 있는 위치를 말하며 bullet holes를 꾸민다 (wing 날개, tail 꼬리)."}, {"t": "and 뒤 문장의 뼈대를 찾는다.", "sub": ["S: commanders (지휘관들)", "V: wanted (원했다)", "O: to reinforce those areas (그 부분들을 강화하는 것. reinforce 강화하다, area 부분)", "뼈대 = <b>commanders wanted to reinforce those areas</b>"]}, {"t": "<b>because they seemed to get hit most often</b>는 이유 부사절이다. wanted를 꾸민다.", "sub": ["they = those areas (그 부분들)", "seem to ~ = ~처럼 보이다 (seemed는 2형식이고 to get hit ~이 보어), get hit = 맞다 (hit 때리다, 맞히다), most often 가장 자주"]}], "sum": "돌아온 비행기의 총알 자국 부위가 가장 자주 맞는 곳으로 보여 강화하길 원함"}], "qs": [{"q": "01", "type": "주장", "src": "2020년 11월 20번", "ans": "⑤", "tr": [["1", "누군가에게 그들의 마음을 바꾸도록 설득하려고 할 때, 대부분의 사람들은 논리적 주장을 펼치려고 하거나 왜 자신의 견해가 옳고 다른 사람의 의견이 틀렸는지에 대해 열정적인 항변을 한다."], ["2", "하지만 당신이 그것에 대해 생각해 보면, 당신은 이것이 종종 효과가 없다는 것을 깨달을 것이다."], ["3", "누군가가 당신이 자신의 마음을 바꾸려는 임무를 띠고 있다는 것을 알아차리자마자, 은유적인 셔터가 내려진다."], ["4", "만약 당신이 누군가가 자기 자신의 가정(전제)을 의심하도록 잘 선택된, 다양한 답이 가능한 질문을 한다면 당신은 더 좋은 운이 따를 것이다."], ["5", "우리는 우리가 어떤 견해를 먼저 생각해 냈을 때, 혹은 적어도 우리가 그것을 먼저 생각해 냈다고 '생각할' 때, 그것을 인정하려는 경향이 있다."], ["6", "그러므로 누군가에게 자기 자신의 세계관에 의문을 갖도록 장려하는 것은 당신의 의견을 사실로 받아들이도록 그들에게 강요하려는 것보다 종종 더 나은 결과를 가져올 것이다."], ["7", "누군가에게 자기 자신의 관점을 다른 각도에서 바라보도록 잘 선택된 질문을 하라, 그러면 이것은 새로운 통찰을 유발할 것이다."]], "evh": "4·7번 문장", "ev": [{"en": true, "h": "You'll have better luck if you ask well-chosen, open-ended questions that let someone challenge their own assumptions. / Ask someone well-chosen questions to look at their own views from another angle, and this might trigger fresh insights."}, {"en": false, "h": "주장 문제는 저자가 반복해서 제시하는 <b>구체적인 방법</b>이 핵심입니다. 4번과 7번 모두 '<b>잘 선택된 질문을 던져 상대가 스스로 자신의 관점을 돌아보게 하라</b>'고 말하고 있으므로, 이것이 이 글의 주장입니다."}], "opts": [{"n": "①", "t": "타인의 신뢰를 얻기 위해서는 일관된 행동을 보여 주어라.", "a": false, "x": true, "trap": false, "e": "일관된 행동(consistent behavior)에 관한 내용은 본문에 없습니다."}, {"n": "②", "t": "협상을 잘하기 위해 질문에 담긴 상대방의 의도를 파악하라.", "a": false, "x": true, "trap": true, "e": "상대의 <b>질문 의도를 파악하라</b>는 것이 아니라, 내가 <b>좋은 질문을 던지라</b>는 내용입니다."}, {"n": "③", "t": "논쟁을 잘하려면 자신의 가치관에서 벗어나려는 시도를 하라.", "a": false, "x": true, "trap": false, "e": "자신의 가치관이 아니라 <b>상대방</b>이 스스로의 가정을 의심하게 만들라는 내용입니다."}, {"n": "④", "t": "원만한 대인 관계를 유지하려면 상대를 배려하는 태도를 갖춰라.", "a": false, "x": true, "trap": false, "e": "대인 관계 유지(maintaining relationships)에 관한 내용은 본문과 무관합니다."}, {"n": "⑤", "t": "설득하고자 할 때 상대방이 스스로 관점을 돌아보게 하는 질문을 하라.", "a": true function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
