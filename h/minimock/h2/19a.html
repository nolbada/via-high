<title>고2 미니모의고사 19회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}

.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}

details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);

    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');

he processing", "k": "우리는 막대한 양의 (정보) <b>처리를 덜어내고<\/b> 있다"}, {"e": "that our neurons would normally do", "k": "우리의 신경세포가 일반적으로 수행하는"}, {"e": "to an external device", "k": "<b>외부 장치<\/b>에"}, {"e": "that then becomes an extension of our own brains,", "k": "그리고 그 장치는 우리 자신의 <b>뇌의 확장<\/b>이 되는,"}, {"e": "a neural enhancer.", "k": "즉 신경 개선 장치."}], "link": "우리는 우리의 신경세포가 일반적으로 수행하는 막대한 양의 처리를, 이후 우리 자신의 뇌의 확장, 즉 신경 개선 장치가 되는 외부 장치에 덜어내고 있다.", "easy": "원래 신경세포가 하던 많은 정보 처리를 이제 외부 장치에 맡기고 있고, 그 장치는 우리 뇌의 연장이 된다는 뜻이에요.", "gist": "앞의 예시를 모아 결론을 말하는 마지막 문장이에요. 외부 장치가 우리 뇌의 확장이 된다는 것이 핵심이에요."}]}, {"no": "05", "typ": "어법", "src": "2016년 6월 28번", "evn": [6], "ev_en": "A designer must first document the existing conditions of a problem and collect relevant data to be analyzed.", "ev_ko": [[6, "디자이너는 먼저 기존의 문제가 있는 상황들을 기록하고, 분석되어야 할 관련 자료들을 모아야 한다."]], "why": ["병렬구문 문제입니다", "등위접속사 <b>and<\/b>가 연결하는 요소들은 형태가 같아야 합니다", "and 앞에 조동사 <b>must<\/b>의 영향을 받는 동사원형 <b>document<\/b>가 있으므로, and 뒤에도 동사원형 <b>collect<\/b>가 와야 합니다", "문제지에는 collecting으로 되어 있습니다", "existing과 collecting이 연결된다고 착각하기 쉽습니다", "하지만 해석상 '기존의 문제가 있는 상황들을 기록하고, 관련 자료를 모아야 한다'가 되어야 하므로 ④를 collect로 고쳐야 합니다."], "ch": [{"n": "①", "t": "purely", "g": "순전히, 형용사를 수식하는 부사", "ok": false, "e": ["2번 문장 <b>purely functional<\/b>(순전히 기능적인)에서 부사 purely가 형용사 functional을 수식합니다", "부사는 동사, 형용사, 다른 부사, 문장 전체를 수식할 수 있으므로 어법상 맞습니다."]}, {"n": "②", "t": "much", "g": "훨씬, 비교급을 강조하는 부사", "ok": false, "e": ["3번 문장 <b>much less satisfactory<\/b>(훨씬 덜 만족스러운)에서 much는 비교급 less를 강조하는 부사입니다", "'훨씬'이라는 뜻입니다", "이 자리에는 still, even, far, a lot도 쓸 수 있으므로 어법상 맞습니다."]}, {"n": "③", "t": "to find", "g": "찾아내려는, to부정사의 형용사적 용법", "ok": false, "e": ["4번 문장 <b>the decision to find a solution to it<\/b>(그에 대한 해결책을 찾아내려는 결정)에서 to find는 앞의 명사 the decision을 수식하는 to부정사의 형용사적 용법입니다", "어법상 맞습니다."]}, {"n": "④", "t": "collecting", "g": "모으는 → collect, 병렬구문", "ok": true, "e": ["6번 문장에서 and 앞의 <b>document<\/b>가 동사원형이므로 and 뒤도 동사원형이어야 합니다", "그래서 collecting을 <b>collect<\/b>로 고쳐야 합니다", "이 선지가 정답입니다."]}, {"n": "⑤", "t": "is defined", "g": "정의되다, 수동태", "ok": false, "e": ["7번 문장 <b>how a problem is defined<\/b>(문제가 어떻게 정의되는가)에서 주어 a problem과 동사 define의 관계가 수동입니다", "그래서 수동태 is defined가 어법상 맞습니다."]}], "tr": ["건축은 일반적으로 기존의 상황들에 대한 반응으로 구상되고, 설계되고, 실현된다.", "이러한 상황들은 사실상 순전히 기능적이거나, 사회적, 정치적, 경제적 풍조를 다양하게 반영하기도 한다.", "어떤 경우든, 기존의 상황들이 훨씬 덜 만족스럽고, 새로운 상황들이 바람직할 것이라고 추정된다.", "모든 디자인 과정의 초기 단계는 문제 상황에 대한 인식과 그에 대한 해결책을 찾아내려는 결정이다.", "디자인은 무엇보다도 목적이 있는(의도적인) 노력이다.", "디자이너는 먼저 기존의 문제가 있는 상황들을 기록하고, 분석되어야 할 관련 자료들을 모아야 한다.", "이것이 디자인 과정의 중요한 단계인데, 해결책의 본질은 문제가 어떻게 정의되는가와 관련이 있기 때문이다."], "ps": [{"n": 1, "ch": [{"e": "Architecture is generally conceived, designed, and realized", "k": "건축은 일반적으로 <b>구상되고, 설계되고, 실현된다<\/b>"}, {"e": "in response to an existing set of conditions.", "k": "기존의 상황들에 대한 반응으로."}], "easy": "건축은 보통 이미 있는 여러 조건에 대응하는 방식으로 구상되고 설계되고 지어진다는 뜻이에요.", "gist": "건축이 기존의 상황에 대한 반응이라는 출발점을 말해요."}, {"n": 2, "ch": [{"e": "These conditions may be purely functional in nature,", "k": "이러한 상황들은 사실상 <b>순전히 기능적<\/b>일 수도 있다,"}, {"e": "or they may also reflect in varying degrees", "k": "또는 다양한 정도로 반영할 수도 있다"}, {"e": "the social, political, and economic climate.", "k": "사회적, 정치적, 경제적 풍조를."}], "easy": "그 조건들은 순전히 기능적일 수도 있고, 사회·정치·경제 분위기를 어느 정도씩 반영할 수도 있다는 뜻이에요.", "gist": "앞에서 말한 기존 상황이 어떤 성격인지 설명해요."}, {"n": 3, "ch": [{"e": "In any case, it is assumed", "k": "어떤 경우든, 추정된다"}, {"e": "that the existing set of conditions is much less satisfactory", "k": "기존의 상황들이 <b>훨씬 덜 만족스럽다<\/b>고"}, {"e": "and that a new set of conditions would be desirable.", "k": "그리고 새로운 상황들이 <b>바람직할 것<\/b>이라고."}], "easy": "어느 경우든 지금의 조건은 훨씬 덜 만족스럽고, 새로운 조건이 더 바람직할 것이라고 여겨진다는 뜻이에요.", "gist": "변화가 필요하다고 보는 이유를 말해요."}, {"n": 4, "ch": [{"e": "The initial phase of any design process is", "k": "모든 디자인 과정의 <b>초기 단계<\/b>는 ~이다"}, {"e": "the recognition of a problematic condition", "k": "문제 상황에 대한 <b>인식<\/b>"}, {"e": "and the decision to find a solution to it.", "k": "그리고 그에 대한 해결책을 <b>찾아내려는 결정<\/b>." function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. ⑤처럼 <b>‘~만’</b>, <b>‘~하지 않고’</b>로 범위를 좁힌 말이 지문의 <b>둘 다</b>와 부딪히는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 1번</em>one of the most influential economists(가장 영향력 있는 경제학자들 중 한 명) → 같음</span><span><em>② ↔ 3번</em>spent most of his career(경력의 대부분을 보냈다) → 같음</span><span><em>③ ↔ 4번</em>later received the Nobel Prize(나중에 노벨상을 받았다) → 같음</span><span><em>④ ↔ 5번</em>known as the author(저자로 알려져 있다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ⑤를 마지막 9번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>⑤의 ‘은퇴 후’를 9번에서 찾아요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 앞부분 · 시점 확인</span><div class=\"en\"><mark>After retiring in 1952</mark>, Knight remained active …</div><p class=\"ko\"><mark>1952년에 은퇴한 후에도</mark>, Knight는 여전히 적극적이었다 …</p></div><div class=\"ck-via\"><i>▼</i><span>은퇴 후에 무엇을 했는지: 한 가지가 아니라 두 가지예요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 뒷부분 · 결정적 단서</span><div class=\"en\">… Knight <mark>remained active</mark> in <mark>teaching and writing</mark>.</div><p class=\"ko\">… Knight는 <mark>가르치는 일과 글 쓰는 일에</mark> <mark>여전히 적극적이었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">은퇴 후에는 가르치는 일은 하지 않고 글 쓰는 일에만 전념했다.<small>9번: 은퇴 후에도 teaching and writing(가르치는 일과 글 쓰는 일) 둘 다 열심히 했어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">경력의 대부분을 University of Chicago에서 보냈다.</span><span class=\"why\">2번에 Cornell(코넬), Iowa(아이오와), Chicago(시카고) 세 대학이 나와서 헷갈리기 쉽지만, 3번 spent most of his career(경력의 대부분을 보냈다) at the University of Chicago(시카고 대학교에서)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">20세기의 가장 영향력 있는 경제학자들 중 한 명이었다.</span><span class=\"why\">1번 one of the most influential economists(가장 영향력 있는 경제학자들 중 한 명) of the twentieth century(20세기의)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">그의 학생들 중 몇 명은 나중에 노벨상을 받았다.</span><span class=\"why\">4번 Some of his students(그의 학생들 중 몇 명은) later received the Nobel Prize(나중에 노벨상을 받았다)와 같아요. Some(몇몇) = 몇 명이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Risk(위험), Uncertainty(불확실성) and Profit(이윤)의 저자로 알려져 있다.</span><span class=\"why\">5번 is known as the author(저자로 알려져 있다) of the book(그 책의)과 같아요. 기업가의 역할을 연구한 책이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Frank Hyneman Knight was</div><div class=\"k\">Frank Hyneman Knight는 ~였다</div></div><div class=\"rc\"><div class=\"e\">one of the most influential economists</div><div class=\"k\">가장 영향력 있는 경제학자들 중 한 명</div></div><div class=\"rc\"><div class=\"e\">of the twentieth century.</div><div class=\"k\">20세기의.</div></div><div class=\"rnat\">Frank Hyneman Knight는 20세기의 가장 영향력 있는 경제학자들 중 한 명이었다.</div><div class=\"rst\">도서관 게시판에 ‘인물 소개 카드’를 붙인다고 해 봐요. 첫 줄: 20세기 가장 영향력 있는 경제학자 중 한 명. 지문 1번 = 선택지 ①이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">After obtaining his Ph.D.</div><div class=\"k\">박사 학위를 취득한 후</div></div><div class=\"rc\"><div class=\"e\">in 1916 at Cornell University,</div><div class=\"k\">1916년 Cornell University에서,</div></div><div class=\"rc\"><div class=\"e\">Knight taught</div><div class=\"k\">Knight는 가르쳤다</div></div><div class=\"rc\"><div class=\"e\">at Cornell, the University of Iowa,</div><div class=\"k\">Cornell, University of Iowa,</div></div><div class=\"rc\"><div class=\"e\">and the University of Chicago.</div><div class=\"k\">그리고 University of Chicago에서.</div></div><div class=\"rnat\">1916년 Cornell University에서 박사 학위를 취득한 후, Knight는 Cornell University, University of Iowa, 그리고 University of Chicago에서 (학생들을) 가르쳤다.</div><div class=\"rst\">둘째 줄: 1916년 코넬 대학교에서 박사 학위를 받고, 세 대학에서 가르침. 지문 2번처럼 가르친 학교를 차례로 적어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Knight spent most of his career</div><div class=\"k\">Knight는 경력의 대부분을 보냈다</div></div><div class=\"rc\"><div class=\"e\">at the University of Chicago.</div><div class=\"k\">University of Chicago에서.</div></div><div class=\"rnat\">Knight는 그의 경력의 대부분을 University of Chicago에서 보냈다.</div><div class=\"rst\">셋째 줄: 그중 시카고 대학교에서 <b>가장 오래</b> 일함. 지문 3번 ‘경력의 대부분’ = 선택지 ②예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Some of his students at Chicago</div><div class=\"k\">Chicago에서 가르친 그의 학생들 중 몇 명은</div></div><div class=\"rc\"><div class=\"e\">later received the Nobel Prize.</div><div class=\"k\">나중에 노벨상을 받았다.</div></div><div class=\"rnat\">University of Chicago에서 (가르침을 받은) 그의 학생들 중 몇 명은 나중에 노벨상을 받았다.</div><div class=\"rst\">넷째 줄: 거기서 가르친 제자 몇 명이 나중에 노벨상을 받음. 지문 4번 = 선택지 ③이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Knight is known as the author</div><div class=\"k\">Knight는 저자로 알려져 있다</div></div><div class=\"rc\"><div class=\"e\">of the book Risk, Uncertainty and Profit,</div><div class=\"k\">『Risk, Uncertainty and Profit』이라는 책의,</div></div><div class=\"rc\"><div class=\"e\">a study of the role of the entrepreneur</div><div class=\"k\">기업가의 역할에 관한 연구인</div></div><div class=\"rc\"><div class=\"e\">in economic life.</div><div class=\"k\">경제 생활에서의.</div></div><div class=\"rnat\">Knight는 경제 생활에서 기업가의 역할에 관한 연구인 『Risk, Uncertainty and Profit(위험, 불확실성 및 이윤)』이라는 책의 저자로 알려져 있다.</div><div class=\"rst\">다섯째 줄: 경제에서 기업가가 하는 역할을 연구한 책의 <b>저자</b>로 유명함. 지문 5번 = 선택지 ④예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">He also wrote</div><div class=\"k\">그는 또한 썼다</div></div><div class=\"rc\"><div class=\"e\">a brief introduction to economics</div><div class=\"k\">짧은 경제학 개론서를</div></div><div class=\"rc\"><div class=\"e\">entitled The Economic Organization,</div><div class=\"k\">『The Economic Organization』이라는 제목의,</div></div><div class=\"rc\"><div class=\"e\">which became a classic</div><div class=\"k\">그것은 고전이 되었다</div></div><div class=\"rc\"><div class=\"e\">of microeconomic theory.</div><div class=\"k\">미시 경제학 이론의.</div></div><div class=\"rnat\">그는 또한 『The Economic Organization(경제 조직)』이라는 제목의 짧은 경제학 개론서를 썼는데, 그것은 미시 경제학 이론의 고전이 되었다.</div><div class=\"rst\">여섯째 줄: 짧은 경제학 입문서도 썼는데, 미시 경제학의 고전이 됨. 지문 6번이에요. 책 이야기가 이어져요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">But Knight was much more than an economist;</div><div class=\"k\">그러나 Knight는 경제학자를 훨씬 더 넘어 있었다,</div></div><div class=\"rc\"><div class=\"e\">he was also a social philosopher.</div><div class=\"k\">그는 또한 사회 철학자이기도 했다.</div></div><div class=\"rnat\">그러나 Knight는 경제학자를 훨씬 더 넘어, 사회 철학자이기도 했다.</div><div class=\"rst\"><b>그러나</b>(But) 경제학자로만 끝나지 않고 사회 철학자이기도 했어요. 지문 7번이 소개 카드의 범위를 넓혀요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Later in his career,</div><div class=\"k\">이후 그의 경력에서,</div></div><div class=\"rc\"><div class=\"e\">Knight developed his theories</div><div class=\"k\">Knight는 그의 이론들을 발전시켰다</div></div><div class=\"rc\"><div class=\"e\">of freedom, democracy, and ethics.</div><div class=\"k\">자유, 민주주의, 그리고 윤리에 관한.</div></div><div class=\"rnat\">이후 그의 경력에서, Knight는 자유, 민주주의, 그리고 윤리에 관한 그의 이론들을 발전시켰다.</div><div class=\"rst\">일곱째 줄: 경력 후반엔 자유·민주주의·윤리에 관한 이론을 발전시킴. 지문 8번이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">After retiring in 1952,</div><div class=\"k\">1952년에 은퇴한 후에도,</div></div><div class=\"rc ckc\"><div class=\"e\">Knight <span class=\"cw\">remained active</span></div><div class=\"k\">Knight는 <span class=\"cw\">여전히 적극적이었다</span></div></div><div class=\"rc ckc\"><div class=\"e\">in <span class=\"cw\">teaching and writing</span>.</div><div class=\"k\"><span class=\"cw\">가르치는 일과 글 쓰는 일에</span>.</div></div><div class=\"rnat\">1952년에 은퇴한 후에도, Knight는 여전히 가르치는 일과 글 쓰는 일에 적극적이었다.</div><div class=\"rst\">마지막 줄이 핵심! 1952년 은퇴한 뒤에도 <b>가르치기와 글쓰기 둘 다</b> 열심히 함. 지문 9번이라 ⑤ ‘가르치지 않고’와 어긋나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"influential\" data-m=\"영향력 있는\"><b>influential</b>영향력 있는</button><button type=\"button\" class=\"wdb\" data-w=\"obtain\" data-m=\"취득하다, 얻다\"><b>obtain</b>취득하다, 얻다</button><button type=\"button\" class=\"wdb\" data-w=\"entrepreneur\" data-m=\"기업가\"><b>entrepreneur</b>기업가</button><button type=\"button\" class=\"wdb\" data-w=\"microeconomic\" data-m=\"미시 경제(학)의\"><b>microeconomic</b>미시 경제(학)의</button><button type=\"button\" class=\"wdb\" data-w=\"philosopher\" data-m=\"철학자\"><b>philosopher</b>철학자</button><button type=\"button\" class=\"wdb\" data-w=\"ethics\" data-m=\"윤리(학)\"><b>ethics</b>윤리(학)</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">안내문 불일치는 선택지를 안내문 항목과 <b>한 줄씩</b> 대조하세요. ③의 <b>‘않는다’</b> 같은 부정어가 안내문의 <b>All</b>(모든)과 부딪히는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 4·5번</em>평일 오전 10시~오후 5시, 주말 오전 11시~오후 3시로 서로 다름 → 선택지와 같음</span><span><em>② ↔ 7번</em>photographs submitted by students(학생들이 출품한 사진) → 같음</span><span><em>④ ↔ 10번</em>Taking photos is allowed(사진 촬영이 허용됩니다) → 같음</span><span><em>⑤ ↔ 11번</em>Free snacks(무료 간식) at the cafeteria(카페테리아에서) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 안내문과 그대로 같아요. 남은 ③을 8번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 ‘판매되지 않는다’를 8번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 앞부분 · 결정적 단서</span><div class=\"en\"><mark>All exhibits</mark> are <mark>for sale</mark>, …</div><p class=\"ko\"><mark>모든 전시품은</mark> <mark>판매됩니다</mark>, …</p></div><div class=\"ck-via\"><i>▼</i><span>팔아야 모금할 돈이 생겨요. 판매한다는 말을 한 번 더 받쳐 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 뒷부분 · 다시 확인</span><div class=\"en\">… and all money raised will be donated to charity.</div><p class=\"ko\">… 그리고 모금된 모든 돈은 자선 단체에 기부될 것입니다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">모든 전시품은 판매되지 않는다.<small>8번: All exhibits are for sale(모든 전시품은 판매됩니다)이라 정반대예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">전시회장 내에서 사진 촬영이 허용된다.</span><span class=\"why\">보통 전시회는 촬영 금지라서 상식으로 틀렸다고 고르기 쉬워요. 하지만 10번 Taking photos is allowed(사진 촬영이 허용됩니다)와 같아요. 상식 말고 안내문만 믿어요!</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">개장 시간은 주중과 주말이 다르다.</span><span class=\"why\">4번 평일은 오전 10시~오후 5시, 5번 주말(토요일과 일요일)은 오전 11시~오후 3시라서 정말 달라요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">학생들이 출품한 사진이 전시될 예정이다.</span><span class=\"why\">7번 photographs submitted by students(학생들이 출품한 사진) will be exhibited(전시될 것입니다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">카페테리아에서 간식이 무료로 제공될 것이다.</span><span class=\"why\">11번 Free snacks will be available(무료 간식이 이용 가능합니다) at the cafeteria(카페테리아에서)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Fremont Art College’s 7th Annual ART EXHIBITION</div><div class=\"k\">Fremont Art College의 제7회 연례 예술 전시회</div></div><div class=\"rnat\">Fremont Art College의 제7회 연례 예술 전시회</div><div class=\"rst\">미술 동아리 친구가 단톡방에 전시회 포스터를 올렸어요. 제목: 프리몬트 예술 대학의 제7회 연례 전시회. 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">November 21 – 27</div><div class=\"k\">11월 21일부터 27일까지</div></div><div class=\"rnat\">11월 21일부터 27일까지</div><div class=\"rst\">날짜는 11월 21일부터 27일까지. 지문 2번이고, 6번의 ‘일주일 동안’과 이어져요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">3rd Floor Gallery in the Student Union</div><div class=\"k\">학생 회관 3층 갤러리</div></div><div class=\"rnat\">학생 회관 3층 갤러리</div><div class=\"rst\">장소는 학생 회관 3층 갤러리. 지문 3번이에요. 친구에게 “3층으로 와!” 하고 알려 줘요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Hours: 10:00 a.m. – 5:00 p.m.</div><div class=\"k\">개장 시간: 오전 10시부터 오후 5시까지</div></div><div class=\"rc\"><div class=\"e\">(Monday – Friday)</div><div class=\"k\">(월요일부터 금요일)</div></div><div class=\"rnat\">개장 시간: 오전 10시부터 오후 5시까지 (월요일—금요일)</div><div class=\"rst\">평일(월~금)은 오전 10시~오후 5시. 지문 4번이에요. 아래 5번 주말 시간과 <b>다르다</b>는 걸 챙겨요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">11:00 a.m. – 3:00 p.m.</div><div class=\"k\">오전 11시부터 오후 3시까지</div></div><div class=\"rc\"><div class=\"e\">(Saturday &amp; Sunday)</div><div class=\"k\">(토요일과 일요일)</div></div><div class=\"rnat\">오전 11시부터 오후 3시까지 (토요일과 일요일)</div><div class=\"rst\">주말(토·일)은 오전 11시~오후 3시. 지문 5번이라, 평일과 시간이 달라서 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Fremont Art College will be hosting</div><div class=\"k\">Fremont Art College는 개최할 것입니다</div></div><div class=\"rc\"><div class=\"e\">its 7th Annual Art Exhibition</div><div class=\"k\">제7회 연례 예술 전시회를</div></div><div class=\"rc\"><div class=\"e\">for one week.</div><div class=\"k\">일주일 동안.</div></div><div class=\"rnat\">Fremont Art College는 제7회 연례 예술 전시회를 일주일간 개최할 것입니다.</div><div class=\"rst\">이 전시회를 일주일 동안 연대요. 지문 6번이 2번의 날짜를 한 번 더 말해 줘요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Paintings, ceramic works, and photographs</div><div class=\"k\">회화, 도예품, 그리고 사진이</div></div><div class=\"rc\"><div class=\"e\">submitted by students</div><div class=\"k\">학생들에 의해 출품된(학생들이 출품한)</div></div><div class=\"rc\"><div class=\"e\">will be exhibited.</div><div class=\"k\">전시될 것입니다.</div></div><div class=\"rnat\">학생들에 의해 출품된(학생들이 출품한) 회화, 도예품 그리고 사진이 전시될 것입니다.</div><div class=\"rst\">학생들이 직접 낸 그림·도자기·사진이 걸려요. 지문 7번 ‘학생들이 출품한’ 사진 = 선택지 ②예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">All exhibits</span> are <span class=\"cw\">for sale</span>,</div><div class=\"k\"><span class=\"cw\">모든 전시품은</span> <span class=\"cw\">판매됩니다</span>,</div></div><div class=\"rc\"><div class=\"e\">and all money raised</div><div class=\"k\">그리고 모금된 모든 돈은</div></div><div class=\"rc\"><div class=\"e\">will be donated to charity.</div><div class=\"k\">자선 단체에 기부될 것입니다.</div></div><div class=\"rnat\">모든 전시품은 판매되며, 모금된 모든 돈은 자선 단체에 기부될 것입니다.</div><div class=\"rst\">핵심! <b>모든 전시품은 판매돼요</b>. 판 돈은 자선 단체에 기부돼요. 지문 8번이라 ③ ‘판매되지 않는다’와 어긋나요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The exhibition is free to all.</div><div class=\"k\">전시회는 모두에게 무료입니다.</div></div><div class=\"rnat\">전시회는 모두에게 무료입니다.</div><div class=\"rst\">전시회 입장은 누구나 무료예요. 지문 9번이에요. 돈 없이 가서 구경만 해도 돼요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Taking photos is allowed</div><div class=\"k\">사진 촬영이 허용됩니다</div></div><div class=\"rc\"><div class=\"e\">inside the exhibition hall.</div><div class=\"k\">전시회장 내에서.</div></div><div class=\"rnat\">전시회장 내에서 사진 촬영이 허용됩니다.</div><div class=\"rst\">전시회장 안에서 사진을 찍어도 돼요. 지문 10번 ‘허용됩니다’ = 선택지 ④예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Free snacks will be available</div><div class=\"k\">무료 간식이 이용 가능합니다</div></div><div class=\"rc\"><div class=\"e\">at the cafeteria.</div><div class=\"k\">카페테리아에서.</div></div><div class=\"rnat\">카페테리아에서 무료 간식이 이용 가능합니다.</div><div class=\"rst\">구경하다 배고프면 카페테리아의 무료 간식! 지문 11번 = 선택지 ⑤예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">For more information,</div><div class=\"k\">더 많은 정보를 원하시면,</div></div><div class=\"rc\"><div class=\"e\">please visit our website</div><div class=\"k\">저희 웹사이트를 방문해 주세요</div></div><div class=\"rc\"><div class=\"e\">at www.fremontart.edu.</div><div class=\"k\">www.fremontart.edu에서.</div></div><div class=\"rnat\">더 많은 정보를 원하시면, 저희 웹사이트 www.fremontart.edu를 방문해 주세요.</div><div class=\"rst\">더 궁금하면 학교 웹사이트에 들어가 보래요. 지문 12번은 안내문 마지막의 안내 줄이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"annual\" data-m=\"연례의\"><b>annual</b>연례의</button><button type=\"button\" class=\"wdb\" data-w=\"submit\" data-m=\"제출하다, 출품하다\"><b>submit</b>제출하다, 출품하다</button><button type=\"button\" class=\"wdb\" data-w=\"ceramic work\" data-m=\"도예품\"><b>ceramic work</b>도예품</button><button type=\"button\" class=\"wdb\" data-w=\"for sale\" data-m=\"판매되는\"><b>for sale</b>판매되는</button><button type=\"button\" class=\"wdb\" data-w=\"donate\" data-m=\"기부하다\"><b>donate</b>기부하다</button><button type=\"button\" class=\"wdb\" data-w=\"charity\" data-m=\"자선 단체\"><b>charity</b>자선 단체</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>결론 신호</b>를 따라가요. 1번 wrongly(잘못)로 ‘건설로 도시를 살린다’는 생각을 깨고, 3번 <b>should</b>(~해야 한다)와 7번 <b>cities are people</b>(도시는 사람이다)이 결론을 말해요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 깨뜨릴 생각</span><div class=\"en\">Too many officials … <mark>wrongly imagine</mark> that they can lead their city back to its former glories with some <mark>massive construction project</mark> …</div><p class=\"ko\">너무 많은 공무원들은 … <mark>어떤 대규모 건설 프로젝트로</mark> 도시를 이전의 영광으로 되돌릴 수 있다고 <mark>잘못 상상한다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>but(하지만) + should(~해야 한다)로 글쓴이의 주장이 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 결론 신호</span><div class=\"en\">… but public policy <mark>should</mark> help poor people, <mark>not poor places</mark>.</div><p class=\"ko\">… 하지만 공공 정책은 <mark>가난한 지역이 아니라</mark> 가난한 ‘사람들’을 <mark>도와야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>반짝이는 새 부동산 → 겉만 꾸미고 근본 문제는 못 풂</span><span><em>5번</em>쇠퇴하는 도시는 이미 주택·기반 시설이 너무 많음</span><span><em>6번</em>공급은 넘치고 수요는 적음 → 더 짓는 데 돈 쓰는 건 의미 없음</span></div><div class=\"ck-eq\">⇒ 세 문장 모두 ‘건물을 더 짓는 건 답이 아니다’ → 7번 결론으로 이어져요</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 요지</span><div class=\"en\">The folly of building-centric urban renewal reminds us that <mark>cities aren’t structures</mark>; <mark>cities are people</mark>.</div><p class=\"ko\">건물 중심의 도시 재생의 어리석음은 <mark>도시는 건축물이 아니라는 것</mark>, 즉 <mark>도시는 사람이다</mark>라는 것을 우리에게 상기시킨다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">도시 재생을 위한 공공정책은 건설보다 사람에 중점을 두어야 한다.<small>7번 cities are people(도시는 사람이다)과 3번 not poor places(가난한 지역이 아니라)를 합친 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">사회기반시설 확충을 통해 지역 경제를 활성화해야 한다.</span><span class=\"why\">[반대] 5번은 쇠퇴하는 도시에 이미 infrastructure(기반 시설)가 너무 많다고 했고, 6번은 더 짓는 건 makes no sense(의미가 없다)라고 했어요. 확충은 글이 반대하는 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">대중 교통 이용이 편리하도록 도시 교통 체계를 구축해야 한다.</span><span class=\"why\">[반대] 1번 light rail system(경전철 시스템)은 공무원들이 wrongly imagine(잘못 상상한다)하는 건설 사례로 나왔을 뿐이에요. 교통 체계를 짓자는 건 글이 비판하는 생각이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">에너지를 절감할 수 있는 친환경 건물을 설계해야 한다.</span><span class=\"why\">[지문에 없음] 에너지나 친환경 이야기는 한 번도 안 나와요. 게다가 건물 설계는 7번 building-centric(건물 중심의) 생각이라 글이 어리석다고 한 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">문화유산 보존을 우선하는 도시 계획을 수립해야 한다.</span><span class=\"why\">[지문에 없음] 1번 former glories(이전의 영광)는 도시의 옛 번영을 말할 뿐, 문화유산을 지키자는 말은 없어요. 결론은 건물이 아니라 사람이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Too many officials in troubled cities</div><div class=\"k\">문제가 있는 도시의 너무 많은 공무원들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">wrongly imagine</span></div><div class=\"k\"><span class=\"cw\">잘못 상상한다</span></div></div><div class=\"rc\"><div class=\"e\">that they can lead their city back to its former glories</div><div class=\"k\">그들이 그들의 도시를 이전의 영광으로 되돌릴 수 있다고</div></div><div class=\"rc\"><div class=\"e\">with some massive construction project —</div><div class=\"k\">어떤 대규모 건설 프로젝트로 —</div></div><div class=\"rc\"><div class=\"e\">a new stadium or light rail system,</div><div class=\"k\">새로운 경기장 또는 경전철 시스템,</div></div><div class=\"rc\"><div class=\"e\">a convention center, or a housing project.</div><div class=\"k\">컨벤션 센터, 또는 주택 프로젝트와 같은.</div></div><div class=\"rnat\">문제가 있는 도시의 너무 많은 공무원들은 새로운 경기장 또는 경전철 시스템, 컨벤션 센터, 또는 (저소득층을 위한) 주택 프로젝트와 같은 대규모 건설 프로젝트를 통해 그들의 도시를 이전의 영광으로 되돌릴 수 있다고 잘못 상상한다.</div><div class=\"rst\">학생이 줄어 힘든 학교에서 어른들이 “새 체육관만 지으면 예전처럼 북적일 거야” 해요. 지문 1번은 이걸 <b>잘못 상상한다</b>고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">With very few exceptions,</div><div class=\"k\">거의 예외 없이,</div></div><div class=\"rc\"><div class=\"e\">no public policy can slow</div><div class=\"k\">어떤 공공 정책도 늦출 수 없다</div></div><div class=\"rc\"><div class=\"e\">the tidal forces of urban change.</div><div class=\"k\">도시 변화의 조석력(흐름)을.</div></div><div class=\"rnat\">거의 예외 없이 어떤 공공 정책도 도시 변화의 조석력(흐름)을 늦출 수 없다.</div><div class=\"rst\">그런데 아이들이 다른 동네로 이사 가는 큰 흐름은 어떤 규칙으로도 못 막아요. = 지문 2번, 도시 변화의 흐름은 정책으로 못 늦춰요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">We mustn’t ignore the needs of the poor people</div><div class=\"k\">우리는 가난한 사람들의 요구를 무시하면 안 된다</div></div><div class=\"rc\"><div class=\"e\">who live in the Rust Belt,</div><div class=\"k\">Rust Belt에 사는,</div></div><div class=\"rc\"><div class=\"e\">but public policy should help</div><div class=\"k\">하지만 공공 정책은 도와야 한다</div></div><div class=\"rc\"><div class=\"e\">poor people,</div><div class=\"k\">가난한 '사람들'을,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">not poor places</span>.</div><div class=\"k\"><span class=\"cw\">가난한 지역이 아니라</span>.</div></div><div class=\"rnat\">우리는 Rust Belt에 사는 가난한 사람들의 요구를 무시하면 안 되지만 공공 정책은 가난한 지역이 아닌 가난한 '사람들'을 도와야 한다.</div><div class=\"rst\">그래서 돈은 건물이 아니라 <b>학생에게</b> 써야 해요. 지문 3번, 공공 정책은 가난한 지역이 아니라 가난한 <b>사람</b>을 도와야 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Shiny new real estate may dress up a declining city,</div><div class=\"k\">반짝이는 새로운 부동산은 쇠퇴하는 도시를 꾸밀 수는 있다,</div></div><div class=\"rc\"><div class=\"e\">but it doesn’t solve its underlying problems.</div><div class=\"k\">하지만 이것은 그것(= 쇠퇴하는 도시)의 기저에 있는 문제를 해결하지는 않는다.</div></div><div class=\"rnat\">반짝이는 새로운 부동산은 쇠퇴하는 도시를 꾸밀 수는 있지만 이것은 그것(쇠퇴하는 도시)의 기저에 있는 문제를 해결하지는 않는다.</div><div class=\"rst\">번쩍이는 새 체육관은 학교를 겉으로만 꾸며요. 공부가 어려운 진짜 문제는 그대로예요. = 지문 4번이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The hallmark of declining cities is</div><div class=\"k\">쇠퇴하는 도시들의 특징은 ~이다</div></div><div class=\"rc\"><div class=\"e\">that they have too much housing and infrastructure</div><div class=\"k\">그것들(= 쇠퇴하는 도시들)이 너무 많은 주택과 기반 시설을 가지고 있다는 것</div></div><div class=\"rc\"><div class=\"e\">relative to the strength of their economies.</div><div class=\"k\">경제력에 비해서.</div></div><div class=\"rnat\">쇠퇴하는 도시들의 특징은 그것(쇠퇴하는 도시)들이 (그것들의) 경제력에 비해서 '너무 많은' 주택과 기반 시설을 가지고 있다는 것이다.</div><div class=\"rst\">이미 빈 교실이 학생 수보다 훨씬 많아요. 지문 5번, 쇠퇴하는 도시는 경제력에 비해 주택·기반 시설이 <b>너무 많다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">With all that supply of structure</div><div class=\"k\">건축물의 그 모든 공급과</div></div><div class=\"rc\"><div class=\"e\">and so little demand,</div><div class=\"k\">너무 적은 수요 때문에,</div></div><div class=\"rc\"><div class=\"e\">it makes no sense</div><div class=\"k\">의미가 없다</div></div><div class=\"rc\"><div class=\"e\">to use public money to build more supply.</div><div class=\"k\">더 많은 공급을 만들어 내기 위해 공공 자금을 사용하는 것은.</div></div><div class=\"rnat\">건축물의 그 모든 공급과 너무 적은 수요 때문에, 더 많은 공급을 만들어 내기 위해 공공 자금을 사용하는 것은 의미가 없다.</div><div class=\"rst\">빈 교실이 남는데 또 건물을 짓는 건 말이 안 돼요. = 지문 6번, 공급은 많고 수요는 적어 공공 자금을 더 쓸 이유가 없어요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">The folly of building-centric urban renewal</div><div class=\"k\">건물 중심의 도시 재생의 어리석음은</div></div><div class=\"rc\"><div class=\"e\">reminds us</div><div class=\"k\">우리에게 상기시킨다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">cities aren’t structures</span>;</div><div class=\"k\"><span class=\"cw\">도시는 건축물이 아니라는 것을</span>;</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">cities are people</span>.</div><div class=\"k\"><span class=\"cw\">도시는 사람이다</span>.</div></div><div class=\"rnat\">건물 중심의 도시 재생의 어리석음은 우리에게 도시는 건축물이 아니라 사람이라는 것을 상기시킨다.</div><div class=\"rst\">결국 학교는 건물이 아니라 그 안의 학생들이에요. 지문 7번 결론, <b>도시는 건축물이 아니라 사람이다</b>예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"massive\" data-m=\"대규모의\"><b>massive</b>대규모의</button><button type=\"button\" class=\"wdb\" data-w=\"declining\" data-m=\"쇠퇴하는\"><b>declining</b>쇠퇴하는</button><button type=\"button\" class=\"wdb\" data-w=\"underlying problem\" data-m=\"근본적인 문제\"><b>underlying problem</b>근본적인 문제</button><button type=\"button\" class=\"wdb\" data-w=\"infrastructure\" data-m=\"기반 시설\"><b>infrastructure</b>기반 시설</button><button type=\"button\" class=\"wdb\" data-w=\"relative to\" data-m=\"~에 비해\"><b>relative to</b>~에 비해</button><button type=\"button\" class=\"wdb\" data-w=\"folly\" data-m=\"어리석음\"><b>folly</b>어리석음</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 처음과 끝에 <b>되풀이되는 핵심어</b>를 묶어요. capacity(수용력)·extended(확장했다)·extension(확장)이 계속 나오니, <b>기억을 늘리려는 노력</b>이 주제예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 제시</span><div class=\"en\">The first humans who figured out how to write things down … were in essence <mark>trying to increase the capacity</mark> of their hippocampus, …</div><p class=\"ko\">무언가를 적는 방법을 알아낸 최초의 인류는 … 본질적으로 <mark>해마의 수용력을 증가시키려고</mark> 노력했다 …</p></div><div class=\"ck-via\"><i>▼</i><span>‘늘리려 했다’ → 실제로 ‘확장했다’로 이어져요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 핵심어 반복</span><div class=\"en\">They effectively <mark>extended the natural limits of human memory</mark> by preserving some of their memories …</div><p class=\"ko\">그들은 그들 기억의 일부를 보존함으로써 인간의 기억력의 선천적인 한계를 <mark>효과적으로 확장했다</mark> …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>달력·서류 보관함·컴퓨터·스마트폰으로 적은 정보를 정리·저장</span><span><em>4번</em>폰이 느려지면 더 큰 메모리 카드를 삼</span><span><em>5번</em>그 메모리는 비유이면서 실제 물건</span></div><div class=\"ck-eq\">⇒ 점토판부터 메모리 카드까지 = 기억을 바깥 도구로 늘려 온 방법들</div></div><div class=\"ck-via\"><i>▼</i><span>지금은 외부 장치가 아예 뇌의 일부처럼 기억을 맡아요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">We are off-loading a great deal of the processing … to an external device that then becomes <mark>an extension of our own brains</mark>, a neural enhancer.</div><p class=\"ko\">우리는 막대한 양의 (정보) 처리를 외부 장치에 덜어내고 있고, 그 장치는 <mark>우리 자신의 뇌의 확장</mark>, 즉 신경 개선 장치가 된다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">human efforts to extend the memory capacity 기억 용량을 확장하려는 인간의 노력<small>1번 capacity(수용력)와 2번 extended(확장했다)를 그대로 묶은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">ways of preserving written documents 기록된 문서를 보존하는 방법</span><span class=\"why\">[범위 좁음] 2번 점토판·동굴 벽에 preserving(보존함)은 기억을 늘리려는 수단 하나일 뿐이에요. 글은 문서 보존 방법이 아니라 기억을 늘려 온 노력 전체를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">reasons to be independent of smart technology 스마트 기술에서 독립해야 하는 이유</span><span class=\"why\">[반대] 6번은 오히려 외부 장치가 an extension of our own brains(우리 자신의 뇌의 확장)가 된다고 했어요. 기술에서 벗어나자는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">necessity of brain exercises for mental strength 정신력을 위한 두뇌 운동의 필요성</span><span class=\"why\">[지문에 없음] 뇌를 훈련하자는 얘기는 없어요. 6번은 기억 처리를 뇌 바깥 장치로 off-loading(덜어내는) 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">rapid enhancement of the brain's multitasking ability 뇌의 멀티태스킹 능력의 빠른 향상</span><span class=\"why\">[지문에 없음] 6번 neural enhancer(신경 개선 장치)는 바깥 장치를 가리켜요. 뇌의 멀티태스킹 능력이 빨리 좋아진다는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The first humans</div><div class=\"k\">최초의 인류는</div></div><div class=\"rc\"><div class=\"e\">who figured out how to write things down</div><div class=\"k\">무언가를 적는 방법을 알아낸</div></div><div class=\"rc\"><div class=\"e\">around 5,000 years ago</div><div class=\"k\">약 5천 년 전쯤</div></div><div class=\"rc\"><div class=\"e\">were in essence trying</div><div class=\"k\">본질적으로 노력했다</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">increase the capacity</span> of their hippocampus,</div><div class=\"k\"><span class=\"cw\">해마의 수용력을 증가시키려고</span>,</div></div><div class=\"rc\"><div class=\"e\">part of the brain’s memory system.</div><div class=\"k\">뇌의 기억 체계 부분인.</div></div><div class=\"rnat\">5천 년 전쯤 무언가를 적는 방법을 알아낸 최초의 인류는 뇌의 기억 체계 부분인 해마의 수용력을 본질적으로 증가시키려고 노력했다.</div><div class=\"rst\">숙제를 자꾸 잊는 내가 손바닥에 적기 시작했어요. = 지문 1번, 최초의 인류가 글을 적어 해마의 <b>수용력을 늘리려</b> 한 거예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc ckc\"><div class=\"e\">They <span class=\"cw\">effectively extended</span></div><div class=\"k\">그들은 <span class=\"cw\">효과적으로 확장했다</span></div></div><div class=\"rc\"><div class=\"e\">the natural limits of human memory</div><div class=\"k\">인간의 기억력의 선천적인 한계를</div></div><div class=\"rc\"><div class=\"e\">by preserving some of their memories</div><div class=\"k\">그들 기억의 일부를 보존함으로써</div></div><div class=\"rc\"><div class=\"e\">on clay tablets and cave walls,</div><div class=\"k\">점토판과 동굴 벽에,</div></div><div class=\"rc\"><div class=\"e\">and later, papyrus and parchment.</div><div class=\"k\">그리고 나중에는, 파피루스와 양피지에.</div></div><div class=\"rnat\">자신의 기억의 일부를 점토판과 동굴 벽, 나중에는, 파피루스와 양피지에 보존함으로써 그들은 인간의 기억력의 선천적인 한계를 효과적으로 확장했다.</div><div class=\"rst\">적어 둔 덕분에 외울 때보다 훨씬 많이 기억해요. 지문 2번, 점토판·동굴 벽에 남겨 기억의 한계를 <b>확장했다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Later, we developed other mechanisms</div><div class=\"k\">이후에, 우리는 다른 방법들을 발전시켰다</div></div><div class=\"rc\"><div class=\"e\">— such as calendars, filing cabinets, computers, and smartphones —</div><div class=\"k\">— 달력, 서류 보관함, 컴퓨터, 그리고 스마트폰과 같은 —</div></div><div class=\"rc\"><div class=\"e\">to help us organize and store</div><div class=\"k\">우리가 조직하고 저장하는 데 도움을 주는</div></div><div class=\"rc\"><div class=\"e\">the information we’ve written down.</div><div class=\"k\">우리가 기록해 왔던 정보를.</div></div><div class=\"rnat\">이후에, 우리는 우리가 기록해 왔던 정보를 (우리가) 조직하고 저장하는 데 도움을 주는, 달력, 서류 보관함, 컴퓨터, 그리고 스마트폰과 같은 다른 방법들을 발전시켰다.</div><div class=\"rst\">나중엔 수첩, 달력, 폰 메모 앱까지 써요. = 지문 3번, 달력·컴퓨터·스마트폰으로 적은 정보를 정리하고 저장해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">When our computer or smartphone starts to run slowly,</div><div class=\"k\">우리의 컴퓨터나 스마트폰이 느리게 작동하기 시작할 때,</div></div><div class=\"rc\"><div class=\"e\">we might buy a larger memory card.</div><div class=\"k\">우리는 아마 더 큰 메모리 카드를 구입할 것이다.</div></div><div class=\"rnat\">우리의 컴퓨터나 스마트폰이 느리게 작동하기 시작할 때, 우리는 아마 더 큰 (용량의) 메모리 카드를 구입할 것이다.</div><div class=\"rst\">폰이 느려지면 더 큰 메모리 카드를 사죠. 지문 4번이에요. 기억 칸이 모자라면 바깥에서 더 늘리는 거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">That memory is both a metaphor and a physical reality.</div><div class=\"k\">그 메모리(= 기억)는 은유일 뿐 아니라 물리적인 실체이기도 하다.</div></div><div class=\"rnat\">그 메모리(기억)는 은유일 뿐 아니라 물리적인 실체이기도 하다.</div><div class=\"rst\">이 ‘메모리’는 말로만 기억이 아니라 손에 잡히는 진짜 물건이에요. = 지문 5번, 비유이면서 물리적인 실체예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">We are off-loading a great deal of the processing</div><div class=\"k\">우리는 막대한 양의 (정보) 처리를 덜어내고 있다</div></div><div class=\"rc\"><div class=\"e\">that our neurons would normally do</div><div class=\"k\">우리의 신경세포가 일반적으로 수행하는</div></div><div class=\"rc\"><div class=\"e\">to an external device</div><div class=\"k\">외부 장치에</div></div><div class=\"rc ckc\"><div class=\"e\">that then becomes <span class=\"cw\">an extension of our own brains</span>,</div><div class=\"k\">그리고 그 장치는 <span class=\"cw\">우리 자신의 뇌의 확장</span>이 되는,</div></div><div class=\"rc\"><div class=\"e\">a neural enhancer.</div><div class=\"k\">즉 신경 개선 장치.</div></div><div class=\"rnat\">우리는 우리의 신경세포가 일반적으로 수행하는 막대한 양의 (정보) 처리를 이후 우리 자신의 뇌의 확장, 즉 신경 개선 장치가 되는 외부 장치에 덜어내고 있다.</div><div class=\"rst\">이제 머리가 할 일을 폰에 맡겨요. 폰이 <b>내 뇌의 확장</b>이 된 셈이에요. 지문 6번, 외부 장치가 뇌의 확장이 된다는 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"in essence\" data-m=\"본질적으로\"><b>in essence</b>본질적으로</button><button type=\"button\" class=\"wdb\" data-w=\"capacity\" data-m=\"용량, 수용력\"><b>capacity</b>용량, 수용력</button><button type=\"button\" class=\"wdb\" data-w=\"hippocampus\" data-m=\"해마\"><b>hippocampus</b>해마</button><button type=\"button\" class=\"wdb\" data-w=\"extend\" data-m=\"확장하다\"><b>extend</b>확장하다</button><button type=\"button\" class=\"wdb\" data-w=\"metaphor\" data-m=\"비유, 은유\"><b>metaphor</b>비유, 은유</button><button type=\"button\" class=\"wdb\" data-w=\"external device\" data-m=\"외부 장치\"><b>external device</b>외부 장치</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄이 <b>and</b>(그리고) 뒤에 있으면 <b>짝</b>부터 찾으세요. 앞의 must(~해야 한다) + document(기록하다)와 같은 모양, 즉 <b>동사원형</b>이어야 해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (6번)</span><div class=\"en\">A designer must first document the existing conditions of a problem and <u>④ collecting</u> relevant data to be analyzed.</div><p class=\"ko\">디자이너는 먼저 기록해야 한다 … 그리고 ( ? ) 관련 자료를 — and 앞뒤가 같은 모양인지 확인</p></div><div class=\"ck-via\"><i>▼</i><span>and(그리고)의 짝을 찾으러 앞으로 가요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 앞쪽 · and의 짝</span><div class=\"en\">A designer <mark>must</mark> first <mark>document</mark> the existing conditions of a problem</div><p class=\"ko\">디자이너는 먼저 문제의 기존 상황들을 <mark>기록해야 한다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>must(~해야 한다)가 and(그리고) 뒤까지 이어져요 → 동사원형 collect(모으다)</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 뒤쪽 · 결정적 단서</span><div class=\"en\">and <mark>collect</mark> relevant data to be analyzed.</div><p class=\"ko\">그리고 분석되어야 할 관련 자료를 <mark>모아야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">병렬 구조: and(그리고)로 이어진 동사는 같은 모양</p><p class=\"gr\">and(그리고)는 같은 모양끼리 이어 줘요. 조동사 must(~해야 한다) 뒤 동사원형과 and(그리고)로 이어지면, and(그리고) 뒤도 동사원형이어야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I must wash my hands and brush my teeth.</div><div class=\"ko\">나는 손을 씻고 이를 닦아야 해. (must 뒤 wash 씻다 와 brush 닦다 가 둘 다 동사원형이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I must wash my hands and brushing my teeth.</div><div class=\"ko\">and 앞은 wash(씻다)인데 뒤를 brushing(닦는 것)으로 써서 모양이 달라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She can sing and dance.</div><div class=\"ko\">그녀는 노래하고 춤출 수 있어. (can 뒤 sing 노래하다 와 dance 춤추다 가 같은 모양이라 맞아요)</div></div><p class=\"gb\">지문 6번도 must(~해야 한다) first document(먼저 기록하다)와 and(그리고)로 이어지니 collecting(모으는 것)이 아니라 동사원형 collect(모으다)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">collecting → collect (모으다)<small>must(~해야 한다) 뒤 document(기록하다)와 and(그리고)로 이어지니 동사원형 collect(모으다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">much 훨씬</span><span class=\"why\">3번 ② 바로 뒤가 less satisfactory(덜 만족스러운), 즉 비교급이에요. 비교급을 강조할 땐 much(훨씬)를 쓰고, very(매우)는 못 써요. less(덜) 앞이라 어색해 보여도 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">비교급 강조: much(훨씬) + 비교급, very(매우)는 안 돼요</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My bag is much heavier than yours.</div><div class=\"ko\">내 가방은 네 것보다 훨씬 더 무거워. (much 훨씬 + 비교급 heavier 더 무거운 이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My bag is very heavier than yours.</div><div class=\"ko\">very(매우)는 비교급 heavier(더 무거운)를 꾸밀 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This game is much less fun.</div><div class=\"ko\">이 게임은 훨씬 덜 재미있어. (less 덜 도 비교급이라 much 훨씬 이 맞아요)</div></div><p class=\"gb\">지문 3번도 much(훨씬)가 비교급 less satisfactory(덜 만족스러운)를 강조해서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">purely 순전히</span><span class=\"why\">2번 may be purely functional(순전히 기능적일 수도 있다)에서 ① 바로 뒤는 형용사 functional(기능적인)이에요. 형용사를 꾸미는 건 부사라서 purely(순전히)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">형용사를 꾸미는 부사: 부사 + 형용사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This room is completely clean.</div><div class=\"ko\">이 방은 완전히 깨끗해. (부사 completely 완전히 가 형용사 clean 깨끗한 을 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This room is complete clean.</div><div class=\"ko\">형용사 complete(완전한)는 형용사 clean(깨끗한)을 꾸밀 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She is really kind.</div><div class=\"ko\">그녀는 정말 친절해. (부사 really 정말 + 형용사 kind 친절한 이라 맞아요)</div></div><p class=\"gb\">지문 2번도 purely(순전히)가 형용사 functional(기능적인)을 꾸미니 부사가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">to find 찾아내려는</span><span class=\"why\">4번 ③ 바로 앞은 명사 the decision(결정)이에요. ‘해결책을 찾아내려는 결정’처럼 명사를 뒤에서 꾸밀 땐 to find(찾아내려는)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">명사 + to(~할, ~하려는) + 동사원형: 명사를 뒤에서 꾸미기</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I made a plan to visit Jeju.</div><div class=\"ko\">나는 제주도를 방문할 계획을 세웠어. (a plan 계획 뒤 to visit 방문할 이 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I made a plan visit Jeju.</div><div class=\"ko\">명사 a plan(계획) 뒤에 to 없이 visit(방문하다)을 바로 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a lot of homework to do.</div><div class=\"ko\">나는 해야 할 숙제가 많아. (homework 숙제 뒤 to do 해야 할 이 꾸며서 맞아요)</div></div><p class=\"gb\">지문 4번도 the decision(결정) 뒤에 to find(찾아내려는)가 와서 ‘해결책을 찾아내려는 결정’이 돼요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">is defined 정의되다</span><span class=\"why\">7번 ⑤ 앞은 how a problem(문제가 어떻게)이에요. 문제는 스스로 정의하는 게 아니라 ‘정의되는’ 쪽이라 수동 is defined(정의되다)가 맞고, 주어 a problem(문제)이 하나라 is(~이다)예요.</span><div class=\"gm wx\"><p class=\"gt\">수동태(be + p.p.): 주어가 동작을 받을 때 ‘~되다’</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The room is cleaned every day.</div><div class=\"ko\">그 방은 매일 청소된다. (방은 청소를 받는 쪽이라 수동 is cleaned 청소된다 가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The room cleans every day.</div><div class=\"ko\">방이 스스로 청소하는 게 아닌데 능동 cleans(청소한다)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Tom cleans the room every day.</div><div class=\"ko\">톰이 매일 그 방을 청소한다. (톰은 직접 청소하는 쪽이라 능동 cleans 청소한다 가 맞아요)</div></div><p class=\"gb\">지문 7번도 a problem(문제)이 정의를 ‘받는’ 쪽이라 is defined(정의되다)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Architecture is generally conceived, designed, and realized</div><div class=\"k\">건축은 일반적으로 구상되고, 설계되고, 실현된다</div></div><div class=\"rc\"><div class=\"e\">in response to an existing set of conditions.</div><div class=\"k\">기존의 상황들에 대한 반응으로.</div></div><div class=\"rnat\">건축은 일반적으로 기존의 상황들에 대한 반응으로 구상되고, 설계되고, 실현된다.</div><div class=\"rst\">건축은 지금 있는 상황에 맞춰 구상되고, 설계되고, 지어져요. 지문 1번도 세 동사를 and(그리고)로 같은 모양으로 이어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">These conditions may be purely functional in nature,</div><div class=\"k\">이러한 상황들은 사실상 순전히 기능적일 수도 있다,</div></div><div class=\"rc\"><div class=\"e\">or they may also reflect in varying degrees</div><div class=\"k\">또는 다양한 정도로 반영할 수도 있다</div></div><div class=\"rc\"><div class=\"e\">the social, political, and economic climate.</div><div class=\"k\">사회적, 정치적, 경제적 풍조를.</div></div><div class=\"rnat\">이러한 상황들은 사실상 순전히 기능적이거나, 사회적, 정치적, 경제적 풍조를 다양하게 반영하기도 한다.</div><div class=\"rst\">그 상황은 순전히 쓸모 문제일 수도, 사회·정치·경제 분위기일 수도 있어요. 지문 2번 purely(순전히)는 형용사를 꾸미는 부사예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In any case, it is assumed</div><div class=\"k\">어떤 경우든, 추정된다</div></div><div class=\"rc\"><div class=\"e\">that the existing set of conditions is much less satisfactory</div><div class=\"k\">기존의 상황들이 훨씬 덜 만족스럽다고</div></div><div class=\"rc\"><div class=\"e\">and that a new set of conditions would be desirable.</div><div class=\"k\">그리고 새로운 상황들이 바람직할 것이라고.</div></div><div class=\"rnat\">어떤 경우든, 기존의 상황들이 훨씬 덜 만족스럽고, 새로운 상황들이 바람직할 것이라고 추정된다.</div><div class=\"rst\">어쨌든 지금 상황은 <b>훨씬</b> 덜 만족스럽고, 새 상황이 필요하다고 봐요. 지문 3번 much(훨씬)가 비교급을 강조해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The initial phase of any design process is</div><div class=\"k\">모든 디자인 과정의 초기 단계는 ~이다</div></div><div class=\"rc\"><div class=\"e\">the recognition of a problematic condition</div><div class=\"k\">문제 상황에 대한 인식</div></div><div class=\"rc\"><div class=\"e\">and the decision to find a solution to it.</div><div class=\"k\">그리고 그에 대한 해결책을 찾아내려는 결정.</div></div><div class=\"rnat\">모든 디자인 과정의 초기 단계는 문제 상황에 대한 인식과 그에 대한 해결책을 찾아내려는 결정이다.</div><div class=\"rst\">디자인의 첫 단계는 문제를 알아차리고 해결책을 찾아내려고 마음먹는 거예요. 지문 4번 to find(찾아내려는)가 결정을 꾸며요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Design is above all a purposeful endeavor.</div><div class=\"k\">디자인은 무엇보다도 목적이 있는(의도적인) 노력이다.</div></div><div class=\"rnat\">디자인은 무엇보다도 목적이 있는(의도적인) 노력이다.</div><div class=\"rst\">디자인은 무엇보다 목적이 있는 노력이에요. 지문 5번은 그냥 하는 게 아니라 문제를 풀려고 하는 일이라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">A designer <span class=\"cw\">must first document</span></div><div class=\"k\">디자이너는 <span class=\"cw\">먼저 기록해야 한다</span></div></div><div class=\"rc\"><div class=\"e\">the existing conditions of a problem</div><div class=\"k\">문제의 기존 상황들을</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">collect</span> relevant data to be analyzed.</div><div class=\"k\">그리고 분석되어야 할 관련 자료를 <span class=\"cw\">모아야 한다</span>. ※ 문제지엔 collecting으로 되어 있음</div></div><div class=\"rnat\">디자이너는 먼저 기존의 문제가 있는 상황들을 기록하고, 분석되어야 할 관련 자료들을 모아야 한다.</div><div class=\"rst\">디자이너는 먼저 상황을 <b>기록하고</b> 자료를 <b>모아야</b> 해요. 지문 6번은 must(~해야 한다) 뒤 document(기록하다)와 collect(모으다)로 짝을 맞춰요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">This is the critical phase of the design process</div><div class=\"k\">이것이 디자인 과정의 중요한 단계이다</div></div><div class=\"rc\"><div class=\"e\">since the nature of a solution is related to</div><div class=\"k\">해결책의 본질은 ~와 관련이 있기 때문이다</div></div><div class=\"rc\"><div class=\"e\">how a problem is defined.</div><div class=\"k\">문제가 어떻게 정의되는가.</div></div><div class=\"rnat\">이것이 디자인 과정의 중요한 단계인데, 해결책의 본질은 문제가 어떻게 정의되는가와 관련이 있기 때문이다.</div><div class=\"rst\">이게 중요한 단계예요. 문제가 어떻게 정의되느냐에 따라 해결책이 달라지니까요. 지문 7번 is defined(정의되다)는 수동이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"conceive\" data-m=\"구상하다\"><b>conceive</b>구상하다</button><button type=\"button\" class=\"wdb\" data-w=\"functional\" data-m=\"기능적인\"><b>functional</b>기능적인</button><button type=\"button\" class=\"wdb\" data-w=\"satisfactory\" data-m=\"만족스러운\"><b>satisfactory</b>만족스러운</button><button type=\"button\" class=\"wdb\" data-w=\"endeavor\" data-m=\"노력\"><b>endeavor</b>노력</button><button type=\"button\" class=\"wdb\" data-w=\"document\" data-m=\"기록하다\"><b>document</b>기록하다</button><button type=\"button\" class=\"wdb\" data-w=\"relevant\" data-m=\"관련 있는\"><b>relevant</b>관련 있는</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">2번 <b>increases over time</b>(시간이 지나면서 증가한다)이 글의 방향이에요. 조금 말하고 → 반응이 좋으면 → <b>더</b> 말하는 흐름에 거꾸로 가는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 글의 방향</span><div class=\"en\">In most cases, the amount of disclosure <mark>increases over time</mark>.</div><p class=\"ko\">대부분의 경우에, 털어놓는 비밀 이야기의 양은 <mark>시간이 지나면서 증가한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>조금 → 더 많이: 2번 방향을 구체적으로 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 앞부분 · 좋은 조건</span><div class=\"en\">We begin relationships by revealing <mark>relatively little</mark> about ourselves; then if our first bits of self-disclosure are <mark>well received</mark> and bring on similar responses from the other person, …</div><p class=\"ko\">우리는 우리 자신에 대해 <mark>비교적 거의 드러내지 않음으로써</mark> 관계를 시작하고; 그런 다음 처음에 조금 털어놓은 이야기가 <mark>잘 받아들여지고</mark> 비슷한 반응을 불러온다면, …</p></div><div class=\"ck-via\"><i>▼</i><span>좋은 반응을 받았는데 꺼린다? 방향이 거꾸로예요</span></div><div class=\"ck-step key\"><span class=\"lab\">문제지 ③번 자리 (3번) · 결정적 단서</span><div class=\"en\">… we’re <u>③ reluctant</u> to reveal more.</div><p class=\"ko\">우리는 더 많이 드러내는 것을 ( 꺼린다? ) → 기꺼이 한다가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>처음부터 다 드러내면 역효과 → 조금씩 늘리는 게 맞다는 확인</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 반대 경우로 확인</span><div class=\"en\">… such baring of your soul would be likely to <mark>scare potential partners away</mark> rather than bring them closer.</div><p class=\"ko\">… 그런 식으로 여러분의 마음을 드러내는 것은 그들을 더 가까이 다가오게 하기보다는 <mark>잠재적인 파트너들을 놀라게 하여 쫓아버릴</mark> 가능성이 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">reluctant(꺼리는) ↔ willing(기꺼이 하는)</p><p class=\"gr\">앞 조건이 좋으면 뒤 행동도 앞으로 나아가는 쪽, willing(기꺼이 하는)이어야 해요. 좋은 조건 뒤에 reluctant(꺼리는)가 오면 방향이 거꾸로예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My friend liked my joke, so I was willing to tell another.</div><div class=\"ko\">친구가 내 농담을 좋아해서 나는 기꺼이 하나 더 했어. (좋은 반응 → 기꺼이)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My friend liked my joke, so I was reluctant to tell another.</div><div class=\"ko\">친구가 좋아했는데 하나 더 하기를 꺼렸다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Nobody laughed, so I was reluctant to tell another.</div><div class=\"ko\">아무도 안 웃어서 나는 하나 더 하기를 꺼렸어. (나쁜 반응 → 꺼림)</div></div><p class=\"gb\">지문 3번도 이야기가 well received(잘 받아들여지고) 비슷한 반응까지 오면 더 드러내는 걸 willing(기꺼이 하는)이니, reluctant(꺼리는)는 틀려요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">reluctant → willing (기꺼이 하는)<small>잘 받아들여지면 더 드러내는 걸 기꺼이 해야 2번 increases(증가한다)와 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">mistake 잘못된 생각</span><span class=\"why\">5번은 처음 만날 때 가장 사적인 이야기를 하면 된다는 생각이에요. 6번에서 그러면 상대를 scare away(놀라게 하여 쫓아버리다)한다고 했으니, 그 생각은 mistake(잘못된 생각)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">rare 드문</span><span class=\"why\">1번은 Although(비록 ~지만)로 시작해요. 처음부터 다 털어놓는 사례가 있긴 하지만, 2번 In most cases(대부분의 경우)는 조금씩 늘어나니 그런 사례는 rare(드문)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">increases 증가한다</span><span class=\"why\">3번에서 처음엔 relatively little(비교적 거의 없이) 드러내다가 나중엔 more(더 많이) 드러내요. 그러니 털어놓는 양이 over time(시간이 지나면서) increases(증가한다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">likely ~할 가능성이 있는</span><span class=\"why\">6번은 rather than bring them closer(더 가까이 오게 하기보다는)와 대조돼요. 마음을 다 드러내면 상대를 쫓아버릴 가능성이 높으니 likely(가능성이 있는)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Although instances occur</div><div class=\"k\">비록 사례들이 일어나지만</div></div><div class=\"rc\"><div class=\"e\">in which partners start their relationship</div><div class=\"k\">파트너들이 그들의 관계를 시작하는</div></div><div class=\"rc\"><div class=\"e\">by telling everything about themselves to each other,</div><div class=\"k\">그들 자신에 관한 모든 것을 서로에게 말함으로써,</div></div><div class=\"rc\"><div class=\"e\">such instances are rare.</div><div class=\"k\">그러한 사례들은 드물다.</div></div><div class=\"rnat\">비록 파트너들이 그들 자신에 관한 모든 것을 서로에게 말함으로써 그들의 관계를 시작하는 사례들이 일어나지만, 그러한 사례들은 드물다.</div><div class=\"rst\">새 학기 첫날 짝꿍에게 비밀을 몽땅 털어놓는 친구도 가끔 있어요. 하지만 지문 1번은 그런 경우가 <b>드물다</b>(rare)고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In most cases,</div><div class=\"k\">대부분의 경우에,</div></div><div class=\"rc ckc\"><div class=\"e\">the amount of disclosure <span class=\"cw\">increases over time</span>.</div><div class=\"k\">털어놓는 비밀 이야기의 양은 <span class=\"cw\">시간이 지나면서 증가한다</span>.</div></div><div class=\"rnat\">대부분의 경우에, 털어놓는 비밀 이야기의 양은 시간이 지나면서 증가한다.</div><div class=\"rst\">대부분은 친해질수록 털어놓는 얘기가 조금씩 늘어요. = 지문 2번, 털어놓는 양은 시간이 지나며 <b>증가한다</b>(increases)는 말이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">We begin relationships by revealing relatively little about ourselves;</div><div class=\"k\">우리는 우리 자신에 대해 비교적 거의 드러내지 않음으로써 관계를 시작하고;</div></div><div class=\"rc ckc\"><div class=\"e\">then if our first bits of self-disclosure are <span class=\"cw\">well received</span></div><div class=\"k\">그런 다음 처음에 조금 털어놓은 자신에 관한 이야기가 <span class=\"cw\">잘 받아들여지고</span></div></div><div class=\"rc\"><div class=\"e\">and bring on similar responses from the other person,</div><div class=\"k\">다른 사람으로부터 비슷한 반응을 불러온다면,</div></div><div class=\"rc ckc\"><div class=\"e\">we’re <span class=\"cw\">willing</span> to reveal more.</div><div class=\"k\">우리는 더 많이 드러내는 것을 <span class=\"cw\">기꺼이 한다</span>. ※ 문제지엔 reluctant로 되어 있음</div></div><div class=\"rnat\">우리는 우리 자신에 대해 비교적 거의 드러내지 않음으로써 관계를 시작하고, 그런 다음 만약 우리가 처음에 조금 털어놓는 자신에 관한 비밀 이야기가 다른 사람으로부터 잘 받아들여지고 비슷한 반응을 불러온다면, 우리는 더 많이 드러내는 것을 꺼린다(→ 기꺼이 한다).</div><div class=\"rst\">처음엔 좋아하는 과자 얘기만 해요. 짝꿍이 웃으며 자기 얘기도 해 주면, 나도 <b>기꺼이</b>(willing) 더 말해요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This principle is important to remember.</div><div class=\"k\">이러한 원칙은 기억하는 것이 중요하다.</div></div><div class=\"rnat\">이러한 원칙은 기억하는 것이 중요하다.</div><div class=\"rst\">이 원칙을 기억해 두면 좋아요. 지문 4번 This principle(이 원칙)은 3번의 ‘조금씩 늘려 가기’를 가리켜요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It would usually be a mistake to assume</div><div class=\"k\">추정하는 것은 보통 잘못된 생각일 것이다</div></div><div class=\"rc\"><div class=\"e\">that the way to build a strong relationship</div><div class=\"k\">확고한 관계를 형성하는 방법이</div></div><div class=\"rc\"><div class=\"e\">would be to reveal the most private details about yourself</div><div class=\"k\">자신에 관한 가장 사적인 세부 사항들을 드러내는 것이라고</div></div><div class=\"rc\"><div class=\"e\">when first making contact with another person.</div><div class=\"k\">다른 사람과 처음 교제할 때.</div></div><div class=\"rnat\">다른 사람과 처음 교제할 때 확고한 관계를 형성하는 방법이 자신에 관한 가장 사적인 세부 사항들을 드러내는 것이라고 추정하는 것은 보통 잘못된 생각일 것이다.</div><div class=\"rst\">첫날부터 가장 깊은 비밀을 말하면 단짝이 될 거라는 생각은 보통 <b>잘못된 생각</b>(mistake)이에요. = 지문 5번이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Unless the circumstances are unique,</div><div class=\"k\">상황이 독특하지 않다면,</div></div><div class=\"rc\"><div class=\"e\">such baring of your soul would be likely</div><div class=\"k\">그런 식으로 여러분의 마음을 드러내는 것은 ~할 가능성이 있다</div></div><div class=\"rc\"><div class=\"e\">to scare potential partners away</div><div class=\"k\">잠재적인 파트너들을 놀라게 하여 쫓아버릴</div></div><div class=\"rc\"><div class=\"e\">rather than bring them closer.</div><div class=\"k\">그들을 더 가까이 다가오게 하기보다는.</div></div><div class=\"rnat\">상황이 독특하지 않다면, 그런 식으로 여러분의 마음을 드러내는 것은 잠재적인 파트너들을 더 가까이 다가오게 하기보다는 오히려 놀라게 하여 쫓아버릴 가능성이 있다.</div><div class=\"rst\">특별한 상황이 아니면, 짝꿍이 놀라서 오히려 멀어질 <b>가능성</b>(likely)이 커요. = 지문 6번, 가까워지기보다 쫓아 버린다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"instance\" data-m=\"사례\"><b>instance</b>사례</button><button type=\"button\" class=\"wdb\" data-w=\"disclosure\" data-m=\"털어놓음, 비밀 이야기\"><b>disclosure</b>털어놓음, 비밀 이야기</button><button type=\"button\" class=\"wdb\" data-w=\"reveal\" data-m=\"드러내다\"><b>reveal</b>드러내다</button><button type=\"button\" class=\"wdb\" data-w=\"well received\" data-m=\"잘 받아들여지는\"><b>well received</b>잘 받아들여지는</button><button type=\"button\" class=\"wdb\" data-w=\"principle\" data-m=\"원칙\"><b>principle</b>원칙</button><button type=\"button\" class=\"wdb\" data-w=\"circumstance\" data-m=\"상황\"><b>circumstance</b>상황</button></div>"};

    if(!w||!ds.length)return;

    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){

      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();

      S.mmD=1;save();upd();

    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
