var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>just as</b>(마치 ~처럼) 뒤의 “나쁜 투자로 인한 실패”와 <b>나란히 놓이는 다른 원인</b>이에요. 뒤따르는 X은행 예시에서 은행을 무너뜨린 게 <b>투자가 아니라 사람들의 믿음·두려움</b>이라는 점을 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (6번)</span><div class=\"en\"><span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> to financial markets, <mark>just as</mark> cascading failures due to bad investments.</div><p class=\"ko\">마치 나쁜 투자로 인한 연속적인 실패처럼, ( ? ) 금융 시장에.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 바로 앞: 투자가 실패하지 않아도 은행이 무너질 수 있다</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 이상한 특징</span><div class=\"en\">A bank might become insolvent <mark>even without having</mark> any of its investments fail.</div><p class=\"ko\">은행은 <mark>심지어</mark> 자신의 투자 중 어느 하나도 실패하지 <mark>않고도</mark> 지급 불능이 될 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그럼 무엇이 은행을 무너뜨리나? → 모두가 “망할 거야”라고 믿는 것</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">If we all woke up tomorrow and <mark>believed that Bank X would be insolvent</mark>, then it would become insolvent.</div><p class=\"ko\">만약 우리 모두가 내일 깨어나서 <mark>X은행이 지급 불능이 될 것이라고 믿는다면,</mark> 그러면 그것(= X은행)은 지급 불능이 될 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>믿음보다 더 약한 것, 두려움만으로도 충분하다고 한 걸음 더 나아감</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 두려움만으로 충분</span><div class=\"en\">In fact, it would be enough … or <mark>just to fear our collective fear</mark>!</div><p class=\"ko\">사실 … 혹은 <mark>단지 우리의 집단적인 두려움을 두려워하는 것</mark>만으로도 충분할 것이다!</p></div><div class=\"ck-via\"><i>▼</i><span>건전한 은행이어도 “나만 늦을까” 하는 두려움이 실패를 스스로 만들어 냄</span></div><div class=\"ck-step\"><span class=\"lab\">9~10번 · 정리</span><div class=\"en\">Financial distress <mark>can be self-fulfilling</mark> and is a particularly troublesome aspect of financial markets.</div><p class=\"ko\">재정적인 고통은 <mark>자기 충족적일 수 있고</mark> 금융 시장에서의 특히 골치 아픈 측면이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">Fear and uncertainty can be damaging 두려움과 불확실성은 해를 끼칠 수 있다<small>7~9번에서 은행을 무너뜨린 건 투자가 아니라 fear(두려움)였어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Strong connections between banks can create a scare 은행들 간의 강한 연결이 공포를 만들 수 있다</span><span class=\"why\">1번의 connectedness(연결성)를 떠올리게 하는 함정이에요. 하지만 4번에서 감염은 contact(접촉) 없이도 일어난다고 했고, 7~9번의 원인은 은행끼리의 연결이 아니라 사람들의 두려움이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Unaffordable personal loans may pose a risk 감당할 수 없는 개인 대출이 위험을 초래할 수 있다</span><span class=\"why\">개인 대출 이야기는 지문에 없어요. 2번의 borrowers(채무자)만 보고 고르면 안 되고, 7~9번은 대출이 아니라 믿음·두려움 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Ignorance about legal restrictions may matter 법적 규제에 대한 무지가 문제가 될 수 있다</span><span class=\"why\">법이나 규제는 지문 어디에도 나오지 않아요. 9번은 오히려 X은행이 건전하다는 걸 다 알아도 두려움 때문에 무너진다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Accurate knowledge of investors can be poisonous 투자자들의 정확한 지식이 해로울 수 있다</span><span class=\"why\">9번에서 정확히 알고 있어도(well-managed 잘 운영된다) 문제를 만든 건 지식이 아니라 “남들이 돈을 뺄까” 하는 두려움이에요. 원인을 잘못 짚었어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The connectedness of the global economic market</div><div class=\"k\">전 세계 경제 시장의 연결성은</div></div><div class=\"rc\"><div class=\"e\">makes it vulnerable</div><div class=\"k\">그것(= 전 세계 경제 시장)을 취약하게 만든다</div></div><div class=\"rc\"><div class=\"e\">to potential “infection.”</div><div class=\"k\">잠재적 ‘감염’에.</div></div><div class=\"rnat\">전 세계 경제 시장의 연결성은 그것을 잠재적 '감염'에 취약하게 만든다.</div><div class=\"rst\">우리 반 친구들은 단톡방으로 다 이어져 있어요. 그래서 한 명이 흔들리면 반 전체가 흔들려요. = 지문의 <b>연결성</b> 때문에 감염에 약하다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">A financial failure</div><div class=\"k\">금융상의 실패는</div></div><div class=\"rc\"><div class=\"e\">can make its way</div><div class=\"k\">나아갈 수 있다</div></div><div class=\"rc\"><div class=\"e\">from borrowers to banks to insurers,</div><div class=\"k\">채무자에서부터 은행, 보증인까지,</div></div><div class=\"rc\"><div class=\"e\">spreading like a flu.</div><div class=\"k\">독감처럼 퍼지면서.</div></div><div class=\"rnat\">금융상의 실패는 독감처럼 퍼지면서 채무자에서부터 은행, 보증인까지 나아갈 수 있다.</div><div class=\"rst\">한 명이 매점 빵 사는 데 실패하면, 그 소식이 감기처럼 옆 친구, 그 옆 친구에게 퍼져요. 지문의 실패가 채무자→은행→보증인으로 퍼지는 모습이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">However, there are unexpected characteristics</div><div class=\"k\">그러나 예상치 못한 특징들이 있다</div></div><div class=\"rc\"><div class=\"e\">when it comes to such infection</div><div class=\"k\">그러한 감염에 관해서는</div></div><div class=\"rc\"><div class=\"e\">in the market.</div><div class=\"k\">시장에서.</div></div><div class=\"rnat\">그러나 시장에서 그러한 감염에 관해서는 예상치 못한 특징들이 있다.</div><div class=\"rst\"><b>그런데</b>(However) 이 퍼짐에는 좀 이상한 점이 있어요. 지문이 여기서 방향을 틀어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Infection can occur</div><div class=\"k\">감염은 일어날 수 있다</div></div><div class=\"rc\"><div class=\"e\">even without any contact.</div><div class=\"k\">심지어 어떤 접촉 없이도.</div></div><div class=\"rnat\">감염은 심지어 어떤 접촉 없이도 일어날 수 있다.</div><div class=\"rst\">누구와 부딪히지 않았는데도 퍼져요. 지문 말대로 <b>접촉 없이도</b> 감염이 일어나요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">A bank might become insolvent</div><div class=\"k\">은행은 지급 불능이 될 수 있다</div></div><div class=\"rc\"><div class=\"e\">even without having</div><div class=\"k\">심지어 ~하지 않고도</div></div><div class=\"rc\"><div class=\"e\">any of its investments fail.</div><div class=\"k\">자신의(= 은행의) 투자 중 어느 하나도 실패하지 않고도.</div></div><div class=\"rnat\">은행은 자신의 투자 중 어느 하나도 실패하지 않고도 지급 불능이 될 수 있다.</div><div class=\"rst\">매점에 빵이 아직 잔뜩 있는데도 “빵이 없다”가 될 수 있어요. 지문의 투자 실패 없이도 은행이 지급 불능이 된다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Fear and uncertainty can be damaging</span></div><div class=\"k\"><span class=\"cw\">두려움과 불확실성은 손해를 끼칠 수 있다</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">to financial markets,</div><div class=\"k\">금융 시장에,</div></div><div class=\"rc\"><div class=\"e\">just as cascading failures</div><div class=\"k\">마치 연속적인 실패처럼</div></div><div class=\"rc\"><div class=\"e\">due to bad investments.</div><div class=\"k\">나쁜 투자들로 인한.</div></div><div class=\"rnat\">두려움과 불확실성은 나쁜 투자로 인한 연속적인 실패와 마찬가지로 금융 시장에 해를 끼칠 수 있다.</div><div class=\"rst\">그래서 빵이 실제로 모자란 것만큼, “모자라면 어쩌지?” 하는 <b>두려움과 불안</b>도 매점을 망칠 수 있어요. 이게 지문의 빈칸 자리예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">If we all woke up tomorrow</div><div class=\"k\">만약 우리 모두가 내일 깨어나서</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">believed that Bank X would be insolvent</span>,</div><div class=\"k\"><span class=\"cw\">X은행이 지급 불능이 될 것이라고 믿는다면</span>,</div></div><div class=\"rc\"><div class=\"e\">then it would become insolvent.</div><div class=\"k\">그러면 그것(= X은행)은 지급 불능이 될 것이다.</div></div><div class=\"rnat\">만약 우리 모두가 내일 깨어나서 X은행이 지급 불능이 될 것이라고 믿는다면, 그것은 지급 불능이 될 것이다.</div><div class=\"rst\">내일 아침 모두가 “매점 빵 다 떨어진대” 하고 <b>믿고</b> 달려가면, 진짜로 빵이 바닥나요. = 지문의 X은행이 진짜 지급 불능이 되는 장면이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실</div></div><div class=\"rc\"><div class=\"e\">it would be enough</div><div class=\"k\">충분할 것이다</div></div><div class=\"rc\"><div class=\"e\">for us to fear that others believed</div><div class=\"k\">우리가 다른 사람들이 믿고 있다는 것을 두려워하는 것이</div></div><div class=\"rc\"><div class=\"e\">that Bank X was going to fail,</div><div class=\"k\">X은행이 실패할 것이라고,</div></div><div class=\"rc ckc\"><div class=\"e\">or <span class=\"cw\">just to fear our collective fear</span>!</div><div class=\"k\">혹은 <span class=\"cw\">단지 우리의 집단적인 두려움을 두려워하는 것이</span>!</div></div><div class=\"rnat\">사실 우리가 다른 사람들이 X은행이 실패할 것이라고 믿고 있다는 것을 두려워하거나, 단지 우리의 집단적인 두려움을 두려워하는 것으로 충분할 것이다!</div><div class=\"rst\">사실 “다른 애들이 그렇게 믿을까 봐” 겁나는 것만으로도 충분해요. 지문 말처럼 우리 모두의 <b>두려움을 두려워하는 것</b>만으로요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">We might all even know</div><div class=\"k\">우리 모두는 심지어 알고 있을지도 모른다</div></div><div class=\"rc\"><div class=\"e\">that Bank X was well-managed with healthy investments,</div><div class=\"k\">X은행이 건전한 투자로 잘 운영된다는 것을,</div></div><div class=\"rc\"><div class=\"e\">but if we expected others to pull their money out,</div><div class=\"k\">하지만 만약 우리가 다른 사람들이 그들의 돈을 인출할 것이라고 예상한다면,</div></div><div class=\"rc\"><div class=\"e\">then we would fear being the last</div><div class=\"k\">그러면 우리는 마지막이 되는 것을 두려워할 것이다</div></div><div class=\"rc\"><div class=\"e\">to pull our money out.</div><div class=\"k\">우리의 돈을 인출하는.</div></div><div class=\"rnat\">우리 모두가 심지어 X은행이 건전한 투자로 잘 운영되고 있다는 것을 알고 있을지라도, 다른 사람들이 돈을 인출할 것이라고 예상한다면, 우리는 우리 돈을 인출하는 마지막 사람이 되는 것을 두려워하게 될 것이다.</div><div class=\"rst\">빵이 넉넉한 걸 다 알아도, 남들이 먼저 달려갈 것 같으면 “나만 꼴찌로 못 사면 어떡해” 하고 겁나요. = 지문의 돈을 마지막에 빼는 사람 되기.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Financial distress</div><div class=\"k\">재정적인 고통은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">can be self-fulfilling</span></div><div class=\"k\"><span class=\"cw\">자기 충족적일 수 있고</span></div></div><div class=\"rc\"><div class=\"e\">and is a particularly troublesome aspect</div><div class=\"k\">특히 골치 아픈 측면이다</div></div><div class=\"rc\"><div class=\"e\">of financial markets.</div><div class=\"k\">금융 시장에서의.</div></div><div class=\"rnat\">재정적인 고통은 자기 충족적일 수 있고 금융 시장에서의 특히 골치 아픈 측면이다.</div><div class=\"rst\">이렇게 걱정이 스스로 걱정한 일을 만들어 내요. 지문은 이것을 <b>자기 충족적</b>(self-fulfilling)이라 부르고, 금융 시장의 골칫거리라고 해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"connectedness\" data-m=\"연결성\"><b>connectedness</b>연결성</button><button type=\"button\" class=\"wdb\" data-w=\"vulnerable\" data-m=\"취약한\"><b>vulnerable</b>취약한</button><button type=\"button\" class=\"wdb\" data-w=\"insolvent\" data-m=\"지급 불능의\"><b>insolvent</b>지급 불능의</button><button type=\"button\" class=\"wdb\" data-w=\"cascading failure\" data-m=\"연속적인 실패\"><b>cascading failure</b>연속적인 실패</button><button type=\"button\" class=\"wdb\" data-w=\"collective\" data-m=\"집단적인\"><b>collective</b>집단적인</button><button type=\"button\" class=\"wdb\" data-w=\"self-fulfilling\" data-m=\"자기 충족적인\"><b>self-fulfilling</b>자기 충족적인</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>“부자들이 사지 않게 되는 조건”</b>이에요. 2~4번에서 베블런재의 가치는 품질이 아니라 <b>비싼 가격으로 부를 드러내는 것</b>이라 했으니, 가격이 떨어져 <b>그 구별이 사라지는</b> 순간을 고르세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (6번)</span><div class=\"en\">If the price falls so much that <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>,</span> <mark>the rich will stop buying it</mark>.</div><p class=\"ko\">가격이 너무 많이 떨어져서 ( ? )하면, 부자들은 그것을 사는 것을 멈출 것이다</p></div><div class=\"ck-via\"><i>▼</i><span>보통 물건과 반대: 비쌀수록 더 잘 팔림</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 이상한 물건</span><div class=\"en\">They are strange because <mark>demand for them increases</mark> as their price rises.</div><p class=\"ko\">그것들(= 베블런재)은 가격이 상승함에 따라 <mark>그것들에 대한 수요가 증가하기 때문에</mark> 이상하다.</p></div><div class=\"ck-via\"><i>▼</i><span>왜 비쌀수록 사나? → 높은 지위를 보여 줘야 하니까</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 비싼 이유</span><div class=\"en\">According to Veblen, these goods <mark>must signal high status</mark>.</div><p class=\"ko\">Veblen에 따르면, <mark>이러한 물건들은 높은 지위를 나타내야 한다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>비싼 값을 내는 목적 = 품질이 아니라 부를 드러내기</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">A willingness to pay higher prices is due to a desire <mark>to advertise wealth</mark> rather than to acquire better quality.</div><p class=\"ko\">더 높은 가격을 지불하고자 하는 마음은 더 나은 품질을 얻기 위한 것이라기보다는 <mark>부유함을 드러내 보이려는</mark> 욕구 때문이다.</p></div><div class=\"ck-via\"><i>▼</i><span>값을 내리면 잠깐 더 팔리다가, 부자들이 떠나서 결국 판매가 떨어짐</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 뒤에서 확인</span><div class=\"en\">A reduction in prices might see a temporary increase in sales for the seller, but then <mark>sales will begin to fall</mark>.</div><p class=\"ko\">가격 하락은 판매자에게 일시적인 판매 증가를 보일 수 있지만, <mark>그 이후에는 판매량이 하락하기 시작할 것이다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">it is no longer high enough to exclude the less well off 가격이 더 이상 덜 부유한 사람들을 배제할 만큼 충분히 높지 않다<small>누구나 살 수 있는 값이 되면 부를 드러내는(advertise wealth) 힘이 사라져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">there is no quality competition remaining in the market 시장에 품질 경쟁이 남아 있지 않다</span><span class=\"why\">4·5번에서 베블런재는 처음부터 품질이 아니라 부를 드러내려고 사는 물건이라 했어요. 품질 경쟁이 있든 없든 부자들이 떠나는 이유가 될 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">the government starts to get involved in the industry 정부가 그 산업에 개입하기 시작한다</span><span class=\"why\">정부 이야기는 지문 어디에도 없어요. 6번은 가격이 떨어진 결과를 말하는 자리예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">manufacturers finally decide not to supply the market 제조업체들이 마침내 시장에 공급하지 않기로 결정한다</span><span class=\"why\">6번에서 사는 걸 멈추는 건 부자들(the rich 부자들)이지 제조업체가 아니에요. 8번도 판매자는 계속 파는데 판매량이 떨어진다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">the law of supply and demand does not work anymore 수요와 공급의 법칙이 더 이상 작동하지 않는다</span><span class=\"why\">2번에서 베블런재는 원래부터 보통의 수요 법칙과 반대로 움직인다고 했어요. 가격이 떨어져서 생기는 일이 아니라 처음부터 그런 거라 조건이 될 수 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Veblen goods are named after Thorstein Veblen,</div><div class=\"k\">베블런재는 Thorstein Veblen의 이름을 따서 지어졌다,</div></div><div class=\"rc\"><div class=\"e\">a US economist</div><div class=\"k\">미국의 경제학자인</div></div><div class=\"rc\"><div class=\"e\">who formulated the theory of “conspicuous consumption”.</div><div class=\"k\">‘과시적 소비’ 이론을 만들어 낸.</div></div><div class=\"rnat\">베블런재는 '과시적 소비' 이론을 만들어 낸 미국의 경제학자 Thorstein Veblen의 이름을 따서 지어졌다.</div><div class=\"rst\">학교에 엄청 비싼 브랜드 패딩이 있어요. 지문의 베블런재처럼, ‘<b>보여 주려고</b> 사는 소비’(과시적 소비) 이론에서 이름이 나왔대요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">They are strange</div><div class=\"k\">그것들(= 베블런재)은 이상하다</div></div><div class=\"rc ckc\"><div class=\"e\">because <span class=\"cw\">demand for them increases</span></div><div class=\"k\"><span class=\"cw\">그것들에 대한 수요가 증가하기 때문에</span></div></div><div class=\"rc\"><div class=\"e\">as their price rises.</div><div class=\"k\">가격이 상승함에 따라.</div></div><div class=\"rnat\">그것들(베블런재)은 가격이 상승함에 따라 그것들에 대한 수요가 증가하기 때문에 이상하다.</div><div class=\"rst\">이상하게도 이 패딩은 값이 오를수록 더 갖고 싶어 해요. 지문 말처럼 가격이 오르면 <b>수요가 늘어요</b>.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">According to Veblen,</div><div class=\"k\">Veblen에 따르면,</div></div><div class=\"rc\"><div class=\"e\">these goods must signal high status.</div><div class=\"k\">이러한 물건들은 높은 지위를 나타내야 한다.</div></div><div class=\"rnat\">Veblen에 따르면, 이러한 물건들은 높은 지위를 나타내야 한다.</div><div class=\"rst\">이 패딩은 “나 부자야”를 보여 주는 표시여야 해요. = 지문의 높은 지위를 나타내야 한다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">A willingness to pay higher prices</div><div class=\"k\">더 높은 가격을 지불하고자 하는 마음은</div></div><div class=\"rc\"><div class=\"e\">is due to a desire</div><div class=\"k\">욕구 때문이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to advertise wealth</span></div><div class=\"k\"><span class=\"cw\">부유함을 드러내 보이려는</span></div></div><div class=\"rc\"><div class=\"e\">rather than to acquire better quality.</div><div class=\"k\">더 나은 품질을 얻기 위한 것이라기보다는.</div></div><div class=\"rnat\">더 높은 가격을 기꺼이 지불하려는 마음은 더 나은 품질을 얻기 위해서라기보다는 부유함을 과시하고 싶은 욕구 때문이다.</div><div class=\"rst\">비싼 돈을 내는 건 더 따뜻해서가 아니라 <b>돈 많은 걸 드러내고</b> 싶어서예요. = 지문의 품질보다 부를 과시하려는 욕구예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">A true Veblen good, therefore,</div><div class=\"k\">그러므로 진정한 베블런재는</div></div><div class=\"rc\"><div class=\"e\">should not be noticeably higher quality</div><div class=\"k\">두드러지게 더 높은 품질이지는 않을 것이다</div></div><div class=\"rc\"><div class=\"e\">than the lower-priced equivalents.</div><div class=\"k\">더 낮은 가격의 동등한 물건보다.</div></div><div class=\"rnat\">그러므로 진정한 베블런재는 더 낮은 가격의 동등한 물건보다 두드러지게 더 높은 품질이지는 않을 것이다.</div><div class=\"rst\">그러니까 진짜 그 패딩은 시장표 패딩보다 딱히 더 좋지도 않아요. 지문도 품질이 두드러지게 높지 않다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">If the price falls so much that</div><div class=\"k\">만약 가격이 너무 많이 하락해서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">it is no longer high enough to exclude the less well off</span>,</div><div class=\"k\">그것(= 가격)이 <span class=\"cw\">더 이상 덜 부유한 사람들을 배제할 만큼 충분히 높지(비싸지) 않다면</span>, ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the rich will stop buying it</span>.</div><div class=\"k\"><span class=\"cw\">부자들은 그것(= 베블런재)을 사는 것을 멈출 것이다</span>.</div></div><div class=\"rnat\">만약 가격이 너무 많이 하락해서 더 이상 덜 부유한 사람들을 배제할 만큼 충분히 높지(비싸지) 않다면, 부유한 사람들은 그것을 사는 것을 멈출 것이다.</div><div class=\"rst\">그런데 값이 확 내려서 <b>누구나 살 수 있게</b> 되면, 부자 친구들은 그 패딩을 안 사요. 이게 빈칸 자리, 덜 부유한 사람을 못 막는 가격이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">There is much evidence of this behavior</div><div class=\"k\">이러한 행동(= 가격이 내려가면 부자들이 사지 않는 행동)에 대한 많은 증거가 있다</div></div><div class=\"rc\"><div class=\"e\">in the markets for luxury cars, champagne, watches,</div><div class=\"k\">고급 차, 샴페인, 시계 시장에,</div></div><div class=\"rc\"><div class=\"e\">and certain clothing labels.</div><div class=\"k\">그리고 특정 의류 브랜드(시장)에.</div></div><div class=\"rnat\">고급 차, 샴페인, 시계, 그리고 특정 의류 브랜드 시장에는 이러한 행동에 대한 많은 증거가 있다.</div><div class=\"rst\">비싼 자동차, 샴페인, 시계, 몇몇 옷 브랜드도 다 이래요. 지문은 이런 행동의 증거가 많다고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">A reduction in prices</div><div class=\"k\">가격 하락은</div></div><div class=\"rc\"><div class=\"e\">might see a temporary increase in sales</div><div class=\"k\">일시적인 판매 증가를 보일 수 있지만</div></div><div class=\"rc\"><div class=\"e\">for the seller,</div><div class=\"k\">판매자에게,</div></div><div class=\"rc\"><div class=\"e\">but then sales will begin to fall.</div><div class=\"k\">그 이후에는 판매량이 하락하기 시작할 것이다.</div></div><div class=\"rnat\">가격 하락은 판매자에게 일시적인 판매 증가를 낳을 수 있지만, 그 이후에는 판매량이 하락하기 시작할 것이다.</div><div class=\"rst\">할인하면 잠깐은 더 팔리지만, 곧 <b>판매가 뚝 떨어져요</b>. = 지문 8번, 가격을 내리면 결국 판매량이 하락한다는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"conspicuous consumption\" data-m=\"과시적 소비\"><b>conspicuous consumption</b>과시적 소비</button><button type=\"button\" class=\"wdb\" data-w=\"signal\" data-m=\"나타내다, 신호를 보내다\"><b>signal</b>나타내다, 신호를 보내다</button><button type=\"button\" class=\"wdb\" data-w=\"status\" data-m=\"지위, 신분\"><b>status</b>지위, 신분</button><button type=\"button\" class=\"wdb\" data-w=\"advertise wealth\" data-m=\"부를 과시하다\"><b>advertise wealth</b>부를 과시하다</button><button type=\"button\" class=\"wdb\" data-w=\"equivalent\" data-m=\"동등한 물건\"><b>equivalent</b>동등한 물건</button><button type=\"button\" class=\"wdb\" data-w=\"exclude\" data-m=\"배제하다\"><b>exclude</b>배제하다</button><button type=\"button\" class=\"wdb\" data-w=\"well off\" data-m=\"부유한\"><b>well off</b>부유한</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문 앞뒤 절이 지문의 <b>두 핵심 문장</b>과 하나씩 짝이에요. (A)는 1번의 “습관도 <b>의도</b>를 따른다”, (B)는 4번의 “습관이 우리를 <b>안전하게</b> 지켜 준다”를 말만 바꿔 옮긴 자리예요.</p><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · (A)의 근거</span><div class=\"en\">… it’s worth emphasizing that much of the time <mark>even our strong habits do follow our intentions</mark>.</div><p class=\"ko\">대부분의 시간에 <mark>우리의 강한 습관조차도 우리의 의도를 따른다는 것은</mark> 강조할 만한 가치가 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>무의식으로 해도 습관은 처음 의도와 일치한다고 되풀이</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 한 번 더 확인</span><div class=\"en\">… the habits still <mark>line up with our original intentions</mark>.</div><p class=\"ko\">습관은 여전히 <mark>우리의 본래 의도에 동조한다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>Even better(한결 더 좋은 것은)로 두 번째 장점이 나옴</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · (B)의 근거</span><div class=\"en\">Even better, our automatic, unconscious habits <mark>can keep us safe</mark> even when our conscious mind is distracted.</div><p class=\"ko\">한결 더 좋은 것은, 우리의 의식적인 마음이 산만해질 때조차도 우리의 자동적이고 무의식적인 습관들이 <mark>우리를 안전하게 지켜줄 수 있다는 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>딴생각하면서도 길 건너기 전 양쪽 보기</span><span><em>5번</em>양배추 걱정하면서도 오븐 장갑 끼기</span><span><em>6번</em>살아 있고 데지 않으려는 목표를 습관이 이뤄 줌</span></div><div class=\"ck-eq\">⇒ 두 장면의 공통점 = 습관이 위험에서 지켜 줌 → (B) danger(위험)</div></div><div class=\"ck-via\"><i>▼</i><span>follow our intentions(의도를 따르다) = related to (A) / keep us safe(안전하게 지키다) = keeping us from (B)</span></div><div class=\"ck-step\"><span class=\"lab\">요약문 (7번) · 짝 맞추기</span><div class=\"en\">The habitual acts we automatically do <mark>are related to our (A) intention</mark> and these acts can be helpful <mark>in keeping us from (B) danger</mark> in our lives.</div><p class=\"ko\">우리가 자동적으로 하는 습관적인 행동은 <mark>우리의 (A) 의도와 연관되어 있고,</mark> 이러한 행동은 우리의 삶에서 우리를 <mark>(B) 위험으로부터 지켜주는 데</mark> 도움이 될 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">intention 의도 …… danger 위험<small>1번 follow our intentions(의도를 따르다) → (A), 4번 keep us safe(안전하게 지키다) → (B)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">mood 기분 …… danger 위험</span><span class=\"why\">(B)는 맞지만 (A)가 틀려요. 5번의 depressing holiday(울적한 휴일)를 보고 “기분”이 떠오르지만, 그건 딴생각의 예일 뿐이고 1·3번은 습관이 intentions(의도)를 따른다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">intention 의도 …… ignorance 무지</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 4~6번은 습관이 우리를 safe(안전하게) 지켜 준다는 말이지, 모르는 것에서 지켜 준다는 말이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">experience 경험 …… laziness 게으름</span><span class=\"why\">둘 다 틀려요. 1번은 습관이 경험이 아니라 intentions(의도)를 따른다고 했고, 게으름 이야기는 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">experience 경험 …… ignorance 무지</span><span class=\"why\">둘 다 틀려요. (A)는 1·3번의 intentions(의도)여야 하고, (B)는 6번처럼 살아 있고 데지 않게 지켜 주는 것이라 “위험”이어야 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Despite all the talk</div><div class=\"k\">온갖 이야기에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">of how weak intentions are in the face of habits,</div><div class=\"k\">습관 앞에서 의도가 얼마나 약한지에 관한,</div></div><div class=\"rc\"><div class=\"e\">it’s worth emphasizing</div><div class=\"k\">강조할 만한 가치가 있다</div></div><div class=\"rc\"><div class=\"e\">that much of the time</div><div class=\"k\">대부분의 시간에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">even our strong habits do follow our intentions</span>.</div><div class=\"k\"><span class=\"cw\">우리의 강한 습관조차도 우리의 의도를 따른다는 것은</span>.</div></div><div class=\"rnat\">습관 앞에서 의도가 얼마나 약한지에 관한 온갖 이야기에도 불구하고, 대부분의 시간에 우리의 강한 습관조차도 우리의 의도를 따른다는 것은 강조할 만한 가치가 있다.</div><div class=\"rst\">습관은 내 마음대로 안 된다고들 하죠. 하지만 아침에 양치하는 습관도 사실은 “이 닦아야지” 하는 내 <b>의도</b>를 따라요. = 지문 1번, 강한 습관도 의도를 따른대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We are mostly doing</div><div class=\"k\">우리는 대체로 하고 있다</div></div><div class=\"rc\"><div class=\"e\">what we intend to do,</div><div class=\"k\">우리가 하려고 의도한 일을,</div></div><div class=\"rc\"><div class=\"e\">even though it’s happening automatically.</div><div class=\"k\">비록 (그것이) 자동적으로 일어나고 있지만.</div></div><div class=\"rnat\">우리는 비록 자동적으로 일어나고 있지만, 우리는 대체로 우리가 하려고 의도한 일을 하고 있다.</div><div class=\"rst\">졸린 채 칫솔질을 해도, 그건 원래 내가 하려던 일이에요. 지문 말처럼 자동으로 일어나도 의도한 일을 하는 거예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This probably goes for many habits:</div><div class=\"k\">이것(= 우리가 의도한 일을 하고 있다는 것)은 아마 많은 습관에도 해당될 것이다:</div></div><div class=\"rc\"><div class=\"e\">although we perform them</div><div class=\"k\">비록 우리가 그것들(= 습관들)을 행하지만</div></div><div class=\"rc\"><div class=\"e\">without bringing the intention to consciousness,</div><div class=\"k\">의도를 의식으로 가져오지 않고(무의식적으로),</div></div><div class=\"rc\"><div class=\"e\">the habits still line up with our original intentions.</div><div class=\"k\">습관은 여전히 우리의 본래 의도에 동조한다.</div></div><div class=\"rnat\">이것은 아마 많은 습관에도 해당될 것이다. 비록 우리가 의도를 의식하지 않고 습관을 수행하더라도, 그 습관들은 여전히 우리의 원래 의도와 일치한다.</div><div class=\"rst\">가방 챙기기, 신발 신기 같은 다른 습관도 마찬가지예요. 생각 안 하고 해도 <b>원래 의도</b>와 딱 맞아요. = 지문 3번이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Even better,</div><div class=\"k\">한결 더 좋은 것은,</div></div><div class=\"rc\"><div class=\"e\">our automatic, unconscious habits</div><div class=\"k\">우리의 자동적이고 무의식적인 습관들이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">can keep us safe</span></div><div class=\"k\"><span class=\"cw\">우리를 안전하게 지켜줄 수 있다는 것이다</span></div></div><div class=\"rc\"><div class=\"e\">even when our conscious mind is distracted.</div><div class=\"k\">우리의 의식적인 마음(의식)이 산만해질 때조차도.</div></div><div class=\"rnat\">한결 더 좋은 것은, 우리의 자동적이고 무의식적인 습관이 우리의 의식적인 마음(의식)이 산만해질 때조차도 우리를 안전하게 지켜줄 수 있다는 것이다.</div><div class=\"rst\"><b>더 좋은 점</b>(Even better)은, 딴생각을 할 때도 습관이 나를 <b>안전하게 지켜 줘요</b>. 지문 4번이 두 번째 장점을 말해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">We look both ways</div><div class=\"k\">우리는 양쪽 길을 모두 쳐다본다</div></div><div class=\"rc\"><div class=\"e\">before crossing the road</div><div class=\"k\">길을 건너기 전에</div></div><div class=\"rc\"><div class=\"e\">despite thinking about</div><div class=\"k\">~에 대해 생각하고 있음에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">a rather depressing holiday we took in Brazil,</div><div class=\"k\">브라질에서 보냈던 다소 울적한 휴일,</div></div><div class=\"rc\"><div class=\"e\">and we put oven gloves on</div><div class=\"k\">그리고 우리는 오븐용 장갑을 낀다</div></div><div class=\"rc\"><div class=\"e\">before reaching into the oven</div><div class=\"k\">오븐 안으로 손을 뻗기 전에</div></div><div class=\"rc\"><div class=\"e\">despite being preoccupied about</div><div class=\"k\">~에 관해 몰두하고 있음에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">whether the cabbage is overcooked.</div><div class=\"k\">양배추가 지나치게 익었는지.</div></div><div class=\"rnat\">우리는 브라질에서 보냈던 다소 울적한 휴일에 대해 생각하고 있음에도 불구하고 길을 건너기 전에 양쪽을 모두 쳐다보고, 양배추가 지나치게 익었는지에 몰두하고 있음에도 불구하고 우리는 오븐 안으로 손을 뻗기 전에 오븐용 장갑을 낀다.</div><div class=\"rst\">등굣길에 어제 게임 진 일을 생각하면서도 횡단보도 앞에서 양쪽을 봐요. 라면 생각하면서도 뜨거운 냄비엔 장갑을 껴요. = 지문 5번의 두 장면이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In both cases,</div><div class=\"k\">두 가지 경우 모두,</div></div><div class=\"rc\"><div class=\"e\">our goal of keeping ourselves alive and unburnt</div><div class=\"k\">우리 자신을 살아있게 하고 화상을 입지 않게 하려는 우리의 목표가</div></div><div class=\"rc\"><div class=\"e\">is served by our automatic, unconscious habits.</div><div class=\"k\">우리의 자동적이고 무의식적인 습관들에 의해 이행된다.</div></div><div class=\"rnat\">두 가지 경우 모두, 우리 자신을 살아있게 하고 데지 않게 하려는 우리의 목표가 우리의 자동적이고 무의식적인 습관에 의해 이행된다.</div><div class=\"rst\">두 경우 모두 “안 다치고 안 데기”라는 목표를 습관이 대신 해 줘요. 지문 6번이 이걸 한 줄로 묶어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The habitual acts we automatically do</div><div class=\"k\">우리가 자동적으로 하는 습관적인 행동은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are related to our (A) intention</span></div><div class=\"k\"><span class=\"cw\">우리의 (A) 의도와 연관되어 있고</span>, ※ 문제지엔 (A) 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">and these acts can be helpful</div><div class=\"k\">이러한 행동(= 습관적인 행동)은 도움이 될 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in keeping us from (B) danger</span> in our lives.</div><div class=\"k\">우리의 삶에서 우리를 <span class=\"cw\">(B) 위험으로부터 지켜주는 데</span>. ※ 문제지엔 (B) 빈칸으로 되어 있음</div></div><div class=\"rnat\">우리가 자동적으로 하는 습관적인 행동은 우리의 (A)의도와 연관되어 있고, 이러한 행동은 우리의 삶에서 우리를 (B)위험으로부터 지켜주는 데 도움이 될 수 있다.</div><div class=\"rst\">정리하면, 습관은 내 <b>의도</b>(intention)와 이어져 있고 나를 <b>위험</b>(danger)에서 지켜 줘요. 1번과 4번을 옮긴 요약이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"intention\" data-m=\"의도\"><b>intention</b>의도</button><button type=\"button\" class=\"wdb\" data-w=\"consciousness\" data-m=\"의식\"><b>consciousness</b>의식</button><button type=\"button\" class=\"wdb\" data-w=\"unconscious\" data-m=\"무의식적인\"><b>unconscious</b>무의식적인</button><button type=\"button\" class=\"wdb\" data-w=\"distracted\" data-m=\"정신이 팔린, 산만한\"><b>distracted</b>정신이 팔린, 산만한</button><button type=\"button\" class=\"wdb\" data-w=\"preoccupied\" data-m=\"~에 몰두한\"><b>preoccupied</b>~에 몰두한</button><button type=\"button\" class=\"wdb\" data-w=\"habitual\" data-m=\"습관적인\"><b>habitual</b>습관적인</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>첫 문장의 화제</b>를 잡고 하나씩 대 보세요. 이 글의 화제는 <b>입장을 취하는 것</b>(taking a stand)이 사람들을 모으는 <b>집합 지점</b>(rallying point)이 된다는 것이에요. customers(고객)라는 단어만 같고 화제가 다른 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글 전체 화제</span><div class=\"en\"><mark>Taking a stand is important</mark> because you become a beacon for those individuals who are your people, your tribe, and your audience.</div><p class=\"ko\">당신이 그 개개인들, 즉 당신의 사람들, 당신의 부족, 당신의 청중에게 횃불이 되기 때문에 <mark>입장을 취하는 것은 중요하다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>횃불(beacon)을 깃발(flag)로 바꿔 말하며 화제를 이어 감</span></div><div class=\"ck-step\"><span class=\"lab\">①(2번) · 깃발 = 집합 지점</span><div class=\"en\">When you raise your viewpoint up like a flag, people know where to find you; <mark>it becomes a rallying point</mark>.</div><p class=\"ko\">당신이 당신의 견해를 깃발처럼 들 때, 사람들은 어디서 당신을 찾아야 할지 안다; <mark>그것은 집합 지점이 된다.</mark></p></div><div class=\"ck-via\"><i>▼</i><span>②의 “물건만 파는 게 아니다”를 받아 최고의 마케팅 = 입장 취하기</span></div><div class=\"ck-step\"><span class=\"lab\">③(4번) · 마케팅도 입장</span><div class=\"en\">The best marketing is never just about selling a product or service, <mark>but about taking a stand</mark> …</div><p class=\"ko\">최고의 마케팅은 결코 제품이나 서비스를 판매하는 것에 대한 것이 아니라, <mark>입장을 취하는 것에 대한 것이다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>입장·집합 지점 이야기가 갑자기 고객 유지 방법, 상품 개발 참여로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">④(5번) · 이탈 지점</span><div class=\"en\">If you want to retain your existing customers, you need to create ways … <mark>participating in the process of product development</mark>.</div><p class=\"ko\">만약 당신이 기존의 고객을 유지하고 싶다면, 당신은 (고객이 <mark>상품 개발 과정에 참여하면서</mark> 팀의 또 다른 구성원처럼 느낄 수 있는) 방법을 만들어 낼 필요가 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>④를 빼면 ③의 입장 → ⑤의 집합 지점·가치로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(6번) · 다시 제자리</span><div class=\"en\">Products can be changed or adjusted if they aren’t functioning, <mark>but rallying points align with</mark> the values and meaning behind what you do.</div><p class=\"ko\">상품은 그것들이 기능하지 않으면 바꾸거나 고칠 수 있다, <mark>하지만 집합 지점은</mark> 당신이 하는 것의 이면에 있는 가치 및 의미<mark>와 같은 선상에 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">기존 고객을 유지하려면 고객이 상품 개발에 참여하는 팀원처럼 느끼게 하라<small>입장을 취하는 이야기가 아니라 고객 관리 방법이라 흐름에서 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">관점을 보여 주면 고객은 당신이 물건만 파는 게 아님을 안다</span><span class=\"why\">customers(고객), products(제품)가 나와서 ④와 같은 고객 이야기로 보이지만, Displaying your perspective(관점을 보여 주는 것)로 1번의 입장 취하기를 그대로 이어 가요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">견해를 깃발처럼 들면 사람들이 찾아오는 집합 지점이 된다</span><span class=\"why\">1번의 beacon(횃불)을 flag(깃발)로 바꿔 말하며, 입장이 rallying point(집합 지점)가 된다고 풀어 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">최고의 마케팅은 물건 팔기가 아니라 입장을 취하는 것이다</span><span class=\"why\">taking a stand(입장을 취하는 것)라는 1번의 핵심어를 다시 써서, 마케팅에서도 입장이 중요하다고 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">상품은 고칠 수 있지만 집합 지점은 가치·의미와 맞닿아 있다</span><span class=\"why\">rallying points(집합 지점)를 다시 꺼내 ①과 연결하며, 입장은 물건이 아니라 가치라는 말로 글을 마무리해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Taking a stand is important</span></div><div class=\"k\"><span class=\"cw\">입장을 취하는 것은 중요하다</span></div></div><div class=\"rc\"><div class=\"e\">because you become a beacon</div><div class=\"k\">당신이 횃불이 되기 때문에</div></div><div class=\"rc\"><div class=\"e\">for those individuals</div><div class=\"k\">그 개개인들에게</div></div><div class=\"rc\"><div class=\"e\">who are your people, your tribe, and your audience.</div><div class=\"k\">당신의 사람들, 당신의 부족, 당신의 청중인.</div></div><div class=\"rnat\">입장을 취하는 것은 당신이 당신의 사람들, 당신의 부족, 당신의 청중인 그 개인들에게 횃불이 되기 때문에 중요하다.</div><div class=\"rst\">체육대회 날, 우리 반이 “끝까지 페어플레이!”라는 생각을 분명히 내세우면 그게 <b>횃불</b>이 돼요. = 지문의 입장을 취하는 것이 중요한 이유예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">① When you raise your viewpoint up like a flag,</div><div class=\"k\">① 당신이 당신의 견해를 깃발처럼 들 때,</div></div><div class=\"rc\"><div class=\"e\">people know where to find you;</div><div class=\"k\">사람들은 어디서 당신을 찾아야 할지 안다;</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">it becomes a rallying point</span>.</div><div class=\"k\"><span class=\"cw\">그것은 집합 지점이 된다</span>.</div></div><div class=\"rnat\">① 당신이 자신의 견해를 깃발처럼 들어 올릴 때, 사람들은 어디서 당신을 찾을지 안다; 그것은 집합 지점이 된다.</div><div class=\"rst\">① 그 생각을 반 깃발처럼 높이 들면 친구들이 “저기 모이면 되겠다” 하고 찾아와요. 지문 말대로 <b>집합 지점</b>이 돼요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">② Displaying your perspective</div><div class=\"k\">② 당신의 관점을 보여주는 것은</div></div><div class=\"rc\"><div class=\"e\">lets prospective (and current) customers know</div><div class=\"k\">장래의 (그리고 현재의) 고객들이 알게 한다</div></div><div class=\"rc\"><div class=\"e\">that you don’t just sell your products or services.</div><div class=\"k\">당신이 단지 물건과 서비스만 파는 것이 아니라는 것을.</div></div><div class=\"rnat\">② 당신의 관점을 보여주는 것은 장래의 (그리고 현재의) 고객들이 당신이 단지 제품이나 서비스만 파는 것이 아니라는 것을 알게 해 준다.</div><div class=\"rst\">② 우리 반 생각을 보여 주면, 다른 반 애들도 “쟤네는 이기려고만 하는 반이 아니구나” 하고 알아요. = 지문의 물건만 파는 게 아님을 알게 한다.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">③ The best marketing is never just about selling a product or service,</div><div class=\"k\">③ 최고의 마케팅은 결코 제품이나 서비스를 판매하는 것에 대한 것이 아니라,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but about taking a stand</span></div><div class=\"k\"><span class=\"cw\">입장을 취하는 것에 대한 것이다</span></div></div><div class=\"rc\"><div class=\"e\">— showing an audience</div><div class=\"k\">— 청중에게 보여주는 것</div></div><div class=\"rc\"><div class=\"e\">why they should believe in what you’re marketing</div><div class=\"k\">왜 그들(= 청중)이 당신이 마케팅하는 것을 믿어야 하는지</div></div><div class=\"rc\"><div class=\"e\">enough to want it at any cost,</div><div class=\"k\">그것(= 당신이 마케팅하는 것)을 어떠한 비용을 지불하더라도 원할 만큼 충분히,</div></div><div class=\"rc\"><div class=\"e\">simply because they agree with what you’re doing.</div><div class=\"k\">단지 그들이 당신이 하는 일에 동의하기 때문에.</div></div><div class=\"rnat\">③ 최고의 마케팅은 결코 제품이나 서비스를 파는 것에 대한 것이 아니라, 입장을 취하는 것, 즉 단순히 청중들이 당신이 하는 일에 동의하기 때문에 그들이 당신이 마케팅하는 것을 어떠한 비용을 치르더라도 원할 만큼 충분히 믿어야 하는지를 청중에게 보여주는 것에 대한 것이다.</div><div class=\"rst\">③ 제일 멋진 반 홍보도 상품 자랑이 아니라 <b>입장</b>을 보여 주는 거예요. 친구들이 그 생각에 동의해서 뭘 해서라도 함께하고 싶게요. = 지문의 최고의 마케팅.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">④ If you want to retain your existing customers,</div><div class=\"k\">④ 만약 당신이 기존의 고객을 유지하고 싶다면,</div></div><div class=\"rc\"><div class=\"e\">you need to create ways</div><div class=\"k\">당신은 방법을 만들어 낼 필요가 있다</div></div><div class=\"rc\"><div class=\"e\">that a customer can feel like another member of the team,</div><div class=\"k\">고객이 팀의 또 다른 구성원처럼 느낄 수 있는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">participating in the process of product development</span>.</div><div class=\"k\"><span class=\"cw\">상품 개발 과정에 참여하면서</span>.</div></div><div class=\"rnat\">④ 만약 당신이 기존의 고객을 유지하고 싶다면, 당신은 고객이 상품 개발 과정에 참여하면서, 팀의 또 다른 구성원처럼 느낄 수 있는 방법을 만들어 낼 필요가 있다.</div><div class=\"rst\">④ 갑자기 “간식 만들 때 친구들을 같이 참여시켜 계속 단골로 붙잡자”는 얘기가 나와요. 입장이 아니라 <b>상품 개발 참여</b>라 지문 흐름에서 튀어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">⑤ Products can be changed or adjusted</div><div class=\"k\">⑤ 상품은 바꾸거나 고칠 수 있다</div></div><div class=\"rc\"><div class=\"e\">if they aren’t functioning,</div><div class=\"k\">만약 그것들이 기능하지 않으면,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but rallying points align with</span></div><div class=\"k\"><span class=\"cw\">하지만 집합 지점은 ~와 같은 선상에 있다</span></div></div><div class=\"rc\"><div class=\"e\">the values and meaning behind what you do.</div><div class=\"k\">당신이 하는 것의 이면에 있는 가치 및 의미.</div></div><div class=\"rnat\">⑤ 상품은 기능하지 않으면 바꾸거나 고칠 수 있지만, 집합 지점은 당신이 하는 것의 이면에 있는 가치 및 의미와 같은 선상에 있다.</div><div class=\"rst\">⑤ 다시 깃발 얘기예요. 간식은 맛없으면 바꾸면 되지만, 반 깃발은 우리가 소중히 여기는 <b>가치</b>와 같이 가요. = 지문의 집합 지점과 가치.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"beacon\" data-m=\"횃불\"><b>beacon</b>횃불</button><button type=\"button\" class=\"wdb\" data-w=\"tribe\" data-m=\"부족, 집단\"><b>tribe</b>부족, 집단</button><button type=\"button\" class=\"wdb\" data-w=\"rallying point\" data-m=\"집합 지점\"><b>rallying point</b>집합 지점</button><button type=\"button\" class=\"wdb\" data-w=\"prospective\" data-m=\"장래의\"><b>prospective</b>장래의</button><button type=\"button\" class=\"wdb\" data-w=\"at any cost\" data-m=\"어떠한 비용을 치르더라도\"><b>at any cost</b>어떠한 비용을 치르더라도</button><button type=\"button\" class=\"wdb\" data-w=\"retain\" data-m=\"유지하다\"><b>retain</b>유지하다</button><button type=\"button\" class=\"wdb\" data-w=\"align\" data-m=\"같은 선상에 있다\"><b>align</b>같은 선상에 있다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>주인공의 선택 기준</b>과 <b>그 결과·결론</b>을 묶어서 찾으세요. 5번에서 그녀는 <b>효율·신뢰보다 겉모습(이상)</b>만 따졌고, 7번·9~10번에서 실제로 쓸 수 없는 문제가 생겨요. 그러니 교훈은 “이상보다 실용”이에요.</p><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 문제 행동 시작</span><div class=\"en\">However, she would ignore safety standards … if she did not think their proposals <mark>fit her ideals</mark>.</div><p class=\"ko\">하지만 그녀는 … 그들의 제안이 <mark>그녀의 이상에 맞는다고</mark> 생각하지 않으면 안전 기준을 무시하곤 했다.</p></div><div class=\"ck-via\"><i>▼</i><span>이상에 맞는지 = 예뻐 보이는지, 쓸모(효율·신뢰)는 뒷전</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">… <mark>her main concern was whether they looked attractive</mark>, <mark>not whether they were effective or reliable</mark>.</div><p class=\"ko\"><mark>그녀의 주된 관심사는 그것들(= 제품들)이 매력적으로 보이는지였다</mark>, <mark>그것들이 효율적이거나 신뢰할 만한지가 아니라</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6~7번</em>예쁜 자물쇠 → 1년 뒤 안 열려서 교체</span><span><em>8~10번</em>고급 변기 → 손잡이를 계속 눌러야 함, 수리도 안 됨</span></div><div class=\"ck-eq\">⇒ 두 장면의 공통점 = 겉모습(이상)만 보고 골랐더니 실제로는 못 씀</div></div><div class=\"ck-via\"><i>▼</i><span>However(하지만) + should(~해야 한다)로 글쓴이의 교훈이 나옴</span></div><div class=\"ck-step key\"><span class=\"lab\">13번 문장 · 결론 신호</span><div class=\"en\">However, when facing a problem, <mark>we should always have an open mind</mark>, and should consider all relevant information.</div><p class=\"ko\">하지만 문제에 직면하면, <mark>우리는 항상 열린 마음을 가져야 한다</mark>, 그리고 관련된 모든 정보를 고려해야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">Be Practical Rather Than Ideal 이상적이기보다는 실용적이어라<small>5번의 이상(겉모습) 대신 effective(효율적인)·reliable(신뢰할 만한) 것을 고르라는 교훈이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Equate the Inside with the Outside(내면과 외면을 동일시하라)</span><span class=\"why\">[반대] interior(인테리어)와 looked attractive(매력적으로 보이는지)를 보고 끌리는 함정이에요. 겉이 예쁘면 속도 좋다고 여긴 게 바로 그녀의 실수라서, 글의 교훈과 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Don't Give Up under Pressure(압박 속에서 포기하지 마라)</span><span class=\"why\">[지문에 없음] 그녀가 압박을 받거나 포기하는 장면은 없어요. 오히려 4번처럼 남의 말을 안 듣고 고집을 부린 게 문제예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Deal with the Problem Now(지금 당장 문제를 해결하라)</span><span class=\"why\">[지문에 없음] 13번은 문제를 빨리 풀라는 게 아니라 열린 마음으로 관련 정보를 다 고려하라는 말이에요. 시간 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Think about Short-Term Profits(단기 이익을 생각하라)</span><span class=\"why\">[지문에 없음] 이익·돈 이야기는 없어요. 7번의 a year later(1년 뒤)도 이익이 아니라 자물쇠 고장을 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Mary is</div><div class=\"k\">Mary는 ~이다</div></div><div class=\"rc\"><div class=\"e\">an interior designer.</div><div class=\"k\">인테리어 디자이너.</div></div><div class=\"rnat\">Mary는 인테리어 디자이너이다.</div><div class=\"rst\">인테리어를 좋아하는 우리 이모는 집 꾸미기 전문가예요. = 지문의 그녀가 인테리어 디자이너라는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">A friend of hers</div><div class=\"k\">그녀(= Mary)의 친구 중 한 명이</div></div><div class=\"rc\"><div class=\"e\">bought a house</div><div class=\"k\">집을 샀고</div></div><div class=\"rc\"><div class=\"e\">that needed to be renovated,</div><div class=\"k\">수리될 필요가 있는,</div></div><div class=\"rc\"><div class=\"e\">and had asked her</div><div class=\"k\">그리고 그녀(= Mary)에게 부탁했다</div></div><div class=\"rc\"><div class=\"e\">to do the interior decoration.</div><div class=\"k\">인테리어 장식을 해줄 것을.</div></div><div class=\"rnat\">그녀의 친구 중 한 명이 수리될 필요가 있는 집을 샀고, 그녀(Mary)에게 인테리어 장식을 해줄 것을 부탁했다.</div><div class=\"rst\">우리 가족이 고쳐야 할 낡은 집을 사서, 이모에게 집 꾸미기를 부탁했어요. 지문의 친구가 집 장식을 맡긴 장면이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Mary wanted</div><div class=\"k\">Mary는 원했다</div></div><div class=\"rc\"><div class=\"e\">the interior of the house</div><div class=\"k\">집의 인테리어가</div></div><div class=\"rc\"><div class=\"e\">to look attractive.</div><div class=\"k\">매력적으로 보이기를.</div></div><div class=\"rnat\">Mary는 집의 인테리어가 매력적으로 보이기를 원했다.</div><div class=\"rst\">이모는 무엇보다 집이 <b>예뻐 보이길</b> 바랐어요. = 지문의 인테리어가 매력적으로 보이기를 원했다.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">However, she would ignore safety standards</div><div class=\"k\">하지만 그녀는 안전 기준을 무시하곤 했고,</div></div><div class=\"rc\"><div class=\"e\">and would not listen to other contractors,</div><div class=\"k\">다른 계약자들의 말을 들으려고 하지 않았다,</div></div><div class=\"rc\"><div class=\"e\">if she did not think</div><div class=\"k\">만약 그녀가 생각하지 않으면</div></div><div class=\"rc ckc\"><div class=\"e\">their proposals <span class=\"cw\">fit her ideals</span>.</div><div class=\"k\">그들(= 계약자들)의 제안이 <span class=\"cw\">그녀의 이상에 맞는다고</span>.</div></div><div class=\"rnat\">하지만, 그녀는 안전 기준을 무시하곤 했고, 만약 그들(다른 계약자들)의 제안이 그녀의 이상에 맞다고 생각되지 않으면, 다른 계약자들의 말을 들으려고 하지 않았다.</div><div class=\"rst\"><b>그런데</b>(However) 이모는 안전 규칙도 무시하고, 다른 아저씨들 제안이 자기 <b>이상</b>에 안 맞으면 듣지도 않았어요. = 지문의 이상에 맞는지만 따지기.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">For all the home products</div><div class=\"k\">모든 가정용 제품들에 있어서</div></div><div class=\"rc\"><div class=\"e\">she picked for the house,</div><div class=\"k\">그녀가 집을 위해 고른,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">her main concern was whether they looked attractive</span>,</div><div class=\"k\"><span class=\"cw\">그녀의 주된 관심사는 그것들(= 제품들)이 매력적으로 보이는지였다</span>,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">not whether they were effective or reliable</span>.</div><div class=\"k\"><span class=\"cw\">그것들이 효율적이거나 신뢰할 만한지가 아니라</span>.</div></div><div class=\"rnat\">그녀가 집을 위해서 고른 모든 가정용 제품들에 있어서, 그녀의 주된 관심사는 그것들이 효율적인지 혹은 신뢰할 만한지가 아니라 그것들이 매력적으로 보이는지였다.</div><div class=\"rst\">물건을 고를 때도 “잘 작동해? 튼튼해?”가 아니라 오직 “<b>예뻐?</b>”만 봤어요. 지문 5번이 그녀의 선택 기준을 딱 보여 줘요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">She chose a fancy-looking door lock,</div><div class=\"k\">그녀는 화려해 보이는 문 자물쇠를 선택했다,</div></div><div class=\"rc\"><div class=\"e\">against the advice of the locksmith</div><div class=\"k\">자물쇠 업자의 조언에 반대해서</div></div><div class=\"rc\"><div class=\"e\">who did not think it was dependable.</div><div class=\"k\">그것(= 문 자물쇠)이 믿음직하다고 생각하지 않는.</div></div><div class=\"rnat\">그녀는 그것(문 자물쇠)이 믿음직하다고 생각하지 않는 자물쇠 업자의 조언에 반대해서, 화려해 보이는 문 자물쇠를 선택했다.</div><div class=\"rst\">열쇠 아저씨가 “이건 못 믿어요” 했는데도, 이모는 반짝반짝 예쁜 현관 자물쇠를 골랐어요. = 지문의 자물쇠 업자 조언을 무시한 장면.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">As a consequence,</div><div class=\"k\">그 결과,</div></div><div class=\"rc\"><div class=\"e\">a year later,</div><div class=\"k\">1년 뒤,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">it was necessary to change the door lock</span>,</div><div class=\"k\"><span class=\"cw\">문 자물쇠를 교체할 필요가 있었다</span>,</div></div><div class=\"rc\"><div class=\"e\">as there was difficulty opening the lock with the key.</div><div class=\"k\">열쇠로 자물쇠를 여는 데 어려움이 있었기 때문에.</div></div><div class=\"rnat\">그 결과, 1년 뒤 열쇠로 자물쇠를 여는 데 어려움이 있어서 문 자물쇠를 교체할 필요가 있었다.</div><div class=\"rst\"><b>그 결과</b>(As a consequence) 1년 뒤 열쇠로 문이 잘 안 열려서 자물쇠를 새로 바꿔야 했어요. 지문은 예쁜 것만 고른 대가를 보여 줘요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">In addition,</div><div class=\"k\">게다가</div></div><div class=\"rc\"><div class=\"e\">she picked toilets</div><div class=\"k\">그녀는 변기를 선택했다</div></div><div class=\"rc\"><div class=\"e\">in an upscale model and design.</div><div class=\"k\">고급품의 모델 및 디자인의.</div></div><div class=\"rnat\">게다가 그녀는 고급품의 모델 및 디자인의 변기를 선택했다.</div><div class=\"rst\"><b>게다가</b>(In addition) 화장실 변기도 비싸고 멋진 고급 모델로 골랐어요. = 지문의 고급 변기 선택.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">그러나</div></div><div class=\"rc\"><div class=\"e\">the homeowner later found out</div><div class=\"k\">집주인은 나중에 발견했다</div></div><div class=\"rc\"><div class=\"e\">that the toilet handle must be held down</div><div class=\"k\">변기 손잡이가 눌러져 있어야 한다는 것을</div></div><div class=\"rc\"><div class=\"e\">to complete the flushing action.</div><div class=\"k\">변기 물을 내리는 행위를 끝마치기 위해서는.</div></div><div class=\"rnat\">그러나 집주인은 나중에 변기 물을 내리는 행위를 끝마치기 위해서는 변기 손잡이가 눌러져 있어야 한다는 것을 발견했다.</div><div class=\"rst\"><b>그러나</b>(However) 물을 다 내리려면 손잡이를 계속 꾹 누르고 있어야 했어요. 지문 말처럼 집주인이 나중에야 알게 된 문제예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">The plumber was not able to adjust the lever</div><div class=\"k\">배관공은 레버를 조정할 수 없었다</div></div><div class=\"rc\"><div class=\"e\">inside the toilet tank</div><div class=\"k\">변기 수조 안에 있는</div></div><div class=\"rc\"><div class=\"e\">to fix the problem.</div><div class=\"k\">문제점을 해결하기 위해서.</div></div><div class=\"rnat\">배관공은 문제점을 해결하기 위해서 변기 수조 안에 있는 레버를 조정할 수 없었다.</div><div class=\"rst\">수리 아저씨가 와서 변기 속 레버를 만져 봐도 고칠 수가 없었어요. = 지문의 배관공도 문제를 못 고쳤다.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Mary prefers to think</div><div class=\"k\">Mary는 생각하는 것을 좋아한다</div></div><div class=\"rc\"><div class=\"e\">that she is always right.</div><div class=\"k\">그녀가 항상 옳다고.</div></div><div class=\"rnat\">Mary는 그녀가 항상 옳다고 생각하는 것을 좋아한다.</div><div class=\"rst\">이모는 “내가 항상 맞아”라고 생각하는 걸 좋아해요. = 지문 11번, 그녀는 자기가 늘 옳다고 여긴다.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">She chooses information</div><div class=\"k\">그녀는 정보를 선택한다</div></div><div class=\"rc\"><div class=\"e\">that fits her liking,</div><div class=\"k\">그녀의 취향에 맞는</div></div><div class=\"rc\"><div class=\"e\">and ignores other people’s recommendations.</div><div class=\"k\">그리고 다른 사람의 충고를 무시한다.</div></div><div class=\"rnat\">그녀는 그녀의 취향에 맞는 정보를 선택하고, 다른 사람의 충고를 무시한다.</div><div class=\"rst\">그래서 자기 <b>취향</b>(liking)에 맞는 정보만 고르고 남의 충고는 흘려들어요. = 지문 12번이 앞의 행동을 한 줄로 정리해요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">However, when facing a problem,</div><div class=\"k\">하지만 문제에 직면하면,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">we should always have an open mind</span>,</div><div class=\"k\"><span class=\"cw\">우리는 항상 열린 마음을 가져야 한다</span>,</div></div><div class=\"rc\"><div class=\"e\">and should consider all relevant information.</div><div class=\"k\">그리고 관련된 모든 정보를 고려해야 한다.</div></div><div class=\"rnat\">하지만 문제에 직면하면, 우리는 항상 열린 마음을 갖고, 관련된 모든 정보를 고려해야 한다.</div><div class=\"rst\"><b>하지만</b>(However) 문제가 생기면 우리는 마음을 열고, 쓸모 있는 정보를 다 따져 봐야 해요. 지문 13번이 글의 결론이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">We definitely should not let</div><div class=\"k\">우리는 절대로 ~하도록 내버려둬서는 안 된다</div></div><div class=\"rc\"><div class=\"e\">our prejudice and emotion</div><div class=\"k\">우리의 편견과 감정이</div></div><div class=\"rc\"><div class=\"e\">take the better part of us.</div><div class=\"k\">우리의 대부분을 취하도록(휘둘리도록).</div></div><div class=\"rnat\">우리는 절대로 우리의 편견과 감정이 우리의 대부분을 취하도록(편견과 감정에 휘둘리도록) 내버려둬서는 안 된다.</div><div class=\"rst\">“예쁜 게 최고야” 같은 고집과 기분에 끌려다니면 절대 안 돼요. 그래서 지문은 편견과 감정에 휘둘리지 말라고 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"renovate\" data-m=\"수리하다, 개조하다\"><b>renovate</b>수리하다, 개조하다</button><button type=\"button\" class=\"wdb\" data-w=\"safety standard\" data-m=\"안전 기준\"><b>safety standard</b>안전 기준</button><button type=\"button\" class=\"wdb\" data-w=\"effective\" data-m=\"효율적인\"><b>effective</b>효율적인</button><button type=\"button\" class=\"wdb\" data-w=\"reliable\" data-m=\"신뢰할 만한\"><b>reliable</b>신뢰할 만한</button><button type=\"button\" class=\"wdb\" data-w=\"fancy-looking\" data-m=\"화려해 보이는\"><b>fancy-looking</b>화려해 보이는</button><button type=\"button\" class=\"wdb\" data-w=\"locksmith\" data-m=\"자물쇠 업자\"><b>locksmith</b>자물쇠 업자</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 그녀가 <b>정보를 고르는 기준</b>이에요. 앞에서 내내 그녀는 <b>자기 이상·겉모습</b>에 맞는 것만 고르고 <b>남의 조언을 무시</b>했으니, 그 기준을 한 단어로 묶는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (12번)</span><div class=\"en\">She chooses information that fits her <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>,</span> and <mark>ignores other people’s recommendations</mark>.</div><p class=\"ko\">그녀는 자신의 ( ? )에 맞는 정보를 고르고, 다른 사람의 충고는 무시한다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 문장의 “맞는(fits)” = 4번의 “맞는(fit)”, 기준은 그녀 자신의 이상</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 같은 말 ①</span><div class=\"en\">… would not listen to other contractors, if she did not think their proposals <mark>fit her ideals</mark>.</div><p class=\"ko\">그들의 제안이 <mark>그녀의 이상에 맞는다고</mark> 생각하지 않으면, … 다른 계약자들의 말을 들으려고 하지 않았다.</p></div><div class=\"ck-via\"><i>▼</i><span>그녀의 이상 = 쓸모가 아니라 “예뻐 보이는지”, 곧 자기 마음에 드는지</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">… <mark>her main concern was whether they looked attractive</mark>, not whether they were effective or reliable.</div><p class=\"ko\"><mark>그녀의 주된 관심사는</mark> 그것들(= 제품들)이 효율적이거나 신뢰할 만한지가 아니라 <mark>매력적으로 보이는지였다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 문장 뒷부분 “남의 충고 무시”의 실제 장면</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 조언 무시의 예</span><div class=\"en\">She chose a fancy-looking door lock, <mark>against the advice of the locksmith</mark> who did not think it was dependable.</div><p class=\"ko\">그녀는 그것이 믿음직하다고 생각하지 않는 <mark>자물쇠 업자의 조언에 반대해서</mark> 화려해 보이는 문 자물쇠를 선택했다.</p></div><div class=\"ck-via\"><i>▼</i><span>자기가 늘 옳다고 여기니, 자기 마음에 드는 정보만 고름</span></div><div class=\"ck-step\"><span class=\"lab\">11번 문장 · 바로 앞 문장</span><div class=\"en\">Mary prefers to think <mark>that she is always right</mark>.</div><p class=\"ko\">Mary는 <mark>그녀가 항상 옳다고</mark> 생각하는 것을 좋아한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">liking 취향, 좋아하는 것<small>4번 ideals(이상)·5번 looked attractive(매력적으로 보이는지) = 그녀 자신의 취향이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">budget 예산</span><span class=\"why\">8번 upscale(고급품) 변기를 보고 “돈” 이야기라고 착각하기 쉬워요. 하지만 5번에서 그녀의 기준은 가격이 아니라 looked attractive(매력적으로 보이는지)였고, 예산을 따진 장면은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">future 미래</span><span class=\"why\">그녀는 오히려 앞날을 생각하지 않아서 7번처럼 1년 뒤 자물쇠를 바꿔야 했어요. 미래에 맞춰 골랐다면 효율·신뢰를 봤을 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">duty 의무</span><span class=\"why\">4번에서 그녀는 safety standards(안전 기준) 같은 지켜야 할 것을 무시했어요. 의무에 맞는 정보를 골랐다는 말과 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">religion 종교</span><span class=\"why\">종교 이야기는 지문 어디에도 없어요. 그녀의 기준은 4·5번의 이상, 곧 예뻐 보이는지였어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Mary is</div><div class=\"k\">Mary는 ~이다</div></div><div class=\"rc\"><div class=\"e\">an interior designer.</div><div class=\"k\">인테리어 디자이너.</div></div><div class=\"rnat\">Mary는 인테리어 디자이너이다.</div><div class=\"rst\">메리는 집 꾸미기 전문가예요. 우리가 방을 예쁘게 꾸미듯, 남의 집을 꾸미는 게 직업이에요. = 지문의 인테리어 디자이너예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">A friend of hers</div><div class=\"k\">그녀(= Mary)의 친구 중 한 명이</div></div><div class=\"rc\"><div class=\"e\">bought a house</div><div class=\"k\">집을 샀고</div></div><div class=\"rc\"><div class=\"e\">that needed to be renovated,</div><div class=\"k\">수리될 필요가 있는,</div></div><div class=\"rc\"><div class=\"e\">and had asked her</div><div class=\"k\">그리고 그녀(= Mary)에게 부탁했다</div></div><div class=\"rc\"><div class=\"e\">to do the interior decoration.</div><div class=\"k\">인테리어 장식을 해줄 것을.</div></div><div class=\"rnat\">그녀의 친구 중 한 명이 수리될 필요가 있는 집을 샀고, 그녀(Mary)에게 인테리어 장식을 해줄 것을 부탁했다.</div><div class=\"rst\">메리의 친구가 고쳐야 할 낡은 집을 사서, 메리에게 집 꾸미기를 부탁했어요. 지문의 친구가 집 장식을 맡긴 장면이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Mary wanted</div><div class=\"k\">Mary는 원했다</div></div><div class=\"rc\"><div class=\"e\">the interior of the house</div><div class=\"k\">집의 인테리어가</div></div><div class=\"rc\"><div class=\"e\">to look attractive.</div><div class=\"k\">매력적으로 보이기를.</div></div><div class=\"rnat\">Mary는 집의 인테리어가 매력적으로 보이기를 원했다.</div><div class=\"rst\">메리는 무엇보다 집이 <b>예뻐 보이길</b> 바랐어요. = 지문의 인테리어가 매력적으로 보이기를 원했다.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">However, she would ignore safety standards</div><div class=\"k\">하지만 그녀는 안전 기준을 무시하곤 했고,</div></div><div class=\"rc\"><div class=\"e\">and would not listen to other contractors,</div><div class=\"k\">다른 계약자들의 말을 들으려고 하지 않았다,</div></div><div class=\"rc\"><div class=\"e\">if she did not think</div><div class=\"k\">만약 그녀가 생각하지 않으면</div></div><div class=\"rc ckc\"><div class=\"e\">their proposals <span class=\"cw\">fit her ideals</span>.</div><div class=\"k\">그들(= 계약자들)의 제안이 <span class=\"cw\">그녀의 이상에 맞는다고</span>.</div></div><div class=\"rnat\">하지만, 그녀는 안전 기준을 무시하곤 했고, 만약 그들(다른 계약자들)의 제안이 그녀의 이상에 맞다고 생각되지 않으면, 다른 계약자들의 말을 들으려고 하지 않았다.</div><div class=\"rst\"><b>그런데</b>(However) 메리는 안전 규칙도 무시하고, 다른 업자들 제안이 자기 <b>이상</b>에 안 맞으면 듣지도 않았어요. = 지문의 이상에 맞는지만 따지기.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">For all the home   h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
