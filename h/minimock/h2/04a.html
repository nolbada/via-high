var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>Only(오직) ~ can(할 수 있다)</b>·<b>has a right</b>(권리가 있다) 같은 <b>강한 표현</b>에 있어요. 2번 ‘하지 말 것’과 4번 ‘해야 할 것’을 짝지어, 반복되는 <b>for themselves</b>(스스로)를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 하지 말아야 할 것</span><div class=\"en\">Teachers who prefer that children see beauty as they themselves do <mark>are not encouraging</mark> a sense of aesthetics in children.</div><p class=\"ko\">아이들이 교사 자신이 보는 대로 아름다움을 보기를 선호하는 교사들은 아이들의 미적 감각을 <mark>북돋우지 못하고 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Only(오직) ~ can(할 수 있다)으로 해야 할 것을 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">Only children <mark>who choose and evaluate for themselves</mark> can truly develop their own aesthetic taste.</div><p class=\"ko\">오직 <mark>스스로 고르고 평가하는</mark> 아이들만이 자기만의 미적 취향을 진정으로 발전시킬 수 있다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>아이마다 아름다움을 스스로 고를 권리가 있음</span><span><em>7번</em>어른의 판단이 없는 곳에서 미적 감각이 자람</span></div><div class=\"ck-eq\">⇒ 4번과 같은 말의 반복 = 어른 기준 대신 아이가 스스로 고르고 느끼게 두기</div></div><div class=\"ck-via\"><i>▼</i><span>어른의 판단을 빼라는 말로 결론을 한 번 더 굳혀요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 마지막 확인</span><div class=\"en\">Aesthetic development takes place in secure settings <mark>free of competition and adult judgment</mark>.</div><p class=\"ko\">미적 발달은 <mark>경쟁과 어른의 판단이 없는</mark> 안전한 환경에서 일어난다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">아동이 스스로 미적 감각을 기를 수 있게 해 주어야 한다.<small>4번 for themselves(스스로) + aesthetic taste(미적 취향)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">아동의 창의성을 평가할 때 미적인 감각도 포함해야 한다.</span><span class=\"why\">[반대] 4번에 evaluate(평가하다)가 나오지만 평가하는 사람은 아이 자신이에요. 7번은 오히려 adult judgment(어른의 판단)를 빼라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">아동의 정서 발달을 위해 미술 교육 시간을 늘려야 한다.</span><span class=\"why\">[지문에 없음] 수업 시간을 늘리자는 말은 한 번도 없어요. 지문이 문제 삼는 건 시간이 아니라 어른 기준을 강요하는 방식(2·3번)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">아동 미술 교육은 다른 과목과 통합적으로 실시해야 한다.</span><span class=\"why\">[지문에 없음] 5번에 literate(읽고 쓸 줄 아는)가 나오지만 ‘~이듯이’ 비교일 뿐, 과목을 합치자는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">아동 미술 교육은 감상보다 창작에 더 비중을 두어야 한다.</span><span class=\"why\">[지문에 없음] 감상과 창작을 비교하는 문장이 없어요. 지문의 대결은 어른의 기준 대 아이 스스로의 선택(4·6번)이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Children sometimes see and say things</div><div class=\"k\">아이들은 때때로 여러 가지를 보고 말한다</div></div><div class=\"rc\"><div class=\"e\">to please adults;</div><div class=\"k\">어른들을 즐겁게 하려고;</div></div><div class=\"rc\"><div class=\"e\">teachers must realize this</div><div class=\"k\">교사들은 이 사실을 이해해야 한다 (= 아이들이 어른을 기쁘게 하려고 보고 말한다는 것)</div></div><div class=\"rc\"><div class=\"e\">and the power it implies.</div><div class=\"k\">그리고 그것이 암시하는 힘을 (= 이 사실)</div></div><div class=\"rnat\">아이들은 어른의 마음에 들려고 보고 말할 때가 있다. 교사는 이 사실과, 그 사실이 뜻하는 힘을 알아야 한다.</div><div class=\"rst\">미술 시간에 아이들은 쌤이 좋아할 그림을 그리기도 해요. = 지문 1번, 아이들은 어른을 기쁘게 하려고 보고 말한다는 거예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">Teachers who prefer</div><div class=\"k\">선호하는 교사들은</div></div><div class=\"rc\"><div class=\"e\">that children see beauty</div><div class=\"k\">아이들이 아름다움을 보기를</div></div><div class=\"rc\"><div class=\"e\">as they themselves do</div><div class=\"k\">교사 자신들 (= 교사들)이 (아름다움을) 보는 대로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are not encouraging</span></div><div class=\"k\"><span class=\"cw\">북돋우지 못하고 있다</span></div></div><div class=\"rc\"><div class=\"e\">a sense of aesthetics in children.</div><div class=\"k\">아이들의 미적 감각을.</div></div><div class=\"rnat\">아이들이 자기(교사)가 보는 대로 아름다움을 보기를 바라는 교사는 아이의 미적 감각을 길러 주는 것이 아니다.</div><div class=\"rst\">쌤이 “하늘은 꼭 파랗게!”라고만 하면 아이 눈은 안 자라요. = 지문 2번, 자기처럼 보라는 교사는 미적 감각을 <b>북돋우지 못한다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">They are fostering</div><div class=\"k\">그들은 조장하고 있는 것이다 (= 앞 문장의 교사들)</div></div><div class=\"rc\"><div class=\"e\">uniformity and obedience.</div><div class=\"k\">획일성과 복종을.</div></div><div class=\"rnat\">그런 교사는 획일성과 복종을 조장하고 있는 것이다.</div><div class=\"rst\">그러면 반 그림이 전부 똑같아지고, 아이들은 시키는 대로만 해요. = 지문 3번의 <b>획일성</b>(uniformity)과 <b>복종</b>(obedience)이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Only children</div><div class=\"k\">오직 아이들만이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">who choose and evaluate for themselves</span></div><div class=\"k\"><span class=\"cw\">스스로 고르고 평가하는</span></div></div><div class=\"rc\"><div class=\"e\">can truly develop</div><div class=\"k\">진정으로 발전시킬 수 있다</div></div><div class=\"rc\"><div class=\"e\">their own aesthetic taste.</div><div class=\"k\">자기만의 미적 취향을.</div></div><div class=\"rnat\">스스로 고르고 스스로 평가하는 아이만이 자기만의 미적 취향을 진짜로 기를 수 있다.</div><div class=\"rst\">보라색 하늘을 직접 골라 보고 “난 이게 예뻐” 하는 아이만 자기 눈이 생겨요. = 지문 4번, <b>스스로</b>(for themselves) 고르고 평가하는 아이예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Just as becoming literate</div><div class=\"k\">글을 읽고 쓸 줄 알게 되는 것이 ~이듯이</div></div><div class=\"rc\"><div class=\"e\">is a basic goal of education,</div><div class=\"k\">교육의 기본 목표이듯이,</div></div><div class=\"rc\"><div class=\"e\">one of the key goals</div><div class=\"k\">핵심 목표 중 하나는</div></div><div class=\"rc\"><div class=\"e\">of all creative early childhood programs</div><div class=\"k\">모든 창의적인 유아기 프로그램의</div></div><div class=\"rc\"><div class=\"e\">is to help young children develop</div><div class=\"k\">어린아이들이 발전시키도록 돕는 것이다</div></div><div class=\"rc\"><div class=\"e\">the ability to speak freely</div><div class=\"k\">자유롭게 말할 수 있는 능력을</div></div><div class=\"rc\"><div class=\"e\">about their own attitudes, feelings, and ideas about art.</div><div class=\"k\">미술에 관한 자기 자신의 태도, 감정, 생각에 대해.</div></div><div class=\"rnat\">읽고 쓰는 능력이 교육의 기본 목표이듯, 창의적인 유아 프로그램의 핵심 목표 가운데 하나는 아이가 자신의 태도와 느낌, 예술에 대한 생각을 자유롭게 말할 수 있게 돕는 일이다.</div><div class=\"rst\">글을 읽고 쓰는 게 공부의 기본이듯, 내 느낌을 맘껏 말하는 것도 미술의 기본이에요. 지문 5번도 이걸 유아 교육의 핵심 목표라고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Each child has a right</div><div class=\"k\">각각의 아이는 권리를 가지고 있다</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">a personal choice</span></div><div class=\"k\"><span class=\"cw\">개인적인 선택에 대한</span></div></div><div class=\"rc\"><div class=\"e\">of beauty, joy, and wonder.</div><div class=\"k\">아름다움, 기쁨, 경이에 대한.</div></div><div class=\"rnat\">아이마다 아름다움과 기쁨, 경이로움을 스스로 선택할 권리가 있다.</div><div class=\"rst\">어떤 그림이 예쁜지는 아이마다 스스로 고를 <b>권리</b>(right)가 있어요. = 지문 6번의 ‘개인적인 선택’(personal choice)이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Aesthetic development</div><div class=\"k\">미적 발달은</div></div><div class=\"rc\"><div class=\"e\">takes place</div><div class=\"k\">일어난다</div></div><div class=\"rc\"><div class=\"e\">in secure settings</div><div class=\"k\">안전한 환경에서</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">free of competition and adult judgment</span>.</div><div class=\"k\"><span class=\"cw\">경쟁과 어른의 판단이 없는</span>.</div></div><div class=\"rnat\">미적 발달은 경쟁과 어른의 판단이 없는 안전한 환경에서 일어난다.</div><div class=\"rst\">그러니 1등 상도, 쌤의 채점도 없는 편한 미술 시간이 필요해요. = 지문 7번, 경쟁과 <b>어른의 판단이 없는</b> 곳에서 미적 감각이 자라요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"please\" data-m=\"기쁘게 하다\"><b>please</b>기쁘게 하다</button><button type=\"button\" class=\"wdb\" data-w=\"aesthetics\" data-m=\"미학, 미적 감각\"><b>aesthetics</b>미학, 미적 감각</button><button type=\"button\" class=\"wdb\" data-w=\"foster\" data-m=\"조장하다, 기르다\"><b>foster</b>조장하다, 기르다</button><button type=\"button\" class=\"wdb\" data-w=\"uniformity\" data-m=\"획일성\"><b>uniformity</b>획일성</button><button type=\"button\" class=\"wdb\" data-w=\"obedience\" data-m=\"순종, 복종\"><b>obedience</b>순종, 복종</button><button type=\"button\" class=\"wdb\" data-w=\"evaluate\" data-m=\"평가하다\"><b>evaluate</b>평가하다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">도표에서 <b>배수</b>(times 배) 표현은 단골 함정이에요. ‘10배 넘게’가 나오면 <b>작은 값 × 10</b>을 해서 큰 값과 직접 비교해 보세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번 문장: 여섯 도시 모두 대중교통 최고, 자전거 최저 → 도표와 같음</span><span><em>②</em>3번 문장: 토론토·몬트리올 걷기 같음, 대중교통 다름 → 도표와 같음</span><span><em>④</em>5번 문장: 오타와 대중교통 4위, 걷기·자전거 1위 → 도표와 같음</span><span><em>⑤</em>6번 문장: 에드먼턴이 세 항목 모두 캘거리보다 낮음 → 도표와 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 도표와 같아요 → 남은 ③의 배수를 직접 계산</div></div><div class=\"ck-via\"><i>▼</i><span>배수 표현은 숫자를 꼭 곱해서 확인</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">In Vancouver, the percentage of people who commuted by public transit was <mark>over ten times higher</mark> than that of people who commuted by cycling.</div><p class=\"ko\">밴쿠버에서는 대중교통으로 통근한 사람들의 비율이 자전거로 통근한 사람들의 비율보다 <mark>10배 넘게 더 높았다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>대중교통</em>20.4%</span><span><em>자전거</em>2.3%</span><span><em>2.3 × 10</em>23 → 실제 20.4는 23에 못 미침</span></div><div class=\"ck-eq\">⇒ 20.4 ÷ 2.3 ≈ 8.9배 → 10배가 넘지 않으니 도표와 다름</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">밴쿠버의 대중교통 비율은 자전거 비율의 10배가 넘었다(over ten times higher).<small>20.4%는 2.3%의 약 8.9배라서 10배에 못 미쳐요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">오타와는 대중교통 4위(ranked fourth), 걷기·자전거는 1위(in first place)였다.</span><span class=\"why\">5번과 같아요. 순위가 두 개라 헷갈리지만, 대중교통은 4위이고 walking or cycling(걷기 또는 자전거)은 1위가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">여섯 도시 모두 대중교통이 가장 높고(the highest) 자전거가 가장 낮았다(the lowest).</span><span class=\"why\">2번과 같아요. 여섯 도시 모두 public transit(대중교통)이 최고, cycling(자전거 타기)이 최저예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">토론토와 몬트리올의 걷기 비율은 같고(the same), 대중교통 비율은 달랐다(different).</span><span class=\"why\">3번과 같아요. 걷기 비율은 the same(같은)이고, even though(비록 ~일지라도) 뒤의 대중교통 비율은 different(다른)예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">에드먼턴은 세 항목 모두 캘거리보다 낮았다(lower).</span><span class=\"why\">6번과 같아요. 캘거리와 비교하면 에드먼턴은 세 가지 모두 lower percentages(더 낮은 비율)예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The above graph shows</div><div class=\"k\">위의 그래프는 보여 준다</div></div><div class=\"rc\"><div class=\"e\">the percentage of commuters</div><div class=\"k\">통근자의 비율을</div></div><div class=\"rc\"><div class=\"e\">using eco-friendly transportation</div><div class=\"k\">친환경 교통수단을 이용하는</div></div><div class=\"rc\"><div class=\"e\">to get to work</div><div class=\"k\">출근하기 위해</div></div><div class=\"rc\"><div class=\"e\">in six large cities in Canada in 2016.</div><div class=\"k\">2016년 캐나다의 여섯 개 대도시에서.</div></div><div class=\"rnat\">위 그래프는 2016년 캐나다의 여섯 개 대도시에서 출근할 때 친환경 교통수단을 이용한 통근자의 비율을 보여 준다.</div><div class=\"rst\">우리 학교 여섯 반의 친환경 등교 방법(버스·걷기·자전거)을 조사한 그래프라고 생각해요. = 지문의 캐나다 여섯 도시 통근 그래프예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">For all six given cities,</div><div class=\"k\">주어진 여섯 도시 모두에서,</div></div><div class=\"rc\"><div class=\"e\">the percentage of people</div><div class=\"k\">사람들의 비율이</div></div><div class=\"rc\"><div class=\"e\">who commuted by public transit</div><div class=\"k\">대중교통으로 통근한</div></div><div class=\"rc\"><div class=\"e\">was the highest,</div><div class=\"k\">가장 높았다,</div></div><div class=\"rc\"><div class=\"e\">while the percentage of people</div><div class=\"k\">반면 사람들의 비율은</div></div><div class=\"rc\"><div class=\"e\">who commuted by cycling</div><div class=\"k\">자전거로 통근한</div></div><div class=\"rc\"><div class=\"e\">was the lowest.</div><div class=\"k\">가장 낮았다.</div></div><div class=\"rnat\">① 주어진 여섯 도시 모두에서 대중교통으로 통근한 사람의 비율이 가장 높았고, 자전거로 통근한 사람의 비율이 가장 낮았다.</div><div class=\"rst\">여섯 반 모두 버스 타는 친구가 제일 많고 자전거가 제일 적어요. = 지문 2번, 대중교통이 <b>가장 높고</b> 자전거가 <b>가장 낮다</b>예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The percentages of people</div><div class=\"k\">사람들의 비율은</div></div><div class=\"rc\"><div class=\"e\">who commuted by walking</div><div class=\"k\">걸어서 통근한</div></div><div class=\"rc\"><div class=\"e\">were the same</div><div class=\"k\">같았다</div></div><div class=\"rc\"><div class=\"e\">in both Toronto and Montréal</div><div class=\"k\">토론토와 몬트리올 둘 다에서</div></div><div class=\"rc\"><div class=\"e\">even though the percentages of people</div><div class=\"k\">비록 사람들의 비율은 ~일지라도</div></div><div class=\"rc\"><div class=\"e\">who commuted by public transit</div><div class=\"k\">대중교통으로 통근한</div></div><div class=\"rc\"><div class=\"e\">in those two cities were different.</div><div class=\"k\">그 두 도시에서는 서로 달랐다.</div></div><div class=\"rnat\">② 걸어서 통근한 사람의 비율은 토론토와 몬트리올이 같았지만, 그 두 도시에서 대중교통으로 통근한 사람의 비율은 서로 달랐다.</div><div class=\"rst\">토론토반과 몬트리올반은 걷는 친구 비율이 같지만, 버스 비율은 서로 달라요. = 지문 3번 내용 그대로예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">In Vancouver,</div><div class=\"k\">밴쿠버에서는,</div></div><div class=\"rc\"><div class=\"e\">the percentage of people</div><div class=\"k\">사람들의 비율이</div></div><div class=\"rc ckc\"><div class=\"e\">who commuted <span class=\"cw\">by public transit</span></div><div class=\"k\"><span class=\"cw\">대중교통으로 통근한</span></div></div><div class=\"rc ckc\"><div class=\"e\">was <span class=\"cw\">over ten times higher</span></div><div class=\"k\"><span class=\"cw\">10배 넘게 더 높았다</span></div></div><div class=\"rc\"><div class=\"e\">than that of people</div><div class=\"k\">사람들의 그것보다 (= 비율)</div></div><div class=\"rc ckc\"><div class=\"e\">who commuted <span class=\"cw\">by cycling</span>.</div><div class=\"k\"><span class=\"cw\">자전거로 통근한</span>.</div></div><div class=\"rnat\">③ 밴쿠버에서 대중교통으로 통근한 사람의 비율은 자전거로 통근한 사람의 비율보다 10배 넘게 높았다.</div><div class=\"rst\">밴쿠버반 버스는 20.4%, 자전거는 2.3%예요. 2.3에 10을 곱하면 23인데 20.4는 못 미쳐요. 그래서 지문 4번의 <b>10배 넘게</b>는 틀려요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Even though Ottawa ranked fourth</div><div class=\"k\">비록 오타와는 4위를 차지했지만</div></div><div class=\"rc\"><div class=\"e\">in the percentage of people</div><div class=\"k\">사람들의 비율에서</div></div><div class=\"rc\"><div class=\"e\">who commuted by public transit,</div><div class=\"k\">대중교통으로 통근한,</div></div><div class=\"rc\"><div class=\"e\">this city was in first place</div><div class=\"k\">이 도시는 1위였다 (= 오타와)</div></div><div class=\"rc\"><div class=\"e\">in the percentage of people</div><div class=\"k\">사람들의 비율에서</div></div><div class=\"rc\"><div class=\"e\">who commuted by walking or cycling.</div><div class=\"k\">걷거나 자전거로 통근한.</div></div><div class=\"rnat\">④ 오타와는 대중교통 통근 비율에서 4위였지만, 걷기나 자전거 통근 비율에서는 1위였다.</div><div class=\"rst\">오타와반은 버스로는 4등이지만 걷기·자전거로는 1등이에요. = 지문 5번의 <b>4위</b>(ranked fourth)와 <b>1위</b>(in first place)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Compared with Calgary,</div><div class=\"k\">캘거리와 비교하면,</div></div><div class=\"rc\"><div class=\"e\">Edmonton recorded</div><div class=\"k\">에드먼턴은 기록했다</div></div><div class=\"rc\"><div class=\"e\">lower percentages</div><div class=\"k\">더 낮은 비율을</div></div><div class=\"rc\"><div class=\"e\">for all three given types</div><div class=\"k\">주어진 세 가지 유형 모두에서</div></div><div class=\"rc\"><div class=\"e\">of eco-friendly transportation.</div><div class=\"k\">친환경 교통수단의.</div></div><div class=\"rnat\">⑤ 캘거리와 비교하면 에드먼턴은 주어진 세 가지 친환경 교통수단 모두에서 더 낮은 비율을 기록했다.</div><div class=\"rst\">에드먼턴반은 캘거리반보다 버스·걷기·자전거 셋 다 낮아요. = 지문 6번의 ‘세 가지 모두 더 낮은 비율’이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"commuter\" data-m=\"통근자\"><b>commuter</b>통근자</button><button type=\"button\" class=\"wdb\" data-w=\"eco-friendly\" data-m=\"친환경적인\"><b>eco-friendly</b>친환경적인</button><button type=\"button\" class=\"wdb\" data-w=\"public transit\" data-m=\"대중교통\"><b>public transit</b>대중교통</button><button type=\"button\" class=\"wdb\" data-w=\"even though\" data-m=\"비록 ~일지라도\"><b>even though</b>비록 ~일지라도</button><button type=\"button\" class=\"wdb\" data-w=\"rank\" data-m=\"(순위를) 차지하다\"><b>rank</b>(순위를) 차지하다</button><button type=\"button\" class=\"wdb\" data-w=\"compared with\" data-m=\"~와 비교하여\"><b>compared with</b>~와 비교하여</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>The problem is</b>(문제는 ~이다)와 <b>have to</b>(~해야 한다) 뒤에 있어요. 1~4번 암벽 장면은 상황 설정이고, 6번 <b>whether</b>(~이든) 뒤의 ‘인생의 새 길’이 비유를 풀어 주는 열쇠예요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>1~3번</em>암벽 중간, 작은 바위 턱에 도착</span><span><em>4번</em>바위 턱 위에서는 어느 정도 안도감을 느낌</span></div><div class=\"ck-eq\">⇒ 상황 설정 = 지금 있는 곳은 편하고 안전하다</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 결론 신호</span><div class=\"en\"><mark>The problem is</mark> that to keep moving up, you have to <mark>abandon the security</mark> and reach for another hold.</div><p class=\"ko\"><mark>문제는 ~이다</mark>: 계속 올라가려면 당신은 <mark>그 안전을 포기해야 한다</mark>, 그리고 또 다른 잡을 곳을 향해 손을 뻗어야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>암벽 이야기가 인생 이야기의 비유라고 필자가 직접 밝혀요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">Letting go of that sense of security is the challenge, <mark>whether you are rock climbing</mark> or <mark>taking a new path in life</mark>.</div><p class=\"ko\"><mark>당신이 암벽을 오르고 있든</mark> <mark>인생에서 새로운 길을 가든</mark>, 그 안도감을 놓는 것이 도전이다.</p></div><div class=\"ck-via\"><i>▼</i><span>have to(~해야 한다)로 할 일을 한 줄로 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 요지 못 박기</span><div class=\"en\">You have to <mark>release your hold</mark> on the old and <mark>grab on to the new</mark>.</div><p class=\"ko\">당신은 옛것을 붙잡은 손을 <mark>놓아야 한다</mark>. 그리고 <mark>새로운 것을 붙잡아야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">현 상황에 안주하지 말고 계속 나아가야 한다.<small>5번 keep moving up(계속 올라가다) + 7번 release(놓다)·grab on to the new(새것을 붙잡다)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">등산할 때 안전 사고에 유의해야 한다.</span><span class=\"why\">[범위 좁음] 암벽은 6번에서 밝힌 대로 인생의 비유일 뿐이에요. 오히려 5번은 security(안전)를 버려야 올라간다고 해서 방향도 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">작은 기회도 소홀히 다루어서는 안 된다.</span><span class=\"why\">[지문에 없음] 3번 small ledge(작은 바위 턱)는 ‘작은 기회’가 아니라 머물러 있는 편한 자리예요. 지문은 거기서 떠나라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">기초가 튼튼해야 높은 이상을 달성할 수 있다.</span><span class=\"why\">[반대] 기초를 다지며 머물라는 게 아니라, 7번처럼 the old(옛것)를 놓고 the new(새것)를 붙잡으라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">자신의 약점을 깨달을 때 더욱 발전할 수 있다.</span><span class=\"why\">[지문에 없음] 4번 vulnerable(취약한)은 바람이 불면 위험하다는 뜻이지 내 약점을 깨닫는 이야기가 아니에요. 핵심은 안도감을 놓는 것(6번)이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Imagine</div><div class=\"k\">상상해 보라</div></div><div class=\"rc\"><div class=\"e\">you are climbing a rock wall</div><div class=\"k\">당신이 암벽을 오르고 있다고</div></div><div class=\"rc\"><div class=\"e\">in the mountains.</div><div class=\"k\">산에서.</div></div><div class=\"rnat\">산에서 암벽을 오르고 있다고 상상해 보라.</div><div class=\"rst\">수영장에서 처음 수영을 배운다고 상상해 봐요. = 지문 1번, 산에서 암벽을 오르고 있다고 상상하라는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">You are halfway up the wall,</div><div class=\"k\">당신은 벽의 중간쯤에 올라와 있다,</div></div><div class=\"rc\"><div class=\"e\">hundreds of feet above the valley floor.</div><div class=\"k\">계곡 바닥에서 수백 피트 위에.</div></div><div class=\"rnat\">벽의 중간쯤, 계곡 바닥에서 수백 피트 위에 있다.</div><div class=\"rst\">레인 중간쯤까지 와서, 발이 안 닿는 깊은 곳 위에 떠 있어요. = 지문 2번, 계곡 바닥에서 수백 피트 위 벽 중간이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">You have just come</div><div class=\"k\">당신은 방금 도착했다</div></div><div class=\"rc\"><div class=\"e\">to a small ledge.</div><div class=\"k\">작은 바위 턱에.</div></div><div class=\"rnat\">방금 작은 바위 턱에 이르렀다.</div><div class=\"rst\">마침 잡을 수 있는 레인 줄에 겨우 손이 닿았어요. = 지문 3번의 <b>작은 바위 턱</b>(small ledge)이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">You know</div><div class=\"k\">당신은 안다</div></div><div class=\"rc\"><div class=\"e\">you would be vulnerable</div><div class=\"k\">당신이 취약해질 것이라는 것을</div></div><div class=\"rc\"><div class=\"e\">if the wind picked up,</div><div class=\"k\">만약 바람이 강해진다면,</div></div><div class=\"rc\"><div class=\"e\">but on that ledge</div><div class=\"k\">하지만 그 바위 턱 위에서는</div></div><div class=\"rc\"><div class=\"e\">you have at least some sense of security.</div><div class=\"k\">적어도 어느 정도 안도감을 갖는다.</div></div><div class=\"rnat\">바람이 거세지면 위험해지리라는 것은 알지만, 그래도 그 바위 턱 위에서는 적어도 어느 정도 안도감을 느낀다.</div><div class=\"rst\">물살이 세지면 무섭지만, 줄을 잡고 있으니 그래도 마음이 놓여요. = 지문 4번의 <b>안도감</b>(sense of security)이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The problem is</span></div><div class=\"k\"><span class=\"cw\">문제는 ~이다</span></div></div><div class=\"rc\"><div class=\"e\">that to keep moving up,</div><div class=\"k\">계속 올라가려면,</div></div><div class=\"rc ckc\"><div class=\"e\">you have to <span class=\"cw\">abandon the security</span></div><div class=\"k\">당신은 <span class=\"cw\">그 안전을 포기해야 한다</span></div></div><div class=\"rc\"><div class=\"e\">and reach for another hold.</div><div class=\"k\">그리고 또 다른 잡을 곳을 향해 손을 뻗어야 한다.</div></div><div class=\"rnat\">문제는, 계속 올라가려면 그 안전을 버리고 다음 손잡이를 향해 손을 뻗어야 한다는 것이다.</div><div class=\"rst\"><b>문제는</b>(The problem is) 끝까지 가려면 그 줄을 놓고 다시 팔을 뻗어야 한다는 거예요. = 지문 5번, 안전을 버리고 다음 손잡이로 뻗기예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Letting go of that sense of security</div><div class=\"k\">그 안도감을 놓는 것이</div></div><div class=\"rc\"><div class=\"e\">is the challenge,</div><div class=\"k\">도전이다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">whether you are rock climbing</span></div><div class=\"k\"><span class=\"cw\">당신이 암벽을 오르고 있든</span></div></div><div class=\"rc ckc\"><div class=\"e\">or <span class=\"cw\">taking a new path in life</span>.</div><div class=\"k\"><span class=\"cw\">인생에서 새로운 길을 가든</span>.</div></div><div class=\"rnat\">그 안정감을 놓는 일이야말로 어려운 과제다 — 암벽을 오르는 중이든 인생에서 새 길을 택하는 중이든 마찬가지다.</div><div class=\"rst\">줄을 놓는 게 제일 어려워요. 수영이든 새 학교 생활이든 똑같아요. = 지문 6번, 암벽이든 <b>인생의 새 길</b>이든 마찬가지라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">You have to <span class=\"cw\">release your hold</span></div><div class=\"k\">당신은 당신의 붙잡은 것을 <span class=\"cw\">놓아야 한다</span></div></div><div class=\"rc\"><div class=\"e\">on the old</div><div class=\"k\">옛것에 대한</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">grab on to the new</span>.</div><div class=\"k\">그리고 <span class=\"cw\">새로운 것을 붙잡아야 한다</span>.</div></div><div class=\"rnat\">옛것을 붙잡은 손을 놓고 새것을 붙잡아야 한다.</div><div class=\"rst\">그러니 잡던 줄은 놓고 앞으로 헤엄쳐 나가야 해요. = 지문 7번, <b>옛것을 놓고 새것을 붙잡아라</b>가 이 글의 요지예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"halfway up\" data-m=\"중간쯤 올라간\"><b>halfway up</b>중간쯤 올라간</button><button type=\"button\" class=\"wdb\" data-w=\"ledge\" data-m=\"(절벽의) 바위 턱\"><b>ledge</b>(절벽의) 바위 턱</button><button type=\"button\" class=\"wdb\" data-w=\"vulnerable\" data-m=\"취약한\"><b>vulnerable</b>취약한</button><button type=\"button\" class=\"wdb\" data-w=\"sense of security\" data-m=\"안도감, 안정감\"><b>sense of security</b>안도감, 안정감</button><button type=\"button\" class=\"wdb\" data-w=\"abandon\" data-m=\"버리다, 포기하다\"><b>abandon</b>버리다, 포기하다</button><button type=\"button\" class=\"wdb\" data-w=\"grab on to\" data-m=\"~을 붙잡다\"><b>grab on to</b>~을 붙잡다</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">관계사 자리는 <b>뒤 절이 완전한지</b>부터 보세요. 주어·동사·목적어가 다 있으면 <b>which</b>(관계대명사)는 못 오고 <b>where</b>(관계부사)·<b>in which</b>(그 안에서)가 와요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (7번)</span><div class=\"en\">… a practice known as 'pure talk' <u>⑤ which</u> they debated spiritual and philosophical issues …</div><p class=\"ko\">‘청담’이라고 알려진 관행 ( ? ) 그들은 정신적이고 철학적인 문제들을 토론했다</p></div><div class=\"ck-via\"><i>▼</i><span>뒤 절에 빠진 자리가 있는지 하나씩 확인</span></div><div class=\"ck-step\"><span class=\"lab\">⑤ 뒤 절 살펴보기</span><div class=\"en\">they debated <mark>spiritual and philosophical issues</mark> before audiences</div><p class=\"ko\">그들은 <mark>정신적이고 철학적인 문제들을</mark> 청중들 앞에서 토론했다</p></div><div class=\"ck-via\"><i>▼</i><span>주어 they(그들) + 동사 debated(토론했다) + 목적어까지 완전 → 장소·상황의 관계부사 where(거기에서)</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">engaged in <mark>a practice</mark> known as 'pure talk' <mark>where they debated</mark> spiritual and philosophical issues</div><p class=\"ko\">'청담'이라고 알려진 <mark>관행</mark>에 참여했다, <mark>거기에서 그들은 토론했다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">관계대명사 which(~하는 것을/~인)와 관계부사 where(거기에서) 구별</p><p class=\"gr\">which(관계대명사) 뒤에는 주어나 목적어가 빠진 불완전한 절이 와요. 뒤 절이 다 갖춰진 완전한 절이면 where(거기에서) 또는 in which(그 안에서)를 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the park where we played soccer.</div><div class=\"ko\">여기는 우리가 축구를 했던 공원이다. (we played soccer가 완전하니 where)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is the park which we played soccer.</div><div class=\"ko\">뒤 절이 완전한데 which를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the park which we visited.</div><div class=\"ko\">여기는 우리가 방문했던 공원이다. (visited 뒤 목적어가 비었으니 which)</div></div><p class=\"gb\">지문 7번도 ⑤ 뒤 they debated spiritual and philosophical issues(그들은 정신적·철학적 문제들을 토론했다)가 완전한 절이에요. 그래서 a practice(관행) 뒤에는 which(관계대명사)가 아니라 where(거기에서)가 와야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">which → where (거기에서) / in which (그 안에서)<small>they debated(그들이 토론했다) 뒤에 목적어까지 다 있어 완전하니 which(관계대명사)는 못 써요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">was used to settle 해결하는 데 사용되었다</span><span class=\"why\">4번 주어 debate(토론)는 사람이 ‘사용하는’ 대상이라 was used(사용되었다)이고, 무엇을 하려고 쓰였는지 말하니 to settle(해결하기 위해)이 맞아요. 뒤에 religious controversies(종교적 논쟁)라는 목적어가 와서 동사원형 settle(해결하다)이 자연스러워요.</span><div class=\"gm wx\"><p class=\"gt\">be used to(~하는 데 사용되다) + 동사원형 / be used to(~에 익숙하다) + -ing(~하는 것)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This knife is used to cut bread.</div><div class=\"ko\">이 칼은 빵을 자르는 데 사용된다. (칼이 쓰이는 목적이라 to cut 자르는 데가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This knife is used to cutting bread.</div><div class=\"ko\">칼이 ‘빵 자르기에 익숙하다’는 말이 되어 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I am used to getting up early.</div><div class=\"ko\">나는 일찍 일어나는 데 익숙하다. (사람이 익숙한 것이라 getting 일어나는 것이 맞아요)</div></div><p class=\"gb\">지문 4번도 debate(토론)가 논쟁을 ‘해결하는 데 쓰인’ 것이라 was used to settle(해결하는 데 사용되었다)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">debate in the Senate was 원로원에서의 토론은 ~이었다</span><span class=\"why\">2번의 진짜 주어는 debate(토론) 하나예요. in the Senate(원로원에서의)는 꾸며 주는 말일 뿐이라 단수 동사 was(이었다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치: 전치사구(in ~ 같은 꾸밈말)는 빼고 진짜 주어로 판단</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The book on the desks is mine.</div><div class=\"ko\">책상들 위의 그 책은 내 것이다. (진짜 주어 book 책이 하나라서 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The book on the desks are mine.</div><div class=\"ko\">desks(책상들)에 끌려 are를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The students in my class are kind.</div><div class=\"ko\">우리 반 학생들은 친절하다. (주어 students 학생들이 여럿이라 are가 맞아요)</div></div><p class=\"gb\">지문 2번도 in the Senate(원로원에서의)를 빼면 debate(토론) was(이었다)라서 단수 동사가 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">would routinely make 일상적으로 설명하곤 했다</span><span class=\"why\">3번의 would(~하곤 했다)는 조동사예요. 중간에 부사 routinely(일상적으로)가 끼어 있어도 조동사 뒤에는 동사원형 make(만들다, 펼치다)가 와요.</span><div class=\"gm wx\"><p class=\"gt\">조동사 would(~하곤 했다) + (부사) + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>He would often play soccer after school.</div><div class=\"ko\">그는 방과 후에 자주 축구를 하곤 했다. (often 자주가 끼어도 play 동사원형이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He would often played soccer after school.</div><div class=\"ko\">would 뒤에 과거형 played를 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He would often playing soccer after school.</div><div class=\"ko\">would 뒤에 -ing인 playing을 써도 틀려요.</div></div><p class=\"gb\">지문 3번도 would(~하곤 했다)와 make(펼치다) 사이에 routinely(일상적으로)만 끼어 있어서 동사원형 make(펼치다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">offering prizes 상을 주면서</span><span class=\"why\">5번은 Indian kings sponsored(인도의 왕들은 후원했다)로 문장이 끝난 뒤 덧붙인 분사구문이에요. 상을 주는 사람이 왕들 자신이니 능동 offering(주면서)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">분사구문: 주어가 직접 하면 -ing(~하면서), 당하면 p.p.(~된 채)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She walked home, singing a song.</div><div class=\"ko\">그녀는 노래를 부르면서 집에 걸어갔다. (그녀가 직접 부르니 singing 부르면서가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She walked home, sung a song.</div><div class=\"ko\">그녀가 노래를 부르는 쪽인데 수동 sung을 써서 틀려요.</div></div><p class=\"gb\">지문 5번도 kings(왕들)가 직접 prizes(상)를 주는 것이라 능동 offering(주면서)이 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Debating is as old as language itself</div><div class=\"k\">토론은 언어 그 자체만큼이나 오래되었다</div></div><div class=\"rc\"><div class=\"e\">and has taken many forms</div><div class=\"k\">그리고 많은 형태를 띠어 왔다</div></div><div class=\"rc\"><div class=\"e\">throughout human history.</div><div class=\"k\">인간의 역사 내내.</div></div><div class=\"rnat\">토론은 언어 그 자체만큼이나 오래되었고 인류 역사 내내 여러 형태를 띠어 왔다.</div><div class=\"rst\">토론은 말이 생길 때부터 있었고 모양도 여러 가지였어요. 이 글은 나라별 토론 이야기를 쭉 늘어놓아요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In ancient Rome,</div><div class=\"k\">고대 로마에서,</div></div><div class=\"rc\"><div class=\"e\">debate in the Senate</div><div class=\"k\">원로원에서의 토론은</div></div><div class=\"rc\"><div class=\"e\">was critical</div><div class=\"k\">대단히 중요했다</div></div><div class=\"rc\"><div class=\"e\">to the conduct of civil society</div><div class=\"k\">시민 사회의 수행에</div></div><div class=\"rc\"><div class=\"e\">and the justice system.</div><div class=\"k\">그리고 사법제도에.</div></div><div class=\"rnat\">고대 로마에서 원로원의 토론은 시민 사회의 운영과 사법 제도에 매우 중요했다.</div><div class=\"rst\">고대 로마에서는 원로원 토론이 나라 운영에 아주 중요했어요. 주어는 <b>debate</b>(토론) 하나라 동사는 was(이었다)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In Greece,</div><div class=\"k\">그리스에서는,</div></div><div class=\"rc\"><div class=\"e\">advocates for policy changes</div><div class=\"k\">정책 변화에 대한 옹호자들이</div></div><div class=\"rc\"><div class=\"e\">would routinely make their cases</div><div class=\"k\">일상적으로 자신들의 주장을 설명하곤 했다</div></div><div class=\"rc\"><div class=\"e\">before citizen juries</div><div class=\"k\">시민 배심원단 앞에서</div></div><div class=\"rc\"><div class=\"e\">composed of hundreds of Athenians.</div><div class=\"k\">수백 명의 아테네 시민으로 구성된.</div></div><div class=\"rnat\">그리스에서는 정책 변화를 주장하는 이들이 수백 명의 아테네 시민으로 이루어진 배심원단 앞에서 늘 자기 논거를 펼치곤 했다.</div><div class=\"rst\">그리스에서는 시민 수백 명 앞에서 자기 주장을 펼치곤 했어요. <b>would</b>(~하곤 했다) 뒤라 동사원형 make(펼치다)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In India,</div><div class=\"k\">인도에서는,</div></div><div class=\"rc\"><div class=\"e\">debate was used to settle</div><div class=\"k\">토론은 해결하는 데 사용되었다</div></div><div class=\"rc\"><div class=\"e\">religious controversies</div><div class=\"k\">종교적인 찬반논란을</div></div><div class=\"rc\"><div class=\"e\">and was a very popular form of entertainment.</div><div class=\"k\">그리고 매우 인기 있는 오락의 한 형태였다.</div></div><div class=\"rnat\">인도에서 토론은 종교적 논쟁을 해결하는 데 쓰였고, 아주 인기 있는 오락 형태이기도 했다.</div><div class=\"rst\">인도에서는 토론으로 종교 다툼을 풀고, 구경거리로도 즐겼어요. 토론이 ‘쓰인’ 것이라 <b>was used to settle</b>(해결하는 데 사용되었다)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Indian kings sponsored</div><div class=\"k\">인도의 왕들은 후원했다</div></div><div class=\"rc\"><div class=\"e\">great debating contests,</div><div class=\"k\">대규모 토론 대회를,</div></div><div class=\"rc\"><div class=\"e\">offering prizes for the winners.</div><div class=\"k\">승리자들에게 상을 주면서.</div></div><div class=\"rnat\">인도의 왕들은 큰 토론 대회를 후원하며 우승자에게 상을 주었다.</div><div class=\"rst\">인도 왕들은 큰 토론 대회를 열고 우승자에게 상을 줬어요. 왕들이 직접 주니 능동 <b>offering</b>(주면서)이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">China has its own</div><div class=\"k\">중국은 자신만의 ~를 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">ancient and distinguished tradition</div><div class=\"k\">오래되고 훌륭한 전통을</div></div><div class=\"rc\"><div class=\"e\">of debate.</div><div class=\"k\">토론의.</div></div><div class=\"rnat\">중국에도 고유하고 오래된, 뛰어난 토론 전통이 있다.</div><div class=\"rst\">중국에도 오래되고 훌륭한 토론 전통이 있어요. 다음 7번이 그 전통이 무엇인지 보여 줘요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Beginning in the 2nd Century A.D.,</div><div class=\"k\">서기 2세기 초부터,</div></div><div class=\"rc\"><div class=\"e\">Taoist and Confucian scholars</div><div class=\"k\">도교와 유교의 학자들은</div></div><div class=\"rc ckc\"><div class=\"e\">engaged in <span class=\"cw\">a practice</span></div><div class=\"k\"><span class=\"cw\">관행에 참여했다</span></div></div><div class=\"rc\"><div class=\"e\">known as 'pure talk'</div><div class=\"k\">'청담'이라고 알려진</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">where they debated</span></div><div class=\"k\"><span class=\"cw\">거기에서 그들은 토론했다</span> (= 도교와 유교 학자들) ※ 문제지엔 which로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">spiritual and philosophical issues</span></div><div class=\"k\"><span class=\"cw\">정신적이고 철학적인 문제들을</span></div></div><div class=\"rc\"><div class=\"e\">before audiences</div><div class=\"k\">청중들 앞에서</div></div><div class=\"rc\"><div class=\"e\">in contests that might last</div><div class=\"k\">지속되기도 하는 대회에서</div></div><div class=\"rc\"><div class=\"e\">for a day and a night.</div><div class=\"k\">하루 낮과 밤 동안.</div></div><div class=\"rnat\">서기 2세기 초부터 도교와 유교의 학자들은 (하루 동안) 주야로 지속되기도 하는 대회에서 청중들 앞에서 정신적이고 철학적인 문제를 토론했던 '청담(淸談, pure talk)'이라고 알려진 관행에 참여했다.</div><div class=\"rst\">학자들이 청중 앞에서 밤새 토론한 ‘청담’이에요. 뒤 절이 완전하니 which(관계대명사)가 아니라 <b>where</b>(거기에서)가 맞아요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"critical to\" data-m=\"~에 매우 중요한\"><b>critical to</b>~에 매우 중요한</button><button type=\"button\" class=\"wdb\" data-w=\"advocate\" data-m=\"옹호자, 지지자\"><b>advocate</b>옹호자, 지지자</button><button type=\"button\" class=\"wdb\" data-w=\"settle\" data-m=\"해결하다\"><b>settle</b>해결하다</button><button type=\"button\" class=\"wdb\" data-w=\"controversies\" data-m=\"논쟁들 (controversy 논쟁)\"><b>controversies</b>논쟁들 (controversy 논쟁)</button><button type=\"button\" class=\"wdb\" data-w=\"sponsored\" data-m=\"후원했다 (sponsor 후원하다)\"><b>sponsored</b>후원했다 (sponsor 후원하다)</button><button type=\"button\" class=\"wdb\" data-w=\"distinguished\" data-m=\"저명한, 뛰어난\"><b>distinguished</b>저명한, 뛰어난</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. problems(문제)가 무엇이고 breakfast(아침 식사)가 왜 나왔는지 <b>앞의 2·3번</b>과 <b>뒤의 8번</b>에서 찾아, 글자 대신 속뜻으로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (4번)</span><div class=\"en\">I have consistently stuck to the habit of “<mark>eating my problems for breakfast</mark>.”</div><p class=\"ko\">나는 ‘<mark>아침 식사로 나의 문제를 먹는</mark>’ 습관을 꾸준히 고수해 왔다.</p></div><div class=\"ck-via\"><i>▼</i><span>어려운 일은 언제 하는 게 좋은지 먼저 알려 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 원칙</span><div class=\"en\">analytical tasks are best accomplished <mark>when our energy is high</mark></div><p class=\"ko\">분석적인 일은 <mark>우리의 에너지가 높을 때</mark> 가장 잘 수행된다</p></div><div class=\"ck-via\"><i>▼</i><span>필자는 아침에 에너지가 높다 → breakfast(아침 식사) = 기운이 가득한 아침</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\">I generally <mark>wake up energized</mark>.</div><p class=\"ko\">나는 보통 <mark>활기찬 상태로 일어난다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>6·7번의 미루던 힘든 일을 아침에 제일 먼저 끝낸다고 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결론</span><div class=\"en\">So for me, it’ll always be <mark>the first thing</mark> I get done.</div><p class=\"ko\">그래서 나에게는, 그것이 항상 내가 끝내는 <mark>첫 번째 일</mark>이 될 것이다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>my problems</em>6번의 불만 고객과 대화·불쾌한 이메일 = 하기 싫고 힘든 일</span><span><em>for breakfast</em>3번 활기찬 아침 = 에너지가 가득할 때</span><span><em>eating</em>8번 제일 먼저 끝내기 = 처리하기</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 에너지가 가득할 때 가장 힘든 일을 처리하기 → ③</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">handling the most demanding tasks while full of energy 에너지가 가득할 때 가장 힘든 일을 처리하기<small>problems(문제) = 힘든 일, breakfast(아침 식사) = 에너지가 높은 아침이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">thinking of breakfast as fuel for the day 아침 식사를 하루의 연료로 생각하기</span><span class=\"why\">breakfast(아침 식사)를 글자 그대로 진짜 밥으로 읽은 함정이에요. 진짜 밥을 먹는 이야기는 없고, 1번부터 에너지 수준에 맞춰 일을 배치하는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">trying to reflect on pleasant events from yesterday 어제의 즐거운 일을 되돌아보려 애쓰기</span><span class=\"why\">필자가 아침에 다루는 건 6번의 unpleasant email(불쾌한 이메일) 같은 힘든 일이에요. 어제의 즐거운 일을 떠올린다는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">spending the morning time improving my physical health 아침 시간을 신체 건강을 개선하는 데 쓰기</span><span class=\"why\">운동이나 건강 이야기는 없어요. 6번이 말하는 낭비는 몸이 아니라 emotional energy(감정적 에너지)예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">preparing at night to avoid decision making in the morning 아침에 결정을 피하려고 밤에 준비하기</span><span class=\"why\">밤에 미리 준비한다는 말은 없어요. 필자는 오히려 7번처럼 일을 피하지(avoiding) 말고 아침에 바로 처리하라고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Research in the science</div><div class=\"k\">과학에서의 연구는</div></div><div class=\"rc\"><div class=\"e\">of peak performance and motivation</div><div class=\"k\">최고의 수행과 동기 부여에 관한</div></div><div class=\"rc\"><div class=\"e\">points to the fact</div><div class=\"k\">사실을 가리킨다</div></div><div class=\"rc\"><div class=\"e\">that different tasks</div><div class=\"k\">서로 다른 일들이</div></div><div class=\"rc\"><div class=\"e\">should ideally be matched</div><div class=\"k\">이상적으로 맞춰져야 한다는</div></div><div class=\"rc\"><div class=\"e\">to our energy level.</div><div class=\"k\">우리의 에너지 수준에.</div></div><div class=\"rnat\">최고의 수행과 동기에 관한 연구는, 서로 다른 과제가 우리의 에너지 수준에 맞춰져야 한다는 사실을 가리킨다.</div><div class=\"rst\">숙제도 내 기운에 맞춰 순서를 정하면 좋아요. = 지문 1번, 일을 <b>에너지 수준</b>(energy level)에 맞춰야 한다는 연구예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">analytical tasks are best accomplished</div><div class=\"k\">분석적인 일은 가장 잘 수행된다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">when our energy is high</span></div><div class=\"k\"><span class=\"cw\">우리의 에너지가 높을 때</span></div></div><div class=\"rc\"><div class=\"e\">and we are free from distractions</div><div class=\"k\">그리고 방해 요소가 없을 때</div></div><div class=\"rc\"><div class=\"e\">and able to focus.</div><div class=\"k\">집중할 수 있을 때.</div></div><div class=\"rnat\">예를 들어 분석이 필요한 일은 에너지가 높고, 방해받지 않으며 집중할 수 있을 때 가장 잘 해낼 수 있다.</div><div class=\"rst\">제일 머리 쓰는 수학 숙제는 기운이 넘치고 조용할 때 해야 잘 풀려요. = 지문 2번, 분석적인 일은 <b>에너지가 높을 때</b> 잘 된다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">I generally <span class=\"cw\">wake up energized</span>.</div><div class=\"k\">나는 보통 <span class=\"cw\">활기찬 상태로 일어난다</span>.</div></div><div class=\"rnat\">나는 대체로 활기찬 상태로 잠에서 깬다.</div><div class=\"rst\">나는 아침에 눈뜨자마자 쌩쌩해요. = 지문 3번, 필자는 <b>활기찬 상태로 일어난다</b>(wake up energized)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Over the years,</div><div class=\"k\">몇 년 동안,</div></div><div class=\"rc\"><div class=\"e\">I have consistently stuck to the habit</div><div class=\"k\">나는 그 습관을 꾸준히 고수해 왔다</div></div><div class=\"rc ckc\"><div class=\"e\">of “<span class=\"cw\">eating my problems for breakfast</span>.”</div><div class=\"k\">'<span class=\"cw\">아침 식사로 나의 문제를 먹는</span>'.</div></div><div class=\"rnat\">몇 년 동안 나는 '아침 식사로 나의 문제를 먹는' 습관을 꾸준히 지켜 왔다.</div><div class=\"rst\">그래서 나는 몇 년째 ‘아침밥으로 문제 먹기’ 습관을 지켜요. = 지문 4번의 밑줄, 문제는 힘든 일, 아침밥은 쌩쌩한 아침이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">I’m someone</div><div class=\"k\">나는 사람이다</div></div><div class=\"rc\"><div class=\"e\">who tends to overthink</div><div class=\"k\">너무 많이 생각하는 경향이 있는</div></div><div class=\"rc\"><div class=\"e\">different scenarios and conversations</div><div class=\"k\">다양한 시나리오와 대화를</div></div><div class=\"rc\"><div class=\"e\">that haven’t happened yet.</div><div class=\"k\">아직 일어나지 않은.</div></div><div class=\"rnat\">나는 아직 일어나지 않은 다양한 시나리오와 대화를 너무 많이 생각하는 경향이 있는 사람이다.</div><div class=\"rst\">나는 “쌤이 혼내면 어떡하지?” 하고 아직 안 일어난 일을 너무 많이 상상해요. = 지문 5번, 일어나지 않은 장면을 지나치게 생각하는 필자예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">When I procrastinate</div><div class=\"k\">내가 미룰 때</div></div><div class=\"rc\"><div class=\"e\">on talking with an unhappy client</div><div class=\"k\">불만족스러워하는 고객과 이야기하는 것을</div></div><div class=\"rc\"><div class=\"e\">or dealing with an unpleasant email,</div><div class=\"k\">또는 불쾌한 이메일을 처리하는 것을,</div></div><div class=\"rc\"><div class=\"e\">I find</div><div class=\"k\">나는 생각한다</div></div><div class=\"rc\"><div class=\"e\">I waste too much emotional energy</div><div class=\"k\">내가 너무 많은 감정적 에너지를 낭비한다고</div></div><div class=\"rc\"><div class=\"e\">during the day.</div><div class=\"k\">낮 동안.</div></div><div class=\"rnat\">불만족스러워하는 고객과 이야기하거나 불쾌한 이메일을 처리하는 것을 미룰 때, 나는 낮 동안 너무 많은 감정적 에너지를 낭비한다고 느낀다.</div><div class=\"rst\">쌤께 사과드리기를 미루면 하루 종일 마음이 무거워요. = 지문 6번, 힘든 대화를 미루면 감정 에너지를 낭비한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">It’s as if the task hangs over my head,</div><div class=\"k\">마치 그 일이 내 머리 위에 걸려 있는 것 같다 (= 미룬 일),</div></div><div class=\"rc\"><div class=\"e\">and I’ll spend more time</div><div class=\"k\">그리고 나는 더 많은 시간을 쓸 것이다</div></div><div class=\"rc\"><div class=\"e\">worrying about it, talking about it, and avoiding it,</div><div class=\"k\">그것에 대해 걱정하고, 이야기하고, 피하는 데,</div></div><div class=\"rc\"><div class=\"e\">than it would actually take</div><div class=\"k\">실제로 걸리는 시간보다</div></div><div class=\"rc\"><div class=\"e\">to just take care of it.</div><div class=\"k\">그냥 그것을 처리하는 데.</div></div><div class=\"rnat\">그 일이 머리 위에 걸려 있는 것 같아서, 그냥 처리하는 데 드는 시간보다 걱정하고 이야기하고 피하는 데 더 많은 시간을 쓰게 된다.</div><div class=\"rst\">미룬 일이 머리 위에 둥둥 떠 있어서, 그냥 하면 5분인데 걱정만 한 시간 해요. = 지문 7번, 처리보다 피하는 데 더 시간을 쓴다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">So for me,</div><div class=\"k\">그래서 나에게는,</div></div><div class=\"rc ckc\"><div class=\"e\">it’ll always be <span class=\"cw\">the first thing</span></div><div class=\"k\">그것은 항상 <span class=\"cw\">첫 번째 일</span>이 될 것이다 (= 힘든 일)</div></div><div class=\"rc\"><div class=\"e\">I get done.</div><div class=\"k\">내가 끝내는.</div></div><div class=\"rnat\">그래서 나에게 그것은 언제나 가장 먼저 끝내는 일이다.</div><div class=\"rst\">그래서 나는 그 힘든 일을 아침에 <b>제일 먼저</b>(the first thing) 끝내요. = 밑줄의 속뜻 ‘기운 넘칠 때 힘든 일 처리하기’예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">If you know</div><div class=\"k\">만약 당신이 안다면</div></div><div class=\"rc\"><div class=\"e\">you are not a morning person,</div><div class=\"k\">당신이 아침형 인간이 아니라는 것을,</div></div><div class=\"rc\"><div class=\"e\">be strategic about scheduling</div><div class=\"k\">일정을 짜는 것에 대해 전략적이 되라</div></div><div class=\"rc\"><div class=\"e\">your difficult work later in the day.</div><div class=\"k\">당신의 어려운 일을 하루 중 더 늦은 시간으로.</div></div><div class=\"rnat\">자신이 아침형 인간이 아니라는 것을 안다면, 어려운 일을 하루 중 늦은 시간으로 잡는 전략을 쓰라.</div><div class=\"rst\">아침잠이 많은 친구라면, 어려운 숙제를 기운 나는 저녁에 하면 돼요. = 지문 9번, 아침형이 아니면 어려운 일을 늦게 잡으라는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"peak performance\" data-m=\"최고의 수행\"><b>peak performance</b>최고의 수행</button><button type=\"button\" class=\"wdb\" data-w=\"analytical tasks\" data-m=\"분석적인 일\"><b>analytical tasks</b>분석적인 일</button><button type=\"button\" class=\"wdb\" data-w=\"energized\" data-m=\"활기찬\"><b>energized</b>활기찬</button><button type=\"button\" class=\"wdb\" data-w=\"stick to\" data-m=\"~을 고수하다\"><b>stick to</b>~을 고수하다</button><button type=\"button\" class=\"wdb\" data-w=\"overthink\" data-m=\"지나치게 생각하다\"><b>overthink</b>지나치게 생각하다</button><button type=\"button\" class=\"wdb\" data-w=\"procrastinate\" data-m=\"미루다\"><b>procrastinate</b>미루다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>not to provide</b>(제공하려는 것이 아니라) 뒤, 즉 유머가 <b>신경 쓰지 않는 것</b>이에요. 2번 <b>real or fictional</b>(진짜인지 허구인지)·<b>true or false</b>(참인지 거짓인지)를 한 단어로 묶으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (6번)</span><div class=\"en\">The creator of humour is putting ideas into people’s heads for the pleasure those ideas will bring, <mark>not to provide</mark> <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> information.</span></div><p class=\"ko\">즐거움을 위해 생각을 심는 것이지, ( ? ) 정보를 제공하려는 것이 아니다</p></div><div class=\"ck-via\"><i>▼</i><span>유머가 따지지 않는 것 = 사실인지 아닌지</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">As long as something is funny, we are for the moment not concerned with whether it is <mark>real or fictional</mark>, <mark>true or false</mark>.</div><p class=\"ko\">어떤 것이 재미있는 한, 우리는 잠시 동안 그것이 <mark>진짜인지 허구인지</mark>, <mark>참인지 거짓인지</mark> 관심을 갖지 않는다.</p></div><div class=\"ck-via\"><i>▼</i><span>2번 때문에(This is why 이것이 ~한 이유) 꾸며 내도 허락해 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 지어내도 봐줌</span><div class=\"en\">or even by <mark>making up a few details</mark>, we are happy to grant them comic licence</div><p class=\"ko\">또는 심지어 <mark>몇 가지 세부 사항을 지어내어</mark>, 우리는 기꺼이 그들에게 희극적 허용을 허락한다</p></div><div class=\"ck-via\"><i>▼</i><span>정확하게 고치려는 사람이 오히려 방해꾼이 되는 예시</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 사실 바로잡기는 핀잔</span><div class=\"en\">someone listening to a funny story who <mark>tries to correct the teller</mark> … will probably be told by the other listeners to stop interrupting.</div><p class=\"ko\"><mark>이야기하는 사람을 바로잡으려고 하는</mark> 사람은 … 다른 듣는 사람들에게서 방해하지 말라는 말을 아마 듣게 될 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">accurate 정확한<small>true or false(참인지 거짓인지)를 따지지 않으니, 유머의 목적은 정확한 정보가 아니에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">detailed 자세한</span><span class=\"why\">4번 details(세부 사항)를 보고 고르기 쉬운 함정이에요. 유머는 세부를 지어내도(making up) 봐주는 것이지, 자세한지가 아니라 사실인지를 따지지 않는다는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">useful 유용한</span><span class=\"why\">쓸모 있는지는 지문에서 한 번도 따지지 않아요. 2번이 묻는 건 true or false(참인지 거짓인지)예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">additional 추가적인</span><span class=\"why\">4번 extra laughs(추가적인 웃음)에서 떠올린 함정이에요. 이야기꾼은 오히려 세부를 더 붙이니, 추가 정보가 목적이 아니라는 말은 흐름과 안 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">alternative 대안적인</span><span class=\"why\">다른 방법이나 대안을 주는 이야기는 없어요. 5번 스파게티 예시도 사실을 바로잡는 문제일 뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Humour involves</div><div class=\"k\">유머는 수반한다</div></div><div class=\"rc\"><div class=\"e\">not just practical disengagement</div><div class=\"k\">단지 실제적인 자유(이탈)뿐 아니라</div></div><div class=\"rc\"><div class=\"e\">but cognitive disengagement.</div><div class=\"k\">인식의 자유(이탈)도.</div></div><div class=\"rnat\">유머는 실제적인 자유(이탈)뿐 아니라 인식의 자유(이탈)도 수반한다.</div><div class=\"rst\">급식실에서 친구가 웃긴 얘기를 하면, 우리는 잠깐 현실 생각을 내려놔요. = 지문 1번, 유머는 생각에서도 한 발 떨어지게 한다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">As long as something is funny,</div><div class=\"k\">어떤 것이 재미있는 한,</div></div><div class=\"rc\"><div class=\"e\">we are for the moment not concerned with</div><div class=\"k\">우리는 잠시 동안 관심을 갖지 않는다</div></div><div class=\"rc ckc\"><div class=\"e\">whether it is <span class=\"cw\">real or fictional</span>,</div><div class=\"k\">그것이 <span class=\"cw\">진짜인지 허구인지</span>, (= 재미있는 것)</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">true or false</span>.</div><div class=\"k\"><span class=\"cw\">참인지 거짓인지</span>.</div></div><div class=\"rnat\">무언가가 웃기기만 하면, 우리는 그 순간 그것이 실제인지 허구인지, 참인지 거짓인지에 신경 쓰지 않는다.</div><div class=\"rst\">얘기가 웃기기만 하면 진짜였는지 지어낸 건지 아무도 안 따져요. = 지문 2번, <b>진짜인지 허구인지, 참인지 거짓인지</b> 신경 안 쓴다는 거예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This is why</div><div class=\"k\">이것이 ~한 이유이다 (= 앞 문장의 내용)</div></div><div class=\"rc\"><div class=\"e\">we give considerable leeway</div><div class=\"k\">우리가 상당한 여지를 주는</div></div><div class=\"rc\"><div class=\"e\">to people telling funny stories.</div><div class=\"k\">재미있는 이야기를 하는 사람들에게.</div></div><div class=\"rnat\">그래서 우리는 재미있는 이야기를 하는 사람에게 상당한 여지를 준다.</div><div class=\"rst\"><b>그래서</b>(This is why 이것이 ~한 이유) 웃긴 얘기를 하는 친구에게는 우리가 꽤 너그러워요. = 지문 3번의 ‘상당한 여지’(leeway)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">If they are getting extra laughs</div><div class=\"k\">만약 그들이 추가적인 웃음을 얻고 있다면 (= 재미있는 이야기를 하는 사람들)</div></div><div class=\"rc\"><div class=\"e\">by exaggerating the silliness of a situation</div><div class=\"k\">상황의 우스꽝스러움을 과장하여</div></div><div class=\"rc\"><div class=\"e\">or even by making up a few details,</div><div class=\"k\">또는 심지어 몇 가지 세부 사항을 지어내어,</div></div><div class=\"rc\"><div class=\"e\">we are happy to grant them</div><div class=\"k\">우리는 기꺼이 그들에게 허락한다</div></div><div class=\"rc\"><div class=\"e\">comic licence,</div><div class=\"k\">희극적 허용을,</div></div><div class=\"rc\"><div class=\"e\">a kind of poetic licence.</div><div class=\"k\">일종의 시적 허용인.</div></div><div class=\"rnat\">그들이 상황의 우스꽝스러움을 과장하거나 심지어 세부를 몇 가지 지어내서 웃음을 더 얻는다 해도, 우리는 기꺼이 일종의 시적 허용과 같은 희극적 허용을 인정해 준다.</div><div class=\"rst\">친구가 “식판이 하늘로 날아갔어!”처럼 부풀려도 다 웃어 줘요. = 지문 4번, 과장하거나 <b>지어내도</b> 희극적 허용을 준다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Indeed,</div><div class=\"k\">실제로,</div></div><div class=\"rc\"><div class=\"e\">someone listening to a funny story</div><div class=\"k\">재미있는 이야기를 듣고 있는 누군가가</div></div><div class=\"rc ckc\"><div class=\"e\">who <span class=\"cw\">tries to correct the teller</span></div><div class=\"k\"><span class=\"cw\">이야기하는 사람을 바로잡으려고 하는</span></div></div><div class=\"rc\"><div class=\"e\">— ‘No, he didn’t spill the spaghetti</div><div class=\"k\">— '아니야, 그는 스파게티를 쏟지 않았어 (= 이야기 속 인물)</div></div><div class=\"rc\"><div class=\"e\">on the keyboard and the monitor,</div><div class=\"k\">키보드와 모니터에,</div></div><div class=\"rc\"><div class=\"e\">just on the keyboard’ —</div><div class=\"k\">그냥 키보드에만 쏟았어' —</div></div><div class=\"rc\"><div class=\"e\">will probably be told</div><div class=\"k\">아마 듣게 될 것이다</div></div><div class=\"rc\"><div class=\"e\">by the other listeners</div><div class=\"k\">다른 듣는 사람들에게서</div></div><div class=\"rc\"><div class=\"e\">to stop interrupting.</div><div class=\"k\">방해하지 말라고.</div></div><div class=\"rnat\">실제로 재미난 이야기를 듣다가 '아니야, 그는 스파게티를 키보드와 모니터에 쏟지 않았고, 그냥 키보드에만 쏟았어'라며 화자를 바로잡으려 드는 사람은, 다른 듣는 사람들에게서 방해하지 말라는 말을 들을 것이다.</div><div class=\"rst\">그때 “아니야, 식판은 바닥에만 떨어졌어” 하고 고치면 다들 “끼어들지 마!” 해요. = 지문 5번, <b>바로잡으려는</b> 사람이 핀잔을 듣는 장면이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The creator of humour</div><div class=\"k\">유머를 만드는 사람은</div></div><div class=\"rc\"><div class=\"e\">is putting ideas into people’s heads</div><div class=\"k\">사람들의 머릿속에 생각을 심고 있다</div></div><div class=\"rc\"><div class=\"e\">for the pleasure those ideas will bring,</div><div class=\"k\">그 생각들이 가져다줄 즐거움을 위해 (= 유머가 심는 생각들),</div></div><div class=\"rc ckc\"><div class=\"e\">not to provide <span class=\"cw\">accurate</span> information.</div><div class=\"k\"><span class=\"cw\">정확한 정보를</span> 제공하려는 것이 아니라. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">유머를 만드는 사람은 그 생각들이 가져다줄 즐거움을 위해 사람들 머릿속에 생각을 심는 것이지, ______ 정보를 주려는 것이 아니다.</div><div class=\"rst\">웃긴 얘기는 웃음을 주려는 거지, <b>정확한</b>(accurate) 사실을 알려 주려는 게 아니에요. 그래서 빈칸은 accurate(정확한)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"disengagement\" data-m=\"거리 두기, 이탈\"><b>disengagement</b>거리 두기, 이탈</button><button type=\"button\" class=\"wdb\" data-w=\"cognitive\" data-m=\"인식의, 인지의\"><b>cognitive</b>인식의, 인지의</button><button type=\"button\" class=\"wdb\" data-w=\"concerned with\" data-m=\"~에 신경 쓰는 (be concerned with ~에 신경 쓰다)\"><b>concerned with</b>~에 신경 쓰는 (be concerned with ~에 신경 쓰다)</button><button type=\"button\" class=\"wdb\" data-w=\"fictional\" data-m=\"허구의\"><b>fictional</b>허구의</button><button type=\"button\" class=\"wdb\" data-w=\"leeway\" data-m=\"여지, 재량\"><b>leeway</b>여지, 재량</button><button type=\"button\" class=\"wdb\" data-w=\"exaggerating\" data-m=\"과장하는 것 (exaggerate 과장하다)\"><b>exaggerating</b>과장하는 것 (exaggerate 과장하다)</button></div>"};

  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';

  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}

function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}

  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
