<title>고2 미니모의고사 2회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}
.ch.open .ct{display:block}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}
.sc .ce{font-size:18px;line-height:1.5;font-weight:800;color:#c62828}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

.wc{padding:14px 0;border-bottom:1px solid var(--line)}

function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function dwToast(m){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1800);}
function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}

  else{let pr=null;try{pr=WN.del(head,'미니모고');}catch(err){}
    if(pr&&pr.then)pr.then(function(r){if(r&&r.removed===false&&r.reason==='late'){S.dw[head]=1;save();dwMark(head,true);dwToast('이미 쌓인 단어라 뺄 수 없어요');}else if(r&&r.removed)dwToast(head+'  뺌');});

},true);

 {"i": "05", "q": "04", "s": "2", "title": "장소 부사구 도치 2회 + while 대조", "eng": "That is, / at the wide base<sup>1</sup> are many jobs with high school athletic teams<sup>2</sup>, / while at the narrow tip<sup>3</sup> are the few, highly desired<sup>4</sup> jobs with professional organizations.", "notes": [["1", "base", "밑변, 바닥"], ["2", "athletic team", "운동부"], ["3", "tip", "꼭대기, 끝"], ["4", "highly desired", "선망의 대상인"]], "lit": "다시 말해 / 넓은 밑변에는 고등학교 운동부와 관련된 많은 일자리가 있다 / 반면 좁은 꼭대기에는 프로 조직의 소수의, 아주 선망되는 일자리가 있다", "nat": "즉 넓은 밑바닥에는 고등학교 운동부와 관련된 일자리가 잔뜩 있는 반면, 좁은 꼭대기에는 프로 구단의 소수 선망 직종이 자리한다.", "ana": "이 문장은 <b>도치가 두 번</b> 일어납니다. 장소를 나타내는 부사구(at the wide base / at the narrow tip)가 앞으로 나가면서 <b>동사(are)가 주어보다 먼저</b> 왔습니다. 진짜 주어는 are 뒤의 <b>many jobs</b>와 <b>the few ~ jobs</b>입니다. 어법 문제에서 수 일치를 물으면 <b>동사 뒤</b>를 봐야 합니다.", "pe": "\u0001That is\u0002, / \u0001at the wide base<sup>1</sup>\u0002 are many jobs \u0001with high school athletic teams<sup>2</sup>\u0002, / \u0001while at the narrow tip<sup>3</sup> are the few, highly desired<sup>4</sup> jobs with professional organizations\u0002.", "pk": "\u0001다시 말해\u0002 / \u0001넓은 밑변에는\u0002 \u0001고등학교 운동부와 관련된\u0002 많은 일자리가 있다 / \u0001반면 좁은 꼭대기에는 프로 조직의 소수의, 아주 선망되는 일자리가 있다\u0002", "core": "많은 일자리가 있다.", "tags": ["That is = 삽입 접속부사구: 문장 전체를 꾸밈", "<b>도치</b>: 동사 are가 주어 many jobs보다 앞. at the wide base = 전치사구(부사구): are를 꾸밈, 거의 필수에 가까운 부사구(존재의 장소) [기준: 문형 기준]. with ~ teams = 전치사구(형용사구): jobs를 꾸밈", "while ~ = 접속사절(부사절, 대조): 앞 절을 꾸밈. 안에서도 같은 도치 (at the narrow tip are the few jobs)"], "steps": [{"t": "이 문장은 <b>장소 부사구가 앞으로 나온 도치 문장</b> 두 개가 while로 이어진 것이다. 동사 are가 주어보다 앞에 나와 헷갈린다."}, {"t": "순서를 바로잡아 뼈대를 찾는다.", "sub": ["첫째 절 S: many jobs (많은 일자리) / V: are (있다)", "둘째 절 S: the few, highly desired jobs (소수의, 아주 선망되는 일자리) / V: are", "뼈대 = <b>many jobs are</b> / <b>the few jobs are</b> (장소는 각각 at the wide base, at the narrow tip)", "기준: at the wide base, at the narrow tip은 존재의 장소를 나타내는 부사구로 수식어로 본다."]}, {"t": "<b>That is</b>(다시 말해)는 문장 전체를 꾸미는 삽입 접속부사구이다. <b>at the wide base</b>는 '넓은 밑변에'이고, <b>with high school athletic teams</b>는 jobs를 꾸미는 전치사구이다.", "sub": ["base (밑변, 바닥), athletic team (운동부)"]}, {"t": "<b>while at the narrow tip are ...</b>은 '반면'이라는 대조 부사절이고, 안에서도 같은 도치가 일어난다.", "sub": ["tip (꼭대기, 끝), few (소수의)", "highly desired = 아주 선망되는 (desire 바라다의 과거분사)", "with professional organizations = 프로 조직의 (organization 조직)"]}, {"t": "함정: base, tip은 단수인데 동사는 are이다. 동사 바로 뒤의 복수 명사 jobs가 진짜 주어이다."}], "sum": "넓은 밑변엔 많은 일자리, 좁은 꼭대기엔 소수의 선망 일자리"}, {"i": "06", "q": "05", "s": "3", "title": "수동태 병렬 + as if 가정법", "eng": "We are asked to watch the actions / as if<sup>1</sup> they were taking place<sup>2</sup> at a distance<sup>3</sup>, / and we are not asked to participate<sup>4</sup>.", "notes": [["1", "as if", "마치 ~인 것처럼"], ["2", "take place", "일어나다, 벌어지다"], ["3", "at a distance", "멀리서"], ["4", "participate", "참여하다"]], "lit": "우리는 그 사건들을 바라보도록 요청받는다 / 마치 그것들이 멀리서 벌어지고 있는 것처럼 / 그리고 우리는 참여하도록 요청받지 않는다", "nat": "우리는 그 사건들이 마치 멀찍이서 벌어지는 것처럼 바라보도록 요구받을 뿐, 거기에 끼어들라는 요구는 받지 않는다.", "ana": "<b>as if + 과거시제</b>는 시간이 과거라는 뜻이 아니라 <b>사실이 아님</b>을 나타내는 가정법입니다. '멀리서 일어나고 있는 것처럼'으로 읽으세요. 앞뒤가 <b>are asked / are not asked</b>로 대칭을 이루는 수동태 병렬이라는 점도 함께 표시해 두세요.", "pe": "We are asked to watch the actions / \u0001as if<sup>1</sup> they were taking place<sup>2</sup> at a distance<sup>3</sup>\u0002, / and we are not asked to participate<sup>4</sup>.", "pk": "우리는 그 사건들을 바라보도록 요청받는다 / \u0001마치 그것들이 멀리서 벌어지고 있는 것처럼\u0002 / 그리고 우리는 참여하도록 요청받지 않는다", "core": "우리는 그 사건들을 바라보도록 요청받고, 참여하도록 요청받지 않는다.", "tags": ["주어 We + 수동태 are asked + to watch the actions (ask + 목적어 + to V의 수동)", "as if ~ = 접속사절(부사절, <b>가정법</b>): watch를 꾸밈. 과거시제는 사실이 아님을 뜻함", "and 절 병렬: we are not asked to participate (<b>수동태 병렬</b>)"], "steps": [{"t": "이 문장은 <b>수동태 문장(1형식) 두 개가 and로 병렬</b>된 문장이다. 앞 절에 as if절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["첫째 절 S: We (우리)", "V: are asked (ask 요청하다의 수동, 요청받는다)", "둘째 절 S: we", "V: are not asked", "뼈대 = <b>We are asked, and we are not asked</b>", "기준: 수동태 주절 = 1형식"]}, {"t": "<b>to watch the actions</b>는 ask + O + to V에서 수동이 되며 남은 to부정사로 '바라보도록'이다.", "sub": ["watch (바라보다), action (행위, 장면 속 사건)"]}, {"t": "<b>as if they were taking place at a distance</b>는 '마치 ~인 것처럼' 부사절이다. 사실이 아님을 나타내는 <b>가정법</b>이라 과거 시제를 쓴다. they = the actions (그 사건들).", "sub": ["take place (일어나다, 벌어지다), at a distance (멀리서)"]}, {"t": "<b>and we are not asked to participate</b>는 앞 절과 같은 수동태 구조에 not이 붙은 병렬이다.", "sub": ["participate (참여하다)"]}], "sum": "사건을 멀리서 바라보도록만 요청받고, 참여는 요청받지 않음"}, {"i": "07", "q": "05", "s": "5", "title": "세미콜론 두 문장 + seem to be -ing + 목적어 후치", "eng": "The objective<sup>1</sup> camera suggests an emotional distance between camera and subject<sup>2</sup>; / the camera seems simply to be recording, / as straightforwardly<sup>3</sup> as possible, / the characters and actions of the story.", "notes": [["1", "objective", "객관적인"], ["2", "subject", "대상, 피사체"], ["3", "straightforwardly", "솔직하게, 담백하게"]], "lit": "객관적 카메라는 카메라와 대상 사이의 정서적 거리를 시사한다 / 그 카메라는 그저 기록하고 있는 것처럼 보인다 / 가능한 한 솔직하게 / 이야기의 등장인물과 사건을", "nat": "객관적 카메라는 카메라와 대상 사이에 정서적 거리가 있음을 보여 준다. 카메라는 이야기의 인물과 사건을 최대한 담백하게 그저 기록만 하고 있는 듯 보인다.", "ana": "세미콜론(;)은 <b>마침표와 같은 힘</b>입니다. 앞뒤를 별개 문장으로 끊으세요. <b>seems to be recording</b>은 '기록하고 있는 것처럼 보인다'이고, recording의 <b>목적어가 맨 뒤로 밀려나</b> 있습니다 — 사이에 낀 as straightforwardly as possible을 괄호로 묶으면 recording + the characters and actions가 붙습니다.", "pe": "The \u0001objective<sup>1</sup>\u0002 camera suggests an \u0001emotional\u0002 distance \u0001between camera and subject<sup>2</sup>\u0002; / the camera seems \u0001simply\u0002 to be recording, / \u0001as straightforwardly<sup>3</sup> as possible\u0002, / the characters and actions \u0001of the story\u0002.", "pk": "\u0001객관적\u0002 카메라는 \u0001카메라와 대상 사이의\u0002 \u0001정서적\u0002 거리를 시사한다 / 그 카메라는 \u0001그저\u0002 기록하고 있는 것처럼 보인다 / \u0001가능한 한 솔직하게\u0002 / \u0001이야기의\u0002 등장인물과 사건을", "core": "카메라는 거리를 시사한다. 카메라는 등장인물과 사건을 기록하고 있는 것처럼 보인다.", "tags": ["주어 camera + 동사 suggests + 목적어 distance. objective = 형용사: camera를 꾸밈. emotional = 형용사: distance를 꾸밈. between ~ = 전치사구(형용사구): distance를 꾸밈", "<b>세미콜론</b> 뒤 새 문장. seems to be recording (seem + to부정사). simply = 부사: recording을 꾸밈", "as straightforwardly as possible = 부사구: recording을 꾸밈. 목적어 앞에 끼어 있음", "recording의 목적어 the characters and actions. of the story = 전치사구(형용사구): characters and actions를 꾸밈"], "steps": [{"t": "이 문장은 <b>세미콜론(;)으로 이어진 두 문장</b>이다. 첫째는 S+V+O(3형식), 둘째는 S+V+C(2형식)이다. 둘째 문장은 목적어가 맨 뒤로 밀려 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["첫째 S: The objective camera (객관적 카메라, objective 객관적인)", "V: suggests (suggest 시사하다, 보여 주다)", "O: an emotional distance (정서적 거리)", "둘째 S: the camera (그 카메라)", "V: seems (seem ~처럼 보이다)", "C: to be recording (기록하고 있는 것처럼, to부정사 보어) / recording의 O: the characters and actions (등장인물과 사건)", "뼈대 = <b>The objective camera suggests an emotional distance; the camera seems to be recording the characters and actions</b>", "기준: seem + to부정사는 2형식"]}, {"t": "<b>between camera and subject</b>(카메라와 대상 사이의)는 distance를 꾸미는 전치사구이다.", "sub": ["subject (대상, 피사체)"]}, {"t": "<b>simply</b>(그저)는 recording을 꾸미고, <b>as straightforwardly as possible</b>(가능한 한 담백하게)도 recording을 꾸미는 부사구이다. 이 부사구가 recording과 목적어 사이에 끼어 있다.", "sub": ["straightforwardly (솔직하게, 담백하게)"]}, {"t": "<b>of the story</b>(이야기의)는 characters and actions를 꾸미는 전치사구이다. 함정: recording 바로 뒤가 부사구라서 목적어가 늦게 나올 뿐이다."}], "sum": "객관적 카메라, 거리감을 주며 이야기를 최대한 담백하게 기록하는 듯"}, {"i": "08", "q": "06", "s": "8", "title": "부사구 + S+V + 계속적 where절 + to부정사", "eng": "Eleven years later, / she was jogging<sup>1</sup> in Kigali, Rwanda, / where she was working / to set up<sup>2</sup> an aid program<sup>3</sup> for poor women.", "notes": [["1", "jog", "조깅하다"], ["2", "set up", "설립하다, 세우다"], ["3", "aid program", "지원 프로그램"]], "lit": "11년 후 / 그녀는 르완다 키갈리에서 조깅하고 있었다 / 그리고 그곳에서 그녀는 일하고 있었다 / 가난한 여성들을 위한 지원 프로그램을 세우기 위해", "nat": "11년이 지난 뒤, 그녀는 르완다 키갈리에서 조깅을 하고 있었다. 그곳에서 가난한 여성들을 위한 지원 프로그램을 세우는 일을 하던 중이었다.", "ana": "콤마 뒤 <b>where</b>는 <b>관계부사의 계속적 용법</b>입니다. 뒤에서 앞으로 끌어올려 '~하는 키갈리'라고 하지 말고, <b>앞에서 뒤로 그대로 이어서</b> '그런데 그곳에서 ~'로 읽으세요. 뒤의 <b>to set up</b>은 '~하기 위해'라는 목적의 to부정사입니다.", "pe": "\u0001Eleven years later\u0002, / she was jogging<sup>1</sup> \u0001in Kigali, Rwanda\u0002, / \u0001where she was working\u0002 / \u0001to set up<sup>2</sup> an aid program<sup>3</sup> for poor women\u0002.", "pk": "\u000111년 후\u0002 / 그녀는 \u0001르완다 키갈리에서\u0002 조깅하고 있었다 / \u0001그리고 그곳에서 그녀는 일하고 있었다\u0002 / \u0001가난한 여성들을 위한 지원 프로그램을 세우기 위해\u0002", "core": "그녀는 조깅하고 있었다.", "tags": ["Eleven years later = 부사구: 문장 전체를 꾸밈", "주어 she + 동사 was jogging (1형식). in Kigali, Rwanda = 전치사구(부사구): was jogging을 꾸밈", "<b>계속적 where</b> = 관계절(형용사절): Kigali를 꾸밈. 앞에서 뒤로 이어 해석", "to set up ~ = to부정사(부사적: 목적): was working을 꾸밈"], "steps": [{"t": "이 문장은 <b>부사구 + S+V(1형식) + 계속적 where절</b>이다. 장소 설명이 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: she (그녀)", "V: was jogging (jog 조깅하다의 과거진행형)", "뼈대 = <b>she was jogging</b>", "<b>Eleven years later</b>(11년 후)는 문장 전체를 꾸미는 부사구, <b>in Kigali, Rwanda</b>(르완다 키갈리에서)는 was jogging을 꾸미는 전치사구"]}, {"t": "<b>where she was working</b>은 콤마가 있는 <b>계속적 관계부사절</b>로 Kigali를 보충한다. where = and there (그리고 그곳에서)이다. 앞에서 뒤로 이어서 읽는다."}, {"t": "<b>to set up an aid program for poor women</b>은 '세우기 위해'라는 <b>to부정사(목적, 부사적 용법)</b>로 was working을 꾸민다.", "sub": ["set up (설립하다, 세우다), aid program (지원 프로그램)", "for poor women = 가난한 여성들을 위한 (program을 꾸밈)"]}], "sum": "11년 후 그녀, 키갈리에서 조깅 중, 그곳에서 지원 프로그램 설립 업무"}], "qs": [{"q": "01", "type": "필자의 주장", "src": "2014년 9월 19번", "ans": "②", "tr": [["1", "많은 사람이 기르던 반려동물이 세상을 떠나면 새 반려동물을 들인다."], ["2", "잃은 것을 얻은 것으로 메우는 그들 나름의 방식이다."], ["3", "문제가 터질 때마다 우리 앞에는 두 갈래 길이 있다. 그 순간에 붙들려 그 고통을 계속 안고 가거나, 아니면 그것에 맞서 행동하기로 선택하거나."], ["4", "역경에 맞서 행동한다는 것은 할 수 있는 어떤 방식으로든 긍정을 길러 낸다는 뜻이다."], ["5", "직장을 잃었다면 하나가 아니라 둘을 찾아라."], ["6", "최근에 소중한 사람과 헤어졌다면, 시간을 들여 자신이 진짜 원하는 것을 다시 찾고 타고난 능력을 키워라."], ["7", "가장 중요한 것은 자신을 상황의 희생양으로 내주지 않는 것이다. 당신에게는 부정을 긍정으로 되받아칠 능력이 있다."], ["8", "대신, 생산적으로 맞서 싸워 당신의 시련을 한 수 앞서기로 선택하라."], ["9", "우리에게 우리 상황을 바꿀 힘이 있다는 사실은 참으로 마음을 놓이게 하는 생각이다."]], "evh": "7 · 8번 문장", "ev": [{"en": true, "h": "Most important is not allowing yourself to fall victim to your circumstances ... / Choose, instead, to outsmart your challenges by productively working against them."}, {"en": false, "h": "주장 유형은 <b>명령문</b>과 <b>Most important is ~</b> 같은 강조 표현에 답이 있습니다. 7번의 '상황의 희생양이 되지 마라', 8번의 '<b>Choose ~ to outsmart</b>'가 직접 명령입니다. 앞의 반려동물·실직·이별은 전부 <b>예시</b>일 뿐입니다."}], "opts": [{"n": "①", "t": "매사에 최악의 상황에 대비하라.", "a": false, "x": true, "trap": false, "e": "최악을 대비하라는 말은 없습니다. 오히려 부정을 긍정으로 <b>되받아치라</b>고 합니다."}, {"n": "②", "t": "적극적인 태도로 역경을 극복하라.", "a": true, "x": false, "trap": false, "e": "act against / cultivating positivity / outsmart your challenges — 4·7·8번이 모두 이 말입니다."}, {"n": "③", "t": "직관보다는 이성적 판단을 믿어라.", "a": false, "x": true, "trap": false, "e": "직관과 이성을 비교한 대목이 한 줄도 없습니다."}, {"n": "④", "t": "과거에 대한 지나친 집착을 버려라.", "a": false, "x": true, "trap": true, "e": "3번의 dwell on the moment 때문에 걸리지만, 붙들리지 말라는 대상은 <b>지금 닥친 문제</b>이지 과거가 아닙니다."}, {"n": "⑤", "t": "자신의 모습을 있는 그대로 인정하라.", "a": false, "x": true, "trap": false, "e": "자기 수용이 아니라 <b>적극적 행동</b>을 요구하는 글입니다."}], "w": [["pass away", "세상을 떠나다"], ["replace A with B", "A를 B로 대체하다"], ["surface", "(문제가) 불거지다"], ["dwell on", "~에 머무르다, 곱씹다"], ["adversity", "역경"], ["cultivate", "기르다, 함양하다"], ["fall victim to", "~의 희생양이 되다"], ["counteract", "상쇄하다, 맞서다"], ["outsmart", "한 수 앞서다"], ["reassuring", "안심시키는"]]}, {"q": "02", "type": "글의 요지", "src": "2021년 11월 22번", "ans": "⑤", "tr": [["1", "\"이 사람은 누구인가?\" 이것이 모든 이야기가 던지는 질문이다."], ["2", "이 질문은 불이 붙는 지점에서 가장 먼저 떠오른다."], ["3", "최초의 변화가 닥칠 때 주인공은 과잉 반응하거나 달리 말하면 예상 밖의 행동을 한다."], ["4", "우리는 자세를 고쳐 앉고, 갑자기 주의를 기울인다."], ["5", "\"이렇게 행동하는 이 사람은 대체 누구인가?\""], ["6", "그 질문은 주인공이 줄거리에 부딪혀 시험받고 선택을 강요당할 때마다 다시 고개를 든다."], ["7", "이야기 안에서 그 질문이 살아 있는 곳이라면 어디서든 독자나 관객은 몰입하게 된다."], ["8", "그 질문이 사라지고 극의 사건들이 그 빛줄기 밖으로 벗어나면, 그들은 마음이 떨어져 나가고 심지어 지루해질 위험에 놓인다."], ["9", "이야기하기에 단 하나의 비밀이 있다면 나는 이것이라고 믿는다. \"이 사람은 누구인가?\""], ["10", function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){

function advance(){

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>강조 표현</b>(Most important 가장 중요한 것은)과 <b>명령문</b>(Choose 선택하라)에 있어요. 반려동물·실직·이별은 예시일 뿐이니, 반복되는 <b>act against</b>(맞서 행동하다)·<b>positivity</b>(긍정)를 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 두 갈래 길</span><div class=\"en\">we can dwell on the moment … or we <mark>can choose to act against it</mark>.</div><p class=\"ko\">그 순간을 곱씹을 수도 있고 … 또는 <mark>그것(= 문제)에 맞서 행동하기를 선택할 수도 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>두 길 중 ‘맞서 행동하기’가 무슨 뜻인지 풀어 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 핵심어 풀이</span><div class=\"en\"><mark>Acting against adversity</mark> means cultivating positivity in whatever way you can.</div><p class=\"ko\"><mark>역경에 맞서 행동하는 것은</mark> 할 수 있는 어떤 방식으로든 긍정을 기르는 것을 의미한다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>직장을 잃으면 하나가 아니라 둘을 찾기</span><span><em>6번</em>연인과 헤어지면 내 욕구·능력 다시 키우기</span></div><div class=\"ck-eq\">⇒ 두 예시의 공통점 = 나쁜 일 앞에서 주저앉지 않고 먼저 움직이기</div></div><div class=\"ck-via\"><i>▼</i><span>강조 표현으로 결론을 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\"><mark>Most important</mark> is not allowing yourself to fall victim to your circumstances</div><p class=\"ko\"><mark>가장 중요한 것은</mark> 당신 자신이 상황의 희생물이 되도록 두지 않는 것이다</p></div><div class=\"ck-via\"><i>▼</i><span>명령문 = 필자가 하고 싶은 말 그 자체</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 명령문으로 한 번 더</span><div class=\"en\"><mark>Choose, instead,</mark> to outsmart your challenges by productively working against them.</div><p class=\"ko\">대신에, 역경들에 맞서 생산적으로 일함으로써 한 발 앞서기를 <mark>선택하라</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">적극적인 태도로 역경을 극복하라.<small>act against(맞서 행동하다)·positivity(긍정)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">과거에 대한 지나친 집착을 버려라.</span><span class=\"why\">[범위 좁음] 3번 dwell on(곱씹다)을 하지 말라는 건 절반일 뿐이에요. 필자가 진짜 시키는 건 맞서 행동하기(act against)예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">매사에 최악의 상황에 대비하라.</span><span class=\"why\">[지문에 없음] 미리 대비하라는 말은 없어요. 지문은 문제가 생긴 ‘뒤에’ 어떻게 맞설지를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">직관보다는 이성적 판단을 믿어라.</span><span class=\"why\">[지문에 없음] 직관과 이성을 비교하는 문장이 하나도 없어요. 지문의 대결은 부정(negativity) 대 긍정(positivity)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">자신의 모습을 있는 그대로 인정하라.</span><span class=\"why\">[반대] 7번은 상황의 희생양이 되지 말라고 해요. 그대로 받아들이기가 아니라 상황을 바꾸라는 말이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Many people</div><div class=\"k\">많은 사람들은</div></div><div class=\"rc\"><div class=\"e\">choose to adopt</div><div class=\"k\">입양하기로 선택한다</div></div><div class=\"rc\"><div class=\"e\">a new pet</div><div class=\"k\">새 반려동물을</div></div><div class=\"rc\"><div class=\"e\">when their old pet passes away.</div><div class=\"k\">그들의 기존 반려동물이 죽으면.</div></div><div class=\"rnat\">많은 사람이 기르던 반려동물이 세상을 떠나면 새 반려동물을 들인다.</div><div class=\"rst\">우리 반에서 키우던 금붕어가 죽으면, 새 금붕어를 데려오는 친구들이 많아요. = 지문의 ‘반려동물이 죽으면 새로 들인다’예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This</div><div class=\"k\">이것은 (= 새 반려동물을 입양하는 것)</div></div><div class=\"rc\"><div class=\"e\">is their way</div><div class=\"k\">그들의 방식이다</div></div><div class=\"rc\"><div class=\"e\">of replacing a loss</div><div class=\"k\">상실을 대체하는</div></div><div class=\"rc\"><div class=\"e\">with a gain.</div><div class=\"k\">얻음으로.</div></div><div class=\"rnat\">잃은 것을 얻은 것으로 메우는 그들 나름의 방식이다.</div><div class=\"rst\">슬픈 빈자리를 새 친구로 채우는 거예요. 그래서 지문은 이걸 잃은 것을 얻은 것으로 바꾸는 방법이라고 말해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">We are faced with two choices</div><div class=\"k\">우리는 두 가지 선택에 직면한다</div></div><div class=\"rc\"><div class=\"e\">whenever trouble surfaces:</div><div class=\"k\">문제가 드러날 때마다:</div></div><div class=\"rc\"><div class=\"e\">we can dwell on the moment</div><div class=\"k\">우리는 그 순간을 곱씹을 수도 있고</div></div><div class=\"rc\"><div class=\"e\">and maintain the pain</div><div class=\"k\">그리고 고통을 유지할 수도 있고</div></div><div class=\"rc\"><div class=\"e\">it causes</div><div class=\"k\">그것(= 문제)이 일으키는</div></div><div class=\"rc\"><div class=\"e\">or we can choose to act against it.</div><div class=\"k\">또는 그것(= 문제)에 맞서 행동하기를 선택할 수도 있다.</div></div><div class=\"rnat\">문제가 터질 때마다 우리 앞에는 두 갈래 길이 있다. 그 순간에 붙들려 그 고통을 계속 안고 가거나, 아니면 그것에 맞서 행동하기로 선택하거나.</div><div class=\"rst\">속상한 일이 생기면 길은 둘이에요. 계속 울며 곱씹을지, <b>맞서 움직일지</b>(act against 맞서 행동하다). 지문도 이 두 갈래를 보여 줘요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Acting against adversity</span></div><div class=\"k\"><span class=\"cw\">역경에 맞서 행동하는 것은</span></div></div><div class=\"rc\"><div class=\"e\">means</div><div class=\"k\">의미한다</div></div><div class=\"rc\"><div class=\"e\">cultivating positivity</div><div class=\"k\">긍정(적극성)을 기르는 것을</div></div><div class=\"rc\"><div class=\"e\">in whatever way you can.</div><div class=\"k\">당신이 할 수 있는 어떤 방식으로든.</div></div><div class=\"rnat\">역경에 맞서 행동한다는 것은 할 수 있는 어떤 방식으로든 긍정을 길러 낸다는 뜻이다.</div><div class=\"rst\">맞서 움직인다는 건 할 수 있는 방법을 다 써서 <b>힘을 내는 것</b>이에요. = 지문의 ‘긍정(positivity)을 기르는 것’이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">If you've lost your job,</div><div class=\"k\">만약 직업을 잃었다면,</div></div><div class=\"rc\"><div class=\"e\">seek not one but two.</div><div class=\"k\">하나가 아니라 둘을 찾아라.</div></div><div class=\"rnat\">직장을 잃었다면 하나가 아니라 둘을 찾아라.</div><div class=\"rst\">축구부 선발에서 떨어졌다면? 동아리 한 곳 말고 두 곳에 지원해 봐요. 지문도 일자리를 잃으면 둘을 찾으라고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">If you've recently separated</div><div class=\"k\">만약 최근에 헤어졌다면</div></div><div class=\"rc\"><div class=\"e\">from your significant other,</div><div class=\"k\">당신의 연인과,</div></div><div class=\"rc\"><div class=\"e\">take time</div><div class=\"k\">시간을 가져라</div></div><div class=\"rc\"><div class=\"e\">to rediscover your personal needs</div><div class=\"k\">당신의 개인적 욕구를 다시 찾기 위해</div></div><div class=\"rc\"><div class=\"e\">and improve your natural abilities.</div><div class=\"k\">그리고 타고난 능력을 향상시키기 위해.</div></div><div class=\"rnat\">최근에 연인과 헤어졌다면, 시간을 들여 자신의 개인적 욕구를 다시 찾고 타고난 능력을 키워라.</div><div class=\"rst\">단짝과 멀어졌다면, 그 시간에 내가 좋아하던 그림을 다시 그려 봐요. 지문의 ‘내 욕구를 찾고 능력을 키워라’예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Most important</span></div><div class=\"k\"><span class=\"cw\">가장 중요한 것은</span></div></div><div class=\"rc\"><div class=\"e\">is not allowing yourself</div><div class=\"k\">당신 자신을 ~하게 두지 않는 것이다</div></div><div class=\"rc\"><div class=\"e\">to fall victim</div><div class=\"k\">희생물이 되도록</div></div><div class=\"rc\"><div class=\"e\">to your circumstances;</div><div class=\"k\">당신의 상황의;</div></div><div class=\"rc\"><div class=\"e\">you have the ability</div><div class=\"k\">당신에게는 능력이 있다</div></div><div class=\"rc\"><div class=\"e\">to counteract negativity</div><div class=\"k\">부정에 대항할</div></div><div class=\"rc\"><div class=\"e\">with positivity.</div><div class=\"k\">긍정으로.</div></div><div class=\"rnat\">가장 중요한 것은 자신을 상황의 희생양으로 내주지 않는 것이다. 당신에게는 부정을 긍정으로 되받아칠 능력이 있다.</div><div class=\"rst\"><b>가장 중요한 건</b>(Most important) “난 원래 안 돼” 하고 주저앉지 않는 거예요. 지문은 우리가 부정을 긍정으로 이길 수 있다고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Choose, instead,</span></div><div class=\"k\"><span class=\"cw\">대신에 선택하라,</span></div></div><div class=\"rc\"><div class=\"e\">to outsmart your challenges</div><div class=\"k\">당신의 역경들을 한 발 앞서기를</div></div><div class=\"rc\"><div class=\"e\">by productively working</div><div class=\"k\">생산적으로 일함으로써</div></div><div class=\"rc\"><div class=\"e\">against them.</div><div class=\"k\">그것들(= 역경들)에 맞서.</div></div><div class=\"rnat\">대신, 생산적으로 맞서 싸워 당신의 시련을 한 수 앞서기로 선택하라.</div><div class=\"rst\">그러니 <b>대신에 선택하세요</b>(Choose 선택하라). 힘든 일에 부지런히 맞서서 한 수 앞서라는 게 필자의 주장이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">That we hold the power</div><div class=\"k\">우리가 힘을 가지고 있다는 것은</div></div><div class=\"rc\"><div class=\"e\">to influence our circumstances</div><div class=\"k\">우리의 상황에 영향을 줄</div></div><div class=\"rc\"><div class=\"e\">is a very reassuring thought.</div><div class=\"k\">매우 위안을 주는 생각이다.</div></div><div class=\"rnat\">우리가 우리 상황에 영향을 줄 힘을 가지고 있다는 사실은 참으로 마음을 놓이게 하는 생각이다.</div><div class=\"rst\">내 상황을 내가 바꿀 수 있다고 생각하면 마음이 놓여요. 지문도 그 생각이 큰 위안이 된다고 하며 끝맺어요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"dwell on\" data-m=\"~을 곱씹다, ~에 머무르다\"><b>dwell on</b>~을 곱씹다, ~에 머무르다</button><button type=\"button\" class=\"wdb\" data-w=\"adversity\" data-m=\"역경\"><b>adversity</b>역경</button><button type=\"button\" class=\"wdb\" data-w=\"cultivate\" data-m=\"기르다, 함양하다\"><b>cultivate</b>기르다, 함양하다</button><button type=\"button\" class=\"wdb\" data-w=\"fall victim to\" data-m=\"~의 희생양이 되다\"><b>fall victim to</b>~의 희생양이 되다</button><button type=\"button\" class=\"wdb\" data-w=\"counteract\" data-m=\"~에 대항하다, 상쇄하다\"><b>counteract</b>~에 대항하다, 상쇄하다</button><button type=\"button\" class=\"wdb\" data-w=\"outsmart\" data-m=\"한 수 앞서다\"><b>outsmart</b>한 수 앞서다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이 글은 질문이 <b>있을 때와 없을 때</b>를 맞붙인 8·9번에 요지가 있어요. 1·6·11번에서 <b>반복되는 질문</b> “이 사람은 누구인가?(Who is this person?)”이 계속 살아 있어야 독자가 <b>몰입</b>한다는 말이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 반복되는 핵심 질문</span><div class=\"en\"><mark>Who is this person?</mark></div><p class=\"ko\"><mark>이 사람은 누구인가?</mark></p></div><div class=\"ck-via\"><i>▼</i><span>처음 한 번이 아니라 선택할 때마다 다시 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 질문이 계속 돌아옴</span><div class=\"en\">The question then <mark>re-emerges every time</mark> the protagonist is challenged by the plot and compelled to make a choice.</div><p class=\"ko\">그러고 나서 그 질문은 주인공이 줄거리에 도전받고 선택하도록 강요받을 때마다 <mark>다시 나타난다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>질문이 살아 있으면 어떻게 되는지 결론을 내려요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 요지</span><div class=\"en\">Everywhere in the narrative that <mark>the question is present</mark>, the reader or viewer <mark>will likely be engaged</mark>.</div><p class=\"ko\">그 질문이 존재하는 이야기의 모든 곳에서 독자나 시청자는 <mark>몰입하게 될 가능성이 높다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>질문이 없으면 정반대 결과가 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 반대 쪽으로 요지 확인</span><div class=\"en\">Where the question is absent, … they are at risk of <mark>becoming detached</mark> — perhaps even bored.</div><p class=\"ko\">그 질문이 부재하는 곳에서, 그들은 <mark>분리될</mark>, 어쩌면 심지어 지루해질 위험에 놓인다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">주인공에 대한 지속적인 궁금증 유발이 독자의 몰입을 도와준다.<small>7번 re-emerges every time(때마다 다시 나타남) = 지속적, 8번 engaged(몰입한) = 몰입을 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">독자의 공감을 얻기 위해 구체적인 인물 묘사가 중요하다.</span><span class=\"why\">[지문에 없음] 주인공이 중심이긴 하지만, 지문은 인물을 자세히 그려 주라는 게 아니라 “이 사람은 누구지?” 하는 질문을 계속 던지라는 말이에요. 공감도 아니고 engaged(몰입한)예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">이야기의 줄거리를 단순화시키는 것이 독자의 이해를 높인다.</span><span class=\"why\">[지문에 없음] 줄거리를 단순하게 하라는 말은 없어요. 오히려 7번에서 줄거리가 주인공에게 도전하고 선택을 강요할 때 질문이 살아난다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">거리를 두고 주인공의 상황을 객관적으로 바라볼 필요가 있다.</span><span class=\"why\">[반대] 9번에서 detached(분리된, 거리를 둔) 상태는 질문이 사라졌을 때 생기는 위험이에요. 거리를 두라는 건 지문과 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">주인공의 역경과 행복이 적절히 섞여야 이야기가 흥미로워진다.</span><span class=\"why\">[지문에 없음] 역경과 행복을 섞는 이야기는 한 번도 안 나와요. 흥미의 비밀은 10~11번에서 “이 사람은 누구인가?”라는 질문 하나라고 했어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Who is this person?</div><div class=\"k\">이 사람은 누구인가?</div></div><div class=\"rnat\">'이 사람은 누구인가?'</div><div class=\"rst\">친구랑 웹툰을 보는데 주인공을 보며 “얘 대체 누구야?” 하고 궁금해져요. = 지문 1번의 <b>이 사람은 누구인가?</b>라는 질문이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This</div><div class=\"k\">이것은 (= '이 사람은 누구인가?')</div></div><div class=\"rc\"><div class=\"e\">is the question</div><div class=\"k\">질문이다</div></div><div class=\"rc\"><div class=\"e\">all stories ask.</div><div class=\"k\">모든 이야기가 물어보는.</div></div><div class=\"rnat\">이것은 모든 이야기가 물어보는 질문이다.</div><div class=\"rst\">어떤 웹툰이든 결국 이 궁금증을 던져요. 그래서 지문 2번은 모든 이야기가 이 질문을 한다고 말해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It</div><div class=\"k\">그것은 (= 그 질문)</div></div><div class=\"rc\"><div class=\"e\">emerges first</div><div class=\"k\">가장 먼저 나타난다</div></div><div class=\"rc\"><div class=\"e\">at the ignition point.</div><div class=\"k\">발화 지점(불이 붙는 지점)에서.</div></div><div class=\"rnat\">그것은 발화 지점에서 가장 먼저 나타난다.</div><div class=\"rst\">이 궁금증은 이야기에 불이 딱 붙는 첫 장면에서 처음 생겨요. = 지문 3번, 발화 지점에서 가장 먼저 나타난다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">When the initial change strikes,</div><div class=\"k\">처음의 변화가 닥칠 때,</div></div><div class=\"rc\"><div class=\"e\">the protagonist overreacts</div><div class=\"k\">주인공은 과민 반응하거나</div></div><div class=\"rc\"><div class=\"e\">or behaves</div><div class=\"k\">또는 행동한다</div></div><div class=\"rc\"><div class=\"e\">in an otherwise unexpected way.</div><div class=\"k\">그렇지 않으면 예상치 못한 방식으로.</div></div><div class=\"rnat\">처음의 변화가 발생할 때 주인공은 과민 반응하거나, 그렇지 않으면 예상치 못한 방식으로 행동한다.</div><div class=\"rst\">첫 화에서 갑자기 일이 터지자 주인공이 엄청 화내거나 이상하게 행동해요. = 지문 4번, 주인공이 과민 반응하는 장면이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">We sit up,</div><div class=\"k\">우리는 일어나 앉고,</div></div><div class=\"rc\"><div class=\"e\">suddenly attentive.</div><div class=\"k\">갑자기 주의를 기울인다.</div></div><div class=\"rnat\">우리는 일어나 앉아 갑자기 주의를 기울인다.</div><div class=\"rst\">그걸 본 우리는 폰을 꽉 쥐고 집중해요. = 지문 5번, 일어나 앉아 갑자기 주의를 기울인다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Who is this person</div><div class=\"k\">이 사람은 누구인가</div></div><div class=\"rc\"><div class=\"e\">who behaves like this?</div><div class=\"k\">이렇게 행동하는?</div></div><div class=\"rnat\">'이렇게 행동하는 이 사람은 누구인가?'</div><div class=\"rst\">“이렇게 행동하는 얘는 도대체 누구지?” 하고 또 궁금해져요. 지문 6번이 바로 그 질문이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">The question then <span class=\"cw\">re-emerges</span></div><div class=\"k\">그러고 나서 그 질문은 <span class=\"cw\">다시 나타난다</span></div></div><div class=\"rc\"><div class=\"e\">every time</div><div class=\"k\">~할 때마다</div></div><div class=\"rc\"><div class=\"e\">the protagonist is challenged by the plot</div><div class=\"k\">주인공이 줄거리에 도전받고</div></div><div class=\"rc\"><div class=\"e\">and compelled to make a choice.</div><div class=\"k\">선택하도록 강요받을.</div></div><div class=\"rnat\">그러고 나서 그 질문은 주인공이 줄거리에 도전받고 선택을 하도록 강요받을 때마다 다시 나타난다.</div><div class=\"rst\">주인공이 어려운 선택을 해야 할 때마다 이 궁금증이 <b>다시</b> 떠올라요. = 지문 7번, 질문이 <b>re-emerges</b>(다시 나타난다)예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Everywhere in the narrative</div><div class=\"k\">이야기 안의 모든 곳에서</div></div><div class=\"rc\"><div class=\"e\">that the question is present,</div><div class=\"k\">그 질문이 존재하는,</div></div><div class=\"rc\"><div class=\"e\">the reader or viewer</div><div class=\"k\">독자나 시청자는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">will likely be engaged</span>.</div><div class=\"k\"><span class=\"cw\">몰입하게 될 가능성이 높다</span>.</div></div><div class=\"rnat\">그 질문이 존재하는 이야기의 모든 곳에서 독자 또는 시청자는 몰입하게 될 것이다.</div><div class=\"rst\">궁금한 장면에선 다음 화 버튼을 바로 눌러요. 지문 8번이 요지예요. 질문이 있으면 독자가 <b>몰입</b>(engaged)해요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">Where the question is absent,</div><div class=\"k\">그 질문이 부재하는 곳에서,</div></div><div class=\"rc\"><div class=\"e\">and the events of drama</div><div class=\"k\">그리고 드라마의 사건들이</div></div><div class=\"rc\"><div class=\"e\">move out of its narrative beam,</div><div class=\"k\">이야기의 빛줄기 밖으로 벗어나는,</div></div><div class=\"rc\"><div class=\"e\">they are at risk</div><div class=\"k\">그들(= 독자나 시청자)은 위험에 놓인다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">of becoming detached</span></div><div class=\"k\"><span class=\"cw\">분리될</span></div></div><div class=\"rc\"><div class=\"e\">— perhaps even bored.</div><div class=\"k\">— 어쩌면 심지어 지루해질.</div></div><div class=\"rnat\">그 질문이 부재하고 드라마의 사건들이 이야기의 빛줄기에서 벗어나는 곳에서, 그들은 분리될 위험에 놓이고 심지어는 지루해질 위험에 처할 수도 있다.</div><div class=\"rst\">반대로 궁금증 없는 장면이 이어지면 스크롤만 휙휙 넘기다 지루해져요. = 지문 9번, 독자가 <b>분리되고</b>(detached) 지루해진다는 말이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">If there's a single secret</div><div class=\"k\">만약 한 가지 비밀이 있다면</div></div><div class=\"rc\"><div class=\"e\">to storytelling</div><div class=\"k\">이야기하기에</div></div><div class=\"rc\"><div class=\"e\">then I believe</div><div class=\"k\">그렇다면 나는 믿는다</div></div><div class=\"rc\"><div class=\"e\">it's this.</div><div class=\"k\">그것이 이것이라고. (= 다음 문장의 질문)</div></div><div class=\"rnat\">만약 이야기하기에 한 가지 비밀이 있다면, 나는 그것이 이것이라고 믿는다.</div><div class=\"rst\">웹툰 작가에게 인기 비결을 딱 하나 물으면 “이거예요” 하고 답해요. 지문 10번은 그 비밀이 다음 문장에 나온다고 말해요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Who is this person?</div><div class=\"k\">이 사람은 누구인가?</div></div><div class=\"rc\"><div class=\"e\">Or,</div><div class=\"k\">또는,</div></div><div class=\"rc\"><div class=\"e\">from the perspective of the character,</div><div class=\"k\">등장인물의 관점에서,</div></div><div class=\"rc\"><div class=\"e\">Who am I?</div><div class=\"k\">나는 누구인가?</div></div><div class=\"rnat\">'이 사람은 누구인가?' 또는 등장인물의 관점에서 '나는 누구인가?'</div><div class=\"rst\">바로 “이 사람은 누구지?”, 주인공 입장에선 “나는 누구지?”예요. = 지문 11번, 같은 질문이 또 반복돼요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">It's</div><div class=\"k\">그것이 (= 이 질문) ~이다</div></div><div class=\"rc\"><div class=\"e\">the definition of drama.</div><div class=\"k\">드라마의 정의.</div></div><div class=\"rnat\">그것이 드라마의 정의이다.</div><div class=\"rst\">이 궁금증이 곧 이야기 그 자체예요. 그래서 지문 12번은 그것이 드라마의 정의라고 말해요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">It is its electricity,</div><div class=\"k\">그것(= 이 질문)은 드라마의 전기이고,</div></div><div class=\"rc\"><div class=\"e\">its heartbeat,</div><div class=\"k\">심장 박동이고,</div></div><div class=\"rc\"><div class=\"e\">its fire.</div><div class=\"k\">불꽃이다.</div></div><div class=\"rnat\">그것이 드라마의 전기이고 심장 박동이자 불꽃이다.</div><div class=\"rst\">궁금증은 웹툰을 살아 움직이게 하는 심장 같아요. = 지문 13번, 드라마의 전기·심장 박동·불꽃이라는 말이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"protagonist\" data-m=\"주인공\"><b>protagonist</b>주인공</button><button type=\"button\" class=\"wdb\" data-w=\"emerge\" data-m=\"나타나다, 떠오르다\"><b>emerge</b>나타나다, 떠오르다</button><button type=\"button\" class=\"wdb\" data-w=\"overreact\" data-m=\"과잉 반응하다\"><b>overreact</b>과잉 반응하다</button><button type=\"button\" class=\"wdb\" data-w=\"compel\" data-m=\"(억지로) ~하게 하다\"><b>compel</b>(억지로) ~하게 하다</button><button type=\"button\" class=\"wdb\" data-w=\"engaged\" data-m=\"몰입한\"><b>engaged</b>몰입한</button><button type=\"button\" class=\"wdb\" data-w=\"detached\" data-m=\"무심한, 거리를 둔\"><b>detached</b>무심한, 거리를 둔</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>반복되는 핵심어</b>와 <b>그 말이 쓰이는 무대</b>를 묶어서 찾으세요. <b>precise</b>(정확한)가 2·4·6번에 되풀이되고, 그 무대는 계약·거래·무역 같은 <b>경제 거래</b>예요.</p><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결론 신호</span><div class=\"en\">When dealing with property, with contracts, or even just with the routine exchange of goods and services, concepts and descriptions <mark>need to be as precise and unambiguous as possible</mark>, otherwise misunderstandings will arise.</div><p class=\"ko\">재산·계약·상품과 서비스의 교환을 다룰 때, 개념과 설명은 <mark>가능한 한 정확하고 모호하지 않아야 한다</mark>, 그렇지 않으면 오해가 생길 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>경제가 복잡해질수록 그 “정확함”이 더 필요해졌다고 다시 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 핵심어 반복</span><div class=\"en\">As economic life became more complex in the later Middle Ages, the need for fuller and <mark>more precise communication</mark> was accentuated.</div><p class=\"ko\">중세 후반에 경제 생활이 더 복잡해지면서, 더 완전하고 <mark>더 정확한 의사소통</mark>에 대한 필요가 강조되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>같은 precise(정확한)가 국제 무역에서도 반복돼요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 무대가 무역으로 넓어짐</span><div class=\"en\">In international trade also the use of a <mark>precise and well-formulated language</mark> aided the process of translation.</div><p class=\"ko\">국제 무역에서도 또한 <mark>정확하고 잘 표현된 언어</mark>의 사용은 통역(번역)의 과정을 도왔다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>핵심어</em>precise(정확한) — 2·4·6번 반복</span><span><em>무대</em>계약·상품 교환·경제 생활·국제 무역</span></div><div class=\"ck-eq\">⇒ 정확한 언어 + 경제 거래 = 언어의 정밀함이 성공적인 거래의 열쇠</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">Linguistic Precision(언어의 정밀함): A Key to Successful Economic Transactions(성공적인 경제 거래의 열쇠)<small>반복어 precise(정확한) = Precision(정밀함), 무대인 거래·무역 = Economic Transactions(경제 거래)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Difficulties in Overcoming Language Barriers and Distrust in Trade(무역에서 언어 장벽과 불신을 극복하기의 어려움)</span><span class=\"why\">[범위 좁음] 3번 distrust(불신)와 7번 통역 이야기만 따온 함정이에요. 게다가 글은 극복이 “어렵다”가 아니라 정확한 언어가 거래를 “돕는다”고 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Earn Trust with Reliable Goods Rather Than with Words(말보다 믿을 만한 물건으로 신뢰를 얻어라)!</span><span class=\"why\">[반대] 1번은 명확한 언어가 mutual confidence(상호 신뢰)에 큰 도움이 된다고 했어요. 말보다 물건이라는 건 지문과 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">The More the Economy Grows(경제가 성장할수록), the More Complex the World Gets(세상은 복잡해진다)</span><span class=\"why\">[범위 좁음] 4번의 more complex(더 복잡한)만 따왔어요. 그 문장의 핵심은 복잡해졌다는 게 아니라 정확한 의사소통이 더 필요해졌다는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Excessive Confidence(지나친 자신감): The Biggest Reason for Miscommunication(소통 실패의 가장 큰 이유)</span><span class=\"why\">[지문에 없음] 1번의 confidence(신뢰)는 서로 믿는 마음이지 지나친 자신감이 아니에요. 2번에서 오해의 원인은 모호한 설명이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In government, in law, in culture,</div><div class=\"k\">정부(정치 체제)에서, 법에서, 문화에서,</div></div><div class=\"rc\"><div class=\"e\">and in routine everyday interaction</div><div class=\"k\">그리고 일상적인 매일의 상호 작용에서</div></div><div class=\"rc\"><div class=\"e\">beyond family and immediate neighbours,</div><div class=\"k\">가족과 가까운 이웃을 넘어서는,</div></div><div class=\"rc\"><div class=\"e\">a widely understood</div><div class=\"k\">널리 이해되고</div></div><div class=\"rc\"><div class=\"e\">and clearly formulated language</div><div class=\"k\">명확하게 다듬어진 언어는</div></div><div class=\"rc\"><div class=\"e\">is a great aid</div><div class=\"k\">큰 도움이 된다</div></div><div class=\"rc\"><div class=\"e\">to mutual confidence.</div><div class=\"k\">상호 신뢰에.</div></div><div class=\"rnat\">정부에서, 법에서, 문화에서, 그리고 가족과 가까운 이웃을 넘어선 일상적인 교류에서, 널리 이해되고 명확하게 다듬어진 언어는 상호 신뢰에 큰 도움이 된다.</div><div class=\"rst\">중고 거래 앱에서 처음 보는 사람과 게임기를 사고팔 때, 서로 알아듣기 쉬운 말이 오가면 믿음이 생겨요. = 지문 1번, 명확한 언어가 상호 신뢰에 <b>큰 도움</b>이 된다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">When dealing with property,</div><div class=\"k\">재산을 다룰 때,</div></div><div class=\"rc\"><div class=\"e\">with contracts,</div><div class=\"k\">계약을 다룰 때,</div></div><div class=\"rc\"><div class=\"e\">or even just with the routine exchange of goods and services,</div><div class=\"k\">또는 심지어 단지 상품과 서비스의 일상적인 교환을 다룰 때에도,</div></div><div class=\"rc\"><div class=\"e\">concepts and descriptions</div><div class=\"k\">개념과 설명은</div></div><div class=\"rc ckc\"><div class=\"e\">need to be <span class=\"cw\">as precise and unambiguous as possible</span>,</div><div class=\"k\"><span class=\"cw\">가능한 한 정확하고 모호하지 않아야 한다</span>,</div></div><div class=\"rc\"><div class=\"e\">otherwise misunderstandings will arise.</div><div class=\"k\">그렇지 않으면 오해가 생길 것이다.</div></div><div class=\"rnat\">재산이나 계약을 다룰 때는 물론, 그저 일상적인 물건과 서비스를 주고받을 때조차 개념과 설명은 최대한 정확하고 모호하지 않아야 한다. 그러지 않으면 오해가 생긴다.</div><div class=\"rst\">“상태 좋아요” 말고 “화면 흠집 1개, 충전기 포함”처럼 <b>정확하게</b>(precise) 써야 오해가 없어요. 지문 2번이 이 글의 결론이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If full communication</div><div class=\"k\">완전한 의사소통이</div></div><div class=\"rc\"><div class=\"e\">with a potential counterparty in a deal</div><div class=\"k\">거래에서 잠재적 상대방과의</div></div><div class=\"rc\"><div class=\"e\">is not possible,</div><div class=\"k\">가능하지 않다면,</div></div><div class=\"rc\"><div class=\"e\">then uncertainty</div><div class=\"k\">불확실성과</div></div><div class=\"rc\"><div class=\"e\">and probably a measure of distrust</div><div class=\"k\">아마도 어느 정도의 불신이</div></div><div class=\"rc\"><div class=\"e\">will remain.</div><div class=\"k\">남을 것이다.</div></div><div class=\"rnat\">거래 상대방과 온전히 소통하는 것이 불가능하면, 불확실성과 아마도 어느 정도의 불신이 남게 된다.</div><div class=\"rst\">판매자와 말이 잘 안 통하면 “진짜 괜찮은 거 맞나?” 하는 찜찜함이 남아요. = 지문 3번, 불확실성과 불신이 남는다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">As economic life became more complex</div><div class=\"k\">경제 생활이 더 복잡해지면서</div></div><div class=\"rc\"><div class=\"e\">in the later Middle Ages,</div><div class=\"k\">중세 후반에,</div></div><div class=\"rc\"><div class=\"e\">the need</div><div class=\"k\">필요가</div></div><div class=\"rc ckc\"><div class=\"e\">for fuller and <span class=\"cw\">more precise communication</span></div><div class=\"k\">더 완전하고 <span class=\"cw\">더 정확한 의사소통</span>에 대한</div></div><div class=\"rc\"><div class=\"e\">was accentuated.</div><div class=\"k\">강조되었다.</div></div><div class=\"rnat\">중세 후기에 경제생활이 더 복잡해지면서, 더 완전하고 더 정확한 의사소통에 대한 필요가 강조되었다.</div><div class=\"rst\">거래가 택배·분할 결제처럼 복잡해질수록 설명도 더 꼼꼼해야 해요. 지문 4번은 중세 후반 경제가 복잡해지자 <b>더 정확한 의사소통</b>이 더 필요해졌다고 말해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">A shared language</div><div class=\"k\">공유된 언어는</div></div><div class=\"rc\"><div class=\"e\">facilitated</div><div class=\"k\">용이하게 했다</div></div><div class=\"rc\"><div class=\"e\">clarification</div><div class=\"k\">명확화와</div></div><div class=\"rc\"><div class=\"e\">and possibly settlement</div><div class=\"k\">아마도 해결을</div></div><div class=\"rc\"><div class=\"e\">of any disputes.</div><div class=\"k\">어떤 분쟁의.</div></div><div class=\"rnat\">공용어는 어떤 분쟁이든 명확히 밝히고 아마도 해결하는 일까지 수월하게 만들었다.</div><div class=\"rst\">둘 다 같은 말로 대화하니 “충전기 빠졌잖아요!” 같은 다툼도 쉽게 풀려요. = 지문 5번, 공유된 언어가 분쟁 해결을 쉽게 했다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In international trade also</div><div class=\"k\">국제 무역에서도 또한</div></div><div class=\"rc ckc\"><div class=\"e\">the use of a <span class=\"cw\">precise and well-formulated language</span></div><div class=\"k\"><span class=\"cw\">정확하고 잘 표현된 언어</span>의 사용은</div></div><div class=\"rc\"><div class=\"e\">aided the process of translation.</div><div class=\"k\">통역(번역)의 과정을 도왔다.</div></div><div class=\"rnat\">국제 무역에서도 정확하고 잘 다듬어진 언어의 사용이 통역(번역)의 과정을 도왔다.</div><div class=\"rst\">외국 판매자와 거래할 때도 정확한 문장으로 써야 번역기가 제대로 옮겨 줘요. 지문 6번은 국제 무역에서도 <b>정확한 언어</b>가 통역을 도왔다고 말해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The Silk Road</div><div class=
