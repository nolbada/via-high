 다음에 to stay 머물게가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The rain caused us stay home.</div><div class=\"ko\">us(우리) 뒤에 to 없이 stay(머물다)를 써서 틀려요. cause는 make(~하게 하다)와 달라요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The rain made us stay home.</div><div class=\"ko\">make(~하게 하다)는 사역동사라 원형 stay(머물다)가 맞아요. cause와 비교해 보세요.</div></div><p class=\"gb\">지문 6번도 causing(~하게 만들면서) + the salaries(급여) 다음이라 to look(보이게)이 딱 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">is 이다</span><span class=\"why\">1번의 주어는 The process(과정)예요. 뒤의 of job advancement in the field of sports(스포츠 분야에서의 직업 상승의)는 꾸며 주는 말일 뿐이라, 단수 주어 process(과정)에 맞춰 is(이다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치: 꾸며 주는 전치사구는 건너뛰고 진짜 주어에 맞추기</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The box of apples is heavy.</div><div class=\"ko\">사과 상자는 무겁다. (주어는 box 상자 하나라서 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The box of apples are heavy.</div><div class=\"ko\">apples(사과들)에 속아 are를 써서 틀려요. 진짜 주어는 box(상자)예요.</div></div><p class=\"gb\">지문 1번도 진짜 주어가 The process(과정) 하나라 is(이다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">increasingly 점점 더</span><span class=\"why\">3번은 becomes(~해지다) ② tough(치열한) 구조예요. tough(치열한)는 형용사 보어이고, 그 형용사를 꾸며 주는 자리라 부사 increasingly(점점 더)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">형용사를 꾸미는 자리는 부사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The test became really hard.</div><div class=\"ko\">시험이 정말 어려워졌다. (형용사 hard 어려운을 꾸며서 부사 really 정말이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The test became real hard.</div><div class=\"ko\">real(진짜의)은 형용사라 형용사 hard(어려운)를 꾸밀 수 없어서 틀려요.</div></div><p class=\"gb\">지문 3번도 형용사 tough(치열한)를 꾸며 주니 부사 increasingly(점점 더)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">where 그곳에서</span><span class=\"why\">7번은 the National Football League(전미 미식축구 연맹), 즉 장소 같은 선행사 뒤예요. 뒤 절 head coaches can earn many times more(감독들은 몇 배를 더 벌 수 있다)가 주어·동사·목적어를 다 갖춘 완전한 절이라 관계부사 where(그곳에서)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">관계부사 where(그곳에서) + 완전한 절 / which(그것) + 불완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the park where we play soccer.</div><div class=\"ko\">여기가 우리가 축구를 하는 공원이다. (we play soccer가 완전하니 where가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is the park which we play soccer.</div><div class=\"ko\">뒤 절이 완전한데 which(그것)를 써서 틀려요. which는 빈자리가 있어야 해요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the park which we visited.</div><div class=\"ko\">이곳은 우리가 방문한 공원이다. (visited 뒤 목적어가 비어서 which가 맞아요)</div></div><p class=\"gb\">지문 7번도 where(그곳에서) 뒤 head coaches can earn(감독들은 벌 수 있다)이 완전한 절이라 where(그곳에서)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The process</div><div class=\"k\">과정은</div></div><div class=\"rc\"><div class=\"e\">of job advancement</div><div class=\"k\">직업 상승(승진)의</div></div><div class=\"rc\"><div class=\"e\">in the field of sports</div><div class=\"k\">스포츠 분야에서의</div></div><div class=\"rc\"><div class=\"e\">is often said</div><div class=\"k\">종종 말해진다</div></div><div class=\"rc\"><div class=\"e\">to be shaped like a pyramid.</div><div class=\"k\">피라미드와 같은 모양이라고.</div></div><div class=\"rnat\">스포츠 분야에서 직업이 올라가는 과정은 흔히 피라미드 모양이라고 이야기된다.</div><div class=\"rst\">스포츠 분야에서 직업이 올라가는 길은 피라미드 모양이래요. 진짜 주어 The process(과정)가 하나라 is(이다)예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">That is,</div><div class=\"k\">즉,</div></div><div class=\"rc\"><div class=\"e\">at the wide base</div><div class=\"k\">넓은 하단부에는</div></div><div class=\"rc\"><div class=\"e\">are many jobs</div><div class=\"k\">많은 직업이 있다</div></div><div class=\"rc\"><div class=\"e\">with high school athletic teams,</div><div class=\"k\">고등학교 체육팀과 관련된,</div></div><div class=\"rc\"><div class=\"e\">while at the narrow tip</div><div class=\"k\">반면 좁은 꼭대기에는</div></div><div class=\"rc\"><div class=\"e\">are the few, highly desired jobs</div><div class=\"k\">몹시 갈망하는 소수의 직업이 있다</div></div><div class=\"rc\"><div class=\"e\">with professional organizations.</div><div class=\"k\">전문적인 조직과 관련된.</div></div><div class=\"rnat\">즉 넓은 밑바닥에는 고등학교 운동부와 관련된 일자리가 잔뜩 있는 반면, 좁은 꼭대기에는 프로 구단의 소수 선망 직종이 자리한다.</div><div class=\"rst\"><b>즉</b>(That is) 밑바닥엔 고등학교 운동부 일자리가 많고, 꼭대기엔 모두가 원하는 프로 구단 일자리가 조금 있어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Thus there are many sports jobs altogether,</div><div class=\"k\">그래서 전체적으로 보면 많은 스포츠 일자리가 있지만,</div></div><div class=\"rc\"><div class=\"e\">but the competition</div><div class=\"k\">경쟁은</div></div><div class=\"rc\"><div class=\"e\">becomes increasingly tough</div><div class=\"k\">점점 더 치열해진다</div></div><div class=\"rc\"><div class=\"e\">as one works their way up.</div><div class=\"k\">사람이 위로 올라갈수록.</div></div><div class=\"rnat\">그래서 스포츠 관련 일자리는 전부 합치면 많지만, 위로 올라갈수록 경쟁은 점점 더 치열해진다.</div><div class=\"rst\">일자리는 많지만 위로 갈수록 경쟁이 점점 세져요. 형용사 tough(치열한)를 부사 increasingly(점점 더)가 꾸며요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The salaries of various positions</div><div class=\"k\">다양한 직위(직종)의 급여는</div></div><div class=\"rc\"><div class=\"e\">reflect this pyramid model.</div><div class=\"k\">이 피라미드 모델을 반영한다.</div></div><div class=\"rnat\">여러 직위의 급여가 이 피라미드 모형을 그대로 보여 준다.</div><div class=\"rst\">급여도 이 피라미드와 똑같은 모양이에요. 지문 4번 뒤로 그 예시가 이어져요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">high school football coaches</div><div class=\"k\">고등학교 미식축구 코치들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">are typically teachers</span></div><div class=\"k\"><span class=\"cw\">보통 교사들이다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">who are paid</span></div><div class=\"k\"><span class=\"cw\">지급받는</span> (who = 교사들) ※ 문제지엔 paid로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">a little extra</div><div class=\"k\">약간의 추가 수당을</div></div><div class=\"rc\"><div class=\"e\">for their afterclass work.</div><div class=\"k\">그들의 방과 후 일에 대해.</div></div><div class=\"rnat\">예를 들어 고등학교 미식축구 코치는 보통 방과 후 업무에 대해 약간의 수당을 &lt;b&gt;받는&lt;/b&gt; 교사들이다.</div><div class=\"rst\"><b>예를 들어</b> 고등학교 코치는 방과 후 일로 수당을 조금 <b>받는</b> 교사예요. 교사는 받는 쪽이라 <b>are paid</b>(지급받는)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">But coaches of the same sport</div><div class=\"k\">하지만 같은 종목의 코치들은</div></div><div class=\"rc\"><div class=\"e\">at big universities</div><div class=\"k\">큰 대학의</div></div><div class=\"rc\"><div class=\"e\">can earn more than $1 million a year,</div><div class=\"k\">한 해에 백만 달러 넘게 벌 수 있다,</div></div><div class=\"rc\"><div class=\"e\">causing the salaries of college presidents</div><div class=\"k\">대학 총장들의 급여가</div></div><div class=\"rc\"><div class=\"e\">to look small in comparison.</div><div class=\"k\">비교하면 작아 보이게 만들면서.</div></div><div class=\"rnat\">하지만 큰 대학의 같은 종목 코치는 연간 백만 달러 넘게 벌어, 대학 총장의 연봉이 비교하면 작아 보이게 만든다.</div><div class=\"rst\">하지만 큰 대학 코치는 한 해 백만 달러 넘게 벌어 총장 연봉도 작아 보여요. cause(~하게 만들다) + 대상 + to look(보이게)이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">One degree higher up</div><div class=\"k\">한 단계 더 위는</div></div><div class=\"rc\"><div class=\"e\">is the National Football League,</div><div class=\"k\">전미 미식축구 연맹(NFL)이다,</div></div><div class=\"rc\"><div class=\"e\">where head coaches</div><div class=\"k\">그곳에서 감독들은</div></div><div class=\"rc\"><div class=\"e\">can earn many times more</div><div class=\"k\">몇 배를 더 벌 수 있다</div></div><div class=\"rc\"><div class=\"e\">than their best-paid campus counterparts.</div><div class=\"k\">가장 높은 급여를 받는 대학 쪽 상대들(대학 감독들)보다.</div></div><div class=\"rnat\">한 단계 더 위가 미국 프로 미식축구 리그인데, 그곳에서는 감독이 가장 높은 연봉을 받는 대학 상대 감독들보다 몇 배를 벌 수 있다.</div><div class=\"rst\">한 단계 위 프로 리그 감독은 대학 감독보다 몇 배를 더 벌어요. 뒤 절이 완전해서 where(그곳에서)예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"advancement\" data-m=\"승진, 향상\"><b>advancement</b>승진, 향상</button><button type=\"button\" class=\"wdb\" data-w=\"highly desired\" data-m=\"선망의 대상인\"><b>highly desired</b>선망의 대상인</button><button type=\"button\" class=\"wdb\" data-w=\"altogether\" data-m=\"전부 합쳐\"><b>altogether</b>전부 합쳐</button><button type=\"button\" class=\"wdb\" data-w=\"increasingly\" data-m=\"점점 더\"><b>increasingly</b>점점 더</button><button type=\"button\" class=\"wdb\" data-w=\"in comparison\" data-m=\"비교해 보면\"><b>in comparison</b>비교해 보면</button><button type=\"button\" class=\"wdb\" data-w=\"counterpart\" data-m=\"상대, 대응하는 사람\"><b>counterpart</b>상대, 대응하는 사람</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">2·3번이 <b>창문 밖에서 멀리 바라보는 느낌</b>을 객관적 시점의 목표로 세웠어요. 4번의 <b>this window effect</b>(이 창문 효과)는 만들려는 것인데, 그걸 '피한다'고 하면 방향이 거꾸로예요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 목표가 되는 장면</span><div class=\"en\">Ford considered the camera <mark>to be a window</mark> and the audience to be outside the window viewing the people and events within.</div><p class=\"ko\">Ford는 카메라를 <mark>창문으로</mark>, 그리고 관객은 안쪽의 사람들과 사건들을 바라보면서 창문 밖에 있다고 여겼다.</p></div><div class=\"ck-via\"><i>▼</i><span>창문 밖 관객 = 멀리서 바라보기만 하는 사람</span></div><div class=\"ck-step\"><span class=\"lab\">3번 · 같은 방향 확인</span><div class=\"en\">We are asked to watch the actions as if they were taking place <mark>at a distance</mark>, and we are not asked to participate.</div><p class=\"ko\">우리는 사건들을 마치 <mark>멀리서</mark> 일어나고 있는 것처럼 바라보도록 요청받고, 참여하도록 요청받지는 않는다.</p></div><div class=\"ck-via\"><i>▼</i><span>this window effect(이 창문 효과) = 2·3번의 그 느낌</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ②번 자리 (4번)</span><div class=\"en\">The objective point of view employs a static camera as much as possible in order to <u>② avoid</u> this window effect, …</div><p class=\"ko\">객관적 시점은 이 창문 효과를 ( 피하기? ) 위해 정적인 카메라를 쓴다 → 만들어 내기가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>정적인 카메라와 배우에 집중하기는 창문 효과를 만드는 방법이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 · 결정적 단서</span><div class=\"en\">… in order to <mark>produce this window effect</mark>, and it concentrates on the actors and the action without drawing attention to the camera.</div><p class=\"ko\"><mark>이 창문 효과</mark>를 만들어 내기 위해, 그리고 그것은 카메라에 관심을 끌지 않으면서 배우들과 사건에 집중한다.</p></div><div class=\"ck-via\"><i>▼</i><span>끼어들지 않고 기록만 = 창문 밖에서 바라보기</span></div><div class=\"ck-step\"><span class=\"lab\">7번 · 결과로 확인</span><div class=\"en\">The objective camera does not comment on or interpret the action but merely records it, letting it unfold.</div><p class=\"ko\">객관적 카메라는 사건을 논평하거나 해석하지 않고 단지 그것을 기록하며, 그것(= 사건)이 펼쳐지게 둔다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">produce(만들어 내다) ↔ avoid(피하다)</p><p class=\"gr\">in order to(~하기 위해) 뒤에는 '목표'가 와요. 그 목표가 글에서 원하는 것이면 produce(만들어 내다), 싫어하는 것이면 avoid(피하다)예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>We turn off the lights to make the room dark for the movie.</div><div class=\"ko\">영화를 보려고 방을 어둡게 만들기 위해 불을 꺼요. (어두운 방이 목표 → 만들다)</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>We wear helmets to avoid getting hurt.</div><div class=\"ko\">다치는 걸 피하려고 헬멧을 써요. (다치기는 싫은 것 → 피하다)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>We turn off the lights to avoid a dark room for the movie.</div><div class=\"ko\">어두운 방이 목표인데 '피하려고' 불을 끈다? 방향이 거꾸로라 틀려요.</div></div><p class=\"gb\">지문 4번의 this window effect(이 창문 효과)는 2·3번에서 원하던 장면이에요. 그래서 avoid(피하다)가 아니라 produce(만들어 내다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">avoid → produce (만들어 내다)<small>창문 효과는 객관적 시점이 노리는 목표라서 피하는(avoid) 게 아니라 만들어 내는(produce) 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">interpret 해석하다</span><span class=\"why\">7번은 does not comment on or interpret(논평하거나 해석하지 않는다)라는 부정문이에요. 해석하지 않고 merely records(단지 기록한다)니까, 끼어들지 않는 창문 밖 관객 방향과 딱 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">outside 바깥에</span><span class=\"why\">2번에서 카메라가 window(창문)이고 관객은 안을 들여다보는 쪽이라 outside(바깥에)가 맞아요. 3번의 at a distance(멀리서)와도 같은 방향이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">straightforwardly 담백하게, 단도직입적으로</span><span class=\"why\">5번 앞부분이 emotional distance(정서적 거리)를 말하고, 카메라는 simply to be recording(그저 기록하는)이에요. 꾸미지 않고 있는 그대로 담으니 straightforwardly(담백하게)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">little 거의 없는</span><span class=\"why\">9번 앞에서 카메라가 unnoticeably(눈에 띄지 않게) 움직인다고 했고, 4번도 without drawing attention to the camera(카메라에 관심을 끌지 않으면서)라고 했어요. 그래서 주의를 little(거의 없게) 끈다가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The objective point of view</div><div class=\"k\">객관적 시점은</div></div><div class=\"rc\"><div class=\"e\">is illustrated</div><div class=\"k\">설명된다</div></div><div class=\"rc\"><div class=\"e\">by John Ford's “philosophy of camera.”</div><div class=\"k\">John Ford의 '카메라의 철학'으로.</div></div><div class=\"rnat\">객관적 시점은 John Ford의 '카메라의 철학'으로 잘 설명된다.</div><div class=\"rst\">학교 축제 날, 반 연극을 찍는 방법 중 '객관적 시점'이 있어요. 지문 1번은 John Ford(존 포드)의 카메라 철학으로 그걸 설명해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Ford considered the camera</div><div class=\"k\">Ford는 카메라를 여겼다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to be a window</span></div><div class=\"k\"><span class=\"cw\">창문으로</span></div></div><div class=\"rc\"><div class=\"e\">and the audience</div><div class=\"k\">그리고 관객은</div></div><div class=\"rc\"><div class=\"e\">to be outside the window</div><div class=\"k\">창문 밖에 있다고</div></div><div class=\"rc\"><div class=\"e\">viewing the people and events within.</div><div class=\"k\">안쪽의 사람들과 사건들을 바라보면서.</div></div><div class=\"rnat\">Ford는 카메라를 창문으로, 관객을 그 창문 &lt;b&gt;바깥에서&lt;/b&gt; 안쪽의 사람과 사건을 들여다보는 존재로 여겼다.</div><div class=\"rst\">카메라는 교실 <b>창문</b>(window)이고, 우리는 복도 <b>창문 밖</b>(outside)에서 안의 연극을 구경하는 거예요. = 지문 2번이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">We are asked</div><div class=\"k\">우리는 요청받는다</div></div><div class=\"rc\"><div class=\"e\">to watch the actions</div><div class=\"k\">사건들을 바라보도록</div></div><div class=\"rc ckc\"><div class=\"e\">as if they were taking place <span class=\"cw\">at a distance</span>,</div><div class=\"k\">마치 그것들(= 사건들)이 <span class=\"cw\">멀리서</span> 일어나고 있는 것처럼,</div></div><div class=\"rc\"><div class=\"e\">and we are not asked to participate.</div><div class=\"k\">그리고 참여하도록 요청받지는 않는다.</div></div><div class=\"rnat\">우리는 그 사건들이 마치 멀찍이서 벌어지는 것처럼 바라보도록 요구받을 뿐, 거기에 끼어들라는 요구는 받지 않는다.</div><div class=\"rst\">우리는 멀리서 보기만 하고 무대에 끼어들지는 않아요. = 지문 3번, <b>멀리서</b>(at a distance) 보라는 요청이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">The objective point of view</div><div class=\"k\">객관적 시점은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">employs a static camera</span></div><div class=\"k\"><span class=\"cw\">정적인 카메라를 이용한다</span></div></div><div class=\"rc\"><div class=\"e\">as much as possible</div><div class=\"k\">가능한 한 많이</div></div><div class=\"rc ckc\"><div class=\"e\">in order to <span class=\"cw\">produce this window effect</span>,</div><div class=\"k\"><span class=\"cw\">이 창문 효과</span>(= 관객이 창문 밖에서 안을 들여다보는 효과)를 만들어 내기 위해, ※ 문제지엔 avoid로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">and it</div><div class=\"k\">그리고 그것(= 객관적 시점)은</div></div><div class=\"rc\"><div class=\"e\">concentrates on the actors and the action</div><div class=\"k\">배우들과 사건에 집중한다</div></div><div class=\"rc\"><div class=\"e\">without drawing attention to the camera.</div><div class=\"k\">카메라에 관심을 끌지 않으면서.</div></div><div class=\"rnat\">객관적 시점은 이 창문 효과를 &lt;b&gt;피하기(→만들어 내기)&lt;/b&gt; 위해 가능한 한 정적인 카메라를 쓰며, 카메라로 시선을 끌지 않은 채 배우와 사건에 집중한다.</div><div class=\"rst\">그래서 카메라를 한자리에 가만히 두고 배우만 비춰요. = 지문 4번, 이 <b>창문 효과</b>(window effect)를 <b>만들어 내려는</b>(produce) 거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The objective camera suggests</div><div class=\"k\">객관적 카메라는 보여 준다</div></div><div class=\"rc\"><div class=\"e\">an emotional distance</div><div class=\"k\">정서적 거리를</div></div><div class=\"rc\"><div class=\"e\">between camera and subject;</div><div class=\"k\">카메라와 대상 사이의;</div></div><div class=\"rc\"><div class=\"e\">the camera seems</div><div class=\"k\">카메라는 ~처럼 보인다</div></div><div class=\"rc\"><div class=\"e\">simply to be recording,</div><div class=\"k\">그저 기록하고 있는 것처럼,</div></div><div class=\"rc\"><div class=\"e\">as straightforwardly as possible,</div><div class=\"k\">가급적 솔직하게,</div></div><div class=\"rc\"><div class=\"e\">the characters and actions of the story.</div><div class=\"k\">이야기의 등장인물과 사건을.</div></div><div class=\"rnat\">객관적 카메라는 카메라와 대상 사이에 정서적 거리가 있음을 보여 준다. 카메라는 이야기의 인물과 사건을 가급적 &lt;b&gt;솔직하게&lt;/b&gt; 그저 기록만 하고 있는 듯 보인다.</div><div class=\"rst\">카메라는 감정을 섞지 않고 연극을 있는 그대로 찍어요. = 지문 5번, 정서적 거리를 두고 담백하게 기록한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">For the most part,</div><div class=\"k\">대체로,</div></div><div class=\"rc\"><div class=\"e\">the director uses</div><div class=\"k\">감독은 사용한다</div></div><div class=\"rc\"><div class=\"e\">natural, normal types</div><div class=\"k\">자연스럽고 평범한 유형의</div></div><div class=\"rc\"><div class=\"e\">of camera positioning and camera angles.</div><div class=\"k\">카메라 위치와 각도를.</div></div><div class=\"rnat\">대체로 감독은 자연스럽고 평범한 유형의 카메라 위치와 각도를 쓴다.</div><div class=\"rst\">괜히 바닥에서 올려 찍지 않고, 보통 눈높이 자리에서 평범하게 찍어요. = 지문 6번, 자연스럽고 평범한 위치·각도예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The objective camera</div><div class=\"k\">객관적 카메라는</div></div><div class=\"rc\"><div class=\"e\">does not comment on or interpret the action</div><div class=\"k\">사건을 논평하거나 해석하지 않고</div></div><div class=\"rc\"><div class=\"e\">but merely records it,</div><div class=\"k\">단지 그것을 기록하며,</div></div><div class=\"rc\"><div class=\"e\">letting it unfold.</div><div class=\"k\">그것(= 사건)이 펼쳐지게 둔다.</div></div><div class=\"rnat\">객관적 카메라는 사건을 논평하거나 &lt;b&gt;해석하지&lt;/b&gt; 않고 그저 기록하며, 사건이 스스로 펼쳐지게 둔다.</div><div class=\"rst\">“여기가 슬픈 장면!” 하고 설명하지 않고 그냥 찍기만 해요. = 지문 7번, 해석하지 않고 <b>단지 기록한다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">We see the action</div><div class=\"k\">우리는 사건을 본다</div></div><div class=\"rc\"><div class=\"e\">from the viewpoint</div><div class=\"k\">시점에서</div></div><div class=\"rc\"><div class=\"e\">of an impersonal observer.</div><div class=\"k\">냉담한 관찰자의.</div></div><div class=\"rnat\">우리는 냉담한 관찰자의 시점에서 그 사건을 본다.</div><div class=\"rst\">그래서 보는 사람도 한 발 떨어진 구경꾼처럼 연극을 봐요. = 지문 8번, 냉담한 관찰자의 시점이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">If the camera moves,</div><div class=\"k\">만약 카메라가 움직인다면,</div></div><div class=\"rc\"><div class=\"e\">it does so unnoticeably,</div><div class=\"k\">그것은 눈에 띄지 않게 그렇게 한다,</div></div><div class=\"rc\"><div class=\"e\">calling as little attention to itself as possible.</div><div class=\"k\">자신(= 카메라)에게 가능한 한 거의 주의를 끌지 않으면서.</div></div><div class=\"rnat\">카메라가 움직인다면 눈에 띄지 않게 움직여, 자신에게 &lt;b&gt;가능한 한 적게&lt;/b&gt; 주의를 끈다.</div><div class=\"rst\">카메라를 옮겨야 할 땐 아무도 모르게 살짝 움직여요. = 지문 9번, 자신에게 주의를 거의 끌지 않는다는 말이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"objective\" data-m=\"객관적인\"><b>objective</b>객관적인</button><button type=\"button\" class=\"wdb\" data-w=\"at a distance\" data-m=\"멀리서\"><b>at a distance</b>멀리서</button><button type=\"button\" class=\"wdb\" data-w=\"static\" data-m=\"정적인\"><b>static</b>정적인</button><button type=\"button\" class=\"wdb\" data-w=\"drawing attention to\" data-m=\"~에 관심을 끄는 것\"><b>drawing attention to</b>~에 관심을 끄는 것</button><button type=\"button\" class=\"wdb\" data-w=\"merely\" data-m=\"그저, 단지\"><b>merely</b>그저, 단지</button><button type=\"button\" class=\"wdb\" data-w=\"impersonal\" data-m=\"냉담한, 인간미 없는\"><b>impersonal</b>냉담한, 인간미 없는</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>첫 문장</b>에 있으면 이야기 전체가 무엇을 보여 주는지 묻는 거예요. 이야기가 끝난 뒤 <b>마지막 문장(13번)의 정리</b>가 빈칸을 그대로 되풀이해요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">Jacqueline Novogratz, the founder of the Acumen Fund, tells a story that <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">Acumen Fund의 설립자 Jacqueline Novogratz는 ( ? ) 이야기를 해 준다</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>열두 살 때 삼촌에게 파란 스웨터를 받음</span><span><em>7번</em>작아져서 고1 때 자선단체에 기증함</span><span><em>9번</em>11년 뒤 Rwanda(르완다)에서 비슷한 스웨터 입은 소년 발견</span><span><em>12번</em>꼬리표에 바로 그녀의 이름이 있었음</span></div><div class=\"ck-eq\">⇒ 멀리 떠나보낸 스웨터가 지구 반대편에서 다시 이어짐</div></div><div class=\"ck-via\"><i>▼</i><span>기증한 바로 그 스웨터였다는 확인</span></div><div class=\"ck-step\"><span class=\"lab\">12번 문장 · 이야기의 반전</span><div class=\"en\">Yes, <mark>there was her name</mark>.</div><p class=\"ko\">그렇다, <mark>그녀의 이름이 있었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>스웨터 사건을 '우리 모두'의 이야기로 한 줄 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">13번 문장 · 결정적 단서</span><div class=\"en\">It was enough to remind Jacqueline — and the rest of us — of <mark>the threads of our connection</mark> to one another.</div><p class=\"ko\">그것은 Jacqueline에게 — 그리고 나머지 우리들에게 — 서로에 대한 <mark>우리의 연결의 실을</mark> 상기시키기에 충분했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">demonstrates how connected we all are 우리 모두가 얼마나 연결되어 있는지를 보여 준다<small>13번 the threads of our connection(우리의 연결의 실) + the rest of us(나머지 우리들)를 그대로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">emphasizes the importance of women's roles 여성의 역할이 지니는 중요성을 강조한다</span><span class=\"why\">8번의 poor women(빈곤 여성)만 따온 함정이에요. 그건 그녀가 Rwanda(르완다)에 간 이유일 뿐, 이야기의 중심은 2번처럼 a blue sweater(파란 스웨터)예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">reminds us of the relative value of time 시간의 상대적 가치를 상기시킨다</span><span class=\"why\">8번 Eleven years later(11년 후)는 시간이 흐른 걸 알려 줄 뿐이에요. 13번이 상기시키는 건 시간의 가치가 아니라 연결이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">describes a hard life with a happy ending 힘든 삶과 행복한 결말을 묘사한다</span><span class=\"why\">누군가의 힘든 삶을 그린 장면이 없어요. 6번 스웨터가 작아진 일도 힘든 삶이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">shows how many opportunities there are in Africa 아프리카에 기회가 얼마나 많은지를 보여 준다</span><span class=\"why\">8번에 Rwanda(르완다)가 나오지만, 그곳의 기회 이야기는 하나도 없어요. 13번은 우리 모두의 연결을 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Jacqueline Novogratz,</div><div class=\"k\">Jacqueline Novogratz는,</div></div><div class=\"rc\"><div class=\"e\">the founder of the Acumen Fund,</div><div class=\"k\">Acumen Fund의 설립자인,</div></div><div class=\"rc\"><div class=\"e\">tells a story</div><div class=\"k\">이야기를 해 준다</div></div><div class=\"rc ckc\"><div class=\"e\">that demonstrates <span class=\"cw\">how connected we all are</span>.</div><div class=\"k\">우리 모두가 <span class=\"cw\">어떻게 연결되어 있는지</span>를 보여 주는. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">Acumen Fund의 설립자 Jacqueline Novogratz는 &lt;b&gt;우리 모두가 어떻게 연결되어 있는지를 보여 주는&lt;/b&gt; 이야기를 해 준다.</div><div class=\"rst\">어떤 이야기가 “우리는 다 이어져 있다”는 걸 보여 줘요. = 지문 1번, 빈칸은 바로 이 <b>연결</b> 이야기예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Her story</div><div class=\"k\">그녀의 이야기는</div></div><div class=\"rc\"><div class=\"e\">centers on a blue sweater.</div><div class=\"k\">파란 스웨터 한 벌에 초점을 맞춘다.</div></div><div class=\"rnat\">그녀의 이야기는 파란 스웨터 한 벌에 초점을 맞춘다.</div><div class=\"rst\">이야기의 주인공은 사람이 아니라 옷 한 벌이에요. = 지문 2번, 파란 스웨터 한 벌이 중심이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It</div><div class=\"k\">그것은 (= 파란 스웨터)</div></div><div class=\"rc\"><div class=\"e\">was given to her</div><div class=\"k\">그녀에게 주어졌다</div></div><div class=\"rc\"><div class=\"e\">by her uncle Ed</div><div class=\"k\">삼촌 Ed로부터</div></div><div class=\"rc\"><div class=\"e\">when she was twelve.</div><div class=\"k\">그녀가 열두 살 때.</div></div><div class=\"rnat\">그것은 그녀가 열두 살 때 삼촌 Ed로부터 그녀에게 주어진 것이다.</div><div class=\"rst\">삼촌에게 선물로 옷을 받은 장면을 떠올려 봐요. = 지문 3번, 열두 살 때 삼촌 Ed(에드)가 준 스웨터예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">“I loved that soft wool sweater</div><div class=\"k\">'저는 그 부드러운 모직 스웨터를 좋아했어요</div></div><div class=\"rc\"><div class=\"e\">with its striped sleeves</div><div class=\"k\">줄무늬 소매(its = 스웨터의)가 있고</div></div><div class=\"rc\"><div class=\"e\">and two zebras in the front,”</div><div class=\"k\">앞쪽에 얼룩말 두 마리가 있는'</div></div><div class=\"rc\"><div class=\"e\">she says.</div><div class=\"k\">라고 그녀는 말한다.</div></div><div class=\"rnat\">\"저는 줄무늬 소매와 앞쪽에 얼룩말 두 마리가 있는 그 부드러운 모직 스웨터를 좋아했어요.\"라고 그녀는 말한다.</div><div class=\"rst\">그 옷이 너무 좋아서 매일 입고 싶었어요. = 지문 4번, 줄무늬 소매와 얼룩말 두 마리가 있는 스웨터를 좋아했대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">She even wrote her name</div><div class=\"k\">그녀는 심지어 자기 이름을 써 두었다</div></div><div class=\"rc\"><div class=\"e\">on the tag.</div><div class=\"k\">꼬리표에.</div></div><div class=\"rnat\">그녀는 심지어 꼬리표에 그녀의 이름도 써 두었다.</div><div class=\"rst\">잃어버릴까 봐 옷 꼬리표에 이름까지 써 뒀어요. = 지문 5번, 그 이름이 나중에 결정적 증거가 돼요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">But the sweater got too tight for her</div><div class=\"k\">그러나 그 스웨터는 그녀에게 너무 꽉 끼게 되었다</div></div><div class=\"rc\"><div class=\"e\">as she grew older.</div><div class=\"k\">그녀가 나이가 들면서.</div></div><div class=\"rnat\">그러나 그녀가 나이가 들면서 그 스웨터는 그녀에게 너무 꽉 끼게 되었다.</div><div class=\"rst\">그런데 키가 크면서 옷이 꽉 끼게 됐어요. = 지문 6번, 나이가 들면서 스웨터가 작아졌어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">So in her freshman year of high school</div><div class=\"k\">그래서 고등학교 1학년 때</div></div><div class=\"rc\"><div class=\"e\">she donated it</div><div class=\"k\">그녀는 그것(= 스웨터)을 기증했다</div></div><div class=\"rc\"><div class=\"e\">to a charity.</div><div class=\"k\">자선단체에.</div></div><div class=\"rnat\">그래서 고등학교 1학년 때 그녀는 그것을 자선단체에 기증했다.</div><div class=\"rst\">그래서 고1 때 아끼던 옷을 기부함에 넣었어요. = 지문 7번, 스웨터를 자선단체에 기증했어요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Eleven years later,</div><div class=\"k\">11년 후,</div></div><div class=\"rc\"><div class=\"e\">she was jogging in Kigali, Rwanda,</div><div class=\"k\">그녀는 Rwanda의 Kigali에서 조깅을 하고 있었다,</div></div><div class=\"rc\"><div class=\"e\">where she was working</div><div class=\"k\">그곳에서 그녀는 일하고 있었다</div></div><div class=\"rc\"><div class=\"e\">to set up an aid program for poor women.</div><div class=\"k\">빈곤 여성을 위한 지원 프로그램을 설립하기 위해.</div></div><div class=\"rnat\">11년 후, 그녀는 Rwanda의 Kigali에서 조깅을 하고 있었는데, 거기서 그녀는 빈곤 여성을 위한 지원 프로그램을 설립하기 위하여 일하고 있었다.</div><div class=\"rst\">11년 뒤, 그녀는 멀리 아프리카에서 일하고 있었어요. 내가 커서 먼 나라에 간 것처럼요. = 지문 8번, Rwanda(르완다) Kigali(키갈리)예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Suddenly,</div><div class=\"k\">갑자기,</div></div><div class=\"rc\"><div class=\"e\">she spotted a little boy</div><div class=\"k\">그녀는 어린 소년을 발견했다</div></div><div class=\"rc\"><div class=\"e\">wearing a similar sweater.</div><div class=\"k\">비슷한 스웨터를 입고 있는.</div></div><div class=\"rnat\">갑자기, 그녀는 비슷한 스웨터를 입고 있는 한 어린 소년을 발견했다.</div><div class=\"rst\">그때 길에서 내 옷이랑 똑같아 보이는 옷을 입은 아이를 봐요. = 지문 9번, 비슷한 스웨터를 입은 소년이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Could it be?</div><div class=\"k\">(혹시) 그것(= 그 스웨터)일까?</div></div><div class=\"rnat\">(혹시) 그것일까?</div><div class=\"rst\">“설마… 내 옷?” 하고 깜짝 놀라요. = 지문 10번, 혹시 그 스웨터일까 하는 마음이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">She ran over to him</div><div class=\"k\">그녀는 그에게 달려갔다</div></div><div class=\"rc\"><div class=\"e\">and checked out the tag.</div><div class=\"k\">그리고 꼬리표를 확인했다.</div></div><div class=\"rnat\">그녀는 그에게 달려가서 꼬리표를 확인했다.</div><div class=\"rst\">달려가서 꼬리표를 뒤집어 봐요. = 지문 11번, 꼬리표를 확인했어요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Yes,</div><div class=\"k\">그렇다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">there was her name</span>.</div><div class=\"k\"><span class=\"cw\">그녀의 이름이 있었다</span>.</div></div><div class=\"rnat\">그렇다, 그녀의 이름이 있었다.</div><div class=\"rst\">정말로 내가 쓴 이름이 있어요! = 지문 12번, <b>그녀의 이름이 있었다</b>는 반전이에요.</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">13번 · 단서</span><div class=\"rc\"><div class=\"e\">It was enough</div><div class=\"k\">그것은 충분했다</div></div><div class=\"rc\"><div class=\"e\">to remind Jacqueline</div><div class=\"k\">Jacqueline에게 상기시키기에</div></div><div class=\"rc\"><div class=\"e\">— and the rest of us —</div><div class=\"k\">— 그리고 나머지 우리들에게 —</div></div><div class=\"rc ckc\"><div class=\"e\">of <span class=\"cw\">the threads of our connection</span></div><div class=\"k\"><span class=\"cw\">우리의 연결의 실을</span></div></div><div class=\"rc\"><div class=\"e\">to one another.</div><div class=\"k\">서로에 대한.</div></div><div class=\"rnat\">그것은 Jacqueline에게, 그리고 나머지 우리들에게, &lt;b&gt;서로에 대한 우리의 연결의 실을 상기시켜 주기에&lt;/b&gt; 충분했다.</div><div class=\"rst\">옷 한 벌로도 우리가 실처럼 이어져 있다는 걸 알게 돼요. = 지문 13번, <b>우리의 연결의 실</b>이 빈칸의 답이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"founder\" data-m=\"설립자\"><b>founder</b>설립자</button><button type=\"button\" class=\"wdb\" data-w=\"centers on\" data-m=\"~을 중심으로 하다\"><b>centers on</b>~을 중심으로 하다</button><button type=\"button\" class=\"wdb\" data-w=\"donate\" data-m=\"기부하다\"><b>donate</b>기부하다</button><button type=\"button\" class=\"wdb\" data-w=\"charity\" data-m=\"자선 단체\"><b>charity</b>자선 단체</button><button type=\"button\" class=\"wdb\" data-w=\"spot\" data-m=\"발견하다\"><b>spot</b>발견하다</button><button type=\"button\" class=\"wdb\" data-w=\"thread\" data-m=\"실, 실타래\"><b>thread</b>실, 실타래</button></div>"};

  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
