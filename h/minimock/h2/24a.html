var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. messenger(전령)가 무엇을 전하는 사람인지 <b>바로 앞 3번</b>에서, 왜 쓰러지는지를 <b>2번</b>에서 찾아 속뜻으로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (4번)</span><div class=\"en\">We don’t want to be <mark>the innocent messenger</mark> who falls before a firing line.</div><p class=\"ko\">우리는 사선 앞에서 쓰러지는 <mark>무고한 전령</mark>이 되고 싶어 하지 않는다.</p></div><div class=\"ck-via\"><i>▼</i><span>messenger(전령)가 전하는 것 = 바로 앞 문장의 bad news(나쁜 소식)</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · messenger의 정체</span><div class=\"en\">it often requires of us the courage to <mark>deliver bad news</mark> to our superiors.</div><p class=\"ko\">그것은 종종 상사에게 <mark>나쁜 소식을 전달할</mark> 용기를 우리에게 요구한다.</p></div><div class=\"ck-via\"><i>▼</i><span>총알 = 소식을 들은 사람의 화, 즉 부정적인 감정</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · firing line(사선)의 정체</span><div class=\"en\">people want to avoid becoming <mark>the target of others’ negative emotions</mark>.</div><p class=\"ko\">사람들이 <mark>다른 사람들의 부정적인 감정의 표적이</mark> 되는 것을 피하고 싶어 하기 때문에</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>innocent</em>잘못한 게 없는(무고한)</span><span><em>messenger</em>상사에게 나쁜 소식을 전하는 사람</span><span><em>falls before a firing line</em>그 소식 때문에 총알(비난)을 대신 맞음</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 나쁜 소식을 전했다는 이유만으로 책임을 뒤집어쓰는 사람 → ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">불쾌한 소식을 전한 탓에 책임을 뒤집어쓰는 사람<small>잘못 없이(innocent 무고한) 나쁜 소식(bad news)을 전하다가 비난의 표적(target)이 된다는 뜻이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">침묵했다는 이유로 비난받는 직원</span><span class=\"why\">‘비난받는다’는 비슷하지만 이유가 반대예요. 밑줄 속 사람은 침묵해서가 아니라 3번처럼 나쁜 소식을 전해서(deliver bad news 나쁜 소식을 전하다) 맞는 사람이에요. 침묵은 2번 Mum Effect(침묵 효과)로 사람들이 피하려고 고르는 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">비폭력적 해결책을 추구하는 중재자</span><span class=\"why\">firing line(사선)을 글자 그대로 ‘싸움터’로 읽은 함정이에요. 지문에 싸움을 말리거나 해결책을 찾는 사람은 나오지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">상호 이해를 모색하는 협상가</span><span class=\"why\">서로 이해하려고 협상하는 장면은 지문에 없어요. 7번도 상사들이 소식을 덜 나쁘게 고쳐 올려 보내는 얘기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">상사의 관심을 얻고 싶어 하는 부하 직원</span><span class=\"why\">superiors(상사)는 3번에 나오지만, 지문 속 사람은 관심을 얻고 싶은 게 아니라 2번처럼 상사의 화의 표적(target)이 되는 걸 피하고 싶어 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Perhaps worse</div><div class=\"k\">아마도 더 나쁜 것은</div></div><div class=\"rc\"><div class=\"e\">than attempting to get the bad news out of the way</div><div class=\"k\">나쁜 소식을 먼저 처리해 넘어가려고 하는 것보다</div></div><div class=\"rc\"><div class=\"e\">is attempting to soften it</div><div class=\"k\">그것(= 나쁜 소식)을 완화하려고 하는 것이다</div></div><div class=\"rc\"><div class=\"e\">or simply not address it at all.</div><div class=\"k\">또는 아예 다루지 않으려고 하는 것이다.</div></div><div class=\"rnat\">아마도 나쁜 소식부터 먼저 이야기하고 넘어가려고 하는 것보다 더 나쁜 것은 그것을 완화하거나 전혀 다루지 않으려고 하는 것이다.</div><div class=\"rst\">반 청소 검사를 망쳤을 때 쌤께 아예 말 안 하거나 “조금 아쉬웠어요” 하고 줄여 말하는 게 더 나빠요. = 지문의 나쁜 소식을 <b>완화하거나</b>(soften) 안 다루기예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This “Mum Effect”</div><div class=\"k\">이 ‘침묵 효과’는</div></div><div class=\"rc\"><div class=\"e\">— a term coined by psychologists Sidney Rosen and Abraham Tesser in the early 1970s —</div><div class=\"k\">1970년대 초반에 심리학자 Sidney Rosen과 Abraham Tesser가 만든 용어인</div></div><div class=\"rc\"><div class=\"e\">happens because people want to avoid</div><div class=\"k\">발생한다, 사람들이 피하고 싶어 하기 때문에</div></div><div class=\"rc ckc\"><div class=\"e\">becoming <span class=\"cw\">the target of others’ negative emotions</span>.</div><div class=\"k\"><span class=\"cw\">다른 사람들의 부정적인 감정의 표적이</span> 되는 것을.</div></div><div class=\"rnat\">1970년대 초반에 심리학자인 Sidney Rosen과 Abraham Tesser가 만든 용어인 이 ‘침묵 효과’는 사람들이 다른 사람들의 부정적인 감정의 표적이 되는 것을 피하고 싶기 때문에 발생한다.</div><div class=\"rst\">왜 숨길까요? 쌤의 화를 맞는 <b>표적</b>(target)이 되기 싫어서예요. = 지문의 침묵 효과(Mum Effect)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">We all have the opportunity to lead change,</div><div class=\"k\">우리 모두는 변화를 이끌 기회를 가지고 있다,</div></div><div class=\"rc\"><div class=\"e\">yet it often requires of us</div><div class=\"k\">그러나 그것은 종종 우리에게 요구한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the courage to deliver bad news</span></div><div class=\"k\"><span class=\"cw\">나쁜 소식을 전달할 용기를</span></div></div><div class=\"rc\"><div class=\"e\">to our superiors.</div><div class=\"k\">우리의 상사에게.</div></div><div class=\"rnat\">우리 모두는 변화를 이끌 기회를 가지고 있으나, 그것은 종종 우리에게 우리의 상사에게 나쁜 소식을 전달할 용기를 요구한다.</div><div class=\"rst\">그래도 반이 나아지려면 누군가는 쌤께 “우리 반 청소가 엉망이에요” 하고 <b>나쁜 소식을 전할</b>(deliver bad news) 용기가 필요해요. 지문도 그렇게 말해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">We don’t want to be</div><div class=\"k\">우리는 되고 싶어 하지 않는다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the innocent messenger</span></div><div class=\"k\"><span class=\"cw\">무고한 전령</span>(불쾌한 소식을 전하는 데 책임을 지는 사람)이</div></div><div class=\"rc\"><div class=\"e\">who falls before a firing line.</div><div class=\"k\">사선 앞에서 쓰러지는.</div></div><div class=\"rnat\">우리는 사선 앞에서 쓰러지는 무고한 전령(불쾌한 소식을 전하는 데 책임을 지는 사람)이 되고 싶어 하지는 않는다.</div><div class=\"rst\"><b>그런데 말 꺼낸 내가 괜히 혼나는 사람</b>이 되긴 싫어요. 그래서 밑줄은 “나쁜 소식을 전한 탓에 책임을 뒤집어쓰는 사람”(⑤)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">When our survival instincts kick in,</div><div class=\"k\">우리의 생존 본능이 발동하면,</div></div><div class=\"rc\"><div class=\"e\">they can override our courage</div><div class=\"k\">그것(= 생존 본능)은 우리의 용기를 무효로 할 수 있다</div></div><div class=\"rc\"><div class=\"e\">until the truth of a situation gets watered down.</div><div class=\"k\">어떤 상황의 진상이 희석될 때까지.</div></div><div class=\"rnat\">우리의 생존 본능이 발동하면, 그것은 어떤 상황의 진상이 희석될 때까지 우리의 용기를 무효로 할 수 있다.</div><div class=\"rst\">혼날까 겁이 나면 용기가 쑥 사라지고, 사실을 물 타듯 흐리게 말하게 돼요. = 지문의 생존 본능이 용기를 누르고 진상이 희석된다예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">“The Mum Effect and the resulting filtering</div><div class=\"k\">“침묵 효과와 그로 인해 발생하는 여과는</div></div><div class=\"rc\"><div class=\"e\">can have devastating effects</div><div class=\"k\">파괴적인 결과를 가져올 수 있다</div></div><div class=\"rc\"><div class=\"e\">in a steep hierarchy,”</div><div class=\"k\">가파른 위계 관계에서,”</div></div><div class=\"rc\"><div class=\"e\">writes Robert Sutton,</div><div class=\"k\">Robert Sutton이 말한다,</div></div><div class=\"rc\"><div class=\"e\">an organizational psychologist.</div><div class=\"k\">조직 심리학자인.</div></div><div class=\"rnat\">“침묵 효과와 그로 인해 발생하는 여과는 가파른 위계 관계에서 파괴적인 결과를 가져올 수 있다.”라고 조직 심리학자 Robert Sutton이 말한다.</div><div class=\"rst\">친구 → 부반장 → 반장 → 쌤처럼 단계가 많을수록 이렇게 걸러 말하는 게 큰 문제가 돼요. 지문은 위계(hierarchy)에서 파괴적이라고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">“What starts out as bad news</div><div class=\"k\">“나쁜 소식으로 시작한 것이</div></div><div class=\"rc\"><div class=\"e\">becomes happier and happier</div><div class=\"k\">점점 더 좋아진다</div></div><div class=\"rc\"><div class=\"e\">as it travels up the ranks —</div><div class=\"k\">단계를 올라갈수록 —</div></div><div class=\"rc\"><div class=\"e\">because after each boss hears the news</div><div class=\"k\">왜냐하면 각 단계의 상사가 그 소식을 듣고 나서</div></div><div class=\"rc\"><div class=\"e\">from his or her subordinates,</div><div class=\"k\">자신의 부하 직원으로부터,</div></div><div class=\"rc\"><div class=\"e\">he or she makes it sound a bit less bad</div><div class=\"k\">그것을 다소 덜 나쁘게 들리도록 만들기 때문이다</div></div><div class=\"rc\"><div class=\"e\">before passing it up the chain.”</div><div class=\"k\">다음 단계로 넘어가기 전에.”</div></div><div class=\"rnat\">“나쁜 소식으로 시작한 것이 단계를 올라갈수록 점점 더 좋아진다. 그 이유는 각 단계의 상사가 자신의 부하 직원으로부터 그 소식을 듣고 나서 다음 단계로 넘어가기 전에 그것을 다소 덜 나쁘게 들리도록 만들기 때문이다.”</div><div class=\"rst\">부반장이 듣고 조금 줄이고, 반장이 듣고 또 줄이면 쌤께는 “괜찮아요”로 가요. 지문도 소식이 올라갈수록 점점 좋게 바뀐대요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"soften\" data-m=\"완화하다\"><b>soften</b>완화하다</button><button type=\"button\" class=\"wdb\" data-w=\"superior\" data-m=\"상사, 윗사람\"><b>superior</b>상사, 윗사람</button><button type=\"button\" class=\"wdb\" data-w=\"innocent\" data-m=\"무고한\"><b>innocent</b>무고한</button><button type=\"button\" class=\"wdb\" data-w=\"messenger\" data-m=\"전령, 전달자\"><b>messenger</b>전령, 전달자</button><button type=\"button\" class=\"wdb\" data-w=\"firing line\" data-m=\"사선, 최전방\"><b>firing line</b>사선, 최전방</button><button type=\"button\" class=\"wdb\" data-w=\"water down\" data-m=\"희석시키다, 약하게 하다\"><b>water down</b>희석시키다, 약하게 하다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">도표 불일치는 선지마다 숫자를 그래프와 대 보세요. 특히 <b>both A and B</b>(A와 B 둘 다)·<b>each</b>(각각) 같은 <b>범위 표현</b>이 붙은 선지는 나라 하나, 해 하나만 어긋나도 틀려요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>3번 문장: 모든 나라 2019년 > 2012년 → 도표와 같음</span><span><em>②</em>4번 문장: 2019년 영국 19.7%로 1위 → 도표와 같음</span><span><em>③</em>5번 문장: 2019년 미국 16.5%로 2위 → 도표와 같음</span><span><em>④</em>6번 문장: 2012년 네덜란드 > 프랑스, 2019년은 반대 → 도표와 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 도표와 같아요 → 남은 ⑤의 범위 표현을 나라·해마다 하나씩 확인</div></div><div class=\"ck-via\"><i>▼</i><span>두 나라 × 두 해 = 네 칸이 모두 5.0% 미만이어야 맞는 문장</span></div><div class=\"ck-step key\"><span class=\"lab\">⑤ 선지 (7번)</span><div class=\"en\">In the case of Spain and Italy, the online share of retail sales in each country was <mark>less than 5.0%</mark> <mark>both in 2012 and in 2019</mark>.</div><p class=\"ko\">스페인과 이탈리아의 경우에, 각 국가에서 소매 판매의 온라인 점유율은 <mark>5.0%보다 더 적었다</mark> <mark>2012년과 2019년 둘 다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>스페인 2012년</em>2.0% → 5.0% 미만 맞음</span><span><em>스페인 2019년</em>5.4% → 5.0%를 넘음</span></div><div class=\"ck-eq\">⇒ 결정적 단서: 스페인 2019년 한 칸이 깨지니 ‘둘 다(both)’가 틀려요 → ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">스페인과 이탈리아는 두 해 모두 5.0% 미만이었다<small>스페인 2019년은 5.4%라 5.0%를 넘어요. both(둘 다) 조건 하나가 깨져서 틀린 문장이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">2012년에는 네덜란드가 프랑스보다 컸고 2019년에는 반대였다</span><span class=\"why\">6번과 같아요. 두 해를 한 문장에 비교하고 the reverse(그 반대)까지 있어 헷갈리지만, 2012년엔 네덜란드가 더 크고 2019년엔 프랑스가 더 커서 맞는 문장이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">각 국가에서 2019년 온라인 점유율이 2012년보다 컸다</span><span class=\"why\">3번과 같아요. For each country(각 국가에서)라는 범위 표현이 있지만, 여섯 나라 모두 2019년 막대가 2012년보다 길어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">영국이 19.7%로 2019년 최대 점유율을 차지했다</span><span class=\"why\">4번과 같아요. 2019년 영국은 19.7%로 the largest(가장 큰) 점유율이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">미국이 16.5%로 2019년 두 번째로 큰 점유율을 차지했다</span><span class=\"why\">5번과 같아요. 2019년 미국은 16.5%로 영국 다음 the second largest(두 번째로 큰) 점유율이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The graph above shows</div><div class=\"k\">위 그래프는 보여 준다</div></div><div class=\"rc\"><div class=\"e\">the online shares of retail sales</div><div class=\"k\">소매 판매의 온라인 점유율을</div></div><div class=\"rc\"><div class=\"e\">for each of six countries</div><div class=\"k\">여섯 개 국가 각각의</div></div><div class=\"rc\"><div class=\"e\">in 2012 and in 2019.</div><div class=\"k\">2012년과 2019년의.</div></div><div class=\"rnat\">위 그래프는 2012년과 2019년 여섯 개 국가 각각의 소매 판매의 온라인 점유율을 보여 준다.</div><div class=\"rst\">우리 반 친구 여섯 명이 2012년과 2019년에 용돈 중 얼마를 인터넷 쇼핑에 썼는지 그린 그래프라고 생각해요. = 지문의 여섯 나라 온라인 점유율이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The online share of retail sales</div><div class=\"k\">소매 판매의 온라인 점유율은</div></div><div class=\"rc\"><div class=\"e\">refers to the percentage of retail sales</div><div class=\"k\">소매 판매의 비율을 나타낸다</div></div><div class=\"rc\"><div class=\"e\">conducted online</div><div class=\"k\">온라인으로 수행된</div></div><div class=\"rc\"><div class=\"e\">in a given country.</div><div class=\"k\">주어진 국가에서.</div></div><div class=\"rnat\">소매 판매의 온라인 점유율은 주어진 국가에서 온라인으로 수행된 소매 판매의 비율을 나타낸다.</div><div class=\"rst\">온라인 점유율은 전체 쇼핑 중 인터넷으로 산 몫이 몇 %냐는 뜻이에요. = 지문의 온라인으로 수행된 소매 판매의 비율이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">For each country,</div><div class=\"k\">각 국가에서,</div></div><div class=\"rc\"><div class=\"e\">its online share of retail sales in 2019</div><div class=\"k\">(그것의) 2019년 소매 판매의 온라인 점유율은</div></div><div class=\"rc\"><div class=\"e\">was larger than that in 2012.</div><div class=\"k\">2012년의 그것(= 소매 판매의 온라인 점유율)보다 더 컸다.</div></div><div class=\"rnat\">① 각 국가에서, (그것의) 2019년 소매 판매의 온라인 점유율은 2012년의 그것(소매 판매의 온라인 점유율)보다 더 컸다.</div><div class=\"rst\">여섯 명 모두 2019년에 인터넷 쇼핑 몫이 더 커졌어요. = 지문의 <b>each</b>(각각) 나라 모두 2019년이 더 컸다예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Among the six countries,</div><div class=\"k\">여섯 개 국가 중에서,</div></div><div class=\"rc\"><div class=\"e\">the UK owned</div><div class=\"k\">영국은 가졌다</div></div><div class=\"rc\"><div class=\"e\">the largest online share of retail sales</div><div class=\"k\">가장 큰 소매 판매의 온라인 점유율을</div></div><div class=\"rc\"><div class=\"e\">with 19.7% in 2019.</div><div class=\"k\">2019년에 19.7%로.</div></div><div class=\"rnat\">② 여섯 개 국가 중에서, 영국은 2019년에 19.7%로 가장 큰 소매 판매의 온라인 점유율을 가졌다.</div><div class=\"rst\">2019년 1등은 영국 친구로 19.7%예요. = 지문의 <b>the largest</b>(가장 큰) 점유율이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In 2019,</div><div class=\"k\">2019년에,</div></div><div class=\"rc\"><div class=\"e\">the U.S. had</div><div class=\"k\">미국은 가졌다</div></div><div class=\"rc\"><div class=\"e\">the second largest online share of retail sales</div><div class=\"k\">두 번째로 큰 소매 판매의 온라인 점유율을</div></div><div class=\"rc\"><div class=\"e\">with 16.5%.</div><div class=\"k\">16.5%로.</div></div><div class=\"rnat\">③ 2019년에, 미국은 16.5%로 두 번째로 큰 소매 판매의 온라인 점유율을 가졌다.</div><div class=\"rst\">2019년 2등은 미국 친구로 16.5%예요. = 지문의 <b>the second largest</b>(두 번째로 큰) 점유율이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In 2012,</div><div class=\"k\">2012년에,</div></div><div class=\"rc\"><div class=\"e\">the online share of retail sales in the Netherlands</div><div class=\"k\">네덜란드의 소매 판매의 온라인 점유율은</div></div><div class=\"rc\"><div class=\"e\">was larger than that in France,</div><div class=\"k\">프랑스에서의 그것(= 소매 판매의 온라인 점유율)보다 더 컸는데,</div></div><div class=\"rc\"><div class=\"e\">whereas the reverse was true in 2019.</div><div class=\"k\">반면 2019년에는 그 반대가 사실이었다.</div></div><div class=\"rnat\">④ 2012년에, 네덜란드에서의 소매 판매의 온라인 점유율은 프랑스에서의 그것(소매 판매의 온라인 점유율)보다 더 컸는데, 반면 2019년에는 그 반대가 사실이었다.</div><div class=\"rst\">2012년엔 네덜란드 친구가 프랑스 친구보다 많았는데, 2019년엔 뒤집혔어요. = 지문의 <b>the reverse</b>(그 반대)예요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">In the case of Spain and Italy,</div><div class=\"k\">스페인과 이탈리아의 경우에,</div></div><div class=\"rc\"><div class=\"e\">the online share of retail sales in each country</div><div class=\"k\">각 국가에서 소매 판매의 온라인 점유율은</div></div><div class=\"rc ckc\"><div class=\"e\">was <span class=\"cw\">less than 5.0%</span></div><div class=\"k\"><span class=\"cw\">5.0%보다 더 적었다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">both in 2012 and in 2019</span>.</div><div class=\"k\"><span class=\"cw\">2012년과 2019년 둘 다</span>.</div></div><div class=\"rnat\">⑤ 스페인과 이탈리아의 경우에, 각 국가에서 소매 판매의 온라인 점유율은 2012년과 2019년에 모두(→ 스페인의 2019년을 제외하고) 5.0%보다 더 적었다.</div><div class=\"rst\">스페인·이탈리아 친구 둘 다 두 해 모두 5% 미만이래요. 그런데 스페인 친구 2019년은 5.4%! = 지문 7번의 <b>both</b>(둘 다)가 깨져 ⑤가 정답이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"retail sales\" data-m=\"소매 판매\"><b>retail sales</b>소매 판매</button><button type=\"button\" class=\"wdb\" data-w=\"share\" data-m=\"점유율, 몫\"><b>share</b>점유율, 몫</button><button type=\"button\" class=\"wdb\" data-w=\"refers to\" data-m=\"~을 나타내다 (refer to)\"><b>refers to</b>~을 나타내다 (refer to)</button><button type=\"button\" class=\"wdb\" data-w=\"whereas\" data-m=\"반면에\"><b>whereas</b>반면에</button><button type=\"button\" class=\"wdb\" data-w=\"reverse\" data-m=\"반대, 역(逆)\"><b>reverse</b>반대, 역(逆)</button><button type=\"button\" class=\"wdb\" data-w=\"in the case of\" data-m=\"~의 경우에\"><b>in the case of</b>~의 경우에</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>결론 예고 신호</b>(The thing is this: 중요한 것은 이것이다)와 <b>당위 표현</b>(You have to ~해야 한다) 뒤에 있어요. 1~5번은 어른이 <b>norms</b>(규범) 때문에 못 논다는 진단, 6번이 처방이에요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 문제 제기</span><div class=\"en\">Probably the biggest roadblock to play for adults is <mark>the worry that they will look silly</mark>, improper, or dumb</div><p class=\"ko\">아마 어른들에게 있어서 놀이에 대한 가장 큰 장애물은 <mark>그들이 어리석거나, 부적절하거나, 바보 같아 보일 것이라는</mark> 걱정일 것이다</p></div><div class=\"ck-via\"><i>▼</i><span>왜 그런 걱정을 할까? 범인은 norms(규범)</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 반복되는 핵심어</span><div class=\"en\">but they get pounded out <mark>by norms</mark> that look down on “frivolity.”</div><p class=\"ko\">하지만 그것들(= 허튼소리와 어리석음)은 <mark>‘경박함’을 경시하는 규범에 의해</mark> 두들겨져 없어진다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>부모·교육 제도의 성과 기준, 내면화된 문화적 규범</span><span><em>5번</em>늘 유능해 보이려 걱정하면 자유로워지기 어려움</span></div><div class=\"ck-eq\">⇒ 4·5번의 공통점 = 규범에 갇혀서 마음껏 놀지 못하는 어른</div></div><div class=\"ck-via\"><i>▼</i><span>결론 예고 신호 + 당위 표현 = 필자의 주장</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\"><mark>The thing is this:</mark> <mark>You have to give yourself permission</mark> to improvise, to mimic, to take on a long-hidden identity.</div><p class=\"ko\"><mark>중요한 것은 이것이다.</mark> <mark>당신은</mark> (무언가를) 즉흥적으로 하고, 흉내 내고, 오랫동안 숨겨져 있던 정체성을 띠는(취하는) 것을 <mark>스스로 허락해야 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">어른도 규범에 얽매이지 말고 자유롭게 놀이를 즐겨야 한다<small>3·4번의 norms(규범)에서 벗어나, 6번처럼 스스로 놀이를 permission(허락)하라는 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">아동에게 사회 규범을 내면화할 수 있는 놀이를 제공해야 한다</span><span class=\"why\">[반대] 4번의 internalized(내면화된)·norms(규범)를 그대로 가져온 함정이에요. 지문은 규범이 놀이를 막는 장애물이라 했고, 대상도 아이가 아니라 어른이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">개인의 창의성을 극대화할 수 있는 놀이 문화를 조성해야 한다</span><span class=\"why\">[범위 넓음] 6번 improvise(즉흥적으로 하다)가 창의성처럼 보이지만, 지문은 사회의 놀이 문화를 만들자는 게 아니라 어른 한 사람이 스스로 놀도록 허락하라는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">타인의 시선을 의식하지 않고 자신의 목표 달성에 매진해야 한다</span><span class=\"why\">[반대] 남의 눈을 신경 쓰지 말라는 앞부분은 비슷하지만, 목표 달성은 5번처럼 늘 유능해 보이려는 쪽이에요. 지문은 그걸 내려놓고(let go) 놀라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">어른을 위한 잠재력 계발 프로그램에서 놀이의 비중을 늘려야 한다</span><span class=\"why\">[지문에 없음] 어른은 맞지만 계발 프로그램 이야기는 하나도 없어요. 지문은 프로그램이 아니라 스스로에게 permission(허락)을 주라고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Probably the biggest roadblock</div><div class=\"k\">아마 가장 큰 장애물은</div></div><div class=\"rc\"><div class=\"e\">to play for adults</div><div class=\"k\">어른들에게 있어서 놀이에 대한</div></div><div class=\"rc\"><div class=\"e\">is the worry</div><div class=\"k\">걱정일 것이다</div></div><div class=\"rc\"><div class=\"e\">that they will look silly, improper, or dumb</div><div class=\"k\">그들이 어리석거나, 부적절하거나, 바보 같아 보일 것이라는</div></div><div class=\"rc\"><div class=\"e\">if they allow themselves to truly play.</div><div class=\"k\">만일 그들이 스스로가 진정으로 놀도록 허락한다면.</div></div><div class=\"rnat\">아마 어른들에게 있어서 놀이(노는 것)에 대한 가장 큰 장애물은, 만일 그들이 스스로가 진정으로 놀도록 허락한다면, 그들이 어리석거나, 부적절하거나, 또는 바보 같아 보일 것이라는 걱정일 것이다.</div><div class=\"rst\">한 어른이 놀이터에서 그네를 타고 싶어도 “남들이 이상하게 보겠지?” 하고 참아요. = 지문의 어른 놀이의 가장 큰 장애물인 <b>바보 같아 보일까 하는 걱정</b>이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Or they think</div><div class=\"k\">또는 그들은 생각한다</div></div><div class=\"rc\"><div class=\"e\">that it is irresponsible, immature, and childish</div><div class=\"k\">무책임하고, 미숙하며, 유치하다고</div></div><div class=\"rc\"><div class=\"e\">to give themselves regularly over to play.</div><div class=\"k\">자신들이 규칙적으로 놀이에 완전히 빠지는 것이.</div></div><div class=\"rnat\">또는 그들은 자신들이 놀이에 완전히 빠지는 것이 무책임하고, 미숙하며, 유치하다고 생각한다.</div><div class=\"rst\">또 “어른이 무슨 놀이야, 유치하게.” 하고 생각해요. 지문도 어른들이 놀이에 빠지는 걸 무책임하고 유치하다고 여긴대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Nonsense and silliness</div><div class=\"k\">허튼소리와 어리석음은</div></div><div class=\"rc\"><div class=\"e\">come naturally to kids,</div><div class=\"k\">아이들에게 자연스러운 것이지만,</div></div><div class=\"rc\"><div class=\"e\">but they get pounded out</div><div class=\"k\">두들겨진다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">by norms</span> that look down on “frivolity.”</div><div class=\"k\">‘경박함’을 경시하는 <span class=\"cw\">규범에 의해</span>.</div></div><div class=\"rnat\">허튼소리와 어리석음은 아이들에게 자연스러운 것이지만, 그들은 ‘경박함’을 경시하는 규범에 의해 두들겨진다(비난을 받는다).</div><div class=\"rst\">꼬마들은 엉뚱한 장난을 자연스럽게 치지만, 어른은 “점잖게 굴어야지.”라는 <b>규범</b>(norms) 때문에 그 마음이 꺾여요. 지문의 이야기예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This is particularly true</div><div class=\"k\">이것은 특히 사실이다</div></div><div class=\"rc\"><div class=\"e\">for people who have been valued</div><div class=\"k\">가치가 매겨져 온 사람들에게 있어서</div></div><div class=\"rc\"><div class=\"e\">for performance standards</div><div class=\"k\">성과 기준으로</div></div><div class=\"rc\"><div class=\"e\">set by parents or the educational system,</div><div class=\"k\">부모나 교육 제도에 의해 정해진,</div></div><div class=\"rc\"><div class=\"e\">or measured by other cultural norms</div><div class=\"k\">또는 다른 문화적 규범들에 의해 평가받아 온</div></div><div class=\"rc\"><div class=\"e\">that are internalized and no longer questioned.</div><div class=\"k\">내면화되어 더 이상 의문시되지 않는.</div></div><div class=\"rnat\">이것은 특히 부모나 교육 제도에 의해 정해진 성과 기준으로 가치가 매겨져 온 (사람들), 또는 내면화되어 더 이상 의문시되지 않는 다른 문화적 규범들에 의해 평가받아 온 사람들에게 있어서 사실이다.</div><div class=\"rst\">특히 늘 성적이나 평가로만 칭찬받아 온 사람은 더 그래요. = 지문의 성과 기준·내면화된 문화적 규범이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">If someone has spent his adult life</div><div class=\"k\">만일 누군가가 그의 성년기를 보냈다면</div></div><div class=\"rc\"><div class=\"e\">worried about always appearing</div><div class=\"k\">항상 보이는 것에 대해 걱정하며</div></div><div class=\"rc\"><div class=\"e\">respectable, competent, and knowledgeable,</div><div class=\"k\">존경할 만하고, 유능하며, 박식하게,</div></div><div class=\"rc\"><div class=\"e\">it can be hard to let go sometimes</div><div class=\"k\">때때로 (걱정을) 내려놓는 것이 어려울 수 있다</div></div><div class=\"rc\"><div class=\"e\">and become physically and emotionally free.</div><div class=\"k\">그리고 신체적으로 그리고 감정적으로 자유로워지는 것이.</div></div><div class=\"rnat\">만일 누군가가 항상 존경할 만하고, 유능하며, 박식해 보이는 것에 대해 걱정하며 그의 성년기를 보냈다면, 때때로 (걱정을) 내려놓고 신체적으로 그리고 감정적으로 자유로워지는 것이 어려울 수 있다.</div><div class=\"rst\">늘 멋지고 똑똑해 보이려고 애써 온 그 어른은 그 걱정을 내려놓기 힘들어요. 지문도 몸과 마음이 자유로워지기 어렵다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The thing is this:</span></div><div class=\"k\"><span class=\"cw\">중요한 것은 이것이다.</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">You have to give yourself permission</span></div><div class=\"k\"><span class=\"cw\">당신은 스스로 허락해야 한다</span></div></div><div class=\"rc\"><div class=\"e\">to improvise, to mimic,</div><div class=\"k\">(무언가를) 즉흥적으로 하고, 흉내 내고,</div></div><div class=\"rc\"><div class=\"e\">to take on a long-hidden identity.</div><div class=\"k\">오랫동안 숨겨져 있던 정체성을 띠는(취하는) 것을.</div></div><div class=\"rnat\">중요한 것은 이것이다. 당신은 (무언가를) 즉흥적으로 하고, 흉내 내고, 오랫동안 숨겨져 있던 정체성을 띠는(취하는) 것을 스스로 허락해야 한다.</div><div class=\"rst\"><b>중요한 건 이거예요</b>(The thing is this). 그 어른도 스스로 “오늘은 마음껏 놀아도 돼.” 하고 <b>허락해야 해요</b>. 이게 필자의 주장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"roadblock\" data-m=\"장애물, 걸림돌\"><b>roadblock</b>장애물, 걸림돌</button><button type=\"button\" class=\"wdb\" data-w=\"norm\" data-m=\"규범\"><b>norm</b>규범</button><button type=\"button\" class=\"wdb\" data-w=\"look down on\" data-m=\"~을 경시하다\"><b>look down on</b>~을 경시하다</button><button type=\"button\" class=\"wdb\" data-w=\"internalize\" data-m=\"내면화하다\"><b>internalize</b>내면화하다</button><button type=\"button\" class=\"wdb\" data-w=\"let go\" data-m=\"내려놓다\"><b>let go</b>내려놓다</button><button type=\"button\" class=\"wdb\" data-w=\"permission\" data-m=\"허락\"><b>permission</b>허락</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 동사를 보면 <b>진짜 주어</b>부터 찾으세요. 주어 뒤에 붙은 <b>전치사구</b>(around her eyes 그녀의 눈 주변의)를 손가락으로 가리고 보면 단수·복수가 바로 보여요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ②번 자리 (4번)</span><div class=\"en\">The skin around her eyes <u>② form</u> small and thin lines, …</div><p class=\"ko\">그녀의 눈 주변의 피부는 작고 가는 선들을 ( ? ) — 동사 바로 앞은 복수 eyes(눈들)</p></div><div class=\"ck-via\"><i>▼</i><span>around her eyes(그녀의 눈 주변의)는 skin(피부)을 꾸미는 말일 뿐, 주어가 아니에요</span></div><div class=\"ck-step\"><span class=\"lab\">수식어 걷어 내기</span><div class=\"en\"><mark>The skin</mark> around her eyes</div><p class=\"ko\">그녀의 눈 주변의 <mark>피부는</mark></p></div><div class=\"ck-via\"><i>▼</i><span>주어 The skin(피부)은 단수 → 현재 동사에 -s</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">The skin around her eyes <mark>forms</mark> small and thin lines,</div><p class=\"ko\">그녀의 눈 주변의 피부는 작고 가는 선들을 <mark>만들고 있는데</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">주어와 동사의 수 일치 (수식어구 걷어 내기)</p><p class=\"gr\">동사의 단수·복수는 동사 바로 앞 명사가 아니라 진짜 주어가 정해요. 주어 뒤에 붙은 전치사구(of(~의), around(~ 주변의), in(~ 안의))는 가리고 보세요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The bag on the desks is mine.</div><div class=\"ko\">책상들 위의 가방은 내 것이다. (주어는 bag 가방 하나라서 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The bag on the desks are mine.</div><div class=\"ko\">바로 앞 desks(책상들)에 끌려 are를 써서 틀려요. 주어는 bag(가방) 하나예요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The color of the flowers looks pretty.</div><div class=\"ko\">그 꽃들의 색깔은 예뻐 보인다. (주어는 color 색깔 하나라서 looks가 맞아요)</div></div><p class=\"gb\">지문 4번도 around her eyes(그녀의 눈 주변의)를 가리면 skin(피부)과 form(만든다)이 바로 붙어요. skin(피부)은 단수라 forms(만든다)로 고쳐야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">form → forms (만든다)<small>주어가 단수 The skin(피부)이라 동사도 단수 forms(만든다)여야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">to succeed 성공하고자 하는</span><span class=\"why\">8번은 Emily has a drive(Emily는 욕구를 갖고 있다) 뒤예요. 명사 a drive(욕구)가 ‘어떤’ 욕구인지 뒤에서 꾸며 주는 자리라 to(~하려는) 부정사 to succeed(성공하고자 하는)가 맞아요. 동사 succeed(성공하다)를 바로 쓰면 has(갖고 있다)와 동사가 두 개 겹쳐요.</span><div class=\"gm wx\"><p class=\"gt\">명사 뒤 to(~할, ~하려는) 부정사의 형용사적 용법: 명사 + to(~할) 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a lot of homework to do.</div><div class=\"ko\">나는 해야 할 숙제가 많다. (homework 숙제 뒤에서 to do 해야 할 이 꾸며 줘서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a lot of homework do.</div><div class=\"ko\">homework(숙제) 뒤에 to 없이 do(하다)를 써서 동사가 겹쳐 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She has a dream to become a singer.</div><div class=\"ko\">그녀는 가수가 되려는 꿈이 있다. (a dream 꿈 뒤에서 to become 되려는 이 꾸며 줘서 맞아요)</div></div><p class=\"gb\">지문 8번도 a drive(욕구) 뒤에서 to succeed(성공하고자 하는)가 꾸며 주는 자리라 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">that ~라는 것을</span><span class=\"why\">2번은 Her face reminds me(그녀의 얼굴은 나에게 상기시킨다) 뒤예요. remind A that(A에게 ~라는 것을 상기시키다) 구조이고, 뒤 I have given her more than just my name(내가 그녀에게 이름 이상을 주었다)이 주어·동사·목적어가 다 갖춰진 완전한 절이라 접속사 that(~라는 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">remind(상기시키다) + 사람 + that(~라는 것을) + 완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Mom reminded me that I had a test.</div><div class=\"ko\">엄마는 나에게 시험이 있다는 것을 상기시켜 주셨다. (that 뒤 I had a test가 완전해서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Mom reminded me what I had a test.</div><div class=\"ko\">뒤 절이 빠진 데 없이 완전한데 what(~하는 것)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This song reminds me that summer is coming.</div><div class=\"ko\">이 노래는 나에게 여름이 오고 있다는 것을 떠올리게 한다. (that 뒤 summer is coming이 완전해서 맞아요)</div></div><p class=\"gb\">지문 2번도 reminds me(나에게 상기시킨다) 뒤에 완전한 절 ‘내가 그녀에게 주었다’(I have given her)가 오니 that(~라는 것을)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">clearly 분명하게</span><span class=\"why\">7번은 I see myself(나는 나 자신을 본다)가 이미 주어·동사·목적어로 다 갖춰진 문장이에요. 그 뒤 ③ 자리는 ‘어떻게’ 보는지 동사 see(보다)를 꾸미는 자리라 부사 clearly(분명하게)가 맞아요. 형용사 clear(분명한)는 동사를 꾸밀 수 없어요.</span><div class=\"gm wx\"><p class=\"gt\">동사를 꾸미는 자리 = 부사(주로 ~하게 형태)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>He speaks English clearly.</div><div class=\"ko\">그는 영어를 분명하게 말한다. (speaks 말한다 를 꾸미니 부사 clearly가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He speaks English clear.</div><div class=\"ko\">동사 speaks(말한다)를 꾸미는데 형용사 clear(분명한)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>His voice is clear.</div><div class=\"ko\">그의 목소리는 분명하다. (is 뒤 보어 자리라 이때는 형용사 clear가 맞아요)</div></div><p class=\"gb\">지문 7번도 I see myself(나는 나 자신을 본다) 뒤에서 see(보다)를 꾸미니 부사 clearly(분명하게)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">herself 그녀 자신에게</span><span class=\"why\">9번은 she used to tell(그녀는 말하곤 했다) 뒤 목적어 자리예요. 말하는 사람 she(그녀)와 듣는 사람이 같은 사람이라 재귀대명사 herself(그녀 자신에게)가 맞아요. tell oneself(혼잣말하다)라는 덩어리 표현이에요.</span><div class=\"gm wx\"><p class=\"gt\">재귀대명사(~ 자신): 주어와 목적어가 같은 사람이면 herself(그녀 자신)·myself(나 자신)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She looked at herself in the mirror.</div><div class=\"ko\">그녀는 거울 속 자기 자신을 보았다. (보는 사람 = 보이는 사람이라 herself가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She looked at her in the mirror.</div><div class=\"ko\">her(그녀를)를 쓰면 다른 여자를 본 뜻이 돼서, 자기 자신을 본 뜻으로는 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I told myself, “I can do it.”</div><div class=\"ko\">나는 “난 할 수 있어.”라고 혼잣말했다. (I 나 = myself 나 자신이라 맞아요)</div></div><p class=\"gb\">지문 9번도 she(그녀)가 자기 자신에게 “지시를 기다릴 필요가 뭐 있어?”라고 말하니 herself(그녀 자신에게)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Whenever I look into</div><div class=\"k\">내가 들여다볼 때마다</div></div><div class=\"rc\"><div class=\"e\">my daughter Emily’s face,</div><div class=\"k\">내 딸 Emily의 얼굴을,</div></div><div class=\"rc\"><div class=\"e\">I think about</div><div class=\"k\">나는 생각한다</div></div><div class=\"rc\"><div class=\"e\">the power of fatherhood.</div><div class=\"k\">부성(父性)의 힘에 대해.</div></div><div class=\"rnat\">내 딸 Emily의 얼굴을 들여다볼 때마다, 나는 부성(父性)의 힘에 대해 생각한다.</div><div class=\"rst\">아빠가 딸 에밀리의 얼굴을 볼 때마다 ‘아빠라는 게 이렇게 힘이 세구나’ 하고 느껴요. 지문도 부성(fatherhood)의 힘을 말해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Her face reminds me</div><div class=\"k\">그녀(= Emily)의 얼굴은 나에게 상기시킨다</div></div><div class=\"rc\"><div class=\"e\">that I have given her</div><div class=\"k\">내가 그녀에게 주었다는 것을</div></div><div class=\"rc\"><div class=\"e\">more than just my name.</div><div class=\"k\">단지 나의 이름 이상의 것을.</div></div><div class=\"rnat\">그녀의 얼굴은 내가 단지 나의 이름 이상의 것을 그녀에게 주었다는 것을 나에게 상기시킨다.</div><div class=\"rst\">딸 얼굴을 보면, 이름만 물려준 게 아니라는 게 떠올라요. remind me that(나에게 ~라는 것을 상기시킨다) 뒤에 완전한 문장이 와요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Like me,</div><div class=\"k\">나처럼,</div></div><div class=\"rc\"><div class=\"e\">she has freckles</div><div class=\"k\">그녀는 주근깨를 갖고 있다</div></div><div class=\"rc\"><div class=\"e\">stretching across the bridge of her nose</div><div class=\"k\">콧날을 가로질러 늘어선</div></div><div class=\"rc\"><div class=\"e\">almost like a Band-Aid.</div><div class=\"k\">거의 밴드에이드 같이.</div></div><div class=\"rnat\">나처럼 그녀는 거의 밴드에이드 같이 그녀의 콧날을 가로질러 늘어선 주근깨를 갖고 있다.</div><div class=\"rst\">아빠처럼 에밀리도 콧등에 반창고 붙인 듯 주근깨가 줄지어 있어요. 지문의 첫 번째 닮은 점이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The skin</span> around her eyes</div><div class=\"k\">그녀의 눈 주변의 <span class=\"cw\">피부는</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">forms</span> small and thin lines,</div><div class=\"k\">작고 가는 선들을 <span class=\"cw\">만들고 있는데</span>, ※ 문제지엔 form으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">and the lines match mine.</div><div class=\"k\">그 선들은 내 것과 일치한다.</div></div><div class=\"rnat\">그녀의 눈 주변의 피부는 작고 가는 선들을 만들고 있는데, 그 선들은 내 것과 일치한다.</div><div class=\"rst\"><b>눈가 피부</b>(The skin 피부)도 아빠처럼 잔주름을 만들어요. 주어는 눈들이 아니라 피부 하나라서 <b>forms</b>(만든다)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">“When Emily smiles,”</div><div class=\"k\">“Emily가 웃으면,”</div></div><div class=\"rc\"><div class=\"e\">my mother tells me,</div><div class=\"k\">어머니는 나에게 말씀하신다,</div></div><div class=\"rc\"><div class=\"e\">“she looks just like you.”</div><div class=\"k\">“그녀는 너랑 아주 똑같아 보여.”</div></div><div class=\"rnat\">“Emily가 웃으면, 너랑 아주 똑같아.”라고 어머니는 나에게 말씀하신다.</div><div class=\"rst\">할머니도 “에밀리가 웃으면 딱 너야.” 하고 말씀하세요. 웃는 얼굴까지 닮았다는 지문의 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Other things in her</div><div class=\"k\">그녀의 다른 것들도</div></div><div class=\"rc\"><div class=\"e\">are reflections of me.</div><div class=\"k\">나의 반영이다(나를 꼭 닮았다).</div></div><div class=\"rnat\">그녀의 다른 것들도 나의 반영이다(나를 꼭 닮았다).</div><div class=\"rst\">얼굴 말고 다른 것들도 아빠를 꼭 닮았어요. = 지문의 나의 반영(reflections of me)이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">I see myself</div><div class=\"k\">나는 나 자신을 본다</div></div><div class=\"rc\"><div class=\"e\">most clearly</div><div class=\"k\">가장 분명하게</div></div><div class=\"rc\"><div class=\"e\">in her eyes,</div><div class=\"k\">그녀의 눈 속에서,</div></div><div class=\"rc\"><div class=\"e\">the windows to her soul.</div><div class=\"k\">그녀의 영혼의 창인.</div></div><div class=\"rnat\">그녀의 영혼의 창인 그녀의 눈 속에서 나는 나 자신을 가장 분명하게 본다.</div><div class=\"rst\">아빠는 딸 눈 속에서 자기 모습을 가장 분명하게 봐요. 동사 see(보다)를 꾸미니 부사 clearly(분명하게)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Like me,</div><div class=\"k\">나처럼,</div></div><div class=\"rc\"><div class=\"e\">Emily has a drive</div><div class=\"k\">Emily는 욕구를 갖고 있다</div></div><div class=\"rc\"><div class=\"e\">to succeed</div><div class=\"k\">성공하고자 하는</div></div><div class=\"rc\"><div class=\"e\">and will try anything.</div><div class=\"k\">그리고 어떤 것이든 시도하려고 한다.</div></div><div class=\"rnat\">나처럼 Emily는 성공하고자 하는 욕구를 갖고 있으며 어떤 것이든 시도하려고 한다.</div><div class=\"rst\">에밀리도 아빠처럼 꼭 해내고 싶은 마음이 있어서 뭐든 해 봐요. a drive(욕구) 뒤의 to succeed(성공하고자 하는)가 꾸며 줘요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">“Who needs to wait for instructions?”</div><div class=\"k\">“지시를 기다릴 필요가 뭐 있어?”</div></div><div class=\"rc\"><div class=\"e\">she used to tell herself</div><div class=\"k\">그녀는 혼잣말하곤 했다</div></div><div class=\"rc\"><div class=\"e\">as she attempted to do the high bar</div><div class=\"k\">그녀가 철봉을 하려고 시도할 때</div></div><div class=\"rc\"><div class=\"e\">in gymnastics class;</div><div class=\"k\">체조 수업에서;</div></div><div class=\"rc\"><div class=\"e\">more than once, she failed.</div><div class=\"k\">한 번 이상 그녀는 실패했다.</div></div><div class=\"rnat\">체조 수업에서 철봉을 하려고 시도할 때, 그녀는 “지시를 기다릴 필요가 뭐 있어?”라고 혼잣말을 하곤 했으며, 그녀는 한 번 이상 실패했다.</div><div class=\"rst\">체육 시간 철봉 앞에서 “설명 기다릴 필요 없어!” 하고 혼잣말하며 도전하다 여러 번 떨어졌어요. 자기에게 한 말이라 herself(그녀 자신에게)예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Also, more than once,</div><div class=\"k\">또한 한 번 이상,</div></div><div class=\"rc\"><div class=\"e\">she succeeded.</div><div class=\"k\">그녀는 성공했다.</div></div><div class=\"rnat\">또한 그녀는 한 번 이상 성공했다.</div><div class=\"rst\">그래도 여러 번 성공도 했어요. 도전하는 모습까지 아빠를 닮았다는 지문의 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fatherhood\" data-m=\"아버지 됨, 부성\"><b>fatherhood</b>아버지 됨, 부성</button><button type=\"button\" class=\"wdb\" data-w=\"remind A that\" data-m=\"A에게 ~을 상기시키다\"><b>remind A that</b>A에게 ~을 상기시키다</button><button type=\"button\" class=\"wdb\" data-w=\"freckles\" data-m=\"주근깨 (freckle)\"><b>freckles</b>주근깨 (freckle)</button><button type=\"button\" class=\"wdb\" data-w=\"reflections\" data-m=\"반영, 꼭 닮은 것 (reflection)\"><b>reflections</b>반영, 꼭 닮은 것 (reflection)</button><button type=\"button\" class=\"wdb\" data-w=\"drive\" data-m=\"욕구, 추진력\"><b>drive</b>욕구, 추진력</button><button type=\"button\" class=\"wdb\" data-w=\"instructions\" data-m=\"지시 (instruction)\"><b>instructions</b>지시 (instruction)</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>( ? )와 ( ? ) 사이의 협업</b>(cooperation)이에요. 짝이 될 두 가지를 빈칸 <b>바로 앞 1·2번</b>에서 하나씩 찾고, 뒤의 페니실린 예시로 확인하세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (3번)</span><div class=\"en\">One of the better-known examples of the <mark>cooperation between</mark> <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> is the invention of penicillin.</div><p class=\"ko\">( ? ) 사이의 협업에 대해 더 잘 알려진 예들 중 하나는 페니실린의 발명이다</p></div><div class=\"ck-via\"><i>▼</i><span>협업의 한쪽 = 발명을 만들어 낸 ‘우연’</span></div><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 첫 번째 짝</span><div class=\"en\">There are countless examples of scientific inventions that have been generated <mark>by accident</mark>.</div><p class=\"ko\"><mark>우연히 만들어진</mark> 과학적 발명의 예들은 셀 수 없이 많다.</p></div><div class=\"ck-via\"><i>▼</i><span>However(그러나)로 우연만으론 안 되고 해석할 ‘사람’이 필요하다고 덧붙여요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 두 번째 짝 · 결정적 단서</span><div class=\"en\">However, often this accident has required <mark>a person with above-average knowledge in the field</mark> to interpret it.</div><p class=\"ko\">그러나 흔히 이러한 우연은 <mark>그 분야에서 평균 이상의 지식을 가진</mark> 한 사람을 필요로 해 왔다</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5~8번</em>휴가 중 책상 위 배양균에 곰팡이가 핌 = 운 좋은 우연(coincidence)</span><span><em>9번</em>전문 지식이 있는 플레밍만 그 의미를 알아봄 = 연구자</span></div><div class=\"ck-eq\">⇒ 페니실린 = 우연 + 그걸 알아본 연구자의 협업 → ④ 우연과 연구자</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">우연과 연구자<small>1번 by accident(우연히)와 2번 a person with above-average knowledge(평균 이상의 지식을 가진 사람)를 그대로 받아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">전문가와 비전문가</span><span class=\"why\">9번에 전문 지식이 없는 사람(a person who does not have expert knowledge)이 나오지만, 그 사람은 곰팡이의 의미를 몰랐다는 비교용일 뿐 협업하지 않아요. 협업의 한쪽은 사람이 아니라 우연이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">시행착오</span><span class=\"why\">플레밍은 여러 번 실패하며 찾은 게 아니라 휴가에서 돌아와 우연히 곰팡이를 발견했어요. 8번도 lucky coincidence(운 좋은 우연의 일치)라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">생각과 비평가</span><span class=\"why\">누군가 발명을 비평하는 장면은 지문에 없어요. 2번에서 필요한 건 비평가가 아니라 우연을 해석할(interpret) 지식 있는 사람이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">위험과 안정</span><span class=\"why\">위험하거나 안정적인 상황을 비교하는 내용이 없어요. 지문의 짝은 1번 우연(accident)과 2번 지식 있는 사람이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">There are countless examples</div><div class=\"k\">셀 수 없이 많은 예들이 있다</div></div><div class=\"rc\"><div class=\"e\">of scientific inventions</div><div class=\"k\">과학적 발명의</div></div><div class=\"rc ckc\"><div class=\"e\">that have been generated <span class=\"cw\">by accident</span>.</div><div class=\"k\"><span class=\"cw\">우연히 만들어진</span>.</div></div><div class=\"rnat\">우연히 만들어진 과학적 발명의 예들은 셀 수 없이 많다.</div><div class=\"rst\">과학실에서 실수로 섞은 용액이 예쁜 색으로 변하는 것처럼, 우연히 생긴 발명은 정말 많아요. = 지문의 <b>by accident</b>(우연히) 만들어진 발명이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">However, often this accident</div><div class=\"k\">그러나 흔히 이러한 우연은</div></div><div class=\"rc\"><div class=\"e\">has required a person</div><div class=\"k\">한 사람을 필요로 해 왔다</div></div><div class=\"rc ckc\"><div class=\"e\">with <span class=\"cw\">above-average knowledge in the field</span></div><div class=\"k\"><span class=\"cw\">그 분야에서 평균 이상의 지식을 가진</span></div></div><div class=\"rc\"><div class=\"e\">to interpret it.</div><div class=\"k\">그것(= 이러한 우연)을 해석할.</div></div><div class=\"rnat\">그러나 흔히 이러한 우연은 그것을 해석할 수 있는 그 분야에서 평균 이상의 지식을 가진 사람을 필요로 해 왔다.</div><div class=\"rst\"><b>그런데</b> 그걸 “어, 이거 대단한데?” 하고 알아볼 <b>지식 있는 사람</b>이 꼭 있어야 해요. 지문도 우연을 해석할 평균 이상의 지식인이 필요하다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">One of the better-known examples</div><div class=\"k\">더 잘 알려진 예들 중 하나는</div></div><div class=\"rc\"><div class=\"e\">of the cooperation between</div><div class=\"k\">협업에 대해</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">chance and a researcher</span></div><div class=\"k\"><span class=\"cw\">우연과 연구자 사이의</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">is the invention of penicillin.</div><div class=\"k\">페니실린의 발명이다.</div></div><div class=\"rnat\">우연과 연구자 사이의 협업에 대해 더 잘 알려진 예들 중 하나는 페니실린의 발명이다.</div><div class=\"rst\">그 대표 예가 페니실린이에요. 그래서 빈칸은 1번의 우연과 2번의 사람, 즉 <b>우연과 연구자</b>의 협업이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In 1928,</div><div class=\"k\">1928년,</div></div><div class=\"rc\"><div class=\"e\">Scottish biologist Alexander Fleming</div><div class=\"k\">스코틀랜드의 생물학자 Alexander Fleming이</div></div><div class=\"rc\"><div class=\"e\">went on a vacation.</div><div class=\"k\">휴가를 떠났다.</div></div><div class=\"rnat\">1928년 스코틀랜드의 생물학자인 Alexander Fleming(알렉산더 플레밍)이 휴가를 떠났다.</div><div class=\"rst\">1928년, 생물학자 플레밍이 방학처럼 휴가를 떠났어요. 지문의 이야기가 여기서 시작돼요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">As a slightly careless man,</div><div class=\"k\">약간 부주의한 사람으로,</div></div><div class=\"rc\"><div class=\"e\">Fleming left some bacterial cultures</div><div class=\"k\">Fleming은 몇몇 박테리아 배양균을 두고 갔다</div></div><div class=\"rc\"><div class=\"e\">on his desk.</div><div class=\"k\">그의 책상 위에.</div></div><div class=\"rnat\">약간 부주의한 사람으로, Fleming은 책상 위에 몇몇 박테리아 배양균들을 두고 갔다.</div><div class=\"rst\">조금 덜렁대는 플레밍은 세균 키우던 접시를 책상 위에 그냥 두고 갔어요. 지문의 부주의한(careless) 사람이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">When he returned,</div><div class=\"k\">그가 돌아왔을 때,</div></div><div class=\"rc\"><div class=\"e\">he noticed mold</div><div class=\"k\">그는 곰팡이를 알아챘다</div></div><div class=\"rc\"><div class=\"e\">in one of his cultures,</div><div class=\"k\">그의 배양균들 중 하나에서,</div></div><div class=\"rc\"><div class=\"e\">with a bacteria-free zone around it.</div><div class=\"k\">그것(= 곰팡이) 주변에 박테리아가 없는 부분이 있는 채로.</div></div><div class=\"rnat\">그가 돌아왔을 때, 그는 그의 배양균들 중 하나에서 곰팡이를 알아챘는데(발견했는데) 그것(곰팡이) 주변으로 박테리아가 없는 부분이 있었다(그것 주변에는 박테리아가 없었다).</div><div class=\"rst\">돌아와 보니 한 접시에 곰팡이가 피었고, 그 주변만 세균이 싹 없어졌어요. 지문의 박테리아가 없는 부분이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The mold was from the penicillium notatum species,</div><div class=\"k\">그 곰팡이는 penicillium notatum 종으로부터 나왔고,</div></div><div class=\"rc\"><div class=\"e\">which had killed the bacteria</div><div class=\"k\">그것이 박테리아를 죽였던 것이다</div></div><div class=\"rc\"><div class=\"e\">on the Petri dish.</div><div class=\"k\">페트리 접시 위의.</div></div><div class=\"rnat\">그 곰팡이는 ‘penicillium notatum(페니킬리움 노타툼)’ 종으로부터 나왔고, 그것이 페트리 접시 위의 박테리아를 죽였던 것이다.</div><div class=\"rst\">알고 보니 그 곰팡이가 접시 위 세균을 죽인 거였어요. 지문은 그 곰팡이의 종 이름까지 알려 줘요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">This was a lucky coincidence.</div><div class=\"k\">이것은 운이 좋은 우연의 일치였다.</div></div><div class=\"rnat\">이것은 운이 좋은 우연의 일치였다.</div><div class=\"rst\">이건 정말 운 좋은 <b>우연</b>(coincidence 우연의 일치)이었어요. = 빈칸의 첫 번째 짝이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">For a person who does not have expert knowledge,</div><div class=\"k\">전문적 지식을 가지고 있지 않은 사람에게는,</div></div><div class=\"rc\"><div class=\"e\">the bacteria-free zone would not have had much significance,</div><div class=\"k\">박테리아가 없는 부분이 크게 중요하지 않았겠지만,</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">Fleming understood</span></div><div class=\"k\">그러나 <span class=\"cw\">Fleming은 이해했다</span></div></div><div class=\"rc\"><div class=\"e\">the magical effect of the mold.</div><div class=\"k\">그 곰팡이의 마법 같은 효능을.</div></div><div class=\"rnat\">전문적 지식을 가지고 있지 않은 사람에게는 박테리아가 없는 부분이 많은 중요성을 가지지 않았겠지만(크게 중요하지 않았겠지만) Fleming은 그 곰팡이의 마법 같은 효능을 이해했다.</div><div class=\"rst\">과학을 모르는 친구라면 “곰팡이 폈네” 하고 버렸겠지만, 플레밍은 그 힘을 알아봤어요. = 빈칸의 두 번째 짝, <b>연구자</b>예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">The result was penicillin</div><div class=\"k\">그 결과는 페니실린이었다</div></div><div class=\"rc\"><div class=\"e\">— a medication</div><div class=\"k\">— 약</div></div><div class=\"rc\"><div class=\"e\">that has saved countless people</div><div class=\"k\">수많은 사람들을 구한</div></div><div class=\"rc\"><div class=\"e\">on the planet.</div><div class=\"k\">지구상의.</div></div><div class=\"rnat\">그 결과는 페니실린, 즉 지구상의 수많은 사람들을 구한 약이었다.</div><div class=\"rst\">그렇게 나온 약이 지구의 수많은 사람을 살린 페니실린이에요. 우연과 연구자가 힘을 합친 결과라는 지문의 마무리예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"by accident\" data-m=\"우연히\"><b>by accident</b>우연히</button><button type=\"button\" class=\"wdb\" data-w=\"above-average\" data-m=\"평균 이상의\"><b>above-average</b>평균 이상의</button><button type=\"button\" class=\"wdb\" data-w=\"interpret\" data-m=\"해석하다\"><b>interpret</b>해석하다</button><button type=\"button\" class=\"wdb\" data-w=\"cooperation\" data-m=\"협업, 협력\"><b>cooperation</b>협업, 협력</button><button type=\"button\" class=\"wdb\" data-w=\"coincidence\" data-m=\"우연의 일치\"><b>coincidence</b>우연의 일치</button><button type=\"button\" class=\"wdb\" data-w=\"significance\" data-m=\"중요성, 의의\"><b>significance</b>중요성, 의의</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제. 이 글의 화제는 <b>질투를 알아차리기 어려운 이유 = 우리가 숨기기 때문</b>이에요. envy(질투)라는 단어만 같고 화제가 다른 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1·2번 · 글 전체 화제</span><div class=\"en\">It is very <mark>difficult to actually discern the envy</mark> that motivates people’s actions.</div><p class=\"ko\">사람들의 행동을 자극하는 <mark>질투를 실제로 알아차리는 것은</mark> 매우 어렵다.</p></div><div class=\"ck-via\"><i>▼</i><span>왜 알아차리기 어려운지 = 직접 드러내지 않아서</span></div><div class=\"ck-step\"><span class=\"lab\">①(3번) · 이유 제시</span><div class=\"en\">we almost <mark>never directly express</mark> the envy we are feeling.</div><p class=\"ko\">우리는 우리가 느끼고 있는 질투를 거의 <mark>직접 표현하지 않는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>②(4번)</em>질투 = 내가 열등하다고 인정하는 것</span><span><em>③(5번)</em>인정도 아프고, 남이 아는 건 더 싫음</span></div><div class=\"ck-eq\">⇒ ②③ = 왜 숨기는지 이유를 한 겹 더 파고들어요</div></div><div class=\"ck-via\"><i>▼</i><span>숨기는 이유 이야기가 갑자기 ‘질투가 병을 부른다’는 결과로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">④(6번) · 이탈 지점</span><div class=\"en\"><mark>Envy can cause illness</mark> because people with envy can cast the “evil eye” on someone they envy,</div><p class=\"ko\"><mark>질투는 질병을 유발할 수 있다</mark>. 왜냐하면 질투하는 사람이 시기하는 사람에게 ‘증오에 찬 눈초리’를 보낼 수 있기 때문이다</p></div><div class=\"ck-via\"><i>▼</i><span>④를 빼면 ③의 ‘남이 아는 게 더 싫다’ → And so(그래서) 숨긴다로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(7번) · 다시 제자리</span><div class=\"en\">And so almost as soon as we experience the initial feelings of envy, we are motivated to <mark>disguise it</mark> to ourselves</div><p class=\"ko\">그래서 질투의 최초의 감정을 경험하자마자 거의 곧바로, 우리는 우리 자신에게 <mark>그것을 감추도록</mark> 동기가 부여된다</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">질투는 병을 일으킬 수 있다<small>질투를 숨기는 이유가 아니라 질투가 몸에 끼치는 결과 이야기라 흐름에서 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">그래서 다른 감정으로 위장한다</span><span class=\"why\">불공평함·분노 같은 다른 감정이 갑자기 나와 튀어 보이지만, And so(그래서)로 ③의 ‘남이 아는 게 더 싫다’를 받아 disguise(감추다)라는 결론을 내려요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">파악하기 어려운 이유 = 직접 드러내지 않기 때문</span><span class=\"why\">The reason for this elusiveness(이러한 모호함의 이유)로 2번 ‘질투를 알아차리기 어렵다’의 이유를 바로 밝혀요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">질투는 열등함의 인정을 수반한다</span><span class=\"why\">4번은 왜 드러내지 않는지 한 겹 더 들어가요. 질투하면 inferior(열등한)라고 스스로 인정하게 되기 때문이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">인정도 고통스럽고 남이 아는 건 더 나쁘다</span><span class=\"why\">5번은 4번의 inferior(열등한)를 this inferiority(이 열등감)로 받아, 그래서 남이 알면 더 싫다고 이어 가요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Of all the human emotions,</div><div class=\"k\">인간의 모든 감정 중에서,</div></div><div class=\"rc\"><div class=\"e\">none is trickier or more elusive</div><div class=\"k\">더 까다롭거나 더 이해하기 어려운 것은 없다</div></div><div class=\"rc\"><div class=\"e\">than envy.</div><div class=\"k\">질투보다.</div></div><div class=\"rnat\">인간의 모든 감정 중에서 질투보다 더 까다롭거나 더 이해하기 어려운 것은 없다.</div><div class=\"rst\">친구가 새 게임기를 샀을 때 드는 그 찜찜한 마음, 질투는 감정 중 가장 알쏭달쏭해요. = 지문의 가장 까다로운 감정, <b>envy</b>(질투)예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It is very difficult</div><div class=\"k\">매우 어렵다</div></div><div class=\"rc\"><div class=\"e\">to actually discern the envy</div><div class=\"k\">질투를 실제로 알아차리는 것은</div></div><div class=\"rc\"><div class=\"e\">that motivates people’s actions.</div><div class=\"k\">사람들의 행동을 자극하는.</div></div><div class=\"rnat\">사람들의 행동을 자극하는 질투를 실제로 알아차리는 것은 매우 어렵다.</div><div class=\"rst\">친구가 괜히 툴툴대도 그게 질투 때문인지 알아채기 정말 어려워요. 지문도 행동 뒤의 질투를 알아차리기 어렵다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The reason for this elusiveness is simple:</div><div class=\"k\">이러한 모호함의 이유는 간단하다:</div></div><div class=\"rc ckc\"><div class=\"e\">we almost <span class=\"cw\">never directly express</span></div><div class=\"k\">우리는 거의 <span class=\"cw\">직접 표현하지 않는다</span></div></div><div class=\"rc\"><div class=\"e\">the envy we are feeling.</div><div class=\"k\">우리가 느끼고 있는 질투를.</div></div><div class=\"rnat\">① 이러한 모호함의 이유는 간단한데, 우리는 우리가 느끼고 있는 질투를 거의 직접적으로 표현하지 않는다.</div><div class=\"rst\">① 이유는 간단해요. 아무도 “나 너 부러워.” 하고 <b>직접 말하지 않거든요</b>. = 지문의 질투를 직접 표현하지 않는다예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Envy entails the admission to ourselves</div><div class=\"k\">질투는 스스로에 대한 인정을 수반한다</div></div><div class=\"rc\"><div class=\"e\">that we are inferior to another person</div><div class=\"k\">우리가 또 다른 사람보다 열등하다는</div></div><div class=\"rc\"><div class=\"e\">in something we value.</div><div class=\"k\">우리가 가치 있게 여기는 무언가에서.</div></div><div class=\"rnat\">② 질투는 우리가 가치 있게 여기는 무언가에서 우리가 또 다른 사람보다 열등하다는 스스로에 대한 인정을 수반한다.</div><div class=\"rst\">② 부럽다는 건 “내가 쟤보다 못하네.” 하고 스스로 인정하는 거예요. = 지문의 열등하다는 인정(admission)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Not only is it painful to admit this inferiority,</div><div class=\"k\">이 열등감을 인정하는 것은 고통스러울 뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">but it is even worse</div><div class=\"k\">훨씬 더 나쁘다</div></div><div class=\"rc\"><div class=\"e\">for others to see</div><div class=\"k\">다른 사람들이 알게 되는 것은</div></div><div class=\"rc\"><div class=\"e\">that we are feeling this.</div><div class=\"k\">우리가 이것을 느끼고 있다는 것을.</div></div><div class=\"rnat\">③ 이 열등감을 인정하는 것은 고통스러울 뿐만 아니라 우리가 이것을 느끼고 있다는 것을 다른 사람들이 알게 되는 것은 훨씬 더 나쁘다.</div><div class=\"rst\">③ 그 인정도 속상한데, 반 친구들이 내 마음을 알면 더 창피해요. 그래서 지문은 남이 아는 게 더 나쁘다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Envy can cause illness</span></div><div class=\"k\"><span class=\"cw\">질투는 질병을 유발할 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">because people with envy can cast the “evil eye”</div><div class=\"k\">왜냐하면 질투하는 사람이 ‘증오에 찬 눈초리’를 보낼 수 있기</div></div><div class=\"rc\"><div class=\"e\">on someone they envy,</div><div class=\"k\">그들이 시기하는 사람에게,</div></div><div class=\"rc\"><div class=\"e\">even unwittingly,</div><div class=\"k\">무의식적으로라도,</div></div><div class=\"rc\"><div class=\"e\">or the envious person can become ill</div><div class=\"k\">또는 질투심이 강한 사람이 건강이 나빠질 수 있기</div></div><div class=\"rc\"><div class=\"e\">from the emotion.</div><div class=\"k\">그 감정 때문에.</div></div><div class=\"rnat\">④ 질투는 질병을 유발할 수도 있는데 왜냐하면 질투하는 사람이 무의식적으로라도 그들이 시기하는 사람에게 ‘증오에 찬 눈초리’를 보낼 수 있거나 질투심이 강한 사람이 그 감정 때문에 건강이 나빠질 수 있기 때문이다.</div><div class=\"rst\">④ 갑자기 “질투하면 <b>병이 날 수 있다</b>”는 얘기가 나와요. 숨기는 이유가 아니라 몸에 생기는 결과라 지문 흐름에서 튀어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">And so almost as soon as</div><div class=\"k\">그래서 거의 ~하자마자</div></div><div class=\"rc\"><div class=\"e\">we experience the initial feelings of envy,</div><div class=\"k\">우리가 질투의 최초의 감정을 경험하자마자,</div></div><div class=\"rc ckc\"><div class=\"e\">we are motivated to <span class=\"cw\">disguise it</span></div><div class=\"k\">우리는 <span class=\"cw\">그것을 감추도록</span> 동기가 부여된다</div></div><div class=\"rc\"><div class=\"e\">to ourselves —</div><div class=\"k\">우리 자신에게 —</div></div><div class=\"rc\"><div class=\"e\">it is not envy we feel</div><div class=\"k\">우리가 느끼는 것은 질투가 아니라</div></div><div class=\"rc\"><div class=\"e\">but unfairness at the distribution of goods or attention,</div><div class=\"k\">재산의 분배나 관심에 대한 불공평함,</div></div><div class=\"rc\"><div class=\"e\">resentment at this unfairness,</div><div class=\"k\">이 불공평함에 대한 분개,</div></div><div class=\"rc\"><div class=\"e\">even anger.</div><div class=\"k\">심지어는 분노이다.</div></div><div class=\"rnat\">⑤ 그래서 거의 우리가 최초의 질투심을 경험하자마자, 우리는 그것을 우리 자신에게 감추도록 동기가 부여되는데, 즉 그것은 우리가 느끼는 질투가 아니라 재산의 분배나 관심에 대한 불공평함, 이 불공평함에 대한 분개, 심지어는 분노이다.</div><div class=\"rst\">⑤ 그래서 부러움이 들자마자 “게임기 산 게 불공평해서 화난 거야.” 하고 <b>감춰요</b>. = 지문의 다른 감정으로 위장하기예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"elusive\" data-m=\"이해하기 어려운\"><b>elusive</b>이해하기 어려운</button><button type=\"button\" class=\"wdb\" data-w=\"discern\" data-m=\"알아차리다, 식별하다\"><b>discern</b>알아차리다, 식별하다</button><button type=\"button\" class=\"wdb\" data-w=\"entail\" data-m=\"수반하다\"><b>entail</b>수반하다</button><button type=\"button\" class=\"wdb\" data-w=\"inferior\" data-m=\"열등한\"><b>inferior</b>열등한</button><button type=\"button\" class=\"wdb\" data-w=\"unwittingly\" data-m=\"무의식적으로, 무심코\"><b>unwittingly</b>무의식적으로, 무심코</button><button type=\"button\" class=\"wdb\" data-w=\"disguise\" data-m=\"감추다, 위장하다\"><b>disguise</b>감추다, 위장하다</button></div>"};

  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
