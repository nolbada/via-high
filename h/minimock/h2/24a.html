<title>고2 미니모의고사 24회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}

.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}

.cells{display:flex;flex-direction:column;gap:6px}

.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}

.note-item{padding:14px 0;border-bottom:1px solid var(--line)}

.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}

.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}

.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}

.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}

.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}

.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}

.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}

.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}

.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}

/* ---- 새 직독직해·해설 화면 ---- */

(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

var D=[{"no": "01", "typ": "밑줄 함의", "src": "2022년 9월 21번", "evn": [4], "ev_en": "We don’t want to be the innocent messenger who falls before a firing line.", "ev_ko": [[4, "우리는 사선 앞에서 쓰러지는 무고한 전령(불쾌한 소식을 전하는 데 책임을 지는 사람)이 되고 싶어 하지는 않는다."]], "why": ["밑줄 문장은 바로 앞 문장 3의 ‘상사에게 나쁜 소식을 전할 용기’와 이어진다", "<b>the innocent messenger who falls before a firing line<\/b>은 사선 앞에서 쓰러지는 무고한 전령, 즉 <b>불쾌한 소식을 전하는 데 책임을 지는 사람<\/b>이다", "문장 2의 ‘부정적인 감정의 표적이 되는 것을 피하고 싶다’도 같은 두려움을 말한다."], "ch": [{"n": "①", "t": "the employee being criticized for being silent", "g": "침묵하기 때문에 비난받는 직원", "ok": false, "e": ["글은 침묵했다는 이유로 비난받는 이야기가 아니다", "문장 2·3은 나쁜 소식을 <b>전했다가<\/b> 남의 부정적인 감정의 표적이 될까 봐 말하기를 꺼리는 상황이다."]}, {"n": "②", "t": "the peacemaker who pursues non-violent solutions", "g": "비폭력적 해결책을 추구하는 중재자", "ok": false, "e": ["peacemaker(중재자)나 비폭력적인 해결책에 관한 내용은 지문에 없다."]}, {"n": "③", "t": "the negotiator who looks for a mutual understanding", "g": "상호 이해를 기대하는 협상가", "ok": false, "e": ["negotiator(협상가)나 상호 이해에 관한 내용은 지문에 없다."]}, {"n": "④", "t": "the subordinate who wants to get attention from the boss", "g": "상사의 관심을 얻고자 하는 부하", "ok": false, "e": ["subordinate(부하 직원)는 문장 7에 나오지만, 상사의 관심을 얻고 싶어 한다는 내용은 없다", "문장 2는 오히려 남의 부정적인 감정의 표적이 되기를 <b>피하고 싶어 한다<\/b>고 말한다."]}, {"n": "⑤", "t": "the person who gets the blame for reporting unpleasant news", "g": "불쾌한 소식을 전하는 데 책임을 지는 사람", "ok": true, "e": ["innocent(무고한) + messenger(전령) + falls before a firing line(사선 앞에서 쓰러진다)을 풀어 쓴 것이다", "문장 3의 ‘상사에게 나쁜 소식을 전할 용기’, 문장 2의 ‘표적이 되는 것을 피하고 싶다’와 이어진다."]}], "tr": ["아마도 나쁜 소식부터 먼저 이야기하고 넘어가려고 하는 것보다 더 나쁜 것은 그것을 완화하거나 전혀 다루지 않으려고 하는 것이다.", "1970년대 초반에 심리학자인 Sidney Rosen과 Abraham Tesser가 만든 용어인 이 ‘침묵 효과’는 사람들이 다른 사람들의 부정적인 감정의 표적이 되는 것을 피하고 싶기 때문에 발생한다.", "우리 모두는 변화를 이끌 기회를 가지고 있으나, 그것은 종종 우리에게 우리의 상사에게 나쁜 소식을 전달할 용기를 요구한다.", "우리는 사선 앞에서 쓰러지는 무고한 전령(불쾌한 소식을 전하는 데 책임을 지는 사람)이 되고 싶어 하지는 않는다.", "우리의 생존 본능이 발동하면, 그것은 어떤 상황의 진상이 희석될 때까지 우리의 용기를 무효로 할 수 있다.", "“침묵 효과와 그로 인해 발생하는 여과는 가파른 위계 관계에서 파괴적인 결과를 가져올 수 있다.”라고 조직 심리학자 Robert Sutton이 말한다.", "“나쁜 소식으로 시작한 것이 단계를 올라갈수록 점점 더 좋아진다. 그 이유는 각 단계의 상사가 자신의 부하 직원으로부터 그 소식을 듣고 나서 다음 단계로 넘어가기 전에 그것을 다소 덜 나쁘게 들리도록 만들기 때문이다.”"], "ps": [{"n": 1, "ch": [{"e": "Perhaps worse", "k": "아마도 <b>더 나쁜 것은<\/b>"}, {"e": "than attempting to get the bad news out of the way", "k": "나쁜 소식을 먼저 처리해 넘어가려고 하는 것보다"}, {"e": "is attempting to soften it", "k": "그것<span class=\"r\">(= 나쁜 소식)<\/span>을 <b>완화하려고<\/b> 하는 것이다"}, {"e": "or simply not address it at all.", "k": "또는 아예 <b>다루지 않으려고<\/b> 하는 것이다."}], "link": "나쁜 소식을 먼저 처리해 넘어가려고 하는 것보다 더 나쁜 것은, 아마도 그것을 완화하거나 아예 다루지 않으려고 하는 것이다.", "easy": "나쁜 소식을 빨리 말하고 끝내려는 것도 문제인데, 그걸 부드럽게 바꾸거나 아예 말을 안 하려는 건 더 나쁘다는 뜻이에요.", "gist": "글의 주제인 ‘나쁜 소식을 전하기 꺼리는 태도’를 꺼내는 첫 문장이에요."}, {"n": 2, "ch": [{"e": "This “Mum Effect”", "k": "이 <b>‘침묵 효과’<\/b>는"}, {"e": "— a term coined by psychologists Sidney Rosen and Abraham Tesser in the early 1970s —", "k": "1970년대 초반에 심리학자 Sidney Rosen과 Abraham Tesser가 <b>만든 용어인<\/b>"}, {"e": "happens because people want to avoid", "k": "<b>발생한다<\/b>, 사람들이 피하고 싶어 하기 때문에"}, {"e": "becoming the target of others’ negative emotions.", "k": "다른 사람들의 부정적인 감정의 <b>표적이 되는 것을<\/b>."}], "link": "1970년대 초반에 심리학자 Sidney Rosen과 Abraham Tesser가 만든 용어인 이 ‘침묵 효과’는, 사람들이 다른 사람들의 부정적인 감정의 표적이 되는 것을 피하고 싶어 하기 때문에 발생한다.", "easy": "‘침묵 효과’는 남의 부정적인 감정을 받는 쪽이 되기 싫어서 말을 하지 않게 되는 현상이에요.", "gist": "나쁜 소식을 말하지 않게 되는 이유를 ‘침묵 효과’라는 용어로 설명해요."}, {"n": 3, "ch": [{"e": "We all have the opportunity to lead change,", "k": "우리 모두는 변화를 이끌 <b>기회<\/b>를 가지고 있다,"}, {"e": "yet it often requires of us", "k": "그러나 그것은 종종 우리에게 <b>요구한다<\/b>"}, {"e": "the courage to deliver bad news", "k": "나쁜 소식을 전달할 <b>용기<\/b>를"}, {"e": "to our superiors.", "k": "우리의 상사에게."}], "easy": "누구나 변화를 만들 기회가 있지만, 그러려면 윗사람에게 나쁜 소식을 말할 용기가 필요할 때가 많다는 뜻이에요.", "gist": "변화를 이끌려면 용기가 필요하다는 점을 짚어, 다음 문장의 두려움으로 이어 줘요."}, {"n": 4, "ch": [{"e": "We don’t want to be", "k": "우리는 되고 싶어 하지 않는다"}, {"e": "the innocent messenger", "k": "<b>무고한 전령<\/b>(불쾌한 소식을 전하는 데 책임을 지는 사람)이"}, {"e": "who falls befor function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

pectable<sup>1</sup>, competent<sup>2</sup>, and knowledgeable<sup>3</sup>\u0002, / it can be hard / to let go<sup>4</sup> \u0001sometimes\u0002 and become \u0001physically and emotionally\u0002 free.", "pk": "\u0001누군가가 늘 존경받을 만하고 유능하며 박식해 보이는 것에 대해 걱정하며 성인기를 보냈다면\u0002 / 어려울 수 있다 / \u0001때때로\u0002 내려놓고 \u0001신체적·정서적으로\u0002 자유로워지는 것이", "core": "내려놓고 자유로워지는 것이 어려울 수 있다.", "tags": ["If ~ = 부사절(조건): 주절 수식. 안쪽: has spent + 목적어 life + 분사 worried about ~", "가주어 it + 동사 can be + 보어 hard (2형식)", "<b>진주어</b> to let go and become free (병렬). sometimes = 부사: let go 수식 / physically and emotionally = 부사: free 수식"], "steps": [{"t": "이 문장은 <b>if절 + 가주어 It + V + C(2형식)</b>이다. 앞 if절과 뒤 진주어가 길어 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: It (가주어. 진짜 주어는 to let go ~)", "V: can be (be동사)", "C: hard (어려운)", "뼈대 = <b>It can be hard to let go ~</b>"]}, {"t": "진주어는 to부정사 두 개의 병렬이다.", "sub": ["to let go sometimes = 가끔 힘을 빼고 놓아 버리는 것 (let go 놓다)", "and (to) become physically and emotionally free = 몸도 마음도 자유로워지는 것 (become+형용사 2형식. physically 신체적으로, emotionally 정서적으로)"]}, {"t": "맨 앞 <b>If someone has spent his adult life worried about ~</b>는 조건절이다. 뼈대는 3형식이다.", "sub": ["S: someone (누군가), V: has spent (spend 보내다), O: his adult life (그의 성인기)", "worried about ~ = ~를 걱정하며 (과거분사구. 어른의 삶을 걱정하는 상태로 보냈다는 뜻)", "always appearing respectable, competent, and knowledgeable = 늘 남부끄럽지 않고 유능하며 박식해 보이는 것 (appear+형용사. respectable 존경받을 만한, competent 유능한, knowledgeable 박식한)"]}], "sum": "체면에 신경 쓰며 살아온 사람은 가끔 힘을 빼고 자유로워지기 어려울 수 있음"}, {"i": "06", "q": "04", "s": "3", "title": "S+V+O(3형식) + 현재분사 후치수식", "eng": "Like me, / she has freckles<sup>1</sup> / stretching<sup>2</sup> across the bridge of her nose<sup>3</sup> almost like a Band-Aid.", "notes": [["1", "freckle", "주근깨"], ["2", "stretch", "뻗다, 늘어나다"], ["3", "bridge of one's nose", "콧날, 콧등"]], "lit": "나처럼 / 그녀는 주근깨를 가지고 있다 / 거의 반창고처럼 그녀의 콧날을 가로질러 뻗어 있는", "nat": "나처럼 그 아이도 반창고를 붙여 놓은 것처럼 콧등을 가로질러 주근깨가 죽 나 있다.", "ana": "<b>stretching</b>은 진행형의 일부가 아니라 앞의 명사 freckles를  박테리아를 이미 죽여 놓은 상태였다\u0002", "core": "그 곰팡이는 ~였다.", "tags": ["The mold was: 1형식 SV(be). from the species = 전치사구(부사구): was 꾸밈, 거의 필수에 가까운 부사구(be + 전치사구) [기준: 모양 규칙]", "which ~ = 계속적 관계절(형용사절): species(곰팡이) 보충 설명. 과거완료 had killed = 그 이전에 이미"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. be동사 뒤에 장소·출처 전치사구가 오고 계속적 관계절이 붙는다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The mold (곰팡이)", "V: was (be동사)", "from the penicillium notatum species = 페니킬리움 노타툼 종에서 나온 (be동사 뒤에서 출처를 말하는 필수에 가까운 부사구)", "뼈대 = <b>The mold was from the species</b>"]}, {"t": "<b>which had killed the bacteria on the Petri dish</b>는 계속적 관계절이다. which는 the penicillium notatum species(종)를 가리킨다.", "sub": ["had killed = 이미 죽여 놓았던 (과거완료. 곰팡이 얘기보다 앞선 일)", "kill 죽이다, bacteria 세균, Petri dish 페트리 접시"]}, {"t": "mold는 '곰팡이', species는 '종'이다."}], "sum": "그 곰팡이, 접시 위 세균을 죽여 놓았던 페니킬리움 노타툼 종에서 나온 것"}, {"i": "08", "q": "06", "s": "5", "title": "Not only 도치 + 가주어 it ~ 진주어 to부정사/for A to V", "eng": "Not only is it painful to admit<sup>1</sup> this inferiority<sup>2</sup>, / but it is even worse for others to see / that we are feeling this.", "notes": [["1", "admit", "인정하다"], ["2", "inferiority", "열등함"]], "lit": "이 열등함을 인정하는 것이 고통스러울 뿐만 아니라 / 다른 사람들이 보는 것은 훨씬 더 나쁘다 / 우리가 이것을 느끼고 있다는 것을", "nat": "이 열등함을 인정하는 일이 고통스러울 뿐 아니라, 우리가 그렇게 느끼고 있다는 걸 남들이 알아채는 건 훨씬 더 나쁘다.", "ana": "부정어 <b>Not only</b>가 문장 맨 앞으로 나가면 뒤가 <b>의문문 어순으로 도치</b>되어 is it이 된다. 원래는 It is not only painful ~이다. 도치된 형태를 보고 의문문으로 착각하면 안 된다. 뒤 절의 <b>for others</b>는 to see의 <b>의미상 주어</b>로, ‘남들이 보는 것’이라는 뜻이다.", "pe": "Not only is it painful to admit<sup>1</sup> this inferiority<sup>2</sup>, / but it is \u0001even\u0002 worse for others to see / that we are feeling this.", "pk": "이 열등함을 인정하는 것이 고통스러울 뿐만 아니라 / 다른 사람들이 보는 것은 \u0001훨씬\u0002 더 나쁘다 / 우리가 이것을 느끼고 있다는 것을", "core": "이 열등함을 인정하는 것이 고통스러울 뿐 아니라 남들이 보는 것은 더 나쁘다.", "tags": ["<b>Not only</b> 도치: is it painful. 가주어 It + 보어 painful / <b>진주어</b> to admit this inferiority", "<b>but</b>: not only A but B. 가주어 it + 동사 is + 보어 worse. eve ame)을 뒤집어쓰는 사람</b>이다. 문장 7의 ‘각 상사가 소식을 덜 나쁘게 만들어 올려 보낸다’가 그 두려움의 결과다."}], "opts": [{"n": "①", "t": "침묵했다는 이유로 비난받는 직원", "a": false, "x": true, "trap": false, "e": "글은 반대다. 소식을 <b>말했다가</b> 표적이 되는 것을 두려워해 침묵하는 상황이다."}, {"n": "②", "t": "비폭력적 해결책을 추구하는 중재자", "a": false, "x": true, "trap": false, "e": "peacemaker나 갈등 해결 방식에 관한 언급이 전혀 없다."}, {"n": "③", "t": "상호 이해를 모색하는 협상가", "a": false, "x": true, "trap": false, "e": "협상(negotiation)이나 상호 이해는 이 글의 소재가 아니다. firing line이라는 표현만 보고 대립 상황을 떠올리면 걸린다."}, {"n": "④", "t": "상사의 관심을 얻고 싶어 하는 부하 직원", "a": false, "x": true, "trap": true, "e": "subordinate는 문장 7에 나오지만 ‘관심을 얻으려는’ 동기는 어디에도 없다. 오히려 관심의 표적이 되기를 <b>피하려는</b> 쪽이다."}, {"n": "⑤", "t": "불쾌한 소식을 전한 탓에 책임을 뒤집어쓰는 사람", "a": true, "x": false, "trap": false, "e": "innocent(무고한) + messenger(전령) + falls before a firing line(사선 앞에서 쓰러진다)을 그대로 옮긴 것이다. 문장 2의 ‘남의 부정적 감정의 표적이 되는 것을 피하고 싶다’와 정확히 맞물린다."}], "w": [["attempt to V", "~하려고 시도하다"], ["get A out of the way", "A를 먼저 처리해 치우다"], ["soften", "완화하다"], ["address", "다루다, 대처하다"], ["coin", "(용어를) 만들어 내다"], ["target", "표적, 대상"], ["superior", "상사, 윗사람"], ["innocent", "무고한"], ["messenger", "전령, 전달자"], ["firing line", "사선, 최전방"], ["instinct", "본능"], ["kick in", "발동하다"], ["override", "무효로 하다, 압도하다"], ["water down", "희석시키다"], ["devastating", "파괴적인"], ["steep", "가파른"], ["hierarchy", "위계, 계층 구조"], ["rank", "(조직의) 계급, 서열"], ["subordinate", "부하 직원"], ["blame", "책임, 비난"]]}, {"q": "02", "type": "도표 불일치", "src": "2021학년도 수능 25번", "ans": "⑤", "tr": [["1", "위 그래프는 2012년과 2019년 여섯 개 국가 각각의 소매 판매 온라인 점유율을 보여 준다."], ["2", "소매 판매의 온라인 점유율이란, 특정 국가에서 온라인으로 이루어진 소매 판매가 차지하는 비율을 뜻한다."], ["3", "① 각 국가에서 2019년의 소매 판매 온라인 점유율은 2012년의 그것보다 더 컸다."], ["4", "② 여섯 개 국가 중 영국이 19.7퍼센트로 2019년 가장 큰 소매 판매 온라인 점유율을 차지했다."], ["5", "③ 2019년에 미국이 16.5퍼센트로 두 번째로 큰 소매 판매 온라인 점유율을 차지했다."], ["6", "④ 2012년에는 네덜란드의 소매 판매 온라인 점유율이 프랑스의 그것보다 더 컸지만, 2019년에는 그 반대였다."], ["7", "⑤ 스페인과 이탈리아의 경우, 두 나라 모두 2012년과 2019년 양쪽 모두에서 소매 판매 온라인 점유율이 5.0퍼센트보다 적었다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "In the case of Spain and Italy, the online share of retail sales in each country was less than 5.0% both in 2012 and in 2019."}, {"en": false, "h": "도표 문제는 <b>both A and B</b>, <b>each</b>, <b>less than</b> 같은 범위 표현이 붙은 선지부터 확인한다. 스페인은 2012년 2.0퍼센트로 5.0퍼센트 미만이 맞지만, <b>2019년에는 5.4퍼센트</b>로 5.0퍼센트를 넘는다. ‘both in 2012 and in 2019(두 해 모두)’라는 조건 하나가 깨지므로 선지 전체가 틀린다."}], "opts": [{"n": "①", "t": "각 국가에서 2019년 온라인 점유율이 2012년보다 컸다", "a": false, "x": true, "trap": false, "e": "여섯 나라 모두 오른쪽(2019) 막대가 왼쪽(2012)보다 높다. 도표와 일치한다."}, {"n": "②", "t": "영국이 19.7%로 2019년 최대 점유율을 차지했다", "a": false, "x": true, "trap": false, "e": "19.7퍼센트는 도표에서 가장 높은 막대이고 영국의 2019년 수치다. 일치한다."}, {"n": "③", "t": "미국이 16.5%로 2019년 두 번째로 큰 점유율을 차지했다", "a": false, "x": true, "trap": false, "e": "영국 19.7퍼센트 다음이 미국 16.5퍼센트다. 일치한다."}, {"n": "④", "t": "2012년에는 네덜란드가 프랑스보다 컸고 2019년에는 반대였다", "a": false, "x": true, "trap": true, "e": "2012년 네덜란드 5.7 &gt; 프랑스 5.4, 2019년 프랑스 10.9 &gt; 네덜란드 9.9로 실제로 역전된다. the reverse was true라는 표현이 낯설어 흔들리는 선지다."}, {"n": "⑤", "t": "스페인과 이탈리아는 두 해 모두 5.0% 미만이었다", "a": true, "x": false, "trap": false, "e": "스페인의 2019년 수치가 5.4퍼센트로 5.0퍼센트를 넘는다. ‘두 해 모두’라는 조건이 깨진다."}], "w": [["share", "점유율, 몫"], ["retail sales", "소매 판매"], ["refer to", "~을 나타내다"], ["conduct", "수행하다"], ["given", "주어진, 특정한"], ["own", "가지다, 보유하다"], ["second largest", "두 번째로 큰"], ["whereas", "반면에"], ["reverse", "반대, 역(逆)"], ["in the case of", "~의 경우에"], ["less than", "~보다 적은"], ["both A and B", "A와 B 둘 다"], ["exclude", "제외하다"]]}, {"q": "03", "type": "필자의 주장", "src": "2020학년도 수능 20번", "ans": "①", "tr": [["1", "어른들이 놀이를 하는 데 가장 큰 걸림돌은 아마도, 스스로에게 진짜로 놀도록 허락하면 자신이 우스꽝스럽거나 부적절하거나 멍청해 보일 것이라는 걱정일 것이다."], ["2", "또는 그들은 규칙적으로 놀이에 자신을 내맡기는 것이 무책임하고 치기 어리며 유치하다고 생각한다."], ["3", "허튼짓과 어리석음은 아이들에게는 자연스럽게 나오지만, ‘경박함’을 낮잡아 보는 규범에 의해 두들겨 맞아 사라진다."], ["4", "이것은 부모나 교육 제도가 세운 성과 기준으로 평가받아 왔거나, 내면화되어 더는 의심조차 하지 않는 다른 문화적 규범으로 평가받아 온 사람들에게 특히 그렇다."], ["5", "늘 남부끄럽지 않고 유능하며 박식해 보이는 데 신경 쓰며 어른의 삶을 보내 온 사람이라면, 가끔 힘을 빼고 몸도 마음도 자유로워지는 일이 어려울 수 있다."] function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){

      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;

  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();

  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){

}
