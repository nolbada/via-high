결정 시 시간과 비용을 최우선으로 고려하라.</span><span class=\"why\">[반대] 6번은 임시 해결책이 more expensive(더 비싼)여도 괜찮다고 해요. 시간·비용을 아끼는 게 먼저가 아니라, 돈을 더 써서라도 현명하게 고를 시간을 벌라는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">시급한 상황일수록 원칙에 따라 행동하라.</span><span class=\"why\">[지문에 없음] 원칙을 지키라는 문장은 없어요. 2번은 오히려 멈춰서 alternative courses of action(다른 행동 방침들)을 생각하라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">집단의 성공을 위해 개인의 불편을 감수하라.</span><span class=\"why\">[지문에 없음] 6번 inconvenient(불편한)만 따온 함정이에요. 불편을 참는 이유는 집단의 성공이 아니라 내가 현명하게 고를 시간을 벌기 위해서예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">자신의 능력에 맞는 단기적 목표를 수립하라.</span><span class=\"why\">[지문에 없음] 6번 in the short run(단기적으로)이 보여 함정이에요. 임시 해결책은 목표가 아니라 long-term selection(장기적인 선택)을 위한 징검다리예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Whenever you find yourself</div><div class=\"k\">당신이 자신을 발견할 때마다</div></div><div class=\"rc\"><div class=\"e\">reacting differently</div><div class=\"k\">다르게 반응하는</div></div><div class=\"rc\"><div class=\"e\">than you would</div><div class=\"k\">당신이 ~했을 것과</div></div><div class=\"rc\"><div class=\"e\">if you had unlimited time,</div><div class=\"k\">시간이 제한 없이 있었다면,</div></div><div class=\"rc\"><div class=\"e\">you’re acting out of neediness</div><div class=\"k\">당신은 절박함에서 비롯된 행동을 하고 있는 것이고</div></div><div class=\"rc\"><div class=\"e\">and won’t be reading people clearly.</div><div class=\"k\">사람들을 분명하게 이해하지 못할 것이다.</div></div><div class=\"rnat\">시간이 얼마든지 있었다면 했을 반응과 다르게 반응하고 있는 자신을 발견할 때마다, 당신은 절박함에서 비롯된 행동을 하고 있는 것이고 사람들을 제대로 읽어 내지 못하고 있는 것이다.</div><div class=\"rst\">등굣길에 자전거가 고장 났어요. 마음이 급해서 아무 자전거나 사려고 해요. = 지문 1번, 급할 때는 절박함에서 비롯된 행동을 한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Stop and consider</span></div><div class=\"k\"><span class=\"cw\">멈춰서 고려해 보라</span></div></div><div class=\"rc\"><div class=\"e\">alternative courses of action</div><div class=\"k\">다른 행동 방침들을</div></div><div class=\"rc\"><div class=\"e\">before you go forward.</div><div class=\"k\">앞으로 나아가기 전에.</div></div><div class=\"rnat\">앞으로 나아가기 전에 멈춰 서서 다른 행동 방침을 고려해 보라.</div><div class=\"rst\"><b>잠깐 멈춰서</b>(Stop and consider 멈춰서 고려하라) 다른 방법이 없나 생각해 봐요. 지문 2번이 바로 이렇게 시켜요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It’s often best</div><div class=\"k\">종종 최선이다</div></div><div class=\"rc ckc\"><div class=\"e\">to find a <span class=\"cw\">temporary solution</span></div><div class=\"k\"><span class=\"cw\">임시 해결책</span>을 찾는 것이</div></div><div class=\"rc\"><div class=\"e\">to begin with,</div><div class=\"k\">우선은,</div></div><div class=\"rc\"><div class=\"e\">and decide on a permanent one later.</div><div class=\"k\">그리고 영구적인 해결책은 나중에 결정하는 것이.</div></div><div class=\"rnat\">우선은 임시 해결책을 찾고, 영구적인 해결책은 나중에 결정하는 것이 최선인 경우가 많다.</div><div class=\"rst\">우선 버스를 타고, 진짜 살 자전거는 나중에 정해요. = 지문 3번, <b>임시 해결책</b>(temporary solution)부터 찾고 영구적인 건 나중에!</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The parents urgently seeking child care</div><div class=\"k\">급히 아이 돌봄을 구하는 부모는</div></div><div class=\"rc\"><div class=\"e\">could put their immediate efforts</div><div class=\"k\">즉각적인 노력을 쏟을 수 있다</div></div><div class=\"rc\"><div class=\"e\">into convincing a friend or family member</div><div class=\"k\">친구나 가족 구성원을 설득하는 데</div></div><div class=\"rc\"><div class=\"e\">to help out for a week or two,</div><div class=\"k\">한두 주 동안 도와 달라고,</div></div><div class=\"rc\"><div class=\"e\">buying them time</div><div class=\"k\">그들(= 부모)에게 시간을 벌어 주면서</div></div><div class=\"rc\"><div class=\"e\">to look for permanent help.</div><div class=\"k\">영구적인 도움을 찾을 (수 있는).</div></div><div class=\"rnat\">급히 아이 돌봄이 필요한 부모라면 친구나 가족에게 한두 주만 도와 달라고 설득하는 데 우선 힘을 쏟을 수 있고, 그렇게 해서 장기적인 도움을 찾을 시간을 벌 수 있다.</div><div class=\"rst\">가족에게 “한두 주만 자전거 빌려줘” 하고 부탁해요. 지문 4번도 급한 부모가 친구·가족에게 한두 주 도와 달라고 해서 시간을 번대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">If they can afford it,</div><div class=\"k\">그들(= 부모)이 금전적 여유가 된다면,</div></div><div class=\"rc\"><div class=\"e\">they can hire a professional nanny</div><div class=\"k\">그들은 전문 보모를 고용할 수 있다</div></div><div class=\"rc\"><div class=\"e\">for a while.</div><div class=\"k\">한동안.</div></div><div class=\"rnat\">여유가 된다면 한동안 전문 보모를 고용할 수도 있다.</div><div class=\"rst\">용돈이 넉넉하면 한동안 공유 자전거를 빌려 타도 돼요. = 지문 5번, 여유가 되면 한동안 전문 보모를 쓰는 것이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Temporary solutions may be more expensive</div><div class=\"k\">임시 해결책은 더 비쌀지도 모른다</div></div><div class=\"rc\"><div class=\"e\">or inconvenient in the short run,</div><div class=\"k\">또는 단기적으로는 불편할지도,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but they’ll give you the time</span></div><div class=\"k\"><span class=\"cw\">하지만 그것들(= 임시 해결책)은 당신에게 시간을 줄 것이다</span></div></div><div class=\"rc\"><div class=\"e\">you need</div><div class=\"k\">당신이 필요로 하는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to make a wise choice</span></div><div class=\"k\"><span class=\"cw\">현명한 선택을 하기 위해</span></div></div><div class=\"rc\"><div class=\"e\">about your long-term selection.</div><div class=\"k\">당신의 장기적인 선택에 대해.</div></div><div class=\"rnat\">임시 해결책은 단기적으로는 더 비싸거나 불편할 수 있지만, 장기적인 선택에 대해 현명한 결정을 내리는 데 필요한 시간을 당신에게 줄 것이다.</div><div class=\"rst\">빌려 타는 건 돈도 들고 불편하지만, <b>좋은 자전거를 고를 시간</b>을 줘요. 그래서 지문은 임시 해결책이 현명한 선택을 할 시간을 준다고 말해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"neediness\" data-m=\"절박함\"><b>neediness</b>절박함</button><button type=\"button\" class=\"wdb\" data-w=\"course of action\" data-m=\"행동 방침\"><b>course of action</b>행동 방침</button><button type=\"button\" class=\"wdb\" data-w=\"temporary\" data-m=\"임시의\"><b>temporary</b>임시의</button><button type=\"button\" class=\"wdb\" data-w=\"permanent\" data-m=\"영구적인\"><b>permanent</b>영구적인</button><button type=\"button\" class=\"wdb\" data-w=\"buy time\" data-m=\"시간을 벌다\"><b>buy time</b>시간을 벌다</button><button type=\"button\" class=\"wdb\" data-w=\"in the short run\" data-m=\"단기적으로\"><b>in the short run</b>단기적으로</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">안내문 불일치는 <b>선택지 순서 = 지문 순서</b>예요. 위에서부터 하나씩 대조하다가 <b>전화·이메일</b>처럼 <b>방법</b> 단어 하나로 갈리는 곳에서 멈추세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번 도시 전역 탈출 게임</span><span><em>②</em>5번 티켓 구매 방법</span><span><em>③</em>7번 상세 정보 보내는 방법</span><span><em>④</em>11번 운영 기간</span><span><em>⑤</em>14번 티켓 가격</span></div><div class=\"ck-eq\">⇒ 선택지 다섯 개가 지문 순서대로 한 군데씩 걸려 있어요</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 시작일 고르기</span><div class=\"en\">Choose the start date for the game.</div><p class=\"ko\">게임의 시작 일자를 고르세요.</p></div><div class=\"ck-via\"><i>▼</i><span>고른 날짜 전에 정보를 ‘어떻게’ 보내는지가 여기 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">③ 차례 · 7번 문장 (결정적 단서)</span><div class=\"en\">We will send you <mark>detailed information</mark> <mark>via email</mark> before your date of choice.</div><p class=\"ko\">우리는 당신이 선택한 일자 이전에 <mark>이메일을 통해</mark> 당신에게 <mark>상세한 정보를</mark> 보내 드립니다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">선택한 게임 시작일 이전에 전화로 상세한 정보를 알려 준다.<small>7번은 via email(이메일을 통해) 보낸다고 했어요. 전화는 어디에도 없어요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">2021년 3월 1일부터 세 달간 열린다.</span><span class=\"why\">‘세 달’은 직접 세어 봐야 해서 헷갈려요. 11번 3월 1일 – 5월 31일은 3월·4월·5월, 딱 세 달이라 일치해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">도시 전역에서 벌어지는 탈출 게임이다.</span><span class=\"why\">2번 city-wide escape game(도시 전역에서 벌어지는 탈출 게임)과 그대로 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">최대 여섯 명으로 구성된 팀당 티켓 한 장을 사야 한다.</span><span class=\"why\">5번 one ticket per team(팀당 티켓 한 장), up to(최대) 6명과 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">티켓 가격은 매일 달라질 수 있다.</span><span class=\"why\">14번 괄호 속 may change on a daily basis(매일 달라질 수 있다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The Riverside Escape</div><div class=\"k\">Riverside 탈출</div></div><div class=\"rnat\">Riverside 탈출</div><div class=\"rst\">주말에 친구들이랑 뭐 하고 놀지 찾다가 광고 하나를 봤어요. = 지문 1번 제목, Riverside(리버사이드) 탈출 게임이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The Riverside Escape is a city-wide escape game</div><div class=\"k\">Riverside 탈출은 도시 전역에서 벌어지는 탈출 게임입니다</div></div><div class=\"rc\"><div class=\"e\">played on your smartphone.</div><div class=\"k\">당신의 스마트폰으로 하는.</div></div><div class=\"rnat\">Riverside 탈출은 당신의 스마트폰으로 하는 도시 전역에서 벌어지는 탈출 게임입니다.</div><div class=\"rst\">방 안이 아니라 <b>도시 전체</b>를 돌아다니며 스마트폰으로 하는 탈출 게임이래요. = 지문 2번 → ① 일치</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">We turn the city of Riverside</div><div class=\"k\">우리는 Riverside 도시를 바꿉니다</div></div><div class=\"rc\"><div class=\"e\">into a giant escape game</div><div class=\"k\">하나의 거대한 탈출 게임으로,</div></div><div class=\"rc\"><div class=\"e\">wherein teams must race around the city</div><div class=\"k\">그곳(= 도시)에서 팀들은 도시를 질주해야 합니다</div></div><div class=\"rc\"><div class=\"e\">completing challenges</div><div class=\"k\">도전 과제들을 완수하면서</div></div><div class=\"rc\"><div class=\"e\">without getting caught.</div><div class=\"k\">잡히지 않은 채로.</div></div><div class=\"rnat\">우리는 Riverside 도시를 하나의 거대한 탈출 게임으로 바꾸고, 그곳(도시)에서 팀들은 잡히지 않은 채로 도전 과제들을 완수하면서 도시를 질주해야 합니다.</div><div class=\"rst\">우리 동네가 통째로 게임판이 되는 거예요. 지문 3번은 팀이 잡히지 않고 과제를 풀며 도시를 달린다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">How to Play</div><div class=\"k\">게임하는 방법</div></div><div class=\"rnat\">게임하는 방법</div><div class=\"rst\">“어떻게 하는 거지?” 지문 4번은 게임 방법이 시작된다는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Get your ticket —</div><div class=\"k\">티켓을 구매하세요 —</div></div><div class=\"rc\"><div class=\"e\">one ticket per team of up to 6 players.</div><div class=\"k\">최대 6인으로 이루어진 팀당 티켓 한 장.</div></div><div class=\"rnat\">• 티켓을 구매하세요 — 최대 6인으로 이루어진 팀당 티켓 한 장</div><div class=\"rst\">먼저 티켓을 사요. 한 장으로 최대 6명이 한 팀! 우리 반 단짝 다섯 명이랑 딱 맞아요. = 지문 5번 → ② 일치</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Choose the start date for the game.</div><div class=\"k\">게임의 시작 일자를 고르세요.</div></div><div class=\"rnat\">• 게임의 시작 일자를 고르세요.</div><div class=\"rst\">다음엔 언제 할지 날짜를 골라요. = 지문 6번, 게임 시작 일자를 고르라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">We will send you <span class=\"cw\">detailed information</span></div><div class=\"k\">우리는 당신에게 <span class=\"cw\">상세한 정보를</span> 보내 드립니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">via email</span></div><div class=\"k\"><span class=\"cw\">이메일을 통해</span></div></div><div class=\"rc\"><div class=\"e\">before your date of choice.</div><div class=\"k\">당신이 선택한 일자 이전에.</div></div><div class=\"rnat\">우리는 당신이 선택한 일자 이전에 이메일을 통해 상세한 정보를 보내 드립니다.</div><div class=\"rst\">그러면 그날 전에 자세한 안내가 <b>이메일로</b>(via email) 와요. 전화가 오는 게 아니에요! = 지문 7번 → ③이 틀린 곳</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Arrive at the start location</div><div class=\"k\">시작 지점에 도착해서</div></div><div class=\"rc\"><div class=\"e\">and start anytime you want</div><div class=\"k\">당신이 원하는 때에 언제든 시작하세요</div></div><div class=\"rc\"><div class=\"e\">on the day.</div><div class=\"k\">그날.</div></div><div class=\"rnat\">• 그날 시작 지점에 도착해서 당신이 원하는 때에 언제든 시작하세요.</div><div class=\"rst\">그날 출발 장소에 가서 우리가 원할 때 아무 때나 시작하면 돼요. = 지문 8번</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Score as many points as possible</div><div class=\"k\">가능한 한 많은 점수를 얻으세요</div></div><div class=\"rc\"><div class=\"e\">by answering the puzzles</div><div class=\"k\">퍼즐에 대한 답을 함으로써</div></div><div class=\"rc\"><div class=\"e\">while moving around the city.</div><div class=\"k\">도시를 돌아다니는 동안.</div></div><div class=\"rnat\">• 도시를 돌아다니는 동안 퍼즐에 대한 답을 함으로써 가능한 한 많은 점수를 얻으세요.</div><div class=\"rst\">도시를 돌며 퍼즐을 풀수록 점수가 올라가요. 지문 9번은 점수를 최대한 많이 따라고 해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Opening Times</div><div class=\"k\">운영 시간</div></div><div class=\"rnat\">운영 시간</div><div class=\"rst\">“언제까지 하지?” 지문 10번은 운영 시간을 알려 주는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">March 1, 2021 – May 31, 2021</div><div class=\"k\">2021년 3월 1일 – 2021년 5월 31일</div></div><div class=\"rnat\">2021년 3월 1일 - 2021년 5월 31일</div><div class=\"rst\">3월 1일부터 5월 31일까지, 손가락으로 세면 3월·4월·5월 세 달이에요. = 지문 11번 → ④ 일치</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Monday – Sunday, 10:00 – 20:00</div><div class=\"k\">월요일 – 일요일, 10:00 – 20:00</div></div><div class=\"rnat\">월요일 - 일요일, 10:00 - 20:00</div><div class=\"rst\">월요일부터 일요일까지 매일, 아침 10시부터 저녁 8시까지 열려요. = 지문 12번</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Ticket Price</div><div class=\"k\">티켓 가격</div></div><div class=\"rnat\">티켓 가격</div><div class=\"rst\">“얼마야?” 지문 13번은 티켓 가격이 나오는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">$50 per ticket</div><div class=\"k\">티켓당 50달러</div></div><div class=\"rc\"><div class=\"e\">(This price may change on a daily basis.)</div><div class=\"k\">(이 가격은 매일 달라질 수 있습니다.)</div></div><div class=\"rnat\">티켓당 50달러 (이 가격은 매일 달라질 수 있습니다.)</div><div class=\"rst\">한 장에 50달러인데, 가격이 날마다 바뀔 수 있대요. = 지문 14번 → ⑤ 일치</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Come join us</div><div class=\"k\">와서 저희와 함께 하세요</div></div><div class=\"rc\"><div class=\"e\">for an escape adventure!</div><div class=\"k\">탈출 모험을 위해!</div></div><div class=\"rnat\">탈출 모험을 위해 와서 저희와 함께 하세요!</div><div class=\"rst\">마지막엔 “탈출 모험하러 오세요!” 하고 초대해요. 지문 15번이 광고를 끝맺는 말이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"city-wide\" data-m=\"도시 전역의\"><b>city-wide</b>도시 전역의</button><button type=\"button\" class=\"wdb\" data-w=\"wherein\" data-m=\"그곳에서\"><b>wherein</b>그곳에서</button><button type=\"button\" class=\"wdb\" data-w=\"without getting caught\" data-m=\"잡히지 않은 채로 (get caught 붙잡히다)\"><b>without getting caught</b>잡히지 않은 채로 (get caught 붙잡히다)</button><button type=\"button\" class=\"wdb\" data-w=\"up to\" data-m=\"최대 ~까지\"><b>up to</b>최대 ~까지</button><button type=\"button\" class=\"wdb\" data-w=\"detailed\" data-m=\"상세한\"><b>detailed</b>상세한</button><button type=\"button\" class=\"wdb\" data-w=\"on a daily basis\" data-m=\"매일\"><b>on a daily basis</b>매일</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>첫 문장의 화제</b>와 <b>But(하지만) 뒤 결론</b>을 묶어서 찾으세요. 1번 <b>self-conscious</b>(자의식 과잉의)가 화제를 열고, 8번 <b>at the expense of being who you really are</b>(진짜 내 모습을 희생하면서)가 결론을 닫아요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제</span><div class=\"en\">Winning turns on <mark>a self-conscious awareness</mark> that others are watching.</div><p class=\"ko\">승리는 다른 이들이 보고 있다는 <mark>자의식 과잉의 인식</mark>을 촉발한다.</p></div><div class=\"ck-via\"><i>▼</i><span>2·3번(아무도 모를 땐 편함)과 But(하지만)으로 대조돼요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 이기는 순간 바뀜</span><div class=\"en\">But as soon as you start to win, and others start to notice, <mark>you’re suddenly aware</mark> that you’re being observed.</div><p class=\"ko\">하지만 당신이 이기기 시작하고 다른 사람들이 알아차리기 시작하자마자, 당신은 관찰되고 있다는 것을 <mark>갑자기 인식하게 된다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>남의 눈을 의식하니 어떤 행동이 나오는지 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 진짜 나를 숨김</span><div class=\"en\">and <mark>you start hiding your true personality</mark>, so you can be a good role model</div><p class=\"ko\">그리고 좋은 본보기가 될 수 있도록 <mark>당신의 진정한 성격을 숨기기 시작한다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>But(하지만) 뒤에서 숨기기의 대가를 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 결론</span><div class=\"en\">But if you do it <mark>at the expense of being who you really are</mark>, … you’re not going to be in that position very long.</div><p class=\"ko\">하지만 <mark>당신이 진정한 모습이 되는 것을 희생하면서</mark> 그렇게 한다면, … 당신은 그 위치에 그리 오래 있지 못할 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>자리를 오래 못 지키는 이유 = 성장과 승리가 멈춤</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 덫의 결과</span><div class=\"en\">When you start apologizing for who you are, you stop growing and you stop winning.</div><p class=\"ko\">당신이 누구인지에 대해 사과하기 시작할 때, 당신은 성장하기를 멈추고 승리하기를 멈춘다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">Winners in a Trap(덫에 걸린 승자들): Too Self-Conscious to Be Themselves(자기 자신이 되기에는 너무 자의식이 강한)<small>1번 self-conscious(자의식 과잉의)와 8번 진짜 모습을 잃는 덫을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Stop Judging Others to Win the Race of Life(인생 경주에서 이기려면 남을 평가하지 말라)</span><span class=\"why\">[지문에 없음] 5번 judged(평가되는)만 따온 함정이에요. 지문에서 평가받는 건 이긴 ‘나’이고, 남을 평가하지 말라는 문장은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Why Disappointment Hurts More than Criticism(왜 실망이 비판보다 더 아픈가)</span><span class=\"why\">[지문에 없음] 실망과 비판을 비교하는 문장이 하나도 없어요. 지문은 남의 시선 때문에 진짜 나를 숨기는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Winning vs Losing(승리 대 패배): A Dangerously Misleading Mindset(위험하게 오도하는 사고방식)</span><span class=\"why\">[범위 넓음] 이기고 지는 걸 나누는 사고방식이 문제라는 말은 없어요. 4번부터 이긴 ‘뒤’에 생기는 자의식만 다뤄요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Is Honesty the Best Policy to Turn Enemies into Friends(정직이 적을 친구로 만드는 최선책인가)?</span><span class=\"why\">[지문에 없음] 적을 친구로 만드는 이야기는 없어요. 8번은 남이 아니라 나 자신을 만족시키라는 말이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Winning turns on</div><div class=\"k\">승리는 촉발한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a self-conscious awareness</span></div><div class=\"k\"><span class=\"cw\">자의식 과잉의 인식</span>을,</div></div><div class=\"rc\"><div class=\"e\">that others are watching.</div><div class=\"k\">다른 이들이 보고 있다는.</div></div><div class=\"rnat\">승리는 다른 이들이 보고 있다는 자의식 과잉의 인식을 촉발한다.</div><div class=\"rst\">반 축구 경기에서 이기기 시작하면 “다들 날 보고 있네” 하는 마음이 생겨요. = 지문 1번, 승리가 <b>자의식</b>(self-conscious 자의식 과잉의)을 켠다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It’s a lot easier</div><div class=\"k\">훨씬 더 쉽다</div></div><div class=\"rc\"><div class=\"e\">to move under the radar</div><div class=\"k\">눈에 띄지 않게 움직이는 것이</div></div><div class=\"rc\"><div class=\"e\">when no one knows you</div><div class=\"k\">아무도 당신을 모르고</div></div><div class=\"rc\"><div class=\"e\">and no one is paying attention.</div><div class=\"k\">아무도 주의를 기울이고 있지 않을 때.</div></div><div class=\"rnat\">아무도 여러분을 모르고 아무도 주의를 기울이고 있지 않을 때 눈에 띄지 않게 움직이는 것은 훨씬 더 쉽다.</div><div class=\"rst\">처음 축구를 시작했을 땐 아무도 나를 몰라서 눈에 안 띄게 마음껏 뛰었어요. = 지문 2번</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">You can mess up</div><div class=\"k\">당신은 망쳐도 되고</div></div><div class=\"rc\"><div class=\"e\">and be rough</div><div class=\"k\">난폭해도 되고</div></div><div class=\"rc\"><div class=\"e\">and get dirty</div><div class=\"k\">더러워져도 된다</div></div><div class=\"rc\"><div class=\"e\">because no one even knows you’re there.</div><div class=\"k\">아무도 당신이 거기 있다는 것조차 모르기 때문에.</div></div><div class=\"rnat\">아무도 여러분이 그곳에 있다는 것조차 모르기 때문에 여러분은 망치고 난폭해지고 더러워질 수 있다.</div><div class=\"rst\">헛발질해도, 거칠게 굴어도, 흙투성이가 돼도 괜찮았어요. 내가 거기 있는 줄도 몰랐으니까요. = 지문 3번</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">But as soon as you start to win,</div><div class=\"k\">하지만 당신이 이기기 시작하자마자,</div></div><div class=\"rc\"><div class=\"e\">and others start to notice,</div><div class=\"k\">그리고 다른 사람들이 알아차리기 시작하자마자,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">you’re suddenly aware</span></div><div class=\"k\"><span class=\"cw\">당신은 갑자기 인식하게 된다</span></div></div><div class=\"rc\"><div class=\"e\">that you’re being observed.</div><div class=\"k\">당신이 관찰되고 있다는 것을.</div></div><div class=\"rnat\">그러나 여러분이 승리하기 시작하고 다른 사람들이 알아차리기 시작하자마자, 여러분은 갑자기 관찰되고 있다는 것을 인식한다.</div><div class=\"rst\"><b>하지만</b>(But) 골을 넣기 시작하자 친구들이 알아보고, 갑자기 “누가 날 지켜보네” 하고 느껴요. = 지문 4번</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">You’re being judged.</div><div class=\"k\">당신은 평가되고 있다.</div></div><div class=\"rnat\">여러분은 평가되고 있다.</div><div class=\"rst\">이제 내 플레이 하나하나가 점수 매겨지는 느낌이에요. 지문 5번은 “당신은 평가되고 있다”고 짧게 말해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">You worry</div><div class=\"k\">당신은 걱정한다</div></div><div class=\"rc\"><div class=\"e\">that others will discover your flaws and weaknesses,</div><div class=\"k\">다른 사람들이 당신의 결함과 약점을 발견할까 봐,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">you start hiding your true personality</span>,</div><div class=\"k\">그리고 <span class=\"cw\">당신의 진정한 성격을 숨기기 시작한다</span>,</div></div><div class=\"rc\"><div class=\"e\">so you can be a good role model and good citizen</div><div class=\"k\">당신이 좋은 본보기이자 좋은 시민이 될 수 있도록</div></div><div class=\"rc\"><div class=\"e\">and a leader that others can respect.</div><div class=\"k\">그리고 다른 사람들이 존경할 수 있는 지도자가.</div></div><div class=\"rnat\">여러분은 다른 사람들이 여러분의 결함과 약점을 발견할까 봐 걱정하고, 여러분이 좋은 본보기이자 좋은 시민이고 다른 사람들이 존경할 수 있는 지도자가 될 수 있도록 여러분의 진정한 성격을 숨기기 시작한다.</div><div class=\"rst\">실수를 들킬까 봐 걱정돼서 장난기 많은 진짜 성격을 숨기고 모범생처럼 굴어요. = 지문 6번, <b>진정한 성격을 숨기기 시작한다</b>예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">There is nothing wrong with that.</div><div class=\"k\">그것에는 잘못된 것이 없다.</div></div><div class=\"rnat\">그것이 잘못된 것은 아니다.</div><div class=\"rst\">좋은 본보기가 되려는 마음 자체는 나쁜 게 아니에요. 지문 7번도 그것에는 잘못된 게 없다고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">But if you do it</div><div class=\"k\">하지만 당신이 그렇게 한다면</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">at the expense of being who you really are</span>,</div><div class=\"k\"><span class=\"cw\">당신이 진정한 모습이 되는 것을 희생하면서</span>,</div></div><div class=\"rc\"><div class=\"e\">making decisions that please others</div><div class=\"k\">다른 사람들을 만족시키는 결정을 하며</div></div><div class=\"rc\"><div class=\"e\">instead of pleasing yourself,</div><div class=\"k\">당신 자신을 만족시키는 것 대신에,</div></div><div class=\"rc\"><div class=\"e\">you’re not going to be in that position very long.</div><div class=\"k\">당신은 그 위치에 그리 오래 있지 못할 것이다.</div></div><div class=\"rnat\">그러나 여러분 스스로를 만족시키는 것 대신에 다른 사람들을 만족시키는 결정을 하며 자신의 진정한 모습이 되는 것을 희생하면서 그렇게 한다면, 여러분은 그 위치에 그리 오래 있지 못할 것이다.</div><div class=\"rst\">그런데 <b>진짜 나를 버리고</b> 남이 좋아할 결정만 하면, 에이스 자리를 오래 못 지켜요. = 지문 8번, 이 글의 결론이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">When you start apologizing</div><div class=\"k\">당신이 사과하기 시작할 때</div></div><div class=\"rc\"><div class=\"e\">for who you are,</div><div class=\"k\">당신이 누구인지에 대해,</div></div><div class=\"rc\"><div class=\"e\">you stop growing</div><div class=\"k\">당신은 성장하기를 멈추고</div></div><div class=\"rc\"><div class=\"e\">and you stop winning.</div><div class=\"k\">승리하기를 멈춘다.</div></div><div class=\"rnat\">여러분이 누구인지에 대해 사과하기 시작할 때, 여러분은 성장하기를 멈추고 승리하기를 멈춘다.</div><div class=\"rst\">“나 원래 이래서 미안” 하고 나를 사과하기 시작하면 실력도 승리도 멈춰요. = 지문 9번, 덫에 걸린 승자의 모습이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Permanently.</div><div class=\"k\">영원히.</div></div><div class=\"rnat\">영원히.</div><div class=\"rst\">그것도 잠깐이 아니라 <b>영원히</b>(Permanently)요. 그래서 제목은 “덫에 걸린 승자들”이에요. = 지문 10번</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"self-conscious\" data-m=\"자의식이 강한, 남의 눈을 의식하는\"><b>self-conscious</b>자의식이 강한, 남의 눈을 의식하는</button><button type=\"button\" class=\"wdb\" data-w=\"under the radar\" data-m=\"눈에 띄지 않게\"><b>under the radar</b>눈에 띄지 않게</button><button type=\"button\" class=\"wdb\" data-w=\"mess up\" data-m=\"엉망으로 만들다, 망치다\"><b>mess up</b>엉망으로 만들다, 망치다</button><button type=\"button\" class=\"wdb\" data-w=\"flaw\" data-m=\"결점\"><b>flaw</b>결점</button><button type=\"button\" class=\"wdb\" data-w=\"at the expense of\" data-m=\"~을 희생하여\"><b>at the expense of</b>~을 희생하여</button><button type=\"button\" class=\"wdb\" data-w=\"apologize for\" data-m=\"~에 대해 사과하다\"><b>apologize for</b>~에 대해 사과하다</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 앞에 <b>주어</b>가 있는데 <b>문장의 진짜 동사</b>가 있는지부터 보세요. <b>and</b>(그리고) 뒤가 주어+동사 갖춘 절이면, 앞쪽도 주어+동사가 다 있어야 해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (10번)</span><div class=\"en\">Our brains then <u>⑤ generating</u> sensations, thoughts, and action plans … , and we live to see another day.</div><p class=\"ko\">우리의 뇌는 그런 다음 감각·사고·행동 계획을 ( ? ) — 주어는 있는데 동사 자리가 비었어요</p></div><div class=\"ck-via\"><i>▼</i><span>and(그리고) 뒤는 주어 we(우리)+동사 live(살다)로 완전한 절이에요</span></div><div class=\"ck-step\"><span class=\"lab\">같은 문장 뒤쪽 · and 뒤 절</span><div class=\"en\">and <mark>we live</mark> to see another day.</div><p class=\"ko\">그리고 <mark>우리는 살아서</mark> 또 다른 날을 맞게 된다.</p></div><div class=\"ck-via\"><i>▼</i><span>앞쪽도 절이 되려면 주어 Our brains(우리의 뇌) 뒤에 본동사가 와야 해요 → generate(만들어 내다)</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 문장 · 결정적 단서</span><div class=\"en\">Our brains then <mark>generate</mark> sensations, thoughts, and action plans</div><p class=\"ko\">우리의 뇌는 그런 다음 감각과 사고와 행동 계획을 <mark>만들어 낸다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">본동사 자리: 동사(~하다) 대 -ing(~하는 것) 꼴</p><p class=\"gr\">문장에는 주어 뒤에 진짜 동사(본동사)가 꼭 하나 있어야 해요. -ing(~하는 것) 꼴은 혼자서는 본동사가 될 수 없어요. and(그리고)로 두 절을 이으면 양쪽 다 주어+동사가 있어야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My dog barks every morning.</div><div class=\"ko\">우리 개는 매일 아침 짖는다. (주어 My dog 뒤에 본동사 barks(짖는다)가 있어서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My dog barking every morning.</div><div class=\"ko\">barking(짖는 것)은 -ing라 본동사가 될 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I cook dinner, and Minsu washes the dishes.</div><div class=\"ko\">나는 저녁을 만들고, 민수는 설거지를 한다. (and 양쪽 다 주어+동사가 있어서 맞아요)</div></div><p class=\"gb\">지문 10번도 주어 Our brains(우리의 뇌) 뒤에 본동사가 없어요. and(그리고) 뒤 we live(우리는 산다)처럼 앞쪽도 절이어야 하니 generating(만들어 내는 것)이 아니라 generate(만들어 내다)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">generating → generate (만들어 내다)<small>주어 Our brains(우리의 뇌) 뒤에 본동사가 없으니 -ing(~하는 것) 꼴이 아니라 generate(만들어 내다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">certain 확신하는</span><span class=\"why\">4번은 the more certain we were(우리가 더 확신할수록) 구조예요. 원래 순서로 돌리면 we were certain(우리는 확신했다)이라서, were(~였다) 뒤 보어 자리예요. 그래서 형용사 certain(확신하는)이 맞고 부사 certainly(확실히)는 못 와요.</span><div class=\"gm wx\"><p class=\"gt\">보어 자리 형용사: were(~였다) 뒤 형용사 + the more(더 ~할수록) 비교 구조</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The more careful you are, the fewer mistakes you make.</div><div class=\"ko\">더 조심할수록 실수를 덜 한다. (you are careful(너는 조심스럽다) → 형용사 careful(조심스러운)이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The more carefully you are, the fewer mistakes you make.</div><div class=\"ko\">are(~이다) 뒤 보어 자리에 부사 carefully(조심스럽게)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I am happy.</div><div class=\"ko\">나는 행복하다. (am 뒤 보어 자리라 형용사 happy(행복한)가 맞아요)</div></div><p class=\"gb\">지문 4번도 we were certain(우리는 확신했다)에서 certain(확신하는)이 앞으로 나간 모양이라 형용사가 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">who ~하는(사람)</span><span class=\"why\">2번은 our ancient ancestors(우리 고대 조상들) 바로 뒤예요. 선행사가 사람이고, 뒤에 주어 없이 동사 needed(필요로 했다)가 바로 나오니 주격 관계대명사 who(~하는)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 who(~하는 사람): 사람 선행사 + who(~하는) + 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a friend who plays the piano.</div><div class=\"ko\">나는 피아노를 치는 친구가 있다. (사람 a friend(친구) 뒤, 주어 없이 plays(친다)가 와서 who가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a friend which plays the piano.</div><div class=\"ko\">선행사가 사람인데 사물용 which를 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a friend who he plays the piano.</div><div class=\"ko\">who가 이미 주어 역할인데 he(그)를 또 써서 틀려요.</div></div><p class=\"gb\">지문 2번도 사람 ancestors(조상들) 뒤에 주어 없이 needed(필요로 했다)가 오니 who(~하는)가 딱 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">them 그것들(= 위협)</span><span class=\"why\">3번 keep away from them(그것들로부터 벗어나다)의 them(그것들)은 앞의 threats(위협들)를 가리켜요. -s로 끝나는 복수라서 단수 it(그것)이 아니라 복수 them(그것들)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">대명사 수 일치: 가리키는 명사가 복수면 them(그것들)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I bought two apples and ate them.</div><div class=\"ko\">나는 사과 두 개를 사서 그것들을 먹었다. (two apples(사과 두 개)가 복수라 them이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I bought two apples and ate it.</div><div class=\"ko\">사과가 두 개인데 단수 it(그것)을 써서 틀려요.</div></div><p class=\"gb\">지문 3번도 복수 threats(위협들)를 받으니 them(그것들)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">is ~이다</span><span class=\"why\">6번 If I know for certain it is(그것이 그렇다는 걸 확실히 안다면)는 5번 질문 Is this berry the same shape(이 열매가 같은 모양인가)에 대한 답이에요. it(그것)은 단수 this berry(이 열매)라서 is(~이다)가 맞고, 뒤의 the same shape(같은 모양)는 반복이라 생략됐어요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치 + 반복되는 보어 생략: it is (the same) 그렇다</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Is this your bag? Yes, it is.</div><div class=\"ko\">이게 네 가방이니? 응, 그래. (it 단수라 is, 뒤의 my bag(내 가방)은 반복이라 생략해서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Is this your bag? Yes, it are.</div><div class=\"ko\">it(그것)은 단수인데 복수용 are를 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Is this your bag? Yes, it does.</div><div class=\"ko\">질문이 be동사 Is로 물었는데 does로 받아서 틀려요.</div></div><p class=\"gb\">지문 6번도 5번 Is(~인가)로 물은 질문에 단수 it(= 이 열매)으로 답하니 is(~이다)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Human beings like certainty.</div><div class=\"k\">인간은 확실성을 좋아한다.</div></div><div class=\"rnat\">인간은 확실성을 좋아한다.</div><div class=\"rst\">사람은 ‘확실한 것’을 좋아해요. 지문 1번은 certainty(확실성)라는 이 글의 주제어를 던져요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This liking stems from</div><div class=\"k\">이 선호는 ~에게서 유래한다</div></div><div class=\"rc\"><div class=\"e\">our ancient ancestors</div><div class=\"k\">우리 고대 조상들</div></div><div class=\"rc\"><div class=\"e\">who needed to survive</div><div class=\"k\">생존해야 했던</div></div><div class=\"rc\"><div class=\"e\">alongside saber-toothed tigers</div><div class=\"k\">검치호 옆에서</div></div><div class=\"rc\"><div class=\"e\">and poisonous berries.</div><div class=\"k\">그리고 독이 든 딸기류 열매.</div></div><div class=\"rnat\">이 선호는 검치호와 독이 든 딸기류 열매 옆에서 생존해야 했던 우리 고대 조상들에게서 유래한다.</div><div class=\"rst\">그 좋아함은 검치호와 독 열매 옆에서 살아남아야 했던 조상에게서 왔어요. 사람 ancestors(조상들) 뒤라서 who(~하는)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Our brains evolved</div><div class=\"k\">우리의 뇌는 진화했다</div></div><div class=\"rc\"><div class=\"e\">to help us attend to threats,</div><div class=\"k\">우리가 위협에 주의를 기울이도록 돕기 위해,</div></div><div class=\"rc\"><div class=\"e\">keep away from them,</div><div class=\"k\">그것(= 위협)으로부터 벗어나도록,</div></div><div class=\"rc\"><div class=\"e\">and remain alive afterward.</div><div class=\"k\">그리고 그 뒤로 계속 살아남도록.</div></div><div class=\"rnat\">우리의 뇌는 우리가 위협에 주의를 기울이고, 그것으로부터 벗어나고, 그 뒤로 계속 살아남도록 돕기 위해 진화했다.</div><div class=\"rst\">뇌는 위협에 주의하고, 그것들을 피하고, 살아남도록 진화했어요. 복수 threats(위협들)를 받으니 them(그것들)이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In fact, we learned</div><div class=\"k\">사실, 우리는 배웠다</div></div><div class=\"rc\"><div class=\"e\">that the more certain we were about something,</div><div class=\"k\">우리가 무언가에 대해 더 확신할수록,</div></div><div class=\"rc\"><div class=\"e\">the better chance we had</div><div class=\"k\">우리가 더 큰 가능성을 가졌다는 것을</div></div><div class=\"rc\"><div class=\"e\">of making the right choice.</div><div class=\"k\">올바른 선택을 할.</div></div><div class=\"rnat\">사실, 우리는 우리가 무언가에 대해 더 확신할수록, 우리가 올바른 선택을 할 가능성이 더 크다는 것을 배웠다.</div><div class=\"rst\">더 확신할수록 올바른 선택을 할 가능성이 커졌어요. we were certain(우리는 확신했다)이라 형용사 certain(확신하는)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Is this berry the same shape</div><div class=\"k\">이 딸기류 열매는 같은 모양인가</div></div><div class=\"rc\"><div class=\"e\">as last time?</div><div class=\"k\">저번과?</div></div><div class=\"rc\"><div class=\"e\">The same size?</div><div class=\"k\">같은 크기인가?</div></div><div class=\"rnat\">이 딸기류 열매는 저번과 모양이 같은 건가? 같은 크기인가?</div><div class=\"rst\">“이 열매, 저번이랑 모양이 같아? 크기도 같아?” 지문 5번은 조상이 열매를 보며 던지는 질문이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">If I know for certain it is,</div><div class=\"k\">내가 그것(= 이 열매)이 그렇다는 것을 확실히 안다면,</div></div><div class=\"rc\"><div class=\"e\">my brain will direct me</div><div class=\"k\">나의 뇌는 나에게 지시할 것이다</div></div><div class=\"rc\"><div class=\"e\">to eat it</div><div class=\"k\">그것을 먹으라고,</div></div><div class=\"rc\"><div class=\"e\">because I know it’s safe.</div><div class=\"k\">왜냐하면 그것이 안전하다는 것을 내가 알기 때문이다.</div></div><div class=\"rnat\">내가 그게 맞다는 것을 확실히 안다면, 나의 뇌는 나에게 그것을 먹으라고 지시할 텐데, 왜냐하면 그것이 안전하다는 것을 내가 알기 때문이다.</div><div class=\"rst\">확실히 같다(it is 그것이 그렇다)는 걸 알면 뇌가 “먹어도 돼” 해요. 단수 it(= 이 열매)이라 is(~이다)이고 뒤 말은 생략됐어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">And if I’m uncertain,</div><div class=\"k\">그리고 만약 내가 확신하지 못한다면,</div></div><div class=\"rc\"><div class=\"e\">my brain will send out a danger alert</div><div class=\"k\">나의 뇌는 위험 신호를 내보낼 것이다</div></div><div class=\"rc\"><div class=\"e\">to protect me.</div><div class=\"k\">나를 보호하기 위해.</div></div><div class=\"rnat\">그리고 만약 내가 확신하지 못한다면, 나의 뇌는 나를 보호하기 위해 위험 신호를 내보낼 것이다.</div><div class=\"rst\">확신이 없으면 뇌가 나를 지키려고 위험 신호를 보내요. = 지문 7번, 확실하지 않으면 경보가 울린다는 말이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The dependence on certainty</div><div class=\"k\">확실성에 대한 의존은</div></div><div class=\"rc\"><div class=\"e\">all those millennia ago</div><div class=\"k\">그 모든 수천 년 전의</div></div><div class=\"rc\"><div class=\"e\">ensured our survival</div><div class=\"k\">우리의 생존을 보장했다</div></div><div class=\"rc\"><div class=\"e\">to the present day,</div><div class=\"k\">오늘날까지,</div></div><div class=\"rc\"><div class=\"e\">and the danger-alert system</div><div class=\"k\">그리고 그 위험 경보 체계는</div></div><div class=\"rc\"><div class=\"e\">continues to protect us.</div><div class=\"k\">계속 우리를 보호하고 있다.</div></div><div class=\"rnat\">그 모든 수천 년 전의 확실성에 대한 의존은 오늘날까지 우리의 생존을 보장했고, 그 위험 경보 체계는 계속 우리를 보호하고 있다.</div><div class=\"rst\">이렇게 확실성에 기댄 덕분에 오늘날까지 살아남았고, 그 경보 체계는 지금도 우리를 지켜요. = 지문 8번이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">This is achieved</div><div class=\"k\">이것은 이루어진다</div></div><div class=\"rc\"><div class=\"e\">by our brains labeling</div><div class=\"k\">우리 뇌가 명명함으로써</div></div><div class=\"rc\"><div class=\"e\">new, vague, or unpredictable</div><div class=\"k\">새롭거나 애매하거나 예측할 수 없는</div></div><div class=\"rc\"><div class=\"e\">everyday events and experiences</div><div class=\"k\">매일의 사건과 경험을</div></div><div class=\"rc\"><div class=\"e\">as uncertain.</div><div class=\"k\">불확실하다고.</div></div><div class=\"rnat\">이것은 우리 뇌가 새롭거나 애매하거나 예측할 수 없는 매일의 사건과 경험을 불확실하다고 명명하여 이루어진다.</div><div class=\"rst\">뇌는 새롭거나 애매하거나 예측할 수 없는 일을 ‘불확실하다’고 이름 붙여요. = 지문 9번, 경보가 켜지는 방법이에요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Our brains then <span class=\"cw\">generate</span></div><div class=\"k\">우리의 뇌는 그런 다음 <span class=\"cw\">만들어 낸다</span>※ 문제지엔 generating으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">sensations, thoughts, and action plans</div><div class=\"k\">감각과 사고와 행동 계획을</div></div><div class=\"rc\"><div class=\"e\">to keep us safe</div><div class=\"k\">우리를 안전하게 지키기 위해</div></div><div class=\"rc\"><div class=\"e\">from the uncertain element,</div><div class=\"k\">그 불확실한 요소로부터,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">we live</span> to see another day.</div><div class=\"k\">그리고 <span class=\"cw\">우리는 살아서</span> 또 다른 날을 맞게 된다.</div></div><div class=\"rnat\">그런 다음 우리의 뇌는 그 불확실한 요소로부터 우리를 안전하게 지키기 위해 감각과 사고와 행동 계획을 만들어 내고, 우리는 살아서 또 다른 날을 맞게 된다.</div><div class=\"rst\">그러면 뇌는 감각·생각·행동 계획을 <b>만들어 내고</b>(generate) 우리는 또 하루를 살아요. 주어 뒤 본동사 자리라 generate(만들어 내다)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"certainty\" data-m=\"확실성\"><b>certainty</b>확실성</button><button type=\"button\" class=\"wdb\" data-w=\"stem from\" data-m=\"~에서 비롯되다\"><b>stem from</b>~에서 비롯되다</button><button type=\"button\" class=\"wdb\" data-w=\"ancestor\" data-m=\"조상\"><b>ancestor</b>조상</button><button type=\"button\" class=\"wdb\" data-w=\"attend to\" data-m=\"~에 주의를 기울이다\"><b>attend to</b>~에 주의를 기울이다</button><button type=\"button\" class=\"wdb\" data-w=\"ensure\" data-m=\"보장하다\"><b>ensure</b>보장하다</button><button type=\"button\" class=\"wdb\" data-w=\"vague\" data-m=\"모호한, 애매한\"><b>vague</b>모호한, 애매한</button><button type=\"button\" class=\"wdb\" data-w=\"generate\" data-m=\"만들어 내다\"><b>generate</b>만들어 내다</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이 글의 방향은 하나예요. <b>이름을 붙이면</b>(identify 확인하다) 그 일을 <b>의식하게 된다</b>(become conscious). ‘1차’라는 이름은 ‘2차’를 더 잘 보이게 하는 쪽이니, 그 방향과 거꾸로 가는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">5번 · 글의 방향</span><div class=\"en\">By highlighting that reality, <mark>we become conscious of current limitations</mark></div><p class=\"ko\">그 현실을 강조함으로써, <mark>우리는 현재의 한계를 의식하게 되고</mark></p></div><div class=\"ck-via\"><i>▼</i><span>흑백 사진에서 본 ‘이름 붙이기’를 1918년 전쟁 이름에 대입해요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 · 같은 원리를 전쟁에 적용</span><div class=\"en\">What if we had called it “World War I” back in 1918?</div><p class=\"ko\">우리가 1918년 당시에 그것(= 제1차 세계대전)을 ‘제1차 세계대전’이라고 불렀다면 어땠을까?</p></div><div class=\"ck-via\"><i>▼</i><span>‘1차’라고 부르면 ‘2차’가 떠올라요. 그런데 예측할 수 없다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (9번)</span><div class=\"en\">Such a label might have made the possibility of a second worldwide conflict an <u>④ unpredictable</u> reality</div><p class=\"ko\">그러한 명칭은 두 번째 세계적 충돌의 가능성을 ( 예측할 수 없는? ) 현실로 만들었을지도 → 더 뚜렷한(예측 가능한) 현실이 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>결론 문장: 이름 붙여 짚으면 문제를 의식하게 된다</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 · 결정적 단서</span><div class=\"en\"><mark>We become conscious of issues</mark> when we … identify them.</div><p class=\"ko\">우리가 그것들(= 문제들)을 … 확인할 때 <mark>우리는 문제들을 의식하게 된다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">unpredictable(예측할 수 없는) ↔ predictable(예측할 수 있는)</p><p class=\"gr\">원인이 ‘이름을 붙여 드러낸다’면 결과는 ‘더 잘 보인다, 예측할 수 있다’예요. 원인이 드러내는 쪽인데 결과가 안 보이는 쪽이면 방향이 어긋나요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>We named the test “Quiz 1,” so a second quiz felt predictable.</div><div class=\"ko\">시험 이름을 ‘퀴즈 1’이라고 붙였더니 두 번째 퀴즈가 있을 거라는 게 예측됐어요. (이름 → 예측 가능)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>We named the test “Quiz 1,” so a second quiz felt unpredictable.</div><div class=\"ko\">‘1’이라고 번호를 붙였는데 두 번째를 예측할 수 없다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The weather report made the rain predictable.</div><div class=\"ko\">일기 예보 덕분에 비가 올 걸 예측할 수 있었어요. (미리 알림 → 예측 가능)</div></div><p class=\"gb\">지문 10번에서 이름을 붙여 확인하면 문제를 의식하게 된다고 했으니, 9번은 unpredictable(예측할 수 없는)이 아니라 predictable(예측할 수 있는) 현실이어야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">unpredictable → predictable (예측할 수 있는)<small>‘1차’라는 이름이 ‘2차’ 전쟁의 가능성을 더 뚜렷하게 보여 줬을 거라서 예측할 수 있는 쪽이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">after ~한 뒤에</span><span class=\"why\">7번은 Before that horrific period(그 끔찍한 시기 전에는) ‘대전쟁’이라고만 불렀다고 해요. 그러니 ‘제1차’라는 이름은 2차 대전에 휘말린 뒤에야 붙은 것이라 after(~한 뒤에)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">unnecessary 불필요한</span><span class=\"why\">3번 앞부분이 The possibility of color did not exist(색의 가능성은 존재하지 않았다)예요. 컬러가 없으니 ‘흑백’을 붙일 필요가 없어서 unnecessary(불필요한)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">highlighting 강조하는</span><span class=\"why\">4번에서 ‘흑백’을 일부러 넣었다고 가정했어요. 그 현실을 드러내 강조해야 5번처럼 한계를 의식하게 되니 highlighting(강조하는)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">identify 규정하다</span><span class=\"why\">5번에서 강조하면 의식하게 된다고 했어요. 10번도 같은 결론이라, 문제를 뚜렷이 이름 붙여 identify(규정하다, 확인하다)할 때 의식하게 된다는 말이 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Let’s return</div><div class=\"k\">돌아가 보자</div></div><div class=\"rc\"><div class=\"e\">to a time</div><div class=\"k\">한 시기로</div></div><div class=\"rc\"><div class=\"e\">in which photographs were not in living color.</div><div class=\"k\">사진이 생생한 색이 아니었던.</div></div><div class=\"rnat\">사진이 생생한 색이 아니었던 시기로 돌아가 보자.</div><div class=\"rst\">집에서 옛날 앨범을 펼쳐 봐요. 지문 1번은 사진에 색이 없던 시절로 돌아가 보자고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">During that period,</div><div class=\"k\">그 시기 동안,</div></div><div class=\"rc\"><div class=\"e\">people referred to pictures as “photographs”</div><div class=\"k\">사람들은 사진을 ‘사진’이라고 일컬었다</div></div><div class=\"rc\"><div class=\"e\">rather than “black-and-white photographs”</div><div class=\"k\">‘흑백 사진’이 아니라</div></div><div class=\"rc\"><div class=\"e\">as we do today.</div><div class=\"k\">오늘날 우리가 그러듯이.</div></div><div class=\"rnat\">그 시기 동안, 사람들은 오늘날 우리가 부르듯이 사진을 ‘흑백 사진’이 아닌 ‘사진’이라고 일컬었다.</div><div class=\"rst\">그땐 그냥 ‘사진’이라고 불렀대요. 우리처럼 ‘흑백 사진’이라고 하지 않았어요. = 지문 2번</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The possibility of color did not exist,</div><div class=\"k\">색의 가능성은 존재하지 않았고,</div></div><div class=\"rc\"><div class=\"e\">so it was unnecessary</div><div class=\"k\">그래서 불필요했다</div></div><div class=\"rc\"><div class=\"e\">to insert the adjective “black-and-white.”</div><div class=\"k\">‘흑백’이라는 형용사를 넣는 것은.</div></div><div class=\"rnat\">색의 가능성은 존재하지 않았고, 따라서 ‘흑백’이라는 형용사를 넣는 것은 불필요했다.</div><div class=\"rst\">컬러 사진이 아예 없으니 ‘흑백’을 붙일 <b>필요가 없었어요</b>(unnecessary 불필요한). = 지문 3번 → ① 맞음</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">However, suppose</div><div class=\"k\">하지만, 가정해 보라</div></div><div class=\"rc\"><div class=\"e\">we did include the phrase “black-and-white”</div><div class=\"k\">우리가 ‘흑백’이라는 어구를 정말로 넣었다고</div></div><div class=\"rc\"><div class=\"e\">before the existence of color photography.</div><div class=\"k\">컬러 사진의 존재 전에.</div></div><div class=\"rnat\">하지만, 우리가 컬러 사진의 존재 전에 ‘흑백’이라는 어구를 정말로 넣었다고 가정해 보라.</div><div class=\"rst\"><b>하지만</b>(However) 그 시절에 누가 일부러 ‘흑백’이라고 붙였다고 상상해 봐요. = 지문 4번의 가정이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">By highlighting that reality,</div><div class=\"k\">그 현실을 강조함으로써,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">we become conscious of current limitations</span></div><div class=\"k\"><span class=\"cw\">우리는 현재의 한계를 의식하게 되고</span></div></div><div class=\"rc\"><div class=\"e\">and thus open our minds</div><div class=\"k\">그리하여 우리 마음을 연다</div></div><div class=\"rc\"><div class=\"e\">to new possibilities and potential opportunities.</div><div class=\"k\">새로운 가능성과 잠재적 기회에.</div></div><div class=\"rnat\">그 현실을 강조함으로써, 우리는 현재의 한계를 의식하게 되고, 그리하여 새로운 가능성과 잠재적 기회에 우리 마음을 연다.</div><div class=\"rst\">‘흑백’을 <b>강조하면</b>(highlighting) “다른 색 사진도 있을 수 있겠네?” 하고 한계를 깨닫고 새 가능성에 마음이 열려요. = 지문 5번</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">World War I was given that name</div><div class=\"k\">제1차 세계대전은 그 이름이 붙여졌다</div></div><div class=\"rc\"><div class=\"e\">only after we were deeply embattled</div><div class=\"k\">우리가 깊이 휘말린 뒤에야 비로소</div></div><div class=\"rc\"><div class=\"e\">in World War II.</div><div class=\"k\">제2차 세계대전에.</div></div><div class=\"rnat\">제1차 세계대전은 우리가 제2차 세계대전에 깊이 휘말린 뒤에야 비로소 그 이름이 붙여졌다.</div><div class=\"rst\">앨범 옆 옛날 신문을 보니, ‘제1차 세계대전’이란 이름은 2차 대전에 깊이 휘말린 <b>뒤에야</b>(after) 붙었대요. = 지문 6번 → ③ 맞음</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Before that horrific period of the 1940s,</div><div class=\"k\">1940년대의 그 끔찍한 시기 전에는,</div></div><div class=\"rc\"><div class=\"e\">World War I was simply called</div><div class=\"k\">제1차 세계대전은 단순히 불렸다</div></div><div class=\"rc\"><div class=\"e\">“The Great War”</div><div class=\"k\">‘대전쟁’이라고</div></div><div class=\"rc\"><div class=\"e\">or, even worse,</div><div class=\"k\">또는, 훨씬 더 심하게는,</div></div><div class=\"rc\"><div class=\"e\">“The War to End All Wars.”</div><div class=\"k\">‘모든 전쟁을 끝내는 전쟁’이라고.</div></div><div class=\"rnat\">1940년대의 끔찍한 시기 전에는, 제1차 세계대전은 단순히 ‘대전쟁’, 또는 훨씬 더 심하게는 ‘모든 전쟁을 끝내는 전쟁’이라고 불렸다.</div><div class=\"rst\">그 전엔 그냥 ‘대전쟁’, 심지어 ‘모든 전쟁을 끝내는 전쟁’이라고 불렀대요. = 지문 7번</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">What if we had called it</div><div class=\"k\">우리가 그것(= 제1차 세계대전)을 불렀다면 어땠을까</div></div><div class=\"rc\"><div class=\"e\">“World War I”</div><div class=\"k\">‘제1차 세계대전’이라고</div></div><div class=\"rc\"><div class=\"e\">back in 1918?</div><div class=\"k\">1918년 당시에?</div></div><div class=\"rnat\">만약 우리가 1918년 당시 그것을 ‘제1차 세계대전’이라고 불렀다면 어땠을까?</div><div class=\"rst\">만약 1918년에 벌써 ‘제1차’라고 불렀다면? 지문 8번의 질문이에요. ‘1차’라고 하면 ‘2차’가 떠오르죠.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">Such a label might have made</div><div class=\"k\">그러한 명칭은 만들었을지도 모른다</div></div><div class=\"rc\"><div class=\"e\">the possibility of a second worldwide conflict</div><div class=\"k\">두 번째 세계적 충돌의 가능성을</div></div><div class=\"rc\"><div class=\"e\">a greater reality</div><div class=\"k\">더 큰 현실로※ 문제지엔 unpredictable로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">for governments and individuals.</div><div class=\"k\">정부와 개인에게.</div></div><div class=\"rnat\">그러한 명칭은 두 번째 세계적 충돌의 가능성을 정부와 개인에게 예측할 수 없는(→ 더 큰) 현실로 만들었을지도 모른다.</div><div class=\"rst\">그 이름은 두 번째 전쟁이 일어날 수 있다는 걸 <b>더 뚜렷한 현실</b>로 느끼게 했을 거예요. 그래서 9번은 예측할 수 없는 쪽이 아니에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">We become conscious of issues</span></div><div class=\"k\"><span class=\"cw\">우리는 문제들을 의식하게 된다</span></div></div><div class=\"rc\"><div class=\"e\">when we explicitly identify them.</div><div class=\"k\">우리가 그것들(= 문제들)을 명시적으로 확인할 때.</div></div><div class=\"rnat\">우리가 그것들을 명시적으로 확인할 때, 우리는 문제들을 의식하게 된다.</div><div class=\"rst\">이름을 붙여 짚어야 문제를 <b>의식하게 돼요</b>(become conscious). = 지문 10번, 그래서 ⑤ identify(확인하다)가 맞아요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"insert\" data-m=\"넣다, 삽입하다\"><b>insert</b>넣다, 삽입하다</button><button type=\"button\" class=\"wdb\" data-w=\"highlight\" data-m=\"강조하다\"><b>highlight</b>강조하다</button><button type=\"button\" class=\"wdb\" data-w=\"conscious\" data-m=\"의식하는\"><b>conscious</b>의식하는</button><button type=\"button\" class=\"wdb\" data-w=\"limitation\" data-m=\"한계\"><b>limitation</b>한계</button><button type=\"button\" class=\"wdb\" data-w=\"embattled\" data-m=\"전투에 휘말린\"><b>embattled</b>전투에 휘말린</button><button type=\"button\" class=\"wdb\" data-w=\"horrific\" data-m=\"끔찍한\"><b>horrific</b>끔찍한</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 바로 <b>뒤에 줄줄이 나오는 질문들</b>이 힌트예요. 세 질문이 모두 <b>‘나’에 대한 질문</b>이고, 마지막 문장이 그걸 <b>self-knowledge</b>(자기 이해)로 묶어 줘요.</p><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 배경</span><div class=\"en\">Rather, we must each be our own chief executive officer.</div><p class=\"ko\">오히려, 우리는 각자 우리 자신의 최고경영자가 되어야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>내 경력의 사장이 되어 이 모든 걸 잘하려면 무엇이 필요한지 물어요</span></div><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (6번)</span><div class=\"en\">To do all of these things well, you’ll need to <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">이 모든 것들을 잘하기 위해서는, 당신은 ( ? ) 필요가 있을 것이다</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7번</em>나의 가장 가치 있는 강점과 가장 위험한 약점은?</span><span><em>8번</em>나는 어떻게 배우고, 다른 사람과 어떻게 일하나?</span><span><em>9번</em>내가 가장 깊이 간직한 가치는?</span></div><div class=\"ck-eq\">⇒ 세 질문의 공통점 = 모두 ‘나 자신’을 알아보는 질문</div></div><div class=\"ck-via\"><i>▼</i><span>세 질문의 답을 self-knowledge(자기 이해) 한 단어로 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 문장 · 결정적 단서</span><div class=\"en\">Only when you operate from a combination of your strengths and <mark>self-knowledge</mark> can you achieve true — and lasting — excellence.</div><p class=\"ko\">당신의 강점과 <mark>자기 이해</mark>의 조합으로부터 일할 때에만 당신은 진정한, 그리고 지속되는 탁월함을 달성할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">cultivate a deep understanding of yourself 자기 자신에 대한 깊은 이해를 기르다<small>10번 self-knowledge(자기 이해)를 그대로 풀어 쓴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">stay on good terms with your co-workers 동료들과 사이좋게 지내다</span><span class=\"why\">8번 work with others(다른 사람들과 함께 일하다)만 따온 함정이에요. 8번도 ‘내가’ 어떻게 일하는지 묻는 자기 이해 질문이고, 7·9번은 동료와 상관없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">follow your company's philosophy 회사의 철학을 따르다</span><span class=\"why\">3번은 회사가 경력을 관리해 주지 않는다고 했어요. 4번처럼 내가 나의 최고경영자가 되라는 글이라 회사를 따르는 건 반대 방향이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">make substantial profits for the company 회사에 상당한 이익을 내주다</span><span class=\"why\">회사 이익 이야기는 지문에 없어요. 빈칸 뒤 7·8·9번 질문은 모두 회사가 아니라 나 자신에 대한 것이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">provide yourself with rewards for your efforts 노력에 대해 스스로에게 보상하다</span><span class=\"why\">보상하는 장면이 지문에 없어요. 10번이 말하는 열쇠는 보상이 아니라 self-knowledge(자기 이해)예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We live in an age of opportunity:</div><div class=\"k\">우리는 기회의 시대에 살고 있다.</div></div><div class=\"rc\"><div class=\"e\">If you’ve got ambition, drive, and smarts,</div><div class=\"k\">당신이 야망, 추진력, 그리고 지성을 가지고 있다면,</div></div><div class=\"rc\"><div class=\"e\">you can rise to the top of your chosen profession</div><div class=\"k\">당신은 당신이 선택한 직업에서 정상에 오를 수 있다</div></div><div class=\"rc\"><div class=\"e\">— regardless of where you started out.</div><div class=\"k\">— 당신이 어디에서 시작했는지와 상관없이.</div></div><div class=\"rnat\">우리는 기회의 시대에 살고 있다. 당신이 야망, 추진력, 그리고 지성을 가지고 있다면, 당신이 어디에서 시작했는지와 상관없이 당신은 당신이 선택한 직업에서 정상에 오를 수 있다.</div><div class=\"rst\">요즘은 어디서 시작했든 꿈과 노력만 있으면 원하는 분야 꼭대기까지 갈 수 있어요. = 지문 1번, 기회의 시대예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">But with this opportunity</div><div class=\"k\">하지만 이 기회와 함께</div></div><div class=\"rc\"><div class=\"e\">comes responsibility.</div><div class=\"k\">책임이 따라온다.</div></div><div class=\"rnat\">하지만 이러한 기회와 함께 책임이 따라온다.</div><div class=\"rst\"><b>하지만</b>(But) 중학생이 되니 기회와 함께 책임도 따라와요. 지문 2번도 기회와 함께 책임이 온다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Companies today aren’t managing</div><div class=\"k\">요즘 회사들은 관리해 주지 않는다</div></div><div class=\"rc\"><div class=\"e\">their knowledge workers’ careers.</div><div class=\"k\">그들의 지식 노동자들의 경력을.</div></div><div class=\"rnat\">요즘 회사들은 그들의 지식 노동자들의 경력을 관리해 주지 않는다.</div><div class=\"rst\">이제 부모님이 내 공부 계획을 대신 짜 주지 않아요. = 지문 3번, 회사가 직원의 경력을 관리해 주지 않는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Rather, we must each be</div><div class=\"k\">오히려, 우리는 각자 ~이 되어야 한다</div></div><div class=\"rc\"><div class=\"e\">our own chief executive officer.</div><div class=\"k\">우리 자신의 최고경영자.</div></div><div class=\"rnat\">오히려, 우리는 각자가 우리 자신의 최고경영자가 되어야 한다.</div><div class=\"rst\">그러니 내가 내 공부의 <b>사장님</b>이 되어야 해요. = 지문 4번, 각자 자기 자신의 최고경영자가 되라는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Simply put,</div><div class=\"k\">간단히 말하면,</div></div><div class=\"rc\"><div class=\"e\">it’s up to you</div><div class=\"k\">당신에게 달려 있다</div></div><div class=\"rc\"><div class=\"e\">to keep yourself engaged and productive</div><div class=\"k\">당신 자신을 바쁘고 생산적이게 유지하는 것은</div></div><div class=\"rc\"><div class=\"e\">during a work life.</div><div class=\"k\">직장 생활을 하는 동안에.</div></div><div class=\"rnat\">간단히 말하면, 직장 생활을 하는 동안에 당신 자신을 바쁘고 생산적이게 유지하는 것은 당신에게 달려 있다.</div><div class=\"rst\">간단히 말해, 학기 내내 스스로 열심히 알차게 지내는 건 내 몫이에요. = 지문 5번, 그건 당신에게 달려 있다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">To do all of these things well,</div><div class=\"k\">이 모든 것들을 잘하기 위해서는,</div></div><div class=\"rc\"><div class=\"e\">you’ll need to cultivate</div><div class=\"k\">당신은 기를 필요가 있을 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a deep understanding of yourself</span>.</div><div class=\"k\"><span class=\"cw\">당신 자신에 대한 깊은 이해</span>를.※ 문제지엔 cultivate a deep understanding of yourself 부분 전체가 빈칸으로 되어 있음</div></div><div class=\"rnat\">이 모든 것들을 잘하기 위해서는, 당신은 당신 자신에 대한 깊은 이해를 기를 필요가 있다.</div><div class=\"rst\">그걸 다 잘하려면 먼저 <b>나 자신을 깊이 알아야</b> 해요. 이게 바로 빈칸, 자기 이해를 기르는 것이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\">What are <span class=\"cw\">your most valuable strengths</span></div><div class=\"k\">무엇이 <span class=\"cw\">당신의 가장 가치 있는 강점</span>인가</div></div><div class=\"rc\"><div class=\"e\">and most dangerous weakness?</div><div class=\"k\">그리고 가장 위험한 약점인가?</div></div><div class=\"rnat\">무엇이 당신의 가장 가치 있는 강점이며 가장 위험한 약점인가?</div><div class=\"rst\">“나는 수학이 강점이고 영어 단어가 약점인가?” 지문 7번은 나의 강점과 약점을 물어요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Equally important,</div><div class=\"k\">똑같이 중요하게,</div></div><div class=\"rc\"><div class=\"e\">how do you learn</div><div class=\"k\">당신은 어떻게 배우는가</div></div><div class=\"rc\"><div class=\"e\">and work with others?</div><div class=\"k\">그리고 다른 사람들과 함께 일하는가?</div></div><div class=\"rnat\">똑같이 중요하게, 당신은 어떻게 배우고 다른 사람들과 함께 일하는가?</div><div class=\"rst\">“나는 혼자 외울 때 잘 배울까, 친구랑 같이 할 때 잘 배울까?” 지문 8번도 나에 대한 질문이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">What are your most deeply held values?</div><div class=\"k\">무엇이 당신의 가장 깊이 간직된 가치인가?</div></div><div class=\"rnat\">당신의 가장 깊이 간직된 가치는 무엇인가?</div><div class=\"rst\">“내가 제일 소중히 여기는 건 뭐지?” 지문 9번은 내 마음속 가치를 물어요. 세 질문 모두 ‘나’를 알아보는 거예요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">The implication is clear:</div><div class=\"k\">내포된 의미는 분명하다:</div></div><div class=\"rc\"><div class=\"e\">Only when you operate</div><div class=\"k\">당신이 일할 때에만</div></div><div class=\"rc ckc\"><div class=\"e\">from a combination of your strengths and <span class=\"cw\">self-knowledge</span></div><div class=\"k\">당신의 강점과 <span class=\"cw\">자기 이해</span>의 조합으로부터</div></div><div class=\"rc\"><div class=\"e\">can you achieve true — and lasting — excellence.</div><div class=\"k\">당신은 진정한, 그리고 지속되는 탁월함을 달성할 수 있다.</div></div><div class=\"rnat\">내포된 의미는 분명하다. 당신이 당신의 강점과 자기 이해의 조합으로부터 일할 때에만 당신은 진정한, 그리고 지속되는 탁월함을 달성할 수 있다.</div><div class=\"rst\">내 강점에 <b>자기 이해</b>(self-knowledge)를 더해야 진짜 오래가는 실력이 생겨요. 그래서 빈칸은 자기 이해를 기르는 것이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"ambition\" data-m=\"야망\"><b>ambition</b>야망</button><button type=\"button\" class=\"wdb\" data-w=\"regardless of\" data-m=\"~와 상관없이\"><b>regardless of</b>~와 상관없이</button><button type=\"button\" class=\"wdb\" data-w=\"chief executive officer\" data-m=\"최고 경영자\"><b>chief executive officer</b>최고 경영자</button><button type=\"button\" class=\"wdb\" data-w=\"engaged\" data-m=\"몰입한, 바쁘게 참여하는\"><b>engaged</b>몰입한, 바쁘게 참여하는</button><button type=\"button\" class=\"wdb\" data-w=\"implication\" data-m=\"함의, 내포된 의미\"><b>implication</b>함의, 내포된 의미</button><button type=\"button\" class=\"wdb\" data-w=\"self-knowledge\" data-m=\"자기 이해\"><b>self-knowledge</b>자기 이해</button><button type=\"button\" class=\"wdb\" data-w=\"cultivate\" data-m=\"기르다\"><b>cultivate</b>기르다</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
