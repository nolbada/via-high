<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

var D=[{"no": "07", "typ": "빈칸 추론", "src": "2018년 11월 31번", "evn": [2, 8], "ev_en": "At the Sixteenth Nobel Conference, held in 1980, scientists, musicians, and philosophers all agreed, to quote Freeman Dyson, that “the analogies between science and art are very good as long as you are talking about the creation and the performance. / All of these people, whether they are doing artistic work or scientific work, are trying to solve a problem.”", "ev_ko": [[2, "1980년에 개최된 제16차 노벨 학회에서 과학자들, 음악가들, 그리고 철학자들은 다음과 같은 Freeman Dyson의 말을 인용하는 데 모두 동의했다. “당신이 창조와 실행에 관해 이야기하고 있는 한, 과학과 예술 사이의 유사성은 매우 높다."], [8, "이 사람들 모두는 자신들이 예술적인 작업을 하고 있든 과학적인 작업을 하고 있든 문제를 해결하려고 노력하고 있다.”"]], "why": ["빈칸은 많은 과학자와 예술가가 창의력의 무엇에 주목해 왔는지를 묻는다", "문장 2에서 과학자·음악가·철학자는 <b>the analogies between science and art are very good<\/b>(과학과 예술의 유사성은 매우 높다)에 모두 동의한다", "문장 8은 <b>whether they are doing artistic work or scientific work, are trying to solve a problem<\/b>(예술적인 작업이든 과학적인 작업이든 문제를 해결하려 한다)이라고 말한다", "분야가 달라도 똑같이 나타난다는 뜻이다", "그래서 빈칸은 <b>보편성(universality)<\/b>이다."], "ch": [{"n": "①", "t": "formality", "g": "형식성", "ok": false, "e": ["formality는 ‘형식성’이다", "창의력이 형식적이라는 말은 지문에 나오지 않는다."]}, {"n": "②", "t": "objectivity", "g": "객관성", "ok": false, "e": ["objectivity는 ‘객관성’이다", "지문은 과학과 예술의 <b>공통점<\/b>을 말할 뿐, 객관적이라는 이야기는 하지 않는다."]}, {"n": "③", "t": "complexity", "g": "복잡성", "ok": false, "e": ["complexity는 ‘복잡성’이다", "창의력이 복잡하다는 내용은 지문에 없다."]}, {"n": "④", "t": "universality", "g": "보편성", "ok": true, "e": ["universality는 ‘보편성’이다", "과학자·음악가·철학자·화가·시인·작가·물리학자까지, 분야가 달라도 같은 이야기를 한다", "그래서 창의력이 분야를 가리지 않고 통한다는 <b>보편성<\/b>이 글의 중심이다."]}, {"n": "⑤", "t": "uncertainty", "g": "불확실성", "ok": false, "e": ["uncertainty는 ‘불확실성’이다", "지문에는 오히려 <b>everybody agrees<\/b>(모두가 동의한다)가 두 번 나온다", "불확실하다는 말과는 거리가 멀다."]}], "tr": ["상당히 많은 과학자들과 예술가들이 창의력의 보편성에 주목해 왔다.", "1980년에 개최된 제16차 노벨 학회에서 과학자들, 음악가들, 그리고 철학자들은 다음과 같은 Freeman Dyson의 말을 인용하는 데 모두 동의했다. “당신이 창조와 실행에 관해 이야기하고 있는 한, 과학과 예술 사이의 유사성은 매우 높다.", "(과학과 예술에서의) 창조는 확실히 매우 유사 mething so aesthetically impressive. / Yet the auditorium was, in fact, designed algorithmically, using a technique known as “parametric design.” / The architects gave the system a set of criteria, and it generated a set of possible designs for the architects to choose from. / Similar software has been used to design lightweight bicycle frames and sturdier chairs, among much else. / Are these systems behaving “creatively”?", "ev_ko": [[2, "그러나 1만 개의 서로 맞물리는 음향 패널로 구성된 놀랍도록 아름다운 강당을 포함하는, 함부르크에 있는 새로운 콘서트 홀인 Elbphilharmonie를 생각해 보자."], [5, "(B) 그것은 오직 인간만이, 그리고 그것도 놀랍도록 세련된 창의적 감수성을 가진 인간만이 그토록 미학적으로 인상적인 것을 디자인할 수 있다고 본능적으로 생각하게 만드는 종류의 공간이다."], [6, "하지만 실제로 그 강당은 ‘파라메트릭 디자인’이라고 알려진 기술을 사용하여 알고리즘으로 디자인되었다."], [7, "(C) 건축가들은 그 방식(시스템)에 일련의 기준을 부여했고, 그것은 건축가들이 선택할 수 있는 일련의 가능한 디자인을 만들어 냈다."], [8, "유사한 소프트웨어가 다른 많은 것들 중에서 경량 자전거 프레임과 더 튼튼한 의자를 디자인하는 데 사용되었다."], [3, "(A) 이러한 방식(시스템)들은 ‘창의적으로’ 움직이는가?"]], "why": ["주어진 글은 문장 2에서 Elbphilharmonie의 <b>강당<\/b>을 소개하고 끝난다", "문장 5의 <b>It<\/b>은 그 강당을 가리키므로 (B)가 먼저 온다", "(B)의 문장 6은 그 강당이 <b>알고리즘으로 디자인되었다<\/b>고 밝힌다", "문장 7의 <b>the system<\/b>이 그 알고리즘 방식을 받아 건축가들이 어떻게 디자인했는지 설명하므로 (C)가 그다음이다", "문장 8은 비슷한 소프트웨어로 디자인한 자전거 프레임과 의자를 말한다", "이것이 문장 3의 <b>these systems<\/b>로 이어지므로 (A)가 마지막이다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)의 <b>these systems<\/b>가 가리킬 시스템이 아직 나오지 않았다", "주어진 글에는 system이라는 말이 없다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": false, "e": ["(B) 다음에 (A)가 오면 these systems가 가리킬 대상이 (C)에서야 처음 나온다", "(C)의 <b>the system<\/b>과 <b>Similar software<\/b>가 먼저 나와야 (A)의 these systems가 그것을 받는다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": true, "e": ["주어진 글의 강당 → (B)의 It과 알고리즘 설계 → (C)의 the system과 Similar software → (A)의 these systems로 자연스럽게 이어진다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C)의 <b>the system<\/b>이 받을 대상이 주어진 글에 없다", "주어진 글은 아직 알고리즘 이야기를 꺼내지 않았다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(C)가 맨 앞에 올 수 없다", "또 (C) 만들어 냈다"}, {"e": "a set of possible designs", "k": "일련의 가능한 디자인을"}, {"e": "for the architects to choose from.", "k": "건축가들이 선택할 수 있는."}], "easy": "건축가들이 시스템에 기준을 주자, 시스템은 건축가들이 고를 수 있는 여러 가능한 디자인을 만들어 냈어요.", "gist": "알고리즘 방식이 실제로 어떻게 쓰였는지 설명한다. 이 the system이 알고리즘 설계를 받는다. 그래서 (B) 다음에 (C)가 온다."}, {"n": 8, "ch": [{"e": "Similar software", "k": "유사한 소프트웨어가"}, {"e": "has been used to design", "k": "디자인하는 데 사용되었다"}, {"e": "lightweight bicycle frames and sturdier chairs,", "k": "경량 자전거 프레임과 더 튼튼한 의자를,"}, {"e": "among much else.", "k": "다른 많은 것들 중에서."}], "easy": "비슷한 소프트웨어가 가벼운 자전거 프레임, 더 튼튼한 의자, 그 밖의 많은 것을 디자인하는 데도 쓰였어요.", "gist": "같은 종류의 소프트웨어가 다른 물건에도 쓰인다고 넓혀 간다. 이것이 (A)의 these systems로 이어진다."}]}, {"no": "09", "typ": "장문 순서 (43번)", "src": "2018년 9월 43번", "evn": [16, 7, 20], "ev_en": "Highly motivated by his words, the young woodcutter tried harder the next day, but (c) he could only bring ten trees. / It was as if the old man worked through the break time just as (b) he did. / Suddenly the young woodcutter realized that during break times while the old man was having a drink, he was also re-sharpening his axe, which the young woodcutter never did.", "ev_ko": [[16, "(C) 그(고용인)의 말(칭찬)에 매우 고취되어(자극을 받아), 젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나, (c) 그(젊은 나무꾼)는 고작 열 그루의 나무들만 (고용인에게) 가져다줄 수 있었다."], [7, "(B) 마치 바로 (b) 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다."], [20, "(D) 불현듯 그 젊은 나무꾼은 쉬는 시간에 노인이 마실 것을 마시는 동안, 그가 (동시에) 도끼날도 (또한) 갈고 있었다는 것을 깨달았는데, 이(도끼날을 가는 것)는 젊은 나무꾼이 결코 (시도) 하지 않았던 일이었다."]], "why": ["(A)는 고용인의 칭찬(<b>Fantastic!<\/b>, <b>Keep up the great work!<\/b>)으로 끝난다", "(C)의 첫 문장 <b>Highly motivated by his words<\/b>에서 his words가 그 칭찬을 받으므로 (A) 다음은 (C)다", "(C)는 노인도 자기와 같은 양, 때로는 더 많은 양을 벤다는 것을 알아차리는 것으로 끝난다", "(B)의 첫 문장 <b>It was as if the old man worked through the break time just as he did<\/b>가 그 내용을 이어받으므로 (C) 다음은 (B)다", "(B)는 노인이 도끼날을 다시 갈지 않는 것이 노력의 낭비라고 말하는 장면으로 끝난다", "(D)는 노인이 쉬는 시간에 도끼날을 갈고 있었다는 것을 <b>realized<\/b>(깨달았다)로 이어 가며 마무리된다", "그래서 (B) 다음은 (D)다."], "ch": [{"n": "①", "t": "(B) – (D) – (C)", "g": "", "ok": false, "e": ["(B)의 <b>It was as if<\/b> 문장이 받을 ‘노인도 나처럼 일한다’는 내용이 (C)의 끝에서 처음 나온다", "(C)가 (B)보다 먼저 와야 한다."]}, {"n": "②", "t": "(C) – (B) – (D)", "g": "", "ok": true, "e": ["(A) 끝의 칭찬 → (C) 첫 문장의 his words, (C) 끝의 알아차림 → (B) 첫 문장의 It was as if, (B) 끝의 도끼날 이야기 → (D)의 깨달음으로 세 군데가 모두 이어진다."]}, {"n": "③", "t": "(C) – (D) – (B)", "g": "", "ok": false, "e": ["(C) 끝의 ‘노인도 나만큼 벤다’는 알아차림을 바로 받는 것은 (B)의 첫 문장 <b>It was as if<\/b>다", "중간에 (D)가 끼면 이 연결이 끊긴다."]}, {"n": "④", "t": "(D) – (B) – (C)", "g": "", "ok": false, "e": ["(A)의 끝은 고용인의 칭찬인데, (D)는 노인이 도끼날을 갈고 있었음을 깨닫는 장면이다", "칭찬을 받은 다음에는 그 말에 고무된 (C)가 이어져야 한다."]}, {"n": "⑤", "t": "(D) – (C) – (B)", "g": "", "ok": false, "e": ["(D)를 맨 앞에 두면 (A)의 칭찬 바로 뒤에서 (C)의 <b>his words<\/b>가 이어지지 못한다", "(D)는 (B) 끝의 도끼날 이야기를 받는 장면이다."]}], "tr": ["(A) 옛날에, 정글에서 나무를 베는 두 명의 나무꾼이 있었다 — 젊고 힘이 센 나무꾼과 나이 든 나무꾼(이었다).", "그 젊은이는 매우 부지런했다.", "그의 (그가 일을 시작한) 첫째 날, (a) 그(젊은 나무꾼)는 그의 쉬는 시간까지 일을 했고, 그 노인이 먹고 마시려고 수차례 휴식을 취하며 시간을 낭비하고 있다고 불평했다.", "그 날, 그 젊은 나무꾼은 그의 고용인에게 열다섯 그루의 나무를 가져다주었다.", "“훌륭하군!” 고용인이 말했다.", "“계속 열심히 해 주게나!”", "(B) 마치 바로 (b) 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다.", "그래서, 그 젊은 나무꾼은 그 다음 날 더 열심히 일하기로 결심했다.", "유감스럽게도, 그 결과는 훨씬 더 심각했다(참혹했다).", "“내가 힘이 (점점) 빠지고 있는 것이 틀림없어.” 젊은이는 생각했다.", "어느 날, 노인은 쉬는 시간 동안 (마실 것이라도) 한 잔 하자며 그(젊은 나무꾼)를 불렀다.", "젊은이는 거절했고, 그가 여유 시간이 없다고 말했다.", "그러자, 노인이 미소 지으며 그에게 말했다.", "“자네의 도끼날을 다시 갈지 않고 계속 나무만 베어내는 것은 노력의 낭비라네(노력을 낭비하는 거라네).", "자네가 너무 많은 힘을 다 써버렸기 때문에(기력을 너무 많이 소진했기 때문에), 머잖아 자네는 (나무 베기를) 그만둬야 할게야.”", "(C) 그(고용인)의 말(칭찬)에 매우 고취되어(자극을 받아), 젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나, (c) 그(젊은 나무꾼)는 고작 열 그루의 나무들만 (고용인에게) 가져다줄 수 있었다.", "세 번째 날 그는 훨씬 더 열심히 노력했으나, 그는 겨우 일곱 그루의 나무들만 가져다줄 수 있었다.", "날마다, 그는 점점 더 적은 (양의) 나무들을 가져다주고 있었다.", "시간이 지남에 따라, (d) 그(젊은 나무꾼)는 그가 그의 쉬는 시간까지 일을 하고 거의 휴식을 취하지 않았음에도 불구하고, 그 나이 든 나무꾼이 그(젊은 나무꾼)와 똑같은 양의 나무들을 베어내고 있었다는 — 그리고 때로는 심지어 (자신보다) 더 많은 양을 베고 있다는 것을 알아차렸다(알게 되었다).", "(D) 불현듯 그 젊은 나무꾼은 쉬는 시간에 노인이 마실 것을 마시는 동안, 그가 (동시에) 도끼날도 (또한) 갈고 있었다는 것을 깨달았는데, 이(도끼날을 가는 것)는 젊은 나무꾼이 결코 (시도) 하지 않았던 일이었다.", "그것(도끼날을 가는 것)이 (바로) (e) 그(노인)가 젊은이보다 더 적은 시간에 더 많이 벨 수 있었던 방법이다!", "그 노인은 우리 모두가 (잠시) 휴식을 취하고(긴장을 늦추고), 생각하고 명상하며, 배우고 성장할 시간이 필요하다고 말했다.", "만일 우리가 ‘도끼날’을 갈 시간을 갖지 않는다면, 우리는 무뎌지고 우리의 효율성을 잃게 될 것이다."], "ps": [{"n": 1, "ch": [{"e": "(A) Once, there were two woodcutters", "k": "(A) 옛날에, 두 명의 나무꾼이 있었다"}, {"e": "— a young, strong one", "k": "— 젊고 힘이 센 나무꾼과"}, {"e": "and an old one —", "k": "나이 든 나무꾼(이었다) —"}, {"e": "cutting down trees in a jungle.", "k": "정글에서 나무를 베는."}], "easy": "옛날에 정글에서 나무를 베는 나무꾼이 둘 있었어요. 한 명은 젊고 힘이 셌고, 한 명은 나이가 많았어요.", "gist": "(A)의 시작. 이야기의 두 주인공, 젊은 나무꾼과 나이 든 나무꾼을 소개한다."}, {"n": 2, "ch": [{"e": "The young man", "k": "그 젊은이는"}, {"e": "was very <b>hardworking<\/b>.", "k": "매우 <b>부지런했다<\/b>."}], "easy": "젊은 나무꾼은 정말 부지런했어요.", "gist": "젊은 나무꾼의 성격 소개. 부지런함이 이야기의 출발점이다."}, {"n": 3, "ch": [{"e": "On his first day,", "k": "그가 일을 시작한 첫째 날,"}, {"e": "(a) he worked <b>through<\/b> his break time", "k": "(a) 그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 쉬는 시간까지 일을 했고"}, {"e": "and <b>complained<\/b>", "k": "불평했다"}, {"e": "that the old man was wasting time,", "k": "그 노인이 시간을 낭비하고 있다고,"}, {"e": "taking several breaks to eat and drink.", "k": "먹고 마시려고 수차례 휴식을 취하며."}], "easy": "첫날 젊은이는 쉬는 시간에도 일했고, 노인이 먹고 마시며 자주 쉬면서 시간을 낭비한다고 불평했어요.", "gist": "두 사람의 일하는 방식이 대조된다. 젊은이는 쉬는 시간에도 일하고, 노인은 자주 쉰다."}, {"n": 4, "ch": [{"e": "That day,", "k": "그 날,"}, {"e": "the young woodcutter brought <b>15 trees<\/b>", "k": "그 젊은 나무꾼은 열다섯 그루의 나무를 가져다주었다"}, {"e": "to their boss.", "k": "그들의 고용인에게."}], "easy": "그날 젊은 나무꾼은 고용인에게 나무 열다섯 그루를 가져다줬어요.", "gist": "첫날의 성과. 쉬지 않고 일해서 나무 15그루를 가져다줬다. 이 숫자가 뒤에서 점점 줄어든다."}, {"n": 5, "ch": [{"e": "“Fantastic!”", "k": "“훌륭하군!”"}, {"e": "the boss said.", "k": "고용인이 말했다."}], "easy": "고용인이 ‘훌륭하군!’ 하고 칭찬했어요.", "gist": "고용인의 칭찬. 젊은 나무꾼은 이 칭찬에 힘을 얻는다."}, {"n": 6, "ch": [{"e": "“<b>Keep up<\/b> the great work!”", "k": "“계속 열심히 해 주게나!”"}], "easy": "‘지금처럼 계속 잘해 주게!’ 하고 말했어요.", "gist": "(A)의 마지막 말. 이 칭찬을 (C)의 his words가 이어받는다."}, {"n": 7, "ch": [{"e": "(B) It was as if", "k": "(B) ~인 것만 같았다"}, {"e": "the old man worked through the break time", "k": "그 노인이 쉬는 시간까지 일을 하는"}, {"e": "just as (b) he did.", "k": "마치 바로 (b) 그가<span class=\"r\">(= 젊은 나무꾼)<\/span> 그러했듯이."}], "easy": "마치 노인도 젊은이처럼 쉬는 시간에 일하는 것만 같았어요.", "gist": "(C) 끝에서 알아차린 내용(노인도 자기만큼 벤다)을 받아 ‘노인도 쉬는 시간에 일하는 것 같다’고 말한다. 그래서 (C) 다음에 (B)가 온다.", "link": "마치 바로 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다."}, {"n": 8, "ch": [{"e": "So,", "k": "그래서,"}, {"e": "the young woodcutter <b>decided<\/b>", "k": "그 젊은 나무꾼은 결심했다"}, {"e": "to work harder the next day.", "k": "그 다음 날 더 열심히 일하기로."}], "easy": "그래서 젊은 나무꾼은 다음 날 더 열심히 일하기로 마음먹었어요.", "gist": "노인도 쉬는 시간에 일한다고 느낀 젊은이가 더 열심히 하기로 한다."}, {"n": 9, "ch": [{"e": "<b>Unfortunately<\/b>,", "k": "<b>유감스럽게도<\/b>,"}, {"e": "the results were even worse.", "k": "그 결과는 훨씬 더 심각했다(참혹했다)."}], "easy": "안타깝게도 결과는 오히려 훨씬 더 나빴어요.", "gist": "더 열심히 했는데도 결과가 나빠졌다. 이야기의 반전이다."}, {"n": 10, "ch": [{"e": "“I must be losing my strength,”", "k": "“내가 힘이 (점점) 빠지고 있는 것이 틀림없어,”"}, {"e": "the young man thought.", "k": "젊은이는 생각했다."}], "easy": "‘내 힘이 빠지고 있는 게 틀림없어.’ 젊은이는 이렇게 생각했어요.", "gist": "젊은이는 결과가 나쁜 이유를 자기 힘이 빠졌기 때문이라고 짐작한다."}, {"n": 11, "ch": [{"e": "One day,", "k": "어느 날,"}, {"e": "the old man <b>invited<\/b> him", "k": "노인은 그를<span class=\"r\">(= 젊은 나무꾼)<\/span> 불렀다"}, {"e": "for a drink during the break time.", "k": "쉬는 시간 동안 (마실 것이라도) 한 잔 하자며."}], "easy": "어느 날 노인이 쉬는 시간에 같이 한잔하자고 젊은이를 불렀어요.", "gist": "노인이 쉬는 시간에 함께 마시자고 청하는 장면이다."}, {"n": 12, "ch": [{"e": "The young man <b>refused<\/b>", "k": "젊은이는 거절했고,"}, {"e": "and said he had no extra time.", "k": "그가<span class=\"r\">(= 젊은 나무꾼)<\/span> 여유 시간이 없다고 말했다."}], "easy": "젊은이는 거절하면서 여유 시간이 없다고 말했어요.", "gist": "젊은이는 쉬지 않고 일하는 쪽을 택한다."}, {"n": 13, "ch": [{"e": "Then,", "k": "그러자,"}, {"e": "the old man smiled and said to him,", "k": "노인이 미소 지으며 그에게<span class=\"r\">(= 젊은 나무꾼)<\/span> 말했다."}], "easy": "그러자 노인이 웃으면서 이렇게 말했어요.", "gist": "노인의 조언이 시작되는 문장이다."}, {"n": 면"}, {"e": "to sharpen the “axe,”", "k": "‘도끼날’을 갈,"}, {"e": "we will become <b>dull<\/b>", "k": "우리는 무뎌지고"}, {"e": "and lose our effectiveness.", "k": "우리의 효율성을 잃게 될 것이다."}], "easy": "‘도끼날’을 갈 시간을 내지 않으면 우리는 무뎌지고 효율도 잃게 돼요.", "gist": "이야기의 교훈. 도끼날을 가는 시간은 쉬고 배우고 성장하는 시간을 뜻하고, 그 시간이 없으면 효율이 떨어진다."}]}, {"no": "10", "typ": "장문 지칭 (44번)", "src": "2018년 9월 44번", "evn": [21], "ev_en": "That’s how (e) he could chop more than the young man in less time!", "ev_ko": [[21, "그것(도끼날을 가는 것)이 (바로) (e) 그(노인)가 젊은이보다 더 적은 시간에 더 많이 벨 수 있었던 방법이다!"]], "why": ["본문에서 he/his/him으로 가리킬 수 있는 인물은 노인, 젊은이, 고용인이다", "(e)는 나무를 베는 사람이므로 나무꾼 중 한 명이다", "같은 문장에 <b>than the young man<\/b>(젊은이보다)이 있으므로 젊은이가 아니라 <b>노인<\/b>이다", "(a)~(d)는 모두 젊은 나무꾼을 가리키므로 (e)만 다르다."], "ch": [{"n": "①", "t": "(a)", "g": "", "ok": false, "e": ["첫날 쉬는 시간까지 일하고 노인이 시간을 낭비한다고 불평한 사람이므로 젊은 나무꾼이다."]}, {"n": "②", "t": "(b)", "g": "", "ok": false, "e": ["‘마치 바로 (b)가 그러했듯이 노인이 쉬는 시간까지 일을 하는 것만 같았다’에서 노인과 견주는 쪽이므로 젊은 나무꾼이다."]}, {"n": "③", "t": "(c)", "g": "", "ok": false, "e": ["고용인의 칭찬에 고취되어 더 열심히 했지만 열 그루밖에 가져다주지 못한 사람이므로 젊은 나무꾼이다."]}, {"n": "④", "t": "(d)", "g": "", "ok": false, "e": ["쉬는 시간까지 일하고 거의 쉬지 않았는데도 노인이 자기와 같은 양을 벤다는 것을 알아차린 사람이므로 젊은 나무꾼이다."]}, {"n": "⑤", "t": "(e)", "g": "", "ok": true, "e": ["나무를 베는 사람이고 <b>than the young man<\/b>(젊은이보다) 더 적은 시간에 더 많이 벨 수 있었다고 했으므로 노인이다", "나머지 (a)~(d)는 젊은 나무꾼이다."]}], "tr": ["(A) 옛날에, 정글에서 나무를 베는 두 명의 나무꾼이 있었다 — 젊고 힘이 센 나무꾼과 나이 든 나무꾼(이었다).", "그 젊은이는 매우 부지런했다.", "그의 (그가 일을 시작한) 첫째 날, (a) 그(젊은 나무꾼)는 그의 쉬는 시간까지 일을 했고, 그 노인이 먹고 마시려고 수차례 휴식을 취하며 시간을 낭비하고 있다고 불평했다.", "그 날, 그 젊은 나무꾼은 그의 고용인에게 열다섯 그루의 나무를 가져다주었다.", "“훌륭하군!” 고용인이 말했다.", "“계속 열심히 해 주게나!”", "(B) 마치 바로 (b) 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다.", "그래서, 그 젊은 나무꾼은 그 다음 날 더 열심히 일하기로 결심했다.", "유감스럽게도, 그 결과는 훨씬 더 심각했다(참혹했다).", "“내가 힘이 (점점) 빠지고 있는 것이 틀림없어.” 젊은이는 생각했다.", "어느 날, 노인은 쉬는 시간 동안 (마실 것이라도) 한 잔 하자며 그(젊은 나무꾼)를 불렀다.", "젊은이는 거절했고, 그가 여유 시간이 없다고 말했다.", "그러자, 노인이 미소 지으며 그에게 말했다.", "“자네의 도끼날을 다시 갈지 않고 계속 나무만 베어내는 것은 노력의 낭비라네(노력을 낭비하는 거라네).", "자네가 너무 많은 힘을 다 써버렸기 때문에(기력을 너무 많이 소진했기 때문에), 머잖아 자네는 (나무 베기를) 그만둬야 할게야.”", "(C) 그(고용인)의 말(칭찬)에 매우 고취되어(자극을 받아), 젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나, (c) 그(젊은 나무꾼)는 고작 열 그루의 나무들만 (고용인에게) 가져다줄 수 있었다.", "세 번째 날 그는 훨씬 더 열심히 노력했으나, 그는 겨우 일곱 그루의 나무들만 가져다줄 수 있었다.", "날마다, 그는 점점 더 적은 (양의) 나무들을 가져다주고 있었다.", "시간이 지남에 따라, (d) 그(젊은 나무꾼)는 그가 그의 쉬는 시간까지 일을 하고 거의 휴식을 취하지 않았음에도 불구하고, 그 나이 든 나무꾼이 그(젊은 나무꾼)와 똑같은 양의 나무들을 베어내고 있었다는 — 그리고 때로는 심지어 (자신보다) 더 많은 양을 베고 있다는 것을 알아차렸다(알게 되었다).", "(D) 불현듯 그 젊은 나무꾼은 쉬는 시간에 노인이 마실 것을 마시는 동안, 그가 (동시에) 도끼날도 (또한) 갈고 있었다는 것을 깨달았는데, 이(도끼날을 가는 것)는 젊은 나무꾼이 결코 (시도) 하지 않았던 일이었다.", "그것(도끼날을 가는 것)이 (바로) (e) 그(노인)가 젊은이보다 더 적은 시간에 더 많이 벨 수 있었던 방법이다!", "그 노인은 우리 모두가 (잠시) 휴식을 취하고(긴장을 늦추고), 생각하고 명상하며, 배우고 성장할 시간이 필요하다고 말했다.", "만일 우리가 ‘도끼날’을 갈 시간을 갖지 않는다면, 우리는 무뎌지고 우리의 효율성을 잃게 될 것이다."], "ps": [{"n": 1, "ch": [{"e": "(A) Once, there were two woodcutters", "k": "(A) 옛날에, 두 명의 나무꾼이 있었다"}, {"e": "— a young, strong one", "k": "— 젊고 힘이 센 나무꾼과"}, {"e": "and an old one —", "k": "나이 든 나무꾼(이었다) —"}, {"e": "cutting down trees in a jungle.", "k": "정글에서 나무를 베는."}], "easy": "옛날에 정글에서 나무를 베는 나무꾼이 둘 있었어요. 한 명은 젊고 힘이 셌고, 한 명은 나이가 많았어요.", "gist": "(A)의 시작. 이야기의 두 주인공, 젊은 나무꾼과 나이 든 나무꾼을 소개한다."}, {"n": 2, "ch": [{"e": "The young man", "k": "그 젊은이는"}, {"e": "was very <b>hardworking<\/b>.", "k": "매우 <b>부지런했다<\/b>."}], "easy": "젊은 나무꾼은 정말 부지런했어요.", "gist": "젊은 나무꾼의 성격 소개. 부지런함이 이야기의 출발점이다."}, {"n": 3, "ch": [{"e": "On his first day,", "k": "그가 일을 시작한 첫째 날,"}, {"e": "(a) he worked <b>through<\/b> his break time", "k": "(a) 그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 쉬는 시간까지 일을 했고"}, {"e": "and <b>complained<\/b>", "k": "불평했다"}, {"e": "that the old man was wasting time,", "k": "그 노인이 시간을 낭비하고 있다고,"}, {"e": "taking several breaks to eat and drink.", "k": "먹고 마시려고 수차례 휴식을 취하며."}], "easy": "첫날 젊은이는 쉬는 시간에도 일했고, 노인이 먹고 마시며 자주 쉬면서 시간을 낭비한다고 불평했어요.", "gist": "두 사람의 일하는 방식이 대조된다. 젊은이는 쉬는 시간에도 일하고, 노인은 자주 쉰다."}, {"n": 4, "ch": [{"e": "That day,", "k": "그 날,"}, {"e": "the young woodcutter brought <b>15 trees<\/b>", "k": "그 젊은 나무꾼은 열다섯 그루의 나무를 가져다주었다"}, {"e": "to their boss.", "k": "그들의 고용인에게."}], "easy": "그날 젊은 나무꾼은 고용인에게 나무 열다섯 그루를 가져다줬어요.", "gist": "첫날의 성과. 쉬지 않고 일해서 나무 15그루를 가져다줬다. 이 숫자가 뒤에서 점점 줄어든다."}, {"n": 5, "ch": [{"e": "“Fantastic!”", "k": "“훌륭하군!”"}, {"e": "the boss said.", "k": "고용인이 말했다."}], "easy": "고용인이 ‘훌륭하군!’ 하고 칭찬했어요.", "gist": "고용인의 칭찬. 젊은 나무꾼은 이 칭찬에 힘을 얻는다."}, {"n": 6, "ch": [{"e": "“<b>Keep up<\/b> the great work!”", "k": "“계속 열심히 해 주게나!”"}], "easy": "‘지금처럼 계속 잘해 주게!’ 하고 말했어요.", "gist": "(A)의 마지막 말. 이 칭찬을 (C)의 his words가 이어받는다."}, {"n": 7, "ch": [{"e": "(B) It was as if", "k": "(B) ~인 것만 같았다"}, {"e": "the old man worked through the break time", "k": "그 노인이 쉬는 시간까지 일을 하는"}, {"e": "just as (b) he did.", "k": "마치 바로 (b) 그가<span class=\"r\">(= 젊은 나무꾼)<\/span> 그러했듯이."}], "easy": "마치 노인도 젊은이처럼 쉬는 시간에 일하는 것만 같았어요.", "gist": "(C) 끝에서 알아차린 내용(노인도 자기만큼 벤다)을 받아 ‘노인도 쉬는 시간에 일하는 것 같다’고 말한다. 그래서 (C) 다음에 (B)가 온다.", "link": "마치 바로 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다."}, {"n": 8, "ch": [{"e": "So,", "k": "그래서,"}, {"e": "the young woodcutter <b>decided<\/b>", "k": "그 젊은 나무꾼은 결심했다"}, {"e": "to work harder the next day.", "k": "그 다음 날 더 열심히 일하기로."}], "easy": "그래서 젊은 나무꾼은 다음 날 더 열심히 일하기로 마음먹었어요.", "gist": "노인도 쉬는 시간에 일한다고 느낀 젊은이가 더 열심히 하기로 한다."}, {"n": 9, "ch": [{"e": "<b>Unfortunately<\/b>,", "k": "<b>유감스럽게도<\/b>,"}, {"e": "the results were even worse.", "k": "그 결과는 훨씬 더 심각했다(참혹했다)."}], "easy": "안타깝게도 결과는 오히려 훨씬 더 나빴어요.", "gist": "더 열심히 했는데도 결과가 나빠졌다. 이야기의 반전이다."}, {"n": 10, "ch": [{"e": "“I must be losing my strength,”", "k": "“내가 힘이 (점점) 빠지고 있는 것이 틀림없어,”"}, {"e": "the young man thought.", "k": "젊은이는 생각했다."}], "easy": "‘내 힘이 빠지고 있는 게 틀림없어.’ 젊은이는 이렇게 생각했어요.", "gist": "젊은이는 결과가 나쁜 이유를 자기 힘이 빠졌기 때문이라고 짐작한다."}, {"n": 11, "ch": [{"e": "One day,", "k": "어느 날,"}, {"e": "the old man <b>invited<\/b> him", "k": "노인은 그를<span class=\"r\">(= 젊은 나무꾼)<\/span> 불렀다"}, {"e": "for a drink during the break time.", "k": "쉬는 시간 동안 (마실 것이라도) 한 잔 하자며."}], "easy": "어느 날 노인이 쉬는 시간에 같이 한잔하자고 젊은이를 불렀어요.", "gist": "노인이 쉬는 시간에 함께 마시자고 청하는 장면이다."}, {"n": 12, "ch": [{"e": "The young man <b>refused<\/b>", "k": "젊은이는 거절했고,"}, {"e": "and said he had no extra time.", "k": "그가<span class=\"r\">(= 젊은 나무꾼)<\/span> 여유 시간이 없다고 말했다."}], "easy": "젊은이는 거절하면서 여유 시간이 없다고 말했어요.", "gist": "젊은이는 쉬지 않고 일하는 쪽을 택한다."}, {"n": 13, "ch": [{"e": "Then,", "k": "그러자,"}, {"e": "the old man smiled and said to him,", "k": "노인이 미소 지으며 그에게<span class=\"r\">(= 젊은 나무꾼)<\/span> 말했다."}], "easy": "그러자 노인이 웃으면서 이렇게 말했어요.", "gist": "노인의 조언이 시작되는 문장이다."}, {"n": 14, "ch": [{"e": "“It is a <b>waste of effort<\/b>", "k": "“노력의 낭비라네,"}, {"e": "to keep chopping trees", "k": "계속 나무만 베어내는 것은"}, {"e": "without re-sharpening your axe.", "k": "자네의 도끼날을 다시 갈지 않고."}], "easy": "도끼날을 다시 갈지 않고 나무만 계속 베는 건 힘만 낭비하는 일이라고요.", "gist": "노인의 핵심 조언. 도끼날을 갈지 않고 베기만 하면 노력만 낭비된다는 뜻이다."}, {"n": 15, "ch": [{"e": "<b>Sooner or later<\/b>,", "k": "머잖아,"}, {"e": "you will have to <b>give up<\/b>", "k": "자네는 그만둬야 할 걸세"}, {"e": "because you’ve spent too much energy.”", "k": "자네가 너무 많은 힘을 다 써버렸기 때문에.”"}], "easy": "머지않아 힘을 너무 써 버려서 포기하게 될 거라고요.", "gist": "도끼날을 갈지 않고 일만 하면 결국 기력이 바닥나 포기하게 된다는 경고다."}, {"n": 16, "ch": [{"e": "(C) <b>Highly motivated<\/b> by his words,", "k": "(C) 그의 말에<span class=\"r\">(= 고용인의 칭찬)<\/span> 매우 고취되어,"}, {"e": "the young woodcutter tried harder the next day,", "k": "젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나,"}, {"e": "but (c) he could <b>only<\/b> bring ten trees.", "k": "(c) 그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 고작 열 그루의 나무만 가져다줄 수 있었다."}], "easy": "고용인의 칭찬에 힘을 얻어 다음 날 더 열심히 했는데도, 젊은이는 나무를 열 그루밖에 가져오지 못했어요.", "gist": "(A) 끝의 칭찬을 his words로 받아 이어 간다. 그래서 (A) 다음에 (C)가 온다. 더 열심히 했는데 나무는 15그루에서 10그루로 줄었다."}, {"n": 17, "ch": [{"e": "The third day", "k": "셋째 날"}, {"e": "he tried <b>even harder<\/b>,", "k": "그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 훨씬 더 열심히 노력했으나,"}, {"e": "but he was only able to bring <b>seven<\/b> trees.", "k": "겨우 일곱 그루의 나무만 가져다줄 수 있었다."}], "easy": "셋째 날에는 훨씬 더 열심히 했지만 일곱 그루밖에 못 가져왔어요.", "gist": "노력은 늘었는데 나무는 15그루, 10그루, 7그루로 계속 줄어든다."}, {"n": 18, "ch": [{"e": "<b>Day after day<\/b>,", "k": "날마다,"}, {"e": "he was bringing", "k": "그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 가져다주고 있었다"}, {"e": "<b>less and less<\/b> trees.", "k": "점점 더 적은 나무들을."}], "easy": "날이 갈수록 가져오는 나무가 점점 더 줄어들었어요.", "gist": "나무의 수가 점점 줄었다는 정리 문장이다."}, {"n": 19, "ch": [{"e": "As time went by,", "k": "시간이 지남에 따라,"}, {"e": "(d) he <b>noticed<\/b>", "k": "(d) 그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 알아차렸다"}, {"e": "that even though he worked through his break time", "k": "그가 쉬는 시간까지 일을 하고"}, {"e": "and hardly took a rest,", "k": "거의 휴식을 취하지 않았음에도 불구하고,"}, {"e": "the old woodcutter was cutting down", "k": "그 나이 든 나무꾼이 베어내고 있었다는 것을"}, {"e": "the same amount of trees as him —", "k": "그와<span class=\"r\">(= 젊은 나무꾼)<\/span> 똑같은 양의 나무들을 —"}, {"e": "and sometimes chopped down even more.", "k": "그리고 때로는 심지어 더 많은 양을 베고 있다는 것을."}], "easy": "시간이 지나자 젊은이는 알게 됐어요. 자기는 쉬는 시간에도 일하고 거의 쉬지 않는데, 노인이 자기와 같은 양을, 때로는 더 많이 베고 있었던 거예요.", "gist": "(C)의 마무리. 쉬지 않는 자신과 쉬는 노인이 같은 양을 베고 있다는 알아차림이 (B)의 첫 문장으로 이어진다."}, {"n": 20, "ch": [{"e": "(D) <b>Suddenly<\/b> the young woodcutter <b>realized<\/b>", "k": "(D) 불현듯 그 젊은 나무꾼은 깨달았다"}, {"e": "that during break times", "k": "쉬는 시간에"}, {"e": "while the old man was having a drink,", "k": "노인이 마실 것을 마시는 동안,"}, {"e": "he was also re-sharpening his axe,", "k": "그가<span class=\"r\">(= 노인)<\/span> 도끼날도 갈고 있었다는 것을,"}, {"e": "which the young woodcutter never did.", "k": "그것은<span class=\"r\">(= 도끼날을 가는 것)<\/span> 젊은 나무꾼이 결코 하지 않았던 일이었다."}], "easy": "그때 젊은 나무꾼은 문득 깨달았어요. 노인이 쉬는 시간에 음료를 마시면서 도끼날도 갈고 있었다는 걸요. 그건 자기가 한 번도 안 한 일이었어요.", "gist": "(B) 끝에서 노인이 말한 도끼날 이야기를 받아, 노인이 실제로 도끼날을 갈고 있었음을 깨닫는 장면이다."}, {"n": 21, "ch": [{"e": "That’s how", "k": "그것이<span class=\"r\">(= 도끼날을 가는 것)<\/span> 바로 방법이다"}, {"e": "(e) he could chop", "k": "(e) 그가<span class=\"r\">(= 노인)<\/span> 벨 수 있었던"}, {"e": "more than the young man", "k": "젊은이보다 더 많이"}, {"e": "in less time!", "k": "더 적은 시간에!"}], "easy": "바로 그 덕분에 노인은 젊은이보다 더 적은 시간에 더 많이 벨 수 있었던 거예요!", "gist": "도끼날을 가는 것이 노인이 더 적은 시간에 더 많이 벤 비결이다."}, {"n": 22, "ch": [{"e": "The old man said", "k": "노인은 말했다"}, {"e": "that we all need time", "k": "우리 모두가 시간이 필요하다고"}, {"e": "to relax,", "k": "(잠시) 휴식을 취하고(긴장을 늦추고),"}, {"e": "to think and meditate,", "k": "생각하고 명상하며,"}, {"e": "and to learn and grow.", "k": "배우고 성장할."}], "easy": "노인은 우리 모두에게 쉬고, 생각하고, 배우고 성장할 시간이 필요하다고 말했어요.", "gist": "도끼날 이야기에서 교훈으로 넘어간다. 쉬고 배울 시간이 필요하다는 말이다."}, {"n": 23, "ch": [{"e": "If we don’t take the time", "k": "만일 우리가 시간을 갖지 않는다면"}, {"e": "to sharpen the “axe,”", "k": "‘도끼날’을 갈,"}, {"e": "we will become <b>dull<\/b>", "k": "우리는 무뎌지고"}, {"e": "and lose our effectiveness.", "k": "우리의 효율성을 잃게 될 것이다."}], "easy": "‘도끼날’을 갈 시간을 내지 않으면 우리는 무뎌지고 효율도 잃게 돼요.", "gist": "이야기의 교훈. 도끼날을 가는 시간은 쉬고 배우고 성장하는 시간을 뜻하고, 그 시간이 없으면 효율이 떨어진다."}]}, {"no": "11", "typ": "장문 내용 불일치 (45번)", "src": "2018년 9월 45번", "evn": [4, 16, 17, 18], "ev_en": "That day, the young woodcutter brought 15 trees to their boss. / Highly motivated by his words, the young woodcutter tried harder the next day, but (c) he could only bring ten trees. / The third day he tried even harder, but he was only able to bring seven trees. / Day after day, he was bringing less and less trees.", "ev_ko": [[4, "그 날, 그 젊은 나무꾼은 그의 고용인에게 열다섯 그루의 나무를 가져다주었다."], [16, "(C) 그(고용인)의 말(칭찬)에 매우 고취되어(자극을 받아), 젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나, (c) 그(젊은 나무꾼)는 고작 열 그루의 나무들만 (고용인에게) 가져다줄 수 있었다."], [17, "세 번째 날 그는 훨씬 더 열심히 노력했으나, 그는 겨우 일곱 그루의 나무들만 가져다줄 수 있었다."], [18, "날마다, 그는 점점 더 적은 (양의) 나무들을 가져다주고 있었다."]], "why": ["④는 ‘가져온 나무의 수가 점점 늘어났다’인데, 본문은 <b>less and less trees<\/b>, 즉 날마다 점점 더 적은 나무를 가져다주었다고 한다", "첫날 15그루, 다음 날 10그루, 셋째 날 7그루로 숫자까지 줄어든다", "그래서 ④가 글의 내용과 일치하지 않는다", "방향이 정반대다", "숫자가 나오는 문장은 숫자로 직접 확인하면 정확하다."], "ch": [{"n": "①", "t": "쉬는 시간에도 열심히 일했다", "g": "", "ok": false, "e": ["(A)에서 첫날 <b>he worked through his break time<\/b>이라고 했으므로 일치한다."]}, {"n": "②", "t": "첫 날 15개의 나무를 가져왔다", "g": "", "ok": false, "e": ["(A)의 <b>That day, the young woodcutter brought 15 trees<\/b>가 첫날의 일이므로 일치한다."]}, {"n": "③", "t": "쉬는 시간에 함께 음료를 마시자는 노인의 초대를 거절했다", "g": "", "ok": false, "e": ["(B)에서 노인이 쉬는 시간에 한잔하자고 청했고 <b>The young man refused<\/b>라고 했으므로 일치한다."]}, {"n": "④", "t": "가져온 나무의 수는 점점 늘어났다", "g": "", "ok": true, "e": ["(C)는 <b>less and less trees<\/b>, 즉 15그루 → 10그루 → 7그루로 줄어든다고 말한다", "방향이 정반대다."]}, {"n": "⑤", "t": "노인이 쉬는 시간에 도끼날을 갈고 있었다는 사실을 깨달았다", "g": "", "ok": false, "e": ["(D)에서 젊은 나무꾼이 노인이 <b>he was also re-sharpening his axe<\/b>라는 것을 <b>realized<\/b>(깨달았다)라고 했으므로 일치한다."]}], "tr": ["(A) 옛날에, 정글에서 나무를 베는 두 명의 나무꾼이 있었다 — 젊고 힘이 센 나무꾼과 나이 든 나무꾼(이었다).", "그 젊은이는 매우 부지런했다.", "그의 (그가 일을 시작한) 첫째 날, (a) 그(젊은 나무꾼)는 그의 쉬는 시간까지 일을 했고, 그 노인이 먹고 마시려고 수차례 휴식을 취하며 시간을 낭비하고 있다고 불평했다.", "그 날, 그 젊은 나무꾼은 그의 고용인에게 열다섯 그루의 나무를 가져다주었다.", "“훌륭하군!” 고용인이 말했다.", "“계속 열심히 해 주게나!”", "(B) 마치 바로 (b) 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다.", "그래서, 그 젊은 나무꾼은 그 다음 날 더 열심히 일하기로 결심했다.", "유감스럽게도, 그 결과는 훨씬 더 심각했다(참혹했다).", "“내가 힘이 (점점) 빠지고 있는 것이 틀림없어.” 젊은이는 생각했다.", "어느 날, 노인은 쉬는 시간 동안 (마실 것이라도) 한 잔 하자며 그(젊은 나무꾼)를 불렀다.", "젊은이는 거절했고, 그가 여유 시간이 없다고 말했다.", "그러자, 노인이 미소 지으며 그에게 말했다.", "“자네의 도끼날을 다시 갈지 않고 계속 나무만 베어내는 것은 노력의 낭비라네(노력을 낭비하는 거라네).", "자네가 너무 많은 힘을 다 써버렸기 때문에(기력을 너무 많이 소진했기 때문에), 머잖아 자네는 (나무 베기를) 그만둬야 할게야.”", "(C) 그(고용인)의 말(칭찬)에 매우 고취되어(자극을 받아), 젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나, (c) 그(젊은 나무꾼)는 고작 열 그루의 나무들만 (고용인에게) 가져다줄 수 있었다.", "세 번째 날 그는 훨씬 더 열심히 노력했으나, 그는 겨우 일곱 그루의 나무들만 가져다줄 수 있었다.", "날마다, 그는 점점 더 적은 (양의) 나무들을 가져다주고 있었다.", "시간이 지남에 따라, (d) 그(젊은 나무꾼)는 그가 그의 쉬는 시간까지 일을 하고 거의 휴식을 취하지 않았음에도 불구하고, 그 나이 든 나무꾼이 그(젊은 나무꾼)와 똑같은 양의 나무들을 베어내고 있었다는 — 그리고 때로는 심지어 (자신보다) 더 많은 양을 베고 있다는 것을 알아차렸다(알게 되었다).", "(D) 불현듯 그 젊은 나무꾼은 쉬는 시간에 노인이 마실 것을 마시는 동안, 그가 (동시에) 도끼날도 (또한) 갈고 있었다는 것을 깨달았는데, 이(도끼날을 가는 것)는 젊은 나무꾼이 결코 (시도) 하지 않았던 일이었다.", "그것(도끼날을 가는 것)이 (바로) (e) 그(노인)가 젊은이보다 더 적은 시간에 더 많이 벨 수 있었던 방법이다!", "그 노인은 우리 모두가 (잠시) 휴식을 취하고(긴장을 늦추고), 생각하고 명상하며, 배우고 성장할 시간이 필요하다고 말했다.", "만일 우리가 ‘도끼날’을 갈 시간을 갖지 않는다면, 우리는 무뎌지고 우리의 효율성을 잃게 될 것이다."], "ps": [{"n": 1, "ch": [{"e": "(A) Once, there were two woodcutters", "k": "(A) 옛날에, 두 명의 나무꾼이 있었다"}, {"e": "— a young, strong one", "k": "— 젊고 힘이 센 나무꾼과"}, {"e": "and an old one —", "k": "나이 든 나무꾼(이었다) —"}, {"e": "cutting down trees in a jungle.", "k": "정글에서 나무를 베는."}], "easy": "옛날에 정글에서 나무를 베는 나무꾼이 둘 있었어요. 한 명은 젊고 힘이 셌고, 한 명은 나이가 많았어요.", "gist": "(A)의 시작. 이야기의 두 주인공, 젊은 나무꾼과 나이 든 나무꾼을 소개한다."}, {"n": 2, "ch": [{"e": "The young man", "k": "그 젊은이는"}, {"e": "was very <b>hardworking<\/b>.", "k": "매우 <b>부지런했다<\/b>."}], "easy": "젊은 나무꾼은 정말 부지런했어요.", "gist": "젊은 나무꾼의 성격 소개. 부지런함이 이야기의 출발점이다."}, {"n": 3, "ch": [{"e": "On his first day,", "k": "그가 일을 시작한 첫째 날,"}, {"e": "(a) he worked <b>through<\/b> his break time", "k": "(a) 그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 쉬는 시간까지 일을 했고"}, {"e": "and <b>complained<\/b>", "k": "불평했다"}, {"e": "that the old man was wasting time,", "k": "그 노인이 시간을 낭비하고 있다고,"}, {"e": "taking several breaks to eat and drink.", "k": "먹고 마시려고 수차례 휴식을 취하며."}], "easy": "첫날 젊은이는 쉬는 시간에도 일했고, 노인이 먹고 마시며 자주 쉬면서 시간을 낭비한다고 불평했어요.", "gist": "두 사람의 일하는 방식이 대조된다. 젊은이는 쉬는 시간에도 일하고, 노인은 자주 쉰다."}, {"n": 4, "ch": [{"e": "That day,", "k": "그 날,"}, {"e": "the young woodcutter brought <b>15 trees<\/b>", "k": "그 젊은 나무꾼은 열다섯 그루의 나무를 가져다주었다"}, {"e": "to their boss.", "k": "그들의 고용인에게."}], "easy": "그날 젊은 나무꾼은 고용인에게 나무 열다섯 그루를 가져다줬어요.", "gist": "첫날의 성과. 쉬지 않고 일해서 나무 15그루를 가져다줬다. 이 숫자가 뒤에서 점점 줄어든다."}, {"n": 5, "ch": [{"e": "“Fantastic!”", "k": "“훌륭하군!”"}, {"e": "the boss said.", "k": "고용인이 말했다."}], "easy": "고용인이 ‘훌륭하군!’ 하고 칭찬했어요.", "gist": "고용인의 칭찬. 젊은 나무꾼은 이 칭찬에 힘을 얻는다."}, {"n": 6, "ch": [{"e": "“<b>Keep up<\/b> the great work!”", "k": "“계속 열심히 해 주게나!”"}], "easy": "‘지금처럼 계속 잘해 주게!’ 하고 말했어요.", "gist": "(A)의 마지막 말. 이 칭찬을 (C)의 his words가 이어받는다."}, {"n": 7, "ch": [{"e": "(B) It was as if", "k": "(B) ~인 것만 같았다"}, {"e": "the old man worked through the break time", "k": "그 노인이 쉬는 시간까지 일을 하는"}, {"e": "just as (b) he did.", "k": "마치 바로 (b) 그가<span class=\"r\">(= 젊은 나무꾼)<\/span> 그러했듯이."}], "easy": "마치 노인도 젊은이처럼 쉬는 시간에 일하는 것만 같았어요.", "gist": "(C) 끝에서 알아차린 내용(노인도 자기만큼 벤다)을 받아 ‘노인도 쉬는 시간에 일하는 것 같다’고 말한다. 그래서 (C) 다음에 (B)가 온다.", "link": "마치 바로 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다."}, {"n": 8, "ch": [{"e": "So,", "k": "그래서,"}, {"e": "the young woodcutter <b>decided<\/b>", "k": "그 젊은 나무꾼은 결심했다"}, {"e": "to work harder the next day.", "k": "그 다음 날 더 열심히 일하기로."}], "easy": "그래서 젊은 나무꾼은 다음 날 더 열심히 일하기로 마음먹었어요.", "gist": "노인도 쉬는 시간에 일한다고 느낀 젊은이가 더 열심히 하기로 한다."}, {"n": 9, "ch": [{"e": "<b>Unfortunately<\/b>,", "k": "<b>유감스럽게도<\/b>,"}, {"e": "the results were even worse.", "k": "그 결과는 훨씬 더 심각했다(참혹했다)."}], "easy": "안타깝게도 결과는 오히려 훨씬 더 나빴어요.", "gist": "더 열심히 했는데도 결과가 나빠졌다. 이야기의 반전이다."}, {"n": 10, "ch": [{"e": "“I must be losing my strength,”", "k": "“내가 힘이 (점점) 빠지고 있는 것이 틀림없어,”"}, {"e": "the young man thought.", "k": "젊은이는 생각했다."}], "easy": "‘내 힘이 빠지고 있는 게 틀림없어.’ 젊은이는 이렇게 생각했어요.", "gist": "젊은이는 결과가 나쁜 이유를 자기 힘이 빠졌기 때문이라고 짐작한다."}, {"n": 11, "ch": [{"e": "One day,", "k": "어느 날,"}, {"e": "the old man <b>invited<\/b> him", "k": "노인은 그를<span class=\"r\">(= 젊은 나무꾼)<\/span> 불렀다"}, {"e": "for a drink during the break time.", "k": "쉬는 시간 동안 (마실 것이라도) 한 잔 하자며."}], "easy": "어느 날 노인이 쉬는 시간에 같이 한잔하자고 젊은이를 불렀어요.", "gist": "노인이 쉬는 시간에 함께 마시자고 청하는 장면이다."}, {"n": 12, "ch": [{"e": "The young man <b>refused<\/b>", "k": "젊은이는 거절했고,"}, {"e": "and said he had no extra time.", "k": "그가<span class=\"r\">(= 젊은 나무꾼)<\/span> 여유 시간이 없다고 말했다."}], "easy": "젊은이는 거절하면서 여유 시간이 없다고 말했어요.", "gist": "젊은이는 쉬지 않고 일하는 쪽을 택한다."}, {"n": 13, "ch": [{"e": "Then,", "k": "그러자,"}, {"e": "the old man smiled and said to him,", "k": "노인이 미소 지으며 그에게<span class=\"r\">(= 젊은 나무꾼)<\/span> 말했다."}], "easy": "그러자 노인이 웃으면서 이렇게 말했어요.", "gist": "노인의 조언이 시작되는 문장이다."}, {"n": 14, "ch": [{"e": "“It is a <b>waste of effort<\/b>", "k": "“노력의 낭비라네,"}, {"e": "to keep chopping trees", "k": "계속 나무만 베어내는 것은"}, {"e": "without re-sharpening your axe.", "k": "자네의 도끼날을 다시 갈지 않고."}], "easy": "도끼날을 다시 갈지 않고 나무만 계속 베는 건 힘만 낭비하는 일이라고요.", "gist": "노인의 핵심 조언. 도끼날을 갈지 않고 베기만 하면 노력만 낭비된다는 뜻이다."}, {"n": 15, "ch": [{"e": "<b>Sooner or later<\/b>,", "k": "머잖아,"}, {"e": "you will have to <b>give up<\/b>", "k": "자네는 그만둬야 할 걸세"}, {"e": "because you’ve spent too much energy.”", "k": "자네가 너무 많은 힘을 다 써버렸기 때문에.”"}], "easy": "머지않아 힘을 너무 써 버려서 포기하게 될 거라고요.", "gist": "도끼날을 갈지 않고 일만 하면 결국 기력이 바닥나 포기하게 된다는 경고다."}, {"n": 16, "ch": [{"e": "(C) <b>Highly motivated<\/b> by his words,", "k": "(C) 그의 말에<span class=\"r\">(= 고용인의 칭찬)<\/span> 매우 고취되어,"}, {"e": "the young woodcutter tried harder the next day,", "k": "젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나,"}, {"e": "but (c) he could <b>only<\/b> bring ten trees.", "k": "(c) 그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 고작 열 그루의 나무만 가져다줄 수 있었다."}], "easy": "고용인의 칭찬에 힘을 얻어 다음 날 더 열심히 했는데도, 젊은이는 나무를 열 그루밖에 가져오지 못했어요.", "gist": "(A) 끝의 칭찬을 his words로 받아 이어 간다. 그래서 (A) 다음에 (C)가 온다. 더 열심히 했는데 나무는 15그루에서 10그루로 줄었다."}, {"n": 17, "ch": [{"e": "The third day", "k": "셋째 날"}, {"e": "he tried <b>even harder<\/b>,", "k": "그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 훨씬 더 열심히 노력했으나,"}, {"e": "but he was only able to bring <b>seven<\/b> trees.", "k": "겨우 일곱 그루의 나무만 가져다줄 수 있었다."}], "easy": "셋째 날에는 훨씬 더 열심히 했지만 일곱 그루밖에 못 가져왔어요.", "gist": "노력은 늘었는데 나무는 15그루, 10그루, 7그루로 계속 줄어든다."}, {"n": 18, "ch": [{"e": "<b>Day after day<\/b>,", "k": "날마다,"}, {"e": "he was bringing", "k": "그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 가져다주고 있었다"}, {"e": "<b>less and less<\/b> trees.", "k": "점점 더 적은 나무들을."}], "easy": "날이 갈수록 가져오는 나무가 점점 더 줄어들었어요.", "gist": "나무의 수가 점점 줄었다는 정리 문장이다."}, {"n": 19, "ch": [{"e": "As time went by,", "k": "시간이 지남에 따라,"}, {"e": "(d) he <b>noticed<\/b>", "k": "(d) 그는<span class=\"r\">(= 젊은 나무꾼)<\/span> 알아차렸다"}, {"e": "that even though he worked through his break time", "k": "그가 쉬는 시간까지 일을 하고"}, {"e": "and hardly took a rest,", "k": "거의 휴식을 취하지 않았음에도 불구하고,"}, {"e": "the old woodcutter was cutting down", "k": "그 나이 든 나무꾼이 베어내고 있었다는 것을"}, {"e": "the same amount of trees as him —", "k": "그와<span class=\"r\">(= 젊은 나무꾼)<\/spa function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];

    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

}

사절 (~하는 것)", "what she thinks is a commonplace reference에서 she thinks는 삽입절이고, 안쪽은 what is a commonplace reference (흔한 참고 대상인 것)", "commonplace 흔한, reference 참고 대상"]}, {"t": "기준: she thinks 같은 삽입절은 what의 주어 역할을 건드리지 않는다."}], "sum": "교사가 흔한 소재로 학생의 분수 이해를 도움"}, {"i": "07", "q": "12", "s": "6", "title": "주어 + 관계절 + 보어 to부정사", "eng": "In fact, one of the ways / that African American parents explain<sup>1</sup> pumpkin pie to their children / is to say that it is something like sweet potato pie<sup>2</sup>.", "notes": [["1", "explain", "설명하다"], ["2", "sweet potato pie", "고구마 파이"]], "lit": "사실, 방법들 중 하나는 / 아프리카계 미국인 부모들이 자녀에게 호박 파이를 설명하는 / 그것이 고구마 파이 같은 것이라고 말하는 것이다", "nat": "사실 아프리카계 미국인 부모들이 아이에게 호박 파이를 설명하는 방법 중 하나는, 그것이 고구마 파이 비슷한 것이라고 말해 주는 것이다.", "ana": "주어는 <b>one of the ways</b>이고 동사는 한참 뒤의 <b>is</b>다. 그 사이에 낀 <b>that ~ children</b>은 the ways를 꾸미는 관계사절이라 접어 두고 읽어야 주어와 동사가 붙는다. <b>one of + 복수명사</b>가 주어면 동사는 언제나 단수이므로 are가 아니라 is다. is 뒤의 <b>to say</b>는 주격보어로 쓰인 to부정사의 명사적 용법이다.", "pe": "\u0001In fact\u0002, one of the ways / \u0001that African American parents explain<sup>1</sup> pumpkin pie to their children\u0002 / is to say that it is something \u0001like sweet potato pie<sup>2</sup>\u0002.", "pk": "\u0001사실\u0002, 방법들 중 하나는 / \u0001아프리카계 미국인 부모들이 자녀에게 호박 파이를 설명하는\u0002 / 그것이 \u0001고구마 파이 같은\u0002 것이라고 말하는 것이다", "core": "방법들 중 하나는 그것이 어떤 것이라고 말하는 것이다.", "tags": ["In fact = 부사구: 문장 수식. 주어 one of the ways", "that ~ = 관계절(형용사절): ways 수식 (관계부사 대신 that)", "동사 is + <b>보어</b> to say ~ (명사적 to부정사). that절은 say의 목적어. like ~ pie = 전치사구(형용사구): something 수식"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어가 관계절을 달고 있어 동사 is가 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: one of the ways (방법들 중 하나)", "V: is (be ~이다)", "C: to say (말하는 것. 명사적 용법 to부정사)", "뼈대 = <b>one of the ways is to say</b>", "In fact (사실)는 문장 전체를 꾸미는 부사구"]}, {"t": "<b>that African American parents explain pumpkin pie to their children</b>은 <b>관계절(형용사절)</b>이다. ways를 꾸미며 '아프리카계 미국인 부모들이 자녀에게 호박 파이를 설명하는'이라는 뜻이다. (explain A to B A를 B에게 설명하다)"}, {"t": "보어 to say의 목적어는 <b>that절(명사절)</b>이다. 내용은 '그것이 고구마 파이 같은 것이라고 말하는 것'이다.", "sub": ["S: it (= pumpkin pie, 호박 파이)", "V: is", "C: something like sweet potato pie (고구마 파이 같은 것). like sweet potato pie는 something을 꾸미는 형용사구. sweet potato 고구마"]}, {"t": "함정: that이 두 번 나온다. 앞 that은 ways를 꾸미는 관계절의 that, 뒤 that은 say의 목적어절이다."}], "sum": "호박 파이를 고구마 파이 같은 것이라 설명"}, {"i": "08", "q": "12", "s": "9", "title": "Rather than + 원형 + S+V+C", "eng": "Rather than be engaged<sup>1</sup> actively<sup>2</sup> in the lesson, / he may have been preoccupied<sup>3</sup> with trying to imagine<sup>4</sup> pumpkin pie.", "notes": [["1", "be engaged in", "~에 참여하다"], ["2", "actively", "활동적으로"], ["3", "be preoccupied with", "~에 사로잡히다"], ["4", "imagine", "상상하다"]], "lit": "수업에 활동적으로 참여하기보다는 / 그는 호박 파이를 상상하려고 애쓰는 데 사로잡혀 있었을지도 모른다", "nat": "그 아이는 수업에 적극적으로 참여하는 대신, 호박 파이가 뭔지 그려 보려 애쓰느라 정신이 팔려 있었을지도 모른다.", "ana": "<b>Rather than</b> 뒤에는 뒤 절의 동사 형태에 맞춰 원형 be가 그대로 왔다. ‘~하기보다는’이라는 뜻이다. <b>may have p.p.</b>는 ‘~했을지도 모른다’로 <b>과거 일에 대한 추측</b>을 나타내며, ‘~했어야 했다(should have p.p.)’와 헷갈리면 안 된다. <b>be preoccupied with</b>의 with도 전치사라서 뒤에 동명사 trying이 왔다.", "pe": "\u0001Rather than be engaged<sup>1</sup> actively<sup>2</sup> in the lesson\u0002, / he may have been preoccupied<sup>3</sup> \u0001with trying to imagine<sup>4</sup> pumpkin pie\u0002.", "pk": "\u0001수업에 활동적으로 참여하기보다는\u0002 / 그는 \u0001호박 파이를 상상하려고 애쓰는 데\u0002 사로잡혀 있었을지도 모른다", "core": "그는 사로잡혀 있었을지도 모른다.", "tags": ["Rather than ~ = 부사구(대조): 주절 수식", "주어 he + 동사 may have been + 보어 preoccupied (2형식). with ~ = 전치사구(부사구): preoccupied 수식 [기준: 문형 기준]"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 앞에 대조 표현이 붙고 동사에 조동사 완료형이 쓰였다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: he (그)", "V: may have been (be의 may have p.p., ~였을지도 모른다)", "C: preoccupied (사로잡혀 있는. preoccupy 사로잡다의 과거분사형 형용사)", "뼈대 = <b>he may have been preoccupied</b>"]}, {"t": "맨 앞 <b>Rather than be engaged actively in the lesson</b>은 <b>대조 부사구</b>이다. 주절을 꾸미며 '수업에 활동적으로 참여하기보다는'이라는 뜻이다. Rather than 뒤에는 동사원형 be가 온다. (engaged in ~에 참여한, actively 활동적으로, lesson 수업)"}, {"t": "<b>with trying to imagine pumpkin pie</b>는 <b>전치사구(부사구)</b>이다. preoccupied를 꾸미며 '호박 파이를 상상하려고 애쓰는 데'라는 뜻이다. with 뒤 trying은 동명사이다. be preoccupied with는 한 짝이라 거의 필수에 가까운 부사구이다. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준)."}, {"t": "함정: 완료형 may have been은 과거에 대한 추측이다. '~였을지도 모른다'로 읽는다."}], "sum": "수업보다 호박 파이를 상상하느라 정신이 팔렸을지도"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2018년 11월 31번", "ans": "④", "tr": [["1", "상당히 많은 과학자와 예술가가 창의성의 빈칸에 주목해 왔다."], ["2", "1980년에 열린 제16차 노벨 학회에서 과학자, 음악가, 철학자 모두가 Freeman Dyson의 말을 빌리자면 이렇게 동의했다. “당신이 창조와 실행에 관해 이야기하고 있는 한, 과학과 예술 사이의 유사성은 매우 크다."], ["3", "창조는 확실히 매우 유사하다."], ["4", "실행의 장인 정신이 주는 심미적 쾌감 또한 과학에서 매우 강하다.”"], ["5", "몇 년 뒤 또 다른 여러 학문 분야가 함께한 학회에서, 물리학자 Murray Gell-Mann은 “아이디어가 어디서 나오는지에 대해서는 모두가 같은 생각”이라는 사실을 알게 되었다."], ["6", "“약 10년 전 우리는 이곳에서 화가 몇 명, 시인 한 명, 작가 두어 명, 그리고 물리학자들이 함께한 세미나를 열었다."], ["7", "모두가 그것이 어떻게 작동하는지에 동의한다."], ["8", "이 사람들은 모두, 예술적인 작업을 하고 있든 과학적인 작업을 하고 있든, 문제를 해결하려 애쓰고 있다.”"]], "evh": "8번 문장", "ev": [{"en": true, "h": "All of these people, whether they are doing artistic work or scientific work, are trying to solve a problem."}, {"en": false, "h": "빈칸은 창의성의 무엇에 주목했는지를 묻는다. 문장 2의 <b>the analogies between science and art are very good</b>(과학과 예술의 유사성이 크다)과 문장 8의 <b>whether ~ artistic ~ or scientific ~, are trying to solve a problem</b>(분야를 가리지 않고 똑같다)이 한 방향을 가리킨다. 서로 다른 분야에서 똑같이 나타난다는 뜻이므로 빈칸은 <b>보편성(universality)</b>이다."}], "opts": [{"n": "①", "t": "형식성", "a": false, "x": true, "trap": false, "e": "formality는 격식·형식을 뜻한다. 창의성이 형식적이라는 말은 지문 어디에도 없다."}, {"n": "②", "t": "객관성", "a": false, "x": true, "trap": true, "e": "objectivity는 과학의 특징으로는 그럴듯하지만, 글이 강조하는 것은 과학과 예술의 <b>공통점</b>이지 과학의 성질이 아니다."}, {"n": "③", "t": "복잡성", "a": false, "x": true, "trap": false, "e": "창의성이 복잡하다는 논의는 없다. 오히려 ‘모두가 동의한다’는 단순한 합의가 반복된다."}, {"n": "④", "t": "보편성", "a": true, "x": false, "trap": false, "e": "과학·음악·철학·미술·시·물리학까지 분야를 가리지 않고 같은 결론이 나온다는 것이 글 전체의 뼈대다."}, {"n": "⑤", "t": "불확실성", "a": false, "x": true, "trap": false, "e": "uncertainty는 ‘모두가 동의한다(everybody agrees)’가 두 번이나 반복되는 이 글과 정반대다."}], "w": [["a good many", "상당히 많은"], ["universality", "보편성, 일반성"], ["conference", "학회, 회의"], ["hold", "개최하다"], ["quote", "인용하다"], ["analogy", "유사성, 비유"], ["as long as", "~하는 한"], ["performance", "실행, 행위"], ["analogous", "유사한"], ["aesthetic", "심미적인"], ["craftsmanship", "장인 정신, 솜씨"], ["multidisciplinary", "여러 학문 분야에 걸친"], ["physicist", "물리학자"], ["agree on", "~에 대해 동의하다"], ["whether", "~이든 (아니든)"]]}, {"q": "08", "type": "글의 순서", "src": "2023년 9월 37번", "ans": "③", "tr": [["1", "【주어진 글】 건축가들은 컴퓨터가 ‘창의적’일 수 없기 때문에 기계는 결코 혁신적이거나 인상적인 건물을 설계할 수 없다고 말할지도 모른다."], ["2", "하지만 함부르크의 새 콘서트홀 Elbphilharmonie를 생각해 보라. 이 건물에는 1만 개의 음향 패널이 서로 맞물려 구성된, 놀랍도록 아름다운 강당이 들어 있다."], ["3", "【B】 그것은 오직 인간만이, 그것도 놀랍도록 세련된 창의적 감수성을 지닌 인간만이 그토록 미적으로 인상적인 것을 설계할 수 있었으리라고 본능적으로 생각하게 만드는 종류의 공간이다."], ["4", "그러나 사실 그 강당은 ‘파라메트릭 디자인’이라고 알려진 기법을 사용해 알고리즘으로 설계되었다."], ["5", "【C】 건축가들은 그 시스템에 일련의 기준을 주었고, 시스템은 건축가들이 고를 수 있는 일련의 가능한 설계안을 만들어 냈다."], ["6", "비슷한 소프트웨어가 경량 자전거 프레임과 더 튼튼한 의자를 설계하는 데에도, 그 밖의 많은 것에도 사용되어 왔다."], ["7", "【A】 이런 시스템들은 ‘창의적으로’ 행동하고 있는 것일까?"], ["8", "아니다. 그것들은 인간과는 매우 다른 방식으로 작동하면서, 다양한 가능한 설계안을 무턱대고 만들어 내는 데 엄청난 처리 능력을 쓰고 있을 뿐이다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "It is the sort of space that makes one instinctively think that only a human being ~ could design something so aesthetically impressive."}, {"en": false, "h": "주어진 글의 마지막이 <b>Elbphilharmonie의 강당</b>이므로, 그 강당을 <b>It</b>으로 받는 (B)가 먼저 온다. (B) 끝에서 ‘알고리즘으로 설계되었다’고 밝히면, (C)가 <b>the system</b>이라는 정관사로 그 알고리즘 시스템을 받아 어떻게 작동했는지 설명한다. (C)에서 시스템이 복수로 늘어나자 (A)가 <b>these systems</b>로 받아 ‘그래서 창의적이냐’고 되묻는다. 즉 It → the system → these systems라는 <b>지시어 사슬</b>이 순서를 결정한다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)의 these systems가 가리킬 시스템이 아직 등장하지 않았다. 주어진 글에는 systems라는 말이 없다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": true, "e": "(B) 끝에서 기법 이름만 나왔을 뿐 systems가 복수로 나온 적이 없어 (A)의 these systems가 뜬금없어진다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": true, "x": false, "trap": false, "e": "강당(It) → 그 시스템(the system) → 그 시스템들(these systems)로 지시어가 한 칸씩 넓어진다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": false, "e": "(C)의 the system이 받을 대상이 주어진 글에 없다. 주어진 글은 아직 알고리즘 이야기를 꺼내지도 않았다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": false, "x": true, "trap": false, "e": "같은 이유로 (C)가 첫 순서에 올 수 없다. 또 (B)의 Yet ~ designed algorithmically가 (C)보다 뒤에 오면 정보가 뒤집힌다."}], "w": [["innovative", "혁신적인"], ["impressive", "인상적인"], ["auditorium", "강당, 관객석"], ["composed of", "~으로 구성된"], ["interlocking", "서로 맞물리는"], ["acoustic", "음향의"], ["instinctively", "본능적으로"], ["refined", "세련된"], ["sensibility", "감수성, 감각"], ["at that", "그것도, 게다가"], ["aesthetically", "미적으로"], ["algorithmically", "알고리즘으로"], ["criteria", "기준"], ["generate", "만들어 내다"], ["sturdy", "튼튼한"], ["among much else", "다른 많은 것 중에서"], ["blindly", "무턱대고, 맹목적으로"], ["varied", "다양한"]]}, {"q": "09", "type": "장문 순서 (43번)", "src": "2018년 9월 43번", "ans": "②", "tr": [["1", "【A】 옛날에 정글에서 나무를 베는 두 나무꾼이 있었다. 젊고 힘센 나무꾼과 나이 든 나무꾼이었다."], ["2", "젊은 나무꾼은 무척 부지런했다. 첫날, (a) 그는 쉬는 시간에도 일했고 노인이 먹고 마시느라 여러 번 쉬면서 시간을 낭비한다고 불평했다."], ["3", "그날 젊은 나무꾼은 고용주에게 나무 15그루를 가져다주었다. “훌륭해!” 고용주가 말했다. “계속 잘해 줘!”"], ["4", "【C】 그 말에 크게 고무되어 젊은 나무꾼은 다음 날 더 열심히 했지만, (c) 그는 겨우 열 그루밖에 가져오지 못했다."], ["5", "셋째 날에는 더 열심히 했지만 일곱 그루밖에 가져오지 못했다. 날이 갈수록 그는 점점 더 적은 나무를 가져왔다."], ["6", "시간이 지나면서 (d) 그는 자기가 쉬는 시간에도 일하고 거의 쉬지 않는데도, 나이 든 나무꾼이 자기와 같은 양의 나무를, 때로는 더 많이 베고 있다는 것을 알아차렸다."], ["7", "【B】 그것은 마치 노인도 (b) 그처럼 쉬는 시간에 일하는 것만 같았다. 그래서 젊은 나무꾼은 다음 날 더 열심히 하기로 했다."], ["8", "안타깝게도 결과는 오히려 더 나빴다. “내가 힘이 빠지고 있는 게 틀림없어.” 젊은이는 생각했다."], ["9", "어느 날 노인이 쉬는 시간에 그에게 한잔하자고 청했다. 젊은이는 거절하며 여유 시간이 없다고 말했다."], ["10", "그러자 노인은 미소 지으며 말했다. “도끼날을 다시 갈지도 않고 계속 나무만 베어 대는 건 힘만 낭비하는 짓이야. 조만간 기력을 너무 써서 포기하게 될 걸세.”"], ["11", "【D】 갑자기 젊은 나무꾼은, 쉬는 시간에 노인이 한잔하는 동안 도끼날도 함께 갈고 있었다는 것을, 그리고 자기는 한 번도 그러지 않았다는 것을 깨달았다."], ["12", "그것이 (e) 그가 더 짧은 시간에 더 많이 벨 수 있었던 방법이었다."], ["13", "노인은 우리 모두에게 쉬고, 생각하고 명상하고, 배우고 성장할 시간이 필요하다고 말했다. ‘도끼’를 갈 시간을 내지 않으면 우리는 무뎌지고 효율을 잃게 된다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "Highly motivated by his words, the young woodcutter tried harder the next day, but (c) he could only bring ten trees."}, {"en": false, "h": "(A)의 마지막은 고용주의 <b>칭찬(“Fantastic! Keep up the great work!”)</b>이다. (C)의 첫 문장 <b>Highly motivated by his words</b>가 바로 그 말을 받으므로 (A) 다음은 (C)다. (C) 끝에서 ‘노인이 나보다 더 벤다’는 관찰이 나오면, (B)의 첫 문장 <b>It was as if the old man worked through the break time just as he did</b>가 그 관찰을 그대로 이어받는다. (B) 끝의 도끼 이야기가 (D)의 <b>Suddenly ~ realized</b>로 해결되며 마무리된다."}], "opts": [{"n": "①", "t": "(B) – (D) – (C)", "a": false, "x": true, "trap": false, "e": "(B)의 It was as if ~가 받을 관찰((C)의 내용)이 아직 나오지 않았다."}, {"n": "②", "t": "(C) – (B) – (D)", "a": true, "x": false, "trap": false, "e": "칭찬(A끝) → 고무됨(C시작), 관찰(C끝) → as if(B시작), 도끼 조언(B끝) → 깨달음(D시작)으로 세 지점이 모두 맞물린다."}, {"n": "③", "t": "(C) – (D) – (B)", "a": false, "x": true, "trap": false, "e": "(D)에서 이미 도끼날의 비밀을 깨달아 버리면, (B)에서 노인이 그 비밀을 알려 주는 장면이 뒤로 밀려 이야기가 거꾸로 간다."}, {"n": "④", "t": "(D) – (B) – (C)", "a": false, "x": true, "trap": false, "e": "(D)의 Suddenly ~ realized는 결말이라 (A) 바로 뒤에 올 수 없다. 아직 아무 일도 벌어지지 않았다."}, {"n": "⑤", "t": "(D) – (C) – (B)", "a": false, "x": true, "trap": true, "e": "같은 이유로 (D)가 먼저 올 수 없다."}], "w": [["woodcutter", "나무꾼"], ["hardworking", "부지런한"], ["break time", "쉬는 시간"], ["complain", "불평하다"], ["keep up", "계속 유지하다"], ["highly motivated", "크게 고무된"], ["day after day", "날마다"], ["as time went by", "시간이 지남에 따라"], ["hardly", "거의 ~하지 않다"], ["amount", "양"], ["as if", "마치 ~인 것처럼"], ["invite A for a drink", "A에게 한잔하자고 청하다"], ["refuse", "거절하다"], ["waste of effort", "노력의 낭비"], ["re-sharpen", "다시 갈다"], ["sooner or later", "조만간"], ["meditate", "명상하다"], ["dull", "무딘"], ["effectiveness", "효율성, 유효성"]]}, {"q": "10", "type": "장문 지칭 (44번)", "src": "2018년 9월 44번", "ans": "⑤", "tr": [["1", "(a) he — 첫날 쉬는 시간에도 일하며 노인이 시간을 낭비한다고 불평한 사람 → 젊은 나무꾼"], ["2", "(b) he — ‘노인도 그처럼 쉬는 시간에 일하는 것 같았다’에서 비교 대상 → 젊은 나무꾼"], ["3", "(c) he — 더 열심히 했지만 열 그루밖에 못 가져온 사람 → 젊은 나무꾼"], ["4", "(d) he — 쉬지 않고 일했는데도 노인이 자기만큼 벤다는 것을 알아차린 사람 → 젊은 나무꾼"], ["5", "(e) he — 더 짧은 시간에 더 많이 벨 수 있었던 사람 → 나이 든 나무꾼"]], "evh": "12번 문장", "ev": [{"en": true, "h": "That's how (e) he could chop more than the young man in less time!"}, {"en": false, "h": "같은 문장 안에 <b>than the young man</b>이라는 비교 대상이 그대로 들어 있다. 자기 자신과 자기를 비교할 수는 없으므로 (e)는 the young man이 아니다. 바로 앞 문장에서 쉬는 시간에 도끼날을 갈고 있던 사람은 <b>the old man</b>이므로 (e)는 노인이다. 지칭 문제는 밑줄 문장 안의 <b>비교 대상·대조 표현</b>부터 확인하면 대부분 한 번에 갈린다."}], "opts": [{"n": "①", "t": "(a)", "a": false, "x": true, "trap": false, "e": "쉬는 시간에도 일하고 노인을 불평한 사람이므로 젊은 나무꾼이다."}, {"n": "②", "t": "(b)", "a": false, "x": true, "trap": false, "e": "‘노인이 마치 그처럼 일했다’에서 비교 기준이 되는 사람이므로 젊은 나무꾼이다."}, {"n": "③", "t": "(c)", "a": false, "x": true, "trap": false, "e": "더 열심히 했는데 열 그루로 줄어든 사람이므로 젊은 나무꾼이다."}, {"n": "④", "t": "(d)", "a": false, "x": true, "trap": true, "e": "쉬지 않고 일했는데도 노인이 같은 양을 벤다는 것을 알아차린 쪽이므로 젊은 나무꾼이다."}, {"n": "⑤", "t": "(e)", "a": true, "x": false, "trap": false, "e": "than the young man이라는 비교 대상이 문장 안에 있으므로 (e)는 노인이다."}], "w": [["chop", "(나무를) 베다, 자르다"], ["in less time", "더 짧은 시간에"], ["as if", "마치 ~인 것처럼"], ["notice", "알아차리다"], ["hardly take a rest", "거의 쉬지 않다"], ["the same amount as", "~와 같은 양의"]]}, {"q": "11", "type": "장문 내용 불일치 (45번)", "src": "2018년 9월 45번", "ans": "④", "tr": [["1", "① 첫날 그는 쉬는 시간에도 일했다. → (A) he worked through his break time"], ["2", "② 첫날 15그루를 가져왔다. → (A) brought 15 trees to their boss"], ["3", "③ 쉬는 시간에 한잔하자는 노인의 초대를 거절했다. → (B) The young man refused"], ["4", "④ 가져온 나무 수가 점점 늘어났다. → (C) bringing less and less trees (점점 줄어들었다)"], ["5", "⑤ 노인이 쉬는 시간에 도끼날을 갈고 있었다는 사실을 깨달았다. → (D) he was also re-sharpening his axe"]], "evh": "5번 문장", "ev": [{"en": true, "h": "Day after day, he was bringing less and less trees."}, {"en": false, "h": "선지 ④는 ‘점점 늘어났다’이지만 본문은 <b>less and less</b>, 즉 <b>점점 줄어들었다</b>이다. 실   app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
