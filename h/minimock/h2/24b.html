적 감수성을 가진 인간만이 —</div></div><div class=\"rc\"><div class=\"e\">could design something so aesthetically impressive.</div><div class=\"k\">그토록 미학적으로 인상적인 것을 디자인할 수 있다고.</div></div><div class=\"rnat\">(B) 그것은 오직 인간만이, 그리고 그것도 놀랍도록 세련된 창의적 감수성을 가진 인간만이 그토록 미학적으로 인상적인 것을 디자인할 수 있다고 본능적으로 생각하게 만드는 종류의 공간이다.</div><div class=\"rst\"><b>그것</b>(It = 그 강당)을 보면 누구나 “감각이 엄청 뛰어난 사람만 이런 걸 만들 수 있어” 하고 생각하게 돼요. = 지문 5번이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Yet the auditorium was, in fact,</div><div class=\"k\">하지만 그 강당은 실제로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">designed algorithmically</span>,</div><div class=\"k\"><span class=\"cw\">알고리즘으로 디자인되었다</span>,</div></div><div class=\"rc\"><div class=\"e\">using a technique known as “parametric design.”</div><div class=\"k\">‘파라메트릭 디자인’이라고 알려진 기술을 사용하여.</div></div><div class=\"rnat\">하지만 실제로 그 강당은 ‘파라메트릭 디자인’이라고 알려진 기술을 사용하여 알고리즘으로 디자인되었다.</div><div class=\"rst\"><b>하지만</b>(Yet) 사실 그 강당은 컴퓨터 프로그램이 <b>알고리즘으로</b> 디자인한 거예요. 이름하여 ‘파라메트릭 디자인’이에요. = 지문 6번이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C) The architects gave</div><div class=\"k\">(C) 건축가들은 부여했다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the system</span> a set of criteria,</div><div class=\"k\"><span class=\"cw\">그 방식(시스템)에</span> 일련의 기준을,</div></div><div class=\"rc\"><div class=\"e\">and it generated</div><div class=\"k\">그리고 그것은(= 그 시스템) 만들어 냈다</div></div><div class=\"rc\"><div class=\"e\">a set of possible designs</div><div class=\"k\">일련의 가능한 디자인을</div></div><div class=\"rc\"><div class=\"e\">for the architects to choose from.</div><div class=\"k\">건축가들이 선택할 수 있는.</div></div><div class=\"rnat\">(C) 건축가들은 그 방식(시스템)에 일련의 기준을 부여했고, 그것은 건축가들이 선택할 수 있는 일련의 가능한 디자인을 만들어 냈다.</div><div class=\"rst\">건축가들이 <b>그 프로그램</b>(the system)에 조건을 넣어 주자, 프로그램이 여러 안을 쭉 내놓고 건축가들은 그중에서 골랐어요. = 지문 7번이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">8번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Similar software</span></div><div class=\"k\"><span class=\"cw\">유사한 소프트웨어가</span></div></div><div class=\"rc\"><div class=\"e\">has been used to design</div><div class=\"k\">디자인하는 데 사용되었다</div></div><div class=\"rc\"><div class=\"e\">lightweight bicycle frames and sturdier chairs,</div><div class=\"k\">경량 자전거 프레임과 더 튼튼한 의자를,</div></div><div class=\"rc\"><div class=\"e\">among much else.</div><div class=\"k\">다른 많은 것들 중에서.</div></div><div class=\"rnat\">유사한 소프트웨어가 다른 많은 것들 중에서 경량 자전거 프레임과 더 튼튼한 의자를 디자인하는 데 사용되었다.</div><div class=\"rst\"><b>비슷한 프로그램</b>(Similar software)으로 가벼운 자전거 뼈대나 더 튼튼한 의자도 만들었대요. 이제 프로그램이 여러 개가 됐어요. = 지문 8번이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"innovative\" data-m=\"혁신적인\"><b>innovative</b>혁신적인</button><button type=\"button\" class=\"wdb\" data-w=\"auditorium\" data-m=\"강당, 관객석\"><b>auditorium</b>강당, 관객석</button><button type=\"button\" class=\"wdb\" data-w=\"instinctively\" data-m=\"본능적으로\"><b>instinctively</b>본능적으로</button><button type=\"button\" class=\"wdb\" data-w=\"algorithmically\" data-m=\"알고리즘으로\"><b>algorithmically</b>알고리즘으로</button><button type=\"button\" class=\"wdb\" data-w=\"criteria\" data-m=\"기준\"><b>criteria</b>기준</button><button type=\"button\" class=\"wdb\" data-w=\"generate\" data-m=\"만들어 내다\"><b>generate</b>만들어 내다</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기 순서 문제는 <b>앞 문단 끝 장면을 이어받는 첫 문장</b>을 찾으세요. <b>his words</b>(그의 말) = 칭찬, <b>as if</b>(마치 ~처럼) = 노인도 나만큼 벤다, <b>Suddenly realized</b>(불현듯 깨달았다) = 도끼 충고의 답이에요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 (A) 끝</span><div class=\"en\">“<mark>Keep up the great work!</mark>”</div><p class=\"ko\">“<mark>계속 열심히 해 주게나!</mark>”</p></div><div class=\"ck-via\"><i>▼</i><span>his words(그의 말) = 바로 앞 사장님의 칭찬</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리</span><div class=\"en\"><mark>Highly motivated by his words</mark>, the young woodcutter tried harder the next day, but (c) he could only bring ten trees.</div><p class=\"ko\"><mark>그의 말에(= 고용인의 칭찬) 매우 고취되어</mark>, 젊은 나무꾼은 다음 날 더욱 열심히 노력했으나, 고작 열 그루만 가져다줄 수 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>15 → 10 → 7그루로 줄더니, 노인과 비교하는 장면으로 끝나요</span></div><div class=\"ck-step\"><span class=\"lab\">(C) 끝</span><div class=\"en\">… the old woodcutter was cutting down <mark>the same amount of trees as him</mark> — and sometimes chopped down even more.</div><p class=\"ko\">… 그 나이 든 나무꾼이 <mark>그와(= 젊은 나무꾼) 똑같은 양의 나무들을</mark> 베고, 때로는 더 많이 베고 있다는 것을</p></div><div class=\"ck-via\"><i>▼</i><span>“노인이 나만큼 벤다” → as if(마치) 노인도 쉬지 않고 일한 것 같았다</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 두 번째 고리</span><div class=\"en\"><mark>It was as if</mark> the old man worked through the break time just as (b) he did.</div><p class=\"ko\">마치 그가 그러했듯이 노인도 쉬는 시간까지 일을 하는 <mark>것만 같았다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>(B) 끝 14번 “도끼날을 갈지 않고” 충고 → (D)에서 그 뜻을 깨달음</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 세 번째 고리</span><div class=\"en\"><mark>Suddenly the young woodcutter realized</mark> that … he was also re-sharpening his axe …</div><p class=\"ko\"><mark>불현듯 그 젊은 나무꾼은 깨달았다</mark> … 노인이 도끼날도 갈고 있었다는 것을</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(C) – (B) – (D)<small>칭찬 → 줄어드는 나무 → 도끼 충고 → 깨달음, 고리가 다 이어져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(C) 끝에서 노인이 더 벤다는 걸 보고 바로 (D)의 깨달음으로 가고 싶지만, 14번의 도끼날 충고를 듣기 전이라 깨달을 실마리가 없어요. 깨달은 뒤 (B)에서 다시 “힘이 빠지나 봐” 하는 것도 어색해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(B)의 It was as if(마치 ~인 것 같았다)는 “노인이 나만큼 벤다”는 관찰 뒤에 와야 해요. 칭찬 바로 뒤에는 그 관찰이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">칭찬 바로 뒤에 Suddenly realized(불현듯 깨달았다)가 오면 무엇 때문에 깨달았는지 앞 장면이 하나도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(C)의 his words(그의 말)는 사장님의 칭찬인데, (D) 끝은 노인의 교훈이라 칭찬과 이어지지 않아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">(A) Once, there were two woodcutters</div><div class=\"k\">(A) 옛날에, 두 명의 나무꾼이 있었다</div></div><div class=\"rc\"><div class=\"e\">— a young, strong one</div><div class=\"k\">— 젊고 힘이 센 나무꾼과</div></div><div class=\"rc\"><div class=\"e\">and an old one —</div><div class=\"k\">나이 든 나무꾼(이었다) —</div></div><div class=\"rc\"><div class=\"e\">cutting down trees in a jungle.</div><div class=\"k\">정글에서 나무를 베는.</div></div><div class=\"rnat\">(A) 옛날에, 정글에서 나무를 베는 두 명의 나무꾼이 있었다 — 젊고 힘이 센 나무꾼과 나이 든 나무꾼(이었다).</div><div class=\"rst\">나무꾼 둘이 있어요. 젊고 힘센 나무꾼과 나이 든 나무꾼이에요. 우리 반으로 치면 힘이 넘치는 친구와 차분한 선배 같아요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">The young man</div><div class=\"k\">그 젊은이는</div></div><div class=\"rc\"><div class=\"e\">was very hardworking.</div><div class=\"k\">매우 부지런했다.</div></div><div class=\"rnat\">그 젊은이는 매우 부지런했다.</div><div class=\"rst\">젊은 나무꾼은 정말 <b>부지런해요</b>(hardworking). 쉬는 시간에도 문제집만 푸는 친구 같은 사람이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">On his first day,</div><div class=\"k\">그가 일을 시작한 첫째 날,</div></div><div class=\"rc\"><div class=\"e\">(a) he worked through his break time</div><div class=\"k\">(a) 그는(= 젊은 나무꾼) 쉬는 시간까지 일을 했고</div></div><div class=\"rc\"><div class=\"e\">and complained</div><div class=\"k\">불평했다</div></div><div class=\"rc\"><div class=\"e\">that the old man was wasting time,</div><div class=\"k\">그 노인이 시간을 낭비하고 있다고,</div></div><div class=\"rc\"><div class=\"e\">taking several breaks to eat and drink.</div><div class=\"k\">먹고 마시려고 수차례 휴식을 취하며.</div></div><div class=\"rnat\">그의 (그가 일을 시작한) 첫째 날, (a) 그(젊은 나무꾼)는 그의 쉬는 시간까지 일을 했고, 그 노인이 먹고 마시려고 수차례 휴식을 취하며 시간을 낭비하고 있다고 불평했다.</div><div class=\"rst\">첫날 젊은 나무꾼은 쉬는 시간에도 일하면서, 먹고 마시며 쉬는 노인을 보고 “시간 낭비야” 하고 투덜대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">That day,</div><div class=\"k\">그 날,</div></div><div class=\"rc\"><div class=\"e\">the young woodcutter brought 15 trees</div><div class=\"k\">그 젊은 나무꾼은 열다섯 그루의 나무를 가져다주었다</div></div><div class=\"rc\"><div class=\"e\">to their boss.</div><div class=\"k\">그들의 고용인에게.</div></div><div class=\"rnat\">그 날, 그 젊은 나무꾼은 그의 고용인에게 열다섯 그루의 나무를 가져다주었다.</div><div class=\"rst\">그날 젊은 나무꾼은 나무 <b>15그루</b>를 사장님께 가져가요. 첫날 성적이 아주 좋았던 거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">“Fantastic!”</div><div class=\"k\">“훌륭하군!”</div></div><div class=\"rc\"><div class=\"e\">the boss said.</div><div class=\"k\">고용인이 말했다.</div></div><div class=\"rnat\">“훌륭하군!” 고용인이 말했다.</div><div class=\"rst\">사장님이 “<b>훌륭하군!</b>” 하고 칭찬해요. 선생님께 칭찬받은 기분이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc ckc\"><div class=\"e\">“<span class=\"cw\">Keep up the great work!</span>”</div><div class=\"k\"><span class=\"cw\">“계속 열심히 해 주게나!”</span></div></div><div class=\"rnat\">“계속 열심히 해 주게나!”</div><div class=\"rst\">“<b>계속 열심히 해 주게나!</b>” 이 칭찬이 (C)의 his words(그의 말)로 이어져요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">It was as if</span></div><div class=\"k\">(B) <span class=\"cw\">~인 것만 같았다</span></div></div><div class=\"rc\"><div class=\"e\">the old man worked through the break time</div><div class=\"k\">그 노인이 쉬는 시간까지 일을 하는</div></div><div class=\"rc\"><div class=\"e\">just as (b) he did.</div><div class=\"k\">마치 바로 (b) 그가(= 젊은 나무꾼) 그러했듯이.</div></div><div class=\"rnat\">(B) 마치 바로 (b) 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다.</div><div class=\"rst\"><b>마치</b>(as if) 노인도 자기처럼 쉬는 시간 없이 일한 것 같은 결과였어요. (C) 끝의 그 관찰을 그대로 받아요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">So,</div><div class=\"k\">그래서,</div></div><div class=\"rc\"><div class=\"e\">the young woodcutter decided</div><div class=\"k\">그 젊은 나무꾼은 결심했다</div></div><div class=\"rc\"><div class=\"e\">to work harder the next day.</div><div class=\"k\">그 다음 날 더 열심히 일하기로.</div></div><div class=\"rnat\">그래서, 그 젊은 나무꾼은 그 다음 날 더 열심히 일하기로 결심했다.</div><div class=\"rst\"><b>그래서</b>(So) 젊은 나무꾼은 다음 날 더 열심히 하기로 마음먹어요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Unfortunately,</div><div class=\"k\">유감스럽게도,</div></div><div class=\"rc\"><div class=\"e\">the results were even worse.</div><div class=\"k\">그 결과는 훨씬 더 심각했다(참혹했다).</div></div><div class=\"rnat\">유감스럽게도, 그 결과는 훨씬 더 심각했다(참혹했다).</div><div class=\"rst\">안타깝게도 결과는 훨씬 더 나빠졌어요. 더 열심히 할수록 더 못하는 거예요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">10번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">“I must be losing my strength,”</div><div class=\"k\">“내가 힘이 (점점) 빠지고 있는 것이 틀림없어,”</div></div><div class=\"rc\"><div class=\"e\">the young man thought.</div><div class=\"k\">젊은이는 생각했다.</div></div><div class=\"rnat\">“내가 힘이 (점점) 빠지고 있는 것이 틀림없어.” 젊은이는 생각했다.</div><div class=\"rst\">“내가 힘이 빠지고 있나 봐.” 젊은 나무꾼은 이유를 자기 체력 탓으로만 생각해요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">11번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">One day,</div><div class=\"k\">어느 날,</div></div><div class=\"rc\"><div class=\"e\">the old man invited him</div><div class=\"k\">노인은 그를(= 젊은 나무꾼) 불렀다</div></div><div class=\"rc\"><div class=\"e\">for a drink during the break time.</div><div class=\"k\">쉬는 시간 동안 (마실 것이라도) 한 잔 하자며.</div></div><div class=\"rnat\">어느 날, 노인은 쉬는 시간 동안 (마실 것이라도) 한 잔 하자며 그(젊은 나무꾼)를 불렀다.</div><div class=\"rst\">어느 날 노인이 쉬는 시간에 “한잔하세” 하고 젊은 나무꾼을 불러요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">12번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">The young man refused</div><div class=\"k\">젊은이는 거절했고,</div></div><div class=\"rc\"><div class=\"e\">and said he had no extra time.</div><div class=\"k\">그가(= 젊은 나무꾼) 여유 시간이 없다고 말했다.</div></div><div class=\"rnat\">젊은이는 거절했고, 그가 여유 시간이 없다고 말했다.</div><div class=\"rst\">젊은 나무꾼은 “쉴 시간 없어요” 하고 <b>거절해요</b>(refused).</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">13번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Then,</div><div class=\"k\">그러자,</div></div><div class=\"rc\"><div class=\"e\">the old man smiled and said to him,</div><div class=\"k\">노인이 미소 지으며 그에게(= 젊은 나무꾼) 말했다.</div></div><div class=\"rnat\">그러자, 노인이 미소 지으며 그에게 말했다.</div><div class=\"rst\">그러자 노인이 웃으며 젊은 나무꾼에게 말을 꺼내요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">14번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">“It is a waste of effort</div><div class=\"k\">“노력의 낭비라네,</div></div><div class=\"rc\"><div class=\"e\">to keep chopping trees</div><div class=\"k\">계속 나무만 베어내는 것은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">without re-sharpening your axe</span>.</div><div class=\"k\"><span class=\"cw\">자네의 도끼날을 다시 갈지 않고.</span></div></div><div class=\"rnat\">“자네의 도끼날을 다시 갈지 않고 계속 나무만 베어내는 것은 노력의 낭비라네(노력을 낭비하는 거라네).</div><div class=\"rst\">“<b>도끼날을 갈지 않고</b> 계속 나무만 베는 건 힘 낭비라네.” 안 깎은 무딘 연필로 계속 쓰는 것과 같아요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">15번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Sooner or later,</div><div class=\"k\">머잖아,</div></div><div class=\"rc\"><div class=\"e\">you will have to give up</div><div class=\"k\">자네는 그만둬야 할 걸세</div></div><div class=\"rc\"><div class=\"e\">because you’ve spent too much energy.”</div><div class=\"k\">자네가 너무 많은 힘을 다 써버렸기 때문에.”</div></div><div class=\"rnat\">자네가 너무 많은 힘을 다 써버렸기 때문에(기력을 너무 많이 소진했기 때문에), 머잖아 자네는 (나무 베기를) 그만둬야 할게야.”</div><div class=\"rst\">“머잖아 힘을 다 써서 그만둬야 할 걸세.” 이 도끼 얘기가 (D)의 깨달음으로 이어져요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">16번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">Highly motivated by his words</span>,</div><div class=\"k\">(C) <span class=\"cw\">그의 말에(= 고용인의 칭찬) 매우 고취되어</span>,</div></div><div class=\"rc\"><div class=\"e\">the young woodcutter tried harder the next day,</div><div class=\"k\">젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나,</div></div><div class=\"rc\"><div class=\"e\">but (c) he could only bring ten trees.</div><div class=\"k\">(c) 그는(= 젊은 나무꾼) 고작 열 그루의 나무만 가져다줄 수 있었다.</div></div><div class=\"rnat\">(C) 그(고용인)의 말(칭찬)에 매우 고취되어(자극을 받아), 젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나, (c) 그(젊은 나무꾼)는 고작 열 그루의 나무들만 (고용인에게) 가져다줄 수 있었다.</div><div class=\"rst\">그 <b>말에 신이 나서</b>(Highly motivated by his words) 다음 날 더 열심히 했는데, 고작 <b>10그루</b>밖에 못 가져가요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">17번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">The third day</div><div class=\"k\">셋째 날</div></div><div class=\"rc\"><div class=\"e\">he tried even harder,</div><div class=\"k\">그는(= 젊은 나무꾼) 훨씬 더 열심히 노력했으나,</div></div><div class=\"rc\"><div class=\"e\">but he was only able to bring seven trees.</div><div class=\"k\">겨우 일곱 그루의 나무만 가져다줄 수 있었다.</div></div><div class=\"rnat\">세 번째 날 그는 훨씬 더 열심히 노력했으나, 그는 겨우 일곱 그루의 나무들만 가져다줄 수 있었다.</div><div class=\"rst\">셋째 날엔 훨씬 더 열심히 했는데도 <b>7그루</b>뿐이에요. 노력할수록 숫자가 줄어요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">18번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Day after day,</div><div class=\"k\">날마다,</div></div><div class=\"rc\"><div class=\"e\">he was bringing</div><div class=\"k\">그는(= 젊은 나무꾼) 가져다주고 있었다</div></div><div class=\"rc\"><div class=\"e\">less and less trees.</div><div class=\"k\">점점 더 적은 나무들을.</div></div><div class=\"rnat\">날마다, 그는 점점 더 적은 (양의) 나무들을 가져다주고 있었다.</div><div class=\"rst\">날마다 가져가는 나무가 <b>점점 줄어요</b>(less and less). 밤새 공부할수록 점수가 떨어지는 느낌이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">19번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">As time went by,</div><div class=\"k\">시간이 지남에 따라,</div></div><div class=\"rc\"><div class=\"e\">(d) he noticed</div><div class=\"k\">(d) 그는(= 젊은 나무꾼) 알아차렸다</div></div><div class=\"rc\"><div class=\"e\">that even though he worked through his break time</div><div class=\"k\">그가 쉬는 시간까지 일을 하고</div></div><div class=\"rc\"><div class=\"e\">and hardly took a rest,</div><div class=\"k\">거의 휴식을 취하지 않았음에도 불구하고,</div></div><div class=\"rc\"><div class=\"e\">the old woodcutter was cutting down</div><div class=\"k\">그 나이 든 나무꾼이 베어내고 있었다는 것을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the same amount of trees as him</span> —</div><div class=\"k\"><span class=\"cw\">그와(= 젊은 나무꾼) 똑같은 양의 나무들을</span> —</div></div><div class=\"rc\"><div class=\"e\">and sometimes chopped down even more.</div><div class=\"k\">그리고 때로는 심지어 더 많은 양을 베고 있다는 것을.</div></div><div class=\"rnat\">시간이 지남에 따라, (d) 그(젊은 나무꾼)는 그가 그의 쉬는 시간까지 일을 하고 거의 휴식을 취하지 않았음에도 불구하고, 그 나이 든 나무꾼이 그(젊은 나무꾼)와 똑같은 양의 나무들을 베어내고 있었다는 — 그리고 때로는 심지어 (자신보다) 더 많은 양을 베고 있다는 것을 알아차렸다(알게 되었다).</div><div class=\"rst\">시간이 지나며 젊은 나무꾼은 알아차려요. 자기는 거의 안 쉬는데, 쉬는 노인이 <b>자기만큼</b>, 때로는 더 많이 벤다는 걸요.</div></div><div class=\"rds key\" data-ord=\"20\"><span class=\"rn\">20번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc ckc\"><div class=\"e\">(D) <span class=\"cw\">Suddenly the young woodcutter realized</span></div><div class=\"k\">(D) <span class=\"cw\">불현듯 그 젊은 나무꾼은 깨달았다</span></div></div><div class=\"rc\"><div class=\"e\">that during break times</div><div class=\"k\">쉬는 시간에</div></div><div class=\"rc\"><div class=\"e\">while the old man was having a drink,</div><div class=\"k\">노인이 마실 것을 마시는 동안,</div></div><div class=\"rc\"><div class=\"e\">he was also re-sharpening his axe,</div><div class=\"k\">그가(= 노인) 도끼날도 갈고 있었다는 것을,</div></div><div class=\"rc\"><div class=\"e\">which the young woodcutter never did.</div><div class=\"k\">그것은(= 도끼날을 가는 것) 젊은 나무꾼이 결코 하지 않았던 일이었다.</div></div><div class=\"rnat\">(D) 불현듯 그 젊은 나무꾼은 쉬는 시간에 노인이 마실 것을 마시는 동안, 그가 (동시에) 도끼날도 (또한) 갈고 있었다는 것을 깨달았는데, 이(도끼날을 가는 것)는 젊은 나무꾼이 결코 (시도) 하지 않았던 일이었다.</div><div class=\"rst\"><b>불현듯</b>(Suddenly) 젊은 나무꾼은 깨달아요. 노인은 쉬는 시간에 마시면서 <b>도끼날도 갈고</b> 있었다는 걸요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">That’s how</div><div class=\"k\">그것이(= 도끼날을 가는 것) 바로 방법이다</div></div><div class=\"rc\"><div class=\"e\">(e) he could chop</div><div class=\"k\">(e) 그가(= 노인) 벨 수 있었던</div></div><div class=\"rc\"><div class=\"e\">more than the young man</div><div class=\"k\">젊은이보다 더 많이</div></div><div class=\"rc\"><div class=\"e\">in less time!</div><div class=\"k\">더 적은 시간에!</div></div><div class=\"rnat\">그것(도끼날을 가는 것)이 (바로) (e) 그(노인)가 젊은이보다 더 적은 시간에 더 많이 벨 수 있었던 방법이다!</div><div class=\"rst\">그래서 노인이 더 짧은 시간에 젊은이보다 더 많이 벨 수 있었던 거예요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">The old man said</div><div class=\"k\">노인은 말했다</div></div><div class=\"rc\"><div class=\"e\">that we all need time</div><div class=\"k\">우리 모두가 시간이 필요하다고</div></div><div class=\"rc\"><div class=\"e\">to relax,</div><div class=\"k\">(잠시) 휴식을 취하고(긴장을 늦추고),</div></div><div class=\"rc\"><div class=\"e\">to think and meditate,</div><div class=\"k\">생각하고 명상하며,</div></div><div class=\"rc\"><div class=\"e\">and to learn and grow.</div><div class=\"k\">배우고 성장할.</div></div><div class=\"rnat\">그 노인은 우리 모두가 (잠시) 휴식을 취하고(긴장을 늦추고), 생각하고 명상하며, 배우고 성장할 시간이 필요하다고 말했다.</div><div class=\"rst\">노인은 말해요. 우리 모두 쉬고, 생각하고, 배우고 자랄 시간이 필요하다고요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">If we don’t take the time</div><div class=\"k\">만일 우리가 시간을 갖지 않는다면</div></div><div class=\"rc\"><div class=\"e\">to sharpen the “axe,”</div><div class=\"k\">‘도끼날’을 갈,</div></div><div class=\"rc\"><div class=\"e\">we will become dull</div><div class=\"k\">우리는 무뎌지고</div></div><div class=\"rc\"><div class=\"e\">and lose our effectiveness.</div><div class=\"k\">우리의 효율성을 잃게 될 것이다.</div></div><div class=\"rnat\">만일 우리가 ‘도끼날’을 갈 시간을 갖지 않는다면, 우리는 무뎌지고 우리의 효율성을 잃게 될 것이다.</div><div class=\"rst\">‘도끼날’을 갈 시간을 안 가지면 우리도 무뎌져요. 쉬는 시간에 연필 깎고 정리하는 건 시간 낭비가 아니에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"woodcutter\" data-m=\"나무꾼\"><b>woodcutter</b>나무꾼</button><button type=\"button\" class=\"wdb\" data-w=\"highly motivated\" data-m=\"크게 고무된\"><b>highly motivated</b>크게 고무된</button><button type=\"button\" class=\"wdb\" data-w=\"as if\" data-m=\"마치 ~인 것처럼\"><b>as if</b>마치 ~인 것처럼</button><button type=\"button\" class=\"wdb\" data-w=\"refuse\" data-m=\"거절하다\"><b>refuse</b>거절하다</button><button type=\"button\" class=\"wdb\" data-w=\"re-sharpen\" data-m=\"다시 갈다\"><b>re-sharpen</b>다시 갈다</button><button type=\"button\" class=\"wdb\" data-w=\"sooner or later\" data-m=\"조만간\"><b>sooner or later</b>조만간</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>그 문장 안의 단서</b>로 누구인지 확인하세요. (e) 문장의 <b>more than the young man</b>(젊은이보다 더 많이)처럼 비교 대상이 젊은이면, (e)는 젊은이일 수 없어요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · 3번 문장</span><div class=\"en\">On his first day, (a) he worked through his break time and complained that the old man was wasting time …</div><p class=\"ko\">첫째 날, (a) 그는 쉬는 시간까지 일했고 노인이 시간을 낭비한다고 불평했다 … → 젊은 나무꾼</p></div><div class=\"ck-via\"><i>▼</i><span>노인과 비교되는 “쉬는 시간까지 일한 사람” = 3번의 젊은 나무꾼</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · 7번 문장</span><div class=\"en\">It was as if the old man worked through the break time just as (b) he did.</div><p class=\"ko\">마치 바로 (b) 그가 그러했듯이 노인도 쉬는 시간까지 일하는 것만 같았다. → 젊은 나무꾼</p></div><div class=\"ck-via\"><i>▼</i><span>같은 문장 앞의 주어 the young woodcutter(젊은 나무꾼)를 그대로 받아요</span></div><div class=\"ck-step\"><span class=\"lab\">(c) · 16번 문장</span><div class=\"en\">… the young woodcutter tried harder the next day, but (c) he could only bring ten trees.</div><p class=\"ko\">… 젊은 나무꾼은 다음 날 더 열심히 했으나, (c) 그는 고작 열 그루만 가져다줄 수 있었다. → 젊은 나무꾼</p></div><div class=\"ck-via\"><i>▼</i><span>알아차린 내용 속에 the old woodcutter(나이 든 나무꾼)가 따로 나오니, 알아차린 사람은 젊은이</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · 19번 문장</span><div class=\"en\">As time went by, (d) he noticed that even though he worked through his break time …</div><p class=\"ko\">시간이 지나며, (d) 그는 쉬는 시간까지 일했는데도 … 알아차렸다 → 젊은 나무꾼</p></div><div class=\"ck-via\"><i>▼</i><span>20번에서 도끼날을 간 사람 = 노인, 그리고 비교 대상이 젊은이</span></div><div class=\"ck-step key\"><span class=\"lab\">(e) · 21번 문장 · 결정적 단서</span><div class=\"en\">That’s how <mark>(e) he could chop</mark> <mark>more than the young man</mark> in less time!</div><p class=\"ko\">그것이 바로 <mark>(e) 그가</mark> 더 적은 시간에 <mark>젊은이보다 더 많이</mark> 벨 수 있었던 방법이다! → 노인</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(e) he 그 = 노인<small>젊은이보다 더 많이 벤 사람, 도끼날을 간 사람이라 노인이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) he 그 = 젊은 나무꾼</span><span class=\"why\">7번 문장 주어가 the old man(노인)이라 노인으로 착각하기 쉬워요. 하지만 just as he did(그가 그러했듯이)는 노인과 비교되는 다른 사람, 곧 쉬는 시간까지 일한 젊은이예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) he 그 = 젊은 나무꾼</span><span class=\"why\">3번에서 (a)가 노인이 시간을 낭비한다고 불평해요. 불평하는 사람과 노인은 다른 사람이니 (a)는 2번의 부지런한 젊은이예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) he 그 = 젊은 나무꾼</span><span class=\"why\">16번 같은 문장 앞에 the young woodcutter(젊은 나무꾼)가 주어로 나오고, 열 그루를 가져온 것도 그 사람이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) he 그 = 젊은 나무꾼</span><span class=\"why\">19번에서 (d)가 알아차린 내용이 “the old woodcutter(나이 든 나무꾼)가 자기만큼 벤다”예요. 그러니 알아차린 사람은 젊은이예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A) Once, there were two woodcutters</div><div class=\"k\">(A) 옛날에, 두 명의 나무꾼이 있었다</div></div><div class=\"rc\"><div class=\"e\">— a young, strong one</div><div class=\"k\">— 젊고 힘이 센 나무꾼과</div></div><div class=\"rc\"><div class=\"e\">and an old one —</div><div class=\"k\">나이 든 나무꾼(이었다) —</div></div><div class=\"rc\"><div class=\"e\">cutting down trees in a jungle.</div><div class=\"k\">정글에서 나무를 베는.</div></div><div class=\"rnat\">(A) 옛날에, 정글에서 나무를 베는 두 명의 나무꾼이 있었다 — 젊고 힘이 센 나무꾼과 나이 든 나무꾼(이었다).</div><div class=\"rst\">나무꾼 둘이 있어요. 젊고 힘센 나무꾼과 나이 든 나무꾼이에요. 우리 반으로 치면 힘이 넘치는 친구와 차분한 선배 같아요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The young man</div><div class=\"k\">그 젊은이는</div></div><div class=\"rc\"><div class=\"e\">was very hardworking.</div><div class=\"k\">매우 부지런했다.</div></div><div class=\"rnat\">그 젊은이는 매우 부지런했다.</div><div class=\"rst\">젊은 나무꾼은 정말 <b>부지런해요</b>(hardworking). 쉬는 시간에도 문제집만 푸는 친구 같은 사람이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">On his first day,</div><div class=\"k\">그가 일을 시작한 첫째 날,</div></div><div class=\"rc\"><div class=\"e\">(a) he worked through his break time</div><div class=\"k\">(a) 그는(= 젊은 나무꾼) 쉬는 시간까지 일을 했고</div></div><div class=\"rc\"><div class=\"e\">and complained</div><div class=\"k\">불평했다</div></div><div class=\"rc\"><div class=\"e\">that the old man was wasting time,</div><div class=\"k\">그 노인이 시간을 낭비하고 있다고,</div></div><div class=\"rc\"><div class=\"e\">taking several breaks to eat and drink.</div><div class=\"k\">먹고 마시려고 수차례 휴식을 취하며.</div></div><div class=\"rnat\">그의 (그가 일을 시작한) 첫째 날, (a) 그(젊은 나무꾼)는 그의 쉬는 시간까지 일을 했고, 그 노인이 먹고 마시려고 수차례 휴식을 취하며 시간을 낭비하고 있다고 불평했다.</div><div class=\"rst\">첫날 젊은 나무꾼은 쉬는 시간에도 일하면서, 먹고 마시며 쉬는 노인을 보고 “시간 낭비야” 하고 투덜대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">That day,</div><div class=\"k\">그 날,</div></div><div class=\"rc\"><div class=\"e\">the young woodcutter brought 15 trees</div><div class=\"k\">그 젊은 나무꾼은 열다섯 그루의 나무를 가져다주었다</div></div><div class=\"rc\"><div class=\"e\">to their boss.</div><div class=\"k\">그들의 고용인에게.</div></div><div class=\"rnat\">그 날, 그 젊은 나무꾼은 그의 고용인에게 열다섯 그루의 나무를 가져다주었다.</div><div class=\"rst\">그날 젊은 나무꾼은 나무 <b>15그루</b>를 사장님께 가져가요. 첫날 성적이 아주 좋았던 거예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">“Fantastic!”</div><div class=\"k\">“훌륭하군!”</div></div><div class=\"rc\"><div class=\"e\">the boss said.</div><div class=\"k\">고용인이 말했다.</div></div><div class=\"rnat\">“훌륭하군!” 고용인이 말했다.</div><div class=\"rst\">사장님이 “<b>훌륭하군!</b>” 하고 칭찬해요. 선생님께 칭찬받은 기분이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">“Keep up the great work!”</div><div class=\"k\">“계속 열심히 해 주게나!”</div></div><div class=\"rnat\">“계속 열심히 해 주게나!”</div><div class=\"rst\">“<b>계속 열심히 해 주게나!</b>” 이 칭찬이 (C)의 his words(그의 말)로 이어져요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">(B) It was as if</div><div class=\"k\">(B) ~인 것만 같았다</div></div><div class=\"rc\"><div class=\"e\">the old man worked through the break time</div><div class=\"k\">그 노인이 쉬는 시간까지 일을 하는</div></div><div class=\"rc\"><div class=\"e\">just as (b) he did.</div><div class=\"k\">마치 바로 (b) 그가(= 젊은 나무꾼) 그러했듯이.</div></div><div class=\"rnat\">(B) 마치 바로 (b) 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다.</div><div class=\"rst\"><b>마치</b>(as if) 노인도 자기처럼 쉬는 시간 없이 일한 것 같은 결과였어요. (C) 끝의 그 관찰을 그대로 받아요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">So,</div><div class=\"k\">그래서,</div></div><div class=\"rc\"><div class=\"e\">the young woodcutter decided</div><div class=\"k\">그 젊은 나무꾼은 결심했다</div></div><div class=\"rc\"><div class=\"e\">to work harder the next day.</div><div class=\"k\">그 다음 날 더 열심히 일하기로.</div></div><div class=\"rnat\">그래서, 그 젊은 나무꾼은 그 다음 날 더 열심히 일하기로 결심했다.</div><div class=\"rst\"><b>그래서</b>(So) 젊은 나무꾼은 다음 날 더 열심히 하기로 마음먹어요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Unfortunately,</div><div class=\"k\">유감스럽게도,</div></div><div class=\"rc\"><div class=\"e\">the results were even worse.</div><div class=\"k\">그 결과는 훨씬 더 심각했다(참혹했다).</div></div><div class=\"rnat\">유감스럽게도, 그 결과는 훨씬 더 심각했다(참혹했다).</div><div class=\"rst\">안타깝게도 결과는 훨씬 더 나빠졌어요. 더 열심히 할수록 더 못하는 거예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">“I must be losing my strength,”</div><div class=\"k\">“내가 힘이 (점점) 빠지고 있는 것이 틀림없어,”</div></div><div class=\"rc\"><div class=\"e\">the young man thought.</div><div class=\"k\">젊은이는 생각했다.</div></div><div class=\"rnat\">“내가 힘이 (점점) 빠지고 있는 것이 틀림없어.” 젊은이는 생각했다.</div><div class=\"rst\">“내가 힘이 빠지고 있나 봐.” 젊은 나무꾼은 이유를 자기 체력 탓으로만 생각해요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">One day,</div><div class=\"k\">어느 날,</div></div><div class=\"rc\"><div class=\"e\">the old man invited him</div><div class=\"k\">노인은 그를(= 젊은 나무꾼) 불렀다</div></div><div class=\"rc\"><div class=\"e\">for a drink during the break time.</div><div class=\"k\">쉬는 시간 동안 (마실 것이라도) 한 잔 하자며.</div></div><div class=\"rnat\">어느 날, 노인은 쉬는 시간 동안 (마실 것이라도) 한 잔 하자며 그(젊은 나무꾼)를 불렀다.</div><div class=\"rst\">어느 날 노인이 쉬는 시간에 “한잔하세” 하고 젊은 나무꾼을 불러요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">The young man refused</div><div class=\"k\">젊은이는 거절했고,</div></div><div class=\"rc\"><div class=\"e\">and said he had no extra time.</div><div class=\"k\">그가(= 젊은 나무꾼) 여유 시간이 없다고 말했다.</div></div><div class=\"rnat\">젊은이는 거절했고, 그가 여유 시간이 없다고 말했다.</div><div class=\"rst\">젊은 나무꾼은 “쉴 시간 없어요” 하고 <b>거절해요</b>(refused).</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Then,</div><div class=\"k\">그러자,</div></div><div class=\"rc\"><div class=\"e\">the old man smiled and said to him,</div><div class=\"k\">노인이 미소 지으며 그에게(= 젊은 나무꾼) 말했다.</div></div><div class=\"rnat\">그러자, 노인이 미소 지으며 그에게 말했다.</div><div class=\"rst\">그러자 노인이 웃으며 젊은 나무꾼에게 말을 꺼내요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">“It is a waste of effort</div><div class=\"k\">“노력의 낭비라네,</div></div><div class=\"rc\"><div class=\"e\">to keep chopping trees</div><div class=\"k\">계속 나무만 베어내는 것은</div></div><div class=\"rc\"><div class=\"e\">without re-sharpening your axe.</div><div class=\"k\">자네의 도끼날을 다시 갈지 않고.</div></div><div class=\"rnat\">“자네의 도끼날을 다시 갈지 않고 계속 나무만 베어내는 것은 노력의 낭비라네(노력을 낭비하는 거라네).</div><div class=\"rst\">“<b>도끼날을 갈지 않고</b> 계속 나무만 베는 건 힘 낭비라네.” 안 깎은 무딘 연필로 계속 쓰는 것과 같아요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Sooner or later,</div><div class=\"k\">머잖아,</div></div><div class=\"rc\"><div class=\"e\">you will have to give up</div><div class=\"k\">자네는 그만둬야 할 걸세</div></div><div class=\"rc\"><div class=\"e\">because you’ve spent too much energy.”</div><div class=\"k\">자네가 너무 많은 힘을 다 써버렸기 때문에.”</div></div><div class=\"rnat\">자네가 너무 많은 힘을 다 써버렸기 때문에(기력을 너무 많이 소진했기 때문에), 머잖아 자네는 (나무 베기를) 그만둬야 할게야.”</div><div class=\"rst\">“머잖아 힘을 다 써서 그만둬야 할 걸세.” 이 도끼 얘기가 (D)의 깨달음으로 이어져요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">(C) Highly motivated by his words,</div><div class=\"k\">(C) 그의 말에(= 고용인의 칭찬) 매우 고취되어,</div></div><div class=\"rc\"><div class=\"e\">the young woodcutter tried harder the next day,</div><div class=\"k\">젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나,</div></div><div class=\"rc\"><div class=\"e\">but (c) he could only bring ten trees.</div><div class=\"k\">(c) 그는(= 젊은 나무꾼) 고작 열 그루의 나무만 가져다줄 수 있었다.</div></div><div class=\"rnat\">(C) 그(고용인)의 말(칭찬)에 매우 고취되어(자극을 받아), 젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나, (c) 그(젊은 나무꾼)는 고작 열 그루의 나무들만 (고용인에게) 가져다줄 수 있었다.</div><div class=\"rst\">그 <b>말에 신이 나서</b>(Highly motivated by his words) 다음 날 더 열심히 했는데, 고작 <b>10그루</b>밖에 못 가져가요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">17번</span><div class=\"rc\"><div class=\"e\">The third day</div><div class=\"k\">셋째 날</div></div><div class=\"rc\"><div class=\"e\">he tried even harder,</div><div class=\"k\">그는(= 젊은 나무꾼) 훨씬 더 열심히 노력했으나,</div></div><div class=\"rc\"><div class=\"e\">but he was only able to bring seven trees.</div><div class=\"k\">겨우 일곱 그루의 나무만 가져다줄 수 있었다.</div></div><div class=\"rnat\">세 번째 날 그는 훨씬 더 열심히 노력했으나, 그는 겨우 일곱 그루의 나무들만 가져다줄 수 있었다.</div><div class=\"rst\">셋째 날엔 훨씬 더 열심히 했는데도 <b>7그루</b>뿐이에요. 노력할수록 숫자가 줄어요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">18번</span><div class=\"rc\"><div class=\"e\">Day after day,</div><div class=\"k\">날마다,</div></div><div class=\"rc\"><div class=\"e\">he was bringing</div><div class=\"k\">그는(= 젊은 나무꾼) 가져다주고 있었다</div></div><div class=\"rc\"><div class=\"e\">less and less trees.</div><div class=\"k\">점점 더 적은 나무들을.</div></div><div class=\"rnat\">날마다, 그는 점점 더 적은 (양의) 나무들을 가져다주고 있었다.</div><div class=\"rst\">날마다 가져가는 나무가 <b>점점 줄어요</b>(less and less). 밤새 공부할수록 점수가 떨어지는 느낌이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">As time went by,</div><div class=\"k\">시간이 지남에 따라,</div></div><div class=\"rc\"><div class=\"e\">(d) he noticed</div><div class=\"k\">(d) 그는(= 젊은 나무꾼) 알아차렸다</div></div><div class=\"rc\"><div class=\"e\">that even though he worked through his break time</div><div class=\"k\">그가 쉬는 시간까지 일을 하고</div></div><div class=\"rc\"><div class=\"e\">and hardly took a rest,</div><div class=\"k\">거의 휴식을 취하지 않았음에도 불구하고,</div></div><div class=\"rc\"><div class=\"e\">the old woodcutter was cutting down</div><div class=\"k\">그 나이 든 나무꾼이 베어내고 있었다는 것을</div></div><div class=\"rc\"><div class=\"e\">the same amount of trees as him —</div><div class=\"k\">그와(= 젊은 나무꾼) 똑같은 양의 나무들을 —</div></div><div class=\"rc\"><div class=\"e\">and sometimes chopped down even more.</div><div class=\"k\">그리고 때로는 심지어 더 많은 양을 베고 있다는 것을.</div></div><div class=\"rnat\">시간이 지남에 따라, (d) 그(젊은 나무꾼)는 그가 그의 쉬는 시간까지 일을 하고 거의 휴식을 취하지 않았음에도 불구하고, 그 나이 든 나무꾼이 그(젊은 나무꾼)와 똑같은 양의 나무들을 베어내고 있었다는 — 그리고 때로는 심지어 (자신보다) 더 많은 양을 베고 있다는 것을 알아차렸다(알게 되었다).</div><div class=\"rst\">시간이 지나며 젊은 나무꾼은 알아차려요. 자기는 거의 안 쉬는데, 쉬는 노인이 <b>자기만큼</b>, 때로는 더 많이 벤다는 걸요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">(D) Suddenly the young woodcutter realized</div><div class=\"k\">(D) 불현듯 그 젊은 나무꾼은 깨달았다</div></div><div class=\"rc\"><div class=\"e\">that during break times</div><div class=\"k\">쉬는 시간에</div></div><div class=\"rc\"><div class=\"e\">while the old man was having a drink,</div><div class=\"k\">노인이 마실 것을 마시는 동안,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">he was also re-sharpening his axe,</span></div><div class=\"k\"><span class=\"cw\">그가(= 노인) 도끼날도 갈고 있었다는 것을,</span></div></div><div class=\"rc\"><div class=\"e\">which the young woodcutter never did.</div><div class=\"k\">그것은(= 도끼날을 가는 것) 젊은 나무꾼이 결코 하지 않았던 일이었다.</div></div><div class=\"rnat\">(D) 불현듯 그 젊은 나무꾼은 쉬는 시간에 노인이 마실 것을 마시는 동안, 그가 (동시에) 도끼날도 (또한) 갈고 있었다는 것을 깨달았는데, 이(도끼날을 가는 것)는 젊은 나무꾼이 결코 (시도) 하지 않았던 일이었다.</div><div class=\"rst\"><b>불현듯</b>(Suddenly) 젊은 나무꾼은 깨달아요. 노인은 쉬는 시간에 마시면서 <b>도끼날도 갈고</b> 있었다는 걸요.</div></div><div class=\"rds key\" data-ord=\"21\"><span class=\"rn\">21번 · 단서</span><div class=\"rc\"><div class=\"e\">That’s how</div><div class=\"k\">그것이(= 도끼날을 가는 것) 바로 방법이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(e) he could chop</span></div><div class=\"k\"><span class=\"cw\">(e) 그가(= 노인) 벨 수 있었던</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">more than the young man</span></div><div class=\"k\"><span class=\"cw\">젊은이보다 더 많이</span></div></div><div class=\"rc\"><div class=\"e\">in less time!</div><div class=\"k\">더 적은 시간에!</div></div><div class=\"rnat\">그것(도끼날을 가는 것)이 (바로) (e) 그(노인)가 젊은이보다 더 적은 시간에 더 많이 벨 수 있었던 방법이다!</div><div class=\"rst\">그래서 노인이 더 짧은 시간에 젊은이보다 더 많이 벨 수 있었던 거예요. = 지문 21번, (e) 그는 도끼날을 간 노인이에요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">The old man said</div><div class=\"k\">노인은 말했다</div></div><div class=\"rc\"><div class=\"e\">that we all need time</div><div class=\"k\">우리 모두가 시간이 필요하다고</div></div><div class=\"rc\"><div class=\"e\">to relax,</div><div class=\"k\">(잠시) 휴식을 취하고(긴장을 늦추고),</div></div><div class=\"rc\"><div class=\"e\">to think and meditate,</div><div class=\"k\">생각하고 명상하며,</div></div><div class=\"rc\"><div class=\"e\">and to learn and grow.</div><div class=\"k\">배우고 성장할.</div></div><div class=\"rnat\">그 노인은 우리 모두가 (잠시) 휴식을 취하고(긴장을 늦추고), 생각하고 명상하며, 배우고 성장할 시간이 필요하다고 말했다.</div><div class=\"rst\">노인은 말해요. 우리 모두 쉬고, 생각하고, 배우고 자랄 시간이 필요하다고요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><div class=\"rc\"><div class=\"e\">If we don’t take the time</div><div class=\"k\">만일 우리가 시간을 갖지 않는다면</div></div><div class=\"rc\"><div class=\"e\">to sharpen the “axe,”</div><div class=\"k\">‘도끼날’을 갈,</div></div><div class=\"rc\"><div class=\"e\">we will become dull</div><div class=\"k\">우리는 무뎌지고</div></div><div class=\"rc\"><div class=\"e\">and lose our effectiveness.</div><div class=\"k\">우리의 효율성을 잃게 될 것이다.</div></div><div class=\"rnat\">만일 우리가 ‘도끼날’을 갈 시간을 갖지 않는다면, 우리는 무뎌지고 우리의 효율성을 잃게 될 것이다.</div><div class=\"rst\">‘도끼날’을 갈 시간을 안 가지면 우리도 무뎌져요. = 지문 23번, 쉬는 시간에 연필 깎고 정리하는 건 시간 낭비가 아니에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"chop\" data-m=\"(나무를) 베다, 자르다\"><b>chop</b>(나무를) 베다, 자르다</button><button type=\"button\" class=\"wdb\" data-w=\"in less time\" data-m=\"더 짧은 시간에\"><b>in less time</b>더 짧은 시간에</button><button type=\"button\" class=\"wdb\" data-w=\"as if\" data-m=\"마치 ~인 것처럼\"><b>as if</b>마치 ~인 것처럼</button><button type=\"button\" class=\"wdb\" data-w=\"notice\" data-m=\"알아차리다\"><b>notice</b>알아차리다</button><button type=\"button\" class=\"wdb\" data-w=\"hardly\" data-m=\"거의 ~하지 않다\"><b>hardly</b>거의 ~하지 않다</button><button type=\"button\" class=\"wdb\" data-w=\"re-sharpen\" data-m=\"다시 갈다\"><b>re-sharpen</b>다시 갈다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. ④처럼 <b>늘어났다/줄어들었다</b> 방향을 뒤집은 선택지는 숫자가 나오는 문장(15 → 10 → 7그루)으로 꼭 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 3번</em>worked through his break time(쉬는 시간까지 일했다) → 같음</span><span><em>② ↔ 4번</em>첫날 나무 15그루를 brought(가져갔다) → 같음</span><span><em>③ ↔ 11·12번</em>노인의 한잔 초대를 refused(거절했다) → 같음</span><span><em>⑤ ↔ 20번</em>re-sharpening his axe(도끼날을 갈고 있었다)를 realized(깨달았다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ④를 16~18번 숫자와 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>④의 ‘점점 늘어났다’를 숫자로 따져 봐요</span></div><div class=\"ck-step\"><span class=\"lab\">16·17번 문장 · 숫자 확인</span><div class=\"en\">The third day he tried even harder, but he was <mark>only able to bring seven trees</mark>.</div><p class=\"ko\">셋째 날 그는 훨씬 더 열심히 노력했으나, <mark>겨우 일곱 그루의 나무만 가져다줄 수 있었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>15 → 10 → 7그루, 숫자가 내려가는 흐름을 한마디로 정리한 문장</span></div><div class=\"ck-step key\"><span class=\"lab\">18번 문장 · 결정적 단서</span><div class=\"en\">Day after day, he was bringing <mark>less and less trees</mark>.</div><p class=\"ko\">날마다, 그는 <mark>점점 더 적은 나무들을</mark> 가져다주고 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">가져온 나무의 수는 점점 늘어났다<small>18번 less and less(점점 더 적은): 늘어난 게 아니라 줄어들었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">첫날 15개의 나무를 가져왔다</span><span class=\"why\">뒤에서 10그루, 7그루로 줄어서 15가 틀린 숫자처럼 느껴지지만, 4번 That day(그날) = 첫날에 15그루를 brought(가져갔다)라고 했으니 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">쉬는 시간에도 열심히 일했다</span><span class=\"why\">3번 worked through his break time(쉬는 시간까지 일했다)과 같아요. 19번에서도 hardly took a rest(거의 쉬지 않았다)라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">쉬는 시간에 함께 음료를 마시자는 노인의 초대를 거절했다</span><span class=\"why\">11번 invited him for a drink(한잔하자며 불렀다), 12번 refused(거절했다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">노인이 쉬는 시간에 도끼날을 갈고 있었다는 사실을 깨달았다</span><span class=\"why\">20번에서 노인이 re-sharpening his axe(도끼날을 갈고 있었다)라는 걸 realized(깨달았다)라고 했으니 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A) Once, there were two woodcutters</div><div class=\"k\">(A) 옛날에, 두 명의 나무꾼이 있었다</div></div><div class=\"rc\"><div class=\"e\">— a young, strong one</div><div class=\"k\">— 젊고 힘이 센 나무꾼과</div></div><div class=\"rc\"><div class=\"e\">and an old one —</div><div class=\"k\">나이 든 나무꾼(이었다) —</div></div><div class=\"rc\"><div class=\"e\">cutting down trees in a jungle.</div><div class=\"k\">정글에서 나무를 베는.</div></div><div class=\"rnat\">(A) 옛날에, 정글에서 나무를 베는 두 명의 나무꾼이 있었다 — 젊고 힘이 센 나무꾼과 나이 든 나무꾼(이었다).</div><div class=\"rst\">시험 기간, 힘이 넘치는 친구와 차분한 선배가 같이 공부한다고 생각해 봐요. = 지문 1번, 젊고 힘센 나무꾼과 나이 든 나무꾼이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The young man</div><div class=\"k\">그 젊은이는</div></div><div class=\"rc\"><div class=\"e\">was very hardworking.</div><div class=\"k\">매우 부지런했다.</div></div><div class=\"rnat\">그 젊은이는 매우 부지런했다.</div><div class=\"rst\">친구는 정말 <b>부지런해요</b>(hardworking). = 지문 2번, 젊은 나무꾼은 매우 부지런했어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">On his first day,</div><div class=\"k\">그가 일을 시작한 첫째 날,</div></div><div class=\"rc\"><div class=\"e\">(a) he worked through his break time</div><div class=\"k\">(a) 그는(= 젊은 나무꾼) 쉬는 시간까지 일을 했고</div></div><div class=\"rc\"><div class=\"e\">and complained</div><div class=\"k\">불평했다</div></div><div class=\"rc\"><div class=\"e\">that the old man was wasting time,</div><div class=\"k\">그 노인이 시간을 낭비하고 있다고,</div></div><div class=\"rc\"><div class=\"e\">taking several breaks to eat and drink.</div><div class=\"k\">먹고 마시려고 수차례 휴식을 취하며.</div></div><div class=\"rnat\">그의 (그가 일을 시작한) 첫째 날, (a) 그(젊은 나무꾼)는 그의 쉬는 시간까지 일을 했고, 그 노인이 먹고 마시려고 수차례 휴식을 취하며 시간을 낭비하고 있다고 불평했다.</div><div class=\"rst\">친구는 쉬는 시간에도 문제만 풀며, 간식 먹는 선배에게 “시간 낭비야” 해요. = 지문 3번, 쉬는 시간까지 일하며 노인을 불평해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">That day,</div><div class=\"k\">그 날,</div></div><div class=\"rc\"><div class=\"e\">the young woodcutter brought 15 trees</div><div class=\"k\">그 젊은 나무꾼은 열다섯 그루의 나무를 가져다주었다</div></div><div class=\"rc\"><div class=\"e\">to their boss.</div><div class=\"k\">그들의 고용인에게.</div></div><div class=\"rnat\">그 날, 그 젊은 나무꾼은 그의 고용인에게 열다섯 그루의 나무를 가져다주었다.</div><div class=\"rst\">첫날 친구는 문제를 잔뜩 풀었어요. = 지문 4번, 젊은 나무꾼은 첫날 나무 <b>15그루</b>를 가져갔어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">“Fantastic!”</div><div class=\"k\">“훌륭하군!”</div></div><div class=\"rc\"><div class=\"e\">the boss said.</div><div class=\"k\">고용인이 말했다.</div></div><div class=\"rnat\">“훌륭하군!” 고용인이 말했다.</div><div class=\"rst\">선생님이 “<b>훌륭하군!</b>” 하고 칭찬해요. = 지문 5번, 고용인(boss)의 칭찬이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">“Keep up the great work!”</div><div class=\"k\">“계속 열심히 해 주게나!”</div></div><div class=\"rnat\">“계속 열심히 해 주게나!”</div><div class=\"rst\">“<b>계속 열심히 해 주게나!</b>” = 지문 6번, 이 칭찬이 (C)의 his words(그의 말)로 이어져요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">(B) It was as if</div><div class=\"k\">(B) ~인 것만 같았다</div></div><div class=\"rc\"><div class=\"e\">the old man worked through the break time</div><div class=\"k\">그 노인이 쉬는 시간까지 일을 하는</div></div><div class=\"rc\"><div class=\"e\">just as (b) he did.</div><div class=\"k\">마치 바로 (b) 그가(= 젊은 나무꾼) 그러했듯이.</div></div><div class=\"rnat\">(B) 마치 바로 (b) 그(젊은 나무꾼)가 그러했듯이, 그 노인이 쉬는 시간까지 일을 하는 것만 같았다.</div><div class=\"rst\"><b>마치</b>(as if) 선배도 쉬는 시간 없이 공부한 것 같은 결과예요. = 지문 7번, 노인이 그처럼 쉬지 않고 일한 것 같았대요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">So,</div><div class=\"k\">그래서,</div></div><div class=\"rc\"><div class=\"e\">the young woodcutter decided</div><div class=\"k\">그 젊은 나무꾼은 결심했다</div></div><div class=\"rc\"><div class=\"e\">to work harder the next day.</div><div class=\"k\">그 다음 날 더 열심히 일하기로.</div></div><div class=\"rnat\">그래서, 그 젊은 나무꾼은 그 다음 날 더 열심히 일하기로 결심했다.</div><div class=\"rst\"><b>그래서</b>(So) 친구는 다음 날 더 열심히 하기로 해요. = 지문 8번, 젊은 나무꾼의 결심이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Unfortunately,</div><div class=\"k\">유감스럽게도,</div></div><div class=\"rc\"><div class=\"e\">the results were even worse.</div><div class=\"k\">그 결과는 훨씬 더 심각했다(참혹했다).</div></div><div class=\"rnat\">유감스럽게도, 그 결과는 훨씬 더 심각했다(참혹했다).</div><div class=\"rst\">하지만 결과는 더 나빠졌어요. = 지문 9번, 결과가 훨씬 더 심각했대요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">“I must be losing my strength,”</div><div class=\"k\">“내가 힘이 (점점) 빠지고 있는 것이 틀림없어,”</div></div><div class=\"rc\"><div class=\"e\">the young man thought.</div><div class=\"k\">젊은이는 생각했다.</div></div><div class=\"rnat\">“내가 힘이 (점점) 빠지고 있는 것이 틀림없어.” 젊은이는 생각했다.</div><div class=\"rst\">“내가 체력이 떨어졌나 봐.” = 지문 10번, 젊은이는 힘이 빠지고 있다고 생각해요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">One day,</div><div class=\"k\">어느 날,</div></div><div class=\"rc\"><div class=\"e\">the old man invited him</div><div class=\"k\">노인은 그를(= 젊은 나무꾼) 불렀다</div></div><div class=\"rc\"><div class=\"e\">for a drink during the break time.</div><div class=\"k\">쉬는 시간 동안 (마실 것이라도) 한 잔 하자며.</div></div><div class=\"rnat\">어느 날, 노인은 쉬는 시간 동안 (마실 것이라도) 한 잔 하자며 그(젊은 나무꾼)를 불렀다.</div><div class=\"rst\">어느 날 선배가 쉬는 시간에 “음료수 한잔할래?” 하고 불러요. = 지문 11번, 노인의 초대예요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">The young man refused</div><div class=\"k\">젊은이는 거절했고,</div></div><div class=\"rc\"><div class=\"e\">and said he had no extra time.</div><div class=\"k\">그가(= 젊은 나무꾼) 여유 시간이 없다고 말했다.</div></div><div class=\"rnat\">젊은이는 거절했고, 그가 여유 시간이 없다고 말했다.</div><div class=\"rst\">친구는 “쉴 시간 없어요” 하고 <b>거절해요</b>(refused). = 지문 12번, 여유 시간이 없다고 했어요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Then,</div><div class=\"k\">그러자,</div></div><div class=\"rc\"><div class=\"e\">the old man smiled and said to him,</div><div class=\"k\">노인이 미소 지으며 그에게(= 젊은 나무꾼) 말했다.</div></div><div class=\"rnat\">그러자, 노인이 미소 지으며 그에게 말했다.</div><div class=\"rst\">그러자 선배가 웃으며 친구에게 말해요. = 지문 13번, 노인이 미소 지으며 말을 꺼내요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">“It is a waste of effort</div><div class=\"k\">“노력의 낭비라네,</div></div><div class=\"rc\"><div class=\"e\">to keep chopping trees</div><div class=\"k\">계속 나무만 베어내는 것은</div></div><div class=\"rc\"><div class=\"e\">without re-sharpening your axe.</div><div class=\"k\">자네의 도끼날을 다시 갈지 않고.</div></div><div class=\"rnat\">“자네의 도끼날을 다시 갈지 않고 계속 나무만 베어내는 것은 노력의 낭비라네(노력을 낭비하는 거라네).</div><div class=\"rst\">“무딘 연필로 계속 쓰는 건 힘 낭비야.” = 지문 14번, <b>도끼날을 다시 갈지 않고</b> 나무만 베는 건 노력의 낭비래요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">Sooner or later,</div><div class=\"k\">머잖아,</div></div><div class=\"rc\"><div class=\"e\">you will have to give up</div><div class=\"k\">자네는 그만둬야 할 걸세</div></div><div class=\"rc\"><div class=\"e\">because you’ve spent too much energy.”</div><div class=\"k\">자네가 너무 많은 힘을 다 써버렸기 때문에.”</div></div><div class=\"rnat\">자네가 너무 많은 힘을 다 써버렸기 때문에(기력을 너무 많이 소진했기 때문에), 머잖아 자네는 (나무 베기를) 그만둬야 할게야.”</div><div class=\"rst\">“곧 지쳐서 그만두게 될걸.” = 지문 15번, 힘을 다 써서 머잖아 포기하게 된다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"16\"><span class=\"rn\">16번 · 단서</span><div class=\"rc\"><div class=\"e\">(C) Highly motivated by his words,</div><div class=\"k\">(C) 그의 말에(= 고용인의 칭찬) 매우 고취되어,</div></div><div class=\"rc\"><div class=\"e\">the young woodcutter tried harder the next day,</div><div class=\"k\">젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나,</div></div><div class=\"rc ckc\"><div class=\"e\">but (c) <span class=\"cw\">he could only bring ten trees</span>.</div><div class=\"k\">(c) 그는(= 젊은 나무꾼) <span class=\"cw\">고작 열 그루의 나무만 가져다줄 수 있었다</span>.</div></div><div class=\"rnat\">(C) 그(고용인)의 말(칭찬)에 매우 고취되어(자극을 받아), 젊은 나무꾼은 그 다음 날 더욱 열심히 노력했으나, (c) 그(젊은 나무꾼)는 고작 열 그루의 나무들만 (고용인에게) 가져다줄 수 있었다.</div><div class=\"rst\">친구는 그 <b>말에 신이 나서</b>(Highly motivated by his words) 더 열심히 했는데 푼 양이 줄었어요. = 지문 16번, 고작 <b>10그루</b>예요.</div></div><div class=\"rds key\" data-ord=\"17\"><span class=\"rn\">17번 · 단서</span><div class=\"rc\"><div class=\"e\">The third day</div><div class=\"k\">셋째 날</div></div><div class=\"rc\"><div class=\"e\">he tried even harder,</div><div class=\"k\">그는(= 젊은 나무꾼) 훨씬 더 열심히 노력했으나,</div></div><div class=\"rc ckc\"><div class=\"e\">but he was <span class=\"cw\">only able to bring seven trees</span>.</div><div class=\"k\"><span class=\"cw\">겨우 일곱 그루의 나무만 가져다줄 수 있었다.</span></div></div><div class=\"rnat\">세 번째 날 그는 훨씬 더 열심히 노력했으나, 그는 겨우 일곱 그루의 나무들만 가져다줄 수 있었다.</div><div class=\"rst\">다음 날엔 더 애썼는데 더 줄었어요. = 지문 17번, 셋째 날엔 겨우 <b>7그루</b>뿐이에요.</div></div><div class=\"rds key\" data-ord=\"18\"><span class=\"rn\">18번 · 단서</span><div class=\"rc\"><div class=\"e\">Day after day,</div><div class=\"k\">날마다,</div></div><div class=\"rc\"><div class=\"e\">he was bringing</div><div class=\"k\">그는(= 젊은 나무꾼) 가져다주고 있었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">less and less trees</span>.</div><div class=\"k\"><span class=\"cw\">점점 더 적은 나무들을.</span></div></div><div class=\"rnat\">날마다, 그는 점점 더 적은 (양의) 나무들을 가져다주고 있었다.</div><div class=\"rst\">날마다 푼 문제가 줄어요. = 지문 18번, 가져가는 나무가 <b>점점 더 적어져요</b>(less and less). ④가 틀린 이유예요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">19번</span><div class=\"rc\"><div class=\"e\">As time went by,</div><div class=\"k\">시간이 지남에 따라,</div></div><div class=\"rc\"><div class=\"e\">(d) he noticed</div><div class=\"k\">(d) 그는(= 젊은 나무꾼) 알아차렸다</div></div><div class=\"rc\"><div class=\"e\">that even though he worked through his break time</div><div class=\"k\">그가 쉬는 시간까지 일을 하고</div></div><div class=\"rc\"><div class=\"e\">and hardly took a rest,</div><div class=\"k\">거의 휴식을 취하지 않았음에도 불구하고,</div></div><div class=\"rc\"><div class=\"e\">the old woodcutter was cutting down</div><div class=\"k\">그 나이 든 나무꾼이 베어내고 있었다는 것을</div></div><div class=\"rc\"><div class=\"e\">the same amount of trees as him —</div><div class=\"k\">그와(= 젊은 나무꾼) 똑같은 양의 나무들을 —</div></div><div class=\"rc\"><div class=\"e\">and sometimes chopped down even more.</div><div class=\"k\">그리고 때로는 심지어 더 많은 양을 베고 있다는 것을.</div></div><div class=\"rnat\">시간이 지남에 따라, (d) 그(젊은 나무꾼)는 그가 그의 쉬는 시간까지 일을 하고 거의 휴식을 취하지 않았음에도 불구하고, 그 나이 든 나무꾼이 그(젊은 나무꾼)와 똑같은 양의 나무들을 베어내고 있었다는 — 그리고 때로는 심지어 (자신보다) 더 많은 양을 베고 있다는 것을 알아차렸다(알게 되었다).</div><div class=\"rst\">친구는 알아차려요. 자기는 안 쉬는데 쉬는 선배가 <b>자기만큼</b>, 때론 더 많이 푼다는 걸요. = 지문 19번이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">20번</span><div class=\"rc\"><div class=\"e\">(D) Suddenly the young woodcutter realized</div><div class=\"k\">(D) 불현듯 그 젊은 나무꾼은 깨달았다</div></div><div class=\"rc\"><div class=\"e\">that during break times</div><div class=\"k\">쉬는 시간에</div></div><div class=\"rc\"><div class=\"e\">while the old man was having a drink,</div><div class=\"k\">노인이 마실 것을 마시는 동안,</div></div><div class=\"rc\"><div class=\"e\">he was also re-sharpening his axe,</div><div class=\"k\">그가(= 노인) 도끼날도 갈고 있었다는 것을,</div></div><div class=\"rc\"><div class=\"e\">which the young woodcutter never did.</div><div class=\"k\">그것은(= 도끼날을 가는 것) 젊은 나무꾼이 결코 하지 않았던 일이었다.</div></div><div class=\"rnat\">(D) 불현듯 그 젊은 나무꾼은 쉬는 시간에 노인이 마실 것을 마시는 동안, 그가 (동시에) 도끼날도 (또한) 갈고 있었다는 것을 깨달았는데, 이(도끼날을 가는 것)는 젊은 나무꾼이 결코 (시도) 하지 않았던 일이었다.</div><div class=\"rst\"><b>불현듯</b>(Suddenly) 친구는 깨달아요. 선배는 쉬는 시간마다 <b>연필을 깎고</b> 있었어요. = 지문 20번, 노인은 도끼날을 갈았어요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">21번</span><div class=\"rc\"><div class=\"e\">That’s how</div><div class=\"k\">그것이(= 도끼날을 가는 것) 바로 방법이다</div></div><div class=\"rc\"><div class=\"e\">(e) he could chop</div><div class=\"k\">(e) 그가(= 노인) 벨 수 있었던</div></div><div class=\"rc\"><div class=\"e\">more than the young man</div><div class=\"k\">젊은이보다 더 많이</div></div><div class=\"rc\"><div class=\"e\">in less time!</div><div class=\"k\">더 적은 시간에!</div></div><div class=\"rnat\">그것(도끼날을 가는 것)이 (바로) (e) 그(노인)가 젊은이보다 더 적은 시간에 더 많이 벨 수 있었던 방법이다!</div><div class=\"rst\">그래서 선배가 더 짧은 시간에 더 많이 풀 수 있었던 거예요. = 지문 21번, 노인이 더 적은 시간에 더 많이 벤 비결이에요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">22번</span><div class=\"rc\"><div class=\"e\">The old man said</div><div class=\"k\">노인은 말했다</div></div><div class=\"rc\"><div class=\"e\">that we all need time</div><div class=\"k\">우리 모두가 시간이 필요하다고</div></div><div class=\"rc\"><div class=\"e\">to relax,</div><div class=\"k\">(잠시) 휴식을 취하고(긴장을 늦추고),</div></div><div class=\"rc\"><div class=\"e\">to think and meditate,</div><div class=\"k\">생각하고 명상하며,</div></div><div class=\"rc\"><div class=\"e\">and to learn and grow.</div><div class=\"k\">배우고 성장할.</div></div><div class=\"rnat\">그 노인은 우리 모두가 (잠시) 휴식을 취하고(긴장을 늦추고), 생각하고 명상하며, 배우고 성장할 시간이 필요하다고 말했다.</div><div class=\"rst\">선배는 말해요. 쉬고, 생각하고, 배울 시간이 모두에게 필요하다고요. = 지문 22번, 노인의 말이에요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">23번</span><div class=\"rc\"><div class=\"e\">If we don’t take the time</div><div class=\"k\">만일 우리가 시간을 갖지 않는다면</div></div><div class=\"rc\"><div class=\"e\">to sharpen the “axe,”</div><div class=\"k\">‘도끼날’을 갈,</div></div><div class=\"rc\"><div class=\"e\">we will become dull</div><div class=\"k\">우리는 무뎌지고</div></div><div class=\"rc\"><div class=\"e\">and lose our effectiveness.</div><div class=\"k\">우리의 효율성을 잃게 될 것이다.</div></div><div class=\"rnat\">만일 우리가 ‘도끼날’을 갈 시간을 갖지 않는다면, 우리는 무뎌지고 우리의 효율성을 잃게 될 것이다.</div><div class=\"rst\">연필 깎을 시간을 안 가지면 우리도 무뎌져요. = 지문 23번, ‘도끼날’을 갈지 않으면 효율성을 잃는대요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"break time\" data-m=\"쉬는 시간\"><b>break time</b>쉬는 시간</button><button type=\"button\" class=\"wdb\" data-w=\"refuse\" data-m=\"거절하다\"><b>refuse</b>거절하다</button><button type=\"button\" class=\"wdb\" data-w=\"extra time\" data-m=\"여유 시간\"><b>extra time</b>여유 시간</button><button type=\"button\" class=\"wdb\" data-w=\"less and less\" data-m=\"점점 더 적은\"><b>less and less</b>점점 더 적은</button><button type=\"button\" class=\"wdb\" data-w=\"realize\" data-m=\"깨닫다\"><b>realize</b>깨닫다</button><button type=\"button\" class=\"wdb\" data-w=\"axe\" data-m=\"도끼\"><b>axe</b>도끼</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심 문장을 <b>상위 개념어로 바꿔 옮긴 것</b>이에요. 요약문의 <b>Even small differences</b>(작은 차이조차도)와 똑같이 생긴 8번 문장을 찾아, 그 차이가 <b>무슨 종류</b>(A)이고 <b>무엇을 방해했는지</b>(B)를 짝지으세요.</p><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 차이의 정체</span><div class=\"en\">For them, sweet potato pie is <mark>the common referent</mark>.</div><p class=\"ko\">그들에게, 고구마 파이는 <mark>흔한 지시(언급) 대상이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>호박 파이냐 고구마 파이냐 = 집안·공동체마다 다른 문화의 차이</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\"><mark>Even the slight difference</mark> of being unfamiliar with pumpkin pie can serve as a source of interference for the student.</div><p class=\"ko\">호박 파이에 익숙하지 않다는 <mark>작은 차이조차도</mark> 학생에게는 방해 원인의 역할을 할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>방해받은 것 = 선생님이 가르치려던 분수 수업, 곧 학습</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 문장 · 무엇이 방해받나</span><div class=\"en\">… all of these questions can become more of the focus <mark>than the subject of fractions</mark> that the teacher is attempting to teach.</div><p class=\"ko\">… 이러한 모든 질문들은 선생님이 가르치려는 <mark>분수라는 주제보다</mark> 더 초점이 될 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>slight difference(작은 차이) = small differences, 파이 차이 → (A) 문화적, 분수 수업 → (B) 학습</span></div><div class=\"ck-step\"><span class=\"lab\">요약문 (11번) · 짝 맞추기</span><div class=\"en\">Even small differences in <mark>cultural</mark> knowledge have the potential to affect students’ <mark>learning</mark>.</div><p class=\"ko\">(A) <mark>문화적</mark> 지식의 작은 차이조차도 학생들의 (B) <mark>학습</mark>에 영향을 미칠 가능성이 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">(A) 문화적 …… (B) 학습<small>파이 차이는 문화 차이, 흔들린 건 분수 학습이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(A) 영양상의 …… (B) 발달</span><span class=\"why\">파이가 음식이라 영양으로 끌려요. 하지만 8번의 차이는 호박 파이에 unfamiliar(익숙하지 않은) 것, 즉 먹어 본 적 있느냐는 문화 차이지 영양 차이가 아니에요. 발달 얘기도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(A) 문화적 …… (B) 책임</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 10번에서 흔들린 건 분수라는 주제, 곧 수업 내용 배우기예요. 누구 책임인지는 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(A) 수학적 …… (B) 상상</span><span class=\"why\">분수가 수학이라 끌리지만, 차이는 수학 지식이 아니라 파이를 아느냐예요. 9번의 상상은 방해의 원인이지 영향을 받는 대상이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(A) 수학적 …… (B) 지능</span><span class=\"why\">둘 다 틀려요. 아이가 수학을 몰라서가 아니라 호박 파이를 몰라서 헤맸고, 지능이 달라진다는 말도 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">A primary school teacher is helping students</div><div class=\"k\">한 초등학교 선생님이 학생들을 돕고 있는 중이다</div></div><div class=\"rc\"><div class=\"e\">to understand fractional parts</div><div class=\"k\">분수 부분을 이해하도록</div></div><div class=\"rc\"><div class=\"e\">by using what she thinks</div><div class=\"k\">그녀가(= 그 선생님) ~라고 생각하는 것을 사용함으로써</div></div><div class=\"rc\"><div class=\"e\">is a commonplace reference.</div><div class=\"k\">아주 흔한 대상(흔히 언급되는 것)인.</div></div><div class=\"rnat\">한 초등학교 선생님이 그녀가 아주 흔한 대상(흔히 언급되는 것)이라고 생각한 것을 사용함으로써 분수 부분을 이해하도록 학생들을 돕고 있는 중이다.</div><div class=\"rst\">수학 시간에 선생님이 누구나 아는 거라 생각한 음식으로 분수를 설명하려 해요. 지문의 초등학교 선생님 이야기예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">“Today, we’re going to talk about</div><div class=\"k\">“오늘 우리는 이야기할 거예요</div></div><div class=\"rc\"><div class=\"e\">cutting up</div><div class=\"k\">자르는 것에 대해</div></div><div class=\"rc\"><div class=\"e\">a Thanksgiving holiday favorite —</div><div class=\"k\">추수감사절에 가장 인기 있는 것 —</div></div><div class=\"rc\"><div class=\"e\">pumpkin pie.”</div><div class=\"k\">호박 파이를.”</div></div><div class=\"rnat\">“오늘 우리는 추수감사절에 가장 인기 있는 것 — 호박 파이를 자르는 것에 대해 이야기할 거예요.”</div><div class=\"rst\">“오늘은 명절 인기 음식, <b>호박 파이</b>를 잘라 볼 거예요.” 피자 조각으로 분수를 배우는 것과 비슷한 장면이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">She continues</div><div class=\"k\">그녀는(= 그 선생님) 계속했다</div></div><div class=\"rc\"><div class=\"e\">with an explanation of parts.</div><div class=\"k\">(분수) 부분들에 대한 설명을.</div></div><div class=\"rnat\">그녀는 (분수) 부분들에 대한 설명을 계속했다.</div><div class=\"rst\">선생님은 파이를 몇 조각으로 나누는지 계속 설명해요. 분수 부분 설명이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Well into her discourse,</div><div class=\"k\">그녀의 강연이 한참 진행되었을 때,</div></div><div class=\"rc\"><div class=\"e\">a young African American boy,</div><div class=\"k\">한 어린 아프리카계 미국인 소년이</div></div><div class=\"rc\"><div class=\"e\">looking puzzled,</div><div class=\"k\">어리둥절한 표정을 지으며</div></div><div class=\"rc\"><div class=\"e\">asks,</div><div class=\"k\">질문한다,</div></div><div class=\"rc\"><div class=\"e\">“What is pumpkin pie?”</div><div class=\"k\">“호박 파이가 뭐예요?”(라고)</div></div><div class=\"rnat\">그녀의 강연이 한참 진행되었을 때, 한 어린 아프리카계 미국인 소년이 어리둥절한 표정을 지으며 “호박 파이가 뭐예요?”(라고) 질문한다.</div><div class=\"rst\">한참 설명하는데, 한 아이가 어리둥절한 얼굴로 물어요. “호박 파이가 뭐예요?” 그 아이는 호박 파이를 처음 들어 봐요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Most African Americans</div><div class=\"k\">대부분의 아프리카계 미국인들은</div></div><div class=\"rc\"><div class=\"e\">are likely to serve</div><div class=\"k\">차려내는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">sweet potato pie</div><div class=\"k\">고구마 파이를</div></div><div class=\"rc\"><div class=\"e\">for holiday dinners.</div><div class=\"k\">명절 저녁(만찬)으로.</div></div><div class=\"rnat\">대부분의 아프리카계 미국인들은 명절 저녁(만찬)으로 고구마 파이를 차려내는 경향이 있다.</div><div class=\"rst\">그 아이네 집처럼 아프리카계 미국인 가정은 명절에 대부분 <b>고구마 파이</b>를 먹어요. 집마다 먹는 음식이 다른 거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">one of the ways</div><div class=\"k\">방식들 중에 하나는</div></div><div class=\"rc\"><div class=\"e\">that African American parents explain pumpkin pie to their children</div><div class=\"k\">아프리카계 미국인 부모들이 그들의 아이들에게 호박 파이를 설명하는</div></div><div class=\"rc\"><div class=\"e\">is to say</div><div class=\"k\">말하는 것이다</div></div><div class=\"rc\"><div class=\"e\">that it is something like sweet potato pie.</div><div class=\"k\">그것이(= 호박 파이) 고구마 파이와 같은 무언가라고.</div></div><div class=\"rnat\">사실, 아프리카계 미국인 부모들이 그들의 아이들에게 호박 파이를 설명하는 방식들 중에 하나는 (호박 파이가) 고구마 파이와 같은 무언가라고 말하는 것이다.</div><div class=\"rst\">그래서 그 집 부모님은 호박 파이를 “고구마 파이 같은 거야” 하고 설명한대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">For them,</div><div class=\"k\">그들에게(= 아프리카계 미국인들),</div></div><div class=\"rc ckc\"><div class=\"e\">sweet potato pie is <span class=\"cw\">the common referent</span>.</div><div class=\"k\">고구마 파이는 <span class=\"cw\">흔한 지시(언급) 대상이다.</span></div></div><div class=\"rnat\">그들에게, 고구마 파이는 흔한 지시(언급) 대상이다(가장 흔하게 언급되는 것이다).</div><div class=\"rst\">그 아이에게 ‘누구나 아는 음식’은 호박 파이가 아니라 <b>고구마 파이</b>예요. 기준이 되는 음식이 문화마다 달라요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Even the slight difference</span></div><div class=\"k\"><span class=\"cw\">작은 차이조차도</span></div></div><div class=\"rc\"><div class=\"e\">of being unfamiliar with pumpkin pie</div><div class=\"k\">호박 파이에 익숙하지 않다는</div></div><div class=\"rc\"><div class=\"e\">can serve as a source of interference</div><div class=\"k\">방해 원인의 역할을 할 수 있다</div></div><div class=\"rc\"><div class=\"e\">for the student.</div><div class=\"k\">학생에게는.</div></div><div class=\"rnat\">호박 파이에 익숙하지 않다는 작은 차이조차도, 학생에게는 방해 원인의 역할을 할 수 있다(학습을 방해하는 원인이 될 수 있다).</div><div class=\"rst\">호박 파이를 모른다는 <b>작은 차이조차</b> 그 아이에겐 수업을 <b>방해하는 것</b>이 될 수 있어요. 이게 바로 문화 차이예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Rather than be engaged actively in the lesson,</div><div class=\"k\">수업에 활동적으로 참여하기보다,</div></div><div class=\"rc\"><div class=\"e\">he may have been preoccupied</div><div class=\"k\">그는(= 그 아이) 사로잡혀 있었을지도 모른다</div></div><div class=\"rc\"><div class=\"e\">with trying to imagine pumpkin pie:</div><div class=\"k\">호박 파이를 상상하기 위해 노력하는 데:</div></div><div class=\"rc\"><div class=\"e\">What does it taste like?</div><div class=\"k\">그것은(= 호박 파이) 무엇과 같은(무슨) 맛이 날까?</div></div><div class=\"rc\"><div class=\"e\">How does it smell?</div><div class=\"k\">그것은 어떤 냄새가 날까?</div></div><div class=\"rc\"><div class=\"e\">Is its texture chunky like apple or cherry pie?</div><div class=\"k\">그것의(= 호박 파이) 식감이 사과나 체리 파이처럼 덩어리가 씹힐까?</div></div><div class=\"rnat\">수업에 활동적으로 참여하기보다, 그는 호박 파이를 상상하기 위해 노력하는 데 사로잡혀 있었을지도 모른다. 그것은 무엇과 같은(무슨) 맛이 날까? 그것은 어떤 냄새가 날까? 그것의 식감이 사과나 체리 파이처럼 덩어리가 씹힐까?</div><div class=\"rst\">아이는 수업에 집중하기보다 “무슨 맛일까? 무슨 냄새일까? 사과 파이처럼 씹힐까?” 하는 생각에 빠졌을지도 몰라요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">In the mind of a child,</div><div class=\"k\">한 아이의 마음속에서,</div></div><div class=\"rc\"><div class=\"e\">all of these questions</div><div class=\"k\">이러한 모든 질문들은</div></div><div class=\"rc\"><div class=\"e\">can become more of the focus</div><div class=\"k\">더 초점이 될 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">than the subject of fractions</span></div><div class=\"k\"><span class=\"cw\">분수라는 주제보다</span></div></div><div class=\"rc\"><div class=\"e\">that the teacher is attempting to teach.</div><div class=\"k\">그 선생님이 가르치려고 시도하고 있는.</div></div><div class=\"rnat\">한 아이의 마음속에서, 이러한 모든 질문들은 그 선생님이 가르치려고 시도하고 있는 분수라는 주제보다 더 초점이 될 수 있다.</div><div class=\"rst\">아이 머릿속에선 그 궁금증이 <b>분수</b>보다 더 커져 버려요. 선생님이 가르치려던 분수 공부가 뒷전이 된 거예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc ckc\"><div class=\"e\">Even small differences in <span class=\"cw\">cultural knowledge</span></div><div class=\"k\"><span class=\"cw\">문화적 지식의</span> 작은 차이조차도※ 문제지엔 (A) 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">have the potential to affect</div><div class=\"k\">~에 영향을 미칠 가능성이 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">students’ learning</span>.</div><div class=\"k\"><span class=\"cw\">학생들의 학습에</span>.※ 문제지엔 (B) 빈칸으로 되어 있음</div></div><div class=\"rnat\">(A)문화적 지식의 작은 차이조차도 학생들의 (B)학습에 영향을 미칠 가능성이 있다.</div><div class=\"rst\">그래서 요약하면, <b>문화적</b> 지식의 작은 차이도 학생들의 <b>학습</b>에 영향을 줄 수 있다는 거예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"commonplace\" data-m=\"아주 흔한, 평범한\"><b>commonplace</b>아주 흔한, 평범한</button><button type=\"button\" class=\"wdb\" data-w=\"referent\" data-m=\"지시 대상\"><b>referent</b>지시 대상</button><button type=\"button\" class=\"wdb\" data-w=\"unfamiliar with\" data-m=\"~에 익숙하지 않은\"><b>unfamiliar with</b>~에 익숙하지 않은</button><button type=\"button\" class=\"wdb\" data-w=\"interference\" data-m=\"방해, 간섭\"><b>interference</b>방해, 간섭</button><button type=\"button\" class=\"wdb\" data-w=\"preoccupied with\" data-m=\"~에 사로잡힌\"><b>preoccupied with</b>~에 사로잡힌</button><button type=\"button\" class=\"wdb\" data-w=\"fraction\" data-m=\"분수\"><b>fraction</b>분수</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
