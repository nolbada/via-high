<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

<\/span> 강의였다"}, {"e": "just like the others,", "k": "다른 것(다른 수업들)과 똑같은,"}, {"e": "but <b>this time<\/b>, she said,", "k": "하지만 <b>이번에는<\/b>, 그녀가 말하길,"}, {"e": "she was <b>forced<\/b>", "k": "그녀는 어쩔 수 없이 ~하게 되었다"}, {"e": "to have a higher level of <b>consciousness<\/b>;", "k": "더 높은 <b>의식<\/b> 수준을 가지게(되었다);"}, {"e": "she was more <b>aware<\/b>", "k": "그녀는 더 잘 알게 되었다"}, {"e": "of the content of the lecture and discussion.", "k": "강의와 토론의 내용을."}], "easy": "다른 수업과 똑같은 강의였지만, 이번에는 의식이 더 또렷해질 수밖에 없었고, 그래서 강의와 토론 내용을 더 잘 알게 됐다고 Carrie가 말했다는 뜻이에요.", "gist": "(C)의 첫 문장. (A)에서 말한 ‘다른 기분’을 구체적으로 풀어 준다. 의식 수준이 높아지고 수업 내용을 더 잘 알게 되었다는 것이다.", "link": "그것은 다른 수업들과 같은 강의였지만, 이번에는 그녀가 어쩔 수 없이 더 높은 의식 수준을 가져야 했으며, (결과적으로) 강의와 토론의 내용을 더 잘 알게 되었다고 말했다."}, {"n": 8, "ch": [{"e": "(C) She also <b>admitted<\/b>", "k": "(C) 그녀는 또한 인정했다"}, {"e": "that <b>as a result<\/b>", "k": "그 결과"}, {"e": "she got more out of that class.", "k": "그 수업에서 더 많은 것을 얻었다고."}], "easy": "그리고 그 결과 그 수업에서 더 많은 것을 얻었다는 것도 인정했다는 뜻이에요.", "gist": "글의 마무리. 공식 질문자 경험이 학생의 의식 수준과 수업에서 얻는 것을 높여 주었다는 결론이다."}]}, {"no": "10", "typ": "무관한 문장", "src": "2023년 9월 35번", "evn": [1, 3, 4], "ev_en": "The irony of early democracy in Europe is that it thrived and prospered precisely because European rulers for a very long time were remarkably weak. / ② The most striking way to illustrate European weakness is to show how little revenue they collected. / ③ For this reason, tax collectors in Europe were able to collect a huge amount of revenue and therefore had a great influence on how society should function.", "ev_ko": [[1, "유럽의 초기 민주주의의 아이러니는 정확히 유럽의 통치자들이 아주 오랜 시간 동안 현저하게 약했기 때문에 그것이 번성하고 번영했다는 것이다."], [3, "② 유럽의 약함을 설명하는 가장 눈에 띄는 방법은 그들이 모은 세입이 얼마나 적은지를 보여 주는 것이다."], [4, "③ 이러한 이유로, 유럽의 세금 징수원은 막대한 금액의 세입을 모을 수 있었고, 따라서 사회가 어떻게 기능해야 하는지에 대해 큰 영향을 미쳤다."]], "why": ["이 글은 유럽의 초기 민주주의가 번성한 이유가 <b>유럽 통치자들이 아주 오랫동안 약했기 때문<\/b>이라는 아이러니를 설명합니다(1번)", "① 문장(2번)은 통치자들에게 부족했던 것이 백성들의 생산을 평가하고 세금을 부과할 능력이었다고 합니다", "② 문장(3번)은 그 약함을 <b>세입이 얼마나 적은지<\/b>로 보여 줍니다", "그런데 ③ 문장(4번)은 유럽의 세금 징수원이 <b>막대한 세입<\/b>을 모아 사회에 큰 영향을 미쳤다고 합니다", "이는 통치자들의 능력 부족으로 세입이 적었다는 글의 흐름과 정반대여서 관련이 없습니다", "그래서 정답은 ③입니다."], "ch": [{"n": "①", "t": "For more than a millennium after the fall of Rome, European rulers lacked the ability to assess what their people were producing and to levy substantial taxes based on this.", "g": "로마의 멸망 이후 천 년 넘게, 유럽의 통치자들은 자신의 백성들이 생산하고 있었던 것을 평가하고, 이것을 바탕으로 상당한 세금을 부과할 능력이 부족했다.", "ok": false, "e": ["로마 멸망 이후 유럽 통치자들에게 세금을 부과할 능력이 부족했다는 내용입니다(2번)", "1번의 <b>통치자들의 약함<\/b>을 구체적으로 설명하므로 흐름에 맞습니다."]}, {"n": "②", "t": "The most striking way to illustrate European weakness is to show how little revenue they collected.", "g": "유럽의 약함을 설명하는 가장 눈에 띄는 방법은 그들이 모은 세입이 얼마나 적은지를 보여 주는 것이다.", "ok": false, "e": ["유럽의 약함을 <b>세입이 적다<\/b>는 것으로 보여 준다는 내용입니다(3번)", "1번의 약함을 이어받아 세입 이야기로 넘어가므로 흐름에 맞습니다."]}, {"n": "③", "t": "For this reason, tax collectors in Europe were able to collect a huge amount of revenue and therefore had a great influence on how society should function.", "g": "이러한 이유로, 유럽의 세금 징수원은 막대한 금액의 세입을 모을 수 있었고, 따라서 사회가 어떻게 기능해야 하는지에 대해 큰 영향을 미쳤다.", "ok": true, "e": ["세금 징수원이 <b>막대한 세입<\/b>을 모아 사회에 큰 영향을 미쳤다는 내용입니다(4번)", "통치자들이 약해서 세입이 적었다는 글 전체의 흐름과 맞지 않습니다."]}, {"n": "④", "t": "Europeans would eventually develop strong systems of revenue collection, but it took them an awfully long time to do so.", "g": "유럽인들은 결국 강력한 세입 징수 시스템을 개발했지만, 그렇게 하는 데까지 지독하게 오랜 시간이 걸렸다.", "ok": false, "e": ["강력한 세입 징수 시스템을 만드는 데 오랜 시간이 걸렸다는 내용입니다(5번)", "앞에서 말한 <b>유럽의 약함(적은 세입)<\/b>에 대한 해결 방안으로 자연스럽게 이어집니다", "또 중국·이슬람 통치자와 비교하는 6번과도 이어집니다."]}, {"n": "⑤", "t": "In medieval times, and for part of the early modern era, Chinese emperors and Muslim caliphs were able to extract much more of economic production than any European ruler with the exception of small city-states.", "g": "중세 시대에, 그리고 초기 근대 시대의 일부 동안, 중국 황제들과 무슬림 칼리프들은 작은 도시 국가들을 제외하고 어떤 유럽 통치자보다 훨씬 더 많은 경제적 생산물을 얻을 수 있었다.", "ok": false, "e": ["중국 황제와 무슬림 칼리프가 유럽 통치자보다 훨씬 더 많은 경제적 생산물 년 11월 41번", "evn": [8, 10, 11], "ev_en": "Those who had sat quietly after watching the video experienced an average of six flashbacks; those who had played the game experienced an average of fewer than three. / The game soaked up the mental attention that might have otherwise moved those horrific memories to long-term memory, and so they were stored imperfectly or not at all. / At the end of the week, the adults returned to the lab, and those who had been lucky enough to play the game reported fewer psychiatric symptoms.", "ev_ko": [[8, "비디오를 본 후에, 조용히 앉아 있던 사람들은 평균 6개의 회상 장면을 경험했다. (하지만) 그 게임을 했던 사람들은 3개보다 더 적은 평균을(평균적으로 3개보다 더 적게) 경험했다."], [10, "그 게임은 그렇지 않았다면(게임을 하지 않았다면) 그 끔찍한 기억들을 장기 기억으로 옮겼을지도 모르는 정신적 주의력을 흡수했고, 따라서 그것들(끔찍한 기억들)은 불완전하게 저장되거나 전혀 저장되지 않았다."], [11, "그 주말에, 성인들(참가자들)은 실험실로 돌아왔고, 운 좋게 게임을 했던 사람들은 더 적은 정신병적인 증상들을 보고했다."]], "why": ["제목은 글 전체의 핵심 내용을 담아야 합니다", "5번에서 참가자의 절반은 비디오 게임을 하고 나머지 절반은 조용히 앉아 있었습니다", "8번에서 게임을 한 사람들은 회상 장면(플래시백)을 <b>평균 3개보다 적게<\/b> 경험했고, 조용히 앉아 있던 사람들은 평균 6개를 경험했습니다", "10번에서 게임이 정신적 주의력을 흡수해 끔찍한 기억이 장기 기억으로 옮겨지지 않았습니다", "11번에서 게임을 한 사람들은 정신병적인 증상을 <b>더 적게<\/b> 보고했습니다", "즉 비디오 게임이 무서운 기억을 사라지게 도울 수 있다는 ④가 제목입니다."], "ch": [{"n": "①", "t": "Is It Possible for Time to Heal Trauma?", "g": "시간으로 정신적 외상(트라우마)을 치료하는 게 가능할까?", "ok": false, "e": ["글이 비교한 것은 시간의 흐름이 아니라, 영상을 본 뒤 <b>게임을 했느냐 조용히 앉아 있었느냐<\/b>입니다(5번)", "시간이 트라우마를 치료하는지는 다루지 않습니다."]}, {"n": "②", "t": "Overcoming Your Bad Memories by Facing Them", "g": "나쁜 기억을 직면함으로써 그것들을 극복하는 것", "ok": false, "e": ["글의 핵심은 나쁜 기억을 직면해 극복하는 것이 아닙니다", "영상을 본 뒤 <b>비디오 게임<\/b>을 한 것이 기억과 증상에 미친 효과를 다룹니다(8·10·11번)."]}, {"n": "③", "t": "Video Games: Great Tools to Boost Your Brain Power", "g": "비디오 게임: 지적 능력을 끌어올리는 훌륭한 도구", "ok": false, "e": ["게임이 두뇌 능력을 끌어올린다는 내용은 없습니다", "게임의 효과는 끔찍한 기억이 <b>장기 기억으로 옮겨지지 않게<\/b> 한 것입니다(10번)."]}, {"n": "④", "t": "Playing Video Games Can Help Frightening Memories Go Away", "g": "비디오 게임을 하는 것은 무서운 기억을 사라지게 도울 수 있다", "ok": true, "e": ["게임을 한 사람들은 회상 장면(8번)과 정신병적인 증상(11번) , 마음속에서 다시 떠오르는 영상 속 장면들을 기억해 냈다는 뜻이에요.", "gist": "영상 장면이 마음속에서 다시 떠오르는 것을 매일 기록했다는 설정. 다음 문장의 결과 비교의 기준이 된다."}, {"n": 8, "ch": [{"e": "<b>Those who<\/b> had sat quietly", "k": "조용히 앉아 있었던 사람들은"}, {"e": "after watching the video", "k": "비디오를 본 후에"}, {"e": "experienced an average of six <b>flashbacks<\/b>;", "k": "평균 6개의 회상 장면(플래시백)을 경험했다;"}, {"e": "<b>those who<\/b> had played the game", "k": "(하지만) 그 게임을 했던 사람들은"}, {"e": "experienced an average of <b>fewer than three<\/b>.", "k": "평균 3개보다 더 적게 경험했다."}], "easy": "조용히 앉아 있던 사람들은 평균 6개의 플래시백을 겪었고, 게임을 한 사람들은 평균 3개도 안 겪었다는 뜻이에요.", "gist": "실험 결과 ①. 게임을 한 집단의 회상 장면이 훨씬 적다. (11번 제목의 근거)"}, {"n": 9, "ch": [{"e": "The <b>video game<\/b>,", "k": "그 <b>비디오 게임<\/b>이,"}, {"e": "with its colors and music and rotating blocks,", "k": "그것의<span class=\"r\">(= 비디오 게임의)<\/span> 색깔과 음악, 그리고 회전하는 블록들이 있는,"}, {"e": "<b>prevented<\/b> the initial traumatic memories", "k": "정신적 외상을 일으키는 초기의 기억들이"}, {"e": "from <b>solidifying<\/b>.", "k": "굳어지는 것을 막았다.<span class=\"r\">※ 문제지엔 빈칸(12번 정답)으로 되어 있음<\/span>"}], "easy": "색깔과 음악, 돌아가는 블록이 있는 그 게임이, 충격적인 기억이 머릿속에 굳어지는 것을 막았다는 뜻이에요.", "gist": "핵심 문장. 게임이 충격적인 기억이 굳어지는 것을 막았다는 것이 글의 요점이다(12번 빈칸 문장)."}, {"n": 10, "ch": [{"e": "The game <b>soaked up<\/b>", "k": "그 게임은 ~을 흡수했다"}, {"e": "the mental attention", "k": "정신적 주의력을"}, {"e": "that might have <b>otherwise<\/b> moved", "k": "그렇지 않았다면 옮겼을지도 모르는"}, {"e": "those <b>horrific<\/b> memories", "k": "그 끔찍한 기억들을"}, {"e": "to long-term memory,", "k": "장기 기억으로,"}, {"e": "and so they were stored", "k": "그리고 따라서 그것들은<span class=\"r\">(= 끔찍한 기억들은)<\/span> 저장되었다"}, {"e": "imperfectly or not at all.", "k": "불완전하게, 혹은 전혀 (저장되지) 않았다."}], "easy": "게임이 정신적 주의력을 차지해서, 게임이 없었다면 끔찍한 기억을 장기 기억으로 옮겼을지도 모를 주의력이 그쪽으로 못 갔어요. 그래서 그 기억은 불완전하게 저장되거나 아예 저장되지 않았다는 뜻이에요.", "gist": "이유 설명. 게임이 주의력을 차지해서 끔찍한 기억이 장기 기억으로 넘어가지 못했다는 내용이다. (11번 제목의 근거)", "link": "그 게임은 그렇지 않았다면(게임을 하지 않았다면) 그 끔찍한 기억들을 장기 기억으로 옮겼을지도 모르는 정신적 주의력을 흡수했고, 따라서 그것들(끔찍한 기억들)은 불완전하게 저장되거나 전혀 저장되지 않았다."}, {"n": en": false, "h": "오늘날의 대기 성분(산소 등)이 원시 생명체의 활동으로 만들어졌다는 2번의 내용을 보면, 오늘날의 대기는 생명체를 지탱하는 조건일 뿐 아니라 그 자체가 '생명체의 결과(a consequence of life)'이기도 하다는 것을 알 수 있다."}], "opts": [{"n": "①", "t": "a barrier to evolution", "a": false, "x": true, "trap": false, "e": "대기가 진화의 장애물이라는 내용은 본문과 무관하다."}, {"n": "②", "t": "a consequence of life", "a": true, "x": false, "trap": false, "e": "오늘날의 대기 성분이 원시 생명체의 활동으로 만들어졌다는 2번의 내용과 정확히 일치한다."}, {"n": "③", "t": "a record of primitive culture", "a": false, "x": true, "trap": false, "e": "원시 '문화'의 기록이라는 내용은 본문과 무관하다."}, {"n": "④", "t": "a sign of the constancy of nature", "a": false, "x": true, "trap": true, "e": "오히려 본문은 대기가 계속 '변화'해 왔다는 내용이므로 불변성(constancy)과는 반대된다."}, {"n": "⑤", "t": "a reason for cooperation among species", "a": false, "x": true, "trap": false, "e": "종들 간의 협력(cooperation)에 관한 내용은 본문에 없다."}], "w": [["primordial", "원시의, 원시적인"], ["water vapo(u)r", "수증기"], ["carbon dioxide", "이산화탄소"], ["sulfur dioxide", "이산화황"], ["organism", "생물체, 유기체, 생물"], ["microbe", "미생물"], ["liberate", "(화합물에서) 유리시키다, 해방하다"], ["emergence", "출현, 등장"], ["concentration", "농도, 집중"], ["sustain", "유지하다, 지속하다, 견디다"], ["constancy", "불변성, 항상성"]]}, {"q": "08", "type": "빈칸", "src": "2021년 11월 33번", "ans": "③", "tr": [["1", "대륙 내륙 지역의 기후에 관해 말하자면, 산맥은 ___________."], ["2", "이것의 좋은 예는 미국 서해안을 따라 볼 수 있다."], ["3", "태평양에서 육지 쪽으로 이동하는 공기는 보통 많은 수분을 그 안에 지니고 있다."], ["4", "이 습한 공기가 육지를 가로질러 이동할 때, 그것은 코스트산맥과 마주친다."], ["5", "공기가 산 위로 이동하면서 그것은 식기 시작하고, 이는 산의 풍상측에 강수를 일으킨다."], ["6", "공기가 산의 반대쪽, 즉 풍하측이라고 불리는 곳으로 내려갈 때쯤에는 그것은 많은 수분을 잃어버린 상태이다."], ["7", "공기는 계속 이동해서 더 높은 시에라네바다산맥과 부딪힌다."], ["8", "이 두 번째 상승은 남아 있는 수분 대부분을 공기로부터 빠져나오게 하고, 그래서 그것이 시에라산맥의 풍하측에 도달할 때쯤 공기는 극도로 건조해진다."], ["9", "그 결과 네바다주 대부분이 사막이라는 것이다."]], "evh": "5·6·8번 문장", "ev": [{"en": true, "h": "As the air moves up and over the mountains, it begins to cool, which causes precipitation on the windward side of the mountains. / Once the air moves down the opposite side ~ it has lost a great deal of moisture. / This second uplift causes most of the remaining moisture to fall out of the air ~"}, {"en": false, "h": "산을 넘으며 공기 중 수분이 비로 떨어지고(5번) 반대편으로 내려갈 때는 이미 수분을 잃은 상태이며(6번), 두 번째 산맥을 넘으며 남은 수분마저 다 잃는다는(8번) 내용을 종합하면, 산맥은 '수분의 흐름을 막는 데 큰 역할을 한다'는 ③번이 빈칸에 가장 적절하다."}], "opts": [{"n": "①", "t": "increase annual rainfall in dry regions", "a": false, "x": true, "trap": false, "e": "건조한 지역의 연간 강우량을 '늘린다'는 내용이 아니라, 오히려 산맥 반대편을 건조하게 만든다는 내용이다."}, {"n": "②", "t": "prevent drastic changes in air temperature", "a": false, "x": true, "trap": false, "e": "기온의 급격한 변화를 막는다는 내용은 본문에 없다."}, {"n": "③", "t": "play a huge role in stopping the flow of moisture", "a": true, "x": false, "trap": false, "e": "산을 넘으며 공기가 수분을 잃고 반대편은 건조해진다는 5·6·8번의 내용과 정확히 일치한다."}, {"n": "④", "t": "change wind speed as air ascends and descends them", "a": false, "x": true, "trap": false, "e": "풍속 변화(wind speed)에 관한 내용은 본문에 없다."}, {"n": "⑤", "t": "equalize the amount of moisture of surrounding land areas", "a": false, "x": true, "trap": true, "e": "오히려 산맥 양쪽의 수분량은 크게 달라지므로, 균등하게 한다는 내용과 반대된다."}], "w": [["interior", "내륙의, 내부의"], ["continent", "대륙"], ["moisture", "수분, 습기"], ["humid", "습한"], ["encounter", "~와 마주치다"], ["precipitation", "강수, 강수량"], ["windward", "풍상측(風上側)의, 바람이 불어오는 쪽"], ["leeward", "풍하측(風下側)의, 바람이 불어가는 쪽"], ["uplift", "상승, 융기"], ["ascend", "상승하다, 올라가다"], ["descend", "하강하다, 내려오다"]]}, {"q": "09", "type": "순서", "src": "2016년 3월 36번", "ans": "②", "tr": [["1", "나는 매일 각 수업 시간마다 무작위로 두 명의 학생을 선발하여 '공식 질문자'라는 직함을 준다. 이 학생들은 그 수업 시간 동안 적어도 한 가지 질문을 해야 하는 책임을 부여받는다."], ["2", "(B) 그날의 공식 질문자였던 학생 중 한 명인 Carrie가 어느 날 내 사무실로 나를 찾아왔다. 그저 어색함을 깨려고, 나는 쾌활하게 물었다. \"이번 학기의 첫 번째 공식 질문자들 중 한 명으로 지명된 것이 영광스러웠나요?\""], ["3", "(A) 진지한 어조로, 그녀는 학기 초에 내가 그녀를 지명했을 때 극도로 긴장했었다고 대답했다. 하지만 그러고 나서, 그 수업 시간 동안 그녀는 다른 강의 때 느꼈던 것과는 다르게 느꼈다."], ["4", "(C) 그것은 다른 강의들과 다를 바 없는 강의였지만, 이번에는, 그녀 말로는, 그녀가 어쩔 수 없이 더 높은 의식 수준을 가지게 되었다고 했다. 그녀는 강의와 토론의 내용을 더 잘 인식하게 되었다. 그녀는 또한 그 결과 그 수업에서 더 많은 것을 얻었다고 인정했다."]], "evh": "(B)의 질문 + (A)의 대답", "ev": [{"en": true, "h": "I asked in a lighthearted way, \"Did you feel honored ~?\" → In a serious tone, she answered that she'd been extremely nervous ~"}, {"en": false, "h": "주어진 글에서 '공식 질문자' 제도를 소개한 뒤, (B)에서 Carrie가 공식 질문자 역할을 마치고 사무실로 찾아와 필자가 가벼운 질문을 던지는 장면이 이어진다. (A)는 그 질문에 대한 Carrie의 진지한 대답이며, (C)는 그 대답의 구체적인 내용(수업에서 의식 수준이 높아졌다는 것)을 이어서 설명하므로 (B)-(A)-(C) 순서가 자연스럽다."}], "opts": [{"n": "①", "t": "(A)-(C)-(B)", "a": false, "x": true, "trap": false, "e": "(A)의 '그녀가 대답했다'는 내용은 (B)의 질문이 먼저 나온 뒤에야 이어질 수 있으므로, (A)가 (B)보다 먼저 올 수 없다."}, {"n": "②", "t": "(B)-(A)-(C)", "a": true, "x": false, "trap": false, "e": "(B)에서 필자가 가벼운 질문을 던지고, (A)에서 Carrie가 진지하게 대답하며, (C)에서 그 대답의 구체적 내용을 이어가는 순서가 자연스럽다."}, {"n": "③", "t": "(B)-(C)-(A)", "a": false, "x": true, "trap": false, "e": "(C)는 (A)에서 언급된 '다르게 느꼈다'는 내용을 구체화하는 문단이므로 (A) 뒤에 와야 한다."}, {"n": "④", "t": "(C)-(A)-(B)", "a": false, "x": true, "trap": true, "e": "(C)의 '이번에는'이라는 표현은 (A)의 상황을 전제로 하므로 (C)가 (A)보다 먼저 올 수 없다."}, {"n": "⑤", "t": "(C)-(B)-(A)", "a": false, "x": true, "trap": false, "e": "같은 이유로 (C)가 가장 먼저 나올 수 없다."}], "w": [["select", "선발하다, 고르다"], ["assigned", "할당된"], ["responsibility", "책임"], ["break the ice", "어색함을 깨다"], ["lighthearted", "쾌활한, 명랑한"], ["semester", "학기"], ["appoint", "지명하다, 임명하다"], ["force", "억지로 ~하다, 강요하다"], ["consciousness", "의식, 자각"], ["admit", "인정하다, 시인하다"]]}, {"q": "10", "type": "무관한 문장", "src": "2023년 9월 35번", "ans": "③", "tr": [["1", "유럽 초기 민주주의의 아이러니는, 그것이 성행하고 번영했던 것은 정확히 유럽의 통치자들이 아주 오랫동안 놀라울 정도로 약했기 때문이라는 데 있다."], ["2", "① 로마 멸망 이후 천 년 넘게, 유럽의 통치자들은 백성들이 무엇을 생산하고 있는지 파악하고 이를 근거로 상당한 세금을 부과할 능력이 부족했다."], ["3", "② 유럽의 취약함을 보여 주는 가장 극명한 방법은 그들이 얼마나 적은 세입을 거두었는지를 보여 주는 것이다."], ["4", "③ 이런 이유로, 유럽의 세금 징수원들은 막대한 양의 세입을 거둘 수 있었고, 그래서 사회가 어떻게 기능해야 하는지에 큰 영향력을 지녔다."], ["5", "④ 유럽인들은 결국 강력한 세입 징수 시스템을 발전시키게 되지만, 그렇게 하는 데는 지독히도 오랜 시간이 걸렸다."], ["6", "⑤ 중세 시대, 그리고 근대 초기의 일부 동안, 중국의 황제들과 이슬람의 칼리프들은 소규모 도시국가를 제외한 어떤 유럽 통치자보다도 훨씬 더 많은 경제적 생산물을 거두어들일 수 있었다."]], "evh": "첫 문장·②번 문장", "ev": [{"en": true, "h": "The irony ~ is that i   h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});try{var _m=String(FILE).match(/^(\d\d)([ab])$/);if(_m&&window.WN)WN.hw('미니모고 '+(GCODE==='h2'?'고2':'고1'),(+_m[1])*2-(_m[2]==='a'?1:0),s+'/'+N);}catch(e){}
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
