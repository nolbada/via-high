ans\"><span class=\"n\">⑤</span><span class=\"t\">(C) – (B) – (A)<small>also(또한)가 부작용 → 영양소 균형 → 시기 순으로 하나씩 더해져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C) 먼저는 맞아요. 하지만 (A) 3번 these key macronutrients(이러한 필수 다량 영양소)가 (B)보다 먼저 나와서 ‘이러한’이 가리킬 영양소가 앞에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글은 열량 이야기라 영양소가 아직 안 나왔어요. (A)의 these key macronutrients(이러한 필수 다량 영양소)가 가리킬 대상이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">(C)의 Calorie restriction(열량 제한)은 주어진 글의 caloric deficit(열량 부족) 부작용을 also(또한)로 하나 더 붙이는 말이라 주어진 글 바로 뒤여야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">(C)의 Calorie restriction can also(열량 제한은 또한)는 주어진 글의 열량 부족 부작용에 하나를 더하는 말이라 주어진 글 바로 뒤여야 해요. (B)가 먼저 오면 영양소 이야기 뒤에 갑자기 열량 부작용으로 돌아가요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Some fad diets might have you</div><div class=\"k\">몇몇 유행하는 다이어트는 당신이 ~하게 할 수 있는데,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">running a caloric deficit</span>,</div><div class=\"k\"><span class=\"cw\">열량 부족에 시달리게</span></div></div><div class=\"rc\"><div class=\"e\">and while this might encourage weight loss,</div><div class=\"k\">이것(= 열량 부족)은 체중 감소를 촉진할 수는 있으나,</div></div><div class=\"rc\"><div class=\"e\">it has no effect on improving body composition,</div><div class=\"k\">체성분을 개선하는 데는 아무런 효과가 없으며,</div></div><div class=\"rc\"><div class=\"e\">and it could actually result in a loss of muscle mass.</div><div class=\"k\">실제로는 근육량의 감소를 초래할 수도 있다.</div></div><div class=\"rnat\">몇몇 유행하는 다이어트는 당신이 열량 부족에 시달리게 할 수 있는데, 이것(열량 부족)은 체중 감소를 촉진할 수는 있으나, 체성분을 개선하는 데는 아무런 효과가 없으며, 실제로는 근육량의 감소를 초래할 수도 있다.</div><div class=\"rst\">옆 반 친구가 살 빼려고 밥을 확 줄였어요. 몸무게는 줄지만 근육도 빠져요. 지문 1번의 <b>열량 부족</b>(caloric deficit)이 바로 이거예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">2번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A) <span class=\"cw\">Timing is also important.</span></div><div class=\"k\">(A) <span class=\"cw\">시기도 중요하다.</span></div></div><div class=\"rnat\">(A) 시기도 중요하다.</div><div class=\"rst\">이제 <b>시기</b>(Timing)<b>도</b> 중요하대요. 무엇을 먹느냐에 이어 언제 먹느냐로 넘어가요. = 지문 (A).</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">By eating the right combinations</div><div class=\"k\">알맞은 조합을 섭취함으로써</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">of these key macronutrients</span></div><div class=\"k\"><span class=\"cw\">이러한 필수 다량 영양소의</span></div></div><div class=\"rc\"><div class=\"e\">at strategic intervals</div><div class=\"k\">전략적인 간격으로</div></div><div class=\"rc\"><div class=\"e\">throughout the day,</div><div class=\"k\">하루 중</div></div><div class=\"rc\"><div class=\"e\">we can help our bodies</div><div class=\"k\">우리는 우리의 신체를 도울 수 있다</div></div><div class=\"rc\"><div class=\"e\">heal and grow even faster.</div><div class=\"k\">훨씬 더 빠르게 치유되고 성장하도록.</div></div><div class=\"rnat\">(A) 하루 중 전략적인 간격으로 이러한 필수 다량 영양소의 알맞은 조합을 섭취함으로써, 우리는 우리의 신체가 훨씬 더 빠르게 치유되고 성장하도록 도울 수 있다.</div><div class=\"rst\">아침·점심·운동 뒤처럼 알맞은 때에 <b>이 영양소들</b>(these key macronutrients)을 잘 섞어 먹으면 몸이 더 빨리 회복해요. = 지문 3번.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">Your body also needs</span></div><div class=\"k\">(B) <span class=\"cw\">당신의 신체는 또한 필요로 한다</span></div></div><div class=\"rc\"><div class=\"e\">the right balance of key macronutrients</div><div class=\"k\">필수 다량 영양소의 적절한 균형을</div></div><div class=\"rc\"><div class=\"e\">to heal and grow stronger.</div><div class=\"k\">치유되고 더 강해지기 위해서.</div></div><div class=\"rnat\">(B) 당신의 신체는 또한 치유되고 더 강해지기 위해서 필수 다량 영양소의 적절한 균형을 필요로 한다.</div><div class=\"rst\">몸에는 열량만이 아니라 <b>또</b>(also) 영양소의 균형도 필요해요. = (B)의 필수 다량 영양소(macronutrients) 균형이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">These macronutrients,</div><div class=\"k\">이러한 다량 영양소는,</div></div><div class=\"rc\"><div class=\"e\">which include protein, carbohydrates, and healthy fats,</div><div class=\"k\">단백질, 탄수화물, 그리고 건강에 좋은 지방을 포함하는,</div></div><div class=\"rc\"><div class=\"e\">can help your body maximize its ability</div><div class=\"k\">당신의 신체가 그(= 신체)의 능력을 극대화하도록 도울 수 있다</div></div><div class=\"rc\"><div class=\"e\">to repair, rebuild, and grow stronger.</div><div class=\"k\">회복하고, 재건하고, 더 강해지기 위한</div></div><div class=\"rnat\">(B) 단백질, 탄수화물, 그리고 건강에 좋은 지방을 포함하는 이러한 다량 영양소는, 당신의 신체가 회복하고, 재건하고, 더 강해지기 위한 (그것의) 능력을 극대화하도록 도울 수 있다.</div><div class=\"rst\">이 영양소는 고기 속 단백질, 밥 속 탄수화물, 견과류 속 좋은 지방이에요. 지문 5번처럼 몸을 회복시키고 튼튼하게 해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">Calorie restriction can also cause</span></div><div class=\"k\">(C) <span class=\"cw\">열량 제한은 또한 ~하게 할 수도 있다</span></div></div><div class=\"rc\"><div class=\"e\">your metabolism to slow down,</div><div class=\"k\">당신의 신진대사를 느려지게</div></div><div class=\"rc\"><div class=\"e\">and significantly reduce energy levels.</div><div class=\"k\">그리고 에너지 수준을 현저히 감소시킬 수도 있다.</div></div><div class=\"rnat\">(C) 열량 제한은 또한 당신의 신진대사를 느려지게 할 수도 있고, 에너지 수준을 현저히 감소시킬 수도 있다.</div><div class=\"rst\">굶으니 그 친구는 <b>또</b>(also) 하루 종일 기운이 없고 몸도 느려져요. = 지문 (C)의 신진대사가 느려지고 에너지가 떨어진다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Controlling caloric intake</div><div class=\"k\">열량 섭취를 조절하는 것은</div></div><div class=\"rc\"><div class=\"e\">to deliver the proper amount of calories</div><div class=\"k\">적절한 양의 열량을 전달하기 위해</div></div><div class=\"rc\"><div class=\"e\">so that the body has the energy</div><div class=\"k\">신체가 에너지를 가질 수 있도록</div></div><div class=\"rc\"><div class=\"e\">it needs to function and heal</div><div class=\"k\">그것(= 신체)이 (제대로) 기능하고 치유되기 위해서 필요로 하는</div></div><div class=\"rc\"><div class=\"e\">is the only proper approach.</div><div class=\"k\">(다이어트에서) 유일한 올바른 접근법이다.</div></div><div class=\"rnat\">(C) 신체가 (제대로) 기능하고 치유되기 위해서 그것(신체)이 필요로 하는 에너지를 가질 수 있도록, 적절한 양의 열량을 전달하기 위해 열량 섭취를 조절하는 것은 (다이어트에서) 유일한 올바른 접근법이다.</div><div class=\"rst\">그래서 무작정 굶기보다, 몸이 움직이고 회복할 만큼 열량을 맞춰 먹는 게 유일한 정답이에요. = 지문 7번.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fad diet\" data-m=\"유행 다이어트\"><b>fad diet</b>유행 다이어트</button><button type=\"button\" class=\"wdb\" data-w=\"caloric deficit\" data-m=\"열량 부족\"><b>caloric deficit</b>열량 부족</button><button type=\"button\" class=\"wdb\" data-w=\"body composition\" data-m=\"체성분\"><b>body composition</b>체성분</button><button type=\"button\" class=\"wdb\" data-w=\"metabolism\" data-m=\"신진대사\"><b>metabolism</b>신진대사</button><button type=\"button\" class=\"wdb\" data-w=\"calorie restriction\" data-m=\"열량 제한\"><b>calorie restriction</b>열량 제한</button><button type=\"button\" class=\"wdb\" data-w=\"macronutrient\" data-m=\"다량 영양소\"><b>macronutrient</b>다량 영양소</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심을 <b>말만 바꿔 옮긴 것</b>이에요. 요약문의 <b>Unlike</b>(~와 달리) 대조 그대로, (A)는 수용도 높은 문화(2·3번), (B)는 수용도 낮은 문화(5번)에서 짝을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 권력 거리의 뜻</span><div class=\"en\">It relates to the degree to which the less powerful members of a society <mark>accept their inequality</mark> in power and consider it the norm.</div><p class=\"ko\">권력 거리는 사회에서 권력이 약한 구성원들이 <mark>권력에서의 불평등을 받아들이고</mark> 그것을 일반적인 것이라고 여기는 정도와 관련이 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>수용도 높은 문화 = 불평등을 당연히 받아들임 → (A)</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 · (A)의 근거</span><div class=\"en\">In cultures with high acceptance of power distance … people are <mark>not viewed as equals</mark>, and everyone has a clearly defined or allocated place in the social hierarchy.</div><p class=\"ko\">권력 거리에 대한 수용도가 높은 문화들에서 … 사람들은 <mark>동등한 존재로 여겨지지 않으며</mark>, 모든 사람은 사회 계급 속에서 분명히 규정된 혹은 할당된 지위를 갖는다.</p></div><div class=\"ck-via\"><i>▼</i><span>수용도 낮은 문화 = 계급 안에서 움직이기 쉬움 → (B)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · (B)의 근거</span><div class=\"en\">In these cultures, there is <mark>more fluidity</mark> within the social hierarchy, and it is relatively easy for individuals to <mark>move up the social hierarchy</mark> …</div><p class=\"ko\">이러한 문화들에서는, 사회 계급 안에 <mark>더 많은 유동성</mark>이 있으며, 개인들이 <mark>사회 계급을 상승시키는 것</mark>이 상대적으로 쉽다 …</p></div><div class=\"ck-via\"><i>▼</i><span>accept(받아들이다) = (A) willing(기꺼이 하는), fluidity(유동성) = (B) mobility(이동성)</span></div><div class=\"ck-step\"><span class=\"lab\">요약문 (6번) · 짝 맞추기</span><div class=\"en\">Unlike cultures with high acceptance of power distance, where members are more <mark>willing</mark> to accept inequality, cultures with low acceptance of power distance allow more <mark>mobility</mark> within the social hierarchy.</div><p class=\"ko\">구성원들이 불평등을 (A) <mark>좀 더 기꺼이 받아들이는</mark> 문화들과 달리, 수용도가 낮은 문화들은 사회 계급 내에서 더 많은 (B) <mark>유동성</mark>을 허용한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">willing 기꺼이 하는 … mobility 이동성<small>2번 accept(받아들이다) → willing(기꺼이 하는), 5번 fluidity(유동성) → mobility(이동성)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">reluctant 꺼리는 … flexibility 유연성</span><span class=\"why\">(B) flexibility(유연성)가 5번 fluidity(유동성)와 비슷해서 끌려요. 하지만 (A) reluctant(꺼리는)는 2번 accept their inequality(불평등을 받아들이다)와 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">willing 기꺼이 하는 … assistance 도움</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 5번은 계급을 오르내리는 fluidity(유동성)를 말했지, 서로 돕는 assistance(도움) 얘기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">reluctant 꺼리는 … resistance 저항</span><span class=\"why\">둘 다 틀려요. 2·3번은 불평등을 accept(받아들이다)한다고 했으니 reluctant(꺼리는)는 반대이고, 5번 fluidity(유동성)는 resistance(저항)와 거리가 멀어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">afraid 두려워하는 … openness 개방성</span><span class=\"why\">(A) afraid(두려워하는)는 근거가 없어요. 2번은 불평등을 norm(일반적인 것)으로 여긴다고 했어요. (B)도 5번의 ‘계급을 올라가는 이동’을 콕 짚지 못해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Power distance is the term</div><div class=\"k\">'권력 거리'는 용어이다</div></div><div class=\"rc\"><div class=\"e\">used to refer to</div><div class=\"k\">나타내기 위해 사용되는</div></div><div class=\"rc\"><div class=\"e\">how widely an unequal distribution of power</div><div class=\"k\">권력의 불평등한 분배가 얼마나 넓게</div></div><div class=\"rc\"><div class=\"e\">is accepted</div><div class=\"k\">받아들여지는지를</div></div><div class=\"rc\"><div class=\"e\">by the members of a culture.</div><div class=\"k\">한 문화의 사람들에 의해.</div></div><div class=\"rnat\">‘권력 거리’는 권력의 불평등한 분배가 한 문화의 사람들에 의해 얼마나 넓게 받아들여지는지를 나타내기 위해 사용되는 용어이다.</div><div class=\"rst\">동아리마다 분위기가 달라요. 선배 말이 곧 법인 곳도, 아닌 곳도 있죠. 지문은 이 힘 차이를 받아들이는 정도를 <b>권력 거리</b>(power distance)라 불러요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">It relates to the degree</div><div class=\"k\">권력 거리는 정도와 관련이 있다</div></div><div class=\"rc\"><div class=\"e\">to which the less powerful members of a society</div><div class=\"k\">사회에서 권력이 상대적으로 약한 구성원들이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">accept their inequality in power</span></div><div class=\"k\"><span class=\"cw\">권력에서의 불평등을 받아들이고</span></div></div><div class=\"rc\"><div class=\"e\">and consider it the norm.</div><div class=\"k\">그것(= 불평등)을 일반적인 것이라고 여기는.</div></div><div class=\"rnat\">권력 거리는 사회에서 권력이 상대적으로 약한 구성원들이 권력에서의 불평등을 받아들이고 그것을 일반적인 것이라고 여기는 정도와 관련이 있다.</div><div class=\"rst\">후배들이 “선배가 정하는 게 당연하지” 하고 <b>받아들이는</b>(accept) 정도예요. = 지문 2번의 불평등을 일반적인 것으로 여기는 정도.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">In cultures with high acceptance of power distance</div><div class=\"k\">권력 거리에 대한 수용도가 높은 문화들에서</div></div><div class=\"rc\"><div class=\"e\">(e.g., India, Brazil, Greece, Mexico, and the Philippines),</div><div class=\"k\">(예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀),</div></div><div class=\"rc\"><div class=\"e\">people are not viewed as equals,</div><div class=\"k\">사람들은 동등한 존재로 여겨지지 않으며,</div></div><div class=\"rc\"><div class=\"e\">and everyone has a clearly defined or allocated place</div><div class=\"k\">모든 사람은 분명히 규정된 혹은 할당된 지위를 갖는다</div></div><div class=\"rc\"><div class=\"e\">in the social hierarchy.</div><div class=\"k\">사회 계급 속에서.</div></div><div class=\"rnat\">권력 거리에 대한 수용도가 높은 문화들에서 (예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀), 사람들은 동등한 존재로 여겨지지 않으며, 모든 사람은 사회 계급 속에서 분명히 규정된 혹은 할당된 지위를 갖는다.</div><div class=\"rst\">축구부는 선배·후배 자리가 딱 정해져 있고, 다들 그게 당연하대요. = 지문 3번의 수용도 높은 문화(인도, 브라질 등)예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">In cultures with low acceptance of power distance</div><div class=\"k\">권력 거리에 대한 수용도가 낮은 문화들에서</div></div><div class=\"rc\"><div class=\"e\">(e.g., Finland, Norway, New Zealand, and Israel),</div><div class=\"k\">(예를 들어, 핀란드, 노르웨이, 뉴질랜드, 그리고 이스라엘),</div></div><div class=\"rc\"><div class=\"e\">people believe inequality should be minimal,</div><div class=\"k\">사람들은 불평등은 최소한이어야 한다고 믿으며,</div></div><div class=\"rc\"><div class=\"e\">and a hierarchical division is viewed</div><div class=\"k\">계급 구분은 여겨진다</div></div><div class=\"rc\"><div class=\"e\">as one of convenience only.</div><div class=\"k\">오로지 편의를 위한 것으로.</div></div><div class=\"rnat\">권력 거리에 대한 수용도가 낮은 문화들에서 (예를 들어, 핀란드, 노르웨이, 뉴질랜드, 그리고 이스라엘), 사람들은 불평등은 최소한이어야 한다고 믿으며, 계급 구분은 오로지 편의를 위한 것으로 여겨진다.</div><div class=\"rst\">밴드부는 “선후배 구분은 그냥 편하려고 있는 거야” 하고 여겨요. = 지문 4번의 수용도 낮은 문화(핀란드, 노르웨이 등)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">In these cultures,</div><div class=\"k\">이러한 문화들(= 권력 거리에 대한 수용도가 낮은 문화들)에서는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">there is more fluidity within the social hierarchy,</span></div><div class=\"k\"><span class=\"cw\">사회 계급 안에 더 많은 유동성이 있으며,</span></div></div><div class=\"rc\"><div class=\"e\">and it is relatively easy</div><div class=\"k\">상대적으로 쉽다</div></div><div class=\"rc\"><div class=\"e\">for individuals to move up the social hierarchy</div><div class=\"k\">개인들이 사회 계급을 상승시키는 것이</div></div><div class=\"rc\"><div class=\"e\">based on their individual efforts and achievements.</div><div class=\"k\">그들의 개인적 노력과 성과를 기반으로.</div></div><div class=\"rnat\">이러한 문화들(권력 거리에 대한 수용도가 낮은 문화들)에서는, 사회 계급 안에 더 많은 유동성이 있으며, 개인들이 그들의 개인적 노력과 성과를 기반으로 사회 계급을 상승시키는 것이 상대적으로 쉽다.</div><div class=\"rst\">밴드부는 열심히 하면 신입도 금방 부장이 돼요. 자리가 술술 바뀌는 것, 지문 5번의 <b>유동성</b>(fluidity)이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Unlike cultures with high acceptance of power distance,</div><div class=\"k\">권력 거리에 대한 수용도가 높은 문화들과 달리,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">where members are more willing to accept inequality,</span></div><div class=\"k\"><span class=\"cw\">그곳에서는 구성원들이 불평등을 좀 더 기꺼이 받아들이는</span> ※ 문제지엔 (A) 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">cultures with low acceptance of power distance</div><div class=\"k\">권력 거리에 대한 수용도가 낮은 문화들은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">allow more mobility within the social hierarchy.</span></div><div class=\"k\"><span class=\"cw\">사회 계급 내에서 더 많은 유동성을 허용한다.</span> ※ 문제지엔 (B) 빈칸으로 되어 있음</div></div><div class=\"rnat\">구성원들이 불평등을 좀 더 (A)기꺼이 받아들이는, 권력 거리에 대한 수용도가 높은 문화들과 달리, 권력 거리에 대한 수용도가 낮은 문화들은 사회 계급 내에서 더 많은 (B)유동성을 허용한다.</div><div class=\"rst\">정리하면 축구부는 불평등을 <b>기꺼이</b>(willing) 받아들이고, 밴드부는 자리 <b>이동</b>(mobility)이 자유로워요. 지문 2·5번을 옮긴 요약이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"power distance\" data-m=\"권력 거리\"><b>power distance</b>권력 거리</button><button type=\"button\" class=\"wdb\" data-w=\"norm\" data-m=\"일반적인 것, 규범\"><b>norm</b>일반적인 것, 규범</button><button type=\"button\" class=\"wdb\" data-w=\"allocate\" data-m=\"할당하다\"><b>allocate</b>할당하다</button><button type=\"button\" class=\"wdb\" data-w=\"hierarchy\" data-m=\"계급, 위계\"><b>hierarchy</b>계급, 위계</button><button type=\"button\" class=\"wdb\" data-w=\"fluidity\" data-m=\"유동성\"><b>fluidity</b>유동성</button><button type=\"button\" class=\"wdb\" data-w=\"mobility\" data-m=\"이동성\"><b>mobility</b>이동성</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장이 <b>뒤 문장의 지시어에 무엇을 넘겨주는지</b> 보세요. ‘환상을 현실로 착각할 수 없었다’가 먼저 있어야 6번 <b>But</b>(그러나)과 <b>just such an illusion</b>(바로 그러한 착각)이 이어져요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\">As long as <mark>the irrealism of the silent black and white film</mark> predominated, one could not take <mark>filmic fantasies</mark> for representations of reality.</div><p class=\"ko\"><mark>무성 흑백 영화의 비현실주의가</mark> 우세한 한, 개인은 <mark>영화의 환상을</mark> 현실의 표현으로 여길 수 없었다.</p></div><div class=\"ck-via\"><i>▼</i><span>소리·색채가 영화를 ‘현실 전달 장치’로 바꿀 위험이 여기서 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 앞 문장 (④ 바로 앞)</span><div class=\"en\">… potentially transforming film into a mere delivery device <mark>for representations of reality</mark>.</div><p class=\"ko\">… 잠재적으로 영화를 <mark>현실의 표현을 위한</mark> 단지 전달 장치로 변형시키면서.</p></div><div class=\"ck-via\"><i>▼</i><span>But(그러나) = 흑백 시절과 대조, just such an illusion(바로 그러한 착각) = 환상을 현실로 여기는 것</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 뒤 문장 (④ 바로 뒤)</span><div class=\"en\"><mark>But</mark> sound and color threatened to create <mark>just such an illusion</mark>, thereby destroying the very essence of film art.</div><p class=\"ko\"><mark>그러나</mark> 소리와 색채는 <mark>바로 그러한 착각</mark>을 만들겠다고 위협했고, 그로 인해 영화 예술의 정수를 파괴했다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>소리·색채가 영화를 현실 전달 장치로 바꿀 위험</span><span><em>주어진 문장</em>흑백 무성 영화 땐 환상을 현실로 착각할 수 없었음</span><span><em>6번</em>그러나 소리·색채가 바로 그 착각을 만들려 함</span></div><div class=\"ck-eq\">⇒ 위험 → 흑백 시절엔 착각 없음 → 그러나 소리·색채가 착각을 만듦 = ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">5번 문장과 6번 문장 사이<small>6번 just such an illusion(바로 그러한 착각)이 가리킬 말이 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">6번 just such an illusion(바로 그러한 착각)이 주어진 문장보다 먼저 나오면, ‘그러한’이 가리킬 착각이 앞에 없어요. 7번 Arnheim(아른하임)의 말은 6번을 받쳐 주는 마무리예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">3번 This is why(이것이 ~한 이유이다)는 2번 ‘영화는 환상을 드러내서 가치 있다’를 바로 받아야 해요. 사이에 끼면 이 고리가 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">4번 these innovations(이러한 혁신)는 3번의 technical innovations(기술적인 혁신)를 바로 받아야 해서 끼어들 틈이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">5번 And what's worse(그리고 설상가상으로)는 4번 ‘혁신은 불필요했다’에 더 나쁜 점을 덧붙이는 말이라 4·5번은 붙어 있어야 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">As long as</div><div class=\"k\">~하는 한</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the irrealism of the silent black and white film</span></div><div class=\"k\"><span class=\"cw\">무성 흑백 영화의 비현실주의가</span></div></div><div class=\"rc\"><div class=\"e\">predominated,</div><div class=\"k\">우세한,</div></div><div class=\"rc\"><div class=\"e\">one could not take</div><div class=\"k\">개인은 여길 수 없었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">filmic fantasies</span></div><div class=\"k\"><span class=\"cw\">영화의 환상을</span></div></div><div class=\"rc\"><div class=\"e\">for representations of reality.</div><div class=\"k\">현실의 표현으로.</div></div><div class=\"rnat\">무성 흑백 영화의 비현실주의가 우세하는 한, 개인은 영화의 환상을 현실의 표현으로 여길 수 없었다.</div><div class=\"rst\">〈주어진 문장〉 할머니랑 본 옛 흑백 무성 영화는 누가 봐도 꾸민 이야기라 현실로 <b>착각할 수 없었어요</b>. = 지문의 환상을 현실로 못 여김.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Cinema is valuable</div><div class=\"k\">영화는 가치가 있다</div></div><div class=\"rc\"><div class=\"e\">not for its ability to make visible</div><div class=\"k\">볼 수 있게 하는 그것의 능력 때문이 아니라</div></div><div class=\"rc\"><div class=\"e\">the hidden outlines of our reality,</div><div class=\"k\">우리의 현실에 숨겨진 윤곽을</div></div><div class=\"rc\"><div class=\"e\">but for its ability to reveal</div><div class=\"k\">드러내는 능력 때문에</div></div><div class=\"rc\"><div class=\"e\">what reality itself veils —</div><div class=\"k\">현실 그 자체가 가리고 있는 것,</div></div><div class=\"rc\"><div class=\"e\">the dimension of fantasy.</div><div class=\"k\">즉 환상의 차원을.</div></div><div class=\"rnat\">영화는 우리의 현실에 숨겨진 윤곽을 볼 수 있게 하는 그것의 능력 때문이 아니라, 현실 그 자체가 가리고 있는 것, 즉 환상의 차원을 드러내는 능력 때문에 가치가 있다.</div><div class=\"rst\">영화가 소중한 건 현실을 그대로 찍어서가 아니라, 현실이 가린 <b>환상</b>(fantasy)을 보여 줘서예요. = 지문 2번.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This is why,</div><div class=\"k\">이것이 ~한 이유이다,</div></div><div class=\"rc\"><div class=\"e\">to a person,</div><div class=\"k\">한 목소리로</div></div><div class=\"rc\"><div class=\"e\">the first great theorists of film decried</div><div class=\"k\">최초의 위대한 영화 이론가들이 공공연히 비난했던</div></div><div class=\"rc\"><div class=\"e\">the introduction of sound and other technical innovations</div><div class=\"k\">소리와 다른 기술적인 혁신의 도입을</div></div><div class=\"rc\"><div class=\"e\">(such as color)</div><div class=\"k\">(색채와 같은)</div></div><div class=\"rc\"><div class=\"e\">that pushed film in the direction of realism.</div><div class=\"k\">영화를 현실주의의 방향으로 밀어 넣은.</div></div><div class=\"rnat\">① 이것이 최초의 위대한 영화 이론가들이 한 목소리로 영화를 현실주의의 방향으로 밀어 넣은 소리와 (색채와 같은) 다른 기술적인 혁신의 도입을 공공연히 비난했던 이유이다.</div><div class=\"rst\"><b>그래서</b>(This is why) 초기 영화 이론가들은 소리·색채처럼 영화를 진짜처럼 만드는 기술을 한목소리로 비난했어요. = 지문 3번.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Since cinema was an entirely fantasmatic art,</div><div class=\"k\">영화가 전적으로 환상의 예술이었기 때문에,</div></div><div class=\"rc\"><div class=\"e\">these innovations were completely unnecessary.</div><div class=\"k\">이러한 혁신은 완전히 불필요했다.</div></div><div class=\"rnat\">② 영화가 전적으로 환상의 예술이었기 때문에, 이러한 혁신은 완전히 불필요했다.</div><div class=\"rst\">영화는 원래 꿈 같은 환상의 예술이라 <b>이러한 혁신</b>(these innovations)은 필요 없었다는 거예요. = 지문 4번.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">And what’s worse,</div><div class=\"k\">그리고 설상가상으로,</div></div><div class=\"rc\"><div class=\"e\">they could do nothing but turn</div><div class=\"k\">그것들(= 이러한 혁신)은 ~하게 하는 것 외에는 아무것도 할 수 없었다</div></div><div class=\"rc\"><div class=\"e\">filmmakers and audiences away</div><div class=\"k\">영화 제작자들과 관객들이 등을 돌리게</div></div><div class=\"rc\"><div class=\"e\">from the fantasmatic dimension of cinema,</div><div class=\"k\">영화의 환상의 차원으로부터,</div></div><div class=\"rc\"><div class=\"e\">potentially transforming film</div><div class=\"k\">잠재적으로 영화를 변형시키면서</div></div><div class=\"rc\"><div class=\"e\">into a mere delivery device</div><div class=\"k\">단지 전달 장치로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">for representations of reality.</span></div><div class=\"k\"><span class=\"cw\">현실의 표현을 위한.</span></div></div><div class=\"rnat\">③ 그리고 설상가상으로, 그것들은 잠재적으로 영화를 단지 현실의 표현을 위한 전달 장치로 변형시키면서, 영화 제작자들과 관객들이 영화의 환상의 차원에서 등을 돌리게 하는 것 외에는 아무것도 할 수 없었다.</div><div class=\"rst\"><b>설상가상으로</b>(what's worse) 그 기술은 영화를 현실을 그대로 옮기는 배달 상자로 바꿀 수도 있었어요. = 지문 5번.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But sound and color threatened to create</span></div><div class=\"k\"><span class=\"cw\">그러나 소리와 색채는 만들겠다고 위협했고</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">just such an illusion,</span></div><div class=\"k\"><span class=\"cw\">바로 그러한 착각</span>(= 영화의 환상을 현실의 표현으로 여기는 것)을,</div></div><div class=\"rc\"><div class=\"e\">thereby destroying</div><div class=\"k\">그로 인해 파괴했다</div></div><div class=\"rc\"><div class=\"e\">the very essence of film art.</div><div class=\"k\">바로 그 영화 예술의 정수를.</div></div><div class=\"rnat\">④ 그러나 소리와 색채는 바로 그러한 착각(영화의 환상을 현실의 표현으로 여기는 것)을 만들겠다고 위협했고, 그로 인해 바로 그 영화 예술의 정수를 파괴했다.</div><div class=\"rst\"><b>그러나</b>(But) 소리와 색이 들어가자 영화를 진짜로 믿는 <b>바로 그런 착각</b>(just such an illusion)이 생길 판이었어요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">As Rudolf Arnheim puts it,</div><div class=\"k\">Rudolf Arnheim이 말하듯이,</div></div><div class=\"rc\"><div class=\"e\">“The creative power of the artist</div><div class=\"k\">“예술가의 창의력은</div></div><div class=\"rc\"><div class=\"e\">can only come into play</div><div class=\"k\">오로지 작용할 수 있다</div></div><div class=\"rc\"><div class=\"e\">where reality and the medium of representation</div><div class=\"k\">현실과 표현의 매개가</div></div><div class=\"rc\"><div class=\"e\">do not coincide.”</div><div class=\"k\">일치하지 않는 곳에서만.”</div></div><div class=\"rnat\">⑤ Rudolf Arnheim이 말하듯이, “예술가의 창의력은 오로지 현실과 표현의 매개가 일치하지 않는 곳에서만 작용할 수 있다.”</div><div class=\"rst\">아른하임(Arnheim)의 말처럼, 현실과 화면이 똑같지 않을 때 예술가의 창의력이 살아나요. = 지문 7번의 마지막 인용.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"irrealism\" data-m=\"비현실주의\"><b>irrealism</b>비현실주의</button><button type=\"button\" class=\"wdb\" data-w=\"predominate\" data-m=\"우세하다, 지배적이다\"><b>predominate</b>우세하다, 지배적이다</button><button type=\"button\" class=\"wdb\" data-w=\"veil\" data-m=\"가리다, 감추다\"><b>veil</b>가리다, 감추다</button><button type=\"button\" class=\"wdb\" data-w=\"fantasmatic\" data-m=\"환상의\"><b>fantasmatic</b>환상의</button><button type=\"button\" class=\"wdb\" data-w=\"illusion\" data-m=\"착각, 환상\"><b>illusion</b>착각, 환상</button><button type=\"button\" class=\"wdb\" data-w=\"coincide\" data-m=\"일치하다\"><b>coincide</b>일치하다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 순서는 <b>앞 단락 끝을 받는 말</b>로 이어 붙이는 문제예요. said no(아니라고 말했다) → <b>why</b>(왜), invited(청했다) → <b>suggestion</b>(제안), 칠 때까지 던짐 → <b>finally</b>(마침내).</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝 · 3번</span><div class=\"en\">… but Jason hung his head and <mark>said no</mark>.</div><p class=\"ko\">… Jason은 고개를 숙이며 <mark>아니라고 말했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>said no(아니라고 말했다) → 왜 그랬는지 궁금함</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 첫 번째 고리</span><div class=\"en\">(D) Bob wondered <mark>why Jason said no</mark>, …</div><p class=\"ko\">(D) Bob은 <mark>왜 Jason이 아니라고 했는지</mark> 궁금해 했고 …</p></div><div class=\"ck-via\"><i>▼</i><span>(D) 끝 7번 invited(청했다) = (C)의 suggestion(제안)</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 두 번째 고리</span><div class=\"en\">(C) <mark>At the coach’s suggestion</mark>, Jason was very excited, …</div><p class=\"ko\">(C) <mark>코치의 제안에</mark>, Jason은 매우 신이 났고 …</p></div><div class=\"ck-via\"><i>▼</i><span>투수가 칠 수 있을 때까지 계속 던져 줌</span></div><div class=\"ck-step\"><span class=\"lab\">(C) 끝 · 11번</span><div class=\"en\">… and kept throwing <mark>until he could hit one</mark>.</div><p class=\"ko\">… <mark>그가 하나(= 공)를 쳐낼 수 있게 될 때까지</mark> 계속해서 던져주었다.</p></div><div class=\"ck-via\"><i>▼</i><span>칠 때까지 던짐 → 마침내 침</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 세 번째 고리</span><div class=\"en\">(B) When Jason <mark>finally hit the ball</mark> after seven swings, …</div><p class=\"ko\">(B) Jason이 일곱 번의 스윙 후에 <mark>마침내 공을 쳐 냈을 때</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(D) – (C) – (B)<small>거절 → 이유 묻기 → 코치 제안 → 마침내 침, 시간 순서가 그대로 이어져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">(D)를 먼저 둔 건 맞아요. 하지만 (C) 11번에서 투수가 칠 때까지 던져 줘야 (B) 12번 finally hit(마침내 쳤다)가 이어져요. 코치의 제안도 (D) 7번 바로 뒤여야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(A)는 캐치볼을 거절한 장면으로 끝나는데, (B)는 갑자기 finally hit the ball(마침내 공을 쳤다)로 시작해요. 아직 야구장에 가지도 않았어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(C)의 the coach's suggestion(코치의 제안)이 나오려면 코치가 먼저 나와야 하는데, 코치는 (D) 7번에서야 등장해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(A) 3번 said no(아니라고 말했다)는 (D) 4번 why Jason said no(왜 아니라고 했는지)가 바로 받아야 해요. (C)가 끼면 코치도 모르는 채 제안이 나와요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">(A) Jason was ten years old</div><div class=\"k\">(A) Jason은 열 살이었고</div></div><div class=\"rc\"><div class=\"e\">and loved baseball,</div><div class=\"k\">야구를 좋아했지만,</div></div><div class=\"rc\"><div class=\"e\">but he suffered from physical disabilities.</div><div class=\"k\">그(= Jason)는 신체장애로 고통 받고 있었다.</div></div><div class=\"rnat\">(A)(1) Jason은 열 살이었고 야구를 좋아했지만, 그는 신체장애로 고통 받고 있었다.</div><div class=\"rst\">(A) 열 살 제이슨(Jason)은 야구를 정말 좋아하지만 몸이 불편해요. 이 이야기의 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">His father, Bob,</div><div class=\"k\">그의 아버지 Bob은</div></div><div class=\"rc\"><div class=\"e\">wanted to protect (a) him,</div><div class=\"k\">(a)그(= Jason)를 보호하고 싶었고,</div></div><div class=\"rc\"><div class=\"e\">and so he played catch with him</div><div class=\"k\">그래서 그는 아들과 캐치볼을 했다</div></div><div class=\"rc\"><div class=\"e\">in their back yard</div><div class=\"k\">그들의 뒷마당에서</div></div><div class=\"rc\"><div class=\"e\">and avoided any community games.</div><div class=\"k\">그리고 그 어떤 동네 시합도 피했다.</div></div><div class=\"rnat\">(A)(2) 그의 아버지 Bob은 (a)그(Jason)를 보호하고 싶었고, 그래서 그는 그들의 뒷마당에서 아들과 캐치볼을 하며 그 어떤 동네 시합도 피했다.</div><div class=\"rst\">아빠 밥(Bob)은 아들을 지키고 싶어서 뒷마당에서만 캐치볼을 하고, 동네 시합은 피했어요. = 지문 2번.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">One day Bob got home from work</div><div class=\"k\">어느 날 Bob은 직장에서 집으로 돌아와</div></div><div class=\"rc\"><div class=\"e\">and asked Jason</div><div class=\"k\">Jason에게 물어보았지만</div></div><div class=\"rc\"><div class=\"e\">if he wanted to play catch,</div><div class=\"k\">캐치볼을 하고 싶은지,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but Jason hung his head and said no.</span></div><div class=\"k\"><span class=\"cw\">Jason은 고개를 숙이며 아니라고 말했다.</span></div></div><div class=\"rnat\">(A)(3) 어느 날 Bob은 직장에서 집으로 돌아와 Jason에게 캐치볼을 하고 싶은지 물어보았지만, Jason은 고개를 숙이며 아니라고 말했다.</div><div class=\"rst\">어느 날 퇴근한 아빠가 “캐치볼 할래?” 하자, 제이슨은 고개를 푹 숙이고 <b>싫다고</b>(said no) 해요. (A)는 여기서 끝나요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">(D) Bob wondered</div><div class=\"k\">(D) Bob은 궁금해 했고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">why Jason said no,</span></div><div class=\"k\"><span class=\"cw\">왜 Jason이 아니라고 했는지,</span></div></div><div class=\"rc\"><div class=\"e\">and when (e) he asked,</div><div class=\"k\">(e)그(= Bob)가 물어보자,</div></div><div class=\"rc\"><div class=\"e\">Jason started to cry:</div><div class=\"k\">Jason은 울기 시작했다:</div></div><div class=\"rc\"><div class=\"e\">“I want to play on a team, Daddy.</div><div class=\"k\">“나도 팀에서 경기하고 싶어요, 아빠.</div></div><div class=\"rc\"><div class=\"e\">Why won’t you let me play with the other kids?”</div><div class=\"k\">왜 제가 다른 애들하고 시합하게 허락해주시지 않는 거예요?”</div></div><div class=\"rnat\">(D)(1) Bob은 왜 Jason이 아니라고 했는지 궁금해 했고, (e)그(Bob)가 물어보자, Jason은 울기 시작했다. “나도 팀에서 경기하고 싶어요, 아빠. 왜 제가 다른 애들하고 시합하게 허락해주시지 않는 거예요?”</div><div class=\"rst\">(D) 아빠는 <b>왜 싫다고 했는지</b>(why Jason said no) 궁금해 물어요. 제이슨은 울며 “저도 팀에서 뛰고 싶어요!” 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Although Bob was worried</div><div class=\"k\">Bob은 염려했음에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">that Jason might be teased or mocked</div><div class=\"k\">Jason이 놀림을 받거나 조롱을 당할까봐</div></div><div class=\"rc\"><div class=\"e\">by the other kids,</div><div class=\"k\">다른 애들에게,</div></div><div class=\"rc\"><div class=\"e\">he decided to take the risk,</div><div class=\"k\">그는 위험을 감수하기로 했고,</div></div><div class=\"rc\"><div class=\"e\">and so he brought Jason</div><div class=\"k\">그래서 그는 Jason을 데리고 갔다</div></div><div class=\"rc\"><div class=\"e\">to the town baseball field</div><div class=\"k\">마을 야구장으로</div></div><div class=\"rc\"><div class=\"e\">that evening.</div><div class=\"k\">그날 저녁.</div></div><div class=\"rnat\">(D)(2) Bob은 Jason이 다른 애들에게 놀림을 받거나 조롱을 당할까봐 염려했음에도 불구하고, 그는 위험을 감수하기로 했고, 그래서 그는 그날 저녁 Jason을 마을 야구장으로 데리고 갔다.</div><div class=\"rst\">아빠는 아이들이 놀릴까 봐 걱정했지만, 용기를 내 그날 저녁 동네 야구장에 데려가요. = 지문 5번.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">When they arrived at the field,</div><div class=\"k\">그들이 경기장에 도착했을 때,</div></div><div class=\"rc\"><div class=\"e\">it turned out</div><div class=\"k\">알고 보니</div></div><div class=\"rc\"><div class=\"e\">that a baseball game was about to start.</div><div class=\"k\">야구 시합이 막 시작되려고 하는 중이었다.</div></div><div class=\"rnat\">(D)(3) 그들이 경기장에 도착했을 때, 야구 시합이 막 시작되려고 하는 모습이 보였다.</div><div class=\"rst\">도착해 보니 마침 시합이 막 시작하려던 참이었어요. = 지문 6번.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Bob talked to the coach about Jason,</div><div class=\"k\">Bob은 Jason에 대해 코치에게 말했고,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and the coach invited Jason to play.</span></div><div class=\"k\"><span class=\"cw\">코치는 Jason에게 경기하자고 청했다.</span></div></div><div class=\"rnat\">(D)(4) Bob은 Jason에 대해 코치에게 말했고, 코치는 Jason에게 경기하자고 청했다.</div><div class=\"rst\">아빠가 코치에게 제이슨 얘기를 하자, 코치가 “같이 뛰자!” 하고 <b>청해요</b>(invited). (D)는 여기서 끝나요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">At the coach’s suggestion,</span></div><div class=\"k\">(C) <span class=\"cw\">코치의 제안에,</span></div></div><div class=\"rc\"><div class=\"e\">Jason was very excited,</div><div class=\"k\">Jason은 매우 신이 났고,</div></div><div class=\"rc\"><div class=\"e\">and (c) he hurried to put on</div><div class=\"k\">(c)그(= Jason)는 서둘러 착용했다</div></div><div class=\"rc\"><div class=\"e\">his baseball gear.</div><div class=\"k\">그의 야구 장비를.</div></div><div class=\"rnat\">(C)(1) 코치의 제안에, Jason은 매우 신이 났고, (c)그(Jason)는 서둘러 그의 야구 장비를 착용했다.</div><div class=\"rst\">(C) <b>코치의 제안에</b>(At the coach's suggestion) 제이슨은 신이 나서 서둘러 야구 장비를 입어요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Most of the kids on the town team</div><div class=\"k\">마을 팀에 속한 대부분의 아이들은</div></div><div class=\"rc\"><div class=\"e\">recognized Jason from school,</div><div class=\"k\">학교에서 (보아서) Jason을 알고 있었지만,</div></div><div class=\"rc\"><div class=\"e\">but no one from the other team</div><div class=\"k\">다른 팀의 그 누구도</div></div><div class=\"rc\"><div class=\"e\">knew him.</div><div class=\"k\">그(= Jason)를 알지 못했다.</div></div><div class=\"rnat\">(C)(2) 마을 팀에 속한 대부분의 아이들은 학교에서 (보아서) Jason을 알고 있었지만, 다른 팀의 그 누구도 그(Jason)를 알지 못했다.</div><div class=\"rst\">마을 팀 아이들은 학교에서 제이슨을 알았지만, 상대 팀은 아무도 몰랐어요. = 지문 9번.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">However, they could see</div><div class=\"k\">하지만, 그들은 알 수 있었다</div></div><div class=\"rc\"><div class=\"e\">that (d) he was different</div><div class=\"k\">(d)그(= Jason)가 (보통 아이와는) 다르다는 것을</div></div><div class=\"rc\"><div class=\"e\">by the way he moved</div><div class=\"k\">그가 움직이는 방식을 통해</div></div><div class=\"rc\"><div class=\"e\">as he ran onto the field</div><div class=\"k\">그가 경기장에 뛰어 들어올 때</div></div><div class=\"rc\"><div class=\"e\">to hit the ball for his team.</div><div class=\"k\">팀을 위해 공을 치러.</div></div><div class=\"rnat\">(C)(3) 하지만, 그들은 그가 팀을 위해 공을 치러 경기장에 뛰어 들어올 때 그가 움직이는 방식을 통해 (d)그(Jason)가 (보통 아이와는) 다르다는 것을 알 수 있었다.</div><div class=\"rst\">그래도 상대 팀은 제이슨이 공을 치러 뛰어 들어오는 모습을 보고 남들과 다르다는 걸 알아챘어요. = 지문 10번.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">To make it easier for Jason,</div><div class=\"k\">Jason이 더 쉽게 (경기)할 수 있도록,</div></div><div class=\"rc\"><div class=\"e\">the pitcher moved in closer,</div><div class=\"k\">투수는 조금 더 가까이 다가서서,</div></div><div class=\"rc\"><div class=\"e\">threw the ball gently,</div><div class=\"k\">공을 부드럽게 던져주었고,</div></div><div class=\"rc\"><div class=\"e\">and kept throwing</div><div class=\"k\">계속해서 던져주었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">until he could hit one.</span></div><div class=\"k\"><span class=\"cw\">그가 하나(= 공)를 쳐낼 수 있게 될 때까지.</span></div></div><div class=\"rnat\">(C)(4) Jason이 더 쉽게 (경기)할 수 있도록, 투수는 조금 더 가까이 다가서서, 공을 부드럽게 던져주었고, 그가 (공) 하나를 쳐낼 수 있게 될 때까지 계속해서 던져주었다.</div><div class=\"rst\">투수가 가까이 와서 공을 살살, 제이슨이 <b>칠 때까지 계속</b>(kept throwing) 던져 줘요. (C)는 여기서 끝나요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">When Jason finally hit the ball</span></div><div class=\"k\">(B) <span class=\"cw\">Jason이 마침내 공을 쳐 냈을 때</span></div></div><div class=\"rc\"><div class=\"e\">after seven swings,</div><div class=\"k\">일곱 번의 스윙 후에,</div></div><div class=\"rc\"><div class=\"e\">it didn’t go far,</div><div class=\"k\">그것(= 공)은 멀리 가지 않았지만,</div></div><div class=\"rc\"><div class=\"e\">but the kids who knew Jason</div><div class=\"k\">Jason을 아는 아이들은</div></div><div class=\"rc\"><div class=\"e\">started yelling,</div><div class=\"k\">소리치기 시작했다,</div></div><div class=\"rc\"><div class=\"e\">“Run, Jason! Run!”</div><div class=\"k\">“달려, Jason! 달려!”</div></div><div class=\"rnat\">(B)(1) Jason이 일곱 번의 스윙 후에 마침내 공을 쳐 냈을 때, 그것은 멀리 가지 않았지만, Jason을 아는 아이들은 “달려, Jason! 달려!”라고 소리치기 시작했다.</div><div class=\"rst\">(B) 일곱 번 휘두른 끝에 <b>마침내</b>(finally) 공을 쳐요. 멀리 안 갔지만 아는 아이들이 “달려, 제이슨!” 외쳐요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Their voices were soon joined</div><div class=\"k\">그들의 목소리는 곧 합쳐졌다</div></div><div class=\"rc\"><div class=\"e\">by those of all the players,</div><div class=\"k\">모든 선수들의 목소리들과,</div></div><div class=\"rc\"><div class=\"e\">on both teams.</div><div class=\"k\">양 팀의.</div></div><div class=\"rnat\">(B)(2) 그들의 목소리는 곧 양 팀의 모든 선수들의 목소리들과 합쳐졌다.</div><div class=\"rst\">곧 양 팀 선수 모두의 목소리가 그 응원에 합쳐져요. = 지문 13번.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Everyone was cheering</div><div class=\"k\">모두가 환호하고 있었고</div></div><div class=\"rc\"><div class=\"e\">and Jason’s face glowed</div><div class=\"k\">Jason의 얼굴이 밝아졌다</div></div><div class=\"rc\"><div class=\"e\">when (b) he finally scored.</div><div class=\"k\">(b)그(= Jason)가 마침내 득점하자.</div></div><div class=\"rnat\">(B)(3) 모두가 환호하고 있었고 (b)그(Jason)가 마침내 득점하자 Jason의 얼굴이 밝아졌다.</div><div class=\"rst\">모두가 환호하고, 제이슨이 드디어 득점하자 얼굴이 환하게 빛나요. = 지문 14번.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">He shouted,</div><div class=\"k\">그는 소리쳤다.</div></div><div class=\"rc\"><div class=\"e\">“I did it Daddy! I did it!”</div><div class=\"k\">“내가 해냈어요. 아빠! 내가 해냈어요!”</div></div><div class=\"rnat\">(B)(4) 그는 소리쳤다. “내가 해냈어요. 아빠! 내가 해냈어요!”</div><div class=\"rst\">제이슨이 “아빠, 제가 해냈어요!” 하고 소리쳐요. = 지문 15번.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Tears slid down Bob’s cheeks</div><div class=\"k\">눈물이 Bob의 뺨에 흘러내렸다</div></div><div class=\"rc\"><div class=\"e\">as he hugged</div><div class=\"k\">그가 껴안아주며</div></div><div class=\"rc\"><div class=\"e\">his joyful son.</div><div class=\"k\">기뻐하는 그의 아들을.</div></div><div class=\"rnat\">(B)(5) 기뻐하는 그의 아들을 껴안아주며 눈물이 Bob의 뺨에 흘러내렸다.</div><div class=\"rst\">아빠는 기뻐하는 아들을 꼭 안아 주며 눈물을 흘려요. 이야기의 마지막 장면이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"tease\" data-m=\"놀리다\"><b>tease</b>놀리다</button><button type=\"button\" class=\"wdb\" data-w=\"mock\" data-m=\"조롱하다\"><b>mock</b>조롱하다</button><button type=\"button\" class=\"wdb\" data-w=\"take the risk\" data-m=\"위험을 감수하다\"><b>take the risk</b>위험을 감수하다</button><button type=\"button\" class=\"wdb\" data-w=\"suggestion\" data-m=\"제안\"><b>suggestion</b>제안</button><button type=\"button\" class=\"wdb\" data-w=\"gently\" data-m=\"부드럽게\"><b>gently</b>부드럽게</button><button type=\"button\" class=\"wdb\" data-w=\"glow\" data-m=\"환하게 빛나다\"><b>glow</b>환하게 빛나다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>그 문장 안의 행동</b>으로 누구인지 확인하세요. (e)는 <b>wondered</b>(궁금해했다)와 <b>asked</b>(물었다)의 주인공이라 아빠 밥이고, 나머지는 모두 아들 제이슨이에요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · 2번 문장</span><div class=\"en\">His father, Bob, wanted to protect <mark>(a) him</mark>, and so he played catch with him …</div><p class=\"ko\">그의 아버지 Bob은 <mark>(a)그(= Jason)를</mark> 보호하고 싶었고, 그래서 아들과 캐치볼을 했다 … → Jason</p></div><div class=\"ck-via\"><i>▼</i><span>궁금해한 사람 = 물어본 사람 = 밥, 대답하며 운 사람은 제이슨</span></div><div class=\"ck-step key\"><span class=\"lab\">(e) · 4번 문장 · 결정적 단서</span><div class=\"en\">(D) <mark>Bob wondered</mark> why Jason said no, and <mark>when (e) he asked</mark>, Jason started to cry</div><p class=\"ko\">(D) <mark>Bob은 궁금해 했고</mark> 왜 Jason이 아니라고 했는지, <mark>(e)그(= Bob)가 물어보자</mark>, Jason은 울기 시작했다 → Bob</p></div><div class=\"ck-via\"><i>▼</i><span>코치의 제안에 신난 사람 = 장비를 입는 사람</span></div><div class=\"ck-step\"><span class=\"lab\">(c) · 8번 문장</span><div class=\"en\">At the coach’s suggestion, Jason was very excited, and <mark>(c) he</mark> hurried to put on his baseball gear.</div><p class=\"ko\">코치의 제안에, Jason은 매우 신이 났고, <mark>(c)그(= Jason)는</mark> 서둘러 그의 야구 장비를 착용했다. → Jason</p></div><div class=\"ck-via\"><i>▼</i><span>they(그들) = 상대 팀, 그들이 알아본 사람 = 9번의 him(그)</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · 10번 문장</span><div class=\"en\">However, they could see that <mark>(d) he</mark> was different by the way he moved …</div><p class=\"ko\">하지만, 그들은 <mark>(d)그(= Jason)가</mark> 다르다는 것을 알 수 있었다 … → Jason</p></div><div class=\"ck-via\"><i>▼</i><span>얼굴이 빛난 제이슨 = 득점한 사람</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · 14번 문장</span><div class=\"en\">Everyone was cheering and Jason’s face glowed when <mark>(b) he</mark> finally scored.</div><p class=\"ko\">모두가 환호하고 있었고 <mark>(b)그(= Jason)가</mark> 마침내 득점하자 Jason의 얼굴이 밝아졌다. → Jason</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(e) he 그 = 아버지 밥<small>궁금해서 물어본 사람이 밥이고, 대답하며 운 사람이 제이슨이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) he 그 = 제이슨</span><span class=\"why\">8번 앞에 coach(코치)가 나와서 코치로 착각하기 쉬워요. 하지만 신이 나서 장비를 입은 건 경기에 초대받은 제이슨이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) him 그를 = 제이슨</span><span class=\"why\">2번 주어 밥이 보호하고 싶은 대상은 아들이에요. 뒤에서 그와 캐치볼을 했다고 하니 (a) him(그를) = 제이슨이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) he 그 = 제이슨</span><span class=\"why\">14번 Jason's face glowed(제이슨의 얼굴이 밝아졌다) 바로 뒤라 득점한 (b) he(그) = 제이슨이에요. 15번에서 “아빠, 해냈어요!”라고 외쳐요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) he 그 = 제이슨</span><span class=\"why\">10번 they(그들)는 9번의 상대 팀이고, 그들이 다르다고 알아본 (d) he(그)는 9번 him(그) = 제이슨이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A) Jason was ten years old</div><div class=\"k\">(A) Jason은 열 살이었고</div></div><div class=\"rc\"><div class=\"e\">and loved baseball,</div><div class=\"k\">야구를 좋아했지만,</div></div><div class=\"rc\"><div class=\"e\">but he suffered from physical disabilities.</div><div class=\"k\">그(= Jason)는 신체장애로 고통 받고 있었다.</div></div><div class=\"rnat\">(A)(1) Jason은 열 살이었고 야구를 좋아했지만, 그는 신체장애로 고통 받고 있었다.</div><div class=\"rst\">(A) 열 살 제이슨(Jason)은 야구를 정말 좋아하지만 몸이 불편해요. 이 이야기의 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">His father, Bob,</div><div class=\"k\">그의 아버지 Bob은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">wanted to protect (a) him,</span></div><div class=\"k\"><span class=\"cw\">(a)그(= Jason)를 보호하고 싶었고,</span></div></div><div class=\"rc\"><div class=\"e\">and so he played catch with him</div><div class=\"k\">그래서 그는 아들과 캐치볼을 했다</div></div><div class=\"rc\"><div class=\"e\">in their back yard</div><div class=\"k\">그들의 뒷마당에서</div></div><div class=\"rc\"><div class=\"e\">and avoided any community games.</div><div class=\"k\">그리고 그 어떤 동네 시합도 피했다.</div></div><div class=\"rnat\">(A)(2) 그의 아버지 Bob은 (a)그(Jason)를 보호하고 싶었고, 그래서 그는 그들의 뒷마당에서 아들과 캐치볼을 하며 그 어떤 동네 시합도 피했다.</div><div class=\"rst\">아빠 밥(Bob)은 아들을 지키고 싶어 뒷마당에서만 캐치볼을 했어요. 보호받는 사람은 아들이라 <b>(a) 그 = 제이슨</b>이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">One day Bob got home from work</div><div class=\"k\">어느 날 Bob은 직장에서 집으로 돌아와</div></div><div class=\"rc\"><div class=\"e\">and asked Jason</div><div class=\"k\">Jason에게 물어보았지만</div></div><div class=\"rc\"><div class=\"e\">if he wanted to play catch,</div><div class=\"k\">캐치볼을 하고 싶은지,</div></div><div class=\"rc\"><div class=\"e\">but Jason hung his head and said no.</div><div class=\"k\">Jason은 고개를 숙이며 아니라고 말했다.</div></div><div class=\"rnat\">(A)(3) 어느 날 Bob은 직장에서 집으로 돌아와 Jason에게 캐치볼을 하고 싶은지 물어보았지만, Jason은 고개를 숙이며 아니라고 말했다.</div><div class=\"rst\">어느 날 퇴근한 아빠가 “캐치볼 할래?” 하자, 제이슨은 고개를 푹 숙이고 <b>싫다고</b>(said no) 해요. (A)는 여기서 끝나요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(D) Bob wondered</span></div><div class=\"k\"><span class=\"cw\">(D) Bob은 궁금해 했고</span></div></div><div class=\"rc\"><div class=\"e\">why Jason said no,</div><div class=\"k\">왜 Jason이 아니라고 했는지,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and when (e) he asked,</span></div><div class=\"k\"><span class=\"cw\">(e)그(= Bob)가 물어보자,</span></div></div><div class=\"rc\"><div class=\"e\">Jason started to cry:</div><div class=\"k\">Jason은 울기 시작했다:</div></div><div class=\"rc\"><div class=\"e\">“I want to play on a team, Daddy.</div><div class=\"k\">“나도 팀에서 경기하고 싶어요, 아빠.</div></div><div class=\"rc\"><div class=\"e\">Why won’t you let me play with the other kids?”</div><div class=\"k\">왜 제가 다른 애들하고 시합하게 허락해주시지 않는 거예요?”</div></div><div class=\"rnat\">(D)(1) Bob은 왜 Jason이 아니라고 했는지 궁금해 했고, (e)그(Bob)가 물어보자, Jason은 울기 시작했다. “나도 팀에서 경기하고 싶어요, 아빠. 왜 제가 다른 애들하고 시합하게 허락해주시지 않는 거예요?”</div><div class=\"rst\">(D) 아빠가 왜 싫다는지 궁금해서 <b>물어요</b>(asked). 물은 사람은 아빠라 <b>(e) 그 = 밥</b>! 대답하며 운 건 제이슨이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Although Bob was worried</div><div class=\"k\">Bob은 염려했음에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">that Jason might be teased or mocked</div><div class=\"k\">Jason이 놀림을 받거나 조롱을 당할까봐</div></div><div class=\"rc\"><div class=\"e\">by the other kids,</div><div class=\"k\">다른 애들에게,</div></div><div class=\"rc\"><div class=\"e\">he decided to take the risk,</div><div class=\"k\">그는 위험을 감수하기로 했고,</div></div><div class=\"rc\"><div class=\"e\">and so he brought Jason</div><div class=\"k\">그래서 그는 Jason을 데리고 갔다</div></div><div class=\"rc\"><div class=\"e\">to the town baseball field</div><div class=\"k\">마을 야구장으로</div></div><div class=\"rc\"><div class=\"e\">that evening.</div><div class=\"k\">그날 저녁.</div></div><div class=\"rnat\">(D)(2) Bob은 Jason이 다른 애들에게 놀림을 받거나 조롱을 당할까봐 염려했음에도 불구하고, 그는 위험을 감수하기로 했고, 그래서 그는 그날 저녁 Jason을 마을 야구장으로 데리고 갔다.</div><div class=\"rst\">아빠는 아이들이 놀릴까 봐 걱정했지만, 용기를 내 그날 저녁 동네 야구장에 데려가요. = 지문 5번.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">When they arrived at the field,</div><div class=\"k\">그들이 경기장에 도착했을 때,</div></div><div class=\"rc\"><div class=\"e\">it turned out</div><div class=\"k\">알고 보니</div></div><div class=\"rc\"><div class=\"e\">that a baseball game was about to start.</div><div class=\"k\">야구 시합이 막 시작되려고 하는 중이었다.</div></div><div class=\"rnat\">(D)(3) 그들이 경기장에 도착했을 때, 야구 시합이 막 시작되려고 하는 모습이 보였다.</div><div class=\"rst\">도착해 보니 마침 시합이 막 시작하려던 참이었어요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Bob talked to the coach about Jason,</div><div class=\"k\">Bob은 Jason에 대해 코치에게 말했고,</div></div><div class=\"rc\"><div class=\"e\">and the coach invited Jason to play.</div><div class=\"k\">코치는 Jason에게 경기하자고 청했다.</div></div><div class=\"rnat\">(D)(4) Bob은 Jason에 대해 코치에게 말했고, 코치는 Jason에게 경기하자고 청했다.</div><div class=\"rst\">아빠가 코치에게 제이슨 얘기를 하자, 코치가 “같이 뛰자!” 하고 <b>청해요</b>(invited). (D)는 여기서 끝나요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">(C) At the coach’s suggestion,</div><div class=\"k\">(C) 코치의 제안에,</div></div><div class=\"rc\"><div class=\"e\">Jason was very excited,</div><div class=\"k\">Jason은 매우 신이 났고,</div></div><div class=\"rc\"><div class=\"e\">and (c) he hurried to put on</div><div class=\"k\">(c)그(= Jason)는 서둘러 착용했다</div></div><div class=\"rc\"><div class=\"e\">his baseball gear.</div><div class=\"k\">그의 야구 장비를.</div></div><div class=\"rnat\">(C)(1) 코치의 제안에, Jason은 매우 신이 났고, (c)그(Jason)는 서둘러 그의 야구 장비를 착용했다.</div><div class=\"rst\">(C) 코치의 제안에 신이 나서 장비를 입은 건 초대받은 제이슨이에요. 그래서 <b>(c) 그 = 제이슨</b>이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Most of the kids on the town team</div><div class=\"k\">마을 팀에 속한 대부분의 아이들은</div></div><div class=\"rc\"><div class=\"e\">recognized Jason from school,</div><div class=\"k\">학교에서 (보아서) Jason을 알고 있었지만,</div></div><div class=\"rc\"><div class=\"e\">but no one from the other team</div><div class=\"k\">다른 팀의 그 누구도</div></div><div class=\"rc\"><div class=\"e\">knew him.</div><div class=\"k\">그(= Jason)를 알지 못했다.</div></div><div class=\"rnat\">(C)(2) 마을 팀에 속한 대부분의 아이들은 학교에서 (보아서) Jason을 알고 있었지만, 다른 팀의 그 누구도 그(Jason)를 알지 못했다.</div><div class=\"rst\">마을 팀 아이들은 학교에서 제이슨을 알았지만, 상대 팀은 아무도 몰랐어요. = 지문 9번.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">However, they could see</div><div class=\"k\">하지만, 그들은 알 수 있었다</div></div><div class=\"rc\"><div class=\"e\">that (d) he was different</div><div class=\"k\">(d)그(= Jason)가 (보통 아이와는) 다르다는 것을</div></div><div class=\"rc\"><div class=\"e\">by the way he moved</div><div class=\"k\">그가 움직이는 방식을 통해</div></div><div class=\"rc\"><div class=\"e\">as he ran onto the field</div><div class=\"k\">그가 경기장에 뛰어 들어올 때</div></div><div class=\"rc\"><div class=\"e\">to hit the ball for his team.</div><div class=\"k\">팀을 위해 공을 치러.</div></div><div class=\"rnat\">(C)(3) 하지만, 그들은 그가 팀을 위해 공을 치러 경기장에 뛰어 들어올 때 그가 움직이는 방식을 통해 (d)그(Jason)가 (보통 아이와는) 다르다는 것을 알 수 있었다.</div><div class=\"rst\">상대 팀(they 그들)은 공 치러 뛰어오는 모습을 보고 다르다는 걸 알아챘어요. 다르게 움직인 <b>(d) 그 = 제이슨</b>이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">To make it easier for Jason,</div><div class=\"k\">Jason이 더 쉽게 (경기)할 수 있도록,</div></div><div class=\"rc\"><div class=\"e\">the pitcher moved in closer,</div><div class=\"k\">투수는 조금 더 가까이 다가서서,</div></div><div class=\"rc\"><div class=\"e\">threw the ball gently,</div><div class=\"k\">공을 부드럽게 던져주었고,</div></div><div class=\"rc\"><div class=\"e\">and kept throwing</div><div class=\"k\">계속해서 던져주었다</div></div><div class=\"rc\"><div class=\"e\">until he could hit one.</div><div class=\"k\">그가 하나(= 공)를 쳐낼 수 있게 될 때까지.</div></div><div class=\"rnat\">(C)(4) Jason이 더 쉽게 (경기)할 수 있도록, 투수는 조금 더 가까이 다가서서, 공을 부드럽게 던져주었고, 그가 (공) 하나를 쳐낼 수 있게 될 때까지 계속해서 던져주었다.</div><div class=\"rst\">투수가 가까이 와서 공을 살살, 제이슨이 <b>칠 때까지 계속</b>(kept throwing) 던져 줘요. (C)는 여기서 끝나요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">(B) When Jason finally hit the ball</div><div class=\"k\">(B) Jason이 마침내 공을 쳐 냈을 때</div></div><div class=\"rc\"><div class=\"e\">after seven swings,</div><div class=\"k\">일곱 번의 스윙 후에,</div></div><div class=\"rc\"><div class=\"e\">it didn’t go far,</div><div class=\"k\">그것(= 공)은 멀리 가지 않았지만,</div></div><div class=\"rc\"><div class=\"e\">but the kids who knew Jason</div><div class=\"k\">Jason을 아는 아이들은</div></div><div class=\"rc\"><div class=\"e\">started yelling,</div><div class=\"k\">소리치기 시작했다,</div></div><div class=\"rc\"><div class=\"e\">“Run, Jason! Run!”</div><div class=\"k\">“달려, Jason! 달려!”</div></div><div class=\"rnat\">(B)(1) Jason이 일곱 번의 스윙 후에 마침내 공을 쳐 냈을 때, 그것은 멀리 가지 않았지만, Jason을 아는 아이들은 “달려, Jason! 달려!”라고 소리치기 시작했다.</div><div class=\"rst\">(B) 일곱 번 휘두른 끝에 <b>마침내</b>(finally) 공을 쳐요. 멀리 안 갔지만 아는 아이들이 “달려, 제이슨!” 외쳐요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">Their voices were soon joined</div><div class=\"k\">그들의 목소리는 곧 합쳐졌다</div></div><div class=\"rc\"><div class=\"e\">by those of all the players,</div><div class=\"k\">모든 선수들의 목소리들과,</div></div><div class=\"rc\"><div class=\"e\">on both teams.</div><div class=\"k\">양 팀의.</div></div><div class=\"rnat\">(B)(2) 그들의 목소리는 곧 양 팀의 모든 선수들의 목소리들과 합쳐졌다.</div><div class=\"rst\">곧 양 팀 선수 모두의 목소리가 그 응원에 합쳐져요. = 지문 13번.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Everyone was cheering</div><div class=\"k\">모두가 환호하고 있었고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and Jason’s face glowed</span></div><div class=\"k\"><span class=\"cw\">Jason의 얼굴이 밝아졌다</span></div></div><div class=\"rc\"><div class=\"e\">when (b) he finally scored.</div><div class=\"k\">(b)그(= Jason)가 마침내 득점하자.</div></div><div class=\"rnat\">(B)(3) 모두가 환호하고 있었고 (b)그(Jason)가 마침내 득점하자 Jason의 얼굴이 밝아졌다.</div><div class=\"rst\">모두가 환호하고, 득점하자 제이슨의 얼굴이 환하게 빛나요. 득점한 <b>(b) 그 = 제이슨</b>이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">He shouted,</div><div class=\"k\">그는 소리쳤다.</div></div><div class=\"rc\"><div class=\"e\">“I did it Daddy! I did it!”</div><div class=\"k\">“내가 해냈어요. 아빠! 내가 해냈어요!”</div></div><div class=\"rnat\">(B)(4) 그는 소리쳤다. “내가 해냈어요. 아빠! 내가 해냈어요!”</div><div class=\"rst\">제이슨이 “아빠, 제가 해냈어요!” 하고 소리쳐요. = 지문 15번.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">Tears slid down Bob’s cheeks</div><div class=\"k\">눈물이 Bob의 뺨에 흘러내렸다</div></div><div class=\"rc\"><div class=\"e\">as he hugged</div><div class=\"k\">그가 껴안아주며</div></div><div class=\"rc\"><div class=\"e\">his joyful son.</div><div class=\"k\">기뻐하는 그의 아들을.</div></div><div class=\"rnat\">(B)(5) 기뻐하는 그의 아들을 껴안아주며 눈물이 Bob의 뺨에 흘러내렸다.</div><div class=\"rst\">아빠는 기뻐하는 아들을 꼭 안아 주며 눈물을 흘려요. 이야기의 마지막 장면이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"protect\" data-m=\"보호하다\"><b>protect</b>보호하다</button><button type=\"button\" class=\"wdb\" data-w=\"wonder\" data-m=\"궁금해하다\"><b>wonder</b>궁금해하다</button><button type=\"button\" class=\"wdb\" data-w=\"put on\" data-m=\"착용하다\"><b>put on</b>착용하다</button><button type=\"button\" class=\"wdb\" data-w=\"gear\" data-m=\"장비\"><b>gear</b>장비</button><button type=\"button\" class=\"wdb\" data-w=\"recognize\" data-m=\"알아보다\"><b>recognize</b>알아보다</button><button type=\"button\" class=\"wdb\" data-w=\"score\" data-m=\"득점하다\"><b>score</b>득점하다</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. ③처럼 지문의 <b>no one</b>(아무도 ~않다)을 “모두”로 슬쩍 바꾼 말이 있는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 3번</em>got home from work(퇴근해 돌아옴) … said no(아니라고 말함) → 같음</span><span><em>④ ↔ 5번</em>worried that Jason might be teased(놀림 받을까 걱정함) → 같음</span><span><em>⑤ ↔ 5번</em>brought Jason to the town baseball field(마을 야구장으로 데려감) → 같음</span><span><em>② ↔ 12번</em>after seven swings(일곱 번의 스윙 후에) 공을 침 → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ③을 9번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 ‘상대편’을 9번에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 뒷부분 · 결정적 단서</span><div class=\"en\">… but <mark>no one from the other team</mark> knew him.</div><p class=\"ko\">… <mark>다른 팀의 그 누구도</mark> 그(= Jason)를 알지 못했다.</p></div><div class=\"ck-via\"><i>▼</i><span>제이슨을 안 건 상대 팀이 아니라 같은 마을 팀</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 앞부분 · 누가 알았나</span><div class=\"en\"><mark>Most of the kids on the town team</mark> recognized Jason from school, …</div><p class=\"ko\"><mark>마을 팀에 속한 대부분의 아이들은</mark> 학교에서 (보아서) Jason을 알고 있었지만, …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">상대편 선수들은 모두 Jason을 알고 있었다.<small>9번: 상대 팀은 no one(아무도) 몰랐고, 안 쪽은 마을 팀이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">아버지는 Jason이 아이들한테 놀림 당할까봐 걱정했다.</span><span class=\"why\">5번이 Although(~에도 불구하고)로 시작해 걱정을 뒤집는 듯 보이지만, was worried that Jason might be teased(놀림 받을까 봐 걱정했다)는 사실이라 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">직장에서 돌아온 아버지의 캐치볼 제안을 거절했다.</span><span class=\"why\">3번 got home from work(직장에서 집으로 돌아와) 캐치볼을 물었더니 said no(아니라고 말했다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">일곱 번의 스윙 후에 마침내 공을 쳤다.</span><span class=\"why\">12번 finally hit the ball after seven swings(일곱 번의 스윙 후에 마침내 공을 쳤다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">아버지가 Jason을 동네 야구장으로 데려갔다.</span><span class=\"why\">5번 brought Jason to the town baseball field(제이슨을 마을 야구장으로 데리고 갔다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">(A) Jason was ten years old</div><div class=\"k\">(A) Jason은 열 살이었고</div></div><div class=\"rc\"><div class=\"e\">and loved baseball,</div><div class=\"k\">야구를 좋아했지만,</div></div><div class=\"rc\"><div class=\"e\">but he suffered from physical disabilities.</div><div class=\"k\">그(= Jason)는 신체장애로 고통 받고 있었다.</div></div><div class=\"rnat\">(A)(1) Jason은 열 살이었고 야구를 좋아했지만, 그는 신체장애로 고통 받고 있었다.</div><div class=\"rst\">(A) 열 살 제이슨(Jason)은 야구를 정말 좋아하지만 몸이 불편해요. = 지문 1번, 이 이야기의 주인공이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">His father, Bob,</div><div class=\"k\">그의 아버지 Bob은</div></div><div class=\"rc\"><div class=\"e\">wanted to protect (a) him,</div><div class=\"k\">(a)그(= Jason)를 보호하고 싶었고,</div></div><div class=\"rc\"><div class=\"e\">and so he played catch with him</div><div class=\"k\">그래서 그는 아들과 캐치볼을 했다</div></div><div class=\"rc\"><div class=\"e\">in their back yard</div><div class=\"k\">그들의 뒷마당에서</div></div><div class=\"rc\"><div class=\"e\">and avoided any community games.</div><div class=\"k\">그리고 그 어떤 동네 시합도 피했다.</div></div><div class=\"rnat\">(A)(2) 그의 아버지 Bob은 (a)그(Jason)를 보호하고 싶었고, 그래서 그는 그들의 뒷마당에서 아들과 캐치볼을 하며 그 어떤 동네 시합도 피했다.</div><div class=\"rst\">아빠 밥(Bob)은 아들을 지키고 싶어서 뒷마당에서만 캐치볼을 하고, 동네 시합은 피했어요. = 지문 2번.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">One day Bob got home from work</div><div class=\"k\">어느 날 Bob은 직장에서 집으로 돌아와</div></div><div class=\"rc\"><div class=\"e\">and asked Jason</div><div class=\"k\">Jason에게 물어보았지만</div></div><div class=\"rc\"><div class=\"e\">if he wanted to play catch,</div><div class=\"k\">캐치볼을 하고 싶은지,</div></div><div class=\"rc\"><div class=\"e\">but Jason hung his head and said no.</div><div class=\"k\">Jason은 고개를 숙이며 아니라고 말했다.</div></div><div class=\"rnat\">(A)(3) 어느 날 Bob은 직장에서 집으로 돌아와 Jason에게 캐치볼을 하고 싶은지 물어보았지만, Jason은 고개를 숙이며 아니라고 말했다.</div><div class=\"rst\">어느 날 퇴근한 아빠가 “캐치볼 할래?” 하자, 제이슨은 고개를 숙이고 싫다고 해요. 지문 3번 = 선택지 ①이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">(D) Bob wondered</div><div class=\"k\">(D) Bob은 궁금해 했고</div></div><div class=\"rc\"><div class=\"e\">why Jason said no,</div><div class=\"k\">왜 Jason이 아니라고 했는지,</div></div><div class=\"rc\"><div class=\"e\">and when (e) he asked,</div><div class=\"k\">(e)그(= Bob)가 물어보자,</div></div><div class=\"rc\"><div class=\"e\">Jason started to cry:</div><div class=\"k\">Jason은 울기 시작했다:</div></div><div class=\"rc\"><div class=\"e\">“I want to play on a team, Daddy.</div><div class=\"k\">“나도 팀에서 경기하고 싶어요, 아빠.</div></div><div class=\"rc\"><div class=\"e\">Why won’t you let me play with the other kids?”</div><div class=\"k\">왜 제가 다른 애들하고 시합하게 허락해주시지 않는 거예요?”</div></div><div class=\"rnat\">(D)(1) Bob은 왜 Jason이 아니라고 했는지 궁금해 했고, (e)그(Bob)가 물어보자, Jason은 울기 시작했다. “나도 팀에서 경기하고 싶어요, 아빠. 왜 제가 다른 애들하고 시합하게 허락해주시지 않는 거예요?”</div><div class=\"rst\">(D) 아빠는 왜 싫다고 했는지 궁금해 물어요. 제이슨은 울며 “저도 팀에서 뛰고 싶어요!” 해요. = 지문 4번.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Although Bob was worried</div><div class=\"k\">Bob은 염려했음에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">that Jason might be teased or mocked</div><div class=\"k\">Jason이 놀림을 받거나 조롱을 당할까봐</div></div><div class=\"rc\"><div class=\"e\">by the other kids,</div><div class=\"k\">다른 애들에게,</div></div><div class=\"rc\"><div class=\"e\">he decided to take the risk,</div><div class=\"k\">그는 위험을 감수하기로 했고,</div></div><div class=\"rc\"><div class=\"e\">and so he brought Jason</div><div class=\"k\">그래서 그는 Jason을 데리고 갔다</div></div><div class=\"rc\"><div class=\"e\">to the town baseball field</div><div class=\"k\">마을 야구장으로</div></div><div class=\"rc\"><div class=\"e\">that evening.</div><div class=\"k\">그날 저녁.</div></div><div class=\"rnat\">(D)(2) Bob은 Jason이 다른 애들에게 놀림을 받거나 조롱을 당할까봐 염려했음에도 불구하고, 그는 위험을 감수하기로 했고, 그래서 그는 그날 저녁 Jason을 마을 야구장으로 데리고 갔다.</div><div class=\"rst\">아빠는 아이들이 <b>놀릴까 봐 걱정</b>했지만(④), 용기를 내 동네 야구장에 데려가요(⑤). 둘 다 지문 5번 그대로예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">When they arrived at the field,</div><div class=\"k\">그들이 경기장에 도착했을 때,</div></div><div class=\"rc\"><div class=\"e\">it turned out</div><div class=\"k\">알고 보니</div></div><div class=\"rc\"><div class=\"e\">that a baseball game was about to start.</div><div class=\"k\">야구 시합이 막 시작되려고 하는 중이었다.</div></div><div class=\"rnat\">(D)(3) 그들이 경기장에 도착했을 때, 야구 시합이 막 시작되려고 하는 모습이 보였다.</div><div class=\"rst\">도착해 보니 마침 시합이 막 시작하려던 참이었어요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Bob talked to the coach about Jason,</div><div class=\"k\">Bob은 Jason에 대해 코치에게 말했고,</div></div><div class=\"rc\"><div class=\"e\">and the coach invited Jason to play.</div><div class=\"k\">코치는 Jason에게 경기하자고 청했다.</div></div><div class=\"rnat\">(D)(4) Bob은 Jason에 대해 코치에게 말했고, 코치는 Jason에게 경기하자고 청했다.</div><div class=\"rst\">아빠가 코치에게 제이슨 얘기를 하자, 코치가 “같이 뛰자!” 하고 <b>청해요</b>(invited). (D)는 여기서 끝나요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">(C) At the coach’s suggestion,</div><div class=\"k\">(C) 코치의 제안에,</div></div><div class=\"rc\"><div class=\"e\">Jason was very excited,</div><div class=\"k\">Jason은 매우 신이 났고,</div></div><div class=\"rc\"><div class=\"e\">and (c) he hurried to put on</div><div class=\"k\">(c)그(= Jason)는 서둘러 착용했다</div></div><div class=\"rc\"><div class=\"e\">his baseball gear.</div><div class=\"k\">그의 야구 장비를.</div></div><div class=\"rnat\">(C)(1) 코치의 제안에, Jason은 매우 신이 났고, (c)그(Jason)는 서둘러 그의 야구 장비를 착용했다.</div><div class=\"rst\">(C) <b>코치의 제안에</b>(At the coach's suggestion) 제이슨은 신이 나서 서둘러 야구 장비를 입어요. = 지문 8번.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Most of the kids on the town team</span></div><div class=\"k\"><span class=\"cw\">마을 팀에 속한 대부분의 아이들은</span></div></div><div class=\"rc\"><div class=\"e\">recognized Jason from school,</div><div class=\"k\">학교에서 (보아서) Jason을 알고 있었지만,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but no one from the other team</span></div><div class=\"k\"><span class=\"cw\">다른 팀의 그 누구도</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">knew him.</span></div><div class=\"k\"><span class=\"cw\">그(= Jason)를 알지 못했다.</span></div></div><div class=\"rnat\">(C)(2) 마을 팀에 속한 대부분의 아이들은 학교에서 (보아서) Jason을 알고 있었지만, 다른 팀의 그 누구도 그(Jason)를 알지 못했다.</div><div class=\"rst\">핵심! 학교에서 제이슨을 안 건 마을 팀이고, 상대 팀은 <b>아무도</b>(no one) 몰랐어요. 그래서 ③ “모두 알았다”와 어긋나요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">However, they could see</div><div class=\"k\">하지만, 그들은 알 수 있었다</div></div><div class=\"rc\"><div class=\"e\">that (d) he was different</div><div class=\"k\">(d)그(= Jason)가 (보통 아이와는) 다르다는 것을</div></div><div class=\"rc\"><div class=\"e\">by the way he moved</div><div class=\"k\">그가 움직이는 방식을 통해</div></div><div class=\"rc\"><div class=\"e\">as he ran onto the field</div><div class=\"k\">그가 경기장에 뛰어 들어올 때</div></div><div class=\"rc\"><div class=\"e\">to hit the ball for his team.</div><div class=\"k\">팀을 위해 공을 치러.</div></div><div class=\"rnat\">(C)(3) 하지만, 그들은 그가 팀을 위해 공을 치러 경기장에 뛰어 들어올 때 그가 움직이는 방식을 통해 (d)그(Jason)가 (보통 아이와는) 다르다는 것을 알 수 있었다.</div><div class=\"rst\">그래도 상대 팀은 제이슨이 공을 치러 뛰어 들어오는 모습을 보고 남들과 다르다는 걸 알아챘어요. = 지문 10번.</div></div><div class=\"rds\" dat all the players,</div><div class=\"k\">모든 선수들의 목소리들과,</div></div><div class=\"rc\"><div class=\"e\">on both teams.</div><div class=\"k\">양 팀의.</div></div><div class=\"rnat\">(B)(2) 그들의 목소리는 곧 양 팀의 모든 선수들의 목소리들과 합쳐졌다.</div><div class=\"rst\">곧 양 팀 선수 모두의 목소리가 그 응원에 합쳐져요. = 지문 13번.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">Everyone was cheering</div><div class=\"k\">모두가 환호하고 있었고</div></div><div class=\"rc\"><div class=\"e\">and Jason’s face glowed</div><div class=\"k\">Jason의 얼굴이 밝아졌다</div></div><div class=\"rc\"><div class=\"e\">when (b) he finally scored.</div><div class=\"k\">(b)그(= Jason)가 마침내 득점하자.</div></div><div class=\"rnat\">(B)(3) 모두가 환호하고 있었고 (b)그(Jason)가 마침내 득점하자 Jason의 얼굴이 밝아졌다.</div><div class=\"rst\">모두가 환호하고, 제이슨이 드디어 득점하자 얼굴이 환하게 빛나요. = 지문 14번.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">15번</span><div class=\"rc\"><div class=\"e\">He shouted,</div><div class=\"k\">그는 소리쳤다.</div></div><div class=\"rc\"><div class=\"e\">“I did it Daddy! I did it!”</div><div class=\"k\">“내가 해냈어요. 아빠! 내가 해냈어요!”</div></div><div class=\"rnat\">(B)(4) 그는 소리쳤다. “내가 해냈어요. 아빠! 내가 해냈어요!”</div><div class=\"rst\">제이슨이 “아빠, 제가 해냈어요!” 하고 소리쳐요. = 지문 15번.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">16번</span><div class=\"rc\"><div class=\"e\">Tears slid down Bob’s cheeks</div><div class=\"k\">눈물이 Bob의 뺨에 흘러내렸다</div></div><div class=\"rc\"><div class=\"e\">as he hugged</div><div class=\"k\">그가 껴안아주며</div></div><div class=\"rc\"><div class=\"e\">his joyful son.</div><div class=\"k\">기뻐하는 그의 아들을.</div></div><div class=\"rnat\">(B)(5) 기뻐하는 그의 아들을 껴안아주며 눈물이 Bob의 뺨에 흘러내렸다.</div><div class=\"rst\">아빠는 기뻐하는 아들을 꼭 안아 주며 눈물을 흘려요. = 지문 16번, 이야기의 마지막 장면이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"recognize\" data-m=\"알아보다\"><b>recognize</b> function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(S.sub&&!S.mmS){S.mmS=1;S.mmP=1;save();WN.hw(lv,day,S.sub.s+'/'+N+(S.mmD?' ✓':''));}else if(!S.sub&&!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,S.sub?S.sub.s+'/'+N+' ✓':'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
