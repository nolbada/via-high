<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>고2 미니모의고사 18회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}

/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}
.evx .en{background:#fff;border:1px solid #d5eadc;font-size:15.5px;margin:0 0 8px}
.evx p{margin:6px 0;font-size:15.5px;line-height:1.75}
.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}
</style>

<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});

var D=[{"no": "07", "typ": "글의 순서", "src": "2018년 11월 37번", "evn": [2, 4, 6], "ev_en": "(A) Timing is also important. / (B) Your body also needs the right balance of key macronutrients to heal and grow stronger. / (C) Calorie restriction can also cause your metabolism to slow down, and significantly reduce energy levels.", "ev_ko": [[2, "(A) 시기도 중요하다."], [4, "(B) 당신의 신체는 또한 치유되고 더 강해지기 위해서 필수 다량 영양소의 적절한 균형을 필요로 한다."], [6, "(C) 열량 제한은 또한 당신의 신진대사를 느려지게 할 수도 있고, 에너지 수준을 현저히 감소시킬 수도 있다."]], "why": ["주어진 글(1)은 열량 부족을 만드는 다이어트의 부작용을 말합니다", "(C)(6)은 <b>also<\/b>로 열량 제한의 또 다른 문제점(신진대사 저하, 에너지 감소)을 말하고, (7)은 그 해결책(열량 섭취 조절)을 말합니다", "그래서 (C)가 먼저 옵니다", "(B)(4)는 <b>also<\/b>로 필수 다량 영양소의 균형도 필요하다고 이어 갑니다", "(A)(2)는 <b>also<\/b>로 영양소를 먹는 <b>시기<\/b>도 중요하다고 덧붙이고, (3)의 <b>these key macronutrients<\/b>는 (B)에서 소개한 영양소를 받습니다", "그래서 (A)가 마지막입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)(3)의 <b>these key macronutrients<\/b>가 가리키는 영양소는 (B)(4)(5)에서 처음 소개됩니다", "그래서 (A)를 (B)보다 앞에 둘 수 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": false, "e": ["주어진 글 다음에는 열량 제한의 또 다른 문제점과 해결책을 말하는 (C)가 먼저 와야 합니다", "(B)를 맨 앞에 두면 이 흐름이 깨집니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["②와 같은 이유로 (B)가 (C)보다 앞에 올 수 없습니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(A)(3)의 <b>these key macronutrients<\/b>는 (B)(4)(5)에서 먼저 소개된 영양소를 받습니다", "(A)가 (B)보다 앞에 오면 가리킬 대상이 없습니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": true, "e": ["열량 제한의 또 다른 문제와 해결책(C) → 다량 영양소의 균형도 필요함(B) → 섭취 시기도 중요함(A) 순서로, 세 부분이 모두 <b>also<\/b>로 이어지는 흐름에 맞습니다."]}], "tr": ["몇몇 유행하는 다이어트는 당신이 열량 부족에 시달리게 할 수 있는데, 이것(열량 부족)은 체중 감소를 촉진할 수는 있으나, 체성분을 개선하는 데는 아무런 효과가 없으며, 실제로는 근육량의 감소를 초래할 수도 있다.", "(A) 시기도 중요하다.", "(A) 하루 중 전략적인 간격으로 이러한 필수 다량 영양소의 알맞은 조합을 섭취함으로써, 우리는 우리의 신체가 훨씬 더 빠르게 치유되고 성장하도록 도울 수 있다.", "(B) 당신의 신체는 또한 치유되고 더 강해지기 위해서 필수 다량 영양소의 적절한 균형을 필요로 한다.", "(B) 단백질, 탄수화물, 그리고 건강에 좋은 지방을 포함하는 이러한 다량 영양소는, 당신의 신체가 회복하고, 재건하고, 더 강해지기 위한 (그것의 ld be minimal, and a hierarchical division is viewed as one of convenience only. / In these cultures, there is more fluidity within the social hierarchy, and it is relatively easy for individuals to move up the social hierarchy based on their individual efforts and achievements.", "ev_ko": [[2, "권력 거리는 사회에서 권력이 상대적으로 약한 구성원들이 권력에서의 불평등을 받아들이고 그것을 일반적인 것이라고 여기는 정도와 관련이 있다."], [3, "권력 거리에 대한 수용도가 높은 문화들에서 (예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀), 사람들은 동등한 존재로 여겨지지 않으며, 모든 사람은 사회 계급 속에서 분명히 규정된 혹은 할당된 지위를 갖는다."], [4, "권력 거리에 대한 수용도가 낮은 문화들에서 (예를 들어, 핀란드, 노르웨이, 뉴질랜드, 그리고 이스라엘), 사람들은 불평등은 최소한이어야 한다고 믿으며, 계급 구분은 오로지 편의를 위한 것으로 여겨진다."], [5, "이러한 문화들(권력 거리에 대한 수용도가 낮은 문화들)에서는, 사회 계급 안에 더 많은 유동성이 있으며, 개인들이 그들의 개인적 노력과 성과를 기반으로 사회 계급을 상승시키는 것이 상대적으로 쉽다."]], "why": ["요약문은 권력 거리에 대한 수용도가 높은 문화와 낮은 문화를 비교합니다", "(2)번에서 권력 거리는 힘이 약한 구성원들이 권력의 불평등을 <b>받아들이고<\/b> 그것을 당연한 것(the norm)으로 여기는 정도라고 했습니다", "(3)번처럼 수용도가 <b>높은<\/b> 문화에서는 사람들이 동등하게 여겨지지 않고 모두가 사회 계급 속에서 정해진 지위를 갖습니다", "그래서 (A)에는 이런 문화의 구성원들이 불평등을 <b>기꺼이(willing)<\/b> 받아들인다는 말이 들어갑니다", "(4)번에서 수용도가 <b>낮은<\/b> 문화의 사람들은 불평등이 최소한이어야 한다고 믿고, (5)번에서 이런 문화에서는 사회 계급 안에 더 많은 <b>유동성(fluidity)<\/b>이 있다고 했습니다", "그래서 (B)에는 <b>mobility(유동성)<\/b>가 들어갑니다."], "ch": [{"n": "①", "t": "willing … mobility", "g": "기꺼이 ~하는 … 유동성", "ok": true, "e": ["(A) 수용도가 높은 문화는 불평등을 <b>기꺼이(willing)<\/b> 받아들이고, (B) 수용도가 낮은 문화는 계급 안에서 더 많은 <b>유동성(mobility)<\/b>을 허용합니다", "둘 다 지문과 맞습니다."]}, {"n": "②", "t": "willing … assistance", "g": "기꺼이 ~하는 … 원조", "ok": false, "e": ["(A) willing은 맞습니다", "하지만 (B) <b>assistance(원조)<\/b>에 해당하는 내용은 지문에 없습니다", "지문은 사회 계급 안의 <b>유동성<\/b>을 말합니다(5)."]}, {"n": "③", "t": "reluctant … resistance", "g": "꺼리는 … 저항", "ok": false, "e": ["(A) <b>reluctant(꺼리는)<\/b>는 틀립니다", "수용도가 높은 문화는 불평등을 받아들이는 쪽입니다", "(B) <b>resistance(저항)<\/b>에 해당하는 내용도 지문에 없습니다."]}, {"n": "④", "t": "reluctant … flexibility", "g": "꺼리는 … 융통성", "ok": false, "e": ["(A) <b>reluctant(꺼리는)<\/b>가 틀립니다", "수용도가 높은 문화는 불평등을 받아들이는 쪽이므로 지문과 반대입니다."]}, {"n": "⑤", "t": "afraid … openness", "g": "두려워하는 … 개방", "ok": false, "e": ["(A) <b>afraid(두려워하는)<\/b>에 해당하는 내용은 지문에 없습니다", "(B) <b>openness(개방)<\/b>도 지문에서 말한 내용(유동성)이 아닙니다."]}], "tr": ["‘권력 거리’는 권력의 불평등한 분배가 한 문화의 사람들에 의해 얼마나 넓게 받아들여지는지를 나타내기 위해 사용되는 용어이다.", "권력 거리는 사회에서 권력이 상대적으로 약한 구성원들이 권력에서의 불평등을 받아들이고 그것을 일반적인 것이라고 여기는 정도와 관련이 있다.", "권력 거리에 대한 수용도가 높은 문화들에서 (예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀), 사람들은 동등한 존재로 여겨지지 않으며, 모든 사람은 사회 계급 속에서 분명히 규정된 혹은 할당된 지위를 갖는다.", "권력 거리에 대한 수용도가 낮은 문화들에서 (예를 들어, 핀란드, 노르웨이, 뉴질랜드, 그리고 이스라엘), 사람들은 불평등은 최소한이어야 한다고 믿으며, 계급 구분은 오로지 편의를 위한 것으로 여겨진다.", "이러한 문화들(권력 거리에 대한 수용도가 낮은 문화들)에서는, 사회 계급 안에 더 많은 유동성이 있으며, 개인들이 그들의 개인적 노력과 성과를 기반으로 사회 계급을 상승시키는 것이 상대적으로 쉽다.", "구성원들이 불평등을 좀 더 (A)기꺼이 받아들이는, 권력 거리에 대한 수용도가 높은 문화들과 달리, 권력 거리에 대한 수용도가 낮은 문화들은 사회 계급 내에서 더 많은 (B)유동성을 허용한다."], "ps": [{"n": 1, "ch": [{"e": "<b>Power distance<\/b> is the term", "k": "'<b>권력 거리<\/b>'는 용어이다"}, {"e": "used to refer to", "k": "나타내기 위해 사용되는"}, {"e": "how widely an unequal distribution of power", "k": "권력의 불평등한 분배가 얼마나 넓게"}, {"e": "is accepted", "k": "받아들여지는지를"}, {"e": "by the members of a culture.", "k": "한 문화의 사람들에 의해."}], "easy": "'권력 거리'는, 권력이 고르지 않게 나뉜 것을 한 문화의 사람들이 얼마나 넓게 받아들이는지를 나타낼 때 쓰는 말이에요.", "gist": "글의 핵심 용어 '권력 거리'를 정의하며 연다."}, {"n": 2, "ch": [{"e": "It relates to the degree", "k": "권력 거리는 정도와 관련이 있다"}, {"e": "to which the <b>less powerful<\/b> members of a society", "k": "사회에서 권력이 상대적으로 약한 구성원들이"}, {"e": "accept their inequality in power", "k": "권력에서의 불평등을 받아들이고"}, {"e": "and consider it the norm.", "k": "그것<span class=\"r\">(= 불평등)<\/span>을 일반적인 것이라고 여기는."}], "easy": "사회에서 힘이 약한 사람들이 권력의 불평등을 받아들이고 그걸 당연하게 여기는 정도를 말해요.", "gist": "'권력 거리'의 뜻을 풀어 준다. 불평등을 얼마나 받아들이느냐의 정도다. 요약문 (A)의 근거다."}, {"n": 3, "ch": [{"e": "In cultures with <b>high<\/b> acceptance of power distance", "k": "권력 거리에 대한 수용도가 <b>높은<\/b> 문화들에서"}, {"e": "(e.g., India, Brazil, Greece, Mexico, and the Philippines),", "k": "(예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀),"}, {"e": "people are not viewed as equals,", "k": "사람들은 동등한 존재로 여겨지지 않으며 n>"}], "easy": "수용도가 높은 문화에서는 사람들이 불평등을 더 기꺼이 받아들여요. 반대로 수용도가 낮은 문화에서는 사회 계급 안에서 더 많은 유동성을 허용해요.", "gist": "요약문: 두 문화의 차이를 한 문장으로 정리한다. (A)는 불평등을 받아들이는 태도, (B)는 계급 안의 유동성이다."}]}, {"no": "09", "typ": "문장 삽입", "src": "2022학년도 수능 39번", "evn": [1, 6], "ev_en": "As long as the irrealism of the silent black and white film predominated, one could not take filmic fantasies for representations of reality. / But sound and color threatened to create just such an illusion, thereby destroying the very essence of film art.", "ev_ko": [[1, "무성 흑백 영화의 비현실주의가 우세하는 한, 개인은 영화의 환상을 현실의 표현으로 여길 수 없었다."], [6, "④ 그러나 소리와 색채는 바로 그러한 착각(영화의 환상을 현실의 표현으로 여기는 것)을 만들겠다고 위협했고, 그로 인해 바로 그 영화 예술의 정수를 파괴했다."]], "why": ["삽입 문제는 <b>just such an illusion(바로 그러한 착각)<\/b> 같은 지시어가 단서입니다", "(6)의 just such an illusion은 주어진 문장 (1)의 <b>take filmic fantasies for representations of reality(영화의 환상을 현실의 표현으로 여기는 것)<\/b>에 해당합니다", "(5)까지는 소리와 색채 같은 불필요한 혁신 때문에 영화의 환상적 가치가 떨어졌다는 내용이 이어집니다", "(6)은 <b>But<\/b>으로 시작해, 소리와 색채가 영화 예술의 정수를 파괴했다고 말합니다", "그래서 (6) 앞에는 소리와 색채가 도입되기 전, 영화가 환상을 보여 주어 가치가 있었다는 내용이 와야 합니다", "따라서 주어진 문장은 (5)와 (6) 사이인 ④에 들어갑니다."], "ch": [{"n": "①", "t": "(2)와 (3) 사이", "g": "", "ok": false, "e": ["(3)의 <b>This is why<\/b>(이것이 ~한 이유이다)는 (2)의 내용을 받습니다", "①에 넣으면 (2)와 (3) 사이가 끊깁니다."]}, {"n": "②", "t": "(3)과 (4) 사이", "g": "", "ok": false, "e": ["(4)의 <b>these innovations<\/b>는 (3)에서 말한 혁신을 바로 받습니다", "②에 넣으면 (3)과 (4) 사이가 끊깁니다."]}, {"n": "③", "t": "(4)와 (5) 사이", "g": "", "ok": false, "e": ["(5)의 <b>they<\/b>는 (4)의 these innovations를 이어 받습니다", "③에 넣으면 (4)와 (5) 사이가 끊깁니다."]}, {"n": "④", "t": "(5)와 (6) 사이", "g": "", "ok": true, "e": ["(6)의 <b>just such an illusion<\/b>이 주어진 문장 (1)의 내용(영화의 환상을 현실의 표현으로 여기는 것)에 해당합니다", "그래서 주어진 문장이 (6) 바로 앞에 와야 합니다."]}, {"n": "⑤", "t": "(6)과 (7) 사이", "g": "", "ok": false, "e": ["주어진 문장이 (6) 뒤에 오면, (6)의 <b>just such an illusion<\/b>이 가리키는 내용이 앞에 없게 됩니다", "주어진 문장은 (6) 앞에 와야 합니다."]}], "tr": ["무성 흑백 영화의 비현실주의가 우세하는 한, 개인은 영화의 환상을 현실의 표현으로 여길 수 없었다.", "영화는 우리의 현실에 숨겨진 윤곽을 볼 수 있게 하는 그것의 능력 때문이 아니라, 현실 그 자체가 가리고 있는 것, 즉 환상의 차원을 드러내는 능력 때문에 가치가 있다.", "① 이것이 최초의 위대한 영화 이론가들이 한 목소리로 영화를 현실주의의 방향으로 밀어 넣은 소리와 (색채와 같은) 다른 기술적인 혁신의 도입을 공공연히 비난했던 이유이다.", "② 영화가 전적으로 환상의 예술이었기 때문에, 이러한 혁신은 완전히 불필요했다.", "③ 그리고 설상가상으로, 그것들은 잠재적으로 영화를 단지 현실의 표현을 위한 전달 장치로 변형시키면서, 영화 제작자들과 관객들이 영화의 환상의 차원에서 등을 돌리게 하는 것 외에는 아무것도 할 수 없었다.", "④ 그러나 소리와 색채는 바로 그러한 착각(영화의 환상을 현실의 표현으로 여기는 것)을 만들겠다고 위협했고, 그로 인해 바로 그 영화 예술의 정수를 파괴했다.", "⑤ Rudolf Arnheim이 말하듯이, “예술가의 창의력은 오로지 현실과 표현의 매개가 일치하지 않는 곳에서만 작용할 수 있다.”"], "ps": [{"n": 1, "ch": [{"e": "<b>As long as<\/b>", "k": "~하는 한"}, {"e": "the <b>irrealism<\/b> of the silent black and white film", "k": "무성 흑백 영화의 <b>비현실주의<\/b>가"}, {"e": "<b>predominated<\/b>,", "k": "우세한,"}, {"e": "one could not take", "k": "개인은 여길 수 없었다"}, {"e": "filmic fantasies", "k": "영화의 환상을"}, {"e": "for representations of reality.", "k": "현실의 표현으로."}], "easy": "무성 흑백 영화가 비현실적인 느낌이 강하던 동안에는, 사람들이 영화의 환상을 현실을 보여 주는 것으로 착각할 수 없었어요.", "gist": "주어진 문장: 이 문장의 '영화의 환상을 현실의 표현으로 여기는 것'이 (6)의 just such an illusion에 해당한다."}, {"n": 2, "ch": [{"e": "Cinema is valuable", "k": "영화는 가치가 있다"}, {"e": "<b>not<\/b> for its ability to make visible", "k": "볼 수 있게 하는 그것의 능력 때문이 아니라"}, {"e": "the hidden outlines of our reality,", "k": "우리의 현실에 숨겨진 윤곽을"}, {"e": "<b>but<\/b> for its ability to reveal", "k": "드러내는 능력 때문에"}, {"e": "what reality itself <b>veils<\/b> —", "k": "현실 그 자체가 가리고 있는 것,"}, {"e": "the dimension of fantasy.", "k": "즉 환상의 차원을."}], "easy": "영화가 값진 이유는 현실의 숨은 윤곽을 보여 주기 때문이 아니에요. 현실이 가리고 있는 '환상의 차원'을 드러내기 때문이에요.", "gist": "글의 주제: 영화의 가치는 환상의 차원에 있다."}, {"n": 3, "ch": [{"e": "<b>This is why<\/b>,", "k": "이것이 ~한 이유이다,"}, {"e": "to a person,", "k": "한 목소리로"}, {"e": "the first great theorists of film <b>decried<\/b>", "k": "최초의 위대한 영화 이론가들이 공공연히 비난했던"}, {"e": "the introduction of sound and other technical innovations", "k": "소리와 다른 기술적인 혁신의 도입을"}, {"e": "(such as color)", "k": "(색채와 같은)"}, {"e": "that pushed film in the direction of realism.", "k": "영화를 현실주의의 방향으로 밀어 넣은."}],  "권력 거리에 대한 수용도가 높은 문화(예를 들어 인도, 브라질, 그리스, 멕시코, 필리핀)에서는 사람들이 동등하게 여겨지지 않으며, 모두가 사회 계급 안에서 명확히 규정되거나 할당된 자리를 갖는다.", "ana": "<b>are not viewed as<\/b>는 <b>view A as B(A를 B로 여기다)<\/b>의 <b>수동태<\/b>이며, <b>defined or allocated<\/b>는 place를 수식하는 <b>과거분사 병렬<\/b>입니다."}, {"i": "06", "q": "09", "s": "1", "title": "not A but B + 관계대명사 what + 대시 동격", "eng": "Cinema is valuable / not for its ability / to make visible / the hidden outlines of our reality, / but for its ability / to reveal / what reality itself veils<sup>1<\/sup> / — the dimension<sup>2<\/sup> of fantasy<sup>3<\/sup>.", "notes": [["1", "veil", "감추다"], ["2", "dimension", "차원"], ["3", "fantasy", "환상"]], "lit": "영화는 가치가 있다 / 그것의 능력 때문이 아니라 / 보이게 만드는 / 우리 현실의 숨겨진 윤곽을 / 하지만 그것의 능력 때문에 / 드러내는 / 현실 그 자체가 감추는 것을 / 즉 환상의 차원을", "nat": "영화는 우리 현실의 숨겨진 윤곽을 보이게 하는 능력 때문이 아니라, 현실 그 자체가 감추고 있는 것, 즉 환상의 차원을 드러내는 능력 때문에 가치가 있다.", "ana": "<b>not A but B(A가 아니라 B)<\/b> 구문이 두 개의 전치사구(for its ability to ~)를 대비시키며, <b>what reality itself veils<\/b>는 <b>선행사를 포함하는 관계대명사 what<\/b>이 이끄는 명사절로 reveal의 목적어입니다. 대시(—) 뒤는 그 명사절을 다시 설명하는 동격 표현입니다."}, {"i": "07", "q": "10", "s": "C4", "title": "목적의 to부정사 + 동사 3개 병렬 + until 시간 부사절", "eng": "To make it easier for Jason, / the pitcher<sup>1<\/sup> moved in closer, / threw the ball gently<sup>2<\/sup>, / and kept throwing / until he could hit / one.", "notes": [["1", "pitcher", "투수"], ["2", "gently", "부드럽게"]], "lit": "Jason에게 더 쉽게 만들어 주기 위해 / 투수는 더 가까이 다가왔다 / 공을 부드럽게 던졌다 / 그리고 계속 던졌다 / 그가 칠 수 있을 때까지 / 하나를", "nat": "Jason이 더 쉽게 할 수 있도록, 투수는 더 가까이 다가와서 공을 부드럽게 던졌고, 그가 공을 칠 수 있을 때까지 계속 던졌다.", "ana": "<b>To make it easier<\/b>는 <b>목적<\/b>을 나타내는 to부정사이며, <b>moved, threw, kept<\/b> 세 개의 동사가 <b>and로 병렬<\/b> 연결되어 있습니다. <b>until he could hit one<\/b>은 '~할 때까지'라는 <b>시간의 부사절<\/b>입니다."}, {"i": "08", "q": "10", "s": "B2", "title": "수동태 + 반복 명사를 대신하는 대명사 those", "eng": "Their voices / were soon joined<sup>1<\/sup> / by those of all the players, / on both teams.", "notes": [["1", "join", "합쳐지다"]], "lit": "그들의 목소리는 / t", "유행 다이어트"], ["caloric deficit", "열량 부족"], ["body composition", "체성분"], ["muscle mass", "근육량"], ["metabolism", "신진대사"], ["calorie restriction", "열량 제한"], ["intake", "섭취"], ["macronutrient", "다량 영양소"], ["repair", "회복하다"], ["strategic interval", "전략적 간격"]]}, {"q": "08", "type": "요약문 완성", "src": "2017년 11월 40번", "ans": "①", "tr": [["1", "권력 거리는 권력의 불평등한 분배가 한 문화의 구성원들에 의해 얼마나 널리 받아들여지는지를 나타내기 위해 사용되는 용어이다."], ["2", "이는 사회에서 권력이 상대적으로 약한 구성원들이 권력에서의 불평등을 받아들이고 그것을 규범으로 여기는 정도와 관련이 있다."], ["3", "권력 거리에 대한 수용도가 높은 문화(예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀)에서는, 사람들이 동등하게 여겨지지 않으며, 모든 사람은 사회 계급 속에서 명확히 규정된 혹은 할당된 지위를 갖는다."], ["4", "권력 거리에 대한 수용도가 낮은 문화(예를 들어, 핀란드, 노르웨이, 뉴질랜드, 그리고 이스라엘)에서는, 사람들이 불평등이 최소화되어야 한다고 믿으며, 계급 구분은 오로지 편의를 위한 것으로 여겨진다."], ["5", "이러한 문화에서는 사회 계급 안에 더 많은 유동성이 있으며, 개인들이 그들의 개인적 노력과 성과를 기반으로 사회 계급을 상승시키는 것이 상대적으로 쉽다."]], "evh": "4·5번 문장", "ev": [{"en": true, "h": "In cultures with low acceptance of power distance ~ people believe inequality should be minimal ~ / In these cultures, there is more fluidity within the social hierarchy ~"}, {"en": false, "h": "요약문 문제는 대조되는 두 문화 유형의 특징을 정리해야 합니다. 3번에서 수용도가 높은 문화의 사람들은 불평등을 <b>기꺼이 받아들인다(willing)<\/b>고 했고, 4·5번에서 수용도가 낮은 문화는 계급 간 <b>유동성(mobility)<\/b>이 크다고 했으므로 (A)는 willing, (B)는 mobility입니다."}], "opts": [{"n": "①", "t": "willing … mobility", "a": true, "x": false, "trap": false, "e": "수용도 높은 문화는 불평등을 <b>기꺼이 받아들이고(willing)<\/b>, 수용도 낮은 문화는 계급 간 <b>유동성(mobility)<\/b>이 크다는 내용과 일치합니다."}, {"n": "②", "t": "willing … assistance", "a": false, "x": true, "trap": false, "e": "(B)의 assistance(도움)는 본문에 근거가 없습니다."}, {"n": "③", "t": "reluctant … resistance", "a": false, "x": true, "trap": true, "e": "reluctant(꺼리는)는 오히려 수용도 낮은 문화 쪽 특징에 가까워 (A) 자리에 부적절합니다."}, {"n": "④", "t": "reluctant … flexibility", "a": false, "x": true, "trap": false, "e": "(A) reluctant가 부적절합니다."}, {"n": "⑤", "t": "afraid … openness", "a": false, "x": true, "trap": false, "e": "afraid(두려워하는)에 관한 근거가 없습니다."}], "w": [["power distance", "권력 거리"], ["unequal distribution", "불평등한 분배"], ["norm", "규범"], ["allocate", "할당하다"], ["hierarchy", "계급, 위계"], ["minimal", "최소한의"], ["convenience", "편의"], ["fluidity", "유동성"], ["mobility", "이동성"]]}, {"q": "09", "type": "문장 삽입", "src": "2022학년도 수능 39번", "ans": "④", "tr": [["1", "영화는 우리 현실의 숨겨진 윤곽을 보이게 하는 능력 때문이 아니라, 현실 그 자체가 감추고 있는 것, 즉 환상의 차원을 드러내는 능력 때문에 가치가 있다."], ["2", "( ① ) 이것이 바로, 개인적으로, 영화의 위대한 최초 이론가들이 영화를 사실주의 방향으로 밀어붙인 소리와 (색채 같은) 다른 기술적 혁신의 도입을 공공연히 비난했던 이유이다."], ["3", "( ② ) 영화는 전적으로 환상적인 예술이었으므로, 이러한 혁신들은 완전히 불필요했다."], ["4", "( ③ ) 그리고 설상가상으로, 그것들은 영화 제작자들과 관객들을 영화의 환상적 차원으로부터 멀어지게 하고, 영화를 현실의 표현을 위한 단순한 전달 장치로 변형시킬 뿐이었다."], ["5", "( ④ ) [삽입 문장] 무성 흑백 영화의 비현실성이 지배적이었던 한, 사람들은 영화적 환상을 현실의 표현으로 여길 수 없었다."], ["6", "( ⑤ ) 그러나 소리와 색채는 바로 그러한 환상을 만들어 내겠다고 위협했고, 그로 인해 영화 예술의 정수를 파괴했다."], ["7", "Rudolf Arnheim이 말하듯이, \"예술가의 창의적인 힘은 오로지 현실과 표현의 매개가 일치하지 않는 곳에서만 발휘될 수 있다.\""]], "evh": "⑤ 앞 문장", "ev": [{"en": true, "h": "But sound and color threatened to create just such an illusion, thereby destroying the very essence of film art."}, {"en": false, "h": "문장 삽입 문제는 지시어가 결정적 단서입니다. ⑤ 앞 문장의 <b>just such an illusion(바로 그런 환상)<\/b>은 주어진 문장의 <b>filmic fantasies for representations of reality(현실의 표현으로서의 영화적 환상)<\/b>를 가리킵니다. ③까지는 소리·색채 같은 혁신이 영화의 환상적 가치를 없앤다는 비판이 이어지는데, 주어진 문장이 그 사이(④)에 들어가야 ⑤ 앞 문장의 'But'이 앞 내용과 자연스럽게 대조를 이룹니다. 따라서 주어진 문장은 ④에 들어가야 합니다."}], "opts": [{"n": "①", "t": "위치", "a": false, "x": true, "trap": false, "e": "아직 소리·색채 혁신에 대한 비판이 시작되는 지점이라 이르며, 뒤의 'But'과 바로 연결되지 않습니다."}, {"n": "②", "t": "위치", "a": false, "x": true, "trap": false, "e": "혁신이 불필요했다는 비판이 막 시작된 지점이라 이릅니다."}, {"n": "③", "t": "위치", "a": false, "x": true, "trap": true, "e": "설상가상으로 비판이 이어진 직후 자리로, 아직 이릅니다."}, {"n": "④", "t": "위치", "a": true, "x": false, "trap": false, "e": "⑤ 앞 문장의 'just such an illusion'이 주어진 문장의 내용을 정확히 받는 자리입니다."}, {"n": "⑤", "t": "위치", "a": false, "x": true, "trap": false, "e": "이미 'But' 문장이 등장한 뒤이므로, 주어진 문장이 여기 들어가면 지시어 연결이 끊깁니다."}], "w": [["veil", "감추다"], ["decry", "공공연히 비난하다"], ["realism", "사   app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
  mmInit();
}
/* 해설 확인완료 → REC (미니모고) */
function mmInit(){
  try{
    var lv='미니모고 '+(GCODE==='h2'?'고2':'고1'),m=String(FILE).match(/^(\d\d)([ab])$/),day=m?(+m[1])*2-(m[2]==='a'?1:0):0;
    if(!day||!window.WN)return;
    var seen=S.seen||(S.seen={});
    if(!S.mmP&&!S.mmD){S.mmP=1;save();WN.hw(lv,day,'진행중');}
    var ds=document.querySelectorAll('details.qd'),w=document.querySelector('.bar .wrap');
    if(!w||!ds.length)return;
    var b=document.createElement('button');b.className='btn pri';b.id='mmdone';
    w.insertBefore(b,w.firstChild);
    function upd(){
      var k=0;ds.forEach(function(d,i){if(seen[i])k++;});
      if(S.mmD){b.textContent='확인완료 ✓';b.disabled=true;return;}
      var all=k>=ds.length;
      b.textContent=all?'확인완료':'해설 확인 '+k+' / '+ds.length;
      b.disabled=!all;
    }
    ds.forEach(function(d,i){
      if(d.open)seen[i]=1;
      d.addEventListener('toggle',function(){if(d.open&&!seen[i]){seen[i]=1;save();upd();}});
    });
    save();upd();
    b.onclick=function(){
      if(S.mmD)return;
      S.mmD=1;save();upd();
      WN.hw(lv,day,'확인완료');
    };
  }catch(e){}
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  if(ch){ch.classList.toggle('open');return;}
  const st=e.target.closest('.stg');
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
