<title>고2 미니모의고사 18회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:0}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app>.wrap{width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:sticky;margin-top:auto;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}

.opx .bd.t{background:#b4472f}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

var D=[{"no": "07", "typ": "글의 순서", "src": "2018년 11월 37번", "evn": [2, 4, 6], "ev_en": "(A) Timing is also important. / (B) Your body also needs the right balance of key macronutrients to heal and grow stronger. / (C) Calorie restriction can also cause your metabolism to slow down, and significantly reduce energy levels.", "ev_ko": [[2, "(A) 시기도 중요하다."], [4, "(B) 당신의 신체는 또한 치유되고 더 강해지기 위해서 필수 다량 영양소의 적절한 균형을 필요로 한다."], [6, "(C) 열량 제한은 또한 당신의 신진대사를 느려지게 할 수도 있고, 에너지 수준을 현저히 감소시킬 수도 있다."]], "why": ["주어진 글(1)은 열량 부족을 만드는 다이어트의 부작용을 말합니다", "(C)(6)은 <b>also<\/b>로 열량 제한의 또 다른 문제점(신진대사 저하, 에너지 감소)을 말하고, (7)은 그 해결책(열량 섭취 조절)을 말합니다", "그래서 (C)가 먼저 옵니다", "(B)(4)는 <b>also<\/b>로 필수 다량 영양소의 균형도 필요하다고 이어 갑니다", "(A)(2)는 <b>also<\/b>로 영양소를 먹는 <b>시기<\/b>도 중요하다고 덧붙이고, (3)의 <b>these key macronutrients<\/b>는 (B)에서 소개한 영양소를 받습니다", "그래서 (A)가 마지막입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)(3)의 <b>these key macronutrients<\/b>가 가리키는 영양소는 (B)(4)(5)에서 처음 소개됩니다", "그래서 (A)를 (B)보다 앞에 둘 수 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": false, "e": ["주어진 글 다음에는 열량 제한의 또 다른 문제점과 해결책을 말하는 (C)가 먼저 와야 합니다", "(B)를 맨 앞에 두면 이 흐름이 깨집니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["②와 같은 이유로 (B)가 (C)보다 앞에 올 수 없습니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(A)(3)의 <b>these key macronutrients<\/b>는 (B)(4)(5)에서 먼저 소개된 영양소를 받습니다", "(A)가 (B)보다 앞에 오면 가리킬 대상이 없습니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": true, "e": ["열량 제한의 또 다른 문제와 해결책(C) → 다량 영양소의 균형도 필요함(B) → 섭취 시기도 중요함(A) 순서로, 세 부분이 모두 <b>also<\/b>로 이어지는 흐름에 맞습니다."]}], "tr": ["몇몇 유행하는 다이어트는 당신이 열량 부족에 시달리게 할 수 있는데, 이것(열량 부족)은 체중 감소를 촉진할 수는 있으나, 체성분을 개선하는 데는 아무런 효과가 없으며, 실제로는 근육량의 감소를 초래할 수도 있다.", "(A) 시기도 중요하다.", "(A) 하루 중 전략적인 간격으로 이러한 필수 다량 영양소의 알맞은 조합을 섭취함으로써, 우리는 우리의 신체가 훨씬 더 빠르게 치유되고 성장하도록 도울 수 있다.", "(B) 당신의 신체는 또한 치유되고 더 강해지기 위해서 필수 다량 영양소의 적절한 균형을 필요로 한다.", "(B) 단백질, 탄수화물, 그리고 건강에 좋은 지방을 포함하는 이러한 다량 영양소는, 당신의 신체가 회복하고, 재건하고, 더 강해지기 위한 (그것의) 능력을 극대화하도록 도울 수 있다.", "(C) 열량 제한은 또한 당신의 신진대사를 느려지게 할 수도 있고, 에너지 수준을 현저히 감소시킬 수도 있다.", "(C) 신체가 (제대로) 기능하고 치유되기 위해서 그것(신체)이 필요로 하는 에너지를 가질 수 있도록, 적절한 양의 열량을 전달하기 위해 열량 섭취를 조절하는 것은 (다이어트에서) 유일한 올바른 접근법이다."], "ps": [{"n": 1, "ch": [{"e": "Some <b>fad diets<\/b> might have you", "k": "몇몇 <b>유행하는 다이어트<\/b>는 당신이 ~하게 할 수 있는데,"}, {"e": "running a <b>caloric deficit<\/b>,", "k": "<b>열량 부족<\/b>에 시달리게"}, {"e": "and while this might <b>encourage<\/b> weight loss,", "k": "이것<span class=\"r\">(= 열량 부족)<\/span>은 체중 감소를 <b>촉진할<\/b> 수는 있으나,"}, {"e": "it has <b>no effect<\/b> on improving body composition,", "k": "체성분을 개선하는 데는 <b>아무런 효과가 없으며<\/b>,"}, {"e": "and it could actually <b>result in<\/b> a loss of muscle mass.", "k": "실제로는 근육량의 감소를 <b>초래할<\/b> 수도 있다."}], "easy": "일부 유행 다이어트는 열량이 부족해지게 해요. 그러면 체중은 줄 수 있어도 몸의 구성은 나아지지 않고, 오히려 근육이 줄 수도 있어요.", "gist": "주어진 글: 열량 부족을 만드는 다이어트의 부작용을 말한다. 뒤에는 이 문제에 이어지는 내용이 와야 한다."}, {"n": 2, "ch": [{"e": "(A) <b>Timing<\/b> is also important.", "k": "(A) <b>시기<\/b>도 중요하다."}], "easy": "'언제' 먹는지도 중요하다는 말이에요.", "gist": "(A) 첫 문장: also로 '시기'라는 새 논점을 더한다."}, {"n": 3, "ch": [{"e": "By eating the right combinations", "k": "알맞은 조합을 섭취함으로써"}, {"e": "of these key macronutrients", "k": "이러한 필수 다량 영양소의"}, {"e": "at strategic intervals", "k": "전략적인 간격으로"}, {"e": "throughout the day,", "k": "하루 중"}, {"e": "we can help our bodies", "k": "우리는 우리의 신체를 도울 수 있다"}, {"e": "<b>heal<\/b> and grow even faster.", "k": "훨씬 더 빠르게 <b>치유되고<\/b> 성장하도록."}], "easy": "하루 중 알맞은 때에 이 영양소들을 알맞게 섞어 먹으면, 몸이 더 빨리 낫고 자랄 수 있어요.", "gist": "(A): 영양소를 먹는 시기가 왜 중요한지 보여 준다. these key macronutrients는 (B)에서 소개한 영양소를 받는다."}, {"n": 4, "ch": [{"e": "(B) Your body <b>also<\/b> needs", "k": "(B) 당신의 신체는 <b>또한<\/b> 필요로 한다"}, {"e": "the right balance of key macronutrients", "k": "필수 다량 영양소의 적절한 균형을"}, {"e": "to heal and grow stronger.", "k": "치유되고 더 강해지기 위해서."}], "easy": "몸이 낫고 더 튼튼해지려면 필수 영양소를 알맞은 비율로 먹는 것도 필요해요.", "gist": "(B) 첫 문장: also로 '영양소의 균형'이라는 또 하나의 논점을 더한다."}, {"n": 5, "ch": [{"e": "These macronutrients,", "k": "이러한 다량 영양소는,"}, {"e": "which include protein, carbohydrates, and healthy fats,", "k": "단백질, 탄수화물, 그리고 건강에 좋은 지방을 포함하는,"}, {"e": "can help your body maximize its ability", "k": "당신의 신체가 그<span class=\"r\">(= 신체)<\/span>의 능력을 극대화하도록 도울 수 있다"}, {"e": "to repair, rebuild, and grow stronger.", "k": "회복하고, 재건하고, 더 강해지기 위한"}], "easy": "다량 영양소는 단백질, 탄수화물, 건강한 지방이에요. 이것들이 몸이 회복하고 다시 만들고 더 강해지는 힘을 최대로 끌어올려 줘요.", "gist": "(B): 앞 문장의 '다량 영양소'가 무엇인지 알려 준다."}, {"n": 6, "ch": [{"e": "(C) <b>Calorie restriction<\/b> can also cause", "k": "(C) <b>열량 제한<\/b>은 또한 ~하게 할 수도 있다"}, {"e": "your <b>metabolism<\/b> to slow down,", "k": "당신의 <b>신진대사<\/b>를 느려지게"}, {"e": "and significantly reduce energy levels.", "k": "그리고 에너지 수준을 현저히 감소시킬 수도 있다."}], "easy": "열량을 너무 줄이면 신진대사가 느려지고, 에너지도 눈에 띄게 줄어들 수 있어요.", "gist": "(C) 첫 문장: also로 열량 제한의 또 다른 문제를 더한다. 주어진 글에서 말한 열량 부족 문제와 이어진다."}, {"n": 7, "ch": [{"e": "Controlling caloric intake", "k": "열량 섭취를 조절하는 것은"}, {"e": "to deliver the proper amount of calories", "k": "적절한 양의 열량을 전달하기 위해"}, {"e": "so that the body has the energy", "k": "신체가 에너지를 가질 수 있도록"}, {"e": "it needs to function and heal", "k": "그것<span class=\"r\">(= 신체)<\/span>이 (제대로) 기능하고 치유되기 위해서 필요로 하는"}, {"e": "is the only proper approach.", "k": "(다이어트에서) 유일한 올바른 접근법이다."}], "easy": "몸이 잘 움직이고 낫는 데 필요한 에너지를 얻도록, 열량 섭취를 알맞게 조절하는 것만이 올바른 방법이에요.", "gist": "(C): 열량 제한 문제의 해결책으로 열량 섭취를 적절히 조절하는 것을 제시한다."}]}, {"no": "08", "typ": "요약문 완성", "src": "2017년 11월 40번", "evn": [2, 3, 4, 5], "ev_en": "It relates to the degree to which the less powerful members of a society accept their inequality in power and consider it the norm. / In cultures with high acceptance of power distance (e.g., India, Brazil, Greece, Mexico, and the Philippines), people are not viewed as equals, and everyone has a clearly defined or allocated place in the social hierarchy. / In cultures with low acceptance of power distance (e.g., Finland, Norway, New Zealand, and Israel), people believe inequality should be minimal, and a hierarchical division is viewed as one of convenience only. / In these cultures, there is more fluidity within the social hierarchy, and it is relatively easy for individuals to move up the social hierarchy based on their individual efforts and achievements.", "ev_ko": [[2, "권력 거리는 사회에서 권력이 상대적으로 약한 구성원들이 권력에서의 불평등을 받아들이고 그것을 일반적인 것이라고 여기는 정도와 관련이 있다."], [3, "권력 거리에 대한 수용도가 높은 문화들에서 (예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀), 사람들은 동등한 존재로 여겨지지 않으며, 모든 사람은 사회 계급 속에서 분명히 규정된 혹은 할당된 지위를 갖는다."], [4, "권력 거리에 대한 수용도가 낮은 문화들에서 (예를 들어, 핀란드, 노르웨이, 뉴질랜드, 그리고 이스라엘), 사람들은 불평등은 최소한이어야 한다고 믿으며, 계급 구분은 오로지 편의를 위한 것으로 여겨진다."], [5, "이러한 문화들(권력 거리에 대한 수용도가 낮은 문화들)에서는, 사회 계급 안에 더 많은 유동성이 있으며, 개인들이 그들의 개인적 노력과 성과를 기반으로 사회 계급을 상승시키는 것이 상대적으로 쉽다."]], "why": ["요약문은 권력 거리에 대한 수용도가 높은 문화와 낮은 문화를 비교합니다", "(2)번에서 권력 거리는 힘이 약한 구성원들이 권력의 불평등을 <b>받아들이고<\/b> 그것을 당연한 것(the norm)으로 여기는 정도라고 했습니다", "(3)번처럼 수용도가 <b>높은<\/b> 문화에서는 사람들이 동등하게 여겨지지 않고 모두가 사회 계급 속에서 정해진 지위를 갖습니다", "그래서 (A)에는 이런 문화의 구성원들이 불평등을 <b>기꺼이(willing)<\/b> 받아들인다는 말이 들어갑니다", "(4)번에서 수용도가 <b>낮은<\/b> 문화의 사람들은 불평등이 최소한이어야 한다고 믿고, (5)번에서 이런 문화에서는 사회 계급 안에 더 많은 <b>유동성(fluidity)<\/b>이 있다고 했습니다", "그래서 (B)에는 <b>mobility(유동성)<\/b>가 들어갑니다."], "ch": [{"n": "①", "t": "willing … mobility", "g": "기꺼이 ~하는 … 유동성", "ok": true, "e": ["(A) 수용도가 높은 문화는 불평등을 <b>기꺼이(willing)<\/b> 받아들이고, (B) 수용도가 낮은 문화는 계급 안에서 더 많은 <b>유동성(mobility)<\/b>을 허용합니다", "둘 다 지문과 맞습니다."]}, {"n": "②", "t": "willing … assistance", "g": "기꺼이 ~하는 … 원조", "ok": false, "e": ["(A) willing은 맞습니다", "하지만 (B) <b>assistance(원조)<\/b>에 해당하는 내용은 지문에 없습니다", "지문은 사회 계급 안의 <b>유동성<\/b>을 말합니다(5)."]}, {"n": "③", "t": "reluctant … resistance", "g": "꺼리는 … 저항", "ok": false, "e": ["(A) <b>reluctant(꺼리는)<\/b>는 틀립니다", "수용도가 높은 문화는 불평등을 받아들이는 쪽입니다", "(B) <b>resistance(저항)<\/b>에 해당하는 내용도 지문에 없습니다."]}, {"n": "④", "t": "reluctant … flexibility", "g": "꺼리는 … 융통성", "ok": false, "e": ["(A) <b>reluctant(꺼리는)<\/b>가 틀립니다", "수용도가 높은 문화는 불평등을 받아들이는 쪽이므로 지문과 반대입니다."]}, {"n": "⑤", "t": "afraid … openness", "g": "두려워하는 … 개방", "ok": false, "e": ["(A) <b>afraid(두려워하는)<\/b>에 해당하는 내용은 지문에 없습니다", "(B) <b>openness(개방)<\/b>도 지문에서 말한 내용(유동성)이 아닙니다."]}], "tr": ["‘권력 거리’는 권력의 불평등한 분배가 한 문화의 사람들에 의해 얼마나 넓게 받아들여지는지를 나타내기 위해 사용되는 용어이다.", "권력 거리는 사회에서 권력이 상대적으로 약한 구성원들이 권력에서의 불평등을 받아들이고 그것을 일반적인 것이라고 여기는 정도와 관련이 있다.", "권력 거리에 대한 수용도가 높은 문화들에서 (예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀), 사람들은 동등한 존재로 여겨지지 않으며, 모든 사람은 사회 계급 속에서 분명히 규정된 혹은 할당된 지위를 갖는다.", "권력 거리에 대한 수용도가 낮은 문화들에서 (예를 들어, 핀란드, 노르웨이, 뉴질랜드, 그리고 이스라엘), 사람들은 불평등은 최소한이어야 한다고 믿으며, 계급 구분은 오로지 편의를 위한 것으로 여겨진다.", "이러한 문화들(권력 거리에 대한 수용도가 낮은 문화들)에서는, 사회 계급 안에 더 많은 유동성이 있으며, 개인들이 그들의 개인적 노력과 성과를 기반으로 사회 계급을 상승시키는 것이 상대적으로 쉽다.", "구성원들이 불평등을 좀 더 (A)기꺼이 받아들이는, 권력 거리에 대한 수용도가 높은 문화들과 달리, 권력 거리에 대한 수용도가 낮은 문화들은 사회 계급 내에서 더 많은 (B)유동성을 허용한다."], "ps": [{"n": 1, "ch": [{"e": "<b>Power distance<\/b> is the term", "k": "'<b>권력 거리<\/b>'는 용어이다"}, {"e": "used to refer to", "k": "나타내기 위해 사용되는"}, {"e": "how widely an unequal distribution of power", "k": "권력의 불평등한 분배가 얼마나 넓게"}, {"e": "is accepted", "k": "받아들여지는지를"}, {"e": "by the members of a culture.", "k": "한 문화의 사람들에 의해."}], "easy": "'권력 거리'는, 권력이 고르지 않게 나뉜 것을 한 문화의 사람들이 얼마나 넓게 받아들이는지를 나타낼 때 쓰는 말이에요.", "gist": "글의 핵심 용어 '권력 거리'를 정의하며 연다."}, {"n": 2, "ch": [{"e": "It relates to the degree", "k": "권력 거리는 정도와 관련이 있다"}, {"e": "to which the <b>less powerful<\/b> members of a society", "k": "사회에서 권력이 상대적으로 약한 구성원들이"}, {"e": "accept their inequality in power", "k": "권력에서의 불평등을 받아들이고"}, {"e": "and consider it the norm.", "k": "그것<span class=\"r\">(= 불평등)<\/span>을 일반적인 것이라고 여기는."}], "easy": "사회에서 힘이 약한 사람들이 권력의 불평등을 받아들이고 그걸 당연하게 여기는 정도를 말해요.", "gist": "'권력 거리'의 뜻을 풀어 준다. 불평등을 얼마나 받아들이느냐의 정도다. 요약문 (A)의 근거다."}, {"n": 3, "ch": [{"e": "In cultures with <b>high<\/b> acceptance of power distance", "k": "권력 거리에 대한 수용도가 <b>높은<\/b> 문화들에서"}, {"e": "(e.g., India, Brazil, Greece, Mexico, and the Philippines),", "k": "(예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀),"}, {"e": "people are not viewed as equals,", "k": "사람들은 동등한 존재로 여겨지지 않으며 n>"}], "easy": "수용도가 높은 문화에서는 사람들이 불평등을 더 기꺼이 받아들여요. 반대로 수용도가 낮은 문화에서는 사회 계급 안에서 더 많은 유동성을 허용해요.", "gist": "요약문: 두 문화의 차이를 한 문장으로 정리한다. (A)는 불평등을 받아들이는 태도, (B)는 계급 안의 유동성이다."}]}, {"no": "09", "typ": "문장 삽입", "src": "2022학년도 수능 39번", "evn": [1, 6], "ev_en": "As long as the irrealism of the silent black and white film predominated, one could not take filmic fantasies for representations of reality. / But sound and color threatened to create just such an illusion, thereby destroying the very essence of film art.", "ev_ko": [[1, "무성 흑백 영화의 비현실주의가 우세하는 한, 개인은 영화의 환상을 현실의 표현으로 여길 수 없었다."], [6, "④ 그러나 소리와 색채는 바로 그러한 착각(영화의 환상을 현실의 표현으로 여기는 것)을 만들겠다고 위협했고, 그로 인해 바로 그 영화 예술의 정수를 파괴했다."]], "why": ["삽입 문제는 <b>just such an illusion(바로 그러한 착각)<\/b> 같은 지시어가 단서입니다", "(6)의 just such an illusion은 주어진 문장 (1)의 <b>take filmic fantasies for representations of reality(영화의 환상을 현실의 표현으로 여기는 것)<\/b>에 해당합니다", "(5)까지는 소리와 색채 같은 불필요한 혁신 때문에 영화의 환상적 가치가 떨어졌다는 내용이 이어집니다", "(6)은 <b>But<\/b>으로 시작해, 소리와 색채가 영화 예술의 정수를 파괴했다고 말합니다", "그래서 (6) 앞에는 소리와 색채가 도입되기 전, 영화가 환상을 보여 주어 가치가 있었다는 내용이 와야 합니다", "따라서 주어진 문장은 (5)와 (6) 사이인 ④에 들어갑니다."], "ch": [{"n": "①", "t": "(2)와 (3) 사이", "g": "", "ok": false, "e": ["(3)의 <b>This is why<\/b>(이것이 ~한 이유이다)는 (2)의 내용을 받습니다", "①에 넣으면 (2)와 (3) 사이가 끊깁니다."]}, {"n": "②", "t": "(3)과 (4) 사이", "g": "", "ok": false, "e": ["(4)의 <b>these innovations<\/b>는 (3)에서 말한 혁신을 바로 받습니다", "②에 넣으면 (3)과 (4) 사이가 끊깁니다."]}, {"n": "③", "t": "(4)와 (5) 사이", "g": "", "ok": false, "e": ["(5)의 <b>they<\/b>는 (4)의 these innovations를 이어 받습니다", "③에 넣으면 (4)와 (5) 사이가 끊깁니다."]}, {"n": "④", "t": "(5)와 (6) 사이", "g": "", "ok": true, "e": ["(6)의 <b>just such an illusion<\/b>이 주어진 문장 (1)의 내용(영화의 환상을 현실의 표현으로 여기는 것)에 해당합니다", "그래서 주어진 문장이 (6) 바로 앞에 와야 합니다."]}, {"n": "⑤", "t": "(6)과 (7) 사이", "g": "", "ok": false, "e": ["주어진 문장이 (6) 뒤에 오면, (6)의 <b>just such an illusion<\/b>이 가리키는 내용이 앞에 없게 됩니다", "주어진 문장은 (6) 앞에 와야 합니다."]}], "tr": ["무성 흑백 영화의 비현실주의가 우세하는 한, 개인은 영화의 환상을 현실의 표현으로 여길 수 없었다.", "영화는 우리의 현실에 숨겨진 윤곽을 볼 수 있게 하는 그것의 능력 때문이 아니라, 현실 그 자체가 가리고 있는 것, 즉 환상의 차원을 드러내는 능력 때문에 가치가 있다.", "① 이것이 최초의 위대한 영화 이론가들이 한 목소리로 영화를 현실주의의 방향으로 밀어 넣은 소리와 (색채와 같은) 다른 기술적인 혁신의 도입을 공공연히 비난했던 이유이다.", "② 영화가 전적으로 환상의 예술이었기 때문에, 이러한 혁신은 완전히 불필요했다.", "③ 그리고 설상가상으로, 그것들은 잠재적으로 영화를 단지 현실의 표현을 위한 전달 장치로 변형시키면서, 영화 제작자들과 관객들이 영화의 환상의 차원에서 등을 돌리게 하는 것 외에는 아무것도 할 수 없었다.", "④ 그러나 소리와 색채는 바로 그러한 착각(영화의 환상을 현실의 표현으로 여기는 것)을 만들겠다고 위협했고, 그로 인해 바로 그 영화 예술의 정수를 파괴했다.", "⑤ Rudolf Arnheim이 말하듯이, “예술가의 창의력은 오로지 현실과 표현의 매개가 일치하지 않는 곳에서만 작용할 수 있다.”"], "ps": [{"n": 1, "ch": [{"e": "<b>As long as<\/b>", "k": "~하는 한"}, {"e": "the <b>irrealism<\/b> of the silent black and white film", "k": "무성 흑백 영화의 <b>비현실주의<\/b>가"}, {"e": "<b>predominated<\/b>,", "k": "우세한,"}, {"e": "one could not take", "k": "개인은 여길 수 없었다"}, {"e": "filmic fantasies", "k": "영화의 환상을"}, {"e": "for representations of reality.", "k": "현실의 표현으로."}], "easy": "무성 흑백 영화가 비현실적인 느낌이 강하던 동안에는, 사람들이 영화의 환상을 현실을 보여 주는 것으로 착각할 수 없었어요.", "gist": "주어진 문장: 이 문장의 '영화의 환상을 현실의 표현으로 여기는 것'이 (6)의 just such an illusion에 해당한다."}, {"n": 2, "ch": [{"e": "Cinema is valuable", "k": "영화는 가치가 있다"}, {"e": "<b>not<\/b> for its ability to make visible", "k": "볼 수 있게 하는 그것의 능력 때문이 아니라"}, {"e": "the hidden outlines of our reality,", "k": "우리의 현실에 숨겨진 윤곽을"}, {"e": "<b>but<\/b> for its ability to reveal", "k": "드러내는 능력 때문에"}, {"e": "what reality itself <b>veils<\/b> —", "k": "현실 그 자체가 가리고 있는 것,"}, {"e": "the dimension of fantasy.", "k": "즉 환상의 차원을."}], "easy": "영화가 값진 이유는 현실의 숨은 윤곽을 보여 주기 때문이 아니에요. 현실이 가리고 있는 '환상의 차원'을 드러내기 때문이에요.", "gist": "글의 주제: 영화의 가치는 환상의 차원에 있다."}, {"n": 3, "ch": [{"e": "<b>This is why<\/b>,", "k": "이것이 ~한 이유이다,"}, {"e": "to a person,", "k": "한 목소리로"}, {"e": "the first great theorists of film <b>decried<\/b>", "k": "최초의 위대한 영화 이론가들이 공공연히 비난했던"}, {"e": "the introduction of sound and other technical innovations", "k": "소리와 다른 기술적인 혁신의 도입을"}, {"e": "(such as color)", "k": "(색채와 같은)"}, {"e": "that pushed film in the direction of realism.", "k": "영화를 현실주의의 방향으로 밀어 넣은."}],  of our reality (우리 현실의 숨겨진 윤곽을 보이게 하는 능력 때문이 아니라)", "B: but for its ability to reveal what reality itself veils (현실 그 자체가 감추는 것을 드러내는 능력 때문에)"]}, {"t": "A의 <b>to make visible the hidden outlines of our reality</b>는 <b>to부정사(형용사적 용법)</b>이다. ability를 꾸민다. make A B 구조로 'outlines를 visible하게 만들다'이다. (visible 보이는, hidden 숨겨진, outline 윤곽)"}, {"t": "B의 <b>to reveal what reality itself veils</b>는 <b>to부정사(형용사적 용법)</b>이다. ability를 꾸민다.", "sub": ["reveal 드러내다의 목적어 = what reality itself veils (현실 그 자체가 감추는 것). what은 선행사를 포함한 관계대명사. veil 가리다"]}, {"t": "<b>— the dimension of fantasy</b>는 what절의 내용을 풀어 주는 <b>동격 명사구</b>이다. '즉 환상의 차원'이라는 뜻이다. (dimension 차원, fantasy 환상)"}], "sum": "영화의 가치는 현실이 감추는 환상의 차원을 드러내는 능력"}, {"i": "07", "q": "10", "s": "C4", "title": "목적 to부정사 + 동사 3개 병렬 + until절", "eng": "To make it easier for Jason, / the pitcher<sup>1</sup> moved in closer, / threw the ball gently<sup>2</sup>, / and kept throwing / until he could hit / one.", "notes": [["1", "pitcher", "투수"], ["2", "gently", "부드럽게"]], "lit": "Jason에게 더 쉽게 만들어 주기 위해 / 투수는 더 가까이 다가왔다 / 공을 부드럽게 던졌다 / 그리고 계속 던졌다 / 그가 칠 수 있을 때까지 / 하나를", "nat": "Jason이 더 쉽게 할 수 있도록, 투수는 더 가까이 다가와서 공을 부드럽게 던졌고, 그가 공을 칠 수 있을 때까지 계속 던졌다.", "ana": "<b>To make it easier</b>는 <b>목적</b>을 나타내는 to부정사이며, <b>moved, threw, kept</b> 세 개의 동사가 <b>and로 병렬</b> 연결되어 있습니다. <b>until he could hit one</b>은 '~할 때까지'라는 <b>시간의 부사절</b>입니다.", "pe": "\u0001To make it easier for Jason\u0002, / the pitcher<sup>1</sup> moved \u0001in closer\u0002, / threw the ball \u0001gently<sup>2</sup>\u0002, / and kept throwing / \u0001until he could hit\u0002 / \u0001one\u0002.", "pk": "\u0001Jason에게 더 쉽게 만들어 주기 위해\u0002 / 투수는 \u0001더 가까이\u0002 다가왔다 / 공을 \u0001부드럽게\u0002 던졌다 / 그리고 계속 던졌다 / \u0001그가 칠 수 있을 때까지\u0002 / \u0001하나를\u0002", "core": "투수는 움직였고, 공을 던졌고, 계속 던졌다.", "tags": ["To make it easier for Jason = to부정사(부사적: 목적): 문장 전체 꾸밈. <b>make it easier</b> (5형식)", "the pitcher moved: 1형식 SV. in closer = 부사: moved 꾸밈", "threw the ball: 3형식 SVO, <b>동사 3개 병렬</b>의 둘째. gently = 부사: threw 꾸밈", "and kept throwing: kept + 동명사(목적어). 병렬 셋째", "until절 = 시간 부사절: kept throwing 꾸밈. he could hit one", "one = until절 안 hit의 목적어 (= 공 하나)"], "steps": [{"t": "이 문장은 <b>동사 3개가 병렬된 문장</b>이다 (moved는 1형식, threw와 kept는 3형식). 앞의 to부정사와 뒤 until절로 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the pitcher (투수)", "V: moved (move 움직이다), threw (throw 던지다), kept (keep 계속하다). 모두 과거형", "O: the ball (공), throwing (던지는 것. keep의 목적어인 동명사)", "뼈대 = <b>the pitcher moved, threw the ball, and kept throwing</b>"]}, {"t": "맨 앞 <b>To make it easier for Jason</b>은 <b>to부정사(부사적 용법: 목적)</b>이다. 문장 전체를 꾸미며 'Jason에게 더 쉽게 만들어 주기 위해'라는 뜻이다. it은 make의 목적어, easier는 보어(make A B)이다."}, {"t": "각 동사의 요소이다.", "sub": ["moved in closer: in closer (더 가까이)는 부사로 moved를 꾸밈", "threw the ball gently: the ball (공)이 목적어, gently (부드럽게)는 threw를 꾸밈", "kept throwing: throwing은 keep의 목적어인 동명사 (던지는 것을 계속했다)"]}, {"t": "<b>until he could hit one</b>은 <b>시간 부사절</b>이다. kept throwing을 꾸미며 '그가 칠 수 있을 때까지'라는 뜻이다. one = a ball (공 하나)이다."}, {"t": "함정: 동사가 세 개 나열된 병렬이다. throwing은 동명사이므로 문장 동사로 세지 않는다."}], "sum": "Jason이 칠 수 있을 때까지 투수가 가까이서 부드럽게 던짐"}, {"i": "08", "q": "10", "s": "B2", "title": "수동태 + those of", "eng": "Their voices / were soon joined<sup>1</sup> / by those of all the players, / on both teams.", "notes": [["1", "join", "합쳐지다"]], "lit": "그들의 목소리는 / 곧 합쳐졌다 / 모든 선수들의 목소리와 / 양 팀의", "nat": "그들의 목소리는 곧 양 팀 모든 선수들의 목소리와 합쳐졌다.", "ana": "<b>were joined by</b>는 <b>수동태</b>이며, <b>those</b>는 앞의 <b>voices</b>의 반복을 피하기 위해 쓰인 <b>대명사</b>입니다.", "pe": "Their voices / were \u0001soon\u0002 joined<sup>1</sup> / \u0001by those of all the players\u0002, / \u0001on both teams\u0002.", "pk": "그들의 목소리는 / \u0001곧\u0002 합쳐졌다 / \u0001모든 선수들의 목소리와\u0002 / \u0001양 팀의\u0002", "core": "그들의 목소리는 합쳐졌다.", "tags": ["Their voices = 주어", "were joined: 수동태 SV. soon = 부사: were joined 꾸밈", "by those = 전치사구(부사구, 행위자): joined 꾸밈. <b>those</b> = the voices 대신. of all the players = 전치사구(형용사구): those 꾸밈", "on both teams = 전치사구(형용사구): players 꾸밈"], "steps": [{"t": "이 문장은 <b>수동태 문장</b>이다. 문형 기준으로 수동태 주절은 <b>1형식</b>이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Their voices (그들의 목소리)", "V: were joined (join 합쳐지다의 수동태)", "뼈대 = <b>Their voices were joined</b>", "soon (곧)은 were joined를 꾸미는 부사"]}, {"t": "<b>by those of all the players</b>는 <b>전치사구(부사구, 행위자)</b>이다. were joined를 꾸미며 '모든 선수들의 목소리에 의해'라는 뜻이다. those는 앞의 the voices (목소리들)를 대신하는 대명사이고, of all the players (모든 선수들의)가 꾸민다."}, {"t": "<b>on both teams</b>는 <b>전치사구(형용사구)</b>이다. players를 꾸미며 '양 팀의'라는 뜻이다. (team 팀)"}, {"t": "함정: those는 '그것들'이 아니라 반복을 피하려고 쓴 대명사이다. 여기서는 voices이다."}], "sum": "선수 모두의 목소리가 더해져 합창"}], "qs": [{"q": "07", "type": "글의 순서", "src": "2018년 11월 37번", "ans": "⑤", "tr": [["1", "일부 유행 다이어트는 당신을 열량 부족 상태로 만들 수 있는데, 이것이 체중 감소를 촉진할 수는 있지만, 체성분을 개선하는 데는 아무런 효과가 없으며, 실제로는 근육량의 감소를 초래할 수도 있다."], ["2", "(C) 열량 제한은 또한 신진대사를 둔화시키고, 에너지 수준을 현저히 감소시킬 수도 있다. 신체가 기능하고 회복하는 데 필요한 적절한 양의 열량을 전달하기 위해 열량 섭취를 조절하는 것이 유일하게 올바른 접근법이다."], ["3", "(B) 당신의 신체는 또한 회복하고 더 강해지기 위해 핵심 다량 영양소의 알맞은 균형을 필요로 한다. 단백질, 탄수화물, 그리고 건강에 좋은 지방을 포함하는 이러한 다량 영양소는, 당신의 신체가 회복하고, 재건하고, 더 강해지기 위한 능력을 극대화하도록 도울 수 있다."], ["4", "(A) 시기 또한 중요하다. 하루 중 전략적인 간격으로 이러한 핵심 다량 영양소의 알맞은 조합을 섭취함으로써, 우리는 우리의 신체가 훨씬 더 빠르게 회복되고 성장하도록 도울 수 있다."]], "evh": "(C) 첫 문장 · (B) 첫 문장 · (A) 첫 문장", "ev": [{"en": true, "h": "(C) Calorie restriction can also cause your metabolism to slow down ~ / (B) Your body also needs the right balance of key macronutrients ~ / (A) Timing is also important."}, {"en": false, "h": "순서 문제는 <b>also(또한)</b>로 이어지는 논점 추가 흐름이 근거입니다. 주어진 글은 열량 제한(다이어트)의 부작용을 말하므로, 열량 제한의 <b>또 다른 문제(신진대사 저하)</b>를 말하는 (C)가 먼저 옵니다. (C)에 이어 신체가 <b>또한(also)</b> 다량 영양소의 균형도 필요하다는 (B)가 오고, 마지막으로 <b>시기(timing) 또한(also)</b> 중요하다는 (A)가 이어집니다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)의 <b>these key macronutrients</b>가 아직 언급되지 않은 대상을 가리켜 부적절합니다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(B)가 먼저 오면 주어진 글의 열량 제한 문제와 자연스럽게 이어지지 않습니다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": false, "x": true, "trap": false, "e": "같은 이유로 (B)가 맨 앞에 올 수 없습니다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": true, "e": "(A)의 macronutrients가 아직 (B)에서 소개되지 않은 상태라 부적절합니다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": true, "x": false, "trap": false, "e": "열량 제한의 또 다른 문제(C) → 다량 영양소의 균형도 필요함(B) → 섭취 시기도 중요함(A)의 흐름이 'also'의 반복과 정확히 맞습니다."}], "w": [["fad diet", "유행 다이어트"], ["caloric deficit", "열량 부족"], ["body composition", "체성분"], ["muscle mass", "근육량"], ["metabolism", "신진대사"], ["calorie restriction", "열량 제한"], ["intake", "섭취"], ["macronutrient", "다량 영양소"], ["repair", "회복하다"], ["strategic interval", "전략적 간격"]]}, {"q": "08", "type": "요약문 완성", "src": "2017년 11월 40번", "ans": "①", "tr": [["1", "권력 거리는 권력의 불평등한 분배가 한 문화의 구성원들에 의해 얼마나 널리 받아들여지는지를 나타내기 위해 사용되는 용어이다."], ["2", "이는 사회에서 권력이 상대적으로 약한 구성원들이 권력에서의 불평등을 받아들이고 그것을 규범으로 여기는 정도와 관련이 있다."], ["3", "권력 거리에 대한 수용도가 높은 문화(예를 들어, 인도, 브라질, 그리스, 멕시코, 그리고 필리핀)에서는, 사람들이 동등하게 여겨지지 않으며, 모든 사람은 사회 계급 속에서 명확히 규정된 혹은 할당된 지위를 갖는다."], ["4", "권력 거리에 대한 수용도가 낮은 문화(예를 들어, 핀란드, 노르웨이, 뉴질랜드, 그리고 이스라엘)에서는, 사람들이 불평등이 최소화되어야 한다고 믿으며, 계급 구분은 오로지 편의를 위한 것으로 여겨진다."], ["5", "이러한 문화에서는 사회 계급 안에 더 많은 유동성이 있으며, 개인들이 그들의 개인적 노력과 성과를 기반으로 사회 계급을 상승시키는 것이 상대적으로 쉽다."]], "evh": "4·5번 문장", "ev": [{"en": true, "h": "In cultures with low acceptance of power distance ~ people believe inequality should be minimal ~ / In these cultures, there is more fluidity within the social hierarchy ~"}, {"en": false, "h": "요약문 문제는 대조되는 두 문화 유형의 특징을 정리해야 합니다. 3번에서 수용도가 높은 문화의 사람들은 불평등을 <b>기꺼이 받아들인다(willing)</b>고 했고, 4·5번에서 수용도가 낮은 문화는 계급 간 <b>유동성(mobility)</b>이 크다고 했으므로 (A)는 willing, (B)는 mobility입니다."}], "opts": [{"n": "①", "t": "willing … mobility", "a": true, "x": false, "trap": false, "e": "수용도 높은 문화는 불평등을 <b>기꺼이 받아들이고(willing)</b>, 수용도 낮은 문화는 계급 간 <b>유동성(mobility)</b>이 크다는 내용과 일치합니다."}, {"n": "②", "t": "willing … assistance", "a": false, "x": true, "trap": false, "e": "(B)의 assistance(도움)는 본문에 근거가 없습니다."}, {"n": "③", "t": "reluctant … resistance", "a": false, "x": true, "trap": true, "e": "reluctant(꺼리는)는 오히려 수용도 낮은 문화 쪽 특징에 가까워 (A) 자리에 부적절합니다."}, {"n": "④", "t": "reluctant … flexibility", "a": false, "x": true, "trap": false, "e": "(A) reluctant가 부적절합니다."}, {"n": "⑤", "t": "afraid … openness", "a": false, "x": true, "trap": false, "e": "afraid(두려워하는)에 관한 근거가 없습니다."}], "w": [["power distance", "권력 거리"], ["unequal distribution", "불평등한 분배"], ["norm", "규범"], ["allocate", "할당하다"], ["hierarchy", "계급, 위계"], ["minimal", "최소한의"], ["convenience", "편의"], ["fluidity", "유동성"], ["mobility", "이동성"]]}, {"q": "09", "type": "문장 삽입", "src": "2022학년도 수능 39번", "ans": "④", "tr": [["1", "영화는 우리 현실의 숨겨진 윤곽을 보이게 하는 능력 때문이 아니라, 현실 그 자체가 감추고 있는 것, 즉 환상의 차원을 드러내는 능력 때문에 가치가 있다."], ["2", "( ① ) 이것이 바로, 개인적으로, 영화의 위대한 최초 이론가들이 영화를 사실주의 방향으로 밀어붙인 소리와 (색채 같은) 다른 기술적 혁신의 도입을 공공연히 비난했던 이유이다."], ["3", "( ② ) 영화는 전적으로 환상적인 예술이었으므로, 이러한 혁신들은 완전히 불필요했다."], ["4", "( ③ ) 그리고 설상가상으로, 그것들은 영화 제작자들과 관객들을 영화의 환상적 차원으로부터 멀어지게 하고, 영화를 현실의 표현을 위한 단순한 전달 장치로 변형시킬 뿐이었다."], ["5", "( ④ ) [삽입 문장] 무성 흑백 영화의 비현실성이 지배적이었던 한, 사람들은 영화적 환상을 현실의 표현으로 여길 수 없었다."], ["6", "( ⑤ ) 그러나 소리와 색채는 바로 그러한 환상을 만들어 내겠다고 위협했고, 그로 인해 영화 예술의 정수를 파괴했다."], ["7", "Rudolf Arnheim이 말하듯이, \"예술가의 창의적인 힘은 오로지 현실과 표현의 매개가 일치하지 않는 곳에서만 발휘될 수 있다.\""]], "evh": "⑤ 앞 문장", "ev": [{"en": true, "h": "But sound and color threatened to create just such an illusion, thereby destroying the very essence of film art."}, {"en": false, "h": "문장 삽입 문제는 지시어가 결정적 단서입니다. ⑤ 앞 문장의 <b>just such an illusion(바로 그런 환상)</b>은 주어진 문장의 <b>filmic fantasies for representations of reality(현실의 표현으로서의 영화적 환상)</b>를 가리킵니다. ③까지는 소리·색채 같은 혁신이 영화의 환상적 가치를 없앤다는 비판이 이어지는데, 주어진 문장이 그 사이(④)에 들어가야 ⑤ 앞 문장의 'But'이 앞 내용과 자연스럽게 대조를 이룹니다. 따라서 주어진 문장은 ④에 들어가야 합니다."}], "opts": [{"n": "①", "t": "위치", "a": false, "x": true, "trap": false, "e": "아직 소리·색채 혁신에 대한 비판이 시작되는 지점이라 이르며, 뒤의 'But'과 바로 연결되지 않습니다."}, {"n": "②", "t": "위치", "a": false, "x": true, "trap": false, "e": "혁신이 불필요했다는 비판이 막 시작된 지점이라 이릅니다."}, {"n": function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
