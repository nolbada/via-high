<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

l trait</b>가 정면으로 맞서면서 글 전체의 대립축을 세운다.", "pe": "\u0001Since the concept<sup>1</sup> \u0001of a teddy bear\u0002 is \u0001very obviously\u0002 not a \u0001genetically<sup>2</sup> inherited<sup>3</sup>\u0002 trait\u0002, / we can be confident<sup>4</sup> / \u0001that we are looking at a \u0001cultural\u0002 trait\u0002.", "pk": "\u0001봉제 곰 인형이라는 개념이 아주 명백하게 유전적으로 물려받은 특성이 아니기 때문에\u0002, / 우리는 확신할 수 있다 / \u0001우리가 문화적 특성을 보고 있는 것이라고\u0002.", "core": "우리는 확신할 수 있다.", "tags": ["<b>Since절</b> = 이유 부사절: 주절 꾸밈. 안쪽 주어 concept, 동사 is, 보어 trait", "주어 we + 동사 can be + 보어 confident (SVC)", "<b>that절</b> = 접속사절(부사적): confident의 내용 꾸밈 (SVC가 이미 완성) [기준: 문형 기준]"], "steps": [{"t": "이 문장은 <b>부사절 + S+V+C(2형식)</b>이다. 앞에 이유절이 있고 뒤에 that절이 붙어 길어 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: we (우리)", "V: can be (be ~일 수 있다)", "C: confident (확신하는)", "뼈대 = <b>we can be confident</b>"]}, {"t": "<b>that we are looking at a cultural trait</b>은 confident의 내용을 알려 주는 <b>that절</b>이다. '우리가 문화적 특성을 보고 있는 것이라고'. 이 that절을 빼도 SVC가 이미 완성이라 수식어로 본다. (문형 기준)", "sub": ["cultural = 문화적인, trait = 특성", "look at = ~을 보다, are looking은 현재진행형"]}, {"t": "맨 앞 <b>Since the concept of a teddy bear is very obviously not a genetically inherited trait</b>는 <b>이유 부사절</b>이다. '봉제 곰 인형이라는 개념이 아주 명백히 유전적으로 물려받은 특성이 아니므로'.", "sub": ["concept = 개념, genetically = 유전적으로, inherit = 물려받다, obviously = 명백히", "절 안의 뼈대는 concept (S) + is (V) + trait (C)이다. inherited는 trait을 꾸미는 과거분사이다."]}], "sum": "곰 인형 개념은 유전이 아니므로 문화적 특성이라 확신"}, {"i": "03", "q": "08", "s": "4", "title": "주격 관계절 + 대시 삽입 + 멀리 떨어진 동사", "eng": "Teddy bears / that had a more baby-like<sup>1</sup> appearance<sup>2</sup> — however slight<sup>3</sup> this may have been initially<sup>4</sup> — / were thus more popular with customers.", "notes": [["1", "baby-like", "아기 같은"], ["2", "appearance", "외모, 생김새"], ["3", "slight", "미미한, 사소한"], ["4", "initially", "처음에는"]], "lit": "봉제 곰 인형들은 / 더 아기 같은 외모를 지녔던 — 처음에는 그것이 아무리 미미했다 하더라도 — / 그래서 고객들에게 더 인기가 있었다.", "nat": "더 아기 같은 외모를 지닌 봉제 곰 인형은, 처음에는 그 차이가 아무리 미미했더라도, 그 덕분에 고객들에게 더 인기가 있었다.", "ana": "주어 <b>Teddy bears</b> 뒤에 관계대명사절과 대시 삽입구가 잇달아 끼어들어 동사 <b>were</b>가 아주 멀어졌다. <b>that had</b>는 bears를 꾸미는 <b>주격 관계대명사</b>절이고, 대시 사이의 <b>however slight this may have been</b>은 '<b>아무리 ~하더라도</b>'라는 양보절이다. however 뒤에 형용사가 곧바로 붙는 이 형태는 「no matter how + 형용사」와 같다. 대시로 감싸인 부분은 통째로 지우고 읽으면 <b>Teddy bears ~ were more popular</b>라는 뼈대가 드러난다.", "pe": "Teddy bears / \u0001that had a more baby-like<sup>1</sup> appearance<sup>2</sup>\u0002 — \u0001however slight<sup>3</sup> this may have been initially<sup>4</sup>\u0002 — / were \u0001thus\u0002 more popular \u0001with customers\u0002.", "pk": "봉제 곰 인형들은 / \u0001더 아기 같은 외모를 지녔던\u0002 — \u0001처음에는 그것이 아무리 미미했다 하더라도\u0002 — / \u0001그래서\u0002 \u0001고객들에게\u0002 더 인기가 있었다.", "core": "봉제 곰 인형들은 더 인기가 있었다.", "tags": ["주어 Teddy bears (동사는 chunk3의 were)", "<b>that절</b> = 관계절(형용사절): Teddy bears 꾸밈. 대시 안 however ~ = 삽입 양보절 ('아무리 ~하더라도')", "동사 were + 보어 more popular (SVC). thus = 부사. with customers = 부사구: popular 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어와 동사 사이에 관계절과 대시 삽입이 있어 동사가 아주 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Teddy bears (봉제 곰 인형들)", "V: were (be ~이었다)", "C: more popular (더 인기 있는)", "뼈대 = <b>Teddy bears were more popular</b>", "thus (그래서)는 부사, <b>with customers</b> (고객들에게)는 popular를 꾸미는 부사구이다. customer = 고객"]}, {"t": "주어와 동사 사이의 <b>that had a more baby-like appearance</b>는 <b>주격 관계절(형용사절)</b>로 Teddy bears를 꾸민다. '더 아기 같은 외모를 지녔던'.", "sub": ["baby-like = 아기 같은, appearance = 외모", "had가 관계절의 동사이고 진짜 동사는 뒤의 were이다."]}, {"t": "대시 사이의 <b>however slight this may have been initially</b>는 삽입된 <b>양보절</b>이다. '처음에는 그것이 아무리 미미했다 하더라도'라는 뜻이다.", "sub": ["however = 아무리 ~해도, slight = 미미한, initially = 처음에는", "this = a more baby-like appearance (더 아기 같은 외모)"]}, {"t": "관계절과 삽입절을 괄호로 묶어 놓고 읽으면 Teddy bears ... were more popular가 바로 이어진다."}], "sum": "아기 같은 외모의 곰 인형, 고객에게 더 인기"}, {"i": "04", "q": "09", "s": "1", "title": "S+V(수동태) + 주격 관계절 + 결과 to부정사", "eng": "Recently, / a number of commercial ventures<sup>1</sup> have been launched<sup>2</sup> / that offer social robots as personal home assistants<sup>3</sup>, / perhaps eventually to rival<sup>4</sup> existing smart-home assistants.", "notes": [["1", "commercial venture", "상업적 벤처 기업"], ["2", "launch", "출범시키다, 시작하다"], ["3", "assistant", "도우미, 보조 장치"], ["4", "rival", "~에 필적하다, 겨루다"]], "lit": "최근에, / 다수의 상업적 벤처 기업이 출범했다 / 소셜 로봇을 개인용 가정 도우미로 제공하는, / 아마도 결국에는 기존의 스마트홈 도우미와 겨루게 될.", "nat": "최근에 소셜 로봇을 개인용 가정 도우미로 제공하는 상업적 벤처 기업이 다수 등장했는데, 이들은 아마 결국 기존의 스마트홈 도우미와 겨루게 될 것이다.", "ana": "관계대명사 <b>that</b>이 꾸미는 것은 바로 앞의 launched가 아니라 저 앞의 <b>a number of commercial ventures</b>다. 주어가 길고 동사가 수동태라 균형이 무너지므로 관계사절을 <b>뒤로 미룬</b> 것인데, 이때는 '어느 명사와 뜻이 통하는가'로 판단한다. 로봇을 제공하는 주체는 벤처 기업이므로 답이 정해진다. 마지막의 <b>to rival</b>은 '겨루기 위해'가 아니라 '<b>결국 ~하게 될</b>'이라는 결과의 뜻으로, 앞의 <b>perhaps eventually</b>가 그 신호다.", "pe": "\u0001Recently\u0002, / a number of \u0001commercial\u0002 ventures<sup>1</sup> have been launched<sup>2</sup> / \u0001that offer social robots \u0001as personal home assistants<sup>3</sup>\u0002\u0002, / \u0001perhaps eventually to rival<sup>4</sup> existing smart-home assistants\u0002.", "pk": "\u0001최근에\u0002, / 다수의 상업적 벤처 기업이 출범했다 / \u0001소셜 로봇을 개인용 가정 도우미로 제공하는\u0002, / \u0001아마도 결국에는 기존의 스마트홈 도우미와 겨루게 될\u0002.", "core": "다수의 벤처 기업이 출범했다.", "tags": ["Recently = 부사: 문장 전체 꾸밈", "주어 ventures + 동사 have been launched (수동). commercial = 형용사: ventures 꾸밈", "<b>that절</b> = 관계절(형용사절): ventures 꾸밈. as ~ assistants = 부사구(자격): offer 꾸밈", "perhaps eventually to rival ~ = to부정사(부사적: 결과 '결국 ~하게 될'): 앞 내용 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(수동태, 1형식)</b>이다. 관계절이 주어와 떨어져 뒤에 붙어 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: a number of commercial ventures (다수의 상업적 벤처 기업)", "V: have been launched (launch 출범시키다의 현재완료 수동태, 출범했다)", "뼈대 = <b>a number of commercial ventures have been launched</b>", "a number of = 다수의, venture = 벤처 기업, commercial = 상업적인", "Recently (최근에)는 문장 전체를 꾸미는 부사이다."]}, {"t": "<b>that offer social robots as personal home assistants</b>는 <b>주격 관계절</b>로 ventures를 꾸민다. '소셜 로봇을 개인용 가정 도우미로 제공하는'.", "sub": ["offer = 제공하다, assistant = 도우미", "동사가 offer(원형)인 이유는 선행사가 복수 ventures이기 때문이다. 관계절이 주어에서 멀리 떨어진 것이 함정이다.", "as personal home assistants는 offer를 꾸미는 '자격' 부사구이다."]}, {"t": "끝의 <b>perhaps eventually to rival existing smart-home assistants</b>는 <b>to부정사(부사적: 결과)</b>이다. '아마 결국에는 기존 스마트홈 도우미와 겨루게 될'이라는 뜻이다.", "sub": ["rival = 겨루다, 경쟁하다, existing = 기존의"]}], "sum": "최근 개인 가정용 소셜 로봇을 내놓는 벤처 다수 출범"}, {"i": "05", "q": "10", "s": "A-1", "title": "S+V+C(like절) + 독립분사구문", "eng": "The colors of the trees looked like they were on fire<sup>1</sup>, / the reds and oranges competing<sup>2</sup> with the yellows and golds.", "notes": [["1", "on fire", "불타는"], ["2", "compete with", "~와 겨루다"]], "lit": "나무들의 색깔은 마치 불타고 있는 것처럼 보였고, / 붉은색과 주황색이 노란색·황금색과 겨루고 있었다.", "nat": "나무들의 색깔은 마치 불이 붙은 것처럼 보였는데, 붉은색과 주황색이 노란색과 황금색과 겨루고 있었다.", "ana": "<b>look like</b> 뒤에 명사가 아니라 <b>절(they were on fire)</b>이 통째로 왔다. 원래 like는 전치사지만 회화체에서는 이렇게 접속사처럼 쓰인다. 콤마 뒤의 <b>the reds and oranges competing ~</b>은 앞 절에 매달린 <b>분사구문</b>인데, 주절의 주어(The colors)와 분사의 주어(the reds and oranges)가 달라서 <b>의미상 주어를 앞에 남겨 둔</b> 형태다. 이런 분사구문은 '<b>그리고 ~하고 있었다</b>'처럼 앞 문장에 이어 붙여 읽으면 자연스럽다.", "pe": "The colors \u0001of the trees\u0002 looked \u0001like they were on fire<sup>1</sup>\u0002, / \u0001the reds and oranges competing<sup>2</sup> \u0001with the yellows and golds\u0002\u0002.", "pk": "\u0001나무들의\u0002 색깔은 \u0001마치 불타고 있는 것처럼\u0002 보였고, / \u0001붉은색과 주황색이 노란색·황금색과 겨루고 있었다\u0002.", "core": "색깔은 보였다.", "tags": ["주어 colors + 동사 looked (1형식). of the trees = 형용사구: colors 꾸밈. like they were on fire = like절(부사절): looked 꾸밈. like 붙은 절은 보어 아님 [기준: 모양 규칙]", "<b>독립 분사구문</b>(부사적): 앞 절 꾸밈. 의미상 주어 the reds and oranges. with ~ = 부사구: competing 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) + 독립분사구문</b>이다. look 뒤에 like절이 보어로 오고, 그 뒤에 분사구문이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The colors of the trees (나무들의 색깔)", "V: looked (look ~처럼 보이다의 과거형)", "C: like the  {"t": "<b>from the sun</b> (태양으로부터)은 light를 꾸미는 전치사구(형용사구)이다."}, {"t": "끝의 <b>moving upstream</b>은 <b>분사구문</b>(동시 상황)이다. '상류로 이동하면서'라는 뜻이다.", "sub": ["move = 이동하다, upstream = 상류로", "주인은 앞 절의 주어 fish tails이다. moving은 동사가 아니라 분사이다."]}], "sum": "수백 개 물고기 꼬리, 햇빛 받으며 상류로 이동"}, {"i": "08", "q": "10", "s": "D-4", "title": "S+V + 독립분사구문 + until절", "eng": "Another jumped, / its body spinning<sup>1</sup> / until it made it over<sup>2</sup> the falls<sup>3</sup>.", "notes": [["1", "spin", "빙글빙글 돌다"], ["2", "make it over", "~을 넘어서 해내다"], ["3", "falls", "폭포"]], "lit": "또 다른 한 마리가 뛰어올랐고, / 그 몸이 빙글빙글 돌았다 / 마침내 그것이 폭포를 넘어설 때까지.", "nat": "또 다른 한 마리가 뛰어올랐고, 몸을 빙글빙글 돌리다가 마침내 폭포를 넘어섰다.", "ana": "<b>its body spinning</b>은 앞에 접속사도 동사도 없으므로 <b>독립분사구문</b>이다. 주절의 주어는 Another(연어 한 마리)인데 분사의 주어는 its body라서 서로 다르므로, 의미상 주어 its body를 분사 앞에 남겨 둔 것이다. <b>until</b>은 '~할 때까지'로 동작이 이어지다 끝나는 지점을 찍어 준다. <b>make it over ~</b>의 it은 특정한 무언가를 가리키지 않는 관용 표현으로, '<b>~을 넘어서 해내다, 성공하다</b>'라는 뜻이다.", "pe": "Another jumped, / \u0001its body spinning<sup>1</sup>\u0002 / \u0001until it made it over<sup>2</sup> the falls<sup>3</sup>\u0002.", "pk": "또 다른 한 마리가 뛰어올랐고, / \u0001그 몸이 빙글빙글 돌았다\u0002 / \u0001마침내 그것이 폭포를 넘어설 때까지\u0002.", "core": "또 다른 한 마리가 뛰어올랐다.", "tags": ["주어 Another + 동사 jumped (1형식)", "<b>독립 분사구문</b>(부사적: 부대 상황): jumped 꾸밈. 의미상 주어 its body", "<b>until절</b> = 부사절('~할 때까지'): spinning 꾸밈. make it over = 해내다"], "steps": [{"t": "이 문장은 <b>S+V(1형식) + 독립분사구문 + until절</b>이다. 뒤로 덩어리가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Another (또 다른 한 마리)", "V: jumped (jump 뛰어오르다의 과거형)", "뼈대 = <b>Another jumped</b>"]}, {"t": "<b>its body spinning</b>은 <b>독립 분사구문</b>(부대상황)이다. '그 몸이 빙글빙글 돌면서'라는 뜻이다. 자기 주어(its body)를 가진다.", "sub": ["spin = 빙글빙글 돌다, body = 몸", "its = Another(또 다른 한 마리)의 소유격"]}, {"t": "<b>until it made it over the falls</b>는 <b>until 부사절</b>이다. '그것이 폭포를 넘어설 때까지'라는 뜻으로 spinning을 꾸민다.", "sub": ["make it over = 넘어서다, 해내다, falls = 폭포", "첫 it = Another, 둘째 it은 make it의 관용적인 it이다."]}], "sum": "또 한 마리, 몸을 돌리며 뛰어올라 폭포 넘어섬"}], "qs": [{"q": "07", "type": "빈칸", "src": "2020학년도 수능 34번", "ans": "②", "tr": [["1", "악음(음악적 소리)의 특정한 속성이라는 측면에서 음악이 무엇인지를 정의하려는 시도가 많이 있어 왔다."], ["2", "19세기의 유명한 비평가 Eduard Hanslick은 '측정 가능한 음'을 '모든 음악의 일차적이고 필수적인 조건'으로 여겼다."], ["3", "그가 말하고자 한 것은, 악음은 고정된 음 높이를 사용한다는 사실에서 자연의 소리와 구별될 수 있는 반면, 거의 모든 자연의 소리는 끊임없이 변동하는 주파수로 이루어져 있다는 것이었다."], ["4", "그리고 20세기의 많은 저술가들도 Hanslick처럼 고정된 음 높이가 음악을 규정하는 특징에 속한다고 가정해 왔다."], ["5", "이제 세계 대부분의 음악 문화에서 음 높이가 ______________이라는 것은 사실이다."], ["6", "그러나 이것은 음악에 대한 일반화이지 음악의 정의는 아닌데, 반례를 제시하기가 쉽기 때문이다."], ["7", "예를 들어 일본의 사쿠하치 음악과 한국의 산조 음악은, 음악이 그것을 기준으로 구성되는 관념상의 음 높이 주위에서 끊임없이 변동한다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "However, this is a generalization about music and not a definition of it, for it is easy to put forward counter-examples."}, {"en": false, "h": "빈칸 문항에서 <b>However</b> 뒤 문장은 빈칸의 내용을 되받아 반박하는 자리다. 6번 문장이 빈칸 내용을 '<b>일반화일 뿐 정의는 아니다</b>'라고 깎아내리고, 7번 문장이 그 반례로 '관념상의 음 높이 <b>주위에서 변동하는</b>' 음악을 든다. 반례가 성립하려면 빈칸에는 앞의 Hanslick 논지, 즉 음 높이가 <b>고정되어 있고 별개의 단계들로 정리되어 있다</b>는 내용이 들어가야 한다."}], "opts": [{"n": "①", "t": "인위적으로 고정되었다기보다 자연스럽게 오르내린다", "a": false, "x": true, "trap": false, "e": "이렇게 넣으면 6·7번 문장의 반례가 <b>반례가 아니라 같은 말</b>이 되어 버린다. However가 설 자리가 사라진다."}, {"n": "②", "t": "고정되어 있을 뿐 아니라 연속된 별개의 단계들로 구성되어 있다", "a": true, "x": false, "trap": false, "e": "2~4번 문장의 fixed pitches 논지를 그대로 잇고, 7번 문장의 '고정된 음이 아니라 그 <b>주위에서 변동한다</b>'는 반례와 정면으로 대비된다."}, {"n": "③", "t": "음악의 주요한 구성 요소로 거의 여겨지지 않는다", "a": false, "x": true, "trap": false, "e": "Hanslick은 측정 가능한 음을 '<b>일차적이고 필수적인 조건</b>'이라고 했다. 정반대의 진술이다."}, {"n": "④", "t": "굉장히 다양하고 복잡해서 측정할 수 없다", "a": false, "x": true, "trap": true, "e": "measurable(측정 가능한)이라는 핵심어를 뒤집었다. 반례가 말하는 것은 <b>변동</b>이지 측정 불가능성이 아니다."}, {"n": "⑤", "t": "독특하고 다양한 문화적 특성을 전달하는 매개체이다", "a": false, "x": true, "trap": false, "e": "사쿠하치·산조가 나와 문화 이야기처럼 보이지만, 그 예시의 초점은 문화적 다양성이 아니라 <b>음 높이가 변동한다</b>는 점이다."}], "w": [["attempt", "시도"], ["in terms of", "~의 측면에서"], ["attribute", "속성, 자질"], ["regard A as B", "A를 B로 여기다"], ["measurable", "측정 가능한"], ["distinguish A from B", "A를 B와 구별하다"], ["fixed pitch", "고정된 음 높이"], ["whereas", "반면에"], ["consist of", "~로 구성되다"], ["fluctuate", "변동하다"], ["generalization", "일반화"], ["put forward", "제기하다, 내놓다"]]}, {"q": "08", "type": "무관 문장", "src": "2018학년도 6월 35번", "ans": "④", "tr": [["1", "봉제 곰 인형이라는 개념은 아주 명백하게 유전적으로 물려받은 특성이 아니므로, 우리는 우리가 문화적 특성을 보고 있다고 확신할 수 있다."], ["2", "그러나 그것은 또 다른, 정말로 생물학적인 특성, 즉 우리를 아기에게 끌리게 하는 신호(넓은 이마와 작은 얼굴)의 지도를 받는 것으로 보이는 문화적 특성이다."], ["3", "① 귀엽고 아기 같은 생김새는 본질적으로 마음을 끌어서 대부분의 인간에게 보살피려는 반응을 만들어 낸다."], ["4", "② 더 아기 같은 외모를 지닌 봉제 곰 인형은 — 처음에는 그 차이가 아무리 미미했더라도 — 그 덕분에 고객들에게 더 인기가 있었다."], ["5", "③ 봉제 곰 인형 제조사들은 어떤 곰이 가장 잘 팔리는지 분명히 알아차렸고, 그래서 이익을 극대화하기 위해 그런 곰은 더 많이, 덜 인기 있는 모델은 더 적게 만들었다."], ["6", "④ 그 결과, 상업적 목적으로 동물 이미지를 사용하는 것은 동물 권리 운동가들의 심한 비판에 직면했다."], ["7", "⑤ 이런 식으로 고객에 의해 형성된 선택 압력은 제조사들에 의한 더 아기 같은 곰의 진화라는 결과를 낳았다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "In this way, the selection pressure built up by the customers resulted in the evolution of a more baby-like bear by the manufacturers."}, {"en": false, "h": "무관 문장은 <b>마지막 문장이 무엇을 정리하는지</b>부터 본다. 이 글의 마지막 문장은 '고객이 만든 <b>선택 압력</b> → 더 아기 같은 곰의 <b>진화</b>'로 요약한다. 즉 ①(아기 같은 외모의 매력) → ②(그런 곰이 잘 팔림) → ③(제조사가 그런 곰을 더 만듦) → ⑤(결과적으로 진화)라는 한 줄의 인과 사슬이다. ④의 <b>동물 권리 운동가의 비판</b>은 이 사슬 어디에도 걸리지 않는다."}], "opts": [{"n": "①", "t": "귀엽고 아기 같은 생김새가 보살피려는 반응을 만들어 낸다", "a": false, "x": true, "trap": false, "e": "'우리를 아기에게 끌리게 하는 신호'라는 앞 문장을 이어받아 사슬의 <b>출발점</b>을 놓는다."}, {"n": "②", "t": "더 아기 같은 곰이 고객에게 더 인기 있었다", "a": false, "x": true, "trap": false, "e": "매력이 <b>판매</b>로 이어지는 두 번째 고리다. 대시 안의 '아무리 미미했더라도'가 자연선택의 미세한 차이를 흉내 낸다."}, {"n": "③", "t": "제조사가 잘 팔리는 곰을 더 많이 만들었다", "a": false, "x": true, "trap": false, "e": "인기가 <b>생산 비율</b>을 바꾸는 세 번째 고리로, 마지막 문장의 by the manufacturers와 정확히 이어진다."}, {"n": "④", "t": "동물 이미지의 상업적 이용이 동물 권리 운동가의 비판을 받았다", "a": true, "x": false, "trap": false, "e": "글은 곰 인형의 <b>모양이 왜 변했는가</b>를 진화에 빗대어 설명한다. 상업적 이용에 대한 <b>윤리적 비판</b>은 소재만 겹칠 뿐 인과 사슬에 끼어들 자리가 없다."}, {"n": "⑤", "t": "고객이 만든 선택 압력이 더 아기 같은 곰의 진화를 낳았다", "a": false, "x": true, "trap": true, "e": "①~③을 한 문장으로 묶는 <b>결론</b>이므로 반드시 남아야 한다."}], "w": [["genetically inherited", "유전적으로 물려받은"], ["trait", "특성, 형질"], ["under the guidance of", "~의 지도를 받는"], ["cue", "신호, 단서"], ["inherently", "본질적으로"], ["appealing", "마음을 끄는"], ["nurturing response", "보살피려는 반응"], ["however slight", "아무리 미미하더라도"], ["maximize", "극대화하다"], ["be faced with", "~에 직면하다"], ["selection pressure", "선택 압력"], ["result in", "~라는 결과를 낳다"]]}, {"q": "09", "type": "글의 순서", "src": "2022학년도 9월 37번", "ans": "②", "tr": [["1", "최근에 소셜 로봇을 개인용 가정 도우미로 제공하는 상업적 벤처 기업이 다수 등장했는데, 이들은 아마 결국 기존의 스마트홈 도우미와 겨루게 될 것이다."], ["2", "(B) 개인용 로봇 도우미는 물리적 조작 능력이나 이동 능력이 없는 장치이다. 대신 그것들은 뚜렷한 사회적 존재감을 지니며, 눈·귀·입처럼 사회적으로 상호 작용할 수 있음을 암시하는 시각적 특징을 지닌다."], ["3", "(A) 그것들은 동력화되어 방 안에서 사용자를 따라다닐 수 있어서, 주변 사람들을 인식하고 있다는 인상을 준다. 개인용 로봇 도우미가 스마트홈 도우미와 비슷한 서비스를 제공하기는 하지만, 그것들의 사회적 존재감은 소셜 로봇만이 지니는 기회를 제공한다."], ["4", "(C) 예를 들어 소셜 개인 도우미 로봇은 음악을 재생하는 데 더해 그 음악에 대한 관여를 표현해서, 사용자가 로봇과 함께 음악을 듣고 있는 것처럼 느끼게 한다. 이런 로봇은 감시 장치로 쓰이거나, 의사 전달의 매개체 역할을 하거나, 더 풍부한 게임에 참여하거나, 이야기를 들려주거나, 격려와 유인책을 제공하는 데 쓰일 수 있다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "Personal robotic assistants are devices that have no physical manipulation or locomotion capabilities."}, {"en": false, "h": "순서 문항은 <b>정의 문장이 먼저</b>라는 원칙과 <b>대명사가 무엇을 받는가</b>를 함께 본다. 주어진 글이 social robots라는 새 소재를 던지면, 그것이 무엇인지 <b>정의</b>하는 (B)가 먼저 와야 한다. (A)의 첫 단어 <b>They</b>가 받을 명사는 (B)의 personal robotic assistants이고, (A) 끝의 '<b>소셜 로봇만의 기회</b>'를 (C)의 <b>For instance</b>가 예로 풀어 준다. 그래서 (B) – (A) – (C)이다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)의 They가 받을 명사가 앞에 없다. 주어진 글의 social robots를 받는다고 보기에는 (B)에서야 '개인용 로봇 도우미'라는 이름이 처음 정의된다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": true, "x": false, "trap": false, "e": "(B) 정의 → (A) 스마트홈 도우미와의 차별점 제시 → (C) For instance로 그 차별점의 예시. 세 고리가 모두 맞물린다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": false, "x": true, "trap": true, "e": "(C)의 For instance가 예로 들어야 할 '소셜 로봇만의 기회'가 아직 언급되지 않았다. 예시가 주장보다 먼저 나오는 셈이다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": false, "e": "For instance로 시작하는 단락이 맨 앞에 올 수 없다. 예시는 앞선 진술을 전제로 한다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": false, "x": true, "trap": false, "e": "위와 같은 이유로 (C)가 첫 자리에 올 수 없고, (A)의 They도 갈 곳을 잃는다."}], "w": [["commercial venture", "상업적 벤처 기업"], ["launch", "출범시키다"], ["rival", "~에 필적하다, 겨루다"], ["manipulation", "조작"], ["locomotion", "이동, 운동"], ["distinct", "뚜렷한"], ["suggestive of", "~을 암시하는"], ["give the impression of", "~라는 인상을 주다"], ["unique to", "~에 고유한"], ["engagement", "관여, 참여"], ["surveillance", "감시"], ["intermediate", "매개체, 중개자"]]}, {"q": "10", "type": "장문 순서", "src": "2020학년도 수능 43번", "ans": "③", "tr": [["1", "(A) 나무들의 색깔은 마치 불이 붙은 것처럼 보였는데, 붉은색과 주황색이 노란색과 황금색과 겨루고 있었다. 이때가 Nina가 가장 좋아하는 계절이었지만, Marie가 운전하는 동안 그녀는 몇 시간째 침묵을 지켰다. Nina는 챔피언 벨트를 잃고 상심해 있었다. 이제 전 챔피언이 된 그녀는 권투에서 은퇴할 생각을 하고 있었다. 그녀의 오랜 친구이자 트레이너인 Marie는 그 고통을 함께 나누었다. 또 한 시간의 침묵이 흐른 뒤, 두 사람은 'Sauble 폭포'라는 표지판을 보았다. Marie는 이곳이 (a) 그들이 멈추기에 좋은 장소겠다고 생각했다."], ["2", "(C) Marie는 주차장에 차를 댔다. 두 사람은 폭포를 보려고 길을 따라 내려갔다. 또 다른 표지판이 있었다. '발밑 조심. 바위가 미끄럽습니다.' (d) 그들은 폭포가 여러 겹의 바위 위로 쏟아져 나오는 것을 발견했다. 그곳에는 그들 말고는 아무도 없었다. \"저것 좀 봐!\" Marie는 폭포 쪽으로 움직이는 물속의 무언가를 가리켰다. 수백 개의 물고기 꼬리가 상류로 이동하면서 번쩍이며 햇빛을 받고 있었다. 그 아래 물속에서 두 사람은 연어들이 천천히 몸을 움직이는 것을 보았다."], ["3", "(D) Marie와 Nina가 연어를 계속 지켜보는 동안, 커다란 한 마리가 갑자기 뛰어올랐다. 그것은 위쪽의 세차게 흐르는 물 위로 몸을 던졌지만 소용없었다. (e) 그들은 말없이 서서 물고기가 몸부림치는 것을 지켜보고 있었다. 또 다른 한 마리가 뛰어올랐고, 몸을 빙글빙글 돌리다가 마침내 폭포를 넘어섰다. 또 한 마리는 뛰어올랐다가 물살의 힘에 밀려 되돌아갔다. 연어를 보면서 Marie는 Nina가 그들의 계속되는 도전에 눈을 고정하고 있는 것을 알아차렸다. Nina의 심장은 매번의 도약과 몸부림에 빠르게 뛰고 있었다."], ["4", "(B) 그때 작은 한 마리가 엄청난 힘을 내어 완전히 한 바퀴를 돌더니 폭포를 넘는 데 성공했다. \"해냈어!\" Nina는 그 성공에 감탄하며 외쳤다. 이어서 더 많은 연어가 뒤따라 성공했다. 그녀는 (b) 그들을 바라보고 있는 것이 부끄러워졌다. 잠시 후 그녀는 Marie를 향해 말했다. \"포기란 내 사전에 없어. Marie, 나는 챔피언 벨트를 되찾을 거야.\" Marie는 환하게 웃으며 고개를 끄덕였다. \"내일부터 훈련 시작이야. 힘들 거야. 준비됐어?\" 길을 걸어 올라가 차로 돌아오면서 }

  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';
  app.innerHTML=h;
}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    if(c[p]){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent='오답노트장에 담았어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1400);}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
