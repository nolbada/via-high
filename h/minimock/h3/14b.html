<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

rived at the supermarket shelf. / In some countries they are then sprayed with ethylene before sale to the consumer to induce ripening. / Biotechnologists therefore saw an opportunity in delaying the ripening and softening process in fruit. / The problem for growers and retailers is that ripening is followed sometimes quite rapidly by deterioration and decay and the product becomes worthless. / Tomatoes and other fruits are, therefore, usually picked and transported when they are unripe.", "ev_ko": [[2, "그 과정은 에틸렌이라고 불리는 식물 호르몬의 분비에 의해 유도된다."], [3, "(A) 만일 에틸렌의 분비나 에틸렌에 반응하는 과정들을 방해함으로써 숙성이 늦춰질 수만 있다면, 과일은 그것이 익어서 맛이 풍부해질 때까지 식물에 그대로 남아 있을 수 있고, (그럼에도) 그것이 슈퍼마켓 선반에 도착할 때에는 여전히 좋은 상태일 것이다."], [4, "(B) 일부 국가에서는 이후 숙성을 유도하기 위해 소비자에게 판매되기 전에 과일들에 에틸렌이 분사된다."], [6, "그래서 생명공학자들은 과일의 숙성과 연화 과정을 늦추는 기회를 보았다(노렸다)."], [7, "(C) 재배자와 소매업자들에게 있어, 문제는 숙성 이후에 품질 저하와 부패가 때때로 상당히 빠르게 이어져서 상품이 쓸모없어진다는 것이다."], [8, "그러므로 토마토와 다른 과일들은 주로 그것들이 덜 익었을 때 수확되고 운송된다."]], "why": ["주어진 글 (2)는 과일 숙성이 <b>에틸렌<\/b>이라는 호르몬에 의해 일어난다는 설명입니다", "그 숙성에서 생기는 <b>문제<\/b>를 꺼내는 것이 (C)의 문장 (7)입니다 — 숙성 뒤에 품질 저하와 부패가 빠르게 이어진다고 합니다", "(C)의 마지막 문장 (8)은 그래서 과일을 <b>덜 익었을 때<\/b> 수확해 운송한다는 내용입니다", "(B)의 문장 (4) <b>they are then sprayed with ethylene<\/b>(이후 그것들에 에틸렌이 분사된다)의 they가 바로 (8)의 덜 익은 과일입니다", "(B)의 마지막 문장 (6)에서 생명공학자들은 숙성을 늦추는 데서 기회를 보았습니다", "(A)의 문장 (3)이 그 방법을 구체적으로 설명합니다", "그래서 (C) – (B) – (A)이고, 답은 ⑤입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)는 숙성을 늦추는 방법을 말합니다", "그런데 주어진 글에는 왜 숙성을 늦춰야 하는지(문제)가 아직 나오지 않았습니다", "그래서 (A)가 주어진 글 바로 뒤에 올 수 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": false, "e": ["(B)의 <b>they<\/b>와 <b>then<\/b>(이후)은 (C)의 마지막 문장, 즉 덜 익은 채 수확·운송된 과일을 받습니다", "그래서 (B)가 (C)보다 먼저 올 수 없습니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["(B)의 they와 then이 받을 '덜 익은 채 수확된 과일'은 (C)에서 나옵니다", "(B)가 맨 앞에 오면 they가 무엇인지 알 수 없습니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C) 다음에는 덜 익은 과일에 에틸렌을 뿌린다는 (B)가 와야 합니다", " function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

["S: they (그들)", "V: traveled (travel 이동하다의 과거형)", "뼈대 = <b>they traveled</b>", "Otherwise (그렇지 않으면)는 문장 전체를 꾸미는 부사"]}, {"t": "<b>by foot or horseback</b>은 전치사구(부사구, 방법)이고, <b>along trails</b>는 전치사구(부사구, 경로)이다. 둘 다 traveled를 꾸민다. foot (발), horseback (말 등), trail (오솔길)."}, {"t": "<b>unfit for wheeled vehicles</b>는 형용사구이다. trails를 뒤에서 꾸민다 (바퀴 달린 탈것에 적합하지 않은). unfit (적합하지 않은), wheeled (바퀴 달린), vehicle (탈것)."}, {"t": "<b>that had been created by game animals and the Indians</b>는 관계절(형용사절)이다. trails를 꾸민다.", "sub": ["had been created = create (만들다)의 과거완료 수동태 (이미 만들어져 있던)", "game animal (사냥감 동물), the Indians (인디언들, 본문 표현)"]}, {"t": "<b>who hunted them</b>은 관계절(형용사절)이다. the Indians를 꾸민다 (그 동물들을 사냥한). hunt (사냥하다). them = game animals."}], "sum": "그들, 사냥감 동물과 인디언이 만든 오솔길을 따라 걷거나 말로 이동"}, {"i": "03", "q": "07", "s": "5", "title": "S+V+O + 계속적 which + 분사구문", "eng": "In a vicious circle<sup>1</sup>, / the awful<sup>2</sup> roads interrupted<sup>3</sup> intercolonial communications, / which further developed the provinces<sup>4</sup>' sense of isolation and autonomy<sup>5</sup>, / only worsening the chances of unified transportation and postal networks.", "notes": [["1", "vicious circle", "악순환"], ["2", "awful", "형편없는, 끔찍한"], ["3", "interrupt", "방해하다, 중단시키다"], ["4", "province", "지방, 주"], ["5", "autonomy", "자치, 자율성"]], "lit": "악순환 속에서, / 형편없는 도로들은 식민지 간의 통신을 방해했다, / 그리고 그것은 각 지방의 고립감과 자치 의식을 더욱 키웠다, / 그래서 결국 통합된 교통망과 우편망의 가능성만 악화시켰다.", "nat": "악순환 속에서 형편없는 도로는 식민지 간의 통신을 방해했고, 그것이 각 지방의 고립감과 자치 의식을 더욱 키워, 결국 통합된 교통망과 우편망이 생길 가능성만 악화시켰다.", "ana": "콤마 뒤의 <b>which</b>는 <b>계속적 용법</b>이다. 계속적 용법의 which는 <b>앞의 명사 하나</b>가 아니라 <b>앞 절 전체</b>를 받을 수 있다는 점이 중요하다. 여기서는 '<b>도로가 통신을 방해한 사실</b>' 전체를 받아 '<b>그리고 그것은</b>'으로 이어 읽는다. 계속적 용법은 <b>that으로 바꿔 쓸 수 없다</b>는 점도 시험에 자주 나온다. 문장 끝의 <b>only worsening ~</b>은 또 하나의 동사가 아니라 <b>분사구문</b>이며, 여기서는 '<b>그래서 결국 ~하기만 했다</b>'라는 <b>결과</b>를 나타낸다. 분사구문 앞의 <b>only</b>는 '그저 …할 뿐인'이라는 뉘앙스를 더해 준다. 이렇게 <b>콤마 + -ing</b>가 문장 끝에 오면 대개 <b>결과</b>나 <b>부연</b>이라고 보면 된다.", "pe": "\u0001In a vicious circle<sup>1</sup>\u0002, / the \u0001awful<sup>2</sup>\u0002 roads interrupted<sup>3</sup> intercolonial communications, / \u0001which further developed the provinces<sup>4</sup>' sense of isolation and autonomy<sup>5</sup>\u0002, / \u0001only worsening the chances of unified transportation and postal networks\u0002.", "pk": "\u0001악순환 속에서\u0002, / \u0001형편없는\u0002 도로들은 식민지 간의 통신을 방해했다, / \u0001그리고 그것은 각 지방의 고립감과 자치 의식을 더욱 키웠다\u0002, / \u0001그래서 결국 통합된 교통망과 우편망의 가능성만 악화시켰다\u0002.", "core": "도로가 통신을 방해했다.", "tags": ["(In a vicious circle) = 전치사구(부사구): 문장 전체를 꾸밈", "주어 roads + 동사 interrupted + 목적어 communications: 3형식. (awful) = 형용사: roads를 꾸밈", "(which further developed …) = <b>계속적 관계절</b>(형용사절): 앞 내용 전체를 받음, '그리고 그것이 ~'", "(only worsening …) = 현재분사구(분사구문, 부사적: 결과): 앞 내용의 결과"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 뒤로 계속적 관계절과 분사구문이 이어져 꼬리가 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the awful roads (형편없는 도로들, awful 끔찍한)", "V: interrupted (interrupt 방해하다의 과거형)", "O: intercolonial communications (식민지 간의 통신)", "뼈대 = <b>the awful roads interrupted intercolonial communications</b>"]}, {"t": "<b>In a vicious circle</b>은 전치사구(부사구)이다. 문장 전체를 꾸민다 (악순환 속에서). vicious circle (악순환)."}, {"t": "<b>which further developed the provinces' sense of isolation and autonomy</b>는 계속적 관계절이다. 앞 내용 전체를 받는다 (그리고 그것이).", "sub": ["further (더욱), develop (키우다), province (지방), sense (의식)", "isolation (고립), autonomy (자치)"]}, {"t": "<b>only worsening the chances of unified transportation and postal networks</b>는 현재분사구(분사구문, 결과)이다. 앞 내용의 결과를 나타낸다 (결국 ~만 악화시키며). worsen (악화시키다), chance (가능성), unified (통합된)."}], "sum": "형편없는 도로 때문에 고립감이 커지고, 통합 교통망 가능성만 악화 (악순환)"}, {"i": "04", "q": "08", "s": "B-2", "title": "S+V+O + 과거분사 후치 수식 + 비교", "eng": "However, / fruit picked<sup>1</sup> before it is ripe<sup>2</sup> / has less flavour<sup>3</sup> / than fruit picked ripe from the plant.", "notes": [["1", "pick", "수확하다, 따다"], ["2", "ripe", "익은"], ["3", "flavour", "맛, 풍미"]], "lit": "그러나, / 익기 전에 수확된 과일은 / 맛이 더 적다 / 나무에서 익은 채로 수확된 과일보다.", "nat": "그러나 익기 전에 수확된 과일은 나무에서 익은 채로 수확된 과일보다 맛이 덜하다.", "ana": "짧지만 <b>picked</b>가 두 번 나오면서 헷갈리는 문장이다. 둘 다 동사가 아니라 <b>fruit</b>를 꾸미는 <b>과거분사</b>다. 과일은 '<b>수확되는</b>' 대상이므로 수동인 picked가 맞다. 그렇다면 진짜 동사는 무엇인가? <b>has</b> 하나뿐이다. 주어가 <b>fruit</b>(단수 취급)이므로 have가 아니라 has다. 뒤쪽의 <b>fruit picked ripe from the plant</b>에서 <b>ripe</b>는 명사를 꾸미는 것이 아니라 '<b>익은 상태로</b>' 수확되었다는 <b>상태</b>를 나타낸다. 마지막으로 비교 구문은 <b>대상을 맞추는 것</b>이 전부다. 여기서 비교되는 두 축은 <b>덜 익은 채 딴 과일</b>과 <b>익은 채 딴 과일</b>이며, 이 대비가 글 전체의 문제 제기로 이어진다.", "pe": "\u0001However\u0002, / fruit \u0001picked<sup>1</sup> before it is ripe<sup>2</sup>\u0002 / has less flavour<sup>3</sup> / \u0001than fruit picked ripe from the plant\u0002.", "pk": "\u0001그러나\u0002, / \u0001익기 전에 수확된\u0002 과일은 / 맛이 더 적다 / \u0001나무에서 익은 채로 수확된 과일보다\u0002.", "core": "과일은 맛이 더 적다.", "tags": ["(However) = 접속부사: 문장 전체를 꾸밈", "주어 fruit. (picked before it is ripe) = 과거분사구(형용사적): fruit를 꾸밈. 안에 부사절 before it is ripe", "동사 has + 목적어 less flavour: 3형식", "(than fruit picked ripe …) = 비교 전치사구/절(부사적): less를 꾸밈. picked ripe = 과거분사 + 형용사"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 주어 fruit 뒤에 과거분사구가 붙어 동사 has가 뒤에 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: fruit (과일)", "V: has (가지고 있다)", "O: less flavour (더 적은 맛, flavour 맛)", "뼈대 = <b>fruit has less flavour</b>", "However (그러나)는 접속부사"]}, {"t": "<b>picked before it is ripe</b>는 과거분사구(형용사적)이다. fruit를 뒤에서 꾸민다 (익기 전에 수확된).", "sub": ["pick (따다, 수확하다)의 과거분사 picked", "안의 before it is ripe는 부사절 (it = fruit). ripe (익은)"]}, {"t": "<b>than fruit picked ripe from the plant</b>는 비교 덩어리이다. less를 꾸민다 (식물에서 익은 채로 수확된 과일보다). picked ripe는 과거분사 + 형용사 (익은 상태로 수확된). plant (식물)."}, {"t": "함정: picked는 동사가 아니라 과거분사이다. 진짜 동사는 has이다."}], "sum": "덜 익었을 때 딴 과일은 익어서 딴 과일보다 맛이 덜함"}, {"i": "05", "q": "09", "s": "1", "title": "By -ing 전치사구 + S+V+O + even when절", "eng": "By changing the focus or context<sup>1</sup> of a task, / we can get renewed<sup>2</sup> energy / even when we feel / that we are completely out of energy<sup>3</sup>.", "notes": [["1", "context", "맥락, 상황"], ["2", "renewed", "새로워진"], ["3", "out of energy", "에너지가 다 떨어진"]], "lit": "과제의 초점이나 상황을 바꿈으로써, / 우리는 새로워진 에너지를 얻을 수 있다 / 심지어 우리가 느낄 때조차 / 우리가 에너지를 완전히 다 써 버렸다고.", "nat": "과제의 초점이나 상황을 바꿈으로써, 우리는 에너지가 완전히 바닥났다고 느낄 때조차 새로운 활력을 얻을 수 있다.", "ana": "<b>By + -ing</b>는 '<b>~함으로써</b>'라는 <b>수단·방법</b>을 나타낸다. 전치사 by 뒤이므로 change가 아니라 반드시 <b>changing</b>이어야 한다는 점이 어법의 기본이다. 이어지는 <b>even when</b>은 '<b>~할 때조차</b>'라는 양보의 뜻으로, 뒤에 <b>주어 + 동사</b>가 오는 <b>부사절</b>을 이끈다. 그 안의 <b>that</b>은 feel의 목적어절을 이끄는 접속사이므로, 이 문장에는 절이 세 개(주절 + when절 + that절) 겹쳐 있는 셈이다. 절이 겹칠 때는 <b>접속사를 만날 때마다 잠깐 멈추는 습관</b>이 해석을 지켜 준다. 이 문장은 글 전체의 <b>주제문</b>이므로, 뒤에 나오는 실험은 전부 이 말을 증명하기 위한 재료라고 보면 된다.", "pe": "\u0001By changing the focus or context<sup>1</sup> of a task\u0002, / we can get \u0001renewed<sup>2</sup>\u0002 energy / \u0001even when we feel\u0002 / \u0001that we are completely out of energy<sup>3</sup>\u0002.", "pk": "\u0001과제의 초점이나 상황을 바꿈으로써\u0002, / 우리는 \u0001새로워진\u0002 에너지를 얻을 수 있다 / 심지어 우리가 느낄 때조차 / 우리가 에너지를 완전히 다 써 버렸다고.", "core": "우리는 에너지를 얻을 수 있다.", "tags": ["(By changing … a task) = 전치사구(부사구: 수단): get을 꾸밈", "주어 we + 동사 can get + 목적어 energy: 3형식. (renewed) = 과거분사(형용사적): energy를 꾸밈", "(even when we feel) = 부사절(시간, even으로 강조): get을 꾸밈. 느끼는 내용은 다음 줄의 that절", "(that we are completely out of energy) = feel의 목적어절(명사절). 부사절 안에 포함되어 함께 수식어"], "steps": [{"t": "이 문장은 <b>전치사구 + S+V+O(3형식)</b>이다. 뒤에 even when절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: we (우리)", "V: can get (get 얻다)", "O: renewed energy (새로워진 에너지, renewed 새로워진)", "뼈대 = <b>we can get renewed energy</b>"]}, {"t": "<b>By changing the focus or context of a task</b>는 전치사구(부사구, 수단)이다. can get을 꾸민다 (바꿈으로써). By 뒤 changing은 동명사이다. focus (초점), context (상황, 맥락), task (과제)."}, {"t": "<b>even when we feel that we are completely out of energy</b>는 부사절(시간)이다. can get을 꾸민다 (~할 때조차).", "sub": ["even (심지어)은 강조", "feel의 목적어 that절 (명사절): we are completely out of energy (에너지가 완전히 떨어졌다). completely (완전히), out of (~이 떨어진)"]}], "sum": "초점·상황을 바꾸면, 에너지가 바닥나 보여도 활력 회복"}, {"i": "06", "q": "09", "s": "9", "title": "수동태(1형식) + where절 + 목적 to부정사", "eng": "This phenomenon<sup>1</sup> of creating a second wind<sup>2</sup> / can be seen in action<sup>3</sup> at airports / where security officers rotate around<sup>4</sup> different stations / to stop routine-induced fatigue from settling in<sup>5</sup>.", "notes": [["1", "phenomenon", "현상"], ["2", "second wind", "제2의 활력"], ["3", "in action", "실제로 작동 중인"], ["4", "rotate around", "~을 돌아가며 옮기다"], ["5", "settle in", "자리를 잡다"]], "lit": "제2의 활력을 만들어 내는 이 현상은 / 공항에서 실제로 작동하는 것이 보인다 / 그곳에서는 보안 요원들이 여러 근무 구역을 돌아가며 옮겨 다닌다 / 일상이 유발하는 피로가 자리 잡는 것을 막기 위해.", "nat": "제2의 활력을 만들어 내는 이 현상은 공항에서 실제로 작동하는 것을 볼 수 있는데, 그곳에서는 보안 요원들이 일상이 유발하는 피로가 자리 잡지 못하도록 여러 근무 구역을 돌아가며 옮겨 다닌다.", "ana": "주어가 <b>This phenomenon</b>이고 <b>of creating a second wind</b>는 그것이 어떤 현상인지 설명하는 <b>전치사구</b>다. 전치사 of 뒤이므로 create가 아니라 <b>creating</b>이다. 동사는 <b>can be seen</b>으로, 현상은 '<b>보이는</b>' 대상이므로 수동태다. <b>where</b>는 장소 명사 <b>airports</b>를 받는 <b>관계부사</b>이며, 관계부사 뒤에는 <b>빠진 자리가 없는 완전한 절</b>이 온다는 점이 관계대명사와의 결정적 차이다. 문장 끝의 <b>to stop A from ~ing</b>는 '<b>A가 ~하는 것을 막다</b>'라는 고정된 짝으로, from 뒤에는 <b>반드시 동명사</b>가 온다. keep·prevent·stop이 모두 같은 형태를 쓰므로 한 묶음으로 외워 두면 좋다.", "pe": "This phenomenon<sup>1</sup> \u0001of creating a second wind<sup>2</sup>\u0002 / can be seen \u0001in action<sup>3</sup>\u0002 \u0001at airports\u0002 / \u0001where security officers rotate around<sup>4</sup> different stations\u0002 / \u0001to stop routine-induced fatigue from settling in<sup>5</sup>\u0002.", "pk": "\u0001제2의 활력을 만들어 내는\u0002 이 현상은 / \u0001공항에서\u0002 실제로 작동하는 것이 보인다 / \u0001그곳에서는 보안 요원들이 여러 근무 구역을 돌아가며 옮겨 다닌다\u0002 / \u0001일상이 유발하는 피로가 자리 잡는 것을 막기 위해\u0002.", "core": "이 현상은 볼 수 있다.", "tags": ["주어 This phenomenon. (of creating a second wind) = 전치사구(형용사구): phenomenon을 꾸밈", "동사 can be seen(수동): 1형식. (in action) = 전치사구(부사구): be seen을 꾸밈, (at airports) = 전치사구(부사구: 장소): be seen을 꾸밈", "(where … stati 는 점을 꼭 확인하자. 의문문 어순 그대로 쓰는 것이 가장 흔한 실수다.", "pe": "\u0001Upon hearing<sup>1</sup> about Sally's interest\u0002, / Jennifer invited<sup>2</sup> them \u0001both\u0002 to visit her office / \u0001to see just how deep Sally's fascination<sup>3</sup> was\u0002.", "pk": "\u0001Sally의 관심에 대해 듣자마자\u0002, / Jennifer는 그 둘 \u0001모두\u0002를 자기 사무실로 초대했다 / \u0001Sally의 매료가 얼마나 깊은지 정확히 보기 위해\u0002.", "core": "Jennifer는 그들이 사무실을 방문하도록 초대했다.", "tags": ["(Upon hearing about Sally's interest) = 전치사구(부사구: 시간): 문장 전체를 꾸밈, upon -ing = ~하자마자", "주어 Jennifer + 동사 invited + 목적어 them + 목적격보어 to visit her office: 5형식(invite A to V). (both) = 대명사 동격: them을 꾸밈", "(to see just how deep … was) = to부정사(부사적: 목적): invited를 꾸밈. how deep ~ was = 명사절(see의 목적어)"], "steps": [{"t": "이 문장은 <b>전치사구 + S+V+O+C(5형식)</b>이다. 끝에 to부정사와 간접의문문이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Jennifer (사람 이름)", "V: invited (invite 초대하다의 과거형)", "O: them (그들, both와 동격)", "C: to visit her office (그녀의 사무실을 방문하도록)", "뼈대 = <b>Jennifer invited them to visit her office</b>", "invite A to V = A가 V하도록 초대하다. visit (방문하다), office (사무실)"]}, {"t": "<b>Upon hearing about Sally's interest</b>는 전치사구(부사구, 시간)이다. 문장 전체를 꾸민다 (~을 듣자마자). upon -ing (~하자마자). Upon 뒤 hearing은 동명사이다. interest (관심)."}, {"t": "<b>to see just how deep Sally's fascination was</b>는 to부정사(부사적, 목적)이다. invited를 꾸민다 (확인하려고).", "sub": ["how deep Sally's fascination was = see의 목적어 (간접의문문, 얼마나 깊은지)", "just (정확히), fascination (매료)"]}], "sum": "Jennifer, Sally의 관심이 얼마나 깊은지 보려고 둘을 사무실로 초대"}, {"i": "08", "q": "10", "s": "D-6", "title": "V 세 개 병렬(구동사)", "eng": "Jennifer put on<sup>1</sup> her coat, / pulled out<sup>2</sup> a pair of binoculars<sup>3</sup>, / and stepped out<sup>4</sup>.", "notes": [["1", "put on", "입다, 걸치다"], ["2", "pull out", "꺼내다"], ["3", "binoculars", "쌍안경"], ["4", "step out", "밖으로 나가다"]], "lit": "Jennifer는 코트를 입었다, / 쌍안경 하나를 꺼냈다, / 그리고 밖으로 나섰다.", "nat": "Jennifer는 코트를 걸치고 쌍안경을 꺼내 든 뒤 밖으로 나섰다.", "ana": "짧지만 <b>병렬</b>의 교과서 같은 문장이다. 주어 <b>Jennifer</b> 하나에 동사 <b>put on · pulled out · stepped out</b> 세 개가 <b>and</b>로 묶여 있다. 병렬은 <b>형태가 같은가</b>만 보면 된다. 세 동사가 모두 <b>과거형</b>으로 일치하므로 같은 주어에 걸린다. 만약 마지막이 <b>stepping</b>이었다면 분사구문이 되어 문장의 결이 달라진다. <b>put</b>은 원형·과거·과거분사가 모두 같은 형태라 시제를 놓치기 쉬운데, 뒤의 pulled·stepped를 보고 <b>과거</b>임을 확정할 수 있다. 이렇게 <b>짝이 되는 동사의 형태</b>로 시제를 역추적하는 것도 실전에서 자주 쓰는 방법이다. <b>a pair of binoculars</b>는 쌍안경이 늘 복수형이기 때문에 개수를 셀 때 쓰는 표현이다.", "pe": "Jennifer put on<sup>1</sup> her coat, / pulled out<sup>2</sup> a pair \u0001of binoculars<sup>3</sup>\u0002, / and stepped out<sup>4</sup>.", "pk": "Jennifer는 코트를 입었다, / 쌍안경 하나를 꺼냈다, / 그리고 밖으로 나섰다.", "core": "Jennifer는 코트를 입고, 쌍안경을 꺼내고, 밖으로 나섰다.", "tags": ["주어 Jennifer + 동사 put on(구동사) + 목적어 her coat: 3형식", "동사 pulled out(구동사) + 목적어 a pair: 3형식. (of binoculars) = 전치사구(형용사구): a pair를 꾸밈", "동사 stepped out(구동사): 1형식. 세 동사가 <b>병렬</b>, 주어 Jennifer 공통"], "steps": [{"t": "이 문장은 <b>S + V 세 개 병렬</b>이다. 주어 하나에 구동사 세 개가 이어진다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Jennifer (사람 이름)", "V①: put on (입다. put의 과거형도 put) + O: her coat (그녀의 코트)", "V②: pulled out (꺼냈다. pull out 꺼내다) + O: a pair of binoculars (쌍안경 하나)", "V③: stepped out (밖으로 나섰다. step out 나가다)", "뼈대 = <b>Jennifer put on her coat, pulled out a pair of binoculars, and stepped out</b>"]}, {"t": "세 동사 모두 동사 + 부사(on, out) 한 덩어리이다. 콤마와 and로 연결된 병렬이다. <b>of binoculars</b>는 a pair를 꾸미는 형용사구이다. binoculars (쌍안경)."}], "sum": "Jennifer, 코트를 입고 쌍안경을 꺼내 밖으로 나섬"}], "qs": [{"q": "07", "type": "무관 문장", "src": "2019년 7월 35번", "ans": "④", "tr": [["1", "지리는 식민지의 통신을 크게 제한했다."], ["2", "① 가장 단순한 우편망조차 어떤 형태의 운송 체계를 필요로 하는데, 특히 육로로 A 지점에서 B 지점까지 그저 이동하는 일의 어려움이 너무나 커서 매사추세츠와 캐롤라이나의 주민들에게는 서로를 방문하는 것보다 영국까지 배를 타고 가는 것이 더 쉬울 정도였다."], ["3", "② 가능할 때마다 식민지 주민들과 그들의 공문서는 강과 구불구불한 해안을 오가는 배와 뗏목에 실려 목적지로 떠서 갔다."], ["4", "③ 그렇지 않으면 그들은, 사냥감 동물들과 그 동물들을 사냥한 인디언들이 만들어 놓은, 바퀴 달린 탈것에는 적합하지 않은 오솔길을 따라 걷거나 말을 타고 이동했다."], ["5", "④ 바퀴는 나무로 만들어졌기 때문에 잦은 수리가 필요했고, 그것이 바퀴 만드는 사람을 식민지 마을에서 중요한 상인으로 만들었다."], ["6", "⑤ 악순환 속에서 형편없는 도로는 식민지 간의 통신을 방해했고, 그것이 각 지방의 고립감과 자치 의식을 더욱 키워, 결국 통합된 교통망과 우편망이 생길 가능성만 악화시켰다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Since wheels were made of wood, they needed frequent repairs, which made wheel makers important tradesmen in colonial towns."}, {"en": false, "h": "무관 문장 문항은 <b>첫 문장이 정한 화제</b>에서 벗어난 문장을 찾는 것이다. 첫 문장은 <b>Geography greatly restricted colonial communications</b>, 즉 '<b>지리가 식민지의 통신을 제한했다</b>'이다. 그러므로 모든 문장은 <b>이동·통신의 어려움</b>을 말해야 한다. ①은 육로 이동의 어려움, ②는 배와 뗏목이라는 대안, ③은 걷거나 말을 타야 했던 열악한 길, ⑤는 그 결과 생긴 고립과 자치 의식이다. 그런데 ④는 <b>바퀴가 나무라서 수리가 잦았고 그래서 바퀴 만드는 사람이 중요한 상인이 되었다</b>는 <b>직업·상업</b> 이야기다. ③에 <b>wheeled vehicles</b>라는 말이 나온 것을 붙잡고 끼워 넣은 문장으로, 통신과는 무관하다."}], "opts": [{"n": "①", "t": "가장 단순한 우편망조차 운송 체계를 필요로 했고, 육로 이동이 너무 어려워 영국까지 배를 타는 편이 더 쉬웠다", "a": false, "x": true, "trap": false, "e": "첫 문장의 <b>통신을 제한한 지리</b>를 곧바로 구체화한다. 이동의 어려움이 핵심이다."}, {"n": "②", "t": "가능할 때마다 사람과 공문서는 강과 해안을 오가는 배와 뗏목으로 옮겨졌다", "a": false, "x": true, "trap": false, "e": "육로가 어려웠기 때문에 <b>수로</b>를 썼다는 자연스러운 이어짐이다."}, {"n": "③", "t": "그렇지 않으면 바퀴 달린 탈것에 적합하지 않은 오솔길을 걷거나 말을 타고 갔다", "a": false, "x": true, "trap": false, "e": "<b>Otherwise</b>가 ②의 '배를 쓸 수 없을 때'를 받는다. 여전히 이동 수단 이야기다."}, {"n": "④", "t": "바퀴가 나무라서 수리가 잦았고, 그것이 바퀴 만드는 사람을 중요한 상인으로 만들었다", "a": true, "x": false, "trap": false, "e": "소재가 <b>통신·이동</b>에서 <b>직업과 상업</b>으로 튄다. ③의 <b>wheeled vehicles</b>라는 단어만 이어받은 함정 문장이다."}, {"n": "⑤", "t": "악순환 속에서 형편없는 도로가 통신을 방해해 지방의 고립감과 자치 의식을 키웠다", "a": false, "x": true, "trap": true, "e": "첫 문장의 주장을 <b>결론</b>으로 되받는다. <b>In a vicious circle</b>이 글 전체를 닫는 신호다."}], "w": [["geography", "지리, 지리학"], ["restrict", "제한하다"], ["colonial", "식민지의"], ["overland", "육로로"], ["communiqué", "공식 발표, 공문"], ["raft", "뗏목"], ["ply", "다니다, 왕복하다"], ["winding", "구불구불한"], ["unfit for", "~에 적합하지 않은"], ["game animal", "사냥감 동물"], ["vicious circle", "악순환"], ["autonomy", "자치, 자율성"]]}, {"q": "08", "type": "글의 순서", "src": "2021학년도 6월 37번", "ans": "⑤", "tr": [["1", "[주어진 글] 과일의 숙성 과정은 세포벽의 연화, 단맛이 생기는 것, 그리고 색과 맛을 내는 화학 물질의 분비를 일으킨다. 이 과정은 에틸렌이라 불리는 식물 호르몬의 분비에 의해 유도된다."], ["2", "[(C)] 재배자와 소매업자에게 문제는, 숙성 뒤에 때로 상당히 빠르게 품질 저하와 부패가 뒤따라 상품이 쓸모없어진다는 것이다. 그래서 토마토와 다른 과일들은 대개 익지 않았을 때 수확되어 운송된다."], ["3", "[(B)] 일부 국가에서는 그런 다음 소비자에게 판매되기 전에 숙성을 유도하기 위해 그것들에 에틸렌을 뿌린다. 그러나 익기 전에 수확된 과일은 나무에서 익은 채로 수확된 과일보다 맛이 덜하다. 그래서 생명공학자들은 과일의 숙성과 연화 과정을 늦추는 데서 기회를 보았다."], ["4", "[(A)] 만약 에틸렌 분비를 방해하거나 에틸렌에 반응하는 과정을 방해해서 숙성을 늦출 수 있다면, 과일은 익어서 맛이 가득 찰 때까지 나무에 남겨 둘 수 있으면서도 슈퍼마켓 진열대에 도착했을 때 여전히 좋은 상태일 것이다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "Tomatoes and other fruits are, therefore, usually picked and transported when they are unripe. → In some countries they are then sprayed with ethylene ~"}, {"en": false, "h": "순서 문항은 <b>지시어와 연결어</b>를 화살표처럼 따라가면 된다. 주어진 글은 숙성이 <b>에틸렌</b>에 의해 일어난다는 <b>중립적 설명</b>으로 끝난다. 여기서 <b>문제 제기</b>로 넘어가는 것이 <b>(C)</b>다 — <b>The problem for growers and retailers is ~</b>. (C)의 마지막은 과일을 <b>익지 않은 채(unripe)</b> 수확해 운송한다는 내용이다. 그러면 <b>(B)</b>의 첫 문장 <b>In some countries they are then sprayed with ethylene</b>의 <b>they</b>가 곧 그 <b>덜 익은 과일</b>이고 <b>then</b>이 '수확·운송한 다음'을 받는다. (B)는 그래서 생명공학자들이 <b>숙성을 늦추는 데서 기회를 보았다</b>로 끝나고, 마지막 <b>(A)</b>가 <b>If ripening could be slowed down ~</b>으로 그 아이디어를 구체화한다. 따라서 <b>(C)-(B)-(A)</b>다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)는 <b>가정법</b>으로 해법을 그리는 문단이라 맨 앞에 올 수 없다. 무엇을 늦춘다는 것인지 문제 제기가 먼저 있어야 한다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(B) 첫 문장의 <b>they</b>와 <b>then</b>이 받을 대상이 앞에 없다. 지시어가 뜬 채로 시작하는 문단은 첫 자리에 오지 못한다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": false, "x": true, "trap": false, "e": "위와 같은 이유로 (B)가 첫 자리에 올 수 없다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": true, "e": "(A)의 해법이 나온 뒤에 (B)의 <b>Biotechnologists therefore saw an opportunity</b>가 오면 순서가 뒤집힌다. <b>기회를 봤다 → 그래서 이런 방법이 있다</b>가 자연스러운 흐름이다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": true, "x": false, "trap": false, "e": "<b>문제 제기(C) → 현재의 대처와 그 한계, 그리고 착안(B) → 구체적 해법(A)</b>으로 이어진다. (B)의 they·then이 (C)의 마지막 문장을 정확히 받는다."}], "w": [["ripening process", "숙성 과정"], ["bring about", "~을 일으키다, 가져오다"], ["softening", "연화, 부드러워짐"], ["induce", "유도하다, 유발하다"], ["deterioration", "(품질의) 저하, 악화"], ["decay", "부패, 부식"], ["worthless", "가치 없는, 쓸모없는"], ["unripe", "익지 않은, 설익은"], ["spray A with B", "A에 B를 뿌리다"], ["interfere with", "~을 방해하다"], ["respond to", "~에 반응하다"], ["shelf", "선반, 진열대"]]}, {"q": "09", "type": "문장 삽입", "src": "2014학년도 9월 B형 39번", "ans": "②", "tr": [["1", "[주어진 문장] 그런 다음 실험자는 참가자들이 미묘하게 다른 과제를 하도록 상황을 바꾸었다."], ["2", "과제의 초점이나 상황을 바꿈으로써, 우리는 에너지가 완전히 바닥났다고 느낄 때조차 새로운 활력을 얻을 수 있다."], ["3", "이것을 입증하기 위해 한 심리학자는 사람들에게 자신이 '반(半)자유 과제'라고 부른 것에 참가하도록 요청했다."], ["4", "그 과제에는 그림 그리기, 'abababababab…'를 반복해서 쓰기, 또는 짧은 시 읽기가 포함되었다."], ["5", "( ① ) 참가자들은 진이 빠질 때까지 이 과제들을 하도록 요청받았다."], ["6", "( ② ) 그림을 그리던 사람들은 자신이 얼마나 빨리 그릴 수 있는지 보여 주기 위해 마지막 그림을 다시 그리라는 요청을 받았다."], ["7", "( ③ ) 'abab'를 쓰던 사람들은 자기 이름과 주소를 쓰라는 요청을 받았다."], ["8", "( ④ ) 이 새로운 상황에서 그들의 피로는 사라졌다."], ["9", "( ⑤ ) 제2의 활력을 만들어 내는 이 현상은 공항에서 실제로 작동하는 것을 볼 수 있는데, 그곳에서는 보안 요원들이 일상이 유발하는 피로가 자리 잡지 못하도록 여러 근무 구역을 돌아가며 옮겨 다닌다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "The participants were asked to do these tasks until they felt exhausted. → [The experimenter then changed the context ~] → Those drawing were asked to redraw their last picture ~"}, {"en": false, "h": "삽입 문항은 <b>주어진 문장의 지시어</b>부터 확인한다. 주어진 문장에는 <b>then</b>(그런 다음)과 <b>a subtly different task</b>(미묘하게 다른 과제)가 있다. then이 있으니 앞에는 <b>원래 하던 과제</b>가 이미 끝나 있어야 하고, '다른 과제'라고 했으니 뒤에는 그 <b>바뀐 과제가 구체적으로</b> 나와야 한다. ① 앞에서는 과제의 <b>종류</b>만 소개했고, ① 뒤 문장에서 참가자들이 <b>진이 빠질 때까지</b> 그 과제를 했다고 마무리된다. 그리고 ② 뒤부터 <b>그림 그리던 사람은 다시 그리기</b>, <b>abab를 쓰던 사람은 이름과 주소 쓰기</b>라는 <b>바뀐 과제</b>가 나열된다. 앞뒤가 정확히 맞물리는 자리는 <b>②</b>다."}], "opts": [{"n": "①", "t": "①", "a": false, "x": true, "trap": false, "e": "① 앞은 과제의 <b>종류를 소개</b>하는 문장이고, ① 뒤는 그 과제를 <b>진이 빠질 때까지 했다</b>는 문장이다. 둘은 같은 과제 이야기라 사이가 끊기지 않는다."}, {"n": "②", "t": "②", "a": true, "x": false, "trap": false, "e": "앞 문장에서 원래 과제가 <b>exhausted</b>로 끝났고, 뒤 문장부터 <b>바뀐 과제</b>가 구체적으로 나열된다. 주어진 문장의 <b>then</b>과 <b>a subtly different task</b>가 정확히 다리 역할을 한다."}, {"n": "③", "t": "③", "a": false, "x": true, "trap": true, "e": "② 뒤와 ③ 뒤는 <b>그림 조 / 글씨 조</b>로 나란히 이어지는 같은 층위의 예시다. 그 사이를 끊으면 두 예시가 갈라진다."}, {"n": "④", "t": "④", "a": false, "x": true, "trap": false, "e": "④ 뒤의 <b>In this new context</b>가 이미 '새로운 상황'을 <b>받고 있다</b>. 주어진 문장이 여기 들어가면 새 상황을 만들어 놓고 곧바로 다시 가리키는 셈이라 어색하다."}, {"n": "⑤", "t": "⑤", "a": false, "x": true, "trap": false, "e": "⑤ 뒤는 실험을 마친 뒤의 <b>실생활 적용(공항)</b>이다. 실험 절차를 설명하는 문장이 들어갈 자리가 아니다."}], "w": [["experimenter", "실험자"], ["context", "맥락, 상황"], ["subtly", "미묘하게"], ["renewed", "새로워진"], ["out of energy", "에너지가 다 떨어진"], ["demonstrate", "입증하다, 보여 주다"], ["take part in", "~에 참가하다"], ["exhausted", "진이 빠진, 기진맥진한"], ["fatigue", "피로(감)"], ["second wind", "제2의 활력"], ["rotate around", "~을 돌아가며 옮기다"], ["settle in", "자리를 잡다"]]}, {"q": "10", "type": "장문 · 순서", "src": "2019학년도 9월 43번", "ans": "③", "tr": [["1", "[(A)] 지난 한 주 동안 Jason은 딸 Sally에 대해 걱정해 왔다. 두 달째 Sally는 어쩌면 지나칠 정도로 새를 공부하는 데 몰두해 있었다. 그는 딸이 학업을 소홀히 하기 시작할까 봐 걱정했다. 장을 보다가 Jason은 지역 대학에서 일하는 새 전문가인 오랜 친구 Jennifer를 우연히 만나 반가웠다. 어쩌면 (a) 그녀가 그의 걱정을 덜어 줄 수 있을지도 몰랐다. Sally의 관심에 대해 듣자마자 Jennifer는 Sally의 매료가 얼마나 깊은지 직접 확인하려고 두 사람 모두를 자기 사무실로 초대했다."], ["2", "[(C)] 이틀 뒤 Jason과 Sally는 Jennifer의 사무실을 방문했다. Sally는 새에 관한 책들에 매우 즐거워하며 그 안의 아름다운 사진들을 기쁘게 들여다보았다. Jason과 Jennifer가 이야기를 나누고 있을 때 Sally가 갑자기 외쳤다. \"어, 저 이 새 본 적 있어요!\" \"그럴 리 없어.\" Jennifer는 믿지 않으며 대답했다. \"이 책에 나온 건 희귀한 새들이야. 이 근처에서는 한 마리도 볼 수 없어.\" 그러나 (c) 그녀는 우겼다. \"근처 큰 참나무에 있는 둥지에서 두 마리를 봤단 말이에요!\""], ["3", "[(D)] Jennifer는 Sally에게 다가가 그 페이지를 자세히 들여다보았다. (d) 그녀는 차분하게 말했다. \"그건 채텀섬의 검은 울새란다. 가장 희귀한 새 중 하나야, Sally. 이 마을에서 봤을 리가 없어.\" 그래도 Sally는 물러서지 않았다. \"그렇다면 (e) 나에게 그 둥지를 보여 줄 수 있겠니?\" Jennifer가 물었다. \"네, 원하시면 지금 당장요.\" Sally가 자신감에 차서 대답했다. Jennifer는 코트를 걸치고 쌍안경을 꺼내 든 뒤 밖으로 나섰다. Sally와 Jason이 뒤를 따랐다."], ["4", "[(B)] 나무에 다가가면서 Sally가 신이 나서 외쳤다. \"저기요, 저게 그 둥지예요!\" Jennifer가 올려다보니 나뭇가지 갈래 사이에 작은 컵 모양의 둥지가 있었다. 재빨리 (b) 그녀는 쌍안경을 꺼내 Sally가 가리킨 곳을 자세히 들여다보았다. 저물어 가는 저녁 빛 속에서 그녀는 둥지 안에 있는 두 마리의 희귀한 검은 새를 발견했다. \"보세요, 제가 말했잖아요?\" Sally가 외쳤다. 기쁜 놀라움 속에 딸을 바라보며 Jason과 Jennifer는 Sally를 자랑스러워했다. 그들은 이제 새 관찰자로서 그녀의 비범한 재능과 열정을 인정하게 되었다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "Two days later, Jason and Sally visited Jennifer's office. → Jennifer walked up to Sally and took a close look at the page. → Approaching the tree, Sally shouted excitedly ~"}, {"en": false, "h": "장문 순서는 <b>시간을 나타내는 말</b>과 <b>등장인물의 위치</b>만 따라가면 된다. (A)는 Jennifer가 두 사람을 <b>사무실로 초대</b>하며 끝난다. 그 초대를 받는 문단이 <b>(C)</b>다 — <b>Two days later, Jason and Sally visited Jennifer's office</b>. (C)에서 Sally가 책 속 희귀한 새를 봤다고 우기자, <b>(D)</b>에서 Jennifer가 <b>그 페이지</b>를 들여다보며 반박한다. (D)의 <b>the page</b>는 (C)에 나온 책을 받는 말이므로 (C) 없이는 성립하지 않는다. (D)는 세 사람이 <b>밖으로 나서는</b> 것으로 끝나고, <b>(B)</b>가 <b>Approaching the tree</b>로 그 이동을 이어받는다. 따라서 <b>(C)-(D)-(B)</b>다."}], "opts": [{"n": "①", "t": "(B) – (D) – (C)", "a": false, "x": true, "trap": false, "e": "(B)는 둥지를 <b>확인하는</b> 결말 장면이다. 확인이 먼저 오면 뒤에 남을 이야기가 없다."}, {"n": "②", "t": "(C) – (B) – (D)", "a": false, "x": true, "trap": false, "e": "(B)에서 이미 둥지를 확인해 놓고 (D)에서 다시 '봤을 리 없다'고 반박하는 셈이 된다. 앞뒤가 맞지 않는다."}, {"n": "③", "t": "(C) – (D) – (B)", "a": true, "x": false, "trap": false, "e": "<b>사무실 방문(C) → 책의 그 페이지를 확인하고 밖으로 나섬(D) → 나무에 도착해 둥지를 확인(B)</b>으로 시간이 한 방향으로 흐른다."}, {"n": "④", "t": "(D) – (B) – (C)", "a": false, "x": true, "trap": false, "e": "(D)의 <b>the page</b>가 받을 책이 앞에 없다. 지시어가 뜬 채로 시작하는 문단은 (A) 바로 뒤에 올 수 없다."}, {"n": "⑤", "t": "(D) – (C) – (B)", "a": false, "x": true, "trap": true, "e": "위와 같은 이유로 (D)가 먼저 올 수 없다. 또 (D) 끝에서 이미 밖으로 나갔는데 (C)에서 사무실로 되돌아가는 것도 어색하다."}], "w": [["be absorbed in", "~에 몰두하다"], ["excessively", "지나치게, 과도하게"], ["schoolwork", "학업, 학교 공부"], ["run into", "~와 우연히 마주치다"], ["ease one's concern", "걱정을 덜어 주다"], ["upon ~ing", "~하자마자"], ["fascination", "매료, 매혹"], ["be delighted by", "~로 인해 매우 즐거워하다"], ["insist", "고집하다, 우기다"], ["take a close look at", "~을 자세히 들여다보다"], ["persist", "   });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
