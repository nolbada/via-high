<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});

에 대한 편향된 해석을 야기하는 믿음들", "ok": true, "e": ["(3)·(5)의 <b>the belief that ~<\/b>이 '믿음들'에 해당합니다", "(1)의 <b>misinterpretation<\/b>(오역)과 (9)의 <b>unjustified criticisms<\/b>(정당하지 않은 비판)가 '과거에 대한 편향된 해석'에 해당합니다."]}], "tr": ["역사의 바다에는 두 가지의 사이렌이 숨어 있는데, 그것들은 과거를 이해하고 제대로 인식하려고 노력하는 사람들을 오해와 오역의 암초 위로 유혹한다.", "이 두 가지의 위험은 자기 시대 중심주의와 자기 민족 중심주의이다.", "자기 시대 중심주의는 자신의 시대(자신이 살고 있는 시대)가 모든 가능한 시대 중에 최고라는 믿음이다.", "따라서 다른 모든 시대는 열등하다.", "자기 민족 중심주의는 자신의 문화가 모든 가능한 문화 중에 최고라는 믿음이다.", "따라서 다른 모든 문화는 열등하다.", "자기 시대 중심주의와 자기 민족 중심주의는 결합하여 개인과 문화가 그들의 현재 문화의 '우월한' 기준에 의해 다른 모든 개인과 문화를 판단하게 한다.", "이것은 과거 및/또는 외국의 문화를 다룰 때 관점의 완전한 결핍과 그 결과로서 생기는 그것들(과거 및/또는 외국의 문화)에 대한 오해와 잘못된 인식으로 이어진다.", "자기 시대 중심주의와 자기 민족 중심주의는 현대인들을 과거의 민족들에 대한 정당하지 않은 비판으로 끌어들인다."], "ps": [{"n": 1, "ch": [{"e": "<b>Twin sirens<\/b> hide", "k": "두 가지의 사이렌이 숨어 있다"}, {"e": "in the sea of history,", "k": "역사의 바다에는,"}, {"e": "<b>tempting<\/b> those", "k": "그리고 그것들<span class=\"r\">(= 두 사이렌)<\/span>은 사람들을 유혹한다"}, {"e": "seeking to understand and appreciate the past", "k": "과거를 이해하고 제대로 인식하려고 노력하는"}, {"e": "onto the <b>reefs<\/b> of misunderstanding and <b>misinterpretation<\/b>.", "k": "오해와 오역의 암초 위로."}], "link": "역사의 바다에는 두 가지의 사이렌이 숨어 있는데, 그것들은 과거를 이해하고 제대로 인식하려고 노력하는 사람들을 오해와 오역의 암초 위로 유혹한다.", "easy": "역사의 바다에는 사이렌 두 마리가 숨어 있어서, 과거를 이해하려는 사람들을 오해와 잘못된 해석이라는 암초로 꾀어내요.", "gist": "비유로 시작합니다 — 과거를 잘못 해석하게 만드는 두 가지가 있어요."}, {"n": 2, "ch": [{"e": "These twin dangers", "k": "이 두 가지의 위험은"}, {"e": "are <b>temporocentrism<\/b> and <b>ethnocentrism<\/b>.", "k": "자기 시대 중심주의와 자기 민족 중심주의이다."}], "easy": "그 두 가지 위험은 '내 시대가 최고'라는 생각과 '내 문화가 최고'라는 생각이에요.", "gist": "두 사이렌의 정체를 밝힙니다."}, {"n": 3, "ch": [{"e": "Temporocentrism is the belief", "k": "자기 시대 중심주의는 믿음이다"}, {"e": "that your times are the best", "k": "자신의 시대가 최고라는"}, {"e": "of all possible times.", "k": "모든 가능한 시대 중에."}], "easy": "자기 시대 중심주의는 지금 내가 사는 시대가 어느 시대보다 최고라고 믿는 거예요.", "gist": "첫 번째 믿음의 뜻입니다."}, {"n": 4, "ch": [{"e": "All other times are thus <b>inferior<\/b>.", "k": "따라서     `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

nat": "자기 시대 중심주의와 자기 민족 중심주의가 결합하여, 개인과 문화가 자기네 현재 문화의 '우월한' 기준으로 다른 모든 개인과 문화를 재단하게 만든다.", "ana": "동사 <b>unite</b> 뒤의 <b>to cause</b>는 '<b>~하기 위해·그래서 ~하게 되다</b>'로 읽는 <b>부사적 용법</b>의 to부정사다. 그리고 cause는 <b>cause + 목적어 + to V</b>(~가 …하게 만들다) 형태를 취하므로, 목적어 <b>individuals and cultures</b>와 그 뒤의 <b>to judge</b>를 반드시 <b>한 덩어리</b>로 묶어야 한다. 여기서 목적어가 길어 to judge가 멀리 떨어져 보이는 것이 함정이다. 마지막 <b>by the “superior” standards</b>의 by는 '<b>~을 기준으로</b>'라는 뜻이고, superior에 붙은 따옴표는 필자가 그 우월함을 <b>인정하지 않는다</b>는 신호다.", "pe": "Temporocentrism<sup>1</sup> and ethnocentrism<sup>2</sup> unite<sup>3</sup> / \u0001to cause individuals and cultures to judge<sup>4</sup> all other individuals and cultures\u0002 / \u0001by the “superior<sup>5</sup>” standards<sup>6</sup> \u0001of their current culture\u0002\u0002.", "pk": "자기 시대 중심주의와 자기 민족 중심주의는 결합한다 / \u0001개인과 문화가 다른 모든 개인과 문화를 재단하게 만들기 위해\u0002 / \u0001\u0001자기네 현재 문화의\u0002 '우월한' 기준으로\u0002.", "core": "자기 시대 중심주의와 자기 민족 중심주의는 결합한다.", "tags": ["주어: Temporocentrism and ethnocentrism(병렬) + 동사 unite", "to cause ~ = to부정사(부사적: 목적·결과): unite를 꾸밈. <b>cause A to V</b> = A가 V하게 만들다(5형식)", "by the superior standards = 전치사구(부사구): judge를 꾸밈 (판단 기준). of their current culture = 전치사구(형용사구): standards를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 뒤의 to부정사 안에 5형식이 들어 있고 by 전치사구까지 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: temporocentrism and ethnocentrism (자기 시대 중심주의와 자기 민족 중심주의. 병렬 주어)", "V: unite (결합하다)", "뼈대 = <b>Temporocentrism and ethnocentrism unite</b>"]}, {"t": "<b>to cause ~</b>는 <b>to부정사(부사적 용법, 목적)</b>로 unite를 꾸민다. 그 안이 <b>cause + O + C(to V)</b>인 5형식이다.", "sub": ["cause A to V = A가 ~하게 만들다", "O: individuals and cultures (개인과 문화)  C: to judge (판단하다, 재단하다)", "judge의 목적어: all other individuals and cultures (다른 모든 개인과 문화)"]}, {"t": "<b>by the “superior” standards of their current culture</b>는 전치사구(부사구)로 judge를 꾸민다.", "sub": ["standards = 기준 (superior 우월한)", "of their current culture = standards를 꾸미는 형용사구. 자기네 현재 문화의. their = individuals and cultures"]}, {"t": "함정: unite는 to부정사 앞에서 끝난다. to cause는 결합하는 목적이나 결과를 말하는 부사 덩어리이다."}], "sum": "자기 시대·민족 중심주의가 합쳐져 자기 문화 기준으로 남을 재단하게 만듦"}, {"i": "06", "q": "04", "s": "2", "title": "명령문 두 개 병렬 + 동격", "eng": "Join our Poetry<sup>1</sup> Writing Basics<sup>2</sup> Workshop / and meet the poet<sup>3</sup>, Ms. Grace Larson!", "notes": [["1", "poetry", "시(문학 장르)"], ["2", "basics", "기초, 필수적인 것들"], ["3", "poet", "시인"]], "lit": "저희 시 창작 기초 워크숍에 참여하세요 / 그리고 시인인 Grace Larson 씨를 만나세요!", "nat": "저희 시 창작 기초 워크숍에 참여해서 시인 Grace Larson 씨를 만나 보세요!", "ana": "주어 없이 동사원형으로 시작하면 <b>명령문</b>이다. 여기서는 <b>Join</b>과 <b>meet</b> 두 개의 명령문이 and로 이어진 <b>병렬</b>이라, 뒤의 meet에도 주어가 없다는 점을 놓치면 문장이 꼬인다. 안내문의 첫 문장은 대개 이렇게 <b>참여를 권하는 명령문</b>으로 시작하므로 이 형태에 익숙해져야 한다. <b>the poet, Ms. Grace Larson</b>에서 콤마는 앞뒤가 같은 대상임을 나타내는 <b>동격</b> 표시다. 즉 '그 시인 = Grace Larson 씨'이다. 안내문 문제는 이런 <b>동격 정보</b>가 선택지의 사실 확인 근거로 자주 쓰인다.", "pe": "Join our Poetry<sup>1</sup> Writing Basics<sup>2</sup> Workshop / and meet the poet<sup>3</sup>, \u0001Ms. Grace Larson\u0002!", "pk": "저희 시 창작 기초 워크숍에 참여하세요 / 그리고 시인인 \u0001Grace Larson 씨\u0002를 만나세요!", "core": "워크숍에 참여하고 시인을 만나라.", "tags": ["명령문: 주어 You 생략 + 동사 Join + 목적어 Workshop. Poetry Writing Basics는 워크숍 이름", "and meet: 명령문 동사 병렬. Ms. Grace Larson = 동격: the poet를 보충 설명"], "steps": [{"t": "이 문장은 <b>명령문 두 개가 and로 병렬</b>된 문장이다. 둘 다 주어 You가 생략된 S+V+O(3형식)이다."}, {"t": "뼈대부터 찾는다.", "sub": ["V1: Join (참여하다)  O: our Poetry Writing Basics Workshop (저희 시 창작 기초 워크숍. 워크숍 이름)", "V2: meet (만나다)  O: the poet (시인)", "뼈대 = <b>Join the Workshop</b> and <b>meet the poet</b>"]}, {"t": "<b>our Poetry Writing Basics Workshop</b>은 Poetry(시), Writing(창작), Basics(기초)가 붙은 워크숍 이름이다. 길어 보여도 하나의 명사 덩어리이다."}, {"t": "쉼표 뒤 <b>Ms. Grace Larson</b>은 the poet를 가리키는 <b>동격</b>이다. 시인인 Grace Larson 씨라는 뜻이다."}], "sum": "시 창작 기초 워크숍 참여와 Grace Larson 시인 만남"}, {"i": "07", "q": "05", "s": "2", "title": "S+V+O+C(help A to V) + 주격 관계절", "eng": "It helps the researcher to represent<sup>1</sup> their data in a chart / that shows the relative<sup>2</sup> size of a response<sup>3</sup> on one scale<sup>4</sup> / for interrelated<sup>5</sup> variables<sup>6</sup>.", "notes": [["1", "represent", "나타내다, 표현하다"], ["2", "relative", "상대적인"], ["3", "response", "응답, 반응"], ["4", "scale", "척도, 눈금"], ["5", "interrelated", "서로 연관된"], ["6", "variable", "변수"]], "lit": "그것은 연구자가 데이터를 차트로 나타내도록 돕는다 / 하나의 척도에서 응답의 상대적 크기를 보여 주는 / 서로 연관된 변수들에 대해.", "nat": "그것은 서로 연관된 변수들에 대해 하나의 척도에서 응답의 상대적 크기를 보여 주는 차트로 연구자가 자신의 데이터를 나타내도록 돕는다.", "ana": "<b>help</b>는 목적어 뒤에 <b>to V와 동사원형을 모두</b> 쓸 수 있는 동사다. 여기서는 <b>help + the researcher + to represent</b> 형태이므로 '<b>연구자가 나타내도록 돕는다</b>'로 읽는다. 이때 to represent를 '나타내기 위해'라는 목적으로 착각하면 안 된다. 뒤의 <b>that</b>은 <b>a chart</b>를 받는 <b>주격 관계대명사</b>이고, that 뒤에 주어 없이 동사 shows가 바로 오는 것이 그 증거다. 마지막 <b>for interrelated variables</b>는 shows에 걸리는 부사구로, 관계절 안쪽에 속한다는 점을 확인해 두자.", "pe": "It helps the researcher to represent<sup>1</sup> their data \u0001in a chart\u0002 / \u0001that shows the \u0001relative<sup>2</sup>\u0002 size \u0001of a response<sup>3</sup>\u0002 \u0001on one scale<sup>4</sup>\u0002\u0002 / \u0001for interrelated<sup>5</sup> variables<sup>6</sup>\u0002.", "pk": "그것은 연구자가 데이터를 \u0001차트로\u0002 나타내도록 돕는다 / \u0001\u0001하나의 척도에서\u0002 \u0001응답의\u0002 \u0001상대적\u0002 크기를 보여 주는\u0002 / \u0001서로 연관된 변수들에 대해\u0002.", "core": "그것은 연구자가 데이터를 나타내도록 돕는다.", "tags": ["주어 It + 동사 helps + 목적어 researcher + 목적격보어 to represent ~(5형식). in a chart = 전치사구(부사구): represent를 꾸밈", "that절 = 관계절(형용사절): chart를 꾸밈. relative = 형용사: size 꾸밈. of a response = 형용사구: size 꾸밈. on one scale = 부사구: shows 꾸밈", "for interrelated variables = 전치사구(부사구): shows를 꾸밈 (대상)"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식)</b>이다. 뒤에 관계절과 전치사구가 연달아 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: it (그것)", "V: helps (help 돕다의 3인칭 단수형)", "O: the researcher (연구자)", "C: to represent their data (데이터를 나타내도록. represent 나타내다)", "뼈대 = <b>It helps the researcher to represent their data</b>", "their는 단수 the researcher를 받는 말이다."]}, {"t": "<b>in a chart</b>는 전치사구(부사구)로 represent를 꾸민다. 차트로라는 뜻이다."}, {"t": "<b>that shows ~ variables</b>는 <b>관계절(형용사절)</b>로 chart를 꾸민다.", "sub": ["shows (show 보여 주다의 3인칭 단수형) the relative size of a response (응답의 상대적 크기. relative 상대적인)", "on one scale = 하나의 척도에서, shows를 꾸밈 (scale 척도)", "for interrelated variables = 서로 연관된 변수들에 대해 (variable 변수)"]}, {"t": "함정: help A to V는 A가 ~하도록 돕는다는 5형식이다. to represent의 주체는 연구자이다."}], "sum": "연구자가 연관 변수의 응답 크기를 한 척도의 차트로 나타내게 도움"}, {"i": "08", "q": "06", "s": "4", "title": "When절 + 동격 + S+V+O + 목적 to부정사", "eng": "When the Industrial Revolution<sup>1</sup> arrived with its great innovation<sup>2</sup>, the motor, / we didn't leave our world / to go to some remote<sup>3</sup> motorspace!", "notes": [["1", "Industrial Revolution", "산업 혁명"], ["2", "innovation", "혁신"], ["3", "remote", "저 멀리 있는, 외딴"]], "lit": "산업 혁명이 그 위대한 혁신인 모터와 함께 도래했을 때, / 우리는 우리 세계를 떠나지 않았다 / 저 멀리 있는 어떤 '모터 공간'으로 가려고!", "nat": "산업 혁명이 모터라는 위대한 혁신과 함께 왔을 때, 우리는 저 멀리 있는 어떤 '모터 공간'으로 가려고 우리 세계를 떠나지는 않았다.", "ana": "문장 앞의 <b>When절</b>은 시간을 나타내는 <b>부사절</b>이므로, 콤마 뒤에 나오는 <b>we didn't leave</b>가 주절임을 먼저 확정해야 한다. When절 안의 <b>its great innovation, the motor</b>에서 콤마는 <b>동격</b> 표시로 '그 위대한 혁신 = 모터'라는 뜻이다. 주절의 <b>to go</b>는 '<b>~하러·~하기 위해</b>'라는 목적의 to부정사인데, 주절이 부정문이므로 '<b>가려고 떠나지는 않았다</b>'라고 부정의 범위를 정확히 잡아야 한다. 이 문장이 뒤에 이어지는 '<b>모터를 우리 삶 속으로 들여왔다</b>'는 반전의 발판이 된다.", "pe": "\u0001When the Industrial Revolution<sup>1</sup> arrived \u0001with its great innovation<sup>2</sup>, the motor\u0002\u0002, / we didn't leave our world / \u0001to go to some remote<sup>3</sup> motorspace\u0002!", "pk": "\u0001산업 혁명이 \u0001그 위대한 혁신인 모터와 함께\u0002 도래했을 때\u0002, / 우리는 우리 세계를 떠나지 않았다 / \u0001저 멀리 있는 어떤 '모터 공간'으로 가려고\u0002!", "core": "우리는 우리 세계를 떠나지 않았다.", "tags": ["When절 = 부사절(때): didn't leave를 꾸밈. with its great innovation = 전치사구(부사구): arrived를 꾸밈. the motor = 동격: innovation을 설명", "주어 we + 동사 didn't leave + 목적어 our world", "to go to ~ = to부정사(부사적: 목적): didn't leave를 꾸밈. to some remote motorspace = go to, 거의 필수에 가까운 부사구"], "steps": [{"t": "이 문장은 <b>When절 + S+V+O(3형식)</b>이다. when절에 동격이 끼고 주절 뒤에 to부정사가 붙어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: we (우리)", "V: didn't leave (leave 떠나다의 과거 부정)", "O: our world (우리의 세계)", "뼈대 = <b>we didn't leave our world</b>"]}, {"t": "<b>When the Industrial Revolution arrived with its great innovation, the motor</b>는 <b>부사절(때)</b>이다.", "sub": ["S: the Industrial Revolution (산업 혁명)  V: arrived (arrive 도래하다, 도착하다의 과거형)", "with its great innovation = 그것의 위대한 혁신과 함께 (innovation 혁신)", "the motor = innovation을 다시 말해 주는 동격. 모터"]}, {"t": "<b>to go to some remote motorspace</b>는 <b>to부정사(부사적 용법, 목적)</b>로 didn't leave를 꾸민다.", "sub": ["~하려고 떠난 것이 아니다. 목적을 말하는 to부정사", "go to ~로 가다, remote 멀리 떨어진, some 어떤, motorspace 모터 공간"]}, {"t": "함정: not은 leave 전체를 부정하고, 목적을 나타내는 to부정사는 ‘그러려고 떠나지는 않았다’로 읽는다."}], "sum": "모터가 등장해도 우리는 모터 공간으로 가려고 세계를 떠나지 않았음"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2022년 3월 18번", "ans": "①", "tr": [["1", "Lorenzo Romano 씨께,"], ["2", "저는 로마의 Antonio Ricci 씨에게서 귀하께서 다양한 천연 가죽으로 수출용 수제 장갑을 생산하신다는 이야기를 들었습니다."], ["3", "귀사의 웹사이트에서 사업에 관해 읽어 보았습니다."], ["4", "우리나라에는 고품질 가죽 장갑에 대한 꾸준한 수요가 있어서, 저는 좋은 값을 받을 수 있습니다."], ["5", "귀하께서 추천하실 만한 장갑에 대한 모든 세부 사항을 알려 주시기 바랍니다."], ["6", "또한 귀하께서 생산하시는 장갑의 견본을 몇 개 보내 주신다면 도움이 되겠습니다."], ["7", "곧 답변을 들을 수 있기를 바랍니다."], ["8", "Jonathan Turner 드림"]], "evh": "5번 문장", "ev": [{"en": true, "h": "Please let me know full details of the gloves you would recommend."}, {"en": false, "h": "목적 문항은 <b>편지의 마지막 대목에 나오는 요청 문장</b>만 정확히 잡으면 끝난다. 앞의 2~4번 문장은 '<b>어떻게 알게 되었는지</b>'와 '<b>왜 관심이 있는지</b>'를 설명하는 배경일 뿐이다. 그러다 5번 문장에서 <b>Please let me know full details</b>로 <b>세부 사항</b>을 요청하고, 곧바로 6번 문장에서 <b>It would also help if you could provide me with some samples</b>로 <b>견본</b>까지 요청한다. <b>full details</b>와 <b>samples</b> 두 가지가 나란히 나오므로, 둘을 <b>모두</b> 담은 선지가 정답이다. 하나만 담긴 선지를 고르지 않도록 주의해야 한다."}], "opts": [{"n": "①", "t": "제품의 모든 세부 사항과 견본을 요청하려고", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>full details</b>와 6번 문장의 <b>some samples</b>를 둘 다 담고 있다. 편지의 실제 요청이 이 두 가지뿐이다."}, {"n": "②", "t": "신제품의 가격 인상 요인에 대해 설명하려고", "a": false, "x": true, "trap": false, "e": "4번 문장에 <b>good prices</b>가 나오지만, 이는 '내가 좋은 값을 받을 수 있다'는 <b>구매 의사의 근거</b>일 뿐 가격 인상 설명이 아니다."}, {"n": "③", "t": "수출할 제품에 대한 전수 검사를 의뢰하려고", "a": false, "x": true, "trap": true, "e": "<b>export</b>라는 단어는 2번 문장에 나오지만 검사(inspection)를 요청하는 문장은 어디에도 없다. 단어만 보고 고르면 걸린다."}, {"n": "④", "t": "웹 사이트에 게시한 정보의 수정을 촉구하려고", "a": false, "x": true, "trap": false, "e": "3번 문장의 <b>your website</b>는 정보를 얻은 <b>경로</b>일 뿐이다. 정보가 틀렸다거나 고치라는 언급이 전혀 없다."}, {"n": "⑤", "t": "제조업체에 품질 개선을 위한 회의를 제안하려고", "a": false, "x": true, "trap": false, "e": "<b>high quality</b>는 자기 나라의 수요를 설명하는 말이지 품질을 개선하라는 요구가 아니며, 회의(meeting)를 제안하는 문장도 없다."}], "w": [["hear from", "~에게서 소식을 듣다"], ["handmade", "수제의, 손으로 만든"], ["export", "수출"], ["a variety of", "다양한"], ["leather", "가죽"], ["steady", "꾸준한, 변함없는"], ["demand", "수요, 요구"], ["charge", "(값을) 매기다, 받다"], ["full details", "모든 세부 사항"], ["recommend", "추천하다"], ["provide A with B", "A에게 B를 제공하다"], ["sample", "견본, 샘플"]]}, {"q": "02", "type": "글의 요지", "src": "2020학년도 6월 22번", "ans": "③", "tr": [["1", "21세기는 정보와 지식의 시대이다."], ["2", "21세기는 기업에 경쟁 우위를 확보해 주는 중요한 자원으로서의 지식이 그 특징인 세기이다."], ["3", "이 모든 지식과 정보를 얻기 위해, 조직은 자신이 저장한 데이터에 의존해야 한다."], ["4", "기본 요소인 데이터는 서로 다른 입력 출처들로부터 매일 수집된다."], ["5", "이 데이터 출처들로부터 정보가 추출되거나 학습되며, 이렇게 포착된 정보는 다시 지식으로 변환되어 결국 행동이나 결정을 촉발하는 데 쓰인다."], ["6", "대체로 대부분의 조직은 데이터가 풍부하기 때문에, 데이터가 충분하지 않다는 문제는 겪지 않는다."], ["7", "그러나 문제는 많은 조직이 정보와 지식 면에서는 빈약하다는 점이다."], ["8", "이 사실은 조직이 직면한 가장 큰 난제 중 하나로 이어진다. 즉, 가공되지 않은 데이터를 어떻게 정보로, 나아가 지식으로 변환할 것인가 하는 문제인데, 이 지식이 제대로 활용되면 고객의 행동과 비즈니스 동향을 예측할 능력을 제공한다."]], "evh": "8번 문장", "ev": [{"en": true, "h": "This fact translates into one of the biggest challenges faced by organizations: how to transform raw data into information and eventually into knowledge, which if exploited correctly provides the capabilities to predict customers' behaviour and business trends."}, {"en": false, "h": "요지 문항은 <b>마지막 문장의 콜론(:) 뒤</b>가 결론인 경우가 많다. 여기서도 8번 문장의 콜론 뒤가 조직의 최대 과제를 못박는다 — <b>가공되지 않은 데이터를 정보로, 다시 지식으로 변환하는 것</b>. 앞의 6·7번 문장이 그 배경이다. 데이터는 <b>넘치지만</b>(rich with data) 정보와 지식은 <b>부족하다</b>(poor in information and knowledge). 즉 데이터의 <b>양</b>이 아니라 <b>변환 능력</b>이 관건이라는 것이다. 2번 문장의 <b>competitive advantage</b>와 마지막의 <b>predict ~ business trends</b>가 그 능력이 곧 <b>기업 경쟁력</b>임을 확인해 준다."}], "opts": [{"n": "①", "t": "고객의 특성은 기업의 데이터 처리 과정에서 주요 고려 사항이다.", "a": false, "x": true, "trap": false, "e": "customers는 마지막 문장에 딱 한 번, 그것도 <b>예측의 대상</b>으로 나올 뿐이다. 데이터 처리 시 무엇을 고려하라는 언급이 없다."}, {"n": "②", "t": "성공하는 기업은 사실에 기반한 판단을 통해 위기를 극복한다.", "a": false, "x": true, "trap": false, "e": "글에 <b>위기(crisis)</b>나 그 극복에 관한 내용이 전혀 없다. 데이터→정보→지식이라는 <b>변환 과정</b>이 주제다."}, {"n": "③", "t": "기업 경쟁력은 데이터를 정보와 지식으로 변환하는 능력에서 나온다.", "a": true, "x": false, "trap": false, "e": "8번 문장의 <b>how to transform raw data into information and eventually into knowledge</b>가 최대 과제로 제시되고, 2번 문장의 <b>competitive advantage</b>가 그 보상임을 밝힌다."}, {"n": "④", "t": "지식 정보화 시대에는 기초 데이터 확보의 중요성이 커지고 있다.", "a": false, "x": true, "trap": true, "e": "6번 문장이 정면으로 반박한다. 대부분의 조직은 이미 <b>데이터가 풍부하다</b>(rich with data). 부족한 것은 데이터가 아니라 지식이다."}, {"n": "⑤", "t": "데이터의 가치는 그것이 가지는 잠재적 수익성에 의해 결정된다.", "a": false, "x": true, "trap": false, "e": "수익성(profitability)이라는 개념 자체가 글에 등장하지 않는다. 글은 <b>변환 능력</b>을 말하지 데이터의 가치 평가 기준을 말하지 않는다."}], "w": [["be characterized by", "~라는 특징을 가지다"], ["competitive advantage", "경쟁 우위"], ["acquire", "얻다, 획득하다"], ["rely on", "~에 의존하다"], ["basic element", "기본 요소"], ["extract", "추출하다, 뽑아내다"], ["transform A into B", "A를 B로 변환하다"], ["trigger", "촉발시키다"], ["by and large", "대체로"], ["raw", "가공되지 않은, 날것의"], ["exploit", "활용하다, 이용하다"], ["capability", "능력, 역량"]]}, {"q": "03", "type": "글의 주제", "src": "2016학년도 수능 22번", "ans": "⑤", "tr": [["1", "역사의 바다에는 두 사이렌이 숨어, 과거를 이해하고 제대로 평가하려 애쓰는 사람들을 오해와 오역이라는 암초 위로 꾀어들인다."], ["2", "이 쌍둥이 같은 두 위험이 바로 자기 시대 중심주의와 자기 민족 중심주의이다."], ["3", "자기 시대 중심주의란 자신이 사는 시대가 가능한 모든 시대 중 최고라는 믿음이다."], ["4", "따라서 다른 모든 시대는 열등하다."], ["5", "자기 민족 중심주의란 자신의 문화가 가능한 모든 문화 중 최고라는 믿음이다."], ["6", "따라서 다른 모든 문화는 열등하다."], ["7", "자기 시대 중심주의와 자기 민족 중심주의는 결합하여, 개인과 문화가 자기네 현재 문화의 '우월한' 기준으로 다른 모든 개인과 문화를 재단하게 만든다."], ["8", "이것은 과거의 문화나 외국의 문화를 다룰 때 관점의 완전한 결여를 낳고, 그 결과로 그 문화들에 대한 오해와 잘못된 인식이 생긴다."], ["9", "자기 시대 중심주의와 자기 민족 중심주의는 현대인을 꾀어 과거 민족들에 대한 정당하지 못한 비판에 빠뜨린다."]], "evh": "9번 문장", "ev": [{"en": true, "h": "Temporocentrism and ethnocentrism tempt moderns into unjustified criticisms of the peoples of the past."}, {"en": false, "h": "주제 문항은 <b>첫 문장의 비유</b>와 <b>마지막 문장의 결론</b>이 같은 말을 하는지 확인하면 확실해진다. 1번 문장의 <b>siren</b>은 뱃사람을 암초로 꾀는 요정이고, 그 암초가 바로 <b>misunderstanding and misinterpretation</b>(오해와 오역)이다. 그리고 마지막 9번 문장이 <b>unjustified criticisms of the peoples of the past</b>로 결론을 못박는다. 즉 두 개의 '<b>중심주의</b>'라는 <b>믿음</b>이 과거에 대한 <b>편향된 해석</b>을 낳는다는 것이다. <b>belief</b>(3·5번 문장)와 <b>biased interpretations</b>를 연결하면 답이 보인다."}], "opts": [{"n": "①", "t": "distinct differences in the ways of recording history (역사를 기록하는 방식의 뚜렷한 차이)", "a": false, "x": true, "trap": false, "e": "기록 방식(recording)에 관한 문장이 하나도 없다. 글은 <b>과거를 보는 태도</b>를 다룬다."}, {"n": "②", "t": "universal features discovered in different cultures (여러 문화에서 발견되는 보편적 특징)", "a": false, "x": true, "trap": false, "e": "글은 오히려 각 문화가 자기 문화를 최고로 여긴다는 <b>편향</b>을 말한다. universal(보편적)과는 정반대 방향이다."}, {"n": "③", "t": "historians' efforts to advocate their own culture (자국 문화를 옹호하려는 역사가들의 노력)", "a": false, "x": true, "trap": false, "e": "주어가 <b>역사가</b>로 좁혀져 있다. 글의 대상은 역사가가 아니라 <b>개인과 문화 전체</b>(individuals and cultures)다."}, {"n": "④", "t": "pros and cons of two cross-cultural perspectives (두 문화 간 관점의 장단점)", "a": false, "x": true, "trap": true, "e": "두 가지가 나오니 그럴듯하지만, 글은 <b>장점을 하나도</b> 말하지 않는다. 처음부터 끝까지 <b>위험(dangers)</b>으로만 규정한다."}, {"n": "⑤", "t": "beliefs that cause biased interpretations of the past (과거에 대한 편향된 해석을 낳는 믿음)", "a": true, "x": false, "trap": false, "e": "3·5번 문장의 <b>the belief that ~</b>이 원인이고, 1번 문장의 <b>misinterpretation</b>과 9번 문장의 <b>unjustified critic const CMAP={"01-2": [["039", "명사절 접속사 that"]], "01-4": [["037-H1", "병렬 구조"], ["017", "there is / are"]], "02-2": [["078", "관계대명사"]], "02-6": [["026", "동명사"]], "03-8": [["025", "to부정사 부사적 용법"]], "04-2": [["037-H1", "병렬 구조"], ["019", "명령문"]], "05-2": [["080", "주격 관계대명사"], ["078", "관계대명사"]], "06-4": [["025", "to부정사 부사적 용법"], ["041", "시간 접속사"]]};
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  const cc=(CMAP[c.q+'-'+c.s]||[]);
  const back=encodeURIComponent(location.origin+location.pathname);
  let x='<div class="sc open"><div class="sc-h"><span class="no2">'+(+c.i)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='<div class="fin n1"><b>자연스러운 해석</b>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm)x+='<div class="fin n2"><b>한 줄 정리</b>'+esc(sm)+'</div>';
  x+='</div></div>';
  return x;
}

/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;

}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');

  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
