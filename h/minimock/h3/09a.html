iv><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">2. <span class=\"cw\">Read it aloud</span></div><div class=\"k\">2. 그것(= 여러분이 쓴 시)을 <span class=\"cw\">낭독할 것입니다</span></div></div><div class=\"rc\"><div class=\"e\">to the other participants.</div><div class=\"k\">다른 참가자들에게.</div></div><div class=\"rnat\">2. 다른 참가자들에게 그것(시)을 낭독할 것입니다.</div><div class=\"rst\">활동 둘: 방금 쓴 그 시를 친구들 앞에서 <b>소리 내어 읽어요</b>. 지문 8번의 it(그것)이 내 시예요. → ③ 일치</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">3. Receive expert feedback</div><div class=\"k\">3. 전문적인 피드백을 받을 것입니다</div></div><div class=\"rc\"><div class=\"e\">from Ms. Larson.</div><div class=\"k\">Larson 씨에게서.</div></div><div class=\"rnat\">3. Larson 씨에게서 전문적인 피드백을 받을 것입니다.</div><div class=\"rst\">활동 셋: 시인 선생님께 내 시에 대한 전문 피드백을 받아요. = 지문 9번</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Registration Fee: $10</div><div class=\"k\">등록비: 10달러</div></div><div class=\"rnat\">등록비: 10달러</div><div class=\"rst\">참가비는 얼마일까? 지문 10번에 등록비는 10달러라고 나와요. 그런데 아래에 할인이 있어요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">※ Register on or before September 18</div><div class=\"k\">※ 9월 18일이나 그 전에 등록하세요</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">pay only $7</span>.</div><div class=\"k\">그리고 <span class=\"cw\">7달러만 내세요</span>.</div></div><div class=\"rnat\">※ 9월 18일이나 그 전에 등록하고 7달러만 내세요.</div><div class=\"rst\">9월 18일까지 미리 등록하면 <b>7달러만</b> 내요. 용돈 3달러 아끼는 셈! = 지문 11번 → ④ 불일치</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Any related inquiries</div><div class=\"k\">관련된 모든 문의는</div></div><div class=\"rc\"><div class=\"e\">should be sent via email</div><div class=\"k\">이메일을 통해 보내져야 합니다</div></div><div class=\"rc\"><div class=\"e\">to studentun@georgeclarkson.edu.</div><div class=\"k\">studentun@georgeclarkson.edu로.</div></div><div class=\"rnat\">관련된 모든 문의는 이메일을 통해 studentun@georgeclarkson.edu로 보내져야 합니다(보내 주세요).</div><div class=\"rst\">더 궁금하면 학생회 주소로 <b>이메일</b>을 보내면 돼요. = 지문 12번 → ⑤ 불일치</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"student union\" data-m=\"학생회관, 학생회\"><b>student union</b>학생회관, 학생회</button><button type=\"button\" class=\"wdb\" data-w=\"poetry\" data-m=\"시(문학 장르)\"><b>poetry</b>시(문학 장르)</button><button type=\"button\" class=\"wdb\" data-w=\"participant\" data-m=\"참가자\"><b>participant</b>참가자</button><button type=\"button\" class=\"wdb\" data-w=\"registration fee\" data-m=\"등록비\"><b>registration fee</b>등록비</button><button type=\"button\" class=\"wdb\" data-w=\"on or before\" data-m=\"~일 또는 그 이전에\"><b>on or before</b>~일 또는 그 이전에</button><button type=\"button\" class=\"wdb\" data-w=\"inquiries\" data-m=\"문의들 (단수 inquiry)\"><b>inquiries</b>문의들 (단수 inquiry)</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄이 동사처럼 보이면 <b>이 문장에 진짜 동사가 이미 있는지</b>부터 보세요. 5번은 <b>is seen</b>(관찰된다)이 이미 동사이고 접속사가 없으니, ③ 자리는 앞 명사를 꾸미는 <b>분사</b>여야 해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (5번)</span><div class=\"en\">… across a range of subjects <u>③ have taught</u> in their first term in secondary school.</div><p class=\"ko\">중등학교에서 첫 학기에 ( ? ) 여러 과목에 걸쳐 — 앞은 명사 subjects, 접속사는 없음</p></div><div class=\"ck-via\"><i>▼</i><span>주어 An example(예)에 동사 is seen(관찰된다)이 벌써 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 앞쪽 · 진짜 동사</span><div class=\"en\"><mark>An example of this is seen</mark> in a research study …</div><p class=\"ko\">이것(= 스파이더 차트)의 예는 연구에서 <mark>관찰된다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>과목은 ‘가르쳐지는’ 쪽 → 수동 과거분사 taught(가르쳐진)가 앞 명사를 꾸며요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">across <mark>a range of subjects</mark> <mark>taught in their first term</mark></div><p class=\"ko\"><mark>첫 학기에 지도된</mark> <mark>여러 과목에 걸쳐</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">정동사(진짜 동사)와 과거분사(~된, ~해진) 뒤 꾸밈 구별</p><p class=\"gr\">한 문장에 접속사 없이 진짜 동사는 하나만 와요. 동사가 이미 있으면 다른 자리는 분사로 바꾸고, 꾸밈받는 명사가 ‘당하는’ 쪽이면 과거분사(p.p. ~된)를 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I read a letter written by my aunt.</div><div class=\"ko\">나는 이모가 쓴 편지를 읽었다. (read 읽었다가 동사, 편지는 ‘쓰여진’ 쪽이라 written이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I read a letter has written by my aunt.</div><div class=\"ko\">read(읽었다)가 이미 동사인데 접속사 없이 has written(썼다)을 또 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like the songs sung by that band.</div><div class=\"ko\">나는 그 밴드가 부른 노래들이 좋다. (노래는 ‘불려진’ 쪽이라 sung이 맞아요)</div></div><p class=\"gb\">지문 5번도 is seen(관찰된다)이 이미 동사예요. 과목들(subjects)은 ‘가르쳐지는’ 쪽이니 have taught(가르쳤다)가 아니라 taught(가르쳐진)가 맞아요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">have taught → taught (가르쳐진)<small>is seen(관찰된다)이 이미 동사라서, subjects(과목)를 뒤에서 꾸미는 수동 분사 taught(가르쳐진)가 와야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">calculates the mean to plot 평균치를 계산한다</span><span class=\"why\">6번 주어는 The researcher(연구자) 하나예요. takes(가져온다)와 ④, 동사 두 개가 and(그리고)로 나란히 이어지니, takes(가져온다)처럼 3인칭 단수 calculates(계산한다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">and(그리고) 병렬: 같은 주어의 동사는 같은 모양으로</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She opens the box and takes out a pen.</div><div class=\"ko\">그녀는 상자를 열고 펜을 꺼낸다. (opens 열다와 takes 꺼내다가 같은 모양이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She opens the box and take out a pen.</div><div class=\"ko\">주어 She(그녀)인데 take(꺼내다)에 -s가 빠져서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She opens the box and taking out a pen.</div><div class=\"ko\">and(그리고) 앞은 동사 opens(연다)인데 뒤는 taking(꺼내는 것)이라 모양이 달라 틀려요.</div></div><p class=\"gb\">지문 6번도 The researcher(연구자)가 takes(가져온다) and calculates(계산한다), 두 동사를 같은 모양으로 해서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">that shows the relative size of a response 응답의 상대적 크기를 보여 주는</span><span class=\"why\">2번에서 that(~하는)은 앞의 a chart(차트)를 꾸미는 주격 관계대명사예요. 뒤에 주어 없이 바로 동사가 오고, 선행사 a chart(차트)가 하나라서 단수 shows(보여 준다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~하는) + 선행사에 맞춘 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a dog that runs fast.</div><div class=\"ko\">나는 빨리 달리는 개가 있다. (a dog 개 한 마리라 runs 달린다가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a dog that run fast.</div><div class=\"ko\">선행사 a dog(개 한 마리)는 단수인데 run(달린다)에 -s가 빠져서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have two dogs that run fast.</div><div class=\"ko\">나는 빨리 달리는 개 두 마리가 있다. (two dogs 개 두 마리라 run이 맞아요)</div></div><p class=\"gb\">지문 2번도 a chart(차트) that shows(보여 주는)라서 단수 선행사에 맞춘 shows(보여 준다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">creating a spider web 거미줄을 만들면서</span><span class=\"why\">4번은 The spider chart is drawn(스파이더 차트는 그려진다)으로 이미 동사가 있고, 쉼표 뒤에 접속사가 없어요. 그래서 동사가 아닌 분사구문이 오고, 차트가 거미줄을 직접 ‘만드는’ 쪽이라 능동 creating(만들면서)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">분사구문: 쉼표 + -ing(능동: ~하면서)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>He sang loudly, making everyone laugh.</div><div class=\"ko\">그는 크게 노래해서 모두를 웃게 만들었다. (그가 직접 웃게 만드니 능동 making이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He sang loudly, makes everyone laugh.</div><div class=\"ko\">sang(노래했다)이 이미 동사인데 접속사 없이 makes(만든다)를 또 써서 틀려요.</div></div><p class=\"gb\">지문 4번도 is drawn(그려진다)이 이미 동사라서, 쉼표 뒤에는 능동 분사 creating(만들면서)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">to elicit further analysis of findings 결과의 추가 분석을 도출하기 위해</span><span class=\"why\">8번은 can then be broken down(이후 쪼개질 수 있다)으로 문장이 이미 끝났어요. 그 뒤에 ‘왜 쪼개는지’ 목적을 덧붙이니 부정사 to elicit(도출하기 위해)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">부사적 용법의 부정사: to(~하기 위해) + 동사원형</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I got up early to catch the bus.</div><div class=\"ko\">나는 버스를 타기 위해 일찍 일어났다. (목적을 말하니 to catch 타기 위해가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I got up early catch the bus.</div><div class=\"ko\">got up(일어났다)이 이미 동사인데 catch(타다)를 또 붙여서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I got up early to catching the bus.</div><div class=\"ko\">to(~하기 위해) 뒤에는 동사원형이 와야 하는데 catching(타는 것)을 써서 틀려요.</div></div><p class=\"gb\">지문 8번도 be broken down(쪼개지다) 뒤에 목적 ‘분석을 도출하기 위해’가 붙으니 to elicit(도출하기 위해)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The spider chart,</div><div class=\"k\">스파이더 차트는,</div></div><div class=\"rc\"><div class=\"e\">also called a radar chart,</div><div class=\"k\">방사형 차트라고도 불리는,</div></div><div class=\"rc\"><div class=\"e\">is a form of line graph.</div><div class=\"k\">일종의 선 그래프이다.</div></div><div class=\"rnat\">방사형 차트라고도 불리는 스파이더 차트는 일종의 선 그래프이다.</div><div class=\"rst\">스파이더 차트는 방사형 차트라고도 하는 선 그래프의 한 종류예요. 지문 1번은 called(불리는)로 뒤에서 이름을 덧붙여요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It helps the researcher</div><div class=\"k\">그것(= 스파이더 차트)은 연구자를 돕는다</div></div><div class=\"rc\"><div class=\"e\">to represent their data in a chart</div><div class=\"k\">그들(= 연구자)의 데이터를 차트 안에 나타내도록</div></div><div class=\"rc\"><div class=\"e\">that shows the relative size of a response</div><div class=\"k\">응답의 상대적 크기를 보여 주는</div></div><div class=\"rc\"><div class=\"e\">on one scale</div><div class=\"k\">하나의 척도에서</div></div><div class=\"rc\"><div class=\"e\">for interrelated variables.</div><div class=\"k\">서로 연관성 있는 변수를 위한.</div></div><div class=\"rnat\">그것은 연구자가 서로 연관성 있는 변수를 위한 하나의 척도에서 응답의 상대적 크기를 보여 주는 차트 안에 그들의 데이터를 나타내도록 도와준다.</div><div class=\"rst\">이 차트는 연구자가 여러 항목의 크기를 한 척도에 보여 주게 도와요. that(~하는) 뒤 shows(보여 준다)가 a chart(차트)에 맞춘 동사예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Like the bar chart,</div><div class=\"k\">막대그래프와 마찬가지로,</div></div><div class=\"rc\"><div class=\"e\">the data needs to have one scale</div><div class=\"k\">데이터는 한 가지 척도를 가져야 한다</div></div><div class=\"rc\"><div class=\"e\">which is common to all variables.</div><div class=\"k\">모든 변수에 공통되는.</div></div><div class=\"rnat\">막대그래프와 마찬가지로, 데이터는 모든 변수에 공통되는 한 가지 척도를 가져야 한다.</div><div class=\"rst\">막대그래프처럼 모든 항목이 같은 눈금을 써야 해요. = 지문 3번, which(~하는)가 one scale(한 가지 척도)을 꾸며요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The spider chart is drawn</div><div class=\"k\">스파이더 차트는 그려진다</div></div><div class=\"rc\"><div class=\"e\">with the variables spanning the chart,</div><div class=\"k\">변수들이 차트를 가로지르게,</div></div><div class=\"rc\"><div class=\"e\">creating a spider web.</div><div class=\"k\">그리고 거미줄 (모양)을 만든다.</div></div><div class=\"rnat\">스파이더 차트는 변수들이 차트를 가로지르게 그려져, 거미줄 (모양)을 만든다.</div><div class=\"rst\">항목들이 차트에 쭉 퍼지면서 거미줄 모양이 돼요. 지문 4번은 is drawn(그려진다) 뒤에 분사 creating(만들면서)을 붙여요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">An example of this <span class=\"cw\">is seen</span></div><div class=\"k\">이것(= 스파이더 차트)의 예는 <span class=\"cw\">관찰된다</span></div></div><div class=\"rc\"><div class=\"e\">in a research study</div><div class=\"k\">연구에서</div></div><div class=\"rc\"><div class=\"e\">looking at self-reported confidence</div><div class=\"k\">자가 보고한 자신감을 살펴보는</div></div><div class=\"rc\"><div class=\"e\">in year 7 students</div><div class=\"k\">7학년 학생들의</div></div><div class=\"rc ckc\"><div class=\"e\">across <span class=\"cw\">a range of subjects</span></div><div class=\"k\"><span class=\"cw\">여러 과목에 걸쳐</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">taught in their first term</span></div><div class=\"k\"><span class=\"cw\">첫 학기에 지도된</span> ※ 문제지엔 have taught로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">in secondary school.</div><div class=\"k\">중등학교에서.</div></div><div class=\"rnat\">이것의 예는 중등학교에서 첫 학기에 지도된 여러 과목에 걸쳐 7학년 학생들이 자가 보고한 자신감을 살펴보는 연구에서 관찰된다.</div><div class=\"rst\">예를 들어 중학교 첫 학기에 <b>배운 과목들</b>에 대한 7학년 자신감을 조사해요. <b>is seen</b>(관찰된다)이 동사라서 taught(가르쳐진)가 맞아요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The researcher takes the responses</div><div class=\"k\">연구자는 응답 값을 가져온다</div></div><div class=\"rc\"><div class=\"e\">from a sample group</div><div class=\"k\">표본 집단으로부터</div></div><div class=\"rc\"><div class=\"e\">and calculates the mean</div><div class=\"k\">그리고 평균치를 계산한다</div></div><div class=\"rc\"><div class=\"e\">to plot on the spider chart.</div><div class=\"k\">스파이더 차트에 기입할.</div></div><div class=\"rnat\">연구자는 표본 집단으로부터 응답 값을 가져와 스파이더 차트에 기입할 평균치를 계산한다.</div><div class=\"rst\">연구자는 학생들 응답을 모아 평균을 내서 차트에 찍어요. 지문 6번은 takes(가져온다)와 calculates(계산한다)가 나란히 이어져요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The spider chart allows the researcher</div><div class=\"k\">스파이더 차트는 연구자가 ~할 수 있게 한다</div></div><div class=\"rc\"><div class=\"e\">to easily compare and contrast</div><div class=\"k\">쉽게 비교 및 대조할 수 있게</div></div><div class=\"rc\"><div class=\"e\">the confidence level in different subjects</div><div class=\"k\">다양한 과목에서의 자신감 수준을</div></div><div class=\"rc\"><div class=\"e\">for the sample group.</div><div class=\"k\">표본 집단에 대해.</div></div><div class=\"rnat\">스파이더 차트는 연구자가 표본 집단에 대해 다양한 과목에서의 자신감 수준을 쉽게 비교 및 대조할 수 있게 한다.</div><div class=\"rst\">그러면 과목마다 자신감이 얼마나 다른지 한눈에 비교할 수 있어요. 지문 7번은 allows(~할 수 있게 하다) + 사람 + to(~하게)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The chart, like the pie chart,</div><div class=\"k\">이 차트는, 파이 차트와 마찬가지로,</div></div><div class=\"rc\"><div class=\"e\">can then be broken down</div><div class=\"k\">이후 쪼개질 수 있다</div></div><div class=\"rc\"><div class=\"e\">for different groups of students within the study</div><div class=\"k\">연구 내 여러 학생 집단으로</div></div><div class=\"rc\"><div class=\"e\">to elicit further analysis of findings.</div><div class=\"k\">결과의 추가 분석을 도출하기 위해.</div></div><div class=\"rnat\">이후 파이 차트와 마찬가지로, 이 차트는 결과의 추가 분석을 도출하기 위해 연구 내 여러 학생 집단으로 쪼개질 수 있다.</div><div class=\"rst\">차트를 학생 집단별로 나누면 더 깊이 분석할 수 있어요. 지문 8번 끝 to elicit(도출하기 위해)는 쪼개는 목적이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"represent\" data-m=\"나타내다, 표현하다\"><b>represent</b>나타내다, 표현하다</button><button type=\"button\" class=\"wdb\" data-w=\"interrelated\" data-m=\"서로 연관된\"><b>interrelated</b>서로 연관된</button><button type=\"button\" class=\"wdb\" data-w=\"variable\" data-m=\"변수\"><b>variable</b>변수</button><button type=\"button\" class=\"wdb\" data-w=\"self-reported\" data-m=\"자기 보고에 의한\"><b>self-reported</b>자기 보고에 의한</button><button type=\"button\" class=\"wdb\" data-w=\"calculate\" data-m=\"계산하다\"><b>calculate</b>계산하다</button><button type=\"button\" class=\"wdb\" data-w=\"elicit\" data-m=\"도출하다, 끌어내다\"><b>elicit</b>도출하다, 끌어내다</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">4번 <b>On the contrary</b>(반대로)에서 글의 방향이 정해져요. 기술은 우리를 딴 세상으로 데려가는 게 아니라 <b>삶 속으로 들어와 녹아드는 것</b>. 그러니 ‘딴 세상’ 믿음이 오래갈수록 융합은 <b>늦어져야</b> 해요.</p><div class=\"ck-step\"><span class=\"lab\">4번 · 방향 전환</span><div class=\"en\"><mark>On the contrary</mark>, we <mark>brought the motors into our lives</mark>, …</div><p class=\"ko\"><mark>반대로</mark>, <mark>우리 삶에 모터를 들여왔다</mark>, …</p></div><div class=\"ck-via\"><i>▼</i><span>모터처럼 기술도 우리 삶에 맞춰 들어와야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 · 글쓴이의 주장</span><div class=\"en\">It’s the one that <mark>must adapt to us</mark>.</div><p class=\"ko\">그것(= 기술)은 <mark>우리에게 적응해야 하는</mark> 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>잘못된 믿음이 오래갈수록 융합이 유지된다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (11번)</span><div class=\"en\">The longer we continue to believe that computers will take us to a magical new world, the longer we will <u>⑤ maintain</u> their natural fusion with our lives, …</div><p class=\"ko\">컴퓨터가 마법 같은 신세계로 데려갈 거라고 더 오래 믿을수록, 삶과의 자연스러운 융합을 더 오래 ( 유지할? ) 것이다 → 지연시킬이 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>‘더 ~할수록 더 …하다’(The longer) 구문: 나쁜 원인(잘못된 믿음)이 길어지면 결과도 나쁜 쪽(늦어짐)</span></div><div class=\"ck-step key\"><span class=\"lab\">11번 · 결정적 단서</span><div class=\"en\">The longer we continue to believe … the longer we will <mark>delay</mark> their natural fusion with our lives</div><p class=\"ko\">우리가 더 오래 계속해서 믿을수록 … 그것들과 우리 삶의 자연스러운 융합을 더 오래 <mark>지연시킬 것이다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">maintain(유지하다) ↔ delay(지연시키다)</p><p class=\"gr\">‘더 ~할수록 더 …하다’(The 비교급) 구문은 앞뒤가 같은 방향으로 이어져요. 앞이 나쁜 원인이면 뒤도 나쁜 결과(delay 지연시키다)여야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The longer I play games, the longer I delay my homework.</div><div class=\"ko\">게임을 오래 할수록 숙제를 더 오래 미룬다. (나쁜 원인 → 나쁜 결과라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The longer I play games, the longer I maintain my homework.</div><div class=\"ko\">게임을 오래 할수록 숙제를 더 오래 유지한다? 방향이 어긋나서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The more I practice, the better I play.</div><div class=\"ko\">연습을 많이 할수록 더 잘한다. (좋은 원인 → 좋은 결과라 맞아요)</div></div><p class=\"gb\">지문 11번도 컴퓨터가 마법 세계로 데려간다는 잘못된 믿음이 오래갈수록, 삶과의 융합은 maintain(유지하다)이 아니라 delay(지연시키다)돼야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">maintain → delay (지연시키다)<small>‘딴 세상’ 믿음이 오래갈수록 삶과의 융합은 유지가 아니라 늦어져야 앞뒤가 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">It's the one that must adapt to us 우리에게 적응해야 하는 것</span><span class=\"why\">7번 사람은 수천 년 동안 안 변했고, 8번 기술은 끊임없이 변해요. 그러니 변하는 쪽인 기술이 우리에게 adapt(적응하다)해야 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">remote motorspace 저 멀리 있는 모터 공간</span><span class=\"why\">3번은 모터가 나왔을 때 우리 세계를 떠나지 않았다는 말이에요. 2번의 otherworld(공상 세계)처럼 삶과 동떨어진 곳이라 remote(저 멀리 있는)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">This absorption has been so complete 이러한 통합은 너무나 완벽해서</span><span class=\"why\">4번에서 모터를 자동차·냉장고로 삶에 들여왔고, 5번 뒤에서 도구를 용도 이름으로만 불러요. 그만큼 완전히 녹아들었으니 complete(완벽한)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">entered and affected profoundly our everyday lives 일상의 삶에 들어와 깊이 영향을 미쳤다</span><span class=\"why\">4번 brought the motors into our lives(삶에 모터를 들여왔다)와 같은 방향이에요. 삶에 깊이 들어왔기에 큰 사회경제적 운동이 됐다는 흐름이라 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Everywhere we turn</div><div class=\"k\">우리가 돌아서는 곳마다</div></div><div class=\"rc\"><div class=\"e\">we hear about almighty “cyberspace”!</div><div class=\"k\">우리는 전능한 '사이버 공간'에 관해 듣는다!</div></div><div class=\"rnat\">우리가 돌아서는 곳마다 우리는 전능한 '사이버 공간'에 관해 듣는다!</div><div class=\"rst\">어딜 가나 “이제 다들 가상 세계에서 산대!”라는 말이 들려요. 지문 1번도 모두가 전능한 사이버 공간 얘기를 한대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The hype promises</div><div class=\"k\">과대광고는 약속한다</div></div><div class=\"rc\"><div class=\"e\">that we will leave our boring lives,</div><div class=\"k\">우리가 지루한 삶을 떠나서,</div></div><div class=\"rc\"><div class=\"e\">put on goggles and body suits,</div><div class=\"k\">고글과 보디 슈트를 착용하고,</div></div><div class=\"rc\"><div class=\"e\">and enter some metallic, three-dimensional, multimedia otherworld.</div><div class=\"k\">그리고 어떤 금속성의 3차원 멀티미디어 공상 세계로 들어갈 것이라고.</div></div><div class=\"rnat\">과대광고는 우리가 지루한 삶을 떠나서 고글과 보디 슈트를 착용하고 어떤 금속성의 3차원 멀티미디어 공상 세계로 들어갈 것이라고 약속한다.</div><div class=\"rst\">광고는 고글 쓰고 지루한 우리 집을 떠나 딴 세상으로 간다고 약속해요. = 지문 2번의 과대광고(hype)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">When the Industrial Revolution arrived</div><div class=\"k\">산업 혁명이 왔을 때</div></div><div class=\"rc\"><div class=\"e\">with its great innovation, the motor,</div><div class=\"k\">그것(= 산업 혁명)의 위대한 혁신인 모터와 함께,</div></div><div class=\"rc\"><div class=\"e\">we didn’t leave our world</div><div class=\"k\">우리는 우리 세계를 떠나지 않았다</div></div><div class=\"rc\"><div class=\"e\">to go to some remote motorspace!</div><div class=\"k\">저 멀리 있는 어떤 모터 공간으로 가기 위해!</div></div><div class=\"rnat\">산업 혁명이 그것의 위대한 혁신인 모터와 함께 왔을 때, 우리는 우리 세계를 떠나 저 멀리 있는 모터 공간으로 가지 않았다!</div><div class=\"rst\">그런데 옛날 모터가 처음 나왔을 때 우리 가족이 모터 나라로 이사 갔나요? 아니죠. 지문 3번도 <b>먼 곳</b>(remote)으로 안 떠났대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">On the contrary</span>,</div><div class=\"k\"><span class=\"cw\">반대로</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">we <span class=\"cw\">brought the motors into our lives</span>,</div><div class=\"k\">우리는 <span class=\"cw\">우리 삶에 모터를 들여왔다</span>,</div></div><div class=\"rc\"><div class=\"e\">as automobiles, refrigerators, drill presses, and pencil sharpeners.</div><div class=\"k\">자동차, 냉장고, 드릴 프레스, 연필깎이로.</div></div><div class=\"rnat\">반대로, 자동차, 냉장고, 드릴 프레스, 연필깎이 등에서 보듯이, 우리는 우리 삶에 모터를 들여왔다.</div><div class=\"rst\"><b>반대로</b>(On the contrary) 모터는 우리 집 냉장고·연필깎이 속으로 들어왔어요. 지문 4번, 모터를 <b>삶에 들여왔다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">This absorption has been so complete</div><div class=\"k\">이러한 통합은 너무나 완벽해서</div></div><div class=\"rc\"><div class=\"e\">that we refer to all these tools</div><div class=\"k\">우리는 이 모든 도구를 부른다</div></div><div class=\"rc\"><div class=\"e\">with names that declare their usage,</div><div class=\"k\">그것들(= 이 모든 도구)의 용도를 밝혀 주는 이름으로,</div></div><div class=\"rc\"><div class=\"e\">not their “motorness.”</div><div class=\"k\">그것들의 '모터(를 지녔다는) 특성'이 아니라.</div></div><div class=\"rnat\">이러한 통합은 너무나 완벽해서, 우리는 이 모든 도구를 그것의 '모터(를 지녔다는) 특성'이 아닌, 그것의 용도를 밝혀 주는 이름으로 부른다.</div><div class=\"rst\">너무 자연스럽게 녹아들어서 ‘모터 기계’라 안 부르고 그냥 냉장고라 불러요. 지문 5번, 통합이 <b>완벽하다</b>(complete)는 거예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">These innovations led to</div><div class=\"k\">이러한 혁신은 ~을 낳았다</div></div><div class=\"rc\"><div class=\"e\">a major socioeconomic movement</div><div class=\"k\">주요 사회경제적 운동을</div></div><div class=\"rc\"><div class=\"e\">precisely because they entered</div><div class=\"k\">바로 그것들(= 이러한 혁신)이 들어왔기 때문에</div></div><div class=\"rc\"><div class=\"e\">and affected profoundly our everyday lives.</div><div class=\"k\">그리고 우리 일상의 삶에 깊이 영향을 미쳤기 때문에.</div></div><div class=\"rnat\">이러한 혁신은 그것이 우리 삶에 들어와 깊이 영향을 미쳤다는 바로 그 이유로 주요 사회경제적 운동을 낳았다.</div><div class=\"rst\">모터가 우리 일상에 깊이 들어왔기 때문에 세상이 크게 바뀌었어요. = 지문 6번, 사회경제적 큰 운동이 생겼다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">People have not changed fundamentally</div><div class=\"k\">사람들은 근본적으로 변하지 않았다</div></div><div class=\"rc\"><div class=\"e\">in thousands of years.</div><div class=\"k\">수천 년 동안.</div></div><div class=\"rnat\">사람들은 수천 년 동안 근본적으로 변하지 않았다.</div><div class=\"rst\">할머니 때나 지금이나 사람은 밥 먹고 자고 친구랑 노는 건 똑같아요. 지문 7번도 사람은 수천 년간 안 변했대요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Technology changes constantly.</div><div class=\"k\">기술은 끊임없이 변한다.</div></div><div class=\"rnat\">기술은 끊임없이 변한다.</div><div class=\"rst\">반면 우리 집 기계는 몇 년마다 새것으로 바뀌어요. = 지문 8번, 기술은 끊임없이 변한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">It’s the one</div><div class=\"k\">그것(= 기술)은 ~하는 것이다</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">must adapt to us</span>.</div><div class=\"k\"><span class=\"cw\">우리에게 적응해야 하는</span>.</div></div><div class=\"rnat\">그것은 우리에게 적응해야 하는 것이다.</div><div class=\"rst\">그러니 바뀌는 쪽인 기계가 우리한테 맞춰야 해요. 지문 9번, 기술이 <b>우리에게 적응해야</b>(adapt to us) 한대요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">That’s exactly what will happen</div><div class=\"k\">그것(= 기술이 우리에게 적응하는 것)이 바로 일어날 일이다</div></div><div class=\"rc\"><div class=\"e\">with information technology and its devices</div><div class=\"k\">정보 기술과 그(= 정보 기술) 장치에</div></div><div class=\"rc\"><div class=\"e\">under human-centric computing.</div><div class=\"k\">인간 중심의 컴퓨터 조작하에서.</div></div><div class=\"rnat\">그것이 바로 인간 중심의 컴퓨터 조작하에서 정보 기술과 그 장치에 일어날 일이다.</div><div class=\"rst\">컴퓨터도 모터처럼 우리 생활에 맞춰 들어올 거예요. = 지문 10번, 인간 중심 컴퓨터 조작에서 그렇게 된다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc\"><div class=\"e\">The longer we continue to believe</div><div class=\"k\">우리가 더 오래 계속해서 믿을수록</div></div><div class=\"rc\"><div class=\"e\">that computers will take us</div><div class=\"k\">컴퓨터가 우리를 데려갈 것이라고</div></div><div class=\"rc\"><div class=\"e\">to a magical new world,</div><div class=\"k\">마법 같은 신세계로,</div></div><div class=\"rc ckc\"><div class=\"e\">the longer we will <span class=\"cw\">delay</span></div><div class=\"k\">우리는 더 오래 <span class=\"cw\">지연시킬 것이다</span> ※ 문제지엔 maintain으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">their natural fusion with our lives,</div><div class=\"k\">그것들(= 컴퓨터)과 우리 삶의 자연스러운 융합을,</div></div><div class=\"rc\"><div class=\"e\">the hallmark of every major movement</div><div class=\"k\">(그 융합은) 모든 주요한 운동의 특징이다</div></div><div class=\"rc\"><div class=\"e\">that aspires to be called a socioeconomic revolution.</div><div class=\"k\">사회경제적 혁명이라고 불리기를 열망하는.</div></div><div class=\"rnat\">컴퓨터가 우리를 마법 같은 신세계로 데려갈 것이라고 우리가 더 오래 계속해서 믿을수록, 우리는 그것들과 우리 삶의 자연스러운 융합을 더 오래 지연시킬 것인데, (이것은) 사회경제적 혁명이라고 불리기를 열망하는 모든 주요한 운동의 특징이다.</div><div class=\"rst\">“컴퓨터가 딴 세상으로 데려간다”는 착각이 길수록 생활에 녹아드는 건 <b>늦어져요</b>. 그래서 maintain(유지하다)이 아니라 <b>delay</b>(지연시키다)예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"hype\" data-m=\"과대광고\"><b>hype</b>과대광고</button><button type=\"button\" class=\"wdb\" data-w=\"remote\" data-m=\"저 멀리 있는, 외딴\"><b>remote</b>저 멀리 있는, 외딴</button><button type=\"button\" class=\"wdb\" data-w=\"on the contrary\" data-m=\"반대로\"><b>on the contrary</b>반대로</button><button type=\"button\" class=\"wdb\" data-w=\"absorption\" data-m=\"통합, 흡수\"><b>absorption</b>통합, 흡수</button><button type=\"button\" class=\"wdb\" data-w=\"profoundly\" data-m=\"깊이, 심오하게\"><b>profoundly</b>깊이, 심오하게</button><button type=\"button\" class=\"wdb\" data-w=\"fusion\" data-m=\"융합, 결합\"><b>fusion</b>융합, 결합</button></div>"};

 var b=e.target.closest('.stbtn');

  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" data-q="'+d.no+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
