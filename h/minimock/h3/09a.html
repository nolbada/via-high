<title>고3 미니모의고사 9회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

(function(W){

  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';

  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}

        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}

    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){

    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

function dwToast(m){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1800);}
function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}
document.addEventListener('click',function(e){
  const el=e.target.closest&&e.target.closest('.dw');if(!el)return;
  e.stopPropagation();e.preventDefault();
  const p=el.closest('[data-q]');const it=p&&dwItem(p.dataset.q,el.dataset.k);if(!it)return;
  const head=it[2]||it[0],mean=it[1];S.dw=S.dw||{};const on=!S.dw[head];
  if(on)S.dw[head]=1;else delete S.dw[head];save();dwMark(head,on);
  if(on){try{WN.add([{w:head,m:mean,src:'미니모고',how:'별표',ask:true}]);}catch(err){}dwToast(head.replace(/\s+[AB](?=\s|$)/g,'').trim()+'  '+mean.replace(/\bA(?=[에를은는이가와과의도]|\s)|\bB(?=[에를은는이가와과의도]|\s)/g,'').replace(/\s+/g,' ').trim()+'  담음');}
  else{let pr=null;try{pr=WN.del(head,'미니모고');}catch(err){}
    if(pr&&pr.then)pr.then(function(r){if(r&&r.removed===false&&r.reason==='late'){S.dw[head]=1;save();dwMark(head,true);dwToast('이미 쌓인 단어라 뺄 수 없어요');}else if(r&&r.removed)dwToast(head+'  뺌');});
    else dwToast(head+'  뺌');}
},true);

and를 꾸밈", "접속사 and + 주어 I + 동사 am able to charge(= can) + 목적어 prices. good = 형용사: prices를 꾸밈"], "steps": [{"t": "이 문장은 <b>두 절이 and로 이어진 문장</b>이다. 앞은 There is 구문, 뒤는 S+V+O(3형식)이다."}, {"t": "뼈대부터 찾는다.", "sub": ["앞 절  there is a steady demand = 꾸준한 수요가 있다. 진짜 주어는 뒤의 demand (수요), 동사는 is, there는 자리를 채우는 말", "뒤 절  S: I (저)  V: am able to charge (be able to ~할 수 있다 = can. charge 값을 받다, 청구하다)  O: good prices (좋은 값)", "뼈대 = <b>There is a steady demand</b>, and <b>I am able to charge good prices</b>"]}, {"t": "<b>steady</b>는 꾸준한이라는 형용사로 demand를 꾸미고, <b>in my country</b>는 우리나라에라는 부사구이다."}, {"t": "<b>for high quality leather gloves</b>는 전치사구(형용사구)로 demand를 꾸민다. 고품질 가죽 장갑에 대한 수요라는 뜻이다."}, {"t": "함정: am able to는 can과 같은 뜻의 동사 덩어리이다. to 뒤에는 동사원형 charge가 온다."}], "sum": "우리나라에 가죽 장갑 수요가 꾸준해 좋은 값을 받을 수 있음"}, {"i": "03", "q": "02", "s": "2", "title": "S+V+C + 관계절 두 개(that)", "eng": "It is a century<sup>1</sup> / that is characterized<sup>2</sup> by knowledge as the important resource<sup>3</sup> / that gains<sup>4</sup> competitive advantage<sup>5</sup> for companies.", "notes": [["1", "century", "세기, 100년"], ["2", "be characterized by", "~라는 특징을 가지다"], ["3", "resource", "자원"], ["4", "gain", "확보하다, 얻다"], ["5", "competitive advantage", "경쟁 우위"]], "lit": "그것은 세기이다 / 지식을 중요한 자원으로 하는 특징을 지닌 / 기업에 경쟁 우위를 확보해 주는.", "nat": "21세기는 기업에 경쟁 우위를 확보해 주는 중요한 자원으로서의 지식이 그 특징인 세기이다.", "ana": "<b>that이 두 번</b> 나오는데 둘 다 <b>주격 관계대명사</b>이고, 꾸미는 대상이 서로 다르다. 첫 번째 that의 선행사는 <b>a century</b>, 두 번째 that의 선행사는 바로 앞의 <b>the important resource</b>다. 관계대명사는 <b>가장 가까운 명사</b>부터 의심하되, 뜻이 어울리지 않으면 앞으로 거슬러 올라가 확인해야 한다. <b>be characterized by</b>는 '<b>~라는 특징을 가지다</b>'라는 수동 표현이고, 뒤의 <b>as</b>는 '<b>~로서</b>'라는 자격을 나타낸다. 즉 '지식 = 중요한 자원'이라는 관계가 as로 묶여 있다.", "pe": "It is a century<sup>1</sup> / \u0001that is characterized<sup>2</sup> by knowledge as the important resource<sup>3</sup>\u0002 / \u0001that gains<sup>4</sup> competitive advantage<sup>5</sup> for companies\u0002.", "pk": "그것은 세기이다 / \u0001지식을 중요한 자원으로 하는 특징을 지닌\u0002 / \u0001기업에 경쟁 우위를 확보해 주는\u0002.", "core": "그것은 한 세기이다.", "tags": ["주어 It + 동사 is + 보어 century", "that절 = 관계절(형용사절): century를 꾸밈. <b>be characterized by</b> = ~이 특징이다(수동). as the important resource = 전치사구: knowledge를 설명", "that절 = 관계절(형용사절): resource를 꾸밈. for companies = 전치사구(부사구): gains의 대상"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 보어 뒤에 that절이 두 번 이어져 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: it (그것)", "V: is", "C: a century (세기)", "뼈대 = <b>It is a century</b>"]}, {"t": "첫째 <b>that is characterized by knowledge as the important resource</b>는 <b>관계절(형용사절)</b>로 century를 꾸민다.", "sub": ["be characterized by = ~로 특징지어지다 (characterize 특징짓다의 수동태)", "knowledge as the important resource = 중요한 자원으로서의 지식 (as는 ~로서)"]}, {"t": "둘째 <b>that gains competitive advantage for companies</b>는 <b>관계절(형용사절)</b>로 resource를 꾸민다.", "sub": ["gains = 얻게 해 주다, 확보해 주다 (gain 얻다의 3인칭 단수형)", "competitive advantage = 경쟁 우위, for companies = 기업을 위해"]}, {"t": "함정: that이 두 번 나오지만 선행사가 다르다. 첫째 that은 century, 둘째 that은 resource를 꾸민다. 동사 is characterized와 gains가 각각 단수 선행사에 맞는다."}], "sum": "기업에 경쟁 우위를 주는 자원인 지식이 특징인 세기"}, {"i": "04", "q": "02", "s": "6", "title": "부사구 + S+V+O + 동명사의 부정 + 이유 because절", "eng": "By and large<sup>1</sup>, / organizations<sup>2</sup> do not have any problem of not having enough data / because most organizations are rich with<sup>3</sup> data.", "notes": [["1", "by and large", "대체로"], ["2", "organization", "조직, 단체"], ["3", "be rich with", "~이 풍부하다"]], "lit": "대체로, / 조직들은 데이터가 충분하지 않다는 문제를 겪지 않는다 / 대부분의 조직은 데이터가 풍부하기 때문이다.", "nat": "대체로 대부분의 조직은 데이터가 풍부하기 때문에, 데이터가 충분하지 않다는 문제는 겪지 않는다.", "ana": "<b>부정어가 두 번</b> 나오는 문장이라 뜻이 뒤집히기 쉽다. 주절의 <b>do not have any problem</b>이 첫 번째 부정이고, 전치사 of 뒤에 온 <b>not having enough data</b>가 두 번째 부정이다. <b>동명사를 부정할 때는 not을 동명사 앞</b>에 둔다는 규칙이 그대로 쓰였다. 이 of는 '<b>동격의 of</b>'로 '문제 = 데이터가 충분하지 않은 것'이라는 관계를 만든다. 그러므로 전체는 '<b>데이터 부족이라는 문제는 없다</b>'는 뜻이 되고, 이어지는 because절이 그 이유를 댄다. 부정이 겹칠수록 <b>덩어리 단위로</b> 뜻을 확정하고 넘어가야 한다.", "pe": "\u0001By and large<sup>1</sup>\u0002, / organizations<sup>2</sup> do not have any problem \u0001of not having enough data\u0002 / \u0001because most organizations are rich with<sup>3</sup> data\u0002.", "pk": "\u0001대체로\u0002, / 조직들은 \u0001데이터가 충분하지 않다는\u0002 문제를 겪지 않는다 / \u0001대부분의 조직은 데이터가 풍부하기 때문이다\u0002.", "core": "조직들은 문제를 겪지 않는다.", "tags": ["By and large = 부사구(관용): 문장 전체를 꾸밈 (대체로)", "주어 organizations + 동사 do not have + 목적어 problem. of not having ~ = 전치사구(형용사구, 동격): problem의 내용을 꾸밈", "because절 = 부사절(이유): do not have를 꾸밈. be rich with = ~이 풍부하다"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식) + because절</b>이다. 목적어 뒤에 동명사의 부정이 붙어 헷갈리기 쉽다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: organizations (조직들)", "V: do not have (have 가지고 있다의 부정)", "O: any problem (어떤 문제도)", "뼈대 = <b>organizations do not have any problem</b>"]}, {"t": "<b>By and large</b>는 대체로라는 관용 부사구로 문장 전체를 꾸민다."}, {"t": "<b>of not having enough data</b>는 전치사구(형용사구)로 problem의 내용을 설명한다.", "sub": ["of 뒤에 동명사 not having (갖지 않는 것). 동명사를 부정할 때는 not을 앞에 붙인다", "enough data = 충분한 데이터 → 데이터가 충분하지 않다는 문제"]}, {"t": "<b>because most organizations are rich with data</b>는 <b>부사절(이유)</b>이다.", "sub": ["S: most organizations (대부분의 조직)  V: are  C: rich with data (데이터가 풍부한)", "be rich with ~ = ~이 풍부하다"]}, {"t": "함정: do not have와 not having의 not이 두 번 나오지만 이중 부정이 아니다. 데이터가 부족한 문제는 없다는 뜻이다."}], "sum": "대부분 조직은 데이터가 풍부해 데이터 부족 문제는 없음"}, {"i": "05", "q": "03", "s": "8", "title": "S+V + 목적 to부정사 + cause A to V", "eng": "Temporocentrism<sup>1</sup> and ethnocentrism<sup>2</sup> unite<sup>3</sup> / to cause individuals and cultures to judge<sup>4</sup> all other individuals and cultures / by the “superior<sup>5</sup>” standards<sup>6</sup> of their current culture.", "notes": [["1", "temporocentrism", "자기 시대 중심주의"], ["2", "ethnocentrism", "자기 민족 중심주의"], ["3", "unite", "결합하다, 합치다"], ["4", "judge", "판단하다, 재단하다"], ["5", "superior", "우월한, 뛰어난"], ["6", "standard", "기준, 표준"]], "lit": "자기 시대 중심주의와 자기 민족 중심주의는 결합한다 / 개인과 문화가 다른 모든 개인과 문화를 재단하게 만들기 위해 / 자기네 현재 문화의 '우월한' 기준으로.", "nat": "자기 시대 중심주의와 자기 민족 중심주의가 결합하여, 개인과 문화가 자기네 현재 문화의 '우월한' 기준으로 다른 모든 개인과 문화를 재단하게 만든다.", "ana": "동사 <b>unite</b> 뒤의 <b>to cause</b>는 '<b>~하기 위해·그래서 ~하게 되다</b>'로 읽는 <b>부사적 용법</b>의 to부정사다. 그리고 cause는 <b>cause + 목적어 + to V</b>(~가 …하게 만들다) 형태를 취하므로, 목적어 <b>individuals and cultures</b>와 그 뒤의 <b>to judge</b>를 반드시 <b>한 덩어리</b>로 묶어야 한다. 여기서 목적어가 길어 to judge가 멀리 떨어져 보이는 것이 함정이다. 마지막 <b>by the “superior” standards</b>의 by는 '<b>~을 기준으로</b>'라는 뜻이고, superior에 붙은 따옴표는 필자가 그 우월함을 <b>인정하지 않는다</b>는 신호다.", "pe": "Temporocentrism<sup>1</sup> and ethnocentrism<sup>2</sup> unite<sup>3</sup> / \u0001to cause individuals and cultures to judge<sup>4</sup> all other individuals and cultures\u0002 / \u0001by the “superior<sup>5</sup>” standards<sup>6</sup> \u0001of their current culture\u0002\u0002.", "pk": "자기 시대 중심주의와 자기 민족 중심주의는 결합한다 / \u0001개인과 문화가 다른 모든 개인과 문화를 재단하게 만들기 위해\u0002 / \u0001\u0001자기네 현재 문화의\u0002 '우월한' 기준으로\u0002.", "core": "자기 시대 중심주의와 자기 민족 중심주의는 결합한다.", "tags": ["주어: Temporocentrism and ethnocentrism(병렬) + 동사 unite", "to cause ~ = to부정사(부사적: 목적·결과): unite를 꾸밈. <b>cause A to V</b> = A가 V하게 만들다(5형식)", "by the superior standards = 전치사구(부사구): judge를 꾸밈 (판단 기준). of their current culture = 전치사구(형용사구): standards를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 뒤의 to부정사 안에 5형식이 들어 있고 by 전치사구까지 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: temporocentrism and ethnocentrism (자기 시대 중심주의와 자기 민족 중심주의. 병렬 주어)", "V: unite (결합하다)", "뼈대 = <b>Temporocentrism and ethnocentrism unite</b>"]}, {"t": "<b>to cause ~</b>는 <b>to부정사(부사적 용법, 목적)</b>로 unite를 꾸민다. 그 안이 <b>cause + O + C(to V)</b>인 5형식이다.", "sub": ["cause A to V = A가 ~하게 만들다", "O: individuals and cultures (개인과 문화)  C: to judge (판단하다, 재단하다)", "judge의 목적어: all other individuals and cultures (다른 모든 개인과 문화)"]}, {"t": "<b>by the “superior” standards of their current culture</b>는 전치사구(부사구)로 judge를 꾸민다.", "sub": ["standards = 기준 (superior 우월한)", "of their current culture = standards를 꾸미는 형용사구. 자기네 현재 문화의. their = individuals and cultures"]}, {"t": "함정: unite는 to부정사 앞에서 끝난다. to cause는 결합하는 목적이나 결과를 말하는 부사 덩어리이다."}], "sum": "자기 시대·민족 중심주의가 합쳐져 자기 문화 기준으로 남을 재단하게 만듦"}, {"i": "06", "q": "04", "s": "2", "title": "명령문 두 개 병렬 + 동격", "eng": "Join our Poetry<sup>1</sup> Writing Basics<sup>2</sup> Workshop / and meet the poet<sup>3</sup>, Ms. Grace Larson!", "notes": [["1", "poetry", "시(문학 장르)"], ["2", "basics", "기초, 필수적인 것들"], ["3", "poet", "시인"]], "lit": "저희 시 창작 기초 워크숍에 참여하세요 / 그리고 시인인 Grace Larson 씨를 만나세요!", "nat": "저희 시 창작 기초 워크숍에 참여해서 시인 Grace Larson 씨를 만나 보세요!", "ana": "주어 없이 동사원형으로 시작하면 <b>명령문</b>이다. 여기서는 <b>Join</b>과 <b>meet</b> 두 개의 명령문이 and로 이어진 <b>병렬</b>이라, 뒤의 meet에도 주어가 없다는 점을 놓치면 문장이 꼬인다. 안내문의 첫 문장은 대개 이렇게 <b>참여를 권하는 명령문</b>으로 시작하므로 이 형태에 익숙해져야 한다. <b>the poet, Ms. Grace Larson</b>에서 콤마는 앞뒤가 같은 대상임을 나타내는 <b>동격</b> 표시다. 즉 '그 시인 = Grace Larson 씨'이다. 안내문 문제는 이런 <b>동격 정보</b>가 선택지의 사실 확인 근거로 자주 쓰인다.", "pe": "Join our Poetry<sup>1</sup> Writing Basics<sup>2</sup> Workshop / and meet the poet<sup>3</sup>, \u0001Ms. Grace Larson\u0002!", "pk": "저희 시 창작 기초 워크숍에 참여하세요 / 그리고 시인인 \u0001Grace Larson 씨\u0002를 만나세요!", "core": "워크숍에 참여하고 시인을 만나라.", "tags": ["명령문: 주어 You 생략 + 동사 Join + 목적어 Workshop. Poetry Writing Basics는 워크숍 이름", "and meet: 명령문 동사 병렬. Ms. Grace Larson = 동격: the poet를 보충 설명"], "steps": [{"t": "이 문장은 <b>명령문 두 개가 and로 병렬</b>된 문장이다. 둘 다 주어 You가 생략된 S+V+O(3형식)이다."}, {"t": "뼈대부터 찾는다.", "sub": ["V1: Join (참여하다)  O: our Poetry Writing Basics Workshop (저희 시 창작 기초 워크숍. 워크숍 이름)", "V2: meet (만나다)  O: the poet (시인)", "뼈대 = <b>Join the Workshop</b> and <b>meet the poet</b>"]}, {"t": "<b>our Poetry Writing Basics Workshop</b>은 Poetry(시), Writing(창작), Basics(기초)가 붙은 워크숍 이름이다. 길어 보여도 하나의 명사 덩어리이다."}, {"t": "쉼표 뒤 <b>Ms. Grace Larson</b>은 the poet를 가리키는 <b>동격</b>이다. 시인인 Grace Larson 씨라는 뜻이다."}], "sum": "시 창작 기초 워크숍 참여와 Grace Larson 시인 만남"}, {"i": "07", "q": "05", "s": "2", "title": "S+V+O+C(help A to V) + 주격 관계절", "eng": "It helps the researcher to represent<sup>1</sup> their data in a chart / that shows the relative<sup>2</sup> size of a response<sup>3</sup> on one scale<sup>4</sup> / for interrelated<sup>5</sup> variables<sup>6</sup>.", "notes": [["1", "represent", "나타내다, 표현하다"], ["2", "relative", "상대적인"], ["3", "response", "응답, 반응"], ["4", "scale", "척도, 눈금"], ["5", "interrelated", "서로 연관된"], ["6", "variable", "변수"]], "lit": "그것은 연구자가 데이터를 차트로 나타내도록 돕는다 / 하나의 척도에서 응답의 상대적 크기를 보여 주는 / 서로 연관된 변수들에 대해.", "nat": "그것은 서로 연관된 변수들에 대해 하나의 척도에서 응답의 상대적 크기를 보여 주는 차트로 연구자가 자신의 데이터를 나타내도록 돕는다.", "ana": "<b>help</b>는 목적어 뒤에 <b>to V와 동사원형을 모두</b> 쓸 수 있는 동사다. 여기서는 <b>help + the researcher + to represent</b> 형태이므로 '<b>연구자가 나타내도록 돕는다</b>'로 읽는다. 이때 to represent를 '나타내기 위해'라는 목적으로 착각하면 안 된다. 뒤의 <b>that</b>은 <b>a chart</b>를 받는 <b>주격 관계대명사</b>이고, that 뒤에 주어 없이 동사 shows가 바로 오는 것이 그 증거다. 마지막 <b>for interrelated variables</b>는 shows에 걸리는 부사구로, 관계절 안쪽에 속한다는 점을 확인해 두자.", "pe": "It helps the researcher to represent<sup>1</sup> their data \u0001in a chart\u0002 / \u0001that shows the \u0001relative<sup>2</sup>\u0002 size \u0001of a response<sup>3</sup>\u0002 \u0001on one scale<sup>4</sup>\u0002\u0002 / \u0001for interrelated<sup>5</sup> variables<sup>6</sup>\u0002.", "pk": "그것은 연구자가 데이터를 \u0001차트로\u0002 나타내도록 돕는다 / \u0001\u0001하나의 척도에서\u0002 \u0001응답의\u0002 \u0001상대적\u0002 크기를 보여 주는\u0002 / \u0001서로 연관된 변수들에 대해\u0002.", "core": "그것은 연구자가 데이터를 나타내도록 돕는다.", "tags": ["주어 It + 동사 helps + 목적어 researcher + 목적격보어 to represent ~(5형식). in a chart = 전치사구(부사구): represent를 꾸밈", "that절 = 관계절(형용사절): chart를 꾸밈. relative = 형용사: size 꾸밈. of a response = 형용사구: size 꾸밈. on one scale = 부사구: shows 꾸밈", "for interrelated variables = 전치사구(부사구): shows를 꾸밈 (대상)"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식)</b>이다. 뒤에 관계절과 전치사구가 연달아 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: it (그것)", "V: helps (help 돕다의 3인칭 단수형)", "O: the researcher (연구자)", "C: to represent their data (데이터를 나타내도록. represent 나타내다)", "뼈대 = <b>It helps the researcher to represent their data</b>", "their는 단수 the researcher를 받는 말이다."]}, {"t": "<b>in a chart</b>는 전치사구(부사구)로 represent를 꾸민다. 차트로라는 뜻이다."}, {"t": "<b>that shows ~ variables</b>는 <b>관계절(형용사절)</b>로 chart를 꾸민다.", "sub": ["shows (show 보여 주다의 3인칭 단수형) the relative size of a response (응답의 상대적 크기. relative 상대적인)", "on one scale = 하나의 척도에서, shows를 꾸밈 (scale 척도)", "for interrelated variables = 서로 연관된 변수들에 대해 (variable 변수)"]}, {"t": "함정: help A to V는 A가 ~하도록 돕는다는 5형식이다. to represent의 주체는 연구자이다."}], "sum": "연구자가 연관 변수의 응답 크기를 한 척도의 차트로 나타내게 도움"}, {"i": "08", "q": "06", "s": "4", "title": "When절 + 동격 + S+V+O + 목적 to부정사", "eng": "When the Industrial Revolution<sup>1</sup> arrived with its great innovation<sup>2</sup>, the motor, / we didn't leave our world / to go to some remote<sup>3</sup> motorspace!", "notes": [["1", "Industrial Revolution", "산업 혁명"], ["2", "innovation", "혁신"], ["3", "remote", "저 멀리 있는, 외딴"]], "lit": "산업 혁명이 그 위대한 혁신인 모터와 함께 도래했을 때, / 우리는 우리 세계를 떠나지 않았다 / 저 멀리 있는 어떤 '모터 공간'으로 가려고!", "nat": "산업 혁명이 모터라는 위대한 혁신과 함께 왔을 때, 우리는 저 멀리 있는 어떤 '모터 공간'으로 가려고 우리 세계를 떠나지는 않았다.", "ana": "문장 앞의 <b>When절</b>은 시간을 나타내는 <b>부사절</b>이므로, 콤마 뒤에 나오는 <b>we didn't leave</b>가 주절임을 먼저 확정해야 한다. When절 안의 <b>its great innovation, the motor</b>에서 콤마는 <b>동격</b> 표시로 '그 위대한 혁신 = 모터'라는 뜻이다. 주절의 <b>to go</b>는 '<b>~하러·~하기 위해</b>'라는 목적의 to부정사인데, 주절이 부정문이므로 '<b>가려고 떠나지는 않았다</b>'라고 부정의 범위를 정확히 잡아야 한다. 이 문장이 뒤에 이어지는 '<b>모터를 우리 삶 속으로 들여왔다</b>'는 반전의 발판이 된다.", "pe": "\u0001When the Industrial Revolution<sup>1</sup> arrived \u0001with its great innovation<sup>2</sup>, the motor\u0002\u0002, / we didn't leave our world / \u0001to go to some remote<sup>3</sup> motorspace\u0002!", "pk": "\u0001산업 혁명이 \u0001그 위대한 혁신인 모터와 함께\u0002 도래했을 때\u0002, / 우리는 우리 세계를 떠나지 않았다 / \u0001저 멀리 있는 어떤 '모터 공간'으로 가려고\u0002!", "core": "우리는 우리 세계를 떠나지 않았다.", "tags": ["When절 = 부사절(때): didn't leave를 꾸밈. with its great innovation = 전치사구(부사구): arrived를 꾸밈. the motor = 동격: innovation을 설명", "주어 we + 동사 didn't leave + 목적어 our world", "to go to ~ = to부정사(부사적: 목적): didn't leave를 꾸밈. to some remote motorspace = go to, 거의 필수에 가까운 부사구"], "steps": [{"t": "이 문장은 <b>When절 + S+V+O(3형식)</b>이다. when절에 동격이 끼고 주절 뒤에 to부정사가 붙어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: we (우리)", "V: didn't leave (leave 떠나다의 과거 부정)", "O: our world (우리의 세계)", "뼈대 = <b>we didn't leave our world</b>"]}, {"t": "<b>When the Industrial Revolution arrived with its great innovation, the motor</b>는 <b>부사절(때)</b>이다.", "sub": ["S: the Industrial Revolution (산업 혁명)  V: arrived (arrive 도래하다, 도착하다의 과거형)", "with its great innovation = 그것의 위대한 혁신과 함께 (innovation 혁신)", "the motor = innovation을 다시 말해 주는 동격. 모터"]}, {"t": "<b>to go to some remote motorspace</b>는 <b>to부정사(부사적 용법, 목적)</b>로 didn't leave를 꾸민다.", "sub": ["~하려고 떠난 것이 아니다. 목적을 말하는 to부정사", "go to ~로 가다, remote 멀리 떨어진, some 어떤, motorspace 모터 공간"]}, {"t": "함정: not은 leave 전체를 부정하고, 목적을 나타내는 to부정사는 ‘그러려고 떠나지는 않았다’로 읽는다."}], "sum": "모터가 등장해도 우리는 모터 공간으로 가려고 세계를 떠나지 않았음"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2022년 3월 18번", "ans": "①", "tr": [["1", "Lorenzo Romano 씨께,"], ["2", "저는 로마의 Antonio Ricci 씨에게서 귀하께서 다양한 천연 가죽으로 수출용 수제 장갑을 생산하신다는 이야기를 들었습니다."], ["3", "귀사의 웹사이트에서 사업에 관해 읽어 보았습니다."], ["4", "우리나라에는 고품질 가죽 장갑에 대한 꾸준한 수요가 있어서, 저는 좋은 값을 받을 수 있습니다."], ["5", "귀하께서 추천하실 만한 장갑에 대한 모든 세부 사항을 알려 주시기 바랍니다."], ["6", "또한 귀하께서 생산하시는 장갑의 견본을 몇 개 보내 주신다면 도움이 되겠습니다."], ["7", "곧 답변을 들을 수 있기를 바랍니다."], ["8", "Jonathan Turner 드림"]], "evh": "5번 문장", "ev": [{"en": true, "h": "Please let me know full details of the gloves you would recommend."}, {"en": false, "h": "목적 문항은 <b>편지의 마지막 대목에 나오는 요청 문장</b>만 정확히 잡으면 끝난다. 앞의 2~4번 문장은 '<b>어떻게 알게 되었는지</b>'와 '<b>왜 관심이 있는지</b>'를 설명하는 배경일 뿐이다. 그러다 5번 문장에서 <b>Please let me know full details</b>로 <b>세부 사항</b>을 요청하고, 곧바로 6번 문장에서 <b>It would also help if you could provide me with some samples</b>로 <b>견본</b>까지 요청한다. <b>full details</b>와 <b>samples</b> 두 가지가 나란히 나오므로, 둘을 <b>모두</b> 담은 선지가 정답이다. 하나만 담긴 선지를 고르지 않도록 주의해야 한다."}], "opts": [{"n": "①", "t": "제품의 모든 세부 사항과 견본을 요청하려고", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>full details</b>와 6번 문장의 <b>some samples</b>를 둘 다 담고 있다. 편지의 실제 요청이 이 두 가지뿐이다."}, {"n": "②", "t": "신제품의 가격 인상 요인에 대해 설명하려고", "a": false, "x": true, "trap": false, "e": "4번 문장에 <b>good prices</b>가 나오지만, 이는 '내가 좋은 값을 받을 수 있다'는 <b>구매 의사의 근거</b>일 뿐 가격 인상 설명이 아니다."}, {"n": "③", "t": "수출할 제품에 대한 전수 검사를 의뢰하려고", "a": false, "x": true, "trap": true, "e": "<b>export</b>라는 단어는 2번 문장에 나오지만 검사(inspection)를 요청하는 문장은 어디에도 없다. 단어만 보고 고르면 걸린다."}, {"n": "④", "t": "웹 사이트에 게시한 정보의 수정을 촉구하려고", "a": false, "x": true, "trap": false, "e": "3번 문장의 <b>your website</b>는 정보를 얻은 <b>경로</b>일 뿐이다. 정보가 틀렸다거나 고치라는 언급이 전혀 없다."}, {"n": "⑤", "t": "제조업체에 품질 개선을 위한 회의를 제안하려고", "a": false, "x": true, "trap": false, "e": "<b>high quality</b>는 자기 나라의 수요를 설명하는 말이지 품질을 개선하라는 요구가 아니며, 회의(meeting)를 제안하는 문장도 없다."}], "w": [["hear from", "~에게서 소식을 듣다"], ["handmade", "수제의, 손으로 만든"], ["export", "수출"], ["a variety of", "다양한"], ["leather", "가죽"], ["steady", "꾸준한, 변함없는"], ["demand", "수요, 요구"], ["charge", "(값을) 매기다, 받다"], ["full details", "모든 세부 사항"], ["recommend", "추천하다"], ["provide A with B", "A에게 B를 제공하다"], ["sample", "견본, 샘플"]]}, {"q": "02", "type": "글의 요지", "src": "2020학년도 6월 22번", "ans": "③", "tr": [["1", "21세기는 정보와 지식의 시대이다."], ["2", "21세기는 기업에 경쟁 우위를 확보해 주는 중요한 자원으로서의 지식이 그 특징인 세기이다."], ["3", "이 모든 지식과 정보를 얻기 위해, 조직은 자신이 저장한 데이터에 의존해야 한다."], ["4", "기본 요소인 데이터는 서로 다른 입력 출처들로부터 매일 수집된다."], ["5", "이 데이터 출처들로부터 정보가 추출되거나 학습되며, 이렇게 포착된 정보는 다시 지식으로 변환되어 결국 행동이나 결정을 촉발하는 데 쓰인다."], ["6", "대체로 대부분의 조직은 데이터가 풍부하기 때문에, 데이터가 충분하지 않다는 문제는 겪지 않는다."], ["7", "그러나 문제는 많은 조직이 정보와 지식 면에서는 빈약하다는 점이다."], ["8", "이 사실은 조직이 직면한 가장 큰 난제 중 하나로 이어진다. 즉, 가공되지 않은 데이터를 어떻게 정보로, 나아가 지식으로 변환할 것인가 하는 문제인데, 이 지식이 제대로 활용되면 고객의 행동과 비즈니스 동향을 예측할 능력을 제공한다."]], "evh": "8번 문장", "ev": [{"en": true, "h": "This fact translates into one of the biggest challenges faced by organizations: how to transform raw data into information and eventually into knowledge, which if exploited correctly provides the capabilities to predict customers' behaviour and business trends."}, {"en": false, "h": "요지 문항은 <b>마지막 문장의 콜론(:) 뒤</b>가 결론인 경우가 많다. 여기서도 8번 문장의 콜론 뒤가 조직의 최대 과제를 못박는다 — <b>가공되지 않은 데이터를 정보로, 다시 지식으로 변환하는 것</b>. 앞의 6·7번 문장이 그 배경이다. 데이터는 <b>넘치지만</b>(rich with data) 정보와 지식은 <b>부족하다</b>(poor in information and knowledge). 즉 데이터의 <b>양</b>이 아니라 <b>변환 능력</b>이 관건이라는 것이다. 2번 문장의 <b>competitive advantage</b>와 마지막의 <b>predict ~ business trends</b>가 그 능력이 곧 <b>기업 경쟁력</b>임을 확인해 준다."}], "opts": [{"n": "①", "t": "고객의 특성은 기업의 데이터 처리 과정에서 주요 고려 사항이다.", "a": false, "x": true, "trap": false, "e": "customers는 마지막 문장에 딱 한 번, 그것도 <b>예측의 대상</b>으로 나올 뿐이다. 데이터 처리 시 무엇을 고려하라는 언급이 없다."}, {"n": "②", "t": "성공하는 기업은 사실에 기반한 판단을 통해 위기를 극복한다.", "a": false, "x": true, "trap": false, "e": "글에 <b>위기(crisis)</b>나 그 극복에 관한 내용이 전혀 없다. 데이터→정보→지식이라는 <b>변환 과정</b>이 주제다."}, {"n": "③", "t": "기업 경쟁력은 데이터를 정보와 지식으로 변환하는 능력에서 나온다.", "a": true, "x": false, "trap": false, "e": "8번 문장의 <b>how to transform raw data into information and eventually into knowledge</b>가 최대 과제로 제시되고, 2번 문장의 <b>competitive advantage</b>가 그 보상임을 밝힌다."}, {"n": "④", "t": "지식 정보화 시대에는 기초 데이터 확보의 중요성이 커지고 있다.", "a": false, "x": true, "trap": true, "e": "6번 문장이 정면으로 반박한다. 대부분의 조직은 이미 <b>데이터가 풍부하다</b>(rich with data). 부족한 것은 데이터가 아니라 지식이다."}, {"n": "⑤", "t": "데이터의 가치는 그것이 가지는 잠재적 수익성에 의해 결정된다.", "a": false, "x": true, "trap": false, "e": "수익성(profitability)이라는 개념 자체가 글에 등장하지 않는다. 글은 <b>변환 능력</b>을 말하지 데이터의 가치 평가 기준을 말하지 않는다."}], "w": [["be characterized by", "~라는 특징을 가지다"], ["competitive advantage", "경쟁 우위"], ["acquire", "얻다, 획득하다"], ["rely on", "~에 의존하다"], ["basic element", "기본 요소"], ["extract", "추출하다, 뽑아내다"], ["transform A into B", "A를 B로 변환하다"], ["trigger", "촉발시키다"], ["by and large", "대체로"], ["raw", "가공되지 않은, 날것의"], ["exploit", "활용하다, 이용하다"], ["capability", "능력, 역량"]]}, {"q": "03", "type": "글의 주제", "src": "2016학년도 수능 22번", "ans": "⑤", "tr": [["1", "역사의 바다에는 두 사이렌이 숨어, 과거를 이해하고 제대로 평가하려 애쓰는 사람들을 오해와 오역이라는 암초 위로 꾀어들인다."], ["2", "이 쌍둥이 같은 두 위험이 바로 자기 시대 중심주의와 자기 민족 중심주의이다."], ["3", "자기 시대 중심주의란 자신이 사는 시대가 가능한 모든 시대 중 최고라는 믿음이다."], ["4", "따라서 다른 모든 시대는 열등하다."], ["5", "자기 민족 중심주의란 자신의 문화가 가능한 모든 문화 중 최고라는 믿음이다."], ["6", "따라서 다른 모든 문화는 열등하다."], ["7", "자기 시대 중심주의와 자기 민족 중심주의는 결합하여, 개인과 문화가 자기네 현재 문화의 '우월한' 기준으로 다른 모든 개인과 문화를 재단하게 만든다."], ["8", "이것은 과거의 문화나 외국의 문화를 다룰 때 관점의 완전한 결여를 낳고, 그 결과로 그 문화들에 대한 오해와 잘못된 인식이 생긴다."], ["9", "자기 시대 중심주의와 자기 민족 중심주의는 현대인을 꾀어 과거 민족들에 대한 정당하지 못한 비판에 빠뜨린다."]], "evh": "9번 문장", "ev": [{"en": true, "h": "Temporocentrism and ethnocentrism tempt moderns into unjustified criticisms of the peoples of the past."}, {"en": false, "h": "주제 문항은 <b>첫 문장의 비유</b>와 <b>마지막 문장의 결론</b>이 같은 말을 하는지 확인하면 확실해진다. 1번 문장의 <b>siren</b>은 뱃사람을 암초로 꾀는 요정이고, 그 암초가 바로 <b>misunderstanding and misinterpretation</b>(오해와 오역)이다. 그리고 마지막 9번 문장이 <b>unjustified criticisms of the peoples of the past</b>로 결론을 못박는다. 즉 두 개의 '<b>중심주의</b>'라는 <b>믿음</b>이 과거에 대한 <b>편향된 해석</b>을 낳는다는 것이다. <b>belief</b>(3·5번 문장)와 <b>biased interpretations</b>를 연결하면 답이 보인다."}], "opts": [{"n": "①", "t": "distinct differences in the ways of recording history (역사를 기록하는 방식의 뚜렷한 차이)", "a": false, "x": true, "trap": false, "e": "기록 방식(recording)에 관한 문장이 하나도 없다. 글은 <b>과거를 보는 태도</b>를 다룬다."}, {"n": "②", "t": "universal features discovered in different cultures (여러 문화에서 발견되는 보편적 특징)", "a": false, "x": true, "trap": false, "e": "글은 오히려 각 문화가 자기 문화를 최고로 여긴다는 <b>편향</b>을 말한다. universal(보편적)과는 정반대 방향이다."}, {"n": "③", "t": "historians' efforts to advocate their own culture (자국 문화를 옹호하려는 역사가들의 노력)", "a": false, "x": true, "trap": false, "e": "주어가 <b>역사가</b>로 좁혀져 있다. 글의 대상은 역사가가 아니라 <b>개인과 문화 전체</b>(individuals and cultures)다."}, {"n": "④", "t": "pros and cons of two cross-cultural perspectives (두 문화 간 관점의 장단점)", "a": false, "x": true, "trap": true, "e": "두 가지가 나오니 그럴듯하지만, 글은 <b>장점을 하나도</b> 말하지 않는다. 처음부터 끝까지 <b>위험(dangers)</b>으로만 규정한다."}, {"n": "⑤", "t": "beliefs that cause biased interpretations of the past (과거에 대한 편향된 해석을 낳는 믿음)", "a": true, "x": false, "trap": false, "e": "3·5번 문장의 <b>the belief that ~</b>이 원인이고, 1번 문장의 <b>misinterpretation</b>과 9번 문장의 <b>unjustified critic function buildQuestions(){

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">편지의 목적은 <b>Please(~해 주세요)</b>로 시작하는 요청 문장에 있어요. 앞 2~4번은 어떻게 알게 됐고 왜 관심 있는지 말하는 배경이고, 5번 <b>세부 사항</b>과 6번 <b>견본</b>, 두 요청을 모두 담은 선택지가 정답이에요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 앞부분은 배경</span><div class=\"en\">I heard from Antonio Ricci of Rome that you are producing <mark>handmade gloves</mark> for export …</div><p class=\"ko\">로마의 Antonio Ricci 씨로부터 귀하께서 … <mark>수제 장갑</mark>을 생산하고 있다고 들었습니다.</p></div><div class=\"ck-via\"><i>▼</i><span>Please(~해 주세요)로 드디어 용건이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\"><mark>Please let me know full details</mark> of the gloves you would recommend.</div><p class=\"ko\">귀하께서 추천하고 싶은 장갑에 대한 <mark>모든 세부 사항을 알려 주시기 바랍니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>also(또한)로 요청이 하나 더 붙어요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 두 번째 요청</span><div class=\"en\"><mark>It would also help</mark> if you could <mark>provide me with some samples</mark> of the gloves you produce.</div><p class=\"ko\"><mark>또한</mark> 귀하께서 생산하는 장갑의 <mark>견본을 몇 개 보내 주신다면</mark> <mark>도움이 될 것 같습니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">제품의 모든 세부 사항과 견본을 요청하려고<small>5번 full details(모든 세부 사항) + 6번 samples(견본), 두 요청을 그대로 합쳤어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">웹 사이트에 게시한 정보의 수정을 촉구하려고</span><span class=\"why\">[지문에 없음] 3번에 website(웹 사이트)가 나오지만 거기서 사업 정보를 읽었다는 말뿐이에요. 고쳐 달라는 말은 한 번도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">신제품의 가격 인상 요인에 대해 설명하려고</span><span class=\"why\">[지문에 없음] 4번 charge good prices(좋은 가격을 매기다)는 내 나라에서 잘 팔 수 있다는 배경이에요. 가격이 오르는 이유를 설명하지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">수출할 제품에 대한 전수 검사를 의뢰하려고</span><span class=\"why\">[지문에 없음] 2번 for export(수출용)는 상대가 만드는 장갑 설명일 뿐이에요. 6번은 견본 몇 개(some samples)를 달라는 거지 전부 검사해 달라는 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">제조업체에 품질 개선을 위한 회의를 제안하려고</span><span class=\"why\">[지문에 없음] 4번 high quality(고품질의)는 수요가 있다는 말이에요. 품질을 고치자거나 만나자는 제안은 없고, 7번도 답장을 기다린다는 말뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Dear Lorenzo Romano,</div><div class=\"k\">Lorenzo Romano 씨께,</div></div><div class=\"rnat\">Lorenzo Romano 씨께,</div><div class=\"rst\">반 티셔츠를 맞추려고 공장 사장님께 메시지를 쓴다고 생각해 봐요. 지문도 로렌초 로마노(Lorenzo Romano) 씨에게 쓰는 편지로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">I heard from Antonio Ricci of Rome</div><div class=\"k\">저는 로마의 Antonio Ricci 씨로부터 들었습니다</div></div><div class=\"rc\"><div class=\"e\">that you are producing handmade gloves</div><div class=\"k\">귀하께서 수제 장갑을 생산하고 있다고</div></div><div class=\"rc\"><div class=\"e\">for export</div><div class=\"k\">수출용으로</div></div><div class=\"rc\"><div class=\"e\">in a variety of natural leathers.</div><div class=\"k\">다양한 천연 가죽으로.</div></div><div class=\"rnat\">로마의 Antonio Ricci 씨로부터 귀하께서 다양한 천연 가죽으로 수출용 수제 장갑을 생산하고 있다고 들었습니다.</div><div class=\"rst\">“옆 반 친구한테 사장님이 손으로 직접 티셔츠를 만드신다고 들었어요.” 지문도 아는 사람에게서 <b>수제 장갑</b> 얘기를 들었다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">I read about your business</div><div class=\"k\">저는 귀하의 사업에 대해 읽어 보았습니다</div></div><div class=\"rc\"><div class=\"e\">on your website.</div><div class=\"k\">귀하의 웹 사이트에서.</div></div><div class=\"rnat\">귀하의 웹 사이트에서 귀하의 사업에 대해 읽어 보았습니다.</div><div class=\"rst\">“가게 홈페이지에서도 봤어요.” 지문 3번도 웹 사이트에서 그 사업을 읽어 봤다고 말해요. 아직은 배경 설명이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">There is a steady demand in my country</div><div class=\"k\">우리나라에는 꾸준한 수요가 있습니다</div></div><div class=\"rc\"><div class=\"e\">for high quality leather gloves,</div><div class=\"k\">고품질의 가죽 장갑에 대한,</div></div><div class=\"rc\"><div class=\"e\">and I am able to charge good prices.</div><div class=\"k\">그리고 저는 좋은 가격을 매길 수 있습니다.</div></div><div class=\"rnat\">우리나라에는 고품질의 가죽 장갑에 대한 수요가 꾸준히 있고, 제가 좋은 가격을 매길 수 있습니다.</div><div class=\"rst\">“우리 학교엔 좋은 티셔츠를 원하는 애들이 늘 많아요.” 지문도 자기 나라에 고급 장갑 <b>꾸준한 수요</b>가 있다는 배경이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Please let me know full details</span></div><div class=\"k\"><span class=\"cw\">모든 세부 사항을 알려 주시기 바랍니다</span></div></div><div class=\"rc\"><div class=\"e\">of the gloves</div><div class=\"k\">장갑에 대한</div></div><div class=\"rc\"><div class=\"e\">you would recommend.</div><div class=\"k\">귀하께서 추천하고 싶은.</div></div><div class=\"rnat\">귀하께서 추천하고 싶은 장갑에 대한 모든 세부 사항을 알려 주시기 바랍니다.</div><div class=\"rst\"><b>“추천하는 티셔츠 정보를 전부 알려 주세요.”</b> 드디어 용건이에요. 지문 5번도 <b>모든 세부 사항</b>(full details)을 알려 달래요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">It would also help</span></div><div class=\"k\"><span class=\"cw\">또한 도움이 될 것 같습니다</span></div></div><div class=\"rc ckc\"><div class=\"e\">if you could <span class=\"cw\">provide me with some samples</span></div><div class=\"k\">만약 귀하께서 제게 <span class=\"cw\">견본을 몇 개 보내 주신다면</span></div></div><div class=\"rc\"><div class=\"e\">of the gloves you produce.</div><div class=\"k\">귀하께서 생산하는 장갑의.</div></div><div class=\"rnat\">또한 귀하께서 생산하는 장갑의 견본을 몇 개 보내 주신다면 도움이 될 것 같습니다.</div><div class=\"rst\">“<b>또한</b> 샘플도 몇 장 보내 주시면 좋겠어요.” 지문 6번도 장갑 <b>견본</b>(samples)을 달라고 한 번 더 요청해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">I hope to hear from you soon.</div><div class=\"k\">곧 답변을 들을 수 있기를 바랍니다.</div></div><div class=\"rnat\">곧 답변을 들을 수 있기를 바랍니다.</div><div class=\"rst\">“빨리 답장 주세요!” 하고 마무리해요. 지문 7번도 곧 답을 듣고 싶다며 요청을 마쳐요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Sincerely yours,</div><div class=\"k\">진심을 담아,</div></div><div class=\"rc\"><div class=\"e\">Jonathan Turner</div><div class=\"k\">Jonathan Turner 드림</div></div><div class=\"rnat\">Jonathan Turner 드림</div><div class=\"rst\">메시지 끝에 내 이름을 쓰듯, 지문도 보낸 사람 조너선 터너(Jonathan Turner)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"handmade\" data-m=\"수제의, 손으로 만든\"><b>handmade</b>수제의, 손으로 만든</button><button type=\"button\" class=\"wdb\" data-w=\"export\" data-m=\"수출\"><b>export</b>수출</button><button type=\"button\" class=\"wdb\" data-w=\"steady\" data-m=\"꾸준한, 변함없는\"><b>steady</b>꾸준한, 변함없는</button><button type=\"button\" class=\"wdb\" data-w=\"demand\" data-m=\"수요, 요구\"><b>demand</b>수요, 요구</button><button type=\"button\" class=\"wdb\" data-w=\"full details\" data-m=\"모든 세부 사항\"><b>full details</b>모든 세부 사항</button><button type=\"button\" class=\"wdb\" data-w=\"sample\" data-m=\"견본, 샘플\"><b>sample</b>견본, 샘플</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>however</b>(그러나) 뒤에 나와요. 7번의 “문제”를 8번 <b>콜론(:) 뒤</b>가 풀어 주는데, 데이터의 양이 아니라 <b>데이터 → 정보 → 지식으로 바꾸는 능력</b>이 핵심이에요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 지식 = 경쟁 우위</span><div class=\"en\">It is a century that is characterized by knowledge as the important resource that gains <mark>competitive advantage</mark> for companies.</div><p class=\"ko\">기업들에게 <mark>경쟁 우위</mark>를 확보해 주는 중요한 자원으로서의 지식이라는 특징을 가진 세기이다.</p></div><div class=\"ck-via\"><i>▼</i><span>데이터는 넘치는데(6번) however(그러나) 정보·지식은 부족해요</span></div><div class=\"ck-step\"><span class=\"lab\">6~7번 문장 · 결론 신호</span><div class=\"en\">The problem <mark>however</mark> is that many organizations are <mark>poor in information and knowledge</mark>.</div><p class=\"ko\"><mark>그러나</mark> 문제는 많은 조직들이 <mark>정보와 지식이 부족하다</mark>는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>This fact(이러한 사실)가 7번 문제를 받아 해결 과제로 바꿔요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 요지</span><div class=\"en\">… one of the biggest challenges faced by organizations: <mark>how to transform raw data into information and eventually into knowledge</mark>, …</div><p class=\"ko\">조직들이 직면하는 가장 큰 난제들 중 하나, 즉 <mark>미가공 데이터를 정보로 그리고 결국 지식으로 변환하는 방법</mark></p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">기업 경쟁력은 데이터를 정보와 지식으로 변환하는 능력에서 나온다.<small>2번 competitive advantage(경쟁 우위) + 8번 transform(변환하다)을 한 문장으로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">지식 정보화 시대에는 기초 데이터 확보의 중요성이 커지고 있다.</span><span class=\"why\">[반대] 6번에서 조직들은 데이터가 풍부해서(rich with data) 부족한 문제가 없다고 했어요. 문제는 확보가 아니라 바꾸는 능력이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">고객의 특성은 기업의 데이터 처리 과정에서 주요 고려 사항이다.</span><span class=\"why\">[범위 좁음] 고객은 8번 끝에 지식을 잘 쓰면 customers’ behaviour(고객의 행동)를 예측할 수 있다는 결과로만 나와요. 글의 중심이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">성공하는 기업은 사실에 기반한 판단을 통해 위기를 극복한다.</span><span class=\"why\">[지문에 없음] 5번에 decisions(결정)가 나오지만 위기를 극복한다는 말은 없어요. 지문은 데이터를 지식으로 바꾸는 과제를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">데이터의 가치는 그것이 가지는 잠재적 수익성에 의해 결정된다.</span><span class=\"why\">[지문에 없음] 수익성 얘기는 한 번도 안 나와요. 데이터 자체가 아니라 정보·지식으로 바뀌어야 쓸모가 생긴다는 글이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The twenty-first century</div><div class=\"k\">21세기는</div></div><div class=\"rc\"><div class=\"e\">is the age of information and knowledge.</div><div class=\"k\">정보와 지식의 시대이다.</div></div><div class=\"rnat\">21세기는 정보와 지식의 시대이다.</div><div class=\"rst\">요즘 시험은 많이 아는 사람이 이기는 싸움이에요. 지문 1번도 21세기는 <b>정보와 지식</b>의 시대라고 말해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">It is a century</div><div class=\"k\">그것(= 21세기)은 세기이다</div></div><div class=\"rc\"><div class=\"e\">that is characterized by knowledge</div><div class=\"k\">지식이라는 특징을 가진</div></div><div class=\"rc\"><div class=\"e\">as the important resource</div><div class=\"k\">중요한 자원으로서의</div></div><div class=\"rc ckc\"><div class=\"e\">that gains <span class=\"cw\">competitive advantage</span> for companies.</div><div class=\"k\">기업들에게 <span class=\"cw\">경쟁 우위를 확보해 주는</span>.</div></div><div class=\"rnat\">그것은 기업들에게 경쟁 우위를 확보해 주는 중요한 자원으로서의 지식이라는 특징을 가진(지식에 의해 특징지어지는) 세기이다.</div><div class=\"rst\">우리 반이 옆 반을 이기려면 지식이 무기예요. = 지문 2번, 지식이 기업에게 <b>경쟁 우위</b>(competitive advantage)를 준다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">To acquire all these knowledge and information,</div><div class=\"k\">이러한 모든 지식과 정보를 습득하기 위해서,</div></div><div class=\"rc\"><div class=\"e\">organizations must rely on the data</div><div class=\"k\">조직들은 데이터에 의지해야 한다</div></div><div class=\"rc\"><div class=\"e\">that they store.</div><div class=\"k\">그들(= 조직들)이 저장한.</div></div><div class=\"rnat\">이러한 모든 지식과 정보를 습득하기 위해서, 조직들은 그들이 저장한 데이터에 의지해야 한다.</div><div class=\"rst\">그 지식을 얻으려면 그동안 모아 둔 시험지와 필기를 봐야 해요. 지문 3번도 조직은 저장한 데이터에 의지해야 한다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Data, the basic element,</div><div class=\"k\">기본 요소인 데이터는,</div></div><div class=\"rc\"><div class=\"e\">is gathered daily</div><div class=\"k\">매일 수집된다</div></div><div class=\"rc\"><div class=\"e\">from different input sources.</div><div class=\"k\">서로 다른 정보 출처들로부터.</div></div><div class=\"rnat\">기본 요소인 데이터는 서로 다른 정보 출처들로부터 매일 수집된다.</div><div class=\"rst\">시험지·숙제·쪽지 시험이 매일 여기저기서 쌓여요. = 지문 4번, 기본 요소인 데이터가 매일 여러 곳에서 모인다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Information is extracted or learned</div><div class=\"k\">정보는 추출되거나 학습된다</div></div><div class=\"rc\"><div class=\"e\">from these sources of data,</div><div class=\"k\">이러한 데이터 출처들로부터,</div></div><div class=\"rc\"><div class=\"e\">and this captured information</div><div class=\"k\">그리고 이 수집된 정보는</div></div><div class=\"rc\"><div class=\"e\">is then transformed into knowledge</div><div class=\"k\">그런 다음에 지식으로 변환된다</div></div><div class=\"rc\"><div class=\"e\">that is eventually used</div><div class=\"k\">결국 사용되는</div></div><div class=\"rc\"><div class=\"e\">to trigger actions or decisions.</div><div class=\"k\">행동이나 결정을 촉발시키는 데.</div></div><div class=\"rnat\">정보는 이러한 데이터 출처들로부터 추출되거나 학습되며, 그런 다음에 이 수집된 정보는 결국 행동이나 결정을 촉발시키는 데 사용되는 지식으로 변환된다.</div><div class=\"rst\">시험지에서 오답을 뽑아 정리하면 정보, 그걸로 공부법을 세우면 지식이 돼요. 지문 5번도 데이터 → 정보 → 지식 → 행동 순서예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">By and large,</div><div class=\"k\">대체로,</div></div><div class=\"rc\"><div class=\"e\">organizations do not have any problem</div><div class=\"k\">조직들은 어떤 문제도 가지지 않는다</div></div><div class=\"rc\"><div class=\"e\">of not having enough data</div><div class=\"k\">데이터가 충분하지 않다는</div></div><div class=\"rc\"><div class=\"e\">because most organizations are rich with data.</div><div class=\"k\">대부분의 조직들은 데이터가 풍부하기 때문에.</div></div><div class=\"rnat\">대체로, 대부분의 조직들은 데이터가 풍부하기 때문에 데이터가 충분하지 않다는 문제를 가지지 않는다(데이터가 충분하지 않아서 문제되는 경우는 없다).</div><div class=\"rst\">사실 우리 반은 시험지가 모자란 적은 없어요. 책상마다 넘쳐요. = 지문 6번, 조직들은 데이터가 풍부하다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\">The problem <span class=\"cw\">however</span> is</div><div class=\"k\"><span class=\"cw\">그러나</span> 문제는 ~이다</div></div><div class=\"rc ckc\"><div class=\"e\">that many organizations are <span class=\"cw\">poor</span></div><div class=\"k\">많은 조직들이 <span class=\"cw\">부족하다는 것</span></div></div><div class=\"rc\"><div class=\"e\">in information and knowledge.</div><div class=\"k\">정보와 지식이.</div></div><div class=\"rnat\">그러나 문제는 많은 조직들이 정보와 지식이 부족하다는 것이다.</div><div class=\"rst\"><b>그러나</b>(however) 문제는 오답 정리도, 공부법도 없다는 거예요. 지문 7번도 정보와 지식이 <b>부족하다</b>고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">This fact translates into</div><div class=\"k\">이러한 사실은 ~로 바뀐다</div></div><div class=\"rc\"><div class=\"e\">one of the biggest challenges</div><div class=\"k\">가장 큰 난제들 중 하나로</div></div><div class=\"rc\"><div class=\"e\">faced by organizations:</div><div class=\"k\">조직들이 직면하는:</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">how to transform raw data into information</span></div><div class=\"k\">즉, <span class=\"cw\">미가공 데이터를 정보로 변환하는 방법</span></div></div><div class=\"rc\"><div class=\"e\">and eventually into knowledge,</div><div class=\"k\">그리고 결국 지식으로,</div></div><div class=\"rc\"><div class=\"e\">which if exploited correctly</div><div class=\"k\">그리고 그것(= 지식)은 만약 올바르게 활용된다면</div></div><div class=\"rc\"><div class=\"e\">provides the capabilities</div><div class=\"k\">능력을 제공한다</div></div><div class=\"rc\"><div class=\"e\">to predict customers’ behaviour and business trends.</div><div class=\"k\">고객의 행동과 비즈니스 동향을 예측하는.</div></div><div class=\"rnat\">이러한 사실은 조직들이 직면하는 가장 큰 난제들 중 하나로 바뀐다. 즉, 그 난제란 미가공 데이터를 정보로 그리고 결국 지식으로 변환하는 방법이며, 이 지식은 만약 올바르게 활용된다면 고객의 행동과 비즈니스 동향을 예측하는 능력을 제공한다.</div><div class=\"rst\">그래서 진짜 숙제는 쌓인 시험지를 정리·공부법으로 <b>바꾸는</b> 방법이에요. 지문 8번이 요지예요. 그 능력이 다음 시험까지 내다보게 해 줘요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"competitive advantage\" data-m=\"경쟁 우위\"><b>competitive advantage</b>경쟁 우위</button><button type=\"button\" class=\"wdb\" data-w=\"rely on\" data-m=\"~에 의존하다\"><b>rely on</b>~에 의존하다</button><button type=\"button\" class=\"wdb\" data-w=\"extract\" data-m=\"추출하다, 뽑아내다\"><b>extract</b>추출하다, 뽑아내다</button><button type=\"button\" class=\"wdb\" data-w=\"exploit\" data-m=\"활용하다, 이용하다\"><b>exploit</b>활용하다, 이용하다</button><button type=\"button\" class=\"wdb\" data-w=\"by and large\" data-m=\"대체로\"><b>by and large</b>대체로</button><button type=\"button\" class=\"wdb\" data-w=\"raw\" data-m=\"가공되지 않은, 날것의\"><b>raw</b>가공되지 않은, 날것의</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>첫 문장의 비유</b>와 <b>마지막 문장의 결론</b>이 같은 말을 하는지 보면 잡혀요. 3·5번에서 두 중심주의를 <b>belief</b>(믿음)로 정의하고, 1·9번이 그 믿음이 과거를 <b>잘못 판단하게</b> 만든다고 말해요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 비유로 화제 제시</span><div class=\"en\">Twin sirens hide in the sea of history, tempting those … onto the reefs of <mark>misunderstanding and misinterpretation</mark>.</div><p class=\"ko\">역사의 바다에는 두 가지의 사이렌이 숨어 … <mark>오해와 오역</mark>의 암초 위로 유혹한다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>자기 시대 중심주의 = 내 시대가 최고라는 믿음</span><span><em>5번</em>자기 민족 중심주의 = 내 문화가 최고라는 믿음</span><span><em>7~8번</em>둘이 합쳐 남을 내 기준으로 판단 → 오해·잘못된 인식</span></div><div class=\"ck-eq\">⇒ 두 위험의 정체 = ‘내 것이 최고’라는 믿음(belief)</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 결론</span><div class=\"en\">Temporocentrism and ethnocentrism tempt moderns into <mark>unjustified criticisms</mark> of the peoples of the past.</div><p class=\"ko\">자기 시대 중심주의와 자기 민족 중심주의는 현대인들을 과거의 민족들에 대한 <mark>정당하지 않은 비판</mark>으로 끌어들인다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">beliefs that cause biased interpretations of the past 과거에 대한 편향된 해석을 낳는 믿음<small>3·5번 belief(믿음) + 1번 misinterpretation(오역)·9번 unjustified criticisms(정당하지 않은 비판)를 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">historians' efforts to advocate their own culture 자국 문화를 옹호하려는 역사가들의 노력</span><span class=\"why\">[지문에 없음] 5번 ‘내 문화가 최고’와 비슷해 보이지만, 그건 역사가의 노력이 아니라 누구나 빠지는 위험한 믿음이에요. 9번은 그 믿음이 과거를 잘못 비판하게 한다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">distinct differences in the ways of recording history 역사를 기록하는 방식의 뚜렷한 차이</span><span class=\"why\">[지문에 없음] 역사를 어떻게 기록하는지는 한 번도 안 나와요. 지문은 과거를 바라보는 사람의 믿음을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">universal features discovered in different cultures 여러 문화에서 발견되는 보편적 특징</span><span class=\"why\">[반대] 문화끼리 같은 점을 찾는 글이 아니에요. 6번은 오히려 다른 모든 문화가 inferior(열등하다)고 보는 믿음을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">pros and cons of two cross-cultural perspectives 두 문화 간 관점의 장단점</span><span class=\"why\">[지문에 없음] 2번에서 두 중심주의를 twin dangers(두 가지의 위험)라고만 해요. 장점은 하나도 없고, 8번도 관점이 완전히 없어진다는 단점뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Twin sirens hide</div><div class=\"k\">두 가지의 사이렌이 숨어 있다</div></div><div class=\"rc\"><div class=\"e\">in the sea of history,</div><div class=\"k\">역사의 바다에는,</div></div><div class=\"rc\"><div class=\"e\">tempting those</div><div class=\"k\">그리고 그것들(= 두 사이렌)은 사람들을 유혹한다</div></div><div class=\"rc\"><div class=\"e\">seeking to understand and appreciate the past</div><div class=\"k\">과거를 이해하고 제대로 인식하려고 노력하는</div></div><div class=\"rc ckc\"><div class=\"e\">onto the reefs of <span class=\"cw\">misunderstanding and misinterpretation</span>.</div><div class=\"k\"><span class=\"cw\">오해와 오역</span>의 암초 위로.</div></div><div class=\"rnat\">역사의 바다에는 두 가지의 사이렌이 숨어 있는데, 그것들은 과거를 이해하고 제대로 인식하려고 노력하는 사람들을 오해와 오역의 암초 위로 유혹한다.</div><div class=\"rst\">사회 시간에 옛날 사람·다른 나라 사람 영상을 보면 마음속 유혹 두 개가 우리를 <b>오해</b>로 끌고 가요. = 지문 1번의 사이렌 비유예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">These twin dangers</div><div class=\"k\">이 두 가지의 위험은</div></div><div class=\"rc\"><div class=\"e\">are temporocentrism and ethnocentrism.</div><div class=\"k\">자기 시대 중심주의와 자기 민족 중심주의이다.</div></div><div class=\"rnat\">이 두 가지의 위험은 자기 시대 중심주의와 자기 민족 중심주의이다.</div><div class=\"rst\">그 두 유혹의 이름이 지문 2번에 나와요. 자기 시대 중심주의와 자기 민족 중심주의, 두 가지 <b>위험</b>이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\">Temporocentrism is <span class=\"cw\">the belief</span></div><div class=\"k\">자기 시대 중심주의는 <span class=\"cw\">믿음이다</span></div></div><div class=\"rc\"><div class=\"e\">that your times are the best</div><div class=\"k\">자신의 시대가 최고라는</div></div><div class=\"rc\"><div class=\"e\">of all possible times.</div><div class=\"k\">모든 가능한 시대 중에.</div></div><div class=\"rnat\">자기 시대 중심주의는 자신의 시대(자신이 살고 있는 시대)가 모든 가능한 시대 중에 최고라는 믿음이다.</div><div class=\"rst\">“스마트폰도 없던 옛날보다 지금이 무조건 최고지!” = 지문 3번, 내 시대가 최고라는 <b>믿음</b>(belief)이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">All other times are thus inferior.</div><div class=\"k\">따라서 다른 모든 시대는 열등하다.</div></div><div class=\"rnat\">따라서 다른 모든 시대는 열등하다.</div><div class=\"rst\">그러니 옛날 사람들은 다 뒤떨어졌다고 생각해 버려요. 지문 4번도 다른 모든 시대가 열등하다고 여긴대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\">Ethnocentrism is <span class=\"cw\">the belief</span></div><div class=\"k\">자기 민족 중심주의는 <span class=\"cw\">믿음이다</span></div></div><div class=\"rc\"><div class=\"e\">that your culture is the best</div><div class=\"k\">자신의 문화가 최고라는</div></div><div class=\"rc\"><div class=\"e\">of all possible cultures.</div><div class=\"k\">모든 가능한 문화 중에.</div></div><div class=\"rnat\">자기 민족 중심주의는 자신의 문화가 모든 가능한 문화 중에 최고라는 믿음이다.</div><div class=\"rst\">“우리나라 급식이 세계 최고지!” = 지문 5번, 내 문화가 최고라는 또 하나의 <b>믿음</b>이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">All other cultures are thus inferior.</div><div class=\"k\">따라서 다른 모든 문화는 열등하다.</div></div><div class=\"rnat\">따라서 다른 모든 문화는 열등하다.</div><div class=\"rst\">그러니 다른 나라 음식은 다 이상하다고 생각해 버려요. 지문 6번도 다른 모든 문화가 열등하다고 여긴대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Temporocentrism and ethnocentrism unite</div><div class=\"k\">자기 시대 중심주의와 자기 민족 중심주의는 결합하여</div></div><div class=\"rc\"><div class=\"e\">to cause individuals and cultures</div><div class=\"k\">개인과 문화가 ~하게 한다</div></div><div class=\"rc\"><div class=\"e\">to judge all other individuals and cultures</div><div class=\"k\">다른 모든 개인과 문화를 판단하도록</div></div><div class=\"rc\"><div class=\"e\">by the “superior” standards</div><div class=\"k\">'우월한' 기준에 의해</div></div><div class=\"rc\"><div class=\"e\">of their current culture.</div><div class=\"k\">그들(= 개인과 문화)의 현재 문화의.</div></div><div class=\"rnat\">자기 시대 중심주의와 자기 민족 중심주의는 결합하여 개인과 문화가 그들의 현재 문화의 '우월한' 기준에 의해 다른 모든 개인과 문화를 판단하게 한다.</div><div class=\"rst\">두 생각이 합쳐지면 영상 속 모든 사람을 ‘지금 우리 기준’으로만 재요. 지문 7번의 ‘우월한’ 기준이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">This leads to a total lack of perspective</div><div class=\"k\">이것은 관점의 완전한 결핍으로 이어진다</div></div><div class=\"rc\"><div class=\"e\">when dealing with past and / or foreign cultures</div><div class=\"k\">과거 및/또는 외국의 문화를 다룰 때</div></div><div class=\"rc\"><div class=\"e\">and a resultant misunderstanding and misappreciation</div><div class=\"k\">그리고 그 결과로서 생기는 오해와 잘못된 인식으로</div></div><div class=\"rc\"><div class=\"e\">of them.</div><div class=\"k\">그것들(= 과거 및/또는 외국의 문화)에 대한.</div></div><div class=\"rnat\">이것은 과거 및/또는 외국의 문화를 다룰 때 관점의 완전한 결핍과 그 결과로서 생기는 그것들(과거 및/또는 외국의 문화)에 대한 오해와 잘못된 인식으로 이어진다.</div><div class=\"rst\">그러면 옛날·외국 사람들 입장은 하나도 안 보이고 오해만 남아요. 지문 8번, 관점이 완전히 없어진다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">Temporocentrism and ethnocentrism</div><div class=\"k\">자기 시대 중심주의와 자기 민족 중심주의는</div></div><div class=\"rc\"><div class=\"e\">tempt moderns</div><div class=\"k\">현대인들을 끌어들인다</div></div><div class=\"rc ckc\"><div class=\"e\">into <span class=\"cw\">unjustified criticisms</span></div><div class=\"k\"><span class=\"cw\">정당하지 않은 비판으로</span></div></div><div class=\"rc\"><div class=\"e\">of the peoples of the past.</div><div class=\"k\">과거의 민족들에 대한.</div></div><div class=\"rnat\">자기 시대 중심주의와 자기 민족 중심주의는 현대인들을 과거의 민족들에 대한 정당하지 않은 비판으로 끌어들인다.</div><div class=\"rst\">결국 “옛날 사람들 진짜 바보 같아” 하고 <b>부당한 비판</b>을 하게 돼요. 지문 9번 결론, <b>정당하지 않은 비판</b>(unjustified criticisms)이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"reef\" data-m=\"암초\"><b>reef</b>암초</button><button type=\"button\" class=\"wdb\" data-w=\"misinterpretation\" data-m=\"오역, 잘못된 해석\"><b>misinterpretation</b>오역, 잘못된 해석</button><button type=\"button\" class=\"wdb\" data-w=\"inferior\" data-m=\"열등한, 하등의\"><b>inferior</b>열등한, 하등의</button><button type=\"button\" class=\"wdb\" data-w=\"superior\" data-m=\"우월한, 뛰어난\"><b>superior</b>우월한, 뛰어난</button><button type=\"button\" class=\"wdb\" data-w=\"perspective\" data-m=\"관점\"><b>perspective</b>관점</button><button type=\"button\" class=\"wdb\" data-w=\"unjustified\" data-m=\"정당하지 못한\"><b>unjustified</b>정당하지 못한</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">안내문 일치는 <b>선택지 순서 = 안내문 순서</b>예요. 하나씩 대조하면서 <b>시간·층수·금액·부정어</b>처럼 단어 하나로 갈리는 곳을 확인하세요. 정답 ③은 7번과 8번을 <b>it</b>(그것)으로 이어야 완성돼요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>4번 날짜·시간</span><span><em>②</em>5번 장소(층수)</span><span><em>③</em>7~8번 활동 내용</span><span><em>④</em>10~11번 등록비</span><span><em>⑤</em>12번 문의 방법</span></div><div class=\"ck-eq\">⇒ 선택지 다섯 개가 안내문 순서대로 한 군데씩 걸려 있어요</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><span class=\"lab\">③ 차례 · 7번 문장</span><div class=\"en\">1. <mark>Write your own poem</mark>.</div><p class=\"ko\">1. <mark>여러분 자신만의 시를 창작할 것입니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>it(그것) = 7번에서 쓴 your own poem(자신만의 시)</span></div><div class=\"ck-step key\"><span class=\"lab\">③ 차례 · 8번 문장 (결정적 단서)</span><div class=\"en\">2. <mark>Read it aloud</mark> to the other participants.</div><p class=\"ko\">2. 그것(= 여러분이 쓴 시)을 다른 참가자들에게 <mark>낭독할 것입니다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>10번 $10(10달러)만 보고 고르면 걸려요. 18일까지 내면 할인돼요</span></div><div class=\"ck-step\"><span class=\"lab\">④ 차례 · 11번 문장 (함정)</span><div class=\"en\">※ Register on or before September 18 and <mark>pay only $7</mark>.</div><p class=\"ko\">※ 9월 18일이나 그 전에 등록하세요 그리고 <mark>7달러만 내세요</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">참가자는 자신이 창작한 시를 낭독할 것이다.<small>7번 Write your own poem(자신의 시를 쓴다) + 8번 Read it aloud(그것을 낭독한다)와 같아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\
