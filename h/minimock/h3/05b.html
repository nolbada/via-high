<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){

u Age", "g": "나이가 들수록 세부 사항을 기억하는 것이 더 어려워지는 이유", "ok": false, "e": ["나이가 들면서 세부 사항을 기억하기 어려워진다는 내용은 글에 없습니다."]}], "tr": ["일반화는 인지 경제성을 촉진하여 (그 결과) 우리는 중요하지 않은 세부 사항에 집중하지 않는다.", "위대한 러시아 신경 심리학자 Alexander Luria는 우리가 보통 듣는 것의 (a)반대인 기억 장애를 가진 Solomon Shereshevsky라는 환자를 연구했는데, Solomon은 기억 상실증, 기억을 잃는 것을 가지지 않았다. 그는 Luria가 기억 과잉증이라고 부르는 것을 가졌다(우리는 그의 엄청난 힘이 우월한 기억력이라고 말할 수 있다).", "그의 과한 기억력은 그가 단 한 번 들었던 연설을 한마디 한마디, 혹은 복잡한 수학 공식, 긴 숫자 배열, 그리고 그가 말할 수 없는 외국어로 된 시를 반복하는 것과 같이 놀라운 재주를 수행할 수 있게 했다.", "당신이 그런 환상적인 기억력을 가지는 것이 좋겠다고 생각하기 전에, 이것은 (b)대가를 수반했다. Solomon은 그가 모든 세부 사항을 별개의 것으로 기억했기 때문에 추상화를 할 수 없었다.", "그는 특히 사람들을 알아보는 데 어려움이 있었다.", "신경인지적 관점에서 당신이 어떤 얼굴을 볼 때마다 그것이 저번과 적어도 조금 다르게 보일 가능성은 (c)없다(→ 있다). 당신은 그것을 이전과 다른 각도와 거리에서 보고 다른 표정을 마주하고 있을지도 모른다.", "당신이 어떤 사람과 상호 작용을 하는 동안 그들의 얼굴에는 일련의 표정이 지나간다.", "당신의 뇌는 (d)일반화할 수 있기 때문에 당신은 얼굴의 이 모든 다른 표현들을 같은 사람에게 속한 것으로 본다.", "Solomon은 그것을 할 수 없었다.", "그가 Luria에게 설명했듯이 ‘모든 사람은 너무 많은 얼굴을 가지기’ 때문에 그의 친구와 동료를 (e)알아보는 것은 거의 불가능했다."], "ps": [{"n": 1, "ch": [{"e": "<b>Generalization<\/b> promotes <b>cognitive economy<\/b>,", "k": "일반화는 인지 경제성을 촉진한다,"}, {"e": "so that we don’t focus on <b>particulars<\/b>", "k": "그래서 우리는 세부 사항에 집중하지 않는다"}, {"e": "that don’t matter.", "k": "중요하지 않은."}], "link": "일반화는 인지 경제성을 촉진하여, 그 결과 우리는 중요하지 않은 세부 사항에 집중하지 않는다.", "easy": "일반화를 하면 머리를 아껴 쓸 수 있어서, 중요하지 않은 작은 부분에 신경 쓰지 않게 된다는 거예요.", "gist": "글의 출발점이에요. 일반화는 쓸모 있는 능력이에요."}, {"n": 2, "ch": [{"e": "The great Russian neuropsychologist Alexander Luria", "k": "위대한 러시아 신경 심리학자 Alexander Luria는"}, {"e": "studied a patient, Solomon Shereshevsky,", "k": "Solomon Shereshevsky라는 환자를 연구했다,"}, {"e": "with a memory <b>impairment<\/b>", "k": "기억 장애를 가진"}, {"e": "that was the (a) <b>opposite<\/b> of what we usually hear about", "k": "우리가 보통 듣는 것의 (a) 반대인"}, {"e": "— Solomon didn’t have <b>amnesia<\/b>, the loss of memories;", "k": "— Solomon은 기억 상실증, 즉 기억을 잃는 것을 가지지 않았다;"}, {"e": "he had what Luria called hypermnesia", "k": "그<span class=\"r\">(= Solomon)<\/span>는 Lu const $=s=>document.querySelector(s);
const app=$('#app');
let view='home',quiz=null,armed=null;
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();

  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

다. '무엇이 우리를 남과 구별짓는지에 대해'라는 뜻이다.", "sub": ["S: what (무엇이)", "V: sets ~ apart (set apart 구별짓다)", "O: us (우리를)"]}, {"t": "<b>as mechanical processes have replicated behaviors and talents ...</b>은 <b>as절</b>이다. '~함에 따라'라는 뜻이다. 참고: 때·이유가 겹치는 '~하면서/~함에 따라'로 읽는다.", "sub": ["S: mechanical processes (기계적 공정, mechanical 기계적인, process 공정)", "V: have replicated (replicate 복제하다)", "O: behaviors and talents (행동과 재능들, talent 재능)"]}, {"t": "<b>we thought were unique to humans</b>는 behaviors and talents를 꾸미는 관계절이다. 앞에 <b>주격 관계대명사가 생략</b>되어 있고 we thought는 삽입절이다.", "sub": ["behaviors and talents (that) we thought were unique to humans = 우리가 인간에게만 고유하다고 생각했던 행동과 재능", "unique to ~에게만 고유한"]}], "sum": "기계가 인간 고유의 능력을 복제하며, 우리는 인간다움에 대한 생각을 바꿔야 했음"}, {"i": "04", "q": "08", "s": "3", "title": "S+V+C + 대시 삽입절 + 관계절 병렬", "eng": "Each step of surrender<sup>1</sup> / — we are not the only mind<sup>2</sup> that can play chess, fly a plane, make music, or invent<sup>3</sup> a mathematical law<sup>4</sup> — / will be painful and sad.", "notes": [["1", "surrender", "내어줌, 항복"], ["2", "mind", "지성, 사고하는 존재"], ["3", "invent", "고안하다, 발명하다"], ["4", "mathematical law", "수학 법칙"]], "lit": "그렇게 내어 주는 각 단계는 / — 우리가 체스를 두고, 비행기를 조종하고, 음악을 만들고, 수학 법칙을 고안할 수 있는 유일한 지성이 아니라는 것 — / 고통스럽고 슬플 것이다.", "nat": "체스를 두고 비행기를 조종하고 음악을 만들고 수학 법칙을 고안할 수 있는 존재가 우리뿐이 아니라는 것 — 그렇게 하나씩 내어 주는 단계마다 고통스럽고 슬플 것이다.", "ana": "대시 두 개 사이에 문장 하나가 통째로 들어가 주어 <b>Each step of surrender</b>와 동사 <b>will be</b>를 갈라놓았다. 대시 사이를 지우고 읽으면 뼈대가 곧바로 보인다. 삽입된 절 안의 <b>that</b>은 the only mind를 꾸미는 주격 관계대명사이고, 그 안에서 조동사 can에 걸린 <b>play, fly, make, invent</b> 네 개의 동사원형이 나란히 <b>병렬</b>을 이룬다. 세 번째까지는 콤마로 잇고 마지막만 or로 묶는 것이 영어의 나열 방식이다.", "pe": "Each step \u0001of surrender<sup>1</sup>\u0002 / — \u0001we are not the only mind<sup>2</sup> that can play chess, fly a plane, make music, or invent<sup>3</sup> a mathematical law<sup>4</sup>\u0002 — / will be painful and sad.", "pk": "\u0001그렇게 내어 주는\u0002 각 단계는 / — \u0001우리가 체스를 두고, 비행기를 조종하고, 음악을 만들고, 수학 법칙을 고안할 수  when을 강조해 '정확히 언제'가 된다. 두 절을 잇는 <b>but</b>이 '어렵다'와 '분명하다'를 정면으로 맞세운다.", "pe": "\u0001Obviously\u0002, / it is difficult to determine<sup>1</sup> \u0001just\u0002 when any story becomes a myth<sup>2</sup>, / but it is clear / that a narrative<sup>3</sup> is not a myth / \u0001when it is first told\u0002.", "pk": "\u0001분명히\u0002, / 어떤 이야기가 정확히 언제 신화가 되는지를 알아내기는 어렵다, / 그러나 분명한 것은 / 이야기가 신화가 아니라는 점이다 / \u0001그것이 처음 전해질 때에는\u0002.", "core": "알아내기는 어렵지만, 이야기가 신화가 아니라는 점은 분명하다.", "tags": ["Obviously = 부사: 문장 전체 꾸밈", "<b>가주어 It</b> + 동사 is + 보어 difficult. 진주어 to determine ~ (목적어 의문사절). just = 부사: when 꾸밈", "<b>but</b> + 가주어 it + is + 보어 clear (SVC)", "<b>진주어 that절</b>: a narrative is not a myth", "<b>when절</b> = 부사절(시간): is not a myth 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)가 but으로 두 번 이어진</b> 문장이다. 가주어 it 구문이 두 번 나와서 길어 보인다."}, {"t": "앞 절의 뼈대부터 찾는다.", "sub": ["S: it (가주어)", "V: is (be ~이다)", "C: difficult (어려운)", "진주어: to determine just when any story becomes a myth (어떤 이야기가 정확히 언제 신화가 되는지 알아내는 것)", "뼈대 = <b>it is difficult to determine ~</b>", "Obviously 분명히, determine 알아내다, myth 신화"]}, {"t": "determine의 목적어 <b>just when any story becomes a myth</b>는 <b>의문사절(명사절)</b>이다. when절이 없으면 determine의 대상이 비기 때문이다.", "sub": ["S any story, V becomes C a myth — 2형식", "just 정확히"]}, {"t": "but 뒤 절의 뼈대는 다음과 같다.", "sub": ["S: it (가주어)", "V: is (be ~이다)", "C: clear (분명한)", "진주어: that a narrative is not a myth when it is first told (이야기가 처음 전해질 때에는 신화가 아니라는 것)", "narrative 이야기"]}, {"t": "진주어 that절 안의 <b>when it is first told</b>는 <b>시간 부사절</b>이다. it = a narrative (이야기)이다. (tell 전하다, is told 전해지다)"}], "sum": "이야기가 언제 신화가 되는지는 불분명, 처음엔 신화가 아님은 분명"}, {"i": "06", "q": "10", "s": "1", "title": "의문사절 주어 S+V+O, and 가주어 it ~ that절", "eng": "Exactly how cicadas<sup>1</sup> keep track of<sup>2</sup> time / has always intrigued<sup>3</sup> researchers, / and it has always been assumed / that the insects must rely on<sup>4</sup> an internal clock<sup>5</sup>.", "notes": [["1", "cicada", "매미"], ["2" "pk": "그의 과도하게 강력한 기억력은 그가 놀라운 재주를 부릴 수 있게 해 주었다, / \u0001단 한 번만 들었던 연설을 한마디 한마디 그대로 되풀이하는 것 같은\u0002, / \u0001혹은 복잡한 수학 공식, 긴 숫자 배열\u0002, / \u0001그리고 그가 말할 줄도 모르는 외국어로 된 시 같은 재주 말이다\u0002.", "core": "그의 기억력은 그가 재주를 부릴 수 있게 해 주었다.", "tags": ["주어 memory + 동사 allowed + 목적어 him + 보어 to perform ~ (SVOC). supercharged, amazing = 형용사", "<b>such as</b> ~ = 전치사구(형용사구): feats 꾸밈 (예시 나열). word for word = 부사구: repeating 꾸밈. that he had heard = 관계절: speeches 꾸밈", "or ~ = 예시 나열 이어짐 (formulas, sequences). of numbers = 형용사구: sequences 꾸밈", "and poems ~ = 예시 나열의 마지막. in foreign languages = 형용사구: poems 꾸밈. he didn't even speak = 관계절(생략): languages 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식, allow A to V)</b>이다. 예시와 관계절이 길게 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: His supercharged memory (그의 엄청난 기억력, supercharged 과도하게 강력한, memory 기억력)", "V: allowed (allow 허락하다, 가능하게 하다의 과거형)", "O: him (그를)", "C: to perform amazing feats (놀라운 재주를 부리도록, perform 수행하다, feat 재주/위업)", "뼈대 = <b>His supercharged memory allowed him to perform amazing feats</b>", "'기억력 덕분에 그가 ~할 수 있었다'로 읽으면 자연스럽다."]}, {"t": "<b>such as</b> 뒤는 amazing feats의 <b>예시</b>이다.", "sub": ["repeating speeches word for word (연설을 한마디 한마디 되풀이하는 것, repeat 되풀이하다, speech 연설, word for word 한마디씩)", "that he had heard only once는 speeches를 꾸미는 관계절이다 (only once 단 한 번)"]}, {"t": "or 뒤 <b>complex mathematical formulas, long sequences of numbers, and poems in foreign languages</b>는 repeating의 목적어에 이어지는 나열이다.", "sub": ["complex 복잡한, formula 공식, sequence 배열, poem 시", "languages 뒤에는 목적격 관계대명사가 생략되어 'he didn't even speak'가 languages를 꾸민다"]}, {"t": "함정: that he had heard는 바로 앞 word for word가 아니라 멀리 떨어진 speeches를 꾸민다."}], "sum": "엄청난 기억력으로 한 번 들은 연설·공식·숫자·외국어 시까지 되풀이"}, {"i": "08", "q": "11", "s": "8", "title": "이유 Because절 + S+V+O + as+전치사구", "eng": "Because your brain can generalize<sup>1</sup>, / you see all of these different manifestations<sup>2</sup> of the face / as belonging to<sup>3</sup> the same person.", "notes": [["1", "generalize", "일반화하다"], ["2", "manifestation", "나타남, 발현"], ["3", "belong to", "~에 속하다"]], "lit": "당신의 뇌가 일반화할 수 있기 때문에, / 당신은 얼굴의 이 모든 서로 다른 나타남을 본다 / 같은 사람에게 속하는 것으로.", "nat": "당신의 뇌가 일반화를 할 수 있기 때문에, 당신은 얼굴의 이 모든 다른 모습을 같은 사람의 것으로 본다.", "ana": "<b>see A as B</b>는 'A를 B로 여기다, B로 보다'라는 짝을 이루는 표현이다. 목적어 A가 길어지면 as가 한참 뒤에 나오므로, see가 보이면 as를 미리 찾아 두는 편이 낫다. <b>as</b>는 여기서 접속사가 아니라 <b>전치사</b>이므로 뒤에 동사원형이 올 수 없고 <b>동명사 belonging</b>이 왔다. 문두의 <b>Because</b>절은 원인을, 주절은 그 결과를 나타내며, 이 문장이 곧 앞 사례(Solomon)와 보통 사람의 차이를 가르는 지점이다.", "pe": "\u0001Because your brain can generalize<sup>1</sup>\u0002, / you see all of these \u0001different\u0002 manifestations<sup>2</sup> \u0001of the face\u0002 / \u0001as belonging to<sup>3</sup> the same person\u0002.", "pk": "\u0001당신의 뇌가 일반화할 수 있기 때문에\u0002, / 당신은 \u0001얼굴의\u0002 이 모든 서로 \u0001다른\u0002 나타남을 본다 / \u0001같은 사람에게 속하는 것으로\u0002.", "core": "당신은 이 모든 모습을 본다.", "tags": ["<b>Because절</b> = 이유 부사절: 주절 꾸밈", "주어 you + 동사 see + 목적어 manifestations. different = 형용사. of the face = 형용사구: manifestations 꾸밈", "<b>see A as B</b> = 3형식 + 전치사구. as belonging to ~ = 전치사구(부사구): see 꾸밈 (as B는 보어 아님). to the same person: belonging 꾸밈 [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>이유 부사절 + S+V+O(3형식)</b>이다. 목적어가 길고 as 전치사구가 뒤에 붙어 길어 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: you (당신)", "V: see (see 보다)", "O: all of these different manifestations of the face (얼굴의 이 모든 서로 다른 나타남, manifestation 나타남/모습, face 얼굴)", "뼈대 = <b>you see all of these different manifestations of the face</b>"]}, {"t": "뒤의 <b>as belonging to the same person</b>은 <b>see A as B (A를 B로 보다)</b>의 as 전치사구이다. 문형 기준: see/regard A as B류는 3형식 + as 전치사구이다.", "sub": ["as는 전치사이므로 뒤에 동명사 belonging이 왔다 (belong to ~에 속하다)", "same person 같은 사람"]}, {"t": "맨 앞의 <b>Because your brain can generalize</b>는 <b>이유의 부사절</b>이다. 빼도 주절이 완결되므로 부사절이다.", "sub": ["S: your brain (당신의 뇌, brain 뇌)", "V: can generalize (generalize 일반화하다)"]}], "sum": "뇌가 일반화하므로, 서로 다른 얼굴 모습을 한 사람의 것으로 봄"}], "qs": [{"q": "07", "type": "빈칸", "src": "2017학년도 9월 33번", "ans": "②", "tr": [["1", "작업 기억에 저장된 정보의 상당 부분은, 특히 그 정보가 언어에 기반을 둘 때, 청각적 형태로 부호화된다."], ["2", "예를 들어 Conrad의 초기 연구에서는 성인 참가자들에게 여섯 글자로 된 배열을 보여 주었는데, 글자는 4분의 3초 간격으로 한 번에 하나씩 시각적으로 제시되었다."], ["3", "배열의 마지막 글자가 제시되자마자 참가자들은 자신이 본 여섯 글자를 모두 적었고, 쉽게 떠오르지 않는 글자는 추측으로 채웠다."], ["4", "사람들이 글자를 틀리게 기억해 냈을 때, 자신이 봤다고 말한 글자는 ______________이라는 측면에서 실제 자극과 닮아 있을 가능성이 더 컸다."], ["5", "예를 들어 글자 F는 청각적으로 비슷한 글자 S로 131번 '기억되었지만' 시각적으로 비슷한 글자 P로는 겨우 14번 기억되었다."], ["6", "마찬가지로 글자 V는 B로 56번 기억되었지만 X로는 겨우 5번 기억되었다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "For example, the letter F was \"remembered\" as the auditorially similar letter S 131 times but as the visually similar letter P only 14 times."}, {"en": false, "h": "빈칸 문항은 <b>빈칸 뒤의 예시가 무엇을 증명하는가</b>로 푼다. 5~6번 문장의 숫자가 전부 같은 말을 한다 — <b>소리가 비슷한</b> 글자로 착각한 횟수(131번, 56번)가 <b>모양이 비슷한</b> 글자로 착각한 횟수(14번, 5번)를 압도한다. 즉 잘못 기억한 글자는 생김새가 아니라 <b>소리</b>에서 실제 자극을 닮아 있었다. 이것은 1번 문장의 '작업 기억은 <b>청각적 형태</b>로 부호화된다'는 주제를 그대로 뒷받침한다."}], "opts": [{"n": "①", "t": "그 글자들이 어떻게 시각적으로 표현되었는지", "a": false, "x": true, "trap": false, "e": "5~6번 문장의 숫자는 <b>시각적으로 비슷한 글자</b> 쪽이 훨씬 <b>적었음</b>을 보여 준다. 결론을 정반대로 뒤집은 선택지다."}, {"n": "②", "t": "그 글자들이 어떻게 보였는지보다 어떻게 소리 났는지", "a": true, "x": false, "trap": false, "e": "auditorially similar가 131번·56번, visually similar가 14번·5번이라는 대비를 그대로 문장으로 옮긴 것이다. 1번 문장의 auditory form과도 맞물린다."}, {"n": "③", "t": "그 글자 연속의 길이가 어떻게 인식되었는지", "a": false, "x": true, "trap": false, "e": "글자 수는 여섯으로 <b>고정</b>되어 있었다. 길이가 변수로 다뤄진 적이 없다."}, {"n": "④", "t": "그 글자들이 어떻게 발음되었는지보다 어떻게 배열되었는지", "a": false, "x": true, "trap": true, "e": "소리와 순서를 견주었는데, 실험이 다룬 대비는 <b>소리 vs 모양</b>이다. 게다가 두 항의 앞뒤가 정답과 <b>뒤집혀</b> 있다."}, {"n": "⑤", "t": "그 글자들이 얼마나 오래 보였는지보다 얼마나 자주 나타났는지", "a": false, "x": true, "trap": false, "e": "제시 간격(4분의 3초)은 조건일 뿐이고, 빈도나 노출 시간을 비교한 자료는 나오지 않는다."}], "w": [["a good deal of", "많은 양의"], ["working memory", "작업 기억"], ["encode A in B", "A를 B로 부호화하다"], ["auditory", "청각적인"], ["sequence", "배열, 연속"], ["at intervals of", "~의 간격으로"], ["participant", "참가자"], ["guess at", "~을 추측하다"], ["recall", "기억해 내다"], ["resemble", "~을 닮다"], ["stimuli", "자극들"], ["in terms of", "~의 측면에서"]]}, {"q": "08", "type": "빈칸", "src": "2018학년도 수능 34번", "ans": "①", "tr": [["1", "지난 60년 동안 기계 공정이 인간에게만 있다고 여겼던 행동과 재능을 복제해 오면서, 우리는 무엇이 인간을 특별하게 만드는지에 대한 생각을 바꿔야 했다."], ["2", "더 많은 종류의 인공 지능을 만들어 낼수록, 우리는 인간에게만 고유하다고 여겨지던 것을 더 많이 내주도록 강요받을 것이다."], ["3", "체스를 두고 비행기를 조종하고 음악을 만들고 수학 법칙을 고안할 수 있는 존재가 우리뿐이 아니라는 것 — 그렇게 하나씩 내어 주는 단계마다 고통스럽고 슬플 것이다."], ["4", "우리는 앞으로 30년을, 어쩌면 다음 한 세기를 영구적인 정체성 위기 속에서 보내며 인간이 대체 무엇에 쓸모가 있는지 스스로에게 계속 물을 것이다."], ["5", "우리가 유일무이한 도구 제작자도, 예술가도, 도덕 윤리학자도 아니라면, 대체 무엇이 우리를 특별하게 만드는가?"], ["6", "가장 큰 아이러니는, 일상적이고 실용적인 인공 지능의 가장 큰 이점이 생산성 증대도, 풍요의 경제도, 과학을 하는 새로운 방식도 아니라는 점이다 — 물론 그런 일도 모두 일어나겠지만."], ["7", "인공 지능이 도래해 얻는 가장 큰 이점은 ______________이라는 것이다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "We'll spend the next three decades — indeed, perhaps the next century — in a permanent identity crisis, continually asking ourselves what humans are good for."}, {"en": false, "h": "빈칸이 <b>맨 마지막 문장</b>에 있으면 앞 문단 전체가 근거다. 이 글은 처음부터 끝까지 같은 질문 하나를 되풀이한다 — <b>무엇이 인간을 인간이게 하는가</b>. 1번 문장의 what sets us apart, 4번 문장의 what humans are good for, 5번 문장의 what makes us special이 모두 그 질문이다. 6번 문장이 생산성·풍요·과학이라는 뻔한 답을 <b>미리 지워 준다</b>. 그러므로 남는 것은 인공 지능이 우리로 하여금 <b>인간성을 정의하게</b> 도와준다는 것뿐이다."}], "opts": [{"n": "①", "t": "인공 지능이 인간성을 정의하는 데 도움을 줄 것이다", "a": true, "x": false, "trap": false, "e": "1·4·5번 문장이 던진 '인간이란 무엇인가'라는 질문에 대한 답이며, 6번 문장이 실용적 이점을 모두 배제한 뒤 남는 유일한 자리다."}, {"n": "②", "t": "인간도 인공 지능과 같아질 수 있다", "a": false, "x": true, "trap": false, "e": "글은 인간과 AI가 <b>같아진다</b>고 말하지 않는다. AI가 흉내 내는 만큼 인간의 정의가 <b>좁혀져 왔다</b>는 이야기다."}, {"n": "③", "t": "인간이 고된 노동에서 해방될 것이다", "a": false, "x": true, "trap": true, "e": "생산성이나 노동 해방은 6번 문장이 '가장 큰 이점이 <b>아니다</b>'라며 직접 제외한 항목이다."}, {"n": "④", "t": "인공 지능이 도덕적 딜레마를 해결하는 데 우리를 이끌 수 있다", "a": false, "x": true, "trap": false, "e": "moral ethicists는 5번 문장에서 '우리가 유일한 존재가 아닐지도 모른다'는 예로 나올 뿐, AI가 도덕 문제를 해결한다는 말은 없다."}, {"n": "⑤", "t": "인공 지능이 인간 지능의 쇠퇴를 보상할 수 있다", "a": false, "x": true, "trap": false, "e": "인간 지능이 <b>쇠퇴한다</b>는 전제 자체가 글에 없다. 정체성 위기는 능력 저하가 아니라 <b>고유성 상실</b>의 문제다."}], "w": [["replicate", "복제하다, 모사하다"], ["unique to", "~에 고유한"], ["set A apart", "A를 구별짓다"], ["surrender", "내주다, 항복하다"], ["supposedly", "추정컨대"], ["permanent", "영속적인"], ["identity crisis", "정체성 위기"], ["moral ethicist", "도덕 윤리학자"], ["utilitarian", "실용적인"], ["abundance", "풍요"], ["liberate", "해방하다"], ["compensate for", "~을 보상하다"]]}, {"q": "09", "type": "요약문 완성", "src": "2014학년도 6월 B형 40번", "ans": "①", "tr": [["1", "이야기는 처음 전해질 때에는 신화가 아니라 그저 하나의 이야기나 설명일 뿐이다."], ["2", "이야기를 신화로 만드는 것은 그것이 특정한 사회에 받아들여진다는 사실, 그리고 그 사회가 그것의 전파에 참여한다는 사실이다."], ["3", "어떤 이야기가 정확히 언제 신화가 되는지 알아내기는 어렵지만, 이야기가 처음 전해지는 시점에는 그것이 신화가 아니라는 점만은 분명하다."], ["4", "최초의 서술자와 마지막 서술자의 의도가 같을 수는 있지만, 그렇다고 해서 신화의 창작자에게 어떤 특별한 지위가 주어지지는 않는다."], ["5", "이야기를 전파하는 특정 사회의 의도가 그 작자의 목적과 아무 상관이 없을 수도 있다는 점을 깨닫는 것이 훨씬 더 중요하다."], ["6", "따라서 우리는 신화의 개별 창작자를 결코 확인해 낼 수 없다."], ["7", "신화가 정의상 집단적인 이야기인 한, 유일하게 중요한 고려 사항은 그 신화를 신화로 삼는 사회의 사고방식과 목적이다."], ["8", "→ 신화의 (A) 집단적인 특성을 고려할 때, 이야기는 그 작자의 의도와 상관없이 특정 사회가 그것을 받아들이고 (B) 전파할 때에만 신화가 된다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "So long as myth is a collective narrative by definition, the only relevant consideration are the mentality and purposes of the society for which the myth is a myth."}, {"en": false, "h": "요약문 문항은 <b>빈칸 두 개가 각각 어느 문장에서 오는가</b>를 따로 찾는다. (A)는 6번 문장의 <b>individual creator</b>를 부정하고 7번 문장이 <b>collective narrative</b>라고 못박은 대목에서 온다. (B)는 2번 문장의 <b>transmission</b>과 5번 문장의 <b>transmitting a narrative</b>가 같은 낱말을 두 번 던져 준다. 요약문에 '받아들이고(accepts) ~한다'가 나란히 있으므로, 2번 문장의 received와 participates in its transmission을 그대로 옮기면 된다."}], "opts": [{"n": "①", "t": "collective(집단적인) …… transmits(전파하다)", "a": true, "x": false, "trap": false, "e": "(A)는 7번 문장의 collective narrative, (B)는 2번 문장의 transmission에서 그대로 온다. 두 자리가 모두 원문의 낱말과 맞물린다."}, {"n": "②", "t": "creative(창조적인) …… distributes(분배하다)", "a": false, "x": true, "trap": false, "e": "글은 오히려 <b>개별 창작자를 지울 수 없다</b>고 말한다. creative는 정반대 방향이고, distributes는 물건을 나눠 주는 뜻이라 이야기의 전승과 결이 다르다."}, {"n": "③", "t": "mental(정신적인) …… modernizes(현대화하다)", "a": false, "x": true, "trap": false, "e": "mentality라는 낱말이 7번 문장에 있어 끌리지만, 그것은 <b>사회의 사고방식</b>이지 신화의 성격이 아니다. 현대화는 글에 없다."}, {"n": "④", "t": "primitive(원시적인) …… circulates(순환시키다)", "a": false, "x": true, "trap": false, "e": "신화를 원시적이라고 규정한 대목은 없다. circulates는 전파와 가까워 보이지만 (A)가 이미 틀렸다."}, {"n": "⑤", "t": "social(사회적인) …… evaluates(평가하다)", "a": false, "x": true, "trap": true, "e": "social은 collective와 얼추 비슷해 보이지만, 글이 강조하는 것은 '사회적'이 아니라 <b>개인이 아닌 집단</b>이라는 대조다. 게다가 사회가 이야기를 <b>평가한다</b>는 말은 없다."}], "w": [["narrative", "이야기, 서사"], ["account", "(있었던 일에 대한) 설명"], ["given society", "특정한 사회"], ["transmission", "전파, 전달"], ["determine", "알아내다"], ["narrator", "서술자"], ["status", "지위"], ["have nothing to do with", "~와 아무 관련이 없다"], ["identify", "확인하다"], ["so long as", "~하는 한"], ["by definition", "정의상"], ["mentality", "사고방식, 정신"]]}, {"q": "10", "type": "문장 삽입", "src": "2015학년도 수능 38번", "ans": "③", "tr": [["1", "[주어진 문장] 연구자들은 그 곤충들이 뿌리를 먹고 사는 복숭아나무가 노출되는 햇빛의 기간을 늘림으로써 이 일이 일어나게 했다."], ["2", "매미가 정확히 어떻게 시간을 추적하는지는 늘 연구자들의 호기심을 자극해 왔고, 이 곤충이 체내 시계에 의존할 것이라고 여겨져 왔다."], ["3", "그러나 최근에 캘리포니아에서 17년 매미를 연구하는 한 과학자 집단이 애벌레가 외부의 신호를 이용하며 수를 셀 수 있다고 시사했다."], ["4", "( ① ) 실험을 위해 그들은 15년 묵은 애벌레를 잡아 실험용 구역으로 옮겼다."], ["5", "( ② ) 이 애벌레들은 성체로 나타나기까지 2년이 더 걸렸어야 했지만, 사실은 1년밖에 걸리지 않았다."], ["6", "( ③ ) 이렇게 함으로써 그 나무들은 속아서 그해에 평소의 한 번이 아니라 두 번 꽃을 피웠다."], ["7", "( ④ ) 나무의 개화는 그 곤충들이 먹고 사는 수액의 아미노산 농도가 최고조에 이르는 시기와 일치한다."], ["8", "( ⑤ ) 그러므로 매미는 그 최고조의 횟수를 세어 시간을 추적하는 것으로 보인다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "( ③ ) By doing this, the trees were \"tricked\" into flowering twice during the year rather than the usual once."}, {"en": false, "h": "삽입 문항은 <b>지시어가 가리킬 것이 앞에 있는가</b>로 자리를 정한다. 주어진 문장의 <b>this</b>는 '애벌레가 1년 만에 성체가 된 일', 곧 ②번 뒤 문장의 결과를 받는다. 그리고 ③번 뒤 문장이 다시 <b>By doing this</b>로 시작하는데, 이 if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
const CMAP={"07-2": [["074", "수동태"], ["029", "3형식 · 4형식"]], "07-3": [["072", "분사구문"], ["093", "접속사 as"]], "08-1": [["085", "관계대명사 what"], ["093", "접속사 as"]], "08-3": [["078", "관계대명사"], ["037-H1", "병렬 구조"]], "09-3": [["091", "가주어 It + that절"], ["039", "명사절 접속사 that"]], "10-1": [["091", "가주어 It + that절"], ["094", "간접의문문"]], "11-3": [["030", "5형식"], ["037-H1", "병렬 구조"]]};
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  const cc=(CMAP[c.q+'-'+c.s]||[]);
  const back=encodeURIComponent(location.origin+location.pathname);
  let x='<div class="sc open"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='<div class="fin"><b>자연스러운 해석</b>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm)x+='<div class="fin"><b>한 줄 정리</b>'+esc(sm)+'</div>';
  x+='</div></div>';
  return x;
}

    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}

function renderNote(){

}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
