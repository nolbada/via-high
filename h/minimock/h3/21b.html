var EXP={"07": "<div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞의 <b>But</b>(그러나)이 방향을 뒤집어요. 5번 <b>인간과 무관한 자연</b>을 뒤집고, 7번 <b>사자가 어디서 먹을지는 사람이 정한다</b>를 한 줄로 묶는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (6번)</span><div class=\"en\"><mark>But</mark> the context for ecological interactions <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\"><mark>그러나</mark> 생태적 상호 작용의 맥락은 ( ? )</p></div><div class=\"ck-via\"><i>▼</i><span>But(그러나) 앞에는 “자연은 사람과 상관없이 돌아간다”가 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · But이 뒤집을 내용</span><div class=\"en\">Ecological relationships certainly have their own logic … ‘nature’ can be seen to have a self-regulating but not necessarily stable dynamic <mark>independent of human intervention</mark>.</div><p class=\"ko\">생태적 관계는 분명 그 나름의 논리를 가지며, ‘자연’은 <mark>인간의 개입과 무관한</mark> 자기 조절적 역동성을 가진 것으로 볼 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 바로 뒤에서 사자 예시로 빈칸을 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">We may not determine how or what a lion eats but we certainly can <mark>regulate</mark> <mark>where the lion feeds</mark>.</div><p class=\"ko\">우리는 사자가 어떻게, 무엇을 먹는지는 결정하지 못해도, <mark>그 사자가 어디서 먹이를 먹는지는</mark> 분명히 <mark>통제할 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>7번 앞</em>무엇을·어떻게 먹나 = 자연이 정함</span><span><em>7번 뒤</em>어디서 먹나 = 사람이 정함</span></div><div class=\"ck-eq\">⇒ 먹이를 먹는 ‘무대(맥락)’는 사람이 정한다 = 정답 ②</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">점점 더 인간에 의해 설정되어 왔다<small>7번 regulate where the lion feeds(사자가 어디서 먹을지 통제한다)를 한 줄로 묶은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">다양한 자연 조건의 영향을 받아 왔다</span><span class=\"why\">5번의 “자연 스스로의 논리”를 그대로 이어 간 말이에요. 빈칸 앞 But(그러나)은 방향을 뒤집으니, 자연이 아니라 사람 쪽 말이 와야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">새로운 환경 친화적 정책을 뒷받침해 왔다</span><span class=\"why\">정책 이야기는 지문에 없어요. 7번은 사람이 환경을 돕는다는 게 아니라, 사자가 먹는 장소를 사람이 정한다는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">창의적인 문화적 관행을 불러일으킨다</span><span class=\"why\">1번 cultural(문화적)을 따온 말이에요. 빈칸은 생태적 상호 작용의 맥락을 “누가 정하느냐”를 묻는 자리이고, 7번의 답은 사람이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">너무 자주 바뀌어 통제할 수 없다</span><span class=\"why\">7번과 정반대예요. 7번은 can regulate(통제할 수 있다)라고 분명히 말했어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Concepts of nature</div><div class=\"k\">자연에 대한 개념은</div></div><div class=\"rc\"><div class=\"e\">are always cultural statements.</div><div class=\"k\">언제나 문화적 진술이다.</div></div><div class=\"rnat\">자연에 대한 개념은 언제나 문화적 진술이다.</div><div class=\"rst\">가족과 사파리 동물원에 갔어요. 우리가 ‘자연’이라 부르는 것에도 사람 생각이 담겨 있어요. = 지문 1번, 자연 개념은 늘 문화적 진술.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This may not strike Europeans</div><div class=\"k\">이것(= 자연 개념이 문화적 진술이라는 것)은 유럽인들에게 느껴지지 않을 수도 있다</div></div><div class=\"rc\"><div class=\"e\">as much of an insight,</div><div class=\"k\">대단한 통찰로,</div></div><div class=\"rc\"><div class=\"e\">for Europe’s landscape</div><div class=\"k\">왜냐하면 유럽의 풍경은</div></div><div class=\"rc\"><div class=\"e\">is so much of a blend.</div><div class=\"k\">워낙 뒤섞여 있기 때문이다.</div></div><div class=\"rnat\">유럽인들에게는 이것이 그리 대단한 통찰로 느껴지지 않을 수도 있는데, 유럽의 풍경은 워낙 뒤섞여 있기 때문이다.</div><div class=\"rst\">동물원 숲 우리는 사람이 꾸민 것과 원래 숲이 섞여 구별이 잘 안 돼요. = 지문 2번, 유럽 풍경은 뒤섞여 있어 별 통찰로 안 느껴진다.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">But in the new worlds</div><div class=\"k\">그러나 새로운 세계에서는</div></div><div class=\"rc\"><div class=\"e\">— ‘new’ at least to Europeans —</div><div class=\"k\">— 적어도 유럽인들에게는 ‘새로운’ —</div></div><div class=\"rc\"><div class=\"e\">the distinction appeared much clearer</div><div class=\"k\">그 구별이 훨씬 더 뚜렷하게 보였다</div></div><div class=\"rc\"><div class=\"e\">not only to European settlers and visitors</div><div class=\"k\">유럽인 정착민과 방문객들에게뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">but also to their descendants.</div><div class=\"k\">그들(= 유럽인 정착민과 방문객들)의 후손들에게도.</div></div><div class=\"rnat\">그러나 새로운 세계 - 적어도 유럽인들에게는 '새로운' 세계 - 에서는 그 구별이 유럽인 정착민과 방문객뿐 아니라 그 후손들에게도 훨씬 더 뚜렷하게 보였다.</div><div class=\"rst\">그런데 처음 간 넓은 사파리 초원은 “사람 손 안 닿은 진짜 자연!”처럼 확 구별돼 보여요. = 지문 3번, 새로운 세계에선 구별이 더 뚜렷했다.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">For that reason,</div><div class=\"k\">그런 이유로,</div></div><div class=\"rc\"><div class=\"e\">they had the fond conceit</div><div class=\"k\">그들(= 유럽인 정착민과 방문객, 그 후손들)은 애틋한 관념을 가졌다</div></div><div class=\"rc\"><div class=\"e\">of primeval nature</div><div class=\"k\">원시 자연에 대한</div></div><div class=\"rc\"><div class=\"e\">uncontrolled by human associations</div><div class=\"k\">인간의 관여에 통제받지 않는</div></div><div class=\"rc\"><div class=\"e\">which could later find expression in</div><div class=\"k\">그리고 그것(= 그 애틋한 관념)은 나중에 ~로 표현될 수 있었다</div></div><div class=\"rc\"><div class=\"e\">an admiration for wilderness.</div><div class=\"k\">야생에 대한 동경으로.</div></div><div class=\"rnat\">그런 이유로 그들은 인간의 관여에 통제받지 않는 원시 자연이라는 애틋한 관념을 품었고, 이 관념은 나중에 야생에 대한 동경으로 표현될 수 있었다.</div><div class=\"rst\">그래서 사람이 손대지 않은 원시 자연을 동경하게 돼요. = 지문 4번, 원시 자연이라는 애틋한 관념이 야생에 대한 동경이 된다.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Ecological relationships certainly</div><div class=\"k\">생태적 관계는 분명</div></div><div class=\"rc\"><div class=\"e\">have their own logic</div><div class=\"k\">그것들(= 생태적 관계) 자신의 논리를 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">and in this sense</div><div class=\"k\">그리고 이런 의미에서</div></div><div class=\"rc\"><div class=\"e\">‘nature’ can be seen to have</div><div class=\"k\">‘자연’은 ~을 가진 것으로 볼 수 있다</div></div><div class=\"rc\"><div class=\"e\">a self-regulating but not necessarily stable dynamic</div><div class=\"k\">자기 조절적이지만 반드시 안정적이지는 않은 역동성을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">independent of human intervention</span>.</div><div class=\"k\"><span class=\"cw\">인간의 개입과 무관한</span>.</div></div><div class=\"rnat\">생태적 관계는 분명 그 나름의 논리를 가지고 있으며, 이런 의미에서 '자연'은 인간의 개입과 무관하게 자기 조절적이지만 반드시 안정적이지는 않은 역동성을 지닌 것으로 볼 수 있다.</div><div class=\"rst\">물론 사자가 사냥하고 먹는 방식은 사자 마음대로예요. = 지문 5번, 자연은 <b>인간의 개입과 무관한</b> 나름의 논리가 있다.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But</span> the context for ecological interactions</div><div class=\"k\"><span class=\"cw\">그러나</span> 생태적 상호 작용의 맥락은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">has increasingly been set by humanity</span>.</div><div class=\"k\"><span class=\"cw\">점점 더 인간에 의해 설정되어 왔다</span>. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">그러나 생태적 상호 작용의 맥락은 점점 더 인간에 의해 설정되어 왔다.</div><div class=\"rst\"><b>그러나</b>(But) 사자가 지낼 곳, 울타리 칠 곳은 사육사가 정해요. = 빈칸, 그 맥락은 점점 더 <b>인간이 정해 왔다</b>.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">We may not determine</div><div class=\"k\">우리는 결정하지 못할지도 모른다</div></div><div class=\"rc\"><div class=\"e\">how or what a lion eats</div><div class=\"k\">사자가 어떻게 또는 무엇을 먹는지는</div></div><div class=\"rc ckc\"><div class=\"e\">but we certainly can <span class=\"cw\">regulate</span></div><div class=\"k\">하지만 우리는 분명히 <span class=\"cw\">통제할 수 있다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">where the lion feeds</span>.</div><div class=\"k\"><span class=\"cw\">그 사자가 어디서 먹이를 먹는지는</span>.</div></div><div class=\"rnat\">우리는 사자가 어떻게 또는 무엇을 먹는지는 결정하지 못할지 몰라도, 사자가 어디서 먹이를 먹는지는 분명히 통제할 수 있다.</div><div class=\"rst\">사자가 무엇을 먹을지는 못 정해도 <b>어디서 먹을지</b>는 사람이 정해요. = 지문 7번, 빈칸을 사자 예시로 풀어 준 문장.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"distinction\" data-m=\"구별, 차이\"><b>distinction</b>구별, 차이</button><button type=\"button\" class=\"wdb\" data-w=\"primeval\" data-m=\"원시(시대)의\"><b>primeval</b>원시(시대)의</button><button type=\"button\" class=\"wdb\" data-w=\"wilderness\" data-m=\"야생(지), 황야\"><b>wilderness</b>야생(지), 황야</button><button type=\"button\" class=\"wdb\" data-w=\"self-regulating\" data-m=\"자기 조절적인\"><b>self-regulating</b>자기 조절적인</button><button type=\"button\" class=\"wdb\" data-w=\"intervention\" data-m=\"개입\"><b>intervention</b>개입</button><button type=\"button\" class=\"wdb\" data-w=\"regulate\" data-m=\"통제하다, 조절하다\"><b>regulate</b>통제하다, 조절하다</button></div>", "08": "<div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>첫 문장</b>에 있으면 뒤에서 같은 말을 되풀이하는 문장을 찾으세요. 4번 <b>strikingly similar</b>(놀랄 만큼 비슷하다)가 바로 빈칸의 다른 말이에요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">Research with human runners <mark>challenged conventional wisdom</mark> and found that the ground-reaction forces at the foot and the shock transmitted up the leg … <span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> as runners moved from extremely compliant to extremely hard running surfaces.</div><p class=\"ko\">연구는 <mark>통념에 이의를 제기했고</mark>, 지면이 아주 말랑한 곳에서 아주 단단한 곳으로 바뀌어도 발과 다리의 충격이 ( ? )는 것을 발견했다</p></div><div class=\"ck-via\"><i>▼</i><span>주자가 지면에 맞춰 다리를 바꾸는 방법을 설명해요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 그 이유</span><div class=\"en\">This view suggests that runners create <mark>soft legs</mark> that soak up impact forces when they are running on very hard surfaces and <mark>stiff legs</mark> when they are moving along on yielding terrain.</div><p class=\"ko\">주자들은 아주 단단한 지면에서는 충격을 흡수하는 <mark>부드러운 다리를</mark>, 푹 꺼지는 지형에서는 <mark>뻣뻣한 다리를</mark> 만든다.</p></div><div class=\"ck-via\"><i>▼</i><span>As a result(그 결과)로 빈칸을 같은 뜻으로 되풀이해요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">As a result, impact forces passing through the legs are <mark>strikingly similar</mark> over a wide range of running surface types.</div><p class=\"ko\">그 결과, 다리를 통과하는 충격력은 아주 다양한 지면 유형에 걸쳐 <mark>놀랄 만큼 비슷하다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>콘크리트든 모래든 다리에 오는 충격은 같다고 다시 말해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 한 번 더 확인</span><div class=\"en\">Contrary to popular belief, running on concrete is <mark>not more damaging</mark> to the legs than running on soft sand.</div><p class=\"ko\">일반적인 믿음과는 달리, 콘크리트 위를 달리는 것이 부드러운 모래 위를 달리는 것보다 다리에 <mark>더 해롭지 않다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">거의 달라지지 않았다<small>4번 strikingly similar(놀랄 만큼 비슷하다)·5번 not more damaging(더 해롭지 않다)과 같은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">크게 줄어들었다</span><span class=\"why\">3번 soak up(흡수하다)만 보고 충격이 줄었다고 착각하기 쉬워요. 4번은 줄었다가 아니라 지면이 달라도 similar(비슷하다)라고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">갑자기 정점을 찍었다</span><span class=\"why\">단단한 바닥에서 충격이 치솟는다는 건 1번이 이의를 제기한 conventional wisdom(통념) 쪽 생각이에요. 5번도 콘크리트가 더 해롭지 않다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">점차 나타났다</span><span class=\"why\">2번 gradually(점차)를 따온 함정이에요. 점차 생긴 건 연구자들의 믿음이지, 다리에 오는 충격이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">거의 발생하지 않았다</span><span class=\"why\">충격이 없다는 게 아니에요. 3번은 흡수해야 할 impact forces(충격력)가 있다고 했고, 4번은 그 크기가 비슷하다고 했어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Research with human runners</div><div class=\"k\">인간 주자들을 대상으로 한 연구는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">challenged conventional wisdom</span></div><div class=\"k\"><span class=\"cw\">통념에 이의를 제기했다</span></div></div><div class=\"rc\"><div class=\"e\">and found that</div><div class=\"k\">그리고 ~라는 것을 발견했다</div></div><div class=\"rc\"><div class=\"e\">the ground-reaction forces at the foot</div><div class=\"k\">발에 가해지는 지면 반력과</div></div><div class=\"rc\"><div class=\"e\">and the shock transmitted up the leg</div><div class=\"k\">다리를 타고 올라가 전달되는 충격이</div></div><div class=\"rc\"><div class=\"e\">and through the body</div><div class=\"k\">그리고 몸을 통과해 (전달되는)</div></div><div class=\"rc\"><div class=\"e\">after impact with the ground</div><div class=\"k\">지면과 충돌한 뒤에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">varied little</span></div><div class=\"k\"><span class=\"cw\">거의 달라지지 않았다는 것을</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">as runners moved</div><div class=\"k\">주자들이 옮겨 갈 때</div></div><div class=\"rc\"><div class=\"e\">from extremely compliant</div><div class=\"k\">극도로 말랑말랑한 (지면)에서</div></div><div class=\"rc\"><div class=\"e\">to extremely hard running surfaces.</div><div class=\"k\">극도로 단단한 달리기 지면으로.</div></div><div class=\"rnat\">인간 주자들을 대상으로 한 연구는 통념에 이의를 제기했고, 발에 가해지는 지면 반력과 지면과 충돌한 뒤 다리를 타고 올라가 몸 전체로 전달되는 충격이, 주자들이 극도로 말랑말랑한 달리기 지면에서 극도로 단단한 달리기 지면으로 옮겨 가도 거의 달라지지 않았다는 것을 발견했다.</div><div class=\"rst\">체육 쌤은 딱딱한 바닥에서 뛰면 다리가 더 아프다고 했지만, 실험해 보니 바닥이 달라도 충격은 <b>거의 같았어요</b>. = 지문 1번, 통념 뒤집기.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">As a result,</div><div class=\"k\">그 결과,</div></div><div class=\"rc\"><div class=\"e\">researchers gradually began to believe</div><div class=\"k\">연구자들은 점차 믿기 시작했다</div></div><div class=\"rc\"><div class=\"e\">that runners are subconsciously able</div><div class=\"k\">주자들이 잠재의식적으로 ~할 수 있다고</div></div><div class=\"rc\"><div class=\"e\">to adjust leg stiffness</div><div class=\"k\">다리의 뻣뻣함을 조절할</div></div><div class=\"rc\"><div class=\"e\">prior to foot strike</div><div class=\"k\">발이 땅에 닿기 전에</div></div><div class=\"rc\"><div class=\"e\">based on their perceptions</div><div class=\"k\">그들(= 주자들)의 인식에 근거해서</div></div><div class=\"rc\"><div class=\"e\">of the hardness or stiffness of the surface</div><div class=\"k\">지면의 단단함이나 뻣뻣함에 대한</div></div><div class=\"rc\"><div class=\"e\">on which they are running.</div><div class=\"k\">그들(= 주자들)이 그 위를 달리고 있는 (지면).</div></div><div class=\"rnat\">그 결과, 연구자들은 주자들이 자신이 달리고 있는 지면의 단단함이나 뻣뻣함에 대한 인식에 근거해서, 발이 땅에 닿기 전에 잠재의식적으로 다리의 뻣뻣함을 조절할 수 있다고 점차 믿기 시작했다.</div><div class=\"rst\">그래서 연구자들은 우리가 발이 닿기 전에 바닥을 느끼고 다리 힘을 알아서 맞춘다고 믿게 됐어요. = 지문 2번.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This view suggests</div><div class=\"k\">이 견해는 시사한다</div></div><div class=\"rc ckc\"><div class=\"e\">that runners create <span class=\"cw\">soft legs</span></div><div class=\"k\">주자들이 <span class=\"cw\">부드러운 다리를</span> 만든다는 것을</div></div><div class=\"rc\"><div class=\"e\">that soak up impact forces</div><div class=\"k\">충격력을 흡수하는</div></div><div class=\"rc\"><div class=\"e\">when they are running on very hard surfaces</div><div class=\"k\">그들(= 주자들)이 아주 단단한 지면을 달리고 있을 때는</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">stiff legs</span></div><div class=\"k\">그리고 <span class=\"cw\">뻣뻣한 다리를</span> (만든다는 것을)</div></div><div class=\"rc\"><div class=\"e\">when they are moving along</div><div class=\"k\">그들(= 주자들)이 따라 움직이고 있을 때는</div></div><div class=\"rc\"><div class=\"e\">on yielding terrain.</div><div class=\"k\">푹 꺼지는 지형 위를.</div></div><div class=\"rnat\">이 견해는 주자들이 아주 단단한 지면을 달리고 있을 때는 충격력을 흡수하는 부드러운 다리를 만들고, 푹 꺼지는 지형을 따라 움직이고 있을 때는 뻣뻣한 다리를 만든다는 것을 시사한다.</div><div class=\"rst\">딱딱한 강당 바닥에선 <b>부드러운 다리</b>(soft legs)로, 푹신한 모래에선 단단한 다리로 뛰어요. = 지문 3번, 다리를 바꿔 충격을 맞춘다.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">As a result,</div><div class=\"k\">그 결과,</div></div><div class=\"rc\"><div class=\"e\">impact forces passing through the legs</div><div class=\"k\">다리를 통과하는 충격력은</div></div><div class=\"rc ckc\"><div class=\"e\">are <span class=\"cw\">strikingly similar</span></div><div class=\"k\"><span class=\"cw\">놀랄 만큼 비슷하다</span></div></div><div class=\"rc\"><div class=\"e\">over a wide range of running surface types.</div><div class=\"k\">아주 다양한 달리기 지면 유형에 걸쳐.</div></div><div class=\"rnat\">그 결과, 다리를 통과하는 충격력은 아주 다양한 달리기 지면 유형에 걸쳐 놀랄 만큼 비슷하다.</div><div class=\"rst\"><b>그 결과</b>(As a result) 어느 바닥에서 뛰어도 다리에 오는 충격은 <b>놀랄 만큼 비슷해요</b>. = 빈칸을 다시 말한 지문 4번.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Contrary to popular belief,</div><div class=\"k\">일반적인 믿음과는 달리,</div></div><div class=\"rc\"><div class=\"e\">running on concrete</div><div class=\"k\">콘크리트 위를 달리는 것이</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">not more damaging</span> to the legs</div><div class=\"k\">다리에 <span class=\"cw\">더 해롭지 않다</span></div></div><div class=\"rc\"><div class=\"e\">than running on soft sand.</div><div class=\"k\">부드러운 모래 위를 달리는 것보다.</div></div><div class=\"rnat\">일반적인 믿음과는 달리, 콘크리트 위를 달리는 것이 부드러운 모래 위를 달리는 것보다 다리에 더 해롭지 않다.</div><div class=\"rst\">그러니 학교 앞 시멘트 길을 뛰어도 모래사장보다 다리가 더 상하지 않아요. = 지문 5번, 콘크리트가 모래보다 더 해롭지 않다.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"conventional wisdom\" data-m=\"통념\"><b>conventional wisdom</b>통념</button><button type=\"button\" class=\"wdb\" data-w=\"compliant\" data-m=\"말랑말랑한, 유연한\"><b>compliant</b>말랑말랑한, 유연한</button><button type=\"button\" class=\"wdb\" data-w=\"subconsciously\" data-m=\"잠재의식적으로\"><b>subconsciously</b>잠재의식적으로</button><button type=\"button\" class=\"wdb\" data-w=\"soak up\" data-m=\"흡수하다, 빨아들이다\"><b>soak up</b>흡수하다, 빨아들이다</button><button type=\"button\" class=\"wdb\" data-w=\"yielding terrain\" data-m=\"푹 꺼지는 지형\"><b>yielding terrain</b>푹 꺼지는 지형</button><button type=\"button\" class=\"wdb\" data-w=\"strikingly\" data-m=\"놀랄 만큼\"><b>strikingly</b>놀랄 만큼</button></div>", "09": "<div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서는 <b>고리</b>를 찾는 문제. 지시어 <b>This</b>(이것) → 예시 질문(<b>for instance</b> 예를 들어)에 대한 답 → 부정 연결어 <b>Nor</b>(~도 아니다) 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝 (1번)</span><div class=\"en\">Traditionally, Kuhn claims, the primary goal of historians of science was ‘to clarify and deepen an understanding of contemporary scientific methods or concepts <mark>by displaying their evolution</mark>’.</div><p class=\"ko\">전통적으로 과학사가들의 주된 목표는 현재의 과학적 방법이나 개념의 <mark>발전 과정을 보여 줌으로써</mark> 그 이해를 깊게 하는 것이었다.</p></div><div class=\"ck-via\"><i>▼</i><span>This(이것) = 주어진 글의 “발전 과정을 보여 주는 일”</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) 4번 · 첫 번째 고리</span><div class=\"en\"><mark>This</mark> entailed relating the progressive accumulation of breakthroughs and discoveries.</div><p class=\"ko\"><mark>이것</mark>은 획기적 발전과 발견의 점진적 축적을 서술하는 일을 수반했다.</p></div><div class=\"ck-via\"><i>▼</i><span>however(그러나)로 전통적 관점의 “결함” 이야기가 시작돼요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 6번 · 화제 전환</span><div class=\"en\">In the mid-1950s, however, <mark>a number of faults</mark> in this view of history became apparent.</div><p class=\"ko\">그러나 1950년대 중반에, 이러한 역사관의 <mark>여러 결함이</mark> 분명해졌다.</p></div><div class=\"ck-via\"><i>▼</i><span>for instance(예를 들어)로 첫 번째 결함을 질문으로 던져요</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 7번 · (B)의 끝</span><div class=\"en\">Closer analysis of scientific discoveries, <mark>for instance</mark>, led historians to ask whether the dates of discoveries and their discoverers can be identified precisely.</div><p class=\"ko\"><mark>예를 들어</mark>, 과학적 발견을 면밀히 분석하자 발견의 날짜와 발견자를 정확히 특정할 수 있는지 묻게 되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>7번 질문(정확히 특정할 수 있나?)에 “못 한다”고 답해요</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) 2번 · 두 번째 고리</span><div class=\"en\">Some discoveries seem to entail numerous phases and discoverers, <mark>none of which can be identified</mark> as definitive.</div><p class=\"ko\">어떤 발견들은 수많은 단계와 발견자들을 수반하는데, <mark>그중 어느 것도 특정될 수 없다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Nor(~도 아니다)는 앞에 결함 지적((A)의 Furthermore(게다가))이 나온 뒤에만 와요</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) 8번 · 세 번째 고리</span><div class=\"en\"><mark>Nor</mark> does the traditional view recognise the role that non-intellectual factors … play in scientific developments.</div><p class=\"ko\">전통적 관점은 비지성적 요인들이 과학의 발전에서 하는 <mark>역할을 인정하지도 않는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(B) – (A) – (C)<small>This(이것) → 예시 질문과 답 → Nor(~도 아니다), 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">(B) 끝 7번 질문(날짜·발견자를 특정할 수 있나?)의 답인 (A)가 바로 안 와요. 또 (C) 9번 Most importantly(무엇보다 중요한 것은)는 마지막 결함인데 그 뒤에 (A)가 오면 어색해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글은 전통적 목표만 소개했는데, 바로 (A)의 “특정할 수 없다”는 결함이 튀어나와요. (B) This(이것)도 주어진 글과 멀어져요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C) Nor(~도 아니다)는 앞에 부정적 지적이 있어야 해요. 주어진 글은 목표를 소개만 해서 부정이 이어질 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">Nor(~도 아니다)가 첫 자리에 와서 어긋나요. 또 (B) This(이것)가 “비지성적 요인”을 가리키게 돼 뜻이 안 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Traditionally, Kuhn claims,</div><div class=\"k\">전통적으로, Kuhn이 주장하기를,</div></div><div class=\"rc\"><div class=\"e\">the primary goal of historians of science was</div><div class=\"k\">과학사가들의 주된 목표는 ~이었다</div></div><div class=\"rc\"><div class=\"e\">‘to clarify and deepen an understanding</div><div class=\"k\">‘이해를 명확히 하고 깊게 하는 것</div></div><div class=\"rc\"><div class=\"e\">of contemporary scientific methods or concepts</div><div class=\"k\">현재의 과학적 방법이나 개념에 대한</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">by displaying their evolution</span>’.</div><div class=\"k\">그것들(= 현재의 과학적 방법이나 개념)의 <span class=\"cw\">발전 과정을 보여 줌으로써</span>’.</div></div><div class=\"rnat\">【주어진 글】 전통적으로, Kuhn이 주장하기를, 과학사가들의 주된 목표는 '현재의 과학적 방법이나 개념의 발전 과정을 보여 줌으로써 그것들에 대한 이해를 명확히 하고 깊게 하는 것'이었다.</div><div class=\"rst\">스마트폰 역사 숙제에서 옛날 방식은 “지금 폰이 어떻게 <b>발전해 왔나</b>”를 보여 주는 거였어요. = 지문 1번, 전통적 과학사가의 목표.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">2번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A) Some discoveries seem to entail</div><div class=\"k\">(A) 어떤 발견들은 수반하는 것으로 보인다</div></div><div class=\"rc\"><div class=\"e\">numerous phases and discoverers,</div><div class=\"k\">수많은 단계와 발견자들을,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">none of which can be identified</span></div><div class=\"k\">그런데 <span class=\"cw\">그중 어느 것도 특정될 수 없다</span></div></div><div class=\"rc\"><div class=\"e\">as definitive.</div><div class=\"k\">확정적인 것으로.</div></div><div class=\"rnat\">(A) 어떤 발견들은 수많은 단계와 발견자들을 수반하는 것으로 보이는데, 그중 어느 것도 확정적인 것으로 특정될 수 없다.</div><div class=\"rst\">실제로 어떤 발명은 여러 단계와 여러 사람을 거쳐서, 누구 하나를 ‘최초’로 못 박을 수 없어요. = 지문 2번, 7번 질문의 답.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">Furthermore,</div><div class=\"k\">게다가,</div></div><div class=\"rc\"><div class=\"e\">the evaluation of past discoveries and discoverers</div><div class=\"k\">과거의 발견과 발견자를 평가하는 것은</div></div><div class=\"rc\"><div class=\"e\">according to present-day standards</div><div class=\"k\">오늘날의 기준에 따라</div></div><div class=\"rc\"><div class=\"e\">does not allow us to see</div><div class=\"k\">우리가 알 수 없게 한다</div></div><div class=\"rc\"><div class=\"e\">how significant they may have been</div><div class=\"k\">그것들(= 과거의 발견과 발견자)이 얼마나 중요했을지를</div></div><div class=\"rc\"><div class=\"e\">in their own day.</div><div class=\"k\">그 당시에.</div></div><div class=\"rnat\">게다가 과거의 발견과 발견자를 오늘날의 기준에 따라 평가하는 것은 그것들이 그 당시에 얼마나 중요했을지를 우리가 알 수 없게 한다.</div><div class=\"rst\"><b>게다가</b>(Furthermore) 지금 기준으로 옛 폰을 평가하면, 그때 얼마나 대단했는지 놓쳐요. = 지문 3번.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">This</span> entailed</div><div class=\"k\">(B) <span class=\"cw\">이것</span>(= 과학적 방법이나 개념의 발전 과정을 보여 주는 일)은 수반했다</div></div><div class=\"rc\"><div class=\"e\">relating the progressive accumulation</div><div class=\"k\">점진적 축적을 서술하는 일을</div></div><div class=\"rc\"><div class=\"e\">of breakthroughs and discoveries.</div><div class=\"k\">획기적 발전과 발견의.</div></div><div class=\"rnat\">(B) 이것은 획기적 발전과 발견의 점진적 축적을 서술하는 일을 수반했다.</div><div class=\"rst\"><b>이것</b>(This)은 새 기능과 발명이 하나씩 쌓여 온 걸 차례로 적는 일이었어요. = 지문 4번, 점진적 축적을 서술하기.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Only that which survived</div><div class=\"k\">살아남은 것만이</div></div><div class=\"rc\"><div class=\"e\">in some form in the present</div><div class=\"k\">현재에 어떤 형태로든</div></div><div class=\"rc\"><div class=\"e\">was considered relevant.</div><div class=\"k\">유의미하다고 여겨졌다.</div></div><div class=\"rnat\">현재에 어떤 형태로든 살아남은 것만이 유의미하다고 여겨졌다.</div><div class=\"rst\">지금 폰에 남아 있는 기능만 중요하다고 쳤어요. 사라진 기능은 빼 버렸죠. = 지문 5번, 현재에 살아남은 것만 유의미.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">In the mid-1950s, however,</div><div class=\"k\">그러나 1950년대 중반에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a number of faults</span></div><div class=\"k\"><span class=\"cw\">여러 결함이</span></div></div><div class=\"rc\"><div class=\"e\">in this view of history</div><div class=\"k\">이러한 역사관의</div></div><div class=\"rc\"><div class=\"e\">became apparent.</div><div class=\"k\">분명해졌다.</div></div><div class=\"rnat\">그러나 1950년대 중반에 이러한 역사관의 여러 결함이 분명해졌다.</div><div class=\"rst\"><b>그러나</b>(however) 1950년대 중반, 이런 역사 보기에 <b>여러 결함</b>이 보이기 시작했어요. = 지문 6번.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Closer analysis of scientific discoveries,</div><div class=\"k\">과학적 발견에 대한 더 면밀한 분석은,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">for instance</span>,</div><div class=\"k\"><span class=\"cw\">예를 들어</span>,</div></div><div class=\"rc\"><div class=\"e\">led historians to ask</div><div class=\"k\">역사가들로 하여금 묻게 했다</div></div><div class=\"rc\"><div class=\"e\">whether the dates of discoveries and their discoverers</div><div class=\"k\">발견의 날짜와 그것들(= 발견들)의 발견자들이 ~인지</div></div><div class=\"rc\"><div class=\"e\">can be identified precisely.</div><div class=\"k\">정확하게 특정될 수 있는지.</div></div><div class=\"rnat\">예를 들어, 과학적 발견에 대한 더 면밀한 분석은 역사가들로 하여금 발견의 날짜와 그 발견자들이 정확하게 특정될 수 있는지를 묻게 했다.</div><div class=\"rst\"><b>예를 들어</b>(for instance) “터치 화면은 정확히 언제, 누가 발명했지?” 하고 따지면 딱 답하기 어려워요. = 지문 7번.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">Nor</span> does the traditional view recognise the role</div><div class=\"k\">(C) 전통적 관점은 또한 역할을 <span class=\"cw\">인정하지도 않는다</span></div></div><div class=\"rc\"><div class=\"e\">that non-intellectual factors,</div><div class=\"k\">비지성적 요인들이,</div></div><div class=\"rc\"><div class=\"e\">especially institutional and socio-economic ones,</div><div class=\"k\">특히 제도적·사회 경제적인 것들(= 요인들)이,</div></div><div class=\"rc\"><div class=\"e\">play in scientific developments.</div><div class=\"k\">과학의 발전에서 하는 (역할).</div></div><div class=\"rnat\">(C) 전통적 관점은 또한 비지성적 요인, 특히 제도적·사회 경제적 요인이 과학의 발전에서 하는 역할도 인정하지 않는다.</div><div class=\"rst\">옛날 방식은 회사 사정이나 돈 문제 같은 비지성적 요인의 역할도 인정하지 <b>않아요</b>(Nor). = 지문 8번, 또 하나의 결함.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Most importantly, however,</div><div class=\"k\">그러나 무엇보다 중요한 것은,</div></div><div class=\"rc\"><div class=\"e\">the traditional historian of science</div><div class=\"k\">전통적인 과학사가는</div></div><div class=\"rc\"><div class=\"e\">seems blind to the fact</div><div class=\"k\">사실을 보지 못하는 것 같다는 점이다</div></div><div class=\"rc\"><div class=\"e\">that the concepts, questions and standards</div><div class=\"k\">개념, 질문, 기준이</div></div><div class=\"rc\"><div class=\"e\">that they use to frame the past</div><div class=\"k\">그들(= 전통적인 과학사가들)이 과거를 틀 짓는 데 사용하는</div></div><div class=\"rc\"><div class=\"e\">are themselves subject to historical change.</div><div class=\"k\">그 자체가 역사적 변화의 영향을 받는다는.</div></div><div class=\"rnat\">그러나 무엇보다 중요한 것은, 전통적인 과학사가는 그들이 과거를 틀 짓는 데 사용하는 개념, 질문, 기준 그 자체가 역사적 변화의 영향을 받는다는 사실을 보지 못하는 것 같다는 점이다.</div><div class=\"rst\"><b>무엇보다</b>(Most importantly) 역사를 정리하는 사람의 기준조차 시대에 따라 바뀐다는 걸 못 봐요. = 지문 9번, 가장 큰 결함.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"entail\" data-m=\"수반하다\"><b>entail</b>수반하다</button><button type=\"button\" class=\"wdb\" data-w=\"progressive accumulation\" data-m=\"점진적 축적\"><b>progressive accumulation</b>점진적 축적</button><button type=\"button\" class=\"wdb\" data-w=\"breakthrough\" data-m=\"획기적 발전\"><b>breakthrough</b>획기적 발전</button><button type=\"button\" class=\"wdb\" data-w=\"fault\" data-m=\"결함, 흠\"><b>fault</b>결함, 흠</button><button type=\"button\" class=\"wdb\" data-w=\"definitive\" data-m=\"확정적인, 결정적인\"><b>definitive</b>확정적인, 결정적인</button><button type=\"button\" class=\"wdb\" data-w=\"non-intellectual\" data-m=\"비지성적인\"><b>non-intellectual</b>비지성적인</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>핵심 화제</b>부터 잡으세요. <b>months in the future</b>(몇 달 뒤)는 시간 이야기이니, 시간으로 쪼개는 5번 뒤, <b>Another</b>(또 다른) 앞이 자리예요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 핵심 화제</span><div class=\"en\">It may be easier to reach an agreement when settlement terms don’t have to be implemented <mark>until months in the future</mark>.</div><p class=\"ko\">합의 조건이 <mark>향후 몇 개월까지</mark> 이행될 필요가 없을 때 합의에 도달하는 것이 더 쉬울 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>“몇 달 뒤 시행” = 여기서 말한 시간 지평(언제 효력이 생기나)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · 앞 문장 (④ 바로 앞)</span><div class=\"en\">When working to fractionate issues of principle or precedent, parties may use <mark>the time horizon</mark> (<mark>when the principle goes into effect</mark> or how long it will last) as a way to fractionate the issue.</div><p class=\"ko\">원칙이나 관례의 쟁점을 세분화할 때, 당사자들은 <mark>시간 지평</mark>(<mark>원칙이 언제 효력을 발휘하는지</mark>, 얼마나 오래 지속될지)을 쓸 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>Another(또 다른)는 시간 방법 설명이 다 끝난 뒤에야 나올 수 있어요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 뒤 문장 (④ 바로 뒤)</span><div class=\"en\"><mark>Another approach</mark> is to vary the number of ways that the principle may be applied.</div><p class=\"ko\"><mark>또 다른 접근법은</mark> 원칙이 적용될 수 있는 방법의 수를 다양화하는 것이다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>원칙 쟁점은 시간(언제부터·얼마나)으로 쪼갠다</span><span><em>주어진 문장</em>몇 달 뒤에 시행하면 합의가 쉽다</span><span><em>6번</em>또 다른 방법: 적용 방법의 수 바꾸기</span></div><div class=\"ck-eq\">⇒ 시간 방법 → 그 효과 → 또 다른 방법, 고리가 다 맞는 자리 = ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">5번 문장과 6번 문장 사이<small>5번 time horizon(시간 지평)의 효과를 말하고, 6번 Another(또 다른)로 다음 방법이 이어져요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">4번은 센트·달러처럼 숫자로 쪼개는 예시예요. 시간으로 쪼개는 방법(5번)이 나오기도 전에 “몇 달 뒤 시행”이 먼저 튀어나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">2번 살라미 전술 소개 뒤엔 3번 “정량적 쟁점은 쪼개기 쉽다”가 바로 이어져야 해요. 시간 이야기는 아직 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번 “숫자 단위 쟁점”과 4번 For example(예를 들어) 센트·달러 예시는 짝이라 끊으면 안 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">6번 “적용 방법의 수 바꾸기”와 7번 For example(예를 들어) 휴가 계획 예시가 짝이에요. 시간 이야기는 6번 Another(또 다른) 앞에서 끝났어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">It may be easier</div><div class=\"k\">더 쉬울 수 있다</div></div><div class=\"rc\"><div class=\"e\">to reach an agreement</div><div class=\"k\">합의에 도달하는 것이</div></div><div class=\"rc\"><div class=\"e\">when settlement terms</div><div class=\"k\">합의 조건이 ~할 때</div></div><div class=\"rc\"><div class=\"e\">don’t have to be implemented</div><div class=\"k\">이행될 필요가 없을</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">until months in the future</span>.</div><div class=\"k\"><span class=\"cw\">향후 몇 개월까지</span>.</div></div><div class=\"rnat\">【주어진 문장】 합의 조건이 향후 몇 개월까지 이행될 필요가 없을 때 합의에 도달하는 것이 더 쉬울 수 있다.</div><div class=\"rst\">〈주어진 문장〉 용돈 인상을 <b>몇 달 뒤부터</b> 하기로 하면 엄마랑 합의하기가 더 쉬워요. = 지문의 합의 조건을 나중에 이행하기.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Negotiators should try to find ways</div><div class=\"k\">협상가들은 방법을 찾으려고 노력해야 한다</div></div><div class=\"rc\"><div class=\"e\">to slice a large issue into smaller pieces,</div><div class=\"k\">큰 문제를 더 작은 조각으로 나누는,</div></div><div class=\"rc\"><div class=\"e\">known as using salami tactics.</div><div class=\"k\">‘살라미 전술’을 사용하는 것으로 알려진.</div></div><div class=\"rnat\">협상가들은 '살라미 전술'을 사용하는 것으로 알려진, 큰 문제를 더 작은 조각으로 나누는 방법을 찾으려고 노력해야 한다.</div><div class=\"rst\">엄마랑 큰 문제로 다툴 땐, 소시지 썰듯 문제를 작은 조각으로 나눠 보래요. = 지문 2번, 살라미 전술.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Issues that can be expressed</div><div class=\"k\">표현될 수 있는 문제들은</div></div><div class=\"rc\"><div class=\"e\">in quantitative, measurable units</div><div class=\"k\">정량적이고 측정 가능한 단위로</div></div><div class=\"rc\"><div class=\"e\">are easy to slice.</div><div class=\"k\">나누기 쉽다.</div></div><div class=\"rnat\">정량적이고 측정 가능한 단위로 표현될 수 있는 문제들은 나누기 쉽다.</div><div class=\"rst\">게임 시간처럼 숫자로 잴 수 있는 문제는 쪼개기 쉬워요. = 지문 3번, 정량적이고 측정 가능한 쟁점은 나누기 쉽다.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">compensation demands can be divided</div><div class=\"k\">보상 요구는 나뉠 수 있다</div></div><div class=\"rc\"><div class=\"e\">into cents-per-hour increments</div><div class=\"k\">시간당 센트 증가로</div></div><div class=\"rc\"><div class=\"e\">or lease rates can be quoted</div><div class=\"k\">또는 임대료는 시세가 매겨질 수 있다</div></div><div class=\"rc\"><div class=\"e\">as dollars per square foot.</div><div class=\"k\">평방 피트당 달러로.</div></div><div class=\"rnat\">예를 들어, 보상 요구는 시간당 센트 증가로 나누거나 임대료는 평방 피트당 달러로 시세를 매길 수 있다.</div><div class=\"rst\">예를 들어 게임 시간을 한꺼번에가 아니라 조금씩 늘려 달라고 해요. = 지문 4번, 시간당 센트·평방 피트당 달러로 나누는 예시.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">When working to fractionate</div><div class=\"k\">세분화하는 작업을 할 때</div></div><div class=\"rc\"><div class=\"e\">issues of principle or precedent,</div><div class=\"k\">원칙이나 관례의 쟁점을,</div></div><div class=\"rc ckc\"><div class=\"e\">parties may use <span class=\"cw\">the time horizon</span></div><div class=\"k\">당사자들은 <span class=\"cw\">시간 지평을</span> 사용할 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\">(<span class=\"cw\">when the principle goes into effect</span></div><div class=\"k\">(<span class=\"cw\">원칙이 언제 효력을 발휘하는지</span></div></div><div class=\"rc\"><div class=\"e\">or how long it will last)</div><div class=\"k\">또는 그것(= 그 원칙)이 얼마나 오래 지속될지)</div></div><div class=\"rc\"><div class=\"e\">as a way to fractionate the issue.</div><div class=\"k\">그 쟁점을 세분화하는 방법으로.</div></div><div class=\"rnat\">원칙이나 관례의 쟁점을 세분화하는 작업을 할 때, 당사자들은 그 쟁점을 세분화하는 방법으로 시간 지평(원칙이 효력을 발휘하는 시기나 지속되는 기간)을 사용할 수 있다.</div><div class=\"rst\">“주말엔 폰 금지” 같은 규칙 문제는 <b>언제부터, 얼마 동안</b> 할지로 쪼개요. = 지문 5번, 시간 지평으로 쟁점 나누기.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Another approach</span> is to vary</div><div class=\"k\"><span class=\"cw\">또 다른 접근법은</span> 다양화하는 것이다</div></div><div class=\"rc\"><div class=\"e\">the number of ways</div><div class=\"k\">방법의 수를</div></div><div class=\"rc\"><div class=\"e\">that the principle may be applied.</div><div class=\"k\">원칙이 적용될 수 있는.</div></div><div class=\"rnat\">또 다른 접근법은 원칙이 적용될 수 있는 방법의 수를 다양화하는 것이다.</div><div class=\"rst\"><b>또 다른 방법</b>(Another approach)은 규칙을 적용하는 경우의 수를 바꾸는 거예요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">a company may devise a family emergency leave plan</div><div class=\"k\">회사는 가족 비상 휴가 계획을 고안할 수 있다</div></div><div class=\"rc\"><div class=\"e\">that allows employees the opportunity</div><div class=\"k\">직원들에게 기회를 주는</div></div><div class=\"rc\"><div class=\"e\">to be away from the company</div><div class=\"k\">회사를 비울</div></div><div class=\"rc\"><div class=\"e\">for a period of no longer than three hours,</div><div class=\"k\">3시간 이내의 기간 동안,</div></div><div class=\"rc\"><div class=\"e\">and no more than once a month,</div><div class=\"k\">그리고 한 달에 한 번 이내로,</div></div><div class=\"rc\"><div class=\"e\">for illness in the employee’s immediate family.</div><div class=\"k\">직원의 직계 가족의 질병에 대해.</div></div><div class=\"rnat\">예를 들어, 회사는 직원의 직계 가족의 질병에 대해 직원에게 3시간 이내, 한 달에 한 번 이내의 기간 동안 회사를 비울 기회를 제공하는 가족 비상 휴가 계획을 고안할 수 있다.</div><div class=\"rst\">예를 들어 “시험 기간엔 짧게, 가끔만”처럼 정해요. = 지문 7번, 3시간 이내·한 달에 한 번만 쓰는 가족 비상 휴가 예시.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"settlement terms\" data-m=\"합의 조건\"><b>settlement terms</b>합의 조건</button><button type=\"button\" class=\"wdb\" data-w=\"implement\" data-m=\"이행하다, 시행하다\"><b>implement</b>이행하다, 시행하다</button><button type=\"button\" class=\"wdb\" data-w=\"salami tactics\" data-m=\"살라미 전술(잘게 쪼개기)\"><b>salami tactics</b>살라미 전술(잘게 쪼개기)</button><button type=\"button\" class=\"wdb\" data-w=\"quantitative\" data-m=\"정량적인, 양적인\"><b>quantitative</b>정량적인, 양적인</button><button type=\"button\" class=\"wdb\" data-w=\"fractionate\" data-m=\"세분하다, 잘게 나누다\"><b>fractionate</b>세분하다, 잘게 나누다</button><button type=\"button\" class=\"wdb\" data-w=\"time horizon\" data-m=\"시간 지평, 시간 범위\"><b>time horizon</b>시간 지평, 시간 범위</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 제목은 <b>글이 마지막에 무엇을 권하는지</b>를 잡으세요. 8번 질문 → 9번 문제점 → 11번 <b>thus</b>(그래서) 결론 “내 경험을 나 아닌 인물에게”가 제목이에요.</p><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 질문으로 화제 제시</span><div class=\"en\">Should you create a protagonist <mark>based directly on yourself</mark>?</div><p class=\"ko\">당신은 <mark>당신 자신에게 직접적으로 기반을 둔</mark> 주인공을 만들어 내야 할까?</p></div><div class=\"ck-via\"><i>▼</i><span>8번 질문에 “그건 아주 큰 문제”라고 답해요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 문제점</span><div class=\"en\">The problem with this — and it is a very large problem — is that <mark>almost no one can view himself</mark> … on the page.</div><p class=\"ko\">이것의 문제점은 — 매우 큰 문제다 — <mark>거의 아무도</mark> 책 속의 자신을 제대로 보지 못한다는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>thus(그래서)로 “더 나은 방법”을 권해요</span></div><div class=\"ck-step key\"><span class=\"lab\">11번 문장 · 결정적 결론</span><div class=\"en\">It can <mark>thus</mark> be easier and more effective to use a situation or incident from your life but make it happen <mark>to a character who is not you</mark>.</div><p class=\"ko\"><mark>그래서</mark> 당신 인생의 상황이나 사건을 쓰되, 그것을 <mark>당신이 아닌 등장인물에게</mark> 일어나게 하는 것이 더 쉽고 효과적일 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그 방법으로 얻는 것(객관성·통제력)으로 글을 닫아요</span></div><div class=\"ck-step\"><span class=\"lab\">14번 문장 · 방법의 장점</span><div class=\"en\">But by applying your own experience to a different protagonist, you can take advantage of your insider knowledge … and yet <mark>gain an objectivity and control</mark> …</div><p class=\"ko\">그러나 자신의 경험을 다른 주인공에게 적용하면, 내부자의 지식을 이용하면서도 <mark>객관성과 통제력을 얻을 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">등장인물 창조에 있어서 자신을 사용하는 더 나은 방법<small>11번 easier and more effective(더 쉽고 효과적인) 방법 = 내 사건을 나 아닌 인물에게 쓰기예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">당신의 기억을 소설 집필로부터 멀리하라!</span><span class=\"why\">[반대] 9번 문제점만 보고 “나를 쓰지 마라”로 착각한 함정이에요. 11번은 내 삶의 사건을 use(사용하다)하라고 했고, 13번도 내 모습을 넣어도 된다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">단순함: 위대한 소설의 본질</span><span class=\"why\">[지문에 없음] 단순함 이야기는 없어요. 10번은 오히려 내 기질이 complicated(복잡한)하다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">주인공: 소설을 이해하는 비결</span><span class=\"why\">[지문에 없음] 8·14번에 protagonist(주인공)가 나오지만, 소설을 읽고 이해하는 법이 아니라 쓰는 법을 말하는 글이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">당신이 아는 사람에게서 빌려 온 등장인물의 특성</span><span class=\"why\">[지문에 없음] 지문은 남이 아니라 “나 자신”의 감정·경험을 쓰는 이야기예요. 아는 사람에게서 빌린다는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In one sense,</div><div class=\"k\">어떤 의미에서,</div></div><div class=\"rc\"><div class=\"e\">every character you create</div><div class=\"k\">당신이 만들어 내는 모든 등장인물은</div></div><div class=\"rc\"><div class=\"e\">will be yourself.</div><div class=\"k\">당신 자신이 될 것이다.</div></div><div class=\"rnat\">어떤 의미에서, 당신이 만들어 내는 모든 등장인물은 당신 자신이 될 것이다.</div><div class=\"rst\">국어 시간에 소설을 쓰면, 내가 만든 인물은 어떤 의미에서 다 <b>나 자신</b>이에요. = 지문 1번.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">You’ve never murdered,</div><div class=\"k\">당신은 살인한 적이 결코 없다,</div></div><div class=\"rc\"><div class=\"e\">but your murderer’s rage</div><div class=\"k\">하지만 당신(이 만든) 살인자의 격노는</div></div><div class=\"rc\"><div class=\"e\">will be drawn from memories</div><div class=\"k\">기억으로부터 끌어내질 것이다</div></div><div class=\"rc\"><div class=\"e\">of your own extreme anger.</div><div class=\"k\">당신 자신의 극단적인 분노의.</div></div><div class=\"rnat\">당신은 결코 살인한 적이 없지만, 당신의 (허구로 만들어 낸) 살인자의 격노는 당신 자신의 극단적인 분노의 기억으로부터 불러일으켜질 것이다.</div><div class=\"rst\">악당이 화내는 장면도 내가 동생한테 엄청 화났던 기억에서 나와요. = 지문 2번, 살인자의 격노도 내 분노의 기억에서 나온다.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Your love scenes</div><div class=\"k\">당신의 사랑 장면은</div></div><div class=\"rc\"><div class=\"e\">will contain hints</div><div class=\"k\">힌트를 포함할 것이다</div></div><div class=\"rc\"><div class=\"e\">of your own past kisses and sweet moments.</div><div class=\"k\">당신 자신의 과거의 키스와 달콤한 순간에 대한.</div></div><div class=\"rnat\">당신이 만들어 낸 사랑의 장면은 자신의 과거의 키스와 달콤한 순간에 대한 힌트를 포함할 것이다.</div><div class=\"rst\">사랑 장면엔 내가 겪은 설레고 달콤한 순간이 살짝 묻어나요. = 지문 3번, 사랑 장면에 내 과거의 순간이 담긴다.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">That scene</div><div class=\"k\">그 장면은</div></div><div class=\"rc\"><div class=\"e\">in which your octogenarian feels humiliated</div><div class=\"k\">당신(이 만든) 80대 인물이 굴욕감을 느끼는</div></div><div class=\"rc\"><div class=\"e\">will draw on your experience</div><div class=\"k\">당신의 경험을 활용할 것이다</div></div><div class=\"rc\"><div class=\"e\">of humiliation in the eighth grade,</div><div class=\"k\">8학년(중학교 2학년) 때의 굴욕의,</div></div><div class=\"rc\"><div class=\"e\">even though the circumstances are totally different</div><div class=\"k\">비록 상황이 완전히 다르고</div></div><div class=\"rc\"><div class=\"e\">and you’re not even consciously thinking</div><div class=\"k\">당신이 의식적으로 생각하고 있지 않더라도</div></div><div class=\"rc\"><div class=\"e\">about your middle-school years.</div><div class=\"k\">당신의 중학교 시절에 대해.</div></div><div class=\"rnat\">비록 그 상황이 완전히 다르고 당신이 심지어 당신의 중학교 시절에 대해서 의식적으로 생각하고 있지 않다고 하더라도, 당신이 만들어 낸 80대의 사람이 굴욕감을 느끼는 그 장면은 중학교 2학년일 때의 당신의 굴욕의 경험을 활용할 것이다.</div><div class=\"rst\">할아버지 인물이 창피당하는 장면도, 중2 때 망신당한 기억을 나도 모르게 꺼내 써요. = 지문 4번, 8학년 때 굴욕의 경험.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Our characters’ emotions,</div><div class=\"k\">우리 등장인물들의 감정은,</div></div><div class=\"rc\"><div class=\"e\">after all,</div><div class=\"k\">결국,</div></div><div class=\"rc\"><div class=\"e\">draw on our own emotions.</div><div class=\"k\">우리 자신의 감정을 활용한다.</div></div><div class=\"rnat\">결국에는, 우리의 등장인물들의 감정은 우리 자신의 감정을 활용한다.</div><div class=\"rst\"><b>결국</b>(after all) 인물의 감정은 내 감정에서 나와요. = 지문 5번이 1~4번을 한 줄로 정리해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Sometimes, however,</div><div class=\"k\">하지만 때때로,</div></div><div class=\"rc\"><div class=\"e\">you will want to use your life</div><div class=\"k\">당신은 당신의 인생을 사용하길 원할 것이다</div></div><div class=\"rc\"><div class=\"e\">more directly in your fiction,</div><div class=\"k\">당신의 소설에서 더 직접적으로,</div></div><div class=\"rc\"><div class=\"e\">dramatizing actual incidents.</div><div class=\"k\">실제 사건을 각색하면서.</div></div><div class=\"rnat\">하지만 때때로, 당신은 실제 사건을 각색하여 소설에서 당신의 인생을 더 직접적으로 사용하길 원할 것이다.</div><div class=\"rst\"><b>하지만</b>(however) 가끔은 내 삶의 실제 사건을 더 <b>직접</b> 소설에 넣고 싶어져요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Charles Dickens used</div><div class=\"k\">Charles Dickens는 사용했다</div></div><div class=\"rc\"><div class=\"e\">his desperate experience</div><div class=\"k\">그(= Charles Dickens)의 절망적인 경험을</div></div><div class=\"rc\"><div class=\"e\">as a child laborer in Victorian England</div><div class=\"k\">빅토리아 시대 영국의 아동 노동자로서의</div></div><div class=\"rc\"><div class=\"e\">to write David Copperfield.</div><div class=\"k\">《David Copperfield》를 쓰기 위해.</div></div><div class=\"rnat\">Charles Dickens(찰스 디킨스)는 《David Copperfield(데이비드 코퍼필드)》를 쓰기 위해 빅토리아 시대 영국의 아동 노동자로서의 자신의 절망적인 경험을 사용했다.</div><div class=\"rst\">디킨스(Charles Dickens)도 어릴 적 힘들게 일한 경험으로 《데이비드 코퍼필드》를 썼어요. = 지문 7번.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">Should you create a protagonist</div><div class=\"k\">당신은 주인공을 만들어 내야 할까</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">based directly on yourself</span>?</div><div class=\"k\"><span class=\"cw\">당신 자신에게 직접적으로 기반을 둔</span>?</div></div><div class=\"rnat\">당신은 자신에(자신의 삶에) 직접적으로 기반을 둔 주인공을 만들어 내야 할까?</div><div class=\"rst\">그럼 주인공을 아예 <b>나 그대로</b> 만들어야 할까요? = 지문 8번이 던진 질문이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The problem with this</div><div class=\"k\">이것(= 자신에게 직접 기반을 둔 주인공을 만드는 것)에 대한 문제점은</div></div><div class=\"rc\"><div class=\"e\">— and it is a very large problem —</div><div class=\"k\">— 그리고 그것(= 그 문제점)은 매우 큰 문제점이다 —</div></div><div class=\"rc\"><div class=\"e\">is that almost no one</div><div class=\"k\">거의 아무도 ~하지 못한다는 것이다</div></div><div class=\"rc\"><div class=\"e\">can view himself objectively</div><div class=\"k\">자신을 객관적으로 볼 수 ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">on the page.</div><div class=\"k\">페이지(책 속)에서.</div></div><div class=\"rnat\">매우 큰 문제점이기도 한, 이것에 대한 문제점은 페이지(책 속)에서 자신을 객관적으로 볼 수 있는 사람이 거의 없다는 것이다.</div><div class=\"rst\">문제는, 거의 아무도 글 속의 자기를 <b>제대로</b> 보지 못한다는 거예요. = 지문 9번, 아주 큰 문제점.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">As the writer,</div><div class=\"k\">작가로서,</div></div><div class=\"rc\"><div class=\"e\">you’re too close</div><div class=\"k\">당신은 너무 가까이 있다</div></div><div class=\"rc\"><div class=\"e\">to your own complicated makeup.</div><div class=\"k\">당신 자신의 복잡한 기질에.</div></div><div class=\"rnat\">작가로서, 당신은 자신의 복잡한 기질에 너무 가까이 있다.</div><div class=\"rst\">내 일기 속 나는 너무 가까워서, 내 복잡한 성격이 한눈에 안 보여요. = 지문 10번, 작가는 자기 기질에 <b>너무 가깝다</b>.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">It can <span class=\"cw\">thus</span> be easier and more effective</div><div class=\"k\"><span class=\"cw\">그래서</span> 더 쉽고 더 효과적일 수 있다</div></div><div class=\"rc\"><div class=\"e\">to use a situation or incident from your life</div><div class=\"k\">당신의 인생에서 상황이나 사건을 사용하는 것이</div></div><div class=\"rc\"><div class=\"e\">but make it happen</div><div class=\"k\">하지만 그것(= 그 상황이나 사건)이 일어나게 하는 것이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to a character who is not you</span>.</div><div class=\"k\"><span class=\"cw\">당신이 아닌 등장인물에게</span>.</div></div><div class=\"rnat\">그래서 당신의 인생의 상황이나 사건을 사용하되 그것이 당신이 아닌 등장인물에게 일어나게 하는 것이 더 쉽고 효과적일 수 있다.</div><div class=\"rst\"><b>그래서</b>(thus) 내 사건은 가져오되 <b>나 아닌 인물</b>에게 일어나게 하는 게 더 쉽고 효과적이에요. = 지문 11번 결론.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">that’s what authors largely have done.</div><div class=\"k\">그것(= 자기 삶의 상황이나 사건을 자신이 아닌 등장인물에게 일어나게 하는 것)이 작가들이 주로 해 온 것이다.</div></div><div class=\"rnat\">사실 그것이 작가들이 주로 해왔던 것이다.</div><div class=\"rst\">사실 작가들도 대부분 그렇게 써 왔어요. = 지문 12번, 그것이 작가들이 주로 해 온 일이다.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">You can still, of course,</div><div class=\"k\">물론 당신은 여전히 ~할 수 있다,</div></div><div class=\"rc\"><div class=\"e\">incorporate aspects of yourself:</div><div class=\"k\">당신 자신의 측면들을 포함시킬 (수 있다):</div></div><div class=\"rc\"><div class=\"e\">your love of Beethoven,</div><div class=\"k\">베토벤에 대한 당신의 사랑,</div></div><div class=\"rc\"><div class=\"e\">your quick temper,</div><div class=\"k\">당신의 급한 성격,</div></div><div class=\"rc\"><div class=\"e\">your soccer injuries.</div><div class=\"k\">당신이 축구에서 입은 부상.</div></div><div class=\"rnat\">물론 당신은 여전히 베토벤에 대한 당신의 사랑, 급한 성격, 축구에서 입은 부상과 같은 자신의 측면들을 포함시킬 수 있다.</div><div class=\"rst\">물론 내가 좋아하는 음악, 급한 성격, 축구하다 다친 일 같은 내 모습은 넣어도 돼요. = 지문 13번.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><div class=\"rc\"><div class=\"e\">But by applying your own experience</div><div class=\"k\">그러나 당신 자신의 경험을 적용시킴으로써</div></div><div class=\"rc\"><div class=\"e\">to a different protagonist,</div><div class=\"k\">다른 주인공에게,</div></div><div class=\"rc\"><div class=\"e\">you can take advantage of</div><div class=\"k\">당신은 이용할 수 있다</div></div><div class=\"rc\"><div class=\"e\">your insider knowledge of the situation,</div><div class=\"k\">그 상황에 대한 당신의 내부자(로서의) 지식을,</div></div><div class=\"rc ckc\"><div class=\"e\">and yet <span class=\"cw\">gain an objectivity and control</span></div><div class=\"k\">그러면서도 <span class=\"cw\">객관성과 통제력을 얻을 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">that the original intense situation,</div><div class=\"k\">원래의 극심한 상황이,</div></div><div class=\"rc\"><div class=\"e\">by definition, did not have.</div><div class=\"k\">당연히 가지지 않았던.</div></div><div class=\"rnat\">그러나 당신은 자신의 경험을 다른 주인공에게 적용시킴으로써, 그 상황에 대한 내부자(로서의) 지식을 이용할 수 있고, 그러면서도 원래의 극심한 상황에서는 당연히 존재하지 않았던 객관성과 통제력을 얻을 수 있다.</div><div class=\"rst\">남의 주인공에게 내 경험을 입히면, 속사정은 잘 알면서도 <b>객관성</b>과 통제력을 얻어요. = 지문 14번 마무리.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"protagonist\" data-m=\"주인공\"><b>protagonist</b>주인공</button><button type=\"button\" class=\"wdb\" data-w=\"incident\" data-m=\"사건\"><b>incident</b>사건</button><button type=\"button\" class=\"wdb\" data-w=\"makeup\" data-m=\"구성, 기질\"><b>makeup</b>구성, 기질</button><button type=\"button\" class=\"wdb\" data-w=\"incorporate\" data-m=\"포함시키다, 담아내다\"><b>incorporate</b>포함시키다, 담아내다</button><button type=\"button\" class=\"wdb\" data-w=\"insider knowledge\" data-m=\"내부자의 지식\"><b>insider knowledge</b>내부자의 지식</button><button type=\"button\" class=\"wdb\" data-w=\"objectivity\" data-m=\"객관성\"><b>objectivity</b>객관성</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 답은 <b>바로 다음 문장</b>과 <b>마지막에 같은 말로 돌아오는 문장</b>이 쥐고 있어요. 10번 <b>too close</b>(너무 가깝다) → 14번 <b>objectivity</b>(객관성)로 이어 보세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (9번)</span><div class=\"en\">The problem with this — and it is a very large problem — is that almost no one can view himself <span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> on the page.</div><p class=\"ko\">이것의 문제점은 거의 아무도 책 속에서 자신을 ( ? ) 보지 못한다는 것이다</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 바로 뒤에서 “왜 못 보는지” 이유를 대요</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 문장 · 못 하는 이유</span><div class=\"en\">As the writer, you’re <mark>too close</mark> to your own complicated makeup.</div><p class=\"ko\">작가로서, 당신은 당신 자신의 복잡한 기질에 <mark>너무 가까이 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>너무 가까우니 “나 아닌 인물”로 거리를 두라고 해요</span></div><div class=\"ck-step\"><span class=\"lab\">11번 문장 · 해결책</span><div class=\"en\">It can thus be easier and more effective to use a situation or incident from your life but make it happen <mark>to a character who is not you</mark>.</div><p class=\"ko\">그래서 당신 인생의 사건을 쓰되 <mark>당신이 아닌 등장인물에게</mark> 일어나게 하는 것이 더 쉽고 효과적일 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸에서 “못 한다”던 것을 마지막에 “얻는다”고 같은 말로 되풀이해요</span></div><div class=\"ck-step key\"><span class=\"lab\">14번 문장 · 결정적 단서</span><div class=\"en\">… and yet <mark>gain an objectivity and control</mark> that the original intense situation, by definition, did not have.</div><p class=\"ko\">그러면서도 원래의 극심한 상황이 당연히 가지지 않았던 <mark>객관성과 통제력을 얻을 수 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">객관적으로<small>10번 too close(너무 가깝다)의 반대이고, 14번 objectivity(객관성)와 같은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">감정적으로</span><span class=\"why\">5번 emotions(감정)가 눈에 띄어 끌리지만, 1~5번은 감정은 이미 내 것을 쓰고 있다고 했어요. 10번처럼 너무 가까워서 못 하는 건 거리 두고 보기예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">직관적으로</span><span class=\"why\">10번 too close(너무 가깝다)는 직관이 모자라다는 말이 아니라 거리가 없다는 말이에요. 14번에서 얻는 것도 objectivity(객관성)예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">헌신적으로</span><span class=\"why\">자신에게 헌신한다는 이야기는 지문에 없어요. 14번에서 다른 주인공을 써서 얻는 건 objectivity(객관성)예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">호의적으로</span><span class=\"why\">자기를 좋게 본다는 말은 없어요. 문제는 10번처럼 너무 가깝다는 것이고, 14번 objectivity(객관성)와 안 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In one sense,</div><div class=\"k\">어떤 의미에서,</div></div><div class=\"rc\"><div class=\"e\">every character you create</div><div class=\"k\">당신이 만들어 내는 모든 등장인물은</div></div><div class=\"rc\"><div class=\"e\">will be yourself.</div><div class=\"k\">당신 자신이 될 것이다.</div></div><div class=\"rnat\">어떤 의미에서, 당신이 만들어 내는 모든 등장인물은 당신 자신이 될 것이다.</div><div class=\"rst\">국어 시간에 소설을 쓰면, 내가 만든 인물은 어떤 의미에서 다 <b>나 자신</b>이에요. = 지문 1번.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">You’ve never murdered,</div><div class=\"k\">당신은 살인한 적이 결코 없다,</div></div><div class=\"rc\"><div class=\"e\">but your murderer’s rage</div><div class=\"k\">하지만 당신(이 만든) 살인자의 격노는</div></div><div class=\"rc\"><div class=\"e\">will be drawn from memories</div><div class=\"k\">기억으로부터 끌어내질 것이다</div></div><div class=\"rc\"><div class=\"e\">of your own extreme anger.</div><div class=\"k\">당신 자신의 극단적인 분노의.</div></div><div class=\"rnat\">당신은 결코 살인한 적이 없지만, 당신의 (허구로 만들어 낸) 살인자의 격노는 당신 자신의 극단적인 분노의 기억으로부터 불러일으켜질 것이다.</div><div class=\"rst\">악당이 화내는 장면도 내가 동생한테 엄청 화났던 기억에서 나와요. = 지문 2번, 살인자의 격노도 내 분노의 기억에서 나온다.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Your love scenes</div><div class=\"k\">당신의 사랑 장면은</div></div><div class=\"rc\"><div class=\"e\">will contain hints</div><div class=\"k\">힌트를 포함할 것이다</div></div><div class=\"rc\"><div class=\"e\">of your own past kisses and sweet moments.</div><div class=\"k\">당신 자신의 과거의 키스와 달콤한 순간에 대한.</div></div><div class=\"rnat\">당신이 만들어 낸 사랑의 장면은 자신의 과거의 키스와 달콤한 순간에 대한 힌트를 포함할 것이다.</div><div class=\"rst\">사랑 장면엔 내가 겪은 설레고 달콤한 순간이 살짝 묻어나요. = 지문 3번, 사랑 장면에 내 과거의 순간이 담긴다.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">That scene</div><div class=\"k\">그 장면은</div></div><div class=\"rc\"><div class=\"e\">in which your octogenarian feels humiliated</div><div class=\"k\">당신(이 만든) 80대 인물이 굴욕감을 느끼는</div></div><div class=\"rc\"><div class=\"e\">will draw on your experience</div><div class=\"k\">당신의 경험을 활용할 것이다</div></div><div class=\"rc\"><div class=\"e\">of humiliation in the eighth grade,</div><div class=\"k\">8학년(중학교 2학년) 때의 굴욕의,</div></div><div class=\"rc\"><div class=\"e\">even though the circumstances are totally different</div><div class=\"k\">비록 상황이 완전히 다르고</div></div><div class=\"rc\"><div class=\"e\">and you’re not even consciously thinking</div><div class=\"k\">당신이 의식적으로 생각하고 있지 않더라도</div></div><div class=\"rc\"><div class=\"e\">about your middle-school years.</div><div class=\"k\">당신의 중학교 시절에 대해.</div></div><div class=\"rnat\">비록 그 상황이 완전히 다르고 당신이 심지어 당신의 중학교 시절에 대해서 의식적으로 생각하고 있지 않다고 하더라도, 당신이 만들어 낸 80대의 사람이 굴욕감을 느끼는 그 장면은 중학교 2학년일 때의 당신의 굴욕의 경험을 활용할 것이다.</div><div class=\"rst\">할아버지 인물이 창피당하는 장면도, 중2 때 망신당한 기억을 나도 모르게 꺼내 써요. = 지문 4번, 8학년 때 굴욕의 경험.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Our characters’ emotions,</div><div class=\"k\">우리 등장인물들의 감정은,</div></div><div class=\"rc\"><div class=\"e\">after all,</div><div class=\"k\">결국,</div></div><div class=\"rc\"><div class=\"e\">draw on our own emotions.</div><div class=\"k\">우리 자신의 감정을 활용한다.</div></div><div class=\"rnat\">결국에는, 우리의 등장인물들의 감정은 우리 자신의 감정을 활용한다.</div><div class=\"rst\"><b>결국</b>(after all) 인물의 감정은 내 감정에서 나와요. = 지문 5번이 1~4번을 한 줄로 정리해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Sometimes, however,</div><div class=\"k\">하지만 때때로,</div></div><div class=\"rc\"><div class=\"e\">you will want to use your life</div><div class=\"k\">당신은 당신의 인생을 사용하길 원할 것이다</div></div><div class=\"rc\"><div class=\"e\">more directly in your fiction,</div><div class=\"k\">당신의 소설에서 더 직접적으로,</div></div><div class=\"rc\"><div class=\"e\">dramatizing actual incidents.</div><div class=\"k\">실제 사건을 각색하면서.</div></div><div class=\"rnat\">하지만 때때로, 당신은 실제 사건을 각색하여 소설에서 당신의 인생을 더 직접적으로 사용하길 원할 것이다.</div><div class=\"rst\"><b>하지만</b>(however) 가끔은 내 삶의 실제 사건을 더 <b>직접</b> 소설에 넣고 싶어져요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Charles Dickens used</div><div class=\"k\">Charles Dickens는 사용했다</div></div><div class=\"rc\"><div class=\"e\">his desperate experience</div><div class=\"k\">그(= Charles Dickens)의 절망적인 경험을</div></div><div class=\"rc\"><div class=\"e\">as a child laborer in Victorian England</div><div class=\"k\">빅토리아 시대 영국의 아동 노동자로서의</div></div><div class=\"rc\"><div class=\"e\">to write David Copperfield.</div><div class=\"k\">《David Copperfield》를 쓰기 위해.</div></div><div class=\"rnat\">Charles Dickens(찰스 디킨스)는 《David Copperfield(데이비드 코퍼필드)》를 쓰기 위해 빅토리아 시대 영국의 아동 노동자로서의 자신의 절망적인 경험을 사용했다.</div><div class=\"rst\">디킨스(Charles Dickens)도 어릴 적 힘들게 일한 경험으로 《데이비드 코퍼필드》를 썼어요. = 지문 7번.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Should you create a protagonist</div><div class=\"k\">당신은 주인공을 만들어 내야 할까</div></div><div class=\"rc\"><div class=\"e\">based directly on yourself?</div><div class=\"k\">당신 자신에게 직접적으로 기반을 둔?</div></div><div class=\"rnat\">당신은 자신에(자신의 삶에) 직접적으로 기반을 둔 주인공을 만들어 내야 할까?</div><div class=\"rst\">그럼 주인공을 아예 <b>나 그대로</b> 만들어야 할까요? = 지문 8번이 던진 질문이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">The problem with this</div><div class=\"k\">이것(= 자신에게 직접 기반을 둔 주인공을 만드는 것)에 대한 문제점은</div></div><div class=\"rc\"><div class=\"e\">— and it is a very large problem —</div><div class=\"k\">— 그리고 그것(= 그 문제점)은 매우 큰 문제점이다 —</div></div><div class=\"rc\"><div class=\"e\">is that almost no one</div><div class=\"k\">거의 아무도 ~하지 못한다는 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">can view himself objectively</span></div><div class=\"k\"><span class=\"cw\">자신을 객관적으로 볼 수</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">on the page.</div><div class=\"k\">페이지(책 속)에서.</div></div><div class=\"rnat\">매우 큰 문제점이기도 한, 이것에 대한 문제점은 페이지(책 속)에서 자신을 객관적으로 볼 수 있는 사람이 거의 없다는 것이다.</div><div class=\"rst\">문제는, 거의 아무도 글 속의 자기를 <b>제대로</b> 보지 못한다는 거예요. = 지문 9번, 아주 큰 문제점.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc\"><div class=\"e\">As the writer,</div><div class=\"k\">작가로서,</div></div><div class=\"rc ckc\"><div class=\"e\">you’re <span class=\"cw\">too close</span></div><div class=\"k\">당신은 <span class=\"cw\">너무 가까이 있다</span></div></div><div class=\"rc\"><div class=\"e\">to your own complicated makeup.</div><div class=\"k\">당신 자신의 복잡한 기질에.</div></div><div class=\"rnat\">작가로서, 당신은 자신의 복잡한 기질에 너무 가까이 있다.</div><div class=\"rst\">내 일기 속 나는 너무 가까워서, 내 복잡한 성격이 한눈에 안 보여요. = 지문 10번, 작가는 자기 기질에 <b>너무 가깝다</b>.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">It can thus be easier and more effective</div><div class=\"k\">그래서 더 쉽고 더 효과적일 수 있다</div></div><div class=\"rc\"><div class=\"e\">to use a situation or incident from your life</div><div class=\"k\">당신의 인생에서 상황이나 사건을 사용하는 것이</div></div><div class=\"rc\"><div class=\"e\">but make it happen</div><div class=\"k\">하지만 그것(= 그 상황이나 사건)이 일어나게 하는 것이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to a character who is not you</span>.</div><div class=\"k\"><span class=\"cw\">당신이 아닌 등장인물에게</span>.</div></div><div class=\"rnat\">그래서 당신의 인생의 상황이나 사건을 사용하되 그것이 당신이 아닌 등장인물에게 일어나게 하는 것이 더 쉽고 효과적일 수 있다.</div><div class=\"rst\"><b>그래서</b>(thus) 내 사건은 가져오되 <b>나 아닌 인물</b>에게 일어나게 하는 게 더 쉽고 효과적이에요. = 지문 11번 결론.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">that’s what authors largely have done.</div><div class=\"k\">그것(= 자기 삶의 상황이나 사건을 자신이 아닌 등장인물에게 일어나게 하는 것)이 작가들이 주로 해 온 것이다.</div></div><div class=\"rnat\">사실 그것이 작가들이 주로 해왔던 것이다.</div><div class=\"rst\">사실 작가들도 대부분 그렇게 써 왔어요. = 지문 12번, 그것이 작가들이 주로 해 온 일이다.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">You can still, of course,</div><div class=\"k\">물론 당신은 여전히 ~할 수 있다,</div></div><div class=\"rc\"><div class=\"e\">incorporate aspects of yourself:</div><div class=\"k\">당신 자신의 측면들을 포함시킬 (수 있다):</div></div><div class=\"rc\"><div class=\"e\">your love of Beethoven,</div><div class=\"k\">베토벤에 대한 당신의 사랑,</div></div><div class=\"rc\"><div class=\"e\">your quick temper,</div><div class=\"k\">당신의 급한 성격,</div></div><div class=\"rc\"><div class=\"e\">your soccer injuries.</div><div class=\"k\">당신이 축구에서 입은 부상.</div></div><div class=\"rnat\">물론 당신은 여전히 베토벤에 대한 당신의 사랑, 급한 성격, 축구에서 입은 부상과 같은 자신의 측면들을 포함시킬 수 있다.</div><div class=\"rst\">물론 내가 좋아하는 음악, 급한 성격, 축구하다 다친 일 같은 내 모습은 넣어도 돼요. = 지문 13번.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">14번</span><div class=\"rc\"><div class=\"e\">But by applying your own experience</div><div class=\"k\">그러나 당신 자신의 경험을 적용시킴으로써</div></div><div class=\"rc\"><div class=\"e\">to a different protagonist,</div><div class=\"k\">다른 주인공에게,</div></div><div class=\"rc\"><div class=\"e\">you can take advantage of</div><div class=\"k\">당신은 이용할 수 있다</div></div><div class=\"rc\"><div class=\"e\">your insider knowledge of the situation,</div><div class=\"k\">그 상황에 대한 당신의 내부자(로서의) 지식을,</div></div><div class=\"rc ckc\"><div class=\"e\">and yet <span class=\"cw\">gain an objectivity and control</span></div><div class=\"k\">그러면서도 <span class=\"cw\">객관성과 통제력을 얻을 수 있다</span></div></div><div class=\"rc\"><div class=\"e\">that the original intense situation,</div><div class=\"k\">원래의 극심한 상황이,</div></div><div class=\"rc\"><div class=\"e\">by definition, did not have.</div><div class=\"k\">당연히 가지지 않았던.</div></div><div class=\"rnat\">그러나 당신은 자신의 경험을 다른 주인공에게 적용시킴으로써, 그 상황에 대한 내부자(로서의) 지식을 이용할 수 있고, 그러면서도 원래의 극심한 상황에서는 당연히 존재하지 않았던 객관성과 통제력을 얻을 수 있다.</div><div class=\"rst\">남의 주인공에게 내 경험을 입히면, 속사정은 잘 알면서도 <b>객관성</b>과 통제력을 얻어요. = 지문 14번 마무리.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"protagonist\" data-m=\"주인공\"><b>protagonist</b>주인공</button><button type=\"button\" class=\"wdb\" data-w=\"makeup\" data-m=\"구성, 기질\"><b>makeup</b>구성, 기질</button><button type=\"button\" class=\"wdb\" data-w=\"objectivity\" data-m=\"객관성\"><b>objectivity</b>객관성</button><button type=\"button\" class=\"wdb\" data-w=\"insider knowledge\" data-m=\"내부자의 지식\"><b>insider knowledge</b>내부자의 지식</button><button type=\"button\" class=\"wdb\" data-w=\"by definition\" data-m=\"정의상, 본질적으로\"><b>by definition</b>정의상, 본질적으로</button><button type=\"button\" class=\"wdb\" data-w=\"draw on\" data-m=\"~을 끌어다 쓰다\"><b>draw on</b>~을 끌어다 쓰다</button></div>"};

 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" data-q="'+d.no+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
