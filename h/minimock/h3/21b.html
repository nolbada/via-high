<title>고3 미니모의고사 21회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

ases and discoverers, none of which can be identified as definitive. / This entailed relating the progressive accumulation of breakthroughs and discoveries. / Closer analysis of scientific discoveries, for instance, led historians to ask whether the dates of discoveries and their discoverers can be identified precisely. / Nor does the traditional view recognise the role that non-intellectual factors, especially institutional and socio-economic ones, play in scientific developments.", "ev_ko": [[2, "(A) 어떤 발견들은 수많은 단계와 발견자들을 수반하는 것으로 보이는데, 그중 어느 것도 확정적인 것으로 특정될 수 없다."], [4, "(B) 이것은 획기적 발전과 발견의 점진적 축적을 서술하는 일을 수반했다."], [7, "예를 들어, 과학적 발견에 대한 더 면밀한 분석은 역사가들로 하여금 발견의 날짜와 그 발견자들이 정확하게 특정될 수 있는지를 묻게 했다."], [8, "(C) 전통적 관점은 또한 비지성적 요인, 특히 제도적·사회 경제적 요인이 과학의 발전에서 하는 역할도 인정하지 않는다."]], "why": ["(B)의 첫 문장 (4) <b>This entailed ~<\/b>의 This는 주어진 글의 전통적 목표, 즉 발전 과정을 보여 주는 일을 가리킵니다", "그래서 주어진 글 다음에 (B)가 옵니다", "(B)의 끝 문장 (7)은 발견의 날짜와 발견자를 정확히 특정할 수 있는지 묻게 되었다고 합니다", "(A)의 첫 문장 (2)는 그 물음에 대해 어느 것도 확정적으로 특정할 수 없다고 답하므로 (B) 다음에 (A)가 옵니다", "(C)의 첫 문장 (8)은 <b>Nor<\/b>(~도 또한 아니다)로 시작해 전통적 관점의 결함을 하나 더 듭니다", "앞에서 결함이 이미 나와야 하므로 (A) 다음에 (C)가 옵니다", "따라서 순서는 (B) - (A) - (C)입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)의 '어느 것도 확정적으로 특정할 수 없다'는 (B) 끝의 '정확히 특정할 수 있는가'라는 물음에 대한 답입니다", "물음보다 답이 먼저 올 수 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": true, "e": ["주어진 글의 전통적 목표 → (B)의 This entailed ~와 역사관의 결함 → (A)의 결함 설명 → (C)의 Nor로 시작하는 또 다른 결함으로 자연스럽게 이어집니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["(B) 끝에서 발견자를 정확히 특정할 수 있는지 물었으므로, 그 답인 (A)가 바로 뒤에 와야 합니다", "(C)가 끼어들면 물음과 답이 끊깁니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C)의 Nor는 앞에 비판이 나온 뒤에 쓰는 말입니다", "주어진 글은 전통적 목표를 소개할 뿐 비판하지 않았습니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(C)의 Nor는 앞에 결함이 나와야 쓸 수 있으므로 주어진 글 바로 뒤에 올 수 없습니다", "(B)의 This도 주어진 글의 목표를 가리킵니다."]}], "tr": ["【주어진 글】 전통적으로, Kuhn이 주장하기를, 과학사가들의 주된 목표는 '현재의 과 되 그것이 자신이 아닌 등장인물에게 일어나게 하라고 권합니다", "(14)는 그렇게 하면 내부자의 지식을 이용하면서도 객관성과 통제력을 얻는다고 결론짓습니다", "즉 등장인물을 만들 때 자신을 사용하는 더 좋은 방법을 알려 주는 글이므로 ⑤가 정답입니다."], "ch": [{"n": "①", "t": "Simplicity: The Essence of Great Novels", "g": "평이함: 위대한 소설의 본질", "ok": false, "e": ["글에 평이함(Simplicity)에 대한 내용은 없습니다", "글은 자신의 경험을 다른 등장인물에게 적용하는 방법을 말합니다."]}, {"n": "②", "t": "Protagonists: A Key to Understanding Novels", "g": "주인공: 소설을 이해하는 비결", "ok": false, "e": ["글은 소설을 이해하는 법이 아니라 소설의 등장인물을 만드는 법을 다룹니다."]}, {"n": "③", "t": "Keep Your Memories Away from Novel Writing!", "g": "당신의 기억을 소설 집필로부터 멀리하라!", "ok": false, "e": ["글의 내용과 반대입니다", "(11)은 자기 인생의 상황이나 사건을 사용하라고 하고, (14)도 자신의 경험을 다른 주인공에게 적용하라고 합니다."]}, {"n": "④", "t": "Character Traits Borrowed from People You Know", "g": "당신이 아는 사람들로부터 차용한 등장인물 특성", "ok": false, "e": ["글에서 가져오는 것은 아는 사람들의 특성이 아니라 작가 자신의 경험입니다."]}, {"n": "⑤", "t": "A Better Way to Use Yourself in Character Creation", "g": "등장인물 창조에 있어서 자신을 사용하는 더 좋은 방법", "ok": true, "e": ["(8)의 물음 뒤에, 자신을 그대로 주인공으로 삼기보다 (11)처럼 자신의 경험을 다른 등장인물에게 일어나게 하는 것이 낫다고 하고, (14)에서 그 이점으로 결론짓습니다."]}], "tr": ["어떤 의미에서, 당신이 만들어 내는 모든 등장인물은 당신 자신이 될 것이다.", "당신은 결코 살인한 적이 없지만, 당신의 (허구로 만들어 낸) 살인자의 격노는 당신 자신의 극단적인 분노의 기억으로부터 불러일으켜질 것이다.", "당신이 만들어 낸 사랑의 장면은 자신의 과거의 키스와 달콤한 순간에 대한 힌트를 포함할 것이다.", "비록 그 상황이 완전히 다르고 당신이 심지어 당신의 중학교 시절에 대해서 의식적으로 생각하고 있지 않다고 하더라도, 당신이 만들어 낸 80대의 사람이 굴욕감을 느끼는 그 장면은 중학교 2학년일 때의 당신의 굴욕의 경험을 활용할 것이다.", "결국에는, 우리의 등장인물들의 감정은 우리 자신의 감정을 활용한다.", "하지만 때때로, 당신은 실제 사건을 각색하여 소설에서 당신의 인생을 더 직접적으로 사용하길 원할 것이다.", "Charles Dickens(찰스 디킨스)는 《David Copperfield(데이비드 코퍼필드)》를 쓰기 위해 빅토리아 시대 영국의 아동 노동자로서의 자신의 절망적인 경험을 사용했다.", "당신은 자신에(자신의 삶에) 직접적으로 기반을 둔 주인공을 만들어 내야 할까?", "매우 큰 문제점이기도 한, 이것에 대한 문제점은 페이지(책 속)에서 자신을 객관적으로 볼 수 있는 사람이 거의 없다는 것이다.", "작가로서, 당신은 자신의 복잡한 기질에 너무 가까이 있다.", "그래서 당신의 인생의 상황이나 사건을 사용하되 그것이 당신이 아닌 등장인물에게 일어나게 하는 것이 더 쉽고 효과적일 수 있다.", "사실 그것이 작가들이 주로 해왔던 것이다.", "물론 당신은 여전히 베토벤에 대한 당신의 사랑, 급한 성격, 축구에서 입은 부상과 같은 자신의 측면들을 포함시킬 수 있다.", "그러나 당신은 자신의 경험을 다른 주인공에게 적용시킴으로써, 그 상황에 대한 내부자(로서의) function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}

 달리는 사람들이 다리의 뻣뻣함을 조절할 수 있다고 믿기 시작했다.", "tags": ["As a result = 부사구: 문장 전체 꾸밈 (결과)", "주어 researchers, 동사 began, 목적어 to believe. gradually = 부사: began 꾸밈. believe의 목적어는 다음 that절", "that절 = believe의 목적어(명사절). 주어 runners, 동사 are able to adjust, 목적어 leg stiffness. subconsciously = 부사: able 꾸밈", "prior to foot strike = 전치사구(부사구): adjust 꾸밈 (시간, ~하기 전에)", "based on ~ = 과거분사구(부사적: 근거): adjust 꾸밈. of the hardness ~ = 전치사구(형용사구): perceptions 꾸밈", "on which ~ = <b>전치사 + 관계대명사</b> 관계절(형용사절): the surface 꾸밈. 원래 they are running on the surface"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 that절 안에 수식어가 줄줄이 붙어 매우 길어 보인다."}, {"t": "큰 뼈대부터 찾는다.", "sub": ["S: researchers (연구자들)", "V: began (begin 시작하다의 과거형)", "O: to believe ~ (믿기를). 믿는 내용은 that절", "gradually (점차)는 부사, As a result (그 결과)는 문장 전체를 꾸미는 부사구", "뼈대 = <b>researchers began to believe that ~</b>"]}, {"t": "that절 안의 뼈대를 찾는다.", "sub": ["S: runners (달리는 사람들)", "V: are able to adjust (be able to ~할 수 있다 + adjust 조절하다)", "O: leg stiffness (다리의 뻣뻣함). stiffness 뻣뻣함", "subconsciously (잠재의식적으로)는 부사"]}, {"t": "<b>prior to foot strike</b> (발이 땅에 닿기 전에)는 adjust를 꾸미는 전치사구다. prior to = ~에 앞서."}, {"t": "<b>based on their perceptions of the hardness or stiffness of the surface</b>는 '~에 근거해서'라는 과거분사구(부사적)다. perception (인식)이고, of 이하가 perceptions를 꾸민다. hardness 단단함."}, {"t": "<b>on which they are running</b>은 surface를 꾸미는 관계절이다. 원래 문장은 they are running on the surface (그들이 그 지면 위를 달리고 있다)다."}], "sum": "연구자들, 달리는 사람이 지면 인식에 따라 발이 닿기 전에 다리 뻣뻣함을 조절한다고 믿게 됨"}, {"i": "04", "q": "09", "s": "1", "title": "삽입절 + S+V+C(2형식) + 보어 to부정사 병렬 + by 동명사", "eng": "Traditionally, Kuhn claims, / the primary goal of historians of science was / 'to clarify<sup>1</sup> and deepen an understanding of contemporary<sup>2</sup> scientific methods or concepts / by displaying<sup>3</sup> their evolution<sup>4</sup>'.", "notes": [["1", "clarify", "명확히 하다"], ["2", "contemporary", "당대의, 현재의"], ["3", "display", "보여 주다, 드러내다"], ["4", "evolution", "발전, 진화"]], "lit": "전통적으로, Kuhn이 주장하기를, / 과학사가들의 주된 목표는 ~이었다 / '당대의 과학적 방법이나 개념에 대한 이해를 명확히 하고 깊게 하는 것 / 그것들의 발전 과정을 보여 줌으로써'.", "nat": "Kuhn의 주장에 따르면, 전통적으로 과학사가들의 주된 목표는 '당대의 과학적 방법이나 개념이 어떻게 발전해 왔는지를 보여 줌으로써 그것에 대한 이해를 명확히 하고 깊게 하는 것'이었다.", "ana": "콤마 두 개 사이에 낀 <b>Kuhn claims</b>는 문장의 뼈대가 아니라 <b>삽입절</b>이다. 원래는 <b>Kuhn claims that traditionally the primary goal ~ was ~</b>인데, 말하는 사람을 문장 가운데로 밀어 넣은 형태다. <b>he says · I think · they argue</b> 같은 표현이 콤마 사이에 들어오면 전부 이렇게 처리한다. <b>일단 지우고</b> 읽으면 <b>the primary goal was to clarify and deepen ~</b>이라는 <b>주어 + be동사 + 보어</b>의 단순한 구조가 드러난다. 이때 <b>to clarify</b>와 <b>deepen</b>은 <b>to</b>를 공유하는 <b>병렬</b>로, 두 번째 <b>to</b>가 생략된 것이다. 마지막 <b>by displaying</b>은 전치사 <b>by</b> 뒤라서 반드시 <b>동명사</b>가 온 것이며 '<b>~함으로써</b>'라는 <b>수단</b>을 나타낸다. <b>by to display</b>는 절대 쓸 수 없다.", "pe": "\u0001Traditionally\u0002, \u0001Kuhn claims\u0002, / the \u0001primary\u0002 goal \u0001of historians \u0001of science\u0002\u0002 was / 'to clarify<sup>1</sup> and deepen an understanding \u0001of contemporary<sup>2</sup> scientific methods or concepts\u0002 / \u0001by displaying<sup>3</sup> their evolution<sup>4</sup>\u0002'.", "pk": "\u0001전통적으로\u0002, \u0001Kuhn이 주장하기를\u0002, / \u0001과학사가들의\u0002 \u0001주된\u0002 목표는 ~이었다 / '\u0001당대의 과학적 방법이나 개념에 대한\u0002 이해를 명확히 하고 깊게 하는 것 / \u0001그것들의 발전 과정을 보여 줌으로써\u0002'.", "core": "주된 목표는 이해를 명확히 하고 깊게 하는 것이었다.", "tags": ["Traditionally = 부사: 문장 꾸밈. Kuhn claims = 삽입절 (~라고 Kuhn이 주장하기를): 문장 꾸밈", "주어 goal, 동사 was(SVC). primary = 형용사: goal 꾸밈. of historians of science = 전치사구(형용사구): goal 꾸밈", "보어 <b>to clarify and deepen</b> an understanding (to부정사 보어, 동사 병렬). of contemporary ~ = 전치사구(형용사구): understanding 꾸밈", "by displaying ~ = 전치사구(부사구): clarify and deepen 꾸밈 (수단). displaying은 전치사 by의 목적어(동명사)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 삽입절이 앞에 있고 보어가 긴 to부정사라서 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the primary goal (주된 목표). of historians of science (과학사가들의)는 goal을 꾸미는 전치사구", "V: was (be ~이었다)", "C: to clarify and deepen an understanding ~ (~에 대한 이해를 명확히 하고 깊게 하는 것)", "뼈대 = <b>the primary goal was to clarify and deepen ~</b>"]}, {"t": "문장 앞 <b>Kuhn claims</b>는 삽입절이다 (Kuhn이 주장하기를). Traditionally (전통적으로)는 문장 전체를 꾸미는 부사다. 삽입절은 빼고 읽는다.", "sub": ["S: Kuhn (사람 이름), V: claims (claim 주장하다)"]}, {"t": "보어 안의 구조를 본다. to부정사의 동사 두 개가 and로 병렬된다.", "sub": ["clarify (명확히 하다), deepen (깊게 하다)", "O: an understanding of contemporary scientific methods or concepts (당대의 과학적 방법이나 개념에 대한 이해). contemporary 당대의"]}, {"t": "<b>by displaying their evolution</b>은 clarify and deepen을 꾸미는 수단의 전치사구다. by 뒤 displaying은 동명사다. 'their evolution (그것들의 발전)을 보여 줌으로써'라는 뜻이고, their = methods or concepts다. display (보여 주다), evolution (발전)."}], "sum": "Kuhn에 따르면 과학사가의 전통적 목표, 발전 과정을 보여 줘 당대 방법·개념의 이해를 깊게 하는 것"}, {"i": "05", "q": "09", "s": "A-1", "title": "S+V+C(2형식) + 계속적 관계절(none of which)", "eng": "Some discoveries seem to entail<sup>1</sup> numerous phases<sup>2</sup> and discoverers, / none of which can be identified as definitive<sup>3</sup>.", "notes": [["1", "entail", "수반하다"], ["2", "phase", "단계, 국면"], ["3", "definitive", "확정적인, 결정적인"]], "lit": "어떤 발견들은 수많은 단계와 수많은 발견자를 수반하는 것으로 보인다, / 그런데 그중 어느 것도 확정적이라고 특정할 수 없다.", "nat": "어떤 발견들은 수많은 단계와 수많은 발견자를 거치는 것으로 보이는데, 그중 어느 하나도 결정적인 것이라고 딱 집어낼 수 없다.", "ana": "<b>seem to V</b>는 '<b>~인 것처럼 보이다</b>'로, <b>It seems that ~</b>으로 바꿔 쓸 수 있다. 단정하지 않고 한 발 물러서는 표현이라 학술적인 글에 자주 나온다. 이 문장의 핵심은 뒤쪽의 <b>none of which</b>다. <b>수량표현 + of + 관계대명사</b> 형태로, 앞의 <b>numerous phases and discoverers</b>를 받아 '<b>그런데 그중 어느 것도 ~않다</b>'로 이어 읽는다. 여기서 <b>none of them</b>은 절대 올 수 없다. 접속사 없이 두 문장을 이으려면 <b>대명사가 아니라 관계대명사</b>가 있어야 하기 때문이다. <b>none of which · both of which · some of whom</b>처럼 이 자리에 오는 형태를 통째로 익혀 두면 좋다. 마지막의 <b>can be identified</b>는 <b>발견이 특정되는 쪽</b>이므로 <b>수동태</b>가 왔다.", "pe": "Some discoveries seem to entail<sup>1</sup> \u0001numerous\u0002 phases<sup>2</sup> and discoverers, / \u0001none of which can be identified as definitive<sup>3</sup>\u0002.", "pk": "어떤 발견들은 수많은 단계와 수많은 발견자를 수반하는 것으로 보인다, / \u0001그런데 그중 어느 것도 확정적이라고 특정할 수 없다\u0002.", "core": "어떤 발견들은 단계와 발견자를 수반하는 것으로 보인다.", "tags": ["주어 Some discoveries, 동사 seem to entail(~하는 것으로 보인다), 목적어 phases and discoverers. numerous = 형용사: 둘 다 꾸밈", "none of which ~ = <b>계속적 용법</b> 관계절(형용사절): phases and discoverers를 받음 (그런데 그중 어느 것도). can be identified는 수동태"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b> 뒤에 none of which 관계절이 붙은 문장이다. seem 뒤의 to부정사가 보어다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Some discoveries (어떤 발견들)", "V: seem (seem ~인 듯하다, ~로 보이다)", "C: to entail numerous phases and discoverers (수많은 단계와 발견자들을 수반하는 것으로). seem은 보어를 요구하는 동사라서 to부정사를 보어로 본다 (문형 기준)", "entail 수반하다, numerous 수많은, phase 단계", "뼈대 = <b>Some discoveries seem to entail phases and discoverers</b>"]}, {"t": "<b>none of which can be identified as definitive</b>는 콤마 뒤 <b>계속적 관계절</b>이다. which = numerous phases and discoverers (수많은 단계와 발견자들)이고, '그런데 그중 어느 것도 ~'로 읽는다.", "sub": ["S: none of which (그중 어느 것도)", "V: can be identified (identify 특정하다의 수동태)", "as definitive (확정적인 것으로). definitive 확정적인"]}], "sum": "어떤 발견은 수많은 단계와 발견자를 거치며 그중 하나를 결정적이라 특정하기 어려움"}, {"i": "06", "q": "10", "s": "2", "title": "S+V+C(2형식) + 관계절 + 난이형용사 to부정사", "eng": "Issues that can be expressed in quantitative<sup>1</sup>, measurable<sup>2</sup> units / are easy to slice<sup>3</sup>.", "notes": [["1", "quantitative", "정량적인, 양적인"], ["2", "measurable", "측정 가능한"], ["3", "slice", "얇게 썰다"]], "lit": "정량적이고 측정 가능한 단위로 표현될 수 있는 사안들은 / 얇게 썰기 쉽다.", "nat": "정량적이고 측정 가능한 단위로 나타낼 수 있는 사안은 잘게 쪼개기가 쉽다.", "ana": "짧지만 챙길 것이 세 가지나 있다. 첫째, <b>Issues</b> 뒤의 <b>that</b>은 바로 동사 <b>can be expressed</b>가 이어지므로 <b>주격 관계대명사</b>다. 둘째, 그 안이 <b>be + p.p.</b> 형태의 <b>수동태</b>인 이유는 <b>사안이 표현하는 쪽이 아니라 표현되는 쪽</b>이기 때문이다. 셋째, 문장의 진짜 동사는 관계사절이 끝난 뒤에 나오는 <b>are</b>이고, 선행사 <b>Issues</b>가 <b>복수</b>이므로 <b>is</b>가 아니라 <b>are</b>가 왔다. <b>관계사절이 길어지면 주어와 진짜 동사가 멀어진다</b>는 점을 늘 의식해야 한다. 마지막의 <b>easy to slice</b>도 눈여겨보자. <b>easy · difficult · hard</b> 같은 형용사 뒤의 <b>to부정사</b>는 목적어를 따로 쓰지 않는다. 원래 <b>slice the issues</b>인데 그 목적어가 이미 문장의 주어로 올라갔기 때문이다. <b>to slice it</b>이라고 쓰면 틀린다.", "pe": "Issues \u0001that can be expressed \u0001in quantitative<sup>1</sup>, measurable<sup>2</sup> units\u0002\u0002 / are easy \u0001to slice<sup>3</sup>\u0002.", "pk": "\u0001\u0001정량적이고 측정 가능한 단위로\u0002 표현될 수 있는\u0002 사안들은 / \u0001얇게 썰기\u0002 쉽다.", "core": "사안들은 쉽다.", "tags": ["주어 Issues. that can be ~ = 관계절(형용사절): Issues 꾸밈. in ~ units = 전치사구(부사구): expressed 꾸밈. can be expressed는 수동태", "동사 are, 보어 easy(SVC). to slice = to부정사(부사적: easy 한정, ~하기에). 주어 Issues가 slice의 의미상 목적어 (난이형용사)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어가 관계절을 달고 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Issues (사안들)", "V: are (be ~이다)", "C: easy (쉬운)", "뼈대 = <b>Issues are easy</b>"]}, {"t": "주어 뒤 <b>that can be expressed in quantitative, measurable units</b>는 Issues를 꾸미는 관계절이다.", "sub": ["S: that (= Issues), V: can be expressed (express 표현하다의 수동태)", "in quantitative, measurable units (정량적이고 측정 가능한 단위로). quantitative 정량적인, measurable 측정 가능한"]}, {"t": "<b>to slice</b>는 easy를 꾸미는 to부정사(부사적)다. '쪼개기에 쉬운'이라는 뜻이다. slice (얇게 썰다, 잘게 나누다). 주어 Issues가 slice의 목적어에 해당한다 (쉬운 형용사 + to부정사)."}, {"t": "함정: 관계절 안에 동사 can be expressed가 있어서 진짜 동사를 놓치기 쉽다. 문장의 동사는 are다."}], "sum": "정량적·측정 가능한 단위로 표현되는 사안은 쪼개기 쉬움"}, {"i": "07", "q": "11", "s": "2", "title": "S+V(1형식) + but절 수동태 S+V(1형식)", "eng": "You've never murdered<sup>1</sup>, / but your murderer's rage<sup>2</sup> will be drawn<sup>3</sup> / from memories of your own extreme anger.", "notes": [["1", "murder", "살해하다"], ["2", "rage", "격노, 분노"], ["3", "draw from", "~에서 끌어오다"]], "lit": "당신은 결코 살인을 해 본 적이 없다, / 그러나 당신이 만든 살인자의 격노는 끌어와질 것이다 / 당신 자신의 극도의 분노에 대한 기억으로부터.", "nat": "당신은 한 번도 살인을 해 본 적이 없지만, 당신이 만든 살인자의 격노는 당신 자신이 극도로 화났던 기억에서 끌어온 것이 될 것이다.", "ana": "<b>You've never murdered</b>는 <b>have + p.p.</b> 형태의 <b>현재완료</b>이고, <b>never</b>가 붙었으므로 '<b>지금까지 한 번도 ~해 본 적이 없다</b>'는 <b>경험</b> 용법이다. <b>ever · never · before · once</b> 같은 말이 함께 오면 경험이라고 보면 거의 맞다. 여기서 <b>You didn't murder</b>라고 쓰지 않은 이유가 중요하다. <b>과거시제</b>는 '<b>그때 안 ap": false, "e": "(A)의 <b>Some discoveries seem to entail numerous phases</b>는 <b>발견자를 특정할 수 있는가</b>라는 물음이 먼저 나와야 성립한다. 그 물음은 (B) 끝에 있다."}, {"n": "②", "t": "(B) - (A) - (C)", "a": true, "x": false, "trap": false, "e": "주어진 글의 <b>전통적 목표</b> → (B)의 <b>This entailed ~</b> → (B) 끝의 <b>정확히 특정할 수 있는가</b>라는 물음 → (A)의 <b>none of which can be identified as definitive</b>라는 답 → (C)의 <b>Nor ~</b>로 빈틈없이 이어진다."}, {"n": "③", "t": "(B) - (C) - (A)", "a": false, "x": true, "trap": true, "e": "(C)의 <b>Most importantly, however</b>는 <b>결함을 다 열거한 뒤 마지막 하나를 강조</b>하는 표현이다. (A)를 뒤로 보내면 강조가 끝난 뒤에 다시 열거가 이어지는 셈이 된다. - 가장 많이 걸리는 오답"}, {"n": "④", "t": "(C) - (A) - (B)", "a": false, "x": true, "trap": false, "e": "(C)의 첫 단어 <b>Nor</b>는 앞에 <b>부정적 지적</b>이 있어야 쓸 수 있다. 주어진 글은 전통적 목표를 <b>소개</b>했을 뿐 비판하지 않았다."}, {"n": "⑤", "t": "(C) - (B) - (A)", "a": false, "x": true, "trap": false, "e": "(B)의 <b>This</b>가 (C)의 내용을 받으면 <b>전통적 관점이 인정하지 않는 것</b>을 <b>서술하는 일을 수반했다</b>는 뜻이 되어 말이 되지 않는다."}], "w": [["traditionally", "전통적으로"], ["primary goal", "주된 목표"], ["historian", "역사가"], ["clarify", "명확히 하다"], ["contemporary", "당대의, 현재의"], ["display", "보여 주다, 드러내다"], ["evolution", "발전, 진화"], ["entail", "수반하다"], ["relate", "이야기하다, 서술하다"], ["progressive accumulation", "점진적 축적"], ["breakthrough", "획기적 발전"], ["relevant", "유의미한, 관련 있는"], ["fault", "결함, 흠"], ["apparent", "분명한, 명백한"], ["identify", "확인하다, 특정하다"], ["precisely", "정확하게"], ["numerous", "수많은"], ["phase", "단계, 국면"], ["definitive", "확정적인, 결정적인"], ["present-day", "오늘날의"], ["recognise", "인정하다"], ["non-intellectual", "비지성적인"], ["institutional", "제도적인"], ["socio-economic", "사회 경제적인"], ["blind to", "~을 보지 못하는"], ["frame", "틀 지우다, 규정하다"], ["be subject to", "~의 영향을 받다"]]}, {"q": "10", "type": "문장 삽입", "src": "2023학년도 수능 39번", "ans": "④", "tr": [["1", "협상가는 큰 사안을 더 작은 조각으로 얇게 써는 방법을 찾으려 애써야 하는데, 이를 살라미 전술이라고 한다."], ["2", "정량적이고 측정 가능한 단위로 표현할 수 있는 사안은 얇게 썰기 쉽다."], ["3", "예를 들어 보상 요구는 시간당 몇 센트 단위로 나눌 수 있고, 임대료는 제곱피트당 몇 달러로 매길 수 있다."], ["4", "원칙이나 선례에 관한 사안을 세분하려 할 때, 당사자들은 시간 지평(그 원칙이 언제부터 효력을 발휘하는지, 또는 얼마나 오래 지속되는지)을 사안을 세분하는 방법으로 쓸 수 있다."], ["5", "【주어진 문장】 합의 조건을 몇 달 뒤에야 이행하면 되는 경우에는 합의에 이르기가 더 쉬울 수 있다."], ["6", "또 다른 접근법은 그 원칙이 적용될 수 있는 방식의 수를 다양하게 하는 것이다."], ["7", "예를 들어 회사는 직원의 직계 가족이 아플 때 한 달에 한 번 이내로, 세 시간을 넘지 않는 범위에서 회사를 비울 수 있게 해 주는 가족 비상 휴가 제도를 만들 수 있다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "When working to fractionate issues of principle or precedent, parties may use the time horizon (when the principle goes into effect or how long it will last) as a way to fractionate the issue."}, {"en": false, "h": "문장 삽입은 <b>주어진 문장이 어떤 화제 안에 있는가</b>를 먼저 잡아야 한다. 주어진 문장의 핵심어는 <b>settlement terms don't have to be implemented until months in the future</b>, 즉 <b>시간</b>이다. 그렇다면 <b>시간</b>을 다루는 대목 바로 뒤에 들어가야 한다. 4번 문장이 정확히 그 대목으로, <b>time horizon</b>(언제부터 효력이 생기는지, 얼마나 오래 가는지)을 사안을 쪼개는 방법으로 제시한다. 주어진 문장은 그 방법이 <b>왜 효과가 있는지</b>를 설명해 주는 문장이다. 게다가 바로 다음의 <b>Another approach is to vary the number of ways ~</b>가 결정적이다. <b>Another</b>(또 다른)는 <b>앞에서 하나의 방법에 대한 설명이 완결되었을 때만</b> 쓸 수 있다. 시간 이야기가 끝나고 나서 <b>또 다른 방법</b>으로 넘어가야 자연스러우므로 정답은 <b>④</b>다."}], "opts": [{"n": "①", "t": "1번 문장 뒤", "a": false, "x": true, "trap": false, "e": "살라미 전술이 무엇인지 소개하자마자 <b>합의 조건의 이행 시기</b> 이야기가 튀어나오면, 아직 나오지도 않은 <b>시간 지평</b>을 앞질러 말하는 셈이 된다."}, {"n": "②", "t": "2번 문장 뒤", "a": false, "x": true, "trap": false, "e": "2번은 <b>정량적으로 측정 가능한 사안</b>을 다룬다. 뒤의 3번이 <b>For example</b>로 그 예를 드는 자리이므로, 그 사이를 갈라놓으면 예시가 붕 뜬다."}, {"n": "③", "t": "3번 문장 뒤", "a": false, "x": true, "trap": false, "e": "3번은 <b>시간당 센트</b>·<b>제곱피트당 달러</b>처럼 <b>수량 단위</b>의 예다. 이 흐름이 4번의 <b>원칙·선례</b>로 넘어가야 하는데, 그 사이에 시간 이야기를 끼우면 4번의 <b>time horizon</b>이 반복이 된다."}, {"n": "④", "t": "4번 문장 뒤", "a": true, "x": false, "trap": false, "e": "4번의 <b>time horizon</b>이라는 화제를 주어진 문장이 이어받아 <b>왜 시간을 미루면 합의가 쉬워지는지</b>를 설명하고, 그다음 <b>Another approach</b>로 화제가 바뀐다."}, {"n": "⑤", "t": "6번 문장 뒤", "a": false, "x": true, "trap": true, "e": "6번에서 이미 <b>Another approach</b>로 넘어갔고, 7번은 그 <b>또 다른 방법</b>의 예다. 그 사이에 시간 이야기를 넣으면 예시가 앞 문장과 끊긴
