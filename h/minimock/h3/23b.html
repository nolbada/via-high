<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

sire to do a job well for its own sake. / Craftsmanship cuts a far wider swath than skilled manual labor; it serves the computer programmer, the doctor, and the artist; parenting improves when it is practiced as a skilled craft, as does citizenship. / Social and economic conditions, however, often stand in the way of the craftsman’s discipline and commitment: schools may fail to provide the tools to do good work, and workplaces may not truly value the aspiration for quality. / The craftsman often faces conflicting objective standards of excellence; the desire to do something well for its own sake can be weakened by competitive pressure, by frustration, or by obsession.", "ev_ko": [[2, "장인 정신은 지속적이고 기본적인 인간의 충동, 즉 일 그 자체를 위해 일을 잘하고자 하는 욕구를 가리킨다."], [3, "장인 정신은 숙련된 육체노동보다 훨씬 더 넓은 영역을 차지하는데, 그것은 컴퓨터 프로그래머, 의사, 그리고 예술가에게 도움이 되고, 양육은 숙련된 기술로서 행해질 때 나아지며, 시민 의식도 그러하다."], [5, "그러나 사회적, 경제적 조건은 흔히 장인의 규율과 헌신을 가로막는데, 학교는 일을 잘하기 위한 도구를 제공하지 못할 수 있고, 직장은 품질에 대한 열망을 진정으로 소중히 여기지 않을 수 있다."], [7, "장인은 흔히 서로 충돌하는 객관적인 탁월함의 기준에 직면하며, 무언가를 그 자체를 위해 잘하고자 하는 욕구는 경쟁의 압박, 좌절, 또는 집착에 의해 약해질 수 있다."]], "why": ["(1)은 장인 정신이 산업 사회와 함께 쇠퇴했다는 생각이 <b>오해<\/b>라고 말해요", "(2)는 장인 정신이 <b>enduring<\/b>(지속적인) 인간의 충동이라고 해요", "(3)은 프로그래머, 의사, 예술가, 양육, 시민 의식까지 여러 영역을 들어요", "그래서 (A)에는 <b>persisted<\/b>(지속되어 왔다)가 들어가요", "(5)는 사회적, 경제적 조건이 장인의 규율과 헌신을 <b>stand in the way of<\/b>(가로막는다)고 해요", "(7)은 잘하고 싶은 욕구가 경쟁의 압박, 좌절, 집착으로 <b>weakened<\/b>(약해질) 수 있다고 해요", "그래서 (B)에는 <b>limit<\/b>(제한하다)가 들어가요", "답은 ①이에요."], "ch": [{"n": "①", "t": "persisted …… limit", "g": "지속되어 왔다 …… 제한하다", "ok": true, "e": ["(A)는 (2)의 <b>enduring<\/b>(지속적인)과 맞아요", "(B)는 (5)의 <b>stand in the way of<\/b>(가로막다), (7)의 <b>can be weakened<\/b>(약해질 수 있다)와 맞아요."]}, {"n": "②", "t": "persisted …… cultivate", "g": "지속되어 왔다 …… 기르다", "ok": false, "e": ["(A)는 맞아요", "하지만 cultivate는 '기르다'라는 뜻이에요", "(5)와 (7)은 장인 정신을 <b>가로막고 약하게 하는<\/b> 요인을 말하므로 (B)와 맞지 않아요."]}, {"n": "③", "t": "evolved …… accelerate", "g": "진화해 왔다 …… 가속하다", "ok": false, "e": ["글은 장인 정신이 진 ous' in tone (어조가 진지한, tone 어조)"]}, {"t": "<b>sticking to the 'rules' of balance</b>는 <b>분사구문</b>이다. '균형이라는 규칙을 고수하면서'(stick to ~를 고수하다, balance 균형)이다.", "sub": ["의미상 주어 = current affairs programmes"]}, {"t": "<b>in which we are invited to consider ...</b>은 <b>idiom을 꾸미는 관계절</b>이다. in which = in the idiom (그 화법 안에서)이다.", "sub": ["we are invited to consider = 우리는 생각해 보도록 초대받는다 (invite 초대하다, consider 생각하다)", "the impact of particular news items = 특정 뉴스 항목의 영향 (impact 영향, particular 특정한)", "from the perspective of the 'average person in the street' = '거리의 평범한 사람'의 관점에서 (perspective 관점)"]}], "sum": "시사 프로그램은 진지하지만, 대중 프로그램은 평범한 시선의 가벼운 화법"}, {"i": "03", "q": "08", "s": "1", "title": "S+V+O + 삽입 while절 (진행형 수동)", "eng": "Introduction<sup>1</sup> of robots into factories, / while employment<sup>2</sup> of human workers is being reduced<sup>3</sup>, / creates worry<sup>4</sup> and fear.", "notes": [["1", "introduction", "도입"], ["2", "employment", "고용"], ["3", "reduce", "줄이다"], ["4", "worry", "걱정"]], "lit": "공장에 로봇을 도입하는 것은, / 인간 노동자의 고용이 줄어들고 있는 가운데, / 걱정과 두려움을 만들어 낸다.", "nat": "인간 노동자의 고용이 줄어드는 가운데 공장에 로봇을 들여오는 일은 걱정과 두려움을 낳는다.", "ana": "콤마 두 개 사이의 <b>while ~ reduced</b>를 <b>먼저 지우고</b> 읽어야 뼈대가 보인다. 지우면 <b>Introduction creates worry and fear</b>라는 단순한 <b>3형식</b>이 남는다. 주어가 <b>Introduction</b>이라는 <b>단수</b>이기 때문에 동사에 <b>-s</b>가 붙어 <b>creates</b>가 되었다. 바로 앞의 <b>factories</b>나 <b>workers</b>가 복수라서 <b>create</b>로 착각하기 쉬운데, 동사의 수는 <b>진짜 주어</b>에만 맞춘다. 삽입절 안의 <b>is being reduced</b>는 <b>be동사 + being + p.p.</b>, 즉 <b>진행형 수동태</b>다. '<b>줄어들고 있는 중이다</b>'처럼 <b>지금 진행 중</b>이라는 뜻이 더해진 형태이며, <b>is reduced</b>(줄어든다)와 구별해서 읽어야 한다.", "pe": "Introduction<sup>1</sup> \u0001of robots into factories\u0002, / \u0001while employment<sup>2</sup> of human workers is being reduced<sup>3</sup>\u0002, / creates worry<sup>4</sup> and fear.", "pk": "\u0001공장에 로봇을\u0002 도입하는 것은, / \u0001인간 노동자의 고용이 줄어들고 있는 가운데\u0002, / 걱정과 두려움을 만들어 낸다.", "core": "도입은 걱정과 두려움을 만들어 낸다.", "tags": ["주어 Introduction. of robots into factories = 전치사구(형용사구): Introduction 꾸밈. 동사가 나올 때까지 기다림", "while ~ = 부사절(동시·대조): creates 꾸밈. 주어와 동사 사이에 삽입. <b>is being reduced</b> = 진행형 수동태", "동사 creates, 목적어 worry and fear"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 주어와 동사 사이에 while절이 통째로 끼어 길어 보인다."}, {"t": "삽입절을 빼고 뼈대부터 찾는다.", "sub": ["S: Introduction of robots into factories (공장에 로봇을 도입하는 것, introduction 도입, robot 로봇, factory 공장)", "V: creates (create 만들어 내다)", "O: worry and fear (걱정과 두려움, worry 걱정, fear 두려움)", "뼈대 = <b>Introduction of robots into factories creates worry and fear</b>", "주어 Introduction이 단수라서 creates이다."]}, {"t": "콤마 사이 <b>while employment of human workers is being reduced</b>는 <b>대조·동시의 부사절 삽입</b>이다. '인간 노동자의 고용이 줄어드는 가운데'라는 뜻이다.", "sub": ["S: employment of human workers (인간 노동자의 고용, employment 고용, worker 노동자)", "V: is being reduced (reduce 줄이다, 진행형 수동태)", "is being reduced는 '줄어들고 있다'"]}, {"t": "함정: 삽입된 while절 안의 is being reduced를 문장 동사로 착각하지 않는다. 문장 동사는 creates이다."}], "sum": "고용이 줄어드는 가운데 공장 로봇 도입은 걱정과 두려움을 낳음"}, {"i": "04", "q": "08", "s": "6", "title": "이유 Since절 + S+V(수동) + where절", "eng": "Since robots are particularly<sup>1</sup> good at highly repetitive<sup>2</sup> simple motions, / the replaced<sup>3</sup> human workers should be moved to positions / where judgment<sup>4</sup> and decisions beyond the abilities of robots are required<sup>5</sup>.", "notes": [["1", "particularly", "특히"], ["2", "repetitive", "반복적인"], ["3", "replace", "대체하다"], ["4", "judgment", "판단"], ["5", "require", "요구하다, 필요로 하다"]], "lit": "로봇은 대단히 반복적인 단순 동작에 특히 능하므로, / 대체된 인간 노동자들은 자리로 옮겨져야 한다 / 로봇의 능력을 넘어서는 판단과 결정이 요구되는.", "nat": "로봇은 아주 반복적인 단순 동작에 특히 뛰어나므로, 자리를 내준 인간 노동자들은 로봇의 능력 밖에 있는 판단과 결정이 필요한 자리로 옮겨져야 한다.", "ana": "맨 앞의 <b>Since</b>는 '<b>~ 이래로</b>'가 아니라 '<b>~이므로</b>'라는 <b>이유</b>다. 뒤에 <b>결론</b>에 해당하는 주절이 오면 이유로 읽는다. 주절의 <b>the replaced human workers</b>에서 <b>replaced</b>는 <b>workers</b>를 앞에서 꾸미는 <b>과거분사</b>로, <b>노동자가 대체된</b> 쪽이므로 수동의 뜻이다. 뒤의 <b>where</b>가 이 문장의 핵심이다. 선행사가 <b>positions</b>라는 <b>장소</b>이고, <b>where</b> 뒤에 <b>judgment and decisions ~ are required</b>라는 <b>완전한 문장</b>이 온다. 이 두 가지가 맞아떨어지면 <b>관계부사</b>다. 만약 <b>which</b>였다면 뒤에 빠진 자리가 있어야 한다. 중간의 <b>beyond the abilities of robots</b>는 <b>judgment and decisions</b>를 꾸미는 전치사구라, 이것을 지우면 주어와 동사 <b>are required</b>가 곧바로 붙는다.", "pe": "\u0001Since robots are particularly<sup>1</sup> good at highly repetitive<sup>2</sup> simple motions\u0002, / the \u0001replaced<sup>3</sup> human\u0002 workers should be moved \u0001to positions\u0002 / \u0001where judgment<sup>4</sup> and decisions beyond the abilities of robots are required<sup>5</sup>\u0002.", "pk": "\u0001로봇은 대단히 반복적인 단순 동작에 특히 능하므로\u0002, / \u0001대체된 인간\u0002 노동자들은 \u0001자리로\u0002 옮겨져야 한다 / \u0001로봇의 능력을 넘어서는 판단과 결정이 요구되는\u0002.", "core": "노동자들은 자리로 옮겨져야 한다.", "tags": ["Since ~ = 부사절(이유): 주절 꾸밈. be good at = ~에 능하다. particularly = 부사: good 꾸밈", "주어 workers, 동사 should be moved(수동태). replaced, human = 형용사: workers 꾸밈. to positions = 부사구: moved 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "where ~ = 관계부사절(형용사절): positions 꾸밈. 안쪽: 주어 judgment and decisions(복수), 동사 are required(수동태)"], "steps": [{"t": "이 문장은 <b>이유 부사절 + S+V(수동, 1형식)</b>이다. 뒤에 관계부사절이 붙어 길어 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: the replaced human workers (대체된 인간 노동자들, replace 대체하다)", "V: should be moved (move 옮기다, should ~해야 한다, 수동태)", "to positions (자리로, position 자리)", "뼈대 = <b>the replaced human workers should be moved to positions</b> (문형 기준: 수동태 주절은 1형식)", "replaced는 workers를 앞에서 꾸미는 과거분사"]}, {"t": "맨 앞 <b>Since robots are particularly good at highly repetitive simple motions</b>는 <b>이유의 부사절</b>이다. '~이므로'라는 뜻이다. '~이래로'가 아니다.", "sub": ["S: robots (로봇들)", "V: are (be ~이다)", "C: particularly good at highly repetitive simple motions (아주 반복적인 단순 동작에 특히 능한, particularly 특히, repetitive 반복적인, motion 동작)"]}, {"t": "<b>where judgment and decisions beyond the abilities of robots are required</b>는 <b>positions를 꾸미는 관계부사절</b>이다. where = in the positions (그런 자리에서)이다.", "sub": ["S: judgment and decisions (판단과 결정, judgment 판단, decision 결정)", "beyond the abilities of robots = 로봇의 능력을 넘어서는 (beyond ~을 넘어서, ability 능력)", "V: are required (require 요구하다, 수동태)"]}], "sum": "로봇이 단순 반복에 능하니, 대체된 노동자는 판단이 필요한 자리로 이동"}, {"i": "05", "q": "09", "s": "3", "title": "S+V+O ; S+V+O ; S+V + when절 + as does", "eng": "Craftsmanship<sup>1</sup> cuts a far wider swath<sup>2</sup> than skilled manual labor<sup>3</sup>; / it serves the computer programmer, the doctor, and the artist; / parenting<sup>4</sup> improves / when it is practiced as a skilled craft, / as does citizenship<sup>5</sup>.", "notes": [["1", "craftsmanship", "장인 정신"], ["2", "cut a wide swath", "넓은 영역을 아우르다"], ["3", "manual labor", "육체노동"], ["4", "parenting", "양육"], ["5", "citizenship", "시민의 자질, 시민의 역할"]], "lit": "장인 정신은 숙련된 육체노동보다 훨씬 더 넓은 영역을 아우른다; / 그것은 컴퓨터 프로그래머와 의사와 예술가에게도 쓸모가 있다; / 양육은 더 나아진다 / 그것이 숙련된 기예로서 행해질 때, / 시민의 역할도 마찬가지다.", "nat": "장인 정신은 숙련된 육체노동보다 훨씬 더 넓은 영역을 아우른다. 컴퓨터 프로그래머에게도, 의사에게도, 예술가에게도 쓸모가 있다. 양육도 숙련된 기예처럼 다루면 나아지고, 시민의 역할 또한 그렇다.", "ana": "세미콜론 두 개가 사실상 <b>and</b>를 대신해 <b>세 덩어리</b>를 잇고 있다. 세미콜론은 <b>온전한 문장끼리</b>만 이을 수 있으므로, 각 덩어리에 주어와 동사가 하나씩 있는지 확인하면서 읽으면 된다. 진짜 볼 것은 맨 끝의 <b>as does citizenship</b>이다. 여기서 <b>does</b>는 앞에 나온 <b>improves</b>를 대신하는 <b>대동사</b>이고, <b>as</b> 뒤에서 <b>동사가 주어 앞으로 나가는 도치</b>가 일어났다. 원래 순서는 <b>as citizenship does (improve)</b>이며, '<b>시민의 역할도 그러하다</b>'라는 뜻이다. <b>so does · neither does</b>와 같은 계열이라 묶어서 외워 두면 좋다. <b>a far wider swath</b>의 <b>far</b>는 '멀리'가 아니라 비교급을 강조하는 <b>훨씬</b>이고, <b>much · even · still · a lot</b>이 같은 자리에 들어갈 수 있다.", "pe": "Craftsmanship<sup>1</sup> cuts a \u0001far wider\u0002 swath<sup>2</sup> \u0001than skilled manual labor<sup>3</sup>\u0002; / it serves the computer programmer, the doctor, and the artist; / parenting<sup>4</sup> improves / \u0001when it is practiced as a skilled craft\u0002, / \u0001as does citizenship<sup>5</sup>\u0002.", "pk": "장인 정신은 \u0001숙련된 육체노동보다\u0002 \u0001훨씬 더 넓은\u0002 영역을 아우른다; / 그것은 컴퓨터 프로그래머와 의사와 예술가에게도 쓸모가 있다; / 양육은 더 나아진다 / \u0001그것이 숙련된 기예로서 행해질 때\u0002, / \u0001시민의 역할도 마찬가지다\u0002.", "core": "장인 정신은 영역을 아우르고, 그것은 사람들에게 쓸모가 있고, 양육은 더 나아진다.", "tags": ["주어 Craftsmanship, 동사 cuts, 목적어 swath. far wider = 형용사: swath 꾸밈 (far = 부사, 비교급 강조). than ~ = 비교 부사구: wider 꾸밈", "세미콜론(;)으로 절 병렬. 주어 it, 동사 serves, 목적어 the programmer, the doctor, the artist", "세 번째 절: 주어 parenting, 동사 improves(1형식)", "when ~ = 부사절(시간): improves 꾸밈. is practiced as a skilled craft = 수동태 + as(~로서)", "as does citizenship = 부사절(양태): improves 꾸밈. <b>as + 도치</b>: does가 improves 대신(대동사)"], "steps": [{"t": "이 문장은 세미콜론으로 이어진 <b>세 개의 문장</b>이다. 세 문장이 이어져 길어 보인다."}, {"t": "첫째 문장의 뼈대는 다음과 같다.", "sub": ["S: Craftsmanship (장인 정신)", "V: cuts (cut a swath 넓은 영역을 차지하다)", "O: a far wider swath (훨씬 더 넓은 영역, swath 영역, wider 더 넓은)", "than skilled manual labor = 숙련된 육체노동보다 (skilled 숙련된, manual labor 육체노동)"]}, {"t": "둘째 문장의 뼈대는 다음과 같다.", "sub": ["S: it (= Craftsmanship)", "V: serves (serve ~에게 쓸모가 있다/봉사하다)", "O: the computer programmer, the doctor, and the artist (프로그래머, 의사, 예술가 — 3개 병렬)"]}, {"t": "셋째 문장의 뼈대는 다음과 같다.", "sub": ["S: parenting (양육)", "V: improves (improve 나아지다)", "뼈대 = <b>parenting improves</b>", "when it is practiced as a skilled craft = 그것이 숙련된 기예로서 행해질 때 (it = parenting, practice 행하다, craft 기예)"]}, {"t": "끝의 <b>as does citizenship</b>은 '시민의 역할도 마찬가지이다'라는 뜻이다. 여기서 does는 improves를 대신하는 대동사이고 주어 citizenship (시민의 역할)이 뒤로 도치되었다.", "sub": ["원래 = as citizenship improves", "함정: does를 본동사 do로 읽지 않는다."]}], "sum": "장인 정신은 쓰임이 넓고, 양육도 시민 역할도 기예로 다루면 나아짐"}, {"i": "06", "q": "10", "s": "A-2", "title": "by v-ing + S+V+O + 사역동사 let", "eng": "And by letting<sup>1</sup> their thinking become more free, / they can improve<sup>2</sup> their chances / of discovering new unencumbered<sup>3</sup> perceptions<sup>4</sup> of old problems / or entirely<sup>5</sup> new creations.", "notes": [["1", "let", "~하게 놓아두다"], ["2", "improve", "높이다, 개선하다"], ["3", "unencumbered", "얽매이지 않은"], ["4", "perception", "인식, 지각"], ["5", "entirely", "완전히"]], "lit": "그리고 자기 생각이 더 자유로워지도록 놓아둠으로써, / 그들은 가능성을 높일 수 있다 / 오래된 문제에 대한 얽매이지 않은 새로운 인식을 발견할 / 또는 완전히 새로운 창조물을 발견할.", "nat": "그리고 자기 생각을 더 자유롭게 풀어 놓음으로써, 사람들은 오래된 문제를 얽매이지 않고 새롭게 보는 시각이나 아예 새로운 창조물을 발견할 가능성을 높일 수 있다.", "ana": "<b>by + 동명사</b>는 '<b>~함으로써</b>'라는 <b>수단</b>을 나타낸다. 그 안의 <b>letting</b>이 이 문장의 관문이다. <b>let</b>은 <b>사역동사</b>라서 목적격보어로 <b>동사원형</b>을 쓴다. 그래서 <b>letting their thinking become</b>이 되었고, <b>to become</b>이나 <b>becoming</b>으로 쓰면 틀린다. <b>make · have · let</b> 세 개를 한 묶음으로 외워 두자. 뒤의 <b>of discovering ~</b>은 <b>their chances</b>를 꾸미는 전치사구인데, <b>of</b>가 전치사라서 <b>동명사 discovering</b>이 왔다. 마지막 <b>or</b>는 <b>new unencumbered perceptions</b>와 <b>entirely new creations</b>라는 <b>명사 두 덩어리</b>를 이으며, 둘 다 <b>discovering</b>의 목적어다.", "pe": "And \u0001by letting<sup>1</sup> their thinking become more free\u0002, / they can improve<sup>2</sup> their chances / \u0001of discovering new unencumbered<sup>3</sup> perceptions<sup>4</sup> \u0001of old problems\u0002\u0002 / \u0001or entirely<sup>5</sup> new creations\u0002.", "pk": "그리고 \u0001자기 생각이 더 자유로워지도록 놓아둠으로써\u0002, / 그들은 가능성을 높일 수 있다 / \u0001\u0001오래된 문제에 대한\u0002 얽매이지 않은 새로운 인식을 발견할\u0002 / \u0001또는 완전히 새로운 창조물을 발견할\u0002.", "core": "그들은 가능성을 높일 수 있다.", "tags": ["And: 연결. by letting ~ = 전치사구(부사구): can improve 꾸밈 (수단). <b>let + 목적어 + 원형부정사</b>(become) + 보어 more free", "주어 they, 동사 can improve, 목적어 their chances", "of discovering ~ = 전치사구(형용사구): chances 꾸밈. discovering은 전치사 of의 목적어(동명사). of old problems = 형용사구: perceptions 꾸밈", "or: 병렬. entirely new creations = discovering의 목적어 ② (of-phrase의 일부). entirely = 부사: new 꾸밈"], "steps": [{"t": "이 문장은 <b>수단의 부사구 + S+V+O(3형식)</b>이다. 수단 부사구 안에 let이 있고 목적어 뒤 수식이 길어 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: they (그들 — 앞 문장이 없어 지칭 확인 불가)", "V: can improve (improve 높이다 + can ~할 수 있다)", "O: their chances (그들의 가능성, chance 가능성)", "뼈대 = <b>they can improve their chances</b>"]}, {"t": "맨 앞 <b>by letting their thinking become more free</b>는 <b>by + 동명사</b>로 '~함으로써'라는 수단이다.", "sub": ["let은 사역동사라서 O 뒤에 동사원형을 쓴다 (let O 원형: O가 ~하도록 놓아두다)", "letting their thinking become more free = 자기 생각이 더 자유로워지도록 놓아둠 (become ~이 되다, free 자유로운)", "let O C의 5형식이다."]}, {"t": "<b>of discovering new unencumbered perceptions of old problems or entirely new creations</b>는 chances를 꾸미는 <b>전치사 of + 동명사</b>이다.", "sub": ["discover 발견하다, unencumbered 얽매이지 않은, perception 인식, creation 창조물, entirely 완전히", "or는 <b>new unencumbered perceptions of old problems</b>와 <b>entirely new creations</b> 두 명사 덩어리를 잇는다"]}], "sum": "생각을 자유롭게 풀어 놓으면 새로운 시각·창조물 발견 가능성 상승"}, {"i": "07", "q": "10", "s": "B-4", "title": "S+V+O + 부사구 to the astonishment of", "eng": "Very quickly one little nine-year-old boy raised<sup>1</sup> his hand, / to the astonishment<sup>2</sup> of the teacher and the visitor<sup>3</sup>.", "notes": [["1", "raise", "들어 올리다"], ["2", "astonishment", "깜짝 놀람"], ["3", "visitor", "방문객"]], "lit": "아주 빠르게 아홉 살짜리 작은 소년 하나가 손을 들었다, / 교사와 방문객이 깜짝 놀라게도.", "nat": "아홉 살짜리 어린 소년 하나가 아주 빠르게 손을 들었고, 교사와 방문객은 깜짝 놀랐다.", "ana": "<b>nine-year-old</b>에 주목하자. 숫자와 단위가 <b>하이픈으로 묶여 형용사</b>가 되면 단위는 <b>단수</b>로 쓴다. <b>nine years old</b>는 서술어 자리에, <b>nine-year-old</b>는 명사 앞에 온다. 뒤의 <b>to the astonishment of ~</b>는 '<b>~가 놀랍게도</b>'라는 뜻으로, <b>to one's surprise · to one's delight · to one's disappointment</b>와 같은 <b>결과의 to</b> 구문이다. 전치사 <b>to</b>를 방향으로 읽으면 문장이 통째로 어긋난다. 이 구문은 감정을 느끼는 주체가 <b>of</b> 뒤에 오므로, 여기서는 <b>놀란 사람이 교사와 방문객</b>임을 정확히 짚어야 한다. 문두의 <b>Very quickly</b>는 동사를 꾸미는 부사구가 앞으로 나온 것일 뿐 도치는 아니다.", "pe": "\u0001Very quickly\u0002 one \u0001little nine-year-old\u0002 boy raised<sup>1</sup> his hand, / \u0001to the astonishment<sup>2</sup> of the teacher and the visitor<sup>3</sup>\u0002.", "pk": "\u0001아주 빠르게\u0002 \u0001아홉 살짜리 작은\u0002 소년 하나가 손을 들었다, / \u0001교사와 방문객이 깜짝 놀라게도\u0002.", "core": "소년이 손을 들었다.", "tags": ["Very quickly = 부사(구): raised 꾸밈. 주어 boy(little nine-year-old = 형용사: boy 꾸밈), 동사 raised, 목적어 his hand", "to the astonishment of ~ = 전치사구(부사구): raised 꾸밈 (~가 깜짝 놀라게도)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 짧은 문장이고 끝의 부사구만 알아 두면 된다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: one little nine-year-old boy (아홉 살짜리 작은 소년 하나, nine-year-old 아홉 살의)", "V: raised (raise 들다의 과거형)", "O: his hand (그의 손)", "뼈대 = <b>one little nine-year-old boy raised his hand</b>", "Very quickly 아주 빠르게"]}, {"t": "<b>nine-year-old</b>는 '숫자-단위-old'가 하이픈으로 묶여 <b>명사 앞 형용사</b>가 된 형태라서 year가 단수이다."}, {"t": "끝의 <b>to the astonishment of the teacher and the visitor</b>는 '교사와 방문객이 깜짝 놀랐을 만큼'이라는 <b>부사구</b>이다. to one's astonishment는 '~가 놀랍게도'이다.", "sub": ["astonishment 놀라움, teacher 교사, visitor 방문객"]}], "sum": "아홉 살 소년이 재빨리 손을 들어 교사와 방문객을 놀라게 함"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2022학년도 수능 32번", "ans": "⑤", "tr": [["1", "뉴스는, 특히 텔레비전으로 방송되는 형태에서, 주제와 이야기의 선택뿐 아니라 그 ______에 의해서도 만들어진다."], ["2", "뉴스를 보여 주는 방식은 정보를 전달하고 가르친다는 목적과 우리를 재미있게 붙잡아 두어야 한다는 필요 사이의 긴장 속에 놓여 왔다."], ["3", "시사 프로그램은 균형이라는 '규칙'을 지키느라 어조가 흔히 '진지'한 반면, 더 대중적인 프로그램은 친근하고 가벼운 화법을 택해 우리가 '거리의 평범한 사람'의 시선에서 특정 뉴스의 파장을 생각해 보도록 이끈다."], ["4", "실제로 오늘날의 뉴스 구성은 더 빠른 편집 속도와, 로고 사용·짧고 강렬한 발언·빠른 화면 전환·뉴스 진행자의 '스타성' 같은 더 '번쩍이는' 제시 방식에 점점 더 기대게 되었다."], ["5", "대중적인 형식은 옛 뉴스 형식의 긴 말 위주 설명을 견디려 하지 않는 시청자를 붙잡아 둠으로써 이해를 높인다고 말할 수 있다."], ["6", "그러나 그 형식은 뉴스 사건의 구조적 맥락을 제공하지 못함으로써 오히려 이해를 떨어뜨리는 쪽으로 작용한다고 볼 여지도 크다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "Indeed, contemporary news construction has come to rely on an increased use of faster editing tempos and 'flashier' presentational styles including the use of logos, sound-bites, rapid visual cuts and the 'star quality' of news readers."}, {"en": false, "h": "빈칸이 <b>글의 첫 문장</b>에 있으면, 그 뒤 전체가 빈칸의 <b>설명</b>이라고 보고 읽어야 한다. 1번은 <b>뉴스는 주제 선택뿐 아니라 그 ______에 의해서도 만들어진다</b>는 구조다. 그러니 빈칸에는 <b>주제 선택이 아닌 다른 무엇</b>이 들어가야 한다. 2번이 곧바로 <b>Presentational styles</b>(제시 방식)를 꺼내고, 3번이 <b>진지한 어조 vs 친근하고 가벼운 화법(idiom)</b>이라는 <b>말투</b>의 대비를 보여 준다. 그리고 4번이 결정타다. <b>editing tempos, logos, sound-bites, rapid visual cuts, star quality</b>는 모두 <b>말과 화면으로 전달하는 방식</b>이다. 즉 <b>말(verbal)</b>과 <b>영상(visual)</b> 두 갈래가 모두 나열되어 있으므로, 이 둘을 한 번에 묶은 ⑤ <b>verbal and visual idioms or modes of address</b>가 답이 된다. 3번의 <b>idiom</b>이라는 단어가 선지에 그대로 다시 나온다는 점도 강력한 단서다."}], "opts": [{"n": "①", "t": "전통적인 화면 표현 기법과의 조화", "a": false, "x": true, "trap": false, "e": "4번은 오히려 <b>더 빠르고 번쩍이는</b> 새 방식으로 옮겨 갔다고 말한다. <b>전통과의 조화</b>는 지문의 방향과 반대다."}, {"n": "②", "t": "최신 사안에 대한 신속하고 완전한 보도", "a": false, "x": true, "trap": false, "e": "<b>무엇을 얼마나 빨리 다루는가</b>는 1번이 이미 <b>choice of topics and stories</b>로 따로 언급했다. 빈칸은 그것 <b>말고</b> 무엇이냐를 묻고 있으므로 답이 될 수 없다."}, {"n": "③", "t": "제작자가 선호하는 교육적 미디어 콘텐츠", "a": false, "x": true, "trap": true, "e": "2번에 <b>informational-educational purpose</b>가 나오지만, 그것은 <b>재미</b>와 맞서는 <b>한쪽 극</b>일 뿐 글이 강조하는 답이 아니다. 게다가 <b>제작자의 선호</b>라는 말은 지문에 없다."}, {"n": "④", "t": "오래 이어져 온 뉴스 기준에 대한 헌신", "a": false, "x": true, "trap": false, "e": "글은 뉴스 기준이 지켜진다고 말하지 않는다. 3번의 <b>'rules' of balance</b>는 시사 프로그램의 특징으로 언급될 뿐이고, 흐름은 오히려 <b>가벼운 쪽으로의 이동</b>이다."}, {"n": "⑤", "t": "말과 영상으로 된 화법 또는 전달 방식", "a": true, "x": false, "trap": false, "e": "2번의 <b>Presentational styles</b>, 3번의 <b>idiom</b>, 4번의 <b>logos · sound-bites · visual cuts</b>가 모두 <b>말과 영상의 전달 방식</b>이라는 한 갈래로 모인다."}], "w": [["constitute", "구성하다, ~을 이루다"], ["televised", "텔레비전으로 방송되는"], ["presentational", "제시의, 보여 주는 방식의"], ["be subject to", "~에 놓이다, ~을 받기 쉽다"], ["tension", "긴장 (관계)"], ["informational", "정보의"], ["engage", "붙잡아 두다, 관심을 끌다"], ["entertainingly", "재미있게"], ["current affairs", "시사"], ["stick to", "~을 고수하다"], ["adopt", "택하다, 채택하다"], ["idiom", "화법, 어투"], ["perspective", "관점, 시각"], ["contemporary", "현대의, 동시대의"], ["construction", "구성, 짜임"], ["come to V", "~하게 되다"], ["rely on", "~에 기대다"], ["editing tempo", "편집 속도"], ["flashy", "번쩍이는, 화려한"], ["sound-bite", "짧고 강렬한 발언"], ["visual cut", "화면 전환"], ["news reader", "뉴스 진행자"], ["enhance", "높이다, 향상시키다"], ["unwilling", "꺼리는, 내키지 않는"], ["endure", "견디다"], ["verbal", "말의, 언어의"], ["orientation", "방향 설정, 안내"], ["arguably", "거의 틀림없이, 아마도"], ["structural", "구조적인"], ["context", "맥락"]]}, {"q": "08", "type": "문장 삽입", "src": "2022학년도 수능 38번", "ans": "③", "tr": [["1", "인간 노동자의 고용이 줄어드는 가운데 공장에 로봇을 들여오는 일은 걱정과 두려움을 낳는다."], ["2", "그런 두려움을 막거나 적어도 누그러뜨리는 것은 경영진의 책임이다."], ["3", "예를 들어 기존 조립 라인에서 사람을 대체하는 대신 새 공장에만 로봇을 도입할 수도 있다."], ["4", "노동자들은 그 과정에 참여할 수 있도록, 새 공장을 계획하거나 기존 공장에 로봇을 도입하는 일의 계획 단계에 포함되어야 한다."], ["5", "회사가 경쟁력을 유지하도록 제조 원가를 낮추기 위해 로봇이 필요할 수도 있지만, 그런 원가 절감 계획은 노동자 측과 경영진이 함께 세워야 한다."], ["6", "로봇은 대단히 반복적인 단순 동작에 특히 뛰어나므로, 자리를 내준 인간 노동자들은 로봇의 능력을 넘어서는 판단과 결정이 필요한 자리로 옮겨져야 한다."], ["7", "[주어진 문장] 회사 안의 새로운 자리에 맞게 현재 직원들을 재교육하는 것 또한 그들이 해고당할 것이라는 두려움을 크게 줄여 줄 것이다. → 3번 문장과 4번 문장 사이(③)에 들어간다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "For example, robots could be introduced only in new plants rather than replacing humans in existing assembly lines."}, {"en": false, "h": "문장 삽입은 <b>주어진 문장 안의 연결 신호</b>부터 잡는다. 여기서 신호는 <b>also</b>와 <b>their fear</b> 두 개다. <b>also</b>는 '<b>이것 말고 또 하나</b>'라는 뜻이므로, 앞에는 <b>두려움을 줄이는 방법이 이미 하나 나와 있어야</b> 한다. 그 방법이 바로 3번의 <b>새 공장에만 로봇을 도입한다</b>이다. 2번이 <b>경영진의 책임은 이 두려움을 막거나 누그러뜨리는 것</b>이라고 과제를 던지고, 3번이 <b>첫 번째 방법</b>, 주어진 문장이 <b>두 번째 방법(재교육)</b>이 되는 것이다. 뒤쪽도 맞아떨어진다. 4번은 <b>Workers should be included in the planning</b>으로 <b>또 다른 방법</b>을 이어 가므로, 주어진 문장이 3번과 4번 사이에 들어가야 흐름이 끊기지 않는다. 반대로 ④·⑤ 자리는 이미 <b>원가</b>와 <b>배치 전환</b>으로 화제가 옮겨 간 뒤라 <b>fear</b>를 다시 꺼낼 자리가 아니다."}], "opts": [{"n": "①", "t": "1번 문장 뒤", "a": false, "x": true, "trap": false, "e": "1번은 <b>걱정과 두려움이 생긴다</b>는 문제 제기다. 아직 <b>해결책</b>이 하나도 나오지 않았으므로 <b>also</b>(또한)를 쓸 수 없다."}, {"n": "②", "t": "2번 문장 뒤", "a": false, "x": true, "trap": true, "e": "2번은 <b>경영진이 두려움을 막아야 한다</b>는 원칙 선언이다. 여기에 바로 <b>재교육도 또한 ~</b>을 넣으면 <b>또한</b>이 가리킬 첫 번째 방법이 없다."}, {"n": "③", "t": "3번 문장 뒤", "a": true, "x": false, "trap": false, "e": "3번의 <b>새 공장에만 로봇을 도입한다</b>가 첫 번째 방법이고, 주어진 문장의 <b>재교육</b>이 <b>also</b>로 이어지는 두 번째 방법이다."}, {"n": "④", "t": "4번 문장 뒤", "a": false, "x": true, "trap": false, "e": "4번은 <b>노동자를 계획 단계에 포함시키라</b>는 또 다른 방법이고, 5번은 <b>원가</b>로 화제가 넘어간다. 이 사이에 두려움 이야기를 다시 넣으면 5번의 <b>It may be that ~</b>과 연결이 끊긴다."}, {"n": "⑤", "t": "5번 문장 뒤", "a": false, "x": true, "trap": false, "e": "5번은 <b>원가 절감 계획은 함께 세우라</b>는 내용이고 6번은 <b>배치 전환</b>이다. 이미 <b>두려움</b>이라는 화제에서 두 단계나 멀어진 자리다."}], "w": [["retrain", "재교육하다"], ["current employee", "현재 직원"], ["lay off", "해고하다"], ["introduction", "도입"], ["employment", "고용"], ["reduce", "줄이다"], ["responsibility", "책임"], ["management", "경영진"], ["prevent", "막다, 예방하다"], ["ease", "누그러뜨리다"], ["plant", "공장"], ["rather than", "~하기보다는"], ["existing", "기존의"], ["assembly line", "조립 라인"], ["participate in", "~에 참여하다"], ["manufacturing cost", "제조 원가"], ["competitive", "경쟁력 있는"], ["cost reduction", "원가 절감"], ["jointly", "공동으로"], ["labor", "노동자 측, 노동"], ["repetitive", "반복적인"], ["motion", "동작"], ["replace", "대체하다"], ["judgment", "판단"], ["beyond the abilities of", "~의 능력을 넘어서는"], ["require", "요구하다, 필요로 하다"]]}, {"q": "09", "type": "요약문 완성", "src": "2023학년도 수능 40번", "ans": "①", "tr": [["1", "'장인 정신'이라는 말은 산업 사회의 도래와 함께 쇠퇴한 삶의 방식을 떠올리게 할지도 모르지만, 그것은 오해다."], ["2", "장인 정신은 오래 지속되는 기본적인 인간의 충동, 곧 일 그 자체를 위해 그 일을 잘해 내고 싶다는 욕구를 가리키는 말이다."], ["3", "장인 정신은 숙련된 육체노동보다 훨씬 더 넓은 영역을 아우른다. 컴퓨터 프로그래머에게도, 의사에게도, 예술가에게도 쓸모가 있다. 양육도 숙련된 기예처럼 다루면 나아지고, 시민의 역할 또한 그렇다."], ["4", "이 모든 영역에서 장인 정신은 객관적인 기준에, 그리고 그 일 자체에 초점을 맞춘다."], ["5", "그러나 사회적·경제적 조건은 흔히 장인의 규율과 헌신을 가로막는다. 학교는 좋은 일을 해낼 도구를 제공하지 못할 수 있고, 일터는 품질에 대한 열망을 진심으로 귀하게 여기지 않을 수 있다."], ["6", "장인 정신이 개인에게 일에 대한 자부심이라는 보상을 안겨 줄 수는 있지만, 그 보상이 단순하지만은 않다."], ["7", "장인은 흔히 서로 충돌하는 객관적 우수성의 기준들 앞에 놓인다. 일 자체를 위해 잘해 내고 싶다는 욕구는 경쟁 압력이나 좌절, 혹은 집착 때문에 약해질 수 있다."], ["8", "[요약문] 장인 정신은 다양한 맥락에서 시간이 흘러도 (A)지속되어 온 인간적 욕구인데, 흔히 그 온전한 발달을 (B)제한하는 요인들과 마주친다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Social and economic conditions, however, often stand in the way of the craftsman's discipline and commitment: schools may fail to provide the tools to do good work, and workplaces may not truly value the aspiration for quality."}, {"en": false, "h": "요약문은 <b>두 칸을 따로</b> 풀어야 한다. (A) 칸은 <b>a human desire that has ___ over time in diverse contexts</b>, 곧 <b>시간과 여러 맥락</b>에 걸친 성질을 묻는다. 근거는 1·2·3번이다. 1번은 <b>산업 사회와 함께 사라졌다는 생각은 오해(misleading)</b>라고 못 박고, 2번은 <b>an enduring, basic human impulse</b>(오래 지속되는 기본적 충동)라고 직접 말한다. 3번은 프로그래머·의사·예술가·양육·시민의 역할까지 <b>다양한 맥락</b>을 나열한다. 따라서 (A)는 <b>persisted</b>(지속되어 왔다)이다. <b>declined</b>나 <b>diminished</b>는 1번이 <b>오해</b>라고 부정한 바로 그 내용이다. (B) 칸은 <b>factors that ___ its full development</b>이므로 <b>방해하는</b> 뜻이 와야 한다. 5번의 <b>stand in the way of</b>(가로막다)와 7번의 <b>can be weakened by</b>(약해질 수 있다)가 그 근거이고, 이를 한 단어로 옮기면 <b>limit</b>이다. 두 칸을 모두 만족시키는 것은 ①뿐이다."}], "opts": [{"n": "①", "t": "persisted … limit (지속되어 왔다 … 제한하다)", "a": true, "x": false, "trap": false, "e": "(A)는 2번의 <b>an enduring, basic human impulse</b>, (B)는 5번의 <b>stand in the way of</b>와 7번의 <b>can be weakened</b>에 각각 대응한다."}, {"n": "②", "t": "persisted … cultivate (지속되어 왔다 … 기르다)", "a": false, "x": true, "trap": true, "e": "(A)는 맞지만 (B)가 정반대다. <b>cultivate</b>는 <b>키운다</b>는 뜻인데, 5·7번은 <b>가로막고 약화시킨다</b>고 말한다. (A)만 맞춰 놓고 고르면 걸린다."}, {"n": "③", "t": "evolved … accelerate (진화했다 … 가속하다)", "a": false, "x": true, "trap": false, "e": "글은 장인 정신이 <b>모습을 바꿔 왔다</b>고 말하지 않는다. 2번은 <b>enduring</b>, 즉 <b>변하지 않고 이어진다</b>는 쪽이다. (B)의 <b>가속</b>도 방해와 반대다."}, {"n": "④", "t": "diminished … shape (줄어들었다 … 형성하다)", "a": false, "x": true, "trap": false, "e": "1번이 <b>산업 사회와 함께 쇠퇴했다는 생각은 misleading</b>이라고 직접 부정했다. <b>diminished</b>를 넣으면 글쓴이가 반박한 내용을 그대로 결론으로 삼는 셈이다."}, {"n": "⑤", "t": "diminished … restrict (줄어들었다 … 제한하다)", "a": false, "x": true, "trap": false, "e": "(B)의 <b>restrict</b>는 뜻이 통하지만 (A)가 1번에서 부정된 내용이다. 요약문 문항은 <b>한 칸만 맞아도 오답</b>이라는 점을 확인시켜 주는 선지다."}], "w": [["craftsmanship", "장인 정신"], ["decline", "쇠퇴하다, 줄어들다"], ["arrival", "도래, 도착"], ["misleading", "오해를 부르는"], ["name", "가리키다, 이름 붙이다"], ["enduring", "지속되는, 오래가는"], ["impulse", "충동"], ["for its own sake", "그 자체를 위해"], ["cut a wide swath", "넓은 영역을 아우르다"], ["manual labor", "육체노동"], ["serve", "쓸모가 있다, 도움이 되다"], ["parenting", "양육"], ["citizenship", "시민의 자질, 시민의 역할"], ["domain", "영역"], ["objective", "객관적인"], ["stand in the way of", "~을 가로막다"], ["discipline", "규율"], ["commitment", "헌신, 전념"], ["aspiration", "열망"], ["reward A with B", "A에게 B로 보답하다"], ["a sense of pride", "자부심"], ["conflicting", "서로 충돌하는"], ["excellence", "우수성"], ["weaken", "약화시키다"], ["competitive pressure", "경쟁 압력"], ["frustration", "좌절"], ["obsession", "집착"], ["persist", "지속되다"], ["diverse", "다양한"], ["context", "맥락"]]}, {"q": "10", "type": "장문 · 글의 순서", "src": "2014학년도 9월 B형 43번", "ans": "②", "tr": [["1", "(A) 창의적으로 문제를 푸는 사람이 되려면, 사람들은 복잡한 것을 어느 정도 순진한 단순함으로 대하는 법을 배워야 한다."], ["2", "그리고 자기 생각을 더 자유롭게 풀어 놓음으로써, 사람들은 오래된 문제를 얽매이지 않고 새롭게 보는 시각이나 아예 새로운 창조물을 발견할 가능성을 높일 수 있다."], ["3", "이를 위해 그들은 아이처럼 머릿속으로 생각을 가지고 놀아 볼 수 있다."], ["4", "여기 한 가지 예화가 있다."], ["5", "옛 오스트리아 제국 시절 모라비아의 작은 마을에, 어느 날 교육부에서 온 장학사가 교실을 방문하러 왔다."], ["6", "학교를 그렇게 주기적으로 시찰하는 것이 (a) 그의 직무의 일부였다."], ["7", "(B) 수업을 참관한 뒤 한 시간이 끝나 갈 무렵, 그는 일어서서 말했다. \"여러분이 공부를 잘하고 있는 것을 보니 기쁩니다.\""], ["8", "\"여러분의 발전에 만족합니다.\""], ["9", "\"그래서 가기 전에 한 가지 묻고 싶은 것이 있습니다. 말의 털은 몇 개일까요?\""], ["10", "아홉 살짜리 어린 소년 하나가 아주 빠르게 손을 들었고, 교사와 방문객은 깜짝 놀랐다."], ["11", "(b) 그는 일어서서 말했다. \"말은 털이 3,571,962개 있습니다.\""], ["12", "장학사가 의아해하며 물었다. \"그런데 그게 맞는 숫자라는 걸 어떻게 아나요?\""], ["13", "소년이 대답했다. \"제 말을 믿지 못하시겠으면 직접 세어 보시면 됩니다.\""], ["14", "(C) 그로부터 한 해가 지나, 장학사는 해마다 하는 방문을 위해 그 마을 학교에 다시 와 있었다."], ["15", "교사가 (c) 그와 함께 복도를 걸어 문 쪽으로 가고 있을 때, 그는 멈춰 서서 말했다. \"그런데 장학사님, 말과 그 털 개수 이야기를 동료분들이 어떻게 받아들이셨나요?\""], ["16", "장학사는 교사의 등을 툭 쳤다. \"아, 그거요.\" 그가 말했다. \"있잖아요, 저는 정말이지 그 이야기를 꼭 해 주고 싶었어요. 참 좋은 이야기였으니까요. 그런데 말이죠, 아무리 애를 써도 그 털 개수가 도무지 기억나지 않더군요.\""], ["17", "(D) 장학사는 소년의 대답을 아주 즐거워하며 큰 소리로 웃음을 터뜨렸다."], ["18", "교사가 (d) 그를 복도를 따라 문까지 배웅하는 동안, 그는 여전히 유쾌하게 웃으며 말했다. \"참 재미있는 이야기군요! 빈으로 돌아가면 동료들에게 이 이야기를 꼭 해 줘야겠어요.\""], ["19", "\"그들이 어떻게 받아들일지 벌써 눈에 선합니다. 그 사람들은 좋은 농담만큼 좋아하는 게 없거든요.\""], ["20", "그러고서 그는 (e) 그의 작별을 고했다."]], "evh": "(B)-7번 문장", "ev": [{"en": true, "h": "The boy replied, \"If you do not believe me, you could count them yourself.\""}, {"en": false, "h": "순서 문항은 <b>대화의 흐름과 지시어</b>를 따라가면 끝난다. (A)는 장학사가 교실에 <b>도착하는 장면</b>으로 끝나므로, 그다음에는 <b>수업을 참관한 뒤</b>로 시작하는 (B)가 와야 한다. (B)의 마지막은 소년의 대답 <b>\"믿지 못하시겠으면 직접 세어 보세요\"</b>이다. 그렇다면 그 대답에 대한 <b>반응</b>이 바로 이어져야 하는데, (D)의 첫 문장이 <b>The inspector broke into loud laughter, thoroughly enjoying the boy's remark</b>로 <b>the boy's remark</b>(소년의 그 말)를 직접 받는다. 그래서 <b>(B) → (D)</b>다. (D)의 끝은 <b>빈에 돌아가면 동료들에게 이야기해 주겠다</b>이고, (C)는 <b>It was a year later</b>로 시간이 훌쩍 지난 뒤 <b>동료들이 그 이야기를 어떻게 받아들였는지</b>를 묻는 장면이다. 즉 (C)는 <b>반드시 마지막</b>이다. 따라서 <b>(B)-(D)-(C)</b>인 ②가 답이다."}], "opts": [{"n": "①", "t": "(B) - (C) - (D)", "a": false, "x": true, "trap": false, "e": "(C)는 <b>It was a year later</b>로 시작하는 <b>1년 뒤</b>의 장면이다. 그 뒤에 (D)의 <b>그 자리에서 터진 웃음</b>이 오면 시간이 거꾸로 흐른다."}, {"n": "②", "t": "(B) - (D) - (C)", "a": true, "x": false, "trap": false, "e": "(B)의 마지막 대사 → (D)의 <b>the boy's remark</b>가 그것을 그대로 받고, (D)의 <b>동료들에게 말하겠다</b> → (C)의 <b>동료들이 어떻게 받아들였나</b>로 이어진다."}, {"n": "③", "t": "(C) - (D) - (B)", "a": false, "x": true, "trap": false, "e": "(A)의 끝은 장학사가 <b>막 도착한</b> 시점인데, (C)는 <b>1년 뒤</b>다. 첫 방문 장면인 (B)를 건너뛰고 1년 뒤로 갈 수는 없다."}, {"n": "④", "t": "(D) - (B) - (C)", "a": false, "x": true, "trap": true, "e": "(D)의 첫 문장이 <b>the boy's remark</b>를 가리키는데, (A)에는 소년이 아직 등장조차 하지 않는다. <b>가리킬 대상이 없는 지시어</b>는 순서 문항에서 가장 확실한 탈락 근거다."}, {"n": "⑤", "t": "(D) - (C) - (B)", "a": false, "x": true, "trap": false, "e": "④와 같은 이유로 (A) 다음에 (D)가 올 수 없고, (B)의 질문 장면이 맨 뒤로 밀리면 (C)의 <b>말 이야기</b>를 물을 근거가 사라진다."}], "w": [["problem solver", "문제를 푸는 사람"], ["approach", "대하다, 접근하다"], ["complexity", "복잡성"], ["naive", "순진한, 소박한"], ["simplicity", "단순함"], ["unencumbered", "얽매이지 않은"], ["perception", "인식, 지각"], ["entirely", "완전히"], ["mentally", "머릿속으로"], ["childlike", "아이 같은"], ["empire", "제국"], ["inspector", "장학사, 시찰관"], ["Ministry of Education", "교육부"], ["schoolroom", "교실"], ["duty", "직무, 의무"], ["periodic", "주기적인"], ["inspection", "시찰, 점검"], ["observe", "참관하다, 관찰하다"], ["progress", "발전, 진척"], ["raise one's hand", "손을 들다"], ["astonishment", "깜짝 놀람"], ["wonderingly", "의아해하며" 바로 앞은 <b>one little nine-year-old boy raised his hand</b>, 즉 <b>소년이 손을 들었다</b>이다. 그리고 (b)가 일어서서 한 말이 <b>\"The horse has 3,571,962 hairs.\"</b>라는 <b>대답</b>이다. 질문을 던진 사람은 장학사이므로, 대답한 <b>(b)는 소년</b>일 수밖에 없다. 나머지 넷은 모두 장학사다. (a)는 <b>such periodic inspections</b>를 하는 <b>직무의 주인</b>이고, (c)는 <b>교사가 함께 복도를 걸어 문까지 배웅하는 상대</b>, (d)는 <b>교사가 배웅한 대상</b>, (e)는 <b>작별을 고한 사람</b>이다. 특히 (c)와 (d)는 <b>the teacher</b>가 주어라서 밑줄까지 교사로 착각하기 쉬운데, <b>배웅하는 쪽</b>과 <b>배웅받는 쪽</b>을 갈라 읽으면 답이 보인다."}], "opts": [{"n": "①", "t": "(a)", "a": false, "x": true, "trap": false, "e": "<b>It was part of (a) his duty to make such periodic inspections of the schools.</b> — 학교를 시찰하는 것이 직무인 사람은 <b>장학사</b>다."}, {"n": "②", "t": "(b)", "a": true, "x": false, "trap": false, "e": "손을 든 소년이 일어서서 <b>말의 털이 3,571,962개</b>라고 대답한 장면이다. 질문한 장학사와 대답한 소년이 갈리는 지점이라 나머지 넷과 다르다."}, {"n": "③", "t": "(c)", "a": false, "x": true, "trap": false, "e": "<b>As the teacher was walking along the aisle with (c) him to the door</b> — 교사가 <b>함께 걸어 배웅하는 상대</b>이므로 장학사다."}, {"n": "④", "t": "(d)", "a": false, "x": true, "trap": true, "e": "<b>As the teacher escorted (d) him along the aisle to the door</b> — 주어가 <b>the teacher</b>라서 밑줄도 교사로 읽기 쉽다. 그러나 <b>escort</b>는 <b>배웅하다</b>이므로 배웅받는 (d)는 장학사다."}, {"n": "⑤", "t": "(e)", "a": false, "x": true, "trap": false, "e": "<b>And with that, he took (e) his leave.</b> — <b>take one's leave</b>는 <b>작별을 고하다</b>이고, 떠나는 사람은 방문객인 장학사다."}], "w": [["problem solver", "문제를 푸는 사람"], ["approach", "대하다, 접근하다"], ["complexity", "복잡성"], ["naive", "순진한, 소박한"], ["simplicity", "단순함"], ["unencumbered", "얽매이지 않은"], ["perception", "인식, 지각"], ["entirely", "완전히"], ["mentally", "머릿속으로"], ["childlike", "아이 같은"], ["empire", "제국"], ["inspector", "장학사, 시찰관"], ["Ministry of Education", "교육부"], ["schoolroom", "교실"], ["duty", "직무, 의무"], ["periodic", "주기적인"], ["inspection", "시찰, 점검"], ["observe", "참관하다, 관찰하다"], ["progress", "발전, 진척"], ["raise one's hand", "손을 들다"], ["astonishment", "깜짝 놀람"], ["wonderingly", "의아해하며"], ["annual", "해마다의"]   s.ch.forEach(c=>{x+='<div class="ch"><div class="ce">'+String(c.e).replace(/<\/?b>/g,'')+'</div><div class="ck">'+c.k+'</div></div>';});
  const lays=[];
  if(s.link)lays.push(['이어 읽으면',s.link]);
  if(s.easy)lays.push(['쉬운 말로',s.easy]);
  if(s.gist)lays.push(['결국 이 얘기',s.gist]);
  lays.forEach(l=>{x+='<div class="lay"><span class="lb">'+l[0]+'</span>'+l[1]+'</div>';});
  if(lays.length)x+='<button class="stg" data-names="'+lays.map(l=>l[0]).join('|')+'">'+lays[0][0]+'</button>';
  return x+'</div>';
}
function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  if(c.steps&&c.steps.length){x+='<div class="lay th"><div class="hd">이 문장 읽는 순서</div><ol>'+c.steps.map(p=>'<li>'+p.t+(p.sub||[]).map(u=>'<div class="sub">'+u+'</div>').join('')+'</li>').join('')+'</ol></div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';
  app.innerHTML=h;
}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
