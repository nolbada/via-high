<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}

: ["그러나 우선 당신이 적은 양의 물을 관 속으로 부어주면, 그 빈 공간은 빠르게 제거되었고, 더 적은 노력을 들이고도 물이 흐르는 것을 가능하게 했다.", "부정적인 관계를 (원래 상태로) 되돌리는 것은 ‘공정한 거래’를 요구한다기보다는 가치 있는 어떤 것을 포기하는 것으로부터 시작된다.", "만약 당신이 (누군가에게 무언가를) 주고 나서 곧장 어떤 것을 보답으로 요구한다면, 당신은 (그 사람과) 관계를 형성하는 게 아니라 거래를 행하는 것이다.", "(상호 의존 관계가) 올바르게 행해지면, 상호 의존 관계는 펌프를 준비시키는 것(펌프가 물을 잘 퍼 올리도록 미리 준비해두는 것)과 같다.", "옛날에, 펌프는 약간의 물이라도 만들어내기 위해서 많은 노력을 필요로 했다.", "물이 흐를 수 있기까지, 당신은 관 속에 있는 빈 공간을 제거하기 위해 (펌프의) 레버를 반복적으로 움직여야만 했다.", "경쟁자와의 상호 의존 관계도 대체로 똑같이 작동한다.", "당신이 무엇을 주어야 하는지를 주의 깊게 심사숙고해보고, 이상적으로는, 상대방이 보답하는 데 노력이 거의 들지 않는 무언가를 선택하라(상대방으로부터 당신이 준 것과 동일한 가치의 보답을 받으려고 하지 말라)."], "ps": [{"n": 1, "ch": [{"e": "<b>But<\/b> if you poured a small bucket of water", "k": "그러나 만약 당신이 적은 양의 물을 부어주면"}, {"e": "into the line first,", "k": "우선 관 속으로,"}, {"e": "<b>the empty space<\/b> was quickly eliminated,", "k": "그 빈 공간은 빠르게 제거되었다,"}, {"e": "enabling the water to flow", "k": "그리고 물이 흐르는 것을 가능하게 했다"}, {"e": "with less effort.", "k": "더 적은 노력을 들이고도."}], "link": "그러나 우선 당신이 적은 양의 물을 관 속으로 부어주면, 그 빈 공간은 빠르게 제거되었고, 더 적은 노력을 들이고도 물이 흐르는 것을 가능하게 했다.", "easy": "그런데 먼저 관에 물을 조금 부어 주면 빈 공간이 금방 없어져서, 힘을 덜 들이고도 물이 흘렀어요.", "gist": "주어진 문장이에요. But(그러나)과 the empty space(그 빈 공간)가 위치를 정하는 단서예요."}, {"n": 2, "ch": [{"e": "<b>Undoing<\/b> a negative tie", "k": "부정적인 관계를 (원래 상태로) 되돌리는 것은"}, {"e": "begins with giving up something of value", "k": "가치 있는 어떤 것을 포기하는 것으로부터 시작된다"}, {"e": "<b>rather than<\/b> asking for a “fair trade.”", "k": "‘공정한 거래’를 요구한다기보다는."}], "easy": "사이가 나빠진 관계를 되돌리려면, 똑같이 주고받자고 하기보다 내가 먼저 값진 것을 내주어야 해요.", "gist": "글의 주제 — 관계 회복은 먼저 내주는 데서 시작해요."}, {"n": 3, "ch": [{"e": "If you give", "k": "만약 당신이 (무언가를) 준다면"}, {"e": "and then ask for something right away <b>in return<\/b>,", "k": "그리고 나서 곧장 어떤 것을 보답으로 요구한다면,"}, {"e": "you don’t establish a relationship;", "k": "당신은 (그 사람과) 관계를 형성하는 게 아니다;"}, {"e": "you <b>carry out a transaction<\/b>.", "k": "당신은 거래를 행하는 것이다."}], "link": "만약 당신이 (누군가에게 무언가를) 주고 나서 곧장 어떤 것을 보답으로 요구한다면, 당신은 (그 사람과) 관계를 형성하는 게 아니라 거래를 행하는 것이다. 취할 수 있고 무엇을 성취할 수 없는지에 대해\u0002.", "core": "과학철학은 과학만능주의를 피하고 관점을 얻으려고 애쓴다.", "tags": ["주어 The philosophy + 동사 seeks + 목적어 to avoid ~(to부정사). (of science) = 전치사구(형용사구): philosophy를 꾸밈, (crude) = 형용사: scientism을 꾸밈", "(and) get a view: seeks to에 걸리는 <b>병렬</b>(to avoid ↔ (to) get). (balanced) = 형용사: view를 꾸밈", "(on what … achieve) = 전치사구(형용사구): view를 꾸밈. what절은 전치사 on의 목적어"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고 목적어가 <b>to부정사 병렬</b>이다. 뒤에 what절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The philosophy (철학)", "V: seeks (seek 추구하다, 애쓰다의 3인칭 단수형)", "O: to avoid crude scientism (투박한 과학만능주의를 피하는 것) and (to) get a balanced view (균형 잡힌 관점을 얻는 것)", "뼈대 = <b>The philosophy seeks to avoid ~ and (to) get ~</b>", "of science (과학의)는 philosophy를 꾸미는 형용사구"]}, {"t": "수식어를 본다.", "sub": ["crude (투박한)는 scientism을 꾸미는 형용사", "balanced (균형 잡힌)는 view (관점)를 꾸미는 형용사"]}, {"t": "끝의 <b>on what the scientific method can and cannot achieve</b>는 view를 꾸미는 전치사구(형용사구)다 (과학적 방법이 무엇을 이룰 수 있고 없는지에 대한).", "sub": ["what절은 전치사 on의 목적어 (what = ~하는 것)", "S: the scientific method (과학적 방법), V: can and cannot achieve (이룰 수 있고 없는), O: what", "achieve 이루다"]}], "sum": "과학철학, 투박한 과학만능주의를 피하고 과학적 방법의 한계에 균형 잡힌 관점 모색"}, {"i": "04", "q": "09", "s": "2", "title": "동명사 주어 + S+V + rather than 병렬", "eng": "Undoing<sup>1</sup> a negative tie<sup>2</sup> / begins with giving up something of value<sup>3</sup> / rather than asking for<sup>4</sup> a “fair trade.”", "notes": [["1", "undo", "(원래 상태로) 되돌리다"], ["2", "negative tie", "부정적인 관계"], ["3", "of value", "가치 있는"], ["4", "ask for", "~을 요구하다"]], "lit": "부정적인 관계를 되돌리는 것은 / 가치 있는 무언가를 포기하는 것에서 시작한다 / “공정한 거래”를 요구하기보다는.", "nat": "부정적인 관계를 되돌리는 일은 “공정한 거래”를 요구하기보다 가치 있는 무언가를 먼저 내주는 데서 시작한다.", "ana": "문장 맨 앞의 <b>Undoing</b>은 진행형이 아니라 <b>동명사 주어</b>다. 동명사 주어는 아무리 길어도 <b>언제나 단수 취급</b>하므로 동사가 <b>begins</b>로 -s가 붙었다. 주어가 -ing로 시작하면 '<b>~하는 것은</b>'으로 밀고 나가다가 <b>첫 번째 동사</b>에서 끊는 연습을 하면 실수가 줄어든다. <b>rather than</b>은 '<b>~하기보다는</b>'이라는 뜻인데, 여기서 중요한 것은 <b>앞뒤 형태를 맞춰야 한다</b>는 점이다. 앞이 <b>giving up</b>이므로 뒤도 <b>asking</b>이 되어야 한다. 만약 to ask나 ask가 오면 병렬이 깨진다. 참고로 rather than은 전치사·접속사 양쪽으로 쓰여 뒤에 명사·동명사·동사원형이 모두 올 수 있지만, <b>앞과 같은 형태</b>를 고르는 것이 시험의 정답이다. <b>something of value</b>는 <b>of + 추상명사 = 형용사</b>로 valuable과 같다.", "pe": "Undoing<sup>1</sup> a \u0001negative\u0002 tie<sup>2</sup> / begins \u0001with giving up something \u0001of value<sup>3</sup>\u0002\u0002 / \u0001rather than asking for<sup>4</sup> a “fair trade.”\u0002", "pk": "\u0001부정적인\u0002 관계를 되돌리는 것은 / \u0001가치 있는 무언가를 포기하는 것에서\u0002 시작한다 / \u0001“공정한 거래”를 요구하기보다는\u0002.", "core": "관계를 되돌리는 일은 시작한다.", "tags": ["주어 Undoing a tie(<b>동명사구</b> 주어): 동사가 나올 때까지 기다림. (negative) = 형용사: tie를 꾸밈", "동사 begins: 1형식. (with giving up …) = 전치사구(부사구): begins를 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]. (of value) = 전치사구(형용사구): something을 꾸밈", "(rather than asking for …) = 전치사구(부사구): giving up과 대비, ~하기보다는"], "steps": [{"t": "이 문장은 <b>동명사구 주어 + S+V(1형식)</b>이다. 주어가 동명사구라 동사가 뒤에 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Undoing a negative tie (부정적인 관계를 되돌리는 것) - 동명사구", "V: begins (begin 시작되다의 3인칭 단수형)", "뼈대 = <b>Undoing a negative tie begins</b>", "negative (부정적인)는 tie (관계)를 꾸미는 형용사, undo 되돌리다"]}, {"t": "<b>with giving up something of value</b>는 전치사구(부사구)다. begins를 꾸민다 (가치 있는 무언가를 내주는 것에서). 거의 필수에 가까운 부사구지만 수식어로 분류한다 (문형 기준).", "sub": ["giving up (내주는 것, give up 포기하다, 내주다) - with 뒤라서 동명사", "of value (가치 있는)는 something을 꾸미는 형용사구"]}, {"t": "<b>rather than asking for a 'fair trade'</b>는 앞의 giving up과 대비되는 덩어리다 ('공정한 거래'를 요구하기보다는). than 뒤에도 동명사 asking for (요구하는 것)이 온다."}], "sum": "부정적 관계를 풀려면 공정한 거래 요구보다 먼저 가치 있는 것을 내줘야 함"}, {"i": "05", "q": "10", "s": "2", "title": "With regard to 전치사구 + S+V+C", "eng": "With regard to<sup>1</sup> peer-to-peer<sup>2</sup> risks such as bullying<sup>3</sup>, / this last element<sup>4</sup> is of particular importance.", "notes": [["1", "with regard to", "~와 관련하여"], ["2", "peer-to-peer", "(서로) 동등한 사람들 간의"], ["3", "bullying", "괴롭힘"], ["4", "element", "요소"]], "lit": "괴롭힘과 같은 또래 간의 위험과 관련해서는, / 이 마지막 요소가 특히 중요하다.", "nat": "괴롭힘과 같은 또래 간의 위험과 관련해서는, 이 마지막 요소가 특히 중요하다.", "ana": "<b>of particular importance</b>를 '특별한 중요성의'로 어색하게 옮기면 안 된다. <b>of + 추상명사</b>는 통째로 <b>형용사</b> 역할을 하므로 <b>particularly important</b>와 같은 뜻이다. of value = valuable, of use = useful, of help = helpful도 같은 원리이며, 이렇게 형용사 대신 of구를 쓰면 <b>particular·great·little</b> 같은 수식어를 붙여 정도를 조절할 수 있다는 장점이 있다. 앞의 <b>With regard to</b>는 '<b>~와 관련하여</b>'라는 전치사구이므로 뒤에 <b>명사</b>가 온다. regarding·concerning·as for와 같은 무리다. 마지막으로 <b>this last element</b>가 무엇을 가리키는지 앞 문장에서 반드시 찾아야 한다 — 바로 <b>다른 사람의 권리와 자유를 존중하는 행동</b>이다.", "pe": "\u0001With regard to<sup>1</sup> peer-to-peer<sup>2</sup> risks such as bullying<sup>3</sup>\u0002, / this \u0001last\u0002 element<sup>4</sup> is of \u0001particular\u0002 importance.", "pk": "\u0001괴롭힘과 같은 또래 간의 위험과 관련해서는\u0002, / 이 \u0001마지막\u0002 요소가 \u0001특히\u0002 중요하다.", "core": "이 요소가 중요하다.", "tags": ["(With regard to … bullying) = 전치사구(부사구): 문장 전체를 꾸밈, with regard to = ~와 관련해서", "주어 this element + 동사 is + 보어 of importance(= important): 2형식. (last) = 형용사: element를 꾸밈, (particular) = 형용사: importance를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 앞에 긴 전치사구가 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: this last element (이 마지막 요소)", "V: is (be ~이다)", "C: of particular importance (특별한 중요성을 지닌, = 특히 중요한)", "뼈대 = <b>this last element is of particular importance</b>", "be of + 추상명사 = be + 형용사 (of importance = important)"]}, {"t": "앞의 <b>With regard to peer-to-peer risks such as bullying</b>은 전치사구(부사구)다. 문장 전체를 꾸민다.", "sub": ["with regard to = ~와 관련해서", "peer-to-peer risks (또래 간의 위험들, risk 위험)", "such as bullying (괴롭힘과 같은) - risks를 꾸미는 형용사구, bullying 괴롭힘"]}, {"t": "particular (특별한)는 importance (중요성)를 꾸미는 형용사다."}], "sum": "괴롭힘 같은 또래 간 위험에서 이 마지막 요소가 특히 중요함"}, {"i": "06", "q": "10", "s": "3", "title": "S+V + 관계절(수동태) + 콜론 인용", "eng": "This relates to<sup>1</sup> a basic principle<sup>2</sup> / that children are taught<sup>3</sup> in the offline world as well<sup>4</sup>: / ‘do not do to others what you would not want others to do to you’.", "notes": [["1", "relate to", "~와 관련되다"], ["2", "principle", "원칙"], ["3", "teach", "가르치다"], ["4", "as well", "~도 또한"]], "lit": "이것은 기본 원칙과 관련이 있다 / 아이들이 오프라인 세계에서도 배우는: / ‘남들이 너에게 하기를 원하지 않는 일을 남들에게 하지 말라’.", "nat": "이것은 아이들이 오프라인 세계에서도 배우는 기본 원칙, 즉 ‘남에게 당하고 싶지 않은 일을 남에게 하지 말라’와 관련이 있다.", "ana": "<b>a basic principle that children are taught</b>에서 that은 동격이 아니라 <b>목적격 관계대명사</b>다. 구별법은 늘 같다. that 뒤가 <b>완전하면 동격, 불완전하면 관계대명사</b>. 여기서는 <b>teach A B</b>(A에게 B를 가르치다)의 수동형인 <b>children are taught (B)</b>에서 B가 빠져 있으므로 <b>불완전</b>하다. 4형식 동사의 수동태는 이렇게 <b>목적어 하나가 남는다</b>는 점이 늘 함정이다. 콜론(:) 뒤는 그 원칙의 <b>내용</b>을 그대로 인용한 것이다. 인용문 안의 <b>what</b>은 do의 목적어 역할을 하는 <b>선행사 포함 관계대명사</b>이며, 그 안에서 다시 <b>want others to do</b>(others가 to do의 의미상 주어)라는 5형식이 들어 있다. 짧지만 절이 세 겹으로 겹친 문장이므로 <b>what부터 끝까지를 한 덩어리</b>로 묶고 시작하자.", "pe": "This relates \u0001to<sup>1</sup> a basic principle<sup>2</sup>\u0002 / \u0001that children are taught<sup>3</sup> in the offline world as well<sup>4</sup>\u0002: / \u0001‘do not do to others what you would not want others to do to you’\u0002.", "pk": "이것은 기본 원칙과 관련이 있다 / 아이들이 오프라인 세계에서도 배우는: / \u0001‘남들이 너에게 하기를 원하지 않는 일을 남들에게 하지 말라’\u0002.", "core": "이것은 관련이 있다.", "tags": ["주어 This + 동사 relates: 1형식. (to a basic principle) = 전치사구(부사구): relates를 꾸밈, 거의 필수에 가까운 부사구(relate to) [기준: 모양 규칙]", "(that children are taught …) = 관계절(형용사절): principle을 꾸밈. 안에서 목적격 관계대명사 that, taught는 수동", "(‘do not do … you’) = 동격 인용: principle의 내용을 풀어 줌 (콜론 뒤)"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 관계절과 콜론 뒤 인용문이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: This (이것)", "V: relates (relate 관련되다의 3인칭 단수형)", "뼈대 = <b>This relates</b>", "to a basic principle (기본 원칙과)는 전치사구. relate to는 거의 필수에 가까운 부사구지만 수식어로 분류 (문형 기준)", "basic (기본적인)은 principle (원칙)을 꾸미는 형용사"]}, {"t": "<b>that children are taught in the offline world as well</b>는 <b>관계절(형용사절)</b>이다. principle을 꾸민다 (아이들이 오프라인 세계에서도 배우는).", "sub": ["S: children (아이들), V: are taught (teach 가르치다의 수동태, 배우다)", "that = principle (원칙), 가르침을 받는 내용이 앞으로 나온 자리", "in the offline world (오프라인 세계에서)는 are taught를 꾸미는 전치사구, as well (역시)"]}, {"t": "콜론 뒤 따옴표 속 말은 principle의 내용을 풀어 주는 <b>동격 인용</b>이다.", "sub": ["'do not do to others what you would not want others to do to you'", "do ~ to others (남들에게 ~을 하다)의 목적어가 뒤로 간 형태다", "what you would not want others to do to you (당신이 남들이 당신에게 하기를 원하지 않을 것) - what절이 do의 목적어. want + others + to do는 5형식"]}], "sum": "이것은 남에게 당하기 싫은 일을 남에게 하지 말라는 기본 원칙과 관련됨"}, {"i": "07", "q": "11", "s": "6", "title": "Although절 + what절 주어 + S+V+C", "eng": "Although<sup>1</sup> the question called for an explanation<sup>2</sup>, / what the asker<sup>3</sup> received / was a statement<sup>4</sup> of fact.", "notes": [["1", "although", "비록 ~이지만"], ["2", "explanation", "설명"], ["3", "asker", "질문자"], ["4", "statement", "진술, 성명"]], "lit": "질문은 설명을 요구했지만, / 질문한 사람이 받은 것은 / 사실에 대한 진술이었다.", "nat": "질문은 설명을 요구하는 것이었지만, 정작 질문한 사람이 받은 것은 사실에 대한 진술이었다.", "ana": "<b>Although</b>는 <b>접속사</b>이므로 뒤에 반드시 <b>주어 + 동사</b>가 온다. 여기서는 the question wanted가 그것이다. 같은 뜻의 <b>despite·in spite of</b>는 <b>전치사</b>라서 뒤에 명사만 올 수 있으니, 이 자리를 바꿔치기하는 문제가 자주 나온다. 주절이 더 중요하다. 주어가 <b>what the asker received</b>라는 <b>명사절</b>인데, what은 선행사를 품고 있어 '<b>~한 것</b>'으로 해석되고 뒤에는 received의 <b>목적어가 빠진 불완전한 절</b>이 온다. 이렇게 <b>절이 통째로 주어</b>가 되면 동사는 <b>언제나 단수</b>이므로 were가 아니라 <b>was</b>다. 이 문장은 <b>원한 것(설명)</b>과 <b>받은 것(사실 진술)</b>을 정면으로 대비시키는데, 그 대비가 곧 이 글 전체의 문제 제기다.", "pe": "\u0001Although<sup>1</sup> the question called for an explanation<sup>2</sup>\u0002, / what the asker<sup>3</sup> received / was a statement<sup>4</sup> \u0001of fact\u0002.", "pk": "\u0001질문은 설명을 요구했지만\u0002, / 질문한 사람이 받은 것은 / 사실에 대한 진술이었다.", "core": "질문한 사람이 받은 것은 진술이었다.", "tags": ["(Although … explanation) = 부사절(양보): 문장 전체를 꾸밈", "주어: what절(<b>명사절</b> 주어, what the asker received). 동사가 나올 때까지 기다림", "동사 was + 보어 a statement: 2형식. (of fact) = 전치사구(형용사구): statement를 꾸밈"], "steps": [{"t": "이 문장은 <b>Although 부사절 + S+V+C(2형식)</b>이다. 주절의 주어가 what절이라 낯설어 보인다."}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: what the asker received (질문한 사람이 받은 것) - what절, 명사절", "V: was (be ~이었다)", "C: a statement of fact (사실에 대한 진술)", "뼈대 = <b>what the asker received was a statement of fact</b>", "of fact (사실의)는 statement (진술)를 꾸미는 형용사구"]}, {"t": "what절 안의 구조를 본다.", "sub": ["S: the asker (질문자), V: received (receive 받다의 과거형), O: what (것)"]}, {"t": "<b>Although the question called for an explanation</b>은 <b>부사절(양보)</b>이다. 주절 전체를 꾸민다 (질문은 설명을 요구했지만).", "sub": ["call for ~ = ~을 요구하다 (한 덩어리 동사), explanation 설명"]}, {"t": "주어가 what절이라 동사 was가 나올 때까지 기다려야 한다는 점이 함정이다."}], "sum": "설명을 요구한 질문, 정작 돌아온 건 사실 진술뿐"}, {"i": "08", "q": "11", "s": "15", "title": "긴 주어 + S+V+O + 부사구 + to부정사", "eng": "A statement<sup>1</sup> of fact with no other context<sup>2</sup> / puts the burden<sup>3</sup> on the asker<sup>4</sup> / to take the next step.", "notes": [["1", "statement", "진술, 성명"], ["2", "context", "맥락"], ["3", "put the burden on", "~에게 부담을 주다"], ["4", "asker", "질문자"]], "lit": "다른 맥락 없이 사실만 진술하는 것은 / 질문자에게 부담을 지운다 / 다음 단계로 나아가야 하는.", "nat": "다른 맥락 없이 사실만 진술하는 것은 다음 단계로 나아갈 부담을 질문자에게 떠넘기는 것이다.", "ana": "주어가 <b>A statement of fact</b> 하나인데 뒤에 <b>with no other context</b>가 붙어 길어졌다. <b>of fact</b>와 <b>with ~ context</b>는 모두 <b>전치사구 수식어</b>이므로 괄호로 묶고 나면 동사 <b>puts</b>가 선명하게 보인다. 동사가 <b>puts</b>로 단수인 것도 주어의 핵이 <b>statement</b>(단수)이기 때문이다. <b>put the burden on A</b>는 '<b>A에게 부담을 지우다</b>'라는 짝이며, 뒤의 <b>to take the next step</b>은 그 부담이 <b>무엇인지</b>를 설명하는 to부정사다. 즉 the burden <b>(of taking the next step)</b>과 같은 뜻으로, 부담의 <b>내용</b>을 뒤에서 풀어 준 것이다. 이렇게 명사와 그것을 설명하는 to부정사가 <b>떨어져 있는</b> 경우가 있으니, to부정사를 만나면 '<b>어느 명사를 설명하는가</b>'를 되짚어 보자.", "pe": "A statement<sup>1</sup> \u0001of fact\u0002 \u0001with no other context<sup>2</sup>\u0002 / puts the burden<sup>3</sup> \u0001on the asker<sup>4</sup>\u0002 / \u0001to take the next step\u0002.", "pk": "\u0001다른 맥락 없이\u0002 사실만 진술하는 것은 / \u0001질문자에게\u0002 부담을 지운다 / 다음 단계로 나아가야 하는.", "core": "진술이 부담을 지운다.", "tags": ["주어 A statement. (of fact) = 전치사구(형용사구): statement를 꾸밈, (with no other context) = 전치사구(형용사구): statement를 꾸밈", "동사 puts + 목적어 the burden: 3형식. (on the asker) = 전치사구(부사구): puts를 꾸밈, 거의 필수에 가까운 부사구(put A on B) [기준: 모양 규칙]", "(to take the next step) = to부정사(형용사적): the burden을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 주어가 전치사구로 길어지고 뒤에 부사구와 to부정사가 붙는다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: A statement (진술)", "V: puts (put 놓다, 지우다의 3인칭 단수형)", "O: the burden (부담)", "뼈대 = <b>A statement puts the burden</b>"]}, {"t": "주어에 붙은 수식 덩어리를 본다.", "sub": ["of fact (사실의) - statement를 꾸미는 형용사구", "with no other context (다른 맥락이 없는) - statement를 꾸미는 형용사구, context 맥락"]}, {"t": "<b>on the asker</b> (질문자에게)는 전치사구(부사구)다. puts를 꾸민다. put A on B는 거의 필수에 가까운 부사구지만 수식어로 분류한다 (문형 기준)."}, {"t": "끝의 <b>to take the next step</b>은 <b>to부정사 형용사적 용법</b>이다. burden을 꾸민다 (다음 단계로 나아갈, take a step 걸음을 내딛다)."}], "sum": "맥락 없는 사실 진술, 다음 단계로 갈 부담을 질문자에게 지움"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2015학년도 수능 31번", "ans": "②", "tr": [["1", "인간이 한 번에 여러 가지 일을 한다는 개념은 1920년대 이래로 심리학자들에 의해 연구되어 왔지만, ‘멀티태스킹’이라는 용어는 1960년대까지 존재하지 않았다."], ["2", "그 용어는 사람이 아니라 컴퓨터를 묘사하기 위해 사용되었다."], ["3", "그 당시 10메가헤르츠는 너무 빨라서, 여러 작업을 빠르게 수행하는 컴퓨터의 능력을 묘사할 새로운 단어가 필요했다."], ["4", "돌이켜 보면 그들은 아마도 잘못된 선택을 한 것인데, ‘멀티태스킹’이라는 표현이 본질적으로 기만적이기 때문이다."], ["5", "멀티태스킹은 원래 여러 작업이 하나의 자원(CPU)을 번갈아 나눠 쓰는 것을 뜻했지만, 이윽고 맥락이 뒤집혀 여러 작업이 한 자원(한 사람)에 의해 동시에 수행되는 것을 의미하는 말로 해석되었다."], ["6", "그것은 오해를 부르는 영리한 표현이었는데, 컴퓨터조차 한 번에 코드 한 조각만 처리할 수 있기 때문이다."], ["7", "컴퓨터가 ‘멀티태스킹’을 할 때, 그것들은 두 작업이 모두 끝날 때까지 주의를 번갈아 옮기며 왔다 갔다 전환한다."], ["8", "컴퓨터가 여러 작업을 다루는 속도는 모든 일이 동시에 일어난다는 착각을 부추기며, 그래서 컴퓨터를 인간과 비교하는 것은 혼란을 줄 수 있다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "When they “multitask,” they switch back and forth, alternating their attention until both tasks are done."}, {"en": false, "h": "빈칸 문항은 <b>빈칸 문장 자체</b>가 아니라 <b>바로 앞 문장들</b>이 정답을 준다. 이 글의 논지는 처음부터 끝까지 하나다 — 멀티태스킹이라는 말은 <b>기만적(deceptive)</b>이고 <b>오해를 부른다(misleading)</b>. 6번 문장에서 <b>컴퓨터조차 한 번에 코드 한 조각만 처리한다</b>고 못 박았고, 7번 문장에서 컴퓨터는 <b>왔다 갔다 전환할 뿐(switch back and forth)</b>이라고 확인해 준다. 그렇다면 빈칸 문장의 '<b>컴퓨터가 여러 작업을 다루는 속도</b>'가 하는 일은 무엇인가? 실제로는 동시에 일어나지 않는데 <b>동시에 일어나는 것처럼 보이게</b> 만드는 것, 즉 <b>착각을 부추기는</b> 것이다. ② <b>feeds the illusion</b>이 그 자리다."}], "opts": [{"n": "①", "t": "expels the myth", "a": false, "x": true, "trap": false, "e": "expel은 '<b>몰아내다</b>'라는 뜻이라 방향이 정반대다. 속도는 착각을 <b>없애는</b> 것이 아니라 <b>만들어 낸다</b>."}, {"n": "②", "t": "feeds the illusion", "a": true, "x": false, "trap": false, "e": "<b>feed</b>는 여기서 '먹이를 주다 → <b>부추기다, 조장하다</b>'라는 뜻이다. 빠른 속도가 ‘동시에 일어난다’는 <b>착각</b>을 키운다는 흐름과 정확히 맞는다."}, {"n": "③", "t": "conceals the fact", "a": false, "x": true, "trap": true, "e": "‘사실을 감춘다’는 그럴듯해 보이지만, 뒤에 이어지는 that절이 <b>everything happens at the same time</b>, 즉 <b>사실이 아닌 내용</b>이다. 사실이 아닌 것을 ‘사실’이라 부를 수는 없다."}, {"n": "④", "t": "proves the hypothesis", "a": false, "x": true, "trap": false, "e": "글에는 검증할 <b>가설</b>이 등장하지 않으며, 필자는 오히려 그 통념이 <b>틀렸다</b>고 말하고 있다."}, {"n": "⑤", "t": "blurs the conviction", "a": false, "x": true, "trap": false, "e": "‘신념을 흐리게 한다’는 표현은 이 문맥에서 무엇에 대한 신념인지 알 수 없고, 글의 대비 구조(실제 vs 착각)와도 연결되지 않는다."}], "w": [["psychologist", "심리학자"], ["term", "용어"], ["in retrospect", "돌이켜 생각해 보면"], ["inherently", "본질적으로"], ["deceptive", "기만적인, 현혹하는"], ["alternately", "번갈아, 교대로"], ["flip", "뒤집다"], ["interpret", "해석하다"], ["simultaneously", "동시에"], ["misleading", "오해를 불러일으키는"], ["tackle", "다루다, 처리하다"], ["illusion", "착각, 환상"]]}, {"q": "08", "type": "빈칸 추론", "src": "2020학년도 수능 31번", "ans": "②", "tr": [["1", "과학의 역할은 때때로 과장될 수 있는데, 그 옹호자들이 과학만능주의에 빠져들면서 그렇다."], ["2", "과학만능주의는 현실에 대한 과학적 기술만이 존재하는 유일한 진실이라는 관점이다."], ["3", "과학이 발전하면서, 과학만능주의에 빠져 ‘과학적’이라는 용어를 정확히 붙일 수 있는 경우에만 그리고 오직 그 경우에만 어떤 사실적 주장이든 진위를 입증할 수 있다고 가정하는 경향이 있어 왔다."], ["4", "그 결과 현실에 대한 비과학적 접근법은 — 그리고 그것은 모든 예술, 종교, 그리고 개인적·감정적·가치 판단이 담긴 세상을 접하는 방식을 포함할 수 있는데 — 단지 주관적인 것으로, 따라서 세상이 어떠한지를 기술하는 데 있어 중요성이 거의 없는 것으로 규정될 수 있다."], ["5", "과학철학은 투박한 과학만능주의를 피하고, 과학적 방법이 무엇을 할 수 있고 무엇을 할 수 없는지에 대해 균형 잡힌 관점을 얻으려고 애쓴다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "...may become labelled as merely subjective, and therefore of little ______ in terms of describing the way the world is."}, {"en": false, "h": "빈칸 앞의 <b>and therefore</b>가 결정적인 힌트다. 앞에서 비과학적 접근법이 <b>merely subjective</b>(단지 주관적인 것)로 규정된다고 했고, therefore로 그 <b>당연한 귀결</b>을 잇는다. 주관적일 뿐이라면 세상을 기술하는 데 <b>중요하지 않다</b>는 결론이 자연스럽다. 여기서 형태도 함께 보자. <b>of little ______</b>은 <b>of + 추상명사</b> 구조로 형용사 역할을 하므로 빈칸에는 <b>명사</b>가 들어가야 하고, of little value(가치가 거의 없는)와 같은 계열이다. <b>account</b>에는 '계좌·설명' 외에 '<b>중요성, 가치</b>'라는 뜻이 있어 <b>of little account</b>가 '<b>중요하지 않은</b>'이 된다. 이 숙어를 알면 즉답, 모르면 소거법으로 접근해야 한다."}], "opts": [{"n": "①", "t": "question", "a": false, "x": true, "trap": false, "e": "of little question이라는 표현은 쓰이지 않으며, 문맥도 ‘의문이 적다’가 아니라 ‘<b>중요하지 않다</b>’여야 한다."}, {"n": "②", "t": "account", "a": true, "x": false, "trap": false, "e": "<b>of little account = 중요성이 거의 없는</b>. subjective하므로 세상을 기술하는 데 <b>가치가 없다</b>는 결론과 정확히 맞는다."}, {"n": "③", "t": "controversy", "a": false, "x": true, "trap": true, "e": "‘논란이 거의 없다’는 뜻이 되어, 비과학적 접근법이 <b>평가절하된다</b>는 문맥과 정반대로 읽힌다."}, {"n": "④", "t": "variation", "a": false, "x": true, "trap": false, "e": "‘변화가 거의 없다’는 서술은 이 글의 주제(과학만능주의의 편협함)와 아무 연결이 없다."}, {"n": "⑤", "t": "bias", "a": false, "x": true, "trap": false, "e": "of little bias는 오히려 <b>편견이 적다</b>는 <b>긍정적</b> 평가가 되어, merely subjective라는 <b>부정적</b> 평가와 충돌한다."}], "w": [["overstate", "과장하다, 허풍을 떨다"], ["advocate", "옹호자, 지지자"], ["slip into", "~에 빠져들다"], ["scientism", "과학만능주의"], ["tendency", "경향, 성향"], ["authenticate", "진위임을 증명하다"], ["ascribe A to B", "A를 B에 속하는 것으로 생각하다"], ["value-laden", "가치 판단이 담긴"], ["subjective", "주관적인"], ["of little account", "중요성이 거의 없는"], ["crude", "투박한, 거친"], ["seek to V", "~하려고 애쓰다"]]}, {"q": "09", "type": "문장 삽입", "src": "2016년 4월 37번", "ans": "④", "tr": [["1", "[주어진 문장] 하지만 만약 당신이 먼저 작은 양동이의 물을 관 속으로 부어 주면, 그 빈 공간이 빠르게 제거되어 물이 더 적은 힘으로 흐를 수 있게 되었다."], ["2", "부정적인 관계를 되돌리는 일은 “공정한 거래”를 요구하기보다 가치 있는 무언가를 먼저 내주는 데서 시작한다."], ["3", "만약 당신이 무언가를 주고 곧바로 그 대가로 무언가를 요구한다면, 당신은 관계를 형성하는 것이 아니라 거래를 수행하는 것이다."], ["4", "제대로 행해질 때, 상호 의존 관계는 펌프를 미리 준비시켜 두는 것과 같다."], ["5", "옛날에 펌프는 물을 조금이라도 뽑아내려면 많은 노력을 필요로 했다."], ["6", "물이 흐를 수 있으려면 관 속의 진공을 제거하기 위해 레버를 반복해서 움직여야 했다."], ["7", "경쟁자와의 상호 의존 관계도 거의 같은 방식으로 작동한다."], ["8", "무엇을 주어야 할지 신중히 심사숙고하고, 이상적으로는 상대방이 보답하는 데 힘이 거의 들지 않는 것을 고르라."]], "evh": "④번 문장", "ev": [{"en": true, "h": "You had to repeatedly work a lever to eliminate a vacuum in the line before water could flow. ( ④ ) Reciprocity with a rival works in much the same way."}, {"en": false, "h": "문장 삽입은 <b>주어진 문장의 연결어와 지시어</b>부터 확인한다. 이 문장은 <b>But</b>으로 시작하고 <b>the line</b>(그 관), <b>the empty space</b>(그 빈 공간)라는 <b>정관사 명사</b>를 쓴다. 즉 앞에 <b>관</b>과 <b>빈 공간</b>이 이미 나와 있어야 한다. 그 조건을 만족하는 곳은 <b>a vacuum in the line</b>(관 속의 진공)이 등장한 ④ 앞 문장 뒤뿐이다. 내용으로도 딱 맞는다. ④ 앞은 ‘<b>레버를 반복해서 움직여야 했다</b>’는 <b>힘든 방법</b>이고, 주어진 문장은 <b>But</b>으로 그 반대인 ‘<b>물을 먼저 부으면 힘이 덜 든다</b>’는 <b>쉬운 방법</b>을 제시한다. 그리고 ④ 뒤의 <b>Reciprocity with a rival works in much the same way</b>가 비유를 마무리하며 <b>펌프 이야기를 닫는다</b>. ⑤에 넣으면 이미 비유가 끝난 뒤라 흐름이 어긋난다."}], "opts": [{"n": "①", "t": "", "a": false, "x": true, "trap": false, "e": "①은 아직 <b>펌프 비유가 시작되기도 전</b>이다. line도 empty space도 등장하지 않아 정관사가 가리킬 대상이 없다."}, {"n": "②", "t": "", "a": false, "x": true, "trap": false, "e": "②는 펌프 비유가 막 소개된 직후로, 아직 <b>진공·관</b>이라는 구체적 장치가 나오지 않았다."}, {"n": "③", "t": "", "a": false, "x": true, "trap": true, "e": "③ 뒤에서 비로소 <b>a vacuum in the line</b>이 나온다. 주어진 문장을 여기 넣으면 <b>the line</b>이 먼저 나와 버려 지시 관계가 뒤집힌다."}, {"n": "④", "t": "", "a": true, "x": false, "trap": false, "e": "앞 문장의 <b>힘든 방법</b>과 주어진 문장의 <b>But + 쉬운 방법</b>이 정확히 대비되고, <b>the line·the empty space</b>가 받을 대상도 바로 앞에 있다."}, {"n": "⑤", "t": "", "a": false, "x": true, "trap": false, "e": "⑤ 앞에서 이미 <b>works in much the same way</b>로 비유가 정리되었다. 여기에 펌프 설명을 다시 넣으면 흐름이 역행한다."}], "w": [["undo", "(원래 상태로) 되돌리다"], ["negative tie", "부정적인 관계"], ["of value", "가치 있는"], ["in return", "그 대가로"], ["carry out", "~을 수행하다"], ["transaction", "거래"], ["reciprocity", "상호 의존 관계, 호혜"], ["lever", "레버, 지렛대"], ["vacuum", "진공"], ["eliminate", "제거하다"], ["reflect on", "~을 심사숙고하다"], ["reciprocate", "보답하다"]]}, {"q": "10", "type": "무관한 문장", "src": "2018학년도 수능 35번", "ans": "③", "tr": [["1", "SNS의 상황에서, 미디어 정보 해득력은 “사용자들이 SNS 도구를 사용할 때 자신의 권리를 인식하게 하고, 또한 인권 가치를 습득하거나 강화하며 다른 사람의 권리와 자유를 존중하는 데 필요한 행동을 기르도록 돕기 위해” 특히 중요하다고 주장되어 왔다."], ["2", "① 괴롭힘과 같은 또래 간 위험과 관련하여, 이 마지막 요소는 특히 중요하다."], ["3", "② 이것은 아이들이 오프라인 세계에서도 배우는 기본 원칙, 즉 ‘남에게 당하고 싶지 않은 일을 남에게 하지 말라’와 관련이 있다."], ["4", "③ 아이들이 지식을 쌓도록 우리가 도울 때 아이들의 SNS 활동은 장려되어야 한다."], ["5", "④ 이것은 SNS에서도 황금률이어야 하지만, 아이들과 젊은이들에게는 이 환경에서 자기 행동이 가져올 결과와 잠재적으로 심각한 영향을 헤아리기가 훨씬 더 어렵다."], ["6", "⑤ 따라서 아주 어릴 때부터 SNS의 특수한 성격과 겉보기에 사소한 행동의 잠재적 장기 영향에 대해 아이들의 인식을 높이는 것이 필수적이다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "Children's SNS activities should be encouraged when we help them accumulate knowledge."}, {"en": false, "h": "무관한 문장 문항은 <b>앞뒤 문장이 서로 손을 잡고 있는지</b>만 보면 된다. 이 글의 주제는 <b>다른 사람의 권리를 존중하는 행동</b>, 즉 <b>황금률</b>이다. ②는 그 황금률을 인용하고, ④는 <b>This should also be a golden rule</b>로 ②를 그대로 받는다. 즉 ②와 ④는 <b>바로 이어지는 한 쌍</b>이다. 그 사이에 낀 ③은 <b>지식 축적(accumulate knowledge)</b>과 <b>SNS 활동 장려(should be encouraged)</b>를 말하는데, 이 글은 SNS 활동을 <b>장려</b>하자는 글이 아니라 그 <b>위험을 인식</b>시키자는 글이다. 게다가 ④의 <b>This</b>가 가리킬 대상이 ③이라면 말이 되지 않는다. <b>지시어가 앞 문장을 제대로 받지 못하면</b> 그 앞 문장이 정답이다."}], "opts": [{"n": "①", "t": "또래 간 위험과 관련해 이 마지막 요소가 특히 중요하다", "a": false, "x": true, "trap": false, "e": "<b>this last element</b>가 1번 문장 끝의 <b>다른 사람의 권리와 자유를 존중하는 행동</b>을 정확히 받는다. 연결이 매끄럽다."}, {"n": "②", "t": "오프라인에서도 배우는 기본 원칙: 남에게 당하고 싶지 않은 일을 하지 말라", "a": false, "x": true, "trap": false, "e": "①이 말한 ‘존중하는 행동’을 <b>구체적인 원칙</b>으로 풀어 준다. 뒤의 ④가 이것을 <b>golden rule</b>이라 부르며 받는다."}, {"n": "③", "t": "지식을 쌓도록 도울 때 아이들의 SNS 활동은 장려되어야 한다", "a": true, "x": false, "trap": false, "e": "글은 SNS 활동의 <b>장려</b>가 아니라 <b>위험 인식</b>을 말한다. ②와 ④의 연결을 끊는 문장이다."}, {"n": "④", "t": "이것은 SNS에서도 황금률이어야 하지만, 아이들에게는 결과를 헤아리기가 더 어렵다", "a": false, "x": true, "trap": true, "e": "<b>This</b>가 ②의 원칙을 받고, <b>but</b> 이하가 ⑤의 결론(인식 제고 필요)으로 이어지는 다리 역할을 한다."}, {"n": "⑤", "t": "따라서 어릴 때부터 SNS의 특성과 장기 영향에 대한 인식을 높이는 것이 필수적이다", "a": false, "x": true, "trap": false, "e": "<b>Hence</b>로 시작하는 결론 문장으로, ④에서 제기한 어려움에 대한 해법이다."}], "w": [["media literacy", "미디어 정보 해득력"], ["acquire", "배우다, 습득하다"], ["reinforce", "강화하다"], ["with regard to", "~와 관련하여"], ["peer-to-peer", "(서로) 동등한 사람들 간의"], ["bullying", "괴롭힘"], ["principle", "원칙"], ["accumulate", "쌓다, 축적하다"], ["golden rule", "황금률"], ["estimate", "헤아리다, 가늠하다"], ["seemingly", "겉보기에"], ["trivial", "사소한"]]}, {"q": "11", "type": "장문 · 제목", "src": "2015학년도 6월 41번", "ans": "⑤", "tr": [["1", "누군가 우리에게 “그건 어떻게 작동하죠?” 또는 “왜 그런 일이 생기죠?”라고 물을 때, 답을 알고 있다면 우리는 그 질문에 직접적으로 답하는 경향이 있다."], ["2", "어쨌든 그것은 효율적이다."], ["3", "다른 사람이 질문을 하면 우리는 그 질문에 대한 답을 제공한다."], ["4", "그것은 보통 서로에게 이득이다."], ["5", "이것의 문제는 그 직접적인 접근법이 의도하지 않은 결과, 즉 확신의 상실을 낳을 수 있다는 것이다."], ["6", "질문은 설명을 원한 것이었지만, 정작 질문한 사람이 받은 것은 사실에 대한 진술이었다."], ["7", "왜 기름은 유리잔 속 물 위에 뜰까? 상대적 밀도. 무엇이 기후 변화를 일으킬까? 대기 중 증가한 이산화탄소. 왜 바다에는 조수가 있을까? 달."], ["8", "직접적이고 정확하고 사실적인 답을 주는 것은 답하는 사람의 관점에서는 문제를 해결하는 것처럼 보일 수 있다."], ["9", "하지만 실제로는 그것이 질문자의 입을 막아 버릴 수 있다."], ["10", "다른 맥락 없이 사실만 진술하는 것은 다음 단계로 나아갈 부담을 질문자에게 떠넘기는 것이다."], ["11", "질문자가 상대적 밀도나 이산화탄소를 잘 모른다면, 그 사람은 추가 질문을 하거나 관련된 생각을 더 파고들기보다 그냥 넘어가 버릴 가능성이 크다."], ["12", "그 아이디어의 고객이 될 가망은 사라진다. 이것은 잃어버린 기회라는 형태의 실패다."], ["13", "직접적인 답이 필요하고 적절한 경우도 많지만, 그것이 누구에게나 통하는 것은 아니다."], ["14", "숙련된 설명자는 질문 뒤에 있는 의도를 읽고, 효율성 대신 이해에 초점을 맞춘 답을 만들어 내는 법을 배운다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "The problem with this is that the direct approach can have an unintended consequence: the loss of confidence."}, {"en": false, "h": "제목 문항은 <b>글이 무엇을 문제 삼는가</b>를 잡아야 한다. 이 글은 처음 네 문장에서 직접적인 답변이 <b>효율적이고(efficient) 서로에게 이득(win-win)</b>이라고 깔아 놓은 뒤, 5번 문장의 <b>The problem with this is ~</b>에서 방향을 완전히 꺾는다. 이후 <b>shut the asker down</b>(질문자의 입을 막는다), <b>puts the burden on the asker</b>(부담을 떠넘긴다), <b>a failure in the form of a lost opportunity</b>(잃어버린 기회   for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
