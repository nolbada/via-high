<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';

 "높은 자기 효능감을 가진 사람들은 평균적인 사람이 미치는 범위를 벗어나 있을 수도 있는 도전적인 목표를 추구하는 경향이 있다.", "그러므로 강한 자기 효능감을 가진 사람들은 어떤 환경의 사회적 행위자들의 대다수에 의해 성공이 있을 법하지 않다고 여겨지는 일이나 목표를 시도하기 위해 문화적으로 규정된 행동 밖으로 더 기꺼이 발을 디디려 할 수도 있다.", "이런 사람들에게, 문화는 행동에 거의 혹은 전혀 영향을 주지 않을 것이다.", "예를 들어, 호주 사람들은 ‘키 큰 양귀비 증후군’을 지지하는 경향이 있다.", "이 말은 밭에서 다른 것들보다 더 자라는 어떤 ‘양귀비’든 ‘잘리게’ 될 것임을, 다시 말해 누구든지 기대 이상의 성공을 거두는 사람은 결국 실패할 것임을 시사한다.", "(한편) 면담과 관찰은 평균 이상을 실제로 성취하기 위해 이 문화적으로 규정된 행동 밖으로 벗어나는 사람들이 (바로) 높은 자기 효능감을 가진 호주 사람들이라는 것을 시사한다."], "ps": [{"n": 1, "ch": [{"e": "An individual characteristic", "k": "개인적인 특징은"}, {"e": "that <b>moderates<\/b> the relationship with behavior", "k": "행동과의 관계를 조정하는"}, {"e": "is <b>self-efficacy<\/b>,", "k": "자기 효능감이다,"}, {"e": "or a judgment of one’s capability", "k": "즉 자신의 능력에 대한 판단"}, {"e": "to accomplish a certain level of performance.", "k": "특정 수준의 성과를 성취하는."}], "link": "행동과의 관계를 조정하는 개인적인 특징은 자기 효능감, 즉 특정 수준의 성과를 성취하는 자신의 능력에 대한 판단이다.", "easy": "행동에 영향을 주는 개인의 특징 중 하나가 자기 효능감이에요. 자기 효능감은 ‘나는 어느 정도의 성과를 낼 수 있다’고 스스로 판단하는 거예요.", "gist": "글의 핵심 개념인 자기 효능감을 소개해요."}, {"n": 2, "ch": [{"e": "People who have a high sense of self-efficacy", "k": "높은 자기 효능감을 가진 사람들은"}, {"e": "tend to pursue <b>challenging goals<\/b>", "k": "도전적인 목표를 추구하는 경향이 있다"}, {"e": "that may be outside the reach of the average person.", "k": "평균적인 사람이 미치는 범위를 벗어나 있을 수도 있는."}], "easy": "자기 효능감이 높은 사람은 보통 사람이라면 닿기 어려운 도전적인 목표를 좇는 편이에요.", "gist": "자기 효능감이 높은 사람의 첫 번째 특징이에요."}, {"n": 3, "ch": [{"e": "People with a strong sense of self-efficacy, therefore,", "k": "그러므로 강한 자기 효능감을 가진 사람들은"}, {"e": "may be more willing to <b>step outside<\/b>", "k": "더 기꺼이 밖으로 발을 디디려 할 수도 있다"}, {"e": "the <b>culturally prescribed behaviors<\/b>", "k": "문화적으로 규정된 행동"}, {"e": "to attempt tasks or goals", "k": "일이나 목표를 시도하기 위해"}, {"e": "for which success is viewed as <b>improbable<\/b>", "k": "성공이 있을 법하지 않다고 여겨지는"}, {"e": "by the majority of social actors in a setting.", "k": "어떤 환경의 사회적 행위자들의 대다수에 의해."}], "link": "그러므로 강한 자기 효능감을 가진 사람들은 어떤 환경의 사회적 행위자들 대다수가 성공이 있을 법하지 않다고 여기는 일이나 목표를 시도하기 위해 문화적으로 규정된 행동 밖으로 더 기꺼이 발을 디디려 할 수도 있다.", "easy": "그래서 자기 효능감이 강한 사람들은, 주변 사람 대부분이 ‘그건 성공 못 해’라고 보는 일에도 도전해요. 그러려고 사회가 정해 둔 행동 방식에서 기꺼이 벗어나요.", "gist": "이런 사람들은 문화가 정한 행동 틀을 벗어난다는 핵심 근거예요."}, {"n": 4, "ch": [{"e": "For these individuals,", "k": "이런 사람들에게,"}, {"e": "<b>culture will have little or no impact on behavior<\/b>.", "k": "문화는 행동에 거의 혹은 전혀 영향을 주지 않을 것이다.<span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}], "easy": "이런 사람들에게는 문화가 행동에 거의 영향을 주지 못해요.", "gist": "빈칸 문장이에요. 앞 문장의 내용을 한마디로 정리해요."}, {"n": 5, "ch": [{"e": "For example,", "k": "예를 들어,"}, {"e": "Australians tend to <b>endorse<\/b>", "k": "호주 사람들은 지지하는 경향이 있다"}, {"e": "the “Tall Poppy Syndrome.”", "k": "‘키 큰 양귀비 증후군’을."}], "easy": "예를 들어 호주 사람들은 ‘키 큰 양귀비 증후군’이라는 생각을 지지하는 편이에요.", "gist": "예시가 시작돼요. 호주의 문화 규범을 소개해요."}, {"n": 6, "ch": [{"e": "This saying suggests", "k": "이 말은 시사한다"}, {"e": "that any “poppy”", "k": "어떤 ‘양귀비’든"}, {"e": "that <b>outgrows<\/b> the others in a field", "k": "밭에서 다른 것들보다 더 자라는"}, {"e": "will get “cut down;”", "k": "‘잘리게’ 될 것임을,"}, {"e": "in other words,", "k": "다시 말해"}, {"e": "any <b>overachiever<\/b> will eventually fail.", "k": "누구든지 기대 이상의 성공을 거두는 사람은 결국 실패할 것임을."}], "link": "이 말은 밭에서 다른 것들보다 더 자라는 어떤 ‘양귀비’든 ‘잘리게’ 될 것임을, 다시 말해 기대 이상의 성공을 거두는 사람은 누구든 결국 실패할 것임을 시사한다.", "easy": "이 말은 밭에서 혼자 높이 자란 양귀비는 잘린다는 뜻이에요. 즉 남보다 튀게 잘하는 사람은 결국 실패한다는 말이에요.", "gist": "호주에는 튀는 사람을 끌어내리는 문화가 있다는 설명이에요."}, {"n": 7, "ch": [{"e": "Interviews and observations suggest", "k": "면담과 관찰은 시사한다"}, {"e": "that it is the <b>high self-efficacy Australians<\/b>", "k": "바로 높은 자기 효능감을 가진 호주 사람들이라는 것을"}, {"e": "who step outside this culturally prescribed behavior", "k": "이 문화적으로 규정된 행동 밖으로 벗어나는 사람들이"}, {"e": "to actually achieve beyond average.", "k": "평균 이상을 실제로 성취하기 위해."}], "link": "면담과 관찰은 평균 이상을 실제로 성취하기 위해 이 문화적으로 규정된 행동 밖으로 벗어나는 사람들이 바로 높은 자기 효능감을 가진 호주 사람들이라는 것을 시사한다.", "easy": "면담과 관찰을 해 보니, 이런 문화의 틀을 벗어나 실제로 평균 이상을 해내는 사람들은 바로 자기 효능감이 높은 호주 사람들이었어요.", "gist": "예시의 결론이에요. 자기 효능감이 높으면 문화에 휘둘리지 않는다는 것을 보여 줘요."}]}, {"no": "08", "typ": "글의 요지", "src": "2018년 10월 21번", "evn": [1, 3, 5], "ev_en": "When science is examined as an enterprise that involves the values of independence, freedom, the right to dissent, and tolerance, it is clear that as a social activity science cannot flourish in an authoritarian climate. / In a democratic environment, old ideas can be challenged and rigorously criticized, although with some difficulty because of the human desire to hold onto old ideas, especially by the original proposers. / As pointed out in an American Association for the Advancement of Science report, Science for All Americans, “indeed, challenges to new ideas are the legitimate business of science in building valid knowledge.”", "ev_ko": [[1, "과학이 독립, 자유, 이의를 제기할 권리 그리고 관용의 가치를 포함하는 진취적인 것으로 검토될 때, 사회적 활동으로서(의) 과학은 권위주의적인 풍토에서 번영할 수 없다는 것이 분명하다."], [3, "민주적인 환경에서 낡은 사상은 낡은 사상을 고수하려는 인간의 열망 때문에, 특히 원래의 제안자들에 의해(최초로 그 제안을 했던 사람들 때문에) 약간의 어려움이 있기는 하지만, 도전받고 혹독하게 비판받을 수 있다."], [5, "미국 과학 진흥 협회 보고서인 《Science for All Americans》에서 지적되었듯이, “실로, 새로운 생각에 대한 도전은 타당한 지식을 구축하는 데 있어 과학의 진정한 본분이다(타당한 지식을 구축하는 데 있어 과학이 해야 할 일은 새로운 생각에 계속해서 도전하는 것이다).”"]], "why": ["(1)에서 과학은 <b>권위주의적인 풍토에서 번영할 수 없다<\/b>고 합니다", "(3)에서는 <b>민주적인 환경<\/b>에서 낡은 사상이 도전받고 혹독하게 비판받을 수 있다고 합니다", "(5)에서는 새로운 생각에 대한 도전이 <b>타당한 지식을 구축하는<\/b> 과학의 진정한 본분이라고 합니다", "즉 민주적인 환경이어야 낡은 사상이 비판받고 대안이 제시되어, 과학이 타당한 지식을 쌓을 수 있다는 말입니다", "그래서 요지는 ⑤ ‘민주적 환경에서 과학은 타당한 지식을 형성하는 데 기여한다’입니다."], "ch": [{"n": "①", "t": "과학의 권위는 이론의 검증과 적용을 통해 확립된다.", "g": "", "ok": false, "e": ["(4)에 대안을 기존 개념에 맞대어 검증한다는 말은 나옵니다", "하지만 글은 검증으로 과학의 권위가 세워진다고 말하지 않습니다", "글의 중심은 민주적인 환경에서 과학이 제대로 이루어진다는 것입니다."]}, {"n": "②", "t": "철학의 추론 기법은 다양한 과학 연구에 응용될 수 있다.", "g": "", "ok": false, "e": ["(2)에 과학 철학자 Bronowski가 나오지만, 그의 주장을 소개할 뿐입니다", "철학의 추론 기법을 과학 연구에 응용한다는 내용은 없습니다."]}, {"n": "③", "t": "과학 탐구의 방향은 공동체의 정치적인 지향을 반영한다.", "g": "", "ok": false, "e": ["글은 권위주의적인 풍토에서는 과학이 번영할 수 없다고 합니다(1번)", "과학 탐구의 방향이 공동체의 정치적 지향을 따라간다는 말은 없습니다."]}, {"n": "④", "t": "기존의 지식에서 새로운 아이디어의 실마리를 찾을 수 있다.", "g": "", "ok": false, "e": ["(4)는 대안적 개념을 제시하고 그것을 기존의 개념에 맞대어 검증한다는 뜻입니다", "기존 지식에서 새 아이디어의 실마리를 찾는다는 말이 아닙니다."]}, {"n": "⑤", "t": "민주적 환경에서 과학은 타당한 지식을 형성하는 데 기여한다.", "g": "", "ok": true, "e": ["(1)의 권위주의적인 풍토에서는 과학이 번영할 수 없다는 말, (3)의 민주적인 환경에서 낡은 사상이 비판받을 수 있다는 말, (5)의 타당한 지식을 구축한다는 말을 하나로 묶은 것입니다."]}], "tr": ["과학이 독립, 자유, 이의를 제기할 권리 그리고 관용의 가치를 포함하는 진취적인 것으로 검토될 때, 사회적 활동으로서(의) 과학은 권위주의적인 풍토에서 번영할 수 없다는 것이 분명하다.", "Bronowski(브로노프스키)와 같은 일부의 과학 철학자들은 과학이 권위주의적인 체제에서는 실천될(행해질) 수 없다고 주장한다.", "민주적인 환경에서 낡은 사상은 낡은 사상을 고수하려는 인간의 열망 때문에, 특히 원래의 제안자들에 의해(최초로 그 제안을 했던 사람들 때문에) 약간의 어려움이 있기는 하지만, 도전받고 혹독하게 비판받을 수 있다.", "그렇지만 대안적 개념을 제시하고, 그런 다음 그것들을 기존의 개념에 맞대어 검증하는 것이 과학적 사고의 본질이다.", "미국 과학 진흥 협회 보고서인 《Science for All Americans》에서 지적되었듯이, “실로, 새로운 생각에 대한 도전은 타당한 지식을 구축하는 데 있어 과학의 진정한 본분이다(타당한 지식을 구축하는 데 있어 과학이 해야 할 일은 새로운 생각에 계속해서 도전하는 것이다).”"], "ps": [{"n": 1, "ch": [{"e": "When science is examined as an <b>enterprise<\/b>", "k": "과학이 진취적인 것으로 검토될 때"}, {"e": "that involves the values of independence, freedom,", "k": "독립, 자유의 가치를 포함하는"}, {"e": "the right to <b>dissent<\/b>, and <b>tolerance<\/b>,", "k": "이의를 제기할 권리 그리고 관용의 (가치를),"}, {"e": "it is clear", "k": "분명하다"}, {"e": "that as a social activity", "k": "사회적 활동으로서"}, {"e": "science cannot <b>flourish<\/b> in an <b>authoritarian<\/b> climate.", "k": "과학은 권위주의적인 풍토에서 번영할 수 없다는 것이."}], "link": "과학이 독립, 자유, 이의를 제기할 권리 그리고 관용의 가치를 포함하는 진취적인 것으로 검토될 때, 사회적 활동으로서 과학은 권위주의적인 풍토에서 번영할 수 없다는 것이 분명하다.", "easy": "과학을 독립, 자유, 반대할 권리, 관용 같은 가치를 담은 진취적인 활동으로 본다면, 과학은 권위주의적인 분위기에서는 꽃필 수 없어요.", "gist": "글의 중심 생각이에요. 권위주의 아래에서는 과학이 자라지 못한다고 해요."}, {"n": 2, "ch": [{"e": "Some philosophers of science such as Bronowski", "k": "Bronowski와 같은 일부의 과학 철학자들은"}, {"e": "claim", "k": "주장한다"}, {"e": "that science cannot be practiced", "k": "과학이 실천될 수 없다고"}, {"e": "in authoritarian <b>regimes<\/b>.", "k": "권위주의적인 체제에서는."}], "easy": "Bronowski 같은 과학 철학자들은 권위주의적인 나라에서는 과학을 할 수 없다고 말해요.", "gist": "1번 문장을 뒷받침하는 학자의 주장이에요."}, {"n": 3, "ch": [{"e": "In a <b>democratic environment<\/b>,", "k": "민주적인 환경에서"}, {"e": "old ideas can be challenged", "k": "낡은 사상은 도전받을 수 있다"}, {"e": "and <b>rigorously<\/b> criticized,", "k": "그리고 혹독하게 비판받을 (수 있다),"}, {"e": "although with some difficulty", "k": "약간의 어려움이 있기는 하지만"}, {"e": "because of the human desire to <b>hold onto<\/b> old ideas,", "k": "낡은 사상을 고수하려는 인간의 열망 때문에,"}, {"e": "especially by the original <b>proposers<\/b>.", "k": "특히 원래의 제안자들에 의한 (열망)."}], "link": "민주적인 환경에서 낡은 사상은 그것을 고수하려는 인간의 열망, 특히 원래 제안자들의 열망 때문에 약간의 어려움이 있기는 하지만, 도전받고 혹독하게 비판받을 수 있다.", "easy": "민주적인 환경에서는 낡은 생각에 도전하고 따끔하게 비판할 수 있어요. 물론 사람들은 원래 생각을 붙잡고 싶어 해서 조금 어렵기는 해요. 특히 그 생각을 처음 낸 사람들이 그래요.", "gist": "민주적인 환경에서는 낡은 생각을 비판할 수 있다는 핵심 근거예요."}, {"n": 4, "ch": [{"e": "Yet it is the <b>essence<\/b> of scientific thinking", "k": "그렇지만 과학적 사고의 본질이다"}, {"e": "to propose <b>alternative<\/b> ideas", "k": "대안적 개념을 제시하고"}, {"e": "and then to test them", "k": "그런 다음 그것들<span class=\"r\">(= 대안적 개념)<\/span>을 검증하는 것이"}, {"e": "against existing concepts.", "k": "기존의 개념에 맞대어."}], "easy": "그래도 새로운 생각을 내놓고 그것을 기존 생각과 비교해 시험해 보는 것이 과학적 사고의 핵심이에요.", "gist": "낡은 생각에 도전하는 것이 바로 과학의 본질이라고 강조해요."}, {"n": 5, "ch": [{"e": "As pointed out", "k": "지적되었듯이"}, {"e": "in an American Association for the Advancement of Science report,", "k": "미국 과학 진흥 협회 보고서인"}, {"e": "<i>Science for All Americans<\/i>,", "k": "《Science for All Americans》에서,"}, {"e": "“indeed, challenges to new ideas", "k": "“실로, 새로운 생각에 대한 도전은"}, {"e": "are the <b>legitimate<\/b> business of science", "k": "과학의 진정한 본분이다"}, {"e": "in building <b>valid knowledge<\/b>.”", "k": "타당한 지식을 구축하는 데 있어.”"}], "link": "미국 과학 진흥 협회 보고서인 《Science for All Americans》에서 지적되었듯이, “실로, 새로운 생각에 대한 도전은 타당한 지식을 구축하는 데 있어 과학의 진정한 본분이다.”", "easy": "미국 과학 진흥 협회의 보고서 《Science for All Americans》에서도, 새로운 생각에 도전하는 것이 타당한 지식을 쌓는 과학이 마땅히 할 일이라고 말해요.", "gist": "보고서를 인용하며 글을 마무리해요. 도전과 비판이 타당한 지식을 만든다고 해요."}]}, {"no": "09", "typ": "글의 순서", "src": "2023학년도 수능 37번", "evn": [1, 2, 4, 5, 7, 8], "ev_en": "The most commonly known form of results-based pricing is a practice called contingency pricing, used by lawyers. / Therefore, only an outcome in the client’s favor is compensated. / Their biggest fears are high fees for a case that may take years to settle. / By using contingency pricing, clients are ensured that they pay no fees until they receive a settlement. / Contingency pricing is the major way that personal injury and certain consumer cases are billed. / In this approach, lawyers do not receive fees or payment until the case is settled, when they are paid a percentage of the money that the client receives.", "ev_ko": [[1, "결과 기반 가격 책정 중 가장 일반적으로 알려진 형태는 변호사가 사용하는 ‘승소 시 보수 약정’이라고 불리는 관행이다."], [2, "따라서 의뢰인에게 유리한 결과만 보수가 지불된다."], [4, "그들의 가장 큰 두려움은 해결하는 데 몇 년이 걸릴 수 있는 소송에 대한 높은 수수료이다."], [5, "승소 시 보수 약정을 사용함으로써 의뢰인은 합의금을 받을 때까지 수수료를 지불하지 않는 것을 보장받는다."], [7, "승소 시 보수 약정은 개인 상해 및 특정 소비자 소송에 대해 비용이 청구되는 주요 방식이다."], [8, "이 방식에서 변호사는 소송이 해결되고 나서야 수수료나 지불금을 받는데, 그때 그들은 의뢰인이 받는 금액의 일정 비율을 받는다."]], "why": ["주어진 문장 (1)은 ‘승소 시 보수 약정(<b>contingency pricing<\/b>)’이라는 글의 소재를 꺼냅니다", "(C)의 (7)이 이 약정이 무엇인지 정의하므로 주어진 문장 다음에는 (C)가 옵니다", "(8)에서 변호사는 소송이 해결되고 나서야 의뢰인이 받는 금액의 일정 비율을 받는다고 합니다", "이것은 (A)의 (2) <b>Therefore<\/b>, 의뢰인에게 유리한 결과만 보수가 지불된다는 말과 자연스럽게 이어지므로 (C) 다음에는 (A)가 옵니다", "(A)의 (4)에서 의뢰인의 가장 큰 두려움은 오래 걸리는 소송의 높은 수수료라고 합니다", "(B)의 (5)는 승소 시 보수 약정을 쓰면 합의금을 받을 때까지 수수료를 내지 않는다고 하여 그 두려움을 풀어 줍니다", "그래서 정답은 ④ (C) – (A) – (B)입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)의 (2)는 <b>Therefore<\/b>(따라서)로 시작하므로 앞에 그 이유가 와야 합니다", "주어진 문장은 용어만 소개할 뿐, 유리한 결과만 보수가 지불되는 이유가 되지 못합니다", "그 이유는 (C)의 (8)입니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": false, "e": ["(B)의 (5)는 의뢰인이 합의금을 받을 때까지 수수료를 내지 않는다고 합니다", "이것은 (A)의 (4)에 나온 높은 수수료에 대한 두려움을 풀어 주는 말이라 (A)보다 앞에 올 수 없습니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["(B)는 (A)의 (4)에 나온 의뢰인의 두려움에 답하는 내용이라 맨 앞에 올 험과 보상을 그들이 나눌 수 있게 해 주는.", "nat": "이러한 경우와 그 밖의 성공 조건부 가격 책정 사례에서는 서비스의 경제적 가치를 서비스 이전에 알아내기 어렵기 때문에, 제공자는 구매자에게 가치를 전달하는 데 따르는 위험과 보상을 함께 나눌 수 있는 가격을 만들어 낸다.", "ana": "<b>is hard to determine</b>에서 determine 뒤에 목적어가 없다. 빠진 것이 아니라 원래 목적어가 주어 자리로 올라간 <b>형용사 + to부정사</b> 구문이다. It is hard to determine <b>the economic value</b>를 뒤집으면 <b>The economic value is hard to determine</b>이 된다. easy·difficult·hard·impossible 뒤에 to부정사가 오면 이 뒤집기를 떠올리자. 뒤 절의 <b>that</b>은 a price를 받는 <b>주격 관계대명사</b>이고, 동사 <b>allows</b>가 단수인 것이 선행사가 price임을 알려 준다. <b>allow A to V</b>는 '<b>A가 ~할 수 있게 해 주다</b>'이며, 여기서 <b>them</b>은 providers를 가리킨다.", "pe": "\u0001In these and other instances<sup>1</sup> \u0001of contingency pricing<sup>2</sup>\u0002\u0002, / the \u0001economic\u0002 value \u0001of the service\u0002 is hard \u0001to determine<sup>3</sup> before the service\u0002, / and providers<sup>4</sup> develop a price / \u0001that allows them to share the risks and rewards<sup>5</sup> of delivering value to the buyer\u0002.", "pk": "\u0001이러한 경우와 그 밖의 성공 조건부 가격 책정 사례에서\u0002, / \u0001서비스의 경제적\u0002 가치는 \u0001서비스 이전에 알아내기\u0002 어렵다, / 그래서 제공자들은 가격을 만들어 낸다 / \u0001구매자에게 가치를 전달하는 데 따르는 위험과 보상을 그들이 나눌 수 있게 해 주는\u0002.", "core": "가치는 어렵고, 제공자들은 가격을 만들어 낸다.", "tags": ["In these and other instances = 전치사구(부사구): 문장 전체를 꾸밈. of contingency pricing = 형용사구: instances", "주어 value + 동사 is + 보어 hard. economic, of the service = 수식어: value. to determine ~ = to부정사(부사적): SVC 뒤 수식어 [기준: 문형 기준]", "접속사 and + 주어 providers + 동사 develop + 목적어 price", "that절 = 관계절(형용사절): price를 꾸밈. <b>allow A to V</b> = A가 V하게 해 주다. of delivering value ~ = 형용사구: risks and rewards"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) 절과 S+V+O(3형식) 절이 and로 이어진 문장</b>이다. 앞에 부사구, 뒤에 관계절이 붙어 길어졌다."}, {"t": "앞 절 뼈대이다.", "sub": ["S: value (가치). the economic (경제적인)와 of the service (서비스의)가 꾸민다", "V: is (be ~이다)", "C: hard (어려운)", "뼈대 = <b>the economic value is hard</b>"]}, {"t": "<b>to determine before the service</b>는 <b>to부정사(부사적 용법)</b>이다. hard를 꾸미며 '서비스 이전에 알아내기'라는 뜻이다. 형용사 hard를 꾸미는 수식어이므로 뼈대 밖에 둔다(문형 기준). (determine 결정하다·알아내다)"}, {"t": "맨 앞 <b>In these and other instances of contingency pricing</b>은 <b>전치사구(부사구)</b>이다. 문장 전체를 꾸미며 '이러한 경우와 그 밖의 성공 조건부 가격 책정 사례에서'라는 뜻이다. (instance 사례, contingency pricing 성공 조건부 가격 책정)"}, {"t": "뒤 절 뼈대이다.", "sub": ["S: providers (제공자들)", "V: develop (개발하다·만들어 내다)", "O: a price (가격)", "뼈대 = <b>providers develop a price</b>"]}, {"t": "<b>that allows them to share the risks and rewards of delivering value to the buyer</b>는 <b>주격 관계절(형용사절)</b>이다. price를 꾸미며 '그들이 구매자에게 가치를 전달하는 데 따르는 위험과 보상을 나누게 해 주는'이라는 뜻이다. allow A to V는 A가 V하게 해 주다이고, them = providers (제공자들)이다. (share 나누다, risk 위험, reward 보상, deliver 전달하다)"}], "sum": "성공 조건부 가격은 위험과 보상을 나누게 함"}, {"i": "05", "q": "10", "s": "A-3", "title": "S+V 병렬 + 삽입 분사구 + happen to be -ing", "eng": "After more than forty years, / by then<sup>1</sup> fairly<sup>2</sup> forgotten<sup>3</sup> in this part of the world, / he happened to<sup>4</sup> be passing through<sup>5</sup> Hawaii with his wife, / and decided to go back to the beach for a look.", "notes": [["1", "by then", "그때쯤에"], ["2", "fairly", "꽤, 상당히"], ["3", "forget", "잊다"], ["4", "happen to V", "우연히 ~하다"], ["5", "pass through", "~을 지나가다"]], "lit": "40년도 더 지난 뒤, / 그때쯤 세계의 이 지역에서는 상당히 잊힌 채, / 그는 우연히 아내와 함께 하와이를 지나가고 있었고, / 그리고 한번 보려고 그 해변으로 돌아가기로 마음먹었다.", "nat": "40년도 더 지난 뒤, 그때쯤 이 지역에서는 상당히 잊힌 인물이 된 채로, 그는 우연히 아내와 함께 하와이를 지나가게 되었고 한번 보려고 그 해변에 다시 가 보기로 했다.", "ana": "콤마 사이에 낀 <b>by then fairly forgotten ~</b>은 동사가 아니라 <b>과거분사구</b>이며, 뒤에 나오는 주어 <b>he</b>를 설명한다. 원래는 <b>(being) forgotten</b>인데 being이 생략된 <b>분사구문</b>이다. 그가 잊는 것이 아니라 '<b>잊힌</b>' 쪽이므로 -ed다. 콤마 두 개 사이에 <b>동사 없이 -ed로 시작하는 덩어리</b>가 보이면 통째로 괄호로 묶고 지워서 뼈대부터 잡자. 그러면 <b>he happened to be passing ~ and decided ~</b>가 남는다. <b>happen to V</b>는 '<b>우연히 ~하다</b>'이고, 여기에 진행형이 결합해 happened to <b>be passing</b>이 되었다. and 뒤의 <b>decided</b>는 새 주어 없이 나왔으므로 앞의 he를 이어받는 <b>동사 병렬</b>이다.", "pe": "\u0001After more than forty years\u0002, / \u0001by then<sup>1</sup> fairly<sup>2</sup> forgotten<sup>3</sup> in this part of the world\u0002, / he happened to<sup>4</sup> be passing \u0001through<sup>5</sup> Hawaii\u0002 \u0001with his wife\u0002, / and decided to go back \u0001to the beach\u0002 \u0001for a look\u0002.", "pk": "\u000140년도 더 지난 뒤\u0002, / \u0001그때쯤 세계의 이 지역에서는 상당히 잊힌 채\u0002, / 그는 우연히 \u0001아내와 함께\u0002 하와이를 지나가고 있었고, / 그리고 \u0001한번 보려고\u0002 \u0001그 해변으로\u0002 돌아가기로 마음먹었다.", "core": "그는 우연히 지나가고 있었고, 해변으로 돌아가기로 마음먹었다.", "tags": ["After more than forty years = 전치사구(부사구): 문장 전체를 꾸밈 (시간 경과)", "by then ~ forgotten = 과거분사구(분사구문, being 생략): he를 꾸밈. in this part of the world = 전치사구(부사구): forgotten", "주어 he + 동사 happened to be passing. through Hawaii = 전치사구(부사구): passing 꾸밈, 거의 필수에 가까운 부사구 (pass through). with his wife = 부사구: passing 꾸밈", "and: 동사 병렬(happened / decided). decide to V = V하기로 결심. to the beach = 전치사구(부사구): go back 꾸밈 [기준: 모양 규칙]. for a look = 전치사구(부사구, 목적): go 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V 동사 병렬</b>이다. happened to be passing(happen + to부정사)과 decided to go back(decide + to부정사 목적어)이 and로 이어진다. 앞에 부사구와 삽입 분사구가 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: he (그)", "V: happened (happen 우연히 ~하다의 과거형) + to be passing (지나가고 있기), decided (decide 결심하다의 과거형) + to go back (돌아가기로). 병렬", "뼈대 = <b>he happened to be passing and decided to go back</b>"]}, {"t": "맨 앞 <b>After more than forty years</b>는 <b>전치사구(부사구)</b>이다. 문장 전체를 꾸미며 '40년도 더 지난 뒤'라는 뜻이다."}, {"t": "<b>by then fairly forgotten in this part of the world</b>는 <b>과거분사 분사구문(being 생략)</b>이다. he를 꾸미며 '그때쯤 이 지역에서는 상당히 잊힌 채'라는 뜻이다.", "sub": ["fairly 상당히, forget 잊다의 과거분사 forgotten"]}, {"t": "<b>through Hawaii</b>는 pass through (~을 지나다)의 일부라 <b>거의 필수에 가까운 부사구</b>이다. <b>with his wife</b> (아내와 함께)는 passing을 꾸민다.", "sub": ["<b>to the beach</b> (그 해변으로)는 go back을 꾸미는 전치사구이고, <b>for a look</b>은 '한번 보려고'라는 뜻의 목적 전치사구이다. 문형 기준에서는 뼈대 밖 수식어로 둔다."]}, {"t": "함정: happened와 decided는 병렬이다. 기준: happen to V도 try, decide to V처럼 뒤의 to부정사를 뼈대에 둔다."}], "sum": "40년 뒤 하와이를 지나다 해변을 보러 가기로 함"}, {"i": "06", "q": "10", "s": "B-4", "title": "S+V(1형식) + of 전치사구 병렬 + what절", "eng": "They talked of Bernard's winning<sup>1</sup> in Makaha, / of the beautiful waves<sup>2</sup> in Hawaii, / of what had happened<sup>3</sup> in the beach since<sup>4</sup>.", "notes": [["1", "win", "우승하다, 우승"], ["2", "wave", "파도"], ["3", "what", "~한 것"], ["4", "since", "그 이후로"]], "lit": "그들은 Makaha에서의 Bernard의 우승에 대해 이야기했고, / 하와이의 아름다운 파도에 대해, / 그 이후로 그 해변에서 일어났던 일에 대해.", "nat": "그들은 Makaha에서 Bernard가 우승한 일, 하와이의 아름다운 파도, 그리고 그 이후로 그 해변에서 일어난 일에 대해 이야기했다.", "ana": "<b>of</b>가 세 번 반복된다. 반복되는 전치사는 <b>병렬의 신호</b>다. talked <b>of</b> A, <b>of</b> B, <b>of</b> C로 세 개가 나란히 talked에 걸린다. 이렇게 같은 전치사가 콤마와 함께 반복되면 앞 동사를 계속 이어 붙여 읽어야 한다. <b>Bernard's winning</b>에서 winning은 동명사이고, 앞의 소유격 Bernard's가 그 <b>의미상 주어</b>다. '<b>Bernard가 우승한 것</b>'이라고 풀어 읽는다. 마지막 <b>what had happened</b>의 what은 선행사를 품은 관계대명사로 '<b>~한 일</b>'이다. 시제가 <b>과거완료</b>인 이유는, 두 사람이 이야기하던 시점(과거)보다 <b>더 이전</b>에 일어난 일이기 때문이다. 문장 끝의 <b>since</b>는 접속사가 아니라 '<b>그 이후로</b>'라는 부사다.", "pe": "They talked \u0001of Bernard's winning<sup>1</sup> \u0001in Makaha\u0002\u0002, / \u0001of the beautiful waves<sup>2</sup> \u0001in Hawaii\u0002\u0002, / \u0001of what had happened<sup>3</sup> in the beach since<sup>4</sup>\u0002.", "pk": "그들은 \u0001\u0001Makaha에서의\u0002 Bernard의 우승에 대해\u0002 이야기했고, / \u0001하와이의 아름다운 파도에 대해\u0002, / \u0001그 이후로 그 해변에서 일어났던 일에 대해\u0002.", "core": "그들은 이야기했다.", "tags": ["주어 They + 동사 talked (1형식). of ~ = 전치사구(부사구): talked 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]. in Makaha = 형용사구: winning 꾸밈", "of the waves = 병렬 전치사구(부사구): talked를 꾸밈. beautiful = 형용사: waves. in Hawaii = 형용사구: waves", "of what절 = 병렬 전치사구. what절 = 전치사 of의 목적어(명사절). since = 부사(그 이후로)"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 전치사구가 세 개 병렬되어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: They (그들)", "V: talked (talk 이야기하다의 과거형)", "뼈대 = <b>They talked</b>", "of ~는 talk of (~에 대해 이야기하다)의 일부라 거의 필수에 가까운 부사구. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준)"]}, {"t": "<b>of Bernard's winning in Makaha</b>는 첫째 <b>전치사구</b>이다. 'Bernard가 Makaha에서 우승한 일에 대해'라는 뜻이다.", "sub": ["winning (win 이기다의 동명사, 우승한 일). Bernard's는 그 의미상 주어", "in Makaha (Makaha에서)는 winning을 꾸미는 형용사구"]}, {"t": "<b>of the beautiful waves in Hawaii</b>는 둘째 병렬 전치사구이다. '하와이의 아름다운 파도에 대해'라는 뜻이다. (wave 파도)"}, {"t": "<b>of what had happened in the beach since</b>는 셋째 병렬 전치사구이다. what절은 of의 목적어(명사절)이다. '그 이후로 그 해변에서 일어났던 일에 대해'라는 뜻이다. (happen 일어나다, since 그 이후로)"}], "sum": "Bernard의 우승, 하와이의 파도, 그 후의 일을 이야기"}, {"i": "07", "q": "10", "s": "C-2", "title": "S+V+C(2형식) + 관계부사 where절", "eng": "It was classic<sup>1</sup> Hawaiian culture, / where giving<sup>2</sup> what you have / is always the first order of things<sup>3</sup>.", "notes": [["1", "classic", "전형적인"], ["2", "give", "주다"], ["3", "first order of things", "가장 우선하는 일"]], "lit": "그것은 전형적인 하와이 문화였다, / 그곳에서는 자신이 가진 것을 주는 일이 / 언제나 가장 우선하는 일이다.", "nat": "그것은 자신이 가진 것을 내주는 일이 언제나 가장 우선인 전형적인 하와이 문화였다.", "ana": "콤마 뒤의 <b>where</b>는 장소를 물어보는 의문사가 아니라 앞의 culture를 받는 <b>관계부사</b>다. 문화는 눈에 보이는 장소는 아니지만, 어떤 일이 벌어지는 <b>영역·상황</b>을 나타내는 명사(culture·society·case·situation) 뒤에도 where가 쓰인다. where절 안에서 주어는 <b>giving what you have</b> 전체다. 동명사 giving이 주어가 되었으므로 동사는 <b>is</b>로 단수다. 그 안의 <b>what you have</b>는 giving의 목적어로 들어간 관계대명사절이며, '<b>당신이 가진 것</b>'으로 옮긴다. what은 선행사를 품고 있어 앞에 명사가 없다는 점이 that·which와 다르다.", "pe": "It was \u0001classic<sup>1</sup> Hawaiian\u0002 culture, / \u0001where giving<sup>2</sup> what you have\u0002 / \u0001is always the first order of things<sup>3</sup>\u0002.", "pk": "그것은 \u0001전형적인 하와이\u0002 문화였다, / \u0001그곳에서는 자신이 가진 것을 주는 일이\u0002 / \u0001언제나 가장 우선하는 일이다\u0002.", "core": "그것은 문화였다.", "tags": ["주어 It + 동사 was + 보어 culture. classic Hawaiian = 형용사: culture를 꾸밈", "where절(1/2) = 관계부사절(형용사절): culture를 꾸밈. 주어: 동명사구 giving what you have (what절은 giving의 목적어)", "where절(2/2): 동사 is + 보어 order. always = 부사. of things = 형용사구: order. the first order of things = 가장 우선인 일"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 뒤에 where절이 길게 붙어 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (그것)", "V: was (be ~이었다)", "C: culture (문화). classic Hawaiian (전형적인 하와이의)이 꾸민다", "뼈대 = <b>It was classic Hawaiian culture</b>"]}, {"t": "<b>where giving what you have is always the first order of things</b>는 <b>관계부사절(형용사절)</b>이다. culture를 꾸미며 '그곳에서는 가진 것을 주는 일이 언제나 가장 우선인'이라는 뜻이다.", "sub": ["S: giving what you have (가진 것을 주는 것. 동명사구)", "V: is", "C: the first order of things (가장 우선인 일). order 순서·우선순위", "always (언제나)는 is를 꾸미는 부사"]}, {"t": "what you have는 giving의 목적어인 what절이다. '네가 가진 것'이라는 뜻이다."}, {"t": "함정: where는 '그곳에서는'이라는 뜻으로 culture를 선행사로 받는 관계부사이다. 의문사 where가 아니다."}], "sum": "가진 것을 주는 일이 으뜸인 하와이 문화"}, {"i": "08", "q": "10", "s": "D-4", "title": "the 비교급 ~, the 비교급 ~", "eng": "The further out<sup>1</sup> he got, / the more freedom<sup>2</sup> he felt.", "notes": [["1", "further out", "더 멀리 (바다 쪽으로)"], ["2", "freedom", "자유"]], "lit": "그가 더 멀리 나아갈수록, / 그는 더 많은 자유를 느꼈다.", "nat": "그는 (바다 쪽으로) 더 멀리 나아갈수록 더 큰 자유를 느꼈다.", "ana": "문장이 짧다고 만만하게 볼 자리가 아니다. <b>The 비교급 ~, the 비교급 ...</b> 구문으로, '<b>~하면 할수록 더 …하다</b>'라는 뜻이다. 여기서 앞의 The는 정관사가 아니라 이 구문 전용 표시라서 명사가 붙지 않아도 된다. 어순도 특이하다. 원래 문장은 He got <b>further out</b>과 He felt <b>more freedom</b>인데, <b>비교급 부분만 통째로 문두로 끌어낸</b> 형태다. 그래서 he got·he felt처럼 <b>주어와 동사가 뒤에</b> 남는다. 짧더라도 반드시 <b>콤마 앞뒤 두 덩어리</b>로 끊어 읽어야 이 대응 관계가 보인다.", "pe": "The further out<sup>1</sup> he got, / the more freedom<sup>2</sup> he felt.", "pk": "그가 더 멀리 나아갈수록, / 그는 더 많은 자유를 느꼈다.", "core": "그가 멀리 나아갈수록 더 큰 자유를 느꼈다.", "tags": ["<b>The 비교급 ~, the 비교급 ~</b> = ~할수록 더 ~. 원래 문장: he got further out(멀리 나아갔다). out = 부사 [기준: 비교급 구문은 괄호 없이 뼈대로 둠]", "원래 문장: he felt more freedom. more freedom이 앞으로 나온 목적어"], "steps": [{"t": "이 문장은 <b>the 비교급 ~, the 비교급 ~</b> 구문이다. '~할수록 더 ~하다'로 읽는다. 둘 다 비교급 표현이 문장 앞으로 나간 형태이다."}, {"t": "앞 절 뼈대이다. 원래 문장은 he got further out이다.", "sub": ["S: he (그)", "V: got (get 이르다·나아가다의 과거형)", "further (더 멀리)와 out (바깥으로)은 부사이다. get 뒤라 거의 필수에 가까운 부사구(문형 기준)", "뼈대 = <b>he got</b>", "The further out ~ = 더 멀리 나아갈수록"]}, {"t": "뒤 절 뼈대이다. 원래 문장은 he felt more freedom이다.", "sub": ["S: he", "V: felt (feel 느끼다의 과거형)", "O: more freedom (더 많은 자유). the가 붙어 목적어가 앞으로 나갔다", "뼈대 = <b>he felt more freedom</b>", "the more freedom ~ = 더 큰 자유를 느꼈다"]}, {"t": "기준: 비교급 구문은 괄호 없이 뼈대로 두고, 두 절의 비례 관계로 읽는다."}, {"t": "함정: the 뒤에 바로 비교급이 와서 낯설다. 앞으로 나간 비교급 표현이 원래 있던 자리를 떠올리면 쉽다."}], "sum": "더 멀리 나아갈수록 더 큰 자유를 느낌"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2019학년도 6월 32번", "ans": "②", "tr": [["1", "행동과의 관계를 조정하는 개인적 특성은 자기 효능감, 즉 특정 수준의 성과를 이루어 내는 자신의 능력에 대한 판단이다."], ["2", "높은 자기 효능감을 가진 사람들은 평균적인 사람의 손이 닿지 않는 곳에 있을 법한 도전적인 목표를 추구하는 경향이 있다."], ["3", "그러므로 강한 자기 효능감을 가진 사람들은, 어떤 환경 속 사회 구성원 대다수가 성공하기 어렵다고 여기는 과업이나 목표를 시도하기 위해 문화적으로 규정된 행동에서 더 기꺼이 벗어나려 할 수 있다."], ["4", "이런 사람들에게는 ______."], ["5", "예를 들어 호주 사람들은 ‘키 큰 양귀비 증후군’을 지지하는 경향이 있다."], ["6", "이 격언은 들판에서 다른 것들보다 더 자란 어떤 ‘양귀비’든 ‘잘릴’ 것임을 시사한다. 다시 말해, 기대 이상의 성과를 내는 사람은 결국 실패하리라는 것이다."], ["7", "면접과 관찰은 이 문화적으로 규정된 행동에서 벗어나 실제로 평균을 넘어서는 성취를 하는 사람이 바로 자기 효능감이 높은 호주 사람들임을 시사한다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "Interviews and observations suggest that it is the high self-efficacy Australians who step outside this culturally prescribed behavior to actually achieve beyond average."}, {"en": false, "h": "빈칸 뒤 <b>For example</b>이 붙었으므로, 5~7번 문장의 예시를 <b>한 문장으로 되돌리면</b> 그것이 답이다. 예시의 구조는 이렇다. 호주에는 <b>튀면 잘린다</b>는 강력한 문화 규범이 있다(5·6번). 그런데 자기 효능감이 높은 호주 사람들은 <b>그 규범에서 벗어나</b> 평균을 넘어선다(7번). 즉 <b>문화가 그들의 행동을 붙잡지 못했다</b>는 것이다. 3번 문장의 <b>step outside the culturally prescribed behaviors</b>도 같은 말이다. 따라서 빈칸에는 ‘이런 사람들에게는 <b>문화가 행동에 거의 또는 전혀 영향을 주지 못한다</b>’가 들어가야 한다. 빈칸이 <b>For these individuals</b>로 시작한다는 점을 놓치면 ④ 같은 함정에 걸린다."}], "opts": [{"n": "①", "t": "self-efficacy is not easy to define", "a": false, "x": true, "trap": false, "e": "자기 효능감의 <b>정의</b>는 1번 문장에 이미 깔끔하게 나와 있다. 정의하기 어렵다는 논의는 글에 없다."}, {"n": "②", "t": "culture will have little or no impact on behavior", "a": true, "x": false, "trap": false, "e": "규범을 벗어나(step outside) 평균 이상을 이룬다는 7번 문장을 그대로 뒤집어 표현했다."}, {"n": "③", "t": "setting a goal is important before starting a task", "a": false, "x": true, "trap": false, "e": "목표 설정의 <b>중요성</b>을 말하는 글이 아니다. 글은 목표를 어떻게 정하느냐가 아니라 <b>문화 규범과의 관계</b>를 다룬다."}, {"n": "④", "t": "high self-efficacy is a typical quality of Australians", "a": false, "x": true, "trap": true, "e": "호주는 문화 규범의 <b>예시</b>일 뿐이고, 자기 효능감이 높은 호주인은 오히려 <b>소수</b>다. 호주인 전체의 특성이라고 하면 정반대가 된다."}, {"n": "⑤", "t": "judging the reaction from the community will be hard", "a": false, "x": true, "trap": false, "e": "공동체의 반응을 <b>예측하기 어렵다</b>는 말은 없다. 오히려 잘린다는 반응은 아주 분명하게 예측되어 있다."}], "w": [["moderate", "조정하다, 완화하다"], ["self-efficacy", "자기 효능감"], ["capability", "능력, 역량"], ["accomplish", "성취하다, 이루다"], ["tend to V", "~하는 경향이 있다"], ["outside the reach of", "~의 손이 닿지 않는"], ["be willing to V", "기꺼이 ~하다"], ["prescribed", "규정된"], ["improbable", "있을 법하지 않은"], ["endorse", "지지하다"], ["outgrow", "~보다 더 자라다"], ["overachiever", "기대 이상의 성과를 내는 사람"]]}, {"q": "08", "type": "글의 요지", "src": "2018년 10월 21번", "ans": "⑤", "tr": [["1", "과학이 독립, 자유, 이의를 제기할 권리, 관용이라는 가치를 포함하는 진취적인 것으로 검토될 때, 사회적 활동으로서 과학은 권위주의적인 풍토에서 번성할 수 없다는 것이 분명하다."], ["2", "Bronowski 같은 일부 과학 철학자는 과학이 권위주의적 체제에서는 실행될 수 없다고 주장한다."], ["3", "민주적인 환경에서는 낡은 생각에 이의를 제기하고 혹독하게 비판할 수 있다. 다만 낡은 생각을, 특히 원래 그것을 제안한 사람들이 고수하려는 인간의 욕망 때문에 다소 어려움이 따른다."], ["4", "그러나 대안적인 생각을 제시하고 그것을 기존 개념에 비추어 검증하는 것이 바로 과학적 사고의 본질이다."], ["5", "미국 과학 진흥 협회의 보고서 〈Science for All Americans〉에서 지적되었듯이, “실로, 새로운 생각에 대한 이의 제기는 타당한 지식을 구축하는 데 있어 과학의 정당한 본분이다.”"]], "evh": "1번 문장", "ev": [{"en": true, "h": "When science is examined as an enterprise that involves the values of independence, freedom, the right to dissent, and tolerance, it is clear that as a social activity science cannot flourish in an authoritarian climate."}, {"en": false, "h": "요지 문항은 <b>첫 문장과 마지막 문장이 서로를 받쳐 주는지</b>를 먼저 본다. 1번 문장은 <b>권위주의적 풍토에서 과학은 번성할 수 없다</b>고 못 박고, 마지막 5번 문장은 인용을 빌려 <b>이의 제기가 타당한 지식을 구축하는 과학의 본분</b>이라고 마무리한다. 두 문장을 합치면 ‘<b>자유롭게 이의를 제기할 수 있는 민주적 환경이라야 과학이 타당한 지식을 만든다</b>’가 된다. 3번 문장의 <b>In a democratic environment, old ideas can be challenged</b>가 그 사이를 이어 준다. 부정문(cannot flourish)으로 시작한 글은 <b>긍정문으로 뒤집어</b> 요지를 만들면 정확해진다."}], "opts": [{"n": "①", "t": "과학의 권위는 이론의 검증과 적용을 통해 확립된다.", "a": false, "x": true, "trap": false, "e": "<b>authority</b>라는 단어가 authoritarian과 닮아 헷갈리지만, 글은 과학의 <b>권위</b>가 아니라 과학이 놓인 <b>환경</b>을 말한다."}, {"n": "②", "t": "철학의 추론 기법은 다양한 과학 연구에 응용될 수 있다.", "a": false, "x": true, "trap": false, "e": "Bronowski는 <b>과학 철학자</b>로 잠깐 인용될 뿐이다. 철학의 방법론을 과학에 응용한다는 서술은 없다."}, {"n": "③", "t": "과학 탐구의 방향은 공동체의 정치적인 지향을 반영한다.", "a": false, "x": true, "trap": false, "e": "정치 체제가 과학에 미치는 <b>조건</b>은 말하지만, 과학의 <b>탐구 방향</b>이 정치 성향을 따라간다는 말은 아니다. 인과의 내용이 다르다."}, {"n": "④", "t": "기존의 지식에서 새로운 아이디어의 실마리를 찾을 수 있다.", "a": false, "x": true, "trap": true, "e": "4번 문장은 <b>대안을 제시하고 기존 개념에 비추어 검증한다</b>는 뜻이지, 기존 지식에서 <b>실마리를 얻는다</b>는 뜻이 아니다."}, {"n": "⑤", "t": "민주적 환경에서 과학은 타당한 지식을 형성하는 데 기여한다.", "a": true, "x": false, "trap": false, "e": "1번 문장의 <b>cannot flourish in an authoritarian climate</b>와 5번 문장의 <b>building valid knowledge</b>를 하나로 묶은 서술이다."}], "w": [["enterprise", "진취적인 것, 모험적 사업"], ["dissent", "이의를 제기하다"], ["tolerance", "관용"], ["flourish", "번영하다, 번성하다"], ["authoritarian", "권위주의적인, 독재적인"], ["climate", "풍토, 기후"], ["regime", "체제, 정권"], ["rigorously", "혹독하게, 가혹하게"], ["hold onto", "~을 고수하다"], ["essence", "본질"], ["legitimate", "정당한, 합당한"], ["valid", "타당한"]]}, {"q": "09", "type": "글의 순서", "src": "2023학년도 수능 37번", "ans": "④", "tr": [["1", "결과 기반 가격 책정 중 가장 흔히 알려진 형태는 변호사가 사용하는 ‘성공 조건부 가격 책정’이라 불리는 관행이다."], ["2", "성공 조건부 가격 책정은 신체 상해와 특정 소비자 소송에 비용이 청구되는 주된 방식이다."], ["3", "이 방식에서 변호사는 소송이 해결될 때까지 수수료나 지불금을 받지 않으며, 해결되면 의뢰인이 받는 금액의 일정 비율을 받는다."], ["4", "따라서 의뢰인에게 유리한 결과만 보수가 지불된다."], ["5", "의뢰인의 관점에서 이러한 가격 책정은 어느 정도 타당한데, 이런 소송의 의뢰인 대부분이 법률 회사에 익숙하지 않고 어쩌면 위압감을 느끼기 때문이다."], ["6", "그들의 가장 큰 두려움은 해결되는 데 몇 년이 걸릴 수도 있는 소송에 드는 높은 수수료다."], ["7", "성공 조건부 가격 책정을 이용하면 의뢰인은 합의금을 받을 때까지 수수료를 지불하지 않는다는 것을 보장받는다."], ["8", "이러한 경우와 그 밖의 성공 조건부 가격 책정 사례에서는 서비스의 경제적 가치를 서비스 이전에 알아내기 어렵기 때문에, 제공자는 구매자에게 가치를 전달하는 데 따르는 위험과 보상을 함께 나눌 수 있는 가격을 만들어 낸다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "Contingency pricing is the major way that personal injury and certain consumer cases are billed."}, {"en": false, "h": "순서 문항은 <b>지시어와 연결어</b>만 따라가면 된다. 주어진 글은 contingency pricing이라는 <b>용어를 소개</b>만 하고 끝난다. 그러면 그 용어가 <b>무엇인지 설명하는</b> 단락이 바로 와야 하는데, (C)가 정확히 그 역할을 한다(<b>Contingency pricing is the major way ~</b>). (A)와 (B)는 둘 다 그 설명을 전제로 하므로 (C)보다 앞설 수 없다. 다음으로 (A)는 <b>Therefore</b>로 시작하는데, ‘의뢰인에게 유리한 결과만 보수가 지불된다’는 결론은 (C)의 ‘소송이 해결될 때까지 돈을 받지 않는다’에서 곧바로 나온다. 마지막으로 (B)의 <b>By using contingency pricing, clients are ensured ~</b>는 (A)에서 말한 의뢰인의 <b>두려움(높은 수수료)</b>에 대한 답이다. 그래서 (C) – (A) – (B)다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)의 <b>Therefore</b>는 앞에 근거가 있어야 성립한다. 주어진 글은 용어만 소개했을 뿐 ‘유리한 결과만 보수를 받는다’의 근거가 되지 못한다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(B)의 <b>In these and other instances</b>는 앞서 사례가 나왔어야 쓸 수 있는 표현이다. 두 번째 자리에 올 수 없다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": false, "x": true, "trap": false, "e": "역시 (B)가 먼저 올 수 없다. 또 (A)의 Therefore가 (C)의 설명 바로 뒤에 붙어야 자연스럽다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": true, "x": false, "trap": false, "e": "용어 설명(C) → 그로부터 나오는 결론과 의뢰인의 두려움(A) → 그 두려움을 해소하는 보장(B)으로 이어진다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": false, "x": true, "trap": true, "e": "(C) 다음에 (B)를 놓으면, (A)의 <b>Therefore</b>가 받을 앞 문장이 사라진다. 또 (B)의 마무리 문장은 글 전체를 닫는 일반화라 중간에 올 수 없다."}], "w": [["results-based pricing", "결과 기반 가격 책정"], ["contingency pricing", "성공 조건부 가격 책정"], ["bill", "비용을 청구하다"], ["personal injury", "신체 상해"], ["settle", "해결하다, 합의를 보다"], ["compensate", "보수를 지불하다, 보상하다"], ["in one's favor", "~에게 유리한"], ["make sense", "타당하다"], ["intimidate", "겁을 주다, 위협하다"], ["settlement", "합의(금)"], ["ensure", "보장하다"], ["determine", "알아내다, 결정하다"]]}, {"q": "10", "type": "장문 · 글의 순서", "src": "2020년 3월 43번", "ans": "④", "tr": [["1", "(A) Bernard Farrelly는 역사상 가장 위대한 호주 서퍼 중     h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
