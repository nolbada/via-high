<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}

7)에서 수평적 전이는 첫 번째 주제에 대한 지식이 두 번째 주제를 배우는 데 <b>도움이 되지만 필수적이지는 않을<\/b> 때 일어납니다", "도움이 되는 것은 먼저 배운 지식이므로 (B)에는 <b>prior<\/b>(사전의)가 알맞습니다", "그래서 정답은 ①입니다."], "ch": [{"n": "①", "t": "(A) essential ······ (B) prior", "g": "필수적인 …… 사전의", "ok": true, "e": ["(4)의 수직적 전이에서 더 기본적인 지식은 다음 단계에 꼭 필요하므로 (A) essential(필수적인)이 맞습니다", "(7)에서 도움은 되지만 필수적이지 않은 것은 첫 번째 주제, 곧 먼저 배운 지식이므로 (B) prior(사전의)가 맞습니다."]}, {"n": "②", "t": "(A) practical ······ (B) detailed", "g": "실용적인 …… 상세한", "ok": false, "e": ["(A) practical(실용적인)은 다음 주제로 넘어가기 전에 한 주제를 통달해야 한다는 (1)의 내용을 담지 못합니다", "(B) detailed(상세한)도 먼저 배운 지식이라는 뜻이 없습니다."]}, {"n": "③", "t": "(A) useless ······ (B) relevant", "g": "쓸모없는 …… 관련된", "ok": false, "e": ["(A) useless(쓸모없는)는 정반대입니다", "(1)에서 다음 주제로 넘어가기 전에 한 주제를 거의 확실히 통달해야 한다고 했습니다."]}, {"n": "④", "t": "(A) practical ······ (B) independent", "g": "실용적인 …… 독립적인", "ok": false, "e": ["(A) practical(실용적인)은 반드시 먼저 익혀야 한다는 뜻을 담지 못합니다", "(B) independent(독립적인)도 (5)와 (6)에서 한 주제의 지식이 다른 주제의 학습에 영향을 주고 도움이 된다는 내용과 맞지 않습니다."]}, {"n": "⑤", "t": "(A) essential ······ (B) unbiased", "g": "필수적인 …… 편견이 없는", "ok": false, "e": ["(A) essential은 맞습니다", "하지만 (B) unbiased(편견이 없는)는 글에서 다루지 않은 내용입니다", "도움은 되지만 필수적이지 않은 것은 먼저 배운 지식입니다."]}], "tr": ["몇몇의 과목 영역에서, 주제들은 (이전 학습 위에 그 다음 단계를 쌓는) 계층적 방식으로 서로를 기반으로 하므로, 학습자는 다음 (주제)로 넘어가기 전에 한 주제를 거의 확실히 통달해야 한다.", "예를 들어, 초등학생은 곱셈으로 넘어가기 전에 아마도 덧셈의 원리를 통달해야 할 것인데, 왜냐하면 곱셈은 덧셈의 확장이기 때문이다.", "이와 비슷하게, 의대생은 수술 기법을 공부하기 전에 인간 해부학에 대한 전문 지식을 가지고 있어야 한다. 만약 당신이 맹장을 찾을 수 없다면 맹장 수술을 하기는 어렵다.", "수직적 전이는 그러한(다음과 같은) 상황들을 가리킨다. 학습자는 더 기본적인 정보와 절차를 바탕으로 함으로써 새로운 지식이나 기술을 습득한다.", "다른 경우에는, 첫 번째가(첫 번째 주제에 대한 지식이) 두 번째에(두 번째 주제를 배우는 데) 필수적인 조건이 아니더라도, 한 주제에 대한 지식이 두 번째 주제를 배우는 데 영향을 줄 수도 있다.", "프랑스어에 대한 지식은 스페인어를 배우는 데 필수적이지 않지만, 두 언어에서 많은 단어가 비슷하기 때문에 프랑스어를 아는 것이 스페인어에 도움을 줄 수 있다.", "첫 번째 주제에 대한 지식이 두 번째 것(주제)을 배우는 데 도움이 되지만 필수적이지는 않을 때, 수평적 전이가 일어난다.", "[요약문] 수직적 전이에서는 더 높은 수준으로 진행하기 전에 더 낮은 수준의 지식이 (A)필수적이다. 하지만 수평적 전이의 경우에는 (B)사전 지식이 도움이 될 수 있으나 그것이 필수적인 것은 아니다."], "ps": [{"n": 1, achel Carson에서 Rob Nixon에 이르는 환경론자들과 생태 비평가들이 지적했듯이, 환경 변화는 ‘감지할 수 없을’ 수 있는데, 즉 그것은 (c)빠르게(→ 점진적으로) 진행되며, 단지 이따금 ‘폭발적이고 극적인’ 사건들을 만들어 낼 뿐이다."], [7, "기후 변화는 그것이 중요한 표현상의 문제를 제기하기 때문에 우리의 상상력에서 벗어난다."]], "why": ["(2)에서 Ghosh는 소설이 기후 변화를 <b>믿을 수 있게 표현하는 데 실패한다<\/b>고 주장합니다", "(3)에서는 그래서 기후 변화가 현대 소설에 <b>대체로 존재하지 않는다<\/b>고 설명합니다", "(5)에서 환경 변화는 <b>감지할 수 없을<\/b> 수 있고, 단지 이따금 극적인 사건들을 만들어 낼 뿐이라고 합니다", "(7)에서 기후 변화는 <b>중요한 표현상의 문제<\/b>를 제기하기 때문에 우리의 상상력에서 벗어난다고 정리합니다", "즉 이 글은 우리의 상상력이 기후 변화를 제대로 표현하지 못한다는 이야기입니다", "그래서 제목은 ③ <b>The Silence of Imagination in Representing Climate Change<\/b>(기후 변화를 표현하는 데 있어서의 상상력의 침묵)가 알맞습니다."], "ch": [{"n": "①", "t": "Differing Attitudes Towards Current Climate Issues", "g": "현 기후 문제에 대한 다양한 태도", "ok": false, "e": ["(1)에서 기후 변화 전문가들과 환경 인문주의자들은 <b>똑같이 동의한다<\/b>(alike agree)고 합니다", "서로 다른 태도를 비교하는 글이 아닙니다."]}, {"n": "②", "t": "Slow but Significant: The History of Ecological Movements", "g": "느리지만 중요하다: 생태 운동의 역사", "ok": false, "e": ["생태 운동의 역사를 설명하는 글이 아닙니다", "(5)의 Rachel Carson과 Rob Nixon은 환경 변화가 감지하기 어렵다는 점을 지적한 사람들로 나올 뿐입니다."]}, {"n": "③", "t": "The Silence of Imagination in Representing Climate Change", "g": "기후 변화를 표현하는 데 있어서의 상상력의 침묵", "ok": true, "e": ["(2)와 (3)에서 소설은 기후 변화를 제대로 표현하지 못하고, (7)에서 기후 변화는 표현상의 문제 때문에 우리의 상상력에서 벗어난다고 합니다", "'기후 변화를 표현하는 데 있어서의 상상력의 침묵'이 이 내용을 담고 있습니다."]}, {"n": "④", "t": "Vivid Threats: Climate Disasters Spreading in Local Areas", "g": "뚜렷한 위협: 지역에서 퍼져 나가는 기후 재앙", "ok": false, "e": ["(5)와 (6)에서 기후 변화는 감지할 수 없거나 매일 관찰될 수 없다고 합니다", "'뚜렷한 위협'은 글의 내용과 반대이고, 지역으로 퍼져 나가는 재앙 이야기도 없습니다."]}, {"n": "⑤", "t": "The Rise and Fall of Environmentalism and Ecocriticism", "g": "환경주의와 생태 비평의 흥망성쇠", "ok": false, "e": ["환경주의와 생태 비평이 흥했다가 쇠퇴했다는 내용은 없습니다", "(5)에서 환경론자들과 생태 비평가들은 환경 변화의 특징을 지적한 사람들로 나올 뿐입니다."]}], "tr": ["기후 변화 전문가들과 환경 인문주의자들은 기후 위기가 근원적으로 상상력의 위기이며 대중적 상상력의 많은 부분이 소설에 의해 형성된다는 데에 똑같이 동의한다.", "인류학자이자 소설가인 Amitav Ghosh는 자신의 2016년도 책 《The Great Derangement》에서 상상력과 환경 관리 사이의 이러한 관계를 다루면서, 인간이 기후 변화에 대응하는 데 실패한 것은 ed widespread popularity</b>"]}, {"t": "콤마 두 개 사이 <b>a film produced and directed by Francis Ford Coppola</b>는 주어를 다시 설명하는 <b>동격</b>이다.", "sub": ["a film 영화 + produced and directed by ~ (~가 제작하고 감독한) — 앞 명사를 꾸미는 <b>과거분사구</b>", "produce 제작하다, direct 감독하다"]}, {"t": "끝의 <b>and for good reason</b>은 '그리고 그럴 만한 이유로'라는 부사구이다. gained popularity가 생략되어 이어진다 (reason 이유)."}], "sum": "코폴라가 만든 '지옥의 묵시록', 그럴 만한 이유로 널리 인기"}, {"i": "04", "q": "09", "s": "2", "title": "S+V(1형식) + 주격 관계절 + 비교급 + 과거분사 후치", "eng": "Much of this investment will be in energy-efficient<sup>1</sup> goods / that are more expensive than old-fashioned<sup>2</sup> stuff / designed<sup>3</sup> for an era of cheap energy.", "notes": [["1", "energy-efficient", "에너지 효율이 높은"], ["2", "old-fashioned", "구식의"], ["3", "design", "설계하다"]], "lit": "이 투자의 상당 부분은 에너지 효율이 높은 제품에 쓰일 것이다 / 구식 물건보다 더 비싼 / 값싼 에너지 시대에 맞게 설계된 (구식 물건보다).", "nat": "이 투자의 상당 부분은, 값싼 에너지 시대에 맞게 설계된 구식 제품보다 더 비싼, 에너지 효율이 높은 제품에 쓰일 것이다.", "ana": "<b>that</b>은 <b>energy-efficient goods</b>를 받는 <b>주격 관계대명사</b>이고, 선행사가 복수라서 동사도 <b>are</b>로 복수다. 진짜 함정은 문장 끝의 <b>designed</b>다. 이것을 새로운 동사로 읽으면 '설계했다'가 되어 주어를 잃어버린다. <b>designed for an era of cheap energy</b>는 바로 앞의 <b>old-fashioned stuff</b>를 뒤에서 꾸미는 <b>과거분사구</b>로, 원래 <b>which was designed</b>에서 <b>관계대명사+be동사가 생략</b>된 형태다. 즉 비교 대상은 그냥 구식 물건이 아니라 '<b>값싼 에너지 시대에 맞게 설계된</b> 구식 물건'이다. 명사 뒤에 <b>-ed</b> 형태가 툭 나오면 <b>동사인지 분사인지</b>부터 판정하는 것이 독해의 갈림길이다.", "pe": "Much \u0001of this investment\u0002 will be \u0001in energy-efficient<sup>1</sup> goods\u0002 / \u0001that are more expensive than old-fashioned<sup>2</sup> stuff\u0002 / \u0001designed<sup>3</sup> for an era of cheap energy\u0002.", "pk": "\u0001이 투자의\u0002 상당 부분은 \u0001에너지 효율이 높은 제품에\u0002 쓰일 것이다 / \u0001구식 물건보다 더 비싼\u0002 / \u0001값싼 에너지 시대에 맞게 설계된\u0002 (구식 물건보다).", "core": "투자의 상당 부분이 쓰일 것이다.", "tags": ["주어 Much + 동사 will be: 2형식. (of this investment) = 형용사구: Much, (in energy-efficient goods) = 거의 필수에 가까운 부사구(be + 장소·대상) [기준: 모양 규칙]", "(that are more expensive than …) = 관계절(형용사절): goods를 꾸밈. more ~ than = 비교", "(designed for an era of cheap energy) = 과거분사구(형용사적): stuff를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. be가 \"~에 쓰이다\"의 뜻이라 뒤에 전치사구가 오고, 그 뒤로 관계절과 비교, 분사구가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다. 'will be in ~'은 '~에 쓰이다'로 읽는다.", "sub": ["S: Much of this investment (이 투자의 상당 부분, investment 투자)", "V: will be (be ~이다)", "in energy-efficient goods = 에너지 효율이 높은 제품에 (energy-efficient 에너지 효율이 높은, goods 제품)", "뼈대 = <b>Much of this investment will be in energy-efficient goods</b>"]}, {"t": "<b>that are more expensive than old-fashioned stuff</b>는 <b>goods를 꾸미는 주격 관계절</b>이다. that = goods이고 복수라서 are이다.", "sub": ["S: that (= goods)", "V: are (be ~이다)", "C: more expensive (더 비싼) than old-fashioned stuff (구식 물건보다, stuff 물건)"]}, {"t": "끝의 <b>designed for an era of cheap energy</b>는 stuff를 뒤에서 꾸미는 <b>과거분사구</b>이다. '값싼 에너지 시대에 맞게 설계된'(design 설계하다, era 시대, cheap 값싼)이다."}, {"t": "함정: designed를 새 동사로 읽으면 주어가 없어진다. 앞 명사 stuff를 꾸미는 말이다."}], "sum": "투자 상당 부분은 값싼 에너지 시대 제품보다 비싼 고효율 제품에 쓰임"}, {"i": "05", "q": "09", "s": "5", "title": "S+V + A or B + 목적 to부정사", "eng": "And a lot will go into<sup>1</sup> repair of climate damage or adaptation<sup>2</sup> to future climate damage / — for example, investing in new protective walls along the coast / to keep<sup>3</sup> the rising ocean back.", "notes": [["1", "go into", "~에 쓰이다, 투입되다"], ["2", "adaptation", "적응"], ["3", "keep A back", "A를 막아 내다"]], "lit": "그리고 많은 부분이 기후 피해의 복구나 미래 기후 피해에 대한 적응에 쓰일 것이다 / — 예를 들어 해안을 따라 새로운 방벽에 투자하는 것 / 상승하는 바다를 막아 내기 위해.", "nat": "그리고 많은 부분이 기후 피해를 복구하거나 미래의 기후 피해에 적응하는 데 쓰일 것이다. 예컨대 밀려오는 바다를 막기 위해 해안을 따라 새 방벽에 투자하는 일이 그렇다.", "ana": "<b>go into</b>의 목적어가 <b>repair of climate damage</b>와 <b>adaptation to future climate damage</b> 두 개이고 <b>or</b>로 묶인 <b>병렬</b>이다. 이때 <b>repair는 of</b>를, <b>adaptation은 to</b>를 짝으로 데려온다는 점이 중요하다. 명사마다 붙는 <b>전치사가 정해져 있다</b>는 감각이 없으면 해석이 뭉개진다. 대시 뒤의 <b>investing</b>은 앞의 두 명사를 받아 <b>예를 들어 주는 동명사</b>이며 새 문장의 동사가 아니다. 마지막 <b>to keep the rising ocean back</b>은 <b>목적</b>을 나타내는 to부정사로 '~하기 위해'다. <b>keep A back</b>은 'A를 막아 내다'라는 뜻이고, 목적어가 길어지면 <b>keep back A</b> 순서로도 쓸 수 있다.", "pe": "And a lot will go \u0001into<sup>1</sup> repair of climate damage or adaptation<sup>2</sup> to future climate damage\u0002 / — \u0001for example\u0002, \u0001investing in new protective walls along the coast\u0002 / \u0001to keep<sup>3</sup> the rising ocean back\u0002.", "pk": "그리고 많은 부분이 \u0001기후 피해의 복구나 미래 기후 피해에 대한 적응에\u0002 쓰일 것이다 / — \u0001예를 들어\u0002 \u0001해안을 따라 새로운 방벽에 투자하는 것\u0002 / \u0001상승하는 바다를 막아 내기 위해\u0002.", "core": "많은 부분이 쓰일 것이다.", "tags": ["and는 앞 문장에 이어주는 접속사. 주어 a lot + 동사 will go: 1형식. (into repair … damage) = 전치사구(부사구): will go를 꾸밈, 거의 필수에 가까운 부사구(go into) [기준: 모양 규칙]", "(for example) = 삽입(부사구): 문장 전체를 꾸밈. (investing in … coast) = 동명사구(동격 어구): 앞 내용의 예시를 덧붙임", "(to keep the rising ocean back) = to부정사(부사적: 목적): investing을 꾸밈. keep ~ back = ~을 막다"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 전치사 into의 목적어가 병렬이고 대시 뒤 예시가 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: a lot (많은 부분)", "V: will go (go 가다 + will ~할 것이다)", "into A or B = A나 B에 쓰이다 (into 이하는 거의 필수에 가까운 부사구)", "뼈대 = <b>a lot will go into ~</b>"]}, {"t": "into의 목적어는 <b>A or B</b>로 병렬이다.", "sub": ["A: repair of climate damage (기후 피해의 복구, repair 복구, climate 기후, damage 피해)", "B: adaptation to future climate damage (미래 기후 피해에 대한 적응, adaptation 적응, future 미래의)", "명사마다 짝 전치사가 다르다: repair는 of, adaptation은 to"]}, {"t": "대시 뒤 <b>for example, investing in new protective walls along the coast</b>는 앞 내용의 예시이다.", "sub": ["invest in ~에 투자하다, protective 보호하는, wall 방벽, coast 해안"]}, {"t": "끝의 <b>to keep the rising ocean back</b>은 <b>목적의 to부정사</b>이다. '상승하는 바다를 막아 내기 위해'(keep ~ back 막다, rising 상승하는)이다."}], "sum": "기후 피해 복구·적응에 많은 돈, 예컨대 해안 방벽 투자"}, {"i": "06", "q": "10", "s": "3", "title": "S+V+O + before v-ing ; 가주어 It + 조건절", "eng": "Similarly, a medical student must have expertise<sup>1</sup> in human anatomy<sup>2</sup> / before studying surgical techniques: / It's difficult to perform an appendectomy<sup>3</sup> / if you can't find the appendix.", "notes": [["1", "expertise", "전문 지식"], ["2", "anatomy", "해부학"], ["3", "appendectomy", "맹장 수술"]], "lit": "마찬가지로, 의대생은 인체 해부학에 대한 전문 지식을 갖추어야 한다 / 수술 기법을 공부하기 전에 — / 맹장 수술을 하기는 어렵다 / 맹장을 찾지 못한다면.", "nat": "마찬가지로 의대생은 수술 기법을 배우기 전에 인체 해부학을 알고 있어야 한다. 맹장이 어디 있는지 모르면 맹장 수술을 할 수 없기 때문이다.", "ana": "<b>before studying</b>의 <b>before</b>는 여기서 <b>전치사</b>이므로 뒤에 <b>동명사</b>가 왔다. before는 <b>전치사와 접속사</b>로 모두 쓰이는데, 뒤에 <b>주어+동사</b>가 오면 접속사, <b>명사·동명사</b>가 오면 전치사다. 콜론(<b>:</b>) 뒤는 앞 문장을 <b>구체적으로 풀어 주는</b> 자리이므로 '<b>즉, 왜냐하면</b>' 정도로 이어 읽으면 된다. 그 뒤의 <b>It's difficult to perform ~</b>에서 <b>It</b>은 <b>가주어</b>이고 진주어는 <b>to perform an appendectomy</b>다. 이 글에서 이 문장은 <b>먼저 배운 것이 뒤의 학습에 반드시 필요한 경우</b>를 보여 주는 예시이므로, 뒤에 나올 <b>vertical transfer</b>의 정의와 짝지어 읽어야 한다.", "pe": "\u0001Similarly\u0002, a \u0001medical\u0002 student must have expertise<sup>1</sup> \u0001in human anatomy<sup>2</sup>\u0002 / \u0001before studying surgical techniques\u0002: / It's difficult to perform an appendectomy<sup>3</sup> / \u0001if you can't find the appendix\u0002.", "pk": "\u0001마찬가지로\u0002, 의대생은 \u0001인체 해부학에 대한\u0002 전문 지식을 갖추어야 한다 / \u0001수술 기법을 공부하기 전에\u0002 — / 맹장 수술을 하기는 어렵다 / \u0001맹장을 찾지 못한다면\u0002.", "core": "의대생은 전문 지식을 갖추어야 한다. 맹장 수술을 하기는 어렵다.", "tags": ["(Similarly) = 접속부사. 주어 student + 동사 must have + 목적어 expertise. (medical) = 형용사: student, (in human anatomy) = 형용사구: expertise", "(before studying surgical techniques) = 전치사구(부사구: 시간): must have를 꾸밈", "가주어 It + 동사 's(is) + 보어 difficult: 2형식. 진주어 to perform an appendectomy", "(if you can't find the appendix) = 부사절(조건): 앞 문장 전체를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>과 콜론 뒤 <b>가주어 It 구문(2형식)</b>으로 이루어진 두 덩어리이다."}, {"t": "앞 문장의 뼈대부터 찾는다.", "sub": ["S: a medical student (의대생, medical 의학의)", "V: must have (have 가지다 + must ~해야 한다)", "O: expertise (전문 지식)", "뼈대 = <b>a medical student must have expertise</b>", "Similarly 마찬가지로, in human anatomy 인체 해부학에 대한 (anatomy 해부학)"]}, {"t": "<b>before studying surgical techniques</b>의 before는 여기서 <b>전치사</b>라서 뒤에 동명사 studying이 왔다. '수술 기법을 공부하기 전에'(surgical 수술의, technique 기법)이다."}, {"t": "콜론(:) 뒤는 앞 내용을 풀어 주는 새 문장이다.", "sub": ["S: It (가주어)", "V: 's (is)", "C: difficult (어려운)", "진주어: to perform an appendectomy (맹장 수술을 하는 것, perform 수행하다, appendectomy 맹장 절제 수술)"]}, {"t": "<b>if you can't find the appendix</b>는 <b>조건 부사절</b>이다. '맹장을 찾지 못한다면'(appendix 맹장)이라는 뜻이다. 빼도 앞 문장이 완결되므로 부사절이다."}], "sum": "해부학 지식 없이는 수술 기법 학습도, 맹장 수술도 어려움"}, {"i": "07", "q": "11", "s": "A-3", "title": "S+V+O(that절) + because절(목적격 관계대명사 생략) + too ~ to V", "eng": "Ghosh explains / that climate change is largely absent from<sup>1</sup> contemporary fiction / because the cyclones, floods, and other catastrophes<sup>2</sup> it brings to mind / simply seem too “improbable<sup>3</sup>” to belong in stories about everyday life.", "notes": [["1", "absent from", "~에 부재한"], ["2", "catastrophe", "큰 재해"], ["3", "improbable", "있을 법하지 않은"]], "lit": "Ghosh는 설명한다 / 기후변화가 현대 소설에서 대체로 빠져 있다고 / 그것이 떠올리게 하는 사이클론, 홍수, 그 밖의 큰 재해들이 / 일상생활에 관한 이야기에 속하기에는 너무 “있을 법하지 않아” 보이기 때문이라고.", "nat": "Ghosh는 기후변화가 떠올리게 하는 사이클론과 홍수, 그 밖의 큰 재해들이 일상 이야기 속에 들어가기에는 너무 '있을 법하지 않게' 느껴지기 때문에, 기후변화가 현대 소설에서 대체로 빠져 있다고 설명한다.", "ana": "because절의 주어가 <b>the cyclones, floods, and other catastrophes it brings to mind</b> 전체라는 것을 잡는 것이 이 문장의 승부처다. <b>catastrophes</b> 바로 뒤에 <b>it brings</b>라는 <b>주어+동사</b>가 붙어 있는데, 이는 <b>목적격 관계대명사 that/which가 생략</b>된 자리다. 명사 뒤에 곧바로 주어와 동사가 오면 그 사이에 관계대명사를 넣어 읽으면 된다. 여기서 <b>it</b>은 climate change를 받는다. 관계사절이 끝나야 비로소 진짜 동사 <b>seem</b>이 나온다. 뒤의 <b>too ~ to V</b>는 '<b>너무 ~해서 …할 수 없다</b>'라는 뜻으로, 여기서는 '일상 이야기에 속하기에는 너무 있을 법하지 않다'가 된다.", "pe": "Ghosh explains / that climate change is \u0001largely\u0002 absent \u0001from<sup>1</sup> contemporary fiction\u0002 / \u0001because the cyclones, floods, and other catastrophes<sup>2</sup> it brings to mind\u0002 / \u0001simply seem too “improbable<sup>3</sup>” to belong in stories about everyday life\u0002.", "pk": "Ghosh는 설명한다 / 기후변화가 \u0001현대 소설에서\u0002 \u0001대체로\u0002 빠져 있다고 / \u0001그것이 떠올리게 하는 사이클론, 홍수, 그 밖의 큰 재해들이\u0002 / \u0001일상생활에 관한 이야기에 속하기에는 너무 “있을 법하지 않아” 보이기 때문이라고\u0002.", "core": "Ghosh는 기후변화가 빠져 있다고 설명한다.", "tags": ["주어 Ghosh + 동사 explains + 목적어 that절(<b>명사절</b>): 3형식", "that절 안: 주어 climate change + 동사 is + 보어 absent. (largely) = 부사, (from contemporary fiction) = 전치사구(부사구): absent [기준: 형용사 뒤 전치사구 = 수식어]", "(because … it brings to mind) = 부사절(이유): is absent를 꾸밈. the cyclones, floods ~ it brings = 목적격 관계대명사 생략", "(simply seem too “improbable” …) = 앞 because절의 나머지. simply = 부사, too ~ to = 너무 ~해서 ~할 수 없는"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고 목적어가 <b>that절</b>이다. 그 안에 because절이 있고 because절 주어가 길어 보인다."}, {"t": "큰 뼈대부터 찾는다.", "sub": ["S: Ghosh (사람 이름)", "V: explains (explain 설명하다)", "O: that절", "뼈대 = <b>Ghosh explains that ~</b>"]}, {"t": "that절의 뼈대는 다음과 같다.", "sub": ["S: climate change (기후변화)", "V: is (be ~이다)", "C: largely absent from contemporary fiction (현대 소설에서 대체로 빠져 있는, largely 대체로, absent 빠져 있는, contemporary 현대의, fiction 소설)"]}, {"t": "<b>because ~ everyday life</b>는 <b>이유의 부사절</b>이다. 주어는 <b>the cyclones, floods, and other catastrophes it brings to mind</b>이다.", "sub": ["catastrophes 뒤에는 <b>목적격 관계대명사가 생략</b>되어 'it brings to mind'가 꾸민다 (it = climate change, bring ~ to mind ~를 떠올리게 하다)", "cyclone 사이클론, flood 홍수, catastrophe 큰 재해"]}, {"t": "이 절의 동사는 <b>seem</b>(~처럼 보이다)이고 보어는 <b>too 'improbable' to belong in stories about everyday life</b>이다.", "sub": ["too ~ to V는 '너무 ~해서 V할 수 없다', improbable 있을 법하지 않은", "belong in ~에 속하다, story 이야기, everyday 일상의"]}, {"t": "함정: catastrophes 바로 뒤의 it brings를 별개 문장으로 끊지 않는다. 앞 명사를 꾸미는 절이다."}], "sum": "Ghosh, 기후 재해가 너무 비현실적으로 느껴져 소설에서 빠진다고 설명"}, {"i": "08", "q": "11", "s": "A-6", "title": "S+V(수동) but S+V+C + when절", "eng": "Most climate change impacts cannot be observed day-to-day<sup>1</sup>, / but they become visible / when we are confronted<sup>2</sup> with their accumulated<sup>3</sup> impacts.", "notes": [["1", "day-to-day", "날마다, 매일"], ["2", "be confronted with", "~과 마주하다"], ["3", "accumulated", "누적된"]], "lit": "대부분의 기후변화 영향은 날마다 관찰될 수는 없지만, / 그것들은 눈에 보이게 된다 / 우리가 그 누적된 영향과 마주하게 될 때.", "nat": "기후변화의 영향 대부분은 매일매일 눈으로 확인할 수 없지만, 그것이 쌓인 결과와 마주하게 되면 비로소 눈에 보인다.", "ana": "<b>cannot be observed</b>는 <b>조동사 + be + 과거분사</b> 형태의 <b>수동태</b>다. 영향은 '관찰하는' 쪽이 아니라 '관찰되는' 쪽이므로 수동이 맞다. 조동사가 붙은 수동태는 반드시 <b>be동사가 원형</b>으로 온다는 점을 확인하자. <b>become visible</b>은 <b>become + 형용사</b>의 2형식으로 '<b>~하게 되다</b>'라는 상태 변화를 나타내며, 뒤에 부사 visibly를 쓰면 틀린다. when절의 <b>are confronted with</b> 역시 <b>수동태</b>이고, <b>confront A with B</b>가 아니라 <b>be confronted with</b>('~과 마주하다') 형태로 굳어져 쓰인다. 이런 <b>수동태 + 전치사</b> 짝(be faced with, be concerned with)은 통째로 외워 두는 편이 빠르다.", "pe": "Most climate change impacts cannot be observed \u0001day-to-day<sup>1</sup>\u0002, / but they become visible / \u0001when we are confronted<sup>2</sup> with their accumulated<sup>3</sup> impacts\u0002.", "pk": "대부분의 기후변화 영향은 \u0001날마다\u0002 관찰될 수는 없지만, / 그것들은 눈에 보이게 된다 / \u0001우리가 그 누적된 영향과 마주하게 될 때\u0002.", "core": "영향은 관찰될 수 없지만, 그것들은 눈에 보이게 된다.", "tags": ["주어 impacts + 동사 cannot be observed(수동): 1형식. (day-to-day) = 부사: observed를 꾸밈", "but은 앞뒤 절을 잇는 접속사. 주어 they + 동사 become + 보어 visible: 2형식", "(when we are confronted with …) = 부사절(시간): become을 꾸밈. be confronted with = ~와 마주하다"], "steps": [{"t": "이 문장은 <b>S+V(수동, 1형식) but S+V+C(2형식)</b>으로, 두 문장이 but으로 이어진다. 뒤에 when절이 붙어 길어 보인다."}, {"t": "앞 문장의 뼈대부터 찾는다.", "sub": ["S: Most climate change impacts (기후변화의 영향 대부분, impact 영향)", "V: cannot be observed (observe 관찰하다, 조동사 수동태)", "뼈대 = <b>Most climate change impacts cannot be observed day-to-day</b> (문형 기준: 수동태 주절은 1형식)", "day-to-day 매일"]}, {"t": "but 뒤 문장의 뼈대는 다음과 같다.", "sub": ["S: they (= impacts, 영향들)", "V: become (become ~이 되다)", "C: visible (눈에 보이는)", "뼈대 = <b>they become visible</b>"]}, {"t": "끝의 <b>when we are confronted with their accumulated impacts</b>는 <b>시간 부사절</b>이다. 빼도 앞 문장이 완결되므로 부사절이다.", "sub": ["are confronted with ~와 마주하다 (confront 마주하 "a": true, "x": false, "trap": false, "e": "6번의 <b>a setting that was contemporary</b>와 정반대되는 경우가 곧 원작 그대로의 시공간을 옮긴 각색이다. 3번의 <b>Unlike the original novel</b>이 이를 뒷받침한다."}, {"n": "②", "t": "소설에 영감을 준 원천", "a": false, "x": true, "trap": false, "e": "영향의 방향이 거꾸로다. 영화가 소설을 <b>각색</b>한 것이지 소설이 영화에서 나온 것이 아니다."}, {"n": "③", "t": "베트남 전쟁의 충실한 묘사", "a": false, "x": true, "trap": true, "e": "베트남전은 <b>바꿔 넣은 배경</b>일 뿐이며, 글은 그 전쟁을 얼마나 정확히 그렸는지를 전혀 따지지 않는다."}, {"n": "④", "t": "심리적 여정의 생생한 극화", "a": false, "x": true, "trap": false, "e": "5번에서 두 작품 <b>모두</b> 정신적·영적 여정을 그린다고 했다. 이는 실제 영화의 모습이므로 <b>가정법의 반대 상황</b>이 될 수 없다."}, {"n": "⑤", "t": "동시대 문명에 대한 비판적 해석", "a": false, "x": true, "trap": false, "e": "커츠가 <b>the worst aspects of civilisation</b>을 대표한다는 점에서 이 역시 실제 영화가 <b>이미 하고 있는</b> 일이다."}], "w": [["direct", "감독하다"], ["widespread", "널리 퍼진"], ["for good reason", "그럴 만한 이유로"], ["adaptation", "각색(물)"], ["be set in", "~을 배경으로 하다"], ["incidental", "부수적인"], ["narrative", "서사, 이야기"], ["confront", "마주하다, 직면하다"], ["deranged", "제정신이 아닌"], ["represent", "대표하다, 나타내다"], ["contemporary", "동시대의, 당대의"], ["identify with", "~에 공감하다"]]}, {"q": "09", "type": "문장 삽입", "src": "2017학년도 수능 39번", "ans": "⑤", "tr": [["1", "[주어진 문장] 오히려 그런 일들은 의회의 결정에 근거한 국가의 개입을 통해서만 일어날 것이다."], ["2", "나는 국제 사회가 연간 투자를 오늘날 GDP의 24%에서 2052년에는 36%로 늘릴 것이라고 예상한다."], ["3", "이 투자의 상당 부분은, 값싼 에너지 시대에 맞게 설계된 구식 제품보다 더 비싼, 에너지 효율이 높은 제품에 쓰일 것이다."], ["4", "또 다른 몫은 석탄에서 재래식 가스처럼 더 비싼 연료로 옮겨 가는 데 투자될 것이다."], ["5", "일부는 새로운 재생 에너지 공급을 건설하는 데 들어갈 것이며, 그것이 경쟁력을 갖추기 전의 기간에도 그럴 것이다."], ["6", "그리고 많은 부분이 기후 피해를 복구하거나 미래의 기후 피해에 적응하는 데 쓰일 것이다. 예컨대 밀려오는 바다를 막기 위해 해안을 따라 새 방벽에 투자하는 일이 그렇다."], ["7", "이런 막대한 투자 증가는 투자가 시장에 맡겨진다면 일어나지 않을 것이다."], ["8", "그것은 직접적일 수도 있고 — 정부가 가장 필요하다고 여기는 어떤 자격으로든 세금을 투자할 때 — 간접적일 수도 있다 — 정부가 바라는 활동을 더 수익성 있게 만드는 법률을 통과시킬 때."]], "evh": "⑤번 문장", "ev": [{"en": true, "h": "These huge increases in investment would not come about if investment was left to the market. ( ⑤ ) It will be either direct ~"}, {"en": false, "h": "주어진 문장의 신호어는 세 개다. <b>Rather</b>(오히려), <b>they</b>(그것들), <b>state intervention</b>(국가 개입). <b>Rather</b>는 앞에 <b>부정문</b>이 와야 성립하는데, ⑤ 바로 앞 문장이 <b>would not come about if investment was left to the market</b>이라는 부정이다. <b>they</b>가 받는 것도 그 문장의 <b>These huge increases</b>다. 결정적으로 ⑤ 뒤 문장의 주어는 <b>It</b>이고 <b>either direct ... or indirect</b>라며 <b>정부(the government)</b>의 두 방식을 설명하는데, 주어진 문장을 넣지 않으면 이 <b>It</b>과 <b>정부</b>가 어디서 튀어나왔는지 설명되지 않는다. 즉 주어진 문장의 <b>state intervention</b>이 바로 그 <b>It</b>의 정체다."}], "opts": [{"n": "①", "t": "2번 문장 뒤", "a": false, "x": true, "trap": false, "e": "앞이 <b>부정문이 아니고</b>, 뒤에서도 에너지 효율 제품이라는 <b>투자 항목 나열</b>이 계속된다. Rather가 받을 것이 없다."}, {"n": "②", "t": "3번 문장 뒤", "a": false, "x": true, "trap": false, "e": "석탄에서 가스로의 전환 역시 투자 항목 나열의 일부다. 흐름을 끊을 이유가 없다."}, {"n": "③", "t": "4번 문장 뒤", "a": false, "x": true, "trap": false, "e": "재생 에너지 건설도 같은 나열이다. <b>they</b>가 가리킬 복수 명사가 아직 등장하지 않았다."}, {"n": "④", "t": "5번 문장 뒤", "a": false, "x": true, "trap": true, "e": "바로 뒤 문장이 <b>These huge increases</b>로 앞의 나열 전체를 <b>묶는</b> 자리다. 여기에 끼워 넣으면 그 묶음이 끊긴다."}, {"n": "⑤", "t": "6번 문장 뒤", "a": true, "x": false, "trap": false, "e": "앞의 <b>would not come about</b>(부정)을 <b>Rather</b>가 받고, <b>they</b>가 <b>These huge increases</b>를 받으며, 뒤 문장의 <b>It</b>과 <b>the government</b>가 주어진 문장의 <b>state intervention</b>에서 나온다. 세 고리가 모두 맞물린다."}], "w": [["rather", "오히려"], ["state intervention", "국가 개입"], ["parliamentary", "의회의"], ["energy-efficient", "에너지 효율이 높은"], ["old-fashioned", "구식의"], ["conventional gas", "재래식 가스"], ["renewable energy", "재생 에너지"], ["competitive", "경쟁력 있는"], ["come about", "일어나다, 생기다"], ["capacity", "자격, 역량"], ["pass legislation", "법률을 통과시키다"], ["profitable", "수익성 있는"]]}, {"q": "10", "type": "요약문 완성", "src": "2019학년도 6월 40번", "ans": "①", "tr": [["1", "어떤 교과 영역에서는 주제들이 위계적인 방식으로 서로를 토대 삼아 쌓이기 때문에, 학습자는 다음 주제로 넘어가기 전에 거의 반드시 한 주제를 숙달해야 한다."], ["2", "예컨대 초등학생은 곱셈으로 넘어가기 전에 덧셈의 원리를 숙달해야 하는데, 곱셈이 덧셈의 확장이기 때문이다."], ["3", "마찬가지로 의대생은 수술 기법을 배우기 전에 인체 해부학을 알고 있어야 한다. 맹장이 어디 있는지 모르면 맹장 수술을 할 수 없기 때문이다."], ["4", "수직적 전이는 바로 그런 상황을 가리킨다. 학습자가 더 기초적인 정보와 절차를 토대로 삼아 새로운 지식이나 기능을 습득하는 것이다."], ["5", "다른 경우에는, 첫 번째 주제가 두 번째 주제의 필요조건이 아닌데도 한 주제에 대한 지식이 두 번째 주제의 학습에 영향을 줄 수 있다."], ["6", "프랑스어 지식이 스페인어 학습에 필수적인 것은 아니지만, 두 언어에 비슷한 단어가 많아서 프랑스어를 알면 스페인어에 도움이 될 수 있다."], ["7", "첫 번째 주제에 대한 지식이 두 번째 주제 학습에 도움은 되지만 필수적이지는 않을 때, 수평적 전이가 일어나고 있는 것이다."], ["8", "[요약문] 수직적 전이에서는 더 높은 단계로 나아가기 전에 하위 지식이 (A)필수적이다. 그러나 수평적 전이의 경우에는 (B)사전 지식이 도움은 될 수 있지만 반드시 필요한 것은 아니다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "When knowledge of the first topic is helpful but not essential to learning the second one, lateral transfer is occurring."}, {"en": false, "h": "요약문은 두 전이를 <b>대비</b>시키는 틀이다. (A)는 <b>수직적 전이</b>에서 하위 지식이 어떤 성격인지를 묻는데, 1번의 <b>must almost certainly master one topic before moving to the next</b>가 곧 <b>essential</b>(필수적)이다. (B)는 <b>수평적 전이</b>에서 도움은 되지만 필수는 아닌 지식이 무엇인지를 묻는다. 5·6번에서 그것은 <b>먼저 배운 첫 주제</b>의 지식, 즉 <b>prior knowledge</b>(사전 지식)다. 요약문 뒤쪽이 이미 <b>can be helpful, but it is not required</b>라고 성격을 말해 버렸으므로 (B)에는 성격이 아니라 <b>어떤 지식인지</b>가 들어가야 한다는 점이 결정적이다."}], "opts": [{"n": "①", "t": "(A) essential ······ (B) prior", "a": true, "x": false, "trap": false, "e": "(A)는 1번의 <b>must ... master one topic before moving to the next</b>, (B)는 5·6번의 <b>knowledge of one topic</b>(먼저 배운 것)에 각각 대응한다."}, {"n": "②", "t": "(A) practical ······ (B) detailed", "a": false, "x": true, "trap": false, "e": "(A) '실용적'은 1번의 <b>필수성</b>을 담지 못하고, (B) '상세한'은 <b>지식의 양</b>을 말할 뿐 앞뒤 관계를 나타내지 못한다."}, {"n": "③", "t": "(A) useless ······ (B) relevant", "a": false, "x": true, "trap": false, "e": "(A)가 정반대다. 수직적 전이에서 하위 지식은 <b>쓸모없기는커녕 반드시 있어야</b> 한다."}, {"n": "④", "t": "(A) practical ······ (B) independent", "a": false, "x": true, "trap": true, "e": "(B) '독립적인'은 오히려 <b>서로 무관한</b> 지식이라는 뜻이 되어, 도움이 된다는 6번과 어긋난다."}, {"n": "⑤", "t": "(A) essential ······ (B) unbiased", "a": false, "x": true, "trap": false, "e": "(A)는 맞지만 (B)가 어긋난다. <b>편향되지 않은</b>이라는 성격은 글에서 한 번도 다루지 않은 개념이다."}], "w": [["build on one another", "서로를 토대로 쌓이다"], ["hierarchical", "위계적인"], ["master", "숙달하다"], ["extension", "확장, 연장"], ["expertise", "전문 지식"], ["anatomy", "해부학"], ["appendectomy", "맹장 수술"], ["vertical transfer", "수직적 전이"], ["acquire", "습득하다"], ["procedure", "절차"], ["lateral transfer", "수평적 전이"], ["prior", "사전의, 먼저의"]]}, {"q": "11", "type": "장문 · 제목", "src": "2023학년도 9월 41번", "ans": "③", "tr": [["1", "기후변화 전문가와 환경 인문학자 모두, 기후 위기는 본질적으로 상상력의 위기이며 대중의 상상력 상당 부분은 소설에 의해 만들어진다는 데 동의한다."], ["2", "2016년 저서 「거대한 착란」에서 인류학자이자 소설가인 아미타브 고시는 상상력과 환경 관리 사이의 이 관계를 다루면서, 인간이 기후변화에 대응하지 못한 것은 적어도 부분적으로는 소설이 그것을 그럴듯하게 재현하지 못하기 때문이라고 주장한다."], ["3", "고시는 기후변화가 떠올리게 하는 사이클론과 홍수, 그 밖의 큰 재해들이 일상 이야기 속에 들어가기에는 너무 '있을 법하지 않게' 느껴지기 때문에, 기후변화가 현대 소설에서 대체로 빠져 있다고 설명한다."], ["4", "그러나 기후변화가 오직 일련의 이례적인 사건으로만 모습을 드러내는 것은 아니다."], ["5", "실제로 레이첼 카슨에서 롭 닉슨에 이르는 환경운동가와 생태비평가들이 지적했듯, 환경 변화는 '감지할 수 없는' 것일 수 있다. 그것은 서서히 진행되며 아주 가끔씩만 '폭발적이고 극적인' 사건을 낳는다."], ["6", "기후변화의 영향 대부분은 매일매일 눈으로 확인할 수 없지만, 그것이 쌓인 결과와 마주하게 되면 비로소 눈에 보인다."], ["7", "기후변화는 상당한 재현의 어려움을 제기하기 때문에 우리의 상상력을 피해 간다."], ["8", "그것은 '인간의 시간' 안에서는 관찰될 수 없는데, 그래서 빙하와 산호초에 미치는 기후변화의 영향을 추적하는 다큐멘터리 감독 제프 올롭스키는 서서히 일어난 변화를 부각하기 위해 같은 장소에서 몇 달 간격으로 찍은 '전후' 사진을 사용한다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "Climate change evades our imagination because it poses significant representational challenges."}, {"en": false, "h": "제목은 <b>글 전체가 붙들고 있는 문제</b>를 담아야 한다. 이 글의 문제는 처음부터 끝까지 하나다 — 기후변화는 <b>재현(representation)</b>하기 어렵고, 그래서 소설과 상상력에서 <b>빠져 있다</b>. A-1의 <b>a crisis of the imagination</b>, A-2의 <b>fiction fails to believably represent it</b>, A-3의 <b>largely absent from contemporary fiction</b>, B-1의 <b>evades our imagination ... representational challenges</b>가 모두 같은 말을 되풀이한다. 이 '<b>빠져 있음·말해지지 않음</b>'을 <b>Silence</b>라는 한 낱말로 옮긴 것이 ③이다. 글의 후반부(A-4~B-2)는 <b>왜</b> 재현이 어려운지를 설명하는 부분이지 새로운 주제가 아니다."}], "opts": [{"n": "①", "t": "현재의 기후 문제에 대한 서로 다른 태도", "a": false, "x": true, "trap": false, "e": "글에 등장하는 사람들(고시·카슨·닉슨·올롭스키)은 <b>서로 다투지 않는다</b>. 오히려 A-1은 <b>ali   let x='<div class="sc open"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px">';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';
  app.innerHTML=h;
}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
