<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

const $=s=>document.querySelector(s);
const app=$('#app');
let view='home',quiz=null,armed=null;
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

적 용법인 점까지 확인하면 끝이다.", "pe": "One wonders / whether our children's \u0001inherent<sup>1</sup>\u0002 capacity / \u0001to recognize, classify<sup>2</sup>, and order information \u0001about their environment\u0002\u0002 / — \u0001abilities once \u0001essential<sup>3</sup> to our very survival\u0002\u0002 — / is \u0001slowly\u0002 devolving<sup>4</sup> / \u0001to facilitate<sup>5</sup> life in their increasingly virtualized<sup>6</sup> world\u0002.", "pk": "사람들은 궁금해한다 / 우리 아이들의 \u0001타고난\u0002 능력이 / \u0001\u0001자기 환경에 관한\u0002 정보를 인식하고 분류하고 정리하는\u0002 / — \u0001한때 \u0001우리의 생존 그 자체에 필수적이었던\u0002 능력들인\u0002 — / \u0001서서히\u0002 퇴화하고 있는 것은 아닌지 / \u0001점점 더 가상화되어 가는 세계에서의 삶을 수월하게 하려고\u0002.", "core": "사람들은 우리 아이들의 능력이 퇴화하고 있는지 궁금해한다.", "tags": ["주어 One, 동사 wonders, 목적어: 다음 whether절 (명사절)", "whether절 = wonders의 목적어. 주어 capacity(길게 이어짐). inherent = 형용사: capacity 꾸밈. 동사 is devolving까지 기다림", "to recognize, classify, and order = to부정사(형용사적): capacity 꾸밈. 동사 3개 병렬. about their environment = 형용사구: information 꾸밈", "대시 삽입: abilities ~ = 동격 어구: capacity 부연. essential to ~ = 형용사구: abilities 꾸밈. once = 부사", "동사 is devolving(진행형, 퇴화하다). slowly = 부사: devolving 꾸밈", "to facilitate ~ = to부정사(부사적: 목적): devolving 꾸밈. in their ~ world = 형용사구: life 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 whether절의 주어가 길고 대시 삽입이 끼어 동사가 멀리 있다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: One (일반적인 사람)", "V: wonders (wonder 궁금해하다)", "O: whether절 (~인지)", "뼈대 = <b>One wonders whether ~</b>"]}, {"t": "whether절의 뼈대는 1형식이다.", "sub": ["S: our children's inherent capacity (우리 아이들의 타고난 능력)", "V: is devolving (devolve 퇴화하다의 현재진행)", "whether절 뼈대 = <b>capacity is slowly devolving</b>", "slowly = 서서히, inherent 타고난"]}, {"t": "<b>to recognize, classify, and order information about their environment</b>는 capacity를 꾸미는 to부정사이다. 동사 세 개가 병렬이다.", "sub": ["recognize 인식하다, classify 분류하다, order 정리하다", "information about their environment = 환경에 관한 정보"]}, {"t": "대시 사이 <b>abilities once essential to our very survival</b>은 capacity를 다시 설명하는 동격 명사구이다. '한때는 우리 생존에 반드시 필요했던 능력들'이라는 뜻이다. (essential 필수적인, once 한때)"}, {"t": "끝의 <b>to facilitate life in their increasingly virtualized world</b>는 to부정사 부사적 용법(목적)이다. devolving을 꾸민다.", "sub": ["facilitate 용이하게 하다, 수월하게 하다 (여기서는 '삶에 맞추느라'로 자연스럽게 풀었다)", "increasingly 점점, virtualized 가상화된"]}], "sum": "아이들의 타고난 분류·정리 능력이 가상화된 세계에 맞추느라 서서히 퇴화하는지 의문"}, {"i": "08", "q": "06", "s": "5", "title": "S+V+O+C(5형식 have) + with 부대상황 + 분사구", "eng": "A bird with its head in the air / scanning<sup>1</sup> for predators<sup>2</sup> / cannot at the same time have its head down / searching for<sup>3</sup> food.", "notes": [["1", "scan for", "~을 살피다"], ["2", "predator", "포식자"], ["3", "search for", "~을 찾다"]], "lit": "머리를 공중에 두고 있는 새는 / 포식자를 살피면서 / 동시에 머리를 아래로 두고 있을 수는 없다 / 먹이를 찾으면서.", "nat": "포식자를 살피느라 머리를 들고 있는 새는 동시에 먹이를 찾느라 머리를 숙이고 있을 수는 없다.", "ana": "주어가 <b>A bird</b>라는 것을 잡고 나면, 동사가 어디인지가 관건이다. <b>with its head in the air</b>는 <b>with + 명사 + 부사구</b>로 '<b>~을 …한 상태로 둔 채</b>'라는 <b>부대상황</b>을 나타내는 덩어리이고, 이어지는 <b>scanning for predators</b>는 <b>A bird</b>를 뒤에서 꾸미는 <b>현재분사</b>다. 즉 여기까지가 전부 주어부이고, 진짜 동사는 <b>cannot ~ have</b>다. 뒤쪽의 <b>have its head down</b>도 같은 구조로 '<b>머리를 아래로 둔 상태로 두다</b>'라는 뜻이며, <b>searching for food</b> 역시 그 상황을 설명하는 분사다. <b>with 분사구문</b>과 <b>have + 목적어 + 부사/분사</b>가 한 문장에 겹쳐 있으므로, 덩어리마다 <b>누가 무엇을 하고 있는지</b>를 붙여 가며 읽어야 한다.", "pe": "A bird \u0001with its head in the air\u0002 / \u0001scanning<sup>1</sup> for predators<sup>2</sup>\u0002 / cannot \u0001at the same time\u0002 have its head down / \u0001searching for<sup>3</sup> food\u0002.", "pk": "\u0001머리를 공중에 두고 있는\u0002 새는 / \u0001포식자를 살피면서\u0002 / \u0001동시에\u0002 머리를 아래로 두고 있을 수는 없다 / \u0001먹이를 찾으면서\u0002.", "core": "새는 머리를 아래로 두고 있을 수는 없다.", "tags": ["주어 A bird. with its head in the air = 전치사구(형용사구): bird 꾸밈 (<b>with + 명사 + 부사구</b>, ~한 채로)", "scanning for predators = 현재분사구(형용사적): bird 꾸밈 (포식자를 살피는)", "동사 cannot have, 목적어 its head, 보어 down(5형식 have O C). at the same time = 부사구: have 꾸밈", "searching for food = 현재분사구(분사구문, 부사적: 동시동작): have 꾸밈 (앞 scanning과 대칭)"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식)</b>이다. 주어에 수식어가 겹쳐 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: A bird (새)", "V: cannot have (have ~한 상태로 두다. cannot ~할 수 없다)", "O: its head (머리)", "C: down (아래로)", "뼈대 = <b>A bird cannot have its head down</b>", "at the same time = 동시에 (부사구)"]}, {"t": "<b>with its head in the air</b>는 with+명사+부사구 형태의 전치사구이다. bird를 꾸민다. '머리를 공중에 둔 채로'라는 뜻이다.", "sub": ["air 공중, 허공"]}, {"t": "<b>scanning for predators</b>는 현재분사구이다. bird를 뒤에서 꾸민다. '포식자를 살피는'이라는 뜻이다. (scan for ~를 살피다, predator 포식자)"}, {"t": "끝의 <b>searching for food</b>도 현재분사구이다. have its head down의 동시 동작이다. '먹이를 찾느라'라는 뜻이다. 앞의 scanning과 대칭이다. (search for ~를 찾다)"}], "sum": "포식자를 살피느라 머리를 든 새는 동시에 먹이를 찾으려 머리를 숙일 수 없음"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2016년 4월 18번", "ans": "②", "tr": [["1", "몇 주 전에 저는 귀사가 제조한 장식용 그릇을 하나 샀습니다."], ["2", "그것이 제 식탁의 훌륭한 중앙 장식이 되기는 하지만, 동봉된 안내 전단지를 보고 저는 그 그릇을 전자레인지에 돌리면 해로운 화학물질이 나온다는 사실을 알게 되었습니다."], ["3", "많은 고객이 화학물질 중독의 위험을 알지 못하고 있다고 저는 생각합니다."], ["4", "화학물질 중독이 얼마나 위험한지 알기에, 저는 귀사가 고객에게 그 그릇을 전자레인지에 돌리지 말라고 충분히 경고하는 것이 중요하다고 생각합니다."], ["5", "상자 바깥면에 굵은 글씨를 쓰실 것을 제안합니다."], ["6", "해로운 화학물질에 관한 표시가 단순히 점토의 특성을 알려 주는 것이 아니라 '경고'라는 점을 분명히 밝혀 주십시오."], ["7", "불필요한 중독이 일어나지 않도록 이 점을 고려해 주시기 바랍니다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "I suggest that you use bold print on the outside of the box."}, {"en": false, "h": "편지 형식의 목적 문항은 <b>요청·제안 동사</b>가 나오는 자리에서 끝난다. 1~3번은 <b>상황 설명</b>이고, 글쓴이의 요구는 4번의 <b>warn customers not to microwave the bowl</b>, 5번의 <b>I suggest that you use bold print</b>, 6번의 <b>Clarify that the notice ~ is a warning</b> 세 문장에 모여 있다. 세 문장이 결국 같은 말을 한다. <b>경고 표시를 눈에 잘 띄게 하라</b>는 것이다. 특히 5번의 <b>bold print on the outside of the box</b>(상자 바깥면의 굵은 글씨)가 <b>표기 방식</b>을 콕 집어 말하므로 ②가 정확히 대응한다. <b>suggest that + 주어 + (should) 동사원형</b>이라서 <b>you use</b>에 <b>-s</b>가 붙지 않은 점도 함께 확인해 두자."}], "opts": [{"n": "①", "t": "불량 제품 사용으로 인해 발생한 피해에 대해 항의하려고", "a": false, "x": true, "trap": true, "e": "글쓴이는 <b>실제로 피해를 입지 않았다</b>. 2번은 전단지를 <b>읽고</b> 위험을 알게 되었다는 말이고, 7번은 <b>불필요한 중독이 일어나지 않도록</b> 미리 막자는 예방의 요청이다. 항의가 아니라 <b>제안</b>이다."}, {"n": "②", "t": "제품 사용 주의사항을 잘 보이게 표기할 것을 제안하려고", "a": true, "x": false, "trap": false, "e": "4번의 <b>adequately warn customers</b>, 5번의 <b>use bold print on the outside of the box</b>, 6번의 <b>Clarify that the notice ~ is a warning</b>이 모두 <b>경고를 눈에 띄게 표기하라</b>는 하나의 요구로 모인다."}, {"n": "③", "t": "제품의 사용 설명서에 기재된 내용에 대해 문의하려고", "a": false, "x": true, "trap": false, "e": "2번에 <b>information leaflet</b>이 나와서 끌리지만, 글쓴이는 그 내용을 <b>이미 읽어서 알고 있다</b>. 묻는 것이 아니라 <b>표기 방식을 바꾸라</b>고 요구하는 것이다."}, {"n": "④", "t": "소비자의 취향을 반영한 신제품 개발을 요구하려고", "a": false, "x": true, "trap": false, "e": "<b>신제품</b>이나 <b>취향</b>이라는 개념이 지문에 전혀 없다. 문제 삼는 것은 이미 산 그릇의 <b>표기</b>다."}, {"n": "⑤", "t": "제품의 기능을 다양하게 할 것을 건의하려고", "a": false, "x": true, "trap": false, "e": "<b>기능</b>을 늘리라는 말은 어디에도 없다. 오히려 <b>전자레인지에 쓰지 말라</b>고 알리라는, 사용을 <b>제한</b>하는 방향의 요청이다."}], "w": [["decorative", "장식용의"], ["manufacture", "제조하다"], ["centerpiece", "(식탁) 중앙 장식물"], ["enclosed", "동봉된"], ["information leaflet", "안내 전단지"], ["give off", "내뿜다, 방출하다"], ["harmful", "해로운"], ["chemical", "화학물질"], ["microwave", "전자레인지에 돌리다"], ["unaware of", "~을 알지 못하는"], ["chemical poisoning", "화학물질 중독"], ["adequately", "충분히, 적절히"], ["warn", "경고하다"], ["bold print", "굵은 글씨"], ["clarify", "분명히 밝히다"], ["notice", "안내 표시, 고지"], ["characteristic", "특성"], ["clay", "점토"], ["unnecessary", "불필요한"], ["occur", "일어나다, 발생하다"]]}, {"q": "02", "type": "내용 불일치", "src": "2022학년도 수능 26번", "ans": "③", "tr": [["1", "이탈리아 Fermignano에서 태어난 Donato Bramante는 생애 초기에 그림을 그리기 시작했다."], ["2", "그의 아버지는 그가 그림을 공부하도록 격려했다."], ["3", "나중에 그는 Urbino에서 Piero della Francesca의 조수로 일했다."], ["4", "1480년 무렵 그는 Milan에서 새로운 양식으로 여러 교회를 지었다."], ["5", "그는 Leonardo da Vinci와 친밀한 관계였고, 두 사람은 그 도시에서 함께 일했다."], ["6", "건축이 그의 주된 관심사가 되었지만, 그는 그림 그리기를 포기하지는 않았다."], ["7", "Bramante는 1499년에 로마로 이주해 교황 율리오 2세의 로마 재개발 계획에 참여했다."], ["8", "그는 로마에 새 성 베드로 대성당을 설계했는데, 그것은 인류 역사상 ["influence", "영향을 끼치다"], ["architect", "건축가"], ["for centuries", "수백 년 동안"]]}, {"q": "03", "type": "밑줄 의미", "src": "2022학년도 수능 21번", "ans": "③", "tr": [["1", "과학자라고 해서 도덕적·윤리적 결정에 특별한 발언권을 갖는 것은 아니다. 물리학자가 벌집 군집 붕괴의 원인을 판단할 자격이 없는 것과 마찬가지로, 기후 과학자도 의료 개혁을 논평할 자격이 있는 것은 아니다."], ["2", "어떤 전문 영역에서 전문성을 만들어 내는 바로 그 특징들이 다른 많은 영역에서는 무지로 이어진다."], ["3", "어떤 경우에는 농부, 어부, 환자, 원주민 같은 비전문가들이 과학자들이 배울 만한 관련 경험을 갖고 있기도 하다."], ["4", "실제로 최근 몇 년 사이에 과학자들은 이 점을 인식하기 시작했다. 북극 기후 영향 평가에는 현지 원주민 집단에게서 모은 관찰 자료가 포함되어 있다."], ["5", "그러므로 우리의 신뢰는 제한되고 또 집중되어야 한다."], ["6", "그 신뢰는 매우 까다로워야 한다."], ["7", "맹목적인 신뢰는 적어도 전혀 신뢰하지 않는 것만큼이나 우리를 곤경에 빠뜨릴 것이다."], ["8", "그러나 우리가 지정한 전문가들, 곧 우리가 사는 자연 세계의 어려운 문제들을 풀어내는 데 일생을 바친 사람들에 대한 어느 정도의 신뢰가 없다면, 우리는 마비되어 사실상 아침 통근을 준비해야 할지 말지조차 알 수 없게 된다."]], "evh": "8번 문장", "ev": [{"en": true, "h": "But without some degree of trust in our designated experts — the men and women who have devoted their lives to sorting out tough questions about the natural world we live in — we are paralyzed, in effect not knowing whether to make ready for the morning commute or not."}, {"en": false, "h": "밑줄 문항은 <b>밑줄이 어느 방향의 예인지</b>부터 잡아야 한다. 앞의 7번은 <b>맹목적 신뢰도 무신뢰도 곤란하다</b>는 말이고, 8번은 <b>But</b>으로 시작해 <b>신뢰가 아예 없으면 어떻게 되는가</b>를 말한다. 그 결과가 <b>we are paralyzed</b>(우리는 마비된다)이고, 밑줄은 그 마비 상태를 보여 주는 <b>가장 사소한 예</b>다. 아침에 출근 준비를 할지 말지는 <b>중대한 결정이 아니라 누구나 아는 일상적 판단</b>인데, 전문가에 대한 신뢰가 없으면 그런 것조차 확신할 수 없다는 뜻이다. 따라서 밑줄이 가리키는 것은 <b>중대한 결정에는 거의 영향을 주지 않는 상식 수준의 지식</b>, 곧 ③이다. 밑줄 표현이 <b>얼마나 사소한 예로 쓰였는가</b>를 읽어 내는 것이 이 문항의 전부다."}], "opts": [{"n": "①", "t": "비전문가들에 의해 대중화된 의심스러운 사실들", "a": false, "x": true, "trap": false, "e": "3번에 <b>lay people</b>이 나와서 끌리지만, 그 문장은 비전문가의 경험이 <b>배울 만하다</b>는 긍정적 언급이다. <b>의심스러운 사실</b>이라는 부정적 평가는 지문에 없다."}, {"n": "②", "t": "전문화된 전문가들이 제공하는 즉시 적용 가능한 정보", "a": false, "x": true, "trap": true, "e": "밑줄은 <b>전문가를 신뢰하지 못할 때 잃게 되는 것</b>이다. 전문가가 <b>제공하는 정보</b> 자체를 가리키지 않는다. 또 아침 통근 준비는 <b>전문가가 알려 주는 정보</b>도 아니다."}, {"n": "③", "t": "중대한 결정에 거의 영향을 주지 않는 상식", "a": true, "x": false, "trap": false, "e": "밑줄은 <b>아침 통근 준비</b>라는 지극히 사소한 일상 판단이다. 전문가에 대한 신뢰가 없으면 이런 <b>상식 수준의 지식</b>조차 확신할 수 없어 마비된다는 뜻이므로 ③이 정확하다."}, {"n": "④", "t": "전문가와 비전문가 모두가 만들어 내는 실용적 정보", "a": false, "x": true, "trap": false, "e": "3~4번에서 <b>양쪽 모두</b>의 경험이 쓰인다는 말이 나오기는 하지만, 그것은 <b>신뢰의 대상을 넓히라</b>는 근거일 뿐 <b>밑줄이 가리키는 대상</b>이 아니다."}, {"n": "⑤", "t": "지역 공동체에 널리 퍼진 편향된 지식", "a": false, "x": true, "trap": false, "e": "4번의 <b>local native groups</b>만 보고 <b>지역</b>이라는 단어를 끌어온 선지다. 그 자료는 <b>편향된 지식</b>이 아니라 과학자들이 <b>받아들인 관찰 자료</b>로 제시된다."}], "w": [["purchase", "발언권, 영향력"], ["ethical", "윤리적인"], ["qualified", "자격이 있는"], ["comment on", "~에 대해 논평하다"], ["health care reform", "의료 개혁"], ["physicist", "물리학자"], ["bee colony collapse", "벌집 군집 붕괴"], ["expertise", "전문성"], ["domain", "영역, 분야"], ["ignorance", "무지"], ["lay people", "비전문가, 일반인"], ["native peoples", "원주민"], ["relevant", "관련 있는"], ["assessment", "평가"], ["observation", "관찰 (자료)"], ["particular", "까다로운, 특정한"], ["blind trust", "맹목적 신뢰"], ["designated", "지정된"], ["sort out", "해결하다, 정리하다"], ["paralyzed", "마비된"], ["in effect", "사실상"], ["make ready for", "~에 대비하다"], ["commute", "통근"]]}, {"q": "04", "type": "글의 요지", "src": "2021년 4월 22번", "ans": "⑤", "tr": [["1", "할인 행사 중에 인하된 가격이 어떻게 적혀 있는가는 제품에 대한 사람들의 태도(그리고 그것을 구매할 가능성)에 크게 영향을 미친다."], ["2", "할인가가 백분율을 이용해(예를 들어 '-50%') 또는 새 가격이 이미 계산된 형태로(예를 들어 '지금은 단돈 20달러') 이해하기 쉽게 제시되면, 쇼핑객들은 자동적이고 긍정적인 방식으로 반응한다."], ["3", "그러나 복잡한 암산을 해야 한다면(예를 들어 27.50달러짜리 제품이 12% 할인이라고 광고된다면), 그들은 더 분석적인 사고방식으로 전환한다."], ["4", "이는 계산에, 그리고 이어서 그 제품의 장점에 더 많은 주의를 쏟는 결과를 낳는다."], ["5", "더 이상 즉흥적인 기분이 들지 않게 된 쇼핑객들은 이것이 정말 좋은 거래인지, 신발이 한 켤레 더 정말 필요하기는 한지 등을 따지기 시작한다."], ["6", "쇼핑객에게 요구되는 인지적 노력이 클수록 부정적이고 의심하는 반응이 더 많이 유발되고, 판매가 성사될 가능성은 줄어든다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "The more cognitive effort is demanded from shoppers, the more of a negative and suspicious reaction will be evoked, and the chances of making a sale diminish."}, {"en": false, "h": "요지 문항의 정답은 대개 <b>첫 문장과 마지막 문장</b>에 갇혀 있다. 1번이 <b>가격을 어떻게 적는가가 태도와 구매 가능성에 영향을 준다</b>고 판을 깔고, 6번이 <b>The more ~, the more ~</b> 구문으로 결론을 못 박는다. <b>인지적 노력(cognitive effort)이 클수록 부정적 반응이 커지고 판매 가능성은 줄어든다</b>는 것이다. 이 <b>인지적 노력</b>이 곧 ⑤의 <b>인지적 부담</b>이고, <b>가격을 적는 방식</b>이 ⑤의 <b>할인가 제시 방식</b>이다. 2번(쉬우면 자동적·긍정적 반응)과 3~5번(어려우면 분석적 사고로 전환)은 이 결론을 양쪽에서 받쳐 주는 <b>대조</b>일 뿐이다. <b>the 비교급 ~, the 비교급 ~</b>이 보이면 그 문장이 <b>결론일 확률이 매우 높다</b>는 점을 기억해 두자."}], "opts": [{"n": "①", "t": "상품 할인율이 클수록 상품의 단점이 쉽게 노출될 수 있다.", "a": false, "x": true, "trap": false, "e": "글이 문제 삼는 것은 <b>할인율의 크기</b>가 아니라 <b>할인가를 적는 방식</b>이다. 또 4번은 <b>merits</b>(장점)에 주의가 간다고 했지 <b>단점이 드러난다</b>고 하지 않았다."}, {"n": "②", "t": "경쟁 상품과 비교되는 품질 정보 제시는 판매에 효과적이다.", "a": false, "x": true, "trap": false, "e": "<b>경쟁 상품</b>이나 <b>품질 정보</b>라는 개념이 지문에 없다. 비교되는 것은 오직 <b>계산이 쉬운 표기</b>와 <b>계산이 어려운 표기</b>다."}, {"n": "③", "t": "상품에 대한 공인된 평가가 소비에 대한 심리적 장벽을 낮춘다.", "a": false, "x": true, "trap": false, "e": "<b>공인된 평가</b>는 지문에 등장하지 않는다. 심리적 장벽을 낮추는 것은 <b>남의 평가</b>가 아니라 <b>계산이 필요 없는 쉬운 가격 표기</b>다."}, {"n": "④", "t": "상품 판매율을 높이기 위해 다양한 소비 성향 분석이 필요하다.", "a": false, "x": true, "trap": true, "e": "3번의 <b>analytical</b>(분석적인)이라는 단어를 <b>판매자의 소비자 분석</b>으로 잘못 옮겨 온 선지다. 분석적으로 사고하는 주체는 판매자가 아니라 <b>쇼핑객</b>이다."}, {"n": "⑤", "t": "상품 할인가 제시 방식의 인지적 부담 정도가 판매에 영향을 준다.", "a": true, "x": false, "trap": false, "e": "1번의 <b>The way reduced prices are written ~ will greatly affect</b>와 6번의 <b>The more cognitive effort ~ the chances of making a sale diminish</b>가 그대로 대응한다."}], "w": [["reduced price", "할인가"], ["affect", "영향을 미치다"], ["attitude", "태도"], ["likelihood", "가능성"], ["percentage", "백분율"], ["calculate", "계산하다"], ["react", "반응하다"], ["automatic", "자동적인"], ["fashion", "방식"], ["mental calculation", "암산"], ["advertise", "광고하다"], ["switch to", "~로 바꾸다"], ["analytical", "분석적인"], ["result in", "~라는 결과를 낳다"], ["subsequently", "이어서, 그 뒤에"], ["merit", "장점"], ["spontaneous", "즉흥적인"], ["question", "의문을 제기하다"], ["cognitive effort", "인지적 노력"], ["evoke", "불러일으키다"], ["diminish", "줄어들다"]]}, {"q": "05", "type": "어법", function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}

  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}

    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
