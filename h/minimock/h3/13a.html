<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}

sup>4</sup>\u0002, / \u0001much of it glaciated<sup>5</sup>\u0002.", "pk": "그 지진은 2만 4천 제곱마일의 황무지를 완전히 파괴했다, / \u0001그리고 그중 많은 부분은 빙하로 덮여 있었다\u0002.", "core": "그 지진은 24,000 제곱마일을 완전히 파괴했다.", "tags": ["주어 + 동사(devastated) + 목적어(24,000 square miles): 3형식. (of wilderness) = 전치사구(형용사구): miles를 꾸밈", "(much of it glaciated) = <b>독립분사구문</b>(부사적: 부대상황): 앞 문장 전체를 꾸밈, 주어 much of it이 따로 있음"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b> 뒤에 <b>독립분사구문</b>이 붙은 문장이다. 끝의 glaciated가 동사처럼 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The quake (그 지진)", "V: devastated (devastate 완전히 파괴하다의 과거형)", "O: 24,000 square miles (2만 4천 제곱마일)", "뼈대 = <b>The quake devastated 24,000 square miles</b>"]}, {"t": "<b>of wilderness</b>는 전치사구(형용사구)이다. miles를 꾸민다 (황무지의). wilderness (황무지, 자연 상태의 땅)."}, {"t": "<b>much of it glaciated</b>는 <b>독립분사구문(부사구)</b>이다. 주절 전체를 꾸민다 (그중 많은 부분이 빙하로 덮인 채). 분사구문의 주어가 주절 주어와 달라서 따로 쓴 것이다.", "sub": ["much of it (그중 많은 부분). it = wilderness (황무지)", "glaciated (빙하로 덮인). being이 생략된 과거분사"]}, {"t": "함정: glaciated는 동사가 아니다. 앞에 being이 생략된 분사구문이다."}], "sum": "지진이 황무지를 파괴, 그중 상당 부분은 빙하 지대"}, {"i": "04", "q": "04", "s": "1", "title": "보어 도치 + 관계절", "eng": "Often overlooked<sup>1</sup>, but just as important a stakeholder<sup>2</sup>, / is the consumer<sup>3</sup> / who plays a large role in the notion<sup>4</sup> of the privacy paradox<sup>5</sup>.", "notes": [["1", "overlook", "간과하다"], ["2", "stakeholder", "이해관계자"], ["3", "consumer", "소비자"], ["4", "notion", "개념, 생각"], ["5", "paradox", "역설"]], "lit": "흔히 간과되지만 꼭 그만큼 중요한 이해관계자인 것은 / 바로 소비자이다 / 개인정보 역설이라는 개념에서 큰 역할을 하는.", "nat": "흔히 간과되지만 꼭 그만큼 중요한 이해관계자가 바로 소비자인데, 소비자는 개인정보 역설이라는 개념에서 큰 역할을 한다.", "ana": "문장이 <b>Often overlooked</b>라는 과거분사로 시작하는데, 이것은 분사구문이 아니라 <b>보어가 문장 앞으로 나간 도치</b>다. 원래 어순은 <b>The consumer ~ is often overlooked, but just as important a stakeholder</b>였다. 보어가 앞으로 나가면 그 뒤는 <b>동사 + 주어</b> 순서가 되므로, <b>is</b> 다음에 오는 <b>the consumer</b>가 진짜 주어다. 도치는 '<b>동사 앞에 주어가 없다</b>'는 신호로 알아채는 것이 가장 빠르다. 또 <b>just as important a stakeholder</b>의 어순도 주의하자. <b>as + 형용사 + a + 명사</b>는 as·so·too·how 뒤에서만 나타나는 특이 어순으로, a just as important stakeholder가 아니다. 마지막 <b>who</b>는 the consumer를 받는 주격 관계대명사이므로 뒤에 주어 없이 동사 plays가 바로 온다.", "pe": "\u0001Often\u0002 overlooked<sup>1</sup>, but \u0001just\u0002 as important a stakeholder<sup>2</sup>, / is the consumer<sup>3</sup> / \u0001who plays a large role in the notion<sup>4</sup> of the privacy paradox<sup>5</sup>\u0002.", "pk": "\u0001흔히\u0002 간과되지만 \u0001꼭 그만큼\u0002 중요한 이해관계자인 것은 / 바로 소비자이다 / \u0001개인정보 역설이라는 개념에서 큰 역할을 하는\u0002.", "core": "간과되지만 중요한 이해관계자가 바로 소비자이다.", "tags": ["<b>보어 도치</b>: overlooked, … stakeholder가 보어(C). (Often) = 부사: overlooked를 꾸밈, (just) = 부사: as important를 꾸밈", "동사 is + 주어 the consumer: SVC에서 C가 앞으로 나간 <b>도치</b>", "(who plays … paradox) = 관계절(형용사절): the consumer를 꾸밈"], "steps": [{"t": "이 문장은 <b>보어가 문장 앞으로 나간 도치</b>이다. 정상 어순은 <b>The consumer is (often overlooked but just as important a stakeholder)</b>이다. 맨 앞이 주어가 아니라서 헷갈린다."}, {"t": "뼈대부터 찾는다.", "sub": ["C: Often overlooked, but just as important a stakeholder (흔히 간과되지만 꼭 그만큼 중요한 이해관계자)", "V: is (be ~이다)", "S: the consumer (소비자)", "뼈대 = <b>(C) is the consumer</b>"]}, {"t": "앞쪽 보어 덩어리를 본다.", "sub": ["Often (흔히) overlooked (overlook 간과하다의 과거분사. 간과되는)", "but just as important a stakeholder = 꼭 그만큼 중요한 이해관계자. 어순이 as + 형용사 + a + 명사이다. stakeholder 이해관계자"]}, {"t": "<b>who plays a large role in the notion of the privacy paradox</b>는 <b>주격 관계절(형용사절)</b>이다. the consumer를 꾸민다 (개인정보 역설이라는 개념에서 큰 역할을 하는).", "sub": ["play a role (역할을 하다), notion (개념), privacy (개인정보, 사생활), paradox (역설)"]}, {"t": "함정: stakeholder가 주어처럼 보여도 주어가 아니다. 동사 is 뒤의 <b>the consumer</b>가 주어이다."}], "sum": "간과되지만 똑같이 중요한 이해관계자, 소비자"}, {"i": "05", "q": "04", "s": "2", "title": "S+V + 대시 + and S+V+O", "eng": "Consumer engagement<sup>1</sup> levels in all manner of<sup>2</sup> digital experiences and communities have simply exploded<sup>3</sup> / — and they show little or no signs of<sup>4</sup> slowing<sup>5</sup>.", "notes": [["1", "engagement", "참여, 관여"], ["2", "in all manner of", "온갖 종류의"], ["3", "explode", "폭발적으로 증가하다"], ["4", "show signs of", "~의 기미를 보이다"], ["5", "slow", "느려지다"]], "lit": "온갖 종류의 디지털 경험과 공동체에서 소비자의 참여 수준은 그야말로 폭발적으로 증가해 왔다 / — 그리고 그것은 둔화될 기미를 거의 또는 전혀 보이지 않는다.", "nat": "온갖 종류의 디지털 경험과 공동체에서 소비자의 참여 수준은 그야말로 폭발적으로 증가해 왔으며, 둔화될 기미는 거의 또는 전혀 보이지 않는다.", "ana": "주어가 어디까지인지부터 확정해야 한다. 진짜 주어는 <b>Consumer engagement levels</b>이고, 그 뒤의 <b>in all manner of digital experiences and communities</b>는 통째로 <b>전치사구 수식어</b>다. 그래서 동사는 바로 앞의 communities(복수)나 experiences 때문이 아니라 <b>levels</b> 때문에 <b>have</b>다. 어법 문제는 이렇게 <b>주어와 동사 사이에 긴 수식어를 끼워 넣고</b> 엉뚱한 명사에 수를 맞추게 유도한다. 대응책은 하나다 — <b>전치사구는 무조건 괄호로 묶고</b> 남는 명사에 동사를 맞춘다. <b>little or no</b>는 '거의 또는 전혀 없는'이라는 <b>부정</b>의 뜻이므로, 이 문장은 참여가 <b>계속 늘고 있다</b>는 말이다. little을 '조금 있다'로 읽으면 정반대가 된다.", "pe": "Consumer engagement<sup>1</sup> levels \u0001in all manner of<sup>2</sup> digital experiences and communities\u0002 have \u0001simply\u0002 exploded<sup>3</sup> / — and they show little or no signs \u0001of<sup>4</sup> slowing<sup>5</sup>\u0002.", "pk": "\u0001온갖 종류의 디지털 경험과 공동체에서\u0002 소비자의 참여 수준은 \u0001그야말로\u0002 폭발적으로 증가해 왔다 / — 그리고 그것은 둔화될 기미를 거의 또는 전혀 보이지 않는다.", "core": "참여 수준이 증가해 왔고, 그것은 징후를 거의 또는 전혀 보이지 않는다.", "tags": ["주어 levels + 동사 have exploded: 1형식. (in … communities) = 전치사구(형용사구): levels를 꾸밈, (simply) = 부사: exploded를 꾸밈", "주어 they + 동사 show + 목적어 little or no signs: 3형식. (of slowing) = 전치사구(형용사구): signs를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>와 <b>S+V+O(3형식)</b>가 대시와 and로 이어진 문장이다. 앞 절의 주어 뒤에 수식이 길어 동사가 늦게 나온다."}, {"t": "앞 절의 뼈대를 찾는다.", "sub": ["S: Consumer engagement levels (소비자의 참여 수준들. engagement 참여, level 수준)", "V: have exploded (explode 폭발하다, 급증하다의 현재완료)", "simply = 부사 (그야말로). exploded를 꾸민다", "뼈대 = <b>levels have exploded</b>"]}, {"t": "<b>in all manner of digital experiences and communities</b>는 전치사구(형용사구)이다. levels를 꾸민다 (온갖 종류의 디지털 경험과 공동체에서의).", "sub": ["all manner of (온갖 종류의), digital (디지털의), community (공동체)"]}, {"t": "뒤 절의 뼈대를 찾는다.", "sub": ["S: they (= consumer engagement levels, 참여 수준)", "V: show (보이다)", "O: little or no signs (거의 또는 전혀 없는 징후. sign 징후, 기미)", "뼈대 = <b>they show little or no signs</b>"]}, {"t": "<b>of slowing</b>은 전치사구(형용사구)이다. signs를 꾸민다 (둔화될). of 뒤라서 slowing은 동명사이다. slow (둔화되다)."}, {"t": "함정: 주어는 levels이다. have 바로 앞의 experiences, communities를 주어로 착각하지 않는다."}], "sum": "디지털 속 소비자 참여는 급증했고 둔화 기미도 거의 없음"}, {"i": "06", "q": "05", "s": "3", "title": "Regardless of 구 + S+V+C + that절", "eng": "Regardless of<sup>1</sup> the type of information disclosed<sup>2</sup>, / clients must be certain / that it will not be used against them in a court of law<sup>3</sup>, / by the authorities<sup>4</sup> or by any other party<sup>5</sup>.", "notes": [["1", "regardless of", "~와 상관없이"], ["2", "disclose", "유출하다, 누설하다"], ["3", "court of law", "법정"], ["4", "authorities", "(주로 복수) 당국"], ["5", "party", "당사자"]], "lit": "공개된 정보의 유형과 상관없이, / 의뢰인들은 확신할 수 있어야 한다 / 그것이 법정에서 자신들에게 불리하게 사용되지 않을 것이라고, / 당국에 의해서든 다른 어떤 당사자에 의해서든.", "nat": "어떤 유형의 정보가 공개되었든 상관없이, 의뢰인들은 그 정보가 법정에서 당국이나 다른 어떤 당사자에 의해 자신들에게 불리하게 사용되지 않을 것이라고 확신할 수 있어야 한다.", "ana": "<b>information disclosed</b>에서 명사 뒤에 과거분사가 바로 붙었다. 이것은 <b>information (that is) disclosed</b>에서 <b>관계대명사 + be동사</b>가 생략된 <b>후치수식</b>이다. 판단 기준은 <b>능동·수동 관계</b>다. 정보는 <b>유출되는</b> 대상이므로 수동, 따라서 disclosing이 아니라 <b>disclosed</b>가 맞다. 이런 자리는 어법 문제의 단골이니 '<b>명사가 그 동작을 하는가, 당하는가</b>'를 늘 먼저 물어야 한다. 뒤의 <b>be certain that</b>은 '~을 확신하다'로, that절 안이 <b>완전한 문장</b>이다. 마지막 <b>by the authorities or by any other party</b>는 새 절이 아니라 앞의 수동태 <b>will not be used</b>에 걸리는 <b>행위자 by구</b>가 or로 병렬된 것이다.", "pe": "\u0001Regardless of<sup>1</sup> the type of information disclosed<sup>2</sup>\u0002, / clients must be certain / \u0001that it will not be used against them in a court of law<sup>3</sup>\u0002, / \u0001by the authorities<sup>4</sup> or by any other party<sup>5</sup>\u0002.", "pk": "\u0001공개된 정보의 유형과 상관없이\u0002, / 의뢰인들은 확신할 수 있어야 한다 / \u0001그것이 법정에서 자신들에게 불리하게 사용되지 않을 것이라고\u0002, / \u0001당국에 의해서든 다른 어떤 당사자에 의해서든\u0002.", "core": "의뢰인들은 확신할 수 있어야 한다.", "tags": ["(Regardless of … disclosed) = 전치사구(부사구: 양보): 문장 전체를 꾸밈. disclosed = 과거분사: information을 꾸밈", "주어 clients + 동사 must be + 보어 certain: 2형식(SVC)", "(that절) = 접속사절(부사적): certain의 확신 내용. SVC가 이미 완성 [기준: 감정·판단 형용사 뒤 that절 = 수식어]", "(by the authorities or by any other party) = 전치사구(부사구): used의 행위자, 앞 that절 안에서 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 앞에 양보 전치사구가, 뒤에 길게 that절이 붙어 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: clients (의뢰인들)", "V: must be (be ~이어야 한다)", "C: certain (확신하는)", "뼈대 = <b>clients must be certain</b>"]}, {"t": "<b>Regardless of the type of information disclosed</b>는 전치사구(부사구, 양보)이다. 문장 전체를 꾸민다 (공개된 정보의 유형과 상관없이).", "sub": ["disclosed = 과거분사. information을 꾸민다 (공개된). disclose 공개하다"]}, {"t": "<b>that it will not be used against them ~</b>는 certain의 내용을 보충하는 that절이다. clients must be certain만으로 문장이 완결이라 수식어로 본다 (문형 기준).", "sub": ["S: it (= the information, 그 정보), V: will not be used (use 사용하다의 수동태 부정)", "against them (그들에게 불리하게). them = clients (의뢰인들)", "in a court of law (법정에서), court of law = 법정"]}, {"t": "<b>by the authorities or by any other party</b>는 전치사구(부사구)이다. used의 행위자를 말한다 (당국에 의해서든 다른 어떤 당사자에 의해서든). authorities (당국), party (당사자)."}, {"t": "함정: it은 앞에 나온 information을 가리킨다. disclosed는 동사가 아니라 information을 꾸미는 과거분사이다."}], "sum": "공개한 정보가 법정에서 불리하게 쓰이지 않는다는 확신이 필요"}, {"i": "07", "q": "06", "s": "1", "title": "S+V+O + 주격 관계절", "eng": "Bazaar<sup>1</sup> economies feature<sup>2</sup> an apparently<sup>3</sup> flexible price-setting mechanism / that sits atop<sup>4</sup> more enduring<sup>5</sup> ties of shared culture.", "notes": [["1", "bazaar", "바자, 상점가"], ["2", "feature", "~을 특징으로 하다"], ["3", "apparently", "겉보기에"], ["4", "atop", "~의 맨 위에"], ["5", "enduring", "지속적인, 오래가는"]], "lit": "바자 경제는 겉보기에 유연한 가격 결정 메커니즘을 특징으로 한다 / 공유된 문화라는 더 지속적인 관계 위에 자리 잡고 있는.", "nat": "바자 경제는 공유된 문화라는 더 지속적인 관계 위에 자리 잡은, 겉보기에 유연한 가격 결정 메커니즘을 특징으로 한다.", "ana": "<b>feature</b>를 '특징'이라는 명사로만 알고 있으면 이 문장에서 동사를 찾지 못한다. 여기서는 '<b>~을 특징으로 하다</b>'라는 <b>타동사</b>다. 주어는 Bazaar economies, 동사는 feature, 목적어는 <b>an apparently flexible price-setting mechanism</b>이다. 그 뒤의 <b>that</b>은 mechanism을 받는 <b>주격 관계대명사</b>인데, 뒤에 주어 없이 동사 <b>sits</b>가 바로 나오는 것이 그 증거다. 선행사가 <b>단수</b>(mechanism)라서 동사도 <b>sits</b>로 단수인 점까지 확인해 두자. <b>atop</b>은 on top of를 한 단어로 줄인 전치사이며, 여기서는 물리적 위치가 아니라 '<b>~ 위에 얹혀 있다</b>', 즉 <b>더 근본적인 것에 기대고 있다</b>는 비유다. 이 비유를 잡아야 글 전체의 논지가 보인다.", "pe": "Bazaar<sup>1</sup> economies feature<sup>2</sup> an \u0001apparently<sup>3</sup> flexible price-setting\u0002 mechanism / \u0001that sits atop<sup>4</sup> more enduring<sup>5</sup> ties of shared culture\u0002.", "pk": "바자 경제는 \u0001겉보기에 유연한 가격 결정\u0002 메커니즘을 특징으로 한다 / \u0001공유된 문화라는 더 지속적인 관계 위에 자리 잡고 있는\u0002.", "core": "바자 경제는 메커니즘을 특징으로 한다.", "tags": ["주어 Bazaar economies + 동사 feature + 목적어 mechanism: 3형식. (apparently flexible price-setting) = 형용사구: mechanism을 꾸밈", "(that sits … culture) = 관계절(형용사절): mechanism을 꾸밈. atop = ~의 위에"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b> 뒤에 <b>주격 관계절</b>이 붙은 문장이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Bazaar economies (바자 경제. bazaar 시장)", "V: feature (feature 특징으로 하다. 여기서는 동사)", "O: mechanism (메커니즘, 구조)", "뼈대 = <b>Bazaar economies feature mechanism</b>"]}, {"t": "<b>an apparently flexible price-setting</b>은 mechanism을 앞에서 꾸미는 형용사구이다 (겉보기에 유연한 가격 결정).", "sub": ["apparently (겉보기에), flexible (유연한), price-setting (가격을 정하는)"]}, {"t": "<b>that sits atop more enduring ties of shared culture</b>는 <b>주격 관계절(형용사절)</b>이다. mechanism을 꾸민다.", "sub": ["that = mechanism (메커니즘)", "V: sits (sit 놓여 있다). atop = ~의 위에 (전치사)", "more enduring ties (더 지속적인 관계들. enduring 오래 지속되는, tie 유대), of shared culture (공유된 문화의)"]}, {"t": "함정: feature는 명사(특징)가 아니라 여기서는 동사이다. 주어 뒤에 바로 나와 있어서 동사로 읽는다."}], "sum": "바자 경제, 공유 문화라는 지속적 유대 위에 얹힌 유연한 가격 결정 구조"}, {"i": "08", "q": "06", "s": "4", "title": "분사구 후치수식 + what절 + see A as B", "eng": "Each actor<sup>1</sup> belonging to<sup>2</sup> a specific economic class<sup>3</sup> / understands / what the other sees as a necessity<sup>4</sup> and a luxury<sup>5</sup>.", "notes": [["1", "actor", "행위자"], ["2", "belong to", "~에 속하다"], ["3", "economic class", "경제 계층"], ["4", "necessity", "필수, 필수품"], ["5", "luxury", "사치품"]], "lit": "특정 경제 계층에 속한 각 행위자는 / 이해한다 / 상대방이 무엇을 필수품으로 그리고 사치품으로 보는지를.", "nat": "특정 경제 계층에 속한 각 행위자는 상대방이 무엇을 필수품으로 보고 무엇을 사치품으로 보는지를 이해한다.", "ana": "주어 <b>Each actor</b> 뒤에 <b>belonging to ~</b>가 붙어 주어부가 길어졌다. 명사 뒤의 <b>-ing</b>는 <b>who belongs to</b>가 줄어든 <b>현재분사의 후치수식</b>이며, 행위자가 스스로 '속해 있는' 능동 관계이므로 belonged가 아니라 <b>belonging</b>이다. 여기서 진짜 함정은 <b>수 일치</b>다. 바로 앞의 class가 단수라서가 아니라, 주어가 <b>Each actor</b>이기 때문에 동사가 <b>understands</b>로 단수다. <b>Each + 단수명사 + 단수동사</b>는 예외가 없다. 목적어 자리의 <b>what</b>은 선행사를 품은 관계대명사로 '<b>~하는 것</b>'이며, 뒤에 <b>sees의 목적어가 빠진 불완전한 절</b>이 온다. <b>see A as B</b>(A를 B로 여기다)에서 A가 what으로 앞에 나갔다고 보면 구조가 한눈에 정리된다.", "pe": "Each actor<sup>1</sup> \u0001belonging to<sup>2</sup> a specific economic class<sup>3</sup>\u0002 / understands / what the other sees \u0001as a necessity<sup>4</sup> and a luxury<sup>5</sup>\u0002.", "pk": "\u0001특정 경제 계층에 속한\u0002 각 행위자는 / 이해한다 / 상대방이 무엇을 필수품으로 그리고 사치품으로 보는지를.", "core": "각 행위자는 상대방이 무엇을 보는지 이해한다.", "tags": ["주어 Each actor. (belonging to … class) = 현재분사구(형용사적): actor를 꾸밈", "동사 understands: 목적어는 다음 명사절", "what절 = 목적어(<b>명사절</b>): the other가 주어, sees가 동사, what이 목적어. (as a necessity and a luxury) = 전치사구(부사구): 거의 필수에 가까운 부사구(see A as B) [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 주어 뒤 분사구와 목적어 자리의 what절 때문에 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Each actor (각 행위자)", "V: understands (understand 이해하다)", "O: what절 (명사절. 무엇을 ~하는지)", "뼈대 = <b>Each actor understands what ~</b>"]}, {"t": "<b>belonging to a specific economic class</b>는 <b>현재분사구(형용사구)</b>이다. Each actor를 뒤에서 꾸민다 (특정 경제 계층에 속한).", "sub": ["belong to (~에 속하다), specific (특정한), economic class (경제 계층)"]}, {"t": "목적어 <b>what the other sees as a necessity and a luxury</b>의 안쪽을 본다.", "sub": ["S: the other (상대방), V: sees (see A as B A를 B로 보다)", "what = see의 목적어 A 자리가 앞으로 나간 말 (무엇을)", "as a necessity and a luxury = 전치사구(부사구). sees를 꾸민다 (필수품으로, 그리고 사치품으로). see A as B의 as B는 거의 필수에 가까워 같이 본다 (문형 기준). necessity 필수품, luxury 사치품"]}, {"t": "함정: belonging은 동사가 아니다. 그리고 what은 sees의 목적어이다."}], "sum": "각 계층의 행위자, 상대가 무엇을 필수와 사치로 보는지 이해"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2019학년도 6월 18번", "ans": "①", "tr": [["1", "직원 여러분께,"], ["2", "다음 주 월요일, Nature's Beauty Gardens는 연례 ‘Toddler Trek’ 행사를 위해 아주 중요한 손님들을 모시는 기쁨을 누리게 됩니다."], ["3", "저희는 이 행사가 재미있고, 교육적이며, 무엇보다도 유아들에게 안전하기를 바랍니다."], ["4", "부모님과 아이들이 야외 활동을 즐기고 소풍 도시락을 먹으며 시간을 보낼 예정입니다."], ["5", "그러므로 정원에 잠재적인 위험 요소가 있는지 점검하는 것이 매우 중요합니다."], ["6", "각 부서의 관리자들은 모든 위험한 장비와 기계가 안전하게 보관되어 있는지 반드시 확인해 주셔야 합니다."], ["7", "또한, 이번 행사에서 손님들의 안전을 위해 정원용 화학 물질은 Nature's Beauty Gardens 내 어디에서도 사용되지 않을 것입니다."], ["8", "이번 안전 점검에 협조해 주시고 올해 ‘Toddler Trek’ 행사를 지금까지 중 최고의 행사로 만드는 데 도움을 주셔서 감사합니다."], ["9", "안부를 전하며, 상무이사 Laura Alfaro 드림"]], "evh": "5번 문장", "ev": [{"en": true, "h": "It is therefore very important to check the garden for potential dangers. Managers of each department must make sure that all dangerous equipment and machinery are safely stored."}, {"en": false, "h": "목적 문항은 <b>글쓴이가 상대에게 시키는 행동</b>이 무엇인지만 찾으면 끝난다. 1~4번 문장은 '<b>어떤 행사가 언제 열린다</b>'는 배경이고, 방향이 꺾이는 곳은 5번 문장의 <b>It is therefore very important to check the garden for potential dangers</b>다. 그리고 6번 문장에서 <b>Managers of each department must make sure that ~</b>이라며 <b>구체적인 지시</b>가 이어지고, 7번 문장에서 화학 물질 사용 금지까지 덧붙는다. 즉 이 글은 행사 <b>홍보</b>가 아니라 직원에게 <b>안전 점검을 지시</b>하는 사내 공지다. <b>must</b>·<b>make sure</b>·<b>check</b>처럼 <b>의무를 나타내는 표현</b>이 몰려 있는 곳이 목적 문항의 정답 자리다."}], "opts": [{"n": "①", "t": "안전한 행사를 위한 준비를 지시하려고", "a": true, "x": false, "trap": false, "e": "5·6·7번 문장의 <b>check for potential dangers</b>, <b>must make sure ~ safely stored</b>, <b>chemicals will not be used</b>가 모두 <b>안전 준비 지시</b>로 모인다."}, {"n": "②", "t": "노후 장비 교체 일정을 안내하려고", "a": false, "x": true, "trap": true, "e": "<b>equipment</b>와 <b>machinery</b>가 나와서 그럴듯하지만, 글은 그것들을 <b>안전하게 보관하라</b>고 할 뿐 <b>교체</b>나 <b>일정</b>은 한 마디도 없다."}, {"n": "③", "t": "체험 학습 행사 홍보를 부탁하려고", "a": false, "x": true, "trap": false, "e": "‘Toddler Trek’ 행사는 이미 열리기로 정해져 있고, 수신자는 <b>직원(staff)</b>이지 외부 홍보 대상이 아니다. 홍보(promote)라는 말도 나오지 않는다."}, {"n": "④", "t": "정원 박람회 기획자를 모집하려고", "a": false, "x": true, "trap": false, "e": "장소가 정원(gardens)일 뿐 <b>박람회</b>도, <b>모집</b>도 글에 없다. 단어 하나만 보고 고르면 걸리는 선지다."}, {"n": "⑤", "t": "체육 대회 참가를 독려하려고", "a": false, "x": true, "trap": false, "e": "<b>outdoor activities</b>는 유아와 부모의 야외 활동이지 <b>체육 대회</b>가 아니며, 독려(encourage)의 대상도 아니다."}], "w": [["annual", "연례의, 해마다의"], ["have the pleasure of ~ing", "~하는 기쁨을 누리다"], ["toddler", "유아, 아장아장 걷는 아이"], ["trek", "걷기, 짧은 도보 여행"], ["spend time ~ing", "~하며 시간을 보내다"], ["potential", "잠재적인, 가능성 있는"], ["check A for B", "A에 B가 있는지 점검하다"], ["department", "부서"], ["equipment", "장비, 용품, 설비"], ["machinery", "기계, 기계류"], ["chemical", "화학 물질"], ["cooperation", "협조, 협력"]]}, {"q": "02", "type": "함축 의미", "src": "2019학년도 6월 29번", "ans": "①", "tr": [["1", "여기 한 가지 흥미로운 생각이 있다."], ["2", "만약 빙하가 다시 형성되기 시작한다면, 지금은 이용할 물이 훨씬 더 많다 — 허드슨만, 오대호, 캐나다의 수십만 개 호수들인데, 그중 어느 것도 마지막 대륙 빙하를 채워 주지는 않았다 — 그래서 빙하는 훨씬 더 빨리 커질 것이다."], ["3", "그리고 만약 빙하가 정말로 다시 전진하기 시작한다면, 우리는 정확히 무엇을 할 것인가?"], ["4", "TNT나 어쩌면 핵미사일로 그것들을 폭파할 것인가?"], ["5", "자, 우리는 틀림없이 그렇게 하겠지만, 이것을 한번 생각해 보라."], ["6", "1964년, 북미에서 지금까지 기록된 가장 큰 지진이 핵폭탄 2천 개에 맞먹는 20만 메가톤의 응집된 힘으로 알래스카를 뒤흔들었다."], ["7", "거의 3천 마일 떨어진 텍사스에서는 수영장 물이 철벅거리며 밖으로 튀어나왔다."], ["8", "앵커리지의 한 거리는 20피트나 내려앉았다."], ["9", "그 지진은 2만 4천 제곱마일의 황무지를 완전히 파괴했는데, 그중 많은 부분이 빙하로 덮여 있었다."], ["10", "그리고 이 모든 힘이 알래스카의 빙하에 어떤 영향을 미쳤을까?"], ["11", "아무것도 없었다."]], "evh": "10번 문장", "ev": [{"en": true, "h": "And what effect did all this might have on Alaska's glaciers? None."}, {"en": false, "h": "함축 의미 문항은 <b>밑줄 바로 앞 문장</b>이 열쇠다. 이 글은 3·4번 문장에서 '<b>빙하가 다시 밀려오면 TNT나 핵미사일로 폭파할까?</b>'라는 질문을 던져 놓는다. 그리고 5번 문장의 <b>but consider this</b>를 기점으로 <b>1964년 알래스카 대지진</b>이라는 사례로 넘어간다. 그 지진은 핵폭탄 2천 개에 맞먹는 힘으로 텍사스의 수영장 물까지 튀게 하고 거리를 20피트 내려앉게 했다. 그런데 그 어마어마한 힘이 <b>빙하</b>에는 어떤 영향을 미쳤는가? 답은 <b>None</b>, 즉 <b>아무 영향도 없었다</b>는 것이다. 핵폭탄 2천 개급의 힘도 빙하를 어쩌지 못했으니, <b>인간이 빙하를 파괴하려는 시도는 헛수고</b>라는 뜻이 된다."}], "opts": [{"n": "①", "t": "It would be of no use to try to destroy glaciers.", "a": true, "x": false, "trap": false, "e": "핵폭탄 2천 개에 맞먹는 지진조차 빙하에 <b>아무 영향(None)</b>도 주지 못했다는 사례가 곧 '<b>파괴하려 해도 소용없다</b>'로 이어진다."}, {"n": "②", "t": "The melting glaciers would drive the rise of the sea level.", "a": false, "x": true, "trap": false, "e": "<b>해수면 상승</b>은 글에 아예 등장하지 않는다. 빙하 하면 떠오르는 배경지식으로 고르면 틀린다."}, {"n": "③", "t": "The Alaskan wilderness would not be harmed by glaciers.", "a": false, "x": true, "trap": false, "e": "황무지를 파괴한 것은 빙하가 아니라 <b>지진</b>이다. 주어와 목적어가 뒤바뀐 선지다."}, {"n": "④", "t": "Re-forming glaciers would not spread over North America.", "a": false, "x": true, "trap": true, "e": "2번 문장은 오히려 빙하가 다시 형성되면 <b>훨씬 더 빨리 커질 것</b>이라고 했다. 글과 정반대다."}, {"n": "⑤", "t": "The causes of glacier re-formation would not include quakes.", "a": false, "x": true, "trap": false, "e": "지진은 빙하 <b>재형성의 원인</b>으로 언급된 것이 아니라, <b>거대한 힘의 사례</b>로 제시되었을 뿐이다. 밑줄의 None은 '원인이 아니다'가 아니라 '<b>영향이 없었다</b>'는 뜻이다."}], "w": [["glacier", "빙하"], ["draw on", "~을 이용하다, ~에 의지하다"], ["fuel", "~에 연료를 공급하다, 채우다"], ["ice sheet", "대륙 빙하, 빙상"], ["advance", "전진하다, 진군하다"], ["blast", "폭파하다"], ["doubtless", "틀림없이"], ["might", "(강력한) 힘, 위력"], ["equivalent", "상당하는 것, 등가물"], ["slosh", "철벅거리며 튀어나오다"], ["devastate", "완전히 파괴하다"], ["be of no use", "아무 소용이 없다"]]}, {"q": "03", "type": "안내문 일치", "src": "2020년 7월 28번", "ans": "③", "tr": [["1", "세계 시민 축제"], ["2", "평화롭고 공정하며 지속 가능한 세상을 위해 목소리를 높이고 싶으신가요?"], ["3", "제5회 연례 세계 시민 축제는 지속 가능한 발전을 위한 2030 의제의 달성을 위해 시민 사회와 시민 행동을 지원하는 것을 목표로 합니다."], ["4", "언제 &amp; 어디서 — 2020년 9월 19일 토요일, 오후 1시부터 오후 8시까지 / City Plaza와 시청 강당"], ["5", "프로그램 — 평화와 정의 사진 전시회 / 인권에 관한 특별 강연(온라인 사전 등록 필요) / Global Youth Zone: 다양한 활동 무료"], ["6", "공지 — 시청 주차장은 행사 당일 교통 체증으로 인해 폐쇄됩니다. 편의를 위해 대중교통을 이용해 주세요."], ["7", "더 많은 정보를 원하시면 www.gcf2020.org를 방문해 주세요."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Special lectures on human rights (advance registration online required)"}, {"en": false, "h": "안내문 문항은 <b>본문을 읽고 선지를 고르는</b> 것이 아니라 <b>선지를 읽고 본문에서 찾는</b> 것이 정석이다. 다섯 선지의 <b>핵심 단어</b>에 먼저 동그라미를 치자 — ①<b>처음</b>, ②<b>오전</b>, ③<b>사전 등록</b>, ④<b>참가비</b>, ⑤<b>주차장 개방</b>. 그다음 안내문에서 그 단어가 있는 줄만 찾아 대조한다. Programs 항목의 <b>Special lectures on human rights (advance registration online required)</b>가 ③과 정확히 일치한다. <b>required</b>(필요한)라는 한 단어가 정답을 결정하므로, 안내문에서는 괄호 안이나 작은 글씨를 절대 건너뛰면 안 된다."}], "opts": [{"n": "①", "t": "올해 처음 열리는 행사이다.", "a": false, "x": true, "trap": false, "e": "<b>The 5th annual</b>, 즉 <b>제5회</b> 연례 행사다. 처음이 아니라 다섯 번째다."}, {"n": "②", "t": "토요일 오전부터 진행된다.", "a": false, "x": true, "trap": true, "e": "<b>Saturday</b>는 맞지만 시간이 <b>1:00 p.m. – 8:00 p.m.</b>, 즉 <b>오후</b>다. 요일만 보고 넘어가면 걸린다."}, {"n": "③", "t": "특별 강연은 온라인 사전 등록이 필요하다.", "a": true, "x": false, "trap": false, "e": "Programs의 <b>advance registration online required</b>와 그대로 일치한다."}, {"n": "④", "t": "Global Youth Zone에서 하는 활동은 참가비가 있다.", "a": false, "x": true, "trap": false, "e": "<b>Various activities for free</b>, 즉 <b>무료</b>다. for free를 놓치면 정반대로 읽게 된다."}, {"n": "⑤", "t": "행사 당일 시청 주차장이 개방된다.", "a": false, "x": true, "trap": false, "e": "Notice에 <b>The City Hall parking lot is closed</b>라고 되어 있다. 개방이 아니라 <b>폐쇄</b>다."}], "w": [["raise one's voice", "목소리를 높이다"], ["just", "공정한"], ["sustainable", "지속 가능한"], ["annual", "연례의, 해마다의"], ["aim to V", "~하는 것을 목표로 하다"], ["civil society", "시민 사회"], ["accomplishment", "달성, 성취"], ["agenda", "의제, 안건"], ["auditorium", "강당, 대강의실"], ["advance registration", "사전 등록"], ["for free", "무료로"], ["convenience", "편의, 편리"]]}, {"q": "04", "type": "글의 요지", "src": "2023학년도 6월 22번", "ans": "①", "tr": [["1", "흔히 간과되지만 꼭 그만큼 중요한 이해관계자가 바로 소비자인데, 소비자는 개인정보 역설이라는 개념에서 큰 역할을 한다."], ["2", "온갖 종류의 디지털 경험과 공동체에서 소비자의 참여 수준은 그야말로 폭발적으로 증가해 왔으며, 둔화될 기미는 거의 또는 전혀 보이지 않는다."], ["3", "소비자들은 자신의 개인정보가 이 회사들이 제공하는 풍부한 경험을 이끌어 내는 데 도움이 된다는 것뿐 아니라, 그 정보를 공유하는 것이 그 경험에 대해 전체적으로든 부분적으로든 치르는 대가라는 것도 인식하고 있다."], ["4", "데이터 수집과 이용의 무엇을, 언제, 왜에 대한 더 나은 이해가 없으면, 소비자는 흔히 취약하고 갈등을 겪는 느낌으로 남겨진다."], ["5", "“나는 내 휴대전화에 있는 이 식당 검색 앱을 아주 좋아하는데, 그 앱이 내 현재 위치를 사용해도 되냐고 물을 때 ‘확인’을 누르면 내 데이터는 어떻게 되는 걸까?”"], ["6", "자신에게 선택권을 줄 수 있는 도구로 무장할 때, 소비자는 수동적인 방관자에서 능동적인 참여자로 이동한다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "Armed with tools that can provide them options, the consumer moves from passive bystander to active participant."}, {"en": false, "h": "요지 문항은 <b>마지막 문장</b>이 결론인 경우가 압도적으로 많고, 이 글도 그렇다. 4번 문장에서 <b>Without a better understanding of the what, when, and why</b>라며 <b>이해가 없을 때</b> 소비자가 취약해진다고 하고, 6번 문장에서 그 반대 상황, 즉 <b>도구로 무장하면</b> 소비자가 <b>passive bystander</b>(수동적 방관자)에서 <b>active participant</b>(능동적 참여자)로 <b>이동한다</b>고 결론짓는다. 요지의 두 축은 <b>이해(understanding)</b>와 <b>주체성(active participant)</b>이다. 따라서 '<b>개인정보 제공의 속성을 심층적으로 이해하면 주체적 소비자가 된다</b>'는 ①이 정확히 대응한다. 나머지 선지는 모두 이 <b>인과 관계</b>가 빠져 있다."}], "opts": [{"n": "①", "t": "개인정보 제공의 속성을 심층적으로 이해하면 주체적 소비자가 된다.", "a": true, "x": false, "trap": false, "e": "4번 문장의 <b>Without a better understanding ~ vulnerable</b>과 6번 문장의 <b>moves from passive bystander to active participant</b>를 하나로 합친 선지다."}, {"n": "②", "t": "소비자는 디지털 시대에 유용한 앱을 적극 활용하는 자세가 필요하다.", "a": false, "x": true, "trap": false, "e": "5번 문장의 식당 검색 앱은 <b>불안을 보여 주는 예시</b>일 뿐, 앱을 <b>적극 활용하라</b>는 권유가 아니다."}, {"n": "③", "t": "현명한 소비자가 되려면 다양한 디지털 데이터를 활용해야 한다.", "a": false, "x": true, "trap": false, "e": "글에서 데이터를 활용하는 주체는 <b>기업</b>이지 소비자가 아니다. 소비자에게 필요한 것은 데이터 활용이 아니라 <b>이해</b>다."}, {"n": "④", "t": "기업의 디지털 서비스를 이용하면 상응하는 대가가 뒤따른다.", "a": false, "x": true, "trap": true, "e": "3번 문장의 <b>the price you pay</b>와 겹쳐 보이지만, 이는 소비자가 <b>이미 인식하고 있는 사실</b>일 뿐 글의 결론이 아니다. 결론은 그 인식이 <b>주체성으로 이어진다</b>는 데 있다."}, {"n": "⑤", "t": "타인과의 정보 공유로 인해 개인정보가 유출되기도 한다.", "a": false, "x": true, "trap": false, "e": "여기서 공유는 <b>타인</b>이 아니라 <b>기업</b>과의 공유이며, <b>유출(leak)</b>이라는 부정적 사건은 언급되지 않는다."}], "w": [["overlook", "간과하다, 못 보고 넘어가다 rue, "trap": false, "e": "information은 <b>유출되는</b> 대상이므로 수동 관계다. <b>information (that is) disclosed</b>에서 관계대명사와 be동사가 생략된 <b>과거분사 후치수식</b>으로 옳다."}, {"n": "④", "t": "much", "a": false, "x": true, "trap": false, "e": "뒤의 <b>more than</b>이라는 <b>비교급</b>을 강조하는 부사다. very는 비교급을 꾸미지 못하지만 much·far·even·still은 가능하므로 문제없다."}, {"n": "⑤", "t": "rests", "a": false, "x": true, "trap": false, "e": "<b>on which</b>가 이끄는 관계사절의 주어는 <b>the administration (of justice)</b>로 <b>단수</b>다. as a whole은 삽입구일 뿐이므로 단수 동사 rests가 옳다."}], "w": [["seek", "구하다, 찾다"], ["legal advice", "법률 조언"], ["assure A that", "A에게 ~을 보장하다"], ["obligation", "의무"], ["the latter", "후자"], ["disclose", "유출하다, 누설하다"], ["third party", "제3자"], ["confidentiality", "비밀 유지"], ["respect", "(의무를) 지키다, 준수하다"], ["authorities", "(주로 복수) 당국"], ["privilege", "특권"], ["rest on", "~에 기초를 두다"]]}, {"q": "06", "type": "문맥상 어휘", "src": "2024학년도 수능 30번", "ans": "④", "tr": [["1", "바자 경제는 공유된 문화라는 더 지속적인 관계 위에 자리 잡은, 겉보기에 유연한 가격 결정 메커니즘을 특징으로 한다."], ["2", "구매자와 판매자는 둘 다 서로의 제약을 알고 있다."], ["3", "델리의 바자에서 구매자와 판매자는 다른 행위자들이 일상생활에서 겪는 재정적 제약을 상당 부분 가늠할 수 있다."], ["4", "특정 경제 계층에 속한 각 행위자는 상대방이 무엇을 필수품으로 보고 무엇을 사치품으로 보는지를 이해한다."], ["5", "비디오 게임과 같은 전자 제품의 경우, 그것은 식료품 같은 다른 가정용 구매품과 동등한 수준의 필수품이 아니다."], ["6", "그래서 델리 바자의 판매자는 비디오 게임에 대해 매우 낮은(→ 높은) 가격을 직접적으로 요구하지 않도록 주의하는데, 구매자가 결코 그것의 소유를 절대적인 필수로 여기지 않을 것이기 때문이다."], ["7", "이런 종류의 지식에 대한 접근은 비슷한 문화적·경제적 세계에 속함으로써 생기는 서로의 선호와 한계를 이해함으로써 가격 합의를 형성한다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "So, the seller in Delhi's bazaars is careful not to directly ask for very low prices for video games because at no point will the buyer see possession of them as an absolute necessity."}, {"en": false, "h": "어휘 문항은 <b>because·so·but</b> 같은 <b>논리 연결어</b> 양쪽의 방향이 맞는지를 보면 대부분 풀린다. because 뒤를 보자. 구매자가 비디오 게임의 소유를 <b>결코 절대적 필수로 여기지 않는다</b>. 필수가 아닌 물건에 <b>비싼</b> 값을 부르면 손님은 그냥 가 버린다. 그러므로 판매자가 조심해야 할 것은 <b>낮은 가격</b>을 부르는 일이 아니라 <b>높은 가격</b>을 부르는 일이다. 따라서 ④ <b>low</b>는 <b>high</b>로 바뀌어야 한다. 참고로 <b>at no point</b>라는   let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
