<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}

 "08", "typ": "빈칸 추론", "src": "2024학년도 수능 34번", "evn": [1, 5, 6, 8], "ev_en": "Everyone who drives, walks, or swipes a transit card in a city views herself as a transportation expert from the moment she walks out the front door. / And like all politics, all transportation is local and intensely personal. / A transit project that could speed travel for tens of thousands of people can be stopped by objections to the loss of a few parking spaces or by the simple fear that the project won’t work. / Public debates about streets are typically rooted in emotional assumptions about how a change will affect a person’s commute, ability to park, belief about what is safe and what isn’t, or the bottom line of a local business.", "ev_ko": [[1, "도시에서 운전하거나 걷거나 또는 교통카드를 인식기에 대는 모든 사람들은 현관문을 나서는 순간부터 자신을 교통 전문가라고 여긴다."], [5, "그리고 모든 정치와 마찬가지로, 모든 교통은 지역적이며 매우 개인적이다."], [6, "수만 명의 사람들의 이동 속도를 높일 수 있는 교통 프로젝트는 몇몇의 주차 공간 손실에 대한 반대 또는 그 프로젝트가 효과가 없을 것이라는 단순한 두려움에 의해 중단될 수 있다."], [8, "거리에 대한 공개 토론은 일반적으로 변화가 한 개인의 통근, 주차 능력, 안전한 것과 그렇지 않은 것에 대한 믿음, 또는 지역 사업의 순익에 어떻게 영향을 미칠지에 대한 감정적 가정에 뿌리를 두고 있다."]], "why": ["(1)에서 도시에서 이동하는 모든 사람은 현관문을 나서는 순간부터 자신을 <b>교통 전문가<\/b>라고 여긴다고 합니다", "빈칸이 있는 (2)는 그런 사람이 거리를 보는 방식이 무엇과 관련되는지를 말합니다", "(5)에서 모든 교통은 <b>지역적이며 매우 개인적<\/b>이라고 합니다", "(6)에서는 많은 사람에게 도움이 될 교통 프로젝트도 주차 공간 몇 개를 잃는 데 대한 반대나 단순한 두려움 때문에 중단될 수 있다고 합니다", "(8)에서 거리에 대한 토론은 변화가 <b>내 통근, 내 주차, 안전에 대한 내 믿음, 지역 사업의 순익<\/b>에 어떤 영향을 줄지에 대한 감정적 가정에 뿌리를 둔다고 합니다", "즉 사람이 거리를 보는 방식은 그 사람 개인의 경험과 밀접하게 관련됩니다", "그래서 정답은 ④ <b>tracks pretty closely with how she gets around<\/b>(그 사람이 돌아다니는 방식과 매우 밀접하게 일치한다)입니다."], "ch": [{"n": "①", "t": "relies heavily on how others see her city’s streets", "g": "다른 사람들이 자신의 도시 거리를 보는 방식에 크게 의존한다", "ok": false, "e": ["글은 <b>다른 사람의 시선<\/b>이 아니라 각자의 통근, 주차, 안전에 대한 믿음 같은 <b>개인의 경험<\/b>이 거리를 보는 방식을 만든다고 말합니다(8번)."]}, {"n": "②", "t": "updates itself with each new public transit policy", "g": "각각의 새로운 대중교통 정책에 따라 스스로 업데이트된다", "ok": false, "e": ["새 교통 정책이 나올 때마다 거리를 보는 방식이 바뀐다는 내용은 없습니다", "오히려 (6)에서 교통 프로젝트가 개인의 반대나 두려움 때문에 중단될 수 있다고 합니다."]}, {"n": "③", "t": "arises independently of the streets she travels on", "g": "그 사람이 이동하는 거리와 관계없이 생겨난다", "ok": false, "e": ["<b>independently of<\/b>(~와 관계없이)는 글의 내용과 반대입니다", "글은 거리를 보는 방식이 자기가 다니는 길의 경험과 <b>밀접하다<\/b>고 말합니다(5번, 8번)."]}, {"n": "④", "t": "tracks pretty closely with how she gets around", "g": "그 사람이 돌아다니는 방식과 매우 밀접하게 일치한다", "ok": true, "e": ["(5)의 <b>local and intensely personal<\/b>(지역적이며 매우 개인적), (8)의 <b>commute<\/b>(통근), <b>ability to park<\/b>(주차 능력)가 모두 그 사람이 돌아다니는 방식과 이어집니다."]}, {"n": "⑤", "t": "ties firmly in with how her city operates", "g": "그 사람의 도시가 운영되는 방식과 확고하게 연관된다", "ok": false, "e": ["(4)의 주민 토론을 도시가 운영되는 방식으로 생각할 수도 있습니다", "하지만 글의 중심은 도시의 운영 방식이 아니라 <b>개인의 교통과 거리 경험<\/b>입니다", "글은 개인의 특성을 강조하는데, 도시의 운영 방식은 전체에 관한 개념이라 맞지 않습니다."]}], "tr": ["도시에서 운전하거나 걷거나 또는 교통카드를 인식기에 대는 모든 사람들은 현관문을 나서는 순간부터 자신을 교통 전문가라고 여긴다.", "그리고 그 사람이 거리를 보는 방식은 그 사람이 돌아다니는 방식과 매우 밀접하게 일치한다.", "그것이 우리가 선의와 시민 정신을 갖춘 아주 많은 시민들이 서로를 지나치며 언쟁하는 것을 발견하는 이유이다.", "학교 강당의 주민 회의에서, 그리고 도서관과 교회의 뒷방에서, 전국의 지역 주민들이 도시의 거리를 변화시킬 교통 제안에 대한 종종 논쟁적인 토론을 위해 모인다.", "그리고 모든 정치와 마찬가지로, 모든 교통은 지역적이며 매우 개인적이다.", "수만 명의 사람들의 이동 속도를 높일 수 있는 교통 프로젝트는 몇몇의 주차 공간 손실에 대한 반대 또는 그 프로젝트가 효과가 없을 것이라는 단순한 두려움에 의해 중단될 수 있다.", "이는 데이터나 교통 공학 또는 계획의 문제가 아니다.", "거리에 대한 공개 토론은 일반적으로 변화가 한 개인의 통근, 주차 능력, 안전한 것과 그렇지 않은 것에 대한 믿음, 또는 지역 사업의 순익에 어떻게 영향을 미칠지에 대한 감정적 가정에 뿌리를 두고 있다."], "ps": [{"n": 1, "ch": [{"e": "Everyone", "k": "모든 사람들은"}, {"e": "who drives, walks,", "k": "운전하거나 걷거나"}, {"e": "or <b>swipes<\/b> a transit card in a city", "k": "또는 도시에서 교통카드를 인식기에 대는"}, {"e": "<b>views herself as<\/b> a transportation expert", "k": "자신을 교통 전문가라고 여긴다"}, {"e": "from the moment", "k": "순간부터"}, {"e": "she walks out the front door.", "k": "그 사람이 현관문을 나서는."}], "link": "도시에서 운전하거나 걷거나 또는 교통카드를 인식기에 대는 모든 사람들은 현관문을 나서는 순간부터 자신을 교통 전문가라고 여긴다.", "easy": "도시에서 차를 몰든, 걷든, 교통카드를 찍든, 사람들은 집을 나서는 순간부터 자기가 교통 전문가라고 생각해요.", "gist": "글의 화제예요. 누구나 교통에 대해 자기 생각이 있어요."},  delaying", "g": "멸종 …… 지연시킴", "ok": false, "e": ["(1)에서 언어와 종교는 <b>급증한다<\/b>고 했으므로 멸종(extinction)은 반대입니다", "교류를 늦춘(delaying) 것이 아니라 아예 <b>중단했다<\/b>고 했습니다(5번)."]}, {"n": "③", "t": "extinction …… expanding", "g": "멸종 …… 확대함", "ok": false, "e": ["(A)도 (B)도 모두 반대입니다", "언어와 종교는 늘어났고, 교류는 확대된 것이 아니라 <b>끊겼습니다<\/b>(5번, 7번)."]}, {"n": "④", "t": "unification …… discouraging", "g": "통합 …… 못하게 함", "ok": false, "e": ["(B)는 맞지만 (A)가 틀렸습니다", "교류가 끊기면 언어와 종교는 통합되는 것이 아니라 <b>갈라진다<\/b>고 했습니다(7번)."]}, {"n": "⑤", "t": "diversification …… expanding", "g": "다양화 …… 확대함", "ok": false, "e": ["(A)는 맞지만 (B)가 틀렸습니다", "다양화를 낳은 것은 교류의 확대가 아니라 <b>교류의 단절<\/b>입니다(5번, 7번)."]}], "tr": ["왜 언어와 종교는 적도 주변에서 급증하며, 왜 그것의 빈도가 자민족 중심주의와 또한 관련이 있을까?", "이 질문들에 대한 답은 병원균의 밀도가 온대나 한랭 기후보다 열대 지방에서 훨씬 더 높다는 사실에 있다.", "여러분이 스웨덴에 살면 500마일 이내의 어떤 집단도 소수의 동일한 병원균에 노출되어 왔을 가능성이 크다.", "반면에 여러분이 콩고에 산다면 계곡 반대편에 있는 집단은 아마 여러분이 이전에 접촉한 적이 없는 병원균에 노출되었을지도 모른다.", "이러한 이유로, 열대 지방의 사람들은 그들이 다른 집단과 교류할 때 병에 잘 걸린다는 것을 알게 되었고, 그래서 그들은 교류를 하는 것을 중단했을 것이다.", "과학 이전의 세계에서는 자신의 병을 이웃 탓으로 돌리고 그 결과 이웃을 싫어하는 것이 논리적이었다.", "혐오와 두려움이 이웃을 계속 갈라놓았고, 일단 타인과 더는 교류하지 않게 되면 언어와 종교도 역시 자연스럽게 갈라지게 된다.", "[요약문] 적도 주변 지역에서 드러났던 것처럼, 높은 병원균 밀도는 사람들이 이웃 집단과 교류하지 못하게 함으로써(못하게 하여) 언어와 종교의 다양화를 초래할 수 있다."], "ps": [{"n": 1, "ch": [{"e": "Why would languages and religions", "k": "왜 언어와 종교는"}, {"e": "increase rapidly around the <b>equator<\/b>,", "k": "적도 주변에서 급증하며,"}, {"e": "and why is their <b>frequency<\/b>", "k": "그리고 왜 그것들<span class=\"r\">(= 언어와 종교)<\/span>의 빈도가"}, {"e": "also related to <b>ethnocentrism<\/b>?", "k": "또한 자민족 중심주의와 관련이 있을까?"}], "easy": "왜 적도 근처에서는 언어와 종교가 빠르게 늘어나고, 그 수가 왜 자기 민족만 중시하는 태도와도 관련이 있을까요?", "gist": "글을 여는 질문이에요. 답을 뒤에서 풀어 줘요."}, {"n": 2, "ch": [{"e": "The answer to these questions lies in the fact", "k": "이 질문들에 대한 답은 사실에 있다"}, {"e": "that <b>pathogen density<\/b> is much higher in the tropics", "k": "병원균의 밀도가 열대 지방에서 훨씬 더 높다는"}, {"e": "than it is in temperate and cold climates.", "k": "온대나 한랭 기후에서보다."}], "link": "이 질문들에 대한 답은 병원균의 밀도가 온대나 한랭 기후보다 열대 지방에서 훨씬 더 높다는 사실에 있다.", "easy": "답은 열대 지방에 병을 일으키는 균이 온대나 추운 지방보다 훨씬 많다는 데 있어요.", "gist": "질문에 대한 답의 출발점, 열대 지방의 높은 병원균 밀도예요."}, {"n": 3, "ch": [{"e": "When you live in Sweden,", "k": "여러분이 스웨덴에 살면,"}, {"e": "<b>chances are good<\/b> that any group within five hundred miles", "k": "500마일 이내의 어떤 집단도 ~했을 가능성이 크다"}, {"e": "has been <b>exposed to<\/b> the same few pathogens.", "k": "소수의 동일한 병원균에 노출되어 왔을."}], "link": "여러분이 스웨덴에 살면 500마일 이내의 어떤 집단도 소수의 동일한 병원균에 노출되어 왔을 가능성이 크다.", "easy": "스웨덴에 산다면, 500마일 안의 어느 집단이든 나와 같은 몇 안 되는 병원균을 겪어 왔을 가능성이 커요.", "gist": "추운 지방의 예예요. 이웃과 병원균이 비슷해요."}, {"n": 4, "ch": [{"e": "<b>In contrast<\/b>, when you live in the Congo,", "k": "반면에 여러분이 콩고에 산다면,"}, {"e": "the group on the other side of the valley", "k": "계곡 반대편에 있는 집단은"}, {"e": "<b>may well<\/b> have been exposed to a pathogen", "k": "아마 병원균에 노출되었을지도 모른다"}, {"e": "with which you’ve had no <b>prior<\/b> contact.", "k": "여러분이 이전에 접촉한 적이 없는."}], "link": "반면에 여러분이 콩고에 산다면 계곡 반대편에 있는 집단은 아마 여러분이 이전에 접촉한 적이 없는 병원균에 노출되었을지도 모른다.", "easy": "반대로 콩고에 산다면, 계곡 바로 건너편 집단만 해도 내가 한 번도 겪어 보지 못한 병원균을 이미 겪었을 수 있어요.", "gist": "열대 지방의 예예요. 가까운 이웃도 병원균이 달라요."}, {"n": 5, "ch": [{"e": "For this reason,", "k": "이러한 이유로,"}, {"e": "humans in the tropics learned", "k": "열대 지방의 사람들은 알게 되었다"}, {"e": "that when they interacted with other groups", "k": "그들이 다른 집단과 교류할 때"}, {"e": "they tended to get sick,", "k": "병에 잘 걸린다는 것을,"}, {"e": "so they would have stopped doing it.", "k": "그래서 그들은 그것<span class=\"r\">(= 다른 집단과 교류하는 것)<\/span>을 중단했을 것이다."}], "link": "이러한 이유로, 열대 지방의 사람들은 그들이 다른 집단과 교류할 때 병에 잘 걸린다는 것을 알게 되었고, 그래서 그들은 교류를 하는 것을 중단했을 것이다.", "easy": "그래서 열대 지방 사람들은 다른 집단과 어울리면 병에 걸린다는 걸 알게 되었고, 결국 어울리기를 그만두었을 거예요.", "gist": "열대 지방 사람들이 이웃과의 교류를 끊었다는 핵심 내용이에요."}, {"n": 6, "ch": [{"e": "In a pre-scientific world,", "k": "과학 이전의 세계에서는,"}, {"e": "it was logical", "k": "논리적이었다"}, {"e": "to <b>blame<\/b> their neighbors <b>for<\/b> their illness,", "k": "자신의 병을 이웃 탓으로 돌리고,"}, {"e": "and therefore to dislike them.", "k": "그 결과 그들<span class=\"r\">(= 이웃)<\/span>을 싫어하는 것이."}], "link": "과학 이전의 세계에서는 자신의 병을 이웃 탓으로 돌리고 그 결과 이웃을 싫어하는 것이 논리적이었다.", "easy": "과학이 없던 시절에는 내가 아픈 걸 이웃 탓으로 돌리고, 그래서 이웃을 싫어하는 게 당연했어요.", "gist": "이웃을 싫어하게 된 이유를 설명해요."}, {"n": 7, "ch": [{"e": "Dislike and fear kept neighbors apart,", "k": "혐오와 두려움이 이웃을 계속 갈라놓았고,"}, {"e": "and once you don’t interact with others anymore,", "k": "일단 타인과 더는 교류하지 않게 되면,"}, {"e": "your languages and religions", "k": "언어와 종교도"}, {"e": "naturally <b>divide<\/b> as well.", "k": "역시 자연스럽게 갈라지게 된다."}], "link": "혐오와 두려움이 이웃을 계속 갈라놓았고, 일단 타인과 더는 교류하지 않게 되면 언어와 종교도 역시 자연스럽게 갈라지게 된다.", "easy": "싫어하고 두려워하니 이웃끼리 멀어졌고, 서로 어울리지 않게 되면 언어와 종교도 저절로 갈라져요.", "gist": "결론이에요. 교류가 끊기면 언어와 종교가 갈라져 많아져요."}, {"n": 8, "ch": [{"e": "High pathogen density can <b>contribute to<\/b>", "k": "높은 병원균 밀도는 초래할 수 있다"}, {"e": "the <b>diversification<\/b> of languages and religions", "k": "언어와 종교의 다양화를 <span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}, {"e": "by <b>discouraging<\/b> people’s interactions", "k": "사람들의 교류를 못하게 함으로써 <span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}, {"e": "with their neighboring groups,", "k": "그들의 이웃 집단과의,"}, {"e": "as was shown in the regions around the equator.", "k": "적도 주변 지역에서 드러났던 것처럼."}], "link": "적도 주변 지역에서 드러났던 것처럼, 높은 병원균 밀도는 사람들이 이웃 집단과 교류하지 못하게 함으로써 언어와 종교의 다양화를 초래할 수 있다.", "easy": "적도 주변에서 보듯이, 병원균이 많으면 사람들이 이웃 집단과 어울리지 못하게 되고, 그 결과 언어와 종교가 여러 갈래로 나뉠 수 있어요.", "gist": "요약문이에요. (A) 다양화, (B) 못하게 함이 들어가요."}]}, {"no": "11", "typ": "장문 · 주제", "src": "2014학년도 6월 B형 41번", "evn": [6], "ev_en": "Certain animals and plants have a built-in sense of carrying capacity, so that instead of overshooting and having a die-off, they remain within the limits of their habitat’s ability to support them.", "ev_ko": [[6, "어떤 동물과 식물들은 수용력에 대한 내재된 감각을 가지고 있어서, (수용력을) 초과하여 급격한 자연 감소(집단 폐사)를 겪는 대신에, 그들을 지탱할 수 있는 서식지의 능력의 한계 내에서 (자신들의 개체 수를) 유지한다."]], "why": ["첫 단락은 수용력을 넘으면 많은 개체가 한꺼번에 죽는 <b>집단 폐사(die-off)<\/b>가 일어난다고 말합니다", "(6)에서 어떤 동물과 식물은 <b>수용력에 대한 내재된 감각<\/b>이 있어서, 수용력을 넘기는 대신 서식지가 지탱할 수 있는 <b>한계 안에 머문다<\/b>고 합니다", "호수 송어는 그 예입니다", "개체 밀도가 높으면 번식을 줄이고(7번), 개체들이 위협받으면 번식을 늘려(9번) 개체 수가 비슷한 수에서 안정됩니다(11번)", "즉 이 글은 자연이 스스로 개체 밀도를 조절하는 방식을 다룹니다", "그래서 정답은 ① <b>nature’s way of regulating population density<\/b>(개체 밀도를 조절하는 자연의 방법)입니다."], "ch": [{"n": "①", "t": "nature’s way of regulating population density", "g": "개체 밀도를 조절하는 자연의 방법", "ok": true, "e": ["(6)의 <b>a built-in sense of carrying capacity<\/b>(수용력에 대한 내재된 감각)와 (11)의 <b>level off at about the same number<\/b>(대략 비슷한 수에서 안정화된다)가 모두 자연이 개체 밀도를 조절한다는 내용입니다."]}, {"n": "②", "t": "the relationship between nutrition and reproduction", "g": "영양과 번식의 관계", "ok": false, "e": ["번식에 관한 내용은 나오지만, 영양과 번식의 관계를 다룬 글이 아닙니다", "글이 다루는 것은 <b>서식지의 수용력<\/b>과 번식의 관계라고 할 수 있습니다."]}, {"n": "③", "t": "the significance of habitat protection for local ecosystems", "g": "지역 생태계를 위한 서식지 보호의 중요성", "ok": false, "e": ["서식지의 수용력은 나오지만, 서식지를 보호해야 한다는 내용은 없습니다."]}, {"n": "④", "t": "the necessity of protecting the lake trout population", "g": "호수 송어 개체 수 보호의 필요성", "ok": false, "e": ["호수 송어는 (7)에서 <b>for instance<\/b>(예를 들면)로 나온 <b>예시<\/b>입니다", "송어를 보호해야 한다는 내용도 없으므로 글 전체의 주제로 알맞지 않습니다."]}, {"n": "⑤", "t": "how to preserve various habitats for lake trout", "g": "호수 송어를 위한 다양한 서식지를 보존하는 방법", "ok": false, "e": ["호수 송어는 예시일 뿐이고, 송어를 위한 서식지를 보존하는 방법은 나오지 않습니다."]}], "tr": ["수용력은 한 지역의 자원이 유지할 수 있는 개체의 수이다.", "서식지의 수용력을 초과하는 집단의 개체들은 위태로운 생활 여건 때문에 허약한 건강 상태를 갖게 되고 영양실조로 고통을 받을 수도 있다.", "이러한 일이 발생할 때, 가장 약한 개체들이 죽거나, 혹은 집단 전체가 그 이상의 환경적 스트레스나 질병에 더 취약해질 수 있다.", "때때로 서식지의 수용력을 초과한 결과로 집단 내의 많은 수의 개체들이 죽는다.", "이는 집단의 급격한 자연 감소(집단 폐사)라고 알려져 있다.", "어떤 동물과 식물들은 수용력에 대한 내재된 감각을 가지고 있어서, (수용력을) 초과하여 급격한 자연 감소(집단 폐사)를 겪는 대신에, 그들을 지탱할 수 있는 서식지의 능력의 한계 내에서 (자신들의 개체 수를) 유지한다.", "예를 들면, 호수 송어(송어의 일종)는 개체 밀도가 너무 급격하게 증가할 때 그만큼 왕성하게 번식하는 것을 멈춘다.", "비록 이것은 송어의 입장에서 심사숙고한 반응이라기보다는 다른 송어들로부터의 화학적 신호에 대한 개별적 반응의 결과이긴 하지만, 그 결과는 개체 수가 장기간에 걸쳐 일정하게 유지될 수 있다는 것이다.", "공격적인 낚시가 일어날 때와 같이 개체들이 위협받을 때, 송어는 5형식)다.", "sub": ["S: we (우리)", "V: find (find 알게 되다, 보게 되다)", "O: so many well-intentioned and civic-minded citizens (선의와 시민 정신을 갖춘 아주 많은 시민들). well-intentioned 선의의, civic-minded 시민 정신을 갖춘, citizen 시민", "C: arguing past one another (서로 엇갈려 언쟁하고 있는). <b>find + O + -ing</b> = O가 ~하고 있는 것을 보게 되다"]}, {"t": "함정: arguing은 시민들이 하는 동작을 나타내는 현재분사이고, 문장의 동사가 아니다. past one another (서로를 지나쳐)는 arguing을 꾸미는 전치사구다."}], "sum": "그래서 선의의 시민들이 서로 엇갈려 언쟁하는 모습을 보게 됨"}, {"i": "05", "q": "09", "s": "4", "title": "S+V+C(2형식) + such as 예시 + 관계부사절 병렬", "eng": "This seems true for deeper states of inactivity<sup>1</sup> such as hibernation<sup>2</sup> during the winter / when there are few food supplies, / and a high metabolic<sup>3</sup> cost to maintaining adequate<sup>4</sup> temperature.", "notes": [["1", "inactivity", "비활동, 무기력"], ["2", "hibernation", "겨울잠, 동면"], ["3", "metabolic", "신진대사의"], ["4", "adequate", "적절한, 충분한"]], "lit": "이것은 겨울 동안의 겨울잠 같은 더 깊은 비활동 상태에 대해서도 사실인 듯하다 / 식량 공급이 거의 없는 (그 겨울에), / 그리고 적절한 체온을 유지하는 데 높은 신진대사 비용이 드는 (그 겨울에).", "nat": "이것은 식량 공급이 거의 없고 적절한 체온을 유지하는 데 높은 신진대사 비용이 드는 겨울철의 겨울잠처럼, 더 깊은 비활동 상태에 대해서도 사실인 듯하다.", "ana": "<b>such as</b>는 '<b>예를 들어 ~같은</b>'이라는 <b>예시</b> 표현이므로 앞의 명사와 <b>붙여 읽는다</b>. 여기서 끊으면 오히려 뜻이 흩어진다. 승부처는 <b>when</b>이다. 시간을 나타내는 명사 <b>the winter</b> 뒤에 왔으므로 이 when은 접속사가 아니라 <b>관계부사</b>이며, '<b>~하는 (그 겨울)</b>'로 앞 명사를 꾸민다. 더 어려운 것은 마지막 <b>and</b>가 무엇과 무엇을 묶는가다. 얼핏 <b>few food supplies</b>와 <b>a high metabolic cost</b>가 나란히 보이지만, 하나는 '거의 없다'이고 하나는 '높다'라 뜻이 반대다. 실제로는 <b>there are few food supplies</b>와 <b>there is a high metabolic cost</b> 두 개가 묶이면서 뒤쪽의 <b>there is</b>가 생략된 것이다. <b>to maintaining</b>의 to는 to부정사가 아니라 <b>전치사</b>이므로 뒤에 동명사가 왔다.", "pe": "This seems true \u0001for deeper states of inactivity<sup>1</sup> such as hibernation<sup>2</sup> during the winter\u0002 / \u0001when there are few food supplies\u0002, / \u0001and a high metabolic<sup>3</sup> cost to maintaining adequate<sup>4</sup> temperature\u0002.", "pk": "이것은 \u0001겨울 동안의 겨울잠 같은\u00 원균에 이미 노출되었을 가능성이 크다.", "ana": "<b>may well</b>은 '<b>~해도 좋다</b>'가 아니라 '<b>아마 ~일 것이다</b>'라는 <b>강한 추측</b>이다. 여기에 <b>have been exposed</b>가 붙어 <b>may well have p.p.</b> 형태가 되면 '<b>이미 ~했을 가능성이 크다</b>'라는 <b>과거에 대한 추측</b>이 된다. 조동사 뒤의 <b>have p.p.</b>는 언제나 <b>시점을 한 칸 뒤로 밀어 준다</b>고 기억하자. 뒤의 <b>with which</b>는 <b>전치사 + 관계대명사</b>다. 원래 문장은 <b>you've had no prior contact with the pathogen</b>이었고, 전치사 with가 which를 데리고 앞으로 나왔다. 그래서 which 뒤가 <b>완전한 문장</b>인 것이다. <b>have contact with</b>가 하나의 덩어리라는 것을 모르면 with가 왜 앞에 나왔는지 설명할 수 없다. <b>chances are good that ~</b>(가능성이 크다)이 쓰인 앞 문장과 짝을 이루어, 스웨덴과 콩고를 <b>대조</b>하는 자리다.", "pe": "\u0001In contrast\u0002, \u0001when you live in the Congo\u0002, / the group \u0001on the other side of the valley<sup>1</sup>\u0002 may \u0001well<sup>2</sup>\u0002 have been exposed \u0001to<sup>3</sup> a pathogen<sup>4</sup>\u0002 / \u0001with which you've had no prior<sup>5</sup> contact\u0002.", "pk": "\u0001대조적으로\u0002, \u0001여러분이 콩고에 산다면\u0002, / \u0001계곡 반대편에 있는\u0002 집단은 아마 어떤 병원균에 노출되었을 것이다 / \u0001여러분이 이전에 접촉한 적이 없는\u0002 (그 병원균에).", "core": "집단은 노출되었을 것이다.", "tags": ["(In contrast) = 부사구: 문장 전체를 꾸밈, (when you live in the Congo) = 부사절(조건): 주절 전체를 꾸밈", "주어 the group + 동사 may have been exposed. (on the other side …) = 형용사구: group, (well) = 부사, (to a pathogen) = 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "(with which …) = 관계절(형용사절): a pathogen을 꾸밈. with which = 그 병원균과"], "steps": [{"t": "이 문장은 <b>부사 덩어리 + 수동태 S+V(1형식)</b>이다. 뒤에 관계절이 붙어 길어 보인다."}, {"t": "문장 앞의 <b>In contrast</b> (대조적으로)와 <b>when you live in the Congo</b> (콩고에 산다면)는 문장 전체를 꾸미는 부사구와 부사절이다. 빼고 읽는다."}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: the group (집단). on the other side of the valley (계곡 반대편의)는 group을 꾸미는 전치사구. valley 계곡", "V: may well have been exposed (expose 노출시키다의 p.p., 수동태 현재완료. may well 아마 ~일 가능성이 크다). (문형 기준) 수동태 주절 = 1형식", "to a pathogen (병원균에) = 전치사구. pathogen 병원균, be exposed to ~에 노출되다", "뼈대 = <b>the group may well have been exposed</b>"]}, {"t": "<b>with which you've had no prior contact</b>는 pathog 나올 때까지 기다림. (in a population) = 전치사구(형용사구): Individuals를 꾸밈", "(that has exceeded …) = 관계절(형용사절): population을 꾸밈. <b>has exceeded</b> 현재완료", "동사 may have + 목적어 health 및 suffer(병렬). (poor) = 형용사: health, (from malnutrition) = 거의 필수에 가까운 부사구(suffer from) [기준: 모양 규칙]", "(because of …) = 전치사구(부사구: 이유): 앞 서술 전체를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>과 <b>S+V(1형식)</b>이 병렬된 문장이다. 주어가 길어 동사가 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Individuals (개체들). in a population (개체군 안의)는 전치사구", "V1: may have (have 가지다 + may ~일 수 있다)", "O1: poor health (나쁜 건강)", "V2: (may) suffer (suffer from ~으로 고통받다). and로 병렬", "from malnutrition (영양실조로) = 전치사구. suffer from은 거의 필수에 가까운 부사구라서 수식어로 둠. malnutrition 영양실조", "뼈대 = <b>Individuals may have poor health and suffer</b>"]}, {"t": "주어 뒤 <b>that has exceeded the carrying capacity of its habitat</b>는 population을 꾸미는 관계절이다.", "sub": ["S: that (= a population), V: has exceeded (exceed 초과하다의 현재완료)", "O: the carrying capacity of its habitat (그 서식지의 수용력). carrying capacity 수용력, habitat 서식지"]}, {"t": "<b>because of the compromised living conditions</b> (위태로워진 생활 여건 때문에)는 이유를 나타내는 전치사구(부사구)다. compromised는 compromise (위태롭게 하다)의 p.p.로 conditions를 꾸미는 형용사다."}], "sum": "수용력을 넘은 개체군의 개체들, 나빠진 여건 때문에 건강이 나쁘고 영양실조 가능"}, {"i": "08", "q": "11", "s": "9", "title": "S+V 동사 병렬 + when절 + such as when절", "eng": "The trout<sup>1</sup> will produce more offspring<sup>2</sup> and mature<sup>3</sup> to a reproductive<sup>4</sup> size at a faster rate / when populations are threatened, / such as when aggressive fishing takes place<sup>5</sup>.", "notes": [["1", "trout", "송어"], ["2", "offspring", "새끼, 자손"], ["3", "mature", "성숙해지다, 다 자라다"], ["4", "reproductive", "번식의, 생식의"], ["5", "take place", "일어나다, 벌어지다"]], "lit": "송어는 더 많은 새끼를 낳고 더 빠른 속도로 번식 가능한 크기까지 성숙할 것이다 / 개체군이 위협받을 때, / 예를 들어 공격적인 낚시가 일어날 때처럼.", "nat": "송어는 공격적인 낚시가 벌어질 때처럼 개체군이 위협받을 때면 더 많은 새끼를 낳고 더 빠르게 번식 가능한 크기까지 자란다.", "ana": "동사가 <b>will produce</b>와 <b>(will) mature</b> 두 개이고, 반복되는 조동사 will이 생략된 <b>병렬</b>이다. 여기서 <b>mature</b>는 형용사 '성숙한'이 아니라 '<b>성숙해지다, 다 자라다</b>'라는 <b>동사</b>다. and 앞뒤에 놓인 단어의 <b>품사를 맞춰 보는 것</b>이 병렬을 확인하는 가장 확실한 방법이다. 뒤의 <b>when populations are threatened</b>는 <b>시간의 부사절</b>이고, 그 뒤 <b>such as when ~</b>은 그 시간을 구체적인 예로 다시 들어 주는 자리다. <b>such as</b> 뒤에 명사가 아니라 <b>when절</b>이 통째로 온 형태이므로, '<b>예컨대 ~할 때처럼</b>'으로 읽는다. <b>take place</b>는 '<b>일어나다, 벌어지다</b>'라는 뜻으로, 수동태로 쓰지 않는다는 점이 자주 출제된다.", "pe": "The trout<sup>1</sup> will produce more offspring<sup>2</sup> and mature<sup>3</sup> \u0001to a reproductive<sup>4</sup> size\u0002 \u0001at a faster rate\u0002 / \u0001when populations are threatened\u0002, / \u0001such as when aggressive fishing takes place<sup>5</sup>\u0002.", "pk": "송어는 더 많은 새끼를 낳고 \u0001더 빠른 속도로\u0002 번식 가능한 크기까지 성숙할 것이다 / \u0001개체군이 위협받을 때\u0002, / \u0001예를 들어 공격적인 낚시가 일어날 때처럼\u0002.", "core": "송어는 더 많은 새끼를 낳고 성숙할 것이다.", "tags": ["주어 trout + 동사 will produce + 목적어 offspring, and mature(1형식). (to a reproductive size) = 거의 필수에 가까운 부사구 [기준: 모양 규칙]. (at a faster rate) = 부사구", "(when populations are threatened) = 부사절(시간): 앞 서술 전체를 꾸밈", "(such as when …) = 부사절(예시): 앞 when절을 구체화"], "steps": [{"t": "이 문장은 <b>S+V 동사 병렬</b> 뒤에 when절 두 개가 붙은 문장이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The trout (송어)", "V1: will produce (produce 낳다, 생산하다), O1: more offspring (더 많은 새끼). offspring 새끼", "V2: (will) mature (mature 성숙하다, 다 자라다). and로 병렬", "to a reproductive size (번식 가능한 크기까지) = 전치사구. reproductive 번식의", "at a faster rate (더 빠른 속도로) = 전치사구", "뼈대 = <b>The trout will produce more offspring and mature</b>"]}, {"t": "<b>when populations are threatened</b>는 시간 부사절이다. '개체군이 위협받을 때'라는 뜻이다. threaten (위협하다)의 수동태."}, {"t": "<b>such as when aggressive fishing takes place</b>는 앞 when절의 예시를 드는 부사절이다. '공격적인 낚시가 벌어질 때처럼'이라는 뜻이다.", "sub": ["S: aggressive fishing (공격적인 낚시), V: takes place (take place 일어나다)"]}], "sum": "송어, 개체군이 위협받으면 더 많은 새끼를 낳고 더 빨리 번식 가능한 크기로 성장"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2017학년도 6월 31번", "ans": "⑤", "tr": [["1", "일단 손이나 집게가 뻗기를 통해 어떤 물체로 향하게 되면, 그것(물체)은 붙잡힐 수 있다."], ["2", "붙잡기는 손가락이 물체를 안전하게 쥐고 있을 것을 요구한다."], ["3", "안전한 붙잡기란 특히 외부의 힘에 의해 밀려날 때에도 물체가 미끄러지거나 움직이지 않는 그런 상태를 말한다."], ["4", "예를 들어 망치를 붙잡고 있는 것은, 무언가에 부딪히는 일이 당신으로 하여금 그것을 떨어뜨리게 만든다면 안전한 것이 아닐 것이다."], ["5", "단단히 붙잡기 위한 한 가지 전제 조건은, 손가락이 가하는 힘들이 물체의 위치를 흐트러뜨리지 않도록 서로 균형을 이루는 것이다."], ["6", "기하학적 형태와 질량 분포 같은 물체의 특성은, 안정성을 유지하기 위해 어떤 손가락이 다른 손가락보다 더 큰 힘을 가할 것을 요구할 수도 있다."], ["7", "붙잡는 힘과 지탱하는 힘은 또한 물체의 전체 질량과 부서지기 쉬운 정도에 맞아야 한다."], ["8", "달걀은 돌보다 더 섬세한 접촉을 요구한다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "One precondition of a firm grasp is that the forces applied by the fingers balance each other so as not to disturb the object's position."}, {"en": false, "h": "빈칸 문항은 <b>빈칸 문장과 같은 말을 다른 표현으로 한 문장</b>을 찾는 것이 정석이다. 여기서는 5번 문장이 그 자리다. <b>balance each other so as not to disturb the object's position</b>(물체의 위치가 흐트러지지 않도록 힘이 서로 균형을 이룬다)이 곧 <b>안정성(stability)</b>의 정의다. 3번 문장의 <b>the object won't slip or move</b>도 같은 말을 미리 해 두었다. 빈칸 문장 자체도 힌트를 준다. <b>some fingers apply greater force than others</b>, 즉 힘의 크기를 서로 다르게 주는 이유는 <b>움직이지 않게 하기 위해서</b>이지 빠르게 움직이거나 방향을 바꾸기 위해서가 아니다. 이 글에는 <b>속도·효율·이동</b>에 관한 논의가 처음부터 끝까지 없다는 점도 결정적이다."}], "opts": [{"n": "①", "t": "distance (거리)", "a": false, "x": true, "trap": false, "e": "손가락 사이의 거리나 물체까지의 거리를 조절한다는 내용은 어디에도 없다. 글이 다루는 것은 <b>힘의 균형</b>이다."}, {"n": "②", "t": "efficiency (효율성)", "a": false, "x": true, "trap": false, "e": "'힘을 아낀다·에너지를 덜 쓴다' 같은 말이 나왔다면 가능하지만, 본문은 오히려 <b>어떤 손가락은 더 큰 힘을 쓴다</b>고 말한다. 효율과는 무관하다."}, {"n": "③", "t": "mobility (이동성)", "a": false, "x": true, "trap": false, "e": "3번 문장은 물체가 <b>움직이지 않아야</b> 한다고 못 박았다. 이동성은 글의 취지와 정반대다."}, {"n": "④", "t": "direction (방향)", "a": false, "x": true, "trap": true, "e": "1번 문장에 <b>directed to an object</b>가 나와서 끌리지만, 그것은 <b>손이 물체로 향하는 단계</b>를 말한 것이고 빈칸이 있는 문장은 이미 붙잡은 뒤의 이야기다."}, {"n": "⑤", "t": "stability (안정성)", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>balance each other so as not to disturb the object's position</b>과 3번 문장의 <b>won't slip or move</b>가 모두 안정성을 가리킨다."}], "w": [["gripper", "집게, 그리퍼"], ["direct A to B", "A를 B로 향하게 하다"], ["grasp", "붙잡다; 붙잡기"], ["securely", "안전하게, 단단히"], ["secure", "안전한, 단단한"], ["grip", "붙잡기, 움켜쥠"], ["slip", "미끄러지다"], ["displace", "(원래 위치에서) 옮기다, 밀어내다"], ["external", "외부의"], ["precondition", "전제 조건"], ["apply", "(힘을) 가하다"], ["so as not to V", "~하지 않도록"], ["disturb", "방해하다, 흐트러뜨리다"], ["geometric configuration", "기하학적 형태"], ["mass distribution", "질량 분포"], ["fragility", "부서지기 쉬움"], ["delicate", "섬세한, 조심스러운"], ["stability", "안정성"]]}, {"q": "08", "type": "빈칸 추론", "src": "2024학년도 수능 34번", "ans": "④", "tr": [["1", "도시에서 운전하거나 걷거나 교통카드를 인식기에 대는 모든 사람은 현관문을 나서는 순간부터 자신을 교통 전문가라고 여긴다."], ["2", "그리고 그 사람이 거리를 보는 방식은 그 사람이 돌아다니는 방식과 매우 밀접하게 일치한다."], ["3", "그것이 우리가 선의와 시민 정신을 갖춘 아주 많은 시민들이 서로를 지나쳐 언쟁하는 것을 보게 되는 이유이다."], ["4", "학교 강당에서 열리는 지역 주민 회의에서, 그리고 도서관과 교회의 뒷방에서, 전국의 지역 주민들은 도시의 거리를 바꿔 놓을 교통 제안에 대해 종종 논쟁적인 토론을 하려고 모인다."], ["5", "그리고 모든 정치가 그렇듯, 모든 교통은 지역적이며 매우 개인적이다."], ["6", "수만 명의 이동 속도를 높일 수 있는 대중교통 프로젝트가 주차 공간 몇 개를 잃는다는 반대나, 그 프로젝트가 효과가 없을 것이라는 단순한 두려움 때문에 중단될 수 있다."], ["7", "그것은 데이터나 교통 공학, 계획의 문제가 아니다."], ["8", "거리에 대한 공개 토론은 대체로 어떤 변화가 개인의 통근, 주차 능력, 무엇이 안전하고 무엇이 안전하지 않은지에 대한 믿음, 또는 지역 사업체의 순익에 어떤 영향을 미칠지에 관한 감정적인 가정에 뿌리를 두고 있다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "And like all politics, all transportation is local and intensely personal."}, {"en": false, "h": "빈칸 문장은 <b>거리를 보는 방식(how she views the street)</b>이 무엇과 연결되는지를 묻는다. 답을 정하는 문장은 5번이다. <b>all transportation is local and intensely personal</b>, 즉 교통에 대한 판단은 <b>내가 사는 곳과 내가 겪는 것</b>에서 나온다는 뜻이다. 8번 문장이 이를 구체화한다. 사람들이 감정적으로 따지는 항목은 전부 <b>내 통근, 내 주차, 내 안전, 내 가게 매출</b>이다. 1번 문장의 <b>from the moment she walks out the front door</b>도 같은 방향이다. 자기 문 앞을 나서는 순간, 즉 <b>자기가 실제로 다니는 경험</b>이 관점을 만든다. 따라서 거리를 보는 방식은 <b>그 사람이 돌아다니는 방식</b>과 밀접하게 맞물린다."}], "opts": [{"n": "①", "t": "relies heavily on how others see her city's streets (다른 사람들이 자신의 도시 거리를 보는 방식에 크게 의존한다)", "a": false, "x": true, "trap": false, "e": "글은 <b>남의 시선</b>이 아니라 <b>자기 경험</b>이 관점을 만든다고 말한다. 3번 문장의 <b>arguing past one another</b>는 서로 의견이 어긋난다는 뜻이지 남을 따른다는 뜻이 아니다."}, {"n": "②", "t": "updates itself with each new public transit policy (새로운 대중교통 정책에 따라 자체적으로 갱신된다)", "a": false, "x": true, "trap": false, "e": "정책이 관점을 바꾼다는 내용은 없다. 오히려 6번 문장은 <b>개인의 감정이 정책을 막는다</b>고 말한다. 인과의 방향이 반대다."}, {"n": "③", "t": "arises independently of the streets she travels on (그 사람이 다니는 거리와 무관하게 생겨난다)", "a": false, "x": true, "trap": false, "e": "<b>independently of</b>(~와 무관하게)라는 표현 하나로 글의 취지와 정반대가 된다. 글은 다니는 거리와 <b>밀접하다</b>고 말한다."}, {"n": "④", "t": "tracks pretty closely with how she gets around (그 사람이 돌아다니는 방식과 매우 밀접하게 일치한다)", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>local and intensely personal</b>, 8번 문장의 <b>commute·ability to park</b> 목록과 정확히 맞물린다. <b>track with</b>는 '~와 나란히 움직이다, 일치하다'라는 뜻이다."}, {"n": "⑤", "t": "ties firmly in with how her city operates (그 사람의 도시가 운영되는 방식과 굳게 연결된다)", "a": false, "x": true, "trap": true, "e": "글의 초점은 도시의 <b>운영 방식</b>이라는 전체적 개념이 아니라 <b>개인의 통근 경험</b>이다. 본문 단어를 그럴듯하게 조합해 놓아 가장 헷갈리는 선지다."}], "w": [["swipe", "(판독기에) 통과시키다, 대다"], ["transit card", "교통카드"], ["view A as B", "A를 B라고 여기다"], ["track with", "~와 일치하다, 나란히 가다"], ["get around", "돌아다니다"], ["well-intentioned", "선의의"], ["civic-minded", "시민 정신을 갖춘"], ["argue past one another", "서로 지나쳐 언쟁하다"], ["auditorium", "강당, 객석"], ["back room", "뒷방, 밀실"], ["contentious", "논쟁적인"], ["intensely", "매우, 극도로"], ["objection", "반대, 이의"], ["traffic engineering", "교통 공학"], ["be rooted in", "~에 뿌리를 두다"], ["assumption", "가정, 추정"], ["commute", "통근 (거리)"], ["bottom line", "순익, 핵심"]]}, {"q": "09", "type": "문장 삽입", "src": "2022학년도 6월 39번", "ans": "⑤", "tr": [["1", "[주어진 문장] 이것은 잠의 한 가지 측면이 환경에 대한 반응성이 줄어드는 것이기 때문에 특히 그러하다."], ["2", "진화에서 잠이 하는 역할은 여전히 연구 중이다."], ["3", "한 가지 가능성은, 그것(잠)이 동물에게 더 이상 긴급한 활동이 없을 때 신진대사가 줄어든 유리한 적응 상태라는 것이다."], ["4", "이것은 식량 공급이 거의 없고 적절한 체온을 유지하는 데 높은 신진대사 비용이 드는 겨울철의 겨울잠 같은, 더 깊은 비활동 상태에 대해서도 사실인 듯하다."], ["5", "그것은 일상적인 상황에서도, 예를 들어 먹잇감이 되는 종이 어두워진 뒤 포식자를 피하는 경우에도 사실일 수 있다."], ["6", "다른 한편으로, 잠의 분명한 보편성, 그리고 고래류 같은 포유동물이 한 번에 적어도 뇌의 한쪽에서 잠을 유지하기 위해 매우 고도로 복잡한 기제를 발달시켰다는 관찰은, 잠이 생명체에게 추가로 어떤 필수적인 도움을 준다는 것을 시사한다."], ["7", "이러한 잠재적인 비용이 치러져야 할 때조차 잠이 보편적이라면, 그 의미는 잠이 조용히 깨어 있는 채로 쉬는 것만으로는 얻을 수 없는 중요한 기능을 갖고 있다는 것일 수 있다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "On the other hand, the apparent universality of sleep, and the observation that mammals such as cetaceans have developed such highly complex mechanisms to preserve sleep on at least one side of the brain at a time, suggests that sleep additionally provides some vital service(s) for the organism."}, {"en": false, "h": "삽입 문항은 <b>주어진 문장의 지시어</b>부터 잡는다. 여기서는 <b>This</b>와 <b>particularly true</b>다. This가 받을 수 있는 것은 앞에 나온 <b>어떤 주장</b>이어야 하고, <b>이 잠재적인 비용(this potential price)</b>이라는 표현이 7번 문장에 나오므로 주어진 문장은 <b>비용을 언급한 뒤</b>에 와야 한다. 주어진 문장이 말하는 <b>환경에 대한 반응성 저하</b>가 바로 잠이 치르는 <b>대가</b>이기 때문이다. 6번 문장은 잠이 위험을 무릅쓰고도 보편적이라는 관찰을 내놓고, 7번 문장은 <b>this potential price</b>라고 그 대가를 이미 아는 듯이 받는다. 그 사이가 비어 있다. 따라서 주어진 문장은 <b>6번과 7번 사이</b>, 즉 ⑤ 자리에 들어간다."}], "opts": [{"n": "①", "t": "", "a": false, "x": true, "trap": false, "e": "② 앞자리다. 2번 문장은 '연구 중이다'라는 도입일 뿐 <b>This</b>가 받을 주장이 아직 나오지 않았다."}, {"n": "②", "t": "", "a": false, "x": true, "trap": false, "e": "3번 문장은 잠이 <b>유리한</b> 상태라는 내용이다. 주어진 문장은 잠의 <b>불리한 측면(반응성 저하)</b>을 말하므로 흐름이 어긋난다."}, {"n": "③", "t": "", "a": false, "x": true, "trap": false, "e": "4번 문장은 겨울잠이라는 <b>예시</b>다. 예시 앞에 대가 이야기가 끼어들면 예시와 연결이 끊긴다."}, {"n": "④", "t": "", "a": false, "x": true, "trap": true, "e": "5번 문장의 <b>avoid predators after dark</b> 때문에 위험 이야기로 이어질 것 같지만, 그 문장은 잠이 <b>유리하다</b>는 예를 계속 드는 중이다. 반전은 6번 문장의 <b>On the other hand</b>에서 비로소 일어난다."}, {"n": "⑤", "t": "", "a": true, "x": false, "trap": false, "e": "6번 문장이 '위험을 무릅쓰고도 잠은 보편적'이라는 관찰을 내놓고, 7번 문장이 <b>this potential price</b>로 그 대가를 받는다. 그 대가가 무엇인지 설명하는 주어진 문장이 정확히 그 사이에 들어간다."}], "w": [["responsiveness", "대응, 반응성"], ["under study", "연구 중인"], ["advantageous", "유리한, 이로운"], ["adaptive", "적응의, 적응할 수 있는"], ["metabolism", "신진대사"], ["pressing", "긴급한, 절박한"], ["inactivity", "비활동, 무기력"], ["hibernation", "겨울잠, 동면"], ["metabolic", "신진대사의"], ["adequate", "적절한, 충분한"], ["prey species", "먹잇감이 되는 종"], ["predator", "포식자"], ["apparent", "분명한, 겉보기의"], ["universality", "보편성"], ["cetacean", "고래류의 동물"], ["preserve", "유지하다, 보존하다"], ["vital", "(생명 유지에) 필수적인"], ["organism", "생명체, 유기체"], ["implication", "의미, 함축"], ["wakeful", "깨어 있는, 각성의"]]}, {"q": "10", "type": "요약문 완성", "src": "2022년 3월 40번", "ans": "①", "tr": [["1", "왜 언어와 종교는 적도 주변에서 급격히 늘어나며, 왜 그것들의 빈도는 또한 자민족 중심주의와 관련이 있을까?"], ["2", "이 질문들에 대한 답은 병원균 밀도가 온대 및 한랭 기후보다 열대 지방에서 훨씬 더 높다는 사실에 있다."], ["3", "여러분이 스웨덴에 산다면, 500마일 이내의 어떤 집단이든 똑같은 몇 안 되는 병원균에 노출되었을 가능성이 크다."], ["4", "반대로 콩고에 산다면, 계곡 반대편의 집단은 여러분이 이전에 한 번도 접촉해 본 적 없는 병원균에 이미 노출되었을 가능성이 크다."], ["5", "이런 이유로, 열대 지방의 사람들은 다른 집단과 교류할 때 병에 걸리는 경향이 있다는 것을 알게 되었고, 그래서 그렇게 하는 것을 그만두었을 것이다."], ["6", "과학 이전의 세계에서, 자신의 병을 이웃 탓으로 돌리고 그리하여 이웃을 싫어하는 것은 논리적이었다."], ["7", "싫어함과 두려움이 이웃을 갈라놓았고, 일단 다른 사람들과 더 이상 교류하지 않게 되면 언어와 종교도 자연스럽게 갈라지게 된다."], ["8", "[요약문] 적도 주변 지역에서 드러났듯이, 높은 병원균 밀도는 사람들이 이웃 집단과 교류하지 못하게 함으로써 언어와 종교의 다양화를 초래할 수 있다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "Dislike and fear kept neighbors apart, and once you don't interact with others anymore, your languages and religions naturally divide as well."}, {"en": false, "h": "요약문 문항은 <b>요약문의 뼈대</b>부터 본다. 여기서는 <b>High pathogen density → (A) of languages and religions → by (B) people's interactions</b>이다. 즉 (A)에는 <b>결과</b>가, (B)에는 <b>수단</b>이 들어간다. (B)부터 잡는 것이 쉽다. 5번 문장의 <b>they would have stopped doing it</b>(교류를 그만두었다)과 7번 문장의 <b>kept neighbors apart</b>, <b>once you don't interact with others anymore</b>가 모두 교류를 <b>막는</b> 방향이므로 <b>discouraging</b>이다. 그 결과로 7번 문장이 <b>your languages and religions naturally divide</b>라고 못 박으므로, (A)는 갈라짐, 즉 <b>diversification</b>(다양화)이다. 1번 문장의 <b>increase rapidly</b>(급격히 늘어난다)도 같은 방향을 가리킨다. 언어와 종교가 <b>사라지는</b> 것이 아니라 <b>많아진다</b>는 점을 놓치면 안 된다."}], "opts": [{"n": "①", "t": "(A) diversification (다양화) …… (B) discouraging (못하게 함)", "a": true, "x": false, "trap": false, "e": "7번 문장의 <b>divide</b>가 (A)를, <b>kept neighbors apart</b>와 <b>don't interact</b>가 (B)를 그대로 뒷받침한다."}, {"n": "②", "t": "(A) extinction (멸종) …… (B) delaying (지연시킴)", "a": false, "x": true, "trap": false, "e": "언어와 종교는 <b>사라지는</b> 것이 아니라 1번 문장대로 <b>급격히 늘어난다</b>. 방향이 정반대다."}, {"n": "③", "t": "(A) extinction (멸종) …… (B) expanding (확대함)", "a": false, "x": true, "trap": false, "e": "(A)도 (B)도 모두 반대다. 교류는 확대된 것이 아니라 <b>끊겼다</b>."}, {"n": "④", "t": "(A) unification (통합) …… (B) discouraging (못하게 함)", "a": false, "x": true, "trap": true, "e": "(B)는 맞지만 (A)가 틀렸다. 교류가 끊기면 언어와 종교는 통합되는 것이 아니라 <b>갈라진다</b>."}, {"n": "⑤", "t": "(A) diversification (다양화) …… (B) expanding (확대함)", "a": false, "x": true, "trap": false, "e": "(A)는 맞지만 (B)가 틀렸다. 다양화를 낳은 것은 교류의 확대가 아니라 <b>교류의 단절</b>이다."}], "w": [["equator", "적도"], ["frequency", "빈도"], ["ethnocentrism", "자민족 중심주의"], ["lie in", "~에 있다"], ["pathogen", "병원균, 병원체"], ["density", "밀도"], ["the tropics", "열대 지방"], ["temperate climate", "온대 기후"], ["chances are good that", "~일 가능성이 크다"], ["be exposed to", "~에 노출되다"], ["in contrast", "대조적으로, 반대로"], ["may well V", "아마 ~일 것이다"], ["prior", "이전의, 앞선"], ["pre-scientific", "과학 이전의"], ["logical", "논리적인, 타당한"], ["blame A for B", "B를 A의 탓으로 돌리다"], ["keep A apart", "A를 갈라놓다"], ["divide", "갈라지다, 나뉘다"], ["contribute to", "~을 초래하다, ~에 기여하다"], ["diversification", "다양화"]]}, {"q": "11", "type": "장문 · 주제", "src": "2014학년도 6월 B형 41번", "ans": "①", "tr": [["1", "수용력이란 그 지역의 자원이 유지할 수 있는 개체의 수이다."], ["2", "서식지의 수용력을 초과해 버린 개체군에 속한 개체들은 위태로워진 생활 여건 때문에 건강이 나빠지고 영양실조에 시달릴 수 있다."], ["3", "이런 일이 일어나면, 가장 약한 개체들이 죽거나, 개체군 전체가 더 심한 환경적 스트레스나 질병에 더 취약해질 수 있다."], ["4", "때때로 서식지의 수용력을 초과한 결과로 개체군 내 많은 수의 개체가 죽는다."], ["5", "이것이 이른바 '집단 폐사(die-off)'이다."], ["6", "어떤 동물과 식물은 수용력에 대한 내재된 감각을 가지고 있어서, 수용력을 초과해 집단 폐사를 겪는 대신 서식지가 자신들을 부양할 수 있는 능력의 한계 안에 머무른다."], ["7", "예를 들어 호수 송어는 개체군 밀도가 너무 급격하게 증가하면 그만큼 왕성하게 번식하는 것을 멈춘다."], ["8", "비록 이것이 송어 쪽의 심사숙고한 반응이라기보다는 다른 function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
const CMAP={"07-3": [["085-H1", "전치사 + 관계대명사"], ["078", "관계대명사"]], "07-5": [["068", "현재분사 · 과거분사"], ["025", "to부정사 부사적 용법"]], "08-6": [["078", "관계대명사"], ["074", "수동태"]], "08-3": [["094", "간접의문문"], ["030", "5형식"]], "09-4": [["086", "관계부사"], ["037-H1", "병렬 구조"]], "10-4": [["078", "관계대명사"], ["074", "수동태"]], "11-2": [["078", "관계대명사"], ["037-H1", "병렬 구조"]], "11-9": [["037-H1", "병렬 구조"], ["041", "시간 접속사"]]};
function scHtml(c){

  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  const cc=(CMAP[c.q+'-'+c.s]||[]);
  const back=encodeURIComponent(location.origin+location.pathname);
  let x='<div class="sc open"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='</div></div>';

}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
