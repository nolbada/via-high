<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>고3 미니모의고사 1회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
</style>
</head>

var D=[{"no": "07", "typ": "빈칸 추론", "src": "2018년 3월 32번", "evn": [1, 4], "ev_en": "Sculpture in a public place is the emotional and aesthetic focal point of the elements in the surrounding environment. / The proper understanding of the spatial characteristics of the elements, making up the whole multitude, as well as of the structural links between the constituent elements of this specific microcosm are preconditions for satisfactory design and an adequate sculptural solution.", "ev_ko": [[1, "공공장소의 조형물은 주위 환경에 있는 요소들의 정서적이고 심미적인 중심이다."], [4, "이 특정한 작은 세계의 구성 요소들 사이의 구조적 연결뿐만 아니라, 전체 다수(총체)를 구성하는 요소들의 공간적 특징에 대한 적절한 이해는 만족스러운 설계와 적절한 조형적 해법을 위한 전제 조건이다."]], "why": ["빈칸 문장은 조형물을 세울 장소를 미리 분석하고 아는 것이 무엇을 위한 요건인지를 말합니다", "(1)에서 조형물은 주위 환경 요소들의 <b>중심(focal point)<\/b>이라고 합니다", "(4)에서는 요소들의 공간적 특징과 구조적 연결을 제대로 이해하는 것이 만족스러운 설계의 <b>전제 조건<\/b>이라고 합니다", "즉 조형물이 그 장소와 잘 어우러져야 한다는 말입니다", "그래서 빈칸에는 ① <b>successful integration in the specific space<\/b>(특정 장소에의 성공적인 통합)가 알맞습니다."], "ch": [{"n": "①", "t": "successful integration in the specific space", "g": "특정 장소에의 성공적인 통합", "ok": true, "e": ["(4)에서 장소의 공간적 특징과 구조적 연결을 제대로 이해해야 만족스러운 설계가 된다고 합니다", "조형물이 그 장소에 잘 녹아들어야 한다는 뜻이므로 '특정 장소에의 성공적인 통합'이 알맞습니다."]}, {"n": "②", "t": "applying mechanical theories to architecture", "g": "기계적 이론을 건축학에 적용하는 것", "ok": false, "e": ["글의 mechanical은 '요소 하나를 기계적으로 더 보태는 것'을 가리킵니다", "필자는 그보다 기존 구조 속에 엮어 넣는 것이 더 낫다고 말합니다", "기계적 이론이나 건축학에 관한 이야기는 없습니다."]}, {"n": "③", "t": "true understanding of the human psychology", "g": "인간 심리에 대한 진정한 이해", "ok": false, "e": ["글에서 이해해야 한다고 말하는 것은 요소들의 공간적 특징과 구조적 연결입니다(4번)", "인간 심리에 대한 이야기는 나오지 않습니다."]}, {"n": "④", "t": "exact evaluation of the property’s future value", "g": "재산의 미래 가치에 대한 정확한 평가", "ok": false, "e": ["재산의 가치나 그 평가에 관한 내용은 글에 없습니다."]}, {"n": "⑤", "t": "creating a commercial space for multiple purposes", "g": "다양한 목적을 위한 상업적인 공간을 만드는 것", "ok": false, "e": ["상업 공간이나 여러 용도에 관한 내용은 글에 없습니다", "multitude(다수)는 요소들의 모임을 가리키는 말이고, '다양한 목적'과는 관계가 없습니다."]}], "tr": ["공공장소의 조형물은 주위 환경에 있는 요소들의 정서적이고 심미적인 중심이다.", "어떤 환경이든 구성 요소들의 다양성, 그것들(그 구성 요소들) 사이의 연관성, 그리고 완전한 구조물로서 그것들의 모습 때문에 유일무이하다.", "이러한 예비적인 구조적 분석과 조형물을 위해 선택된 장소에 대한 지식은 그것(공공 조형물)의 설계 작업을 하기 전에 필수적이다. (그리고) 그것은 특정 장소에의 성공적인 통합을 위한 요건이다.", "이 특정한 작은 세계의 구성 요소들 사이의 구조적 연결뿐만 아니라, 전체 다수(총체)를 구성하는 요소들의 공간적 특징에 대한 적절한 이해는 만족스러운 설계와 적절한 조형적 해법을 위한 전제 조건이다.", "다수(로 이루어진 것)에 한 가지 요소를 기계적으로 더 추가하는 것에 반해, 기존 구조의 맥락 안에 어떤 것을 더 ‘엮는’ 것이 더 낫다."], "ps": [{"n": 1, "ch": [{"e": "Sculpture in a public place", "k": "공공장소의 조형물은"}, {"e": "is the emotional and aesthetic <b>focal point<\/b>", "k": "정서적이고 심미적인 중심이다"}, {"e": "of the elements in the surrounding environment.", "k": "주위 환경에 있는 요소들의."}], "easy": "공공장소에 놓인 조형물은 주변 환경 속 여러 요소들 가운데 마음과 눈이 모이는 중심이 돼요.", "gist": "글의 화제예요. 조형물이 주변 환경의 중심이라는 말로 시작해요."}, {"n": 2, "ch": [{"e": "Any environment is <b>unique<\/b>", "k": "어떤 환경이든 유일무이하다"}, {"e": "with the diversity of its component elements,", "k": "그것<span class=\"r\">(= 환경)<\/span>의 구성 요소들의 다양성,"}, {"e": "the connections between them", "k": "그것들<span class=\"r\">(= 구성 요소들)<\/span> 사이의 연관성,"}, {"e": "and their appearance as a complete structure.", "k": "그리고 완전한 구조물로서 그것들<span class=\"r\">(= 구성 요소들)<\/span>의 모습 때문에."}], "link": "어떤 환경이든 구성 요소들의 다양성, 그것들 사이의 연관성, 그리고 완전한 구조물로서 그것들의 모습 때문에 유일무이하다.", "easy": "모든 환경은 어떤 요소들로 이루어졌는지, 그 요소들이 어떻게 이어지는지, 전체가 어떤 모습인지가 다 달라서 세상에 하나뿐이에요.", "gist": "환경마다 모두 다르다는 점을 짚어요. 그래서 장소를 먼저 알아야 한다는 말로 이어져요."}, {"n": 3, "ch": [{"e": "This <b>preliminary<\/b> structural analysis", "k": "이러한 예비적인 구조적 분석과"}, {"e": "and acquaintance with the site", "k": "장소에 대한 지식은"}, {"e": "chosen for the sculpture", "k": "조형물을 위해 선택된"}, {"e": "is <b>compulsory<\/b>", "k": "필수적이다"}, {"e": "before working on its design;", "k": "그것<span class=\"r\">(= 조형물)<\/span>의 설계 작업을 하기 전에;"}, {"e": "it is a <b>requirement<\/b>", "k": "그것<span class=\"r\">(= 이러한 예비 분석과 장소에 대한 지식)<\/span>은 요건이다"}, {"e": "for <b>successful integration in the specific space<\/b>.", "k": "특정 장소에의 성공적인 통합을 위한. <spa pes. / In the case of contrasting styles, individuals may be less interested in pursuing a relationship than if they were similar in interaction styles.", "ev_ko": [[2, "즉, 두 사람이 첫 만남에서 비슷한 언어적 그리고 비언어적 습관을 공유하는 정도까지, 그들은 서로 더 편할 것이다."], [4, "이러한 연속체의 양끝에 있는 사람들 간의 초기 상호 작용은 비슷한 유형 간의 그것들(초기 상호 작용)보다 더 어려울 수 있다."], [5, "대조적인 유형의 경우, 사람들은 상호 작용 유형이 비슷한 경우보다 관계를 추구하는 데에 관심이 더 적을 수 있다."]], "why": ["빈칸 문장은 <b>Thus<\/b>(따라서)로 시작하므로 앞 내용을 정리하는 말이 들어갑니다", "(2)에서 두 사람이 비슷한 언어적·비언어적 습관을 공유할수록 서로 더 편하다고 합니다", "(4)와 (5)에서는 유형이 정반대인 사람들은 처음 상호 작용이 더 어렵고, 관계를 이어 가는 데 관심이 덜할 수 있다고 합니다", "즉 말과 행동 방식이 서로 맞는지가 관계를 시작할지 가르는 필터 역할을 합니다", "그래서 정답은 ④ <b>behavioral coordination<\/b>(행동의 조정)입니다."], "ch": [{"n": "①", "t": "information deficit", "g": "정보의 부족", "ok": false, "e": ["글은 정보가 부족한지를 다루지 않습니다", "말과 행동 방식이 서로 비슷한지를 다룹니다."]}, {"n": "②", "t": "cultural adaptability", "g": "문화적 적응성", "ok": false, "e": ["문화 차이나 문화에 적응하는 능력은 나오지 않습니다", "빠른 사람과 느린 사람의 차이는 개인의 상호 작용 유형입니다(3번)."]}, {"n": "③", "t": "meaning negotiation", "g": "의미의 타협", "ok": false, "e": ["말의 의미를 조율한다는 내용이 아닙니다", "쟁점은 말하고 움직이는 속도와 표현 방식이 서로 맞는지입니다."]}, {"n": "④", "t": "behavioral coordination", "g": "행동의 조정", "ok": true, "e": ["(2)의 비슷한 언어적·비언어적 습관, (3)의 말과 움직임의 속도와 표현 방식이 서로 맞는 것을 한 말로 묶으면 '행동의 조정'입니다."]}, {"n": "⑤", "t": "unconditional acceptance", "g": "무조건적인 수용", "ok": false, "e": ["글은 유형이 다르면 관계에 관심이 덜할 수 있다고 합니다(5번)", "아무나 받아들이는 것이 아니라 걸러 낸다는 뜻이므로 '무조건적인 수용'과 반대입니다."]}], "tr": ["비록 파트너 사이의 균형이나 조화가 관계에서 시간이 지남에 따라 분명히 발전하긴 하지만, 그것은 초기 매력과 파트너에 대한 관심의 요인이기도 하다.", "즉, 두 사람이 첫 만남에서 비슷한 언어적 그리고 비언어적 습관을 공유하는 정도까지, 그들은 서로 더 편할 것이다.", "예를 들어, 속도가 빠른 사람들은 빠르게 말을 하고 움직이며 더 표현력이 있는 반면에, 속도가 느린 사람들은 다른 속도를 가지고 표현력이 덜하다.", "이러한 연속체의 양끝에 있는 사람들 간의 초기 상호 작용은 비슷한 유형 간의 그것들(초기 상호 작용)보다 더 어려울 수 있다.", "대조적인 유형의 경우, 사람들은 상호 작용 유형이 비슷한 경우보다 관계를 추구하는 데에 관심이 더 적을 수 있다.", "그러나, 비슷한 유형의 사람들은 더 편안해하고 그들이 단지 바로 서로 ‘마음이 통하는’ 것 같다는 것을 알게 된다.", "따라서, 행동의 조정은 관계의 시작을 위한 선택 필터를 제공할 수 있다."], "ps": [{"n": 1, "ch": [{"e": "<b>Although<\/b> a balance or 제품)입니다", "그 사이에 주어진 문장이 끼면 이 연결이 끊어집니다."]}, {"n": "⑤", "t": "⑤ 자리", "g": "", "ok": true, "e": ["⑤는 문장 (6)과 (7) 사이입니다", "(6)의 집단적 형성물을 주어진 문장이 '더 큰 이야기와 새로운 정체성'으로 정리합니다", "이어서 (7)의 These consumer communities가 그 새로운 정체성 집단을 받습니다."]}], "tr": ["개인의 이야기는 더 큰 이야기와 연결되어 새로운 정체성을 생성한다.", "식품 선택을 결정하는 사회적 역학의 증가하는 복잡성은(복잡성이 증가하는 것은) 마케팅 담당자와 광고주의 일을 점점 더 어렵게 만든다.", "과거에 대량 생산은 그것들(제품)의 광범위한 유통뿐만 아니라 제품의 입수와 (구매) 비용의 감당을 가능하게 했으며, 발전의 신호로 받아들여졌다.", "요즘 그것(대량 생산)은 개인의 선호를 반영해야 하는 점점 더 작은 (규모의) 부문 사이에서 소비자의 파편화에 의해 갈수록 대체되고 있다.", "모든 사람은 (각자) 다르고 특별하다고 느끼고, 자신의 기호를 만족시키는 제품을 기대한다.", "현실에서 아마 개인적 선호라고 생각되는 이런 것들은 결국 문화적 감성, 사회 정체성, 정치적 감성, 그리고 식생활과 건강에 관한 관심사를 중심으로 확고해지는, 최근에 생겨나고, 일시적이며, 항상 바뀌고, 거의 부족적인 형성물과 겹치게 된다.", "이들 소비자 집단은 국경을 초월하여 생각, 이미지, 관습의 전 세계의 널리 공유된 저장소로 인해 더 강화된다."], "ps": [{"n": 1, "ch": [{"e": "Personal stories connect with larger <b>narratives<\/b>", "k": "개인의 이야기는 더 큰 이야기와 연결되어"}, {"e": "to generate new identities.", "k": "새로운 정체성을 생성한다."}], "easy": "한 사람 한 사람의 이야기가 더 큰 이야기와 이어지면서 새로운 정체성이 생겨나요.", "gist": "주어진 문장이에요. 개인의 선호가 집단의 정체성으로 이어지는 연결 고리예요."}, {"n": 2, "ch": [{"e": "The growing complexity of the social dynamics", "k": "사회적 역학의 증가하는 복잡성은"}, {"e": "determining food choices", "k": "식품 선택을 결정하는"}, {"e": "makes the job of marketers and advertisers", "k": "마케팅 담당자와 광고주의 일을 만든다"}, {"e": "increasingly more difficult.", "k": "점점 더 어렵게."}], "link": "식품 선택을 결정하는 사회적 역학의 증가하는 복잡성은 마케팅 담당자와 광고주의 일을 점점 더 어렵게 만든다.", "easy": "사람들이 어떤 음식을 고르는지에 영향을 주는 사회적 요인이 복잡해져서, 마케터와 광고주의 일이 점점 어려워지고 있어요.", "gist": "글의 화제예요. 마케팅 담당자와 광고주의 일이 점점 어려워진다고 말해요."}, {"n": 3, "ch": [{"e": "<b>In the past<\/b>,", "k": "과거에"}, {"e": "mass production allowed for accessibility and affordability of products,", "k": "대량 생산은 제품의 입수와 (구매) 비용의 감당을 가능하게 했다,"}, {"e": "as well as their wide distribution,", "k": "그것들<span class=\"r\">(= 제품)<\/span>의 광범위한 유통뿐만 아니라,"}, {"e": "and was accepted as a sign of progress.", "k": "그리고 발전의 신호로 받아들여졌다."}], "link": "과거에 대량 생산은 제품의 광범위한 유통뿐만 아니라 제품의 입수와 (구매) 비용의 감당을 가능하게 했으며, 발전의 신호로 받아들여졌다.", "easy": "옛날에는 대량 생산 덕분에 제품을 쉽게 구하고 부담 없이 살 수 있었고, 제품이 널리 퍼졌어요. 그래서 대량 생산은 발전의 신호로 여겨졌어요.", "gist": "과거의 모습이에요. 대량 생산이 환영받던 시절을 보여 줘요."}, {"n": 4, "ch": [{"e": "<b>Nowadays<\/b> it is increasingly replaced", "k": "요즘 그것<span class=\"r\">(= 대량 생산)<\/span>은 갈수록 대체되고 있다"}, {"e": "by the <b>fragmentation<\/b> of consumers", "k": "소비자의 파편화에 의해"}, {"e": "among smaller and smaller segments", "k": "점점 더 작은 (규모의) 부문 사이에서의"}, {"e": "that are supposed to reflect personal preferences.", "k": "개인의 선호를 반영해야 하는."}], "link": "요즘 그것은 개인의 선호를 반영해야 하는 점점 더 작은 부문 사이에서 소비자의 파편화에 의해 갈수록 대체되고 있다.", "easy": "요즘은 대량 생산 대신, 소비자들이 각자의 취향에 따라 점점 더 작은 무리로 잘게 나뉘고 있어요.", "gist": "현재의 모습이에요. 소비자가 개인 취향에 따라 쪼개진다고 해요."}, {"n": 5, "ch": [{"e": "Everybody feels different and special", "k": "모든 사람은 (각자) 다르고 특별하다고 느끼고,"}, {"e": "and expects products", "k": "제품을 기대한다"}, {"e": "serving his or her <b>inclinations<\/b>.", "k": "자신의 기호를 만족시키는."}], "easy": "누구나 자기는 남과 다르고 특별하다고 느껴서, 자기 취향에 맞는 제품을 원해요.", "gist": "개인적 선호를 더 구체적으로 설명해요."}, {"n": 6, "ch": [{"e": "<b>In reality<\/b>,", "k": "현실에서,"}, {"e": "these <b>supposedly<\/b> individual preferences", "k": "아마 개인적 선호라고 생각되는 이런 것들<span class=\"r\">(= 앞에서 말한 개인의 선호와 기호)<\/span>은"}, {"e": "end up overlapping with", "k": "결국 ~와 겹치게 된다"}, {"e": "emerging, temporary, always changing, almost tribal formations", "k": "최근에 생겨나고, 일시적이며, 항상 바뀌고, 거의 부족적인 형성물과"}, {"e": "solidifying around cultural sensibilities, social identifications,", "k": "문화적 감성, 사회 정체성,"}, {"e": "political sensibilities, and dietary and health concerns.", "k": "정치적 감성, 그리고 식생활과 건강에 관한 관심사를 중심으로 확고해지는."}], "link": "현실에서 아마 개인적 선호라고 생각되는 이런 것들은 결국 문화적 감성, 사회 정체성, 정치적 감성, 그리고 식생활과 건강에 관한 관심사를 중심으로 확고해지는, 최근에 생겨나고, 일시적이며, 항상 바뀌고, 거의 부족적인 형성물과 겹치게 된다.", "easy": "그런데 실제로는 '나만의 취향'이라고 생각한 것들이, 문화·사회·정치·식생활과 건강 관심사를 중심으로 뭉치는 일시적인 무리와 결국 겹쳐요.", "gist": "반전이에요. 개인 취향이 사실은 집단의 모습과 겹친다고 해요. 주어진 문장이 바로 이 뒤에 와요."}, {"n": 7, "ch": [{"e": "These consumer communities", "k": "이들 소비자 집단<span class=\"r\">(= 새로운 정체성으로 묶인 소비자 집단)<\/span>은"}, {"e": "go beyond national boundaries,", "k": "국경을 초월하여,"}, {"e": "<b>feeding on<\/b> global and widely shared repositories", "k": "전 세계의 널리 공유된 저장소로 인해 더 강화된다"}, {"e": "of ideas, images, and practices.", "k": "생각, 이미지, 관습의."}], "link": "이들 소비자 집단은 국경을 초월하여 생각, 이미지, 관습의 전 세계의 널리 공유된 저장소로 인해 더 강화된다.", "easy": "이런 소비자 무리는 나라의 경계를 넘어, 전 세계가 함께 나누는 생각과 이미지, 관습을 바탕으로 더 커져요.", "gist": "These consumer communities가 주어진 문장의 '새로운 정체성' 집단을 받아요."}]}, {"no": "11", "typ": "장문 제목", "src": "2019학년도 수능 41번", "evn": [1, 3, 5, 6, 9], "ev_en": "Industrial capitalism not only created work, it also created ‘leisure’ in the modern sense of the term. / However, by requiring continuous work during work hours and ruling out non-work activity, employers had (a) separated out leisure from work. / ‘Leisure’ as a distinct non-work time, whether in the form of the holiday, weekend, or evening, was a result of the disciplined and bounded work time created by capitalist production. / Workers then wanted more leisure and leisure time was enlarged by union campaigns, which first started in the cotton industry, and eventually new laws were passed that (c) limited the hours of work and gave workers holiday entitlements. / Workers began to (d) pay for leisure activities organized by capitalist enterprises.", "ev_ko": [[1, "산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라, 또한 그 용어의 현대적 의미로 ‘여가’를 만들어 냈다(현대적인 의미의 ‘여가’ 개념을 만들었다)."], [3, "그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 (a)분리시켰다."], [5, "별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 (방식)에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다."], [6, "그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 노동조합 운동에 의해 확대되었는데, 이는 면직물 산업에서 처음 시작되어서, 결국 근무 시간을 (c)제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다."], [9, "근로자들은 자본주의적인 기업들에 의해 조직된 여가 활동에 (d)돈을 지불하기 시작했다."]], "why": ["(1)에서 산업 자본주의가 현대적 의미의 ‘여가’를 만들어 냈다고 화제를 던집니다", "(3)과 (5)는 고용주들이 일과 여가를 분리하면서 여가가 생겨났다는 <b>탄생<\/b> 과정입니다", "(6)은 노동조합 운동과 새로운 법으로 여가가 늘어난 과정이고, (9)는 근로자들이 기업이 조직한 여가 활동에 돈을 내기 시작한 상업화 과정입니다", "이것이 여가의 <b>발전<\/b>입니다", "그래서 제목은 ③ <b>The Birth and Evolution of Leisure in Capitalism<\/b>(자본주의에서 여가의 탄생과 발전)이 알맞습니다."], "ch": [{"n": "①", "t": "What It Takes to Satisfy Workers", "g": "근로자를 만족시키기 위해 필요한 것(조건)", "ok": false, "e": ["근로자를 만족시키는 조건은 다루지 않습니다", "여가가 어떻게 생겨나고 바뀌었는지를 설명하는 글입니다."]}, {"n": "②", "t": "Why Workers Have Struggled for More Leisure", "g": "왜 근로자들은 더 많은 여가를 위해 투쟁해 왔는가", "ok": false, "e": ["(6)에 근로자들이 더 많은 여가를 원했고 노동조합 운동으로 여가가 늘었다는 내용이 나오기는 합니다", "하지만 글의 일부일 뿐이고, 왜 투쟁했는지를 다루는 글이 아닙니다."]}, {"n": "③", "t": "The Birth and Evolution of Leisure in Capitalism", "g": "자본주의에서 여가의 탄생과 발전", "ok": true, "e": ["(1)~(6)은 여가가 생겨나고 늘어난 과정, (7)~(11)은 여가가 상업화된 과정입니다", "'탄생과 발전'이 이 흐름을 한 줄로 담고 있습니다."]}, {"n": "④", "t": "How to Strike a Balance Between Work and Leisure", "g": "일과 여가 사이에 균형을 잡는 방법", "ok": false, "e": ["일과 여가의 균형을 잡는 방법은 나오지 않습니다", "여가가 생겨나고 발전한 역사를 설명하는 글입니다."]}, {"n": "⑤", "t": "The Light and Dark Sides of the Modern Leisure Industry", "g": "현대 여가 산업의 명암", "ok": false, "e": ["여가 산업의 어두운 면은 나오지 않습니다", "(11)은 여가 시장이 소비자 수요, 고용, 이익의 거대한 원천이 될 것이었다고 말할 뿐입니다."]}], "tr": ["산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라, 또한 그 용어의 현대적 의미로 ‘여가’를 만들어 냈다(현대적인 의미의 ‘여가’ 개념을 만들었다).", "이것(산업 자본주의가 현대적 의미의 ‘여가’를 이끌었다는 사실)은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.", "그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 (a)분리시켰다.", "일부는 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 왜냐하면 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일을 (b)진척시키는(→ 중단시키는) 것보다 더 나았기 때문이다.", "별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 (방식)에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다.", "그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 노동조합 운동에 의해 확대되었는데, 이는 면직물 산업에서 처음 시작되어서, 결국 근무 시간을 (c)제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다.", "다른 의미에서 여가는 또한 여가의 상업화를 통한 자본주의의 산물이기도 했다.", "이는(여가는) 전통적인 스포츠나 오락에 참여하는 것을 더 이상 의미하지 않았다.", "근로자들은 자본주의적인 기업들에 의해 조직된 여가 활동에 (d)돈을 지불하기 시작했다.", "사람들이 입장하는 데 요금이 부과될 수 있는(입장료를 받을 수 있는) 관중 (동원력이 큰) 스포츠, 특히 축구와 경마로의 대중의 이동이 이제 가능해졌다.", "이것은 매우 중요한데, 왜냐하면 완전히 새로운 산업들이 여가 시장을 개발하고 (e)발전시키기 위해 출현하고 있었고, 여가 시장은 소비자 수요, 고용 그리고 이익의 거대한 원천이 될 것이었기 때문이다."], "ps": [{"n": 1, "ch": [{"e": "Industrial capitalism not only created work,", "k": "산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라,"}, {"e": "it also created ‘leisure’", "k": "또한 ‘여가’를 만들어 냈다"}, {"e": "in the modern sense of the term.", "k": "그 용어의 현대적 의미로."}], "easy": "산업 자본주의는 일자리뿐 아니라, 우리가 지금 생각하는 의미의 '여가'도 만들어 냈어요.", "gist": "글의 주제예요. 여가는 산업 자본주의가 만들어 낸 것이라고 해요."}, {"n": 2, "ch": [{"e": "This might seem surprising,", "k": "이것<span class=\"r\">(= 산업 자본주의가 현대적 의미의 여가를 만들어 냈다는 것)<\/span>은 놀랍게 보일지도 모른다,"}, {"e": "<b>for<\/b> the early cotton masters wanted", "k": "왜냐하면 초기 면직 공장주들은 원했고"}, {"e": "to keep their machinery running", "k": "그들<span class=\"r\">(= 초기 면직 공장주들)<\/span>의 기계가 계속 가동되기를"}, {"e": "as long as possible", "k": "가능한 한 오랫동안"}, {"e": "and forced their employees", "k": "그리고 그들<span class=\"r\">(= 초기 면직 공장주들)<\/span>의 직원들에게 강요했기 때문이다"}, {"e": "to work very long hours.", "k": "아주 장시간 일하도록."}], "link": "이것은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.", "easy": "이 말이 의외로 들릴 수 있어요. 초기 공장주들은 기계를 최대한 오래 돌리려고 직원들을 아주 오래 일하게 했거든요.", "gist": "여가와는 반대로 보이는 당시 상황을 먼저 보여 줘요."}, {"n": 3, "ch": [{"e": "<b>However<\/b>,", "k": "그러나,"}, {"e": "by requiring continuous work during work hours", "k": "근무 시간 동안 계속되는 작업을 요구하고"}, {"e": "and <b>ruling out<\/b> non-work activity,", "k": "비업무 활동을 배제함으로써,"}, {"e": "employers had (a) <b>separated<\/b> out leisure from work.", "k": "고용주들은 여가를 업무와 (a) 분리시켰다."}], "link": "그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 분리시켰다.", "easy": "하지만 일하는 시간에는 일만 하게 하고 다른 활동은 못 하게 하면서, 고용주들은 여가를 일과 따로 떼어 놓게 됐어요.", "gist": "여가가 생겨난 과정이에요. 일과 여가가 분리되었어요."}, {"n": 4, "ch": [{"e": "Some did this quite <b>explicitly<\/b>", "k": "일부<span class=\"r\">(= 일부 고용주들)<\/span>는 이것<span class=\"r\">(= 여가를 일에서 분리하는 것)<\/span>을 꽤 명시적으로 했다"}, {"e": "by creating distinct holiday periods,", "k": "별개의 휴가 기간을 만듦으로써,"}, {"e": "when factories were shut down,", "k": "그 기간에는 공장들이 문을 닫았다,"}, {"e": "because it was better to do this", "k": "왜냐하면 이렇게 하는 것<span class=\"r\">(= 별개의 휴가 기간을 만드는 것)<\/span>이 더 나았기 때문이다"}, {"e": "than have work (b) <b>disrupted<\/b>", "k": "일이 (b) 중단되게 하는 것보다 <span class=\"r\">※ 문제지엔 promoted로 되어 있음<\/span>"}, {"e": "by the casual taking of days off.", "k": "비정기적인 휴가를 내는 것으로 인해."}], "link": "일부 고용주들은 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일이 중단되게 하는 것보다 더 나았기 때문이다.", "easy": "어떤 고용주들은 아예 공장 문을 닫는 휴가 기간을 따로 정했어요. 직원들이 제각각 쉬어서 일이 끊기는 것보다 그게 나았기 때문이에요.", "gist": "12번의 정답 자리예요. 제각각 쉬면 일이 진척되는 게 아니라 지장을 받는다는 흐름이에요."}, {"n": 5, "ch": [{"e": "‘Leisure’ as a distinct non-work time,", "k": "별개의 비업무 시간으로서의 ‘여가’는,"}, {"e": "whether in the form of the holiday, weekend, or evening,", "k": "휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에,"}, {"e": "was a result of the <b>disciplined<\/b> and bounded work time", "k": "통제되고 제한된 근로 시간의 결과물이었다"}, {"e": "created by capitalist production.", "k": "자본주의적인 생산 (방식)에 의해 만들어진."}], "link": "별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 방식에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다.", "easy": "휴가든 주말이든 저녁이든, 일과 따로 떨어진 시간인 '여가'는 자본주의 생산이 근무 시간을 정해 두고 통제한 결과로 생겼어요.", "gist": "여가의 탄생을 정리해요. 통제되고 제한된 근무 시간이 여가를 만들었어요."}, {"n": 6, "ch": [{"e": "Workers then wanted more leisure", "k": "그 후 근로자들은 더 많은 여가를 원했고"}, {"e": "and leisure time was <b>enlarged<\/b> by union campaigns,", "k": "여가 시간은 노동조합 운동에 의해 확대되었는데,"}, {"e": "which first started in the cotton industry,", "k": "이것<span class=\"r\">(= 노동조합 운동)<\/span>은 면직물 산업에서 처음 시작되었다,"}, {"e": "and eventually new laws were passed", "k": "그리고 결국 새로운 법이 통과되었다"}, {"e": "that (c) <b>limited<\/b> the hours of work", "k": "근무 시간을 (c) 제한하고"}, {"e": "and gave workers holiday <b>entitlements<\/b>.", "k": "근로자들에게 휴가 권리를 부여하는."}], "link": "그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 면직물 산업에서 처음 시작된 노동조합 운동에 의해 확대되었으며, 결국 근무 시간을 제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다.", "easy": "그 뒤 근로자들이 여가를 더 원했고, 노동조합 운동으로 여가 시간이 늘었어요. 결국 근무 시간을 제한하고 휴가 권리를 주는 법까지 생겼어요.", "gist": "여가가 늘어난 과정이에요. 여가의 발전을 보여 줘요."}, {"n": 7, "ch": [{"e": "Leisure was also the creation of capitalism", "k": "여가는 또한 자본주의의 산물이기도 했다"}, {"e": "in another sense,", "k": "다른 의미에서,"}, {"e": "through the <b>commercialization<\/b> of leisure.", "k": "여가의 상업화를 통한."}], "easy": "여가는 또 다른 면에서도 자본주의가 만든 것이에요. 바로 여가가 상업화되었다는 점이에요.", "gist": "글의 후반부를 열어요. 여가의 상업화 이야기로 넘어가요."}, {"n": 8, "ch": [{"e": "This no longer meant participation", "k": "이것<span class=\"r\">(= 여가)<\/span>은 더 이상 참여하는 것을 의미하지 않았다"}, {"e": "in traditional sports and pastimes.", "k": "전통적인 스포츠나 오락에."}], "easy": "이제 여가는 더 이상 전통 스포츠나 놀이에 참여하는 것을 뜻하지 않았어요.", "gist": "여가의 의미가 바뀌었다고 해요."}, {"n": 9, "ch": [{"e": "Workers began to (d) <b>pay<\/b> for leisure activities", "k": "근로자들은 여가 활동에 (d) 돈을 지불하기 시작했다"}, {"e": "organized by capitalist <b>enterprises<\/b>.", "k": "자본주의적인 기업들에 의해 조직된."}], "easy": "근로자들은 기업이 마련한 여가 활동에 돈을 내기 시작했어요.", "gist": "상업화의 구체적인 모습이에요."}, {"n": 10, "ch": [{"e": "Mass travel to spectator sports,", "k": "관중 (동원력이 큰) 스포츠로의 대중의 이동이,"}, {"e": "especially football and horse-racing,", "k": "특히 축구와 경마,"}, {"e": "where people could be charged for entry,", "k": "사람들이 입장하는 데 요금이 부과될 수 있는,"}, {"e": "was now possible.", "k": "이제 가능해졌다."}], "link": "사람들이 입장하는 데 요금이 부과될 수 있는 관중 스포츠, 특히 축구와 경마로의 대중의 이동이 이제 가능해졌다.", "easy": "많은 사람이 축구나 경마 같은 관람 스포츠를 보러 갈 수 있게 됐고, 그곳에서는 입장료를 받을 수 있었어요.", "gist": "상업화의 예시예요. 입장료를 내고 스포츠를 보는 시대가 됐어요."}, {"n": 11, "ch": [{"e": "The importance of this can hardly be <b>exaggerated<\/b>,", "k": "이것<span class=\"r\">(= 앞에서 말한 여가의 상업화)<\/span>의 중요성은 아무리 과장해도 지나치지 않다,"}, {"e": "<b>for<\/b> whole new industries were emerging", "k": "왜냐하면 완전히 새로운 산업들이 출현하고 있었기 때문이다"}, {"e": "to exploit and (e) <b>develop<\/b> the leisure market,", "k": "여가 시장을 개발하고 (e) 발전시키기 위해,"}, {"e": "which was to become a huge source", "k": "그리고 그것<span class=\"r\">(= 여가 시장)<\/span>은 거대한 원천이 될 것이었다"}, {"e": "of consumer demand, employment, and profit.", "k": "소비자 수요, 고용 그리고 이익의."}], "link": "이것의 중요성은 아무리 과장해도 지나치지 않은데, 완전히 새로운 산업들이 여가 시장을 개발하고 발전시키기 위해 출현하고 있었고, 그 여가 시장은 소비자 수요, 고용 그리고 이익의 거대한 원천이 될 것이었기 때문이다.", "easy": "여가의 상업화는 정말 중요해요. 여가 시장을 키우려는 새 산업들이 생겨났고, 그 시장은 소비, 일자리, 이익의 큰 원천이 되었거든요.", "gist": "여가 산업이 크게 성장했다며 글을 마무리해요."}]}, {"no": "12", "typ": "장문 어휘", "src": "2019학년도 수능 42번", "evn": [4], "ev_en": "Some did this quite explicitly by creating distinct holiday periods, when factories were shut down, because it was better to do this than have work (b) disrupted by the casual taking of days off.", "ev_ko": [[4, "일부는 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 왜냐하면 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일을 (b)진척시키는(→ 중단시키는) 것보다 더 나았기 때문이다."]], "why": ["(4)는 공장이 문을 닫는 별개의 휴가 기간을 만드는 것이, 근로자들이 비정기적으로 쉬는 날을 내는 것보다 낫다고 비교합니다", "근로자들이 제각각 쉬는 날을 내면 일이 <b>진척되는(promoted)<\/b> 것이 아니라 <b>지장을 받습니다<\/b>.", "그래서 (b)는 <b>disrupted<\/b>(중단시키는, 지장을 받게 하는) 같은 말이어야 하고, 정답은 ②입니다."], "ch": [{"n": "①", "t": "(a) separated", "g": "분리했다", "ok": false, "e": ["(3)에서 고용주들은 근무 시간에 계속 일하게 하고 업무 외 활동을 배제했습니다", "그 결과 여가를 일에서 '분리했다'는 말은 자연스럽습니다."]}, {"n": "②", "t": "(b) promoted", "g": "진척되는, 촉진되는", "ok": true, "e": ["(4)에서 근로자들이 비정기적으로 쉬는 날을 내면 일은 진척되지 않고 지장을 받습니다", "promoted가 아니라 disrupted(중단시키는) 같은 말이 와야 합니다."]}, {"n": "③", "t": "(c) limited", "g": "제한했다", "ok": false, "e": ["(6)에서 근로자들은 더 많은 여가를 원했고 여가 시간이 확대되었습니다", "그 결과 통과된 새로운 법은 근로자에게 휴가 권리를 주었으므로, 근무 시간을 '제한했다'가 자연스럽습니다."]}, {"n": "④", "t": "(d) pay", "g": "지불하다", "ok": false, "e": ["(9)는 여가가 상업화되었다는 (7)에 이어지는 문장입니다", "(10)에 입장료를 받을 수 있게 되었다는 말도 나오므로, 기업이 조직한 여가 활동에 '돈을 지불하기' 시작했다는 말이 맞습니다."]}, {"n": "⑤", "t": "(e) develop", "g": "발전시키다", "ok": false, "e": ["(11)에서 새로운 산업들이 여가 시장을 개발하고 '발전시키기(develop)' 위해 생겨났다는 흐름이므로 알맞습니다."]}], "tr": ["산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라, 또한 그 용어의 현대적 의미로 ‘여가’를 만들어 냈다(현대적인 의미의 ‘여가’ 개념을 만들었다).", "이것(산업 자본주의가 현대적 의미의 ‘여가’를 이끌었다는 사실)은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.", "그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 (a)분리시켰다.", "일부는 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 왜냐하면 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일을 (b)진척시키는(→ 중단시키는) 것보다 더 나았기 때문이다.", "별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 (방식)에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다.", "그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 노동조합 운동에 의해 확대되었는데, 이는 면직물 산업에서 처음 시작되어서, 결국 근무 시간을 (c)제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다.", "다른 의미에서 여가는 또한 여가의 상업화를 통한 자본주의의 산물이기도 했다.", "이는(여가는) 전통적인 스포츠나 오락에 참여하는 것을 더 이상 의미하지 않았다.", "근로자들은 자본주의적인 기업들에 의해 조직된 여가 활동에 (d)돈을 지불하기 시작했다.", "사람들이 입장하는 데 요금이 부과될 수 있는(입장료를 받을 수 있는) 관중 (동원력이 큰) 스포츠, 특히 축구와 경마로의 대중의 이동이 이제 가능해졌다.", "이것은 매우 중요한데, 왜냐하면 완전히 새로운 산업들이 여가 시장을 개발하고 (e)발전시키기 위해 출현하고 있었고, 여가 시장은 소비자 수요, 고용 그리고 이익의 거대한 원천이 될 것이었기 때문이다."], "ps": [{"n": 1, "ch": [{"e": "Industrial capitalism not only created work,", "k": "산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라,"}, {"e": "it also created ‘leisure’", "k": "또한 ‘여가’를 만들어 냈다"}, {"e": "in the modern sense of the term.", "k": "그 용어의 현대적 의미로."}], "easy": "산업 자본주의는 일자리뿐 아니라, 우리가 지금 생각하는 의미의 '여가'도 만들어 냈어요.", "gist": "글의 주제예요. 여가는 산업 자본주의가 만들어 낸 것이라고 해요."}, {"n": 2, "ch": [{"e": "This might seem surprising,", "k": "이것<span class=\"r\">(= 산업 자본주의가 현대적 의미의 여가를 만들어 냈다는 것)<\/span>은 놀랍게 보일지도 모른다,"}, {"e": "<b>for<\/b> the early cotton masters wanted", "k": "왜냐하면 초기 면직 공장주들은 원했고"}, {"e": "to keep their machinery running", "k": "그들<span class=\"r\">(= 초기 면직 공장주들)<\/span>의 기계가 계속 가동되기를"}, {"e": "as long as possible", "k": "가능한 한 오랫동안"}, {"e": "and forced their employees", "k": "그리고 그들<span class=\"r\">(= 초기 면직 공장주들)<\/span>의 직원들에게 강요했기 때문이다"}, {"e": "to work very long hours.", "k": "아주 장시간 일하도록."}], "link": "이것은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.", "easy": "이 말이 의외로 들릴 수 있어요. 초기 공장주들은 기계를 최대한 오래 돌리려고 직원들을 아주 오래 일하게 했거든요.", "gist": "여가와는 반대로 보이는 당시 상황을 먼저 보여 줘요."}, {"n": 3, "ch": [{"e": "<b>However<\/b>,", "k": "그러나,"}, {"e": "by requiring continuous work during work hours", "k": "근무   $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function sHtml(s,evn){
  const ev=evn.indexOf(s.n)>=0;
  let x=`<div class="s${ev?' ev':''}"><div class="sn"><span class="lb">문장 ${s.n}</span>${ev?'<span class="lb ev">정답 근거</span>':''}</div>`;
  s.ch.forEach(c=>{x+=`<div class="ch"><div class="ce">${c.e}</div><div class="ck">${c.k}</div></div>`;});
  const lays=[];
  if(s.link)lays.push(['이어 읽으면',s.link]);
  if(s.easy)lays.push(['쉬운 말로',s.easy]);
  if(s.gist)lays.push(['결국 이 얘기',s.gist]);
  lays.forEach(l=>{x+=`<div class="lay"><span class="lb">${l[0]}</span>${l[1]}</div>`;});
  if(lays.length)x+=`<button class="stg" data-names="${lays.map(l=>l[0]).join('|')}">${lays[0][0]}</button>`;
  return x+'</div>';
}
function qHtml(i,a){
  const d=D[i],ok=isRight(i,a);
  let h=`<details class="qd" ${ok?'':'open'}><summary>${esc(d.no)}번 · ${esc(d.typ)}<small>${esc(d.src)}</small><span class="res2 ${ok?'o':'x'}">${ok?'○ 정답':'✕ 오답'}</span></summary><div class="qx">`;
  h+=`<p class="ansline"><b>정답 ${ansText(i)}</b>${ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>'}</p>`;
  h+='<h4>정답 근거</h4>';
  h+=`<p class="en">${esc(d.ev_en)}</p>`;
  h+='<ul class="kolist">'+d.ev_ko.map(p=>`<li><span class="n">${p[0]}번</span>${p[1]}</li>`).join('')+'</ul>';
  h+='<div class="why">'+d.why.map(s=>`<p>${s}</p>`).join('')+'</div>';
  if(d.ps&&d.ps.length){
    h+=`<details class="dk"><summary>지문 직독직해</summary><div class="dkbody"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>`+d.ps.map(s=>sHtml(s,d.evn)).join('')+`</div></details>`;
  }
  h+='<h4>선택지 하나씩</h4>';
  d.ch.forEach(c=>{
    h+=`<div class="c ${c.ok?'ok':''}"><div class="ct"><span class="tg">${c.ok?'정답':'오답'}</span>${esc(c.n)} ${esc(c.t)}${c.g?` <span class="r">(${esc(c.g)})</span>`:''}</div>`+c.e.map(s=>`<p>${s}</p>`).join('')+'</div>';
  });
  if(!(d.ps&&d.ps.length))h+='<h4>지문 해석</h4><ol>'+d.tr.map(t=>`<li>${t}</li>`).join('')+'</ol>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+'<div class="wrap">';
  h+=`<div class="score">${rec.s} <small>/ ${N}</small></div><h2>빠른 정답</h2><div class="quick">`;
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+=`<div>${esc(D[i].no)}) 정답: <b>${ansText(i)}</b> ${ok?'<b class="o">○</b>':'<b class="x">✕</b> <span class="sub">(내 답 '+CIRC[rec.a[i]-1]+')</span>'}</div>`;}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  if(ch){ch.classList.toggle('open');return;}
  const st=e.target.closest('.stg');
  if(st){
    const s=st.closest('.s'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
