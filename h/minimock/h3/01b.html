ass=\"wdb\" data-w=\"coordination\" data-m=\"조정, 조화\"><b>coordination</b>조정, 조화</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>첫 문장의 화제</b>를 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 <b>처음엔 악기 없이 음악 하기</b>예요. instrument(악기)라는 단어만 같고 방향이 다른 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글 전체 화제</span><div class=\"en\">When approaching practical music making for the first time in the classroom, it is a good idea to <mark>avoid using instruments altogether</mark>.</div><p class=\"ko\">처음으로 교실에서 실제 음악을 만들어 낼 때, <mark>악기 사용을 완전히 피하는 것이</mark> 좋은 생각이다.</p></div><div class=\"ck-via\"><i>▼</i><span>This(이것) = 악기를 피하는 것. 대신 목소리·몸 소리에 집중</span></div><div class=\"ck-step\"><span class=\"lab\">①(2번)·②(3·4번) · 화제 이어 가기</span><div class=\"en\">This will … allow the children to focus on the more controllable sound sources i.e. <mark>voices and body percussion</mark> …</div><p class=\"ko\">이것은 아이들이 더 통제 가능한 음원 즉 <mark>목소리와 몸을 두드려 내는 소리</mark>에 집중할 수 있게 할 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>악기 없이 하자던 글이 갑자기 악기의 음질이 어떻게 정해지는지로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">③(5번) · 이탈 지점</span><div class=\"en\"><mark>The sound quality of an instrument</mark> is a direct result of the quality of the materials, design, and making.</div><p class=\"ko\"><mark>악기의 음질은</mark> 재료, 디자인, 그리고 제작의 품질로 인한 직접적인 결과이다.</p></div><div class=\"ck-via\"><i>▼</i><span>③을 빼면 ④의 몸 움직임 → ⑤의 “악기 없이도 된다”로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(7번) · 다시 제자리</span><div class=\"en\">Activities which develop many of the coordination skills … can all be established <mark>without instruments</mark>.</div><p class=\"ko\">조정 능력 … 을 발달시키는 활동은 모두 <mark>악기 없이</mark> 자리 잡을 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">악기의 음질은 재료·디자인·제작 품질의 결과이다<small>악기 없이 하자는 글에서 악기의 음질이 무엇으로 정해지는지로 화제가 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">음악은 목소리와 몸의 소리에서 시작한다</span><span class=\"why\">4번에 instrument(악기)가 나와 헷갈리지만, 그 악기가 the human voice(인간의 목소리)예요. 3번 these(이것들)가 2번의 목소리·몸 소리를 받아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">경험이 적은 교사와 아이들이 각각 무엇에 집중할 수 있는지</span><span class=\"why\">This(이것)가 1번의 “악기 사용 피하기”를 받아서, 그렇게 하면 무엇에 집중할 수 있는지 알려 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">몸의 움직임은 본능적 반응이자 음악 만들기를 부추긴다</span><span class=\"why\">Body movements(몸의 움직임)는 2번의 body percussion(몸을 두드려 내는 소리)처럼 악기 없이 하는 음악 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">여러 음악적 능력은 악기 없이도 자리 잡을 수 있다</span><span class=\"why\">without instruments(악기 없이)로 1번의 화제를 그대로 되풀이하며 글을 마무리해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">When approaching practical music making</div><div class=\"k\">실제 음악을 만들어 내는 일에 접근할 때,</div></div><div class=\"rc\"><div class=\"e\">for the first time in the classroom,</div><div class=\"k\">처음으로 교실에서</div></div><div class=\"rc\"><div class=\"e\">it is a good idea</div><div class=\"k\">좋은 생각이다</div></div><div class=\"rc ckc\"><div class=\"e\">to <span class=\"cw\">avoid using instruments altogether</span>.</div><div class=\"k\"><span class=\"cw\">악기 사용을 완전히 피하는 것이</span>.</div></div><div class=\"rnat\">처음으로 교실에서 실제 음악을 만들어 내는 일에 접근할 때, 악기 사용을 완전히 피하는 것이 좋은 생각이다.</div><div class=\"rst\">첫 음악 시간에 선생님이 “오늘은 리코더 넣어 두자” 해요. = 지문 1번, 처음엔 <b>악기를 아예 쓰지 않는 게</b> 좋다.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This will allow an inexperienced teacher</div><div class=\"k\">이것(= 악기 사용을 피하는 것)은 경험이 많지 않은 교사가 ~하게 할 것이다</div></div><div class=\"rc\"><div class=\"e\">to focus on the development of fundamental musical behaviour</div><div class=\"k\">기본적인 음악 행위 발달에 집중하도록</div></div><div class=\"rc\"><div class=\"e\">through listening, performing and composing;</div><div class=\"k\">(음악) 듣기와 연주하기 그리고 작곡하기를 통해;</div></div><div class=\"rc\"><div class=\"e\">and allow the children to focus on</div><div class=\"k\">그리고 아이들이 ~에 집중할 수 있게 할 것이다</div></div><div class=\"rc\"><div class=\"e\">the more controllable sound sources</div><div class=\"k\">더 통제 가능한 음원</div></div><div class=\"rc ckc\"><div class=\"e\">i.e. <span class=\"cw\">voices and body percussion</span></div><div class=\"k\">즉 <span class=\"cw\">목소리와 몸을 두드려 내는 소리</span></div></div><div class=\"rc\"><div class=\"e\">(clapping, clicking, stamping etc).</div><div class=\"k\">(손뼉치기, 딸깍딸깍 소리를 내기, 발 구르기 등)에.</div></div><div class=\"rnat\">이렇게 하면 경험이 많지 않은 교사는 (음악) 듣기와 연주하기 그리고 작곡하기를 통해 기본적인 음악 행위 발달에 집중할 수 있고, 아이들은 더 통제 가능한 음원 즉 목소리와 몸을 두드려 내는 소리(손뼉치기, 딸깍딸깍 소리를 내기, 발 구르기 등)에 집중할 수 있게 할 것이다.</div><div class=\"rst\">① 그러면 초보 선생님은 듣고, 부르고, 만들어 보기에만 집중하고, 우리는 목소리와 손뼉·발 구르기에 집중해요. = 지문 2번.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Music starts with these</div><div class=\"k\">음악은 이것들(= 목소리와 몸을 두드려 내는 소리)로 시작한다</div></div><div class=\"rc\"><div class=\"e\">both developmentally and historically:</div><div class=\"k\">(아동의) 발달 측면에서뿐만 아니라 역사적으로도:</div></div><div class=\"rnat\">음악은 (아동의) 발달 측면에서뿐만 아니라 역사적으로도 이것들로 시작한다.</div><div class=\"rst\">② 아기도 처음엔 노래하고 손뼉 치며 음악을 시작하죠. = 지문 3번, 음악은 목소리와 몸 소리로 시작한다.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">the most expressive and immediate musical instrument</div><div class=\"k\">가장 표현이 풍부하고 즉각적인 악기는</div></div><div class=\"rc\"><div class=\"e\">is the human voice.</div><div class=\"k\">인간의 목소리이다.</div></div><div class=\"rnat\">가장 표현이 풍부하고 즉각적인 악기는 인간의 목소리이다.</div><div class=\"rst\">우리 목소리가 가장 표현이 풍부하고 바로 쓸 수 있는 악기예요. = 지문 4번, 가장 즉각적인 악기는 인간의 목소리.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The sound quality of an instrument</span></div><div class=\"k\"><span class=\"cw\">악기의 음질은</span></div></div><div class=\"rc\"><div class=\"e\">is a direct result</div><div class=\"k\">직접적인 결과이다</div></div><div class=\"rc\"><div class=\"e\">of the quality of the materials, design, and making.</div><div class=\"k\">재료, 디자인, 그리고 제작의 품질로 인한.</div></div><div class=\"rnat\">악기의 음질은 재료, 디자인, 그리고 제작의 품질로 인한 직접적인 결과이다.</div><div class=\"rst\">③ 갑자기 “좋은 리코더는 재료와 만드는 솜씨로 소리가 정해진다”는 얘기예요. 악기 <b>만들기 품질</b> 얘기라 흐름에서 튀어요. = 지문 5번, 악기 음질은 재료·디자인·제작의 결과.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Body movements are not only an instinctive response to music</div><div class=\"k\">몸의 움직임은 음악에 대한 본능적인 반응일 뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">but also instigate music making.</div><div class=\"k\">음악을 만들어 내도록 부추긴다.</div></div><div class=\"rnat\">몸의 움직임은 음악에 대한 본능적인 반응일 뿐만 아니라 음악을 만들어 내도록 부추긴다.</div><div class=\"rst\">④ 노래를 들으면 저절로 몸이 들썩이고, 그 들썩임이 또 음악을 만들게 해요. = 지문 6번, 몸 움직임은 반응이자 부추김.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Activities which develop many of</div><div class=\"k\">~의 많은 부분을 발달시키는 활동은</div></div><div class=\"rc\"><div class=\"e\">the coordination skills, aural sensitivity,</div><div class=\"k\">조정 능력, 청각적 감수성,</div></div><div class=\"rc\"><div class=\"e\">responses to visual cues and symbols,</div><div class=\"k\">시각적 신호와 기호에 대한 반응,</div></div><div class=\"rc\"><div class=\"e\">and the musical understanding</div><div class=\"k\">그리고 음악적 이해</div></div><div class=\"rc\"><div class=\"e\">necessary to play an instrument</div><div class=\"k\">악기 연주에 필요한</div></div><div class=\"rc ckc\"><div class=\"e\">can all be established <span class=\"cw\">without instruments</span>.</div><div class=\"k\">모두 <span class=\"cw\">악기 없이</span> 자리 잡을 수 있다.</div></div><div class=\"rnat\">조정 능력, 청각적 감수성, 시각적 신호와 기호에 대한 반응, 그리고 악기 연주에 필요한 음악적 이해의 많은 부분을 발달시키는 활동은 모두 악기 없이 자리 잡을 수 있다.</div><div class=\"rst\">⑤ 박자 맞추기, 잘 듣기, 신호 보고 반응하기 모두 <b>악기 없이</b> 연습할 수 있어요. = 지문 7번의 마무리.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"altogether\" data-m=\"완전히, 전적으로\"><b>altogether</b>완전히, 전적으로</button><button type=\"button\" class=\"wdb\" data-w=\"inexperienced\" data-m=\"경험이 많지 않은\"><b>inexperienced</b>경험이 많지 않은</button><button type=\"button\" class=\"wdb\" data-w=\"fundamental\" data-m=\"기본적인\"><b>fundamental</b>기본적인</button><button type=\"button\" class=\"wdb\" data-w=\"body percussion\" data-m=\"몸을 두드려 내는 소리\"><b>body percussion</b>몸을 두드려 내는 소리</button><button type=\"button\" class=\"wdb\" data-w=\"instinctive\" data-m=\"본능적인\"><b>instinctive</b>본능적인</button><button type=\"button\" class=\"wdb\" data-w=\"instigate\" data-m=\"부추기다\"><b>instigate</b>부추기다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제예요. <b>larger narratives</b>(더 큰 이야기)는 6번의 ‘집단 형성물’을, <b>new identities</b>(새로운 정체성)는 7번 These consumer communities(이들 소비자 집단)가 받아요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\">Personal stories connect with <mark>larger narratives</mark> to generate <mark>new identities</mark>.</div><p class=\"ko\">개인의 이야기는 <mark>더 큰 이야기</mark>와 연결되어 <mark>새로운 정체성을</mark> 생성한다.</p></div><div class=\"ck-via\"><i>▼</i><span>개인 선호(Personal stories)가 더 큰 집단(larger narratives)과 겹친다는 내용이 여기서 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 앞 문장 (⑤ 바로 앞)</span><div class=\"en\">In reality, these supposedly individual preferences <mark>end up overlapping with</mark> … almost tribal formations …</div><p class=\"ko\">현실에서, 아마 개인적 선호라고 생각되는 이런 것들은 결국 거의 부족적인 형성물과 <mark>겹치게 된다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>These(이들) = 주어진 문장의 ‘새로운 정체성’으로 묶인 집단</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 뒤 문장 (⑤ 바로 뒤)</span><div class=\"en\"><mark>These consumer communities</mark> go beyond national boundaries …</div><p class=\"ko\"><mark>이들 소비자 집단</mark>은 국경을 초월하여 …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>개인 선호가 결국 큰 집단과 겹침</span><span><em>주어진 문장</em>개인 이야기 + 큰 이야기 → 새 정체성</span><span><em>7번</em>이들 소비자 집단은 국경을 넘음</span></div><div class=\"ck-eq\">⇒ 겹침 → 새 정체성 탄생 → 그 집단 설명, 세 고리가 다 맞는 자리 = ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">6번 문장과 7번 문장 사이<small>7번 These consumer communities(이들 소비자 집단)가 받을 ‘새 정체성 집단’이 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">5번 “모두 다르고 특별하다”에 개인 이야기가 붙어 보이지만, 6번 In reality(현실에서)가 5번을 뒤집어야 해요. 큰 집단과 겹친다는 말은 6번에서 처음 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">2번은 마케팅이 어려워졌다는 화제 제시, 3번은 In the past(과거에)로 대량 생산 이야기를 시작해요. 정체성 이야기가 끼어들 틈이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">4번 it(그것)은 3번의 mass production(대량 생산)을 받아요. 사이에 문장을 넣으면 it(그것)이 가리킬 대상이 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">4·5번은 소비자가 잘게 나뉘고 저마다 특별하다는 설명이 이어지는 중이에요. 아직 ‘더 큰 이야기’로 묶이는 단계가 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Personal stories connect with <span class=\"cw\">larger narratives</span></div><div class=\"k\">개인의 이야기는 <span class=\"cw\">더 큰 이야기</span>와 연결되어</div></div><div class=\"rc ckc\"><div class=\"e\">to generate <span class=\"cw\">new identities</span>.</div><div class=\"k\"><span class=\"cw\">새로운 정체성을</span> 생성한다.</div></div><div class=\"rnat\">개인의 이야기는 더 큰 이야기와 연결되어 새로운 정체성을 생성한다.</div><div class=\"rst\">〈주어진 문장〉 내 간식 취향이 더 큰 무리의 이야기와 만나면 “나는 ○○파!”라는 <b>새 정체성</b>이 생겨요. = 지문의 새로운 정체성 생성.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The growing complexity of the social dynamics</div><div class=\"k\">사회적 역학의 증가하는 복잡성은</div></div><div class=\"rc\"><div class=\"e\">determining food choices</div><div class=\"k\">식품 선택을 결정하는</div></div><div class=\"rc\"><div class=\"e\">makes the job of marketers and advertisers</div><div class=\"k\">마케팅 담당자와 광고주의 일을 만든다</div></div><div class=\"rc\"><div class=\"e\">increasingly more difficult.</div><div class=\"k\">점점 더 어렵게.</div></div><div class=\"rnat\">식품 선택을 결정하는 사회적 역학의 증가하는 복잡성은(복잡성이 증가하는 것은) 마케팅 담당자와 광고주의 일을 점점 더 어렵게 만든다.</div><div class=\"rst\">요즘 친구들이 간식을 고르는 이유가 너무 복잡해서, 과자 회사가 뭘 팔지 정하기가 점점 어려워요. = 지문 2번, 광고주의 일이 어려워짐.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In the past,</div><div class=\"k\">과거에</div></div><div class=\"rc\"><div class=\"e\">mass production allowed for accessibility and affordability of products,</div><div class=\"k\">대량 생산은 제품의 입수와 (구매) 비용의 감당을 가능하게 했다,</div></div><div class=\"rc\"><div class=\"e\">as well as their wide distribution,</div><div class=\"k\">그것들(= 제품)의 광범위한 유통뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">and was accepted as a sign of progress.</div><div class=\"k\">그리고 발전의 신호로 받아들여졌다.</div></div><div class=\"rnat\">과거에 대량 생산은 그것들(제품)의 광범위한 유통뿐만 아니라 제품의 입수와 (구매) 비용의 감당을 가능하게 했으며, 발전의 신호로 받아들여졌다.</div><div class=\"rst\"><b>예전엔</b>(In the past) 똑같은 과자를 잔뜩 만들어 싸게, 어디서나 팔았고 그게 발전이라고 여겼어요. = 지문 3번의 대량 생산.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Nowadays it is increasingly replaced</div><div class=\"k\">요즘 그것(= 대량 생산)은 갈수록 대체되고 있다</div></div><div class=\"rc\"><div class=\"e\">by the fragmentation of consumers</div><div class=\"k\">소비자의 파편화에 의해</div></div><div class=\"rc\"><div class=\"e\">among smaller and smaller segments</div><div class=\"k\">점점 더 작은 (규모의) 부문 사이에서의</div></div><div class=\"rc\"><div class=\"e\">that are supposed to reflect personal preferences.</div><div class=\"k\">개인의 선호를 반영해야 하는.</div></div><div class=\"rnat\">요즘 그것(대량 생산)은 개인의 선호를 반영해야 하는 점점 더 작은 (규모의) 부문 사이에서 소비자의 파편화에 의해 갈수록 대체되고 있다.</div><div class=\"rst\">요즘은 그 방식 대신, 친구들 취향마다 아주 작게 나눠서 팔아요. = 지문 4번, 소비자의 파편화가 대량 생산을 대체.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Everybody feels different and special</div><div class=\"k\">모든 사람은 (각자) 다르고 특별하다고 느끼고,</div></div><div class=\"rc\"><div class=\"e\">and expects products</div><div class=\"k\">제품을 기대한다</div></div><div class=\"rc\"><div class=\"e\">serving his or her inclinations.</div><div class=\"k\">자신의 기호를 만족시키는.</div></div><div class=\"rnat\">모든 사람은 (각자) 다르고 특별하다고 느끼고, 자신의 기호를 만족시키는 제품을 기대한다.</div><div class=\"rst\">다들 “내 입맛은 남들과 달라!” 하면서 딱 내 취향 간식을 원해요. = 지문 5번, 모두 다르고 특별하다고 느낀다.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">In reality,</div><div class=\"k\">현실에서,</div></div><div class=\"rc\"><div class=\"e\">these supposedly individual preferences</div><div class=\"k\">아마 개인적 선호라고 생각되는 이런 것들(= 앞에서 말한 개인의 선호와 기호)은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">end up overlapping with</span></div><div class=\"k\"><span class=\"cw\">결국 ~와 겹치게 된다</span></div></div><div class=\"rc\"><div class=\"e\">emerging, temporary, always changing, almost tribal formations</div><div class=\"k\">최근에 생겨나고, 일시적이며, 항상 바뀌고, 거의 부족적인 형성물과</div></div><div class=\"rc\"><div class=\"e\">solidifying around cultural sensibilities, social identifications,</div><div class=\"k\">문화적 감성, 사회 정체성,</div></div><div class=\"rc\"><div class=\"e\">political sensibilities, and dietary and health concerns.</div><div class=\"k\">정치적 감성, 그리고 식생활과 건강에 관한 관심사를 중심으로 확고해지는.</div></div><div class=\"rnat\">현실에서 아마 개인적 선호라고 생각되는 이런 것들은 결국 문화적 감성, 사회 정체성, 정치적 감성, 그리고 식생활과 건강에 관한 관심사를 중심으로 확고해지는, 최근에 생겨나고, 일시적이며, 항상 바뀌고, 거의 부족적인 형성물과 겹치게 된다.</div><div class=\"rst\"><b>그런데 현실에선</b>(In reality) 그 ‘나만의 취향’이 결국 건강 간식파, 매운맛파 같은 무리와 <b>겹쳐요</b>. = 지문 6번.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">These consumer communities</span></div><div class=\"k\"><span class=\"cw\">이들 소비자 집단</span>(= 새로운 정체성으로 묶인 소비자 집단)은</div></div><div class=\"rc\"><div class=\"e\">go beyond national boundaries,</div><div class=\"k\">국경을 초월하여,</div></div><div class=\"rc\"><div class=\"e\">feeding on global and widely shared repositories</div><div class=\"k\">전 세계의 널리 공유된 저장소로 인해 더 강화된다</div></div><div class=\"rc\"><div class=\"e\">of ideas, images, and practices.</div><div class=\"k\">생각, 이미지, 관습의.</div></div><div class=\"rnat\">이들 소비자 집단은 국경을 초월하여 생각, 이미지, 관습의 전 세계의 널리 공유된 저장소로 인해 더 강화된다.</div><div class=\"rst\"><b>이 무리들</b>(These consumer communities)은 나라도 넘어서, 전 세계가 함께 보는 사진·유행을 먹고 더 커져요. = 지문 7번.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"narrative\" data-m=\"이야기\"><b>narrative</b>이야기</button><button type=\"button\" class=\"wdb\" data-w=\"fragmentation\" data-m=\"파편화, 분열\"><b>fragmentation</b>파편화, 분열</button><button type=\"button\" class=\"wdb\" data-w=\"inclination\" data-m=\"기호, 성향\"><b>inclination</b>기호, 성향</button><button type=\"button\" class=\"wdb\" data-w=\"overlap\" data-m=\"겹치다, 중복되다\"><b>overlap</b>겹치다, 중복되다</button><button type=\"button\" class=\"wdb\" data-w=\"solidify\" data-m=\"확고해지다, 굳어지다\"><b>solidify</b>확고해지다, 굳어지다</button><button type=\"button\" class=\"wdb\" data-w=\"repositories\" data-m=\"저장소, 창고\"><b>repositories</b>저장소, 창고</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 제목은 <b>첫 문장의 화두</b>와 <b>글의 전개 순서</b>를 함께 보세요. 1번 “자본주의가 여가를 <b>만들었다</b>”(탄생) → 6번 확대·7번 상업화(발전)까지 둘 다 담은 제목이 정답이에요.</p><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · 화두 (탄생)</span><div class=\"en\">Industrial capitalism not only created work, it <mark>also created ‘leisure’</mark> in the modern sense of the term.</div><p class=\"ko\">산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라, 그 용어의 현대적 의미로 <mark>또한 ‘여가’를 만들어 냈다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>3번 However(그러나)로 일과 여가가 분리됐고, 5번이 그걸 한 줄로 정리해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 탄생의 정리</span><div class=\"en\">‘Leisure’ as a distinct non-work time … was <mark>a result of the disciplined and bounded work time</mark> created by capitalist production.</div><p class=\"ko\">별개의 비업무 시간으로서의 ‘여가’는 자본주의적인 생산 (방식)에 의해 만들어진 <mark>통제되고 제한된 근로 시간의 결과물이었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>노동조합 운동과 새 법으로 여가 시간이 확대</span><span><em>7~9번</em>여가의 상업화: 기업이 만든 여가 활동에 돈을 냄</span><span><em>10~11번</em>입장료 받는 스포츠, 거대한 여가 산업 등장</span></div><div class=\"ck-eq\">⇒ 6~11번의 공통점 = 생겨난 여가가 점점 커지고 바뀌어 감(발전)</div></div><div class=\"ck-via\"><i>▼</i><span>also(또한)·in another sense(다른 의미에서)로 ‘자본주의가 만든 여가’ 이야기를 한 번 더 이어 가요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 발전의 또 다른 축</span><div class=\"en\">Leisure was also <mark>the creation of capitalism</mark> in another sense, through <mark>the commercialization of leisure</mark>.</div><p class=\"ko\">여가는 또한 다른 의미에서, <mark>여가의 상업화를 통한</mark> <mark>자본주의의 산물이기도 했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">The Birth and Evolution of Leisure in Capitalism 자본주의에서 여가의 탄생과 발전<small>1~5번(탄생)과 6~11번(확대·상업화로 발전)을 둘 다 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Why Workers Have Struggled for More Leisure(왜 근로자들은 더 많은 여가를 위해 투쟁해 왔는가)</span><span class=\"why\">[범위 좁음] 6번 union campaigns(노동조합 운동)만 따온 함정이에요. 글은 여가가 생겨난 과정과 상업화까지 다뤄요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">What It Takes to Satisfy Workers(근로자를 만족시키기 위해 필요한 것)</span><span class=\"why\">[지문에 없음] 근로자를 만족시키는 방법은 나오지 않아요. 글의 주인공은 근로자가 아니라 leisure(여가)예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">How to Strike a Balance Between Work and Leisure(일과 여가 사이에 균형을 잡는 방법)</span><span class=\"why\">[지문에 없음] 3번은 일과 여가가 분리된 역사이지, 둘의 균형을 잡는 방법을 알려 주는 글이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">The Light and Dark Sides of the Modern Leisure Industry(현대 여가 산업의 명암)</span><span class=\"why\">[범위 좁음] 여가 산업은 10·11번에만 나오고, 그것도 커졌다는 말뿐 나쁜 면(dark sides 어두운 면)은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Industrial capitalism not only created work,</div><div class=\"k\">산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라,</div></div><div class=\"rc ckc\"><div class=\"e\">it <span class=\"cw\">also created ‘leisure’</span></div><div class=\"k\"><span class=\"cw\">또한 ‘여가’를 만들어 냈다</span></div></div><div class=\"rc\"><div class=\"e\">in the modern sense of the term.</div><div class=\"k\">그 용어의 현대적 의미로.</div></div><div class=\"rnat\">산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라, 또한 그 용어의 현대적 의미로 ‘여가’를 만들어 냈다(현대적인 의미의 ‘여가’ 개념을 만들었다).</div><div class=\"rst\">학교가 생기면서 ‘공부 시간’뿐 아니라 <b>‘쉬는 시간’도 생겼어요</b>. = 지문 1번, 산업 자본주의가 일과 함께 현대적 여가를 만들었다.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This might seem surprising,</div><div class=\"k\">이것(= 산업 자본주의가 현대적 의미의 여가를 만들어 냈다는 것)은 놀랍게 보일지도 모른다,</div></div><div class=\"rc\"><div class=\"e\">for the early cotton masters wanted</div><div class=\"k\">왜냐하면 초기 면직 공장주들은 원했고</div></div><div class=\"rc\"><div class=\"e\">to keep their machinery running</div><div class=\"k\">그들(= 초기 면직 공장주들)의 기계가 계속 가동되기를</div></div><div class=\"rc\"><div class=\"e\">as long as possible</div><div class=\"k\">가능한 한 오랫동안</div></div><div class=\"rc\"><div class=\"e\">and forced their employees</div><div class=\"k\">그리고 그들(= 초기 면직 공장주들)의 직원들에게 강요했기 때문이다</div></div><div class=\"rc\"><div class=\"e\">to work very long hours.</div><div class=\"k\">아주 장시간 일하도록.</div></div><div class=\"rnat\">이것(산업 자본주의가 현대적 의미의 ‘여가’를 이끌었다는 사실)은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.</div><div class=\"rst\">이상하죠? 옛날 공장 주인처럼 교장 쌤도 수업을 최대한 길게 하고 싶어 했거든요. = 지문 2번, 공장주가 장시간 노동을 강요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">그러나,</div></div><div class=\"rc\"><div class=\"e\">by requiring continuous work during work hours</div><div class=\"k\">근무 시간 동안 계속되는 작업을 요구하고</div></div><div class=\"rc\"><div class=\"e\">and ruling out non-work activity,</div><div class=\"k\">비업무 활동을 배제함으로써,</div></div><div class=\"rc\"><div class=\"e\">employers had (a) separated out leisure from work.</div><div class=\"k\">고용주들은 여가를 업무와 (a) 분리시켰다.</div></div><div class=\"rnat\">그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 (a)분리시켰다.</div><div class=\"rst\"><b>그러나</b>(However) 수업 중엔 딴짓을 막고 공부만 하게 하니, 오히려 쉬는 시간이 수업과 딱 <b>나뉘었어요</b>. = 지문 3번의 분리.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Some did this quite explicitly</div><div class=\"k\">일부(= 일부 고용주들)는 이것(= 여가를 일에서 분리하는 것)을 꽤 명시적으로 했다</div></div><div class=\"rc\"><div class=\"e\">by creating distinct holiday periods,</div><div class=\"k\">별개의 휴가 기간을 만듦으로써,</div></div><div class=\"rc\"><div class=\"e\">when factories were shut down,</div><div class=\"k\">그 기간에는 공장들이 문을 닫았다,</div></div><div class=\"rc\"><div class=\"e\">because it was better to do this</div><div class=\"k\">왜냐하면 이렇게 하는 것(= 별개의 휴가 기간을 만드는 것)이 더 나았기 때문이다</div></div><div class=\"rc\"><div class=\"e\">than have work (b) disrupted</div><div class=\"k\">일이 (b) 중단되게 하는 것보다 ※ 문제지엔 promoted로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">by the casual taking of days off.</div><div class=\"k\">비정기적인 휴가를 내는 것으로 인해.</div></div><div class=\"rnat\">일부는 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 왜냐하면 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일을 (b)진척시키는(→ 중단시키는) 것보다 더 나았기 때문이다.</div><div class=\"rst\">아예 방학을 정해 학교 문을 닫았어요. 아무 때나 빠지면 수업이 끊기니, 정해 쉬는 게 낫거든요. = 지문 4번의 휴가 기간.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">‘Leisure’ as a distinct non-work time,</div><div class=\"k\">별개의 비업무 시간으로서의 ‘여가’는,</div></div><div class=\"rc\"><div class=\"e\">whether in the form of the holiday, weekend, or evening,</div><div class=\"k\">휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에,</div></div><div class=\"rc ckc\"><div class=\"e\">was <span class=\"cw\">a result of the disciplined and bounded work time</span></div><div class=\"k\"><span class=\"cw\">통제되고 제한된 근로 시간의 결과물이었다</span></div></div><div class=\"rc\"><div class=\"e\">created by capitalist production.</div><div class=\"k\">자본주의적인 생산 (방식)에 의해 만들어진.</div></div><div class=\"rnat\">별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 (방식)에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다.</div><div class=\"rst\">그래서 방학·주말·저녁 같은 쉬는 시간은 <b>딱 정해진 공부 시간의 결과</b>예요. = 지문 5번, 여가는 통제된 근로 시간의 결과물.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Workers then wanted more leisure</div><div class=\"k\">그 후 근로자들은 더 많은 여가를 원했고</div></div><div class=\"rc\"><div class=\"e\">and leisure time was enlarged by union campaigns,</div><div class=\"k\">여가 시간은 노동조합 운동에 의해 확대되었는데,</div></div><div class=\"rc\"><div class=\"e\">which first started in the cotton industry,</div><div class=\"k\">이것(= 노동조합 운동)은 면직물 산업에서 처음 시작되었다,</div></div><div class=\"rc\"><div class=\"e\">and eventually new laws were passed</div><div class=\"k\">그리고 결국 새로운 법이 통과되었다</div></div><div class=\"rc\"><div class=\"e\">that (c) limited the hours of work</div><div class=\"k\">근무 시간을 (c) 제한하고</div></div><div class=\"rc\"><div class=\"e\">and gave workers holiday entitlements.</div><div class=\"k\">근로자들에게 휴가 권리를 부여하는.</div></div><div class=\"rnat\">그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 노동조합 운동에 의해 확대되었는데, 이는 면직물 산업에서 처음 시작되어서, 결국 근무 시간을 (c)제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다.</div><div class=\"rst\">그 뒤 학생회가 “쉬는 시간 더 줘요!” 운동을 해서 규칙이 바뀌고 공부 시간이 줄었어요. = 지문 6번의 노동조합 운동과 새 법.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\">Leisure was also <span class=\"cw\">the creation of capitalism</span></div><div class=\"k\">여가는 또한 <span class=\"cw\">자본주의의 산물이기도 했다</span></div></div><div class=\"rc\"><div class=\"e\">in another sense,</div><div class=\"k\">다른 의미에서,</div></div><div class=\"rc ckc\"><div class=\"e\">through <span class=\"cw\">the commercialization of leisure</span>.</div><div class=\"k\"><span class=\"cw\">여가의 상업화를 통한</span>.</div></div><div class=\"rnat\">다른 의미에서 여가는 또한 여가의 상업화를 통한 자본주의의 산물이기도 했다.</div><div class=\"rst\">쉬는 시간은 <b>또 다른 의미에서도</b> 어른들이 만든 거예요. 바로 쉬는 걸 <b>돈 주고 사게</b> 된 것! = 지문 7번, 여가의 상업화.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">This no longer meant participation</div><div class=\"k\">이것(= 여가)은 더 이상 참여하는 것을 의미하지 않았다</div></div><div class=\"rc\"><div class=\"e\">in traditional sports and pastimes.</div><div class=\"k\">전통적인 스포츠나 오락에.</div></div><div class=\"rnat\">이는(여가는) 전통적인 스포츠나 오락에 참여하는 것을 더 이상 의미하지 않았다.</div><div class=\"rst\">이제 쉬는 시간은 운동장에서 하던 옛날 놀이만 뜻하지 않아요. = 지문 8번, 전통 스포츠·오락 참여가 아니게 됨.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">Workers began to (d) pay for leisure activities</div><div class=\"k\">근로자들은 여가 활동에 (d) 돈을 지불하기 시작했다</div></div><div class=\"rc\"><div class=\"e\">organized by capitalist enterprises.</div><div class=\"k\">자본주의적인 기업들에 의해 조직된.</div></div><div class=\"rnat\">근로자들은 자본주의적인 기업들에 의해 조직된 여가 활동에 (d)돈을 지불하기 시작했다.</div><div class=\"rst\">친구들은 회사가 만든 키즈카페·놀이공원에 돈을 내고 놀기 시작해요. = 지문 9번, 기업이 조직한 여가 활동에 돈을 지불.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Mass travel to spectator sports,</div><div class=\"k\">관중 (동원력이 큰) 스포츠로의 대중의 이동이,</div></div><div class=\"rc\"><div class=\"e\">especially football and horse-racing,</div><div class=\"k\">특히 축구와 경마,</div></div><div class=\"rc\"><div class=\"e\">where people could be charged for entry,</div><div class=\"k\">사람들이 입장하는 데 요금이 부과될 수 있는,</div></div><div class=\"rc\"><div class=\"e\">was now possible.</div><div class=\"k\">이제 가능해졌다.</div></div><div class=\"rnat\">사람들이 입장하는 데 요금이 부과될 수 있는(입장료를 받을 수 있는) 관중 (동원력이 큰) 스포츠, 특히 축구와 경마로의 대중의 이동이 이제 가능해졌다.</div><div class=\"rst\">입장료를 내고 야구장·축구장에 우르르 몰려가는 것도 가능해졌어요. = 지문 10번, 입장료 받는 관중 스포츠로의 이동.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The importance of this can hardly be exaggerated,</div><div class=\"k\">이것(= 앞에서 말한 여가의 상업화)의 중요성은 아무리 과장해도 지나치지 않다,</div></div><div class=\"rc\"><div class=\"e\">for whole new industries were emerging</div><div class=\"k\">왜냐하면 완전히 새로운 산업들이 출현하고 있었기 때문이다</div></div><div class=\"rc\"><div class=\"e\">to exploit and (e) develop the leisure market,</div><div class=\"k\">여가 시장을 개발하고 (e) 발전시키기 위해,</div></div><div class=\"rc\"><div class=\"e\">which was to become a huge source</div><div class=\"k\">그리고 그것(= 여가 시장)은 거대한 원천이 될 것이었다</div></div><div class=\"rc\"><div class=\"e\">of consumer demand, employment, and profit.</div><div class=\"k\">소비자 수요, 고용 그리고 이익의.</div></div><div class=\"rnat\">이것은 매우 중요한데, 왜냐하면 완전히 새로운 산업들이 여가 시장을 개발하고 (e)발전시키기 위해 출현하고 있었고, 여가 시장은 소비자 수요, 고용 그리고 이익의 거대한 원천이 될 것이었기 때문이다.</div><div class=\"rst\">그래서 놀거리를 파는 회사가 엄청 많아지고 큰돈을 벌게 돼요. = 지문 11번, 여가 시장이 수요·고용·이익의 거대한 원천.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"industrial capitalism\" data-m=\"산업 자본주의\"><b>industrial capitalism</b>산업 자본주의</button><button type=\"button\" class=\"wdb\" data-w=\"pastimes\" data-m=\"오락, 취미\"><b>pastimes</b>오락, 취미</button><button type=\"button\" class=\"wdb\" data-w=\"distinct\" data-m=\"별개의, 뚜렷한\"><b>distinct</b>별개의, 뚜렷한</button><button type=\"button\" class=\"wdb\" data-w=\"enlarge\" data-m=\"확대하다, 늘리다\"><b>enlarge</b>확대하다, 늘리다</button><button type=\"button\" class=\"wdb\" data-w=\"entitlement\" data-m=\"권리, 자격\"><b>entitlement</b>권리, 자격</button><button type=\"button\" class=\"wdb\" data-w=\"commercialization\" data-m=\"상업화\"><b>commercialization</b>상업화</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">4번은 <b>better A than B</b>(B보다 A가 낫다) 비교예요. B는 고용주가 피하고 싶은 <b>나쁜 일</b>이어야 하니, 좋은 쪽 낱말 promoted(진척된)가 방향과 어긋나요.</p><div class=\"ck-step\"><span class=\"lab\">4번 · 비교 구조</span><div class=\"en\">Some did this quite explicitly by creating distinct holiday periods, <mark>when factories were shut down</mark>, <mark>because it was better to do this</mark> …</div><p class=\"ko\">일부는 별개의 휴가 기간을 만들었다, <mark>그 기간에는 공장들이 문을 닫았다</mark>, 왜냐하면 이렇게 하는 것이 <mark>더 나았기 때문이다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>than(~보다) 뒤는 정해진 휴가보다 더 나쁜 상황이어야 해요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 · 결정적 단서</span><div class=\"en\">… than have work (b) … by <mark>the casual taking of days off</mark>.</div><p class=\"ko\"><mark>비정기적인 휴가를 내는 것으로 인해</mark> 일이 (b) ~되게 하는 것보다</p></div><div class=\"ck-via\"><i>▼</i><span>아무 때나 빠지는데 일이 진척된다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 (b)번 자리 (4번)</span><div class=\"en\">… than have work <u>(b) promoted</u> by the casual taking of days off.</div><p class=\"ko\">비정기적인 휴가로 일이 ( 진척되게? ) 하는 것보다 → 중단되게가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>공장주는 기계를 오래 돌리고 싶어 했으니, 들쭉날쭉한 휴가는 일을 방해하는 것</span></div><div class=\"ck-step\"><span class=\"lab\">2번 · 고용주의 바람 확인</span><div class=\"en\">… the early cotton masters wanted <mark>to keep their machinery running as long as possible</mark> …</div><p class=\"ko\">초기 면직 공장주들은 그들의 <mark>기계가 계속 가동되기를</mark> 가능한 한 오랫동안 원했다 …</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">promoted(진척된) ↔ disrupted(중단된)</p><p class=\"gr\">better A than B(B보다 A가 낫다)에서 B는 피하고 싶은 나쁜 결과예요. 그래서 B 자리에는 promoted(진척된) 같은 좋은 말이 아니라 disrupted(중단된) 같은 나쁜 말이 와야 해요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It is better to rest on Sunday than have my study disrupted every day.</div><div class=\"ko\">매일 공부가 끊기는 것보다 일요일에 쉬는 게 나아요. (나쁜 결과 → disrupted)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It is better to rest on Sunday than have my study promoted every day.</div><div class=\"ko\">매일 공부가 잘되는 것보다 쉬는 게 낫다? 비교 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Too much noise disrupted our class.</div><div class=\"ko\">너무 큰 소음이 우리 수업을 중단시켰어요. (방해 → disrupted)</div></div><p class=\"gb\">지문 4번도 아무 때나 휴가를 내면(the casual taking of days off 비정기적인 휴가) 일이 끊기니, (b)는 promoted(진척된)가 아니라 disrupted(중단된)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(b) promoted → disrupted (중단된)<small>아무 때나 쉬면 일이 끊기니, 정해진 휴가가 더 낫다는 말이 돼야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) separated 분리했다</span><span class=\"why\">3번에서 근무 중엔 계속 일하게 하고 ruling out non-work activity(비업무 활동을 배제)했으니, 일과 여가가 나뉜 게 맞아요. separated(분리했다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) limited 제한했다</span><span class=\"why\">6번에서 근로자들이 more leisure(더 많은 여가)를 원했고 휴가 권리도 줬으니, 근무 시간은 limited(제한했다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) pay 지불하다</span><span class=\"why\">7번 commercialization(상업화)와 10번 charged for entry(입장료가 부과된)처럼, 여가를 돈 주고 사는 이야기라 pay(지불하다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) develop 개발하다</span><span class=\"why\">11번에서 새 산업들이 생겨나 여가 시장이 a huge source(거대한 원천)가 됐으니, 시장을 develop(개발하다)하는 게 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Industrial capitalism not only created work,</div><div class=\"k\">산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">it also created ‘leisure’</div><div class=\"k\">또한 ‘여가’를 만들어 냈다</div></div><div class=\"rc\"><div class=\"e\">in the modern sense of the term.</div><div class=\"k\">그 용어의 현대적 의미로.</div></div><div class=\"rnat\">산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라, 또한 그 용어의 현대적 의미로 ‘여가’를 만들어 냈다(현대적인 의미의 ‘여가’ 개념을 만들었다).</div><div class=\"rst\">학교가 생기면서 ‘공부 시간’뿐 아니라 <b>‘쉬는 시간’도 생겼어요</b>. = 지문 1번, 산업 자본주의가 일과 함께 현대적 여가를 만들었다.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This might seem surprising,</div><div class=\"k\">이것(= 산업 자본주의가 현대적 의미의 여가를 만들어 냈다는 것)은 놀랍게 보일지도 모른다,</div></div><div class=\"rc\"><div class=\"e\">for the early cotton masters wanted</div><div class=\"k\">왜냐하면 초기 면직 공장주들은 원했고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to keep their machinery running</span></div><div class=\"k\"><span class=\"cw\">그들(= 초기 면직 공장주들)의 기계가 계속 가동되기를</span></div></div><div class=\"rc\"><div class=\"e\">as long as possible</div><div class=\"k\">가능한 한 오랫동안</div></div><div class=\"rc\"><div class=\"e\">and forced their employees</div><div class=\"k\">그리고 그들(= 초기 면직 공장주들)의 직원들에게 강요했기 때문이다</div></div><div class=\"rc\"><div class=\"e\">to work very long hours.</div><div class=\"k\">아주 장시간 일하도록.</div></div><div class=\"rnat\">이것(산업 자본주의가 현대적 의미의 ‘여가’를 이끌었다는 사실)은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.</div><div class=\"rst\">이상하죠? 옛날 공장 주인처럼 교장 쌤도 수업을 최대한 길게 하고 싶어 했거든요. = 지문 2번, 공장주가 장시간 노동을 강요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">그러나,</div></div><div class=\"rc\"><div class=\"e\">by requiring continuous work during work hours</div><div class=\"k\">근무 시간 동안 계속되는 작업을 요구하고</div></div><div class=\"rc\"><div class=\"e\">and ruling out non-work activity,</div><div class=\"k\">비업무 활동을 배제함으로써,</div></div><div class=\"rc\"><div class=\"e\">employers had (a) separated out leisure from work.</div><div class=\"k\">고용주들은 여가를 업무와 (a) 분리시켰다.</div></div><div class=\"rnat\">그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 (a)분리시켰다.</div><div class=\"rst\"><b>그러나</b>(However) 수업 중엔 딴짓을 막고 공부만 하게 하니, 오히려 쉬는 시간이 수업과 딱 <b>나뉘었어요</b>. = 지문 3번의 분리.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Some did this quite explicitly</div><div class=\"k\">일부(= 일부 고용주들)는 이것(= 여가를 일에서 분리하는 것)을 꽤 명시적으로 했다</div></div><div class=\"rc\"><div class=\"e\">by creating distinct holiday periods,</div><div class=\"k\">별개의 휴가 기간을 만듦으로써,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">when factories were shut down</span>,</div><div class=\"k\"><span class=\"cw\">그 기간에는 공장들이 문을 닫았다</span>,</div></div><div class=\"rc\"><div class=\"e\">because it was better to do this</div><div class=\"k\">왜냐하면 이렇게 하는 것(= 별개의 휴가 기간을 만드는 것)이 더 나았기 때문이다</div></div><div class=\"rc ckc\"><div class=\"e\">than have work (b) <span class=\"cw\">disrupted</span></div><div class=\"k\">일이 (b) <span class=\"cw\">중단되게</span> 하는 것보다 ※ 문제지엔 promoted로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\">by <span class=\"cw\">the casual taking of days off</span>.</div><div class=\"k\"><span class=\"cw\">비정기적인 휴가를 내는 것으로 인해</span>.</div></div><div class=\"rnat\">일부는 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 왜냐하면 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일을 (b)진척시키는(→ 중단시키는) 것보다 더 나았기 때문이다.</div><div class=\"rst\">아예 방학을 정해 문을 닫았어요. 아무 때나 빠지면 수업이 <b>끊기니까</b>(disrupted) 정해 쉬는 게 낫죠. = 지문 4번, (b)는 promoted(진척된)가 아니에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">‘Leisure’ as a distinct non-work time,</div><div class=\"k\">별개의 비업무 시간으로서의 ‘여가’는,</div></div><div class=\"rc\"><div class=\"e\">whether in the form of the holiday, weekend, or evening,</div><div class=\"k\">휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에,</div></div><div class=\"rc\"><div class=\"e\">was a result of the disciplined and bounded work time</div><div class=\"k\">통제되고 제한된 근로 시간의 결과물이었다</div></div><div class=\"rc\"><div class=\"e\">created by capitalist production.</div><div class=\"k\">자본주의적인 생산 (방식)에 의해 만들어진.</div></div><div class=\"rnat\">별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 (방식)에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다.</div><div class=\"rst\">그래서 방학·주말·저녁 같은 쉬는 시간은 <b>딱 정해진 공부 시간의 결과</b>예요. = 지문 5번, 여가는 통제된 근로 시간의 결과물.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Workers then wanted more leisure</div><div class=\"k\">그 후 근로자들은 더 많은 여가를 원했고</div></div><div class=\"rc\"><div class=\"e\">and leisure time was enlarged by union campaigns,</div><div class=\"k\">여가 시간은 노동조합 운동에 의해 확대되었는데,</div></div><div class=\"rc\"><div class=\"e\">which first started in the cotton industry,</div><div class=\"k\">이것(= 노동조합 운동)은 면직물 산업에서 처음 시작되었다,</div></div><div class=\"rc\"><div class=\"e\">and eventually new laws were passed</div><div class=\"k\">그리고 결국 새로운 법이 통과되었다</div></div><div class=\"rc\"><div class=\"e\">that (c) limited the hours of work</div><div class=\"k\">근무 시간을 (c) 제한하고</div></div><div class=\"rc\"><div class=\"e\">and gave workers holiday entitlements.</div><div class=\"k\">근로자들에게 휴가 권리를 부여하는.</div></div><div class=\"rnat\">그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 노동조합 운동에 의해 확대되었는데, 이는 면직물 산업에서 처음 시작되어서, 결국 근무 시간을 (c)제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다.</div><div class=\"rst\">그 뒤 학생회가 “쉬는 시간 더 줘요!” 운동을 해서 규칙이 바뀌고 공부 시간이 줄었어요. = 지문 6번의 노동조합 운동과 새 법.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Leisure was also the creation of capitalism</div><div class=\"k\">여가는 또한 자본주의의 산물이기도 했다</div></div><div class=\"rc\"><div class=\"e\">in another sense,</div><div class=\"k\">다른 의미에서,</div></div><div class=\"rc\"><div class=\"e\">through the commercialization of leisure.</div><div class=\"k\">여가의 상업화를 통한.</div></div><div class=\"rnat\">다른 의미에서 여가는 또한 여가의 상업화를 통한 자본주의의 산물이기도 했다.</div><div class=\"rst\">쉬는 시간은 <b>또 다른 의미에서도</b> 어른들이 만든 거예요. 바로 쉬는 걸 <b>돈 주고 사게</b> 된 것! = 지문 7번, 여가의 상업화.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">This no longer meant participation</div><div class=\"k\">이것(= 여가)은 더 이상 참여하는 것을 의미하지 않았다</div></div><div class=\"rc\"><div class=\"e\">in traditional sports and pastimes.</div><div class=\"k\">전통적인 스포츠나 오락에.</div></div><div class=\"rnat\">이는(여가는) 전통적인 스포츠나 오락에 참여하는 것을 더 이상 의미하지 않았다.</div><div class=\"rst\">이제 쉬는 시간은 운동장에서 하던 옛날 놀이만 뜻하지 않아요. = 지문 8번, 전통 스포츠·오락 참여가 아니게 됨.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Workers began to (d) pay for leisure activities</div><div class=\"k\">근로자들은 여가 활동에 (d) 돈을 지불하기 시작했다</div></div><div class=\"rc\"><div class=\"e\">organized by capitalist enterprises.</div><div class=\"k\">자본주의적인 기업들에 의해 조직된.</div></div><div class=\"rnat\">근로자들은 자본주의적인 기업들에 의해 조직된 여가 활동에 (d)돈을 지불하기 시작했다.</div><div class=\"rst\">친구들은 회사가 만든 키즈카페·놀이공원에 돈을 내고 놀기 시작해요. = 지문 9번, 기업이 조직한 여가 활동에 돈을 지불.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Mass travel to spectator sports,</div><div class=\"k\">관중 (동원력이 큰) 스포츠로의 대중의 이동이,</div></div><div class=\"rc\"><div class=\"e\">especially football and horse-racing,</div><div class=\"k\">특히 축구와 경마,</div></div><div class=\"rc\"><div class=\"e\">where people could be charged for entry,</div><div class=\"k\">사람들이 입장하는 데 요금이 부과될 수 있는,</div></div><div class=\"rc\"><div class=\"e\">was now possible.</div><div class=\"k\">이제 가능해졌다.</div></div><div class=\"rnat\">사람들이 입장하는 데 요금이 부과될 수 있는(입장료를 받을 수 있는) 관중 (동원력이 큰) 스포츠, 특히 축구와 경마로의 대중의 이동이 이제 가능해졌다.</div><div class=\"rst\">입장료를 내고 야구장·축구장에 우르르 몰려가는 것도 가능해졌어요. = 지문 10번, 입장료 받는 관중 스포츠로의 이동.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The importance of this can hardly be exaggerated,</div><div class=\"k\">이것(= 앞에서 말한 여가의 상업화)의 중요성은 아무리 과장해도 지나치지 않다,</div></div><div class=\"rc\"><div class=\"e\">for whole new industries were emerging</div><div class=\"k\">왜냐하면 완전히 새로운 산업들이 출현하고 있었기 때문이다</div></div><div class=\"rc\"><div class=\"e\">to exploit and (e) develop the leisure market,</div><div class=\"k\">여가 시장을 개발하고 (e) 발전시키기 위해,</div></div><div class=\"rc\"><div class=\"e\">which was to become a huge source</div><div class=\"k\">그리고 그것(= 여가 시장)은 거대한 원천이 될 것이었다</div></div><div class=\"rc\"><div class=\"e\">of consumer demand, employment, and profit.</div><div class=\"k\">소비자 수요, 고용 그리고 이익의.</div></div><div class=\"rnat\">이것은 매우 중요한데, 왜냐하면 완전히 새로운 산업들이 여가 시장을 개발하고 (e)발전시키기 위해 출현하고 있었고, 여가 시장은 소비자 수요, 고용 그리고 이익의 거대한 원천이 될 것이었기 때문이다.</div><div class=\"rst\">그래서 놀거리를 파는 회사가 엄청 많아지고 큰돈을 벌게 돼요. = 지문 11번, 여가 시장이 수요·고용·이익의 거대한 원천.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"casual\" data-m=\"격식 없는, 일시적인\"><b>casual</b>격식 없는, 일시적인</button><button type=\"button\" class=\"wdb\" data-w=\"shut down\" data-m=\"문을 닫다\"><b>shut down</b>문을 닫다</button><button type=\"button\" class=\"wdb\" data-w=\"disrupted\" data-m=\"중단된, 지장을 받은\"><b>disrupted</b>중단된, 지장을 받은</button><button type=\"button\" class=\"wdb\" data-w=\"entitlement\" data-m=\"권리, 자격\"><b>entitlement</b>권리, 자격</button><button type=\"button\" class=\"wdb\" data-w=\"charged\" data-m=\"(요금이) 부과된\"><b>charged</b>(요금이) 부과된</button><button type=\"button\" class=\"wdb\" data-w=\"exaggerated\" data-m=\"과장된\"><b>exaggerated</b>과장된</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" data-q="'+d.no+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
