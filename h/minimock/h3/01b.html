<title>고3 미니모의고사 1회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}
.evx .en{background:#fff;border:1px solid #d5eadc;font-size:15.5px;margin:0 0 8px}
.evx p{margin:6px 0;font-size:15.5px;line-height:1.75}
.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}
.ch.open .ct{display:block}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}
.sc .ce{font-size:18px;line-height:1.5;font-weight:800;color:#c62828}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}
.rst:before{content:"결국 이 얘기  ";font-size:11.5px;font-weight:800;color:#8a6d00}

.wc{padding:14px 0;border-bottom:1px solid var(--line)}

(function(W){

  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);

    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});

    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}

  },del:DEL,gate:gate,flush:flush,name:name};

})(window);

var D=[{"no": "07", "typ": "빈칸 추론", "src": "2018년 3월 32번", "evn": [1, 4], "ev_en": "Sculpture in a public place is the emotional and aesthetic focal point of the elements in the surrounding environment. / The proper understanding of the spatial characteristics of the elements, making up the whole multitude, as well as of the structural links between the constituent elements of this specific microcosm are preconditions for satisfactory design and an adequate sculptural solution.", "ev_ko": [[1, "공공장소의 조형물은 주위 환경에 있는 요소들의 정서적이고 심미적인 중심이다."], [4, "이 특정한 작은 세계의 구성 요소들 사이의 구조적 연결뿐만 아니라, 전체 다수(총체)를 구성하는 요소들의 공간적 특징에 대한 적절한 이해는 만족스러운 설계와 적절한 조형적 해법을 위한 전제 조건이다."]], "why": ["빈칸 문장은 조형물을 세울 장소를 미리 분석하고 아는 것이 무엇을 위한 요건인지를 말합니다", "(1)에서 조형물은 주위 환경 요소들의 <b>중심(focal point)<\/b>이라고 합니다", "(4)에서는 요소들의 공간적 특징과 구조적 연결을 제대로 이해하는 것이 만족스러운 설계의 <b>전제 조건<\/b>이라고 합니다", "즉 조형물이 그 장소와 잘 어우러져야 한다는 말입니다", "그래서 빈칸에는 ① <b>successful integration in the specific space<\/b>(특정 장소에의 성공적인 통합)가 알맞습니다."], "ch": [{"n": "①", "t": "successful integration in the specific space", "g": "특정 장소에의 성공적인 통합", "ok": true, "e": ["(4)에서 장소의 공간적 특징과 구조적 연결을 제대로 이해해야 만족스러운 설계가 된다고 합니다", "조형물이 그 장소에 잘 녹아들어야 한다는 뜻이므로 '특정 장소에의 성공적인 통합'이 알맞습니다."]}, {"n": "②", "t": "applying mechanical theories to architecture", "g": "기계적 이론을 건축학에 적용하는 것", "ok": false, "e": ["글의 mechanical은 '요소 하나를 기계적으로 더 보태는 것'을 가리킵니다", "필자는 그보다 기존 구조 속에 엮어 넣는 것이 더 낫다고 말합니다", "기계적 이론이나 건축학에 관한 이야기는 없습니다."]}, {"n": "③", "t": "true understanding of the human psychology", "g": "인간 심리에 대한 진정한 이해", "ok": false, "e": ["글에서 이해해야 한다고 말하는 것은 요소들의 공간적 특징과 구조적 연결입니다(4번)", "인간 심리에 대한 이야기는 나오지 않습니다."]}, {"n": "④", "t": "exact evaluation of the property’s future value", "g": "재산의 미래 가치에 대한 정확한 평가", "ok": false, "e": ["재산의 가치나 그 평가에 관한 내용은 글에 없습니다."]}, {"n": "⑤", "t": "creating a commercial space for multiple purposes", "g": "다양한 목적을 위한 상업적인 공간을 만드는 것", "ok": false, "e": ["상업 공간이나 여러 용도에 관한 내용은 글에 없습니다", "multitude(다수)는 요소들의 모임을 가리키는 말이고, '다양한 목적'과는 관계가 없습니다."]}], "tr 제품)입니다", "그 사이에 주어진 문장이 끼면 이 연결이 끊어집니다."]}, {"n": "⑤", "t": "⑤ 자리", "g": "", "ok": true, "e": ["⑤는 문장 (6)과 (7) 사이입니다", "(6)의 집단적 형성물을 주어진 문장이 '더 큰 이야기와 새로운 정체성'으로 정리합니다", "이어서 (7)의 These consumer communities가 그 새로운 정체성 집단을 받습니다."]}], "tr": ["개인의 이야기는 더 큰 이야기와 연결되어 새로운 정체성을 생성한다.", "식품 선택을 결정하는 사회적 역학의 증가하는 복잡성은(복잡성이 증가하는 것은) 마케팅 담당자와 광고주의 일을 점점 더 어렵게 만든다.", "과거에 대량 생산은 그것들(제품)의 광범위한 유통뿐만 아니라 제품의 입수와 (구매) 비용의 감당을 가능하게 했으며, 발전의 신호로 받아들여졌다.", "요즘 그것(대량 생산)은 개인의 선호를 반영해야 하는 점점 더 작은 (규모의) 부문 사이에서 소비자의 파편화에 의해 갈수록 대체되고 있다.", "모든 사람은 (각자) 다르고 특별하다고 느끼고, 자신의 기호를 만족시키는 제품을 기대한다.", "현실에서 아마 개인적 선호라고 생각되는 이런 것들은 결국 문화적 감성, 사회 정체성, 정치적 감성, 그리고 식생활과 건강에 관한 관심사를 중심으로 확고해지는, 최근에 생겨나고, 일시적이며, 항상 바뀌고, 거의 부족적인 형성물과 겹치게 된다.", "이들 소비자 집단은 국경을 초월하여 생각, 이미지, 관습의 전 세계의 널리 공유된 저장소로 인해 더 강화된다."], "ps": [{"n": 1, "ch": [{"e": "Personal stories connect with larger <b>narratives<\/b>", "k": "개인의 이야기는 더 큰 이야기와 연결되어"}, {"e": "to generate new identities.", "k": "새로운 정체성을 생성한다."}], "easy": "한 사람 한 사람의 이야기가 더 큰 이야기와 이어지면서 새로운 정체성이 생겨나요.", "gist": "주어진 문장이에요. 개인의 선호가 집단의 정체성으로 이어지는 연결 고리예요."}, {"n": 2, "ch": [{"e": "The growing complexity of the social dynamics", "k": "사회적 역학의 증가하는 복잡성은"}, {"e": "determining food choices", "k": "식품 선택을 결정하는"}, {"e": "makes the job of marketers and advertisers", "k": "마케팅 담당자와 광고주의 일을 만든다"}, {"e": "increasingly more difficult.", "k": "점점 더 어렵게."}], "link": "식품 선택을 결정하는 사회적 역학의 증가하는 복잡성은 마케팅 담당자와 광고주의 일을 점점 더 어렵게 만든다.", "easy": "사람들이 어떤 음식을 고르는지에 영향을 주는 사회적 요인이 복잡해져서, 마케터와 광고주의 일이 점점 어려워지고 있어요.", "gist": "글의 화제예요. 마케팅 담당자와 광고주의 일이 점점 어려워진다고 말해요."}, {"n": 3, "ch": [{"e": "<b>In the past<\/b>,", "k": "과거에"}, {"e": "mass production allowed for accessibility and affordability of products,", "k": "대량 생산은 제품의 입수와 (구매) 비용의 감당을 가능하게 했다,"}, {"e": "as well as their wide distribution,", "k": "그것들<span class=\"r\">(= 제품)<\/span>의 광범위한 유통뿐만 아니라,"}, {"e": "and was accepted as a sign of progress.", "k": "그리고 발전의 신호로 받아들여졌다."}], "link": "과거에 대량 생산은 제품의 광범위한 유통뿐만 아니라 제품의 입수와 (구매) 비용의 감당을 가능하게 했으며, 발전의 신호로 받아들여졌다.", "easy": "옛날에는 대량 생산 덕분에 제품을 쉽게 구하고 부담 없이 살 수 있었고, 제품이 널리 퍼졌어요. 그래서 대량 생산은 발전의 신호로 여겨졌어요.", "gist": "과거의 모습이에요. 대량 생산이 환영받던 시절을 보여 줘요."}, {"n": 4, "ch": [{"e": "<b>Nowadays<\/b> it is increasingly replaced", "k": "요즘 그것<span class=\"r\">(= 대량 생산)<\/span>은 갈수록 대체되고 있다"}, {"e": "by the <b>fragmentation<\/b> of consumers", "k": "소비자의 파편화에 의해"}, {"e": "among smaller and smaller segments", "k": "점점 더 작은 (규모의) 부문 사이에서의"}, {"e": "that are supposed to reflect personal preferences.", "k": "개인의 선호를 반영해야 하는."}], "link": "요즘 그것은 개인의 선호를 반영해야 하는 점점 더 작은 부문 사이에서 소비자의 파편화에 의해 갈수록 대체되고 있다.", "easy": "요즘은 대량 생산 대신, 소비자들이 각자의 취향에 따라 점점 더 작은 무리로 잘게 나뉘고 있어요.", "gist": "현재의 모습이에요. 소비자가 개인 취향에 따라 쪼개진다고 해요."}, {"n": 5, "ch": [{"e": "Everybody feels different and special", "k": "모든 사람은 (각자) 다르고 특별하다고 느끼고,"}, {"e": "and expects products", "k": "제품을 기대한다"}, {"e": "serving his or her <b>inclinations<\/b>.", "k": "자신의 기호를 만족시키는."}], "easy": "누구나 자기는 남과 다르고 특별하다고 느껴서, 자기 취향에 맞는 제품을 원해요.", "gist": "개인적 선호를 더 구체적으로 설명해요."}, {"n": 6, "ch": [{"e": "<b>In reality<\/b>,", "k": "현실에서,"}, {"e": "these <b>supposedly<\/b> individual preferences", "k": "아마 개인적 선호라고 생각되는 이런 것들<span class=\"r\">(= 앞에서 말한 개인의 선호와 기호)<\/span>은"}, {"e": "end up overlapping with", "k": "결국 ~와 겹치게 된다"}, {"e": "emerging, temporary, always changing, almost tribal formations", "k": "최근에 생겨나고, 일시적이며, 항상 바뀌고, 거의 부족적인 형성물과"}, {"e": "solidifying around cultural sensibilities, social identifications,", "k": "문화적 감성, 사회 정체성,"}, {"e": "political sensibilities, and dietary and health concerns.", "k": "정치적 감성, 그리고 식생활과 건강에 관한 관심사를 중심으로 확고해지는."}], "link": "현실에서 아마 개인적 선호라고 생각되는 이런 것들은 결국 문화적 감성, 사회 정체성, 정치적 감성, 그리고 식생활과 건강에 관한 관심사를 중심으로 확고해지는, 최근에 생겨나고, 일시적이며, 항상 바뀌고, 거의 부족적인 형성물과 겹치게 된다.", "easy": "그런데 실제로는 '나만의 취향'이라고 생각한 것들이, 문화·사회·정치·식생활과 건강 관심사를 중심으로 뭉치는 일시적인 무리와 결국 겹쳐요.", "gist": "반전이에요. 개인 취향이 사실은 집단의 모습과 겹친다고 해요. 주어진 문장이 바로 이 뒤에 와요."}, {"n": 7, "ch": [{"e": "These consumer communities", "k": "이들 소비자 집단<span class=\"r\">(= 새로운 정체성으로 묶인 소비자 집단)<\/span>은"}, {"e": "go beyond national boundaries,", "k": "국경을 초월하여,"}, {"e": "<b>feeding on<\/b> global and widely shared repositories", "k": "전 세계의 널리 공유된 저장소로 인해 더 강화된다"}, {"e": "of ideas, images, and practices.", "k": "생각, 이미지, 관습의."}], "link": "이들 소비자 집단은 국경을 초월하여 생각, 이미지, 관습의 전 세계의 널리 공유된 저장소로 인해 더 강화된다.", "easy": "이런 소비자 무리는 나라의 경계를 넘어, 전 세계가 함께 나누는 생각과 이미지, 관습을 바탕으로 더 커져요.", "gist": "These consumer communities가 주어진 문장의 '새로운 정체성' 집단을 받아요."}]}, {"no": "11", "typ": "장문 제목", "src": "2019학년도 수능 41번", "evn": [1, 3, 5, 6, 9], "ev_en": "Industrial capitalism not only created work, it also created ‘leisure’ in the modern sense of the term. / However, by requiring continuous work during work hours and ruling out non-work activity, employers had (a) separated out leisure from work. / ‘Leisure’ as a distinct non-work time, whether in the form of the holiday, weekend, or evening, was a result of the disciplined and bounded work time created by capitalist production. / Workers then wanted more leisure and leisure time was enlarged by union campaigns, which first started in the cotton industry, and eventually new laws were passed that (c) limited the hours of work and gave workers holiday entitlements. / Workers began to (d) pay for leisure activities organized by capitalist enterprises.", "ev_ko": [[1, "산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라, 또한 그 용어의 현대적 의미로 ‘여가’를 만들어 냈다(현대적인 의미의 ‘여가’ 개념을 만들었다)."], [3, "그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 (a)분리시켰다."], [5, "별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 (방식)에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다."], [6, "그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 노동조합 운동에 의해 확대되었는데, 이는 면직물 산업에서 처음 시작되어서, 결국 근무 시간을 (c)제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다."], [9, "근로자들은 자본주의적인 기업들에 의해 조직된 여가 활동에 (d)돈을 지불하기 시작했다."]], "why": ["(1)에서 산업 자본주의가 현대적 의미의 ‘여가’를 만들어 냈다고 화제를 던집니다", "(3)과 (5)는 고용주들이 일과 여가를 분리하면서 여가가 생겨났다는 <b>탄생<\/b> 과정입니다", "(6)은 노동조합 운동과 새로운 법으로 여가가 늘어난 과정이고, (9)는 근로자들이 기업이 조직한 여가 활동에 돈을 내기 시작한 상업화 과정입니다", "이것이 여가의 <b>발전<\/b>입니다", "그래서 제목은 ③ <b>The Birth and Evolution of Leisure in Capitalism<\/b>(자본주의에서 여가의 탄생과 발전)이 알맞습니다."], "ch": [{"n": "①", "t": "What It Takes to Satisfy Workers", "g": "근로자를 만족시키기 위해 필요한 것(조건)", "ok": false, "e": ["근로자를 만족시키는 조건은 다루지 않습니다", "여가가 어떻게 생겨나고 바뀌었는지를 설명하는 글입니다."]}, {"n": "②", "t": "Why Workers Have Struggled for More Leisure", "g": "왜 근로자들은 더 많은 여가를 위해 투쟁해 왔는가", "ok": false, "e": ["(6)에 근로자들이 더 많은 여가를 원했고 노동조합 운동으로 여가가 늘었다는 내용이 나오기는 합니다", "하지만 글의 일부일 뿐이고, 왜 투쟁했는지를 다루는 글이 아닙니다."]}, {"n": "③", "t": "The Birth and Evolution of Leisure in Capitalism", "g": "자본주의에서 여가의 탄생과 발전", "ok": true, "e": ["(1)~(6)은 여가가 생겨나고 늘어난 과정, (7)~(11)은 여가가 상업화된 과정입니다", "'탄생과 발전'이 이 흐름을 한 줄로 담고 있습니다."]}, {"n": "④", "t": "How to Strike a Balance Between Work and Leisure", "g": "일과 여가 사이에 균형을 잡는 방법", "ok": false, "e": ["일과 여가의 균형을 잡는 방법은 나오지 않습니다", "여가가 생겨나고 발전한 역사를 설명하는 글입니다."]}, {"n": "⑤", "t": "The Light and Dark Sides of the Modern Leisure Industry", "g": "현대 여가 산업의 명암", "ok": false, "e": ["여가 산업의 어두운 면은 나오지 않습니다", "(11)은 여가 시장이 소비자 수요, 고용, 이익의 거대한 원천이 될 것이었다고 말할 뿐입니다."]}], "tr": ["산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라, 또한 그 용어의 현대적 의미로 ‘여가’를 만들어 냈다(현대적인 의미의 ‘여가’ 개념을 만들었다).", "이것(산업 자본주의가 현대적 의미의 ‘여가’를 이끌었다는 사실)은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.", "그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 (a)분리시켰다.", "일부는 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 왜냐하면 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일을 (b)진척시키는(→ 중단시키는) 것보다 더 나았기 때문이다.", "별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 (방식)에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다.", "그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 노동조합 운동에 의해 확대되었는데, 이는 면직물 산업에서 처음 시작되어서, 결국 근무 시간을 (c)제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다.", "다른 의미에서 여가는 또한 여가의 상업화를 통한 자본주의의 산물이기도 했다.", "이는(여가는) 전통적인 스포츠나 오락에 참여하는 것을 더 이상 의미하지 않았다.", "근로자들은 자본주의적인 기업들에 의해 조직된 여가 활동에 (d)돈을 지불하기 시작했다.", "사람들이 입장하는 데 요금이 부과될 수 있는(입장료를 받을 수 있는) 관중 (동원력이 큰) 스포츠, 특히 축구와 경마로의 대중의 이동이 이제 가능해졌다.", "이것은 매우 중요한데, 왜냐하면 완전히 새로운 산업들이 여가 시장을 개발하고 (e)발전시키기 위해 출현하고 있었고, 여가 시장은 소비자 수요, 고용 그리고 이익의 거대한 원천이 될 것이었기 때문이다."], "ps": [{"n": 1, "ch": [{"e": "Industrial capitalism not only created work,", "k": "산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라,"}, {"e": "it also created ‘leisure’", "k": "또한 ‘여가’를 만들어 냈다"}, {"e": "in the modern sense of the term.", "k": "그 용어의 현대적 의미로."}], "easy": "산업 자본주의는 일자리뿐 아니라, 우리가 지금 생각하는 의미의 '여가'도 만들어 냈어요.", "gist": "글의 주제예요. 여가는 산업 자본주의가 만들어 낸 것이라고 해요."}, {"n": 2, "ch": [{"e": "This might seem surprising,", "k": "이것<span class=\"r\">(= 산업 자본주의가 현대적 의미의 여가를 만들어 냈다는 것)<\/span>은 놀랍게 보일지도 모른다,"}, {"e": "<b>for<\/b> the early cotton masters wanted", "k": "왜냐하면 초기 면직 공장주들은 원했고"}, {"e": "to keep their machinery running", "k": "그들<span class=\"r\">(= 초기 면직 공장주들)<\/span>의 기계가 계속 가동되기를"}, {"e": "as long as possible", "k": "가능한 한 오랫동안"}, {"e": "and forced their employees", "k": "그리고 그들<span class=\"r\">(= 초기 면직 공장주들)<\/span>의 직원들에게 강요했기 때문이다"}, {"e": "to work very long hours.", "k": "아주 장시간 일하도록."}], "link": "이것은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.", "easy": "이 말이 의외로 들릴 수 있어요. 초기 공장주들은 기계를 최대한 오래 돌리려고 직원들을 아주 오래 일하게 했거든요.", "gist": "여가와는 반대로 보이는 당시 상황을 먼저 보여 줘요."}, {"n": 3, "ch": [{"e": "<b>However<\/b>,", "k": "그러나,"}, {"e": "by requiring continuous work during work hours", "k": "근무 시간 동안 계속되는 작업을 요구하고"}, {"e": "and <b>ruling out<\/b> non-work activity,", "k": "비업무 활동을 배제함으로써,"}, {"e": "employers had (a) <b>separated<\/b> out leisure from work.", "k": "고용주들은 여가를 업무와 (a) 분리시켰다."}], "link": "그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 분리시켰다.", "easy": "하지만 일하는 시간에는 일만 하게 하고 다른 활동은 못 하게 하면서, 고용주들은 여가를 일과 따로 떼어 놓게 됐어요.", "gist": "여가가 생겨난 과정이에요. 일과 여가가 분리되었어요."}, {"n": 4, "ch": [{"e": "Some did this quite <b>explicitly<\/b>", "k": "일부<span class=\"r\">(= 일부 고용주들)<\/span>는 이것<span class=\"r\">(= 여가를 일에서 분리하는 것)<\/span>을 꽤 명시적으로 했다"}, {"e": "by creating distinct holiday periods,", "k": "별개의 휴가 기간을 만듦으로써,"}, {"e": "when factories were shut down,", "k": "그 기간에는 공장들이 문을 닫았다,"}, {"e": "because it was better to do this", "k": "왜냐하면 이렇게 하는 것<span class=\"r\">(= 별개의 휴가 기간을 만드는 것)<\/span>이 더 나았기 때문이다"}, {"e": "than have work (b) <b>disrupted<\/b>", "k": "일이 (b) 중단되게 하는 것보다 <span class=\"r\">※ 문제지엔 promoted로 되어 있음<\/span>"}, {"e": "by the casual taking of days off.", "k": "비정기적인 휴가를 내는 것으로 인해."}], "link": "일부 고용주들은 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일이 중단되게 하는 것보다 더 나았기 때문이다.", "easy": "어떤 고용주들은 아예 공장 문을 닫는 휴가 기간을 따로 정했어요. 직원들이 제각각 쉬어서 일이 끊기는 것보다 그게 나았기 때문이에요.", "gist": "12번의 정답 자리예요. 제각각 쉬면 일이 진척되는 게 아니라 지장을 받는다는 흐름이에요."}, {"n": 5, "ch": [{"e": "‘Leisure’ as a distinct non-work time,", "k": "별개의 비업무 시간으로서의 ‘여가’는,"}, {"e": "whether in the form of the holiday, weekend, or evening,", "k": "휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에,"}, {"e": "was a result of the <b>disciplined<\/b> and bounded work time", "k": "통제되고 제한된 근로 시간의 결과물이었다"}, {"e": "created by capitalist production.", "k": "자본주의적인 생산 (방식)에 의해 만들어진."}], "link": "별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 방식에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다.", "easy": "휴가든 주말이든 저녁이든, 일과 따로 떨어진 시간인 '여가'는 자본주의 생산이 근무 시간을 정해 두고 통제한 결과로 생겼어요.", "gist": "여가의 탄생을 정리해요. 통제되고 제한된 근무 시간이 여가를 만들었어요."}, {"n": 6, "ch": [{"e": "Workers then wanted more leisure", "k": "그 후 근로자들은 더 많은 여가를 원했고"}, {"e": "and leisure time was <b>enlarged<\/b> by union campaigns,", "k": "여가 시간은 노동조합 운동에 의해 확대되었는데,"}, {"e": "which first started in the cotton industry,", "k": "이것<span class=\"r\">(= 노동조합 운동)<\/span>은 면직물 산업에서 처음 시작되었다,"}, {"e": "and eventually new laws were passed", "k": "그리고 결국 새로운 법이 통과되었다"}, {"e": "that (c) <b>limited<\/b> the hours of work", "k": "근무 시간을 (c) 제한하고"}, {"e": "and gave workers holiday <b>entitlements<\/b>.", "k": "근로자들에게 휴가 권리를 부여하는."}], "link": "그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 면직물 산업에서 처음 시작된 노동조합 운동에 의해 확대되었으며, 결국 근무 시간을 제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다.", "easy": "그 뒤 근로자들이 여가를 더 원했고, 노동조합 운동으로 여가 시간이 늘었어요. 결국 근무 시간을 제한하고 휴가 권리를 주는 법까지 생겼어요.", "gist": "여가가 늘어난 과정이에요. 여가의 발전을 보여 줘요."}, {"n": 7, "ch": [{"e": "Leisure was also the creation of capitalism", "k": "여가는 또한 자본주의의 산물이기도 했다"}, {"e": "in another sense,", "k": "다른 의미에서,"}, {"e": "through the <b>commercialization<\/b> of leisure.", "k": "여가의 상업화를 통한."}], "easy": "여가는 또 다른 면에서도 자본주의가 만든 것이에요. 바로 여가가 상업화되었다는 점이에요.", "gist": "글의 후반부를 열어요. 여가의 상업화 이야기로 넘어가요."}, {"n": 8, "ch": [{"e": "This no longer meant participation", "k": "이것<span class=\"r\">(= 여가)<\/span>은 더 이상 참여하는 것을 의미하지 않았다"}, {"e": "in traditional sports and pastimes.", "k": "전통적인 스포츠나 오락에."}], "easy": "이제 여가는 더 이상 전통 스포츠나 놀이에 참여하는 것을 뜻하지 않았어요.", "gist": "여가의 의미가 바뀌었다고 해요."}, {"n": 9, "ch": [{"e": "Workers began to (d) <b>pay<\/b> for leisure activities", "k": "근로자들은 여가 활동에 (d) 돈을 지불하기 시작했다"}, {"e": "organized by capitalist <b>enterprises<\/b>.", "k": "자본주의적인 기업들에 의해 조직된."}], "easy": "근로자들은 기업이 마련한 여가 활동에 돈을 내기 시작했어요.", "gist": "상업화의 구체적인 모습이에요."}, {"n": 10, "ch": [{"e": "Mass travel to spectator sports,", "k": "관중 (동원력이 큰) 스포츠로의 대중의 이동이,"}, {"e": "especially football and horse-racing,", "k": "특히 축구와 경마,"}, {"e": "where people could be charged for entry,", "k": "사람들이 입장하는 데 요금이 부과될 수 있는,"}, {"e": "was now possible.", "k": "이제 가능해졌다."}], "link": "사람들이 입장하는 데 요금이 부과될 수 있는 관중 스포츠, 특히 축구와 경마로의 대중의 이동이 이제 가능해졌다.", "easy": "많은 사람이 축구나 경마 같은 관람 스포츠를 보러 갈 수 있게 됐고, 그곳에서는 입장료를 받을 수 있었어요.", "gist": "상업화의 예시예요. 입장료를 내고 스포츠를 보는 시대가 됐어요."}, {"n": 11, "ch": [{"e": "The importance of this can hardly be <b>exaggerated<\/b>,", "k": "이것<span class=\"r\">(= 앞에서 말한 여가의 상업화)<\/span>의 중요성은 아무리 과장해도 지나치지 않다,"}, {"e": "<b>for<\/b> whole new industries were emerging", "k": "왜냐하면 완전히 새로운 산업들이 출현하고 있었기 때문이다"}, {"e": "to exploit and (e) <b>develop<\/b> the leisure market,", "k": "여가 시장을 개발하고 (e) 발전시키기 위해,"}, {"e": "which was to become a huge source", "k": "그리고 그것<span class=\"r\">(= 여가 시장)<\/span>은 거대한 원천이 될 것이었다"}, {"e": "of consumer demand, employment, and profit.", "k": "소비자 수요, 고용 그리고 이익의."}], "link": "이것의 중요성은 아무리 과장해도 지나치지 않은데, 완전히 새로운 산업들이 여가 시장을 개발하고 발전시키기 위해 출현하고 있었고, 그 여가 시장은 소비자 수요, 고용 그리고 이익의 거대한 원천이 될 것이었기 때문이다.", "easy": "여가의 상업화는 정말 중요해요. 여가 시장을 키우려는 새 산업들이 생겨났고, 그 시장은 소비, 일자리, 이익의 큰 원천이 되었거든요.", "gist": "여가 산업이 크게 성장했다며 글을 마무리해요."}]}, {"no": "12", "typ": "장문 어휘", "src": "2019학년도 수능 42번", "evn": [4], "ev_en": "Some did this quite explicitly by creating distinct holiday periods, when factories were shut down, because it was better to do this than have work (b) disrupted by the casual taking of days off.", "ev_ko": [[4, "일부는 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 왜냐하면 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일을 (b)진척시키는(→ 중단시키는) 것보다 더 나았기 때문이다."]], "why": ["(4)는 공장이 문을 닫는 별개의 휴가 기간을 만드는 것이, 근로자들이 비정기적으로 쉬는 날을 내는 것보다 낫다고 비교합니다", "근로자들이 제각각 쉬는 날을 내면 일이 <b>진척되는(promoted)<\/b> 것이 아니라 <b>지장을 받습니다<\/b>.", "그래서 (b)는 <b>disrupted<\/b>(중단시키는, 지장을 받게 하는) 같은 말이어야 하고, 정답은 ②입니다."], "ch": [{"n": "①", "t": "(a) separated", "g": "분리했다", "ok": false, "e": ["(3)에서 고용주들은 근무 시간에 계속 일하게 하고 업무 외 활동을 배제했습니다", "그 결과 여가를 일에서 '분리했다'는 말은 자연스럽습니다."]}, {"n": "②", "t": "(b) promoted", "g": "진척되는, 촉진되는", "ok": true, "e": ["(4)에서 근로자들이 비정기적으로 쉬는 날을 내면 일은 진척되지 않고 지장을 받습니다", "promoted가 아니라 disrupted(중단시키는) 같은 말이 와야 합니다."]}, {"n": "③", "t": "(c) limited", "g": "제한했다", "ok": false, "e": ["(6)에서 근로자들은 더 많은 여가를 원했고 여가 시간이 확대되었습니다", "그 결과 통과된 새로운 법은 근로자에게 휴가 권리를 주었으므로, 근무 시간을 '제한했다'가 자연스럽습니다."]}, {"n": "④", "t": "(d) pay", "g": "지불하다", "ok": false, "e": ["(9)는 여가가 상업화되었다는 (7)에 이어지는 문장입니다", "(10)에 입장료를 받을 수 있게 되었다는 말도 나오므로, 기업이 조직한 여가 활동에 '돈을 지불하기' 시작했다는 말이 맞습니다."]}, {"n": "⑤", "t": "(e) develop", "g": "발전시키다", "ok": false, "e": ["(11)에서 새로운 산업들이 여가 시장을 개발하고 '발전시키기(develop)' 위해 생겨났다는 흐름이므로 알맞습니다."]}], "tr": ["산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라, 또한 그 용어의 현대적 의미로 ‘여가’를 만들어 냈다(현대적인 의미의 ‘여가’ 개념을 만들었다).", "이것(산업 자본주의가 현대적 의미의 ‘여가’를 이끌었다는 사실)은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.", "그러나, 근무 시간 동안 계속되는 작업을 요구하고 비업무 활동을 배제함으로써, 고용주들은 여가를 업무와 (a)분리시켰다.", "일부는 공장들이 문을 닫는 별개의 휴가 기간을 만듦으로써 이를 꽤 명시적으로 했는데, 왜냐하면 이렇게 하는 것이 비정기적인 휴가를 내는 것으로 인해 일을 (b)진척시키는(→ 중단시키는) 것보다 더 나았기 때문이다.", "별개의 비업무 시간으로서의 ‘여가’는, 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, 자본주의적인 생산 (방식)에 의해 만들어진 통제되고 제한된 근로 시간의 결과물이었다.", "그 후 근로자들은 더 많은 여가를 원했고 여가 시간은 노동조합 운동에 의해 확대되었는데, 이는 면직물 산업에서 처음 시작되어서, 결국 근무 시간을 (c)제한하고 근로자들에게 휴가 권리를 부여하는 새로운 법이 통과되었다.", "다른 의미에서 여가는 또한 여가의 상업화를 통한 자본주의의 산물이기도 했다.", "이는(여가는) 전통적인 스포츠나 오락에 참여하는 것을 더 이상 의미하지 않았다.", "근로자들은 자본주의적인 기업들에 의해 조직된 여가 활동에 (d)돈을 지불하기 시작했다.", "사람들이 입장하는 데 요금이 부과될 수 있는(입장료를 받을 수 있는) 관중 (동원력이 큰) 스포츠, 특히 축구와 경마로의 대중의 이동이 이제 가능해졌다.", "이것은 매우 중요한데, 왜냐하면 완전히 새로운 산업들이 여가 시장을 개발하고 (e)발전시키기 위해 출현하고 있었고, 여가 시장은 소비자 수요, 고용 그리고 이익의 거대한 원천이 될 것이었기 때문이다."], "ps": [{"n": 1, "ch": [{"e": "Industrial capitalism not only created work,", "k": "산업 자본주의는 일자리를 만들어 냈을 뿐만 아니라,"}, {"e": "it also created ‘leisure’", "k": "또한 ‘여가’를 만들어 냈다"}, {"e": "in the modern sense of the term.", "k": "그 용어의 현대적 의미로."}], "easy": "산업 자본주의는 일자리뿐 아니라, 우리가 지금 생각하는 의미의 '여가'도 만들어 냈어요.", "gist": "글의 주제예요. 여가는 산업 자본주의가 만들어 낸 것이라고 해요."}, {"n": 2, "ch": [{"e": "This might seem surprising,", "k": "이것<span class=\"r\">(= 산업 자본주의가 현대적 의미의 여가를 만들어 냈다는 것)<\/span>은 놀랍게 보일지도 모른다,"}, {"e": "<b>for<\/b> the early cotton masters wanted", "k": "왜냐하면 초기 면직 공장주들은 원했고"}, {"e": "to keep their machinery running", "k": "그들<span class=\"r\">(= 초기 면직 공장주들)<\/span>의 기계가 계속 가동되기를"}, {"e": "as long as possible", "k": "가능한 한 오랫동안"}, {"e": "and forced their employees", "k": "그리고 그들<span class=\"r\">(= 초기 면직 공장주들)<\/span>의 직원들에게 강요했기 때문이다"}, {"e": "to work very long hours.", "k": "아주 장시간 일하도록."}], "link": "이것은 놀랍게 보일지도 모르는데, 왜냐하면 초기 면직 공장주들이 그들의 기계가 가능한 한 오랫동안 계속 가동되기를 원했고 그들의 직원들이 아주 장시간 일하도록 강요했기 때문이다.", "easy": "이 말이 의외로 들릴 수 있어요. 초기 공장주들은 기계를 최대한 오래 돌리려고 직원들을 아주 오래 일하게 했거든요.", "gist": "여가와는 반대로 보이는 당시 상황을 먼저 보여 줘요."}, {"n": 3, "ch": [{"e": "<b>However<\/b>,", "k": "그러나,"}, {"e": "by requiring continuous work during work hours", "k": "근무 function dwToast(m){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1800);}
function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}
document.addEventListener('click',function(e){
  const el=e.target.closest&&e.target.closest('.dw');if(!el)return;
  e.stopPropagation();e.preventDefault();
  const p=el.closest('[data-q]');const it=p&&dwItem(p.dataset.q,el.dataset.k);if(!it)return;
  const head=it[2]||it[0],mean=it[1];S.dw=S.dw||{};const on=!S.dw[head];
  if(on)S.dw[head]=1;else delete S.dw[head];save();dwMark(head,on);
  if(on){try{WN.add([{w:head,m:mean,src:'미니모고',how:'별표',ask:true}]);}catch(err){}dwToast(head.replace(/\s+[AB](?=\s|$)/g,'').trim()+'  '+mean.replace(/\bA(?=[에를은는이가와과의도]|\s)|\bB(?=[에를은는이가와과의도]|\s)/g,'').replace(/\s+/g,' ').trim()+'  담음');}
  else{let pr=null;try{pr=WN.del(head,'미니모고');}catch(err){}
    if(pr&&pr.then)pr.then(function(r){if(r&&r.removed===false&&r.reason==='late'){S.dw[head]=1;save();dwMark(head,true);dwToast('이미 쌓인 단어라 뺄 수 없어요');}else if(r&&r.removed)dwToast(head+'  뺌');});
    else dwToast(head+'  뺌');}
},true);

. force A to V (5형식). 이유절의 일부 [기준: for절을 이유 부사절로 처리]"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) + 등위접속사 for절</b>이다. for절 안에 동사가 병렬되어 길어 보인다."}, {"t": "앞 절의 뼈대를 찾는다.", "sub": ["S: This (이것)", "V: might seem (~처럼 보일 수도 있다)", "C: surprising (놀라운)", "뼈대 = <b>This might seem surprising</b>"]}, {"t": "<b>for</b>는 '왜냐하면'이라는 등위접속사다. 뒤 절이 앞 문장의 이유를 덧붙인다."}, {"t": "for절의 뼈대를 찾는다. 동사 두 개가 병렬이다.", "sub": ["S: the early cotton masters (초기 목화 공장주들)", "V1: wanted (want 원하다의 과거형) + O: to keep their machinery running as long as possible (기계를 가능한 한 오래 돌리기를) - keep + 목적어 machinery + 보어 running", "V2: forced (force 강요하다의 과거형) + O: their employees (그들의 직원들) + C: to work very long hours (아주 긴 시간 일하도록)", "their = the early cotton masters (초기 목화 공장주들)의"]}], "sum": "초기 공장주들이 기계를 오래 돌리려 장시간 노동을 강요했기에, 이 일이 놀랍게 보일 수 있음"}, {"i": "08", "q": "11", "s": "A-5", "title": "삽입 whether절 + S+V+C + 분사 후치수식", "eng": "‘Leisure’ as a distinct<sup>1</sup> non-work time, / whether in the form of the holiday, weekend, or evening, / was a result of the disciplined<sup>2</sup> and bounded<sup>3</sup> work time / created by capitalist<sup>4</sup> production.", "notes": [["1", "distinct", "별개의, 뚜렷한"], ["2", "disciplined", "통제된"], ["3", "bound", "(한도 내로) 제한하다"], ["4", "capitalist", "자본주의적인"]], "lit": "별개의 비업무 시간으로서의 ‘여가’는, / 휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에, / 통제되고 제한된 근로 시간의 결과물이었다 / 자본주의적 생산에 의해 만들어진.", "nat": "휴가든 주말이든 저녁이든, 일과 구분되는 시간으로서의 ‘여가’는 자본주의적 생산이 만들어 낸 통제되고 제한된 근로 시간의 산물이었다.", "ana": "주어 <b>‘Leisure’</b> 뒤에 <b>whether A, B, or C</b> 양보 덩어리가 통째로 삽입되어 동사 <b>was</b>가 멀리 밀려났다. 삽입구는 콤마 두 개로 앞뒤가 막혀 있으니 먼저 지우고 주어–동사를 붙여 읽는다. 여기서 <b>as</b>는 '~로서'라는 자격의 전치사다. 맨 뒤 <b>created by ~</b>는 앞의 work time을 꾸미는 과거분사구로, 문장의 두 번째 동사가 아니다.", "pe": "‘Leisure’ \u0001as a \u0001distinct<sup>1</sup>\u0002 non-work time\u0002, / \u0001whether in the form \u0001of the holiday, weekend, or evening\u0002\u0002, / was a result \u0001of the \u0001disciplined<sup>2</sup> and bounded<sup>3</sup>\u0002 work time\u0002 / \u0001created \u0001by \u0001capitalist<sup>4</sup>\u0002 production\u0002\u0002.", "pk": "\u0001별개의 비업무 시간으로서의\u0002 ‘여가’는, / \u0001휴가나 주말의 형태이든 또는 저녁 시간의 형태이든 간에\u0002, / \u0001통제되고 제한된 근로 시간의\u0002 결과물이었다 / \u0001자본주의적 생산에 의해 만들어진\u0002.", "core": "여가는 결과물이었다.", "tags": ["주어 Leisure. as ~ time = 전치사구(형용사구, 자격): Leisure 꾸밈. distinct = 형용사: time 꾸밈", "<b>whether A, B, or C</b> = 양보 부사절: 주절 꾸밈 (삽입). of ~ = 형용사구: form 꾸밈", "동사 was + 보어 a result (SVC). of ~ time = 형용사구: result 꾸밈. disciplined and bounded = 형용사 병렬: work time 꾸밈", "created ~ = 과거분사구(형용사적): work time 꾸밈. by ~ production = 부사구(행위자): created 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어 뒤에 whether절이 삽입되고 보어 뒤에 분사구가 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: 'Leisure' (여가)", "V: was (be ~이었다)", "C: a result (결과, 산물)", "뼈대 = <b>'Leisure' was a result</b>"]}, {"t": "주어 뒤 <b>as a distinct non-work time</b> (일과 구분되는 시간으로서의)은 전치사구(형용사구)다. Leisure를 꾸민다 (distinct 구분되는)."}, {"t": "콤마 사이의 <b>whether in the form of the holiday, weekend, or evening</b>은 <b>삽입된 양보 부사절</b>이다. 주절 전체를 꾸민다 (휴가든 주말이든 저녁이든). of the holiday, weekend, or evening은 form을 꾸민다."}, {"t": "보어 뒤 <b>of the disciplined and bounded work time</b>은 result를 꾸미는 형용사구다 (통제되고 제한된 근로 시간의, disciplined 통제된, bounded 제한된)."}, {"t": "끝의 <b>created by capitalist production</b>은 <b>과거분사구</b>다. work time을 뒤에서 꾸민다 (자본주의적 생산이 만들어 낸, create 만들다). by ~는 행위자다."}], "sum": "여가, 자본주의 생산이 만든 통제된 근로 시간의 산물"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2018년 3월 32번", "ans": "①", "tr": [["1", "공공장소의 조형물은 주위 환경에 있는 요소들의 정서적이고 심미적인 중심점이다."], ["2", "어떤 환경이든 구성 요소들의 다양성, 그것들 사이의 연관성, 그리고 완전한 구조물로서의 모습 때문에 유일무이하다."], ["3", "이러한 예비적인 구조 분석과, 조형물을 세울 장소에 대한 지식은 설계 작업에 들어가기 전에 반드시 갖춰야 한다. 그것은 특정 장소에의 성공적인 통합을 위한 요건이다."], ["4", "전체를 이루는 요소들의 공간적 특징을 제대로 이해하는 것은, 이 작은 세계를 구성하는 요소들 사이의 구조적 연결을 이해하는 것과 더불어, 만족스러운 설계와 적절한 조형적 해법의 전제 조건이다."], ["5", "다수에 요소 하나를 기계적으로 더하는 것과 달리, 기존 구조의 맥락 안으로 무언가를 '엮어' 넣는 편이 더 낫다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Contrary to the mechanical adding of one more element to the multitude, it is better to “weave” something more into the context of the existing structure."}, {"en": false, "h": "빈칸 문제는 <b>빈칸 문장을 다시 말해 주는 문장</b>을 찾아야 한다. 마지막 문장의 <b>weave something into the context of the existing structure</b>(기존 구조의 맥락 안으로 엮어 넣다)가 곧 '그 장소에 성공적으로 통합된다'는 뜻이다. 첫 문장의 <b>focal point of the elements in the surrounding environment</b>(주위 환경 요소들의 중심점)도 같은 방향을 가리킨다."}], "opts": [{"n": "①", "t": "successful integration in the specific space (특정 장소에의 성공적인 통합)", "a": true, "x": false, "trap": false, "e": "'기계적으로 덧붙이지 말고 기존 구조의 맥락 안으로 엮어 넣으라'는 마지막 문장이 곧 통합(integration)이다. 첫 문장의 focal point와도 일관된다."}, {"n": "②", "t": "applying mechanical theories to architecture (기계적 이론을 건축학에 적용하는 것)", "a": false, "x": true, "trap": true, "e": "본문의 mechanical은 '기계 이론'이 아니라 '기계적으로(무성의하게) 덧붙이는 방식'을 가리키며, 필자가 <b>거부하는</b> 태도이다."}, {"n": "③", "t": "true understanding of the human psychology (인간 심리에 대한 진정한 이해)", "a": false, "x": true, "trap": false, "e": "본문의 understanding은 '요소들의 공간적 특징'에 대한 이해이지 인간 심리에 대한 이해가 아니다."}, {"n": "④", "t": "exact evaluation of the property's future value (재산의 미래 가치에 대한 정확한 평가)", "a": false, "x": true, "trap": false, "e": "경제적 가치나 재산 평가에 관한 언급이 전혀 없다."}, {"n": "⑤", "t": "creating a commercial space for multiple purposes (다양한 목적을 위한 상업 공간을 만드는 것)", "a": false, "x": true, "trap": false, "e": "상업적 용도는 거론되지 않는다. multitude(다수)를 multiple purposes(다양한 목적)로 잘못 연결하기 쉽다."}], "w": [["sculpture", "조형물, 조각"], ["aesthetic", "심미적인"], ["focal", "중심의, 초점의"], ["component", "구성하는; 구성 요소"], ["preliminary", "예비의"], ["acquaintance", "지식, 앎"], ["compulsory", "필수적인, 의무적인"], ["requirement", "요건"], ["multitude", "다수(로 이루어진 것)"], ["constituent", "(~을) 구성하는"], ["microcosm", "작은 세계, 축소판"], ["precondition", "전제 조건"]]}, {"q": "08", "type": "빈칸 추론", "src": "2023년 4월 31번", "ans": "④", "tr": [["1", "파트너 사이의 균형이나 조화가 관계 속에서 시간이 지나며 분명히 발전하기는 하지만, 그것은 초기의 매력과 파트너에 대한 관심을 좌우하는 요인이기도 하다."], ["2", "즉, 두 사람이 첫 만남에서 비슷한 언어적·비언어적 습관을 공유하는 정도만큼, 그들은 서로에게 더 편안함을 느낄 것이다."], ["3", "예를 들어 속도가 빠른 사람은 말과 행동이 빠르고 표현이 풍부한 반면, 속도가 느린 사람은 박자가 다르고 표현이 덜하다."], ["4", "그런 연속선의 양 끝에 있는 사람들끼리의 초기 상호 작용은, 비슷한 유형끼리의 상호 작용보다 더 어려울 수 있다."], ["5", "대조적인 유형의 경우, 사람들은 상호 작용 유형이 비슷할 때보다 관계를 이어 가는 데 관심이 덜할 수 있다."], ["6", "그러나 상호 작용 유형이 비슷한 사람들은 더 편안해하며, 서로 그저 '통한다'고 느낀다."], ["7", "따라서 행동의 조정이 관계의 시작을 위한 선택 필터로 작용할 수 있다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "That is, to the extent that two people share similar verbal and nonverbal habits in a first meeting, they will be more comfortable with one another."}, {"en": false, "h": "빈칸 문장이 <b>Thus</b>로 시작하므로, 앞의 내용을 <b>한 단어로 요약</b>한 표현이 답이다. 글 전체가 '말하는 속도·표현 방식 같은 <b>행동 습관이 서로 맞는지</b>'를 다루므로, 이를 묶는 말은 behavioral coordination(행동의 조정)이다. verbal <b>and nonverbal</b> 둘 다를 아우른다는 점이 결정적이다."}], "opts": [{"n": "①", "t": "information deficit (정보의 부족)", "a": false, "x": true, "trap": false, "e": "정보의 많고 적음이 아니라 행동 방식의 유사성을 다룬다."}, {"n": "②", "t": "cultural adaptability (문화적 적응성)", "a": false, "x": true, "trap": false, "e": "문화 차이나 적응은 언급되지 않는다. 빠른 사람과 느린 사람의 차이는 문화가 아니라 개인의 상호 작용 유형이다."}, {"n": "③", "t": "meaning negotiation (의미의 타협)", "a": false, "x": true, "trap": true, "e": "의미를 조율하는 과정이 아니라 말과 몸짓의 <b>속도·표현 방식</b>이 맞느냐가 쟁점이다. verbal이라는 단어에 끌리기 쉽다."}, {"n": "④", "t": "behavioral coordination (행동의 조정)", "a": true, "x": false, "trap": false, "e": "언어적·비언어적 습관, 말과 움직임의 속도, 표현 방식이 서로 맞물리는 것을 한 단어로 묶은 표현이다."}, {"n": "⑤", "t": "unconditional acceptance (무조건적인 수용)", "a": false, "x": true, "trap": false, "e": "글은 오히려 '유형이 다르면 관심이 덜하다'며 <b>선별</b>이 일어난다고 말한다. 무조건적 수용과는 정반대이다."}], "w": [["initial", "초기의, 처음의"], ["to the extent that", "~하는 정도까지"], ["verbal", "언어적인, 구두의"], ["nonverbal", "비언어적인"], ["expressive", "표현력이 있는"], ["tempo", "속도, 박자"], ["continuum", "연속체"], ["contrasting", "대조적인"], ["pursue", "추구하다"], ["click", "마음이 통하다"], ["coordination", "조정, 조화"], ["deficit", "부족, 적자"]]}, {"q": "09", "type": "무관한 문장", "src": "2022년 3월 35번", "ans": "③", "tr": [["1", "교실에서 실제로 음악을 만들어 내는 일에 처음 접근할 때는 악기 사용을 완전히 피하는 것이 좋다."], ["2", "① 이렇게 하면 경험이 적은 교사는 듣기·연주하기·작곡하기를 통해 기본적인 음악 행위를 키우는 데 집중할 수 있고, 아이들은 목소리와 몸으로 내는 소리(손뼉 치기, 딱깍 소리 내기, 발 구르기 등)처럼 더 다루기 쉬운 음원에 집중할 수 있다."], ["3", "② 음악은 발달 측면에서도, 역사적으로도 바로 이것들에서 시작한다. 가장 표현력이 풍부하고 즉각적인 악기는 사람의 목소리이다."], ["4", "③ 악기의 음질은 재료와 디자인, 제작의 품질이 낳은 직접적인 결과이다."], ["5", "④ 몸의 움직임은 음악에 대한 본능적인 반응일 뿐 아니라 음악을 만들어 내도록 부추기기도 한다."], ["6", "⑤ 조정 능력, 청각적 감수성, 시각적 신호와 기호에 대한 반응, 그리고 악기 연주에 필요한 음악적 이해를 상당 부분 길러 주는 활동은 모두 악기 없이도 자리 잡을 수 있다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "The sound quality of an instrument is a direct result of the quality of the materials, design, and making."}, {"en": false, "h": "글의 주제는 <b>악기 없이도</b> 기본 음악 능력을 기를 수 있다는 것이다. ③은 <b>악기의 음질이 무엇으로 결정되는가</b>를 다루므로, '악기를 쓰지 말자'는 흐름과 아무 관계가 없다. 무관 문장 문항은 <b>같은 단어(instrument)가 나온다고 관련 있는 것이 아니라, 하는 말의 방향이 같아야 한다</b>는 점이 핵심이다."}], "opts": [{"n": "①", "t": "경험이 적은 교사와 아이들이 각각 무엇에 집중할 수 있는지", "a": false, "x": true, "trap": false, "e": "첫 문장의 '악기를 피하라'가 왜 좋은지를 바로 이어서 설명하므로 흐름에 맞다."}, {"n": "②", "t": "음악은 목소리와 몸의 소리에서 시작한다", "a": false, "x": true, "trap": false, "e": "①에서 말한 voices와 body percussion을 these both로 받아 발달·역사 양면에서 뒷받침한다."}, {"n": "③", "t": "악기의 음질은 재료·디자인·제작 품질의 결과이다", "a": true, "x": false, "trap": false, "e": "악기를 쓰지 않는 수업을 말하다가 갑자기 악기의 품질을 논한다. 주제와 방향이 어긋난다."}, {"n": "④", "t": "몸의 움직임은 본능적 반응이자 음악 만들기를 부추긴다", "a": false, "x": true, "trap": true, "e": "body percussion을 몸의 움직임으로 이어받아 악기 없는 활동의 가치를 이어 간다."}, {"n": "⑤", "t": "여러 음악적 능력은 악기 없이도 자리 잡을 수 있다", "a": false, "x": true, "trap": false, "e": "첫 문장의 주장을 다시 확인하며 글을 닫는 마무리 문장이다."}], "w": [["practical", "실제의, 현실적인"], ["altogether", "완전히, 전적으로"], ["inexperienced", "경험이 많지 않은"], ["fundamental", "기본적인"], ["compose", "작곡하다"], ["controllable", "통제 가능한"], ["body percussion", "몸을 두드려 내는 소리"], ["instinctive", "본능적인"], ["instigate", "부추기다, 선동하다"], ["aural", "청각적인"], ["cue", "신호"], ["establish", "자리 잡게 하다"]]}, {"q": "10", "type": "문장 삽입", "src": "2022학년도 9월 39번", "ans": "⑤", "tr": [["1", "[주어진 문장] 개인의 이야기는 더 큰 이야기와 연결되어 새로운 정체성을 만들어 낸다."], ["2", "식품 선택을 결정하는 사회적 역학의 복잡성이 커지면서 마케팅 담당자와 광고주의 일은 점점 더 어려워지고 있다."], ["3", "① 과거에 대량 생산은 제품을 널리 유통시켰을 뿐 아니라 손에 넣을 수 있고 살 만하게 만들어 주었고, 발전의 신호로 받아들여졌다."], ["4", "② 오늘날 그것은 개인적 선호를 반영한다고 여겨지는 점점 더 작은 부문들로의 소비자 파편화에 갈수록 자리를 내주고 있다."], ["5", "③ 모든 사람이 저마다 다르고 특별하다고 느끼며, 자신의 기호를 만족시키는 제품을 기대한다."], ["6", "④ 현실에서 이 이른바 개인적 선호라는 것들은, 문화적 감성·사회적 정체성·정치적 감성·식생활과 건강에 관한 관심사를 중심으로 굳어지는, 최근에 생겨나고 일시적이며 늘 변하는 거의 부족과도 같은 형성물과 결국 겹치게 된다."], ["7", "⑤ 이 소비자 집단들은 국경을 넘어, 전 세계적으로 널리 공유되는 생각·이미지·관습의 저장소를 먹고 자란다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "These consumer communities go beyond national boundaries, feeding on global and widely shared repositories of ideas, images, and practices."}, {"en": false, "h": "삽입 문장의 <b>larger narratives</b>(더 큰 이야기)와 <b>new identities</b>(새로운 정체성)가 열쇠이다. ⑤ 바로 앞 문장이 '개인의 선호가 결국 문화적·사회적·정치적 <b>집단 형성물</b>과 겹친다'로 끝나므로, '개인의 이야기가 더 큰 이야기와 만나 새 정체성을 만든다'가 그 뒤에 오는 것이 자연스럽다. 그리고 ⑤ 뒤의 <b>These consumer communities</b>가 삽입 문장의 새 정체성 집단을 받는다."}], "opts": [{"n": "①", "t": "대량 생산의 과거를 설명하기 직전", "a": false, "x": true, "trap": false, "e": "아직 개인의 이야기나 정체성 이야기가 시작되지도 않았다."}, {"n": "②", "t": "오늘날 소비자 파편화를 설명하기 직전", "a": false, "x": true, "trap": false, "e": "파편화(작은 부문으로 쪼개짐)는 '더 큰 이야기와 연결된다'는 삽입 문장과 방향이 반대이다."}, {"n": "③", "t": "모두가 다르고 특별하다고 느낀다는 문장 직전", "a": false, "x": true, "trap": false, "e": "삽입 문장의 '개인의 이야기'는 문장 ④의 개인적 선호 이야기 <b>뒤에</b> 와야 하므로 여기에는 들어갈 수 없다."}, {"n": "④", "t": "현실에서 개인적 선호가 겹친다는 문장 직전", "a": false, "x": true, "trap": true, "e": "문장 ④의 these supposedly individual preferences가 가리키는 것은 바로 앞 문장 ③의 내용이므로, 그 사이에 다른 문장이 끼면 지시 관계가 끊어진다."}, {"n": "⑤", "t": "소비자 집단이 국경을 넘는다는 문장 직전", "a": true, "x": false, "trap": false, "e": "앞 문장의 '집단적 형성물'과 삽입 문장의 '더 큰 이야기·새 정체성'이 이어지고, 뒤 문장의 These consumer communities가 그 정체성 집단을 받는다."}], "w": [["social dynamics", "사회적 역학"], ["allow for", "~을 가능하게 하다"], ["affordability", "(구매) 비용을 감당할 수 있음"], ["distribution", "유통, 분배"], ["fragmentation", "파편화, 분열"], ["segment", "부문, 부분"], ["inclination", "기호, 성향"], ["supposedly", "아마, 생각하건대"], ["overlap", "겹치다, 중복되다"], ["solidify", "확고해지다, 굳어지다"], ["repository", "저장소, 창고"], ["go beyond", "~을 초월하다"]]}, {"q": "11", "type": "장문 제목", "src": "2019학년도 수능 41번", "ans": "③", "tr": [["1", "산업 자본주의는 일자리를 만들어 냈을 뿐 아니라, 현대적 의미의 '여가'도 만들어 냈다."], ["2", "이 말이 뜻밖으로 들릴 수도 있는데, 초기 목화 농장주들은 기계를 되도록 오래 돌리고 싶어 했고 직원들에게 아주 긴 시간 일하도록 강요했기 때문이다."], ["3", "그러나 근무 시간 동안 계속 일하도록 요구하고 업무 외 활동을 배제함으로써, 고용주들은 여가를 일에서 (a) 분리해 냈다."], ["4", "일부는 공장이 문을 닫는 별도의 휴가 기간을 만들어 이를 아주 명시적으로 했는데, 그렇게 하는 편이 일이 격식 없이 쉬는 날을 내는 방식으로 (b) 진척되는(→ 중단되는) 것보다 나았기 때문이다."], ["5", "휴가든 주말이든 저녁이든, 일과 구분되는 시간으로서의 '여가'는 자본주의적 생산이 만들어 낸 통제되고 제한된 근로 시간의 산물이었다."], ["6", "그 후 근로자들은 더 많은 여가를 원했고, 여가 시간은 목화 산업에서 처음 시작된 노동조합 운동으로 늘어났으며, 결국 근무 시간을 (c) 제한하고 근로자에게 휴가 권리를 주는 새 법이 통과되었다."], ["7", "여가는 또 다른 의미에서, 여가의 상업화를 통한 자본주의의 창조물이기도 했다."], ["8", "이는 더 이상 전통적인 스포츠나 오락에 참여하는 것을 뜻하지 않았다."], ["9", "근로자들은 자본주의 기업이 조직한 여가 활동에 (d) 돈을 지불하기 시작했다."], ["10", "관중 동원력이 큰 스포츠, 특히 축구와 경마로의 대중 이동이 이제 가능해졌고, 그곳에서는 입장에 요금을 매길 수 있었다."], ["11", "이것이 지닌 중요성은 아무리 과장해도 지나치지 않은데, 여가 시장을 (e) 개발하고 확장하기 위해 완전히 새로운 산업들이 출현하고 있었고, 그 시장은 소비자 수요와 고용, 이익의 거대한 원천이 될 것이었기 때문이다."]], "evh": "1번 문장", "ev": [{"en": true, "h": "Industrial capitalism not only created work, it also created ‘leisure’ in the modern sense of the term."}, {"en": false, "h": "장문 제목은 <b>첫 문장</b>과 <b>전체 전개</b>를 함께 본다. 첫 문장이 '산업 자본주의가 현대적 의미의 여가를 만들어 냈다'로 화두를 던지고, 본문은 여가가 어떻게 <b>생겨나(탄생)</b> 노동조합 운동과 상업화를 거쳐 <b>커졌는지(발전)</b>를 순서대로 보여 준다."}], "opts": [{"n": "①", "t": "What It Takes to Satisfy Workers (근로자를 만족시키기 위해 필요한 것)", "a": false, "x": true, "trap": false, "e": "근로자 만족을 위한 조건을 다루는 글이 아니다."}, {"n": "②", "t": "Why Workers Have Struggled for More Leisure (왜 근로자들은 더 많은 여가를 위해 투쟁해 왔는가)", "a": false, "x": true, "trap": true, "e": "노동조합 운동은 여러 단계 중 하나로 잠깐 나올 뿐, 투쟁의 이유를 파고드는 글이 아니다."}, {"n": "③", "t": "The Birth and Evolution of Leisure in Capitalism (자본주의에서 여가의 탄생과 발전)", "a": true, "x": false, "trap": false, "e": "'만들어졌다(created) → 늘어났다(enlarged) → 상업화되었다(commercialization)'라는 시간 순 전개를 한 줄로 담았   const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="wc"><div class="h"><span class="no">${i+1}</span><span class="src">${esc(w.src)}번</span></div><div class="chips">`;
    h+=`<button class="ck1 m ${c.m?'bad':''}" data-i="${i}" data-p="m"><b>${esc(w.w)}</b><span class="ko">${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="ck1 s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="t">유</span><b>${esc(w.s[0])}</b><span class="ko">${esc(w.s[1])}</span></button>`;
    if(w.a)h+=`<button class="ck1 a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="t">반</span><b>${esc(w.a[0])}</b><span class="ko">${esc(w.a[1])}</span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.ck1').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}

var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 조형물 설계 전 <b>장소 분석이 왜 필요한지</b>를 묻는 자리예요. 마지막 5번의 <b>기존 구조의 맥락 안에 엮기</b>(weave into the context)를 한 말로 바꾼 어구를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (3번)</span><div class=\"en\">This preliminary structural analysis and acquaintance with the site … is compulsory before working on its design; it is a requirement <mark>for</mark> <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">설계 전에 장소를 미리 분석하고 아는 것은 필수다. 그것은 ( ? )을 위한 요건이다</p></div><div class=\"ck-via\"><i>▼</i><span>조형물은 혼자가 아니라 주위 요소들의 중심이에요</span></div><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 조형물의 자리</span><div class=\"en\">Sculpture in a public place is the emotional and aesthetic <mark>focal point of the elements in the surrounding environment</mark>.</div><p class=\"ko\">공공장소의 조형물은 <mark>주위 환경에 있는 요소들의</mark> 정서적이고 심미적인 중심이다.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 뒤에서 “구성 요소들 사이의 구조적 연결 이해 = 전제 조건”으로 되풀이</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 같은 말 반복</span><div class=\"en\">The proper understanding … of the <mark>structural links between the constituent elements</mark> of this specific microcosm are preconditions for satisfactory design …</div><p class=\"ko\">이 특정한 작은 세계의 <mark>구성 요소들 사이의</mark> 구조적 연결에 대한 이해는 전제 조건이다.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸의 답을 한 번 더 풀어서 말해 주는 마지막 문장</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">Contrary to the mechanical adding of one more element to the multitude, it is better to <mark>“weave” something more into the context of the existing structure</mark>.</div><p class=\"ko\">한 가지 요소를 기계적으로 더 추가하는 것에 반해, <mark>기존 구조의 맥락 안에</mark> 어떤 것을 더 ‘엮는’ 것이 더 낫다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">successful integration in the specific space 특정 장소에의 성공적인 통합<small>5번 weave into the context(맥락 안에 엮다)를 integration(통합)으로 바꿔 말했어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">applying mechanical theories to architecture 기계적 이론을 건축학에 적용하는 것</span><span class=\"why\">5번 mechanical(기계적인)을 따온 함정이에요. 지문은 기계적으로 하나 더 붙이는 것에 반대(Contrary to)한다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">true understanding of the human psychology 인간 심리에 대한 진정한 이해</span><span class=\"why\">4번에서 이해해야 할 것은 사람 마음이 아니라 요소들의 공간적 특징과 구조적 연결이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">exact evaluation of the property's future value 재산의 미래 가치에 대한 정확한 평가</span><span class=\"why\">땅값이나 재산 가치 이야기는 지문에 한 번도 나오지 않아요. 분석 대상은 장소의 구조예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">creating a commercial space for multiple purposes 다양한 목적을 위한 상업 공간을 만드는 것</span><span class=\"why\">지문은 장사하는 공간을 새로 만드는 게 아니라, 이미 있는 장소에 조형물을 어울리게 넣는 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Sculpture in a public place</div><div class=\"k\">공공장소의 조형물은</div></div><div class=\"rc\"><div class=\"e\">is the emotional and aesthetic focal point</div><div class=\"k\">정서적이고 심미적인 중심이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">of the elements in the surrounding environment</span>.</div><div class=\"k\"><span class=\"cw\">주위 환경에 있는 요소들의</span>.</div></div><div class=\"rnat\">공공장소의 조형물은 주위 환경에 있는 요소들의 정서적이고 심미적인 중심이다.</div><div class=\"rst\">교실 뒤 벽에 새 그림 하나를 건다고 해 봐요. 그 그림은 교실 전체의 <b>중심</b>이 돼요. = 지문 1번, 조형물은 주위 요소들의 중심.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Any environment is unique</div><div class=\"k\">어떤 환경이든 유일무이하다</div></div><div class=\"rc\"><div class=\"e\">with the diversity of its component elements,</div><div class=\"k\">그것(= 환경)의 구성 요소들의 다양성,</div></div><div class=\"rc\"><div class=\"e\">the connections between them</div><div class=\"k\">그것들(= 구성 요소들) 사이의 연관성,</div></div><div class=\"rc\"><div class=\"e\">and their appearance as a complete structure.</div><div class=\"k\">그리고 완전한 구조물로서 그것들(= 구성 요소들)의 모습 때문에.</div></div><div class=\"rnat\">어떤 환경이든 구성 요소들의 다양성, 그것들(그 구성 요소들) 사이의 연관성, 그리고 완전한 구조물로서 그것들의 모습 때문에 유일무이하다.</div><div class=\"rst\">우리 교실은 책상 배치, 게시판, 창문 모양이 다 달라서 세상에 하나뿐이에요. = 지문 2번, 모든 환경은 유일무이하다.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This preliminary structural analysis</div><div class=\"k\">이러한 예비적인 구조적 분석과</div></div><div class=\"rc\"><div class=\"e\">and acquaintance with the site</div><div class=\"k\">장소에 대한 지식은</div></div><div class=\"rc\"><div class=\"e\">chosen for the sculpture</div><div class=\"k\">조형물을 위해 선택된</div></div><div class=\"rc\"><div class=\"e\">is compulsory</div><div class=\"k\">필수적이다</div></div><div class=\"rc\"><div class=\"e\">before working on its design;</div><div class=\"k\">그것(= 조형물)의 설계 작업을 하기 전에;</div></div><div class=\"rc\"><div class=\"e\">it is a requirement</div><div class=\"k\">그것(= 이러한 예비 분석과 장소에 대한 지식)은 요건이다</div></div><div class=\"rc ckc\"><div class=\"e\">for <span class=\"cw\">successful integration in the specific space</span>.</div><div class=\"k\"><span class=\"cw\">특정 장소에의 성공적인 통합을 위한</span>. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">이러한 예비적인 구조적 분석과 조형물을 위해 선택된 장소에 대한 지식은 그것(공공 조형물)의 설계 작업을 하기 전에 필수적이다. (그리고) 그것은 특정 장소에의 성공적인 통합을 위한 요건이다.</div><div class=\"rst\">그래서 그림을 걸기 전에 교실을 먼저 살펴보는 게 필수예요. 그래야 그림이 교실에 <b>잘 녹아들어요</b>. = 빈칸, 성공적인 통합.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">The proper understanding</div><div class=\"k\">적절한 이해는</div></div><div class=\"rc\"><div class=\"e\">of the spatial characteristics of the elements,</div><div class=\"k\">요소들의 공간적 특징에 대한,</div></div><div class=\"rc\"><div class=\"e\">making up the whole multitude,</div><div class=\"k\">전체 다수(총체)를 구성하는,</div></div><div class=\"rc\"><div class=\"e\">as well as of the structural links</div><div class=\"k\">구조적 연결에 대한 (이해)뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">between the constituent elements of this specific microcosm</div><div class=\"k\">이 특정한 작은 세계의 구성 요소들 사이의</div></div><div class=\"rc\"><div class=\"e\">are preconditions</div><div class=\"k\">전제 조건이다</div></div><div class=\"rc\"><div class=\"e\">for satisfactory design and an adequate sculptural solution.</div><div class=\"k\">만족스러운 설계와 적절한 조형적 해법을 위한.</div></div><div class=\"rnat\">이 특정한 작은 세계의 구성 요소들 사이의 구조적 연결뿐만 아니라, 전체 다수(총체)를 구성하는 요소들의 공간적 특징에 대한 적절한 이해는 만족스러운 설계와 적절한 조형적 해법을 위한 전제 조건이다.</div><div class=\"rst\">벽 색, 가구 위치, 물건들끼리 어떻게 이어지는지 알아야 예쁘게 꾸밀 수 있어요. = 지문 4번, 구조적 연결 이해가 전제 조건.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Contrary to the mechanical adding</span></div><div class=\"k\"><span class=\"cw\">기계적으로 더 추가하는 것에 반해</span></div></div><div class=\"rc\"><div class=\"e\">of one more element to the multitude,</div><div class=\"k\">다수(로 이루어진 것)에 한 가지 요소를,</div></div><div class=\"rc\"><div class=\"e\">it is better to “weave” something more</div><div class=\"k\">어떤 것을 더 ‘엮는’ 것이 더 낫다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">into the context of the existing structure</span>.</div><div class=\"k\"><span class=\"cw\">기존 구조의 맥락 안에</span>.</div></div><div class=\"rnat\">다수(로 이루어진 것)에 한 가지 요소를 기계적으로 더 추가하는 것에 반해, 기존 구조의 맥락 안에 어떤 것을 더 ‘엮는’ 것이 더 낫다.</div><div class=\"rst\">아무 데나 하나 더 붙이지 말고, 원래 교실 분위기 속에 <b>엮어 넣어야</b>(weave) 해요. 그래서 빈칸은 장소에의 통합이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"aesthetic\" data-m=\"심미적인\"><b>aesthetic</b>심미적인</button><button type=\"button\" class=\"wdb\" data-w=\"focal point\" data-m=\"중심, 초점\"><b>focal point</b>중심, 초점</button><button type=\"button\" class=\"wdb\" data-w=\"preliminary\" data-m=\"예비의\"><b>preliminary</b>예비의</button><button type=\"button\" class=\"wdb\" data-w=\"compulsory\" data-m=\"필수적인, 의무적인\"><b>compulsory</b>필수적인, 의무적인</button><button type=\"button\" class=\"wdb\" data-w=\"integration\" data-m=\"통합\"><b>integration</b>통합</button><button type=\"button\" class=\"wdb\" data-w=\"precondition\" data-m=\"전제 조건\"><b>precondition</b>전제 조건</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 문장이 <b>Thus</b>(따라서)로 시작하니 앞 내용의 요약이에요. 2번의 <b>언어적·비언어적 습관이 비슷한지</b>를 한 말로 묶은 어구를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (7번)</span><div class=\"en\"><mark>Thus</mark>, <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> may provide a selection filter for the initiation of a relationship.</div><p class=\"ko\">따라서, ( ? )은 관계의 시작을 위한 선택 필터를 제공할 수 있다</p></div><div class=\"ck-via\"><i>▼</i><span>That is(즉)로 1번의 ‘조화’를 구체적으로 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">That is, to the extent that two people share <mark>similar verbal and nonverbal habits</mark> in a first meeting, they will be more comfortable with one another.</div><p class=\"ko\">즉, 두 사람이 첫 만남에서 <mark>비슷한 언어적 그리고 비언어적 습관을</mark> 공유하는 정도까지, 그들은 서로 더 편할 것이다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>빨리 말하고 움직이는 사람 ↔ 느린 사람</span><span><em>4·5번</em>양끝(정반대) 유형끼리는 첫 만남이 어렵고 관심도 적음</span><span><em>6번</em>비슷한 유형끼리는 편하고 ‘마음이 통함’</span></div><div class=\"ck-eq\">⇒ 공통점 = 말·행동 방식이 서로 맞는지가 관계 시작을 가른다</div></div><div class=\"ck-via\"><i>▼</i><span>행동 방식이 맞으면 바로 통한다 → 빈칸 = 행동의 조정</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 마무리 근거</span><div class=\"en\"><mark>Individuals with similar styles</mark>, however, are more comfortable and find that they just seem to “click” with one another.</div><p class=\"ko\">그러나, <mark>비슷한 유형의 사람들은</mark> 더 편안해하고 그들이 단지 바로 서로 ‘마음이 통하는’ 것 같다는 것을 알게 된다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">behavioral coordination 행동의 조정<small>말(verbal)과 몸짓(nonverbal) 습관이 서로 맞는 것을 한 말로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">cultural adaptability 문화적 적응성</span><span class=\"why\">‘서로 맞춘다’는 느낌이라 끌리지만, 지문에는 문화 이야기가 전혀 없어요. 3번은 말하는 속도·표현력 같은 행동 유형이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">information deficit 정보의 부족</span><span class=\"why\">지문은 상대에 대한 정보가 모자란 게 문제라고 하지 않았어요. 4·5번은 유형이 정반대라서 어렵다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">meaning negotiation 의미의 타협</span><span class=\"why\">말의 뜻을 서로 맞춰 가는 이야기가 아니에요. 2번은 말 내용이 아니라 언어적·비언어적 습관이 비슷한지를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">unconditional acceptance 무조건적인 수용</span><span class=\"why\">무조건 받아들이는 게 아니라, 5번처럼 유형이 다르면 관심이 줄어 걸러져요. 그래서 selection filter(선택 필터)예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Although a balance or harmony between partners</div><div class=\"k\">비록 파트너 사이의 균형이나 조화가</div></div><div class=\"rc\"><div class=\"e\">clearly develops over time in a relationship,</div><div class=\"k\">관계에서 시간이 지남에 따라 분명히 발전하긴 하지만,</div></div><div class=\"rc\"><div class=\"e\">it is also a factor</div><div class=\"k\">그것(= 파트너 사이의 균형이나 조화)은 요인이기도 하다</div></div><div class=\"rc\"><div class=\"e\">in initial attraction and interest in a partner.</div><div class=\"k\">초기 매력과 파트너에 대한 관심의.</div></div><div class=\"rnat\">비록 파트너 사이의 균형이나 조화가 관계에서 시간이 지남에 따라 분명히 발전하긴 하지만, 그것은 초기 매력과 파트너에 대한 관심의 요인이기도 하다.</div><div class=\"rst\">새 학기에 짝꿍과 잘 맞는 건 시간이 지나며 생기기도 하지만, 처음 만난 날부터 끌리게도 해요. = 지문 1번, 조화는 초기 매력의 요인.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">That is,</div><div class=\"k\">즉,</div></div><div class=\"rc\"><div class=\"e\">to the extent that two people share</div><div class=\"k\">두 사람이 공유하는 정도까지</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">similar verbal and nonverbal habits</span></div><div class=\"k\"><span class=\"cw\">비슷한 언어적 그리고 비언어적 습관을</span></div></div><div class=\"rc\"><div class=\"e\">in a first meeting,</div><div class=\"k\">첫 만남에서,</div></div><div class=\"rc\"><div class=\"e\">they will be more comfortable with one another.</div><div class=\"k\">그들(= 두 사람)은 서로 더 편할 것이다.</div></div><div class=\"rnat\">즉, 두 사람이 첫 만남에서 비슷한 언어적 그리고 비언어적 습관을 공유하는 정도까지, 그들은 서로 더 편할 것이다.</div><div class=\"rst\"><b>즉</b>(That is), 첫날 말투와 몸짓이 <b>비슷할수록</b> 서로 더 편해요. = 지문 2번, 언어적·비언어적 습관 공유.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">fast-paced individuals talk and move quickly</div><div class=\"k\">속도가 빠른 사람들은 빠르게 말을 하고 움직이며</div></div><div class=\"rc\"><div class=\"e\">and are more expressive,</div><div class=\"k\">더 표현력이 있는</div></div><div class=\"rc\"><div class=\"e\">whereas slow-paced individuals have a different tempo</div><div class=\"k\">반면에, 속도가 느린 사람들은 다른 속도를 가지고</div></div><div class=\"rc\"><div class=\"e\">and are less expressive.</div><div class=\"k\">표현력이 덜하다.</div></div><div class=\"rnat\">예를 들어, 속도가 빠른 사람들은 빠르게 말을 하고 움직이며 더 표현력이 있는 반면에, 속도가 느린 사람들은 다른 속도를 가지고 표현력이 덜하다.</div><div class=\"rst\">어떤 친구는 말도 행동도 빠르고 리액션이 크고, 어떤 친구는 천천히 말하고 표현이 적어요. = 지문 3번의 빠른 사람 ↔ 느린 사람.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Initial interactions between people</div><div class=\"k\">사람들 간의 초기 상호 작용은</div></div><div class=\"rc\"><div class=\"e\">at opposite ends of such a continuum</div><div class=\"k\">이러한 연속체의 양끝에 있는</div></div><div class=\"rc\"><div class=\"e\">may be more difficult</div><div class=\"k\">더 어려울 수 있다</div></div><div class=\"rc\"><div class=\"e\">than those between similar types.</div><div class=\"k\">비슷한 유형 간의 그것들(= 초기 상호 작용)보다.</div></div><div class=\"rnat\">이러한 연속체의 양끝에 있는 사람들 간의 초기 상호 작용은 비슷한 유형 간의 그것들(초기 상호 작용)보다 더 어려울 수 있다.</div><div class=\"rst\">그래서 엄청 빠른 친구와 엄청 느린 친구가 처음 만나면 대화가 삐걱대기 쉬워요. = 지문 4번, 양끝끼리는 첫 만남이 더 어렵다.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">In the case of contrasting styles,</div><div class=\"k\">대조적인 유형의 경우,</div></div><div class=\"rc\"><div class=\"e\">individuals may be less interested</div><div class=\"k\">사람들은 관심이 더 적을 수 있다</div></div><div class=\"rc\"><div class=\"e\">in pursuing a relationship</div><div class=\"k\">관계를 추구하는 데에</div></div><div class=\"rc\"><div class=\"e\">than if they were similar in interaction styles.</div><div class=\"k\">그들(= 사람들)이 상호 작용 유형이 비슷한 경우보다.</div></div><div class=\"rnat\">대조적인 유형의 경우, 사람들은 상호 작용 유형이 비슷한 경우보다 관계를 추구하는 데에 관심이 더 적을 수 있다.</div><div class=\"rst\">스타일이 정반대면 “얘랑 더 친해지고 싶다”는 마음도 덜 생겨요. = 지문 5번, 관계를 추구할 관심이 적다.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Individuals with similar styles</span>, however,</div><div class=\"k\">그러나, <span class=\"cw\">비
