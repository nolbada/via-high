<title>고3 미니모의고사 4회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}

.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

tive<sup>1</sup> of climate change, / the physical constraints<sup>2</sup> of densely inhabited<sup>3</sup> cities and the corresponding<sup>4</sup> demands of accessibility, mobility, safety, air pollution, and urban livability<sup>5</sup> / all limit the option of expanding road networks / purely to accommodate this rising demand.", "notes": [["1", "imperative", "불가피한 것, 긴요한 일"], ["2", "constraint", "제약"], ["3", "densely inhabited", "인구가 밀집한"], ["4", "corresponding", "그에 따른"], ["5", "livability", "거주 적합성"]], "lit": "기후 변화라는 불가피한 요구가 없더라도, / 인구가 밀집한 도시의 물리적 제약과 그에 따른 접근성, 이동성, 안전, 대기 오염, 도시 거주 적합성에 대한 요구는 / 모두 도로망을 확장한다는 선택지를 제한한다 / 순전히 이 증가하는 수요를 수용하기 위해서만.", "nat": "기후 변화라는 불가피한 요구가 없더라도, 인구가 밀집한 도시의 물리적 제약과 그에 따른 접근성·이동성·안전·대기 오염·도시 거주 적합성에 대한 요구는, 오로지 이 늘어나는 수요를 수용하기 위해 도로망을 확장한다는 선택지를 모두 제한한다.", "ana": "주어가 <b>the physical constraints ~ and the corresponding demands ~</b>로 and에 묶인 두 덩어리이고, 그 뒤의 <b>all</b>은 새 주어가 아니라 이 복수 주어를 다시 받아 강조하는 <b>동격의 all</b>이다. 그래서 동사는 단수 limits가 아니라 <b>limit</b>이다. 나열이 길어질수록 '<b>어디까지가 주어인가</b>'를 표시해 두어야 한다. 맨 뒤의 <b>to accommodate</b>는 expanding road networks의 목적을 밝히는 부사적 용법이고, <b>purely</b>가 그 목적을 '순전히 그것만을 위해'로 한정한다.", "pe": "\u0001Even without the imperative<sup>1</sup> \u0001of climate change\u0002\u0002, / the \u0001physical\u0002 constraints<sup>2</sup> \u0001of densely inhabited<sup>3</sup> cities\u0002 and the \u0001corresponding<sup>4</sup>\u0002 demands \u0001of accessibility, mobility, safety, air pollution, and urban livability<sup>5</sup>\u0002 / \u0001all\u0002 limit the option \u0001of expanding road networks\u0002 / \u0001purely to accommodate this rising demand\u0002.", "pk": "\u0001기후 변화라는 불가피한 요구가 없더라도\u0002, / \u0001인구가 밀집한 도시의\u0002 물리적 제약과 그에 따른 접근성, 이동성, 안전, 대기 오염, 도시 거주 적합성에 대한 요구는 / 모두 도로망을 확장한다는 선택지를 제한한다 / \u0001순전히 이 증가하는 수요를 수용하기 위해서만\u0002.", "core": "제약과 요구는 선택지를 제한한다.", "tags": ["without ~ = 부사구(양보): limit 꾸밈. of climate change = 형용사구: imperative 꾸밈", "주어 constraints and demands. physical, corresponding = 형용사. of ~ cities = 형용사구: constraints 꾸밈. of accessibility ~ = 형용사구: demands 꾸밈", "all = 주어를 다시 받는 강조(동격) 대명사 → 동사 limit(복수). 목적어 option. of expanding ~ = 형용사구: option 꾸밈", "to accommodate ~ = to부정사(부사적: 목적): limit 꾸밈. purely = 부사: 목적 한정"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 주어가 and로 이어진 아주 긴 명사구라 동사 limit이 한참 뒤에 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the physical constraints ~ and the corresponding demands ~ (물리적 제약과 그에 따른 요구)", "all: 주어를 다시 받는 '모두' (강조)", "V: limit (limit 제한하다. 복수 주어라 -s 없음)", "O: the option (선택지)", "뼈대 = <b>the constraints and the demands (all) limit the option</b>"]}, {"t": "주어의 첫째 덩어리는 <b>the physical constraints of densely inhabited cities</b>이다 (인구가 밀집한 도시의 물리적 제약).", "sub": ["physical 물리적인, constraint 제약, densely inhabited 인구가 밀집한"]}, {"t": "둘째 덩어리는 <b>the corresponding demands of accessibility, mobility, safety, air pollution, and urban livability</b>이다 (접근성, 이동성, 안전, 대기 오염, 도시 거주 적합성에 대한 그에 따른 요구).", "sub": ["corresponding 그에 따른, demand 요구, accessibility 접근성, mobility 이동성, urban livability 도시 거주 적합성"]}, {"t": "목적어 뒤 <b>of expanding road networks</b>는 option을 꾸민다 ('도로망을 확장한다는'). <b>purely to accommodate this rising demand</b>는 '순전히 이 증가하는 수요를 수용하기 위해서만'이라는 목적 to부정사이다.", "sub": ["expand 확장하다, road network 도로망, accommodate 수용하다, rising 증가하는"]}, {"t": "맨 앞 <b>Even without the imperative of climate change</b>는 '기후 변화라는 불가피한 요구가 없더라도'라는 양보 부사구이다 (imperative 불가피한 요구).", "sub": ["함정: limit은 명사로 알기 쉽지만 여기서는 동사이다."]}], "sum": "도시의 물리적 제약과 여러 요구, 늘어난 수요만 보고 도로를 넓히는 선택을 제한"}, {"i": "07", "q": "05", "s": "4", "title": "as절 + 동명사 주어 + S+V+C", "eng": "As a result, / as cities develop and their residents<sup>1</sup> become more prosperous<sup>2</sup>, / persuading<sup>3</sup> people to choose not to use cars / becomes an increasingly<sup>4</sup> key focus of city managers and planners.", "notes": [["1", "resident", "주민"], ["2", "prosperous", "부유한, 번영하는"], ["3", "persuade", "설득하다"], ["4", "increasingly", "점점 더"]], "lit": "그 결과, / 도시가 발전하고 그 주민들이 더 부유해지면서, / 사람들이 자동차를 이용하지 않기로 선택하도록 설득하는 일이 / 도시 관리자와 계획가의 점점 더 핵심적인 관심사가 된다.", "nat": "그 결과 도시가 발전하고 주민들이 더 부유해지면서, 사람들이 자동차를 이용하지 않기로 선택하도록 설득하는 일이 도시 관리자와 계획가의 점점 더 중요한 관심사가 된다.", "ana": "한 문장에 <b>as</b>가 두 가지로 쓰였다. 앞의 <b>As a result</b>는 '그 결과'라는 관용구이고, 뒤의 <b>as cities develop</b>은 '<b>~함에 따라</b>'라는 비례·시간의 접속사다. 진짜 주어는 그 뒤의 <b>persuading</b>으로 시작하는 <b>동명사구</b>이고 동사는 <b>becomes</b>이다. 동명사 주어는 단수 취급이라 becomes에 s가 붙는다. <b>choose not to use</b>에서 <b>not</b>이 to 앞에 놓인 것도 눈여겨 볼 점으로, 부정되는 것은 choose가 아니라 <b>to use</b>다.", "pe": "\u0001As a result\u0002, / \u0001as cities develop and their residents<sup>1</sup> become more prosperous<sup>2</sup>\u0002, / persuading<sup>3</sup> people to choose not to use cars / becomes an \u0001increasingly<sup>4</sup> key\u0002 focus \u0001of city managers and planners\u0002.", "pk": "\u0001그 결과\u0002, / \u0001도시가 발전하고 그 주민들이 더 부유해지면서\u0002, / 사람들이 자동차를 이용하지 않기로 선택하도록 설득하는 일이 / \u0001도시 관리자와 계획가의\u0002 점점 더 핵심적인 관심사가 된다.", "core": "사람들을 설득하는 일은 핵심 관심사가 된다.", "tags": ["As a result = 부사구('그 결과'): 주절 꾸밈", "<b>as절</b> = 부사절('~함에 따라'): becomes 꾸밈", "<b>동명사 주어</b>: persuading people to choose not to use cars (persuade A to V, not은 to use 부정)", "동사 becomes + 보어 focus (SVC). increasingly key = 부사+형용사: focus 꾸밈. of city managers and planners = 형용사구: focus 꾸밈"], "steps": [{"t": "이 문장은 <b>as 부사절 + 동명사구 주어 + S+V+C(2형식)</b>이다. 주어가 길어서 동사 becomes가 뒤에 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: persuading people to choose not to use cars (사람들이 자동차를 이용하지 않기로 선택하도록 설득하는 일)", "V: becomes (become 되다의 3인칭 단수 현재형)", "C: an increasingly key focus (점점 더 핵심적인 관심사. focus 관심사)", "뼈대 = <b>persuading ~ becomes a focus</b>"]}, {"t": "주어 안의 구조는 <b>persuade A to V</b> (A가 ~하도록 설득하다)이다.", "sub": ["A = people (사람들) / to choose (선택하다)", "not to use cars = 자동차를 이용하지 않다 (not이 to use를 부정)"]}, {"t": "<b>of city managers and planners</b>는 focus를 꾸미는 전치사구이다 (manager 관리자, planner 계획가)."}, {"t": "<b>as cities develop and their residents become more prosperous</b>는 '~함에 따라'라는 부사절이다.", "sub": ["S: cities / V: develop (발전하다)", "S: their residents (그 주민들. their = cities) / V: become / C: more prosperous (더 부유한. resident 주민)", "As a result(그 결과)는 문장 전체를 꾸미는 부사구"]}, {"t": "함정: as절 안의 become과 주절의 becomes를 구별한다. 주절 동사는 -s가 붙은 becomes이다."}], "sum": "도시가 발전할수록 시민이 차를 안 쓰게 설득하는 일이 관리자들의 핵심 과제"}, {"i": "08", "q": "06", "s": "2", "title": "S+V+C + in which절 (while 대조)", "eng": "The typical<sup>1</sup> scenario in the less developed world is one / in which a very few commercial agriculturalists<sup>2</sup> are technologically advanced / while the vast majority<sup>3</sup> are incapable<sup>4</sup> of competing.", "notes": [["1", "typical", "전형적인"], ["2", "agriculturalist", "농업 경영인"], ["3", "vast majority", "대다수"], ["4", "be incapable of", "~할 수 없다"]], "lit": "저개발 세계의 전형적인 상황은 바로 그런 것이다 / 아주 소수의 상업적 농업 경영인만 기술적으로 앞서 있는 / 반면 대다수는 경쟁할 능력이 없는.", "nat": "저개발 세계의 전형적인 상황은 아주 소수의 상업적 농업 경영인만 기술적으로 앞서 있고 대다수는 경쟁할 능력이 없는 그런 상황이다.", "ana": "보어 자리의 <b>one</b>은 숫자 '하나'가 아니라 앞에 나온 <b>scenario</b>의 반복을 피하는 <b>대명사</b>다. 즉 '전형적인 상황은 (그런) 상황이다'라는 뜻이고, 어떤 상황인지는 뒤의 <b>in which</b>절이 설명한다. <b>in which</b>는 「전치사 + 관계대명사」로 뒤에 <b>완전한 절</b>이 온다는 점이 that이나 which 단독과 다르다. 뒤쪽의 <b>while</b>은 '~하는 동안'이 아니라 <b>대조</b>의 '반면에'로 읽어야 소수와 대다수의 대립이 살아난다.", "pe": "The \u0001typical<sup>1</sup>\u0002 scenario \u0001in the less developed world\u0002 is one / \u0001in which a very few commercial agriculturalists<sup>2</sup> are technologically advanced\u0002 / \u0001while the vast majority<sup>3</sup> are incapable<sup>4</sup> of competing\u0002.", "pk": "\u0001저개발 세계의\u0002 \u0001전형적인\u0002 상황은 바로 그런 것이다 / \u0001아주 소수의 상업적 농업 경영인만 기술적으로 앞서 있는\u0002 / \u0001반면 대다수는 경쟁할 능력이 없는\u0002.", "core": "전형적인 상황은 그런 상황이다.", "tags": ["주어 scenario + 동사 is + 보어 one (= scenario, SVC). typical = 형용사. in ~ world = 형용사구: scenario 꾸밈", "<b>in which</b>절 = 관계절(형용사절): one 꾸밈. 안쪽 a very few agriculturalists are advanced", "while절 = 대조 부사절 ('반면에'). 안쪽 majority are incapable of competing"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 보어 one 뒤에 in which 관계절이 길게 붙는다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The typical scenario (전형적인 상황. typical 전형적인, scenario 상황)", "V: is (be ~이다)", "C: one (= scenario, 그런 상황)", "뼈대 = <b>The typical scenario is one</b>"]}, {"t": "<b>in the less developed world</b>는 scenario를 꾸미는 전치사구이다 ('저개발 세계의')."}, {"t": "<b>in which ~ competing</b>은 관계절(형용사절)이다. one을 꾸민다. in which 뒤는 완전한 절이다.", "sub": ["S: a very few commercial agriculturalists (아주 소수의 상업적 농업 경영인) / V: are / C: technologically advanced (기술적으로 앞선)", "agriculturalist 농업 경영인, technologically 기술적으로"]}, {"t": "<b>while the vast majority are incapable of competing</b>은 대조를 나타내는 while절이다 ('반면에').", "sub": ["S: the vast majority (대다수) / V: are / C: incapable of competing (경쟁할 능력이 없는)", "be incapable of ~ing = ~할 능력이 없다, compete 경쟁하다"]}], "sum": "저개발 세계의 전형적 상황, 소수만 기술적으로 앞서고 대다수는 경쟁 불가"}], "qs": [{"q": "01", "type": "필자 주장", "src": "2016학년도 6월 20번", "ans": "⑤", "tr": [["1", "계획 수립은 여러분의 논리적 사고를 통제하는 뇌의 절반만 사용한다."], ["2", "뇌의 나머지 절반인 직관적인 쪽은 이 계획 수립 과정에서 배제된다."], ["3", "늘 계획을 세워야 한다고 고집한다면, 여러분은 자신의 직관적인 자아와 그것이 주는 내면의 즐거움으로부터 스스로를 단절시키는 것이다."], ["4", "계획 중독을 끊으려면 자신에게 한 가지 자유를 허락하라."], ["5", "호기심만을 유일한 길잡이로 삼아 공원이나 동네를 답사하며 하루를 보내기로 결심하라."], ["6", "다음번에 누군가에게 끌려 자기소개를 하고 싶어지거든, 망설이지 말고 그렇게 하라."], ["7", "여러분은 새 친구를 사귀게 될 가능성이 크다."], ["8", "직관을 따를 자유를 자신에게 줌으로써, 여러분은 내면의 목소리에 대한 민감성을 기르게 된다."], ["9", "여러분은 삶을 하나의 모험으로 만들어 줄 수 있는 그 조용한 메시지를 듣는 법을 배우게 된다."]], "evh": "8번 문장", "ev": [{"en": true, "h": "By giving yourself freedom to follow your intuition, you develop your sensitivity to your inner voice."}, {"en": false, "h": "주장 문항은 <b>명령문</b>과 <b>By V-ing</b> 같은 방법 제시 표현을 먼저 본다. 이 글은 4·5·6번 문장에서 '자유를 허락하라 · 답사하며 하루를 보내라 · 망설이지 말고 하라'로 계속 명령을 던지고, 8번 문장에서 그 이유를 '<b>직관을 따를 자유를 주면 내면의 목소리에 민감해진다</b>'로 정리한다. 즉 계획에만 매이지 말고 때로는 직관을 따르라는 것이 필자의 주장이다."}], "opts": [{"n": "①", "t": "내면의 즐거움을 얻기 위해 친구를 많이 사귀어라.", "a": false, "x": true, "trap": false, "e": "친구를 사귄다는 말은 7번 문장에 한 번 나오지만 그것은 직관을 따랐을 때 <b>따라오는 결과</b>일 뿐, 친구를 많이 사귀라고 권하는 글이 아니다."}, {"n": "②", "t": "학습 계획을 수립할 때는 시간 배분을 적절히 해라.", "a": false, "x": true, "trap": false, "e": "계획(planning)이라는 단어만 겹친다. 글은 계획을 <b>잘 세우는 법</b>이 아니라 계획에만 매이지 말라는 이야기다."}, {"n": "③", "t": "사고력 향상을 위해 가능한 한 산책 시간을 늘려라.", "a": false, "x": true, "trap": true, "e": "공원과 동네를 답사하라는 말이 나오지만 그것은 <b>호기심을 따라 보내는 하루</b>의 예시이지 산책 시간을 늘리라는 조언이 아니다."}, {"n": "④", "t": "새로운 모험을 시작하기 전에 주변 사람들과 상의해라.", "a": false, "x": true, "trap": false, "e": "adventure는 마지막 문장에 비유로 한 번 나올 뿐이고, 남과 <b>상의하라</b>는 내용은 어디에도 없다."}, {"n": "⑤", "t": "계획 수립에 얽매이지만 말고 때로는 직관에 따라 행동해라.", "a": true, "x": false, "trap": false, "e": "1~3번 문장이 '계획은 뇌의 절반만 쓰고 직관을 배제한다'로 문제를 제기하고, 4번 문장부터 끝까지가 '직관을 따르라'는 처방이다. 글의 두 축을 한 문장에 담았다."}], "w": [["planning", "계획 수립"], ["involve", "관여시키다, 수반하다"], ["logical thinking", "논리적 사고"], ["intuitive", "직관적인"], ["be left out of", "~에서 배제되다"], ["insist on", "~을 고집하다"], ["cut A off from B", "A를 B로부터 단절시키다"], ["addiction", "중독"], ["curiosity", "호기심"], ["be attracted to", "~에게 끌리다"], ["sensitivity", "민감성, 감수성"], ["intuition", "직관"]]}, {"q": "02", "type": "도표 불일치", "src": "2019학년도 수능 25번", "ans": "③", "tr": [["1", "위의 두 표는 두 학년도, 즉 1979~1980년과 2016~2017년에 미국의 대학과 대학교에 등록한 유학생의 상위 10개 출신 국가와 그 수를 보여 준다."], ["2", "① 2016~2017년 유학생 총수는 1979~1980년 유학생 총수보다 3배 넘게 많았다."], ["3", "② 1979~1980년 유학생의 상위 3개 출신 국가는 이란, 대만, 나이지리아였는데, 그중 2016~2017년 상위 10개 출신 국가 목록에 포함된 나라는 대만뿐이었다."], ["4", "③ 인도 출신 학생 수는 1979~1980년보다 2016~2017년에 20배 넘게 많았고, 인도는 2016~2017년에 중국보다 높은 순위를 차지했다."], ["5", "④ 1979~1980년 상위 10개 출신 국가에 포함되지 않았던 한국은 2016~2017년에 3위를 차지했다."], ["6", "⑤ 일본 출신 학생 수는 1979~1980년보다 2016~2017년에 더 많았지만, 일본의 순위는 1979~1980년보다 2016~2017년에 더 낮았다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "The number of students from India was over twenty times larger in 2016−2017 than in 1979−1980, and India ranked higher than China in 2016−2017."}, {"en": false, "h": "도표 문항은 선택지를 <b>앞뒤 두 조각으로 잘라</b> 따로 확인한다. 앞 조각(9,000명 → 186,000명, 20배 넘게 증가)은 표와 맞다. 그런데 뒤 조각이 문제다. 2016~2017년 표에서 중국은 <b>351,000명으로 1위</b>, 인도는 <b>186,000명으로 2위</b>다. 즉 인도는 중국보다 <b>낮은</b> 순위다. 앞이 맞다고 뒤도 맞겠거니 하고 넘어가면 그대로 걸린다."}], "opts": [{"n": "①", "t": "2016~2017년 총수가 1979~1980년의 3배 넘게 많았다", "a": false, "x": true, "trap": false, "e": "286,000명 → 1,079,000명이므로 3배(858,000명)를 넘는다. 표와 일치한다."}, {"n": "②", "t": "1979~1980년 상위 3개국 중 대만만 2016~2017년 목록에 포함되었다", "a": false, "x": true, "trap": false, "e": "1979~1980년 1~3위는 이란·대만·나이지리아이고, 2016~2017년 목록에 남은 나라는 대만(22,000명)뿐이다."}, {"n": "③", "t": "인도가 2016~2017년에 중국보다 높은 순위였다", "a": true, "x": false, "trap": false, "e": "2016~2017년 1위는 중국(351,000명), 2위가 인도(186,000명)이다. 인도는 중국보다 <b>낮은</b> 순위이므로 표와 어긋난다."}, {"n": "④", "t": "한국은 1979~1980년 목록에 없었고 2016~2017년에 3위였다", "a": false, "x": true, "trap": true, "e": "1979~1980년 표에 한국은 없고, 2016~2017년에는 59,000명으로 3위이다. 그대로 일치한다."}, {"n": "⑤", "t": "일본은 학생 수가 늘었지만 순위는 낮아졌다", "a": false, "x": true, "trap": false, "e": "12,000명 → 19,000명으로 수는 늘었지만 순위는 5위 → 8위로 내려갔다. 수와 순위가 반대로 움직이는 전형적인 항목이다."}], "w": [["origin country", "출신 국가"], ["international student", "유학생"], ["enroll in", "~에 등록하다"], ["school year", "학년도"], ["total number", "총수, 총계"], ["times larger than", "~보다 몇 배 더 많은"], ["among which", "그중에서"], ["be included in", "~에 포함되다"], ["rank", "순위를 차지하다"], ["although", "비록 ~이지만"], ["detail", "세부 항목"], ["rounding", "반올림"]]}, {"q": "03", "type": "밑줄 의미", "src": "2024학년도 수능 21번", "ans": "④", "tr": [["1", "여러분이 주의를 어떻게 집중하느냐가 스트레스에 어떻게 대처하느냐에 결정적인 역할을 한다."], ["2", "분산된 주의는 스트레스를 놓아 버리는 능력을 해치는데, 주의가 분산되어 있어도 그것은 좁게 집중되어 있기 때문이며, 여러분이 경험 가운데 스트레스가 많은 부분에만 고착될 수 있기 때문이다."], ["3", "주의의 스포트라이트가 넓어지면 여러분은 스트레스를 더 쉽게 놓아 버릴 수 있다."], ["4", "어떤 상황이든 훨씬 더 많은 측면을 균형 잡힌 시각으로 볼 수 있고, 여러분을 피상적이고 불안을 유발하는 수준의 주의에 얽매는 한 부분에 갇히지 않게 된다."], ["5", "좁은 초점은 각 경험의 스트레스 수준을 높이지만, 넓어진 초점은 스트레스 수준을 낮추는데, 각 상황을 더 넓은 관점에 놓을 수 있기 때문이다."], ["6", "불안을 유발하는 세부 사항 하나는 더 큰 그림보다 덜 중요하다."], ["7", "그것은 여러분 자신을 눌어붙지 않는 프라이팬으로 바꾸는 것과 같다."], ["8", "여전히 달걀을 부칠 수는 있지만, 달걀이 팬에 달라붙지는 않을 것이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "A narrow focus heightens the stress level of each experience, but a widened focus turns down the stress level because you're better able to put each situation into a broader perspective."}, {"en": false, "h": "밑줄 의미 문항은 <b>비유를 글의 주장으로 되돌려 읽는</b> 문제다. 글 전체가 '좁은 초점 → 스트레스 상승 / 넓은 초점 → 스트레스 하강'이라는 한 가지 대립으로 굴러간다. 달걀이 <b>달라붙지 않는 팬</b>은 스트레스가 나에게 눌어붙지 않는 상태이고, 그렇게 만드는 방법이 바로 <b>넓어진 초점</b>이다. 따라서 밑줄은 '경험을 그 스트레스적인 측면 너머로 넓게 보는 것'을 뜻한다."}], "opts": [{"n": "①", "t": "일상에서 어떤 스트레스 경험과도 결코 마주하지 않는 것", "a": false, "x": true, "trap": false, "e": "마지막 문장이 '<b>여전히 달걀을 부칠 수는 있다</b>'라고 못 박는다. 스트레스 경험 자체는 그대로 있고 달라붙지만 않는 것이다."}, {"n": "②", "t": "스트레스의 원인을 확인하기 위해 관점을 넓히는 것", "a": false, "x": true, "trap": true, "e": "관점을 넓힌다는 앞부분은 맞지만, 글은 원인을 <b>찾아내는</b> 이야기를 한 적이 없다. 목적이 다르게 붙었다."}, {"n": "③", "t": "경험의 긍정적인 측면에만 주의를 국한시키지 않는 것", "a": false, "x": true, "trap": false, "e": "'긍정적인 측면'이라는 말은 글에 없다. 글의 대립은 긍정/부정이 아니라 <b>좁음/넓음</b>이다."}, {"n": "④", "t": "경험을 그 스트레스적인 측면 너머로 더 넓게 보는 것", "a": true, "x": false, "trap": false, "e": "3~5번 문장의 <b>widened focus</b>, <b>broader perspective</b>, <b>the bigger picture</b>가 모두 이 한 줄로 모인다."}, {"n": "⑤", "t": "넓은 시각을 기르는 원천으로 스트레스를 고려하는 것", "a": false, "x": true, "trap": false, "e": "인과가 뒤집혔다. 글은 <b>넓은 시각이 스트레스를 낮춘다</b>고 했지, 스트레스가 넓은 시각을 길러 준다고 하지 않았다."}], "w": [["play a critical role in", "~에서 결정적 역할을 하다"], ["scattered", "분산된, 산만한"], ["let go of", "~을 놓아 버리다"], ["fixate on", "~에 집착하다, 고착하다"], ["attentional spotlight", "주의의 스포트라이트"], ["put in perspective", "균형 잡힌 시각으로 보다"], ["get locked into", "~에 갇히다"], ["tie A down to B", "A를 B에 얽매다"], ["superficial", "피상적인"], ["anxiety-provoking", "불안을 유발하는"], ["heighten", "높이다"], ["nonstick", "달라붙지 않는"]]}, {"q": "04", "type": "어법", "src": "2022년 10월 29번", "ans": "④", "tr": [["1", "지도자들이 자신을 지도자가 아닌 사람들과 구별해 주는 특정한 신체적·지적·성격적 특성을 선천적으로 지닌다는 관념은 특성 기반 리더십 접근법의 근본적인 믿음이었다."], ["2", "이 접근법은 1800년대 후반부터 1940년대 중반까지 리더십 연구를 지배했고, 지난 20년 남짓 동안 관심이 되살아나는 것을 경험해 왔다."], ["3", "초기의 특성 이론가들은 어떤 사람들은 자신을 위대한 지도자가 되게 해 주는 특성을 타고난다고 믿었다."], ["4", "그리하여 이 분야의 초기 연구는 '지도자는 var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>명령문</b>(allow(허락하라), Decide(결정하라), go ahead(그렇게 하라))과 <b>By V-ing</b>(~함으로써) 결론 문장에 있어요. 1~3번은 계획만 고집할 때의 문제이고, 필자가 시키는 건 <b>follow your intuition</b>(직관을 따르라)이에요.</p><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 문제 제기</span><div class=\"en\">If you <mark>insist on always having a plan</mark>, you cut yourself off from your intuitive self</div><p class=\"ko\">당신이 <mark>항상 계획이 있어야 함을 주장한다면</mark>, 당신은 스스로를 단절시키게 된다 당신의 직관적인 자아와</p></div><div class=\"ck-via\"><i>▼</i><span>문제를 말한 뒤 바로 '이렇게 해라'로 넘어가요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 첫 명령문</span><div class=\"en\">To break planning addiction, <mark>allow yourself one freedom</mark>.</div><p class=\"ko\">계획 수립 중독을 끊으려면, <mark>당신 자신에게 한 가지 자유를 허락하라</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>호기심 하나만 믿고 공원·동네 둘러보며 하루 보내기</span><span><em>6번</em>누군가에게 끌리면 망설이지 말고 먼저 인사하기</span></div><div class=\"ck-eq\">⇒ 두 명령문의 공통점 = 계획표 없이 마음 가는 대로 해 보기</div></div><div class=\"ck-via\"><i>▼</i><span>By V-ing(~함으로써)로 명령들의 이유와 결론을 한 줄로 정리해요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">By giving yourself freedom <mark>to follow your intuition</mark>, you develop your sensitivity to your inner voice.</div><p class=\"ko\">당신 자신에게 자유를 줌으로써 <mark>직관을 따를</mark>, 당신은 민감성을 계발하게 된다 당신 내면의 목소리에 대한.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">계획 수립에 얽매이지만 말고 때로는 직관에 따라 행동해라.<small>3번 insist on a plan(계획을 고집하다)을 버리고 8번 follow your intuition(직관을 따르다)을 하라는 말 그대로예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">내면의 즐거움을 얻기 위해 친구를 많이 사귀어라.</span><span class=\"why\">[범위 좁음] 7번 make a new friend(새 친구를 사귀다)는 6번 명령을 따랐을 때의 예시 결과일 뿐이에요. 친구 많이 사귀기가 아니라 직관 따르기가 핵심이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">학습 계획을 수립할 때는 시간 배분을 적절히 해라.</span><span class=\"why\">[반대] 지문은 계획을 잘 세우라는 게 아니라 4번처럼 planning addiction(계획 수립 중독)을 끊으라고 해요. 학습·시간 배분 얘기도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">사고력 향상을 위해 가능한 한 산책 시간을 늘려라.</span><span class=\"why\">[범위 좁음] 5번 공원 둘러보기는 호기심(curiosity)을 따르는 예시 하나예요. 산책 시간을 늘리라거나 사고력을 키우라는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">새로운 모험을 시작하기 전에 주변 사람들과 상의해라.</span><span class=\"why\">[지문에 없음] 9번에 adventure(모험)가 나오지만 남과 상의하라는 말은 없어요. 오히려 내 inner voice(내면의 목소리)를 들으라고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Planning involves</div><div class=\"k\">계획 수립은 관련되어 있다</div></div><div class=\"rc\"><div class=\"e\">only the half of your brain</div><div class=\"k\">당신의 뇌의 반쪽(부분)에만</div></div><div class=\"rc\"><div class=\"e\">that controls your logical thinking.</div><div class=\"k\">당신의 논리적 사고를 통제하는 (= 뇌의 반쪽)</div></div><div class=\"rnat\">계획 수립은 당신의 논리적 사고를 통제하는 뇌의 반쪽(부분)에만 관련되어 있다.</div><div class=\"rst\">방학 계획표를 꼼꼼히 짜는 건 머리의 '따지는 쪽'만 쓰는 일이에요. = 지문의 계획은 논리적 사고를 맡은 뇌 반쪽만 쓴다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The other intuitive half of your brain</div><div class=\"k\">당신의 뇌의 직관적인 나머지 반쪽은</div></div><div class=\"rc\"><div class=\"e\">is left out of this planning process.</div><div class=\"k\">이 계획 수립 과정에서 배제된다.</div></div><div class=\"rnat\">당신의 뇌의 직관적인 나머지 반쪽은 이 계획 수립 과정에서 배제된다.</div><div class=\"rst\">그동안 '왠지 이게 하고 싶다'는 느낌 쪽 뇌는 놀고 있어요. 지문도 <b>직관적인</b>(intuitive) 나머지 반쪽이 빠진다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If you insist on always having a plan,</div><div class=\"k\">당신이 항상 계획이 있어야 함을 주장한다면,</div></div><div class=\"rc\"><div class=\"e\">you cut yourself off from</div><div class=\"k\">당신은 스스로를 단절시키게 된다</div></div><div class=\"rc\"><div class=\"e\">your intuitive self</div><div class=\"k\">당신의 직관적인 자아와</div></div><div class=\"rc\"><div class=\"e\">and the inner joy it provides.</div><div class=\"k\">그것(= 당신의 직관적인 자아)이 제공하는 내적 즐거움으로부터.</div></div><div class=\"rnat\">당신이 항상 계획이 있어야 함을 주장한다면, 당신은 당신의 직관적인 자아와 그것이 제공하는 내적 즐거움으로부터 스스로를 단절시키게 된다.</div><div class=\"rst\">늘 계획표대로만 하겠다고 우기면, 마음 가는 대로 할 때의 즐거움을 놓쳐요. = 지문의 <b>insist on</b>(~을 고집하다)이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">To break planning addiction,</div><div class=\"k\">계획 수립 중독을 끊으려면,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">allow yourself one freedom</span>.</div><div class=\"k\"><span class=\"cw\">당신 자신에게 한 가지 자유를 허락하라</span>.</div></div><div class=\"rnat\">계획 수립 중독을 끊으려면, 당신 자신에게 한 가지 자유를 허락하라.</div><div class=\"rst\">그러니 하루쯤은 계획표 없이 놀아 보는 <b>자유</b>를 줘 봐요. = 지문의 첫 명령문 allow yourself one freedom(자유를 허락하라)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Decide to spend a day</div><div class=\"k\">하루를 보내기로 결정하라</div></div><div class=\"rc\"><div class=\"e\">exploring a park or a neighborhood</div><div class=\"k\">공원이나 근처 지역을 답사하며</div></div><div class=\"rc\"><div class=\"e\">with curiosity as your only guide.</div><div class=\"k\">호기심을 당신의 유일한 안내자로 삼아.</div></div><div class=\"rnat\">호기심을 유일한 안내자로 삼아 공원이나 근처 지역을 답사하며 하루를 보내기로 결정하라.</div><div class=\"rst\">주말에 지도도 없이, 궁금한 골목을 따라 동네를 돌아다녀 봐요. 지문도 호기심만 안내자로 삼아 하루를 보내라고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The next time you feel attracted to someone,</div><div class=\"k\">다음에 당신이 누군가에게 끌림을 느끼고,</div></div><div class=\"rc\"><div class=\"e\">and want to introduce yourself,</div><div class=\"k\">자신을 소개하고 싶어질 때가 오면,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">go ahead</span>.</div><div class=\"k\"><span class=\"cw\">그렇게 하라</span>.</div></div><div class=\"rnat\">다음에 당신이 누군가에게 끌림을 느껴서 자신을 소개하고 싶어질 때가 오면, 그렇게 하라.</div><div class=\"rst\">전학 온 친구가 왠지 끌리면, 망설이지 말고 먼저 인사해 봐요. = 지문의 <b>go ahead</b>(그렇게 하라)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">You’ll be likely to make a new friend.</div><div class=\"k\">당신은 새로운 친구를 사귀게 될 것이다.</div></div><div class=\"rnat\">당신은 새로운 친구를 사귀게 될 것이다.</div><div class=\"rst\">그러면 새 친구가 생길 가능성이 높아요. 지문도 새로운 친구를 사귀게 될 거라고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">By giving yourself freedom</div><div class=\"k\">당신 자신에게 자유를 줌으로써</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to follow your intuition</span>,</div><div class=\"k\"><span class=\"cw\">직관을 따를</span>,</div></div><div class=\"rc\"><div class=\"e\">you develop your sensitivity</div><div class=\"k\">당신은 민감성을 계발하게 된다</div></div><div class=\"rc\"><div class=\"e\">to your inner voice.</div><div class=\"k\">당신 내면의 목소리에 대한.</div></div><div class=\"rnat\">당신 자신에게 직관을 따를 자유를 줌으로써, 당신은 당신 내면의 목소리에 대한 민감성을 계발하게 된다.</div><div class=\"rst\">이렇게 <b>느낌을 따라</b> 해 보면 내 마음의 소리를 점점 잘 알아채요. = 지문의 follow your intuition(직관을 따르다), 필자의 주장이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">You learn to hear</div><div class=\"k\">당신은 듣는 법을 배우게 된다</div></div><div class=\"rc\"><div class=\"e\">the quiet messages</div><div class=\"k\">그 조용한 메시지(내면의 목소리)를</div></div><div class=\"rc\"><div class=\"e\">that can make your life an adventure.</div><div class=\"k\">당신의 삶을 모험으로 만들 수 있는 (= 그 조용한 메시지)</div></div><div class=\"rnat\">당신은 당신의 삶을 모험으로 만들 수 있는 그 조용한 메시지(내면의 목소리)를 듣는 법을 배우게 된다.</div><div class=\"rst\">그 작은 마음의 소리를 듣게 되면 평범한 하루도 신나는 모험이 돼요. 지문도 삶이 adventure(모험)가 된다며 끝내요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"intuitive\" data-m=\"직관적인\"><b>intuitive</b>직관적인</button><button type=\"button\" class=\"wdb\" data-w=\"left out of\" data-m=\"~에서 배제된\"><b>left out of</b>~에서 배제된</button><button type=\"button\" class=\"wdb\" data-w=\"insist on\" data-m=\"~을 고집하다\"><b>insist on</b>~을 고집하다</button><button type=\"button\" class=\"wdb\" data-w=\"cut yourself off from\" data-m=\"스스로를 ~로부터 단절시키다\"><b>cut yourself off from</b>스스로를 ~로부터 단절시키다</button><button type=\"button\" class=\"wdb\" data-w=\"addiction\" data-m=\"중독\"><b>addiction</b>중독</button><button type=\"button\" class=\"wdb\" data-w=\"sensitivity\" data-m=\"민감성, 감수성\"><b>sensitivity</b>민감성, 감수성</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">도표 선지는 <b>앞뒤 두 조각으로 잘라</b> 따로 확인하세요. 앞 조각(배수)이 맞아도 뒤 조각의 <b>비교급</b>(higher 더 높은)과 <b>비교 대상</b>(China 중국)에서 틀리는 게 함정이에요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번 문장: 2016~2017년 총수가 1979~1980년의 3배 넘게 많음 → 표와 같음</span><span><em>②</em>3번 문장: 1979~1980년 상위 3개국 중 대만만 2016~2017년 목록에 있음 → 표와 같음</span><span><em>④</em>5번 문장: 한국은 1979~1980년 목록에 없다가 2016~2017년 3위 → 표와 같음</span><span><em>⑤</em>6번 문장: 일본은 학생 수는 늘었지만 순위는 내려감 → 표와 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 표와 같아요 → 남은 ③을 두 조각으로 잘라 확인</div></div><div class=\"ck-via\"><i>▼</i><span>앞 조각은 배수 비교예요. 9,000명에서 186,000명이니 20배 넘게 맞아요</span></div><div class=\"ck-step\"><span class=\"lab\">③ 앞 조각 (4번)</span><div class=\"en\">The number of students from India was over twenty times larger in 2016−2017 than in 1979−1980,</div><p class=\"ko\">인도에서 온 학생의 수는 1979–1980년보다 2016–2017년에 20배 넘게 더 많았고,</p></div><div class=\"ck-via\"><i>▼</i><span>앞이 맞았다고 넘어가지 말고, 뒤 조각의 순위를 표에서 다시 확인</span></div><div class=\"ck-step key\"><span class=\"lab\">③ 뒤 조각 · 결정적 단서</span><div class=\"en\">and India ranked <mark>higher</mark> than <mark>China</mark> in 2016−2017.</div><p class=\"ko\">그리고 2016–2017년에 인도는 <mark>중국보다</mark> <mark>더 높은</mark> 순위를 차지했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">인도가 2016~2017년에 중국보다 높은(higher) 순위였다<small>표에서 2016~2017년 1위는 중국(351,000명), 인도(186,000명)는 2위라 higher(더 높은)가 아니라 lower(더 낮은)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">일본은 학생 수가 늘었지만 순위는 낮아졌다</span><span class=\"why\">6번과 같아요. 수는 larger(더 많은)인데 순위는 ranked lower(더 낮은 순위를 차지했다)라 방향이 엇갈려 헷갈리지만, 다른 나라가 더 많이 늘어서 맞는 문장이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2016~2017년 총수가 1979~1980년의 3배 넘게 많았다</span><span class=\"why\">2번과 같아요. 2016~2017년 총수가 1979~1980년 총수보다 over three times larger(3배 넘게 더 많은)예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">1979~1980년 상위 3개국 중 대만만 2016~2017년 목록에 포함되었다</span><span class=\"why\">3번과 같아요. 이란·대만·나이지리아 중 only Taiwan(오직 대만만)이 2016~2017년 상위 10개국 목록에 들어 있어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">한국은 1979~1980년 목록에 없었고 2016~2017년에 3위였다</span><span class=\"why\">5번과 같아요. 한국은 1979~1980년 상위 10개국에 not included(포함되지 않은)였고, 2016~2017년에 ranked third(3위를 차지했다)예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The tables above show</div><div class=\"k\">위 표는 보여 준다</div></div><div class=\"rc\"><div class=\"e\">the
