">④ 1979–1980년에 (유학생의) 상위 10개 출신국에 포함되지 않았던 한국은 2016–2017년에 3위를 차지했다.</div><div class=\"rst\">예전엔 순위표에 이름도 없던 한국 학교가 지금은 3등이에요. = 지문의 ranked third(3위를 차지했다)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">⑤ Although the number of students from Japan</div><div class=\"k\">⑤ 비록 일본에서 온 학생의 수는</div></div><div class=\"rc\"><div class=\"e\">was larger in 2016−2017 than in 1979−1980,</div><div class=\"k\">1979–1980년보다 2016–2017년에 더 많았지만,</div></div><div class=\"rc\"><div class=\"e\">Japan ranked lower</div><div class=\"k\">일본은 더 낮은 순위를 차지했다</div></div><div class=\"rc\"><div class=\"e\">in 2016−2017 than in 1979−1980.</div><div class=\"k\">1979–1980년보다 2016–2017년에.</div></div><div class=\"rnat\">⑤ 비록 일본에서 (미국으로) 온 학생의 수는 1979–1980년보다 2016–2017년에 더 많았지만, 일본은 1979–1980년보다 2016–2017년에 더 낮은 순위를 차지했다.</div><div class=\"rst\">일본 학교는 학생이 늘었는데도 다른 학교가 더 많이 늘어 순위는 내려갔어요. = 지문의 <b>ranked lower</b>(더 낮은 순위를 차지했다)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"origin countries\" data-m=\"출신 국가들\"><b>origin countries</b>출신 국가들</button><button type=\"button\" class=\"wdb\" data-w=\"international student\" data-m=\"유학생\"><b>international student</b>유학생</button><button type=\"button\" class=\"wdb\" data-w=\"enrolled in\" data-m=\"~에 등록한\"><b>enrolled in</b>~에 등록한</button><button type=\"button\" class=\"wdb\" data-w=\"times larger than\" data-m=\"~보다 몇 배 더 많은\"><b>times larger than</b>~보다 몇 배 더 많은</button><button type=\"button\" class=\"wdb\" data-w=\"among which\" data-m=\"그중에서\"><b>among which</b>그중에서</button><button type=\"button\" class=\"wdb\" data-w=\"rank\" data-m=\"순위를 차지하다\"><b>rank</b>순위를 차지하다</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. 프라이팬 = 나, 계란 = 스트레스 경험, 안 달라붙음 = 스트레스가 나에게 눌어붙지 않음. 앞의 <b>widened focus</b>(넓은 초점)·<b>bigger picture</b>(더 큰 그림)로 속뜻을 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (7번)</span><div class=\"en\">It’s like transforming yourself into a <mark>nonstick frying pan</mark>.</div><p class=\"ko\">그것은 여러분 스스로를 변화시키는 것과 같다 <mark>달라붙지 않는 프라이팬으로</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>It(그것)이 가리키는 것 = 바로 앞에서 말한 '넓게 보기'</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">but <mark>a widened focus turns down the stress level</mark> because you’re better able to put each situation into a broader perspective.</div><p class=\"ko\">하지만 <mark>넓은 초점은 스트레스 수준을 낮춘다</mark> 여러분이 각 상황을 더 잘 볼 수 있기 때문에 더 넓은 관점으로.</p></div><div class=\"ck-via\"><i>▼</i><span>불안한 한 조각보다 전체를 보라는 말이 밑줄 바로 앞에 있어요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 한 번 더 정리</span><div class=\"en\">One anxiety-provoking detail is less important than <mark>the bigger picture</mark>.</div><p class=\"ko\">불안을 유발하는 하나의 세부 사항은 <mark>더 큰 그림보다</mark> 덜 중요하다.</p></div><div class=\"ck-via\"><i>▼</i><span>계란은 여전히 부쳐요 = 스트레스 경험은 그대로 생겨요. 다만 달라붙지 않아요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 비유 풀이</span><div class=\"en\">You can still fry an egg, but the egg <mark>won’t stick to the pan</mark>.</div><p class=\"ko\">여러분은 여전히 계란을 부칠 수 있다, 하지만 그 계란은 <mark>팬에 달라붙지 않을 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>프라이팬</em>나 자신</span><span><em>계란</em>스트레스가 생기는 경험</span><span><em>안 달라붙음</em>넓게 보니 스트레스 부분에 갇히지 않음</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 경험을 스트레스 부분 너머로 넓게 보기 → ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">경험을 그 스트레스적인 측면 너머로 더 넓게 보는 것<small>5번 widened focus(넓은 초점)와 6번 bigger picture(더 큰 그림)를 그대로 옮긴 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">일상에서 어떤 스트레스 경험과도 결코 마주하지 않는 것</span><span class=\"why\">8번 You can still fry an egg(여전히 계란을 부칠 수 있다)는 스트레스 경험이 여전히 생긴다는 뜻이에요. 안 마주치는 게 아니라 마주쳐도 안 달라붙는 거예요. '달라붙지 않는'을 글자 그대로 읽은 함정이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">스트레스의 원인을 확인하기 위해 관점을 넓히는 것</span><span class=\"why\">관점을 넓히는 목적은 원인 찾기가 아니라 3번 let go of stress(스트레스를 해소하다)예요. 원인을 확인하라는 말은 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">경험의 긍정적인 측면에만 주의를 국한시키지 않는 것</span><span class=\"why\">지문이 벗어나라는 건 2번 the stressful parts(스트레스가 많은 부분)에 갇히는 거예요. 긍정적인 측면에만 머무르는 문제는 지문에 나오지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">넓은 시각을 기르는 원천으로 스트레스를 고려하는 것</span><span class=\"why\">원인과 결과가 거꾸로예요. 5번은 넓은 초점이 스트레스를 turns down(낮춘다)이라고 해요. 스트레스가 넓은 시각을 길러 준다는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">How you focus your attention</div><div class=\"k\">여러분이 주의를 집중하는 방식은</div></div><div class=\"rc\"><div class=\"e\">plays a critical role in</div><div class=\"k\">~에 결정적인 역할을 한다</div></div><div class=\"rc\"><div class=\"e\">how you deal with stress.</div><div class=\"k\">여러분이 스트레스에 대처하는 방식.</div></div><div class=\"rnat\">여러분이 주의를 집중하는 방식은 여러분이 스트레스에 대처하는 방식에 결정적인 역할을 한다.</div><div class=\"rst\">발표 시간에 실수했을 때 어디에 눈을 두느냐가 기분을 좌우해요. = 지문의 주의 집중 방식이 스트레스 대처에 결정적이라는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Scattered attention harms your ability</div><div class=\"k\">분산된 주의는 여러분의 능력을 손상시킨다</div></div><div class=\"rc\"><div class=\"e\">to let go of stress,</div><div class=\"k\">스트레스를 해소하는,</div></div><div class=\"rc\"><div class=\"e\">because even though your attention is scattered,</div><div class=\"k\">왜냐하면 여러분의 주의가 분산되어 있더라도,</div></div><div class=\"rc\"><div class=\"e\">it is narrowly focused,</div><div class=\"k\">그것(= 여러분의 주의)은 좁게 집중되기 때문이다,</div></div><div class=\"rc\"><div class=\"e\">for you are able to fixate only on</div><div class=\"k\">왜냐하면 여러분은 ~에만 집착할 수 있기 때문이다</div></div><div class=\"rc\"><div class=\"e\">the stressful parts of your experience.</div><div class=\"k\">여러분의 경험에서 스트레스가 많은 부분.</div></div><div class=\"rnat\">분산된 주의는 스트레스를 해소하는 여러분의 능력을 손상시키는데, 왜냐하면 여러분의 주의가 분산되어 있더라도 여러분은 여러분의 경험에서 스트레스가 많은 부분에만 집착할 수 있으므로 그것(여러분의 주의)은 좁게 집중되기 때문이다.</div><div class=\"rst\">정신이 산만해도 머릿속엔 '아까 말 더듬었어' 한 장면만 맴돌아요. = 지문의 <b>the stressful parts</b>(스트레스가 많은 부분)에만 집착하는 거예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">When your attentional spotlight is widened,</div><div class=\"k\">여러분의 주의의 집중이 넓어질 때,</div></div><div class=\"rc\"><div class=\"e\">you can more easily let go of stress.</div><div class=\"k\">여러분은 더 쉽게 스트레스를 해소할 수 있다.</div></div><div class=\"rnat\">여러분의 주의의 집중이 넓어질 때 여러분은 더 쉽게 스트레스를 해소할 수 있다.</div><div class=\"rst\">눈을 넓혀 발표 전체를 떠올리면 속상함이 훨씬 쉽게 풀려요. = 지문의 let go of stress(스트레스를 해소하다)예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">You can put in perspective</div><div class=\"k\">여러분은 균형 있게 볼 수 있다</div></div><div class=\"rc\"><div class=\"e\">many more aspects of any situation</div><div class=\"k\">어떤 상황이든 더 많은 측면을</div></div><div class=\"rc\"><div class=\"e\">and not get locked into one part</div><div class=\"k\">그리고 한 부분에 갇히지 않을 수 있다</div></div><div class=\"rc\"><div class=\"e\">that ties you down to</div><div class=\"k\">여러분을 ~에 얽매는 (= 그 한 부분)</div></div><div class=\"rc\"><div class=\"e\">superficial and anxiety-provoking levels of attention.</div><div class=\"k\">피상적이고 불안을 유발하는 주의 수준.</div></div><div class=\"rnat\">여러분은 어떤 상황이든 더 많은 측면을 균형 있게 볼 수 있고 피상적이고 불안을 유발하는 주의 수준에 여러분을 얽매는 한 부분에 갇히지 않을 수 있다.</div><div class=\"rst\">잘한 부분, 친구들 반응까지 보면 실수 한 장면에 갇히지 않아요. 지문도 한 부분에 갇히지(locked into) 않는다고 해요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">A narrow focus heightens</div><div class=\"k\">좁은 초점은 높인다</div></div><div class=\"rc\"><div class=\"e\">the stress level of each experience,</div><div class=\"k\">각 경험의 스트레스 수준을,</div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">a widened focus turns down the stress level</span></div><div class=\"k\">하지만 <span class=\"cw\">넓은 초점은 스트레스 수준을 낮춘다</span></div></div><div class=\"rc\"><div class=\"e\">because you’re better able to put each situation</div><div class=\"k\">여러분이 각 상황을 더 잘 볼 수 있기 때문에</div></div><div class=\"rc\"><div class=\"e\">into a broader perspective.</div><div class=\"k\">더 넓은 관점으로.</div></div><div class=\"rnat\">좁은 초점은 각 경험의 스트레스 수준을 높이지만 넓은 초점은 여러분이 각 상황을 더 넓은 관점으로 볼 수 있기 때문에 스트레스 수준을 낮춘다.</div><div class=\"rst\"><b>한 장면만 보면 속상함이 커지고, 넓게 보면 줄어요.</b> = 지문의 <b>a widened focus</b>(넓은 초점)가 스트레스를 낮춘다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">One anxiety-provoking detail</div><div class=\"k\">불안을 유발하는 하나의 세부 사항은</div></div><div class=\"rc ckc\"><div class=\"e\">is less important than <span class=\"cw\">the bigger picture</span>.</div><div class=\"k\"><span class=\"cw\">더 큰 그림보다</span> 덜 중요하다.</div></div><div class=\"rnat\">불안을 유발하는 하나의 세부 사항은 더 큰 그림보다 덜 중요하다.</div><div class=\"rst\">더듬은 그 한 순간보다 발표 전체가 더 중요해요. = 지문의 <b>the bigger picture</b>(더 큰 그림)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">It’s like transforming yourself</div><div class=\"k\">그것(= 주의를 넓혀 더 큰 그림을 보는 것)은 여러분 스스로를 변화시키는 것과 같다</div></div><div class=\"rc ckc\"><div class=\"e\">into a <span class=\"cw\">nonstick frying pan</span>.</div><div class=\"k\"><span class=\"cw\">달라붙지 않는 프라이팬으로</span>.</div></div><div class=\"rnat\">그것은 여러분 스스로를 달라붙지 않는 프라이팬(어떤 경험에 대해 그것의 스트레스가 많은 측면을 넘어서는 더 큰 관점을 가지는 것)으로 변화시키는 것과 같다.</div><div class=\"rst\">이렇게 넓게 보는 나는 '안 달라붙는 프라이팬'이 돼요. 그래서 밑줄은 경험을 스트레스 부분 너머로 넓게 보기(④)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">You can still fry an egg,</div><div class=\"k\">여러분은 여전히 계란을 부칠 수 있다,</div></div><div class=\"rc ckc\"><div class=\"e\">but the egg <span class=\"cw\">won’t stick to the pan</span>.</div><div class=\"k\">하지만 그 계란은 <span class=\"cw\">팬에 달라붙지 않을 것이다</span>.</div></div><div class=\"rnat\">여러분은 여전히 계란을 부칠 수 있지만 그 계란은 팬에 달라붙지 않을 것이다.</div><div class=\"rst\">실수(계란)는 또 생기지만 내 마음에 눌어붙지 않아요. = 지문의 the egg won’t stick(계란이 달라붙지 않는다)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"plays a critical role in\" data-m=\"~에서 결정적 역할을 한다\"><b>plays a critical role in</b>~에서 결정적 역할을 한다</button><button type=\"button\" class=\"wdb\" data-w=\"scattered\" data-m=\"분산된, 산만한\"><b>scattered</b>분산된, 산만한</button><button type=\"button\" class=\"wdb\" data-w=\"fixate on\" data-m=\"~에 집착하다\"><b>fixate on</b>~에 집착하다</button><button type=\"button\" class=\"wdb\" data-w=\"put in perspective\" data-m=\"균형 잡힌 시각으로 보다\"><b>put in perspective</b>균형 잡힌 시각으로 보다</button><button type=\"button\" class=\"wdb\" data-w=\"anxiety-provoking\" data-m=\"불안을 유발하는\"><b>anxiety-provoking</b>불안을 유발하는</button><button type=\"button\" class=\"wdb\" data-w=\"nonstick\" data-m=\"달라붙지 않는\"><b>nonstick</b>달라붙지 않는</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">what(~하는 것) 뒤 동사는 <b>what(~하는 것)이 직접 하는지, 당하는지</b>를 보세요. refer to A as B(A를 B라고 일컫다)에서 <b>A 자리가 비어 있으면 수동태</b> was referred(일컬어졌다)예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (5번)</span><div class=\"en\">… were grounded in what <u>④ referred</u> to as the “great man” theory …</div><p class=\"ko\">'위인' 이론이라고 ( 일컬은? 일컬어진? ) 것에 바탕을 두었다</p></div><div class=\"ck-via\"><i>▼</i><span>전치사 in(~에) 뒤에 what(~하는 것)이 오고, 그 what(~하는 것)이 뒤 동사의 주어 노릇을 해요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 앞쪽 · what의 역할</span><div class=\"en\">some of the earliest leadership studies <mark>were grounded in</mark> what</div><p class=\"ko\">가장 초기의 리더십 연구 중 일부는 <mark>~에 바탕을 두었다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>refer to(~을 일컫다) 뒤에 일컬을 대상이 없고 바로 as(~라고)가 와요 → what(~하는 것)이 '일컬어지는' 쪽 → 수동</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">what <mark>was referred to as</mark> the “great man” theory</div><p class=\"ko\">'위인' 이론이라고 <mark>일컬어지던</mark> 것</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">능동 refer to A as B(A를 B라고 일컫다)와 수동 be referred to as B(B라고 일컬어지다)</p><p class=\"gr\">능동태는 일컫는 대상 A가 동사 뒤에 있어요. A가 앞으로 나가 주어가 되면 그 자리가 비고, 동사는 be referred(일컬어지다)가 돼요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>People refer to him as a hero.</div><div class=\"ko\">사람들은 그를 영웅이라고 부른다. (to 뒤에 him 그를이 있어서 능동이 맞아요)</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>He is referred to as a hero.</div><div class=\"ko\">그는 영웅이라고 불린다. (he 그가 '불리는' 쪽이라 수동이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He referred to as a hero.</div><div class=\"ko\">to 뒤에 부를 대상이 없는데 능동 referred를 써서 틀려요.</div></div><p class=\"gb\">지문 5번도 what(~하는 것)이 위인 이론이라고 '불리는' 쪽이고 일컬을 대상 자리가 비어 있으니, 능동이 아니라 was referred(일컬어졌다)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">referred → was referred (일컬어졌다)<small>what(~하는 것)이 위인 이론이라고 '불리는' 쪽이고, 일컫는 대상 A 자리가 비었으니 수동태여야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">was ~였다</span><span class=\"why\">1번 주어는 맨 앞 The idea(관념) 하나예요. 뒤의 that(~라는)절은 꾸며 주는 말이라, 바로 앞 nonleaders(지도자가 아닌 사람들)에 속지 말고 단수 동사 was(~였다)를 써요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치: 긴 수식어를 걷어 내고 진짜 주어 찾기</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The bag with many books is heavy.</div><div class=\"ko\">책이 많이 든 그 가방은 무겁다. (주어는 bag 가방 하나라 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The bag with many books are heavy.</div><div class=\"ko\">바로 앞 books(책들)에 맞춰 are를 써서 틀려요. 진짜 주어는 bag(가방)이에요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The idea that we can win was exciting.</div><div class=\"ko\">우리가 이길 수 있다는 생각은 신났다. (주어 idea 생각이 하나라 was가 맞아요)</div></div><p class=\"gb\">지문 1번도 The idea(관념)가 주어이고 that(~라는)절은 그 내용을 설명할 뿐이라 was(~였다)가 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">that allow ~하게 해 주는</span><span class=\"why\">3번 that(~하는)은 바로 앞 the traits(특성들)를 꾸미는 주격 관계대명사예요. 뒤에 주어 없이 동사가 오고, 선행사 traits(특성들)가 복수라 allow(~하게 해 주다)가 맞아요. them(그들)은 some individuals(어떤 사람들)를 가리켜요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~하는) + 선행사에 수를 맞춘 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have friends that help me.</div><div class=\"ko\">나는 나를 도와주는 친구들이 있다. (선행사 friends 친구들이 복수라 help가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have friends that helps me.</div><div class=\"ko\">선행사가 복수 friends(친구들)인데 helps를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a friend that helps me.</div><div class=\"ko\">나는 나를 도와주는 친구 한 명이 있다. (선행사 a friend 친구 한 명이라 helps가 맞아요)</div></div><p class=\"gb\">지문 3번도 the traits(특성들)가 선행사라 that(~하는) 뒤에 복수 동사 allow(~하게 해 주다)가 와요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">that ~라는</span><span class=\"why\">4번 that(~라는)은 앞 명사 the widely stated argument(널리 언급되는 주장)의 내용을 풀어 주는 동격 접속사예요. 뒤의 leaders are born(지도자는 태어난다)처럼 주어·동사가 다 갖춰진 완전한 절이라 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">동격의 that(~라는): 명사 뒤 + 완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I heard the news that we won.</div><div class=\"ko\">나는 우리가 이겼다는 소식을 들었다. (we won 우리가 이겼다가 완전한 절이라 that이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I heard the news what we won.</div><div class=\"ko\">뒤가 완전한 절인데 what(~하는 것)을 써서 틀려요.</div></div><p class=\"gb\">지문 4번도 argument(주장) 뒤에 완전한 절이 와서 '~라는 주장'을 만드니 that(~라는)이 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">that ~하는</span><span class=\"why\">6번 that(~하는)은 many enduring qualities(많은 지속되는 자질)를 꾸미는 주격 관계대명사예요. 중간의 whether innate or learned(선천적이든 후천적이든)는 끼워 넣은 말이고, 뒤에 주어 없이 contribute(이바지하다)가 오니 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~하는): 끼워 넣은 말을 건너뛰고 선행사 찾기</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>There are many games, old or new, that make kids happy.</div><div class=\"ko\">옛것이든 새것이든 아이들을 즐겁게 해 주는 게임이 많다. (old or new는 끼워 넣은 말이고, that 뒤에 주어 없이 동사 make(만들다)가 바로 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>There are many games, old or new, that makes kids happy.</div><div class=\"ko\">선행사 games(게임들)가 복수인데 makes를 써서 틀려요. 끼워 넣은 old or new(옛것이든 새것이든)를 건너뛰고 games에 맞춰야 해요.</div></div><p class=\"gb\">지문 6번도 qualities(자질)가 선행사이고 that(~하는) 뒤에 주어가 빠진 채 contribute(이바지하다)가 와서 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The idea</div><div class=\"k\">관념은</div></div><div class=\"rc\"><div class=\"e\">that leaders inherently possess</div><div class=\"k\">지도자들이 선천적으로 가진다는</div></div><div class=\"rc\"><div class=\"e\">certain physical, intellectual, or personality traits</div><div class=\"k\">특정한 신체적, 지적, 혹은 성격 특성을</div></div><div class=\"rc\"><div class=\"e\">that distinguish them from nonleaders</div><div class=\"k\">그들(= 지도자들)을 지도자가 아닌 사람들과 구별해 주는</div></div><div class=\"rc\"><div class=\"e\">was the foundational belief</div><div class=\"k\">근본적인 믿음이었다</div></div><div class=\"rc\"><div class=\"e\">of the trait-based approach to leadership.</div><div class=\"k\">리더십에 관한 특성 기반 접근법의.</div></div><div class=\"rnat\">지도자들이 그들을 지도자가 아닌 사람들과 구별해 주는 특정한 신체적, 지적, 혹은 성격 특성을 '선천적으로' 가진다는 관념은 리더십에 관한 특성 기반 접근법의 근본적인 믿음이었다.</div><div class=\"rst\">옛날엔 지도자가 남다른 특성을 타고난다고 믿었어요. 주어는 The idea(관념) 하나라서 동사는 <b>was</b>(~였다)예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This approach dominated leadership research</div><div class=\"k\">이 접근법(= 특성 기반 접근법)은 리더십 연구를 지배했다</div></div><div class=\"rc\"><div class=\"e\">from the late 1800s until the mid-1940s</div><div class=\"k\">1800년대 후반부터 1940년대 중반까지</div></div><div class=\"rc\"><div class=\"e\">and has experienced</div><div class=\"k\">그리고 경험했다</div></div><div class=\"rc\"><div class=\"e\">a resurgence of interest</div><div class=\"k\">관심이 되살아나는 것을</div></div><div class=\"rc\"><div class=\"e\">in the last couple of decades.</div><div class=\"k\">지난 몇십 년간.</div></div><div class=\"rnat\">이 접근법은 1800년대 후반부터 1940년대 중반까지 리더십 연구를 지배했고, 지난 몇십 년간 관심이 되살아나는 것을 경험했다.</div><div class=\"rst\">이 생각이 1800년대 후반부터 1940년대 중반까지 리더십 연구를 꽉 잡았고, 최근에 다시 관심을 받아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Early trait theorists believed</div><div class=\"k\">초기의 특성 이론가들은 믿었다</div></div><div class=\"rc\"><div class=\"e\">that some individuals are born with the traits</div><div class=\"k\">어떤 사람들은 특성을 갖고 태어난다고</div></div><div class=\"rc\"><div class=\"e\">that allow them to become great leaders.</div><div class=\"k\">그들(= 어떤 사람들)이 위대한 지도자가 되게 해 주는.</div></div><div class=\"rnat\">초기의 특성 이론가들은 어떤 사람들은 그들이 위대한 지도자가 되게 해 주는 특성을 갖고 태어난다고 믿었다.</div><div class=\"rst\">초기 이론가들은 위대한 지도자가 될 특성을 갖고 태어나는 사람이 있다고 믿었어요. allow(~하게 해 주다)는 traits(특성들)에 맞춘 복수예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Thus, early research in this area</div><div class=\"k\">따라서, 이 분야(= 리더십 특성 연구)의 초기 연구는</div></div><div class=\"rc\"><div class=\"e\">often presented the widely stated argument</div><div class=\"k\">널리 언급되는 주장을 흔히 제시했다</div></div><div class=\"rc\"><div class=\"e\">that “leaders are born, not made.”</div><div class=\"k\">'지도자는 만들어지는 것이 아니라 태어나는 것이다'라는.</div></div><div class=\"rnat\">따라서, 이 분야의 초기 연구는 '지도자는 (후천적으로) 만들어지는 것이 아니라 (원래부터 그렇게) 태어나는 것이다'라는 널리 언급되는 주장을 흔히 제시했다.</div><div class=\"rst\">그래서 '지도자는 만들어지지 않고 태어난다'는 주장이 흔했어요. argument(주장) 뒤 that(~라는)은 그 내용을 풀어 주는 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Also, some of the earliest leadership studies</div><div class=\"k\">또한, 가장 초기의 리더십 연구 중 일부는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">were grounded in</span></div><div class=\"k\"><span class=\"cw\">~에 바탕을 두었다</span></div></div><div class=\"rc ckc\"><div class=\"e\">what <span class=\"cw\">was referred to as</span> the “great man” theory</div><div class=\"k\">'위인' 이론이라고 <span class=\"cw\">일컬어지던</span> 것 ※ 문제지엔 was 없이 referred로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">because researchers at the time focused on</div><div class=\"k\">왜냐하면 당대 연구자들은 ~하는 데 초점을 두었기 때문이다</div></div><div class=\"rc\"><div class=\"e\">identifying traits of highly visible leaders in history</div><div class=\"k\">역사에서 아주 눈에 띄는 지도자들의 특성을 확인하는</div></div><div class=\"rc\"><div class=\"e\">who were typically male</div><div class=\"k\">일반적으로 남성이었던 (= 역사에서 아주 눈에 띄는 지도자들)</div></div><div class=\"rc\"><div class=\"e\">and associated with the aristocracy or political or military leadership.</div><div class=\"k\">그리고 귀족이나 정치적 또는 군사적 리더십과 관련이 있던.</div></div><div class=\"rnat\">또한, 가장 초기의 리더십 연구 중 일부는 '위인' 이론이라고 일컬어지던 것에 바탕을 두었는데, 왜냐하면 당대 연구자들은 일반적으로 남성이면서 귀족이나 정치적 또는 군사적 리더십과 관련이 있던, 역사에서 아주 눈에 띄는 지도자들의 특성을 확인하는 데 초점을 두었기 때문이다.</div><div class=\"rst\">초기 연구는 '위인 이론'이라고 <b>불리던 것</b>에 바탕을 뒀어요. what(~하는 것)이 불리는 쪽이니 <b>was referred</b>(일컬어졌다)가 맞아요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In more recent history,</div><div class=\"k\">더 최근의 역사에서 보면,</div></div><div class=\"rc\"><div class=\"e\">numerous authors have acknowledged</div><div class=\"k\">수많은 저자들은 인정했다</div></div><div class=\"rc\"><div class=\"e\">that there are many enduring qualities,</div><div class=\"k\">많은 지속되는 자질이 있다는 것을,</div></div><div class=\"rc\"><div class=\"e\">whether innate or learned,</div><div class=\"k\">선천적인 것이든 후천적인 것이든,</div></div><div class=\"rc\"><div class=\"e\">that contribute to leadership potential.</div><div class=\"k\">리더십 잠재력에 이바지하는 (= 많은 지속되는 자질)</div></div><div class=\"rnat\">더 최근의 역사에서 보면, 수많은 저자들은 선천적인 것이든 후천적인 것이든, 리더십 잠재력에 이바지하는 많은 지속되는 자질이 있다는 것을 인정했다.</div><div class=\"rst\">최근 저자들은 타고났든 배웠든 리더십에 도움이 되는 자질이 많다고 인정해요. that(~하는)은 qualities(자질)를 꾸며요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">These traits include such things as</div><div class=\"k\">이러한 특성들(= 리더십 잠재력에 이바지하는 자질들)은 ~과 같은 것들을 포함한다</div></div><div class=\"rc\"><div class=\"e\">drive, self-confidence, cognitive ability,</div><div class=\"k\">추진력, 자신감, 인지 능력,</div></div><div class=\"rc\"><div class=\"e\">conscientiousness, determination, intelligence, and integrity.</div><div class=\"k\">성실성, 결단력, 지능, 그리고 진실성.</div></div><div class=\"rnat\">이러한 특성들은 '추진력', '자신감', '인지 능력', '성실성', '결단력', '지능', 그리고 '진실성'과 같은 것들을 포함한다.</div><div class=\"rst\">그 자질은 추진력, 자신감, 인지 능력, 성실성, 결단력, 지능, 진실성 같은 것들이에요. 6번의 자질을 하나씩 보여 줘요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"inherently\" data-m=\"선천적으로, 본질적으로\"><b>inherently</b>선천적으로, 본질적으로</button><button type=\"button\" class=\"wdb\" data-w=\"distinguish\" data-m=\"구별하다\"><b>distinguish</b>구별하다</button><button type=\"button\" class=\"wdb\" data-w=\"foundational\" data-m=\"근본적인\"><b>foundational</b>근본적인</button><button type=\"button\" class=\"wdb\" data-w=\"resurgence\" data-m=\"되살아남, 부활\"><b>resurgence</b>되살아남, 부활</button><button type=\"button\" class=\"wdb\" data-w=\"grounded in\" data-m=\"~에 근거를 둔\"><b>grounded in</b>~에 근거를 둔</button><button type=\"button\" class=\"wdb\" data-w=\"enduring\" data-m=\"지속적인\"><b>enduring</b>지속적인</button><button type=\"button\" class=\"wdb\" data-w=\"innate\" data-m=\"선천적인\"><b>innate</b>선천적인</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">1번이 <b>managed rather than accommodated</b>(부응하기보다 관리되어야 한다)로 축을 세워요. 6번의 '비싸게 하기·규칙으로 막기'는 <b>관리(억제)</b> 쪽인데 이름은 accommodating(부응하는)이라 방향이 거꾸로예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글의 대립축</span><div class=\"en\">automobile demand in cities <mark>needs to be managed</mark> rather than accommodated.</div><p class=\"ko\">도시 내 자동차 수요가 <mark>관리될 필요가 있다는</mark> (그것에) 부응하기보다는.</p></div><div class=\"ck-via\"><i>▼</i><span>관리 = 차를 덜 쓰게 만들기. 그 첫 방법이 설득이에요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 · 관리의 한 방법</span><div class=\"en\"><mark>persuading people to choose not to use cars</mark> becomes an increasingly key focus</div><p class=\"ko\"><mark>사람들을 설득하는 것이</mark> 자동차를 사용하지 '않기를' 선택하라고 점점 더 중요한 주안점이 된다</p></div><div class=\"ck-via\"><i>▼</i><span>However(하지만) 뒤에 '가장 직접적인' 방법이 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (6번)</span><div class=\"en\">However, the most direct approach to <u>④ accommodating</u> automobile demand …</div><p class=\"ko\">하지만, 자동차 수요에 ( 부응하는? ) 가장 직접적인 접근법은 …</p></div><div class=\"ck-via\"><i>▼</i><span>방법이 '더 비싸게, 규칙으로 통제' = 억제예요 → 부응(accommodating)이 아니라 관리(managing)</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 결정적 단서</span><div class=\"en\">is <mark>making motorized travel more expensive</mark> or <mark>restricting it</mark> with administrative rules.</div><p class=\"ko\"><mark>자동차로 하는 이동을 더 비싸게 만드는 것이다</mark> 또는 그것을 <mark>통제하는 것</mark> 행정 규칙으로.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">accommodate(수용하다, 부응하다) ↔ manage(관리하다)</p><p class=\"gr\">accommodate(부응하다)는 원하는 만큼 들어주는 쪽, manage(관리하다)는 줄이고 조절하는 쪽이에요. 방법이 '비싸게·막기'면 manage(관리하다)예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>To manage screen time, Mom set a one-hour rule.</div><div class=\"ko\">화면 사용 시간을 관리하려고 엄마가 하루 한 시간 규칙을 정했다. (규칙으로 줄이기 → 관리)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>To accommodate screen time, Mom set a one-hour rule.</div><div class=\"ko\">규칙으로 줄이는데 '들어주려고'라고 하면 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The school built more seats to accommodate more students.</div><div class=\"ko\">학교는 더 많은 학생을 받으려고 자리를 늘렸다. (늘려서 들어주기 → 수용)</div></div><p class=\"gb\">지문 6번도 more expensive(더 비싸게)·restricting(통제하는 것)으로 수요를 줄이니, accommodating(부응하는)이 아니라 managing(관리하는)이어야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">accommodating → managing (관리하는)<small>더 비싸게 하고 규칙으로 막는 건 수요를 들어주는 게 아니라 관리하는 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">limit 제한하다</span><span class=\"why\">3번은 밀집한 도시의 물리적 제약이 도로를 넓힐 선택권을 막는다는 말이에요. 길을 늘려 수요를 들어주기 어렵다는 뜻이라 limit(제한하다)가 맞아요. 부정적인 단어라 틀려 보이는 함정이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">persuading 설득하는 것</span><span class=\"why\">4번은 3번의 결과(As a result 그 결과)로, 차를 쓰지 않도록 설득하는 게 중요해진다는 말이에요. 1번의 관리(managed) 방향과 같아서 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">alternative 대안이 되는</span><span class=\"why\">5번의 걷기·자전거·대중교통은 자동차 대신 쓰는 수단이에요. 4번 설득 전략의 핵심이니 alternative(대안이 되는)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">reinforces 강화한다</span><span class=\"why\">7번은 자동차 이동이 기후 변화에도 원인이 된다는 말이에요. 자동차 수요를 관리해야 할 필요(this imperative 이러한 불가피성)에 기후 변화라는 이유를 하나 더 보태니 reinforces(강화한다)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In recent years</div><div class=\"k\">최근</div></div><div class=\"rc\"><div class=\"e\">urban transport professionals globally</div><div class=\"k\">전 세계적으로 도시 교통 전문가들은</div></div><div class=\"rc\"><div class=\"e\">have largely acquiesced to the view</div><div class=\"k\">주로 견해를 따랐다</div></div><div class=\"rc\"><div class=\"e\">that automobile demand in cities</div><div class=\"k\">도시 내 자동차 수요가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">needs to be managed</span></div><div class=\"k\"><span class=\"cw\">관리될 필요가 있다는</span></div></div><div class=\"rc\"><div class=\"e\">rather than accommodated.</div><div class=\"k\">(그것에) 부응하기보다는.</div></div><div class=\"rnat\">최근 전 세계적으로 도시 교통 전문가들은 주로 도시 내 자동차 수요에 부응하기보다는 그것을 관리할 필요성이 있다는 견해를 따랐다.</div><div class=\"rst\">등교 시간 학교 앞 차가 너무 많아요. 요즘 생각은 '주차장을 다 늘려 주자'가 아니라 '차를 <b>관리하자</b>'예요. = 지문의 managed(관리되는)예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Rising incomes inevitably lead to</div><div class=\"k\">소득 증가는 필히 ~을 낳는다</div></div><div class=\"rc\"><div class=\"e\">increases in motorization.</div><div class=\"k\">자동차 보급의 증가.</div></div><div class=\"rnat\">소득 증가는 필히 자동차 보급의 증가를 낳는다.</div><div class=\"rst\">집집마다 형편이 나아지면 차로 데려다주는 집이 꼭 늘어요. = 지문의 소득 증가가 자동차 보급 증가로 이어진다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Even without the imperative of climate change,</div><div class=\"k\">심지어 기후 변화의 불가피성이 없다고 해도,</div></div><div class=\"rc\"><div class=\"e\">the physical constraints of densely inhabited cities</div><div class=\"k\">인구가 밀집한 도시의 물리적 제약과</div></div><div class=\"rc\"><div class=\"e\">and the corresponding demands</div><div class=\"k\">그에 따른 요구는</div></div><div class=\"rc\"><div class=\"e\">of accessibility, mobility, safety, air pollution, and urban livability</div><div class=\"k\">접근성, 이동성, 안전, 대기 오염, 그리고 도시 거주 적합성에 대한</div></div><div class=\"rc\"><div class=\"e\">all limit the option</div><div class=\"k\">모두 선택권을 제한한다</div></div><div class=\"rc\"><div class=\"e\">of expanding road networks</div><div class=\"k\">도로망을 확장한다는</div></div><div class=\"rc\"><div class=\"e\">purely to accommodate this rising demand.</div><div class=\"k\">순전히 이러한 수요 증가(= 소득 증가로 늘어나는 자동차 수요)에 부응하고자.</div></div><div class=\"rnat\">심지어 기후 변화의 불가피성이 없다고 해도, 인구가 밀집한 도시의 물리적 제약과 그에 따른 접근성, 이동성, 안전, 대기 오염, 그리고 도시 거주 적합성에 대한 요구는 모두 순전히 이러한 수요 증가에 부응하고자 도로망을 확장한다는 선택권을 제한한다.</div><div class=\"rst\">그런데 학교 앞 골목은 좁아서 길을 넓혀 다 받아 줄 수가 없어요. 지문도 도로 확장이라는 선택권이 <b>제한된다</b>(limit)고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">As a result,</div><div class=\"k\">그 결과,</div></div><div class=\"rc\"><div class=\"e\">as cities develop</div><div class=\"k\">도시가 발전하고</div></div><div class=\"rc\"><div class=\"e\">and their residents become more prosperous,</div><div class=\"k\">그(= 도시의) 주민들이 더 부유해지면서,</div></div><div class=\"rc\"><div class=\"e\">persuading people</div><div class=\"k\">사람들을 설득하는 것이</div></div><div class=\"rc\"><div class=\"e\">to choose not to use cars</div><div class=\"k\">자동차를 사용하지 '않기를' 선택하라고</div></div><div class=\"rc\"><div class=\"e\">becomes an increasingly key focus</div><div class=\"k\">점점 더 중요한 주안점이 된다</div></div><div class=\"rc\"><div class=\"e\">of city managers and planners.</div><div class=\"k\">도시 관리자 및 계획가의.</div></div><div class=\"rnat\">그 결과, 도시가 발전하고 주민들이 더 부유해지면서, 사람들에게 자동차를 사용하지 '않기를' 선택하라고 설득하는 것이 도시 관리자 및 계획가의 점점 더 중요한 주안점이 된다.</div><div class=\"rst\">그래서 학교는 '차 대신 다른 방법으로 와 주세요' 하고 <b>설득</b>하는 데 힘써요. = 지문의 persuading(설득하는 것)이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Improving the quality</div><div class=\"k\">질을 높이는 것이</div></div><div class=\"rc\"><div class=\"e\">of alternative options,</div><div class=\"k\">대안이 되는 선택권의,</div></div><div class=\"rc\"><div class=\"e\">such as walking, cycling, and public transport,</div><div class=\"k\">걷기, 자전거 타기, 대중교통 같은,</div></div><div class=\"rc\"><div class=\"e\">is a central element of this strategy.</div><div class=\"k\">이 전략(= 자동차를 쓰지 않도록 설득하는 전략)의 핵심 요소이다.</div></div><div class=\"rnat\">걷기, 자전거 타기, 대중교통 등 대안이 되는 선택권의 질을 높이는 것이 이 전략의 핵심 요소이다.</div><div class=\"rst\">걸어오는 길·자전거 거치대·통학버스를 더 좋게 만드는 게 그 핵심이에요. = 지문의 alternative options(대안이 되는 선택권)예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">However, the most direct approach</div><div class=\"k\">하지만, 가장 직접적인 접근법은</div></div><div class=\"rc\"><div class=\"e\">to managing automobile demand</div><div class=\"k\">자동차 수요를 관리하는 ※ 문제지엔 accommodating으로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">making motorized travel more expensive</span></div><div class=\"k\"><span class=\"cw\">자동차로 하는 이동을 더 비싸게 만드는 것이다</span></div></div><div class=\"rc ckc\"><div class=\"e\">or <span class=\"cw\">restricting it</span></div><div class=\"k\">또는 그것(= 자동차로 하는 이동)을 <span class=\"cw\">통제하는 것</span></div></div><div class=\"rc\"><div class=\"e\">with administrative rules.</div><div class=\"k\">행정 규칙으로.</div></div><div class=\"rnat\">하지만, 자동차 수요에 부응하는(→ 를 관리하는) 가장 직접적인 접근법은 자동차로 하는 이동을 더 비싸게 만들거나 이것을 행정 규칙으로 통제하는 것이다.</div><div class=\"rst\"><b>하지만</b> 가장 직접적인 방법은 학교 앞 주차비를 올리거나 차량 진입을 규칙으로 막는 거예요. 이건 들어주기가 아니라 <b>관리</b>라서 accommodating(부응하는)이 틀렸어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The contribution of motorized travel</div><div class=\"k\">자동차로 하는 이동이 원인을 제공한다는 것은</div></div><div class=\"rc\"><div class=\"e\">to climate change</div><div class=\"k\">기후 변화에</div></div><div class=\"rc\"><div class=\"e\">reinforces this imperative.</div><div class=\"k\">이러한 불가피성(= 자동차 수요를 관리해야 할 필요)을 강화한다.</div></div><div class=\"rnat\">자동차로 하는 이동이 기후 변화에 원인을 제공한다는 것은 이러한 불가피성을 강화한다.</div><div class=\"rst\">게다가 차 매연은 지구 온난화에도 나쁘니, 차를 관리해야 할 이유가 더 굳어져요. = 지문의 reinforces(강화한다)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"acquiesced to\" data-m=\"~에 따랐다\"><b>acquiesced to</b>~에 따랐다</button><button type=\"button\" class=\"wdb\" data-w=\"accommodated\" data-m=\"수용된, 부응된\"><b>accommodated</b>수용된, 부응된</button><button type=\"button\" class=\"wdb\" data-w=\"inevitably\" data-m=\"필연적으로\"><b>inevitably</b>필연적으로</button><button type=\"button\" class=\"wdb\" data-w=\"imperative\" data-m=\"불가피한 것, 긴요한 일\"><b>imperative</b>불가피한 것, 긴요한 일</button><button type=\"button\" class=\"wdb\" data-w=\"constraints\" data-m=\"제약\"><b>constraints</b>제약</button><button type=\"button\" class=\"wdb\" data-w=\"alternative\" data-m=\"대안이 되는\"><b>alternative</b>대안이 되는</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 바로 뒤 <b>As an example</b>(한 예로)가 열쇠예요. 케냐 농부들이 <b>are encouraged</b>(장려된다)처럼 남이 시키는 대로 작물을 고른다는 수동태에서 '내 농사를 내가 못 정한다'를 읽어 내세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (3번)</span><div class=\"en\">Indeed, this vast majority <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> because of larger global causes.</div><p class=\"ko\">사실, 이 대다수는 더 큰 세계적 원인으로 인해 ( ? )</p></div><div class=\"ck-via\"><i>▼</i><span>this vast majority(이 대다수) = 앞 문장의 '경쟁할 수 없는 대다수'</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 이 대다수는 누구?</span><div class=\"en\">while the vast majority are <mark>incapable of competing</mark>.</div><p class=\"ko\">반면에 대다수는 <mark>경쟁할 수 없는</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>As an example(한 예로) = 빈칸 내용을 그대로 보여 주는 장면</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">farmers <mark>are actively encouraged</mark> to grow export crops such as tea and coffee at the expense of basic food production.</div><p class=\"ko\">농부들은 <mark>적극적으로 장려된다</mark> 수출 작물을 재배하도록 차와 커피 같은 기초식품 생산을 희생해 가며.</p></div><div class=\"ck-via\"><i>▼</i><span>누가 농사를 좌우하는지 못 박아요: 농부가 아니라 바깥의 생산 방식</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결론으로 확인</span><div class=\"en\">the capitalist mode of production <mark>is affecting peasant production</mark> in the less developed world</div><p class=\"ko\">자본주의적인 생산 방식이 <mark>소농 생산에 영향을 미치고 있다는 것</mark> 저개발 세계에서의</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">자신의 생산에 대한 통제력을 잃었다<small>무엇을 심을지 바깥(세계 시장·자본주의 방식)이 정하니, 내 농사의 결정권을 잃은 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">자본주의적 생산 방식에 도전해 왔다</span><span class=\"why\">6번에 capitalist mode of production(자본주의적인 생산 방식)이 나오지만, 소농은 거기에 맞서는 쪽이 아니라 자본주의 방식이 영향을 미치는(is affecting) 대상이에요. 지문 단어를 빌린 반대 함정이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">식량 생산을 위해 기술에 의존하게 되었다</span><span class=\"why\">1번은 남은 농민들이 not benefiting from technological advances(기술 발전으로부터 혜택을 얻지 못하는)라고 해요. 기술을 쓰는 건 2번의 아주 적은 상업 농업 경영인뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">환금 작물 재배에 관여하는 것을 줄여 왔다</span><span class=\"why\">4번은 오히려 차·커피 같은 export crops(수출 작물)를 재배하도록 장려된다고 해요. 줄인 건 수출 작물이 아니라 5번의 옥수수 같은 주요 작물이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">세계 시장에서 경쟁력을 되찾았다</span><span class=\"why\">2번이 이 대다수를 incapable of competing(경쟁할 수 없는)이라고 했어요. 경쟁력을 되찾았다는 건 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In the less developed world,</div><div class=\"k\">저개발 세계에서,</div></div><div class=\"rc\"><div class=\"e\">the percentage of the population</div><div class=\"k\">인구의 비율은</div></div><div class=\"rc\"><div class=\"e\">involved in agriculture</div><div class=\"k\">농업에 관련된(종사하는)</div></div><div class=\"rc\"><div class=\"e\">is declining,</div><div class=\"k\">감소하고 있다,</div></div><div class=\"rc\"><div class=\"e\">but at the same time,</div><div class=\"k\">하지만 동시에,</div></div><div class=\"rc\"><div class=\"e\">those remaining in agriculture</div><div class=\"k\">농업에 남아 있는 사람들은</div></div><div class=\"rc\"><div class=\"e\">are not benefiting from technological advances.</div><div class=\"k\">기술 발전으로부터 혜택을 얻지 못하고 있다.</div></div><div class=\"rnat\">저개발 세계에서, 농업에 관련된(종사하는) 인구의 비율은 감소하고 있지만, 동시에 농업에 남아 있는(계속 종사하는) 사람들은 기술 발전으로부터 혜택을 얻지 못하고 있다.</div><div class=\"rst\">학교 텃밭을 떠올려 봐요. 텃밭 반 친구는 점점 줄고, 남은 친구들은 새 농기구 혜택도 못 받아요. = 지문의 기술 발전 혜택을 못 얻는 농민이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">The typical scenario in the less developed world</div><div class=\"k\">저개발 세계에서 전형적인 시나리오는</div></div><div class=\"rc\"><div class=\"e\">is one in which</div><div class=\"k\">~인 것(= 시나리오)이다</div></div><div class=\"rc\"><div class=\"e\">a very few commercial agriculturalists</div><div class=\"k\">아주 적은 수의 상업적인 농업 경영인들은</div></div><div class=\"rc\"><div class=\"e\">are technologically advanced</div><div class=\"k\">기술적으로 발전해 있는데</div></div><div class=\"rc\"><div class=\"e\">while the vast majority</div><div class=\"k\">반면에 대다수는</div></div><div class=\"rc ckc\"><div class=\"e\">are <span class=\"cw\">incapable of competing</span>.</div><div class=\"k\"><span class=\"cw\">경쟁할 수 없는</span>.</div></div><div class=\"rnat\">저개발 세계에서 (쓰이는) 전형적인 시나리오는 아주 적은 수의 상업적인 농업 경영인들은 기술적으로 발전해 있는데, 대다수는 경쟁할 수 없다는 것이다.</div><div class=\"rst\">몇몇 친구만 좋은 장비로 크게 키우고, 대부분은 그 친구들을 따라잡지 못해요. = 지문의 <b>incapable of competing</b>(경쟁할 수 없는)이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Indeed, this vast majority</div><div class=\"k\">사실, 이 대다수(= 경쟁할 수 없는 대다수의 농민)는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">have lost control over their own production</span></div><div class=\"k\"><span class=\"cw\">그들 자신의 생산에 대한 통제력을 잃게 되었다</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">because of larger global causes.</div><div class=\"k\">더 큰 세계적 원인으로 인해.</div></div><div class=\"rnat\">사실, 이 대다수는 더 큰 세계적 원인으로 인해 그들 자신의 생산에 대한 통제력을 잃게 되었다.</div><div class=\"rst\"><b>그래서 대부분은 내 텃밭에 뭘 심을지 내가 못 정하게 됐어요.</b> 그래서 빈칸은 '자기 생산에 대한 통제력을 잃었다'예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">As an example, in Kenya,</div><div class=\"k\">한 예로, 케냐에서,</div></div><div class=\"rc ckc\"><div class=\"e\">farmers <span class=\"cw\">are actively encouraged</span></div><div class=\"k\">농부들은 <span class=\"cw\">적극적으로 장려된다</span></div></div><div class=\"rc\"><div class=\"e\">to grow export crops</div><div class=\"k\">수출 작물을 재배하도록</div></div><div class=\"rc\"><div class=\"e\">such as tea and coffee</div><div class=\"k\">차와 커피 같은</div></div><div class=\"rc\"><div class=\"e\">at the expense of basic food production.</div><div class=\"k\">기초식품 생산을 희생해 가며.</div></div><div class=\"rnat\">한 예로, 케냐에서, 농부들은 기초식품 생산을 희생해 가며 차와 커피 같은 수출 작물을 재배하도록 적극적으로 장려된다.</div><div class=\"rst\">예를 들어 학교가 '바자회에 팔 꽃을 심어라' 하고 <b>밀어붙여서</b>, 먹을 상추는 못 심어요. = 지문의 <b>are actively encouraged</b>(적극적으로 장려된다)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The result is</div><div class=\"k\">결과는 ~이다</div></div><div class=\"rc\"><div class=\"e\">that a staple crop, such as maize,</div><div class=\"k\">옥수수와 같은 주요 작물이</div></div><div class=\"rc\"><div class=\"e\">is not being produced in a sufficient amount.</div><div class=\"k\">충분한 양으로 생산되지 못하고 있다는 것.</div></div><div class=\"rnat\">결과는 옥수수와 같은 주요 작물은 충분한 양으로 생산되지 못하고 있다는 것이다.</div><div class=\"rst\">그 결과 급식에 쓸 상추가 모자라요. = 지문의 옥수수 같은 주요 작물이 충분히 생산되지 않는다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">The essential argument here is</div><div class=\"k\">여기에서 본질적인 논점은 ~이다</div></div><div class=\"rc\"><div class=\"e\">that the capitalist mode of production</div><div class=\"k\">자본주의적인 생산 방식이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is affecting peasant production</span></div><div class=\"k\"><span class=\"cw\">소농 생산에 영향을 미치고 있다는 것</span></div></div><div class=\"rc\"><div class=\"e\">in the less developed world</div><div class=\"k\">저개발 세계에서의</div></div><div class=\"rc\"><div class=\"e\">in such a way as to limit</div><div class=\"k\">제한하는 방식으로</div></div><div class=\"rc\"><div class=\"e\">the production of staple foods,</div><div class=\"k\">주요 식품의 생산을,</div></div><div class=\"rc\"><div class=\"e\">thus causing a food problem.</div><div class=\"k\">그리하여 식량 문제를 야기하고 있다.</div></div><div class=\"rnat\">여기에서 본질적인 논점은 자본주의적인 생산 방식이 주요 식품의 생산을 제한하는 방식으로 저개발 세계에서의 소농 생산에 영향을 미치고 있으며, 그리하여 식량 문제를 야기하고 있다는 것이다.</div><div class=\"rst\">핵심은 '팔리는 것 위주' 방식이 친구들 텃밭을 좌우해서 먹을거리가 부족해진다는 거예요. = 지문의 자본주의적 생산 방식이 식량 문제를 낳는다는 결론이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"agriculture\" data-m=\"농업\"><b>agriculture</b>농업</button><button type=\"button\" class=\"wdb\" data-w=\"agriculturalists\" data-m=\"농업 경영인들\"><b>agriculturalists</b>농업 경영인들</button><button type=\"button\" class=\"wdb\" data-w=\"vast majority\" data-m=\"대다수\"><b>vast majority</b>대다수</button><button type=\"button\" class=\"wdb\" data-w=\"at the expense of\" data-m=\"~을 희생하여\"><b>at the expense of</b>~을 희생하여</button><button type=\"button\" class=\"wdb\" data-w=\"staple crop\" data-m=\"주요 작물\"><b>staple crop</b>주요 작물</button><button type=\"button\" class=\"wdb\" data-w=\"mode of production\" data-m=\"생산 방식\"><b>mode of production</b>생산 방식</button></div>"};

 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);

  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
