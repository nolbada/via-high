<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>고3 미니모의고사 21회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}

.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}

/* explanation */

.sub{color:var(--sub)}

details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}

.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}

.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}

.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}

.hcard .chip.ok{background:var(--goodbg);color:var(--good)}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}

/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}

.sc .ce{font-size:17px}

.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}
.evx .en{background:#fff;border:1px solid #d5eadc;font-size:15.5px;margin:0 0 8px}
.evx p{margin:6px 0;font-size:15.5px;line-height:1.75}
.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}

.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}

details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});

function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

.", "ana": "<b>the written forms</b>와 <b>we</b>가 아무 연결어 없이 붙어 있으므로, 그 사이는 <b>목적격 관계대명사가 생략된 자리</b>다. <b>encounter</b> 뒤에 목적어가 비어 있는 것이 증거다. 그다음 두 줄표(<b>-</b>) 사이의 긴 나열은 <b>forms</b>를 부연하는 <b>삽입</b>이므로 <b>일단 지우고</b> 읽어야 주어와 동사가 붙는다. 지우면 <b>many of the written forms ~ are social exchanges</b>라는 단순한 뼈대가 드러난다. 마지막이 진짜 어려운 부분이다. <b>put</b>과 <b>addressed</b>는 <b>동사가 아니라 과거분사 두 개</b>이며, 둘 다 앞의 <b>social exchanges</b>를 뒤에서 꾸민다. <b>exchanges which are put ~ and (which are) addressed ~</b>에서 <b>which are</b>가 빠진 형태다. <b>put</b>은 원형과 과거분사의 모양이 같아 동사로 착각하기 쉬운데, 이미 <b>are</b>라는 동사가 있으므로 또 다른 동사가 올 수 없다는 점으로 판별한다.", "pe": "\u0001Likewise<sup>1</sup>\u0002, / many of the \u0001written\u0002 forms \u0001we encounter<sup>2</sup> at school and at work\u0002 / - \u0001from exams and evaluations<sup>3</sup>, to profiles and case studies, to essays and proposals<sup>4</sup>\u0002 - / are \u0001really\u0002 social exchanges (questions, stories, arguments) / \u0001put on paper\u0002 / and \u0001addressed to some imagined listener or interlocutor<sup>5</sup>\u0002.", "pk": "\u0001마찬가지로\u0002, / \u0001우리가 학교와 직장에서 마주하는\u0002 \u0001글로 된\u0002 형식들 중 많은 것은 / - \u0001시험과 평가에서부터, 인물 소개와 사례 연구, 에세이와 제안서에 이르기까지\u0002 - / \u0001사실\u0002 사회적 주고받기(질문, 이야기, 논쟁)다 / \u0001종이에 옮겨 적히고\u0002 / \u0001어떤 상상 속의 청자나 대화 상대에게 보내진\u0002.", "core": "글로 된 형식들 중 많은 것은 사회적 주고받기다.", "tags": ["Likewise = 부사: 문장 전체 꾸밈 (마찬가지로)", "주어 many of the forms. written = 과거분사: forms 꾸밈. we encounter ~ = 관계절(형용사절, 목적격 생략): forms 꾸밈", "대시 삽입: from A to B to C = 전치사구(형용사구): forms의 범위 설명. 삽입이 길어도 주어-동사 연결 유지", "동사 are, 보어 social exchanges(SVC). really = 부사: are 꾸밈. (questions, stories, arguments)는 exchanges의 예시", "put on paper = 과거분사구(형용사적): exchanges 꾸밈", "and: 과거분사 병렬. addressed to ~ = 과거분사구(형용사적): exchanges 꾸밈"]}, {"i": "06", "q": "05", "s": "4", "title": "주격 관계대명사 who + whether절 속의 what절 주어", "eng": "Those who give small amounts<sup>1</sup> to many charities<sup>2</sup> / are not so interested in / whether what they are doing helps others / - psychologists call them warm glow givers<sup>3</sup>.", "notes": [["1", "amount", "양, 액수"], ["2", "charity", "자선 단체"], ["3", "warm glow giver", "따뜻한 만족감을 좇는 기부자"]], "lit": "많은 자선 단체에 소액을 기부하는 사람들은 / 그다지 관심이 없다 / 자신이 하고 있는 일이 남들에게 도움이 되는지에 / - 심리학자들은 그들을 '따뜻한 만족감을 좇는 기부자'라고 부른다.", "nat": "여러 자선 단체에 조금씩 기부하는 사람들은 자신의 기부가 실제로 남에게 도움이 되는지에는 별 관심이 없는데, 심리학자들은 이들을 '따뜻한 만족감을 좇는 기부자'라고 부른다.", "ana": "<b>Those who ~</b>는 '<b>~하는 사람들</b>'이라는 굳어진 표현이다. <b>Those</b>가 선행사이고 <b>who</b>가 <b>주격 관계대명사</b>라, 관계사절 안의 동사 <b>give</b>는 복수인 <b>Those</b>에 수를 맞춘다. 그리고 진짜 동사는 저 멀리 있는 <b>are</b>다. 관계사절이 길어지면 <b>주어와 진짜 동사가 멀어진다</b>는 점을 늘 염두에 두자. 뒷부분이 이 문장의 핵심이다. 전치사 <b>in</b> 뒤에 온 <b>whether</b>절은 '<b>~인지 아닌지</b>'라는 <b>명사절</b>이고, 그 안을 다시 들여다보면 주어 자리에 <b>what they are doing</b>이라는 또 하나의 명사절이 들어가 있다. <b>what</b>은 <b>선행사를 품은 관계대명사</b>라 '<b>~하는 것</b>'으로 해석되고, <b>doing</b> 뒤에 목적어가 비어 있는 것이 그 증거다. 이 <b>what</b>절이 주어이므로 동사가 <b>helps</b>로 <b>단수</b>가 된 점까지 확인해야 완결이다.", "pe": "Those \u0001who give small amounts<sup>1</sup> to many charities<sup>2</sup>\u0002 / are not \u0001so\u0002 interested in / whether what they are doing helps others / - \u0001psychologists call them warm glow givers<sup>3</sup>\u0002.", "pk": "\u0001많은 자선 단체에 소액을 기부하는\u0002 사람들은 / \u0001그다지\u0002 관심이 없다 / 자신이 하고 있는 일이 남들에게 도움이 되는지에 / - \u0001심리학자들은 그들을 '따뜻한 만족감을 좇는 기부자'라고 부른다\u0002.", "core": "사람들은 남들에게 도움이 되는지에 관심이 없다.", "tags": ["주어 Those. who give ~ = 관계절(형용사절): Those 꾸밈. 안쪽 동사 give는 복수 Those에 수 일치", "동사 are, 보어 interested(SVC). so = 부사: interested 꾸밈. interested in = ~에 관심 있는 (전치사 in 뒤에 명사절) [기준: 숙어 단위]", "whether절 = 전치사 in의 목적어(명사절). 안쪽: 주어 <b>what they are doing</b>(~하는 것), 동사 helps(단수), 목적어 others", "대시 삽입절: psychologists call them warm glow givers = 삽입: 앞 내용 부연. 안쪽 call + them + givers (5형식)"]}, {"i": "07", "q": "05", "s": "6", "title": "so ~ that 구문 + 가정법 과거 + 목적격 관계대명사 생략", "eng": "In many cases the donation<sup>1</sup> is so small / - $10 or less - / that if they stopped to think, / they would realize / that the cost of processing<sup>2</sup> the donation is likely to<sup>3</sup> exceed<sup>4</sup> any benefit<sup>5</sup> it brings to the charity.", "notes": [["1", "donation", "기부(금)"], ["2", "process", "처리하다"], ["3", "be likely to", "~할 가능성이 높다"], ["4", "exceed", "초과하다, 넘어서다"], ["5", "benefit", "이익, 혜택"]], "lit": "많은 경우 그 기부금은 너무 적어서 / - 10달러 이하로 - / 만약 그들이 멈춰 서서 생각해 본다면, / 그들은 깨달을 것이다 / 그 기부금을 처리하는 비용이 그것이 자선 단체에 가져다주는 어떤 이익보다도 클 가능성이 높다는 것을.", "nat": "많은 경우 기부금은 10달러 이하로 너무 적어서, 잠시 멈춰 생각해 본다면 기부금을 처리하는 비용이 그 기부가 자선 단체에 가져다주는 이익을 넘어설 가능성이 높다는 것을 알게 될 것이다.", "ana": "겉보기에는 복잡하지만 뼈대는 <b>so ~ that ...</b>('<b>너무 ~해서 …하다</b>') 하나다. <b>so small</b>과 저 뒤의 <b>that</b>이 짝이며, 두 줄표 사이의 <b>$10 or less</b>는 <b>small</b>을 구체적으로 설명하는 <b>삽입</b>이라 지우고 읽어야 짝이 보인다. <b>that</b>절 안에는 <b>if they stopped ~, they would realize ~</b>라는 <b>가정법 과거</b>가 들어 있다. 실제로는 멈춰서 생각해 보지 않는다는 뜻이며, 형태는 <b>if + 과거동사</b>, 주절은 <b>would + 동사원형</b>으로 고정이다. 참고로 <b>stop to think</b>는 '<b>생각하려고 멈추다</b>'이고 <b>stop thinking</b>은 '<b>생각하기를 그만두다</b>'로 뜻이 완전히 다르다. 마지막 <b>any benefit it brings</b>에서는 <b>benefit</b>과 <b>it</b> 사이에 <b>목적격 관계대명사가 생략</b>되어 있고, <b>brings</b> 뒤에 목적어가 비어 있는 것이 그 증거다.", "pe": "\u0001In many cases\u0002 the donation<sup>1</sup> is \u0001so\u0002 small / - \u0001$10 or less\u0002 - / \u0001that if they stopped to think\u0002, / \u0001they would realize\u0002 / \u0001that the cost \u0001of processing<sup>2</sup> the donation\u0002 is likely to<sup>3</sup> exceed<sup>4</sup> any benefit<sup>5</sup> \u0001it brings to the charity\u0002\u0002.", "pk": "\u0001많은 경우\u0002 그 기부금은 \u0001너무\u0002 적어서 / - \u000110달러 이하로\u0002 - / \u0001만약 그들이 멈춰 서서 생각해 본다면\u0002, / \u0001그들은 깨달을 것이다\u0002 / \u0001\u0001그 기부금을 처리하는\u0002 비용이 \u0001그것이 자선 단체에 가져다주는\u0002 어떤 이익보다도 클 가능성이 높다는 것을\u0002.", "core": "그 기부금은 작다.", "tags": ["In many cases = 부사구: 문장 꾸밈. 주어 the donation, 동사 is, 보어 small(SVC). so = 부사: small 꾸밈 (<b>so ~ that</b>)", "대시 삽입: $10 or less = 삽입: small 부연", "that if ~ = so ~ that의 that절(부사절: 결과). 안쪽 if절 = 조건. <b>가정법 과거</b>(stopped ~ would realize)", "they would realize = if절의 주절(가정법 과거). realize의 목적어는 다음 that절", "that절 = realize의 목적어(명사절). 주어 the cost, 동사 is likely to exceed. of processing ~ = 형용사구: cost 꾸밈. it brings ~ = 관계절(목적격 생략): benefit 꾸밈"]}, {"i": "08", "q": "06", "s": "3", "title": "that절 속의 as 부사절 + 목적격 관계대명사 생략 + 삽입구", "eng": "He feared<sup>1</sup> / that, as people came to rely on<sup>2</sup> the written word as a substitute<sup>3</sup> for the knowledge they used to carry<sup>4</sup> inside their heads, / they would, in the words of one of the dialogue's characters, / \"cease<sup>5</sup> to exercise their memory and become forgetful.\"", "notes": [["1", "fear", "두려워하다"], ["2", "rely on", "~에 의존하다"], ["3", "substitute for", "~의 대체물"], ["4", "used to V", "예전에는 ~했었다"], ["5", "cease to V", "~하기를 그만두다"]], "lit": "그는 두려워했다 / 사람들이 예전에 머릿속에 담고 다니던 지식을 대신하는 것으로 글에 의존하게 되면서, / 그들이, 그 대화편 등장인물 중 한 사람의 말을 빌리면, / \"기억을 사용하기를 그만두고 잘 잊어버리게 될\" 것이라고.", "nat": "그는 사람들이 예전에는 머릿속에 담고 다니던 지식을 글로 대신하게 되면서, 대화편 등장인물의 말처럼 \"기억을 쓰기를 그만두고 잘 잊어버리게\" 되리라고 두려워했다.", "ana": "<b>feared that</b>으로 시작하지만 <b>that</b> 바로 뒤에 콤마가 오고 <b>as</b>절이 먼저 튀어나온다. 즉 <b>that절의 주어는 저 뒤의 they</b>이고, 그 앞은 통째로 <b>부사절</b>이다. <b>접속사 뒤에 곧바로 또 다른 접속사가 오면 앞 절의 주어를 뒤에서 찾아야 한다</b>는 신호로 읽자. <b>as</b>는 여기서 '<b>~하면서, ~함에 따라</b>'라는 <b>때 · 비례</b>의 뜻이다. 그 안의 <b>the knowledge they used to carry</b>에서는 <b>목적격 관계대명사가 생략</b>되었고, <b>carry</b> 뒤에 목적어가 비어 있다. <b>used to V</b>는 '<b>예전에는 ~했었다(지금은 아니다)</b>'로, <b>be used to -ing</b>('~에 익숙하다')와 반드시 구별해야 한다. 마지막으로 <b>they would</b>와 인용문 사이에 <b>in the words of ~</b>가 콤마 두 개로 <b>삽입</b>되어 있어, <b>would</b>와 짝을 이루는 동사원형 <b>cease</b>가 멀리 떨어졌다. 삽입구를 지우면 <b>they would cease ~ and become ~</b>이라는 병렬이 바로 보인다.", "pe": "He feared<sup>1</sup> / that, \u0001as people came to rely on<sup>2</sup> the written word \u0001as a substitute<sup>3</sup> for the knowledge \u0001they used to carry<sup>4</sup> inside their heads\u0002\u0002\u0002, / they would, \u0001in the words of one of the dialogue's characters\u0002, / \"cease<sup>5</sup> to exercise their memory and become forgetful.\"", "pk": "그는 두려워했다 / \u0001사람들이 \u0001\u0001예전에 머릿속에 담고 다니던\u0002 지식을 대신하는 것으로\u0002 글에 의존하게 되면서\u0002, / 그들이, \u0001그 대화편 등장인물 중 한 사람의 말을 빌리면\u0002, / \"기억을 사용하기를 그만두고 잘 잊어버리게 될\" 것이라고.", "core": "그는 사람들이 기억을 사용하기를 그만두고 잘 잊어버리게 될 것이라고 두려워했다.", "tags": ["주어 He, 동사 feared, 목적어: 다음 that절 (명사절)", "that절 시작. as ~ = 부사절(이유·동시): 뒤 절 꾸밈. as a substitute for ~ = 전치사구(부사구): rely on 꾸밈. they used to carry ~ = 관계절: knowledge 꾸밈", "that절의 주어 they, 동사 would. in the words of ~ = 삽입 전치사구(부사구): would ~ 꾸밈 (말의 출처)", "cease to exercise A and become forgetful: 동사 cease, 목적어 to exercise ~, 동사 become 병렬. become의 보어 forgetful"]}], "qs": [{"q": "01", "type": "글의 목적", "src": "2018학년도 9월 18번", "ans": "②", "tr": [["1", "저희 회사가 최근에 출시한 교사 대상 응급 처치 교육 프로그램을 소개하게 되어 기쁩니다."], ["2", "저희 CPR(심폐 소생술) 강좌는 학교에서 가장 많이 선택하는 과정입니다."], ["3", "저희는 교사분들이 학교 일정에 맞는 시간에 CPR 교육에 손쉽게 참여하실 수 있도록 해 드립니다."], ["4", "저희 강좌는 응급 상황에서 꼭 필요한 도움을 줄 수 있도록 인명 구조에 관한 온전한 전문 지식을 제공합니다."], ["5", "제대로 된 교육을 받으면 CPR을 빠르고 효과적으로 시행할 수 있고, 환자의 생존 가능성을 높일 수 있습니다."], ["6", "저희 CPR 강좌에 대해 더 알고 싶으시면 저희 웹사이트 www.thebestCPRedu.com을 방문해 주십시오."]], "evh": "1번 문장", "ev": [{"en": true, "h": "We are pleased to introduce our company's recently launched emergency training program for teachers."}, {"en": false, "h": "목적 문항은 <b>보내는 사람과 받는 사람</b>부터 확인해야 한다. 이 글은 <b>회사(our company)</b>가 <b>교사(Dear Teachers)</b>에게 보내는 편지다. 회사가 교사에게 자기 회사의 <b>새 프로그램을 소개한다(introduce)</b>고 첫 문장에서 이미 밝혔다. 이어지는 문장들은 전부 <b>가장 많이 선택하는 과정이다 · 일정에 맞춰 참여할 수 있다 · 온전한 전문 지식을 제공한다 · 생존 가능성을 높일 수 있다</b>처럼 <b>강좌의 장점</b>만 늘어놓는다. 마지막 문장의 <b>please visit our website</b>는 전형적인 <b>광고 문구</b>다. 즉 이 글은 정보를 알려 주는 안내문이 아니라 <b>상품(강좌)을 팔기 위한 홍보문</b>이므로 ②가 정답이다."}], "opts": [{"n": "①", "t": "효과적인 긴급 구조 요령을 설명하려고", "a": false, "x": true, "trap": true, "e": "강좌가 무엇을 가르치는지는 나오지만, <b>구조 요령 자체를 설명하는 문장은 한 줄도 없다</b>. 설명이 목적이라면 실제 방법이 나와야 한다."}, {"n": "②", "t": "심폐 소생술 강좌를 교사에게 홍보하려고", "a": true, "x": false, "trap": false, "e": "<b>Dear Teachers</b>(대상) + <b>introduce our company's ~ program</b>(소개) + <b>please visit our website</b>(유도)가 모두 <b>홍보</b> 한 방향을 가리킨다."}, {"n": "③", "t": "학교의 긴급 구조 교육 일정을 공지하려고", "a": false, "x": true, "trap": false, "e": "<b>at a time to suit your school's schedule</b>은 일정을 <b>알려 주는</b> 것이 아니라 <b>학교 일정에 맞춰 준다</b>는 장점이다. 구체적인 날짜나 시간은 전혀 없다."}, {"n": "④", "t": "심폐 소생술 강좌의 담당 강사를 모집하려고", "a": false, "x": true, "trap": false, "e": "교사는 <b>가르칠 사람</b>이 아니라 <b>수강할 사람</b>으로 등장한다. 지원·자격·모집에 해당하는 표현이 없다."}, {"n": "⑤", "t": "심폐 소생술 수강 교사의 만족도를 조사하려고", "a": false, "x": true, "trap": false, "e": "설문·의견·응답을 요청하는 문장이 없다. 이미 들은 사람이 아니라 <b>아직 듣지 않은 사람</b>에게 보내는 글이다."}], "w": [["be pleased to", "~하게 되어 기쁘다"], ["introduce", "소개하다"], ["recently launched", "최근에 출시된"], ["emergency", "응급 상황, 비상사태"], ["common option", "많이 선택하는 과정"], ["participate in", "~에 참여하다"], ["suit", "~에 맞다, 적합하다"], ["offer", "제공하다"], ["life-saving expertise", "인명 구조 전문 지식"], ["deliver", "제공하다, 전달하다"], ["vital support", "꼭 필요한 도움"], ["proper training", "제대로 된 교육"], ["perform", "수행하다, 실시하다"], ["sufferer", "고통받는 사람, 환자"], ["chances of survival", "생존 가능성"], ["course offerings", "개설 강좌"]]}, {"q": "02", "type": "내용 불일치", "src": "2016학년도 수능 25번", "ans": "④", "tr": [["1", "자기 그림 하나하나에 쏟은 헌신으로 잘 알려진 Protogenes는 고대 그리스의 화가이자 Apelles의 맞수였다."], ["2", "그는 Caria 해안에 있는 Caunus에서 태어났지만, 생애의 대부분을 Rhodes에서 보냈다."], ["3", "그에 관해 그 밖에 알려진 것은 거의 없다."], ["4", "그러나 그의 그림에 관한 기록은 몇 가지 남아 있다."], ["5", "Ialysus와 Satyr가 그의 작품 가운데 가장 잘 알려져 있었다."], ["6", "Protogenes는 Rhodes의 한 마을 영웅을 그린 Ialysus를 그리는 데 대략 7년을 보냈다."], ["7", "그 그림은 적어도 200년 동안 Rhodes에 남아 있다가 로마로 실려 갔다."], ["8", "그곳에서 나중에 그것은 화재로 소실되었다."], ["9", "Protogenes는 기원전 305년부터 304년까지 이어진 Demetrius Poliorcetes의 Rhodes 공격 기간에 Satyr를 작업했다."], ["10", "흥미롭게도 그가 Satyr를 그렸던 정원은 적진 한가운데에 있었다."], ["11", "Protogenes는 Satyr가 완성되었을 때 약 70세였다고 전해진다."]], "evh": "10번 문장", "ev": [{"en": true, "h": "Interestingly, the garden in which he painted the Satyr was in the middle of the enemy's camp."}, {"en": false, "h": "내용 불일치는 <b>선지의 단어 하나가 지문의 단어 하나와 어긋나는지</b>만 보면 된다. 10번 문장의 핵심은 <b>in the middle of the enemy's camp</b>, 곧 <b>적진 한가운데</b>다. 그런데 ④는 이것을 <b>적진과 멀리 떨어진 곳</b>으로 정반대로 바꿔 놓았다. 게다가 앞 문장에 <b>Interestingly</b>(흥미롭게도)가 붙어 있다는 점도 결정적인 단서다. <b>적진과 멀리 떨어진 안전한 곳에서 그렸다</b>면 흥미로울 이유가 전혀 없다. <b>흥미롭게도</b>라는 말이 붙었다는 것 자체가 <b>상식과 어긋나는 상황</b>, 즉 위험한 적진 한복판이었다는 뜻이다. 불일치 문항에서는 이런 <b>감정·태도를 나타내는 부사</b>가 답의 위치를 알려 주는 경우가 많다."}], "opts": [{"n": "①", "t": "고대 그리스 화가였다.", "a": false, "x": true, "trap": false, "e": "1번의 <b>an ancient Greek painter</b>와 그대로 일치한다."}, {"n": "②", "t": "일생의 대부분을 Rhodes에서 지냈다.", "a": false, "x": true, "trap": false, "e": "2번의 <b>lived most of his life in Rhodes</b>와 일치한다. 태어난 곳(Caunus)과 헷갈리지 않도록 <b>but</b> 앞뒤를 나눠 봐야 한다."}, {"n": "③", "t": "Ialysus를 그리는 데 대략 7년을 보냈다.", "a": false, "x": true, "trap": true, "e": "6번의 <b>spent approximately seven years painting the Ialysus</b>와 일치한다. 뒤에 나오는 <b>200 years</b>·<b>305 to 304 B.C.</b> 같은 다른 숫자와 섞이기 쉬우니 어느 숫자가 어디에 붙는지 확인해야 한다."}, {"n": "④", "t": "적진과 멀리 떨어진 곳에서 Satyr를 그렸다.", "a": true, "x": false, "trap": false, "e": "10번은 <b>in the middle of the enemy's camp</b>, 즉 <b>적진 한가운데</b>라고 했다. 정반대이므로 이것이 정답이다."}, {"n": "⑤", "t": "Satyr를 완성했을 때는 약 70세였다고 전해진다.", "a": false, "x": true, "trap": false, "e": "11번의 <b>is said to have been about seventy years of age when the Satyr was completed</b>와 일치한다."}], "w": [["be known for", "~로 알려져 있다"], ["devotion", "헌신, 몰두"], ["ancient", "고대의"], ["rival", "경쟁자, 맞수"], ["coast", "해안"], ["little else", "그 밖에 거의 ~않다"], ["account", "기록, 이야기"], ["well-known", "잘 알려진"], ["approximately", "대략, 약"], ["depiction", "묘사, 그림"], ["remain", "남아 있다, 머무르다"], ["be carried off to", "~로 실려 가다"], ["destroy", "파괴하다"], ["attack", "공격"], ["in the middle of", "~의 한가운데에"], ["be said to have p.p.", "~했다고 전해지다"]]}, {"q": "03", "type": "글의 제목", "src": "2015년 7월 23번", "ans": "①", "tr": [["1", "프랑스의 기술자 Maximilian Ringelmann은 1913년에 말의 수행 능력을 연구했다."], ["2", "그는 마차를 끄는 동물 두 마리의 힘이 말 한 마리가 내는 힘의 두 배에 미치지 못한다는 결론을 내렸다."], ["3", "이 결과에 놀란 그는 연구를 사람에게까지 확장했다."], ["4", "그는 여러 사람에게 밧줄을 당기게 하고 각자가 가하는 힘을 측정했다."], ["5", "평균적으로 두 사람이 함께 당기면 각자 자기 힘의 93퍼센트만 쏟았고, 세 사람이면 85퍼센트, 여덟 사람이면 겨우 49퍼센트였다."], ["6", "과학은 이것을 사회적 태만 효과라고 부른다."], ["7", "그것은 개인의 수행이 직접 눈에 보이지 않을 때, 즉 그것이 집단의 노력 속에 뒤섞여 버릴 때 일어난다."], ["8", "그것은 조정 선수들 사이에서는 일어나지만 계주에서는 일어나지 않는데, 계주에서는 각자의 몫이 분명히 드러나기 때문이다."], ["9", "사회적 태만은 합리적인 행동이다. 절반만 해도 되는데 왜 온 힘을 다 쏟겠는가 - 더구나 이 작은 편법이 눈에 띄지도 않는데 말이다."], ["10", "아주 간단히 말해, 사회적 태만은 우리 모두가 저지르는 일종의 속임수다. 말들이 그랬듯이 그것이 무의식중에 일어난다 해도 마찬가지다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "It occurs when individual performance is not directly visible; it blends into the group effort."}, {"en": false, "h": "제목 문항은 <b>글이 설명하려는 현상 하나</b>를 잡으면 끝난다. 1~5번은 실험이고, 6번에서 그 현상에 <b>social loafing</b>이라는 이름이 붙는다. 그다음 7번이 <b>언제 그런 일이 일어나는가</b>를 못 박는다. <b>개인의 수행이 직접 보이지 않고 집단의 노력에 뒤섞일 때</b>다. 8번은 그 반대 사례(계주)로 이 조건을 한 번 더 확인해 준다. 즉 이 글은 <b>사람이 여럿이 모이면 왜 힘을 덜 쓰는가</b>를 설명한 글이다. <b>Teams</b>(여럿이 모인 상황)와 <b>Lazy</b>(힘을 덜 씀), 그리고 <b>Why</b>(원인 설명)를 모두 담은 ①이 정답이다. 제목 문항에서 <b>Why</b>로 시작하는 선지는 <b>글이 원인을 설명하고 있는가</b>만 확인하면 된다."}], "opts": [{"n": "①", "t": "왜 팀은 게을러지는가", "a": true, "x": false, "trap": false, "e": "6번의 <b>social loafing</b>(집단 속에서 힘을 덜 쏟는 현상)과 7번의 <b>blends into the group effort</b>(원인)가 <b>Teams</b>와 <b>Lazy</b>, 그리고 <b>Why</b>에 정확히 대응한다."}, {"n": "②", "t": "협력은 어떻게 효율을 극대화하는가", "a": false, "x": true, "trap": false, "e": "글의 방향이 정반대다. 5번의 숫자(93 → 85 → 49퍼센트)는 사람이 늘수록 효율이 <b>떨어진다</b>는 자료다."}, {"n": "③", "t": "개인의 능력이 두드러지는 곳", "a": false, "x": true, "trap": true, "e": "8번에 계주가 잠깐 나오지만, 이는 <b>사회적 태만이 일어나지 않는 예외</b>일 뿐 글의 중심이 아니다. 예외를 제목으로 삼으면 안 된다."}, {"n": "④", "t": "집단 경쟁은 사람을 더 각성시킨다", "a": false, "x": true, "trap": false, "e": "<b>경쟁(competition)</b>이라는 소재 자체가 지문에 없다. 지문의 실험은 경쟁이 아니라 <b>협동 작업</b>이다."}, {"n": "⑤", "t": "사회적 태만: 개인 수행의 촉진제", "a": false, "x": true, "trap": false, "e": "핵심어 <b>social loafing</b>이 들어 있어 고르기 쉽지만, <b>Booster</b>(촉진제)라는 평가가 정반대다. 지문은 10번에서 이것을 <b>cheating</b>(속임수)이라고 못 박았다."}], "w": [["engineer", "기술자, 공학자"], ["performance", "수행(능력), 성과"], ["conclude", "결론짓다"], ["equal", "~와 같다"], ["extend A to B", "A를 B까지 확장하다"], ["apply", "가하다"], ["on average", "평균적으로"], ["invest", "쏟다, 투자하다"], ["social loafing", "사회적 태만"], ["visible", "눈에 보이는"], ["blend into", "~에 뒤섞이다"], ["rower", "조정 선수"], ["relay race", "계주"], ["contribution", "기여, 몫"], ["evident", "분명한, 명백한"], ["rational", "합리적인"], ["shortcut", "지름길, 편법"], ["go unnoticed", "눈에 띄지 않고 넘어가다"], ["guilty of", "~에 대해 죄가 있는"], ["unconsciously", "무의식적으로"]]}, {"q": "04", "type": "글의 주제", "src": "2023년 3월 23번", "ans": "①", "tr": [["1", "가능할 때마다 우리는 우리가 생각하는 정보를 다시 사회화하는 조치를 취해야 한다."], ["2", "우리가 머릿속에서 끊임없이 이어 가는 재잘거림은 사실 일종의 내면화된 대화다."], ["3", "마찬가지로 우리가 학교와 직장에서 마주하는 글의 형식들 - 시험과 평가에서부터 인물 소개와 사례 연구, 에세이와 제안서에 이르기까지 - 은 사실 종이에 옮겨 적혀 어떤 상상 속 청자나 대화 상대에게 보내진 사회적 주고받기(질문, 이야기, 논쟁)다."], ["4", "이렇게 한 다리 건너 있는 상호작용을 실제 사회적 만남으로 되돌리는 데에는 상당한 이점이 있다."], ["5", "연구는 다른 사람이 개입될 때 - 그들을 모방하든, 그들과 논쟁하든, 이야기를 주고받든, 호흡을 맞추고 협력하든, 가르치거나 배우든 - 뇌가 '같은' 정보를 다르게, 그리고 흔히 더 효과적으로 처리한다는 것을 보여 준다."], ["6", "우리는 본질적으로 사회적 존재이며, 우리의 사고는 다른 사람을 우리의 사고 흐름 속으로 끌어들일 때 이득을 얻는다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Research demonstrates that the brain processes the \"same\" information differently, and often more effectively, when other human beings are involved."}, {"en": false, "h": "주제 문항은 <b>글이 무엇을 권하고 있는가</b>를 잡아야 한다. 1번이 <b>정보를 다시 사회화하라(re-socialize)</b>는 지시로 문을 열고, 4번이 <b>그렇게 하면 상당한 이점이 있다</b>고 못 박는다. 그 이점의 근거가 바로 5번이다. <b>다른 사람이 개입되면 뇌가 같은 정보를 더 효과적으로 처리한다</b>는 연구 결과다. 6번은 그 이유를 <b>우리는 본질적으로 사회적 존재</b>라는 말로 정리한다. 즉 이 글의 핵심은 <b>정보 처리(processing information)</b>와 <b>사회적 상호작용(social interactions)</b>이라는 두 축이고, 그 둘을 <b>via</b>로 연결한 ①이 정답이다. 2·3번의 내면의 재잘거림이나 글의 형식은 <b>사실 이것도 대화다</b>라는 것을 보여 주기 위한 예시일 뿐이다."}], "opts": [{"n": "①", "t": "사회적 상호작용을 통한 정보 처리의 중요성", "a": true, "x": false, "trap": false, "e": "5번의 <b>the brain processes the \"same\" information ~ when other human beings are involved</b>가 <b>processing information via social interactions</b>와 그대로 겹친다."}, {"n": "②", "t": "신체 활동을 통해 사회적 기술을 향상시키는 방법", "a": false, "x": true, "trap": false, "e": "<b>physical activities</b>(신체 활동)에 해당하는 내용이 전혀 없다. 5번의 <b>synchronizing</b>을 몸을 맞추는 것으로 오해하기 쉽지만 여기서는 <b>대화의 호흡</b>을 뜻한다."}, {"n": "③", "t": "인지 기능에 대한 정기적 평가의 필요성", "a": false, "x": true, "trap": true, "e": "3번에 <b>evaluations</b>가 나오지만 이는 <b>학교와 직장에서 마주하는 글의 종류</b>를 나열한 것이지, <b>인지 기능을 평가하자</b>는 말이 아니다. 단어만 빌려 온 함정이다."}, {"n": "④", "t": "성격 특성이 사회적 상호작용에 미치는 영향", "a": false, "x": true, "trap": false, "e": "<b>personality traits</b>(성격 특성)라는 소재가 없다. 게다가 글의 방향은 <b>상호작용 → 사고</b>인데 이 선지는 <b>성격 → 상호작용</b>으로 화살표가 다르다."}, {"n": "⑤", "t": "내면화된 사회적 통제의 한 형태로서의 사회화", "a": false, "x": true, "trap": false, "e": "<b>internalized</b>와 <b>social</b>이라는 단어는 2번에 나오지만, <b>통제(control)</b>라는 개념은 지문 어디에도 없다. 글은 통제가 아니라 <b>사고의 효율</b>을 말한다."}], "w": [["whenever possible", "가능할 때마다"], ["take measures", "조치를 취하다"], ["re-socialize", "다시 사회화하다"], ["continual", "끊임없는"], ["patter", "재잘거림, 수다"], ["carry on", "계속하다, 이어 가다"], ["internalized", "내면화된"], ["likewise", "마찬가지로"], ["encounter", "마주하다"], ["case study", "사례 연구"], ["proposal", "제안서"], ["social exchange", "사회적 주고받기"], ["addressed to", "~에게 보내진"], ["interlocutor", "대화 상대"], ["at a remove", "조금 거리를 둔"], ["demonstrate", "입증하다, 보여 주다"], ["imitate", "모방하다"], ["synchronize", "호흡을 맞추다"], ["inherently", "본질적으로"], ["train of thought", "사고의 흐름"]]}, {"q": "05", "type": "어법", "src": "2018학년도 수능 28번", "ans": "②", "tr": [["1", "기부 행동을 연구하는 심리학자들은, 어떤 사람들은 한두 자선 단체에 상당한 금액을 기부하는 반면 다른 사람들은 여러 자선 단체에 소액을 기부한다는 점에 주목해 왔다."], ["2", "한두 자선 단체에 기부하는 사람들은 그 자선 단체가 무엇을 하고 있는지, 그리고 그것이 정말로 긍정적인 영향을 미치고 있는지에 대한 증거를 구한다."], ["3", "만약 그 증거가 그 자선 단체가 정말로 다른 사람들을 돕고 있음을 보여 준다면, 그들은 상당한 금액을 기부한다."], ["4", "여러 자선 단체에 조금씩 기부하는 사람들은 자신의 기부가 실제로 남에게 도움이 되는지에는 별 관심이 없는데, 심리학자들은 이들을 '따뜻한 만족감을 좇는 기부자'라고 부른다."], ["5", "자신이 기부하고 있다는 것을 아는 것만으로 기분이 좋아지며, 그 기부가 어떤 영향을 미치는지는 상관하지 않는다."], ["6", "많은 경우 기부금은 10달러 이하로 너무 적어서, 잠시 멈춰 생각해 본다     ['word',1,BANDS[1][0],BANDS[1][1],S.locked[WS.id]?['ok','확인 끝']:(nm?['warn','표시 '+nm]:null),false],
    ['dk',2,BANDS[2][0],BANDS[2][1],null,false],
    ['submit',3,BANDS[3][0],BANDS[3][1],sub?['ok','제출 '+sub.s+' / '+N]:['','미제출'],false],
    ['exp',4,BANDS[4][0],BANDS[4][1],sub?['ok','열림']:['','제출하면 열림'],!sub]
  ];
  let h='<header><div class="wrap"><div class="row1"><h1>'+esc(TITLE)+'</h1><a class="link" href="index.html">목록</a></div></div></header><div class="wrap hcards">';
  cards.forEach(c=>{
    h+='<button class="hcard" data-v="'+c[0]+'" '+(c[5]?'disabled':'')+'><span class="bn">'+c[1]+'</span><span class="tx"><b>'+c[2]+'</b><small>'+c[3]+'</small></span>'+(c[4]?'<span class="chip '+c[4][0]+'">'+c[4][1]+'</span>':'')+'</button>';
  });
  h+='</div>';
  app.innerHTML=h;
}
function sHtmlP(s){
  let x='<div class="s"><div class="sn"><span class="lb">문장 '+s.n+'</span></div>';
  s.ch.forEach(c=>{x+='<div class="ch"><div class="ce">'+String(c.e).replace(/<\/?b>/g,'')+'</div><div class="ck">'+c.k+'</div></div>';});
  const lays=[];
  if(s.link)lays.push(['이어 읽으면',s.link]);
  if(s.easy)lays.push(['쉬운 말로',s.easy]);
  if(s.gist)lays.push(['결국 이 얘기',s.gist]);
  lays.forEach(l=>{x+='<div class="lay"><span class="lb">'+l[0]+'</span>'+l[1]+'</div>';});
  if(lays.length)x+='<button class="stg" data-names="'+lays.map(l=>l[0]).join('|')+'">'+lays[0][0]+'</button>';
  return x+'</div>';
}
function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div>'+(c.tags&&c.tags[j]?'<div class="ct">'+c.tags[j]+'</div>':'')+'</div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  const names=[];
  if(c.core){x+='<div class="lay core"><span class="lb">핵심</span>'+esc(c.core)+'</div>';names.push('핵심');}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';names.push('자연스러운 해석');
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';

}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
