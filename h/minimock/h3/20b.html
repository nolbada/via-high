<title>고3 미니모의고사 20회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}

.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */

.sc-h .at{font-size:13px;color:var(--sub)}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}

로 <b>행복(happiness)<\/b>이라고 답합니다", "그래서 주어진 글 다음은 (C)입니다", "(C)의 (8)은 행복이 무엇인지에 대해 사람마다 견해가 다르다고 합니다", "(B)의 (4)는 어떤 사람은 행복을 세속적인 즐거움, 다른 사람은 영원한 구원이라고 말한다며 그 서로 다른 견해의 예를 듭니다", "그래서 (C) 다음은 (B)입니다", "(B)의 (6)은 그의 이론이 신이나 도덕 규범에 대한 지식에 의존하지 않는다고 합니다", "그럼 무엇에 의존하는지가 이어져야 하므로, 인간 본성과 현실에 대한 지식에만 의존한다는 (A)의 (2)가 옵니다", "그래서 정답은 ⑤ (C)-(B)-(A)입니다."], "ch": [{"n": "①", "t": "(A) - (C) - (B)", "g": "", "ok": false, "e": ["(A)의 (2)·(3)은 그의 이론이 인간 본성과 세속적 현실에 관한 것임을 밝힙니다", "그런데 (C)의 (7)·(8)은 다시 '선'에 대해 그가 주장했던 것(had argued)과 '선은 행복'이라는 답을 말합니다", "(A) 다음에 (C)가 오면 앞뒤 순서가 맞지 않습니다."]}, {"n": "②", "t": "(B) - (A) - (C)", "g": "", "ok": false, "e": ["(B)의 (4)에서 it은 행복을 가리키고, 사람마다 행복을 다르게 본다는 예입니다", "주어진 글 바로 뒤에는 아직 '사람마다 견해가 다르다'는 말이 없어서 (B)가 먼저 올 수 없습니다."]}, {"n": "③", "t": "(B) - (C) - (A)", "g": "", "ok": false, "e": ["(B)가 주어진 글 바로 뒤에 올 수 없습니다", "(B)의 서로 다른 견해의 예는 (C)의 (8)에서 '사람마다 견해가 다르다'고 말한 다음에 와야 합니다."]}, {"n": "④", "t": "(C) - (A) - (B)", "g": "", "ok": false, "e": ["(C)의 (8) 끝에서 사람마다 행복에 대한 견해가 다르다고 했습니다", "그 견해의 예를 드는 것은 (B)의 (4)입니다", "(A)가 먼저 오면 이 연결이 끊깁니다."]}, {"n": "⑤", "t": "(C) - (B) - (A)", "g": "", "ok": true, "e": ["주어진 글의 eudaimoniā(행복) → (C)의 '보편적인 목표는 행복' → (C) 끝의 '사람마다 견해가 다르다' → (B)의 견해의 예 → (B) 끝의 '신과 도덕 규범의 지식에 의존하지 않는다' → (A)의 '인간 본성과 현실의 지식에만 의존한다'로 이어집니다."]}], "tr": ["아리스토텔레스는, 인간을 위한 '선(善)'은 ('좋은'을 의미하는 'eu'와 '영혼'을 의미하는 'daimon'과 결합한, '행복'으로 가장 흔히 번역되는 그리스 단어인) 'eudaimoniā'에 있다고 설명한다.", "그것은 오직 인간 본성과 다른 세속적이고 사회적인 현실에 대한 지식에만 의존한다.", "그에게 있어 'eudaimoniā'라는 개념의 적절한 의미를 밝히는 것은 바로 인간 본성과 세속적인 존재에 대한 연구(를 통해서)이다.", "어떤 사람들은 그것이 세속적인 즐거움이라고 말하는 반면, 다른 사람들은 그것이 영원한 구원이라고 말한다.", "아리스토텔레스의 이론은 어떤 신학적 혹은 형이상학적 지식에 의존하지 않는다는 점에서 '자연적'이라고 판명될 것이다.", "그것은 신에 대한 지식 또는 형이상학적이고 보편적인 도덕 규범에 대한 지식에 의존하지 않는다.", "그는 '선'은 우리 모두가 목표로 하는 것이라고 순전히 형식적으로 주장했지만, 그는 이제 이 보편적인 인간의 목표는 행복이라는 더 실질적인 답을 한다.", "하지만, 사람마다 행복이 무엇인가에 대해 서로 다른 견해를 갖고 있기 때문에 이 결론이 여전히 다소 형식적이라고 그는 재빨리 지적한다."], "ps": [{"n": 1, "ch": [{"e": "Aristotle explains", "k": "아리스토텔레스는 설명한다"}, {"e": "that the Good for human beings", "k": "인간을 위한 '선(善)'은"}, {"e": "<b>consists in<\/b> <i>eudaimoniā<\/i>", "k": "'eudaimoniā'에 있다고"}, {"e": "(a Greek word combining <i>eu<\/i> meaning “good”", "k": "('좋은'을 의미하는 'eu'를"}, {"e": "with <i>daimon<\/i> meaning “spirit,”", "k": "'영혼'을 의미하는 'daimon'과 결합한,"}, {"e": "and most often translated as “happiness”).", "k": "그리고 '행복'으로 가장 흔히 번역되는 그리스 단어인)."}], "link": "아리스토텔레스는, 인간을 위한 '선'은 ('좋은'을 의미하는 'eu'와 '영혼'을 의미하는 'daimon'을 결합한, '행복'으로 가장 흔히 번역되는 그리스 단어인) 'eudaimoniā'에 있다고 설명한다.", "easy": "아리스토텔레스는 인간에게 좋은 것(선)은 '에우다이모니아'에 있다고 말해요. 이 그리스 말은 보통 '행복'으로 번역해요.", "gist": "주어진 글 — 인간의 선은 eudaimoniā, 곧 행복에 있어요."}, {"n": 2, "ch": [{"e": "(A) It depends only on knowledge", "k": "(A) 그것<span class=\"r\">(= 아리스토텔레스의 이론)<\/span>은 오직 지식에만 의존한다"}, {"e": "of human nature", "k": "인간 본성에 대한"}, {"e": "and other <b>worldly<\/b> and social realities.", "k": "그리고 다른 세속적이고 사회적인 현실에 대한."}], "link": "그것은 오직 인간 본성과 다른 세속적이고 사회적인 현실에 대한 지식에만 의존한다.", "easy": "그의 이론은 오직 인간 본성과 세상살이·사회 현실에 대한 지식에만 기대요.", "gist": "(A)의 시작 — 앞에서 '무엇에 의존하지 않는다'고 한 뒤에 와야 해요."}, {"n": 3, "ch": [{"e": "For him", "k": "그<span class=\"r\">(= 아리스토텔레스)<\/span>에게 있어"}, {"e": "it is the study of human nature and worldly existence", "k": "바로 인간 본성과 세속적인 존재에 대한 연구이다"}, {"e": "that will <b>disclose<\/b> the relevant meaning", "k": "적절한 의미를 밝히는 것은"}, {"e": "of the <b>notion<\/b> of <i>eudaimoniā<\/i>.", "k": "'eudaimoniā'라는 개념의."}], "link": "그에게 있어 'eudaimoniā'라는 개념의 적절한 의미를 밝히는 것은 바로 인간 본성과 세속적인 존재에 대한 연구이다.", "easy": "아리스토텔레스는 '행복'의 참뜻을 밝혀 주는 것이 인간 본성과 세상살이에 대한 연구라고 봤어요.", "gist": "(A) 마무리 — 행복의 뜻은 인간과 세상을 연구해서 밝혀요."}, {"n": 4, "ch": [{"e": "(B) Some people say", "k": "(B) 어떤 사람들은 말한다"}, {"e": "it is worldly enjoyment", "k": "그것<span class=\"r\">(= 행복)<\/span>이 세속적인 즐거움이라고"}, {"e": "while others say", "k": "반면 다른 사람들은 말한다"}, {"e": "it is <b>eternal salvation<\/b>.", "k": "그것<span class=\"r\">(= 행복)<\/span>이 영원한 구원이라고."}], "easy": "어떤 사람은 행복을 세상의 즐거움이라고 하고, 다른 사람은 영원한 구원이라고 해요.", "gist": "(B)의 시작 — (C) 끝의 '사람마다 다른 견해'의 예예요."}, {"n": 5, "ch": [{"e": "Aristotle’s theory will turn out to be “naturalistic”", "k": "아리스토텔레스의 이론은 '자연적'이라고 판명될 것이다"}, {"e": "<b>in that<\/b> it does not depend", "k": "그것<span class=\"r\">(= 아리스토텔레스의 이론)<\/span>이 의존하지 않는다는 점에서"}, {"e": "on any <b>theological<\/b> or <b>metaphysical<\/b> knowledge.", "k": "어떤 신학적 혹은 형이상학적 지식에."}], "link": "아리스토텔레스의 이론은 어떤 신학적 혹은 형이상학적 지식에 의존하지 않는다는 점에서 '자연적'이라고 판명될 것이다.", "easy": "아리스토텔레스의 이론은 신학이나 형이상학 지식에 기대지 않아서 '자연적'인 이론이라고 할 수 있어요.", "gist": "그의 이론은 신학·형이상학에 기대지 않아요."}, {"n": 6, "ch": [{"e": "It does not depend on knowledge of God", "k": "그것<span class=\"r\">(= 아리스토텔레스의 이론)<\/span>은 신에 대한 지식에 의존하지 않는다"}, {"e": "or of metaphysical and universal moral norms.", "k": "또는 형이상학적이고 보편적인 도덕 규범에 대한 (지식에)."}], "easy": "그의 이론은 신에 대한 지식에도, 형이상학적이고 보편적인 도덕 규범에 대한 지식에도 기대지 않아요.", "gist": "(B) 마무리 — '의존하지 않는다' 다음에 '오직 ~에만 의존한다'는 (A)가 와요."}, {"n": 7, "ch": [{"e": "(C) <b>Whereas<\/b> he had argued in a purely formal way", "k": "(C) 그<span class=\"r\">(= 아리스토텔레스)<\/span>는 순전히 형식적으로 주장했지만"}, {"e": "that the Good was that", "k": "'선'은 ~하는 것이라고"}, {"e": "to which we all <b>aim<\/b>,", "k": "우리 모두가 목표로 하는,"}, {"e": "he now gives a more <b>substantive<\/b> answer:", "k": "그는 이제 더 실질적인 답을 한다:"}, {"e": "that this universal human goal is happiness.", "k": "이 보편적인 인간의 목표는 행복이라는."}], "link": "그는 '선'은 우리 모두가 목표로 하는 것이라고 순전히 형식적으로 주장했지만, 그는 이제 이 보편적인 인간의 목표는 행복이라는 더 실질적인 답을 한다.", "easy": "아리스토텔레스는 전에는 '선은 우리 모두가 목표로 하는 것'이라고 형식적으로만 말했지만, 이제는 그 목표가 바로 행복이라고 더 구체적으로 답해요.", "gist": "(C)의 시작 — 주어진 글의 '행복'을 바로 이어받아요."}, {"n": 8, "ch": [{"e": "However, he is quick to <b>point out<\/b>", "k": "하지만, 그<span class=\"r\">(= 아리스토텔레스)<\/span>는 재빨리 지적한다"}, {"e": "that this conclusion is still somewhat formal", "k": "이 결론<span class=\"r\">(= 인간의 목표는 행복이라는 결론)<\/span>이 여전히 다소 형식적이라고"}, {"e": "since different people have different views", "k": "사람마다 서로 다른 견해를 갖고 있기 때문에"}, {"e": "about what happiness is.", "k": "행복이 무엇인가에 대해."}], "link": "하지만, 사람마다 행복이 무엇인가에 대해 서로 다른 견해를 갖고 있기 때문에 이 결론이 여전히 다소 형식적이라고 그는 재빨리 지적한다.", "easy": "하지만 그는 사람마다 행복을 다르게 생각하니까, '목표는 행복'이라는 결론도 아직은 형식적이라고 바로 짚어요.", "gist": "(C) 마무리 — '사람마다 다른 견해'가 (B)의 예로 이어져요."}]}, {"no": "09", "typ": "문단 요약", "src": "2019학년도 수능 40번", "evn": [1, 3, 4], "ev_en": "Biological organisms, including human societies both with and without market systems, discount distant outputs over those available at the present time based on risks associated with an uncertain future. / For example, the energy output from solar panels or wind power engines, where most investment happens before they begin producing, may need to be assessed differently when compared to most fossil fuel extraction technologies, where a large proportion of the energy output comes much sooner, and a larger (relative) proportion of inputs is applied during the extraction process, and not upfront. / Thus fossil fuels, particularly oil and natural gas, in addition to having energy quality advantages (cost, storability, transportability, etc.) over many renewable technologies, also have a “temporal advantage” after accounting for human behavioral preference for current consumption/return.", "ev_ko": [[1, "시장 체계가 있거나 없는 (두 가지의) 인간 사회를 (모두) 포함하여, 생물학적 유기체들은 불확실한 미래와 관련된 위험에 근거하여 현재 이용할 수 있는 것(생산물)들보다 (시간상으로) 멀리 있는 생산물들을 무시한다(평가 절하한다)."], [3, "예를 들어, 대부분의 투자가 그것들이 생산하는 것을 시작하기 전에 발생하는 태양 전지판이나 풍력 엔진으로부터의 에너지 생산은, 많은 비율의 에너지 생산이 훨씬 더 빨리 일어나고 더 큰 (상대적) 비율의 투입이 선행 투자가 아니라 추출 과정 동안 적용되는 대부분의 화석 연료 추출 기술과 비교했을 때, 다르게 평가될 필요가 있을 수 있다."], [4, "따라서 화석 연료, 특히 석유와 천연가스는 많은 재생 가능 기술들보다 에너지 품질 이점(비용, 저장성, 운송 가능성 등)을 가질 뿐만 아니라, 현재의 소비/수익에 대한 인간의 행동적 선호를 생각하면(빨리 얻을 수 있는 것을 선호하는 행동 특성을 고려하면) '시간적 이점'도 또한 갖는다."]], "why": ["(1)에서 생물학적 유기체는 멀리 있는 생산물보다 <b>현재 이용할 수 있는 것<\/b>을 더 높이 평가한다고 합니다", "(3)에서 화석 연료는 에너지 생산의 많은 부분이 훨씬 빨리 나오고, 투입은 추출 과정 동안 이루어진다고 합니다", "투입하면 곧바로 생산이 나온다는 뜻입니다", "그래서 사람들이 선호하는 생산물은 (A) <b>immediate<\/b>(즉각적인)입니다", "(4)에서 화석 연료는 재생 가능 기술보다 에너지 품질 이점에 더해 '시간적 이점'도 가진다고 합니다", "이점이 있다는 것은 (B) <b>competitive< 는 <b>help + 원형부정사</b>와 둘 다 쓸 수 있다는 점도 함께 확인해 두자.", "pe": "\u0001Over the course of time<sup>1</sup>\u0002, / this process would have helped to retain water \u0001on Earth\u0002, / \u0001while it also contributed to<sup>2</sup> the emergence<sup>3</sup> of oxygen in the atmosphere\u0002.", "pk": "\u0001시간이 흐르면서\u0002, / 이 과정은 \u0001지구에\u0002 물을 붙잡아 두는 데 도움을 주었을 것이다, / \u0001동시에 그것은 대기 중 산소의 출현에도 기여했다\u0002.", "core": "이 과정은 물을 붙잡아 두는 데 도움을 주었을 것이다.", "tags": ["Over the course of time = 전치사구(부사구): 주절 꾸밈 (시간의 경과)", "주어 this process, 동사 would have helped(과거 추측), 목적어 to retain water. on Earth = 전치사구(부사구): retain 꾸밈 (장소)", "while ~ = 부사절(동시): helped 꾸밈. contribute to = ~에 기여하다. of oxygen = 형용사구: emergence 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. would have p.p.가 낯설고, 뒤에 while절이 붙어 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: this process (이 과정)", "V: would have helped (help 돕다. would have p.p. = 과거의 추측, ~했을 것이다)", "O: to retain water (물을 붙잡아 두는 것, to부정사)", "뼈대 = <b>this process would have helped to retain water</b>", "retain (붙잡아 두다), process (과정). on Earth (지구에)는 retain을 꾸미는 부사구"]}, {"t": "<b>Over the course of time</b>은 전치사구(부사구)이다. 문장 전체를 꾸민다 (시간이 흐르면서). course (흐름)."}, {"t": "<b>while it also contributed to the emergence of oxygen in the atmosphere</b>는 부사절(동시)이다. helped를 꾸민다 (한편으로는).", "sub": ["it = this process (이 과정)", "contribute to (~에 기여하다), emergence (출현)", "of oxygen (산소의)은 emergence를 꾸밈, in the atmosphere (대기 중)"]}], "sum": "이 과정은 지구에 물을 붙들면서 산소 출현에도 기여"}, {"i": "04", "q": "08", "s": "5", "title": "S+V+C(turn out to be) + in that절", "eng": "Aristotle's theory will turn out to be<sup>1</sup> \"naturalistic<sup>2</sup>\" / in that<sup>3</sup> it does not depend on any theological<sup>4</sup> or metaphysical<sup>5</sup> knowledge.", "notes": [["1", "turn out to be", "~로 판명되다"], ["2", "naturalistic", "자연주의적인"], ["3", "in that", "~라는 점에서"], ["4", "theological", "신학의"], ["5", "metaphysical", "형이상학적인"]], "lit": "아리스토텔레스의 이론은 '자연주의적'인 것으로 판명될 것이다 / 그것이 어떤 신학적 지식이나 형이상학적 지식에도 의존하지 않는다는 점에서.", "nat": "아리스토텔레스의 이론은 어떤 신학적·형이상학적 지식에도 기대지 않는다는 점에서 '자연주의적'인 것으로 드러난다.", "ana": "<b>turn out to be</b>는 '<b>결국 ~인 것으로 판명되다</b>'라는 뜻이다. 여기서 <b>turn</b>을 '돌다'로 읽으면 문장이 무너지므로, <b>turn out</b>을 <b>한 덩어리</b>로 외워 두어야 한다. 뒤의 <b>in that</b>은 '<b>~라는 점에서</b>'로 <b>이유·근거</b>를 대는 접속사이며, 뒤에 <b>완전한 절</b>이 온다. <b>in that</b>과 생김새가 비슷한 <b>in which</b>(관계사)와 헷갈리면 안 되는데, 구별법은 간단하다. 뒤가 <b>완전한 문장</b>이면 <b>in that</b>, 명사가 하나 비어 있으면 <b>in which</b>다. 부정어 <b>not</b>과 함께 쓰인 <b>any</b>는 '<b>어떤 ~도 (아니다)</b>'라는 <b>전체 부정</b>이 된다. <b>theological or metaphysical</b>이 <b>or</b>로 묶여 하나의 <b>knowledge</b>를 함께 꾸미는 구조도 확인하자.", "pe": "Aristotle's theory will turn out to be<sup>1</sup> \"naturalistic<sup>2</sup>\" / \u0001in that<sup>3</sup> it does not depend on any theological<sup>4</sup> or metaphysical<sup>5</sup> knowledge\u0002.", "pk": "아리스토텔레스의 이론은 '자연주의적'인 것으로 판명될 것이다 / \u0001그것이 어떤 신학적 지식이나 형이상학적 지식에도 의존하지 않는다는 점에서\u0002.", "core": "아리스토텔레스의 이론은 '자연주의적'인 것으로 판명될 것이다.", "tags": ["주어 theory, 동사 will turn out, 보어 to be \"naturalistic\" (SVC, turn out to be = ~로 판명되다)", "in that ~ = 부사절(이유·제한): turn out 꾸밈 (~라는 점에서). 안쪽: 주어 it, 동사 does not depend on, 목적어 knowledge"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. turn out (~로 판명되다) 뒤에 to be 보어가 붙는 모양이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Aristotle's theory (아리스토텔레스의 이론, theory 이론)", "V: will turn out (turn out 결국 ~로 판명되다)", "C: to be “naturalistic” (자연주의적인 것)", "뼈대 = <b>Aristotle's theory will turn out to be “naturalistic”</b>", "naturalistic (자연주의적인)"]}, {"t": "<b>in that it does not depend on any theological or metaphysical knowledge</b>는 부사절(이유·제한)이다. will turn out을 꾸민다 (~라는 점에서).", "sub": ["in that = ~라는 점에서", "S: it (= theory, 이론), V: does not depend on (~에 의존하지 않는다), O: any ... knowledge", "theological (신학적인), metaphysical (형이상학적인), knowledge (지식)"]}], "sum": "그의 이론은 신학·형이상학 지식에 기대지 않는 점에서 자연주의적"}, {"i": "05", "q": "08", "s": "8", "title": "It is ~ that 강조구문", "eng": "For him / it is the study of human nature<sup>1</sup> and worldly<sup>2</sup> existence<sup>3</sup> / that will disclose<sup>4</sup> the relevant meaning of the notion<sup>5</sup> of eudaimonia.", "notes": [["1", "human nature", "인간 본성"], ["2", "worldly", "세속적인"], ["3", "existence", "존재"], ["4", "disclose", "드러내다, 밝히다"], ["5", "notion", "개념"]], "lit": "그에게 있어 / 바로 인간 본성과 세속적 존재에 대한 연구가 / 에우다이모니아라는 개념의 적절한 의미를 드러내 줄 것이다.", "nat": "그가 보기에, 에우다이모니아라는 개념의 참뜻을 드러내 주는 것은 다름 아닌 인간 본성과 세속적 존재에 대한 연구다.", "ana": "<b>It is ~ that …</b> 형태를 만나면 먼저 <b>가주어·진주어</b>인지 <b>강조구문</b>인지 갈라야 한다. 판별법은 <b>It is</b>와 <b>that</b>을 지워 보는 것이다. 지워도 <b>완전한 문장</b>이 되면 <b>강조구문</b>이다. 여기서는 <b>The study of human nature and worldly existence will disclose the relevant meaning ~</b>이 되어 문장이 그대로 살아나므로 <b>강조구문</b>이 확실하다. 즉 원래 주어인 <b>the study</b>를 <b>바로 그것</b>이라고 힘주어 말하려고 앞으로 끌어낸 것이며, 우리말로는 '<b>바로 ~이다</b>'로 옮긴다. 강조되는 것이 <b>사람</b>이면 <b>that</b> 대신 <b>who</b>를, <b>사물</b>이면 <b>which</b>를 쓸 수도 있다. 문장 맨 앞의 <b>For him</b>은 '<b>그가 보기에</b>'라는 <b>관점</b>을 나타내는 전치사구다.", "pe": "\u0001For him\u0002 / it is the study \u0001of human nature<sup>1</sup> and worldly<sup>2</sup> existence<sup>3</sup>\u0002 / that will disclose<sup>4</sup> the \u0001relevant\u0002 meaning \u0001of the notion<sup>5</sup> \u0001of eudaimonia\u0002\u0002.", "pk": "\u0001그에게 있어\u0002 / 바로 \u0001인간 본성과 세속적 존재에 대한\u0002 연구가 / \u0001에우다이모니아라는 개념의\u0002 \u0001적절한\u0002 의미를 드러내 줄 것이다.", "core": "바로 연구가 의미를 드러내 줄 것이다.", "tags": ["For him = 전치사구(부사구): 문장 전체 꾸밈 (그에게 있어)", "<b>It is ~ that 강조구문</b>: 강조된 the study가 that절의 주어. of human nature ~ = 전치사구(형용사구): study 꾸밈", "that will disclose ~ = 강조구문의 that + 동사. 목적어 the meaning. relevant = 형용사, of the notion of eudaimonia = 형용사구: meaning 꾸밈"], "steps": [{"t": "이 문장은 <b>It is ~ that 강조구문</b>이다. 강조하는 말을 빼고 원래 문장으로 돌리면 평범한 S+V+O(3형식)이다."}, {"t": "원래 문장의 뼈대부터 찾는다.", "sub": ["S: the study (연구)", "V: will disclose (disclose 드러내다)", "O: the relevant meaning (적절한 의미)", "뼈대 = <b>the study will disclose the meaning</b>", "It is와 that 사이에 강조할 말(the study ...)이 끼어 있다. It은 해석하지 않는다"]}, {"t": "<b>of human nature and worldly existence</b>는 전치사구(형용사구)이다. study를 꾸민다 (인간 본성과 세속적 존재에 대한). human nature (인간 본성), worldly (세속적인), existence (존재)."}, {"t": "<b>of the notion of eudaimonia</b>는 전치사구(형용사구)이다. meaning을 꾸민다 (에우다이모니아라는 개념의). notion (개념), eudaimonia (에우다이모니아, 행복·번영을 뜻하는 철학 용어), relevant (적절한), meaning (의미)."}, {"t": "<b>For him</b>은 전치사구(부사구)이다. 문장 전체를 꾸민다 (그에게 있어). him은 앞 문맥의 사람이다."}, {"t": "함정: 이 that은 관계대명사가 아니라 강조구문의 that이다. It is와 that을 빼도 문장이 성립하는지로 구별한다."}], "sum": "그에게는 인간 본성에 대한 연구가 에우다이모니아의 뜻을 드러냄"}, {"i": "06", "q": "09", "s": "2", "title": "As절 + There is 구문 + 분사구문", "eng": "As the timing<sup>1</sup> of inputs and outputs varies<sup>2</sup> greatly depending on the type of energy, / there is a strong case<sup>3</sup> to incorporate<sup>4</sup> time / when assessing energy alternatives<sup>5</sup>.", "notes": [["1", "timing", "시점"], ["2", "vary", "다르다, 달라지다"], ["3", "strong case", "강력한 근거"], ["4", "incorporate", "포함하다, 통합하다"], ["5", "alternative", "대안"]], "lit": "투입과 산출의 시점이 에너지 종류에 따라 크게 달라지기 때문에, / 시간을 포함시켜야 할 강력한 근거가 있다 / 에너지 대안을 평가할 때.", "nat": "투입과 산출의 시점은 에너지 종류에 따라 크게 달라지므로, 에너지 대안을 평가할 때 시간을 함께 고려해야 할 강력한 이유가 있다.", "ana": "여기서 <b>As</b>는 '<b>~하면서</b>'가 아니라 '<b>~ 때문에</b>'라는 <b>이유</b>다. 판단 근거는 뒤쪽 주절이 <b>there is a strong case</b>, 즉 <b>주장의 근거</b>를 말하고 있다는 점이다. 주어는 <b>the timing</b> 하나이고 <b>of inputs and outputs</b>는 이를 꾸미는 전치사구이므로 동사가 <b>varies</b>라는 <b>단수형</b>인 것이 맞다. <b>and</b> 때문에 복수로 착각해 <b>vary</b>를 고르면 틀린다 — <b>수 일치는 전치사구를 지운 뒤 판단한다</b>. <b>a strong case to incorporate</b>의 <b>to부정사</b>는 앞의 <b>case</b>를 꾸미는 <b>형용사적 용법</b>으로 '<b>~해야 할 근거</b>'가 된다. 마지막 <b>when assessing</b>은 <b>when we assess</b>에서 <b>주어와 be동사</b>가 생략된 형태로, <b>접속사를 남긴 분사구문</b>이다. 뜻을 분명히 하려고 접속사를 일부러 남긴다.", "pe": "\u0001As the timing<sup>1</sup> of inputs and outputs varies<sup>2</sup> greatly depending on the type of energy\u0002, / there is a \u0001strong\u0002 case<sup>3</sup> \u0001to incorporate<sup>4</sup> time\u0002 / \u0001when assessing energy alternatives<sup>5</sup>\u0002.", "pk": "\u0001투입과 산출의 시점이 에너지 종류에 따라 크게 달라지기 때문에\u0002, / \u0001시간을 포함시켜야 할\u0002 \u0001강력한\u0002 근거가 있다 / \u0001에너지 대안을 평가할 때\u0002.", "core": "근거가 있다.", "tags": ["As ~ = 부사절(이유): 주절 꾸밈. 안쪽: 주어 the timing, 동사 varies. depending on ~ = 분사구문(부사적): varies 꾸밈", "<b>There is 구문</b>: 진짜 주어 case. strong = 형용사: case 꾸밈. to incorporate time = to부정사(형용사적): case 꾸밈 (~할 근거)", "when assessing ~ = 접속사가 남은 <b>분사구문</b>(부사적: 시간): incorporate 꾸밈"], "steps": [{"t": "이 문장은 <b>As절 + There is 구문(1형식)</b>이다. 앞에 이유절이, 뒤에 to부정사와 분사구문이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: a strong case (강력한 근거, case 근거)", "V: is (이다)", "뼈대 = <b>there is a strong case</b>"]}, {"t": "<b>As the timing of inputs and outputs varies greatly ...</b>는 부사절(이유)이다. 주절을 꾸민다 (~하기 때문에).", "sub": ["S: the timing (시점), V: varies (달라지다), greatly (크게)", "of inputs and outputs (투입과 산출의)는 timing을 꾸밈. input (투입), output (산출)", "depending on the type of energy = 분사구문 (에너지 종류에 따라). type (종류)"]}, {"t": "<b>to incorporate time</b>은 to부정사(형용사적)이다. case를 꾸민다 (시간을 포함시킬). incorporate (포함시키다)."}, {"t": "<b>when assessing energy alternatives</b>는 접속사가 남은 분사구문(부사적, 시간)이다. incorporate를 꾸민다 (에너지 대안을 평가할 때). assess (평가하다), alternative (대안)."}], "sum": "에너지 종류별 시점이 달라, 대안 평가 때 시간 요소를 넣어야 함"}, {"i": "07", "q": "10", "s": "A-2", "title": "S+V+O + 계속적 which", "eng": "He teaches first graders<sup>1</sup>, / which means he lives in a world of riddles<sup>2</sup>, birthday cakes, and pointless<sup>3</sup> stories.", "notes": [["1", "first grader", "1학년 학생"], ["2", "riddle", "수수께끼"], ["3", "pointless", "시시한, 무의미한"]], "lit": "그는 1학년 학생들을 가르치는데, / 그것은 그가 수수께끼와 생일 케이크와 시시한 이야기의 세계에 살고 있다는 뜻이다.", "nat": "그는 1학년 학생들을 가르치는데, 그 말은 곧 수수께끼와 생일 케이크와 실없는 이야기로 가득한 세계에 산다는 뜻이다.", "ana": "콤마 뒤의 <b>which</b>가 이 문장의 전부다. 이 <b>which</b>의 선행사는 어떤 <b>단어 하나</b>가 아니라 <b>He teaches first graders</b>라는 <b>앞 문장 전체</b>다. 이렇게 <b>앞 절 전체를 받는 계속적 용법의 which</b>는 '<b>그런데 그것은</b>'으로 이어 읽으며, 이 자리에 <b>that</b>은 절대 올 수 없다. <b>that</b>은 계속적 용법으로 쓰지 못하기 때문이다. 문장 전체를 받으므로 동사도 <b>단수 means</b>가 온 점을 확인하자. <b>means</b> 뒤에는 접속사 <b>that</b>이 생략되어 <b>he lives ~</b>라는 <b>명사절</b>이 목적어로 붙어 있다. <b>말하다·생각하다</b> 계열 동사 뒤의 <b>that</b>은 흔히 생략되므로, <b>동사 + 주어 + 동사</b>가 이어지면 <b>that이 빠졌구나</b> 하고 읽으면 된다.", "pe": "He teaches first graders<sup>1</sup>, / \u0001which means he lives in a world of riddles<sup>2</sup>, birthday cakes, and pointless<sup>3</sup> stories\u0002.", "pk": "그는 1학년 학생들을 가르치는데, / \u0001그것은 그가 수수께끼와 생일 케이크와 시시한 이야기의 세계에 살고 있다는 뜻이다\u0002.", "core": "그는 1학년 학생들을 가르친다.", "tags": ["주어 He, 동사 teaches, 목적어 first graders (3형식)", "which ~ = <b>계속적 용법</b> 관계절(형용사절): 앞 절 전체를 받음. 안쪽: means 뒤에 that 생략. in a world of ~ = 전치사구(부사구): lives 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b> 뒤에 계속적 관계절이 붙은 문장이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: He (그)", "V: teaches (teach 가르치다)", "O: first graders (1학년 학생들, first grader 1학년생)", "뼈대 = <b>He teaches first graders</b>"]}, {"t": "<b>which means he lives in a world of ...</b>는 계속적 관계절이다. 앞 절 전체를 받는다 (그것은 ~을 뜻한다).", "sub": ["which = 그가 1학년을 가르친다는 사실", "mean (뜻하다). means 뒤에 that이 생략됨: he lives in a world (그는 ~의 세계에 산다)", "live in (~에 살다)"]}, {"t": "<b>of riddles, birthday cakes, and pointless stories</b>는 전치사구(형용사구)이다. a world를 꾸민다 (수수께끼, 생일 케이크, 시시한 이야기로 이루어진). riddle (수수께끼), pointless (시시한), story (이야기)."}], "sum": "1학년을 가르쳐서 수수께끼·케이크·시시한 얘기의 세계에서 삶"}, {"i": "08", "q": "10", "s": "B-4", "title": "S+V+O(that절) + 동명사 목적어 3개", "eng": "He answered / that he loved helping children learn to write their names for the first time<sup>1</sup>, / finding someone a new friend, / and sharing in<sup>2</sup> the joy of reading.", "notes": [["1", "for the first time", "난생처음, 처음으로"], ["2", "share in", "~을 함께 나누다"]], "lit": "그는 대답했다 / 아이들이 난생처음 자기 이름 쓰는 법을 배우도록 돕는 일을 좋아한다고, / 누군가에게 새 친구를 찾아 주는 일을, / 그리고 책 읽는 즐거움을 함께 나누는 일을 (좋아한다고).", "nat": "그는 아이들이 난생처음 제 이름 쓰는 법을 배우도록 돕는 일, 누군가에게 새 친구를 찾아 주는 일, 책 읽는 즐거움을 함께 나누는 일이 좋아서라고 대답했다.", "ana": "<b>loved</b>의 목적어가 <b>helping</b> 하나가 아니라 <b>helping · finding · sharing</b> <b>세 개</b>라는 것이 핵심이다. <b>and</b>가 보이면 <b>앞뒤 형태가 같은 것끼리</b> 묶인다는 원칙을 적용해, 같은 <b>-ing</b> 형태를 찾아 올라가면 짝이 바로 보인다. 이때 <b>finding</b>을 <b>children</b>을 꾸미는 현재분사로 착각하면 문장이 엉킨다. 앞에 이미 동명사가 있으면 <b>병렬을 먼저 의심</b>하는 것이 순서다. 첫 번째 덩어리 안의 <b>help children learn</b>은 <b>help + 목적어 + 원형부정사</b>로, <b>help</b>는 <b>to learn</b>과 <b>learn</b> 둘 다 목적격보어로 받을 수 있는 드문 동사다. <b>find someone a new friend</b>는 <b>find + 간접목적어 + 직접목적어</b>의 <b>4형식</b>이라 '<b>누군가에게 새 친구를 찾아 주다</b>'가 된다.", "pe": "He answered / that he loved helping children learn to write their names \u0001for the first time<sup>1</sup>\u0002, / finding someone a new friend, / and sharing \u0001in<sup>2</sup> the joy \u0001of reading\u0002\u0002.", "pk": "그는 대답했다 / 아이들이 \u0001난생처음\u0002 자기 이름 쓰는 법을 배우도록 돕는 일을 좋아한다고, / 누군가에게 새 친구를 찾아 주는 일을, / 그리고 \u0001\u0001책 읽는\u0002 즐거움을\u0002 함께 나누는 일을 (좋아한다고).", "core": "그는 아이들을 돕고, 친구를 찾아 주고, 함께 나누는 일을 좋아한다고 대답했다.", "tags": ["주어 He, 동사 answered, 목적어: 아래 that절 (명사절)", "that절 = answered의 목적어. 주어 he, 동사 loved, 목적어 <b>동명사</b> ①: helping + children + learn. for the first time = 전치사구(부사구): write 꾸밈", "<b>동명사 목적어 ②</b>: finding + 간접목적어 someone + 직접목적어 a new friend (4형식)", "<b>동명사 목적어 ③</b>: sharing. (in the joy of reading) = 전치사구(부사구): sharing을 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]. (of reading): joy를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 that절 안에 동명사 목적어 세 개가 나열되어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: He (그)", "V: answered (answer 대답하다의 과거형)", "O: that절", "뼈대 = <b>He answered that he loved ...</b>"]}, {"t": "that절 안은 S: he, V: loved (love 아주 좋아하다), O: 동명사 세 개이다. 먼저 ①이다.", "sub": ["① helping children learn to write their names for the first time (아이들이 난생처음 자기 이름 쓰는 법을 배우도록 돕는 것)", "help + O: children + 원형 learn. learn to write (쓰는 법을 배우다), name (이름)", "for the first time (처음으로)은 write를 꾸미는 부사구"]}, {"t": "② <b>finding someone a new friend</b> (누군가에게 새 친구를 찾아 주는 것)", "sub": ["find A B = A에게 B를 찾아 주다 (4형식). A: someone (누군가), B: a new friend (새 친구)"]}, {"t": "③ <b>sharing in the joy of reading</b> (책 읽는 즐거움을 함께 나누는 것)", "sub": ["share in (~을 함께 나누다). in 이하는 거의 필수에 가까운 부사구이지만 1형식 + 전치사구로 보아 수식어로 둔다 (문형 기준)", "joy (즐거움), reading (독서). of reading은 joy를 꾸밈"]}, {"t": "세 동명사는 콤마와 and로 병렬되어 모두 loved의 목적어이다."}], "sum": "그는 첫 글쓰기 돕기, 친구 찾아 주기, 독서의 기쁨 나누기를 좋아한다고 답함"}], "qs": [{"q": "07", "type": "문장 삽입", "src": "2022년 10월 38번", "ans": "④", "tr": [["1", "물 분자는 증발의 결과로 대기를 순환한다."], ["2", "물 분자는 대기 중으로 높이 올라가면서 햇빛의 영향을 받아 구성 원소인 수소와 산소로 분리되기도 한다."], ["3", "훨씬 무거운 산소는 대기 중에 남거나 지표면에 붙들리는 반면, 수소는 너무 가벼워서 지구 중력이 붙잡아 둘 수 없기 때문에 우주로 달아나는 경향이 있다."], ["4", "수소가 우주로 달아나기 전에 그것을 붙잡을 수 있는 유리 산소가 대기 중에 거의 또는 전혀 없는 한, 이 과정은 아무 방해도 받지 않고 계속되었을 것이다."], ["5", "【주어진 문장】 그러나 지표면에 있던 이용 가능한 물질, 주로 철이 모두 유리 산소와 결합하고 난 뒤에, 산소는 상당한 양으로 대기 중에 나타나기 시작했다."], ["6", "이런 일이 일어나자마자, 유리 산소는 다시 물 분자를 형성함으로써 유리 수소의 대부분을 붙들었고, 그리하여 수소의 손실을 늦추었을 것이다."], ["7", "시간이 흐르면서 이 과정은 지구에 물을 붙잡아 두는 데 도움을 주는 한편, 대기 중에 산소가 나타나는 데에도 기여했을 것이다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "As soon as this happened, the free oxygen would have captured most of the free hydrogen by forming water molecules again, thus slowing down the loss of hydrogen."}, {"en": false, "h": "문장 삽입은 <b>지시어와 연결어가 가리킬 대상이 있는지</b>를 확인하는 문제다. 주어진 문장은 <b>However</b>로 시작하므로 <b>앞 내용과 반대</b>여야 하고, 내용은 <b>산소가 대기 중에 나타나기 시작했다</b>는 것이다. 바로 앞 ④ 자리의 문장은 <b>유리 산소가 거의 또는 전혀 없는 한 이 과정이 계속되었을 것</b>이라는 내용이므로 <b>산소 없음 → However → 산소 등장</b>으로 정확히 뒤집힌다. 결정적인 근거는 그 뒤 문장의 <b>As soon as this happened</b>다. <b>this</b>가 가리킬 <b>사건</b>이 앞에 반드시 있어야 하는데, 삽입 문장을 넣지 않으면 <b>산소가 나타난 일</b>이라는 사건이 없어 <b>this</b>가 허공을 가리킨다. 따라서 정답은 <b>④</b>다."}], "opts": [{"n": "①", "t": "1번 문장 뒤", "a": false, "x": true, "trap": false, "e": "앞은 <b>물의 순환</b>, 뒤는 <b>물 분자가 분리되는 과정</b>으로 자연스럽게 이어진다. 아직 산소의 축적이라는 화제가 나오지도 않아 <b>However</b>가 뒤집을 대상이 없다."}, {"n": "②", "t": "2번 문장 뒤", "a": false, "x": true, "trap": false, "e": "2번에서 수소와 산소로 나뉜 뒤 3번에서 <b>각각 어떻게 되는지</b>를 대조하므로 흐름이 끊기지 않는다. 여기에 산소 축적 이야기를 넣으면 3번의 <b>Whereas</b> 대조가 무너진다."}, {"n": "③", "t": "3번 문장 뒤", "a": false, "x": true, "trap": false, "e": "3번의 <b>수소가 달아난다</b>와 4번의 <b>수소를 붙잡을 산소가 없는 한 계속된다</b>가 하나의 논리로 묶여 있다. 그 사이를 갈라놓을 이유가 없다."}, {"n": "④", "t": "4번 문장 뒤", "a": true, "x": false, "trap": false, "e": "<b>산소가 거의 없다(4번)</b> → <b>However, 산소가 상당량 나타나기 시작했다(삽입)</b> → <b>이런 일이 일어나자마자(5번)</b>로 이어진다. <b>this</b>가 가리킬 사건이 이 자리에서만 생긴다."}, {"n": "⑤", "t": "5번 문장 뒤", "a": false, "x": true, "trap": true, "e": "5번에서 이미 <b>유리 산소가 수소를 붙들었다</b>고 했으므로 산소는 벌써 등장한 상태다. 여기서 <b>산소가 나타나기 시작했다</b>고 말하면 순서가 거꾸로 된다."}], "w": [["molecule", "분자"], ["circulate", "순환하다"], ["evaporation", "증발"], ["constituent", "구성하는"], ["element", "원소, 요소"], ["under the influence of", "~의 영향을 받아"], ["whereas", "반면에"], ["capture", "붙들다, 붙잡다"], ["escape", "달아나다, 탈출하다"], ["gravity", "중력"], ["retain", "붙잡아 두다, 유지하다"], ["as long as", "~하는 한"], ["cosmos", "우주"], ["unhindered", "아무 방해도 받지 않는"], ["sizable", "상당한 크기의"], ["emergence", "발생, 출현"]]}, {"q": "08", "type": "글의 순서", "src": "2023년 3월 36번", "ans": "⑤", "tr": [["1", "【주어진 글】 아리스토텔레스는 인간을 위한 선(善)이 에우다이모니아('좋음'을 의미하는 eu와 '영혼'을 의미하는 daimon이 결합한 그리스어로, 가장 흔히 '행복'으로 번역된다)에 있다고 설명한다."], ["2", "【(C)】 그는 선이 우리 모두가 목표로 하는 것이라고 순전히 형식적으로 주장했던 반면, 이제는 더 실질적인 답을 내놓는다. 이 보편적인 인간의 목표가 바로 행복이라는 것이다."], ["3", "【(C)】 그러나 그는 이 결론도 여전히 다소 형식적이라고 재빨리 지적한다. 사람마다 행복이 무엇인지에 대해 서로 다른 견해를 가지고 있기 때문이다."], ["4", "【(B)】 어떤 사람들은 그것이 세속적인 즐거움이라고 말하는 반면, 다른 사람들은 그것이 영원한 구원이라고 말한다."], ["5", "【(B)】 아리스토텔레스의 이론은 어떤 신학적·형이상학적 지식에도 기대지 않는다는 점에서 '자연주의적'인 것으로 드러난다."], ["6", "【(B)】 그것은 신에 대한 지식에도, 형이상학적이고 보편적인 도덕 규범에 대한 지식에도 의존하지 않는다."], ["7", "【(A)】 그것은 오직 인간 본성과 그 밖의 세속적·사회적 현실에 대한 지식에만 의존한다."], ["8", "【(A)】 그가 보기에, 에우다이모니아라는 개념의 참뜻을 드러내 주는 것은 다름 아닌 인간 본성과 세속적 존재에 대한 연구다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "Whereas he had argued in a purely formal way that the Good was that to which we all aim, he now gives a more substantive answer: that this universal human goal is happiness."}, {"en": false, "h": "순서 문항은 <b>대명사와 연결어가 가리킬 것이 이미 나왔는지</b>만 따지면 된다. (C)의 첫 문장은 <b>Whereas he had argued ~ he now gives</b>, 즉 <b>과거완료(전에 주장했던 것)</b>와 <b>현재(지금 내놓는 답)</b>를 맞세운다. 그 <b>지금의 답</b>이 <b>happiness</b>인데, 이는 주어진 글의 <b>eudaimonia = happiness</b>를 곧바로 이어받는 말이므로 (C)가 첫 순서다. (C) 끝에서 <b>사람마다 행복의 견해가 다르다</b>고 했고, (B)는 <b>Some people say ... while others say ...</b>로 그 <b>서로 다른 견해</b>를 그대로 나열하므로 (C) 다음은 (B)다. (B) 끝의 <b>It does not depend on knowledge of God ~</b>과 (A) 첫 문장의 <b>It depends only on knowledge of human nature ~</b>는 <b>not A / only B</b>의 짝이므로 마지막이 (A)다. 따라서 <b>(C)-(B)-(A)</b>."}], "opts": [{"n": "①", "t": "(A) - (C) - (B)", "a": false, "x": true, "trap": false, "e": "(A)의 첫 문장 <b>It depends only on ~</b>는 <b>앞에 무엇을 부정한 문장</b>이 있어야 성립한다. 주어진 글 바로 뒤에 놓으면 <b>only</b>가 대조할 대상이 없다."}, {"n": "②", "t": "(B) - (A) - (C)", "a": false, "x": true, "trap": false, "e": "(B)의 <b>Some people say it is ~</b>에서 <b>it</b>이 가리키는 것은 <b>행복</b>인데, 주어진 글은 <b>eudaimonia</b>가 무엇인지 소개만 했을 뿐 <b>사람마다 다르다</b>는 화제를 아직 꺼내지 않았다."}, {"n": "③", "t": "(B) - (C) - (A)", "a": false, "x": true, "trap": false, "e": "(C)의 <b>he now gives a more substantive answer</b>는 <b>처음으로 답을 제시하는</b> 대목이다. (B)의 논의가 이미 진행된 뒤에 오면 시점이 어긋난다."}, {"n": "④", "t": "(C) - (A) - (B)", "a": false, "x": true, "trap": true, "e": "(C) 끝의 <b>서로 다른 견해</b>를 곧바로 받아 주는 것은 (B)의 <b>Some people say ... while others say ...</b>다. (A)를 먼저 놓으면 이 연결이 끊긴다."}, {"n": "⑤", "t": "(C) - (B) - (A)", "a": true, "x": false, "trap": false, "e": "주어진 글의 <b>happiness</b> → (C)의 <b>this universal human goal is happiness</b> → (C) 끝의 <b>different views</b> → (B)의 <b>Some people ... others ...</b> → (B) 끝의 <b>does not depend on</b> → (A)의 <b>depends only on</b>으로 빈틈없이 이어진다."}], "w": [["consist in", "~에 있다"], ["combine A with B", "A를 B와 결합하다"], ["spirit", "영혼, 정신"], ["translate", "번역하다"], ["in a purely formal way", "순전히 형식적으로"], ["aim", "목표로 하다"], ["substantive", "실질적인"], ["universal", "보편적인"], ["be quick to", "~을 재빨리 하다"], ["point out", "지적하다"], ["worldly", "세속적인"], ["enjoyment", "즐거움"], ["eternal", "영원한"], ["salvation", "구원"], ["turn out to be", "~로 판명되다"], ["in that", "~라는 점에서"], ["theological", "신학의"], ["metaphysical", "형이상학적인"], ["moral norm", "도덕 규범"], ["disclose", "드러내다, 밝히다"], ["notion", "개념"]]}, {"q": "09", "type": "문단 요약", "src": "2019학년도 수능 40번", "ans": "①", "tr": [["1", "시장 체제를 갖춘 사회든 그렇지 않은 사회든 인간 사회를 포함한 생물학적 유기체는, 불확실한 미래와 관련된 위험에 근거하여 현재 이용할 수 있는 산출물보다 먼 미래의 산출물을 평가 절하한다."], ["2", "투입과 산출의 시점은 에너지 종류에 따라 크게 달라지므로, 에너지 대안을 평가할 때 시간을 함께 고려해야 할 강력한 이유가 있다."], ["3", "예를 들어 태양 전지판이나 풍력 엔진에서 나오는 에너지 산출은 대부분의 투자가 생산이 시작되기 전에 이루어지는데, 이는 에너지 산출의 상당 부분이 훨씬 일찍 나오고 투입의 (상대적으로) 더 큰 비율이 선행 투자가 아니라 채굴 과정 중에 적용되는 대부분의 화석 연료 채굴 기술과 비교할 때 다르게 평가되어야 할 수도 있다."], ["4", "따라서 화석 연료, 특히 석유와 천연가스는 많은 재생 가능 기술에 비해 에너지 품질상의 이점(비용, 저장성, 운송 가능성 등)을 가질 뿐만 아니라, 현재의 소비와 수익을 선호하는 인간의 행동 성향까지 고려하면 '시간적 이점'도 가진다."], ["5", "【요약문】 사람들이 더 (A)즉각적인 산출물을 선호하는 경향이 있다는 사실 때문에, 화석 연료는 투입과 산출 사이의 거리라는 면에서 재생 가능한 에너지 대안보다 더 (B)경쟁력이 있다."]], "evh": "1번 문장", "ev": [{"en": true, "h": "Biological organisms, including human societies both with and without market systems, discount distant outputs over those available at the present time based on risks associated with an uncertain future."}, {"en": false, "h": "요약 문항은 <b>요약문의 빈칸 두 개를 지문의 어느 표현이 채우는지</b>를 하나씩 짝지어야 한다. (A) 앞의 <b>people tend to favor more ___ outputs</b>는 1번의 <b>discount distant outputs over those available at the present time</b>와 짝을 이룬다. <b>먼 것을 깎아내리고 지금 있는 것을 높인다</b>는 뜻이므로 사람들이 선호하는 것은 <b>immediate</b>(즉각적인)이다. (B)는 4번이 결정한다. 화석 연료가 재생 에너지에 비해 <b>energy quality advantages</b>에 더해 <b>temporal advantage</b>까지 가진다고 했으니, 둘을 비교하면 화석 연료가 더 <b>competitive</b>(경쟁력 있는)다. 따라서 (A) immediate, (B) competitive인 ①이 정답이다."}], "opts": [{"n": "①", "t": "(A) immediate 즉각적인 — (B) competitive 경쟁력 있는", "a": true, "x": false, "trap": false, "e": "1번의 <b>discount distant outputs over those available at the present time</b>이 <b>immediate</b>를, 4번의 <b>advantages ... temporal advantage</b>가 <b>competitive</b>를 뒷받침한다."}, {"n": "②", "t": "(A) available 이용 가능한 — (B) expensive 값비싼", "a": false, "x": true, "trap": false, "e": "<b>available</b>은 1번에 실제로 나오는 단어지만 <b>at the present time</b>이 붙어야 뜻이 완성된다. 그리고 (B)의 <b>expensive</b>는 4번의 <b>cost</b>가 화석 연료의 <b>이점</b>으로 제시된 것과 정반대다."}, {"n": "③", "t": "(A) delayed 지연된 — (B) competitive 경쟁력 있는", "a": false, "x": true, "trap": true, "e": "(B)는 맞지만 (A)가 <b>거꾸로</b>다. 사람들이 선호하는 것은 <b>미뤄진 산출물</b>이 아니라 <b>지금 당장의 산출물</b>이다. 한 칸만 맞으면 오답이다."}, {"n": "④", "t": "(A) convenient 편리한 — (B) expensive 값비싼", "a": false, "x": true, "trap": false, "e": "<b>convenient</b>에 해당하는 근거가 없다. 지문이 말하는 기준은 <b>편리함</b>이 아니라 <b>시점(언제 나오는가)</b>이다."}, {"n": "⑤", "t": "(A) abundant 풍부한 — (B) competitive 경쟁력 있는", "a": false, "x": true, "trap": false, "e": "<b>abundant</b>(풍부한)는 <b>양</b>에 관한 말이다. 지문의 대조 축은 양이 아니라 <b>지금 나오는가, 나중에 나오는가</b>라는 시간이다."}], "w": [["biological organism", "생물학적 유기체"], ["discount", "평가 절하하다"], ["distant", "먼, 나중의"], ["output", "산출(물), 생산량"], ["associated with", "~와 관련된"], ["uncertain", "불확실한"], ["vary", "다르다, 달라지다"], ["strong case", "강력한 근거"], ["incorporate", "포함하다, 통합하다"], ["assess", "평가하다"], ["alternative", "대안"], ["solar panel", "태양 전지판"], ["investment", "투자"], ["extraction", "추출, 채굴"], ["proportion", "비율"], ["upfront", "선행 투자의"], ["storability", "저장성"], ["transportability", "운송 가능성"], ["renewable", "재생 가능한"], ["account for", "고려하다, 설명하다"], ["temporal advantage", "시간적 이점"], ["favor", "선호하다"], ["in regards to", "~에 관하여"]]}, {"q": "10", "type": "장문 · 글의 순서", "src": "2016학년도 9월 43번", "ans": "④", "tr": [["1", "【(A)】 Peter Anderson은 마침내 자기 아파트 현관문을 열었을 때 완전히 지쳐 있었다."], ["2", "【(A)】 그는 1학년 학생들을 가르치는데, 그 말은 곧 수수께끼와 생일 케이크와 실없는 이야기로 가득한 세계에 산다는 뜻이다."], ["3", "【(A)】 (a)그의 세계는 여섯 살짜리들이 지배한다."], ["4", "【(A)】 가죽 가방과 함께 길고 편안한 소파에 몸을 던지고서, 그는 눈을 감고 그날의 일들을 되짚어 보았다."], ["5", "【(D)】 오늘은 특히 바쁘고 지치는 날이었고, Anderson은 자기가 정말 가르치는 일에 적합한지 의문이 들었다."], ["6", "【(D)】 아이들이 끊임없이 (d)그의 관심을 구해서 그는 스트레스를 받았다."], ["7", "【(D)】 간식 시간에 Emily가 우유팩을 열어 달라고 해서 그는 그렇게 해 주었다."], ["8", "【(D)】 그녀가 마시고 있는 동안 Scott이 우유를 쏟았고, Anderson은 (e)그가 그것을 치우도록 도와주어야 했다."], ["9", "【(D)】 그러고는 Jenny, Andrew, Mark, 그리고…. 아이들은 결코 그치지 않았다."], ["10", "【(D)】 그러나 그는 여전히 그들을 사랑했다. 그것은 또한 그가 그 자리를 위한 면접에서 했던 말이기도 했다."], ["11", "【(B)】 그것(면접)은 3년 전 Anderson이 처음으로 교장 선생님을 만났던 세미나실에서 열렸다."], ["12", "【(B)】 교장 선생님은 왜 어린 아이들과 함께 일하기로 선택했는지 물었다."], ["13", "【(B)】 (b)그는 아이들이 난생처음 제 이름 쓰는 법을 배우도록 돕는 일, 누군가에게 새 친구를 찾아 주는 일, 책 읽는 즐거움을 함께 나누는 일이 좋아서라고 대답했다."], ["14", "【(B)】 그러나 시간이 지나면서 그의 헌신과 열정은 점차 희미해져 가는 것 같았다."], ["15", "【(B)】 그는 면접 때 가졌던 강한 확신을 기억해 냈다."], ["16", "【(C)】 그것이 바로 몇몇 친구들이 그에게 법률가나 사업가가 되라고 설득하려 했음에도 Anderson이 애초에 그 일을 선택한 이유였다."], ["17", "【(C)】 (c)그는 고개를 저으며 눈을 떴다."], ["18", "【(C)】 일어나려 애쓰다가, 그는 무언가 가방에서 떨어지는 것을 보았다."], ["19", "【(C)】 그것은 학생들이 보낸 생일 카드였는데, 온갖 이상한 모양이지만 알록달록한 하트와 휘갈겨 쓴 이름으로 꾸며져 있었다."], ["20", "【(C)】 \"Anderson 선생님께, 생일 축하드려요. 이건 선생님을 위한 저희의 깜짝 선물이에요. 사랑해요!\""], ["21", "【(C)】 Anderson은 미소 짓지 않을 수 없었다. 그는 이미 기분이 훨씬 좋아져 있었다."]], "evh": "D-6번 문장", "ev": [{"en": true, "h": "However, he still loved them. That's also what he had said in the interview for the position."}, {"en": false, "h": "장문 순서는 <b>단락 첫 문장과 마지막 문장만 이어 붙여 보면</b> 대부분 풀린다. (A) 끝에서 그는 <b>눈을 감고 그날의 일을 되짚어 본다</b>. 그러니 그날의 일이 곧바로 나와야 하는데, 그것이 <b>Today was especially busy</b>로 시작하는 (D)다. (D) 끝은 <b>면접에서 했던 말</b>로 마무리되고, (B)는 <b>It was held in a seminar room</b>으로 시작한다. 여기서 <b>It</b>이 가리키는 것은 바로 (D) 끝의 <b>the interview</b>이므로 (D) 다음은 (B)다. (B) 끝의 <b>그는 면접 때의 강한 확신을 기억해 냈다</b>를 (C)의 <b>That's why Anderson took the job in the first place</b>가 <b>That</b>으로 받는다. 게다가 (A)에서 <b>감았던 눈</b>을 (C)에서 <b>opened his eyes</b>로 다시 뜨며 회상이 끝난다. 따라서 <b>(D)-(B)-(C)</b>."}], "opts": [{"n": "①", "t": "(B) - (D) - (C)", "a": false, "x": true, "trap": false, "e": "(B)의 첫 문장 <b>It was held in a seminar room</b>에서 <b>It</b>이 가리킬 대상(<b>면접</b>)이 (A)에는 없다. 대명사가 허공을 가리킨다."}, {"n": "②", "t": "(C) - (B) - (D)", "a": false, "x": true, "trap": false, "e": "(C)의 <b>That's why ~</b>는 앞에 <b>이유가 될 내용</b>이 이미 나와 있어야 한다. (A) 바로 뒤에 놓으면 <b>That</b>이 받을 것이 없다."}, {"n": "③", "t": "(C) - (D) - (B)", "a": false, "x": true, "trap": false, "e": "(C)
