var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제. However(그러나)로 <b>산소가 거의 없음 → 산소가 나타남</b>이 뒤집히고, 바로 뒤에는 <b>this</b>(이런 일)가 그 ‘산소 등장’을 받아야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>However</mark>, after all the available materials … had combined with the free oxygen, <mark>it began to appear in the atmosphere</mark> in sizable quantities.</div><p class=\"ko\"><mark>그러나</mark> 이용 가능한 모든 물질이 … 유리 산소와 결합한 후, 그것(유리 산소)은 대기 중에 상당한 양으로 <mark>모습을 드러내기 시작했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>However(그러나)가 뒤집을 ‘산소가 거의 없음’이 여기 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 · 앞 문장 (④ 바로 앞)</span><div class=\"en\">As long as there was <mark>little or no free oxygen</mark> in the atmosphere … this process would have continued unhindered.</div><p class=\"ko\">대기 중에 <mark>유리 산소가 거의 없거나 전혀 없는</mark> 한 … 이 과정(수소가 빠져나가는 과정)은 방해받지 않고 계속되었을 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>this(이런 일) = 주어진 문장의 ‘산소가 대기에 나타남’</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 뒤 문장 (④ 바로 뒤)</span><div class=\"en\"><mark>As soon as this happened</mark>, the free oxygen would have captured most of the free hydrogen …</div><p class=\"ko\"><mark>이런 일</mark>(유리 산소가 대기 중에 나타난 일)이 일어나자마자, 유리 산소는 대부분의 유리 수소를 붙들어 두었을 것이다 …</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>산소가 거의 없는 한 수소 탈출이 계속됨</span><span><em>주어진 문장</em>그러나 산소가 대기에 나타나기 시작함</span><span><em>6번</em>이런 일이 일어나자 산소가 수소를 붙듦</span></div><div class=\"ck-eq\">⇒ 없음 → 그러나 나타남 → 이런 일, 세 고리가 다 맞는 자리 = ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">5번 문장과 6번 문장 사이<small>6번 this(이런 일)가 가리킬 ‘산소의 등장’이 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">4번 문장과 5번 문장 사이</span><span class=\"why\">4번 끝 ‘수소가 우주로 빠져나간다’ 뒤라 어울려 보여요. 하지만 그러면 5번 ‘산소가 거의 없는 한’이 산소 등장 뒤에 나와 앞뒤가 거꾸로 되고, 6번 this(이런 일)도 받을 대상을 잃어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2번 문장과 3번 문장 사이</span><span class=\"why\">2번은 물 분자가 대기를 순환한다는 설명의 시작이에요. 수소가 빠져나가는 과정도 아직 안 나와서 However(그러나)로 뒤집을 내용이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">3번 문장과 4번 문장 사이</span><span class=\"why\">3번에서 물 분자가 수소와 산소로 나뉘고, 4번 Whereas(~인 반면에)가 무거운 산소와 가벼운 수소로 바로 이어받아요. 그 사이에 끼면 설명이 끊겨요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">6번 문장과 7번 문장 사이</span><span class=\"why\">6번 this(이런 일)가 가리킬 ‘산소 등장’이 6번보다 뒤에 나오게 돼요. 원인보다 결과가 먼저 나오는 꼴이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>, after all the available materials</div><div class=\"k\"><span class=\"cw\">그러나</span> 이용 가능한 모든 물질이</div></div><div class=\"rc\"><div class=\"e\">on the Earth’s surface, mostly iron,</div><div class=\"k\">지구 표면의, 대부분이 철인,</div></div><div class=\"rc\"><div class=\"e\">had combined with the free oxygen,</div><div class=\"k\">유리 산소와 결합한 후,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">it began to appear in the atmosphere</span></div><div class=\"k\"><span class=\"cw\">그것(= 유리 산소)은 대기 중에 모습을 드러내기 시작했다</span></div></div><div class=\"rc\"><div class=\"e\">in sizable quantities.</div><div class=\"k\">상당한 양으로.</div></div><div class=\"rnat\">그러나 대부분이 철인, 지구 표면의 이용 가능한 모든 물질이 유리 산소와 결합한 후, 그것은 대기 중에 상당한 양으로 모습을 드러내기 시작했다.</div><div class=\"rst\">〈주어진 문장〉 <b>그러나</b>(However) 철봉(지문의 철)이 친구들로 꽉 찬 뒤에는, 빈손 친구들이 운동장에 많이 보이기 시작해요. = 산소가 대기에 나타남.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Water molecules circulate through the atmosphere</div><div class=\"k\">물 분자는 대기를 순환한다</div></div><div class=\"rc\"><div class=\"e\">as a result of evaporation.</div><div class=\"k\">증발의 결과로.</div></div><div class=\"rnat\">물 분자는 증발의 결과로 대기를 순환한다.</div><div class=\"rst\">운동장에서 풍선(수소)을 쥔 친구(산소)들이 짝지어 돌아다녀요. = 지문의 물 분자가 대기를 순환한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">As water molecules rise high up in the atmosphere,</div><div class=\"k\">물 분자가 대기 중으로 높이 상승하면,</div></div><div class=\"rc\"><div class=\"e\">they may split up into</div><div class=\"k\">그것들(= 물 분자)은 분해될 수도 있다</div></div><div class=\"rc\"><div class=\"e\">their constituent chemical elements,</div><div class=\"k\">그것들(= 물 분자)을 구성하는 화학 원소로,</div></div><div class=\"rc\"><div class=\"e\">hydrogen and oxygen,</div><div class=\"k\">즉 수소와 산소로,</div></div><div class=\"rc\"><div class=\"e\">under the influence of sunlight.</div><div class=\"k\">햇빛의 영향을 받아.</div></div><div class=\"rnat\">물 분자가 대기 중으로 높이 상승하면, 그것은 햇빛의 영향을 받아 그것을 구성하는 화학 원소인 수소와 산소로 분해될 수도 있다.</div><div class=\"rst\">높이 올라가 햇빛을 받으면 손이 풀려 친구와 풍선이 갈라져요. = 물 분자가 수소와 산소로 나뉜다는 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Whereas the much heavier oxygen</div><div class=\"k\">훨씬 더 무거운 산소가 ~하는 반면에</div></div><div class=\"rc\"><div class=\"e\">either remains in the atmosphere</div><div class=\"k\">대기 중에 남아 있거나</div></div><div class=\"rc\"><div class=\"e\">or is captured on the Earth’s surface,</div><div class=\"k\">지구 표면에 붙들리는,</div></div><div class=\"rc\"><div class=\"e\">the hydrogen tends to escape into space,</div><div class=\"k\">수소는 우주로 빠져나가는 경향이 있다,</div></div><div class=\"rc\"><div class=\"e\">because it is so light</div><div class=\"k\">그것(= 수소)이 너무 가벼워서</div></div><div class=\"rc\"><div class=\"e\">that Earth’s gravity cannot retain it.</div><div class=\"k\">지구 중력이 그것(= 수소)을 붙잡아 둘 수 없기 때문에.</div></div><div class=\"rnat\">훨씬 더 무거운 산소가 대기 중에 남아 있거나 지구 표면에 붙들리는 반면에, 수소는 우주로 빠져나가는 경향이 있는데, 수소가 너무 가벼워서 지구 중력이 그것을 붙잡아 둘 수 없기 때문이다.</div><div class=\"rst\"><b>반면에</b>(Whereas) 무거운 친구는 운동장에 남지만, 가벼운 풍선은 하늘로 날아가 버려요. = 무거운 산소는 남고 가벼운 수소는 우주로 빠져나가요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">As long as there was <span class=\"cw\">little or no free oxygen</span></div><div class=\"k\"><span class=\"cw\">유리 산소가 거의 없거나 전혀 없는 한</span></div></div><div class=\"rc\"><div class=\"e\">in the atmosphere</div><div class=\"k\">대기 중에</div></div><div class=\"rc\"><div class=\"e\">that could capture hydrogen</div><div class=\"k\">수소를 붙들어 둘 수 있는</div></div><div class=\"rc\"><div class=\"e\">before it escaped into the cosmos,</div><div class=\"k\">그것(= 수소)이 우주로 빠져나가기 전에,</div></div><div class=\"rc\"><div class=\"e\">this process would have continued unhindered.</div><div class=\"k\">이 과정(= 수소가 우주로 빠져나가는 과정)은 방해받지 않고 계속되었을 것이다.</div></div><div class=\"rnat\">수소가 우주로 빠져나가기 전에 수소를 붙들어 둘 수 있는 유리 산소가 대기 중에 거의 없거나 전혀 없는 한, 이 과정은 방해받지 않고 계속되었을 것이다.</div><div class=\"rst\">풍선을 잡아 줄 빈손 친구가 <b>거의 없는 한</b>, 풍선은 계속 날아가요. = 유리 산소가 거의 없으면 수소 탈출이 방해 없이 계속돼요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">As soon as this happened,</span></div><div class=\"k\"><span class=\"cw\">이런 일(= 유리 산소가 대기 중에 나타난 일)이 일어나자마자,</span></div></div><div class=\"rc\"><div class=\"e\">the free oxygen would have captured</div><div class=\"k\">유리 산소는 붙들어 두었을 것이다</div></div><div class=\"rc\"><div class=\"e\">most of the free hydrogen</div><div class=\"k\">대부분의 유리 수소를</div></div><div class=\"rc\"><div class=\"e\">by forming water molecules again,</div><div class=\"k\">다시 물 분자를 형성함으로써,</div></div><div class=\"rc\"><div class=\"e\">thus slowing down the loss of hydrogen.</div><div class=\"k\">그 결과 수소 손실을 늦추었을 것이다.</div></div><div class=\"rnat\">이런 일이 일어나자마자 유리 산소는 다시 물 분자를 형성함으로써 대부분의 유리 수소를 붙들어 두어 그 결과 수소 손실을 늦추었을 것이다.</div><div class=\"rst\"><b>이런 일</b>(this)이 생기자, 빈손 친구들이 날아가는 풍선을 다시 꽉 잡아요. = 산소가 수소를 붙들어 다시 물 분자를 만들어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Over the course of time,</div><div class=\"k\">시간이 지남에 따라,</div></div><div class=\"rc\"><div class=\"e\">this process would have helped</div><div class=\"k\">이 과정(= 유리 산소가 수소를 붙들어 물 분자를 만드는 과정)은 도움을 주었을 것이다</div></div><div class=\"rc\"><div class=\"e\">to retain water on Earth,</div><div class=\"k\">지구에 물을 보유하는 데,</div></div><div class=\"rc\"><div class=\"e\">while it also contributed</div><div class=\"k\">동시에 그것(= 이 과정)은 또한 기여했다</div></div><div class=\"rc\"><div class=\"e\">to the emergence of oxygen in the atmosphere.</div><div class=\"k\">대기 중의 산소 발생에.</div></div><div class=\"rnat\">시간이 지남에 따라, 이 과정은 지구에 물을 보유하는 데 도움을 주었을 것이고, 동시에 대기 중의 산소 발생에도 기여했다.</div><div class=\"rst\">시간이 지나 운동장엔 풍선 쥔 친구들(물)이 남고, 빈손 친구들(산소)도 늘어요. = 지구에 물이 남고 대기에 산소가 생겼다는 지문 끝이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"constituent\" data-m=\"구성하는\"><b>constituent</b>구성하는</button><button type=\"button\" class=\"wdb\" data-w=\"whereas\" data-m=\"반면에\"><b>whereas</b>반면에</button><button type=\"button\" class=\"wdb\" data-w=\"retain\" data-m=\"붙잡아 두다, 유지하다\"><b>retain</b>붙잡아 두다, 유지하다</button><button type=\"button\" class=\"wdb\" data-w=\"unhindered\" data-m=\"아무 방해도 받지 않는\"><b>unhindered</b>아무 방해도 받지 않는</button><button type=\"button\" class=\"wdb\" data-w=\"sizable\" data-m=\"상당한 크기의\"><b>sizable</b>상당한 크기의</button><button type=\"button\" class=\"wdb\" data-w=\"emergence\" data-m=\"발생, 출현\"><b>emergence</b>발생, 출현</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>를 찾는 문제. 주어진 글의 <b>happiness</b>(행복) → ‘사람마다 견해가 다르다’ → 그 견해들의 나열 → <b>does not depend</b>(의존하지 않는다)와 <b>depends only</b>(오직 ~에만 의존한다)의 짝 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">Aristotle explains that the Good for human beings consists in eudaimoniā … and most often translated as <mark>“happiness”</mark>).</div><p class=\"ko\">아리스토텔레스는 인간을 위한 ‘선’은 eudaimoniā에 있다고 설명한다 … ‘<mark>행복</mark>’으로 가장 흔히 번역되는 그리스 단어인).</p></div><div class=\"ck-via\"><i>▼</i><span>주어진 글의 happiness(행복)를 ‘더 실질적인 답’으로 받아요</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리</span><div class=\"en\">(C) Whereas he had argued in a purely formal way … he now gives a more substantive answer: that <mark>this universal human goal is happiness</mark>.</div><p class=\"ko\">(C) 그는 순전히 형식적으로 주장했지만 … 이제 <mark>이 보편적인 인간의 목표는 행복이라는</mark> 더 실질적인 답을 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>(C)는 ‘행복이 뭔지 사람마다 다르다’로 끝나요</span></div><div class=\"ck-step\"><span class=\"lab\">(C) 끝 · 8번</span><div class=\"en\">However, he is quick to point out … since <mark>different people have different views</mark> about what happiness is.</div><p class=\"ko\">하지만 그는 재빨리 지적한다 … <mark>사람마다 서로 다른 견해를 갖고 있기</mark> 때문에.</p></div><div class=\"ck-via\"><i>▼</i><span>(C) 끝의 ‘서로 다른 견해’를 실제로 나열해요</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 두 번째 고리</span><div class=\"en\">(B) <mark>Some people say</mark> it is worldly enjoyment <mark>while others say</mark> it is eternal salvation.</div><p class=\"ko\">(B) <mark>어떤 사람들은</mark> 그것이 세속적인 즐거움이라고 말하는 <mark>반면, 다른 사람들은</mark> 그것이 영원한 구원이라고 말한다.</p></div><div class=\"ck-via\"><i>▼</i><span>(B) 끝 6번 does not depend(의존하지 않는다) ↔ depends only(오직 ~에만 의존한다)의 짝</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 세 번째 고리</span><div class=\"en\">(A) It <mark>depends only on</mark> knowledge of human nature and other worldly and social realities.</div><p class=\"ko\">(A) 그것은 오직 인간 본성과 다른 세속적이고 사회적인 현실에 대한 지식에<mark>만 의존한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(C) – (B) – (A)<small>happiness(행복) → 서로 다른 견해 → 아니다(not) / 오직(only) 짝, 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">주어진 글 끝이 ‘행복’이라 (B) it(그것)이 바로 받는 것처럼 보여요. 하지만 (B)의 ‘어떤 사람은 ~, 다른 사람은 ~’은 (C) 끝 ‘사람마다 견해가 다르다’의 예라서 (C) 뒤에 와야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">(A) It(그것)은 ‘아리스토텔레스의 이론’인데, 주어진 글 뒤엔 이론 얘기가 아직 없어요. depends only(오직 ~에만 의존한다)와 짝이 될 ‘의존하지 않는다’도 앞에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">‘사람마다 견해가 다르다’는 말이 나오기도 전에 (B)에서 서로 다른 견해가 나열돼요. (C)가 맨 끝이면 (C) 끝 ‘견해가 다르다’를 이어받을 문단도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C) 끝 ‘사람마다 견해가 다르다’ 뒤에 (A)가 오면 그 견해들의 예(B)가 끊겨요. 또 (A) only(오직)가 (B)의 does not depend(의존하지 않는다)보다 먼저 나와 짝이 뒤집혀요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Aristotle explains</div><div class=\"k\">아리스토텔레스는 설명한다</div></div><div class=\"rc\"><div class=\"e\">that the Good for human beings</div><div class=\"k\">인간을 위한 '선(善)'은</div></div><div class=\"rc\"><div class=\"e\">consists in eudaimoniā</div><div class=\"k\">'eudaimoniā'에 있다고</div></div><div class=\"rc\"><div class=\"e\">(a Greek word combining eu meaning “good”</div><div class=\"k\">('좋은'을 의미하는 'eu'를</div></div><div class=\"rc\"><div class=\"e\">with daimon meaning “spirit,”</div><div class=\"k\">'영혼'을 의미하는 'daimon'과 결합한,</div></div><div class=\"rc ckc\"><div class=\"e\">and most often translated as <span class=\"cw\">“happiness”</span>).</div><div class=\"k\">그리고 <span class=\"cw\">'행복'</span>으로 가장 흔히 번역되는 그리스 단어인).</div></div><div class=\"rnat\">아리스토텔레스는, 인간을 위한 '선(善)'은 ('좋은'을 의미하는 'eu'와 '영혼'을 의미하는 'daimon'과 결합한, '행복'으로 가장 흔히 번역되는 그리스 단어인) 'eudaimoniā'에 있다고 설명한다.</div><div class=\"rst\">도덕 시간, 쌤(아리스토텔레스)이 “사람에게 좋은 것은 그리스 말로 ‘좋은 영혼’, 즉 <b>행복</b>이야.” 하고 말해요. = 지문 주어진 글이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">2번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A) It <span class=\"cw\">depends only on</span> knowledge</div><div class=\"k\">(A) 그것(= 아리스토텔레스의 이론)은 <span class=\"cw\">오직 지식에만 의존한다</span></div></div><div class=\"rc\"><div class=\"e\">of human nature</div><div class=\"k\">인간 본성에 대한</div></div><div class=\"rc\"><div class=\"e\">and other worldly and social realities.</div><div class=\"k\">그리고 다른 세속적이고 사회적인 현실에 대한.</div></div><div class=\"rnat\">그것은 오직 인간 본성과 다른 세속적이고 사회적인 현실에 대한 지식에만 의존한다.</div><div class=\"rst\">(A) <b>오직</b> 사람이 어떤 존재인지, 실제 세상과 사회가 어떤지 아는 것에만 기대요. = 6번 ‘아니다’와 짝인 only(오직)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">For him</div><div class=\"k\">그(= 아리스토텔레스)에게 있어</div></div><div class=\"rc\"><div class=\"e\">it is the study of human nature and worldly existence</div><div class=\"k\">바로 인간 본성과 세속적인 존재에 대한 연구이다</div></div><div class=\"rc\"><div class=\"e\">that will disclose the relevant meaning</div><div class=\"k\">적절한 의미를 밝히는 것은</div></div><div class=\"rc\"><div class=\"e\">of the notion of eudaimoniā.</div><div class=\"k\">'eudaimoniā'라는 개념의.</div></div><div class=\"rnat\">그에게 있어 'eudaimoniā'라는 개념의 적절한 의미를 밝히는 것은 바로 인간 본성과 세속적인 존재에 대한 연구(를 통해서)이다.</div><div class=\"rst\">그래서 쌤에게 행복의 진짜 뜻은 사람과 세상을 직접 공부해야 드러나요. = 지문 (A)의 마지막 3번 문장이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">Some people say</span></div><div class=\"k\">(B) <span class=\"cw\">어떤 사람들은 말한다</span></div></div><div class=\"rc\"><div class=\"e\">it is worldly enjoyment</div><div class=\"k\">그것(= 행복)이 세속적인 즐거움이라고</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">while others say</span></div><div class=\"k\"><span class=\"cw\">반면 다른 사람들은 말한다</span></div></div><div class=\"rc\"><div class=\"e\">it is eternal salvation.</div><div class=\"k\">그것(= 행복)이 영원한 구원이라고.</div></div><div class=\"rnat\">어떤 사람들은 그것이 세속적인 즐거움이라고 말하는 반면, 다른 사람들은 그것이 영원한 구원이라고 말한다.</div><div class=\"rst\">(B) 그 말대로 반 친구들 의견이 갈려요. <b>어떤 친구는</b> 게임·맛집 같은 즐거움, <b>다른 친구는</b> 영원한 구원! = 서로 다른 견해예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Aristotle’s theory will turn out to be “naturalistic”</div><div class=\"k\">아리스토텔레스의 이론은 '자연적'이라고 판명될 것이다</div></div><div class=\"rc\"><div class=\"e\">in that it does not depend</div><div class=\"k\">그것(= 아리스토텔레스의 이론)이 의존하지 않는다는 점에서</div></div><div class=\"rc\"><div class=\"e\">on any theological or metaphysical knowledge.</div><div class=\"k\">어떤 신학적 혹은 형이상학적 지식에.</div></div><div class=\"rnat\">아리스토텔레스의 이론은 어떤 신학적 혹은 형이상학적 지식에 의존하지 않는다는 점에서 '자연적'이라고 판명될 것이다.</div><div class=\"rst\">쌤의 생각은 ‘자연적’ 이론이래요. 신학이나 형이상학 같은 어려운 지식에 기대지 않는다는 뜻이에요. = 지문 5번이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">It <span class=\"cw\">does not depend</span> on knowledge of God</div><div class=\"k\">그것(= 아리스토텔레스의 이론)은 신에 대한 지식에 <span class=\"cw\">의존하지 않는다</span></div></div><div class=\"rc\"><div class=\"e\">or of metaphysical and universal moral norms.</div><div class=\"k\">또는 형이상학적이고 보편적인 도덕 규범에 대한 (지식에).</div></div><div class=\"rnat\">그것은 신에 대한 지식 또는 형이상학적이고 보편적인 도덕 규범에 대한 지식에 의존하지 않는다.</div><div class=\"rst\">신이나 온 세상의 도덕 규칙을 알아야만 풀리는 답이 <b>아니라는</b> 거예요. = 6번 does not depend(의존하지 않는다)예요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(C) Whereas he had argued in a purely formal way</div><div class=\"k\">(C) 그(= 아리스토텔레스)는 순전히 형식적으로 주장했지만</div></div><div class=\"rc\"><div class=\"e\">that the Good was that</div><div class=\"k\">'선'은 ~하는 것이라고</div></div><div class=\"rc\"><div class=\"e\">to which we all aim,</div><div class=\"k\">우리 모두가 목표로 하는,</div></div><div class=\"rc\"><div class=\"e\">he now gives a more substantive answer:</div><div class=\"k\">그는 이제 더 실질적인 답을 한다:</div></div><div class=\"rc ckc\"><div class=\"e\">that <span class=\"cw\">this universal human goal is happiness</span>.</div><div class=\"k\"><span class=\"cw\">이 보편적인 인간의 목표는 행복이라는</span>.</div></div><div class=\"rnat\">그는 '선'은 우리 모두가 목표로 하는 것이라고 순전히 형식적으로 주장했지만, 그는 이제 이 보편적인 인간의 목표는 행복이라는 더 실질적인 답을 한다.</div><div class=\"rst\">(C) 쌤이 “전엔 ‘모두가 바라는 것’이라고만 했지만, 이제 확실히 말할게. 그건 <b>행복</b>이야.” = 더 실질적인 답이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">8번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">However, he is quick to point out</div><div class=\"k\">하지만, 그(= 아리스토텔레스)는 재빨리 지적한다</div></div><div class=\"rc\"><div class=\"e\">that this conclusion is still somewhat formal</div><div class=\"k\">이 결론(= 인간의 목표는 행복이라는 결론)이 여전히 다소 형식적이라고</div></div><div class=\"rc ckc\"><div class=\"e\">since <span class=\"cw\">different people have different views</span></div><div class=\"k\"><span class=\"cw\">사람마다 서로 다른 견해를 갖고 있기 때문에</span></div></div><div class=\"rc\"><div class=\"e\">about what happiness is.</div><div class=\"k\">행복이 무엇인가에 대해.</div></div><div class=\"rnat\">하지만, 사람마다 행복이 무엇인가에 대해 서로 다른 견해를 갖고 있기 때문에 이 결론이 여전히 다소 형식적이라고 그는 재빨리 지적한다.</div><div class=\"rst\"><b>하지만</b>(However) 쌤이 바로 덧붙여요. “행복이 뭔지는 <b>사람마다 생각이 달라서</b> 아직 막연해.” = (C) 끝 8번이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"substantive\" data-m=\"실질적인\"><b>substantive</b>실질적인</button><button type=\"button\" class=\"wdb\" data-w=\"universal\" data-m=\"보편적인\"><b>universal</b>보편적인</button><button type=\"button\" class=\"wdb\" data-w=\"worldly\" data-m=\"세속적인\"><b>worldly</b>세속적인</button><button type=\"button\" class=\"wdb\" data-w=\"eternal\" data-m=\"영원한\"><b>eternal</b>영원한</button><button type=\"button\" class=\"wdb\" data-w=\"salvation\" data-m=\"구원\"><b>salvation</b>구원</button><button type=\"button\" class=\"wdb\" data-w=\"metaphysical\" data-m=\"형이상학적인\"><b>metaphysical</b>형이상학적인</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요약문은 지문 핵심을 <b>말만 바꿔 옮긴 것</b>이에요. (A)는 1번 <b>discount distant outputs</b>(먼 생산물을 평가 절하한다)에서, (B)는 4번 <b>temporal advantage</b>(시간적 이점)에서 찾으세요.</p><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · (A) 단서</span><div class=\"en\">Biological organisms … <mark>discount distant outputs</mark> over <mark>those available at the present time</mark> based on risks associated with an uncertain future.</div><p class=\"ko\">생물학적 유기체들은 … 불확실한 미래와 관련된 위험 때문에 <mark>현재 이용할 수 있는 것들</mark>보다 <mark>(시간상으로) 멀리 있는 생산물들을 평가 절하한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>‘먼 것과 지금 것’의 차이가 에너지에서는 어떻게 나타나는지 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 시간 차이의 예</span><div class=\"en\">For example, the energy output from solar panels or wind power engines, where most investment happens <mark>before they begin producing</mark>, … fossil fuel extraction technologies, where a large proportion of the energy output <mark>comes much sooner</mark></div><p class=\"ko\">태양 전지판·풍력 엔진은 <mark>생산하는 것을 시작하기 전에</mark> 투자가 대부분 일어나지만, 화석 연료는 에너지 생산이 <mark>훨씬 더 빨리 일어나고</mark>, 투입은 추출 과정 동안 적용된다.</p></div><div class=\"ck-via\"><i>▼</i><span>Thus(따라서): 화석 연료가 시간 면에서도 앞선다는 결론</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · (B) 단서</span><div class=\"en\">Thus fossil fuels, … <mark>also have a “temporal advantage”</mark> after accounting for human behavioral preference for current consumption/return.</div><p class=\"ko\">따라서 화석 연료는 … 현재의 소비/수익에 대한 인간의 선호를 생각하면 <mark>'시간적 이점'도 또한 갖는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>지금 것을 좋아함 → (A) immediate(즉각적인), 시간적 이점 → (B) competitive(경쟁력 있는)</span></div><div class=\"ck-step key\"><span class=\"lab\">요약문 (5번) · 짝 맞추기</span><div class=\"en\">Due to the fact that people tend to favor <mark>more immediate outputs</mark>, fossil fuels are <mark>more competitive</mark> than renewable energy alternatives …</div><p class=\"ko\">사람들이 <mark>더 즉각적인 생산물을</mark> 선호하는 경향이 있기 때문에, 화석 연료는 재생 가능 대체 에너지보다 <mark>더 경쟁력이 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">(A) immediate 즉각적인 — (B) competitive 경쟁력 있는<small>1번 ‘지금 것을 더 쳐줌’ → immediate(즉각적인), 4번 temporal advantage(시간적 이점) → competitive(경쟁력 있는)</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(A) delayed 지연된 — (B) competitive 경쟁력 있는</span><span class=\"why\">(B)는 맞지만 (A)가 반대예요. 1번에서 distant outputs(먼 생산물)를 깎아내린다고 했으니, 사람들이 좋아하는 건 delayed(지연된) 것이 아니라 지금 바로 오는 것이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(A) available 이용 가능한 — (B) expensive 값비싼</span><span class=\"why\">(A) available(이용 가능한)은 1번에서 가져와 끌리지만, (B) expensive(값비싼)가 틀려요. 4번은 화석 연료가 cost(비용) 등에서 이점이 있다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(A) convenient 편리한 — (B) expensive 값비싼</span><span class=\"why\">둘 다 어긋나요. 지문은 편리함이 아니라 시간(언제 얻나)을 말하고, (B) expensive(값비싼)도 4번 advantages(이점)와 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(A) abundant 풍부한 — (B) competitive 경쟁력 있는</span><span class=\"why\">(B)는 맞지만 (A)가 틀려요. 지문은 생산물이 얼마나 많은지가 아니라 얼마나 빨리 오는지를 말해요. 3번 comes much sooner(훨씬 더 빨리 일어난다)가 핵심이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Biological organisms,</div><div class=\"k\">생물학적 유기체들은,</div></div><div class=\"rc\"><div class=\"e\">including human societies</div><div class=\"k\">인간 사회를 포함하여</div></div><div class=\"rc\"><div class=\"e\">both with and without market systems,</div><div class=\"k\">시장 체계가 있는 것과 없는 것 둘 다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">discount distant outputs</span></div><div class=\"k\"><span class=\"cw\">(시간상으로) 멀리 있는 생산물들을 평가 절하한다</span></div></div><div class=\"rc\"><div class=\"e\">over those available at the present time</div><div class=\"k\">현재 이용할 수 있는 것들(= 생산물들)보다</div></div><div class=\"rc\"><div class=\"e\">based on risks</div><div class=\"k\">위험에 근거하여</div></div><div class=\"rc\"><div class=\"e\">associated with an uncertain future.</div><div class=\"k\">불확실한 미래와 관련된.</div></div><div class=\"rnat\">시장 체계가 있거나 없는 (두 가지의) 인간 사회를 (모두) 포함하여, 생물학적 유기체들은 불확실한 미래와 관련된 위험에 근거하여 현재 이용할 수 있는 것(생산물)들보다 (시간상으로) 멀리 있는 생산물들을 무시한다(평가 절하한다).</div><div class=\"rst\">사람은 1년 뒤에 받을 간식보다 지금 손에 쥔 간식을 더 쳐줘요. 나중 일은 확실하지 않으니까요. = 지문의 <b>먼 생산물을 평가 절하한다</b>예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">As the timing of inputs and outputs varies greatly</div><div class=\"k\">투입과 생산의 시기가 매우 다르기 때문에</div></div><div class=\"rc\"><div class=\"e\">depending on the type of energy,</div><div class=\"k\">에너지의 유형에 따라,</div></div><div class=\"rc\"><div class=\"e\">there is a strong case</div><div class=\"k\">강력한 근거가 있다</div></div><div class=\"rc\"><div class=\"e\">to incorporate time</div><div class=\"k\">시간을 포함해야 할</div></div><div class=\"rc\"><div class=\"e\">when assessing energy alternatives.</div><div class=\"k\">대체 에너지를 평가할 때.</div></div><div class=\"rnat\">투입과 생산의 시기가 에너지의 유형에 따라 매우 다르기 때문에, 대체 에너지를 평가할 때 시간을 포함해야 할 강력한 근거가 있다.</div><div class=\"rst\">그러니 간식을 고를 때 ‘언제 먹을 수 있나’도 따져야 해요. = 에너지를 평가할 때 시간을 넣어야 한다는 지문 2번이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">For example, the energy output</div><div class=\"k\">예를 들어, 에너지 생산은</div></div><div class=\"rc\"><div class=\"e\">from solar panels or wind power engines,</div><div class=\"k\">태양 전지판이나 풍력 엔진으로부터의,</div></div><div class=\"rc\"><div class=\"e\">where most investment happens</div><div class=\"k\">대부분의 투자가 발생하는</div></div><div class=\"rc\"><div class=\"e\">before they begin producing,</div><div class=\"k\">그것들(= 태양 전지판이나 풍력 엔진)이 생산하는 것을 시작하기 전에,</div></div><div class=\"rc\"><div class=\"e\">may need to be assessed differently</div><div class=\"k\">다르게 평가될 필요가 있을 수 있다</div></div><div class=\"rc\"><div class=\"e\">when compared to most fossil fuel extraction technologies,</div><div class=\"k\">대부분의 화석 연료 추출 기술과 비교했을 때,</div></div><div class=\"rc\"><div class=\"e\">where a large proportion of the energy output</div><div class=\"k\">(그 기술에서는) 많은 비율의 에너지 생산이</div></div><div class=\"rc\"><div class=\"e\">comes much sooner,</div><div class=\"k\">훨씬 더 빨리 일어나고,</div></div><div class=\"rc\"><div class=\"e\">and a larger (relative) proportion of inputs</div><div class=\"k\">더 큰 (상대적) 비율의 투입이</div></div><div class=\"rc\"><div class=\"e\">is applied during the extraction process,</div><div class=\"k\">추출 과정 동안 적용된다,</div></div><div class=\"rc\"><div class=\"e\">and not upfront.</div><div class=\"k\">선행 투자가 아니라.</div></div><div class=\"rnat\">예를 들어, 대부분의 투자가 그것들이 생산하는 것을 시작하기 전에 발생하는 태양 전지판이나 풍력 엔진으로부터의 에너지 생산은, 많은 비율의 에너지 생산이 훨씬 더 빨리 일어나고 더 큰 (상대적) 비율의 투입이 선행 투자가 아니라 추출 과정 동안 적용되는 대부분의 화석 연료 추출 기술과 비교했을 때, 다르게 평가될 필요가 있을 수 있다.</div><div class=\"rst\">텃밭(태양광·풍력)은 씨앗값을 먼저 다 내고 한참 뒤에 먹지만, 매점 간식(화석 연료)은 <b>바로</b> 먹어요. = 지문 3번의 시간 차이예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Thus fossil fuels, particularly oil and natural gas,</div><div class=\"k\">따라서 화석 연료, 특히 석유와 천연가스는</div></div><div class=\"rc\"><div class=\"e\">in addition to having energy quality advantages</div><div class=\"k\">에너지 품질 이점을 가질 뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">(cost, storability, transportability, etc.)</div><div class=\"k\">(비용, 저장성, 운송 가능성 등)</div></div><div class=\"rc\"><div class=\"e\">over many renewable technologies,</div><div class=\"k\">많은 재생 가능 기술들보다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">also have a “temporal advantage”</span></div><div class=\"k\"><span class=\"cw\">'시간적 이점'도 또한 갖는다</span></div></div><div class=\"rc\"><div class=\"e\">after accounting for human behavioral preference</div><div class=\"k\">인간의 행동적 선호를 생각하면</div></div><div class=\"rc\"><div class=\"e\">for current consumption/return.</div><div class=\"k\">현재의 소비/수익에 대한.</div></div><div class=\"rnat\">따라서 화석 연료, 특히 석유와 천연가스는 많은 재생 가능 기술들보다 에너지 품질 이점(비용, 저장성, 운송 가능성 등)을 가질 뿐만 아니라, 현재의 소비/수익에 대한 인간의 행동적 선호를 생각하면(빨리 얻을 수 있는 것을 선호하는 행동 특성을 고려하면) '시간적 이점'도 또한 갖는다.</div><div class=\"rst\"><b>따라서</b>(Thus) 매점 간식은 값·보관 같은 장점에 더해 ‘바로 먹는다’는 <b>시간적 이점</b>까지 있어요. = 화석 연료의 temporal advantage(시간적 이점).</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Due to the fact that people tend to favor</div><div class=\"k\">사람들이 선호하는 경향이 있다는 사실 때문에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">more immediate outputs,</span></div><div class=\"k\"><span class=\"cw\">더 즉각적인 생산물을,</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">fossil fuels are more competitive</span></div><div class=\"k\"><span class=\"cw\">화석 연료는 더 경쟁력이 있다</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">than renewable energy alternatives</div><div class=\"k\">재생 가능 대체 에너지보다</div></div><div class=\"rc\"><div class=\"e\">in regards to the distance between inputs and outputs.</div><div class=\"k\">투입과 생산 간의 (시간적) 거리에 대해서.</div></div><div class=\"rnat\">사람들이 더 즉각적인 생산물을 선호하는 경향이 있다는 사실 때문에, 화석 연료는 투입과 생산 간의 (시간적) 거리에 대해서 재생 가능 대체 에너지보다 더 경쟁력이 있다.</div><div class=\"rst\">정리하면, 다들 <b>바로 먹는 것</b>(immediate 즉각적인)을 좋아하니 매점 간식이 <b>더 잘 팔려요</b>(competitive 경쟁력 있는). = 요약문이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"discount\" data-m=\"평가 절하하다\"><b>discount</b>평가 절하하다</button><button type=\"button\" class=\"wdb\" data-w=\"distant\" data-m=\"먼, 나중의\"><b>distant</b>먼, 나중의</button><button type=\"button\" class=\"wdb\" data-w=\"temporal advantage\" data-m=\"시간적 이점\"><b>temporal advantage</b>시간적 이점</button><button type=\"button\" class=\"wdb\" data-w=\"upfront\" data-m=\"미리, 선불로\"><b>upfront</b>미리, 선불로</button><button type=\"button\" class=\"wdb\" data-w=\"renewable\" data-m=\"재생 가능한\"><b>renewable</b>재생 가능한</button><button type=\"button\" class=\"wdb\" data-w=\"favor\" data-m=\"선호하다\"><b>favor</b>선호하다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 순서는 <b>단락 끝 → 다음 단락 첫 문장</b>을 이어 보세요. (A) 끝 ‘그날 일 되짚기’ → <b>Today</b>(오늘), (D) 끝 ‘면접’ → <b>It</b>(그것), (B) 끝 ‘확신’ → <b>That’s why</b>(그것이 ~한 이유)예요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝 · (A)(4)</span><div class=\"en\">Throwing himself … on the long, comfortable sofa, he closed his eyes and <mark>reviewed the events of the day</mark>.</div><p class=\"ko\">… 그는 눈을 감고 <mark>그날의 일들을 되돌아보았다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>되짚을 ‘그날의 일’ = Today(오늘)의 일</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 첫 번째 고리</span><div class=\"en\">(D) <mark>Today</mark> was especially busy and wearying, and Anderson wondered whether he was really suitable for teaching.</div><p class=\"ko\">(D) <mark>오늘은</mark> 특히 바쁘고 지치는 날이었고, 앤더슨은 자신이 정말 교직에 적합한지 궁금했다.</p></div><div class=\"ck-via\"><i>▼</i><span>(D)는 ‘면접에서 했던 말’로 끝나요</span></div><div class=\"ck-step\"><span class=\"lab\">(D) 끝 · (D)(7)</span><div class=\"en\">That’s also what he had said <mark>in the interview for the position</mark>.</div><p class=\"ko\">그것은 또한 그가 <mark>그 자리(교직)를 위한 면접에서</mark> 말했던 것이기도 했다.</p></div><div class=\"ck-via\"><i>▼</i><span>It(그것) = (D) 끝의 interview(면접)</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 두 번째 고리</span><div class=\"en\">(B) <mark>It was held</mark> in a seminar room where Anderson met the principal for the first time three years ago.</div><p class=\"ko\">(B) <mark>그것(= 면접)은 세미나실에서 열렸다</mark>, 3년 전 앤더슨이 교장 선생님을 처음 만났던 곳에서.</p></div><div class=\"ck-via\"><i>▼</i><span>That(그것) = (B) 끝 (B)(5)의 ‘면접 때의 강한 확신’</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 세 번째 고리</span><div class=\"en\">(C) <mark>That’s why</mark> Anderson took the job in the first place …</div><p class=\"ko\">(C) <mark>그것(= 강한 확신)이</mark> 애초에 앤더슨이 그 직업을 선택한 이유였다 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">(D) – (B) – (C)<small>Today(오늘) → It(그것 = 면접) → That’s why(그것이 ~한 이유), 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(D)는 맞게 왔지만, (D) 끝 면접 얘기 뒤에 (C) That’s why(그것이 ~한 이유)가 오면 That(그것)이 가리킬 ‘강한 확신’이 아직 없어요. (B)의 It(그것 = 면접)도 면접 얘기와 멀어져요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(A) 바로 뒤에 (B) It was held(그것은 열렸다)가 오면 It(그것)이 가리킬 interview(면접)가 앞에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(A) 바로 뒤 (C) That’s why(그것이 ~한 이유)가 받을 ‘확신’이 없어요. 눈을 뜬 뒤에야 그날 일(D)을 되짚게 돼 순서가 거꾸로예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(C)에서 눈을 뜨고 생일 카드로 하루가 마무리됐는데, 다시 (D)로 그날 일을 되짚으면 시간이 거꾸로 가요. (C) That(그것)이 받을 확신도 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A) Peter Anderson was exhausted</div><div class=\"k\">(A) Peter Anderson은 지쳐 있었다</div></div><div class=\"rc\"><div class=\"e\">when he finally opened</div><div class=\"k\">그가 마침내 열었을 때</div></div><div class=\"rc\"><div class=\"e\">the front door of his apartment.</div><div class=\"k\">그(= Peter Anderson)의 아파트 현관문을.</div></div><div class=\"rnat\">(A)(1) Peter Anderson은 마침내 그의 아파트 현관문을 열었을 때 지쳐 있었다.</div><div class=\"rst\">피터 앤더슨 쌤이 녹초가 되어 겨우 아파트 현관문을 열어요. = 지문 (A)의 시작이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">He teaches first graders,</div><div class=\"k\">그(= Anderson)는 1학년 학생들을 가르친다,</div></div><div class=\"rc\"><div class=\"e\">which means</div><div class=\"k\">그런데 그것(= 1학년을 가르친다는 것)은 의미한다</div></div><div class=\"rc\"><div class=\"e\">he lives in a world</div><div class=\"k\">그가 세계에 살고 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">of riddles, birthday cakes, and pointless stories.</div><div class=\"k\">수수께끼, 생일 케이크, 그리고 무의미한 이야기들의.</div></div><div class=\"rnat\">(A)(2) 그는 1학년 학생들을 가르치는데, 그것은 그가 수수께끼, 생일 케이크, 그리고 무의미한 이야기들의 세계에 살고 있다는 것을 의미한다.</div><div class=\"rst\">쌤은 1학년을 가르쳐서, 수수께끼·생일 케이크·끝없는 수다 속에서 살아요. = 지문 (A)(2)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(a) His world is dominated</div><div class=\"k\">(a)그(= Anderson)의 세계는 지배된다</div></div><div class=\"rc\"><div class=\"e\">by 6-year-olds.</div><div class=\"k\">6살 아이들에 의해.</div></div><div class=\"rnat\">(A)(3) (a)그(Anderson)의 세계는 6살 아이들에 의해 지배된다.</div><div class=\"rst\">쌤의 하루는 6살 꼬마들이 다 차지해요. = 지문 (A)(3)이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">(A)(4)번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">Throwing himself with his leather bag</div><div class=\"k\">가죽 가방과 함께 자신(의 몸)을 던지며</div></div><div class=\"rc\"><div class=\"e\">on the long, comfortable sofa,</div><div class=\"k\">길고 편안한 소파에,</div></div><div class=\"rc\"><div class=\"e\">he closed his eyes</div><div class=\"k\">그(= Anderson)는 눈을 감고</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">reviewed the events of the day</span>.</div><div class=\"k\"><span class=\"cw\">그날의 일들을 되돌아보았다</span>.</div></div><div class=\"rnat\">(A)(4) 가죽 가방과 함께 길고 편안한 소파에 자신(의 몸)을 던지며, 그는 눈을 감고 그날의 일들을 되돌아보았다.</div><div class=\"rst\">가방째 소파에 털썩 누워 눈을 감고, <b>오늘 있었던 일</b>을 떠올려요. = (A) 끝, 다음엔 그날 일이 와야 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(D)(1)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc ckc\"><div class=\"e\">(D) <span class=\"cw\">Today</span> was especially busy and wearying,</div><div class=\"k\"><span class=\"cw\">(D) 오늘은</span> 특히 바쁘고 지치는 날이었다,</div></div><div class=\"rc\"><div class=\"e\">and Anderson wondered</div><div class=\"k\">그리고 Anderson은 궁금했다</div></div><div class=\"rc\"><div class=\"e\">whether he was really suitable for teaching.</div><div class=\"k\">그가 진짜로 교직에 적합한지가.</div></div><div class=\"rnat\">(D)(1) 오늘은 특히 바쁘고 지치는 날이었고, Anderson은 그가 진짜로 교직에 적합한지가 궁금했다.</div><div class=\"rst\"><b>오늘</b>(Today)은 유난히 바쁘고 지쳤어요. “내가 정말 선생님감일까?” 하고 고민해요. = (D)가 (A) 바로 뒤예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(D)(2)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">He was stressed</div><div class=\"k\">그(= Anderson)는 스트레스를 받았다</div></div><div class=\"rc\"><div class=\"e\">as kids constantly sought</div><div class=\"k\">아이들이 계속해서 구했기 때문에</div></div><div class=\"rc\"><div class=\"e\">(d) his attention.</div><div class=\"k\">(d)그(= Anderson)의 관심을.</div></div><div class=\"rnat\">(D)(2) 그는 아이들이 계속해서 (d)그(Anderson)의 관심을 구했기 때문에 스트레스를 받았다.</div><div class=\"rst\">아이들이 쉴 새 없이 “쌤, 저 봐요!” 하고 불러서 스트레스를 받았어요. = 지문 (D)(2)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(D)(3)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">At snack time,</div><div class=\"k\">간식 시간에,</div></div><div class=\"rc\"><div class=\"e\">Emily wanted him to open her milk carton,</div><div class=\"k\">Emily는 그(= Anderson)가 그녀(= Emily)의 우유팩을 열어 주기를 원했다,</div></div><div class=\"rc\"><div class=\"e\">so he did.</div><div class=\"k\">그래서 그(= Anderson)는 그렇게 했다.</div></div><div class=\"rnat\">(D)(3) 간식 시간에 Emily는 그가 그녀의 우유팩을 열어 주기를 원했고, 그래서 그는 그렇게 했다.</div><div class=\"rst\">간식 시간, 에밀리가 우유팩을 열어 달래서 쌤이 열어 줬어요. = 지문 (D)(3)이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(D)(4)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">As she was drinking,</div><div class=\"k\">그녀(= Emily)가 (우유를) 마시고 있는 동안,</div></div><div class=\"rc\"><div class=\"e\">Scott spilled his milk</div><div class=\"k\">Scott은 그(= Scott)의 우유를 쏟았다</div></div><div class=\"rc\"><div class=\"e\">and Anderson had to help (e) him</div><div class=\"k\">그리고 Anderson은 (e)그(= Scott)를 도와야 했다</div></div><div class=\"rc\"><div class=\"e\">clean it up.</div><div class=\"k\">그것(= 쏟은 우유)을 치우도록.</div></div><div class=\"rnat\">(D)(4) 그녀(Emily)가 (우유를) 마시고 있는 동안, Scott은 그의 우유를 쏟았고 Anderson은 (e)그(Scott)를 도와 그것을 치워야 했다.</div><div class=\"rst\">에밀리가 마시는 사이 스콧이 우유를 쏟아서, 쌤이 스콧이 닦는 걸 도와줬어요. = 지문 (D)(4)예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(D)(5)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Then Jenny, Andrew, Mark, and....</div><div class=\"k\">그다음은 Jenny, Andrew, Mark, 그리고....</div></div><div class=\"rc\"><div class=\"e\">Kids never ceased.</div><div class=\"k\">아이들은 결코 그치지 않았다.</div></div><div class=\"rnat\">(D)(5) 그다음은 Jenny, Andrew, Mark, 그리고.... 아이들은 결코 그치지 않았다.</div><div class=\"rst\">그다음엔 제니, 앤드루, 마크…. 부탁이 끝도 없었어요. = 지문 (D)(5)예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(D)(6)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">However, he still loved them.</div><div class=\"k\">하지만, 그(= Anderson)는 여전히 그들(= 아이들)을 사랑했다.</div></div><div class=\"rnat\">(D)(6) 하지만, 그는 여전히 그들을 사랑했다.</div><div class=\"rst\"><b>하지만</b>(However) 쌤은 그래도 아이들이 좋아요. = 지문 (D)(6)이에요.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">(D)(7)번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">That’s also what he had said</div><div class=\"k\">그것(= 아이들을 사랑한다는 것)은 또한 그(= Anderson)가 말했던 것이기도 했다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in the interview for the position</span>.</div><div class=\"k\"><span class=\"cw\">그 자리(교직)를 위한 면접에서</span>.</div></div><div class=\"rnat\">(D)(7) 그것은 또한 그 자리(교직)를 위한 면접에서 그가 말했던 것이기도 했다.</div><div class=\"rst\">그건 쌤이 교사 <b>면접</b> 때 했던 말이기도 해요. = (D) 끝, 다음엔 그 면접 얘기가 와야 해요.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">(B)(1)번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">It was held</span> in a seminar room</div><div class=\"k\">(B) <span class=\"cw\">그것(= 면접)은 세미나실에서 열렸다</span></div></div><div class=\"rc\"><div class=\"e\">where Anderson met the principal</div><div class=\"k\">Anderson이 교장 선생님을 만났던</div></div><div class=\"rc\"><div class=\"e\">for the first time three years ago.</div><div class=\"k\">3년 전에 처음으로.</div></div><div class=\"rnat\">(B)(1) 그것(면접)은 3년 전에 Anderson이 처음으로 교장 선생님을 만났던 세미나실에서 열렸다.</div><div class=\"rst\"><b>그 면접</b>(It)은 3년 전 세미나실에서 교장 선생님을 처음 만난 날이었어요. = (B)가 (D) 뒤에 오는 이유예요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(B)(2)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">The principal asked</div><div class=\"k\">교장 선생님은 물어보았다</div></div><div class=\"rc\"><div class=\"e\">why he chose to work with young children.</div><div class=\"k\">왜 그(= Anderson)가 어린 아이들과 함께 일하기를 선택했는지.</div></div><div class=\"rnat\">(B)(2) 교장 선생님은 왜 그가 어린 아이들과 함께 일하기를 선택했는지 물어보았다.</div><div class=\"rst\">교장 선생님이 “왜 어린아이들과 일하고 싶나요?” 하고 물었어요. = 지문 (B)(2)예요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(B)(3)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(b) He answered that he loved</div><div class=\"k\">(b)그(= Anderson)는 아주 좋아한다고 대답했다</div></div><div class=\"rc\"><div class=\"e\">helping children learn to write their names</div><div class=\"k\">아이들이 그들(= 아이들)의 이름 쓰는 것을 배우는 것을 돕는 것을</div></div><div class=\"rc\"><div class=\"e\">for the first time,</div><div class=\"k\">처음으로,</div></div><div class=\"rc\"><div class=\"e\">finding someone a new friend,</div><div class=\"k\">누군가에게 새 친구를 찾아 주는 것을,</div></div><div class=\"rc\"><div class=\"e\">and sharing in the joy of reading.</div><div class=\"k\">그리고 독서의 즐거움을 나누는 것을.</div></div><div class=\"rnat\">(B)(3) (b)그(Anderson)는 아이들이 처음으로 그들의 이름 쓰는 것을 배우는 것을 돕고, 누군가에게 새 친구를 찾아 주고, 독서의 즐거움을 나누는 것을 아주 좋아한다고 대답했다.</div><div class=\"rst\">쌤은 아이가 처음 이름 쓰는 걸 돕고, 새 친구를 찾아 주고, 책 읽는 기쁨을 나누는 게 좋다고 답했어요. = (B)(3)이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">(B)(4)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">But, as time passed,</div><div class=\"k\">그러나 시간이 지나면서,</div></div><div class=\"rc\"><div class=\"e\">his commitment and passion</div><div class=\"k\">그의 헌신과 열정은</div></div><div class=\"rc\"><div class=\"e\">seemed to fade gradually.</div><div class=\"k\">점점 희미해지는 것처럼 보였다.</div></div><div class=\"rnat\">(B)(4) 그러나 시간이 지나면서, 그의 헌신과 열정은 점점 희미해지는 것처럼 보였다.</div><div class=\"rst\">그런데 시간이 지나며 그 열정이 조금씩 식어 가는 것 같았어요. = 지문 (B)(4)예요.</div></div><div class=\"rds key\" data-ord=\"16\"><span class=\"rn\">(B)(5)번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">He recalled his strong conviction</div><div class=\"k\">그(= Anderson)는 그의 강한 확신을 기억해 냈다</div></div><div class=\"rc\"><div class=\"e\">during the interview.</div><div class=\"k\">면접을 보는 동안의.</div></div><div class=\"rnat\">(B)(5) 그는 면접을 보는 동안의 그의 강한 확신을 기억해 냈다.</div><div class=\"rst\">쌤은 면접 때의 <b>강한 확신</b>을 다시 떠올려요. = (B) 끝, 다음엔 이 확신을 받는 말이 와야 해요.</div></div><div class=\"rds key\" data-ord=\"17\"><span class=\"rn\">(C)(1)번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">That’s why</span> Anderson took the job</div><div class=\"k\">(C) <span class=\"cw\">그것(= 강한 확신)이</span> Anderson이 그 직업을 선택한 이유였다</div></div><div class=\"rc\"><div class=\"e\">in the first place</div><div class=\"k\">애초에</div></div><div class=\"rc\"><div class=\"e\">even though some of his friends</div><div class=\"k\">비록 그의 친구들 중 몇몇이</div></div><div class=\"rc\"><div class=\"e\">attempted to persuade him</div><div class=\"k\">그(= Anderson)를 설득하려고 시도했음에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">to be a lawyer or businessman.</div><div class=\"k\">법률가나 사업가가 되라고.</div></div><div class=\"rnat\">(C)(1) 그것(강한 확신)은 비록 그의 친구들 중 몇몇이 그에게 법률가나 사업가가 되라고 설득하려고 시도했음에도 불구하고 그가 애초에 그 직업을 선택한 이유였다.</div><div class=\"rst\"><b>그 확신</b>(That) 덕분에, 친구들이 변호사·사업가를 하라고 말려도 쌤은 교사가 됐어요. = (C)가 (B) 뒤예요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">(C)(2)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">(c) He shook his head</div><div class=\"k\">(c)그(= Anderson)는 고개를 저으며</div></div><div class=\"rc\"><div class=\"e\">and opened his eyes.</div><div class=\"k\">눈을 떴다.</div></div><div class=\"rnat\">(C)(2) (c)그(Anderson)는 고개를 저으며 눈을 떴다.</div><div class=\"rst\">쌤이 고개를 젓고 <b>눈을 떠요</b>. (A)에서 감았던 눈이라 회상이 여기서 끝나요. = 지문 (C)(2)예요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">(C)(3)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">As he struggled to get up,</div><div class=\"k\">그(= Anderson)는 힘들게 일어서려고 애쓰다가,</div></div><div class=\"rc\"><div class=\"e\">he saw something fall from his bag.</div><div class=\"k\">무언가가 그의 가방에서 떨어지는 것을 보았다.</div></div><div class=\"rnat\">(C)(3) 그는 힘들게 일어서려고 애쓰다가, 무언가가 그의 가방에서 떨어지는 것을 보았다.</div><div class=\"rst\">힘겹게 일어나는데 가방에서 뭔가 툭 떨어져요. = 지문 (C)(3)이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">(C)(4)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">It was a birthday card from his students,</div><div class=\"k\">그것(= 가방에서 떨어진 것)은 그의 학생들에게서 온 생일 카드였다,</div></div><div class=\"rc\"><div class=\"e\">decorated with all kinds of odd-shaped but colorful hearts</div><div class=\"k\">온갖 이상한 모양을 했지만 형형색색의 하트로 꾸며져 있었다</div></div><div class=\"rc\"><div class=\"e\">and scribbled names.</div><div class=\"k\">그리고 휘갈겨 쓴 이름들로.</div></div><div class=\"rnat\">(C)(4) 그것은 그의 학생들에게서 온 생일 카드였는데, 온갖 이상한 모양을 했지만 형형색색의 하트와 휘갈겨 쓴 이름들로 꾸며져 있었다.</div><div class=\"rst\">반 아이들이 만든 생일 카드! 삐뚤빼뚤 하트와 휘갈긴 이름이 가득해요. = 지문 (C)(4)예요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">(C)(5)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">“Dear Mr. Anderson, happy birthday to you.</div><div class=\"k\">“사랑하는 Anderson 선생님, 생신 축하드립니다.</div></div><div class=\"rc\"><div class=\"e\">It’s our surprise gift for you.</div><div class=\"k\">이것(= 이 생일 카드)은 선생님을 위한 저희의 깜짝 선물이에요.</div></div><div class=\"rc\"><div class=\"e\">We love you!”</div><div class=\"k\">우리는 선생님을 사랑해요!”</div></div><div class=\"rnat\">(C)(5) \"사랑하는 Anderson 선생님, 생신 축하드립니다. 이것은 선생님을 위한 저희의 깜짝 선물이에요. 우리는 선생님을 사랑해요!\"</div><div class=\"rst\">“앤더슨 쌤, 생신 축하드려요. 깜짝 선물이에요. 사랑해요!” = 지문 (C)(5)의 카드 글이에요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">(C)(6)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Anderson could not help but smile.</div><div class=\"k\">Anderson은 미소를 짓지 않을 수 없었다.</div></div><div class=\"rnat\">(C)(6) Anderson은 미소를 짓지 않을 수 없었다.</div><div class=\"rst\">쌤은 웃음이 절로 나와요. = 지문 (C)(6)이에요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">(C)(7)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">He already felt much better.</div><div class=\"k\">그(= Anderson)는 이미 기분이 훨씬 더 좋아져 있었다.</div></div><div class=\"rnat\">(C)(7) 그는 이미 기분이 훨씬 더 좋아져 있었다.</div><div class=\"rst\">벌써 기분이 훨씬 좋아졌어요. 지친 하루가 따뜻하게 끝나요. = 지문의 마지막 문장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"wearying\" data-m=\"지치게 하는\"><b>wearying</b>지치게 하는</button><button type=\"button\" class=\"wdb\" data-w=\"suitable\" data-m=\"적합한\"><b>suitable</b>적합한</button><button type=\"button\" class=\"wdb\" data-w=\"principal\" data-m=\"교장\"><b>principal</b>교장</button><button type=\"button\" class=\"wdb\" data-w=\"conviction\" data-m=\"확신, 신념\"><b>conviction</b>확신, 신념</button><button type=\"button\" class=\"wdb\" data-w=\"in the first place\" data-m=\"애초에\"><b>in the first place</b>애초에</button><button type=\"button\" class=\"wdb\" data-w=\"persuade\" data-m=\"설득하다\"><b>persuade</b>설득하다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>그 문장 안의 단서</b>로 누구인지 확인하세요. (e)는 help(돕다)의 주어가 이미 <b>Anderson</b>(앤더슨)이라, 도움받는 him(그)은 다른 사람이에요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · (A)(3)</span><div class=\"en\"><mark>(a) His world</mark> is dominated by 6-year-olds.</div><p class=\"ko\"><mark>(a)그(= Anderson)의 세계는</mark> 6살 아이들에 의해 지배된다. → 앤더슨</p></div><div class=\"ck-via\"><i>▼</i><span>아이들이 관심을 원하는 상대 = 선생님</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · (D)(2)</span><div class=\"en\">He was stressed as kids constantly sought <mark>(d) his attention</mark>.</div><p class=\"ko\">아이들이 계속해서 <mark>(d)그(= Anderson)의 관심을</mark> 구했기 때문에 그는 스트레스를 받았다. → 앤더슨</p></div><div class=\"ck-via\"><i>▼</i><span>돕는 사람은 Anderson(앤더슨)으로 따로 나와 있음 → 도움받는 사람은 우유를 쏟은 아이</span></div><div class=\"ck-step key\"><span class=\"lab\">(e) · (D)(4) · 결정적 단서</span><div class=\"en\">As she was drinking, <mark>Scott spilled his milk</mark> and Anderson had to help <mark>(e) him</mark> clean it up.</div><p class=\"ko\">그녀가 마시는 동안 <mark>Scott은 그(= Scott)의 우유를 쏟았다</mark>, 그리고 Anderson은 <mark>(e)그(= Scott)를</mark> 도와 치워야 했다. → 스콧</p></div><div class=\"ck-via\"><i>▼</i><span>교장의 질문에 답한 사람 = 면접 본 선생님</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · (B)(3)</span><div class=\"en\"><mark>(b) He answered</mark> that he loved helping children learn to write their names for the first time …</div><p class=\"ko\"><mark>(b)그(= Anderson)는</mark> 아이들이 처음으로 이름 쓰는 법을 배우도록 돕는 것을 아주 좋아한다고 대답했다 … → 앤더슨</p></div><div class=\"ck-via\"><i>▼</i><span>(A)(4)에서 눈을 감았던 사람이 눈을 뜸</span></div><div class=\"ck-step\"><span class=\"lab\">(c) · (C)(2)</span><div class=\"en\"><mark>(c) He</mark> shook his head and opened his eyes.</div><p class=\"ko\"><mark>(c)그(= Anderson)는</mark> 고개를 저으며 눈을 떴다. → 앤더슨</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(e) him 그 = 스콧(Scott)<small>help(돕다)의 주어가 앤더슨(Anderson)이라, 도움을 받는 him(그)은 우유를 쏟은 스콧이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) his 그의 = 앤더슨</span><span class=\"why\">(d) his(그의)가 kids(아이들)와 같은 문장에 있어서 아이 한 명으로 착각하기 쉬워요. 하지만 아이들이 원하는 건 선생님의 관심이고, 문장 주어 He(그)도 스트레스받은 앤더슨이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) His 그의 = 앤더슨</span><span class=\"why\">(A)(2)에서 1학년을 가르치는 사람이 앤더슨이에요. 6살 아이들이 차지한 세계는 그 선생님의 세계예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) He 그 = 앤더슨</span><span class=\"why\">(B)(2)에서 교장 선생님이 묻고, (b)는 그 질문에 답한 사람이에요. 면접을 본 앤더슨이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) He 그 = 앤더슨</span><span class=\"why\">(A)(4)에서 소파에 누워 눈을 감은 앤더슨이 (C)(2)에서 고개를 젓고 눈을 떠요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><div class=\"rc\"><div class=\"e\">(A) Peter Anderson was exhausted</div><div class=\"k\">(A) Peter Anderson은 지쳐 있었다</div></div><div class=\"rc\"><div class=\"e\">when he finally opened</div><div class=\"k\">그가 마침내 열었을 때</div></div><div class=\"rc\"><div class=\"e\">the front door of his apartment.</div><div class=\"k\">그(= Peter Anderson)의 아파트 현관문을.</div></div><div class=\"rnat\">(A)(1) Peter Anderson은 마침내 그의 아파트 현관문을 열었을 때 지쳐 있었다.</div><div class=\"rst\">피터 앤더슨 쌤이 녹초가 되어 겨우 아파트 현관문을 열어요. = 지문 (A)의 시작이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><div class=\"rc\"><div class=\"e\">He teaches first graders,</div><div class=\"k\">그(= Anderson)는 1학년 학생들을 가르친다,</div></div><div class=\"rc\"><div class=\"e\">which means</div><div class=\"k\">그런데 그것(= 1학년을 가르친다는 것)은 의미한다</div></div><div class=\"rc\"><div class=\"e\">he lives in a world</div><div class=\"k\">그가 세계에 살고 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">of riddles, birthday cakes, and pointless stories.</div><div class=\"k\">수수께끼, 생일 케이크, 그리고 무의미한 이야기들의.</div></div><div class=\"rnat\">(A)(2) 그는 1학년 학생들을 가르치는데, 그것은 그가 수수께끼, 생일 케이크, 그리고 무의미한 이야기들의 세계에 살고 있다는 것을 의미한다.</div><div class=\"rst\">쌤은 1학년을 가르쳐서, 수수께끼·생일 케이크·끝없는 수다 속에서 살아요. = 지문 (A)(2)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><div class=\"rc\"><div class=\"e\">(a) His world is dominated</div><div class=\"k\">(a)그(= Anderson)의 세계는 지배된다</div></div><div class=\"rc\"><div class=\"e\">by 6-year-olds.</div><div class=\"k\">6살 아이들에 의해.</div></div><div class=\"rnat\">(A)(3) (a)그(Anderson)의 세계는 6살 아이들에 의해 지배된다.</div><div class=\"rst\">쌤의 하루는 6살 꼬마들이 다 차지해요. 1학년을 가르치는 사람의 세계라서 <b>(a) His = 앤더슨</b>이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><div class=\"rc\"><div class=\"e\">Throwing himself with his leather bag</div><div class=\"k\">가죽 가방과 함께 자신(의 몸)을 던지며</div></div><div class=\"rc\"><div class=\"e\">on the long, comfortable sofa,</div><div class=\"k\">길고 편안한 소파에,</div></div><div class=\"rc\"><div class=\"e\">he closed his eyes</div><div class=\"k\">그(= Anderson)는 눈을 감고</div></div><div class=\"rc\"><div class=\"e\">and reviewed the events of the day.</div><div class=\"k\">그날의 일들을 되돌아보았다.</div></div><div class=\"rnat\">(A)(4) 가죽 가방과 함께 길고 편안한 소파에 자신(의 몸)을 던지며, 그는 눈을 감고 그날의 일들을 되돌아보았다.</div><div class=\"rst\">가방째 소파에 털썩 누워 눈을 감고, <b>오늘 있었던 일</b>을 떠올려요. = (A) 끝, 다음엔 그날 일이 와야 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(D)(1)번</span><div class=\"rc\"><div class=\"e\">(D) Today was especially busy and wearying,</div><div class=\"k\">(D) 오늘은 특히 바쁘고 지치는 날이었다,</div></div><div class=\"rc\"><div class=\"e\">and Anderson wondered</div><div class=\"k\">그리고 Anderson은 궁금했다</div></div><div class=\"rc\"><div class=\"e\">whether he was really suitable for teaching.</div><div class=\"k\">그가 진짜로 교직에 적합한지가.</div></div><div class=\"rnat\">(D)(1) 오늘은 특히 바쁘고 지치는 날이었고, Anderson은 그가 진짜로 교직에 적합한지가 궁금했다.</div><div class=\"rst\"><b>오늘</b>(Today)은 유난히 바쁘고 지쳤어요. “내가 정말 선생님감일까?” 하고 고민해요. = (D)가 (A) 바로 뒤예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(D)(2)번</span><div class=\"rc\"><div class=\"e\">He was stressed</div><div class=\"k\">그(= Anderson)는 스트레스를 받았다</div></div><div class=\"rc\"><div class=\"e\">as kids constantly sought</div><div class=\"k\">아이들이 계속해서 구했기 때문에</div></div><div class=\"rc\"><div class=\"e\">(d) his attention.</div><div class=\"k\">(d)그(= Anderson)의 관심을.</div></div><div class=\"rnat\">(D)(2) 그는 아이들이 계속해서 (d)그(Anderson)의 관심을 구했기 때문에 스트레스를 받았다.</div><div class=\"rst\">아이들이 쉴 새 없이 쌤을 불러요. 아이들이 관심을 원하는 대상은 쌤이라 <b>(d) his = 앤더슨</b>이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(D)(3)번</span><div class=\"rc\"><div class=\"e\">At snack time,</div><div class=\"k\">간식 시간에,</div></div><div class=\"rc\"><div class=\"e\">Emily wanted him to open her milk carton,</div><div class=\"k\">Emily는 그(= Anderson)가 그녀(= Emily)의 우유팩을 열어 주기를 원했다,</div></div><div class=\"rc\"><div class=\"e\">so he did.</div><div class=\"k\">그래서 그(= Anderson)는 그렇게 했다.</div></div><div class=\"rnat\">(D)(3) 간식 시간에 Emily는 그가 그녀의 우유팩을 열어 주기를 원했고, 그래서 그는 그렇게 했다.</div><div class=\"rst\">에밀리가 우유팩을 열어 달래서 쌤이 열어 줬어요. 여기 him(그)은 앤더슨, her(그녀)는 에밀리예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">(D)(4)번 · 단서</span><div class=\"rc\"><div class=\"e\">As she was drinking,</div><div class=\"k\">그녀(= Emily)가 (우유를) 마시고 있는 동안,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Scott spilled his milk</span></div><div class=\"k\"><span class=\"cw\">Scott은 그(= Scott)의 우유를 쏟았다</span></div></div><div class=\"rc ckc\"><div class=\"e\">and Anderson had to <span class=\"cw\">help (e) him</span></div><div class=\"k\">그리고 Anderson은 <span class=\"cw\">(e)그(= Scott)를</span> 도와야 했다</div></div><div class=\"rc\"><div class=\"e\">clean it up.</div><div class=\"k\">그것(= 쏟은 우유)을 치우도록.</div></div><div class=\"rnat\">(D)(4) 그녀(Emily)가 (우유를) 마시고 있는 동안, Scott은 그의 우유를 쏟았고 Anderson은 (e)그(Scott)를 도와 그것을 치워야 했다.</div><div class=\"rst\">에밀리가 마시는 사이 스콧이 우유를 쏟아요. 도와주는 사람이 앤더슨이니 도움받는 <b>(e) him = 스콧</b>!</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(D)(5)번</span><div class=\"rc\"><div class=\"e\">Then Jenny, Andrew, Mark, and....</div><div class=\"k\">그다음은 Jenny, Andrew, Mark, 그리고....</div></div><div class=\"rc\"><div class=\"e\">Kids never ceased.</div><div class=\"k\">아이들은 결코 그치지 않았다.</div></div><div class=\"rnat\">(D)(5) 그다음은 Jenny, Andrew, Mark, 그리고.... 아이들은 결코 그치지 않았다.</div><div class=\"rst\">그다음엔 제니, 앤드루, 마크…. 부탁이 끝도 없었어요. = 지문 (D)(5)예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(D)(6)번</span><div class=\"rc\"><div class=\"e\">However, he still loved them.</div><div class=\"k\">하지만, 그(= Anderson)는 여전히 그들(= 아이들)을 사랑했다.</div></div><div class=\"rnat\">(D)(6) 하지만, 그는 여전히 그들을 사랑했다.</div><div class=\"rst\"><b>하지만</b>(However) 쌤은 그래도 아이들이 좋아요. = 지문 (D)(6)이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(D)(7)번</span><div class=\"rc\"><div class=\"e\">That’s also what he had said</div><div class=\"k\">그것(= 아이들을 사랑한다는 것)은 또한 그(= Anderson)가 말했던 것이기도 했다</div></div><div class=\"rc\"><div class=\"e\">in the interview for the position.</div><div class=\"k\">그 자리(교직)를 위한 면접에서.</div></div><div class=\"rnat\">(D)(7) 그것은 또한 그 자리(교직)를 위한 면접에서 그가 말했던 것이기도 했다.</div><div class=\"rst\">그건 쌤이 교사 <b>면접</b> 때 했던 말이기도 해요. = (D) 끝, 다음엔 그 면접 얘기가 와야 해요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(B)(1)번</span><div class=\"rc\"><div class=\"e\">(B) It was held in a seminar room</div><div class=\"k\">(B) 그것(= 면접)은 세미나실에서 열렸다</div></div><div class=\"rc\"><div class=\"e\">where Anderson met the principal</div><div class=\"k\">Anderson이 교장 선생님을 만났던</div></div><div class=\"rc\"><div class=\"e\">for the first time three years ago.</div><div class=\"k\">3년 전에 처음으로.</div></div><div class=\"rnat\">(B)(1) 그것(면접)은 3년 전에 Anderson이 처음으로 교장 선생님을 만났던 세미나실에서 열렸다.</div><div class=\"rst\"><b>그 면접</b>(It)은 3년 전 세미나실에서 교장 선생님을 처음 만난 날이었어요. = (B)가 (D) 뒤에 오는 이유예요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(B)(2)번</span><div class=\"rc\"><div class=\"e\">The principal asked</div><div class=\"k\">교장 선생님은 물어보았다</div></div><div class=\"rc\"><div class=\"e\">why he chose to work with young children.</div><div class=\"k\">왜 그(= Anderson)가 어린 아이들과 함께 일하기를 선택했는지.</div></div><div class=\"rnat\">(B)(2) 교장 선생님은 왜 그가 어린 아이들과 함께 일하기를 선택했는지 물어보았다.</div><div class=\"rst\">교장 선생님이 “왜 어린아이들과 일하고 싶나요?” 하고 물었어요. = 지문 (B)(2)예요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(B)(3)번</span><div class=\"rc\"><div class=\"e\">(b) He answered that he loved</div><div class=\"k\">(b)그(= Anderson)는 아주 좋아한다고 대답했다</div></div><div class=\"rc\"><div class=\"e\">helping children learn to write their names</div><div class=\"k\">아이들이 그들(= 아이들)의 이름 쓰는 것을 배우는 것을 돕는 것을</div></div><div class=\"rc\"><div class=\"e\">for the first time,</div><div class=\"k\">처음으로,</div></div><div class=\"rc\"><div class=\"e\">finding someone a new friend,</div><div class=\"k\">누군가에게 새 친구를 찾아 주는 것을,</div></div><div class=\"rc\"><div class=\"e\">and sharing in the joy of reading.</div><div class=\"k\">그리고 독서의 즐거움을 나누는 것을.</div></div><div class=\"rnat\">(B)(3) (b)그(Anderson)는 아이들이 처음으로 그들의 이름 쓰는 것을 배우는 것을 돕고, 누군가에게 새 친구를 찾아 주고, 독서의 즐거움을 나누는 것을 아주 좋아한다고 대답했다.</div><div class=\"rst\">교장 선생님 질문에 답한 사람은 면접 보러 온 쌤이라 <b>(b) He = 앤더슨</b>이에요. 아이들 돕는 게 좋다고 했어요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">(B)(4)번</span><div class=\"rc\"><div class=\"e\">But, as time passed,</div><div class=\"k\">그러나 시간이 지나면서,</div></div><div class=\"rc\"><div class=\"e\">his commitment and passion</div><div class=\"k\">그의 헌신과 열정은</div></div><div class=\"rc\"><div class=\"e\">seemed to fade gradually.</div><div class=\"k\">점점 희미해지는 것처럼 보였다.</div></div><div class=\"rnat\">(B)(4) 그러나 시간이 지나면서, 그의 헌신과 열정은 점점 희미해지는 것처럼 보였다.</div><div class=\"rst\">그런데 시간이 지나며 그 열정이 조금씩 식어 가는 것 같았어요. = 지문 (B)(4)예요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">(B)(5)번</span><div class=\"rc\"><div class=\"e\">He recalled his strong conviction</div><div class=\"k\">그(= Anderson)는 그의 강한 확신을 기억해 냈다</div></div><div class=\"rc\"><div class=\"e\">during the interview.</div><div class=\"k\">면접을 보는 동안의.</div></div><div class=\"rnat\">(B)(5) 그는 면접을 보는 동안의 그의 강한 확신을 기억해 냈다.</div><div class=\"rst\">쌤은 면접 때의 <b>강한 확신</b>을 다시 떠올려요. = (B) 끝, 다음엔 이 확신을 받는 말이 와야 해요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">(C)(1)번</span><div class=\"rc\"><div class=\"e\">(C) That’s why Anderson took the job</div><div class=\"k\">(C) 그것(= 강한 확신)이 Anderson이 그 직업을 선택한 이유였다</div></div><div class=\"rc\"><div class=\"e\">in the first place</div><div class=\"k\">애초에</div></div><div class=\"rc\"><div class=\"e\">even though some of his friends</div><div class=\"k\">비록 그의 친구들 중 몇몇이</div></div><div class=\"rc\"><div class=\"e\">attempted to persuade him</div><div class=\"k\">그(= Anderson)를 설득하려고 시도했음에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">to be a lawyer or businessman.</div><div class=\"k\">법률가나 사업가가 되라고.</div></div><div class=\"rnat\">(C)(1) 그것(강한 확신)은 비록 그의 친구들 중 몇몇이 그에게 법률가나 사업가가 되라고 설득하려고 시도했음에도 불구하고 그가 애초에 그 직업을 선택한 이유였다.</div><div class=\"rst\"><b>그 확신</b>(That) 덕분에, 친구들이 변호사·사업가를 하라고 말려도 쌤은 교사가 됐어요. = (C)가 (B) 뒤예요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">(C)(2)번</span><div class=\"rc\"><div class=\"e\">(c) He shook his head</div><div class=\"k\">(c)그(= Anderson)는 고개를 저으며</div></div><div class=\"rc\"><div class=\"e\">and opened his eyes.</div><div class=\"k\">눈을 떴다.</div></div><div class=\"rnat\">(C)(2) (c)그(Anderson)는 고개를 저으며 눈을 떴다.</div><div class=\"rst\">(A)에서 소파에 누워 눈을 감았던 쌤이 고개를 젓고 눈을 떠요. 그래서 <b>(c) He = 앤더슨</b>이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">(C)(3)번</span><div class=\"rc\"><div class=\"e\">As he struggled to get up,</div><div class=\"k\">그(= Anderson)는 힘들게 일어서려고 애쓰다가,</div></div><div class=\"rc\"><div class=\"e\">he saw something fall from his bag.</div><div class=\"k\">무언가가 그의 가방에서 떨어지는 것을 보았다.</div></div><div class=\"rnat\">(C)(3) 그는 힘들게 일어서려고 애쓰다가, 무언가가 그의 가방에서 떨어지는 것을 보았다.</div><div class=\"rst\">힘겹게 일어나는데 가방에서 뭔가 툭 떨어져요. = 지문 (C)(3)이에요.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">(C)(4)번</span><div class=\"rc\"><div class=\"e\">It was a birthday card from his students,</div><div class=\"k\">그것(= 가방에서 떨어진 것)은 그의 학생들에게서 온 생일 카드였다,</div></div><div class=\"rc\"><div class=\"e\">decorated with all kinds of odd-shaped but colorful hearts</div><div class=\"k\">온갖 이상한 모양을 했지만 형형색색의 하트로 꾸며져 있었다</div></div><div class=\"rc\"><div class=\"e\">and scribbled names.</div><div class=\"k\">그리고 휘갈겨 쓴 이름들로.</div></div><div class=\"rnat\">(C)(4) 그것은 그의 학생들에게서 온 생일 카드였는데, 온갖 이상한 모양을 했지만 형형색색의 하트와 휘갈겨 쓴 이름들로 꾸며져 있었다.</div><div class=\"rst\">반 아이들이 만든 생일 카드! 삐뚤빼뚤 하트와 휘갈긴 이름이 가득해요. = 지문 (C)(4)예요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">(C)(5)번</span><div class=\"rc\"><div class=\"e\">“Dear Mr. Anderson, happy birthday to you.</div><div class=\"k\">“사랑하는 Anderson 선생님, 생신 축하드립니다.</div></div><div class=\"rc\"><div class=\"e\">It’s our surprise gift for you.</div><div class=\"k\">이것(= 이 생일 카드)은 선생님을 위한 저희의 깜짝 선물이에요.</div></div><div class=\"rc\"><div class=\"e\">We love you!”</div><div class=\"k\">우리는 선생님을 사랑해요!”</div></div><div class=\"rnat\">(C)(5) \"사랑하는 Anderson 선생님, 생신 축하드립니다. 이것은 선생님을 위한 저희의 깜짝 선물이에요. 우리는 선생님을 사랑해요!\"</div><div class=\"rst\">“앤더슨 쌤, 생신 축하드려요. 깜짝 선물이에요. 사랑해요!” = 지문 (C)(5)의 카드 글이에요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">(C)(6)번</span><div class=\"rc\"><div class=\"e\">Anderson could not help but smile.</div><div class=\"k\">Anderson은 미소를 짓지 않을 수 없었다.</div></div><div class=\"rnat\">(C)(6) Anderson은 미소를 짓지 않을 수 없었다.</div><div class=\"rst\">쌤은 웃음이 절로 나와요. = 지문 (C)(6)이에요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">(C)(7)번</span><div class=\"rc\"><div class=\"e\">He already felt much better.</div><div class=\"k\">그(= Anderson)는 이미 기분이 훨씬 더 좋아져 있었다.</div></div><div class=\"rnat\">(C)(7) 그는 이미 기분이 훨씬 더 좋아져 있었다.</div><div class=\"rst\">벌써 기분이 훨씬 좋아졌어요. 지친 하루가 따뜻하게 끝나요. = 지문의 마지막 문장이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"dominate\" data-m=\"지배하다\"><b>dominate</b>지배하다</button><button type=\"button\" class=\"wdb\" data-w=\"constantly\" data-m=\"끊임없이\"><b>constantly</b>끊임없이</button><button type=\"button\" class=\"wdb\" data-w=\"carton\" data-m=\"(우유) 팩, 종이 용기\"><b>carton</b>(우유) 팩, 종이 용기</button><button type=\"button\" class=\"wdb\" data-w=\"spill\" data-m=\"쏟다, 흘리다\"><b>spill</b>쏟다, 흘리다</button><button type=\"button\" class=\"wdb\" data-w=\"wearying\" data-m=\"지치게 하는\"><b>wearying</b>지치게 하는</button><button type=\"button\" class=\"wdb\" data-w=\"principal\" data-m=\"교장\"><b>principal</b>교장</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 불일치는 선택지를 <b>지문 순서대로</b> 하나씩 붙여 보세요. ④처럼 <b>보낸 사람</b>(from)만 슬쩍 바꾼 말을 카드 장면과 대조해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ (A)(2)</em>teaches first graders(1학년 학생들을 가르친다) → 같음</span><span><em>⑤ ↔ (D)(3)</em>open her milk carton(그녀의 우유팩을 열다), so he did(그래서 그렇게 했다) → 같음</span><span><em>② ↔ (B)(5)</em>recalled his strong conviction(강한 확신을 기억해 냈다) → 같음</span><span><em>③ ↔ (C)(1)</em>persuade him to be a lawyer or businessman(법률가나 사업가가 되라고 설득하다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ④를 (C)(4)와 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>④의 ‘부모님으로부터’를 카드 장면에서 찾아요</span></div><div class=\"ck-step key\"><span class=\"lab\">(C)(4) · 결정적 단서</span><div class=\"en\">It was a birthday card <mark>from his students</mark>, decorated with all kinds of odd-shaped but colorful hearts and scribbled names.</div><p class=\"ko\">그것은 <mark>그의 학생들에게서 온</mark> 생일 카드였고, 온갖 이상한 모양이지만 형형색색인 하트와 휘갈겨 쓴 이름들로 꾸며져 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>카드 글도 학생들이 선생님께 쓴 말이에요</span></div><div class=\"ck-step\"><span class=\"lab\">(C)(5) · 한 번 더 확인</span><div class=\"en\">“Dear Mr. Anderson, happy birthday to you. <mark>It’s our surprise gift for you.</mark> We love you!”</div><p class=\"ko\">“사랑하는 Anderson 선생님, 생신 축하드립니다. 이것은 <mark>선생님을 위한 저희의 깜짝 선물이에요.</mark> 우리는 선생님을 사랑해요!”</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">가방에서 떨어진 생일 카드는 부모님으로부터 온 것이었다.<small>(C)(4): 카드는 from his students(그의 학생들에게서) 왔어요. 부모님은 지문에 나오지 않아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">간식 시간에 Emily의 우유팩을 열어 주었다.</span><span class=\"why\">(D)(3)에 Emily(에밀리)와 him(그)·he(그)가 섞여 누가 열었는지 헷갈려요. 하지만 열어 달라고 한 건 에밀리, 연 사람은 앤더슨이라 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">1학년 학생들을 가르친다.</span><span class=\"why\">(A)(2) He teaches first graders(그는 1학년 학생들을 가르친다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">인터뷰 때 가졌던 강한 확신을 떠올렸다.</span><span class=\"why\">(B)(5) He recalled his strong conviction during the interview(그는 면접 때의 강한 확신을 기억해 냈다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">친구들로부터 법률가나 사업가가 되라는 권유를 받았다.</span><span class=\"why\">(C)(1) some of his friends attempted to persuade him to be a lawyer or businessman(친구 몇몇이 법률가나 사업가가 되라고 설득하려 했다)과 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><div class=\"rc\"><div class=\"e\">(A) Peter Anderson was exhausted</div><div class=\"k\">(A) Peter Anderson은 지쳐 있었다</div></div><div class=\"rc\"><div class=\"e\">when he finally opened</div><div class=\"k\">그가 마침내 열었을 때</div></div><div class=\"rc\"><div class=\"e\">the front door of his apartment.</div><div class=\"k\">그(= Peter Anderson)의 아파트 현관문을.</div></div><div class=\"rnat\">(A)(1) Peter Anderson은 마침내 그의 아파트 현관문을 열었을 때 지쳐 있었다.</div><div class=\"rst\">피터 앤더슨 쌤이 녹초가 되어 겨우 아파트 현관문을 열어요. = 지문 (A)의 시작이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><div class=\"rc\"><div class=\"e\">He teaches first graders,</div><div class=\"k\">그(= Anderson)는 1학년 학생들을 가르친다,</div></div><div class=\"rc\"><div class=\"e\">which means</div><div class=\"k\">그런데 그것(= 1학년을 가르친다는 것)은 의미한다</div></div><div class=\"rc\"><div class=\"e\">he lives in a world</div><div class=\"k\">그가 세계에 살고 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">of riddles, birthday cakes, and pointless stories.</div><div class=\"k\">수수께끼, 생일 케이크, 그리고 무의미한 이야기들의.</div></div><div class=\"rnat\">(A)(2) 그는 1학년 학생들을 가르치는데, 그것은 그가 수수께끼, 생일 케이크, 그리고 무의미한 이야기들의 세계에 살고 있다는 것을 의미한다.</div><div class=\"rst\">쌤은 1학년을 가르쳐서, 수수께끼·생일 케이크·끝없는 수다 속에서 살아요. = 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><div class=\"rc\"><div class=\"e\">(a) His world is dominated</div><div class=\"k\">(a)그(= Anderson)의 세계는 지배된다</div></div><div class=\"rc\"><div class=\"e\">by 6-year-olds.</div><div class=\"k\">6살 아이들에 의해.</div></div><div class=\"rnat\">(A)(3) (a)그(Anderson)의 세계는 6살 아이들에 의해 지배된다.</div><div class=\"rst\">쌤의 하루는 6살 꼬마들이 다 차지해요. = 지문 (A)(3)이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><div class=\"rc\"><div class=\"e\">Throwing himself with his leather bag</div><div class=\"k\">가죽 가방과 함께 자신(의 몸)을 던지며</div></div><div class=\"rc\"><div class=\"e\">on the long, comfortable sofa,</div><div class=\"k\">길고 편안한 소파에,</div></div><div class=\"rc\"><div class=\"e\">he closed his eyes</div><div class=\"k\">그(= Anderson)는 눈을 감고</div></div><div class=\"rc\"><div class=\"e\">and reviewed the events of the day.</div><div class=\"k\">그날의 일들을 되돌아보았다.</div></div><div class=\"rnat\">(A)(4) 가죽 가방과 함께 길고 편안한 소파에 자신(의 몸)을 던지며, 그는 눈을 감고 그날의 일들을 되돌아보았다.</div><div class=\"rst\">가방째 소파에 털썩 누워 눈을 감고, <b>오늘 있었던 일</b>을 떠올려요. = (A) 끝, 다음엔 그날 일이 와야 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(D)(1)번</span><div class=\"rc\"><div class=\"e\">(D) Today was especially busy and wearying,</div><div class=\"k\">(D) 오늘은 특히 바쁘고 지치는 날이었다,</div></div><div class=\"rc\"><div class=\"e\">and Anderson wondered</div><div class=\"k\">그리고 Anderson은 궁금했다</div></div><div class=\"rc\"><div class=\"e\">whether he was really suitable for teaching.</div><div class=\"k\">그가 진짜로 교직에 적합한지가.</div></div><div class=\"rnat\">(D)(1) 오늘은 특히 바쁘고 지치는 날이었고, Anderson은 그가 진짜로 교직에 적합한지가 궁금했다.</div><div class=\"rst\"><b>오늘</b>(Today)은 유난히 바쁘고 지쳤어요. “내가 정말 선생님감일까?” 하고 고민해요. = (D)가 (A) 바로 뒤예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(D)(2)번</span><div class=\"rc\"><div class=\"e\">He was stressed</div><div class=\"k\">그(= Anderson)는 스트레스를 받았다</div></div><div class=\"rc\"><div class=\"e\">as kids constantly sought</div><div class=\"k\">아이들이 계속해서 구했기 때문에</div></div><div class=\"rc\"><div class=\"e\">(d) his attention.</div><div class=\"k\">(d)그(= Anderson)의 관심을.</div></div><div class=\"rnat\">(D)(2) 그는 아이들이 계속해서 (d)그(Anderson)의 관심을 구했기 때문에 스트레스를 받았다.</div><div class=\"rst\">아이들이 쉴 새 없이 “쌤, 저 봐요!” 하고 불러서 스트레스를 받았어요. = 지문 (D)(2)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(D)(3)번</span><div class=\"rc\"><div class=\"e\">At snack time,</div><div class=\"k\">간식 시간에,</div></div><div class=\"rc\"><div class=\"e\">Emily wanted him to open her milk carton,</div><div class=\"k\">Emily는 그(= Anderson)가 그녀(= Emily)의 우유팩을 열어 주기를 원했다,</div></div><div class=\"rc\"><div class=\"e\">so he did.</div><div class=\"k\">그래서 그(= Anderson)는 그렇게 했다.</div></div><div class=\"rnat\">(D)(3) 간식 시간에 Emily는 그가 그녀의 우유팩을 열어 주기를 원했고, 그래서 그는 그렇게 했다.</div><div class=\"rst\">간식 시간, 에밀리가 우유팩을 열어 달래서 쌤이 열어 줬어요. = 선택지 ⑤와 같아요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(D)(4)번</span><div class=\"rc\"><div class=\"e\">As she was drinking,</div><div class=\"k\">그녀(= Emily)가 (우유를) 마시고 있는 동안,</div></div><div class=\"rc\"><div class=\"e\">Scott spilled his milk</div><div class=\"k\">Scott은 그(= Scott)의 우유를 쏟았다</div></div><div class=\"rc\"><div class=\"e\">and Anderson had to help (e) him</div><div class=\"k\">그리고 Anderson은 (e)그(= Scott)를 도와야 했다</div></div><div class=\"rc\"><div class=\"e\">clean it up.</div><div class=\"k\">그것(= 쏟은 우유)을 치우도록.</div></div><div class=\"rnat\">(D)(4) 그녀(Emily)가 (우유를) 마시고 있는 동안, Scott은 그의 우유를 쏟았고 Anderson은 (e)그(Scott)를 도와 그것을 치워야 했다.</div><div class=\"rst\">에밀리가 마시는 사이 스콧이 우유를 쏟아서, 쌤이 스콧이 닦는 걸 도와줬어요. = 지문 (D)(4)예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(D)(5)번</span><div class=\"rc\"><div class=\"e\">Then Jenny, Andrew, Mark, and....</div><div class=\"k\">그다음은 Jenny, Andrew, Mark, 그리고....</div></div><div class=\"rc\"><div class=\"e\">Kids never ceased.</div><div class=\"k\">아이들은 결코 그치지 않았다.</div></div><div class=\"rnat\">(D)(5) 그다음은 Jenny, Andrew, Mark, 그리고.... 아이들은 결코 그치지 않았다.</div><div class=\"rst\">그다음엔 제니, 앤드루, 마크…. 부탁이 끝도 없었어요. = 지문 (D)(5)예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(D)(6)번</span><div class=\"rc\"><div class=\"e\">However, he still loved them.</div><div class=\"k\">하지만, 그(= Anderson)는 여전히 그들(= 아이들)을 사랑했다.</div></div><div class=\"rnat\">(D)(6) 하지만, 그는 여전히 그들을 사랑했다.</div><div class=\"rst\"><b>하지만</b>(However) 쌤은 그래도 아이들이 좋아요. = 지문 (D)(6)이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(D)(7)번</span><div class=\"rc\"><div class=\"e\">That’s also what he had
