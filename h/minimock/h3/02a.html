function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>명령문</b> Don’t let(~하게 두지 마라)·Always question(언제나 의문을 가져라)과 <b>should</b>(~해야 한다)에 있어요. 남의 말을 <b>사실이면 듣고, 아니면 흘려라</b> → 그 목적은 반복되는 <b>self-belief</b>(자기 신뢰)를 지키는 거예요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 화두</span><div class=\"en\">The challenge is not to let those moments accumulate and <mark>affect your self-belief</mark>.</div><p class=\"ko\">문제는 그 순간들이 축적되어 <mark>당신의 자기 신뢰에 영향을 미치도록</mark> 두지 않는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>2번의 self-belief(자기 신뢰)가 명령문으로 다시 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\"><mark>Don’t let these comments</mark> rock your self-belief.</div><p class=\"ko\">이러한 논평들이 당신의 자기 신뢰를 흔들도록 <mark>두지 마라</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>흔들리지 않는 방법 = 그 말의 이유를 따져 보기</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 어떻게?</span><div class=\"en\"><mark>Always question</mark> the person’s reason for the comment.</div><p class=\"ko\">그 논평에 대한 그 사람의 이유에 <mark>언제나 의문을 가져라</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>should(~해야 한다)로 기준을 딱 정해 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">10번 문장 · 가려 듣기</span><div class=\"en\"><mark>If it is based on fact</mark>, you should listen; if not, then it is only their opinion.</div><p class=\"ko\">그것이 <mark>사실에 근거한다면</mark>, 귀를 기울여야 한다; 그렇지 않다면, 그것은 그저 그들의 견해일 뿐이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">선별적인 의견 수용으로 자기 확신이 흔들리지 않게 하라.<small>10번 가려 듣기 = 선별적 수용, 8번 self-belief(자기 신뢰) 지키기 = 자기 확신이 흔들리지 않게</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">성공하기 위해 도전적인 자세를 가지라.</span><span class=\"why\">[지문에 없음] challenge(도전)라는 단어에 낚이면 안 돼요. 2·3번의 challenge(문제, 어려움)는 의심이 쌓이는 것·남의 말이라는 어려움이라는 뜻이지, 도전적으로 살라는 말이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">인맥이 넓은 사람들과 교제하라.</span><span class=\"why\">[지문에 없음] 4~5번에 나를 믿어 주는 사람이 나오지만, 사람을 많이 사귀라는 말은 없어요. 지문의 핵심은 남의 말을 가려 듣는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">일시적 감정으로 타인을 비판하지 말라.</span><span class=\"why\">[반대] 방향이 거꾸로예요. 7~8번은 내가 남을 비판하는 게 아니라, 남이 나에게 하는 부정적인 말(negative comment)에 흔들리지 말라는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">좌절감을 느낄 때는 성공한 경험을 생각하라.</span><span class=\"why\">[지문에 없음] 성공한 경험을 떠올리라는 말은 한 번도 없어요. 9~10번은 의심이 들 때 남의 말이 사실인지 따져 보라고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Everybody has moments of doubt</div><div class=\"k\">누구든지 의심의 순간을 가진다</div></div><div class=\"rc\"><div class=\"e\">about something or other</div><div class=\"k\">이런저런 무언가에 대한</div></div><div class=\"rc\"><div class=\"e\">from time to time;</div><div class=\"k\">이따금;</div></div><div class=\"rc\"><div class=\"e\">it is a natural process.</div><div class=\"k\">그것(= 의심의 순간을 가지는 것)은 자연스러운 과정이다.</div></div><div class=\"rnat\">누구든지 이따금 무언가에 대한 의심의 순간을 가지는데, 이는 자연스러운 과정이다.</div><div class=\"rst\">그림 대회를 준비하다 보면 “나 잘하고 있나?” 싶은 순간이 와요. 지문도 누구나 이따금 의심(doubt)이 드는 건 자연스럽다고 해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">The challenge is</div><div class=\"k\">문제는 ~이다</div></div><div class=\"rc\"><div class=\"e\">not to let those moments</div><div class=\"k\">그 순간들(= 의심의 순간들)이 ~하도록 두지 않는 것</div></div><div class=\"rc ckc\"><div class=\"e\">accumulate and <span class=\"cw\">affect your self-belief</span>.</div><div class=\"k\">축적되어 <span class=\"cw\">당신의 자기 신뢰에 영향을 미치도록</span>.</div></div><div class=\"rnat\">문제는 그러한 순간들이 축적되어 당신의 자기 신뢰에 영향을 미치게 하도록 두지 않는 것이다.</div><div class=\"rst\">문제는 그 의심이 쌓여 “난 그림 못 그려”가 되는 거예요. 지문은 의심이 쌓여 <b>자기 신뢰</b>(self-belief)를 흔들지 않게 하라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">You will always face the challenge</div><div class=\"k\">당신은 항상 도전에 직면할 것이다</div></div><div class=\"rc\"><div class=\"e\">of other people’s comments and opinion.</div><div class=\"k\">다른 사람들의 논평과 견해라는.</div></div><div class=\"rnat\">당신은 항상 다른 사람들의 논평과 견해라는 도전에 직면할 것이다.</div><div class=\"rst\">그림을 보여 주면 친구들이 꼭 한마디씩 해요. = 지문의 ‘다른 사람들의 논평과 견해라는 도전’이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">There are people</div><div class=\"k\">사람들이 있다</div></div><div class=\"rc\"><div class=\"e\">that you feel good being around</div><div class=\"k\">당신이 곁에 있으면 기분이 좋은</div></div><div class=\"rc\"><div class=\"e\">and others you don’t.</div><div class=\"k\">그리고 그렇지 않은 다른 사람들도.</div></div><div class=\"rnat\">주위에 있어 당신의 기분을 좋게 하는 사람들이 있고 그렇지 않은(함께 있으면 당신의 기분이 좋지 않은) 사람들이 있다.</div><div class=\"rst\">옆에 있으면 기분 좋은 친구도 있고, 괜히 기운 빠지는 친구도 있어요. 지문도 이렇게 두 부류의 사람이 있다고 말해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Some people give you positive energy</div><div class=\"k\">어떤 사람들은 당신에게 긍정적인 에너지를 준다</div></div><div class=\"rc\"><div class=\"e\">because they believe in you.</div><div class=\"k\">그들(= 그 어떤 사람들)이 당신을 믿기 때문에.</div></div><div class=\"rnat\">어떤 사람들은 당신에게 긍정적인 에너지를 주는데 (이는) 그들이 당신을 믿기 때문이다.</div><div class=\"rst\">“넌 할 수 있어!” 하고 믿어 주는 짝꿍은 힘을 줘요. = 지문의 ‘나를 믿어 주니까 긍정적인 에너지를 준다’예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">You feel it</div><div class=\"k\">당신은 그것(= 그들이 당신을 믿어 주는 것)을 느낀다</div></div><div class=\"rc\"><div class=\"e\">and you rise to the occasion.</div><div class=\"k\">그리고 위기 상황에서 능력을 발휘한다.</div></div><div class=\"rnat\">당신은 그것(다른 사람들의 신뢰)을 느끼고 위기 상황에서 능력을 발휘한다.</div><div class=\"rst\">그 믿음이 느껴지면 대회 날 실력이 더 잘 나와요. = 지문의 rise to the occasion(위기 상황에서 능력을 발휘하다)이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">Others may always have</div><div class=\"k\">다른 사람들은 항상 가지고 있을 수도 있다</div></div><div class=\"rc\"><div class=\"e\">a negative comment to make</div><div class=\"k\">할 부정적인 말을</div></div><div class=\"rc\"><div class=\"e\">about what you are doing or talking about.</div><div class=\"k\">당신이 하고 있는 것이나 말하고 있는 것에 대해.</div></div><div class=\"rnat\">다른 사람들은 당신이 하고 있는 것이나 말하고 있는 것에 대해 항상 부정적인 할 말이 있을 수도 있다.</div><div class=\"rst\">반대로 뭘 그려도 “별로네” 하는 친구도 있어요. 지문도 늘 부정적인 말을 하는 사람이 있다고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Don’t let these comments</span></div><div class=\"k\">이러한 논평들이 ~하게 <span class=\"cw\">두지 마라</span></div></div><div class=\"rc\"><div class=\"e\">rock your self-belief.</div><div class=\"k\">당신의 자기 신뢰를 흔들도록.</div></div><div class=\"rnat\">이러한 논평이 당신의 자기 신뢰를 흔들도록 두지 말라.</div><div class=\"rst\"><b>그런 말이 내 자기 신뢰(self-belief)를 흔들게 두지 마세요.</b> 지문 8번의 명령문, 필자의 핵심 주장이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Always question</span></div><div class=\"k\"><span class=\"cw\">언제나 의문을 가져라</span></div></div><div class=\"rc\"><div class=\"e\">the person’s reason for the comment.</div><div class=\"k\">그 논평에 대한 그 사람의 이유에.</div></div><div class=\"rnat\">언제나 그 논평에 대한 그 사람의 이유에 의문을 가지라.</div><div class=\"rst\">대신 “왜 별로라고 했지?” 하고 <b>이유를 따져 봐요</b>. = 지문의 Always question(언제나 의문을 가져라)이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">If it is based on fact,</span></div><div class=\"k\">만약 그것(= 그 부정적인 논평)이 <span class=\"cw\">사실에 근거한다면</span>,</div></div><div class=\"rc\"><div class=\"e\">you should listen;</div><div class=\"k\">당신은 귀를 기울여야 한다;</div></div><div class=\"rc\"><div class=\"e\">if not,</div><div class=\"k\">만약 그렇지 않다면,</div></div><div class=\"rc\"><div class=\"e\">then it is only their opinion.</div><div class=\"k\">그렇다면 그것(= 그 부정적인 논평)은 그저 그들의 견해일 뿐이다.</div></div><div class=\"rnat\">만약 그것(부정적인 논평)이 사실에 근거한다면, 당신은 귀를 기울여야 하지만, 만약 그렇지 않다면(사실에 근거한 것이 아니라면), 그것은 그저 그들의 견해에 불과하다.</div><div class=\"rst\">“색이 번졌어”처럼 <b>사실이면 귀 기울이고</b>, 그냥 싫다는 말이면 그 친구 생각일 뿐이에요. 지문도 사실이면 들으라고 해요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">You will need to</div><div class=\"k\">당신은 ~할 필요가 있을 것이다</div></div><div class=\"rc\"><div class=\"e\">stay strong.</div><div class=\"k\">확고함을 유지할.</div></div><div class=\"rnat\">당신은 확고함을 유지할 필요가 있을 것이다.</div><div class=\"rst\">이렇게 가려 들으면 끝까지 흔들리지 않고 그릴 수 있어요. 지문도 stay strong(확고함을 유지하다)으로 끝맺어요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"accumulate\" data-m=\"축적되다, 쌓이다\"><b>accumulate</b>축적되다, 쌓이다</button><button type=\"button\" class=\"wdb\" data-w=\"self-belief\" data-m=\"자기 신뢰, 자기 확신\"><b>self-belief</b>자기 신뢰, 자기 확신</button><button type=\"button\" class=\"wdb\" data-w=\"rise to the occasion\" data-m=\"위기 상황에서 능력을 발휘하다\"><b>rise to the occasion</b>위기 상황에서 능력을 발휘하다</button><button type=\"button\" class=\"wdb\" data-w=\"rock\" data-m=\"흔들다\"><b>rock</b>흔들다</button><button type=\"button\" class=\"wdb\" data-w=\"question\" data-m=\"의문을 갖다\"><b>question</b>의문을 갖다</button><button type=\"button\" class=\"wdb\" data-w=\"based on\" data-m=\"~에 근거하다\"><b>based on</b>~에 근거하다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">심경 변화는 <b>앞쪽 감정어</b>와 <b>뒤쪽 감정어</b>만 잡으면 돼요. 앞에는 wondering(궁금해하며)이 두 번, 뒤에는 joy and happiness(기쁨과 행복)가 나와요. 전환점은 11번 <b>recognized</b>(알아차렸다)예요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 처음 감정</span><div class=\"en\">Nathan approached her, <mark>wondering</mark> why she was calling him.</div><p class=\"ko\">Nathan은 그녀가 왜 자신을 부르는지 <mark>궁금해하며</mark> 그녀에게 다가갔다.</p></div><div class=\"ck-via\"><i>▼</i><span>대답 없이 그리기만 하니 궁금함이 계속돼요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 처음 감정 한 번 더</span><div class=\"en\">He continued watching her, <mark>wondering</mark> what she was working on.</div><p class=\"ko\">그는 그녀가 무엇을 하고 있는지 <mark>궁금해하면서</mark> 그녀를 계속 보고 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>궁금하던 그림의 정체가 풀리는 순간이에요</span></div><div class=\"ck-step\"><span class=\"lab\">11번 문장 · 전환 지점</span><div class=\"en\">Taking a closer look, Nathan <mark>recognized</mark> that it was his face.</div><p class=\"ko\">자세히 보자, Nathan은 그것이 자기 얼굴이라는 것을 <mark>알아차렸다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>13번 loved(매우 마음에 들어 했다)에 이어 기쁨이 터져요</span></div><div class=\"ck-step key\"><span class=\"lab\">14번 문장 · 나중 감정</span><div class=\"en\"><mark>Filled with joy and happiness</mark>, Nathan gave her a big hug.</div><p class=\"ko\"><mark>기쁨과 행복으로 가득 찬</mark> Nathan은 그녀를 크게 껴안아 주었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">curious → delighted 궁금한 → 아주 기쁜<small>wondering(궁금해하며) → joy and happiness(기쁨과 행복), 양 끝이 딱 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">frustrated → satisfied 좌절한 → 만족한</span><span class=\"why\">뒤 감정 satisfied(만족한)는 그럴듯하지만 앞이 틀려요. 6번에 대답이 없어도 아빠는 답답해하지 않고 7번처럼 계속 궁금해하며 지켜봐요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">sorrowful → relieved 슬픈 → 안도하는</span><span class=\"why\">앞·뒤 둘 다 틀려요. 2번은 슬픔이 아니라 궁금함이고, 14번은 걱정이 풀린 안도가 아니라 기쁨과 행복이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">worried → scared 걱정하는 → 무서워하는</span><span class=\"why\">앞·뒤 둘 다 틀려요. 5번 with interest(관심을 가지고)는 걱정이 아니고, 14번에 무서워하는 말은 전혀 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">hopeful → disappointed 희망찬 → 실망한</span><span class=\"why\">방향이 거꾸로예요. 13~14번에서 그림이 마음에 들어 크게 껴안아 주니, 실망이 아니라 기쁨으로 끝나요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">“Daddy!” Jenny called,</div><div class=\"k\">“아빠!” 하고 Jenny가 불렀다,</div></div><div class=\"rc\"><div class=\"e\">waving a yellow crayon</div><div class=\"k\">노란색 크레용을 흔들면서</div></div><div class=\"rc\"><div class=\"e\">in her little hand.</div><div class=\"k\">그녀의 작은 손에 쥔.</div></div><div class=\"rnat\">“아빠!” Jenny가 그녀의 작은 손에 쥔 노란색 크레용을 흔들면서 불렀다.</div><div class=\"rst\">어린 동생이 노란 크레용을 흔들며 “아빠!” 하고 불러요. 지문도 Jenny(제니)가 크레용을 흔들며 아빠를 부르며 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Nathan approached her,</div><div class=\"k\">Nathan은 그녀(= Jenny)에게 다가갔다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">wondering</span> why she was calling him.</div><div class=\"k\">그녀가 왜 자신을 부르는지 <span class=\"cw\">궁금해하며</span>.</div></div><div class=\"rnat\">Nathan은 그녀가 왜 자신을 부르는지 궁금해하며 그녀에게 다가갔다.</div><div class=\"rst\">아빠는 “왜 부르지?” 하고 <b>궁금해하며</b> 다가가요. = 지문의 wondering(궁금해하며), 처음 감정이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Jenny, his three-year-old toddler,</div><div class=\"k\">그의 세 살배기 아장아장 걷는 아이인 Jenny는,</div></div><div class=\"rc\"><div class=\"e\">was drawing a big circle</div><div class=\"k\">큰 원을 그리고 있었다</div></div><div class=\"rc\"><div class=\"e\">on a piece of paper.</div><div class=\"k\">종이에.</div></div><div class=\"rnat\">그의 세 살배기 아장아장 걷는 아이인 Jenny는 종이에 큰 원을 그리고 있었다.</div><div class=\"rst\">가 보니 세 살 동생이 종이에 큰 동그라미를 그리고 있어요. 지문의 Jenny(제니)도 큰 원을 그리고 있어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">“What are you doing, Sweetie?”</div><div class=\"k\">“뭘 하고 있니, 아가야?”</div></div><div class=\"rnat\">“뭘 하고 있니, 아가야?”</div><div class=\"rst\">아빠가 “뭐 하고 있어?” 하고 다정하게 물어요. 지문의 ‘뭘 하고 있니, 아가야?’예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Nathan asked</div><div class=\"k\">Nathan은 물었다</div></div><div class=\"rc\"><div class=\"e\">with interest.</div><div class=\"k\">관심을 가지고.</div></div><div class=\"rnat\">Nathan은 관심을 가지고 물었다.</div><div class=\"rst\">그 말에는 <b>관심</b>이 가득해요. = 지문의 with interest(관심을 가지고)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">She just kept drawing</div><div class=\"k\">그녀는 그저 계속 그림을 그렸다</div></div><div class=\"rc\"><div class=\"e\">without reply.</div><div class=\"k\">대답 없이.</div></div><div class=\"rnat\">그녀는 대답 없이 계속 그림을 그렸다.</div><div class=\"rst\">동생은 대답도 없이 그리기만 해요. 지문도 대답 없이 계속 그렸다고 해서 궁금함이 더 커져요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">He continued watching her,</div><div class=\"k\">그는 그녀(= Jenny)를 계속 보고 있었다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">wondering</span> what she was working on.</div><div class=\"k\">그녀가 무엇을 하고 있는지 <span class=\"cw\">궁금해하면서</span>.</div></div><div class=\"rnat\">그는 그녀가 무엇을 하고 있는지 궁금해하면서 그녀를 계속 보고 있었다.</div><div class=\"rst\">아빠는 “대체 뭘 그리는 걸까?” 하고 계속 지켜봐요. 지문에 wondering(궁금해하며)이 또 나와요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">She was drawing something</div><div class=\"k\">그녀는 무언가를 그리고 있었다</div></div><div class=\"rc\"><div class=\"e\">that looked like a face.</div><div class=\"k\">얼굴처럼 보이는.</div></div><div class=\"rnat\">그녀는 얼굴처럼 보이는 무언가를 그리고 있었다.</div><div class=\"rst\">가만 보니 얼굴 같은 걸 그리고 있어요. 지문도 얼굴처럼 보이는 무언가라고 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">When she finished it,</div><div class=\"k\">그녀가 그것(= 그 그림)을 끝냈을 때,</div></div><div class=\"rc\"><div class=\"e\">Jenny shouted, “Look, Daddy!”</div><div class=\"k\">Jenny는 “보세요, 아빠!”라고 외쳤다.</div></div><div class=\"rnat\">Jenny가 그것을 끝냈을 때, 그녀는 “보세요, 아빠!”라고 외쳤다.</div><div class=\"rst\">다 그리자 동생이 “아빠, 이거 봐요!” 하고 외쳐요. 지문의 Jenny(제니)도 “보세요, 아빠!” 하고 외쳐요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">She held her artwork up</div><div class=\"k\">그녀는 자기 작품을 들어 올렸다</div></div><div class=\"rc\"><div class=\"e\">proudly.</div><div class=\"k\">자랑스럽게.</div></div><div class=\"rnat\">그녀는 자기 작품을 자랑스럽게 들어올렸다.</div><div class=\"rst\">동생은 자기 그림을 뿌듯하게 번쩍 들어 올려요. = 지문의 proudly(자랑스럽게)예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">Taking a closer look,</div><div class=\"k\">자세히 보자,</div></div><div class=\"rc ckc\"><div class=\"e\">Nathan <span class=\"cw\">recognized</span></div><div class=\"k\">Nathan은 <span class=\"cw\">알아차렸다</span></div></div><div class=\"rc\"><div class=\"e\">that it was his face.</div><div class=\"k\">그것(= 그림 속 얼굴)이 자기 얼굴이라는 것을.</div></div><div class=\"rnat\">자세히 보자 Nathan은 그것이 자기 얼굴임을 알아차렸다.</div><div class=\"rst\">자세히 보니 그건 바로 아빠 얼굴이에요! 지문에서 recognized(알아차렸다)로 궁금함이 풀리는 순간이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">The face had</div><div class=\"k\">그 얼굴에는 있었다</div></div><div class=\"rc\"><div class=\"e\">two big eyes and a beard</div><div class=\"k\">두 개의 큰 눈과 수염이</div></div><div class=\"rc\"><div class=\"e\">just like his.</div><div class=\"k\">꼭 그의 것(= Nathan의 눈과 수염)과 같은.</div></div><div class=\"rnat\">그 얼굴에는 그의 것과 같은 두 개의 큰 눈과 수염이 있었다.</div><div class=\"rst\">큰 눈 두 개에 수염까지 아빠랑 똑같아요. 지문도 그의 것과 꼭 같은 눈과 수염이 있다고 해요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">He loved</div><div class=\"k\">그는 매우 마음에 들어 했다</div></div><div class=\"rc\"><div class=\"e\">Jenny’s work.</div><div class=\"k\">Jenny의 그림을.</div></div><div class=\"rnat\">그는 Jenny의 그림이 마음에 들었다.</div><div class=\"rst\">아빠는 그 그림이 너무 마음에 들어요. = 지문의 loved(매우 마음에 들어 했다)예요.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Filled with joy and happiness,</span></div><div class=\"k\"><span class=\"cw\">기쁨과 행복으로 가득 찬</span>,</div></div><div class=\"rc\"><div class=\"e\">Nathan gave her a big hug.</div><div class=\"k\">Nathan은 그녀(= Jenny)를 크게 껴안아 주었다.</div></div><div class=\"rnat\">기쁨과 행복으로 가득 찬 Nathan은 그녀를 크게 껴안아 주었다.</div><div class=\"rst\">아빠는 <b>기쁘고 행복해서</b> 동생을 꽉 안아 줘요. = 지문의 joy and happiness(기쁨과 행복), 나중 감정이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"approach\" data-m=\"다가가다\"><b>approach</b>다가가다</button><button type=\"button\" class=\"wdb\" data-w=\"toddler\" data-m=\"아장아장 걷는 아이\"><b>toddler</b>아장아장 걷는 아이</button><button type=\"button\" class=\"wdb\" data-w=\"with interest\" data-m=\"관심을 가지고\"><b>with interest</b>관심을 가지고</button><button type=\"button\" class=\"wdb\" data-w=\"proudly\" data-m=\"자랑스럽게\"><b>proudly</b>자랑스럽게</button><button type=\"button\" class=\"wdb\" data-w=\"recognize\" data-m=\"알아차리다\"><b>recognize</b>알아차리다</button><button type=\"button\" class=\"wdb\" data-w=\"filled with\" data-m=\"~로 가득 찬\"><b>filled with</b>~로 가득 찬</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 글 전체를 한 줄로 묶는 말이에요. 2번 <b>reflected the disruption</b>(혼란을 반영했다)이 화두이고, 3~6번은 그 혼란이 그림에 나타난 <b>특징 목록</b>이니 둘을 합친 보기를 고르세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 배경</span><div class=\"en\">… the Renaissance movement had given birth to the Protestant Reformation and <mark>an era of profound religious change</mark>.</div><p class=\"ko\">르네상스 운동은 종교 개혁과 <mark>심오한 종교적 변화의 시대를</mark> 일으켰다.</p></div><div class=\"ck-via\"><i>▼</i><span>그 종교적 변화(this shift)가 예술에 어떻게 나타났는지 말해요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 화두</span><div class=\"en\">The art of this period <mark>reflected the disruption</mark> caused by this shift.</div><p class=\"ko\">이 시기의 예술은 이러한 변화에 의해 야기된 <mark>혼란을 반영했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>이름부터 ‘불규칙한·왜곡된’, 움직임·강한 감정 포착</span><span><em>4번</em>극적 구도·강렬한 명암 대비·자극적 소재</span><span><em>5번</em>종교 인물을 경건하게가 아니라 극적으로</span><span><em>6번</em>시각적 완벽이라는 옛 기준을 버림</span></div><div class=\"ck-eq\">⇒ 네 문장의 공통점 = 혼란이 바로크 그림에 나타난 특징들</div></div><div class=\"ck-via\"><i>▼</i><span>특징들의 이유가 결국 ‘혼란을 담으려고’였다고 다시 못 박아요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 목적 다시 확인</span><div class=\"en\"><mark>In order to capture the social disruption</mark> … many artists abandoned old standards of visual perfection</div><p class=\"ko\"><mark>사회적 혼란을 포착하기 위해</mark> … 많은 예술가들은 시각적인 완벽이라는 오래된 기준을 버렸다</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">characteristics of Baroque paintings caused by religious disruption 종교적 혼란이 낳은 바로크 회화의 특징<small>2번 disruption(혼란) + 3~6번 특징 목록을 한 번에 담았어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">reasons of idealizing religious figures in Baroque paintings 바로크 회화에서 종교적 인물을 이상화한 이유</span><span class=\"why\">[반대] religious figures(종교적 인물)는 5·6번에 나오지만, 바로크는 인물을 이상화하지 않았어요. 경건한 묘사는 이전 전통이고, 6번은 완벽의 기준을 버렸다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">impacts of the Baroque on the development of visual perfectionism 바로크가 시각적 완벽주의의 발전에 끼친 영향</span><span class=\"why\">[반대] 6번은 visual perfection(시각적 완벽)의 옛 기준을 abandoned(버렸다)고 해요. 완벽주의를 발전시킨 게 아니라 버린 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">efforts of Baroque painters to imitate the Renaissance style 르네상스 양식을 모방하려는 바로크 화가들의 노력</span><span class=\"why\">[반대] 6번에서 르네상스 시대로부터 전해진 기준을 버렸어요. 모방이 아니라 벗어난 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">roles of Baroque artists in stabilizing the disrupted society 혼란스러운 사회를 안정시키는 데 있어 바로크 예술가들의 역할</span><span class=\"why\">[반대] 화가들은 혼란을 가라앉힌 게 아니라 2번처럼 반영하고, 4번처럼 혼란의 감정을 stir up(불러일으키다)했어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">By the start of the 16th century,</div><div class=\"k\">16세기 시작 무렵에,</div></div><div class=\"rc\"><div class=\"e\">the Renaissance movement</div><div class=\"k\">르네상스 운동은</div></div><div class=\"rc\"><div class=\"e\">had given birth to</div><div class=\"k\">일으켰다</div></div><div class=\"rc\"><div class=\"e\">the Protestant Reformation</div><div class=\"k\">종교 개혁과</div></div><div class=\"rc\"><div class=\"e\">and an era of profound religious change.</div><div class=\"k\">심오한 종교적 변화의 시대를.</div></div><div class=\"rnat\">16세기 시작 무렵에 르네상스 운동은 종교 개혁과 심오한 종교적 변화의 시대를 일으켰다.</div><div class=\"rst\">새 학기에 담임쌤과 반 규칙이 확 바뀌었다고 해 봐요. = 지문 1번, 르네상스가 종교 개혁이라는 큰 종교적 변화를 일으켰다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">The art of this period</div><div class=\"k\">이 시기의 예술은</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">reflected the disruption</span></div><div class=\"k\"><span class=\"cw\">혼란을 반영했다</span></div></div><div class=\"rc\"><div class=\"e\">caused by this shift.</div><div class=\"k\">이러한 변화(= 종교적 변화)에 의해 야기된.</div></div><div class=\"rnat\">이 시기의 예술은 이러한 변화에 의해 야기된 혼란을 반영했다.</div><div class=\"rst\">그때 미술 시간 그림에도 반의 <b>어수선함</b>이 그대로 묻어나요. 지문 2번이 주제예요. 이 시기 예술은 그 혼란(disruption)을 반영했어요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Appropriately named the Baroque,</div><div class=\"k\">바로크라고 적절하게 이름 붙여진,</div></div><div class=\"rc\"><div class=\"e\">meaning irregular or distorted,</div><div class=\"k\">불규칙적인 혹은 왜곡된 것을 의미하는,</div></div><div class=\"rc\"><div class=\"e\">European painting in the 16th century</div><div class=\"k\">16세기 유럽의 회화는</div></div><div class=\"rc\"><div class=\"e\">largely focused on capturing</div><div class=\"k\">주로 포착하는 데 초점을 두었다</div></div><div class=\"rc\"><div class=\"e\">motion, drama, action, and powerful emotion.</div><div class=\"k\">움직임, 극적임, 행동, 그리고 강력한 감정을.</div></div><div class=\"rnat\">불규칙적인 혹은 왜곡된 것을 의미하는, 바로크라고 적절하게 이름 붙여진, 16세기 유럽의 회화는 움직임, 극적임, 행동, 그리고 강력한 감정을 포착하는 데 주로 초점을 두었다.</div><div class=\"rst\">그래서 반 그림 모음 이름을 ‘삐뚤빼뚤’이라 붙여요. 지문 3번, 바로크(Baroque)도 ‘불규칙한·왜곡된’이란 뜻이고 강한 감정을 담았어요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Painters employed</div><div class=\"k\">화가들은 사용했다</div></div><div class=\"rc\"><div class=\"e\">the strong visual tools</div><div class=\"k\">강력한 시각적 도구들을</div></div><div class=\"rc\"><div class=\"e\">of dramatic composition,</div><div class=\"k\">극적인 구도,</div></div><div class=\"rc\"><div class=\"e\">intense contrast of light and dark,</div><div class=\"k\">강렬한 명암 대비,</div></div><div class=\"rc\"><div class=\"e\">and emotionally provocative subject matter</div><div class=\"k\">그리고 감정적으로 자극하는 소재라는</div></div><div class=\"rc ckc\"><div class=\"e\">to stir up <span class=\"cw\">feelings of disruption</span>.</div><div class=\"k\"><span class=\"cw\">혼란의 감정을</span> 불러일으키기 위해.</div></div><div class=\"rnat\">화가들은 혼란의 감정을 불러일으키기 위해 극적인 구도, 강렬한 명암 대비, 그리고 감정적으로 자극하는 소재의 강력한 시각적 도구들을 사용했다.</div><div class=\"rst\">친구들은 진한 명암과 극적인 구도로 보는 사람 마음을 흔들어요. = 지문 4번, <b>혼란의 감정</b>을 불러일으키려고 강한 도구를 썼어요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Religious subjects were often portrayed</div><div class=\"k\">종교적인 주제들은 종종 묘사되었다</div></div><div class=\"rc\"><div class=\"e\">in this era</div><div class=\"k\">이 시대에</div></div><div class=\"rc\"><div class=\"e\">through new dramatic visual language,</div><div class=\"k\">새로운 극적인 시각적 언어를 통해,</div></div><div class=\"rc\"><div class=\"e\">a contrast to the reverential portrayal</div><div class=\"k\">(이는) 경건한 묘사와의 대조였다</div></div><div class=\"rc\"><div class=\"e\">of religious figures in earlier traditions.</div><div class=\"k\">이전의 전통에서의 종교적 인물들에 대한.</div></div><div class=\"rnat\">종교적인 주제들은 새로운 극적인 시각적 언어를 통해 이 시대에 종종 묘사되었는데, 이는 이전의 전통에서의 종교적 인물들에 대한 경건한 묘사와 대조를 이루었다.</div><div class=\"rst\">예전엔 얌전하게 그리던 인물도 이제 확 극적으로 그려요. 지문 5번도 종교 인물을 경건하게가 아니라 극적으로 그렸다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In order to capture the social disruption</span></div><div class=\"k\"><span class=\"cw\">사회적 혼란을 포착하기 위해</span></div></div><div class=\"rc\"><div class=\"e\">surrounding Christianity and the Roman Catholic Church,</div><div class=\"k\">기독교와 로마 가톨릭 교회를 둘러싼,</div></div><div class=\"rc ckc\"><div class=\"e\">many artists <span class=\"cw\">abandoned</span></div><div class=\"k\">많은 예술가들은 <span class=\"cw\">버렸다</span></div></div><div class=\"rc\"><div class=\"e\">old standards of visual perfection</div><div class=\"k\">시각적인 완벽이라는 오래된 기준을</div></div><div class=\"rc\"><div class=\"e\">from the Classical and Renaissance periods</div><div class=\"k\">고전주의와 르네상스 시대로부터 전해진</div></div><div class=\"rc\"><div class=\"e\">in their portrayal of religious figures.</div><div class=\"k\">그들(= 많은 예술가들)의 종교적 인물들에 대한 묘사에 있어.</div></div><div class=\"rnat\">기독교와 로마 가톨릭 교회를 둘러싼 사회적 혼란을 포착하기 위해 많은 예술가들이 종교적 인물들에 대한 자신들의 묘사에 있어 고전주의와 르네상스 시대로부터 전해진 시각적인 완벽이라는 오래된 기준을 버렸다.</div><div class=\"rst\">‘반듯하고 완벽하게’라는 옛 기준도 버려요. 지문 6번처럼 혼란을 담으려고 완벽의 기준을 <b>버렸어요</b>. 이게 다 혼란이 낳은 특징이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"profound\" data-m=\"심오한, 깊은\"><b>profound</b>심오한, 깊은</button><button type=\"button\" class=\"wdb\" data-w=\"disruption\" data-m=\"혼란, 붕괴\"><b>disruption</b>혼란, 붕괴</button><button type=\"button\" class=\"wdb\" data-w=\"distorted\" data-m=\"왜곡된\"><b>distorted</b>왜곡된</button><button type=\"button\" class=\"wdb\" data-w=\"provocative\" data-m=\"자극적인, 도발적인\"><b>provocative</b>자극적인, 도발적인</button><button type=\"button\" class=\"wdb\" data-w=\"stir up\" data-m=\"(감정을) 불러일으키다\"><b>stir up</b>(감정을) 불러일으키다</button><button type=\"button\" class=\"wdb\" data-w=\"reverential\" data-m=\"경건한\"><b>reverential</b>경건한</button><button type=\"button\" class=\"wdb\" data-w=\"abandon\" data-m=\"버리다, 포기하다\"><b>abandon</b>버리다, 포기하다</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>20%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 ②의 <b>짝꿍</b>을 앞에서 찾으세요. 앞에 비교급 <b>more</b>(더)가 있으면 짝은 as(~만큼)가 아니라 <b>than</b>(~보다)이에요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ②번 자리 (3번)</span><div class=\"en\">… who were generally more concerned with writing about music … <u>② as</u> with providing a technical primer on its practice.</div><p class=\"ko\">기술 입문서를 제공하는 것( ? ) 음악에 관해 글을 쓰는 데 더 관심을 두었다</p></div><div class=\"ck-via\"><i>▼</i><span>밑줄 앞쪽을 거슬러 올라가면 비교급 more(더)가 보여요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 짝꿍 찾기</span><div class=\"en\">who were generally <mark>more concerned</mark> with writing about music</div><p class=\"ko\">그런데 이들은 대개 <mark>더 관심을 두었다</mark> 음악에 관해 글을 쓰는 데</p></div><div class=\"ck-via\"><i>▼</i><span>more(더)의 짝은 than(~보다): with(~에) 뒤 두 내용을 비교해요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\"><mark>than with</mark> providing a technical primer on its practice.</div><p class=\"ko\">그것의 실제에 관한 기술 입문서를 제공하는 <mark>것보다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">비교급 more(더) ~ than(~보다)와 원급 as(~만큼) 구별</p><p class=\"gr\">앞에 more(더) 같은 비교급이 있으면 짝은 than(~보다)이에요. as(~만큼)는 원급끼리 짝지을 때만 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I am more interested in soccer than in baseball.</div><div class=\"ko\">나는 야구보다 축구에 더 관심이 있다. (more의 짝 than이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I am more interested in soccer as in baseball.</div><div class=\"ko\">more(더)가 있는데 짝을 as로 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I am as tall as my brother.</div><div class=\"ko\">나는 형만큼 키가 크다. (as ~ as 원급 짝이라 맞아요)</div></div><p class=\"gb\">지문 3번도 앞에 more concerned(더 관심을 두는)가 있으니, with writing(글을 쓰는 데)과 with providing(제공하는 데)을 잇는 짝은 as(~만큼)가 아니라 than(~보다)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">as → than (~보다)<small>앞에 more concerned(더 관심을 두는)가 있으니 짝은 than(~보다)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">has it survived 그것은 살아남았다</span><span class=\"why\">1번은 there are no examples(예시가 없다) 뒤에 nor(~도 아니다)가 이어져요. 부정어 nor(~도 아니다)가 절 맨 앞에 오면 조동사가 주어 it(그것) 앞으로 나가서 has it survived(그것은 살아남았다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">부정어 nor(~도 아니다) + 조동사 + 주어 (도치)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I don't like milk, nor does my brother.</div><div class=\"ko\">나는 우유를 안 좋아하고, 내 동생도 안 좋아한다. (nor 뒤에 does + 주어 순서라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I don't like milk, nor my brother does.</div><div class=\"ko\">nor(~도 아니다) 뒤인데 주어 my brother(내 동생)를 먼저 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She hasn't finished, nor have I.</div><div class=\"ko\">그녀는 다 끝내지 않았고, 나도 그렇다. (nor 뒤에 have + I 순서라 맞아요)</div></div><p class=\"gb\">지문 1번도 nor(~도 아니다) 뒤라서 주어보다 조동사가 먼저 나온 has it survived(그것은 살아남았다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">consisting ~로 구성된</span><span class=\"why\">4번은 a vocal form(성악 형식) 바로 뒤에 ③이 와서 앞 명사를 꾸며요. consist of(~로 구성되다)는 목적어를 바로 받지 않는 동사라 수동형 consisted(구성된)로는 못 꾸미고, 현재분사 consisting(~로 구성된)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">명사 + 현재분사 consisting of(~로 구성된) (consist는 수동태 불가)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>We have a team consisting of five players.</div><div class=\"ko\">우리는 다섯 명의 선수로 구성된 팀이 있다. (consisting of가 a team을 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>We have a team consisted of five players.</div><div class=\"ko\">consist(구성되다)는 수동형으로 못 쓰니 consisted로 꾸미면 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Our team consists of five players.</div><div class=\"ko\">우리 팀은 다섯 명의 선수로 구성되어 있다. (동사 자리라 consists가 맞아요)</div></div><p class=\"gb\">지문 4번도 a vocal form(성악 형식)을 뒤에서 꾸미는 자리라 consisting of sung verse(노래되는 운문으로 구성된)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">to be ~라고</span><span class=\"why\">5번은 Plato considered music(플라톤은 음악을 여겼다) 뒤에 꾸밈말(수금과 피리만 연주하는 ~)이 길게 끼어 있어요. 그걸 걷어 내면 consider(여기다) + 목적어 music(음악) + to be(~라고)라서 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">consider(여기다) + 목적어 + to be(~라고) + 보어</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I consider him to be honest.</div><div class=\"ko\">나는 그가 정직하다고 여긴다. (consider + him + to be라서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I consider him being honest.</div><div class=\"ko\">consider(여기다)의 목적격 보어 자리에 being을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Mom considers the movie to be too scary.</div><div class=\"ko\">엄마는 그 영화가 너무 무섭다고 여기신다. (목적어 the movie 뒤에 to be라 맞아요)</div></div><p class=\"gb\">지문 5번도 끼어든 말을 빼면 considered music to be(음악을 ~라고 여겼다) 구조라 to be(~라고)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">generally 보통</span><span class=\"why\">6번은 the instruments(그 악기들) + ⑤ + span(걸치다)이에요. 주어와 동사 사이에서 동사 span(걸치다)을 꾸미는 자리라 형용사 general(일반적인)이 아니라 부사 generally(보통)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">동사를 꾸미는 자리 = 형용사가 아니라 부사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The buses generally run on time.</div><div class=\"ko\">버스는 보통 제시간에 다닌다. (부사 generally가 동사 run을 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The buses general run on time.</div><div class=\"ko\">형용사 general(일반적인)은 동사 run(다니다)을 꾸밀 수 없어서 틀려요.</div></div><p class=\"gb\">지문 6번도 동사 span(걸치다) 앞이라 부사 generally(보통)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We don’t know</div><div class=\"k\">우리는 모른다</div></div><div class=\"rc\"><div class=\"e\">what ancient Greek music sounded like,</div><div class=\"k\">고대 그리스 음악이 어떤 소리였는지,</div></div><div class=\"rc\"><div class=\"e\">because there are no examples of it</div><div class=\"k\">왜냐하면 그것(= 고대 그리스 음악)의 예시가 없기 때문에</div></div><div class=\"rc\"><div class=\"e\">in written or notated form,</div><div class=\"k\">기록되거나 악보에 적힌 형태로 된,</div></div><div class=\"rc\"><div class=\"e\">nor has it survived</div><div class=\"k\">그리고 그것(= 고대 그리스 음악)은 살아남지도 못했다</div></div><div class=\"rc\"><div class=\"e\">in oral tradition.</div><div class=\"k\">구전으로.</div></div><div class=\"rnat\">우리는 고대 그리스 음악이 어떤 소리였는지 모르는데, 왜냐하면 그것이 기록되거나 악보에 적힌 형태로 되어 있는 예시가 없고, 구전으로도 살아남지 못했기 때문이다.</div><div class=\"rst\">고대 그리스 음악이 어떤 소리였는지는 아무도 몰라요. 악보도 없고 입으로도 안 전해졌거든요. nor(~도 아니다) 뒤라 순서가 뒤집혔어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Much of it</div><div class=\"k\">그것(= 고대 그리스 음악) 중 다수는</div></div><div class=\"rc\"><div class=\"e\">was probably improvised anyway,</div><div class=\"k\">어쨌든 아마도 즉석 연주되었을 것이다,</div></div><div class=\"rc\"><div class=\"e\">within certain rules and conventions.</div><div class=\"k\">특정 규칙과 관례 내에서.</div></div><div class=\"rnat\">그것 중 다수는 어쨌든 아마도 특정 규칙과 관례 내에서 즉석 연주되었을 것이다.</div><div class=\"rst\">게다가 대부분은 규칙 안에서 즉석으로 연주했을 거예요. 지문 2번은 대부분 규칙과 관례 안에서 즉석 연주(improvised)되었다고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">So we are forced largely to guess at its basis</div><div class=\"k\">그래서 우리는 대체로 그것(= 고대 그리스 음악)의 토대를 추측할 수밖에 없다</div></div><div class=\"rc\"><div class=\"e\">from the accounts of writers</div><div class=\"k\">저자들의 설명에서</div></div><div class=\"rc\"><div class=\"e\">such as Plato and Aristotle,</div><div class=\"k\">플라톤과 아리스토텔레스와 같은,</div></div><div class=\"rc ckc\"><div class=\"e\">who were generally <span class=\"cw\">more concerned</span></div><div class=\"k\">그런데 이들은 대개 <span class=\"cw\">더 관심을 두었다</span></div></div><div class=\"rc\"><div class=\"e\">with writing about music</div><div class=\"k\">음악에 관해 글을 쓰는 데</div></div><div class=\"rc\"><div class=\"e\">as a philosophical and ethical exercise</div><div class=\"k\">철학 및 윤리적 실천으로서의</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">than with</span> providing a technical primer</div><div class=\"k\">기술 입문서를 제공하는 <span class=\"cw\">것보다</span> ※ 문제지엔 as로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">on its practice.</div><div class=\"k\">그것(= 음악)의 실제에 관한.</div></div><div class=\"rnat\">그래서 우리는 대체로 플라톤과 아리스토텔레스와 같은 저자들의 설명에서 그것의 토대를 추측할 수밖에 없는데, 이들은 음악의 실제에 관한 기술 입문서를 제공하기보다는, 철학 및 윤리적 실천으로서의 음악에 관해 글을 쓰는 데 대개 더 관심을 두었다.</div><div class=\"rst\">그래서 플라톤 같은 사람의 글로 짐작할 수밖에 없는데, 그들은 연주법보다 철학에 <b>더</b> 관심이 많았어요. more(더) ~ <b>than</b>(~보다) 짝이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">It seems</div><div class=\"k\">~인 것 같다</div></div><div class=\"rc\"><div class=\"e\">Greek music was predominantly a vocal form,</div><div class=\"k\">그리스 음악은 주로 성악 형식이었다,</div></div><div class=\"rc\"><div class=\"e\">consisting of sung verse</div><div class=\"k\">노래되는 운문으로 구성된</div></div><div class=\"rc\"><div class=\"e\">accompanied by instruments</div><div class=\"k\">악기의 반주에 맞춰</div></div><div class=\"rc\"><div class=\"e\">such as the lyre or the plucked kithara</div><div class=\"k\">수금이나 (현을) 퉁기는 키타라와 같은</div></div><div class=\"rc\"><div class=\"e\">(the root of ‘guitar’).</div><div class=\"k\">(‘기타’의 뿌리).</div></div><div class=\"rnat\">그리스 음악은 주로 성악 형식이었던 듯하며, 수금(竪琴)이나 (현을) 퉁기는 키타라('기타'의 뿌리)와 같은 악기의 반주에 맞춰 노래되는 운문으로 구성되었던 것 같다.</div><div class=\"rst\">그리스 음악은 주로 노래였고 수금 같은 악기가 반주했어요. 지문 4번의 consisting of(~로 구성된)가 앞의 성악 형식을 꾸며요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In fact, Plato considered music</div><div class=\"k\">사실, 플라톤은 음악을 여겼다</div></div><div class=\"rc\"><div class=\"e\">in which the lyre and flute played alone</div><div class=\"k\">수금과 피리만 연주하는</div></div><div class=\"rc\"><div class=\"e\">and not as the accompaniment of dance or song</div><div class=\"k\">그리고 춤이나 노래의 반주로서가 아닌</div></div><div class=\"rc\"><div class=\"e\">to be ‘exceedingly coarse and tasteless’.</div><div class=\"k\">‘아주 조잡하고 품위 없다’고.</div></div><div class=\"rnat\">사실, 플라톤은 춤이나 노래의 반주가 아닌, 수금과 피리만 연주하는 음악을 '아주 조잡하고 품위 없다'고 여겼다.</div><div class=\"rst\">플라톤은 노래 없이 악기만 연주하는 음악을 ‘아주 조잡하다’고 여겼어요. 지문 5번은 consider A to be B(A를 B라고 여기다) 구조예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The melodies seem to have had</div><div class=\"k\">그 선율은 가졌던 것 같다</div></div><div class=\"rc\"><div class=\"e\">a very limited pitch range,</div><div class=\"k\">아주 제한된 음역을,</div></div><div class=\"rc\"><div class=\"e\">since the instruments generally span</div><div class=\"k\">그 악기들은 보통 걸쳐 있기 때문이다</div></div><div class=\"rc\"><div class=\"e\">only an octave,</div><div class=\"k\">겨우 한 옥타브에만,</div></div><div class=\"rc\"><div class=\"e\">from one E (as we’d now define it) to the next.</div><div class=\"k\">(우리가 현재 정의하는 식으로 보면) 한 E부터 다음 E까지.</div></div><div class=\"rnat\">그 선율은 음역이 아주 제한되어 있었던 것 같은데, 그 악기들은 보통 겨우 한 옥타브, 즉 (우리가 현재 정의하는 식으로 보면) 한 E부터 다음 E까지만 걸쳐 있기 때문이다.</div><div class=\"rst\">악기가 보통 한 옥타브만 걸쳐서 선율의 음역이 좁았어요. 지문 6번의 부사 generally(보통)가 동사 span(걸치다)을 꾸며요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"notated\" data-m=\"악보에 적힌\"><b>notated</b>악보에 적힌</button><button type=\"button\" class=\"wdb\" data-w=\"oral tradition\" data-m=\"구전\"><b>oral tradition</b>구전</button><button type=\"button\" class=\"wdb\" data-w=\"improvised\" data-m=\"즉석 연주된\"><b>improvised</b>즉석 연주된</button><button type=\"button\" class=\"wdb\" data-w=\"guess at\" data-m=\"~을 추측하다\"><b>guess at</b>~을 추측하다</button><button type=\"button\" class=\"wdb\" data-w=\"primer\" data-m=\"입문서\"><b>primer</b>입문서</button><button type=\"button\" class=\"wdb\" data-w=\"predominantly\" data-m=\"주로\"><b>predominantly</b>주로</button><button type=\"button\" class=\"wdb\" data-w=\"coarse\" data-m=\"조잡한\"><b>coarse</b>조잡한</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">3번 <b>In contrast</b>(대조적으로)에서 집단주의 → 개인주의로 방향이 뒤집혀요. 개인주의는 남과 다른 것을 <b>좋게 보는 쪽</b>이니, 그 방향과 어긋나는 부정어를 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">3번 · 방향 전환</span><div class=\"en\"><mark>In contrast</mark>, members of individualist cultures tend to define themselves in terms of their independence from groups and autonomy</div><p class=\"ko\"><mark>대조적으로</mark>, 개인주의 문화의 구성원들은 집단으로부터의 독립과 자율성 면에서 자기 자신을 규정하는 경향이 있다</p></div><div class=\"ck-via\"><i>▼</i><span>개인주의가 무엇을 좋게 보는지 정해 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 · 개인주의의 방향</span><div class=\"en\">and are socialized to <mark>value</mark> individual freedoms and individual expressions.</div><p class=\"ko\">그리고 개인의 자유와 개인의 표현을 <mark>중시하도록</mark> 사회화되어 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>개인의 표현을 중시하는데, 튀는 게 약함? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (4번)</span><div class=\"en\">In individualist cultures, standing out and being different is often seen as a sign of <u>③ weakness</u>.</div><p class=\"ko\">개인주의 문화에서, 돋보이는 것과 다른 것은 종종 ( 약함? )의 표시로 여겨진다 → 용기가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>연구 결과로 못 박기: 개인주의는 남다른 모습을 더 받아 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 · 결정적 단서</span><div class=\"en\">individualist group norms <mark>broaden the latitude</mark> of acceptable group member behavior and non-normative characteristics.</div><p class=\"ko\">개인주의 집단 규범이 집단 구성원의 용인 가능한 행동과 비표준적 특징의 <mark>허용 범위를 넓혀 준다는 것을</mark></p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">weakness(약함) ↔ courage(용기)</p><p class=\"gr\">앞에서 어떤 것을 중시한다고 했으면, 그걸 하는 모습은 긍정어로 평가돼야 해요. 남다름을 중시하는데 튀는 걸 weakness(약함)라고 하면 방향이 거꾸로예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Our class values new ideas, so speaking up is seen as courage.</div><div class=\"ko\">우리 반은 새로운 생각을 중시해서, 의견을 말하는 건 용기로 여겨져요. (중시 → 긍정어)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Our class values new ideas, so speaking up is seen as weakness.</div><div class=\"ko\">새 생각을 중시하는데 의견 말하기가 약함이다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Our team hates fights, so we avoid conflict.</div><div class=\"ko\">우리 팀은 싸움을 싫어해서 갈등을 피해요. (싫어함 → 피함, 방향이 같아요)</div></div><p class=\"gb\">지문 3번에서 개인주의는 개인의 표현을 value(중시하다)하고 6번은 허용 범위를 넓힌다고 하니, 4번은 weakness(약함)가 아니라 courage(용기)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">weakness → courage (용기)<small>남다름을 중시하는 개인주의에서 튀는 건 약함이 아니라 용기의 표시예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">downgraded 평가 절하되다</span><span class=\"why\">부정어라 틀린 것처럼 보이지만 맞아요. 1~2번처럼 화합을 중시하고 튀지 않게 키우는 집단주의에서는 일탈이 더 downgraded(평가 절하되다)되는 게 자연스러워요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">empathize 공감하다</span><span class=\"why\">2번은 집단주의 이야기예요. 1번에서 관계와 화합을 중시한다고 했으니 갈등을 피하고 타인에 empathize(공감하다)하도록 키우는 게 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">value 중시하다</span><span class=\"why\">3번 In contrast(대조적으로) 뒤 개인주의는 독립과 자율성으로 자신을 규정해요. 그러니 개인의 자유와 표현을 value(중시하다)하는 게 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">acceptable 용인 가능한</span><span class=\"why\">6번은 개인주의 규범이 허용 범위를 broaden(넓히다)한다고 해요. 넓어지는 건 받아들여지는 행동의 범위니 acceptable(용인 가능한)이 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In collectivist groups,</div><div class=\"k\">집단주의 집단에서는,</div></div><div class=\"rc\"><div class=\"e\">there is considerable emphasis on relationships,</div><div class=\"k\">관계에 큰 주안점이 있다,</div></div><div class=\"rc\"><div class=\"e\">the maintenance of harmony,</div><div class=\"k\">화합의 유지,</div></div><div class=\"rc\"><div class=\"e\">and “sticking with” the group.</div><div class=\"k\">그리고 집단과 ‘함께하는 것’에.</div></div><div class=\"rnat\">집단주의 집단에서는, 관계, 화합의 유지, 그리고 집단과 '함께하는 것'에 큰 주안점을 둔다.</div><div class=\"rst\">1반은 ‘다 같이’가 제일 중요한 반이에요. 지문 1번, 집단주의 집단은 관계와 화합, 집단과 함께하기를 중시해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Members of collectivist groups are socialized</div><div class=\"k\">집단주의 집단의 구성원들은 사회화되어 있다</div></div><div class=\"rc\"><div class=\"e\">to avoid conflict,</div><div class=\"k\">갈등을 피하도록,</div></div><div class=\"rc\"><div class=\"e\">to empathize with others,</div><div class=\"k\">타인에 공감하도록,</div></div><div class=\"rc\"><div class=\"e\">and to avoid drawing attention to themselves.</div><div class=\"k\">그리고 자기 자신에게로 관심을 끄는 것을 피하도록.</div></div><div class=\"rnat\">집단주의 집단의 구성원들은 갈등을 피하고, 타인에 공감하며, 자기 자신에게로 관심을 끄는 것을 피하도록 사회화되어 있다.</div><div class=\"rst\">그래서 1반 아이들은 다투지 않고 친구 마음에 <b>공감하며</b> 혼자 튀지 않아요. = 지문 2번의 empathize with(~에 공감하다)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In contrast,</span></div><div class=\"k\"><span class=\"cw\">대조적으로,</span></div></div><div class=\"rc\"><div class=\"e\">members of individualist cultures</div><div class=\"k\">개인주의 문화의 구성원들은</div></div><div class=\"rc\"><div class=\"e\">tend to define themselves</div><div class=\"k\">자기 자신을 규정하는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">in terms of their independence from groups and autonomy</div><div class=\"k\">그들(= 개인주의 문화의 구성원들)의 집단으로부터의 독립과 자율성 면에서</div></div><div class=\"rc ckc\"><div class=\"e\">and are socialized to <span class=\"cw\">value</span></div><div class=\"k\">그리고 <span class=\"cw\">중시하도록</span> 사회화되어 있다</div></div><div class=\"rc\"><div class=\"e\">individual freedoms and individual expressions.</div><div class=\"k\">개인의 자유와 개인의 표현을.</div></div><div class=\"rnat\">대조적으로, 개인주의 문화의 구성원들은 집단으로부터의 독립과 자율성 면에서 자기 자신을 규정하는 경향이 있으며 개인의 자유와 개인의 표현을 중시하도록 사회화되어 있다.</div><div class=\"rst\"><b>대조적으로</b>(In contrast) 2반은 ‘나답게’가 중요해요. 지문 3번, 개인주의는 독립·자율과 개인의 표현을 <b>중시해요</b>(value).</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">In individualist cultures,</div><div class=\"k\">개인주의 문화에서,</div></div><div class=\"rc\"><div class=\"e\">standing out and being different</div><div class=\"k\">돋보이는 것과 (남들과) 다른 것은</div></div><div class=\"rc ckc\"><div class=\"e\">is often seen as a sign of <span class=\"cw\">courage</span>.</div><div class=\"k\">종종 <span class=\"cw\">용기의</span> 표시로 여겨진다. ※ 문제지엔 weakness로 되어 있음</div></div><div class=\"rnat\">개인주의 문화에서, 돋보이는 것과 (남들과) 다른 것은 종종 약함(→ 용기)의 표시로 여겨진다.</div><div class=\"rst\">그래서 2반에서 혼자 다른 의견을 내면 “용기 있다!”는 말을 들어요. 지문 4번도 남다른 것을 <b>용기</b>(courage)의 표시로 봐요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Implicit in the characterization</div><div class=\"k\">정의에 내재되어 있다</div></div><div class=\"rc\"><div class=\"e\">of collectivist and individualist groups</div><div class=\"k\">집단주의 및 개인주의 집단의</div></div><div class=\"rc\"><div class=\"e\">is the assumption</div><div class=\"k\">가정이</div></div><div class=\"rc\"><div class=\"e\">that deviance will be downgraded more</div><div class=\"k\">일탈이 더 평가 절하될 것이라는</div></div><div class=\"rc\"><div class=\"e\">in groups that prescribe collectivism</div><div class=\"k\">집단주의를 규정하는 집단에서</div></div><div class=\"rc\"><div class=\"e\">than in groups that prescribe individualism.</div><div class=\"k\">개인주의를 규정하는 집단에서보다.</div></div><div class=\"rnat\">일탈이 개인주의를 규정하는 집단보다 집단주의를 규정하는 집단에서 더 평가 절하될 것이라는 가정은 집단주의 및 개인주의 집단의 정의에 내재되어 있다.</div><div class=\"rst\">반대로 1반에서 혼자 튀면 좋지 않게 보여요. 지문 5번, 집단주의에서 일탈이 더 downgraded(평가 절하되다)된다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Indeed, empirical research shows</div><div class=\"k\">실제로, 경험적 연구는 보여 준다</div></div><div class=\"rc\"><div class=\"e\">that individualist group norms</div><div class=\"k\">개인주의 집단 규범이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">broaden the latitude</span></div><div class=\"k\"><span class=\"cw\">허용 범위를 넓혀 준다는 것을</span></div></div><div class=\"rc\"><div class=\"e\">of acceptable group member behavior</div><div class=\"k\">집단 구성원의 용인 가능한 행동의</div></div><div class=\"rc\"><div class=\"e\">and non-normative characteristics.</div><div class=\"k\">그리고 비표준적 특징의.</div></div><div class=\"rnat\">실제로, 경험적 연구는 개인주의 집단 규범이 집단 구성원의 용인 가능한 행동과 비표준적 특징의 허용 범위를 넓혀준다는 것을 보여준다.</div><div class=\"rst\">실제로 2반은 ‘이 정도는 괜찮아’의 범위가 넓어요. 지문 6번, 개인주의 규범은 받아 주는 행동의 <b>허용 범위를 넓혀요</b>.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"socialize\" data-m=\"사회화하다\"><b>socialize</b>사회화하다</button><button type=\"button\" class=\"wdb\" data-w=\"empathize with\" data-m=\"~에 공감하다\"><b>empathize with</b>~에 공감하다</button><button type=\"button\" class=\"wdb\" data-w=\"autonomy\" data-m=\"자율성\"><b>autonomy</b>자율성</button><button type=\"button\" class=\"wdb\" data-w=\"standing out\" data-m=\"돋보이는 것, 눈에 띄는 것\"><b>standing out</b>돋보이는 것, 눈에 띄는 것</button><button type=\"button\" class=\"wdb\" data-w=\"deviance\" data-m=\"일탈\"><b>deviance</b>일탈</button><button type=\"button\" class=\"wdb\" data-w=\"prescribe\" data-m=\"규정하다\"><b>prescribe</b>규정하다</button><button type=\"button\" class=\"wdb\" data-w=\"latitude\" data-m=\"허용 범위, 자유\"><b>latitude</b>허용 범위, 자유</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 문장은 8번을 <b>다시 말한 것</b>이에요. 기억은 <b>사라진 게 아니라</b> 꺼낼 <b>the right cue</b>(적절한 단서)가 없을 뿐 → 그 단서를 비유로 바꾼 보기를 고르세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (11번)</span><div class=\"en\">The memory of last Wednesday’s lunch <mark>isn’t necessarily gone</mark>; it’s that you lack <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">지난 수요일 점심 기억이 꼭 사라진 건 아니다; 여러분에게 ( ? )이 없는 것이다</p></div><div class=\"ck-via\"><i>▼</i><span>‘사라진 게 아니다’가 빈칸 문장과 똑같이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">It’s not so much that your memory of last week’s lunch has disappeared; if provided with <mark>the right cue</mark>, … you would likely recall what had been on your plate.</div><p class=\"ko\">기억이 사라졌다는 것은 아니다; 만약 <mark>적절한 단서가</mark> 제공된다면, … 접시에 무엇이 있었는지를 기억해 낼 가능성이 크다.</p></div><div class=\"ck-via\"><i>▼</i><span>점심 기억이 너무 많아서 하나를 골라 꺼내기 어려워요</span></div><div class=\"ck-step\"><span class=\"lab\">10번 문장 · 왜 단서가 필요할까</span><div class=\"en\"><mark>many memories compete for our attention</mark>.</div><p class=\"ko\"><mark>많은 기억이 우리의 주의를 끌기 위해 경쟁한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>경쟁자가 없으면 단서 없이도 바로 떠올라요</span></div><div class=\"ck-step\"><span class=\"lab\">13번 문장 · 반대 사례로 확인</span><div class=\"en\">It’s a memory <mark>without rivals</mark>.</div><p class=\"ko\">그것은 <mark>경쟁자가 없는</mark> 기억이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">the right hook to pull it out of a sea of lunchtime memories 점심시간 기억의 바다에서 그것을 끌어올릴 적절한 낚싯바늘<small>8번 the right cue(적절한 단서)를 hook(낚싯바늘)으로 바꿔 말했어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">the glue to attach it to just another lunch memory 그것을 그저 또 한 끼의 점심 기억에 붙일 접착제</span><span class=\"why\">9번 just another lunch(그저 그런 점심)를 재활용한 함정이에요. 다른 점심 기억에 붙어 버린 게 바로 못 떠올리는 원인이라, 거꾸로예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">the channel to let it flow into the pool of ordinary memories 그것이 평범한 기억의 못으로 흘러 들어가게 하는 경로</span><span class=\"why\">평범한 기억 속으로 흘려보내는 건 9번처럼 문제의 원인이에요. 필요한 건 섞인 기억에서 꺼내는 것이지 넣는 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">the memory capacity to keep a box of sleeping memories 잠자는 기억 한 상자를 보관할 기억 용량</span><span class=\"why\">8번·11번 모두 기억은 사라지지 않았다고 해요. 이미 저장은 되어 있으니 용량이 모자란 문제가 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">the sufficient number of competitors in a battle for attention 주의를 끌기 위한 싸움에서 충분한 수의 경쟁자</span><span class=\"why\">10번은 경쟁하는 기억이 너무 많아서 문제라고 해요. 경쟁자가 부족한 게 아니라 넘쳐서 생긴 일이라 반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">How many of the lunches</div><div class=\"k\">점심 중 얼마나 많이</div></div><div class=\"rc\"><div class=\"e\">that you ate over the last week</div><div class=\"k\">여러분이 지난주 동안 먹은</div></div><div class=\"rc\"><div class=\"e\">can you recall?</div><div class=\"k\">여러분은 기억해 낼 수 있는가?</div></div><div class=\"rnat\">여러분은 여러분이 지난주 동안 먹은 점심 중 얼마나 많이 기억해 낼 수 있는가?</div><div class=\"rst\">지난주 급식 메뉴, 몇 개나 기억나요? 지문 1번도 지난주 점심을 얼마나 떠올릴 수 있냐고 물어요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Do you remember</div><div class=\"k\">여러분은 기억하는가</div></div><div class=\"rc\"><div class=\"e\">what you ate today?</div><div class=\"k\">여러분이 오늘 먹은 것을?</div></div><div class=\"rnat\">여러분은 여러분이 오늘 먹은 것을 기억하는가?</div><div class=\"rst\">오늘 급식은 기억나죠? 지문 2번도 오늘 먹은 걸 기억하냐고 물어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">I hope so.</div><div class=\"k\">나는 그러길(= 오늘 먹은 것을 기억하길) 바란다.</div></div><div class=\"rnat\">나는 그러길(기억하길) 바란다.</div><div class=\"rst\">당연히 기억나길 바라요. = 지문의 I hope so(나는 그러길 바란다)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Yesterday?</div><div class=\"k\">어제는 (기억하는가)?</div></div><div class=\"rnat\">어제는 (기억하는가)?</div><div class=\"rst\">그럼 어제 급식은요? 지문 4번도 어제는 어떠냐고 한 칸 더 뒤로 가요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">I bet</div><div class=\"k\">틀림없이</div></div><div class=\"rc\"><div class=\"e\">it takes a moment’s effort.</div><div class=\"k\">그것(= 어제 먹은 것을 기억해 내는 것)은 잠깐의 노력을 필요로 한다.</div></div><div class=\"rnat\">틀림없이 그것(어제 먹은 것을 기억해 내는 것)은 잠깐의 노력을 필요로 한다.</div><div class=\"rst\">“음… 뭐였더라?” 잠깐 머리를 굴려야 해요. = 지문 5번, 잠깐의 노력이 필요하다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">And what about the day before yesterday?</div><div class=\"k\">그리고 그저께는 어떤가?</div></div><div class=\"rnat\">그리고 그저께는 어떤가?</div><div class=\"rst\">그저께 급식은 더 가물가물해요. 지문 6번도 그저께는 어떠냐고 물어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">What about a week ago?</div><div class=\"k\">한 주 전은 어떤가?</div></div><div class=\"rnat\">한 주 전은 어떤가?</div><div class=\"rst\">일주일 전은 거의 생각이 안 나요. = 지문 7번의 ‘한 주 전은 어떤가?’예요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">It’s not so much that</div><div class=\"k\">~라는 것은 아니다</div></div><div class=\"rc\"><div class=\"e\">your memory of last week’s lunch</div><div class=\"k\">지난주 점심에 대한 여러분의 기억이</div></div><div class=\"rc\"><div class=\"e\">has disappeared;</div><div class=\"k\">사라졌다는;</div></div><div class=\"rc ckc\"><div class=\"e\">if provided with <span class=\"cw\">the right cue,</span></div><div class=\"k\">만약 <span class=\"cw\">적절한 단서가</span> 제공된다면,</div></div><div class=\"rc\"><div class=\"e\">like where you ate it,</div><div class=\"k\">여러분이 그것(= 지난주 점심)을 어디에서 먹었는지,</div></div><div class=\"rc\"><div class=\"e\">or whom you ate it with,</div><div class=\"k\">또는 그것을 누구와 먹었는지와 같은,</div></div><div class=\"rc\"><div class=\"e\">you would likely recall</div><div class=\"k\">여러분은 기억해 낼 가능성이 크다</div></div><div class=\"rc\"><div class=\"e\">what had been on your plate.</div><div class=\"k\">접시에 무엇이 있었는지를.</div></div><div class=\"rnat\">지난주 점심에 대한 여러분의 기억이 사라졌다는 것은 아니다. 만약 여러분이 그것을 어디에서 먹었는지, 또는 그것을 누구와 먹었는지와 같은 적절한 단서가 제공된다면, 여러분은 접시에 무엇이 있었는지를(무엇을 먹었는지를) 기억해 낼 가능성이 크다.</div><div class=\"rst\">그래도 “그날 짝꿍이랑 창가에서 먹었잖아” 하면 떠올라요. 지문 8번, 기억은 사라진 게 아니라 <b>적절한 단서</b>(the right cue)가 필요해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Rather, it’s difficult</div><div class=\"k\">오히려, 어렵다</div></div><div class=\"rc\"><div class=\"e\">to remember last week’s lunch</div><div class=\"k\">지난주의 점심을 기억하는 것은</div></div><div class=\"rc\"><div class=\"e\">because your brain has filed it away</div><div class=\"k\">여러분의 뇌가 그것(= 지난주의 점심)을 정리해 놓았기 때문에</div></div><div class=\"rc\"><div class=\"e\">with all the other lunches you’ve ever eaten</div><div class=\"k\">여러분이 먹은 적 있는 다른 모든 점심들과 함께</div></div><div class=\"rc\"><div class=\"e\">as just another lunch.</div><div class=\"k\">‘그저 그런(평범한) 점심’으로.</div></div><div class=\"rnat\">오히려, 여러분의 뇌가 여러분이 먹은 적 있는 다른 모든 점심들과 함께 그것(지난주의 점심)을 '그저 그런(평범한) 점심'으로 정리해 놓았기 때문에, 지난주의 점심을 기억하는 것은 어렵다.</div><div class=\"rst\">뇌가 그날 급식을 ‘그냥 또 한 번의 급식’ 상자에 다 같이 넣어 버렸거든요. = 지문 9번, 그래서 기억하기 어렵다는 말이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">When we try to recall something</div><div class=\"k\">우리가 어떤 것을 기억해 내려고 할 때</div></div><div class=\"rc\"><div class=\"e\">from a category</div><div class=\"k\">범주로부터</div></div><div class=\"rc\"><div class=\"e\">that includes as many instances</div><div class=\"k\">많은 사례를 포함하는</div></div><div class=\"rc\"><div class=\"e\">as “lunch” or “wine,”</div><div class=\"k\">‘점심’ 또는 ‘와인’만큼,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">many memories compete for our attention.</span></div><div class=\"k\"><span class=\"cw\">많은 기억이 우리의 주의를 끌기 위해 경쟁한다</span>.</div></div><div class=\"rnat\">우리가 '점심' 또는 '와인'과 같은 많은 사례를 포함하는 범주로부터 어떤 것을 기억해 내려고 할 때, 많은 기억이 우리의 주의를 (끌기) 위해 경쟁한다.</div><div class=\"rst\">급식 기억이 수백 개라 서로 “나 먼저!” 하고 다퉈요. = 지문 10번, <b>많은 기억이 경쟁한다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The memory of last Wednesday’s lunch</div><div class=\"k\">지난 수요일 점심에 대한 기억이</div></div><div class=\"rc\"><div class=\"e\">isn’t necessarily gone;</div><div class=\"k\">꼭 사라진 것은 아니다;</div></div><div class=\"rc\"><div class=\"e\">it’s that you lack</div><div class=\"k\">그것은 여러분에게 ~이 없다는 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the right hook</span> to pull it out of a sea of lunchtime memories.</div><div class=\"k\">점심시간에 대한 기억의 바다로부터 그것(= 지난 수요일 점심에 대한 기억)을 끄집어낼 <span class=\"cw\">적절한 낚싯바늘이</span>. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">지난 수요일 점심에 대한 기억이 꼭 사라진 것은 아니다. 그것은 여러분에게 점심시간에 대한 기억의 바다로부터 그것(지난 수요일 점심에 대한 기억)을 끄집어낼 적절한 낚싯바늘이 없다는 것이다.</div><div class=\"rst\">그러니 그날 기억을 바다에서 건져 올릴 <b>낚싯바늘</b>이 없을 뿐이에요. 그래서 빈칸은 the right hook(적절한 낚싯바늘)이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">But a wine that talks:</div><div class=\"k\">하지만 말하는 와인,</div></div><div class=\"rc\"><div class=\"e\">That’s unique.</div><div class=\"k\">그것(= 말하는 와인)은 유일무이하다.</div></div><div class=\"rnat\">하지만 말하는 와인, 그것은 유일무이하다.</div><div class=\"rst\">그런데 급식에 ‘말하는 반찬’이 나왔다면? 지문 12번의 말하는 와인처럼 그건 세상에 하나뿐이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">It’s a memory</div><div class=\"k\">그것(= 말하는 와인에 대한 기억)은 기억이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">without rivals.</span></div><div class=\"k\"><span class=\"cw\">경쟁자가 없는</span>.</div></div><div class=\"rnat\">그것은 경쟁자가 없는 기억이다.</div><div class=\"rst\">그런 기억은 다툴 경쟁자가 없어서 단서 없이도 바로 떠올라요. = 지문 13번, 경쟁자가 없는 기억(without rivals)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"recall\" data-m=\"기억해 내다, 상기하다\"><b>recall</b>기억해 내다, 상기하다</button><button type=\"button\" class=\"wdb\" data-w=\"cue\" data-m=\"단서\"><b>cue</b>단서</button><button type=\"button\" class=\"wdb\" data-w=\"instance\" data-m=\"사례\"><b>instance</b>사례</button><button type=\"button\" class=\"wdb\" data-w=\"compete for\" data-m=\"~을 두고 경쟁하다\"><b>compete for</b>~을 두고 경쟁하다</button><button type=\"button\" class=\"wdb\" data-w=\"lack\" data-m=\"~이 없다, 부족하다\"><b>lack</b>~이 없다, 부족하다</button><button type=\"button\" class=\"wdb\" data-w=\"hook\" data-m=\"갈고리, 낚싯바늘\"><b>hook</b>갈고리, 낚싯바늘</button><button type=\"button\" class=\"wdb\" data-w=\"rival\" data-m=\"경쟁자, 맞수\"><b>rival</b>경쟁자, 맞수</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
