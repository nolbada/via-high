<title>고3 미니모의고사 2회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

(function(W){

  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}

  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);

    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});

    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }

    var d=document.createElement('div');

      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}

    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

 ... sounded like</b>"]}, {"t": "what절 안은 <b>ancient Greek music sounded like what</b>의 순서가 바뀐 모양이다.", "sub": ["S: ancient Greek music (고대 그리스 음악)", "V: sounded (sound ~처럼 들리다의 과거형)", "C: like what (무엇처럼, like 구)", "기준: sound + like 구는 보어로 보아 2형식. what (무엇)은 like의 목적어 자리에서 앞으로 나옴"]}, {"t": "<b>because there are no examples of it in written or notated form</b>은 이유 부사절이다. there 구문이다.", "sub": ["no examples (예가 없음), it = ancient Greek music (고대 그리스 음악)", "written or notated form (기록되거나 악보로 적힌 형태, notated 악보에 적힌)"]}, {"t": "<b>nor has it survived in oral tradition</b>은 '~도 아니다'라는 부정절이다. nor가 앞으로 나오면서 <b>has it survived</b>로 도치되었다. 원래 순서는 it has not survived이다.", "sub": ["survive (살아남다), oral tradition (구전)"]}], "sum": "고대 그리스 음악의 소리는 기록·악보·구전 모두 없어 알 수 없음"}, {"i": "07", "q": "05", "s": "5", "title": "보어 도치 + 동격 that절 + 비교급 than", "eng": "Implicit<sup>1</sup> in the characterization<sup>2</sup> of collectivist and individualist groups / is the assumption<sup>3</sup> / that deviance<sup>4</sup> will be downgraded<sup>5</sup> more in groups that prescribe<sup>6</sup> collectivism / than in groups that prescribe individualism.", "notes": [["1", "implicit", "내재된, 암시된"], ["2", "characterization", "규정, 특징 짓기"], ["3", "assumption", "가정"], ["4", "deviance", "일탈"], ["5", "downgrade", "평가 절하하다"], ["6", "prescribe", "규정하다"]], "lit": "집단주의 집단과 개인주의 집단을 규정하는 데 내재되어 있는 것은 / 바로 그 가정이다 / 일탈이 집단주의를 규정하는 집단에서 더 평가 절하될 것이라는 / 개인주의를 규정하는 집단에서보다.", "nat": "집단주의 집단과 개인주의 집단을 규정하는 방식에는, 일탈이 개인주의를 규정하는 집단보다 집단주의를 규정하는 집단에서 더 평가 절하되리라는 가정이 깔려 있다.", "ana": "보어인 <b>Implicit</b>이 문장 맨 앞으로 나가면서 <b>주어와 동사가 뒤집힌</b> 문장이다. 진짜 주어는 동사 is 뒤의 <b>the assumption</b>이다. 앞에 형용사가 툭 튀어나오고 뒤에 is가 보이면 도치를 의심해야 한다. 이어지는 <b>that절</b>은 관계대명사가 아니라 assumption의 내용을 풀어 주는 <b>동격</b>이고, 그 안에서 <b>more ~ than</b>이 두 집단을 비교한다.", "pe": "Implicit<sup>1</sup> \u0001in the characterization<sup>2</sup> \u0001of collectivist and individualist groups\u0002\u0002 / is the assumption<sup>3</sup> / \u0001that deviance<sup>4</sup> will be downgraded<sup>5</sup> more in groups that prescribe<sup>6</sup> collectivism\u0002 / \u0001than in groups that prescribe individualism\u0002.", "pk": "\u0001집단주의 집단과 개인주의 집단을 규정하는 데\u0002 내재되어 있는 것은 / 바로 그 가정이다 / \u0001일탈이 집단주의를 규정하는 집단에서 더 평가 절하될 것이라는\u0002 / \u0001개인주의를 규정하는 집단에서보다\u0002.", "core": "가정이 내재되어 있다.", "tags": ["<b>도치</b>: 보어 Implicit이 앞으로. in ~ = 전치사구(부사구): Implicit 꾸밈. of ~ groups = 형용사구: characterization 꾸밈", "동사 is + 주어 the assumption (뒤에 놓인 진짜 주어)", "<b>동격 that절</b>: assumption 꾸밈. 안쪽 deviance will be downgraded more in groups (that prescribe collectivism = 관계절)", "than ~ = 비교 부사구: more 꾸밈. that prescribe individualism = 관계절: groups 꾸밈"], "steps": [{"t": "이 문장은 <b>보어가 앞으로 나온 도치 문장</b>이다. 진짜 주어 the assumption이 뒤에 있고, 동격 that절이 길게 이어져 길어 보인다."}, {"t": "순서를 바로잡아 뼈대를 찾는다.", "sub": ["S: the assumption (가정)", "V: is (be ~이다)", "C: implicit (내재된, 깔려 있는)", "뼈대 = <b>the assumption is implicit</b> (원문은 Implicit ... is the assumption)"]}, {"t": "<b>in the characterization of collectivist and individualist groups</b>는 Implicit을 꾸미는 전치사구이다.", "sub": ["characterization (특징 규정)", "collectivist (집단주의의), individualist (개인주의의), groups (집단)"]}, {"t": "<b>that deviance will be downgraded more in groups that prescribe collectivism</b>은 assumption의 내용을 설명하는 <b>동격 that절</b>이다. that 뒤가 완전한 문장이라 관계절이 아니다.", "sub": ["S: deviance (일탈) / V: will be downgraded (downgrade 평가 절하하다의 수동)", "that prescribe collectivism은 groups를 꾸미는 관계절 (prescribe 규정하다)"]}, {"t": "<b>than in groups that prescribe individualism</b>은 more를 꾸미는 비교 대상('개인주의를 규정하는 집단에서보다')이다. 함정: groups가 두 번 나오고 각각 관계절이 붙어 있다."}], "sum": "일탈이 집단주의 집단에서 더 낮게 평가된다는 가정, 집단 규정의 바탕"}, {"i": "08", "q": "06", "s": "10", "title": "When절(관계절 + as many ~ as) + S+V(1형식)", "eng": "When we try to recall<sup>1</sup> something from a category<sup>2</sup> / that includes as many instances<sup>3</sup> as “lunch” or “wine,” / many memories compete for<sup>4</sup> our attention.", "notes": [["1", "recall", "기억해 내다"], ["2", "category", "범주"], ["3", "instance", "사례"], ["4", "compete for", "~을 두고 경쟁하다"]], "lit": "우리가 어떤 범주에서 무언가를 기억해 내려 할 때, / ‘점심’이나 ‘와인’처럼 사례가 아주 많은 (그 범주에서), / 많은 기억들이 우리의 주의를 얻으려고 경쟁한다.", "nat": "‘점심’이나 ‘와인’처럼 해당하는 사례가 아주 많은 범주에서 무언가를 떠올리려 하면, 수많은 기억이 서로 우리의 주의를 끌려고 다툰다.", "ana": "<b>that</b>은 a category를 꾸미는 주격 관계대명사로, 그 안의 동사가 <b>includes</b>이다. <b>as many instances as “lunch” or “wine”</b>는 '점심이나 와인만큼 많은 사례'라는 <b>원급 비교</b>인데, 뒤의 as 다음에 '점심이 가진 사례 수'가 생략되어 있다. 마지막의 <b>compete for</b>는 '~을 두고 경쟁하다'로, for를 '~을 위해'로만 외우면 뜻이 흐릿해진다.", "pe": "\u0001When we try to recall<sup>1</sup> something \u0001from a category<sup>2</sup>\u0002\u0002 / \u0001that includes as many instances<sup>3</sup> as “lunch” or “wine,”\u0002 / many memories compete \u0001for<sup>4</sup> our attention\u0002.", "pk": "\u0001우리가 어떤 범주에서 무언가를 기억해 내려 할 때\u0002, / \u0001‘점심’이나 ‘와인’처럼 사례가 아주 많은 (그 범주에서)\u0002, / 많은 기억들이 우리의 주의를 얻으려고 경쟁한다.", "core": "많은 기억이 경쟁한다.", "tags": ["<b>When절</b> = 부사절(시간): compete 꾸밈. from a category = 부사구: recall 꾸밈", "<b>관계절</b>(형용사절): a category 꾸밈. includes 안에 as many ~ as 원급 비교", "주어 many memories + 동사 compete (1형식). for our attention = 전치사구(부사구): compete 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>When절 + S+V(1형식)</b>이다. When절 안에 관계절과 as ~ as 비교가 겹쳐 길어 보일 뿐 뼈대는 짧다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: many memories (많은 기억들)", "V: compete (경쟁하다)", "뼈대 = <b>many memories compete</b>", "기준: compete for ~의 for구는 거의 필수에 가까운 부사구이지만 수식어로 본다.", "for our attention (우리의 주의를 얻으려고, attention 주의)"]}, {"t": "<b>When we try to recall something from a category</b>는 시간 부사절이다.", "sub": ["try to V (~하려고 애쓰다)", "recall (기억해 내다)", "category (범주)"]}, {"t": "<b>that includes as many instances as “lunch” or “wine,”</b>은 category를 꾸미는 <b>관계절</b>(주격 that)이다. as many ~ as ...는 '...만큼 많은 ~'이다.", "sub": ["include (포함하다)", "instance (사례)", "범주 이름 lunch (점심), wine (와인)"]}], "sum": "점심·와인처럼 사례가 많은 범주에서 떠올릴 때, 많은 기억이 주의를 두고 경쟁"}], "qs": [{"q": "01", "type": "필자 주장", "src": "2015학년도 9월 19번", "ans": "⑤", "tr": [["1", "누구나 이따금 이런저런 일에 대해 의심이 드는 순간을 맞는데, 이는 자연스러운 과정이다."], ["2", "문제는 그런 순간들이 쌓여 당신의 자기 확신에 영향을 미치도록 내버려 두지 않는 것이다."], ["3", "당신은 다른 사람들의 논평과 견해라는 도전에 늘 부딪히게 될 것이다."], ["4", "곁에 있으면 기분이 좋아지는 사람이 있는가 하면, 그렇지 않은 사람도 있다."], ["5", "어떤 사람들은 당신을 믿어 주기 때문에 당신에게 긍정적인 기운을 준다."], ["6", "당신은 그것을 느끼고, 그래서 중요한 순간에 제 실력을 발휘하게 된다."], ["7", "반면 어떤 사람들은 당신이 하는 일이나 하는 말에 대해 늘 부정적인 한마디를 준비해 두고 있을지도 모른다."], ["8", "그런 말들이 당신의 자기 확신을 흔들도록 내버려 두지 말라."], ["9", "그 말을 한 이유가 무엇인지 언제나 따져 보라."], ["10", "그것이 사실에 근거한 것이라면 귀를 기울여야 하지만, 그렇지 않다면 그것은 그저 그 사람의 의견일 뿐이다."], ["11", "당신은 흔들리지 않고 단단히 서 있을 필요가 있을 것이다."]], "evh": "9번 문장", "ev": [{"en": true, "h": "Always question the person's reason for the comment. If it is based on fact, you should listen; if not, then it is only their opinion."}, {"en": false, "h": "주장 문항은 <b>명령문</b>과 <b>should</b>가 붙은 문장을 먼저 본다. 여기서는 '언제나 그 말의 이유를 따져 보라 → 사실에 근거하면 듣고, 아니면 그저 의견일 뿐이다'가 핵심이다. 즉 <b>남의 말을 전부 받아들이지도, 전부 무시하지도 말고 가려서 받아들이라</b>는 것이고, 그 목적은 앞뒤에 반복되는 <b>self-belief</b>(자기 확신)를 지키는 데 있다."}], "opts": [{"n": "①", "t": "인맥이 넓은 사람들과 교제하라.", "a": false, "x": true, "trap": false, "e": "주위 사람 이야기가 나오지만 '인맥을 넓히라'는 말은 없다. 오히려 사람마다 주는 영향이 다르다는 점을 지적할 뿐이다."}, {"n": "②", "t": "성공하기 위해 도전적인 자세를 가지라.", "a": false, "x": true, "trap": false, "e": "challenge가 두 번 나오지만 '도전 정신'이 아니라 '(어쩔 수 없이 부딪히는) 도전 과제, 어려움'이라는 뜻이다. 단어만 보고 고르면 걸린다."}, {"n": "③", "t": "일시적 감정으로 타인을 비판하지 말라.", "a": false, "x": true, "trap": false, "e": "글의 시선은 '남을 비판하는 나'가 아니라 '남에게 비판받는 나'에 맞춰져 있다. 주체가 정반대다."}, {"n": "④", "t": "좌절감을 느낄 때는 성공한 경험을 생각하라.", "a": false, "x": true, "trap": true, "e": "과거의 성공 경험을 떠올리라는 조언은 전혀 없다. rise to the occasion을 '성공 경험'으로 잘못 연결하기 쉽다."}, {"n": "⑤", "t": "선별적인 의견 수용으로 자기 확신이 흔들리지 않게 하라.", "a": true, "x": false, "trap": false, "e": "'사실에 근거하면 듣고 아니면 흘려라'가 <b>선별적 수용</b>이고, 'Don't let these comments rock your self-belief'가 <b>자기 확신이 흔들리지 않게</b>에 그대로 대응한다."}], "w": [["doubt", "의심"], ["from time to time", "이따금, 때때로"], ["accumulate", "축적되다, 쌓이다"], ["self-belief", "자기 신뢰, 자기 확신"], ["comment", "논평, 언급"], ["be around", "~ 곁에 있다"], ["rise to the occasion", "위기 상황에서 능력을 발휘하다"], ["rock", "흔들다"], ["question", "의문을 갖다"], ["be based on", "~에 근거하다"], ["stay strong", "확고함을 유지하다"]]}, {"q": "02", "type": "심경 변화", "src": "2023학년도 9월 19번", "ans": "④", "tr": [["1", "“아빠!” 하고 Jenny가 작은 손에 쥔 노란 크레용을 흔들며 불렀다."], ["2", "Nathan은 딸이 왜 자신을 부르는지 궁금해하며 딸에게 다가갔다."], ["3", "이제 막 걸음마를 뗀 세 살배기 Jenny는 종이에 커다란 원을 그리고 있었다."], ["4", "“뭐 하고 있니, 아가?” Nathan이 관심을 보이며 물었다."], ["5", "아이는 대답 없이 계속 그림만 그렸다."], ["6", "그는 딸이 무엇을 그리는 중인지 궁금해하며 계속 지켜보았다."], ["7", "아이는 얼굴처럼 보이는 무언가를 그리고 있었다."], ["8", "그림을 다 그리고 나자 Jenny가 “보세요, 아빠!” 하고 외쳤다."], ["9", "아이는 자기 작품을 자랑스럽게 들어 올렸다."], ["10", "가까이 들여다보고 나서야 Nathan은 그것이 자기 얼굴이라는 것을 알아차렸다."], ["11", "그 얼굴에는 자신의 것과 똑같이 큰 눈 두 개와 수염이 있었다."], ["12", "그는 Jenny의 그림이 무척 마음에 들었다."], ["13", "기쁨과 행복으로 가득 찬 Nathan은 딸을 꼭 껴안아 주었다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "He continued watching her, wondering what she was working on. … Filled with joy and happiness, Nathan gave her a big hug."}, {"en": false, "h": "심경 변화 문항은 <b>앞부분의 감정어</b>와 <b>뒷부분의 감정어</b>를 각각 찾아 잇는다. 앞쪽에는 <b>wondering</b>이 두 번 반복되어 '무엇을 그리는 걸까'라는 <b>궁금함</b>이 깔려 있고, 뒤쪽에는 <b>loved</b>, <b>joy and happiness</b>, <b>a big hug</b>가 몰려 있어 <b>기쁨</b>으로 끝난다. 부정적인 감정어는 글 전체에 한 번도 나오지 않는다."}], "opts": [{"n": "①", "t": "sorrowful → relieved (슬픈 → 안도하는)", "a": false, "x": true, "trap": false, "e": "슬픔을 나타내는 표현이 어디에도 없다. 시작부터 평온하고 다정한 장면이다."}, {"n": "②", "t": "frustrated → satisfied (좌절한 → 만족한)", "a": false, "x": true, "trap": true, "e": "딸이 대답 없이 그림만 그리는 장면에서 좌절을 읽어 내기 쉽지만, 아빠의 반응은 <b>with interest</b>(관심을 가지고)와 <b>continued watching</b>(계속 지켜봄)으로 오히려 호의적이다."}, {"n": "③", "t": "worried → scared (걱정하는 → 무서워하는)", "a": false, "x": true, "trap": false, "e": "걱정도 두려움도 근거가 없다. 뒤로 갈수록 감정은 밝아진다."}, {"n": "④", "t": "curious → delighted (궁금한 → 아주 기쁜)", "a": true, "x": false, "trap": false, "e": "wondering why / wondering what이 <b>curious</b>, joy and happiness와 a big hug가 <b>delighted</b>로 그대로 이어진다."}, {"n": "⑤", "t": "hopeful → disappointed (희망찬 → 실망한)", "a": false, "x": true, "trap": false, "e": "마지막이 실망으로 끝나려면 부정적 반전이 있어야 하는데, 실제로는 껴안아 주는 장면으로 끝난다. 감정의 방향이 정반대다."}], "w": [["wave", "흔들다"], ["approach", "다가가다"], ["toddler", "아장아장 걷는 아이"], ["with interest", "관심을 가지고"], ["keep v-ing", "계속 ~하다"], ["work on", "~을 하고 있다, 작업하다"], ["hold up", "들어 올리다"], ["proudly", "자랑스럽게"], ["take a closer look", "자세히 들여다보다"], ["recognize", "알아차리다"], ["beard", "수염"], ["filled with", "~로 가득 찬"]]}, {"q": "03", "type": "주제", "src": "2022년 4월 23번", "ans": "①", "tr": [["1", "16세기가 시작될 무렵, 르네상스 운동은 종교 개혁과 깊은 종교적 변화의 시대를 불러왔다."], ["2", "이 시기의 예술은 그 변화가 낳은 혼란을 그대로 반영했다."], ["3", "'불규칙한' 또는 '왜곡된'이라는 뜻의 바로크라는 이름이 딱 어울리게, 16세기 유럽 회화는 주로 움직임, 극적인 상황, 행동, 강렬한 감정을 담아내는 데 초점을 맞췄다."], ["4", "화가들은 극적인 구도, 강렬한 명암 대비, 감정을 자극하는 소재라는 강력한 시각적 장치를 동원해 혼란스러운 감정을 불러일으켰다."], ["5", "이 시기에 종교적 소재는 새롭고 극적인 시각 언어로 묘사되곤 했는데, 이는 이전 전통의 경건한 인물 묘사와는 대조적이었다."], ["6", "기독교와 로마 가톨릭 교회를 둘러싼 사회적 혼란을 담아내기 위해, 많은 예술가들은 종교적 인물을 그릴 때 고전주의와 르네상스 시대가 세워 둔 시각적 완벽함이라는 오래된 기준을 버렸다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "The art of this period reflected the disruption caused by this shift."}, {"en": false, "h": "주제 문항은 <b>글 전체가 무엇을 설명하는지</b>를 한 문장으로 묶는다. 두 번째 문장이 '이 시기의 예술은 <b>종교적 변화가 낳은 혼란</b>을 반영했다'로 화두를 던지고, 이후 문장들은 모두 그 혼란이 <b>바로크 회화의 어떤 특징</b>으로 나타났는지(움직임·명암 대비·자극적 소재·완벽함의 포기)를 나열한다."}], "opts": [{"n": "①", "t": "characteristics of Baroque paintings caused by religious disruption (종교적 혼란이 낳은 바로크 회화의 특징)", "a": true, "x": false, "trap": false, "e": "disruption(혼란)이라는 원인과 그로 인한 회화의 특징이라는 결과를 모두 담았다. 본문의 전개 순서와 정확히 일치한다."}, {"n": "②", "t": "impacts of the Baroque on the development of visual perfectionism (바로크가 시각적 완벽주의의 발전에 끼친 영향)", "a": false, "x": true, "trap": true, "e": "본문은 바로크가 시각적 완벽함의 기준을 <b>버렸다</b>고 말한다. 방향이 정반대다."}, {"n": "③", "t": "efforts of Baroque painters to imitate the Renaissance style (르네상스 양식을 모방하려는 바로크 화가들의 노력)", "a": false, "x": true, "trap": false, "e": "바로크는 르네상스의 기준에서 벗어난 흐름으로 서술된다. 모방이 아니라 결별이다."}, {"n": "④", "t": "roles of Baroque artists in stabilizing the disrupted society (혼란스러운 사회를 안정시키는 데 있어 바로크 예술가들의 역할)", "a": false, "x": true, "trap": false, "e": "예술가들은 혼란을 <b>포착(capture)</b>했을 뿐 안정시켰다는 말은 없다."}, {"n": "⑤", "t": "reasons of idealizing religious figures in Baroque paintings (바로크 회화에서 종교적 인물을 이상화한 이유)", "a": false, "x": true, "trap": false, "e": "이상화(idealize)는 오히려 이전 전통의 <b>경건한 묘사</b> 쪽이다. 바로크는 그 기준을 버렸다."}], "w": [["give birth to", "~을 일으키다"], ["Protestant Reformation", "종교 개혁"], ["profound", "심오한, 깊은"], ["disruption", "혼란, 붕괴"], ["shift", "변화, 전환"], ["distorted", "왜곡된"], ["capture", "포착하다"], ["employ", "(기법을) 사용하다"], ["provocative", "자극적인, 도발적인"], ["stir up", "(감정을) 불러일으키다"], ["reverential", "경건한"], ["abandon", "버리다, 포기하다"]]}, {"q": "04", "type": "어법", "src": "2022년 3월 29번", "ans": "②", "tr": [["1", "고대 그리스 음악이 어떤 소리였는지 우리는 알지 못한다. 기록이나 악보로 남은 예가 없고, 구전으로도 전해지지 않았기 때문이다."], ["2", "어차피 그 음악의 상당 부분은 일정한 규칙과 관례 안에서 즉흥적으로 연주되었을 것이다."], ["3", "그래서 우리는 플라톤과 아리스토텔레스 같은 저술가들의 기록에서 그 토대를 추측할 수밖에 없는데, 이들은 음악의 실제 연주법에 관한 입문서를 쓰는 것보다 음악을 철학적·윤리적 실천으로 다루는 글을 쓰는 데 대체로 더 관심이 있었다."], ["4", "그리스 음악은 주로 성악 형식이었던 듯하며, 수금이나 뜯는 키타라('기타'의 어원) 같은 악기의 반주에 맞춰 노래되는 운문으로 이루어져 있었던 것 같다."], ["5", "실제로 플라톤은 춤이나 노래의 반주가 아니라 수금과 피리만 연주되는 음악을 '지극히 조잡하고 무미건조하다'고 여겼다."], ["6", "선율은 음역이 아주 제한적이었던 듯한데, 악기들이 대체로 (오늘날 우리가 정의하는 방식으로) 한 E음에서 다음 E음까지 한 옥타브에만 걸쳐 있었기 때문이다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "… who were generally more concerned with writing about music as a philosophical and ethical exercise ② as with providing a technical primer on its practice."}, {"en": false, "h": "앞에 <b>more concerned</b>라는 <b>비교급</b>이 있으므로 짝이 되는 접속사는 <b>than</b>이어야 한다. 'A라기보다 B'가 아니라 '<b>B보다 A에 더</b> 관심이 있었다'라는 비교 구문이다. as ~ as(원급)와 more ~ than(비교급)의 짝을 흐트러뜨린 것이 이 문제의 함정이다."}], "opts": [{"n": "①", "t": "has it survived — 부정어 nor 뒤의 도치", "a": false, "x": true, "trap": false, "e": "nor 같은 부정어가 앞에 나오면 '조동사 + 주어 + 과거분사' 순서로 도치된다. has it survived는 바르게 쓰였다."}, {"n": "②", "t": "as → than — 비교급 more와 짝을 이루는 접속사", "a": true, "x": false, "trap": false, "e": "more concerned가 이미 비교급이므로 뒤에는 반드시 than이 와야 한다. as로는 비교 대상이 연결되지 않는다."}, {"n": "③", "t": "consisting — 앞 명사를 꾸미는 현재분사", "a": false, "x": true, "trap": false, "e": "consist of는 자동사라 수동태로 쓰지 않는다. '~로 구성되다'라는 뜻을 분사로 나타낼 때는 언제나 consisting이다."}, {"n": "④", "t": "to be — consider의 목적격 보어", "a": false, "x": true, "trap": true, "e": "consider A to be B(A를 B로 여기다) 구문이다. 목적어 music과 보어 사이가 멀어 어색해 보이지만 어법상 옳다."}, {"n": "⑤", "t": "generally — 동사 span을 꾸미는 부사", "a": false, "x": true, "trap": false, "e": "span은 '(범위에) 걸치다'라는 동사이므로 이를 꾸미려면 부사 generally가 맞다."}], "w": [["notated", "악보에 적힌"], ["oral tradition", "구전"], ["improvise", "즉석 연주하다"], ["convention", "관례, 관습"], ["be forced to V", "~할 수밖에 없다"], ["account", "설명, 기술"], ["primer", "입문서"], ["predominantly", "주로"], ["verse", "운문"], ["lyre", "수금(竪琴)"], ["coarse", "조잡한"], ["span", "(범위에) 걸치다"]]}, {"q": "05", "type": "어휘", "src": "2020년 10월 30번", "ans": "③", "tr": [["1", "집단주의 집단에서는 관계, 화합의 유지, 그리고 집단과 '함께 가는 것'에 큰 무게를 둔다."], ["2", "집단주의 집단의 구성원들은 갈등을 피하고, 타인에게 공감하며, 자기 자신에게 이목이 쏠리는 것을 피하도록 사회화된다."], ["3", "대조적으로 개인주의 문화의 구성원들은 집단으로부터의 독립과 자율성이라는 잣대로 자기 자신을 규정하는 경향이 있고, 개인의 자유와 개인적 표현을 중시하도록 사회화된다."], ["4", "개인주의 문화에서 남과 다르게 튀는 것은 흔히 '약함'의 표시로 여겨진다."], ["5", "집단주의 집단과 개인주의 집단을 규정하는 방식에는, 일탈이 개인주의를 규정하는 집단보다 집단주의를 규정하는 집단에서 더 평가 절하되리라는 가정이 깔려 있다."], ["6", "실제로 경험적 연구는 개인주의 집단의 규범이 구성원의 용인 가능한 행동과 비규범적 특성의 허용 범위를 넓혀 준다는 것을 보여 준다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "In individualist cultures, standing out and being different is often seen as a sign of ③ weakness."}, {"en": false, "h": "개인주의 문화는 <b>독립·자율성·개인의 자유</b>를 중시한다고 바로 앞 문장에 나온다. 그런 문화에서 남과 다르게 튀는 것(standing out)이 <b>약함</b>의 표시일 수는 없다. 게다가 마지막 문장은 개인주의 집단이 비규범적 특성의 허용 범위를 <b>넓힌다</b>고 못 박는다. 따라서 weakness는 <b>courage</b>(용기)나 strength 같은 긍정어여야 한다."}], "opts": [{"n": "①", "t": "empathize (공감하다)", "a": false, "x": true, "trap": false, "e": "갈등을 피하고 화합을 지키는 집단주의 구성원의 태도로 자연스럽다."}, {"n": "②", "t": "value (중시하다)", "a": false, "x": true, "trap": false, "e": "개인주의 문화가 개인의 자유와 표현을 중시한다는 흐름에 정확히 들어맞는다."}, {"n": "③", "t": "weakness → courage (약함 → 용기)", "a": true, "x": false, "trap": false, "e": "개인주의 문화에서 튀는 것은 오히려 높이 평가되므로 부정어인 weakness는 문맥에 맞지 않는다."}, {"n": "④", "t": "downgraded (평가 절하되다)", "a": false, "x": true, "trap": true, "e": "집단주의를 규정하는 집단에서 일탈이 더 부정적으로 평가된다는 뜻이므로 알맞다. 어려운 단어라 그냥 답으로 찍기 쉽다."}, {"n": "⑤", "t": "acceptable (용인 가능한)", "a": false, "x": true, "trap": false, "e": "개인주의 규범이 용인 가능한 행동의 허용 범위를 넓힌다는 마지막 문장의 결론과 일치한다."}], "w": [["considerable", "큰, 상당한"], ["maintenance", "유지"], ["stick with", "~와 함께하다"], ["socialize", "사회화하다"], ["empathize with", "~에 공감하다"], ["draw attention to", "~에게 관심을 끌다"], ["autonomy", "자율성"], ["stand out", "돋보이다, 눈에 띄다"], ["implicit", "내재된, 암시된"], ["deviance", "일탈"], ["prescribe", "규정하다"], ["latitude", "허용 범위, 자유"]]}, {"q": "06", "type": "빈칸", "src": "2018학년도 수능 32번", "ans": "②", "tr": [["1", "지난 한 주 동안 먹은 점심 가운데 몇 끼나 떠올릴 수 있는가?"], ["2", "오늘 무엇을 먹었는지는 기억나는가? 그러길 바란다."], ["3", "어제는? 장담하건대 잠깐 애를 써야 할 것이다."], ["4", "그러면 그저께는? 일주일 전은?"], ["5", "지난주 점심에 대한 기억이 사라져 버린 것은 아니다. 어디서 먹었는지, 누구와 먹었는지 같은 적절한 단서만 주어진다면 접시에 무엇이 있었는지 아마 떠올릴 수 있을 것이다."], ["6", "오히려 지난주 점심이 잘 기억나지 않는 이유는, 뇌가 그것을 지금껏 먹은 다른 모든 점심과 함께 '그저 또 한 끼의 점심'으로 분류해 정리해 두었기 때문이다."], ["7", "'점심'이나 '와인'처럼 해당하는 사례가 아주 많은 범주에서 무언가를 떠올리려 하면, 수많은 기억이 서로 우리의 주의를 끌려고 다툰다."], ["8", "지난 수요일 점심에 대한 기억이 반드시 사라진 것은 아니다. 다만 그것을 점심 기억의 바다에서 끌어올릴 적절한 낚싯바늘이 없을 뿐이다."], ["9", "하지만 말을 하는 와인이라면? 그것은 유일무이하다."], ["10", "그것은 경쟁자가 없는 기억이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "It's not so much that your memory of last week's lunch has disappeared; if provided with the right cue, like where you ate it, or whom you ate it with, you would likely recall what had been on your plate."}, {"en": false, "h": "빈칸 문장은 앞에서 이미 던진 말을 <b>다시 요약</b>하는 자리다. 앞에서 '기억이 사라진 게 아니라 <b>적절한 단서(the right cue)</b>만 있으면 떠올릴 수 있다'고 했으므로, 빈칸에는 <b>그 단서가 없다</b>는 말이 들어가야 한다. 마지막의 '경쟁자 없는 기억'과 앞의 '많은 기억이 경쟁한다'도 같은 이야기를 뒤집어 말한 것이다."}], "opts": [{"n": "①", "t": "the c
