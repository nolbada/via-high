(function(W){

  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}

re, beginners are excellent at processing the tasks when the tasks are divided and isolated.", "g": "게다가, 초보자들은 과제가 분할되고 분리될 때 과제를 처리하는 것에 능숙하다.", "ok": true, "e": ["글은 전문가가 과제를 쉽게 해내는 이유를 설명하는데, ③은 갑자기 초보자가 과제 처리에 능숙하다고 말합니다", "③이 끼어들면 ④의 This가 ②의 내용을 바로 받지 못해요."]}, {"n": "④", "t": "This is not because they necessarily have more cognitive resources than beginners; rather, because of the high level of fluency they have achieved in performing key skills, they can do more with what they have.", "g": "이것은 그들이 반드시 초보자보다 인지 자원을 더 많이 가지고 있기 때문은 아니다. 오히려, 핵심 기술을 수행하며 달성한 높은 수준의 능숙함 때문에 그들은 가진 것으로 더 많은 것을 할 수 있다.", "ok": false, "e": ["This는 ②의 내용(전문가가 과제를 비교적 쉽게 해냄)을 가리킵니다", "그 이유가 자원이 더 많아서가 아니라 높은 능숙함 덕분이라고 덧붙여요."]}, {"n": "⑤", "t": "Beginners, on the other hand, have not achieved the same degree of fluency and automaticity in each of the component skills, and thus they struggle to combine skills that experts combine with relative ease and efficiency.", "g": "반면에, 초보자들은 각 구성 기술에서 같은 정도의 능숙함과 자동성을 성취하지 못했고, 그래서 전문가들이 비교적 쉽고 효율적으로 결합하는 기술들을 결합하는 데 고군분투한다.", "ok": false, "e": ["on the other hand(반면에)로 초보자를 전문가와 대조합니다", "글의 흐름에 맞는 마무리예요."]}], "tr": ["흥미롭게도, 복잡한 과제를 수행하거나 여러 개의 과제를 결합할 때 전문가들은 초보자만큼 고통받지는 않는다.", "전문가들은 제한적인 영역 안에서 폭넓은 연습을 하기 때문에 그들의 영역에서 핵심 구성 기술들은 고도로 숙련되고 더 자동화되는 경향이 있다.", "① 이 고도로 숙련된 각각의 기술은 비교적 적은 인지 자원을 요구하는데, (그 결과) 전문가들이 경험하는 총 인지 부하를 효과적으로 낮춘다.", "② 따라서, 전문가들은 복잡한 과제를 수행할 수 있고 여러 개의 과제들을 비교적 쉽게 결합할 수 있다.", "③ 게다가, 초보자들은 과제가 분할되고 분리될 때 과제를 처리하는 것에 능숙하다.", "④ 이것은 그들이 반드시 초보자보다 더 많은 인지적인 자원을 가지고 있기 때문은 아니다. 오히려, 그들이 핵심 기술을 수행하면서 달성한 높은 수준의 능숙함 때문에 그들은 그들이 가진 것으로 더 많은 것을 할 수 있다.", "⑤ 반면에, 초보자들은 각 구성 기술에 대해 같은 정도의 능숙함이나 자동성을 성취하지 못했고, 그래서 그들은 전문가들이 비교적 쉽고 효율적으로 결합하는 기술을 결합하는 데 고군분투한다."], "ps": [{"n": 1, "ch": [{"e": "<b>Interestingly<\/b>,", "k": "흥미롭게도,"}, {"e": "experts do not <b>suffer<\/b> as much as beginners", "k": "전문가들은 초보자만큼 고통받지는 않는다"}, {"e": "when performing complex tasks", "k": "복잡한 과제를 수행할 때"}, {"e": "or combining multiple tasks.", "k": "또는 여러 개의 과제를 결합할 때."}], "easy": "어려운 일을 하거나 여러 일을 한꺼번에 할 때, 전문가는 초보자보다 덜 힘들어해요.", "gist": "글의 주제 — 전문가는 복잡한 과제를 덜 힘들어해요."}, {"n": 2, "ch": [{"e": "Because experts have <b>extensive<\/b> practice", "k": "전문가들은 폭넓은 연습을 하기 때문에"}, {"e": "within a limited <b>domain<\/b>,", "k": "제한적인 영역 안에서,"}, {"e": "the key component skills in their domain", "k": "그들<span class=\"r\">(= 전문가들)<\/span>의 영역에서 핵심 구성 기술들은"}, {"e": "tend to be highly practiced and more <b>automated<\/b>.", "k": "고도로 숙련되고 더 자동화되는 경향이 있다."}], "link": "전문가들은 제한된 영역 안에서 폭넓은 연습을 하기 때문에, 그 영역의 핵심 구성 기술들은 고도로 숙련되고 더 자동화되는 경향이 있다.", "easy": "전문가는 한 분야에서 연습을 아주 많이 해서, 핵심 기술들이 몸에 익어 거의 저절로 돼요.", "gist": "전문가가 덜 힘든 이유 — 핵심 기술이 자동화돼 있어요."}, {"n": 3, "ch": [{"e": "① Each of these highly practiced skills", "k": "① 이 고도로 숙련된 각각의 기술은"}, {"e": "then demands relatively few <b>cognitive resources<\/b>,", "k": "그러면 비교적 적은 인지 자원을 요구한다,"}, {"e": "effectively lowering the total <b>cognitive load<\/b>", "k": "(그 결과) 총 인지 부하를 효과적으로 낮춘다"}, {"e": "that experts experience.", "k": "전문가들이 경험하는."}], "link": "이 고도로 숙련된 각각의 기술은 비교적 적은 인지 자원을 요구하여, 전문가들이 경험하는 총 인지 부하를 효과적으로 낮춘다.", "easy": "익숙한 기술은 머리를 별로 쓰지 않아도 되니까, 전문가가 느끼는 전체 부담이 줄어들어요.", "gist": "자동화된 기술이 머리의 부담을 줄여 준다는 설명이에요."}, {"n": 4, "ch": [{"e": "② <b>Thus<\/b>,", "k": "② 따라서,"}, {"e": "experts can perform complex tasks", "k": "전문가들은 복잡한 과제를 수행할 수 있다"}, {"e": "and combine multiple tasks relatively easily.", "k": "그리고 여러 개의 과제를 비교적 쉽게 결합할 수 있다."}], "easy": "그래서 전문가는 복잡한 일도, 여러 일을 합치는 것도 비교적 쉽게 해요.", "gist": "1번 문장의 주장을 결론으로 정리해요. (정답 근거)"}, {"n": 5, "ch": [{"e": "③ <b>Furthermore<\/b>,", "k": "③ 게다가,"}, {"e": "beginners are excellent at processing the tasks", "k": "초보자들은 과제를 처리하는 것에 능숙하다"}, {"e": "when the tasks are divided and isolated.", "k": "과제가 분할되고 분리될 때."}], "easy": "게다가 초보자는 일이 잘게 나뉘어 있으면 그 일을 잘 처리한다는 말이에요.", "gist": "전문가 이야기 중에 갑자기 초보자가 능숙하다는 말이 나와요. 흐름과 관계없는 문장(정답)이에요."}, {"n": 6, "ch": [{"e": "④ This is not because", "k": "④ 이것<span class=\"r\">(= 전문가들이 복잡한 과제를 비교적 쉽게 해내는 것)<\/span>은 ~ 때문은 아니다"}, {"e": "they necessarily have more cognitive resources than beginners;", "k": "그들<span class=\"r\">(= 전문가들)<\/span>이 반드시 초보자보다 더 많은 인지 자원을 가지고 있기;"}, {"e": "<b>rather<\/b>, because of the high level of <b>fluency<\/b>", "k": "오히려, 높은 수준의 능숙함 때문에"}, {"e": "they have achieved in performing key skills,", "k": "그들이 핵심 기술을 수행하면서 달성한,"}, {"e": "they can do more with what they have.", "k": "그들은 그들이 가진 것으로 더 많은 것을 할 수 있다."}], "link": "이것은 전문가들이 반드시 초보자보다 인지 자원을 더 많이 가지고 있기 때문이 아니다. 오히려 핵심 기술을 수행하며 달성한 높은 능숙함 덕분에 그들은 가진 것으로 더 많은 것을 할 수 있다.", "easy": "전문가가 머리 쓸 힘(인지 자원)을 더 많이 가져서가 아니라, 기술이 아주 능숙해서 같은 힘으로 더 많은 일을 할 수 있다는 말이에요.", "gist": "②의 이유를 덧붙여요. This가 ②의 내용을 받아요."}, {"n": 7, "ch": [{"e": "⑤ Beginners, <b>on the other hand<\/b>,", "k": "⑤ 반면에, 초보자들은"}, {"e": "have not achieved the same degree of fluency and <b>automaticity<\/b>", "k": "같은 정도의 능숙함과 자동성을 성취하지 못했다"}, {"e": "in each of the component skills,", "k": "각 구성 기술에서,"}, {"e": "and thus they <b>struggle<\/b> to combine skills", "k": "그래서 그들<span class=\"r\">(= 초보자들)<\/span>은 기술들을 결합하는 데 고군분투한다"}, {"e": "that experts combine with relative ease and efficiency.", "k": "전문가들이 비교적 쉽고 효율적으로 결합하는."}], "link": "반면에 초보자들은 각 구성 기술에서 같은 정도의 능숙함과 자동성을 이루지 못해서, 전문가들이 비교적 쉽고 효율적으로 결합하는 기술들을 결합하는 데 고군분투한다.", "easy": "초보자는 기술 하나하나가 아직 익숙하지 않아서, 전문가가 쉽게 합치는 기술도 합치느라 애를 먹어요.", "gist": "초보자와 대조하며 마무리해요. ②·④의 전문가 이야기와 짝을 이뤄요. (정답 근거)"}]}, {"no": "10", "typ": "글의 순서", "src": "2022년 10월 37번", "evn": [3, 4, 5, 6, 7], "ev_en": "But bipedalism was necessary to trigger hand dexterity and tool use. / This creates the ability to use each digit independently in the complex manipulations required for tool use. / But without bipedalism it would be impossible to use the trunk for leverage in accelerating the hand during toolmaking and tool use. / Hashimoto and co-workers concluded that adaptations underlying tool use evolved independently of those required for human bipedalism because in both humans and monkeys, each finger is represented separately in the primary sensorimotor cortex, just as the fingers are physically separated in the hand. / Bipedalism also freed the mouth and teeth to develop a more complex call system as the prerequisite of language.", "ev_ko": [[3, "그런데 두 발 보행은 손재주와 도구 사용을 촉발하기 위해 필요했다."], [4, "(A) 이것은 도구 사용에 필요한 복잡한 조작에서 각 손가락을 독립적으로 사용할 수 있는 능력을 만들어 낸다."], [5, "그러나 두 발 보행이 없다면 도구 제작 및 도구 사용 중 손(놀림)을 가속화할 때 지렛대 역할을 하도록 몸통을 사용하는 것이 불가능할 것이다."], [6, "(B) Hashimoto와 동료들은 도구 사용의 기초가 되는 적응이 인간의 두 발 보행에 필요한 적응과 독립적으로 진화했다고 결론지었는데, 왜냐하면 인간과 원숭이 모두에서 손에 있는 손가락이 물리적으로 나뉘어 있는 것처럼 각 손가락도 1차 감각 운동 피질에 구분되어 나타나기 때문이다."], [7, "(C) 두 발 보행은 또한 입과 치아를 자유롭게 해서 언어의 전제 조건으로서 더 복잡한 소리 신호 체계를 발전시켰다."]], "why": ["주어진 글의 마지막 3번 문장은 두 발 보행과 <b>손재주·도구 사용<\/b>을 연결합니다", "(B)의 6번 문장이 이 이야기를 이어받아, 도구 사용의 기초가 되는 적응과 <b>각 손가락이 감각 운동 피질에 따로 표상된다<\/b>는 점을 설명해요", "(A)의 4번 문장 <b>This<\/b>는 6번 문장의 '각 손가락이 따로 표상됨'을 가리키므로 (A)는 (B) 뒤에 옵니다", "(A)의 5번 문장은 두 발 보행이 없으면 몸통을 지렛대로 쓸 수 없다고 말해요", "(C)의 7번 문장은 <b>also<\/b>(또한)로 두 발 보행의 또 다른 효과(입과 치아를 자유롭게 함)를 덧붙이므로 맨 뒤에 옵니다", "따라서 (B) – (A) – (C)입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)가 주어진 글 바로 뒤에 오면, This가 가리킬 '각 손가락이 따로 표상됨'이 아직 나오지 않은 상태가 됩니다", "3번 문장을 이어 설명하는 (B)가 맨 뒤로 가는 것도 맞지 않아요."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": true, "e": ["(B) 각 손가락이 따로 표상됨 → (A) This가 그것을 받아 손가락을 독립적으로 쓰는 능력으로 연결 → (C) also로 두 발 보행의 또 다른 효과를 덧붙입니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": false, "e": ["(A)의 This는 (B)의 손가락 이야기를 가리켜야 합니다", "이 순서에서는 (A) 바로 앞이 (C)의 언어·뇌 이야기가 되어 This가 가리킬 대상이 맞지 않아요."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(A)가 (B)보다 먼저 나와 This가 가리킬 내용이 없습니다", "또 3번 문장(손재주와 도구 사용)을 이어 설명하는 (B)가 맨 뒤로 밀려나요."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(B) – (A) 순서는 맞지만, (C)가 주어진 글 바로 뒤에 오면 3번 문장(손재주와 도구 사용)과 이를 이어 설명하는 (B) 사이가 끊어집니다."]}], "tr": ["두 발 보행, 즉 직립 보행은 엄청난 진화적 적응을 연쇄적으로 촉발했다.", "그것은 호미닌의 팔을 자유롭게 하여 무기를 휴대하고, 음식을 즉석에서 먹는 대신 집단이 있는 장소로 가져갈 수 있게 해 주 증했습니다", "그래서 은행은 이 방식, 즉 <b>팀 기반의<\/b> 휴식으로 바꾸었어요", "원래는 3번 문장처럼 휴식 시간을 서로 엇갈리게 했다는 점과도 대비됩니다."], "ch": [{"n": "①", "t": "team-based", "g": "팀 기반의", "ok": true, "e": ["6번 문장의 '20명 팀 전체에게 같은 시간에 커피 휴식을 주기'를 한 단어로 줄인 표현입니다", "3번 문장의 엇갈린(staggered) 휴식과 반대예요."]}, {"n": "②", "t": "long-term", "g": "장기간의", "ok": false, "e": ["휴식을 더 길게 했다는 내용은 없습니다", "바뀐 것은 길이가 아니라 팀이 함께 쉬는 방식이에요."]}, {"n": "③", "t": "noise-free", "g": "소음이 없는", "ok": false, "e": ["소음 이야기는 글에 나오지 않습니다."]}, {"n": "④", "t": "time-limited", "g": "시간 제한의", "ok": false, "e": ["휴식 시간을 제한했다는 내용은 없습니다", "실험의 핵심은 팀원들이 같은 시간에 함께 쉬게 한 것이에요(6번)."]}, {"n": "⑤", "t": "leader-initiated", "g": "리더가 추진하는", "ok": false, "e": ["리더가 휴식을 주도했다는 내용은 없습니다", "실험을 제안한 것은 연구자 Pentland였고, 핵심은 팀원들 사이의 상호 작용이에요."]}], "tr": ["MIT의 Alex Pentland의 인간 역학 연구소는 생산성에 중점을 두고 있던 Bank of America(뱅크 오브 아메리카)의 한 대규모 콜센터를 조사했는데, 그 콜센터 한 곳에서 평균적인 통화 처리 시간을 5%만 줄이면 회사가 연간 1백만 달러를 절약할 것으로 보았다.", "그 은행은 직원들을 대략 20명 정도의 팀으로 구성했지만, 그들은 서로 많이 소통하지 않았는데, 부분적으로는 그들의 업무가 전화와 컴퓨터가 있는 칸막이로 만든 좁은 공간에 앉아서 완전히 혼자 하는 것이기 때문이었다.", "게다가 그들은 서로 빈번히 마주칠 가능성이 낮았는데, 그 은행이 직원 채용 수준을(직원의 수를) 안정적으로 유지하기 위해서 휴식 시간을 서로 엇갈리게 했기 때문이다.", "(팀이라는) 용어를 거의 정당화하지 않는 팀이 있었던 것이다(팀이라는 용어에 부합하지 않는 팀이었던 것이다).", "그럼에도 불구하고 구성원들은 서로 조금 소통하긴 했는데, Pentland가 그들에게 6주 동안 사회적 관계를 측정하는 배지를 착용해달라고 요청했을 때, 그(Pentland)는 팀의 생산성의 가장 좋은 예측 변수(팀의 생산성을 가장 잘 예측해주는 요인)가 구성원들이 그들이 갖고 있는 짧은 시간에 얼마나 서로 소통하는지, 그리고 그가 '몰입'이라고 부르는 것, (즉) 모든 구성원들이 상호 작용에 개입하는 정도였다는 것을 알게 되었다.", "그래서 Pentland는 관리자들에게 모든 20명의 팀원에게 동시에 커피 휴식 시간을 주는 실험을 해볼 것을 제안했다.", "3,000명이 넘는 직원들이 있는 콜센터에서 서비스(업무)를 유지하기 위해서 다른 사람들의 휴식 시간을 바꾸는 것은(휴식 시간을 바꿔가며 서비스를 유지하는 것은) 쉬웠다.", "그 결과 비록 여전히 많지는 않았지만 팀원들은 좀 더 상호 작용했고, 그들 중 더 많은 사람들이 상호 작용에 개입했으며 생산성이 급증했다.", "효과는 매우 명확해서 은행은 모든 콜센터에서 팀 기반의 휴식으로 바꾸었고, 이 조치가 연간 1,500만 달러를 절약할 수 있다고 추정했다."], "ps": [{"n": 1, "ch": [{"e": "Alex Pentland's Human Dynamics Laboratory at MIT", "k": "MIT의 Alex Pentland의 인간 역학 연구소는"}, {"e": "<b>investigated<\/b> a huge Bank of America call center", "k": "대규모 Bank of America 콜 e절 + 긴 주어 + S+V+O(to부정사)", "eng": "Because experts have extensive<sup>1</sup> practice within a limited domain<sup>2</sup>, / the key component<sup>3</sup> skills in their domain / tend to be highly practiced and more automated<sup>4</sup>.", "notes": [["1", "extensive", "폭넓은, 광범위한"], ["2", "domain", "영역"], ["3", "component skill", "구성 기술"], ["4", "automated", "자동화된"]], "lit": "전문가들은 제한된 영역 안에서 폭넓은 연습을 하기 때문에, / 그들의 영역에서 핵심적인 구성 기술들은 / 고도로 숙련되고 더 자동화되는 경향이 있다.", "nat": "전문가는 제한된 영역 안에서 아주 많은 연습을 하기 때문에, 그 영역의 핵심 구성 기술들이 고도로 숙련되고 더 자동화되는 경향이 있다.", "ana": "<b>Because</b>가 문두에 오면 뒤에 <b>완전한 문장</b>이 오고, 콤마 뒤부터가 주절이다. 주절의 주어는 <b>the key component skills</b>인데 그 뒤에 <b>in their domain</b>이라는 전치사구가 붙어 주어가 길어졌다. 이럴 때 전치사구를 괄호로 묶으면 <b>skills tend to be ~</b>라는 뼈대가 드러난다. <b>tend to V</b>는 '~하는 경향이 있다'이고, 여기서는 to be 뒤에 <b>practiced</b>와 <b>automated</b> 두 과거분사가 and로 묶인 병렬이다.", "pe": "\u0001Because experts have extensive<sup>1</sup> practice \u0001within a limited domain<sup>2</sup>\u0002\u0002, / the \u0001key component<sup>3</sup>\u0002 skills \u0001in their domain\u0002 / tend to be \u0001highly\u0002 practiced and \u0001more\u0002 automated<sup>4</sup>.", "pk": "\u0001전문가들은 제한된 영역 안에서 폭넓은 연습을 하기 때문에\u0002, / \u0001그들의 영역에서\u0002 \u0001핵심적인 구성\u0002 기술들은 / \u0001고도로\u0002 숙련되고 \u0001더\u0002 자동화되는 경향이 있다.", "core": "기술들은 숙련되고 자동화되는 경향이 있다.", "tags": ["Because절 = 부사절(이유): tend를 꾸밈. within a limited domain = 전치사구(형용사구): practice를 꾸밈", "주어 skills: 동사 tend가 나올 때까지 기다림. key component = 형용사: skills를 꾸밈. in their domain = 전치사구(형용사구): skills를 꾸밈", "동사 tend + to be ~ (to부정사, 목적어) + 보어 practiced and automated (병렬). highly = 부사: practiced를 꾸밈. more = 부사: automated를 꾸밈"], "steps": [{"t": "이 문장은 <b>Because 부사절 + S+V+O(3형식)</b>이다. 주절의 주어가 전치사구로 길어진다."}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: the key component skills (핵심 구성 기술들)", "V: tend (경향이 있다)", "O: to be highly practiced and more automated (고도로 숙련되고 더 자동화되는 것)", "뼈대 = <b>the key component skills tend to be highly practiced and more automated</b>", "in their domain (그들 영역의)은 skills를 꾸미는 형용사구. their = experts (전문가들)"]}, {"t": "<b>Because experts have extensive practice within a limited domain</b>는 <b>부사절(이유)</b>이다. 주절을 꾸민다 (전문가는 제한된 영역 안에서 많은 연습을 하기 때문에).", "sub": ["S: experts (전문가들), V: have (가지다), O: extensive practice (폭넓은 연습)", "within a limited domain (제한된 영역 안에서의) - practice를 꾸미는 형용사구, domain 영역"]}, {"t": "목적어 안의 구조를 본다.", "sub": ["be practiced (숙련되다)와 (be) automated (자동화되다)가 병렬", "highly (고도로)는 practiced를 꾸미는 부사, more (더)는 automated를 꾸미는 부사"]}, {"t": "주어 skills와 동사 tend 사이에 전치사구가 끼어 있다는 점이 함정이다."}], "sum": "전문가는 제한된 영역에서 연습을 많이 해서 핵심 기술이 자동화됨"}, {"i": "05", "q": "09", "s": "6", "title": "S+V+C(not because절) ; rather S+V+O", "eng": "This is not because they necessarily<sup>1</sup> have more cognitive<sup>2</sup> resources than beginners; / rather, because of the high level of fluency<sup>3</sup> / they have achieved<sup>4</sup> in performing key skills, / they can do more with what they have.", "notes": [["1", "necessarily", "반드시"], ["2", "cognitive resources", "인지 자원"], ["3", "fluency", "능숙함, 유창함"], ["4", "achieve", "성취하다, 이루다"]], "lit": "이것은 그들이 반드시 초보자보다 더 많은 인지 자원을 가지고 있기 때문이 아니라, / 오히려 높은 수준의 능숙함 때문에 / 그들이 핵심 기술을 수행하며 성취해 온, / 그들은 가진 것으로 더 많은 것을 할 수 있는 것이다.", "nat": "이는 전문가가 초보자보다 반드시 인지 자원을 더 많이 갖고 있어서가 아니라, 핵심 기술을 수행하며 쌓아 온 높은 능숙함 덕분에 같은 자원으로 더 많은 일을 해낼 수 있기 때문이다.", "ana": "<b>not A; rather B</b>는 'A가 아니라 오히려 B다'라는 대조 틀이다. 앞은 <b>because + 문장</b>, 뒤는 <b>because of + 명사</b>로 형태가 다르다는 점에 주의한다. because 뒤에는 절, because of 뒤에는 명사가 온다. <b>the high level of fluency they have achieved</b>는 fluency <b>which</b> they have achieved에서 <b>목적격 관계대명사가 생략</b>된 형태다. 마지막의 <b>what they have</b>는 '<b>그들이 가진 것</b>'으로, 선행사 없이 명사절을 만드는 관계대명사 what이다.", "pe": "This is not because they \u0001necessarily<sup>1</sup>\u0002 have more \u0001cognitive<sup>2</sup>\u0002 resources \u0001than beginners\u0002; / \u0001rather\u0002, \u0001because of the high level of fluency<sup>3</sup>\u0002 / \u0001they have achieved<sup>4</sup> \u0001in performing key skills\u0002\u0002, / they can do more \u0001with what they have\u0002.", "pk": "이것은 그들이 \u0001반드시\u0002 \u0001초보자보다\u0002 더 많은 \u0001인지\u0002 자원을 가지고 있기 때문이 아니라, / \u0001오히려\u0002 \u0001높은 수준의 능숙함 때문에\u0002 / \u0001그들이 \u0001핵심 기술을 수행하며\u0002 성취해 온\u0002, / 그들은 \u0001가진 것으로\u0002 더 많은 것을 할 수 있는 것이다.", "core": "이것은 그들이 초보자보다 더 많은 인지 자원을 가져서가 아니며, 그들은 더 많은 것을 할 수 있다.", "tags": ["주어 This + 동사 is + 보어 not because절(because절 = 보어 처리). necessarily = 부사: have 꾸밈. cognitive = 형용사: resources 꾸밈. than beginners = 부사구: more 꾸밈", "rather = 부사: 앞 내용과 대비하는 연결어. because of ~ = 전치사구(부사구): can do를 꾸밈 (이유)", "they have achieved ~ = 관계절(형용사절, 목적격 생략): fluency를 꾸밈. in performing key skills = 전치사구(부사구): achieved를 꾸밈", "주어 they + 동사 can do + 목적어 more. with what they have = 전치사구(부사구): do를 꾸밈"], "steps": [{"t": "이 문장은 <b>세미콜론(;)으로 나뉜 두 문장</b>이다. 앞은 부정, 뒤는 진짜 이유를 말한다."}, {"t": "앞 문장의 뼈대를 찾는다.", "sub": ["S: This (이것)", "V: is (be ~이다)", "C: not because they necessarily have more cognitive resources than beginners (그들이 반드시 초보자보다 인지 자원을 더 많이 갖고 있어서가 아님) - because절이 보어", "뼈대 = <b>This is not because ~</b>", "they = experts (전문가들), 앞 문장에서 확인되지 않는 This는 그대로 둠"]}, {"t": "because절 안의 구조를 본다.", "sub": ["S: they, V: have (가지다), O: more cognitive resources (더 많은 인지 자원)", "necessarily (반드시)는 have를 꾸미는 부사, cognitive (인지의)는 resources를 꾸미는 형용사", "than beginners (초보자보다)는 more를 꾸미는 비교 부사구"]}, {"t": "뒤 문장의 뼈대를 찾는다.", "sub": ["S: they (그들)", "V: can do (할 수 있다)", "O: more (더 많은 것)", "뼈대 = <b>they can do more</b>", "rather (오히려)는 앞과 대비하는 연결어"]}, {"t": "수식어 덩어리를 차례로 본다.", "sub": ["because of the high level of fluency (높은 능숙함 때문에) - 전치사구(부사구), can do를 꾸밈", "they have achieved in performing key skills (그들이 핵심 기술을 수행하며 이룬) - fluency를 꾸미는 관계절, 목적격 관계대명사 생략", "with what they have (그들이 가진 것으로) - do를 꾸미는 전치사구, what절은 with의 목적어 (what = ~하는 것)"]}], "sum": "전문가의 강점, 자원이 많아서가 아니라 능숙함 덕에 같은 자원으로 더 해냄"}, {"i": "06", "q": "10", "s": "C-2", "title": "S+V+O + whose 관계절 + 분사구문", "eng": "These developments required larger brains / whose energy cost eventually<sup>1</sup> reached three times the level for chimpanzees<sup>2</sup>, / accounting<sup>3</sup> for up to one-sixth of the total basal metabolic rate<sup>4</sup>.", "notes": [["1", "eventually", "결국"], ["2", "chimpanzee", "침팬지"], ["3", "account for", "~을 차지하다"], ["4", "basal metabolic rate", "기초 대사율"]], "lit": "이러한 발전들은 더 큰 뇌를 필요로 했는데, / 그 뇌의 에너지 비용은 결국 침팬지의 세 배 수준에 이르렀고, / 전체 기초 대사율의 최대 6분의 1을 차지했다.", "nat": "이러한 발전에는 더 큰 뇌가 필요했는데, 그 뇌가 쓰는 에너지 비용은 결국 침팬지의 세 배에 달해 기초 대사율 전체의 최대 6분의 1을 차지하게 되었다.", "ana": "<b>whose</b>는 '<b>그것의</b>'라는 뜻을 품은 <b>소유격 관계대명사</b>다. whose energy cost는 곧 <b>the brains' energy cost</b>이므로, 앞의 larger brains를 받아 '<b>그 뇌의 에너지 비용</b>'으로 읽는다. whose 뒤에는 관사 없이 <b>명사가 바로</b> 온다는 점이 표시다. <b>three times the level</b>은 '<b>배수 + the + 명사</b>' 형태의 배수 표현으로 '그 수준의 세 배'라는 뜻이다. 마지막의 <b>accounting for ~</b>는 <b>분사구문</b>으로, 앞 내용 전체를 받아 '그리하여 ~을 차지하면서'로 이어 읽는다.", "pe": "These developments required \u0001larger\u0002 brains / \u0001whose energy cost eventually<sup>1</sup> reached three times the level \u0001for chimpanzees<sup>2</sup>\u0002\u0002, / \u0001accounting<sup>3</sup> for up to one-sixth \u0001of the total basal metabolic rate<sup>4</sup>\u0002\u0002.", "pk": "이러한 발전들은 \u0001더 큰\u0002 뇌를 필요로 했는데, / \u0001그 뇌의 에너지 비용은 결국 \u0001침팬지의\u0002 세 배 수준에 이르렀고\u0002, / \u0001\u0001전체 기초 대사율의\u0002 최대 6분의 1을 차지했다\u0002.", "core": "이러한 발전들은 뇌를 필요로 했다.", "tags": ["주어 These developments + 동사 required + 목적어 brains. larger = 형용사: brains를 꾸밈", "whose절 = 관계절(형용사절): brains를 꾸밈. for chimpanzees = 전치사구(형용사구): level을 꾸밈", "accounting for ~ = 분사구문(부사적: 결과): 앞 절 내용을 꾸밈. of the total ~ = 전치사구(형용사구): one-sixth를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 뒤에 whose 관계절과 분사구문이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: These developments (이러한 발전들)", "V: required (require 필요로 하다의 과거형)", "O: larger brains (더 큰 뇌들)", "뼈대 = <b>These developments required larger brains</b>"]}, {"t": "<b>whose energy cost eventually rea ."}, {"n": "⑤", "t": "the abrupt ending of the show was hinted to the viewers", "a": false, "x": true, "trap": true, "e": "갑작스러운 결말은 팬들을 <b>분노하게</b> 만든 요소이지 흥행의 이유가 아니다. 게다가 암시되었다는 서술도 없다."}], "w": [["appreciate", "진가를 알아보다"], ["aha moment", "'아하!' 하는 깨달음의 순간"], ["resolution", "해결, 결말"], ["erupt", "폭발하다"], ["indignation", "분개, 분노"], ["deprive A of B", "A에게서 B를 빼앗다"], ["retroactively", "시간을 거슬러"], ["sincere", "진심 어린"], ["thrill", "전율, 흥분"], ["stockpile", "쌓아 두다"], ["riddle", "수수께끼"], ["anguish", "괴로움, 고뇌"]]}, {"q": "08", "type": "빈칸 추론", "src": "2022학년도 9월 32번", "ans": "②", "tr": [["1", "TV를 보는 것처럼 지극히 평범한 행동조차 어떤 사람들에게는 ____________ 하나의 방법일 수 있다."], ["2", "이 생각을 검증하기 위해, Sophia Moskalenko와 Steven Heine은 참가자들에게 시험 성적에 대한 거짓 피드백을 준 다음, 연구의 다음 단계로 각자를 TV 앞에 앉혀 영상을 보게 했다."], ["3", "영상이 켜져 배경 음악과 함께 자연 풍경이 나오자, 실험자는 이건 잘못된 영상이라고 소리치고는 제대로 된 영상을 가지러 가는 척 자리를 떠서, 영상이 돌아가는 동안 참가자를 혼자 남겨 두었다."], ["4", "실패했다는 피드백을 받은 참가자들은 자신이 성공했다고 생각한 참가자들보다 그 영상을 훨씬 더 오래 보았다."], ["5", "연구자들은 텔레비전 시청을 통한 주의 분산이, 고통스러운 실패나 자기와 자기 지침 사이의 불일치와 관련된 불편함을 효과적으로 덜어 줄 수 있다고 결론지었다."], ["6", "반대로, 성공한 참가자들은 자기와 관련된 생각에서 주의를 돌리고 싶은 마음이 거의 없었다!"]], "evh": "5번 문장", "ev": [{"en": true, "h": "The researchers concluded that distraction through television viewing can effectively relieve the discomfort associated with painful failures or mismatches between the self and self-guides."}, {"en": false, "h": "빈칸이 <b>첫 문장</b>에 있으면, 실험을 요약한 <b>결론 문장</b>이 정답을 그대로 말해 준다. 4번 문장에서 <b>실패 피드백을 받은 사람이 영상을 더 오래 봤다</b>는 결과가 나오고, 5번 문장이 그것을 <b>주의 분산이 고통스러운 실패의 불편함을 덜어 준다</b>로 해석한다. 6번 문장은 반대 경우(성공한 사람은 그럴 필요가 없었다)로 다시 확인해 준다. 즉 TV 시청은 <b>괴로운 자기 인식에서 도망치는 방법</b>이다."}], "opts": [{"n": "①", "t": "ignore uncomfortable comments from their close peers", "a": false, "x": true, "trap": false, "e": "또래의 지적이 아니라 <b>자기 자신에 대한 인식</b>이 문제다. peers는 실험에 등장하지 않는다."}, {"n": "②", "t": "escape painful self-awareness through distraction", "a": true, "x": false, "trap": false, "e": "5번 문장의 distraction · discomfort · painful failures를 그대로 압축한 표현이 ghly practiced skills then demands relatively few cognitive resources ~", "a": false, "x": true, "trap": false, "e": "2번 문장의 highly practiced를 그대로 받아 <b>인지 부하가 낮아지는 이유</b>를 설명한다."}, {"n": "②", "t": "Thus, experts can perform complex tasks and combine multiple tasks relatively easily.", "a": false, "x": true, "trap": false, "e": "①의 결과를 Thus로 정리한 문장으로, 1번 문장의 주장과 정확히 맞는다."}, {"n": "③", "t": "Furthermore, beginners are excellent at processing the tasks when the tasks are divided and isolated.", "a": true, "x": false, "trap": false, "e": "글의 주어를 전문가에서 <b>초보자</b>로 바꿔 놓았고, 초보자를 <b>탁월하다</b>고 평가해 ⑤와도 충돌한다."}, {"n": "④", "t": "This is not because they necessarily have more cognitive resources than beginners ~", "a": false, "x": true, "trap": false, "e": "②의 이유를 다시 정교하게 다듬는 문장이다. This가 받을 앞 문장이 ②여야 뜻이 통한다."}, {"n": "⑤", "t": "Beginners, on the other hand, have not achieved the same degree of fluency ~", "a": false, "x": true, "trap": true, "e": "on the other hand로 초보자를 <b>대조 대상</b>으로 꺼내며 글을 마무리한다. ③과 정반대로 초보자가 <b>못한다</b>고 말한다."}], "w": [["suffer", "어려움을 겪다"], ["extensive", "폭넓은, 광범위한"], ["domain", "영역"], ["component skill", "구성 기술"], ["automated", "자동화된"], ["cognitive load", "인지 부하"], ["isolate", "분리하다"], ["necessarily", "반드시"], ["fluency", "능숙함, 유창함"], ["automaticity", "자동성"], ["struggle to V", "~하려고 고군분투하다"], ["efficiency", "효율성"]]}, {"q": "10", "type": "글의 순서", "src": "2022년 10월 37번", "ans": "②", "tr": [["1", "[주어진 글] 두 발 보행, 즉 직립 보행은 엄청난 진화적 적응의 연쇄를 촉발했다. 그것은 호미닌의 팔을 자유롭게 하여 무기를 들고 다니게 했고, 음식을 그 자리에서 먹는 대신 집단이 모인 장소로 가져갈 수 있게 했다. 그런데 두 발 보행은 손재주와 도구 사용을 촉발하는 데 꼭 필요했다."], ["2", "(B) Hashimoto와 동료들은 도구 사용의 기초가 되는 적응이 인간의 두 발 보행에 필요한 적응과는 독립적으로 진화했다고 결론지었는데, 인간과 원숭이 모두에게서 손가락이 손에서 물리적으로 나뉘어 있는 것처럼 각 손가락이 일차 감각 운동 피질에 따로따로 표상되어 있기 때문이다."], ["3", "(A) 이것은 도구 사용에 필요한 복잡한 조작에서 각 손가락을 독립적으로 사용할 수 있는 능력을 만들어 낸다. 그러나 두 발 보행이 없다면 도구 제작과 도구 사용 중에 손을 가속하기 위해 몸통을 지렛대로 쓰는 일은 불가능할 것이다."], ["4", "(C) 두 발 보행은 또한 입과 치아를 자유롭게 하여 언어의 전제 조건인 더 복잡한 신호 체계를 발달시키게 했다. 이러한 발전에는 더 큰 뇌가 필요했는데, 그 뇌가   });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
