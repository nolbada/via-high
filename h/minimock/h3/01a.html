<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

{"t": "이 문장은 <b>가주어 It + S+V+C(2형식)</b>이다. 진주어 that절이 길어서 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (가주어. 진짜 주어는 뒤의 that절)", "V: is (be ~이다)", "C: true (사실인)", "no doubt = 부사구 (의심할 여지 없이). 문장 전체를 꾸민다", "뼈대 = <b>It is true that ~</b>"]}, {"t": "진주어 that절 안의 뼈대를 찾는다.", "sub": ["S: many people (많은 사람들)", "V: are motivated (motivate 동기를 부여하다의 수동태. 수동태라서 1형식)", "뼈대 = <b>many people are motivated</b>", "to carry out creative activities (창의적인 활동을 수행하도록)는 뼈대 밖 수식어이다. motivate A to V (A가 ~하도록 동기를 부여하다)의 수동태라서 to부정사가 뒤에 남은 것이다 (문형 기준). carry out (수행하다), creative (창의적인), activity (활동)"]}, {"t": "<b>because of problems</b>는 전치사구(부사구, 이유)이다. are motivated를 꾸민다 (문제 때문에). because of 뒤에는 절이 아니라 명사가 온다."}, {"t": "<b>they sense in their personal or professional environments</b>는 <b>관계절(형용사절)</b>이다. 목적격 관계대명사가 생략되어 problems를 꾸민다 (그들이 개인적 혹은 직업적 환경에서 감지하는).", "sub": ["sense (감지하다), personal (개인적인), professional (직업적인), environment (환경)"]}], "sum": "사람들이 환경 속 문제 때문에 창의적 활동에 나선다는 것은 사실"}, {"i": "04", "q": "03", "s": "5", "title": "S+V+C + whose 소유격 관계절", "eng": "At the end of the nineteenth century / a number of<sup>1</sup> research projects were underway<sup>2</sup> / whose purpose<sup>3</sup> was the invention<sup>4</sup> of a flying machine.", "notes": [["1", "a number of", "많은"], ["2", "be underway", "진행 중이다"], ["3", "purpose", "목적"], ["4", "invention", "발명"]], "lit": "19세기 말에 / 많은 연구 프로젝트가 진행 중이었다 / 그리고 그 프로젝트들의 목적은 비행 기계의 발명이었다.", "nat": "19세기 말에 비행 기계를 발명하는 것을 목적으로 하는 연구 프로젝트가 여럿 진행되고 있었다.", "ana": "<b>whose</b>는 소유격 관계대명사로 '그리고 그것의'라는 뜻이다. 여기서는 꾸며 주는 명사 <b>research projects</b>와 붙어 있지 않고 동사 <b>were underway</b>를 건너뛰어 뒤에 떨어져 나와 있다. 관계사절이 바로 앞 명사(machine 쪽)를 꾸민다고 착각하기 쉬우니, whose 뒤의 명사(purpose)가 누구의 목적인지를 따져 선행사를 되짚어야 한다. <b>a number of</b>는 '많은'이고 <b>the number of</b>(~의 수)와 뜻이 전혀 다르다.", "pe": "\u0001At the end \u0001of the nineteenth century\u0002\u0002 / a number of<sup>1</sup> research projects were underway<sup>2</sup> / \u0001whose purpose<sup>3</sup> was the invention<sup>4</sup> \u0001of a flying machine\u0002\u0002.", "pk": "\u000119세기 말에\u0002 / 많은 연구 프로젝트가 진행 중이었다 / \u0001그리고 그 프로젝트들의 목적은 비행 기계의 발명이었다\u0002.", "core": "많은 연구 프로젝트가 진행 중이었다.", "tags": ["At the end = 전치사구(부사구, 시간): 문장 전체 꾸밈. of the nineteenth century = 전치사구(형용사구): end 꾸밈", "주어 a number of research projects + 동사 were + 보어 underway (SVC). a number of = '많은'", "<b>whose</b>절 = 관계절(형용사절): research projects 꾸밈. of a flying machine = 전치사구(형용사구): invention 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b> 뒤에 <b>whose 관계절</b>이 붙은 문장이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: a number of research projects (많은 연구 프로젝트들. a number of 많은 + 복수 명사)", "V: were (be ~이다)", "C: underway (진행 중인. 형용사 보어)", "뼈대 = <b>a number of research projects were underway</b>"]}, {"t": "<b>At the end of the nineteenth century</b>는 전치사구(부사구)이다. 문장 전체를 꾸민다 (19세기 말에). end (끝)."}, {"t": "<b>whose purpose was the invention of a flying machine</b>은 <b>소유격 관계절(형용사절)</b>이다. research projects를 꾸민다.", "sub": ["whose purpose = research projects' purpose (그 프로젝트들의 목적)", "S: purpose (목적), V: was (be ~이다), C: the invention of a flying machine (비행 기계의 발명)", "invention (발명), flying machine (비행 기계)"]}, {"t": "함정: whose절이 underway 뒤에 떨어져 있어도 꾸미는 대상은 research projects이다. a number of + 복수 명사라서 동사가 were이다."}], "sum": "19세기 말, 비행 기계 발명을 목적으로 한 연구 여럿 진행"}, {"i": "05", "q": "04", "s": "1", "title": "S+V+O(that절) + if 명사절", "eng": "Moral<sup>1</sup> philosophy textbooks often proclaim<sup>2</sup> / that we can discern<sup>3</sup> / if a claim is ethical / by attending to<sup>4</sup> the use of the words “is” and “ought.”", "notes": [["1", "moral", "도덕의"], ["2", "proclaim", "분명히 말하다, 선언하다"], ["3", "discern", "식별하다"], ["4", "attend to", "~에 주의를 기울이다"]], "lit": "도덕 철학 교과서들은 종종 분명히 말한다 / 우리가 식별할 수 있다고 / 어떤 주장이 윤리에 관한 것인지를 / ‘is’와 ‘ought’라는 단어의 사용에 주의를 기울임으로써.", "nat": "도덕 철학 교과서들은 ‘is’와 ‘ought’라는 단어가 어떻게 쓰였는지만 살피면 어떤 주장이 윤리적인지 가려낼 수 있다고 종종 단언한다.", "ana": "<b>if</b>가 항상 '만약'인 것은 아니다. 여기서는 <b>discern</b>의 목적어 역할을 하는 <b>명사절</b>을 이끌어 '~인지 (아닌지)'라는 뜻이다. '만약 주장이 윤리적이라면'으로 읽으면 discern의 목적어가 사라져 문장이 끊긴다. 맨 뒤의 <b>by attending to</b>는 '~에 주의를 기울임으로써'라는 수단을 나타내며, attend를 '참석하다'로 읽으면 안 된다.", "pe": "\u0001Moral<sup>1</sup>\u0002 philosophy textbooks \u0001often\u0002 proclaim<sup>2</sup> / that we can discern<sup>3</sup> / if a claim is ethical / \u0001by attending to<sup>4</sup> the use \u0001of the words “is” and “ought.”\u0002\u0002", "pk": "\u0001도덕\u0002 철학 교과서들은 \u0001종종\u0002 분명히 말한다 / 우리가 식별할 수 있다고 / 어떤 주장이 윤리에 관한 것인지를 / \u0001‘is’와 ‘ought’라는 단어의 사용에 주의를 기울임으로써\u0002.", "core": "교과서들은 우리가 어떤 주장이 윤리적인지 식별할 수 있다고 단언한다.", "tags": ["주어 textbooks + 동사 proclaim (3형식). Moral = 형용사: philosophy textbooks 꾸밈. often = 부사: proclaim 꾸밈", "<b>that절</b> = proclaim의 목적어. we can discern: discern의 목적어는 아래 if절", "<b>if절 = 명사절</b> ('~인지'): discern의 목적어. '만약'이 아님", "by attending to ~ = 전치사구(부사구, 수단): discern 꾸밈. of the words = 전치사구(형용사구): use 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(that절, 3형식)</b>이다. that절 안에 if 명사절이 또 들어 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Moral philosophy textbooks (도덕 철학 교과서들. Moral philosophy는 \"도덕 철학\"이라는 학문 이름으로 textbooks를 꾸밈)", "V: proclaim (proclaim 선언하다, 분명히 말하다)", "O: that절 (명사절. ~라고)", "often = 부사 (종종). proclaim을 꾸민다", "뼈대 = <b>textbooks proclaim that ~</b>"]}, {"t": "that절 안의 뼈대를 찾는다.", "sub": ["S: we (우리)", "V: can discern (discern 식별하다)", "O: if a claim is ethical (어떤 주장이 윤리적인지). if절이 명사절", "뼈대 = <b>we can discern if a claim is ethical</b>"]}, {"t": "<b>if a claim is ethical</b>에서 if는 \"만약\"이 아니라 <b>\"~인지\"</b>이다. discern의 목적어이므로 명사절이다.", "sub": ["S: a claim (주장), V: is (be ~이다), C: ethical (윤리적인)"]}, {"t": "<b>by attending to the use of the words “is” and “ought.”</b>는 전치사구(부사구, 수단)이다. discern을 꾸민다 (단어 \"is\"와 \"ought\"의 사용에 주의를 기울임으로써).", "sub": ["by 뒤라서 attending은 동명사. attend to (주의를 기울이다)", "the use of the words (단어들의 사용). use 사용"]}, {"t": "함정: if절은 조건절이 아니라 목적어이다. 이 절이 없으면 discern이 불완전해진다."}], "sum": "교과서들, is·ought 단어 사용만 보면 윤리적 주장을 가려낸다고 단언"}, {"i": "06", "q": "04", "s": "8", "title": "Whatever 양보절 + S+V", "eng": "Whatever the is-ought test is tracking<sup>1</sup>, / these claims<sup>2</sup> clearly fall on<sup>3</sup> the ought side of that divide<sup>4</sup>.", "notes": [["1", "track", "찾아내다, 추적하다"], ["2", "claim", "주장"], ["3", "fall on", "~ 쪽에 해당하다"], ["4", "divide", "구분, 경계"]], "lit": "그 is-ought 검사가 무엇을 찾아내고 있든 간에, / 이 주장들은 분명히 그 구분의 ought 쪽에 속한다.", "nat": "is-ought 검사가 무엇을 잡아내는 것이든, 이 주장들은 분명히 ought 쪽에 놓인다.", "ana": "<b>Whatever</b>는 여기서 '무엇이든지'라는 명사절이 아니라 <b>'무엇을 ~하든 간에'</b>라는 양보 부사절을 이끈다. 뒤에 완전한 주절(these claims fall ~)이 따로 나오는 것이 그 증거다. 양보절은 주절의 판단을 흔들지 않는다는 신호이므로, 콤마 뒤의 주절이 진짜 하고 싶은 말이다.", "pe": "\u0001Whatever the is-ought test is tracking<sup>1</sup>\u0002, / these claims<sup>2</sup> \u0001clearly\u0002 fall \u0001on<sup>3</sup> the ought side \u0001of that divide<sup>4</sup>\u0002\u0002.", "pk": "\u0001그 is-ought 검사가 무엇을 찾아내고 있든 간에\u0002, / 이 주장들은 \u0001분명히\u0002 \u0001그 구분의 ought 쪽에\u0002 속한다.", "core": "이 주장들은 속한다.", "tags": ["<b>Whatever절</b> = 양보 부사절: 주절 전체를 꾸밈 ('무엇을 ~하든'). 안쪽 tracking의 목적어가 Whatever", "주어 claims + 동사 fall (1형식). clearly = 부사: fall 꾸밈. on ~ side = 거의 필수에 가까운 부사구: 동사 꾸밈. of that divide = 전치사구(형용사구): side 꾸밈"], "steps": [{"t": "이 문장은 <b>Whatever 양보 부사절 + S+V(1형식)</b>이다. Whatever가 맨 앞에 와서 어려워 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: these claims (이 주장들)", "V: fall (fall 속하다, 떨어지다)", "clearly = 부사 (분명히). fall을 꾸민다", "뼈대 = <b>these claims fall</b>"]}, {"t": "<b>on the ought side</b>는 전치사구(부사구)이다. fall을 꾸민다 (ought 쪽에). 이 위치를 말해 줘야 문장이 의미가 통하므로 거의 필수에 가깝다 (문형 기준). <b>of that divide</b>는 전치사구(형용사구)이다. side를 꾸민다 (그 구분의). divide (구분, 경계)."}, {"t": "<b>Whatever the is-ought test is tracking</b>은 <b>양보 부사절</b>이다. 주절 전체를 꾸민다 (무엇을 ~하든).", "sub": ["S: the is-ought test (is-ought 검사), V: is tracking (track 추적하다, 찾아내다)", "Whatever = tracking의 목적어가 앞으로 나온 말 (무엇을 ~하든 간에)"]}, {"t": "함정: Whatever는 주어가 아니다. tracking의 목적어 자리가 비어 있고 그 자리 말이 앞으로 나온 것이다."}], "sum": "검사가 무엇을 찾든, 이 주장들은 분명히 ought 쪽에 속함"}, {"i": "07", "q": "05", "s": "1", "title": "point to A as B + what절 + 동격", "eng": "Most historians of science point to<sup>1</sup> the need for a reliable<sup>2</sup> calendar / to regulate<sup>3</sup> agricultural activity / as the motivation for learning about / what we now call astronomy<sup>4</sup>, the study of stars and planets.", "notes": [["1", "point to", "~을 지적하다, 가리키다"], ["2", "reliable", "믿을 만한"], ["3", "regulate", "규제하다, 조절하다"], ["4", "astronomy", "천문학"]], "lit": "대부분의 과학 역사가들은 믿을 만한 달력의 필요성을 지적한다 / 농업 활동을 규제하기 위한 / ~에 대해 배우려는 동기로서 / 오늘날 우리가 천문학, 즉 별과 행성에 관한 연구라고 부르는 것.", "nat": "대부분의 과학사가는 농업 활동을 조절할 믿을 만한 달력이 필요했다는 점을, 오늘날 우리가 천문학이라 부르는 것 — 즉 별과 행성에 관한 연구 — 을 배우게 된 동기로 지적한다.", "ana": "<b>point to A as B</b>(A를 B로 지적하다)가 뼈대인데, A(the need ~ activity)가 길어져 as가 한참 뒤에 나온다. as를 '~처럼'으로 읽으면 구조가 무너진다. <b>what we now call astronomy</b>의 <b>what</b>은 선행사를 품은 관계대명사로 '우리가 ~라고 부르는 것'이며, 뒤의 <b>the study of stars and planets</b>는 콤마로 이어진 <b>동격</b>이다.", "pe": "Most historians \u0001of science\u0002 point \u0001to<sup>1</sup> the need for a reliable<sup>2</sup> calendar\u0002 / \u0001to regulate<sup>3</sup> agricultural activity\u0002 / \u0001as the motivation for learning about\u0002 / \u0001what we now call astronomy<sup>4</sup>, the study of stars and planets\u0002.", "pk": "대부분의 \u0001과학\u0002 역사가들은 \u0001믿을 만한 달력의 필요성을\u0002 지적한다 / \u0001농업 활동을 규제하기 위한\u0002 / \u0001~에 대해 배우려는 동기로서\u0002 / \u0001오늘날 우리가 천문학, 즉 별과 행성에 관한 연구라고 부르는 것\u0002.", "core": "대부분의 역사가는 지적한다.", "tags": ["주어 historians + 동사 point (1형식). of science = 형용사구: historians 꾸밈. to the need ~ = 전치사구(부사구): point 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "to regulate ~ = to부정사(형용사적): calendar 꾸밈 (위 to구 안쪽). for a reliable calendar = 전치사구(형용사구): need 꾸밈", "as the motivation for learning about = 전치사구(부사구): point 꾸밈 (point to A as B: as B는 보어 아님) [기준: 모양 규칙]", "what절 = 전치사 about의 목적어(명사절), as구의 일부. 안쪽 call A B (5형식). the study of ~ = 동격: astronomy 설명. now = 부사: call 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>인데 뒤에 전치사구가 연달아 붙고 what절과 동격까지 있어 아주 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Most historians (대부분의 역사가들). of science (과학의)는 historians를 꾸미는 형용사구", "V: point (point to ~을 지적하다, 가리키다)", "뼈대 = <b>Most historians point</b>"]}, {"t": "<b>to the need for a reliable calendar to regulate agricultural activity</b>는 point에 붙는 전치사구(부사구)이다. 거의 필수에 가까워 같이 본다 (문형 기준).", "sub": ["the need (필요성), for a reliable calendar (믿을 만한 달력에 대한). reliable 믿을 만한", "to regulate agricultural activity = to부정사(형용사적). calendar를 꾸민다 (농업 활동을 규제하기 위한). regulate 규제하다, agricultural 농업의"]}, {"t": "<b>as the motivation for learning about ~</b>는 전치사구(부사구)이다. point를 꾸민다 (~을 배우려는 동기로서). point to A as B (A를 B로 지적하다)에서 as B는 보어가 아니다 (문형 기준).", "sub": ["motivation (동기), for 뒤라서 learning은 동명사"]}, {"t": "<b>what we now call astronomy</b>는 about의 목적어인 <b>명사절</b>이다 (우리가 지금 천문학이라 부르는 것).", "sub": ["call A B (A를 B라고 부르다)의 A 자리가 what으로 앞에 나갔다", "now = 부사 (지금), astronomy (천문학)"]}, {"t": "<b>the study of stars and planets</b>는 astronomy를 풀어 주는 <b>동격</b>이다 (별과 행성에 관한 연구). study (연구), planet (행성).", "sub": ["함정: what은 call의 목적어 자리가 앞으로 나온 말이다. 그리고 as B는 보어가 아니라 point를 꾸미는 부사구이다."]}], "sum": "과학사가들, 농업용 달력의 필요가 천문학을 배운 동기라고 지적"}, {"i": "08", "q": "06", "s": "8", "title": "contrast A with B 분리 + 삽입 분사구 + in which", "eng": "Some fifty years ago one US economist contrasted<sup>1</sup> / what he called the “cowboy” economy, / bent on<sup>2</sup> production, exploitation<sup>3</sup> of resources, and pollution, / with the “spaceman” economy, / in which quality and complexity<sup>4</sup> replaced “throughput<sup>5</sup>” as the measure of success.", "notes": [["1", "contrast A with B", "A와 B를 대조하다"], ["2", "be bent on", "~에 집중하다"], ["3", "exploitation", "착취, 이용"], ["4", "complexity", "복잡성"], ["5", "throughput", "처리량"]], "lit": "약 50년 전 한 미국 경제학자는 대조했다 / 그가 ‘카우보이’ 경제라고 부른 것을 / 생산, 자원 착취, 그리고 오염에 집중하는 / ‘우주인’ 경제와 / 그리고 그 경제에서는 품질과 복잡성이 성공의 척도로서 ‘처리량’을 대체했다.", "nat": "약 50년 전 한 미국 경제학자는 생산과 자원 착취, 오염에만 매달리는 이른바 ‘카우보이’ 경제를, 품질과 복잡성이 ‘처리량’을 대신해 성공의 잣대가 되는 ‘우주인’ 경제와 대비시켰다.", "ana": "<b>contrast A with B</b>가 뼈대인데 A와 B 사이에 분사구가 끼어들어 with가 아주 멀리 떨어졌다. <b>Some fifty years</b>의 <b>some</b>은 '어떤'이 아니라 숫자 앞에서 '약, 대략'이다. 삽입된 <b>bent on ~</b>은 <b>which was bent on</b>에서 '관계대명사 + be동사'가 빠진 형태로 앞의 economy를 꾸민다. 마지막 <b>in which</b>는 '전치사 + 관계대명사'로 '그리고 그 경제 안에서는'처럼 풀어 읽으면 된다.", "pe": "\u0001Some fifty years ago\u0002 one US economist contrasted<sup>1</sup> / what he called the “cowboy” economy, / \u0001bent on<sup>2</sup> production, exploitation<sup>3</sup> \u0001of resources\u0002, and pollution\u0002, / \u0001with the “spaceman” economy\u0002, / \u0001in which quality and complexity<sup>4</sup> replaced “throughput<sup>5</sup>” as the measure of success\u0002.", "pk": "\u0001약 50년 전\u0002 한 미국 경제학자는 대조했다 / 그가 ‘카우보이’ 경제라고 부른 것을 / \u0001생산, 자원 착취, 그리고 오염에 집중하는\u0002 / \u0001‘우주인’ 경제와\u0002 / \u0001그리고 그 경제에서는 품질과 복잡성이 성공의 척도로서 ‘처리량’을 대체했다\u0002.", "core": "한 경제학자는 그가 '카우보이' 경제라 부른 것을 대비시켰다.", "tags": ["Some fifty years ago = 부사구(시간): contrasted 꾸밈 ('약'). 주어 economist + 동사 contrasted (3형식)", "<b>what절</b> = contrasted의 목적어. he called A B (5형식): 그가 ~라고 부른 것", "bent on ~ = 분사구(형용사적): economy 꾸밈. of resources = 전치사구(형용사구): exploitation 꾸밈", "with ~ economy = 전치사구(부사구): contrasted 꾸밈, 거의 필수에 가까운 부사구 (contrast A with B, 3형식) [기준: 모양 규칙]", "<b>in which</b>절 = 관계절(형용사절): the spaceman economy 꾸밈. 안쪽 quality and complexity replaced throughput"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. contrast A with B에서 A와 B가 멀리 떨어져 있고 사이에 삽입이 있어 아주 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: one US economist (한 미국 경제학자)", "V: contrasted (contrast 대비시키다의 과거형)", "O: what he called the “cowboy” economy (그가 \"카우보이\" 경제라고 부른 것)", "뼈대 = <b>one US economist contrasted what he called the “cowboy” economy with the “spaceman” economy</b>", "Some fifty years ago = 부사구 (약 50년 전). some은 \"약\""]}, {"t": "O 안의 what절을 본다.", "sub": ["S: he, V: called (call A B A를 B라고 부르다의 과거형)", "what = A 자리, the “cowboy” economy = B (카우보이 경제)"]}, {"t": "<b>bent on production, exploitation of resources, and pollution</b>은 <b>과거분사구(형용사구)</b>이다. 삽입되어 “cowboy” economy를 꾸민다 (생산, 자원 착취, 오염에 몰두하는).", "sub": ["be bent on (~에 열중하다, 몰두하다). exploitation (착취), resource (자원), pollution (오염)"]}, {"t": "<b>with the “spaceman” economy</b>는 contrast A with B의 전치사구이다. 거의 필수에 가까워 같이 본다 (문형 기준). 우주인 경제와 대비시켰다는 뜻이다."}, {"t": "<b>in which quality and complexity replaced “throughput” as the measure of success</b>는 <b>전치사 + 관계대명사</b> 관계절(형용사절)이다. the “spaceman” economy를 꾸민다.", "sub": ["in which = in the spaceman economy (그 우주인 경제에서는)", "S: quality and complexity (품질과 복잡성), V: replaced (replace 대체하다), O: “throughput” (처리량)", "as the measure of success (성공의 척도로서). measure 척도, success 성공", "함정: contrasted와 with가 멀리 떨어져 있다. 사이의 bent on ~ 덩어리는 economy를 꾸미는 삽입이다."]}], "sum": "생산·착취에 몰두한 카우보이 경제와 품질·복잡성을 중시하는 우주인 경제 대비"}], "qs": [{"q": "01", "type": "필자 목적", "src": "2018학년도 6월 18번", "ans": "①", "tr": [["1", "Stevens 씨께,"], ["2", "저는 의 편집장입니다.<br>3 지난주에 저희 직원이 알려 드린 대로, 귀하의 단편 소설은 Novel Flash Fiction 12월 호에 실릴 예정입니다.<br>4 저희는 귀하가 그 이야기를 어떻게 구상하게 되었는지 듣는 것이 저희 독자들에게 의미가 있으리라 생각했습니다.<br>5 그래서 저희는 귀하께서 집필 과정에 관해 강연을 해 주실 수 있는지 여쭙고자 합니다.<br>6 이 강연은 한 시간 정도 이어질 것으로 예상되며, 시내에 있는 Star 서점에서 열릴 것입니다.<br>7 귀하의 일정에 따라 구체적인 날짜와 시간을 고르실 수 있습니다.<br>8 궁금한 점이 있으시면 editors@nff.com으로 이메일 주시기 바랍니다.<br>9 귀하가 그 이야기를 어떻게 쓰셨는지 듣게 되기를 기대하겠습니다.<br>10 진심을 담아, Susanna Martinez 드림<br>"]], "evh": "5번 문장", "ev": [{"en": true, "h": "We would thus like to ask if you could give a speech about your writing process."}, {"en": false, "h": "편지글의 목적은 <b>would like to ask</b>, <b>I am writing to</b> 같은 <b>요청 표현</b>이 나오는 문장에 거의 항상 들어 있다. 여기서는 '집필 과정(writing process)에 관한 강연(speech)을 해 주실 수 있는지 여쭙고자 한다'가 편지 전체의 용건이고, 뒤의 문장들(시간·장소·날짜 선택)은 모두 그 강연을 위한 부가 정보이다."}], "opts": [{"n": "①", "t": "소설 창작 과정에 관한 강연을 요청하려고", "a": true, "x": false, "trap": false, "e": "give a speech about your writing process가 '집필(창작) 과정에 관한 강연'과 그대로 겹친다. 뒤이어 시간·장소·일정까지 안내하는 것도 강연 요청 편지의 전형적인 흐름이다."}, {"n": "②", "t": "강연 일정이 변경된 것에 대해 사과하려고", "a": false, "x": true, "trap": true, "e": "강연 일정은 아직 정해지지도 않았고, 오히려 '일정에 따라 고르시라'고 열어 두었다. 사과 표현도 전혀 없다."}, {"n": "③", "t": "새로 발간된 잡지의 정기 구독을 권유하려고", "a": false, "x": true, "trap": false, "e": "잡지 이름과 12월 호가 언급되지만 구독(subscription)을 권하는 말은 한 줄도 없다. 잡지는 상대의 소설이 실릴 지면일 뿐이다."}, {"n": "④", "t": "출판물 편집에 관한 유의 사항을 안내하려고", "a": false, "x": true, "trap": false, "e": "보낸 사람이 편집장(chief editor)이라 '편집'이라는 단어가 떠오르지만, 편집 시 유의할 점을 알려 주는 내용은 없다."}, {"n": "⑤", "t": "잘못된 기사 내용에 대해 정정을 요구하려고", "a": false, "x": true, "trap": false, "e": "오류나 정정(correction)에 관한 언급이 전혀 없다. 글 전체가 우호적인 요청 톤이다."}], "w": [["chief editor", "편집장"], ["inform", "알리다"], ["issue", "(잡지의) 호"], ["come up with", "~을 구상하다, 생각해 내다"], ["meaningful", "의미 있는"], ["thus", "따라서"], ["be expected to V", "~할 것으로 예상되다"], ["take place", "열리다"], ["depending on", "~에 따라"], ["look forward to v-ing", "~하기를 기대하다"]]}, {"q": "02", "type": "필자 주장", "src": "2020학년도 6월 20번", "ans": "①", "tr": [["1", "'분자'와 같은 어떤 개념을 배우는 일은 그 개념을 단 한 번 접하는 것 이상을 요구한다."], ["2", "학생이 어떤 과학 개념을 기억하려 한다면, 그 학생은 그것을 여러 번, 그리고 다양한 맥락에서 경험해야 한다."], ["3", "그것이 바로 순환 학습이 가진 강점 중 하나이다. 학생들은 그 개념을 직접 경험하고, 그것에 대해 이야기하고, 그런 다음 훨씬 더 직접적인 경험을 한다."], ["4", "읽고, 영상을 보고, 다른 사람의 생각을 들어 보는 것이 그 개념을 더 단단하게 이해하는 데 기여한다."], ["5", "이는 단순한 반복 이상을 시사한다."], ["6", "각각의 경우가 학생으로 하여금 그 개념을 다른 관점에서 검토하게 해 준다."], ["7", "궁극적으로 이것은 그 개념의 복잡한 특징과 미묘한 차이에 대한 실질적이고 유용한 이해로 이어질 것이다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "If a student is going to remember a science concept, he or she should experience it multiple times and in various contexts."}, {"en": false, "h": "주장 문항에서는 <b>should</b>가 붙은 문장을 먼저 찾는다. 이 글에서 should가 나오는 유일한 문장이 '여러 번(multiple times) 그리고 다양한 맥락(in various contexts)에서 경험해야 한다'이며, 마지막 문장의 <b>more than repetition</b>(단순 반복 이상)도 '여러 번 + 다양한 방식'을 다시 확인해 준다."}], "opts": [{"n": "①", "t": "과학 개념을 학습하려면 다양한 방식으로 여러 번 접해야 한다.", "a": true, "x": false, "trap": false, "e": "multiple times(여러 번)와 in various contexts(다양한 맥락에서)를 한 문장으로 합친 것이 그대로 이 선택지이다."}, {"n": "②", "t": "복잡한 과학 개념을 이해하기 위해서는 암기가 선행되어야 한다.", "a": false, "x": true, "trap": true, "e": "암기(memorization)는 언급되지 않고, 오히려 마지막에 '단순 반복 이상'이라며 기계적 되풀이와 거리를 둔다."}, {"n": "③", "t": "효과적인 과학 학습을 위해 기본 개념을 숙지할 필요가 있다.", "a": false, "x": true, "trap": false, "e": "기본 개념(fundamental concept)의 우선순위를 다루는 글이 아니다. 쟁점은 '무엇을 먼저 배우냐'가 아니라 '몇 번, 어떤 방식으로 접하느냐'이다."}, {"n": "④", "t": "과학 원리는 쉬운 것부터 어려운 것 순으로 가르쳐야 한다.", "a": false, "x": true, "trap": false, "e": "난이도 순서(easy → difficult)에 관한 언급이 전혀 없다."}, {"n": "⑤", "t": "다양한 시각 자료를 활용하여 과학 수업을 진행해야 한다.", "a": false, "x": true, "trap": false, "e": "watching videos가 한 번 나오지만 이는 여러 접근 방식 가운데 하나의 예일 뿐, 시각 자료(visual materials)를 강조하는 글이 아니다."}], "w": [["molecule", "분자"], ["exposure", "노출, 접함"], ["multiple", "여러 번의"], ["context", "맥락, 문맥"], ["contribute to", "~에 기여하다"], ["solid", "견고한, 탄탄한"], ["repetition", "반복"], ["perspective", "관점, 시각"], ["substantive", "실질적인, 중요한"], ["complexities", "복잡한 특징들"]]}, {"q": "03", "type": "요지", "src": "2020년 7월 22번", "ans": "②", "tr": [["1", "창의적인 과정을 시작하게 하는 데 문제에 대한 민감성이 중요하다는 기본적인 생각에 대해 의문이 제기될 수 있다."], ["2", "많은 사람이 개인적·직업적 환경에서 감지한 문제 때문에 창의적인 활동을 수행하도록 동기를 부여받는다는 것은 의심할 여지 없이 사실이다."], ["3", "그러나 발명이라는 영역에서조차 창의적인 과정이 필요 없이도 시작될 수 있다는 역사적 증거가 있다."], ["4", "한 가지 예로, 비행기의 발명을 생각해 보라."], ["5", "19세기 말에 비행 기계를 발명하는 것을 목적으로 하는 연구 프로젝트가 여럿 진행되고 있었다."], ["6", "그 당시에는 그런 기계가 필요하지 않았다. 라이트 형제가 비행기를 발명하는 데 성공하고 나서야 비로소 그 발명이 지닌 더 폭넓은 영향이 점차 분명해졌다."], ["7", "따라서 비행기 발명 뒤에 있던 원동력은 필요가 아니었던 것으로 보인다. 날아야 할 '필요'가 있었던 것이 아니라, 사람들이 단순히 날기를 '원했던' 것이다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "So the driving force behind the invention of the airplane seems not to have been necessity: There was no need to fly; people simply wanted to."}, {"en": false, "h": "요지는 <b>So</b>, <b>Thus</b> 같은 결론 신호 뒤에 있다. 마지막 문장이 <b>need</b>(필요)와 <b>wanted</b>(원함)를 콜론으로 맞세워 '필요해서 만든 게 아니라 원해서 만든 것'이라고 못 박는다. 앞의 <b>without necessity</b>(필요 없이도)와 짝을 이루므로, '필요가 창의성의 필수 조건은 아니다'가 글의 결론이다."}], "opts": [{"n": "①", "t": "논리적 사고는 창의력 발휘를 저해한다.", "a": false, "x": true, "trap": false, "e": "논리적 사고(logical thinking)와 창의력을 대립시키는 내용은 어디에도 없다."}, {"n": "②", "t": "필요는 창의성 발현을 위한 필수 조건이 아니다.", "a": true, "x": false, "trap": false, "e": "without necessity(필요 없이도 창의적 과정이 시작될 수 있다)와 마지막의 'There was no need to fly'가 그대로 이 문장이다."}, {"n": "③", "t": "다양한 경험이 반드시 발명에 유익한 것은 아니다.", "a": false, "x": true, "trap": false, "e": "경험(experience)의 유익함을 따지는 글이 아니다. 부분 부정 표현에 끌려 고르기 쉬운 함정이다."}, {"n": "④", "t": "문제 해결 능력은 문제에 대한 민감성에서 비롯된다.", "a": false, "x": true, "trap": true, "e": "첫 문장에 나오는 '문제에 대한 민감성'은 필자가 <b>의문을 제기하는 대상</b>이지 주장하는 바가 아니다. 첫 문장만 읽고 고르면 정반대가 된다."}, {"n": "⑤", "t": "창의적 산출물을 만들기 위해 지식의 축적이 필요하다.", "a": false, "x": true, "trap": false, "e": "지식의 축적(accumulation of knowledge)은 언급되지 않는다."}], "w": [["raise a question", "의문을 제기하다"], ["notion", "생각, 개념"], ["sensitivity", "민감성, 예민함"], ["set A in motion", "A를 시작하게 하다"], ["carry out", "수행하다"], ["necessity", "필요(성)"], ["domain", "영역, 범위"], ["be underway", "진행 중이다"], ["implication", "영향, 함축"], ["apparent", "분명한, 명백한"], ["driving force", "원동력"]]}, {"q": "04", "type": "제목", "src": "2021년 4월 24번", "ans": "③", "tr": [["1", "도덕 철학 교과서들은 'is'와 'ought'라는 단어가 어떻게 쓰였는지에 주의를 기울이면 어떤 주장이 윤리에 관한 것인지 가려낼 수 있다고 종종 단언한다."], ["2", "이 제안에 따르면, '너는 약속을 지켜야 한다'라는 주장은 'ought'를 쓰고 있기 때문에 윤리적이다."], ["3", "'원자는 작다'는 'is'를 쓰고 있기 때문에 윤리와 관련이 없다."], ["4", "그러나 흔히 인용됨에도 불구하고, 이 is-ought 검사는 심각한 결함이 있다."], ["5", "어떤 is 진술은 윤리적 내용을 담고 있고, 어떤 ought 진술은 그렇지 않다."], ["6", "예를 들어 '살인은 옳지 않다'와 '우정은 좋다'라는 주장을 생각해 보라."], ["7", "이 주장들은 분명히 윤리적 내용을 담고 있다."], ["8", "is-ought 검사가 무엇을 잡아내는 것이든, 이 주장들은 분명히 그 구분의 ought 쪽에 놓인다."], ["9", "그런데도 두 문장 모두 'is'를 쓰고 있다."], ["10", "비슷하게 '그 기차는 한 시간 안에 도착해야 한다'라는 주장을 생각해 보라."], ["11", "이 진술은 'ought'를 쓰고 있음에도 명백히 윤리와 무관하다."], ["12", "윤리적 주장과 윤리와 무관한 주장 사이에는 중요한 차이가 있다."], ["13", "그러나 우리는 그 구분을 하기 위해 단순히 'is'와 'ought'에 의존할 수는 없다."], ["14", "대신 우리는 그 주장의 핵심(내용)에 주의를 기울여야 한다."]], "evh": "14번 문장", "ev": [{"en": true, "h": "But we can't simply rely on “is” and “ought” to make it. Instead we need to attend to the substance of the claim."}, {"en": false, "h": "제목 문항은 <b>필자가 반박하는 대상</b>과 <b>대안</b>을 함께 담은 선택지를 골라야 한다. 이 글은 '단어(is/ought)로 윤리성을 판별한다'는 통념을 부정하고, 마지막에 <b>the substance of the claim</b>(주장의 내용)에 주목하라고 대안을 제시한다. 즉 쟁점은 <b>단어 선택이냐 내용이냐</b>이다."}], "opts": [{"n": "①", "t": "Mutually Exclusive Relationship Between “Is” and “Ought” ('Is'와 'Ought' 사이의 상호 배타적인 관계)", "a": false, "x": true, "trap": false, "e": "글은 오히려 is 문장에도 윤리적 내용이 있고 ought 문장에도 비윤리적인 것이 있다고 하여 둘이 <b>깔끔히 갈리지 않는다</b>고 말한다. 배타적 관계라는 말은 정반대이다."}, {"n": "②", "t": "Sounds Unethical to You? Check Your Moral Standard First (비윤리적인 것처럼 들리는가? 당신의 도덕 규범을 먼저 확인하라)", "a": false, "x": true, "trap": false, "e": "개인의 도덕 기준을 점검하라는 조언 글이 아니다. 윤리성 <b>판별 기준</b>에 관한 논의이다."}, {"n": "③", "t": "What Determines Ethicality of a Claim, Word Choice or Content? (무엇이 주장의 윤리성을 결정하는가, 단어 선택인가 내용인가?)", "a": true, "x": false, "trap": false, "e": "글 전체가 '단어(is/ought)'와 '내용(substance)'을 맞세우고 마지막에 내용 쪽 손을 들어 준다. 두 후보를 그대로 제목에 담은 유일한 선택지이다."}, {"n": "④", "t": "How We Can Get to Harmony of Linguistic Forms and Functions (어떻게 언어의 형태와 기능의 조화를 이룰 수 있는가)", "a": false, "x": true, "trap": true, "e": "언어학적 형태와 기능의 조화를 모색하는 글이 아니다. linguistic이라는 단어의 인상에 끌리기 쉽다."}, {"n": "⑤", "t": "To Use “Is” or “Ought,” That Is the Key to Ethical Statements! ('Is'를 쓸 것인가 'Ought'를 쓸 것인가, 그것이 윤리적 진술의 핵심이다!)", "a": false, "x": true, "trap": false, "e": "필자가 <b>부정하는</b> 통념을 그대로 제목으로 만든 것이다. 4번 문장의 seriously deficient를 놓치면 이 선택지에 걸린다."}], "w": [["moral philosophy", "도덕 철학"], ["proclaim", "분명히 나타내다, 선언하다"], ["discern", "식별하다, 알아차리다"], ["attend to", "~에 주의를 기울이다"], ["ethical", "윤리에 관한, 윤리적인"], ["invoke", "(예시를) 언급하다, 호소하다"], ["deficient", "결함이 있는"], ["track", "찾아내다, 추적하다"], ["notwithstanding", "~에도 불구하고"], ["distinction", "차이, 대조"], ["substance", "핵심, 본질"]]}, {"q": "05", "type": "어법 정확성", "src": "2022학년도 6월 29번", "ans": "⑤", "tr": [["1", "대부분의 과학사가는 농업 활동을 조절할 믿을 만한 달력이 필요했다는 점을, 오늘날 우리가 천문학 — 즉 별과 행성에 관한 연구 — 이라 부르는 것을 배우게 된 동기로 지적한다."], ["2", "초기 천문학은 작물을 언제 심어야 할지에 관한 정보를 주었고, 인간에게 시간의 흐름   s.ch.forEach(c=>{x+='<div class="ch"><div class="ce">'+String(c.e).replace(/<\/?b>/g,'')+'</div><div class="ck">'+c.k+'</div></div>';});
  const lays=[];
  if(s.link)lays.push(['이어 읽으면',s.link]);
  if(s.easy)lays.push(['쉬운 말로',s.easy]);
  if(s.gist)lays.push(['결국 이 얘기',s.gist]);
  lays.forEach(l=>{x+='<div class="lay"><span class="lb">'+l[0]+'</span>'+l[1]+'</div>';});
  if(lays.length)x+='<button class="stg" data-names="'+lays.map(l=>l[0]).join('|')+'">'+lays[0][0]+'</button>';
  return x+'</div>';
}
function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  if(c.steps&&c.steps.length){x+='<div class="lay th"><div class="hd">이 문장 읽는 순서</div><ol>'+c.steps.map(p=>'<li>'+p.t+(p.sub||[]).map(u=>'<div class="sub">'+u+'</div>').join('')+'</li>').join('')+'</ol></div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';
  app.innerHTML=h;
}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
