<title>고3 미니모의고사 1회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}
.sc .lay.ana{background:#fff8e6;border-color:#f0dcc0;color:#4d3b05}
.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}
.evx .en{background:#fff;border:1px solid #d5eadc;font-size:15.5px;margin:0 0 8px}
.evx p{margin:6px 0;font-size:15.5px;line-height:1.75}
.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}
.opx .mk{display:inline-block;min-width:22px;font-weight:800;color:var(--sub);margin-right:4px}
.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}
.opx p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:#333}
.opx .xm{color:var(--bad);font-weight:800;margin-right:3px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
details.sub2>summary:after{content:"+";margin-left:auto;font-size:18px;color:var(--sub)}
details.sub2[open]>summary:after{content:"\2212"}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}
.ch.open .ct{display:block}

.sc .ch{background:#fafbfe;border:1px solid #e8ecf5;border-bottom:1px solid #e8ecf5;padding:10px 12px}
.sc .ce{font-size:18px;line-height:1.5;font-weight:800;color:#c62828}

.cks{margin:0 0 6px}.cchip{display:inline-block;font-size:12.5px;font-weight:700;color:#1f6f5f;background:#e5f4f0;border:1px solid #bfe3da;border-radius:999px;padding:4px 10px;text-decoration:none;margin:2px 4px 2px 0}

.sc .sc-b{background:#fff}

.sc .fin.n2{background:#fff8e1;border-color:#f0e2b0;border-left-color:#d9a21b}.sc .fin.n2 b{color:#8a6d00}


.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}
.rst:before{content:"결국 이 얘기  ";font-size:11.5px;font-weight:800;color:#8a6d00}

.wc{padding:14px 0;border-bottom:1px solid var(--line)}

(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}

  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);

    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});

    var d=document.createElement('div');

    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

function dwToast(m){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1800);}
function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}
document.addEventListener('click',function(e){
  const el=e.target.closest&&e.target.closest('.dw');if(!el)return;
  e.stopPropagation();e.preventDefault();
  const p=el.closest('[data-q]');const it=p&&dwItem(p.dataset.q,el.dataset.k);if(!it)return;
  const head=it[2]||it[0],mean=it[1];S.dw=S.dw||{};const on=!S.dw[head];
  if(on)S.dw[head]=1;else delete S.dw[head];save();dwMark(head,on);
  if(on){try{WN.add([{w:head,m:mean,src:'미니모고',how:'별표',ask:true}]);}catch(err){}dwToast(head.replace(/\s+[AB](?=\s|$)/g,'').trim()+'  '+mean.replace(/\bA(?=[에를은는이가와과의도]|\s)|\bB(?=[에를은는이가와과의도]|\s)/g,'').replace(/\s+/g,' ').trim()+'  담음');}
  else{let pr=null;try{pr=WN.del(head,'미니모고');}catch(err){}
    if(pr&&pr.then)pr.then(function(r){if(r&&r.removed===false&&r.reason==='late'){S.dw[head]=1;save();dwMark(head,true);dwToast('이미 쌓인 단어라 뺄 수 없어요');}else if(r&&r.removed)dwToast(head+'  뺌');});
    else dwToast(head+'  뺌');}
},true);

{"t": "이 문장은 <b>가주어 It + S+V+C(2형식)</b>이다. 진주어 that절이 길어서 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (가주어. 진짜 주어는 뒤의 that절)", "V: is (be ~이다)", "C: true (사실인)", "no doubt = 부사구 (의심할 여지 없이). 문장 전체를 꾸민다", "뼈대 = <b>It is true that ~</b>"]}, {"t": "진주어 that절 안의 뼈대를 찾는다.", "sub": ["S: many people (많은 사람들)", "V: are motivated (motivate 동기를 부여하다의 수동태. 수동태라서 1형식)", "뼈대 = <b>many people are motivated</b>", "to carry out creative activities (창의적인 활동을 수행하도록)는 뼈대 밖 수식어이다. motivate A to V (A가 ~하도록 동기를 부여하다)의 수동태라서 to부정사가 뒤에 남은 것이다 (문형 기준). carry out (수행하다), creative (창의적인), activity (활동)"]}, {"t": "<b>because of problems</b>는 전치사구(부사구, 이유)이다. are motivated를 꾸민다 (문제 때문에). because of 뒤에는 절이 아니라 명사가 온다."}, {"t": "<b>they sense in their personal or professional environments</b>는 <b>관계절(형용사절)</b>이다. 목적격 관계대명사가 생략되어 problems를 꾸민다 (그들이 개인적 혹은 직업적 환경에서 감지하는).", "sub": ["sense (감지하다), personal (개인적인), professional (직업적인), environment (환경)"]}], "sum": "사람들이 환경 속 문제 때문에 창의적 활동에 나선다는 것은 사실"}, {"i": "04", "q": "03", "s": "5", "title": "S+V+C + whose 소유격 관계절", "eng": "At the end of the nineteenth century / a number of<sup>1</sup> research projects were underway<sup>2</sup> / whose purpose<sup>3</sup> was the invention<sup>4</sup> of a flying machine.", "notes": [["1", "a number of", "많은"], ["2", "be underway", "진행 중이다"], ["3", "purpose", "목적"], ["4", "invention", "발명"]], "lit": "19세기 말에 / 많은 연구 프로젝트가 진행 중이었다 / 그리고 그 프로젝트들의 목적은 비행 기계의 발명이었다.", "nat": "19세기 말에 비행 기계를 발명하는 것을 목적으로 하는 연구 프로젝트가 여럿 진행되고 있었다.", "ana": "<b>whose</b>는 소유격 관계대명사로 '그리고 그것의'라는 뜻이다. 여기서는 꾸며 주는 명사 <b>research projects</b>와 붙어 있지 않고 동사 <b>were underway</b>를 건너뛰어 뒤에 떨어져 나와 있다. 관계사절이 바로 앞 명사(machine 쪽)를 꾸민다고 착각하기 쉬우니, whose 뒤의 명사(purpose)가 누구의 목적인지를 따져 선행사를 되짚어야 한다. <b>a number of</b>는 '많은'이고 <b>the number of</b>(~의 수)와 뜻이 전혀 다르다.", "pe": "\u0001At the end \u0001of the nineteenth century\u0002\u0002 / a number of<sup>1</sup> research projects were underway<sup>2</sup> / \u0001whose purpose<sup>3</sup> was the invention<sup>4</sup> \u0001of a flying machine\u0002\u0002.", "pk": "\u000119세기 말에\u0002 / 많은 연구 프로젝트가 진행 중이었다 / \u0001그리고 그 프로젝트들의 목적은 비행 기계의 발명이었다\u0002.", "core": "많은 연구 프로젝트가 진행 중이었다.", "tags": ["At the end = 전치사구(부사구, 시간): 문장 전체 꾸밈. of the nineteenth century = 전치사구(형용사구): end 꾸밈", "주어 a number of research projects + 동사 were + 보어 underway (SVC). a number of = '많은'", "<b>whose</b>절 = 관계절(형용사절): research projects 꾸밈. of a flying machine = 전치사구(형용사구): invention 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b> 뒤에 <b>whose 관계절</b>이 붙은 문장이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: a number of research projects (많은 연구 프로젝트들. a number of 많은 + 복수 명사)", "V: were (be ~이다)", "C: underway (진행 중인. 형용사 보어)", "뼈대 = <b>a number of research projects were underway</b>"]}, {"t": "<b>At the end of the nineteenth century</b>는 전치사구(부사구)이다. 문장 전체를 꾸민다 (19세기 말에). end (끝)."}, {"t": "<b>whose purpose was the invention of a flying machine</b>은 <b>소유격 관계절(형용사절)</b>이다. research projects를 꾸민다.", "sub": ["whose purpose = research projects' purpose (그 프로젝트들의 목적)", "S: purpose (목적), V: was (be ~이다), C: the invention of a flying machine (비행 기계의 발명)", "invention (발명), flying machine (비행 기계)"]}, {"t": "함정: whose절이 underway 뒤에 떨어져 있어도 꾸미는 대상은 research projects이다. a number of + 복수 명사라서 동사가 were이다."}], "sum": "19세기 말, 비행 기계 발명을 목적으로 한 연구 여럿 진행"}, {"i": "05", "q": "04", "s": "1", "title": "S+V+O(that절) + if 명사절", "eng": "Moral<sup>1</sup> philosophy textbooks often proclaim<sup>2</sup> / that we can discern<sup>3</sup> / if a claim is ethical / by attending to<sup>4</sup> the use of the words “is” and “ought.”", "notes": [["1", "moral", "도덕의"], ["2", "proclaim", "분명히 말하다, 선언하다"], ["3", "discern", "식별하다"], ["4", "attend to", "~에 주의를 기울이다"]], "lit": "도덕 철학 교과서들은 종종 분명히 말한다 / 우리가 식별할 수 있다고 / 어떤 주장이 윤리에 관한 것인지를 / ‘is’와 ‘ought’라는 단어의 사용에 주의를 기울임으로써.", "nat": "도덕 철학 교과서들은 ‘is’와 ‘ought’라는 단어가 어떻게 쓰였는지만 살피면 어떤 주장이 윤리적인지 가려낼 수 있다고 종종 단언한다.", "ana": "<b>if</b>가 항상 '만약'인 것은 아니다. 여기서는 <b>discern</b>의 목적어 역할을 하는 <b>명사절</b>을 이끌어 '~인지 (아닌지)'라는 뜻이다. '만약 주장이 윤리적이라면'으로 읽으면 discern의 목적어가 사라져 문장이 끊긴다. 맨 뒤의 <b>by attending to</b>는 '~에 주의를 기울임으로써'라는 수단을 나타내며, attend를 '참석하다'로 읽으면 안 된다.", "pe": "\u0001Moral<sup>1</sup>\u0002 philosophy textbooks \u0001often\u0002 proclaim<sup>2</sup> / that we can discern<sup>3</sup> / if a claim is ethical / \u0001by attending to<sup>4</sup> the use \u0001of the words “is” and “ought.”\u0002\u0002", "pk": "\u0001도덕\u0002 철학 교과서들은 \u0001종종\u0002 분명히 말한다 / 우리가 식별할 수 있다고 / 어떤 주장이 윤리에 관한 것인지를 / \u0001‘is’와 ‘ought’라는 단어의 사용에 주의를 기울임으로써\u0002.", "core": "교과서들은 우리가 어떤 주장이 윤리적인지 식별할 수 있다고 단언한다.", "tags": ["주어 textbooks + 동사 proclaim (3형식). Moral = 형용사: philosophy textbooks 꾸밈. often = 부사: proclaim 꾸밈", "<b>that절</b> = proclaim의 목적어. we can discern: discern의 목적어는 아래 if절", "<b>if절 = 명사절</b> ('~인지'): discern의 목적어. '만약'이 아님", "by attending to ~ = 전치사구(부사구, 수단): discern 꾸밈. of the words = 전치사구(형용사구): use 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(that절, 3형식)</b>이다. that절 안에 if 명사절이 또 들어 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Moral philosophy textbooks (도덕 철학 교과서들. Moral philosophy는 \"도덕 철학\"이라는 학문 이름으로 textbooks를 꾸밈)", "V: proclaim (proclaim 선언하다, 분명히 말하다)", "O: that절 (명사절. ~라고)", "often = 부사 (종종). proclaim을 꾸민다", "뼈대 = <b>textbooks proclaim that ~</b>"]}, {"t": "that절 안의 뼈대를 찾는다.", "sub": ["S: we (우리)", "V: can discern (discern 식별하다)", "O: if a claim is ethical (어떤 주장이 윤리적인지). if절이 명사절", "뼈대 = <b>we can discern if a claim is ethical</b>"]}, {"t": "<b>if a claim is ethical</b>에서 if는 \"만약\"이 아니라 <b>\"~인지\"</b>이다. discern의 목적어이므로 명사절이다.", "sub": ["S: a claim (주장), V: is (be ~이다), C: ethical (윤리적인)"]}, {"t": "<b>by attending to the use of the words “is” and “ought.”</b>는 전치사구(부사구, 수단)이다. discern을 꾸민다 (단어 \"is\"와 \"ought\"의 사용에 주의를 기울임으로써).", "sub": ["by 뒤라서 attending은 동명사. attend to (주의를 기울이다)", "the use of the words (단어들의 사용). use 사용"]}, {"t": "함정: if절은 조건절이 아니라 목적어이다. 이 절이 없으면 discern이 불완전해진다."}], "sum": "교과서들, is·ought 단어 사용만 보면 윤리적 주장을 가려낸다고 단언"}, {"i": "06", "q": "04", "s": "8", "title": "Whatever 양보절 + S+V", "eng": "Whatever the is-ought test is tracking<sup>1</sup>, / these claims<sup>2</sup> clearly fall on<sup>3</sup> the ought side of that divide<sup>4</sup>.", "notes": [["1", "track", "찾아내다, 추적하다"], ["2", "claim", "주장"], ["3", "fall on", "~ 쪽에 해당하다"], ["4", "divide", "구분, 경계"]], "lit": "그 is-ought 검사가 무엇을 찾아내고 있든 간에, / 이 주장들은 분명히 그 구분의 ought 쪽에 속한다.", "nat": "is-ought 검사가 무엇을 잡아내는 것이든, 이 주장들은 분명히 ought 쪽에 놓인다.", "ana": "<b>Whatever</b>는 여기서 '무엇이든지'라는 명사절이 아니라 <b>'무엇을 ~하든 간에'</b>라는 양보 부사절을 이끈다. 뒤에 완전한 주절(these claims fall ~)이 따로 나오는 것이 그 증거다. 양보절은 주절의 판단을 흔들지 않는다는 신호이므로, 콤마 뒤의 주절이 진짜 하고 싶은 말이다.", "pe": "\u0001Whatever the is-ought test is tracking<sup>1</sup>\u0002, / these claims<sup>2</sup> \u0001clearly\u0002 fall \u0001on<sup>3</sup> the ought side \u0001of that divide<sup>4</sup>\u0002\u0002.", "pk": "\u0001그 is-ought 검사가 무엇을 찾아내고 있든 간에\u0002, / 이 주장들은 \u0001분명히\u0002 \u0001그 구분의 ought 쪽에\u0002 속한다.", "core": "이 주장들은 속한다.", "tags": ["<b>Whatever절</b> = 양보 부사절: 주절 전체를 꾸밈 ('무엇을 ~하든'). 안쪽 tracking의 목적어가 Whatever", "주어 claims + 동사 fall (1형식). clearly = 부사: fall 꾸밈. on ~ side = 거의 필수에 가까운 부사구: 동사 꾸밈. of that divide = 전치사구(형용사구): side 꾸밈"], "steps": [{"t": "이 문장은 <b>Whatever 양보 부사절 + S+V(1형식)</b>이다. Whatever가 맨 앞에 와서 어려워 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: these claims (이 주장들)", "V: fall (fall 속하다, 떨어지다)", "clearly = 부사 (분명히). fall을 꾸민다", "뼈대 = <b>these claims fall</b>"]}, {"t": "<b>on the ought side</b>는 전치사구(부사구)이다. fall을 꾸민다 (ought 쪽에). 이 위치를 말해 줘야 문장이 의미가 통하므로 거의 필수에 가깝다 (문형 기준). <b>of that divide</b>는 전치사구(형용사구)이다. side를 꾸민다 (그 구분의). divide (구분, 경계)."}, {"t": "<b>Whatever the is-ought test is tracking</b>은 <b>양보 부사절</b>이다. 주절 전체를 꾸민다 (무엇을 ~하든).", "sub": ["S: the is-ought test (is-ought 검사), V: is tracking (track 추적하다, 찾아내다)", "Whatever = tracking의 목적어가 앞으로 나온 말 (무엇을 ~하든 간에)"]}, {"t": "함정: Whatever는 주어가 아니다. tracking의 목적어 자리가 비어 있고 그 자리 말이 앞으로 나온 것이다."}], "sum": "검사가 무엇을 찾든, 이 주장들은 분명히 ought 쪽에 속함"}, {"i": "07", "q": "05", "s": "1", "title": "point to A as B + what절 + 동격", "eng": "Most historians of science point to<sup>1</sup> the need for a reliable<sup>2</sup> calendar / to regulate<sup>3</sup> agricultural activity / as the motivation for learning about / what we now call astronomy<sup>4</sup>, the study of stars and planets.", "notes": [["1", "point to", "~을 지적하다, 가리키다"], ["2", "reliable", "믿을 만한"], ["3", "regulate", "규제하다, 조절하다"], ["4", "astronomy", "천문학"]], "lit": "대부분의 과학 역사가들은 믿을 만한 달력의 필요성을 지적한다 / 농업 활동을 규제하기 위한 / ~에 대해 배우려는 동기로서 / 오늘날 우리가 천문학, 즉 별과 행성에 관한 연구라고 부르는 것.", "nat": "대부분의 과학사가는 농업 활동을 조절할 믿을 만한 달력이 필요했다는 점을, 오늘날 우리가 천문학이라 부르는 것 — 즉 별과 행성에 관한 연구 — 을 배우게 된 동기로 지적한다.", "ana": "<b>point to A as B</b>(A를 B로 지적하다)가 뼈대인데, A(the need ~ activity)가 길어져 as가 한참 뒤에 나온다. as를 '~처럼'으로 읽으면 구조가 무너진다. <b>what we now call astronomy</b>의 <b>what</b>은 선행사를 품은 관계대명사로 '우리가 ~라고 부르는 것'이며, 뒤의 <b>the study of stars and planets</b>는 콤마로 이어진 <b>동격</b>이다.", "pe": "Most historians \u0001of science\u0002 point \u0001to<sup>1</sup> the need for a reliable<sup>2</sup> calendar\u0002 / \u0001to regulate<sup>3</sup> agricultural activity\u0002 / \u0001as the motivation for learning about\u0002 / \u0001what we now call astronomy<sup>4</sup>, the study of stars and planets\u0002.", "pk": "대부분의 \u0001과학\u0002 역사가들은 \u0001믿을 만한 달력의 필요성을\u0002 지적한다 / \u0001농업 활동을 규제하기 위한\u0002 / \u0001~에 대해 배우려는 동기로서\u0002 / \u0001오늘날 우리가 천문학, 즉 별과 행성에 관한 연구라고 부르는 것\u0002.", "core": "대부분의 역사가는 지적한다.", "tags": ["주어 historians + 동사 point (1형식). of science = 형용사구: historians 꾸밈. to the need ~ = 전치사구(부사구): point 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "to regulate ~ = to부정사(형용사적): calendar 꾸밈 (위 to구 안쪽). for a reliable calendar = 전치사구(형용사구): need 꾸밈", "as the motivation for learning about = 전치사구(부사구): point 꾸밈 (point to A as B: as B는 보어 아님) [기준: 모양 규칙]", "what절 = 전치사 about의 목적어(명사절), as구의 일부. 안쪽 call A B (5형식). the study of ~ = 동격: astronomy 설명. now = 부사: call 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>인데 뒤에 전치사구가 연달아 붙고 what절과 동격까지 있어 아주 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Most historians (대부분의 역사가들). of science (과학의)는 historians를 꾸미는 형용사구", "V: point (point to ~을 지적하다, 가리키다)", "뼈대 = <b>Most historians point</b>"]}, {"t": "<b>to the need for a reliable calendar to regulate agricultural activity</b>는 point에 붙는 전치사구(부사구)이다. 거의 필수에 가까워 같이 본다 (문형 기준).", "sub": ["the need (필요성), for a reliable calendar (믿을 만한 달력에 대한). reliable 믿을 만한", "to regulate agricultural activity = to부정사(형용사적). calendar를 꾸민다 (농업 활동을 규제하기 위한). regulate 규제하다, agricultural 농업의"]}, {"t": "<b>as the motivation for learning about ~</b>는 전치사구(부사구)이다. point를 꾸민다 (~을 배우려는 동기로서). point to A as B (A를 B로 지적하다)에서 as B는 보어가 아니다 (문형 기준).", "sub": ["motivation (동기), for 뒤라서 learning은 동명사"]}, {"t": "<b>what we now call astronomy</b>는 about의 목적어인 <b>명사절</b>이다 (우리가 지금 천문학이라 부르는 것).", "sub": ["call A B (A를 B라고 부르다)의 A 자리가 what으로 앞에 나갔다", "now = 부사 (지금), astronomy (천문학)"]}, {"t": "<b>the study of stars and planets</b>는 astronomy를 풀어 주는 <b>동격</b>이다 (별과 행성에 관한 연구). study (연구), planet (행성).", "sub": ["함정: what은 call의 목적어 자리가 앞으로 나온 말이다. 그리고 as B는 보어가 아니라 point를 꾸미는 부사구이다."]}], "sum": "과학사가들, 농업용 달력의 필요가 천문학을 배운 동기라고 지적"}, {"i": "08", "q": "06", "s": "8", "title": "contrast A with B 분리 + 삽입 분사구 + in which", "eng": "Some fifty years ago one US economist contrasted<sup>1</sup> / what he called the “cowboy” economy, / bent on<sup>2</sup> production, exploitation<sup>3</sup> of resources, and pollution, / with the “spaceman” economy, / in which quality and complexity<sup>4</sup> replaced “throughput<sup>5</sup>” as the measure of success.", "notes": [["1", "contrast A with B", "A와 B를 대조하다"], ["2", "be bent on", "~에 집중하다"], ["3", "exploitation", "착취, 이용"], ["4", "complexity", "복잡성"], ["5", "throughput", "처리량"]], "lit": "약 50년 전 한 미국 경제학자는 대조했다 / 그가 ‘카우보이’ 경제라고 부른 것을 / 생산, 자원 착취, 그리고 오염에 집중하는 / ‘우주인’ 경제와 / 그리고 그 경제에서는 품질과 복잡성이 성공의 척도로서 ‘처리량’을 대체했다.", "nat": "약 50년 전 한 미국 경제학자는 생산과 자원 착취, 오염에만 매달리는 이른바 ‘카우보이’ 경제를, 품질과 복잡성이 ‘처리량’을 대신해 성공의 잣대가 되는 ‘우주인’ 경제와 대비시켰다.", "ana": "<b>contrast A with B</b>가 뼈대인데 A와 B 사이에 분사구가 끼어들어 with가 아주 멀리 떨어졌다. <b>Some fifty years</b>의 <b>some</b>은 '어떤'이 아니라 숫자 앞에서 '약, 대략'이다. 삽입된 <b>bent on ~</b>은 <b>which was bent on</b>에서 '관계대명사 + be동사'가 빠진 형태로 앞의 economy를 꾸민다. 마지막 <b>in which</b>는 '전치사 + 관계대명사'로 '그리고 그 경제 안에서는'처럼 풀어 읽으면 된다.", "pe": "\u0001Some fifty years ago\u0002 one US economist contrasted<sup>1</sup> / what he called the “cowboy” economy, / \u0001bent on<sup>2</sup> production, exploitation<sup>3</sup> \u0001of resources\u0002, and pollution\u0002, / \u0001with the “spaceman” economy\u0002, / \u0001in which quality and complexity<sup>4</sup> replaced “throughput<sup>5</sup>” as the measure of success\u0002.", "pk": "\u0001약 50년 전\u0002 한 미국 경제학자는 대조했다 / 그가 ‘카우보이’ 경제라고 부른 것을 / \u0001생산, 자원 착취, 그리고 오염에 집중하는\u0002 / \u0001‘우주인’ 경제와\u0002 / \u0001그리고 그 경제에서는 품질과 복잡성이 성공의 척도로서 ‘처리량’을 대체했다\u0002.", "core": "한 경제학자는 그가 '카우보이' 경제라 부른 것을 대비시켰다.", "tags": ["Some fifty years ago = 부사구(시간): contrasted 꾸밈 ('약'). 주어 economist + 동사 contrasted (3형식)", "<b>what절</b> = contrasted의 목적어. he called A B (5형식): 그가 ~라고 부른 것", "bent on ~ = 분사구(형용사적): economy 꾸밈. of resources = 전치사구(형용사구): exploitation 꾸밈", "with ~ economy = 전치사구(부사구): contrasted 꾸밈, 거의 필수에 가까운 부사구 (contrast A with B, 3형식) [기준: 모양 규칙]", "<b>in which</b>절 = 관계절(형용사절): the spaceman economy 꾸밈. 안쪽 quality and complexity replaced throughput"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. contrast A with B에서 A와 B가 멀리 떨어져 있고 사이에 삽입이 있어 아주 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: one US economist (한 미국 경제학자)", "V: contrasted (contrast 대비시키다의 과거형)", "O: what he called the “cowboy” economy (그가 \"카우보이\" 경제라고 부른 것)", "뼈대 = <b>one US economist contrasted what he called the “cowboy” economy with the “spaceman” economy</b>", "Some fifty years ago = 부사구 (약 50년 전). some은 \"약\""]}, {"t": "O 안의 what절을 본다.", "sub": ["S: he, V: called (call A B A를 B라고 부르다의 과거형)", "what = A 자리, the “cowboy” economy = B (카우보이 경제)"]}, {"t": "<b>bent on production, exploitation of resources, and pollution</b>은 <b>과거분사구(형용사구)</b>이다. 삽입되어 “cowboy” economy를 꾸민다 (생산, 자원 착취, 오염에 몰두하는).", "sub": ["be bent on (~에 열중하다, 몰두하다). exploitation (착취), resource (자원), pollution (오염)"]}, {"t": "<b>with the “spaceman” economy</b>는 contrast A with B의 전치사구이다. 거의 필수에 가까워 같이 본다 (문형 기준). 우주인 경제와 대비시켰다는 뜻이다."}, {"t": "<b>in which quality and complexity replaced “throughput” as the measure of success</b>는 <b>전치사 + 관계대명사</b> 관계절(형용사절)이다. the “spaceman” economy를 꾸민다.", "sub": ["in which = in the spaceman economy (그 우주인 경제에서는)", "S: quality and complexity (품질과 복잡성), V: replaced (replace 대체하다), O: “throughput” (처리량)", "as the measure of success (성공의 척도로서). measure 척도, success 성공", "함정: contrasted와 with가 멀리 떨어져 있다. 사이의 bent on ~ 덩어리는 economy를 꾸미는 삽입이다."]}], "sum": "생산·착취에 몰두한 카우보이 경제와 품질·복잡성을 중시하는 우주인 경제 대비"}], "qs": [{"q": "01", "type": "필자 목적", "src": "2018학년도 6월 18번", "ans": "①", "tr": [["1", "Stevens 씨께,"], ["2", "저는 의 편집장입니다.<br>3 지난주에 저희 직원이 알려 드린 대로, 귀하의 단편 소설은 Novel Flash Fiction 12월 호에 실릴 예정입니다.<br>4 저희는 귀하가 그 이야기를 어떻게 구상하게 되었는지 듣는 것이 저희 독자들에게 의미가 있으리라 생각했습니다.<br>5 그래서 저희는 귀하께서 집필 과정에 관해 강연을 해 주실 수 있는지 여쭙고자 합니다.<br>6 이 강연은 한 시간 정도 이어질 것으로 예상되며, 시내에 있는 Star 서점에서 열릴 것입니다.<br>7 귀하의 일정에 따라 구체적인 날짜와 시간을 고르실 수 있습니다.<br>8 궁금한 점이 있으시면 editors@nff.com으로 이메일 주시기 바랍니다.<br>9 귀하가 그 이야기를 어떻게 쓰셨는지 듣게 되기를 기대하겠습니다.<br>10 진심을 담아, Susanna Martinez 드림<br>"]], "evh": "5번 문장", "ev": [{"en": true, "h": "We would thus like to ask if you could give a speech about your writing process."}, {"en": false, "h": "편지글의 목적은 <b>would like to ask</b>, <b>I am writing to</b> 같은 <b>요청 표현</b>이 나오는 문장에 거의 항상 들어 있다. 여기서는 '집필 과정(writing process)에 관한 강연(speech)을 해 주실 수 있는지 여쭙고자 한다'가 편지 전체의 용건이고, 뒤의 문장들(시간·장소·날짜 선택)은 모두 그 강연을 위한 부가 정보이다."}], "opts": [{"n": "①", "t": "소설 창작 과정에 관한 강연을 요청하려고", "a": true, "x": false, "trap": false, "e": "give a speech about your writing process가 '집필(창작) 과정에 관한 강연'과 그대로 겹친다. 뒤이어 시간·장소·일정까지 안내하는 것도 강연 요청 편지의 전형적인 흐름이다."}, {"n": "②", "t": "강연 일정이 변경된 것에 대해 사과하려고", "a": false, "x": true, "trap": true, "e": "강연 일정은 아직 정해지지도 않았고, 오히려 '일정에 따라 고르시라'고 열어 두었다. 사과 표현도 전혀 없다."}, {"n": "③", "t": "새로 발간된 잡지의 정기 구독을 권유하려고", "a": false, "x": true, "trap": false, "e": "잡지 이름과 12월 호가 언급되지만 구독(subscription)을 권하는 말은 한 줄도 없다. 잡지는 상대의 소설이 실릴 지면일 뿐이다."}, {"n": "④", "t": "출판물 편집에 관한 유의 사항을 안내하려고", "a": false, "x": true, "trap": false, "e": "보낸 사람이 편집장(chief editor)이라 '편집'이라는 단어가 떠오르지만, 편집 시 유의할 점을 알려 주는 내용은 없다."}, {"n": "⑤", "t": "잘못된 기사 내용에 대해 정정을 요구하려고", "a": false, "x": true, "trap": false, "e": "오류나 정정(correction)에 관한 언급이 전혀 없다. 글 전체가 우호적인 요청 톤이다."}], "w": [["chief editor", "편집장"], ["inform", "알리다"], ["issue", "(잡지의) 호"], ["come up with", "~을 구상하다, 생각해 내다"], ["meaningful", "의미 있는"], ["thus", "따라서"], ["be expected to V", "~할 것으로 예상되다"], ["take place", "열리다"], ["depending on", "~에 따라"], ["look forward to v-ing", "~하기를 기대하다"]]}, {"q": "02", "type": "필자 주장", "src": "2020학년도 6월 20번", "ans": "①", "tr": [["1", "'분자'와 같은 어떤 개념을 배우는 일은 그 개념을 단 한 번 접하는 것 이상을 요구한다."], ["2", "학생이 어떤 과학 개념을 기억하려 한다면, 그 학생은 그것을 여러 번, 그리고 다양한 맥락에서 경험해야 한다."], ["3", "그것이 바로 순환 학습이 가진 강점 중 하나이다. 학생들은 그 개념을 직접 경험하고, 그것에 대해 이야기하고, 그런 다음 훨씬 더 직접적인 경험을 한다."], ["4", "읽고, 영상을 보고, 다른 사람의 생각을 들어 보는 것이 그 개념을 더 단단하게 이해하는 데 기여한다."], ["5", "이는 단순한 반복 이상을 시사한다."], ["6", "각각의 경우가 학생으로 하여금 그 개념을 다른 관점에서 검토하게 해 준다."], ["7", "궁극적으로 이것은 그 개념의 복잡한 특징과 미묘한 차이에 대한 실질적이고 유용한 이해로 이어질 것이다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "If a student is going to remember a science concept, he or she should experience it multiple times and in various contexts."}, {"en": false, "h": "주장 문항에서는 <b>should</b>가 붙은 문장을 먼저 찾는다. 이 글에서 should가 나오는 유일한 문장이 '여러 번(multiple times) 그리고 다양한 맥락(in various contexts)에서 경험해야 한다'이며, 마지막 문장의 <b>more than repetition</b>(단순 반복 이상)도 '여러 번 + 다양한 방식'을 다시 확인해 준다."}], "opts": [{"n": "①", "t": "과학 개념을 학습하려면 다양한 방식으로 여러 번 접해야 한다.", "a": true, "x": false, "trap": false, "e": "multiple times(여러 번)와 in various contexts(다양한 맥락에서)를 한 문장으로 합친 것이 그대로 이 선택지이다."}, {"n": "②", "t": "복잡한 과학 개념을 이해하기 위해서는 암기가 선행되어야 한다.", "a": false, "x": true, "trap": true, "e": "암기(memorization)는 언급되지 않고, 오히려 마지막에 '단순 반복 이상'이라며 기계적 되풀이와 거리를 둔다."}, {"n": "③", "t": "효과적인 과학 학습을 위해 기본 개념을 숙지할 필요가 있다.", "a": false, "x": true, "trap": false, "e": "기본 개념(fundamental concept)의 우선순위를 다루는 글이 아니다. 쟁점은 '무엇을 먼저 배우냐'가 아니라 '몇 번, 어떤 방식으로 접하느냐'이다."}, {"n": "④", "t": "과학 원리는 쉬운 것부터 어려운 것 순으로 가르쳐야 한다.", "a": false, "x": true, "trap": false, "e": "난이도 순서(easy → difficult)에 관한 언급이 전혀 없다."}, {"n": "⑤", "t": "다양한 시각 자료를 활용하여 과학 수업을 진행해야 한다.", "a": false, "x": true, "trap": false, "e": "watching videos가 한 번 나오지만 이는 여러 접근 방식 가운데 하나의 예일 뿐, 시각 자료(visual materials)를 강조하는 글이 아니다."}], "w": [["molecule", "분자"], ["exposure", "노출, 접함"], ["multiple", "여러 번의"], ["context", "맥락, 문맥"], ["contribute to", "~에 기여하다"], ["solid", "견고한, 탄탄한"], ["repetition", "반복"], ["perspective", "관점, 시각"], ["substantive", "실질적인, 중요한"], ["complexities", "복잡한 특징들"]]}, {"q": "03", "type": "요지", "src": "2020년 7월 22번", "ans": "②", "tr": [["1", "창의적인 과정을 시작하게 하는 데 문제에 대한 민감성이 중요하다는 기본적인 생각에 대해 의문이 제기될 수 있다."], ["2", "많은 사람이 개인적·직업적 환경에서 감지한 문제 때문에 창의적인 활동을 수행하도록 동기를 부여받는다는 것은 의심할 여지 없이 사실이다."], ["3", "그러나 발명이라는 영역에서조차 창의적인 과정이 필요 없이도 시작될 수 있다는 역사적 증거가 있다."], ["4", "한 가지 예로, 비행기의 발명을 생각해 보라."], ["5", "19세기 말에 비행 기계를 발명하는 것을 목적으로 하는 연구 프로젝트가 여럿 진행되고 있었다."], ["6", "그 당시에는 그런 기계가 필요하지 않았다. 라이트 형제가 비행기를 발명하는 데 성공하고 나서야 비로소 그 발명이 지닌 더 폭넓은 영향이 점차 분명해졌다."], ["7", "따라서 비행기 발명 뒤에 있던 원동력은 필요가 아니었던 것으로 보인다. 날아야 할 '필요'가 있었던 것이 아니라, 사람들이 단순히 날기를 '원했던' 것이다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "So the driving force behind the invention of the airplane seems not to have been necessity: There was no need to fly; people simply wanted to."}, {"en": false, "h": "요지는 <b>So</b>, <b>Thus</b> 같은 결론 신호 뒤에 있다. 마지막 문장이 <b>need</b>(필요)와 <b>wanted</b>(원함)를 콜론으로 맞세워 '필요해서 만든 게 아니라 원해서 만든 것'이라고 못 박는다. 앞의 <b>without necessity</b>(필요 없이도)와 짝을 이루므로, '필요가 창의성의 필수 조건은 아니다'가 글의 결론이다."}], "opts": [{"n": "①", "t": "논리적 사고는 창의력 발휘를 저해한다.", "a": false, "x": true, "trap": false, "e": "논리적 사고(logical thinking)와 창의력을 대립시키는 내용은 어디에도 없다."}, {"n": "②", "t": "필요는 창의성 발현을 위한 필수 조건이 아니다.", "a": true, "x": false, "trap": false, "e": "without necessity(필요 없이도 창의적 과정이 시작될 수 있다)와 마지막의 'There was no need to fly'가 그대로 이 문장이다."}, {"n": "③", "t": "다양한 경험이 반드시 발명에 유익한 것은 아니다.", "a": false, "x": true, "trap": false, "e": "경험(experience)의 유익함을 따지는 글이 아니다. 부분 부정 표현에 끌려 고르기 쉬운 함정이다."}, {"n": "④", "t": "문제 해결 능력은 문제에 대한 민감성에서 비롯된다.", "a": false, "x": true, "trap": true, "e": "첫 문장에 나오는 '문제에 대한 민감성'은 필자가 <b>의문을 제기하는 대상</b>이지 주장하는 바가 아니다. 첫 문장만 읽고 고르면 정반대가 된다."}, {"n": "⑤", "t": "창의적 산출물을 만들기 위해 지식의 축적이 필요하다.", "a": false, "x": true, "trap": false, "e": "지식의 축적(accumulation of knowledge)은 언급되지 않는다."}], "w": [["raise a question", "의문을 제기하다"], ["notion", "생각, 개념"], ["sensitivity", "민감성, 예민함"], ["set A in motion", "A를 시작하게 하다"], ["carry out", "수행하다"], ["necessity", "필요(성)"], ["domain", "영역, 범위"], ["be underway", "진행 중이다"], ["implication", "영향, 함축"], ["apparent", "분명한, 명백한"], ["driving force", "원동력"]]}, {"q": "04", "type": "제목", "src": "2021년 4월 24번", "ans": "③", "tr": [["1", "도덕 철학 교과서들은 'is'와 'ought'라는 단어가 어떻게 쓰였는지에 주의를 기울이면 어떤 주장이 윤리에 관한 것인지 가려낼 수 있다고 종종 단언한다."], ["2", "이 제안에 따르면, '너는 약속을 지켜야 한다'라는 주장은 'ought'를 쓰고 있기 때문에 윤리적이다."], ["3", "'원자는 작다'는 'is'를 쓰고 있기 때문에 윤리와 관련이 없다."], ["4", "그러나 흔히 인용됨에도 불구하고, 이 is-ought 검사는 심각한 결함이 있다."], ["5", "어떤 is 진술은 윤리적 내용을 담고 있고, 어떤 ought 진술은 그렇지 않다."], ["6", "예를 들어 '살인은 옳지 않다'와 '우정은 좋다'라는 주장을 생각해 보라."], ["7", "이 주장들은 분명히 윤리적 내용을 담고 있다."], ["8", "is-ought 검사가 무엇을 잡아내는 것이든, 이 주장들은 분명히 그 구분의 ought 쪽에 놓인다."], ["9", "그런데도 두 문장 모두 'is'를 쓰고 있다."], ["10", "비슷하게 '그 기차는 한 시간 안에 도착해야 한다'라는 주장을 생각해 보라."], ["11", "이 진술은 'ought'를 쓰고 있음에도 명백히 윤리와 무관하다."], ["12", "윤리적 주장과 윤리와 무관한 주장 사이에는 중요한 차이가 있다."], ["13", "그러나 우리는 그 구분을 하기 위해 단순히 'is'와 'ought'에 의존할 수는 없다."], ["14", "대신 우리는 그 주장의 핵심(내용)에 주의를 기울여야 한다."]], "evh": "14번 문장", "ev": [{"en": true, "h": "But we can't simply rely on “is” and “ought” to make it. Instead we need to attend to the substance of the claim."}, {"en": false, "h": "제목 문항은 <b>필자가 반박하는 대상</b>과 <b>대안</b>을 함께 담은 선택지를 골라야 한다. 이 글은 '단어(is/ought)로 윤리성을 판별한다'는 통념을 부정하고, 마지막에 <b>the substance of the claim</b>(주장의 내용)에 주목하라고 대안을 제시한다. 즉 쟁점은 <b>단어 선택이냐 내용이냐</b>이다."}], "opts": [{"n": "①", "t": "Mutually Exclusive Relationship Between “Is” and “Ought” ('Is'와 'Ought' 사이의 상호 배타적인 관계)", "a": false, "x": true, "trap": false, "e": "글은 오히려 is 문장에도 윤리적 내용이 있고 ought 문장에도 비윤리적인 것이 있다고 하여 둘이 <b>깔끔히 갈리지 않는다</b>고 말한다. 배타적 관계라는 말은 정반대이다."}, {"n": "②", "t": "Sounds Unethical to You? Check Your Moral Standard First (비윤리적인 것처럼 들리는가? 당신의 도덕 규범을 먼저 확인하라)", "a": false, "x": true, "trap": false, "e": "개인의 도덕 기준을 점검하라는 조언 글이 아니다. 윤리성 <b>판별 기준</b>에 관한 논의이다."}, {"n": "③", "t": "What Determines Ethicality of a Claim, Word Choice or Content? (무엇이 주장의 윤리성을 결정하는가, 단어 선택인가 내용인가?)", "a": true, "x": false, "trap": false, "e": "글 전체가 '단어(is/ought)'와 '내용(substance)'을 맞세우고 마지막에 내용 쪽 손을 들어 준다. 두 후보를 그대로 제목에 담은 유일한 선택지이다."}, {"n": "④", "t": "How We Can Get to Harmony of Linguistic Forms and Functions (어떻게 언어의 형태와 기능의 조화를 이룰 수 있는가)", "a": false, "x": true, "trap": true, "e": "언어학적 형태와 기능의 조화를 모색하는 글이 아니다. linguistic이라는 단어의 인상에 끌리기 쉽다."}, {"n": "⑤", "t": "To Use “Is” or “Ought,” That Is the Key to Ethical Statements! ('Is'를 쓸 것인가 'Ought'를 쓸 것인가, 그것이 윤리적 진술의 핵심이다!)", "a": false, "x": true, "trap": false, "e": "필자가 <b>부정하는</b> 통념을 그대로 제목으로 만든 것이다. 4번 문장의 seriously deficient를 놓치면 이 선택지에 걸린다."}], "w": [["moral philosophy", "도덕 철학"], ["proclaim", "분명히 나타내다, 선언하다"], ["discern", "식별하다, 알아차리다"], ["attend to", "~에 주의를 기울이다"], ["ethical", "윤리에 관한, 윤리적인"], ["invoke", "(예시를) 언급하다, 호소하다"], ["deficient", "결함이 있는"], ["track", "찾아내다, 추적하다"], ["notwithstanding", "~에도 불구하고"], ["distinction", "차이, 대조"], ["substance", "핵심, 본질"]]}, {"q": "05", "type": "어법 정확성", "src": "2022학년도 6월 29번", "ans": "⑤", "tr": [["1", "대부분의 과학사가는 농업 활동을 조절할 믿을 만한 달력이 필요했다는 점을, 오늘날 우리가 천문학 — 즉 별과 행성에 관한 연구 — 이라 부르는 것을 배우게 된 동기로 지적한다."], ["2", "초기 천문학은 작물을 언제 심어야 할지에 관한 정보를 주었고, 인간에게 시간의 흐름 function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}

flush();return o;}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}

><span class=\"why\">[지문에 없음] 6~7번에 강연 시간·날짜가 나오지만, 정해진 일정을 바꾼 게 아니라 7번처럼 날짜를 직접 고르라는 안내예요. 사과하는 말도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">새로 발간된 잡지의 정기 구독을 권유하려고</span><span class=\"why\">[지문에 없음] 2·3번에 잡지 이름과 12월 호(December issue)가 나오지만, 소설이 실린다는 소식일 뿐 구독하라는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">출판물 편집에 관한 유의 사항을 안내하려고</span><span class=\"why\">[지문에 없음] 2번에서 편집장(chief editor)이라고 소개할 뿐, 편집할 때 조심할 점은 한 줄도 안 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">잘못된 기사 내용에 대해 정정을 요구하려고</span><span class=\"why\">[지문에 없음] 잘못된 기사 이야기는 없어요. 3번은 소설이 실린다는 반가운 소식이고, 5번은 강연을 부탁하는 말이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Dear Mr. Stevens,</div><div class=\"k\">친애하는 Stevens 씨께,</div></div><div class=\"rnat\">Stevens 씨께,</div><div class=\"rst\">학교 신문부가 글짓기 대회에서 상 받은 선배에게 메시지를 보낸다고 생각해 봐요. 지문도 스티븐스(Stevens) 씨에게 쓰는 편지로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This is the chief editor</div><div class=\"k\">저는 편집장입니다</div></div><div class=\"rc\"><div class=\"e\">of Novel Flash Fiction.</div><div class=\"k\">《Novel Flash Fiction》의.</div></div><div class=\"rnat\">저는 《Novel Flash Fiction》의 편집장입니다.</div><div class=\"rst\">“안녕하세요, 저는 신문부 부장이에요.” 하고 자기소개를 해요. 지문도 보낸 사람이 잡지의 편집장(chief editor)이라고 밝혀요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">As you were informed by our staff last week,</div><div class=\"k\">지난주 저희 직원에 의해 귀하가 알게 되신 대로,</div></div><div class=\"rc\"><div class=\"e\">your short story will be published</div><div class=\"k\">귀하의 단편 소설은 실릴 것입니다</div></div><div
