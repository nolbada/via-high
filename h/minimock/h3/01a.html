class=\"e\">Susanna Martinez</div><div class=\"k\">Susanna Martinez 드림</div></div><div class=\"rnat\">진심을 담아, Susanna Martinez 드림</div><div class=\"rst\">메시지 끝에 내 이름을 쓰듯, 지문도 보낸 사람 수재나 마르티네스(Susanna Martinez)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"chief editor\" data-m=\"편집장\"><b>chief editor</b>편집장</button><button type=\"button\" class=\"wdb\" data-w=\"issue\" data-m=\"(잡지의) 호\"><b>issue</b>(잡지의) 호</button><button type=\"button\" class=\"wdb\" data-w=\"depending on\" data-m=\"~에 따라\"><b>depending on</b>~에 따라</button><button type=\"button\" class=\"wdb\" data-w=\"meaningful\" data-m=\"의미 있는\"><b>meaningful</b>의미 있는</button><button type=\"button\" class=\"wdb\" data-w=\"thus\" data-m=\"따라서, 그래서\"><b>thus</b>따라서, 그래서</button><button type=\"button\" class=\"wdb\" data-w=\"take place\" data-m=\"열리다\"><b>take place</b>열리다</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>should</b>(~해야 한다)가 붙은 문장에 있어요. 2번의 <b>multiple times</b>(여러 번)·<b>various contexts</b>(다양한 맥락)가 5번 <b>more than repetition</b>(단순한 반복 이상)으로 다시 확인되니, 두 말을 함께 담은 선택지를 고르세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 제시</span><div class=\"en\">Learning a certain concept such as “molecules” requires <mark>more than just a single exposure</mark> to the idea.</div><p class=\"ko\">‘분자’와 같은 어떤 개념을 배우는 것은 그 개념에 대한 <mark>단 한 번의 접함 이상을</mark> 요구한다.</p></div><div class=\"ck-via\"><i>▼</i><span>‘한 번으로는 부족하다’를 should(~해야 한다)로 바꿔 필자의 주장을 밝혀요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">… he or she <mark>should experience it</mark> <mark>multiple times and in various contexts</mark>.</div><p class=\"ko\">그 또는 그녀는 그것을 <mark>경험해야 한다</mark> <mark>여러 번 그리고 다양한 맥락에서</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>직접 경험 → 이야기 나누기 → 더 많은 직접 경험</span><span><em>4번</em>읽기·영상 보기·남의 생각 듣기</span></div><div class=\"ck-eq\">⇒ 3·4번의 공통점 = 한 개념을 여러 번, 여러 가지 방식으로 만나기</div></div><div class=\"ck-via\"><i>▼</i><span>여러 방식으로 만나는 건 똑같은 걸 되풀이하는 것과 다르다고 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 주장 다시 확인</span><div class=\"en\">This suggests <mark>more than repetition</mark>.</div><p class=\"ko\">이것은 <mark>단순한 반복 이상을</mark> 시사한다.</p></div><div class=\"ck-via\"><i>▼</i><span>방식마다 ‘다른 관점’을 주기 때문이에요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 왜 여러 방식이어야 하는지</span><div class=\"en\">Each event allows the student to examine the concept <mark>from a different perspective</mark>.</div><p class=\"ko\">각각의 경우는 학생이 그 개념을 <mark>다른 관점에서</mark> 검토하게 해 준다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">과학 개념을 학습하려면 다양한 방식으로 여러 번 접해야 한다.<small>2번의 multiple times(여러 번) + various contexts(다양한 맥락)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">다양한 시각 자료를 활용하여 과학 수업을 진행해야 한다.</span><span class=\"why\">[범위 좁음] 4번 watching videos(영상 보기)만 따온 함정이에요. 4번은 읽기·영상·남의 생각 듣기를 다 말하고, 핵심은 시각 자료가 아니라 여러 번·여러 방식으로 만나기예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">복잡한 과학 개념을 이해하기 위해서는 암기가 선행되어야 한다.</span><span class=\"why\">[반대] 5번은 단순한 반복(repetition) 이상이 필요하다고 해요. 외우기를 먼저 하라는 말은 없고, 7번의 복잡한 특징(complexities)은 여러 관점에서 본 ‘결과’로 이해된다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">효과적인 과학 학습을 위해 기본 개념을 숙지할 필요가 있다.</span><span class=\"why\">[지문에 없음] concept(개념)라는 말이 계속 나오지만, ‘기본 개념을 먼저 익혀라’가 아니라 2번처럼 한 개념을 여러 번, 다양한 맥락에서 경험하라는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">과학 원리는 쉬운 것부터 어려운 것 순으로 가르쳐야 한다.</span><span class=\"why\">[지문에 없음] 쉬운 것과 어려운 것의 순서 이야기는 없어요. 3번의 순서는 ‘경험 → 이야기 → 경험’이지, 난이도 순서가 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Learning a certain concept</div><div class=\"k\">어떤 개념을 배우는 것은</div></div><div class=\"rc\"><div class=\"e\">such as “molecules”</div><div class=\"k\">‘분자’와 같은</div></div><div class=\"rc ckc\"><div class=\"e\">requires <span class=\"cw\">more than just a single exposure</span> to the idea.</div><div class=\"k\">그 개념에 대한 <span class=\"cw\">단 한 번의 접함 이상을</span> 요구한다.</div></div><div class=\"rnat\">'분자'와 같은 어떤 개념을 배우는 일은 그 개념을 단 한 번 접하는 것 이상을 요구한다.</div><div class=\"rst\">축구의 ‘오프사이드’ 규칙을 쌤 설명 한 번만 듣고 알 수 있을까요? 지문도 ‘분자’ 같은 개념은 <b>한 번 접하는 것 이상</b>이 필요하다고 해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">If a student is going to remember a science concept,</div><div class=\"k\">만약 학생이 어떤 과학 개념을 기억하려 한다면,</div></div><div class=\"rc ckc\"><div class=\"e\">he or she <span class=\"cw\">should experience it</span></div><div class=\"k\">그 또는 그녀는 그것을 (= 그 과학 개념) <span class=\"cw\">경험해야 한다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">multiple times and in various contexts</span>.</div><div class=\"k\"><span class=\"cw\">여러 번 그리고 다양한 맥락에서</span>.</div></div><div class=\"rnat\">학생이 어떤 과학 개념을 기억하려 한다면, 그 학생은 그것을 여러 번, 그리고 다양한 맥락에서 경험해야 한다.</div><div class=\"rst\">규칙을 진짜 기억하려면 <b>여러 번, 여러 상황에서</b> 겪어 봐야 해요. = 지문 2번의 should(~해야 한다), 이게 필자의 주장이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">That is one of the strengths</div><div class=\"k\">그것은 (= 여러 번, 다양한 맥락에서 경험하는 것) 장점 중 하나이다</div></div><div class=\"rc\"><div class=\"e\">of the learning cycle:</div><div class=\"k\">순환 학습의:</div></div><div class=\"rc\"><div class=\"e\">the students have direct experience with the concept,</div><div class=\"k\">학생들은 그 개념에 대한 직접적인 경험을 갖는다,</div></div><div class=\"rc\"><div class=\"e\">then they talk about it,</div><div class=\"k\">그런 다음 그들은 (= 학생들) 그것에 (= 그 개념) 대해 이야기한다,</div></div><div class=\"rc\"><div class=\"e\">and then they have even more direct experience.</div><div class=\"k\">그리고 그런 다음 그들은 (= 학생들) 훨씬 더 많은 직접적인 경험을 한다.</div></div><div class=\"rnat\">그것이 바로 순환 학습이 가진 강점 중 하나이다. 학생들은 그 개념을 직접 경험하고, 그런 다음 그것에 대해 이야기하고, 그런 다음 훨씬 더 많은 직접적인 경험을 한다.</div><div class=\"rst\">체육 시간에 직접 뛰어 보고, 친구랑 “방금 그게 오프사이드야?” 얘기하고, 또 뛰어 봐요. = 지문 3번, 순환 학습의 강점이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Reading, watching videos, and listening to others’ thoughts</div><div class=\"k\">읽기, 영상 보기, 그리고 다른 사람들의 생각 듣기는</div></div><div class=\"rc\"><div class=\"e\">contribute to a more solid understanding</div><div class=\"k\">더 단단한 이해에 기여한다</div></div><div class=\"rc\"><div class=\"e\">of the concept.</div><div class=\"k\">그 개념에 대한.</div></div><div class=\"rnat\">읽고, 영상을 보고, 다른 사람의 생각을 들어 보는 것이 그 개념을 더 단단하게 이해하는 데 기여한다.</div><div class=\"rst\">규칙 설명글을 읽고, 경기 영상을 보고, 친구 생각도 들어 봐요. 지문 4번도 이런 활동이 이해를 더 단단하게 만든다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc ckc\"><div class=\"e\">This suggests <span class=\"cw\">more than repetition</span>.</div><div class=\"k\">이것은 (= 여러 방식으로 접하는 것) <span class=\"cw\">단순한 반복 이상을</span> 시사한다.</div></div><div class=\"rnat\">이는 단순한 반복 이상을 시사한다.</div><div class=\"rst\">이건 같은 설명을 열 번 듣는 것과 달라요. = 지문 5번, 이건 <b>단순한 반복 이상</b>(more than repetition)이라는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Each event allows the student</div><div class=\"k\">각각의 경우는 학생이 ~하게 해 준다</div></div><div class=\"rc\"><div class=\"e\">to examine the concept</div><div class=\"k\">그 개념을 검토하게</div></div><div class=\"rc\"><div class=\"e\">from a different perspective.</div><div class=\"k\">다른 관점에서.</div></div><div class=\"rnat\">각각의 경우가 학생으로 하여금 그 개념을 다른 관점에서 검토하게 해 준다.</div><div class=\"rst\">뛸 때, 영상 볼 때, 얘기할 때마다 규칙이 다른 각도로 보여요. = 지문 6번, 매번 <b>다른 관점</b>에서 개념을 살펴보게 된다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Ultimately this will lead to</div><div class=\"k\">궁극적으로 이것은 (= 다른 관점에서 검토하는 것) ~로 이어질 것이다</div></div><div class=\"rc\"><div class=\"e\">a substantive, useful understanding</div><div class=\"k\">실질적이고 유용한 이해로</div></div><div class=\"rc\"><div class=\"e\">of the complexities and nuances of the concept.</div><div class=\"k\">그 개념의 복잡한 특징들과 미묘한 차이에 대한.</div></div><div class=\"rnat\">궁극적으로 이것은 그 개념의 복잡한 특징과 미묘한 차이에 대한 실질적이고 유용한 이해로 이어질 것이다.</div><div class=\"rst\">그러다 보면 애매한 장면까지 척척 판단하게 돼요. = 지문 7번, 개념의 복잡하고 미묘한 부분까지 쓸모 있게 이해하게 된다는 말이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"exposure\" data-m=\"노출, 접함\"><b>exposure</b>노출, 접함</button><button type=\"button\" class=\"wdb\" data-w=\"multiple\" data-m=\"여러 번의, 다수의\"><b>multiple</b>여러 번의, 다수의</button><button type=\"button\" class=\"wdb\" data-w=\"context\" data-m=\"맥락, 상황\"><b>context</b>맥락, 상황</button><button type=\"button\" class=\"wdb\" data-w=\"contribute to\" data-m=\"~에 기여하다\"><b>contribute to</b>~에 기여하다</button><button type=\"button\" class=\"wdb\" data-w=\"repetition\" data-m=\"반복\"><b>repetition</b>반복</button><button type=\"button\" class=\"wdb\" data-w=\"perspective\" data-m=\"관점, 시각\"><b>perspective</b>관점, 시각</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>However</b>(하지만)와 <b>So</b>(따라서) 뒤에 있어요. 1·2번은 ‘문제가 있어야 창의가 시작된다’는 흔한 생각이고, 3번에서 <b>without necessity</b>(필요 없이도)로 뒤집힌 뒤 7번 결론으로 닫혀요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 의심받는 통념</span><div class=\"en\">A question can be raised about the basic notion that sensitivity to problems is critical in setting the creative process in motion.</div><p class=\"ko\">문제에 대한 민감성이 창의적인 과정을 시작하게 하는 데 중요하다는 기본적인 생각에 대해 의문이 제기될 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>2번에서 통념을 잠깐 인정한 뒤, However(하지만)로 방향을 뒤집어요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 반전</span><div class=\"en\"><mark>However</mark>, there is historical evidence that the creative process can be set in motion <mark>without necessity</mark>, even in the domain of invention.</div><p class=\"ko\"><mark>하지만</mark>, 창의적인 과정이 <mark>필요 없이도</mark> 시작될 수 있다는 역사적인 증거가 있다, 심지어 발명의 영역에서조차.</p></div><div class=\"ck-via\"><i>▼</i><span>4번에서 예로 든 비행기가 정말 ‘필요 없이’ 만들어졌는지 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 비행기 사례</span><div class=\"en\">At that time, <mark>there was no need for such a machine</mark>; …</div><p class=\"ko\">그 당시에는, <mark>그러한 기계에 대한 필요가 없었다</mark>; …</p></div><div class=\"ck-via\"><i>▼</i><span>So(따라서)로 사례를 정리하며 need(필요)와 wanted(원했다)를 맞세워요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결론 확인</span><div class=\"en\">So the driving force behind the invention of the airplane <mark>seems not to have been necessity</mark>: There was no need to fly; <mark>people simply wanted to.</mark></div><p class=\"ko\">따라서 비행기 발명 뒤에 있는 원동력은 <mark>필요가 아니었던 것으로 보인다</mark>: 날아야 할 ‘필요’는 없었다; <mark>사람들이 단순히 ‘원했던’ 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">필요는 창의성 발현을 위한 필수 조건이 아니다.<small>3번 without necessity(필요 없이도)와 7번 seems not to have been necessity(필요가 아니었던 것으로 보인다)를 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">문제 해결 능력은 문제에 대한 민감성에서 비롯된다.</span><span class=\"why\">[반대] 1번의 sensitivity to problems(문제에 대한 민감성)를 그대로 따온 함정이에요. 필자는 그 생각에 의문을 제기하고, 3번에서 필요 없이도 창의가 시작된다고 뒤집어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">논리적 사고는 창의력 발휘를 저해한다.</span><span class=\"why\">[지문에 없음] 논리적 사고 이야기는 한 번도 안 나와요. 지문이 맞세우는 건 논리 대 창의가 아니라 필요(need) 대 원함(wanted)이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">다양한 경험이 반드시 발명에 유익한 것은 아니다.</span><span class=\"why\">[지문에 없음] 경험이 많고 적은 이야기는 없어요. 2번의 개인적·직업적 환경도 경험이 아니라 문제를 느끼는 곳으로 나왔을 뿐이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">창의적 산출물을 만들기 위해 지식의 축적이 필요하다.</span><span class=\"why\">[지문에 없음] 지식을 쌓으라는 말은 없어요. 7번은 비행기 발명의 원동력이 필요(necessity)가 아니라 그냥 원해서(wanted)였다고 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">A question can be raised</div><div class=\"k\">의문이 제기될 수 있다</div></div><div class=\"rc\"><div class=\"e\">about the basic notion</div><div class=\"k\">기본적인 생각에 대해</div></div><div class=\"rc\"><div class=\"e\">that sensitivity to problems is critical</div><div class=\"k\">문제에 대한 민감성이 중요하다는</div></div><div class=\"rc\"><div class=\"e\">in setting the creative process in motion.</div><div class=\"k\">창의적인 과정을 시작하게 하는 데.</div></div><div class=\"rnat\">창의적인 과정을 시작하게 하는 데 문제에 대한 민감성이 중요하다는 기본적인 생각에 대해 의문이 제기될 수 있다.</div><div class=\"rst\">발명 동아리 쌤이 “불편한 걸 찾아야 발명이 시작돼”라고 해요. 지문 1번은 바로 이 생각에 <b>의문을 던져요</b>.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">It is no doubt true</div><div class=\"k\">의심할 여지 없이 사실이다</div></div><div class=\"rc\"><div class=\"e\">that many people are motivated</div><div class=\"k\">많은 사람들이 동기를 부여받는다는 것은</div></div><div class=\"rc\"><div class=\"e\">to carry out creative activities</div><div class=\"k\">창의적인 활동을 수행하도록</div></div><div class=\"rc\"><div class=\"e\">because of problems they sense</div><div class=\"k\">그들이 감지하는 문제들 때문에</div></div><div class=\"rc\"><div class=\"e\">in their personal or professional environments.</div><div class=\"k\">그들의 개인적 또는 직업적 환경에서.</div></div><div class=\"rnat\">많은 사람이 개인적·직업적 환경에서 감지한 문제 때문에 창의적인 활동을 수행하도록 동기를 부여받는다는 것은 의심할 여지 없이 사실이다.</div><div class=\"rst\">물론 삐걱대는 의자가 불편해서 받침을 만드는 친구도 많아요. = 지문 2번, 문제를 느껴서 창의 활동을 하는 사람이 많은 건 사실이라는 말이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>, there is historical evidence</div><div class=\"k\"><span class=\"cw\">하지만</span>, 역사적인 증거가 있다</div></div><div class=\"rc\"><div class=\"e\">that the creative process can be set in motion</div><div class=\"k\">창의적인 과정이 시작될 수 있다는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">without necessity</span>,</div><div class=\"k\"><span class=\"cw\">필요 없이도</span>,</div></div><div class=\"rc\"><div class=\"e\">even in the domain of invention.</div><div class=\"k\">심지어 발명의 영역에서조차.</div></div><div class=\"rnat\">그러나 발명이라는 영역에서조차 필요 없이도(필요하지 않아도) 창의적인 과정이 시작될 수 있다는 역사적 증거가 있다.</div><div class=\"rst\"><b>하지만</b>(However) 아무 불편이 없는데도 시작된 발명이 있어요. = 지문 3번, <b>필요 없이도</b>(without necessity) 창의가 시작된다는 요지예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">As one example,</div><div class=\"k\">한 가지 예로,</div></div><div class=\"rc\"><div class=\"e\">consider the invention of the airplane.</div><div class=\"k\">비행기의 발명을 생각해 보라.</div></div><div class=\"rnat\">한 가지 예로, 비행기의 발명을 생각해 보라.</div><div class=\"rst\">동아리 쌤이 예로 비행기 이야기를 꺼내요. = 지문 4번, 비행기의 발명을 생각해 보라는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">At the end of the nineteenth century</div><div class=\"k\">19세기 말에</div></div><div class=\"rc\"><div class=\"e\">a number of research projects were underway</div><div class=\"k\">많은 연구 프로젝트가 진행 중이었다</div></div><div class=\"rc\"><div class=\"e\">whose purpose was the invention of a flying machine.</div><div class=\"k\">그것의 (= 그 연구 프로젝트) 목적이 비행 기계의 발명인.</div></div><div class=\"rnat\">19세기 말에 비행 기계를 발명하는 것을 목적으로 하는 연구 프로젝트가 여럿 진행되고 있었다.</div><div class=\"rst\">옛날에도 하늘을 나는 기계를 만들려는 연구가 여기저기서 열심히 진행됐대요. = 지문 5번, 19세기 말의 많은 연구 프로젝트예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">At that time,</div><div class=\"k\">그 당시에는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">there was no need for such a machine</span>;</div><div class=\"k\"><span class=\"cw\">그러한 기계에 대한 필요가 없었다</span>;</div></div><div class=\"rc\"><div class=\"e\">only gradually,</div><div class=\"k\">단지 서서히,</div></div><div class=\"rc\"><div class=\"e\">after the Wright brothers were successful in inventing the airplane,</div><div class=\"k\">라이트 형제가 비행기를 발명하는 데 성공한 후에야,</div></div><div class=\"rc\"><div class=\"e\">did the broader implications of that invention become apparent.</div><div class=\"k\">그 발명의 더 폭넓은 영향이 분명해졌다.</div></div><div class=\"rnat\">그 당시에는 그런 기계가 필요하지 않았다. 라이트 형제가 비행기를 발명하는 데 성공하고 나서야 비로소 그 발명이 지닌 더 폭넓은 영향이 점차 분명해졌다.</div><div class=\"rst\">그런데 그때는 아무도 비행기가 꼭 있어야 한다고 느끼지 않았어요. = 지문 6번, 쓸모는 라이트 형제가 성공한 뒤에야 서서히 보였다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">So the driving force</div><div class=\"k\">따라서 원동력은</div></div><div class=\"rc\"><div class=\"e\">behind the invention of the airplane</div><div class=\"k\">비행기 발명 뒤에 있는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">seems not to have been necessity</span>:</div><div class=\"k\"><span class=\"cw\">필요가 아니었던 것으로 보인다</span>:</div></div><div class=\"rc\"><div class=\"e\">There was no need to fly;</div><div class=\"k\">날아야 할 ‘필요’는 없었다;</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">people simply wanted to.</span></div><div class=\"k\"><span class=\"cw\">사람들이 단순히 ‘원했던’ 것이다</span> (= 날기를).</div></div><div class=\"rnat\">따라서 비행기 발명 뒤에 있던 원동력은 필요가 아니었던 것으로 보인다. 날아야 할 '필요'가 있었던 것이 아니라, 사람들이 단순히 날기를 '원했던' 것이다.</div><div class=\"rst\"><b>따라서</b>(So) 비행기는 필요해서가 아니라 그냥 <b>날고 싶어서</b> 만든 거예요. 지문 7번이 결론이라서, 필요는 창의의 필수 조건이 아니에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"notion\" data-m=\"생각, 개념\"><b>notion</b>생각, 개념</button><button type=\"button\" class=\"wdb\" data-w=\"sensitivity\" data-m=\"민감성, 예민함\"><b>sensitivity</b>민감성, 예민함</button><button type=\"button\" class=\"wdb\" data-w=\"necessity\" data-m=\"필요(성)\"><b>necessity</b>필요(성)</button><button type=\"button\" class=\"wdb\" data-w=\"domain\" data-m=\"영역, 범위\"><b>domain</b>영역, 범위</button><button type=\"button\" class=\"wdb\" data-w=\"implication\" data-m=\"영향, 함축\"><b>implication</b>영향, 함축</button><button type=\"button\" class=\"wdb\" data-w=\"driving force\" data-m=\"원동력\"><b>driving force</b>원동력</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>필자가 깨는 통념</b>과 <b>대안</b>을 함께 담아야 해요. 4번 <b>Yet</b>(그러나)에서 ‘단어로 판별하기’가 깨지고, 14번 <b>Instead</b>(대신에)에서 ‘주장의 핵심(내용)을 보라’로 닫혀요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 깨질 통념</span><div class=\"en\">Moral philosophy textbooks often proclaim that we can discern if a claim is ethical by attending to the use of the words “is” and “ought.”</div><p class=\"ko\">도덕 철학 교과서들은 ‘is’와 ‘ought’라는 단어의 사용에 주의를 기울임으로써 어떤 주장이 윤리에 관한 것인지를 식별할 수 있다고 종종 분명히 말한다.</p></div><div class=\"ck-via\"><i>▼</i><span>2·3번 예시로 통념을 소개한 뒤 Yet(그러나)으로 뒤집어요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 반박</span><div class=\"en\">Yet, despite being commonly invoked, this is-ought test is <mark>seriously deficient</mark>.</div><p class=\"ko\">그러나, 흔히 예시로 언급됨에도 불구하고, 이 is-ought 검사는 <mark>심각하게 결함이 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6~9번</em>‘살인은 옳지 않다’·‘우정은 좋다’ = is(~이다)를 쓰는데 윤리적</span><span><em>10~11번</em>‘기차는 한 시간 안에 도착해야 한다’ = ought(~해야 한다)를 쓰는데 윤리와 무관</span></div><div class=\"ck-eq\">⇒ 두 예시의 공통점 = 단어(형태)만 보고는 윤리적인지 알 수 없어요</div></div><div class=\"ck-via\"><i>▼</i><span>두 예시를 근거로 ‘단어에 의존할 수 없다’고 못 박아요</span></div><div class=\"ck-step\"><span class=\"lab\">13번 문장 · 통념 정리</span><div class=\"en\"><mark>But we can’t simply rely on “is” and “ought”</mark> to make it.</div><p class=\"ko\"><mark>그러나 우리는</mark> 그것을 하기 위해 <mark>단순히 ‘is’와 ‘ought’에 의존할 수는 없다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>Instead(대신에)로 단어 대신 볼 것을 알려 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">14번 문장 · 대안 = 결정적 결론</span><div class=\"en\">Instead we need to attend to <mark>the substance of the claim</mark>.</div><p class=\"ko\">대신에 우리는 <mark>그 주장의 핵심에</mark> 주의를 기울여야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">What Determines Ethicality of a Claim(무엇이 주장의 윤리성을 결정하는가), Word Choice(단어 선택인가) or Content(내용인가)?<small>4번 단어 검사의 결함과 14번 substance(핵심, 내용)를 ‘단어냐 내용이냐’로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">To Use Is(‘이다’를 쓸 것인가) or Ought(‘해야 한다’를 쓸 것인가), That Is the Key to Ethical Statements(그것이 윤리적 진술의 핵심이다)!</span><span class=\"why\">[반대] 1번 교과서의 통념을 그대로 옮긴 함정이에요. 필자는 4번에서 그 검사가 결함이 있다고 하고, 13번에서 is(~이다)·ought(~해야 한다)에 의존할 수 없다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">Mutually Exclusive Relationship(상호 배타적인 관계) Between Is and Ought(‘이다’와 ‘해야 한다’ 사이의)</span><span class=\"why\">[지문에 없음] 두 단어가 서로 배타적이라는 말은 없어요. 5번은 오히려 is(~이다) 진술도 윤리적일 수 있다며 단어로 깔끔히 나뉘지 않는다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Sounds Unethical to You(비윤리적인 것처럼 들리는가)? Check Your Moral Standard First(당신의 도덕 규범을 먼저 확인하라)</span><span class=\"why\">[지문에 없음] 내 도덕 규범을 점검하라는 말은 없어요. 지문은 어떤 주장이 윤리에 ‘관한’ 것인지 구분하는 방법을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">How We Can Get to Harmony(어떻게 조화를 이룰 수 있는가) of Linguistic Forms and Functions(언어의 형태와 기능의)</span><span class=\"why\">[지문에 없음] 형태와 기능을 조화시키는 방법은 안 나와요. 13~14번은 단어(형태)에 기대지 말고 주장의 핵심(substance)을 보라고 할 뿐이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Moral philosophy textbooks often proclaim</div><div class=\"k\">도덕 철학 교과서들은 종종 분명히 말한다</div></div><div class=\"rc\"><div class=\"e\">that we can discern</div><div class=\"k\">우리가 식별할 수 있다고</div></div><div class=\"rc\"><div class=\"e\">if a claim is ethical</div><div class=\"k\">어떤 주장이 윤리에 관한 것인지를</div></div><div class=\"rc\"><div class=\"e\">by attending to the use of the words “is” and “ought.”</div><div class=\"k\">‘is’와 ‘ought’라는 단어의 사용에 주의를 기울임으로써.</div></div><div class=\"rnat\">도덕 철학 교과서들은 'is'와 'ought'라는 단어가 어떻게 쓰였는지에 주의를 기울이면 어떤 주장이 윤리에 관한 것인지 가려낼 수 있다고 종종 단언한다.</div><div class=\"rst\">학급회의에서 반장이 “‘~해야 해’가 들어간 말만 도덕 얘기로 치자”고 해요. = 지문 1번, 교과서가 is(~이다)·ought(~해야 한다) 단어로 윤리를 가린다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">On this suggestion,</div><div class=\"k\">이 제안에 따르면,</div></div><div class=\"rc\"><div class=\"e\">the claim “You ought to keep your promises,”</div><div class=\"k\">‘너는 약속을 지켜야 한다’라는 주장은,</div></div><div class=\"rc\"><div class=\"e\">because it uses “ought,”</div><div class=\"k\">그것이 (= 그 주장) ‘ought’를 사용하기 때문에,</div></div><div class=\"rc\"><div class=\"e\">is ethical.</div><div class=\"k\">윤리에 관한 것이다.</div></div><div class=\"rnat\">이 제안에 따르면, '너는 약속을 지켜야 한다'라는 주장은 'ought'를 쓰고 있기 때문에 윤리적이다.</div><div class=\"rst\">그 규칙대로면 “약속은 지켜야 해”는 ‘해야’가 있으니 도덕 얘기예요. 지문 2번도 ought(~해야 한다)를 써서 윤리적이라고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">“An atom is small,”</div><div class=\"k\">‘원자는 작다’는,</div></div><div class=\"rc\"><div class=\"e\">because it uses “is,”</div><div class=\"k\">그것이 (= ‘원자는 작다’라는 주장) ‘is’를 사용하기 때문에,</div></div><div class=\"rc\"><div class=\"e\">is nonethical.</div><div class=\"k\">윤리와 관련이 없다.</div></div><div class=\"rnat\">'원자는 작다'는 'is'를 쓰고 있기 때문에 윤리와 관련이 없다.</div><div class=\"rst\">“원자는 작다”는 ‘이다’ 말투라 도덕과 상관없는 말이 돼요. 지문 3번도 is(~이다)를 써서 윤리와 무관하다고 해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Yet, despite being commonly invoked,</div><div class=\"k\">그러나, 흔히 예시로 언급됨에도 불구하고,</div></div><div class=\"rc ckc\"><div class=\"e\">this is-ought test is <span class=\"cw\">seriously deficient</span>.</div><div class=\"k\">이 is-ought 검사는 <span class=\"cw\">심각하게 결함이 있다</span>.</div></div><div class=\"rnat\">그러나 흔히 예시로 언급됨에도 불구하고, 이 is-ought 검사는 심각한 결함이 있다.</div><div class=\"rst\"><b>그러나</b>(Yet) 이 단어 검사 규칙은 구멍이 많아요. = 지문 4번, is-ought(이다-해야 한다) 검사가 <b>심각하게 결함이 있다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Some is-statements have ethical content</div><div class=\"k\">어떤 is 진술들은 윤리적 내용을 담고 있고</div></div><div class=\"rc\"><div class=\"e\">and some ought-statements do not.</div><div class=\"k\">어떤 ought 진술들은 그렇지 않다.</div></div><div class=\"rnat\">어떤 is 진술은 윤리적 내용을 담고 있고, 어떤 ought 진술은 그렇지 않다.</div><div class=\"rst\">‘이다’ 말투인데 도덕 얘기인 것도, ‘해야’ 말투인데 아닌 것도 있어요. = 지문 5번이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">consider the claims “Murder is wrong” and “Friendship is good.”</div><div class=\"k\">‘살인은 옳지 않다’와 ‘우정은 좋다’라는 주장을 생각해 보라.</div></div><div class=\"rnat\">예를 들어 '살인은 옳지 않다'와 '우정은 좋다'라는 주장을 생각해 보라.</div><div class=\"rst\">예를 들어 “괴롭힘은 나쁘다”, “우정은 좋다”를 떠올려 봐요. 지문 6번의 ‘살인은 옳지 않다’·‘우정은 좋다’예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">These claims obviously have ethical content.</div><div class=\"k\">이 주장들은 명백히 윤리적 내용을 담고 있다.</div></div><div class=\"rnat\">이 주장들은 분명히 윤리적 내용을 담고 있다.</div><div class=\"rst\">이건 누가 봐도 도덕 얘기예요. 지문 7번도 이 주장들이 분명히 윤리적 내용을 담고 있다고 해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Whatever the is-ought test is tracking,</div><div class=\"k\">is-ought 검사가 찾아내는 것이 무엇이든 간에,</div></div><div class=\"rc\"><div class=\"e\">these claims clearly fall on the ought side</div><div class=\"k\">이 주장들은 분명히 ought 쪽에 해당된다</div></div><div class=\"rc\"><div class=\"e\">of that divide.</div><div class=\"k\">그 구분의.</div></div><div class=\"rnat\">is-ought 검사가 무엇을 잡아내는 것이든, 이 주장들은 분명히 그 구분의 ought 쪽에 놓인다.</div><div class=\"rst\">단어 검사가 무엇을 가려내든, 이 말들은 당연히 도덕 쪽이에요. = 지문 8번, ought(~해야 한다) 쪽에 해당한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Yet they both use “is.”</div><div class=\"k\">그러나 그것들은 (= ‘살인은 옳지 않다’와 ‘우정은 좋다’) 둘 다 ‘is’를 사용한다.</div></div><div class=\"rnat\">그런데도 두 문장 모두 'is'를 쓰고 있다.</div><div class=\"rst\">그런데 둘 다 ‘이다’ 말투예요. 지문 9번도 둘 다 is(~이다)를 쓴다고 해요. 반장 규칙이 틀렸어요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Similarly,</div><div class=\"k\">비슷하게,</div></div><div class=\"rc\"><div class=\"e\">consider the claim “The train ought to arrive in an hour.”</div><div class=\"k\">‘기차는 한 시간 안에 도착해야 한다’라는 주장을 생각해 보라.</div></div><div class=\"rnat\">비슷하게 '그 기차는 한 시간 안에 도착해야 한다'라는 주장을 생각해 보라.</div><div class=\"rst\">반대로 “버스는 8시에 와야 해”를 생각해 봐요. 지문 10번의 ‘기차는 한 시간 안에 도착해야 한다’예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">This statement is clearly nonethical,</div><div class=\"k\">이 진술은 분명히 윤리와 관련이 없다,</div></div><div class=\"rc\"><div class=\"e\">the use of “ought” notwithstanding.</div><div class=\"k\">‘ought’의 사용에도 불구하고.</div></div><div class=\"rnat\">이 진술은 'ought'를 쓰고 있음에도 명백히 윤리와 무관하다.</div><div class=\"rst\">‘해야’가 들어갔지만 도덕 얘기가 아니에요. 지문 11번도 ought(~해야 한다)를 써도 윤리와 무관하다고 해요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">There is an important distinction</div><div class=\"k\">중요한 차이가 있다</div></div><div class=\"rc\"><div class=\"e\">between ethical and nonethical claims.</div><div class=\"k\">윤리에 관한 주장과 윤리와 관련이 없는 주장 사이에는.</div></div><div class=\"rnat\">윤리적 주장과 윤리와 무관한 주장 사이에는 중요한 차이가 있다.</div><div class=\"rst\">도덕 얘기와 아닌 얘기를 나누는 건 분명 중요해요. 지문 12번도 그 둘 사이에 중요한 차이가 있다고 인정해요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">But we can’t simply rely on “is” and “ought”</span></div><div class=\"k\"><span class=\"cw\">그러나 우리는 단순히 ‘is’와 ‘ought’에 의존할 수는 없다</span></div></div><div class=\"rc\"><div class=\"e\">to make it.</div><div class=\"k\">그것을 (= 윤리적 주장과 윤리와 무관한 주장의 구분) 하기 위해.</div></div><div class=\"rnat\">그러나 우리는 그 구분을 하기 위해 단순히 'is'와 'ought'에 의존할 수는 없다.</div><div class=\"rst\"><b>하지만</b>(But) 말투만 보고 나눌 수는 없어요. = 지문 13번, is(~이다)·ought(~해야 한다)에만 의존할 수 없다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"14\"><span class=\"rn\">14번 · 단서</span><div class=\"rc\"><div class=\"e\">Instead we need to attend to</div><div class=\"k\">대신에 우리는 ~에 주의를 기울여야 한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the substance of the claim</span>.</div><div class=\"k\"><span class=\"cw\">그 주장의 핵심에</span>.</div></div><div class=\"rnat\">대신 우리는 그 주장의 핵심(내용)에 주의를 기울여야 한다.</div><div class=\"rst\"><b>대신에</b>(Instead) 그 말이 무슨 <b>내용</b>인지 봐야 해요. 지문 14번이 결론이라서, 제목은 ‘단어 선택이냐 내용이냐’예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"proclaim\" data-m=\"분명히 나타내다, 선언하다\"><b>proclaim</b>분명히 나타내다, 선언하다</button><button type=\"button\" class=\"wdb\" data-w=\"discern\" data-m=\"식별하다, 알아차리다\"><b>discern</b>식별하다, 알아차리다</button><button type=\"button\" class=\"wdb\" data-w=\"attend to\" data-m=\"~에 주의를 기울이다\"><b>attend to</b>~에 주의를 기울이다</button><button type=\"button\" class=\"wdb\" data-w=\"deficient\" data-m=\"결함이 있는\"><b>deficient</b>결함이 있는</button><button type=\"button\" class=\"wdb\" data-w=\"notwithstanding\" data-m=\"~에도 불구하고\"><b>notwithstanding</b>~에도 불구하고</button><button type=\"button\" class=\"wdb\" data-w=\"substance\" data-m=\"핵심, 본질\"><b>substance</b>핵심, 본질</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 앞에 <b>and</b>(그리고)가 보이면 <b>and(그리고) 앞에 무엇이 있는지</b>부터 보세요. 앞이 <b>to see</b>(보는)라면 뒤도 같은 모양 (to) 동사원형이 와야 해요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (6번)</span><div class=\"en\">… the ability of the human mind to see behind immediate appearances and <u>⑤ discovers</u> deeper meanings in events.</div><p class=\"ko\">눈앞에 보이는 모습 뒤를 보고 사건들에서 더 깊은 의미를 ( ? ) 인간 정신의 능력</p></div><div class=\"ck-via\"><i>▼</i><span>and(그리고) 앞을 거슬러 올라가면 the ability(능력)를 꾸미는 to see(보는)가 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · and 앞쪽 확인</span><div class=\"en\"><mark>the ability of the human mind</mark> <mark>to see behind immediate appearances</mark></div><p class=\"ko\"><mark>인간 정신의 능력</mark> — <mark>눈앞에 보이는 모습 뒤를 보는</mark></p></div><div class=\"ck-via\"><i>▼</i><span>and(그리고)는 같은 모양끼리 묶어요 → to see(보는)와 짝인 (to) discover(찾아내는)</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">and <mark>discover</mark> deeper meanings in events.</div><p class=\"ko\">그리고 사건들에서 더 깊은 의미를 <mark>찾아내는</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">병렬 구조: and(그리고) 앞뒤는 같은 모양</p><p class=\"gr\">and(그리고)는 같은 모양끼리 이어 줘요. 앞이 to(~하는)+동사원형이면 뒤도 to(~하는)+동사원형이고, 두 번째 to(~하는)는 빼고 동사원형만 써도 돼요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like to swim and run.</div><div class=\"ko\">나는 수영하는 것과 달리는 것을 좋아한다. (to swim과 짝이라 to가 빠진 run이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I like to swim and runs.</div><div class=\"ko\">to swim과 짝인데 runs처럼 -s를 붙여서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She wants to sing and to dance.</div><div class=\"ko\">그녀는 노래하고 춤추고 싶어 한다. (두 번째 to를 써도 맞아요)</div></div><p class=\"gb\">지문 6번도 the ability(능력)를 꾸미는 to see(보는)와 and(그리고)로 이어지니, discovers(찾아낸다)가 아니라 (to) discover(찾아내는)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">discovers → discover (찾아내는)<small>and(그리고) 앞 to see(보는)와 짝이라 to(~하는)가 생략된 동사원형 discover(찾아내다)여야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">where ~하는 (곳)</span><span class=\"why\">4번은 the spots on the horizon(지평선 위의 지점들) 바로 뒤예요. 선행사가 장소이고, 뒤 the sun rises(태양이 떠오른다)가 주어·동사를 다 갖춘 완전한 절이라 관계부사 where(~하는 곳)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">관계부사 where(~하는 곳) + 완전한 절 / 관계대명사 which(~하는 것) + 불완전한 절</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the park where we play soccer.</div><div class=\"ko\">여기가 우리가 축구를 하는 공원이다. (we play soccer가 완전하니 where가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is the park which we play soccer.</div><div class=\"ko\">뒤 절이 완전한데 which(~하는 것)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the park which we visited.</div><div class=\"ko\">이곳이 우리가 방문한 공원이다. (visited 뒤 목적어가 비었으니 which가 맞아요)</div></div><p class=\"gb\">지문 4번도 the sun rises(태양이 떠오른다)가 완전한 절이라 관계부사 where(~하는 곳)가 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">their 그들의</span><span class=\"why\">2번은 gave humans(인간에게 주었다) 바로 뒤예요. ① 자리가 가리키는 것은 복수 humans(인간들)라서 복수 대명사 their(그들의)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">대명사 수 일치: 복수 명사 → their(그들의), 단수 명사 → its(그것의)·his(그의)·her(그녀의)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The students opened their books.</div><div class=\"ko\">학생들이 그들의 책을 펼쳤다. (students 학생들 = 복수라 their가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The students opened its books.</div><div class=\"ko\">복수 students(학생들)를 단수 its(그것의)로 받아서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My sister lost her key.</div><div class=\"ko\">언니가 그녀의 열쇠를 잃어버렸다. (sister 언니 = 한 명이라 her가 맞아요)</div></div><p class=\"gb\">지문 2번도 humans(인간들)의 최초의 방법이라 복수 their(그들의)가 딱 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">is ~이다</span><span class=\"why\">3번의 주어는 Stonehenge(스톤헨지) 하나예요. 콤마 사이 4,000-year-old ring of stones(4,000년 된 고리 모양의 돌들)는 주어를 설명하는 동격이라, stones(돌들)에 끌리지 말고 단수 동사 is(~이다)를 써요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치: 콤마 사이 삽입 설명(동격)은 건너뛰고 진짜 주어에 맞추기</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Tom, my best friend, is tall.</div><div class=\"ko\">내 단짝인 톰은 키가 크다. (진짜 주어 Tom 한 명이라 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Tom, my best friend, are tall.</div><div class=\"ko\">주어가 한 명인데 복수 동사 are를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The box, full of old toys, is heavy.</div><div class=\"ko\">오래된 장난감으로 가득한 그 상자는 무겁다. (toys 장난감들이 아니라 box 상자가 주어라 is가 맞아요)</div></div><p class=\"gb\">지문 3번도 stones(돌들)가 아니라 Stonehenge(스톤헨지)가 주어라 단수 is(~이다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">been used 사용되었을</span><span class=\"why\">5번의 주어는 The stones(그 돌들)예요. 돌은 스스로 쓰는 게 아니라 사람에게 ‘사용되는’ 쪽이라 수동이고, may have(~했을지도 모른다)+과거분사가 합쳐져 may even have been used(심지어 사용되었을지도 모른다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">조동사 may have(~했을지도 모른다)+과거분사 + 수동 be(되다)+과거분사 = may have been(~되었을지도 모른다)+과거분사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The cake may have been eaten by my brother.</div><div class=\"ko\">그 케이크는 내 동생에 의해 먹혔을지도 모른다. (케이크는 먹히는 쪽이라 been eaten이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The cake may have eaten by my brother.</div><div class=\"ko\">케이크가 직접 먹은 게 아닌데 been 없이 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My brother may have eaten the cake.</div><div class=\"ko\">내 동생이 케이크를 먹었을지도 모른다. (동생이 직접 먹으니 능동 have eaten이 맞아요)</div></div><p class=\"gb\">지문 5번도 The stones(그 돌들)가 일식·월식 예측에 ‘사용된’ 쪽이라 have been used(사용되었을)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Most historians of science point to</div><div class=\"k\">대부분의 과학 역사가들은 ~을 지적한다</div></div><div class=\"rc\"><div class=\"e\">the need for a reliable calendar</div><div class=\"k\">믿을 만한 달력의 필요성을</div></div><div class=\"rc\"><div class=\"e\">to regulate agricultural activity</div><div class=\"k\">농업 활동을 조절하기 위한</div></div><div class=\"rc\"><div class=\"e\">as the motivation for learning about</div><div class=\"k\">~에 대해 배우게 된 동기로</div></div><div class=\"rc\"><div class=\"e\">what we now call astronomy,</div><div class=\"k\">오늘날 우리가 천문학이라고 부르는 것,</div></div><div class=\"rc\"><div class=\"e\">the study of stars and planets.</div><div class=\"k\">즉 별과 행성에 대한 연구.</div></div><div class=\"rnat\">대부분의 과학사가는 농업 활동을 조절할 믿을 만한 달력이 필요했다는 점을, 오늘날 우리가 천문학 — 즉 별과 행성에 관한 연구 — 이라 부르는 것을 배우게 된 동기로 지적한다.</div><div class=\"rst\">과학 역사가들은 사람들이 천문학을 배운 이유를 ‘농사용 달력이 필요해서’라고 봐요. what(~하는 것) we now call astronomy(우리가 지금 천문학이라 부르는 것)가 그 대상이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Early astronomy provided information</div><div class=\"k\">초기 천문학은 정보를 제공했다</div></div><div class=\"rc\"><div class=\"e\">about when to plant crops</div><div class=\"k\">언제 작물을 심어야 할지에 관한</div></div><div class=\"rc\"><div class=\"e\">and gave humans their first formal method</div><div class=\"k\">그리고 인간에게 그들의 (= 인간) 최초의 공식적인 방법을 주었다</div></div><div class=\"rc\"><div class=\"e\">of recording the passage of time.</div><div class=\"k\">시간의 흐름을 기록하는.</div></div><div class=\"rnat\">초기 천문학은 작물을 언제 심어야 할지에 관한 정보를 주었고, 인간에게 시간의 흐름을 기록하는 최초의 공식적인 방법을 주었다.</div><div class=\"rst\">천문학은 씨 뿌릴 때를 알려 주고 시간을 기록하는 첫 방법을 줬어요. humans(인간들)를 받으니 복수 <b>their</b>(그들의)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Stonehenge,</div><div class=\"k\">스톤헨지는,</div></div><div class=\"rc\"><div class=\"e\">the 4,000-year-old ring of stones in southern Britain,</div><div class=\"k\">영국 남부에 있는 4,000년 된 고리 모양의 돌들인,</div></div><div class=\"rc\"><div class=\"e\">is perhaps the best-known monument</div><div class=\"k\">아마도 가장 잘 알려진 기념비일 것이다</div></div><div class=\"rc\"><div class=\"e\">to the discovery of regularity and predictability</div><div class=\"k\">규칙성과 예측 가능성의 발견에 대한</div></div><div class=\"rc\"><div class=\"e\">in the world we inhabit.</div><div class=\"k\">우리가 사는 세계에서.</div></div><div class=\"rnat\">영국 남부에 있는 4,000년 된 고리 모양의 돌들인 스톤헨지는, 우리가 사는 세계에서 규칙성과 예측 가능성을 발견해 낸 일을 보여 주는 가장 잘 알려진 기념비일 것이다.</div><div class=\"rst\">스톤헨지는 자연의 규칙성을 발견했다는 가장 유명한 기념비예요. 콤마 사이 설명을 빼면 주어 Stonehenge(스톤헨지)라 <b>is</b>(~이다)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The great markers of Stonehenge point to</div><div class=\"k\">스톤헨지의 커다란 표식들은 ~을 가리킨다</div></div><div class=\"rc\"><div class=\"e\">the spots on the horizon</div><div class=\"k\">지평선 위의 지점들을</div></div><div class=\"rc\"><div class=\"e\">where the sun rises</div><div class=\"k\">태양이 떠오르는</div></div><div class=\"rc\"><div class=\"e\">at the solstices and equinoxes —</div><div class=\"k\">지점(하지·동지)과 분점(춘분·추분)에 —</div></div><div class=\"rc\"><div class=\"e\">the dates we still use</div><div class=\"k\">우리가 여전히 사용하는 날짜들</div></div><div class=\"rc\"><div class=\"e\">to mark the beginnings of the seasons.</div><div class=\"k\">계절의 시작을 표시하기 위해.</div></div><div class=\"rnat\">스톤헨지의 커다란 표식들은 지평선에서 태양이 지점(하지·동지)과 분점(춘분·추분)에 떠오르는 위치를 가리키는데, 그날들은 우리가 여전히 계절의 시작을 표시하는 데 쓰는 날짜이다.</div><div class=\"rst\">큰 돌들은 하지·동지와 춘분·추분에 해가 뜨는 지점을 가리켜요. 장소 뒤 완전한 절이라 <b>where</b>(~하는 곳)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The stones may even have been used</div><div class=\"k\">그 돌들은 심지어 사용되었을지도 모른다</div></div><div class=\"rc\"><div class=\"e\">to predict eclipses.</div><div class=\"k\">일식과 월식을 예측하는 데.</div></div><div class=\"rnat\">이 돌들은 심지어 일식과 월식을 예측하는 데 사용되었을지도 모른다.</div><div class=\"rst\">그 돌들은 일식·월식 예측에도 쓰였을지 몰라요. 돌은 쓰이는 쪽이라 <b>have been used</b>(사용되었을)예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">The existence of Stonehenge,</div><div class=\"k\">스톤헨지의 존재는,</div></div><div class=\"rc\"><div class=\"e\">built by people without writing,</div><div class=\"k\">문자가 없는 사람들에 의해 세워진,</div></div><div class=\"rc\"><div class=\"e\">bears silent testimony</div><div class=\"k\">소리 없이 증언한다</div></div><div class=\"rc\"><div class=\"e\">both to the regularity of nature</div><div class=\"k\">자연의 규칙성과</div></div><div class=\"rc ckc\"><div class=\"e\">and to <span class=\"cw\">the ability of the human mind</span></div><div class=\"k\"><span class=\"cw\">인간 정신의 능력</span> 둘 다를</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to see behind immediate appearances</span></div><div class=\"k\"><span class=\"cw\">눈앞에 보이는 모습 뒤를 보는</span></div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">discover</span> deeper meanings in events.</div><div class=\"k\">그리고 사건들에서 더 깊은 의미를 <span class=\"cw\">찾아내는</span>. ※ 문제지엔 discovers로 되어 있음</div></div><div class=\"rnat\">문자가 없던 시절 사람들이 세운 스톤헨지의 존재는, 자연의 규칙성과, 눈앞에 보이는 모습 뒤를 들여다보고 사건에서 더 깊은 의미를 찾아내는 인간 정신의 능력을 둘 다 소리 없이 증언한다.</div><div class=\"rst\">글자 없던 사람들이 세운 스톤헨지는 자연의 규칙성과, 겉모습 뒤를 <b>보고</b>(to see) 깊은 의미를 <b>찾아내는</b>(discover) 인간의 능력을 보여 줘요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"reliable\" data-m=\"믿을 만한\"><b>reliable</b>믿을 만한</button><button type=\"button\" class=\"wdb\" data-w=\"regulate\" data-m=\"조절하다, 규제하다\"><b>regulate</b>조절하다, 규제하다</button><button type=\"button\" class=\"wdb\" data-w=\"regularity\" data-m=\"규칙성\"><b>regularity</b>규칙성</button><button type=\"button\" class=\"wdb\" data-w=\"predictability\" data-m=\"예측 가능성\"><b>predictability</b>예측 가능성</button><button type=\"button\" class=\"wdb\" data-w=\"eclipse\" data-m=\"(해·달의) 식, 일식·월식\"><b>eclipse</b>(해·달의) 식, 일식·월식</button><button type=\"button\" class=\"wdb\" data-w=\"testimony\" data-m=\"증언, 증거\"><b>testimony</b>증언, 증거</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>35%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">2번 <b>But</b>(그러나)에서 ‘성장은 목적이 아니라 수단’으로 방향이 꺾이고, 뒤에는 계속 <b>양 → 질</b>로 바꾸자는 말이 나와요. 낡은 성장 개념을 ‘유지하자’는 낱말이 그 방향과 어긋나요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 방향 전환</span><div class=\"en\">But growth is the means to achieve desired goals, <mark>not the end in itself</mark>.</div><p class=\"ko\">그러나 성장은 원하는 목표를 성취하기 위한 수단이다, <mark>그 자체로 목적인 것이 아니라</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>성장이 목적이 아니라면, 지금까지 재 온 성장 개념은 고쳐야 해요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ②번 자리 (3번)</span><div class=\"en\">In the richer world the whole idea of growth — at least as conventionally measured — may need to be <u>② maintained</u>.</div><p class=\"ko\">더 부유한 세계에서는 관습적으로 측정되어 온 성장 개념 전체가 ( 유지되어야? ) 할지도 모른다 → 개정되어야가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>6번 ‘점점 더 많은 물건’과 다르게, Instead(대신에) 질이 기준이 된다고 해요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 결정적 단서</span><div class=\"en\">Instead, it means <mark>improvements in quality</mark>, something that GDP is ill equipped to measure.</div><p class=\"ko\">대신에, 그것은 <mark>질의 향상</mark>을 의미한다, 즉 GDP가 측정할 준비를 제대로 갖추지 못한 것을.</p></div><div class=\"ck-via\"><i>▼</i><span>경제는 바뀌었는데 측정법은 그대로라고 꼬집어요 → 측정법을 바꿔야 함</span></div><div class=\"ck-step\"><span class=\"lab\">10번 · 마지막 비판으로 확인</span><div class=\"en\">But we are <mark>still measuring</mark> the size of the lasso.</div><p class=\"ko\">그러나 우리는 <mark>여전히 재고 있다</mark> 올가미 밧줄의 크기를.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">maintained(유지되다) ↔ overhauled(개정되다, 점검·수리되다)</p><p class=\"gr\">앞에서 ‘지금 방식은 맞지 않는다’고 하면 뒤에는 overhauled(개정되다)처럼 바꾸는 말이 와요. maintained(유지되다)는 지금 방식이 괜찮을 때만 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>My old bike is broken, so it needs to be fixed.</div><div class=\"ko\">내 낡은 자전거가 고장 나서 고쳐야 해요. (문제 → 바꾸기)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>My old bike is broken, so it needs to be kept the same.</div><div class=\"ko\">고장 났는데 그대로 두자? 방향이 거꾸로라 어색해요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My bike works well, so I will keep it.</div><div class=\"ko\">자전거가 잘 굴러가니 그대로 쓸 거예요. (괜찮음 → 유지)</div></div><p class=\"gb\">지문 2번에서 성장은 목적이 아니라고 했고 7번에서 질이 기준이라고 하니, 3번은 maintained(유지되다)가 아니라 overhauled(개정되다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">maintained → overhauled (개정되다)<small>성장은 목적이 아니고(2번) 질로 바뀌어야(7번) 하니, 낡은 성장 개념은 유지가 아니라 고쳐야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">end 목적, 목표</span><span class=\"why\">2번은 But(그러나)으로 means(수단)와 end(목적)를 맞세워요. 성장은 목표를 이루는 수단이지 목적 그 자체가 아니라는 뜻이라 end(목적)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">individual 개인적인</span><span class=\"why\">5번의 genome-specific medicines(게놈 맞춤형 약)·personalized care(개인 맞춤형 돌봄)·tailored suits(맞춤 정장)가 모두 한 사람에게 맞춘 것이라 individual(개인적인)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">quality 질</span><span class=\"why\">6번에서 more and more stuff(점점 더 많은 물건)와 다르다고 한 뒤 Instead(대신에)가 나오니 양의 반대인 quality(질)가 맞아요. 8번 quality and complexity(품질과 복잡성)도 같은 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">move 이동, 전환</span><span class=\"why\">9번은 from manufacturing to services(제조업에서 서비스업으로)처럼 한쪽에서 다른 쪽으로 옮겨 가는 이야기이고, 뒤에서 shift(전환)로 다시 받으니 move(이동)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In poorer countries</div><div class=\"k\">가난한 나라들에서는</div></div><div class=\"rc\"><div class=\"e\">many years of fast growth may be necessary</div><div class=\"k\">여러 해에 걸친 빠른 성장이 필수적일 수도 있다</div></div><div class=\"rc\"><div class=\"e\">to bring living standards up to acceptable levels.</div><div class=\"k\">생활 수준을 용인될 만한 수준까지 끌어올리기 위해.</div></div><div class=\"rnat\">가난한 나라에서는 생활 수준을 용인될 만한 수준까지 끌어올리기 위해 여러 해에 걸친 빠른 성장이 필수적일 수도 있다.</div><div class=\"rst\">가난한 나라는 생활 수준을 끌어올리려고 오랫동안 빠르게 성장해야 할 수도 있어요. 여기까진 성장이 필요하다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">But growth is the means</div><div class=\"k\">그러나 성장은 수단이다</div></div><div class=\"rc\"><div class=\"e\">to achieve desired goals,</div><div class=\"k\">원하는 목표를 성취하기 위한,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">not the end in itself</span>.</div><div class=\"k\"><span class=\"cw\">그 자체로 목적인 것이 아니라</span>.</div></div><div class=\"rnat\">그러나 성장은 원하는 목표를 이루기 위한 수단이지, 그 자체로 목적은 아니다.</div><div class=\"rst\"><b>그러나</b>(But) 성장은 목표를 이루는 <b>수단</b>이지 <b>목적</b>(end) 그 자체는 아니에요. 여기서 글의 방향이 꺾여요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">In the richer world</div><div class=\"k\">더 부유한 세계에서는</div></div><div class=\"rc\"><div class=\"e\">the whole idea of growth —</div><div class=\"k\">성장이라는 개념 전체가 —</div></div><div class=\"rc\"><div class=\"e\">at least as conventionally measured —</div><div class=\"k\">적어도 관습적으로 측정되어 온 것으로서의 —</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">may need to be overhauled</span>.</div><div class=\"k\"><span class=\"cw\">개정되어야 할지도 모른다</span>. ※ 문제지엔 maintained로 되어 있음</div></div><div class=\"rnat\">더 부유한 세계에서는 성장이라는 개념 전체가 — 적어도 관습적으로 측정되어 온 방식으로는 — 개정되어야 할지도 모른다.</div><div class=\"rst\">그래서 부유한 나라에선 지금까지 재 온 성장 개념을 <b>고쳐야</b>(overhauled 개정되다) 해요. 문제지의 maintained(유지되다)는 거꾸로예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In economies where services dominate,</div><div class=\"k\">서비스가 지배하는 경제에서는,</div></div><div class=\"rc\"><div class=\"e\">goods and services tailored to our individual needs</div><div class=\"k\">우리의 개인적인 필요에 맞춰진 재화와 서비스가</div></div><div class=\"rc\"><div class=\"e\">will be what determine the advance of our societies.</div><div class=\"k\">우리 사회의 발전을 결정하는 것이 될 것이다.</div></div><div class=\"rnat\">서비스가 지배하는 경제에서는, 우리의 개인적 필요에 맞춰진 재화와 서비스가 우리 사회의 발전을 결정하는 것이 될 것이다.</div><div class=\"rst\">서비스 중심 경제에선 <b>개인</b>(individual 개인적인) 필요에 맞춘 것이 사회의 발전을 결정해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">These could be anything</div><div class=\"k\">이것들은 (= 개인의 필요에 맞춰진 재화와 서비스) 무엇이든 될 수 있다</div></div><div class=\"rc\"><div class=\"e\">from genome-specific medicines</div><div class=\"k\">게놈 맞춤형 약에서부터</div></div><div class=\"rc\"><div class=\"e\">to personalized care or tailored suits.</div><div class=\"k\">개인 맞춤형 돌봄이나 맞춤 정장에 이르기까지.</div></div><div class=\"rnat\">이것들은 게놈 맞춤형 의약품부터 개인 맞춤형 돌봄이나 맞춤 정장에 이르기까지 무엇이든 될 수 있다.</div><div class=\"rst\">게놈 맞춤형 약, 개인 맞춤형 돌봄, 맞춤 정장처럼 나에게 딱 맞춘 것들이에요. 4번의 개인 맞춤 예시예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">That is different from more and more stuff,</div><div class=\"k\">그것은 (= 개인의 필요에 맞춰진 재화와 서비스) 점점 더 많은 물건과는 다르다,</div></div><div class=\"rc\"><div class=\"e\">an arms race of growth.</div><div class=\"k\">즉 성장의 군비 경쟁과는.</div></div><div class=\"rnat\">그것은 점점 더 많은 물건, 즉 성장의 군비 경쟁과는 다르다.</div><div class=\"rst\">이건 물건을 점점 더 많이 만드는 ‘성장 경쟁’과는 달라요. 양을 늘리는 쪽이 아니라는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Instead,</div><div class=\"k\">대신에,</div></div><div class=\"rc ckc\"><div class=\"e\">it means <span class=\"cw\">improvements in quality</span>,</div><div class=\"k\">그것은 (= 개인의 필요에 맞춰진 재화와 서비스) <span class=\"cw\">질의 향상</span>을 의미한다,</div></div><div class=\"rc\"><div class=\"e\">something that GDP is ill equipped to measure.</div><div class=\"k\">즉 GDP가 측정할 준비를 제대로 갖추지 못한 것을.</div></div><div class=\"rnat\">대신 그것은 질의 향상, 즉 GDP가 측정할 준비를 제대로 갖추지 못한 무언가를 뜻한다.</div><div class=\"rst\"><b>대신에</b>(Instead) 이건 <b>질</b>(quality)의 향상을 뜻해요. 그런데 GDP(국내총생산)는 이 질을 잘 재지 못해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Some fifty years ago</div><div class=\"k\">약 50년 전에</div></div><div class=\"rc\"><div class=\"e\">one US economist contrasted</div><div class=\"k\">한 미국 경제학자는 대조했다</div></div><div class=\"rc\"><div class=\"e\">what he called the “cowboy” economy,</div><div class=\"k\">그가 (= 그 미국 경제학자) ‘카우보이’ 경제라고 부른 것을,</div></div><div class=\"rc\"><div class=\"e\">bent on production, exploitation of resources, and pollution,</div><div class=\"k\">생산, 자원 착취, 그리고 오염에 집중하는,</div></div><div class=\"rc\"><div class=\"e\">with the “spaceman” economy,</div><div class=\"k\">‘우주인’ 경제와,</div></div><div class=\"rc\"><div class=\"e\">in which quality and complexity replaced “throughput”</div><div class=\"k\">그 경제에서는 (= ‘우주인’ 경제) 품질과 복잡성이 ‘처리량’을 대체했다</div></div><div class=\"rc\"><div class=\"e\">as the measure of success.</div><div class=\"k\">성공의 척도로서.</div></div><div class=\"rnat\">약 50년 전 한 미국 경제학자는 생산과 자원 착취, 오염에 집중하는, 자신이 '카우보이' 경제라고 부른 것을, 품질과 복잡성이 '처리량'을 대신해 성공의 척도가 된 '우주인' 경제와 대조했다.</div><div class=\"rst\">50년 전 한 경제학자는 생산·자원 착취의 ‘카우보이’ 경제와, 품질과 복잡성이 성공 기준인 ‘우주인’ 경제를 비교했어요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The move from manufacturing to services</div><div class=\"k\">제조업에서 서비스업으로의 이동은</div></div><div class=\"rc\"><div class=\"e\">and from analog to digital</div><div class=\"k\">그리고 아날로그에서 디지털로의</div></div><div class=\"rc\"><div class=\"e\">is the shift from cowboy to spaceman.</div><div class=\"k\">카우보이에서 우주인으로의 전환이다.</div></div><div class=\"rnat\">제조업에서 서비스업으로, 그리고 아날로그에서 디지털로의 이동이 바로 카우보이에서 우주인으로의 전환이다.</div><div class=\"rst\">제조업에서 서비스업으로, 아날로그에서 디지털로의 <b>이동</b>(move)이 바로 카우보이에서 우주인으로 가는 전환이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc ckc\"><div class=\"e\">But we are <span class=\"cw\">still measuring</span></div><div class=\"k\">그러나 우리는 <span class=\"cw\">여전히 재고 있다</span></div></div><div class=\"rc\"><div class=\"e\">the size of the lasso.</div><div class=\"k\">올가미 밧줄의 크기를.</div></div><div class=\"rnat\">그러나 우리는 여전히 (카우보이가 쓰던) 올가미 밧줄의 크기를 재고 있다.</div><div class=\"rst\"><b>그러나</b>(But) 우리는 여전히 카우보이의 올가미 밧줄 크기를 재고 있어요. 그래서 성장 개념을 3번처럼 고쳐야 해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"means\" data-m=\"수단\"><b>means</b>수단</button><button type=\"button\" class=\"wdb\" data-w=\"in itself\" data-m=\"그 자체로\"><b>in itself</b>그 자체로</button><button type=\"button\" class=\"wdb\" data-w=\"conventionally\" data-m=\"관습적으로\"><b>conventionally</b>관습적으로</button><button type=\"button\" class=\"wdb\" data-w=\"tailored to\" data-m=\"~에 맞춰진\"><b>tailored to</b>~에 맞춰진</button><button type=\"button\" class=\"wdb\" data-w=\"ill equipped to\" data-m=\"~할 준비를 제대로 갖추지 못한\"><b>ill equipped to</b>~할 준비를 제대로 갖추지 못한</button><button type=\"button\" class=\"wdb\" data-w=\"exploitation\" data-m=\"착취, 이용\"><b>exploitation</b>착취, 이용</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" data-q="'+d.no+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
