<title>고3 미니모의고사 18회 07–12번</title>
<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();

{"e": "<b>is correlated with<\/b> the colony’s overall need of water.", "k": "군집의 전반적인 물 수요와 상관관계가 있다."}], "link": "물을 받는 벌들은 자신들을 위해서든 다른 벌들과 애벌레들에게 전해주기 위해서든 물이 필요할 때만 물을 받을 것이므로, 이러한 물을 넘겨주는 시간은 군집의 전반적인 물 수요와 상관관계가 있다.", "easy": "물을 받는 벌은 물이 필요할 때만 받아 주니까, 물을 넘기는 데 걸리는 시간을 보면 군집 전체에 물이 얼마나 필요한지 알 수 있어요.", "gist": "넘겨주는 시간 = 군집의 물 수요를 알려 주는 신호예요."}, {"n": 7, "ch": [{"e": "<b>Thus<\/b> the individual water <b>forager’s<\/b> response", "k": "따라서 개별적인 물 조달자의 반응은"}, {"e": "to unloading time (up or down)", "k": "(시간이 늘어나든 혹은 줄어들든 간에) 물을 넘겨주는 시간에 대한"}, {"e": "<b>regulates<\/b> water collection", "k": "물 수집(량)을 조절한다"}, {"e": "in response to the colony’s need.", "k": "군집의 수요에 반응하여."}], "link": "따라서 (시간이 늘어나든 혹은 줄어들든 간에) 물을 넘겨주는 시간에 대한 개별적인 물 조달자의 반응은 군집의 수요에 맞춰 물 수집(량)을 조절한다.", "easy": "결국 벌 하나하나가 물을 넘기는 시간에 반응하는 것만으로, 군집에 필요한 만큼 물 모으기가 조절돼요.", "gist": "결론 — 개체의 반응이 군집의 물 수집을 조절해요."}]}, {"no": "08", "typ": "무관한 문장", "src": "2019년 4월 35번", "evn": [1, 5, 6], "ev_en": "Some of the things we profess to value in the abstract may not, in fact, characterize our actual everyday experiences. / This is because most parents put more value on discipline than on blind love, and thus honest conversations rather than well-intentioned lies are the better tool for establishing solid relationship between parents and their kids. / As one author put it, “If you want to have love in your life, you’d better be prepared to tell some lies and to believe some lies.”", "ev_ko": [[1, "추상적으로(관념상) 우리가 소중히 여긴다고 주장하는 것들 중에 일부는, 실제로는, 우리의 실제 일상 경험의 특성을 나타내지 않을지도 모른다."], [5, "이는 대부분의 부모가 맹목적인 사랑보다 훈육에 더 가치를 두기 때문이며, 따라서 선의의 거짓말보다는 솔직한 대화가 부모와 그들의 아이들 사이에 견고한 관계를 확립하는 데 더 좋은 수단이다."], [6, "어떤 작가가 말했듯이, “당신이 당신의 삶에서 사랑을 가지기를 원한다면, 당신은 약간의 거짓말을 하고 약간의 거짓말을 믿을 준비가 되어있는 편이 좋다(되어있어야 한다).”"]], "why": ["(1)에서 우리가 추상적으로 소중하다고 말하는 것들이 실제 일상과는 다를 수 있다고 글의 방향을 잡습니다", "이어서 정직이 관계의 기본이라고 말하면서도, 연인과 아이에게 거짓말을 한다는 예가 나옵니다", "(6)의 인용도 사랑을 원한다면 약간의 거짓말을 하고 믿을 준비가 되어 있어야 한다고 마무리합니다", "그런데 (5)는 선의의 거짓말보다 <b>솔직한 대화<\/b>가 견고한 관계를 만드는 데 더 좋은 수단이라고 합니다", "글 전체의 흐름과 정반대되는 주장이므로 정답은 ④입니다."], "ch": [{"n": "①", "t": "For instance, we say that “honesty” and “open communication” are the foundational values of any strong relationship.", "g": "예를 들어, 우리는 ‘정직함’과 ‘개방적 의사소통’이 어떠한 굳건한 관계에서든지 기본적인 가치라고 말한다.", "ok": false, "e": ["(1)에서 말한 '추상적으로 소중하다고 주장하는 것'의 예로 정직함과 개방적 의사소통을 듭니다", "For instance(예를 들어)로 자연스럽게 이어집니다."]}, {"n": "②", "t": "But think of how many times you’ve lied to a potential romantic partner in order to make the person feel better about himself or herself.", "g": "하지만 당신이 잠재적 연애 상대에게 그 사람이 자기 자신에 대해 기분이 나아지도록 만들기 위해서 몇 번이나 거짓말을 해 왔는지 생각해 보라.", "ok": false, "e": ["But으로 앞의 말을 뒤집고, 연애 상대에게 거짓말을 한 경우를 첫 번째 예로 듭니다", "글의 흐름에 맞습니다."]}, {"n": "③", "t": "Likewise, every parent knows that lying to their kids about everything from the arrival of Santa Claus to the horrible things that will happen if they don’t eat their peas is a key component of raising a child.", "g": "마찬가지로, 모든 부모는 산타클로스가 오는 것에서부터 완두콩을 먹지 않으면 일어날 끔찍한 일들까지 모든 것에 대해 아이들에게 거짓말하는 것이 아이를 키우는 것의 중요한 요소라는 것을 알고 있다.", "ok": false, "e": ["Likewise(마찬가지로)로 부모가 아이에게 거짓말하는 두 번째 예를 덧붙입니다", "글의 흐름에 맞습니다."]}, {"n": "④", "t": "This is because most parents put more value on discipline than on blind love, and thus honest conversations rather than well-intentioned lies are the better tool for establishing solid relationship between parents and their kids.", "g": "이는 대부분의 부모가 맹목적인 사랑보다 훈육에 더 가치를 두기 때문이며, 따라서 선의의 거짓말보다는 솔직한 대화가 부모와 아이들 사이에 견고한 관계를 확립하는 데 더 좋은 수단이다.", "ok": true, "e": ["바로 앞 문장은 아이에게 하는 거짓말이 아이를 키우는 데 중요한 요소라고 했습니다", "그런데 이 문장은 선의의 거짓말보다 솔직한 대화가 더 좋은 수단이라고 합니다", "글의 흐름과 정반대이므로 관계없는 문장입니다."]}, {"n": "⑤", "t": "As one author put it, “If you want to have love in your life, you’d better be prepared to tell some lies and to believe some lies.”", "g": "어떤 작가가 말했듯이, “삶에서 사랑을 가지기를 원한다면, 약간의 거짓말을 하고 약간의 거짓말을 믿을 준비가 되어 있는 편이 좋다.”", "ok": false, "e": ["어떤 작가의 말을 빌려, 사랑을 원한다면 약간의 거짓말을 하고 믿을 준비가 되어 있어야 한다고 마무리합니다", "글 전체의 내용과 맞습니다."]}], "tr":  ~이다)", "C: a key component (핵심 요소. component 구성 요소)", "of raising a child (아이를 키우는 일의)는 component를 꾸미는 형용사구. raise 키우다", "뼈대 = <b>lying is a key component</b>"]}, {"t": "주어 <b>lying to their kids about everything</b>에서 to their kids (아이들에게)는 lie to의 일부라 거의 필수에 가까운 부사구, about everything (모든 것에 대해)은 lying을 꾸민다. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준). their = every parent의 것이라 부모들을 가리킨다."}, {"t": "<b>from the arrival of Santa Claus to the horrible things that will happen if they don't eat their peas</b>는 <b>from A to B 전치사구(형용사구)</b>이다. everything을 꾸미며 'A에서 B에 이르기까지'라는 뜻이다.", "sub": ["arrival 도착, horrible 끔찍한", "that will happen ~은 things를 꾸미는 관계절 (벌어질)", "if they don't eat their peas (완두콩을 먹지 않으면)는 happen을 꾸미는 조건절. they = kids"]}, {"t": "함정: lying은 동명사이고, 이 that절의 동사는 맨 끝 is 하나이다."}], "sum": "아이에게 하는 거짓말이 육아의 핵심 요소라는 모든 부모의 인식"}, {"i": "04", "q": "09", "s": "4", "title": "S+V+C(2형식) + in the sense that절", "eng": "The input<sup>1</sup> that children get is haphazard<sup>2</sup> / in the sense that<sup>3</sup> caretakers<sup>4</sup> do not talk to their children / to illustrate<sup>5</sup> a particular point of grammar.", "notes": [["1", "input", "입력, 들어오는 정보"], ["2", "haphazard", "무작위적인"], ["3", "in the sense that", "~라는 의미에서"], ["4", "caretaker", "양육자"], ["5", "illustrate", "보여 주다, 예시하다"]], "lit": "아이들이 받는 입력은 무작위적이다 / 양육자들이 아이들에게 말을 거는 것이 아니라는 의미에서 / 문법의 특정 요점을 보여 주기 위해.", "nat": "아이들이 받는 언어 입력은 무작위적이다. 양육자가 문법의 특정 요점을 가르치려고 아이에게 말을 거는 것은 아니라는 의미에서 그렇다.", "ana": "<b>in the sense that ~</b>은 '<b>~라는 의미에서</b>'라는 뜻의 굳어진 표현으로, 앞에서 한 말이 <b>어떤 의미로 그런지</b>를 한정해 준다. 여기서 <b>that</b>은 관계대명사가 아니라 <b>the sense의 내용을 설명하는 동격의 접속사</b>이므로 뒤에 <b>완전한 문장</b>이 온다. 같은 형태로 <b>the fact that</b>, <b>the idea that</b>, <b>the possibility that</b>이 있으니 묶어서 익혀 두자. 문장 앞부분의 <b>The input that children get</b>에서 <b>that</b>은 반대로 <b>목적격 관계대명사</b>다. get의 목적어가 비어 있으므로 구별할 수 있다. 한 문장 안에 <b>동격의 that</b>과 <b>관계대명사 that</b>이 함께 나온 셈이니, <b>뒤가 완전한가 불완전한가</b>로 판단하는 연습에 딱 좋다. 마지막 <b>to illustrate</b>는 목적의 to부정사다.", "pe": "The input<sup>1</sup> \u0001that children get\u0002 is haphazard<sup>2</sup> / \u0001in the sense that<sup>3</sup> caretakers<sup>4</sup> do not talk to their children\u0002 / \u0001to illustrate<sup>5</sup> a particular point of grammar\u0002.", "pk": "\u0001아이들이 받는\u0002 입력은 무작위적이다 / \u0001양육자들이 아이들에게 말을 거는 것이 아니라는 의미에서\u0002 / \u0001문법의 특정 요점을 보여 주기 위해\u0002.", "core": "입력은 무작위적이다.", "tags": ["주어 The input + 동사 is + 보어 haphazard: 2형식. (that children get) = 관계절(형용사절, 목적격 관계대명사): input을 꾸밈", "(in the sense that …) = 전치사구(부사구): haphazard를 꾸밈, '~라는 의미에서' [기준: 형용사 뒤 전치사구 = 수식어]", "(to illustrate a particular point of grammar) = to부정사(부사적: 목적): talk를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 뒤 전치사구 안에 that절이 있어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The input (입력)", "V: is (be ~이다)", "C: haphazard (무작위적인)", "뼈대 = <b>The input is haphazard</b>"]}, {"t": "<b>that children get</b>은 <b>목적격 관계절(형용사절, that은 get의 목적어)</b>이다. input을 꾸미며 '아이들이 받는'이라는 뜻이다."}, {"t": "<b>in the sense that caretakers do not talk to their children</b>은 <b>전치사구(부사구)</b>이다. haphazard를 꾸미며 '양육자들이 아이들에게 말을 거는 것이 아니라는 의미에서'라는 뜻이다.", "sub": ["in the sense that ~ = ~라는 의미에서. 이 that절은 sense의 내용을 설명하는 동격절", "caretaker 양육자. 기준: 형용사 보어 뒤 전치사구는 수식어로 본다"]}, {"t": "<b>to illustrate a particular point of grammar</b>는 <b>to부정사(부사적 용법: 목적)</b>이다. talk를 꾸미며 '문법의 특정 요점을 보여 주기 위해'라는 뜻이다. (illustrate 보여 주다, particular 특정한)"}], "sum": "아이에게 주는 입력은 문법을 가르치려는 말이 아니라 무작위"}, {"i": "05", "q": "09", "s": "9", "title": "S+V(1형식) not A but rather B + 과거분사구", "eng": "This 'creativity' does not refer to<sup>1</sup> the ability to write poetry<sup>2</sup> or novels / but rather the ability to produce and understand an unlimited<sup>3</sup> set of new sentences / never spoken or heard previously<sup>4</sup>.", "notes": [["1", "refer to", "~을 가리키다"], ["2", "poetry", "시"], ["3", "unlimited", "무한한"], ["4", "previously", "이전에"]], "lit": "이 '창의성'은 시나 소설을 쓰는 능력을 가리키는 것이 아니라 / 오히려 무한한 새 문장들을 만들어 내고 이해하는 능력을 가리킨다 / 이전에 결코 말해지거나 들려진 적 없는.", "nat": "여기서 말하는 '창의성'은 시나 소설을 쓰는 능력이 아니라, 이전에 말해지거나 들린 적 없는 무한한 새 문장을 만들어 내고 이해하는 능력을 뜻한다.", "ana": "<b>not A but rather B</b>는 '<b>A가 아니라 오히려 B</b>'라는 병렬이다. rather가 끼어 있어도 뼈대는 <b>not A but B</b> 그대로이며, 병렬이므로 <b>A와 B의 형태가 같아야</b> 한다. 실제로 <b>the ability to write ~</b>와 <b>the ability to produce and understand ~</b>가 정확히 같은 모양으로 짝을 이룬다. 이렇게 <b>같은 명사가 반복되면 병렬의 확실한 증거</b>이니, 긴 문장에서 짝을 찾을 때 단서로 삼자. B 안의 <b>produce and understand</b>도 <b>to에 함께 걸리는</b> 작은 병렬이다. 문장 끝의 <b>never spoken or heard previously</b>는 새 절이 아니라 앞의 <b>new sentences</b>를 뒤에서 꾸미는 <b>과거분사구</b>다. 문장은 '말해지고 들리는' 쪽이므로 능동 speaking이 아니라 <b>과거분사</b>가 온 것이다.", "pe": "This 'creativity' does not refer \u0001to<sup>1</sup> the ability \u0001to write poetry<sup>2</sup> or novels\u0002\u0002 / \u0001but rather the ability to produce and understand an unlimited<sup>3</sup> set of new sentences\u0002 / \u0001never spoken or heard previously<sup>4</sup>\u0002.", "pk": "이 '창의성'은 \u0001시나 소설을 쓰는 능력을\u0002 가리키는 것이 아니라 / \u0001오히려 무한한 새 문장들을 만들어 내고 이해하는 능력을\u0002 가리킨다 / \u0001이전에 결코 말해지거나 들려진 적 없는\u0002.", "core": "이 창의성은 가리키지 않는다.", "tags": ["주어 This 'creativity' + 동사 does not refer: 1형식. (to the ability …) = 거의 필수에 가까운 부사구(refer to) [기준: 모양 규칙], (to write …) = to부정사(형용사적)", "(but rather the ability …) = 앞 전치사구에 이어지는 <b>병렬</b>: refer를 꾸밈. not A but (rather) B 구조", "(never spoken or heard previously) = 과거분사구(형용사적): sentences를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. not A but rather B 구조와 후치 수식으로 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: This 'creativity' (이 '창의성')", "V: does not refer (refer 가리키다의 부정)", "뼈대 = <b>This 'creativity' does not refer</b>"]}, {"t": "<b>to the ability to write poetry or novels</b>는 refer to (~을 가리키다)의 일부라 <b>거의 필수에 가까운 부사구</b>이다. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준).", "sub": ["to write poetry or novels는 ability를 꾸미는 to부정사 (시나 소설을 쓰는)", "ability 능력, poetry 시, novel 소설"]}, {"t": "<b>but rather the ability to produce and understand an unlimited set of new sentences</b>는 <b>not A but rather B</b>의 B이다. refer를 꾸미는 병렬 전치사구로 본다. '오히려 무한한 새 문장을 만들어 내고 이해하는 능력'이라는 뜻이다. (produce 만들어 내다, unlimited 무한한)"}, {"t": "<b>never spoken or heard previously</b>는 <b>과거분사구</b>이다. sentences를 뒤에서 꾸미며 '이전에 결코 말해지거나 들려진 적 없는'이라는 뜻이다. (previously 이전에)"}, {"t": "함정: spoken, heard는 동사가 아니라 sentences를 꾸미는 과거분사이다."}], "sum": "창의성은 시 쓰기 말고 새 문장을 만들고 이해하는 능력"}, {"i": "06", "q": "10", "s": "A-2", "title": "S+V 두 절 병렬 + as절", "eng": "Skirts were bouncing<sup>1</sup> lightly / and pants were dancing delightedly<sup>2</sup> in the seasonable<sup>3</sup> weather / as the spring breeze chased<sup>4</sup> them playfully.", "notes": [["1", "bounce", "튀어 오르다"], ["2", "delightedly", "즐겁게"], ["3", "seasonable", "계절에 어울리는"], ["4", "chase", "뒤쫓다"]], "lit": "치마들은 가볍게 튀어 오르고 있었고 / 바지들은 계절에 어울리는 날씨 속에서 즐겁게 춤추고 있었다 / 봄바람이 장난스럽게 그것들을 뒤쫓는 가운데.", "nat": "봄바람이 장난스레 뒤쫓는 가운데, 치마는 가볍게 나풀거리고 바지는 화창한 날씨 속에서 즐겁게 춤추고 있었다.", "ana": "<b>were bouncing</b>과 <b>were dancing</b>이라는 <b>과거진행 두 개가 and로 병렬</b>된 문장이다. 과거진행은 '그때 한창 ~하고 있었다'는 <b>생생한 장면</b>을 만들기 때문에 심경·분위기 문항의 도입부에 자주 등장한다. 여기서는 치마와 바지가 마치 살아 움직이는 것처럼 그려지는데, 이것이 <b>의인화</b>이며 밝고 경쾌한 분위기를 만들어 낸다. 뒤의 <b>as</b>는 이유(~ 때문에)가 아니라 <b>동시상황·시간</b>을 나타내는 접속사로 '<b>~하는 가운데, ~하면서</b>'로 읽어야 자연스럽다. as는 <b>때·이유·양보·비례·비교</b> 등 뜻이 대단히 많으므로, 반드시 <b>앞뒤 내용으로 판단</b>해야 한다. <b>seasonable</b>은 '<b>계절에 어울리는</b>'이라는 뜻으로, 철자가 비슷한 <b>reasonable</b>(합리적인)과 혼동하지 말자.", "pe": "Skirts were bouncing<sup>1</sup> \u0001lightly\u0002 / and pants were dancing \u0001delightedly<sup>2</sup>\u0002 \u0001in the seasonable<sup>3</sup> weather\u0002 / \u0001as the spring breeze chased<sup>4</sup> them playfully\u0002.", "pk": "치마들은 \u0001가볍게\u0002 튀어 오르고 있었고 / 바지들은 \u0001계절에 어울리는 날씨 속에서\u0002 \u0001즐겁게\u0002 춤추고 있었다 / \u0001봄바람이 장난스럽게 그것들을 뒤쫓는 가운데\u0002.", "core": "치마들은 튀어 오르고 있었고 바지들은 춤추고 있었다.", "tags": ["주어 Skirts + 동사 were bouncing: 1형식. (lightly) = 부사: were bouncing을 꾸밈", "and pants were dancing: 앞 절과 <b>병렬</b>, 1형식. (delightedly) = 부사: dancing을 꾸밈, (in the seasonable weather) = 전치사구(부사구): dancing을 꾸밈", "(as the spring breeze chased them playfully) = 부사절(시간·동시 상황): 앞 절들을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식) 두 절이 and로 이어진 문장</b>이다. 뒤에 as절이 붙었다."}, {"t": "앞 절 뼈대이다.", "sub": ["S: Skirts (치마들)", "V: were bouncing (bounce 튀어 오르다의 과거진행형)", "뼈대 = <b>Skirts were bouncing</b>", "lightly (가볍게)는 부사"]}, {"t": "뒤 절 뼈대이다.", "sub": ["S: pants (바지들)", "V: were dancing (dance 춤추다의 과거진행형)", "뼈대 = <b>pants were dancing</b>", "delightedly (즐겁게)는 부사, in the seasonable weather (계절에 어울리는 날씨 속에서)는 전치사구(부사구)"]}, {"t": "<b>as the spring breeze chased them playfully</b>는 <b>부사절(시간·동시 상황)</b>이다. 앞 절들을 꾸미며 '봄바람이 장난스럽게 그것들을 뒤쫓는 가운데'라는 뜻이다.", "sub": ["S: the spring breeze (봄바람)", "V: chased (chase 뒤쫓다의 과거형)", "O: them (= skirts and pants, 치마와 바지)", "playfully (장난스럽게)"]}], "sum": "봄바람이 치마와 바지를 장난스레 흔드는 풍경"}, {"i": "07", "q": "10", "s": "C-2", "title": "S+V+O(if절) + 가주어 it + 진주어 병렬", "eng": "He was wondering<sup>1</sup> / if it was better to put the cream on<sup>2</sup> now, / or wait till<sup>3</sup> she arrived.", "notes": [["1", "wonder", "궁금해하다"], ["2", "put on", "(위에) 얹다, 올리다"], ["3", "till", "~할 때까지"]], "lit": "그는 궁금해하고 있었다 / 지금 크림을 얹는 것이 더 나을지, / 아니면 그녀가 도착할 때까지 기다릴지.", "nat": "그는 지금 크림을 얹는 게 나을지, 아니면 그녀가 올 때까지 기다리는 게 나을지 고민하고 있었다.", "ana": "여기서 <b>if</b>는 '만약 ~라면'이 아니라 '<b>~인지 (아닌지)</b>'라는 뜻의 <b>명사절 접속사</b>다. <b>wonder·ask·know·doubt</b> 같은 동사 뒤에 오면 거의 이 뜻이며, <b>whether</b>로 바꿔 쓸 수 있다. 조건의 if와 구별하는 법은 간단하다. <b>if절을 통째로 목적어 자리에 넣을 수 있으면 명사절</b>이다. 그 안을 보면 <b>it</b>은 가주어이고 진주어는 <b>to put the cream on</b>이다. 그리고 <b>or</b> 뒤의 <b>wait</b>은 동사원형인데, 이는 앞의 <b>to put</b>과 짝을 이루는 <b>to (wait)</b>에서 <b>to가 생략</b>된 형태다. 병렬에서 두 번째 to는 흔히 생략된다는 규칙을 알아야 이 문장이 풀린다. <b>till</b>은 until과 같은 뜻이다.", "pe": "He was wondering<sup>1</sup> / if it was better to put the cream on<sup>2</sup> \u0001now\u0002, / or wait \u0001till<sup>3</sup> she arrived\u0002.", "pk": "그는 궁금해하고 있었다 / \u0001지금\u0002 크림을 얹는 것이 더 나을지, / 아니면 \u0001그녀가 도착할 때까지\u0002 기다릴지.", "core": "그는 크림을 얹는 것이 나을지 기다리는 것이 나을지 궁금해하고 있었다.", "tags": ["주어 He + 동사 was wondering + 목적어 if절(<b>명사절</b>): 3형식", "if절 안: 가주어 it + 동사 was + 보어 better: 2형식. 진주어 to put the cream on. put on(구동사). (now) = 부사: put을 꾸밈", "or (to) wait: 진주어 <b>병렬</b>(두 번째 to 생략). (till she arrived) = 부사절(시간): wait를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고, 목적어가 if절이다. 그 안에 가주어와 진주어 병렬이 있어 길어졌다."}, {"t": "바깥 뼈대이다.", "sub": ["S: He (그)", "V: was wondering (wonder 궁금해하다의 과거진행형)", "O: if절 (명사절. 궁금해하는 내용)", "뼈대 = <b>He was wondering if ~</b>"]}, {"t": "if절 안의 뼈대이다. 이 if는 '~인지'라는 뜻이다. 없으면 wondering이 불완전하므로 명사절이다.", "sub": ["S: it (가주어)", "V: was", "C: better (더 나은)", "진주어 = to put the cream on now (지금 크림을 얹는 것). put on 얹다, cream 크림, now 지금"]}, {"t": "<b>or wait till she arrived</b>는 진주어의 병렬이다. (to) wait로, 두 번째 to가 생략되었다. '아니면 기다리는 것'이라는 뜻이다."}, {"t": "<b>till she arrived</b>는 <b>시간 부사절</b>이다. wait를 꾸미며 '그녀가 도착할 때까지'라는 뜻이다. (arrive 도착하다)"}], "sum": "크림을 지금 얹을지 그녀를 기다릴지 고민"}, {"i": "08", "q": "10", "s": "D-4", "title": "부정어구 도치 구문 (No sooner ~ than)", "eng": "No sooner<sup>1</sup> had he completed his masterpiece<sup>2</sup>, / than Julie stepped into<sup>3</sup> the cafe.", "notes": [["1", "no sooner ~ than ...", "~하자마자 …하다"], ["2", "masterpiece", "걸작"], ["3", "step into", "~로 들어서다"]], "lit": "그가 자신의 걸작을 완성하자마자, / Julie가 카페 안으로 들어섰다.", "nat": "그가 걸작을 막 완성하자마자 Julie가 카페 안으로 들어섰다.", "ana": "<b>No sooner</b>처럼 <b>부정의 뜻을 지닌 표현이 문장 맨 앞</b>에 오면 그 뒤는 반드시 <b>도치</b>된다. 그래서 <b>he had completed</b>가 <b>had he completed</b>로 뒤집혔다. 조동사·be동사가 있으면 그것을 주어 앞으로 보내고, 없으면 <b>do/does/did</b>를 빌려 온다는 것이 도치의 원리다. 같은 무리로 <b>Never·Hardly·Scarcely·Little·Not until·Only then</b>이 있으니 <b>부정어 앞 = 도치</b> 신호로 통째로 외워 두자. 시제도 함께 봐야 한다. 먼저 일어난 일(완성)은 <b>과거완료(had completed)</b>, 나중 일(들어옴)은 <b>과거(stepped)</b>로 <b>시간 차</b>를 정확히 구분하고 있다. 원래 짝은 <b>No sooner had S p.p. than S 과거동사</b>이며, 같은 뜻의 <b>Hardly had S p.p. when S 과거동사</b>와 <b>than / when</b>이 서로 다르다는 점이 시험의 단골 함정이다.", "pe": "\u0001No sooner<sup>1</sup> had he completed his masterpiece<sup>2</sup>\u0002, / than Julie stepped \u0001into<sup>3</sup> the cafe\u0002.", "pk": "\u0001그가 자신의 걸작을 완성하자마자\u0002, / Julie가 \u0001카페 안으로\u0002 들어섰다.", "core": "Julie가 들어섰다.", "tags": ["(No sooner had he completed …) = 부사절(시간): 주절을 꾸밈. 부정어 No sooner가 앞으로 나간 <b>도치</b>(had + 주어 + p.p.), 원래 than이 이끄는 절", "주어 Julie + 동사 stepped: 1형식. (into the cafe) = 전치사구(부사구): stepped를 꾸밈, 거의 필수에 가까운 부사구(step into) [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>No sooner ~ than</b> 구문이다. '~하자마자 ~했다'로 읽는다. 앞 절이 도치되어 낯설다."}, {"t": "앞 절 뼈대이다. 부정어구 No sooner가 앞으로 나가 도치가 일어났다.", "sub": ["S: he (그)", "V: had completed (complete 완성하다의 과거완료형)", "O: his masterpiece (그의 걸작)", "도치 어순 = had he completed. 원래 어순은 he had completed", "뼈대 = <b>he had completed his masterpiece</b>"]}, {"t": "뒤 절 뼈대이다.", "sub": ["S: Julie (사람 이름)", "V: stepped (step 걸음을 옮기다의 과거형)", "뼈대 = <b>Julie stepped</b>", "into the cafe (카페 안으로)는 step into의 일부라 거의 필수에 가까운 부사구. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준)"]}, {"t": "<b>than Julie stepped into the cafe</b>는 than이 이끄는 비교 절이다. No sooner (더 빨리 ~이 아니다)와 짝을 이룬다. 기준: No sooner 절을 앞 절, than절을 뒤 절로 나눠 읽는다."}, {"t": "함정: 앞 절은 시제가 과거완료, 뒤 절은 과거이다. 완료 사건이 먼저이다."}], "sum": "걸작을 완성하자마자 Julie가 카페에 들어섬"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2023학년도 수능 33번", "ans": "①", "tr": [["1", "흔히 '댄스플로어'라고 불리는 꿀벌 군집의 입구는, 군집의 상태와 벌집 밖 환경에 관한 정보가 오가는 시장이다."], ["2", "댄스플로어에서 벌어지는 상호작용을 연구하면, 국지적 정보에 반응해 자기 행동을 바꾸는 개체들이 어떻게 군집이 자신의 일손을 조절할 수 있게 하는지를 보여 주는 예시가 여럿 나온다."], ["3", "예를 들어 물을 모아 온 꿀벌은 벌집으로 돌아오자마자, 벌집 안에 물을 넘겨줄 수령 벌을 찾아 나선다."], ["4", "이 탐색 시간이 짧으면 돌아온 벌은 8자춤을 추어 다른 벌들을 물 공급원으로 끌어들일 가능성이 더 높다."], ["5", "반대로 이 탐색 시간이 길면 그 벌은 물 모으기를 포기할 가능성이 더 높다."], ["6", "수령 벌은 자신에게 필요하거나 다른 벌과 애벌레에게 전달하기 위해 필요할 때만 물을 받으므로, 이 넘겨주는 시간은 군집 전체의 물 수요와 상관관계가 있다."], ["7", "따라서 물을 조달하는 개체가 넘겨주는 시간(길어지거나 짧아지는 것)에 보이는 반응이 군집의 필요에 맞추어 물 수집을 조절한다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "Thus the individual water forager's response to unloading time (up or down) regulates water collection in response to the colony's need."}, {"en": false, "h": "빈칸이 <b>2번(도입)</b>에 있고 <b>Thus</b>로 시작하는 <b>7번(결론)</b>이 같은 말을 다시 하는 전형적인 구조다. 7번을 그대로 옮기면 '<b>개체의 반응이 군집의 필요에 맞추어 물 수집을 조절한다</b>'이고, 여기서 <b>regulates</b>와 <b>the colony's need</b>가 빈칸의 열쇠다. 3~6번의 흐름도 정확히 같다. 수령 벌이 빨리 받아 주면(=군집에 물이 부족하면) 조달 벌이 <b>8자춤으로 일손을 더 부르고</b>(4번), 오래 걸리면(=물이 충분하면) <b>물 모으기를 그만둔다</b>(5번). 즉 <b>개체가 국지적 신호에 반응하는 것만으로 군집 전체의 일손 배분이 조절되는</b> 것이므로 <b>allow the colony to regulate its workforce</b>가 답이다. 이 지문의 핵심어 <b>regulate</b>가 선택지에 그대로 등장한다는 점도 확인해 두자."}], "opts": [{"n": "①", "t": "군집이 자신의 일손을 조절할 수 있게 한다", "a": true, "x": false, "trap": false, "e": "7번의 <b>regulates water collection in response to the colony's need</b>와 정확히 대응한다. 물을 모으러 나가는 벌의 수, 즉 <b>workforce</b>가 조절되는 것이 4·5번의 내용이다."}, {"n": "②", "t": "거리를 측정하여 물 공급원을 찾는다", "a": false, "x": true, "trap": true, "e": "<b>waggle dance</b>가 거리 정보를 담는다는 것은 <b>배경지식</b>일 뿐 지문에 없다. 지문에서 춤은 <b>다른 벌을 불러 모으는</b> 신호로만 쓰인다."}, {"n": "③", "t": "필요할 때 군집의 작업량을 줄인다", "a": false, "x": true, "trap": false, "e": "5번에 <b>give up collecting water</b>가 나와 그럴듯하지만, 지문은 <b>줄이기</b>만이 아니라 <b>늘리기(4번)</b>도 함께 말한다. 한쪽 방향만 담은 진술이라 <b>up or down</b>을 모두 담는 <b>regulate</b>보다 좁다."}, {"n": "④", "t": "각자의 재능에 따라 일을 나눈다", "a": false, "x": true, "trap": false, "e": "<b>재능(talents)에 따른 분업</b>이라는 개념이 지문에 없다. 벌들은 재능이 아니라 <b>그때그때의 국지적 신호</b>에 따라 움직인다."}, {"n": "⑤", "t": "기본적인 소통 방식을 익히도록 일벌을 훈련시킨다", "a": false, "x": true, "trap": false, "e": "<b>train</b>(훈련)은 지문에 없다. 8자춤은 학습된 훈련의 결과가 아니라 <b>즉각적인 반응</b>으로 제시된다."}], "w": [["colony", "군집, 집단"], ["refer to A as B", "A를 B라고 부르다"], ["hive", "벌집"], ["illustrative", "예시가 되는"], ["in response to", "~에 대응하여"], ["regulate", "조절하다"], ["workforce", "노동력, 일손"], ["search out", "~을 찾아내다"], ["unload", "(짐을) 내려놓다"], ["recruit", "모집하다"], ["brood", "애벌레"], ["be correlated with", "~와 상관관계가 있다"]]}, {"q": "08", "type": "무관한 문장", "src": "2019년 4월 35번", "ans": "④", "tr": [["1", "우리가 추상적으로는 가치 있다고 말하는 것들 중 일부는 사실 우리의 실제 일상 경험을 특징짓지 않을 수도 있다."], ["2", "예를 들어 우리는 '정직'과 '열린 소통'이 어떤 굳건한 관계에서든 기초가 되는 가치라고 말한다."], ["3", "그러나 상대가 자기 자신에 대해 기분이 나아지게 하려고 잠재적 연인에게 몇 번이나 거짓말했는지 생각해 보라."], ["4", "마찬가지로 모든 부모는, 산타클로스가 온다는 이야기부터 완두콩을 안 먹으면 벌어질 끔찍한 일까지 온갖 것에 대해 아이에게 거짓말하는 일이 육아의 핵심 요소임을 알고 있다."], ["5", "이것은 대부분의 부모가 맹목적인 사랑보다 훈육에 더 큰 가치를 두기 때문이며, 따라서 선의의 거짓말보다 솔직한 대화가 부모와 자녀 사이에 굳건한 관계를 세우는 더 나은 수단이다."], ["6", "어느 작가가 표현했듯이, \"인생에서 사랑을 얻고 싶다면 얼마간의 거짓말을 할 각오와 얼마간의 거짓말을 믿을 각오를 하는 편이 낫다.\""]], "evh": "5번 문장", "ev": [{"en": true, "h": "This is because most parents put more value on discipline than on blind love, and thus honest conversations rather than well-intentioned lies are the better tool for establishing solid relationship between parents and their kids."}, {"en": false, "h": "무관한 문장 문항은 <b>글의 방향</b>을 먼저 확정해야 한다. 1번이 '<b>말로는 소중하다고 하는 가치가 실제 일상과는 다를 수 있다</b>'라고 방향을 잡고, 2번에서 <b>정직·열린 소통</b>이라는 통념을 세운 뒤, 3·4번이 <b>연인에게도 아이에게도 우리는 거짓말을 한다</b>는 반례를 든다. 그리고 6번의 인용이 '<b>거짓말을 할 각오도 믿을 각오도 해야 한다</b>'로 마무리한다. 즉 글 전체가 <b>선의의 거짓말은 관계에 필요하다</b>는 쪽이다. 그런데 ④는 <b>honest conversations rather than well-intentioned lies are the better tool</b>이라며 <b>솔직한 대화가 더 낫다</b>고 말한다. 흐름을 <b>정면으로 뒤집는</b> 문장이므로 무관하다. 앞 문장의 낱말(lying, parents)을 그대로 이어받아 자연스러워 보이지만, <b>주장의 방향이 반대</b>라는 점이 결정적이다."}], "opts": [{"n": "①", "t": "For instance, we say that \"honesty\" and \"open communication\" are the foundational values ~", "a": false, "x": true, "trap": false, "e": "1번이 말한 '<b>추상적으로 가치 있다고 말하는 것</b>'의 구체적 예다. <b>For instance</b>로 정확히 연결된다."}, {"n": "②", "t": "But think of how many times you've lied to a potential romantic partner ~", "a": false, "x": true, "trap": false, "e": "<b>But</b>으로 통념을 뒤집으며 첫 번째 반례(연인)를 제시한다. 글의 방향 전환점이다."}, {"n": "③", "t": "Likewise, every parent knows that lying to their kids ~ is a key component of raising a child.", "a": false, "x": true, "trap": false, "e": "<b>Likewise</b>로 두 번째 반례(부모와 자녀)를 덧붙인다. ②와 짝을 이루는 문장이다."}, {"n": "④", "t": "This is because most parents put more value on discipline than on blind love, and thus honest conversations ~ are the better tool ~", "a": true, "x": false, "trap": false, "e": "③   WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
