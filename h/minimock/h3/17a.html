</span><span class=\"why\">[지문에 없음] 관리 사무소(management office)는 5번에서 소포를 찾으러 갈 장소로만 나와요. 공사 이야기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">잘못 찾아간 물품의 반납을 부탁하려고</span><span class=\"why\">[반대] 3번은 소포가 unclaimed(찾아가지 않은) 상태라고 해요. 누가 잘못 가져간 게 아니라 아무도 안 가져가서 문제예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">관리 사무실 운영 시간 변경을 공지하려고</span><span class=\"why\">[지문에 없음] 5번 office hours(업무 시간)는 그 시간 안에 와 달라는 말일 뿐, 시간이 바뀐다는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We hope this notice finds you</div><div class=\"k\">저희는 이 공지가 귀하께 닿기를 바랍니다</div></div><div class=\"rc\"><div class=\"e\">in good health and high spirits.</div><div class=\"k\">건강하고 기분 좋은 상태로.</div></div><div class=\"rnat\">이 공지가 귀하께 건강과 좋은 기분 속에서 닿기를 바랍니다.</div><div class=\"rst\">학교 행정실에서 나에게 안내 문자가 왔다고 생각해 봐요. 지문도 건강하고 기분 좋게 지내시길 바란다는 인사로 공지를 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We are writing to inform you</div><div class=\"k\">저희는 귀하께 알려 드리기 위해 글을 씁니다</div></div><div class=\"rc\"><div class=\"e\">that a package was delivered</div><div class=\"k\">소포 한 개가 배달되었다는 것을</div></div><div class=\"rc\"><div class=\"e\">to the Rosehill Apartment Complex on October 9th,</div><div class=\"k\">10월 9일에 Rosehill Apartment Complex로,</div></div><div class=\"rc\"><div class=\"e\">specifically addressed to your home.</div><div class=\"k\">분명히 귀하의 집 앞으로 주소가 적힌 (소포가).</div></div><div class=\"rnat\">10월 9일에 Rosehill Apartment Complex로, 분명히 귀하의 집 앞으로 주소가 적힌 소포 한 개가 배달되었음을 알려 드리고자 글을 씁니다.</div><div class=\"rst\">“10월 9일에 네 이름으로 택배가 학교에 왔어.” 지문도 로즈힐(Rosehill) 아파트에 귀하의 집 앞으로 <b>소포가 배달되었다</b>고 알려요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>, despite multiple attempts</div><div class=\"k\"><span class=\"cw\">그러나</span> 여러 차례의 시도에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">to deliver the package to you,</div><div class=\"k\">귀하께 그 소포를 전달하려는,</div></div><div class=\"rc ckc\"><div class=\"e\">it has <span class=\"cw\">remained unclaimed</span></div><div class=\"k\">그것은 (= 그 소포) <span class=\"cw\">찾아가지 않은 채로 남아 있습니다</span></div></div><div class=\"rc\"><div class=\"e\">at our front desk for an extended period.</div><div class=\"k\">저희 프런트 데스크에 오랜 기간 동안.</div></div><div class=\"rnat\">그러나 여러 차례 소포를 전달하려 시도했음에도, 그 소포는 오랜 기간 저희 프런트 데스크에 찾아가지 않은 채로 남아 있습니다.</div><div class=\"rst\"><b>그런데</b>(However) 몇 번 전해 주려 해도 못 줘서 택배가 아직 행정실에 있어요. = 지문의 <b>찾아가지 않은 채로 남아 있다</b>(remained unclaimed)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">As the management office,</div><div class=\"k\">관리 사무소로서,</div></div><div class=\"rc\"><div class=\"e\">it is our responsibility</div><div class=\"k\">저희의 책임입니다 (it은 가주어, 진주어는 to ensure 이하)</div></div><div class=\"rc\"><div class=\"e\">to ensure the safekeeping of all delivered items</div><div class=\"k\">배달된 모든 물품의 안전한 보관을 보장하는 것과</div></div><div class=\"rc\"><div class=\"e\">and help deliver them quickly</div><div class=\"k\">그것들을 (= 배달된 물품들) 빠르게 전달하도록 돕는 것은</div></div><div class=\"rc\"><div class=\"e\">to the right residents.</div><div class=\"k\">알맞은 입주민에게.</div></div><div class=\"rnat\">관리 사무소로서, 배달된 모든 물품을 안전하게 보관하고 그것을 알맞은 입주민에게 신속히 전달하도록 돕는 것이 저희의 책임입니다.</div><div class=\"rst\">행정실은 학생 물건을 잘 보관해서 주인에게 빨리 돌려줄 책임이 있어요. 지문도 관리 사무소의 책임을 말하며 요청의 이유를 대요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Therefore, we kindly request</span></div><div class=\"k\"><span class=\"cw\">따라서 저희는 정중히 요청드립니다</span></div></div><div class=\"rc\"><div class=\"e\">that you visit the management office</div><div class=\"k\">귀하께서 관리 사무소를 방문하시기를</div></div><div class=\"rc\"><div class=\"e\">during our office hours</div><div class=\"k\">저희 업무 시간 중에</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to claim your package</span>.</div><div class=\"k\"><span class=\"cw\">귀하의 소포를 찾아가기 위해</span>.</div></div><div class=\"rnat\">따라서 저희 업무 시간 중에 관리 사무소를 방문하셔서 소포를 찾아가 주시기를 정중히 요청드립니다.</div><div class=\"rst\"><b>그러니까</b>(Therefore) “업무 시간에 와서 택배 찾아가!” = 지문의 <b>소포를 찾아가 달라는 요청</b>이에요. 이게 공지의 목적이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">We genuinely appreciate your cooperation</div><div class=\"k\">저희는 귀하의 협조에 진심으로 감사드립니다</div></div><div class=\"rc\"><div class=\"e\">in this matter.</div><div class=\"k\">이 사안에 대한.</div></div><div class=\"rnat\">이 사안에 대한 귀하의 협조에 진심으로 감사드립니다.</div><div class=\"rst\">“협조해 줘서 고마워.” 지문도 이 일에 대한 협조에 진심으로 감사하며 공지를 마무리해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"package\" data-m=\"소포, 택배\"><b>package</b>소포, 택배</button><button type=\"button\" class=\"wdb\" data-w=\"unclaimed\" data-m=\"찾아가지 않은\"><b>unclaimed</b>찾아가지 않은</button><button type=\"button\" class=\"wdb\" data-w=\"safekeeping\" data-m=\"안전 보관\"><b>safekeeping</b>안전 보관</button><button type=\"button\" class=\"wdb\" data-w=\"resident\" data-m=\"입주민, 거주자\"><b>resident</b>입주민, 거주자</button><button type=\"button\" class=\"wdb\" data-w=\"claim\" data-m=\"(자기 것을) 찾아가다\"><b>claim</b>(자기 것을) 찾아가다</button><button type=\"button\" class=\"wdb\" data-w=\"cooperation\" data-m=\"협조, 협력\"><b>cooperation</b>협조, 협력</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. refining ignorance(무지를 정제하기)를 글자 그대로 읽지 말고, 글이 직접 풀어 주는 <b>8번의 정의</b>(발견 = 새로운 무지를 드러내기)로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (1번)</span><div class=\"en\">the best science can really be seen as <mark>refining ignorance</mark>.</div><p class=\"ko\">최고의 과학은 사실상 <mark>무지를 정제하는 것</mark>으로 여겨질 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>위대한 과학자는 결과가 아니라 다음 질문을 봐요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 과학자의 진짜 관심</span><div class=\"en\">Great scientists … are not concerned with results <mark>but with the next questions</mark>.</div><p class=\"ko\">위대한 과학자들은 결과에 관심을 두지 않는다 <mark>그게 아니라 다음 질문에 관심을 둔다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>가설을 입증하지 못한 실험이 오히려 발견이래요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 측정과 발견</span><div class=\"en\">an experiment that successfully proves a hypothesis is a measurement; <mark>one that doesn’t is a discovery</mark>.</div><p class=\"ko\">가설을 성공적으로 입증하는 실험은 측정이고 <mark>그렇지 못한 실험이 발견이라고</mark> 말했다.</p></div><div class=\"ck-via\"><i>▼</i><span>발견이 무엇인지 정의해 줘요 = 밑줄의 속뜻</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">A discovery, <mark>an uncovering — of new ignorance</mark>.</div><p class=\"ko\">발견은, <mark>드러내는 것 — 새로운 무지를</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>결과보다 다음 질문</span><span><em>7번</em>입증 실패한 실험 = 발견</span><span><em>8번</em>발견 = 새로운 무지(아직 모르는 것) 드러내기</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 아는 것 너머 아직 모르는 쪽으로 나아가기 → ①</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">알려진 것 너머를 바라보며 알려지지 않은 채 남은 것으로 나아가는 것<small>8번 new ignorance(새로운 무지) = 아직 모르는 것, 6번 next questions(다음 질문) = 그쪽으로 나아가기예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">발견된 것에 대해 궁극적인 설명을 제시하는 것</span><span class=\"why\">결과를 마무리 짓는 쪽이라 6번 not concerned with results(결과에 관심 두지 않는다)와 반대예요. 7번도 가설을 입증한 실험은 measurement(측정)일 뿐이래요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">객관적인 사고방식으로 기존 지식을 분석하는 것</span><span class=\"why\">기존 지식은 이미 아는 것이에요. 8번은 아는 것이 아니라 new ignorance(새로운 무지)를 드러내는 것이 발견이라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">과학자들이 중요한 발견을 널리 알리도록 고무하는 것</span><span class=\"why\">4번 covered in the press(언론에 보도되는)에서 따온 함정이에요. 그건 5번에서 wrong(잘못된) 것이라고 한 결과 집착의 모습이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">학생들에게 새로운 과학 분야를 알려 주는 것</span><span class=\"why\">7번 students(학생들), 10번 opened a field up(분야를 열었다)에서 낱말만 따왔어요. 밑줄은 가르치기가 아니라 모르는 것을 찾아 나아가는 일이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Although not the explicit goal,</div><div class=\"k\">비록 명시된 목표는 아니지만,</div></div><div class=\"rc\"><div class=\"e\">the best science can really be seen</div><div class=\"k\">최고의 과학은 사실상 여겨질 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\">as <span class=\"cw\">refining ignorance</span>.</div><div class=\"k\"><span class=\"cw\">무지를 정제하는 것으로</span>.</div></div><div class=\"rnat\">비록 명시된 목표는 아니지만, 최고의 과학은 사실상 무지를 정제하는 일로 볼 수 있다.</div><div class=\"rst\">과학 동아리의 진짜 목표는 뭘까요? 지문은 최고의 과학이 <b>모르는 것을 더 정확히 다듬는 일</b>(refining ignorance 무지를 정제하기)이라고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Scientists, especially young ones,</div><div class=\"k\">과학자들은, 특히 젊은 과학자들은,</div></div><div class=\"rc\"><div class=\"e\">can get too obsessed with results.</div><div class=\"k\">결과에 너무 집착할 수 있다.</div></div><div class=\"rnat\">과학자들은, 특히 젊은 과학자들은 결과에 너무 집착할 수 있다.</div><div class=\"rst\">그런데 동아리 친구들은 “실험 성공!”이라는 결과에만 매달리기 쉬워요. 지문도 젊은 과학자들이 <b>결과</b>(results)에 너무 집착한다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Society helps them along</div><div class=\"k\">사회는 그들을 (= 과학자들) 부추긴다</div></div><div class=\"rc\"><div class=\"e\">in this mad chase.</div><div class=\"k\">이 미친 듯한 추구 속에서.</div></div><div class=\"rnat\">사회도 이 미친 듯한 추구 속에서 그들을 부추긴다.</div><div class=\"rst\">학교도 “성공한 팀 최고!” 하며 그걸 부추겨요. 지문도 사회가 이 미친 듯한 추구를 거든다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Big discoveries are covered in the press,</div><div class=\"k\">큰 발견은 언론에 보도되고,</div></div><div class=\"rc\"><div class=\"e\">show up on the university’s home page,</div><div class=\"k\">대학 홈페이지에 등장하고,</div></div><div class=\"rc\"><div class=\"e\">help get grants,</div><div class=\"k\">연구비를 받는 데 도움이 되고,</div></div><div class=\"rc\"><div class=\"e\">and make the case for promotions.</div><div class=\"k\">그리고 승진의 근거가 된다.</div></div><div class=\"rnat\">큰 발견은 언론에 보도되고, 대학 홈페이지에 오르고, 연구비를 따는 데 도움이 되며, 승진을 정당화해 준다.</div><div class=\"rst\">성공한 실험은 학교 신문에 실리고 상도 받아요. 지문 속 큰 발견도 언론에 나오고 연구비와 승진에 도움이 돼요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">But it’s wrong.</div><div class=\"k\">그러나 그것은 (= 결과에 집착하는 것) 잘못되었다.</div></div><div class=\"rnat\">그러나 그것은 잘못되었다.</div><div class=\"rst\"><b>하지만</b>(But) 그건 잘못된 생각이에요. 지문도 결과에 매달리는 것은 틀렸다고 딱 잘라 말해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Great scientists,</div><div class=\"k\">위대한 과학자들,</div></div><div class=\"rc\"><div class=\"e\">the pioneers that we admire,</div><div class=\"k\">즉 우리가 존경하는 선구자들은,</div></div><div class=\"rc\"><div class=\"e\">are not concerned with results</div><div class=\"k\">결과에 관심을 두지 않는다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">but with the next questions</span>.</div><div class=\"k\"><span class=\"cw\">그게 아니라 다음 질문에 관심을 둔다</span>.</div></div><div class=\"rnat\">위대한 과학자들, 즉 우리가 존경하는 선구자들은 결과가 아니라 다음 질문에 관심을 둔다.</div><div class=\"rst\">진짜 멋진 과학자는 “다음엔 뭐가 궁금하지?”를 봐요. = 지문의 결과가 아니라 <b>다음 질문</b>(the next questions)이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The highly respected physicist Enrico Fermi</div><div class=\"k\">매우 존경받는 물리학자 Enrico Fermi는</div></div><div class=\"rc\"><div class=\"e\">told his students</div><div class=\"k\">그의 학생들에게 말했다</div></div><div class=\"rc\"><div class=\"e\">that an experiment</div><div class=\"k\">실험은</div></div><div class=\"rc\"><div class=\"e\">that successfully proves a hypothesis</div><div class=\"k\">가설을 성공적으로 입증하는</div></div><div class=\"rc\"><div class=\"e\">is a measurement;</div><div class=\"k\">측정이고;</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">one that doesn’t is a discovery</span>.</div><div class=\"k\">그렇지 못한 것은 (= 가설을 입증하지 못한 실험) <span class=\"cw\">발견이라고</span>.</div></div><div class=\"rnat\">매우 존경받는 물리학자 엔리코 페르미는 학생들에게, 가설을 성공적으로 입증하는 실험은 측정이고 그렇지 못한 실험이 발견이라고 말했다.</div><div class=\"rst\">예상대로 된 실험은 그냥 확인(측정)이고, 예상이 빗나간 실험이 <b>발견</b>이에요. 페르미(Fermi)도 학생들에게 그렇게 말했어요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">A discovery,</div><div class=\"k\">발견은,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">an uncovering — of new ignorance</span>.</div><div class=\"k\"><span class=\"cw\">드러내는 것 — 새로운 무지를</span>.</div></div><div class=\"rnat\">발견이란 새로운 무지를 밝혀내는 일이다.</div><div class=\"rst\">발견이란 “어? 이건 우리가 몰랐네!” 하는 <b>새로운 무지</b>를 드러내는 거예요. 그래서 밑줄은 모르는 쪽으로 나아가기(①)예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The Nobel Prize,</div><div class=\"k\">노벨상은,</div></div><div class=\"rc\"><div class=\"e\">the pinnacle of scientific accomplishment,</div><div class=\"k\">과학적 성취의 정점인,</div></div><div class=\"rc\"><div class=\"e\">is awarded,</div><div class=\"k\">수여된다,</div></div><div class=\"rc\"><div class=\"e\">not for a lifetime of scientific achievement,</div><div class=\"k\">평생에 걸친 과학적 업적에 대해서가 아니라,</div></div><div class=\"rc\"><div class=\"e\">but for a single discovery, a result.</div><div class=\"k\">단 하나의 발견, 즉 하나의 결과에 대해.</div></div><div class=\"rnat\">과학적 성취의 정점인 노벨상은 평생에 걸친 과학적 업적이 아니라 단 하나의 발견, 곧 하나의 결과에 주어진다.</div><div class=\"rst\">그런데 노벨상(Nobel Prize)도 평생의 노력이 아니라 발견 하나, 결과 하나에 주어져요. 대회 상이 성공한 실험 하나에 주어지는 것처럼요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Even the Nobel committee realizes in some way</div><div class=\"k\">노벨 위원회조차 어떤 면에서는 알고 있다</div></div><div class=\"rc\"><div class=\"e\">that this is not really in the scientific spirit,</div><div class=\"k\">이것이 (= 하나의 결과에 상을 주는 것) 정말로 과학 정신에 맞지는 않는다는 것을,</div></div><div class=\"rc\"><div class=\"e\">and their award citations commonly honor the discovery</div><div class=\"k\">그리고 그들의 (= 노벨 위원회의) 수상 문구는 흔히 그 발견을 기린다</div></div><div class=\"rc\"><div class=\"e\">for having “opened a field up,”</div><div class=\"k\">“한 분야를 열었다,”</div></div><div class=\"rc\"><div class=\"e\">“transformed a field,”</div><div class=\"k\">“한 분야를 변화시켰다,”</div></div><div class=\"rc\"><div class=\"e\">or “taken a field in new and unexpected directions.”</div><div class=\"k\">또는 “한 분야를 새롭고 예상치 못한 방향으로 이끌었다”는 이유로.</div></div><div class=\"rnat\">노벨 위원회조차 이것이 사실 과학 정신에 온전히 부합하지는 않는다는 것을 어느 정도 알고 있으며, 수상 사유서는 흔히 그 발견이 “한 분야를 열어젖혔다”, “한 분야를 변모시켰다”, 혹은 “한 분야를 새롭고 예상치 못한 방향으로 이끌었다”는 이유로 그것을 기린다.</div><div class=\"rst\">노벨 위원회도 그게 과학 정신과 안 맞는 걸 알아서, “새 분야를 열었다”는 말로 상을 줘요. 결국 과학은 다음 질문을 여는 일이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"refining\" data-m=\"정제하는 것, 다듬기\"><b>refining</b>정제하는 것, 다듬기</button><button type=\"button\" class=\"wdb\" data-w=\"ignorance\" data-m=\"무지\"><b>ignorance</b>무지</button><button type=\"button\" class=\"wdb\" data-w=\"obsessed with\" data-m=\"~에 집착하는\"><b>obsessed with</b>~에 집착하는</button><button type=\"button\" class=\"wdb\" data-w=\"pioneer\" data-m=\"선구자\"><b>pioneer</b>선구자</button><button type=\"button\" class=\"wdb\" data-w=\"hypothesis\" data-m=\"가설\"><b>hypothesis</b>가설</button><button type=\"button\" class=\"wdb\" data-w=\"uncovering\" data-m=\"밝혀냄, 드러냄\"><b>uncovering</b>밝혀냄, 드러냄</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>반복되는 핵심어</b>로 잡아요. 3·4번 <b>boundary blurring</b>(경계 흐려짐), 6번 <b>confuse</b>(혼동하다), 7번 identity(정체성)가 모두 “배우와 배역이 뒤섞인다”는 한 가지 이야기예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 제시</span><div class=\"en\"><mark>Despite excellent training</mark>, actors inevitably experience the visceral life of their characters …</div><p class=\"ko\"><mark>뛰어난 훈련에도 불구하고</mark>, 배우들은 불가피하게 그들의 배역이 마음속에서 느끼는 삶을 경험한다 …</p></div><div class=\"ck-via\"><i>▼</i><span>배역을 깊이 느끼면 무엇이 생기는지 이름이 붙어요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 핵심어 등장</span><div class=\"en\">they experience greater empathy and social cognition for their character, which may intensify <mark>identity boundary blurring</mark>.</div><p class=\"ko\">그들은 자기 배역에 대해 더 큰 감정 이입과 사회적 인식을 경험하고, 이것은 <mark>정체성 경계의 흐려짐</mark>을 강화할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>4번</em>character boundary blurring(배역 경계 흐려짐) 가능성이 커짐</span><span><em>5번</em>과거의 상처를 연기에 끌어와 슬픔이 안 풀림</span></div><div class=\"ck-eq\">⇒ 배우 쪽에서 = 나와 배역의 경계가 흐려짐</div></div><div class=\"ck-via\"><i>▼</i><span>Adding to(~에 더해)로 혼동이 관객 쪽까지 넓어져요</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 관객까지 확장</span><div class=\"en\">Adding to this tendency to merge with the creative work, audience members also <mark>confuse the character’s personality with the actor’s personality</mark>.</div><p class=\"ko\">창작물과 합쳐지려는 이러한 경향에 더해, 관객들 또한 <mark>배역의 인격을 배우의 인격과 혼동한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그 혼동 때문에 배우가 괴로워해요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 결과</span><div class=\"en\">Audience attribution errors may increase distress in the actor, including fearing that their <mark>personality identity is not stable</mark>.</div><p class=\"ko\">관객의 귀인 오류는 배우의 괴로움을 키울 수 있는데, 그들의 <mark>인격 정체성이 안정적이지 않다고</mark> 두려워하는 것도 포함된다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">배우와 배역 사이의 정체성 혼동<small>3·4번 boundary blurring(경계 흐려짐)과 6번 confuse(혼동하다)를 한 말로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">복잡한 인물을 연기하는 데서 오는 어려움</span><span class=\"why\">[지문에 없음] 7번 distress(괴로움)는 나오지만, 원인은 인물이 복잡해서가 아니라 배우와 배역의 경계가 흐려져서예요. 복잡한 인물 얘기는 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">배우의 연기를 평가하는 기준</span><span class=\"why\">[지문에 없음] 연기를 잘했는지 매기는 기준은 안 나와요. 1번 excellent training(뛰어난 훈련)도 훈련으로도 배역에 빠지는 걸 못 막는다는 뜻이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">연극을 감상하기 위한 배경지식</span><span class=\"why\">[지문에 없음] 관객은 6번에 나오지만, 감상에 필요한 지식이 아니라 배역과 배우를 confuse(혼동하는) 모습으로만 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">배우와 관객 사이의 심리적 장벽</span><span class=\"why\">[반대] 6번에서 관객은 배역과 배우를 하나로 섞어 버려요. 사이에 벽이 생기는 게 아니라 오히려 경계가 무너지는 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Despite excellent training</span>,</div><div class=\"k\"><span class=\"cw\">뛰어난 훈련에도 불구하고</span>,</div></div><div class=\"rc\"><div class=\"e\">actors inevitably experience</div><div class=\"k\">배우들은 불가피하게 경험한다</div></div><div class=\"rc\"><div class=\"e\">the visceral life of their characters,</div><div class=\"k\">그들의 배역이 마음속에서 느끼는 삶을,</div></div><div class=\"rc\"><div class=\"e\">even if it is for brief moments</div><div class=\"k\">그것이 (= 그런 경험) 짧은 순간일지라도</div></div><div class=\"rc\"><div class=\"e\">during a performance.</div><div class=\"k\">연기하는 동안의.</div></div><div class=\"rnat\">아무리 훈련이 잘되어 있어도 배우는 공연 중의 짧은 순간일지언정 자기 배역이 속으로 느끼는 삶을 필연적으로 겪게 된다.</div><div class=\"rst\">학교 연극제에서 친구가 못된 마녀 역을 맡았어요. 연습을 잘해도 무대에선 잠깐씩 진짜 마녀가 된 듯 느낀대요. 지문도 배우가 배역의 삶을 겪는다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Self-perceptions are altered</div><div class=\"k\">자기 인식은 바뀐다</div></div><div class=\"rc\"><div class=\"e\">during the course of a performance,</div><div class=\"k\">공연이 진행되는 동안,</div></div><div class=\"rc\"><div class=\"e\">and even more so</div><div class=\"k\">그리고 훨씬 더 그렇다</div></div><div class=\"rc\"><div class=\"e\">during long performance seasons.</div><div class=\"k\">긴 공연 시즌 동안에는.</div></div><div class=\"rnat\">자기 인식은 공연이 진행되는 동안, 그리고 긴 공연 시즌 동안에는 더욱더 달라진다.</div><div class=\"rst\">공연하는 동안 “나는 누구지?” 하는 느낌이 바뀌고, 공연 기간이 길면 더 심해져요. 지문도 <b>자기 인식이 바뀐다</b>고 해요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">For many actors,</div><div class=\"k\">많은 배우들의 경우,</div></div><div class=\"rc\"><div class=\"e\">they experience greater empathy and social cognition</div><div class=\"k\">그들은 더 큰 감정 이입과 사회적 인식을 경험한다</div></div><div class=\"rc\"><div class=\"e\">for their character,</div><div class=\"k\">자기 배역에 대해,</div></div><div class=\"rc\"><div class=\"e\">which may intensify</div><div class=\"k\">그리고 이것은 (= 배역에 대한 더 큰 감정 이입과 사회적 인식) 강화할 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">identity boundary blurring</span>.</div><div class=\"k\"><span class=\"cw\">정체성 경계의 흐려짐을</span>.</div></div><div class=\"rnat\">많은 배우들에게 있어 그들은 자기 배역에 대해 더 큰 공감과 사회적 인지를 경험하는데, 이것이 정체성 경계의 흐려짐을 심화시킬 수 있다.</div><div class=\"rst\">친구는 마녀의 마음을 깊이 이해할수록 나와 마녀 사이 선이 흐려져요. = 지문의 <b>정체성 경계의 흐려짐</b>(identity boundary blurring)이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">As well,</div><div class=\"k\">또한,</div></div><div class=\"rc\"><div class=\"e\">actors tend to employ</div><div class=\"k\">배우들은 사용하는 경향이 있다</div></div><div class=\"rc\"><div class=\"e\">more dissociative processes,</div><div class=\"k\">더 많은 분리적 과정을,</div></div><div class=\"rc\"><div class=\"e\">which increase</div><div class=\"k\">그리고 그것은 (= 더 많은 분리적 과정) 높인다</div></div><div class=\"rc\"><div class=\"e\">potential character boundary blurring.</div><div class=\"k\">배역 경계가 흐려질 가능성을.</div></div><div class=\"rnat\">또한 배우들은 더 많은 분리적 과정을 사용하는 경향이 있는데, 이것이 배역 경계가 흐려질 가능성을 높인다.</div><div class=\"rst\">연기할 때 진짜 나를 잠시 떼어 놓는 습관 때문에 그 선은 더 흐려질 수 있어요. 지문의 분리적 과정 이야기예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Actors also experience</div><div class=\"k\">배우들은 또한 경험한다</div></div><div class=\"rc\"><div class=\"e\">more unresolved mourning</div><div class=\"k\">더 많은 해소되지 않은 슬픔을</div></div><div class=\"rc\"><div class=\"e\">for past trauma and loss experiences</div><div class=\"k\">과거의 정신적 외상과 상실의 경험에 대해</div></div><div class=\"rc\"><div class=\"e\">because they continually draw from these experiences</div><div class=\"k\">왜냐하면 그들은 (= 배우들) 이러한 경험에서 계속 끌어내기 때문이다</div></div><div class=\"rc\"><div class=\"e\">when portraying characters.</div><div class=\"k\">배역을 연기할 때.</div></div><div class=\"rnat\">배우들은 또한 과거의 트라우마와 상실 경험에 대해 해소되지 않은 슬픔을 더 많이 겪는데, 배역을 연기할 때 그런 경험에서 계속 끌어다 쓰기 때문이다.</div><div class=\"rst\">슬픈 장면마다 예전에 속상했던 기억을 꺼내 쓰니, 그 슬픔이 잘 안 풀려요. 지문도 배우가 과거의 상처와 상실을 계속 끌어온다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">Adding to this tendency</div><div class=\"k\">이러한 경향에 더해</div></div><div class=\"rc\"><div class=\"e\">to merge with the creative work,</div><div class=\"k\">창작물과 합쳐지려는,</div></div><div class=\"rc ckc\"><div class=\"e\">audience members also <span class=\"cw\">confuse</span></div><div class=\"k\">관객들 또한 <span class=\"cw\">혼동한다</span></div></div><div class=\"rc\"><div class=\"e\">the character’s personality with the actor’s personality.</div><div class=\"k\">배역의 인격을 배우의 인격과.</div></div><div class=\"rnat\">창작 작업과 하나가 되려는 이런 경향에 더해, 관객들 또한 배역의 인격을 배우의 인격과 혼동한다.</div><div class=\"rst\"><b>게다가</b> 친구들까지 “너 진짜 마녀 같아!” 하며 친구와 배역을 <b>혼동해요</b>(confuse). 지문도 관객이 배역과 배우의 인격을 헷갈린다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Audience attribution errors</div><div class=\"k\">관객의 귀인 오류는</div></div><div class=\"rc\"><div class=\"e\">may increase distress in the actor,</div><div class=\"k\">배우의 괴로움을 키울 수 있다,</div></div><div class=\"rc\"><div class=\"e\">including fearing</div><div class=\"k\">두려워하는 것을 포함해서</div></div><div class=\"rc ckc\"><div class=\"e\">that their <span class=\"cw\">personality identity is not stable</span>.</div><div class=\"k\">그들의 (= 배우의) <span class=\"cw\">인격 정체성이 안정적이지 않다고</span>.</div></div><div class=\"rnat\">관객의 귀인 오류는 배우의 괴로움을 키울 수 있는데, 여기에는 자기 인격의 정체성이 안정적이지 않다는 두려움도 포함된다.</div><div class=\"rst\">그러면 친구는 “내가 진짜 이상한 사람인가?” 하며 괴로워해요. 지문도 배우가 자기 <b>정체성이 안정적이지 않다</b>고 두려워한다고 해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"inevitably\" data-m=\"필연적으로, 불가피하게\"><b>inevitably</b>필연적으로, 불가피하게</button><button type=\"button\" class=\"wdb\" data-w=\"visceral\" data-m=\"마음속에서 느끼는\"><b>visceral</b>마음속에서 느끼는</button><button type=\"button\" class=\"wdb\" data-w=\"empathy\" data-m=\"공감, 감정 이입\"><b>empathy</b>공감, 감정 이입</button><button type=\"button\" class=\"wdb\" data-w=\"boundary blurring\" data-m=\"경계 흐려짐\"><b>boundary blurring</b>경계 흐려짐</button><button type=\"button\" class=\"wdb\" data-w=\"dissociative\" data-m=\"분리적인\"><b>dissociative</b>분리적인</button><button type=\"button\" class=\"wdb\" data-w=\"attribution\" data-m=\"(원인) 귀속, 귀인\"><b>attribution</b>(원인) 귀속, 귀인</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 <b>글이 무엇을 찾고 있는지</b>를 잡으세요. 4번에서 “재기 어렵다”는 문제가 나오고, 5번 <b>What we would like to have</b>(우리가 갖고 싶은 것) 뒤에 찾는 대상, 즉 노화를 <b>mirror</b>(반영하는) 지표가 나와요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제</span><div class=\"en\">… we are observing that we all age biologically <mark>at different rates</mark>.</div><p class=\"ko\">우리는 우리 모두가 생물학적으로 <mark>서로 다른 속도로</mark> 나이 든다는 것을 관찰하고 있는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그런데 그 속도를 재기가 어렵다고 해요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 문제 제기</span><div class=\"en\">Unlike the passage of time, biological aging <mark>resists easy measurement</mark>.</div><p class=\"ko\">시간의 흐름과 달리, 생물학적 노화는 <mark>쉬운 측정을 거부한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>What we would like to have(우리가 갖고 싶은 것)로 글이 찾는 것이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\"><mark>What we would like to have</mark> is one or a few measurable biological changes <mark>that mirror all other biological age changes</mark> …</div><p class=\"ko\"><mark>우리가 갖고 싶은 것은</mark> <mark>다른 모든 생물학적 노화 변화를 반영하는</mark> 하나 또는 몇 개의 측정 가능한 생물학적 변화이다 …</p></div><div class=\"ck-via\"><i>▼</i><span>would(~일 것이다)로 아직 없는 측정을 가정해요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 아직 찾는 중</span><div class=\"en\"><mark>This kind of measurement would help explain</mark> why one eighty-year-old has so many more youthful qualities …</div><p class=\"ko\"><mark>이런 종류의 측정은</mark> 왜 여든 살인 한 사람이 젊은이다운 특성을 훨씬 더 많이 가지는지 <mark>설명하는 데 도움이 될 것이다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">생물학적 노화를 비추는 거울을 찾아서<small>5번 mirror(반영하다)가 '거울', would like to have(갖고 싶다)가 '찾아서'예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">밝혀진 생물학적 노화의 비밀</span><span class=\"why\">[반대] 5번은 would like to have(갖고 싶다), 6번은 would help(도움이 될 것이다)예요. 아직 찾는 중이지, 비밀이 밝혀진 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">현대에 노화가 느려진 이유</span><span class=\"why\">[지문에 없음] 1·3번은 사람마다 부위마다 노화 속도가 다르다고 할 뿐, 요즘 노화가 느려졌다는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">역법상 나이를 알아맞히는 몇 가지 요령</span><span class=\"why\">[반대] 글이 재고 싶은 건 chronological age(생활 연령)가 아니라 생물학적 나이예요. 5번도 without reference to the passage of time(시간의 흐름과 관계없이)이라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">젊음의 샘을 찾아서</span><span class=\"why\">[지문에 없음] 6번 youthful qualities(젊은이다운 특성)에서 따온 함정이에요. 글은 젊어지는 법이 아니라 노화를 재는 지표를 찾아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">When we remark with surprise</div><div class=\"k\">우리가 놀라며 말할 때</div></div><div class=\"rc\"><div class=\"e\">that someone “looks young”</div><div class=\"k\">어떤 사람이 “젊어 보인다”고</div></div><div class=\"rc\"><div class=\"e\">for his or her chronological age,</div><div class=\"k\">그 사람의 생활 연령에 비해,</div></div><div class=\"rc\"><div class=\"e\">we are observing</div><div class=\"k\">우리는 관찰하고 있는 것이다</div></div><div class=\"rc ckc\"><div class=\"e\">that we all age biologically <span class=\"cw\">at different rates</span>.</div><div class=\"k\">우리 모두가 생물학적으로 <span class=\"cw\">서로 다른 속도로</span> 나이 든다는 것을.</div></div><div class=\"rnat\">누군가가 자기 생활 연령에 비해 “젊어 보인다”고 우리가 놀라며 말할 때, 우리는 우리 모두가 서로 다른 속도로 생물학적으로 나이 든다는 것을 관찰하고 있는 것이다.</div><div class=\"rst\">우리 할아버지는 여든 살인데 다들 “젊어 보이세요!” 해요. 지문은 이 말이 사람마다 <b>서로 다른 속도로</b>(at different rates) 늙는다는 뜻이래요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Scientists have good evidence</div><div class=\"k\">과학자들은 좋은 증거를 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">that this apparent difference is real.</div><div class=\"k\">이 겉으로 드러나는 차이가 실제라는.</div></div><div class=\"rnat\">과학자들은 이 겉으로 드러나는 차이가 실재한다는 좋은 증거를 가지고 있다.</div><div class=\"rst\">그냥 기분 탓이 아니에요. 지문도 과학자들이 이 겉으로 보이는 차이가 <b>진짜</b>라는 좋은 증거를 가졌다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It is likely</div><div class=\"k\">~할 가능성이 높다 (It은 가주어, 진주어는 that 이하)</div></div><div class=\"rc\"><div class=\"e\">that age changes begin in different parts of the body</div><div class=\"k\">노화 변화가 신체의 서로 다른 부위에서 시작되고</div></div><div class=\"rc\"><div class=\"e\">at different times</div><div class=\"k\">서로 다른 시기에</div></div><div class=\"rc\"><div class=\"e\">and that the rate of annual change varies</div><div class=\"k\">그리고 연간 변화의 속도가 다르다는 것은</div></div><div class=\"rc\"><div class=\"e\">among various cells, tissues, and organs,</div><div class=\"k\">다양한 세포, 조직, 그리고 기관 사이에서,</div></div><div class=\"rc\"><div class=\"e\">as well as from person to person.</div><div class=\"k\">사람마다 (다를) 뿐만 아니라.</div></div><div class=\"rnat\">노화 변화는 신체 부위마다 서로 다른 시기에 시작되고, 연간 변화의 속도는 사람마다 다를 뿐 아니라 다양한 세포·조직·기관 사이에서도 다를 가능성이 높다.</div><div class=\"rst\">할아버지는 무릎은 약해도 눈은 아주 밝아요. 지문도 몸의 부위마다, 사람마다 늙기 시작하는 때와 속도가 다르다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Unlike the passage of time,</div><div class=\"k\">시간의 흐름과 달리,</div></div><div class=\"rc ckc\"><div class=\"e\">biological aging <span class=\"cw\">resists easy measurement</span>.</div><div class=\"k\">생물학적 노화는 <span class=\"cw\">쉬운 측정을 거부한다</span>.</div></div><div class=\"rnat\">시간의 흐름과 달리, 생물학적 노화는 쉽게 측정되지 않는다.</div><div class=\"rst\"><b>그런데</b> 생일은 달력으로 바로 세지만 몸 나이는 쉽게 못 재요. = 지문의 <b>쉬운 측정을 거부한다</b>(resists easy measurement)예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">What we would like to have</span></div><div class=\"k\"><span class=\"cw\">우리가 갖고 싶은 것은</span></div></div><div class=\"rc\"><div class=\"e\">is one or a few measurable biological changes</div><div class=\"k\">하나 또는 몇 개의 측정 가능한 생물학적 변화이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that mirror all other biological age changes</span></div><div class=\"k\"><span class=\"cw\">다른 모든 생물학적 노화 변화를 반영하는</span></div></div><div class=\"rc\"><div class=\"e\">without reference to the passage of time,</div><div class=\"k\">시간의 흐름과 관계없이,</div></div><div class=\"rc\"><div class=\"e\">so that we could say, for example,</div><div class=\"k\">그래서 우리가 예를 들어 말할 수 있도록,</div></div><div class=\"rc\"><div class=\"e\">that someone who is chronologically eighty years old</div><div class=\"k\">생활 연령으로 여든 살인 사람이</div></div><div class=\"rc\"><div class=\"e\">is biologically sixty years old.</div><div class=\"k\">생물학적으로는 예순 살이라고.</div></div><div class=\"rnat\">우리가 갖고 싶은 것은, 시간의 흐름과 관계없이 다른 모든 생물학적 노화 변화를 반영하는 하나 또는 몇 개의 측정 가능한 생물학적 변화로, 그러면 예를 들어 생활 연령으로 여든 살인 사람이 생물학적으로는 예순 살이라고 말할 수 있을 것이다.</div><div class=\"rst\">그래서 몸 전체의 나이를 한 번에 비춰 주는 <b>거울</b> 같은 검사를 <b>갖고 싶다</b>고 해요. 지문의 mirror(반영하다)가 제목의 '거울'이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">This kind of measurement would help explain</div><div class=\"k\">이런 종류의 측정은 설명하는 데 도움이 될 것이다</div></div><div class=\"rc\"><div class=\"e\">why one eighty-year-old has so many more youthful qualities</div><div class=\"k\">왜 여든 살인 한 사람이 젊은이다운 특성을 훨씬 더 많이 가지는지를</div></div><div class=\"rc\"><div class=\"e\">than does another eighty-year-old,</div><div class=\"k\">또 다른 여든 살인 사람보다,</div></div><div class=\"rc\"><div class=\"e\">who may be biologically eighty or even ninety years old.</div><div class=\"k\">그런데 그 사람은 (= 또 다른 여든 살인 사람) 생물학적으로 여든 또는 심지어 아흔 살일지도 모른다.</div></div><div class=\"rnat\">이런 종류의 측정은, 왜 여든 살인 한 사람이 생물학적으로 여든이거나 심지어 아흔일지도 모르는 또 다른 여든 살인 사람보다 젊은이다운 특성을 훨씬 더 많이 지니는지를 설명하는 데 도움이 될 것이다.</div><div class=\"rst\">그런 검사가 있으면 같은 여든 살이라도 왜 누구는 더 젊은지 설명할 수 있대요. 지문은 would(~일 것이다)로 말해요. 아직 찾는 중이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"chronological age\" data-m=\"생활 연령, 역법상 나이\"><b>chronological age</b>생활 연령, 역법상 나이</button><button type=\"button\" class=\"wdb\" data-w=\"biologically\" data-m=\"생물학적으로\"><b>biologically</b>생물학적으로</button><button type=\"button\" class=\"wdb\" data-w=\"apparent\" data-m=\"겉으로 드러나는\"><b>apparent</b>겉으로 드러나는</button><button type=\"button\" class=\"wdb\" data-w=\"measurable\" data-m=\"측정 가능한\"><b>measurable</b>측정 가능한</button><button type=\"button\" class=\"wdb\" data-w=\"mirror\" data-m=\"그대로 반영하다\"><b>mirror</b>그대로 반영하다</button><button type=\"button\" class=\"wdb\" data-w=\"youthful\" data-m=\"젊은이다운\"><b>youthful</b>젊은이다운</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 바로 <b>뒤 절에 빠진 자리가 있는지</b>부터 보세요. 빠진 자리가 있으면 관계대명사 <b>which</b>(~하는), 다 갖춰져 있고 앞이 guarantees(보장) 같은 내용 명사면 동격 <b>that</b>(~라는)이에요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ③번 자리 (5번)</span><div class=\"en\">there must be strong guarantees <u>③ which</u> those who receive the signal will be better off believing it.</div><p class=\"ko\">신호를 받는 사람들이 그것을 믿는 편이 더 낫다는 ( ? ) 강력한 보장 — 앞은 명사 guarantees, 뒤는 빠짐없는 절</p></div><div class=\"ck-via\"><i>▼</i><span>주어 those(사람들), 동사 will be(~일 것이다), 목적어 it(그것)까지 다 있어요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 뒤 절 뜯어보기</span><div class=\"en\"><mark>those</mark> who receive the signal <mark>will be</mark> better off believing <mark>it</mark>.</div><p class=\"ko\"><mark>사람들이</mark> 그것을 믿는 편이 더 <mark>낫다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>뒤가 완전한 절 + 앞이 내용 명사 guarantees(보장) → 동격 that(~라는)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">there must be <mark>strong guarantees</mark> <mark>that</mark> those who receive the signal will be better off believing it.</div><p class=\"ko\">신호를 받는 사람들이 그것을 믿는 편이 더 낫다<mark>는</mark> <mark>강력한 보장</mark>이 있어야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">동격 that(~라는)과 관계대명사 which(~하는) 구별</p><p class=\"gr\">which(~하는) 뒤에는 주어나 목적어가 빠진 불완전한 절이 와요. guarantee(보장)·news(소식)처럼 내용을 담는 명사 뒤에 빠짐없는 절이 오면, 그 내용을 풀어 주는 동격 that(~라는)을 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I heard the news that our team won.</div><div class=\"ko\">나는 우리 팀이 이겼다는 소식을 들었다. (our team won 우리 팀이 이겼다 가 완전하니 동격 that)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I heard the news which our team won.</div><div class=\"ko\">뒤 절이 빠진 자리 없이 완전한데 which를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I read the news which you sent me.</div><div class=\"ko\">나는 네가 보내 준 소식을 읽었다. (sent 보냈다 뒤 목적어가 비었으니 which가 맞아요)</div></div><p class=\"gb\">지문 5번도 guarantees(보장) 뒤 those who receive the signal will be better off believing it(신호를 받는 사람들이 그것을 믿는 편이 더 낫다)이 완전해요. 그래서 which(~하는)가 아니라 동격 that(~라는)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">which → that (~라는)<small>guarantees(보장) 뒤 절이 빠짐없이 완전하니 동격 that(~라는)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">it 그것</span><span class=\"why\">4번에서 chase(쫓다)의 주체는 a predator(포식자)이고 쫓기는 대상은 a prey(먹잇감)예요. 둘이 다르니 재귀대명사 itself(그 자신)가 아니라 it(그것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">대명사 it(그것)과 재귀대명사 itself(그 자신) 구별: 행동하는 쪽과 당하는 쪽이 다르면 it(그것)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Mina asked Tom to help her.</div><div class=\"ko\">미나는 톰에게 자기를 도와 달라고 했다. (돕는 사람은 톰, 도움받는 사람은 미나라서 her 그녀를 이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Mina asked Tom to help herself.</div><div class=\"ko\">돕는 사람은 톰인데 herself(그녀 자신)를 써서 틀려요. herself는 행동하는 사람과 같은 사람일 때만 써요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Tom hurt himself.</div><div class=\"ko\">톰은 (자기 자신을) 다쳤다. (다치게 한 사람과 다친 사람이 같아서 himself 그 자신 이 맞아요)</div></div><p class=\"gb\">지문 4번도 쫓는 건 포식자, 쫓기는 건 먹잇감이라 it(그것 = 먹잇감)이 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">is ~이다</span><span class=\"why\">2번은 such commonality of interests(이해관계의 그러한 공통성) 뒤 ① 자리예요. of interests(이해관계의)는 꾸며 주는 말이고 진짜 주어는 단수 commonality(공통성)라 is(~이다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수일치: 꾸며 주는 말 말고 진짜 주어 commonality(공통성)에 맞춰 단수 is(~이다)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The color of the flowers is red.</div><div class=\"ko\">그 꽃들의 색은 빨갛다. (진짜 주어 color 색 이 단수라 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The color of the flowers are red.</div><div class=\"ko\">flowers(꽃들)에 끌려 복수 동사 are를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The books on the desk are mine.</div><div class=\"ko\">책상 위의 책들은 내 것이다. (진짜 주어 books 책들 이 복수라 are가 맞아요)</div></div><p class=\"gb\">지문 2번도 interests(이해관계들)가 아니라 commonality(공통성)가 주어라 단수 동사 is(~이다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">honest 정직한</span><span class=\"why\">6번은 have to be kept(유지되어야 한다) 뒤예요. on the whole(대체로)은 끼어든 말이고, 메시지가 '어떤 상태로' 유지되는지 말하는 보어 자리라 형용사 honest(정직한)가 맞아요. 부사 honestly(정직하게)는 못 와요.</span><div class=\"gm wx\"><p class=\"gt\">be kept(유지되다) + 형용사 보어(~한 상태로)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The room was kept clean.</div><div class=\"ko\">그 방은 깨끗하게 유지되었다. (clean 깨끗한 = 방의 상태를 말하는 형용사라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The room was kept cleanly.</div><div class=\"ko\">cleanly(깨끗하게)는 부사라 방의 상태를 말할 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Keep your hands warm.</div><div class=\"ko\">손을 따뜻하게 유지해라. (warm 따뜻한 = 형용사 보어라 맞아요)</div></div><p class=\"gb\">지문 6번도 The messages(메시지)가 honest(정직한) 상태로 유지되어야 한다는 뜻이라 형용사가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">communicated 전달된</span><span class=\"why\">7번은 evaluate(평가하다) 뒤 목적어 information(정보) 바로 앞이에요. 정보는 스스로 전하는 게 아니라 '전달되는' 쪽이라 과거분사 communicated(전달된)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">명사 앞 분사: 명사가 당하는 쪽이면 과거분사(~된), 하는 쪽이면 -ing(~하는)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I bought a used bike.</div><div class=\"ko\">나는 중고(사용된) 자전거를 샀다. (자전거는 사용되는 쪽이라 used 사용된 이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I bought a using bike.</div><div class=\"ko\">자전거가 스스로 무언가를 쓰는 게 아닌데 using(사용하는)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Look at the falling leaves.</div><div class=\"ko\">떨어지는 나뭇잎을 봐. (잎이 직접 떨어지니 falling 떨어지는 이 맞아요)</div></div><p class=\"gb\">지문 7번도 information(정보)이 사람들 사이에서 전달된 것이라 communicated(전달된)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Accepting whatever others are communicating</div><div class=\"k\">다른 사람들이 전달하는 것을 무엇이든 받아들이는 것은</div></div><div class=\"rc\"><div class=\"e\">only pays off</div><div class=\"k\">오직 이득이 된다</div></div><div class=\"rc\"><div class=\"e\">if their interests correspond to ours</div><div class=\"k\">그들의 이해관계가 우리의 것과 (= 우리의 이해관계) 일치할 때에만</div></div><div class=\"rc\"><div class=\"e\">— think cells in a body, bees in a beehive.</div><div class=\"k\">— 몸속의 세포나 벌집 속의 벌을 생각해 보라.</div></div><div class=\"rnat\">남이 전달하는 것을 무엇이든 받아들이는 것은 그들의 이해관계가 우리의 이해관계와 일치할 때에만 이득이 되는데, 몸속의 세포나 벌집 속의 벌을 생각해 보라.</div><div class=\"rst\">남이 하는 말을 무엇이든 믿어서 이득인 건 우리와 <b>이해관계가 같을 때</b>뿐이에요. 몸속 세포나 벌집 속 벌처럼요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">As far as communication between humans is concerned,</div><div class=\"k\">인간들 사이의 의사소통에 관한 한,</div></div><div class=\"rc\"><div class=\"e\">such commonality of interests is rarely achieved;</div><div class=\"k\">이해관계의 그러한 공통성은 좀처럼 이루어지지 않는다;</div></div><div class=\"rc\"><div class=\"e\">even a pregnant mother has reasons</div><div class=\"k\">심지어 임신한 어머니도 이유를 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">to mistrust the chemical signals</div><div class=\"k\">화학적 신호를 불신할</div></div><div class=\"rc\"><div class=\"e\">sent by her fetus.</div><div class=\"k\">자신의 태아가 보내는.</div></div><div class=\"rnat\">인간들 사이의 의사소통에 관한 한, 이해관계의 그러한 공통성은 좀처럼 이루어지지 않는다. 임신한 어머니조차 태아가 보내는 화학적 신호를 불신할 이유가 있다.</div><div class=\"rst\">사람끼리는 이해관계가 딱 같은 경우가 드물어요. 주어가 commonality(공통성)라 단수 동사 is(~이다)를 써요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Fortunately,</div><div class=\"k\">다행히도,</div></div><div class=\"rc\"><div class=\"e\">there are ways of making communication work</div><div class=\"k\">의사소통이 이루어지게 만드는 방법들이 있다</div></div><div class=\"rc\"><div class=\"e\">even in the most adversarial of relationships.</div><div class=\"k\">가장 적대적인 관계에서조차.</div></div><div class=\"rnat\">다행히, 가장 적대적인 관계에서조차 의사소통이 이루어지게 만드는 방법들이 있다.</div><div class=\"rst\"><b>다행히</b>(Fortunately) 서로 적인 관계에서도 의사소통이 통하게 만드는 방법은 있어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">A prey can convince a predator</div><div class=\"k\">먹잇감은 포식자를 설득할 수 있다</div></div><div class=\"rc\"><div class=\"e\">not to chase it.</div><div class=\"k\">그것을 (= 먹잇감) 쫓지 말라고.</div></div><div class=\"rnat\">먹잇감은 포식자에게 자신을 쫓지 말라고 설득할 수 있다.</div><div class=\"rst\">먹잇감이 포식자에게 “나 쫓지 마” 하고 설득할 수도 있어요. 쫓기는 건 먹잇감이라 it(그것)을 써요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">But for such communication to occur,</div><div class=\"k\">하지만 그러한 의사소통이 일어나려면,</div></div><div class=\"rc ckc\"><div class=\"e\">there must be strong <span class=\"cw\">guarantees</span></div><div class=\"k\"><span class=\"cw\">강력한 보장</span>이 있어야 한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that those who receive the signal</span></div><div class=\"k\"><span class=\"cw\">신호를 받는 사람들이</span> ※ 문제지엔 which로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\">will be <span class=\"cw\">better off believing it</span>.</div><div class=\"k\">그것을 (= 그 신호) <span class=\"cw\">믿는 편이 더 낫다는</span>.</div></div><div class=\"rnat\">하지만 그러한 의사소통이 일어나려면, 신호를 받는 쪽이 그것을 믿는 편이 더 낫다는 강력한 보장이 있어야 한다.</div><div class=\"rst\">단, 신호를 받는 쪽에 <b>그걸 믿는 게 낫다는 보장</b>이 있어야 해요. guarantees(보장) 뒤 완전한 절이라 동격 that(~라는)이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The messages have to be kept,</div><div class=\"k\">메시지는 유지되어야 한다,</div></div><div class=\"rc\"><div class=\"e\">on the whole,</div><div class=\"k\">대체로,</div></div><div class=\"rc\"><div class=\"e\">honest.</div><div class=\"k\">정직한 상태로.</div></div><div class=\"rnat\">메시지는 대체로 정직하게 유지되어야 한다.</div><div class=\"rst\">그래서 메시지는 대체로 정직하게 지켜져야 해요. be kept(유지되다) 뒤 보어 자리라 형용사 honest(정직한)예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">In the case of humans,</div><div class=\"k\">인간의 경우,</div></div><div class=\"rc\"><div class=\"e\">honesty is maintained</div><div class=\"k\">정직성은 유지된다</div></div><div class=\"rc\"><div class=\"e\">by a set of cognitive mechanisms</div><div class=\"k\">일련의 인지 기제에 의해</div></div><div class=\"rc\"><div class=\"e\">that evaluate communicated information.</div><div class=\"k\">전달된 정보를 평가하는.</div></div><div class=\"rnat\">인간의 경우, 정직성은 전달된 정보를 평가하는 일련의 인지 기제에 의해 유지된다.</div><div class=\"rst\">사람은 전달된 정보를 평가하는 머릿속 장치로 정직함을 지켜요. 정보는 전달되는 쪽이라 communicated(전달된)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">These mechanisms allow us</div><div class=\"k\">이 기제들은 우리가 ~하게 해 준다</div></div><div class=\"rc\"><div class=\"e\">to accept most beneficial messages</div><div class=\"k\">유익한 메시지 대부분을 받아들이게</div></div><div class=\"rc\"><div class=\"e\">— to be open —</div><div class=\"k\">— 열려 있게 —</div></div><div class=\"rc\"><div class=\"e\">while rejecting most harmful messages</div><div class=\"k\">해로운 메시지 대부분은 거부하면서</div></div><div class=\"rc\"><div class=\"e\">— to be vigilant.</div><div class=\"k\">— 경계하게.</div></div><div class=\"rnat\">이 기제들은 우리가 유익한 메시지 대부분을 받아들이면서 — 열려 있으면서 — 해로운 메시지 대부분은 거부하게 — 경계하게 — 해 준다.</div><div class=\"rst\">이 장치 덕분에 좋은 메시지는 받아들이고(열려 있기), 해로운 메시지는 거절해요(경계하기).</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"commonality\" data-m=\"공통성\"><b>commonality</b>공통성</button><button type=\"button\" class=\"wdb\" data-w=\"adversarial\" data-m=\"적대적인\"><b>adversarial</b>적대적인</button><button type=\"button\" class=\"wdb\" data-w=\"prey\" data-m=\"먹잇감, 피식자\"><b>prey</b>먹잇감, 피식자</button><button type=\"button\" class=\"wdb\" data-w=\"guarantee\" data-m=\"보장(책)\"><b>guarantee</b>보장(책)</button><button type=\"button\" class=\"wdb\" data-w=\"be better off\" data-m=\"~하는 편이 더 낫다\"><b>be better off</b>~하는 편이 더 낫다</button><button type=\"button\" class=\"wdb\" data-w=\"vigilant\" data-m=\"경계하는\"><b>vigilant</b>경계하는</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">3번 <b>however</b>(그러나)에서 “창의성은 개인의 것”이라는 통념이 <b>착각</b>으로 뒤집혀요. 필자는 창의성이 <b>남들과의 연결</b> 덕분이라고 하니, 그 방향과 어긋나는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 통념</span><div class=\"en\">Most people are confident that creativity is <mark>an individual possession</mark>, not a collective phenomenon.</div><p class=\"ko\">대부분의 사람들은 창의성이 집단적 현상이 아니라 <mark>개인의 소유물</mark>이라고 확신한다.</p></div><div class=\"ck-via\"><i>▼</i><span>however(그러나)로 1번의 통념을 착각이라고 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 방향 전환</span><div class=\"en\">I think that this perception is something of an <mark>illusion</mark>, <mark>however</mark>.</div><p class=\"ko\"><mark>그러나</mark> 나는 이러한 인식이 일종의 <mark>착각</mark>이라고 생각한다.</p></div><div class=\"ck-via\"><i>▼</i><span>개인 혼자서는 거의 못 이루고, 여러 뇌가 합쳐진 초두뇌 안에서 이뤄요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 필자의 주장</span><div class=\"en\">we would and could accomplish little in the way of creative thinking outside the context of the super-brain, <mark>the integration of individual brains</mark>.</div><p class=\"ko\">우리는 초두뇌, 즉 <mark>개별 두뇌들의 통합</mark>이라는 맥락을 벗어나서는 창의적 사고라는 면에서 거의 이루지 못할 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>연결 덕분이라더니 남의 생각과 끊겨 있었다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (6번)</span><div class=\"en\">The heads of Archimedes, Jane Austen, and all the other original thinkers … were <u>⑤ disconnected</u> with the thoughts of others from early childhood onward,</div><p class=\"ko\">… 머리는 아주 어린 시절부터 다른 사람들의 생각과 ( 단절되어? ) 있었다 → ‘연결되어’가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>집단적 구성물 없이 어떻게? = 남과 연결되어 있었기에 창조했다는 뜻</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 결과로 확인</span><div class=\"en\">How could they have created <mark>without the collective constructions</mark> of mathematics, language, and art?</div><p class=\"ko\">수학, 언어, 그리고 예술이라는 <mark>집단적 구성물이 없었다면</mark> 그들이 어떻게 창조할 수 있었겠는가?</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">connected(연결된) ↔ disconnected(단절된)</p><p class=\"gr\">글의 주장이 “창의성은 남들과의 연결 덕분”이면 사상가들은 남의 생각과 connected(연결된) 상태여야 해요. 또 with(~와)는 connected(연결된)와 짝이고, disconnected(단절된)는 보통 from(~에서)과 짝이에요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Our team won because we were connected with each other.</div><div class=\"ko\">우리 팀은 서로 연결되어 있어서 이겼어요. (함께 → 이김)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Our team won because we were disconnected from each other.</div><div class=\"ko\">서로 끊겨 있었는데 팀으로 이겼다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My phone is disconnected from the Wi-Fi, so I can't play the game.</div><div class=\"ko\">폰이 와이파이에서 끊겨서 게임을 못 해요. (끊김 → 못 함, from과 짝)</div></div><p class=\"gb\">지문 7번이 collective constructions(집단적 구성물) 없이는 창조할 수 없었다고 하니, 6번은 disconnected(단절된)가 아니라 connected(연결된)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">disconnected → connected (연결된)<small>7번 collective constructions(집단적 구성물) 없이는 창조 못 했다니까, 남의 생각과 연결되어 있어야 해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">outside ~ 밖에서</span><span class=\"why\">inside(안에서)로 헷갈리기 쉬워요. 하지만 앞의 accomplish little(거의 이루지 못하다)과 짝이라, 초두뇌 '밖에서는' 거의 못 이룬다는 말이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">collaborations 협업</span><span class=\"why\">2번은 Despite(~에도 불구하고) 뒤예요. 몇몇 협업이 있었는데도 대단한 창의성은 개인의 산물처럼 보인다는 양보라 collaborations(협업)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">illusion 착각</span><span class=\"why\">3번은 however(그러나)로 1·2번의 통념(창의성은 개인의 것)을 뒤집어요. 그 생각이 틀렸다는 뜻이니 illusion(착각)이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">novelty 새로움</span><span class=\"why\">4번은 It cannot be denied(부정할 수 없다)로 개인 뇌의 몫도 인정해요. 정보의 recombination(재조합)이 만드는 건 새로운 것이니 novelty(새로움)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Most people are confident</div><div class=\"k\">대부분의 사람들은 확신한다</div></div><div class=\"rc\"><div class=\"e\">that creativity is an individual possession,</div><div class=\"k\">창의성은 개인의 소유물이라고,</div></div><div class=\"rc\"><div class=\"e\">not a collective phenomenon.</div><div class=\"k\">집단적 현상이 아니라.</div></div><div class=\"rnat\">대부분의 사람들은 창의성이 집단적 현상이 아니라 개인의 소유물이라고 확신한다.</div><div class=\"rst\">다들 “상 받은 그림은 그 친구 혼자 머리로 만든 거야”라고 믿어요. 지문도 사람들이 창의성을 <b>개인의 소유물</b>로 확신한다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Despite some notable collaborations</div><div class=\"k\">몇몇 주목할 만한 협업에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">in the arts and sciences,</div><div class=\"k\">예술과 과학에서의,</div></div><div class=\"rc\"><div class=\"e\">the most impressive acts of creative thought</div><div class=\"k\">창의적 사고의 가장 인상적인 활동들은</div></div><div class=\"rc\"><div class=\"e\">— from Archimedes to Jane Austen —</div><div class=\"k\">— Archimedes부터 Jane Austen까지 —</div></div><div class=\"rc\"><div class=\"e\">appear to have been the products of individuals</div><div class=\"k\">개인들의 산물이었던 것으로 보인다</div></div><div class=\"rc\"><div class=\"e\">(and often isolated and eccentric individuals</div><div class=\"k\">(그리고 흔히 고립되고 기이한 개인들</div></div><div class=\"rc\"><div class=\"e\">who reject commonly held beliefs).</div><div class=\"k\">일반적으로 받아들여지는 믿음을 거부하는).</div></div><div class=\"rnat\">예술과 과학에서 주목할 만한 협업이 몇몇 있었음에도, 아르키메데스에서 제인 오스틴에 이르기까지 창의적 사고의 가장 인상적인 활동들은 개인들(그리고 흔히 일반적으로 받아들여지는 믿음을 거부하는 고립되고 기이한 개인들)의 산물이었던 것으로 보인다.</div><div class=\"rst\">함께한 작품(collaborations 협업)도 있지만, 대단한 작품은 혼자 튀는 천재의 것처럼 보여요. 지문은 아르키메데스(Archimedes) 같은 예를 들어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">I think</div><div class=\"k\">나는 생각한다</div></div><div class=\"rc ckc\"><div class=\"e\">that this perception is something of an illusion, <span class=\"cw\">however</span>.</div><div class=\"k\"><span class=\"cw\">그러나</span> 이러한 인식은 일종의 착각이라고.</div></div><div class=\"rnat\">그러나 나는 이러한 인식이 일종의 착각이라고 생각한다.</div><div class=\"rst\"><b>그러나</b>(however) 필자는 그 생각이 <b>착각</b>(illusion)이라고 뒤집어요. 여기서 글의 방향이 바뀌어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">It cannot be denied</div><div class=\"k\">부정할 수 없다 (It은 가주어, 진주어는 that 이하)</div></div><div class=\"rc\"><div class=\"e\">that the primary source of novelty</div><div class=\"k\">새로움의 주요한 원천이</div></div><div class=\"rc\"><div class=\"e\">lies in the recombination of information</div><div class=\"k\">정보의 재조합에 있다는 것은</div></div><div class=\"rc\"><div class=\"e\">within the individual brain.</div><div class=\"k\">개인의 뇌 안에서의.</div></div><div class=\"rnat\">새로움의 주요한 원천이 개인의 뇌 안에서 일어나는 정보의 재조합에 있다는 것은 부인할 수 없다.</div><div class=\"rst\">물론 새 아이디어(novelty 새로움)는 그 친구 머릿속에서 정보를 새로 섞어 나와요. 지문도 그건 부정할 수 없다고 인정해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">But I suspect</div><div class=\"k\">그러나 나는 생각한다</div></div><div class=\"rc\"><div class=\"e\">that as individuals,</div><div class=\"k\">개인으로서,</div></div><div class=\"rc\"><div class=\"e\">we would and could accomplish little</div><div class=\"k\">우리는 거의 이루지 않을 것이고 이룰 수도 없을 것이라고</div></div><div class=\"rc\"><div class=\"e\">in the way of creative thinking</div><div class=\"k\">창의적 사고라는 면에서</div></div><div class=\"rc\"><div class=\"e\">outside the context of the super-brain,</div><div class=\"k\">초두뇌라는 맥락을 벗어나서는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the integration of individual brains</span>.</div><div class=\"k\">즉 <span class=\"cw\">개별 두뇌들의 통합</span>인 (초두뇌).</div></div><div class=\"rnat\">그러나 나는 개인으로서 우리가 개별 두뇌들의 통합인 '초두뇌'라는 맥락을 벗어나서는 창의적 사고라는 면에서 거의 아무것도 이루지 않을 것이고 이룰 수도 없을 것이라고 생각한다.</div><div class=\"rst\">하지만 혼자 떨어져서는 거의 못 해요. 지문은 여러 뇌가 합쳐진 초두뇌 <b>밖에서는</b>(outside) 창의적인 일을 거의 못 한다고 해요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">The heads of Archimedes, Jane Austen,</div><div class=\"k\">Archimedes, Jane Austen의 머리는,</div></div><div class=\"rc\"><div class=\"e\">and all the other original thinkers</div><div class=\"k\">그리고 그 밖의 모든 독창적인 사상가들의</div></div><div class=\"rc\"><div class=\"e\">who stretch back into the Middle Stone Age in Africa</div><div class=\"k\">아프리카의 중기 석기 시대까지 거슬러 올라가는</div></div><div class=\"rc ckc\"><div class=\"e\">were <span class=\"cw\">connected with the thoughts of others</span></div><div class=\"k\"><span class=\"cw\">다른 사람들의 생각과 연결되어 있었다</span> ※ 문제지엔 disconnected로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">from early childhood onward,</div><div class=\"k\">아주 어린 시절부터 죽,</div></div><div class=\"rc\"><div class=\"e\">including the ideas of those long dead or unknown.</div><div class=\"k\">오래전에 죽었거나 알려지지 않은 사람들의 생각을 포함해서.</div></div><div class=\"rnat\">아르키메데스, 제인 오스틴, 그리고 아프리카의 중기 석기 시대까지 거슬러 올라가는 그 밖의 모든 독창적인 사상가들의 머리는, 오래전에 죽었거나 알려지지 않은 사람들의 생각을 포함해 아주 어린 시절부터 죽 다른 사람들의 생각과 연결되어 있었다.</div><div class=\"rst\">그 친구도 어릴 때부터 선생님·책·옛 화가들의 생각과 <b>연결되어</b>(connected) 있었어요. 그래서 문제지의 disconnected(단절된)는 틀린 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">How could they have created</div><div class=\"k\">그들이 (= 위대한 사상가들) 어떻게 창조할 수 있었겠는가</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">without the collective constructions</span></div><div class=\"k\"><span class=\"cw\">집단적 구성물이 없었다면</span></div></div><div class=\"rc\"><div class=\"e\">of mathematics, language, and art?</div><div class=\"k\">수학, 언어, 그리고 예술이라는?</div></div><div class=\"rnat\">수학, 언어, 예술이라는 집단적 구성물이 없었다면 그들이 어떻게 창조할 수 있었겠는가?</div><div class=\"rst\">말, 숫자, 미술처럼 모두가 함께 만든 것 없이 어떻게 그렸겠어요? 지문도 <b>집단적 구성물</b> 없이는 창조할 수 없었다고 해요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"collective\" data-m=\"집단적인\"><b>collective</b>집단적인</button><button type=\"button\" class=\"wdb\" data-w=\"notable\" data-m=\"주목할 만한\"><b>notable</b>주목할 만한</button><button type=\"button\" class=\"wdb\" data-w=\"illusion\" data-m=\"착각, 환상\"><b>illusion</b>착각, 환상</button><button type=\"button\" class=\"wdb\" data-w=\"novelty\" data-m=\"새로움, 참신함\"><b>novelty</b>새로움, 참신함</button><button type=\"button\" class=\"wdb\" data-w=\"integration\" data-m=\"통합\"><b>integration</b>통합</button><button type=\"button\" class=\"wdb\" data-w=\"stretch back\" data-m=\"거슬러 올라가다\"><b>stretch back</b>거슬러 올라가다</button></div>"};

  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
