<title>고3 미니모의고사 17회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}

nologically eighty years old is biologically sixty years old.", "ev_ko": [[5, "우리가 갖고 싶은 것은, 시간의 흐름과 관계없이 다른 모든 생물학적 노화 변화를 반영하는 하나 또는 몇 개의 측정 가능한 생물학적 변화로, 그러면 예를 들어 생활 연령으로 여든 살인 사람이 생물학적으로는 예순 살이라고 말할 수 있을 것이다."]], "why": ["(1)~(3)은 사람마다 <b>생물학적으로 나이 드는 속도가 다르다<\/b>는 사실을 말합니다", "(4)는 그런데 생물학적 노화는 <b>쉽게 측정되지 않는다<\/b>는 문제를 던집니다", "(5)에서 우리가 갖고 싶은 것은 다른 모든 노화 변화를 <b>그대로 반영하는(mirror)<\/b> 측정 가능한 생물학적 변화라고 합니다", "이 내용이 ①의 <b>Mirror Reflecting Biological Aging<\/b>으로 바뀌어 표현되었습니다", "아직 그런 지표를 <b>찾고 있는 중<\/b>이므로 In Search of(~을 찾아서)가 잘 맞습니다."], "ch": [{"n": "①", "t": "In Search of a Mirror Reflecting Biological Aging", "g": "생물학적 노화를 반영하는 거울을 찾아서", "ok": true, "e": ["(5)의 measurable biological changes that mirror all other biological age changes(다른 모든 생물학적 노화 변화를 반영하는 측정 가능한 생물학적 변화)를 압축한 제목입니다", "(5)의 would like to have(갖고 싶다)처럼 아직 찾는 중이라는 점도 In Search of와 맞습니다."]}, {"n": "②", "t": "Reasons for Slow Aging in the Modern Era", "g": "현대에 노화가 느린 이유", "ok": false, "e": ["글은 현대에 노화가 느려졌다고 말하지 않습니다", "사람마다 노화 속도가 다르다는 것과 노화가 느려졌다는 것은 다른 말입니다."]}, {"n": "③", "t": "A Few Tips to Guess Chronological Age", "g": "생활 연령을 추측하는 몇 가지 비결", "ok": false, "e": ["글의 관심은 생활 연령(chronological age)이 아니라 생물학적 나이를 재는 방법입니다", "생활 연령을 추측하는 요령은 나오지 않습니다."]}, {"n": "④", "t": "Secrets of Biological Aging Disclosed", "g": "밝혀진 생물학적 노화의 비밀", "ok": false, "e": ["Disclosed(밝혀진)가 글과 맞지 않습니다", "(4)에서 생물학적 노화는 쉽게 측정되지 않는다(resists easy measurement)고 했고, (5)도 would like to have(갖고 싶다)라는 바람의 표현입니다."]}, {"n": "⑤", "t": "Looking for the Fountain of Youth", "g": "젊음의 샘 찾기", "ok": false, "e": ["글은 늙지 않는 방법(젊음의 샘)을 찾는 것이 아니라 생물학적 노화를 재는 지표를 찾습니다."]}], "tr": ["누군가가 자기 생활 연령에 비해 “젊어 보인다”고 우리가 놀라며 말할 때, 우리는 우리 모두가 서로 다른 속도로 생물학적으로 나이 든다는 것을 관찰하고 있는 것이다.", "과학자들은 이 겉으로 드러나는 차이가 실재한다는 좋은 증거를 가지고 있다.", "노화 변화는 신체 부위마다 서로 다른 시기에 시작되고, 연간 변화의 속도는 사람마다 다를 뿐 아니라 다양한 세포·조직·기관 사이에서도 다를 가능성이 높다.", "시간의 흐름과 달리, 생물학적 노화는 쉽게 측정되지 않는다.", "우리가 갖고 싶은 것은, 시간의 흐름과 관계없이 다른 모든 생물학적 노화 변화를 반영하는 하나 또는 몇 개의 측정 가능한 생물학적 변화로, 그러면 예를 들어 생활 연령으로 여든 살인 사람이 생물학적으로는 예순 살이라고 말할 수 있을 것이다.", "이런 종류의 측정은, 왜 여든 살인 한 사람이 생물학적으로 여든이거나 심지어 아흔일지도 모르는 또 다른 여든 살인 사람보다 젊은이다운 특성을 훨씬 더 많이 지니는지를 설명하는 데 도움이 될 것이다."], "ps": [{"n": 1, "ch": [{"e": "When we <b>remark<\/b> with surprise", "k": "우리가 놀라며 말할 때"}, {"e": "that someone “looks young”", "k": "어떤 사람이 “젊어 보인다”고"}, {"e": "for his or her <b>chronological age<\/b>,", "k": "그 사람의 생활 연령에 비해,"}, {"e": "we are observing", "k": "우리는 관찰하고 있는 것이다"}, {"e": "that we all age <b>biologically<\/b> at different rates.", "k": "우리 모두가 생물학적으로 서로 다른 속도로 나이 든다는 것을."}], "link": "우리가 어떤 사람이 생활 연령에 비해 “젊어 보인다”고 놀라며 말할 때, 우리는 우리 모두가 생물학적으로 서로 다른 속도로 나이 든다는 것을 관찰하고 있는 것이다.", "easy": "누군가 나이에 비해 젊어 보인다고 놀랄 때, 사실 우리는 사람마다 몸이 늙는 속도가 다르다는 걸 보고 있는 거예요.", "gist": "출발점 — 사람마다 생물학적 노화 속도가 달라요."}, {"n": 2, "ch": [{"e": "Scientists have good evidence", "k": "과학자들은 좋은 증거를 가지고 있다"}, {"e": "that this <b>apparent<\/b> difference is real.", "k": "이 겉으로 드러나는 차이가 실제라는."}], "easy": "겉으로 보이는 이 차이가 진짜라는 증거를 과학자들이 가지고 있어요.", "gist": "그 차이는 실제로 있어요."}, {"n": 3, "ch": [{"e": "It is likely", "k": "~할 가능성이 높다 <span class=\"r\">(It은 가주어, 진주어는 that 이하)<\/span>"}, {"e": "that age changes begin in different parts of the body", "k": "노화 변화가 신체의 서로 다른 부위에서 시작되고"}, {"e": "at different times", "k": "서로 다른 시기에"}, {"e": "and that the rate of <b>annual<\/b> change varies", "k": "그리고 연간 변화의 속도가 다르다는 것은"}, {"e": "among various cells, <b>tissues<\/b>, and <b>organs<\/b>,", "k": "다양한 세포, 조직, 그리고 기관 사이에서,"}, {"e": "as well as from person to person.", "k": "사람마다 (다를) 뿐만 아니라."}], "link": "노화 변화는 서로 다른 시기에 신체의 서로 다른 부위에서 시작되고, 연간 변화의 속도는 사람마다 다를 뿐만 아니라 다양한 세포, 조직, 그리고 기관 사이에서도 다를 가능성이 높다.", "easy": "몸의 부위마다 늙기 시작하는 때가 다르고, 해마다 늙는 속도도 사람마다, 또 세포·조직·기관마다 다를 가능성이 높아요.", "gist": "노화 속도가 다른 구체적인 모습이에요."}, {"n": 4, "ch": [{"e": "Unlike the passage of time,", "k": "시간의 흐름과 달리,"}, {"e": "biological aging <b>resists<\/b> easy measurement.", "k": "생물학적 노화는 쉬운 측정을 거부한다."}], "easy": "시간은 쉽게 잴 수 있지만, 몸이 늙는 정도는 쉽게 잴 수 없어요.", "gist": "문제 제기 — 생물학적 노화는 측정이  off)를 모두 갖춘 <b>완전한 문장<\/b>입니다", "관계대명사 which 뒤에는 주어나 목적어가 빠진 <b>불완전한 문장<\/b>이 와야 하므로 which는 쓸 수 없습니다", "이 자리는 앞의 추상명사 <b>strong guarantees<\/b>의 내용을 풀어 주는 <b>동격의 접속사 that<\/b>이 와야 합니다."], "ch": [{"n": "①", "t": "is", "g": "~이다 (단수 동사)", "ok": false, "e": ["주어는 such commonality of interests이고, 핵심 명사는 commonality(공통성, 단수)입니다", "of interests는 꾸며 주는 말일 뿐이므로 단수 동사 is가 맞습니다."]}, {"n": "②", "t": "it", "g": "그것 (단수 대명사)", "ok": false, "e": ["not to chase의 주체는 a predator(포식자)이고, 쫓는 대상은 a prey(먹잇감, 단수)입니다", "주체와 대상이 다르므로 재귀대명사가 아닌 단수 대명사 it이 맞습니다."]}, {"n": "③", "t": "which", "g": "~하는 (관계대명사)", "ok": true, "e": ["뒤에 주어·동사·보어를 다 갖춘 완전한 문장이 오므로 관계대명사 which는 쓸 수 없습니다", "추상명사 strong guarantees의 내용을 설명하는 동격의 접속사 that으로 고쳐야 합니다."]}, {"n": "④", "t": "honest", "g": "정직한 (형용사)", "ok": false, "e": ["keep + 목적어 + 형용사(~을 …한 상태로 유지하다)가 수동태가 되면 be kept + 형용사가 됩니다", "보어 자리이므로 형용사 honest가 맞습니다."]}, {"n": "⑤", "t": "communicated", "g": "전달된 (과거분사)", "ok": false, "e": ["꾸밈을 받는 명사 information은 '전달되는' 대상입니다", "그래서 과거분사 communicated가 맞습니다."]}], "tr": ["남이 전달하는 것을 무엇이든 받아들이는 것은 그들의 이해관계가 우리의 이해관계와 일치할 때에만 이득이 되는데, 몸속의 세포나 벌집 속의 벌을 생각해 보라.", "인간들 사이의 의사소통에 관한 한, 이해관계의 그러한 공통성은 좀처럼 이루어지지 않는다. 임신한 어머니조차 태아가 보내는 화학적 신호를 불신할 이유가 있다.", "다행히, 가장 적대적인 관계에서조차 의사소통이 이루어지게 만드는 방법들이 있다.", "먹잇감은 포식자에게 자신을 쫓지 말라고 설득할 수 있다.", "하지만 그러한 의사소통이 일어나려면, 신호를 받는 쪽이 그것을 믿는 편이 더 낫다는 강력한 보장이 있어야 한다.", "메시지는 대체로 정직하게 유지되어야 한다.", "인간의 경우, 정직성은 전달된 정보를 평가하는 일련의 인지 기제에 의해 유지된다.", "이 기제들은 우리가 유익한 메시지 대부분을 받아들이면서 — 열려 있으면서 — 해로운 메시지 대부분은 거부하게 — 경계하게 — 해 준다."], "ps": [{"n": 1, "ch": [{"e": "Accepting whatever others are communicating", "k": "다른 사람들이 전달하는 것을 무엇이든 받아들이는 것은"}, {"e": "only <b>pays off<\/b>", "k": "오직 이득이 된다"}, {"e": "if their interests <b>correspond to<\/b> ours", "k": "그들의 이해관계가 우리의 것과 <span class=\"r\">(= 우리의 이해관계)<\/span> 일치할 때에만"}, {"e": "— think cells in a body, bees in a beehive.", "k": "— 몸속의 세포나 벌집 속의 벌을 생각해 보라."}], "link": "다른 사람들이 전달하는 것을 무엇이든 받아들이는 것은 그들의 이해관계가 우리의 이해관계와 일치할 때에만 이득이 되는데, 몸속의 세포나 벌집 속의 벌을 function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}

rts of the body at different times / and that the rate of annual change varies<sup>2</sup> among various cells, tissues, and organs, / as well as<sup>3</sup> from person to person.", "notes": [["1", "It is likely that ~", "~일 가능성이 높다"], ["2", "vary", "다르다, 달라지다"], ["3", "as well as", "~은 물론이고"]], "lit": "~일 가능성이 높다 / 노화 변화가 신체의 서로 다른 부위에서 서로 다른 시기에 시작되고 / 연간 변화 속도가 여러 세포, 조직, 기관마다 달라진다는 것은, / 사람마다 다른 것은 물론이고.", "nat": "노화 변화는 신체 부위마다 시작 시기가 다르고, 연간 변화 속도도 사람마다 다를 뿐 아니라 세포·조직·기관마다 다를 가능성이 높다.", "ana": "맨 앞의 <b>It</b>은 '그것'이 아니라 <b>가주어</b>이고, 진짜 주어는 뒤의 <b>that절</b>이다. 그런데 that절이 <b>하나가 아니라 둘</b>이라는 점이 이 문장의 핵심이다. <b>and that ~</b>처럼 <b>and 뒤에 that이 한 번 더</b> 나오면, 그것은 앞의 that절과 <b>나란히 It에 걸리는 두 번째 진주어</b>라는 신호다. 두 번째 that을 못 보고 and를 앞 문장 안쪽의 연결로 착각하면 문장이 통째로 어긋난다. 마지막 <b>as well as from person to person</b>은 '<b>사람마다 다른 것은 물론이고</b>'라는 뜻으로, <b>A as well as B</b>는 'B뿐만 아니라 A도'이므로 <b>강조는 앞쪽(A)</b>에 있다는 점도 함께 기억해 두자.", "pe": "It is likely<sup>1</sup> / that age changes begin \u0001in different parts of the body\u0002 \u0001at different times\u0002 / and that the rate \u0001of annual change\u0002 varies<sup>2</sup> \u0001among various cells, tissues, and organs\u0002, / \u0001as well as<sup>3</sup> from person to person\u0002.", "pk": "~일 가능성이 높다 / 노화 변화가 \u0001신체의 서로 다른 부위에서\u0002 \u0001서로 다른 시기에\u0002 시작되고 / \u0001연간 변화\u0002 속도가 \u0001여러 세포, 조직, 기관마다\u0002 달라진다는 것은, / \u0001사람마다 다른 것은 물론이고\u0002.", "core": "~일 가능성이 높다: 노화 변화가 시작되고, 변화 속도가 달라진다.", "tags": ["가주어 It + 동사 is + 보어 likely: 2형식. 진주어는 뒤의 that절들(<b>명사절</b>)", "진주어 that절 ①: age changes(주어) begin(1형식). (in different parts of the body) = 부사구: 장소, (at different times) = 부사구: 시점", "진주어 that절 ②(and that …): the rate(주어) varies(1형식). (of annual change) = 형용사구: rate, (among various cells, …) = 부사구: varies를 꾸밈", "(as well as from person to person) = 전치사구(부사구): varies를 꾸밈, as well as = ~뿐 아니라"], "steps": [{"t": "이 문장은 <b>가주어 It + 진주어 that절</b> 구조(S+V+C 2형식)다. that절이 and로 두 개 병렬되어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (가주어, 진짜 주어는 that절들)", "V: is", "C: likely (~할 가능성이 높은)", "뼈대 = <b>It is likely that ~ and that ~</b>"]}, {"t": "첫 번째 that절을 본다.", "sub": ["S: age changes (노화 변화들), V: begin (시작되다) → 1형식", "in different parts of the body (신체의 서로 다른 부위에서), at different times (서로 다른 시기에)는 begin을 꾸미는 부사구"]}, {"t": "<b>and that the rate of annual change varies ~</b>는 두 번째 that절이다. 첫 번째와 병렬이다.", "sub": ["S: the rate (속도). of annual change (연간 변화의)는 rate를 꾸밈", "V: varies (vary 달라지다) → 1형식", "among various cells, tissues, and organs (여러 세포, 조직, 기관 사이에서)"]}, {"t": "끝의 <b>as well as from person to person</b>은 '사람마다 다른 것은 물론'이라는 전치사구이다. varies를 꾸미며 among ~과 나란히 놓인다. as well as (~뿐 아니라)"}], "sum": "노화는 부위·시기·세포·사람마다 다르게 진행될 가능성이 큼"}, {"i": "06", "q": "05", "s": "1", "title": "동명사 주어 + 복합관계대명사절 + 조건 if절", "eng": "Accepting whatever<sup>1</sup> others are communicating / only pays off<sup>2</sup> / if their interests correspond to<sup>3</sup> ours / — think cells in a body, bees in a beehive.", "notes": [["1", "whatever", "~하는 것은 무엇이든"], ["2", "pay off", "이득이 되다"], ["3", "correspond to", "~와 일치하다"]], "lit": "다른 사람들이 전달하는 것이 무엇이든 받아들이는 일은 / 이득이 될 뿐이다 / 그들의 이해관계가 우리의 것과 일치할 때만 / — 몸속의 세포들, 벌집 속의 벌들을 생각해 보라.", "nat": "남이 전달하는 것을 무엇이든 받아들이는 태도는 상대의 이해관계가 우리 것과 맞아떨어질 때에만 이득이 된다. 한 몸속의 세포들이나 한 벌집 속의 벌들을 생각해 보면 된다.", "ana": "주어가 <b>Accepting</b>으로 시작하는 <b>동명사 주어</b>이고, 그 목적어가 <b>whatever others are communicating</b>이라는 <b>복합관계대명사절</b>이다. whatever는 '무엇이든 ~하는 것'이라는 뜻으로 <b>선행사를 안에 품은</b> 관계사라 앞에 명사가 없어도 된다. 주어가 여기까지이므로 동사는 그 뒤의 <b>pays off</b>이고, 동명사 주어는 <b>단수 취급</b>이라 pay가 아니라 <b>pays</b>가 맞다. 이 <b>-s</b> 하나가 어법 문항의 단골 정답 자리다. <b>only</b>는 뒤의 <b>if절</b>에 걸려 '<b>~할 때에만</b>'이라는 조건 한정을 만든다. <b>pay off</b>는 '이득이 되다, 성과를 내다', <b>correspond to</b>는 '~와 일치하다'라는 뜻이다.", "pe": "Accepting whatever<sup>1</sup> others are communicating / \u0001only\u0002 pays off<sup>2</sup> / \u0001if their interests correspond to<sup>3</sup> ours\u0002 / — think cells \u0001in a body\u0002, bees \u0001in a beehive\u0002.", "pk": "다른 사람들이 전달하는 것이 무엇이든 받아들이는 일은 / 이득이 될 뿐이다 / \u0001그들의 이해관계가 우리의 것과 일치할 때만\u0002 / — \u0001몸속의\u0002 세포들, \u0001벌집 속의\u0002 벌들을 생각해 보라.", "core": "받아들이는 일은 이득이 된다. 세포들, 벌들을 생각해 보라.", "tags": ["주어 Accepting whatever others are communicating(<b>동명사구</b> 주어): 동사가 나올 때까지 기다림. whatever절은 Accepting의 목적어", "동사 pays off(구동사): 1형식. (only) = 부사: if절을 꾸밈 (~할 때에만)", "(if their interests …) = 부사절(조건): pays off를 꾸밈. correspond to = ~와 일치하다", "명령문: 동사 think + 목적어 cells, bees. (in a body) = 전치사구(형용사구): cells를 꾸밈, (in a beehive) = 전치사구(형용사구): bees를 꾸밈"], "steps": [{"t": "이 문장은 <b>동명사구가 주어</b>인 S+V(1형식) 문장이다. 주어가 길어서 동사가 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Accepting whatever others are communicating (남이 전달하는 무엇이든 받아들이는 것)", "V: pays off (pay off 이득이 되다. 구동사라 한 덩어리 동사) → 1형식", "only (오직)는 if절을 꾸미는 부사", "뼈대 = <b>Accepting ~ pays off</b>"]}, {"t": "주어 안을 본다.", "sub": ["Accepting (받아들이다) + O: whatever others are communicating", "whatever절의 S: others (남들), V: are communicating (communicate 전달하다), O: whatever (무엇이든)"]}, {"t": "<b>if their interests correspond to ours</b>는 <b>부사절(조건)</b>이다.", "sub": ["S: their interests (그들의 이해관계), V: correspond to (~와 일치하다)", "ours = our interests (우리의 이해관계)"]}, {"t": "대시(—) 뒤는 <b>명령문</b>이다. think cells in a body, bees in a beehive (몸속의 세포들, 벌집 속의 벌들을 생각해 보라).", "sub": ["in a body (몸속의), in a beehive (벌집 속의)는 앞 명사를 꾸미는 전치사구"]}], "sum": "남의 말을 무조건 받아들이는 건 이해관계가 맞을 때만 이득"}, {"i": "07", "q": "06", "s": "1", "title": "S+V+C + that절 + not 대조", "eng": "Most people are confident<sup>1</sup> / that creativity is an individual possession<sup>2</sup>, / not a collective<sup>3</sup> phenomenon.", "notes": [["1", "be confident that ~", "~을 확신하다"], ["2", "possession", "소유물"], ["3", "collective", "집단적인"]], "lit": "대부분의 사람들은 확신한다 / 창의성이 개인의 소유물이라고, / 집단적 현상이 아니라.", "nat": "대부분의 사람들은 창의성이 집단적 현상이 아니라 개인이 가진 것이라고 굳게 믿는다.", "ana": "<b>be confident that ~</b>은 '<b>~라고 확신하다</b>'라는 뜻으로, confident 뒤에 <b>완전한 문장(that절)</b>이 통째로 온다. 같은 자리에 <b>be sure/aware/afraid/convinced</b>도 쓸 수 있어 '<b>형용사 + that절</b>' 묶음으로 외워 두면 좋다. 이때 that은 생략도 가능하다. 뒤쪽의 <b>an individual possession, not a collective phenomenon</b>은 <b>A, not B</b> 형태로 '<b>B가 아니라 A</b>'라는 뜻이며, <b>not B but A</b>를 앞뒤만 바꿔 놓은 것이다. 이렇게 콤마 뒤에 not이 툭 붙는 형태에서는 <b>강조되는 쪽이 앞</b>이라는 점을 기억하자. 글 전체가 이 통념을 뒤집는 구조이므로, 이 문장이 <b>필자의 주장이 아니라 반박 대상</b>이라는 점도 함께 잡아 두어야 한다.", "pe": "Most people are confident<sup>1</sup> / \u0001that creativity is an individual possession<sup>2</sup>\u0002, / \u0001not a collective<sup>3</sup> phenomenon\u0002.", "pk": "대부분의 사람들은 확신한다 / \u0001창의성이 개인의 소유물이라고\u0002, / \u0001집단적 현상이 아니라\u0002.", "core": "대부분의 사람들은 확신한다.", "tags": ["주어 Most people + 동사 are + 보어 confident: 2형식", "(that절) = 접속사절(부사적): confident의 확신 내용. SVC가 이미 완성 [기준: 감정·판단 형용사 뒤 that절 = 수식어]", "(not a collective phenomenon) = 대조 어구(부사적): 앞 that절 내용을 꾸밈. not A but B 구조의 A"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 형용사 confident 뒤에 that절이 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Most people (대부분의 사람들)", "V: are", "C: confident (확신하는)", "뼈대 = <b>Most people are confident</b>"]}, {"t": "<b>that creativity is an individual possession</b>은 confident의 내용을 알려 주는 <b>that절(부사절)</b>이다. 빼도 뼈대가 완결되므로 부사절로 본다.", "sub": ["S: creativity (창의성), V: is, C: an individual possession (개인의 소유물)"]}, {"t": "<b>not a collective phenomenon</b> (집단적 현상이 아니라)은 that절 내용을 대조하는 표현이다. 'A, not B' 구조의 not B이다. collective (집단적인), phenomenon (현상)"}], "sum": "대부분은 창의성을 집단적 현상이 아닌 개인의 소유물로 확신"}, {"i": "08", "q": "06", "s": "5", "title": "S+V+O(that절) + 조동사 병렬 + 동격", "eng": "But I suspect<sup>1</sup> / that as individuals, / we would and could accomplish little<sup>2</sup> in the way of<sup>3</sup> creative thinking / outside the context of the super-brain, / the integration of individual brains.", "notes": [["1", "suspect", "짐작하다, 의심하다"], ["2", "little", "거의 없는 것"], ["3", "in the way of", "~라는 면에서"]], "lit": "그러나 나는 짐작한다 / 개인으로서는, / 우리가 창의적 사고라는 면에서 이룰 수 있는 것이 거의 없으리라고 / 초두뇌라는 맥락 밖에서는, / 즉 개별 두뇌들의 통합이라는 (맥락 밖에서는).", "nat": "그러나 나는 개별 두뇌들이 통합된 '초두뇌'라는 맥락을 벗어나면, 개인으로서 우리가 창의적 사고에서 이룰 수 있는 것은 거의 없으리라고 짐작한다.", "ana": "<b>would and could accomplish</b>는 조동사 <b>두 개가 하나의 동사원형을 공유</b>하는 형태다. 즉 <b>would accomplish and could accomplish</b>에서 뒤의 accomplish가 생략된 것이며, and 뒤에 동사원형이 안 보인다고 당황할 필요가 없다. 목적어 <b>little</b>은 '작은'이 아니라 '<b>거의 없는 것</b>'이라는 <b>부정</b>의 의미다. a가 붙은 <b>a little</b>은 '조금은 있다'는 긍정이므로 <b>a의 유무로 뜻이 정반대</b>가 된다는 점을 반드시 기억하자. 문장 끝의 <b>the integration of individual brains</b>는 앞의 <b>the super-brain</b>을 다시 말해 주는 <b>동격</b>이다. <b>in the way of</b>는 '<b>~라는 면에서</b>'라는 뜻이다.", "pe": "But I suspect<sup>1</sup> / that \u0001as individuals\u0002, / we would and could accomplish little<sup>2</sup> \u0001in the way of<sup>3</sup> creative thinking\u0002 / \u0001outside the context of the super-brain\u0002, / \u0001the integration of individual brains\u0002.", "pk": "그러나 나는 짐작한다 / \u0001개인으로서는\u0002, / 우리가 \u0001창의적 사고라는 면에서\u0002 이룰 수 있는 것이 거의 없으리라고 / \u0001초두뇌라는 맥락 밖에서는\u0002, / \u0001즉 개별 두뇌들의 통합이라는\u0002 (맥락 밖에서는).", "core": "나는 짐작한다. 우리는 거의 이룰 수 없을 것이다.", "tags": ["but은 앞뒤를 잇는 접속사. 주어 I + 동사 suspect + 목적어 that절(<b>명사절</b>): 3형식", "that절 시작. (as individuals) = 전치사구(부사구): accomplish를 꾸밈", "that절 안: 주어 we + 동사 would and could accomplish + 목적어 little. (in the way of creative thinking) = 전치사구(부사구): accomplish, ~라는 면에서", "(outside the context of the super-brain) = 전치사구(부사구): accomplish를 꾸밈", "(the integration of individual brains) = 동격 명사구: the super-brain을 다시 설명"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고 목적어가 <b>that절</b>이다. 안쪽에 부사구가 많고 동격까지 있어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: I (나)", "V: suspect (짐작하다, 의심하다)", "O: that절", "But (그러나)은 앞과 이어 주는 말", "뼈대 = <b>I suspect that ~</b>"]}, {"t": "that절 안의 뼈대를 찾는다.", "sub": ["S: we (우리)", "V: would and could accomplish (accomplish 이루다. would와 could가 병렬로 한 동사에 걸린다)", "O: little (거의 없는 것)", "뼈대 = <b>we would and could accomplish little</b>"]}, {"t": "수식어를 순서대로 본다.", "sub": ["<b>as individuals</b> (개인으로서) = 전치사구, accomplish를 꾸민다", "<b>in the way of creative thinking</b> (창의적 사고의 면에서) = 전치사구", "<b>outside the context of the super-brain</b> (초두뇌라는 맥락 밖에서) = 전치사구"]}, {"t": "마지막 <b>the integration of individual brains</b> (개별 두뇌들의 통합)는 <b>동격 명사구</b>이다. the super-brain을 다시 설명한다."}], "sum": "개인으로서는 초두뇌 밖에서 창의적 사고를 거의 못 한다고 짐작"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2023년 10월 18번", "ans": "②", "tr": [["1", "이 공지가 귀하께 건강과 좋은 기분 속에서 닿기를 바랍니다."], ["2", "10월 9일에 Rosehill Apartment Complex로, 그중에서도 귀하의 집 앞으로 주소가 적힌 소포 한 개가 배달되었음을 알려 드리고자 글을 씁니다."], ["3", "그러나 여러 차례 소포를 전달하려 시도했음에도, 그 소포는 오랜 기간 저희 프런트 데스크에 찾아가지 않은 채로 남아 있습니다."], ["4", "관리 사무소로서, 배달된 모든 물품을 안전하게 보관하고 그것을 알맞은 입주민에게 신속히 전달하도록 돕는 것이 저희의 책임입니다."], ["5", "따라서 저희 업무 시간 중에 관리 사무소를 방문하셔서 소포를 찾아가 주시기를 정중히 요청드립니다."], ["6", "이 사안에 대한 귀하의 협조에 진심으로 감사드립니다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Therefore, we kindly request that you visit the management office during our office hours to claim your package."}, {"en": false, "h": "목적 문항은 <b>Therefore·So·Please</b> 같은 신호어 뒤의 <b>요청 문장</b>이 곧 정답이다. 이 글은 1번에서 인사, 2번에서 소포가 배달되었다는 사실, 3번에서 <b>아직 찾아가지 않았다(unclaimed)</b>는 문제 상황을 차례로 깔아 놓은 뒤, 5번에서 <b>visit the management office ... to claim your package</b>라고 못 박는다. 즉 글 전체가 '<b>당신 소포가 여기 있으니 와서 가져가라</b>' 한 문장으로 수렴한다. 주의할 것은 3번의 <b>despite multiple attempts to deliver</b>다. '배달을 여러 번 시도했다'는 말 때문에 <b>배달 사고·도난</b> 쪽으로 끌려가기 쉬운데, 이는 <b>왜 아직 프런트에 있는지</b>를 설명하는 배경일 뿐이다."}], "opts": [{"n": "①", "t": "관리 사무실 공사 일정을 알리려고", "a": false, "x": true, "trap": false, "e": "공사(construction·repair)에 관한 언급이 전혀 없다. management office는 <b>글을 쓰는 주체</b>로 등장할 뿐이다."}, {"n": "②", "t": "배달된 물품을 찾아갈 것을 요청하려고", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>we kindly request that you visit ... to claim your package</b>와 정확히 일치한다. 3번의 <b>unclaimed</b>(찾아가지 않은)가 이 요청의 이유다."}, {"n": "③", "t": "잘못 찾아간 물품의 반납을 부탁하려고", "a": false, "x": true, "trap": true, "e": "소포는 아직 <b>프런트 데스크에 그대로</b> 있다(remained unclaimed at our front desk). 누가 잘못 가져간 상황이 아니다."}, {"n": "④", "t": "배달 물품의 도난 방지 조치를 설명하려고", "a": false, "x": true, "trap": false, "e": "4번의 <b>safekeeping</b>(안전 보관)만 보고 고르기 쉽지만, 이는 관리 사무소의 <b>책임을 밝히는 근거</b>일 뿐 도난 방지 <b>조치를 설명</b>하는 부분이 아니다."}, {"n": "⑤", "t": "관리 사무실 운영 시간 변경을 공지하려고", "a": false, "x": true, "trap": false, "e": "<b>during our office hours</b>는 '업무 시간에 오시라'는 안내이지 <b>시간이 바뀌었다</b>는 공지가 아니다."}], "w": [["notice", "공지, 안내문"], ["inform A that ~", "A에게 ~을 알리다"], ["package", "소포, 택배"], ["specifically", "특히, 명확히"], ["address", "~ 앞으로 주소를 쓰다"], ["attempt", "시도"], ["unclaimed", "찾아가지 않은"], ["extended", "장기간의"], ["safekeeping", "안전 보관"], ["resident", "입주민, 거주자"], ["claim", "(자기 것을) 찾아가다"], ["cooperation", "협조, 협력"]]}, {"q": "02", "type": "밑줄 함축 의미", "src": "2019학년도 수능 21번", "ans": "①", "tr": [["1", "비록 명시된 목표는 아니지만, 최고의 과학은 사실상 무지를 정제하는 일로 볼 수 있다."], ["2", "과학자들은, 특히 젊은 과학자들은 결과에 너무 집착할 수 있다."], ["3", "사회도 이 미친 듯한 추구 속에서 그들을 부추긴다."], ["4", "큰 발견은 언론에 보도되고, 대학 홈페이지에 오르고, 연구비를 따는 데 도움이 되며, 승진을 정당화해 준다."], ["5", "그러나 그것은 잘못되었다."], ["6", "위대한 과학자들, 즉 우리가 존경하는 선구자들은 결과가 아니라 다음 질문에 관심을 둔다."], ["7", "매우 존경받는 물리학자 엔리코 페르미는 학생들에게, 가설을 성공적으로 입증하는 실험은 측정이고 그렇지 못한 실험이 발견이라고 말했다."], ["8", "발견이란 새로운 무지를 밝혀내는 일이다."], ["9", "과학적 성취의 정점인 노벨상은 평생에 걸친 과학적 업적이 아니라 단 하나의 발견, 곧 하나의 결과에 주어진다."], ["10", "노벨 위원회조차 이것이 사실 과학 정신에 온전히 부합하지는 않는다는 것을 어느 정도 알고 있어서, 수상 사유서는 흔히 그 발견이 “한 분야를 열어젖혔다”, “한 분야를 변모시켰다”, 혹은 “한 분야를 새롭고 예상치 못한 방향으로 이끌었다”는 이유로 그것을 기린다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "The highly respected physicist Enrico Fermi told his students that an experiment that successfully proves a hypothesis is a measurement; one that doesn't is a discovery."}, {"en": false, "h": "밑줄 <b>refining ignorance</b>를 글자 그대로 '무지를 정제하다'로만 읽으면 답이 안 나온다. 이 글은 밑줄의 뜻을 <b>7·8번 문장에서 직접 정의</b>해 준다. 가설을 <b>성공적으로 입증한</b> 실험은 이미 아는 것을 확인한 <b>측정</b>일 뿐이고, 입증에 <b>실패한</b> 실험이야말로 <b>발견</b>이며, 그 발견이란 <b>an uncovering — of new ignorance</b>, 즉 '<b>새로운 무지를 드러내는 일</b>'이라는 것이다. 6번의 <b>not concerned with results but with the next questions</b>도 같은 말이다. 정리하면 <b>이미 아는 것 너머로 나아가 아직 모르는 영역을 드러내는 것</b>이 되므로, <b>looking beyond what is known towards what is left unknown</b>이 그대로 답이 된다."}], "opts": [{"n": "①", "t": "알려진 것 너머를 바라보며 알려지지 않은 채 남은 것으로 나아가는 것", "a": true, "x": false, "trap": false, "e": "7·8번의 <b>a discovery, an uncovering — of new ignorance</b>와 6번의 <b>the next questions</b>를 한 문장으로 압축한 진술이다. <b>known → unknown</b>의 방향이 정확히 일치한다."}, {"n": "②", "t": "발견된 것에 대해 궁극적인 설명을 제시하는 것", "a": false, "x": true, "trap": false, "e": "<b>ultimate account</b>(최종적 설명)는 이 글이 <b>비판하는</b> 태도다. 글은 결론을 확정하는 일이 아니라 <b>새 질문을 여는</b> 일을 최고의 과학이라고 한다."}, {"n": "③", "t": "객관적인 사고방식으로 기존 지식을 분석하는 것", "a": false, "x": true, "trap": true, "e": "<b>existing knowledge</b>를 분석하는 것은 7번에서 말한 <b>measurement</b> 쪽에 가깝다. 글은 그것을 발견과 <b>구별</b>한다."}, {"n": "④", "t": "과학자들이 중요한 발견을 널리 알리도록 고무하는 것", "a": false, "x": true, "trap": false, "e": "4번의 언론 보도·홈페이지·연구비·승진은 <b>사회가 부추기는 잘못된 방향</b>으로 제시되고 5번에서 <b>But it's wrong</b>이라고 곧바로 부정된다."}, {"n": "⑤", "t": "학생들에게 새로운 과학 분야를 알려 주는 것", "a": false, "x": true, "trap": false, "e": "페르미가 학생들에게 말했다는 것은 <b>예시의 장치</b>일 뿐이며, 글의 초점은 교육이 아니라 <b>과학의 본질</b>이다."}], "w": [["explicit", "명시적인, 분명한"], ["refine", "정제하다, 다듬다"], ["ignorance", "무지"], ["obsessed with", "~에 집착하는"], ["make the case for", "~의 근거를 만들다"], ["pioneer", "선구자"], ["hypothesis", "가설"], ["measurement", "측정(값)"], ["uncovering", "밝혀냄, 드러냄"], ["pinnacle", "정점"], ["citation", "(수상) 사유서"], ["transform", "변모시키다"]]}, {"q": "03", "type": "글의 주제", "src": "2021년 3월 23번", "ans": "④", "tr": [["1", "아무리 훈련이 잘되어 있어도 배우는 공연 중의 짧은 순간일지언정 자기 배역이 속으로 느끼는 삶을 필연적으로 겪게 된다."], ["2", "자기 인식은 공연이 진행되는 동안, 그리고 긴 공연 시즌 동안에는 더욱더 달라진다."], ["3", "많은 배우들에게 있어 그들은 자기 배역에 대해 더 큰 공감과 사회적 인지를 경험하는데, 이것이 정체성 경계의 흐려짐을 심화시킬 수 있다."], ["4", "또한 배우들은 더 많은 분리적 과정을 사용하는 경향이 있는데, 이것이 배역 경계가 흐려질 가능성을 높인다."], ["5", "배우들은 또한 과거의 트라우마와 상실 경험에 대해 해소되지 않은 애도를 더 많이 겪는데, 배역을 연기할 때 그런 경험에서 계속 끌어다 쓰기 때문이다."], ["6", "창작 작업과 하나가 되려는 이런 경향에 더해, 관객들 또한 배역의 인격을 배우의 인격과 혼동한다."], ["7", "관객의 귀인 오류는 배우의 괴로움을 키울 수 있는데, 여기에는 자기 인격의 정체성이 안정적이지 않다는 두려움도 포함된다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "For many actors, they experience greater empathy and social cognition for their character, which may intensify identity boundary blurring."}, {"en": false, "h": "주제 문항의 핵심어는 반복되는 표현에서 찾는다. 이 글에는 <b>boundary blurring</b>(경계 흐려짐)이 3·4번에서 두 번, <b>confuse the character's personality with the actor's personality</b>(6번), <b>personality identity is not stable</b>(7번)이 이어진다. 전부 <b>배우와 배역의 정체성이 뒤섞인다</b>는 한 가지 이야기다. 게다가 그 혼동은 <b>배우 쪽</b>(1~5번)에서만 일어나는 것이 아니라 <b>관객 쪽</b>(6번)에서도 일어난다고 확장된다. 그래서 주제는 '<b>배우와 배역 사이의 정체성 혼동</b>'이 된다. 1번의 <b>Despite excellent training</b>은 '훈련으로도 막을 수 없다'는 뜻이라 주제를 오히려 강화한다."}], "opts": [{"n": "①", "t": "배우의 연기를 평가하는 기준", "a": false, "x": true, "trap": false, "e": "평가 기준(criteria)에 해당하는 내용이 한 줄도 없다. 글은 <b>배우 내면에서 일어나는 현상</b>을 설명한다."}, {"n": "②", "t": "복잡한 인물을 연기하는 데서 오는 어려움", "a": false, "x": true, "trap": true, "e": "'복잡한 인물'이라는 조건이 글에 없다. 글이 말하는 어려움은 배역의 복잡성 때문이 아니라 <b>자기와 배역의 경계가 흐려지기</b> 때문이다."}, {"n": "③", "t": "연극을 감상하기 위한 배경지식", "a": false, "x": true, "trap": false, "e": "관객이 등장하지만(6·7번) 그것은 <b>감상법</b>이 아니라 <b>관객도 혼동한다</b>는 사실을 보태기 위한 것이다."}, {"n": "④", "t": "배우와 배역 사이의 정체성 혼동", "a": true, "x": false, "trap": false, "e": "3·4번의 <b>identity/character boundary blurring</b>, 6번의 <b>confuse the character's personality with the actor's personality</b>, 7번의 <b>personality identity is not stable</b>이 모두 이 한 문장으로 모인다."}, {"n": "⑤", "t": "배우와 관객 사이의 심리적 장벽", "a": false, "x": true, "trap": false, "e": "관객은 배우와 <b>벽을 쌓는</b> 것이 아니라 오히려 배역과 배우를 <b>구분하지 못한다</b>. 방향이 정반대다."}], "w": [["inevitably", "필연적으로"], ["visceral", "마음속에서 느끼는"], ["self-perception", "자기 인식"], ["empathy", "공감"], ["intensify", "심화시키다"], ["boundary blurring", "경계 흐려짐"], ["dissociative", "분리적인"], ["unresolved", "해소되지 않은"], ["mourning", "애도, 슬픔"], ["portray", "연기하다, 묘사하다"], ["attribution", "(원인) 귀속, 귀인"], ["distress", "괴로움, 고통"]]}, {"q": "04", "type": "글의 제목", "src": "2016학년도 수능 23번", "ans": "①", "tr": [["1", "누군가가 자기 나이에 비해 “젊어 보인다”고 우리가 놀라며 말할 때, 우리는 우리 모두가 서로 다른 속도로 생물학적으로 늙어 간다는 사실을 관찰하고 있는 것이다."], ["2", "과학자들은 이 겉으로 드러나는 차이가 실재한다는 좋은 증거를 가지고 있다."], ["3", "노화 변화는 신체 부위마다 시작 시기가 다르고, 연간 변화 속도도 사람마다 다를 뿐 아니라 세포·조직·기관마다 다를 가능성이 높다."], ["4", "시간의 흐름과 달리, 생물학적 노화는 손쉬운 측정을 허락하지 않는다."], ["5", "우리가 갖고 싶은 것은, 시간의 흐름과 무관하게 다른 모든 생물학적 노화 변화를 그대로 비춰 주는 한두 가지의 측정 가능한 생물학적 변화이다. 그러면 예컨대 역법상 여든 살인 사람이 생물학적으로는 예순 살이라고 말할 수 있을 것이다."], ["6", "이런 종류의 측정은, 한 여든 살이 다른 여든 살보다 왜 훨씬 더 젊은 특성을 많이 지니는지를 설명하는 데 도움이 될 것이다. 그 다른 여든 살은 생물학적으로 여든이거나 심지어 아흔일 수도 있다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "What we would like to have is one or a few measurable biological changes that mirror all other biological age changes without reference to the passage of time."}, {"en": false, "h": "제목 문항은 <b>글이 무엇을 찾고 있는지</b>를 잡아야 한다. 1~3번은 사람마다 <b>생물학적 노화 속도가 다르다</b>는 사실을, 4번은 그런데 그것이 <b>측정하기 어렵다</b>는 문제를 던진다. 그리고 5번에서 <b>What we would like to have is ~</b>라는 형태로 <b>원하는 것</b>이 직접 제시된다. 바로 다른 모든 노화 변화를 그대로 <b>비춰 주는(mirror)</b> 측정 가능한 지표다. 이 <b>mirror</b>가 선택지의 <b>Mirror</b>로 그대로 옮겨졌으므로, '<b>생물학적 노화를 비추는 거울을 찾아서</b>'가 제목이 된다. 아직 <b>찾는 중</b>이라는 점이 중요하며, 그래서 '밝혀졌다(Disclosed)'류 선택지는 모두 어긋난다."}], "opts": [{"n": "①", "t": "생물학적 노화를 비추는 거울을 찾아서", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>changes that mirror all other biological age changes</b>를 그대로 압축했다. <b>In Search of</b>(찾아서)라는 표현이 아직 그런 지표가 없다는 4번의 문제 제기와도 맞물린다."}, {"n": "②", "t": "현대에 노화가 느려진 이유", "a": false, "x": true, "trap": false, "e": "글은 노화가 <b>느려졌다</b>고 말한 적이 없다. 사람마다 속도가 <b>다르다</b>는 것과 <b>느려졌다</b>는 것은 전혀 다른 진술이다."}, {"n": "③", "t": "역법상 나이를 알아맞히는 몇 가지 요령", "a": false, "x": true, "trap": false, "e": "글의 관심은 <b>chronological age</b>가 아니라 <b>biological age</b>다. 역법상 나이는 이미 알고 있는 값이므로 알아맞힐 대상이 아니다."}, {"n": "④", "t": "밝혀진 생물학적 노화의 비밀", "a": false, "x": true, "trap": true, "e": "<b>Disclosed</b>(밝혀진)가 결정적으로 틀렸다. 4번은 <b>resists easy measurement</b>라며 아직 못 밝혔다고 했고, 5번도 <b>would like to have</b>라는 <b>희망</b>의 표현이다."}, {"n": "⑤", "t": "젊음의 샘을 찾아서", "a": false, "x": true, "trap": false, "e": "글은 늙지 않는 <b>방법</b>을 찾는 것이 아니 function renderNote(){

  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;

    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;

  $('#back2').onclick=()=>{view='word';render();};

}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){

  $('#b').onclick=()=>{view='word';render();};
}

function renderSubmit(){

    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;

}
