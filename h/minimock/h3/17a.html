<!doctype html>
<html lang="ko">
<head>

<title>고3 미니모의고사 17회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}

.cells{display:flex;flex-direction:column;gap:6px}

.cell.bad{background:var(--badbg);border-color:var(--bad)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}

.btn.pri{background:var(--accent);color:#fff}

.tool{display:flex;gap:8px;margin:2px 0 10px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}

.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}

.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}

.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}

.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}

/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}

.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}
.evx .en{background:#fff;border:1px solid #d5eadc;font-size:15.5px;margin:0 0 8px}

.evx .evh{font-size:13px;font-weight:800;color:var(--good);margin-bottom:6px}
.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}

.opx.a .mk{color:var(--good)}
.opx .bd{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opx .bd.g{background:var(--good)}
.opx .bd.t{background:#b4472f}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}

<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});

nologically eighty years old is biologically sixty years old.", "ev_ko": [[5, "우리가 갖고 싶은 것은, 시간의 흐름과 관계없이 다른 모든 생물학적 노화 변화를 반영하는 하나 또는 몇 개의 측정 가능한 생물학적 변화로, 그러면 예를 들어 생활 연령으로 여든 살인 사람이 생물학적으로는 예순 살이라고 말할 수 있을 것이다."]], "why": ["(1)~(3)은 사람마다 <b>생물학적으로 나이 드는 속도가 다르다<\/b>는 사실을 말합니다", "(4)는 그런데 생물학적 노화는 <b>쉽게 측정되지 않는다<\/b>는 문제를 던집니다", "(5)에서 우리가 갖고 싶은 것은 다른 모든 노화 변화를 <b>그대로 반영하는(mirror)<\/b> 측정 가능한 생물학적 변화라고 합니다", "이 내용이 ①의 <b>Mirror Reflecting Biological Aging<\/b>으로 바뀌어 표현되었습니다", "아직 그런 지표를 <b>찾고 있는 중<\/b>이므로 In Search of(~을 찾아서)가 잘 맞습니다."], "ch": [{"n": "①", "t": "In Search of a Mirror Reflecting Biological Aging", "g": "생물학적 노화를 반영하는 거울을 찾아서", "ok": true, "e": ["(5)의 measurable biological changes that mirror all other biological age changes(다른 모든 생물학적 노화 변화를 반영하는 측정 가능한 생물학적 변화)를 압축한 제목입니다", "(5)의 would like to have(갖고 싶다)처럼 아직 찾는 중이라는 점도 In Search of와 맞습니다."]}, {"n": "②", "t": "Reasons for Slow Aging in the Modern Era", "g": "현대에 노화가 느린 이유", "ok": false, "e": ["글은 현대에 노화가 느려졌다고 말하지 않습니다", "사람마다 노화 속도가 다르다는 것과 노화가 느려졌다는 것은 다른 말입니다."]}, {"n": "③", "t": "A Few Tips to Guess Chronological Age", "g": "생활 연령을 추측하는 몇 가지 비결", "ok": false, "e": ["글의 관심은 생활 연령(chronological age)이 아니라 생물학적 나이를 재는 방법입니다", "생활 연령을 추측하는 요령은 나오지 않습니다."]}, {"n": "④", "t": "Secrets of Biological Aging Disclosed", "g": "밝혀진 생물학적 노화의 비밀", "ok": false, "e": ["Disclosed(밝혀진)가 글과 맞지 않습니다", "(4)에서 생물학적 노화는 쉽게 측정되지 않는다(resists easy measurement)고 했고, (5)도 would like to have(갖고 싶다)라는 바람의 표현입니다."]}, {"n": "⑤", "t": "Looking for the Fountain of Youth", "g": "젊음의 샘 찾기", "ok": false, "e": ["글은 늙지 않는 방법(젊음의 샘)을 찾는 것이 아니라 생물학적 노화를 재는 지표를 찾습니다."]}], "tr": ["누군가가 자기 생활 연령에 비해 “젊어 보인다”고 우리가 놀라며 말할 때, 우리는 우리 모두가 서로 다른 속도로 생물학적으로 나이 든다는 것을 관찰하고 있는 것이다.", "과학자들은 이 겉으로 드러나는 차이가 실재한다는 좋은 증거를 가지고 있다.", "노화 변화는 신체 부위마다 서로 다른 시기에 시작되고, 연간 변화의 속도는 사람마다 다를 뿐 아니라 다양한 세포·조직·기관 사이에서도 다를 가능성이 높다.", "시간의 흐름과 달리, 생물학적 노화는 쉽게 측정되지 않는다.", "우리가 갖고 싶은 것은, 시간의 흐름과 관계없이 다른 모든 생물학적 노화 변화를 반영하는 하나 또는 몇 개의 측정 가능한 생물학적 변화로, 그러면 예를 들어 생활 연령으로 여든 살인 사람이 생물학적으로는 예순 살이라고 말할 수 있을 것이다.", "이런 종류의 측정은, 왜 여든 살인 한 사람이 생물학적으로 여든이거나 심지어 아흔일지도 모르는 또 다른 여든 살인 사람보다 젊은이다운 특성을 훨씬 더 많이 지니는지를 설명하는 데 도움이 될 것이다."], "ps": [{"n": 1, "ch": [{"e": "When we <b>remark<\/b> with surprise", "k": "우리가 놀라며 말할 때"}, {"e": "that someone “looks young”", "k": "어떤 사람이 “젊어 보인다”고"}, {"e": "for his or her <b>chronological age<\/b>,", "k": "그 사람의 생활 연령에 비해,"}, {"e": "we are observing", "k": "우리는 관찰하고 있는 것이다"}, {"e": "that we all age <b>biologically<\/b> at different rates.", "k": "우리 모두가 생물학적으로 서로 다른 속도로 나이 든다는 것을."}], "link": "우리가 어떤 사람이 생활 연령에 비해 “젊어 보인다”고 놀라며 말할 때, 우리는 우리 모두가 생물학적으로 서로 다른 속도로 나이 든다는 것을 관찰하고 있는 것이다.", "easy": "누군가 나이에 비해 젊어 보인다고 놀랄 때, 사실 우리는 사람마다 몸이 늙는 속도가 다르다는 걸 보고 있는 거예요.", "gist": "출발점 — 사람마다 생물학적 노화 속도가 달라요."}, {"n": 2, "ch": [{"e": "Scientists have good evidence", "k": "과학자들은 좋은 증거를 가지고 있다"}, {"e": "that this <b>apparent<\/b> difference is real.", "k": "이 겉으로 드러나는 차이가 실제라는."}], "easy": "겉으로 보이는 이 차이가 진짜라는 증거를 과학자들이 가지고 있어요.", "gist": "그 차이는 실제로 있어요."}, {"n": 3, "ch": [{"e": "It is likely", "k": "~할 가능성이 높다 <span class=\"r\">(It은 가주어, 진주어는 that 이하)<\/span>"}, {"e": "that age changes begin in different parts of the body", "k": "노화 변화가 신체의 서로 다른 부위에서 시작되고"}, {"e": "at different times", "k": "서로 다른 시기에"}, {"e": "and that the rate of <b>annual<\/b> change varies", "k": "그리고 연간 변화의 속도가 다르다는 것은"}, {"e": "among various cells, <b>tissues<\/b>, and <b>organs<\/b>,", "k": "다양한 세포, 조직, 그리고 기관 사이에서,"}, {"e": "as well as from person to person.", "k": "사람마다 (다를) 뿐만 아니라."}], "link": "노화 변화는 서로 다른 시기에 신체의 서로 다른 부위에서 시작되고, 연간 변화의 속도는 사람마다 다를 뿐만 아니라 다양한 세포, 조직, 그리고 기관 사이에서도 다를 가능성이 높다.", "easy": "몸의 부위마다 늙기 시작하는 때가 다르고, 해마다 늙는 속도도 사람마다, 또 세포·조직·기관마다 다를 가능성이 높아요.", "gist": "노화 속도가 다른 구체적인 모습이에요."}, {"n": 4, "ch": [{"e": "Unlike the passage of time,", "k": "시간의 흐름과 달리,"}, {"e": "biological aging <b>resists<\/b> easy measurement.", "k": "생물학적 노화는 쉬운 측정을 거부한다."}], "easy": "시간은 쉽게 잴 수 있지만, 몸이 늙는 정도는 쉽게 잴 수 없어요.", "gist": "문제 제기 — 생물학적 노화는 측정이  off)를 모두 갖춘 <b>완전한 문장<\/b>입니다", "관계대명사 which 뒤에는 주어나 목적어가 빠진 <b>불완전한 문장<\/b>이 와야 하므로 which는 쓸 수 없습니다", "이 자리는 앞의 추상명사 <b>strong guarantees<\/b>의 내용을 풀어 주는 <b>동격의 접속사 that<\/b>이 와야 합니다."], "ch": [{"n": "①", "t": "is", "g": "~이다 (단수 동사)", "ok": false, "e": ["주어는 such commonality of interests이고, 핵심 명사는 commonality(공통성, 단수)입니다", "of interests는 꾸며 주는 말일 뿐이므로 단수 동사 is가 맞습니다."]}, {"n": "②", "t": "it", "g": "그것 (단수 대명사)", "ok": false, "e": ["not to chase의 주체는 a predator(포식자)이고, 쫓는 대상은 a prey(먹잇감, 단수)입니다", "주체와 대상이 다르므로 재귀대명사가 아닌 단수 대명사 it이 맞습니다."]}, {"n": "③", "t": "which", "g": "~하는 (관계대명사)", "ok": true, "e": ["뒤에 주어·동사·보어를 다 갖춘 완전한 문장이 오므로 관계대명사 which는 쓸 수 없습니다", "추상명사 strong guarantees의 내용을 설명하는 동격의 접속사 that으로 고쳐야 합니다."]}, {"n": "④", "t": "honest", "g": "정직한 (형용사)", "ok": false, "e": ["keep + 목적어 + 형용사(~을 …한 상태로 유지하다)가 수동태가 되면 be kept + 형용사가 됩니다", "보어 자리이므로 형용사 honest가 맞습니다."]}, {"n": "⑤", "t": "communicated", "g": "전달된 (과거분사)", "ok": false, "e": ["꾸밈을 받는 명사 information은 '전달되는' 대상입니다", "그래서 과거분사 communicated가 맞습니다."]}], "tr": ["남이 전달하는 것을 무엇이든 받아들이는 것은 그들의 이해관계가 우리의 이해관계와 일치할 때에만 이득이 되는데, 몸속의 세포나 벌집 속의 벌을 생각해 보라.", "인간들 사이의 의사소통에 관한 한, 이해관계의 그러한 공통성은 좀처럼 이루어지지 않는다. 임신한 어머니조차 태아가 보내는 화학적 신호를 불신할 이유가 있다.", "다행히, 가장 적대적인 관계에서조차 의사소통이 이루어지게 만드는 방법들이 있다.", "먹잇감은 포식자에게 자신을 쫓지 말라고 설득할 수 있다.", "하지만 그러한 의사소통이 일어나려면, 신호를 받는 쪽이 그것을 믿는 편이 더 낫다는 강력한 보장이 있어야 한다.", "메시지는 대체로 정직하게 유지되어야 한다.", "인간의 경우, 정직성은 전달된 정보를 평가하는 일련의 인지 기제에 의해 유지된다.", "이 기제들은 우리가 유익한 메시지 대부분을 받아들이면서 — 열려 있으면서 — 해로운 메시지 대부분은 거부하게 — 경계하게 — 해 준다."], "ps": [{"n": 1, "ch": [{"e": "Accepting whatever others are communicating", "k": "다른 사람들이 전달하는 것을 무엇이든 받아들이는 것은"}, {"e": "only <b>pays off<\/b>", "k": "오직 이득이 된다"}, {"e": "if their interests <b>correspond to<\/b> ours", "k": "그들의 이해관계가 우리의 것과 <span class=\"r\">(= 우리의 이해관계)<\/span> 일치할 때에만"}, {"e": "— think cells in a body, bees in a beehive.", "k": "— 몸속의 세포나 벌집 속의 벌을 생각해 보라."}], "link": "다른 사람들이 전달하는 것을 무엇이든 받아들이는 것은 그들의 이해관계가 우리의 이해관계와 일치할 때에만 이득이 되는데, 몸속의 세포나 벌집 속의 벌을 function dec(s){var b=atob(s.split("").reverse().join(""));var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder("utf-8").decode(u);}
var ANS=dec(ENC).split(";").map(function(x){return x.split("|").map(function(c){return CIRC.indexOf(c)+1;});});
function isRight(i,a){return ANS[i].indexOf(a)>=0;}
function ansText(i){return ANS[i].map(function(n){return CIRC[n-1];}).join(", ");}

function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{

    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });

}

/ 노화 변화가 \u0001\u0001신체의\u0002 서로 다른 부위에서\u0002 \u0001서로 다른 시기에\u0002 시작되고 / 연간 변화 속도가 \u0001여러 세포, 조직, 기관마다\u0002 달라진다는 것은, / 사람마다 다른 것은 물론이고.", "core": "노화 변화가 시작되고 속도가 달라질 가능성이 높다, 사람마다 달라지는 것은 물론이고.", "tags": ["<b>가주어 It</b>: 해석하지 않고 뒤의 that절(진짜 주어)을 기다림. be likely that = ~할 가능성이 높다", "<b>진주어 that절 ①</b>: 신체 부위·시기에 따라 노화 변화가 시작됨", "<b>and that</b> = 진주어 ②: 앞의 that절과 나란히 It에 걸림. varies는 동사", "<b>as well as</b>: A as well as B = B는 물론 A도 (강조는 앞쪽). from person to person = 사람마다"]}, {"i": "06", "q": "05", "s": "1", "title": "동명사 주어 + 복합관계대명사 whatever + 조건의 if절", "eng": "Accepting whatever<sup>1</sup> others are communicating / only pays off<sup>2</sup> / if their interests correspond to<sup>3</sup> ours / — think cells in a body, bees in a beehive.", "notes": [["1", "whatever", "~하는 것은 무엇이든"], ["2", "pay off", "이득이 되다"], ["3", "correspond to", "~와 일치하다"]], "lit": "다른 사람들이 전달하는 것이 무엇이든 받아들이는 일은 / 이득이 될 뿐이다 / 그들의 이해관계가 우리의 것과 일치할 때만 / — 몸속의 세포들, 벌집 속의 벌들을 생각해 보라.", "nat": "남이 전달하는 것을 무엇이든 받아들이는 태도는 상대의 이해관계가 우리 것과 맞아떨어질 때에만 이득이 된다. 한 몸속의 세포들이나 한 벌집 속의 벌들을 생각해 보면 된다.", "ana": "주어가 <b>Accepting</b>으로 시작하는 <b>동명사 주어</b>이고, 그 목적어가 <b>whatever others are communicating</b>이라는 <b>복합관계대명사절</b>이다. whatever는 '무엇이든 ~하는 것'이라는 뜻으로 <b>선행사를 안에 품은</b> 관계사라 앞에 명사가 없어도 된다. 주어가 여기까지이므로 동사는 그 뒤의 <b>pays off</b>이고, 동명사 주어는 <b>단수 취급</b>이라 pay가 아니라 <b>pays</b>가 맞다. 이 <b>-s</b> 하나가 어법 문항의 단골 정답 자리다. <b>only</b>는 뒤의 <b>if절</b>에 걸려 '<b>~할 때에만</b>'이라는 조건 한정을 만든다. <b>pay off</b>는 '이득이 되다, 성과를 내다', <b>correspond to</b>는 '~와 일치하다'라는 뜻이다.", "pe": "Accepting whatever<sup>1</sup> others are communicating / only pays off<sup>2</sup> / \u0001if their interests correspond to<sup>3</sup> ours\u0002 / — think cells in a body, bees in a beehive.", "pk": "다른 사람들이 전달하는 것이 무엇이든 받아들이는 일은 / 이득이 될 뿐이다 / \u0001그들의 이해관계가 우리의 것과 일치할 때만\u0002 / — 몸속의 세포들, 벌집 속의 벌들을 생각해 보라.", "core": "남이 전달하는 것을 무엇이든 받아들이는 일은 이득이 될 뿐이다.", "tags": ["<b>동명사 주어</b> Accepting + 목적어 <b>whatever절</b> (무엇이든 ~하는 것, 선행사 포함)", "동사 <b>pays off</b> (동명사 주어라 단수 -s) = 이득이 되다. only는 뒤 if절에 걸림", "<b>조건 if절</b>: only ~ if = ~일 때에만. correspond to = ~와 일치하다", "대시 뒤: 예시를 드는 명령문 (몸속의 세포들, 벌집 속의 벌들을 생각해 보라)"]}, {"i": "07", "q": "06", "s": "1", "title": "be confident that절 + A, not B 형태의 대조", "eng": "Most people are confident<sup>1</sup> / that creativity is an individual possession<sup>2</sup>, / not a collective<sup>3</sup> phenomenon.", "notes": [["1", "be confident that ~", "~을 확신하다"], ["2", "possession", "소유물"], ["3", "collective", "집단적인"]], "lit": "대부분의 사람들은 확신한다 / 창의성이 개인의 소유물이라고, / 집단적 현상이 아니라.", "nat": "대부분의 사람들은 창의성이 집단적 현상이 아니라 개인이 가진 것이라고 굳게 믿는다.", "ana": "<b>be confident that ~</b>은 '<b>~라고 확신하다</b>'라는 뜻으로, confident 뒤에 <b>완전한 문장(that절)</b>이 통째로 온다. 같은 자리에 <b>be sure/aware/afraid/convinced</b>도 쓸 수 있어 '<b>형용사 + that절</b>' 묶음으로 외워 두면 좋다. 이때 that은 생략도 가능하다. 뒤쪽의 <b>an individual possession, not a collective phenomenon</b>은 <b>A, not B</b> 형태로 '<b>B가 아니라 A</b>'라는 뜻이며, <b>not B but A</b>를 앞뒤만 바꿔 놓은 것이다. 이렇게 콤마 뒤에 not이 툭 붙는 형태에서는 <b>강조되는 쪽이 앞</b>이라는 점을 기억하자. 글 전체가 이 통념을 뒤집는 구조이므로, 이 문장이 <b>필자의 주장이 아니라 반박 대상</b>이라는 점도 함께 잡아 두어야 한다.", "pe": "Most people are confident<sup>1</sup> / that creativity is an individual possession<sup>2</sup>, / not a collective<sup>3</sup> phenomenon.", "pk": "대부분의 사람들은 확신한다 / 창의성이 개인의 소유물이라고, / 집단적 현상이 아니라.", "core": "대부분의 사람들은 창의성이 개인의 소유물이라고 확신한다, 집단적 현상이 아니라.", "tags": ["주어 + 동사 are + 보어 confident. <b>be confident that</b> = ~라고 확신하다", "<b>that절</b>: 확신하는 내용. creativity is an individual possession", "<b>A, not B</b> = B가 아니라 A (강조는 앞쪽). 필자가 반박할 통념"]}, {"i": "08", "q": "06", "s": "5", "title": "조동사 두 개의 병렬(would and could) + 부정어 little + 동격 콤마", "eng": "But I suspect<sup>1</sup> / that as individuals, / we would and could accomplish little<sup>2</sup> in the way of<sup>3</sup> creative thinking / outside the context of the super-brain, / the integration of individual brains.", "notes": [["1", "suspect", "짐작하다, 의심하다"], ["2", "little", "거의 없는 것"], ["3", "in the way of", "~라는 면에서"]], "lit": "그러나 나는 짐작한다 / 개인으로서는, / 우리가 창의적 사고라는 면에서 이룰 수 있는 것이 거의 없으리라고 / 초두뇌라는 맥락 밖에서는, / 즉 개별 두뇌들의 통합이라는 (맥락 밖에서는).", "nat": "그러나 나는 개별 두뇌들이 통합된 '초두뇌'라는 맥락을 벗어나면, 개인으로서 우리가 창의적 사고에서 이룰 수 있는 것은 거의 없으리라고 짐작한다.", "ana": "<b>would and could accomplish</b>는 조동사 <b>두 개가 하나의 동사원형을 공유</b>하는 형태다. 즉 <b>would accomplish and could accomplish</b>에서 뒤의 accomplish가 생략된 것이며, and 뒤에 동사원형이 안 보인다고 당황할 필요가 없다. 목적어 <b>little</b>은 '작은'이 아니라 '<b>거의 없는 것</b>'이라는 <b>부정</b>의 의미다. a가 붙은 <b>a little</b>은 '조금은 있다'는 긍정이므로 <b>a의 유무로 뜻이 정반대</b>가 된다는 점을 반드시 기억하자. 문장 끝의 <b>the integration of individual brains</b>는 앞의 <b>the super-brain</b>을 다시 말해 주는 <b>동격</b>이다. <b>in the way of</b>는 '<b>~라는 면에서</b>'라는 뜻이다.", "pe": "But I suspect<sup>1</sup> / that \u0001as individuals\u0002, / we would and could accomplish little<sup>2</sup> \u0001in the way of<sup>3</sup> creative thinking\u0002 / \u0001outside the context \u0001of the super-brain\u0002\u0002, / \u0001the integration of individual brains\u0002.", "pk": "그러나 나는 짐작한다 / \u0001개인으로서는\u0002, / 우리가 \u0001창의적 사고라는 면에서\u0002 이룰 수 있는 것이 거의 없으리라고 / \u0001초두뇌라는 맥락 밖에서는\u0002, / \u0001즉 개별 두뇌들의 통합이라는\u0002 (맥락 밖에서는).", "core": "그러나 나는 우리가 거의 아무것도 이룰 수 없으리라고 짐작한다.", "tags": ["주어 I + 동사 suspect + 목적어절. 짐작하는 내용이 뒤에 옴", "that절 앞머리의 삽입 부사구: as individuals (개인으로서)", "주어 we + <b>would and could</b> accomplish: 조동사 둘이 동사원형 하나를 공유. <b>little</b> = 거의 없는 것 (a little 아님)", "부사구: 초두뇌의 맥락 밖에서는 (조건의 뜻)", "<b>동격</b>: the super-brain을 다시 말함 (즉, 개별 두뇌들의 통합)"]}], "qs": [{"q": "01", "type": "글의 목적", "src": "2023년 10월 18번", "ans": "②", "tr": [["1", "이 공지가 귀하께 건강과 좋은 기분 속에서 닿기를 바랍니다."], ["2", "10월 9일에 Rosehill Apartment Complex로, 그중에서도 귀하의 집 앞으로 주소가 적힌 소포 한 개가 배달되었음을 알려 드리고자 글을 씁니다."], ["3", "그러나 여러 차례 소포를 전달하려 시도했음에도, 그 소포는 오랜 기간 저희 프런트 데스크에 찾아가지 않은 채로 남아 있습니다."], ["4", "관리 사무소로서, 배달된 모든 물품을 안전하게 보관하고 그것을 알맞은 입주민에게 신속히 전달하도록 돕는 것이 저희의 책임입니다."], ["5", "따라서 저희 업무 시간 중에 관리 사무소를 방문하셔서 소포를 찾아가 주시기를 정중히 요청드립니다."], ["6", "이 사안에 대한 귀하의 협조에 진심으로 감사드립니다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Therefore, we kindly request that you visit the management office during our office hours to claim your package."}, {"en": false, "h": "목적 문항은 <b>Therefore·So·Please</b> 같은 신호어 뒤의 <b>요청 문장</b>이 곧 정답이다. 이 글은 1번에서 인사, 2번에서 소포가 배달되었다는 사실, 3번에서 <b>아직 찾아가지 않았다(unclaimed)</b>는 문제 상황을 차례로 깔아 놓은 뒤, 5번에서 <b>visit the management office ... to claim your package</b>라고 못 박는다. 즉 글 전체가 '<b>당신 소포가 여기 있으니 와서 가져가라</b>' 한 문장으로 수렴한다. 주의할 것은 3번의 <b>despite multiple attempts to deliver</b>다. '배달을 여러 번 시도했다'는 말 때문에 <b>배달 사고·도난</b> 쪽으로 끌려가기 쉬운데, 이는 <b>왜 아직 프런트에 있는지</b>를 설명하는 배경일 뿐이다."}], "opts": [{"n": "①", "t": "관리 사무실 공사 일정을 알리려고", "a": false, "x": true, "trap": false, "e": "공사(construction·repair)에 관한 언급이 전혀 없다. management office는 <b>글을 쓰는 주체</b>로 등장할 뿐이다."}, {"n": "②", "t": "배달된 물품을 찾아갈 것을 요청하려고", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>we kindly request that you visit ... to claim your package</b>와 정확히 일치한다. 3번의 <b>unclaimed</b>(찾아가지 않은)가 이 요청의 이유다."}, {"n": "③", "t": "잘못 찾아간 물품의 반납을 부탁하려고", "a": false, "x": true, "trap": true, "e": "소포는 아직 <b>프런트 데스크에 그대로</b> 있다(remained unclaimed at our front desk). 누가 잘못 가져간 상황이 아니다."}, {"n": "④", "t": "배달 물품의 도난 방지 조치를 설명하려고", "a": false, "x": true, "trap": false, "e": "4번의 <b>safekeeping</b>(안전 보관)만 보고 고르기 쉽지만, 이는 관리 사무소의 <b>책임을 밝히는 근거</b>일 뿐 도난 방지 <b>조치를 설명</b>하는 부분이 아니다."}, {"n": "⑤", "t": "관리 사무실 운영 시간 변경을 공지하려고", "a": false, "x": true, "trap": false, "e": "<b>during our office hours</b>는 '업무 시간에 오시라'는 안내이지 <b>시간이 바뀌었다</b>는 공지가 아니다."}], "w": [["notice", "공지, 안내문"], ["inform A that ~", "A에게 ~을 알리다"], ["package", "소포, 택배"], ["specifically", "특히, 명확히"], ["address", "~ 앞으로 주소를 쓰다"], ["attempt", "시도"], ["unclaimed", "찾아가지 않은"], ["extended", "장기간의"], ["safekeeping", "안전 보관"], ["resident", "입주민, 거주자"], ["claim", "(자기 것을) 찾아가다"], ["cooperation", "협조, 협력"]]}, {"q": "02", "type": "밑줄 함축 의미", "src": "2019학년도 수능 21번", "ans": "①", "tr": [["1", "비록 명시된 목표는 아니지만, 최고의 과학은 사실상 무지를 정제하는 일로 볼 수 있다."], ["2", "과학자들은, 특히 젊은 과학자들은 결과에 너무 집착할 수 있다."], ["3", "사회도 이 미친 듯한 추구 속에서 그들을 부추긴다."], ["4", "큰 발견은 언론에 보도되고, 대학 홈페이지에 오르고, 연구비를 따는 데 도움이 되며, 승진을 정당화해 준다."], ["5", "그러나 그것은 잘못되었다."], ["6", "위대한 과학자들, 즉 우리가 존경하는 선구자들은 결과가 아니라 다음 질문에 관심을 둔다."], ["7", "매우 존경받는 물리학자 엔리코 페르미는 학생들에게, 가설을 성공적으로 입증하는 실험은 측정이고 그렇지 못한 실험이 발견이라고 말했다."], ["8", "발견이란 새로운 무지를 밝혀내는 일이다."], ["9", "과학적 성취의 정점인 노벨상은 평생에 걸친 과학적 업적이 아니라 단 하나의 발견, 곧 하나의 결과에 주어진다."], ["10", "노벨 위원회조차 이것이 사실 과학 정신에 온전히 부합하지는 않는다는 것을 어느 정도 알고 있어서, 수상 사유서는 흔히 그 발견이 “한 분야를 열어젖혔다”, “한 분야를 변모시켰다”, 혹은 “한 분야를 새롭고 예상치 못한 방향으로 이끌었다”는 이유로 그것을 기린다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "The highly respected physicist Enrico Fermi told his students that an experiment that successfully proves a hypothesis is a measurement; one that doesn't is a discovery."}, {"en": false, "h": "밑줄 <b>refining ignorance</b>를 글자 그대로 '무지를 정제하다'로만 읽으면 답이 안 나온다. 이 글은 밑줄의 뜻을 <b>7·8번 문장에서 직접 정의</b>해 준다. 가설을 <b>성공적으로 입증한</b> 실험은 이미 아는 것을 확인한 <b>측정</b>일 뿐이고, 입증에 <b>실패한</b> 실험이야말로 <b>발견</b>이며, 그 발견이란 <b>an uncovering — of new ignorance</b>, 즉 '<b>새로운 무지를 드러내는 일</b>'이라는 것이다. 6번의 <b>not concerned with results but with the next questions</b>도 같은 말이다. 정리하면 <b>이미 아는 것 너머로 나아가 아직 모르는 영역을 드러내는 것</b>이 되므로, <b>looking beyond what is known towards what is left unknown</b>이 그대로 답이 된다."}], "opts": [{"n": "①", "t": "알려진 것 너머를 바라보며 알려지지 않은 채 남은 것으로 나아가는 것", "a": true, "x": false, "trap": false, "e": "7·8번의 <b>a discovery, an uncovering — of new ignorance</b>와 6번의 <b>the next questions</b>를 한 문장으로 압축한 진술이다. <b>known → unknown</b>의 방향이 정확히 일치한다."}, {"n": "②", "t": "발견된 것에 대해 궁극적인 설명을 제시하는 것", "a": false, "x": true, "trap": false, "e": "<b>ultimate account</b>(최종적 설명)는 이 글이 <b>비판하는</b> 태도다. 글은 결론을 확정하는 일이 아니라 <b>새 질문을 여는</b> 일을 최고의 과학이라고 한다."}, {"n": "③", "t": "객관적인 사고방식으로 기존 지식을 분석하는 것", "a": false, "x": true, "trap": true, "e": "<b>existing knowledge</b>를 분석하는 것은 7번에서 말한 <b>measurement</b> 쪽에 가깝다. 글은 그것을 발견과 <b>구별</b>한다."}, {"n": "④", "t": "과학자들이 중요한 발견을 널리 알리도록 고무하는 것", "a": false, "x": true, "trap": false, "e": "4번의 언론 보도·홈페이지·연구비·승진은 <b>사회가 부추기는 잘못된 방향</b>으로 제시되고 5번에서 <b>But it's wrong</b>이라고 곧바로 부정된다."}, {"n": "⑤", "t": "학생들에게 새로운 과학 분야를 알려 주는 것", "a": false, "x": true, "trap": false, "e": "페르미가 학생들에게 말했다는 것은 <b>예시의 장치</b>일 뿐이며, 글의 초점은 교육이 아니라 <b>과학의 본질</b>이다."}], "w": [["explicit", "명시적인, 분명한"], ["refine", "정제하다, 다듬다"], ["ignorance", "무지"], ["obsessed with", "~에 집착하는"], ["make the case for", "~의 근거를 만들다"], ["pioneer", "선구자"], ["hypothesis", "가설"], ["measurement", "측정(값)"], ["uncovering", "밝혀냄, 드러냄"], ["pinnacle", "정점"], ["citation", "(수상) 사유서"], ["transform", "변모시키다"]]}, {"q": "03", "type": "글의 주제", "src": "2021년 3월 23번", "ans": "④", "tr": [["1", "아무리 훈련이 잘되어 있어도 배우는 공연 중의 짧은 순간일지언정 자기 배역이 속으로 느끼는 삶을 필연적으로 겪게 된다."], ["2", "자기 인식은 공연이 진행되는 동안, 그리고 긴 공연 시즌 동안에는 더욱더 달라진다."], ["3", "많은 배우들에게 있어 그들은 자기 배역에 대해 더 큰 공감과 사회적 인지를 경험하는데, 이것이 정체성 경계의 흐려짐을 심화시킬 수 있다."], ["4", "또한 배우들은 더 많은 분리적 과정을 사용하는 경향이 있는데, 이것이 배역 경계가 흐려질 가능성을 높인다."], ["5", "배우들은 또한 과거의 트라우마와 상실 경험에 대해 해소되지 않은 애도를 더 많이 겪는데, 배역을 연기할 때 그런 경험에서 계속 끌어다 쓰기 때문이다."], ["6", "창작 작업과 하나가 되려는 이런 경향에 더해, 관객들 또한 배역의 인격을 배우의 인격과 혼동한다."], ["7", "관객의 귀인 오류는 배우의 괴로움을 키울 수 있는데, 여기에는 자기 인격의 정체성이 안정적이지 않다는 두려움도 포함된다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "For many actors, they experience greater empathy and social cognition for their character, which may intensify identity boundary blurring."}, {"en": false, "h": "주제 문항의 핵심어는 반복되는 표현에서 찾는다. 이 글에는 <b>boundary blurring</b>(경계 흐려짐)이 3·4번에서 두 번, <b>confuse the character's personality with the actor's personality</b>(6번), <b>personality identity is not stable</b>(7번)이 이어진다. 전부 <b>배우와 배역의 정체성이 뒤섞인다</b>는 한 가지 이야기다. 게다가 그 혼동은 <b>배우 쪽</b>(1~5번)에서만 일어나는 것이 아니라 <b>관객 쪽</b>(6번)에서도 일어난다고 확장된다. 그래서 주제는 '<b>배우와 배역 사이의 정체성 혼동</b>'이 된다. 1번의 <b>Despite excellent training</b>은 '훈련으로도 막을 수 없다'는 뜻이라 주제를 오히려 강화한다."}], "opts": [{"n": "①", "t": "배우의 연기를 평가하는 기준", "a": false, "x": true, "trap": false, "e": "평가 기준(criteria)에 해당하는 내용이 한 줄도 없다. 글은 <b>배우 내면에서 일어나는 현상</b>을 설명한다."}, {"n": "②", "t": "복잡한 인물을 연기하는 데서 오는 어려움", "a": false, "x": true, "trap": true, "e": "'복잡한 인물'이라는 조건이 글에 없다. 글이 말하는 어려움은 배역의 복잡성 때문이 아니라 <b>자기와 배역의 경계가 흐려지기</b> 때문이다."}, {"n": "③", "t": "연극을 감상하기 위한 배경지식", "a": false, "x": true, "trap": false, "e": "관객이 등장하지만(6·7번) 그것은 <b>감상법</b>이 아니라 <b>관객도 혼동한다</b>는 사실을 보태기 위한 것이다."}, {"n": "④", "t": "배우와 배역 사이의 정체성 혼동", "a": true, "x": false, "trap": false, "e": "3·4번의 <b>identity/character boundary blurring</b>, 6번의 <b>confuse the character's personality with the actor's personality</b>, 7번의 <b>personality identity is not stable</b>이 모두 이 한 문장으로 모인다."}, {"n": "⑤", "t": "배우와 관객 사이의 심리적 장벽", "a": false, "x": true, "trap": false, "e": "관객은 배우와 <b>벽을 쌓는</b> 것이 아니라 오히려 배역과 배우를 <b>구분하지 못한다</b>. 방향이 정반대다."}], "w": [["inevitably", "필연적으로"], ["visceral", "마음속에서 느끼는"], ["self-perception", "자기 인식"], ["empathy", "공감"], ["intensify", "심화시키다"], ["boundary blurring", "경계 흐려짐"], ["dissociative", "분리적인"], ["unresolved", "해소되지 않은"], ["mourning", "애도, 슬픔"], ["portray", "연기하다, 묘사하다"], ["attribution", "(원인) 귀속, 귀인"], ["distress", "괴로움, 고통"]]}, {"q": "04", "type": "글의 제목", "src": "2016학년도 수능 23번", "ans": "①", "tr": [["1", "누군가가 자기 나이에 비해 “젊어 보인다”고 우리가 놀라며 말할 때, 우리는 우리 모두가 서로 다른 속도로 생물학적으로 늙어 간다는 사실을 관찰하고 있는 것이다."], ["2", "과학자들은 이 겉으로 드러나는 차이가 실재한다는 좋은 증거를 가지고 있다."], ["3", "노화 변화는 신체 부위마다 시작 시기가 다르고, 연간 변화 속도도 사람마다 다를 뿐 아니라 세포·조직·기관마다 다를 가능성이 높다."], ["4", "시간의 흐름과 달리, 생물학적 노화는 손쉬운 측정을 허락하지 않는다."], ["5", "우리가 갖고 싶은 것은, 시간의 흐름과 무관하게 다른 모든 생물학적 노화 변화를 그대로 비춰 주는 한두 가지의 측정 가능한 생물학적 변화이다. 그러면 예컨대 역법상 여든 살인 사람이 생물학적으로는 예순 살이라고 말할 수 있을 것이다."], ["6", "이런 종류의 측정은, 한 여든 살이 다른 여든 살보다 왜 훨씬 더 젊은 특성을 많이 지니는지를 설명하는 데 도움이 될 것이다. 그 다른 여든 살은 생물학적으로 여든이거나 심지어 아흔일 수도 있다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "What we would like to have is one or a few measurable biological changes that mirror all other biological age changes without reference to the passage of time."}, {"en": false, "h": "제목 문항은 <b>글이 무엇을 찾고 있는지</b>를 잡아야 한다. 1~3번은 사람마다 <b>생물학적 노화 속도가 다르다</b>는 사실을, 4번은 그런데 그것이 <b>     h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  if(ch){ch.classList.toggle('open');return;}
  const st=e.target.closest('.stg');
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
