<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});

y a matter of <b>trial and error<\/b>", "k": "대체로 시행착오의 문제이다"}, {"e": "based on experience of the individual specialists involved.", "k": "관련된 개별 전문가들의 경험에 기반을 둔."}], "link": "따라서, 도입 프로그램은, 지금까지 대체로 관련된 개별 전문가들의 경험에 기반을 둔 시행착오의 문제이다.", "easy": "그래서 지금까지 천적 도입은 담당 전문가 각자의 경험에 기대어 이것저것 시도해 보는 수준이에요.", "gist": "결론 — 아직은 시행착오 단계예요."}]}, {"no": "04", "typ": "밑줄 함축 의미", "src": "2024학년도 9월 21번", "evn": [1, 4], "ev_en": "Gold plating in the project means needlessly enhancing the expected results, namely, adding characteristics that are costly, not required, and that have low added value with respect to the targets — in other words, giving more with no real justification other than to demonstrate one’s own talent. / There is therefore a strong temptation, in all good faith, to engage in gold plating, namely, to achieve more or higher-quality work that gratifies the professional but does not add value to the client’s requests, and at the same time removes valuable resources from the project.", "ev_ko": [[1, "프로젝트에서 금도금은 예상되는 결과를 불필요하게 향상하는 것, 즉 비용이 많이 들고 요구되지 않으며 목표에 관하여 낮은 부가 가치를 가지는 특성을 추가하는 것으로, 다시 말해 그 자신의 재능을 보여 주는 것 외에 실제 명분이 없는 더 많은 것을 주는 것을 의미한다."], [4, "그러므로 선의로 금도금에 참여하려는, 즉 전문가들을 만족시키지만 고객의 요청에 가치를 더하지 않고 동시에 프로젝트에서 가치 있는 자원을 없애는 더 많은 혹은 더 높은 품질의 성과를 달성하려는 강한 유혹이 있다."]], "why": ["(1)에서 금도금은 <b>비용이 많이 들고 요구되지 않으며 부가 가치가 낮은 것<\/b>을 덧붙이는 일입니다", "<b>no real justification other than to demonstrate one’s own talent<\/b>, 즉 <b>자기 재능을 보여 주는 것 말고는 실제 명분이 없다<\/b>고 합니다", "(4)에 따르면 금도금은 전문가를 만족시키지만(<b>gratifies the professional<\/b>) 고객의 요청에는 가치를 더하지 않습니다(<b>does not add value to the client’s requests<\/b>)", "게다가 프로젝트의 <b>귀중한 자원을 없앤다<\/b>고 합니다", "그래서 밑줄의 <b>The best<\/b>는 자기를 보여 주려고 결과를 필요 이상으로 끌어올리는 금도금을 가리킵니다", "정답은 '<b>자신을 증명하기 위해서만 작업 품질을 올리는 것은 바람직하지 않다<\/b>'인 ②입니다."], "ch": [{"n": "①", "t": "Pursuing perfection at work causes conflicts among team members.", "g": "직장에서 완벽을 추구하는 것은 팀원들 사이에 갈등을 유발한다.", "ok": false, "e": ["<b>팀원들 사이의 갈등(conflicts among team members)<\/b>은 tacularly<sup>1</sup> successful in many instances<sup>2</sup>, / with a number of pest problems permanently resolved<sup>3</sup> / by importation and successful establishment<sup>4</sup> of natural enemies.", "notes": [["1", "spectacularly", "멋지게, 극적으로"], ["2", "instance", "경우, 사례"], ["3", "resolve", "해결하다"], ["4", "establishment", "정착, 설립"]], "lit": "이것은 많은 경우에 극적으로 성공적이었다, / 수많은 해충 문제가 영구히 해결된 채로 / 천적의 도입과 성공적인 정착에 의해.", "nat": "이 방식은 많은 경우 대단히 성공적이어서, 수많은 해충 문제가 천적을 들여와 성공적으로 정착시킴으로써 영구히 해결되었다.", "ana": "<b>with + 목적어 + 분사</b>는 '<b>~가 …한 채로</b>'를 뜻하는 <b>부대상황 구문</b>이다. 여기서 목적어는 <b>a number of pest problems</b>이고 그 뒤에 <b>resolved</b>라는 <b>과거분사</b>가 왔다. 분사의 형태를 고르는 기준은 딱 하나, <b>목적어와의 관계</b>다. 해충 문제는 스스로 해결하는 것이 아니라 <b>해결되는</b> 쪽이므로 <b>수동의 과거분사</b>가 온다. 만약 <b>resolving</b>이었다면 해충 문제가 무언가를 해결한다는 뜻이 되어 말이 안 된다. 어법 문제에서 <b>with + O + 분사</b>가 나오면 <b>O와 분사 사이에 be동사를 넣어 보는 것</b>이 가장 빠른 판별법이다. <b>a number of</b>는 '<b>많은</b>'이고 <b>the number of</b>는 '<b>~의 수</b>'이므로 구별해서 외워야 한다.", "pe": "This has been \u0001spectacularly<sup>1</sup>\u0002 successful \u0001in many instances<sup>2</sup>\u0002, / \u0001with a number of pest problems permanently resolved<sup>3</sup>\u0002 / \u0001by importation and successful establishment<sup>4</sup> \u0001of natural enemies\u0002\u0002.", "pk": "이것은 \u0001많은 경우에\u0002 \u0001극적으로\u0002 성공적이었다, / \u0001수많은 해충 문제가 영구히 해결된 채로\u0002 / \u0001천적의 도입과 성공적인 정착에 의해\u0002.", "core": "이것은 성공적이었다.", "tags": ["주어 This, 동사 has been, 보어 successful(SVC). spectacularly = 부사: successful 꾸밈. in many instances = 전치사구(부사구): successful 꾸밈", "with ~ resolved = <b>with 분사구문</b>(부사적: 부대상황): 앞 절 전체 꾸밈. permanently = 부사: resolved 꾸밈", "by importation ~ = 전치사구(부사구): resolved 꾸밈 (행위자). of natural enemies = 전치사구(형용사구): importation·establishment 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b> 뒤에 <b>with + 명사 + 과거분사</b> 구문이 붙은 문장이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: This (이것. 앞 문맥에서 나온 방법을 가리킴)", "V: has been (be ~이다의 현재완료)", "C: successful (성공적인)", "뼈대 = <b>This has been suc to test and enrich<sup>3</sup> their skill sets<sup>4</sup>\u0002.", "pk": "\u0001이러한 환경에서\u0002 / 전문가들은 프로젝트를 \u0001하나의 기회로\u0002 여기는 일이 많다 / \u0001자기 기량을 시험하고 넓힐\u0002 (기회로).", "core": "전문가들은 프로젝트를 (기회로) 여긴다.", "tags": ["In these environments = 전치사구(부사구): see를 꾸밈 (장소·상황)", "주어 specialists, 동사 see, 목적어 the project. often = 부사: see 꾸밈. as an opportunity = 전치사구(부사구): see 꾸밈, <b>거의 필수에 가까운 부사구</b> [기준: 모양 규칙]", "to test and enrich ~ = to부정사(형용사적): opportunity를 꾸밈. test and enrich는 to 하나에 동사 2개 병렬"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. see A as B 구조와 뒤의 to부정사 때문에 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: specialists (전문가들)", "V: see (see A as B A를 B로 여기다)", "O: the project (프로젝트)", "often = 부사 (자주). see를 꾸민다", "뼈대 = <b>specialists see the project</b>"]}, {"t": "<b>In these environments</b>는 전치사구(부사구)이다. 문장 전체를 꾸민다 (이러한 환경에서). environment (환경)."}, {"t": "<b>as an opportunity</b>는 전치사구(부사구)이다. see를 꾸민다 (기회로). see A as B의 as B는 거의 필수에 가까워 같이 본다 (문형 기준). opportunity (기회)."}, {"t": "<b>to test and enrich their skill sets</b>는 <b>to부정사 형용사적 용법</b>이다. opportunity를 꾸민다 (자기 기량을 시험하고 넓힐 기회).", "sub": ["test (시험하다)와 enrich (풍부하게 하다, 넓히다)가 to 하나에 병렬", "their skill sets (그들의 기량, 역량 모음). their = specialists"]}, {"t": "함정: to test and enrich는 to가 하나이고 동사 두 개가 병렬된 것이다."}], "sum": "전문가들은 프로젝트를 기량을 시험하고 넓힐 기회로 여김"}, {"i": "06", "q": "05", "s": "2", "title": "동사 3개 병렬 + 과거분사·현재분사 후치수식", "eng": "These thieving<sup>1</sup> bees sneak into the nest of an unsuspecting<sup>2</sup> \"normal\" bee (known as the host<sup>3</sup>), / lay an egg near the pollen mass / being gathered by the host bee for her own offspring<sup>4</sup>, / and then sneak back out.", "notes": [["1", "thieving", "도둑질하는"], ["2", "unsuspecting", "낌새를 못 채는"], ["3", "host", "숙주"], ["4", "offspring", "새끼, 자손"]], "lit": "이 도둑질하는 벌들은 (숙주라고 알려진) 낌새를 못 채는 '보통' 벌의 둥지로 몰래 들어가서, / 꽃가루 덩어리 근처에 알을 하나 낳고, / 숙주 벌이 자기 새끼를 위해 모으고 있는 (그 꽃가루 덩어리), / 그러고는 몰래 다시 빠져나온다.", "nat": "이 도둑벌들은 낌새를 못 채는 '보통' 벌, 곧 숙주의 둥지에 몰래 들어가, 숙주 벌이 제 새끼를 위해 모으고 있는 꽃가루 덩어리 옆에 알을 하나 낳고는 몰래 빠져나온다.", "ana": "주어 하나에 동사가 <b>세 개</b>(<b>sneak into</b> / <b>lay</b> / <b>sneak back out</b>) 달린 <b>병렬 구조</b>다. 이런 문장에서는 <b>마지막 and 앞까지 콤마로 이어진다</b>는 규칙을 알고 있어야 두 번째 <b>lay</b>를 새 문장의 시작으로 오해하지 않는다. 더 중요한 것은 <b>being gathered</b>다. 앞에 이미 동사가 셋이나 있으므로 이것은 <b>또 하나의 동사가 아니라</b> <b>the pollen mass</b>를 뒤에서 꾸미는 <b>분사</b>다. 원래 <b>the pollen mass which is being gathered</b>에서 <b>which is</b>가 생략된 형태이며, 꽃가루는 <b>모으는</b> 것이 아니라 <b>모아지는</b> 것이므로 <b>진행 수동(being p.p.)</b>이 쓰였다. 명사 뒤에 <b>-ing</b>나 <b>p.p.</b>가 바로 붙으면 <b>관계대명사 + be동사가 생략된 자리</b>라고 보면 거의 맞다.", "pe": "These \u0001thieving<sup>1</sup>\u0002 bees sneak \u0001into the nest \u0001of an unsuspecting<sup>2</sup> \"normal\" bee (known as the host<sup>3</sup>)\u0002\u0002, / lay an egg \u0001near the pollen mass\u0002 / \u0001being gathered by the host bee for her own offspring<sup>4</sup>\u0002, / and \u0001then\u0002 sneak \u0001back out\u0002.", "pk": "이 \u0001도둑질하는\u0002 벌들은 \u0001(숙주라고 알려진) 낌새를 못 채는 '보통' 벌의 둥지로\u0002 몰래 들어가서, / \u0001꽃가루 덩어리 근처에\u0002 알을 하나 낳고, / \u0001숙주 벌이 자기 새끼를 위해 모으고 있는\u0002 (그 꽃가루 덩어리), / 그러고는 몰래 다시 빠져나온다.", "core": "이 벌들은 몰래 들어가서, 알을 낳고, 다시 빠져나온다.", "tags": ["주어 These bees(thieving = 형용사: bees 꾸밈), 동사 sneak. into the nest ~ = 전치사구(부사구): sneak 꾸밈, <b>거의 필수에 가까운 부사구</b> [기준: 모양 규칙]", "(동사 ② lay, 목적어 an egg). near the pollen mass = 전치사구(부사구): lay 꾸밈 (장소)", "being gathered ~ = 현재분사구(형용사적, 수동): the pollen mass 꾸밈. by the host bee = 행위자 전치사구", "<b>동사 3개 병렬</b> 중 ③ sneak. then = 부사: sneak 꾸밈. back out = 부사(구): sneak 꾸밈"], "steps": [{"t": "이 문장은 <b>같은 주어가 동사 세 개를 거느린</b> 문장이다. 중간에 분사구가 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: These thieving bees (이 도둑질하는 벌들. thieving 도둑질하는)", "V1: sneak (sneak 몰래 들어가다). into the nest 전치사구가 따라온다 (둥지로). 거의 필수에 가까워 같이 본다 (문형 기준)", "V2: lay (lay 낳다), O: an egg (알 하나)", "V3: (then) sneak back out (다시 몰래 빠져나오다)", "뼈대 = <b>bees sneak into the nest, lay an egg, and sneak back out</b>"]}, {"t": "<b>of an unsuspecting “normal” bee</b>는 nest를 꾸미는 전치사구(형용사구)이다 (낌새를 못 채는 \"보통\" 벌의). <b>known as the host</b>는 <b>과거분사구</b>이다. bee를 꾸민다 (숙주라고 알려진).", "sub": ["unsuspecting (의심하지 않는), host (숙주)"]}, {"t": "<b>near the pollen mass</b>는 전치사구(부사구)이다. lay를 꾸민다 (꽃가루 덩어리 근처에). pollen (꽃가루), mass (덩어리)."}, {"t": "<b>being gathered by the host bee for her own offspring</b>은 <b>현재분사구(형용사구, 수동)</b>이다. the pollen mass를 꾸민다 (숙주 벌이 자기 새끼를 위해 모으고 있는).", "sub": ["gather (모으다), offspring (새끼). her = the host bee"]}, {"t": "함정: lay는 lie의 과거형이 아니라 \"낳다\"의 현재형이다. 세 동사 sneak, lay, sneak이 모두 현재형으로 병렬된다. being gathered는 동사가 아니다."}], "sum": "도둑벌, 숙주 둥지에 몰래 들어가 알을 낳고 빠져나옴"}, {"i": "07", "q": "06", "s": "1", "title": "수동태 told + that절 + the 비교급, the 비교급", "eng": "We're all told at school / that white reflects<sup>1</sup> sunlight and black absorbs<sup>2</sup> it, / so the paler<sup>3</sup> your clothes are, / the cooler you'll be.", "notes": [["1", "reflect", "반사하다"], ["2", "absorb", "흡수하다"], ["3", "pale", "옅은, 창백한"]], "lit": "우리는 모두 학교에서 듣는다 / 흰색은 햇빛을 반사하고 검은색은 그것을 흡수한다고, / 그래서 당신의 옷이 더 옅을수록, / 당신은 더 시원해질 것이라고.", "nat": "흰색은 햇빛을 반사하고 검은색은 흡수하므로 옷이 옅을수록 더 시원하다고, 우리는 모두 학교에서 배운다.", "ana": "<b>We're all told that ~</b>은 <b>4형식의 수동태</b>다. 능동으로 되돌리면 <b>They tell us that ~</b>이 되는데, 간접목적어 <b>us</b>가 주어로 나가고 직접목적어인 <b>that절</b>은 그대로 남았다. 그래서 <b>told</b> 뒤에 목적어처럼 보이는 <b>that절</b>이 붙어 있어도 어법상 문제가 없다. 뒤쪽의 <b>the 비교급 ~, the 비교급 …</b>은 '<b>~할수록 더 …하다</b>'라는 짝 구문이다. 여기서 반드시 잡아야 할 것은 <b>어순</b>인데, 비교급이 <b>the</b>와 함께 <b>절의 맨 앞으로 끌려 나간다</b>는 점이다. 원래 <b>your clothes are paler</b>였던 것이 <b>the paler your clothes are</b>가 되었고, <b>you'll be cooler</b>가 <b>the cooler you'll be</b>가 되었다. 앞절이 <b>조건</b>, 뒷절이 <b>결과</b>라는 것도 함께 기억해 두자.", "pe": "We're \u0001all\u0002 told \u0001at school\u0002 / that white reflects<sup>1</sup> sunlight and black absorbs<sup>2</sup> it, / so the paler<sup>3</sup> your clothes are, / the cooler you'll be.", "pk": "우리는 \u0001모두\u0002 \u0001학교에서\u0002 듣는다 / 흰색은 햇빛을 반사하고 검은색은 그것을 흡수한다고, / 그래서 당신의 옷이 더 옅을수록, / 당신은 더 시원해질 것이라고.", "core": "우리는 흰색은 햇빛을 반사하고 검은색은 흡수하니 옷이 옅을수록 더 시원해진다고 듣는다.", "tags": ["주어 We, 동사 're told(수동태). all = 대명사 We를 꾸미는 수식어. at school = 전치사구(부사구): told 꾸밈", "that절 = told의 <b>목적어(명사절)</b>, 수동태 뒤에 남은 목적어. white reflects ~, black absorbs ~: 두 절 and 병렬", "so: 앞 내용에 이어지는 결과 연결. <b>the 비교급, the 비교급</b>의 앞 절 (옷이 옅을수록)", "the cooler you'll be = the 비교급의 뒤 절. 주어 you, 동사 will be, 보어 cooler (SVC)"], "steps": [{"t": "이 문장은 <b>수동태 S+V</b>이고 뒤에 that절이 붙은 문장이다. that절 뒤에는 \"the 비교급, the 비교급\"이 이어진다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: We (우리). all (모두)은 We를 꾸미는 말이다", "V: 're told (tell 말해 주다의 수동태. 듣다, 배우다)", "tell A B의 수동태라서 B 자리의 that절이 남아 있다. 이 that절은 뼈대에 둔다", "at school = 전치사구(부사구). told를 꾸민다 (학교에서)", "뼈대 = <b>We're told that ~</b>"]}, {"t": "that절 안은 두 절이 and로 병렬된다.", "sub": ["white reflects sunlight (흰색은 햇빛을 반사한다. reflect 반사하다)", "and black absorbs it (검은색은 그것을 흡수한다. absorb 흡수하다. it = sunlight)"]}, {"t": "that절 안에서 이어지는 <b>so the paler your clothes are, the cooler you'll be</b>는 <b>the 비교급, the 비교급</b> 구문이다. \"~할수록 더 ~하다\"이다. so는 \"그래서\"이다.", "sub": ["앞 부분: S: your clothes (당신의 옷), V: are, C: paler (더 옅은. pale 옅은의 비교급)", "뒤 부분: S: you, V: will be, C: cooler (더 시원한)"]}, {"t": "함정: 수동태인데도 told 뒤에 that절이 남는다. 또 the paler가 are보다 앞에 나온 것은 비교급 보어가 the와 함께 앞으로 나간 것이다."}], "sum": "흰색은 반사·검은색은 흡수, 그래서 옷이 옅을수록 더 시원하다고 배움"}, {"i": "08", "q": "06", "s": "7", "title": "Though 양보절 + 2형식 대조", "eng": "Though light clothes are better at reflecting the sun's heat, / dark clothes are better at radiating<sup>1</sup> the body's heat.", "notes": [["1", "radiate", "방출하다, 발산하다"]], "lit": "밝은 색 옷이 태양의 열을 반사하는 데 더 낫기는 하지만, / 어두운 색 옷은 몸의 열을 방출하는 데 더 낫다.", "nat": "밝은 색 옷이 태양열을 반사하는 데는 더 낫지만, 어두운 색 옷은 몸에서 나오는 열을 내보내는 데 더 낫다.", "ana": "<b>Though</b>는 '<b>~이지만</b>'이라는 <b>양보의 접속사</b>다. 양보절이 나오면 <b>진짜 하고 싶은 말은 뒤쪽 주절</b>에 있다는 신호이므로, 이 문장에서 필자가 강조하는 것은 <b>dark clothes</b> 쪽이다. 어휘 문제에서 이런 <b>대조 구조</b>는 정답의 결정적 단서가 된다. 형태 면에서는 <b>be better at + 동명사</b>가 앞뒤로 똑같이 반복된 <b>대칭 구조</b>다. <b>at</b>은 전치사이므로 뒤에는 반드시 <b>동명사</b>가 와야 하고 <b>to부정사</b>는 올 수 없다. 짝을 이루는 <b>reflect</b>(반사하다, 들어오는 열을 되튕김)와 <b>radiate</b>(방출하다, 안에서 밖으로 내보냄)는 <b>방향이 정반대</b>인 동사이므로 반드시 구별해서 외워야 한다.", "pe": "\u0001Though light clothes are better at reflecting the sun's heat\u0002, / dark clothes are better \u0001at radiating<sup>1</sup> the body's heat\u0002.", "pk": "\u0001밝은 색 옷이 태양의 열을 반사하는 데 더 낫기는 하지만\u0002, / 어두운 색 옷은 \u0001몸의 열을 방출하는 데\u0002 더 낫다.", "core": "어두운 색 옷이 더 낫다.", "tags": ["Though ~ = 부사절(양보): 주절 꾸밈. better at ~ing = ~하는 데 더 나은", "주어 dark clothes, 동사 are, 보어 better(SVC). at radiating ~ = 전치사구(부사구): better 꾸밈 (대조: 위 절의 reflecting과 짝)"], "steps": [{"t": "이 문장은 <b>Though 양보절 + S+V+C(2형식)</b>이다. 두 절의 구조가 거의 똑같은 대조 문장이다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: dark clothes (어두운 색 옷)", "V: are (be ~이다)", "C: better (더 나은)", "뼈대 = <b>dark clothes are better</b>"]}, {"t": "<b>at radiating the body's heat</b>는 전치사구(부사구)이다. better를 꾸민다 (몸의 열을 방출하는 데). better at은 \"~하는 데 더 낫다\"로 거의 필수에 가까워 같이 본다 (문형 기준).", "sub": ["at 뒤라서 radiating은 동명사. radiate (방출하다), the body's heat (몸의 열)"]}, {"t": "<b>Though light clothes are better at reflecting the sun's heat</b>는 <b>양보 부사절</b>이다. 주절을 꾸민다 (밝은 색 옷이 태양열을 반사하는 데 더 낫기는 하지만).", "sub": ["S: light clothes (밝은 색 옷), V: are, C: better", "at reflecting the sun's heat = 전치사구(부사구). better를 꾸민다 (태양의 열을 반사하는 데). reflect 반사하다"]}, {"t": "함정: reflecting과 radiating은 동사가 아니라 at 뒤의 동명사이다. 두 절은 reflecting vs radiating으로 짝을 이루는 대조이다."}], "sum": "밝은 옷은 태양열 반사에, 어두운 옷은 몸의 열 방출에 더 나음"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2020년 3월 18번", "ans": "④", "tr": [["1", "Watson City 교향악단은 캘리포니아 중부 해안 지역에 음악을 제공해 온 65주년을 기념하고 있습니다."], ["2", "본 교향악단은 35년간 재직한 Bob Smith 씨가 음악 감독 겸 상임 지휘자직에서 은퇴한다는 것을 발표했습니다."], ["3", "교향악단은 이 자리의 후임자를 적극적으로 찾고 있습니다."], ["4", "업무는 매년 4회 연주회의 곡을 선정하는 일과 매주 약 2시간씩 관현악단 예행연습을 지휘하는 일입니다."], ["5", "이 자리의 오디션을 볼 기회에 지원하기를 원하는 지원자는 watsonorchestra@wco.org로 이력서를 보내시기 바랍니다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "The orchestra is actively seeking a replacement for this position."}, {"en": false, "h": "글의 목적 문항은 <b>글이 상대에게 시키려는 행동</b>이 무엇인지만 잡으면 끝난다. 1번은 인사말이고, 2번은 <b>은퇴 사실</b>을 알리는 배경 설명이다. 진짜 용건은 3번의 <b>is actively seeking a replacement</b>, 즉 <b>후임자를 찾고 있다</b>는 문장이다. 그리고 4번에서 그 자리의 <b>업무</b>를 안내하고, 5번에서 <b>지원 방법(이력서 발송처)</b>까지 알려 준다. <b>업무 안내 + 지원 방법</b>이 나오면 그 글은 예외 없이 <b>모집·초빙 공고</b>다. 2번의 <b>retirement</b>만 보고 '은퇴 공연 홍보'로 가면 안 된다. 은퇴는 <b>자리가 비게 된 이유</b>일 뿐이고, 글이 요구하는 행동은 <b>그 자리에 지원하라</b>는 것이다."}], "opts": [{"n": "①", "t": "교향악단의 연주회 일정을 안내하려고", "a": false, "x": true, "trap": false, "e": "4번에 <b>4 concerts annually</b>가 나오지만 이는 <b>후임자가 맡을 업무</b>를 설명하는 것이지 관객에게 <b>일정을 안내</b>하는 것이 아니다. 구체적인 날짜나 장소가 전혀 없다는 점도 단서다."}, {"n": "②", "t": "상임 지휘자의 은퇴 공연을 홍보하려고", "a": false, "x": true, "trap": true, "e": "<b>retirement</b>는 2번에 분명히 나오지만 <b>은퇴 공연</b>은 지문 어디에도 없다. 은퇴는 자리가 비게 된 <b>배경</b>일 뿐이다."}, {"n": "③", "t": "교향악단에 대한 지원 확충을 촉구하려고", "a": false, "x": true, "trap": false, "e": "여기서 <b>applicants</b>는 '<b>지원(支援)</b>하는 후원자'가 아니라 '<b>지원(志願)하는 응모자</b>'다. 기부나 후원을 요청하는 표현은 한 군데도 없다."}, {"n": "④", "t": "음악 감독 겸 상임 지휘자 초빙을 공지하려고", "a": true, "x": false, "trap": false, "e": "3번의 <b>seeking a replacement for this position</b>, 4번의 <b>업무 안내</b>, 5번의 <b>이력서 발송처</b>가 모두 <b>초빙 공고</b>의 요소다. 여기서 position은 2번에 나온 <b>musical director and permanent conductor</b>를 가리킨다."}, {"n": "⑤", "t": "교향악단의 정기 연주회를 위한 장소를 섭외하려고", "a": false, "x": true, "trap": false, "e": "장소(<b>venue</b>)에 관한 언급이 전혀 없다. <b>the central coast of California</b>는 연주 장소를 구한다는 뜻이 아니라 <b>악단이 활동해 온 지역</b>이다."}], "w": [["celebrate", "기념하다"], ["announce", "발표하다"], ["retirement", "은퇴, 퇴직"], ["permanent conductor", "상임 지휘자"], ["actively", "적극적으로"], ["seek", "찾다, 구하다"], ["replacement", "후임자, 대체"], ["responsibility", "업무, 책임"], ["annually", "매년"], ["rehearse", "예행연습을 하다"], ["approximately", "대략, 약"], ["desirous of", "~을 원하는"], ["applicant", "지원자"], ["resume", "이력서"]]}, {"q": "02", "type": "내용 불일치", "src": "2014학년도 수능 B형 30번", "ans": "⑤", "tr": [["1", "Jean Baptiste Joseph Fourier는 프랑스의 수학자이자 물리학자였다."], ["2", "그가 여덟 살 때 아버지가 세상을 떠났고, 그 비극이 있은 지 일 년도 되지 않아 어머니마저 세상을 떠나 그는 고아가 되었다."], ["3", "한 자비로운 여인이 그가 지역의 군사 학교에 다닐 수 있도록 도와주었다."], ["4", "그는 장교가 되고 싶었지만 재단사의 아들이라는 이유로 허락되지 않았다."], ["5", "1795년에 그는 파리의 École Normale에서 교사가 되었다."], ["6", "혁명 이후의 광란기에 그는 단두대 사용에 반대하는 목소리를 냈고, 그 때문에 목숨을 잃을 뻔했다."], ["7", "1798년 Napoleon이 이집트를 침공했을 때, Fourier와 다른 학자들이 그 원정에 동행했다."], ["8", "프랑스로 돌아온 뒤 Fourier는 열전도에 관한 연구를 시작했다."], ["9", "열전도에 관한 그의 수학 이론은 그에게 지속적인 명성을 얻게 해 주었다."], ["10", "이집트에 머무는 동안 그는 이상한 병에 걸려 남은 일생 동안 난방이 잘 되는 방에만 갇혀 지내야 했다."], ["11", "1830년 5월 16일, Fourier는 파리에서 사망했다."]], "evh": "10번 문장", "ev": [{"en": true, "h": "During his stay in Egypt he contracted a strange illness that confined him to well-heated rooms for the rest of his life."}, {"en": false, "h": "내용 불일치 문항은 <b>시점·순서를 바꿔치기한 선지</b>가 정답인 경우가 압도적으로 많다. 10번 문장의 <b>During his stay in Egypt</b>는 '<b>이집트에 머무는 동안</b>'이므로, 병에 걸린 시점은 <b>이집트에 있을 때</b>다. 그런데 ⑤는 '<b>이집트에서 프랑스로 돌아온 후</b>'라고 시점을 한 칸 뒤로 밀어 놓았다. 프랑스로 돌아온 뒤에 한 일은 8번의 <b>began his research on heat conduction</b>, 즉 <b>연구 시작</b>이다. 이렇게 <b>8번의 시점</b>과 <b>10번의 사건</b>을 섞어 만든 것이 이 선지다. 지문을 <b>시간 순서대로 표시하며</b> 읽는 습관이 있으면 바로 잡힌다."}], "opts": [{"n": "①", "t": "프랑스의 수학자이자 물리학자였다.", "a": false, "x": true, "trap": false, "e": "1번의 <b>a French mathematician and physicist</b>와 그대로 일치한다."}, {"n": "②", "t": "재단사의 아들이라는 이유로 장교가 되지 못했다.", "a": false, "x": true, "trap": false, "e": "4번의 <b>was not allowed to because he was the son of a tailor</b>와 일치한다. <b>allowed to</b> 뒤에 <b>become an officer</b>가 생략된 것이다."}, {"n": "③", "t": "단두대 사용에 반대하다가 목숨을 잃을 뻔했다.", "a": false, "x": true, "trap": false, "e": "6번의 <b>spoke out against the use of the guillotine, for which he almost lost his life</b>와 일치한다. <b>almost lost</b>이므로 '<b>잃을 뻔했다</b>'가 맞다."}, {"n": "④", "t": "열전도에 관한 수학 이론으로 명성을 얻었다.", "a": false, "x": true, "trap": true, "e": "9번의 <b>His mathematical theory of heat conduction earned him lasting fame</b>과 일치한다. <b>earn A B</b>는 'A에게 B를 얻게 하다'이다."}, {"n": "⑤", "t": "이집트에서 프랑스로 돌아온 후 이상한 병에 걸렸다.", "a": true, "x": false, "trap": false, "e": "10번은 <b>During his stay in Egypt</b>, 즉 <b>이집트에 머무는 동안</b> 병에 걸렸다고 했다. 귀국 후에 한 일은 8번의 <b>열전도 연구 시작</b>이므로 시점이 어긋난다."}], "w": [["physicist", "물리학자"], ["pass away", "돌아가시다, 죽다"], ["orphan", "고아"], ["charitable", "자비로운"], ["officer", "장교"], ["tailor", "재단사"], ["frenzy", "광란"], ["speak out against", "~에 반대하는 목소리를 내다"], ["guillotine", "단두대"], ["invade", "침공하다"], ["accompany", "동행하다"], ["expedition", "원정(대)"], ["heat conduction", "열전도"], ["lasting", "지속적인"], ["contract", "(병에) 걸리다"], ["confine A to B", "A를 B에 가두다"]]}, {"q": "03", "type": "글의 주제", "src": "2019학년도 6월 22번", "ans": "⑤", "tr": [["1", "'생물적 방제'라는 용어는 때때로, 생물학적 유기체와 생물학에 기반을 둔 제품 전체를 아우르는 넓은 뜻으로 쓰여 왔다."], ["2", "이 방식은 많은 경우 대단히 성공적이어서, 수많은 해충 문제가 천적을 들여와 성공적으로 정착시킴으로써 영구히 해결되었다."], ["3", "그러나 이러한 도입의 성공은 대체로 특정한 유형의 생태계, 그리고/또는 다년생 생태계에 유입된 해충 같은 상황에 국한되어 왔다."], ["4", "반면에 이 접근법은 줄뿌림 작물이나 그 밖의 단명하는 체계의 주요 해충에 대해서는 제한적인 성공만 거두었다."], ["5", "이런 상황에서 문제는 효과적인 천적이 없다는 것이 아니라, 관리 관행, 그리고 특정 농업 생태계 환경에서 도입 시도의 성패를 결정하는 요인에 대한 공동 연구의 부재다."], ["6", "따라서 도입 프로그램은 지금까지 대체로, 관련된 개별 전문가의 경험에 기반을 둔 시행착오의 문제다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "In these situations, the problem is often not the lack of effective natural enemies but management practices and a lack of concerted research on factors that determine the success or failure of importation attempts in the specific agro-ecosystem setting."}, {"en": false, "h": "주제 문항은 <b>글 전체가 어디로 기울어져 있는지</b>를 봐야 한다. 2번의 <b>spectacularly successful</b>만 읽고 '<b>생물적 방제의 장점</b>'으로 가면 함정에 빠진다. 3번의 <b>have been limited largely to ~</b>(대체로 ~에 국한되어 왔다)와 4번의 <b>On the other hand ... limited success</b>에서 글이 <b>꺾인다</b>. 즉 성공은 <b>다년생 생태계</b>에서만 나왔고, <b>줄뿌림 작물처럼 수명이 짧은 체계</b>에서는 제한적이었다는 것이다. 5번은 그 <b>이유</b>를 <b>not A but B</b> 구조로 못 박는다. 천적이 없어서가 아니라 <b>관리 관행과 공동 연구의 부재</b> 때문이라는 것이다. 결국 이 글은 <b>왜 도입이 부분적으로만 성공했는가</b>를 설명하는 글이므로 ⑤가 정답이다."}], "opts": [{"n": "①", "t": "농업에서 주요 해충을 식별하는 것의 어려움", "a": false, "x": true, "trap": false, "e": "해충을 <b>식별(identify)</b>하는 문제는 지문에 없다. 글이 다루는 것은 <b>identification</b>이 아니라 <b>천적 도입의 성패</b>다."}, {"n": "②", "t": "생태계에 천적을 도입하는 것의 장점", "a": false, "x": true, "trap": true, "e": "2번만 보면 맞아 보이지만, 3~6번이 모두 <b>한계와 실패 요인</b>으로 채워져 있다. 장점은 <b>도입부</b>일 뿐 주제가 아니다."}, {"n": "③", "t": "농업에 생물적 방제 전략을 적용하는 방법", "a": false, "x": true, "trap": false, "e": "글은 <b>방법(how to)</b>을 알려 주지 않는다. 오히려 6번에서 <b>trial and error</b>, 즉 아직 <b>정해진 방법이 없다</b>고 말한다."}, {"n": "④", "t": "생물적 방제를 통한 해충 제거의 부작용", "a": false, "x": true, "trap": false, "e": "<b>side effects</b>(부작용)라는 개념 자체가 지문에 없다. 문제로 지적된 것은 부작용이 아니라 <b>성공의 제한성</b>이다."}, {"n": "⑤", "t": "생물적 방제에서 도입의 부분적 성공의 이유", "a": true, "x": false, "trap": false, "e": "3·4번의 <b>limited</b>가 '<b>부분적 성공</b>'에, 5번의 <b>not A but B</b>가 '<b>이유</b>'에 정확히 대응한다. 제목이 아니라 주제이므로 <b>이유</b>까지 담은 ⑤가 맞다."}], "w": [["biological control", "생물적 방제"], ["full spectrum", "전 범위"], ["spectacularly", "극적으로, 멋지게"], ["resolve", "해결하다"], ["importation", "도입, 수입"], ["establishment", "정착, 설립"], ["natural enemy", "천적"], ["perennial", "다년생의"], ["row crop", "줄뿌림 작물"], ["ephemeral", "단명하는"], ["management practice", "관리 관행"], ["concerted", "공동의, 합심의"], ["determine", "결정하다"], ["agro-ecosystem", "농업 생태계"], ["to date", "지금까지"], ["trial and error", "시행착오"]]}, {"q": "04", "type": "밑줄 함축 의미", "src": "2024학년도 9월 21번", "ans": "②", "tr": [["1", "프로젝트에서 '금도금'이란 기대되는 결과를 불필요하게 부풀리는 것, 즉 비용은 많이 들면서 요구되지도 않고 목표에 비추어 부가 가치도 낮은 특성을 덧붙이는 것을 말한다 — 다시 말해 자기 재능을 과시하는 것 말고는 아무런 명분 없이 더 많은 것을 주는 행위다."], ["2", "금도금은 프로젝트 팀원들에게 특히 흥미로운데, 전문성이 두드러지는 프로젝트, 다시 말해 입증된 경험과 폭넓은 전문적 자율성을 지닌 전문가가 참여하는 프로젝트에서 전형적으로 나타나기 때문이다."], ["3", "이런 환경에서 전문가들은 프로젝트를 자기 기량을 시험하고 넓히는 기회로 여기는 일이 많다."], ["4", "그래서 선의로, 금도금에 손대고 싶은 강한 유혹이 생긴다. 즉 전문가 자신은 만족시키지만 고객의 요구에 가치를 더하지는 못하면서 동시에 프로젝트의 귀중한 자원을 앗아 가는, 더 많거나 더 높은 품질의 작업을 해내려는 유혹이다."], ["5", "속담에도 있듯이, \"최고는 좋은 것의 적이다.\""]], "evh": "4번 문장", "ev": [{"en": true, "h": "There is therefore a strong temptation, in all good faith, to engage in gold plating, namely, to achieve more or higher-quality work that gratifies the professional but does not add value to the client's requests, and at the same time removes valuable resources from the project."}, {"en": false, "h": "밑줄 함축 문항은 <b>밑줄 바로 앞 문장</b>이 거의 항상 열쇠다. 4번은 금도금을 <b>gratifies the professional</b>(전문가를 만족시킨다)과 <b>does not add value to the client's requests</b>(고객의 요구에는 가치를 더하지 못한다)로 갈라놓고, 거기에 <b>removes valuable resources</b>(자원까지 앗아 간다)를 덧붙인다. 즉 <b>더 잘하려는 행위가 오히려 손해</b>라는 것이다. 이것을 속담으로 압축한 것이 <b>The best is the enemy of the good</b>, 곧 '<b>최고를 좇다가 좋은 것을 망친다</b>'이다. 여기서 <b>the best</b>는 <b>자기를 증명하려고 품질을 끌어올리는 행위</b>를 가리킨다. 따라서 '<b>자신을 증명하기 위해서만 작업 품질을 올리는 것은 바람직하지 않다</b>'는 ②가 정답이다."}], "opts": [{"n": "①", "t": "직장에서 완벽을 추구하는 것은 팀원들 사이에 갈등을 유발한다.", "a": false, "x": true, "trap": false, "e": "<b>conflicts among team members</b>(팀원 간 갈등)는 지문에 전혀 없다. 2번의 <b>project team members</b>라는 표현만 보고 끌려가면 걸린다."}, {"n": "②", "t": "자신을 증명하기 위해서만 작업 품질을 올리는 것은 바람직하지 않다.", "a": true, "x": false, "trap": false, "e": "1번의 <b>no real justification other than to demonstrate one's own talent</b>가 '<b>자신을 증명하기 위해서만</b>'에, 4번의 <b>does not add value ... removes valuable resources</b>가 '<b>바람직하지 않다</b>'에 정확히 대응한다."}, {"n": "③", "t": "필요 이상의 자격을 갖춘 전문가를 프로젝트에 끌어들이는 것은 나쁜 결과로 이어진다.", "a": false, "x": true, "trap": true, "e": "2번의 <b>specialists with proven experience</b>는 <b>과잉 자격</b>에 대한 지적이 아니라 금도금이 <b>어떤 프로젝트에서 잘 일어나는지</b>를 설명한 것이다. 밑줄의 <b>The best</b>도 <b>사람의 자격 수준</b>이 아니라 <b>결과물의 품질</b>을 가리킨다."}, {"n": "④", "t": "고객의 변화하는 요구에 대응하는 것은 불필요하다.", "a": false, "x": true, "trap": false, "e": "지문은 오히려 <b>the client's requests</b>에 가치를 더하지 못하는 것을 <b>문제</b>로 본다. 고객 대응이 불필요하다는 말은 정반대다."}, {"n": "⑤", "t": "프로젝트를 위해 다양한 기술을 획득하는 것은 성공을 보장하지 않는다.", "a": false, "x": true, "trap": false, "e": "3번의 <b>test and enrich their skill sets</b>가 있지만, 이는 전문가가 금도금에 끌리는 <b>동기</b>일 뿐이다. 글은 기술 습득의 효용을 논하지 않는다."}], "w": [["gold plating", "금도금(불필요한 과잉 작업)"], ["needlessly", "불필요하게"], ["enhance", "향상하다, 높이다"], ["costly", "비용이 많이 드는"], ["a     const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
