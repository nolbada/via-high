<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){

    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

t economics cannot, in a vacuum<sup>4</sup>, identify the goal.", "notes": [["1", "go a long way towards ~ing", "~하는 데 큰 도움이 되다"], ["2", "legislature", "입법부, 입법 기관"], ["3", "whether or not", "~인지 아닌지"], ["4", "in a vacuum", "외부와 단절된 상태에서"]], "lit": "경제학은 입법부가 판단하도록 돕는 데 큰 도움이 될 수 있다 / 특정 세법이 특정 목표를 달성하는 데 도움이 될지 아닐지를, / 그러나 경제학은 외부와 단절된 상태에서 그 목표를 규명할 수는 없다.", "nat": "경제학은 특정 세법이 특정 목표를 달성하는 데 도움이 될지를 입법부가 판단하도록 하는 데 큰 도움이 될 수 있지만, 경제학만으로 그 목표 자체를 규명할 수는 없다.", "ana": "<b>help + 목적어 + 동사원형</b>이 두 번 겹쳐 나오는 문장이다. <b>helping a legislature determine</b>에서 determine 앞에 to가 없는 것이 정상이며, help는 목적격 보어로 <b>원형부정사와 to부정사를 모두</b> 쓸 수 있다. determine의 목적어는 <b>whether or not ~</b>이 이끄는 <b>명사절</b>로, '<b>~인지 아닌지</b>'라는 뜻이다. 뒤쪽 <b>will help achieve</b>도 같은 구조다. but 뒤의 <b>cannot, in a vacuum, identify</b>는 조동사와 본동사 사이에 부사구가 <b>삽입</b>된 형태이니, 콤마 두 개를 괄호로 묶어 지우고 <b>cannot identify</b>로 붙여 읽어야 한다. <b>in a vacuum</b>은 '진공 속에서'가 아니라 '<b>다른 요소와 단절된 채로, 그것만으로</b>'라는 뜻이다.", "pe": "Economics can go \u0001a long way towards<sup>1</sup> helping a legislature<sup>2</sup> determine\u0002 / \u0001whether or not<sup>3</sup> a particular tax law will help achieve a particular goal\u0002, / but economics cannot, \u0001in a vacuum<sup>4</sup>\u0002, identify the goal.", "pk": "경제학은 \u0001입법부가 판단하도록 돕는 데\u0002 큰 도움이 될 수 있다 / \u0001특정 세법이 특정 목표를 달성하는 데 도움이 될지 아닐지를\u0002, / 그러나 경제학은 \u0001외부와 단절된 상태에서\u0002 그 목표를 규명할 수는 없다.", "core": "경제학은 갈 수 있지만, 경제학은 목표를 규명할 수 없다.", "tags": ["주어 Economics + 동사 can go: 1형식. (a long way towards … determine) = 전치사구(부사구): go를 꾸밈. go a long way towards = ~에 크게 기여하다", "(whether or not …) = determine의 목적어절(명사절). 부사구 안에 포함되어 함께 수식어", "but은 앞뒤 절을 잇는 접속사. 주어 economics + 동사 cannot identify + 목적어 the goal: 3형식. (in a vacuum) = 삽입 전치사구(부사구): identify를 꾸밈"], "steps": [{"t": "이 문장은 <b>but으로 이은 두 개의 문장</b>이다. 앞은 S+V(1형식), 뒤는 S+V+O(3형식)이다."}, {"t": "앞 문장의 뼈대부터 찾는다.", "sub": ["S: Economics (경제학)", "V: can go (go a long way towards ~ ~에 크게 기여하다)", "뼈대 = <b>Economics can go a long way</b>", " </sup> / or failed to follow through on<sup>4</sup> previous commitments<sup>5</sup>.", "notes": [["1", "be being p.p.", "~되고 있는 중이다(진행형 수동)"], ["2", "upon reflection", "곰곰이 생각해 본 뒤"], ["3", "let A down", "A를 실망시키다"], ["4", "follow through on", "~을 끝까지 이행하다"], ["5", "commitment", "약속, 다짐"]], "lit": "어떤 직원은 / 직장에서 공동의 책임을 두고 동료들에게 신뢰받지 못하고 있다는 것을 깨닫는 (그런 직원은) / 곰곰이 생각해 본 뒤 영역들을 찾아낼 수도 있다 / 자신이 계속해서 남들을 실망시켜 온 / 또는 이전의 약속을 끝까지 지키지 못했던 (영역들을).", "nat": "직장에서 공동의 책임을 두고 동료들이 자신을 신뢰하지 않는다는 것을 깨달은 직원은, 돌이켜 생각해 보며 자신이 계속 남들을 실망시켰거나 이전의 약속을 끝까지 지키지 못했던 부분을 찾아낼 수도 있다.", "ana": "주어가 <b>An employee</b>이고 진짜 동사는 한참 뒤의 <b>might identify</b>다. 그 사이에 통째로 들어앉은 것이 <b>who realizes ~</b>라는 <b>주격 관계대명사절</b>이다. 관계사절 안의 <b>she isn't being trusted</b>는 <b>be동사 + being + 과거분사</b> 형태의 <b>진행형 수동태</b>로, '<b>지금 신뢰받고 있지 않은 중이다</b>'라는 뜻이다. 주절에서는 <b>might</b>와 <b>identify</b> 사이에 <b>upon reflection</b>이 <b>삽입</b>되어 있으므로 콤마 두 개를 지우고 붙여 읽는다. 마지막 <b>where</b>는 장소를 뜻하는 게 아니라 앞의 추상명사 <b>areas</b>를 꾸미는 <b>관계부사</b>다. 그 안에서 <b>has let ~ down</b>과 <b>(has) failed to ~</b>가 or로 묶인 <b>현재완료 병렬</b>이라는 점까지 잡아야 문장이 끝난다.", "pe": "An employee / \u0001who realizes she isn't being trusted<sup>1</sup> by her co-workers with shared responsibilities at work\u0002 / might, \u0001upon reflection<sup>2</sup>\u0002, identify areas / \u0001where she has consistently let others down<sup>3</sup>\u0002 / \u0001or failed to follow through on<sup>4</sup> previous commitments<sup>5</sup>\u0002.", "pk": "어떤 직원은 / \u0001직장에서 공동의 책임을 두고 동료들에게 신뢰받지 못하고 있다는 것을 깨닫는\u0002 (그런 직원은) / 곰곰이 생각해 본 뒤 영역들을 찾아낼 수도 있다 / 자신이 계속해서 남들을 실망시켜 온 / 또는 이전의 약속을 끝까지 지키지 못했던 (영역들을).", "core": "직원은 영역들을 찾아낼 수도 있다.", "tags": ["주어 An employee: 동사가 나올 때까지 기다림", "(who realizes …) = 관계절(형용사절): An employee를 꾸밈. 안의 realizes의 목적어는 she isn't being trusted(명사절, that 생략)", "동사 might identify + 목적어 areas: 3형식. (upon reflection) = 삽입 전치사구(부사구): identify를 꾸밈", "(where she has consistently let others down) = 관계부사절(형용사절): areas를 꾸밈. let down = 실망시키다", "(or failed to follo 함정이며, <b>devote A to ~ing</b>, <b>be used to ~ing</b>, <b>look forward to ~ing</b>, <b>object to ~ing</b>도 전부 같은 무리다. 목적어 <b>huge fractions of their time and energy</b>가 길어서 to가 멀리 떨어져 보이지만, <b>dedicate ~ to</b>를 한 덩어리로 묶어 두면 흔들리지 않는다. 뒤의 <b>from twigs, flowers, ~ and even colorful trash</b>는 재료를 나열한 것으로, <b>make A from B</b>('B로 A를 만들다')와 같은 쓰임이다.", "pe": "The \u0001male\u0002 bowerbirds<sup>1</sup> \u0001of New Guinea and Australia\u0002 / dedicate<sup>2</sup> \u0001huge\u0002 fractions<sup>3</sup> \u0001of their time and energy\u0002 / \u0001to creating elaborate<sup>4</sup> structures from twigs<sup>5</sup>, flowers, berries, beetle wings, and even colorful trash\u0002.", "pk": "\u0001뉴기니와 호주의\u0002 \u0001수컷\u0002 바우어새는 / \u0001자기 시간과 에너지의\u0002 \u0001엄청난\u0002 부분을 쏟는다 / \u0001잔가지, 꽃, 산딸기, 딱정벌레 날개, 심지어 알록달록한 쓰레기로 정교한 구조물을 만드는 데\u0002.", "core": "새들은 부분을 쏟는다.", "tags": ["주어 bowerbirds. (male) = 형용사: bowerbirds를 꾸밈, (of New Guinea and Australia) = 전치사구(형용사구): bowerbirds를 꾸밈", "동사 dedicate + 목적어 fractions: 3형식. (huge) = 형용사: fractions를 꾸밈, (of their time and energy) = 전치사구(형용사구): fractions를 꾸밈", "(to creating … trash) = 전치사구(부사구): dedicate를 꾸밈, 거의 필수에 가까운 부사구(dedicate A to B) [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>dedicate A to B (S+V+O + to 전치사구, 3형식)</b>이다. 수식어가 많아 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The male bowerbirds (수컷 바우어새들. bowerbird 바우어새). of New Guinea and Australia는 '뉴기니와 호주의'", "V: dedicate (바치다, 쏟다)", "O: huge fractions of their time and energy (자기 시간과 에너지의 엄청난 부분. huge 엄청난, fraction 부분)", "뼈대 = <b>The male bowerbirds dedicate huge fractions</b>", "판정 기준: dedicate A to B에서 to B는 거의 필수에 가까운 부사구로 봄"]}, {"t": "<b>to creating elaborate structures ~</b>는 dedicate A to B의 to 전치사구이다 ('~을 만드는 데'). 전치사 to 뒤라서 creating은 동명사이다.", "sub": ["create 만들어 내다, elaborate 정교한, structure 구조물"]}, {"t": "재료는 <b>from twigs, flowers, berries, beetle wings, and even colorful trash</b>이다 (잔가지, 꽃, 산딸기, 딱정벌레 날개, 심지어 알록달록한 쓰레기).", "sub": ["twig 잔가지, berry 산딸기, beetle 딱정벌레, trash 쓰레기", "their = bowerbirds (수컷 바우어새들)"]}, {"t": "함정: dedicate A to creating의 to는 to부정사의 to가 아니라 전치사이다."}], "sum": "수컷 바우어새, 잡다한 재료로 정교한 구조물을 만드는 데 시간과 에너지를 크게 투자"}, {"i": "08", "q": "06", "s": "3", "title": "S+V+C + 계속적 which절", "eng": "These are the backdrops<sup>1</sup> to their complex mating<sup>2</sup> dances, / which include acrobatic<sup>3</sup> moves and even imitations<sup>4</sup> of other species.", "notes": [["1", "backdrop", "배경(막)"], ["2", "mating", "짝짓기"], ["3", "acrobatic", "곡예의"], ["4", "imitation", "흉내, 모방"]], "lit": "이것들은 그들의 복잡한 짝짓기 춤의 배경이 되는데, / 그 춤에는 곡예 같은 동작과 심지어 다른 종의 흉내까지 포함된다.", "nat": "이 구조물들은 그들의 복잡한 짝짓기 춤의 배경이 되는데, 그 춤에는 곡예 같은 동작과 심지어 다른 종을 흉내 내는 동작까지 들어 있다.", "ana": "콤마 뒤의 <b>which</b>는 <b>계속적 용법</b>의 관계대명사다. 계속적 용법은 앞으로 돌아가 '~한 그 춤'이라고 <b>거꾸로 붙여 읽지 않고</b>, '<b>그리고 그것은</b>'처럼 <b>앞에서 뒤로 그대로 이어</b> 읽는다. 여기서 which가 받는 것은 바로 앞의 <b>their complex mating dances</b>이고, 동사 <b>include</b>가 복수형인 것이 그 증거다. 만약 앞 문장 전체를 받았다면 includes가 되었을 것이다. <b>계속적 용법의 which는 앞 명사일 수도 있고 앞 문장 전체일 수도 있으므로, 뒤따르는 동사의 수(단수·복수)로 확인</b>하는 습관이 필요하다. <b>backdrop to</b>는 '<b>~의 배경</b>'이라는 뜻이다.", "pe": "These are the backdrops<sup>1</sup> \u0001to their complex mating<sup>2</sup> dances\u0002, / \u0001which include acrobatic<sup>3</sup> moves and even imitations<sup>4</sup> of other species\u0002.", "pk": "이것들은 \u0001그들의 복잡한 짝짓기 춤의\u0002 배경이 되는데, / \u0001그 춤에는 곡예 같은 동작과 심지어 다른 종의 흉내까지 포함된다\u0002.", "core": "이것들은 배경이다.", "tags": ["주어 These + 동사 are + 보어 the backdrops: 2형식. (to their complex mating dances) = 전치사구(형용사구): backdrops를 꾸밈", "(which include …) = <b>계속적 관계절</b>(형용사절): dances를 꾸밈, '그런데 그 춤에는 ~'"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) + 계속적 which절</b>이다. 두 덩어리로 나누어 읽으면 된다."}, {"t": "앞 덩어리의 뼈대부터 찾는다.", "sub": ["S: These (이것들 = 앞 문장의 elaborate structures, 정교한 구조물들)", "V: are (be ~이다)", "C: the backdrops (배경. backdrop 배경)", "뼈대 = <b>These are the backdrops</b>"]}, {"t": "<b>to their complex mating dances</b>는 backdrops를 꾸미는 전치사구이다 ('그들의 복잡한 짝짓기 춤의').", "sub": ["their = 앞 문장의 bowerbirds (바우어새들)", "complex 복잡한, mating 짝짓기"]}, {"t": "콤마 뒤 <b>which include ~</b>는 계속적 용법의 관계절이다. which는 dances를 가리킨다 ('그런데 그 춤에는 ~').", "sub": ["V: include (포함하다) / O: acrobatic moves (곡예 같은 동작) and even imitations of other species (심지어 다른 종의 흉내)", "acrobatic 곡예의, imitation 흉내, species 종"]}], "sum": "구조물은 곡예와 타 종 흉내까지 곁들인 짝짓기 춤의 배경"}], "qs": [{"q": "01", "type": "필자의 주장", "src": "2017년 4월 19번", "ans": "①", "tr": [["1", "많은 성공한 사람들이 하는 가장 어려운 일 중 하나는 자기 자신의 신념에 도전하는 것이다."], ["2", "한때 진실이고 유용했던 신념이라 해도 얼마든지 변할 수 있다."], ["3", "프리드리히 니체는 이렇게 잘 표현했다. \"그것은 단순히 자기 신념을 밀고 나갈 용기가 있느냐의 문제가 아니라, 때로는 자기 신념을 공격할 용기가 있느냐의 문제이다.\""], ["4", "그것이 바로 사람이 성장하는 방식이다."], ["5", "그것이 바로 사람이 성숙해지는 방식이다."], ["6", "그것이 바로 사람이 발전하는 방식이다."], ["7", "톨스토이 자신을 보라. 그는 때때로 자기 자신의 신념을 공격해야 한다는 것을 깨달았기 때문에 기꺼이 성장할 수 있었던 사람의 훌륭한 본보기다."], ["8", "소크라테스는 이렇게 잘 표현했다. \"성찰하지 않는 삶은 살 가치가 없다.\""], ["9", "그러나 우리는 성찰하는 삶이 고통스럽고 위험하며 상처받기 쉬움으로 가득하다는 점도 덧붙여야 한다."], ["10", "그럼에도 불구하고, 공적인 대화에 새로운 활력을 불어넣으려면 우리는 자기비판과 자기 수정이 우리 사회와 세계에서뿐만 아니라 우리 각자의 삶에서도 강조되도록 반드시 해야 한다."]], "evh": "1번 문장", "ev": [{"en": true, "h": "One of the most difficult things many successful people do is to challenge their own beliefs."}, {"en": false, "h": "주장 문항은 <b>첫 문장과 마지막 문장</b>이 승부처다. 이 글은 1번 문장에서 곧바로 <b>challenge their own beliefs</b>(자기 신념에 도전하기)를 꺼내 놓고, 이후 전부가 그것을 되풀이한다. 3번 니체 인용의 <b>the courage to attack one's convictions</b>, 7번 톨스토이 예시의 <b>he had to attack his own convictions</b>, 10번의 <b>self-criticism and self-correction</b>이 모두 <b>같은 말의 다른 표현</b>이다. 여기서 주의할 것은 <b>도전·공격의 대상이 남이 아니라 자기 자신</b>이라는 점이다. attack이라는 단어만 보고 '남을 비판한다'로 읽으면 ③·④로 끌려간다. 4~6번의 <b>That's how you grow / mature / develop</b>은 그 도전의 <b>결과가 성장</b>임을 못 박아 주므로, '성장을 위해 자기 신념에 도전하라'가 그대로 답이 된다."}], "opts": [{"n": "①", "t": "성장을 위해 자신의 신념에 도전하라.", "a": true, "x": false, "trap": false, "e": "1번 문장의 <b>challenge their own beliefs</b>와 4~6번의 <b>That's how you grow</b>가 그대로 합쳐진 진술이다. 대상이 <b>자신의</b> 신념이라는 점까지 일치한다."}, {"n": "②", "t": "성공을 위해 역경을 밑거름으로 삼으라.", "a": false, "x": true, "trap": false, "e": "글에 <b>역경(adversity)</b>이라는 개념이 없다. successful people은 예시로 잠깐 나올 뿐이고, 글이 요구하는 것은 역경 극복이 아니라 <b>자기 점검</b>이다."}, {"n": "③", "t": "타인의 비판에 대해 수용적 태도를 가지라.", "a": false, "x": true, "trap": true, "e": "9번의 painful·risky는 <b>스스로 성찰할 때</b> 겪는 고통이지 남의 비판을 받아들이는 태도가 아니다. 10번의 self-criticism도 <b>자기</b>비판이다."}, {"n": "④", "t": "타인을 비판하기 전에 자신을 먼저 돌아보라.", "a": false, "x": true, "trap": false, "e": "'먼저'라는 순서 개념이 글에 없다. 이 글은 타인 비판을 아예 다루지 않고 <b>자기 신념 검토</b> 하나만 말한다."}, {"n": "⑤", "t": "자신의 신념을 실행에 옮기는 용기를 키우라.", "a": false, "x": true, "trap": false, "e": "3번 문장이 정확히 이것을 <b>부정</b>한다. <b>not simply … the courage of one's convictions, but … the courage to attack one's convictions</b>, 즉 신념을 밀고 나가는 용기가 아니라 <b>공격하는</b> 용기라고 했다."}], "w": [["conviction", "신념, 확신"], ["challenge", "도전하다, 이의를 제기하다"], ["attack", "공격하다, 반박하다"], ["mature", "성숙해지다"], ["be willing to V", "기꺼이 ~하다"], ["unexamined", "성찰하지 않은"], ["worth ~ing", "~할 가치가 있는"], ["vulnerability", "취약함, 상처받기 쉬움"], ["revitalize", "새로운 활력을 주다"], ["ensure", "반드시 ~하게 하다"], ["accent", "강조하다"], ["as well as", "~뿐만 아니라"]]}, {"q": "02", "type": "도표 불일치", "src": "2021학년도 6월 25번", "ans": "④", "tr": [["1", "2015년 산업별 전 세계 플라스틱 폐기물 발생량"], ["2", "위 표는 2015년 산업별 전 세계 플라스틱 폐기물 발생량을 보여 준다."], ["3", "플라스틱 폐기물을 가장 많이 발생시킨 부문은 포장재로, 발생한 전체 플라스틱 폐기물의 46.69퍼센트를 차지했다."], ["4", "섬유 부문은 3,800만 톤의 플라스틱 폐기물, 즉 발생한 전체 플라스틱 폐기물의 12.58퍼센트를 발생시켰다."], ["5", "소비자·기관 제품 부문은 3,700만 톤의 플라스틱 폐기물을 발생시켰고, 그 양은 운송 부문이 발생시킨 플라스틱 폐기물의 두 배가 넘었다."], ["6", "전기·전자 부문은 건축·건설 부문이 발생시킨 것과 꼭 같은 양의 플라스틱 폐기물을 발생시켰으며, 각 부문은 전체 플라스틱 폐기물 발생량의 8.60퍼센트를 차지했다."], ["7", "산업 기계 부문에서는 단 100만 톤의 플라스틱 폐기물만 발생했는데, 이는 발생한 전체 플라스틱 폐기물의 0.50퍼센트 미만에 해당한다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "The electrical and electronic sector generated just as much plastic waste as the building and construction sector did, each sector accounting for 8.60% of the total plastic waste generation."}, {"en": false, "h": "두 부문의 <b>양이 같다</b>는 앞부분은 맞다. 표에서 전기·전자와 건축·건설은 둘 다 <b>13 million tons</b>이다. 어긋나는 것은 뒷부분의 <b>비율</b>이다. 표의 % 칸을 보면 각각 <b>4.30%</b>이고, 8.60%는 <b>둘을 더한 값</b>이다. 즉 <b>each sector</b>(각 부문)라고 해 놓고 <b>합계</b>를 갖다 붙인 전형적인 함정이다. 도표 문항에서 <b>each·respectively·per</b>가 보이면 그 숫자가 <b>개별 값인지 합계인지</b>를 반드시 표에서 되짚어야 한다. 참고로 <b>just as much A as B did</b>는 '<b>B가 그랬던 것과 꼭 같은 양의 A</b>'라는 원급 비교다."}], "opts": [{"n": "①", "t": "포장재 부문이 가장 많은 폐기물을 발생시켰고 46.69%를 차지했다.", "a": false, "x": true, "trap": false, "e": "표에서 Packaging은 141백만 톤·46.69%로 1위가 맞다. <b>account for</b>는 '(비율을) 차지하다'라는 뜻이다."}, {"n": "②", "t": "섬유 부문은 3,800만 톤, 곧 전체의 12.58%를 발생시켰다.", "a": false, "x": true, "trap": false, "e": "표의 Textiles 38 / 12.58과 정확히 일치한다. 여기서 <b>or</b>는 '또는'이 아니라 '<b>즉, 다시 말해</b>'로 앞의 수치를 바꿔 말하는 것이다."}, {"n": "③", "t": "소비자·기관 제품 부문의 양은 운송 부문의 두 배가 넘었다.", "a": false, "x": true, "trap": false, "e": "37과 17을 비교하면 두 배(34)를 넘는다. <b>more than twice that of ~</b>에서 that은 the amount를 받는 대명사다."}, {"n": "④", "t": "전기·전자와 건축·건설이 같은 양이며 각각 8.60%를 차지했다.", "a": true, "x": false, "trap": false, "e": "양이 같다는 것은 맞지만(각 13백만 톤), 비율은 각각 <b>4.30%</b>다. 8.60%는 두 부문을 <b>합한</b> 값이므로 each와 어긋난다."}, {"n": "⑤", "t": "산업 기계 부문은 100만 톤으로 전체의 0.50% 미만이었다.", "a": false, "x": true, "trap": true, "e": "표의 Industrial Machinery 1 / 0.33과 일치하며 0.50% 미만이 맞다. <b>represent</b>가 '나타내다, ~에 해당하다'로 쓰였다."}], "w": [["generation", "발생, 생성"], ["account for", "(비율을) 차지하다"], ["packaging", "포장(재)"], ["textile", "섬유, 직물"], ["institutional", "기관의"], ["transportation", "운송, 교통"], ["just as much as", "꼭 ~만큼 많이"], ["represent", "~에 해당하다, 나타내다"], ["industrial machinery", "산업 기계"], ["sector", "부문, 분야"], ["due to rounding", "반올림 때문에"], ["sum to", "합계가 ~이 되다"]]}, {"q": "03", "type": "글의 요지", "src": "2023학년도 9월 22번", "ans": "⑤", "tr": [["1", "역사적으로 세법 입안자들은 경제와 역사에 관한 문제에는 주의를 기울이면서 도덕적 문제에는 덜 주의를 기울여 왔다."], ["2", "도덕성 문제는 너무 논란이 많다거나, 답하기 너무 어렵다거나, 최악의 경우 그 사안과 무관하다는 딱지가 붙은 채 입법 논의에서 종종 뒷전으로 밀려난다."], ["3", "그러나 사실 조세의 도덕적 문제는 세법을 만드는 일의 바로 한복판에 있다."], ["4", "무관하기는커녕, 도덕적 문제는 과세의 부과에 있어 근본적이다."], ["5", "조세는 한 사회가 지닌 분배 정의 이론의 적용이다."], ["6", "경제학은 특정 세법이 특정 목표를 달성하는 데 도움이 될지를 입법부가 판단하도록 하는 데 큰 도움이 될 수 있지만, 경제학만으로는 그 목표 자체를 규명할 수 없다."], ["7", "세법 정책을 만드는 일은 도덕적 목표를 규명하는 일을 필요로 하며, 그것은 윤리와 도덕적 분석을 반드시 수반해야 하는 과제이다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "Creating tax policy requires identifying a moral goal, which is a task that must involve ethics and moral analysis."}, {"en": false, "h": "요지 문항은 <b>But / In fact / Rather than</b> 뒤부터가 본론이다. 1·2번 문장은 '지금까지는 도덕을 뒷전으로 미뤄 왔다'는 <b>통념</b>이고, 3번의 <b>But, in fact</b>에서 방향이 뒤집힌다. 그다음 <b>at the very heart of</b>(바로 한복판에), <b>fundamental to</b>(근본적인)라는 강한 표현이 연달아 나오면 그것이 필자의 입장이다. 마지막 7번 문장은 이를 <b>실무 지침</b>으로 정리한다. <b>Creating tax policy requires identifying a moral goal</b> — 세법을 만들려면 <b>도덕적 목표를 먼저 정해야</b> 한다는 것이다. 6번 문장의 <b>economics cannot, in a vacuum, identify the goal</b>은 경제학의 <b>한계</b>를 지적한 것이지 경제학의 역할을 칭찬한 것이 아니라는 점이 ④를 가르는 열쇠다."}], "opts": [{"n": "①", "t": "분배 정의를 실현하려면 시민 단체의 역할이 필요하다.", "a": false, "x": true, "trap": false, "e": "5번 문장에 <b>distributive justice</b>가 나오기는 하지만 조세의 성격을 설명하는 말일 뿐이고, <b>시민 단체</b>는 글 어디에도 등장하지 않는다."}, {"n": "②", "t": "사회적 합의는 민주적인 정책 수립의 선행 조건이다.", "a": false, "x": true, "trap": false, "e": "<b>사회적 합의·민주적 절차</b>라는 개념이 없다. 글이 요구하는 것은 합의 절차가 아니라 <b>도덕적 목표의 설정</b>이다."}, {"n": "③", "t": "성실한 납세는 안정적인 정부 예산 확보의 기반이 된다.", "a": false, "x": true, "trap": false, "e": "납세자의 태도나 정부 예산 이야기는 전혀 없다. 이 글은 세법을 <b>만드는 쪽</b>의 문제만 다룬다."}, {"n": "④", "t": "경제학은 세법을 개정할 때 이론적 근거를 제공한다.", "a": false, "x": true, "trap": true, "e": "6번 문장을 절반만 읽으면 걸린다. <b>but economics cannot … identify the goal</b>이라며 경제학이 목표를 정해 주지는 <b>못한다</b>고 못 박는다. 글의 결론은 경제학의 유용성이 아니라 <b>도덕의 필요성</b>이다."}, {"n": "⑤", "t": "세법을 만들 때 도덕적 목표를 설정하는 것이 중요하다.", "a": true, "x": false, "trap": false, "e": "7번 문장의 <b>Creating tax policy requires identifying a moral goal</b>과 그대로 겹친다. 3·4번 문장의 <b>at the very heart of</b>, <b>fundamental to</b>도 같은 방향이다."}], "w": [["drafter", "입안자, 초안 작성자"], ["legislation", "입법, 법률 제정"], ["attentive to", "~에 주의를 function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
const CMAP={"01-2": [["080", "주격 관계대명사"], ["078", "관계대명사"]], "02-4": [["034", "비교급"]], "03-2": [["072", "분사구문"], ["074", "수동태"]], "03-6": [["026", "동명사"]], "04-4": [["037-H1", "병렬 구조"]], "05-2": [["086", "관계부사"]], "06-3": [["083", "관계대명사 계속적 용법"]]};
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  const cc=(CMAP[c.q+'-'+c.s]||[]);
  const back=encodeURIComponent(location.origin+location.pathname);
  let x='<div class="sc open"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='<div class="fin"><b>자연스러운 해석</b>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm)x+='<div class="fin"><b>한 줄 정리</b>'+esc(sm)+'</div>';
  x+='</div></div>';
  return x;
}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
