<style>

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}

<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});

 블랙홀에 빗대어 정리해요."}]}, {"no": "11", "typ": "장문 · 제목", "src": "2016학년도 수능 41번", "evn": [8, 12], "ev_en": "Basic scientific research provides the raw materials that technology and engineering use to solve problems. / Science tells us where we are and what we are, and that knowledge is beyond value.", "ev_ko": [[8, "기초 과학 연구는 기술과 공학이 문제를 해결하는 데 사용하는 원료를 제공한다."], [12, "과학은 우리가 어디에 있고 우리가 무엇인지 알려주며, 그러한 지식은 가치를 넘어선다."]], "why": ["글은 처음에 기초 과학이 알려진 실용적 가치가 없어 보인다는 생각을 소개합니다", "하지만 (8)에서 기초 과학 연구는 기술과 공학이 문제를 해결하는 데 쓰는 원료를 제공한다고 합니다", "이것이 실용적인 쪽의 대답입니다", "이어서 기초 과학에는 단지 기능적이라고 부르기 아까운 또 하나의 쓰임이 있다고 합니다", "그리고 (12)에서 과학은 우리가 어디에 있고 무엇인지 알려 주며, 그 지식은 가치를 넘어선다고 마무리합니다", "두 대답 모두 ‘기초 과학이 우리에게 무엇을 가져다주는가’에 대한 답이므로, 제목은 ①이 알맞습니다."], "ch": [{"n": "①", "t": "What Does Basic Science Bring to Us?", "g": "기초 과학은 우리에게 무엇을 가져다주는가?", "ok": true, "e": ["(8)의 기술과 공학에 쓰이는 원료, (12)의 우리가 어디에 있고 무엇인지 알려 주는 지식이 모두 기초 과학이 우리에게 주는 것입니다", "글 전체가 이 질문에 답합니다."]}, {"n": "②", "t": "The Crisis of Researchers in Basic Science", "g": "기초 과학 연구자들의 위기", "ok": false, "e": ["기초 과학 연구자들이 위기에 처했다는 내용은 없습니다", "(2)는 기초 과학이 가치 없다고 ‘주장하기 쉽다’는 생각을 소개할 뿐입니다."]}, {"n": "③", "t": "Common Goals of Science and Technology", "g": "과학과 기술의 공동 목표", "ok": false, "e": ["(8)에 기술과 공학이 나오지만, 기초 과학이 그것에 원료를 제공한다는 내용입니다", "과학과 기술의 공동 목표는 다루지 않습니다."]}, {"n": "④", "t": "Technology: The Ultimate Aim of Basic Science", "g": "기술: 기초 과학의 궁극적 목표", "ok": false, "e": ["(9)는 기초 과학 연구에 중요한 쓰임이 하나 더 있다고 합니다", "그 쓰임은 단지 기능적이라고 부르면 모욕처럼 보일 만큼 귀중하다고 합니다", "기술이 기초 과학의 궁극적 목표라는 말은 글의 흐름과 맞지 않습니다."]}, {"n": "⑤", "t": "Michael Faraday, Frontiersman of the Electronic Age!", "g": "Michael Faraday, 전자 시대의 개척자!", "ok": false, "e": ["Faraday는 (4)부터 (6)까지 기초 연구의 쓸모를 보여 주는 하나의 예로 나옵니다", "글 전체가 Faraday를 다루지는 않습니다."]}], "tr": ["우리는 알려진 실용적 가치를 전혀 지니지 않은 과학을 기초 과학 또는 기초 연구라고 말할 수 있다.", "목성과 같은 세계에 대한 우리의 탐사는 기초 과학으로 불릴 것인데, 그것(기초 과학)은 알려진 실용적인 용도를 전혀 지니지 않기 때문에 기초 과학이 노력과 비용을 들일 가치가 없다고 주장하기 쉽다.", "물론, 문제는 우리가 그 지식을 얻을 때까지는 어떤 지식이 유용할지 아는 방법이 우리에게 없다는 것이다.", "19세기 중반에, Victoria(빅토리아) 여왕은 물리학자 Michael Faraday(마이클 패러데이)에게 그의 전기와 자성에 관한 실험이 무슨 도움이 되는지 물었다고 한다.", "그(Faraday)는 “여왕님, 아기는 무슨 도움이 됩니까?”라고 대답했다.", "물론, Faraday의 실험은 전자 시대의 시작이 되었다(시초였다).", "우리의 세상을 채우고 있는 과학적 지식의 실용적인 활용들 중 많은 것들 — 트랜지스터, 백신, 플라스틱 — 은 기초 연구로 시작되었다.", "기초 과학 연구는 기술과 공학이 문제를 해결하는 데 사용하는 원료를 제공한다.", "기초 과학 연구는 게다가 매우 중요해서 그것을 단지 기능적인 것으로 언급하는 것이 모욕처럼 보이는 중요한 용도를 한 가지 더 가지고 있다.", "과학은 자연에 대한 학문이며, 우리가 자연이 어떻게 작용하는지에 대해 더 많이 배울수록, 우리는 이 우주에서의 우리의 존재가 우리에게 무엇을 의미하는지에 대해 더 많이 알게 된다.", "우리가 다른 세계에 대한 우주탐사기로부터 얻는 겉보기에 비실용적인 지식들이 우리의 행성과 자연의 체계 속에서 우리 자신의 역할에 대해 우리에게 알려준다.", "과학은 우리가 어디에 있고 우리가 무엇인지 알려주며, 그러한 지식은 가치를 넘어선다."], "ps": [{"n": 1, "ch": [{"e": "We might <b>describe<\/b> science", "k": "우리는 과학을 ~라고 말할 수 있다"}, {"e": "that has no known <b>practical value<\/b>", "k": "알려진 실용적 가치를 전혀 지니지 않은"}, {"e": "as <b>basic science<\/b> or basic research.", "k": "기초 과학 또는 기초 연구라고."}], "easy": "알려진 쓸모가 전혀 없는 과학을 기초 과학, 또는 기초 연구라고 부를 수 있어요.", "gist": "글의 화제 — 기초 과학이란 무엇인가."}, {"n": 2, "ch": [{"e": "Our <b>exploration<\/b> of worlds such as Jupiter", "k": "목성과 같은 세계에 대한 우리의 탐사는"}, {"e": "would be called basic science,", "k": "기초 과학으로 불릴 것이다,"}, {"e": "and it is easy to argue", "k": "그리고 주장하기 쉽다"}, {"e": "that basic science is not worth the effort and <b>expense<\/b>", "k": "기초 과학이 노력과 비용을 들일 가치가 없다고"}, {"e": "because it has no known practical use.", "k": "그것<span class=\"r\">(= 기초 과학)<\/span>은 알려진 실용적인 용도를 전혀 지니지 않기 때문에."}], "link": "목성과 같은 세계에 대한 우리의 탐사는 기초 과학으로 불릴 것인데, 기초 과학은 알려진 실용적인 용도를 전혀 지니지 않기 때문에 노력과 비용을 들일 가치가 없다고 주장하기 쉽다.", "easy": "목성 같은 곳을 탐사하는 것도 기초 과학이에요. 당장 쓸모가 없으니 돈과 노력을 들일 가치가 없다고 말하기 쉬워요.", "gist": "통념 — 쓸모가 없으니 가치도 없다?"}, {"n": 3, "ch": [{"e": "Of course, the problem is", "k": "물론, 문제는 ~라는 것이다"}, {"e": "that we have no way of knowing", "k": "우리가 알 방법이 없다는"}, {"e": "what knowledge will be <b>of use<\/b>", "k": "어떤 지식이 유용할지"}, {"e": "until we <b>acquire<\/b> that knowledge.", "k": "우리가 그 지식을 얻을 때까지는."}], "link": "물론, 문제는 우리가 그 지식을 얻을 때까지는 어떤 지식이 유용할 function recSend(ev){try{ev.t=Date.now();ev.set=SETID;const q=JSON.parse(localStorage.getItem('via_minimock_rec_queue')||'[]');q.push(ev);localStorage.setItem('via_minimock_rec_queue',JSON.stringify(q));}catch(e){}}

const $=s=>document.querySelector(s);
const app=$('#app');
let view='home',quiz=null,armed=null;
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

tle": "가주어 it + 진주어 to부정사, 그리고 that절", "eng": "Our exploration<sup>1</sup> of worlds such as Jupiter<sup>2</sup> would be called basic science, / and it is easy to argue<sup>3</sup> / that basic science is not worth the effort and expense<sup>4</sup> / because it has no known practical use.", "notes": [["1", "exploration", "탐사, 탐험"], ["2", "Jupiter", "목성"], ["3", "argue", "주장하다"], ["4", "expense", "비용"]], "lit": "목성 같은 천체에 대한 우리의 탐사는 기초 과학이라고 불릴 것이다, / 그리고 주장하기는 쉽다 / 기초 과학이 그 노력과 비용을 들일 가치가 없다고 / 그것이 알려진 실용적 쓰임을 갖고 있지 않기 때문에.", "nat": "목성 같은 천체를 탐사하는 일은 기초 과학이라 불릴 텐데, 알려진 실용적 쓰임이 없으니 그런 노력과 비용을 들일 가치가 없다고 주장하기는 쉽다.", "ana": "<b>and</b> 뒤의 <b>it</b>은 앞 절의 내용을 받는 대명사가 <b>아니라</b> 뜻이 없는 <b>가주어</b>다. 진주어는 <b>to argue that ~</b>이고, <b>that</b>절은 다시 <b>argue</b>의 목적어다. 즉 <b>it = to argue that ~</b>이라는 구조를 못 잡으면 문장이 통째로 흔들린다. 앞 절의 <b>would be called</b>는 <b>call A B</b>('A를 B라고 부르다')의 <b>수동</b>이라서 보어 <b>basic science</b>만 뒤에 남았다. <b>would</b>는 여기서 '<b>~일 것이다</b>'라는 완곡한 추측이다. 뒤쪽의 <b>be worth + 명사</b>는 '<b>~의 가치가 있다</b>'로, <b>worth</b>가 전치사처럼 목적어를 바로 받는다는 점을 기억하자.", "pe": "Our exploration<sup>1</sup> \u0001of worlds such as Jupiter<sup>2</sup>\u0002 would be called basic science, / and it is easy to argue<sup>3</sup> / that basic science is not worth the effort and expense<sup>4</sup> / \u0001because it has no known practical use\u0002.", "pk": "\u0001목성 같은 천체에 대한\u0002 우리의 탐사는 기초 과학이라고 불릴 것이다, / 그리고 주장하기는 쉽다 / 기초 과학이 그 노력과 비용을 들일 가치가 없다고 / \u0001그것이 알려진 실용적 쓰임을 갖고 있지 않기 때문에\u0002.", "core": "우리의 탐사는 기초 과학이라고 불릴 것이고, 기초 과학이 가치가 없다고 주장하기는 쉽다.", "tags": ["주어 exploration. of worlds ~는 수식. would be called(수동) + 보어 basic science", "<b>가주어 it</b>: 진주어는 to argue (주장하기는 쉽다)", "argue의 목적어 <b>that절</b>: be worth + 명사", "<b>이유</b> because절: 알려진 실용적 쓰임이 없음"]}, {"i": "07", "q": "11", "s": "4", "title": "be supposed to have p.p. + 간접의문문 어순", "eng": "In the middle of the 19th century, / Queen Victoria is supposed to<sup>1</sup> have asked physicist<sup>2</sup> Michael Faraday / what good his experiments with electricity and magnetism<sup>3</sup> were.", "notes": [["1", "be supposed to", "~라고 여겨지다"], ["2", "physicist", "물리학자"], ["3", "magnetism", "자기(력)"]], "lit": "19세기 중반에, / Victoria 여왕이 물리학자 Michael Faraday에게 물었다고 전해진다 / 전기와 자기에 관한 그의 실험이 무슨 쓸모가 있느냐고.", "nat": "19세기 중반에 Victoria 여왕이 물리학자 Michael Faraday에게 전기와 자기에 관한 그의 실험이 무슨 소용이 있느냐고 물었다고 한다.", "ana": "<b>be supposed to</b>는 두 가지 뜻이 있다. '<b>~하기로 되어 있다</b>'와 '<b>~라고 여겨진다</b>'인데, 여기서는 뒤의 것이다. 게다가 뒤가 <b>to have asked</b>라는 <b>완료부정사</b>다. 완료부정사는 <b>본동사 시제보다 한 시제 앞선 일</b>을 가리키므로, '<b>지금 그렇게 여겨진다 + 물어본 것은 과거의 일</b>'이라는 뜻이 된다. 뒤쪽의 <b>what good his experiments ~ were</b>는 <b>ask</b>의 직접목적어로 들어간 <b>간접의문문</b>이다. 원래 의문문은 <b>What good were his experiments?</b>였지만, 문장 속으로 들어가면서 <b>의문사 + 주어 + 동사</b> 어순으로 바뀌어 <b>were</b>가 맨 뒤로 갔다. <b>ask + 사람 + 의문사절</b>이라는 4형식 틀도 함께 잡아 두자.", "pe": "\u0001In the middle of the 19th century\u0002, / Queen Victoria is supposed to<sup>1</sup> have asked physicist<sup>2</sup> Michael Faraday / what good his experiments \u0001with electricity and magnetism<sup>3</sup>\u0002 were.", "pk": "\u000119세기 중반에\u0002, / Victoria 여왕이 물리학자 Michael Faraday에게 물었다고 전해진다 / \u0001전기와 자기에 관한\u0002 그의 실험이 무슨 쓸모가 있느냐고.", "core": "Victoria 여왕은 Michael Faraday에게 그의 실험이 무슨 쓸모가 있느냐고 물었다고 전해진다.", "tags": ["부사구: 19세기 중반에", "<b>be supposed to + have p.p.</b>: ~했다고 전해진다(완료부정사). ask + 목적어 Faraday", "<b>간접의문문</b> what good ~ were: 의문사 + 주어 + 동사 어순. asked의 직접목적어"]}, {"i": "08", "q": "11", "s": "7", "title": "주격 관계대명사절 + 대시 삽입 + 수 일치", "eng": "Many of the practical<sup>1</sup> uses of scientific knowledge / that fill our world / — transistors<sup>2</sup>, vaccines, plastics — / began as basic research<sup>3</sup>.", "notes": [["1", "practical", "실용적인"], ["2", "transistor", "트랜지스터"], ["3", "basic research", "기초 연구"]], "lit": "과학 지식의 실용적 쓰임 가운데 많은 것은 / 우리 세계를 채우고 있는 / — 트랜지스터, 백신, 플라스틱 같은 것들인데 — / 기초 연구로 시작되었다.", "nat": "트랜지스터, 백신, 플라스틱처럼 우리 세계를 채우고 있는 과학 지식의 실용적 쓰임 가운데 많은 것이 기초 연구에서 시작되었다.", "ana": "주어는 <b>Many of the practical uses</b>이고 동사는 맨 끝의 <b>began</b>이다. 그 사이가 전부 수식어라서 거리가 멀어 보일 뿐이다. <b>that fill our world</b>는 주격 관계대명사절인데, 동사가 <b>fills</b>가 아니라 <b>fill</b>인 이유를 설명할 수 있어야 한다. 선행사가 바로 앞의 <b>knowledge</b>가 아니라 <b>the practical uses</b>(복수)이기 때문이다. <b>관계사절의 동사는 선행사의 수를 따른다</b>는 원칙이 그대로 적용된 자리다. 대시 사이의 세 명사는 <b>the practical uses</b>를 구체적으로 나열한 <b>동격</b>이므로 지우고 읽어도 뼈대는 그대로다. 마지막의 <b>begin as</b>는 '<b>~로 시작하다</b>'이며, 이때 <b>as</b>도 '<b>~로서</b>'라는 자격의 전치사다.", "pe": "Many of the practical<sup>1</sup> uses \u0001of scientific knowledge\u0002 / \u0001that fill our world\u0002 / — \u0001transistors<sup>2</sup>, vaccines, plastics\u0002 — / began as basic research<sup>3</sup>.", "pk": "\u0001과학 지식의\u0002 실용적 쓰임 가운데 많은 것은 / \u0001우리 세계를 채우고 있는\u0002 / — \u0001트랜지스터, 백신, 플라스틱 같은 것들인데\u0002 — / 기초 연구로 시작되었다.", "core": "많은 쓰임은 기초 연구로 시작되었다.", "tags": ["주어 Many of the uses. of scientific knowledge는 수식", "<b>주격 관계대명사</b> that: uses를 꾸밈. 선행사가 복수라 동사 fill", "대시 안은 예시를 든 <b>삽입</b>", "진짜 동사 <b>began</b>: began as + 명사 (기초 연구로 시작)"]}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2023학년도 수능 31번", "ans": "②", "tr": [["1", "스포츠 저널리즘의 전문직으로서의 지위에는, 특히 인쇄 매체에서, 몹시 역설적인 데가 있다."], ["2", "묘사와 논평이라는 평소의 책무를 이행하는 데 있어 스포츠 사건에 관한 기자들의 기사는 스포츠 팬들이 열심히 찾아 읽고, 스포츠를 여러 형태로 취재한다는 더 넓은 언론인의 역할에서 스포츠 저널리스트들은 모든 동시대 필자들 가운데 가장 눈에 띄는 축에 든다."], ["3", "'유명 인사' 급 스포츠 저널리스트라는 엘리트 계층의 논평은 주요 신문사들이 앞다투어 구하는 것이고, 그들의 고액 계약은 저널리즘의 다른 분야에 있는 동료들에게 부러움의 대상이다."], ["4", "그러나 스포츠 저널리스트들은 자신의 독자 수나 급여의 크기에 상응하는 지위를 자기 직업 안에서 갖고 있지는 못한데, 스포츠가 '뉴스 매체의 장난감 부서'라는 옛말(이제는 상투적인 문구의 지위에 이른)이 스포츠 저널리스트가 하는 일의 가치를 일축하는 말로 여전히 손쉽게 동원되기 때문이다."], ["5", "스포츠 저널리즘을 진지하게 받아들이기를 꺼리는 이 태도는 스포츠 신문 기자들이 많이 읽히지만 거의 존경받지 못한다는 역설적인 결과를 낳는다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "Yet sports journalists do not have a standing in their profession that corresponds to the size of their readerships or of their pay packets, with the old saying ... still readily to hand as a dismissal of the worth of what sports journalists do."}, {"en": false, "h": "빈칸이 <b>much read but little ______</b>라는 <b>대조</b> 안에 들어 있다. 앞의 <b>much read</b>는 이미 2·3번에서 확인된 사실이다. 기사는 많이 읽히고 논평은 신문사들이 앞다투어 구한다. 그렇다면 빈칸에는 그와 <b>반대되는</b> 것, 곧 <b>받지 못하는 무언가</b>가 들어가야 한다. 그것을 찍어 주는 문장이 4번이다. <b>do not have a standing in their profession</b>(직업 안에서의 지위가 없다), <b>a dismissal of the worth of what sports journalists do</b>(그들이 하는 일의 가치를 일축하는 말). 즉 <b>인정·존중을 받지 못한다</b>는 말이므로 빈칸은 ② <b>admired</b>다. 빈칸 문제는 <b>빈칸이 낀 대조 구조</b>부터 잡고, 그 대조를 만들어 낸 앞 문장을 찾아 올라가면 대부분 풀린다."}], "opts": [{"n": "①", "t": "paid (보수를 받는)", "a": false, "x": true, "trap": true, "e": "4번에 <b>pay packets</b>(급여)이 나와서 끌리지만, 그 문장은 오히려 <b>급여는 크다</b>는 쪽이다. 돈을 못 받는 것이 아니라 <b>인정을 못 받는</b> 것이 역설의 핵심이다."}, {"n": "②", "t": "admired (존경받는)", "a": true, "x": false, "trap": false, "e": "4번의 <b>do not have a standing in their profession</b>과 <b>a dismissal of the worth of what sports journalists do</b>가 그대로 '<b>존경받지 못한다</b>'로 이어진다."}, {"n": "③", "t": "censored (검열받는)", "a": false, "x": true, "trap": false, "e": "<b>검열</b>이라는 개념이 지문에 없다. 스포츠 기사가 통제당한다는 언급은 어디에도 나오지 않는다."}, {"n": "④", "t": "challenged (이의가 제기되는)", "a": false, "x": true, "trap": false, "e": "기사의 내용에 <b>반박</b>이 제기된다는 말이 아니다. 문제는 <b>내용의 타당성</b>이 아니라 <b>직업의 위신</b>이다."}, {"n": "⑤", "t": "discussed (논의되는)", "a": false, "x": true, "trap": false, "e": "<b>much read</b>와 뜻이 겹쳐 대조가 성립하지 않는다. 많이 읽히는데 거의 논의되지 않는다는 것은 이 글의 역설이 아니다."}], "w": [["paradoxical", "역설적인"], ["professional status", "전문직으로서의 지위"], ["medium", "매체"], ["discharge", "(직무를) 이행하다"], ["commentary", "논평, 해설"], ["account", "기사, 설명"], ["consult", "참고하다, 찾아보다"], ["cover", "취재하다"], ["visible", "눈에 띄는"], ["contemporary", "동시대의, 현대의"], ["rumination", "숙고, 논평"], ["sought after", "많이 찾는, 인기 있는"], ["lucrative", "돈이 많이 되는"], ["envy", "부러움의 대상"], ["discipline", "분야, 학문 영역"], ["standing", "지위, 평판"], ["correspond to", "~에 상응하다"], ["readership", "독자 수"], ["pay packet", "급여, 봉급"], ["cliché", "상투적인 문구"], ["readily to hand", "언제든 꺼내 쓸 수 있는"], ["dismissal", "무시, 일축"], ["reluctance", "꺼림, 주저함"], ["outcome", "결과"]]}, {"q": "08", "type": "빈칸 추론", "src": "2021학년도 수능 32번", "ans": "③", "tr": [["1", "비슷한 친구를 고르는 데에는 논리적 근거가 있을 수 있다."], ["2", "어떤 환경이 살아남을 만한 곳인지 평가하는 일은 위험할 수 있다(예를 들어 그 환경이 치명적인 곳으로 드러난다면, 그것을 알아차렸을 때는 이미 너무 늦을 수 있다). 그래서 인간은 이 기능을 효율적으로 해내는 하나의 방법으로 자신과 비슷한 개체들과 어울리려는 욕구를 진화시켜 왔다."], ["3", "이것은 아주 다양한 종류의 환경에서 사는 종에게 특히 유용하다."], ["4", "그러나 주어진 환경의 수용력은 이 전략에 제한을 가한다."], ["5", "자원이 매우 제한되어 있다면, 특정한 장소에 사는 개체들이 모두 똑같은 일을 할 수는 없다(예를 들어 나무가 몇 그루 없다면 사람들이 모두 나무 집에 살 수는 없고, 망고가 부족하다면 모두가 오로지 망고만 먹고 살 수는 없다)."], ["6", "따라서 합리적인 전략은 때로는 자기 종 가운데 자신과 비슷한 구성원을 피하는 것이 될 것이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "If resources are very limited, the individuals who live in a particular place cannot all do the exact same thing."}, {"en": false, "h": "빈칸 앞의 <b>However</b>가 방향 전환의 신호다. 1~3번은 <b>비슷한 개체와 어울리는 전략</b>이 왜 유리한지를 설명한다. 그런데 4번이 <b>However</b>로 꺾이고, 5번이 그 이유를 구체적으로 댄다. <b>자원이 제한되면 모두가 똑같이 살 수는 없다</b>는 것이다. 그리고 6번이 결론을 낸다. <b>합리적 전략은 때로 비슷한 구성원을 피하는 것</b>이다. 그렇다면 4번의 <b>carrying capacity</b>(수용력)가 하는 일은 앞서 말한 <b>비슷한 개체와 어울리는 전략</b>에 <b>제동을 거는 것</b>이어야 한다. 따라서 ③ <b>places a limit on this strategy</b>가 정답이다. 빈칸 문항에서 <b>this / that</b> 같은 지시어가 선지에 들어 있으면, 그 지시어가 <b>앞의 무엇을 받는지</b>부터 확정하는 것이 지름길이다. 여기서 <b>this strategy</b>는 2번의 <b>the desire to associate with similar individuals</b>다."}], "opts": [{"n": "①", "t": "exceeds the expected demands of a community (공동체의 예상 수요를 초과한다)", "a": false, "x": true, "trap": false, "e": "수용력이 <b>넘친다</b>면 오히려 모두가 똑같이 살 수 있다는 말이 되어, 5·6번의 <b>자원 부족 → 비슷한 개체를 피함</b>이라는 흐름과 정반대가 된다."}, {"n": "②", "t": "is decreased by diverse means of survival (다양한 생존 방식에 의해 감소된다)", "a": false, "x": true, "trap": false, "e": "<b>다양한 생존 방식이 수용력을 줄인다</b>는 인과는 지문에 없다. 글은 <b>수용력이 전략을 제한한다</b>고 하지 그 반대를 말하지 않는다."}, {"n": "③", "t": "places a limit on this strategy (이 전략에 제한을 가한다)", "a": true, "x": false, "trap": false, "e": "<b>this strategy</b>는 2번의 <b>비슷한 개체와 어울리려는 욕구</b>다. 5번의 자원 제한과 6번의 <b>때로는 비슷한 구성원을 피하라</b>가 곧 그 전략의 <b>한계</b>를 말한다."}, {"n": "④", "t": "makes the world suitable for individuals (세계를 개인들에게 적합하게 만든다)", "a": false, "x": true, "trap": true, "e": "3번의 <b>especially useful</b>만 이어받은 선지다. <b>However</b> 뒤에는 <b>유리하다</b>가 아니라 <b>제약</b>이 와야 문맥이 이어진다."}, {"n": "⑤", "t": "prevents social ties to dissimilar members (닮지 않은 구성원과의 사회적 유대를 막는다)", "a": false, "x": true, "trap": false, "e": "글의 결론(6번)은 오히려 <b>비슷한 구성원을 피하라</b>, 곧 <b>다른 개체 쪽으로 가라</b>는 방향이다. 정반대로 읽은 선지다."}], "w": [["rationale", "논리적 근거, 이유"], ["assess", "평가하다"], ["survivability", "생존 가능성"], ["turn out", "~로 드러나다"], ["deadly", "치명적인"], ["by the time", "~할 때쯤에는"], ["evolve", "진화시키다"], ["associate with", "~와 어울리다"], ["perform", "수행하다"], ["efficiently", "효율적으로"], ["species", "종"], ["carrying capacity", "수용력, 부양 능력"], ["place a limit on", "~에 제한을 가하다"], ["strategy", "전략"], ["in short supply", "공급이 부족한"], ["solely", "오로지, 단독으로"], ["on a diet of", "~을 주식으로"], ["rational", "합리적인, 이성적인"], ["exceed", "초과하다"], ["dissimilar", "닮지 않은"]]}, {"q": "09", "type": "문장 삽입", "src": "2024학년도 6월 39번", "ans": "②", "tr": [["1", "나무들이 함께 자랄 때, 영양분과 물이 그들 모두에게 최적으로 나뉠 수 있어서 각 나무는 될 수 있는 최선의 나무로 자랄 수 있다."], ["2", "소위 경쟁 상대라는 것을 없애 줌으로써 개별 나무를 '돕는다'면, 남아 있는 나무들은 오히려 잃는 것이 생긴다."], ["3", "그 나무들은 이웃에게 신호를 보내지만 소용이 없는데, 그루터기 말고는 아무것도 남아 있지 않기 때문이다."], ["4", "이제 모든 나무가 저마다 혼자 자라면서 생산성에 큰 차이가 생긴다. ( ① )"], ["5", "어떤 개체들은 몸통을 따라 당분이 그야말로 부글거릴 정도로 미친 듯이 광합성을 한다. ( ② )"], ["6", "★ [주어진 문장] 그 결과 그 나무들은 건강하고 더 잘 자라지만, 특별히 오래 살지는 않는다."], ["7", "이는 나무가 자기를 둘러싼 숲이 강한 만큼만 강할 수 있기 때문이다. ( ③ )"], ["8", "그리고 이제 숲에는 패자가 많아진다. ( ④ )"], ["9", "예전 같으면 더 강한 나무들의 도움을 받았을 약한 나무들이 갑자기 뒤처진다. ( ⑤ )"], ["10", "쇠퇴의 이유가 위치와 영양분 부족이든, 일시적인 병이든, 유전적 특성이든, 그 나무들은 이제 곤충과 균류의 먹잇감이 된다."]], "evh": "5·6번 문장", "ev": [{"en": true, "h": "(②) Some individuals photosynthesize like mad until sugar positively bubbles along their trunk. → As a result, they are fit and grow better, but they aren't particularly long-lived. → This is because a tree can be only as strong as the forest that surrounds it."}, {"en": false, "h": "삽입 문항은 <b>주어진 문장의 지시어와 연결어</b>가 전부다. 주어진 문장은 <b>As a result</b>(그 결과)로 시작하고 주어가 <b>they</b>다. 즉 앞에는 <b>they</b>가 가리킬 복수 대상과, <b>건강하고 잘 자란다</b>는 결과를 낳을 원인이 있어야 한다. ②번 앞 문장이 정확히 그것이다. <b>Some individuals photosynthesize like mad</b> — 미친 듯이 광합성하는 <b>어떤 개체들</b>이 <b>they</b>이고, 그 광합성이 <b>fit and grow better</b>의 원인이다. 확인은 뒤쪽에서 한 번 더 된다. ②번 뒤 문장은 <b>This is because ~</b>인데, 이 <b>This</b>가 받는 것은 <b>오래 살지는 못한다</b>는 앞의 반전이어야 <b>숲이 강한 만큼만 강하다</b>는 이유와 이어진다. 주어진 문장을 빼면 <b>This</b>가 받을 말이 사라진다는 점이 결정적이다."}], "opts": [{"n": "①", "t": "Every tree now grows on its own ~ 다음", "a": false, "x": true, "trap": false, "e": "①번 앞은 <b>생산성에 큰 차이가 생긴다</b>는 일반적 서술이다. 주어진 문장의 <b>they</b>가 받을 <b>특정한 개체들</b>이 아직 등장하지 않았다."}, {"n": "②", "t": "Some individuals photosynthesize like mad ~ 다음", "a": true, "x": false, "trap": false, "e": "<b>they</b> = 미친 듯이 광합성하는 <b>some individuals</b>이고, 광합성이 <b>fit and grow better</b>의 원인이 된다. 뒤의 <b>This is because ~</b>도 주어진 문장의 <b>오래 살지 못한다</b>를 받아야 자연스럽다."}, {"n": "③", "t": "This is because a tree can be only as strong as the forest ~ 다음", "a": false, "x": true, "trap": true, "e": "여기에 넣으면 <b>This is because</b>가 받을 내용이 앞에 없어진다. 또 <b>그 결과</b>가 <b>이유 설명</b> 뒤에 오게 되어 인과 순서가 뒤집힌다."}, {"n": "④", "t": "And there are now a lot of losers in the forest. 다음", "a": false, "x": true, "trap": false, "e": "④번 앞뒤는 <b>패자</b>와 <b>약한 나무</b> 이야기다. 주어진 문장의 <b>건강하고 잘 자란다</b>는 내용과 방향이 반대라 끼어들 자리가 없다."}, {"n": "⑤", "t": "Weaker members ~ suddenly fall behind. 다음", "a": false, "x": true, "trap": false, "e": "바로 뒤 문장이 <b>they now fall prey to insects and fungi</b>로 <b>약한 나무들</b>을 이어받는다. 사이에 <b>잘 자라는 나무</b> 이야기가 끼면 <b>they</b>의 지시 대상이 어긋난다."}], "w": [["nutrient", "영양분"], ["optimally", "최적으로"], ["get rid of", "제거하다, 없애다"], ["supposed", "소위 ~라는"], ["remaining", "남아 있는"], ["bereft", "잃은, 상실한"], ["stump", "그루터기"], ["on one's own", "혼자서"], ["give rise to", "~을 낳다, 야기하다"], ["productivity", "생산성"], ["photosynthesize", "광합성하다"], ["like mad", "미친 듯이"], ["positively", "확실히, 그야말로"], ["trunk", "(나무) 몸통"], ["surround", "둘러싸다"], ["fall behind", "뒤처지다"], ["decline", "쇠퇴, 쇠락"], ["passing sickness", "일시적인 병"], ["genetic makeup", "유전적 구성"], ["fall prey to", "~의 먹이가 되다"], ["fungi", "균류"], ["long-lived", "오래 사는"]]}, {"q": "10", "type": "글의 순서", "src": "2022학년도 6월 36번", "ans": "①", "tr": [["1", "[주어진 글] 공간의 기준점은 그 자체보다 크다. 이것이 정말로 역설인 것은 아니다. 랜드마크는 그 자체이기도 하지만, 동시에 자기 주변의 인근 지역까지 규정한다."], ["2", "(A) 여러 대학에서 반복되어 온 전형적인 실험 틀에서, 연구자들은 먼저 학생들에게서 캠퍼스 랜드마크 목록을 수집한다. 그런 다음 다른 학생 집단에게 두 장소 쌍 사이의 거리를 추정하게 하는데, 어떤 것은 랜드마크까지의 거리이고 어떤 것은 캠퍼스의 평범한 건물까지의 거리다."], ["3", "(C) 주목할 만한 발견은, 평범한 장소에서 랜드마크까지의 거리가 랜드마크에서 평범한 장소까지의 거리보다 더 짧다고 판단된다는 점이다. 그래서 사람들은 Pierre의 집에서 에펠탑까지의 거리가 에펠탑에서 Pierre의 집까지의 거리보다 더 짧다고 판단하곤 한다. 블랙홀처럼 랜드마크는 평범한 장소를 자기 쪽으로 끌어당기는 것처럼 보이지만, 평범한 장소는 그렇지 않다."], ["4", "(B) 이러한 거리 추정의 비대칭은 A에서 B까지의 거리가 B에서 A까지의 거리와 반드시 같아야 한다는, 유클리드 거리의 가장 기초적인 원리에 위배된다. 그러므로 거리 판단은 반드시 일관성이 있는 것은 아니다."]], "evh": "(A)-1 → (C)-1 → (B)-1번 문장", "ev": [{"en": true, "h": "In a paradigm ~, researchers first collect a list of campus landmarks. → The remarkable finding is that ~. → This asymmetry of distance estimates violates ~."}, {"en": false, "h": "순서 문항은 <b>실험 → 결과 → 해석</b>이라는 흐름과 <b>지시어</b> 두 가지로 잡는다. 주어진 글은 랜드마크가 주변까지 규정한다는 <b>주장</b>만 던졌으므로, 그것을 확인할 <b>실험 설계</b>가 먼저 와야 한다. 그 자리가 (A)다. <b>researchers first collect ~ Then they ask ~</b>로 절차만 서술하고 결과는 아직 없다. 이어 (C)가 <b>The remarkable finding is that ~</b>로 그 실험의 <b>결과</b>를 말한다. (A)의 <b>estimate the distances</b>를 그대로 받는다. 마지막으로 (B)의 첫 단어 <b>This asymmetry</b>가 결정적이다. <b>비대칭</b>이라는 말은 (C)에서 <b>방향에 따라 거리 판단이 달라진다</b>는 결과가 나온 뒤에야 받을 대상이 생긴다. 따라서 <b>(A) → (C) → (B)</b>다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": true, "x": false, "trap": false, "e": "(A)가 실험 절차, (C)가 그 결과, (B)의 <b>This asymmetry</b>가 (C)의 결과를 받아 해석한다. 흐름이 빈틈없이 이어진다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(B)의 첫 단어 <b>This asymmetry</b>가 받을 <b>비대칭</b>이 주어진 글에 없다. 주어진 글은 <b>랜드마크가 주변을 규정한다</b>는 말일 뿐이다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": false, "x": true, "trap": false, "e": "②와 같은 이유로 (B)가 먼저 올 수 없고, 실험 절차인 (A)가 결과 뒤에 오는 것도 부자연스럽다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": true, "e": "(C)는 <b>The remarkable finding</b>, 곧 <b>어떤 실험의 결과</b>다. 실험 설계인 (A)를 보기 전에 결과부터 나올 수는 없다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": false, "x": true, "trap": false, "e": "④와 같은 이유로 (C)가 먼저 올 수 없다. 게다가 (A)로 끝나면 실험만 소개한 채 글이 마무리되어 결론이 사라진다."}], "w": [["spatial", "공간의, 공간적인"], ["reference point", "기준점"], ["paradox", "역설"], ["landmark", "랜드마크, 주요 지형지물"], ["define", "규정하다, 정의하다"], ["neighborhood", "인근 지역"], ["paradigm", "전형적인 실험 틀"], ["collect", "수집하다"], ["estimate", "추정하다; 추정치"], ["ordinary", "평범한, 보통의"], ["remarkable", "주목할 만한"], ["finding", "발견, 연구 결과"], ["judge", "판단하다"], ["pull A toward B", "A를 B 쪽으로 끌어당기다"], ["asymmetry", "비대칭"], ["violate", "위배하다, 어기다"], ["elementary", "기초적인"], ["principle", "원리, 원칙"], ["Euclidean distance", "유클리드 거리"], ["coherent", "일관성 있는"]]}, {"q": "11", "type": "장문 · 제목", "src": "2016학년도 수능 41번", "ans": "①", "tr": [["1", "알려진 실용적 가치가 전혀 없는 과학을 우리는 기초 과학 또는 기초 연구라고 부를 수 있을 것이다."], ["2", "목성 같은 천체를 탐사하는 일은 기초 과학이라 불릴 텐데, 알려진 실용적 쓰임이 없으니 그런 노력과 비용을 들일 가치가 없다고 주장하기는 쉽다."], ["3", "물론 문제는, 어떤 지식이 쓸모가 있을지는 그 지식을 얻고 나서야 알 수 있다는 점이다."], ["4", "19세기 중반에 Victoria 여왕이 물리학자 Michael Faraday에게 전기와 자기에 관한 그의 실험이 무슨 소용이 있느냐고 물었다고 한다."], ["5", "그는 이렇게 답했다. '부인, 아기는 무슨 소용이 있습니까?'"], ["6", "물론 Faraday의 실험은 전자 시대의 시작이었다."], ["7", "트랜지스터, 백신, 플라스틱처럼 우리 세계를 채우고 있는 과학 지식의 실용적 쓰임 가운데 많은 것이 기초 연구에서 시작되었다."], ["8", "기초 과학 연구는 기술과 공학이 문제를 해결하는 데 쓰는 원재료를 제공한다."], ["9", "기초 과학 연구에는 그것을 단지 기능적이라고 부르는 것이 모욕처럼 느껴질 만큼 귀중한, 또 하나의 중요한 쓰임이 있다."], ["10", "과학은 자연에 대한 연구이며, 자연이 어떻게 작동하는지를 더 알아 갈수록 우리는 이 우주 안에서의 우리 존재가 우리에게 무엇을 의미하는지를 더 알게 된다."], ["11", "다른 천체로 보낸 우주 탐사기에서 얻는, 겉보기에는 비실용적인 지식이 우리 행성과 자연의 체계 안에서 우리가 맡은 역할에 대해 알려 준다."], ["12", "과학은 우리가 어디에 있고 우리가 무엇인지를 알려 주며, 그 지식은 값을 매길 수 없다."]], "evh": "1·8·12번 문장", "ev": [{"en": true, "h": "We might describe science that has no known practical value as basic science ... Basic scientific research provides the raw materials that technology and engineering use to solve problems ... Science tells us where we are and what we are, and that knowledge is beyond value."}, {"en": false, "h": "제목 문항은 <b>글이 무엇을 변호하고 있는가</b>를 한 줄로 잡으면 된다. 이 글은 처음부터 끝까지 <b>기초 과학이 쓸모없어 보이지만 실은 무엇을 주는가</b>를 말한다. 1~3번이 <b>쓸모없어 보인다</b>는 통념을 세우고, 4~6번의 Faraday 일화가 그 통념을 뒤집으며, 7~8번이 <b>실용적 쓰임의 원재료</b>라는 첫 번째 대답을, 9~12번이 <b>우리가 누구이며 어디에 있는지를 알려 준다</b>는 두 번째 대답을 내놓는다. 두 대답 모두 <b>기초 과학이 우리에게 무엇을 가져다주는가</b>라는 하나의 질문에 대한 답이므로 ①이 정확하다. 제목 선지에 <b>고유명사(Faraday)</b>나 <b>일부 소재(위기·목표)</b>만 담긴 것이 있으면 대개 함정이라는 점도 기억해 두자."}], "opts": [{"n": "①", "t": "What Does Basic Science Bring to Us? (기초 과학은 우리에게 무엇을 가져다주는가?)", "a": true, "x": false, "trap": false, "e": "7·8번의 <b>실용적 쓰임의 원재료</b>와 9~12번의 <b>우리 존재에 대한 이해</b>가 모두 <b>기초 과학이 주는 것</b>이라는 하나의 질문에 대한 답이다."}, {"n": "②", "t": "The Crisis of Researchers in Basic Science (기초 과학 연구자들의 위기)", "a": false, "x": true, "trap": false, "e": "연구자들이 <b>위기</b>에 처했다는 언급이 없다. 2번의 <b>not worth the effort and expense</b>는 통념을 소개한 것일 뿐 연구자의 처지를 말한 것이 아니다."}, {"n": "③", "t": "Common Goals of Science and Technology (과학과 기술의 공통 목표)", "a": false, "x": true, "trap": false, "e": "8번에 <b>technology and engineering</b>이 나오지만, 기술은 기초 과학이 준 <b>원재료를 쓰는 쪽</b>으로 등장할 뿐 <b>공통 목표</b>가 논의되지는 않는다."}, {"n": "④", "t": "Technology: The Ultimate Aim of Basic Science (기술, 기초 과학의 궁극적 목표)", "a": false, "x": true, "trap": true, "e": "글의 결론은 오히려 반대다. 9~12번은 기초 과학을 <b>merely functional</b>(단지 기능적)이라 부르는 것조차 모욕이라며, 기술적 응용을 넘어선 가치를 말한다."}, {"n": "⑤", "t": "Michael Faraday, Frontiersman of the Electronic Age! (전자 시대의 개척자 Michael Faraday!)", "a": false, "x": true, "trap": false, "e": "Faraday는 4~6번에서 <b>통념을 뒤집는 하나의 예</b>로만 쓰였다. 글 전체가 그의 생애를 다루지 않으므로 제목이 될 수 없다."}], "w": [["describe A as B", "A를 B라고 표현하다"], ["practical value", "실용적 가치"], ["basic science", "기초 과학"], ["exploration", "탐사, 탐험"], ["Jupiter", "목성"], ["argue", "주장하다"], ["be worth", "~의 가치가 있  (부정확한)", "a": false, "x": true, "trap": false, "e": "지식의 <b>정확성</b>은 이 글의 쟁점이 아니다. 글이 다투는 것은 <b>쓸모</b>가 있느냐 없느냐다."}, {"n": "④", "t": "priceless (값을 매길 수 없이 귀중한)", "a": false, "x": true, "trap": true, "e": "12번의 <b>beyond value</b>와 같은 뜻이라 끌리지만, 그것은 글쓴이가 <b>결론</b>에서 내리는 평가다. <b>seemingly</b> 뒤에 들어가면 '겉보기에는 귀중한'이 되어 반전이 뒤집힌다."}, {"n": "⑤", "t": "resourceful (수완이 좋은)", "a": false, "x": true, "trap": false, "e": "사람의 성격을 묘사하는 형용사라서 <b>knowledge</b>를 꾸미기에 어색하고, 뜻으로도 글의 흐름과 무관하다."}], "w": [["seemingly", "겉보기에는"], ["impractical", "비실용적인"], ["applicable", "적용할 수 있는"], ["space probe", "우주 탐사기"], ["scheme of nature", "자연의 체계"], ["beyond value", "값을 매길 수 없는"], ["insult", "모욕"], ["merely", "단지"], ["functional", "기능적인"], ["existence", "존재"], ["universe", "우주"], ["valuable", "귀중한"]]}]};

  let h='<header><div class="wrap"><div class="row1"><h1>'+esc(TITLE)+'</h1><a class="link" href="index.html">목록</a></div></div></header><div class="wrap hcards">';
  cards.forEach(c=>{
    h+='<button class="hcard" data-v="'+c[0]+'" '+(c[5]?'disabled':'')+'><span class="bn">'+c[1]+'</span><span class="tx"><b>'+c[2]+'</b><small>'+c[3]+'</small></span>'+(c[4]?'<span class="chip '+c[4][0]+'">'+c[4][1]+'</span>':'')+'</button>';
  });
  h+='</div>';
  app.innerHTML=h;
}
function sHtmlP(s){
  let x='<div class="s"><div class="sn"><span class="lb">문장 '+s.n+'</span></div>';
  s.ch.forEach(c=>{x+='<div class="ch"><div class="ce">'+String(c.e).replace(/<\/?b>/g,'')+'</div><div class="ck">'+c.k+'</div></div>';});
  const lays=[];
  if(s.link)lays.push(['이어 읽으면',s.link]);
  if(s.easy)lays.push(['쉬운 말로',s.easy]);
  if(s.gist)lays.push(['결국 이 얘기',s.gist]);
  lays.forEach(l=>{x+='<div class="lay"><span class="lb">'+l[0]+'</span>'+l[1]+'</div>';});
  if(lays.length)x+='<button class="stg" data-names="'+lays.map(l=>l[0]).join('|')+'">'+lays[0][0]+'</button>';
  return x+'</div>';
}
function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div>'+(c.tags&&c.tags[j]?'<div class="ct">'+c.tags[j]+'</div>':'')+'</div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  const names=[];
  if(c.core){x+='<div class="lay core"><span class="lb">핵심</span>'+esc(c.core)+'</div>';names.push('핵심');}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';names.push('자연스러운 해석');
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';

}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
