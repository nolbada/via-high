<title>고3 미니모의고사 24회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}

.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}

.cells{display:flex;flex-direction:column;gap:6px}

.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}

.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}

.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}

.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}

.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}

.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}

.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}

.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}

.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}

.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}

 블랙홀에 빗대어 정리해요."}]}, {"no": "11", "typ": "장문 · 제목", "src": "2016학년도 수능 41번", "evn": [8, 12], "ev_en": "Basic scientific research provides the raw materials that technology and engineering use to solve problems. / Science tells us where we are and what we are, and that knowledge is beyond value.", "ev_ko": [[8, "기초 과학 연구는 기술과 공학이 문제를 해결하는 데 사용하는 원료를 제공한다."], [12, "과학은 우리가 어디에 있고 우리가 무엇인지 알려주며, 그러한 지식은 가치를 넘어선다."]], "why": ["글은 처음에 기초 과학이 알려진 실용적 가치가 없어 보인다는 생각을 소개합니다", "하지만 (8)에서 기초 과학 연구는 기술과 공학이 문제를 해결하는 데 쓰는 원료를 제공한다고 합니다", "이것이 실용적인 쪽의 대답입니다", "이어서 기초 과학에는 단지 기능적이라고 부르기 아까운 또 하나의 쓰임이 있다고 합니다", "그리고 (12)에서 과학은 우리가 어디에 있고 무엇인지 알려 주며, 그 지식은 가치를 넘어선다고 마무리합니다", "두 대답 모두 ‘기초 과학이 우리에게 무엇을 가져다주는가’에 대한 답이므로, 제목은 ①이 알맞습니다."], "ch": [{"n": "①", "t": "What Does Basic Science Bring to Us?", "g": "기초 과학은 우리에게 무엇을 가져다주는가?", "ok": true, "e": ["(8)의 기술과 공학에 쓰이는 원료, (12)의 우리가 어디에 있고 무엇인지 알려 주는 지식이 모두 기초 과학이 우리에게 주는 것입니다", "글 전체가 이 질문에 답합니다."]}, {"n": "②", "t": "The Crisis of Researchers in Basic Science", "g": "기초 과학 연구자들의 위기", "ok": false, "e": ["기초 과학 연구자들이 위기에 처했다는 내용은 없습니다", "(2)는 기초 과학이 가치 없다고 ‘주장하기 쉽다’는 생각을 소개할 뿐입니다."]}, {"n": "③", "t": "Common Goals of Science and Technology", "g": "과학과 기술의 공동 목표", "ok": false, "e": ["(8)에 기술과 공학이 나오지만, 기초 과학이 그것에 원료를 제공한다는 내용입니다", "과학과 기술의 공동 목표는 다루지 않습니다."]}, {"n": "④", "t": "Technology: The Ultimate Aim of Basic Science", "g": "기술: 기초 과학의 궁극적 목표", "ok": false, "e": ["(9)는 기초 과학 연구에 중요한 쓰임이 하나 더 있다고 합니다", "그 쓰임은 단지 기능적이라고 부르면 모욕처럼 보일 만큼 귀중하다고 합니다", "기술이 기초 과학의 궁극적 목표라는 말은 글의 흐름과 맞지 않습니다."]}, {"n": "⑤", "t": "Michael Faraday, Frontiersman of the Electronic Age!", "g": "Michael Faraday, 전자 시대의 개척자!", "ok": false, "e": ["Faraday는 (4)부터 (6)까지 기초 연구의 쓸모를 보여 주는 하나의 예로 나옵니다", "글 전체가 Faraday를 다루지는 않습니다."]}], "tr": ["우리는 알려진 실용적 가치를 전혀 지니지 않은 과학을 기초 과학 또는 기초 연구라고 말할 수 있다.", "목성과 같은 세계에 대한 우리의 탐사는 기초 과학으로 불릴 것인데, 그것(기초 과학)은 알려진 실용적인 용도를 전혀 지니지 않기 때문에 기초 과학이 노력과 비용을 들일 가치가 없다고 주장하기 쉽다.", "물론, 문제는 우리가 그 지식을 얻을 때까지는 어떤 지식이 유용할지 아는 방법이 우리에게 없다는 것이다.", "19세기 중반에, Victoria(빅토리아) 여왕은 물리학자 Michael Faraday(마이클 패러데이)에게 그의 전기와 자성에 관한 실험이 무슨 도움이 되는지 물었다고 한다.", "그(Faraday)는 “여왕님, 아기는 무슨 도움이 됩니까?”라고 대답했다.", "물론, Faraday의 실험은 전자 시대의 시작이 되었다(시초였다).", "우리의 세상을 채우고 있는 과학적 지식의 실용적인 활용들 중 많은 것들 — 트랜지스터, 백신, 플라스틱 — 은 기초 연구로 시작되었다.", "기초 과학 연구는 기술과 공학이 문제를 해결하는 데 사용하는 원료를 제공한다.", "기초 과학 연구는 게다가 매우 중요해서 그것을 단지 기능적인 것으로 언급하는 것이 모욕처럼 보이는 중요한 용도를 한 가지 더 가지고 있다.", "과학은 자연에 대한 학문이며, 우리가 자연이 어떻게 작용하는지에 대해 더 많이 배울수록, 우리는 이 우주에서의 우리의 존재가 우리에게 무엇을 의미하는지에 대해 더 많이 알게 된다.", "우리가 다른 세계에 대한 우주탐사기로부터 얻는 겉보기에 비실용적인 지식들이 우리의 행성과 자연의 체계 속에서 우리 자신의 역할에 대해 우리에게 알려준다.", "과학은 우리가 어디에 있고 우리가 무엇인지 알려주며, 그러한 지식은 가치를 넘어선다."], "ps": [{"n": 1, "ch": [{"e": "We might <b>describe<\/b> science", "k": "우리는 과학을 ~라고 말할 수 있다"}, {"e": "that has no known <b>practical value<\/b>", "k": "알려진 실용적 가치를 전혀 지니지 않은"}, {"e": "as <b>basic science<\/b> or basic research.", "k": "기초 과학 또는 기초 연구라고."}], "easy": "알려진 쓸모가 전혀 없는 과학을 기초 과학, 또는 기초 연구라고 부를 수 있어요.", "gist": "글의 화제 — 기초 과학이란 무엇인가."}, {"n": 2, "ch": [{"e": "Our <b>exploration<\/b> of worlds such as Jupiter", "k": "목성과 같은 세계에 대한 우리의 탐사는"}, {"e": "would be called basic science,", "k": "기초 과학으로 불릴 것이다,"}, {"e": "and it is easy to argue", "k": "그리고 주장하기 쉽다"}, {"e": "that basic science is not worth the effort and <b>expense<\/b>", "k": "기초 과학이 노력과 비용을 들일 가치가 없다고"}, {"e": "because it has no known practical use.", "k": "그것<span class=\"r\">(= 기초 과학)<\/span>은 알려진 실용적인 용도를 전혀 지니지 않기 때문에."}], "link": "목성과 같은 세계에 대한 우리의 탐사는 기초 과학으로 불릴 것인데, 기초 과학은 알려진 실용적인 용도를 전혀 지니지 않기 때문에 노력과 비용을 들일 가치가 없다고 주장하기 쉽다.", "easy": "목성 같은 곳을 탐사하는 것도 기초 과학이에요. 당장 쓸모가 없으니 돈과 노력을 들일 가치가 없다고 말하기 쉬워요.", "gist": "통념 — 쓸모가 없으니 가치도 없다?"}, {"n": 3, "ch": [{"e": "Of course, the problem is", "k": "물론, 문제는 ~라는 것이다"}, {"e": "that we have no way of knowing", "k": "우리가 알 방법이 없다는"}, {"e": "what knowledge will be <b>of use<\/b>", "k": "어떤 지식이 유용할지"}, {"e": "until we <b>acquire<\/b> that knowledge.", "k": "우리가 그 지식을 얻을 때까지는."}], "link": "물론, 문제는 우리가 그 지식을 얻을 때까지는 어떤 지식이 유용할 const $=s=>document.querySelector(s);
const app=$('#app');
let view='home',quiz=null,armed=null;
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();

  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

</b>라는 완전한 주절이 따로 있으므로 <b>부사절</b>이다. 즉 '<b>어느 쪽이든 상관없이</b>'라는 뜻이다. 안쪽 구조도 봐야 한다. 주어는 <b>the reason</b>, 동사는 <b>is</b>이고, 보어 자리에 <b>their location and lack of nutrients</b> · <b>a passing sickness</b> · <b>genetic makeup</b> 세 덩어리가 <b>or</b>로 <b>병렬</b>되어 있다. 마지막의 <b>fall prey to</b>는 '<b>~의 먹이가 되다</b>'라는 관용 표현이라 단어 뜻대로 옮기면 안 된다.", "pe": "\u0001Whether the reason for their decline<sup>1</sup> is their location and lack of nutrients<sup>2</sup>\u0002, / \u0001a passing<sup>3</sup> sickness\u0002, / \u0001or genetic makeup<sup>4</sup>\u0002, / they \u0001now\u0002 fall prey \u0001to<sup>5</sup> insects and fungi<sup>6</sup>\u0002.", "pk": "\u0001그들이 쇠퇴하는 이유가 위치와 영양분 부족이든\u0002, / \u0001일시적인 병이든\u0002, / \u0001아니면 유전적 구성이든\u0002, / 그들은 \u0001이제\u0002 \u0001곤충과 균류의\u0002 먹이가 된다.", "core": "그들은 곤충과 균류의 먹이가 된다.", "tags": ["Whether A, B, or C = 부사절(양보): 주절 꾸밈 (~이든 ~이든). 안쪽: 주어 the reason, 동사 is, 보어 A. for their decline = 형용사구: reason 꾸밈", "B: whether절의 보어 ② 병렬. a passing sickness (passing = 일시적인)", "or: C 보어 ③. genetic makeup", "주어 they + 동사 fall prey. (now) = 부사: fall을 꾸밈. (to insects and fungi) = 전치사구(부사구): fall prey를 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>양보 부사절 + S+V(1형식)</b>이다. 앞 부사절이 길어서 주절이 늦게 나온다."}, {"t": "주절 뼈대이다.", "sub": ["S: they (그들)", "V: fall (fall prey 먹이가 되다. fall prey to ~의 먹이가 되다)", "뼈대 = <b>they fall prey</b>", "now (이제)는 부사, to insects and fungi (곤충과 균류에게)는 거의 필수에 가까운 부사구. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준). (fungi fungus 균류의 복수형)"]}, {"t": "<b>Whether A, B, or C</b>는 <b>양보 부사절</b>이다. 주절을 꾸미며 'A이든 B이든 C이든'이라는 뜻이다.", "sub": ["S: the reason (이유). for their decline (그들의 쇠퇴에 대한)이 꾸민다. decline 쇠퇴", "V: is", "보어: their location and lack of nutrients (위치와 영양분 부족). 이것이 A이다"]}, {"t": "B는 <b>a passing sickness</b> (일시적인 병), C는 <b>genetic makeup</b> (유전적 구성)이다. A, B, C 세 개가 whether절의 보어로 병렬이다. passing은 '일시적인'이라는 형용사이다."}], "sum": "쇠퇴의 이유가 무엇이든 결국 곤충과 균류의 먹이"}, {"i": "05", "q": "10", "s": "C-2", "title": "S+V+O+C(judge ~ to be)", "eng": "So, people would judge<sup>1</sup> the distance<sup>2</sup> from Pierre's house to the Eiffel Tower / to be shorter than the distance / from the Eiffel Tower to Pierre's house.", "notes": [["1", "judge", "판단하다"], ["2", "distance", "거리"]], "lit": "그래서 사람들은 Pierre의 집에서 에펠탑까지의 거리를 판단할 것이다 / 그 거리보다 더 짧다고 / 에펠탑에서 Pierre의 집까지의.", "nat": "그래서 사람들은 Pierre의 집에서 에펠탑까지의 거리가 에펠탑에서 Pierre의 집까지의 거리보다 더 짧다고 판단하곤 한다.", "ana": "<b>judge</b> 뒤에 목적어가 오고 다시 <b>to be</b>가 따라오면 <b>5형식</b>이다. '<b>A가 B라고 판단하다</b>'로 옮기며, <b>judge A to be B</b> 자리에는 <b>think · believe · consider · find</b> 같은 동사도 똑같이 들어갈 수 있다. 여기서 목적어는 <b>the distance from Pierre's house to the Eiffel Tower</b>라는 긴 명사구 전체이고, 목적격보어는 <b>to be shorter than ~</b>이다. 목적어가 길어서 <b>judge</b>와 <b>to be</b>가 멀리 떨어져 보이는 것이지 구조가 달라진 것이 아니다. <b>from A to B</b>가 문장 안에서 두 번 반복되면서 <b>방향만 뒤집힌</b>다는 점이 이 글의 핵심이므로, 해석할 때 두 방향을 혼동하지 않도록 주의하자.", "pe": "\u0001So\u0002, people would judge<sup>1</sup> the distance<sup>2</sup> \u0001from Pierre's house to the Eiffel Tower\u0002 / to be shorter \u0001than the distance\u0002 / \u0001from the Eiffel Tower to Pierre's house\u0002.", "pk": "\u0001그래서\u0002 사람들은 \u0001Pierre의 집에서 에펠탑까지의\u0002 거리를 판단할 것이다 / \u0001그 거리보다\u0002 더 짧다고 / \u0001에펠탑에서 Pierre의 집까지의\u0002.", "core": "사람들은 거리가 더 짧다고 판단할 것이다.", "tags": ["So = 접속부사(그래서). 주어 people, 동사 would judge, 목적어 the distance. from A to B = 형용사구: distance 꾸밈", "judge + O + <b>to be C</b>: 목적격보어 to be shorter (5형식). than the distance = 비교 부사구: shorter 꾸밈", "from the Eiffel Tower to Pierre's house = 형용사구: 비교 대상 the distance 꾸밈 (방향이 반대인 거리)"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식)</b>이다. 목적어와 보어가 모두 길어서 어려워 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: people (사람들)", "V: would judge (judge 판단하다. would는 ~하곤 한다·~할 것이다)", "O: the distance (거리)", "C: to be shorter (더 짧다고)", "뼈대 = <b>people would judge the distance to be shorter</b>", "So (그래서)는 접속부사"]}, {"t": "<b>from Pierre's house to the Eiffel Tower</b>는 <b>전치사구(형용사구)</b>이다. the distance를 꾸미며 'Pierre의 집에서 에펠탑까지의'라는 뜻이다."}, {"t": "<b>than the distance from the Eiffel Tower to Pierre's house</b>는 <b>비교 부사구</b>이다. shorter를 꾸미며 '에펠탑에서 Pierre의 집까지의 거리보다'라는 뜻이다.", "sub": ["뒤 the distance는 앞 distance와 방향만 반대이다", "from the Eiffel Tower to Pierre's house는 그 distance를 꾸미는 형용사구"]}, {"t": "함정: to be shorter는 목적격보어이다. judge + O + to be C 구조이다."}], "sum": "사람들은 같은 거리도 방향에 따라 다르게 짧다고 판단"}, {"i": "06", "q": "11", "s": "2", "title": "수동태(1형식) 절과 가주어 it 절 병렬", "eng": "Our exploration<sup>1</sup> of worlds such as Jupiter<sup>2</sup> would be called basic science, / and it is easy to argue<sup>3</sup> / that basic science is not worth the effort and expense<sup>4</sup> / because it has no known practical use.", "notes": [["1", "exploration", "탐사, 탐험"], ["2", "Jupiter", "목성"], ["3", "argue", "주장하다"], ["4", "expense", "비용"]], "lit": "목성 같은 천체에 대한 우리의 탐사는 기초 과학이라고 불릴 것이다, / 그리고 주장하기는 쉽다 / 기초 과학이 그 노력과 비용을 들일 가치가 없다고 / 그것이 알려진 실용적 쓰임을 갖고 있지 않기 때문에.", "nat": "목성 같은 천체를 탐사하는 일은 기초 과학이라 불릴 텐데, 알려진 실용적 쓰임이 없으니 그런 노력과 비용을 들일 가치가 없다고 주장하기는 쉽다.", "ana": "<b>and</b> 뒤의 <b>it</b>은 앞 절의 내용을 받는 대명사가 <b>아니라</b> 뜻이 없는 <b>가주어</b>다. 진주어는 <b>to argue that ~</b>이고, <b>that</b>절은 다시 <b>argue</b>의 목적어다. 즉 <b>it = to argue that ~</b>이라는 구조를 못 잡으면 문장이 통째로 흔들린다. 앞 절의 <b>would be called</b>는 <b>call A B</b>('A를 B라고 부르다')의 <b>수동</b>이라서 보어 <b>basic science</b>만 뒤에 남았다. <b>would</b>는 여기서 '<b>~일 것이다</b>'라는 완곡한 추측이다. 뒤쪽의 <b>be worth + 명사</b>는 '<b>~의 가치가 있다</b>'로, <b>worth</b>가 전치사처럼 목적어를 바로 받는다는 점을 기억하자.", "pe": "Our exploration<sup>1</sup> \u0001of worlds \u0001such as Jupiter<sup>2</sup>\u0002\u0002 would be called basic science, / and it is easy to argue<sup>3</sup> / that basic science is not worth the effort and expense<sup>4</sup> / \u0001because it has no known practical use\u0002.", "pk": "\u0001\u0001목성 같은\u0002 천체에 대한\u0002 우리의 탐사는 기초 과학이라고 불릴 것이다, / 그리고 주장하기는 쉽다 / 기초 과학이 그 노력과 비용을 들일 가치가 없다고 / \u0001그것이 알려진 실용적 쓰임을 갖고 있지 않기 때문에\u0002.", "core": "우리의 탐사는 기초 과학이라고 불릴 것이고, 주장하기는 쉽다.", "tags": ["주어 Our exploration. of worlds ~ = 형용사구: exploration 꾸밈. such as Jupiter = worlds 꾸밈. 동사 would be called(수동태), 보어 basic science", "and: 병렬. <b>가주어 it</b>, 동사 is, 보어 easy, <b>진주어</b> to argue. argue의 목적어는 다음 that절", "that절 = argue의 목적어(명사절). 주어 basic science, 동사 is, 보어 worth the effort and expense (worth + 명사)", "because ~ = 부사절(이유): is not worth 꾸밈. known = 과거분사: use 꾸밈, practical = 형용사"], "steps": [{"t": "이 문장은 <b>수동태 S+V(1형식) 절과 가주어 it 절(S+V+C, 2형식)이 and로 이어진 문장</b>이다. 문형 기준으로 수동태 주절은 1형식이다. 뒤 절 안에 that절과 because절까지 있어 길어졌다."}, {"t": "앞 절 뼈대이다.", "sub": ["S: Our exploration (우리의 탐사). of worlds such as Jupiter (목성 같은 천체의)가 꾸민다. world 세계·천체", "V: would be called (call 부르다의 수동태, would는 ~일 것이다)", "남은 보어: basic science (기초 과학). call A B(A를 B라고 부르다)의 B가 수동태 뒤에 남은 것이다", "뼈대 = <b>Our exploration would be called basic science</b>"]}, {"t": "뒤 절 뼈대이다.", "sub": ["S: it (가주어)", "V: is", "C: easy (쉬운)", "진주어 = to argue that ~ (~라고 주장하는 것)", "뼈대 = <b>it is easy</b>"]}, {"t": "argue의 목적어는 <b>that절(명사절)</b>이다. 내용은 'basic science is not worth the effort and expense'로, 주어 basic science, 동사 is, 보어 worth ~ (노력과 비용을 들일 가치가 있는)이다. (effort 노력, expense 비용)"}, {"t": "<b>because it has no known practical use</b>는 <b>부사절(이유)</b>이다. '알려진 실용적 쓰임이 없기 때문에'라는 뜻이다. it = basic science이다. (known 알려진, practical 실용적인, use 쓰임)"}, {"t": "함정: worth 뒤에는 명사가 온다. 기준: worth + 명사 또는 -ing."}], "sum": "기초 과학은 쓸모가 없다고 주장하기 쉬움"}, {"i": "07", "q": "11", "s": "4", "title": "be supposed to have p.p. + 간접의문문", "eng": "In the middle of the 19th century, / Queen Victoria is supposed to<sup>1</sup> have asked physicist<sup>2</sup> Michael Faraday / what good his experiments with electricity and magnetism<sup>3</sup> were.", "notes": [["1", "be supposed to", "~라고 여겨지다"], ["2", "physicist", "물리학자"], ["3", "magnetism", "자기(력)"]], "lit": "19세기 중반에, / Victoria 여왕이 물리학자 Michael Faraday에게 물었다고 전해진다 / 전기와 자기에 관한 그의 실험이 무슨 쓸모가 있느냐고.", "nat": "19세기 중반에 Victoria 여왕이 물리학자 Michael Faraday에게 전기와 자기에 관한 그의 실험이 무슨 소용이 있느냐고 물었다고 한다.", "ana": "<b>be supposed to</b>는 두 가지 뜻이 있다. '<b>~하기로 되어 있다</b>'와 '<b>~라고 여겨진다</b>'인데, 여기서는 뒤의 것이다. 게다가 뒤가 <b>to have asked</b>라는 <b>완료부정사</b>다. 완료부정사는 <b>본동사 시제보다 한 시제 앞선 일</b>을 가리키므로, '<b>지금 그렇게 여겨진다 + 물어본 것은 과거의 일</b>'이라는 뜻이 된다. 뒤쪽의 <b>what good his experiments ~ were</b>는 <b>ask</b>의 직접목적어로 들어간 <b>간접의문문</b>이다. 원래 의문문은 <b>What good were his experiments?</b>였지만, 문장 속으로 들어가면서 <b>의문사 + 주어 + 동사</b> 어순으로 바뀌어 <b>were</b>가 맨 뒤로 갔다. <b>ask + 사람 + 의문사절</b>이라는 4형식 틀도 함께 잡아 두자.", "pe": "\u0001In the middle of the 19th century\u0002, / Queen Victoria is supposed to<sup>1</sup> have asked physicist<sup>2</sup> Michael Faraday / what good his experiments \u0001with electricity and magnetism<sup>3</sup>\u0002 were.", "pk": "\u000119세기 중반에\u0002, / Victoria 여왕이 물리학자 Michael Faraday에게 물었다고 전해진다 / \u0001전기와 자기에 관한\u0002 그의 실험이 무슨 쓸모가 있느냐고.", "core": "Victoria 여왕이 Michael Faraday에게 그의 실험이 무슨 쓸모가 있느냐고 물었다고 전해진다.", "tags": ["In the middle of ~ = 전치사구(부사구): 문장 꾸밈 (시기)", "주어 Queen Victoria, 동사 is supposed to have asked(~라고 전해진다), 간접목적어 Faraday. <b>완료부정사</b> to have asked: 전해지는 시점보다 앞선 일", "의문사절 = asked의 직접목적어(간접의문문, 4형식). <b>what good + 주어 + 동사</b> 어순(were가 뒤로). with electricity and magnetism = 형용사구: experiments 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+IO+DO(4형식)</b>이다. 동사가 'be supposed to have p.p.'라는 긴 모양이고, 직접목적어가 의문사절이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Queen Victoria (Victoria 여왕)", "V: is supposed to have asked (물었다고 전해진다. be supposed to ~라고 여겨진다, have asked는 ask 묻다의 완료부정사)", "IO: physicist Michael Faraday (물리학자 Michael Faraday에게)", "DO: what절 (의문사절)", "뼈대 = <b>Queen Victoria is supposed to have asked Faraday + what절</b>"]}, {"t": "맨 앞 <b>In the middle of the 19th century</b>는 <b>전치사구(부사구)</b>이다. 문장 전체를 꾸미며 '19세기 중반에'라는 뜻이다. (century 세기)"}, {"t": "직접목적어 <b>what good his experiments with electricity and magnetism were</b>는 <b>간접의문문</b>이다. '그의 전기와 자기 실험이 무슨 쓸모가 있느냐고'라는 뜻이다.", "sub": ["어순은 what good + 주어 + 동사 (what good were ~가 아니라 평서문 어순)", "with electricity and magnetism (전기와 자기에 관한)는 experiments를 꾸미는 형용사구. experiment 실험, magnetism 자기", "good은 '쓸모·이익'이라는 명사"]}, {"t": "함정: to have asked는 완료부정사이다. '전해지는' 시점보다 질문이 앞섰다는 뜻이다."}], "sum": "Victoria 여왕이 Faraday에게 실험의 쓸모를 물었다는 일화"}, {"i": "08", "q": "11", "s": "7", "title": "주어 + 관계절 + 대시 삽입 + 동사", "eng": "Many of the practical<sup>1</sup> uses of scientific knowledge / that fill our world / — transistors<sup>2</sup>, vaccines, plastics — / began as basic research<sup>3</sup>.", "notes": [["1", "practical", "실용적인"], ["2", "transistor", "트랜지스터"], ["3", "basic research", "기초 연구"]], "lit": "과학 지식의 실용적 쓰임 가운데 많은 것은 / 우리 세계를 채우고 있는 / — 트랜지스터, 백신, 플라스틱 같은 것들인데 — / 기초 연구로 시작되었다.", "nat": "트랜지스터, 백신, 플라스틱처럼 우리 세계를 채우고 있는 과학 지식의 실용적 쓰임 가운데 많은 것이 기초 연구에서 시작되었다.", "ana": "주어는 <b>Many of the practical uses</b>이고 동사는 맨 끝의 <b>began</b>이다. 그 사이가 전부 수식어라서 거리가 멀어 보일 뿐이다. <b>that fill our world</b>는 주격 관계대명사절인데, 동사가 <b>fills</b>가 아니라 <b>fill</b>인 이유를 설명할 수 있어야 한다. 선행사가 바로 앞의 <b>knowledge</b>가 아니라 <b>the practical uses</b>(복수)이기 때문이다. <b>관계사절의 동사는 선행사의 수를 따른다</b>는 원칙이 그대로 적용된 자리다. 대시 사이의 세 명사는 <b>the practical uses</b>를 구체적으로 나열한 <b>동격</b>이므로 지우고 읽어도 뼈대는 그대로다. 마지막의 <b>begin as</b>는 '<b>~로 시작하다</b>'이며, 이때 <b>as</b>도 '<b>~로서</b>'라는 자격의 전치사다.", "pe": "Many of the \u0001practical<sup>1</sup>\u0002 uses \u0001of scientific knowledge\u0002 / \u0001that fill our world\u0002 / — \u0001transistors<sup>2</sup>, vaccines, plastics\u0002 — / began \u0001as basic research<sup>3</sup>\u0002.", "pk": "\u0001과학 지식의\u0002 \u0001실용적\u0002 쓰임 가운데 많은 것은 / \u0001우리 세계를 채우고 있는\u0002 / — \u0001트랜지스터, 백신, 플라스틱 같은 것들인데\u0002 — / \u0001기초 연구로\u0002 시작되었다.", "core": "실용적 쓰임 가운데 많은 것은 시작되었다.", "tags": ["주어 Many of the uses. practical = 형용사, of scientific knowledge = 형용사구: uses 꾸밈. 동사가 나올 때까지 기다림", "that fill our world = 주격 관계절(형용사절): uses 꾸밈. 선행사가 복수 uses라서 동사 fill", "대시 삽입: transistors, vaccines, plastics = 동격 어구(예시): uses 부연", "동사 began(1형식). as basic research = 전치사구(부사구): began 꾸밈, <b>거의 필수에 가까운 부사구</b> (~로 시작하다) [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 주어 뒤에 관계절과 삽입이 있어 동사가 맨 끝에 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Many of the practical uses (실용적 쓰임들 중 많은 것)", "V: began (begin 시작하다의 과거형)", "뼈대 = <b>Many of the uses began</b>", "of scientific knowledge (과학 지식의)는 uses를 꾸미는 형용사구"]}, {"t": "<b>that fill our world</b>는 <b>주격 관계절(형용사절)</b>이다. uses를 꾸미며 '우리 세계를 채우고 있는'이라는 뜻이다.", "sub": ["선행사 uses가 복수라 동사가 fill (3인칭 단수 fills가 아님)"]}, {"t": "<b>— transistors, vaccines, plastics —</b>는 <b>삽입 예시</b>이다. uses를 구체적으로 풀어 주며 '트랜지스터, 백신, 플라스틱'이라는 뜻이다. (transistor 트랜지스터, vaccine 백신, plastic 플라스틱)"}, {"t": "<b>as basic research</b>는 begin as (~로 시작하다)의 일부라 <b>거의 필수에 가까운 부사구</b>이다. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준). '기초 연구로'라는 뜻이다."}, {"t": "함정: Many의 동사는 맨 끝 began이다. 중간의 fill은 관계절의 동사일 뿐이다."}], "sum": "실용적 쓰임의 상당수가 기초 연구에서 출발"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2023학년도 수능 31번", "ans": "②", "tr": [["1", "스포츠 저널리즘의 전문직으로서의 지위에는, 특히 인쇄 매체에서, 몹시 역설적인 데가 있다."], ["2", "묘사와 논평이라는 평소의 책무를 이행하는 데 있어 스포츠 사건에 관한 기자들의 기사는 스포츠 팬들이 열심히 찾아 읽고, 스포츠를 여러 형태로 취재한다는 더 넓은 언론인의 역할에서 스포츠 저널리스트들은 모든 동시대 필자들 가운데 가장 눈에 띄는 축에 든다."], ["3", "'유명 인사' 급 스포츠 저널리스트라는 엘리트 계층의 논평은 주요 신문사들이 앞다투어 구하는 것이고, 그들의 고액 계약은 저널리즘의 다른 분야에 있는 동료들에게 부러움의 대상이다."], ["4", "그러나 스포츠 저널리스트들은 자신의 독자 수나 급여의 크기에 상응하는 지위를 자기 직업 안에서 갖고 있지는 못한데, 스포츠가 '뉴스 매체의 장난감 부서'라는 옛말(이제는 상투적인 문구의 지위에 이른)이 스포츠 저널리스트가 하는 일의 가치를 일축하는 말로 여전히 손쉽게 동원되기 때문이다."], ["5", "스포츠 저널리즘을 진지하게 받아들이기를 꺼리는 이 태도는 스포츠 신문 기자들이 많이 읽히지만 거의 존경받지 못한다는 역설적인 결과를 낳는다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "Yet sports journalists do not have a standing in their profession that corresponds to the size of their readerships or of their pay packets, with the old saying ... still readily to hand as a dismissal of the worth of what sports journalists do."}, {"en": false, "h": "빈칸이 <b>much read but little ______</b>라는 <b>대조</b> 안에 들어 있다. 앞의 <b>much read</b>는 이미 2·3번에서 확인된 사실이다. 기사는 많이 읽히고 논평은 신문사들이 앞다투어 구한다. 그렇다면 빈칸에는 그와 <b>반대되는</b> 것, 곧 <b>받지 못하는 무언가</b>가 들어가야 한다. 그것을 찍어 주는 문장이 4번이다. <b>do not have a standing in their profession</b>(직업 안에서의 지위가 없다), <b>a dismissal of the worth of what sports journalists do</b>(그들이 하는 일의 가치를 일축하는 말). 즉 <b>인정·존중을 받지 못한다</b>는 말이므로 빈칸은 ② <b>admired</b>다. 빈칸 문제는 <b>빈칸이 낀 대조 구조</b>부터 잡고, 그 대조를 만들어 낸 앞 문장을 찾아 올라가면 대부분 풀린다."}], "opts": [{"n": "①", "t": "paid (보수를 받는)", "a": false, "x": true, "trap": true, "e": "4번에 <b>pay packets</b>(급여)이 나와서 끌리지만, 그 문장은 오히려 <b>급여는 크다</b>는 쪽이다. 돈을 못 받는 것이 아니라 <b>인정을 못 받는</b> 것이 역설의 핵심이다."}, {"n": "②", "t": "admired (존경받는)", "a": true, "x": false, "trap": false, "e": "4번의 <b>do not have a standing in their profession</b>과 <b>a dismissal of the worth of what sports journalists do</b>가 그대로 '<b>존경받지 못한다</b>'로 이어진다."}, {"n": "③", "t": "censored (검열받는)", "a": false, "x": true, "trap": false, "e": "<b>검열</b>이라는 개념이 지문에 없다. 스포츠 기사가 통제당한다는 언급은 어디에도 나오지 않는다."}, {"n": "④", "t": "challenged (이의가 제기되는)", "a": false, "x": true, "trap": false, "e": "기사의 내용에 <b>반박</b>이 제기된다는 말이 아니다. 문제는 <b>내용의 타당성</b>이 아니라 <b>직업의 위신</b>이다."}, {"n": "⑤", "t": "discussed (논의되는)", "a": false, "x": true, "trap": false, "e": "<b>much read</b>와 뜻이 겹쳐 대조가 성립하지 않는다. 많이 읽히는데 거의 논의되지 않는다는 것은 이 글의 역설이 아니다."}], "w": [["paradoxical", "역설적인"], ["professional status", "전문직으로서의 지위"], ["medium", "매체"], ["discharge", "(직무를) 이행하다"], ["commentary", "논평, 해설"], ["account", "기사, 설명"], ["consult", "참고하다, 찾아보다"], ["cover", "취재하다"], ["visible", "눈에 띄는"], ["contemporary", "동시대의, 현대의"], ["rumination", "숙고, 논평"], ["sought after", "많이 찾는, 인기 있는"], ["lucrative", "돈이 많이 되는"], ["envy", "부러움의 대상"], ["discipline", "분야, 학문 영역"], ["standing", "지위, 평판"], ["correspond to", "~에 상응하다"], ["readership", "독자 수"], ["pay packet", "급여, 봉급"], ["cliché", "상투적인 문구"], ["readily to hand", "언제든 꺼내 쓸 수 있는"], ["dismissal", "무시, 일축"], ["reluctance", "꺼림, 주저함"], ["outcome", "결과"]]}, {"q": "08", "type": "빈칸 추론", "src": "2021학년도 수능 32번", "ans": "③", "tr": [["1", "비슷한 친구를 고르는 데에는 논리적 근거가 있을 수 있다."], ["2", "어떤 환경이 살아남을 만한 곳인지 평가하는 일은 위험할 수 있다(예를 들어 그 환경이 치명적인 곳으로 드러난다면, 그것을 알아차렸을 때는 이미 너무 늦을 수 있다). 그래서 인간은 이 기능을 효율적으로 해내는 하나의 방법으로 자신과 비슷한 개체들과 어울리려는 욕구를 진화시켜 왔다."], ["3", "이것은 아주 다양한 종류의 환경에서 사는 종에게 특히 유용하다."], ["4", "그러나 주어진 환경의 수용력은 이 전략에 제한을 가한다."], ["5", "자원이 매우 제한되어 있다면, 특정한 장소에 사는 개체들이 모두 똑같은 일을 할 수는 없다(예를 들어 나무가 몇 그루 없다면 사람들이 모두 나무 집에 살 수는 없고, 망고가 부족하다면 모두가 오로지 망고만 먹고 살 수는 없다)."], ["6", "따라서 합리적인 전략은 때로는 자기 종 가운데 자신과 비슷한 구성원을 피하는 것이 될 것이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "If resources are very limited, the individuals who live in a particular place cannot all do the exact same thing."}, {"en": false, "h": "빈칸 앞의 <b>However</b>가 방향 전환의 신호다. 1~3번은 <b>비슷한 개체와 어울리는 전략</b>이 왜 유리한지를 설명한다. 그런데 4번이 <b>However</b>로 꺾이고, 5번이 그 이유를 구체적으로 댄다. <b>자원이 제한되면 모두가 똑같이 살 수는 없다</b>는 것이다. 그리고 6번이 결론을 낸다. <b>합리적 전략은 때로 비슷한 구성원을 피하는 것</b>이다. 그렇다면 4번의 <b>carrying capacity</b>(수용력)가 하는 일은 앞서 말한 <b>비슷한 개체와 어울리는 전략</b>에 <b>제동을 거는 것</b>이어야 한다. 따라서 ③ <b>places a limit on this strategy</b>가 정답이다. 빈칸 문항에서 <b>this / that</b> 같은 지시어가 선지에 들어 있으면, 그 지시어가 <b>앞의 무엇을 받는지</b>부터 확정하는 것이 지름길이다. 여기서 <b>this strategy</b>는 2번의 <b>the desire to associate with similar individuals</b>다."}], "opts": [{"n": "①", "t": "exceeds the expected demands of a community (공동체의 예상 수요를 초과한다)", "a": false, "x": true, "trap": false, "e": "수용력이 <b>넘친다</b>면 오히려 모두가 똑같이 살 수 있다는 말이 되어, 5·6번의 <b>자원 부족 → 비슷한 개체를 피함</b>이라는 흐름과 정반대가 된다."}, {"n": "②", "t": "is decreased by diverse means of survival (다양한 생존 방식에 의해 감소된다)", "a": false, "x": true, "trap": false, "e": "<b>다양한 생존 방식이 수용력을 줄인다</b>는 인과는 지문에 없다. 글은 <b>수용력이 전략을 제한한다</b>고 하지 그 반대를 말하지 않는다."}, {"n": "③", "t": "places a limit on this strategy (이 전략에 제한을 가한다)", "a": true, "x": false, "trap": false, "e": "<b>this strategy</b>는 2번의 <b>비슷한 개체와 어울리려는 욕구</b>다. 5번의 자원 제한과 6번의 <b>때로는 비슷한 구성원을 피하라</b>가 곧 그 전략의 <b>한계</b>를 말한다."}, {"n": "④", "t": "makes the world suitable for individuals (세계를 개인들에게 적합하게 만든다)", "a": false, "x": true, "trap": true, "e": "3번의 <b>especially useful</b>만 이어받은 선지다. <b>However</b> 뒤에는 <b>유리하다</b>가 아니라 <b>제약</b>이 와야 문맥이 이어진다."}, {"n": "⑤", "t": "prevents social ties to dissimilar members (닮지 않은 구성원과의 사회적 유대를 막는다)", "a": false, "x": true, "trap": false, "e": "글의 결론(6번)은 오히려 <b>비슷한 구성원을 피하라</b>, 곧 <b>다른 개체 쪽으로 가라</b>는 방향이다. 정반대로 읽은 선지다."}], "w": [["rationale", "논리적 근거, 이유"], ["assess", "평가하다"], ["survivability", "생존 가능성"], ["turn out", "~로 드러나다"], ["deadly", "치명적인"], ["by the time", "~할 때쯤에는"], ["evolve", "진화시키다"], ["associate with", "~와 어울리다"], ["perform", "수행하다"], ["efficiently", "효율적으로"], ["species", "종"], ["carrying capacity", "수용력, 부양 능력"], ["place a limit on", "~에 제한을 가하다"], ["strategy", "전략"], ["in short supply", "공급이 부족한"], ["solely", "오로지, 단독으로"], ["on a diet of", "~을 주식으로"], ["rational", "합리적인, 이성적인"], ["exceed", "초과하다"], ["dissimilar", "닮지 않은"]]}, {"q": "09", "type": "문장 삽입", "src": "2024학년도 6월 39번", "ans": "②", "tr": [["1", "나무들이 함께 자랄 때, 영양분과 물이 그들 모두에게 최적으로 나뉠 수 있어서 각 나무는 될 수 있는 최선의 나무로 자랄 수 있다."], ["2", "소위 경쟁 상대라는 것을 없애 줌으로써 개별 나무를 '돕는다'면, 남아 있는 나무들은 오히려 잃는 것이 생긴다."], ["3", "그 나무들은 이웃에게 신호를 보내지만 소용이 없는데, 그루터기 말고는 아무것도 남아 있지 않기 때문이다."], ["4", "이제 모든 나무가 저마다 혼자 자라면서 생산성에 큰 차이가 생긴다. ( ① )"], ["5", "어떤 개체들은 몸통을 따라 당분이 그야말로 부글거릴 정도로 미친 듯이 광합성을 한다. ( ② )"], ["6", "★ [주어진 문장] 그 결과 그 나무들은 건강하고 더 잘 자라지만, 특별히 오래 살지는 않는다."], ["7", "이는 나무가 자기를 둘러싼 숲이 강한 만큼만 강할 수 있기 때문이다. ( ③ )"], ["8", "그리고 이제 숲에는 패자가 많아진다. ( ④ )"], ["9", "예전 같으면 더 강한 나무들의 도움을 받았을 약한 나무들이 갑자기 뒤처진다. ( ⑤ )"], ["10", "쇠퇴의 이유가 위치와 영양분 부족이든, 일시적인 병이든, 유전적 특성이든, 그 나무들은 이제 곤충과 균류의 먹잇감이 된다."]], "evh": "5·6번 문장", "ev": [{"en": true, "h": "(②) Some individuals photosynthesize like mad until sugar positively bubbles along their trunk. → As a result, they are fit and grow better, but they aren't particularly long-lived. → This is because a tree can be only as strong as the forest that surrounds it."}, {"en": false, "h": "삽입 문항은 <b>주어진 문장의 지시어와 연결어</b>가 전부다. 주어진 문장은 <b>As a result</b>(그 결과)로 시작하고 주어가 <b>they</b>다. 즉 앞에는 <b>they</b>가 가리킬 복수 대상과, <b>건강하고 잘 자란다</b>는 결과를 낳을 원인이 있어야 한다. ②번 앞 문장이 정확히 그것이다. <b>Some individuals photosynthesize like mad</b> — 미친 듯이 광합성하는 <b>어떤 개체들</b>이 <b>they</b>이고, 그 광합성이 <b>fit and grow better</b>의 원인이다. 확인은 뒤쪽에서 한 번 더 된다. ②번 뒤 문장은 <b>This is because ~</b>인데, 이 <b>This</b>가 받는 것은 <b>오래 살지는 못한다</b>는 앞의 반전이어야 <b>숲이 강한 만큼만 강하다</b>는 이유와 이어진다. 주어진 문장을 빼면 <b>This</b>가 받을 말이 사라진다는 점이 결정적이다."}], "opts": [{"n": "①", "t": "Every tree now grows on its own ~ 다음", "a": false, "x": true, "trap": false, "e": "①번 앞은 <b>생산성에 큰 차이가 생긴다</b>는 일반적 서술이다. 주어진 문장의 <b>they</b>가 받을 <b>특정한 개체들</b>이 아직 등장하지 않았다."}, {"n": "②", "t": "Some individuals photosynthesize like mad ~ 다음", "a": true, "x": false, "trap": false, "e": "<b>they</b> = 미친 듯이 광합성하는 <b>some individuals</b>이고, 광합성이 <b>fit and grow better</b>의 원인이 된다. 뒤의 <b>This is because ~</b>도 주어진 문장의 <b>오래 살지 못한다</b>를 받아야 자연스럽다."}, {"n": "③", "t": "This is because a tree can be only as strong as the forest ~ 다음", "a": false, "x": true, "trap": true, "e": "여기에 넣으면 <b>This is because</b>가 받을 내용이 앞에 없어진다. 또 <b>그 결과</b>가 <b>이유 설명</b> 뒤에 오게 되어 인과 순서가 뒤집힌다."}, {"n": "④", "t": "And there are now a lot of losers in the forest. 다음", "a": false, "x": true, "trap": false, "e": "④번 앞뒤는 <b>패자</b>와 <b>약한 나무</b> 이야기다. 주어진 문장의 <b>건강하고 잘 자란다</b>는 내용과 방향이 반대라 끼어들 자리가 없다."}, {"n": "⑤", "t": "Weaker members ~ suddenly fall behind. 다음", "a": false, "x": true, "trap": false, "e": "바로 뒤 문장이 <b>they now fall prey to insects and fungi</b>로 <b>약한 나무들</b>을 이어받는다. 사이에 <b>잘 자라는 나무</b> 이야기가 끼면 <b>they</b>의 지시 대상이 어긋난다."}], "w": [["nutrient", "영양분"], ["optimally", "최적으로"], ["get rid of", "제거하다, 없애다"], ["supposed", "소위 ~라는"], ["remaining", "남아 있는"], ["bereft", "잃은, 상실한"], ["stump", "그루터기"], ["on one's own", "혼자서"], ["give rise to", "~을 낳다, 야기하다"], ["productivity", "생산성"], ["photosynthesize", "광합성하다"], ["like mad", "미친 듯이"], ["positively", "확실히, 그야말로"], ["trunk", "(나무) 몸통"], ["surround", "둘러싸다"], ["fall behind", "뒤처지다"], ["decline", "쇠퇴, 쇠락"], ["passing sickness", "일시적인 병"], ["genetic makeup", "유전적 구성"], ["fall prey to", "~의 먹이가 되다"], ["fungi", "균류"], ["long-lived", "오래 사는"]]}, {"q": "10", "type": "글의 순서", "src": "2022학년도 6월 36번", "ans": "①", "tr": [["1", "[주어진 글] 공간의 기준점은 그 자체보다 크다. 이것이 정말로 역설인 것은 아니다. 랜드마크는 그 자체이기도 하지만, 동시에 자기 주변의 인근 지역까지 규정한다."], ["2", "(A) 여러 대학에서 반복되어 온 전형적인 실험 틀에서, 연구자들은 먼저 학생들에게서 캠퍼스 랜드마크 목록을 수집한다. 그런 다음 다른 학생 집단에게 두 장소 쌍 사이의 거리를 추정하게 하는데, 어떤 것은 랜드마크까지의 거리이고 어떤 것은 캠퍼스의 평범한 건물까지의 거리다."], ["3", "(C) 주목할 만한 발견은, 평범한 장소에서 랜드마크까지의 거리가 랜드마크에서 평범한 장소까지의 거리보다 더 짧다고 판단된다는 점이다. 그래서 사람들은 Pierre의 집에서 에펠탑까지의 거리가 에펠탑에서 Pierre의 집까지의 거리보다 더 짧다고 판단하곤 한다. 블랙홀처럼 랜드마크는 평범한 장소를 자기 쪽으로 끌어당기는 것처럼 보이지만, 평범한 장소는 그렇지 않다."], ["4", "(B) 이러한 거리 추정의 비대칭은 A에서 B까지의 거리가 B에서 A까지의 거리와 반드시 같아야 한다는, 유클리드 거리의 가장 기초적인 원리에 위배된다. 그러므로 거리 판단은 반드시 일관성이 있는 것은 아니다."]], "evh": "(A)-1 → (C)-1 → (B)-1번 문장", "ev": [{"en": true, "h": "In a paradigm ~, researchers first collect a list of campus landmarks. → The remarkable finding is that ~. → This asymmetry of distance estimates violates ~."}, {"en": false, "h": "순서 문항은 <b>실험 → 결과 → 해석</b>이라는 흐름과 <b>지시어</b> 두 가지로 잡는다. 주어진 글은 랜드마크가 주변까지 규정한다는 <b>주장</b>만 던졌으므로, 그것을 확인할 <b>실험 설계</b>가 먼저 와야 한다. 그 자리가 (A)다. <b>researchers first collect ~ Then they ask ~</b>로 절차만 서술하고 결과는 아직 없다. 이어 (C)가 <b>The remarkable finding is that ~</b>로 그 실험의 <b>결과</b>를 말한다. (A)의 <b>estimate the distances</b>를 그대로 받는다. 마지막으로 (B)의 첫 단어 <b>This asymmetry</b>가 결정적이다. <b>비대칭</b>이라는 말은 (C)에서 <b>방향에 따라 거리 판단이 달라진다</b>는 결과가 나온 뒤에야 받을 대상이 생긴다. 따라서 <b>(A) → (C) → (B)</b>다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": true, "x": false, "trap": false, "e": "(A)가 실험 절차, (C)가 그 결과, (B)의 <b>This asymmetry</b>가 (C)의 결과를 받아 해석한다. 흐름이 빈틈없이 이어진다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(B)의 첫 단어 <b>This asymmetry</b>가 받을 <b>비대칭</b>이 주어진 글에 없다. 주어진 글은 <b>랜드마크가 주변을 규정한다</b>는 말일 뿐이다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": false, "x": true, "trap": false, "e": "②와 같은 이유로 (B)가 먼저 올 수 없고, 실험 절차인 (A)가 결과 뒤에 오는 것도 부자연스럽다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": true, "e": "(C)는 <b>The remarkable finding</b>, 곧 <b>어떤 실험의 결과</b>다. 실험 설계인 (A)를 보기 전에 결과부터     if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });

function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
