function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}

var EXP={"07": "<div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>much read but little ( ? )</b>(많이 읽히지만 거의 ~하지 못한다)라는 대조 안에 있어요. 많이 읽힌다(2·3번)의 <b>반대편</b>을 4번 <b>Yet</b>(그러나) 문장에서 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (5번)</span><div class=\"en\">… the paradoxical outcome that sports newspaper writers are <mark>much read</mark> but little <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">스포츠 신문 기자들은 <mark>많이 읽히지만</mark> 거의 ( ? ) 못한다는 역설적인 결과</p></div><div class=\"ck-via\"><i>▼</i><span>much read(많이 읽힌다)가 사실인지 앞에서 확인</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 많이 읽힌다</span><div class=\"en\">… reporters’ accounts of sports events are <mark>eagerly consulted</mark> by sports fans …</div><p class=\"ko\">스포츠 경기에 대한 기자들의 기사는 스포츠 팬들이 <mark>열심히 찾아 읽는다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>인기도 많고 돈도 많이 버니, 부족한 건 따로 있다는 뜻</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 돈도 많이 번다</span><div class=\"en\">… their <mark>lucrative contracts</mark> being the envy of colleagues in other ‘disciplines’ of journalism.</div><p class=\"ko\">그들의 <mark>돈을 많이 버는 계약</mark>은 다른 분야 동료들의 부러움의 대상이다</p></div><div class=\"ck-via\"><i>▼</i><span>Yet(그러나)로 꺾이며 “못 받는 것”이 드러나요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\"><mark>Yet</mark> sports journalists <mark>do not have a standing</mark> in their profession … as a <mark>dismissal of the worth</mark> of what sports journalists do.</div><p class=\"ko\"><mark>그러나</mark> 스포츠 저널리스트들은 직업 안에서 <mark>지위를 갖고 있지 않다</mark> … 그들이 하는 일의 <mark>가치를 일축하는</mark> 말로</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">admired 존경받는<small>4번 지위 없음·가치 일축(dismissal 일축)을 한 단어로 받으면 “존경받지 못함”이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">paid 보수를 받는</span><span class=\"why\">3번 lucrative contracts(돈을 많이 버는 계약)와 4번 pay packets(급여)를 보면 돈은 많이 받아요. little paid(거의 못 받는다)는 지문과 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">censored 검열받는</span><span class=\"why\">기사를 막거나 고치는 검열 이야기는 지문에 한 번도 없어요. 4번이 말하는 건 일의 가치를 무시당한다는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">challenged 이의가 제기되는</span><span class=\"why\">누가 기사 내용에 반박한다는 말은 없어요. 4번은 반박이 아니라 “장난감 부서”라며 깎아내린다는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">discussed 논의되는</span><span class=\"why\">2·3번에서 팬과 신문사가 앞다퉈 찾으니 관심은 많아요. 부족한 건 관심이 아니라 4번의 standing(지위)과 worth(가치) 인정이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There is something deeply paradoxical</div><div class=\"k\">매우 역설적인 무언가가 있다</div></div><div class=\"rc\"><div class=\"e\">about the professional status of sports journalism,</div><div class=\"k\">스포츠 저널리즘의 전문직으로서의 지위에는,</div></div><div class=\"rc\"><div class=\"e\">especially in the medium of print.</div><div class=\"k\">특히 인쇄 매체에서.</div></div><div class=\"rnat\">스포츠 저널리즘의 전문직으로서의 지위에는, 특히 인쇄 매체에서, 매우 역설적인 무언가가 있다.</div><div class=\"rst\">학교 신문 스포츠 코너를 쓰는 민수 이야기는 좀 <b>앞뒤가 안 맞아요</b>(paradoxical 역설적인). = 지문 1번, 스포츠 기자의 지위에는 역설이 있다.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">In discharging their usual responsibilities</div><div class=\"k\">그들(= 스포츠 기자들)의 평소 책무를 이행하는 데 있어서</div></div><div class=\"rc\"><div class=\"e\">of description and commentary,</div><div class=\"k\">묘사와 논평이라는,</div></div><div class=\"rc\"><div class=\"e\">reporters’ accounts of sports events</div><div class=\"k\">스포츠 경기에 대한 기자들의 기사는</div></div><div class=\"rc\"><div class=\"e\">are eagerly consulted by sports fans,</div><div class=\"k\">스포츠 팬들이 열심히 찾아 읽는다,</div></div><div class=\"rc\"><div class=\"e\">while in their broader journalistic role</div><div class=\"k\">그리고 그들(= 스포츠 기자들)의 더 넓은 언론인으로서의 역할에서는</div></div><div class=\"rc\"><div class=\"e\">of covering sport in its many forms,</div><div class=\"k\">스포츠를 그것(= 스포츠)의 여러 형태로 취재하는,</div></div><div class=\"rc\"><div class=\"e\">sports journalists are among the most visible</div><div class=\"k\">스포츠 저널리스트들은 가장 눈에 띄는 사람들에 속한다</div></div><div class=\"rc\"><div class=\"e\">of all contemporary writers.</div><div class=\"k\">모든 동시대 작가들 가운데.</div></div><div class=\"rnat\">묘사와 논평이라는 평소의 책무를 이행하는 데 있어서 스포츠 경기에 대한 기자들의 기사는 스포츠 팬들이 열심히 찾아 읽고, 스포츠를 여러 형태로 취재하는 더 넓은 언론인의 역할에서 스포츠 저널리스트들은 모든 동시대 작가들 가운데 가장 눈에 띄는 사람들에 속한다.</div><div class=\"rst\">축구 경기 기사가 나오면 반 친구들이 <b>앞다퉈 찾아 읽고</b>, 민수는 학교에서 제일 눈에 띄는 기자예요. = 지문 2번, 팬들이 기사를 열심히 찾아 읽는다.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">The ruminations of the elite class</div><div class=\"k\">엘리트 계층의 생각(논평)은</div></div><div class=\"rc\"><div class=\"e\">of ‘celebrity’ sports journalists</div><div class=\"k\">‘유명 인사’ 스포츠 저널리스트라는</div></div><div class=\"rc\"><div class=\"e\">are much sought after by the major newspapers,</div><div class=\"k\">주요 신문사들이 매우 많이 찾는다,</div></div><div class=\"rc\"><div class=\"e\">their lucrative contracts being the envy of colleagues</div><div class=\"k\">그리고 그들(= 유명 스포츠 저널리스트들)의 돈을 많이 버는 계약은 동료들의 부러움의 대상이다</div></div><div class=\"rc\"><div class=\"e\">in other ‘disciplines’ of journalism.</div><div class=\"k\">저널리즘의 다른 ‘분야’에 있는.</div></div><div class=\"rnat\">‘유명 인사’ 스포츠 저널리스트라는 엘리트 계층의 생각은 주요 신문사들이 매우 많이 찾으며, 그들의 돈을 많이 버는 계약은 저널리즘의 다른 ‘분야’에 있는 동료들의 부러움의 대상이다.</div><div class=\"rst\">다른 반 신문부도 민수 글을 서로 받아 가려 하고, 상품도 많이 받아서 다들 부러워해요. = 지문 3번, 큰돈 계약이 동료들의 부러움이다.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Yet sports journalists <span class=\"cw\">do not have a standing</span> in their profession</div><div class=\"k\">그러나 스포츠 저널리스트들은 그들(= 스포츠 저널리스트들)의 직업 안에서 <span class=\"cw\">지위를 갖고 있지 않다</span></div></div><div class=\"rc\"><div class=\"e\">that corresponds to the size of their readerships</div><div class=\"k\">그들의 독자 수의 규모에 상응하는</div></div><div class=\"rc\"><div class=\"e\">or of their pay packets,</div><div class=\"k\">또는 그들의 급여의 (규모에),</div></div><div class=\"rc\"><div class=\"e\">with the old saying (now reaching the status of cliché)</div><div class=\"k\">옛말(이제는 상투적인 문구의 지위에 이른)이 ~한 채로</div></div><div class=\"rc\"><div class=\"e\">that sport is the ‘toy department of the news media’</div><div class=\"k\">스포츠는 ‘뉴스 매체의 장난감 부서’라는</div></div><div class=\"rc\"><div class=\"e\">still readily to hand</div><div class=\"k\">여전히 손쉽게 쓰일 수 있는 상태로</div></div><div class=\"rc ckc\"><div class=\"e\">as a <span class=\"cw\">dismissal of the worth</span></div><div class=\"k\"><span class=\"cw\">가치를 일축하는 말로</span></div></div><div class=\"rc\"><div class=\"e\">of what sports journalists do.</div><div class=\"k\">스포츠 저널리스트들이 하는 일의.</div></div><div class=\"rnat\">그러나 스포츠 저널리스트들은 자신들의 독자 수나 급여의 규모에 상응하는 지위를 자신들의 직업 안에서 갖고 있지 않은데, 스포츠는 ‘뉴스 매체의 장난감 부서’라는 옛말(이제는 상투적인 문구의 지위에 이른)이 스포츠 저널리스트들이 하는 일의 가치를 일축하는 말로 여전히 손쉽게 쓰이고 있다.</div><div class=\"rst\"><b>그런데</b>(Yet) 신문부 안에서는 “스포츠 코너는 그냥 놀이 코너지” 하며 민수 글을 <b>제대로 쳐주지 않아요</b>. = 지문 4번, 직업 안에서 지위가 없고 가치가 일축된다.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">This reluctance to take sports journalism seriously</div><div class=\"k\">스포츠 저널리즘을 진지하게 받아들이기를 꺼리는 이 태도는</div></div><div class=\"rc\"><div class=\"e\">produces the paradoxical outcome</div><div class=\"k\">역설적인 결과를 낳는다</div></div><div class=\"rc ckc\"><div class=\"e\">that sports newspaper writers are <span class=\"cw\">much read</span></div><div class=\"k\">스포츠 신문 기자들은 <span class=\"cw\">많이 읽힌다는</span></div></div><div class=\"rc ckc\"><div class=\"e\">but <span class=\"cw\">little admired</span>.</div><div class=\"k\">하지만 <span class=\"cw\">거의 존경받지 못한다는</span>. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">스포츠 저널리즘을 진지하게 받아들이기를 꺼리는 이러한 태도는 스포츠 신문 기자들이 많이 읽히지만 거의 존경받지 못한다는 역설적인 결과를 낳는다.</div><div class=\"rst\">그래서 민수 글은 <b>많이 읽히지만</b>(much read) <b>존중은 거의 못 받아요</b>. 그래서 빈칸은 admired(존경받는)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"paradoxical\" data-m=\"역설적인\"><b>paradoxical</b>역설적인</button><button type=\"button\" class=\"wdb\" data-w=\"lucrative\" data-m=\"돈이 많이 되는\"><b>lucrative</b>돈이 많이 되는</button><button type=\"button\" class=\"wdb\" data-w=\"standing\" data-m=\"지위, 평판\"><b>standing</b>지위, 평판</button><button type=\"button\" class=\"wdb\" data-w=\"readership\" data-m=\"독자 수\"><b>readership</b>독자 수</button><button type=\"button\" class=\"wdb\" data-w=\"dismissal\" data-m=\"무시, 일축\"><b>dismissal</b>무시, 일축</button><button type=\"button\" class=\"wdb\" data-w=\"reluctance\" data-m=\"꺼림, 주저함\"><b>reluctance</b>꺼림, 주저함</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞 <b>However</b>(그러나)가 방향을 꺾어요. 1~3번이 칭찬한 <b>비슷한 개체와 어울리는 전략</b>에 5·6번이 <b>제동</b>을 거니, 빈칸은 “이 전략을 막는다”는 말이에요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (4번)</span><div class=\"en\"><mark>However</mark>, the carrying capacity of a given environment <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\"><mark>그러나</mark> 주어진 환경의 수용력은 ( ? )</p></div><div class=\"ck-via\"><i>▼</i><span>선지의 this strategy(이 전략)가 가리키는 것을 먼저 확정</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · “이 전략”의 정체</span><div class=\"en\">… so humans have evolved the desire <mark>to associate with similar individuals</mark> as a way to perform this function efficiently.</div><p class=\"ko\">그래서 인간은 <mark>비슷한 개인들과 어울리려는</mark> 욕구를 진화시켜 왔다</p></div><div class=\"ck-via\"><i>▼</i><span>However(그러나) 뒤에 그 이유가 구체적으로 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">If resources are very limited, the individuals who live in a particular place <mark>cannot all do the exact same thing</mark> …</div><p class=\"ko\">자원이 매우 한정적이라면, 특정 장소에 사는 개인들이 <mark>모두 정확히 똑같은 일을 할 수는 없다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>therefore(그러므로)로 “비슷한 이를 피하라”는 반대 결론</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 결론</span><div class=\"en\">A rational strategy would therefore sometimes be <mark>to avoid similar members</mark> of one’s species.</div><p class=\"ko\">그러므로 합리적인 전략은 때때로 <mark>비슷한 구성원을 ‘피하는’ 것</mark>일 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">places a limit on this strategy 이 전략에 제한을 가한다<small>5번 자원 부족 → 6번 비슷한 이를 피함, 즉 2번 전략에 한계가 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">prevents social ties to dissimilar members 닮지 않은 구성원과의 사회적 유대를 막는다</span><span class=\"why\">6번은 오히려 similar members(비슷한 구성원)를 피하라고 해요. 닮지 않은 이와의 유대를 막는다는 건 결론과 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">exceeds the expected demands of a community 공동체의 예상 수요를 초과한다</span><span class=\"why\">수용력이 수요보다 넘치면 자원이 넉넉하다는 뜻이에요. 5번 resources are very limited(자원이 매우 한정적)와 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">is decreased by diverse means of survival 다양한 생존 방식에 의해 감소된다</span><span class=\"why\">수용력이 줄어든다는 말은 지문에 없어요. 다르게 사는 것은 6번의 해결책이지 수용력을 줄이는 원인이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">makes the world suitable for individuals 세계를 개인들에게 적합하게 만든다</span><span class=\"why\">However(그러나) 뒤에는 제약이 와야 해요. 5번은 나무·망고가 부족하면 모두 같은 일을 할 수 없다는 한계 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Choosing similar friends</div><div class=\"k\">비슷한 친구를 고르는 것은</div></div><div class=\"rc\"><div class=\"e\">can have a rationale.</div><div class=\"k\">논리적 근거를 가질 수 있다.</div></div><div class=\"rnat\">(자신과) 비슷한 친구를 선택하는 것은 논리적 근거를 가질 수 있다.</div><div class=\"rst\">수련회에서 나랑 비슷한 친구들끼리 모이는 데는 <b>이유</b>(rationale 논리적 근거)가 있어요. = 지문 1번, 비슷한 친구를 고르는 데는 근거가 있다.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Assessing the survivability of an environment</div><div class=\"k\">어떤 환경의 생존 가능성을 평가하는 것은</div></div><div class=\"rc\"><div class=\"e\">can be risky</div><div class=\"k\">위험할 수 있다</div></div><div class=\"rc\"><div class=\"e\">(if an environment turns out to be deadly,</div><div class=\"k\">(만약 어떤 환경이 치명적인 것으로 드러난다면,</div></div><div class=\"rc\"><div class=\"e\">for instance,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">it might be too late</div><div class=\"k\">너무 늦을 수도 있다</div></div><div class=\"rc\"><div class=\"e\">by the time you found out),</div><div class=\"k\">당신이 (그것을) 알아차렸을 때쯤에는),</div></div><div class=\"rc\"><div class=\"e\">so humans have evolved the desire</div><div class=\"k\">그래서 인간은 욕구를 진화시켜 왔다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to associate with similar individuals</span></div><div class=\"k\"><span class=\"cw\">비슷한 개인들과 어울리려는</span></div></div><div class=\"rc\"><div class=\"e\">as a way to perform this function efficiently.</div><div class=\"k\">이 기능(= 환경의 생존 가능성을 평가하는 일)을 효율적으로 수행하는 하나의 방법으로.</div></div><div class=\"rnat\">어떤 환경(에서)의 생존 가능성을 평가하는 것은 위험할 수 있고(예를 들어, 만약 어떤 환경이 치명적인 것으로 드러난다면, 당신이 (그것을) 알아차렸을 때쯤에는 너무 늦을 수도 있다), 그래서 인간은 이런 기능을 효율적으로 수행하기 위한 하나의 방법으로서 비슷한 개인들과 어울리려는 욕구를 진화시켜 왔다.</div><div class=\"rst\">처음 가는 숲길이 위험한지 혼자 알아보다간 너무 늦을 수 있어요. 그래서 비슷한 친구들을 따라가요. = 지문 2번, 비슷한 개인과 어울리려는 욕구.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">This is especially useful</div><div class=\"k\">이것(= 비슷한 개인들과 어울리려는 욕구)은 특히 유용하다</div></div><div class=\"rc\"><div class=\"e\">to a species</div><div class=\"k\">종에게</div></div><div class=\"rc\"><div class=\"e\">that lives in so many different sorts of environments.</div><div class=\"k\">매우 다양한 종류의 환경에서 사는.</div></div><div class=\"rnat\">이것은 매우 다양한 종류의 환경에 사는 종에게 특히 유용하다.</div><div class=\"rst\">낯선 곳을 이곳저곳 옮겨 다닐수록 이 “따라가기”가 특히 쓸모 있어요. = 지문 3번, 다양한 환경에 사는 종에게 특히 유용하다.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">However, the carrying capacity</div><div class=\"k\">그러나 수용력은</div></div><div class=\"rc\"><div class=\"e\">of a given environment</div><div class=\"k\">주어진 환경의</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">places a limit on this strategy</span>.</div><div class=\"k\">이 전략(= 비슷한 개체와 어울리려는 전략)에 <span class=\"cw\">제한을 둔다</span>. ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">그러나 주어진 환경의 수용력은 이 전략에 제한을 둔다.</div><div class=\"rst\"><b>그런데</b>(However) 캠프장 간식이 정해져 있으면 이 따라가기 작전에도 <b>한계</b>가 생겨요. = 빈칸, 수용력이 이 전략에 제한을 둔다.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">If resources are very limited,</div><div class=\"k\">만약 자원이 매우 한정적이라면,</div></div><div class=\"rc\"><div class=\"e\">the individuals who live in a particular place</div><div class=\"k\">특정 장소에 사는 개인들이</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">cannot all do the exact same thing</span></div><div class=\"k\"><span class=\"cw\">모두 정확히 똑같은 일을 할 수는 없다</span></div></div><div class=\"rc\"><div class=\"e\">(for example, if there are few trees,</div><div class=\"k\">(예를 들어, 만약 나무가 거의 없다면,</div></div><div class=\"rc\"><div class=\"e\">people cannot all live in tree houses,</div><div class=\"k\">사람들이 모두 나무집에 살 수는 없다,</div></div><div class=\"rc\"><div class=\"e\">or if mangoes are in short supply,</div><div class=\"k\">혹은 만약 망고의 공급이 부족하다면,</div></div><div class=\"rc\"><div class=\"e\">people cannot all live solely on a diet of mangoes).</div><div class=\"k\">사람들이 모두 오로지 망고를 주식으로 (먹고) 살 수는 없다).</div></div><div class=\"rnat\">만약 자원이 매우 한정적이라면, 특정 장소에 사는 개인들이 모두 정확히 똑같은 일을 할 수는 없다(예를 들어, 만약 나무가 거의 없다면 사람들이 모두 나무집에 살 수는 없으며, 혹은 만약 망고의 공급이 부족하다면 사람들이 모두 오로지 망고를 주식으로 (먹고) 살 수는 없다).</div><div class=\"rst\">간식 망고가 몇 개뿐이면 다 같이 망고만 먹을 순 없어요. = 지문 5번, 자원이 한정되면 <b>모두 똑같은 일을 할 수는 없다</b>.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">A rational strategy would therefore sometimes be</div><div class=\"k\">그러므로 합리적인 전략은 때때로 ~일 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to avoid similar members</span> of one’s species.</div><div class=\"k\">자신의 종 가운데 <span class=\"cw\">비슷한 구성원을 ‘피하는’ 것</span>.</div></div><div class=\"rnat\">그러므로 합리적인 전략은 때때로 자신의 종 가운데 비슷한 구성원을 ‘피하는’ 일일 것이다.</div><div class=\"rst\">그래서 가끔은 나랑 똑같은 걸 노리는 친구를 <b>피하는</b> 게 현명해요. = 지문 6번, 비슷한 구성원을 피하는 합리적 전략.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"rationale\" data-m=\"논리적 근거, 이유\"><b>rationale</b>논리적 근거, 이유</button><button type=\"button\" class=\"wdb\" data-w=\"associate with\" data-m=\"~와 어울리다\"><b>associate with</b>~와 어울리다</button><button type=\"button\" class=\"wdb\" data-w=\"carrying capacity\" data-m=\"수용력, 부양 능력\"><b>carrying capacity</b>수용력, 부양 능력</button><button type=\"button\" class=\"wdb\" data-w=\"places a limit on\" data-m=\"~에 제한을 가하다\"><b>places a limit on</b>~에 제한을 가하다</button><button type=\"button\" class=\"wdb\" data-w=\"in short supply\" data-m=\"공급이 부족한\"><b>in short supply</b>공급이 부족한</button><button type=\"button\" class=\"wdb\" data-w=\"rational\" data-m=\"합리적인, 이성적인\"><b>rational</b>합리적인, 이성적인</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">삽입은 주어진 문장의 <b>연결 신호</b>를 잡는 문제. <b>As a result</b>(그 결과)와 <b>they</b>(그들) 앞에는 원인과 복수 대상이, 뒤에는 <b>This is because</b>(이것은 ~ 때문이다)가 “오래 못 산다”를 받아야 해요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 문장 · 연결 신호</span><div class=\"en\"><mark>As a result</mark>, they are fit and grow better, <mark>but they aren’t particularly long-lived</mark>.</div><p class=\"ko\"><mark>그 결과</mark>, 그들은 건강하고 더 잘 자라지만, <mark>특별히 오래 살지는 않는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>they(그들) = 미친 듯이 광합성하는 개체들, 그 광합성이 “잘 자람”의 원인</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 앞 문장 (② 바로 앞)</span><div class=\"en\">Some individuals <mark>photosynthesize like mad</mark> until sugar positively bubbles along their trunk.</div><p class=\"ko\">어떤 개체들은 당분이 몸통을 따라 흐를 때까지 <mark>미친 듯이 광합성을 한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>This(이것) = 주어진 문장의 “오래 살지는 않는다”</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 뒤 문장 (② 바로 뒤)</span><div class=\"en\"><mark>This is because</mark> a tree can be only as strong as the forest that surrounds it.</div><p class=\"ko\"><mark>이것은</mark> 나무가 그것을 둘러싼 숲만큼만 강할 수 있기 <mark>때문이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>어떤 나무는 미친 듯이 광합성</span><span><em>주어진 문장</em>그 결과 잘 자라지만 오래 못 삶</span><span><em>7번</em>그 이유: 숲만큼만 강할 수 있음</span></div><div class=\"ck-eq\">⇒ 원인 → 결과(반전) → 이유, 세 고리가 다 맞는 자리 = ②</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">6번 문장과 7번 문장 사이<small>7번 This(이것)가 받을 “오래 못 산다”가 바로 앞에 생겨요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">7번 문장과 8번 문장 사이</span><span class=\"why\">그러면 7번 This(이것)가 6번 “광합성”을 받아서, 광합성하는 이유가 “숲만큼만 강해서”라는 엉뚱한 말이 돼요. 이유가 결과보다 먼저 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">5번 문장과 6번 문장 사이</span><span class=\"why\">As a result(그 결과)의 원인인 6번 광합성이 아직 안 나왔어요. they(그들)가 5번 Every tree(모든 나무)가 되어 “모두 잘 자란다”가 돼 버려요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">8번 문장과 9번 문장 사이</span><span class=\"why\">they(그들)가 8번 losers(패배자들)를 받게 돼요. 패배자들이 건강하고 잘 자란다는 건 앞뒤가 안 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">9번 문장과 10번 문장 사이</span><span class=\"why\">they(그들)가 9번 Weaker members(약한 구성원들)가 돼요. 뒤처진다는 나무가 잘 자란다는 건 모순이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">As a result</span>,</div><div class=\"k\"><span class=\"cw\">그 결과</span>,</div></div><div class=\"rc\"><div class=\"e\">they are fit and grow better,</div><div class=\"k\">그들(= 미친 듯이 광합성을 하는 개체들)은 건강하고 더 잘 자란다,</div></div><div class=\"rc ckc\"><div class=\"e\">but they <span class=\"cw\">aren’t particularly long-lived</span>.</div><div class=\"k\">하지만 그들은 <span class=\"cw\">특별히 오래 살지는 않는다</span>.</div></div><div class=\"rnat\">결과적으로, 그들은 건강하고 더 잘 자라지만 그들은 특별히 오래 살지는 않는다.</div><div class=\"rst\">〈주어진 문장〉 밤새 문제를 푼 아이들은 <b>그 결과</b>(As a result) 점수가 쑥 오르지만, 그 기세가 <b>오래가진 않아요</b>. = 지문의 잘 자라지만 오래 살지 않음.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">When trees grow together,</div><div class=\"k\">나무들이 함께 자랄 때,</div></div><div class=\"rc\"><div class=\"e\">nutrients and water can be optimally divided</div><div class=\"k\">영양분과 물은 최적으로 나뉠 수 있다</div></div><div class=\"rc\"><div class=\"e\">among them all</div><div class=\"k\">그들(= 나무들) 모두 사이에서</div></div><div class=\"rc\"><div class=\"e\">so that each tree can grow</div><div class=\"k\">각 나무가 자랄 수 있도록</div></div><div class=\"rc\"><div class=\"e\">into the best tree it can be.</div><div class=\"k\">그것(= 각 나무)이 될 수 있는 최선의 나무로.</div></div><div class=\"rnat\">나무들이 함께 자랄 때, 각 나무가 그것이 될 수 있는 최선의 나무로 자랄 수 있도록 영양분과 물은 그들 모두 사이에서 최적으로 나누어질 수 있다.</div><div class=\"rst\">모둠 친구들이 함께 공부하면 간식과 노트를 골고루 나눠서 다들 자기 최고 실력까지 커요. = 지문 2번, 함께 자라는 나무들은 영양분과 물을 나눈다.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">If you “help” individual trees</div><div class=\"k\">당신이 개별 나무를 ‘돕는다’면</div></div><div class=\"rc\"><div class=\"e\">by getting rid of their supposed competition,</div><div class=\"k\">그들(= 개별 나무들)의 소위 경쟁자라는 것을 제거함으로써,</div></div><div class=\"rc\"><div class=\"e\">the remaining trees are bereft.</div><div class=\"k\">남아 있는 나무들은 잃게 된다.</div></div><div class=\"rnat\">당신이 소위 그들의 경쟁자라는 것(나무)을 제거함으로써 개별의 나무를 ‘돕는다’면 남아 있는 나무들은 잃게 된다.</div><div class=\"rst\">그런데 누가 “경쟁자 없애 줄게” 하며 짝꿍들을 다 다른 반으로 보내면, 남은 아이는 친구를 <b>잃어요</b>. = 지문 3번, 남은 나무들이 잃게 된다.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">They send messages out to their neighbors</div><div class=\"k\">그들(= 남아 있는 나무들)은 그들의 이웃에게 메시지를 보낸다</div></div><div class=\"rc\"><div class=\"e\">unsuccessfully,</div><div class=\"k\">성공하지 못한 채로,</div></div><div class=\"rc\"><div class=\"e\">because nothing remains but stumps.</div><div class=\"k\">그루터기 말고는 아무것도 남아 있지 않기 때문에.</div></div><div class=\"rnat\">그들은 그루터기를 제외하고 아무것도 남아 있지 않기 때문에 그들의 이웃에게 메시지를 성공적이지 않게 보낸다(신호를 보내지만 소용이 없다).</div><div class=\"rst\">남은 아이가 “도와줘!” 하고 불러도 대답할 친구가 없어요. = 지문 4번, 그루터기만 남아 이웃에게 보낸 메시지가 실패한다.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Every tree now grows on its own,</div><div class=\"k\">이제 모든 나무는 혼자서 자란다,</div></div><div class=\"rc\"><div class=\"e\">giving rise to great differences in productivity.</div><div class=\"k\">그리고 생산성에서 큰 차이를 일으킨다.</div></div><div class=\"rnat\">이제 모든 나무는 생산성에서 큰 차이를 야기하면서 그들 스스로 자란다.</div><div class=\"rst\">이제 모두 <b>혼자</b> 공부하니까 점수 차이가 확 벌어져요. = 지문 5번, 모든 나무가 혼자 자라며 생산성 차이가 커진다.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Some individuals <span class=\"cw\">photosynthesize like mad</span></div><div class=\"k\">어떤 개체들은 <span class=\"cw\">미친 듯이 광합성을 한다</span></div></div><div class=\"rc\"><div class=\"e\">until sugar positively bubbles along their trunk.</div><div class=\"k\">당분이 그들(= 그 개체들)의 몸통을 따라 확실히 흐를 때까지.</div></div><div class=\"rnat\">어떤 개체들은 당분이 그들의 몸통을 따라 확실히 흐를 때까지 미친 듯이 광합성을 한다.</div><div class=\"rst\">어떤 아이는 밤새 <b>미친 듯이</b> 문제를 풀어요. = 지문 6번, 어떤 개체들은 미친 듯이 광합성을 한다. 주어진 문장의 they(그들)가 이 아이들이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">This is because</span></div><div class=\"k\">이것(= 잘 자라는 나무도 특별히 오래 살지는 않는 것)은 ~ <span class=\"cw\">때문이다</span></div></div><div class=\"rc\"><div class=\"e\">a tree can be only as strong</div><div class=\"k\">나무는 ~만큼만 강할 수 있다</div></div><div class=\"rc\"><div class=\"e\">as the forest that surrounds it.</div><div class=\"k\">그것(= 나무)을 둘러싼 숲이 강한 (만큼만).</div></div><div class=\"rnat\">이것은 나무가 그것을 둘러싼 숲이 강한 만큼만 강할 수 있기 때문이다.</div><div class=\"rst\"><b>그건</b>(This is because) 한 사람은 자기 반 전체가 강한 만큼만 강할 수 있기 때문이에요. = 지문 7번, 나무는 둘러싼 숲만큼만 강하다.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">And there are now a lot of losers in the forest.</div><div class=\"k\">그리고 이제 숲에는 많은 패배자들이 있다.</div></div><div class=\"rnat\">그리고 현재 숲에는 많은 패배자들이 있다.</div><div class=\"rst\">그리고 이제 반에는 뒤처지는 아이들도 많아요. = 지문 8번, 숲에는 이제 패배자들이 많다.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Weaker members,</div><div class=\"k\">약한 구성원들은,</div></div><div class=\"rc\"><div class=\"e\">who would once have been supported</div><div class=\"k\">한때 도움을 받았을</div></div><div class=\"rc\"><div class=\"e\">by the stronger ones,</div><div class=\"k\">강한 것들(= 강한 나무들)에 의해,</div></div><div class=\"rc\"><div class=\"e\">suddenly fall behind.</div><div class=\"k\">갑자기 뒤처진다.</div></div><div class=\"rnat\">강한 구성원들에 의해 한때 도움을 받았을 약한 구성원들은 갑자기 뒤처진다.</div><div class=\"rst\">예전엔 잘하는 친구가 끌어 줬을 약한 아이들이 갑자기 뒤처져요. = 지문 9번, 강한 나무의 도움을 받던 약한 구성원이 뒤처진다.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Whether the reason for their decline is</div><div class=\"k\">그들(= 약한 나무들)의 쇠퇴의 이유가 ~이든</div></div><div class=\"rc\"><div class=\"e\">their location and lack of nutrients,</div><div class=\"k\">그들의 위치와 영양분의 부족이든,</div></div><div class=\"rc\"><div class=\"e\">a passing sickness,</div><div class=\"k\">지나가는 병이든,</div></div><div class=\"rc\"><div class=\"e\">or genetic makeup,</div><div class=\"k\">또는 유전적 구성이든,</div></div><div class=\"rc\"><div class=\"e\">they now fall prey to insects and fungi.</div><div class=\"k\">그들(= 약한 나무들)은 이제 곤충과 균류의 먹이가 된다.</div></div><div class=\"rnat\">그들의 쇠퇴의 이유가 그들의 위치와 영양분의 부족이든 지나가는 병 또는 유전적 구성이든, 그들은 이제 곤충과 균류의 먹이가 된다.</div><div class=\"rst\">이유가 자리든, 잠깐 아픈 거든, 타고난 거든, 이제 혼자서는 쉽게 무너져요. = 지문 10번, 약한 나무가 곤충과 균류의 먹이가 된다.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"photosynthesize\" data-m=\"광합성하다\"><b>photosynthesize</b>광합성하다</button><button type=\"button\" class=\"wdb\" data-w=\"like mad\" data-m=\"미친 듯이\"><b>like mad</b>미친 듯이</button><button type=\"button\" class=\"wdb\" data-w=\"bereft\" data-m=\"잃은, 상실한\"><b>bereft</b>잃은, 상실한</button><button type=\"button\" class=\"wdb\" data-w=\"giving rise to\" data-m=\"~을 낳다, 일으키다(give rise to)\"><b>giving rise to</b>~을 낳다, 일으키다(give rise to)</button><button type=\"button\" class=\"wdb\" data-w=\"fall behind\" data-m=\"뒤처지다\"><b>fall behind</b>뒤처지다</button><button type=\"button\" class=\"wdb\" data-w=\"fall prey to\" data-m=\"~의 먹이가 되다\"><b>fall prey to</b>~의 먹이가 되다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>30%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>를 찾는 문제. 주장 → 실험 설계(<b>first</b> 먼저) → 실험 결과(<b>The remarkable finding</b> 주목할 만한 결과) → 해석(<b>This asymmetry</b> 이 비대칭) 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 끝</span><div class=\"en\">… landmarks are themselves, but they also <mark>define neighborhoods around themselves</mark>.</div><p class=\"ko\">랜드마크는 그 자체이기도 하지만, 자신의 주변에 있는 <mark>인근 지역을 규정하기도</mark> 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>주장만 나왔으니, 그걸 확인할 실험 설계가 먼저</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 첫 번째 고리</span><div class=\"en\">In a paradigm that has been repeated on many campuses, researchers <mark>first</mark> collect a list of campus landmarks from students.</div><p class=\"ko\">많은 캠퍼스에서 반복된 한 전형적인 예에서, 연구원들은 <mark>먼저</mark> 학생들에게서 캠퍼스 랜드마크 목록을 수집한다.</p></div><div class=\"ck-via\"><i>▼</i><span>(A)의 거리 추정 실험의 결과를 알려 줌</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 두 번째 고리</span><div class=\"en\"><mark>The remarkable finding</mark> is that distances from an ordinary location to a landmark are judged shorter than distances from a landmark to an ordinary location.</div><p class=\"ko\"><mark>주목할 만한 결과는</mark> 평범한 장소에서 랜드마크까지의 거리가 그 반대보다 더 짧다고 추정된다는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>This asymmetry(이 비대칭) = (C)의 “방향에 따라 거리가 다름”</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 세 번째 고리</span><div class=\"en\"><mark>This asymmetry</mark> of distance estimates violates the most elementary principles of Euclidean distance …</div><p class=\"ko\">거리 추정에 관한 <mark>이 비대칭</mark>은 유클리드 거리의 가장 기초적인 법칙을 위배한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">(A) – (C) – (B)<small>실험 설계 → 결과 → 비대칭 해석, 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">(C)→(B) 고리는 맞지만, (A)의 first(먼저)로 시작하는 실험 설계가 맨 뒤로 가요. 결과가 실험보다 먼저 나올 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">주어진 글 바로 뒤 (B)의 This asymmetry(이 비대칭)가 가리킬 대상이 없어요. 주어진 글엔 거리 비대칭 이야기가 아직 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(B) – (C) – (A)</span><span class=\"why\">(B)의 This asymmetry(이 비대칭)가 맨 앞이라 가리킬 것이 없고, 실험 설계 (A)도 결과 (C)보다 뒤에 와요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">(C)의 The remarkable finding(주목할 만한 결과)이 어떤 실험의 결과인지 모른 채 먼저 나와요. 실험 (A)가 앞에 있어야 해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Spatial reference points</div><div class=\"k\">공간 기준점들은</div></div><div class=\"rc\"><div class=\"e\">are larger than themselves.</div><div class=\"k\">그것들 자체보다 더 크다.</div></div><div class=\"rnat\">공간 기준점(공간적으로 기준이 되는 장소)들은 그것들 자체보다 더 크다.</div><div class=\"rst\">학교 <b>매점</b>처럼 유명한 장소는 그 자체보다 더 크게 느껴져요. = 지문 1번, 공간 기준점은 그 자체보다 크다.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">This isn’t really a paradox:</div><div class=\"k\">이것(= 공간 기준점이 그 자체보다 크다는 것)은 꼭 역설적인 것은 아니다:</div></div><div class=\"rc\"><div class=\"e\">landmarks are themselves,</div><div class=\"k\">랜드마크는 그것 자체이기도 하다,</div></div><div class=\"rc\"><div class=\"e\">but they also define neighborhoods</div><div class=\"k\">하지만 그것들(= 랜드마크)은 인근 지역을 규정하기도 한다</div></div><div class=\"rc\"><div class=\"e\">around themselves.</div><div class=\"k\">자신의 주변에 있는.</div></div><div class=\"rnat\">이것은 꼭 역설적인 것은 아닌데, 랜드마크는 그것 자체이기도 하지만, 자신의 주변 지역을 규정하기도 한다.</div><div class=\"rst\">이건 이상한 말이 아니에요. 매점은 매점이면서 “매점 근처”라는 동네까지 만들어요. = 지문 2번, 랜드마크는 주변 지역도 규정한다.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A) In a paradigm</div><div class=\"k\">(A) 한 전형적인 예에서</div></div><div class=\"rc\"><div class=\"e\">that has been repeated on many campuses,</div><div class=\"k\">많은 (대학) 캠퍼스에서 반복되어 온,</div></div><div class=\"rc ckc\"><div class=\"e\">researchers <span class=\"cw\">first</span> collect a list of campus landmarks</div><div class=\"k\">연구원들은 <span class=\"cw\">먼저</span> 캠퍼스 랜드마크의 목록을 수집한다</div></div><div class=\"rc\"><div class=\"e\">from students.</div><div class=\"k\">학생들에게서.</div></div><div class=\"rnat\">(A) 많은 (대학) 캠퍼스에서 반복되어온 한 전형적인 예에서, 연구원들은 먼저 학생들에게서 캠퍼스 랜드마크의 목록을 수집한다.</div><div class=\"rst\">연구자들이 여러 학교에서 학생들에게 <b>먼저</b>(first) 유명한 장소 목록을 받아요. = 지문 3번 (A), 실험의 첫 단계.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Then</span> they ask another group of students</div><div class=\"k\"><span class=\"cw\">그런 다음</span> 그들(= 연구원들)은 다른 학생 집단에게 요청한다</div></div><div class=\"rc\"><div class=\"e\">to estimate the distances</div><div class=\"k\">거리를 추정하라고</div></div><div class=\"rc\"><div class=\"e\">between pairs of locations,</div><div class=\"k\">쌍으로 이루어진 장소들 사이의,</div></div><div class=\"rc\"><div class=\"e\">some to landmarks,</div><div class=\"k\">어떤 것은 랜드마크까지,</div></div><div class=\"rc\"><div class=\"e\">some to ordinary buildings on campus.</div><div class=\"k\">어떤 것은 캠퍼스의 평범한 건물까지.</div></div><div class=\"rnat\">그런 다음 그들은 다른 학생 집단에게 쌍으로 이루어진 장소들 사이의 거리, 즉 캠퍼스에 있는 어떤 장소에서 랜드마크까지, 어떤 장소에서 평범한 건물까지의 거리를 추정하라고 요청한다.</div><div class=\"rst\"><b>그다음</b>(Then) 다른 학생들에게 두 곳 사이 거리를 어림해 보라고 해요. 매점까지, 평범한 창고까지요. = 지문 4번, 거리 추정 요청.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">5번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\">(B) <span class=\"cw\">This asymmetry</span> of distance estimates</div><div class=\"k\">(B) 거리 추정에 관한 <span class=\"cw\">이 비대칭</span>(= 방향에 따라 거리가 다르게 추정되는 것)은</div></div><div class=\"rc\"><div class=\"e\">violates the most elementary principles</div><div class=\"k\">가장 기초적인 법칙을 위배한다</div></div><div class=\"rc\"><div class=\"e\">of Euclidean distance,</div><div class=\"k\">유클리드 거리의,</div></div><div class=\"rc\"><div class=\"e\">that the distance from A to B</div><div class=\"k\">즉 A에서부터 B까지의 거리는</div></div><div class=\"rc\"><div class=\"e\">must be the same as the distance from B to A.</div><div class=\"k\">B에서부터 A까지의 거리와 같아야 한다는.</div></div><div class=\"rnat\">(B) 거리 추정에 관한 이 비대칭은, A에서부터 B까지의 거리는 B에서부터 A까지의 거리와 같아야 한다는 가장 기초적인 유클리드 거리 법칙을 위배한다.</div><div class=\"rst\"><b>이 비대칭</b>(This asymmetry), 즉 가는 길과 오는 길 거리가 다르다는 건 “갈 때와 올 때 거리는 같다”는 기본 규칙을 어겨요. = 지문 5번 (B).</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">6번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Judgments of distance, then,</div><div class=\"k\">그렇다면 거리에 관한 판단(추정)은,</div></div><div class=\"rc\"><div class=\"e\">are not necessarily coherent.</div><div class=\"k\">반드시 일관성이 있는 것은 아니다.</div></div><div class=\"rnat\">그렇다면 거리에 관한 추정은 반드시 일관성이 있는 것은 아니다.</div><div class=\"rst\">그러니 우리가 머릿속으로 재는 거리는 꼭 앞뒤가 맞지는 않아요. = 지문 6번, 거리 판단은 반드시 일관된 것은 아니다.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">7번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">The remarkable finding</span> is</div><div class=\"k\">(C) <span class=\"cw\">주목할 만한 결과는</span> ~라는 것이다</div></div><div class=\"rc\"><div class=\"e\">that distances from an ordinary location to a landmark</div><div class=\"k\">평범한 장소에서 랜드마크까지의 거리가</div></div><div class=\"rc\"><div class=\"e\">are judged shorter</div><div class=\"k\">더 짧다고 추정된다는</div></div><div class=\"rc\"><div class=\"e\">than distances from a landmark to an ordinary location.</div><div class=\"k\">랜드마크에서 평범한 장소까지의 거리보다.</div></div><div class=\"rnat\">(C) 주목할 만한 결과는 평범한 장소에서 랜드마크까지의 거리가 랜드마크에서 평범한 장소까지의 거리보다 더 짧다고 추정된다는 것이다.</div><div class=\"rst\"><b>놀라운 결과</b>(remarkable finding): 우리 반→매점은 가깝다고 하고, 매점→우리 반은 멀다고 해요. = 지문 7번 (C), 평범한 곳→랜드마크가 더 짧다.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">8번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">So, people would judge the distance</div><div class=\"k\">그래서 사람들은 거리를 추정할 것이다</div></div><div class=\"rc\"><div class=\"e\">from Pierre’s house to the Eiffel Tower</div><div class=\"k\">Pierre의 집에서 에펠탑까지의</div></div><div class=\"rc\"><div class=\"e\">to be shorter than the distance</div><div class=\"k\">거리보다 더 짧다고</div></div><div class=\"rc\"><div class=\"e\">from the Eiffel Tower to Pierre’s house.</div><div class=\"k\">에펠탑에서 Pierre의 집까지의.</div></div><div class=\"rnat\">그러므로 사람들은 Pierre의 집에서 에펠탑까지의 거리가 에펠탑에서 Pierre의 집까지의 거리보다 더 짧다고 추정할 것이다.</div><div class=\"rst\">그래서 사람들은 Pierre(피에르)의 집에서 에펠탑까지가 그 반대보다 짧다고 판단해요. = 지문 8번의 예.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">9번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Like black holes,</div><div class=\"k\">블랙홀처럼,</div></div><div class=\"rc\"><div class=\"e\">landmarks seem to pull ordinary locations</div><div class=\"k\">랜드마크는 평범한 장소를 끌어당기는 것처럼 보인다</div></div><div class=\"rc\"><div class=\"e\">toward themselves,</div><div class=\"k\">자신의 방향으로,</div></div><div class=\"rc\"><div class=\"e\">but ordinary places do not.</div><div class=\"k\">하지만 평범한 장소는 그렇지 않다.</div></div><div class=\"rnat\">블랙홀처럼, 랜드마크는 평범한 장소를 자신의 방향으로 끌어당기는 것처럼 보이지만, 평범한 장소는 그렇지 않다.</div><div class=\"rst\">매점이 블랙홀처럼 주변 교실을 끌어당기는 느낌이에요. 평범한 교실은 그런 힘이 없어요. = 지문 9번, 랜드마크는 평범한 장소를 끌어당긴다.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"landmark\" data-m=\"랜드마크, 주요 지형지물\"><b>landmark</b>랜드마크, 주요 지형지물</button><button type=\"button\" class=\"wdb\" data-w=\"estimate\" data-m=\"추정하다; 추정치\"><b>estimate</b>추정하다; 추정치</button><button type=\"button\" class=\"wdb\" data-w=\"remarkable\" data-m=\"주목할 만한\"><b>remarkable</b>주목할 만한</button><button type=\"button\" class=\"wdb\" data-w=\"asymmetry\" data-m=\"비대칭\"><b>asymmetry</b>비대칭</button><button type=\"button\" class=\"wdb\" data-w=\"violate\" data-m=\"위배하다, 어기다\"><b>violate</b>위배하다, 어기다</button><button type=\"button\" class=\"wdb\" data-w=\"coherent\" data-m=\"일관성 있는\"><b>coherent</b>일관성 있는</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">제목은 글이 <b>무엇을 변호하는지</b> 한 줄로 잡으세요. 2번 “쓸모없다”는 통념 → 8번 <b>첫 번째 대답</b>(원료) → 9·12번 <b>두 번째 대답</b>(값을 매길 수 없는 앎). 두 대답을 다 담는 질문이 제목이에요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 깨뜨릴 통념</span><div class=\"en\">… it is easy to argue that basic science is <mark>not worth the effort and expense</mark> because it has no known practical use.</div><p class=\"ko\">기초 과학은 알려진 실용적 용도가 없어서 <mark>노력과 비용을 들일 가치가 없다고</mark> 주장하기 쉽다.</p></div><div class=\"ck-via\"><i>▼</i><span>Faraday(패러데이) 일화로 통념을 뒤집은 뒤 나오는 답</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 첫 번째 대답</span><div class=\"en\">Basic scientific research <mark>provides the raw materials</mark> that technology and engineering use to solve problems.</div><p class=\"ko\">기초 과학 연구는 기술과 공학이 문제를 해결하기 위해 사용하는 <mark>원료를 제공한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>yet one more(게다가 하나 더)로 두 번째 대답이 이어져요</span></div><div class=\"ck-step\"><span class=\"lab\">9번 문장 · 대답이 하나 더</span><div class=\"en\">Basic scientific research has yet <mark>one more important use</mark> that is so valuable it seems an insult to refer to it as merely functional.</div><p class=\"ko\">기초 과학 연구는 게다가 <mark>중요한 용도를 한 가지 더</mark> 가지고 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>두 번째 대답을 “값을 매길 수 없다”로 닫아요</span></div><div class=\"ck-step key\"><span class=\"lab\">12번 문장 · 결정적 결론</span><div class=\"en\">Science tells us where we are and what we are, and that knowledge is <mark>beyond value</mark>.</div><p class=\"ko\">과학은 우리가 어디에 있고 무엇인지 알려 주고, 그러한 지식은 <mark>가치를 넘어선다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">What Does Basic Science Bring to Us(기초 과학은 우리에게 무엇을 가져다주는가)?<small>8번 원료와 12번 값진 앎, 두 대답을 다 묶는 질문이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">Technology(기술): The Ultimate Aim of Basic Science(기초 과학의 궁극적 목표)</span><span class=\"why\">[반대] 8번 technology(기술)만 따온 함정이에요. 9번은 기능적이라고만 부르면 모욕일 만큼 더 귀한 쓰임이 있다고 해요. 기술이 궁극 목표가 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">The Crisis of Researchers in Basic Science(기초 과학 연구자들의 위기)</span><span class=\"why\">[지문에 없음] 연구자들이 위기에 빠졌다는 문장은 하나도 없어요. 글은 기초 과학의 가치를 변호해요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Common Goals of Science and Technology(과학과 기술의 공통 목표)</span><span class=\"why\">[지문에 없음] 8번은 기초 과학이 기술에 원료를 준다는 관계일 뿐, 둘의 공통 목표를 말하지 않아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Michael Faraday(마이클 패러데이), Frontiersman of the Electronic Age(전자 시대의 개척자)!</span><span class=\"why\">[범위 좁음] Faraday(패러데이)는 4~6번의 예시 일화일 뿐이에요. 글의 주인공은 사람이 아니라 기초 과학이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">We might describe science</div><div class=\"k\">우리는 과학을 ~라고 말할 수 있다</div></div><div class=\"rc\"><div class=\"e\">that has no known practical value</div><div class=\"k\">알려진 실용적 가치를 전혀 지니지 않은</div></div><div class=\"rc\"><div class=\"e\">as basic science or basic research.</div><div class=\"k\">기초 과학 또는 기초 연구라고.</div></div><div class=\"rnat\">우리는 알려진 실용적 가치를 전혀 지니지 않은 과학을 기초 과학 또는 기초 연구라고 말할 수 있다.</div><div class=\"rst\">과학 동아리에서 밤하늘을 관찰해요. 당장 시험에 안 나오는 이런 공부를 <b>기초 과학</b>이라고 해요. = 지문 1번, 실용적 가치가 알려지지 않은 과학.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Our exploration of worlds such as Jupiter</div><div class=\"k\">목성과 같은 세계에 대한 우리의 탐사는</div></div><div class=\"rc\"><div class=\"e\">would be called basic science,</div><div class=\"k\">기초 과학으로 불릴 것이다,</div></div><div class=\"rc\"><div class=\"e\">and it is easy to argue</div><div class=\"k\">그리고 주장하기 쉽다</div></div><div class=\"rc ckc\"><div class=\"e\">that basic science is <span class=\"cw\">not worth the effort and expense</span></div><div class=\"k\">기초 과학이 <span class=\"cw\">노력과 비용을 들일 가치가 없다고</span></div></div><div class=\"rc\"><div class=\"e\">because it has no known practical use.</div><div class=\"k\">그것(= 기초 과학)은 알려진 실용적인 용도를 전혀 지니지 않기 때문에.</div></div><div class=\"rnat\">목성과 같은 세계에 대한 우리의 탐사는 기초 과학으로 불릴 것인데, 그것(기초 과학)은 알려진 실용적인 용도를 전혀 지니지 않기 때문에 기초 과학이 노력과 비용을 들일 가치가 없다고 주장하기 쉽다.</div><div class=\"rst\">목성을 망원경으로 보는 걸 두고 “그거 해서 뭐 해? 시간·돈 낭비야” 하는 친구도 있어요. = 지문 2번, 노력과 비용을 들일 가치가 없다는 주장.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Of course, the problem is</div><div class=\"k\">물론, 문제는 ~라는 것이다</div></div><div class=\"rc\"><div class=\"e\">that we have no way of knowing</div><div class=\"k\">우리가 알 방법이 없다는</div></div><div class=\"rc\"><div class=\"e\">what knowledge will be of use</div><div class=\"k\">어떤 지식이 유용할지</div></div><div class=\"rc\"><div class=\"e\">until we acquire that knowledge.</div><div class=\"k\">우리가 그 지식을 얻을 때까지는.</div></div><div class=\"rnat\">물론, 문제는 우리가 그 지식을 얻을 때까지는 어떤 지식이 유용할지 아는 방법이 우리에게 없다는 것이다.</div><div class=\"rst\">그런데 어떤 지식이 나중에 쓸모 있을지는 배워 보기 전엔 아무도 몰라요. = 지문 3번, 지식을 얻기 전엔 쓸모를 알 방법이 없다.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In the middle of the 19th century,</div><div class=\"k\">19세기 중반에,</div></div><div class=\"rc\"><div class=\"e\">Queen Victoria is supposed to have asked</div><div class=\"k\">Victoria 여왕은 물었다고 한다</div></div><div class=\"rc\"><div class=\"e\">physicist Michael Faraday</div><div class=\"k\">물리학자 Michael Faraday에게</div></div><div class=\"rc\"><div class=\"e\">what good his experiments</div><div class=\"k\">그(= Faraday)의 실험이 무슨 도움이 되는지</div></div><div class=\"rc\"><div class=\"e\">with electricity and magnetism were.</div><div class=\"k\">전기와 자성에 관한.</div></div><div class=\"rnat\">19세기 중반에, Victoria(빅토리아) 여왕은 물리학자 Michael Faraday(마이클 패러데이)에게 그의 전기와 자성에 관한 실험이 무슨 도움이 되는지 물었다고 한다.</div><div class=\"rst\">옛날 Victoria(빅토리아) 여왕도 Faraday(패러데이)에게 “그 전기 실험이 무슨 도움이 되나요?” 하고 물었대요. = 지문 4번.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">He answered,</div><div class=\"k\">그(= Faraday)는 대답했다,</div></div><div class=\"rc\"><div class=\"e\">“Madam, what good is a baby?”</div><div class=\"k\">“여왕님, 아기는 무슨 도움이 됩니까?”</div></div><div class=\"rnat\">그(Faraday)는 “여왕님, 아기는 무슨 도움이 됩니까?”라고 대답했다.</div><div class=\"rst\">Faraday(패러데이)는 “아기는 무슨 도움이 되나요?” 하고 되물었어요. 지금은 작아도 자라면 큰일을 한다는 뜻이에요. = 지문 5번.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Of course, Faraday’s experiments</div><div class=\"k\">물론, Faraday의 실험은</div></div><div class=\"rc\"><div class=\"e\">were the beginning of the electronic age.</div><div class=\"k\">전자 시대의 시작이 되었다.</div></div><div class=\"rnat\">물론, Faraday의 실험은 전자 시대의 시작이 되었다(시초였다).</div><div class=\"rst\">그 실험이 결국 <b>전자 시대의 시작</b>이 됐어요. 우리가 쓰는 폰도 거기서 출발한 셈이에요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Many of the practical uses of scientific knowledge</div><div class=\"k\">과학적 지식의 실용적인 활용들 중 많은 것들은</div></div><div class=\"rc\"><div class=\"e\">that fill our world</div><div class=\"k\">우리의 세상을 채우고 있는</div></div><div class=\"rc\"><div class=\"e\">— transistors, vaccines, plastics —</div><div class=\"k\">— 트랜지스터, 백신, 플라스틱 —</div></div><div class=\"rc\"><div class=\"e\">began as basic research.</div><div class=\"k\">기초 연구로 시작되었다.</div></div><div class=\"rnat\">우리의 세상을 채우고 있는 과학적 지식의 실용적인 활용들 중 많은 것들 — 트랜지스터, 백신, 플라스틱 — 은 기초 연구로 시작되었다.</div><div class=\"rst\">백신, 플라스틱처럼 우리 주변 물건도 처음엔 기초 연구에서 시작됐어요. = 지문 7번, 실용적 활용 중 많은 것이 기초 연구로 시작됐다.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Basic scientific research <span class=\"cw\">provides the raw materials</span></div><div class=\"k\">기초 과학 연구는 <span class=\"cw\">원료를 제공한다</span></div></div><div class=\"rc\"><div class=\"e\">that technology and engineering use</div><div class=\"k\">기술과 공학이 사용하는</div></div><div class=\"rc\"><div class=\"e\">to solve problems.</div><div class=\"k\">문제를 해결하기 위해.</div></div><div class=\"rnat\">기초 과학 연구는 기술과 공학이 문제를 해결하는 데 사용하는 원료를 제공한다.</div><div class=\"rst\">기초 과학은 기술과 공학이 문제를 풀 때 쓰는 <b>원재료</b>를 줘요. = 지문 8번, 기초 과학이 주는 첫 번째 선물.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc ckc\"><div class=\"e\">Basic scientific research has yet <span class=\"cw\">one more important use</span></div><div class=\"k\">기초 과학 연구는 게다가 <span class=\"cw\">중요한 용도를 한 가지 더</span> 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">that is so valuable</div><div class=\"k\">매우 귀중해서</div></div><div class=\"rc\"><div class=\"e\">it seems an insult</div><div class=\"k\">모욕처럼 보이는</div></div><div class=\"rc\"><div class=\"e\">to refer to it as merely functional.</div><div class=\"k\">그것(= 그 용도)을 단지 기능적인 것으로 언급하는 것이.</div></div><div class=\"rnat\">기초 과학 연구는 게다가 매우 중요해서 그것을 단지 기능적인 것으로 언급하는 것이 모욕처럼 보이는 중요한 용도를 한 가지 더 가지고 있다.</div><div class=\"rst\">그런데 쓸모가 <b>하나 더</b> 있어요. 너무 귀해서 그냥 ‘도구’라고 부르면 실례일 정도래요. = 지문 9번, 또 하나의 중요한 용도.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Science is the study of nature,</div><div class=\"k\">과학은 자연에 대한 학문이다,</div></div><div class=\"rc\"><div class=\"e\">and as we learn more about how nature works,</div><div class=\"k\">그리고 우리가 자연이 어떻게 작용하는지에 대해 더 많이 배울수록,</div></div><div class=\"rc\"><div class=\"e\">we learn more about</div><div class=\"k\">우리는 ~에 대해 더 많이 알게 된다</div></div><div class=\"rc\"><div class=\"e\">what our existence in this universe means for us.</div><div class=\"k\">이 우주에서의 우리의 존재가 우리에게 무엇을 의미하는지.</div></div><div class=\"rnat\">과학은 자연에 대한 학문이며, 우리가 자연이 어떻게 작용하는지에 대해 더 많이 배울수록, 우리는 이 우주에서의 우리의 존재가 우리에게 무엇을 의미하는지에 대해 더 많이 알게 된다.</div><div class=\"rst\">자연을 알수록 “우리는 우주에서 어떤 존재지?”에 대한 답도 알게 돼요. = 지문 10번, 우주 속 우리 존재의 의미를 알게 된다.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">The seemingly impractical knowledge</div><div class=\"k\">겉보기에 비실용적인 지식은 ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">we gain from space probes to other worlds</div><div class=\"k\">우리가 다른 세계로 보낸 우주 탐사기로부터 얻는</div></div><div class=\"rc\"><div class=\"e\">tells us about our planet</div><div class=\"k\">우리에게 우리의 행성에 대해 알려 준다</div></div><div class=\"rc\"><div class=\"e\">and our own role in the scheme of nature.</div><div class=\"k\">그리고 자연의 체계 속에서 우리 자신의 역할에 대해.</div></div><div class=\"rnat\">우리가 다른 세계에 대한 우주탐사기로부터 얻는 겉보기에 비실용적인 지식들이 우리의 행성과 자연의 체계 속에서 우리 자신의 역할에 대해 우리에게 알려준다.</div><div class=\"rst\"><b>겉보기엔 쓸모없어 보이는</b>(seemingly impractical) 탐사선 지식이 우리 지구와 우리 역할을 알려 줘요. = 지문 11번.</div></div><div class=\"rds key\" data-ord=\"12\"><span class=\"rn\">12번 · 단서</span><div class=\"rc\"><div class=\"e\">Science tells us</div><div class=\"k\">과학은 우리에게 알려 준다</div></div><div class=\"rc\"><div class=\"e\">where we are and what we are,</div><div class=\"k\">우리가 어디에 있고 우리가 무엇인지,</div></div><div class=\"rc ckc\"><div class=\"e\">and that knowledge is <span class=\"cw\">beyond value</span>.</div><div class=\"k\">그리고 그러한 지식은 <span class=\"cw\">가치를 넘어선다</span>(값을 매길 수 없다).</div></div><div class=\"rnat\">과학은 우리가 어디에 있고 우리가 무엇인지 알려주며, 그러한 지식은 가치를 넘어선다.</div><div class=\"rst\">과학은 우리가 어디에 있고 누구인지 알려 주고, 그 앎은 <b>값을 매길 수 없어요</b>(beyond value). = 지문 12번, 글의 결론.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"basic science\" data-m=\"기초 과학\"><b>basic science</b>기초 과학</button><button type=\"button\" class=\"wdb\" data-w=\"practical value\" data-m=\"실용적 가치\"><b>practical value</b>실용적 가치</button><button type=\"button\" class=\"wdb\" data-w=\"raw material\" data-m=\"원재료\"><b>raw material</b>원재료</button><button type=\"button\" class=\"wdb\" data-w=\"insult\" data-m=\"모욕\"><b>insult</b>모욕</button><button type=\"button\" class=\"wdb\" data-w=\"existence\" data-m=\"존재\"><b>existence</b>존재</button><button type=\"button\" class=\"wdb\" data-w=\"beyond value\" data-m=\"값을 매길 수 없는\"><b>beyond value</b>값을 매길 수 없는</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞 <b>seemingly</b>(겉보기에는)가 신호예요. 겉보기엔 A, 실은 B라는 반전이니, 빈칸에는 12번 <b>beyond value</b>(값을 매길 수 없다)의 <b>반대</b>이자 1번 <b>no known practical value</b>(알려진 실용적 가치 없음)·2번 <b>no known practical use</b>(알려진 실용적 용도 없음)를 한 단어로 줄인 말을 고르는 문제예요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (11번)</span><div class=\"en\">The <mark>seemingly</mark> <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> knowledge we gain from space probes to other worlds tells us about our planet …</div><p class=\"ko\">우리가 다른 세계로 보낸 우주 탐사기로부터 얻는 <mark>겉보기에</mark> ( ? ) 지식은 우리 행성에 대해 알려 준다</p></div><div class=\"ck-via\"><i>▼</i><span>기초 과학 = 실용적 가치가 알려지지 않은 과학</span></div><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 기초 과학의 정의</span><div class=\"en\">We might describe science that has <mark>no known practical value</mark> as basic science or basic research.</div><p class=\"ko\">우리는 <mark>알려진 실용적 가치를 전혀 지니지 않은</mark> 과학을 기초 과학이라고 말할 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸의 “다른 세계 탐사”가 바로 쓸모없어 보이는 기초 과학의 예</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">Our exploration of worlds such as Jupiter would be called basic science … because it has <mark>no known practical use</mark>.</div><p class=\"ko\">목성 같은 세계에 대한 탐사는 기초 과학으로 불리고, <mark>알려진 실용적인 용도를 전혀 지니지 않기</mark> 때문에 가치가 없다고 주장하기 쉽다.</p></div><div class=\"ck-via\"><i>▼</i><span>seemingly(겉보기에는) 뒤의 반전: 실은 값을 매길 수 없음</span></div><div class=\"ck-step\"><span class=\"lab\">12번 문장 · 실은 이렇다</span><div class=\"en\">Science tells us where we are and what we are, and that knowledge is <mark>beyond value</mark>.</div><p class=\"ko\">과학은 우리가 어디에 있고 무엇인지 알려 주고, 그러한 지식은 <mark>가치를 넘어선다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">impractical 비실용적인<small>1번 no known practical value(알려진 실용적 가치 없음)·2번 no known practical use(알려진 실용적 용도 없음)를 한 단어로 줄인 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">priceless 값을 매길 수 없이 귀중한</span><span class=\"why\">12번 beyond value(값을 매길 수 없다)와 뜻이 같아 끌려요. 하지만 seemingly(겉보기에는) 뒤에는 실제 가치와 반대되는 겉모습이 와야 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">applicable 적용할 수 있는</span><span class=\"why\">1번은 탐사 같은 기초 과학이 no known practical value(알려진 실용적 가치 없음), 2번은 no known practical use(알려진 실용적 용도 없음)라고 했어요. 겉보기에 바로 쓸 수 있다는 건 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">inaccurate 부정확한</span><span class=\"why\">지식이 정확한지 틀린지는 지문에서 다루지 않아요. 글의 기준은 정확성이 아니라 쓸모가 있어 보이느냐예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">resourceful 수완이 좋은</span><span class=\"why\">수완이 좋다는 건 사람에게 쓰는 말이고, 지문 어디에도 그런 내용이 없어요. 쓸모없어 보인다는 1·2번 흐름과도 안 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">We might describe science</div><div class=\"k\">우리는 과학을 ~라고 말할 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\">that has <span class=\"cw\">no known practical value</span></div><div class=\"k\"><span class=\"cw\">알려진 실용적 가치를 전혀 지니지 않은</span></div></div><div class=\"rc\"><div class=\"e\">as basic science or basic research.</div><div class=\"k\">기초 과학 또는 기초 연구라고.</div></div><div class=\"rnat\">우리는 알려진 실용적 가치를 전혀 지니지 않은 과학을 기초 과학 또는 기초 연구라고 말할 수 있다.</div><div class=\"rst\">과학 동아리에서 밤하늘을 관찰해요. 당장 시험에 안 나오는 이런 공부를 <b>기초 과학</b>이라고 해요. = 지문 1번, 실용적 가치가 알려지지 않은 과학.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">Our exploration of worlds such as Jupiter</div><div class=\"k\">목성과 같은 세계에 대한 우리의 탐사는</div></div><div class=\"rc\"><div class=\"e\">would be called basic science,</div><div class=\"k\">기초 과학으로 불릴 것이다,</div></div><div class=\"rc\"><div class=\"e\">and it is easy to argue</div><div class=\"k\">그리고 주장하기 쉽다</div></div><div class=\"rc\"><div class=\"e\">that basic science is not worth the effort and expense</div><div class=\"k\">기초 과학이 노력과 비용을 들일 가치가 없다고</div></div><div class=\"rc ckc\"><div class=\"e\">because it has <span class=\"cw\">no known practical use</span>.</div><div class=\"k\">그것(= 기초 과학)은 <span class=\"cw\">알려진 실용적인 용도를 전혀 지니지 않기</span> 때문에.</div></div><div class=\"rnat\">목성과 같은 세계에 대한 우리의 탐사는 기초 과학으로 불릴 것인데, 그것(기초 과학)은 알려진 실용적인 용도를 전혀 지니지 않기 때문에 기초 과학이 노력과 비용을 들일 가치가 없다고 주장하기 쉽다.</div><div class=\"rst\">목성을 망원경으로 보는 걸 두고 “그거 해서 뭐 해? 시간·돈 낭비야” 하는 친구도 있어요. = 지문 2번, 노력과 비용을 들일 가치가 없다는 주장.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Of course, the problem is</div><div class=\"k\">물론, 문제는 ~라는 것이다</div></div><div class=\"rc\"><div class=\"e\">that we have no way of knowing</div><div class=\"k\">우리가 알 방법이 없다는</div></div><div class=\"rc\"><div class=\"e\">what knowledge will be of use</div><div class=\"k\">어떤 지식이 유용할지</div></div><div class=\"rc\"><div class=\"e\">until we acquire that knowledge.</div><div class=\"k\">우리가 그 지식을 얻을 때까지는.</div></div><div class=\"rnat\">물론, 문제는 우리가 그 지식을 얻을 때까지는 어떤 지식이 유용할지 아는 방법이 우리에게 없다는 것이다.</div><div class=\"rst\">그런데 어떤 지식이 나중에 쓸모 있을지는 배워 보기 전엔 아무도 몰라요. = 지문 3번, 지식을 얻기 전엔 쓸모를 알 방법이 없다.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">In the middle of the 19th century,</div><div class=\"k\">19세기 중반에,</div></div><div class=\"rc\"><div class=\"e\">Queen Victoria is supposed to have asked</div><div class=\"k\">Victoria 여왕은 물었다고 한다</div></div><div class=\"rc\"><div class=\"e\">physicist Michael Faraday</div><div class=\"k\">물리학자 Michael Faraday에게</div></div><div class=\"rc\"><div class=\"e\">what good his experiments</div><div class=\"k\">그(= Faraday)의 실험이 무슨 도움이 되는지</div></div><div class=\"rc\"><div class=\"e\">with electricity and magnetism were.</div><div class=\"k\">전기와 자성에 관한.</div></div><div class=\"rnat\">19세기 중반에, Victoria(빅토리아) 여왕은 물리학자 Michael Faraday(마이클 패러데이)에게 그의 전기와 자성에 관한 실험이 무슨 도움이 되는지 물었다고 한다.</div><div class=\"rst\">옛날 Victoria(빅토리아) 여왕도 Faraday(패러데이)에게 “그 전기 실험이 무슨 도움이 되나요?” 하고 물었대요. = 지문 4번.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">He answered,</div><div class=\"k\">그(= Faraday)는 대답했다,</div></div><div class=\"rc\"><div class=\"e\">“Madam, what good is a baby?”</div><div class=\"k\">“여왕님, 아기는 무슨 도움이 됩니까?”</div></div><div class=\"rnat\">그(Faraday)는 “여왕님, 아기는 무슨 도움이 됩니까?”라고 대답했다.</div><div class=\"rst\">Faraday(패러데이)는 “아기는 무슨 도움이 되나요?” 하고 되물었어요. 지금은 작아도 자라면 큰일을 한다는 뜻이에요. = 지문 5번.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Of course, Faraday’s experiments</div><div class=\"k\">물론, Faraday의 실험은</div></div><div class=\"rc\"><div class=\"e\">were the beginning of the electronic age.</div><div class=\"k\">전자 시대의 시작이 되었다.</div></div><div class=\"rnat\">물론, Faraday의 실험은 전자 시대의 시작이 되었다(시초였다).</div><div class=\"rst\">그 실험이 결국 <b>전자 시대의 시작</b>이 됐어요. 우리가 쓰는 폰도 거기서 출발한 셈이에요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Many of the practical uses of scientific knowledge</div><div class=\"k\">과학적 지식의 실용적인 활용들 중 많은 것들은</div></div><div class=\"rc\"><div class=\"e\">that fill our world</div><div class=\"k\">우리의 세상을 채우고 있는</div></div><div class=\"rc\"><div class=\"e\">— transistors, vaccines, plastics —</div><div class=\"k\">— 트랜지스터, 백신, 플라스틱 —</div></div><div class=\"rc\"><div class=\"e\">began as basic research.</div><div class=\"k\">기초 연구로 시작되었다.</div></div><div class=\"rnat\">우리의 세상을 채우고 있는 과학적 지식의 실용적인 활용들 중 많은 것들 — 트랜지스터, 백신, 플라스틱 — 은 기초 연구로 시작되었다.</div><div class=\"rst\">백신, 플라스틱처럼 우리 주변 물건도 처음엔 기초 연구에서 시작됐어요. = 지문 7번, 실용적 활용 중 많은 것이 기초 연구로 시작됐다.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Basic scientific research provides the raw materials</div><div class=\"k\">기초 과학 연구는 원료를 제공한다</div></div><div class=\"rc\"><div class=\"e\">that technology and engineering use</div><div class=\"k\">기술과 공학이 사용하는</div></div><div class=\"rc\"><div class=\"e\">to solve problems.</div><div class=\"k\">문제를 해결하기 위해.</div></div><div class=\"rnat\">기초 과학 연구는 기술과 공학이 문제를 해결하는 데 사용하는 원료를 제공한다.</div><div class=\"rst\">기초 과학은 기술과 공학이 문제를 풀 때 쓰는 <b>원재료</b>를 줘요. = 지문 8번, 기초 과학이 주는 첫 번째 선물.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Basic scientific research has yet one more important use</div><div class=\"k\">기초 과학 연구는 게다가 중요한 용도를 한 가지 더 가지고 있다</div></div><div class=\"rc\"><div class=\"e\">that is so valuable</div><div class=\"k\">매우 귀중해서</div></div><div class=\"rc\"><div class=\"e\">it seems an insult</div><div class=\"k\">모욕처럼 보이는</div></div><div class=\"rc\"><div class=\"e\">to refer to it as merely functional.</div><div class=\"k\">그것(= 그 용도)을 단지 기능적인 것으로 언급하는 것이.</div></div><div class=\"rnat\">기초 과학 연구는 게다가 매우 중요해서 그것을 단지 기능적인 것으로 언급하는 것이 모욕처럼 보이는 중요한 용도를 한 가지 더 가지고 있다.</div><div class=\"rst\">그런데 쓸모가 <b>하나 더</b> 있어요. 너무 귀해서 그냥 ‘도구’라고 부르면 실례일 정도래요. = 지문 9번, 또 하나의 중요한 용도.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Science is the study of nature,</div><div class=\"k\">과학은 자연에 대한 학문이다,</div></div><div class=\"rc\"><div class=\"e\">and as we learn more about how nature works,</div><div class=\"k\">그리고 우리가 자연이 어떻게 작용하는지에 대해 더 많이 배울수록,</div></div><div class=\"rc\"><div class=\"e\">we learn more about</div><div class=\"k\">우리는 ~에 대해 더 많이 알게 된다</div></div><div class=\"rc\"><div class=\"e\">what our existence in this universe means for us.</div><div class=\"k\">이 우주에서의 우리의 존재가 우리에게 무엇을 의미하는지.</div></div><div class=\"rnat\">과학은 자연에 대한 학문이며, 우리가 자연이 어떻게 작용하는지에 대해 더 많이 배울수록, 우리는 이 우주에서의 우리의 존재가 우리에게 무엇을 의미하는지에 대해 더 많이 알게 된다.</div><div class=\"rst\">자연을 알수록 “우리는 우주에서 어떤 존재지?”에 대한 답도 알게 돼요. = 지문 10번, 우주 속 우리 존재의 의미를 알게 된다.</div></div><div class=\"rds key\" data-ord=\"11\"><span class=\"rn\">11번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">The <span class=\"cw\">seemingly impractical</span> knowledge</div><div class=\"k\"><span class=\"cw\">겉보기에 비실용적인</span> 지식은 ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">we gain from space probes to other worlds</div><div class=\"k\">우리가 다른 세계로 보낸 우주 탐사기로부터 얻는</div></div><div class=\"rc\"><div class=\"e\">tells us about our planet</div><div class=\"k\">우리에게 우리의 행성에 대해 알려 준다</div></div><div class=\"rc\"><div class=\"e\">and our own role in the scheme of nature.</div><div class=\"k\">그리고 자연의 체계 속에서 우리 자신의 역할에 대해.</div></div><div class=\"rnat\">우리가 다른 세계에 대한 우주탐사기로부터 얻는 겉보기에 비실용적인 지식들이 우리의 행성과 자연의 체계 속에서 우리 자신의 역할에 대해 우리에게 알려준다.</div><div class=\"rst\"><b>겉보기엔 쓸모없어 보이는</b>(seemingly impractical) 탐사선 지식이 우리 지구와 우리 역할을 알려 줘요. = 빈칸, 비실용적인.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Science tells us</div><div class=\"k\">과학은 우리에게 알려 준다</div></div><div class=\"rc\"><div class=\"e\">where we are and what we are,</div><div class=\"k\">우리가 어디에 있고 우리가 무엇인지,</div></div><div class=\"rc ckc\"><div class=\"e\">and that knowledge is <span class=\"cw\">beyond value</span>.</div><div class=\"k\">그리고 그러한 지식은 <span class=\"cw\">가치를 넘어선다</span>(값을 매길 수 없다).</div></div><div class=\"rnat\">과학은 우리가 어디에 있고 우리가 무엇인지 알려주며, 그러한 지식은 가치를 넘어선다.</div><div class=\"rst\">과학은 우리가 어디에 있고 누구인지 알려 주고, 그 앎은 <b>값을 매길 수 없어요</b>(beyond value). = 지문 12번, 겉보기와 반대인 진짜 가치.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"seemingly\" data-m=\"겉보기에는\"><b>seemingly</b>겉보기에는</button><button type=\"button\" class=\"wdb\" data-w=\"impractical\" data-m=\"비실용적인\"><b>impractical</b>비실용적인</button><button type=\"button\" class=\"wdb\" data-w=\"space probe\" data-m=\"우주 탐사기\"><b>space probe</b>우주 탐사기</button><button type=\"button\" class=\"wdb\" data-w=\"scheme of nature\" data-m=\"자연의 체계\"><b>scheme of nature</b>자연의 체계</button><button type=\"button\" class=\"wdb\" data-w=\"beyond value\" data-m=\"값을 매길 수 없는\"><b>beyond value</b>값을 매길 수 없는</button><button type=\"button\" class=\"wdb\" data-w=\"merely\" data-m=\"단지\"><b>merely</b>단지</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);

  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}

});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
