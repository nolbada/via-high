<title>고3 미니모의고사 22회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */

.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}

.sc .ch{margin-bottom:6px}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}

.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

details.sub2{margin:12px 0 0}

.cr{color:#A3102E;font-weight:700}

(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}

    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){

    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}
document.addEventListener('click',function(e){
  const el=e.target.closest&&e.target.closest('.dw');if(!el)return;
  e.stopPropagation();e.preventDefault();
  const p=el.closest('[data-q]');const it=p&&dwItem(p.dataset.q,el.dataset.k);if(!it)return;
  const head=it[2]||it[0],mean=it[1];S.dw=S.dw||{};const on=!S.dw[head];
  if(on)S.dw[head]=1;else delete S.dw[head];save();dwMark(head,on);
  if(on){try{WN.add([{w:head,m:mean,src:'미니모고',how:'별표',ask:true}]);}catch(err){}dwToast(head.replace(/\s+[AB](?=\s|$)/g,'').trim()+'  '+mean.replace(/\bA(?=[에를은는이가와과의도]|\s)|\bB(?=[에를은는이가와과의도]|\s)/g,'').replace(/\s+/g,' ').trim()+'  담음');}
  else{let pr=null;try{pr=WN.del(head,'미니모고');}catch(err){}
    if(pr&&pr.then)pr.then(function(r){if(r&&r.removed===false&&r.reason==='late'){S.dw[head]=1;save();dwMark(head,true);dwToast('이미 쌓인 단어라 뺄 수 없어요');}else if(r&&r.removed)dwToast(head+'  뺌');});
    else dwToast(head+'  뺌');}
},true);

ieved / that it is the antioxidants<sup>1</sup> in these foods / that make the difference<sup>2</sup> / - compounds<sup>3</sup> like beta carotene, lycopene, and vitamin E.", "notes": [["1", "antioxidant", "산화 방지제, 항산화 물질"], ["2", "make the difference", "차이를 만들어 내다"], ["3", "compound", "화합물"]], "lit": "과학자들은 믿어 왔다 / 바로 이 식품들 속의 산화 방지제라고 / 차이를 만들어 내는 것은 / - 베타카로틴, 리코펜, 비타민 E 같은 화합물 말이다.", "nat": "과학자들은 차이를 만들어 내는 것이 바로 이 식품들에 들어 있는 항산화 물질, 즉 베타카로틴, 리코펜, 비타민 E 같은 화합물이라고 믿어 왔다.", "ana": "<b>that</b>이 두 번 나오는데 역할이 서로 다르다. 첫 번째 <b>that</b>은 <b>believed</b>의 목적어 자리를 채우는 <b>명사절 접속사</b>다. 문제는 그 안이다. <b>it is ~ that ...</b>이 보이면 두 가지 가능성을 떠올려야 한다. <b>가주어-진주어</b>냐, <b>강조구문</b>이냐다. 구별법은 간단하다. <b>it is</b>와 <b>that</b>을 지웠을 때 문장이 온전히 남으면 <b>강조구문</b>이다. 여기서는 지우면 <b>the antioxidants in these foods make the difference</b>라는 완전한 문장이 되므로 <b>강조구문</b>이 맞다. 즉 <b>차이를 만드는 것은 다름 아닌 항산화 물질이다</b>라고 주어를 부각한 것이다. 강조구문의 <b>that</b>은 강조되는 말이 사람이면 <b>who</b>로도 바꿀 수 있다. 마지막 줄표 뒤의 <b>compounds like ~</b>는 <b>antioxidants</b>를 다시 풀어 준 <b>동격</b>이다.", "pe": "Scientists have believed / that it is the antioxidants<sup>1</sup> \u0001in these foods\u0002 / that make the difference<sup>2</sup> / - \u0001compounds<sup>3</sup> like beta carotene, lycopene, and vitamin E\u0002.", "pk": "과학자들은 믿어 왔다 / 바로 \u0001이 식품들 속의\u0002 산화 방지제라고 / 차이를 만들어 내는 것은 / - \u0001베타카로틴, 리코펜, 비타민 E 같은 화합물\u0002 말이다.", "core": "과학자들은 산화 방지제가 차이를 만든다고 믿어 왔다.", "tags": ["주어 Scientists, 동사 have believed(현재완료), 목적어: 다음 that절", "that절 = believed의 목적어. <b>it is ~ that 강조구문</b>: 강조된 the antioxidants. in these foods = 전치사구(형용사구): antioxidants 꾸밈", "that make the difference = 강조구문의 that + 동사 + 목적어 (차이를 만드는 것은)", "대시 삽입: compounds like ~ = 동격 어구: antioxidants 부연"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 that절 안에 it is ~ that 강조구문이 들어 있어 어려워 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Scientists (과학자들)", "V: have believed (believe 믿다의 현재완료)", "O: that it is the antioxidants ~ that make the difference (차이를 만드는 것이 바로 산화 방지제라는 것)", "뼈대 = <b>Scientists have believed that ~</b>"]}, {"t": "that절은 <b>it is A that ~</b> 강조구문이다 ('~하는 것은 바로 A이다').", "sub": ["강조된 A = the antioxidants in these foods (이 식품들 속의 산화 방지제. antioxidant 산화 방지제)", "that make the difference = 차이를 만드는 (make the difference 차이를 만들다)"]}, {"t": "A와 that을 빼고 원래 문장으로 돌려 본다. 원래 문장은 <b>The antioxidants in these foods make the difference.</b>로 완전한 문장이다. 그래서 이 that은 관계대명사가 아니라 강조구문의 that이다."}, {"t": "대시 뒤 <b>compounds like beta carotene, lycopene, and vitamin E</b>는 antioxidants를 풀어 주는 부연이다 ('베타카로틴, 리코펜, 비타민 E 같은 화합물'. compound 화합물)."}], "sum": "차이를 만드는 건 식품 속 산화 방지제라고 과학자들은 믿어 옴"}, {"i": "04", "q": "03", "s": "4", "title": "Yet + when절 (수동태 병렬) + S+V+O", "eng": "Yet when these molecules<sup>1</sup> were extracted<sup>2</sup> from fruits and vegetables / and made into supplements<sup>3</sup>, / they did not reduce<sup>4</sup> cancer.", "notes": [["1", "molecule", "분자"], ["2", "extract", "추출하다"], ["3", "supplement", "보충제"], ["4", "reduce", "줄이다"]], "lit": "그러나 이 분자들이 과일과 채소에서 추출되어 / 그리고 보충제로 만들어졌을 때, / 그것들은 암을 줄이지 못했다.", "nat": "그러나 이 분자들을 과일과 채소에서 추출해 보충제로 만들었을 때는 암을 줄여 주지 못했다.", "ana": "<b>and</b>가 무엇과 무엇을 잇는지가 이 문장의 전부다. 얼핏 보면 <b>fruits and vegetables</b>의 <b>and</b>와 헷갈리지만, 뒤의 <b>made</b>는 명사가 아니라 <b>과거분사</b>다. 즉 <b>were extracted</b>와 <b>(were) made</b>라는 <b>수동태 두 개가 병렬</b>된 것이고, 반복되는 <b>were</b>가 생략되었다. 영어는 <b>앞에서 이미 쓴 말을 뒤에서 반복하지 않는다</b>는 원칙을 여기서도 확인할 수 있다. <b>make A into B</b>는 '<b>A를 B로 만들다</b>'인데 수동이 되면서 <b>A</b>가 주어 자리로 올라가 <b>be made into B</b>가 되었다. 주절의 <b>they</b>는 앞의 <b>these molecules</b>를 받고, 부정문에서 <b>did not reduce</b>처럼 <b>do</b>가 시제를 떠맡으면 본동사는 원형으로 돌아간다는 점도 함께 보자.", "pe": "Yet \u0001when these molecules<sup>1</sup> were extracted<sup>2</sup> from fruits and vegetables\u0002 / \u0001and made into supplements<sup>3</sup>\u0002, / they did not reduce<sup>4</sup> cancer.", "pk": "그러나 \u0001이 분자들이 과일과 채소에서 추출되어\u0002 / \u0001그리고 보충제로 만들어졌을 때\u0002, / 그것들은 암을 줄이지 못했다.", "core": "그것들은 암을 줄이지 못했다.", "tags": ["Yet: 역접. when ~ = 부사절(시간): did not reduce 꾸밈. were extracted = 수동태. from fruits and vegetables = 부사구: extracted 꾸밈", "and: when절 안의 수동태 병렬. made into supplements = (were) made into ~ : when절의 두 번째 수동태", "주어 they, 동사 did not reduce, 목적어 cancer"], "steps": [{"t": "이 문장은 <b>when 시간절 + S+V+O(3형식)</b>이다. when절 안에 수동태가 둘 병렬이라 길어 보인다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: they (= these molecules, 이 분자들)", "V: did not reduce (줄이지 못했다. reduce 줄이다)", "O: cancer (암)", "뼈대 = <b>they did not reduce cancer</b> (Yet 그러나, 접속사)"]}, {"t": "맨 앞 <b>when ~ supplements</b>는 시간 부사절이다 ('~했을 때').", "sub": ["S: these molecules (이 분자들. molecule 분자)"]}, {"t": "수동태가 두 개 and로 병렬이다.", "sub": ["① were extracted from fruits and vegetables (과일과 채소에서 추출되었다. extract 추출하다)", "② (were) made into supplements (보충제로 만들어졌다. supplement 보충제). 같은 were를 생략"]}, {"t": "함정: 두 번째 made는 동사 과거형이 아니라, 생략된 were와 함께 쓰인 과거분사이다."}], "sum": "분자를 과일·채소에서 뽑아 보충제로 만들면 암을 줄이지 못함"}, {"i": "05", "q": "04", "s": "3", "title": "S+V+C + 계속적 both of which", "eng": "The dual<sup>1</sup> expressions of this tendency<sup>2</sup> / are anthropomorphism<sup>3</sup> (the practice of regarding<sup>4</sup> animals as humans) and totemism (the practice of regarding humans as animals), / both of which spread through the visual art and the mythology<sup>5</sup> of primitive cultures.", "notes": [["1", "dual", "이중의, 두 갈래의"], ["2", "tendency", "경향"], ["3", "anthropomorphism", "의인화"], ["4", "regard A as B", "A를 B로 간주하다"], ["5", "mythology", "신화"]], "lit": "이 경향의 두 가지 표현은 / 의인화(동물을 인간으로 여기는 관행)와 토테미즘(인간을 동물로 여기는 관행)인데, / 그 둘 다 원시 문화의 시각 예술과 신화 전반에 퍼져 나갔다.", "nat": "이 경향이 드러나는 두 갈래가 의인화(동물을 인간처럼 여기는 관행)와 토테미즘(인간을 동물처럼 여기는 관행)이며, 이 둘은 모두 원시 문화의 시각 예술과 신화 전반에 퍼져 있었다.", "ana": "괄호 두 개를 <b>먼저 지우고</b> 읽어야 뼈대가 보인다. 괄호 안은 각각 <b>anthropomorphism</b>과 <b>totemism</b>을 풀어 준 <b>동격</b>이라 지워도 문장이 성립한다. 지우면 <b>The dual expressions are A and B</b>라는 단순한 뼈대가 남는다. 진짜 볼 것은 <b>both of which</b>다. 앞에 이미 <b>are</b>라는 동사가 있는데 뒤에 <b>spread</b>라는 동사가 또 나온다. 동사가 두 개면 반드시 <b>접속사나 관계사</b>가 있어야 하는데, 그 역할을 하는 것이 <b>which</b>다. 만약 <b>both of them</b>이었다면 접속사가 없어 틀린 문장이 된다. <b>전치사(of) + 관계대명사</b> 형태이므로 뒤에는 <b>완전한 문장</b>이 오고, <b>which</b>는 앞의 <b>anthropomorphism and totemism</b>을 받는다. 참고로 <b>regard A as B</b>('A를 B로 여기다')는 앞 문장의 <b>view A as B</b>와 같은 계열의 표현이다.", "pe": "The \u0001dual<sup>1</sup>\u0002 expressions \u0001of this tendency<sup>2</sup>\u0002 / are anthropomorphism<sup>3</sup> (the practice of regarding<sup>4</sup> animals as humans) and totemism (the practice of regarding humans as animals), / \u0001both of which spread through the visual art and the mythology<sup>5</sup> of primitive cultures\u0002.", "pk": "\u0001이 경향의\u0002 \u0001두 가지\u0002 표현은 / 의인화(동물을 인간으로 여기는 관행)와 토테미즘(인간을 동물로 여기는 관행)인데, / \u0001그 둘 다 원시 문화의 시각 예술과 신화 전반에 퍼져 나갔다\u0002.", "core": "표현은 의인화와 토테미즘이다.", "tags": ["주어 expressions. dual = 형용사: expressions 꾸밈. of this tendency = 전치사구(형용사구): expressions 꾸밈", "동사 are, 보어 anthropomorphism and totemism (SVC). 괄호 속 the practice of ~ = 각 용어의 뜻풀이", "both of which ~ = <b>계속적 용법</b> 관계절(형용사절): anthropomorphism과 totemism을 받음. spread through = ~ 전역에 퍼지다"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) + 계속적 관계절</b>이다. 괄호 설명과 both of which가 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The dual expressions (두 가지 표현. dual 두 가지의, expression 표현). of this tendency는 '이 경향의'", "V: are (be ~이다)", "C: anthropomorphism and totemism (의인화와 토테미즘)", "뼈대 = <b>The dual expressions are anthropomorphism and totemism</b>"]}, {"t": "괄호 안은 각 용어의 뜻풀이이다. 둘 다 <b>regard A as B</b> (A를 B로 여기다) 구조이다.", "sub": ["anthropomorphism (the practice of regarding animals as humans) = 동물을 인간으로 여기는 관행 (의인화)", "totemism (the practice of regarding humans as animals) = 인간을 동물로 여기는 관행 (토테미즘)", "practice 관행, tendency 경향"]}, {"t": "<b>both of which spread ~</b>는 계속적 용법의 관계절이다. which는 anthropomorphism and totemism 둘을 가리킨다 ('그 둘 다').", "sub": ["S: both of which / V: spread (퍼지다. 현재형과 과거형의 모양이 같다)", "through the visual art and the mythology of primitive cultures = 원시 문화의 시각 예술과 신화 전반에 (primitive 원시의, mythology 신화)"]}], "sum": "이 경향의 두 표현은 의인화와 토테미즘, 둘 다 원시 예술·신화에 퍼짐"}, {"i": "06", "q": "05", "s": "3", "title": "S+V+C + too ~ to 구문 (to부정사 병렬)", "eng": "It's too fixated on<sup>1</sup> buying the next toy / to ever delay<sup>2</sup> gratification<sup>3</sup>, / to ever save and invest<sup>4</sup> for the future.", "notes": [["1", "be fixated on", "~에 집착하다"], ["2", "delay", "미루다, 지연시키다"], ["3", "gratification", "욕구 충족"], ["4", "invest", "투자하다"]], "lit": "그것은 다음 장난감을 사는 데 너무 집착해서 / 결코 욕구 충족을 미루지 못하고, / 결코 미래를 위해 저축하고 투자하지 못한다.", "nat": "소비 문화는 다음 장난감을 사는 데 너무 사로잡혀 있어서 욕구 충족을 미루지도, 미래를 위해 저축하고 투자하지도 못한다.", "ana": "<b>too ~ to V</b>는 '<b>너무 ~해서 …할 수 없다</b>'는 뜻이다. 형태에 <b>not</b>이 없는데도 <b>부정의 뜻</b>이 담긴다는 점이 핵심이라, 여기에 다시 <b>not</b>을 붙이면 틀린다. 이 문장이 어려운 이유는 <b>to</b>가 두 번 나오기 때문이다. <b>to ever delay</b>와 <b>to ever save and invest</b>는 <b>둘 다 too에 걸리는 병렬</b>이며, 콤마가 <b>and</b>를 대신하고 있다. 즉 '너무 집착해서 <b>미루지도 못하고 저축하지도 못한다</b>'로 두 개를 모두 부정으로 읽어야 한다. 사이에 낀 <b>ever</b>는 부정의 뜻을 강조해 '<b>결코</b>'로 새기면 된다. 앞의 <b>be fixated on</b> 뒤에는 전치사 <b>on</b>이 있으므로 <b>동명사 buying</b>이 왔다는 점도 확인해 두자.", "pe": "It's \u0001too\u0002 fixated \u0001on<sup>1</sup> buying the next toy\u0002 / \u0001to ever delay<sup>2</sup> gratification<sup>3</sup>\u0002, / \u0001to ever save and invest<sup>4</sup> for the future\u0002.", "pk": "그것은 \u0001다음 장난감을 사는 데\u0002 \u0001너무\u0002 집착해서 / \u0001결코 욕구 충족을 미루지 못하고\u0002, / \u0001결코 미래를 위해 저축하고 투자하지 못한다\u0002.", "core": "그것은 집착한다.", "tags": ["주어 It + 동사 is + 보어 fixated: 2형식. (too) = 부사: fixated를 꾸밈. (on buying …) = 전치사구(부사구): fixated를 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "to delay ~ = to부정사(부사적: <b>too ~ to</b>의 결과): fixated 꾸밈 (너무 ~해서 못함). ever = 강조 부사", "to save and invest ~ = to부정사 ② 병렬(동사 2개). for the future = 부사구: save and invest 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 보어 뒤에 too ~ to 구문과 병렬 to부정사가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (그것)", "V: 's (is의 줄임. be ~이다)", "C: fixated (사로잡힌, 집착하는. 분사형 형용사)", "뼈대 = <b>It's fixated</b>", "판정 기준: be + 분사형 형용사는 2형식"]}, {"t": "<b>too fixated on buying the next toy</b>에서 too는 '너무'이다. fixated on ~ = ~에 사로잡힌, on 뒤의 buying은 동명사이다 ('다음 장난감을 사는 데')."}, {"t": "<b>to ever delay gratification</b>은 too ~ to 구문의 to부정사이다 ('너무 ~해서 …하지 못한다').", "sub": ["delay 미루다, gratification 욕구 충족, ever 결코(강조)"]}, {"t": "<b>to ever save and invest for the future</b>도 같은 too ~ to에 걸리는 병렬 to부정사이다 ('미래를 위해 저축하고 투자하지 못한다').", "sub": ["동사 save (저축하다)와 invest (투자하다)가 병렬", "함정: 부정어 not이 없어도 too ~ to는 '~하지 못한다'는 부정의 뜻이다."]}], "sum": "다음 장난감 사기에 너무 집착해 만족 미루기와 저축·투자는 못 함"}, {"i": "07", "q": "05", "s": "6", "title": "S+V+C (seem to) + by -ing 병렬 + 대시 삽입", "eng": "Indeed, the policies<sup>1</sup> of our nation's central bank seem to reinforce<sup>2</sup> this habit / by driving down interest rates<sup>3</sup> to near zero / and thereby denying<sup>4</sup> people a material reward / - in the form of interest on their banked savings - / for foregoing<sup>5</sup> consumption.", "notes": [["1", "policy", "정책"], ["2", "reinforce", "강화하다"], ["3", "interest rate", "금리"], ["4", "deny A B", "A에게 B를 주지 않다"], ["5", "forego", "단념하다, 포기하다"]], "lit": "실제로 우리나라 중앙은행의 정책은 이 습관을 강화하는 것처럼 보인다 / 금리를 거의 0에 가깝게 끌어내림으로써 / 그리고 그렇게 함으로써 사람들에게서 물질적 보상을 빼앗음으로써 / - 은행에 넣어 둔 저축에 붙는 이자라는 형태의 - / 소비를 단념한 데 대한.", "nat": "실제로 우리나라 중앙은행의 정책은 금리를 거의 0까지 끌어내림으로써, 그리고 그렇게 해서 소비를 참은 대가로 사람들이 받아야 할 물질적 보상 - 저축에 붙는 이자 - 을 없앰으로써 이런 습관을 오히려 강화하는 것처럼 보인다.", "ana": "주어는 <b>the policies</b>이고 <b>of our nation's central bank</b>는 그것을 꾸미는 전치사구라, 동사가 <b>seem</b>으로 복수에 맞춰졌다. <b>seem to V</b>는 '<b>~인 것처럼 보인다</b>'로, <b>It seems that ~</b>으로 바꿔 쓸 수 있다. 문장이 길어 보이는 진짜 이유는 <b>by</b> 하나에 <b>동명사 두 개</b>가 걸려 있기 때문이다. <b>by driving down ~ and (by) thereby denying ~</b>의 구조이며, 반복되는 <b>by</b>가 생략되었다. <b>and</b> 뒤가 <b>denying</b>인지 <b>denied</b>인지로 병렬 여부를 판단하는 것이 어법 문제의 단골이다. <b>deny</b>는 <b>deny + 사람 + 사물</b>로 '<b>~에게 …을 주지 않다</b>'라는 4형식으로 쓰였고, 두 줄표 사이의 <b>in the form of ~</b>는 <b>reward</b>를 설명하는 <b>삽입</b>이므로 지우고 읽어야 <b>a material reward for foregoing consumption</b>('소비를 단념한 데 대한 물질적 보상')이 붙는다.", "pe": "\u0001Indeed\u0002, the policies<sup>1</sup> \u0001of our nation's central bank\u0002 seem to reinforce<sup>2</sup> this habit / \u0001by driving down interest rates<sup>3</sup> \u0001to near zero\u0002\u0002 / \u0001and thereby denying<sup>4</sup> people a material reward\u0002 / - \u0001in the form of interest on their banked savings\u0002 - / \u0001for foregoing<sup>5</sup> consumption\u0002.", "pk": "\u0001실제로\u0002 \u0001우리나라 중앙은행의\u0002 정책은 이 습관을 강화하는 것처럼 보인다 / \u0001금리를 \u0001거의 0에 가깝게\u0002 끌어내림으로써\u0002 / \u0001그리고 그렇게 함으로써 사람들에게서 물질적 보상을 빼앗음으로써\u0002 / - \u0001은행에 넣어 둔 저축에 붙는 이자라는 형태의\u0002 - / \u0001소비를 단념한 데 대한\u0002.", "core": "정책은 이 습관을 강화하는 것처럼 보인다.", "tags": ["Indeed = 부사: 문장 꾸밈. 주어 policies(of ~ bank = 형용사구: policies 꾸밈), 동사 seem to reinforce, 목적어 this habit", "by driving down ~ = 전치사구(부사구): reinforce 꾸밈 (수단). to near zero = 부사구: driving down 꾸밈", "and: by의 동명사 병렬. thereby denying ~ = by의 목적어 ②(부사구 일부): reinforce 꾸밈. deny + 사람 + 물건", "대시 삽입: in the form of ~ = 전치사구(형용사구): reward 부연", "for foregoing consumption = 전치사구(형용사구): reward 꾸밈 (~한 데 대한). foregoing은 전치사 for의 목적어(동명사)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 문장 뒤쪽에 by -ing가 둘 병렬되고 대시 삽입이 있어 아주 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the policies (정책들). of our nation's central bank는 '우리나라 중앙은행의'", "V: seem (seem ~처럼 보이다)", "C: to reinforce this habit (이 습관을 강화하는 것. reinforce 강화하다, habit 습관). 판정 기준: seem 뒤의 to부정사는 보어로 보아 2형식", "뼈대 = <b>the policies seem to reinforce this habit</b>"]}, {"t": "<b>by driving down interest rates to near zero</b>는 수단을 나타내는 'by + 동명사'이다 ('금리를 거의 0까지 끌어내림으로써').", "sub": ["drive down 끌어내리다, interest rate 금리, near zero 거의 0"]}, {"t": "<b>and thereby denying people a material reward</b>는 by의 동명사 두 번째 병렬이다 ('그렇게 함으로써 사람들에게서 물질적 보상을 빼앗음으로써').", "sub": ["deny A B = A에게 B를 주지 않다 (people에게 reward를)", "thereby 그렇게 함으로써, material 물질적인, reward 보상"]}, {"t": "대시 사이 <b>in the form of interest on their banked savings</b>는 reward를 풀어 주는 삽입이다 ('은행에 넣어 둔 저축에 붙는 이자라는 형태의'). <b>for foregoing consumption</b>은 reward를 꾸민다 ('소비를 단념한 데 대한').", "sub": ["forgo(forego로도 씀) 단념하다 → foregoing은 for 뒤의 동명사 (형용사 foregoing '앞서 말한'이 아님)", "banked savings 은행에 예치된 저축, consumption 소비"]}, {"t": "맨 앞 <b>Indeed</b>(실제로)는 문장 전체를 꾸미는 부사이다."}], "sum": "중앙은행 정책, 금리를 낮춰 저축 이자를 없애며 이 습관을 오히려 강화"}, {"i": "08", "q": "06", "s": "1", "title": "S+V (수동태) + 복합관계사 양보절 2개", "eng": "Politics cannot be suppressed<sup>1</sup>, / whichever policy process<sup>2</sup> is employed<sup>3</sup> / and however sensitive<sup>4</sup> and respectful of<sup>5</sup> differences it might be.", "notes": [["1", "suppress", "억압하다, 억누르다"], ["2", "policy process", "정책 과정"], ["3", "employ", "사용하다, 채택하다"], ["4", "sensitive", "세심한, 민감한"], ["5", "respectful of", "~을 존중하는"]], "lit": "정치는 억압될 수 없다, / 어떤 정책 과정이 사용되든 / 그리고 그것이 아무리 세심하고 차이를 존중한다 하더라도.", "nat": "어떤 정책 과정을 쓰든, 또 그 과정이 아무리 세심하고 차이를 존중하는 것이든 정치는 억눌릴 수 없다.", "ana": "콤마 뒤가 통째로 <b>양보의 부사절 두 개</b>다. <b>whichever</b>는 뒤에 명사 <b>policy process</b>를 데리고 다니는 <b>복합관계형용사</b>로, '<b>어떤 ~이든</b>'으로 새긴다. <b>no matter which policy process</b>로 바꿔 쓸 수 있다. 두 번째 <b>however</b>는 '<b>그러나</b>'가 아니다. 뒤에 바로 <b>형용사(sensitive)</b>가 붙어 있으면 '<b>아무리 ~하더라도</b>'라는 뜻의 <b>복합관계부사</b>이고, <b>no matter how sensitive</b>와 같다. <b>however + 형용사 + 주어 + 동사</b>라는 <b>어순</b>까지 함께 외워 두면 뒤의 <b>it might be</b>가 왜 뒤로 밀렸는지 바로 보인다. <b>respectful</b> 역시 <b>however</b>에 함께 걸리는 형용사라 <b>sensitive and respectful</b>이 병렬이고, <b>it</b>은 앞의 <b>policy process</b>를 받는다.", "pe": "Politics cannot be suppressed<sup>1</sup>, / \u0001whichever policy process<sup>2</sup> is employed<sup>3</sup>\u0002 / \u0001and however sensitive<sup>4</sup> and respectful of<sup>5</sup> differences it might be\u0002.", "pk": "정치는 억압될 수 없다, / \u0001어떤 정책 과정이 사용되든\u0002 / \u0001그리고 그것이 아무리 세심하고 차이를 존중한다 하더라도\u0002.", "core": "정치는 억압될 수 없다.", "tags": ["주어 Politics, 동사 cannot be suppressed(조동사 수동태)", "<b>whichever</b> + 명사 = 복합관계형용사절(양보): suppressed 꾸밈 (어떤 ~이든). no matter which와 같음", "and: 양보절 병렬. <b>however + 형용사 + 주어 + 동사</b> = 복합관계부사절(양보): suppressed 꾸밈. sensitive and respectful 병렬, it = policy process"], "steps": [{"t": "이 문장은 <b>수동태 S+V(1형식) + 양보 부사절 2개</b>이다. 뒤의 whichever절과 however절이 모두 양보절이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Politics (정치)", "V: cannot be suppressed (억압될 수 없다. suppress 억압하다의 조동사 수동태)", "뼈대 = <b>Politics cannot be suppressed</b>", "판정 기준: 수동태 주절은 1형식"]}, {"t": "<b>whichever policy process is employed</b>는 복합관계형용사 양보절이다 ('어떤 정책 과정이 사용되든').", "sub": ["whichever + 명사 = 어떤 ~이든", "S: whichever policy process / V: is employed (사용된다. employ 사용하다, process 과정)"]}, {"t": "<b>however sensitive and respectful of differences it might be</b>는 복합관계부사 양보절이다 ('아무리 세심하고 차이를 존중하더라도').", "sub": ["However + 형용사 + S + V = 아무리 ~하더라도", "S: it (= policy process, 정책 과정) / V: might be / C: sensitive and respectful of differences", "sensitive 세심한, respectful of ~ ~을 존중하는, difference 차이"]}, {"t": "함정: whichever는 뒤에 명사(policy process)가 바로 오고, however는 뒤에 형용사(sensitive)가 온다."}], "sum": "어떤 정책 과정이든, 아무리 세심해도 정치는 억누를 수 없음"}], "qs": [{"q": "01", "type": "필자의 주장", "src": "2016학년도 9월 20번", "ans": "②", "tr": [["1", "목표를 분명하게 정의해 두는 것만으로는 충분하지 않다. 순간순간 무엇을 정확히 해야 하는지도 알아야 하기 때문이다."], ["2", "예를 들어 어떤 판매원의 목표는 수익이 나도록 판매를 성사시키는 것이다."], ["3", "그러나 판매 하나하나는 서로 다른 접근을 요구한다. 밀어붙여야 하는가 느긋해야 하는가, 권위 있게 굴어야 하는가 친근하게 굴어야 하는가?"], ["4", "그리고 제품의 어떤 측면을 강조해야 하는가?"], ["5", "이 질문들에 대한 답은 미리 예측할 수 없는 변수에 달려 있다."], ["6", "이는 판매에만 해당하는 것이 아니라 대부분의 인간 활동에도 그대로 적용된다."], ["7", "사람은 상황에 맞는 특정한 전략을 선택하고, 그렇게 선택한 행동 방침을 따라야 한다."], ["8", "그렇게 해야 목표를 이루는 데에서 더 오래가는 성공을 보장할 수 있다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "One must select a particular strategy appropriate to the occasion and follow the chosen course of action."}, {"en": false, "h": "주장 문항은 <b>must · should · have to</b> 같은 <b>당위의 조동사</b>가 붙은 문장을 찾으면 거의 끝난다. 이 글에서 그 표현이 나오는 곳은 1번과 7번 두 군데인데, 1번은 <b>~만으로는 충분하지 않다</b>는 문제 제기이고 7번이 <b>그래서 어떻게 하라</b>는 해답이다. 7번의 핵심어는 <b>a particular strategy</b>(특정한 전략)와 <b>appropriate to the occasion</b>(상황에 맞는) 둘이다. 이 둘이 그대로 ②의 <b>상황에 맞는 전략</b>과 겹친다. 이어지는 8번이 <b>Doing so will ensure more lasting success in reaching one's goals</b>로 <b>목표 달성</b>이라는 목적까지 못 박아 주므로, ②의 앞부분 <b>목표 달성을 위해</b>까지 완성된다. 2~5번의 판매원 이야기는 <b>For instance</b>로 시작하는 <b>예시</b>일 뿐이라 여기서 답을 찾으면 안 된다."}], "opts": [{"n": "①", "t": "비판적 분석에 기반을 두고 목표 설정을 해야 한다.", "a": false, "x": true, "trap": false, "e": "글은 <b>목표를 어떻게 세울 것인가</b>가 아니라 <b>목표를 세운 다음 무엇을 해야 하는가</b>를 말한다. 1번이 이미 <b>목표를 분명히 정의하는 것만으로는 부족하다</b>고 선을 그었다."}, {"n": "②", "t": "목표 달성을 위해 상황에 맞는 전략을 사용해야 한다.", "a": true, "x": false, "trap": false, "e": "7번의 <b>select a particular strategy appropriate to the occasion</b>과 8번의 <b>in reaching one's goals</b>가 그대로 대응한다."}, {"n": "③", "t": "경제 활성화 전략 수립을 위해 시장 조사를 해야 한다.", "a": false, "x": true, "trap": false, "e": "<b>전략(strategy)</b>이라는 단어만 같을 뿐이다. <b>경제 활성화</b>나 <b>시장 조사</b>에 해당하는 내용은 한 줄도 없다. 판매원은 예시로 등장했을 뿐이다."}, {"n": "④", "t": "성공적인 업무 수행을 위해 작업 환경을 개선해야 한다.", "a": false, "x": true, "trap": false, "e": "<b>success</b>라는 단어는 8번에 나오지만, <b>작업 환경(working environment)</b>은 지문 어디에도 없다. 글이 말하는 것은 환경이 아니라 <b>행동 방침의 선택</b>이다."}, {"n": "⑤", "t": "고객의 신뢰를 얻기 위해 일관된 전략을 사용해야 한다.", "a": false, "x": true, "trap": true, "e": "판매원이 나오니 <b>고객</b>이 자연스러워 보이고 <b>전략</b>이라는 말도 겹쳐서 고르기 쉽다. 그러나 글의 핵심은 <b>일관된(consistent)</b> 전략이 아니라 <b>상황마다 달라지는</b> 전략이다. 3번이 <b>each sale requires a different approach</b>라고 정반대로 못 박았다."}], "w": [["merely", "단지, 그저"], ["clearly defined", "분명하게 정의된"], ["sufficient", "충분한"], ["moment by moment", "순간순간"], ["precisely", "정확히"], ["salesperson", "판매원"], ["conclude a sale", "판매를 성사시키다"], ["profitably", "수익이 나도록"], ["approach", "접근법"], ["pushy", "밀어붙이는, 강압적인"], ["laid back", "느긋한"], ["authoritative", "권위적인"], ["aspect", "측면, 부면"], ["depend on", "~에 달려 있다"], ["variable", "변수"], ["in advance", "미리, 사전에"], ["hold true", "적용되다, 유효하다"], ["appropriate to", "~에 맞는"], ["occasion", "상황, 경우"], ["course of action", "행동 방침"], ["ensure", "보장하다"], ["lasting", "지속적인"]]}, {"q": "02", "type": "심경", "src": "2022년 7월 19번", "ans": "④", "tr": [["1", "어느 날 밤 친구 한 명과 나는 그 빅풋을 찾으러 가기로 했다."], ["2", "우리는 내 낡은 트럭을 타고 있었고, 가장 높은 언덕 쪽으로 방향을 잡아 들판을 가로질러 출발했다."], ["3", "들판은 울퉁불퉁했고, 따라갈 만한 길이라고는 아주 희미한 자취뿐이었다."], ["4", "가는 길에는 들판에 파인 작은 구덩이들이 있었다."], ["5", "나는 왜 그런지 끝내 알아내지 못했다."], ["6", "언덕 꼭대기에 점점 더 가까워질수록 나는 실제로 겁이 나기 시작했는데, 그건 좀 드문 일이었다. 그 나이의 나는 꽤 겁이 없는 편이었기 때문이다."], ["7", "우리가 언덕 꼭대기에 다다랐을 때, 쿵 하는 큰 소리가 났다!"], ["8", "내 트럭은 무언가 무거운 것이 짐칸에 막 뛰어든 것처럼 아래로 푹 내려앉았다."], ["9", "우리는 너무 겁이 나서 뒤쪽을 들여다볼 수 없었다."], ["10", "나는 공포에 사로잡혀 트럭을 후진 기어에 넣고 언덕 아래로 물러나기로 했다."], ["11", "내가 그렇게 하자 또 한 번 쿵 소리가 났고, 그때까지 한 번도 들어 본 적 없는 커다란 포효가 터져 나왔다."]], "evh": "9번 문장", "ev": [{"en": true, "h": "We were too terrified to look in the back."}, {"en": false, "h": "심경 문항은 <b>감정을 직접 드러내는 형용사</b>를 순서대로 따라가면 된다. 이 글은 <b>scared</b>(6번) → <b>terrified</b>(9번) → <b>panicked</b>(10번)로 <b>겁</b>이 한 방향으로만 짙어진다. 그중에서도 9번의 <b>too terrified to look in the back</b>은 <b>무서워서 뒤를 못 볼 정도</b>라는, 감정의 세기를 가장 분명하게 보여 주는 문장이다. 6번의 <b>which was kind of rare, because at that age I was pretty fearless</b>도 결정적이다. <b>평소에는 겁이 없던 사람</b>이 겁을 먹었다고 굳이 밝혔다는 것은, 이 상황이 그만큼 놀랍고 무서웠다는 뜻이기 때문이다. 마지막 11번의 <b>a loud roar ~ like I'd never, ever heard before</b>까지 겹치면 <b>놀라움 + 두려움</b>이라는 ④가 답이 된다."}], "opts": [{"n": "①", "t": "relieved and relaxed (안도하고 편안한)", "a": false, "x": true, "trap": false, "e": "안도할 만한 일이 한 번도 일어나지 않는다. 소리는 오히려 뒤로 갈수록 커지고, 마지막 문장의 <b>a loud roar</b>로 끝난다."}, {"n": "②", "t": "pleased and delighted (기쁘고 즐거운)", "a": false, "x": true, "trap": true, "e": "출발할 때의 <b>모험을 떠나는 들뜬 기분</b>만 보면 고를 수 있지만, 심경 문항은 <b>글 전체의 흐름</b>을 본다. 6번부터 감정이 완전히 뒤집힌다."}, {"n": "③", "t": "bored and indifferent (지루하고 무관심한)", "a": false, "x": true, "trap": false, "e": "<b>I never figured out why</b>(5번)를 무관심으로 오해하기 쉽지만, 이는 <b>이유를 알 수 없었다</b>는 말이지 관심이 없었다는 뜻이 아니다."}, {"n": "④", "t": "alarmed and frightened (놀라고 겁먹은)", "a": true, "x": false, "trap": false, "e": "<b>becoming scared</b>(6번) → <b>too terrified</b>(9번) → <b>panicked</b>(10번)로 이어지는 감정선이 그대로 <b>놀람과 두려움</b>이다."}, {"n": "⑤", "t": "dissatisfied and angry (불만족스럽고 화난)", "a": false, "x": true, "trap": false, "e": "화를 낼 대상이 등장하지 않는다. 감정이 향하는 곳은 <b>정체를 알 수 없는 존재</b>이고, 반응은 분노가 아니라 <b>도망</b>이다."}], "w": [["buddy", "친구"], ["set off", "출발하다"], ["head toward", "~를 향해 가다"], ["rough", "울퉁불퉁한, 거친"], ["slightest", "아주 희미한"], ["trail", "오솔길, 자취"], ["trench", "구덩이, 도랑"], ["figure out", "알아내다"], ["scared", "겁먹은"], ["rare", "드문"], ["fearless", "겁이 없는, 용감한"], ["thump", "쿵 하는 소리"], ["sink down", "내려앉다"], ["bed", "(트럭의) 짐칸"], ["terrified", "몹시 겁먹은"], ["panic", "공포에 사로잡히다"], ["throw into reverse", "후진 기어를 넣다"], ["back down", "후진해서 내려오다"], ["roar", "포효, 으르렁거리는 소리"]]}, {"q": "03", "type": "글의 주제", "src": "2014학년도 9월 B형 24번", "ans": "③", "tr": [["1", "과학자들이 겉보기에 유익해 보이는 영양소를 찾아낼 수 있을 때조차, 그들은 그 영양소가 실생활의 맥락에서, 즉 매일의 식사 과정에서 어떻게 작용할지를 늘 이해하지는 못한다."], ["2", "과일과 채소는 암을 예방하는 데 도움이 된다고 여겨진다."], ["3", "과학자들은 차이를 만들어 내는 것이 바로 이 식품들에 들어 있는 항산화 물질, 즉 베타카로틴, 리코펜, 비타민 E 같은 화합물이라고 믿어 왔다."], ["4", "그러나 이 분자들을 과일과 채소에서 추출해 보충제로 만들었을 때는 암을 줄여 주지 못했다."], ["5", "베타카로틴 보충제는 오히려 특정 암의 위험을 높였다."], ["6", "다시 말해 과학자들은 복잡한 현상의 원인을 완전히 잘못 이해하고 있었던 것이다."], ["7", "그들은 그 체계가 전체로서 어떻게 작동하는지를 온전히 이해하지 못한 채, 영양 작용에 관여하는 요소 하나를 찾아냈을 뿐이다."], ["8", "영양소를 따로 떼어 내는 유행하는 인식 체계를 좇던 영양학자들은, 좋은 건강으로 이어지는 복잡한 사슬 속의 수많은 연결 고리를 보지 못했다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "They identified one element engaged in the process of nutrition without fully comprehending how the system as a whole truly functions."}, {"en": false, "h": "주제 문항은 <b>글이 무엇을 문제 삼고 있는가</b>를 잡아야 한다. 1번이 <b>영양소를 찾아내도 그것이 실제로 어떻게 작용할지는 모른다</b>고 문을 열고, 2~5번이 <b>항산화 물질을 뽑아 보충제로 만들었더니 오히려 암 위험이 올라갔다</b>는 구체적 사례로 그것을 증명한다. 그리고 7번이 그 이유를 한 문장으로 정리한다. <b>요소 하나는 찾아냈지만(identified one element) 체계 전체가 어떻게 작동하는지는 이해하지 못했다(without fully comprehending how the system as a whole functions)</b>는 것이다. <b>one element</b>와 <b>the system as a whole</b>의 대비가 이 글의 뼈대이고, 그 대비를 그대로 옮긴 것이 ③의 <b>how nutrients work in the whole system</b>이다. 8번의 <b>failed to see a multitude of links</b>도 같은 말을 반복한다."}], "opts": [{"n": "①", "t": "식물로 영양 보충제를 만드는 것의 문제점", "a": false, "x": true, "trap": false, "e": "보충제가 소재로 나오기는 하지만, 글이 지적하는 것은 <b>만드는 방법</b>의 문제가 아니라 <b>이해의 부족</b>이다. 문제는 공정이 아니라 과학자들의 인식이다."}, {"n": "②", "t": "영양소를 분리하는 대안적 과학 방법의 필요성", "a": false, "x": true, "trap": false, "e": "글은 <b>더 나은 분리 방법을 찾자</b>고 하지 않는다. 8번은 <b>isolating nutrients</b>라는 패러다임 자체를 <b>실패의 원인</b>으로 지목한다. 방향이 정반대다."}, {"n": "③", "t": "영양소가 전체 체계 안에서 어떻게 작용하는지에 대한 불충분한 이해", "a": true, "x": false, "trap": false, "e": "7번의 <b>without fully comprehending how the system as a whole truly functions</b>가 <b>insufficient understanding</b>과 <b>the whole system</b>에 정확히 대응한다."}, {"n": "④", "t": "과일과 채소에서 분자를 추출하는 것의 잠재적 이점", "a": false, "x": true, "trap": false, "e": "<b>potential benefits</b>(잠재적 이점)라는 평가가 정반대다. 4·5번은 추출한 결과가 <b>효과가 없었고 오히려 위험을 높였다</b>고 말한다."}, {"n": "⑤", "t": "암 예방에 도움이 될 유익한 영양소를 찾는 일의 어려움", "a": false, "x": true, "trap": true, "e": "1번의 <b>Even when scientists are able to identify seemingly beneficial nutrients</b>를 놓치면 고르기 쉽다. 글은 <b>찾는 것은 할 수 있다, 문제는 그다음</b>이라고 분명히 밝히고 시작한다."}], "w": [["seemingly", "겉보기에"], ["beneficial", "유익한"], ["nutrient", "영양소"], ["operate", "작용하다"], ["in the course of", "~하는 과정에서"], ["antioxidant", "산화 방지제, 항산화 물질"], ["make the difference", "차이를 만들어 내다"], ["compound", "화합물"], ["molecule", "분자"], ["extract", "추출하다"], ["supplement", "보충제"], ["thoroughly", "완전히, 철저히"], ["misunderstand", "잘못 이해하다"], ["element", "요소"], ["engaged in", "~에 관여하는"], ["comprehend", "이해하다"], ["as a whole", "전체로서"], ["pursue", "추구하다"], ["paradigm", "패러다임, 인식 체계"], ["isolate", "분리하다"], ["a multitude of", "수많은"], ["lead to", "~로 이어지다"]]}, {"q": "04", "type": "어법", "src": "2020학년도 수능 29번", "ans": "④", "tr": [["1", "선사 시대 예술의 의미와 목적에 관한 고찰은 현대의 수렵 채집 사회와의 유사점에 크게 의존한다."], ["2", "Steven Mithen이 '현대인의 마음의 선사 시대'에서 강조하듯, 그러한 원시 사회는 인간과 짐승, 동물과 식물, 유기물과 무기물의 영역을 하나로 통합된, 생명이 깃든 총체의 참여자로 보는 경향이 있다."], ["3", "이 경향이 드러나는 두 갈래가 의인화(동물을 인간처럼 여기는 관행)와 토테미즘(인간을 동물처럼 여기는 관행)이며, 이 둘은 모두 abiting</b>으로 고쳐야 한다."}, {"n": "⑤", "t": "itself", "a": false, "x": true, "trap": true, "e": "<b>broods upon</b>의 주체와 대상이 모두 <b>an unlettered humanity</b>로 같다. <b>주어와 목적어가 같으면 재귀대명사</b>를 쓴다는 원칙에 정확히 들어맞는다. <b>it</b>으로 쓰면 다른 대상을 가리키게 된다."}], "w": [["speculation", "고찰, 추측"], ["prehistoric", "선사 시대의"], ["rely on", "~에 의존하다"], ["analogy", "유사점, 유추"], ["hunter-gatherer", "수렵 채집인"], ["primitive", "원시의"], ["tend to V", "~하는 경향이 있다"], ["view A as B", "A를 B로 여기다"], ["beast", "짐승"], ["inorganic", "무기물의"], ["sphere", "영역"], ["integrated", "통합된"], ["animated", "생명이 깃든"], ["totality", "총체, 전체"], ["dual", "이중의, 두 갈래의"], ["anthropomorphism", "의인화"], ["totemism", "토테미즘"], ["mythology", "신화"], ["conceptualize", "개념화하다"], ["in terms of", "~의 관점에서"], ["preoccupation", "몰두, 집착"], ["inhabit", "~에 서식하다, 살다"], ["profoundly", "깊이, 심오하게"], ["unlettered", "글을 모르는"], ["brood upon", "~을 곰곰이 생각하다"]]}, {"q": "05", "type": "밑줄 의미", "src": "2022년 10월 21번", "ans": "⑤", "tr": [["1", "소비주의는 자본주의의 동의어이기는커녕 장기적으로는 자본주의를 불가능하게 만드는데, 자본 형성을 사실상 불가능하게 하기 때문이다."], ["2", "소비 문화는 저축하는 문화가 아니며, 절약하는 문화도 아니다."], ["3", "소비 문화는 다음 장난감을 사는 데 너무 사로잡혀 있어서 욕구 충족을 미루지도, 미래를 위해 저축하고 투자하지도 못한다."], ["4", "요점은 아주 간단하다. 자본 없이는 지속 가능한 자본주의를 가질 수 없고, 저축 없이는 자본을 가질 수 없으며, 방금 번 것을 전부 쓰고 다니면 저축할 수 없다."], ["5", "그러나 그 혼란이 너무 깊어져서 오늘날 많은 사람들은 그것을 들을 귀를 가지고 있지 않다."], ["6", "실제로 우리나라 중앙은행의 정책은 금리를 거의 0까지 끌어내림으로써, 그리고 그렇게 해서 소비를 참은 대가로 사람들이 받아야 할 물질적 보상 - 저축에 붙는 이자 - 을 없앰으로써 이런 습관을 오히려 강화하는 것처럼 보인다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "The point is elementary: you can't have sustainable capitalism without capital; you can't have capital without savings; and you can't save if you're running around spending everything you've just earned."}, {"en": false, "h": "밑줄 의미 문항은 <b>밑줄 바로 앞 문장</b>이 열쇠인 경우가 대부분이다. 밑줄이 있는 5번의 <b>it</b>이 무엇을 가리키는지가 전부인데, 그것은 앞 문장인 4번의 내용이다. 4번은 <b>자본 없이는 자본주의가 없고, 저축 없이는 자본이 없으며, 다 써 버리면 저축도 없다</b>는 세 단계의 사슬이다. 한마디로 <b>쓰기만 해서는 자본주의가 지탱되지 않는다</b>는 말이다. 따라서 <b>그것을 들을 귀가 없다</b>는 <b>이 사실을 알아듣지 못한다</b>는 뜻이 되고
