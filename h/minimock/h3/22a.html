<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});

id not reduce 꾸밈. were extracted = 수동태. from fruits and vegetables = 부사구: extracted 꾸밈", "and: when절 안의 수동태 병렬. made into supplements = (were) made into ~ : when절의 두 번째 수동태", "주어 they, 동사 did not reduce, 목적어 cancer"], "steps": [{"t": "이 문장은 <b>when 시간절 + S+V+O(3형식)</b>이다. when절 안에 수동태가 둘 병렬이라 길어 보인다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: they (= these molecules, 이 분자들)", "V: did not reduce (줄이지 못했다. reduce 줄이다)", "O: cancer (암)", "뼈대 = <b>they did not reduce cancer</b> (Yet 그러나, 접속사)"]}, {"t": "맨 앞 <b>when ~ supplements</b>는 시간 부사절이다 ('~했을 때').", "sub": ["S: these molecules (이 분자들. molecule 분자)"]}, {"t": "수동태가 두 개 and로 병렬이다.", "sub": ["① were extracted from fruits and vegetables (과일과 채소에서 추출되었다. extract 추출하다)", "② (were) made into supplements (보충제로 만들어졌다. supplement 보충제). 같은 were를 생략"]}, {"t": "함정: 두 번째 made는 동사 과거형이 아니라, 생략된 were와 함께 쓰인 과거분사이다."}], "sum": "분자를 과일·채소에서 뽑아 보충제로 만들면 암을 줄이지 못함"}, {"i": "05", "q": "04", "s": "3", "title": "S+V+C + 계속적 both of which", "eng": "The dual<sup>1</sup> expressions of this tendency<sup>2</sup> / are anthropomorphism<sup>3</sup> (the practice of regarding<sup>4</sup> animals as humans) and totemism (the practice of regarding humans as animals), / both of which spread through the visual art and the mythology<sup>5</sup> of primitive cultures.", "notes": [["1", "dual", "이중의, 두 갈래의"], ["2", "tendency", "경향"], ["3", "anthropomorphism", "의인화"], ["4", "regard A as B", "A를 B로 간주하다"], ["5", "mythology", "신화"]], "lit": "이 경향의 두 가지 표현은 / 의인화(동물을 인간으로 여기는 관행)와 토테미즘(인간을 동물로 여기는 관행)인데, / 그 둘 다 원시 문화의 시각 예술과 신화 전반에 퍼져 나갔다.", "nat": "이 경향이 드러나는 두 갈래가 의인화(동물을 인간처럼 여기는 관행)와 토테미즘(인간을 동물처럼 여기는 관행)이며, 이 둘은 모두 원시 문화의 시각 예술과 신화 전반에 퍼져 있었다.", "ana": "괄호 두 개를 <b>먼저 지우고</b> 읽어야 뼈대가 보인다. 괄호 안은 각각 <b>anthropomorphism</b>과 <b>totemism</b>을 풀어 준 <b>동격</b>이라 지워도 문장이 성립한다. 지우면 <b>The dual expressions are A and B</b>라는 단순한 뼈대가 남는다. 진짜 볼 것은 <b>both of which</b>다. 앞에 이미 <b>are</b>라는 동사가 있는데 뒤에 <b>spread</b>라는 동사가 또 나온다. 동사가 두 개면 반드시 <b>접속사나 관계사</b>가 있어야 하는데, 그 역할을 하는 것이 <b>which</b>다. 만약 <b>both of them</b>이었다면 접속사가 없어 틀린 문장이 된다. <b>전치사(of) + 관계대명사</b> 형태이므로 뒤에는 <b>완전한 문장</b>이 오고, <b>which</b>는 앞의 <b>anthropomorphism and totemism</b>을 받는다. 참고로 <b>regard A as B</b>('A를 B로 여기다')는 앞 문장의 <b>view A as B</b>와 같은 계열의 표현이다.", "pe": "The \u0001dual<sup>1</sup>\u0002 expressions \u0001of this tendency<sup>2</sup>\u0002 / are anthropomorphism<sup>3</sup> (the practice of regarding<sup>4</sup> animals as humans) and totemism (the practice of regarding humans as animals), / \u0001both of which spread through the visual art and the mythology<sup>5</sup> of primitive cultures\u0002.", "pk": "\u0001이 경향의\u0002 \u0001두 가지\u0002 표현은 / 의인화(동물을 인간으로 여기는 관행)와 토테미즘(인간을 동물로 여기는 관행)인데, / \u0001그 둘 다 원시 문화의 시각 예술과 신화 전반에 퍼져 나갔다\u0002.", "core": "표현은 의인화와 토테미즘이다.", "tags": ["주어 expressions. dual = 형용사: expressions 꾸밈. of this tendency = 전치사구(형용사구): expressions 꾸밈", "동사 are, 보어 anthropomorphism and totemism (SVC). 괄호 속 the practice of ~ = 각 용어의 뜻풀이", "both of which ~ = <b>계속적 용법</b> 관계절(형용사절): anthropomorphism과 totemism을 받음. spread through = ~ 전역에 퍼지다"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) + 계속적 관계절</b>이다. 괄호 설명과 both of which가 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The dual expressions (두 가지 표현. dual 두 가지의, expression 표현). of this tendency는 '이 경향의'", "V: are (be ~이다)", "C: anthropomorphism and totemism (의인화와 토테미즘)", "뼈대 = <b>The dual expressions are anthropomorphism and totemism</b>"]}, {"t": "괄호 안은 각 용어의 뜻풀이이다. 둘 다 <b>regard A as B</b> (A를 B로 여기다) 구조이다.", "sub": ["anthropomorphism (the practice of regarding animals as humans) = 동물을 인간으로 여기는 관행 (의인화)", "totemism (the practice of regarding humans as animals) = 인간을 동물로 여기는 관행 (토테미즘)", "practice 관행, tendency 경향"]}, {"t": "<b>both of which spread ~</b>는 계속적 용법의 관계절이다. which는 anthropomorphism and totemism 둘을 가리킨다 ('그 둘 다').", "sub": ["S: both of which / V: spread (퍼지다. 현재형과 과거형의 모양이 같다)", "through the visual art and the mythology of primitive cultures = 원시 문화의 시각 예술과 신화 전반에 (primitive 원시의, mythology 신화)"]}], "sum": "이 경향의 두 표현은 의인화와 토테미즘, 둘 다 원시 예술·신화에 퍼짐"}, {"i": "06", "q": "05", "s": "3", "title": "S+V+C + too ~ to 구문 (to부정사 병렬)", "eng": "It's too fixated on<sup>1</sup> buying the next toy / to ever delay<sup>2</sup> gratification<sup>3</sup>, / to ever save and invest<sup>4</sup> for the future.", "notes": [["1", "be fixated on", "~에 집착하다"], ["2", "delay", "미루다, 지연시키다"], ["3", "gratification", "욕구 충족"], ["4", "invest", "투자하다"]], "lit": "그것은 다음 장난감을 사는 데 너무 집착해서 / 결코 욕구 충족을 미루지 못하고, / 결코 미래를 위해 저축하고 투자하지 못한다.", "nat": "소비 문화는 다음 장난감을 사는 데 너무 사로잡혀 있어서 욕구 충족을 미루지도, 미래를 위해 저축하고 투자하지도 못한다.", "ana": "<b>too ~ to V</b>는 '<b>너무 ~해서 …할 수 없다</b>'는 뜻이다. 형태에 <b>not</b>이 없는데도 <b>부정의 뜻</b>이 담긴다는 점이 핵심이라, 여기에 다시 <b>not</b>을 붙이면 틀린다. 이 문장이 어려운 이유는 <b>to</b>가 두 번 나오기 때문이다. <b>to ever delay</b>와 <b>to ever save and invest</b>는 <b>둘 다 too에 걸리는 병렬</b>이며, 콤마가 <b>and</b>를 대신하고 있다. 즉 '너무 집착해서 <b>미루지도 못하고 저축하지도 못한다</b>'로 두 개를 모두 부정으로 읽어야 한다. 사이에 낀 <b>ever</b>는 부정의 뜻을 강조해 '<b>결코</b>'로 새기면 된다. 앞의 <b>be fixated on</b> 뒤에는 전치사 <b>on</b>이 있으므로 <b>동명사 buying</b>이 왔다는 점도 확인해 두자.", "pe": "It's \u0001too\u0002 fixated \u0001on<sup>1</sup> buying the next toy\u0002 / \u0001to ever delay<sup>2</sup> gratification<sup>3</sup>\u0002, / \u0001to ever save and invest<sup>4</sup> for the future\u0002.", "pk": "그것은 \u0001다음 장난감을 사는 데\u0002 \u0001너무\u0002 집착해서 / \u0001결코 욕구 충족을 미루지 못하고\u0002, / \u0001결코 미래를 위해 저축하고 투자하지 못한다\u0002.", "core": "그것은 집착한다.", "tags": ["주어 It + 동사 is + 보어 fixated: 2형식. (too) = 부사: fixated를 꾸밈. (on buying …) = 전치사구(부사구): fixated를 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "to delay ~ = to부정사(부사적: <b>too ~ to</b>의 결과): fixated 꾸밈 (너무 ~해서 못함). ever = 강조 부사", "to save and invest ~ = to부정사 ② 병렬(동사 2개). for the future = 부사구: save and invest 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 보어 뒤에 too ~ to 구문과 병렬 to부정사가 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (그것)", "V: 's (is의 줄임. be ~이다)", "C: fixated (사로잡힌, 집착하는. 분사형 형용사)", "뼈대 = <b>It's fixated</b>", "판정 기준: be + 분사형 형용사는 2형식"]}, {"t": "<b>too fixated on buying the next toy</b>에서 too는 '너무'이다. fixated on ~ = ~에 사로잡힌, on 뒤의 buying은 동명사이다 ('다음 장난감을 사는 데')."}, {"t": "<b>to ever delay gratification</b>은 too ~ to 구문의 to부정사이다 ('너무 ~해서 …하지 못한다').", "sub": ["delay 미루다, gratification 욕구 충족, ever 결코(강조)"]}, {"t": "<b>to ever save and invest for the future</b>도 같은 too ~ to에 걸리는 병렬 to부정사이다 ('미래를 위해 저축하고 투자하지 못한다').", "sub": ["동사 save (저축하다)와 invest (투자하다)가 병렬", "함정: 부정어 not이 없어도 too ~ to는 '~하지 못한다'는 부정의 뜻이다."]}], "sum": "다음 장난감 사기에 너무 집착해 만족 미루기와 저축·투자는 못 함"}, {"i": "07", "q": "05", "s": "6", "title": "S+V+C (seem to) + by -ing 병렬 + 대시 삽입", "eng": "Indeed, the policies<sup>1</sup> of our nation's central bank seem to reinforce<sup>2</sup> this habit / by driving down interest rates<sup>3</sup> to near zero / and thereby denying<sup>4</sup> people a material reward / - in the form of interest on their banked savings - / for foregoing<sup>5</sup> consumption.", "notes": [["1", "policy", "정책"], ["2", "reinforce", "강화하다"], ["3", "interest rate", "금리"], ["4", "deny A B", "A에게 B를 주지 않다"], ["5", "forego", "단념하다, 포기하다"]], "lit": "실제로 우리나라 중앙은행의 정책은 이 습관을 강화하는 것처럼 보인다 / 금리를 거의 0에 가깝게 끌어내림으로써 / 그리고 그렇게 함으로써 사람들에게서 물질적 보상을 빼앗음으로써 / - 은행에 넣어 둔 저축에 붙는 이자라는 형태의 - / 소비를 단념한 데 대한.", "nat": "실제로 우리나라 중앙은행의 정책은 금리를 거의 0까지 끌어내림으로써, 그리고 그렇게 해서 소비를 참은 대가로 사람들이 받아야 할 물질적 보상 - 저축에 붙는 이자 - 을 없앰으로써 이런 습관을 오히려 강화하는 것처럼 보인다.", "ana": "주어는 <b>the policies</b>이고 <b>of our nation's central bank</b>는 그것을 꾸미는 전치사구라, 동사가 <b>seem</b>으로 복수에 맞춰졌다. <b>seem to V</b>는 '<b>~인 것처럼 보인다</b>'로, <b>It seems that ~</b>으로 바꿔 쓸 수 있다. 문장이 길어 보이는 진짜 이유는 <b>by</b> 하나에 <b>동명사 두 개</b>가 걸려 있기 때문이다. <b>by driving down ~ and (by) thereby denying ~</b>의 구조이며, 반복되는 <b>by</b>가 생략되었다. <b>and</b> 뒤가 <b>denying</b>인지 <b>denied</b>인지로 병렬 여부를 판단하는 것이 어법 문제의 단골이다. <b>deny</b>는 <b>deny + 사람 + 사물</b>로 '<b>~에게 …을 주지 않다</b>'라는 4형식으로 쓰였고, 두 줄표 사이의 <b>in the form of ~</b>는 <b>reward</b>를 설명하는 <b>삽입</b>이므로 지우고 읽어야 <b>a material reward for foregoing consumption</b>('소비를 단념한 데 대한 물질적 보상')이 붙는다.", "pe": "\u0001Indeed\u0002, the policies<sup>1</sup> \u0001of our nation's central bank\u0002 seem to reinforce<sup>2</sup> this habit / \u0001by driving down interest rates<sup>3</sup> \u0001to near zero\u0002\u0002 / \u0001and thereby denying<sup>4</sup> people a material reward\u0002 / - \u0001in the form of interest on their banked savings\u0002 - / \u0001for foregoing<sup>5</sup> consumption\u0002.", "pk": "\u0001실제로\u0002 \u0001우리나라 중앙은행의\u0002 정책은 이 습관을 강화하는 것처럼 보인다 / \u0001금리를 \u0001거의 0에 가깝게\u0002 끌어내림으로써\u0002 / \u0001그리고 그렇게 함으로써 사람들에게서 물질적 보상을 빼앗음으로써\u0002 / - \u0001은행에 넣어 둔 저축에 붙는 이자라는 형태의\u0002 - / \u0001소비를 단념한 데 대한\u0002.", "core": "정책은 이 습관을 강화하는 것처럼 보인다.", "tags": ["Indeed = 부사: 문장 꾸밈. 주어 policies(of ~ bank = 형용사구: policies 꾸밈), 동사 seem to reinforce, 목적어 this habit", "by driving down ~ = 전치사구(부사구): reinforce 꾸밈 (수단). to near zero = 부사구: driving down 꾸밈", "and: by의 동명사 병렬. thereby denying ~ = by의 목적어 ②(부사구 일부): reinforce 꾸밈. deny + 사람 + 물건", "대시 삽입: in the form of ~ = 전치사구(형용사구): reward 부연", "for foregoing consumption = 전치사구(형용사구): reward 꾸밈 (~한 데 대한). foregoing은 전치사 for의 목적어(동명사)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 문장 뒤쪽에 by -ing가 둘 병렬되고 대시 삽입이 있어 아주 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the policies (정책들). of our nation's central bank는 '우리나라 중앙은행의'", "V: seem (seem ~처럼 보이다)", "C: to reinforce this habit (이 습관을 강화하는 것. reinforce 강화하다, habit 습관). 판정 기준: seem 뒤의 to부정사는 보어로 보아 2형식", "뼈대 = <b>the policies seem to reinforce this habit</b>"]}, {"t": "<b>by driving down interest rates to near zero</b>는 수단을 나타내는 'by + 동명사'이다 ('금리를 거의 0까지 끌어내림으로써').", "sub": ["drive down 끌어내리다, interest rate 금리, near zero 거의 0"]}, {"t": "<b>and thereby denying people a material reward</b>는 by의 동명사 두 번째 병렬이다 ('그렇게 함으로써 사람들에게서 물질적 보상을 빼앗음으로써').", "sub": ["deny A B = A에게 B를 주지 않다 (people에게 reward를)", "thereby 그렇게 함으로써, material 물질적인, reward 보상"]}, {"t": "대시 사이 <b>in the form of interest on their banked savings</b>는 reward를 풀어 주는 삽입이다 ('은행에 넣어 둔 저축에 붙는 이자라는 형태의'). <b>for foregoing consumption</b>은 reward를 꾸민다 ('소비를 단념한 데 대한').", "sub": ["forgo(forego로도 씀) 단념하다 → foregoing은 for 뒤의 동명사 (형용사 foregoing '앞서 말한'이 아님)", "banked savings 은행에 예치된 저축, consumption 소비"]}, {"t": "맨 앞 <b>Indeed</b>(실제로)는 문장 전체를 꾸미는 부사이다."}], "sum": "중앙은행 정책, 금리를 낮춰 저축 이자를 없애며 이 습관을 오히려 강화"}, {"i": "08", "q": "06", "s": "1", "title": "S+V (수동태) + 복합관계사 양보절 2개", "eng": "Politics cannot be suppressed<sup>1</sup>, / whichever policy process<sup>2</sup> is employed<sup>3</sup> / and however sensitive<sup>4</sup> and respectful of<sup>5</sup> differences it might be.", "notes": [["1", "suppress", "억압하다, 억누르다"], ["2", "policy process", "정책 과정"], ["3", "employ", "사용하다, 채택하다"], ["4", "sensitive", "세심한, 민감한"], ["5", "respectful of", "~을 존중하는"]], "lit": "정치는 억압될 수 없다, / 어떤 정책 과정이 사용되든 / 그리고 그것이 아무리 세심하고 차이를 존중한다 하더라도.", "nat": "어떤 정책 과정을 쓰든, 또 그 과정이 아무리 세심하고 차이를 존중하는 것이든 정치는 억눌릴 수 없다.", "ana": "콤마 뒤가 통째로 <b>양보의 부사절 두 개</b>다. <b>whichever</b>는 뒤에 명사 <b>policy process</b>를 데리고 다니는 <b>복합관계형용사</b>로, '<b>어떤 ~이든</b>'으로 새긴다. <b>no matter which policy process</b>로 바꿔 쓸 수 있다. 두 번째 <b>however</b>는 '<b>그러나</b>'가 아니다. 뒤에 바로 <b>형용사(sensitive)</b>가 붙어 있으면 '<b>아무리 ~하더라도</b>'라는 뜻의 <b>복합관계부사</b>이고, <b>no matter how sensitive</b>와 같다. <b>however + 형용사 + 주어 + 동사</b>라는 <b>어순</b>까지 함께 외워 두면 뒤의 <b>it might be</b>가 왜 뒤로 밀렸는지 바로 보인다. <b>respectful</b> 역시 <b>however</b>에 함께 걸리는 형용사라 <b>sensitive and respectful</b>이 병렬이고, <b>it</b>은 앞의 <b>policy process</b>를 받는다.", "pe": "Politics cannot be suppressed<sup>1</sup>, / \u0001whichever policy process<sup>2</sup> is employed<sup>3</sup>\u0002 / \u0001and however sensitive<sup>4</sup> and respectful of<sup>5</sup> differences it might be\u0002.", "pk": "정치는 억압될 수 없다, / \u0001어떤 정책 과정이 사용되든\u0002 / \u0001그리고 그것이 아무리 세심하고 차이를 존중한다 하더라도\u0002.", "core": "정치는 억압될 수 없다.", "tags": ["주어 Politics, 동사 cannot be suppressed(조동사 수동태)", "<b>whichever</b> + 명사 = 복합관계형용사절(양보): suppressed 꾸밈 (어떤 ~이든). no matter which와 같음", "and: 양보절 병렬. <b>however + 형용사 + 주어 + 동사</b> = 복합관계부사절(양보): suppressed 꾸밈. sensitive and respectful 병렬, it = policy process"], "steps": [{"t": "이 문장은 <b>수동태 S+V(1형식) + 양보 부사절 2개</b>이다. 뒤의 whichever절과 however절이 모두 양보절이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Politics (정치)", "V: cannot be suppressed (억압될 수 없다. suppress 억압하다의 조동사 수동태)", "뼈대 = <b>Politics cannot be suppressed</b>", "판정 기준: 수동태 주절은 1형식"]}, {"t": "<b>whichever policy process is employed</b>는 복합관계형용사 양보절이다 ('어떤 정책 과정이 사용되든').", "sub": ["whichever + 명사 = 어떤 ~이든", "S: whichever policy process / V: is employed (사용된다. employ 사용하다, process 과정)"]}, {"t": "<b>however sensitive and respectful of differences it might be</b>는 복합관계부사 양보절이다 ('아무리 세심하고 차이를 존중하더라도').", "sub": ["However + 형용사 + S + V = 아무리 ~하더라도", "S: it (= policy process, 정책 과정) / V: might be / C: sensitive and respectful of differences", "sensitive 세심한, respectful of ~ ~을 존중하는, difference 차이"]}, {"t": "함정: whichever는 뒤에 명사(policy process)가 바로 오고, however는 뒤에 형용사(sensitive)가 온다."}], "sum": "어떤 정책 과정이든, 아무리 세심해도 정치는 억누를 수 없음"}], "qs": [{"q": "01", "type": "필자의 주장", "src": "2016학년도 9월 20번", "ans": "②", "tr": [["1", "목표를 분명하게 정의해 두는 것만으로는 충분하지 않다. 순간순간 무엇을 정확히 해야 하는지도 알아야 하기 때문이다."], ["2", "예를 들어 어떤 판매원의 목표는 수익이 나도록 판매를 성사시키는 것이다."], ["3", "그러나 판매 하나하나는 서로 다른 접근을 요구한다. 밀어붙여야 하는가 느긋해야 하는가, 권위 있게 굴어야 하는가 친근하게 굴어야 하는가?"], ["4", "그리고 제품의 어떤 측면을 강조해야 하는가?"], ["5", "이 질문들에 대한 답은 미리 예측할 수 없는 변수에 달려 있다."], ["6", "이는 판매에만 해당하는 것이 아니라 대부분의 인간 활동에도 그대로 적용된다."], ["7", "사람은 상황에 맞는 특정한 전략을 선택하고, 그렇게 선택한 행동 방침을 따라야 한다."], ["8", "그렇게 해야 목표를 이루는 데에서 더 오래가는 성공을 보장할 수 있다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "One must select a particular strategy appropriate to the occasion and follow the chosen course of action."}, {"en": false, "h": "주장 문항은 <b>must · should · have to</b> 같은 <b>당위의 조동사</b>가 붙은 문장을 찾으면 거의 끝난다. 이 글에서 그 표현이 나오는 곳은 1번과 7번 두 군데인데, 1번은 <b>~만으로는 충분하지 않다</b>는 문제 제기이고 7번이 <b>그래서 어떻게 하라</b>는 해답이다. 7번의 핵심어는 <b>a particular strategy</b>(특정한 전략)와 <b>appropriate to the occasion</b>(상황에 맞는) 둘이다. 이 둘이 그대로 ②의 <b>상황에 맞는 전략</b>과 겹친다. 이어지는 8번이 <b>Doing so will ensure more lasting success in reaching one's goals</b>로 <b>목표 달성</b>이라는 목적까지 못 박아 주므로, ②의 앞부분 <b>목표 달성을 위해</b>까지 완성된다. 2~5번의 판매원 이야기는 <b>For instance</b>로 시작하는 <b>예시</b>일 뿐이라 여기서 답을 찾으면 안 된다."}], "opts": [{"n": "①", "t": "비판적 분석에 기반을 두고 목표 설정을 해야 한다.", "a": false, "x": true, "trap": false, "e": "글은 <b>목표를 어떻게 세울 것인가</b>가 아니라 <b>목표를 세운 다음 무엇을 해야 하는가</b>를 말한다. 1번이 이미 <b>목표를 분명히 정의하는 것만으로는 부족하다</b>고 선을 그었다."}, {"n": "②", "t": "목표 달성을 위해 상황에 맞는 전략을 사용해야 한다.", "a": true, "x": false, "trap": false, "e": "7번의 <b>select a particular strategy appropriate to the occasion</b>과 8번의 <b>in reaching one's goals</b>가 그대로 대응한다."}, {"n": "③", "t": "경제 활성화 전략 수립을 위해 시장 조사를 해야 한다.", "a": false, "x": true, "trap": false, "e": "<b>전략(strategy)</b>이라는 단어만 같을 뿐이다. <b>경제 활성화</b>나 <b>시장 조사</b>에 해당하는 내용은 한 줄도 없다. 판매원은 예시로 등장했을 뿐이다."}, {"n": "④", "t": "성공적인 업무 수행을 위해 작업 환경을 개선해야 한다.", "a": false, "x": true, "trap": false, "e": "<b>success</b>라는 단어는 8번에 나오지만, <b>작업 환경(working environment)</b>은 지문 어디에도 없다. 글이 말하는 것은 환경이 아니라 <b>행동 방침의 선택</b>이다."}, {"n": "⑤", "t": "고객의 신뢰를 얻기 위해 일관된 전략을 사용해야 한다.", "a": false, "x": true, "trap": true, "e": "판매원이 나오니 <b>고객</b>이 자연스러워 보이고 <b>전략</b>이라는 말도 겹쳐서 고르기 쉽다. 그러나 글의 핵심은 <b>일관된(consistent)</b> 전략이 아니라 <b>상황마다 달라지는</b> 전략이다. 3번이 <b>each sale requires a different approach</b>라고 정반대로 못 박았다."}], "w": [["merely", "단지, 그저"], ["clearly defined", "분명하게 정의된"], ["sufficient", "충분한"], ["moment by moment", "순간순간"], ["precisely", "정확히"], ["salesperson", "판매원"], ["conclude a sale", "판매를 성사시키다"], ["profitably", "수익이 나도록"], ["approach", "접근법"], ["pushy", "밀어붙이는, 강압적인"], ["laid back", "느긋한"], ["authoritative", "권위적인"], ["aspect", "측면, 부면"], ["depend on", "~에 달려 있다"], ["variable", "변수"], ["in advance", "미리, 사전에"], ["hold true", "적용되다, 유효하다"], ["appropriate to", "~에 맞는"], ["occasion", "상황, 경우"], ["course of action", "행동 방침"], ["ensure", "보장하다"], ["lasting", "지속적인"]]}, {"q": "02", "type": "심경", "src": "2022년 7월 19번", "ans": "④", "tr": [["1", "어느 날 밤 친구 한 명과 나는 그 빅풋을 찾으러 가기로 했다."], ["2", "우리는 내 낡은 트럭을 타고 있었고, 가장 높은 언덕 쪽으로 방향을 잡아 들판을 가로질러 출발했다."], ["3", "들판은 울퉁불퉁했고, 따라갈 만한 길이라고는 아주 희미한 자취뿐이었다."], ["4", "가는 길에는 들판에 파인 작은 구덩이들이 있었다."], ["5", "나는 왜 그런지 끝내 알아내지 못했다."], ["6", "언덕 꼭대기에 점점 더 가까워질수록 나는 실제로 겁이 나기 시작했는데, 그건 좀 드문 일이었다. 그 나이의 나는 꽤 겁이 없는 편이었기 때문이다."], ["7", "우리가 언덕 꼭대기에 다다랐을 때, 쿵 하는 큰 소리가 났다!"], ["8", "내 트럭은 무언가 무거운 것이 짐칸에 막 뛰어든 것처럼 아래로 푹 내려앉았다."], ["9", "우리는 너무 겁이 나서 뒤쪽을 들여다볼 수 없었다."], ["10", "나는 공포에 사로잡혀 트럭을 후진 기어에 넣고 언덕 아래로 물러나기로 했다."], ["11", "내가 그렇게 하자 또 한 번 쿵 소리가 났고, 그때까지 한 번도 들어 본 적 없는 커다란 포효가 터져 나왔다."]], "evh": "9번 문장", "ev": [{"en": true, "h": "We were too terrified to look in the back."}, {"en": false, "h": "심경 문항은 <b>감정을 직접 드러내는 형용사</b>를 순서대로 따라가면 된다. 이 글은 <b>scared</b>(6번) → <b>terrified</b>(9번) → <b>panicked</b>(10번)로 <b>겁</b>이 한 방향으로만 짙어진다. 그중에서도 9번의 <b>too terrified to look in the back</b>은 <b>무서워서 뒤를 못 볼 정도</b>라는, 감정의 세기를 가장 분명하게 보여 주는 문장이다. 6번의 <b>which was kind of rare, because at that age I was pretty fearless</b>도 결정적이다. <b>평소에는 겁이 없던 사람</b>이 겁을 먹었다고 굳이 밝혔다는 것은, 이 상황이 그만큼 놀랍고 무서웠다는 뜻이기 때문이다. 마지막 11번의 <b>a loud roar ~ like I'd never, ever heard before</b>까지 겹치면 <b>놀라움 + 두려움</b>이라는 ④가 답이 된다."}], "opts": [{"n": "①", "t": "relieved and relaxed (안도하고 편안한)", "a": false, "x": true, "trap": false, "e": "안도할 만한 일이 한 번도 일어나지 않는다. 소리는 오히려 뒤로 갈수록 커지고, 마지막 문장의 <b>a loud roar</b>로 끝난다."}, {"n": "②", "t": "pleased and delighted (기쁘고 즐거운)", "a": false, "x": true, "trap": true, "e": "출발할 때의 <b>모험을 떠나는 들뜬 기분</b>만 보면 고를 수 있지만, 심경 문항은 <b>글 전체의 흐름</b>을 본다. 6번부터 감정이 완전히 뒤집힌다."}, {"n": "③", "t": "bored and indifferent (지루하고 무관심한)", "a": false, "x": true, "trap": false, "e": "<b>I never figured out why</b>(5번)를 무관심으로 오해하기 쉽지만, 이는 <b>이유를 알 수 없었다</b>는 말이지 관심이 없었다는 뜻이 아니다."}, {"n": "④", "t": "alarmed and frightened (놀라고 겁먹은)", "a": true, "x": false, "trap": false, "e": "<b>becoming scared</b>(6번) → <b>too terrified</b>(9번) → <b>panicked</b>(10번)로 이어지는 감정선이 그대로 <b>놀람과 두려움</b>이다."}, {"n": "⑤", "t": "dissatisfied and angry (불만족스럽고 화난)", "a": false, "x": true, "trap": false, "e": "화를 낼 대상이 등장하지 않는다. 감정이 향하는 곳은 <b>정체를 알 수 없는 존재</b>이고, 반응은 분노가 아니라 <b>도망</b>이다."}], "w": [["buddy", "친구"], ["set off", "출발하다"], ["head toward", "~를 향해 가다"], ["rough", "울퉁불퉁한, 거친"], ["slightest", "아주 희미한"], ["trail", "오솔길, 자취"], ["trench", "구덩이, 도랑"], ["figure out", "알아내다"], ["scared", "겁먹은"], ["rare", "드문"], ["fearless", "겁이 없는, 용감한"], ["thump", "쿵 하는 소리"], ["sink down", "내려앉다"], ["bed", "(트럭의) 짐칸"], ["terrified", "몹시 겁먹은"], ["panic", "공포에 사로잡히다"], ["throw into reverse", "후진 기어를 넣다"], ["back down", "후진해서 내려오다"], ["roar", "포효, 으르렁거리는 소리"]]}, {"q": "03", "type": "글의 주제", "src": "2014학년도 9월 B형 24번", "ans": "③", "tr": [["1", "과학자들이 겉보기에 유익해 보이는 영양소를 찾아낼 수 있을 때조차, 그들은 그 영양소가 실생활의 맥락에서, 즉 매일의 식사 과정에서 어떻게 작용할지를 늘 이해하지는 못한다."], ["2", "과일과 채소는 암을 예방하는 데 도움이 된다고 여겨진다."], ["3", "과학자들은 차이를 만들어 내는 것이 바로 이 식품들에 들어 있는 항산화 물질, 즉 베타카로틴, 리코펜, 비타민 E 같은 화합물이라고 믿어 왔다."], ["4", "그러나 이 분자들을 과일과 채소에서 추출해 보충제로 만들었을 때는 암을 줄여 주지 못했다."], ["5", "베타카로틴 보충제는 오히려 특정 암의 위험을 높였다."], ["6", "다시 말해 과학자들은 복잡한 현상의 원인을 완전히 잘못 이해하고 있었던 것이다."], ["7", "그들은 그 체계가 전체로서 어떻게 작동하는지를 온전히 이해하지 못한 채, 영양 작용에 관여하는 요소 하나를 찾아냈을 뿐이다."], ["8", "영양소를 따로 떼어 내는 유행하는 인식 체계를 좇던 영양학자들은, 좋은 건강으로 이어지는 복잡한 사슬 속의 수많은 연결 고리를 보지 못했다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "They identified one element engaged in the process of nutrition without fully comprehending how the system as a whole truly functions."}, {"en": false, "h": "주제 문항은 <b>글이 무엇을 문제 삼고 있는가</b>를 잡아야 한다. 1번이 <b>영양소를 찾아내도 그것이 실제로 어떻게 작용할지는 모른다</b>고 문을 열고, 2~5번이 <b>항산화 물질을 뽑아 보충제로 만들었더니 오히려 암 위험이 올라갔다</b>는 구체적 사례로 그것을 증명한다. 그리고 7번이 그 이유를 한 문장으로 정리한다. <b>요소 하나는 찾아냈지만(identified one element) 체계 전체가 어떻게 작동하는지는 이해하지 못했다(without fully comprehending how the system as a whole functions)</b>는 것이다. <b>one element</b>와 <b>the system as a whole</b>의 대비가 이 글의 뼈대이고, 그 대비를 그대로 옮긴 것이 ③의 <b>how nutrients work in the whole system</b>이다. 8번의 <b>failed to see a multitude of links</b>도 같은 말을 반복한다."}], "opts": [{"n": "①", "t": "식물로 영양 보충제를 만드는 것의 문제점", "a": false, "x": true, "trap": false, "e": "보충제가 소재로 나오기는 하지만, 글이 지적하는 것은 <b>만드는 방법</b>의 문제가 아니라 <b>이해의 부족</b>이다. 문제는 공정이 아니라 과학자들의 인식이다."}, {"n": "②", "t": "영양소를 분리하는 대안적 과학 방법의 필요성", "a": false, "x": true, "trap": false, "e": "글은 <b>더 나은 분리 방법을 찾자</b>고 하지 않는다. 8번은 <b>isolating nutrients</b>라는 패러다임 자체를 <b>실패의 원인</b>으로 지목한다. 방향이 정반대다."}, {"n": "③", "t": "영양소가 전체 체계 안에서 어떻게 작용하는지에 대한 불충분한 이해", "a": true, "x": false, "trap": false, "e": "7번의 <b>without fully comprehending how the system as a whole truly functions</b>가 <b>insufficient understanding</b>과 <b>the whole system</b>에 정확히 대응한다."}, {"n": "④", "t": "과일과 채소에서 분자를 추출하는 것의 잠재적 이점", "a": false, "x": true, "trap": false, "e": "<b>potential benefits</b>(잠재적 이점)라는 평가가 정반대다. 4·5번은 추출한 결과가 <b>효과가 없었고 오히려 위험을 높였다</b>고 말한다."}, {"n": "⑤", "t": "암 예방에 도움이 될 유익한 영양소를 찾는 일의 어려움", "a": false, "x": true, "trap": true, "e": "1번의 <b>Even when scientists are able to identify seemingly beneficial nutrients</b>를 놓치면 고르기 쉽다. 글은 <b>찾는 것은 할 수 있다, 문제는 그다음</b>이라고 분명히 밝히고 시작한다."}], "w": [["seemingly", "겉보기에"], ["beneficial", "유익한"], ["nutrient", "영양소"], ["operate", "작용하다"], ["in the course of", "~하는 과정에서"], ["antioxidant", "산화 방지제, 항산화 물질"], ["make the difference", "차이를 만들어 내다"], ["compound", "화합물"], ["molecule", "분자"], ["extract", "추출하다"], ["supplement", "보충제"], ["thoroughly", "완전히, 철저히"], ["misunderstand", "잘못 이해하다"], ["element", "요소"], ["engaged in", "~에 관여하는"], ["comprehend", "이해하다"], ["as a whole", "전체로서"], ["pursue", "추구하다"], ["paradigm", "패러다임, 인식 체계"], ["isolate", "분리하다"], ["a multitude of", "수많은"], ["lead to", "~로 이어지다"]]}, {"q": "04", "type": "어법", "src": "2020학년도 수능 29번", "ans": "④", "tr": [["1", "선사 시대 예술의 의미와 목적에 관한 고찰은 현대의 수렵 채집 사회와의 유사점에 크게 의존한다."], ["2", "Steven Mithen이 '현대인의 마음의 선사 시대'에서 강조하듯, 그러한 원시 사회는 인간과 짐승, 동물과 식물, 유기물과 무기물의 영역을 하나로 통합된, 생명이 깃든 총체의 참여자로 보는 경향이 있다."], ["3", "이 경향이 드러나는 두 갈래가 의인화(동물을 인간처럼 여기는 관행)와 토테미즘(인간을 동물처럼 여기는 관행)이며, 이 둘은 모두 abiting</b>으로 고쳐야 한다."}, {"n": "⑤", "t": "itself", "a": false, "x": true, "trap": true, "e": "<b>broods upon</b>의 주체와 대상이 모두 <b>an unlettered humanity</b>로 같다. <b>주어와 목적어가 같으면 재귀대명사</b>를 쓴다는 원칙에 정확히 들어맞는다. <b>it</b>으로 쓰면 다른 대상을 가리키게 된다."}], "w": [["speculation", "고찰, 추측"], ["prehistoric", "선사 시대의"], ["rely on", "~에 의존하다"], ["analogy", "유사점, 유추"], ["hunter-gatherer", "수렵 채집인"], ["primitive", "원시의"], ["tend to V", "~하는 경향이 있다"], ["view A as B", "A를 B로 여기다"], ["beast", "짐승"], ["inorganic", "무기물의"], ["sphere", "영역"], ["integrated", "통합된"], ["animated", "생명이 깃든"], ["totality", "총체, 전체"], ["dual", "이중의, 두 갈래의"], ["anthropomorphism", "의인화"], ["totemism", "토테미즘"], ["mythology", "신화"], ["conceptualize", "개념화하다"], ["in terms of", "~의 관점에서"], ["preoccupation", "몰두, 집착"], ["inhabit", "~에 서식하다, 살다"], ["profoundly", "깊이, 심오하게"], ["unlettered", "글을 모르는"], ["brood upon", "~을 곰곰이 생각하다"]]}, {"q": "05", "type": "밑줄 의미", "src": "2022년 10월 21번", "ans": "⑤", "tr": [["1", "소비주의는 자본주의의 동의어이기는커녕 장기적으로는 자본주의를 불가능하게 만드는데, 자본 형성을 사실상 불가능하게 하기 때문이다."], ["2", "소비 문화는 저축하는 문화가 아니며, 절약하는 문화도 아니다."], ["3", "소비 문화는 다음 장난감을 사는 데 너무 사로잡혀 있어서 욕구 충족을 미루지도, 미래를 위해 저축하고 투자하지도 못한다."], ["4", "요점은 아주 간단하다. 자본 없이는 지속 가능한 자본주의를 가질 수 없고, 저축 없이는 자본을 가질 수 없으며, 방금 번 것을 전부 쓰고 다니면 저축할 수 없다."], ["5", "그러나 그 혼란이 너무 깊어져서 오늘날 많은 사람들은 그것을 들을 귀를 가지고 있지 않다."], ["6", "실제로 우리나라 중앙은행의 정책은 금리를 거의 0까지 끌어내림으로써, 그리고 그렇게 해서 소비를 참은 대가로 사람들이 받아야 할 물질적 보상 - 저축에 붙는 이자 - 을 없앰으로써 이런 습관을 오히려 강화하는 것처럼 보인다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "The point is elementary: you can't have sustainable capitalism without capital; you can't have capital without savings; and you can't save if you're running around spending everything you've just earned."}, {"en": false, "h": "밑줄 의미 문항은 <b>밑줄 바로 앞 문장</b>이 열쇠인 경우가 대부분이다. 밑줄이 있는 5번의 <b>it</b>이 무엇을 가리키는지가 전부인데, 그것은 앞 문장인 4번의 내용이다. 4번은 <b>자본 없이는 자본주의가 없고, 저축 없이는 자본이 없으며, 다 써 버리면 저축도 없다</b>는 세 단계의 사슬이다. 한마디로 <b>쓰기만 해서는 자본주의가 지탱되지 않는다</b>는 말이다. 따라서 <b>그것을 들을 귀가 없다</b>는 <b>이 사실을 알아듣지 못한다</b>는 뜻이 되고 function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
const CMAP={"01-5": [["080", "주격 관계대명사"], ["078", "관계대명사"]], "02-4": [["068", "현재분사 · 과거분사"], ["017", "there is / are"]], "03-3": [["096", "It ~ that 강조"], ["039", "명사절 접속사 that"]], "03-4": [["074", "수동태"], ["037-H1", "병렬 구조"]], "04-3": [["083", "관계대명사 계속적 용법"], ["085-H1", "전치사 + 관계대명사"]], "05-3": [["062–063", "so ~ that · too ~ to"], ["037-H1", "병렬 구조"]], "05-6": [["037-H1", "병렬 구조"]], "06-1": [["084-H1", "복합관계사"], ["074", "수동태"]]};
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  const cc=(CMAP[c.q+'-'+c.s]||[]);
  const back=encodeURIComponent(location.origin+location.pathname);
  let x='<div class="sc open"><div class="sc-h"><span class="no2">'+(+c.i)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='<div class="fin n1"><b>자연스러운 해석</b>'+esc(c.nat)+'</div>';

  x+='</div></div>';
  return x;
}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
