}

var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주장은 <b>must</b>(~해야 한다)가 붙은 문장에 있어요. 1번은 “목표만으론 부족하다”는 문제 제기, <b>7번이 해답</b>이고 2~5번 판매원 이야기는 <b>예시</b>예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 문제 제기</span><div class=\"en\">Merely having goals clearly defined <mark>is not sufficient</mark>, for one must also know, moment by moment, what precisely needs to be done.</div><p class=\"ko\">단지 목표를 분명하게 정의하는 것만으로는 <mark>충분하지 않은데</mark>, 시시각각으로 무엇이 정확히 행해질 필요가 있는지를 알아야 하기 때문이다.</p></div><div class=\"ck-via\"><i>▼</i><span>For instance(예를 들어)로 판매원 예시가 시작되고, However(하지만)에서 요점이 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 예시 속 핵심</span><div class=\"en\">However, each sale requires <mark>a different approach</mark></div><p class=\"ko\">하지만, 각각의 판매는 <mark>서로 다른 접근법을</mark> 요구한다</p></div><div class=\"ck-via\"><i>▼</i><span>어떻게 할지는 그때그때 달라서 미리 정해 둘 수 없어요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 왜 매번 다를까</span><div class=\"en\">The answers to these questions depend on variables that <mark>cannot be predicted in advance</mark>.</div><p class=\"ko\">이러한 질문들에 대한 답변은 <mark>미리 예측될 수 없는</mark> 변수에 달려 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>must(~해야 한다)로 필자가 해답을 못 박아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">One <mark>must select a particular strategy</mark> <mark>appropriate to the occasion</mark> and follow the chosen course of action.</div><p class=\"ko\">사람은 <mark>상황에 맞는</mark> <mark>특정한 전략을 선택해야</mark> 하며 선택된 행동 방침을 따라야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>Doing so(그렇게 하는 것)가 7번을 받아 ‘목표 달성’이라는 목적을 붙여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 목적 확인</span><div class=\"en\">Doing so will ensure more lasting success in reaching one’s goals.</div><p class=\"ko\">그렇게 하는 것은 목표를 달성하는 데 있어서 더 지속적인 성공을 보장할 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">목표 달성을 위해 상황에 맞는 전략을 사용해야 한다.<small>7번 appropriate to the occasion(상황에 맞는) + 8번 reaching one’s goals(목표 달성)를 합친 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">고객의 신뢰를 얻기 위해 일관된 전략을 사용해야 한다.</span><span class=\"why\">[반대] ‘전략’이란 말에 끌리기 쉬워요. 하지만 3번은 판매마다 a different approach(서로 다른 접근법)가 필요하다고 했으니 ‘일관된’ 전략은 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">비판적 분석에 기반을 두고 목표 설정을 해야 한다.</span><span class=\"why\">[범위 빗나감] 1번은 목표를 정하는 것만으로는 not sufficient(충분하지 않다)고 했어요. 필자의 관심은 목표 설정이 아니라 그다음 ‘어떻게 할지’예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">경제 활성화 전략 수립을 위해 시장 조사를 해야 한다.</span><span class=\"why\">[지문에 없음] 경제 활성화·시장 조사 얘기는 없어요. 오히려 5번은 답이 cannot be predicted in advance(미리 예측될 수 없다)고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">성공적인 업무 수행을 위해 작업 환경을 개선해야 한다.</span><span class=\"why\">[지문에 없음] 작업 환경은 한 번도 안 나와요. 8번의 success(성공)는 환경이 아니라 상황에 맞는 전략에서 나와요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Merely having goals clearly defined</div><div class=\"k\">단지 목표를 분명하게 정의하는 것만으로는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is not sufficient,</span></div><div class=\"k\"><span class=\"cw\">충분하지 않은데,</span></div></div><div class=\"rc\"><div class=\"e\">for one must also know,</div><div class=\"k\">왜냐하면 사람은 또한 알아야 하기 때문이다,</div></div><div class=\"rc\"><div class=\"e\">moment by moment,</div><div class=\"k\">시시각각으로,</div></div><div class=\"rc\"><div class=\"e\">what precisely needs to be done.</div><div class=\"k\">무엇이 정확히 행해질 필요가 있는지를.</div></div><div class=\"rnat\">단지 목표를 분명하게 정의하는 것만으로는 충분하지 않은데, 왜냐하면 사람은 또한 시시각각으로, 무엇이 정확히 행해질 필요가 있는지를 알아야 하기 때문이다.</div><div class=\"rst\">학급 장터에서 쿠키를 다 팔겠다는 목표만 세우면 끝일까요? 아니에요. 지문 1번도 목표만으론 <b>충분하지 않다</b>(not sufficient)고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">For instance,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">a salesperson’s aim</div><div class=\"k\">한 판매원의 목표는</div></div><div class=\"rc\"><div class=\"e\">is to conclude a sale profitably.</div><div class=\"k\">수익이 나도록 판매를 끝내는 것이다.</div></div><div class=\"rnat\">예를 들어, 한 판매원의 목표는 수익이 나도록 판매를 끝내는 것이다.</div><div class=\"rst\">예를 들어 쿠키 파는 내 목표는 이익을 남기면서 다 파는 거예요. = 지문 2번, 판매원의 목표는 수익 나게 판매를 끝내는 것이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">However,</div><div class=\"k\">하지만,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">each sale requires a different approach:</span></div><div class=\"k\"><span class=\"cw\">각각의 판매는 서로 다른 접근법을 요구한다:</span></div></div><div class=\"rc\"><div class=\"e\">Should he be pushy or laid back,</div><div class=\"k\">그(= 판매원)는 밀어붙여야 하는가 아니면 느긋해야 하는가,</div></div><div class=\"rc\"><div class=\"e\">authoritative or friendly?</div><div class=\"k\">고압적이어야 하는가 아니면 친절해야 하는가?</div></div><div class=\"rnat\">하지만, 각각의 판매는 서로 다른 접근법을 요구한다. 그(판매원)는 밀어붙여야 하는가 아니면 느긋해야 하는가, 고압적이어야 하는가 아니면 친절해야 하는가?</div><div class=\"rst\"><b>하지만</b>(However) 손님마다 다르게 대해야 해요. 세게 권할지, 편하게 둘지. 지문 3번도 판매마다 <b>서로 다른 접근법</b>이 필요하대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">And what aspect of the product</div><div class=\"k\">그리고 제품의 어떤 측면을</div></div><div class=\"rc\"><div class=\"e\">should he emphasize?</div><div class=\"k\">그(= 판매원)는 강조해야 하는가?</div></div><div class=\"rnat\">그리고 그(판매원)는 제품의 어떤 측면을 강조해야 하는가?</div><div class=\"rst\">쿠키의 맛을 자랑할지, 싼 가격을 자랑할지도 골라야 해요. 지문 4번도 제품의 어떤 점을 강조할지 묻고 있어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The answers to these questions</div><div class=\"k\">이러한 질문들에 대한 답변은</div></div><div class=\"rc\"><div class=\"e\">depend on variables</div><div class=\"k\">변수에 달려 있다</div></div><div class=\"rc\"><div class=\"e\">that cannot be predicted in advance.</div><div class=\"k\">미리 예측될 수 없는.</div></div><div class=\"rnat\">이러한 질문들에 대한 답변은 미리 예측될 수 없는 변수에 달려 있다.</div><div class=\"rst\">그런데 어떤 손님이 올지는 미리 알 수 없어요. 그래서 지문 5번은 답이 <b>미리 예측될 수 없는</b> 변수에 달렸다고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">This holds true</div><div class=\"k\">이는(= 답을 미리 예측할 수 없다는 것) 들어맞는다</div></div><div class=\"rc\"><div class=\"e\">not only for sales</div><div class=\"k\">판매뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">but also for most human activities.</div><div class=\"k\">대부분의 인간 활동에도.</div></div><div class=\"rnat\">이는(예측이 어렵다는 것은) 판매뿐만 아니라 대부분의 인간 활동에도 들어맞는다.</div><div class=\"rst\">이건 쿠키 팔기만이 아니라 축구 경기, 조별 과제에도 똑같아요. = 지문 6번, 대부분의 인간 활동에 들어맞는다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">One must select a particular strategy</span></div><div class=\"k\"><span class=\"cw\">사람은 특정한 전략을 선택해야 한다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">appropriate to the occasion</span></div><div class=\"k\"><span class=\"cw\">상황에 맞는</span></div></div><div class=\"rc\"><div class=\"e\">and follow the chosen course of action.</div><div class=\"k\">그리고 선택된 행동 방침을 따라야 한다.</div></div><div class=\"rnat\">사람은 상황에 맞는 특정한 전략을 선택해야 하며 선택된 행동 방침을 따라야 한다.</div><div class=\"rst\">그러니 그때그때 <b>상황에 맞는 방법을 골라</b> 끝까지 밀고 가야 해요. 지문 7번의 must(~해야 한다), 이게 필자의 주장이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Doing so</div><div class=\"k\">그렇게 하는 것은</div></div><div class=\"rc\"><div class=\"e\">will ensure more lasting success</div><div class=\"k\">더 지속적인 성공을 보장할 것이다</div></div><div class=\"rc\"><div class=\"e\">in reaching one’s goals.</div><div class=\"k\">목표를 달성하는 데 있어서.</div></div><div class=\"rnat\">그렇게 하는 것은 목표를 달성하는 데 있어서 더 지속적인 성공을 보장할 것이다.</div><div class=\"rst\">그렇게 하면 쿠키를 다 파는 목표에 더 오래 성공해요. 지문 8번도 그게 목표 달성의 지속적인 성공을 보장한다고 끝맺어요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"sufficient\" data-m=\"충분한\"><b>sufficient</b>충분한</button><button type=\"button\" class=\"wdb\" data-w=\"approach\" data-m=\"접근법\"><b>approach</b>접근법</button><button type=\"button\" class=\"wdb\" data-w=\"variable\" data-m=\"변수\"><b>variable</b>변수</button><button type=\"button\" class=\"wdb\" data-w=\"in advance\" data-m=\"미리, 사전에\"><b>in advance</b>미리, 사전에</button><button type=\"button\" class=\"wdb\" data-w=\"appropriate to\" data-m=\"~에 맞는\"><b>appropriate to</b>~에 맞는</button><button type=\"button\" class=\"wdb\" data-w=\"course of action\" data-m=\"행동 방침\"><b>course of action</b>행동 방침</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이 글은 감정이 바뀌는 게 아니라 <b>한 방향으로 점점 짙어져요</b>. scared(겁이 난) → <b>terrified</b>(몹시 겁먹은) → panicked(공포에 사로잡혔다)로 이어지는 <b>감정 단어</b>와 쿵 소리 같은 <b>놀랄 사건</b>을 함께 잡으세요.</p><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 첫 감정 단서</span><div class=\"en\"><mark>I was actually becoming scared</mark>, which was kind of rare, because at that age I was pretty fearless.</div><p class=\"ko\"><mark>나는 실제로 겁이 나기 시작했는데</mark>, 그 나이 때 나는 상당히 겁이 없었기 때문에 그것은 좀 드문 일이었다.</p></div><div class=\"ck-via\"><i>▼</i><span>겁이 나던 참에 갑자기 큰 소리가 나요 → 깜짝 놀람</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 놀랄 사건</span><div class=\"en\">As we got to the top of the hill, there was <mark>a loud thump!</mark></div><p class=\"ko\">우리가 언덕 꼭대기에 도착했을 때, <mark>크게 쿵 하는 소리가 났다!</mark></p></div><div class=\"ck-via\"><i>▼</i><span>트럭이 내려앉자 겁이 최고조가 돼요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 단서</span><div class=\"en\">We were <mark>too terrified</mark> to look in the back.</div><p class=\"ko\">우리는 <mark>너무 무서워서</mark> 뒤를 볼 수가 없었다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>10번</em>I panicked(나는 공포에 사로잡혔다) → 후진해서 도망</span><span><em>11번</em>또 쿵 + 처음 들어 보는 포효</span></div><div class=\"ck-eq\">⇒ 끝까지 놀람과 두려움만 쌓여요 = alarmed and frightened(놀라고 겁먹은)</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">alarmed and frightened 놀라고 겁먹은<small>7번 쿵 소리(놀람) + 9번 too terrified(너무 무서워서)(겁먹음)가 딱 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">relieved and relaxed 안도하고 편안한</span><span class=\"why\">10번에서 후진해 내려가니 안도했을 것 같지만, 11번에 another thump(또 다른 쿵 소리)와 a loud roar(엄청난 포효)가 나와 더 무서워져요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">pleased and delighted 기쁘고 즐거운</span><span class=\"why\">1번에 Big Foot(빅풋)을 찾으러 가자고 한 건 결심일 뿐, 6번부터는 scared(겁이 난)만 나와요. 기쁜 감정 단어가 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">bored and indifferent 지루하고 무관심한</span><span class=\"why\">쿵 소리, 내려앉는 트럭, 포효가 이어지는 장면이라 지루할 틈이 없어요. 9번은 무관심이 아니라 too terrified(너무 무서워서)예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">dissatisfied and angry 불만족스럽고 화난</span><span class=\"why\">화를 낼 상대도, 화난 감정 단어도 없어요. 10번 panicked(공포에 사로잡혔다)는 분노가 아니라 두려움이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">One night</div><div class=\"k\">어느 날 밤</div></div><div class=\"rc\"><div class=\"e\">a buddy and I decided</div><div class=\"k\">한 친구와 나는 결심했다</div></div><div class=\"rc\"><div class=\"e\">we were going to go find that Big Foot.</div><div class=\"k\">우리가 그 Big Foot을 찾으러 가기로.</div></div><div class=\"rnat\">어느 날 밤 한 친구와 나는 그 Big Foot을 찾으러 가기로 결심했다.</div><div class=\"rst\">캠프 날 밤, 친구랑 “뒷산에 산다는 괴물 찾으러 가자!” 하고 정해요. 지문 1번도 친구와 Big Foot(빅풋)을 찾으러 가기로 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We were in my old truck</div><div class=\"k\">우리는 내 오래된 트럭을 타고</div></div><div class=\"rc\"><div class=\"e\">and we set off across the fields</div><div class=\"k\">들판을 가로질러 출발했다</div></div><div class=\"rc\"><div class=\"e\">heading toward the tallest hill.</div><div class=\"k\">가장 높은 언덕을 향해.</div></div><div class=\"rnat\">우리는 내 오래된 트럭을 타고 가장 높은 언덕을 향해 들판을 가로질러 출발했다.</div><div class=\"rst\">내 낡은 트럭을 타고 제일 높은 언덕 쪽으로 출발해요. = 지문 2번, 오래된 트럭을 타고 들판을 가로질러 가장 높은 언덕으로 향해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The fields were rough,</div><div class=\"k\">들판은 거칠었고,</div></div><div class=\"rc\"><div class=\"e\">with only the slightest trail to follow.</div><div class=\"k\">따라갈 아주 희미한 길만이 있었다.</div></div><div class=\"rnat\">들판은 거칠었고, 따라갈 아주 희미한 길만이 있었다.</div><div class=\"rst\">길은 울퉁불퉁하고, 발자국 같은 희미한 길만 겨우 보여요. 지문 3번도 들판이 거칠고 길이 희미했다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Along the way</div><div class=\"k\">길을 따라</div></div><div class=\"rc\"><div class=\"e\">there were small trenches</div><div class=\"k\">작은 구덩이들이 있었다</div></div><div class=\"rc\"><div class=\"e\">dug in the fields.</div><div class=\"k\">들판에 파인.</div></div><div class=\"rnat\">길을 따라 들판에 파인 작은 구덩이들이 있었다.</div><div class=\"rst\">가다 보니 땅에 이상한 구덩이들이 파여 있어요. 지문 4번도 들판에 작은 구덩이들이 있었다고 해요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">I never figured out why.</div><div class=\"k\">나는 왜 그런지 전혀 알 수가 없었다.</div></div><div class=\"rnat\">나는 왜 그런지 전혀 알 수가 없었다.</div><div class=\"rst\">누가 왜 팠는지 알 수가 없어 좀 찜찜해요. 지문 5번, 나는 그 이유를 끝내 알아내지 못했어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">As we got closer and closer</div><div class=\"k\">우리가 점점 가까워질수록</div></div><div class=\"rc\"><div class=\"e\">to the top of the hill,</div><div class=\"k\">언덕 꼭대기에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">I was actually becoming scared,</span></div><div class=\"k\"><span class=\"cw\">나는 실제로 겁이 나기 시작했는데,</span></div></div><div class=\"rc\"><div class=\"e\">which was kind of rare,</div><div class=\"k\">그것은(= 겁이 난 것) 좀 드문 일이었다,</div></div><div class=\"rc\"><div class=\"e\">because at that age I was pretty fearless.</div><div class=\"k\">그 나이 때 나는 상당히 겁이 없었기 때문에.</div></div><div class=\"rnat\">우리가 언덕 꼭대기에 점점 가까워질수록, 나는 실제로 겁이 나기 시작했는데, 그 나이 때 나는 상당히 겁이 없었기 때문에 그것(겁이 난 것)은 좀 드문 일이었다.</div><div class=\"rst\">꼭대기에 가까워질수록 평소 겁 없던 나도 <b>무서워지기 시작해요</b>(scared). 지문 6번, 그게 드문 일이라 더 강조돼요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">As we got to the top of the hill,</div><div class=\"k\">우리가 언덕 꼭대기에 도착했을 때,</div></div><div class=\"rc ckc\"><div class=\"e\">there was <span class=\"cw\">a loud thump!</span></div><div class=\"k\"><span class=\"cw\">크게 쿵 하는 소리가 났다!</span></div></div><div class=\"rnat\">우리가 언덕 꼭대기에 도착했을 때, 크게 쿵 하는 소리가 났다!</div><div class=\"rst\">꼭대기에 닿자마자 <b>쿵!</b> 하는 큰 소리가 나요. 지문 7번의 a loud thump(크게 쿵 하는 소리)에 깜짝 놀라요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">My truck sunk down</div><div class=\"k\">내 트럭이 내려앉았다</div></div><div class=\"rc\"><div class=\"e\">like something heavy</div><div class=\"k\">마치 어떤 무거운 것이</div></div><div class=\"rc\"><div class=\"e\">had just jumped in the bed.</div><div class=\"k\">화물칸에 막 뛰어든 것처럼.</div></div><div class=\"rnat\">마치 어떤 무거운 것이 화물칸에 막 뛰어든 것처럼 내 트럭이 내려앉았다.</div><div class=\"rst\">뭔가 무거운 게 뒤에 올라탄 듯 트럭이 푹 꺼져요. 지문 8번, 트럭 짐칸이 내려앉아요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">We were <span class=\"cw\">too terrified</span></div><div class=\"k\">우리는 <span class=\"cw\">너무 무서워서</span></div></div><div class=\"rc\"><div class=\"e\">to look in the back.</div><div class=\"k\">뒤를 볼 수가 없었다.</div></div><div class=\"rnat\">우리는 너무 무서워서 뒤를 볼 수가 없었다.</div><div class=\"rst\"><b>너무 무서워서</b>(too terrified) 뒤를 돌아볼 수도 없어요. 지문 9번, 겁이 가장 커지는 자리예요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">I panicked</span></div><div class=\"k\"><span class=\"cw\">나는 공포에 사로잡혔고</span></div></div><div class=\"rc\"><div class=\"e\">and decided to throw the truck into reverse</div><div class=\"k\">트럭을 후진시키기로 결심했다</div></div><div class=\"rc\"><div class=\"e\">and back down the hill.</div><div class=\"k\">그리고 언덕 아래로 물러나기로.</div></div><div class=\"rnat\">나는 공포에 사로잡혔고 트럭을 후진시켜 언덕 아래로 물러나기로 결심했다.</div><div class=\"rst\">나는 <b>겁에 질려</b>(panicked) 얼른 트럭을 뒤로 빼서 내려가기로 해요. 지문 10번도 트럭을 후진시켜 언덕을 내려가요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">As I did so,</div><div class=\"k\">내가 그렇게 했을 때,</div></div><div class=\"rc\"><div class=\"e\">there was another thump</div><div class=\"k\">또 다른 쿵 하는 소리가 났고</div></div><div class=\"rc\"><div class=\"e\">and a loud roar now came out</div><div class=\"k\">그때 엄청난 포효가 들렸다</div></div><div class=\"rc\"><div class=\"e\">like I’d never, ever heard before.</div><div class=\"k\">전에 들어본 적이 없는.</div></div><div class=\"rnat\">내가 그렇게 했을 때, 또 다른 쿵 하는 소리가 났고 그때 전에 들어본 적이 없는 엄청난 포효가 들렸다.</div><div class=\"rst\">그런데 또 쿵! 처음 듣는 으르렁 소리까지 들려요. 지문 11번, 끝까지 놀람과 두려움뿐이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"fearless\" data-m=\"겁이 없는, 용감한\"><b>fearless</b>겁이 없는, 용감한</button><button type=\"button\" class=\"wdb\" data-w=\"thump\" data-m=\"쿵 하는 소리\"><b>thump</b>쿵 하는 소리</button><button type=\"button\" class=\"wdb\" data-w=\"trench\" data-m=\"구덩이, 도랑\"><b>trench</b>구덩이, 도랑</button><button type=\"button\" class=\"wdb\" data-w=\"terrified\" data-m=\"몹시 겁먹은\"><b>terrified</b>몹시 겁먹은</button><button type=\"button\" class=\"wdb\" data-w=\"panic\" data-m=\"공포에 사로잡히다\"><b>panic</b>공포에 사로잡히다</button><button type=\"button\" class=\"wdb\" data-w=\"roar\" data-m=\"포효, 으르렁거리는 소리\"><b>roar</b>포효, 으르렁거리는 소리</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>85%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>In other words</b>(다시 말해서)로 정리하는 6·7번에 있어요. 2~5번 보충제 이야기는 <b>사례</b>이고, 7번의 <b>one element</b>(한 가지 요인) ↔ <b>the system as a whole</b>(전체 체계) 대비가 뼈대예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화제 제시</span><div class=\"en\">Even when scientists are able to identify seemingly beneficial nutrients, <mark>they cannot always understand</mark> how those nutrients will operate in a real-life context</div><p class=\"ko\">과학자들이 겉보기에 유익한 영양소를 확인할 수 있을 때조차, <mark>그들(= 과학자들)은 항상 이해할 수 있는 것은 아니다</mark>, 그 영양소들이 실생활의 맥락에서 어떻게 작용할 것인지</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>암 예방의 비결 = 산화 방지제라고 믿음</span><span><em>4번</em>Yet(그러나) 뽑아서 보충제로 만들었더니 암이 안 줄어듦</span><span><em>5번</em>베타카로틴 보충제는 오히려 위험을 높임</span></div><div class=\"ck-eq\">⇒ 사례의 결론 = 영양소 하나만 떼어 내면 실제로는 다르게 작용해요</div></div><div class=\"ck-via\"><i>▼</i><span>In other words(다시 말해서)로 사례를 한 줄로 묶어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 정리 신호</span><div class=\"en\">In other words, scientists <mark>thoroughly misunderstood</mark> the causes of complex events.</div><p class=\"ko\">다시 말해서, 과학자들은 복잡한 사안의 원인에 대해서 <mark>완전히 잘못 이해했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>무엇을 잘못 이해했는지 대비로 콕 짚어요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">They identified <mark>one element</mark> engaged in the process of nutrition without fully comprehending <mark>how the system as a whole truly functions</mark>.</div><p class=\"ko\">그들은 <mark>전체적으로 체계가 정말로 어떻게 작용하는지를</mark> 온전히 이해하지 못한 채 영양 처리 과정과 관련된 <mark>한 가지 요인만을</mark> 인식했다.</p></div><div class=\"ck-via\"><i>▼</i><span>영양소를 따로 떼어 내다(isolating) 연결고리를 놓쳤다고 같은 말을 반복해요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 한 번 더 확인</span><div class=\"en\">Nutritional scientists … failed to see a multitude of links in the complex chain that leads to good health.</div><p class=\"ko\">영양학자들은 좋은 건강으로 이어지는 복잡한 사슬 내의 수많은 연결고리들을 보지 못했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">영양소가 전체 체계 안에서 어떻게 작용하는지에 대한 불충분한 이해<small>7번 without fully comprehending(온전히 이해하지 못한 채) + the system as a whole(전체 체계)을 그대로 옮겼어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">식물로 영양 보충제를 만드는 것의 문제점</span><span class=\"why\">[범위 좁음] 4~5번 보충제 이야기는 사례일 뿐이에요. 6번 In other words(다시 말해서)가 정리한 핵심은 보충제가 아니라 과학자들의 잘못된 이해예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">영양소를 분리하는 대안적 과학 방법의 필요성</span><span class=\"why\">[반대] 8번은 isolating nutrients(영양소를 분리하는) 방식을 따르다 연결고리를 못 봤다고 비판해요. 분리하는 방법이 더 필요하다는 건 거꾸로예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">과일과 채소에서 분자를 추출하는 것의 잠재적 이점</span><span class=\"why\">[반대] 4번에서 추출한 분자는 did not reduce cancer(암을 줄이지 못했다), 5번은 오히려 위험을 높였어요. 이점이 아니라 실패 사례예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">암 예방에 도움이 될 유익한 영양소를 찾는 일의 어려움</span><span class=\"why\">[지문에 없음] 1번은 과학자들이 영양소를 identify(확인하다)할 수는 있다고 했어요. 어려운 건 ‘찾기’가 아니라 전체 속 작용을 ‘이해하기’예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Even when scientists are able to identify</div><div class=\"k\">심지어 과학자들이 확인할 수 있을 때조차</div></div><div class=\"rc\"><div class=\"e\">seemingly beneficial nutrients,</div><div class=\"k\">겉보기에 (건강에) 유익한 영양소를,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they cannot always understand</span></div><div class=\"k\"><span class=\"cw\">그들(= 과학자들)은 항상 이해할 수 있는 것은 아니다</span></div></div><div class=\"rc\"><div class=\"e\">how those nutrients will operate</div><div class=\"k\">그 영양소들이 어떻게 작용할 것인지</div></div><div class=\"rc\"><div class=\"e\">in a real-life context,</div><div class=\"k\">실생활의 맥락에서,</div></div><div class=\"rc\"><div class=\"e\">in the course of our daily meals.</div><div class=\"k\">즉 매일의 식사 과정에서.</div></div><div class=\"rnat\">심지어 과학자들이 겉보기에 (건강에) 유익한 영양소를 확인할 수 있을 때조차, 그들(과학자들)은 그 영양소들이 실생활의 맥락에서, 즉 매일의 식사 과정에서 어떻게 작용할 것인지 항상 이해할 수 있는 것은 아니다.</div><div class=\"rst\">엄마표 떡볶이가 맛있는 이유를 재료 하나로 찾아도, 그게 냄비 속에서 어떻게 어울리는지는 몰라요. = 지문 1번, 영양소가 실제로 어떻게 작용할지는 <b>항상 이해하지는 못한다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Fruits and vegetables are believed</div><div class=\"k\">과일과 채소는 믿어진다</div></div><div class=\"rc\"><div class=\"e\">to help prevent cancer.</div><div class=\"k\">암을 예방하는 데 도움이 된다고.</div></div><div class=\"rnat\">과일과 채소는 암을 예방하는 데 도움이 된다고 믿어진다.</div><div class=\"rst\">모두가 “엄마 떡볶이는 맛있어”라고 알고 있어요. 지문 2번도 과일과 채소가 암 예방에 도움이 된다고 믿어진대요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Scientists have believed</div><div class=\"k\">과학자들은 믿어 왔다</div></div><div class=\"rc\"><div class=\"e\">that it is the antioxidants in these foods</div><div class=\"k\">바로 이런 식품에 포함된 산화 방지제가</div></div><div class=\"rc\"><div class=\"e\">that make the difference</div><div class=\"k\">차이를 만들어낸다고</div></div><div class=\"rc\"><div class=\"e\">— compounds like beta carotene, lycopene, and vitamin E.</div><div class=\"k\">즉 베타카로틴, 리코펜, 그리고 비타민 E와 같은 화합물 말이다.</div></div><div class=\"rnat\">과학자들은 그런 차이를 만들어내는 것은 바로 이런 식품에 포함된 산화 방지제, 즉 베타카로틴, 리코펜, 그리고 비타민 E와 같은 화합물이라고 믿어 왔다.</div><div class=\"rst\">나는 그 맛의 비결이 고추장 하나라고 믿었어요. = 지문 3번, 과학자들은 비결이 산화 방지제라고 믿어 왔어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Yet when these molecules were extracted</div><div class=\"k\">그러나 이런 분자가 추출되어</div></div><div class=\"rc\"><div class=\"e\">from fruits and vegetables</div><div class=\"k\">과일과 채소로부터</div></div><div class=\"rc\"><div class=\"e\">and made into supplements,</div><div class=\"k\">(영양) 보충제로 만들어졌을 때,</div></div><div class=\"rc\"><div class=\"e\">they did not reduce cancer.</div><div class=\"k\">그것은(= 그 분자로 만든 보충제) 암을 줄이지 못했다.</div></div><div class=\"rnat\">그러나 이런 분자가 과일과 채소로부터 추출되어 (영양) 보충제로 만들어졌을 때, 그것은 암을 줄이지 못했다.</div><div class=\"rst\"><b>그런데</b>(Yet) 고추장만 따로 퍼 먹어 보니 그 맛이 안 나요. 지문 4번, 분자만 뽑은 보충제는 암을 줄이지 못했어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The beta carotene supplement</div><div class=\"k\">베타카로틴 보충제는</div></div><div class=\"rc\"><div class=\"e\">actually increased the risk</div><div class=\"k\">실제로는 위험을 높였다</div></div><div class=\"rc\"><div class=\"e\">of certain cancers.</div><div class=\"k\">특정 종류의 암에 걸릴.</div></div><div class=\"rnat\">베타카로틴 보충제는 실제로는 특정 종류의 암에 걸릴 위험을 높였다.</div><div class=\"rst\">오히려 너무 짜서 배까지 아파요. = 지문 5번, 베타카로틴 보충제는 오히려 암 위험을 높였다는 말이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In other words,</div><div class=\"k\">다시 말해서,</div></div><div class=\"rc ckc\"><div class=\"e\">scientists <span class=\"cw\">thoroughly misunderstood</span></div><div class=\"k\">과학자들은 <span class=\"cw\">완전히 잘못 이해했다</span></div></div><div class=\"rc\"><div class=\"e\">the causes of complex events.</div><div class=\"k\">복잡한 사안의 원인에 대해서.</div></div><div class=\"rnat\">다시 말해서, 과학자들은 복잡한 사안의 원인에 대해서 완전히 잘못 이해했다.</div><div class=\"rst\"><b>다시 말해</b>(In other words) 나는 맛의 원인을 <b>완전히 잘못 알았던</b> 거예요. 지문 6번도 과학자들이 원인을 잘못 이해했대요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">They identified <span class=\"cw\">one element</span></div><div class=\"k\">그들(= 과학자들)은 <span class=\"cw\">한 가지 요인만을</span> 인식했다</div></div><div class=\"rc\"><div class=\"e\">engaged in the process of nutrition</div><div class=\"k\">영양 처리 과정과 관련된</div></div><div class=\"rc\"><div class=\"e\">without fully comprehending</div><div class=\"k\">온전히 이해하지 못한 채</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">how the system as a whole truly functions.</span></div><div class=\"k\"><span class=\"cw\">전체적으로 체계가 정말로 어떻게 작용하는지를</span>.</div></div><div class=\"rnat\">그들은 전체적으로 체계가 정말로 어떻게 작용하는지를 온전히 이해하지 못한 채 영양 처리 과정과 관련된 한 가지 요인만을 인식했다.</div><div class=\"rst\">재료 <b>하나만</b> 보고 떡·어묵·양념이 <b>함께 어떻게 어울리는지</b>는 몰랐어요. 지문 7번, 이게 글의 주제예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Nutritional scientists</div><div class=\"k\">영양학자들은</div></div><div class=\"rc\"><div class=\"e\">— pursuing the hot paradigm of isolating nutrients —</div><div class=\"k\">영양소를 분리하는 최신의 방법론을 추구하는</div></div><div class=\"rc\"><div class=\"e\">failed to see a multitude of links</div><div class=\"k\">수많은 연결고리들을 보지 못했다</div></div><div class=\"rc\"><div class=\"e\">in the complex chain</div><div class=\"k\">복잡한 사슬 내의</div></div><div class=\"rc\"><div class=\"e\">that leads to good health.</div><div class=\"k\">좋은 건강으로 이어지는.</div></div><div class=\"rnat\">영양소를 분리하는 최신의 방법론을 추구하는 영양학자들은 좋은 건강으로 이어지는 복잡한 사슬 내의 수많은 연결고리들을 보지 못했다.</div><div class=\"rst\">재료를 하나씩 떼어 보는 데만 빠져서, 맛을 만드는 연결고리를 놓쳤어요. 지문 8번도 수많은 연결고리를 보지 못했다고 끝나요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"nutrient\" data-m=\"영양소\"><b>nutrient</b>영양소</button><button type=\"button\" class=\"wdb\" data-w=\"supplement\" data-m=\"보충제\"><b>supplement</b>보충제</button><button type=\"button\" class=\"wdb\" data-w=\"extract\" data-m=\"추출하다\"><b>extract</b>추출하다</button><button type=\"button\" class=\"wdb\" data-w=\"comprehend\" data-m=\"이해하다\"><b>comprehend</b>이해하다</button><button type=\"button\" class=\"wdb\" data-w=\"as a whole\" data-m=\"전체로서\"><b>as a whole</b>전체로서</button><button type=\"button\" class=\"wdb\" data-w=\"thoroughly\" data-m=\"완전히, 철저히\"><b>thoroughly</b>완전히, 철저히</button></div>", "04": "<div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">긴 문장에서는 <b>진짜 동사부터</b> 찾으세요. 5번의 동사는 <b>becomes</b>(~하게 된다) 하나뿐이라, ④는 앞 명사를 꾸미는 <b>분사</b> 자리이고 뒤에 <b>목적어</b>가 있으니 능동 -ing(~하는)예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (5번)</span><div class=\"en\">… the visual preoccupation of early humans with the nonhuman creatures <u>④ inhabited</u> their world becomes profoundly meaningful.</div><p class=\"ko\">자신들의 세계에 ( ? ) 인간이 아닌 생물들에 대한 초기 인류의 시각적 몰두는 깊은 의미를 지니게 된다</p></div><div class=\"ck-via\"><i>▼</i><span>주어 preoccupation(몰두)의 동사는 맨 뒤 becomes(~하게 된다)예요 → ④는 동사가 될 수 없어요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 진짜 동사</span><div class=\"en\">the visual preoccupation of early humans … <mark>becomes profoundly meaningful</mark></div><p class=\"ko\">초기 인류의 시각적 몰두는 … <mark>깊은 의미를 지니게 된다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>생물들이 직접 ‘사는’ 쪽이고, 뒤에 목적어 their world(그들의 세계)가 남아 있어요 → 능동 inhabiting(~에 사는)</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">the nonhuman creatures <mark>inhabiting</mark> <mark>their world</mark></div><p class=\"ko\"><mark>자신들의 세계에</mark> <mark>사는</mark> 인간이 아닌 생물들</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">명사 뒤 분사: 능동 -ing(~하는) 대 수동 p.p.(~된)</p><p class=\"gr\">문장에 동사가 이미 있으면, 명사 뒤에 붙은 동사 모양은 명사를 꾸미는 분사예요. 명사가 직접 하는 쪽이고 뒤에 목적어가 있으면 -ing(~하는), 당하는 쪽이면 p.p.(~된)를 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The boy playing the piano is my brother.</div><div class=\"ko\">피아노를 치는 소년은 내 동생이다. (소년이 직접 치고, 목적어 the piano 피아노가 있어서 playing이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The boy played the piano is my brother.</div><div class=\"ko\">동사 is가 이미 있는데 played를 써서 동사가 두 개처럼 되고, 목적어도 남아서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The window broken by the ball was fixed.</div><div class=\"ko\">공에 깨진 창문은 수리되었다. (창문은 깨지는 쪽이라 broken이 맞아요)</div></div><p class=\"gb\">지문 5번도 동사는 becomes(~하게 된다) 하나이고, 생물들이 직접 사는 쪽이며 뒤에 their world(그들의 세계)라는 목적어가 있으니 inhabited(수동의 과거분사)가 아니라 inhabiting(~에 사는)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">inhabited → inhabiting (~에 사는)<small>동사는 becomes(~하게 된다) 하나뿐이고, 뒤에 목적어 their world(그들의 세계)가 있으니 능동 분사 inhabiting(~에 사는)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">rely 의존하다</span><span class=\"why\">1번의 주어는 맨 앞 Speculations(고찰들)로 복수예요. 사이에 낀 about the meaning and purpose of prehistoric art(선사 시대 예술의 의미와 목적에 관한)는 꾸며 주는 말일 뿐이라 복수 동사 rely(의존하다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치: 전치사구를 건너뛰고 진짜 주어 찾기</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The books on the desk are mine.</div><div class=\"ko\">책상 위의 책들은 내 것이다. (주어 books 책들이 복수라 are가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The books on the desk is mine.</div><div class=\"ko\">바로 앞 desk(책상)에 맞춰 is를 써서 틀려요. 진짜 주어는 books(책들)예요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The color of the shoes is blue.</div><div class=\"ko\">그 신발의 색은 파랗다. (주어 color 색이 단수라 is가 맞아요)</div></div><p class=\"gb\">지문 1번도 art(예술) 바로 뒤지만 진짜 주어는 Speculations(고찰들)라서 복수 동사 rely(의존하다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">as ~하듯이</span><span class=\"why\">2번의 as(~하듯이) 뒤에는 Steven Mithen(스티븐 미슨) emphasizes(강조한다)라는 주어 + 동사가 와요. 절을 이끄는 접속사 as(~하듯이)라서 “그가 강조하듯이”로 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">접속사 as(~하듯이) + 주어 + 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>As Mom says, breakfast is important.</div><div class=\"ko\">엄마가 말씀하시듯, 아침은 중요하다. (as 뒤에 Mom says 주어+동사가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>As Mom, breakfast is important.</div><div class=\"ko\">says(말하다)가 빠지면 as가 ‘엄마로서’라는 뜻이 되어 문장이 엉뚱해져요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>As you know, he is kind.</div><div class=\"ko\">네가 알듯이, 그는 친절하다. (as 뒤에 you know 주어+동사가 와서 맞아요)</div></div><p class=\"gb\">지문 2번도 as(~하듯이) 뒤에 Steven Mithen(스티븐 미슨) emphasizes(강조한다)가 있어 “그가 강조하듯이”라는 접속사 as(~하듯이)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">which 그것들</span><span class=\"why\">3번은 콤마 뒤 both of which spread(그 둘 다 퍼져 있다)예요. 앞의 두 가지 anthropomorphism(의인화)·totemism(토테미즘)을 받으면서 두 절을 이어 주니 관계대명사 which(그것들)가 맞아요. 전치사 of(~의) 뒤라 that(그것)은 못 와요.</span><div class=\"gm wx\"><p class=\"gt\">수량 표현 + of which(그중 ~): 콤마 뒤에서 앞 명사를 받는 관계대명사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have two cats, both of which are white.</div><div class=\"ko\">나는 고양이 두 마리가 있는데, 둘 다 하얗다. (which가 cats 고양이들을 받으며 두 절을 이어서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have two cats, both of them are white.</div><div class=\"ko\">them(그것들)은 접속 기능이 없어 두 절을 그냥 붙인 꼴이라 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have two cats, both of that are white.</div><div class=\"ko\">전치사 of(~의) 뒤에는 관계대명사 that을 못 써서 틀려요.</div></div><p class=\"gb\">지문 3번도 both of which(그 둘 다)의 which(그것들)가 의인화와 토테미즘을 받으며 뒤 절 spread(퍼져 있다)를 이어 줘서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">itself 자기 자신</span><span class=\"why\">7번의 주어는 an unlettered humanity(글을 모르는 인류)이고, broods upon(~을 곰곰이 생각한다)의 대상도 인류 자신이에요. 주어와 목적어가 같으니 재귀대명사 itself(자기 자신)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">재귀대명사: 주어와 목적어가 같은 대상일 때 -self(자신)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>She looked at herself in the mirror.</div><div class=\"ko\">그녀는 거울 속 자기 자신을 보았다. (보는 사람과 보이는 사람이 같아서 herself가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>She looked at her in the mirror.</div><div class=\"ko\">her(그녀를)를 쓰면 다른 여자를 본 뜻이 되어, 자기 자신을 볼 때는 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The cat is washing itself.</div><div class=\"ko\">고양이가 자기 몸을 씻고 있다. (씻는 것과 씻기는 것이 같은 고양이라 itself가 맞아요)</div></div><p class=\"gb\">지문 7번도 humanity(인류)가 곰곰이 생각하는 대상이 인류 자신이라 itself(자기 자신)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Speculations about the meaning and purpose</div><div class=\"k\">의미와 목적에 관한 고찰은</div></div><div class=\"rc\"><div class=\"e\">of prehistoric art</div><div class=\"k\">선사 시대 예술의</div></div><div class=\"rc\"><div class=\"e\">rely heavily on analogies</div><div class=\"k\">유사점에 크게 의존한다</div></div><div class=\"rc\"><div class=\"e\">drawn with modern-day hunter-gatherer societies.</div><div class=\"k\">현대의 수렵 채집 사회와 비교해 끌어낸.</div></div><div class=\"rnat\">선사 시대 예술의 의미와 목적에 관한 고찰은 현대의 수렵 채집 사회와 비교해 끌어낸 유사점에 크게 의존한다.</div><div class=\"rst\">선사 시대 그림의 뜻은 오늘날 수렵 채집 사회와 비교해서 짐작해요. 주어가 Speculations(고찰들)라 복수 동사 rely(의존하다)예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Such primitive societies,</div><div class=\"k\">그러한 원시 사회는,</div></div><div class=\"rc\"><div class=\"e\">as Steven Mithen emphasizes</div><div class=\"k\">Steven Mithen이 강조하듯이</div></div><div class=\"rc\"><div class=\"e\">in The Prehistory of the Modern Mind,</div><div class=\"k\">《The Prehistory of the Modern Mind》에서,</div></div><div class=\"rc\"><div class=\"e\">tend to view man and beast,</div><div class=\"k\">인간과 짐승을 여기는 경향이 있다,</div></div><div class=\"rc\"><div class=\"e\">animal and plant,</div><div class=\"k\">동물과 식물,</div></div><div class=\"rc\"><div class=\"e\">organic and inorganic spheres,</div><div class=\"k\">유기물과 무기물의 영역을,</div></div><div class=\"rc\"><div class=\"e\">as participants in an integrated, animated totality.</div><div class=\"k\">통합되고 생명이 깃든 총체의 참여자로.</div></div><div class=\"rnat\">Steven Mithen이 《The Prehistory of the Modern Mind》에서 강조하듯이, 그러한 원시 사회는 인간과 짐승, 동물과 식물, 유기물과 무기물의 영역을 통합되고 생명이 깃든 총체의 참여자로 여기는 경향이 있다.</div><div class=\"rst\">원시 사회는 사람·동물·식물을 모두 한 덩어리의 살아 있는 가족처럼 봐요. as(~하듯이) 뒤에 주어+동사가 와서 접속사예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The dual expressions of this tendency</div><div class=\"k\">이 경향의 두 가지 표현이</div></div><div class=\"rc\"><div class=\"e\">are anthropomorphism</div><div class=\"k\">의인화이다</div></div><div class=\"rc\"><div class=\"e\">(the practice of regarding animals as humans)</div><div class=\"k\">(동물을 인간으로 여기는 관행)</div></div><div class=\"rc\"><div class=\"e\">and totemism</div><div class=\"k\">그리고 토테미즘인데</div></div><div class=\"rc\"><div class=\"e\">(the practice of regarding humans as animals),</div><div class=\"k\">(인간을 동물로 여기는 관행),</div></div><div class=\"rc\"><div class=\"e\">both of which spread</div><div class=\"k\">그 둘 다(= 의인화와 토테미즘) 퍼져 있다</div></div><div class=\"rc\"><div class=\"e\">through the visual art and the mythology of primitive cultures.</div><div class=\"k\">원시 문화의 시각 예술과 신화에.</div></div><div class=\"rnat\">이 경향의 두 가지 표현이 의인화(동물을 인간으로 여기는 관행)와 토테미즘(인간을 동물로 여기는 관행)인데, 그 둘 다 원시 문화의 시각 예술과 신화에 퍼져 있다.</div><div class=\"rst\">그래서 동물을 사람처럼, 사람을 동물처럼 여기는 두 습관이 생겼어요. both of which(그 둘 다)의 which(그것들)가 두 습관을 받아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Thus the natural world</div><div class=\"k\">그리하여 자연 세계는</div></div><div class=\"rc\"><div class=\"e\">is conceptualized</div><div class=\"k\">개념화된다</div></div><div class=\"rc\"><div class=\"e\">in terms of human social relations.</div><div class=\"k\">인간의 사회적 관계라는 관점에서.</div></div><div class=\"rnat\">그리하여 자연 세계는 인간의 사회적 관계라는 관점에서 개념화된다.</div><div class=\"rst\"><b>그리하여</b>(Thus) 자연도 사람 사이의 관계처럼 이해돼요. 3번의 두 습관이 낳은 결과를 말하는 문장이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">When considered in this light,</div><div class=\"k\">이런 관점에서 고려될 때,</div></div><div class=\"rc\"><div class=\"e\">the visual preoccupation of early humans</div><div class=\"k\">초기 인류의 시각적 몰두는</div></div><div class=\"rc\"><div class=\"e\">with the nonhuman creatures</div><div class=\"k\">인간이 아닌 생물들에 대한</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">inhabiting</span> their world</div><div class=\"k\">자신들의 세계에 <span class=\"cw\">사는</span> ※ 문제지엔 inhabited로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">becomes profoundly meaningful.</span></div><div class=\"k\"><span class=\"cw\">깊은 의미를 지니게 된다.</span></div></div><div class=\"rnat\">이런 관점에서 고려될 때, 자신들의 세계에 사는 인간이 아닌 생물들에 대한 초기 인류의 시각적 몰두는 깊은 의미를 지니게 된다.</div><div class=\"rst\">그래서 초기 인류가 주변 동물을 열심히 그린 게 큰 의미를 가져요. 동사는 <b>becomes</b>(~하게 된다)뿐이라 <b>inhabiting</b>(~에 사는)이 맞아요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Among hunter-gatherers,</div><div class=\"k\">수렵 채집인들 사이에서,</div></div><div class=\"rc\"><div class=\"e\">animals are not only good to eat,</div><div class=\"k\">동물은 먹기에 좋을 뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">they are also good to think about,</div><div class=\"k\">그것들은(= 동물은) 또한 생각하기에도 좋다,</div></div><div class=\"rc\"><div class=\"e\">as Claude Lévi-Strauss has observed.</div><div class=\"k\">Claude Lévi-Strauss가 말했듯이.</div></div><div class=\"rnat\">Claude Lévi-Strauss가 말했듯이, 수렵 채집인들 사이에서 동물은 먹기에 좋을 뿐만 아니라 생각하기에도 좋다.</div><div class=\"rst\">동물은 먹기에도 좋고 생각하기에도 좋다고 해요. not only(~일 뿐만 아니라) ~, also(~도) ~를 써서 동물의 두 쓰임을 보여 줘요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">In the practice of totemism,</div><div class=\"k\">토테미즘의 관행 속에서,</div></div><div class=\"rc\"><div class=\"e\">he has suggested,</div><div class=\"k\">그(= Claude Lévi-Strauss)가 시사했듯이,</div></div><div class=\"rc\"><div class=\"e\">an unlettered humanity</div><div class=\"k\">글을 모르는 인류는</div></div><div class=\"rc\"><div class=\"e\">“broods upon itself</div><div class=\"k\">‘자기 자신을 곰곰이 생각한다</div></div><div class=\"rc\"><div class=\"e\">and its place in nature.”</div><div class=\"k\">그리고 자연 속 자신의 위치를.’</div></div><div class=\"rnat\">그가 시사했듯이, 토테미즘의 관행 속에서 글을 모르는 인류는 ‘자기 자신과 자연 속 자신의 위치를 곰곰이 생각한다.’</div><div class=\"rst\">토테미즘 속에서 인류는 자기 자신과 자연 속 자기 자리를 곰곰이 생각해요. 생각하는 대상이 주어 자신이라 itself(자기 자신)예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"speculation\" data-m=\"고찰, 추측\"><b>speculation</b>고찰, 추측</button><button type=\"button\" class=\"wdb\" data-w=\"primitive\" data-m=\"원시의\"><b>primitive</b>원시의</button><button type=\"button\" class=\"wdb\" data-w=\"anthropomorphism\" data-m=\"의인화\"><b>anthropomorphism</b>의인화</button><button type=\"button\" class=\"wdb\" data-w=\"preoccupation\" data-m=\"몰두, 집착\"><b>preoccupation</b>몰두, 집착</button><button type=\"button\" class=\"wdb\" data-w=\"inhabit\" data-m=\"~에 서식하다, 살다\"><b>inhabit</b>~에 서식하다, 살다</button><button type=\"button\" class=\"wdb\" data-w=\"unlettered\" data-m=\"글을 모르는\"><b>unlettered</b>글을 모르는</button></div>", "05": "<div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 <b>do not have the ears to hear it</b>(그것을 들을 귀가 없다)은 귀가 아니라 ‘<b>말귀를 못 알아듣는다</b>’는 비유예요. it(그것)이 가리키는 <b>바로 앞 4번</b>의 요점을 찾아 넣으세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (5번)</span><div class=\"en\">But the confusion has grown so deep that many people today do not have <mark>the ears to hear it</mark>.</div><p class=\"ko\">그러나 그 혼란이 너무 깊어져서 오늘날 많은 사람들은 그것을 <mark>들을 귀를</mark> 가지고 있지 않다.</p></div><div class=\"ck-via\"><i>▼</i><span>it(그것) = 바로 앞의 The point(요점)예요</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · it(그것)의 정체</span><div class=\"en\">The point is elementary: you can’t have sustainable capitalism without capital; <mark>you can’t have capital without savings</mark>; and you can’t save if you’re running around spending everything you’ve just earned.</div><p class=\"ko\">요점은 아주 간단하다. 자본 없이는 지속 가능한 자본주의를 가질 수 없고, <mark>저축 없이는 자본을 가질 수 없으며</mark>, 방금 번 것을 전부 쓰고 다니면 저축할 수 없다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>1단계</em>자본주의 ← 자본이 있어야</span><span><em>2단계</em>자본 ← 저축이 있어야</span><span><em>3단계</em>저축 ← 다 써 버리면 불가능</span></div><div class=\"ck-eq\">⇒ 요점 = 쓰기(소비)만으로는 자본주의가 버틸 수 없다</div></div><div class=\"ck-via\"><i>▼</i><span>글 첫 문장도 소비주의가 자본주의를 불가능하게 만든다고 했어요</span></div><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 같은 말로 확인</span><div class=\"en\">Far from a synonym for capitalism, <mark>consumerism makes capitalism impossible</mark> over the long term</div><p class=\"ko\">자본주의의 동의어이기는커녕, <mark>소비주의는 자본주의를 불가능하게 만드는데</mark>, 장기적으로는</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">소비만으로는 자본주의를 지탱할 수 없다는 것을 이해하지 못하다<small>‘들을 귀가 없다’ = 4번의 요점(쓰기만 해서는 자본주의가 안 된다)을 못 알아듣는다는 뜻이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">금리를 낮추는 국가 정책에 동의하지 않다</span><span class=\"why\">6번의 driving down interest rates(금리를 끌어내림)를 가져온 함정이에요. 6번은 밑줄 뒤에서 그 습관을 더 굳히는 예일 뿐, it(그것)이 가리키는 요점이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">소비주의가 자본주의의 동의어라는 사실을 무시하다</span><span class=\"why\">1번은 Far from a synonym(동의어이기는커녕)이라고 했어요. 동의어라는 걸 ‘사실’로 놓은 이 보기는 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">소비주의가 웰빙에 별 도움이 되지 않는다고 믿다</span><span class=\"why\">웰빙 얘기는 지문에 없어요. 지문이 말하는 소비주의의 문제는 건강·행복이 아니라 savings(저축)와 capital(자본)을 못 만든다는 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">저축이 국가를 번영하게 한다는 잘못된 가정을 세우다</span><span class=\"why\">필자는 4번에서 저축이 있어야 자본이 생긴다고 해요. 저축을 ‘잘못된 가정’이라고 한 이 보기는 필자 생각과 거꾸로예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Far from a synonym for capitalism,</div><div class=\"k\">자본주의의 동의어이기는커녕,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">consumerism makes capitalism impossible</span></div><div class=\"k\"><span class=\"cw\">소비주의는 자본주의를 불가능하게 만드는데</span></div></div><div class=\"rc\"><div class=\"e\">over the long term,</div><div class=\"k\">장기적으로는,</div></div><div class=\"rc\"><div class=\"e\">since it makes capital formation</div><div class=\"k\">그것이(= 소비주의) 자본 형성을 만들기 때문이다</div></div><div class=\"rc\"><div class=\"e\">all but impossible.</div><div class=\"k\">거의 불가능하게.</div></div><div class=\"rnat\">소비주의는 자본주의의 동의어이기는커녕 장기적으로는 자본주의를 불가능하게 만드는데, 자본 형성을 거의 불가능하게 만들기 때문이다.</div><div class=\"rst\">용돈을 받자마자 다 쓰면, 나중에 자전거 사는 꿈은 이룰 수 없어요. = 지문 1번, 소비주의는 자본주의를 <b>불가능하게 만든다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">A consumer culture isn’t a saving culture,</div><div class=\"k\">소비 문화는 저축하는 문화가 아니며,</div></div><div class=\"rc\"><div class=\"e\">isn’t a thrift culture.</div><div class=\"k\">절약하는 문화도 아니다.</div></div><div class=\"rnat\">소비 문화는 저축하는 문화가 아니며, 절약하는 문화도 아니다.</div><div class=\"rst\">“사고 싶은 건 바로 산다” 하는 습관은 모으는 습관이 아니에요. 지문 2번도 소비 문화는 저축·절약 문화가 아니래요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It’s too fixated on buying the next toy</div><div class=\"k\">그것은(= 소비 문화) 다음 장난감을 사는 데 너무 집착해서</div></div><div class=\"rc\"><div class=\"e\">to ever delay gratification,</div><div class=\"k\">욕구 충족을 미루지도 못하고,</div></div><div class=\"rc\"><div class=\"e\">to ever save and invest for the future.</div><div class=\"k\">미래를 위해 저축하고 투자하지도 못한다.</div></div><div class=\"rnat\">소비 문화는 다음 장난감을 사는 데 너무 집착해서 욕구 충족을 미루지도, 미래를 위해 저축하고 투자하지도 못한다.</div><div class=\"rst\">새 게임 아이템만 쫓느라 참지도, 모으지도 못해요. = 지문 3번, 다음 장난감에 집착해 미래를 위해 저축하지 못한다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">The point is elementary:</div><div class=\"k\">요점은 아주 간단하다:</div></div><div class=\"rc\"><div class=\"e\">you can’t have sustainable capitalism</div><div class=\"k\">지속 가능한 자본주의를 가질 수 없다</div></div><div class=\"rc\"><div class=\"e\">without capital;</div><div class=\"k\">자본 없이는;</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">you can’t have capital without savings;</span></div><div class=\"k\"><span class=\"cw\">저축 없이는 자본을 가질 수 없다;</span></div></div><div class=\"rc\"><div class=\"e\">and you can’t save</div><div class=\"k\">그리고 저축할 수 없다</div></div><div class=\"rc\"><div class=\"e\">if you’re running around spending everything</div><div class=\"k\">전부 쓰고 다니면</div></div><div class=\"rc\"><div class=\"e\">you’ve just earned.</div><div class=\"k\">방금 번 것을.</div></div><div class=\"rnat\">요점은 아주 간단하다. 자본 없이는 지속 가능한 자본주의를 가질 수 없고, 저축 없이는 자본을 가질 수 없으며, 방금 번 것을 전부 쓰고 다니면 저축할 수 없다.</div><div class=\"rst\"><b>자전거를 사려면 모은 돈이 있어야 하고, 모으려면 다 쓰면 안 돼요.</b> 지문 4번의 아주 간단한 요점이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">But the confusion has grown so deep</div><div class=\"k\">그러나 그 혼란이 너무 깊어져서</div></div><div class=\"rc\"><div class=\"e\">that many people today</div><div class=\"k\">오늘날 많은 사람들은</div></div><div class=\"rc ckc\"><div class=\"e\">do not have <span class=\"cw\">the ears to hear it</span>.</div><div class=\"k\">그것을(= 저축 없이는 자본도 자본주의도 없다는 요점) <span class=\"cw\">들을 귀를</span> 가지고 있지 않다.</div></div><div class=\"rnat\">그러나 그 혼란이 너무 깊어져서 오늘날 많은 사람들은 그것을 들을 귀를 가지고 있지 않다.</div><div class=\"rst\">그런데 이 말을 해 줘도 “무슨 소리야?” 하고 못 알아들어요. 지문 5번의 <b>들을 귀가 없다</b>가 바로 그 뜻이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Indeed,</div><div class=\"k\">실제로,</div></div><div class=\"rc\"><div class=\"e\">the policies of our nation’s central bank</div><div class=\"k\">우리나라 중앙은행의 정책은</div></div><div class=\"rc\"><div class=\"e\">seem to reinforce this habit</div><div class=\"k\">이런 습관을 강화하는 것처럼 보인다</div></div><div class=\"rc\"><div class=\"e\">by driving down interest rates to near zero</div><div class=\"k\">금리를 거의 0으로 끌어내림으로써</div></div><div class=\"rc\"><div class=\"e\">and thereby denying people a material reward</div><div class=\"k\">그리고 그렇게 함으로써 사람들에게 물질적 보상을 주지 않음으로써</div></div><div class=\"rc\"><div class=\"e\">— in the form of interest on their banked savings —</div><div class=\"k\">즉 은행에 맡긴 저축에 붙는 이자라는 형태의</div></div><div class=\"rc\"><div class=\"e\">for foregoing consumption.</div><div class=\"k\">소비를 포기한 것에 대한.</div></div><div class=\"rnat\">실제로, 우리나라 중앙은행의 정책은 금리를 거의 0으로 끌어내리고, 그렇게 함으로써 소비를 포기한 것에 대한 물질적 보상, 즉 은행에 맡긴 저축에 붙는 이자를 사람들에게 주지 않음으로써 이런 습관을 강화하는 것처럼 보인다.</div><div class=\"rst\">게다가 엄마가 “저금하면 보너스 줄게” 하던 약속도 없앴어요. 지문 6번, 금리를 0 가까이 내려 저축 보상을 없앤 거예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"synonym\" data-m=\"동의어\"><b>synonym</b>동의어</button><button type=\"button\" class=\"wdb\" data-w=\"consumerism\" data-m=\"소비주의\"><b>consumerism</b>소비주의</button><button type=\"button\" class=\"wdb\" data-w=\"thrift\" data-m=\"절약\"><b>thrift</b>절약</button><button type=\"button\" class=\"wdb\" data-w=\"gratification\" data-m=\"욕구 충족\"><b>gratification</b>욕구 충족</button><button type=\"button\" class=\"wdb\" data-w=\"elementary\" data-m=\"기초적인, 초보의\"><b>elementary</b>기초적인, 초보의</button><button type=\"button\" class=\"wdb\" data-w=\"forego\" data-m=\"단념하다, 포기하다\"><b>forego</b>단념하다, 포기하다</button></div>", "06": "<div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞 <b>against</b>(~에 맞서)가 열쇠예요. 필자가 <b>맞서 싸울 주장</b>, 즉 5번의 ‘<b>이견은 잘못된 것</b>’이라는 생각이 빈칸에 들어가요. 필자 주장을 그대로 넣으면 거꾸로 돼요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (9번)</span><div class=\"en\">A defense is required <mark>against</mark> any suggestion that <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">( ? )라는 어떠한 주장에 <mark>맞서</mark> 방어가 필요하다</p></div><div class=\"ck-via\"><i>▼</i><span>필자가 ‘틀렸다’고 소개하는 생각 = 맞서야 할 주장</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">The assumption behind those theories is that <mark>disagreement is wrong</mark> and consensus is the desirable state of things.</div><p class=\"ko\">그런 이론들 뒤에 있는 가정은 <mark>이견은 잘못된 것</mark>이고 합의가 바람직한 상태라는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>In fact(사실)로 5번의 가정을 뒤집어요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 필자의 반박</span><div class=\"en\">In fact, consensus rarely comes without some forms of subtle coercion and the absence of fear in expressing a disagreement <mark>is a source of genuine freedom</mark>.</div><p class=\"ko\">사실, 합의는 어떤 형태의 교묘한 강압 없이는 좀처럼 이루어지지 않으며, 이견을 표현하는 데 두려움이 없는 것이 <mark>진정한 자유의 원천이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>이견을 억누르는 걸 목표로 삼지 말라 = 이견은 정상이에요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 필자의 결론</span><div class=\"en\">The suppression of disagreement should never be made into a goal in political deliberation.</div><p class=\"ko\">이견의 억압이 정치적 숙의의 목표가 되어서는 결코 안 된다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">정치적 이견이 정상적인 상태가 아니다<small>5번 disagreement is wrong(이견은 잘못된 것)과 같은 생각이라, against(~에 맞서)의 대상으로 딱 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">억압은 정치에서 결코 바람직한 도구가 될 수 없다</span><span class=\"why\">8번 should never be made into a goal(결코 목표가 되어선 안 된다)과 같은 필자 주장이에요. against(~에 맞서) 뒤에 넣으면 필자가 자기 주장에 맞서는 꼴이 돼요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">정치는 어떤 형태의 차이도 제한해서는 안 된다</span><span class=\"why\">8번처럼 이견을 억누르지 말자는 필자 쪽 생각이에요. 필자가 맞서야 할 주장이 아니라서 빈칸 앞 against(~에 맞서)와 부딪쳐요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">정치 발전은 언론의 자유에서 비롯된다</span><span class=\"why\">언론 얘기는 지문에 없어요. 6번의 genuine freedom(진정한 자유)은 언론이 아니라 이견을 두려움 없이 말하는 데서 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">자유는 관용을 통해서만 성취될 수 있다</span><span class=\"why\">관용 얘기는 지문에 없어요. 6번은 자유의 원천을 the absence of fear(두려움이 없는 것)라고 했고, 필자가 맞설 주장도 아니에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Politics cannot be suppressed,</div><div class=\"k\">정치는 억눌릴 수 없다,</div></div><div class=\"rc\"><div class=\"e\">whichever policy process is employed</div><div class=\"k\">어떤 정책 과정이 채택되든</div></div><div class=\"rc\"><div class=\"e\">and however sensitive and respectful of differences it might be.</div><div class=\"k\">그리고 그것이(= 그 정책 과정) 아무리 세심하고 차이를 존중하는 것이든.</div></div><div class=\"rnat\">어떤 정책 과정이 채택되든, 그리고 그것이 아무리 세심하고 차이를 존중하는 것이든, 정치는 억눌릴 수 없다.</div><div class=\"rst\">학급회의에서 어떤 방식으로 정하든 의견 다툼은 안 없어져요. = 지문 1번, 정치는 <b>억눌릴 수 없다</b>는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In other words,</div><div class=\"k\">다시 말해,</div></div><div class=\"rc\"><div class=\"e\">there is no end to politics.</div><div class=\"k\">정치에는 끝이 없다.</div></div><div class=\"rnat\">다시 말해, 정치에는 끝이 없다.</div><div class=\"rst\">회의가 끝나도 다른 의견은 또 나와요. 지문 2번도 다시 말해 정치에는 끝이 없다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It is wrong to think</div><div class=\"k\">생각하는 것은 잘못이다</div></div><div class=\"rc\"><div class=\"e\">that proper institutions, knowledge,</div><div class=\"k\">적절한 제도, 지식,</div></div><div class=\"rc\"><div class=\"e\">methods of consultation,</div><div class=\"k\">협의의 방법,</div></div><div class=\"rc\"><div class=\"e\">or participatory mechanisms</div><div class=\"k\">또는 참여의 장치가</div></div><div class=\"rc\"><div class=\"e\">can make disagreement go away.</div><div class=\"k\">이견을 사라지게 할 수 있다고.</div></div><div class=\"rnat\">적절한 제도, 지식, 협의의 방법, 또는 참여의 장치가 이견을 사라지게 할 수 있다고 생각하는 것은 잘못이다.</div><div class=\"rst\">좋은 규칙이나 투표 방법만 있으면 반대 의견이 사라질 거라 생각하면 틀려요. = 지문 3번, 그건 잘못된 생각이래요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Theories of all sorts</div><div class=\"k\">온갖 종류의 이론들이</div></div><div class=\"rc\"><div class=\"e\">promote the view</div><div class=\"k\">견해를 퍼뜨린다</div></div><div class=\"rc\"><div class=\"e\">that there are ways</div><div class=\"k\">방법들이 있다는</div></div><div class=\"rc\"><div class=\"e\">by which disagreement can be processed or managed</div><div class=\"k\">이견을 처리하거나 관리할 수 있는</div></div><div class=\"rc\"><div class=\"e\">so as to make it disappear.</div><div class=\"k\">그것을(= 이견) 사라지게 하도록.</div></div><div class=\"rnat\">온갖 종류의 이론들이 이견을 처리하거나 관리해서 사라지게 할 수 있는 방법들이 있다는 견해를 퍼뜨린다.</div><div class=\"rst\">그런데 “잘 정리하면 반대 의견을 없앨 수 있다”는 말이 여기저기 퍼져 있어요. 지문 4번, 온갖 이론이 그 견해를 퍼뜨려요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The assumption behind those theories</div><div class=\"k\">그런 이론들 뒤에 있는 가정은</div></div><div class=\"rc ckc\"><div class=\"e\">is that <span class=\"cw\">disagreement is wrong</span></div><div class=\"k\"><span class=\"cw\">이견은 잘못된 것이라는 것이다</span></div></div><div class=\"rc\"><div class=\"e\">and consensus is the desirable state of things.</div><div class=\"k\">그리고 합의가 바람직한 상태라는.</div></div><div class=\"rnat\">그런 이론들 뒤에 있는 가정은 이견은 잘못된 것이고 합의가 바람직한 상태라는 것이다.</div><div class=\"rst\">그 말 밑에는 “반대 의견은 <b>나쁜 것</b>, 다 같은 의견이 좋은 것”이라는 생각이 깔려 있어요. 지문 5번이 바로 그 가정이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">consensus rarely comes</div><div class=\"k\">합의는 좀처럼 이루어지지 않는다</div></div><div class=\"rc\"><div class=\"e\">without some forms of subtle coercion</div><div class=\"k\">어떤 형태의 교묘한 강압 없이는</div></div><div class=\"rc\"><div class=\"e\">and the absence of fear</div><div class=\"k\">그리고 두려움이 없는 것이</div></div><div class=\"rc\"><div class=\"e\">in expressing a disagreement</div><div class=\"k\">이견을 표현하는 데</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is a source of genuine freedom.</span></div><div class=\"k\"><span class=\"cw\">진정한 자유의 원천이다.</span></div></div><div class=\"rnat\">사실, 합의는 어떤 형태의 교묘한 강압 없이는 좀처럼 이루어지지 않으며, 이견을 표현하는 데 두려움이 없는 것이 진정한 자유의 원천이다.</div><div class=\"rst\"><b>사실</b>(In fact) 다 같은 의견은 눈치 줘야 겨우 나와요. 겁 없이 반대 말하는 게 <b>진짜 자유</b>예요. 지문 6번의 반박이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Debates cause disagreements to evolve,</div><div class=\"k\">토론은 이견을 발전시키고,</div></div><div class=\"rc\"><div class=\"e\">often for the better,</div><div class=\"k\">흔히 더 나은 쪽으로,</div></div><div class=\"rc\"><div class=\"e\">but a positively evolving debate</div><div class=\"k\">하지만 긍정적으로 발전하는 토론이</div></div><div class=\"rc\"><div class=\"e\">does not have to equal</div><div class=\"k\">같아야 하는 것은 아니다</div></div><div class=\"rc\"><div class=\"e\">a reduction in disagreement.</div><div class=\"k\">이견의 감소와.</div></div><div class=\"rnat\">토론은 이견을 발전시키고 흔히 더 나은 쪽으로 발전시키지만, 긍정적으로 발전하는 토론이 이견의 감소와 같아야 하는 것은 아니다.</div><div class=\"rst\">토론하면 의견이 더 좋아져요. 그렇다고 반대 의견이 꼭 줄어야 하는 건 아니에요. = 지문 7번, 발전이 이견 감소와 같진 않대요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">The suppression of disagreement</div><div class=\"k\">이견의 억압이</div></div><div class=\"rc\"><div class=\"e\">should never be made into a goal</div><div class=\"k\">목표가 되어서는 결코 안 된다</div></div><div class=\"rc\"><div class=\"e\">in political deliberation.</div><div class=\"k\">정치적 숙의의.</div></div><div class=\"rnat\">이견의 억압이 정치적 숙의의 목표가 되어서는 결코 안 된다.</div><div class=\"rst\">그러니 반대 의견 누르기를 회의 목표로 삼으면 절대 안 돼요. 지문 8번, 이견의 억압은 목표가 되면 안 된대요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">A defense is required</div><div class=\"k\">방어가 필요하다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">against any suggestion</span></div><div class=\"k\"><span class=\"cw\">어떠한 주장에 대해서도</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that political disagreement is not the normal state of things.</span></div><div class=\"k\"><span class=\"cw\">정치적 이견이 정상적인 상태가 아니라는.</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rnat\">정치적 이견이 정상적인 상태가 아니라는 어떠한 주장에 대해서도 방어가 필요하다.</div><div class=\"rst\">“반대 의견은 <b>정상이 아니야</b>”라는 말에는 <b>맞서야</b>(against) 해요. 그래서 빈칸은 ②, 이견이 정상 상태가 아니라는 주장이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"suppress\" data-m=\"억압하다, 억누르다\"><b>suppress</b>억압하다, 억누르다</button><button type=\"button\" class=\"wdb\" data-w=\"disagreement\" data-m=\"불일치, 이견\"><b>disagreement</b>불일치, 이견</button><button type=\"button\" class=\"wdb\" data-w=\"assumption\" data-m=\"가정, 전제\"><b>assumption</b>가정, 전제</button><button type=\"button\" class=\"wdb\" data-w=\"consensus\" data-m=\"합의\"><b>consensus</b>합의</button><button type=\"button\" class=\"wdb\" data-w=\"coercion\" data-m=\"강압\"><b>coercion</b>강압</button><button type=\"button\" class=\"wdb\" data-w=\"deliberation\" data-m=\"숙의, 심의\"><b>deliberation</b>숙의, 심의</button></div>"};

 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" data-q="'+d.no+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
