<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}

 없애라!", "ok": false, "e": ["글은 모호함을 없애라고 하지 않습니다", "오히려 마지막 문장(7번)에서 언어의 고유한 모호함(inherent ambiguity)이 언어와 사고의 관계를 특별하게 만든다고 합니다."]}, {"n": "②", "t": "Not Creative but Simple: The Way Language Works", "g": "창의적이지 않고 단순하다: 언어가 작동하는 방식", "ok": false, "e": ["(3)에서 의사소통하는 행위는 항상 공동의 창의적인 노력(a joint, creative effort)이라고 했습니다", "'창의적이지 않다'는 본문과 반대입니다."]}, {"n": "③", "t": "Communication as a Universal Goal in Language Use", "g": "언어 사용에서 보편적인 목표로서의 의사소통", "ok": false, "e": ["의사소통이 언어 사용의 보편적인 목표라는 내용은 없습니다", "글은 청자나 독자가 자기 관점을 가져와 다르게 이해한다는 점을 강조합니다(4번)."]}, {"n": "④", "t": "What in Language Creates Varied Understanding?", "g": "언어에서 무엇이 다양한 이해를 만들어 내는가?", "ok": true, "e": ["(4)에서 청자나 독자가 자신의 관점을 가져와 의도 이상의 의미가 생긴다고 했습니다", "(7)에서는 언어의 고유한 모호함과 융통성이 언어와 사고의 관계를 특별하게 만든다고 합니다", "언어의 무엇이 다양한 이해를 만드는지 묻는 제목과 맞습니다."]}, {"n": "⑤", "t": "Language: A Crystal-Clear Looking Glass", "g": "언어: 아주 투명한 거울", "ok": false, "e": ["'아주 투명한 거울'은 그대로 정확하게 전달한다는 뜻입니다", "글은 오히려 언어가 정확한 의미를 전달하는 데 항상 신뢰할 만하지는 않다고 합니다(6번)", "왜곡이나 모호함 없는 전달은 (1)의 꿀벌 신호 체계에 대한 설명입니다."]}], "tr": ["어떠한 왜곡이나 모호함 없이 특정한 사실 정보를 전달하는 체계로서, 꿀벌의 신호 체계는 아마도 인간의 언어를 언제나 쉽게 이길 것이다(정보 전달의 측면에서는 꿀벌의 신호 체계가 더 낫다).", "하지만, (인간의) 언어는 단순한 정보 교환보다 더 가치 있는 무언가를 제공한다.", "단어의 의미가 변하지 않는 것이 아니고(의미가 변하고) 이해는 언제나 해석을 포함하기 때문에, 의사소통을 하는 행위는 항상 공동의 창의적인 노력이다.", "단어는 화자나 필자에 의해 의식적으로 의도된 것(화자나 필자가 의식적으로 의도한 것)들 이상의 의미를 전달할 수 있는데, 이는 청자나 독자가 그들이 접하는 언어에 자신의 관점을 가져오기 때문이다.", "부정확하게 표현된 생각들은 청자나 독자에게 단순한 사실보다 더 지적으로 자극적일 수도 있다.", "다른 누군가(청자나 독자)의 생각 속에 정확한 의미가 생겨나도록 하는 데 (있어서) 언어가 항상 신뢰할 만하지는 않다는 사실은, 새로운 이해를 만들어 내는 수단으로서 그것(언어)의 강력한 힘의 반영이다(언어는 그 의미를 청자나 독자가 각자 새롭게 이해하게 하는 강력한 힘이 있다).", "언어와 사고의 관계를 그렇게 특수하게 만드는 것은 의미를 만들어 내는 체계로서의 언어의 고유한 모호함과 융통성이다."], "ps": [{"n": 1, "ch": [{"e": "As a system", "k": "체계로서"}, {"e": "for transmitting specific factual information", "k": "특정한 사실 정보를 전달하는"}, {"e": "without any <b>distortion<\/b> or <b>ambiguity<\/b>,", "k": "어떠한 왜곡이나 모호함 없이,"}, {"e": "the sign system of honey-bees", "k": "꿀벌의 신호 체계는"}, {"e": "woul 찾는다.", "sub": ["S: The fact (그 사실)", "V: is (be ~이다)", "C: a reflection (반영)", "뼈대 = <b>The fact is a reflection</b>"]}, {"t": "<b>that language is not always reliable for ~ mind</b>는 <b>동격절(형용사절)</b>이다. The fact가 무슨 사실인지 설명한다 (~라는 사실). 이 that은 관계대명사가 아니고, 뒤가 완전한 문장이다.", "sub": ["S: language (언어), V: is (be), C: reliable (믿을 만한). not always = 늘 ~인 것은 아니다 (부분 부정)", "for causing precise meanings to be generated in someone else's mind = 전치사구(부사구). reliable을 꾸민다. for 뒤라서 causing은 동명사", "cause + O + to부정사: cause (~하게 하다), O: precise meanings (정확한 의미들), OC: to be generated (생성되다, 만들어지다)", "in someone else's mind (다른 사람의 마음속에)"]}, {"t": "<b>of its powerful strength</b>는 전치사구(형용사구)이다. reflection을 꾸민다 (언어의 강력한 힘의). its = language's."}, {"t": "<b>as a medium for creating new understanding</b>은 전치사구(형용사구)이다. strength를 꾸민다 (새로운 이해를 만들어 내는 수단으로서의).", "sub": ["medium (수단, 매체), for 뒤라서 creating은 동명사. understanding (이해)"]}, {"t": "함정: 주어와 동사가 멀다. The fact 다음 that절을 통째로 건너뛰고 is를 찾는다."}], "sum": "언어가 의미 전달에 늘 정확하지는 않다는 사실, 새 이해를 만드는 언어의 힘의 증거"}, {"i": "06", "q": "05", "s": "4", "title": "the next time 부사절 + or 병렬 절", "eng": "Then the next time we hear it, / we hear a lyric<sup>1</sup> we didn't catch<sup>2</sup> the first time, / or we might notice<sup>3</sup> / what the piano or drums are doing in the background<sup>4</sup>.", "notes": [["1", "lyric", "가사"], ["2", "catch", "알아차리다, 포착하다"], ["3", "notice", "알아차리다"], ["4", "background", "배경"]], "lit": "그러고 나서 다음에 우리가 그것을 들을 때, / 우리는 처음에 알아차리지 못했던 가사를 듣거나, / 혹은 알아차릴지도 모른다 / 피아노나 드럼이 배경에서 무엇을 하고 있는지를.", "nat": "그다음에 그 노래를 들을 때는 처음에 놓쳤던 가사가 들리기도 하고, 배경에서 피아노나 드럼이 무엇을 하고 있는지 알아차리기도 한다.", "ana": "<b>the next time</b>은 겉보기에 명사구지만 여기서는 '<b>다음에 ~할 때</b>'라는 <b>접속사</b>처럼 쓰여 뒤에 절을 그대로 데려온다. the first time, every time도 같은 방식이다. 두 번째 덩어리의 <b>a lyric we didn't catch</b>는 a lyric <b>which</b> we didn't catch에서 <b>목적격 관계대명사가 생략</b>된 형태다. '<b>명사 + 주어 + 동사</b>'가 붙어 있으면 관계대명사가 빠졌다고 보면 거의 맞는다. 마지막의 <b>what</b>은 선행사 없이 '<b>~하는 것</b>'을 만드는 관계대명사로, notice의 목적어 노릇을 한다.", "pe": "\u0001Then the next time we hear it\u0002, / we hear a lyric<sup>1</sup> \u0001we didn't catch<sup>2</sup> the first time\u0002, / or we might notice<sup>3</sup> / what the piano or drums are doing \u0001in the background<sup>4</sup>\u0002.", "pk": "\u0001그러고 나서 다음에 우리가 그것을 들을 때\u0002, / 우리는 \u0001처음에 알아차리지 못했던\u0002 가사를 듣거나, / 혹은 알아차릴지도 모른다 / 피아노나 드럼이 \u0001배경에서\u0002 무엇을 하고 있는지를.", "core": "우리는 가사를 듣거나, 피아노나 드럼이 무엇을 하고 있는지 알아차릴지도 모른다.", "tags": ["Then the next time ~ = 부사절(때): 뒤의 hear / notice를 꾸밈 (the next time이 접속사 역할)", "주어 we + 동사 hear + 목적어 a lyric. we didn't catch ~ = 관계절(형용사절, 목적격 생략): lyric을 꾸밈. the first time = 부사구(시간): catch를 꾸밈", "or: 병렬. 주어 we + 동사 might notice. 목적어는 다음 덩어리", "what ~ doing = 명사절(notice의 목적어) = 뼈대. in the background = 전치사구(부사구): doing 꾸밈"], "steps": [{"t": "이 문장은 <b>부사절 + S+V+O(3형식), or S+V+O(3형식)</b>이다. 앞의 the next time ~이 절처럼 쓰이는 것이 포인트이다."}, {"t": "<b>the next time we hear it</b>은 <b>부사절(때)</b>이다. the next time이 접속사처럼 쓰여 \"다음에 ~할 때\"이다.", "sub": ["S: we (우리), V: hear (듣다), O: it (그 노래. 앞 문맥에 나온 것)", "Then = 부사 (그러고 나서)"]}, {"t": "첫 번째 주절의 뼈대를 찾는다.", "sub": ["S: we, V: hear, O: a lyric (가사)", "뼈대 = <b>we hear a lyric</b>"]}, {"t": "<b>we didn't catch the first time</b>은 <b>관계절(형용사절)</b>이다. 목적격 관계대명사가 생략되어 a lyric을 꾸민다 (우리가 처음에 알아차리지 못했던).", "sub": ["catch (알아차리다, 알아듣다), the first time = 부사구 (처음에)"]}, {"t": "<b>or</b> 뒤 두 번째 주절의 뼈대를 찾는다.", "sub": ["S: we, V: might notice (notice 알아차리다. might ~할지도 모른다)", "O: what the piano or drums are doing in the background (피아노나 드럼이 배경에서 무엇을 하고 있는지). 명사절", "what은 doing의 목적어가 앞으로 나온 말이다. in the background = 배경에서"]}, {"t": "함정: the next time은 명사구처럼 보이지만 여기서는 <b>접속사 역할</b>을 한다. 또 or는 두 번째 절 전체를 잇는다."}], "sum": "다시 들으면 놓쳤던 가사나 배경 악기 소리가 들림"}, {"i": "07", "q": "06", "s": "1", "title": "관계부사 when절 + blame A on B + 대시 동격", "eng": "At a time / when concerns<sup>1</sup> about overpopulation<sup>2</sup> and famine<sup>3</sup> were reaching their highest peak, / Garrett Hardin did not blame<sup>4</sup> these problems on human ignorance<sup>5</sup> / — a failure to take note of dwindling<sup>6</sup> per capita food supplies, for example.", "notes": [["1", "concern", "우려, 걱정"], ["2", "overpopulation", "인구과잉"], ["3", "famine", "기근"], ["4", "blame A on B", "A를 B의 탓으로 돌리다"], ["5", "ignorance", "무지"], ["6", "dwindling", "줄어드는"]], "lit": "어떤 시기에 / 인구과잉과 기근에 대한 우려가 최고조에 달하고 있던, / Garrett Hardin은 이 문제들을 인간의 무지 탓으로 돌리지 않았다 / — 예를 들어 감소하는 1인당 식량 공급에 주목하지 못한 것 말이다.", "nat": "인구과잉과 기근에 대한 우려가 최고조에 달하던 시기에, Garrett Hardin은 이 문제들을 인간의 무지 — 예컨대 줄어드는 1인당 식량 공급을 알아차리지 못한 것 — 탓으로 돌리지 않았다.", "ana": "<b>At a time when ~</b>은 '<b>~하던 시기에</b>'라는 통짜 표현으로 외워 두면 편하다. when은 앞의 a time을 받는 <b>관계부사</b>라서 뒤에 완전한 문장이 온다. 주절의 동사는 <b>did not blame</b>이고, <b>blame A on B</b>는 'A를 B의 탓으로 돌리다'라는 짝이다. A와 B가 뒤바뀌지 않도록 주의한다. 마지막 대시(—) 뒤의 <b>a failure to take note of ~</b>는 바로 앞의 human ignorance를 <b>다시 풀어 설명하는 동격</b>이다. 대시가 나오면 '<b>즉, 다시 말해</b>'를 넣어 읽으면 된다.", "pe": "\u0001At a time\u0002 / \u0001when concerns<sup>1</sup> \u0001about overpopulation<sup>2</sup> and famine<sup>3</sup>\u0002 were reaching their highest peak\u0002, / Garrett Hardin did not blame<sup>4</sup> these problems \u0001on human ignorance<sup>5</sup>\u0002 / — \u0001a failure \u0001to take note of dwindling<sup>6</sup> per capita food supplies\u0002, \u0001for example\u0002\u0002.", "pk": "\u0001어떤 시기에\u0002 / \u0001\u0001인구과잉과 기근에 대한\u0002 우려가 최고조에 달하고 있던\u0002, / Garrett Hardin은 이 문제들을 \u0001인간의 무지 탓으로\u0002 돌리지 않았다 / — \u0001예를 들어 감소하는 1인당 식량 공급에 주목하지 못한 것 말이다\u0002.", "core": "Garrett Hardin은 이 문제들을 탓하지 않았다.", "tags": ["At a time = 전치사구(부사구): did not blame을 꾸밈 (때)", "when절 = 관계부사절(형용사절): time을 꾸밈. about overpopulation and famine = 전치사구(형용사구): concerns를 꾸밈", "주어 Hardin + 동사 did not blame + 목적어 problems. blame A on B (3형식): on human ignorance = 전치사구(부사구): blame 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "a failure ~ = 동격 명사구: human ignorance를 풀어 설명. to take note of ~ = to부정사(형용사적): failure를 꾸밈. for example = 삽입"], "steps": [{"t": " >To understand ~</b>는 '<b>~하기 위해서는</b>'이라는 <b>목적의 to부정사</b>다. 콤마 뒤에 주어 없이 동사원형 <b>bear</b>가 바로 나오는데, 이는 주어 you가 생략된 <b>명령문</b>이기 때문이다. <b>bear in mind that ~</b>은 '~을 명심하다'로, that절이 통째로 목적어다. <b>stand to gain</b>은 '이익을 얻게 될 처지에 있다'는 관용 표현이고, <b>the net contributions he or she makes</b>는 contributions <b>which</b> he or she makes에서 목적격 관계대명사가 생략된 형태다.", "pe": "\u0001To understand excessive<sup>1</sup> reproduction<sup>2</sup> \u0001as a tragedy of the commons<sup>3</sup>\u0002\u0002, / bear<sup>4</sup> \u0001in mind\u0002 / that a typical household stands to gain \u0001from bringing another child into the world\u0002 / — \u0001in terms of the net<sup>5</sup> contributions<sup>6</sup> he or she makes to household earnings, for example\u0002.", "pk": "\u0001과도한 번식을 \u0001공유 자원의 비극으로\u0002 이해하기 위해서는\u0002, / 명심하라 / 전형적인 가구가 \u0001아이를 하나 더 세상에 낳음으로써\u0002 이익을 얻게 된다는 것을 / — \u0001예를 들어 그 아이가 가구 소득에 기여하는 순수한 몫의 면에서 말이다\u0002.", "core": "전형적인 가구가 아이를 하나 더 낳음으로써 이익을 얻게 된다는 것을 명심하라.", "tags": ["To understand ~ = to부정사(부사적: 목적): bear 꾸밈. as a tragedy ~ = 전치사구(부사구): understand 꾸밈 (as B는 보어 아님)", "<b>bear in mind</b>: 명령문(You 생략) + 동사 bear. in mind = 전치사구(부사구): bear 꾸밈. 숙어 '명심하다' [기준: 모양 규칙]", "that절 = 명사절(bear의 목적어) = 뼈대. <b>stand to gain</b> = 이익을 얻게 되다. from bringing ~ = 전치사구(부사구): gain 꾸밈", "in terms of ~ = 전치사구(부사구): that절 안 stands to gain을 꾸밈. he or she makes ~ = 관계절: contributions를 꾸밈. for example = 삽입"], "steps": [{"t": "이 문장은 <b>to부정사 부사구 + 명령문(V+O)</b>이다. 맨 앞 to부정사와 뒤의 that절이 길어서 길어 보인다."}, {"t": "뼈대부터 찾는다. 명령문이라 주어(you)가 없다.", "sub": ["V: bear in mind (명심하다. 한 덩어리 숙어) (문형 기준)", "O: that절 (명사절. ~라는 것을)", "뼈대 = <b>bear in mind that ~</b>"]}, {"t": "<b>To understand excessive reproduction as a tragedy of the commons</b>는 <b>to부정사 부사적 용법(목적)</b>이다. bear를 꾸민다 (이해하기 위해서는).", "sub": ["understand A as B (A를 B로 이해하다). as B는 부사구로 본다", "excessive reproduction (과도한 번식), a tragedy of the commons (공유 자원의 비극). tragedy 비극"]}, {"t": "that절 안의 뼈대를 찾는다.", "sub": ["S: a typical household (전형적인 가구)", "V: stands to gain (stand to ~할 가능성이 있다, gain 이익을 얻다. 한 덩어리 표현)", "from bringing another child into the world = 전치사구(부사구). gain을 꾸민다 (아이를 하나 더 세상에 낳음으로써). bring A into the world (A를 낳다)"]}, {"t": "<b>in terms of the net contributions he or she makes to household earnings</b>는 전치사구(부사구)이다. stands to gain을 꾸민다 (순수한 기여분의 측면에서).", "sub": ["in terms of (~의 측면에서), net (순수한), contribution (기여)", "he or she makes to household earnings = 관계절 (목적격 생략). contributions를 꾸민다 (그 아이가 가구 소득에 보태는). he or she = another child (아이)"]}, {"t": "함정: for example은 삽입일 뿐이다. 대시 뒤는 새 문장이 아니라 stands to gain을 꾸미는 말이다."}], "sum": "과도한 번식을 공유 자원의 비극으로 보려면, 가구가 아이로 이익을 보는 점을 명심"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2017학년도 6월 18번", "ans": "②", "tr": [["1", "친애하는 Molly Oliver 씨께,"], ["2", "저는 청각을 이용한 개구리·두꺼비 조사의 자원봉사자 중 한 명인 Mark Foster입니다."], ["3", "안타깝게도 저는 지난 주말 오리엔테이션에 참가하지 못해서, 개구리와 두꺼비의 소리를 구별하는 교육을 받을 수 없었습니다."], ["4", "다른 참가자로부터 그 교육 시간에 CD가 사용되었다는 이야기를 들었습니다."], ["5", "혹시 저에게 그것을 한 장 보내 주실 수 있는지 궁금합니다."], ["6", "조사가 시작되기까지 열흘이 더 남아 있으므로, CD를 받아 스스로 훈련할 시간은 충분합니다."], ["7", "제 신청서에 적힌 주소로 보내 주시면 됩니다."], ["8", "곧 답장 주시기를 기다리겠습니다. 감사합니다."], ["9", "진심을 담아, Mark Foster 드림"]], "evh": "5번 문장", "ev": [{"en": true, "h": "I was wondering if you could send me one."}, {"en": false, "h": "목적 문항은 <b>편지를 쓴 사람이 상대에게 무엇을 원하는가</b> 한 줄만 잡으면 된다. 2~3번 문장은 <b>배경 설명</b>이다 — 오리엔테이션에 못 가서 교육을 못 받았다. 4번 문장에서 그 교육에 <b>CD</b>가 쓰였다는 정보를 얻고, 5번 문장에서 마침내 <b>I was wondering if you could send me one</b>이라는 <b>부탁</b>이 나온다. one은 a CD를 받는 대명사다. 그 뒤 6~7번 문장이 '받을 시간도 충분하고 주소는 신청서에 있다'며 부탁을 뒷받침한다. 따라서 목적은 <b>CD를 보내 줄 수 있는지 문의하는 것</b>이다."}], "opts": [{"n": "①", "t": "자원 봉사 참가를 취소하려고", "a": false, "x": true, "trap": false, "e": "참가를 취소하려는 사람이 '조사 시작까지 열흘 남았으니 훈련할 시간이 충분하다'고 쓸 리가 없다. 오히려 <b>참가할 준비</b>를 하고 있다."}, {"n": "②", "t": "CD를 보내 줄 수 있는지 문의하려고", "a": true, "x": false, "trap": false, "e": "5번 문장 <b>I was wondering if you could send me one</b>이 그대로 목적이다. <b>I was wondering if ~</b>는 공손한 부탁의 정형 표현이다."}, {"n": "③", "t": "신청서에 기입한 주소를 수정하려고", "a": false, "x": true, "trap": true, "e": "application(신청서)과 address(주소)가 7번 문장에 나오지만, 주소를 <b>고쳐 달라</b>는 것이 아니라 <b>거기로 보내 달라</b>는 뜻이다."}, {"n": "④", "t": "양서류 생태 조사 일정을 확인하려고", "a": false, "x": true, "trap": false, "e": "조사 시작까지 열흘 남았다는 사실을 <b>이미 알고</b> 쓰고 있다. 일정을 묻는 문장이 없다."}, {"n": "⑤", "t": "오리엔테이션에 참석할 수 없음을 알리려고", "a": false, "x": true, "trap": false, "e": "참석하지 못한 것은 <b>이미 지난 주말</b>의 일이고, 이는 부탁의 <b>이유</b>로 쓰인 배경이다. 통보가 목적이라면 뒤에 CD 이야기가 나올 이유가 없다."}], "w": [["volunteer", "자원봉사자"], ["auditory", "청각의, 소리를 이용한"], ["survey", "조사"], ["participate in", "~에 참가하다"], ["distinguish", "구별하다"], ["toad", "두꺼비"], ["participant", "참가자"], ["session", "(특정 활동을 위한) 시간"], ["wonder if", "~인지 궁금하다"], ["application", "신청서, 지원서"], ["look forward to", "~을 고대하다"], ["sincerely", "진심으로, 드림"]]}, {"q": "02", "type": "안내문 일치", "src": "2015학년도 9월 24번", "ans": "④", "tr": [["1", "스톤헨지 관광"], ["2", "스톤헨지의 거대하고 유서 깊은 환상 열석은 세계 최고의 불가사의 중 하나입니다."], ["3", "여러분이 고른 언어로 제공되는 흥미로운 오디오 안내 관광과 함께 그 돌들을 즐겨 보세요!"], ["4", "포함된 주요 내용: 고급 버스를 이용한 스톤헨지까지의 급행 운행 / 스톤헨지 안내서"], ["5", "가격 및 버스 출발: 성인 44파운드, 아동(3~12세) 39파운드, 노인(60세 이상)·학생 42파운드"], ["6", "운행 요일: 화요일, 목요일, 토요일"], ["7", "시간 및 장소: 오전 10시 Royal National 호텔, 오전 11시 Victoria 역"], ["8", "좌석을 확보하시려면 출발 최소 15분 전까지 도착하시거나 24시간 전에 온라인으로 예약해 주세요."]], "evh": "7번 문장", "ev": [{"en": true, "h": "Times &amp; Places: 10:00 a.m., Royal National Hotel / 11:00 a.m., Victoria Station"}, {"en": false, "h": "안내문 일치는 <b>선지 하나당 본문 한 줄</b>을 찍어서 대조하는 문항이다. 시간·장소 항목에는 <b>10:00 a.m.</b>과 <b>11:00 a.m.</b> 두 개만 적혀 있고, p.m.으로 표시된 출발 시각은 하나도 없다. 즉 버스는 <b>오전에만</b> 출발한다는 ④가 본문과 일치한다. 안내문 문항에서 시간·가격·요일 같은 <b>숫자 항목</b>은 반드시 표에서 직접 눈으로 확인해야 한다. 머릿속으로 '보통 오후에도 있겠지' 하고 넘겨짚는 순간 틀린다."}], "opts": [{"n": "①", "t": "audio guide는 영어로만 제공된다.", "a": false, "x": true, "trap": false, "e": "<b>in the language of your choice</b>(여러분이 고른 언어로)라고 했으므로 영어 전용이 아니다."}, {"n": "②", "t": "Stonehenge 안내서는 제공되지 않는다.", "a": false, "x": true, "trap": false, "e": "Included Highlights에 <b>Stonehenge Guidebook</b>이 분명히 들어 있다."}, {"n": "③", "t": "60세 이상의 노인들은 무료이다.", "a": false, "x": true, "trap": true, "e": "Seniors(60 and over)는 <b>£42.00</b>으로, 성인보다 쌀 뿐 무료가 아니다."}, {"n": "④", "t": "버스는 오전에만 출발한다.", "a": true, "x": false, "trap": false, "e": "Times &amp; Places에 적힌 출발 시각은 <b>10:00 a.m.</b>과 <b>11:00 a.m.</b>뿐이다."}, {"n": "⑤", "t": "좌석 확보는 온라인 예약으로만 가능하다.", "a": false, "x": true, "trap": false, "e": "<b>arrive at least 15 minutes prior to departure</b> <b>or</b> book online이라고 했다. or이므로 <b>둘 중 하나</b>면 된다."}], "w": [["ancient", "아주 오래된, 고대의"], ["wonder", "불가사의, 경이"], ["fascinating", "흥미로운, 환상적인"], ["of one's choice", "자기가 고른"], ["include", "포함하다"], ["express service", "급행 운행"], ["departure", "출발"], ["senior", "노인, 어르신"], ["secure", "확보하다"], ["prior to", "~ 전에"], ["book", "예약하다"], ["in advance", "미리, 사전에"]]}, {"q": "03", "type": "글의 요지", "src": "2022년 10월 22번", "ans": "①", "tr": [["1", "많은 이들이 우리가 끊임없이 점점 더 많이 배움으로써 인터넷이 주는 특권을 충분히 활용해야 한다고 말한다."], ["2", "그들은 한 사람이 얼마나 많은 정보를 소비해야 하는지에 한계를 두지 않으며, 사실을 우리 뇌에 꾸역꾸역 밀어 넣는 데 드는 감정적·심리적 비용은 결코 인정하지 않는다."], ["3", "우리가 이용 가능한 그 풍부한 데이터를 스스로를 더 생산적이고 사회에 더 쓸모 있게 만드는 데 쓰지 않는다면, 그것을 가지고 있은들 무슨 의미가 있는가?"], ["4", "정보에 접근할 수 있다는 것은 특권이지만, 동시에 부담이기도 하다."], ["5", "책을 많이 읽는 것을 벗어날 수 없는 의무로 여길 때 특히 그렇다."], ["6", "속상하게 하는 뉴스에 끊임없이 노출되는 것은 정신적 충격이 될 수 있다."], ["7", "끝없는 정보의 홍수는 배운 것을 잠시 멈춰 되돌아보기 어렵게 만든다."], ["8", "어느 시점에서는 아무리 열심인 독자라도 플러그를 뽑고, 끊임없이 떨어지는 사실과 수치, 무의미한 인터넷 싸움을 멈출 필요가 있다."], ["9", "우리는 정보 과부하의 시대에 살고 있으며 — 해결책은 더 많이 배우는 것이 아니라 한 걸음 물러서서 더 적은 양의 데이터를 더 의미 있게 소비하는 것이다."]], "evh": "9번 문장", "ev": [{"en": true, "h": "We're living in an era of information overload — and the solution is not to learn more but to step back and consume a smaller amount of data in a more meaningful way."}, {"en": false, "h": "요지 문항은 <b>필자의 결론 한 줄</b>을 찾는 것이다. 이 글은 1~2번 문장에서 '<b>더 많이 배우라</b>'는 통념을 먼저 소개한 뒤, 4번 문장의 <b>it's also a burden</b>에서 방향을 튼다. 6~8번 문장이 정보 과잉의 폐해를 나열하고, 마지막 9번 문장이 <b>not to learn more but to ~ consume a smaller amount of data in a more meaningful way</b>로 결론을 못박는다. <b>not A but B</b>가 나오면 필자의 주장은 언제나 <b>B</b>다. 즉 '양이 아니라 <b>의미 있는 사용</b>'이 요지다."}], "opts": [{"n": "①", "t": "정보 습득의 양보다 정보의 유의미한 사용이 더 중요하다.", "a": true, "x": false, "trap": false, "e": "마지막 문장의 not to learn more but to consume ~ in a <b>more meaningful way</b>를 그대로 옮긴 진술이다."}, {"n": "②", "t": "인터넷상의 정보를 비판적으로 바라보는 태도가 필요하다.", "a": false, "x": true, "trap": true, "e": "글이 문제 삼는 것은 정보의 <b>진위</b>가 아니라 <b>양</b>이다. critically(비판적으로)라는 관점은 본문에 없다."}, {"n": "③", "t": "인터넷 기술의 발전으로 인해 평생 학습이 실현되고 있다.", "a": false, "x": true, "trap": false, "e": "forever learning은 필자가 <b>비판하는 통념</b>으로 1번 문장에 인용된 것이지, 필자의 주장이 아니다."}, {"n": "④", "t": "인터넷을 통한 의사소통은 사회적 갈등을 유발할 수 있다.", "a": false, "x": true, "trap": false, "e": "Internet fights라는 표현이 8번 문장에 스치듯 나오지만, 갈등은 글의 <b>주제가 아니라 예시의 일부</b>다."}, {"n": "⑤", "t": "정보는 받아들이는 사람의 관점에 따라 달리 해석될 수 있다.", "a": false, "x": true, "trap": false, "e": "해석의 다양성은 이 글이 아니라 <b>04번 지문</b>의 이야기다. 두 지문을 섞어 읽으면 걸린다."}], "w": [["take advantage of", "~을 활용하다"], ["privilege", "특권, 혜택"], ["acknowledge", "인정하다"], ["cram", "밀어 넣다"], ["burden", "부담, 짐"], ["well-read", "박식한, 책을 많이 읽은"], ["obligation", "의무"], ["exposure", "노출"], ["traumatic", "정신적 충격을 주는"], ["voracious", "매우 열심인"], ["pull the plug", "플러그를 뽑다, 손을 떼다"], ["information overload", "정보 과부하"]]}, {"q": "04", "type": "글의 제목", "src": "2017학년도 수능 22번", "ans": "④", "tr": [["1", "어떠한 왜곡이나 모호함 없이 특정한 사실 정보를 전달하는 체계로서는, 꿀벌의 기호 체계가 아마 매번 인간의 언어를 쉽게 이길 것이다."], ["2", "그러나 언어는 단순한 정보 교환보다 더 가치 있는 무언가를 제공한다."], ["3", "단어의 의미가 변하지 않는 것이 아니고 이해에는 언제나 해석이 개입되기 때문에, 의사소통이라는 행위는 언제나 공동의 창의적인 노력이다."], ["4", "듣는 사람이나 읽는 사람이 자신이 접하는 언어에 자기만의 관점을 가져오기 때문에, 단어는 화자나 필자가 의식적으로 의도한 것을 넘어서는 의미를 지닐 수 있다."], ["5", "부정확하게 표현된 생각이 단순한 사실보다 청자나 독자에게 지적으로 더 자극적일 수 있다."], ["6", "언어가 다른 사람의 머릿속에 정확한 의미를 만들어 내는 데 늘 믿을 만하지는 않다는 사실은, 오히려 새로운 이해를 창조하는 수단으로서 언어가 지닌 강력한 힘을 보여 준다."], ["7", "언어와 사고의 관계를 그토록 특별하게 만드는 것은 바로 의미 생성 체계로서 언어가 지닌 고유한 모호함과 융통성이다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "It is the inherent ambiguity and adaptability of language as a meaning-making system that makes the relationship between language and thinking so special."}, {"en": false, "h": "제목 문항은 <b>글 전체를 한 구절로 압축</b>하는 것이다. 이 글의 뼈대는 '<b>언어는 정확하지 않다 → 그런데 그 부정확함이 오히려 강점이다</b>'이다. 1번 문장에서 정확성만 따지면 꿀벌이 이긴다고 인정한 뒤, 2번 문장의 <b>However</b>에서 뒤집는다. 3~5번 문장이 그 이유(해석·관점·자극)를 대고, 마지막 7번 문장이 <b>It is ~ that</b> 강조구문으로 <b>ambiguity and adaptability</b>를 핵심어로 못박는다. 결국 '언어의 무엇이 <b>다양한 이해</b>를 만드는가'가 제목이다."}], "opts": [{"n": "①", "t": "Erase Ambiguity in Language Production!", "a": false, "x": true, "trap": false, "e": "글은 모호함을 <b>없애라</b>가 아니라 <b>그것이 강점</b>이라고 말한다. 핵심어를 정반대로 뒤집은 선지다."}, {"n": "②", "t": "Not Creative but Simple: The Way Language Works", "a": false, "x": true, "trap": false, "e": "3번 문장이 의사소통을 <b>creative effort</b>라고 명시했다. creative를 부정하므로 본문과 충돌한다."}, {"n": "③", "t": "Communication as a Universal Goal in Language Use", "a": false, "x": true, "trap": false, "e": "universal(보편적인)이라는 관점은 본문에 없다. 오히려 글은 <b>사람마다 다른 해석</b>을 강조한다."}, {"n": "④", "t": "What in Language Creates Varied Understanding?", "a": true, "x": false, "trap": false, "e": "마지막 문장의 inherent ambiguity and adaptability가 varied understanding을 만든다는 구조를 그대로 옮긴 제목이다."}, {"n": "⑤", "t": "Language: A Crystal-Clear Looking Glass", "a": false, "x": true, "trap": true, "e": "'아주 투명한 거울'은 왜곡 없는 전달을 뜻하는데, 그것은 <b>꿀벌의 기호 체계</b>에 해당하는 설명이다."}], "w": [["transmit", "전달하다"], ["distortion", "왜곡, 곡해"], ["ambiguity", "모호함, 모호성"], ["mere", "단순한"], ["invariable", "변하지 않는, 불변의"], ["interpretation", "이해, 해석"], ["consciously", "의식적으로"], ["perspective", "관점, 시각"], ["imprecisely", "부정확하게"], ["reflection", "반영"], ["medium", "수단, 매체"], ["inherent", "고유한, 내재된"]]}, {"q": "05", "type": "어법", "src": "2020학년도 6월 29번", "ans": "⑤", "tr": [["1", "인간 심리의 흥미로운 일면은, 어떤 것에 관한 모든 것이 처음 경험할 때 분명하지 않으면 우리가 그것을 더 좋아하고 더 매력적이라고 느끼는 경향이 있다는 점이다."], ["2", "이는 음악에서 분명히 그러하다."], ["3", "예를 들어 우리는 라디오에서 어떤 노래를 처음 듣고 관심이 끌려 그 노래가 마음에 든다고 판단할 수 있다."], ["4", "     const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
