<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});

t <b>terrific at<\/b> planning and acting.", "k": "계획하고 실행하는 데는 아주 뛰어난."}], "link": "우리는 배우는 데는 그다지 능하지 않지만 계획하고 실행하는 데는 아주 뛰어난, 훨씬 덜 유연하지만 훨씬 더 효율적이고 유능한 어른으로 끝맺는다.", "easy": "그리고 덜 유연하지만 일은 훨씬 잘 해내는 어른이 돼요. 배우는 건 덜 잘해도 계획하고 실행하는 건 아주 잘해요.", "gist": "어른 = 실행의 달인 — 밑줄의 뜻을 확인해 줘요."}]}, {"no": "06", "typ": "빈칸 추론", "src": "2018학년도 6월 34번", "evn": [3, 4, 5], "ev_en": "As improbable as this may seem, the bodily fluids of aquatic animals show a strong similarity to oceans, and indeed, most studies of ion balance in freshwater physiology document the complex regulatory mechanisms by which fish, amphibians and invertebrates attempt to maintain an inner ocean in spite of surrounding fresh water. / It is these sorts of unexpected complexities and apparent contradictions that make ecology so interesting. / The idea of a fish in a freshwater lake struggling to accumulate salts inside its body to mimic the ocean reminds one of the other great contradiction of the biosphere: plants are bathed in an atmosphere composed of roughly three-quarters nitrogen, yet their growth is frequently restricted by lack of nitrogen.", "ev_ko": [[3, "이 말이 아무리 있을 법하지 않게 들려도, 수생 동물의 체액은 바다와 강한 유사성을 보이며, 실제로 민물 생리학에서 이온 균형을 다룬 대부분의 연구는 물고기와 양서류와 무척추동물이 주변이 민물인데도 몸 안의 바다를 유지하려고 애쓰는 복잡한 조절 기제를 기록하고 있다."], [4, "생태학을 그토록 흥미롭게 만드는 것은 바로 이런 종류의 뜻밖의 복잡성과 겉으로 드러나는 모순이다."], [5, "민물 호수의 물고기가 바다를 흉내 내려고 몸속에 염분을 모으느라 애쓴다는 발상은, 생물권의 또 다른 커다란 모순을 떠올리게 한다. 식물은 대략 4분의 3이 질소로 이루어진 대기에 잠겨 있는데도 그 성장은 흔히 질소 부족으로 제한된다는 것이다."]], "why": ["(1)은 민물 생물도 화학적 조성이 <b>민물보다 바다에 더 가깝다<\/b>고 합니다", "빈칸이 있는 (3)도 수생 동물의 체액이 <b>바다와 아주 비슷하다<\/b>고 말합니다", "(4)는 이런 <b>뜻밖의 복잡성과 겉으로 드러나는 모순<\/b>이 생태학을 흥미롭게 만든다고 합니다", "그 모순이 무엇인지는 (5)가 풀어 줍니다", "민물 호수의 물고기가 <b>바다를 흉내 내려고 몸속에 염분을 모은다<\/b>는 것입니다", "곧 주변은 민물인데 몸 안은 바다처럼 유지하려 한다는 뜻입니다", "따라서 빈칸에는 ① <b>maintain an inner ocean in spite of surrounding fresh water<\/b>가 알맞습니다."], "ch": [{"n": "①", "t": "maintain an inner ocean in spite of surrounding fresh water", "g": "주변이 민물인데도 몸 안의 바다를 유지하려고", "ok" const $=s=>document.querySelector(s);
const app=$('#app');
let view='home',quiz=null,armed=null;
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';
  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){

  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

 other interested parties (언론이나 다른 이해 당사자들에 의해)는 행위자"]}], "sum": "선수를 친다 = 위기가 들통나기 전에 조직이 먼저 알림"}, {"i": "04", "q": "03", "s": "7", "title": "동명사 주어 + 삽입 전치사구 + result in", "eng": "In experimental<sup>1</sup> research by Arpan and Roskos-Ewoldsen, / stealing thunder in a crisis situation, / as opposed to<sup>2</sup> allowing the information to be first disclosed<sup>3</sup> by another party, / resulted in substantially<sup>4</sup> higher credibility<sup>5</sup> ratings.", "notes": [["1", "experimental", "실험의"], ["2", "as opposed to", "~와는 반대로"], ["3", "disclose", "공개하다, 밝히다"], ["4", "substantially", "상당히"], ["5", "credibility", "신뢰도, 신빙성"]], "lit": "Arpan과 Roskos-Ewoldsen의 실험 연구에서, / 위기 상황에서 선수를 치는 것은, / 그 정보가 다른 쪽에 의해 먼저 공개되도록 놓아두는 것과는 반대로, / 상당히 더 높은 신뢰도 평가라는 결과를 낳았다.", "nat": "Arpan과 Roskos-Ewoldsen의 실험 연구에서, 위기 상황에서 선수를 치는 것은 그 정보가 다른 쪽에 의해 먼저 공개되도록 두는 것에 비해 신뢰도 평가를 상당히 더 높이는 결과를 낳았다.", "ana": "문장이 길어 보이지만 뼈대는 <b>주어 + 동사 + 목적어</b> 하나다. 주어는 <b>stealing thunder</b>라는 <b>동명사구</b>이고 동사는 <b>resulted in</b>이다. 콤마 두 개 사이의 <b>as opposed to ~</b>는 통째로 <b>삽입</b>이므로 <b>먼저 지우고</b> 읽어야 뼈대가 보인다. 지우면 <b>Stealing thunder resulted in higher ratings</b>가 남는다. 삽입구 안도 볼 것이 많다. <b>as opposed to</b>의 <b>to</b>는 전치사라서 뒤에 <b>동명사 allowing</b>이 왔고, <b>allow + 목적어 + to V</b>에서 <b>정보가 공개되는</b> 쪽이므로 to부정사가 <b>to be disclosed</b>라는 <b>수동</b>이 되었다. <b>result in</b>은 '<b>~라는 결과를 낳다</b>', <b>result from</b>은 '<b>~에서 비롯되다</b>'로 방향이 정반대라는 점도 함께 정리하자.", "pe": "\u0001In experimental<sup>1</sup> research \u0001by Arpan and Roskos-Ewoldsen\u0002\u0002, / stealing thunder \u0001in a crisis situation\u0002, / \u0001as opposed to<sup>2</sup> allowing the information to be first disclosed<sup>3</sup> by another party\u0002, / resulted \u0001in substantially<sup>4</sup> higher credibility<sup>5</sup> ratings\u0002.", "pk": "\u0001Arpan과 Roskos-Ewoldsen의 실험 연구에서\u0002, / \u0001위기 상황에서\u0002 선수를 치는 것은, / \u0001그 정보가 다른 쪽에 의해 먼저 공개되도록 놓아두는 것과는 반대로\u0002, / \u0001상당히 더 높은 신뢰도 평가라는\u0002 결과를 낳았다.", "core": "선수를 치는 것은 결과를 낳았다.", "tags": ["In experimental research ~ = 전치사구(부사구): resulted in 꾸밈 (범위). by Arpan ~ = 형용사구: research 꾸밈", "<b>동명사구 주어</b> stealing thunder. in a crisis situation = 부사구: stealing 꾸밈", "as opposed to ~ = 삽입 전치사구(부사구): ~와는 반대로. allowing + 목적어 + to be disclosed (수동 부정사)", "동사 resulted: 1형식. (in … ratings) = 전치사구(부사구): resulted를 꾸밈, 거의 필수에 가까운 부사구(result in = ~라는 결과를 낳다) [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>동명사구가 주어</b>인 S+V(1형식) 문장이다. 주어 뒤에 삽입이 길게 끼어 동사가 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: stealing thunder in a crisis situation (위기 상황에서 선수를 치는 것). stealing은 동명사", "V: resulted (result 결과로 나타나다의 과거형) → 1형식", "in substantially higher credibility ratings (상당히 더 높은 신뢰도 평가라는 결과를)는 resulted와 짝인 전치사구. result in = ~라는 결과를 낳다. 거의 필수에 가까운 부사구라 1형식 + 수식어로 본다.", "뼈대 = <b>stealing thunder resulted</b> (+ in ratings)"]}, {"t": "맨 앞 <b>In experimental research by Arpan and Roskos-Ewoldsen</b>은 전치사구(부사구)이다. '~의 실험 연구에서'.", "sub": ["by Arpan and Roskos-Ewoldsen은 research를 꾸미는 전치사구"]}, {"t": "콤마 사이의 <b>as opposed to allowing the information to be first disclosed by another party</b>는 '~와는 반대로'라는 <b>삽입 전치사구</b>이다.", "sub": ["to 뒤 allowing은 동명사. allow A to V = A가 ~하도록 두다", "A = the information (그 정보), to be disclosed (공개되다. 수동 부정사), first (먼저), by another party (다른 쪽에 의해)"]}, {"t": "콤마 두 개를 지우고 읽으면 주어와 동사가 바로 이어진다."}], "sum": "선수 치기는 다른 쪽이 먼저 공개하는 경우보다 신뢰도 평가가 훨씬 높음"}, {"i": "05", "q": "04", "s": "2", "title": "긴 주어(관계절) + S+V+O(동명사 병렬) + 이유절", "eng": "One wise friend of ours / who was a parent educator<sup>1</sup> for twenty years / advises giving calendars to preschool-age<sup>2</sup> children / and writing down<sup>3</sup> all the important events in their life, / in part<sup>4</sup> because it helps children understand the passage of time<sup>5</sup> better, / and how their days will unfold<sup>6</sup>.", "notes": [["1", "parent educator", "부모 교육자"], ["2", "preschool-age", "미취학 연령의"], ["3", "write down", "적어 두다"], ["4", "in part", "어느 정도는, 부분적으로"], ["5", "passage of time", "시간의 흐름"], ["6", "unfold", "펼쳐지다, 전개되다"]], "lit": "우리의 어느 현명한 친구는 / 20년 동안 부모 교육자로 일했던 / 미취학 아동에게 달력을 주라고 조언한다 / 그리고 그들의 삶에서 중요한 일들을 모두 적어 두라고, / 어느 정도는 그것이 아이들로 하여금 시간의 흐름을 더 잘 이해하도록 돕기 때문에, / 그리고 자기 하루가 어떻게 펼쳐질지도 이해하도록.", "nat": "부모 교육자로 20년을 일한 우리의 현명한 친구 한 명은 미취학 아동에게 달력을 주고 그 아이들의 삶에서 중요한 일들을 모두 적어 두라고 조언하는데, 그렇게 하면 아이들이 시간의 흐름과 자기 하루가 어떻게 펼쳐질지를 더 잘 이해하는 데 도움이 되기 때문이기도 하다.", "ana": "주어는 <b>One wise friend</b> 하나뿐이고, 그 뒤의 <b>who ~ twenty years</b>는 주어를 꾸미는 <b>주격 관계대명사절</b>이다. 관계사절이 끝나는 지점을 못 찾으면 <b>advises</b>를 동사로 잡지 못한다. <b>friend</b>가 단수라 <b>advises</b>에 <b>-s</b>가 붙은 것도 확인해 두자. 다음은 <b>and</b>가 무엇을 잇는지다. <b>advise</b>는 <b>동명사</b>를 목적어로 받는 동사라서 <b>advises giving ~ and writing ~</b>으로 <b>동명사 두 개가 병렬</b>되었다. <b>and writing</b>을 <b>and write</b>로 바꾸면 틀린다. 마지막의 <b>help + 목적어 + (to) 동사원형</b>도 놓치기 쉽다. <b>help</b>는 목적격보어로 <b>원형부정사</b>를 쓸 수 있어서 <b>helps children understand</b>가 맞다. 문장 끝의 <b>and how their days will unfold</b>는 <b>understand</b>의 두 번째 목적어로 이어지는 <b>간접의문문</b>이다.", "pe": "One \u0001wise\u0002 friend \u0001of ours\u0002 / \u0001who was a parent educator<sup>1</sup> for twenty years\u0002 / advises giving calendars \u0001to preschool-age<sup>2</sup> children\u0002 / and writing down<sup>3</sup> all the \u0001important\u0002 events \u0001in their life\u0002, / \u0001in part<sup>4</sup> because it helps children understand the passage of time<sup>5</sup> better\u0002, / \u0001and how their days will unfold<sup>6</sup>\u0002.", "pk": "\u0001우리의\u0002 어느 \u0001현명한\u0002 친구는 / \u000120년 동안 부모 교육자로 일했던\u0002 / \u0001미취학 아동에게\u0002 달력을 주라고 조언한다 / 그리고 \u0001그들의 삶에서\u0002 \u0001중요한\u0002 일들을 모두 적어 두라고, / \u0001어느 정도는 그것이 아이들로 하여금 시간의 흐름을 더 잘 이해하도록 돕기 때문에\u0002, / 그리고 \u0001자기 하루가 어떻게 펼쳐질지도 이해하도록\u0002.", "core": "친구는 달력을 주고 중요한 일들을 적어 두라고 조언한다.", "tags": ["주어 One friend. wise = 형용사: friend 꾸밈. of ours = 전치사구(형용사구): friend 꾸밈. 동사가 나올 때까지 기다림", "who ~ = 주격 관계절(형용사절): friend 꾸밈. for twenty years = 부사구: was 꾸밈", "동사 advises, 목적어 <b>동명사</b> giving ①: giving 의존적인 아기로 시작한다, / 모든 것을 배우는 데는 뛰어나지만 / 정작 무엇이든 해내는 데는 형편없는.", "nat": "우리는 눈부시게 유연하지만 무력하고 의존적인 아기로 출발한다. 무엇이든 배우는 데는 뛰어나지만 정작 무언가를 해내는 데는 형편없는 아기로 말이다.", "ana": "콤마 뒤의 <b>great at ~ but terrible at ~</b>은 새로운 문장이 아니다. 앞의 <b>babies</b>를 뒤에서 꾸미는 <b>형용사구</b> 두 개가 <b>but</b>으로 병렬된 것이며, 사이에 <b>which are</b>가 생략되었다고 보면 이해가 쉽다. 형용사가 <b>수식어를 달고 길어지면 명사 뒤로 간다</b>는 원칙이 그대로 적용된 자리다. <b>as</b>는 '<b>~로서</b>'라는 <b>자격</b>의 전치사이고, <b>at</b>은 전치사라서 뒤에 <b>동명사 learning · doing</b>이 왔다. <b>just about</b>은 '거의'라는 뜻으로 <b>anything</b>을 강조한다. 문장 전체는 <b>배우기는 잘하는데 해내지는 못한다</b>는 대조 하나로 굴러간다.", "pe": "We start out<sup>1</sup> \u0001as \u0001brilliantly<sup>2</sup> flexible but helpless<sup>3</sup> and dependent<sup>4</sup>\u0002 babies\u0002, / \u0001great at learning everything\u0002 / \u0001but terrible at doing just about<sup>5</sup> anything\u0002.", "pk": "우리는 \u0001\u0001눈부시게 유연하지만 무력하고 의존적인\u0002 아기로\u0002 시작한다, / \u0001모든 것을 배우는 데는 뛰어나지만\u0002 / \u0001정작 무엇이든 해내는 데는 형편없는\u0002.", "core": "우리는 아기로 시작한다.", "tags": ["주어 We, 동사 start out(시작하다). as ~ babies = 전치사구(부사구): start out 꾸밈, <b>거의 필수에 가까운 부사구</b> [기준: 모양 규칙]. 형용사들은 babies 꾸밈", "great at learning everything = 형용사구(후치수식): babies 꾸밈 (~에 뛰어난)", "but: 대조. terrible at doing ~ = 형용사구(후치수식): babies 꾸밈. just about = 부사구: anything 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 뼈대는 짧고 babies 뒤에 형용사구가 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: We (우리)", "V: start out (시작하다. 구동사라 한 덩어리 동사) → 1형식", "as ~ babies (~ 아기로서)는 start out as의 짝이라 거의 필수에 가까운 부사구이다. 1형식 + 수식어로 본다.", "뼈대 = <b>We start out</b> (+ as babies)"]}, {"t": "babies를 앞에서 꾸미는 형용사들을 본다.", "sub": ["brilliantly flexible (눈부시게 유연한). brilliantly (눈부시게)는 flexible을 꾸미는 부사", "but helpless (무력한) and dependent (의존적인)"]}, {"t": "babies 뒤에는 <b>형용사구 2개가 후치 수식</b>으로 붙는다.", "sub": ["great at learning everything (모든 것을 배우는 데 뛰어난)", "but terrible at doing just about anything (거의 무엇이든 해내는 데는 형편없는). just about (거의)은 anything을 꾸미는 부사구"]}], "sum": "우리는 배우는 데는 뛰어나지만 해내는 건 서툰 아기로 출발"}, {"i": "07", "q": "06", "s": "2", "title": "It appears that절 + 동사 병렬 + 완료 분사구문", "eng": "It appears / that most freshwater<sup>1</sup> life did not originate<sup>2</sup> in fresh water, / but is secondarily<sup>3</sup> adapted<sup>4</sup>, / having passed<sup>5</sup> from ocean to land / and then back again to fresh water.", "notes": [["1", "freshwater", "민물의, 담수의"], ["2", "originate", "생겨나다, 기원하다"], ["3", "secondarily", "2차적으로"], ["4", "adapt", "적응하다, 적응시키다"], ["5", "pass", "건너가다, 지나가다"]], "lit": "~인 것으로 보인다 / 대부분의 민물 생물은 민물에서 생겨난 것이 아니라, / 2차적으로 적응한 것이라고, / 바다에서 육지로 건너갔다가 / 그러고 나서 다시 민물로 돌아오면서.", "nat": "대부분의 민물 생물은 민물에서 처음 생겨난 것이 아니라, 바다에서 육지로 갔다가 다시 민물로 돌아오는 과정을 거치며 2차적으로 적응한 것으로 보인다.", "ana": "맨 앞의 <b>It</b>은 '그것'이 아니라 뒤의 <b>that</b>절을 대신 받는 <b>가주어</b>다. <b>It appears that ~</b>은 '<b>~인 것처럼 보인다</b>'로, <b>주어 + seem to V</b>로 바꿔 쓸 수 있다. <b>that</b>절 안에서는 <b>not A but B</b>가 뼈대다. <b>did not originate</b>와 <b>is ~ adapted</b>가 <b>but</b>으로 이어져 있는데, 시제가 <b>과거 → 현재</b>로 달라진 것은 <b>기원은 과거의 일, 적응한 상태는 지금</b>이기 때문이다. 마지막의 <b>having passed</b>가 이 문장의 진짜 관문이다. 이미 <b>is</b>라는 동사가 있으므로 또 다른 동사가 될 수 없고, <b>접속사 없이 문장을 이어 주는 분사구문</b>이다. <b>having p.p.</b> 형태인 이유는 <b>바다에서 건너온 일이 지금 적응해 있는 것보다 먼저</b>이기 때문이다.", "pe": "It appears / that most freshwater<sup>1</sup> life did not originate<sup>2</sup> \u0001in fresh water\u0002, / but is \u0001secondarily<sup>3</sup>\u0002 adapted<sup>4</sup>, / \u0001having passed<sup>5</sup> from ocean to land\u0002 / \u0001and then back again to fresh water\u0002.", "pk": "~인 것으로 보인다 / 대부분의 민물 생물은 \u0001민물에서\u0002 생겨난 것이 아니라, / \u00012차적으로\u0002 적응한 것이라고, / \u0001바다에서 육지로 건너갔다가\u0002 / \u0001그러고 나서 다시 민물로 돌아오면서\u0002.", "core": "대부분의 민물 생물은 생겨난 것이 아니라 적응한 것인 듯하다.", "tags": ["<b>가주어 It</b>, 동사 appears. 진주어 that절을 기다림", "<b>진주어 that절</b>(뼈대): 주어 most freshwater life, 동사 did not originate. in fresh water = 전치사구(부사구): originate 꾸밈 [기준: 모양 규칙]", "but: 병렬. 동사 is adapted(수동태). secondarily = 부사: adapted 꾸밈 (2차적으로)", "having passed ~ = <b>완료 분사구문</b>(부사적: 부연): is adapted 꾸밈. from ocean to land = 부사구: passed 꾸밈", "and then ~ = passed의 이동 경로가 이어짐: 바다에서 육지로, 다시 민물로. then·back again = 부사"], "steps": [{"t": "이 문장은 <b>It appears that ~</b> 구조다. '~인 것으로 보인다'. that절 안에 not A but B 병렬과 분사구문이 있어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["It (가주어) + appears (appear ~인 듯하다, 1형식). 진짜 주어는 뒤의 that절 (문형 기준) It appears that ~은 it을 가주어, that절을 진주어로 보아 1형식으로 판단한다.", "뼈대 = <b>It appears that ~</b>"]}, {"t": "that절 안의 뼈대를 찾는다.", "sub": ["S: most freshwater life (대부분의 민물 생물)", "V1: did not originate (originate 생겨나다의 과거 부정) → 1형식. in fresh water (민물에서)", "V2: is adapted (adapt 적응하다의 수동태, 적응한 것이다) → 1형식. secondarily (2차적으로)는 부사", "두 동사는 <b>not A but B</b> 식으로 but으로 병렬된다."]}, {"t": "끝의 <b>having passed from ocean to land and then back again to fresh water</b>는 <b>완료 분사구문(부사 덩어리)</b>이다. 의미상 주어는 most freshwater life이다.", "sub": ["pass (건너가다)의 완료형. from ocean to land (바다에서 육지로) and then back again to fresh water (그러고 나서 다시 민물로)", "부연 설명으로 '~하면서/~하고서'라고 읽는다."]}], "sum": "민물 생물은 민물 기원이 아니라 바다-육지-민물 경로로 2차 적응"}], "qs": [{"q": "01", "type": "필자의 주장", "src": "2019학년도 수능 20번", "ans": "①", "tr": [["1", "적에 대한 어떤 이미지나 개념 없이는 전쟁을 생각조차 할 수 없다."], ["2", "전쟁에 의미와 정당성을 부여하는 것은 다름 아닌 적의 존재이다."], ["3", "'전쟁은 증오의 감정에서 비롯된다'라고 Carl Schmitt는 썼다."], ["4", "'전쟁에는 나름의 전략적·전술적 규칙과 그 밖의 규칙과 관점이 있지만, 그것들은 모두 누가 적인지에 관한 정치적 결정이 이미 내려져 있음을 전제로 한다.'"], ["5", "적이라는 개념은 전쟁에 대한 도덕적 평가에 근본이 된다. '적의 이미지를 만드는 데 있어 전쟁 중인 국가의 기본 목표는 살해 행위를 살인 행위와 가능한 한 뚜렷하게 구별해 내는 것이다.'"], ["6", "그러나 우리는 전쟁을, 그리고 그 전쟁의 성격을 규정하는 적의 이미지를 추상적이고 획일적인 방식으로 생각하는 데 조심스러워야 한다."], ["7", "오히려 그 둘은 모두 그것들이 실제로 그러한 바, 곧 문화적이고 상황에 따라 달라지는 현상으로 보아야 한다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "However, we need to be cautious about thinking of war and the image of the enemy that informs it in an abstract and uniform way."}, {"en": false, "h": "주장 문항은 <b>However · Rather · But</b> 같은 <b>방향을 꺾는 말</b> 뒤를 보면 거의 끝난다. 1~5번은 <b>적의 개념이 전쟁에 얼마나 중요한가</b>를 인용까지 끌어와 길게 설명하는 <b>도입</b>이다. 글쓴이의 목소리는 6번의 <b>However</b>에서 처음 나온다. 핵심어는 <b>be cautious about</b>(조심해야 한다)과 <b>in an abstract and uniform way</b>(추상적이고 획일적인 방식으로) 둘이다. 이 둘이 ①의 <b>추상적이고 획일적으로 개념화하는 것을 경계해야 한다</b>와 그대로 겹친다. 이어지는 7번이 <b>Rather, both must be seen for the cultural and contingent phenomena that they are</b>로 <b>문화적이고 상황에 따라 다른 것으로 보라</b>고 대안까지 제시하므로, 6번이 주장이라는 것이 한 번 더 확인된다."}], "opts": [{"n": "①", "t": "전쟁과 적을 추상적이고 획일적으로 개념화하는 것을 경계해야 한다.", "a": true, "x": false, "trap": false, "e": "6번의 <b>cautious about thinking ~ in an abstract and uniform way</b>가 그대로 대응하고, 7번의 <b>Rather</b> 이하가 그 대안을 제시한다."}, {"n": "②", "t": "적에 따라 다양한 전략과 전술을 수립하고 적용해야 한다.", "a": false, "x": true, "trap": false, "e": "4번 인용문의 <b>strategic, tactical</b>이라는 단어만 빌려 온 선지다. 그 인용문은 <b>전략보다 적의 규정이 먼저</b>라는 말이지, 전략을 다양화하라는 말이 아니다."}, {"n": "③", "t": "보편적 윤리관에 기초하여 적의 개념을 정의해야 한다.", "a": false, "x": true, "trap": true, "e": "5번에 <b>moral assessment</b>(도덕적 평가)가 나와서 끌리지만, 글은 <b>보편적 윤리</b>를 세우자고 하지 않는다. 오히려 7번은 <b>문화적이고 상황에 따라 달라지는</b> 것으로 보라고 하여 <b>보편</b>과 정반대 방향을 가리킨다."}, {"n": "④", "t": "전쟁 예방에 도움이 되는 정치적 결정을 해야 한다.", "a": false, "x": true, "trap": false, "e": "4번에 <b>political decision</b>이 나오지만, 그것은 <b>누가 적인지를 정하는</b> 결정이지 <b>전쟁 예방</b>을 위한 결정이 아니다. 지문에 <b>예방</b>이라는 개념 자체가 없다."}, {"n": "⑤", "t": "어떠한 경우에도 전쟁을 정당화하지 말아야 한다.", "a": false, "x": true, "trap": false, "e": "2번의 <b>justification</b>(정당성)을 <b>정당화하지 말라</b>는 당위로 뒤집어 읽은 함정이다. 2번은 <b>적의 존재가 전쟁을 정당화한다</b>는 사실 서술일 뿐 글쓴이의 요구가 아니다."}], "w": [["inconceivable", "상상할 수 없는"], ["concept", "개념"], ["presence", "존재"], ["justification", "정당화, 정당성"], ["follow from", "~에서 비롯되다"], ["hatred", "증오"], ["strategic", "전략적인"], ["tactical", "전술적인"], ["point of view", "관점"], ["presuppose", "전제로 하다"], ["as to", "~에 관하여"], ["fundamental", "근본적인"], ["moral assessment", "도덕적 평가"], ["aim", "목표"], ["establish", "확립하다, 만들어 내다"], ["distinguish A from B", "A를 B와 구별하다"], ["as sharply as possible", "가능한 한 날카롭게"], ["murder", "살인"], ["cautious", "조심스러운, 신중한"], ["inform", "성격을 규정하다, 스며들다"], ["abstract", "추상적인"], ["uniform", "획일적인"], ["contingent", "상황에 따라 달라지는, 불확정적인"], ["phenomenon", "현상"]]}, {"q": "02", "type": "도표 불일치", "src": "2018학년도 수능 24번", "ans": "④", "tr": [["1", "위 도표는 2010년과 2015년 영국에서 판매된 네 가지 유형의 윤리적 농산물 판매액을 보여 준다."], ["2", "① 2015년에 네 가지 윤리적 농산물 각각의 판매액은 2010년 같은 유형의 판매액보다 증가한 모습을 보였다."], ["3", "② 네 가지 유형 가운데 Organic의 판매액은 2010년에 가장 높았지만 2015년에는 두 번째로 높았다."], ["4", "③ 네 가지 유형 가운데 Rainforest Alliance는 2010년에 두 번째로 높은 판매액을 기록했고 2015년에는 가장 높은 판매액을 기록했다."], ["5", "④ 2015년 Fairtrade의 판매액은 2010년의 두 배만큼 높았다."], ["6", "⑤ 2010년과 2015년 모두 Vegetarian meat alternatives의 판매액은 네 가지 유형 가운데 가장 낮았다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "The sales of Fairtrade in 2015 were twice as high as those in 2010."}, {"en": false, "h": "도표 문항은 <b>숫자를 눈으로 세는 것</b>이 아니라 <b>배수·증감·순위</b>라는 세 가지 표현을 정확히 읽는 것이 전부다. 이 문항의 함정은 <b>배수</b>다. Fairtrade는 2010년 <b>1,064</b>, 2015년 <b>1,572</b>이다. 두 배라면 <b>2,128</b>이 되어야 하는데 실제로는 <b>1.5배</b>에도 못 미친다. 따라서 ④가 도표와 다르다. <b>twice as high as</b>는 '<b>~의 두 배만큼 높은</b>'이라는 뜻이고, 뒤의 <b>those</b>는 앞의 <b>the sales</b>를 대신 받는 <b>대명사</b>다. 도표 문제에서 <b>twice · three times · half</b> 같은 배수 표현이 보이면 <b>그 선지부터</b> 계산해 보는 것이 가장 빠른 길이다."}], "opts": [{"n": "①", "t": "2015년에 네 가지 각각의 판매액이 2010년보다 증가했다.", "a": false, "x": true, "trap": false, "e": "Organic 1,475→1,744, Rainforest Alliance 1,197→2,048, Fairtrade 1,064→1,572, Vegetarian meat alternatives 541→710으로 네 가지 모두 늘었다. 도표와 일치한다."}, {"n": "②", "t": "Organic은 2010년 1위, 2015년 2위였다.", "a": false, "x": true, "trap": false, "e": "2010년에는 1,475로 가장 높고, 2015년에는 1,744로 2,048의 Rainforest Alliance에 이어 두 번째다. 도표와 일치한다."}, {"n": "③", "t": "Rainforest Alliance는 2010년 2위, 2015년 1위였다.", "a": false, "x": true, "trap": false, "e": "2010년 1,197로 두 번째, 2015년 2,048로 첫 번째다. ②와 정확히 짝을 이루는 서술이라 함께 확인하면 빠르다."}, {"n": "④", "t": "2015년 Fairtrade 판매액은 2010년의 두 배였다.", "a": true, "x": false, "trap": false, "e": "1,064의 두 배는 2,128인데 2015년 값은 1,572다. <b>1.5배에도 못 미치므로</b> 도표와 다르다."}, {"n": "⑤", "t": "두 해 모두 Vegetarian meat alternatives가 가장 낮았다.", "a": false, "x": true, "trap": true, "e": "2010년 541, 2015년 710으로 두 해 모두 네 가지 가운데 가장 낮다. <b>수치가 늘었다</b>는 사실과 <b>순위가 가장 낮다</b>는 사실을 헷갈리면 틀린 선지로 보이기 쉽다."}], "w": [["ethical", "윤리적인"], ["produce", "농산물"], ["sales", "판매액, 매출"], ["show an increase", "증가를 보이다"], ["corresponding", "대응하는, 상응하는"], ["rank", "순위를 차지하다"], ["the second highest", "두 번째로 높은"], ["record", "기록하다"], ["twice as high as", "~의 두 배만큼 높은"], ["alternative", "대체(품), 대안"], ["organic", "유기농의"], ["vegetarian", "채식의"]]}, {"q": "03", "type": "글의 주제", "src": "2018학년도 6월 22번", "ans": "②", "tr": [["1", "공격하고 비판하고 비난하는 데 쓸 공격의 자리를 그럴 사람들에게 넘겨주는 것은 전략적으로도 전술적으로도 실수다."], ["2", "어차피 반대자들은 틀림없이 공격하고 비판하고 비난할 것이므로, 선제적으로 움직이고 자기 '치부'를 스스로 드러내며 '자기 이야기를 자기가 먼저 하는' 데서 오는 이점은 너무 커서 무시할 수 없다."], ["3", "이 이점들 가운데 으뜸은 최초의 메시지와, 이야기가 처음에 어떤 틀로 짜이는지를 통제할 수 있다는 점이다."], ["4", "그렇게 하면 반대로 남들이 나에게 대응해야 하는 처지가 된다."], ["5", "이 접근법에는 '선수 치기(stealing thunder)'라는 이름이 딱 들어맞는다."], ["6", "어떤 조직이 선수를 친다는 것은, 자기 위기가 언론이나 다른 이해 당사자들에게 발각되기 전에 그 소식을 스스로 먼저 알린다는 뜻이다."], ["7", "Arpan과 Roskos-Ewoldsen의 실험 연구에서, 위기 상황에서 선수를 치는 것은 그 정보가 다른 쪽에 의해 먼저 공개되도록 두는 것에 비해 상당히 더 높은 신뢰도 평가라는 결과를 낳았다."], ["8", "그에 못지않게 중요한 것은, '선수 치기와 결부된 신뢰도 평가가 그 위기를 덜 심각한 것으로 받아들이게 만든다'는 점을 저자들이 밝혀냈다는 것이다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "Chief among these advantages is the ability to control the first messages and how a story is first framed."}, {"en": false, "h": "주제 문항은 <b>이 글이 무엇의 좋은 점을 말하고 있는가</b>를 한 문장으로 잡아야 한다. 1번이 <b>공격의 자리를 남에게 넘기는 것은 실수</b>라고 문을 열고, 2번이 <b>선제적으로 움직이는 것(being proactive)</b>의 이점은 무시할 수 없다고 방향을 잡는다. 그리고 3번이 그 이점의 <b>으뜸</b>을 못 박는다. <b>the ability to control the first messages</b>, 곧 <b>먼저 말해서 판을 짜는 힘</b>이다. 이것이 ②의 <b>taking the initiative</b>(주도권을 잡는 것)와 정확히 겹친다. 5번의 <b>stealing thunder</b>라는 이름과 7·8번의 실험 결과는 모두 이 이점을 뒷받침하는 근거일 뿐이다. 참고로 3번은 보어인 <b>Chief among these advantages</b>가 앞으로 나가면서 <b>동사와 주어가 뒤집힌 도치</b> 문장이라, 진짜 주어는 <b>the ability</b>다."}], "opts": [{"n": "①", "t": "위기 상황에서 협조적이어야 할 필요성", "a": false, "x": true, "trap": false, "e": "협조나 협력이라는 개념이 지문에 없다. 8번의 <b>labor and management</b> 같은 표현은 08번 지문의 이야기이지 이 글의 내용이 아니다."}, {"n": "②", "t": "위기를 관리하는 데 있어 주도권을 잡는 것의 중요성", "a": true, "x": false, "trap": false, "e": "2번의 <b>being proactive</b>와 3번의 <b>control the first messages</b>가 곧 <b>taking the initiative</b>이며, 5~8번의 <b>stealing thunder</b>가 그 구체적 이름이다."}, {"n": "③", "t": "조직을 구하기 위해 거짓 이야기를 지어내는 것의 문제점", "a": false, "x": true, "trap": false, "e": "<b>거짓말</b>은 어디에도 없다. 오히려 6번은 <b>자기 위기를 사실대로 먼저 알린다</b>고 말한다. 방향이 정반대다."}, {"n": "④", "t": "신뢰도를 높이는 데 있어 침묵을 지키는 것의 중요성", "a": false, "x": true, "trap": true, "e": "7번의 <b>credibility ratings</b>(신뢰도 평가)만 보고 고르기 쉽다. 그러나 신뢰도를 높인 것은 <b>침묵</b>이 아니라 <b>먼저 말한 것</b>이다. 정반대로 읽은 선지다."}, {"n": "⑤", "t": "언론을 통해 기업 이미지를 개선하는 것의 이점", "a": false, "x": true, "trap": false, "e": "6번에 <b>the media</b>가 나오지만, 언론은 <b>위기를 발견할 수도 있는 상대</b>로 등장할 뿐 <b>이미지 개선의 수단</b>이 아니다."}], "w": [["strategic", "전략적인"], ["tactical", "전술적인"], ["offensive", "공격적인, 공격의"], ["give away", "넘겨주다"], ["criticize", "비판하다"], ["blame", "비난하다"], ["opponent", "반대자, 상대"], ["undoubtedly", "의심할 여지 없이"], ["proactive", "선제적인, 앞서 나서는"], ["air", "드러내다, 공표하다"], ["dirty laundry", "치부, 수치스러운 일"], ["tell on oneself", "자기 얘기를 스스로 하다"], ["significant", "중요한, 상당한"], ["chief", "으뜸의, 주된"], ["frame", "틀을 짜다"], ["appropriately", "딱 맞게, 적절히"], ["term", "이름 붙이다"], ["steal thunder", "선수를 치다"], ["break the news", "(소식을) 처음 알리다"], ["crisis", "위기"], ["interested party", "이해 당사자"], ["as opposed to", "~와는 반대로"], ["disclose", "공개하다, 밝히다"], ["substantially", "상당히"], ["credibility", "신뢰도, 신빙성"], ["perception", "인식, 지각"], ["severe", "심각한"]]}, {"q": "04", "type": "어법", "src": "2020년 3월 29번", "ans": "⑤", "tr": [["1", "아이들이 어릴 때, 그 일의 상당 부분은 아이들에게 그들이 실제로 통제력을 갖고 있음을 보여 주는 것이다."], ["2", "부모 교육자로 20년을 일한 우리의 현명한 친구 한 명은 미취학 아동에게 달력을 주고 그 아이들의 삶에서 중요한 일들을 모두 적어 두라고 조언하는데, 그렇게 하면 아이들이 시간의 흐름과 자기 하루가 어떻게 펼쳐질지를 더 잘 이해하는 데 도움이 되기 때문이기도 하다."], ["3", "아이들이 자기 하루를 스스로 통제하고 있다고 느끼게 하는 데에서 달력이라는 도구가 갖는 중요성은 아무리 강조해도 지나치지 않다."], ["4", "요일이 하나씩 다가올 때마다 아이들이 그 날짜를 지워 나가게 하라."], ["5", "그날의 일정을 함께 훑어보는 시간을 갖고, 가능한 곳마다 그 일정 안에서 아이에게 선택권을 주라."], ["6", "이런 의사소통은 존중을 표현한다. 아이들은 자기가 그저 부모의 하루와 계획에 따라다니는 존재가 아니라는 것을 알게 되고, 무슨 일이 언제 왜 일어날지를 이해하게 된다."], ["7", "아이들은 자라면서 중요한 일들을 스스로 적어 넣기 시작할 것이고, 그것은 아이들이 자기 통제감을 기르는 데 한층 더 도움이 된다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "As they get older, children will then start to write in important things for themselves, ⑤ it further helps them develop their sense of control."}, {"en": false, "h": "어법 문항에서 <b>콤마 뒤에 갑자기 새 문장이 시작되는지</b>를 확인하는 것은 기본 중의 기본이다. 이 문장에는 이미 <b>will start</b>라는 동사가 있고, 콤마 뒤에 또 <b>helps</b>라는 동사가 나온다. 그런데 둘을 이어 줄 <b>접속사도 관계사도 없다</b>. <b>it</b>은 대명사일 뿐 문장을 잇지 못한다. 따라서 <b>it</b>을 <b>which</b>로 고쳐, 앞 절 전체를 선행사로 받는 <b>계속적 용법의 관계대명사</b>로 만들어야 한다. 이렇게 <b>앞 문장 전체를 받는 which</b>는 콤마 뒤에서만 쓰이며, <b>that</b>으로는 바꿀 수 없다는 점도 함께 정리해 두자. <b>동사 두 개 + 접속사 0개 = 오류</b>라는 공식은 어법 문항의 절반을 해결해 준다."}], "opts": [{"n": "①", "t": "do (have control)", "a": false, "x": true, "trap": false, "e": "<b>do · does · did</b>가 일반동사 앞에 붙으면 '<b>정말로</b>'라는 <b>강조</b>가 된다. 주어 <b>they</b>가 복수이고 현재시제이므로 <b>do</b>가 맞다."}, {"n": "②", "t": "advises", "a": false, "x": true, "trap": false, "e": "주어는 <b>One wise friend of ours</b>로 <b>단수</b>다. 사이에 낀 <b>who was a parent educator for twenty years</b>는 주어를 꾸미는 관계사절일 뿐이다. 단수 주어에 <b>advises</b>가 맞다."}, {"n": "③", "t": "cross", "a": false, "x": true, "trap": false, "e": "<b>Have them cross off ~</b>는 <b>사역동사 have + 목적어 + 동사원형</b>이다. <b>아이들이 직접 지우는</b> 능동 관계이므로 원형 <b>cross</b>가 맞다. 지워지는 쪽이었다면 과거분사가 왔을 것이다."}, {"n": "④", "t": "possible", "a": false, "x": true, "trap": true, "e": "<b>wherever possible</b>은 <b>wherever it is possible</b>에서 <b>주어 + be동사</b>가 생략된 형태다. 부사절에서 주어가 <b>it</b>이고 동사가 <b>be</b>일 때 자주 생략되며, 남는 자리에는 <b>형용사</b>가 온다."}, {"n": "⑤", "t": "it", "a": true, "x": false, "trap": false, "e": "앞에 <b>will start</b>라는 동사가 이미 있고 접속사가 없으므로, 앞 절 전체를 받는 <b>which</b>로 고쳐야 한다."}], "w": [["demonstrate", "보여 주다, 입증하다"], ["have control", "통제력을 갖다"], ["parent educator", "부모 교육자"], ["preschool-age", "미취학   app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
