<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');

  const tabs=[['word','1','유반의어','답 맞춰보기'],['dk','2','직독직해','해석 맞춰보기'],['submit','3','답안지','정답 입력'],['exp','4','해설',S.sub?'정답·근거':'제출하면 열림']];
  return `<header><div class="wrap"><div class="row1"><h1>${esc(TITLE)}</h1><span><button class="link gohome" data-v="home">메뉴</button><a class="link" href="index.html">목록</a></span></div><div class="tabs">`+
    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}
function render(){
  if(view==='home')renderHome();
  else if(view==='dk')renderDk();
  else if(view==='word')renderWord();
  else if(view==='note')renderNote();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

 직면한 정보 과부하가 어떤 것인지 감을 잡을 수 있다.", "ana": "맨 끝의 <b>they are up against</b>가 어디에 걸리는지가 이 문장의 전부다. <b>against</b>라는 전치사 뒤에 <b>목적어가 비어 있다</b>는 것이 결정적인 신호다. 원래는 <b>the information overload (which) they are up against</b>로, <b>목적격 관계대명사가 생략</b>된 것이다. 목적격 관계대명사는 생략할 수 있지만 주격은 생략할 수 없다는 점이 시험의 단골이니, <b>명사 뒤에 곧바로 주어+동사가 오면 생략된 목적격 관계대명사</b>를 떠올리자. 앞부분의 <b>If you've ever seen ~</b>은 <b>ever</b>가 붙은 현재완료로 '<b>지금까지 한 번이라도 ~한 적이 있다면</b>'이라는 <b>경험</b>의 뜻이다. <b>be up against</b>는 '<b>~에 직면해 있다, ~와 맞서 싸우고 있다</b>'라는 구동사로, 여기서는 중개인이 정보 과부하와 씨름하고 있다는 뜻이다.", "pe": "\u0001If you've ever seen the bank of<sup>1</sup> flashing<sup>2</sup> screens at a broker<sup>3</sup>'s desk\u0002, / you have a sense \u0001of the information overload<sup>4</sup>\u0002 / \u0001they are up against<sup>5</sup>\u0002.", "pk": "\u0001주식 중개인의 책상에 죽 늘어선 번쩍이는 화면들을 본 적이 있다면\u0002, / 당신은 그 정보 과부하가 어떤 것인지 감을 잡을 수 있다 / \u0001그들이 직면해 있는\u0002.", "core": "당신은 감을 잡을 수 있다.", "tags": ["(If you've ever seen …) = 부사절(조건): 주절 전체를 꾸밈. <b>have seen</b> 현재완료(경험)", "주어 you + 동사 have + 목적어 a sense: 3형식. (of the information overload) = 전치사구(형용사구): sense를 꾸밈", "(they are up against) = 관계절(형용사절, 목적격 관계대명사 생략): information overload를 꾸밈"], "steps": [{"t": "이 문장은 <b>If절 + S+V+O(3형식)</b>이다. 주절 목적어 뒤에 관계절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: you (당신)", "V: have (가지다)", "O: a sense (감, 느낌)", "뼈대 = <b>you have a sense</b>", "of the information overload (정보 과부하에 대한)는 sense를 꾸미는 전치사구"]}, {"t": "<b>If you've ever seen the bank of flashing screens at a broker's desk</b>는 조건 부사절이다.", "sub": ["you've seen = have seen (see의 현재완료, 경험), ever (한 번이라도)", "bank of screens (죽 늘어선 화면들), flashing (번쩍이는)", "broker (주식 중개인), desk (책상)"]}, {"t": "<b>they are up against</b>는 overload를 꾸미는 관계절이다. 목적격 관계대명사가 <b>생략</b>되었다. be up against ~ (~에 직면하다)의 against 뒤가 비어 있다.", "sub": ["they = 앞에 나온 중개인(그들)", "information overload (정보 과부하)"]}], "sum": "중개인의 번쩍이는 화면을 본 적이 있다면, 그들이 맞선 정보 과부하를 짐작 가능"}, {"i": "05", "q": "03", "s": "3", "title": "동명사 주어 + V+O + so ~ that 구문", "eng": "Weighing<sup>1</sup> all of these factors / can take up<sup>2</sup> so much of your working memory / that it becomes overwhelmed<sup>3</sup>.", "notes": [["1", "weigh", "저울질하다, 따져 보다"], ["2", "take up", "~을 차지하다"], ["3", "overwhelmed", "압도당한"]], "lit": "이 모든 요인을 저울질하는 것은 / 당신의 작동 기억을 너무나 많이 차지해서 / 결국 그것이 압도당하게 된다.", "nat": "이 모든 요인을 따져 보는 일은 작동 기억을 너무 많이 잡아먹어서, 결국 작동 기억이 압도당해 버린다.", "ana": "문장 첫머리의 <b>Weighing</b>은 분사구문이 아니라 <b>동명사 주어</b>다. 구별법은 간단하다. 뒤에 <b>주어가 따로 없고</b> 동사(can take up)가 바로 이어지면 그 -ing 덩어리 자체가 주어다. 동명사 주어는 <b>항상 단수 취급</b>하므로 동사도 단수 형태에 맞춘다. 이어지는 <b>so much of A that B</b>는 '<b>A를 너무 많이 …해서 B하다</b>'라는 <b>정도·결과</b> 구문이다. so와 that이 멀리 떨어져 있으면 that을 관계대명사로 착각하기 쉬운데, 앞에 <b>so</b>가 있으면 <b>결과의 that</b>부터 의심해야 한다. that절 안의 <b>it</b>은 바로 앞의 your working memory를 받으며, 기억이 '<b>압도당하는</b>' 수동 관계이므로 overwhelming이 아니라 <b>overwhelmed</b>가 왔다.", "pe": "Weighing<sup>1</sup> all \u0001of these factors\u0002 / can take up<sup>2</sup> \u0001so\u0002 much \u0001of your working memory\u0002 / \u0001that it becomes overwhelmed<sup>3</sup>\u0002.", "pk": "이 모든 요인을 저울질하는 것은 / 당신의 작동 기억을 \u0001너무나\u0002 많이 차지해서 / 결국 그것이 압도당하게 된다.", "core": "저울질하는 것은 많은 것을 차지할 수 있다.", "tags": ["주어 Weighing all(<b>동명사구</b> 주어): 동사가 나올 때까지 기다림. (of these factors) = 전치사구(형용사구): all을 꾸밈", "동사 can take up + 목적어 much: 3형식(take up은 구동사). (so) = 부사: much를 꾸밈 (so ~ that 신호), (of your working memory) = 전치사구(형용사구): much를 꾸밈", "(that절) = 접속사절(부사적: 결과): so much의 결과"], "steps": [{"t": "이 문장은 <b>동명사구 주어 + V + O(3형식) + so ~ that</b>이다. 주어가 -ing로 시작해 동사 can take up이 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Weighing all of these factors (이 모든 요인을 따져 보는 것, 동명사구)", "V: can take up (take up ~을 차지하다 / can ~할 수 있다)", "O: so much of your working memory (작동 기억의 아주 많은 부분)", "뼈대 = <b>Weighing all of these factors can take up so much</b>"]}, {"t": "주어 안의 <b>weighing</b>은 weigh (따져 보다, 저울질하다)의 동명사이고, <b>all of these factors</b>(이 요인들 전부)가 그 목적어이다. 함정: factors can으로 끊어 읽지 않는다.", "sub": ["factor (요인)"]}, {"t": "<b>so much of your working memory</b>에서 so는 뒤의 that절과 짝을 이룬다.", "sub": ["working memory (작동 기억, 정보를 잠깐 붙들고 처리하는 기억)"]}, {"t": "<b>that it becomes overwhelmed</b>는 '너무 ~해서 ~하다'의 결과절이다. it = your working memory (작동 기억)이다.", "sub": ["become overwhelmed (압도당하게 되다), overwhelmed (압도당한)는 형용사 보어"]}], "sum": "이 요인들을 따지는 일, 작동 기억을 너무 많이 차지해 압도당하게 함"}, {"i": "06", "q": "04", "s": "1", "title": "S+V+O(to believe + that절)", "eng": "We all want to believe / that our brains sort through<sup>1</sup> information / in the most rational<sup>2</sup> way possible<sup>3</sup>.", "notes": [["1", "sort through", "~을 골라내다, 분류하다"], ["2", "rational", "이성적인, 합리적인"], ["3", "possible", "가능한"]], "lit": "우리는 모두 믿고 싶어 한다 / 우리의 뇌가 정보를 골라 분류한다고 / 가능한 한 가장 이성적인 방식으로.", "nat": "우리는 모두 우리의 뇌가 가능한 한 가장 이성적인 방식으로 정보를 걸러 분류한다고 믿고 싶어 한다.", "ana": "핵심은 문장 맨 끝의 <b>possible</b>이다. 형용사는 보통 명사 <b>앞</b>에서 꾸미는데, 여기서는 <b>the most rational way</b> 뒤에 붙었다. 이런 <b>후치수식</b>이 허용되는 대표적인 경우가 앞에 <b>최상급·all·every</b>가 있을 때다. 그래서 the most rational way possible은 '<b>가능한 한 가장 이성적인 방식</b>'으로 읽는다. 어법 문제에서 이 자리를 <b>possibly</b>로 바꿔 놓으면 틀린 것이 되니, 뒤에 붙은 단어가 명사를 꾸미는 <b>형용사</b>인지 동사를 꾸미는 <b>부사</b>인지 반드시 확인해야 한다. 앞부분의 <b>that</b>은 believe의 목적어절을 이끄는 <b>접속사</b>이고, <b>sort through</b>는 '<b>~을 하나하나 살펴 골라내다</b>'라는 구동사다.", "pe": "We \u0001all\u0002 want to believe / that our brains sort \u0001through<sup>1</sup> information\u0002 / \u0001in the most rational<sup>2</sup> way possible\u0002<sup>3</sup>.", "pk": "우리는 \u0001모두\u0002 믿고 싶어 한다 / 우리의 뇌가 정보를 골라 분류한다고 / \u0001가능한 한 가장 이성적인 방식으로\u0002.", "core": "우리는 뇌가 정보를 분류한다고 믿고 싶어 한다.", "tags": ["주어 We + 동사 want + 목적어 to believe(to부정사). (all) = 대명사 동격: We를 꾸밈", "that절 = <b>명사절</b>(believe의 목적어): 주어 brains + 동사 sort(1형식). (through information) = 전치사구(부사구): sort를 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "(in the most rational way possible) = 전치사구(부사구): sort를 꾸밈. possible은 way를 꾸미는 형용사"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 to believe 뒤에 that절이 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: We (우리) — all (모두)은 We와 동격", "V: want (원하다)", "O: to believe (믿는 것)", "뼈대 = <b>We all want to believe ...</b>"]}, {"t": "<b>that our brains sort through information</b>은 believe의 목적어 <b>명사절</b>이다.", "sub": ["S: our brains (우리의 뇌)", "V: sort through (골라내다, 분류하다)", "information (정보)", "기준: sort through information의 through구는 거의 필수에 가까운 부사구이지만 수식어로 본다."]}, {"t": "<b>in the most rational way possible</b>은 sort를 꾸미는 전치사구이다. possible(가능한)은 way를 뒤에서 꾸미는 형용사이다.", "sub": ["rational (이성적인, 합리적인)", "the most rational way possible = 가능한 한 가장 이성적인 방식"]}], "sum": "우리 모두, 뇌가 가능한 한 가장 이성적으로 정보를 분류한다고 믿고 싶어 함"}, {"i": "07", "q": "05", "s": "4", "title": "S+V(1형식) + 방향 전치사구 병렬", "eng": "Thus wheat cultivation<sup>1</sup> spread readily<sup>2</sup> / from the uplands<sup>3</sup> of Turkey throughout Mesopotamia, to Europe, / and all the way round to India, for example.", "notes": [["1", "cultivation", "재배, 경작"], ["2", "readily", "손쉽게, 순조롭게"], ["3", "upland", "고지대, 고원"]], "lit": "그리하여 밀 재배는 손쉽게 퍼져 나갔다 / 터키의 고지대에서 메소포타미아 전역으로, 그리고 유럽으로, / 그리고 예컨대 인도까지 죽 돌아서까지.", "nat": "그리하여 예를 들어 밀 재배는 터키의 고지대에서 메소포타미아 전역으로, 유럽으로, 그리고 인도까지 죽 돌아서 손쉽게 퍼져 나갔다.", "ana": "구조는 단순하다. 주어 <b>wheat cultivation</b>, 동사 <b>spread</b>가 전부이고, 나머지는 전부 <b>어디로 퍼졌는지</b>를 말하는 <b>전치사구</b>다. <b>from A throughout B, to C, and all the way round to D</b>가 <b>and</b>로 묶인 병렬이므로, 하나씩 끊어 읽으면 지도가 그려진다. 여기서 주의할 것은 동사 <b>spread</b>의 형태다. spread는 <b>원형·과거·과거분사가 모두 같은 모양</b>이라 시제를 놓치기 쉬운데, 이 문장은 <b>과거</b>다. 판단 근거는 주어가 3인칭 단수인데 <b>spreads</b>가 아니라는 점이다. cut·put·set·hit·let도 같은 부류이므로 함께 묶어 두자. <b>readily</b>는 '기꺼이'가 아니라 여기서는 '<b>손쉽게, 순조롭게</b>'라는 뜻으로, 앞 문장이 말한 <b>적응이 거의 필요 없다</b>는 내용을 그대로 이어받는다.", "pe": "\u0001Thus\u0002 wheat cultivation<sup>1</sup> spread \u0001readily<sup>2</sup>\u0002 / \u0001from the uplands<sup>3</sup> of Turkey\u0002 \u0001throughout Mesopotamia\u0002, \u0001to Europe\u0002, / and \u0001all the way round to India\u0002, \u0001for example\u0002.", "pk": "\u0001그리하여\u0002 밀 재배는 \u0001손쉽게\u0002 퍼져 나갔다 / \u0001터키의 고지대에서 메소포타미아 전역으로\u0002, 그리고 \u0001유럽으로\u0002, / 그리고 \u0001예컨대\u0002 \u0001인도까지 죽 돌아서까지\u0002.", "core": "밀 재배가 퍼져 나갔다.", "tags": ["(Thus) = 접속부사: 문장 전체를 꾸밈. 주어 wheat cultivation + 동사 spread: 1형식. (readily) = 부사: spread를 꾸밈", "(from the uplands of Turkey), (throughout Mesopotamia), (to Europe) = 전치사구(부사구): spread의 출발·범위·도착을 각각 꾸밈", "(all the way round to India) = 전치사구(부사구): spread를 꾸밈, (for example) = 삽입(부사구): 문장 전체"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 방향을 나타내는 전치사구가 줄줄이 붙어 길어 보일 뿐 뼈대는 짧다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: wheat cultivation (밀 재배, cultivation 재배)", "V: spread (spread 퍼지다의 과거형)", "뼈대 = <b>wheat cultivation spread</b>", "Thus (그리하여)와 for example (예를 들어)은 문장 전체를 꾸미고, readily (손쉽게)는 spread를 꾸미는 부사"]}, {"t": "뒤의 전치사구들은 모두 spread를 꾸미는 부사구이다. 출발점, 범위, 도착점을 차례로 보여 준다.", "sub": ["from the uplands of Turkey (터키의 고지대에서, upland 고지대)", "throughout Mesopotamia (메소포타미아 전역으로)", "to Europe (유럽으로)", "and all the way round to India (그리고 인도까지 죽 돌아서)", "기준: 1형식 spread의 방향 전치사구는 거의 필수에 가까운 부사구이지만 수식어로 본다."]}, {"t": "함정: and는 동사가 아니라 <b>전치사구</b>들을 잇는다."}], "sum": "밀 재배, 터키 고지대에서 메소포타미아와 유럽을 거쳐 인도까지 손쉽게 확산"}, {"i": "08", "q": "06", "s": "1", "title": "S+V+C + 과거분사 후치수식 + 비교 than", "eng": "Innate<sup>1</sup> behaviors used for finding food, / such as grazing<sup>2</sup>, scavenging<sup>3</sup>, or hunting, / are more dependent on<sup>4</sup> learning / than behaviors used to consume<sup>5</sup> food.", "notes": [["1", "innate", "타고난, 선천적인"], ["2", "graze", "풀을 뜯다, 방목하다"], ["3", "scavenge", "동물의 사체를 찾아 다니다"], ["4", "be dependent on", "~에 의존하다"], ["5", "consume", "먹다, 소비하다"]], "lit": "먹이를 찾는 데 사용되는 타고난 행동은, / 예컨대 풀 뜯기, 동물 사체 찾아다니기, 사냥하기 같은 것은, / 학습에 더 많이 의존한다 / 먹이를 먹는 데 사용되는 행동보다.", "nat": "풀 뜯기, 죽은 동물 찾아다니기, 사냥처럼 먹이를 찾는 데 쓰이는 타고난 행동은 먹이를 먹는 데 쓰이는 행동보다 학습에 더 많이 의존한다.", "ana": "이 문장에는 <b>used</b>가 두 번 나오는데, 둘 다 동사가 아니라 <b>과거분사의 후치수식</b>이다. <b>behaviors (which are) used for ~</b>, <b>behaviors (which are) used to ~</b>에서 <b>관계대명사 + be동사</b>가 생략된 형태다. 행동은 '<b>사용되는</b>' 대상이므로 수동인 used가 맞다. 진짜 동사는 <b>are</b> 하나뿐이며, 주어는 맨 앞의 <b>Innate behaviors</b>다. 중간의 <b>such as ~</b>는 콤마와 콤마 사이에 끼어든 <b>예시 삽입구</b>이므로 통째로 괄호로 묶고 건너뛰어야 주어와 동사가 붙어 보인다. 마지막으로 <b>more A than B</b>는 <b>비교 대상을 정확히 맞추는 것</b>이 관건이다. 여기서 비교되는 두 축은 <b>먹이를 찾는 행동</b>과 <b>먹이를 먹는 행동</b>이며, 이 대비가 곧 빈칸 문제의 열쇠가 된다.", "pe": "\u0001Innate<sup>1</sup>\u0002 behaviors \u0001used for finding food\u0002, / \u0001such as grazing<sup>2</sup>, scavenging<sup>3</sup>, or hunting\u0002, / are \u0001more\u0002 dependent \u0001on<sup>4</sup> learning\u0002 / \u0001than behaviors used to consume<sup>5</sup> food\u0002.", "pk": "\u0001먹이를 찾는 데 사용되는\u0002 \u0001타고난\u0002 행동은, / \u0001예컨대 풀 뜯기, 동물 사체 찾아다니기, 사냥하기 같은 것은\u0002, / \u0001학습에\u0002 \u0001더 많이\u0002 의존한다 / 먹이를 먹는 데 사용되는 행동보다.", "core": "행동은 의존한다.", "tags": ["주어 behaviors. (Innate) = 형용사: behaviors를 꾸밈, (used for finding food) = 과거분사구(형용사적): behaviors를 꾸밈", "(such as grazing, scavenging, or hunting) = 삽입 예시: behaviors를 꾸밈", "동사 are + 보어 dependent: 2형식. (more) = 부사: dependent를 꾸밈, (on learning) = 전치사구(부사구): dependent를 꾸밈 [기준: 형용사 뒤 전치사구 = 수식어]", "(than behaviors used to consume food) = 비교 전치사구/절(부사적): more를 꾸밈. used to consume = 과거분사 + to부정사(형용사적: behaviors를 꾸밈)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) + 비교 than구</b>이다. 주어 뒤 수식이 길어 동사 are가 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Innate behaviors (타고난 행동들, innate 타고난, behavior 행동)", "V: are (be ~이다)", "C: more dependent (더 의존하는, dependent 의존하는)", "뼈대 = <b>Innate behaviors are more dependent</b>", "기준: dependent on ~의 on구는 거의 필수에 가까운 부사구이지만 수식어로 본다.", "on learning (학습에)"]}, {"t": "<b>used for finding food</b>는 behaviors를 뒤에서 꾸미는 <b>과거분사구</b>이다. '먹이를 찾는 데 쓰이는'. 동사가 아니다.", "sub": ["use (쓰다)의 과거분사 used", "for 뒤라서 동명사 finding"]}, {"t": "<b>such as grazing, scavenging, or hunting</b>은 예시를 드는 삽입구이다.", "sub": ["grazing (풀 뜯기, graze 풀을 뜯다)", "scavenging (죽은 동물 찾아다니기, scavenge 사체를 찾아다니다)", "hunting (사냥)", "동명사 세 개 병렬"]}, {"t": "<b>than behaviors used to consume food</b>는 '먹이를 먹는 데 쓰이는 행동보다'라는 비교 대상이다. 함정: used to consume은 '~하곤 했다'가 아니라 <b>과거분사 used + 목적의 to부정사</b>이다.", "sub": ["consume (먹다, 소비하다)"]}], "sum": "먹이를 찾는 타고난 행동은, 먹는 행동보다 학습 의존도가 높음"}], "qs": [{"q": "01", "type": "필자의 주장", "src": "2017년 10월 20번", "ans": "①", "tr": [["1", "한 아이가 캐치볼 놀이를 시작하려는 의도로 다른 아이에게 공을 던진다고 가정해 보라."], ["2", "다른 아이는 보고 있지 않았고, 공은 그 아이의 머리에 맞는다."], ["3", "그 아이는 울면서 선생님에게 달려가 다른 '말썽꾸러기' 아이의 공격적인 행동에 대해 이른다."], ["4", "물론 공을 던진 아이에게는 잘못이 없지만, 만약 우리가 공격성을 순수한 행동, 즉 어떤 행위의 결과로만 정의해 왔다면 공을 던진 그 아이는 부당하게 유죄가 되고 만다."], ["5", "분명히 우리는 공격성을 정의할 때 의도를 고려할 필요가 있다."], ["6", "공격성은 남을 다치게 하려고 의도된 모든 행동이라고 말한다면, 우리는 이제 더 완전한 정의로 나아갈 수 있다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Clearly we need to take intention into account when we define aggression."}, {"en": false, "h": "주장 문항은 <b>필자가 '해야 한다'고 말하는 문장</b> 하나만 찾으면 끝난다. 1~4번 문장은 전부 <b>사례</b>다. 공을 던진 아이가 실제로는 놀이를 하려던 것이었는데, 결과만 보면 공격적인 아이가 되어 버린다는 상황이다. 그리고 5번 문장에서 <b>Clearly we need to take intention into account</b>라며 필자가 처음으로 <b>자기 목소리</b>를 낸다. 마지막 6번 문장은 그 주장을 정의문으로 다듬은 것으로, <b>behaviour that is intended to hurt others</b>에서 <b>intended</b>(의도된)라는 말이 다시 등장한다. <b>need to·should·must·Clearly·It is important</b>가 붙은 문장이 곧 주장이라고 보면 거의 틀리지 않는다."}], "opts": [{"n": "①", "t": "행동의 공격성을 판단할 때는 의도를 헤아려야 한다.", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>take intention into account when we define aggression</b>과 그대로 일치한다. 6번 문장의 <b>intended to hurt others</b>가 이를 한 번 더 확인해 준다."}, {"n": "②", "t": "다툼이 발생하면 제삼자가 공정하게 중재해야 한다.", "a": false, "x": true, "trap": false, "e": "선생님(teacher)이 등장하지만 그저 아이가 <b>이르러 달려간 대상</b>일 뿐이다. 글은 중재나 공정성을 논하지 않는다."}, {"n": "③", "t": "잘못된 행동의 결과에 대한 책임을 져야 한다.", "a": false, "x": true, "trap": true, "e": "<b>consequences</b>라는 단어가 본문에 있어 끌리지만, 글은 결과만 보는 정의가 <b>부당한 유죄</b>를 만든다고 <b>비판</b>한다. 정반대의 주장이다."}, {"n": "④", "t": "운동할 때 안전을 최우선으로 고려해야 한다.", "a": false, "x": true, "trap": false, "e": "캐치볼은 <b>상황을 설명하기 위한 예시</b>일 뿐이고, 안전(safety)이라는 개념은 글에 등장하지 않는다."}, {"n": "⑤", "t": "어린이에게 협동의 중요성을 가르쳐야 한다.", "a": false, "x": true, "trap": false, "e": "아이들이 등장한다는 것만 같을 뿐, 협동(cooperation)은 글의 소재가 아니다. 이 글의 주제는 <b>공격성의 정의</b>다."}], "w": [["suppose", "가정하다, ~라고 치다"], ["intend to V", "~하려고 의도하다"], ["game of catch", "캐치볼 놀이"], ["aggressive", "공격적인"], ["naughty", "말썽꾸러기의, 버릇없는"], ["innocent", "잘못이 없는, 무죄인"], ["in terms of", "~의 관점에서"], ["consequence", "결과"], ["guilty", "유죄인, 잘못이 있는"], ["take A into account", "A를 고려하다"], ["intention", "의도"], ["be intended to V", "~하도록 의도되다"]]}, {"q": "02", "type": "심경", "src": "2021년 7월 19번", "ans": "④", "tr": [["1", "Tavil은 이 파묻힌 세계를 이해했다고 느끼고 떠날 준비가 되었다."], ["2", "그러나 몸을 돌렸을 때, 그가 기어올라 통과해 왔던 그 구멍은 더 이상 존재하지 않는다."], ["3", "그 자리에는 터널 전체에 끝없이 이어지는 무늬의 연속인, 흰 타일로 된 매끄러운 벽이 있다."], ["4", "구멍 바닥에 어지럽게 흩어져 있던 부서진 잔해 조각들도 사라지고 없다."], ["5", "그리고 바로 그때 그는 자신이 있는 곳의 소름 끼치는 진실을 느낀다. 너무나 깊은 지하여서 여기까지 기어 내려오는 동안 다리와 팔의 근육이 떨릴 정도였다."], ["6", "그는 갇혔다."], ["7", "잔인할 만큼 완전히."], ["8", "마치 무덤 속에, 묘 안에 있는 것처럼."], ["9", "겁에 질린 채 그는 타일을 손톱으로 긁어 댄다."], ["10", "그는 비명을 지른다. 누가 듣든 말든 개의치 않고, 오히려 누군가 듣고서 자기를 밖으로 꺼내 주기를 바라면서."]], "evh": "5번 문장", "ev": [{"en": true, "h": "And this is when he feels the horrifying truth of where he is: so deep underground that the climb down made the muscles in his legs and arms tremble. He is trapped."}, {"en": false, "h": "심경 문항은 <b>형용사와 동사에 색칠하듯 표시</b>하며 읽는 것이 정석이다. 앞부분 1번 문장까지는 <b>ready to leave</b>라 평온했다. 그런데 2번 문장의 <b>But</b>에서 상황이 뒤집힌다. 나가는 구멍이 사라진 것이다. 이후 등장하는 단어들을 모아 보자 — <b>horrifying</b>(소름 끼치는), <b>trapped</b>(갇힌), <b>Brutally so</b>(잔혹할 만큼), <b>as if in a grave, in a tomb</b>(무덤 속에 있는 것처럼), <b>Frightened</b>(겁에 질린), <b>claws at the tiles</b>(타일을 긁어 댄다), <b>screams</b>(비명을 지른다). 공포와 절박함이 한 방향으로 몰려 있다. 따라서 ④가 정답이다."}], "opts": [{"n": "①", "t": "bored and lonely (지루하고 외로운)", "a": false, "x": true, "trap": false, "e": "혼자 있는 것은 맞지만 <b>지루함</b>은 어디에도 없다. 오히려 매 순간이 긴박하다."}, {"n": "②", "t": "relieved and hopeful (안도하고 희망에 찬)", "a": false, "x": true, "trap": true, "e": "1번 문장만 보면 안도한 듯하지만, <b>But</b> 이후로 감정이 완전히 뒤집힌다. 앞부분만 읽고 고르면 걸리는 함정이다."}, {"n": "③", "t": "thrilled and joyful (아주 신나고 기쁜)", "a": false, "x": true, "trap": false, "e": "<b>screams</b>를 환호로 잘못 읽으면 여기로 간다. 그러나 바로 앞의 <b>Frightened</b>가 그 비명의 성격을 못 박고 있다."}, {"n": "④", "t": "terrified and desperate (겁에 질리고 필사적인)", "a": true, "x": false, "trap": false, "e": "<b>horrifying</b>, <b>trapped</b>, <b>Frightened</b>, <b>claws at the tiles</b>, <b>screams ~ hoping they will cast him out</b>이 모두 공포와 절박함으로 모인다."}, {"n": "⑤", "t": "touched and grateful (감동하고 감사하는)", "a": false, "x": true, "trap": false, "e": "감동을 줄 만한 대상도, 고마워할 상대도 등장하지 않는다. 마지막 문장의 <b>hoping</b>은 감사가 아니라 <b>구조를 바라는 절박함</b>이다."}], "w": [["buried", "파묻힌"], ["no longer", "더 이상 ~ 아닌"], ["in its place", "그 자리에"], ["continuation", "연속, 계속"], ["unending", "끝없는"], ["debris", "잔해, 파편"], ["litter", "어지럽게 흩어져 있다"], ["horrifying", "소름 끼치는, 끔찍한"], ["tremble", "떨다, 떨리다"], ["trapped", "갇힌"], ["claw at", "~을 할퀴다, 손톱으로 긁다"], ["cast out", "내쫓다, 밖으로 몰아내다"]]}, {"q": "03", "type": "글의 제목", "src": "2018학년도 6월 23번", "ans": "①", "tr": [["1", "주식 중개인의 책상에 죽 늘어선 번쩍이는 화면들을 본 적이 있다면, 당신은 그들이 직면한 정보 과부하가 어떤 것인지 감을 잡을 수 있다."], ["2", "예를 들어 어떤 회사에 투자할지 말지를 결정할 때, 그들은 다른 여러 정보 중에서도 그 회사를 이끄는 사람들, 시장의 현재 규모와 잠재적 규모, 순이익, 그리고 그 회사의 과거·현재·미래의 주가를 고려할 수 있다."], ["3", "이 모든 요인을 따져 보는 일은 작동 기억을 너무 많이 잡아먹어서, 결국 작동 기억이 압도당해 버린다."], ["4", "책상 위에 서류 더미와 접착식 메모지, 스프레드시트가 잔뜩 어질러져 있는 상황을 떠올려 보라. 그러면 뇌 안에서 무슨 일이 벌어지는지 그림이 그려진다."], ["5", "정보가 이런 식으로 작동 기억에 과부하를 걸면, 그것은 중개인들이 — 그리고 우리 나머지 모두가 — 전략 수립과 분석을 전부 내던지고 감정적인, 즉 직감적인 결정으로 가 버리게 만들 수 있다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "When information overloads working memory this way, it can make brokers — and the rest of us — scrap all the strategizing and analyses and go for emotional, or gut, decisions."}, {"en": false, "h": "제목 문항은 <b>글이 무엇에서 무엇으로 이어지는지</b>를 한 줄로 요약해야 한다. 이 글의 출발점은 <b>information overload</b>(정보 과부하)다. 그 과부하가 <b>working memory</b>를 잡아먹고(3번 문장), 결국 5번 문장에서 <b>scrap all the strategizing and analyses and go for emotional, or gut, decisions</b>, 즉 <b>전략과 분석을 버리고 직감으로 결정하게 만든다</b>는 결론에 이른다. 이성적 판단이 흐려진다는 이야기다. 이 흐름을 그대로 담은 제목은 ①이며, <b>cloud your judgment</b>는 '<b>판단을 흐리게 하다</b>'라는 뜻으로 마지막 문장을 정확히 옮긴 표현이다."}], "opts": [{"n": "①", "t": "How Information Overload Can Cloud Your Judgment (정보 과부하가 어떻게 판단을 흐리게 하는가)", "a": true, "x": false, "trap": false, "e": "<b>정보 과부하 → 작동 기억 압도 → 직감적 결정</b>이라는 글의 흐름을 그대로 담았다. cloud가 곧 5번 문장의 <b>go for gut decisions</b>다."}, {"n": "②", "t": "Multitasking Increases Your Working Memory! (멀티태스킹이 작동 기억을 늘린다!)", "a": false, "x": true, "trap": true, "e": "글은 작동 기억이 <b>늘어난다</b>가 아니라 <b>압도당한다</b>고 말한다. 방향이 정반대다."}, {"n": "③", "t": "How to Prevent Information Flood (정보 홍수를 막는 방법)", "a": false, "x": true, "trap": false, "e": "<b>방법</b>을 알려 주는 글이 아니다. 과부하가 어떤 결과를 낳는지 <b>현상</b>만 설명하고 끝난다."}, {"n": "④", "t": "Do Flashing Screens Reduce Information Overload? (번쩍이는 화면이 정보 과부하를 줄이는가?)", "a": false, "x": true, "trap": false, "e": "번쩍이는 화면은 과부하를 <b>줄이는</b> 것이 아니라 과부하를 <b>보여 주는 장면</b>으로 첫 문장에 등장했을 뿐이다."}, {"n": "⑤", "t": "Emotional Judgment: The Secret of Successful Brokers (감정적 판단: 성공한 중개인의 비결)", "a": false, "x": true, "trap": false, "e": "감정적 결정은 글에서 <b>비결</b>이 아니라 <b>과부하가 낳은 부작용</b>으로 제시된다. 마지막 단어만 보고 고르면 걸린다."}], "w": [["broker", "(주식) 중개인"], ["have a sense of", "~을 감지하다, ~을 알다"], ["information overload", "정보 과부하"], ["up against", "~에 직면한"], ["take into account", "~을 고려하다"], ["at the helm", "실권을 가진, 지휘하는"], ["net profit", "순이익"], ["weigh", "저울질하다, 따져 보다"], ["take up", "~을 차지하다"], ["overwhelmed", "압도당한"], ["strewn about", "~에 어질러져 있는"], ["gut", "직감의, 본능적인"]]}, {"q": "04", "type": "어법", "src": "2016년 4월 28번", "ans": "⑤", "tr": [["1", "우리는 모두 우리의 뇌가 가능한 한 가장 이성적인 방식으로 정보를 걸러 분류한다고 믿고 싶어 한다."], ["2", "그러나 이와는 반대로, 수많은 연구는 인간의 추론에 많은 약점이 있음을 보여 준다."], ["3", "추론에서 나타나는 흔한 약점들은 모든 연령과 학력의 사람들에게 걸쳐 존재한다."], ["4", "예를 들어 확증 편향은 아주 흔하다."], ["5", "사람들은 자신의 관점을 뒷받침하는 정보에는 주목하면서, 그와 반대되는 증거는 무시한다."], ["6", "확증 편향은 고집이 센 것과 같은 것이 아니며, 사람들이 강한 의견을 가진 문제에만 국한되지도 않는다."], ["7", "그 대신 그것은 잠재의식 수준에서 작동하여 우리가 정보를 모으고 걸러 내는 방식을 통제한다."], ["8",   if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px">';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';
  app.innerHTML=h;
}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
