<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});

 대한 시사평을 쓰곤 했다.", "일단 인터넷이 음악을 쉽게 접할 수 있게 만들고 심지어 사전 발매 음반마저도 온라인 소셜 네트워크를 통해 유포될 수 있게 하자, 새로운 음악의 이용 가능성이 민주화되었고, 이는 비평가들이 더 이상 유일한 접근권을 갖지 않는다는 것을 의미했다.", "즉, 비평가와 비전문가는 모두 동시에 새로운 음악을 얻을 수 있었다.", "소셜 미디어 서비스는 또한 사람들이 새로운 곡에 대한 자신의 견해를 알리는 것, 자신의 소셜 미디어 약력에 자신이 좋아하는 새로운 밴드의 목록을 작성하는 것, 그리고 게시판에서 새로운 음악에 대해 끊임없이 논쟁하는 것을 가능하게 했다.", "그 결과는 비평가들이 이제 자신의 비평을 쓰기 전에 특정한 앨범에 관한 대중의 의견을 접할 수 있다는 것이었다.", "따라서, 음악 비평이 (그것들이 인터넷 이전 시대에 그랬듯이) 예술에 대한 여론을 이끄는 대신에, 음악 비평은 의식적으로든 혹은 잠재의식적으로든 여론을 반영하기 시작했다."], "ps": [{"n": 1, "ch": [{"e": "<b>Prior to<\/b> file-sharing services,", "k": "파일 공유 서비스(의 등장) 이전에,"}, {"e": "music albums landed", "k": "음악 앨범은 들어갔다"}, {"e": "<b>exclusively<\/b> in the hands of music <b>critics<\/b>", "k": "음악 비평가의 수중에 독점적으로"}, {"e": "before their <b>release<\/b>.", "k": "그것들<span class=\"r\">(= 음악 앨범)<\/span>의 발매 전에."}], "link": "파일 공유 서비스(의 등장) 이전에, 음악 앨범은 발매 전에 음악 비평가의 수중에 독점적으로 들어갔다.", "easy": "예전에는 앨범이 나오기 전에 비평가들만 먼저 그 음악을 받아 들을 수 있었어요.", "gist": "과거 — 비평가만 먼저 음악을 들었어요."}, {"n": 2, "ch": [{"e": "These critics would listen to them", "k": "이러한 비평가들은 그것들<span class=\"r\">(= 음악 앨범)<\/span>을 듣곤 했다"}, {"e": "well before the general public could", "k": "일반 대중이 들을 수 있기 훨씬 전에"}, {"e": "and <b>preview<\/b> them", "k": "그리고 그것들<span class=\"r\">(= 음악 앨범)<\/span>에 대한 시사평을 쓰곤 했다"}, {"e": "for the rest of the world", "k": "세상의 나머지 사람들을 위해"}, {"e": "in their reviews.", "k": "자신의 비평에."}], "link": "이러한 비평가들은 일반 대중이 들을 수 있기 훨씬 전에 그것들을 듣고, 세상의 나머지 사람들을 위해 자신의 비평에 그것들에 대한 시사평을 쓰곤 했다.", "easy": "비평가가 먼저 듣고 그 앨범에 대한 평을 써서 다른 사람들에게 알려 줬다는 말이에요.", "gist": "과거 — 비평가가 대중보다 앞서 있었어요."}, {"n": 3, "ch": [{"e": "Once the internet made music easily <b>accessible<\/b>", "k": "일단 인터넷이 음악을 쉽게 접할 수 있게 만들고"}, {"e": "and allowed even advanced releases", "k": "심지어 사전 발매 음반마저도 ~할 수 있게 하자"}, {"e": "to spread through online social networks,", "k": "온라인 소셜 네트워크를 통해 유포될,"}, {"e": "<b>availability<\/b> of new music became <b>democratized<\/b>,", "k": "새로운 음악의 이용 가능성이 민주화되었고,"}, {"e": "which meant >3</sup> to spread through online social networks\u0002, / availability \u0001of new music\u0002 became democratized<sup>4</sup>, / \u0001which meant critics no longer had unique access<sup>5</sup>\u0002.", "pk": "\u0001일단 인터넷이 음악을 쉽게 접할 수 있게 만들고\u0002 / \u0001심지어 사전 발매 음반마저 온라인 소셜 네트워크를 통해 퍼져 나가도록 허용하자\u0002, / 새로운 음악의 이용 가능성은 민주화되었고, / \u0001그것은 비평가들이 더 이상 독점적인 접근권을 갖지 못한다는 것을 의미했다\u0002.", "core": "새로운 음악의 이용 가능성은 민주화되었다.", "tags": ["(Once … accessible) = 부사절(시간): 주절 전체를 꾸밈. 안에서 made + 음악 + 보어 accessible: 5형식", "(and allowed … networks) = 앞 부사절에 이어지는 <b>병렬</b>. allow A to V: 5형식", "주어 availability + 동사 became + 보어 democratized: 2형식. (of new music) = 전치사구(형용사구): availability를 꾸밈", "(which meant …) = <b>계속적 관계절</b>(형용사절): 앞 내용 전체를 받음, '그리고 그것은 ~'"], "steps": [{"t": "이 문장은 <b>Once절 + S+V+C(2형식) + 계속적 관계절</b>이다. Once절 안에서 5형식 두 개가 병렬되어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: availability of new music (새로운 음악의 이용 가능성)", "V: became", "C: democratized (democratize 민주화하다의 과거분사 = 민주화된)", "뼈대 = <b>availability became democratized</b>"]}, {"t": "<b>Once ~ networks</b>는 <b>부사절(시간)</b>이다. 일단 ~하자라는 뜻이다. 주어 the internet에 동사가 둘이다.", "sub": ["made music easily accessible = 음악을 쉽게 접근할 수 있게 만들었다 (make + O + C, accessible 접근 가능한)", "and allowed even advanced releases to spread through online social networks = 사전 발매 음반마저 온라인 소셜 네트워크를 통해 퍼지도록 허용했다 (allow + O + to V, release 발매 음반)"]}, {"t": "<b>which meant critics no longer had unique access</b>는 <b>계속적 관계절</b>이다.", "sub": ["which = 앞 절 전체 내용 (음악의 이용 가능성이 민주화된 것)", "meant (mean 의미하다) 뒤에 that이 생략된 목적어절: critics no longer had unique access = 비평가들이 더 이상 독점적 접근권을 갖지 못했다 (no longer 더 이상 ~않다)"]}, {"t": "함정: allowed는 Once절 안의 동사이고, 문장의 주절 동사는 became이다. 쉼표 위치를 기준으로 구분한다."}], "sum": "인터넷이 음악 접근을 열자 음악의 이용 가능성이 민주화, 비평가의 독점 끝"}, {"i": "04", "q": "03", "s": "5", "title": "enable A to V — to부정사 세 개 병렬", "eng": "Social media services also enabled<sup>1</sup> people to publicize<sup>2</sup> their views on new songs, / list their new favorite bands in their social media bios<sup>3</sup>, / and argue over<sup>4</sup> new music endlessly<sup>5</sup> on message boards.", "notes": [["1", "enable A to V", "A가 ~할 수 있게 하다"], ["2", "publicize", "널리 알리다, 광고하다"], ["3", "bio", "약력, 자기소개란"], ["4", "argue over", "~을 두고 논쟁하다"], ["5", "endlessly", "끝없이"]], "lit": "소셜 미디어 서비스는 또한 사람들이 새로운 노래에 대한 자신의 견해를 널리 알리고, / 자신의 소셜 미디어 약력에 새로 좋아하게 된 밴드를 나열하고, / 게시판에서 새로운 음악에 대해 끝없이 논쟁하는 것을 가능하게 했다.", "nat": "소셜 미디어 서비스는 또한 사람들이 새 노래에 대한 견해를 널리 알리고, 소셜 미디어 약력에 새로 좋아하게 된 밴드를 적어 넣고, 게시판에서 새 음악을 두고 끝없이 논쟁할 수 있게 해 주었다.", "ana": "<b>enable + 목적어 + to부정사</b>가 뼈대다. 함정은 to부정사가 <b>세 개</b>라는 점이다. 두 번째 <b>list</b>와 세 번째 <b>argue</b> 앞에는 to가 보이지 않지만, 이는 <b>반복되는 to가 생략</b>된 것이다. 즉 to publicize, (to) list, (to) argue 세 덩어리가 <b>and</b>로 묶여 있다. 이렇게 동사원형처럼 보이는 단어가 콤마 뒤에 툭 나오면, <b>앞에 to부정사가 있었는지</b>부터 확인해야 한다. list를 명사 '목록'으로 읽으면 문장이 통째로 무너진다. 여기서 list는 '<b>~을 목록에 올리다, 나열하다</b>'라는 동사다. <b>argue over</b>는 '<b>~을 두고 논쟁하다</b>'라는 뜻이다.", "pe": "Social media services \u0001also\u0002 enabled<sup>1</sup> people to publicize<sup>2</sup> their views \u0001on new songs\u0002, / list their \u0001new favorite\u0002 bands \u0001in their social media bios<sup>3</sup>\u0002, / and argue \u0001over<sup>4</sup> new music\u0002 \u0001endlessly<sup>5</sup>\u0002 \u0001on message boards\u0002.", "pk": "소셜 미디어 서비스는 \u0001또한\u0002 사람들이 \u0001새로운 노래에 대한\u0002 자신의 견해를 널리 알리고, / \u0001자신의 소셜 미디어 약력에\u0002 새로 좋아하게 된 밴드를 나열하고, / \u0001게시판에서\u0002 \u0001새로운 음악에 대해\u0002 끝없이 논쟁하는 것을 가능하게 했다.", "core": "서비스는 사람들이 알리고, 나열하고, 논쟁하도록 가능하게 했다.", "tags": ["주어 services + 동사 enabled + 목적어 people + 목적격보어 to publicize ~: 5형식. (also) = 부사: enabled를 꾸밈, (on new songs) = 전치사구(형용사구): views를 꾸밈", "(to) list their bands: <b>병렬</b>(to 생략). (in their social media bios) = 전치사구(부사구): list를 꾸밈, (new favorite) = 형용사: bands를 꾸밈", "(to) argue: <b>병렬</b>. (over new music) = 전치사구(부사구): argue를 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]. (endlessly), (on message boards) = argue를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식)</b>이다. 목적격보어 to부정사가 세 개 병렬되어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: social media services (소셜 미디어 서비스)", "V: enabled (enable 가능하게 하다의 과거형)", "O: people (사람들)", "C: to publicize ~ (널리 알리도록)", "also = 또한 (enabled를 꾸미는 부사)", "뼈대 = <b>Social media services enabled people to publicize ~</b>"]}, {"t": "C 자리에 to부정사 세 개가 나열된다. 뒤의 둘은 to가 생략되어 동사원형으로만 보인다.", "sub": ["to publicize their views on new songs = 새 노래에 대한 자신의 견해를 널리 알리다 (their = people, view 견해, publicize 공표하다)", "(to) list their new favorite bands in their social media bios = 소셜 미디어 약력에 새로 좋아하는 밴드를 나열하다 (list 나열하다, bio 약력)", "and (to) argue over new music endlessly on message boards = 게시판에서 새 음악을 두고 끝없이 논쟁하다 (argue over ~을 두고 논쟁하다)"]}, {"t": "<b>over new music</b>은 argue가 거의 필수로 요구하는 전치사구이고, <b>endlessly</b>(끝없이), <b>on message boards</b>(게시판에서)는 argue를 꾸민다."}, {"t": "함정: list와 argue는 새 동사가 아니라 enabled의 보어 to publicize와 병렬된 to부정사이다. 과거형이 아니라 원형인 것이 단서이다."}], "sum": "소셜 미디어가 사람들이 견해를 알리고 밴드를 적고 논쟁하게 해 줌"}, {"i": "05", "q": "04", "s": "3", "title": "S+V+C + 분사구문 followed by + 계속적 which", "eng": "Cattle<sup>1</sup> were the most used animals in research both in 2014 and in 2015, / followed by<sup>2</sup> mice / which accounted for<sup>3</sup> over 18% and over 21% respectively<sup>4</sup>.", "notes": [["1", "cattle", "소(집합적으로 복수 취급)"], ["2", "A be followed by B", "A 뒤에 B가 뒤따르다"], ["3", "account for", "(비율을) 차지하다"], ["4", "respectively", "각각, 저마다"]], "lit": "소는 2014년과 2015년 둘 다에서 연구에 가장 많이 사용된 동물이었고, / 그 뒤를 쥐가 이었는데, / 그것은 각각 18퍼센트 넘게 그리고 21퍼센트 넘게 차지했다.", "nat": "소는 2014년과 2015년 모두 연구에 가장 많이 사용된 동물이었고, 그 뒤를 쥐가 이었는데 쥐는 각각 18퍼센트 넘게, 21퍼센트 넘게 차지했다.", "ana": "<b>followed by</b>는 도표 문제에 거의 매번 나오는 표현이다. <b>A is followed by B</b>는 '<b>A 뒤에 B가 뒤따른다</b>', 즉 <b>A가 1위고 B가 그다음</b>이라는 뜻이다. 순서를 거꾸로 읽으면 정답과 오답이 통째로 뒤집히니 반드시 외워 두자. 여기서는 콤마 뒤에 <b>(being) followed by</b>의 형태로 <b>분사구문</b>이 되어 앞 문장 전체를 이어받는다. 뒤의 <b>which</b>는 바로 앞의 <b>mice</b>를 받는 <b>주격 관계대명사</b>이며, 뒤에 주어 없이 동사 accounted가 바로 오는 것이 그 증거다. <b>account for</b>는 여기서 '<b>(비율을) 차지하다</b>'라는 뜻이고, <b>respectively</b>는 '<b>각각</b>'으로 앞에 나온 두 해와 두 수치를 <b>순서대로</b> 짝지어 읽으라는 신호다.", "pe": "Cattle<sup>1</sup> were the \u0001most used\u0002 animals \u0001in research\u0002 \u0001both in 2014 and in 2015\u0002, / \u0001followed by<sup>2</sup> mice\u0002 / \u0001which accounted for<sup>3</sup> over 18% and over 21% respectively<sup>4</sup>\u0002.", "pk": "소는 2014년과 2015년 둘 다에서 연구에 가장 많이 사용된 동물이었고, / 그 뒤를 쥐가 이었는데, / 그것은 각각 18퍼센트 넘게 그리고 21퍼센트 넘게 차지했다.", "core": "소는 가장 많이 사용된 동물이었다.", "tags": ["주어 Cattle + 동사 were + 보어 animals: 2형식. (most used), (in research) = animals를 꾸밈, (both in 2014 and in 2015) = 전치사구(부사구): 시점", "(followed by mice) = 과거분사구(분사구문, 부사적: 부대상황): 앞 절을 꾸밈. 수동 분사 followed", "(which accounted for …) = <b>계속적 관계절</b>(형용사절): mice를 꾸밈. respectively = 각각"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 뒤에 수동 분사구문과 계속적 관계절이 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: cattle (소)", "V: were", "C: the most used animals in research (연구에서 가장 많이 사용된 동물. most used는 최상급 + 과거분사)", "뼈대 = <b>Cattle were the most used animals</b>", "cattle은 복수로 취급한다."]}, {"t": "<b>both in 2014 and in 2015</b>는 시점을 말하는 전치사구(부사구)이다. 2014년과 2015년 모두라는 뜻이다."}, {"t": "<b>followed by mice</b>는 <b>수동 분사구문(부대상황)</b>이다.", "sub": ["follow 뒤따르다의 과거분사 = 뒤따라진 → 그 뒤를 쥐가 이었다", "의미상 주어 = cattle"]}, {"t": "<b>which accounted for over 18% and over 21% respectively</b>는 <b>계속적 관계절</b>로 mice를 설명한다.", "sub": ["which = mice (쥐)  account for = ~을 차지하다", "over 18% and over 21% = 18퍼센트 넘게, 21퍼센트 넘게", "respectively = 각각 (2014년에 18퍼센트, 2015년에 21퍼센트 순서)"]}], "sum": "소가 최다 실험동물이고 그 뒤가 쥐, 각각 18퍼센트와 21퍼센트 넘게 차지"}, {"i": "06", "q": "05", "s": "1", "title": "분사구문 + 지각동사 see O -ing", "eng": "Coming home from work the other day<sup>1</sup>, / I saw a woman trying to turn onto<sup>2</sup> the main street / and having very little luck<sup>3</sup> because of the constant<sup>4</sup> stream of traffic.", "notes": [["1", "the other day", "며칠 전에"], ["2", "turn onto", "~로 방향을 틀어 들어서다"], ["3", "have little luck", "운이 따르지 않다"], ["4", "constant", "끊임없는"]], "lit": "며칠 전 직장에서 집으로 돌아오다가, / 나는 한 여자가 큰길로 들어서려고 애쓰는 것을 보았다 / 그리고 끊임없는 차량 행렬 때문에 좀처럼 운이 따르지 않는 것을.", "nat": "며칠 전 퇴근길에, 나는 한 여자가 큰길로 들어서려고 애쓰지만 끊임없이 이어지는 차량 행렬 때문에 좀처럼 그러지 못하는 것을 보았다.", "ana": "문장이 <b>Coming</b>으로 시작하는데 주어가 없다. 이것이 <b>분사구문</b>의 신호다. 분사구문의 주인은 주절의 주어 <b>I</b>이므로 '<b>내가 집으로 오다가</b>'로 읽는다. 주절은 <b>지각동사 see</b>가 쓰인 <b>5형식</b>이다. <b>see + 목적어 + 목적격 보어</b>에서 보어 자리에는 <b>동사원형</b>이나 <b>현재분사</b>가 온다. 여기서는 '<b>애쓰고 있는 중</b>'이라는 진행의 느낌을 살려 <b>trying</b>이 왔다. 핵심은 뒤의 <b>having</b>이다. 이것은 새로운 동사가 아니라 <b>trying과 나란히 놓인 두 번째 목적격 보어</b>로, and가 둘을 묶고 있다. 어법 문제에서 이 자리를 <b>had</b>로 바꿔 놓으면 틀린 것이 된다. <b>have little luck</b>은 '<b>운이 따르지 않다, 잘 되지 않다</b>'라는 뜻이다.", "pe": "\u0001Coming home from work the other day<sup>1</sup>\u0002, / I saw a woman trying to turn \u0001onto<sup>2</sup> the main street\u0002 / and having \u0001very\u0002 little luck<sup>3</sup> \u0001because of the constant<sup>4</sup> stream of traffic\u0002.", "pk": "\u0001며칠 전 직장에서 집으로 돌아오다가\u0002, / 나는 한 여자가 \u0001큰길로\u0002 들어서려고 애쓰는 것을 보았다 / 그리고 \u0001끊임없는 차량 행렬 때문에\u0002 좀처럼 운이 따르지 않는 것을.", "core": "나는 한 여자가 애쓰고 있고 운이 따르지 않는 것을 보았다.", "tags": ["(Coming home … the other day) = 현재분사구(분사구문, 부사적: 시간): 주절을 꾸밈", "주어 I + 동사 saw + 목적어 a woman + 보어 trying: 5형식. (onto the main street) = 전치사구(부사구): turn을 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "(and) having very little luck: 목적격보어 trying과 <b>병렬</b>. (very) = 부사: little을 꾸밈, (because of … traffic) = 전치사구(부사구: 이유): having을 꾸밈"], "steps": [{"t": "이 문장은 <b>분사구문 + S+V+O+C(5형식)</b>이다. 보어가 -ing 두 개로 병렬되어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: I (나)", "V: saw (see 보다의 과거형)", "O: a woman (한 여자)", "C: trying ~ and having ~ (애쓰는 것과 ~ 좀처럼 되지 않는 것)", "뼈대 = <b>I saw a woman trying ~ and having ~</b>", "지각동사 see + O + -ing = O가 ~하고 있는 것을 보다"]}, {"t": "<b>Coming home from work the other day</b>는 <b>분사구문(부사 덩어리, 시간)</b>이다.", "sub": ["의미상 주어 = 주절 주어 I (나)", "come home from work = 퇴근해 집에 오다", "the other day = 며칠 전"]}, {"t": "보어 두 덩어리이다.", "sub": ["trying to turn onto the main street = 큰길로 들어서려고 애쓰는 (turn onto ~로 들어서다)", "and having very little luck because of the constant stream of traffic = 끊임없이 이어지는 차량 행렬 때문에 거의 운이 따르지 않는 (have little luck 운이 거의 없다, constant 끊임없는, stream 흐름, traffic 교통량)"]}, {"t": "함정: Coming의 주인은 a woman이 아니라 I이다. 퇴근길에 있던 사람은 나이다."}], "sum": "퇴근길, 차량 행렬 때문에 큰길 진입에 애먹는 여자를 봄"}, {"i": "07", "q": "06", "s": "4", "title": "By -ing 전치사구 + S+V+O + 목적격 관계절", "eng": "By dismissing<sup>1</sup> non-Western scientific paradigms as inferior<sup>2</sup> at best<sup>3</sup> and inaccurate at worst, / the most rigid<sup>4</sup> members of the conventional medical research community try to counter the threat / that alternative therapies and research pose<sup>5</sup> to their work, their well-being, and their worldviews.", "notes": [["1", "dismiss A as B", "A를 B라고 묵살하다"], ["2", "inferior", "열등한"], ["3", "at best", "기껏해야"], ["4", "rigid", "완고한, 경직된"], ["5", "pose A to B", "B에게 A를 가하다"]], "lit": "비서양의 과학적 패러다임을 기껏해야 열등하고 최악의 경우 부정확하다고 묵살함으로써, / 전통적인 의학 연구 단체의 가장 완고한 구성원들은 그 위협에 맞서려 한다 / 대체 요법과 연구가 자신들의 연구, 자신들의 행복, 자신들의 세계관에 가하는 (그 위협에).", "nat": "비서양의 과학적 패러다임을 기껏해야 열등하고 최악의 경우 부정확하다고 묵살함으로써, 전통적인 의학 연구 단체의 가장 완고한 구성원들은 대체 요법과 연구가 자신들의 연구와 행복, 세계관에 가하는 위협에 맞서려 한다.", "ana": "<b>By ~ing</b>는 '<b>~함으로써</b>'라는 <b>수단·방법</b>의 전치사구다. 전치사 by 뒤이므로 dismiss가 아니라 <b>dismissing</b>이 온 것이다. 그 안의 <b>dismiss A as B</b>는 '<b>A를 B라고 치부하다·묵살하다</b>'라는 틀이며, B 자리에 형용사 두 개(inferior, inaccurate)가 <b>and</b>로 병렬되어 있다. 주절의 주어는 길지만 핵심은 <b>members</b> 하나이고, 동사는 <b>try</b>다. 문제는 맨 뒤의 <b>that</b>이다. 뒤에 <b>주어(alternative therapies and research) + 동사(pose)</b>가 오는데 <b>pose의 목적어가 비어 있다</b>. 목적어가 비어 있으면 그 that은 접속사가 아니라 <b>목적격 관계대명사</b>이고, 앞의 <b>the threat</b>을 받는다. <b>pose A to B</b>는 '<b>B에게 A(위협 등)를 가하다</b>'라는 뜻이다.", "pe": "\u0001By dismissing<sup>1</sup> non-Western scientific paradigms as inferior<sup>2</sup> at best<sup>3</sup> and inaccurate at worst\u0002, / the \u0001most rigid<sup>4</sup>\u0002 members \u0001of the conventional medical research community\u0002 try to counter the threat / \u0001that alternative therapies and research pose<sup>5</sup> to their work, their well-being, and their worldviews\u0002.", "pk": "\u0001비서양의 과학적 패러다임을 기껏해야 열등하고 최악의 경우 부정확하다고 묵살함으로써\u0002, / \u0001전통적인 의학 연구 단체의\u0002 \u0001가장 완고한\u0002 구성원들은 그 위협에 맞서려 한다 / 대체 요법과 연구가 자신들의 연구, 자신들의 행복, 자신들의 세계관에 가하는 (그 위협에).", "core": "구성원들은 위협에 맞서려 한다.", "tags": ["(By dismissing … at worst) = 전치사구(부사구: 수단): try to counter를 꾸밈. dismiss A as B = A를 B라고 묵살하다", "주어 members + 동사 try + 목적어 to counter the threat: 3형식. (most rigid) = 형용사, (of the conventional … community) = 형용사구: members를 꾸밈", "(that alternative therapies … worldviews) = 관계절(형용사절, 목적격 관계대명사 that): the threat를 꾸밈. pose A to B = A를 B에 가하다"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 앞의 by 전치사구와 뒤의 관계절 때문에 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the most rigid members (가장 완고한 구성원들. rigid 완고한)", "V: try (노력하다)", "O: to counter the threat (위협에 맞서려는 것. counter 맞서다, threat 위협)", "뼈대 = <b>the most rigid members try to counter the threat</b>", "of the conventional medical research community = members를 꾸미는 형용사구. 전통적인 의학 연구 단체의"]}, {"t": "<b>By dismissing ~ at worst</b>는 수단을 말하는 전치사구(부사구, by + 동명사)이다.", "sub": ["dismiss A as B = A를 B로 묵살하다 (3형식 + as)", "non-Western scientific paradigms = 비서양의 과학적 패러다임", "inferior at best (기껏해야 열등한) and inaccurate at worst (최악의 경우 부정확한)"]}, {"t": "<b>that alternative therapies and research pose to their work, their well-being, and their worldviews</b>는 <b>목적격 관계절</b>로 the threat를 꾸민다.", "sub": ["that = the threat (pose의 목적어 자리가 비어 있음)", "S: alternative therapies and research (대체 요법과 연구)  V: pose (pose 제기하다, 가하다)", "to A, B, and C = 자신들의 연구, 행복, 세계관에 (their = members)"]}, {"t": "함정: pose가 복수 동사인 이유는 주어가 therapies and research로 복수이기 때문이다. the threat 뒤 that은 주어가 아니라 목적어 자리를 비운 관계대명사이다."}], "sum": "완고한 연구자들, 대체 요법이 가하는 위협을 묵살로 막으려 함"}, {"i": "08", "q": "06", "s": "5", "title": "S+V+O(many of) + 주격 관계절", "eng": "And yet<sup>1</sup>, / biomedical<sup>2</sup> research cannot explain many of the phenomena<sup>3</sup> / that concern<sup>4</sup> alternative practitioners<sup>5</sup> regarding caring-healing processes.", "notes": [["1", "and yet", "그럼에도 불구하고"], ["2", "biomedical", "생물 의학의"], ["3", "phenomenon", "현상(복수형 phenomena)"], ["4", "concern", "~와 관련되다, ~의 관심사이다"], ["5", "practitioner", "시술자, 개업의"]], "lit": "그럼에도 불구하고, / 생물 의학 연구는 그 현상들 중 많은 것을 설명하지 못한다 / 돌봄·치유 과정과 관련하여 대체 의학 시술자들이 관심을 갖는 (그 현상들 중).", "nat": "그럼에도 불구하고 생물 의학 연구는, 돌봄·치유 과정과 관련하여 대체 의학 시술자들이 관심을 갖는 현상들 중 많은 것을 설명하지 못한다.", "ana": "맨 앞의 <b>And yet</b>은 '<b>그럼에도 불구하고</b>'라는 <b>역접</b> 신호다. 앞 문장까지는 완고한 연구자들이 대체 요법을 <b>묵살한다</b>는 내용이었는데, 여기서 방향이 꺾인다. 어휘 문항에서는 이런 <b>역접 표시</b>가 곧 글의 방향이 바뀌는 지점이므로 반드시 표시해 두어야 한다. 구조의 핵심은 <b>that</b>이다. 뒤에 주어 없이 동사 <b>concern</b>이 바로 오므로 <b>주격 관계대명사</b>이며, 앞의 <b>the phenomena</b>를 꾸민다. 이때 <b>concern</b>은 '<b>걱정시키다</b>'가 아니라 '<b>~와 관련되다, ~의 관심사이다</b>'라는 뜻으로 쓰였다. 익숙한 뜻만 붙이면 문장이 통째로 어긋난다. <b>phenomena</b>는 <b>phenomenon</b>의 복수형이고, <b>many of the phenomena</b>처럼 <b>부분 표현 + of + 명사</b> 뒤에서는 동사의 수를 <b>of 뒤 명사</b>에 맞춘다.", "pe": "\u0001And yet<sup>1</sup>\u0002, / \u0001biomedical<sup>2</sup>\u0002 research cannot explain many \u0001of the phenomena<sup>3</sup>\u0002 / \u0001that concern<sup>4</sup> alternative practitioners<sup>5</sup> regarding caring-healing processes\u0002.", "pk": "\u0001그럼에도 불구하고\u0002, / \u0001생물 의학\u0002 연구는 그 현상들 중 많은 것을 설명하지 못한다 / \u0001돌봄·치유 과정과 관련하여 대체 의학 시술자들이 관심을 갖는\u0002 (그 현상들 중).", "core": "연구는 많은 것을 설명하지 못한다.", "tags": ["(And yet) = 접속부사: 문장 전체를 꾸밈", "주어 research + 동사 cannot explain + 목적어 many: 3형식. (biomedical) = 형용사: research를 꾸밈, (of the phenomena) = 전치사구(형용사구): many를 꾸밈", "(that concern … processes) = 관계절(형용사절): the phenomena를 꾸밈. concern = 동사 '~의 관심을 끌다'"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 many of ~ 뒤에 관계절이 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: biomedical research (생물 의학 연구. biomedical 생물 의학의)", "V: cannot explain (explain 설명하다)", "O: many (많은 것) of the phenomena (그 현상들 중. phen function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
const CMAP={"01-3": [["030", "5형식"], ["037-H1", "병렬 구조"]], "03-3": [["083", "관계대명사 계속적 용법"]], "03-5": [["037-H1", "병렬 구조"]], "04-3": [["083", "관계대명사 계속적 용법"], ["072", "분사구문"]], "05-1": [["072", "분사구문"], ["031", "지각동사"]], "06-4": [["079", "목적격 관계대명사"], ["078", "관계대명사"]], "06-5": [["080", "주격 관계대명사"], ["078", "관계대명사"]]};
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  const cc=(CMAP[c.q+'-'+c.s]||[]);
  const back=encodeURIComponent(location.origin+location.pathname);
  let x='<div class="sc open"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span></div><div class="sc-b">';
  if(cc.length){x+='<div class="cks">'+cc.map(k=>'<a class="cchip" href="https://nolbada.github.io/via-mid/m/grammarcock/?c='+k[0]+'&back='+back+'">개념톡 · '+k[1]+' →</a>').join('')+'</div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='<div class="fin n1"><b>자연스러운 해석</b>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm)x+='<div class="fin n2"><b>한 줄 정리</b>'+esc(sm)+'</div>';
  x+='</div></div>';
  return x;
}

function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
