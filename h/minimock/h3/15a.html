<title>고3 미니모의고사 15회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

(function(W){

  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}

  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}

    var n=name(),Q=jq(QK),H=jq(HK);

    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';

    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){

        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

function dwToast(m){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1800);}
function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}
document.addEventListener('click',function(e){
  const el=e.target.closest&&e.target.closest('.dw');if(!el)return;
  e.stopPropagation();e.preventDefault();
  const p=el.closest('[data-q]');const it=p&&dwItem(p.dataset.q,el.dataset.k);if(!it)return;
  const head=it[2]||it[0],mean=it[1];S.dw=S.dw||{};const on=!S.dw[head];
  if(on)S.dw[head]=1;else delete S.dw[head];save();dwMark(head,on);
  if(on){try{WN.add([{w:head,m:mean,src:'미니모고',how:'별표',ask:true}]);}catch(err){}dwToast(head.replace(/\s+[AB](?=\s|$)/g,'').trim()+'  '+mean.replace(/\bA(?=[에를은는이가와과의도]|\s)|\bB(?=[에를은는이가와과의도]|\s)/g,'').replace(/\s+/g,' ').trim()+'  담음');}
  else{let pr=null;try{pr=WN.del(head,'미니모고');}catch(err){}
    if(pr&&pr.then)pr.then(function(r){if(r&&r.removed===false&&r.reason==='late'){S.dw[head]=1;save();dwMark(head,true);dwToast('이미 쌓인 단어라 뺄 수 없어요');}else if(r&&r.removed)dwToast(head+'  뺌');});

},true);

e you to join us</b>"]}, {"t": "<b>at the 20th Virginia Art Show</b>는 전치사구(부사구)로 join을 꾸민다. 제20회 Virginia 미술 전시회에서라는 뜻이다."}, {"t": "<b>famed all along the east coast</b>는 <b>형용사구</b>로 Art Show를 뒤에서 꾸민다.", "sub": ["famed = 유명한 (fame 명성에서 나온 형용사. 동사로 착각하지 않는다)", "all along the east coast = 동부 해안 전역에 걸쳐"]}, {"t": "<b>for the variety and quality of its exhibits</b>는 이유를 말하는 전치사구(부사구)로 famed를 꾸민다. 전시품의 다양성과 우수성으로라는 뜻이다 (variety 다양성, quality 질, exhibit 전시품, its = Art Show의)."}], "sum": "저희와 함께해 달라는 초대, 다양한 전시로 유명한 미술 전시회"}, {"i": "03", "q": "03", "s": "3", "title": "Once절 + 주절 + 계속적 which", "eng": "Once<sup>1</sup> the internet made music easily accessible<sup>2</sup> / and allowed even advanced releases<sup>3</sup> to spread through online social networks, / availability of new music became democratized<sup>4</sup>, / which meant critics no longer had unique access<sup>5</sup>.", "notes": [["1", "once", "일단 ~하자, ~하고 나자"], ["2", "accessible", "접근할 수 있는"], ["3", "advanced release", "사전 발매(음반)"], ["4", "democratize", "민주화하다"], ["5", "unique access", "독점적인 접근권"]], "lit": "일단 인터넷이 음악을 쉽게 접할 수 있게 만들고 / 심지어 사전 발매 음반마저 온라인 소셜 네트워크를 통해 퍼져 나가도록 허용하자, / 새로운 음악의 이용 가능성은 민주화되었고, / 그것은 비평가들이 더 이상 독점적인 접근권을 갖지 못한다는 것을 의미했다.", "nat": "인터넷이 음악을 쉽게 접할 수 있게 만들고 사전 발매 음반마저 온라인 소셜 네트워크를 통해 퍼지도록 허용하자, 새로운 음악의 이용 가능성이 민주화되었고, 이는 비평가들이 더 이상 독점적인 접근권을 갖지 못하게 되었음을 의미했다.", "ana": "맨 앞의 <b>Once</b>는 숫자 '한 번'이 아니라 '<b>일단 ~하자, ~하고 나자</b>'라는 <b>접속사</b>다. 뒤에 <b>주어(the internet) + 동사(made)</b>가 바로 이어지는 것이 그 증거다. 이 부사절 안에 동사가 <b>made</b>와 <b>allowed</b> 두 개 있고 and로 묶인 <b>병렬</b>이다. 앞은 <b>make + 목적어 + 형용사 보어</b>(music … accessible), 뒤는 <b>allow + 목적어 + to부정사</b>로 틀이 서로 다르다는 점에 주의하자. 주절은 콤마 뒤 <b>availability … became democratized</b>이며, 마지막 <b>which</b>는 앞에 콤마가 있으므로 <b>계속적 용법</b>이다. 계속적 용법의 which는 앞의 <b>문장 전체</b>를 받아 '<b>그리고 그것은</b>'으로 이어 읽는다. 앞 명사 하나만 받는다고 생각하면 해석이 꼬인다.", "pe": "\u0001Once<sup>1</sup> the internet made music easily accessible<sup>2</sup>\u0002 / \u0001and allowed even advanced releases<sup>3</sup> to spread through online social networks\u0002, / availability \u0001of new music\u0002 became democratized<sup>4</sup>, / \u0001which meant critics no longer had unique access<sup>5</sup>\u0002.", "pk": "\u0001일단 인터넷이 음악을 쉽게 접할 수 있게 만들고\u0002 / \u0001심지어 사전 발매 음반마저 온라인 소셜 네트워크를 통해 퍼져 나가도록 허용하자\u0002, / 새로운 음악의 이용 가능성은 민주화되었고, / \u0001그것은 비평가들이 더 이상 독점적인 접근권을 갖지 못한다는 것을 의미했다\u0002.", "core": "새로운 음악의 이용 가능성은 민주화되었다.", "tags": ["(Once … accessible) = 부사절(시간): 주절 전체를 꾸밈. 안에서 made + 음악 + 보어 accessible: 5형식", "(and allowed … networks) = 앞 부사절에 이어지는 <b>병렬</b>. allow A to V: 5형식", "주어 availability + 동사 became + 보어 democratized: 2형식. (of new music) = 전치사구(형용사구): availability를 꾸밈", "(which meant …) = <b>계속적 관계절</b>(형용사절): 앞 내용 전체를 받음, '그리고 그것은 ~'"], "steps": [{"t": "이 문장은 <b>Once절 + S+V+C(2형식) + 계속적 관계절</b>이다. Once절 안에서 5형식 두 개가 병렬되어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: availability of new music (새로운 음악의 이용 가능성)", "V: became", "C: democratized (democratize 민주화하다의 과거분사 = 민주화된)", "뼈대 = <b>availability became democratized</b>"]}, {"t": "<b>Once ~ networks</b>는 <b>부사절(시간)</b>이다. 일단 ~하자라는 뜻이다. 주어 the internet에 동사가 둘이다.", "sub": ["made music easily accessible = 음악을 쉽게 접근할 수 있게 만들었다 (make + O + C, accessible 접근 가능한)", "and allowed even advanced releases to spread through online social networks = 사전 발매 음반마저 온라인 소셜 네트워크를 통해 퍼지도록 허용했다 (allow + O + to V, release 발매 음반)"]}, {"t": "<b>which meant critics no longer had unique access</b>는 <b>계속적 관계절</b>이다.", "sub": ["which = 앞 절 전체 내용 (음악의 이용 가능성이 민주화된 것)", "meant (mean 의미하다) 뒤에 that이 생략된 목적어절: critics no longer had unique access = 비평가들이 더 이상 독점적 접근권을 갖지 못했다 (no longer 더 이상 ~않다)"]}, {"t": "함정: allowed는 Once절 안의 동사이고, 문장의 주절 동사는 became이다. 쉼표 위치를 기준으로 구분한다."}], "sum": "인터넷이 음악 접근을 열자 음악의 이용 가능성이 민주화, 비평가의 독점 끝"}, {"i": "04", "q": "03", "s": "5", "title": "enable A to V — to부정사 세 개 병렬", "eng": "Social media services also enabled<sup>1</sup> people to publicize<sup>2</sup> their views on new songs, / list their new favorite bands in their social media bios<sup>3</sup>, / and argue over<sup>4</sup> new music endlessly<sup>5</sup> on message boards.", "notes": [["1", "enable A to V", "A가 ~할 수 있게 하다"], ["2", "publicize", "널리 알리다, 광고하다"], ["3", "bio", "약력, 자기소개란"], ["4", "argue over", "~을 두고 논쟁하다"], ["5", "endlessly", "끝없이"]], "lit": "소셜 미디어 서비스는 또한 사람들이 새로운 노래에 대한 자신의 견해를 널리 알리고, / 자신의 소셜 미디어 약력에 새로 좋아하게 된 밴드를 나열하고, / 게시판에서 새로운 음악에 대해 끝없이 논쟁하는 것을 가능하게 했다.", "nat": "소셜 미디어 서비스는 또한 사람들이 새 노래에 대한 견해를 널리 알리고, 소셜 미디어 약력에 새로 좋아하게 된 밴드를 적어 넣고, 게시판에서 새 음악을 두고 끝없이 논쟁할 수 있게 해 주었다.", "ana": "<b>enable + 목적어 + to부정사</b>가 뼈대다. 함정은 to부정사가 <b>세 개</b>라는 점이다. 두 번째 <b>list</b>와 세 번째 <b>argue</b> 앞에는 to가 보이지 않지만, 이는 <b>반복되는 to가 생략</b>된 것이다. 즉 to publicize, (to) list, (to) argue 세 덩어리가 <b>and</b>로 묶여 있다. 이렇게 동사원형처럼 보이는 단어가 콤마 뒤에 툭 나오면, <b>앞에 to부정사가 있었는지</b>부터 확인해야 한다. list를 명사 '목록'으로 읽으면 문장이 통째로 무너진다. 여기서 list는 '<b>~을 목록에 올리다, 나열하다</b>'라는 동사다. <b>argue over</b>는 '<b>~을 두고 논쟁하다</b>'라는 뜻이다.", "pe": "Social media services \u0001also\u0002 enabled<sup>1</sup> people to publicize<sup>2</sup> their views \u0001on new songs\u0002, / list their \u0001new favorite\u0002 bands \u0001in their social media bios<sup>3</sup>\u0002, / and argue \u0001over<sup>4</sup> new music\u0002 \u0001endlessly<sup>5</sup>\u0002 \u0001on message boards\u0002.", "pk": "소셜 미디어 서비스는 \u0001또한\u0002 사람들이 \u0001새로운 노래에 대한\u0002 자신의 견해를 널리 알리고, / \u0001자신의 소셜 미디어 약력에\u0002 새로 좋아하게 된 밴드를 나열하고, / \u0001게시판에서\u0002 \u0001새로운 음악에 대해\u0002 끝없이 논쟁하는 것을 가능하게 했다.", "core": "서비스는 사람들이 알리고, 나열하고, 논쟁하도록 가능하게 했다.", "tags": ["주어 services + 동사 enabled + 목적어 people + 목적격보어 to publicize ~: 5형식. (also) = 부사: enabled를 꾸밈, (on new songs) = 전치사구(형용사구): views를 꾸밈", "(to) list their bands: <b>병렬</b>(to 생략). (in their social media bios) = 전치사구(부사구): list를 꾸밈, (new favorite) = 형용사: bands를 꾸밈", "(to) argue: <b>병렬</b>. (over new music) = 전치사구(부사구): argue를 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]. (endlessly), (on message boards) = argue를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식)</b>이다. 목적격보어 to부정사가 세 개 병렬되어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: social media services (소셜 미디어 서비스)", "V: enabled (enable 가능하게 하다의 과거형)", "O: people (사람들)", "C: to publicize ~ (널리 알리도록)", "also = 또한 (enabled를 꾸미는 부사)", "뼈대 = <b>Social media services enabled people to publicize ~</b>"]}, {"t": "C 자리에 to부정사 세 개가 나열된다. 뒤의 둘은 to가 생략되어 동사원형으로만 보인다.", "sub": ["to publicize their views on new songs = 새 노래에 대한 자신의 견해를 널리 알리다 (their = people, view 견해, publicize 공표하다)", "(to) list their new favorite bands in their social media bios = 소셜 미디어 약력에 새로 좋아하는 밴드를 나열하다 (list 나열하다, bio 약력)", "and (to) argue over new music endlessly on message boards = 게시판에서 새 음악을 두고 끝없이 논쟁하다 (argue over ~을 두고 논쟁하다)"]}, {"t": "<b>over new music</b>은 argue가 거의 필수로 요구하는 전치사구이고, <b>endlessly</b>(끝없이), <b>on message boards</b>(게시판에서)는 argue를 꾸민다."}, {"t": "함정: list와 argue는 새 동사가 아니라 enabled의 보어 to publicize와 병렬된 to부정사이다. 과거형이 아니라 원형인 것이 단서이다."}], "sum": "소셜 미디어가 사람들이 견해를 알리고 밴드를 적고 논쟁하게 해 줌"}, {"i": "05", "q": "04", "s": "3", "title": "S+V+C + 분사구문 followed by + 계속적 which", "eng": "Cattle<sup>1</sup> were the most used animals in research both in 2014 and in 2015, / followed by<sup>2</sup> mice / which accounted for<sup>3</sup> over 18% and over 21% respectively<sup>4</sup>.", "notes": [["1", "cattle", "소(집합적으로 복수 취급)"], ["2", "A be followed by B", "A 뒤에 B가 뒤따르다"], ["3", "account for", "(비율을) 차지하다"], ["4", "respectively", "각각, 저마다"]], "lit": "소는 2014년과 2015년 둘 다에서 연구에 가장 많이 사용된 동물이었고, / 그 뒤를 쥐가 이었는데, / 그것은 각각 18퍼센트 넘게 그리고 21퍼센트 넘게 차지했다.", "nat": "소는 2014년과 2015년 모두 연구에 가장 많이 사용된 동물이었고, 그 뒤를 쥐가 이었는데 쥐는 각각 18퍼센트 넘게, 21퍼센트 넘게 차지했다.", "ana": "<b>followed by</b>는 도표 문제에 거의 매번 나오는 표현이다. <b>A is followed by B</b>는 '<b>A 뒤에 B가 뒤따른다</b>', 즉 <b>A가 1위고 B가 그다음</b>이라는 뜻이다. 순서를 거꾸로 읽으면 정답과 오답이 통째로 뒤집히니 반드시 외워 두자. 여기서는 콤마 뒤에 <b>(being) followed by</b>의 형태로 <b>분사구문</b>이 되어 앞 문장 전체를 이어받는다. 뒤의 <b>which</b>는 바로 앞의 <b>mice</b>를 받는 <b>주격 관계대명사</b>이며, 뒤에 주어 없이 동사 accounted가 바로 오는 것이 그 증거다. <b>account for</b>는 여기서 '<b>(비율을) 차지하다</b>'라는 뜻이고, <b>respectively</b>는 '<b>각각</b>'으로 앞에 나온 두 해와 두 수치를 <b>순서대로</b> 짝지어 읽으라는 신호다.", "pe": "Cattle<sup>1</sup> were the \u0001most used\u0002 animals \u0001in research\u0002 \u0001both in 2014 and in 2015\u0002, / \u0001followed by<sup>2</sup> mice\u0002 / \u0001which accounted for<sup>3</sup> over 18% and over 21% respectively<sup>4</sup>\u0002.", "pk": "소는 2014년과 2015년 둘 다에서 연구에 가장 많이 사용된 동물이었고, / 그 뒤를 쥐가 이었는데, / 그것은 각각 18퍼센트 넘게 그리고 21퍼센트 넘게 차지했다.", "core": "소는 가장 많이 사용된 동물이었다.", "tags": ["주어 Cattle + 동사 were + 보어 animals: 2형식. (most used), (in research) = animals를 꾸밈, (both in 2014 and in 2015) = 전치사구(부사구): 시점", "(followed by mice) = 과거분사구(분사구문, 부사적: 부대상황): 앞 절을 꾸밈. 수동 분사 followed", "(which accounted for …) = <b>계속적 관계절</b>(형용사절): mice를 꾸밈. respectively = 각각"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 뒤에 수동 분사구문과 계속적 관계절이 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: cattle (소)", "V: were", "C: the most used animals in research (연구에서 가장 많이 사용된 동물. most used는 최상급 + 과거분사)", "뼈대 = <b>Cattle were the most used animals</b>", "cattle은 복수로 취급한다."]}, {"t": "<b>both in 2014 and in 2015</b>는 시점을 말하는 전치사구(부사구)이다. 2014년과 2015년 모두라는 뜻이다."}, {"t": "<b>followed by mice</b>는 <b>수동 분사구문(부대상황)</b>이다.", "sub": ["follow 뒤따르다의 과거분사 = 뒤따라진 → 그 뒤를 쥐가 이었다", "의미상 주어 = cattle"]}, {"t": "<b>which accounted for over 18% and over 21% respectively</b>는 <b>계속적 관계절</b>로 mice를 설명한다.", "sub": ["which = mice (쥐)  account for = ~을 차지하다", "over 18% and over 21% = 18퍼센트 넘게, 21퍼센트 넘게", "respectively = 각각 (2014년에 18퍼센트, 2015년에 21퍼센트 순서)"]}], "sum": "소가 최다 실험동물이고 그 뒤가 쥐, 각각 18퍼센트와 21퍼센트 넘게 차지"}, {"i": "06", "q": "05", "s": "1", "title": "분사구문 + 지각동사 see O -ing", "eng": "Coming home from work the other day<sup>1</sup>, / I saw a woman trying to turn onto<sup>2</sup> the main street / and having very little luck<sup>3</sup> because of the constant<sup>4</sup> stream of traffic.", "notes": [["1", "the other day", "며칠 전에"], ["2", "turn onto", "~로 방향을 틀어 들어서다"], ["3", "have little luck", "운이 따르지 않다"], ["4", "constant", "끊임없는"]], "lit": "며칠 전 직장에서 집으로 돌아오다가, / 나는 한 여자가 큰길로 들어서려고 애쓰는 것을 보았다 / 그리고 끊임없는 차량 행렬 때문에 좀처럼 운이 따르지 않는 것을.", "nat": "며칠 전 퇴근길에, 나는 한 여자가 큰길로 들어서려고 애쓰지만 끊임없이 이어지는 차량 행렬 때문에 좀처럼 그러지 못하는 것을 보았다.", "ana": "문장이 <b>Coming</b>으로 시작하는데 주어가 없다. 이것이 <b>분사구문</b>의 신호다. 분사구문의 주인은 주절의 주어 <b>I</b>이므로 '<b>내가 집으로 오다가</b>'로 읽는다. 주절은 <b>지각동사 see</b>가 쓰인 <b>5형식</b>이다. <b>see + 목적어 + 목적격 보어</b>에서 보어 자리에는 <b>동사원형</b>이나 <b>현재분사</b>가 온다. 여기서는 '<b>애쓰고 있는 중</b>'이라는 진행의 느낌을 살려 <b>trying</b>이 왔다. 핵심은 뒤의 <b>having</b>이다. 이것은 새로운 동사가 아니라 <b>trying과 나란히 놓인 두 번째 목적격 보어</b>로, and가 둘을 묶고 있다. 어법 문제에서 이 자리를 <b>had</b>로 바꿔 놓으면 틀린 것이 된다. <b>have little luck</b>은 '<b>운이 따르지 않다, 잘 되지 않다</b>'라는 뜻이다.", "pe": "\u0001Coming home from work the other day<sup>1</sup>\u0002, / I saw a woman trying to turn \u0001onto<sup>2</sup> the main street\u0002 / and having \u0001very\u0002 little luck<sup>3</sup> \u0001because of the constant<sup>4</sup> stream of traffic\u0002.", "pk": "\u0001며칠 전 직장에서 집으로 돌아오다가\u0002, / 나는 한 여자가 \u0001큰길로\u0002 들어서려고 애쓰는 것을 보았다 / 그리고 \u0001끊임없는 차량 행렬 때문에\u0002 좀처럼 운이 따르지 않는 것을.", "core": "나는 한 여자가 애쓰고 있고 운이 따르지 않는 것을 보았다.", "tags": ["(Coming home … the other day) = 현재분사구(분사구문, 부사적: 시간): 주절을 꾸밈", "주어 I + 동사 saw + 목적어 a woman + 보어 trying: 5형식. (onto the main street) = 전치사구(부사구): turn을 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "(and) having very little luck: 목적격보어 trying과 <b>병렬</b>. (very) = 부사: little을 꾸밈, (because of … traffic) = 전치사구(부사구: 이유): having을 꾸밈"], "steps": [{"t": "이 문장은 <b>분사구문 + S+V+O+C(5형식)</b>이다. 보어가 -ing 두 개로 병렬되어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: I (나)", "V: saw (see 보다의 과거형)", "O: a woman (한 여자)", "C: trying ~ and having ~ (애쓰는 것과 ~ 좀처럼 되지 않는 것)", "뼈대 = <b>I saw a woman trying ~ and having ~</b>", "지각동사 see + O + -ing = O가 ~하고 있는 것을 보다"]}, {"t": "<b>Coming home from work the other day</b>는 <b>분사구문(부사 덩어리, 시간)</b>이다.", "sub": ["의미상 주어 = 주절 주어 I (나)", "come home from work = 퇴근해 집에 오다", "the other day = 며칠 전"]}, {"t": "보어 두 덩어리이다.", "sub": ["trying to turn onto the main street = 큰길로 들어서려고 애쓰는 (turn onto ~로 들어서다)", "and having very little luck because of the constant stream of traffic = 끊임없이 이어지는 차량 행렬 때문에 거의 운이 따르지 않는 (have little luck 운이 거의 없다, constant 끊임없는, stream 흐름, traffic 교통량)"]}, {"t": "함정: Coming의 주인은 a woman이 아니라 I이다. 퇴근길에 있던 사람은 나이다."}], "sum": "퇴근길, 차량 행렬 때문에 큰길 진입에 애먹는 여자를 봄"}, {"i": "07", "q": "06", "s": "4", "title": "By -ing 전치사구 + S+V+O + 목적격 관계절", "eng": "By dismissing<sup>1</sup> non-Western scientific paradigms as inferior<sup>2</sup> at best<sup>3</sup> and inaccurate at worst, / the most rigid<sup>4</sup> members of the conventional medical research community try to counter the threat / that alternative therapies and research pose<sup>5</sup> to their work, their well-being, and their worldviews.", "notes": [["1", "dismiss A as B", "A를 B라고 묵살하다"], ["2", "inferior", "열등한"], ["3", "at best", "기껏해야"], ["4", "rigid", "완고한, 경직된"], ["5", "pose A to B", "B에게 A를 가하다"]], "lit": "비서양의 과학적 패러다임을 기껏해야 열등하고 최악의 경우 부정확하다고 묵살함으로써, / 전통적인 의학 연구 단체의 가장 완고한 구성원들은 그 위협에 맞서려 한다 / 대체 요법과 연구가 자신들의 연구, 자신들의 행복, 자신들의 세계관에 가하는 (그 위협에).", "nat": "비서양의 과학적 패러다임을 기껏해야 열등하고 최악의 경우 부정확하다고 묵살함으로써, 전통적인 의학 연구 단체의 가장 완고한 구성원들은 대체 요법과 연구가 자신들의 연구와 행복, 세계관에 가하는 위협에 맞서려 한다.", "ana": "<b>By ~ing</b>는 '<b>~함으로써</b>'라는 <b>수단·방법</b>의 전치사구다. 전치사 by 뒤이므로 dismiss가 아니라 <b>dismissing</b>이 온 것이다. 그 안의 <b>dismiss A as B</b>는 '<b>A를 B라고 치부하다·묵살하다</b>'라는 틀이며, B 자리에 형용사 두 개(inferior, inaccurate)가 <b>and</b>로 병렬되어 있다. 주절의 주어는 길지만 핵심은 <b>members</b> 하나이고, 동사는 <b>try</b>다. 문제는 맨 뒤의 <b>that</b>이다. 뒤에 <b>주어(alternative therapies and research) + 동사(pose)</b>가 오는데 <b>pose의 목적어가 비어 있다</b>. 목적어가 비어 있으면 그 that은 접속사가 아니라 <b>목적격 관계대명사</b>이고, 앞의 <b>the threat</b>을 받는다. <b>pose A to B</b>는 '<b>B에게 A(위협 등)를 가하다</b>'라는 뜻이다.", "pe": "\u0001By dismissing<sup>1</sup> non-Western scientific paradigms as inferior<sup>2</sup> at best<sup>3</sup> and inaccurate at worst\u0002, / the \u0001most rigid<sup>4</sup>\u0002 members \u0001of the conventional medical research community\u0002 try to counter the threat / \u0001that alternative therapies and research pose<sup>5</sup> to their work, their well-being, and their worldviews\u0002.", "pk": "\u0001비서양의 과학적 패러다임을 기껏해야 열등하고 최악의 경우 부정확하다고 묵살함으로써\u0002, / \u0001전통적인 의학 연구 단체의\u0002 \u0001가장 완고한\u0002 구성원들은 그 위협에 맞서려 한다 / 대체 요법과 연구가 자신들의 연구, 자신들의 행복, 자신들의 세계관에 가하는 (그 위협에).", "core": "구성원들은 위협에 맞서려 한다.", "tags": ["(By dismissing … at worst) = 전치사구(부사구: 수단): try to counter를 꾸밈. dismiss A as B = A를 B라고 묵살하다", "주어 members + 동사 try + 목적어 to counter the threat: 3형식. (most rigid) = 형용사, (of the conventional … community) = 형용사구: members를 꾸밈", "(that alternative therapies … worldviews) = 관계절(형용사절, 목적격 관계대명사 that): the threat를 꾸밈. pose A to B = A를 B에 가하다"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 앞의 by 전치사구와 뒤의 관계절 때문에 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: the most rigid members (가장 완고한 구성원들. rigid 완고한)", "V: try (노력하다)", "O: to counter the threat (위협에 맞서려는 것. counter 맞서다, threat 위협)", "뼈대 = <b>the most rigid members try to counter the threat</b>", "of the conventional medical research community = members를 꾸미는 형용사구. 전통적인 의학 연구 단체의"]}, {"t": "<b>By dismissing ~ at worst</b>는 수단을 말하는 전치사구(부사구, by + 동명사)이다.", "sub": ["dismiss A as B = A를 B로 묵살하다 (3형식 + as)", "non-Western scientific paradigms = 비서양의 과학적 패러다임", "inferior at best (기껏해야 열등한) and inaccurate at worst (최악의 경우 부정확한)"]}, {"t": "<b>that alternative therapies and research pose to their work, their well-being, and their worldviews</b>는 <b>목적격 관계절</b>로 the threat를 꾸민다.", "sub": ["that = the threat (pose의 목적어 자리가 비어 있음)", "S: alternative therapies and research (대체 요법과 연구)  V: pose (pose 제기하다, 가하다)", "to A, B, and C = 자신들의 연구, 행복, 세계관에 (their = members)"]}, {"t": "함정: pose가 복수 동사인 이유는 주어가 therapies and research로 복수이기 때문이다. the threat 뒤 that은 주어가 아니라 목적어 자리를 비운 관계대명사이다."}], "sum": "완고한 연구자들, 대체 요법이 가하는 위협을 묵살로 막으려 함"}, {"i": "08", "q": "06", "s": "5", "title": "S+V+O(many of) + 주격 관계절", "eng": "And yet<sup>1</sup>, / biomedical<sup>2</sup> research cannot explain many of the phenomena<sup>3</sup> / that concern<sup>4</sup> alternative practitioners<sup>5</sup> regarding caring-healing processes.", "notes": [["1", "and yet", "그럼에도 불구하고"], ["2", "biomedical", "생물 의학의"], ["3", "phenomenon", "현상(복수형 phenomena)"], ["4", "concern", "~와 관련되다, ~의 관심사이다"], ["5", "practitioner", "시술자, 개업의"]], "lit": "그럼에도 불구하고, / 생물 의학 연구는 그 현상들 중 많은 것을 설명하지 못한다 / 돌봄·치유 과정과 관련하여 대체 의학 시술자들이 관심을 갖는 (그 현상들 중).", "nat": "그럼에도 불구하고 생물 의학 연구는, 돌봄·치유 과정과 관련하여 대체 의학 시술자들이 관심을 갖는 현상들 중 많은 것을 설명하지 못한다.", "ana": "맨 앞의 <b>And yet</b>은 '<b>그럼에도 불구하고</b>'라는 <b>역접</b> 신호다. 앞 문장까지는 완고한 연구자들이 대체 요법을 <b>묵살한다</b>는 내용이었는데, 여기서 방향이 꺾인다. 어휘 문항에서는 이런 <b>역접 표시</b>가 곧 글의 방향이 바뀌는 지점이므로 반드시 표시해 두어야 한다. 구조의 핵심은 <b>that</b>이다. 뒤에 주어 없이 동사 <b>concern</b>이 바로 오므로 <b>주격 관계대명사</b>이며, 앞의 <b>the phenomena</b>를 꾸민다. 이때 <b>concern</b>은 '<b>걱정시키다</b>'가 아니라 '<b>~와 관련되다, ~의 관심사이다</b>'라는 뜻으로 쓰였다. 익숙한 뜻만 붙이면 문장이 통째로 어긋난다. <b>phenomena</b>는 <b>phenomenon</b>의 복수형이고, <b>many of the phenomena</b>처럼 <b>부분 표현 + of + 명사</b> 뒤에서는 동사의 수를 <b>of 뒤 명사</b>에 맞춘다.", "pe": "\u0001And yet<sup>1</sup>\u0002, / \u0001biomedical<sup>2</sup>\u0002 research cannot explain many \u0001of the phenomena<sup>3</sup>\u0002 / \u0001that concern<sup>4</sup> alternative practitioners<sup>5</sup> regarding caring-healing processes\u0002.", "pk": "\u0001그럼에도 불구하고\u0002, / \u0001생물 의학\u0002 연구는 그 현상들 중 많은 것을 설명하지 못한다 / \u0001돌봄·치유 과정과 관련하여 대체 의학 시술자들이 관심을 갖는\u0002 (그 현상들 중).", "core": "연구는 많은 것을 설명하지 못한다.", "tags": ["(And yet) = 접속부사: 문장 전체를 꾸밈", "주어 research + 동사 cannot explain + 목적어 many: 3형식. (biomedical) = 형용사: research를 꾸밈, (of the phenomena) = 전치사구(형용사구): many를 꾸밈", "(that concern … processes) = 관계절(형용사절): the phenomena를 꾸밈. concern = 동사 '~의 관심을 끌다'"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 many of ~ 뒤에 관계절이 붙어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: biomedical research (생물 의학 연구. biomedical 생물 의학의)", "V: cannot explain (explain 설명하다)", "O: many (많은 것) of the phenomena (그 현상들 중. phen \">이런 편지는 저희가 계속 의욕을 가지게 하고 서비스를 개선하도록 이끕니다.</div><div class=\"rst\">“그런 쪽지 덕분에 힘이 나고 더 맛있게 만들고 싶어져.” = 지문 3번, 편지가 의욕을 주고 개선하도록 이끈대요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">We are pleased about your comment</div><div class=\"k\">저희는 귀하의 의견을 기쁘게 생각합니다</div></div><div class=\"rc\"><div class=\"e\">as customers’ satisfaction</div><div class=\"k\">고객의 만족이 ~이기 때문에</div></div><div class=\"rc\"><div class=\"e\">is the main motto of our service.</div><div class=\"k\">저희 서비스의 주된 모토.</div></div><div class=\"rnat\">고객의 만족이 저희 서비스의 주된 모토이기 때문에 저희는 귀하의 의견을 기쁘게 생각합니다.</div><div class=\"rst\">“학생들이 만족하는 게 우리 목표거든.” 지문 4번도 고객 만족이 서비스의 주된 모토라서 기쁘대요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">It’s very rare</div><div class=\"k\">매우 드문 일입니다</div></div><div class=\"rc\"><div class=\"e\">that the customers take time</div><div class=\"k\">고객이 시간을 들이는 것은</div></div><div class=\"rc\"><div class=\"e\">to give thanks for the services,</div><div class=\"k\">서비스에 대해 감사함을 전하기 위해,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">so we would like to use this letter</span></div><div class=\"k\"><span class=\"cw\">그래서 저희는 이 편지를 사용하고 싶습니다</span></div></div><div class=\"rc\"><div class=\"e\">as an example of the customer’s satisfactory remarks</div><div class=\"k\">고객의 만족스러운 의견의 한 예로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">in our new brochure</span></div><div class=\"k\"><span class=\"cw\">저희의 새로운 홍보 책자에</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">if you give us permission</span></div><div class=\"k\"><span class=\"cw\">귀하께서 저희에게 허락해 주신다면</span></div></div><div class=\"rc\"><div class=\"e\">to do so.</div><div class=\"k\">그렇게 하는 것을(= 이 편지를 책자에 사용하는 것).</div></div><div class=\"rnat\">고객이 서비스에 대해 감사함을 전하기 위해 시간을 들이는 것은 매우 드문 일이기 때문에, 만약 귀하께서 그렇게 하는 것을 저희에게 허락해 주신다면, 저희는 이 편지를 저희의 새로운 홍보 책자에 고객의 만족스러운 의견의 한 예로 사용하고 싶습니다.</div><div class=\"rst\">“칭찬 쪽지는 진짜 드물어. <b>그래서</b> 네 쪽지를 급식 소식지에 싣고 싶은데, <b>허락해 줄래?</b>” 이게 지문 5번의 진짜 용건이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">When people see such remarks</div><div class=\"k\">사람들이 그런 의견을 볼 때</div></div><div class=\"rc\"><div class=\"e\">from satisfied customers,</div><div class=\"k\">만족한 고객들로부터 온,</div></div><div class=\"rc\"><div class=\"e\">they trust the service and products more.</div><div class=\"k\">그들(= 사람들)은 그 서비스와 상품들을 더 신뢰합니다.</div></div><div class=\"rnat\">만족한 고객들로부터 온 그런 의견을 볼 때, 사람들은 그 서비스와 상품들을 더 신뢰합니다.</div><div class=\"rst\">“다른 친구들이 그 쪽지를 보면 급식을 더 믿고 먹을 거야.” = 지문 6번, 만족한 고객 의견을 보면 더 신뢰한대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">We hope</div><div class=\"k\">저희는 바랍니다</div></div><div class=\"rc\"><div class=\"e\">you will help us</div><div class=\"k\">귀하가 저희를 도와주시기를</div></div><div class=\"rc\"><div class=\"e\">in this regard.</div><div class=\"k\">이런 점에서(= 편지를 책자에 싣는 일).</div></div><div class=\"rnat\">저희는 귀하가 이런 점에서 저희를 도와주셨으면 합니다.</div><div class=\"rst\">“이 일을 꼭 도와줬으면 해.” 지문 7번의 in this regard(이런 점에서)는 편지를 책자에 싣는 일이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">We will be contacting you soon</div><div class=\"k\">저희가 곧 귀하에게 연락을 드리겠습니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to hear your decision</span></div><div class=\"k\"><span class=\"cw\">귀하의 결정을 듣기 위해</span></div></div><div class=\"rc\"><div class=\"e\">regarding putting your remarks</div><div class=\"k\">귀하의 의견을 싣는 것에 대한</div></div><div class=\"rc\"><div class=\"e\">in the brochure.</div><div class=\"k\">홍보 책자에.</div></div><div class=\"rnat\">홍보 책자에 귀하의 의견을 싣는 것에 대한 귀하의 결정을 듣기 위해 저희가 (귀하에게) 곧 연락을 드리겠습니다.</div><div class=\"rst\">“곧 다시 물어볼게, 실어도 되는지 알려 줘.” 지문 8번도 <b>결정을 듣기 위해</b> 연락하겠대요. 허락 요청을 다시 확인해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Sincerely,</div><div class=\"k\">진심을 담아,</div></div><div class=\"rc\"><div class=\"e\">Oliver Watson</div><div class=\"k\">Oliver Watson (드림)</div></div><div class=\"rnat\">진심을 담아, Oliver Watson (드림)</div><div class=\"rst\">쪽지 끝에 쌤 이름을 쓰듯, 지문도 보낸 사람 Oliver Watson(올리버 왓슨)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"complimentary\" data-m=\"칭찬하는\"><b>complimentary</b>칭찬하는</button><button type=\"button\" class=\"wdb\" data-w=\"motivated\" data-m=\"의욕을 가진\"><b>motivated</b>의욕을 가진</button><button type=\"button\" class=\"wdb\" data-w=\"satisfactory\" data-m=\"만족스러운\"><b>satisfactory</b>만족스러운</button><button type=\"button\" class=\"wdb\" data-w=\"remarks\" data-m=\"의견, 발언\"><b>remarks</b>의견, 발언</button><button type=\"button\" class=\"wdb\" data-w=\"brochure\" data-m=\"(광고·홍보용) 책자\"><b>brochure</b>(광고·홍보용) 책자</button><button type=\"button\" class=\"wdb\" data-w=\"permission\" data-m=\"허락, 허가\"><b>permission</b>허락, 허가</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">안내문 불일치는 <b>선택지 순서 = 지문 순서</b>예요. 선지를 먼저 읽고 해당 줄만 찾아가되, <b>날짜·시간·가격</b> 같은 숫자 줄에서 특히 멈추세요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번 제20회 전시회</span><span><em>②</em>3번 유명한 예술가들의 작품 전시</span><span><em>③</em>4번 전시회 첫날 공연</span><span><em>④</em>6번 날짜</span><span><em>⑤</em>12번 주민 무료입장</span></div><div class=\"ck-eq\">⇒ 선택지 다섯 개가 지문 순서대로 한 군데씩 걸려 있어요</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step key\"><span class=\"lab\">④ 차례 · 6번 문장 (결정적 단서)</span><div class=\"en\">• Dates: <mark>November 1 – 30</mark></div><p class=\"ko\">• 날짜: <mark>11월 1일 – 30일</mark></p></div><div class=\"ck-via\"><i>▼</i><span>바로 아래 줄도 숫자예요. 이건 하루 중 시간이지 기간이 아니에요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 숫자 함정 확인</span><div class=\"en\">• Hours: 10:00 a.m. – 9:00 p.m.</div><p class=\"ko\">• 시간: 오전 10시 – 오후 9시</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">두 달 동안 열린다.<small>6번은 11월 1일부터 30일까지, 한 달이에요. 두 달이 아니에요.</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Virginia 주민의 무료입장이 가능하다.</span><span class=\"why\">바로 위 10~11번에 성인 15달러, 아동 7달러가 나와서 헷갈리지만, 12번 Free admission for Virginia residents(버지니아 주민들은 무료입장)와 그대로 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">스무 번째 개최되는 행사이다.</span><span class=\"why\">2번 제20회 Virginia Art Show(버지니아 미술 전시회)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">유명한 예술가의 작품이 전시된다.</span><span class=\"why\">3번 Works by famous artists(유명한 예술가들의 작품)가 will be displayed(전시될 것이다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">행사 첫날 Virginia Philharmonic의 공연이 있다.</span><span class=\"why\">4번 on the first day of the show(전시회 첫날에) 공연한다는 말과 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Virginia Art Show 2015</div><div class=\"k\">Virginia 미술 전시회 2015</div></div><div class=\"rnat\">Virginia 미술 전시회 2015</div><div class=\"rst\">미술 숙제로 전시회를 가야 하는 내가 포스터를 발견했어요. = 지문 1번 제목, Virginia(버지니아) 미술 전시회 2015예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">We invite you</div><div class=\"k\">저희는 여러분을 초대합니다</div></div><div class=\"rc\"><div class=\"e\">to join us at the 20th Virginia Art Show,</div><div class=\"k\">제20회 Virginia 미술 전시회에 함께하도록,</div></div><div class=\"rc\"><div class=\"e\">famed all along the east coast</div><div class=\"k\">대서양 연안 일대에서 유명한</div></div><div class=\"rc\"><div class=\"e\">for the variety and quality of its exhibits.</div><div class=\"k\">그것(= 전시회)의 전시품들의 다양성과 우수성으로.</div></div><div class=\"rnat\">저희는 전시품들의 다양성과 우수성으로 대서양 연안 일대에서 유명한 제20회 Virginia 미술 전시회에 함께하도록 여러분을 초대합니다.</div><div class=\"rst\">“벌써 스무 번째래!” 지문 2번은 제20회 전시회이고, 전시품이 다양하고 좋기로 유명하대요. → ① 일치</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Works by famous artists</div><div class=\"k\">유명한 예술가들의 작품이</div></div><div class=\"rc\"><div class=\"e\">such as Mabel Green, Theresa Peterson, and Ronald McKuen</div><div class=\"k\">Mabel Green, Theresa Peterson, Ronald McKuen과 같은</div></div><div class=\"rc\"><div class=\"e\">will be displayed.</div><div class=\"k\">전시될 것입니다.</div></div><div class=\"rnat\">Mabel Green, Theresa Peterson, Ronald McKuen과 같은 유명한 예술가들의 작품이 전시될 것입니다.</div><div class=\"rst\">“교과서에서 본 화가 그림도 온대!” 지문 3번은 유명한 예술가들의 작품이 전시된대요. → ② 일치</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The Virginia Philharmonic</div><div class=\"k\">Virginia Philharmonic이</div></div><div class=\"rc\"><div class=\"e\">will perform</div><div class=\"k\">공연을 할 것입니다</div></div><div class=\"rc\"><div class=\"e\">on the first day of the show.</div><div class=\"k\">전시회 첫날에.</div></div><div class=\"rnat\">Virginia Philharmonic이 전시회 첫날에 공연을 할 것입니다.</div><div class=\"rst\">“첫날 가면 오케스트라 공연도 볼 수 있어.” = 지문 4번, 전시회 첫날 Virginia Philharmonic(버지니아 필하모닉)이 공연해요. → ③ 일치</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Come and enjoy</div><div class=\"k\">오셔서 즐기십시오</div></div><div class=\"rc\"><div class=\"e\">the fabulous drawings, sculptures, photographs, digital works,</div><div class=\"k\">멋진 그림, 조각, 사진, 디지털 작품,</div></div><div class=\"rc\"><div class=\"e\">and the great music!</div><div class=\"k\">그리고 훌륭한 음악을!</div></div><div class=\"rnat\">오셔서 멋진 그림, 조각, 사진, 디지털 작품, 그리고 훌륭한 음악을 즐기십시오!</div><div class=\"rst\">그림, 조각, 사진, 디지털 작품에 음악까지 즐기러 오래요. = 지문 5번의 초대 인사예요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">• Dates: <span class=\"cw\">November 1</span> – <span class=\"cw\">30</span></div><div class=\"k\">• 날짜: <span class=\"cw\">11월 1일</span> – <span class=\"cw\">30일</span></div></div><div class=\"rnat\">• 날짜: 11월 1일 – 30일</div><div class=\"rst\">달력부터 확인해요. 지문 6번 날짜는 <b>11월 1일부터 30일</b>까지, 딱 한 달이에요. 두 달이 아니죠! → ④가 틀린 곳</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">• Hours: 10:00 a.m. – 9:00 p.m.</div><div class=\"k\">• 시간: 오전 10시 – 오후 9시</div></div><div class=\"rnat\">• 시간: 오전 10시 – 오후 9시</div><div class=\"rst\">몇 시에 가지? 지문 7번은 오전 10시부터 오후 9시까지래요. 하루 중 시간이지 기간이 아니에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">• Place: Westchester Art Center</div><div class=\"k\">• 장소: Westchester Art Center</div></div><div class=\"rnat\">• 장소: Westchester Art Center</div><div class=\"rst\">어디로 가지? 지문 8번 장소는 Westchester Art Center(웨스트체스터 아트 센터)예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">• Entrance Fees:</div><div class=\"k\">• 입장료:</div></div><div class=\"rnat\">• 입장료:</div><div class=\"rst\">용돈이 얼마나 들까? 지문 9번은 입장료 안내가 시작되는 작은 제목이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">– Adults: $15 one day</div><div class=\"k\">– 성인: 하루 15달러</div></div><div class=\"rnat\">– 성인: 하루 15달러</div><div class=\"rst\">어른은 하루 15달러예요. = 지문 10번, 부모님 표값이에요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">11번</span><div class=\"rc\"><div class=\"e\">– Children: $7 one day</div><div class=\"k\">– 아동: 하루 7달러</div></div><div class=\"rnat\">– 아동: 하루 7달러</div><div class=\"rst\">어린이는 하루 7달러예요. = 지문 11번이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">12번</span><div class=\"rc\"><div class=\"e\">Free admission for Virginia residents</div><div class=\"k\">Virginia 주민들은 무료입장</div></div><div class=\"rnat\">Virginia 주민들은 무료입장</div><div class=\"rst\">그런데 우리 가족은 Virginia(버지니아) 주민이라 공짜예요! = 지문 12번 주민 무료입장 → ⑤ 일치</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">13번</span><div class=\"rc\"><div class=\"e\">For further information,</div><div class=\"k\">추가적인 정보를 원하시면,</div></div><div class=\"rc\"><div class=\"e\">please visit our website</div><div class=\"k\">저희 웹사이트를 방문하십시오</div></div><div class=\"rc\"><div class=\"e\">at www.virginiaartshow.org.</div><div class=\"k\">www.virginiaartshow.org인.</div></div><div class=\"rnat\">추가적인 정보를 원하시면, 저희 웹사이트인 www.virginiaartshow.org를 방문하십시오.</div><div class=\"rst\">더 궁금한 건 웹사이트에 들어가 보면 돼요. = 지문 13번의 visit our website(웹사이트를 방문하다)예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"famed\" data-m=\"유명한, 이름난\"><b>famed</b>유명한, 이름난</button><button type=\"button\" class=\"wdb\" data-w=\"exhibit\" data-m=\"전시품; 전시하다\"><b>exhibit</b>전시품; 전시하다</button><button type=\"button\" class=\"wdb\" data-w=\"display\" data-m=\"전시하다, 진열하다\"><b>display</b>전시하다, 진열하다</button><button type=\"button\" class=\"wdb\" data-w=\"sculpture\" data-m=\"조각(품)\"><b>sculpture</b>조각(품)</button><button type=\"button\" class=\"wdb\" data-w=\"admission\" data-m=\"입장, 입장 허가\"><b>admission</b>입장, 입장 허가</button><button type=\"button\" class=\"wdb\" data-w=\"resident\" data-m=\"주민, 거주자\"><b>resident</b>주민, 거주자</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">요지는 <b>Thus</b>(따라서)가 붙은 7번이에요. <b>instead of</b>(~ 대신에) 구조로 비평이 여론을 <b>이끌던</b> 과거에서 여론을 <b>반영하는</b> 지금으로 방향이 뒤집혔다고 말해요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 과거 모습</span><div class=\"en\">Prior to file-sharing services, music albums landed <mark>exclusively in the hands of music critics</mark> before their release.</div><p class=\"ko\">파일 공유 서비스 이전에, 음악 앨범은 발매 전에 <mark>음악 비평가의 수중에 독점적으로</mark> 들어갔다.</p></div><div class=\"ck-via\"><i>▼</i><span>인터넷이 등장하자 비평가만 먼저 듣던 특권이 사라져요</span></div><div class=\"ck-step\"><span class=\"lab\">3~4번 문장 · 변화</span><div class=\"en\">… availability of new music became democratized, which meant critics <mark>no longer had unique access</mark>.</div><p class=\"ko\">새로운 음악의 이용 가능성이 민주화되었고, 이는 비평가들이 <mark>더 이상 유일한 접근권을 갖지 않는다는 것을</mark> 의미했다.</p></div><div class=\"ck-via\"><i>▼</i><span>The result was(그 결과는)로 결론 쪽으로 넘어가요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 결과</span><div class=\"en\">The result was that critics now could access <mark>the opinions of the masses</mark> on a particular album before writing their reviews.</div><p class=\"ko\">그 결과는 비평가들이 이제 자신의 비평을 쓰기 전에 특정한 앨범에 관한 <mark>대중의 의견을</mark> 접할 수 있다는 것이었다.</p></div><div class=\"ck-via\"><i>▼</i><span>Thus(따라서) + instead of(~ 대신에)로 과거와 지금을 맞대요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 요지</span><div class=\"en\"><mark>Thus</mark>, instead of music reviews guiding popular opinion toward art … music reviews began <mark>to reflect</mark> … public opinion.</div><p class=\"ko\"><mark>따라서</mark>, 음악 비평이 예술에 대한 여론을 이끄는 대신에 … 음악 비평은 여론을 <mark>반영하기</mark> 시작했다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">미디어 환경의 변화로 음악 비평이 대중의 영향을 받게 되었다.<small>7번 reflect public opinion(여론을 반영하다) = 대중의 영향을 받게 됐다는 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">오늘날 새로운 음악은 대중의 기호를 확인한 후에 공개된다.</span><span class=\"why\">[지문에 없음] 6번에서 대중의 의견을 먼저 확인하는 건 음악이 아니라 비평가의 비평 쓰기예요. 음악이 공개되는 순서가 바뀐 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">인터넷의 발달로 다양한 장르의 음악을 접하는 것이 가능해졌다.</span><span class=\"why\">[범위 좁음/지문에 없음] 3번은 음악을 쉽게 접하게 됐다는 변화의 출발점일 뿐이고, 장르가 다양해졌다는 말은 없어요. 요지는 비평이 여론을 따라가게 됐다는 것이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">비평가의 음악 비평은 자신의 주관적인 경험을 기반으로 한다.</span><span class=\"why\">[반대] 7번은 비평이 public opinion(여론)을 반영하기 시작했다고 해요. 비평가 자신의 경험만 바탕으로 한다는 것과 정반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">온라인 환경의 대두로 음악 비평의 질이 전반적으로 상승하였다.</span><span class=\"why\">[지문에 없음] 비평이 좋아졌는지 나빠졌는지 질에 대한 평가는 한 번도 안 나와요. 바뀐 건 영향의 방향이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Prior to file-sharing services,</div><div class=\"k\">파일 공유 서비스(의 등장) 이전에,</div></div><div class=\"rc\"><div class=\"e\">music albums landed</div><div class=\"k\">음악 앨범은 들어갔다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">exclusively in the hands of music critics</span></div><div class=\"k\"><span class=\"cw\">음악 비평가의 수중에 독점적으로</span></div></div><div class=\"rc\"><div class=\"e\">before their release.</div><div class=\"k\">그것들(= 음악 앨범)의 발매 전에.</div></div><div class=\"rnat\">파일 공유 서비스(의 등장) 이전에, 음악 앨범은 발매 전에 음악 비평가의 수중에 독점적으로 들어갔다.</div><div class=\"rst\">새 게임이 나오기 전, 옛날엔 게임 잡지 기자만 먼저 해 볼 수 있었어요. = 지문 1번, 앨범이 발매 전에 <b>비평가에게만</b> 갔다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">These critics would listen to them</div><div class=\"k\">이러한 비평가들은 그것들(= 음악 앨범)을 듣곤 했다</div></div><div class=\"rc\"><div class=\"e\">well before the general public could</div><div class=\"k\">일반 대중이 들을 수 있기 훨씬 전에</div></div><div class=\"rc\"><div class=\"e\">and preview them</div><div class=\"k\">그리고 그것들(= 음악 앨범)에 대한 시사평을 쓰곤 했다</div></div><div class=\"rc\"><div class=\"e\">for the rest of the world</div><div class=\"k\">세상의 나머지 사람들을 위해</div></div><div class=\"rc\"><div class=\"e\">in their reviews.</div><div class=\"k\">자신의 비평에.</div></div><div class=\"rnat\">이러한 비평가들은 일반 대중이 들을 수 있기 훨씬 전에 그것들을 듣고, 세상의 나머지 사람들을 위해 자신의 비평에 그것들에 대한 시사평을 쓰곤 했다.</div><div class=\"rst\">기자가 우리보다 훨씬 먼저 해 보고 “이 게임 재밌다/별로다” 리뷰를 써 줬어요. = 지문 2번, 비평가가 먼저 듣고 시사평을 썼어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Once the internet made music easily accessible</div><div class=\"k\">일단 인터넷이 음악을 쉽게 접할 수 있게 만들고</div></div><div class=\"rc\"><div class=\"e\">and allowed even advanced releases</div><div class=\"k\">심지어 사전 발매 음반마저도 ~할 수 있게 하자</div></div><div class=\"rc\"><div class=\"e\">to spread through online social networks,</div><div class=\"k\">온라인 소셜 네트워크를 통해 유포될,</div></div><div class=\"rc\"><div class=\"e\">availability of new music became democratized,</div><div class=\"k\">새로운 음악의 이용 가능성이 민주화되었고,</div></div><div class=\"rc\"><div class=\"e\">which meant</div><div class=\"k\">이는(= 새 음악의 이용 가능성이 민주화된 것) 의미했다</div></div><div class=\"rc\"><div class=\"e\">critics no longer had unique access.</div><div class=\"k\">비평가들이 더 이상 유일한 접근권을 갖지 않는다는 것을.</div></div><div class=\"rnat\">일단 인터넷이 음악을 쉽게 접할 수 있게 만들고 심지어 사전 발매 음반마저도 온라인 소셜 네트워크를 통해 유포될 수 있게 하자, 새로운 음악의 이용 가능성이 민주화되었고, 이는 비평가들이 더 이상 유일한 접근권을 갖지 않는다는 것을 의미했다.</div><div class=\"rst\">그런데 인터넷이 생기자 출시 전 영상까지 다 퍼졌어요. 기자만 먼저 하는 특권이 사라졌죠. = 지문 3번의 <b>더 이상 유일한 접근권이 없다</b>예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">That is,</div><div class=\"k\">즉,</div></div><div class=\"rc\"><div class=\"e\">critics and laypeople alike</div><div class=\"k\">비평가와 비전문가는 모두</div></div><div class=\"rc\"><div class=\"e\">could obtain new music simultaneously.</div><div class=\"k\">동시에 새로운 음악을 얻을 수 있었다.</div></div><div class=\"rnat\">즉, 비평가와 비전문가는 모두 동시에 새로운 음악을 얻을 수 있었다.</div><div class=\"rst\">즉, 기자도 우리도 같은 날 게임을 해요. = 지문 4번, 비평가와 비전문가가 동시에 새 음악을 얻어요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Social media services also enabled people</div><div class=\"k\">소셜 미디어 서비스는 또한 사람들이 ~하는 것을 가능하게 했다</div></div><div class=\"rc\"><div class=\"e\">to publicize their views on new songs,</div><div class=\"k\">새로운 곡에 대한 자신의 견해를 알리는 것,</div></div><div class=\"rc\"><div class=\"e\">list their new favorite bands</div><div class=\"k\">자신이 좋아하는 새로운 밴드의 목록을 작성하는 것</div></div><div class=\"rc\"><div class=\"e\">in their social media bios,</div><div class=\"k\">자신의 소셜 미디어 약력에,</div></div><div class=\"rc\"><div class=\"e\">and argue over new music endlessly</div><div class=\"k\">그리고 새로운 음악에 대해 끊임없이 논쟁하는 것</div></div><div class=\"rc\"><div class=\"e\">on message boards.</div><div class=\"k\">게시판에서.</div></div><div class=\"rnat\">소셜 미디어 서비스는 또한 사람들이 새로운 곡에 대한 자신의 견해를 알리는 것, 자신의 소셜 미디어 약력에 자신이 좋아하는 새로운 밴드의 목록을 작성하는 것, 그리고 게시판에서 새로운 음악에 대해 끊임없이 논쟁하는 것을 가능하게 했다.</div><div class=\"rst\">우리는 SNS(소셜 미디어)에 “이 게임 최고!” 올리고, 게시판에서 끝없이 싸워요. = 지문 5번, 사람들이 새 곡에 대한 의견을 마구 알려요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The result was</div><div class=\"k\">그 결과는 ~이었다</div></div><div class=\"rc\"><div class=\"e\">that critics now could access</div><div class=\"k\">비평가들이 이제 접할 수 있다는 것</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the opinions of the masses on a particular album</span></div><div class=\"k\"><span class=\"cw\">특정한 앨범에 관한 대중의 의견을</span></div></div><div class=\"rc\"><div class=\"e\">before writing their reviews.</div><div class=\"k\">자신의 비평을 쓰기 전에.</div></div><div class=\"rnat\">그 결과는 비평가들이 이제 자신의 비평을 쓰기 전에 특정한 앨범에 관한 대중의 의견을 접할 수 있다는 것이었다.</div><div class=\"rst\">그 결과 기자는 리뷰를 쓰기 전에 우리 댓글부터 읽어 봐요. = 지문 6번, 비평 쓰기 전에 <b>대중의 의견</b>을 접해요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Thus</span>, instead of music reviews</div><div class=\"k\"><span class=\"cw\">따라서</span>, 음악 비평이 ~하는 대신에</div></div><div class=\"rc\"><div class=\"e\">guiding popular opinion toward art</div><div class=\"k\">예술에 대한 여론을 이끄는</div></div><div class=\"rc\"><div class=\"e\">(as they did in preinternet times),</div><div class=\"k\">인터넷 이전 시대에 음악 비평이 그랬듯이,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">music reviews began to reflect</span></div><div class=\"k\"><span class=\"cw\">음악 비평은 반영하기 시작했다</span></div></div><div class=\"rc\"><div class=\"e\">— consciously or subconsciously —</div><div class=\"k\">의식적으로든 혹은 잠재의식적으로든</div></div><div class=\"rc\"><div class=\"e\">public opinion.</div><div class=\"k\">여론을.</div></div><div class=\"rnat\">따라서, 음악 비평이 (그것들이 인터넷 이전 시대에 그랬듯이) 예술에 대한 여론을 이끄는 대신에, 음악 비평은 의식적으로든 혹은 잠재의식적으로든 여론을 반영하기 시작했다.</div><div class=\"rst\"><b>따라서</b>(Thus) 옛날엔 리뷰가 우리 생각을 이끌었는데, 이제는 리뷰가 우리 생각을 <b>따라 써요</b>. 지문 7번의 reflect(반영하다)가 요지예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"exclusively\" data-m=\"독점적으로, 오로지\"><b>exclusively</b>독점적으로, 오로지</button><button type=\"button\" class=\"wdb\" data-w=\"critic\" data-m=\"비평가, 평론가\"><b>critic</b>비평가, 평론가</button><button type=\"button\" class=\"wdb\" data-w=\"accessible\" data-m=\"접근할 수 있는\"><b>accessible</b>접근할 수 있는</button><button type=\"button\" class=\"wdb\" data-w=\"laypeople\" data-m=\"비전문가\"><b>laypeople</b>비전문가</button><button type=\"button\" class=\"wdb\" data-w=\"simultaneously\" data-m=\"동시에\"><b>simultaneously</b>동시에</button><button type=\"button\" class=\"wdb\" data-w=\"reflect\" data-m=\"반영하다\"><b>reflect</b>반영하다</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">도표 불일치는 한 문장에 <b>수치와 순위</b>가 같이 나오면 둘을 <b>따로</b> 확인하세요. 앞의 수치가 맞아도 뒤의 순위에서 틀리게 만드는 게 함정이에요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>①</em>2번: 2015년 총계가 2014년보다 더 낮음 → 표와 같음</span><span><em>②</em>3번: 두 해 모두 소 1위, 생쥐가 각각 18%·21% 넘게 차지하며 뒤따름 → 표와 같음</span><span><em>③</em>4번: 2014년 양이 어류보다 위, 2015년 서로 자리 바꿈 → 표와 같음</span><span><em>⑤</em>6번: 영장류 0, 고양이·개는 두 해 모두 1% 미만 → 표와 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 표와 같아요 → 남은 ④를 수치·순위 따로 확인</div></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><span class=\"lab\">④ 앞부분 (5번) · 수치</span><div class=\"en\">While the number of rats <mark>dropped below 10,000</mark> in 2015,</div><p class=\"ko\">2015년에 쥐의 수가 <mark>1만 마리 아래로 떨어진</mark> 반면</p></div><div class=\"ck-via\"><i>▼</i><span>수치는 맞아요. 이제 순위를 표에서 위부터 세어 보세요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 · 순위 · 결정적 단서</span><div class=\"en\">their ranking among all the animals <mark>remained the same as in 2014</mark>.</div><p class=\"ko\">모든 동물 중에서 쥐의 순위는 <mark>2014년과 여전히 동일했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">쥐의 순위가 2014년과 동일했다(remained the same)<small>표에서 쥐는 2014년 7위 → 2015년 6위로 한 계단 올라갔어요. 순위가 같지 않아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">2014년엔 양이 어류보다 위, 2015년엔 서로 자리를 바꿨다</span><span class=\"why\">4번과 같아요. 2014년 순위는 양이 어류보다 위였고, 2015년에는 어류가 양보다 위로 switched places(자리를 바꿨다)예요. 순위가 바뀐 동물이라 ④와 헷갈리기 쉬워요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">2015년 총수가 2014년보다 적었다(lower than)</span><span class=\"why\">2번과 같아요. 2015년 총계가 2014년보다 lower(더 낮은) 게 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">소가 두 해 모두 1위, 생쥐가 그 뒤를 이었다(followed by)</span><span class=\"why\">3번과 같아요. Cattle(소)이 두 해 모두 1위이고, mice(생쥐)가 각각 18%·21% 넘게 차지하며 뒤따라요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">영장류는
