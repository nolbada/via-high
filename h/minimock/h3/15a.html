ccounted for over 18% and over 21% respectively.</div><div class=\"k\">각각 18퍼센트 넘게 그리고 21퍼센트 넘게 차지했던.</div></div><div class=\"rnat\">2014년과 2015년 둘 다에서 소는 연구에서 가장 많이 사용된 동물이었으며, (2014년과 2015년에) 각각 18퍼센트 넘게 그리고 21퍼센트 넘게 차지했던 생쥐가 그 뒤를 이었다.</div><div class=\"rst\">두 해 모두 축구부가 1등, 그다음이 농구부예요. = 지문 3번, 소가 1위이고 생쥐가 뒤따라요. → ② 일치</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">③ Sheep ranked higher than fish in 2014,</div><div class=\"k\">③ 양은 2014년에 어류보다 더 높은 순위를 차지했다,</div></div><div class=\"rc\"><div class=\"e\">but their ranks</div><div class=\"k\">하지만 그들(= 양과 어류)의 순위는</div></div><div class=\"rc\"><div class=\"e\">switched places with each other in 2015.</div><div class=\"k\">2015년에 서로 자리를 바꿨다.</div></div><div class=\"rnat\">양은 2014년에 어류보다 더 높은 순위를 차지했지만, 그들의 순위는 2015년에 서로 자리를 바꿨다(어류가 양보다 높은 순위를 차지했다).</div><div class=\"rst\">작년엔 미술부가 밴드부보다 위였는데 올해는 서로 자리를 바꿨어요. = 지문 4번의 양과 어류 이야기예요. → ③ 일치</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">④ While the number of rats</div><div class=\"k\">④ 쥐의 수가 ~한 반면</div></div><div class=\"rc\"><div class=\"e\">dropped below 10,000 in 2015,</div><div class=\"k\">2015년에 1만 마리 아래로 떨어진,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">their ranking among all the animals</span></div><div class=\"k\"><span class=\"cw\">모든 동물 중에서 그들(= 쥐)의 순위는</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">remained the same as in 2014.</span></div><div class=\"k\"><span class=\"cw\">2014년과 여전히 동일했다.</span></div></div><div class=\"rnat\">2015년에 쥐의 수가 1만 마리 아래로 떨어진 반면, 모든 동물 중에서 그들(쥐)의 순위는 2014년과 여전히 동일했다(→ 2014년 7위에서 2015년 6위로 바뀌었다).</div><div class=\"rst\">독서부 인원은 줄었는데 순위는 그대로라고? 아니에요! 인원이 준 건 맞지만 표를 세 보면 쥐는 7위 → 6위로 올라가요. 지문 5번의 <b>순위가 동일했다</b>가 틀린 곳 → ④</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">⑤ Meanwhile, primates were never used,</div><div class=\"k\">⑤ 한편, 영장류는 전혀 사용되지 않았다,</div></div><div class=\"rc\"><div class=\"e\">and cats and dogs were less than 1%</div><div class=\"k\">그리고 고양이와 개는 1퍼센트 미만이었다</div></div><div class=\"rc\"><div class=\"e\">of all the animals used in research</div><div class=\"k\">연구에 사용된 모든 동물들의</div></div><div class=\"rc\"><div class=\"e\">both in 2014 and in 2015.</div><div class=\"k\">2014년과 2015년 둘 다에서.</div></div><div class=\"rnat\">한편, 영장류는 전혀 사용되지 않았으며, 고양이와 개는 2014년과 2015년 둘 다에서 연구에 사용된 모든 동물들의 1퍼센트 미만이었다.</div><div class=\"rst\">한편 아무도 안 든 동아리도 있고, 아주 적은 동아리도 있어요. = 지문 6번, 영장류는 0이고 고양이·개는 1% 미만이에요. → ⑤ 일치</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"statistics\" data-m=\"통계\"><b>statistics</b>통계</button><button type=\"button\" class=\"wdb\" data-w=\"cattle\" data-m=\"소(집합적으로 복수 취급)\"><b>cattle</b>소(집합적으로 복수 취급)</button><button type=\"button\" class=\"wdb\" data-w=\"accounted for\" data-m=\"(비율을) 차지했다\"><b>accounted for</b>(비율을) 차지했다</button><button type=\"button\" class=\"wdb\" data-w=\"respectively\" data-m=\"각각, 저마다\"><b>respectively</b>각각, 저마다</button><button type=\"button\" class=\"wdb\" data-w=\"switched places\" data-m=\"자리를 바꿨다\"><b>switched places</b>자리를 바꿨다</button><button type=\"button\" class=\"wdb\" data-w=\"primate\" data-m=\"영장류\"><b>primate</b>영장류</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 바로 <b>뒤 절에 빠진 자리가 있는지</b>부터 보세요. 빠진 자리가 있으면 <b>what</b>(~하는 것), 다 갖춰져 있으면 <b>that</b>(~라는 것)이에요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (8번)</span><div class=\"en\">I realized <u>⑤ what</u> I had wanted a reward:</div><p class=\"ko\">나는 ( ? ) 내가 보상을 원했었다 — 앞은 동사 realized(깨달았다), 뒤는 주어·동사·목적어가 다 있는 절</p></div><div class=\"ck-via\"><i>▼</i><span>I(주어) + had wanted(동사) + a reward(목적어)로 빈 자리가 없어요 → 완전 → that(~라는 것)</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 결정적 단서</span><div class=\"en\">I realized that I <mark>had wanted a reward</mark>:</div><p class=\"ko\">나는 깨달았다 <mark>내가 보상을 원했었다는 것을</mark></p></div><div class=\"ck-via\"><i>▼</i><span>콜론(:) 뒤가 그 '보상'의 내용을 풀어 줘요. 깨달은 내용 전체가 한 덩어리 사실이에요</span></div><div class=\"ck-step\"><span class=\"lab\">8번 뒷부분 · 내용 확인</span><div class=\"en\">If I do this nice thing for you, you (or someone else) will do an equally nice thing for me.</div><p class=\"ko\">내가 당신에게 이런 친절을 베푼다면, 당신이 (또는 다른 사람이) 나에게 동등하게 친절을 베풀 것이라는.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">관계대명사 what(~하는 것)과 접속사 that(~라는 것) 구별</p><p class=\"gr\">what(~하는 것) 뒤에는 주어나 목적어가 빠진 불완전한 절이 와요. that(~라는 것) 뒤에는 주어·동사·목적어가 다 갖춰진 완전한 절이 와요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I know that he likes pizza.</div><div class=\"ko\">나는 그가 피자를 좋아한다는 것을 알아. (he likes pizza가 완전하니 that)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I know what he likes pizza.</div><div class=\"ko\">likes 뒤에 목적어 pizza(피자)가 이미 있어서 what이 할 일이 없어 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I know what he likes.</div><div class=\"ko\">나는 그가 좋아하는 것을 알아. (likes 뒤 목적어가 비었으니 what)</div></div><p class=\"gb\">지문 8번도 realized(깨달았다) 뒤 I had wanted a reward(내가 보상을 원했었다)에 목적어 a reward(보상)까지 다 있어요. 완전한 절이니 what(~하는 것)이 아니라 that(~라는 것)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">what → that (~라는 것)<small>realized(깨달았다) 뒤 절이 I had wanted a reward(내가 보상을 원했었다)로 완전하니 that(~라는 것)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">came 떠올랐다</span><span class=\"why\">7번은 주어가 a phrase(문구 하나)이고, I once read(내가 언젠가 읽었던)는 그 문구를 꾸미는 말이에요. 문장 전체의 진짜 동사가 필요한 자리라서 과거 동사 came(왔다, 떠올랐다)이 맞아요. coming(오는)으로 바꾸면 문장에 동사가 없어져요.</span><div class=\"gm wx\"><p class=\"gt\">꾸밈말이 붙은 주어 뒤의 진짜 동사 자리</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The book I read yesterday was fun.</div><div class=\"ko\">내가 어제 읽은 책은 재미있었다. (I read yesterday는 꾸밈말, 진짜 동사는 was라서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The book I read yesterday being fun.</div><div class=\"ko\">being(~인 것)은 진짜 동사가 아니라 문장에 동사가 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>A song I once heard came into my head.</div><div class=\"ko\">내가 언젠가 들었던 노래 하나가 머릿속에 떠올랐다. (진짜 동사 came이라 맞아요)</div></div><p class=\"gb\">지문 7번도 a phrase I once read(내가 언젠가 읽었던 문구 하나)가 주어라서 진짜 동사 came(떠올랐다)이 꼭 있어야 해요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">having 겪고 있는</span><span class=\"why\">1번은 I saw a woman(나는 어떤 여자를 봤다) 뒤에 trying(애쓰는)과 and(그리고)로 나란히 이어진 자리예요. saw(봤다) + 사람 + -ing(~하는) 구조라 trying(애쓰는)과 같은 모양 having(겪고 있는)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">지각동사 see(보다) + 목적어 + -ing(~하는), 같은 모양 나란히 쓰기(병렬)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I saw a boy running and laughing.</div><div class=\"ko\">나는 한 소년이 달리며 웃고 있는 것을 봤다. (running과 laughing이 같은 -ing 모양이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I saw a boy running and laughs.</div><div class=\"ko\">laughs(웃는다)는 running(달리는)과 같은 -ing 모양이 아니라서 나란히 못 이어져 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I saw a girl reading a book.</div><div class=\"ko\">나는 한 소녀가 책을 읽고 있는 것을 봤다. (saw + 사람 + -ing라서 맞아요)</div></div><p class=\"gb\">지문 1번도 saw a woman(여자를 봤다) 뒤에 trying(애쓰는) ... and(그리고) having(운이 따르지 않는)으로 같은 모양이 나란히 와서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">irritated 짜증 난</span><span class=\"why\">4번은 I found myself(나는 내 자신이 ~한 것을 알았다) 뒤에 나의 상태가 오는 자리예요. 내가 짜증을 '내게 하는' 쪽이 아니라 짜증이 '난' 쪽이라 과거분사 irritated(짜증 난)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">find(알게 되다) + 목적어 + 과거분사(감정을 느끼는 쪽: ~한)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I found myself bored in class.</div><div class=\"ko\">나는 수업 중에 내가 지루해하고 있다는 걸 알았다. (내가 지루함을 느끼는 쪽이라 bored 지루한 이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I found myself boring in class.</div><div class=\"ko\">boring(지루하게 만드는)이면 내가 남을 지루하게 만든다는 뜻이 되어 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She found the movie exciting.</div><div class=\"ko\">그녀는 그 영화가 신난다고 느꼈다. (영화가 신나게 만드는 쪽이라 exciting 신나게 하는 이 맞아요)</div></div><p class=\"gb\">지문 4번도 짜증을 느낀 건 나(myself 내 자신)라서 irritated(짜증 난)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">how 얼마나</span><span class=\"why\">6번은 I realized(나는 깨달았다)의 목적어 자리예요. 뒤에 ridiculous(어리석은)라는 형용사가 바로 붙고 I was being(내가 굴고 있었다)이 이어지니, how(얼마나) + 형용사 + 주어 + 동사 구조라 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">간접의문문 how(얼마나) + 형용사 + 주어 + 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I know how tired you are.</div><div class=\"ko\">나는 네가 얼마나 피곤한지 알아. (how + tired 피곤한 + you are 순서라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I know how are you tired.</div><div class=\"ko\">how 뒤에서 are you처럼 동사가 주어 앞에 오면 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I know what tired you are.</div><div class=\"ko\">형용사 tired(피곤한) 바로 앞에서 '얼마나'를 뜻하려면 what이 아니라 how를 써야 해서 틀려요.</div></div><p class=\"gb\">지문 6번도 how ridiculous I was being(내 자신이 얼마나 어리석게 굴고 있는지)으로 how(얼마나) + 형용사 + 주어 + 동사 순서가 딱 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Coming home from work the other day,</div><div class=\"k\">며칠 전에 직장에서 집으로 오면서,</div></div><div class=\"rc\"><div class=\"e\">I saw a woman</div><div class=\"k\">나는 어떤 여자를 봤다</div></div><div class=\"rc\"><div class=\"e\">trying to turn onto the main street</div><div class=\"k\">큰 길로 들어서려고 애쓰는</div></div><div class=\"rc\"><div class=\"e\">and having very little luck</div><div class=\"k\">그리고 운이 매우 따라 주지 않는</div></div><div class=\"rc\"><div class=\"e\">because of the constant stream of traffic.</div><div class=\"k\">끊임없는 차량들의 물결 때문에.</div></div><div class=\"rnat\">며칠 전에 직장에서 집으로 오면서, 나는 어떤 여자가 (운전 중) 큰 길로 들어서려고(끼어들려고) 애쓰는데 끊임없는 차량들의 물결 때문에 매우 운이 따라 주지 않는(끼어들지 못하는) 것을 봤다.</div><div class=\"rst\">퇴근길에 큰길로 들어서려는데 차가 끊임없어 애먹는 여자를 봤어요. trying(애쓰는)과 having(겪고 있는)이 and(그리고)로 나란히 이어져요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">I slowed</div><div class=\"k\">나는 속도를 줄였다</div></div><div class=\"rc\"><div class=\"e\">and allowed her to turn</div><div class=\"k\">그리고 그녀가 끼어들게 해주었다</div></div><div class=\"rc\"><div class=\"e\">in front of me.</div><div class=\"k\">내 앞으로.</div></div><div class=\"rnat\">나는 속도를 줄이고 그녀가 내 앞으로 끼어들게 해주었다.</div><div class=\"rst\">나는 속도를 줄여 그녀가 내 앞으로 끼어들게 해 줬어요. allow A to do(A가 ~하게 해 주다) 구조예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">I was feeling pretty good</div><div class=\"k\">나는 기분이 꽤 좋았다</div></div><div class=\"rc\"><div class=\"e\">until, a couple of blocks later,</div><div class=\"k\">두어 블록을 간 후에, ~할 때까지는</div></div><div class=\"rc\"><div class=\"e\">she stopped</div><div class=\"k\">그녀가 멈추었다</div></div><div class=\"rc\"><div class=\"e\">to let a few more cars into the line,</div><div class=\"k\">몇 대의 차들을 더 차선으로 끼워 주려고,</div></div><div class=\"rc\"><div class=\"e\">causing us both</div><div class=\"k\">그 바람에 우리 둘 다</div></div><div class=\"rc\"><div class=\"e\">to miss the next light.</div><div class=\"k\">다음 신호를 놓치게 되었다.</div></div><div class=\"rnat\">나는 두어 블록을 간 후에, 그녀가 차선으로 몇 대의 차들이 끼어들 수 있도록 멈추었던 때까지는 기분이 꽤 좋았는데, 그 바람에 우리 둘 다 다음 신호를 놓치게 되었다.</div><div class=\"rst\">기분 좋았는데, 그녀가 차를 몇 대 더 끼워 주는 바람에 우리 둘 다 신호를 놓쳤어요. cause A to do(A가 ~하게 만들다)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I found myself</div><div class=\"k\">나는 내 자신이 ~한 것을 알았다</div></div><div class=\"rc\"><div class=\"e\">completely irritated with her.</div><div class=\"k\">그녀에게 완전히 짜증 난.</div></div><div class=\"rnat\">나는 그녀에게 완전히 짜증 났다.</div><div class=\"rst\">나는 그녀에게 완전히 짜증이 났어요. 짜증을 느낀 쪽이 나라서 <b>irritated</b>(짜증 난)예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">How dare she slow me down</div><div class=\"k\">어떻게 감히 그녀가 나를 느리게 가게 한단 말인가</div></div><div class=\"rc\"><div class=\"e\">after I had so graciously let her</div><div class=\"k\">내가 그렇게 친절하게 그녀가 ~하게 해주었는데</div></div><div class=\"rc\"><div class=\"e\">into the traffic!</div><div class=\"k\">차량 행렬로 끼어들게!</div></div><div class=\"rnat\">내가 그렇게 친절하게 그녀가 끼어들게 해주었는데 어떻게 감히 그녀가 나를 느리게 가게 한단 말인가!</div><div class=\"rst\">“내가 친절하게 끼워 줬는데 감히 나를 늦게 해?” How dare(어떻게 감히)로 화난 마음을 말해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">As I was sitting there stewing,</div><div class=\"k\">내가 안달하면서 거기(= 자동차 안)에 앉아 있을 때,</div></div><div class=\"rc\"><div class=\"e\">I realized</div><div class=\"k\">나는 깨달았다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">how ridiculous I was being</span>.</div><div class=\"k\"><span class=\"cw\">내 자신이 얼마나 어리석게 굴고 있는지</span>.</div></div><div class=\"rnat\">내가 안달하면서 거기(자동차)에 앉아 있을 때, 나는 내 자신이 얼마나 어리석게 굴고 있는지 깨달았다.</div><div class=\"rst\">씩씩대다가 내가 얼마나 어리석게 굴고 있는지 깨달았어요. how(얼마나) + 형용사 + 주어 + 동사 순서예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Suddenly, a phrase I once read</div><div class=\"k\">불현듯 내가 언젠가 읽었던 문구 하나가</div></div><div class=\"rc\"><div class=\"e\">came floating into my mind:</div><div class=\"k\">마음속에 떠올랐다:</div></div><div class=\"rc\"><div class=\"e\">‘You must do him or her a kindness</div><div class=\"k\">‘사람들에게 친절을 베풀어야 한다</div></div><div class=\"rc\"><div class=\"e\">for inner reasons,</div><div class=\"k\">내적 동기로,</div></div><div class=\"rc\"><div class=\"e\">not because someone is keeping score</div><div class=\"k\">누군가 점수를 매기고 있기 때문이 아니라</div></div><div class=\"rc\"><div class=\"e\">or because you will be punished if you don’t.’</div><div class=\"k\">또는 당신이 하지 않으면 처벌을 받기 때문이 아니라.’</div></div><div class=\"rnat\">불현듯 내가 언젠가 읽었던 문구 하나가 마음속에 떠올랐는데, ‘누군가 점수를 매기고 있기 때문이거나, 당신이 하지 않으면 처벌을 받기 때문이 아니라 내적 동기로 사람들에게 친절을 베풀어야 한다.’는 문구였다.</div><div class=\"rst\">예전에 읽은 문구가 떠올랐어요. 친절은 점수 때문이 아니라 마음에서 우러나야 한대요. 진짜 동사는 came(떠올랐다)이에요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">I realized</div><div class=\"k\">나는 깨달았다</div></div><div class=\"rc ckc\"><div class=\"e\">that I <span class=\"cw\">had wanted a reward</span>:</div><div class=\"k\"><span class=\"cw\">내가 보상을 원했었다는 것을</span>: ※ 문제지엔 what으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">If I do this nice thing for you,</div><div class=\"k\">내가 당신에게 이런 친절을 베푼다면,</div></div><div class=\"rc\"><div class=\"e\">you (or someone else)</div><div class=\"k\">당신이 (또는 어떤 다른 사람이)</div></div><div class=\"rc\"><div class=\"e\">will do an equally nice thing for me.</div><div class=\"k\">나에게 동등하게 친절을 베풀 것이라는.</div></div><div class=\"rnat\">나는 내가 보상을 원했었다는 사실을 깨달았는데, 내가 당신에게 이런 친절을 베푼다면 당신이 (또는 어떤 다른 사람이) 나에게 동등하게 친절을 베풀 것이라는 생각이었다.</div><div class=\"rst\">나는 <b>보상을 원했었다</b>는 걸 깨달았어요. 뒤 절이 완전하니 what(~하는 것)이 아니라 that(~라는 것)이 맞아요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"constant\" data-m=\"끊임없는\"><b>constant</b>끊임없는</button><button type=\"button\" class=\"wdb\" data-w=\"irritated\" data-m=\"짜증 난\"><b>irritated</b>짜증 난</button><button type=\"button\" class=\"wdb\" data-w=\"graciously\" data-m=\"친절하게, 정중하게\"><b>graciously</b>친절하게, 정중하게</button><button type=\"button\" class=\"wdb\" data-w=\"ridiculous\" data-m=\"어리석은, 터무니없는\"><b>ridiculous</b>어리석은, 터무니없는</button><button type=\"button\" class=\"wdb\" data-w=\"stream of traffic\" data-m=\"차량 행렬\"><b>stream of traffic</b>차량 행렬</button><button type=\"button\" class=\"wdb\" data-w=\"reward\" data-m=\"보상\"><b>reward</b>보상</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>20%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이 글은 처음부터 끝까지 <b>서양 과학만 믿는 완고한 사람들</b>을 비판해요. 그들은 과학을 <b>꽉 붙잡는 쪽</b>이니, 그 방향과 어긋나는 낱말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글의 방향</span><div class=\"en\">Those who <mark>limit themselves</mark> to Western scientific research have virtually ignored anything …</div><p class=\"ko\">서양의 과학 연구에 <mark>자신을 국한하는</mark> 사람들은 어떤 것이든 거의 무시해 왔다 …</p></div><div class=\"ck-via\"><i>▼</i><span>서양 과학만 고집하는 사람들이 과학의 힘에 '반대'한다? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ②번 자리 (3번)</span><div class=\"en\">Many continue to <u>② object</u> with an almost religious passion to this cultural paradigm about the power of science</div><p class=\"ko\">많은 사람이 과학의 힘에 관한 이 문화적 패러다임에 거의 종교적 열정을 갖고 계속 ( 반대한다? ) → 집착한다가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>종교처럼 뜨거운 열정은 반대가 아니라 매달리는 마음이에요</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 · 결정적 단서</span><div class=\"en\"><mark>with an almost religious passion</mark> to this cultural paradigm about the power of science</div><p class=\"ko\"><mark>거의 종교적 열정을 갖고</mark> 과학의 힘에 관한 이 문화적 패러다임에</p></div><div class=\"ck-via\"><i>▼</i><span>결과를 보고도 모델을 안 바꾸니, 과학 모델을 꽉 붙잡고 있는 거예요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 끝까지 같은 방향</span><div class=\"en\">many have tried to deny the results <mark>rather than modify the scientific model</mark>.</div><p class=\"ko\">많은 이들이 <mark>과학적 모델을 수정하기보다는</mark> 그 결과를 애써 부정해 왔다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">object to(~에 반대하다) ↔ cling to(~에 집착하다)</p><p class=\"gr\">좋아하고 믿는 대상에는 cling to(~에 집착하다), 싫고 거부하는 대상에는 object to(~에 반대하다)예요. 열정(passion)이 붙으면 매달리는 쪽이에요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The little boy clings to his favorite toy.</div><div class=\"ko\">그 꼬마는 제일 좋아하는 장난감에 매달려요. (좋아하는 것 → 집착)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The little boy objects to his favorite toy.</div><div class=\"ko\">제일 좋아하는 장난감에 반대한다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Many students object to the new school rule.</div><div class=\"ko\">많은 학생이 새 교칙에 반대해요. (싫은 것 → 반대)</div></div><p class=\"gb\">지문 3번 사람들은 과학의 힘을 거의 종교처럼 믿어요. 그러니 object(반대하다)가 아니라 cling(집착하다)이어야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">object → cling (집착하다)<small>종교적 열정을 가진 사람들은 과학의 힘에 반대(object)가 아니라 집착(cling)해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">counter 반격하다</span><span class=\"why\">4번은 비서양 패러다임을 열등하다고 묵살하는(dismissing) 사람들이에요. 대체 의학이 주는 위협(threat)에 맞서 반격하는 게 방향에 맞아서 counter(반격하다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">ignored 무시했다</span><span class=\"why\">1번은 서양 과학에만 자신을 국한하는(limit themselves to) 사람들이에요. 오감으로 감지 안 되는 건 무시한다는 게 2번 dismissed(일축된다)와 같은 방향이라 ignored(무시했다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">concern ~와 관련되다</span><span class=\"why\">5번은 생물 의학이 설명 못 하는 현상들이 대체 의학 시술자들과 '관련된' 것이라는 말이에요. 여기서 concern(~와 관련되다)은 뜻 그대로 자연스러워요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">deny 부정하다</span><span class=\"why\">6번은 rather than modify(수정하기보다는)와 짝이에요. 모델을 바꾸지 않고 결과를 부정한다는 게 완고한 사람들의 방향과 맞아서 deny(부정하다)가 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc ckc\"><div class=\"e\">Those who <span class=\"cw\">limit themselves</span></div><div class=\"k\"><span class=\"cw\">자신을 국한하는</span> 사람들은</div></div><div class=\"rc\"><div class=\"e\">to Western scientific research</div><div class=\"k\">서양의 과학 연구에</div></div><div class=\"rc\"><div class=\"e\">have virtually ignored anything</div><div class=\"k\">어떤 것이든 거의 무시해 왔다</div></div><div class=\"rc\"><div class=\"e\">that cannot be perceived by the five senses</div><div class=\"k\">오감으로 감지되지 않는</div></div><div class=\"rc\"><div class=\"e\">and repeatedly measured or quantified.</div><div class=\"k\">그리고 반복적으로 측정되거나 정량화되지 못하는.</div></div><div class=\"rnat\">서양의 과학 연구에 국한되는 사람들은 오감으로 감지되지 않고 반복적으로 측정되거나 정량화되지 못하는 것은 어떤 것이든 거의 무시해 왔다.</div><div class=\"rst\">서양 과학만 믿는 사람들은 눈에 안 보이고 잴 수 없는 건 거의 다 <b>무시해 왔어요</b>. 그래서 ① ignored(무시했다)는 방향이 맞아요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Research is dismissed as superstitious and invalid</div><div class=\"k\">연구는 미신적이고 근거가 없다고 일축된다</div></div><div class=\"rc\"><div class=\"e\">if it cannot be scientifically explained</div><div class=\"k\">그것(= 연구)이 과학적으로 설명될 수 없다면</div></div><div class=\"rc\"><div class=\"e\">by cause and effect.</div><div class=\"k\">원인과 결과에 의해.</div></div><div class=\"rnat\">연구는 원인과 결과에 의해 과학적으로 설명될 수 없다면 미신적이고 근거가 없다고 일축된다.</div><div class=\"rst\">원인과 결과로 설명이 안 되는 연구는 “미신이야, 근거 없어!” 하고 일축돼요. 1번과 같은 방향이에요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Many continue to cling</div><div class=\"k\">많은 사람이 계속 집착한다 ※ 문제지엔 object로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">with an almost religious passion</span></div><div class=\"k\"><span class=\"cw\">거의 종교적 열정을 갖고</span></div></div><div class=\"rc\"><div class=\"e\">to this cultural paradigm about the power of science</div><div class=\"k\">과학의 힘에 관한 이 문화적 패러다임에</div></div><div class=\"rc\"><div class=\"e\">— more specifically,</div><div class=\"k\">— 더 구체적으로는,</div></div><div class=\"rc\"><div class=\"e\">the power that science gives them.</div><div class=\"k\">과학이 그들(= 많은 사람)에게 주는 힘.</div></div><div class=\"rnat\">많은 사람이 과학의 힘, 더 구체적으로는 과학이 그들에게 주는 힘에 관한 이 문화적 패러다임에 거의 종교적 열정을 갖고 계속 반대한다(→ 집착한다).</div><div class=\"rst\">많은 사람이 과학의 힘을 <b>거의 종교적 열정</b>으로 꽉 붙잡아요. 그래서 object(반대하다)가 아니라 cling(집착하다)이 맞아요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">By dismissing non-Western scientific paradigms</div><div class=\"k\">비서양의 과학적 패러다임을 묵살함으로써</div></div><div class=\"rc\"><div class=\"e\">as inferior at best and inaccurate at worst,</div><div class=\"k\">기껏해야 열등하고 최악의 경우 부정확하다고,</div></div><div class=\"rc\"><div class=\"e\">the most rigid members</div><div class=\"k\">가장 완고한 구성원들은</div></div><div class=\"rc\"><div class=\"e\">of the conventional medical research community</div><div class=\"k\">전통적인 의학 연구 단체의</div></div><div class=\"rc\"><div class=\"e\">try to counter the threat</div><div class=\"k\">위협에 반격하려 한다</div></div><div class=\"rc\"><div class=\"e\">that alternative therapies and research pose to their work,</div><div class=\"k\">대체 의학 요법과 연구가 그들(= 가장 완고한 구성원들)의 연구에 가하는,</div></div><div class=\"rc\"><div class=\"e\">their well-being, and their worldviews.</div><div class=\"k\">그들의 행복, 그리고 그들의 세계관에.</div></div><div class=\"rnat\">비서양의 과학적 패러다임을 기껏해야 열등하고 최악의 경우 부정확하다고 묵살함으로써, 전통적인 의학 연구 단체의 가장 완고한 구성원들은 대체 의학 요법과 연구가 자신들의 연구, 자신들의 행복, 그리고 자신들의 세계관에 가하는 위협에 반격하려 한다.</div><div class=\"rst\">가장 완고한 사람들은 대체 의학을 열등하다고 깎아내리며, 그 위협에 맞서 반격해요. ③ counter(반격하다)는 방향이 맞아요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">And yet,</div><div class=\"k\">그럼에도 불구하고,</div></div><div class=\"rc\"><div class=\"e\">biomedical research cannot explain</div><div class=\"k\">생물 의학 연구는 설명할 수 없다</div></div><div class=\"rc\"><div class=\"e\">many of the phenomena</div><div class=\"k\">현상들 중 많은 것을</div></div><div class=\"rc\"><div class=\"e\">that concern alternative practitioners</div><div class=\"k\">대체 의학 시술자들과 관련된</div></div><div class=\"rc\"><div class=\"e\">regarding caring-healing processes.</div><div class=\"k\">돌봄 치료 과정에 관해서.</div></div><div class=\"rnat\">그럼에도 불구하고, 생물 의학 연구는 돌봄 치료 과정에 관해서 대체 의학 시술자들과 관련된 현상들 중 많은 것을 설명할 수 없다.</div><div class=\"rst\">그런데도 생물 의학은 대체 의학 시술자들과 관련된 현상을 많이 설명하지 못해요. ④ concern(~와 관련되다)은 뜻 그대로예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">When therapies such as acupuncture or homeopathy</div><div class=\"k\">침술 또는 동종 요법 같은 치료법이</div></div><div class=\"rc\"><div class=\"e\">are observed to result in</div><div class=\"k\">초래하는 것이 관찰될 때</div></div><div class=\"rc\"><div class=\"e\">a physiological or clinical response</div><div class=\"k\">생리적 또는 임상적 반응을</div></div><div class=\"rc\"><div class=\"e\">that cannot be explained by the biomedical model,</div><div class=\"k\">생물 의학적 모델로 설명될 수 없는,</div></div><div class=\"rc\"><div class=\"e\">many have tried to deny the results</div><div class=\"k\">많은 이들이 그 결과를 애써 부정해 왔다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">rather than modify the scientific model.</span></div><div class=\"k\"><span class=\"cw\">과학적 모델을 수정하기보다는.</span></div></div><div class=\"rnat\">침술 또는 동종 요법 같은 치료법이 생물 의학적 모델로 설명될 수 없는 생리적 또는 임상적 반응을 초래하는 것이 관찰될 때, 많은 이들이 과학적 모델을 수정하기보다는 그 결과를 애써 부정해 왔다.</div><div class=\"rst\">침술 효과가 관찰돼도, 많은 이들이 과학 모델을 <b>고치기보다는</b> 결과를 부정해 왔어요. ⑤ deny(부정하다)도 같은 방향이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"virtually\" data-m=\"사실상, 거의\"><b>virtually</b>사실상, 거의</button><button type=\"button\" class=\"wdb\" data-w=\"superstitious\" data-m=\"미신적인\"><b>superstitious</b>미신적인</button><button type=\"button\" class=\"wdb\" data-w=\"paradigm\" data-m=\"패러다임, 인식 틀\"><b>paradigm</b>패러다임, 인식 틀</button><button type=\"button\" class=\"wdb\" data-w=\"inferior\" data-m=\"열등한\"><b>inferior</b>열등한</button><button type=\"button\" class=\"wdb\" data-w=\"rigid\" data-m=\"완고한, 경직된\"><b>rigid</b>완고한, 경직된</button><button type=\"button\" class=\"wdb\" data-w=\"modify\" data-m=\"수정하다, 바꾸다\"><b>modify</b>수정하다, 바꾸다</button></div>"};

function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
