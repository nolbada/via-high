var EXP={"01": "<p class=\"mtr\">마더텅 정답률 <b>95%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">목적 문제는 <b>So(그래서)</b> + <b>would like to(~하고 싶다)</b>가 붙은 문장이 용건이에요. 앞의 50주년 이야기는 이유일 뿐, 뒤에 나열되는 것이 무엇인지 보세요.</p><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 앞부분은 이유</span><div class=\"en\">As stated in the last newsletter, this year we are happy to be celebrating our <mark>50th anniversary</mark>.</div><p class=\"ko\">지난 소식지에 쓰인 대로, 올해 저희는 저희의 <mark>50주년</mark>을 기념하게 되어 기쁩니다.</p></div><div class=\"ck-via\"><i>▼</i><span>So(그래서)로 이유가 끝나고, would like to(~하고 싶다)로 용건이 나와요</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\"><mark>So we would like to offer you</mark> <mark>further benefits</mark>.</div><p class=\"ko\"><mark>그래서 저희는 귀하께 드리고 싶습니다</mark> <mark>추가 혜택을</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>These(이것들) = 5번의 추가 혜택. 하나씩 펼쳐 보여요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 혜택 나열</span><div class=\"en\">These include free admission for up to ten people and 20% off museum merchandise on your next visit.</div><p class=\"ko\">이것들은 최대 10명까지의 무료 입장과 박물관 상품 20% 할인을 포함합니다.</p></div><div class=\"ck-via\"><i>▼</i><span>also(또한)로 혜택이 하나 더 붙어요</span></div><div class=\"ck-step\"><span class=\"lab\">7번 문장 · 혜택 하나 더</span><div class=\"en\">You will also be invited to all new exhibition openings this year at discounted prices.</div><p class=\"ko\">귀하께서는 또한 올해의 모든 새로운 전시 개막 행사에 할인된 가격으로 초대될 것입니다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">박물관 멤버십 회원을 위한 추가 혜택을 알려 주려고<small>5번의 further benefits(추가 혜택)를 6·7번에서 하나씩 알려 줘요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">박물관 개관 50주년 기념행사 취소를 공지하려고</span><span class=\"why\">[반대] 4번에서 50주년을 기념하게 되어 기쁘다고 해요. 취소한다는 말은 없고, 50주년은 혜택을 주는 이유예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">작년에 가입한 박물관 멤버십의 갱신을 요청하려고</span><span class=\"why\">[지문에 없음] 3번은 작년에 가입했다는 사실만 말해요. 다시 가입(갱신)해 달라는 부탁은 한 번도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">박물관 기념품점에서 새로 판매할 상품을 홍보하려고</span><span class=\"why\">[범위 좁음] 6번의 기념품 20% 할인은 여러 혜택 중 하나일 뿐이에요. 새 상품을 판다는 말도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">박물관 전시 프로그램에서 변경된 내용을 안내하려고</span><span class=\"why\">[지문에 없음] 7번은 새 전시 개막 행사에 할인 가격으로 초대한다는 혜택이에요. 전시가 바뀐다는 말은 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Dear Ms. Larson,</div><div class=\"k\">친애하는 Larson 씨께,</div></div><div class=\"rnat\">Larson 씨께,</div><div class=\"rst\">단골 빵집에서 문자가 왔다고 생각해 봐요. 지문도 라슨(Larson) 씨에게 보내는 편지로 시작해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">I am writing to you</div><div class=\"k\">저는 귀하께 글을 쓰고 있습니다</div></div><div class=\"rc\"><div class=\"e\">with new information</div><div class=\"k\">새로운 정보를 가지고</div></div><div class=\"rc\"><div class=\"e\">about your current membership.</div><div class=\"k\">귀하의 현재 멤버십에 관한.</div></div><div class=\"rnat\">귀하의 현재 회원 자격에 관한 새로운 소식을 전해 드리고자 글을 씁니다.</div><div class=\"rst\">“고객님 멤버십 카드에 관한 새 소식이 있어요!” 지문도 현재 멤버십에 관한 새 정보를 알리려고 쓴대요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Last year,</div><div class=\"k\">작년에,</div></div><div class=\"rc\"><div class=\"e\">you signed up for our museum membership</div><div class=\"k\">귀하께서는 저희 박물관 멤버십에 가입하셨습니다</div></div><div class=\"rc\"><div class=\"e\">that provides special discounts.</div><div class=\"k\">특별 할인을 제공하는.</div></div><div class=\"rnat\">작년에 귀하께서는 특별 할인 혜택이 있는 저희 박물관 멤버십에 가입하셨습니다.</div><div class=\"rst\">작년에 나는 할인되는 빵집 카드를 만들었어요. 지문도 라슨 씨가 작년에 할인 멤버십에 가입했다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">As stated in the last newsletter,</div><div class=\"k\">지난 소식지에 쓰인 대로,</div></div><div class=\"rc\"><div class=\"e\">this year we are happy</div><div class=\"k\">올해 저희는 기쁩니다</div></div><div class=\"rc\"><div class=\"e\">to be celebrating our 50th anniversary.</div><div class=\"k\">저희의 50주년을 기념하게 되어.</div></div><div class=\"rnat\">지난 소식지에서 알려 드린 대로, 올해 저희는 개관 50주년을 맞이하게 되어 기쁩니다.</div><div class=\"rst\">빵집이 문을 연 지 50년이 되어 다들 기뻐해요. 지문도 박물관이 50주년을 맞아 기쁘다고 해요. 이건 이유예요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">So we would like to offer you</span></div><div class=\"k\"><span class=\"cw\">그래서 저희는 귀하께 드리고 싶습니다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">further benefits</span>.</div><div class=\"k\"><span class=\"cw\">추가 혜택을</span>.</div></div><div class=\"rnat\">그래서 귀하께 추가 혜택을 드리고자 합니다.</div><div class=\"rst\"><b>그래서</b>(So) “고객님께 <b>추가 혜택</b>을 드리고 싶어요!” 이게 문자의 진짜 용건이에요. 지문의 핵심 문장이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">These include</div><div class=\"k\">이것들은 (= 추가 혜택) 포함합니다</div></div><div class=\"rc\"><div class=\"e\">free admission for up to ten people</div><div class=\"k\">최대 10명까지의 무료 입장과</div></div><div class=\"rc\"><div class=\"e\">and 20% off museum merchandise</div><div class=\"k\">박물관 상품 20% 할인을</div></div><div class=\"rc\"><div class=\"e\">on your next visit.</div><div class=\"k\">귀하의 다음 방문 때.</div></div><div class=\"rnat\">여기에는 최대 10명까지의 무료 입장과, 다음 방문 시 박물관 기념품 20% 할인이 포함됩니다.</div><div class=\"rst\">친구 10명까지 공짜 시식, 굿즈 20% 할인! 지문도 10명까지 무료 입장과 기념품 20% 할인을 혜택으로 들어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc ckc\"><div class=\"e\">You will <span class=\"cw\">also</span> be invited</div><div class=\"k\">귀하께서는 <span class=\"cw\">또한</span> 초대될 것입니다</div></div><div class=\"rc\"><div class=\"e\">to all new exhibition openings this year</div><div class=\"k\">올해의 모든 새로운 전시 개막 행사에</div></div><div class=\"rc\"><div class=\"e\">at discounted prices.</div><div class=\"k\">할인된 가격으로.</div></div><div class=\"rnat\">또한 올해 열리는 모든 신규 전시 개막 행사에 할인된 가격으로 초대해 드립니다.</div><div class=\"rst\">새 빵 출시 행사에도 싸게 초대해 줘요. 지문도 올해 새 전시 개막 행사에 할인 가격으로 초대한대요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">We hope</div><div class=\"k\">저희는 바랍니다</div></div><div class=\"rc\"><div class=\"e\">you enjoy these offers.</div><div class=\"k\">귀하께서 이 혜택들을 즐기시기를.</div></div><div class=\"rnat\">이 혜택들을 즐겨 주시기를 바랍니다.</div><div class=\"rst\">“이 혜택들 즐겨 주세요!” 지문도 혜택을 즐기길 바란다며 용건을 마무리해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">For any questions,</div><div class=\"k\">어떤 문의 사항이든,</div></div><div class=\"rc\"><div class=\"e\">please feel free to contact us.</div><div class=\"k\">부담 갖지 말고 저희에게 연락 주십시오.</div></div><div class=\"rnat\">문의 사항이 있으시면 언제든 편하게 연락 주십시오.</div><div class=\"rst\">“궁금한 건 언제든 물어보세요.” 지문도 문의 사항이 있으면 편하게 연락하라고 해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Best regards,</div><div class=\"k\">안부를 전하며,</div></div><div class=\"rc\"><div class=\"e\">Stella Harrison</div><div class=\"k\">Stella Harrison 드림</div></div><div class=\"rnat\">안부를 전하며, Stella Harrison 드림</div><div class=\"rst\">문자 끝에 가게 사장님 이름이 붙듯, 지문도 보낸 사람 스텔라 해리슨(Stella Harrison)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"membership\" data-m=\"회원권, 회원 자격\"><b>membership</b>회원권, 회원 자격</button><button type=\"button\" class=\"wdb\" data-w=\"anniversary\" data-m=\"기념일\"><b>anniversary</b>기념일</button><button type=\"button\" class=\"wdb\" data-w=\"further\" data-m=\"추가의, 더 많은\"><b>further</b>추가의, 더 많은</button><button type=\"button\" class=\"wdb\" data-w=\"admission\" data-m=\"입장\"><b>admission</b>입장</button><button type=\"button\" class=\"wdb\" data-w=\"merchandise\" data-m=\"(집합적) 상품, 기념품\"><b>merchandise</b>(집합적) 상품, 기념품</button><button type=\"button\" class=\"wdb\" data-w=\"exhibition\" data-m=\"전시(회)\"><b>exhibition</b>전시(회)</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. a link in a chain(사슬의 한 고리)을 글자 그대로 보지 말고, <b>2번의 주장</b>과 <b>3·4번 예시의 공통 결론</b>으로 속뜻을 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (6번)</span><div class=\"en\">Individuals are only <mark>“a link in a chain, a phase in a process,”</mark> he notes.</div><p class=\"ko\">개인은 그저 <mark>'사슬의 한 고리, 과정의 한 단계'</mark>일 뿐이라고 그는 말한다.</p></div><div class=\"ck-via\"><i>▼</i><span>밑줄이 비유하는 내용을 처음에 그대로 말해 준 주장 문장</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">Creativity results from <mark>a complex interaction between a person and his or her environment or culture</mark>, and also <mark>depends on timing</mark>.</div><p class=\"ko\">창의성은 <mark>한 사람과 그 사람의 환경이나 문화 사이의</mark> 복잡한 상호 작용에서 비롯되며, 또한 <mark>시기에 달려 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>3번</em>50년 일찍 태어났다면 후원 문화가 없어 업적도 없었다</span><span><em>4번</em>망원경 기술·우주 지식이 먼저 없었다면 발견도 없었다</span><span><em>6번</em>개인 = 사슬의 한 고리, 과정의 한 단계</span></div><div class=\"ck-eq\">⇒ 공통점 = 조건(환경·문화·시기)이 갖춰져야만 개인의 창의성이 나온다 → ⑤</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">개인의 창의성은 그에 필요한 조건 속에서만 나타난다.<small>고리 하나는 앞뒤 사슬(환경·문화·시기)이 있어야 의미가 있다는 뜻이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">개인은 자신의 창의적 업적에 대해 아무런 공로도 인정받지 못한다.</span><span class=\"why\">only(그저 ~일 뿐)를 너무 세게 읽은 함정이에요. 고리도 사슬의 일부라 개인의 몫은 있어요. 글은 공로가 없다가 아니라 조건이 함께 필요하다는 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">개인의 창의성은 오직 행운에서만 나온다.</span><span class=\"why\">2번은 행운이 아니라 환경·문화와의 상호 작용(interaction)과 시기(timing)를 말해요. 3·4번 예시도 운이 아니라 후원 문화와 기술 발전이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">발견은 오직 기존 지식 덕분에만 이루어질 수 있다.</span><span class=\"why\">4번 천문학자 예시 하나에만 맞아요. 3번의 후원 문화, 2번의 시기까지 묶지 못하고, '오직'이라 범위도 지나쳐요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">개인의 천재성은 일련의 획기적 발견에서 핵심 요소이다.</span><span class=\"why\">1번이 바로 이런 '혼자 해내는 창의적 개인'(in isolation 홀로)이라는 생각을 틀렸다고 해요. 글과 정반대예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Psychologist Mihaly Csikszentmihalyi suggests</div><div class=\"k\">심리학자 Mihaly Csikszentmihalyi는 말한다</div></div><div class=\"rc\"><div class=\"e\">that the common idea of a creative individual</div><div class=\"k\">창의적인 개인에 대한 일반적인 생각이</div></div><div class=\"rc\"><div class=\"e\">coming up with great insights, discoveries, works, or inventions</div><div class=\"k\">위대한 통찰, 발견, 작품, 또는 발명을 생각해 낸다는</div></div><div class=\"rc\"><div class=\"e\">in isolation</div><div class=\"k\">홀로</div></div><div class=\"rc\"><div class=\"e\">is wrong.</div><div class=\"k\">틀렸다고.</div></div><div class=\"rnat\">심리학자 Mihaly Csikszentmihalyi는, 창의적인 개인이 홀로 고립된 채 위대한 통찰이나 발견, 작품, 발명을 떠올린다는 통념이 틀렸다고 말한다.</div><div class=\"rst\">계주에서 1등 하면 마지막 주자 혼자 잘해서 이겼다고들 하죠. 지문은 이런 '혼자 해냈다'(in isolation 홀로)는 생각이 틀렸대요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">Creativity results from a complex interaction</div><div class=\"k\">창의성은 복잡한 상호 작용에서 비롯된다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">between a person and his or her environment or culture</span>,</div><div class=\"k\"><span class=\"cw\">한 사람과 그 사람의 환경이나 문화 사이의</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">and also <span class=\"cw\">depends on timing</span>.</div><div class=\"k\">그리고 또한 <span class=\"cw\">시기에 달려 있다</span>.</div></div><div class=\"rnat\">창의성은 한 사람과 그 사람의 환경 또는 문화 사이의 복잡한 상호 작용에서 비롯되며, 시기에도 좌우된다.</div><div class=\"rst\">사실은 앞 주자들, 응원, 운동장, 바통 넘기는 순간이 다 맞아야 이겨요. = 지문의 <b>환경·문화</b>와 <b>시기</b>(timing)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">For instance,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">if the great Renaissance artists like Ghiberti or Michelangelo</div><div class=\"k\">만약 Ghiberti나 Michelangelo 같은 위대한 르네상스 예술가들이</div></div><div class=\"rc\"><div class=\"e\">had been born only 50 years before they were,</div><div class=\"k\">그들이 실제로 태어난 것보다 50년만 더 일찍 태어났더라면,</div></div><div class=\"rc\"><div class=\"e\">the culture of artistic patronage</div><div class=\"k\">예술 후원의 문화가</div></div><div class=\"rc\"><div class=\"e\">would not have been in place</div><div class=\"k\">자리 잡고 있지 않았을 것이다</div></div><div class=\"rc\"><div class=\"e\">to fund or shape their great achievements.</div><div class=\"k\">그들의 (= 르네상스 예술가들) 위대한 업적에 자금을 대거나 그것을 형성해 줄.</div></div><div class=\"rnat\">예를 들어 Ghiberti나 Michelangelo 같은 위대한 르네상스 예술가들이 실제보다 50년만 일찍 태어났더라면, 그들의 위대한 업적에 자금을 대고 형태를 잡아 줄 예술 후원 문화가 아직 마련되어 있지 않았을 것이다.</div><div class=\"rst\">마지막 주자가 너무 일찍 출발하면 바통을 못 받아요. 지문도 르네상스 화가가 50년 일찍 태어났으면 후원 문화가 없었을 거래요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Consider also individual astronomers:</div><div class=\"k\">개별 천문학자들도 생각해 보라:</div></div><div class=\"rc\"><div class=\"e\">Their discoveries could not have happened</div><div class=\"k\">그들의 (= 개별 천문학자들) 발견은 일어날 수 없었을 것이다</div></div><div class=\"rc\"><div class=\"e\">unless centuries of technological development of the telescope</div><div class=\"k\">망원경의 수 세기에 걸친 기술 발전과</div></div><div class=\"rc\"><div class=\"e\">and evolving knowledge of the universe</div><div class=\"k\">우주에 관한 발전해 온 지식이</div></div><div class=\"rc\"><div class=\"e\">had come before them.</div><div class=\"k\">그들보다 (= 개별 천문학자들) 먼저 있지 않았더라면.</div></div><div class=\"rnat\">개별 천문학자들도 생각해 보라. 망원경의 수 세기에 걸친 기술 발전과 우주에 관한 발전해 온 지식이 그들보다 먼저 있지 않았더라면 그들의 발견은 일어날 수 없었을 것이다.</div><div class=\"rst\">앞 주자들이 차곡차곡 달려 준 덕에 마지막 주자가 결승선에 가요. 지문도 망원경 기술과 우주 지식이 먼저 있어야 발견이 나온대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Csikszentmihalyi’s point is</div><div class=\"k\">Csikszentmihalyi의 요점은 ~이다</div></div><div class=\"rc\"><div class=\"e\">that we should devote as much attention</div><div class=\"k\">우리가 그만큼 많은 관심을 쏟아야 한다는 것</div></div><div class=\"rc\"><div class=\"e\">to the development of a domain</div><div class=\"k\">한 분야의 발전에</div></div><div class=\"rc\"><div class=\"e\">as we do to the people working within it,</div><div class=\"k\">우리가 그것(= 그 분야) 안에서 일하는 사람들에게 쏟는 만큼,</div></div><div class=\"rc\"><div class=\"e\">as only this can properly explain</div><div class=\"k\">왜냐하면 오직 이것만이 (= 분야의 발전에 관심을 쏟는 것) 제대로 설명할 수 있기 때문이다</div></div><div class=\"rc\"><div class=\"e\">how advances are made.</div><div class=\"k\">어떻게 진보가 이루어지는지를.</div></div><div class=\"rnat\">Csikszentmihalyi의 요점은, 한 분야 안에서 일하는 사람들에게 쏟는 만큼의 관심을 그 분야 자체의 발전에도 쏟아야 한다는 것인데, 오직 그렇게 해야만 진보가 어떻게 이루어지는지를 제대로 설명할 수 있기 때문이다.</div><div class=\"rst\">그러니 마지막 주자만 보지 말고 팀 전체 경기를 봐야 해요. 지문도 사람만큼 그 분야의 발전에 관심을 쏟으라고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Individuals are only</div><div class=\"k\">개인은 그저 ~일 뿐이다</div></div><div class=\"rc ckc\"><div class=\"e\">“<span class=\"cw\">a link in a chain, a phase in a process,</span>”</div><div class=\"k\">'<span class=\"cw\">사슬의 한 고리, 과정의 한 단계</span>'</div></div><div class=\"rc\"><div class=\"e\">he notes.</div><div class=\"k\">라고 그는 (= Csikszentmihalyi) 말한다.</div></div><div class=\"rnat\">개인은 그저 '사슬의 한 고리, 과정의 한 단계'일 뿐이라고 그는 말한다.</div><div class=\"rst\">마지막 주자도 <b>바통을 잇는 한 명</b>일 뿐이에요. 그래서 밑줄은 조건이 갖춰질 때만 창의성이 나온다(⑤)는 뜻이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"in isolation\" data-m=\"고립된 상태로, 홀로\"><b>in isolation</b>고립된 상태로, 홀로</button><button type=\"button\" class=\"wdb\" data-w=\"interaction\" data-m=\"상호 작용\"><b>interaction</b>상호 작용</button><button type=\"button\" class=\"wdb\" data-w=\"patronage\" data-m=\"후원, 지원\"><b>patronage</b>후원, 지원</button><button type=\"button\" class=\"wdb\" data-w=\"in place\" data-m=\"자리를 잡은, 마련된\"><b>in place</b>자리를 잡은, 마련된</button><button type=\"button\" class=\"wdb\" data-w=\"domain\" data-m=\"(활동) 영역, 분야\"><b>domain</b>(활동) 영역, 분야</button><button type=\"button\" class=\"wdb\" data-w=\"phase\" data-m=\"단계, 국면\"><b>phase</b>단계, 국면</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>첫 문장과 마지막 문장</b>을 이어 보세요. 둘 다 <b>shadow(그림자)</b>가 발견을 이끌었다고 말하고, 가운데 갈릴레오와 금성은 그 사례예요.</p><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 화두</span><div class=\"en\">Early astronomers saw and learned more <mark>from eclipses and other forms of shadow</mark> than from direct observation.</div><p class=\"ko\">초기 천문학자들은 직접 관찰로부터보다 <mark>(해와 달 등의) 식과 다른 형태의 그림자로부터</mark> 더 많이 보고 배웠다.</p></div><div class=\"ck-via\"><i>▼</i><span>1번의 주장을 갈릴레오라는 구체적 인물로 보여 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 사례의 핵심</span><div class=\"en\">Galileo’s breakthroughs came in part from his understanding <mark>of how to use shadows</mark> to extend his powers of observation.</div><p class=\"ko\">갈릴레오의 획기적 발견은 부분적으로 <mark>그림자를 어떻게 이용하는지에 대한</mark> 그의 이해로부터 나왔다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>5번</em>금성에 그림자가 진다 → 스스로 빛나지 않는 어두운 천체</span><span><em>6번</em>그림자의 논리 → 금성은 태양 주위를 돈다</span></div><div class=\"ck-eq\">⇒ 두 발견 모두 그림자 덕분 = 그림자가 천문학의 새 발견을 이끌었다</div></div><div class=\"ck-via\"><i>▼</i><span>thus(그리하여)로 사례를 묶어 1번 화두를 되받아요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 결론</span><div class=\"en\">The end of the Ptolemaic system came quickly thereafter, <mark>a shadow thus shedding light on</mark> the ordering of the cosmos.</div><p class=\"ko\">천동설의 종말은 그 후 곧 찾아왔다, <mark>그리하여 그림자가 빛을 비추면서</mark> 우주의 질서에.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">천문학에서 새로운 발견을 이루는 데 있어 그림자의 중요성<small>1번과 7번이 모두 그림자 덕분에 우주를 알게 되었다고 말해요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">초기 기술로 행성의 움직임을 기록하는 방법</span><span class=\"why\">[범위 좁음] 4~6번에 망원경과 금성의 궤도가 나오지만 사례일 뿐이에요. 기록하는 방법이 아니라 그림자로 알아낸 것이 핵심이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">그림자를 관찰하고 추적하는 일의 어려움</span><span class=\"why\">[반대] 그림자는 어려움이 아니라 도움이에요. 3번에서 그림자로 관찰력을 extend(넓히다)했다고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">우주를 관찰하는 데 쓰이는 다양한 장치의 부족</span><span class=\"why\">[지문에 없음] 장치가 모자랐다는 말은 없어요. 2번이 문제 삼은 건 장치가 아니라 직접 관찰만 고집한 태도예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">우주 탐사를 향한 인간 열망의 일관성</span><span class=\"why\">[범위 넓음] 우주를 알고 싶은 마음 일반 이야기가 아니에요. 지문은 처음부터 끝까지 그림자(shadow)라는 한 가지 방법을 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Early astronomers saw and learned more</div><div class=\"k\">초기 천문학자들은 더 많이 보고 배웠다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">from eclipses and other forms of shadow</span></div><div class=\"k\"><span class=\"cw\">(해와 달 등의) 식과 다른 형태의 그림자로부터</span></div></div><div class=\"rc\"><div class=\"e\">than from direct observation.</div><div class=\"k\">직접 관찰로부터보다.</div></div><div class=\"rnat\">초기 천문학자들은 직접 관찰보다 일식·월식이나 그 밖의 그림자 현상에서 더 많은 것을 보고 배웠다.</div><div class=\"rst\">숨바꼭질에서 커튼 뒤 친구를 직접 못 봐도 바닥의 그림자로 찾아내요. 지문도 천문학자들이 직접 보기보다 <b>그림자</b>로 더 많이 배웠대요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">In Galileo’s time,</div><div class=\"k\">갈릴레오의 시대에는,</div></div><div class=\"rc\"><div class=\"e\">the empiricist’s insistence on direct observation</div><div class=\"k\">직접 관찰에 대한 경험주의자의 고집이</div></div><div class=\"rc\"><div class=\"e\">as the only legitimate way of knowing</div><div class=\"k\">유일하게 정당한 앎의 방식으로서의</div></div><div class=\"rc\"><div class=\"e\">limited what could be learned about the cosmos,</div><div class=\"k\">우주에 대해 알 수 있는 것을 제한했다,</div></div><div class=\"rc\"><div class=\"e\">and the medievalist allowance</div><div class=\"k\">그리고 중세 연구가의 허용은</div></div><div class=\"rc\"><div class=\"e\">for extraperceptual insights</div><div class=\"k\">지각을 넘어선 통찰에 대한</div></div><div class=\"rc\"><div class=\"e\">had nothing to contribute</div><div class=\"k\">기여할 것이 전혀 없었다</div></div><div class=\"rc\"><div class=\"e\">to what we would consider scientific inquiry.</div><div class=\"k\">우리가 과학적 탐구라고 여길 만한 것에.</div></div><div class=\"rnat\">갈릴레오의 시대에는 직접 관찰만이 유일하게 정당한 앎의 방식이라는 경험주의자들의 고집이 우주에 대해 알아낼 수 있는 범위를 제한했고, 지각을 넘어선 통찰을 허용하던 중세 연구가의 태도는 우리가 과학적 탐구라고 부를 만한 것에는 전혀 보탬이 되지 못했다.</div><div class=\"rst\">그런데 “눈으로 직접 본 것만 믿어!” 하는 술래는 친구를 잘 못 찾아요. 지문도 직접 관찰만 고집해서 알 수 있는 게 제한됐대요.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">3번 · 단서</span><div class=\"rc\"><div class=\"e\">Galileo’s breakthroughs came in part</div><div class=\"k\">갈릴레오의 획기적 발견은 부분적으로 나왔다</div></div><div class=\"rc\"><div class=\"e\">from his understanding</div><div class=\"k\">그의 이해로부터</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">of how to use shadows</span></div><div class=\"k\"><span class=\"cw\">그림자를 어떻게 이용하는지에 대한</span></div></div><div class=\"rc\"><div class=\"e\">to extend his powers of observation.</div><div class=\"k\">그의 관찰력을 넓히기 위해.</div></div><div class=\"rnat\">갈릴레오의 획기적 발견은 부분적으로, 그가 관찰의 힘을 넓히기 위해 그림자를 어떻게 이용할지 이해한 데서 나왔다.</div><div class=\"rst\">똑똑한 술래는 그림자를 이용해 더 넓게 찾아요. = 지문의 갈릴레오가 <b>그림자를 이용해</b> 관찰력을 넓힌 것이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">At the time he trained his telescope on Venus,</div><div class=\"k\">그가 (= 갈릴레오) 자신의 망원경을 금성에 겨누었던 때에,</div></div><div class=\"rc\"><div class=\"e\">it was believed</div><div class=\"k\">믿어졌다</div></div><div class=\"rc\"><div class=\"e\">the planet shone with its own light</div><div class=\"k\">그 행성이 (= 금성) 스스로의 빛으로 빛난다고</div></div><div class=\"rc\"><div class=\"e\">and moved in an orbit independent of the sun.</div><div class=\"k\">그리고 태양과 무관한 궤도로 움직인다고.</div></div><div class=\"rnat\">그가 망원경을 금성에 겨누던 무렵에는, 그 행성이 스스로 빛을 내며 태양과 무관한 궤도를 돈다고 믿어지고 있었다.</div><div class=\"rst\">다들 “커튼 뒤에는 불 켠 전등이 있어”라고 믿었어요. 지문도 금성이 스스로 빛나고 태양과 상관없이 돈다고 믿었대요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Galileo saw</div><div class=\"k\">갈릴레오는 보았다</div></div><div class=\"rc\"><div class=\"e\">that the planet was in partial shadow</div><div class=\"k\">그 행성이 (= 금성) 부분적으로 그림자가 진다는 것을</div></div><div class=\"rc\"><div class=\"e\">as it went through its phases,</div><div class=\"k\">그것이 (= 금성) 자신의 위상(상)들을 거치면서,</div></div><div class=\"rc\"><div class=\"e\">and thus had to be a dark body.</div><div class=\"k\">그래서 어두운 천체여야만 한다는 것을.</div></div><div class=\"rnat\">갈릴레오는 금성이 위상 변화를 거치는 동안 부분적으로 그림자에 잠긴다는 것을, 따라서 그 행성이 어두운 천체일 수밖에 없다는 것을 보았다.</div><div class=\"rst\">그런데 그 물건에 그림자가 지는 걸 보니 전등이 아니었어요. 지문도 금성에 그림자가 져서 어두운 천체라는 걸 알았대요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">He also realized from the logic of the shadow</div><div class=\"k\">그는 (= 갈릴레오) 또한 그림자의 논리로부터 깨달았다</div></div><div class=\"rc\"><div class=\"e\">that Venus orbited the sun,</div><div class=\"k\">금성이 태양의 궤도를 돈다는 것을,</div></div><div class=\"rc\"><div class=\"e\">since all phases from new to full</div><div class=\"k\">삭부터 만까지의 모든 위상이</div></div><div class=\"rc\"><div class=\"e\">could be observed from earth.</div><div class=\"k\">지구에서 관찰될 수 있었기 때문에.</div></div><div class=\"rnat\">그는 또한 그림자의 논리를 통해 금성이 태양 주위를 돈다는 사실을 깨달았는데, 삭(new)부터 만(full)까지 모든 위상이 지구에서 관찰될 수 있었기 때문이다.</div><div class=\"rst\">그림자 모양이 바뀌는 걸 보고 물건이 어디를 도는지도 알아내요. 지문도 그림자의 논리로 금성이 태양을 돈다는 걸 깨달았대요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">The end of the Ptolemaic system</div><div class=\"k\">천동설의 종말은</div></div><div class=\"rc\"><div class=\"e\">came quickly thereafter,</div><div class=\"k\">그 후 곧 찾아왔다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a shadow thus shedding light on</span></div><div class=\"k\"><span class=\"cw\">그리하여 그림자가 빛을 비추면서</span></div></div><div class=\"rc\"><div class=\"e\">the ordering of the cosmos.</div><div class=\"k\">우주의 질서에.</div></div><div class=\"rnat\">천동설의 종말은 그 직후 빠르게 찾아왔으니, 그림자 하나가 우주의 질서를 밝혀 준 셈이었다.</div><div class=\"rst\">결국 그림자 하나로 숨은 친구가 다 밝혀졌어요. 지문 결론도 <b>그림자가 우주의 질서를 밝혔다</b>예요. 그래서 주제는 그림자의 중요성(⑤)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"eclipse\" data-m=\"(일식·월식의) 식\"><b>eclipse</b>(일식·월식의) 식</button><button type=\"button\" class=\"wdb\" data-w=\"insistence\" data-m=\"고집, 주장\"><b>insistence</b>고집, 주장</button><button type=\"button\" class=\"wdb\" data-w=\"legitimate\" data-m=\"정당한\"><b>legitimate</b>정당한</button><button type=\"button\" class=\"wdb\" data-w=\"breakthrough\" data-m=\"획기적 발견\"><b>breakthrough</b>획기적 발견</button><button type=\"button\" class=\"wdb\" data-w=\"orbit\" data-m=\"궤도를 돌다\"><b>orbit</b>궤도를 돌다</button><button type=\"button\" class=\"wdb\" data-w=\"cosmos\" data-m=\"우주\"><b>cosmos</b>우주</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>지문 순서대로</b> 하나씩 대조하세요. 숫자·크기 선택지는 <b>or(또는)</b>를 ‘합친’으로 바꿔 놓은 작은 말 하나를 꼭 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 1번</em>Along the coast of British Columbia(브리티시컬럼비아 해안을 따라) → 같음</span><span><em>③ ↔ 4번</em>the Kermode bear(커모드 곰)가 그 지역에 삶 → 같음</span><span><em>④ ↔ 7번</em>play a vital role(중대한 역할을 하다) → 같음</span><span><em>⑤ ↔ 8번</em>home to the Western Red Cedar(웨스턴 레드 시더의 서식지) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ②를 2번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>②의 ‘합친 크기’를 2번의 크기 설명과 맞대어 봐요</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\">This land is the Great Bear Rainforest, which measures 6.4 million hectares — <mark>about the size of</mark> <mark>Ireland or Nova Scotia</mark>.</div><p class=\"ko\">이 땅은 Great Bear Rainforest이다, 그리고 그것은 640만 헥타르에 달한다 — <mark>대략</mark> <mark>아일랜드나 노바스코샤</mark>의 크기이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">Ireland와 Nova Scotia를 합친 크기이다.<small>2번은 or(또는): 둘 중 하나쯤의 크기예요. 두 곳을 합친(and) 크기가 아니에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">연어는 이 지역 생태계에서 중요한 역할을 한다.</span><span class=\"why\">6번 Salmon(연어)이 짧게 지나가서 확인을 건너뛰기 쉽지만, 7번 They play a vital role(그것들은 중대한 역할을 한다)과 같아요. They(그것들) = 연어예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">British Columbia의 해안가를 따라 위치한다.</span><span class=\"why\">1번 Along the coast of British Columbia(브리티시컬럼비아 해안을 따라) lies a land(땅이 놓여 있다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Kermode 곰이 살고 있다.</span><span class=\"why\">4번 One of the unique animals living in the area(그 지역에 사는 독특한 동물들 중 하나)가 the Kermode bear(커모드 곰)라서 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Western Red Cedar의 서식지이다.</span><span class=\"why\">8번 also home to the Western Red Cedar(웨스턴 레드 시더의 서식지이기도 하다)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Along the coast of British Columbia</div><div class=\"k\">British Columbia의 해안을 따라</div></div><div class=\"rc\"><div class=\"e\">lies a land</div><div class=\"k\">땅이 놓여 있다</div></div><div class=\"rc\"><div class=\"e\">of forest green and sparkling blue.</div><div class=\"k\">짙은 황록색과 반짝이는 푸른색의.</div></div><div class=\"rnat\">British Columbia 해안을 따라 짙은 황록색과 반짝이는 푸른색의 땅이 펼쳐져 있다.</div><div class=\"rst\">가족 캠핑 가서 숲 입구 안내판을 읽는다고 해 봐요. 첫 줄: 브리티시컬럼비아(British Columbia) 해안을 따라 있는 초록 숲. 지문 1번 = 선택지 ①이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">This land is the Great Bear Rainforest,</div><div class=\"k\">이 땅은 Great Bear Rainforest이다,</div></div><div class=\"rc\"><div class=\"e\">which measures 6.4 million hectares</div><div class=\"k\">그리고 그것은 (= Great Bear Rainforest) 640만 헥타르에 달한다</div></div><div class=\"rc ckc\"><div class=\"e\">— <span class=\"cw\">about the size of</span> <span class=\"cw\">Ireland or Nova Scotia</span>.</div><div class=\"k\">— <span class=\"cw\">대략</span> <span class=\"cw\">아일랜드나 노바스코샤</span>의 크기이다.</div></div><div class=\"rnat\">이 땅이 바로 Great Bear Rainforest로, 640만 헥타르에 이르는데 이는 아일랜드나 노바스코샤 정도의 크기이다.</div><div class=\"rst\">둘째 줄이 핵심! 크기는 아일랜드 <b>또는</b> 노바스코샤쯤. 둘 중 하나만큼이지, 합친 게 아니에요. 그래서 지문 2번과 ②가 어긋나요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It is home to</div><div class=\"k\">그곳은 (= Great Bear Rainforest) 서식지이다</div></div><div class=\"rc\"><div class=\"e\">a wide variety of wildlife.</div><div class=\"k\">매우 다양한 야생 동물의.</div></div><div class=\"rnat\">이곳은 아주 다양한 야생 동물의 서식지이다.</div><div class=\"rst\">셋째 줄: 이 숲엔 동물 친구들이 아주 많이 살아요. 지문 3번은 다양한 야생 동물의 서식지라고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">One of the unique animals</div><div class=\"k\">독특한 동물들 중 하나는</div></div><div class=\"rc\"><div class=\"e\">living in the area</div><div class=\"k\">그 지역에 사는</div></div><div class=\"rc\"><div class=\"e\">is the Kermode bear.</div><div class=\"k\">Kermode 곰이다.</div></div><div class=\"rnat\">이 지역에 사는 독특한 동물 가운데 하나가 Kermode 곰이다.</div><div class=\"rst\">넷째 줄: 여기 사는 특별한 동물로 커모드 곰(Kermode bear)을 소개해요. 지문 4번 = 선택지 ③이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It is a rare kind of bear</div><div class=\"k\">그것은 (= Kermode 곰) 희귀한 종류의 곰이다</div></div><div class=\"rc\"><div class=\"e\">known to be the official mammal of British Columbia.</div><div class=\"k\">British Columbia의 공식 포유동물로 알려진.</div></div><div class=\"rnat\">이 곰은 British Columbia의 공식 포유류로 알려진 희귀한 종류의 곰이다.</div><div class=\"rst\">다섯째 줄: 커모드 곰은 귀한 곰이라 이 지역 대표 동물로 뽑혔대요. 지문 5번은 공식 포유동물이라고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Salmon are also found here.</div><div class=\"k\">연어 또한 이곳에서 발견된다.</div></div><div class=\"rnat\">연어도 이곳에서 발견된다.</div><div class=\"rst\">여섯째 줄: 냇가엔 연어도 있어요. 지문 6번은 연어도 이곳에서 발견된다고 해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">They play a vital role</div><div class=\"k\">그것들은 (= 연어) 중대한 역할을 한다</div></div><div class=\"rc\"><div class=\"e\">in this area’s ecosystem</div><div class=\"k\">이 지역의 생태계에서</div></div><div class=\"rc\"><div class=\"e\">as a wide range of animals, as well as humans,</div><div class=\"k\">다양한 동물들이, 인간뿐만 아니라,</div></div><div class=\"rc\"><div class=\"e\">consume them.</div><div class=\"k\">그것들을 (= 연어) 먹기 때문에.</div></div><div class=\"rnat\">사람뿐 아니라 아주 다양한 동물이 연어를 먹기 때문에, 연어는 이 지역 생태계에서 매우 중요한 역할을 한다.</div><div class=\"rst\">일곱째 줄: 곰도 사람도 연어를 먹어서, 연어는 숲에 꼭 필요한 존재예요. 지문 7번 <b>중대한 역할</b> = 선택지 ④예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The Great Bear Rainforest is also home to</div><div class=\"k\">Great Bear Rainforest는 또한 서식지이다</div></div><div class=\"rc\"><div class=\"e\">the Western Red Cedar,</div><div class=\"k\">Western Red Cedar의,</div></div><div class=\"rc\"><div class=\"e\">a tree that can live for several hundred years.</div><div class=\"k\">수백 년 동안 살 수 있는 나무인.</div></div><div class=\"rnat\">Great Bear Rainforest에는 수백 년을 살 수 있는 나무인 Western Red Cedar도 자란다.</div><div class=\"rst\">여덟째 줄: 수백 년을 사는 나무 웨스턴 레드 시더(Western Red Cedar)도 자라요. 지문 8번 = 선택지 ⑤예요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">The tree’s wood is lightweight</div><div class=\"k\">그 나무의 목재는 가볍다</div></div><div class=\"rc\"><div class=\"e\">and rot-resistant,</div><div class=\"k\">그리고 잘 썩지 않는다,</div></div><div class=\"rc\"><div class=\"e\">so it is used</div><div class=\"k\">그래서 그것은 (= 그 나무의 목재) 사용된다</div></div><div class=\"rc\"><div class=\"e\">for making buildings and furniture.</div><div class=\"k\">건물과 가구를 만드는 데.</div></div><div class=\"rnat\">이 나무의 목재는 가볍고 잘 썩지 않아서 건물과 가구를 만드는 데 쓰인다.</div><div class=\"rst\">마지막 줄: 그 나무는 가볍고 잘 안 썩어서 집과 가구 만드는 데 써요. 지문 9번 그대로예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"measure\" data-m=\"(치수가) ~이다\"><b>measure</b>(치수가) ~이다</button><button type=\"button\" class=\"wdb\" data-w=\"home to\" data-m=\"~의 서식지인\"><b>home to</b>~의 서식지인</button><button type=\"button\" class=\"wdb\" data-w=\"mammal\" data-m=\"포유류\"><b>mammal</b>포유류</button><button type=\"button\" class=\"wdb\" data-w=\"vital\" data-m=\"매우 중요한\"><b>vital</b>매우 중요한</button><button type=\"button\" class=\"wdb\" data-w=\"ecosystem\" data-m=\"생태계\"><b>ecosystem</b>생태계</button><button type=\"button\" class=\"wdb\" data-w=\"rot-resistant\" data-m=\"잘 썩지 않는\"><b>rot-resistant</b>잘 썩지 않는</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>75%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄이 <b>동사</b>에 걸리면 <b>진짜 주어</b>부터 찾으세요. 동사 바로 앞 명사가 아니라, <b>of(~의) 앞의 명사</b>가 주어일 때가 많아요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ②번 자리 (2번)</span><div class=\"en\">… the popularity of fine breads and pastries <u>② are</u> growing even faster than new chefs can be trained.</div><p class=\"ko\">고급 빵과 페이스트리의 인기는 훨씬 더 빠르게 커지고 ( ? ) — 동사 바로 앞은 복수 명사 pastries(페이스트리들)</p></div><div class=\"ck-via\"><i>▼</i><span>of fine breads and pastries(고급 빵과 페이스트리의)는 주어를 꾸미는 말이라 괄호로 묶어요</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 주어 찾기</span><div class=\"en\"><mark>the popularity</mark> of fine breads and pastries</div><p class=\"ko\">고급 빵과 페이스트리의 <mark>인기는</mark></p></div><div class=\"ck-via\"><i>▼</i><span>주어 the popularity(인기)는 하나(단수) → are(복수용 ~이다)가 아니라 is(단수용 ~이다)</span></div><div class=\"ck-step key\"><span class=\"lab\">2번 문장 · 결정적 단서</span><div class=\"en\"><mark>is growing</mark> even faster than new chefs can be trained.</div><p class=\"ko\">새로운 요리사가 길러질 수 있는 것보다 훨씬 더 빠르게 <mark>커지고 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">주어와 동사의 수 일치: 수식어(of + 명사) 건너뛰기</p><p class=\"gr\">주어 뒤에 of(~의) + 명사 같은 꾸밈말이 붙어도 동사는 맨 앞의 진짜 주어에 맞춰요. 동사 바로 앞 명사에 속지 마세요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The color of the flowers is pink.</div><div class=\"ko\">그 꽃들의 색깔은 분홍색이다. (주어 The color 색깔 = 단수라서 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The color of the flowers are pink.</div><div class=\"ko\">바로 앞 flowers(꽃들)에 맞춰 are를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The friends of my brother are kind.</div><div class=\"ko\">내 남동생의 친구들은 친절하다. (주어 The friends 친구들 = 복수라서 are가 맞아요)</div></div><p class=\"gb\">지문 2번도 of fine breads and pastries(고급 빵과 페이스트리의)를 건너뛰면 주어는 the popularity(인기) 하나예요. 그래서 are(복수용 ~이다)가 아니라 is growing(커지고 있다)이에요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">are → is(~이다)<small>주어는 breads and pastries(빵과 페이스트리)가 아니라 the popularity(인기), 단수라서 is(~이다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">that were lost 사라져 버린</span><span class=\"why\">4번 that(~한)은 앞의 the flavors(풍미들)를 꾸미는 주격 관계대명사예요. 바로 앞 old-fashioned breads(옛날식 빵)가 아니라 flavors(풍미들)가 사라진 것이고, 둘 다 복수라 were(~였다)가 맞아요. 풍미는 스스로 잃는 게 아니라 '잃어버려진' 것이라 수동 were lost(사라져 버린)도 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~한) + 동사: 동사는 선행사(꾸밈 받는 명사)에 맞춰요</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I found the keys that were lost.</div><div class=\"ko\">나는 잃어버린 열쇠들을 찾았다. (keys 열쇠들 = 복수라서 were가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I found the keys that was lost.</div><div class=\"ko\">선행사 keys(열쇠들)가 복수인데 was를 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I found the keys that lost.</div><div class=\"ko\">열쇠가 스스로 잃은 게 아니라 '잃어버려진' 것이라 수동(were lost)이어야 해서 틀려요.</div></div><p class=\"gb\">지문 4번도 that(~한)이 the flavors(풍미들)를 꾸미고, 풍미들이 '사라져 버린' 것이라 were lost(사라져 버린)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">that carries fresh ingredients around the world 신선한 재료를 전 세계로 운반하는</span><span class=\"why\">1번 that(~하는)은 바로 앞 air transportation(항공 운송)을 꾸미는 주격 관계대명사예요. 뒤에 주어 없이 carries(운반하다)가 바로 오니 that(~하는) 자리가 맞고, 항공 운송은 하나라 carries(-s)도 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주격 관계대명사 that(~하는) + 동사: 뒤에 주어가 빠져 있어요</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I have a bike that goes fast.</div><div class=\"ko\">나는 빨리 달리는 자전거가 있다. (that 뒤에 주어 없이 goes 가다가 와서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a bike that it goes fast.</div><div class=\"ko\">that(~하는)이 이미 주어 역할인데 it(그것)을 또 써서 틀려요.</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I have a bike that go fast.</div><div class=\"ko\">a bike(자전거 한 대)가 단수인데 go를 써서 틀려요. goes가 맞아요.</div></div><p class=\"gb\">지문 1번도 that(~하는) 뒤에 주어 없이 carries(운반하다)가 오고, 꾸밈 받는 air transportation(항공 운송)이 단수라 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">a reaction among bakers and consumers alike 제빵사와 소비자들 사이에서 똑같이 반응을</span><span class=\"why\">3번 alike(똑같이)는 A and B(A와 B) 뒤에 붙어 '둘 다 똑같이'라는 뜻을 더하는 부사예요. bakers and consumers(제빵사와 소비자들) 뒤에 와서 맞고, among(~ 사이에서)도 여러 사람(복수 명사) 앞에 쓰여 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">A and B alike(A와 B 둘 다 똑같이): alike(똑같이)는 명사 뒤에서 쓰는 부사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Kids and parents alike love this movie.</div><div class=\"ko\">아이들과 부모들 모두 똑같이 이 영화를 좋아한다. (A and B 뒤의 alike 똑같이가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Kids and parents like love this movie.</div><div class=\"ko\">like(~처럼)는 뒤에 명사가 와야 하는 말이라 이 자리에선 틀려요.</div></div><p class=\"gb\">지문 3번도 bakers and consumers(제빵사와 소비자들) 뒤의 alike(똑같이)가 '둘 다 똑같이' 반응했다는 뜻이라 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">methods for producing the handmade sourdough breads 수제 발효 빵을 만들기 위한 방법을</span><span class=\"why\">5번 for(~을 위한)는 전치사라 뒤에 동사를 쓰려면 -ing(~하는 것) 형태가 와야 해요. 그래서 producing(만드는 것)이 맞고, 뒤의 the handmade sourdough breads(수제 발효 빵)가 그 목적어예요.</span><div class=\"gm wx\"><p class=\"gt\">전치사(for ~을 위한) + 동명사 -ing(~하는 것)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is a tool for cutting paper.</div><div class=\"ko\">이것은 종이를 자르기 위한 도구다. (for 뒤에 cutting 자르는 것 = -ing라서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is a tool for cut paper.</div><div class=\"ko\">전치사 for(~을 위한) 뒤에 동사원형 cut(자르다)을 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>Thank you for helping me.</div><div class=\"ko\">나를 도와줘서 고마워. (for 뒤에 helping 돕는 것이라 맞아요)</div></div><p class=\"gb\">지문 5번도 전치사 for(~을 위한) 뒤라서 producing(만드는 것)이 딱 맞는 형태예요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">In the twentieth century,</div><div class=\"k\">20세기에,</div></div><div class=\"rc\"><div class=\"e\">advances in technology,</div><div class=\"k\">기술의 진보는,</div></div><div class=\"rc\"><div class=\"e\">from refrigeration to sophisticated ovens</div><div class=\"k\">냉장에서부터 정교한 오븐까지</div></div><div class=\"rc\"><div class=\"e\">to air transportation</div><div class=\"k\">그리고 항공 운송까지</div></div><div class=\"rc\"><div class=\"e\">that carries fresh ingredients around the world,</div><div class=\"k\">신선한 재료를 전 세계로 운반하는,</div></div><div class=\"rc\"><div class=\"e\">contributed immeasurably</div><div class=\"k\">헤아릴 수 없을 만큼 기여했다</div></div><div class=\"rc\"><div class=\"e\">to baking and pastry making.</div><div class=\"k\">제빵과 페이스트리 만들기에.</div></div><div class=\"rnat\">20세기에 냉장 기술에서 정교한 오븐, 그리고 신선한 재료를 전 세계로 실어 나르는 항공 운송에 이르는 기술의 발전은 제빵과 제과에 헤아릴 수 없이 크게 기여했다.</div><div class=\"rst\">20세기에 냉장고, 좋은 오븐, 비행기 운송 덕분에 빵 만들기가 크게 발전했어요. that carries(운반하는)는 항공 운송을 꾸며요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">At the beginning of the twenty-first century,</div><div class=\"k\">21세기 초에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the popularity</span> of fine breads and pastries</div><div class=\"k\">고급 빵과 페이스트리의 <span class=\"cw\">인기는</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">is growing</span> even faster</div><div class=\"k\">훨씬 더 빠르게 <span class=\"cw\">커지고 있다</span> ※ 문제지엔 are로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">than new chefs can be trained.</div><div class=\"k\">새로운 요리사가 길러질 수 있는 것보다.</div></div><div class=\"rnat\">21세기 초에, 고급 빵과 페이스트리의 인기는 새로운 요리사를 길러 낼 수 있는 속도보다도 더 빠르게 커지고 있다.</div><div class=\"rst\">21세기엔 <b>고급 빵의 인기</b>가 요리사를 길러 내는 속도보다 빨리 커져요. 주어가 '인기'(popularity) 하나라 is(~이다)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Interestingly enough,</div><div class=\"k\">아주 흥미롭게도,</div></div><div class=\"rc\"><div class=\"e\">many of the technological advances in bread making</div><div class=\"k\">제빵에서의 많은 기술 발전은</div></div><div class=\"rc\"><div class=\"e\">have sparked a reaction</div><div class=\"k\">반응을 불러일으켰다</div></div><div class=\"rc\"><div class=\"e\">among bakers and consumers alike.</div><div class=\"k\">제빵사와 소비자들 사이에서 똑같이.</div></div><div class=\"rnat\">흥미롭게도, 제빵 분야의 기술 발전 가운데 상당수는 제빵사와 소비자 양쪽 모두에게서 반작용을 불러일으켰다.</div><div class=\"rst\">흥미롭게도 기술이 발전하자 제빵사와 손님들 <b>둘 다 똑같이</b>(alike) “이건 좀 아닌데?” 하고 반응했어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">They are looking to reclaim</div><div class=\"k\">그들은 (= 제빵사와 소비자들) 되찾기를 바라고 있다</div></div><div class=\"rc\"><div class=\"e\">some of the flavors of old-fashioned breads</div><div class=\"k\">옛날식 빵의 풍미 몇 가지를</div></div><div class=\"rc\"><div class=\"e\">that were lost</div><div class=\"k\">사라져 버린</div></div><div class=\"rc\"><div class=\"e\">as baking became more industrialized</div><div class=\"k\">제빵이 더 산업화되면서</div></div><div class=\"rc\"><div class=\"e\">and baked goods became more refined, standardized,</div><div class=\"k\">그리고 제빵 제품이 더 정제되고, 표준화되고,</div></div><div class=\"rc\"><div class=\"e\">and—some would say—flavorless.</div><div class=\"k\">그리고 — 어떤 이들은 말하기를 — 맛이 없어지면서.</div></div><div class=\"rnat\">그들은 제빵이 더 산업화되고 제빵 제품이 더 정제되고, 규격화되고, 그리고 — 어떤 이들은 말하기를 — 맛이 없어지면서 사라져 버린 옛날식 빵의 풍미 몇 가지를 되찾으려 하고 있다.</div><div class=\"rst\">공장 빵이 되면서 사라진 옛날 빵 맛을 되찾고 싶은 거예요. that were lost(사라져 버린)는 풍미들을 꾸며요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Bakers are researching methods</div><div class=\"k\">제빵사들은 방법을 연구하고 있다</div></div><div class=\"rc\"><div class=\"e\">for producing the handmade sourdough breads of the past,</div><div class=\"k\">과거의 수제 발효 빵을 만들기 위한,</div></div><div class=\"rc\"><div class=\"e\">and they are experimenting with specialty flours</div><div class=\"k\">그리고 그들은 (= 제빵사들) 특수 밀가루로 실험하고 있다</div></div><div class=\"rc\"><div class=\"e\">in their search for flavor.</div><div class=\"k\">풍미를 찾는 과정에서.</div></div><div class=\"rnat\">제빵사들은 옛날의 수제 발효 빵을 만드는 방법을 연구하고 있고, 풍미를 찾아 특수 밀가루를 실험해 보고 있다.</div><div class=\"rst\">그래서 제빵사들은 옛날 수제 빵 만드는 법을 연구해요. 전치사 for(~을 위한) 뒤라 producing(만드는 것)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"sophisticated\" data-m=\"정교한\"><b>sophisticated</b>정교한</button><button type=\"button\" class=\"wdb\" data-w=\"immeasurably\" data-m=\"헤아릴 수 없이\"><b>immeasurably</b>헤아릴 수 없이</button><button type=\"button\" class=\"wdb\" data-w=\"popularity\" data-m=\"인기\"><b>popularity</b>인기</button><button type=\"button\" class=\"wdb\" data-w=\"spark\" data-m=\"촉발하다\"><b>spark</b>촉발하다</button><button type=\"button\" class=\"wdb\" data-w=\"reclaim\" data-m=\"되찾다\"><b>reclaim</b>되찾다</button><button type=\"button\" class=\"wdb\" data-w=\"standardized\" data-m=\"규격화된\"><b>standardized</b>규격화된</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\"><b>Consequently(결과적으로)</b> 뒤 결론 문장을 가장 먼저 의심하세요. 글 전체가 <b>생물끼리의 관계가 진화를 만든다</b>고 밀었으니, 결론은 그 관계가 꼭 필요하다는 방향이어야 해요.</p><div class=\"ck-step\"><span class=\"lab\">2·3번 · 방향 잡기</span><div class=\"en\">Far from being static, the environment is <mark>constantly changing</mark> and offering new challenges to evolving populations.</div><p class=\"ko\">정적이기는커녕, 환경은 <mark>끊임없이 변하고 있다</mark> 그리고 진화하는 개체군에게 새로운 도전을 주고 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>환경을 바꾸는 가장 큰 힘이 무엇인지 알려 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 · 변화의 정체</span><div class=\"en\">the most significant changes in the environment are those produced by the contemporaneous evolution of other organisms.</div><p class=\"ko\">환경에서 가장 중요한 변화들은 다른 생물들의 동시대 진화에 의해 만들어진 것들이다.</p></div><div class=\"ck-via\"><i>▼</i><span>말과 포식자 예시: 서로가 있어야만 진화가 일어나요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 · 결정적 단서</span><div class=\"en\">The horse’s efficient mechanism for running <mark>would never have evolved</mark> except for the fact that meat-eating predators were at the same time evolving more efficient methods of attack.</div><p class=\"ko\">달리기를 위한 말의 효율적인 기제는 육식성 포식자들이 동시에 더 효율적인 공격 방법을 진화시키고 있었다는 사실이 없었다면 <mark>결코 진화하지 않았을 것이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>관계 없이는 진화도 없는데, 그 관계가 '선택'이라고? 방향이 거꾸로예요</span></div><div class=\"ck-step\"><span class=\"lab\">문제지 ⑤번 자리 (8번)</span><div class=\"en\"><mark>Consequently</mark>, laws based upon ecological relationships among different kinds of organisms are <u>⑤ optional</u> for understanding evolution …</div><p class=\"ko\"><mark>결과적으로</mark>, 생물들 사이의 생태적 관계에 근거한 법칙들은 진화를 이해하는 데 ( 선택적? ) → 필수적이다가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">optional(선택적인) ↔ essential(필수적인)</p><p class=\"gr\">앞에서 '이것 없이는 결코 안 된다'— except for(~이 없었다면) + would never have(결코 ~않았을 것이다) —고 했으면, 결론은 essential(필수적인)이에요. optional(선택적인)은 '없어도 된다'는 정반대 뜻이에요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Without a ball, we can never play soccer, so a ball is essential.</div><div class=\"ko\">공이 없으면 축구를 절대 못 하니 공은 필수적이에요. (없으면 안 됨 → 필수)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Without a ball, we can never play soccer, so a ball is optional.</div><div class=\"ko\">공 없이는 절대 못 한다면서 공이 선택이라니 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>A hat is optional for the soccer game.</div><div class=\"ko\">축구 경기에 모자는 선택이에요. (없어도 경기는 됨 → 선택)</div></div><p class=\"gb\">지문 7번에서 포식자의 진화가 없었다면 말의 달리기는 결코 진화하지 않았다고 했어요. 그러니 8번은 optional(선택적인)이 아니라 essential(필수적인)이어야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">optional → essential (필수적인)<small>7번처럼 관계가 없으면 진화도 없으니, 그 관계의 법칙은 선택이 아니라 필수예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">advantage 이점</span><span class=\"why\">6번은 But(그러나)과 no(아무런 ~ 없는)가 있어 부정 문장처럼 보여 의심하기 쉬워요. 하지만 쫓기지 않으면 질주가 쓸모없다는 뜻이라, 포식자가 있어야 의미가 생긴다는 흐름과 맞아요. advantage(이점)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">challenges 도전</span><span class=\"why\">3번은 Far from being static(정적이기는커녕)으로 환경이 계속 변한다고 해요. 변하는 환경은 생물에게 새로운 challenges(도전)를 주니 방향이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">enabled ~할 수 있게 했다</span><span class=\"why\">5번은 발가락 다섯 개인 발이 발굽으로 진화한 덕분에 말이 빨리 달리게 됐다는 말이에요. 진화의 좋은 결과라 enabled(~할 수 있게 했다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">attack 공격</span><span class=\"why\">7번은 포식자가 같은 시기에 진화시킨 것을 말해요. 말이 빨리 달리게 된 이유니 포식자 쪽은 더 효율적인 attack(공격) 방법이어야 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">One misconception</div><div class=\"k\">한 가지 오해는</div></div><div class=\"rc\"><div class=\"e\">that often appears in the writings of physical scientists</div><div class=\"k\">물리 과학자들의 글에 자주 나타나는</div></div><div class=\"rc\"><div class=\"e\">who are looking at biology from the outside</div><div class=\"k\">생물학을 바깥에서 바라보는</div></div><div class=\"rc\"><div class=\"e\">is that the environment appears to them</div><div class=\"k\">환경이 그들에게 (= 물리 과학자들) 보인다는 것이다</div></div><div class=\"rc\"><div class=\"e\">to be a static entity,</div><div class=\"k\">정적인 실체로,</div></div><div class=\"rc\"><div class=\"e\">which cannot contribute new bits of information</div><div class=\"k\">그리고 그것은 (= 정적인 실체) 새로운 정보를 보태 줄 수 없다</div></div><div class=\"rc\"><div class=\"e\">as evolution progresses.</div><div class=\"k\">진화가 진행되어도.</div></div><div class=\"rnat\">생물학을 바깥에서 바라보는 물리 과학자들의 글에 자주 등장하는 오해 하나는, 환경이 그들에게는 진화가 진행되어도 새로운 정보를 전혀 보태 주지 못하는 정적인 실체로 보인다는 것이다.</div><div class=\"rst\">술래잡기를 바깥에서 구경만 한 사람은 “운동장은 그냥 가만히 있는 곳”이라고 생각해요. 지문 1번의 환경이 정적이라는 오해예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">This, however,</div><div class=\"k\">그러나 이것은 (= 환경이 정적인 실체라는 생각),</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">by no means the case</span>.</div><div class=\"k\"><span class=\"cw\">결코 사실이 아니다</span>.</div></div><div class=\"rnat\">그러나 이는 결코 사실이 아니다.</div><div class=\"rst\"><b>하지만</b>(however) 그건 <b>결코 사실이 아니에요</b>(by no means the case). 지문 2번이 그 오해를 딱 잘라 부정해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Far from being static,</div><div class=\"k\">정적이기는커녕,</div></div><div class=\"rc ckc\"><div class=\"e\">the environment is <span class=\"cw\">constantly changing</span></div><div class=\"k\">환경은 <span class=\"cw\">끊임없이 변하고 있다</span></div></div><div class=\"rc\"><div class=\"e\">and offering new challenges</div><div class=\"k\">그리고 새로운 도전을 주고 있다</div></div><div class=\"rc\"><div class=\"e\">to evolving populations.</div><div class=\"k\">진화하는 개체군에게.</div></div><div class=\"rnat\">환경은 정적이기는커녕 끊임없이 변하면서 진화하는 개체군에게 새로운 도전 과제를 던져 준다.</div><div class=\"rst\">운동장은 매번 술래가 바뀌고 새 작전이 나와서 늘 새로운 도전이 생겨요. 지문 3번도 환경이 <b>끊임없이 변한다</b>고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">For higher organisms,</div><div class=\"k\">고등 생물들의 경우,</div></div><div class=\"rc\"><div class=\"e\">the most significant changes in the environment</div><div class=\"k\">환경에서 가장 중요한 변화들은</div></div><div class=\"rc\"><div class=\"e\">are those produced</div><div class=\"k\">만들어진 것들(= 변화들)이다</div></div><div class=\"rc\"><div class=\"e\">by the contemporaneous evolution of other organisms.</div><div class=\"k\">다른 생물들의 동시대 진화에 의해.</div></div><div class=\"rnat\">고등 생물의 경우, 환경에서 일어나는 가장 중대한 변화는 같은 시기에 진화하는 다른 생물들이 만들어 내는 변화이다.</div><div class=\"rst\">그 변화를 만드는 건 운동장이 아니라 같이 노는 다른 친구들이에요. 지문 4번도 다른 생물들의 진화가 가장 큰 변화래요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The evolution of a horse’s hoof</div><div class=\"k\">말의 발굽의 진화는</div></div><div class=\"rc\"><div class=\"e\">from a five-toed foot</div><div class=\"k\">발가락이 다섯 개인 발로부터의</div></div><div class=\"rc\"><div class=\"e\">has enabled the horse</div><div class=\"k\">말이 ~할 수 있게 했다</div></div><div class=\"rc\"><div class=\"e\">to gallop rapidly over open plains.</div><div class=\"k\">탁 트인 평원을 빠르게 질주하도록.</div></div><div class=\"rnat\">발가락이 다섯이던 발에서 말발굽이 진화한 덕분에 말은 탁 트인 평원을 빠르게 질주할 수 있게 되었다.</div><div class=\"rst\">나는 연습해서 엄청 빨리 달리게 됐어요. 지문 5번도 발굽 덕분에 말이 평원을 빠르게 달릴 수 있게 됐대요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">But such galloping</div><div class=\"k\">그러나 그러한 질주는</div></div><div class=\"rc\"><div class=\"e\">is of no advantage to a horse</div><div class=\"k\">말에게 아무런 이점이 되지 않는다</div></div><div class=\"rc\"><div class=\"e\">unless it is being chased by a predator.</div><div class=\"k\">그것이 (= 말) 포식자에게 쫓기고 있지 않다면.</div></div><div class=\"rnat\">그러나 그런 질주는 포식자에게 쫓기는 상황이 아니라면 말에게 아무런 이점이 없다.</div><div class=\"rst\">그런데 쫓아오는 술래가 없으면 빨리 달려도 아무 소용이 없어요. 지문 6번도 포식자가 없으면 질주는 이점이 없대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The horse’s efficient mechanism for running</div><div class=\"k\">달리기를 위한 말의 효율적인 기제는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">would never have evolved</span></div><div class=\"k\"><span class=\"cw\">결코 진화하지 않았을 것이다</span></div></div><div class=\"rc\"><div class=\"e\">except for the fact</div><div class=\"k\">~라는 사실이 없었다면</div></div><div class=\"rc\"><div class=\"e\">that meat-eating predators were at the same time evolving</div><div class=\"k\">육식성 포식자들이 동시에 진화시키고 있었다는</div></div><div class=\"rc\"><div class=\"e\">more efficient methods of attack.</div><div class=\"k\">더 효율적인 공격 방법을.</div></div><div class=\"rnat\">말의 효율적인 달리기 기제는, 육식성 포식자들이 같은 시기에 더 효율적인 공격 방법을 진화시키고 있었다는 사실이 아니었다면 결코 진화하지 않았을 것이다.</div><div class=\"rst\">술래가 점점 빨라졌기 때문에 나도 빨라진 거예요. 지문 7번도 포식자가 <b>동시에</b> 공격을 발전시켜서 말의 달리기가 진화했대요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Consequently</span>,</div><div class=\"k\"><span class=\"cw\">결과적으로</span>,</div></div><div class=\"rc\"><div class=\"e\">laws based upon ecological relationships</div><div class=\"k\">생태적 관계에 근거한 법칙들은</div></div><div class=\"rc\"><div class=\"e\">among different kinds of organisms</div><div class=\"k\">서로 다른 종류의 생물들 사이의</div></div><div class=\"rc\"><div class=\"e\">are essential</div><div class=\"k\">필수적이다 ※ 문제지엔 optional로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">for understanding evolution and the diversity of life</div><div class=\"k\">진화와 생명의 다양성을 이해하는 데</div></div><div class=\"rc\"><div class=\"e\">to which it has given rise.</div><div class=\"k\">그것이 (= 진화) 생겨나게 한.</div></div><div class=\"rnat\">따라서 서로 다른 종류의 생물들 사이의 생태적 관계에 근거한 법칙들은, 진화와 그것이 낳은 생명의 다양성을 이해하는 데 필수적(essential)이다.</div><div class=\"rst\"><b>결과적으로</b>(Consequently) 술래잡기를 알려면 친구 관계를 꼭 봐야 해요. 그래서 8번은 optional(선택적인)이 아니라 essential(필수적인)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"misconception\" data-m=\"오해, 잘못된 통념\"><b>misconception</b>오해, 잘못된 통념</button><button type=\"button\" class=\"wdb\" data-w=\"static\" data-m=\"정적인\"><b>static</b>정적인</button><button type=\"button\" class=\"wdb\" data-w=\"by no means\" data-m=\"결코 ~이 아닌\"><b>by no means</b>결코 ~이 아닌</button><button type=\"button\" class=\"wdb\" data-w=\"contemporaneous\" data-m=\"같은 시기의\"><b>contemporaneous</b>같은 시기의</button><button type=\"button\" class=\"wdb\" data-w=\"predator\" data-m=\"포식자\"><b>predator</b>포식자</button><button type=\"button\" class=\"wdb\" data-w=\"ecological\" data-m=\"생태학적인\"><b>ecological</b>생태학적인</button></div>"};

  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';

  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}

}

  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
