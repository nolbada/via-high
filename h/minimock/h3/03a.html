<title>고3 미니모의고사 3회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}

.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}

.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}

.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

"ok": true, "e": ["'사슬의 한 고리, 과정의 한 단계'는 개인이 앞선 발전과 주변 여건 속에 놓여 있다는 뜻입니다", "necessary conditions(필요한 조건들)는 2번의 환경·문화·시기를 묶은 말입니다."]}], "tr": ["심리학자 Mihaly Csikszentmihalyi는, 창의적인 개인이 홀로 고립된 채 위대한 통찰이나 발견, 작품, 발명을 떠올린다는 통념이 틀렸다고 말한다.", "창의성은 한 사람과 그 사람의 환경 또는 문화 사이의 복잡한 상호 작용에서 비롯되며, 시기에도 좌우된다.", "예를 들어 Ghiberti나 Michelangelo 같은 위대한 르네상스 예술가들이 실제보다 50년만 일찍 태어났더라면, 그들의 위대한 업적에 자금을 대고 형태를 잡아 줄 예술 후원 문화가 아직 마련되어 있지 않았을 것이다.", "개별 천문학자들도 생각해 보라. 망원경의 수 세기에 걸친 기술 발전과 우주에 관한 발전해 온 지식이 그들보다 먼저 있지 않았더라면 그들의 발견은 일어날 수 없었을 것이다.", "Csikszentmihalyi의 요점은, 한 분야 안에서 일하는 사람들에게 쏟는 만큼의 관심을 그 분야 자체의 발전에도 쏟아야 한다는 것인데, 오직 그렇게 해야만 진보가 어떻게 이루어지는지를 제대로 설명할 수 있기 때문이다.", "개인은 그저 '사슬의 한 고리, 과정의 한 단계'일 뿐이라고 그는 말한다."], "ps": [{"n": 1, "ch": [{"e": "Psychologist Mihaly Csikszentmihalyi suggests", "k": "심리학자 Mihaly Csikszentmihalyi는 말한다"}, {"e": "that the common idea of a creative individual", "k": "창의적인 개인에 대한 일반적인 생각이"}, {"e": "coming up with great insights, discoveries, works, or inventions", "k": "위대한 통찰, 발견, 작품, 또는 발명을 생각해 낸다는"}, {"e": "<b>in isolation<\/b>", "k": "홀로"}, {"e": "is wrong.", "k": "틀렸다고."}], "link": "심리학자 Mihaly Csikszentmihalyi는 창의적인 개인이 홀로 위대한 통찰, 발견, 작품, 발명을 생각해 낸다는 일반적인 생각이 틀렸다고 말한다.", "easy": "창의적인 사람이 혼자서 대단한 생각이나 발명을 해낸다는 흔한 생각은 틀렸다고 Csikszentmihalyi가 말해요.", "gist": "통념을 부정하며 글을 시작합니다 — '혼자서 해낸다'는 생각은 틀렸다."}, {"n": 2, "ch": [{"e": "Creativity <b>results from<\/b> a complex interaction", "k": "창의성은 복잡한 상호 작용에서 비롯된다"}, {"e": "between a person and his or her environment or culture,", "k": "한 사람과 그 사람의 환경이나 문화 사이의,"}, {"e": "and also <b>depends on<\/b> timing.", "k": "그리고 또한 시기에 달려 있다."}], "easy": "창의성은 사람과 그 사람을 둘러싼 환경·문화가 서로 주고받는 데서 생기고, 언제 태어났는지 같은 시기도 중요해요.", "gist": "글의 주장 — 창의성은 사람 + 환경·문화 + 시기가 함께 만듭니다. (정답 근거)"}, {"n": 3, "ch": [{"e": "For instance,", "k": "예를 들어,"}, {"e": "if the great Renaissance artists like Ghiberti or Michelangelo", "k": "만약 Ghiberti나 Michelangelo 같은 위대한 르네상스 예술가들이"}, {"e": "had been born only 50 years before they were,", "k": "그들이 실제로 태어난 것보다 5 과거완료의 조건 역할을 하고, 주절은 <b>could not have happened</b>가 된다. 주어가 <b>centuries of technological development ~ and evolving knowledge ~</b>로 and로 묶인 두 덩어리라는 점도 놓치기 쉽다. 이렇게 주어가 길어질수록 '동사가 어디인가'를 먼저 찾아 표시해 두는 편이 안전하다.", "pe": "Consider \u0001also\u0002 \u0001individual\u0002 astronomers<sup>1</sup>: / Their discoveries<sup>2</sup> could not have happened / \u0001unless<sup>3</sup> centuries of technological development of the telescope and evolving knowledge of the universe had come before them\u0002.", "pk": "\u0001개별\u0002 천문학자들도 생각해 보라. / 그들의 발견은 일어날 수 없었을 것이다 / \u0001망원경의 수 세기에 걸친 기술 발전과 우주에 대한 발전하는 지식이 그들보다 앞서 와 있지 않았더라면\u0002.", "core": "천문학자들을 생각해 보라. 그들의 발견은 일어날 수 없었을 것이다.", "tags": ["명령문: 동사 Consider + 목적어 astronomers (3형식). also = 부사. individual = 형용사: astronomers 꾸밈", "주어 discoveries + 동사 could not have happened (1형식)", "<b>unless절</b> = 부사절(조건 '~하지 않는다면'): 주절 꾸밈. 안쪽 주어 centuries of ~ and ~ knowledge는 and로 묶임"], "steps": [{"t": "이 문장은 <b>명령문 한 문장 + 콜론 뒤 설명 문장</b>이다. 뒤 문장은 S+V(1형식)에 unless절이 길게 붙었다."}, {"t": "뼈대부터 찾는다.", "sub": ["앞 문장  V: Consider (생각해 보라)  O: individual astronomers (개별 천문학자들. astronomer 천문학자). also는 또한", "뒤 문장  S: their discoveries (그들의 발견. their = 천문학자들)  V: could not have happened (happen 일어나다. could not have p.p. = ~할 수 없었을 것이다)", "뼈대 = <b>Consider astronomers</b>: <b>Their discoveries could not have happened</b>"]}, {"t": "<b>unless ~ before them</b>은 <b>부사절(조건)</b>이다. unless는 ~하지 않았다면이라는 뜻이다.", "sub": ["S: centuries of technological development of the telescope and evolving knowledge of the universe (망원경의 수 세기에 걸친 기술 발전과 우주에 대해 발전하는 지식). and로 두 덩어리가 묶인 긴 주어", "V: had come (come 오다의 과거완료)  before them = 그들보다 앞서"]}, {"t": "주어 안쪽: <b>of the telescope</b>는 development를 꾸미고 (망원경의), <b>of the universe</b>는 knowledge를 꾸민다 (우주에 대한). technological은 기술적인, evolving은 발전하는이다."}, {"t": "함정: unless 뒤에는 부정이 이미 들어 있다. not이 없어도 ~하지 않았다면으로 읽는다. 전체는 ‘기술 발전이 먼저 없었다면 발견은 없었다’는 뜻이다."}], "sum": "망원경과 지식의 오랜 발전이 앞서지 않았다면 천문학자들의 발견도 없었음"}, {"i": "04", "q": "03", "s": "4", "title": "가주어 it 수동태 + 병렬 동사 + that 생략", "eng": "At the time he trained<sup>1</sup> his telescope<sup>2</sup> on Venus<sup>3</sup>, / it was believed / the planet shone with its own light / and moved in an orbit independent of the sun.", "notes": [["1", "train A on B", "A를 B에 겨누다"], ["2", "telescope", "망원경"], ["3", "Venus", "금성"]], "lit": "그가 망원경을 금성에 겨누던 무렵에는, / 이렇게 믿어지고 있었다 / 그 행성이 스스로 빛을 낸다고 / 그리고 태양과 무관한 궤도를 돈다고.", "nat": "그가 망원경을 금성에 겨누던 무렵에는, 그 행성이 스스로 빛을 내며 태양과 무관한 궤도를 돈다고 믿어지고 있었다.", "ana": "<b>it was believed</b>의 it은 '그것'이 아니라 뒤의 내용을 대신 받는 <b>가주어</b>다. 원래는 it was believed <b>that</b> ~ 인데 접속사 that이 생략되어 동사 believed 바로 뒤에 절이 붙어 버렸다. 동사 뒤에 주어+동사가 곧바로 나오면 that이 지워진 자리라고 보면 된다. 뒤의 <b>and moved</b>는 shone과 나란히 걸리는 동사로, 둘 다 주어가 <b>the planet</b>이다. <b>train A on B</b>는 '훈련하다'가 아니라 '<b>A를 B에 겨누다</b>'이다.", "pe": "\u0001At the time \u0001he trained<sup>1</sup> his telescope<sup>2</sup> on Venus<sup>3</sup>\u0002\u0002, / it was believed / the planet shone \u0001with its own light\u0002 / and moved \u0001in an orbit \u0001independent of the sun\u0002\u0002.", "pk": "\u0001그가 망원경을 금성에 겨누던 무렵에는\u0002, / 이렇게 믿어지고 있었다 / 그 행성이 \u0001스스로 빛을 낸다고\u0002 / 그리고 \u0001태양과 무관한 궤도를\u0002 돈다고.", "core": "그 행성이 빛나고 움직인다고 믿어지고 있었다.", "tags": ["At the time ~ = 전치사구(부사구, 시간): was believed 꾸밈. he trained ~ = 관계절(형용사절, 관계부사 생략): time 꾸밈. train A on B = 3형식 + on B", "<b>가주어 it</b> + 동사 was believed (수동). 진주어는 뒤의 that절(that 생략)", "진주어절: 주어 planet + 동사 shone (1형식). with its own light = 부사구(방법): shone 꾸밈", "and moved = shone과 병렬 (1형식). in an orbit ~ = 부사구: moved 꾸밈. independent of ~ = 형용사구: orbit 꾸밈"], "steps": [{"t": "이 문장은 <b>부사구 + 가주어 it + 수동태 S+V(1형식)</b>이다. 진주어절의 that이 생략되어 어디서 끊어야 할지 헷갈린다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: it (가주어)", "V: was believed (believe 믿다의 과거분사, 수동태 = 믿어졌다)", "진주어 = the planet shone ~ (that 생략, 명사절)", "뼈대 = <b>It was believed [(that) ~]</b>"]}, {"t": "<b>At the time he trained his telescope on Venus</b>는 전치사구(부사구)로 시간을 말한다.", "sub": ["he trained his telescope on Venus = time을 꾸미는 관계절(관계부사 when 생략). 그가 금성에 망원경을 겨누던 때", "train A on B = A를 B에 겨누다 (Venus 금성)"]}, {"t": "진주어절 안쪽이다.", "sub": ["S: the planet (그 행성, 금성)  V1: shone (shine 빛나다의 과거형)  with its own light = 자기 자신의 빛으로", "V2: moved (move 움직이다의 과거형)  in an orbit independent of the sun = 태양과 무관한 궤도에서 (orbit 궤도)", "independent of ~ = ~와 무관한, 형용사구로 orbit을 꾸밈"]}, {"t": "함정: believed 뒤에 that이 생략되어 있다. shone과 moved는 모두 the planet의 동사이고 and로 병렬된다."}], "sum": "당시에는 금성이 스스로 빛나고 태양과 무관한 궤도를 돈다고 믿어짐"}, {"i": "05", "q": "03", "s": "6", "title": "S+V+O(that절) + 이유 since절", "eng": "He also realized from the logic<sup>1</sup> of the shadow / that Venus orbited<sup>2</sup> the sun, / since all phases<sup>3</sup> from new to full could be observed from earth.", "notes": [["1", "logic", "논리"], ["2", "orbit", "궤도를 돌다"], ["3", "phase", "(달의) 위상"]], "lit": "그는 또한 그림자의 논리로부터 깨달았다 / 금성이 태양의 궤도를 돈다는 것을, / 초승달 모양에서 보름달 모양까지 모든 위상이 지구에서 관찰될 수 있었기 때문에.", "nat": "그는 또한 그림자의 논리를 통해 금성이 태양 주위를 돈다는 사실을 깨달았는데, 초승달 모양에서 보름달 모양에 이르는 모든 위상이 지구에서 관찰될 수 있었기 때문이다.", "ana": "<b>realized</b>의 목적어인 <b>that절</b>이 부사구 <b>from the logic of the shadow</b>에 밀려 뒤로 갔다. 동사 바로 뒤에 that이 오지 않는다고 해서 목적어가 없는 것이 아니므로, 부사구를 괄호로 묶고 읽으면 구조가 단번에 드러난다. 뒤의 <b>since</b>는 '~ 이후로'가 아니라 <b>이유</b>의 접속사다. 문장 중간에 콤마와 함께 나오는 since는 대개 이유로 읽는다.", "pe": "He \u0001also\u0002 realized \u0001from the logic<sup>1</sup> \u0001of the shadow\u0002\u0002 / that Venus orbited<sup>2</sup> the sun, / \u0001since all phases<sup>3</sup> \u0001from new to full\u0002 could be observed \u0001from earth\u0002\u0002.", "pk": "그는 또한 \u0001그림자의 논리로부터\u0002 깨달았다 / 금성이 태양의 궤도를 돈다는 것을, / \u0001초승달 모양에서 보름달 모양까지 모든 위상이 지구에서 관찰될 수 있었기 때문에\u0002.", "core": "그는 금성이 태양 주위를 돈다는 것을 깨달았다.", "tags": ["주어 He + 동사 realized (3형식). also = 부사. from the logic ~ = 부사구(근거): realized 꾸밈. of the shadow = 형용사구: logic 꾸밈", "<b>that절</b> = realized의 목적어 (명사절). Venus orbited the sun", "<b>since절</b> = 부사절(이유): 앞 절 꾸밈. from new to full = 형용사구: phases 꾸밈. from earth = 부사구: observed 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 that절이 동사에서 떨어져 있고 뒤에 since절이 붙어 길다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: he (그)", "V: realized (realize 깨닫다의 과거형)", "O: that Venus orbited the sun (금성이 태양의 궤도를 돈다는 것). orbit 궤도를 돌다", "뼈대 = <b>He realized [that Venus orbited the sun]</b>"]}, {"t": "<b>also</b>는 또한이라는 부사이고, <b>from the logic of the shadow</b>는 깨달은 근거를 말하는 전치사구(부사구)이다. 그림자의 논리로부터라는 뜻이다."}, {"t": "<b>since all phases from new to full could be observed from earth</b>는 <b>부사절(이유)</b>이다. 앞 that절의 근거를 말한다.", "sub": ["S: all phases from new to full (초승달 모양에서 보름달 모양까지 모든 위상). phase 위상", "V: could be observed (observe 관찰하다의 수동태 = 관찰될 수 있었다)  from earth = 지구에서"]}, {"t": "함정: from the logic과 that절이 떨어져 있어도 that절은 realized의 목적어이다. since는 ~ 이래로가 아니라 ~이므로이다."}], "sum": "모든 위상이 관찰되므로 금성은 태양을 돈다고 깨달음"}, {"i": "06", "q": "04", "s": "1", "title": "장소 부사구 도치(Along ~ lies + 주어)", "eng": "Along the coast<sup>1</sup> of British Columbia / lies<sup>2</sup> a land of forest green and sparkling<sup>3</sup> blue.", "notes": [["1", "coast", "해안"], ["2", "lie", "위치하다, 놓여 있다"], ["3", "sparkling", "반짝이는"]], "lit": "British Columbia의 해안을 따라 / 짙푸른 숲과 반짝이는 푸른빛의 땅이 펼쳐져 있다.", "nat": "British Columbia 해안을 따라 짙푸른 숲과 반짝이는 푸른빛의 땅이 펼쳐져 있다.", "ana": "장소를 나타내는 부사구 <b>Along the coast of British Columbia</b>가 문장 맨 앞으로 나가면서 <b>주어와 동사가 뒤집힌</b> 도치 문장이다. 진짜 주어는 동사 lies 뒤의 <b>a land</b>이다. 문장이 전치사로 시작하고 곧바로 동사가 보이면 도치를 의심해야 한다. 여기서 <b>lie</b>는 '거짓말하다'가 아니라 '<b>(장소에) 위치하다, 놓여 있다</b>'라는 뜻이다.", "pe": "\u0001Along the coast<sup>1</sup> \u0001of British Columbia\u0002\u0002 / lies<sup>2</sup> a land \u0001of forest green and sparkling<sup>3</sup> blue\u0002.", "pk": "\u0001British Columbia의 해안을 따라\u0002 / \u0001짙푸른 숲과 반짝이는 푸른빛의\u0002 땅이 펼쳐져 있다.", "core": "땅이 펼쳐져 있다.", "tags": ["<b>도치</b>: Along ~ = 전치사구(부사구): lies 꾸밈, 거의 필수에 가까운 부사구. of British Columbia = 형용사구: coast 꾸밈 [기준: 모양 규칙]", "동사 lies + 주어 a land (1형식 도치). of ~ blue = 형용사구: land 꾸밈"], "steps": [{"t": "이 문장은 <b>장소 부사구가 앞으로 나가 주어와 동사가 뒤바뀐 도치 문장</b>이다. 뼈대는 S+V(1형식)이다."}, {"t": "원래 어순으로 돌려 뼈대를 찾는다.", "sub": ["S: a land of forest green and sparkling blue (짙푸른 숲과 반짝이는 푸른빛의 땅)", "V: lies (lie 놓여 있다, 펼쳐져 있다의 3인칭 단수형)", "a land의 of 이하는 땅을 꾸미는 형용사구. forest green 짙은 녹색, sparkling 반짝이는", "뼈대 = <b>A land lies</b>"]}, {"t": "<b>Along the coast of British Columbia</b>가 앞으로 나간 부사구이다.", "sub": ["along ~을 따라, coast 해안", "of British Columbia = coast를 꾸미는 형용사구", "lies가 요구하는 장소 전치사구이다."]}, {"t": "왜 도치인가: 장소를 나타내는 부사구가 문장 맨 앞에 오면 <b>동사 + 주어</b> 순서로 바뀌는 경우가 있다."}, {"t": "함정: 동사 lies는 뒤의 a land(단수)와 수가 맞는다. 맨 앞의 Along the coast of British Columbia는 부사구라서 주어가 될 수 없다."}], "sum": "British Columbia 해안을 따라 숲과 바다의 푸른 땅이 펼쳐짐"}, {"i": "07", "q": "05", "s": "1", "title": "긴 삽입이 낀 S+V + 주격 관계절", "eng": "In the twentieth century, / advances<sup>1</sup> in technology, / from refrigeration<sup>2</sup> to sophisticated<sup>3</sup> ovens to air transportation / that carries fresh ingredients around the world, / contributed immeasurably to baking and pastry making.", "notes": [["1", "advance", "발전, 진보"], ["2", "refrigeration", "냉장 (기술)"], ["3", "sophisticated", "정교한"]], "lit": "20세기에, / 기술의 발전은, / 냉장 기술에서 정교한 오븐, 항공 운송에 이르기까지 / 신선한 재료를 전 세계로 실어 나르는, / 제빵과 제과에 헤아릴 수 없이 크게 기여했다.", "nat": "20세기에 냉장 기술에서 정교한 오븐, 그리고 신선한 재료를 전 세계로 실어 나르는 항공 운송에 이르는 기술의 발전은 제빵과 제과에 헤아릴 수 없이 크게 기여했다.", "ana": "주어는 맨 앞의 <b>advances in technology</b>이고, 동사는 맨 끝의 <b>contributed</b>이다. 그 사이에 있는 <b>from A to B to C</b> 덩어리는 통째로 주어를 부연하는 <b>삽입구</b>라서 콤마 두 개로 감싸여 있다. 삽입구는 괄호로 묶어 지운 뒤 읽어야 주어와 동사가 보인다. 그 안의 <b>that carries</b>는 바로 앞의 <b>air transportation</b>만 꾸미는 주격 관계대명사이며, 동사가 단수 carries인 것이 그 근거다.", "pe": "\u0001In the twentieth century\u0002, / advances<sup>1</sup> \u0001in technology\u0002, / \u0001from refrigeration<sup>2</sup> to \u0001sophisticated<sup>3</sup>\u0002 ovens to air transportation\u0002 / \u0001that carries \u0001fresh\u0002 ingredients \u0001around the world\u0002\u0002, / contributed \u0001immeasurably\u0002 \u0001to baking and pastry making\u0002.", "pk": "\u000120세기에\u0002, / \u0001기술의\u0002 발전은, / \u0001냉장 기술에서 정교한 오븐, 항공 운송에 이르기까지\u0002 / \u0001신선한 재료를 전 세계로 실어 나르는\u0002, / \u0001제빵과 제과에\u0002 \u0001헤아릴 수 없이\u0002 크게 기여했다.", "core": "발전은 기여했다.", "tags": ["In the twentieth century = 부사구(시간): contributed 꾸밈", "주어 advances. in technology = 형용사구: advances 꾸밈", "from A to B to C = 삽입 전치사구(형용사구): advances 꾸밈", "<b>that절</b> = 관계절(형용사절): air transportation만 꾸밈. fresh = 형용사: ingredients 꾸밈", "동사 contributed (1형식). immeasurably = 부사: contributed 꾸밈. to baking ~ = 전치사구(부사구): contributed 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 주어와 동사 사이에 삽입구가 끼어 있어 주어와 동사가 멀리 떨어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: advances (발전)", "V: contributed (contribute 기여하다의 과거형)", "뼈대 = <b>advances contributed</b>", "immeasurably = 헤아릴 수 없이 (부사)"]}, {"t": "<b>In the twentieth century</b>는 20세기에라는 부사구이고, <b>in technology</b>는 형용사구로 advances를 꾸민다. 기술의 발전이라는 뜻이다."}, {"t": "쉼표 사이의 <b>from refrigeration to sophisticated ovens to air transportation</b>은 advances의 범위를 보여 주는 삽입 전치사구이다.", "sub": ["refrigeration 냉장, sophisticated 정교한, oven 오븐, air transportation 항공 운송", "that carries fresh ingredients around the world = 관계절, air transportation만 꾸밈. 신선한 재료를 전 세계로 실어 나르는 (carry 나르다, ingredient 재료)"]}, {"t": "<b>to baking and pastry making</b>은 contribute가 거의 필수로 요구하는 전치사구(contribute to ~에 기여하다)이다. 제빵과 제과에라는 뜻이다."}, {"t": "함정: 삽입구 안의 carries는 문장의 동사가 아니다. 문장의 동사는 삽입이 끝난 뒤의 contributed이다."}], "sum": "냉장에서 항공 운송까지 기술 발전이 제빵과 제과에 크게 기여"}, {"i": "08", "q": "06", "s": "1", "title": "긴 주어 + 보어 that절 + 계속적 which", "eng": "One misconception<sup>1</sup> / that often appears in the writings<sup>2</sup> of physical scientists / who are looking at biology from the outside / is that the environment appears to them to be a static<sup>3</sup> entity, / which cannot contribute new bits of information as evolution progresses.", "notes": [["1", "misconception", "오해, 잘못된 통념"], ["2", "writings", "저술, 글"], ["3", "static", "정적인"]], "lit": "한 가지 오해가 있는데 / 물리 과학자들의 글에 자주 나타나는 / 생물학을 바깥에서 바라보는 / 그것은 환경이 그들에게 정적인 실체로 보인다는 것이다, / 진화가 진행되어도 새로운 정보를 조금도 제공하지 못하는.", "nat": "생물학을 바깥에서 바라보는 물리 과학자들의 글에 자주 등장하는 오해 하나는, 환경이 그들에게는 진화가 진행되어도 새로운 정보를 전혀 보태 주지 못하는 정적인 실체로 보인다는 것이다.", "ana": "주어 <b>One misconception</b> 뒤에 관계대명사절이 <b>두 겹</b>으로 붙었다. <b>that</b>은 misconception을, <b>who</b>는 physical scientists를 꾸민다. 관계사가 연달아 나올 때는 '<b>바로 앞 명사</b>'를 꾸미는 것이 원칙이라고 기억해 두면 헷갈리지 않는다. 한참 뒤의 <b>is</b>가 문장의 동사이고, <b>that ~ entity</b>가 보어 역할을 하는 명사절이다. 마지막 콤마 뒤의 <b>which</b>는 앞의 a static entity를 보충 설명하는 <b>계속적 용법</b>이라 '그런데 그것은'으로 이어 읽는다.", "pe": "One misconception<sup>1</sup> / \u0001that \u0001often\u0002 appears \u0001in the writings<sup>2</sup> \u0001of physical scientists\u0002\u0002\u0002 / \u0001who are looking at biology \u0001from the outside\u0002\u0002 / is that the environment appears \u0001to them\u0002 to be a static<sup>3</sup> entity, / \u0001which cannot contribute \u0001new\u0002 bits \u0001of information\u0002 \u0001as evolution progresses\u0002\u0002.", "pk": "한 가지 오해가 있는데 / \u0001물리 과학자들의 글에 자주 나타나는\u0002 / \u0001생물학을 바깥에서 바라보는\u0002 / 그것은 환경이 그들에게 정적인 실체로 보인다는 것이다, / \u0001진화가 진행되어도 새로운 정보를 조금도 제공하지 못하는\u0002.", "core": "한 가지 오해는 환경이 정적인 실체로 보인다는 것이다.", "tags": ["주어 One misconception", "<b>that절</b> = 관계절(형용사절): misconception 꾸밈. in the writings = 부사구: appears 꾸밈", "<b>who절</b> = 관계절(형용사절): physical scientists 꾸밈. from the outside = 부사구: looking 꾸밈", "동사 is + 보어 <b>that절</b>(명사절). 안쪽 environment appears to be entity (SVC). to them = 부사구: appears 꾸밈", "<b>계속적 which</b> = 관계절: entity 꾸밈 ('그런데 그것은'). as evolution progresses = 부사절: contribute 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어에 관계절이 둘 겹치고 보어는 that절이라 동사 is가 한참 뒤에 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: one misconception (한 가지 오해. misconception 오해)", "V: is", "C: that ~ (명사절, 보어)", "뼈대 = <b>One misconception is [that ~]</b>"]}, {"t": "주어를 꾸미는 관계절 두 개이다.", "sub": ["that often appears in the writings of physical scientists = 자주 나타나는 (appear 나타나다. 물리 과학자들의 글에)", "who are looking at biology from the outside = scientists를 꾸밈. 생물학을 바깥에서 바라보는"]}, {"t": "보어 that절 안쪽이다.", "sub": ["S: the environment (환경)  V: appears (appear ~처럼 보이다의 3인칭 단수형)  C: to be a static entity (정적인 실체인 것으로. static 정적인, entity 실체)", "appear 뒤의 to부정사는 보어로 보아 2형식이다(문형 기준).", "to them = 그들에게 (삽입된 전치사구)"]}, {"t": "<b>which cannot contribute new bits of information as evolution progresses</b>는 <b>계속적 관계절</b>로 a static entity를 보충 설명한다.", "sub": ["cannot contribute = 보태지 못하다, new bits of information = 새로운 정보 조각들", "as evolution progresses = 부사절. 진화가 진행됨에 따라"]}, {"t": "함정: 앞쪽의 that은 관계대명사(misconception을 꾸밈)이고, is 뒤의 that은 보어가 되는 명사절을 이끈다. 두 that의 역할이 다르다."}], "sum": "물리 과학자들은 환경을 새 정보를 못 주는 정적인 것으로 오해"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2022학년도 6월 18번", "ans": "③", "tr": [["1", "Larson 씨께,"], ["2", "귀하의 현재 회원 자격에 관한 새로운 소식을 전해 드리고자 글을 씁니다."], ["3", "작년에 귀하께서는 특별 할인 혜택이 있는 저희 박물관 멤버십에 가입하셨습니다."], ["4", "지난 소식지에서 알려 드린 대로, 올해 저희는 개관 50주년을 맞이하게 되어 기쁩니다."], ["5", "그래서 귀하께 추가 혜택을 드리고자 합니다."], ["6", "여기에는 최대 10명까지의 무료 입장과, 다음 방문 시 박물관 기념품 20% 할인이 포함됩니다."], ["7", "또한 올해 열리는 모든 신규 전시 개막 행사에 할인된 가격으로 초대해 드립니다."], ["8", "이 혜택들을 즐겨 주시기를 바랍니다."], ["9", "문의 사항이 있으시면 언제든 편하게 연락 주십시오."], ["10", "Stella Harrison 드림"]], "evh": "5번 문장", "ev": [{"en": true, "h": "So we would like to offer you further benefits. These include free admission for up to ten people and 20% off museum merchandise on your next visit."}, {"en": false, "h": "이메일 목적 문항은 <b>would like to</b>, <b>we are happy to</b> 같은 표현이 붙은 문장을 먼저 본다. 여기서는 '<b>추가 혜택을 드리고자 한다</b>'가 핵심 문장이고, 바로 뒤 두 문장이 그 혜택을 하나씩 나열한다(무료 입장 · 기념품 할인 · 전시 개막 초대). 앞부분의 50주년 이야기는 <b>혜택을 주는 이유</b>일 뿐 목적이 아니다."}], "opts": [{"n": "①", "t": "박물관 개관 50주년 기념행사 취소를 공지하려고", "a": false, "x": true, "trap": false, "e": "50주년은 나오지만 <b>취소(cancellation)</b>라는 말은 어디에도 없다. 오히려 기념해서 혜택을 늘린다는 내용이다."}, {"n": "②", "t": "작년에 가입한 박물관 멤버십의 갱신을 요청하려고", "a": false, "x": true, "trap": true, "e": "'작년에 가입하셨다'는 사실 확인일 뿐 <b>갱신(renewal)</b>을 요청하는 문장은 없다. 첫 문장만 보고 고르면 걸린다."}, {"n": "③", "t": "박물관 멤버십 회원을 위한 추가 혜택을 알려 주려고", "a": true, "x": false, "trap": false, "e": "<b>further benefits</b>(추가 혜택)를 제안하고, 무료 입장·기념품 할인·전시 개막 초대라는 구체적 항목을 이어서 알려 준다."}, {"n": "④", "t": "박물관 기념품점에서 새로 판매할 상품을 홍보하려고", "a": false, "x": true, "trap": false, "e": "merchandise가 나오지만 '새 상품을 판다'가 아니라 '<b>기존 상품을 20% 할인해 준다</b>'는 혜택 안내다."}, {"n": "⑤", "t": "박물관 전시 프로그램에서 변경된 내용을 안내하려고", "a": false, "x": true, "trap": false, "e": "전시 개막 행사 초대는 나오지만 프로그램이 <b>바뀌었다</b>는 말은 없다."}], "w": [["sign up for", "~을 신청하다, 가입하다"], ["membership", "회원권, 회원 자격"], ["as stated in", "~에 명시된 대로"], ["newsletter", "소식지"], ["anniversary", "기념일"], ["further", "추가의, 더 많은"], ["benefit", "혜택"], ["admission", "입장"], ["up to", "최대 ~까지"], ["merchandise", "(집합적) 상품, 기념품"], ["exhibition", "전시(회)"], ["feel free to V", "마음 편히 ~하다"]]}, {"q": "02", "type": "밑줄 의미", "src": "2019학년도 9월 21번", "ans": "⑤", "tr": [["1", "심리학자 Mihaly Csikszentmihalyi는, 창의적인 개인이 홀로 고립된 채 위대한 통찰이나 발견, 작품, 발명을 떠올린다는 통념이 틀렸다고 말한다."], ["2", "창의성은 한 사람과 그 사람의 환경 또는 문화 사이의 복잡한 상호 작용에서 비롯되며, 시기에도 좌우된다."], ["3", "예를 들어 Ghiberti나 Michelangelo 같은 위대한 르네상스 예술가들이 실제보다 50년만 일찍 태어났더라면, 그들의 위대한 업적에 자금을 대고 형태를 잡아 줄 예술 후원 문화가 아직 마련되어 있지 않았을 것이다."], ["4", "개별 천문학자들도 생각해 보라. 망원경의 수 세기에 걸친 기술 발전과 우주에 대한 축적된 지식이 그들보다 먼저 있지 않았더라면 그들의 발견은 일어날 수 없었을 것이다."], ["5", "Csikszentmihalyi의 요점은, 한 분야 안에서 일하는 사람들에게 쏟는 만큼의 관심을 그 분야 자체의 발전에도 쏟아야 한다는 것인데, 오직 그렇게 해야만 진보가 어떻게 이루어지는지를 제대로 설명할 수 있기 때문이다."], ["6", "개인은 그저 '사슬의 한 고리, 과정의 한 단계'일 뿐이라고 그는 말한다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "Creativity results from a complex interaction between a person and his or her environment or culture, and also depends on timing."}, {"en": false, "h": "밑줄 의미 문항은 <b>비유 표현을 글 전체의 주장으로 바꿔 읽는</b> 문제다. 두 번째 문장이 '창의성 = 사람 × 환경·문화 × 시기'라고 못 박고, 르네상스 화가와 천문학자 예시가 모두 '<b>여건이 갖춰지지 않았다면 그 업적도 없었다</b>'로 끝난다. 따라서 '사슬의 한 고리, 과정의 한 단계'는 개인이 <b>필요한 조건들이 갖춰졌을 때에만</b> 빛난다는 뜻이다."}], "opts": [{"n": "①", "t": "개인의 창의성은 오직 행운에서만 나온다.", "a": false, "x": true, "trap": false, "e": "글은 <b>환경·문화·시기</b>라는 구조적 조건을 말하지 개인의 운을 말하지 않는다. only fortune으로 좁히면 지나치다."}, {"n": "②", "t": "발견은 오직 기존 지식 덕분에만 이루어질 수 있다.", "a": false, "x": true, "trap": true, "e": "천문학자 예시 하나만 붙잡은 선택지다. 후원 문화, 시기 등 지식이 아닌 조건도 함께 나온다. only due to existing knowledge는 지나치게 좁다."}, {"n": "③", "t": "개인의 천재성은 일련의 획기적 발견에서 핵심 요소이다.", "a": false, "x": true, "trap": false, "e": "글은 오히려 <b>개인의 천재성만으로는 설명되지 않는다</b>고 주장한다. 방향이 정반대다."}, {"n": "④", "t": "개인은 자신의 창의적 업적에 대해 아무런 공로도 인정받지 못한다.", "a": false, "x": true, "trap": false, "e": "개인의 몫을 <b>부정</b>하는 것이 아니라, 분야의 발전에도 <b>같은 만큼</b>(as much as) 관심을 두라는 것이다. no credit은 과장이다."}, {"n": "⑤", "t": "개인의 창의성은 그에 필요한 조건 속에서만 나타난다.", "a": true, "x": false, "trap": false, "e": "'사슬의 고리·과정의 단계'는 개인이 <b>앞선 발전과 주변 여건이라는 사슬 안에 놓여 있을 때</b>에만 창의성을 발휘한다는 뜻이다. its necessary conditions가 environment·culture·timing을 한 단어로 묶은 표현이다."}], "w": [["in isolation", "고립된 상태로, 홀로"], ["result from", "~에서 비롯되다"], ["interaction", "상호 작용"], ["depend on", "~에 달려 있다"], ["patronage", "후원, 지원"], ["in place", "자리를 잡은, 마련된"], ["fund", "자금을 대다"], ["shape", "형성하다"], ["devote A to B", "A를 B에 쏟다"], ["domain", "(활동) 영역, 분야"], ["properly", "제대로"], ["phase", "단계, 국면"]]}, {"q": "03", "type": "주제", "src": "2021년 4월 23번", "ans": "⑤", "tr": [["1", "초기 천문학자들은 직접 관찰보다 일식·월식이나 그 밖의 그림자 현상에서 더 많은 것을 보고 배웠다."], ["2", "갈릴레오의 시대에는 직접 관찰만이 유일하게 정당한 앎의 방식이라는 경험주의자들의 고집이 우주에 대해 알아낼 수 있는 범위를 제한했고, 지각을 넘어선 통찰을 인정하던 중세주의자들의 태도는 오늘날 우리가 과학적 탐구라고 부를 만한 것에는 전혀 보탬이 되지 못했다."], ["3", "갈릴레오의 획기적 발견은 부분적으로, 그가 관찰의 힘을 넓히기 위해 그림자를 어떻게 이용할지 이해한 데서 나왔다."], ["4", "그가 망원경을 금성에 겨누던 무렵에는, 그 행성이 스스로 빛을 내며 태양과 무관한 궤도를 돈다고 믿어지고 있었다."], ["5", "갈릴레오는 금성이 위상 변화를 거치는 동안 부분적으로 그림자에 잠긴다는 것을, 따라서 그 행성이 어두운 천체일 수밖에 없다는 것을 보았다."], ["6", "그는 또한 그림자의 논리를 통해 금성이 태양 주위를 돈다는 사실을 깨달았는데, 초승달 모양에서 보름달 모양에 이르는 모든 위상이 지구에서 관찰될 수 있었기 때문이다."], ["7", "천동설의 종말은 그 직후 빠르게 찾아왔으니, 그림자 하나가 우주의 질서를 밝혀 준 셈이었다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "The end of the Ptolemaic system came quickly thereafter, a shadow thus shedding light on the orderi function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
