<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});

"t": "That is why we heavily depend on aphorisms whenever we face difficulties and challenges in the long journey of our lives.", "g": "그것이 우리가 삶의 긴 여정에서 어려움과 도전에 직면할 때마다 격언에 매우 의존하는 이유이다.", "ok": true, "e": ["(5)는 우리가 어려움에 부딪힐 때마다 격언에 크게 의존한다고 합니다", "격언이 도움이 된다는 말이라, 격언의 한계를 말하는 글의 흐름과 맞지 않습니다."]}, {"n": "④", "t": "They provide even less guidance in situations where we must make decisions.", "g": "격언은 우리가 결정을 해야 하는 상황에서는 훨씬 더 적은 지침을 준다.", "ok": false, "e": ["(6)의 They는 격언(aphorisms)을 가리킵니다", "<b>even less guidance<\/b>(훨씬 더 적은 지침)는 (4)의 <b>little insight<\/b>(거의 없는 통찰)를 이어받아 격언의 한계를 더 강조합니다", "(5)를 빼면 (4) 다음에 (6)이 자연스럽게 이어집니다."]}, {"n": "⑤", "t": "For example, when facing a choice that entails risk, which guideline should we use — “Nothing ventured, nothing gained” or “Better safe than sorry”?", "g": "예를 들어, 위험을 수반하는 선택에 직면했을 때, ‘모험하지 않으면 아무것도 얻을 수 없다’와 ‘안전한 것이 후회하는 것보다 낫다’ 중에서 우리는 어떤 지침을 이용해야 하는가?", "ok": false, "e": ["(7)은 위험이 따르는 선택에서 서로 반대되는 두 격언 중 무엇을 따라야 하느냐고 묻습니다", "결정할 때 격언이 지침을 주지 못한다는 (6)의 구체적인 예이므로 흐름에 맞습니다."]}], "tr": ["상식적인 지식은 장점이 있을 수 있지만 약점들도 있는데, 그것들(약점들) 중 결코 사소하지 않은 것은 그것(상식적인 지식)이 종종 자기 모순적이라는 것이다.", "예를 들어, 우리는 비슷한 사람들이 서로 좋아할 것이라는 말(‘같은 종류의 깃털을 가진 새들이 함께 모인다’ — 유유상종)을 듣지만, 또한 닮지 않은 사람들이 서로 좋아할 것이라는 말(‘정반대인 사람들은 서로에게 끌린다’)도 듣는다.", "우리는 집단이 개인보다 더 현명하고 더 똑똑하다는 말(‘두 개의 머리가 하나보다 낫다’ — 백지장도 맞들면 낫다)을 듣지만, 또한 집단 작업은 필연적으로 좋지 않은 결과를 만든다는 말(‘너무 많은 요리사가 수프를 망친다’ — 사공이 많으면 배가 산으로 간다)도 듣는다.", "이렇게 모순되는 말들 각각은 특정한 상황 아래에서 사실일 수 있지만, 그것들이 언제 적용되는지와 그것들이 언제 그렇지 않은지(적용되지 않는지)에 대한 명확한 진술이 없으면, 격언은 사람들 사이의 관계에 대한 통찰력을 거의 제공하지 못한다.", "그것이 우리가 우리의 삶의 긴 여정에서 어려움과 도전에 직면할 때마다 격언에 매우 의존하는 이유이다.", "격언은 우리가 결정을 해야 하는 상황에서 훨씬 더 적은 지침을 제공한다(거의 지침을 제공하지 못한다).", "예를 들어, 위험을 수반하는 선택에 직면했을 때, ‘모험하지 않으면, 아무것도 얻을 수 없다’ 또는 ‘안전한 것이 후회하는 것보다 낫다(나중에 후회하는 것보다 미리 조심하는 것이 낫다)’ 중에서 우리는 어떤 지침을 이용해야 하는가?"], "ps": [{"n": 1, "ch": [{"e": "Although <b>commonsense knowledge<\/b> may have <b>merit<\/b>,", "k": "상식적인 지식은 장점이 있을 수 있지만,"}, {"e": "it also has <b>weaknesses<\/b>,", "k": "그것<span class=\"r\">(= 상식적인 지식)<\/span>은 약점들도 있는데,"}, {"e": "<b>not the least of which<\/b> is", "k": "그것들<span class=\"r\">(= 약점들)<\/span> 중 결코 사소하지 않은 것은"}, {"e": "that it often <b>contradicts itself<\/b>.", "k": "그것<span class=\"r\">(= 상식적인 지식)<\/span>이 종종 자기모순을 일으킨다는 것이다."}], "link": "상식적인 지식은 장점이 있을 수 있지만 약점들도 있는데, 그중 결코 사소하지 않은 것은 상식이 종종 자기모순을 일으킨다는 것이다.", "easy": "상식에도 좋은 점은 있지만 약점도 있어요. 그중 중요한 약점은 상식끼리 서로 앞뒤가 안 맞을 때가 많다는 거예요.", "gist": "글의 주제 — 상식은 종종 자기모순을 일으킨다."}, {"n": 2, "ch": [{"e": "<b>For example<\/b>,", "k": "예를 들어,"}, {"e": "we hear that people who are similar will like one another", "k": "우리는 비슷한 사람들이 서로 좋아할 것이라는 말을 듣는다"}, {"e": "(“Birds of a feather flock together”)", "k": "(‘같은 종류의 깃털을 가진 새들이 함께 모인다’ — 유유상종)"}, {"e": "but also that persons who are <b>dissimilar<\/b> will like each other", "k": "하지만 또한 닮지 않은 사람들이 서로 좋아할 것이라는 말도 (듣는다)"}, {"e": "(“Opposites attract”).", "k": "(‘정반대인 사람들은 서로에게 끌린다’)."}], "link": "예를 들어, 우리는 비슷한 사람들이 서로 좋아할 것이라는 말(유유상종)을 듣지만, 닮지 않은 사람들이 서로 좋아할 것이라는 말(정반대인 사람들은 끌린다)도 듣는다.", "easy": "‘끼리끼리 어울린다’는 말도 있고, ‘정반대끼리 끌린다’는 말도 있어요. 두 말이 서로 반대예요.", "gist": "첫 번째 예 — 서로 모순되는 격언 한 쌍."}, {"n": 3, "ch": [{"e": "We are told", "k": "우리는 듣는다"}, {"e": "that groups are wiser and smarter than individuals", "k": "집단이 개인보다 더 현명하고 더 똑똑하다는 말을"}, {"e": "(“Two heads are better than one”)", "k": "(‘두 개의 머리가 하나보다 낫다’ — 백지장도 맞들면 낫다)"}, {"e": "but also that group work <b>inevitably<\/b> produces poor results", "k": "하지만 또한 집단 작업은 필연적으로 좋지 않은 결과를 만든다는 말도 (듣는다)"}, {"e": "(“Too many cooks <b>spoil<\/b> the broth”).", "k": "(‘너무 많은 요리사가 수프를 망친다’ — 사공이 많으면 배가 산으로 간다)."}], "link": "우리는 집단이 개인보다 더 현명하고 똑똑하다는 말(백지장도 맞들면 낫다)을 듣지만, 집단 작업은 필연적으로 좋지 않은 결과를 만든다는 말(사공이 많으면 배가 산으로 간다)도 듣는다.", "easy": "‘여럿이 하면 낫다’는 말도 있고, ‘여럿이 하면 일을 망친다’는 말도 있어요. 이것도 서로 반대예요.", "gist": "두 번째 예 — 또 하나의 모순되는 격언 쌍."}, {"n": 4, "ch": [{"e": "Each of these <b>contradictory<\/b> statements", "k": "이렇게 모순되는 말들 각각은"}, {"e": "may <b>hold true<\/b> under particular conditions,", "k": "특정한 상황 아래에서 r pedestrians.", "k": "사실상 보행자들에게 좋은 일이다."}], "easy": "교통 규칙을 모르는 게 오히려 보행자에게 좋은 일이라는 거예요.", "gist": "주어진 문장 뒤에 이어지는 결론 — 모르는 것이 오히려 좋다."}, {"n": 7, "ch": [{"e": "Because they do not know", "k": "그들<span class=\"r\">(= 보행자들)<\/span>은 모르기 때문에"}, {"e": "whether cars <b>are supposed to<\/b> stop,", "k": "차가 정지하기로 되어 있는지를,"}, {"e": "they act more <b>cautiously<\/b>.", "k": "그들<span class=\"r\">(= 보행자들)<\/span>은 더 조심스럽게 행동한다."}], "easy": "차가 서 줄지 모르니까 보행자가 더 조심한다는 말이에요.", "gist": "앞 문장의 이유 — 몰라서 더 조심한다."}, {"n": 8, "ch": [{"e": "Marked crosswalks, <b>by contrast<\/b>,", "k": "그에 반해서, 표시가 있는 횡단보도는"}, {"e": "may give pedestrians", "k": "보행자들에게 제공할 수 있다"}, {"e": "an <b>unrealistic<\/b> picture of their own safety.", "k": "그들 자신의 안전에 대한 비현실적인 모습을."}], "easy": "표시가 있는 횡단보도에서는 보행자가 ‘나는 안전하다’고 실제보다 크게 믿을 수 있다는 말이에요.", "gist": "마무리 — 표시가 있는 횡단보도의 위험을 대조로 보여 준다."}]}, {"no": "09", "typ": "글의 순서", "src": "2019학년도 수능 36번", "evn": [1, 4, 5, 6, 7, 3], "ev_en": "Researchers in psychology follow the scientific method to perform studies that help explain and may predict human behavior. / It often requires compromises, such as testing behavior within laboratories rather than natural settings, and asking those readily available (such as introduction to psychology students) to participate rather than collecting data from a true cross-section of the population. / It often requires great cleverness to conceive of measures that tap into what people are thinking without altering their thinking, called reactivity. / Simply knowing they are being observed may cause people to behave differently (such as more politely!). / People may give answers that they feel are more socially desirable than their true feelings. / But for all of these difficulties for psychology, the payoff of the scientific method is that the findings are replicable; that is, if you run the same study again following the same procedures, you will be very likely to get the same results.", "ev_ko": [[1, "심리학 연구원들은 인간 행동을 설명하는 데 도움을 주고 (더 나아가 어쩌면 그것을) 예측할지도 모르는 연구들을 수행하기 위해 과학적 (연구) 방법을 따른다."], [4, "(B) 그것은 종종 자연적인 환경 대신 연구실 안에서 행동을 검사하는 것, 그리고 모집단의 대표적인 실제 예로부터 정보를 수집하는 것 대신 (심리학 입문 학생들처럼) 쉽게 구할 수 있는(연구에 참여시킬 수 있는) 사람들에게 참여할 것을 요청하는 것과 같은 타협을 필요로 한다."], [5, "(B) 사람들의 생각을 바꾸는 것, 즉 반동성이라고 불리는 것 없이 사람들이 생각하고 있는 것에 접근하는 방책을 생각해 내는 것은 종종 엄청난 영리함을 필요로 한다."], [6, "(C) 단순히 그들이 관찰되고 있다는 것을 아는 것이 사람들을 다르게 (예를 들어 더 예의 바르게!) 행동하게 할 수 있다."], [7, "(C) 사람들은 그들의 진짜 생각보다 그들이 생각하기에 사회적으로 더 바람직한 대답을 할지도 모른다."], [3, "(A) 하지만 심리학 (연구)의 모든 이러한 어려움에도 불구하고, 과학적 방법의 이점은 그 결과가 반복 가능하다는 것이다. 즉, 만약 당신이 같은 연구를 동일한 절차를 따라서 다시 한다면, 당신은 (이전의 연구와) 같은 결과를 얻을 가능성이 매우 높을 것이다."]], "why": ["주어진 글 (1)과 (2)는 심리학 연구자들이 과학적 방법을 따르는 일이 훨씬 더 도전적인 과제라고 말합니다", "(B)의 (4) <b>It<\/b>(그것)은 (1)의 과학적 방법을 가리키고, 어떤 타협이 필요한지 설명합니다", "그래서 주어진 글 다음에 (B)가 옵니다", "(B)의 (5)에서는 사람들의 생각을 바꾸지 않고 그 생각에 접근하기가 쉽지 않다며 반동성을 말합니다", "(C)의 (6)은 (5)의 people(사람들)을 <b>they<\/b>(그들)로 이어받아, 관찰된다는 것을 알면 다르게 행동한다는 예를 듭니다", "(7)도 진짜 생각보다 사회적으로 바람직한 대답을 할 수 있다는 어려움입니다", "마지막으로 (A)의 (3) <b>But for all of these difficulties<\/b>(하지만 이 모든 어려움에도 불구하고)가 (B)와 (C)의 어려움들을 받아 과학적 방법의 이점을 말합니다", "그래서 (B) – (C) – (A)입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)의 <b>all of these difficulties<\/b>(이 모든 어려움)는 앞에 여러 어려움이 구체적으로 나온 뒤에 쓸 수 있는 말입니다", "주어진 글에는 아직 구체적인 어려움이 없으므로 (A)는 맨 앞에 올 수 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": false, "e": ["(A)는 이 모든 어려움에도 불구하고 과학적 방법에는 이점이 있다며 정리하는 단락입니다", "(C)는 관찰되는 사람들이 다르게 행동한다는 어려움의 예이므로 (A)보다 앞에 와야 합니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": true, "e": ["(B)에서 과학적 방법에 필요한 타협과 반동성을 말하고, (C)에서 반동성의 예를 듭니다", "그다음 (A)가 이 모든 어려움에도 불구하고 결과가 반복 가능하다는 이점을 말하며 마무리합니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(B)의 (4) It은 주어진 글 (1)의 과학적 방법을 가리키므로 (B)는 주어진 글 바로 뒤에 와야 합니다", "또 (C)의 예는 (B)의 (5)에서 반동성이 나온 뒤에 와야 자연스럽습니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(C)가 먼저 오면 (B)의 It이 (C)의 내용을 가리키는 것처럼 되어 뜻이 통하지 않습니다", "(B)의 It은 주어진 글 (1)의 과학적 방법을 가리키므로 (B)가 주어진 글 바로 뒤에 와야 합니다."]}], "tr": ["심리학 연구원들은 인간 행동을 설명하는 데 도움을 주고 (더 나아가 어쩌면 그것을) 예측할지도 모르는 연구들을 수행하기 위해 과학적 (연구) 방법을 따른다.", "이것은 달팽이나 음파를 연구하는 것보다 훨씬 더 도전적인 과제이다.", "(A) 하지만 심리학 (연구)의 모든 이러한 어려움에도 불구하고, 과학적 방법의 이점은 그 결과가 반복 가능하다는 것이다. 즉, 만약 당신이 같은 연구를 동일한 절차를 따라서 다시 한다면, 당신은 (이전의 연구와) 같은 결과를 얻을 가능성이 매우 높을 것이다.", "(B) 그것은 종종 자연적인 환경 대신 연구실 안에서 행동을 검사하는 것, 그리고 모집단의 대표적인 실제 예로부터 정보를 수집하는 것 대신 (심리학 입문 학생들처럼) 쉽게 구할 수 있는(연구에 참여시킬 수 있는) 사람들에게 참여할 것을 요청하는 것과 같은 타협을 필요로 한다.", "(B) 사람들의 생각을 바꾸는 것, 즉 반동성이라고 불리는 것 없이 사람들이 생각하고 있는 것에 접근하는 방책을 생각해 내는 것은 종종 엄청난 영리함을 필요로 한다.", "(C) 단순히 그들이 관찰되고 있다는 것을 아는 것이 사람들을 다르게 (예를 들어 더 예의 바르게!) 행동하게 할 수 있다.", "(C) 사람들은 그들의 진짜 생각보다 그들이 생각하기에 사회적으로 더 바람직한 대답을 할지도 모른다."], "ps": [{"n": 1, "ch": [{"e": "Researchers in psychology follow the <b>scientific method<\/b>", "k": "심리학 연구자들은 과학적 (연구) 방법을 따른다"}, {"e": "to perform studies", "k": "연구들을 수행하기 위해"}, {"e": "that help explain and may <b>predict<\/b> human behavior.", "k": "인간 행동을 설명하는 데 도움을 주고 (그것을) 예측할지도 모르는."}], "link": "심리학 연구자들은 인간 행동을 설명하는 데 도움을 주고 그것을 예측할지도 모르는 연구들을 수행하기 위해 과학적 방법을 따른다.", "easy": "심리학자들은 사람의 행동을 설명하고 예측하려고 과학적 방법으로 연구한다는 말이에요.", "gist": "주어진 글의 시작 — 심리학도 과학적 방법을 따른다."}, {"n": 2, "ch": [{"e": "This is a much more <b>challenging<\/b> task", "k": "이것<span class=\"r\">(= 과학적 방법으로 인간 행동을 연구하는 것)<\/span>은 훨씬 더 도전적인 과제이다"}, {"e": "than studying snails or sound waves.", "k": "달팽이나 음파를 연구하는 것보다."}], "easy": "사람을 연구하는 건 달팽이나 소리를 연구하는 것보다 훨씬 어렵다는 말이에요.", "gist": "글의 방향 — 이제 어려움이 이어질 것을 예고한다."}, {"n": 3, "ch": [{"e": "(A) But <b>for all of<\/b> these difficulties for psychology,", "k": "(A) 하지만 심리학의 이 모든 어려움<span class=\"r\">(= 앞에서 말한 타협, 반동성 같은 어려움들)<\/span>에도 불구하고,"}, {"e": "the <b>payoff<\/b> of the scientific method", "k": "과학적 방법의 이점은"}, {"e": "is that the findings are <b>replicable<\/b>;", "k": "그 결과가 반복 가능하다는 것이다."}, {"e": "that is,", "k": "즉,"}, {"e": "if you run the same study again", "k": "만약 당신이 같은 연구를 다시 한다면"}, {"e": "following the same procedures,", "k": "동일한 절차를 따라서,"}, {"e": "you will be very likely to get the same results.", "k": "당신은 같은 결과를 얻을 가능성이 매우 높을 것이다."}], "link": "하지만 심리학 연구의 이 모든 어려움에도 불구하고, 과학적 방법의 이점은 그 결과가 반복 가능하다는 것이다. 즉, 같은 절차를 따라 같은 연구를 다시 하면 같은 결과를 얻을 가능성이 매우 높다.", "easy": "이런 여러 어려움이 있어도, 과학적 방법을 쓰면 같은 방법으로 다시 연구했을 때 같은 결과가 나온다는 장점이 있어요.", "gist": "마지막 단락 — 앞의 어려움들을 모두 받아 과학적 방법의 이점으로 마무리한다."}, {"n": 4, "ch": [{"e": "(B) It often requires <b>compromises<\/b>,", "k": "(B) 그것<span class=\"r\">(= 과학적 방법을 따르는 것)<\/span>은 종종 타협을 필요로 한다,"}, {"e": "such as testing behavior within <b>laboratories<\/b>", "k": "연구실 안에서 행동을 검사하는 것과 같은"}, {"e": "rather than natural settings,", "k": "자연적인 환경 대신,"}, {"e": "and asking those <b>readily available<\/b>", "k": "그리고 쉽게 구할 수 있는 사람들에게 요청하는 것과 같은"}, {"e": "(such as introduction to psychology students)", "k": "(심리학 입문 학생들처럼)"}, {"e": "to participate", "k": "참여할 것을"}, {"e": "rather than collecting data", "k": "정보를 수집하는 것 대신"}, {"e": "from a true <b>cross-section<\/b> of the population.", "k": "모집단의 진정한 대표 표본으로부터."}], "link": "그것은 종종 자연적인 환경 대신 연구실 안에서 행동을 검사하는 것, 그리고 모집단의 진정한 대표 표본에서 정보를 수집하는 대신 (심리학 입문 학생들처럼) 쉽게 구할 수 있는 사람들에게 참여를 요청하는 것과 같은 타협을 필요로 한다.", "easy": "과학적 방법을 지키려면 어쩔 수 없이 타협해야 할 때가 많아요. 실제 생활 대신 실험실에서 실험하고, 모든 사람을 고르게 뽑는 대신 쉽게 구할 수 있는 학생들을 참여시키는 식이에요.", "gist": "(B)의 시작 — It이 주어진 글의 과학적 방법을 받아 첫 번째 어려움(타협)을 말한다."}, {"n": 5, "ch": [{"e": "It often requires great cleverness", "k": "종종 엄청난 영리함이 필요하다"}, {"e": "to <b>conceive of<\/b> measures", "k": "방책을 생각해 내는 것에는"}, {"e": "that <b>tap into<\/b> what people are thinking", "k": "사람들이 생각하고 있는 것에 접근하는"}, {"e": "without <b>altering<\/b> their thinking,", "k": "그들<span class=\"r\">(= 사람들)<\/span>의 생각을 바꾸지 않고,"}, {"e": "called <b>reactivity<\/b>.", "k": "이렇게 생각이 바뀌는 것은 반동성이라고 불린다."}], "link": "사람들의 생각을 바꾸는 것, 즉 반동성이라고 불리는 것 없이 사람들이 생각하고 있는 것에 접근하는 방책을 생각해 내는 것은 종종 엄청난 영리함을 필요로 한다.", "easy": "사람의 생각을 바꾸지 않으면서 그 생각을 알아낼 방법을 떠올리는 건 아주 어려워요. 연구 때문에 생각이 바뀌는 것을 ‘반동성’이라고 해요.", "gist": "두 번째 어려움 — 반동성이라는 개념이 처음 이름을 얻는다."}, {"n" function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const WS=WORDS.sets[0];

function hdr(){
  const on=id=>(view===id)?'on':'';

    tabs.map(t=>`<button class="tab ${on(t[0])}" data-v="${t[0]}" ${(t[0]==='exp'&&!S.sub)?'disabled':''}><span class="t1"><span class="n">${t[1]}</span>${t[2]}</span><span class="t2">${t[3]}</span></button>`).join('')+
    `</div></div></header>`;
}
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

}

", "V: found (find 발견하다의 과거형)", "O: that절 (명사절)", "뼈대 = <b>they found that ~</b>"]}, {"t": "맨 앞 <b>When they compared the way ... traffic volumes</b>는 <b>부사절(시간)</b>이다. found를 꾸미며 '그들이 ~을 비교했을 때'라는 뜻이다.", "sub": ["compared (compare 비교하다의 과거형)의 목적어 = the way pedestrians crossed (보행자들이 건넌 방식). way 뒤에 관계부사 that(또는 in which)이 생략되어 있다", "pedestrian 보행자, crosswalk 횡단보도", "at both kinds of crosswalks (두 종류의 횡단보도에서), on roads with considerable traffic volumes (교통량이 상당한 도로에서)는 부사구"]}, {"t": "that절 안의 뼈대이다. 동사가 and로 3개 병렬된다.", "sub": ["S: people (사람들). at unmarked crosswalks (표시 없는 횡단보도의)가 꾸민다. unmarked 표시 없는", "V: tended (tend 경향이 있다의 과거형), O: to look both ways more often (양쪽을 더 자주 살피는 것)", "V: waited for gaps in traffic more often (차량 흐름의 틈을 더 자주 기다렸다). wait for는 거의 필수에 가까운 부사구. gap 틈", "V: crossed the road more quickly (도로를 더 빨리 건넜다)"]}, {"t": "함정: waited, crossed는 새 주어가 없는 병렬 동사이다. 모두 people에 걸린다."}], "sum": "표시 없는 횡단보도에서는 더 신중하게 건넘"}, {"i": "04", "q": "09", "s": "B-2", "title": "가주어 it + 진주어 to부정사 + 관계절 + 과거분사구", "eng": "It often requires great cleverness<sup>1</sup> / to conceive of<sup>2</sup> measures<sup>3</sup> / that tap into<sup>4</sup> what people are thinking / without altering<sup>5</sup> their thinking, / called reactivity<sup>6</sup>.", "notes": [["1", "cleverness", "영리함, 기발함"], ["2", "conceive of", "~을 생각해 내다"], ["3", "measure", "방법, 측정 도구"], ["4", "tap into", "~에 접근하다"], ["5", "alter", "바꾸다"], ["6", "reactivity", "반동성"]], "lit": "종종 대단한 기발함이 필요하다 / 방법을 생각해 내는 데에는 / 사람들이 무엇을 생각하고 있는지에 접근하되 / 그들의 생각을 바꾸지는 않는, / 이것이 반응성이라 불리는 것이다.", "nat": "사람들의 생각을 바꾸지 않으면서 그들이 무엇을 생각하는지에 다가가는 측정 방법을 고안하려면 종종 대단한 기발함이 필요한데, 이 바뀜 현상을 반응성이라고 부른다.", "ana": "문두의 <b>It</b>은 '그것'이 아니라 뒤의 to부정사구를 대신하는 <b>가주어</b>이고, 진주어는 <b>to conceive of ~</b>다. 우리말로는 뒤에서 끌어와 '~하는 데에는'으로 읽는다. <b>that tap into ~</b>는 앞의 measures를 꾸미는 <b>주격 관계대명사절</b>인데, 선행사가 복수라 동사가 taps가 아닌 <b>tap</b>이다. 그 안의 <b>what people are thinking</b>은 into의 목적어가 되는 의문사절이다. 문장 끝의 <b>called reactivity</b>는 앞의 내용 전체를 뒤에서 받아 '<b>~라고 불리는 것</b>'으로 이름을 붙여 주는 <b>과거분사구</b>다.", "pe": "It \u0001often\u0002 requires \u0001great\u0002 cleverness<sup>1</sup> / to conceive \u0001of<sup>2</sup> measures<sup>3</sup>\u0002 / \u0001that tap into<sup>4</sup> what people are thinking\u0002 / \u0001without altering<sup>5</sup> their thinking\u0002, / \u0001called reactivity<sup>6</sup>\u0002.", "pk": "\u0001종종\u0002 \u0001대단한\u0002 기발함이 필요하다 / \u0001방법을\u0002 생각해 내는 데에는 / \u0001사람들이 무엇을 생각하고 있는지에 접근하되\u0002 / \u0001그들의 생각을 바꾸지는 않는\u0002, / \u0001이것이 반응성이라 불리는 것이다\u0002.", "core": "생각해 내는 데에는 기발함이 필요하다.", "tags": ["<b>가주어 It</b> + 동사 requires + 목적어 cleverness. often = 부사. great = 형용사: cleverness 꾸밈", "<b>진주어</b> to conceive (1형식). of measures = 전치사구(부사구): conceive 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "<b>that절</b> = 관계절(형용사절): measures 꾸밈. what people are thinking = into의 목적어 명사절", "without v-ing = 전치사구(부사구): tap 꾸밈", "called reactivity = 과거분사구(형용사적): 앞 내용(생각을 바꾸는 현상)에 이름 붙임"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이고, 가주어 It이 쓰인다. 진주어와 관계절이 길게 이어진다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (가주어)", "V: requires (require 필요로 하다의 3인칭 단수형)", "O: great cleverness (대단한 기발함. cleverness 기발함)", "뼈대 = <b>It requires great cleverness</b>", "often (종종)은 부사"]}, {"t": "<b>진주어</b>는 <b>to conceive of measures</b>이다. '방법을 생각해 내는 것'이라는 뜻이다.", "sub": ["conceive of ~을 생각해 내다. of measures는 거의 필수에 가까운 부사구. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준)", "measure 측정 방법"]}, {"t": "<b>that tap into what people are thinking</b>은 <b>주격 관계절(형용사절)</b>이다. measures를 꾸미며 '사람들이 무엇을 생각하는지에 접근하는'이라는 뜻이다.", "sub": ["tap into ~에 접근하다. what people are thinking (사람들이 생각하는 것)은 into의 목적어인 명사절"]}, {"t": "<b>without altering their thinking</b>은 <b>전치사구(부사구)</b>이다. tap into를 꾸미며 '그들의 생각을 바꾸지 않고'라는 뜻이다. (alter 바꾸다)"}, {"t": "끝 <b>called reactivity</b>는 <b>과거분사구</b>이다. 바로 앞의 '생각을 바꾸는 것'을 이름 붙이는 말이다. 기준: 의미상 앞 내용을 가리키는 것으로 본다. (reactivity 반응성)"}], "sum": "생각을 바꾸지 않고 사람의 생각에 접근하려면 기발함이 필요"}, {"i": "05", "q": "10", "s": "A-2", "title": "S+V+C 두 절 + one ~ the other + 관계절", "eng": "One was a professor<sup>1</sup> / and the other was a merchant<sup>2</sup> / who had an unmotivated<sup>3</sup> son.", "notes": [["1", "professor", "교수"], ["2", "merchant", "상인"], ["3", "unmotivated", "의욕이 없는"]], "lit": "한 명은 교수였고 / 다른 한 명은 상인이었는데 / 의욕 없는 아들을 둔 사람이었다.", "nat": "한 사람은 교수였고, 다른 한 사람은 의욕 없는 아들을 둔 상인이었다.", "ana": "둘뿐인 대상을 나눌 때는 <b>one ~ the other ~</b>를 쓴다. 셋 이상이면 one ~ another ~ the other로 달라지므로, <b>the</b>가 붙은 the other를 보면 '<b>남은 하나</b>'라고 확정하면 된다. 뒤의 <b>who</b>는 바로 앞의 a merchant를 꾸미는 <b>주격 관계대명사</b>이고, 선행사가 사람이므로 who를 쓴다. 관계사절이 사람을 소개하는 이런 자리에서는 '<b>~한 (사람)</b>'으로 앞으로 끌어와 붙여 읽는 편이 우리말답다.", "pe": "One was a professor<sup>1</sup> / and the other was a merchant<sup>2</sup> / \u0001who had an \u0001unmotivated<sup>3</sup>\u0002 son\u0002.", "pk": "한 명은 교수였고 / 다른 한 명은 상인이었는데 / \u0001의욕 없는 아들을 둔 사람이었다\u0002.", "core": "한 사람은 교수였고 다른 사람은 상인이었다.", "tags": ["주어 One + 동사 was + 보어 a professor (SVC)", "<b>one ~ the other</b>: 둘 중 남은 하나. 동사 was + 보어 a merchant", "<b>who절</b> = 관계절(형용사절): a merchant 꾸밈. unmotivated = 형용사: son 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) 두 절이 and로 이어진 문장</b>이다. 뒤 절에 관계절이 붙었다."}, {"t": "앞 절 뼈대이다.", "sub": ["S: One (둘 중 한 명)", "V: was (be ~이었다)", "C: a professor (교수)", "뼈대 = <b>One was a professor</b>"]}, {"t": "뒤 절 뼈대이다.", "sub": ["S: the other (다른 한 명)", "V: was", "C: a merchant (상인)", "뼈대 = <b>the other was a merchant</b>", "one ~ the other: 둘 중 하나 ~, 나머지 하나 ~"]}, {"t": "<b>who had an unmotivated son</b>은 <b>주격 관계절(형용사절)</b>이다. a merchant를 꾸미며 '의욕 없는 아들을 둔'이라는 뜻이다. (unmotivated 의욕 없는)"}], "sum": "한 명은 교수, 다른 한 명은 의욕 없는 아들을 둔 상인"}, {"i": "06", "q": "10", "s": "A-4", "title": "동사 병렬 + 부분 부정", "eng": "The professor gave a small amount<sup>1</sup> of water to his plants / and didn't always give his full attention<sup>2</sup> to them.", "notes": [["1", "amount", "양"], ["2", "full attention", "온전한 주의"]], "lit": "교수는 자신의 식물에 적은 양의 물을 주었고 / 그것들에 늘 온전한 관심을 주지는 않았다.", "nat": "교수는 자기 식물에 물을 조금만 주었고, 늘 온 신경을 쏟지도 않았다.", "ana": "and 뒤의 <b>didn't ~ give</b>는 새 문장이 아니라 앞의 gave와 짝을 이루는 <b>동사 병렬</b>이다. 주어 The professor가 한 번만 쓰였으므로, and 뒤에 주어 없이 동사가 나오면 <b>앞 주어를 그대로 끌어온다</b>. 진짜 함정은 <b>not always</b>다. '전혀 주지 않았다'가 아니라 '<b>늘 그런 것은 아니었다</b>'라는 <b>부분 부정</b>이다. not이 always, all, every, both와 만나면 부분 부정이 되므로 '<b>~한 것은 아니다</b>'로 조심스럽게 옮겨야 한다. 이 차이가 뒤에서 교수의 방식이 방치가 아니었다는 결론으로 이어진다.", "pe": "The professor gave a \u0001small\u0002 amount<sup>1</sup> \u0001of water\u0002 \u0001to his plants\u0002 / and didn't \u0001always\u0002 give his \u0001full\u0002 attention<sup>2</sup> \u0001to them\u0002.", "pk": "교수는 \u0001자신의 식물에\u0002 \u0001적은\u0002 양의 물을 주었고 / \u0001그것들에\u0002 늘 온전한 관심을 주지는 않았다.", "core": "교수는 물을 주었고 관심을 주지 않았다.", "tags": ["주어 professor + 동사 gave + 목적어 amount. small = 형용사: amount 꾸밈. of water = 형용사구: amount 꾸밈. to his plants = 전치사구(부사구): gave 꾸밈, 거의 필수에 가까운 부사구", "and + didn't give + 목적어 attention. <b>not always</b> = 부분 부정. full = 형용사: attention 꾸밈. to them = 전치사구(부사구): give 꾸밈, 거의 필수에 가까운 부사구"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식) 동사 병렬</b>이다. 두 번째 동사에 not always가 붙어 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The professor (그 교수)", "V: gave (give 주다의 과거형) and did not give (주지 않았다). 병렬", "O: a small amount (적은 양), full attention (온전한 관심)", "뼈대 = <b>The professor gave a small amount and didn't give attention</b>"]}, {"t": "앞 동사의 수식어이다. <b>of water</b> (물의)는 amount를 꾸미는 형용사구이고, <b>to his plants</b> (그의 식물에)는 gave의 대상을 나타내는 거의 필수에 가까운 부사구이다. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준)."}, {"t": "뒤 동사의 <b>not always</b>는 <b>부분 부정</b>이다. '늘 ~하는 것은 아니다'라는 뜻이다. <b>to them</b> (them = his plants, 식물들)은 give의 대상을 나타내는 거의 필수에 가까운 부사구이다. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준). (full 온전한, attention 관심)"}, {"t": "함정: always가 있어 '전혀 주지 않았다'로 읽기 쉽다. '항상 주지는 않았다'가 맞다."}], "sum": "교수는 식물에 물을 적게, 관심도 늘 주지는 않음"}, {"i": "07", "q": "10", "s": "B-3", "title": "S+V 병렬 + 4형식 + so ~ that", "eng": "The professor smiled and said, / \"You gave your plants so much attention<sup>1</sup> and water / that they didn't need to work for themselves<sup>2</sup>.\"", "notes": [["1", "attention", "관심, 주의"], ["2", "work for oneself", "스스로 힘써 일하다"]], "lit": "교수는 미소 지으며 말했다, / \"당신은 식물에게 너무 많은 관심과 물을 주어서 / 그것들이 스스로 힘쓸 필요가 없었습니다.\"", "nat": "교수는 미소를 지으며 말했다. \"당신은 식물에게 관심과 물을 너무 많이 주어서, 식물이 스스로 애쓸 필요가 없었던 겁니다.\"", "ana": "<b>so ~ that ...</b>은 '너무 ~해서 …하다'라는 <b>정도와 결과</b>의 구문이다. 보통 so 뒤에 형용사나 부사가 오지만, 여기처럼 <b>so much + 명사</b> 형태로도 자주 쓰인다. that절은 뒤에 완전한 문장이 오는 <b>접속사 that</b>이며, 앞의 so와 짝이라는 것을 놓치면 '~라는 것'으로 잘못 읽게 된다. so를 보면 <b>뒤에 that이 있는지 먼저 훑는 습관</b>이 필요하다. <b>work for themselves</b>는 '스스로 힘써 일하다'라는 뜻으로, 뒤에 나오는 뿌리 이야기의 복선이 된다.", "pe": "The professor smiled and said, / \"You gave your plants so much attention<sup>1</sup> and water / \u0001that they didn't need to work \u0001for themselves<sup>2</sup>\u0002\u0002.\"", "pk": "교수는 미소 지으며 말했다, / \"당신은 식물에게 너무 많은 관심과 물을 주어서 / \u0001그것들이 스스로 힘쓸 필요가 없었습니다\u0002.\"", "core": "교수는 미소 지으며 말했다. 당신은 식물에게 관심과 물을 주었다.", "tags": ["주어 professor + 동사 smiled and said (병렬). said의 목적어 = 인용문", "주어 You + 동사 gave + 간접목적어 plants + 직접목적어 attention and water (4형식).", "<b>so ~ that절</b> = 결과 부사절: gave 꾸밈. for themselves = 부사구: work 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V 병렬 + 인용문</b>이다. smiled는 1형식, said는 인용문을 목적어로 갖는 3형식이다. 인용문 안에 S+V+O+O(4형식)가 있고 so ~ that이 붙어 길어졌다."}, {"t": "바깥 뼈대이다.", "sub": ["S: The professor (그 교수)", "V: smiled and said (smile 미소 짓다, say 말하다의 과거형. 병렬)", "said의 목적어 = 따옴표 안 인용문", "뼈대 = <b>The professor smiled and said</b>"]}, {"t": "인용문 안의 뼈대이다. gave A B (A에게 B를 주다) 구조이다.", "sub": ["S: You (당신)", "V: gave (give 주다의 과거형)", "간접목적어: your plants (당신의 식물에게)", "직접목적어: so much attention and water (아주 많은 관심과 물)", "뼈대 = <b>You gave your plants so much attention and water</b>"]}, {"t": "<b>that they didn't need to work for themselves</b>는 <b>so ~ that의 that절(결과 부사절)</b>이다. gave를 꾸미며 '그래서 그것들이 스스로 애쓸 필요가 없었다'라는 뜻이다. they = your plants (식물들)이다. for themselves는 work를 꾸미는 부사구이다. (themselves 그것들 스스로)"}, {"t": "함정: so much가 attention 앞에 붙어 so ~ that 짝이 멀어 보인다. so와 that을 짝지어 읽는다."}], "sum": "식물에 너무 많이 줘서 스스로 애쓸 필요가 없었다는 지적"}, {"i": "08", "q": "10", "s": "C-1", "title": "S+V 병렬 + 사역동사 let", "eng": "The professor continued<sup>1</sup> his explanation<sup>2</sup>, / \"I gave my plants just an adequate<sup>3</sup> amount of water / and let their roots<sup>4</sup> search for more.\"", "notes": [["1", "continue", "계속하다"], ["2", "explanation", "설명"], ["3", "adequate", "적절한, 충분한"], ["4", "root", "뿌리"]], "lit": "교수는 설명을 이어 갔다, / \"저는 제 식물에 딱 적절한 양의 물만 주었고 / 그 뿌리들이 더 많은 것을 찾게 두었습니다.\"", "nat": "교수는 설명을 이어 갔다. \"저는 식물에게 딱 알맞은 양의 물만 주고, 뿌리가 알아서 더 찾아 나서도록 두었습니다.\"", "ana": "and로 이어진 <b>gave</b>와 <b>let</b>은 둘 다 I를 주어로 하는 <b>동사 병렬</b>이다. let은 현재형과 과거형이 같아서 시제를 놓치기 쉬운데, 앞의 gave가 과거이므로 여기서도 <b>과거</b>로 읽어야 한다. <b>let</b>은 <b>사역동사</b>라 「let + 목적어 + <b>동사원형</b>」 형태를 취한다. 그래서 뒤에 to search가 아니라 <b>search</b>가 왔고, 뜻은 '<b>~가 …하게 두다, 허락하다</b>'가 된다. make(강제), have(시킴), let(허용)의 뉘앙스 차이를 함께 정리해 두자. more는 more water를 줄인 것이다.", "pe": "The professor continued<sup>1</sup> his explanation<sup>2</sup>, / \"I gave my plants \u0001just\u0002 an \u0001adequate<sup>3</sup>\u0002 amount \u0001of water\u0002 / and let their roots<sup>4</sup> search \u0001for more\u0002.\"", "pk": "교수는 설명을 이어 갔다, / \"저는 제 식물에 \u0001딱 적절한\u0002 양의 물만 주었고 / 그 뿌리들이 \u0001더 많은 것을\u0002 찾게 두었습니다.\"", "core": "교수는 설명을 이어 갔다. 나는 식물에게 물을 주고 뿌리가 찾게 두었다.", "tags": ["주어 professor + 동사 continued + 목적어 explanation (3형식)", "주어 I + 동사 gave + 간접목적어 plants + 직접목적어 amount (4형식). just = 부사. adequate = 형용사. of water = 형용사구: amount 꾸밈", "and let: 사역동사 let + 목적어 roots + 보어 search (SVOC). for more = 전치사구(부사구): search 꾸밈, 거의 필수에 가까운 부사구"], "steps": [{"t": "이 문장은 <b>S+V(3형식) + 인용문</b>이다. 인용문 안에 동사가 병렬되고 let 5형식이 있다."}, {"t": "바깥 뼈대이다.", "sub": ["S: The professor (그 교수)", "V: continued (continue 이어 가다의 과거형)", "O: his explanation (그의 설명)", "뼈대 = <b>The professor continued his explanation</b>"]}, {"t": "인용문 안의 첫 동사 뼈대이다.", "sub": ["S: I (나)", "V: gave (give 주다의 과거형)", "간접목적어: my plants (내 식물에게)", "직접목적어: just an adequate amount (딱 적절한 양). of water (물의)는 amount를 꾸미는 형용사구. adequate 적절한"]}, {"t": "and 뒤 두 번째 동사 뼈대이다. <b>let + 목적어 + 동사원형</b> 구조이다.", "sub": ["V: let (let 두다·허락하다의 과거형)", "O: their roots (그 뿌리들)", "C: search (찾다. 사역동사 뒤라 동사원형)", "for more (더 많은 것을)는 search for의 일부라 거의 필수에 가까운 부사구. 전치사구는 뼈대 밖 수식어로 둔다(문형 기준)"]}, {"t": "함정: let은 현재형과 모양이 같은 과거형이다. s가 없어도 현재가 아니라 gave와 같은 과거 시제로, and로 gave와 병렬이다."}], "sum": "물은 알맞게만 주고 뿌리가 스스로 더 찾게 둠"}], "qs": [{"q": "07", "type": "무관 문장", "src": "2020학년도 수능 35번", "ans": "③", "tr": [["1", "상식적 지식에 장점이 있을 수는 있지만 약점도 있는데, 그중에서도 결코 사소하지 않은 것은 상식이 종종 자기모순을 일으킨다는 점이다."], ["2", "예를 들어 우리는 비슷한 사람끼리 서로 좋아할 것이라는 말('같은 깃털의 새들이 함께 모인다')을 듣지만, 또 닮지 않은 사람끼리 서로 좋아할 것이라는 말('정반대가 끌린다')도 듣는다."], ["3", "① 우리는 집단이 개인보다 더 현명하고 똑똑하다는 말('두 사람의 머리가 하나보다 낫다')을 듣지만, 또 집단 작업은 필연적으로 나쁜 결과를 낳는다는 말('요리사가 너무 많으면 수프를 망친다')도 듣는다."], ["4", "② 이 모순되는 진술들은 저마다 특정 조건에서는 사실일 수 있지만, 언제 적용되고 언제 적용되지 않는지가 분명하지 않다면 격언은 인간관계에 관해 별다른 통찰을 주지 못한다."], ["5", "③ 그것이 바로 우리가 인생이라는 긴 여정에서 어려움과 도전에 부딪힐 때마다 격언에 크게 의존하는 이유다."], ["6", "④ 그것들은 우리가 결정을 내려야 하는 상황에서는 훨씬 더 적은 지침을 준다."], ["7", "⑤ 예를 들어 위험을 수반하는 선택에 직면할 때, 우리는 '모험하지 않으면 얻는 것도 없다'와 '나중에 후회하느니 안전한 편이 낫다' 중 어느 지침을 써야 하는가?"]], "evh": "4번 문장", "ev": [{"en": true, "h": "Each of these contradictory statements may hold true under particular conditions, but ~ aphorisms provide little insight into relations among people."}, {"en": false, "h": "무관 문장은 <b>글이 격언을 칭찬하는가, 깎아내리는가</b>라는 방향 하나만 보면 된다. 1번 문장이 상식의 <b>약점</b>을 선언하고, 2~3번이 서로 모순되는 격언 쌍을 나열하며, 4번이 '<b>통찰을 거의 주지 못한다</b>'고 결론을 낸다. 이어지는 ④는 <b>even less guidance</b>(훨씬 더 적은 지침)로 그 부정을 한 단계 더 밀고 나가고, ⑤가 구체적 예를 든다. 그런데 ③만 '그래서 우리는 격언에 <b>크게 의존한다</b>'며 격언을 <b>유용한 것</b>으로 뒤집는다. 방향이 정반대이므로 무관한 문장이다."}], "opts": [{"n": "①", "t": "집단이 개인보다 낫다는 격언과 그 반대 격언을 나란히 든 문장", "a": false, "x": true, "trap": false, "e": "2번 문장과 똑같이 <b>모순되는 격언 쌍</b>을 하나 더 보태 준다. 흐름에 정확히 맞는다."}, {"n": "②", "t": "특정 조건에서는 맞지만 적용 시점이 불분명해 통찰을 못 준다는 문장", "a": false, "x": true, "trap": false, "e": "앞의 예시들을 받아 <b>결론</b>을 내는 핵심 문장이다."}, {"n": "③", "t": "그래서 어려움에 부딪힐 때마다 격언에 크게 의존한다는 문장", "a": true, "x": false, "trap": false, "e": "글은 격언의 <b>한계</b>를 말하는데 이 문장만 격언에 <b>의존한다</b>고 긍정한다. 앞뒤 논리와 정면으로 어긋난다."}, {"n": "④", "t": "결정을 내려야 하는 상황에서는 지침을 훨씬 더 적게 준다는 문장", "a": false, "x": true, "trap": true, "e": "<b>even less</b>가 앞 문장의 little insight를 이어받는 신호다. ③을 빼면 ②→④가 자연스럽게 붙는다."}, {"n": "⑤", "t": "상반된 두 격언 중 무엇을 택할지 되묻는 문장", "a": false, "x": true, "trap": false, "e": "④가 말한 '지침이 없음'을 <b>구체적 예</b>로 보여 주며 글을 닫는다."}], "w": [["commonsense", "상식적인"], ["merit", "장점, 가치"], ["not the least of which", "그중 결코 사소하지 않은 것은"], ["contradict oneself", "자기모순을 일으키다"], ["flock together", "함께 모이다"], ["dissimilar", "닮지 않은"], ["inevitably", "필연적으로"], ["spoil", "망치다"], ["hold true", "사실이다, 유효하다"], ["aphorism", "격언, 경구"], ["insight", "통찰"], ["entail", "수반하다"]]}, {"q": "08", "type": "문장 삽입", "src": "2015학년도 9월 37번", "ans": "③", "tr": [["1", "[주어진 문장] 그러나 표시가 없는 횡단보도에 관해서라면 둘 다 이 사실을 알지 못한다."], ["2", "연구들은 운전자가 표시가 없는 횡단보도에서보다 표시가 있는 횡단보도에서 보행자에게 양보할 가능성이 더 높다는 것을 실제로 보여 준다."], ["3", "그러나 일부 연구자들이 발견했듯이, 그것이 반드시 상황을 더 안전하게 만들지는 않는다."], ["4", "( ① ) 교통량이 상당한 도로에서 두 종류의 횡단보도를 보행자들이 어떻게 건너는지 비교해 보니, 표시가 없는 횡단보도의 사람들이 양쪽을 더 자주 살피고, 차가 끊기는 틈을 더 오래 기다렸으며, 도로를 더 빨리 건넜다는 사실이 드러났다."], ["5", "( ② ) 연구자들은 운전자와 보행자 모두 표시가 있는 횡단보도에서는 운전자가 보행자에게 양보해야 한다는 것을 더 잘 알고 있다고 추측한다."], ["6", "( ③ ) 교통안전법을 모르는 것이, 알고 보면 보행자에게는 실제로 좋은 일이다."], ["7", "( ④ ) 그들은 차가 멈추게 되어 있는지 아닌지를 모르기 때문에 더 조심스럽게 행동한다."], ["8", "( ⑤ ) 그에 반해 표시가 있는 횡단보도는 보행자에게 자기 안전에 대한 비현실적인 인상을 줄 수 있다."]], "evh": "[주어진 문장]", "ev": [{"en": true, "h": "But neither are aware of this fact when it comes to unmarked crosswalks."}, {"en": false, "h": "삽입 문항은 <b>대명사와 지시어가 가리킬 대상</b>을 앞에서 찾는 것이 전부다. 주어진 문장의 <b>neither</b>는 '둘 다 아니다'인데, 그 '둘'이 앞에 나와 있어야 한다. ② 뒤 문장에 <b>both drivers and pedestrians</b>가 처음 등장하므로 그보다 앞에는 놓일 수 없다. 또 <b>this fact</b>는 같은 문장의 '<b>표시가 있는 횡단보도에서는 운전자가 양보해야 한다</b>'는 사실을 받는다. 그리고 주어진 문장이 들어간 뒤에야 '법을 모르는 것이 오히려 좋다'(③ 자리 뒤)와 '차가 멈출지 모르므로 조심한다'가 자연스럽게 이어진다. 따라서 ③이다."}], "opts": [{"n": "①", "t": "연구 결과를 처음 제시하는 문장 앞", "a": false, "x": true, "trap": false, "e": "앞에 '둘'에 해당하는 대상이 아직 없다. neither가 받을 말이 없어 성립하지 않는다."}, {"n": "②", "t": "비교 결과와 연구자의 추측 사이", "a": false, "x": true, "trap": false, "e": "both drivers and pedestrians가 <b>바로 뒤</b> 문장에 나온다. neither가 뒤의 것을 미리 받을 수는 없다."}, {"n": "③", "t": "연구자의 추측과 '법을 모르는 것이 좋다' 사이", "a": true, "x": false, "trap": false, "e": "neither = both drivers and pedestrians, this fact = 표시 있는 횡단보도의 양보 규칙. 뒤의 '모르는 것이 좋다'와도 인과가 맞물린다."}, {"n": "④", "t": "'법을 모르는 것이 좋다'와 '조심스럽게 행동한다' 사이", "a": false, "x": true, "trap": true, "e": "이 두 문장은 <b>주장과 이유</b>로 곧바로 붙어 있어야 한다. 사이를 끊으면 they가 가리키는 대상이 흐려진다."}, {"n": "⑤", "t": "마지막 대조 문장 앞", "a": false, "x": true, "trap": false, "e": "by contrast로 시작하는 마지막 문장은 <b>표시 없는 쪽</b>을 다 말한 뒤에 오는 마무리다. 그 앞에 다시 '둘 다 모른다'를 넣으면 흐름이 되돌아간다."}], "w": [["neither", "둘 다 ~아니다"], ["when it comes to", "~에 관해서라면"], ["unmarked", "표시가 없는"], ["motorist", "운전자"], ["yield to", "~에게 양보하다"], ["pedestrian", "보행자"], ["necessarily", "반드시"], ["considerable", "상당한"], ["traffic volume", "교통량"], ["suspect", "추측하다"], ["cautiously", "조심스럽게"], ["unrealistic", "비현실적인"]]}, {"q": "09", "type": "글의 순서", "src": "2019학년도 수능 36번", "ans": "③", "tr": [["1", "[주어진 글] 심리학 연구자들은 인간 행동을 설명하는 데 도움이 되고 더 나아가 그것을 예측할 수도 있는 연구를 수행하기 위해 과학적 방법을 따른다. 이것은 달팽이나 음파를 연구하는 것보다 훨씬 더 어려운 과제다."], ["2", "(B) 그것은 종종 타협을 요구한다. 예를 들어 자연스러운 환경 대신 실험실 안에서 행동을 검사하는 것, 그리고 모집단의 진정한 대표 표본에서 자료를 모으는 대신 쉽게 구할 수 있는 사람들(심리학 개론 수강생 같은)에게 참여를 요청하는 것이 그렇다. 사람들의 생각을 바꾸지 않으면서 그들이 무엇을 생각하는지에 다가가는 측정 방법을 고안하려면 종종 대단한 기발함이 필요한데, 이 바뀜 현상을 반동성이라고 부른다."], ["3", "(C) 관찰되고 있다는 것을 아는 것만으로도 사람들은 다르게 행동할 수 있다(예를 들어 더 예의 바르게!). 사람들은 자신의 진짜 감정보다 사회적으로 더 바람직하다고 느끼는 답을 줄 수도 있다."], ["4", "(A) 그러나 심리학이 겪는 이 모든 어려움에도 불구하고, 과학적 방법의 이점은 그 결과가 반복 가능하다는 것이다. 즉, 같은 절차를 따라 같은 연구를 다시 수행하면 같은 결과를 얻을 가능성이 매우 높다."]], "evh": "(B)", "ev": [{"en": true, "h": "It often requires compromises ~ called reactivity. / (C) Simply knowing they are being observed may cause people to behave differently."}, {"en": false, "h": "순서 문항은 <b>대명사와 연결어가 무엇을 가리키는지</b>로 판정한다. (B)의 첫 문장 <b>It</b>은 주어진 글의 '<b>과학적 방법을 따르는 일</b>'을 받으므로 (B)가 맨 앞이다. (B) 끝에서 <b>reactivity</b>라는 개념이 처음 이름을 얻고, (C)가 그 반동성이 실제로 어떤 모습인지 — 관찰당하는 줄 알면 사람이 달라진다 — 를 <b>구체적으로 설명</b>한다. 그리고 (A)의 <b>But for all of these difficulties</b>가 (B)와 (C)에 쌓인 어려움들을 <b>한꺼번에 되받아</b> 뒤집는다. 따라서 (B) – (C) – (A)이다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)의 these difficulties가 받을 어려움이 앞에 하나도 없다. (A)는 절대 첫 단락이 될 수 없다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(A)에서 이미 '이 모든 어려움에도 불구하고'라며 정리를 끝냈는데, 그 뒤에 (C)가 어려움을 하나 더 꺼내면 결론이 무너진다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": true, "x": false, "trap": false, "e": "It(→과학적 방법) → reactivity의 구체적 사례 → 그 모든 어려움을 뒤집는 But으로 이어져 한 방향으로 흐른다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": true, "e": "(C)의 <b>they</b>가 가리킬 대상이 앞에 없다. 관찰 대상인 사람들이 먼저 소개되어야 한다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": false, "x": true, "trap": false, "e": "(B)의 It이 받을 말이 (C)에는 없다. It은 주어진 글의 과학적 방법을 받아야 한다."}], "w": [["scientific method", "과학적 방법"], ["predict", "예측하다"], ["challenging", "도전적인, 힘든"], ["compromise", "타협, 절충"], ["laboratory", "실험실"], ["readily available", "쉽게 구할 수 있는"], ["cross-section", "대표 표본, 단면"], ["conceive of", "~을 생각해 내다"], ["tap into", "~에 접근하다"], ["alter", "바꾸다"], ["reactivity", "반동성"], ["replicable", "반복 가능한"]]}, {"q": "10", "type": "장문 순서", "src": "2023년 4월 43번", "ans": "④", "tr": [["1", "(A) 서로 옆집에 사는 두 이웃이 있었다. 한 사람은 교수였고, 다른 한 사람은 의욕 없는 아들을 둔 상인이었다. 두 사람 모두 각자의 정원에 같은 종류의 식물을 심어 두었다. 교수는 자기 식물에 물을 조금만 주었고, 늘 온 신경을 쏟지도 않았다. 한편 상인의 정원에서는 상인이 (a) 자기 식물에 물을 많이 주고 잘 보살펴 주었다."], ["2", "(D) 교수의 식물은 단순하지만 보기 좋았던 반면, 상인의 식물은 훨씬 무성하고 푸르렀다. 어느 날 밤 거센 폭풍이 있었다. 폭풍이 지나간 뒤 두 이웃은 각자 정원의 피해를 살펴보았다. 상인은 자기 식물이 뿌리째 뽑혀 폭풍에 완전히 망가진 것을 보았다. 그러나 (e) 그의 이웃의 식물은 전혀 손상되지 않고 굳건히 서 있었다."], ["3", "(B) 상인은 이것을 보고 놀랐는데, 자신이 교수보다 식물을 더 잘 돌봤다고 생각했기 때문이다. 그는 이웃에게 가서 말했다. \"(b) 제 식물만 뿌리째 뽑혔어요. 어떻게 그럴 수가 있죠?\" 교수는 미소를 지으며 말했다. \"당신은 식물에게 관심과 물을 너무 많이 function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
