/div><div class=\"k\">AP와 NWP 교사들의 40퍼센트는 ~라고 말한다</div></div><div class=\"rc\"><div class=\"e\">“Some” of the information</div><div class=\"k\">‘일부’ 정보가</div></div><div class=\"rc\"><div class=\"e\">is accurate or trustworthy,</div><div class=\"k\">정확하거나 신뢰할 만하다고,</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">more than</span> <span class=\"cw\">30 percent</span> of U.S. adult search users</div><div class=\"k\">그리고 미국 성인 검색 사용자들의 <span class=\"cw\">30퍼센트가</span> <span class=\"cw\">넘는</span> 비율이</div></div><div class=\"rc\"><div class=\"e\">respond the same.</div><div class=\"k\">같은 응답을 한다.</div></div><div class=\"rnat\">③ 또한, AP와 NWP 교사들의 40퍼센트는 ‘일부’ 정보가 정확하거나 신뢰할 만하다고 말하고, 미국 성인 검색 사용자들의 30퍼센트가 넘는 비율이(→ 22퍼센트가) 같은 응답을 한다.</div><div class=\"rst\">“일부만 믿어요”는 선생님 40퍼센트까지는 맞아요. 그런데 어른 쪽은 22퍼센트인데 <b>30퍼센트가 넘는다</b>(more than)고 썼어요. 그래서 선지 ③이 정답이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">④ U.S. adult search users saying that</div><div class=\"k\">④ ~라고 말하는 미국 성인 검색 사용자들은</div></div><div class=\"rc\"><div class=\"e\">“Very little / None” of the information</div><div class=\"k\">정보 중 ‘거의 없다/전혀 없다’고</div></div><div class=\"rc\"><div class=\"e\">found using search engines</div><div class=\"k\">검색 엔진을 사용해 찾은</div></div><div class=\"rc\"><div class=\"e\">is accurate or trustworthy</div><div class=\"k\">정확하거나 신뢰할 만한 것이</div></div><div class=\"rc\"><div class=\"e\">account for less than five percent.</div><div class=\"k\">5퍼센트 미만을 차지한다.</div></div><div class=\"rnat\">④ 검색 엔진을 사용해 찾은 정보 중 정확하거나 신뢰할 만한 것이 ‘거의 없다/전혀 없다’고 말하는 미국 성인 검색 사용자들은 5퍼센트 미만을 차지한다.</div><div class=\"rst\">“거의 안 믿어요”라는 어른은 5퍼센트도 안 돼요. = 지문 5번(선지 ④)의 <b>less than</b>(~보다 적은)이 도표와 같아요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">⑤ The percentage of U.S. adult search users</div><div class=\"k\">⑤ 미국 성인 검색 사용자들의 비율은</div></div><div class=\"rc\"><div class=\"e\">who answer “Don’t know”</div><div class=\"k\">‘모르겠다’라고 응답한</div></div><div class=\"rc\"><div class=\"e\">is only one percent.</div><div class=\"k\">단지 1퍼센트이다.</div></div><div class=\"rnat\">⑤ ‘모르겠다’라고 응답한 미국 성인 검색 사용자들의 비율은 단지 1퍼센트이다.</div><div class=\"rst\">“잘 모르겠어요”라는 어른은 딱 1퍼센트예요. = 지문 6번(선지 ⑤)으로 도표와 같아요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"accurate\" data-m=\"정확한\"><b>accurate</b>정확한</button><button type=\"button\" class=\"wdb\" data-w=\"trustworthy\" data-m=\"신뢰할 만한\"><b>trustworthy</b>신뢰할 만한</button><button type=\"button\" class=\"wdb\" data-w=\"respondents\" data-m=\"응답자들\"><b>respondents</b>응답자들</button><button type=\"button\" class=\"wdb\" data-w=\"the largest percentage\" data-m=\"가장 큰 비율\"><b>the largest percentage</b>가장 큰 비율</button><button type=\"button\" class=\"wdb\" data-w=\"account for\" data-m=\"차지하다\"><b>account for</b>차지하다</button><button type=\"button\" class=\"wdb\" data-w=\"less than\" data-m=\"~보다 적은\"><b>less than</b>~보다 적은</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">주제는 <b>원인 → 결과</b>로 묶으세요. 원인은 2번 <b>increase their earnings</b>(수입을 늘리다)라는 압박, 결과는 <b>In other words</b>(다시 말해) 뒤 3번의 돈 되는 곳 우선, 그리고 4·5번 저장실의 희생이에요.</p><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 원인</span><div class=\"en\">In an era when museums are forced to <mark>increase their earnings</mark>, they often focus their energies on modernising their galleries …</div><p class=\"ko\">박물관이 그들(= 박물관)의 <mark>수입을 늘리도록</mark> 강요받는 시대에, 그들은 종종 갤러리를 현대화하는 것에 에너지를 집중한다 …</p></div><div class=\"ck-via\"><i>▼</i><span>In other words(다시 말해) = 2번을 한 줄로 다시 정리해 주는 신호</span></div><div class=\"ck-step key\"><span class=\"lab\">3번 문장 · 결정적 단서</span><div class=\"en\"><mark>In other words</mark>, as museums struggle to survive in a competitive economy, their budgets often <mark>prioritise</mark> those parts of themselves that are consumable</div><p class=\"ko\"><mark>다시 말해</mark>, 박물관이 경쟁적인 경제에서 살아남기 위해 분투할 때, 그들의 예산은 종종 소비 가능한 그들 자신의 부분들을 <mark>우선시한다</mark></p></div><div class=\"ck-via\"><i>▼</i><span>돈 되는 곳에 자원이 쏠린 결과, 안 보이는 저장 공간이 손해를 봐요</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 결과</span><div class=\"en\"><mark>at worst</mark>, as museums pour more and more resources into their publicly visible faces, the spaces of storage <mark>may even suffer</mark></div><p class=\"ko\"><mark>최악의 경우</mark>, 박물관이 공적으로 보이는 겉면에 점점 더 많은 자원을 쏟아붓기 때문에, 저장 공간은 <mark>심지어 더 나빠질 수도 있다</mark></p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>원인</em>수입을 늘려야 하는 압박 (2·3번)</span><span><em>결과</em>보이는 갤러리·카페·상점 우선 → 저장실은 뒷전 (4·5번)</span></div><div class=\"ck-eq\">⇒ 수익 위주 운영이 낳은 결과 = consequences of profit-oriented management(수익 지향적 운영의 결과) → ④</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">consequences of profit-oriented management of museums 박물관의 수익 지향적 운영의 결과<small>원인(돈 벌기 압박)과 결과(저장실 희생)를 한 번에 담은 유일한 선지예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">necessity of expanding storerooms for displaying objects 물건 전시를 위한 저장실 확장의 필요성</span><span class=\"why\">[지문에 없음] 5번에 저장 공간이 점점 줄어든다는 말은 나오지만, 필자는 늘리자고 주장하지 않고 현상을 설명할 뿐이에요. 또 저장실은 전시용이 아니라 4번처럼 전시 홀을 위한 service areas(서비스 구역)예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">importance of prioritising museums' exhibition spaces 박물관 전시 공간을 우선시하는 것의 중요성</span><span class=\"why\">[반대] 3번의 prioritise(우선시하다)를 가져왔지만, 필자는 전시 공간 우선이 중요하다고 칭찬하지 않아요. 그 때문에 5번처럼 저장 공간이 suffer(나빠지다)한다고 걱정해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">benefits of diverse activities in museums for audiences 관람객을 위한 박물관 내 다양한 활동의 이점</span><span class=\"why\">[반대] 2번의 관람객을 끌기 위한 전시는 원인 설명일 뿐이에요. 글은 이점이 아니라 그 뒤에 생기는 부작용(저장실 희생)을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">ways to increase museums' commitment to the public good 박물관의 공익에 대한 헌신을 높이는 방법</span><span class=\"why\">[지문에 없음] 공익(public good)이나 그 방법은 한 번도 안 나와요. 5번의 publicly visible faces(공적으로 보이는 겉면)는 공익이 아니라 사람들 눈에 보이는 곳이라는 뜻이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There are pressures within the museum</div><div class=\"k\">박물관 ‘안에는’ 압력이 있다</div></div><div class=\"rc\"><div class=\"e\">that cause it to emphasise</div><div class=\"k\">그것(= 박물관)이 강조하게 만드는</div></div><div class=\"rc\"><div class=\"e\">what happens in the galleries</div><div class=\"k\">갤러리에서 일어나는 일을</div></div><div class=\"rc\"><div class=\"e\">over the activities</div><div class=\"k\">활동보다</div></div><div class=\"rc\"><div class=\"e\">that take place in its unseen zones.</div><div class=\"k\">그것(= 박물관)의 눈에 보이지 않는 구역에서 일어나는.</div></div><div class=\"rnat\">박물관 ‘안에는’ 그것(박물관)이 눈에 보이지 않는 구역에서 일어나는 활동보다 갤러리에서 일어나는 일을 더 강조하게 만드는 압력이 있다.</div><div class=\"rst\">학교 축제를 떠올려요. 손님 앞 부스만 꾸미고 뒤쪽 창고는 신경을 덜 써요. = 지문 1번, 박물관도 갤러리를 안 보이는 구역보다 강조한다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">In an era</div><div class=\"k\">시대에</div></div><div class=\"rc ckc\"><div class=\"e\">when museums are forced to <span class=\"cw\">increase their earnings</span>,</div><div class=\"k\">박물관이 그들(= 박물관)의 <span class=\"cw\">수입을 늘리도록</span> 강요받는,</div></div><div class=\"rc\"><div class=\"e\">they often focus their energies on</div><div class=\"k\">그들(= 박물관)은 종종 에너지를 ~에 집중한다</div></div><div class=\"rc\"><div class=\"e\">modernising their galleries</div><div class=\"k\">그들의 갤러리를 현대화하는 것</div></div><div class=\"rc\"><div class=\"e\">or mounting temporary exhibitions</div><div class=\"k\">또는 일시적인 전시회를 여는 것</div></div><div class=\"rc\"><div class=\"e\">to bring more and more audiences through the door.</div><div class=\"k\">점점 더 많은 관람객을 문 안으로 들이기 위해.</div></div><div class=\"rnat\">박물관이 수입을 늘리도록 강요받는 시대에, 그들은 종종 점점 더 많은 관람객을 문 안으로 들이기 위해 갤러리를 현대화하거나 일시적인 전시회를 여는 데 에너지를 집중한다.</div><div class=\"rst\">반 수익금을 늘려야 하니 부스를 새로 꾸미고 이벤트를 열어 손님을 모아요. = 지문 2번, <b>수입을 늘리도록</b> 강요받아 갤러리 현대화·임시 전시에 힘쓴다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">In other words,</span></div><div class=\"k\"><span class=\"cw\">다시 말해,</span></div></div><div class=\"rc\"><div class=\"e\">as museums struggle to survive</div><div class=\"k\">박물관이 살아남기 위해 분투할 때</div></div><div class=\"rc\"><div class=\"e\">in a competitive economy,</div><div class=\"k\">경쟁적인 경제에서,</div></div><div class=\"rc ckc\"><div class=\"e\">their budgets often <span class=\"cw\">prioritise</span></div><div class=\"k\">그들(= 박물관)의 예산은 종종 <span class=\"cw\">우선시한다</span></div></div><div class=\"rc\"><div class=\"e\">those parts of themselves</div><div class=\"k\">그들 자신(= 박물관)의 부분들을</div></div><div class=\"rc\"><div class=\"e\">that are consumable:</div><div class=\"k\">소비 가능한:</div></div><div class=\"rc\"><div class=\"e\">infotainment in the galleries,</div><div class=\"k\">갤러리의 인포테인먼트,</div></div><div class=\"rc\"><div class=\"e\">goods and services in the cafes and the shops.</div><div class=\"k\">카페와 상점의 상품과 서비스.</div></div><div class=\"rnat\">다시 말해, 박물관이 경쟁적인 경제에서 살아남기 위해 분투할 때, 그들의 예산은 종종 갤러리의 인포테인먼트, 카페와 상점의 상품과 서비스 같은 그들 자신의 소비 가능한 부분들을 우선시한다.</div><div class=\"rst\"><b>다시 말해</b>(In other words) 돈이 되는 간식 판매대부터 챙겨요. = 지문 3번, 예산이 소비 가능한 부분을 <b>우선시한다</b>(prioritise)는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">The unlit, unglamorous storerooms,</div><div class=\"k\">불이 들어오지 않고 매력적이지 않은 저장실은,</div></div><div class=\"rc\"><div class=\"e\">if they are ever discussed,</div><div class=\"k\">그것들(= 저장실)이 혹시라도 논의된다면,</div></div><div class=\"rc\"><div class=\"e\">are at best presented</div><div class=\"k\">기껏해야 제시된다</div></div><div class=\"rc\"><div class=\"e\">as service areas</div><div class=\"k\">서비스 구역으로</div></div><div class=\"rc\"><div class=\"e\">that process objects for the exhibition halls.</div><div class=\"k\">전시 홀을 위해 물건들을 처리하는.</div></div><div class=\"rnat\">불이 들어오지 않고 매력적이지 않은 저장실은, 혹시라도 논의된다면, 기껏해야 전시 홀을 위해 물건들을 처리하는 서비스 구역으로 제시된다.</div><div class=\"rst\">불 꺼진 뒤쪽 창고는 누가 물어봐야 “물건 꺼내 오는 곳” 정도예요. = 지문 4번, 저장실은 기껏해야 서비스 구역으로 소개된다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">And at worst,</div><div class=\"k\">그리고 최악의 경우,</div></div><div class=\"rc\"><div class=\"e\">as museums pour more and more resources</div><div class=\"k\">박물관이 점점 더 많은 자원을 쏟아붓기 때문에</div></div><div class=\"rc\"><div class=\"e\">into their publicly visible faces,</div><div class=\"k\">그들(= 박물관)의 공적으로 보이는 겉면에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the spaces of storage may even suffer</span>,</div><div class=\"k\"><span class=\"cw\">저장 공간은 심지어 더 나빠질 수도 있다</span>,</div></div><div class=\"rc\"><div class=\"e\">their modernisation being kept on hold</div><div class=\"k\">그것들(= 저장 공간)의 현대화가 보류되거나</div></div><div class=\"rc\"><div class=\"e\">or being given less and less space</div><div class=\"k\">또는 점점 더 적은 공간이 주어지면서</div></div><div class=\"rc\"><div class=\"e\">to house the expanding collections</div><div class=\"k\">늘어나는 소장품을 보관하고</div></div><div class=\"rc\"><div class=\"e\">and serve their complex conservation needs.</div><div class=\"k\">그것들(= 소장품)의 복잡한 보존 요구를 충족시킬.</div></div><div class=\"rnat\">그리고 최악의 경우, 박물관이 공적으로 보이는 겉면에 점점 더 많은 자원을 쏟아붓기 때문에, 저장 공간의 현대화가 보류되거나 늘어나는 소장품을 보관하고 그것들의 복잡한 보존 요구를 충족시킬 공간이 점점 더 적게 주어지면서 저장 공간은 심지어 더 나빠질 수도 있다.</div><div class=\"rst\"><b>최악의 경우</b>(at worst) 창고는 정리도 못 하고 자리도 좁아져요. = 지문 5번, 겉면에 자원을 쏟는 바람에 저장 공간이 더 나빠질 수 있다는 결과예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"earnings\" data-m=\"수입, 소득\"><b>earnings</b>수입, 소득</button><button type=\"button\" class=\"wdb\" data-w=\"prioritise\" data-m=\"우선시하다\"><b>prioritise</b>우선시하다</button><button type=\"button\" class=\"wdb\" data-w=\"consumable\" data-m=\"소비할 수 있는\"><b>consumable</b>소비할 수 있는</button><button type=\"button\" class=\"wdb\" data-w=\"storerooms\" data-m=\"저장실, 창고\"><b>storerooms</b>저장실, 창고</button><button type=\"button\" class=\"wdb\" data-w=\"at best\" data-m=\"기껏해야\"><b>at best</b>기껏해야</button><button type=\"button\" class=\"wdb\" data-w=\"on hold\" data-m=\"보류된, 연기된\"><b>on hold</b>보류된, 연기된</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>50%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">have been(~해 왔다) 뒤에는 현재분사도 과거분사도 올 수 있어요. 그래서 <b>주어가 하는 쪽인지 당하는 쪽인지</b>를 보고, 뒤에 <b>to empathy</b>(공감 능력에)처럼 피해를 받는 대상이 남아 있으면 <b>능동 현재분사</b>를 의심하세요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ④번 자리 (6번)</span><div class=\"en\">The effects have been especially <u>④ damaged</u>, he argues, to empathy.</div><p class=\"ko\">그 결과는 특히 ( ? ) 왔다, 그는 주장한다, 공감 능력에. — 주어는 The effects(그 결과), 뒤에 to empathy(공감 능력에)</p></div><div class=\"ck-via\"><i>▼</i><span>주어 The effects(그 결과)가 피해를 입은 게 아니라, 공감 능력에 피해를 준 쪽이에요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 주어 · 누가 누구에게?</span><div class=\"en\"><mark>The effects</mark> have been especially</div><p class=\"ko\">그 결과는 특히</p></div><div class=\"ck-via\"><i>▼</i><span>피해를 받는 대상 to empathy(공감 능력에)가 뒤에 있으니 능동 damaging(해를 끼치는)</span></div><div class=\"ck-step key\"><span class=\"lab\">6번 문장 · 결정적 단서</span><div class=\"en\">The effects have been <mark>especially damaging</mark>, he argues, <mark>to empathy</mark>.</div><p class=\"ko\">그 결과는 <mark>공감 능력에</mark> <mark>특히 해를 끼쳐 왔다</mark>고 그는 주장한다.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">능동 현재분사(~하게 하는) 대 수동 과거분사(~당한)</p><p class=\"gr\">is(~이다)·have been(~해 왔다) 뒤 분사는 주어가 직접 영향을 '주면' 현재분사(~하게 하는), 영향을 '받으면' 과거분사(~당한)예요. 뒤에 영향을 받는 대상(to ~에게)이 따로 있으면 주어는 주는 쪽이니 현재분사를 써요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Too much sugar is damaging to your teeth.</div><div class=\"ko\">설탕을 너무 많이 먹으면 이에 해를 끼친다. (설탕이 이에 해를 주니 damaging이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Too much sugar is damaged to your teeth.</div><div class=\"ko\">설탕이 해를 입은 게 아닌데 damaged(손상된)를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>My bike was damaged in the rain.</div><div class=\"ko\">내 자전거는 비에 망가졌다. (자전거는 해를 받은 쪽이라 damaged가 맞아요)</div></div><p class=\"gb\">지문 6번도 The effects(그 결과)가 to empathy(공감 능력에) 해를 준 쪽이에요. 그래서 damaged(손상된)가 아니라 damaging(해를 끼치는)이 맞아요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">damaged → damaging 해를 끼치는<small>그 결과(The effects)가 공감 능력(empathy)에 해를 '끼친' 쪽이라 능동 damaging(해를 끼치는)이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">is ~이다</span><span class=\"why\">1번의 진짜 주어는 One(하나)이에요. 뒤의 of the simplest and most effective ways(가장 단순하고 효과적인 방법들 중)와 to build empathy in children(아이들의 공감 능력을 길러 주는)은 꾸며 주는 말일 뿐이라, 단수 is(~이다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">수 일치: One of(~ 중 하나) + 복수 명사 → 단수 동사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>One of my friends is tall.</div><div class=\"ko\">내 친구들 중 한 명은 키가 크다. (주어는 One 하나라서 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>One of my friends are tall.</div><div class=\"ko\">friends(친구들)에 끌려 복수 are를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>One of the best ways to learn English is to read.</div><div class=\"ko\">영어를 배우는 가장 좋은 방법 중 하나는 읽는 것이다. (꾸미는 말이 길어도 주어는 One이라 is가 맞아요)</div></div><p class=\"gb\">지문 1번도 One of the simplest and most effective ways(가장 단순하고 효과적인 방법 중 하나) 뒤라서 단수 is(~이다)가 그대로 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">themselves 그들 자신</span><span class=\"why\">3번에서 forcing(~하게 하면서)의 주인은 children at play(놀고 있는 아이들)이고, 억지로 상상하게 만드는 대상도 그 아이들 자신이에요. 주어와 목적어가 같은 사람이라 재귀대명사 themselves(그들 자신)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">재귀대명사: 하는 사람 = 당하는 사람이면 themselves(그들 자신) 같은 '자기 자신' 형태</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The kids enjoyed themselves at the party.</div><div class=\"ko\">아이들은 파티에서 즐거운 시간을 보냈다. (즐긴 사람 = 아이들 자신이라 themselves가 맞아요)</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I made myself study for an hour.</div><div class=\"ko\">나는 나 자신에게 한 시간 동안 공부하게 했다. (시킨 사람 = 공부한 사람이라 myself가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I made me study for an hour.</div><div class=\"ko\">시킨 사람과 공부한 사람이 같은 '나'인데 me(나를)를 써서 틀려요.</div></div><p class=\"gb\">지문 3번도 놀고 있는 아이들이 자기 자신에게 남의 생각을 상상하게 하니 forcing themselves(그들 자신이 ~하게 하면서)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">ultimately 궁극적으로는</span><span class=\"why\">5번의 ultimately(궁극적으로는)는 바로 뒤 형용사 dramatic(극적인)을 꾸며요. 형용사를 꾸미는 건 부사의 일이라 부사 ultimately(궁극적으로는)가 맞아요. 그 뒤 명사 decline(감소)을 꾸미는 건 dramatic(극적인)이에요.</span><div class=\"gm wx\"><p class=\"gt\">부사 + 형용사 + 명사: 형용사를 꾸미는 자리는 부사</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>It was a really hot day.</div><div class=\"ko\">정말 더운 날이었다. (부사 really(정말)가 형용사 hot(더운)을 꾸며서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>It was a real hot day.</div><div class=\"ko\">형용사 real(진짜의)이 형용사 hot(더운)을 꾸밀 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She is an amazingly fast runner.</div><div class=\"ko\">그녀는 놀랄 만큼 빠른 달리기 선수다. (부사 amazingly(놀랄 만큼)가 형용사 fast(빠른)를 꾸며서 맞아요)</div></div><p class=\"gb\">지문 5번도 ultimately(궁극적으로는)가 형용사 dramatic(극적인)을 꾸미고, 그 형용사가 명사 decline(감소)을 꾸며서 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">what ~하는 것</span><span class=\"why\">7번은 are exactly(바로 ~이다) 뒤에 선행사가 없고, 뒤 절 we would expect to see(우리가 보리라 예상할) 안에 see(보다)의 목적어가 빠져 있어요. 선행사 없이 불완전한 절을 이끄니 what(~하는 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">관계대명사 what(~하는 것) = 선행사 없음 + 뒤 절 불완전</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is what I want.</div><div class=\"ko\">이게 내가 원하는 것이다. (want 원하다의 목적어가 비었고 앞에 선행사가 없어서 what이 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is that I want.</div><div class=\"ko\">앞에 선행사가 없는데 that을 써서 '원하는 것'이 안 되니 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the bag that I want.</div><div class=\"ko\">이게 내가 원하는 가방이다. (선행사 the bag 가방이 있으니 that이 맞아요)</div></div><p class=\"gb\">지문 7번도 앞에 선행사가 없고 see(보다) 뒤가 비어 있어서 what(~하는 것)이 공감 감소와 자아도취 증가를 그대로 받아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">One of the simplest and most effective ways</div><div class=\"k\">가장 단순하고 효과적인 방법 중 하나는</div></div><div class=\"rc\"><div class=\"e\">to build empathy in children</div><div class=\"k\">아이들의 공감 능력을 길러 주는</div></div><div class=\"rc\"><div class=\"e\">is to let them play more</div><div class=\"k\">그들(= 아이들)이 더 놀게 하는 것이다</div></div><div class=\"rc\"><div class=\"e\">on their own.</div><div class=\"k\">혼자서.</div></div><div class=\"rnat\">아이들의 공감 (능력)을 길러 주는 가장 단순하고 효과적인 방법 중 하나는 그들이 혼자서 더 놀게 하는 것이다.</div><div class=\"rst\">아이들이 남의 마음을 잘 알게 하려면 혼자서 많이 놀게 하면 돼요. 주어는 One(하나)이라 단수 is(~이다)를 써요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Unsupervised kids</div><div class=\"k\">감독을 받지 않는 아이들은</div></div><div class=\"rc\"><div class=\"e\">are not reluctant to tell one another</div><div class=\"k\">서로 말하는 것을 꺼리지 않는다</div></div><div class=\"rc\"><div class=\"e\">how they feel.</div><div class=\"k\">그들(= 그 아이들)이 어떻게 느끼는지.</div></div><div class=\"rnat\">감독을 받지 않는 아이들은 그들이 어떻게 느끼는지 서로 말하는 것을 꺼리지 않는다.</div><div class=\"rst\">어른이 안 지켜보면 아이들은 자기 기분을 서로 솔직하게 말해요. = 지문의 Unsupervised kids(감독을 받지 않는 아이들)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In addition,</div><div class=\"k\">게다가,</div></div><div class=\"rc\"><div class=\"e\">children at play often take on other roles,</div><div class=\"k\">놀고 있는 아이들은 종종 다른 역할을 맡는다,</div></div><div class=\"rc\"><div class=\"e\">pretending to be Principal Walsh or Josh’s mom,</div><div class=\"k\">Walsh 교장 선생님이나 Josh의 엄마인 척하면서,</div></div><div class=\"rc\"><div class=\"e\">happily forcing themselves</div><div class=\"k\">즐거운 마음으로 그들 자신(= 놀고 있는 아이들)이 ~하게 하면서</div></div><div class=\"rc\"><div class=\"e\">to imagine how someone else thinks and feels.</div><div class=\"k\">다른 누군가가 어떻게 생각하고 느끼는지 상상하도록.</div></div><div class=\"rnat\">게다가, 놀고 있는 아이들은 종종 다른 역할을 맡아서 Walsh 교장 선생님이나 Josh의 엄마인 척하고, 즐거운 마음으로 다른 누군가가 어떻게 생각하고 느끼는지를 그들 스스로 상상하게 한다.</div><div class=\"rst\">놀이에서 교장 선생님이나 친구 엄마 역할을 하며 그 사람 마음을 상상해요. 아이들 자신이 하니까 <b>themselves</b>(그들 자신)예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Unfortunately,</div><div class=\"k\">불행히도,</div></div><div class=\"rc\"><div class=\"e\">free play is becoming rare.</div><div class=\"k\">자유로운 놀이는 드물어지고 있다.</div></div><div class=\"rnat\">불행히도, 자유로운 놀이는 드물어지고 있다.</div><div class=\"rst\"><b>불행히도</b>(Unfortunately) 이런 자유 놀이가 점점 드물어지고 있어요. 여기서 글이 걱정으로 꺾여요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">Boston College research professor Peter Gray</div><div class=\"k\">보스턴 대학의 연구 교수인 Peter Gray는</div></div><div class=\"rc\"><div class=\"e\">has documented</div><div class=\"k\">기록해 왔다</div></div><div class=\"rc\"><div class=\"e\">a continuous and ultimately dramatic decline</div><div class=\"k\">지속적이고 궁극적으로는 극적인 감소를</div></div><div class=\"rc\"><div class=\"e\">in children’s opportunities</div><div class=\"k\">아이들의 기회에서의</div></div><div class=\"rc\"><div class=\"e\">to play and explore</div><div class=\"k\">놀고 탐구할</div></div><div class=\"rc\"><div class=\"e\">in their own chosen ways</div><div class=\"k\">그들(= 아이들) 스스로 선택한 방식으로</div></div><div class=\"rc\"><div class=\"e\">over the past fifty years</div><div class=\"k\">지난 50년 동안</div></div><div class=\"rc\"><div class=\"e\">in the United States and other developed countries.</div><div class=\"k\">미국과 다른 선진국들에서.</div></div><div class=\"rnat\">보스턴 대학의 연구 교수인 Peter Gray는 지난 50년 동안 미국과 다른 선진국들에서 아이들이 스스로 선택한 방식으로 놀면서 탐구할 기회가 지속적이고, 궁극적으로는 극적인 감소를 보이고 있음을 기록해 왔다.</div><div class=\"rst\">지난 50년 동안 아이들이 스스로 놀 기회가 계속, 결국엔 크게 줄었대요. ultimately(궁극적으로는)가 형용사 dramatic(극적인)을 꾸며요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">The effects have been <span class=\"cw\">especially damaging</span>,</div><div class=\"k\">그 결과는 <span class=\"cw\">특히 해를 끼쳐 왔다</span> ※ 문제지엔 damaged로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">he argues,</div><div class=\"k\">그는 주장한다,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to empathy</span>.</div><div class=\"k\"><span class=\"cw\">공감 능력에</span>.</div></div><div class=\"rnat\">그 결과가 특히 공감 (능력)을 훼손해 왔다고 그는 주장한다.</div><div class=\"rst\">그 결과가 공감 능력에 특히 <b>해를 끼쳤다</b>고 해요. 결과가 공감 능력을 망가뜨린 쪽이라 <b>damaging</b>(해를 끼치는)이 정답이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">He concludes that</div><div class=\"k\">그(= Peter Gray)는 ~라고 결론짓는다</div></div><div class=\"rc\"><div class=\"e\">a decline of empathy and a rise in narcissism</div><div class=\"k\">공감 능력의 감소와 자아도취의 증가가</div></div><div class=\"rc\"><div class=\"e\">are exactly what we would expect to see</div><div class=\"k\">바로 우리가 보리라 예상할 것이라고</div></div><div class=\"rc\"><div class=\"e\">in children</div><div class=\"k\">아이들에게서</div></div><div class=\"rc\"><div class=\"e\">who have little opportunity to play socially.</div><div class=\"k\">사회적으로 놀 기회가 거의 없는.</div></div><div class=\"rnat\">그는 사회적으로 놀 기회를 거의 갖지 못하는 아이들에게서 우리가 보길 기대할 것은 바로 공감 (능력)의 감소와 자아도취의 증가라고 결론짓는다.</div><div class=\"rst\">그래서 함께 놀 기회가 없는 아이에게서 공감은 줄고 자아도취는 느는 게 예상되는 일이래요. 선행사가 없어 what(~하는 것)을 써요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"empathy\" data-m=\"공감(능력), 감정 이입\"><b>empathy</b>공감(능력), 감정 이입</button><button type=\"button\" class=\"wdb\" data-w=\"unsupervised\" data-m=\"감독을 받지 않는\"><b>unsupervised</b>감독을 받지 않는</button><button type=\"button\" class=\"wdb\" data-w=\"reluctant\" data-m=\"꺼리는\"><b>reluctant</b>꺼리는</button><button type=\"button\" class=\"wdb\" data-w=\"take on\" data-m=\"(역할을) 맡다\"><b>take on</b>(역할을) 맡다</button><button type=\"button\" class=\"wdb\" data-w=\"decline\" data-m=\"감소\"><b>decline</b>감소</button><button type=\"button\" class=\"wdb\" data-w=\"narcissism\" data-m=\"자아도취\"><b>narcissism</b>자아도취</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄은 <b>비유</b>예요. 7~8번의 걱정 <b>convergence of tastes</b>(취향의 수렴 = 다 같은 음악으로 몰림)를 9번 <b>But</b>(그러나)이 부정하니, 밑줄은 그 반대인 <b>각자 다른 취향으로 갈라짐</b>을 뜻해요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (10번)</span><div class=\"en\">A small divergence in my likes compared to yours can <mark>send us off into different far corners of the library</mark>.</div><p class=\"ko\">여러분이 좋아하는 것과 비교하여 내가 좋아하는 것의 작은 갈라짐이 우리를 <mark>라이브러리의 저 멀리 떨어진 서로 다른 구석들로</mark> 보낼 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>7번의 ‘모두를 특정 부분으로 몰아넣는다’를 한 단어로 정리한 말</span></div><div class=\"ck-step\"><span class=\"lab\">8번 문장 · 필자의 원래 걱정</span><div class=\"en\">Would they cause <mark>a convergence of tastes</mark>?</div><p class=\"ko\">그것들(= 그런 알고리즘)이 <mark>취향의 수렴을</mark> 일으킬까?</p></div><div class=\"ck-via\"><i>▼</i><span>But(그러나)으로 걱정을 뒤집어요. this(이런 일) = 취향의 수렴</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 단서</span><div class=\"en\"><mark>But</mark> thanks to the nonlinear and chaotic mathematics usually behind them, <mark>this doesn’t happen</mark>.</div><p class=\"ko\"><mark>그러나</mark> 일반적으로 그것들의 배후에 있는 비선형적이고 무질서한 수학 덕분에, <mark>이런 일(= 취향의 수렴)은 발생하지 않는다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>갈라져 간 구석에서 알고리즘은 ‘내가 좋아할 음악’을 찾아 줘요</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 알고리즘이 하는 일</span><div class=\"en\">the algorithms … are perfectly suited to <mark>finding gems that I’ll like</mark>.</div><p class=\"ko\">알고리즘은 … <mark>내가 좋아할 보석을 찾는 데</mark> 완벽하게 적합하다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>divergence</em>갈라짐 = convergence(수렴)의 반대</span><span><em>different far corners</em>사람마다 다른, 서로 멀리 떨어진 자리</span><span><em>gems that I’ll like</em>그 자리에서 찾는 내 취향의 음악</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 각자의 취향에 맞게 골라진 음악으로 우리를 데려간다 → ①</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">lead us to music selected to suit our respective tastes 우리를 각자의 취향에 맞도록 선택된 음악으로 이끌다<small>different(서로 다른) 구석 = respective tastes(각자의 취향), 6번 gems that I’ll like(내가 좋아할 보석)와도 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">motivate us to search for talented but unknown musicians 재능 있지만 알려지지 않은 음악가를 찾도록 동기를 부여하다</span><span class=\"why\">far corners(저 멀리 떨어진 구석)를 글자 그대로 ‘사람들이 잘 안 가는 곳 = 무명 음악가’로 읽은 함정이에요. 밑줄은 무명인지가 아니라 사람마다 different(서로 다른) 곳으로 갈라진다는 뜻이에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">enable us to build connections with other listeners 다른 청취자들과 관계를 맺을 수 있게 하다</span><span class=\"why\">10번은 나와 여러분이 서로 다른 구석으로 ‘떨어져’ 간다고 해요. 다른 청취자와 이어진다는 건 그 반대 방향이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">encourage us to request frequent updates for algorithms 알고리즘의 잦은 업데이트를 요청하도록 장려하다</span><span class=\"why\">업데이트를 요청한다는 말은 지문에 없어요. 9번에서 알고리즘 뒤의 수학이 이미 수렴을 막아 준다고 했어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">make us ignore our preferences for particular music genres 특정 음악 장르에 대한 우리의 선호를 무시하게 하다</span><span class=\"why\">10번의 출발점이 my likes(내가 좋아하는 것)의 작은 차이예요. 6번도 내가 좋아할 보석을 찾아 준다고 하니, 선호를 무시하는 게 아니라 따라가요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">You may feel</div><div class=\"k\">여러분은 ~라고 느낄 수 있다</div></div><div class=\"rc\"><div class=\"e\">there is something scary</div><div class=\"k\">뭔가 무서운 것이 있다고</div></div><div class=\"rc\"><div class=\"e\">about an algorithm deciding</div><div class=\"k\">알고리즘이 결정하는 것에 대해</div></div><div class=\"rc\"><div class=\"e\">what you might like.</div><div class=\"k\">여러분이 무엇을 좋아할지.</div></div><div class=\"rnat\">여러분은 여러분이 좋아할지도 모를 것을 결정하는 알고리즘에 대해 뭔가 무서운 것이 있다고 느낄 수 있다.</div><div class=\"rst\">음악 앱이 “너는 이 노래 좋아할 거야” 하고 정해 주면 좀 무섭기도 해요. = 지문 1번, 알고리즘이 내 취향을 결정하는 게 무섭다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Could it mean that,</div><div class=\"k\">그것(= 알고리즘이 여러분이 좋아할 것을 결정하는 것)은 ~라는 뜻일 수 있을까,</div></div><div class=\"rc\"><div class=\"e\">if computers conclude</div><div class=\"k\">만약 컴퓨터가 결론을 내린다면</div></div><div class=\"rc\"><div class=\"e\">you won’t like something,</div><div class=\"k\">여러분이 어떤 것을 좋아하지 않을 거라고,</div></div><div class=\"rc\"><div class=\"e\">you will never get the chance</div><div class=\"k\">여러분은 결코 기회를 얻지 못할 것이라는</div></div><div class=\"rc\"><div class=\"e\">to see it?</div><div class=\"k\">그것(= 그 어떤 것)을 볼?</div></div><div class=\"rnat\">그것은, 여러분이 뭔가를 좋아하지 않을 것이라고 컴퓨터가 결론을 내린다면 여러분이 그것을 볼 기회를 결코 얻지 못할 것이라는 뜻일 수 있을까?</div><div class=\"rst\">앱이 “얘는 이거 싫어해” 하면 그 노래는 영영 못 듣게 될까요? = 지문 2번의 걱정이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Personally,</div><div class=\"k\">개인적으로,</div></div><div class=\"rc\"><div class=\"e\">I really enjoy being directed toward new music</div><div class=\"k\">나는 새로운 음악 쪽으로 안내받는 것을 정말 좋아한다</div></div><div class=\"rc\"><div class=\"e\">that I might not have found by myself.</div><div class=\"k\">내가 스스로는 발견하지 못했을지도 모르는.</div></div><div class=\"rnat\">개인적으로, 나는 스스로는 발견하지 못했을 새로운 음악 쪽으로 안내받는 것을 정말 좋아한다.</div><div class=\"rst\">그래도 나는 혼자선 못 찾았을 새 노래를 추천받는 게 좋아요. = 지문 3번, 새로운 음악 쪽으로 안내받는 걸 즐긴다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">I can quickly get stuck in a rut</div><div class=\"k\">나는 빠르게 틀에 갇힐 수 있다</div></div><div class=\"rc\"><div class=\"e\">where I put on the same songs</div><div class=\"k\">같은 노래를 트는</div></div><div class=\"rc\"><div class=\"e\">over and over.</div><div class=\"k\">반복해서.</div></div><div class=\"rnat\">나는 같은 노래를 반복해서 트는 틀에 빠르게 갇힐 수 있다.</div><div class=\"rst\">가만두면 나는 매일 같은 플레이리스트만 돌려 들어요. = 지문 4번, 같은 노래만 트는 틀에 갇힌다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">That’s why</div><div class=\"k\">그래서</div></div><div class=\"rc\"><div class=\"e\">I’ve always enjoyed the radio.</div><div class=\"k\">나는 항상 라디오를 즐겨 왔다.</div></div><div class=\"rnat\">그래서 나는 항상 라디오를 즐겨 왔다.</div><div class=\"rst\">그래서 아무 노래나 틀어 주는 라디오를 늘 좋아했어요. = 지문 5번이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">But the algorithms</div><div class=\"k\">그러나 알고리즘은</div></div><div class=\"rc\"><div class=\"e\">that are now pushing and pulling me</div><div class=\"k\">지금 나를 밀고 당기는</div></div><div class=\"rc\"><div class=\"e\">through the music library</div><div class=\"k\">뮤직 라이브러리 곳곳으로</div></div><div class=\"rc\"><div class=\"e\">are perfectly suited to finding gems</div><div class=\"k\">보석을 찾는 데 완벽하게 적합하다</div></div><div class=\"rc\"><div class=\"e\">that I’ll like.</div><div class=\"k\">내가 좋아할.</div></div><div class=\"rnat\">그러나 지금 뮤직 라이브러리 곳곳으로 나를 밀고 당기는 알고리즘은 내가 좋아할 보석을 찾는 데 완벽하게 적합하다.</div><div class=\"rst\">그런데 요즘 앱은 내가 좋아할 숨은 명곡을 기가 막히게 찾아 줘요. = 지문 6번, <b>내가 좋아할 보석</b>(gems)을 찾는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">My worry originally about such algorithms</div><div class=\"k\">원래 그런 알고리즘에 대한 나의 걱정은</div></div><div class=\"rc\"><div class=\"e\">was that they might drive everyone into</div><div class=\"k\">그것들(= 그런 알고리즘)이 모든 사람을 ~로 몰아넣을지도 모른다는 것이었다</div></div><div class=\"rc\"><div class=\"e\">certain parts of the library,</div><div class=\"k\">라이브러리의 특정 부분으로,</div></div><div class=\"rc\"><div class=\"e\">leaving others lacking listeners.</div><div class=\"k\">다른 부분들(= 라이브러리의 나머지 부분)은 듣는 이들이 부족한 상태로 남겨 두면서.</div></div><div class=\"rnat\">원래 그런 알고리즘에 대한 나의 걱정은 그것들이 모든 사람을 라이브러리의 특정 부분으로 몰아넣어, 나머지 부분은 듣는 이들이 부족한 상태로 남겨 둘지도 모른다는 것이었다.</div><div class=\"rst\">처음엔 반 친구 모두가 같은 인기곡만 듣게 될까 봐 걱정했어요. = 지문 7번, 모두를 라이브러리의 특정 부분으로 몰아넣는다는 걱정이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Would they cause</div><div class=\"k\">그것들(= 그런 알고리즘)이 일으킬까</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">a convergence of tastes</span>?</div><div class=\"k\"><span class=\"cw\">취향의 수렴을</span>?</div></div><div class=\"rnat\">알고리즘은 취향의 수렴을 일으킬 것인가?</div><div class=\"rst\">다들 취향이 똑같아지는 거죠. = 지문 8번의 <b>취향의 수렴</b>(convergence of tastes)이에요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">But thanks to the nonlinear and chaotic mathematics</div><div class=\"k\">그러나 비선형적이고 무질서한 수학 덕분에</div></div><div class=\"rc\"><div class=\"e\">usually behind them,</div><div class=\"k\">일반적으로 그것들(= 그런 알고리즘)의 배후에 있는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">this doesn’t happen.</span></div><div class=\"k\">이런 일(= 취향의 수렴)은 <span class=\"cw\">발생하지 않는다.</span></div></div><div class=\"rnat\">그러나 일반적으로 그 배후에 있는 비선형적이고 무질서한 수학 덕분에 이런 일은 발생하지 않는다.</div><div class=\"rst\"><b>그러나</b>(But) 앱 속 복잡한 계산 덕분에 그런 일은 <b>안 생겨요</b>. = 지문 9번, 수렴은 발생하지 않는다는 말이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">A small divergence in my likes</span></div><div class=\"k\"><span class=\"cw\">내가 좋아하는 것의 작은 갈라짐이</span></div></div><div class=\"rc\"><div class=\"e\">compared to yours</div><div class=\"k\">여러분의 것(= 여러분이 좋아하는 것)과 비교하여</div></div><div class=\"rc\"><div class=\"e\">can send us off</div><div class=\"k\">우리를 보낼 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">into different far corners of the library.</span></div><div class=\"k\"><span class=\"cw\">라이브러리의 저 멀리 떨어진 서로 다른 구석들로.</span></div></div><div class=\"rnat\">여러분이 좋아하는 것과 비교하여 내가 좋아하는 것의 작은 갈라짐이 우리를 라이브러리의 저 멀리 떨어진 서로 다른 구석들로 보낼(우리를 각자 자신의 취향에 맞도록 선택된 음악으로 이끌) 수 있다.</div><div class=\"rst\">나랑 짝꿍 취향이 조금만 달라도 앱은 우리를 전혀 다른 노래로 데려가요. 그래서 밑줄은 <b>각자 취향에 맞는 음악으로 이끈다</b>(①)는 뜻이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"get stuck in a rut\" data-m=\"틀에 박히다\"><b>get stuck in a rut</b>틀에 박히다</button><button type=\"button\" class=\"wdb\" data-w=\"suited to\" data-m=\"~에 적합한\"><b>suited to</b>~에 적합한</button><button type=\"button\" class=\"wdb\" data-w=\"gems\" data-m=\"보석(같은 좋은 것)\"><b>gems</b>보석(같은 좋은 것)</button><button type=\"button\" class=\"wdb\" data-w=\"convergence\" data-m=\"수렴, 한곳으로 모임\"><b>convergence</b>수렴, 한곳으로 모임</button><button type=\"button\" class=\"wdb\" data-w=\"divergence\" data-m=\"갈라짐, 차이\"><b>divergence</b>갈라짐, 차이</button><button type=\"button\" class=\"wdb\" data-w=\"chaotic\" data-m=\"무질서한, 혼돈의\"><b>chaotic</b>무질서한, 혼돈의</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸 앞 <b>This basic principle</b>(이러한 기본 원리)의 This(이러한)는 <b>앞에서 말한 원리를 한 단어로 묶으라</b>는 신호예요. 4번 <b>to suit individual users’ needs</b>(개별 사용자의 요구를 충족시키도록)와 5번 의자 예시를 한 단어로 바꾸세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (6번)</span><div class=\"en\"><mark>This basic principle</mark> of <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span></span> allowed a constant stream of incremental modifications to be introduced, …</div><p class=\"ko\"><mark>이러한 기본 원리</mark>인 ( ? )는 점진적 수정이 계속 도입되게 했다 …</p></div><div class=\"ck-via\"><i>▼</i><span>however(그러나)로 ‘전통은 굳어 있지 않았다’를 강조해요</span></div><div class=\"ck-step\"><span class=\"lab\">3번 문장 · 방향 잡기</span><div class=\"en\">tradition was <mark>not static</mark>, but constantly subject to minute variations appropriate to people and their circumstances.</div><p class=\"ko\">전통은 <mark>정적인 것이 아니었다</mark>는 점이, 오히려 사람들과 그들의 환경에 알맞은 미세한 변화들의 영향을 지속적으로 받았다는 점이</p></div><div class=\"ck-via\"><i>▼</i><span>그 ‘미세한 변화’가 누구를 위한 것인지 딱 짚어 줘요 = 한 사람 한 사람</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">specific manifestations could be adapted in various minute and subtle ways <mark>to suit individual users’ needs</mark>.</div><p class=\"ko\">구체적인 발현은 여러 가지 미세하고 미묘한 방식으로 <mark>개별 사용자들의 요구를 충족시키도록</mark> 맞춰질 수 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>4번 원리를 의자로 보여 줘요. 기본 틀은 그대로, 몸에 맞게 손질</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 의자 예시</span><div class=\"en\">A chair could keep its basic, accepted characteristics while still being closely shaped in detail <mark>to the physique and proportions of a specific person</mark>.</div><p class=\"ko\">의자는 <mark>특정 개인의 체격과 (신체의) 비율에 맞게</mark> 세부적으로 면밀하게 모양이 만들어지면서도 그것의 기본적이고 일반적으로 용인되는 특징을 유지할 수 있었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">customization 맞춤 제작<small>4번 individual users’ needs(개별 사용자의 요구)와 5번 a specific person(특정 개인)에 맞춘다는 말을 한 단어로 묶었어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">preservation 보존</span><span class=\"why\">5번의 기본 특징을 keep(유지하다)한다는 말만 보면 끌려요. 하지만 3번에서 전통은 not static(정적인 것이 아닌)이라 했고, 6번은 수정이 계속 들어온다고 하니 그대로 지키는 ‘보존’과 반대예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">dedication 헌신</span><span class=\"why\">누군가 헌신한다는 장면이 지문에 없어요. 4·5번은 물건을 개인 몸과 요구에 맞춰 바꾸는 얘기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">cooperation 협동</span><span class=\"why\">여러 사람이 힘을 합친다는 말은 없어요. 5번 의자도 a specific person(특정 개인) 한 명에게 맞춘 거예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">generalization 일반화</span><span class=\"why\">모두에게 똑같이 맞추는 ‘일반화’는 4번 individual users(개별 사용자들)·5번 specific person(특정 개인)과 정반대 방향이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Early human societies were nomadic,</div><div class=\"k\">초기 인간 사회는 유목 생활이었다,</div></div><div class=\"rc\"><div class=\"e\">based on hunting and gathering,</div><div class=\"k\">수렵과 채집을 기반으로 한,</div></div><div class=\"rc\"><div class=\"e\">and, in a shifting pattern of life</div><div class=\"k\">그리고 이동하는 생활 양식에서는</div></div><div class=\"rc\"><div class=\"e\">in search of new sources of food,</div><div class=\"k\">새로운 식량 자원을 찾아,</div></div><div class=\"rc\"><div class=\"e\">qualities such as lightness, portability, and adaptability</div><div class=\"k\">가벼움, 휴대성, 그리고 적응성과 같은 특징들이</div></div><div class=\"rc\"><div class=\"e\">were dominant criteria.</div><div class=\"k\">지배적인 기준이었다.</div></div><div class=\"rnat\">초기 인간 사회는 수렵과 채집을 기반으로 한 유목 생활이었고, 새로운 식량 자원을 찾아 이동하는 생활 양식에서는 가벼움, 휴대성, 적응성과 같은 특징들이 지배적인 기준이었다.</div><div class=\"rst\">옛날 이리저리 옮겨 살던 사람들에게 의자는 가볍고 들고 다니기 쉬운 접이식이 최고였어요. = 지문 1번, 가벼움·휴대성이 기준이었다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">With the evolution</div><div class=\"k\">진보와 함께</div></div><div class=\"rc\"><div class=\"e\">of more settled rural societies</div><div class=\"k\">좀 더 정착된 농경 사회의</div></div><div class=\"rc\"><div class=\"e\">based on agriculture,</div><div class=\"k\">농업을 기반으로 한,</div></div><div class=\"rc\"><div class=\"e\">other characteristics,</div><div class=\"k\">다른 특징들,</div></div><div class=\"rc\"><div class=\"e\">other traditions of form</div><div class=\"k\">즉 다른 형태의 전통들이</div></div><div class=\"rc\"><div class=\"e\">appropriate to the new patterns of life,</div><div class=\"k\">새로운 생활 양식에 적합한,</div></div><div class=\"rc\"><div class=\"e\">rapidly emerged.</div><div class=\"k\">빠르게 나타났다.</div></div><div class=\"rnat\">농업을 기반으로 한 좀 더 정착된 농경 사회라는 진보와 함께, 다른 특징들, 즉 새로운 생활 양식에 적합한 다른 형태의 전통들이 빠르게 나타났다.</div><div class=\"rst\">한곳에 자리 잡고 농사를 짓자, 의자도 집에 두고 쓰는 튼튼한 모양으로 바뀌었어요. = 지문 2번, 새로운 형태의 전통이 나타났다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It must be emphasized, however,</div><div class=\"k\">그러나 반드시 강조되어야 한다</div></div><div class=\"rc ckc\"><div class=\"e\">that tradition was <span class=\"cw\">not static</span>,</div><div class=\"k\">전통은 <span class=\"cw\">정적인 것이 아니었다는 점이</span>,</div></div><div class=\"rc\"><div class=\"e\">but constantly subject to minute variations</div><div class=\"k\">오히려 지속적으로 미세한 변화들의 영향을 받았다는 점이</div></div><div class=\"rc\"><div class=\"e\">appropriate to people and their circumstances.</div><div class=\"k\">사람들과 그들의 환경에 알맞은.</div></div><div class=\"rnat\">그러나 전통은 정적인 것이 아니라, 지속적으로 사람들과 그들의 환경에 알맞은 미세한 변화들에 영향을 받았다는 점이 반드시 강조되어야 한다.</div><div class=\"rst\">그런데 그 의자 모양도 꽁꽁 굳은 게 아니라 쓰는 사람에 따라 조금씩 바뀌었어요. = 지문 3번, 전통은 <b>정적인 것이 아니었다</b>(not static)는 말이에요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Although traditional forms reflected</div><div class=\"k\">비록 전통적인 형태가 반영하기는 했지만</div></div><div class=\"rc\"><div class=\"e\">the experience of social groups,</div><div class=\"k\">사회 집단의 경험을,</div></div><div class=\"rc\"><div class=\"e\">specific manifestations could be adapted</div><div class=\"k\">구체적인 발현은 맞춰질 수 있었다</div></div><div class=\"rc\"><div class=\"e\">in various minute and subtle ways</div><div class=\"k\">여러 가지 미세하고 미묘한 방식으로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to suit individual users’ needs.</span></div><div class=\"k\"><span class=\"cw\">개별 사용자들의 요구를 충족시키도록.</span></div></div><div class=\"rnat\">전통적인 형태가 사회 집단의 경험을 반영하기는 했지만, 구체적인 발현은 개별 사용자들의 요구를 충족시키는 여러 가지 미세하고 미묘한 방식들로 맞춰질 수 있었다.</div><div class=\"rst\">학교 의자도 기본 모양은 같지만 키 큰 친구 것은 높이를 조절해 줘요. = 지문 4번, <b>개별 사용자의 요구</b>(individual users’ needs)에 맞췄다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">A chair could keep</div><div class=\"k\">의자는 유지할 수 있었다</div></div><div class=\"rc\"><div class=\"e\">its basic, accepted characteristics</div><div class=\"k\">그것(= 의자)의 기본적이고 일반적으로 용인되는 특징을</div></div><div class=\"rc\"><div class=\"e\">while still being closely shaped in detail</div><div class=\"k\">여전히 세부적으로 면밀하게 모양이 만들어지면서도</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to the physique and proportions of a specific person.</span></div><div class=\"k\"><span class=\"cw\">특정 개인의 체격과 (신체의) 비율에 맞게.</span></div></div><div class=\"rnat\">의자는 특정 개인의 체격과 (신체의) 비율에 맞게 여전히 세부적으로 면밀하게 모양이 만들어지면서도, 그것의 기본적이고 일반적으로 용인되는 특징을 유지할 수 있었다.</div><div class=\"rst\">다리 네 개, 등받이 하나는 그대로 두고 앉을 사람 몸에 딱 맞게 다듬어요. = 지문 5번, <b>특정 개인의 체격</b>에 맞춘 의자예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">This basic principle</div><div class=\"k\">이러한 기본 원리는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">of customization</span></div><div class=\"k\"><span class=\"cw\">맞춤 제작의</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">allowed a constant stream</div><div class=\"k\">지속적인 이어짐이 ~하게 했다</div></div><div class=\"rc\"><div class=\"e\">of incremental modifications</div><div class=\"k\">점진적 수정의</div></div><div class=\"rc\"><div class=\"e\">to be introduced,</div><div class=\"k\">도입되도록,</div></div><div class=\"rc\"><div class=\"e\">which,</div><div class=\"k\">그리고 그것들(= 점진적 수정들)은,</div></div><div class=\"rc\"><div class=\"e\">if demonstrated by experience</div><div class=\"k\">경험에 의해 입증되면</div></div><div class=\"rc\"><div class=\"e\">to be advantageous,</div><div class=\"k\">이롭다고,</div></div><div class=\"rc\"><div class=\"e\">could be integrated back</div><div class=\"k\">다시 통합될 수 있었다</div></div><div class=\"rc\"><div class=\"e\">into the mainstream of tradition.</div><div class=\"k\">전통의 주류 속으로.</div></div><div class=\"rnat\">이러한 맞춤 제작의 기본 원리는 점진적 수정의 지속적인 이어짐이 도입될 수 있게 하였고, 그것들(점진적 수정)이 경험에 의해 이롭다고 입증되면, 전통의 주류 속으로 다시 통합될 수 있었다.</div><div class=\"rst\">그렇게 한 사람씩 맞춰 고친 것 중 좋은 건 모두의 기본 의자가 돼요. 그래서 빈칸은 <b>맞춤 제작</b>(customization)이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"nomadic\" data-m=\"유목의\"><b>nomadic</b>유목의</button><button type=\"button\" class=\"wdb\" data-w=\"static\" data-m=\"정적인, 고정된\"><b>static</b>정적인, 고정된</button><button type=\"button\" class=\"wdb\" data-w=\"subject to\" data-m=\"~의 영향을 받는\"><b>subject to</b>~의 영향을 받는</button><button type=\"button\" class=\"wdb\" data-w=\"manifestations\" data-m=\"발현, 구체적으로 드러난 모습\"><b>manifestations</b>발현, 구체적으로 드러난 모습</button><button type=\"button\" class=\"wdb\" data-w=\"physique\" data-m=\"체격\"><b>physique</b>체격</button><button type=\"button\" class=\"wdb\" data-w=\"incremental\" data-m=\"점진적인\"><b>incremental</b>점진적인</button></div>"};

function renderExp(){

  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
