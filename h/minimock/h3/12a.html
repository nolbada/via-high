<title>고3 미니모의고사 12회 01–06번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}

.wds{display:flex;flex-wrap:wrap;gap:6px}

.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});
</script>

function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

function dwToast(m){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1800);}
function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}
document.addEventListener('click',function(e){
  const el=e.target.closest&&e.target.closest('.dw');if(!el)return;
  e.stopPropagation();e.preventDefault();
  const p=el.closest('[data-q]');const it=p&&dwItem(p.dataset.q,el.dataset.k);if(!it)return;
  const head=it[2]||it[0],mean=it[1];S.dw=S.dw||{};const on=!S.dw[head];
  if(on)S.dw[head]=1;else delete S.dw[head];save();dwMark(head,on);
  if(on){try{WN.add([{w:head,m:mean,src:'미니모고',how:'별표',ask:true}]);}catch(err){}dwToast(head.replace(/\s+[AB](?=\s|$)/g,'').trim()+'  '+mean.replace(/\bA(?=[에를은는이가와과의도]|\s)|\bB(?=[에를은는이가와과의도]|\s)/g,'').replace(/\s+/g,' ').trim()+'  담음');}
  else{let pr=null;try{pr=WN.del(head,'미니모고');}catch(err){}
    if(pr&&pr.then)pr.then(function(r){if(r&&r.removed===false&&r.reason==='late'){S.dw[head]=1;save();dwMark(head,true);dwToast('이미 쌓인 단어라 뺄 수 없어요');}else if(r&&r.removed)dwToast(head+'  뺌');});
    else dwToast(head+'  뺌');}
},true);

it": "박물관 안에는 압박이 있다 / 전시실에서 일어나는 일을 더 강조하게 만드는 / 눈에 보이지 않는 구역에서 일어나는 활동보다.", "nat": "박물관 안에는 눈에 보이지 않는 구역에서 일어나는 활동보다 전시실에서 일어나는 일을 더 강조하게 만드는 압박이 있다.", "ana": "<b>There are ~</b>로 시작하면 there는 '거기'가 아니라 존재를 알리는 <b>유도부사</b>이고, 진짜 주어는 be동사 뒤의 <b>pressures</b>다. 그래서 동사가 are로 복수다. 이 문장에는 <b>that</b>이 두 번 나오는데 <b>둘 다 주격 관계대명사</b>이고 받는 명사가 다르다. 앞의 that은 <b>pressures</b>를 받고(cause가 복수 동사인 것이 단서), 뒤의 that은 <b>the activities</b>를 받는다. 관계대명사가 여러 개일 때는 <b>바로 뒤 동사의 수</b>로 선행사를 되짚는 것이 가장 빠르다. <b>cause A to V</b>는 'A가 ~하게 만들다'이고 여기서 A는 <b>it</b>, 즉 the museum이다. <b>what happens</b>의 what은 선행사를 품은 관계대명사로 '<b>일어나는 일</b>'이다.", "pe": "There are pressures<sup>1</sup> \u0001within the museum\u0002 / \u0001that cause it to emphasise<sup>2</sup> what happens in the galleries\u0002 / \u0001over the activities \u0001that take place<sup>3</sup> in its unseen<sup>4</sup> zones<sup>5</sup>\u0002\u0002.", "pk": "\u0001박물관 안에는\u0002 압박이 있다 / \u0001전시실에서 일어나는 일을 더 강조하게 만드는\u0002 / \u0001\u0001눈에 보이지 않는 구역에서 일어나는\u0002 활동보다\u0002.", "core": "압박이 있다.", "tags": ["<b>There are</b> 구문: 주어는 뒤의 pressures. within the museum = 전치사구(부사구): are를 꾸밈 (장소)", "that절 = 관계절(형용사절): pressures를 꾸밈. <b>cause A to V</b> = A가 V하게 만들다. what절 = emphasise의 목적어(명사절)", "over the activities = 전치사구(부사구): emphasise A over B. that take place ~ = 관계절: activities를 꾸밈"], "steps": [{"t": "이 문장은 <b>There are 구문(1형식)</b>이다. 주어가 are 뒤에 있고, 관계절 안에 cause A to V가 겹쳐 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["V: are (있다)", "S: pressures (압박들. 주어는 are 뒤에 있음)", "뼈대 = <b>There are pressures</b>", "within the museum = 박물관 안에 (장소 부사구. museum 박물관)"]}, {"t": "<b>that cause it to emphasise ~</b>는 pressures를 꾸미는 주격 관계절이다. <b>cause+O+to V</b>(5형식)가 쓰였다.", "sub": ["cause A to V = A가 V하게 만들다. it = the museum (박물관)", "emphasise = 강조하다 (emphasize의 영국식 철자)"]}, {"t": "emphasise의 목적어는 <b>what happens in the galleries</b>이다. what절(명사절)로 '전시실에서 일어나는 일'이라는 뜻이다.", "sub": ["happen 일어나다, gallery 전시실"]}, {"t": "<b>over the activities that take place in its unseen zones</b>는 emphasise A over B(A를 B보다 더 강조하다)의 B이다. that절은 activities를 꾸미는 관계절이다.", "sub": ["take place = 일어나다. its = the museum's (박물관의)", "unseen zones = 눈에 보이지 않는 구역 (unseen 보이지 않는)"]}], "sum": "박물관 안에는 보이지 않는 구역의 활동보다 전시실 일을 더 강조하게 만드는 압박 존재"}, {"i": "04", "q": "04", "s": "1", "title": "S+V+C(2형식, to부정사 보어) + 사역동사 let", "eng": "One of the simplest and most effective<sup>1</sup> ways to build<sup>2</sup> empathy<sup>3</sup> in children / is to let them play more on their own<sup>4</sup>.", "notes": [["1", "effective", "효과적인"], ["2", "build", "기르다, 형성하다"], ["3", "empathy", "공감(능력), 감정 이입"], ["4", "on one's own", "혼자서, 스스로"]], "lit": "아이들의 공감 능력을 길러 주는 가장 단순하고 효과적인 방법 중 하나는 / 그들이 혼자서 더 많이 놀게 해 주는 것이다.", "nat": "아이들의 공감 능력을 길러 주는 가장 단순하고 효과적인 방법 중 하나는 그들이 혼자서 더 많이 놀게 해 주는 것이다.", "ana": "<b>One of + 복수명사</b>가 주어면 동사는 언제나 <b>단수</b>다. 여기서 of the simplest and most effective ways ~ 전체는 <b>수식어</b>일 뿐이고 주어는 <b>One</b>이므로 동사가 <b>is</b>다. 바로 앞의 복수 children이나 ways에 끌려 are를 쓰면 틀린다. <b>동사 바로 앞의 명사가 아니라 문장의 주어</b>를 찾는 훈련이 필요한 대표적인 자리다. 보어 자리의 <b>to let</b>은 '<b>~하는 것</b>'으로 읽는 to부정사이고, <b>let</b>은 사역동사라 목적격보어에 to 없는 원형 <b>play</b>가 온다. let·make·have 뒤에 to play가 오면 그것이 곧 오답이다. <b>on their own</b>은 '<b>혼자 힘으로, 어른 없이</b>'라는 뜻이다.", "pe": "One \u0001of the simplest and most effective<sup>1</sup> ways \u0001to build<sup>2</sup> empathy<sup>3</sup> \u0001in children\u0002\u0002\u0002 / is to let them play \u0001more\u0002 \u0001on their own<sup>4</sup>\u0002.", "pk": "\u0001\u0001아이들의 공감 능력을 길러 주는\u0002 가장 단순하고 효과적인 방법 중\u0002 하나는 / 그들이 \u0001혼자서\u0002 \u0001더 많이\u0002 놀게 해 주는 것이다.", "core": "하나는 아이들이 혼자서 더 많이 놀게 해 주는 것이다.", "tags": ["주어 One. of the simplest ~ ways = 전치사구(형용사구): One을 꾸밈. <b>one of the 최상급</b>. to build ~ = to부정사(형용사적): ways를 꾸밈. in children = 부사구: build", "동사 is + 보어 to let them play (SVOC). more = 부사: play 꾸밈. on their own = 부사구: play 꾸밈 (혼자서)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어가 One of ~ 형태로 길고, 보어가 사역동사 구문이라 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: One (하나). of the simplest and most effective ways ~는 one을 꾸미는 전치사구", "V: is (one이 주어라 단수 동사)", "C: to let them play more on their own (아이들이 혼자서 더 놀게 해 주는 것. to부정사 명사적 용법)", "뼈대 = <b>One is to let them play more</b>"]}, {"t": "<b>of the simplest and most effective ways to build empathy in children</b>은 주어 One을 꾸민다. to build empathy in children은 ways를 꾸미는 to부정사이다.", "sub": ["simple 단순한, effective 효과적인, build 기르다", "empathy 공감, in children 아이들에게서"]}, {"t": "보어 안은 <b>let+O+동사원형</b>(사역동사 5형식)이다.", "sub": ["let A V = A가 V하게 해 주다", "them = children (아이들). play 놀다", "on their own = 혼자서, 스스로"]}, {"t": "함정: One of 뒤가 복수(ways)라서 복수 동사 are로 착각하기 쉽다. 주어는 One이라 is이다."}], "sum": "아이의 공감 능력을 기르는 가장 쉬운 방법 하나, 아이가 혼자 더 놀게 해 주기"}, {"i": "05", "q": "04", "s": "3", "title": "S+V+O(3형식) + 분사구문 두 개 + 의문사절", "eng": "In addition, children at play<sup>1</sup> often take on<sup>2</sup> other roles, / pretending to be<sup>3</sup> Principal<sup>4</sup> Walsh or Josh's mom, / happily forcing<sup>5</sup> themselves to imagine / how someone else thinks and feels.", "notes": [["1", "at play", "놀고 있는"], ["2", "take on", "(역할을) 맡다"], ["3", "pretend to be", "~인 척하다"], ["4", "principal", "교장"], ["5", "force A to V", "A가 ~하도록 강요하다"]], "lit": "게다가, 놀고 있는 아이들은 종종 다른 역할을 맡는다, / Walsh 교장 선생님이나 Josh의 엄마인 척하면서, / 기꺼이 자신들이 상상하도록 만들면서 / 다른 누군가가 어떻게 생각하고 느끼는지를.", "nat": "게다가 놀고 있는 아이들은 종종 Walsh 교장 선생님이나 Josh의 엄마인 척하며 다른 역할을 맡고, 다른 사람이 어떻게 생각하고 느끼는지를 기꺼이 상상하게 된다.", "ana": "동사는 <b>take on</b> 하나뿐이고, 그 뒤의 <b>pretending</b>과 <b>forcing</b>은 둘 다 <b>분사구문</b>이다. 이렇게 분사구문이 연달아 나오면 '<b>~하면서, ~하면서</b>'로 주절에 덧붙여 읽으면 된다. 주어는 셋 다 <b>children</b>으로 같다. <b>forcing themselves</b>에서 목적어가 <b>themselves</b>인 이유는 <b>강요하는 주체와 당하는 대상이 같기</b> 때문이다. 이럴 때 them을 쓰면 다른 사람을 가리키게 되어 틀린다. <b>force A to V</b>가 그대로 살아 있어 뒤에 <b>to imagine</b>이 왔다. 마지막 <b>how someone else thinks and feels</b>는 imagine의 목적어로 들어간 <b>간접의문문</b>이라, 의문문 어순이 아니라 <b>주어 + 동사</b> 어순임을 확인하자.", "pe": "\u0001In addition\u0002, children \u0001at play<sup>1</sup>\u0002 \u0001often\u0002 take on<sup>2</sup> \u0001other\u0002 roles, / \u0001pretending to be<sup>3</sup> Principal<sup>4</sup> Walsh or Josh's mom\u0002, / \u0001happily forcing<sup>5</sup> themselves to imagine\u0002 / \u0001how someone else thinks and feels\u0002.", "pk": "\u0001게다가\u0002, \u0001놀고 있는\u0002 아이들은 \u0001종종\u0002 다른 역할을 맡는다, / \u0001Walsh 교장 선생님이나 Josh의 엄마인 척하면서\u0002, / \u0001기꺼이 자신들이 상상하도록 만들면서\u0002 / \u0001다른 누군가가 어떻게 생각하고 느끼는지를\u0002.", "core": "아이들은 역할을 맡는다.", "tags": ["In addition = 부사구. 주어 children + 동사 take on(구동사) + 목적어 roles. at play = 형용사구: children. often = 부사. other = 형용사: roles", "pretending to be ~ = 분사구문(부사적: 동시 상황): 주절을 꾸밈. pretend to be = ~인 척하다", "happily forcing ~ = 분사구문(부사적: 동시 상황). <b>force A to V</b> = A가 V하게 만들다(5형식). happily = 부사: forcing", "how절 = 명사절(imagine의 목적어). 분사구문 안이라 괄호 처리. 간접의문문 어순(주어+동사)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 뒤에 분사구문 두 개가 이어지고 마지막에 의문사절까지 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: children (아이들). at play는 children을 꾸미는 전치사구 (놀고 있는)", "V: take on (take on 맡다. 구동사)", "O: other roles (다른 역할들)", "뼈대 = <b>children take on other roles</b>", "In addition = 게다가, often = 종종"]}, {"t": "<b>pretending to be Principal Walsh or Josh's mom</b>은 분사구문이다. 동시에 일어나는 일을 말한다.", "sub": ["pretend to be ~ = ~인 척하다. Principal 교장 선생님"]}, {"t": "<b>happily forcing themselves to imagine ~</b>도 분사구문이다. <b>force+O+to V</b>(5형식)가 쓰였다.", "sub": ["force A to V = A가 V하게 하다. themselves = children (아이들 자신)", "happily 기꺼이, imagine 상상하다"]}, {"t": "imagine의 목적어는 의문사절이다. <b>how someone else thinks and feels</b>는 '다른 사람이 어떻게 생각하고 느끼는지'라는 뜻이다. 간접의문문이라 how 뒤가 주어+동사 어순이다."}], "sum": "놀이 중 아이들은 다른 사람인 척하며 남의 생각과 감정을 상상하게 됨"}, {"i": "06", "q": "05", "s": "2", "title": "의문문 Could it mean ~? + that절 안 if조건절 삽입", "eng": "Could it mean<sup>1</sup> that, / if computers conclude<sup>2</sup> you won’t like something, / you will never get the chance to<sup>3</sup> see it?", "notes": [["1", "mean", "의미하다"], ["2", "conclude", "결론짓다"], ["3", "get the chance to V", "~할 기회를 얻다"]], "lit": "그것은 ~라는 뜻일 수 있지 않을까 / 만약 컴퓨터가 당신이 어떤 것을 좋아하지 않을 것이라고 결론짓는다면, / 당신은 그것을 볼 기회를 결코 얻지 못한다는.", "nat": "컴퓨터가 당신이 어떤 것을 좋아하지 않을 것이라고 결론지으면, 당신은 그것을 볼 기회를 영영 얻지 못한다는 뜻일 수도 있지 않을까?", "ana": "동사 <b>mean</b> 뒤의 <b>that</b>은 접속사이고, that절 전체가 mean의 <b>목적어</b>다. 그런데 that 바로 뒤에 목적어 절의 주어가 나오지 않고 <b>콤마 + if절</b>이 먼저 끼어든다. 이렇게 <b>접속사와 주어 사이에 조건절이 삽입되는</b> 구조는 자주 사람을 넘어뜨린다. 요령은 이렇다. that을 보면 그 뒤에서 <b>주어와 동사</b> 한 쌍을 먼저 찾아라. 여기서는 if절을 건너뛴 <b>you will never get</b>이 그 쌍이다. 그러면 '<b>~라는 뜻일 수 있다</b>'의 내용이 한눈에 잡힌다. if절 안의 <b>conclude</b> 뒤에도 접속사 that이 생략되어 있어(conclude <b>(that)</b> you won’t like something) 절이 하나 더 겹쳐 있다.", "pe": "Could it mean<sup>1</sup> that, / \u0001if computers conclude<sup>2</sup> you won’t like something\u0002, / you will \u0001never\u0002 get the chance \u0001to<sup>3</sup> see it\u0002?", "pk": "그것은 ~라는 뜻일 수 있지 않을까 / 만약 \u0001컴퓨터가 당신이 어떤 것을 좋아하지 않을 것이라고 결론짓는다면\u0002, / 당신은 \u0001그것을 볼\u0002 기회를 \u0001결코\u0002 얻지 못한다는.", "core": "그것은 당신이 그것을 볼 기회를 영영 얻지 못한다는 뜻일 수 있지 않을까?", "tags": ["주어 it + 동사 could mean(의문문 어순) + 목적어 that절. that절은 아래 덩어리들", "if절 = 부사절(조건): get을 꾸밈. conclude 뒤 that 생략: you won't like something", "that절 = 명사절(mean의 목적어) = 뼈대. 주어 you + will get + 목적어 chance. never = 부사: get 꾸밈. to see it = to부정사(형용사적): chance 꾸밈"], "steps": [{"t": "이 문장은 <b>의문문 S+V+O(3형식)</b>이다. 목적어 that절 안에 if절이 끼어들어 주절이 뒤로 밀려 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["V: Could mean (mean 의미하다. 의문문이라 Could가 it 앞에 나옴)", "S: it (그것)", "O: that절 (~라는 것)", "뼈대 = <b>Could it mean that ~?</b>"]}, {"t": "that절의 뼈대는 3형식이다.", "sub": ["S: you (당신)", "V: will never get (get 얻다)", "O: the chance (기회)", "that절 뼈대 = <b>you will never get the chance</b>"]}, {"t": "<b>to see it</b>은 chance를 꾸미는 to부정사(형용사적)이다. '그것을 볼'이라는 뜻이다. it은 something이다."}, {"t": "<b>if computers conclude you won't like something</b>은 that절 안에 끼어든 조건절이다.", "sub": ["conclude 결론짓다 (뒤에 that이 생략됨)", "you won't like something = 당신이 어떤 것을 좋아하지 않을 것이다"]}, {"t": "함정: that 바로 뒤에 콤마와 if절이 나와서 that절의 주어가 늦게 보인다. if절을 건너뛰고 you will never get을 찾는다."}], "sum": "컴퓨터가 싫어할 거라 판단한 것은 영영 볼 기회가 없다는 뜻일 수 있냐는 물음"}, {"i": "07", "q": "05", "s": "7", "title": "S+V+C(2형식, that절 보어) + 분사구문 leaving+O+C", "eng": "My worry originally<sup>1</sup> about such algorithms<sup>2</sup> was / that they might drive<sup>3</sup> everyone into certain<sup>4</sup> parts of the library, / leaving others lacking<sup>5</sup> listeners.", "notes": [["1", "originally", "원래, 애초에"], ["2", "algorithm", "알고리즘"], ["3", "drive A into B", "A를 B로 몰아넣다"], ["4", "certain", "특정한"], ["5", "lack", "~이 부족하다"]], "lit": "그런 알고리즘에 대한 나의 원래 걱정은 ~였다 / 그것들이 모든 사람을 서고의 특정 부분으로 몰아넣을지도 모른다는 것 / 나머지 부분은 청취자가 부족한 상태로 남겨 둔 채.", "nat": "그런 알고리즘에 대한 나의 원래 걱정은, 알고리즘이 모든 사람을 서고의 특정 부분으로만 몰아넣어 나머지 부분은 청취자가 없게 만들지도 모른다는 것이었다.", "ana": "was 뒤의 <b>that절</b>은 <b>주격보어</b>다. 'A는 B이다'의 B 자리에 문장 하나가 통째로 들어간 것이므로 '<b>~라는 것이었다</b>'로 마무리해야 한다. 이때 that은 <b>접속사</b>라서 뒤에 완전한 문장(they might drive ~)이 온다. 관계대명사 that과 갈리는 지점이 바로 이 <b>완전/불완전</b>이다. 콤마 뒤의 <b>leaving</b>은 앞에 이미 was와 might drive라는 동사가 있으므로 동사가 아니라 <b>분사구문</b>이고, 앞 내용의 <b>결과</b>를 이어 '<b>그리하여 ~한 상태로 남긴다</b>'로 읽는다. 그 안의 <b>leave + 목적어 + 분사</b>는 '<b>목적어를 ~한 상태로 두다</b>'라는 5형식이다. others가 스스로 부족한 것이므로 능동인 <b>lacking</b>이 왔다.", "pe": "My worry \u0001originally<sup>1</sup>\u0002 \u0001about such algorithms<sup>2</sup>\u0002 was / that they might drive<sup>3</sup> everyone \u0001into certain<sup>4</sup> parts of the library\u0002, / \u0001leaving others lacking<sup>5</sup> listeners\u0002.", "pk": "\u0001그런 알고리즘에 대한\u0002 나의 \u0001원래\u0002 걱정은 ~였다 / 그것들이 모든 사람을 \u0001서고의 특정 부분으로\u0002 몰아넣을지도 모른다는 것 / \u0001나머지 부분은 청취자가 부족한 상태로 남겨 둔 채\u0002.", "core": "나의 걱정은 그것들이 모든 사람을 서고의 특정 부분으로 몰아넣을지도 모른다는 것이었다.", "tags": ["주어 worry. originally = 부사: worry. about such algorithms = 전치사구(형용사구): worry를 꾸밈. 동사 was + 보어 that절", "that절 = 명사절(보어) = 뼈대. 주어 they + might drive + 목적어 everyone. into ~ library = 전치사구(부사구): drive 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "leaving A lacking ~ = 분사구문(부사적: 결과): that절 안 주절을 꾸밈. <b>leave A C</b>(5형식): A를 ~한 채로 두다"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 보어 that절 뒤에 분사구문이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: My worry (나의 걱정). originally(원래), about such algorithms(그런 알고리즘에 대한)는 worry를 꾸밈", "V: was (be동사)", "C: that절 (~라는 것)", "뼈대 = <b>My worry was that ~</b>"]}, {"t": "that절의 뼈대는 3형식이다.", "sub": ["S: they (그것들. such algorithms, 그런 알고리즘들)", "V: might drive (drive 몰아넣다. might는 ~할지도 모른다)", "O: everyone (모든 사람)", "that절 뼈대 = <b>they might drive everyone</b>", "into certain parts of the library = 서고의 특정 부분으로 (필수에 가까운 부사구. certain 특정한, library 서고, 도서관)"]}, {"t": "<b>leaving others lacking listeners</b>는 분사구문이다. 결과를 말한다. <b>leave+O+C</b>(5형식)가 쓰였다.", "sub": ["leave A lacking B = A가 B가 부족한 채로 두다", "others = 나머지 부분들. lack ~이 부족하다. listener 청취자"]}], "sum": "원래 걱정은 알고리즘이 모두를 서고의 일부로만 몰아 나머지를 청취자 없게 만들지도 모른다는 것"}, {"i": "08", "q": "06", "s": "3", "title": "가주어 It + 수동태 + 진주어 that절 + not A but B", "eng": "It must be emphasized<sup>1</sup>, however, / that tradition was not static<sup>2</sup>, / but constantly subject to<sup>3</sup> minute<sup>4</sup> variations / appropriate to people and their circumstances<sup>5</sup>.", "notes": [["1", "emphasize", "강조하다"], ["2", "static", "정적인, 고정된"], ["3", "be subject to", "~을 받기 쉽다"], ["4", "minute", "미세한, 아주 작은"], ["5", "circumstance", "환경, 상황"]], "lit": "그러나 강조되어야 한다 / 전통이 고정된 것이 아니었다는 점이, / 오히려 미세한 변화를 끊임없이 겪었다는 점이 / 사람과 그들의 상황에 맞는.", "nat": "그러나 전통은 고정된 것이 아니라 사람과 그들의 상황에 맞는 미세한 변화를 끊임없이 겪었다는 점이 강조되어야 한다.", "ana": "문장 맨 앞의 <b>It</b>은 '그것'이 아니라 <b>가주어</b>다. 진짜 주어는 뒤의 <b>that절</b> 전체이며, 이렇게 무거운 주어를 뒤로 보내는 것이 영어의 기본 습관이다. 해석은 반드시 <b>that절부터</b> 잡아 '~라는 점이 강조되어야 한다'로 되돌린다. that절 안의 뼈대는 <b>not A but B</b>다. A는 <b>static</b>, B는 <b>constantly subject to minute variations</b>인데, but 뒤에서 <b>was가 반복되지 않고 생략</b>되어 있어 구조가 잘 안 보인다. not A but B가 보이면 <b>강조는 언제나 B 쪽</b>이라는 점을 기억하자. 마지막 <b>appropriate to ~</b>는 앞의 variations를 뒤에서 꾸미는 <b>형용사구</b>로, variations <b>(that were)</b> appropriate to를 넣어 보면 확인된다.", "pe": "It must be emphasized<sup>1</sup>, \u0001however\u0002, / that tradition was not static<sup>2</sup>, / but \u0001constantly\u0002 subject \u0001to<sup>3</sup> minute<sup>4</sup> variations\u0002 / \u0001appropriate to people and their circumstances<sup>5</sup>\u0002.", "pk": "\u0001그러나\u0002 강조되어야 한다 / 전통이 고정된 것이 아니었다는 점이, / 오히려 \u0001미세한 변화를\u0002 \u0001끊임없이\u0002 겪었다는 점이 / \u0001사람과 그들의 상황에 맞는\u0002.", "core": "전통은 고정된 것이 아니라 미세한 변화를 끊임없이 겪었다는 점이 강조되어야 한다.", "tags": ["<b>가주어 It</b> + 동사 must be emphasized(수동태). however = 부사(삽입): 앞 내용과 대비", "that절 = <b>진주어</b>(명사절) = 뼈대. 주어 tradition + 동사 was + 보어 static. <b>not A but B</b> 구조", "but: not A but B의 B. constantly = 부사: subject 꾸밈. to ~ variations = 전치사구(부사구): subject 꾸밈 (subject to) [기준: 모양 규칙]", "appropriate to ~ = 형용사구: variations를 꾸밈"], "steps": [{"t": "이 문장은 <b>가주어 It + 수동태(1형식) + 진주어 that절</b>이다. 진짜 주어가 뒤의 긴 that절이라 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: It (가주어. 진짜 주어는 that절)", "V: must be emphasized (emphasize 강조하다의 수동태)", "진주어: that tradition was not static, but ~", "뼈대 = <b>It must be emphasized that ~</b>", "however = 그러나 (삽입 부사)"]}, {"t": "that절은 <b>not A but B</b> 구조의 S+V+C(2형식)이다.", "sub": ["S: tradition (전통), V: was (be동사)", "A: not static (고정된 것이 아닌. static 정지된, 고정된)", "B: constantly subject to minute variations (끊임없이 미세한 변화를 겪는). subject to ~ = ~을 받기 쉬운, 겪는", "constantly 끊임없이, minute 미세한, variation 변화"]}, {"t": "<b>appropriate to people and their circumstances</b>는 형용사구이다. variations를 뒤에서 꾸민다. '사람과 그들의 상황에 맞는'이라는 뜻이다. (appropriate 적절한, circumstance 상황)"}], "sum": "전통은 고정된 것이 아니라 사람과 상황에 맞는 미세한 변화를 계속 겪었다는 점이 강조되어야 함"}], "qs": [{"q": "01", "type": "필자의 주장", "src": "2014년 10월 19번", "ans": "④", "tr": [["1", "60세에 건강 상태가 꽤 괜찮은 사람들은 이제 30년 가까이 더 살 것으로 기대할 수 있다."], ["2", "생계를 꾸리고, 경력을 쌓고, 가족을 부양하는 부담이 이미 끝났기 때문에 이 시기는 그들 인생에서 가장 행복한 시절일 수 있다."], ["3", "근로자들은 늘 하고 싶었지만 주 40시간이 넘는 근무 때문에 결코 할 기회가 없었던 많은 일들을 하는 데 자신의 ‘황금기’를 쓸 수 있다."], ["4", "안타깝게도, 재정적 준비가 불충분하다면 이렇게 길어진 은퇴 기간의 비용은 문제를 일으킬 수 있다."], ["5", "그러므로 은퇴가 될 수 있는 최선의 모습이 되도록 보장하기 위해 은퇴 계획은 인생의 이른 시기에 시작되어야 한다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Therefore, a retirement plan needs to be set in motion at an early stage of life to assure that retirement is all that it can be."}, {"en": false, "h": "주장 문항은 <b>Therefore·So·Thus</b> 같은 결론 신호 뒤 문장이 정답인 경우가 압도적이다. 1~3번 문장은 은퇴 후 30년이 <b>얼마나 좋을 수 있는가</b>를 깔아 놓는 배경이다. 그러다 4번 문장에서 <b>Unfortunately</b>로 방향이 꺾이며 '<b>재정 준비가 부족하면(insufficient financial preparation)</b> 문제가 된다'는 걱정거리가 등장한다. 그리고 5번 문장이 <b>Therefore</b>로 결론을 낸다. <b>at an early stage of life</b>(인생의 이른 시기에)와 <b>retirement plan</b>(은퇴 계획)이 정답의 두 축이다. 즉 '<b>일찍부터</b>' '<b>재정적으로</b>' 준비하라는 말이므로 ④가 정확히 대응한다."}], "opts": [{"n": "①", "t": "삶의 질 향상을 위해 주당 근무 시간을 줄여야 한다.", "a": false, "x": true, "trap": false, "e": "3번 문장에 <b>40-plus-hour workweeks</b>가 나와서 그럴듯하지만, 그것은 과거에 하고 싶은 일을 못 했던 <b>이유</b>일 뿐이다. 근무 시간을 줄이라는 주장은 어디에도 없다."}, {"n": "②", "t": "은퇴 후에는 안정성에 바탕을 두고 자산을 관리해야 한다.", "a": false, "x": true, "trap": true, "e": "글은 은퇴 <b>후</b>의 자산 운용 방법이 아니라 은퇴 <b>전</b>에 준비를 시작하라는 이야기다. 시점이 정반대다."}, {"n": "③", "t": "노년의 건강한 삶을 위해 적절한 취미 활동을 찾아야 한다.", "a": false, "x": true, "trap": false, "e": "<b>in reasonably good health</b>는 조건을 나타내는 배경일 뿐이고, 취미(hobby·interest)라는 말은 나오지 않는다."}, {"n": "④", "t": "은퇴 후의 삶을 위해 일찍부터 재정적인 준비를 해야 한다.", "a": true, "x": false, "trap": false, "e": "4번 문장의 <b>insufficient financial preparation</b>과 5번 문장의 <b>at an early stage of life</b>를 그대로 합친 선지다."}, {"n": "⑤", "t": "고령화 사회에 진입함에 따라 근로자의 정년을 연장해야 한다.", "a": false, "x": true, "trap": false, "e": "수명이 늘었다는 사실은 1번 문장에 나오지만, 그로부터 <b>정년 연장(extend)</b>이라는 제도적 주장으로 넘어가지 않는다."}], "w": [["reasonably", "꽤, 상당히"], ["expect to V", "~할 것으로 기대하다"], ["earn a living", "생계를 꾸리다"], ["build a career", "경력을 쌓다"], ["raise a family", "가족을 부양하다"], ["golden years", "황금기, 노후"], ["opportunity", "기회"], ["workweek", "주당 근무 시간"], ["insufficient", "불충분한"], ["financial", "재정의, 금융의"], ["set in motion", "시작하다, 착수시키다"], ["assure", "보장하다, 확실하게 하다"]]}, {"q": "02", "type": "도표 불일치", "src": "2017학년도 수능 24번", "ans": "③", "tr": [["1", "위의 두 원그래프는 검색 엔진을 사용해 찾은 정보 중 얼마나 많은 것이 두 집단의 응답자들(AP와 NWP 교사, 그리고 미국 성인 검색 사용자)에 의해 2012년에 정확하거나 신뢰할 만하다고 여겨지는지를 보여 준다."], ["2", "① AP와 NWP 교사의 경우, 검색 엔진을 사용해 찾은 정보의 ‘모두 / 거의 모두’가 정확하거나 신뢰할 만하다고 말하는 사람은 5퍼센트인 반면, 미국 성인 검색 사용자는 28퍼센트가 같은 말을 한다."], ["3", "② AP와 NWP 교사와 미국 성인 검색 사용자 두 집단 모두에서 가장 큰 비율은 정보의 ‘대부분’이 정확하거나 신뢰할 만하다고 답한다."], ["4", "③ 게다가 AP와 NWP 교사의 40퍼센트는 정보의 ‘일부’가 정확하거나 신뢰할 만하다고 말하고, 미국 성인 검색 사용자도 30퍼센트가 넘는 비율이 같은 응답을 한다."], ["5", "④ 검색 엔진을 사용해 찾은 정보의 ‘아주 적은 부분 / 전혀 없음’이 정확하거나 신뢰할 만하다고 말하는 미국 성인 검색 사용자는 5퍼센트 미만을 차지한다."], ["6", "⑤ ‘모르겠다’고 답한 미국 성인 검색 사용자의 비율은 1퍼센트에 불과하다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "In addition, 40 percent of AP &amp; NWP teachers say that “Some” of the information is accurate or trustworthy, and more than 30 percent of U.S. adult search users respond the same."}, {"en": false, "h": "도표 문항은 <b>숫자 자체보다 숫자를 감싸는 표현</b>에서 함정이 난다. ‘Some’ 항목을 보면 AP·NWP 교사는 <b>40퍼센트</b>로 도표와 일치한다. 문제는 뒤쪽이다. 미국 성인 검색 사용자의 ‘Some’은 도표에서 <b>22퍼센트</b>인데, 선지는 <b>more than 30 percent</b>(30퍼센트가 넘는)라고 썼다. 22는 30보다 <b>작다</b>. <b>more than · less than · about · nearly</b> 같은 어구가 붙어 있으면 반드시 <b>부등호 방향</b>을 손으로 표시하며 확인해야 한다. 참고로 30퍼센트가 넘는 항목은 ‘Some’이 아니라 ‘All / Almost all’(28%)도 아닌 ‘Most’(45%)뿐이다."}], "opts": [{"n": "①", "t": "교사 5% vs 성인 28% — ‘모두/거의 모두’", "a": false, "x": true, "trap": false, "e": "도표에서 AP·NWP 교사의 ‘All / Almost all’은 <b>5%</b>, 미국 성인 사용자는 <b>28%</b>다. 두 숫자가 그대로 일치한다."}, {"n": "②", "t": "두 집단 모두 가장 큰 비율은 ‘대부분’", "a": false, "x": true, "trap": false, "e": "교사는 <b>55%</b>, 성인 사용자는 <b>45%</b>로 각 집단 안에서 ‘Most’가 가장 크다. both A and B로 묶은 서술이 맞다."}, {"n": "③", "t": "교사 40% ‘일부’ + 성인 사용자도 30% 넘음", "a": true, "x": false, "trap": false, "e": "성인 사용자의 ‘Some’은 <b>22%</b>다. <b>more than 30 percent</b>라는 서술이 도표와 어긋난다."}, {"n": "④", "t": "‘아주 적음/없음’ 성인 사용자 5% 미만", "a": false, "x": true, "trap": true, "e": "도표에서 해당 항목은 <b>4%</b>이므로 <b>less than five percent</b>가 맞다. 5%에 가까워 헷갈리지만 4는 5보다 작다."}, {"n": "⑤", "t": "‘모르겠다’ 성인 사용자 1%", "a": false, "x": true, "trap": false, "e": "도표의 ‘Don’t know’는 <b>1%</b>다. only one percent라는 표현까지 정확하다."}], "w": [["pie chart", "원그래프"], ["consider A to be B", "A를 B로 여기다"], ["accurate", "정확한"], ["trustworthy", "신뢰할 만한"], ["respondent", "응답자"], ["as for", "~에 관해서는"], ["while", "반면에"], ["the largest percentage", "가장 큰 비율"], ["in addition", "게다가, 또한"], ["respond", "응답하다"], ["account for", "차지하다"], ["less than", "~보다 적은"]]}, {"q": "03", "type": "글의 주제", "src": "2024학년도 6월 23번", "ans": "④", "tr": [["1", "박물관 안에는 눈에 보이지 않는 구역에서 일어나는 활동보다 전시실에서 일어나는 일을 더 강조하게 만드는 압박이 있다."], ["2", "박물관이 어쩔 수 없이 수입을 늘려야 하는 시대에, 그들은 종종 더 많은 관람객을 문 안으로 들이기 위해 갤러리를 현대화하거나 일시적인 전시회를 여는 데 힘을 쏟는다."], ["3", "다시 말해, 박물관이 경쟁적인 경제 속에서 살아남으려 애쓰면서, 그들의 예산은 자기 자신 중 소비 가능한 부분, 즉 전시실의 인포테인먼트와 카페·상점의 상품 및 서비스를 우선시하는 경우가 많다."], ["4", "불이 들어오지 않고 매력적이지 않은 저장실은, 설령 논의된다 해도, 기껏해야 전시실을 위해 물건을 처리하는 서비스 구역으로 제시된다."], ["5", "그리고 최악의 경우, 박물관이 대중에게 보이는 얼굴에 점점 더 많은 자원을 쏟아부으면서 저장 공간은 오히려 더 나빠질 수도 있다. 그 현대화는 보류되고, 늘어나는 소장품을 보관하고 복잡한 보존 요구를 충족시킬 공간은 점점 더 적게 주어지기 때문이다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "In other words, as museums struggle to survive in a competitive economy, their budgets often prioritise those parts of themselves that are consumable."}, {"en": false, "h": "주제 문항의 정답은 <b>글 전체를 관통하는 인과 관계</b>여야 한다. 이 글의 인과는 단순하다. 원인은 <b>수입을 늘려야 하는 압박</b>(2번 문장 increase their earnings, 3번 문장 competitive economy)이고, 결과는 <b>보이는 곳에만 예산이 쏠려 안 보이는 저장 공간이 희생된다</b>(4·5번 문장)는 것이다. 3번 문장의 <b>prioritise those parts that are consumable</b>이 그 연결 고리다. 즉 글은 박물관 운영이 <b>수익 중심</b>으로 기울면서 생기는 <b>결과</b>를 말하고 있으므로, consequences of <b>profit-oriented management</b>가 정확한 요약이다. 필자는 저장 공간을 늘리라고 <b>주장</b>하는 것이 아니라 현상을 <b>설명</b>하고 있다는 점도 함께 잡아야 한다."}], "opts": [{"n": "①", "t": "importance of prioritising museums’ exhibition spaces", "a": false, "x": true, "trap": false, "e": "박물관이 전시 공간을 우선시하는 것은 <b>사실</b>로 서술될 뿐, 필자가 그것이 <b>중요하다(importance)</b>고 옹호하는 것이 아니다. 오히려 그 부작용을 지적한다."}, {"n": "②", "t": "benefits of diverse activities in museums for audiences", "a": false, "x": true, "trap": false, "e": "관람객을 위한 다양한 활동의 <b>이익</b>은 화제가 아니다. 활동은 수입을 늘리기 위한 수단으로만 언급된다."}, {"n": "③", "t": "necessity of expanding storerooms for displaying objects", "a": false, "x": true, "trap": true, "e": "저장실이 홀대받는다는 서술은 있지만 <b>확장이 필요하다</b>는 주장으로 넘어가지 않는다. 또 저장실은 <b>전시(displaying)</b>를 위한 공간도 아니다."}, {"n": "④", "t": "consequences of profit-oriented management of museums", "a": true, "x": false, "trap": false, "e": "수입 압박(원인) → 보이는 곳 우선, 저장 공간 악화(결과)라는 글의 뼈대를 그대로 요약했다."}, {"n": "⑤", "t": "ways to increase museums’ commitment to the public good", "a": false, "x": true, "trap": false, "e": "공익에 대한 <b>헌신을 늘리는 방법(ways)</b>은 제시되지 않는다. 글은 해법이 아니라 현상 설명에서 끝난다."}], "w": [["emphasise", "강조하다"], ["unseen zone", "눈에 보이지 않는 구역"], ["be forced to V", "어쩔 수 없이 ~하게 되다"], ["earnings", "수입, 소득"], ["mount an exhibition", "전시회를 열다"], ["prioritise", "우선시하다"], ["consumable", "소비할 수 있는"], ["storeroom", "저장실, 창고"], ["at best", "기껏해야"], ["at worst", "최악의 경우"], ["on hold", "보류된, 연기된"], ["conservation", "보존, 보호"]]}, {"q": "04", "type": "어법", "src": "2017년 3월 28번", "ans": "④", "tr": [["1", "아이들의 공감 능력을 길러 주는 가장 단순하고 효과적인 방법 중 하나는 그들이 혼자서 더 많이 놀게 하는 것이다."], ["2", "감독을 받지 않는 아이들은 서로에게 자기가 어떻게 느끼는지 말하기를 꺼리지 않는다."], ["3", "게다가 놀고 있는 아이들은 종종 Walsh 교장 선생님이나 Josh의 엄마인 척하며 다른 역할을 맡고, 다른 사람이 어떻게 생각하고 느끼는지를 기꺼이 상상하게 된다."], ["4", "안타깝게도 자유로운 놀이는 드물어지고 있다."], ["5", "보스턴 대학의 연구 교수 Peter Gray는 지난 50년 동안 미국과 다른 선진국에서 아이들이 스스로 선택한 방식으로 놀고 탐구할 기회가 지속적으로, 그리고 궁극적으로 극적으로 감소해 왔음을 기록했다."], ["6", "그는 그 영향이 특히 공감 능력에 해를 끼쳐 왔다고 주장한다."], ["7", "그는 공감의 감소와 자아도취의 증가가 사회적으로 놀 기회가 거의 없는 아이들에게서 우리가 보게 되리라 예상하는 바로 그것이라고 결론짓는다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "The effects have been especially damaged, he argues, to empathy."}, {"en": false, "h": "밑줄 ④ 자리는 <b>have been</b> 뒤이므로 <b>과거분사(수동)</b>든 <b>현재분사(능동)</b>든 올 수 있다. 그래서 형태만 보고는 답이 안 나오고 <b>주어와의 관계</b>를 따져야 한다. 주어는 <b>The effects</b>(그 영향)이고 뒤에 <b>to empathy</b>(공감에)가 붙어 있다. 영향이 <b>피해를 입은</b> 것이 아니라 공감에 <b>피해를 준</b> function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);

  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}

function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;

    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}

래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">은퇴 후에는 안정성에 바탕을 두고 자산을 관리해야 한다.</span><span class=\"why\">[반대] 돈 얘기라 끌리지만 시점이 거꾸로예요. 5번은 은퇴 '후'가 아니라 at an early stage of life(인생의 이른 시기에) 미리 시작하라고 해요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">삶의 질 향상을 위해 주당 근무 시간을 줄여야 한다.</span><span class=\"why\">[지문에 없음] 3번의 40-plus-hour workweeks(주당 40시간이 넘는 근무)는 하고 싶은 걸 못 한 이유로만 나와요. 근무 시간을 줄이자는 말은 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">노년의 건강한 삶을 위해 적절한 취미 활동을 찾아야 한다.</span><span class=\"why\">[범위 좁음] 3번에 하고 싶던 일을 하는 황금기 얘기가 나오지만 배경일 뿐이에요. 필자가 시키는 건 취미가 아니라 돈 준비(financial preparation)예요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">고령화 사회에 진입함에 따라 근로자의 정년을 연장해야 한다.</span><span class=\"why\">[지문에 없음] 1번에 30년을 더 산다는 말은 있지만, 정년을 늘리자는 말은 한 번도 안 나와요. 해결책은 5번의 일찍 시작하는 은퇴 계획이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">People in reasonably good health</div><div class=\"k\">건강 상태가 꽤 괜찮은 사람들은</div></div><div class=\"rc\"><div class=\"e\">at the age of 60</div><div class=\"k\">60세에</div></div><div class=\"rc\"><div class=\"e\">can now expect to live</div><div class=\"k\">이제 살 것으로 기대할 수 있다</div></div><div class=\"rc\"><div class=\"e\">close to thirty more years.</div><div class=\"k\">거의 30년을 더.</div></div><div class=\"rnat\">나이 60세에 건강 상태가 꽤 괜찮은 사람들은 이제 거의 30년을 더 살 것으로 기대할 수 있다.</div><div class=\"rst\">방학이 아주 길어졌다고 생각해 봐요. = 지문 1번, 60세에 건강하면 이제 거의 30년을 더 산다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">These can be</div><div class=\"k\">이 시기(= 남은 30년)는 ~이 될 수 있다</div></div><div class=\"rc\"><div class=\"e\">the happiest years of their lives,</div><div class=\"k\">그들(= 60세에 건강한 사람들) 인생의 가장 행복한 세월,</div></div><div class=\"rc\"><div class=\"e\">since the pressures of earning a living,</div><div class=\"k\">왜냐하면 생계를 꾸리는 부담,</div></div><div class=\"rc\"><div class=\"e\">building a career, and raising a family</div><div class=\"k\">경력을 쌓고 가족을 부양하는 부담이</div></div><div class=\"rc\"><div class=\"e\">are behind them.</div><div class=\"k\">그들(= 이 사람들) 뒤에 있기(이미 끝났기) 때문이다.</div></div><div class=\"rnat\">생계를 꾸리고, 경력을 쌓고, 가족을 부양하는 부담을 뒤로 하게 되기 때문에, 이때(남은 30년)는 그들 인생의 가장 행복한 세월이 될 수 있다.</div><div class=\"rst\">숙제도 학원도 없는 방학이면 제일 신나겠죠. 지문 2번도 일과 가족 부양 부담이 끝나 <b>가장 행복한 세월</b>이 될 수 있다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Workers can use their “golden years”</div><div class=\"k\">근로자들은 그들의 ‘황금기(노후)’를 이용할 수 있다</div></div><div class=\"rc\"><div class=\"e\">to do many of the things</div><div class=\"k\">많은 것들을 하는 데</div></div><div class=\"rc\"><div class=\"e\">they had always hoped to do,</div><div class=\"k\">그들이 항상 하고 싶었던,</div></div><div class=\"rc\"><div class=\"e\">but never had the opportunity to do</div><div class=\"k\">하지만 해 볼 기회를 결코 갖지 못했던</div></div><div class=\"rc\"><div class=\"e\">because of their 40-plus-hour workweeks.</div><div class=\"k\">주당 40시간이 넘는 근무 시간 때문에.</div></div><div class=\"rnat\">근로자들은 항상 하고 싶었지만 주당 40시간이 넘는 근무 시간 때문에 해 볼 기회를 결코 가질 수 없었던 많은 것들을 하는 데 그들의 ‘황금기(노후)’를 이용할 수 있다.</div><div class=\"rst\">그동안 바빠서 못 한 게임, 여행을 실컷 할 수 있어요. = 지문 3번, 주 40시간 넘는 일 때문에 못 한 걸 노후에 한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Unfortunately,</span></div><div class=\"k\"><span class=\"cw\">불행히도,</span></div></div><div class=\"rc\"><div class=\"e\">the cost of these additional retirement years</div><div class=\"k\">이렇게 길어진 은퇴 기간의 비용은</div></div><div class=\"rc\"><div class=\"e\">can present a problem</div><div class=\"k\">문제를 일으킬 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\">if there is <span class=\"cw\">insufficient financial preparation</span>.</div><div class=\"k\"><span class=\"cw\">재정적 대비가 불충분하면</span>.</div></div><div class=\"rnat\">불행히도, 재정적 대비가 불충분하면 이렇게 길어진 은퇴 기간의 비용은 문제를 일으킬 수 있다.</div><div class=\"rst\"><b>그런데</b>(Unfortunately 불행히도) 용돈을 안 모아 두면 긴 방학 내내 아무것도 못 해요. 지문 4번도 <b>돈 준비가 부족하면</b> 문제라고 해요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Therefore,</span></div><div class=\"k\"><span class=\"cw\">그러므로,</span></div></div><div class=\"rc\"><div class=\"e\">a retirement plan needs to be set in motion</div><div class=\"k\">은퇴 계획은 시작될 필요가 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">at an early stage of life</span></div><div class=\"k\"><span class=\"cw\">인생의 이른 시기에</span></div></div><div class=\"rc\"><div class=\"e\">to assure that retirement is all that it can be.</div><div class=\"k\">은퇴가 그것(= 은퇴)이 될 수 있는 최선의 상태가 되도록 보장하기 위해.</div></div><div class=\"rnat\">그러므로, 은퇴가 최선의 상태가 되도록 보장하기 위해 은퇴 계획은 인생의 이른 시기에 시작될 필요가 있다.</div><div class=\"rst\"><b>그러니까</b>(Therefore 그러므로) 방학 한참 전부터 용돈을 모아야 해요. 지문 5번의 주장, 은퇴 계획은 <b>이른 시기에 시작</b>해야 한다는 거예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"earning a living\" data-m=\"생계를 꾸리는 것\"><b>earning a living</b>생계를 꾸리는 것</button><button type=\"button\" class=\"wdb\" data-w=\"golden years\" data-m=\"황금기, 노후\"><b>golden years</b>황금기, 노후</button><button type=\"button\" class=\"wdb\" data-w=\"workweeks\" data-m=\"주당 근무 시간\"><b>workweeks</b>주당 근무 시간</button><button type=\"button\" class=\"wdb\" data-w=\"insufficient\" data-m=\"불충분한\"><b>insufficient</b>불충분한</button><button type=\"button\" class=\"wdb\" data-w=\"financial\" data-m=\"재정의, 금융의\"><b>financial</b>재정의, 금융의</button><button type=\"button\" class=\"wdb\" data-w=\"set in motion\" data-m=\"시작하다, 착수 퍼센트), 성인은 28 percent(28퍼센트)로 도표 숫자 그대로예요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">두 집단 모두 가장 큰 비율은 ‘대부분’(Most)</span><span class=\"why\">3번 문장과 같아요. 두 원그래프 모두 가장 큰 조각이 ‘대부분’(Most) 칸이라 The largest percentage(가장 큰 비율)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">‘모르겠다’ 성인 사용자 1퍼센트(one percent)</span><span class=\"why\">6번 문장과 같아요. 성인의 ‘모르겠다’(Don't know) 칸은 only one percent(단지 1퍼센트)로 도표와 일치해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">The two pie charts above show</div><div class=\"k\">위에 있는 두 개의 원그래프는 보여 준다</div></div><div class=\"rc\"><div class=\"e\">how much of the information</div><div class=\"k\">정보 중 얼마나 많은 것이</div></div><div class=\"rc\"><div class=\"e\">found using search engines</div><div class=\"k\">검색 엔진을 사용해 찾은</div></div><div class=\"rc\"><div class=\"e\">is considered to be accurate or trustworthy</div><div class=\"k\">정확하거나 신뢰할 만하다고 여겨지는지</div></div><div class=\"rc\"><div class=\"e\">by two groups of respondents</div><div class=\"k\">두 집단의 응답자들에 의해</div></div><div class=\"rc\"><div class=\"e\">(AP &amp; NWP teachers and U.S. adult search users)</div><div class=\"k\">(AP와 NWP 교사들과 미국 성인 검색 사용자들)</div></div><div class=\"rc\"><div class=\"e\">in 2012.</div><div class=\"k\">2012년에.</div></div><div class=\"rnat\">위에 있는 두 개의 원그래프는 2012년에 검색 엔진을 사용해 찾은 정보 중 얼마나 많은 것이 두 집단의 응답자들(AP와 NWP 교사들과 미국 성인 검색 사용자들)에 의해 정확하거나 신뢰할 만하다고 여겨지는지 보여 준다.</div><div class=\"rst\">선생님들과 어른들에게 “인터넷 검색 정보, 얼마나 믿어요?” 하고 설문한 원그래프 두 개라고 생각해요. = 지문 1번, 두 집단의 응답을 보여 준다는 말이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">① As for AP &amp; NWP teachers,</div><div class=\"k\">① AP와 NWP 교사들의 경우,</div></div
