<!doctype html>
<html lang="ko">
<head>

<title>고3 미니모의고사 3회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}

.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}

.cell.bad{background:var(--badbg);border-color:var(--bad)}

.btn.pri{background:var(--accent);color:#fff}

.note-item{padding:14px 0;border-bottom:1px solid var(--line)}

.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}

.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}

.sub{color:var(--sub)}

.tool{display:flex;gap:8px;margin:2px 0 10px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}

.hcard .tx{flex:1;min-width:0}

details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}

.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}

/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}

.sc .lay{border-radius:10px}

.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}

.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}

.wds{display:flex;flex-wrap:wrap;gap:6px}

<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },gate:gate,flush:flush,name:name};
  flush();
})(window);

if(!WN.name())WN.gate(function(){location.reload()});

작곡가들은 전통을 이어가면서도(유산 안) 새롭고 독특한 무언가를 내놓으려 했습니다(유산 너머)", "글 전체의 흐름을 잘 담은 제목입니다."]}, {"n": "③", "t": "Classical Music: Healing the World", "g": "고전 음악: 세상을 치유하는 것", "ok": false, "e": ["고전 음악이 세상을 치유한다는 내용은 글에 없습니다."]}, {"n": "④", "t": "Lost in the Past: The End of Masterpieces", "g": "과거에서 길을 잃다: 걸작의 종말", "ok": false, "e": ["걸작이 끝났다는 내용은 없습니다", "오히려 (5)처럼 과거의 걸작들이 연주회장을 채웠고, (9)처럼 살아있는 작곡가들은 그 걸작들과 나란히 연주될 음악을 쓰려고 했습니다."]}, {"n": "⑤", "t": "Classical Composition in the Nineteenth Century", "g": "19세기의 고전 작곡", "ok": false, "e": ["글이 다루는 시기는 20세기 초입니다", "19세기 작곡가들은 레퍼토리의 일부로만 언급됩니다."]}], "tr": ["20세기로 접어들면서, 고전 음악 작품의 영구적인 레퍼토리가 피아노, 성악 또는 실내악 연주회에서 오페라와 오케스트라 연주회에 이르기까지 연주 음악의 거의 모든 분야를 지배했다.", "한 세기 이전으로부터의 (a)변화는 엄청났다.", "18세기에, 연주자들과 청자들은 항상 새로운 음악을 요구했고, ‘고대 음악’은 20년 이상 이전에 작곡된(작곡된 지 20년이 넘은) 무엇이든 포함했다.", "그러나 1900년대 초기의 음악가들과 청중들은 그들이 연주하거나 듣는 대부분의 연주 음악이 (작곡된 지) 적어도 한 세대(약 30년)는 되었을 것이라고 (b)기대했고, 그들은 레퍼토리에 이미 소중히 간직된 고전 음악이라는 기준으로(고전 음악을 기준으로 하여) 새로운 음악을 평가했다.", "본질적으로, 연주회장과 오페라 극장은 지난 200년 동안의 음악 작품을 보여주는 박물관이 되어 왔었다.", "그 레퍼토리는 연주 매체에 따라 그리고 지역마다 달랐지만, 그 핵심은 유럽과 아메리카 (지역) 대부분에 걸쳐서, 모차르트부터 베르디, 바그너, 그리고 비제에 이르는 오페라와 오페라 발췌곡, 하이든에서 후기 낭만파에 이르는 오케스트라와 실내악, 그리고 J. S. 바흐, 하이든, 모차르트, 베토벤 및 저명한 19세기 작곡가들에 의한 건반 음악을 포함하여 대체로 (c)같았다.", "살아있는 작곡가들은 점점 자신들이 과거의 음악과 경쟁하고 있다는 것을 알게 되었다.", "이것은 특히 세기의 전반부에, 고전적인 전통 안에서 근대 음악의 큰 주제인데, 즉 고전적인 걸작을 (d)무시했던(→ 애호했던) 연주자와 청자들의 관심을 (얻기) 위해서 과거의 작곡가들과 경쟁하며, 살아있는 작곡가들은 전통을 이어가면서도 새롭고 독특한 무언가를 제공함으로써 자신들을 위한 자리를 확보하기 위해 노력했다.", "그들(살아있는 작곡가들)은 개성과 혁신을 과거의 모방과 결합시켰는데, 독창적으로 여겨지면서 (e)이전 시대의 걸작들과 나란히 연주할 만한 음악을 작곡하기 위해 노력했다."], "ps": [{"n": 1, "ch": [{"e": "By the turn of the twentieth century,", "k": "20세기로 접어들면서,"}, {"e": "the permanent <b>repertoire<\/b> of musical classics", "k": "고전 음악 작품의 영구적인 레퍼토리가"}, {"e": "dominated almost every field of concert music,", "k": "연주 음악의 거의 모든 분야를 지배했다,"}, {"e": "from piano, song, or chamber music recitals", "k": "피아노, 성악 또는 실내악 연주회에서"}, {"e": "to operas and orchestral concerts.", "k": "오페라와 오케스트라 연주 : "in the classical tradition,", "k": "고전적인 전통 안에서"}, {"e": "especially in the first half of the century:", "k": "특히 세기의 전반부에:"}, {"e": "in competing with past composers", "k": "과거의 작곡가들과 경쟁하며"}, {"e": "for the attention of performers and listeners", "k": "연주자와 청자들의 관심을 (얻기) 위해서"}, {"e": "who (d) <b>loved<\/b> the classical masterworks,", "k": "고전적인 걸작을 (d) 애호했던, <span class=\"r\">※ 문제지엔 disregarded로 되어 있음<\/span>"}, {"e": "living composers sought to secure a place for themselves", "k": "살아있는 작곡가들은 자신들을 위한 자리를 확보하기 위해 노력했다"}, {"e": "by offering something new and <b>distinctive<\/b>", "k": "새롭고 독특한 무언가를 제공함으로써"}, {"e": "while continuing the tradition.", "k": "전통을 이어가면서도."}], "link": "이것은 특히 세기의 전반부에 고전적인 전통 안에서 근대 음악의 큰 주제인데, 즉 고전적인 걸작을 애호했던 연주자와 청자들의 관심을 얻기 위해서 과거의 작곡가들과 경쟁하며, 살아있는 작곡가들은 전통을 이어가면서도 새롭고 독특한 무언가를 제공함으로써 자신들을 위한 자리를 확보하기 위해 노력했다.", "easy": "이것이 특히 20세기 전반, 고전 전통 안에서 근대 음악의 큰 주제였어요. 고전 명곡을 아끼는 연주자와 청중의 관심을 얻으려고, 작곡가들은 전통을 이어 가면서도 새롭고 독특한 것을 내놓아 자기 자리를 만들려고 했어요.", "gist": "정답 근거예요. 전통 안에 머물면서도 새로움으로 그 너머를 찾으려 했다는 핵심 문장이에요."}, {"n": 9, "ch": [{"e": "They combined individuality and innovation", "k": "그들<span class=\"r\">(= 살아있는 작곡가들)<\/span>은 개성과 혁신을 결합시켰다"}, {"e": "with <b>emulation<\/b> of the past,", "k": "과거의 모방과,"}, {"e": "seeking to write music", "k": "음악을 작곡하기 위해 노력하면서"}, {"e": "that would be considered original", "k": "독창적으로 여겨질"}, {"e": "and worthy of performance", "k": "그리고 연주할 만한"}, {"e": "alongside the masterworks of (e) <b>earlier<\/b> times.", "k": "(e) 이전 시대의 걸작들과 나란히."}], "link": "그들은 개성과 혁신을 과거의 모방과 결합시켰는데, 독창적으로 여겨지면서 이전 시대의 걸작들과 나란히 연주할 만한 음악을 작곡하기 위해 노력했다.", "easy": "작곡가들은 자기만의 개성과 새로움을 과거를 본받는 것과 합쳐서, 독창적이면서도 옛 걸작들과 나란히 연주될 만한 음악을 쓰려고 했어요.", "gist": "전통과 새로움을 함께 담으려 한 작곡가들의 노력을 정리해요."}]}, {"no": "12", "typ": "장문 어휘", "src": "2019학년도 6월 42번", "evn": [8], "ev_en": "This is the great theme of modern music in the classical tradition, especially in the first half of the century: in competing with past composers for the attention of performers and listeners who (d) loved the classical masterworks, living composers sought to secure a place for themselves by offering something new and distinctive while continuing the tradition.", "ev_ko": [[8, "이것은 특히 세기의 전반부에, 고전적인 전통 안에서 근대 음악의 큰 주제인데, 즉 고전적인 걸작을 (d)무시했던(→ 애호했던) 연주자와 청자들의 관심을 (얻기) 위해서 과거의 작곡가들과 경쟁하며, 살아있는 작곡가들은 전통을 이어가면서도 새롭고 독특한 무언가를 제공함으로써 자신들을 위한 자리를 확보하기 위해 노력했다."]], "why": ["(8)은 살아있는 작곡가들이 연주자와 청자들의 관심을 얻으려고 과거의 작곡가들과 경쟁했다는 내용입니다", "연주자와 청자들이 고전 걸작을 무시했다면, 작곡가들이 과거의 작곡가들과 경쟁할 필요가 없었을 것입니다", "그래서 (d)는 disregarded(무시했던)가 아니라 loved(애호했던)처럼 좋아한다는 뜻의 말이어야 하고, 정답은 ④입니다."], "ch": [{"n": "①", "t": "(a) change", "g": "변화", "ok": false, "e": ["(3)에서 18세기에는 늘 새로운 음악을 요구했고, (4)에서 1900년대 초에는 오래된 음악을 기대했습니다", "태도가 크게 바뀌었으므로 '변화'가 엄청났다는 말이 알맞습니다."]}, {"n": "②", "t": "(b) expected", "g": "기대했다", "ok": false, "e": ["(4)에서 그들은 이미 레퍼토리에 자리 잡은 고전 음악을 기준으로 새 음악을 평가했습니다", "그러니 연주 음악 대부분이 적어도 한 세대는 된 것이리라 '기대했다'는 말이 자연스럽습니다."]}, {"n": "③", "t": "(c) same", "g": "같은", "ok": false, "e": ["(6)에서 레퍼토리는 연주 매체와 지역에 따라 달랐지만(but) 그 핵심은 대체로 '같았다'는 대조가 자연스럽습니다", "이어서 공통 핵심인 작곡가들의 음악이 나열됩니다."]}, {"n": "④", "t": "(d) disregarded", "g": "무시했다", "ok": true, "e": ["연주자와 청자들이 고전 걸작을 무시했다면 살아있는 작곡가들이 과거의 작곡가들과 경쟁할 이유가 없습니다", "disregarded가 아니라 loved(애호했던)처럼 좋아한다는 뜻의 말이 와야 합니다."]}, {"n": "⑤", "t": "(e) earlier", "g": "이전의", "ok": false, "e": ["(9)에서 작곡가들은 '이전' 시대의 걸작들과 나란히 연주될 만한 음악을 쓰려고 했습니다", "과거의 걸작과 경쟁한다는 흐름에 맞습니다."]}], "tr": ["20세기로 접어들면서, 고전 음악 작품의 영구적인 레퍼토리가 피아노, 성악 또는 실내악 연주회에서 오페라와 오케스트라 연주회에 이르기까지 연주 음악의 거의 모든 분야를 지배했다.", "한 세기 이전으로부터의 (a)변화는 엄청났다.", "18세기에, 연주자들과 청자들은 항상 새로운 음악을 요구했고, ‘고대 음악’은 20년 이상 이전에 작곡된(작곡된 지 20년이 넘은) 무엇이든 포함했다.", "그러나 1900년대 초기의 음악가들과 청중들은 그들이 연주하거나 듣는 대부분의 연주 음악이 (작곡된 지) 적어도 한 세대(약 30년)는 되었을 것이라고 (b)기대했고, 그들은 레퍼토리에 이미 소중히 간직된 고전 음악이라는 기준으로(고전 음악을 기준으로 하여) 새로운 음악을 평가했다.", "본질적으로, 연주회장과 오페라 극장은 지난 200년 동안의 음악 작품을 보여주는 박물관이 되어 왔었다.", "그 레퍼토리는 연주 매체에 따라 그리고 지역마다 달랐지만, 그 핵심은 유럽과 아메리카 (지역) 대부분에 걸쳐서, 모차르트부터 베르디, 바그너, 그리고 비제에 이르는 오페라와 오페라 발췌곡, 하이든에서 후기 낭만파에 이르는 오케스트라와 실내악, 그리고 J. S. 바흐, 하이든, 모차르트, 베토벤 및 저명한 19세기 작곡가들에 의한 건반 음악을 포함하여 대체로 (c)같았다.", "살아있는 작곡가들은 점점 자신들이 과거의 음악과 경쟁하고 있다는 것을 알게 되었다.", "이것은 특히 세기의 전반부에, 고전적인 전통 안에서 근대 음악의 큰 주제인데, 즉 고전적인 걸작을 (d)무시했던(→ 애호했던) 연주자와 청자들의 관심을 (얻기) 위해서 과거의 작곡가들과 경쟁하며, 살아있는 작곡가들은 전통을 이어가면서도 새롭고 독특한 무언가를 제공함으로써 자신들을 위한 자리를 확보하기 위해 노력했다.", "그들(살아있는 작곡가들)은 개성과 혁신을 과거의 모방과 결합시켰는데, 독창적으로 여겨지면서 (e)이전 시대의 걸작들과 나란히 연주할 만한 음악을 작곡하기 위해 노력했다."], "ps": [{"n": 1, "ch": [{"e": "By the turn of the twentieth century,", "k": "20세기로 접어들면서,"}, {"e": "the permanent <b>repertoire<\/b> of musical classics", "k": "고전 음악 작품의 영구적인 레퍼토리가"}, {"e": "dominated almost every field of concert music,", "k": "연주 음악의 거의 모든 분야를 지배했다,"}, {"e": "from piano, song, or chamber music recitals", "k": "피아노, 성악 또는 실내악 연주회에서"}, {"e": "to operas and orchestral concerts.", "k": "오페라와 오케스트라 연주회에 이르기까지."}], "link": "20세기로 접어들면서, 고전 음악 작품의 영구적인 레퍼토리가 피아노, 성악 또는 실내악 연주회에서 오페라와 오케스트라 연주회에 이르기까지 연주 음악의 거의 모든 분야를 지배했다.", "easy": "20세기 초가 되자, 늘 연주되는 고전 명곡 목록이 피아노 연주회부터 오페라까지 거의 모든 연주 음악을 차지했어요.", "gist": "글의 배경이에요. 20세기 초에는 고전 명곡이 연주 음악을 지배했어요."}, {"n": 2, "ch": [{"e": "The (a) <b>change<\/b>", "k": "(a) 변화는"}, {"e": "from a century before", "k": "한 세기 이전으로부터의"}, {"e": "was enormous.", "k": "엄청났다."}], "easy": "100년 전과 비교하면 엄청나게 달라진 거예요.", "gist": "12번 (a) 자리예요. 앞뒤 시대가 크게 달랐다는 말이에요."}, {"n": 3, "ch": [{"e": "In the eighteenth century,", "k": "18세기에,"}, {"e": "performers and listeners demanded new music", "k": "연주자들과 청자들은 새로운 음악을 요구했다"}, {"e": "all the time,", "k": "항상,"}, {"e": "and “ancient music” included anything", "k": "그리고 ‘고대 음악’은 무엇이든 포함했다"}, {"e": "written more than twenty years earlier.", "k": "20년 이상 이전에 작곡된."}], "link": "18세기에, 연주자들과 청자들은 항상 새로운 음악을 요구했고, ‘고대 음악’은 20년 이상 이전에 작곡된 무엇이든 포함했다.", "easy": "18세기에는 사람들이 늘 새 음악을 원했고, 작곡된 지 20년만 넘어도 '고대 음악'이라고 불렀어요.", "gist": "과거(18세기)의 모습이에요. 새 음악이 중심이었어요."}, {"n": 4, "ch": [{"e": "But musicians and audiences in the early 1900s", "k": "그러나 1900년대 초기의 음악가들과 청중들은"}, {"e": "(b) <b>expected<\/b function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

ts<sup>1</sup> suggest / that animals, just like humans, tend to prefer exaggerated<sup>2</sup>, supernormal<sup>3</sup> stimuli<sup>4</sup>, / and that a preference can rapidly propel itself to extreme levels (peak shift effect).", "notes": [["1", "experiment", "실험"], ["2", "exaggerated", "과장된"], ["3", "supernormal", "초정상의"], ["4", "stimulus", "자극"]], "lit": "실험들은 시사한다 / 동물도 인간과 꼭 마찬가지로 과장된, 초정상적인 자극을 선호하는 경향이 있다는 것을, / 그리고 그 선호가 스스로를 빠르게 극단적인 수준까지 몰아갈 수 있다는 것을(정점 이동 효과).", "nat": "실험들에 따르면 동물도 인간과 마찬가지로 과장되고 정상을 넘어선 자극을 선호하는 경향이 있으며, 그 선호는 스스로를 빠르게 극단적인 수준까지 밀어붙일 수 있다(정점 이동 효과).", "ana": "동사 <b>suggest</b>의 목적어로 <b>that절이 두 개</b> 걸려 있다. 두 번째 that을 생략하지 않고 <b>and that</b>으로 분명히 밝혀 준 덕분에 병렬 구조가 눈에 보인다. 이렇게 and 뒤에 that이 또 나오면 '앞의 동사에 목적어가 하나 더 걸린다'는 신호로 읽으면 된다. <b>propel itself to ~</b>는 '스스로를 ~까지 몰아가다'로, 재귀대명사가 주어와 같은 대상을 가리킨다.", "pe": "Experiments<sup>1</sup> suggest / that animals, \u0001just like humans\u0002, tend to prefer \u0001exaggerated<sup>2</sup>, supernormal<sup>3</sup>\u0002 stimuli<sup>4</sup>, / and that a preference can \u0001rapidly\u0002 propel itself to extreme levels (peak shift effect).", "pk": "실험들은 시사한다 / 동물도 \u0001인간과 꼭 마찬가지로\u0002 \u0001과장된, 초정상적인\u0002 자극을 선호하는 경향이 있다는 것을, / 그리고 그 선호가 스스로를 \u0001빠르게\u0002 극단적인 수준까지 몰아갈 수 있다는 것을(정점 이동 효과).", "core": "실험들은 동물이 자극을 선호하는 경향이 있고, 선호가 극단적 수준까지 갈 수 있음을 시사한다.", "tags": ["주어 Experiments + 동사 suggest: 목적어 that절이 두 개 옴", "<b>that절 ①</b>: suggest의 목적어. just like humans는 삽입. tend to V = ~하는 경향이 있다", "<b>and that</b>: 두 번째 목적어절 (병렬). propel itself = 스스로를 몰아가다"]}, {"i": "07", "q": "11", "s": "A-4", "title": "expected의 목적어 that절 + 관계대명사 생략 + 과거분사 enshrined", "eng": "But musicians and audiences<sup>1</sup> in the early 1900s expected / that most concert music<sup>2</sup> they performed or heard would be at least a generation<sup>3</sup> old, / and they judged<sup>4</sup> new music / by the standards of the classics already enshrined in the repertoire.", "notes": [["1", "audience", "청중"], ["2", "concert music", "연주회 음악"], ["3", "generation", "세대"], ["4", "judge", "평가하다"]], "lit": "그러나 1900년대 초의 음악가와 청중은 기대했다 / 자신들이 연주하거나 듣는 연주회 음악 대부분이 적어도 한 세대는 묵은 것이리라고, / 그리고 그들은 새로운 음악을 평가했다 / 이미 레퍼토리 안에 소중히 자리 잡은 명곡들의 기준으로.", "nat": "그러나 1900년대 초의 음악가와 청중은 자신들이 연주하거나 듣는 연주회 음악 대부분이 적어도 한 세대는 지난 것이리라 여겼고, 이미 레퍼토리에 소중히 자리 잡은 명곡의 기준으로 새 음악을 평가했다.", "ana": "<b>expected</b>의 목적어인 that절 안에서, 주어 <b>most concert music</b> 뒤에 <b>(which) they performed or heard</b>가 관계대명사가 생략된 채 붙어 있다. 명사 뒤에 곧바로 '주어+동사'가 나오면 목적격 관계대명사가 생략된 자리라고 보면 된다. 절의 동사는 한참 뒤의 <b>would be</b>이다. 마지막의 <b>enshrined</b>는 과거분사로 the classics를 뒤에서 꾸미며 '<b>소중히 간직된</b>'이라는 수동의 뜻을 갖는다.", "pe": "But musicians and audiences<sup>1</sup> \u0001in the early 1900s\u0002 expected / that most concert music<sup>2</sup> \u0001they performed or heard\u0002 would be \u0001at least a generation<sup>3</sup>\u0002 old, / and they judged<sup>4</sup> new music / \u0001by the standards of the classics \u0001already enshrined in the repertoire\u0002\u0002.", "pk": "그러나 \u00011900년대 초의\u0002 음악가와 청중은 기대했다 / \u0001자신들이 연주하거나 듣는\u0002 연주회 음악 대부분이 \u0001적어도 한 세대는\u0002 묵은 것이리라고, / 그리고 그들은 새로운 음악을 평가했다 / \u0001\u0001이미 레퍼토리 안에 소중히 자리 잡은\u0002 명곡들의 기준으로\u0002.", "core": "음악가와 청중은 대부분의 연주회 음악이 오래된 것이리라 기대했고, 새 음악을 평가했다.", "tags": ["주어 musicians and audiences + 동사 expected. in the early 1900s는 시간 부사구", "<b>목적어 that절</b>. (which) they performed or heard는 <b>관계대명사 생략</b>. 동사는 would be", "<b>and they judged</b>: expected와 병렬되는 동사 (주어 they)", "<b>by the standards of ~</b>: 평가 기준. 과거분사 enshrined는 the classics를 꾸밈"]}, {"i": "08", "q": "11", "s": "B-3", "title": "분사구문(seeking) + 관계대명사 that + 형용사 병렬(original / worthy)", "eng": "They combined<sup>1</sup> individuality<sup>2</sup> and innovation<sup>3</sup> with emulation<sup>4</sup> of the past, / seeking to write music / that would be considered original and worthy of performance / alongside the masterworks of earlier times.", "notes": [["1", "combine", "결합하다"], ["2", "individuality", "개성"], ["3", "innovation", "혁신"], ["4", "emulation", "경쟁적 모방"]], "lit": "그들은 개성과 혁신을 과거에 대한 경쟁적 모방과 결합했다, / 음악을 쓰고자 애쓰면서 / 독창적이고 연주할 만한 가치가 있다고 여겨질 / 이전 시대의 걸작들과 나란히.", "nat": "그들은 개성과 혁신을 과거에 대한 경쟁적 모방과 결합해, 이전 시대의 걸작들과 나란히 놓여도 독창적이고 연주할 가치가 있다고 평가받을 음악을 쓰려고 애썼다.", "ana": "<b>combine A with B</b>는 'A를 B와 결합하다'로, A 자리에 individuality and innovation 두 개가 들어가 있다. 콤마 뒤의 <b>seeking</b>은 주어 They가 그대로 이어지는 <b>분사구문</b>이며 '~하면서, ~하려고 애쓰면서'로 읽는다. 뒤의 <b>that</b>은 music을 꾸미는 주격 관계대명사이고, 그 안에서 <b>be considered</b>의 보어로 형용사 <b>original</b>과 <b>worthy of performance</b>가 나란히 걸린다.", "pe": "They combined<sup>1</sup> individuality<sup>2</sup> and innovation<sup>3</sup> with emulation<sup>4</sup> \u0001of the past\u0002, / \u0001seeking to write music\u0002 / \u0001that would be considered original and worthy of performance\u0002 / \u0001alongside the masterworks \u0001of earlier times\u0002\u0002.", "pk": "그들은 개성과 혁신을 \u0001과거에 대한\u0002 경쟁적 모방과 결합했다, / \u0001음악을 쓰고자 애쓰면서\u0002 / \u0001독창적이고 연주할 만한 가치가 있다고 여겨질\u0002 / \u0001\u0001이전 시대의\u0002 걸작들과 나란히\u0002.", "core": "그들은 개성과 혁신을 모방과 결합했다.", "tags": ["주어 + 동사 + 목적어. <b>combine A with B</b>: A = individuality and innovation", "<b>분사구문</b>: 주어 They가 그대로 이어짐 (~하려고 애쓰면서)", "<b>관계절 that</b>: music을 꾸밈. be considered의 보어 original / worthy 병렬", "부사구: 걸작들과 나란히"]}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2022년 10월 31번", "ans": "②", "tr": [["1", "우리가 정치적 위험이라고 부르는 것의 상당 부분은 사실상 불확실성이다."], ["2", "이는 내란에서 몰수, 규제 변화에 이르기까지 모든 종류의 정치적 위험에 적용된다."], ["3", "정치적 위험은 신용·시장·운영 위험과 달리 비체계적일 수 있어서, 고전적인 통계 방식으로 다루기가 더 어렵다."], ["4", "테러리스트가 미국을 다시 공격할 확률은 얼마인가?"], ["5", "지진이나 허리케인과 달리, 정치 행위자들은 위험 관리자들이 세워 놓은 장벽을 넘으려고 끊임없이 적응한다."], ["6", "기업들이 국제적 보증이나 법적 계약을 통해 몰수 위험을 줄이려고 해외 투자를 설계하면, 유치국 정부는 서서히 진행되는 몰수나 규제 차별처럼 입증하기가 매우 어렵고 법적 비용도 큰 새로운 방해 수단을 찾아낸다."], ["7", "위험을 관찰하는 행위 자체가 그 위험을 바꿔 놓는다."], ["8", "파급력이 크고 확률이 낮은 사건을 완화할 방법은 있다."], ["9", "그러나 이런 위험에 대한 분석은 과학인 만큼이나 예술일 수 있다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Unlike earthquakes or hurricanes, political actors constantly adapt to overcome the barriers created by risk managers. … Observation of a risk changes the risk itself."}, {"en": false, "h": "빈칸이 <b>첫 문장</b>에 있으면 뒤에 이어지는 근거들을 모아 한 단어로 요약해야 한다. 이 글의 근거는 세 갈래다. ① 정치적 위험은 <b>비체계적</b>이라 통계로 다루기 어렵다 ② 지진과 달리 정치 행위자는 <b>계속 적응해</b> 예측을 무너뜨린다 ③ <b>관찰하는 순간 위험 자체가 변한다</b>. 셋 다 '<b>예측이 안 된다</b>'로 모이므로 빈칸은 <b>uncertainty</b>이다."}], "opts": [{"n": "①", "t": "injustice (불의)", "a": false, "x": true, "trap": false, "e": "몰수나 규제 차별이 나오지만 글은 그것이 <b>부당한가</b>를 따지지 않는다. 예측 가능성만 문제 삼는다."}, {"n": "②", "t": "uncertainty (불확실성)", "a": true, "x": false, "trap": false, "e": "unsystematic, constantly adapt, Observation of a risk changes the risk itself, low-probability가 모두 '<b>확률을 못 박을 수 없다</b>'는 한 방향을 가리킨다."}, {"n": "③", "t": "circularity (순환성)", "a": false, "x": true, "trap": true, "e": "'관찰이 위험을 바꾼다'를 순환 논리로 오해하기 쉽지만, 그것은 순환이 아니라 <b>측정이 대상을 바꾼다</b>는 불확실성의 사례다."}, {"n": "④", "t": "contradiction (모순)", "a": false, "x": true, "trap": false, "e": "서로 어긋나는 두 진술이 맞부딪히는 장면은 글에 없다. 기업과 정부의 대응은 모순이 아니라 <b>줄다리기</b>다."}, {"n": "⑤", "t": "miscommunication (의사소통의 오류)", "a": false, "x": true, "trap": false, "e": "소통이 잘못돼서 생기는 문제라는 이야기는 전혀 없다. 소재 자체가 다르다."}], "w": [["apply to", "~에 적용되다"], ["civil strife", "내란"], ["expropriation", "몰수"], ["regulatory", "규제의"], ["unsystematic", "비체계적인"], ["address", "다루다, 대처하다"], ["probability", "확률"], ["adapt", "적응하다"], ["mitigate", "줄이다, 완화하다"], ["obstruction", "방해, 저지"], ["discrimination", "차별"], ["prove", "입증하다"]]}, {"q": "08", "type": "빈칸 추론", "src": "2021년 10월 32번", "ans": "②", "tr": [["1", "건강 영역에서는 '구매' 이후의 실행에 대한 관심이 구매 자체에 대한 관심만큼이나, 아니 그보다 더 중요하다."], ["2", "질병 검진을 받아들여 절차를 다 거치고도 진단받은 병에 대한 치료를 끝까지 이어 가지 않는 사람은, 애초에 검진을 받지 않은 사람과 똑같이 실패한 것이다."], ["3", "의학적으로 처방된 식이 요법을 하기로 설득되었지만 일주일 만에 사탕 단지와 애플파이로 되돌아가 버린 비만인 사람은, 애초에 체중을 줄이고 관리할 필요를 전혀 납득하지 못했던 것과 마찬가지로 실패한 것이다."], ["4", "가장 도전적이고 가장 어렵고 가장 난감한 문제는, 사람들에게 건강에 도움이 되는 실천을 받아들이게 하는 방법도 아니고 심지어 그 실천을 시작하게 만드는 방법도 아니다."], ["5", "이 부분에서 우리는 꽤 성공적이었다."], ["6", "그 문제는 바로 새로운 실천을 계속 이어 가도록 설득하고 도와주는 일이다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "The person who is sold on and goes through disease screening procedures but does not follow through with medical treatment … is as much of a failure"}, {"en": false, "h": "빈칸이 <b>마지막 문장</b>에 있으면 앞의 사례들이 공통으로 가리키는 지점을 찾는다. 두 사례 모두 '<b>시작은 했는데 이어 가지 못했다</b>'는 구조다(검진은 받았지만 치료를 안 함 / 다이어트는 시작했지만 일주일 만에 포기). 게다가 바로 앞 문장이 '설득하는 법도, 시작하게 하는 법도 아니다'라고 후보를 지워 준다. 남는 것은 <b>지속</b>뿐이다."}], "opts": [{"n": "①", "t": "맹점을 발견하도록", "a": false, "x": true, "trap": false, "e": "사람들이 무엇을 <b>모르고 있다</b>는 이야기가 아니다. 알면서도 이어 가지 못하는 것이 문제다."}, {"n": "②", "t": "새로운 실천을 계속 이어 가도록", "a": true, "x": false, "trap": false, "e": "follow through와 lured back after one week이라는 두 실패 사례가 모두 <b>지속의 실패</b>다. 앞 문장이 '설득'과 '시작'을 이미 지워 놓았다."}, {"n": "③", "t": "안전감을 형성하도록", "a": false, "x": true, "trap": false, "e": "'안심시킨다'는 이야기는 어디에도 없다. 감정이 아니라 <b>행동의 지속</b>이 주제다."}, {"n": "④", "t": "불필요한 치료를 피하도록", "a": false, "x": true, "trap": true, "e": "오히려 <b>필요한 치료를 끝까지 받지 않는 것</b>이 문제다. 방향이 정반대다."}, {"n": "⑤", "t": "새로운 해결책을 떠올리도록", "a": false, "x": true, "trap": false, "e": "새 해결책을 만들라는 말은 없다. 이미 있는 실천을 <b>계속하라</b>는 것이다."}], "w": [["concern", "관심, 우려"], ["critical", "중대한, 결정적인"], ["be sold on", "~에 설득되어 받아들이다"], ["go through", "(절차를) 거치다"], ["follow through with", "~을 끝까지 해내다"], ["diagnosed", "진단받은"], ["avail oneself of", "~을 이용하다"], ["to begin with", "애초에"], ["obese", "비만인"], ["be lured back to", "~로 다시 유인되다"], ["perplexing", "난감한"], ["initiate", "시작하다"]]}, {"q": "09", "type": "문장 삽입", "src": "2019학년도 수능 38번", "ans": "③", "tr": [["1", "인쇄기는 생각이 스스로를 복제하는 힘을 끌어올렸다."], ["2", "값싼 인쇄가 등장하기 전에는 생각이 입에서 입으로 퍼질 수 있었고 실제로 그렇게 퍼졌다."], ["3", "이 방식은 엄청나게 강력하긴 했지만, 전파될 수 있는 생각의 복잡성을 한 사람이 기억할 수 있는 수준으로 제한해 버렸다. (①)"], ["4", "게다가 그 방식에는 일정 정도의 오류가 반드시 끼어들었다. (②)"], ["5", "입소문을 통한 생각의 전파는 전 지구적 규모의 말 전달 놀이나 마찬가지였다. (③)"], ["6", "[주어진 문장] 문자 해득력의 출현과 손으로 쓴 두루마리, 그리고 마침내 손으로 쓴 책의 등장은 크고 복잡한 생각이 높은 충실도로 퍼져 나갈 수 있는 능력을 강화했다."], ["7", "그러나 두루마리나 책을 손으로 베끼는 데 드는 엄청난 시간은 이 방식으로 정보가 퍼질 수 있는 속도를 제한했다. (④)"], ["8", "잘 훈련된 수도사라 해도 하루에 네 쪽 정도를 필사할 수 있었다. (⑤)"], ["9", "인쇄기는 정보를 수천 배 빠르게 복제할 수 있었고, 그 덕분에 지식은 완전한 충실도를 유지한 채 그 어느 때보다 훨씬 빠르게 퍼져 나갈 수 있었다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "But the incredible amount of time required to copy a scroll or book by hand limited the speed …"}, {"en": false, "h": "삽입 문항은 <b>대명사·연결어의 짝</b>을 본다. 주어진 문장은 <b>문자와 필사본</b>이 등장해 충실도가 높아졌다는 내용이다. ③ 앞까지는 <b>입소문(word of mouth)</b>의 한계만 이야기하고, ③ 뒤 문장은 갑자기 <b>But the incredible amount of time required to copy a scroll or book by hand</b>로 시작한다. 앞에 '두루마리와 책'이 한 번도 나오지 않았다면 이 But이 성립하지 않는다. 즉 ③ 자리에 필사본 이야기가 먼저 들어와야 한다."}], "opts": [{"n": "①", "t": "①번 자리", "a": false, "x": true, "trap": false, "e": "① 앞뒤는 '입소문으로 퍼졌다 → 그래서 복잡성이 제한되었다'로 자연스럽게 이어진다. 문자 이야기를 끼울 자리가 아니다."}, {"n": "②", "t": "②번 자리", "a": false, "x": true, "trap": false, "e": "② 앞뒤는 입소문의 두 가지 한계(복잡성 제한 · 오류 누적)를 나란히 든다. 사이를 끊으면 It also added의 also가 갈 곳을 잃는다."}, {"n": "③", "t": "③번 자리", "a": true, "x": false, "trap": false, "e": "뒤 문장의 <b>a scroll or book</b>과 <b>But</b>이 주어진 문장의 handwritten scrolls and books를 받는다. 입소문의 한계 → 필사본의 등장 → 그러나 필사는 느리다, 로 흐름이 맞물린다."}, {"n": "④", "t": "④번 자리", "a": false, "x": true, "trap": true, "e": "④ 앞은 필사 속도의 한계, 뒤는 그 구체적 수치(하루 네 쪽)다. 사이에 '필사본이 등장했다'를 넣으면 순서가 거꾸로 된다."}, {"n": "⑤", "t": "⑤번 자리", "a": false, "x": true, "trap": false, "e": "⑤ 뒤는 인쇄기가 그 한계를 깨뜨렸다는 결론이다. 결론 직전에 필사본의 등장을 다시 꺼내면 흐름이 끊긴다."}], "w": [["advent", "출현, 도래"], ["literacy", "문자 해득력"], ["scroll", "두루마리"], ["fidelity", "충실(도)"], ["boost", "끌어올리다"], ["prior to", "~ 이전에"], ["word of mouth", "입소문, 구전"], ["propagate", "전파하다"], ["equivalent to", "~와 마찬가지인"], ["transcribe", "필사하다"], ["monk", "수도사"], ["thousands of times", "수천 배"]]}, {"q": "10", "type": "요약문", "src": "2023년 4월 40번", "ans": "①", "tr": [["1", "실험들에 따르면 동물도 인간과 마찬가지로 과장되고 정상을 넘어선 자극을 선호하는 경향이 있으며, 그 선호는 스스로를 빠르게 극단적인 수준까지 밀어붙일 수 있다(정점 이동 효과)."], ["2", "한 실험에서 쥐들은 먹이 보상을 통해 다른 기하학적 형태보다 정사각형을 선호하도록 조건화되었다."], ["3", "다음 단계에서는 정사각형이 , ["condition", "조건화하다"], ["geometric form", "기하학적 형태"], ["reliably", "일관되게"], ["proportion", "비율"], ["novel variant", "새로운 변형"], ["undergo", "겪다"], ["in favor of", "~에 유리하게"], ["inclination", "선호, 성향"]]}, {"q": "11", "type": "장문 제목", "src": "2019학년도 6월 41번", "ans": "②", "tr": [["1", "20세기로 접어들 무렵, 음악 명곡들로 이루어진 고정 레퍼토리가 피아노·성악·실내악 독주회에서 오페라와 관현악 연주회에 이르기까지 연주회 음악의 거의 모든 분야를 지배했다."], ["2", "한 세기 전과 비교하면 그 변화는 엄청났다."], ["3", "18세기에는 연주자와 청중이 늘 새로운 음악을 요구했고, '옛 음악'이란 이십 년보다 앞서 쓰인 것이면 무엇이든 가리켰다."], ["4", "그러나 1900년대 초의 음악가와 청중은 자신들이 연주하거나 듣는 연주회 음악 대부분이 적어도 한 세대는 지난 것이리라 여겼고, 이미 레퍼토리에 소중히 자리 잡은 명곡의 기준으로 새 음악을 평가했다."], ["5", "본질적으로 연주회장과 오페라 극장은 지난 200년의 음악 작품을 전시하는 박물관이 되어 있었다."], ["6", "레퍼토리는 연주 매체와 지역에 따라 달랐지만, 그 핵심은 유럽과 아메리카 대부분에서 거의 같았다. 모차르트에서 베르디·바그너·비제에 이르는 오페라와 그 발췌곡, 하이든에서 후기 낭만파에 이르는 관현악과 실내악, 그리고 J. S. 바흐·하이든·모차르트·베토벤과 저명한 19세기 작곡가들의 건반 음악이 그것이다."], ["7", "생존 작곡가들은 점점 더 자신이 과거의 음악과 경쟁하고 있음을 깨닫게 되었다."], ["8", "이것이 고전 전통 안에서 전개된 현대 음악의, 특히 20세기 전반부의 커다란 주제다. 고전 명곡을 소중히 여기던(→ 원문 disregarded) 연주자와 청중의 관심을 놓고 과거의 작곡가들과 겨루면서, 생존 작곡가들은 전통을 이어 가면서도 새롭고 독특한 것을 내놓아 자기 자리를 확보하려 했다."], ["9", "그들은 개성과 혁신을 과거에 대한 경쟁적 모방과 결합해, 이전 시대의 걸작들과 나란히 놓여도 독창적이고 연주할 가치가 있다고 평가받을 음악을 쓰려고 애썼다."]], "evh": "B-3번 문장", "ev": [{"en": true, "h": "They combined individuality and innovation with emulation of the past, seeking to write music that would be considered original and worthy of performance alongside the masterworks of earlier times."}, {"en": false, "h": "제목 문항은 <b>글 전체를 관통하는 두 축</b>을 찾는다. 이 글의 두 축은 <b>과거의 명곡 유산</b>(permanent repertoire, museums, masterworks)과 <b>그 안에서 새로움을 시도한 생존 작곡가</b>(something new and distinctive, individuality and innovation)다. 마지막 문장이 이 둘을 한 문장에 겹쳐 놓는다. 따라서 제목은 '<b>고전 음악 유산 안이냐 그 너머냐</b>'가 된다."}], "opts": [{"n": "①", "t": "작곡가와 청중 사이의 벌어지는 간극", "a": false, "x": true, "trap": false, "e": "작곡가와 청중이 서로 멀어졌다는 이야기는 없다. 경쟁 상대는 청중이 아니라 <b>과거의 작곡가</b>다."}, {"n": "②", "t": "고전 음악 유산의 안이냐 너머냐", "a": true, "x": false, "trap": false, "e": "전통(heritage) 안에 머무는 것과 그것을 넘어서는   WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
