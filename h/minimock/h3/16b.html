<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

언쟁으로 구성되어 있다는 것이다."], [6, "그것이 한 사람은 우월성을 드러내고 다른 한 사람은 결국 자신의 열등함을 깨닫게 되는 이유이다."], [7, "만일 두 사람이 논쟁하고 있다면, 그것은 그들이 (논쟁을) 이어 나갈 만큼 힘에 있어서(혹은 힘의 균형을 회복하려는 욕구에 있어서) 충분히 균형을 이루고 있기 때문이다."]], "why": ["이 글은 논쟁이 일어나려면 두 사람의 <b>힘이 균형<\/b>을 이루어야 한다고 말합니다", "(5)는 논쟁이 자기 믿음의 이유를 제시할 만큼 <b>충분히 강하다고 느끼는 두 사람<\/b> 간의 언쟁이라고 합니다", "(7)은 두 사람이 논쟁한다면 힘에 있어서 <b>충분히 균형<\/b>을 이루고 있기 때문이라고 합니다", "그런데 (6)은 한 사람은 <b>우월성<\/b>을 드러내고 다른 사람은 <b>열등함<\/b>을 깨닫는다고 합니다", "힘이 대등하다는 (5), (7)과 부딪치므로, 전체 흐름과 관계없는 문장은 ③입니다."], "ch": [{"n": "①", "t": "Interpersonal argumentation, then, has a place in our everyday conflicts and negotiations.", "g": "그렇기에 사람 간의 논쟁은 우리의 일상적인 갈등이나 협상에 존재한다.", "ok": false, "e": ["(4)는 앞에서 설명한 논쟁이 우리의 일상적인 갈등이나 협상에 존재한다고 말합니다", "논쟁의 정의에서 일상 이야기로 자연스럽게 이어집니다."]}, {"n": "②", "t": "One of the positive features of interpersonal arguments is that they are comprised of exchanges between two people who feel powerful enough to set forth reasons for their beliefs.", "g": "사람 간의 논쟁에서 긍정적인 특징 중 한 가지는 그것이 자신들의 믿음에 대한 이유를 제시할 만큼 충분히 강하다고 느끼는 두 사람 간의 언쟁으로 구성되어 있다는 것이다.", "ok": false, "e": ["(5)는 논쟁이 충분히 강하다고 느끼는 두 사람 간의 언쟁이라고 합니다", "글의 중심인 <b>힘의 균형<\/b>을 처음 꺼내는 문장입니다."]}, {"n": "③", "t": "That’s why one person reveals a sense of superiority and the other ends up realizing his or her inferiority.", "g": "그것이 한 사람은 우월성을 드러내고 다른 한 사람은 결국 자신의 열등함을 깨닫게 되는 이유이다.", "ok": true, "e": ["(6)은 한 사람은 우월성을, 다른 사람은 열등함을 드러낸다고 합니다", "앞뒤 문장이 말하는 <b>힘의 균형<\/b>과 반대되므로 흐름에서 벗어납니다."]}, {"n": "④", "t": "If two people are arguing, it is because they are balanced enough in power (or in their desire to reestablish a power balance) to proceed.", "g": "만일 두 사람이 논쟁하고 있다면, 그것은 그들이 (논쟁을) 이어 나갈 만큼 힘에 있어서(혹은 힘의 균형을 회복하려는 욕구에 있어서) 충분히 균형을 이루고 있기 때문이다.", "ok": false, "e": ["(7)은 두 사람이 논쟁하는 것은 힘에 있어서 충분히 균형을 이루고 있기 때문이라고 합니다", "(5)의 내용을 이어받아 힘의 균형을 다시 말합니다."]}, {"n": "⑤", "t": "Lack of argument, in fact, may show that one of the parties feels so powerless that he or she avoids engaging directly with the other.", "g": "사실, 논쟁의 결여는 당사자 중 한 명이 너무 무력함을 느껴서 상대방과 직접 관계 맺기를 피한다는 것을 나타낼 수 있다.", "ok": false, "e": ["(8)은 논쟁이 없는 것은 한쪽이 너무 무력하다고 느끼기 때문일 수 있다고 합니다", "힘의 균형이 깨지면 논쟁이 일어나지 않는다는 말이라 흐름에 맞습니다."]}], "tr": ["논쟁이란 다른 사람들에게 쟁점에 관한 당신의 입장을 납득시키려고 노력하면서 ‘이유를 대는 것’이다.", "사람은 주장을 하고 그것을 뒷받침한다.", "논쟁자는 다른 사람들이 자신의 믿음이나 행동의 ‘정당성을 인정’하도록 하기 위해 노력한다.", "그렇기에 사람 간의 논쟁은 우리의 일상적인 갈등이나 협상에 존재한다.", "사람 간의 논쟁에서 긍정적인 특징 중 한 가지는 논쟁이 자신들의 믿음에 대한 이유를 제시할 만큼 충분히 강하다고 느끼는 두 사람 간의 언쟁으로 구성되어 있다는 것이다.", "그것이 한 사람은 우월성을 드러내고 다른 한 사람은 결국 자신의 열등함을 깨닫게 되는 이유이다.", "만일 두 사람이 논쟁하고 있다면, 그것은 그들이 (논쟁을) 이어 나갈 만큼 힘에 있어서(혹은 힘의 균형을 회복하려는 욕구에 있어서) 충분히 균형을 이루고 있기 때문이다.", "사실, 논쟁의 결여는 당사자 중 한 명이 너무 무력함을 느껴서 다른 사람(상대방)과 직접 관계 맺기를 피한다는 것을 나타낼 수 있다."], "ps": [{"n": 1, "ch": [{"e": "Argument is “<b>reason giving<\/b>”,", "k": "논쟁은 ‘이유를 대는 것’이다,"}, {"e": "trying to <b>convince<\/b> others", "k": "다른 사람들에게 납득시키려고 노력하면서"}, {"e": "of your side of the issue.", "k": "쟁점에 관한 당신의 입장을."}], "link": "논쟁이란 다른 사람들에게 쟁점에 관한 당신의 입장을 납득시키려고 노력하면서 ‘이유를 대는 것’이다.", "easy": "논쟁은 내 입장이 맞다고 다른 사람을 설득하려고 이유를 대는 거예요.", "gist": "논쟁의 정의로 글을 연다."}, {"n": 2, "ch": [{"e": "One makes <b>claims<\/b>", "k": "사람은 주장을 하고"}, {"e": "and <b>backs<\/b> them <b>up<\/b>.", "k": "그것들<span class=\"r\">(= 주장)<\/span>을 뒷받침한다."}], "easy": "주장을 하고, 그 주장을 근거로 받쳐 준다는 말이에요.", "gist": "논쟁에서 하는 일을 짧게 정리한다."}, {"n": 3, "ch": [{"e": "The <b>arguer<\/b> tries to get others", "k": "논쟁자는 다른 사람들이 ~하도록 하기 위해 노력한다"}, {"e": "to “<b>recognize the rightness<\/b>”", "k": "‘정당성을 인정’하도록"}, {"e": "of his or her beliefs or actions.", "k": "자신의 믿음이나 행동의."}], "easy": "논쟁하는 사람은 다른 사람들이 자기 생각이나 행동이 옳다고 인정하게 만들려고 해요.", "gist": "논쟁하는 사람의 목표를 말한다."}, {"n": 4, "ch": [{"e": "<b>Interpersonal<\/b> argumentation,", "k": "사람 간의 논쟁은,"}, {"e": "then,", "k": "그렇기에,"}, {"e": "<b>has a place<\/b> in our everyday conflicts and negotiations.", "k": "우리의 일상적인 갈등이나 협상에 존재한다."}], "easy": "그래서 사람 사이의 논쟁은 우리가 매일 겪는 갈등이나 협상 속에 있어요.", "gist": "선지 ①. 논쟁을 일상생활과 연결한다."}, {"n": 5, "ch": [{"e": "One of the <b>positive features<\/b>", "k": "긍정적인 특징 중 한 가지는"}, {"e": "of interpersonal arguments", "k": "사람 간의 논쟁에서"}, {"e": "is that they are <b>comprised of<\/b> exchanges", "k": "그것들<span class=\"r\">(= 사람 간의 논쟁)<\/span>이 언쟁으로 구성되어 있다는 것이다"}, {"e": "between two people", "k": "두 사람 간의"}, {"e": "who feel <b>powerful enough<\/b>", "k": "충분히 강하다고 느끼는"}, {"e": "to <b>set forth<\/b> reasons for their beliefs.", "k": "자신들의 믿음에 대한 이유를 제시할 만큼."}], "link": "사람 간의 논쟁에서 긍정적인 특징 중 한 가지는 그것이 자신들의 믿음에 대한 이유를 제시할 만큼 충분히 강하다고 느끼는 두 사람 간의 언쟁으로 구성되어 있다는 것이다.", "easy": "논쟁의 좋은 점은, 둘 다 자기 생각의 이유를 말할 수 있을 만큼 힘이 있다고 느끼는 사람끼리 주고받는다는 거예요.", "gist": "선지 ②. 논쟁은 둘 다 힘이 있다고 느낄 때 일어난다는 핵심이 나온다."}, {"n": 6, "ch": [{"e": "<b>That’s why<\/b>", "k": "그것이 ~하는 이유이다"}, {"e": "one person reveals a sense of <b>superiority<\/b>", "k": "한 사람은 우월성을 드러내고"}, {"e": "and the other ends up realizing", "k": "다른 한 사람은 결국 깨닫게 되는"}, {"e": "his or her <b>inferiority<\/b>.", "k": "자신의 열등함을."}], "link": "그것이 한 사람은 우월성을 드러내고 다른 한 사람은 결국 자신의 열등함을 깨닫게 되는 이유이다.", "easy": "그래서 한 사람은 자기가 더 낫다는 걸 드러내고, 다른 사람은 자기가 못하다는 걸 깨닫게 된다는 말이에요.", "gist": "선지 ③, 정답. 힘의 균형을 말하는 흐름에 ‘우열’을 끌어들여 어긋난다."}, {"n": 7, "ch": [{"e": "If two people are arguing,", "k": "만일 두 사람이 논쟁하고 있다면,"}, {"e": "it is because they are <b>balanced enough<\/b> in power", "k": "그것은 그들이 힘에 있어서 충분히 균형을 이루고 있기 때문이다"}, {"e": "(or in their desire to <b>reestablish<\/b> a power balance)", "k": "(혹은 힘의 균형을 회복하려는 욕구에 있어서)"}, {"e": "to proceed.", "k": "(논쟁을) 이어 나갈 만큼."}], "link": "만일 두 사람이 논쟁하고 있다면, 그것은 그들이 (논쟁을) 이어 나갈 만큼 힘에 있어서(혹은 힘의 균형을 회복하려는 욕구에 있어서) 충분히 균형을 이루고 있기 때문이다.", "easy": "두 사람이 논쟁을 한다는 건, 둘의 힘이 비슷해서 논쟁을 계속할 수 있다는 뜻이에요.", "gist": "선지 ④. 힘의 균형이 있어야 논쟁이 이어진다고 다시 강조한다."}, {"n": 8, "ch": [{"e": "<b>Lack of argument<\/b>,", "k": "논쟁의 결여는,"}, {"e": "in fact,", "k": "사실,"}, {"e": "may show", "k": "나타낼 수 있다"}, {"e": "that one of the parties feels <b>so powerless<\/b>", "k": "당사자 중 한 명이 너무 무력함을 느껴서"}, {"e": "that he or she avoids engaging directly", "k": "그 사람이 직접 관계 맺기를 피한다는 것을"}, {"e": "with the other.", "k": "다른 사람(상대방)과."}], "link": "사실, 논쟁의 결여는 당사자 중 한 명이 너무 무력함을 느껴서 상대방과 직접 관계 맺기를 피한다는 것을 나타낼 수 있다.", "easy": "논쟁이 없다는 건 오히려, 한쪽이 너무 힘이 없다고 느껴서 상대와 직접 맞서기를 피하고 있다는 뜻일 수 있어요.", "gist": "선지 ⑤. 힘의 균형이 깨지면 논쟁 자체가 사라진다는 반대 경우로 마무리한다."}]}, {"no": "09", "typ": "글의 순서", "src": "2021년 4월 37번", "evn": [1, 2, 4, 5, 6, 8], "ev_en": "Birds use many techniques to save energy when they are flying, most of which are tricks to stay aloft without flapping. / When it reaches the top, the bird bends its wings and glides in the direction it wants to travel, searching for the next thermal. / Riding updrafts to gain altitude is one of the most conspicuous. / Bare ground such as fields or parking lots absorbs more heat from the sun, and as air near the ground warms up it rises. / This creates a column of rising warm air — a thermal — reaching hundreds or even thousands of feet high. / It simply fans its wings and tail and lets the rising air carry it up like an elevator.", "ev_ko": [[1, "[주어진 글] 새들은 날 때 에너지를 절약하기 위해 많은 기술을 사용하는데, 그것들의 대부분은 날갯짓 없이 높이 머무르는 속임수다."], [2, "(A) 새가 가장 높은 곳에 도달하면, 새는 날개를 구부리고 다음 상승 온난 기류를 찾아 그것이 이동하고자 하는 방향으로 활공한다."], [4, "(B) 고도를 얻기(높이기) 위해 상승 기류를 타는 것은 가장 뚜렷한 기술들 중 하나이다."], [5, "(B) 들판이나 주차장과 같은 맨땅은 태양으로부터 더 많은 열을 흡수하고, 지면 근처의 공기가 데워지면서 상승한다."], [6, "(C) 이것은 수백 혹은 심지어 수천 피트 상공에 이르는 따뜻한 공기의 기둥, 즉 ‘상승 온난 기류’를 만든다."], [8, "(C) 새는 단순히 날개와 꼬리를 펼치고 상승하는 공기가 그것을 엘리베이터처럼 위로 올려 주도록 한다."]], "why": ["주어진 글 (1)은 새들이 날 때 에너지를 절약하는 <b>많은 기술<\/b>을 쓴다고 말합니다", "(B)의 (4)는 그 기술 중 하나로 <b>상승 기류를 타는 것<\/b>을 꺼내므로 주어진 글 바로 뒤에 옵니다", "(B)의 (5)는 지면 근처의 공기가 데워지면서 <b>상승한다<\/b>고 합니다", "(C)의 (6) <b>This creates a column of rising warm air<\/b>의 This는 바로 이 현상을 가리킵니다", "(C)의 (8)에서 새는 상승하는 공기를 타고 엘리베이터처럼 위로 올라갑니다", "그래서 (A)의 (2) <b>When it reaches the top<\/b>(새가 가장 높은 곳에 도달하면)이 그 뒤에 이어집니다", "따라서 순서는 (B) – (C) – (A)입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)의 (2) <b>When it reaches the top<\/b>은 새가 상승 온난 기류를 타고 꼭대기에 이른 뒤의 일입니다", "상승 기류 이야기가 나오기 전이라 (A "2", "pollen", "꽃가루"]], "lit": "그 나비들은 우리가 다른 식물들을 기르도록 도와준단다 / 왜냐하면 그것들이 꽃에서 꽃으로 꽃가루를 옮겨 주기 때문이야.", "nat": "그 나비들은 꽃에서 꽃으로 꽃가루를 옮겨 주기 때문에 우리가 다른 식물들을 기르는 데 도움을 준단다.", "ana": "<b>help + 목적어 + 동사원형</b>이 그대로 쓰인 문장이다. help는 목적격 보어로 <b>동사원형과 to부정사를 둘 다</b> 쓸 수 있는데, 실제 글에서는 <b>동사원형</b>이 훨씬 자주 나온다. 그래서 <b>grow</b>를 보고 '동사가 두 개인데?'라고 당황하지 않아야 한다. 여기서 <b>grow</b>는 '자라다'가 아니라 목적어 <b>some other plants</b>를 데리고 있으므로 '<b>기르다, 재배하다</b>'라는 <b>타동사</b>다. 같은 동사가 목적어 유무에 따라 뜻이 갈리는 대표적인 예다. 뒤의 <b>because</b>절은 주어 <b>they</b>가 나비를 가리키며, 이 문장이 이 글의 <b>주제(자연의 균형)</b>로 이어지는 다리 역할을 한다.", "pe": "The butterflies help us grow<sup>1</sup> some other plants / \u0001because they carry pollen<sup>2</sup> from flower to flower\u0002.", "pk": "그 나비들은 우리가 다른 식물들을 기르도록 도와준단다 / \u0001왜냐하면 그것들이 꽃에서 꽃으로 꽃가루를 옮겨 주기 때문이야\u0002.", "core": "나비들은 우리가 다른 식물들을 기르도록 도와준다.", "tags": ["주어 butterflies + 동사 help + 목적어 us + 목적격보어 grow some other plants: 5형식(help + 목적어 + 원형)", "(because …) = 부사절(이유): help를 꾸밈. carry A from B to C"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식) + 이유 부사절</b>이다. 뒤에 because절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The butterflies (그 나비들)", "V: help (help 돕다)", "O: us (우리)", "C: grow some other plants (다른 식물들을 기르다, 원형동사 grow)", "뼈대 = <b>The butterflies help us grow some other plants</b>", "help + 목적어 + 원형동사 = ~가 …하도록 돕다, plant = 식물"]}, {"t": "<b>because they carry pollen from flower to flower</b>는 <b>이유 부사절</b>로 help를 꾸민다. '그것들이 꽃에서 꽃으로 꽃가루를 옮겨 주기 때문에'.", "sub": ["S: they (= the butterflies, 그 나비들), V: carry (carry 옮기다), O: pollen (꽃가루)", "from A to B = A에서 B로, flower = 꽃"]}, {"t": "grow는 '자라다'가 아니라 여기서 '기르다'라는 타동사이다. 뒤에 목적어 plants가 있어서 알 수 있다."}], "sum": "나비는 꽃가루를 옮겨 다른 식물을 기르게 도움"}, {"i": "08", "q": "10", "s": "D-4", "title": "S+V+O(that절) + that절 안의 although절", "eng": "Grandma added<sup>1</sup> / that although she knew caterpillars<sup>2</sup> did harm to<sup>3</sup> cabbages, / she didn't wish to disturb<sup>4</sup> the natural balance of the environment.", "notes": [["1", "add that", "~라고 덧붙여 말하다"], ["2", "caterpillar", "애벌레"], ["3", "do harm to", "~에 해를 끼치다"], ["4", "disturb", "흐트러뜨리다, 방해하다"]], "lit": "할머니는 덧붙여 말했다 / 비록 애벌레가 양배추에 해를 끼친다는 것을 알고는 있지만, / 자연 환경의 균형을 흐트러뜨리고 싶지는 않다고.", "nat": "할머니는 애벌레가 양배추에 해를 끼친다는 것을 알고는 있지만 자연 환경의 균형을 흐트러뜨리고 싶지는 않다고 덧붙였다.", "ana": "동사 <b>added</b> 뒤에 <b>that</b>이 오면 '<b>~라고 덧붙여 말했다</b>'라는 <b>목적어 명사절</b>이다. 문제는 that 바로 뒤에 주어가 아니라 <b>although</b>가 나온다는 점이다. 즉 <b>that [although ~ , 주어 + 동사]</b>의 구조로, <b>양보절이 that절 안에 통째로 들어앉아</b> 있다. 이럴 때는 although절을 <b>먼저 괄호로 묶어 두고</b> that절의 진짜 주어·동사인 <b>she didn't wish</b>를 찾아야 한다. 접속사가 연달아 나오면 <b>어느 것이 큰 틀인지</b>부터 정하는 것이 순서다. <b>do harm to</b>는 '<b>~에 해를 끼치다</b>'라는 뜻이고, <b>disturb</b>는 '방해하다'뿐 아니라 '<b>(균형·상태를) 흐트러뜨리다</b>'라는 뜻으로도 쓰인다.", "pe": "Grandma added<sup>1</sup> / that \u0001although she knew caterpillars<sup>2</sup> did harm to<sup>3</sup> cabbages\u0002, / she didn't wish to disturb<sup>4</sup> the \u0001natural\u0002 balance \u0001of the environment\u0002.", "pk": "할머니는 덧붙여 말했다 / \u0001비록 애벌레가 양배추에 해를 끼친다는 것을 알고는 있지만\u0002, / \u0001자연 환경의\u0002 균형을 흐트러뜨리고 싶지는 않다고.", "core": "할머니는 덧붙여 말했다. 그녀는 균형을 흐트러뜨리고 싶지 않다고.", "tags": ["주어 Grandma + 동사 added + 목적어 that절(<b>명사절</b>): 3형식", "that절 안: (although she knew …) = 부사절(양보): didn't wish를 꾸밈. knew의 목적어 = caterpillars did harm(명사절), do harm to = ~에 해를 끼치다", "주어 she + 동사 didn't wish + 목적어 to disturb the balance: 3형식. (natural) = 형용사: balance를 꾸밈, (of the environment) = 전치사구(형용사구): balance를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 that절 안에 although 양보절이 앞에 놓여 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Grandma (할머니)", "V: added (add 덧붙여 말하다의 과거형)", "O: that절 (명사절, 덧붙인 내용)", "뼈대 = <b>Grandma added that ~</b>"]}, {"t": "that절의 뼈대는 <b>she didn't wish to disturb the natural balance of the environment</b>이다.", "sub": ["S: she (= Grandma), V: didn't wish (wish 바라다), O: to disturb the natural balance (자연의 균형을 흐트러뜨리는 것)", "disturb = 흐트러뜨리다, balance = 균형, environment = 환경", "natural (자연의)은 balance를 꾸미는 형용사, of the environment는 balance를 꾸미는 형용사구이다."]}, {"t": "that절 맨 앞 <b>although she knew caterpillars did harm to cabbages</b>는 <b>양보 부사절</b>이다. '애벌레가 양배추에 해를 끼친다는 것을 알고는 있지만'이라는 뜻이다.", "sub": ["although = 비록 ~이지만, caterpillar = 애벌레, cabbage = 양배추", "do harm to = ~에 해를 끼치다, knew는 know 알다의 과거형이다. 그 목적어가 caterpillars did harm to cabbages이다."]}], "sum": "할머니, 애벌레가 해로운 줄 알아도 자연 균형은 안 깨고 싶어 함"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2020학년도 6월 31번", "ans": "②", "tr": [["1", "어떤 사람들은 야생동물 피해 관리를 과잉으로 많은 종을 다루는 과학이자 관리라고 정의해 왔지만, 이 정의는 너무 좁다."], ["2", "모든 야생동물 종은 인간의 이익에 해를 끼치는 방식으로 행동한다."], ["3", "따라서 과잉으로 많은 종만이 아니라 모든 종이 야생동물 피해를 일으킨다."], ["4", "이것의 흥미로운 예로 캘리포니아의 멸종 위기종인 송골매가 있는데, 이 송골매는 또 다른 멸종 위기종인 캘리포니아 작은제비갈매기를 잡아먹는다."], ["5", "분명히 우리는 송골매가 과잉으로 많다고 여기지는 않겠지만, 그것이 멸종 위기종을 먹고 살지 않기를 바란다."], ["6", "이 경우에 송골매 개체군과 관련된 부정적 가치 가운데 하나는 그 포식이 또 다른 멸종 위기종의 개체 수를 줄인다는 점이다."], ["7", "이 경우 야생동물 피해 관리의 목표는 송골매를 ______ 하지 않으면서 송골매가 제비갈매기를 잡아먹는 것을 멈추게 하는 일이 될 것이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Certainly, we would not consider peregrine falcons as being overabundant, but we wish that they would not feed on an endangered species."}, {"en": false, "h": "빈칸 문장은 <b>stop the falcons from eating the terns without ______ the falcons</b>이다. <b>without</b> 뒤에는 '<b>피하고 싶은 일</b>'이 들어간다. 그러면 무엇을 피하고 싶은가. 5번 문장이 답을 준다. 송골매 역시 <b>endangered</b>(멸종 위기)이고, 우리는 송골매가 과잉이라고 보지도 않는다. 즉 <b>송골매 자체는 지켜야 할 대상</b>이다. 그러므로 제비갈매기를 구하되 송골매에게는 <b>해를 입히지 않아야</b> 한다. 답은 ② <b>harming</b>이다. 빈칸이 <b>without</b> 뒤에 있으면 앞뒤 흐름에서 '<b>하면 안 되는 것</b>'을 찾아야지, 그럴듯한 해결책을 찾으면 안 된다. ①·③·⑤처럼 '복제·훈련·가축화' 같은 <b>구체적 조치</b>는 글에 근거가 한 줄도 없다."}], "opts": [{"n": "①", "t": "cloning (복제하기)", "a": false, "x": true, "trap": false, "e": "복제라는 기술적 조치는 글에 전혀 없다. 게다가 without cloning(복제하지 않으면서)이라는 조건 자체가 문맥상 의미가 없다."}, {"n": "②", "t": "harming (해를 끼치기)", "a": true, "x": false, "trap": false, "e": "4·5번 문장에서 송골매도 <b>멸종 위기종</b>이며 과잉이 아니라고 했다. 그러므로 제비갈매기를 지키되 송골매에게 <b>해를 끼치지 않는</b> 것이 목표가 된다."}, {"n": "③", "t": "training (훈련시키기)", "a": false, "x": true, "trap": false, "e": "야생 맹금을 훈련한다는 발상은 글에 없다. 이 글은 <b>관리의 정의</b>를 넓히는 데 초점이 있지 구체적 기법을 논하지 않는다."}, {"n": "④", "t": "overfeeding (먹이를 지나치게 주기)", "a": false, "x": true, "trap": true, "e": "5번 문장의 <b>feed on</b>에서 feed만 눈에 남으면 걸린다. 그러나 without overfeeding(과다 급여를 하지 않으면서)은 앞의 '잡아먹는 것을 막는다'와 논리적으로 이어지지 않는다."}, {"n": "⑤", "t": "domesticating (가축화하기)", "a": false, "x": true, "trap": false, "e": "가축화는 야생동물 피해 관리의 논점이 아니며, 멸종 위기종을 가축화한다는 언급도 없다."}], "w": [["define A as B", "A를 B라고 정의하다"], ["overabundant", "과잉으로 많은"], ["narrow", "좁은, 편협한"], ["human interests", "인간의 이익"], ["endangered species", "멸종 위기종"], ["peregrine falcon", "송골매"], ["prey on", "~을 잡아먹다"], ["least tern", "작은제비갈매기"], ["feed on", "~을 먹고 살다"], ["associated with", "~와 관련된"], ["predation", "포식, 잡아먹기"], ["stop A from ~ing", "A가 ~하지 못하게 막다"]]}, {"q": "08", "type": "무관한 문장", "src": "2020년 7월 35번", "ans": "③", "tr": [["1", "논증은 '이유 대기', 즉 그 사안에 대한 자기 편의 입장을 남에게 납득시키려는 시도이다."], ["2", "사람은 주장을 하고 그것을 뒷받침한다."], ["3", "논쟁하는 사람은 자신의 믿음이나 행동이 옳다는 것을 다른 사람들이 인정하게 만들려고 한다."], ["4", "① 그러므로 대인 간 논증은 우리의 일상적인 갈등과 협상에서 한자리를 차지한다."], ["5", "② 대인 간 논쟁의 긍정적인 특징 중 하나는, 자기 믿음에 대한 이유를 제시할 만큼 충분히 힘이 있다고 느끼는 두 사람이 주고받는 말로 이루어져 있다는 점이다."], ["6", "③ 그렇기 때문에 한 사람은 우월감을 드러내고 다른 한 사람은 결국 자신의 열등함을 깨닫게 된다."], ["7", "④ 두 사람이 논쟁하고 있다면, 그것은 그들이 계속 나아갈 만큼 힘에서(또는 힘의 균형을 회복하려는 욕구에서) 충분히 균형이 잡혀 있기 때문이다."], ["8", "⑤ 사실 논쟁의 부재는 당사자 중 한 사람이 너무 무력하다고 느껴서 상대와 직접 맞붙기를 피한다는 것을 보여 줄 수도 있다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "That's why one person reveals a sense of superiority and the other ends up realizing his or her inferiority."}, {"en": false, "h": "이 글의 축은 <b>힘의 균형</b>이다. ②는 <b>two people who feel powerful enough</b>(둘 다 충분히 힘이 있다고 느끼는 두 사람), ④는 <b>balanced enough in power</b>(힘에서 충분히 균형이 잡힌), ⑤는 <b>so powerless that he or she avoids</b>(너무 무력해서 피한다)로, 세 문장 모두 '<b>논쟁은 힘이 대등할 때 일어난다</b>'는 하나의 주장을 떠받친다. 그런데 ③만 <b>superiority</b>와 <b>inferiority</b>, 즉 <b>우열이 갈린다</b>고 말한다. 대등함을 말하는 글에 <b>서열</b>을 끌어들였으니 방향이 정반대다. 게다가 ③의 <b>That's why</b>는 앞 문장의 결과를 받는 표현인데, ②에서 ③이 도출되지도 않는다. 무관 문장 문항은 <b>같은 낱말이 나오는지</b>가 아니라 <b>주장의 방향이 같은지</b>로 골라야 한다."}], "opts": [{"n": "①", "t": "대인 간 논증은 일상의 갈등과 협상에서 한자리를 차지한다.", "a": false, "x": true, "trap": false, "e": "3번 문장까지 정리한 논증의 정의를 <b>일상</b> 장면으로 옮기는 연결 문장이다. <b>then</b>이 그 이음새 역할을 한다."}, {"n": "②", "t": "논쟁은 충분히 힘이 있다고 느끼는 두 사람의 주고받음이다.", "a": false, "x": true, "trap": false, "e": "글 전체의 핵심 전제인 <b>대등한 힘</b>을 처음 제시하는 문장이다. 이 문장이 없으면 ④·⑤가 성립하지 않는다."}, {"n": "③", "t": "한 사람은 우월감을 드러내고 다른 한 사람은 열등함을 깨닫는다.", "a": true, "x": false, "trap": false, "e": "앞뒤가 모두 <b>힘의 대등함</b>을 말하는데 이 문장만 <b>우열</b>을 말한다. 주장의 방향이 반대이므로 전체 흐름과 무관하다."}, {"n": "④", "t": "논쟁이 일어나는 것은 힘이 충분히 균형 잡혀 있기 때문이다.", "a": false, "x": true, "trap": false, "e": "②의 <b>powerful enough</b>를 <b>balanced enough in power</b>로 바꿔 다시 말한 문장이다. 같은 주장의 반복 강화다."}, {"n": "⑤", "t": "논쟁의 부재는 한쪽이 너무 무력함을 보여 줄 수 있다.", "a": false, "x": true, "trap": true, "e": "같은 원리를 <b>반대 상황</b>에 적용해 마무리하는 문장이다. 균형이 깨지면 논쟁 자체가 사라진다는 결론이다."}], "w": [["reason giving", "이유 대기"], ["convince A of B", "A에게 B를 확신시키다"], ["back A up", "A를 뒷받침하다"], ["arguer", "논쟁하는 사람"], ["rightness", "옳음, 정당함"], ["interpersonal", "대인 간의"], ["negotiation", "협상"], ["be comprised of", "~으로 구성되다"], ["set forth", "제시하다, 내놓다"], ["superiority", "우월감"], ["inferiority", "열등함"], ["engage with", "~와 맞붙다"]]}, {"q": "09", "type": "글의 순서", "src": "2021년 4월 37번", "ans": "③", "tr": [["1", "[주어진 글] 새들은 날 때 에너지를 아끼기 위해 여러 기법을 사용하는데, 그 대부분은 날갯짓 없이 공중에 떠 있기 위한 요령이다."], ["2", "[B] 고도를 얻기 위해 상승 기류를 타는 것이 가장 뚜렷한 방법 가운데 하나다."], ["3", "[B] 들판이나 주차장 같은 맨땅은 태양으로부터 더 많은 열을 흡수하고, 지면 근처의 공기가 따뜻해지면 그 공기는 상승한다."], ["4", "[C] 이것이 수백 피트, 심지어 수천 피트 높이까지 이르는 상승하는 따뜻한 공기 기둥, 즉 상승 온난 기류를 만들어 낸다."], ["5", "[C] 활공하는 새는 그 공기의 움직임을 감지하고 그 기둥 안에 머물기 위해 원을 그리며 날 수 있다."], ["6", "[C] 새는 그저 날개와 꼬리를 펼친 채, 상승하는 공기가 자신을 엘리베이터처럼 위로 실어 올리도록 맡겨 둘 뿐이다."], ["7", "[A] 꼭대기에 이르면, 새는 날개를 구부려 자신이 가고 싶은 방향으로 활공하면서 다음 상승 온난 기류를 찾는다."], ["8", "[A] 활공하는 새는 모두 상승 온난 기류를 이용하지만, 넓적날개말똥가리 같은 몇몇 종은 특히 전문가여서 조건만 맞으면 날갯짓을 거의 하지 않고도 수백 마일을 이동할 수 있다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "This creates a column of rising warm air — a thermal — reaching hundreds or even thousands of feet high."}, {"en": false, "h": "순서 문항은 <b>지시어와 대명사</b>가 전부다. 주어진 글은 '<b>여러 기법</b>'을 예고하므로, 그중 하나를 꺼내며 <b>one of the most conspicuous</b>라고 말하는 (B)가 먼저 온다. (C)의 첫 단어 <b>This</b>가 결정적이다. This가 가리키는 것은 <b>(B) 마지막의 '따뜻해진 공기가 상승한다'</b>는 현상이며, 그래야 '<b>이것이 상승 온난 기류 기둥을 만든다</b>'가 성립한다. (A)를 (C) 앞에 두면 This가 받을 대상이 없다. 마지막으로 (A)의 첫 문장 <b>When it reaches the top</b>의 <b>the top</b>은 (C)에서 만들어진 <b>공기 기둥의 꼭대기</b>이고, <b>searching for the next thermal</b>의 <b>next</b>는 앞에 thermal이 이미 나왔다는 뜻이다. 따라서 (B) → (C) → (A)다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)의 <b>When it reaches the top</b>이 무엇의 꼭대기인지 알 수 없다. thermal이라는 말이 아직 나오지 않았는데 <b>the next thermal</b>이라고 하는 것도 불가능하다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(A) 뒤에 (C)가 오면 (C)의 <b>This</b>가 (A)의 '방향을 틀어 활공한다'를 받게 되는데, 그것이 <b>공기 기둥을 만든다</b>는 말은 성립하지 않는다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": true, "x": false, "trap": false, "e": "(B)의 '지면이 데워져 공기가 상승한다' → (C)의 <b>This creates a column of rising warm air</b> → (A)의 <b>When it reaches the top</b>으로 지시어가 끊김 없이 이어진다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": true, "e": "(C)가 맨 앞에 오면 <b>This</b>가 받을 앞 내용이 주어진 글의 '여러 기법'뿐인데, 기법이 공기 기둥을 만든다는 말은 어색하다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": false, "x": true, "trap": false, "e": "(C)에서 이미 thermal을 설명해 놓고 (B)에서 다시 <b>상승 기류를 타는 것</b>을 처음 소개하듯 말하는 것은 순서가 뒤집힌 것이다."}], "w": [["aloft", "높이, 공중에"], ["flap", "날개를 퍼덕이다"], ["updraft", "상승 기류"], ["altitude", "고도"], ["conspicuous", "뚜렷한, 눈에 잘 띄는"], ["bare ground", "맨땅, 헐벗은 땅"], ["absorb", "흡수하다"], ["thermal", "상승 온난 기류"], ["soar", "활공하다, 높이 날다"], ["fan", "펼치다, 부채처럼 펴다"], ["glide", "활공하다, 미끄러지듯 날다"], ["take advantage of", "~을 이용하다"]]}, {"q": "10", "type": "장문 · 순서", "src": "2019학년도 수능 43번", "ans": "②", "tr": [["1", "[A] Olivi   CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';
  app.innerHTML=h;
}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
