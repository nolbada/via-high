<title>고3 미니모의고사 16회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}

.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}
details.sub2>summary:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});

      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}

er.", "k": "다른 사람(상대방)과."}], "link": "사실, 논쟁의 결여는 당사자 중 한 명이 너무 무력함을 느껴서 상대방과 직접 관계 맺기를 피한다는 것을 나타낼 수 있다.", "easy": "논쟁이 없다는 건 오히려, 한쪽이 너무 힘이 없다고 느껴서 상대와 직접 맞서기를 피하고 있다는 뜻일 수 있어요.", "gist": "선지 ⑤. 힘의 균형이 깨지면 논쟁 자체가 사라진다는 반대 경우로 마무리한다."}]}, {"no": "09", "typ": "글의 순서", "src": "2021년 4월 37번", "evn": [1, 2, 4, 5, 6, 8], "ev_en": "Birds use many techniques to save energy when they are flying, most of which are tricks to stay aloft without flapping. / When it reaches the top, the bird bends its wings and glides in the direction it wants to travel, searching for the next thermal. / Riding updrafts to gain altitude is one of the most conspicuous. / Bare ground such as fields or parking lots absorbs more heat from the sun, and as air near the ground warms up it rises. / This creates a column of rising warm air — a thermal — reaching hundreds or even thousands of feet high. / It simply fans its wings and tail and lets the rising air carry it up like an elevator.", "ev_ko": [[1, "[주어진 글] 새들은 날 때 에너지를 절약하기 위해 많은 기술을 사용하는데, 그것들의 대부분은 날갯짓 없이 높이 머무르는 속임수다."], [2, "(A) 새가 가장 높은 곳에 도달하면, 새는 날개를 구부리고 다음 상승 온난 기류를 찾아 그것이 이동하고자 하는 방향으로 활공한다."], [4, "(B) 고도를 얻기(높이기) 위해 상승 기류를 타는 것은 가장 뚜렷한 기술들 중 하나이다."], [5, "(B) 들판이나 주차장과 같은 맨땅은 태양으로부터 더 많은 열을 흡수하고, 지면 근처의 공기가 데워지면서 상승한다."], [6, "(C) 이것은 수백 혹은 심지어 수천 피트 상공에 이르는 따뜻한 공기의 기둥, 즉 ‘상승 온난 기류’를 만든다."], [8, "(C) 새는 단순히 날개와 꼬리를 펼치고 상승하는 공기가 그것을 엘리베이터처럼 위로 올려 주도록 한다."]], "why": ["주어진 글 (1)은 새들이 날 때 에너지를 절약하는 <b>많은 기술<\/b>을 쓴다고 말합니다", "(B)의 (4)는 그 기술 중 하나로 <b>상승 기류를 타는 것<\/b>을 꺼내므로 주어진 글 바로 뒤에 옵니다", "(B)의 (5)는 지면 근처의 공기가 데워지면서 <b>상승한다<\/b>고 합니다", "(C)의 (6) <b>This creates a column of rising warm air<\/b>의 This는 바로 이 현상을 가리킵니다", "(C)의 (8)에서 새는 상승하는 공기를 타고 엘리베이터처럼 위로 올라갑니다", "그래서 (A)의 (2) <b>When it reaches the top<\/b>(새가 가장 높은 곳에 도달하면)이 그 뒤에 이어집니다", "따라서 순서는 (B) – (C) – (A)입니다."], "ch": [{"n": "①", "t": "(A) – (C) – (B)", "g": "", "ok": false, "e": ["(A)의 (2) <b>When it reaches the top<\/b>은 새가 상승 온난 기류를 타고 꼭대기에 이른 뒤의 일입니다", "상승 기류 이야기가 나오기 전이라 (A)가 주어진 글 바로 뒤에 올 수 없습니다."]}, {"n": "②", "t": "(B) – (A) – (C)", "g": "", "ok": false, "e": ["(B) 뒤에 (A)가 오면, 새가 상승 온난 기류를 타고 올라가는 장면 없이 꼭대기에 이른다는 말이 됩니다", "또 (C)가 (A) 뒤에 오면, (C)의 <b>This<\/b>가 가리킬 '공기가 데워져 상승한다'는 내용이 바로 앞에 없게 됩니다."]}, {"n": "③", "t": "(B) – (C) – (A)", "g": "", "ok": true, "e": ["(B)에서 공기가 데워져 상승하고, (C)에서 그것이 상승 온난 기류를 만들어 새를 위로 올려 줍니다", "그리고 (A)에서 꼭대기에 이른 새가 다음 기류를 찾아 활공합니다."]}, {"n": "④", "t": "(C) – (A) – (B)", "g": "", "ok": false, "e": ["(C)의 <b>This<\/b>가 가리킬 내용이 주어진 글에는 없습니다", "공기가 데워져 상승한다는 (B)의 (5)가 먼저 나와야 합니다."]}, {"n": "⑤", "t": "(C) – (B) – (A)", "g": "", "ok": false, "e": ["(C)가 (B)보다 앞에 오면 <b>This<\/b>가 가리킬 대상이 없습니다", "또 기술 하나를 처음 소개하는 (B)의 (4)는 주어진 글 바로 뒤에 와야 합니다."]}], "tr": ["[주어진 글] 새들은 날 때 에너지를 절약하기 위해 많은 기술을 사용하는데, 그것들의 대부분은 날갯짓 없이 높이 머무르는 속임수다.", "(A) 새가 가장 높은 곳에 도달하면, 새는 날개를 구부리고 다음 상승 온난 기류를 찾아 그것이 이동하고자 하는 방향으로 활공한다.", "(A) 모든 비상하는 새들은 상승 온난 기류를 이용하나, 넓적날개말똥가리와 같은 어떤 종들은 전문가이고, 적절한 조건에서는 날갯짓을 거의 하지 않고 수백 마일을 이동할 수 있다.", "(B) 고도를 얻기(높이기) 위해 상승 기류를 타는 것은 가장 뚜렷한 기술들 중 하나이다.", "(B) 들판이나 주차장과 같은 맨땅은 태양으로부터 더 많은 열을 흡수하고, 지면 근처의 공기가 데워지면서 상승한다.", "(C) 이것은 수백 혹은 심지어 수천 피트 상공에 이르는 따뜻한 공기의 기둥, 즉 ‘상승 온난 기류’를 만든다.", "(C) 비상하는 새는 공기의 움직임을 감지할 수 있으며, 그 기둥(상승 온난 기류)에 머무르기 위해 원을 그리며 난다.", "(C) 새는 단순히 날개와 꼬리를 펼치고 상승하는 공기가 그것을 엘리베이터처럼 위로 올려 주도록 한다."], "ps": [{"n": 1, "ch": [{"e": "Birds use many <b>techniques<\/b>", "k": "새들은 많은 기술을 사용한다"}, {"e": "to save energy", "k": "에너지를 절약하기 위해"}, {"e": "when they are flying,", "k": "그들이 날 때,"}, {"e": "most of which are tricks", "k": "그것들<span class=\"r\">(= 기술들)<\/span>의 대부분은 속임수다"}, {"e": "to stay <b>aloft<\/b> without <b>flapping<\/b>.", "k": "날갯짓 없이 높이 머무르는."}], "link": "새들은 날 때 에너지를 절약하기 위해 많은 기술을 사용하는데, 그것들의 대부분은 날갯짓 없이 높이 머무르는 속임수다.", "easy": "새들은 날 때 힘을 아끼는 여러 방법을 쓰는데, 대부분은 날개를 퍼덕이지 않고 하늘에 떠 있는 요령이에요.", "gist": "주어진 글. 새가 에너지를 아끼는 ‘여러 기술’을 예고한다."}, {"n": 2, "ch": [{"e": "(A) When <b>it<\/b> reaches <b>the top<\/b>,", "k": "(A) 그것<span class=\"r\">(= 새)<\/span>이 가장 높은 곳에 도달하면,"}, {"e": "the bird ben "2", "pollen", "꽃가루"]], "lit": "그 나비들은 우리가 다른 식물들을 기르도록 도와준단다 / 왜냐하면 그것들이 꽃에서 꽃으로 꽃가루를 옮겨 주기 때문이야.", "nat": "그 나비들은 꽃에서 꽃으로 꽃가루를 옮겨 주기 때문에 우리가 다른 식물들을 기르는 데 도움을 준단다.", "ana": "<b>help + 목적어 + 동사원형</b>이 그대로 쓰인 문장이다. help는 목적격 보어로 <b>동사원형과 to부정사를 둘 다</b> 쓸 수 있는데, 실제 글에서는 <b>동사원형</b>이 훨씬 자주 나온다. 그래서 <b>grow</b>를 보고 '동사가 두 개인데?'라고 당황하지 않아야 한다. 여기서 <b>grow</b>는 '자라다'가 아니라 목적어 <b>some other plants</b>를 데리고 있으므로 '<b>기르다, 재배하다</b>'라는 <b>타동사</b>다. 같은 동사가 목적어 유무에 따라 뜻이 갈리는 대표적인 예다. 뒤의 <b>because</b>절은 주어 <b>they</b>가 나비를 가리키며, 이 문장이 이 글의 <b>주제(자연의 균형)</b>로 이어지는 다리 역할을 한다.", "pe": "The butterflies help us grow<sup>1</sup> some other plants / \u0001because they carry pollen<sup>2</sup> from flower to flower\u0002.", "pk": "그 나비들은 우리가 다른 식물들을 기르도록 도와준단다 / \u0001왜냐하면 그것들이 꽃에서 꽃으로 꽃가루를 옮겨 주기 때문이야\u0002.", "core": "나비들은 우리가 다른 식물들을 기르도록 도와준다.", "tags": ["주어 butterflies + 동사 help + 목적어 us + 목적격보어 grow some other plants: 5형식(help + 목적어 + 원형)", "(because …) = 부사절(이유): help를 꾸밈. carry A from B to C"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식) + 이유 부사절</b>이다. 뒤에 because절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The butterflies (그 나비들)", "V: help (help 돕다)", "O: us (우리)", "C: grow some other plants (다른 식물들을 기르다, 원형동사 grow)", "뼈대 = <b>The butterflies help us grow some other plants</b>", "help + 목적어 + 원형동사 = ~가 …하도록 돕다, plant = 식물"]}, {"t": "<b>because they carry pollen from flower to flower</b>는 <b>이유 부사절</b>로 help를 꾸민다. '그것들이 꽃에서 꽃으로 꽃가루를 옮겨 주기 때문에'.", "sub": ["S: they (= the butterflies, 그 나비들), V: carry (carry 옮기다), O: pollen (꽃가루)", "from A to B = A에서 B로, flower = 꽃"]}, {"t": "grow는 '자라다'가 아니라 여기서 '기르다'라는 타동사이다. 뒤에 목적어 plants가 있어서 알 수 있다."}], "sum": "나비는 꽃가루를 옮겨 다른 식물을 기르게 도움"}, {"i": "08", "q": "10", "s": "D-4", "title": "S+V+O(that절) + that절 안의 although절", "eng": "Grandma added<sup>1</sup> / that although she knew caterpillars<sup>2</sup> did harm to<sup>3</sup> cabbages, / she didn't wish to disturb<sup>4</sup> the natural balance of the environment.", "notes": [["1", "add that", "~라고 덧붙여 말하다"], ["2", "caterpillar", "애벌레"], ["3", "do harm to", "~에 해를 끼치다"], ["4", "disturb", "흐트러뜨리다, 방해하다"]], "lit": "할머니는 덧붙여 말했다 / 비록 애벌레가 양배추에 해를 끼친다는 것을 알고는 있지만, / 자연 환경의 균형을 흐트러뜨리고 싶지는 않다고.", "nat": "할머니는 애벌레가 양배추에 해를 끼친다는 것을 알고는 있지만 자연 환경의 균형을 흐트러뜨리고 싶지는 않다고 덧붙였다.", "ana": "동사 <b>added</b> 뒤에 <b>that</b>이 오면 '<b>~라고 덧붙여 말했다</b>'라는 <b>목적어 명사절</b>이다. 문제는 that 바로 뒤에 주어가 아니라 <b>although</b>가 나온다는 점이다. 즉 <b>that [although ~ , 주어 + 동사]</b>의 구조로, <b>양보절이 that절 안에 통째로 들어앉아</b> 있다. 이럴 때는 although절을 <b>먼저 괄호로 묶어 두고</b> that절의 진짜 주어·동사인 <b>she didn't wish</b>를 찾아야 한다. 접속사가 연달아 나오면 <b>어느 것이 큰 틀인지</b>부터 정하는 것이 순서다. <b>do harm to</b>는 '<b>~에 해를 끼치다</b>'라는 뜻이고, <b>disturb</b>는 '방해하다'뿐 아니라 '<b>(균형·상태를) 흐트러뜨리다</b>'라는 뜻으로도 쓰인다.", "pe": "Grandma added<sup>1</sup> / that \u0001although she knew caterpillars<sup>2</sup> did harm to<sup>3</sup> cabbages\u0002, / she didn't wish to disturb<sup>4</sup> the \u0001natural\u0002 balance \u0001of the environment\u0002.", "pk": "할머니는 덧붙여 말했다 / \u0001비록 애벌레가 양배추에 해를 끼친다는 것을 알고는 있지만\u0002, / \u0001자연 환경의\u0002 균형을 흐트러뜨리고 싶지는 않다고.", "core": "할머니는 덧붙여 말했다. 그녀는 균형을 흐트러뜨리고 싶지 않다고.", "tags": ["주어 Grandma + 동사 added + 목적어 that절(<b>명사절</b>): 3형식", "that절 안: (although she knew …) = 부사절(양보): didn't wish를 꾸밈. knew의 목적어 = caterpillars did harm(명사절), do harm to = ~에 해를 끼치다", "주어 she + 동사 didn't wish + 목적어 to disturb the balance: 3형식. (natural) = 형용사: balance를 꾸밈, (of the environment) = 전치사구(형용사구): balance를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 that절 안에 although 양보절이 앞에 놓여 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Grandma (할머니)", "V: added (add 덧붙여 말하다의 과거형)", "O: that절 (명사절, 덧붙인 내용)", "뼈대 = <b>Grandma added that ~</b>"]}, {"t": "that절의 뼈대는 <b>she didn't wish to disturb the natural balance of the environment</b>이다.", "sub": ["S: she (= Grandma), V: didn't wish (wish 바라다), O: to disturb the natural balance (자연의 균형을 흐트러뜨리는 것)", "disturb = 흐트러뜨리다, balance = 균형, environment = 환경", "natural (자연의)은 balance를 꾸미는 형용사, of the environment는 balance를 꾸미는 형용사구이다."]}, {"t": "that절 맨 앞 <b>although she knew caterpillars did harm to cabbages</b>는 <b>양보 부사절</b>이다. '애벌레가 양배추에 해를 끼친다는 것을 알고는 있지만'이라는 뜻이다.", "sub": ["although = 비록 ~이지만, caterpillar = 애벌레, cabbage = 양배추", "do harm to = ~에 해를 끼치다, knew는 know 알다의 과거형이다. 그 목적어가 caterpillars did harm to cabbages이다."]}], "sum": "할머니, 애벌레가 해로운 줄 알아도 자연 균형은 안 깨고 싶어 함"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2020학년도 6월 31번", "ans": "②", "tr": [["1", "어떤 사람들은 야생동물 피해 관리를 과잉으로 많은 종을 다루는 과학이자 관리라고 정의해 왔지만, 이 정의는 너무 좁다."], ["2", "모든 야생동물 종은 인간의 이익에 해를 끼치는 방식으로 행동한다."], ["3", "따라서 과잉으로 많은 종만이 아니라 모든 종이 야생동물 피해를 일으킨다."], ["4", "이것의 흥미로운 예로 캘리포니아의 멸종 위기종인 송골매가 있는데, 이 송골매는 또 다른 멸종 위기종인 캘리포니아 작은제비갈매기를 잡아먹는다."], ["5", "분명히 우리는 송골매가 과잉으로 많다고 여기지는 않겠지만, 그것이 멸종 위기종을 먹고 살지 않기를 바란다."], ["6", "이 경우에 송골매 개체군과 관련된 부정적 가치 가운데 하나는 그 포식이 또 다른 멸종 위기종의 개체 수를 줄인다는 점이다."], ["7", "이 경우 야생동물 피해 관리의 목표는 송골매를 ______ 하지 않으면서 송골매가 제비갈매기를 잡아먹는 것을 멈추게 하는 일이 될 것이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Certainly, we would not consider peregrine falcons as being overabundant, but we wish that they would not feed on an endangered species."}, {"en": false, "h": "빈칸 문장은 <b>stop the falcons from eating the terns without ______ the falcons</b>이다. <b>without</b> 뒤에는 '<b>피하고 싶은 일</b>'이 들어간다. 그러면 무엇을 피하고 싶은가. 5번 문장이 답을 준다. 송골매 역시 <b>endangered</b>(멸종 위기)이고, 우리는 송골매가 과잉이라고 보지도 않는다. 즉 <b>송골매 자체는 지켜야 할 대상</b>이다. 그러므로 제비갈매기를 구하되 송골매에게는 <b>해를 입히지 않아야</b> 한다. 답은 ② <b>harming</b>이다. 빈칸이 <b>without</b> 뒤에 있으면 앞뒤 흐름에서 '<b>하면 안 되는 것</b>'을 찾아야지, 그럴듯한 해결책을 찾으면 안 된다. ①·③·⑤처럼 '복제·훈련·가축화' 같은 <b>구체적 조치</b>는 글에 근거가 한 줄도 없다."}], "opts": [{"n": "①", "t": "cloning (복제하기)", "a": false, "x": true, "trap": false, "e": "복제라는 기술적 조치는 글에 전혀 없다. 게다가 without cloning(복제하지 않으면서)이라는 조건 자체가 문맥상 의미가 없다."}, {"n": "②", "t": "harming (해를 끼치기)", "a": true, "x": false, "trap": false, "e": "4·5번 문장에서 송골매도 <b>멸종 위기종</b>이며 과잉이 아니라고 했다. 그러므로 제비갈매기를 지키되 송골매에게 <b>해를 끼치지 않는</b> 것이 목표가 된다."}, {"n": "③", "t": "training (훈련시키기)", "a": false, "x": true, "trap": false, "e": "야생 맹금을 훈련한다는 발상은 글에 없다. 이 글은 <b>관리의 정의</b>를 넓히는 데 초점이 있지 구체적 기법을 논하지 않는다."}, {"n": "④", "t": "overfeeding (먹이를 지나치게 주기)", "a": false, "x": true, "trap": true, "e": "5번 문장의 <b>feed on</b>에서 feed만 눈에 남으면 걸린다. 그러나 without overfeeding(과다 급여를 하지 않으면서)은 앞의 '잡아먹는 것을 막는다'와 논리적으로 이어지지 않는다."}, {"n": "⑤", "t": "domesticating (가축화하기)", "a": false, "x": true, "trap": false, "e": "가축화는 야생동물 피해 관리의 논점이 아니며, 멸종 위기종을 가축화한다는 언급도 없다."}], "w": [["define A as B", "A를 B라고 정의하다"], ["overabundant", "과잉으로 많은"], ["narrow", "좁은, 편협한"], ["human interests", "인간의 이익"], ["endangered species", "멸종 위기종"], ["peregrine falcon", "송골매"], ["prey on", "~을 잡아먹다"], ["least tern", "작은제비갈매기"], ["feed on", "~을 먹고 살다"], ["associated with", "~와 관련된"], ["predation", "포식, 잡아먹기"], ["stop A from ~ing", "A가 ~하지 못하게 막다"]]}, {"q": "08", "type": "무관한 문장", "src": "2020년 7월 35번", "ans": "③", "tr": [["1", "논증은 '이유 대기', 즉 그 사안에 대한 자기 편의 입장을 남에게 납득시키려는 시도이다."], ["2", "사람은 주장을 하고 그것을 뒷받침한다."], ["3", "논쟁하는 사람은 자신의 믿음이나 행동이 옳다는 것을 다른 사람들이 인정하게 만들려고 한다."], ["4", "① 그러므로 대인 간 논증은 우리의 일상적인 갈등과 협상에서 한자리를 차지한다."], ["5", "② 대인 간 논쟁의 긍정적인 특징 중 하나는, 자기 믿음에 대한 이유를 제시할 만큼 충분히 힘이 있다고 느끼는 두 사람이 주고받는 말로 이루어져 있다는 점이다."], ["6", "③ 그렇기 때문에 한 사람은 우월감을 드러내고 다른 한 사람은 결국 자신의 열등함을 깨닫게 된다."], ["7", "④ 두 사람이 논쟁하고 있다면, 그것은 그들이 계속 나아갈 만큼 힘에서(또는 힘의 균형을 회복하려는 욕구에서) 충분히 균형이 잡혀 있기 때문이다."], ["8", "⑤ 사실 논쟁의 부재는 당사자 중 한 사람이 너무 무력하다고 느껴서 상대와 직접 맞붙기를 피한다는 것을 보여 줄 수도 있다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "That's why one person reveals a sense of superiority and the other ends up realizing his or her inferiority."}, {"en": false, "h": "이 글의 축은 <b>힘의 균형</b>이다. ②는 <b>two people who feel powerful enough</b>(둘 다 충분히 힘이 있다고 느끼는 두 사람), ④는 <b>balanced enough in power</b>(힘에서 충분히 균형이 잡힌), ⑤는 <b>so powerless that he or she avoids</b>(너무 무력해서 피한다)로, 세 문장 모두 '<b>논쟁은 힘이 대등할 때 일어난다</b>'는 하나의 주장을 떠받친다. 그런데 ③만 <b>superiority</b>와 <b>inferiority</b>, 즉 <b>우열이 갈린다</b>고 말한다. 대등함을 말하는 글에 <b>서열</b>을 끌어들였으니 방향이 정반대다. 게다가 ③의 <b>That's why</b>는 앞 문장의 결과를 받는 표현인데, ②에서 ③이 도출되지도 않는다. 무관 문장 문항은 <b>같은 낱말이 나오는지</b>가 아니라 <b>주장의 방향이 같은지</b>로 골라야 한다."}], "opts": [{"n": "①", "t": "대인 간 논증은 일상의 갈등과 협상에서 한자리를 차지한다.", "a": false, "x": true, "trap": false, "e": "3번 문장까지 정리한 논증의 정의를 <b>일상</b> 장면으로 옮기는 연결 문장이다. <b>then</b>이 그 이음새 역할을 한다."}, {"n": "②", "t": "논쟁은 충분히 힘이 있다고 느끼는 두 사람의 주고받음이다.", "a": false, "x": true, "trap": false, "e": "글 전체의 핵심 전제인 <b>대등한 힘</b>을 처음 제시하는 문장이다. 이 문장이 없으면 ④·⑤가 성립하지 않는다."}, {"n": "③", "t": "한 사람은 우월감을 드러내고 다른 한 사람은 열등함을 깨닫는다.", "a": true, "x": false, "trap": false, "e": "앞뒤가 모두 <b>힘의 대등함</b>을 말하는데 이 문장만 <b>우열</b>을 말한다. 주장의 방향이 반대이므로 전체 흐름과 무관하다."}, {"n": "④", "t": "논쟁이 일어나는 것은 힘이 충분히 균형 잡혀 있기 때문이다.", "a": false, "x": true, "trap": false, "e": "②의 <b>powerful enough</b>를 <b>balanced enough in power</b>로 바꿔 다시 말한 문장이다. 같은 주장의 반복 강화다."}, {"n": "⑤", "t": "논쟁의 부재는 한쪽이 너무 무력함을 보여 줄 수 있다.", "a": false, "x": true, "trap": true, "e": "같은 원리를 <b>반대 상황</b>에 적용해 마무리하는 문장이다. 균형이 깨지면 논쟁 자체가 사라진다는 결론이다."}], "w": [["reason giving", "이유 대기"], ["convince A of B", "A에게 B를 확신시키다"], ["back A up", "A를 뒷받침하다"], ["arguer", "논쟁하는 사람"], ["rightness", "옳음, 정당함"], ["interpersonal", "대인 간의"], ["negotiation", "협상"], ["be comprised of", "~으로 구성되다"], ["set forth", "제시하다, 내놓다"], ["superiority", "우월감"], ["inferiority", "열등함"], ["engage with", "~와 맞붙다"]]}, {"q": "09", "type": "글의 순서", "src": "2021년 4월 37번", "ans": "③", "tr": [["1", "[주어진 글] 새들은 날 때 에너지를 아끼기 위해 여러 기법을 사용하는데, 그 대부분은 날갯짓 없이 공중에 떠 있기 위한 요령이다."], ["2", "[B] 고도를 얻기 위해 상승 기류를 타는 것이 가장 뚜렷한 방법 가운데 하나다."], ["3", "[B] 들판이나 주차장 같은 맨땅은 태양으로부터 더 많은 열을 흡수하고, 지면 근처의 공기가 따뜻해지면 그 공기는 상승한다."], ["4", "[C] 이것이 수백 피트, 심지어 수천 피트 높이까지 이르는 상승하는 따뜻한 공기 기둥, 즉 상승 온난 기류를 만들어 낸다."], ["5", "[C] 활공하는 새는 그 공기의 움직임을 감지하고 그 기둥 안에 머물기 위해 원을 그리며 날 수 있다."], ["6", "[C] 새는 그저 날개와 꼬리를 펼친 채, 상승하는 공기가 자신을 엘리베이터처럼 위로 실어 올리도록 맡겨 둘 뿐이다."], ["7", "[A] 꼭대기에 이르면, 새는 날개를 구부려 자신이 가고 싶은 방향으로 활공하면서 다음 상승 온난 기류를 찾는다."], ["8", "[A] 활공하는 새는 모두 상승 온난 기류를 이용하지만, 넓적날개말똥가리 같은 몇몇 종은 특히 전문가여서 조건만 맞으면 날갯짓을 거의 하지 않고도 수백 마일을 이동할 수 있다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "This creates a column of rising warm air — a thermal — reaching hundreds or even thousands of feet high."}, {"en": false, "h": "순서 문항은 <b>지시어와 대명사</b>가 전부다. 주어진 글은 '<b>여러 기법</b>'을 예고하므로, 그중 하나를 꺼내며 <b>one of the most conspicuous</b>라고 말하는 (B)가 먼저 온다. (C)의 첫 단어 <b>This</b>가 결정적이다. This가 가리키는 것은 <b>(B) 마지막의 '따뜻해진 공기가 상승한다'</b>는 현상이며, 그래야 '<b>이것이 상승 온난 기류 기둥을 만든다</b>'가 성립한다. (A)를 (C) 앞에 두면 This가 받을 대상이 없다. 마지막으로 (A)의 첫 문장 <b>When it reaches the top</b>의 <b>the top</b>은 (C)에서 만들어진 <b>공기 기둥의 꼭대기</b>이고, <b>searching for the next thermal</b>의 <b>next</b>는 앞에 thermal이 이미 나왔다는 뜻이다. 따라서 (B) → (C) → (A)다."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)의 <b>When it reaches the top</b>이 무엇의 꼭대기인지 알 수 없다. thermal이라는 말이 아직 나오지 않았는데 <b>the next thermal</b>이라고 하는 것도 불가능하다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(A) 뒤에 (C)가 오면 (C)의 <b>This</b>가 (A)의 '방향을 틀어 활공한다'를 받게 되는데, 그것이 <b>공기 기둥을 만든다</b>는 말은 성립하지 않는다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": true, "x": false, "trap": false, "e": "(B)의 '지면이 데워져 공기가 상승한다' → (C)의 <b>This creates a column of rising warm air</b> → (A)의 <b>When it reaches the top</b>으로 지시어가 끊김 없이 이어진다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": true, "e": "(C)가 맨 앞에 오면 <b>This</b>가 받을 앞 내용이 주어진 글의 '여러 기법'뿐인데, 기법이 공기 기둥을 만든다는 말은 어색하다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": false, "x": true, "trap": false, "e": "(C)에서 이미 thermal을 설명해 놓고 (B)에서 다시 <b>상승 기류를 타는 것</b>을 처음 소개하듯 말하는 것은 순서가 뒤집힌 것이다."}], "w": [["aloft", "높이, 공중에"], ["flap", "날개를 퍼덕이다"], ["updraft", "상승 기류"], ["altitude", "고도"], ["conspicuous", "뚜렷한, 눈에 잘 띄는"], ["bare ground", "맨땅, 헐벗은 땅"], ["absorb", "흡수하다"], ["thermal", "상승 온난 기류"], ["soar", "활공하다, 높이 날다"], ["fan", "펼치다, 부채처럼 펴다"], ["glide", "활공하다, 미끄러지듯 날다"], ["take advantage of", "~을 이용하다"]]}, {"q": "10", "type": "장문 · 순서", "src": "2019학년도 수능 43번", "ans": "②", "tr": [["1", "[A] Olivi function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}

var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸이 <b>without</b>(~하지 않고) 뒤에 있어요. 그럴듯한 해결책이 아니라 <b>피해야 할 일</b>을 찾으세요. 단서는 송골매도 <b>멸종 위기종</b>이라는 점이에요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (7번)</span><div class=\"en\">The goal … would be to stop the falcons from eating the terns <mark>without</mark> <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span> the falcons.</span></div><p class=\"ko\">송골매에게 ( ? ) <mark>않고서</mark> 송골매가 제비갈매기를 잡아먹지 못하게 막는 것</p></div><div class=\"ck-via\"><i>▼</i><span>빈칸 문장의 송골매가 어떤 새인지 앞에서 확인</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 둘 다 멸종 위기</span><div class=\"en\">One interesting example of this involves <mark>endangered peregrine falcons</mark> in California, which prey on another endangered species …</div><p class=\"ko\">캘리포니아의 <mark>멸종 위기에 처한 송골매</mark>와 관련이 있는데, 그것들은 또 다른 멸종 위기종을 잡아먹는다 …</p></div><div class=\"ck-via\"><i>▼</i><span>송골매는 숫자가 넘치는 새가 아니라 지켜야 할 새</span></div><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 결정적 단서</span><div class=\"en\">Certainly, we would <mark>not consider peregrine falcons as being overabundant</mark>, but we wish that they would not feed on an endangered species.</div><p class=\"ko\">분명히, 우리는 송골매를 <mark>과잉된 것으로</mark> 간주하지 않을 것이다, 하지만 그것들이 멸종 위기종을 먹이로 삼지 않기를 바란다.</p></div><div class=\"ck-via\"><i>▼</i><span>막을 것은 송골매가 아니라 송골매의 ‘잡아먹기’</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · 막아야 할 것</span><div class=\"en\">… one of the negative values associated with a peregrine falcon population is that <mark>its predation</mark> reduces the population of another endangered species.</div><p class=\"ko\">… 부정적인 가치들 중 하나는 <mark>그것의 포식</mark>이 또 다른 멸종 위기종의 개체 수를 줄인다는 것이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">harming 해를 끼치기<small>송골매도 멸종 위기라서, 잡아먹기만 막고 송골매는 다치게 하면 안 돼요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">training 훈련시키기</span><span class=\"why\">훈련으로 못 먹게 한다는 해결책처럼 들리지만, without(~하지 않고) 뒤엔 피해야 할 일이 와요. 훈련 얘기는 지문에 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">cloning 복제하기</span><span class=\"why\">복제 이야기는 지문에 한 줄도 없어요. 4·5번은 두 멸종 위기종을 함께 지키는 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">overfeeding 먹이를 지나치게 주기</span><span class=\"why\">5번의 overabundant(과잉된)는 먹이가 아니라 개체 수 얘기예요. 먹이 주기는 지문 어디에도 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">domesticating 가축화하기</span><span class=\"why\">가축으로 길들이는 이야기가 없어요. 7번 목표는 제비갈매기를 지키면서 송골매도 그대로 두는 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Some people have defined wildlife damage management</div><div class=\"k\">몇몇 사람들은 야생 동물 피해 관리를 정의해 왔다</div></div><div class=\"rc\"><div class=\"e\">as the science and management of overabundant species,</div><div class=\"k\">과잉 종들에 대한 과학과 관리로,</div></div><div class=\"rc\"><div class=\"e\">but this definition is too narrow.</div><div class=\"k\">하지만 이러한 정의는 너무 좁다.</div></div><div class=\"rnat\">몇몇 사람들은 야생 동물 피해 관리를 과잉 종들에 대한 과학과 관리로 정의해 왔지만, 이러한 정의는 너무 좁다.</div><div class=\"rst\">어떤 사람은 “동물 말썽 관리 = 숫자가 너무 많은 동물 관리”라고 해요. 하지만 지문은 이 정의가 <b>너무 좁다</b>고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">All wildlife species act</div><div class=\"k\">모든 야생 동물 종들은 행동한다</div></div><div class=\"rc\"><div class=\"e\">in ways that harm human interests.</div><div class=\"k\">인간의 이익에 해를 끼치는 방식으로.</div></div><div class=\"rnat\">모든 야생 동물 종들은 인간의 이익에 해를 끼치는 방식으로 행동한다.</div><div class=\"rst\">우리 집 고양이는 딱 한 마리인데도 화분을 엎어요. = 지문의 모든 야생 동물이 사람에게 해를 끼친다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Thus,</div><div class=\"k\">따라서</div></div><div class=\"rc\"><div class=\"e\">all species cause wildlife damage,</div><div class=\"k\">모든 종들이 야생 동물 피해를 야기한다,</div></div><div class=\"rc\"><div class=\"e\">not just overabundant ones.</div><div class=\"k\">단지 과잉인 것들(= 종들)뿐만이 아니라.</div></div><div class=\"rnat\">따라서 단지 과잉 종뿐만이 아니라, 모든 종들이 야생 동물 피해를 야기한다.</div><div class=\"rst\">그래서 숫자가 많은 동물만이 아니라, <b>모든 동물</b>이 말썽을 일으킬 수 있어요. = 지문 3번이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">One interesting example of this</div><div class=\"k\">이것(= 모든 종이 피해를 일으킨다는 것)의 한 가지 흥미로운 예시는</div></div><div class=\"rc ckc\"><div class=\"e\">involves <span class=\"cw\">endangered peregrine falcons</span> in California,</div><div class=\"k\">캘리포니아의 <span class=\"cw\">멸종 위기에 처한 송골매</span>와 관련이 있는데,</div></div><div class=\"rc\"><div class=\"e\">which prey on another endangered species,</div><div class=\"k\">그것들(= 송골매)은 또 다른 멸종 위기종을 잡아먹는다,</div></div><div class=\"rc\"><div class=\"e\">the California least tern.</div><div class=\"k\">(즉) 캘리포니아 작은 제비갈매기를.</div></div><div class=\"rnat\">이것의 한 가지 흥미로운 예시는 캘리포니아의 멸종 위기에 처한(멸종 위기종인) 송골매와 관련이 있는데, 이들은 또 다른 멸종 위기종, (즉) 캘리포니아 작은 제비갈매기를 잡아먹는다.</div><div class=\"rst\">예를 들어 소중한 우리 고양이가 똑같이 소중한 금붕어를 노려요. = 멸종 위기 송골매가 멸종 위기 제비갈매기를 잡아먹는 것.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">Certainly,</div><div class=\"k\">분명히,</div></div><div class=\"rc\"><div class=\"e\">we would not consider peregrine falcons</div><div class=\"k\">우리는 송골매를 간주하지 않을 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">as being overabundant</span>,</div><div class=\"k\"><span class=\"cw\">과잉된 것으로</span>,</div></div><div class=\"rc\"><div class=\"e\">but we wish</div><div class=\"k\">하지만 우리는 바란다</div></div><div class=\"rc\"><div class=\"e\">that they would not feed on an endangered species.</div><div class=\"k\">그것들(= 송골매)이 멸종 위기종을 먹이로 삼지 않기를.</div></div><div class=\"rnat\">분명히, 우리는 송골매를 과잉된 것(과잉 종)으로 간주하지 않을 것이지만, 우리는 그들이 멸종 위기종을 먹이로 삼지 않기를 바란다.</div><div class=\"rst\"><b>고양이가 너무 많은 건 아니에요</b>(한 마리뿐). 그래도 금붕어는 안 먹었으면 해요. = 송골매도 지켜야 할 새라는 지문 5번.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">In this case,</div><div class=\"k\">이 경우에,</div></div><div class=\"rc\"><div class=\"e\">one of the negative values</div><div class=\"k\">부정적인 가치들 중 하나는</div></div><div class=\"rc\"><div class=\"e\">associated with a peregrine falcon population</div><div class=\"k\">송골매 개체 수와 관련된</div></div><div class=\"rc\"><div class=\"e\">is that its predation reduces</div><div class=\"k\">그것(= 송골매 개체군)의 포식이 줄인다는 것이다</div></div><div class=\"rc\"><div class=\"e\">the population of another endangered species.</div><div class=\"k\">또 다른 멸종 위기종의 개체 수를.</div></div><div class=\"rnat\">이 경우에, 송골매 개체 수와 관련된 부정적인 가치들 중 하나는, 그것의 포식이 또 다른 멸종 위기종의 개체 수를 줄인다는 것이다.</div><div class=\"rst\">이때 고양이의 문제점은 딱 하나, 금붕어 수를 줄인다는 거예요. = 송골매의 포식이 다른 멸종 위기종을 줄인다는 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The goal of wildlife damage management</div><div class=\"k\">야생 동물 피해 관리의 목표는</div></div><div class=\"rc\"><div class=\"e\">in this case</div><div class=\"k\">이 경우에</div></div><div class=\"rc\"><div class=\"e\">would be to stop the falcons from eating the terns</div><div class=\"k\">송골매가 제비갈매기를 잡아먹지 못하게 막는 일일 것이다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">without harming</span></div><div class=\"k\"><span class=\"cw\">해를 끼치지 않고서</span> ※ 문제지엔 빈칸으로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">the falcons.</div><div class=\"k\">송골매에게.</div></div><div class=\"rnat\">이 경우에 야생 동물 피해 관리의 목표는, 송골매에게 해를 끼치지 않고서 송골매가 (캘리포니아 작은) 제비갈매기를 잡아먹지 못하게 막는 일일 것이다.</div><div class=\"rst\">그래서 목표는 고양이를 <b>다치게 하지 않고</b> 어항에 뚜껑만 덮는 거예요. 빈칸 = harming(해를 끼치기)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"overabundant\" data-m=\"과잉으로 많은\"><b>overabundant</b>과잉으로 많은</button><button type=\"button\" class=\"wdb\" data-w=\"endangered species\" data-m=\"멸종 위기종\"><b>endangered species</b>멸종 위기종</button><button type=\"button\" class=\"wdb\" data-w=\"prey on\" data-m=\"~을 잡아먹다\"><b>prey on</b>~을 잡아먹다</button><button type=\"button\" class=\"wdb\" data-w=\"feed on\" data-m=\"~을 먹고 살다\"><b>feed on</b>~을 먹고 살다</button><button type=\"button\" class=\"wdb\" data-w=\"predation\" data-m=\"포식, 잡아먹기\"><b>predation</b>포식, 잡아먹기</button><button type=\"button\" class=\"wdb\" data-w=\"associated with\" data-m=\"~와 관련된\"><b>associated with</b>~와 관련된</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 잡고 하나씩 대 보는 문제예요. 이 글은 <b>논쟁은 힘이 대등한 두 사람 사이에서 일어난다</b>는 이야기예요. 혼자만 <b>우열</b>(누가 위·아래)을 말하는 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">1번 · 글의 화제</span><div class=\"en\"><mark>Argument is “reason giving”</mark>, trying to convince others of your side of the issue.</div><p class=\"ko\"><mark>논쟁은 ‘이유를 대는 것’이다</mark>, 다른 사람들에게 쟁점에 관한 당신의 입장을 납득시키려고 노력하면서.</p></div><div class=\"ck-via\"><i>▼</i><span>논쟁의 좋은 점 = 두 사람 모두 이유를 댈 만큼 힘이 있다고 느낌</span></div><div class=\"ck-step\"><span class=\"lab\">②(5번) · 힘이 충분한 두 사람</span><div class=\"en\">… they are comprised of exchanges between two people who <mark>feel powerful enough</mark> to set forth reasons for their beliefs.</div><p class=\"ko\">… 자신들의 믿음에 대한 이유를 제시할 만큼 <mark>충분히 강하다고 느끼는</mark> 두 사람 간의 언쟁으로 구성되어 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>‘둘 다 대등’ 이야기가 갑자기 ‘한쪽이 위, 한쪽이 아래’로 뒤집힘</span></div><div class=\"ck-step key\"><span class=\"lab\">③(6번) · 이탈 지점</span><div class=\"en\">That’s why one person reveals <mark>a sense of superiority</mark> and the other ends up realizing his or her <mark>inferiority</mark>.</div><p class=\"ko\">그것이 한 사람은 <mark>우월성을 드러내고</mark> 다른 한 사람은 결국 자신의 <mark>열등함을</mark> 깨닫게 되는 이유이다.</p></div><div class=\"ck-via\"><i>▼</i><span>③을 빼면 ②의 ‘충분히 강한 두 사람’ → ④의 ‘힘의 균형’으로 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">④(7번) · 다시 제자리</span><div class=\"en\">If two people are arguing, it is because they are <mark>balanced enough in power</mark> …</div><p class=\"ko\">만일 두 사람이 논쟁하고 있다면, 그것은 그들이 힘에 있어서 <mark>충분히 균형을 이루고</mark> 있기 때문이다 …</p></div><div class=\"ck-via\"><i>▼</i><span>논쟁이 없으면 한쪽이 너무 약하다는 뜻 = 같은 주장을 반대쪽에서 확인</span></div><div class=\"ck-step\"><span class=\"lab\">⑤(8번) · 뒤집어 확인</span><div class=\"en\">Lack of argument, in fact, may show that one of the parties feels <mark>so powerless</mark> that he or she avoids engaging directly with the other.</div><p class=\"ko\">사실, 논쟁의 결여는 당사자 중 한 명이 <mark>너무 무력함을 느껴서</mark> 상대방과 직접 관계 맺기를 피한다는 것을 나타낼 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">한 사람은 우월감을 드러내고 다른 한 사람은 열등함을 깨닫는다<small>힘이 대등하다는 글에 혼자 우열(위·아래)을 끌어들여 방향이 반대예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">논쟁의 부재는 한쪽이 너무 무력함을 보여 줄 수 있다</span><span class=\"why\">powerless(무력한)라는 부정적인 말 때문에 튀어 보이지만, 논쟁이 없을 때를 들어 ‘논쟁은 힘이 대등할 때 생긴다’는 7번 주장을 반대쪽에서 확인해 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">대인 간 논증은 일상의 갈등과 협상에서 한자리를 차지한다</span><span class=\"why\">then(그렇기에)으로 1~3번의 ‘이유를 대며 설득하기’를 받아, 논쟁이 일상 속 갈등·협상에 있다고 정리해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">논쟁은 충분히 힘이 있다고 느끼는 두 사람의 주고받음이다</span><span class=\"why\">feel powerful enough(충분히 강하다고 느끼는)로 이 글의 핵심인 ‘두 사람 모두 힘이 있다’를 처음 꺼내요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">논쟁이 일어나는 것은 힘이 충분히 균형 잡혀 있기 때문이다</span><span class=\"why\">balanced enough in power(힘에서 충분히 균형 잡힌)로 ②의 ‘두 사람 모두 강하다’를 그대로 이어 가요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Argument is “reason giving”,</div><div class=\"k\">논쟁은 ‘이유를 대는 것’이다,</div></div><div class=\"rc\"><div class=\"e\">trying to convince others</div><div class=\"k\">다른 사람들에게 납득시키려고 노력하면서</div></div><div class=\"rc\"><div class=\"e\">of your side of the issue.</div><div class=\"k\">쟁점에 관한 당신의 입장을.</div></div><div class=\"rnat\">논쟁이란 다른 사람들에게 쟁점에 관한 당신의 입장을 납득시키려고 노력하면서 ‘이유를 대는 것’이다.</div><div class=\"rst\">쉬는 시간에 친구 둘이 “급식 1등 메뉴는 뭐냐”로 다퉈요. 각자 이유를 대며 설득하죠. = 지문의 논쟁은 <b>이유 대기</b>예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">One makes claims</div><div class=\"k\">사람은 주장을 하고</div></div><div class=\"rc\"><div class=\"e\">and backs them up.</div><div class=\"k\">그것들(= 주장)을 뒷받침한다.</div></div><div class=\"rnat\">사람은 주장을 하고 그것을 뒷받침한다.</div><div class=\"rst\">“돈가스가 최고야, 왜냐면…” 하고 주장하고 이유로 받쳐 줘요. = 지문의 주장을 하고 뒷받침하기예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The arguer tries to get others</div><div class=\"k\">논쟁자는 다른 사람들이 ~하도록 하기 위해 노력한다</div></div><div class=\"rc\"><div class=\"e\">to “recognize the rightness”</div><div class=\"k\">‘정당성을 인정’하도록</div></div><div class=\"rc\"><div class=\"e\">of his or her beliefs or actions.</div><div class=\"k\">자신의 믿음이나 행동의.</div></div><div class=\"rnat\">논쟁자는 다른 사람들이 자신의 믿음이나 행동의 ‘정당성을 인정’하도록 하기 위해 노력한다.</div><div class=\"rst\">서로 “내 말이 맞다”고 인정받고 싶어 해요. = 지문의 정당성을 인정받으려는 논쟁자예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Interpersonal argumentation,</div><div class=\"k\">사람 간의 논쟁은,</div></div><div class=\"rc\"><div class=\"e\">then,</div><div class=\"k\">그렇기에,</div></div><div class=\"rc\"><div class=\"e\">has a place in our everyday conflicts and negotiations.</div><div class=\"k\">우리의 일상적인 갈등이나 협상에 존재한다.</div></div><div class=\"rnat\">그렇기에 사람 간의 논쟁은 우리의 일상적인 갈등이나 협상에 존재한다.</div><div class=\"rst\">① 이런 말다툼은 교실, 집 어디서나 늘 있어요. = 지문의 일상 속 갈등·협상에 논쟁이 있다는 말이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">One of the positive features</div><div class=\"k\">긍정적인 특징 중 한 가지는</div></div><div class=\"rc\"><div class=\"e\">of interpersonal arguments</div><div class=\"k\">사람 간의 논쟁에서</div></div><div class=\"rc\"><div class=\"e\">is that they are comprised of exchanges</div><div class=\"k\">그것들(= 사람 간의 논쟁)이 언쟁으로 구성되어 있다는 것이다</div></div><div class=\"rc\"><div class=\"e\">between two people</div><div class=\"k\">두 사람 간의</div></div><div class=\"rc ckc\"><div class=\"e\">who <span class=\"cw\">feel powerful enough</span></div><div class=\"k\"><span class=\"cw\">충분히 강하다고 느끼는</span></div></div><div class=\"rc\"><div class=\"e\">to set forth reasons for their beliefs.</div><div class=\"k\">자신들의 믿음에 대한 이유를 제시할 만큼.</div></div><div class=\"rnat\">사람 간의 논쟁에서 긍정적인 특징 중 한 가지는 논쟁이 자신들의 믿음에 대한 이유를 제시할 만큼 충분히 강하다고 느끼는 두 사람 간의 언쟁으로 구성되어 있다는 것이다.</div><div class=\"rst\">② 좋은 점은 둘 다 “나도 내 생각 말할 수 있어” 하고 <b>힘이 있다고 느낀다</b>는 거예요. = 지문 5번이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc\"><div class=\"e\">That’s why</div><div class=\"k\">그것이 ~하는 이유이다</div></div><div class=\"rc ckc\"><div class=\"e\">one person reveals <span class=\"cw\">a sense of superiority</span></div><div class=\"k\">한 사람은 <span class=\"cw\">우월성을 드러내고</span></div></div><div class=\"rc\"><div class=\"e\">and the other ends up realizing</div><div class=\"k\">다른 한 사람은 결국 깨닫게 되는</div></div><div class=\"rc\"><div class=\"e\">his or her inferiority.</div><div class=\"k\">자신의 열등함을.</div></div><div class=\"rnat\">그것이 한 사람은 우월성을 드러내고 다른 한 사람은 결국 자신의 열등함을 깨닫게 되는 이유이다.</div><div class=\"rst\">③ 갑자기 “한 명은 잘난 척, 한 명은 기가 죽는다”는 말이 나와요. 대등한 두 친구 얘기에 <b>위·아래</b>가 끼어들어 튀어요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">If two people are arguing,</div><div class=\"k\">만일 두 사람이 논쟁하고 있다면,</div></div><div class=\"rc ckc\"><div class=\"e\">it is because they are <span class=\"cw\">balanced enough in power</span></div><div class=\"k\">그것은 그들이 힘에 있어서 <span class=\"cw\">충분히 균형을 이루고</span> 있기 때문이다</div></div><div class=\"rc\"><div class=\"e\">(or in their desire to reestablish a power balance)</div><div class=\"k\">(혹은 힘의 균형을 회복하려는 욕구에 있어서)</div></div><div class=\"rc\"><div class=\"e\">to proceed.</div><div class=\"k\">(논쟁을) 이어 나갈 만큼.</div></div><div class=\"rnat\">만일 두 사람이 논쟁하고 있다면, 그것은 그들이 (논쟁을) 이어 나갈 만큼 힘에 있어서(혹은 힘의 균형을 회복하려는 욕구에 있어서) 충분히 균형을 이루고 있기 때문이다.</div><div class=\"rst\">④ 둘이 계속 다툴 수 있는 건 힘이 <b>엇비슷하기</b> 때문이에요. = 지문의 힘의 균형이에요. ②와 바로 이어져요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Lack of argument,</div><div class=\"k\">논쟁의 결여는,</div></div><div class=\"rc\"><div class=\"e\">in fact,</div><div class=\"k\">사실,</div></div><div class=\"rc\"><div class=\"e\">may show</div><div class=\"k\">나타낼 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\">that one of the parties feels <span class=\"cw\">so powerless</span></div><div class=\"k\">당사자 중 한 명이 <span class=\"cw\">너무 무력함을 느껴서</span></div></div><div class=\"rc\"><div class=\"e\">that he or she avoids engaging directly</div><div class=\"k\">그 사람이 직접 관계 맺기를 피한다는 것을</div></div><div class=\"rc\"><div class=\"e\">with the other.</div><div class=\"k\">다른 사람(상대방)과.</div></div><div class=\"rnat\">사실, 논쟁의 결여는 당사자 중 한 명이 너무 무력함을 느껴서 다른 사람(상대방)과 직접 관계 맺기를 피한다는 것을 나타낼 수 있다.</div><div class=\"rst\">⑤ 반대로 한 친구가 아예 말을 안 하면, 너무 약하다고 느껴서 피하는 걸 수 있어요. = 지문의 논쟁의 결여예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"convince\" data-m=\"납득시키다, 설득하다\"><b>convince</b>납득시키다, 설득하다</button><button type=\"button\" class=\"wdb\" data-w=\"interpersonal\" data-m=\"대인 간의\"><b>interpersonal</b>대인 간의</button><button type=\"button\" class=\"wdb\" data-w=\"negotiation\" data-m=\"협상\"><b>negotiation</b>협상</button><button type=\"button\" class=\"wdb\" data-w=\"set forth\" data-m=\"제시하다, 내놓다\"><b>set forth</b>제시하다, 내놓다</button><button type=\"button\" class=\"wdb\" data-w=\"superiority\" data-m=\"우월감\"><b>superiority</b>우월감</button><button type=\"button\" class=\"wdb\" data-w=\"inferiority\" data-m=\"열등함\"><b>inferiority</b>열등함</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">순서 문제는 <b>고리</b>를 찾는 문제예요. <b>one of</b>(~중 하나) → 지시어 <b>This</b>(이것) → <b>the top</b>(꼭대기)·<b>the next</b>(다음) 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 (1번)</span><div class=\"en\">Birds use <mark>many techniques</mark> to save energy when they are flying …</div><p class=\"ko\">새들은 날 때 에너지를 절약하기 위해 <mark>많은 기술을</mark> 사용한다 …</p></div><div class=\"ck-via\"><i>▼</i><span>one of the most conspicuous(가장 뚜렷한 것 중 하나) = 주어진 글의 많은 기술 중 하나</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 첫 번째 고리 (4번)</span><div class=\"en\">(B) Riding updrafts to gain altitude is <mark>one of the most conspicuous</mark>.</div><p class=\"ko\">(B) 고도를 얻기 위해 상승 기류를 타는 것은 <mark>가장 뚜렷한 기술들 중 하나이다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>상승 기류가 어떻게 생기는지 설명 시작</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝 (5번)</span><div class=\"en\">… and <mark>as air near the ground warms up it rises</mark>.</div><p class=\"ko\">… <mark>지면 근처의 공기가 데워지면서</mark> 그것은 <mark>상승한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>This(이것) = (B) 끝의 ‘데워진 공기가 올라감’</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 두 번째 고리 (6번)</span><div class=\"en\">(C) <mark>This</mark> creates a column of rising warm air — a thermal — …</div><p class=\"ko\">(C) <mark>이것</mark>은 상승하는 따뜻한 공기의 기둥, 즉 ‘상승 온난 기류’를 만든다 …</p></div><div class=\"ck-via\"><i>▼</i><span>the top(꼭대기) = (C)에서 타고 올라간 공기 기둥의 꼭대기</span></div><div class=\"ck-step key\"><span class=\"lab\">(A) · 세 번째 고리 (2번)</span><div class=\"en\">(A) When it reaches <mark>the top</mark>, the bird bends its wings … searching for <mark>the next thermal</mark>.</div><p class=\"ko\">(A) 새가 <mark>가장 높은 곳</mark>에 도달하면, 날개를 구부리고 … <mark>다음 상승 온난 기류를</mark> 찾으며 활공한다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">(B) – (C) – (A)<small>one of(~중 하나) → This(이것) → the top(꼭대기), 세 고리가 모두 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(B) – (A) – (C)</span><span class=\"why\">(B) 끝은 공기가 막 올라가는 데서 끝나요. 아직 공기 기둥이 없는데 (A)의 the top(꼭대기)과 the next thermal(다음 상승 온난 기류)이 먼저 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(A) – (C) – (B)</span><span class=\"why\">주어진 글 바로 뒤 (A)의 the top(꼭대기)이 무엇의 꼭대기인지 가리킬 대상이 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(C) – (A) – (B)</span><span class=\"why\">주어진 글 끝은 ‘많은 기술’이라서, (C)의 This(이것)가 가리킬 ‘데워져 올라가는 공기’가 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(C) – (B) – (A)</span><span class=\"why\">(C)의 This(이것)가 주어진 글 바로 뒤에서 가리킬 대상이 없고, (B)의 one of(~중 하나)도 많은 기술 바로 뒤에서 떨어져요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">Birds use many techniques</div><div class=\"k\">새들은 많은 기술을 사용한다</div></div><div class=\"rc\"><div class=\"e\">to save energy</div><div class=\"k\">에너지를 절약하기 위해</div></div><div class=\"rc\"><div class=\"e\">when they are flying,</div><div class=\"k\">그들이 날 때,</div></div><div class=\"rc\"><div class=\"e\">most of which are tricks</div><div class=\"k\">그것들(= 기술들)의 대부분은 속임수다</div></div><div class=\"rc\"><div class=\"e\">to stay aloft without flapping.</div><div class=\"k\">날갯짓 없이 높이 머무르는.</div></div><div class=\"rnat\">[주어진 글] 새들은 날 때 에너지를 절약하기 위해 많은 기술을 사용하는데, 그것들의 대부분은 날갯짓 없이 높이 머무르는 속임수다.</div><div class=\"rst\">새는 날 때 힘을 아끼는 비법이 많아요. 대부분 <b>날갯짓 없이</b> 떠 있는 요령이에요. 등굣길에 힘 아끼는 우리처럼요. = 주어진 글.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">2번 · 단서</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc ckc\"><div class=\"e\">(A) <span class=\"cw\">When it reaches the top</span>,</div><div class=\"k\">(A) 그것(= 새)이 <span class=\"cw\">가장 높은 곳에 도달하면</span>,</div></div><div class=\"rc\"><div class=\"e\">the bird bends its wings</div><div class=\"k\">새는 날개를 구부리고</div></div><div class=\"rc\"><div class=\"e\">and glides in the direction</div><div class=\"k\">방향으로 활공한다</div></div><div class=\"rc\"><div class=\"e\">it wants to travel,</div><div class=\"k\">그것(= 새)이 이동하고자 하는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">searching for the next thermal</span>.</div><div class=\"k\"><span class=\"cw\">다음 상승 온난 기류를 찾으며</span>.</div></div><div class=\"rnat\">(A) 새가 가장 높은 곳에 도달하면, 새는 날개를 구부리고 다음 상승 온난 기류를 찾아 그것이 이동하고자 하는 방향으로 활공한다.</div><div class=\"rst\">엘리베이터 <b>꼭대기</b>(the top)에 닿으면 날개를 접고 가고 싶은 쪽으로 미끄러지며 <b>다음</b> 기류를 찾아요. = 지문 (A).</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">3번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">All soaring birds take advantage of thermals,</div><div class=\"k\">모든 비상하는 새들은 상승 온난 기류를 이용하나,</div></div><div class=\"rc\"><div class=\"e\">but some species,</div><div class=\"k\">어떤 종들은,</div></div><div class=\"rc\"><div class=\"e\">like the Broad-winged Hawk,</div><div class=\"k\">넓적날개말똥가리와 같은,</div></div><div class=\"rc\"><div class=\"e\">are specialists</div><div class=\"k\">전문가이고</div></div><div class=\"rc\"><div class=\"e\">and in the right conditions</div><div class=\"k\">적절한 조건에서는</div></div><div class=\"rc\"><div class=\"e\">can travel hundreds of miles</div><div class=\"k\">수백 마일을 이동할 수 있다</div></div><div class=\"rc\"><div class=\"e\">with almost no flapping.</div><div class=\"k\">날갯짓을 거의 하지 않고.</div></div><div class=\"rnat\">(A) 모든 비상하는 새들은 상승 온난 기류를 이용하나, 넓적날개말똥가리와 같은 어떤 종들은 전문가이고, 적절한 조건에서는 날갯짓을 거의 하지 않고 수백 마일을 이동할 수 있다.</div><div class=\"rst\">하늘을 나는 새는 다 이 기류를 써요. 넓적날개말똥가리 같은 고수는 날갯짓 거의 없이 수백 마일을 가요. = 지문 (A)의 끝.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">4번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(B) Riding updrafts</div><div class=\"k\">(B) 상승 기류를 타는 것은</div></div><div class=\"rc\"><div class=\"e\">to gain altitude</div><div class=\"k\">고도를 얻기(높이기) 위해</div></div><div class=\"rc ckc\"><div class=\"e\">is <span class=\"cw\">one of the most conspicuous</span>.</div><div class=\"k\"><span class=\"cw\">가장 뚜렷한 기술들 중 하나이다</span>.</div></div><div class=\"rnat\">(B) 고도를 얻기(높이기) 위해 상승 기류를 타는 것은 가장 뚜렷한 기술들 중 하나이다.</div><div class=\"rst\">그중 <b>가장 눈에 띄는 하나</b>(one of the most conspicuous)는 위로 부는 바람 타고 높이 오르기예요. = 지문 (B)의 시작.</div></div><div class=\"rds key\" data-ord=\"3\"><span class=\"rn\">5번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Bare ground</div><div class=\"k\">맨땅은</div></div><div class=\"rc\"><div class=\"e\">such as fields or parking lots</div><div class=\"k\">들판이나 주차장과 같은</div></div><div class=\"rc\"><div class=\"e\">absorbs more heat from the sun,</div><div class=\"k\">태양으로부터 더 많은 열을 흡수하고,</div></div><div class=\"rc\"><div class=\"e\">and as air near the ground warms up</div><div class=\"k\">지면 근처의 공기가 데워지면서</div></div><div class=\"rc\"><div class=\"e\">it rises.</div><div class=\"k\">그것(= 지면 근처의 공기)은 상승한다.</div></div><div class=\"rnat\">(B) 들판이나 주차장과 같은 맨땅은 태양으로부터 더 많은 열을 흡수하고, 지면 근처의 공기가 데워지면서 상승한다.</div><div class=\"rst\">운동장 맨땅이 햇볕에 뜨끈해지면, 그 위 공기도 데워져 <b>위로 올라가요</b>. = 지문의 들판·주차장 공기가 오른다는 말.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">6번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\">(C) <span class=\"cw\">This</span> creates</div><div class=\"k\">(C) <span class=\"cw\">이것</span>(= 지면 근처의 공기가 데워져 상승하는 것)은 만든다</div></div><div class=\"rc\"><div class=\"e\">a column of rising warm air</div><div class=\"k\">상승하는 따뜻한 공기의 기둥을</div></div><div class=\"rc\"><div class=\"e\">— a thermal —</div><div class=\"k\">즉 ‘상승 온난 기류’를</div></div><div class=\"rc\"><div class=\"e\">reaching hundreds or even thousands of feet high.</div><div class=\"k\">수백 혹은 심지어 수천 피트 상공에 이르는.</div></div><div class=\"rnat\">(C) 이것은 수백 혹은 심지어 수천 피트 상공에 이르는 따뜻한 공기의 기둥, 즉 ‘상승 온난 기류’를 만든다.</div><div class=\"rst\"><b>이것</b>(This) = 올라가는 따뜻한 공기예요. 이게 하늘 높이 기둥을 만들어요. 지문은 이걸 상승 온난 기류라고 불러요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">7번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">A soaring bird can sense the air movement</div><div class=\"k\">비상하는 새는 공기의 움직임을 감지할 수 있으며</div></div><div class=\"rc\"><div class=\"e\">and fly in circles</div><div class=\"k\">원을 그리며 난다</div></div><div class=\"rc\"><div class=\"e\">to stay in the column.</div><div class=\"k\">그 기둥(= 상승 온난 기류)에 머무르기 위해.</div></div><div class=\"rnat\">(C) 비상하는 새는 공기의 움직임을 감지할 수 있으며, 그 기둥(상승 온난 기류)에 머무르기 위해 원을 그리며 난다.</div><div class=\"rst\">새는 그 공기 흐름을 느끼고, 기둥 안에 머물려고 빙빙 원을 그리며 날아요. = 지문 7번이에요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">8번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">It simply fans its wings and tail</div><div class=\"k\">그것(= 새)은 그저 날개와 꼬리를 펼치고</div></div><div class=\"rc\"><div class=\"e\">and lets the rising air carry it up</div><div class=\"k\">상승하는 공기가 그것(= 새)을 위로 올려 주도록 한다</div></div><div class=\"rc\"><div class=\"e\">like an elevator.</div><div class=\"k\">엘리베이터처럼.</div></div><div class=\"rnat\">(C) 새는 단순히 날개와 꼬리를 펼치고 상승하는 공기가 그것을 엘리베이터처럼 위로 올려 주도록 한다.</div><div class=\"rst\">날개와 꼬리만 쫙 펴면 공기가 <b>엘리베이터처럼</b> 쑥 올려 줘요. = 지문의 like an elevator(엘리베이터처럼)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"aloft\" data-m=\"높이, 공중에\"><b>aloft</b>높이, 공중에</button><button type=\"button\" class=\"wdb\" data-w=\"updraft\" data-m=\"상승 기류\"><b>updraft</b>상승 기류</button><button type=\"button\" class=\"wdb\" data-w=\"altitude\" data-m=\"고도\"><b>altitude</b>고도</button><button type=\"button\" class=\"wdb\" data-w=\"conspicuous\" data-m=\"뚜렷한, 눈에 잘 띄는\"><b>conspicuous</b>뚜렷한, 눈에 잘 띄는</button><button type=\"button\" class=\"wdb\" data-w=\"thermal\" data-m=\"상승 온난 기류\"><b>thermal</b>상승 온난 기류</button><button type=\"button\" class=\"wdb\" data-w=\"glide\" data-m=\"활공하다, 미끄러지듯 날다\"><b>glide</b>활공하다, 미끄러지듯 날다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 순서는 <b>준비 → 실행 → 질문 → 대답</b>의 사건 고리를 잇는 문제예요. <b>to get ready</b>(준비하러) → <b>bucket</b>(양동이) 등장 → 애벌레 잡기 → 질문의 답 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">(A) 끝 · (A)(8)</span><div class=\"en\">The two sisters gladly agreed and went back to the house <mark>to get ready</mark>.</div><p class=\"ko\">그 두 자매는 기꺼이 동의했고 <mark>준비를 하기 위해</mark> 집으로 돌아갔다.</p></div><div class=\"ck-via\"><i>▼</i><span>준비하러 갔다 → 양동이를 들고 돌아옴</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 첫 번째 고리</span><div class=\"en\">(C) Soon, <mark>armed with a small bucket each</mark>, Olivia and Ellie went back to Grandma.</div><p class=\"ko\">(C) 곧, <mark>각각 작은 양동이로 무장하고</mark>, Olivia와 Ellie는 할머니에게로 돌아갔다.</p></div><div class=\"ck-via\"><i>▼</i><span>할머니의 ‘첫 줄만’에 안심하고 작업 시작</span></div><div class=\"ck-step\"><span class=\"lab\">(C) 끝 · (C)(9)</span><div class=\"en\">Relieved, (d) she and Ellie <mark>started on the first cabbage</mark>.</div><p class=\"ko\">안도하며, (d)그녀와 Ellie는 <mark>첫 번째 양배추부터 (작업을) 시작했다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>작업 시작 → 애벌레를 실제로 잡는 장면</span></div><div class=\"ck-step key\"><span class=\"lab\">(B) · 두 번째 고리</span><div class=\"en\">(B) The caterpillars wriggled <mark>as they were picked up</mark> …</div><p class=\"ko\">(B) 애벌레들은 <mark>그것들(= 애벌레들)이 잡힐 때마다</mark> 꿈틀거렸다 …</p></div><div class=\"ck-via\"><i>▼</i><span>지친 올리비아가 할머니께 질문</span></div><div class=\"ck-step\"><span class=\"lab\">(B) 끝 · (B)(6)</span><div class=\"en\">… she asked Grandma, “Why don’t we just <mark>get rid of all the butterflies</mark>, …</div><p class=\"ko\">… 그녀는 할머니에게 물었다. “우리 그냥 <mark>이 모든 나비들을 없애는</mark> 게 어때요, …</p></div><div class=\"ck-via\"><i>▼</i><span>(B) 끝 질문에 대한 할머니의 대답</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 세 번째 고리</span><div class=\"en\">(D) <mark>Grandma smiled gently and said</mark>, “Why wrestle with Mother Nature?</div><p class=\"ko\">(D) <mark>할머니는 부드럽게 웃으시며 말씀하셨다</mark>. “왜 대자연과 싸우려고 하니?</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(C) – (B) – (D)<small>준비 → 양동이 들고 옴 → 애벌레 잡기·질문 → 할머니의 대답 순이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">(D)의 “왜 대자연과 싸우려 하니?”는 (B) 끝 “나비를 다 없애면 안 돼요?”에 대한 대답이에요. 질문보다 대답이 먼저 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">(A) 끝 준비하러 간 뒤, 양동이를 들고 돌아오는 (C) 없이 바로 애벌레 잡기(B)가 나와요. (B)의 her bucket(그녀의 양동이)이 소개되기 전이에요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">(A) 끝은 준비하러 집에 간 장면이라, 질문도 없는데 (D) 할머니의 대답이 먼저 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(D) – (C) – (B)</span><span class=\"why\">(D)가 맨 앞이면 질문 없는 대답이 되고, (D) 끝 full buckets(꽉 찬 양동이)가 애벌레를 잡기도 전에 나와요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">(A) Olivia and her sister Ellie</div><div class=\"k\">(A) Olivia와 그녀의 여동생 Ellie는</div></div><div class=\"rc\"><div class=\"e\">were standing with Grandma</div><div class=\"k\">할머니와 함께 서 있었다</div></div><div class=\"rc\"><div class=\"e\">in the middle of the cabbages.</div><div class=\"k\">양배추들 한가운데에서.</div></div><div class=\"rnat\">(A)(1) Olivia와 그녀의 여동생 Ellie는 양배추들 한가운데에서 할머니와 함께 서 있었다.</div><div class=\"rst\">올리비아와 여동생 엘리가 할머니와 함께 양배추밭 한가운데 서 있어요. = 지문 (A)의 시작 장면이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">Suddenly, Grandma asked,</div><div class=\"k\">갑자기, 할머니께서 물어보셨다.</div></div><div class=\"rc\"><div class=\"e\">“Do you know</div><div class=\"k\">“너희들은 아니</div></div><div class=\"rc\"><div class=\"e\">what a Cabbage White is?”</div><div class=\"k\">배추흰나비가 무엇인지?”</div></div><div class=\"rnat\">(A)(2) 갑자기, 할머니께서 물어보셨다. “너희들은 배추흰나비를 아니?”</div><div class=\"rst\">할머니가 갑자기 “배추흰나비가 뭔지 아니?” 하고 물어요. 이야기의 열쇠인 나비가 처음 나와요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">“Yes,</div><div class=\"k\">“그럼요,</div></div><div class=\"rc\"><div class=\"e\">(a) I learned about it</div><div class=\"k\">(a)저(= Olivia)는 그것(= 배추흰나비)에 대하여 배웠어요</div></div><div class=\"rc\"><div class=\"e\">in biology class.</div><div class=\"k\">생물학 수업에서.</div></div><div class=\"rnat\">(A)(3) “그럼요, (a)저(Olivia)는 생물학 수업에서 그것에 대하여 배웠어요.</div><div class=\"rst\">올리비아가 “네, 생물 시간에 배웠어요!” 하고 대답해요. = 지문 (A)(3)이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">It’s a beautiful white butterfly,”</div><div class=\"k\">그것(= 배추흰나비)은 아름답고 흰 나비예요.”라고</div></div><div class=\"rc\"><div class=\"e\">Olivia answered.</div><div class=\"k\">Olivia가 대답했다.</div></div><div class=\"rnat\">(A)(4) 그것은 아름답고 흰 나비예요.”라고 Olivia가 대답했다.</div><div class=\"rst\">“아름다운 흰나비예요.” 올리비아는 아직 나비를 그냥 예쁜 나비로만 알아요. = 지문 (A)(4).</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(A)(5)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">“Right!</div><div class=\"k\">“맞아!</div></div><div class=\"rnat\">(A)(5) “맞아!</div><div class=\"rst\">할머니가 “맞아!” 하고 맞장구를 쳐요. = 지문 (A)(5)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(A)(6)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">But it lays its eggs on cabbages,</div><div class=\"k\">그러나 그것(= 배추흰나비)은 양배추 위에 알을 낳는단다,</div></div><div class=\"rc\"><div class=\"e\">and then the caterpillars eat the cabbage leaves!</div><div class=\"k\">그러고 나서 애벌레들은 그 양배추 잎들을 먹지!</div></div><div class=\"rnat\">(A)(6) 그러나 그것은 양배추 위에 알을 낳는단다, 그러고 나서 애벌레들은 그 양배추 잎들을 먹지!</div><div class=\"rst\"><b>하지만</b>(But) 그 나비가 양배추에 알을 낳고, 애벌레가 잎을 갉아 먹는대요. = 지문 속 문제 상황이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(A)(7)번</span><span class=\"ordc\">정답 순서 (A)</span><div class=\"rc\"><div class=\"e\">So, why do
