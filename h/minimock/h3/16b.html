t wish to disturb</div><div class=\"k\">그녀(= 할머니)는 어지럽히고 싶지 않다고</div></div><div class=\"rc\"><div class=\"e\">the natural balance of the environment.</div><div class=\"k\">환경의 자연스러운 균형을.</div></div><div class=\"rnat\">(D)(4) 할머니는 애벌레들이 양배추에 해를 끼친다는 것을 알고 있음에도 불구하고, 그녀는 환경의 자연스러운 균형을 어지럽히고 싶지 않다고 덧붙이셨다.</div><div class=\"rst\">할머니는 애벌레가 양배추를 해쳐도, 자연의 균형을 깨고 싶지 않다고 덧붙여요. = 지문 (D)(4)예요.</div></div><div class=\"rds\" data-ord=\"28\"><span class=\"rn\">(D)(5)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Olivia now saw</div><div class=\"k\">Olivia는 이제 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">the butterflies’ true beauty.</div><div class=\"k\">그 나비들의 진정한 아름다움을.</div></div><div class=\"rnat\">(D)(5) Olivia는 이제 그 나비들의 진정한 아름다움을 알게 되었다.</div><div class=\"rst\">이제 올리비아 눈에 나비의 진짜 아름다움이 보여요. = 지문 (D)(5)예요.</div></div><div class=\"rds\" data-ord=\"29\"><span class=\"rn\">(D)(6)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Olivia and Ellie looked at their full buckets</div><div class=\"k\">Olivia와 Ellie는 그들의 꽉 찬 양동이를 보며</div></div><div class=\"rc\"><div class=\"e\">and smiled.</div><div class=\"k\">미소 지었다.</div></div><div class=\"rnat\">(D)(6) Olivia와 Ellie는 그들의 꽉 찬 양동이를 보며 미소 지었다.</div><div class=\"rst\">두 자매는 꽉 찬 양동이를 보며 웃어요. 이야기가 따뜻하게 끝나요. = 지문 (D)(6)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"caterpillar\" data-m=\"애벌레\"><b>caterpillar</b>애벌레</button><button type=\"button\" class=\"wdb\" data-w=\"armed with\" data-m=\"~을 갖추고\"><b>armed with</b>~을 갖추고</button><button type=\"button\" class=\"wdb\" data-w=\"vast\" data-m=\"광대한, 드넓은\"><b>vast</b>광대한, 드넓은</button><button type=\"button\" class=\"wdb\" data-w=\"in despair\" data-m=\"절망하여\"><b>in despair</b>절망하여</button><button type=\"button\" class=\"wdb\" data-w=\"relieved\" data-m=\"안심한\"><b>relieved</b>안심한</button><button type=\"button\" class=\"wdb\" data-w=\"wriggle\" data-m=\"꿈틀거리다\"><b>wriggle</b>꿈틀거리다</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 대명사마다 <b>그 문장 안의 단서</b>로 누구인지 확인하세요. (e)는 <b>Olivia realized</b>(올리비아가 깨달았다) 뒤라서, 옳은 사람은 올리비아가 아니라 방금 설명해 준 <b>할머니</b>예요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · (A)(3) 문장</span><div class=\"en\">“Yes, <mark>(a) I</mark> learned about it in biology class.</div><p class=\"ko\">“그럼요, <mark>(a)저</mark>는 생물학 수업에서 그것에 대하여 배웠어요. → 올리비아 (바로 다음 문장에서 Olivia가 대답했다고 밝힘)</p></div><div class=\"ck-via\"><i>▼</i><span>안도한 사람 = (C)(6)에서 절망했던 올리비아</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · (C)(9) 문장</span><div class=\"en\">Relieved, <mark>(d) she and Ellie</mark> started on the first cabbage.</div><p class=\"ko\">안도하며, <mark>(d)그녀</mark>와 Ellie는 첫 번째 양배추부터 시작했다. → 올리비아</p></div><div class=\"ck-via\"><i>▼</i><span>같은 문장 앞에서 나비가 놀린 사람 = 올리비아</span></div><div class=\"ck-step\"><span class=\"lab\">(b) · (B)(2) 문장</span><div class=\"en\">It was as if the butterflies were making fun of Olivia; they seemed to be laughing at <mark>(b) her</mark>, …</div><p class=\"ko\">마치 나비들이 Olivia를 놀리는 것 같았는데, 그들은 <mark>(b)그녀</mark>를 향해 비웃는 것처럼 보였다 … → 올리비아</p></div><div class=\"ck-via\"><i>▼</i><span>앞 문장에서 계속 싸운 사람 = 올리비아</span></div><div class=\"ck-step\"><span class=\"lab\">(c) · (B)(5) 문장</span><div class=\"en\"><mark>(c) She</mark> kept filling her bucket with the caterpillars until the bottom disappeared.</div><p class=\"ko\"><mark>(c)그녀</mark>는 바닥이 보이지 않게 될 때까지 계속해서 양동이를 애벌레들로 채웠다. → 올리비아</p></div><div class=\"ck-via\"><i>▼</i><span>바로 앞 (D)(1)·(D)(2)에서 나비의 좋은 점을 말한 사람 = 할머니</span></div><div class=\"ck-step key\"><span class=\"lab\">(e) · (D)(3) 문장 · 결정적 단서</span><div class=\"en\"><mark>Olivia realized</mark> <mark>(e) she</mark> was right.</div><p class=\"ko\"><mark>Olivia는 깨달았다</mark> <mark>(e)그녀</mark>가 옳다는 것을. → 할머니</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(e) she 그녀 = 할머니<small>올리비아가 깨달은 내용은 나비를 지키자고 한 할머니 말이 옳다는 거예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) she 그녀 = 올리비아</span><span class=\"why\">바로 앞 (C)(7)·(C)(8)에서 할머니가 말해서 할머니로 착각하기 쉬워요. 하지만 Relieved(안도하며)의 주인공은 (C)(6)에서 절망하던 올리비아예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) I 저 = 올리비아</span><span class=\"why\">할머니의 질문에 대답하는 말이고, (A)(4)에서 Olivia answered(올리비아가 대답했다)로 말한 사람을 밝혀 줘요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(b) her 그녀를 = 올리비아</span><span class=\"why\">같은 문장 앞부분 making fun of Olivia(올리비아를 놀리는)를 받아요. 나비가 비웃는 상대는 올리비아예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) She 그녀는 = 올리비아</span><span class=\"why\">(B)(4)에서 지는 싸움 같아도 계속 싸운 올리비아가 그대로 양동이를 채워요. (B)(6)에서 지쳐서 할머니께 묻는 것도 올리비아예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><div class=\"rc\"><div class=\"e\">(A) Olivia and her sister Ellie</div><div class=\"k\">(A) Olivia와 그녀의 여동생 Ellie는</div></div><div class=\"rc\"><div class=\"e\">were standing with Grandma</div><div class=\"k\">할머니와 함께 서 있었다</div></div><div class=\"rc\"><div class=\"e\">in the middle of the cabbages.</div><div class=\"k\">양배추들 한가운데에서.</div></div><div class=\"rnat\">(A)(1) Olivia와 그녀의 여동생 Ellie는 양배추들 한가운데에서 할머니와 함께 서 있었다.</div><div class=\"rst\">올리비아와 여동생 엘리가 할머니와 함께 양배추밭 한가운데 서 있어요. = 지문 (A)의 시작 장면이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><div class=\"rc\"><div class=\"e\">Suddenly, Grandma asked,</div><div class=\"k\">갑자기, 할머니께서 물어보셨다.</div></div><div class=\"rc\"><div class=\"e\">“Do you know</div><div class=\"k\">“너희들은 아니</div></div><div class=\"rc\"><div class=\"e\">what a Cabbage White is?”</div><div class=\"k\">배추흰나비가 무엇인지?”</div></div><div class=\"rnat\">(A)(2) 갑자기, 할머니께서 물어보셨다. “너희들은 배추흰나비를 아니?”</div><div class=\"rst\">할머니가 갑자기 “배추흰나비가 뭔지 아니?” 하고 물어요. 이야기의 열쇠인 나비가 처음 나와요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><div class=\"rc\"><div class=\"e\">“Yes,</div><div class=\"k\">“그럼요,</div></div><div class=\"rc\"><div class=\"e\">(a) I learned about it</div><div class=\"k\">(a)저(= Olivia)는 그것(= 배추흰나비)에 대하여 배웠어요</div></div><div class=\"rc\"><div class=\"e\">in biology class.</div><div class=\"k\">생물학 수업에서.</div></div><div class=\"rnat\">(A)(3) “그럼요, (a)저(Olivia)는 생물학 수업에서 그것에 대하여 배웠어요.</div><div class=\"rst\">올리비아가 “네, 생물 시간에 배웠어요!” 하고 대답해요. 바로 뒤 (A)(4)에서 Olivia answered(올리비아가 대답했다)니까 <b>(a) 저 = 올리비아</b>예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><div class=\"rc\"><div class=\"e\">It’s a beautiful white butterfly,”</div><div class=\"k\">그것(= 배추흰나비)은 아름답고 흰 나비예요.”라고</div></div><div class=\"rc\"><div class=\"e\">Olivia answered.</div><div class=\"k\">Olivia가 대답했다.</div></div><div class=\"rnat\">(A)(4) 그것은 아름답고 흰 나비예요.”라고 Olivia가 대답했다.</div><div class=\"rst\">“아름다운 흰나비예요.” 올리비아는 아직 나비를 그냥 예쁜 나비로만 알아요. = 지문 (A)(4).</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(A)(5)번</span><div class=\"rc\"><div class=\"e\">“Right!</div><div class=\"k\">“맞아!</div></div><div class=\"rnat\">(A)(5) “맞아!</div><div class=\"rst\">할머니가 “맞아!” 하고 맞장구를 쳐요. = 지문 (A)(5)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(A)(6)번</span><div class=\"rc\"><div class=\"e\">But it lays its eggs on cabbages,</div><div class=\"k\">그러나 그것(= 배추흰나비)은 양배추 위에 알을 낳는단다,</div></div><div class=\"rc\"><div class=\"e\">and then the caterpillars eat the cabbage leaves!</div><div class=\"k\">그러고 나서 애벌레들은 그 양배추 잎들을 먹지!</div></div><div class=\"rnat\">(A)(6) 그러나 그것은 양배추 위에 알을 낳는단다, 그러고 나서 애벌레들은 그 양배추 잎들을 먹지!</div><div class=\"rst\"><b>하지만</b>(But) 그 나비가 양배추에 알을 낳고, 애벌레가 잎을 갉아 먹는대요. = 지문 속 문제 상황이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(A)(7)번</span><div class=\"rc\"><div class=\"e\">So, why don’t you help me</div><div class=\"k\">그러니, (너희들이) 나를 도와주는 게 어떻겠니</div></div><div class=\"rc\"><div class=\"e\">to pick the caterpillars up?”</div><div class=\"k\">애벌레를 골라내는 것을?”</div></div><div class=\"rc\"><div class=\"e\">Grandma suggested.</div><div class=\"k\">라고 할머니는 제안하셨다.</div></div><div class=\"rnat\">(A)(7) 그러니, 내가 애벌레를 골라내는 것을 (너희들이) 도와주는 게 어떻겠니?”라고 할머니는 제안하셨다.</div><div class=\"rst\">그래서 할머니가 “애벌레 골라내는 것 좀 도와줄래?” 하고 부탁해요. = 지문의 할머니 제안이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(A)(8)번</span><div class=\"rc\"><div class=\"e\">The two sisters gladly agreed</div><div class=\"k\">그 두 자매는 기꺼이 동의했고</div></div><div class=\"rc\"><div class=\"e\">and went back to the house</div><div class=\"k\">집으로 돌아갔다</div></div><div class=\"rc\"><div class=\"e\">to get ready.</div><div class=\"k\">준비를 하기 위해.</div></div><div class=\"rnat\">(A)(8) 그 두 자매는 기꺼이 동의했고 준비를 하기 위해 집으로 돌아갔다.</div><div class=\"rst\">두 자매는 기꺼이 좋다고 하고 준비하러 집으로 가요. = 지문 (A)(8)이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(C)(1)번</span><div class=\"rc\"><div class=\"e\">(C) Soon,</div><div class=\"k\">(C) 곧,</div></div><div class=\"rc\"><div class=\"e\">armed with a small bucket each,</div><div class=\"k\">각각 작은 양동이로 무장하고,</div></div><div class=\"rc\"><div class=\"e\">Olivia and Ellie went back to Grandma.</div><div class=\"k\">Olivia와 Ellie는 할머니에게로 돌아갔다.</div></div><div class=\"rnat\">(C)(1) 곧, 각각 작은 양동이로 무장하고, Olivia와 Ellie는 할머니에게로 돌아갔다.</div><div class=\"rst\">곧 올리비아와 엘리가 작은 양동이를 하나씩 들고 할머니께 돌아와요. = 지문 (C)(1)이에요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(C)(2)번</span><div class=\"rc\"><div class=\"e\">When they saw the cabbage patch,</div><div class=\"k\">그들이 양배추밭을 보았을 때,</div></div><div class=\"rc\"><div class=\"e\">they suddenly remembered</div><div class=\"k\">그들은 갑자기 생각해 냈다</div></div><div class=\"rc\"><div class=\"e\">how vast it was.</div><div class=\"k\">그것(= 양배추밭)이 얼마나 거대한지를.</div></div><div class=\"rnat\">(C)(2) 그들이 양배추밭을 보았을 때, 그들은 갑자기 그것이 얼마나 거대한지를 생각해냈다.</div><div class=\"rst\">그런데 양배추밭을 다시 보니 얼마나 넓은지 새삼 생각나요. = 지문의 how vast(얼마나 거대한지)예요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(C)(3)번</span><div class=\"rc\"><div class=\"e\">There seemed to be</div><div class=\"k\">있는 것처럼 보였다</div></div><div class=\"rc\"><div class=\"e\">a million cabbages.</div><div class=\"k\">백만 개의 양배추들이.</div></div><div class=\"rnat\">(C)(3) 백만 개의 양배추들이 있는 것처럼 보였다.</div><div class=\"rst\">양배추가 백만 개는 되는 것 같아요. = 지문 (C)(3)이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(C)(4)번</span><div class=\"rc\"><div class=\"e\">Olivia stood open-mouthed</div><div class=\"k\">Olivia는 입이 벌어진 채로 서 있었다</div></div><div class=\"rc\"><div class=\"e\">at the sight of the endless cabbage field.</div><div class=\"k\">끝없는(끝없이 펼쳐진) 양배추밭을 보고.</div></div><div class=\"rnat\">(C)(4) Olivia는 끝없는(끝없이 펼쳐진) 양배추밭을 보고 입이 벌어진 채로 서 있었다.</div><div class=\"rst\">올리비아는 끝없는 밭을 보고 입을 쩍 벌린 채 서 있어요. = 지문 (C)(4)예요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(C)(5)번</span><div class=\"rc\"><div class=\"e\">She thought</div><div class=\"k\">그녀(= Olivia)는 생각했다</div></div><div class=\"rc\"><div class=\"e\">they could not possibly pick all of the caterpillars off.</div><div class=\"k\">그들이 도저히 이 모든 애벌레들을 떼어낼 수 없을 거라고.</div></div><div class=\"rnat\">(C)(5) 그녀는 그들이 도저히 이 모든 애벌레들을 떼어낼 수 없을 거라고 생각했다.</div><div class=\"rst\">“이 많은 애벌레를 다 떼어 낼 수는 없겠다”고 생각해요. = 지문 (C)(5)예요.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(C)(6)번</span><div class=\"rc\"><div class=\"e\">Olivia sighed in despair.</div><div class=\"k\">Olivia는 절망하여 한숨을 쉬었다.</div></div><div class=\"rnat\">(C)(6) Olivia는 절망하여 한숨을 쉬었다.</div><div class=\"rst\">올리비아가 절망해서 한숨을 푹 쉬어요. = 지문의 sighed in despair(절망하여 한숨 쉬었다)예요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">(C)(7)번</span><div class=\"rc\"><div class=\"e\">Grandma smiled at her and said,</div><div class=\"k\">할머니는 그녀(= Olivia)를 향해 미소 지으며 말씀하셨다.</div></div><div class=\"rc\"><div class=\"e\">“Don’t worry.</div><div class=\"k\">“걱정하지 말렴.</div></div><div class=\"rnat\">(C)(7) 할머니는 그녀를 향해 미소 지으며 말씀하셨다. “걱정하지 말렴.</div><div class=\"rst\">할머니가 올리비아를 보고 웃으며 “걱정 마렴.” 하고 말해요. = 지문 (C)(7)이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">(C)(8)번</span><div class=\"rc\"><div class=\"e\">We are only working on this first row here today.”</div><div class=\"k\">우리는 오늘 여기 첫 번째 줄만 작업할 거야.”</div></div><div class=\"rnat\">(C)(8) 우리는 오늘 여기 첫 번째 줄만 작업할 거야.”</div><div class=\"rst\">“오늘은 여기 첫 줄만 할 거야.” 다 안 해도 된다니 마음이 놓여요. = 지문 (C)(8)이에요.</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">(C)(9)번</span><div class=\"rc\"><div class=\"e\">Relieved,</div><div class=\"k\">안도하며,</div></div><div class=\"rc\"><div class=\"e\">(d) she and Ellie</div><div class=\"k\">(d)그녀(= Olivia)와 Ellie는</div></div><div class=\"rc\"><div class=\"e\">started on the first cabbage.</div><div class=\"k\">첫 번째 양배추부터 (작업을) 시작했다.</div></div><div class=\"rnat\">(C)(9) 안도하며, (d)그녀(Olivia)와 Ellie는 첫 번째 양배추부터 (작업을) 시작했다.</div><div class=\"rst\">안심한 사람은 (C)(6)에서 절망하던 올리비아예요. 엘리와 나란히 시작했으니 <b>(d) 그녀 = 올리비아</b>예요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">(B)(1)번</span><div class=\"rc\"><div class=\"e\">(B) The caterpillars wriggled</div><div class=\"k\">(B) 애벌레들은 꿈틀거렸다</div></div><div class=\"rc\"><div class=\"e\">as they were picked up</div><div class=\"k\">그것들(= 애벌레들)이 잡힐 때마다</div></div><div class=\"rc\"><div class=\"e\">while Cabbage Whites filled the air</div><div class=\"k\">배추흰나비들이 허공을 (가득) 메우는 동안</div></div><div class=\"rc\"><div class=\"e\">around them.</div><div class=\"k\">그들 주위의.</div></div><div class=\"rnat\">(B)(1) 배추흰나비들이 class=\"e\">(c) She kept filling her bucket</div><div class=\"k\">(c)그녀(= Olivia)는 계속해서 그녀의 양동이를 채웠다</div></div><div class=\"rc\"><div class=\"e\">with the caterpillars</div><div class=\"k\">애벌레들로</div></div><div class=\"rc\"><div class=\"e\">until the bottom disappeared.</div><div class=\"k\">바닥이 보이지 않게 될 때까지.</div></div><div class=\"rnat\">(B)(5) (c)그녀(Olivia)는 바닥이 보이지 않게 될 때까지 끊임없이 그녀의 양동이를 애벌레들로 채웠다.</div><div class=\"rst\">(B)(4)에서 계속 싸운 올리비아가 양동이 바닥이 안 보일 때까지 애벌레를 담아요. 그래서 <b>(c) 그녀 = 올리비아</b>예요.</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">(B)(6)번</span><div class=\"rc\"><div class=\"e\">Feeling exhausted and discouraged,</div><div class=\"k\">지치고 낙담해서,</div></div><div class=\"rc\"><div class=\"e\">she asked Grandma,</div><div class=\"k\">그녀(= Olivia)는 할머니에게 물었다.</div></div><div class=\"rc\"><div class=\"e\">“Why don’t we just get rid of all the butterflies,</div><div class=\"k\">“우리 그냥 이 모든 나비들을 없애는 게 어때요,</div></div><div class=\"rc\"><div class=\"e\">so that there will be no more eggs or caterpillars?”</div><div class=\"k\">더 이상 알이나 애벌레가 생기지 않도록?”</div></div><div class=\"rnat\">(B)(6) 지치고 낙담해서, 그녀는 할머니에게 물었다. “더 이상 알이나 애벌레가 생기지 않도록 우리 그냥 이 모든 나비들을 없애는 게 어때요?”</div><div class=\"rst\">지친 올리비아가 “그냥 나비를 다 없애면 안 돼요?” 하고 할머니께 물어요. = 지문 (B)(6)이에요.</div></div><div class=\"rds key\" data-ord=\"24\"><span class=\"rn\">(D)(1)번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">(D) <span class=\"cw\">Grandma smiled gently and said</span>,</div><div class=\"k\">(D) <span class=\"cw\">할머니는 부드럽게 웃으시며 말씀하셨다</span>.</div></div><div class=\"rc\"><div class=\"e\">“Why wrestle with Mother Nature?</div><div class=\"k\">“왜 대자연과 싸우려고 하니?</div></div><div class=\"rnat\">(D)(1) 할머니는 부드럽게 웃으시며 말씀하셨다. “왜 대자연과 싸우려고 하니?</div><div class=\"rst\">할머니가 부드럽게 웃으며 “왜 대자연과 싸우려 하니?” 하고 말해요. = 지문 (D)(1)이에요.</div></div><div class=\"rds key\" data-ord=\"25\"><span class=\"rn\">(D)(2)번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The butterflies help us grow some other plants</span></div><div class=\"k\"><span class=\"cw\">나비들은 우리가 몇몇 다른 식물들을 기르는 데 도움을 준단다</span></div></div><div class=\"rc\"><div class=\"e\">because they carry pollen</div><div class=\"k\">그것들(= 나비들)이 꽃가루를 옮기기 때문에</div></div><div class=\"rc\"><div class=\"e\">from flower to flower.”</div><div class=\"k\">이 꽃에서 저 꽃으로.”</div></div><div class=\"rnat\">(D)(2) 나비들은 이 꽃에서 저 꽃으로 꽃가루를 옮기기 때문에 우리들이 몇 가지 다른 식물들을 기르는 데 도움을 준단다.”</div><div class=\"rst\">“나비가 꽃가루를 옮겨서 다른 식물이 자라게 도와준단다.” = 지문 속 나비가 하는 좋은 일이에요.</div></div><div class=\"rds key\" data-ord=\"26\"><span class=\"rn\">(D)(3)번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Olivia realized</span></div><div class=\"k\"><span class=\"cw\">Olivia는 깨달았다</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(e) she was right</span>.</div><div class=\"k\"><span class=\"cw\">(e)그녀(= 할머니)가 옳다는 것을</span>.</div></div><div class=\"rnat\">(D)(3) Olivia는 (e)그녀(Grandma)가(할머니 말씀이) 옳다는 것을 깨달았다.</div><div class=\"rst\">올리비아가 깨달은 건 <b>할머니 말이 옳다</b>는 거예요. 깨달은 사람과 옳은 사람이 달라서 <b>(e) 그녀 = 할머니</b>!</div></div><div class=\"rds\" data-ord=\"27\"><span class=\"rn\">(D)(4)번</span><div class=\"rc\"><div class=\"e\">Grandma added</div><div class=\"k\">할머니는 덧붙이셨다</div></div><div class=\"rc\"><div class=\"e\">that although she knew</div><div class=\"k\">그녀(= 할머니)는 알고 있음에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">caterpillars did harm to cabbages,</div><div class=\"k\">애벌레들이 양배추에 해를 끼친다는 것을,</div></div><div class=\"rc\"><div class=\"e\">she didn’t wish to disturb</div><div class=\"k\">그녀(= 할머니)는 어지럽히고 싶지 않다고</div></div><div class=\"rc\"><div class=\"e\">the natural balance of the environment.</div><div class=\"k\">환경의 자연스러운 균형을.</div></div><div class=\"rnat\">(D)(4) 할머니는 애벌레들이 양배추에 해를 끼친다는 것을 알고 있음에도 불구하고, 그녀는 환경의 자연스러운 균형을 어지럽히고 싶지 않다고 덧붙이셨다.</div><div class=\"rst\">할머니는 애벌레가 양배추를 해쳐도, 자연의 균형을 깨고 싶지 않다고 덧붙여요. = 지문 (D)(4)예요.</div></div><div class=\"rds\" data-ord=\"28\"><span class=\"rn\">(D)(5)번</span><div class=\"rc\"><div class=\"e\">Olivia now saw</div><div class=\"k\">Olivia는 이제 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">the butterflies’ true beauty.</div><div class=\"k\">그 나비들의 진정한 아름다움을.</div></div><div class=\"rnat\">(D)(5) Olivia는 이제 그 나비들의 진정한 아름다움을 알게 되었다.</div><div class=\"rst\">이제 올리비아 눈에 나비의 진짜 아름다움이 보여요. = 지문 (D)(5)예요.</div></div><div class=\"rds\" data-ord=\"29\"><span class=\"rn\">(D)(6)번</span><div class=\"rc\"><div class=\"e\">Olivia and Ellie looked at their full buckets</div><div class=\"k\">Olivia와 Ellie는 그들의 꽉 찬 양동이를 보며</div></div><div class=\"rc\"><div class=\"e\">and smiled.</div><div class=\"k\">미소 지었다.</div></div><div class=\"rnat\">(D)(6) Olivia와 Ellie는 그들의 꽉 찬 양동이를 보며 미소 지었다.</div><div class=\"rst\">두 자매는 꽉 찬 양동이를 보며 웃어요. 이야기가 따뜻하게 끝나요. = 지문 (D)(6)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"making fun of\" data-m=\"~을 놀리는\"><b>making fun of</b>~을 놀리는</button><button type=\"button\" class=\"wdb\" data-w=\"relieved\" data-m=\"안심한\"><b>relieved</b>안심한</button><button type=\"button\" class=\"wdb\" data-w=\"realize\" data-m=\"깨닫다\"><b>realize</b>깨닫다</button><button type=\"button\" class=\"wdb\" data-w=\"fought on\" data-m=\"계속 싸웠다\"><b>fought on</b>계속 싸웠다</button><button type=\"button\" class=\"wdb\" data-w=\"row\" data-m=\"줄, 이랑\"><b>row</b>줄, 이랑</button><button type=\"button\" class=\"wdb\" data-w=\"bucket\" data-m=\"양동이\"><b>bucket</b>양동이</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">장문 불일치는 선택지를 <b>이야기 순서대로</b> 하나씩 대조하세요. 선택지 ②의 <b>‘잡지 않았다’</b>처럼 부정어를 넣은 말이 지문 장면과 부딪히는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ (A)(7)</em>help me to pick the caterpillars up(애벌레 골라내는 걸 도와줘) → 같음</span><span><em>④ ↔ (C)(2)</em>remembered how vast l white butterfly,”</div><div class=\"k\">그것(= 배추흰나비)은 아름답고 흰 나비예요.”라고</div></div><div class=\"rc\"><div class=\"e\">Olivia answered.</div><div class=\"k\">Olivia가 대답했다.</div></div><div class=\"rnat\">(A)(4) 그것은 아름답고 흰 나비예요.”라고 Olivia가 대답했다.</div><div class=\"rst\">“아름다운 흰나비예요.” 올리비아는 아직 나비를 그냥 예쁜 나비로만 알아요. = 지문 (A)(4).</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(A)(5)번</span><div class=\"rc\"><div class=\"e\">“Right!</div><div class=\"k\">“맞아!</div></div><div class=\"rnat\">(A)(5) “맞아!</div><div class=\"rst\">할머니가 “맞아!” 하고 맞장구를 쳐요. = 지문 (A)(5)예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(A)(6)번</span><div class=\"rc\"><div class=\"e\">But it lays its eggs on cabbages,</div><div class=\"k\">그러나 그것(= 배추흰나비)은 양배추 위에 알을 낳는단다,</div></div><div class=\"rc\"><div class=\"e\">and then the caterpillars eat the cabbage leaves!</div><div class=\"k\">그러고 나서 애벌레들은 그 양배추 잎들을 먹지!</div></div><div class=\"rnat\">(A)(6) 그러나 그것은 양배추 위에 알을 낳는단다, 그러고 나서 애벌레들은 그 양배추 잎들을 먹지!</div><div class=\"rst\"><b>하지만</b>(But) 그 나비가 양배추에 알을 낳고, 애벌레가 잎을 갉아 먹는대요. = 지문 속 문제 상황이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(A)(7)번</span><div class=\"rc\"><div class=\"e\">So, why don’t you help me</div><div class=\"k\">그러니, (너희들이) 나를 도와주는 게 어떻겠니</div></div><div class=\"rc\"><div class=\"e\">to pick the caterpillars up?”</div><div class=\"k\">애벌레를 골라내는 것을?”</div></div><div class=\"rc\"><div class=\"e\">Grandma suggested.</div><div class=\"k\">라고 할머니는 제안하셨다.</div></div><div class=\"rnat\">(A)(7) 그러니, 내가 애벌레를 골라내는 것을 (너희들이) 도와주는 게 어떻겠니?”라고 할머니는 제안하셨다.</div><div class=\"rst\">할머니가 “애벌레 골라내는 것 좀 도와줄래?” 하고 부탁해요. = 선택지 ① 도움 요청과 같아요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(A)(8)번</span><div class=\"rc\"><div class=\"e\">The two sisters gladly agreed</div><div class=\"k\">그 두 자매는 기꺼이 동의했고</div></div><div class=\"rc\"><div class=\"e\">and went back to the house</div><div class=\"k\">집으로 돌아갔다</div></div><div class=\"rc\"><div c ass=\"e\">The cabbage patch looked like a battlefield.</div><div class=\"k\">그 양배추밭은 전쟁터처럼 보였다.</div></div><div class=\"rnat\">(B)(3) 그 양배추밭은 전쟁터처럼 보였다.</div><div class=\"rst\">양배추밭이 꼭 <b>전쟁터</b> 같아요. = 지문의 battlefield(전쟁터) = 선택지 ③과 같아요.</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">(B)(4)번</span><div class=\"rc\"><div class=\"e\">Olivia felt like</div><div class=\"k\">Olivia는 느꼈다</div></div><div class=\"rc\"><div class=\"e\">she was losing the battle,</div><div class=\"k\">그녀(= Olivia)가 그 전투에서 지고 있는 것처럼,</div></div><div class=\"rc\"><div class=\"e\">but she fought on.</div><div class=\"k\">하지만 그녀(= Olivia)는 계속해서 싸웠다.</div></div><div class=\"rnat\">(B)(4) Olivia는 자신이 그 전투에서 지고 있는 것처럼 느꼈지만, 그녀는 계속해서 싸웠다.</div><div class=\"rst\">올리비아는 지는 싸움 같았지만 포기하지 않고 계속 싸워요. = 지문의 fought on(계속 싸웠다)이에요.</div></div><div class=\"rds key\" data-ord=\"22\"><span class=\"rn\">(B)(5)번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">(c) She <span class=\"cw\">kept filling her bucket</span></div><div class=\"k\">(c)그녀(= Olivia)는 <span class=\"cw\">계속해서 그녀의 양동이를 채웠다</span></div></div><div class=\"rc\"><div class=\"e\">with the caterpillars</div><div class=\"k\">애벌레들로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">until the bottom disappeared</span>.</div><div class=\"k\"><span class=\"cw\">바닥이 보이지 않게 될 때까지</span>.</div></div><div class=\"rnat\">(B)(5) (c)그녀(Olivia)는 바닥이 보이지 않게 될 때까지 끊임없이 그녀의 양동이를 애벌레들로 채웠다.</div><div class=\"rst\">양동이 <b>바닥이 안 보일 때까지</b> 애벌레를 계속 담아요. 많이 잡았으니 선택지 ② ‘잡지 않았다’와 어긋나요!</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">(B)(6)번</span><div class=\"rc\"><div class=\"e\">Feeling exhausted and discouraged,</div><div class=\"k\">지치고 낙담해서,</div></div><div class=\"rc\"><div class=\"e\">she asked Grandma,</div><div class=\"k\">그녀(= Olivia)는 할머니에게 물었다.</div></div><div class=\"rc\"><div class=\"e\">“Why don’t we just get rid of all the butterflies,</div><div class=\"k\">“우리 그냥 이 모든 나비들을 없애는 게 어때요,</div></div><div class=\"rc\"><div class=\"e\">so that there will be no more eggs or caterpillars?”</div><div class=\"k\">더 이상 알이나 애벌레가 생기지 않도록?”</div></div><div class=\"rnat\">(B)(6) 지치고 낙담해서, 그녀는 할머니에게 물었다. “더 이상 알이나 애벌레가 생기지 않도록 우리 그냥 이 모든 나비들을 없애는 게 어때요?”</div><div class=\"rst\">지친 올리비아가 “그냥 나비를 다 없애면 안 돼요?” 하고 할머니께 물어요. = 지문 (B)(6)이에요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">(D)(1)번</span><div class=\"rc\"><div class=\"e\">(D) Grandma smiled gently and said,</div><div class=\"k\">(D) 할머니는 부드럽게 웃으시며 말씀하셨다.</div></div><div class=\"rc\"><div class=\"e\">“Why wrestle with Mother Nature?</div><div class=\"k\">“왜 대자연과 싸우려고 하니?</div></div><div class=\"rnat\">(D)(1) 할머니는 부드럽게 웃으시며 말씀하셨다. “왜 대자연과 싸우려고 하니?</div><div class=\"rst\">할머니가 부드럽게 웃으며 “왜 대자연과 싸우려 하니?” 하고 말해요. = 지문 (D)(1)이에요.</div></div><div class=\"rds\" data-ord=\"25\"><span class=\"rn\">(D)(2)번</span><div class=\"rc\"><div class=\"e\">The butterflies help us grow some other plants</div><div class=\"k\">나비들은 우리가 몇몇 다른 식물들을 기르는 데 도움을 준단다</div></div><div class=\"rc\"><div class=\"e\">because they carry pollen</div><div class=\"k\">그것들(= 나비들)이 꽃가루를 옮기기 때문에</div></div><div class=\"rc\"><div class=\"e\">from flower to flower.”</div><div class=\"k\">이 꽃에서 저 꽃으로.”</div></div><div class=\"rnat\">(D)(2) 나비들은 이 꽃에서 저 꽃으로 꽃가루를 옮기기 때문에 우리들이 몇 가지 다른 식물들을 기르는 데 도움을 준단다.”</div><div class=\"rst\">“나비가 꽃가루를 옮겨서 다른 식물이 자라게 도와준단다.” = 지문 속 나비가 하는 좋은 일이에요.</div></div><div class=\"rds\" data-ord=\"26\"><span class=\"rn\">(D)(3)번</span><div class=\"rc\"><div class=\"e\">Olivia realized</div><div class=\"k\">Olivia는 깨달았다</div></div><div class=\"rc\"><div class=\"e\">(e) she was right.</div><div class=\"k\">(e)그녀(= 할머니)가 옳다는 것을.</div></div><div class=\"rnat\">(D)(3) Olivia는 (e)그녀(Grandma)가(할머니 말씀이) 옳다는 것을 깨달았다.</div><div class=\"rst\">올리비아는 할머니 말이 옳다는 걸 깨달아요. = 지문 (D)(3)이에요.</div></div><div class=\"rds\" data-ord=\"27\"><span class=\"rn\">(D)(4)번</span><div class=\"rc\"><div class=\"e\">Grandma added</div><div class=\"k\">할머니는 덧붙이셨다</div></div><div class=\"rc\"><div class=\"e\">that although she knew</div><div class=\"k\">그녀(= 할머니)는 알고 있음에도 불구하고</div></div><div class=\"rc\"><div class=\"e\">caterpillars did harm to cabbages,</div><div class=\"k\">애벌레들이 양배추에 해를 끼친다는 것을,</div></div><div class=\"rc\"><div class=\"e\">she didn’t wish to disturb</div><div class=\"k\">그녀(= 할머니)는 어지럽히고 싶지 않다고</div></div><div class=\"rc\"><div class=\"e\">the natural balance of the environment.</div><div class=\"k\">환경의 자연스러운 균형을.</div></div><div class=\"rnat\">(D)(4) 할머니는 애벌레들이 양배추에 해를 끼친다는 것을 알고 있음에도 불구하고, 그녀는 환경의 자연스러운 균형을 어지럽히고 싶지 않다고 덧붙이셨다.</div><div class=\"rst\">할머니는 애벌레가 양배추를 해쳐도 <b>자연의 균형</b>을 깨고 싶지 않대요. = 선택지 ⑤의 자연의 섭리예요.</div></div><div class=\"rds\" data-ord=\"28\"><span class=\"rn\">(D)(5)번</span><div class=\"rc\"><div class=\"e\">Olivia now saw</div><div class=\"k\">Olivia는 이제 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">the butterflies’ true beauty.</div><div class=\"k\">그 나비들의 진정한 아름다움을.</div></div><div class=\"rnat\">(D)(5) Olivia는 이제 그 나비들의 진정한 아름다움을 알게 되었다.</div><div class=\"rst\">이제 올리비아 눈에 나비의 진짜 아름다움이 보여요. = 지문 (D)(5)예요.</div></div><div class=\"rds key\" data-ord=\"29\"><span class=\"rn\">(D)(6)번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Olivia and Ellie <span class=\"cw\">looked at their full buckets</span></div><div class=\"k\">Olivia와 Ellie는 <span class=\"cw\">그들의 꽉 찬 양동이를 보며</span></div></div><div class=\"rc\"><div class=\"e\">and smiled.</div><div class=\"k\">미소 지었다.</div></div><div class=\"rnat\">(D)(6) Olivia와 Ellie는 그들의 꽉 찬 양동이를 보며 미소 지었다.</div><div class=\"rst\">두 자매는 <b>꽉 찬 양동이</b>를 보며 웃어요. 애벌레를 가득 잡았다는 증거라 ②와 또 어긋나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"cabbage patch\" data-m=\"양배추밭\"><b>cabbage patch</b>양배추밭</button><button type=\"button\" class=\"wdb\" data-w=\"vast\" data-m=\"광대한, 드넓은\"><b>vast</b>광대한, 드넓은</button><button type=\"button\" class=\"wdb\" data-w=\"battlefield\" data-m=\"전쟁터\"><b>battlefield</b>전쟁터</button><button type=\"button\" class=\"wdb\" data-w=\"pollen\" data-m=\"꽃가루\"><b>pollen</b>꽃가루</button><button type=\"button\" class=\"wdb\" data-w=\"did harm to\" data-m=\"~에 해를 끼쳤다\"><b>did harm to</b>~에 해를 끼쳤다</button><button type=\"button\" class=\"wdb\" data-w=\"disturb\" data-m=\"흐트러뜨리다, 방해하다\"><b>disturb</b>흐트러뜨리다, 방해하다</button></div>"};

function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);

  app.innerHTML=h;
}

document.addEventListener('click',e=>{

  }
  const al=e.target.closest('.tbtn');

    const open=al.dataset.all==='1',body=al.closest('.dkbody');

    body.querySelectorAll('.s,.sc').forEach(s=>{

      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}

  }
});
