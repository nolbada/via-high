<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

dged = acknowledge 인정하다의 수동태", "personally 직접, brand manager 브랜드 담당자", "for example, as a result는 삽입 부사구 (예컨대 그 결과로)"]}, {"t": "맨 앞 <b>If you've ever posted a favorable comment</b>는 현재완료 조건절이다 ('댓글을 달아 본 적이 있다면').", "sub": ["post 올리다, favorable 호의적인, comment 댓글"]}, {"t": "대시 사이 <b>or any comment, for that matter</b>는 '사실 어떤 댓글이든'이라는 보충 삽입이다. <b>about a brand, product or service</b>는 comment를 꾸민다 ('브랜드나 제품, 서비스에 대한').", "sub": ["함정: if절이 두 개이다. 앞은 실제 경험(현재완료), 뒤는 가정(were)이다."]}], "sum": "호의적인 댓글을 단 적이 있다면, 담당자에게 직접 인정받는 기분을 떠올려 보라"}, {"i": "04", "q": "04", "s": "3", "title": "S+V+O (동사 병렬) + 목적 to부정사", "eng": "Young people treat<sup>1</sup> the mobile phone as an essential<sup>2</sup> necessity<sup>3</sup> of life / and often prefer<sup>4</sup> to use text messages / to communicate with their friends.", "notes": [["1", "treat A as B", "A를 B로 여기다"], ["2", "essential", "필수적인"], ["3", "necessity", "필수품"], ["4", "prefer to V", "~하기를 더 좋아하다"]], "lit": "젊은이들은 휴대전화를 삶의 필수품으로 취급한다 / 그리고 흔히 문자 메시지 쓰기를 더 좋아한다 / 친구들과 소통하기 위해.", "nat": "젊은이들은 휴대전화를 삶의 필수품으로 여기며, 친구들과 소통할 때 흔히 문자 메시지 쓰기를 더 좋아한다.", "ana": "<b>treat A as B</b>는 '<b>A를 B로 여기다·취급하다</b>'라는 짜임이다. 여기서 as를 '~처럼'이나 '~할 때'로 읽으면 뒤의 명사가 갈 곳을 잃는다. and 뒤의 <b>prefer</b>에는 주어가 다시 나오지 않는데, 이는 앞의 treat과 <b>같은 주어를 공유하는 병렬</b>이기 때문이다. 이렇게 <b>and 뒤에 동사만 덜렁 나오면</b> 앞 동사와 짝을 맞춰 읽어야 한다. <b>prefer to V</b>는 '~하기를 더 좋아하다'이고, 마지막 <b>to communicate</b>는 앞의 use를 꾸미는 <b>목적</b>의 to부정사다. to부정사가 한 문장에 두 번 나올 때는 <b>각각 역할이 다르다</b>는 점에 주의한다.", "pe": "Young people treat<sup>1</sup> the mobile phone \u0001as an \u0001essential<sup>2</sup>\u0002 necessity<sup>3</sup> \u0001of life\u0002\u0002 / and \u0001often\u0002 prefer<sup>4</sup> to use text messages / \u0001to communicate \u0001with their friends\u0002\u0002.", "pk": "젊은이들은 휴대전화를 \u0001\u0001삶의\u0002 필수품으로\u0002 취급한다 / 그리고 \u0001흔히\u0002 문자 메시지 쓰기를 더 좋아한다 / \u0001\u0001친구들과\u0002 소통하기 위해\u0002.", "core": "젊은이들은 휴대전화를 취급하며 문자 메시지 쓰기를 더 좋아한다.", "tags": ["주어 people + 동사 treat + 목적어 phone. as B = 전치 ide of a person's house</b>만 보고 '비유하다'로 잡는다.", "pe": "An animal's territory<sup>1</sup> has an \u0001internal<sup>2</sup>\u0002 arrangement<sup>3</sup> / \u0001that Heini Hediger compared<sup>4</sup> \u0001to the inside of a person's house\u0002\u0002.", "pk": "동물의 영역에는 내부 배치가 있다 / \u0001Heini Hediger가 \u0001사람 집의 내부에\u0002 비유했던\u0002.", "core": "동물의 영역은 배치를 가진다.", "tags": ["주어 territory + 동사 has + 목적어 arrangement. internal = 형용사: arrangement를 꾸밈", "that절 = 관계절(형용사절, 목적격): arrangement를 꾸밈. <b>compare A to B</b> = A를 B에 비유하다. to the inside ~ = 거의 필수에 가까운 부사구"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어 뒤에 관계절이 붙어 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: An animal's territory (동물의 영역. territory 영역)", "V: has (가지다)", "O: an internal arrangement (내부 배치. internal 내부의, arrangement 배치)", "뼈대 = <b>An animal's territory has an internal arrangement</b>"]}, {"t": "<b>that Heini Hediger compared to the inside of a person's house</b>는 목적격 관계절(형용사절)이다. arrangement를 꾸민다.", "sub": ["S: Heini Hediger (사람 이름) / V: compared (compare 비유하다, 비교하다의 과거형)", "compare A to B = A를 B에 비유하다. A 자리(목적어)가 비어 있고 그 자리를 that이 채운다", "the inside of a person's house = 사람 집의 내부"]}, {"t": "함정: that 뒤에 주어(Heini Hediger)가 있으므로 목적격 관계대명사이다. that절에서 빠진 곳은 compared의 목적어 자리이다."}], "sum": "동물의 영역에는 사람 집 내부에 비유된 내부 배치가 있음"}, {"i": "07", "q": "06", "s": "1", "title": "양보 While절 + S+V+O (that 생략)", "eng": "While there is no denying<sup>1</sup> / that exceptional<sup>2</sup> players like Emmitt Smith can put points on the board<sup>3</sup> and enhance<sup>4</sup> team success, / new research suggests / there is a limit<sup>5</sup> to the benefit top talents<sup>6</sup> bring to a team.", "notes": [["1", "there is no denying that", "~은 부정할 수 없다"], ["2", "exceptional", "매우 뛰어난, 특출한"], ["3", "put points on the board", "득점하다"], ["4", "enhance", "높이다, 향상시키다"], ["5", "limit", "한계"], ["6", "top talent", "최고의 인재"]], "lit": "부정할 수는 없지만 / Emmitt Smith 같은 특출한 선수들이 득점을 올리고 팀의 성공을 높일 수 있다는 것을, / 새로운 연구는 시사한다 / 최고의 인재들이 팀에 가져다주는 이득에는 한계가 있다는 것을.", "nat": "Emmitt Smith 같은 특출한 선수들이 득점을 올리고 팀의 성공을 높일 수 있다는 점은 부정할 수 없지만, 새로운 연구는 최고의 인재들이 팀에 가져다주는 이득에 한계가 있음을 시사한다.", "ana": "문장 앞의 <b>While</b>은 '~하는 동안'이 아니라 '<b>~이기는 하지만</b>'이라는 <b>양보</b>다. 뒤에 반대 방향의 주절이 오면 양보로 읽는다. <b>there is no denying that ~</b>은 '<b>~은 부정할 수 없다</b>'라는 통째로 외워 두는 표현이다. 주절의 <b>suggests</b> 뒤에는 접속사 that이 <b>생략</b>되어 있어 there가 곧바로 나온다. 이렇게 <b>동사 뒤에 절이 그냥 붙으면</b> that이 빠진 것으로 본다. 마지막 <b>the benefit top talents bring to a team</b>도 마찬가지로 benefit과 top talents 사이에 <b>목적격 관계대명사가 생략</b>된 형태다. 명사 뒤에 <b>또 다른 주어+동사</b>가 오면 관계사 생략을 의심해야 한다.", "pe": "\u0001While there is no denying<sup>1</sup>\u0002 / \u0001that exceptional<sup>2</sup> players like Emmitt Smith can put points on the board<sup>3</sup> and enhance<sup>4</sup> team success\u0002, / new research suggests / there is a limit<sup>5</sup> \u0001to the benefit \u0001top talents<sup>6</sup> bring to a team\u0002\u0002.", "pk": "\u0001부정할 수는 없지만\u0002 / \u0001Emmitt Smith 같은 특출한 선수들이 득점을 올리고 팀의 성공을 높일 수 있다는 것을\u0002, / 새로운 연구는 시사한다 / \u0001\u0001최고의 인재들이 팀에 가져다주는\u0002 이득에는\u0002 한계가 있다는 것을.", "core": "새로운 연구는 최고의 인재들이 팀에 가져다주는 이득에는 한계가 있다는 것을 시사한다.", "tags": ["While절 = 부사절(양보): suggests를 꾸밈. there is no denying = ~을 부정할 수 없다", "that절 = 명사절(denying의 목적어). While절 안이라 괄호 처리. 동사 put / enhance 병렬", "주어 new research + 동사 suggests. 목적어 that절(that 생략)은 다음 덩어리", "that 생략 명사절 = suggests의 목적어 = 뼈대. to the benefit ~ = 전치사구(형용사구): limit 꾸밈. top talents bring ~ = 관계절(목적격 생략): benefit 꾸밈"], "steps": [{"t": "이 문장은 <b>While 양보절 + S+V+O(3형식)</b>이다. 두 덩어리 모두 안에 that절이 있어 길어 보인다."}, {"t": "뼈대(주절)부터 찾는다.", "sub": ["S: new research (새로운 연구)", "V: suggests (suggest 시사하다)", "O: (that) there is a limit to the benefit ~ (~에 한계가 있다는 것. that 생략)", "뼈대 = <b>new research suggests (that) there is a limit</b>"]}, {"t": "suggests의 목적어절은 <b>there is a limit to the benefit top talents bring to a team</b>이다.", "sub": ["there is + a limit (한계가 있다) / to the benefit = 이득에 대한 (limit를 꾸밈)", "(that) top talents bring to a 사구(형용사구): success를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 목적어가 both A and B로 길게 이어져 있다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: they (그들)", "V: calculated (calculate 계산하다의 과거형)", "O: both A and B (A와 B 둘 다)", "뼈대 = <b>they calculated both A and B</b>"]}, {"t": "A는 <b>the percentage of top talent on each team</b>이다 (각 팀의 최고 인재 비율).", "sub": ["percentage 비율, talent 인재, team 팀", "of top talent는 percentage를, on each team은 talent를 꾸민다"]}, {"t": "B는 <b>the teams' success over several years</b>이다 (여러 해에 걸친 그 팀들의 성공).", "sub": ["success 성공, several 여러", "over several years는 success를 꾸미는 전치사구"]}, {"t": "맨 앞 <b>In each sport</b>(각 종목에서)는 calculated를 꾸미는 부사구이다.", "sub": ["함정: and는 percentage와 success를 이어 준다. both A and B 구조에서 두 명사구가 짝이다."]}], "sum": "각 종목에서 팀별 최고 인재 비율과 여러 해의 성과를 모두 계산"}], "qs": [{"q": "01", "type": "필자의 주장", "src": "2018년 3월 20번", "ans": "⑤", "tr": [["1", "특정한 논문을 쓰거나 강연을 하거나 포스터 발표를 할 때 당신의 목표는 무엇인가?"], ["2", "당신은 이 목표를 한 문장으로 진술할 수 있어야 한다."], ["3", "예를 들어, Bob이 심리학과 학생 시절에 쓴 첫 논문 중 하나는 아이들의 지능에서 나타나는 개인차가 유전적 요인만으로는 설명될 수 없다는 것을 보여 주기 위해 쓰인 것이었다."], ["4", "물론 그는 지능의 유전에 관한 문헌을 고찰했다."], ["5", "그리고 당연히 환경이 지능에 미치는 영향에 관한 문헌도 고찰했다."], ["6", "그러나 그에게는 논지가 없었다."], ["7", "좋은 논문은 그저 문헌을 훑고 나서 “다양한 관점이 있고, 그 모두가 저마다 쓸 만한 말을 한다” 같은 소리를 하는 데 그치지 않는다."], ["8", "논문이나 강연, 포스터를 통해 의사소통할 때는, 당신이 보여 주고 싶은 것을 분명히 하고 그것을 보여 주라."]], "evh": "8번 문장", "ev": [{"en": true, "h": "When you communicate via a paper, talk, or poster, be clear about what you want to show, and show it."}, {"en": false, "h": "주장 문항은 <b>명령문</b>이 나오는 자리를 찾으면 거의 끝난다. 이 글에서 명령문은 2번 문장의 <b>You should be able to state this goal in one sentence</b>와 마지막 8번 문장뿐이고, 둘은 <b>같은 말</b>을 하고 있다. 3~6번 문장의 Bob 이야기는 그 사이에 끼워 넣은 <b>반례</b>다. 그는 문헌을 열심히 고찰했지만 <b>had no thesis</b>, 즉 논지가 없었다. 그리고 7번 문장이 '<b>문헌만 훑고 두루뭉술하게 끝내는 논문은 좋은 논문이 아니다</b>'라고 못박은 뒤, 8번 문장에서 <b>be clear about what you want to show</b>로 결론을 낸다. 즉 <b>보여 주려는 논지를 분명히 하라</b>가 필자의 주장이다."}], "opts": [{"n": "①", "t": "유전과 환경 요인을 반영하여 지능을 정의해야 한다.", "a": false, "x": true, "trap": false, "e": "<b>genetic factors</b>와 <b>environmental effects</b>는 3~5번 문장에 나오지만, 이는 Bob의 논문 <b>소재</b>일 뿐이다. 지능을 어떻게 정의하라는 말은 어디에도 없다."}, {"n": "②", "t": "논문을 쓰기 전에 문헌 연구를 충실히 해야 한다.", "a": false, "x": true, "trap": true, "e": "Bob은 이미 문헌을 <b>충실히 고찰했지만</b>(4·5번 문장) 6번 문장에서 <b>논지가 없다</b>고 지적당한다. 글은 문헌 고찰만으로는 부족하다고 말하므로 정반대다."}, {"n": "③", "t": "매체의 특성에 맞는 홍보 전략을 세워야 한다.", "a": false, "x": true, "trap": false, "e": "논문·강연·포스터가 나열되지만 이는 <b>의사소통의 형태</b>를 예로 든 것이다. 매체별로 전략을 달리하라는 언급은 없다."}, {"n": "④", "t": "지나치게 광범위한 연구 주제를 피해야 한다.", "a": false, "x": true, "trap": false, "e": "주제의 <b>범위</b>를 문제 삼은 문장이 없다. 문제는 주제가 넓어서가 아니라 <b>논지가 없어서</b>였다."}, {"n": "⑤", "t": "전달하려는 논지를 명확하게 밝혀야 한다.", "a": true, "x": false, "trap": false, "e": "2번 문장의 <b>state this goal in one sentence</b>와 8번 문장의 <b>be clear about what you want to show</b>가 같은 말을 반복한다. 6번 문장의 <b>no thesis</b>가 그 반대 사례다."}], "w": [["particular", "특정한"], ["give a talk", "강연을 하다"], ["state", "진술하다, 밝히다"], ["psychology", "심리학"], ["individual difference", "개인차"], ["intelligence", "지능"], ["genetic factor", "유전적 요인"], ["alone", "오직 ~만으로"], ["review", "고찰하다, 검토하다"], ["literature", "(연구) 문헌"], ["inheritance", "유전, 상속"], ["thesis", "논지, 주장"]]}, {"q": "02", "type": "심경 변화", "src": "2022학년도 6월 19번", "ans": "①", "tr": [["1", "Natalie가 자신의 첫 온라인 상담 시간에 접속하면서, 그녀는 “컴퓨터 화면을 통해 어떻게 상담사에게 마음을 열 수 있을까?” 하고 생각했다."], ["2", "상담 센터가 차로 한참 가야 하는 곳에 있었기 때문에, 그녀는 이렇게 하면 시간이 많이 절약되리라는 것을 알고 있었다."], ["3", "다만 Natalie는 그것이 상담사를 직접 만나는 것만큼 도움이 될지는 확신하지 못했다."], ["4", "그러나 일단 상담이 시작되자 그녀의 걱정은 사라졌다."], ["5", "그녀는 실제로 그것이 예상보다 훨씬 더 편리하다고 생각하기 시작했다."], ["6", "그녀는 마치 상담사가 자신과 같은 방에 있는 것처럼 느꼈다."], ["7", "상담이 끝날 무렵 그녀는 미소를 지으며 그에게 말했다. “온라인으로 꼭 다시 뵐게요!”"]], "evh": "4번 문장", "ev": [{"en": true, "h": "Once the session began, however, her concerns went away."}, {"en": false, "h": "심경 변화 문항은 <b>however·but 같은 전환 신호</b>가 경계선이다. 이 글에서는 4번 문장의 <b>however</b>가 딱 그 자리다. 앞쪽 1~3번 문장에는 <b>How can I open my heart ~?</b>라는 의문, <b>wasn't sure if</b>(확신하지 못했다)가 줄줄이 나와 <b>의심</b>을 보여 준다. 4번 문장에서 <b>her concerns went away</b>로 걱정이 사라지고, 5~7번 문장은 <b>much more convenient than expected</b>, <b>with a smile</b>, <b>I'll definitely see you online again</b>으로 <b>만족</b>을 확정한다. 앞은 의심, 뒤는 만족이므로 답은 <b>doubtful → satisfied</b>다."}], "opts": [{"n": "①", "t": "doubtful → satisfied (의심하는 → 만족한)", "a": true, "x": false, "trap": false, "e": "1~3번 문장의 <b>wondered</b>·<b>wasn't sure</b>가 의심이고, 5~7번 문장의 <b>more convenient than expected</b>·<b>with a smile</b>이 만족이다."}, {"n": "②", "t": "regretful → confused (후회하는 → 혼란스러운)", "a": false, "x": true, "trap": false, "e": "후회할 만한 일을 한 적이 없고, 뒤로 갈수록 오히려 <b>혼란이 걷히는</b> 흐름이다. 두 단어 모두 방향이 어긋난다."}, {"n": "③", "t": "confident → ashamed (자신 있는 → 부끄러운)", "a": false, "x": true, "trap": false, "e": "시작이 정반대다. 1번 문장은 <b>어떻게 마음을 열 수 있을까</b>라는 걱정이지 자신감이 아니다."}, {"n": "④", "t": "bored → excited (지루한 → 신이 난)", "a": false, "x": true, "trap": true, "e": "뒤쪽이 긍정으로 바뀐다는 점은 맞지만, 앞쪽이 <b>지루함</b>이 아니라 <b>의심</b>이다. 뒷부분만 보고 고르면 걸린다."}, {"n": "⑤", "t": "thrilled → disappointed (신이 난 → 실망한)", "a": false, "x": true, "trap": false, "e": "방향이 통째로 뒤집혀 있다. 마지막 7번 문장이 <b>다시 만나자</b>는 약속으로 끝나므로 실망일 수 없다."}], "w": [["log in to", "~에 접속하다"], ["counseling session", "상담 시간"], ["wonder", "궁금해하다, 생각하다"], ["counselor", "상담사"], ["a long drive away", "차로 한참 가야 하는 거리에"], ["in person", "직접 만나서"], ["once", "일단 ~하자"], ["concern", "걱정, 우려"], ["go away", "사라지다"], ["convenient", "편리한"], ["feel as if", "마치 ~인 것처럼 느끼다"], ["definitely", "분명히, 꼭"]]}, {"q": "03", "type": "글의 요지", "src": "2024학년도 수능 22번", "ans": "①", "tr": [["1", "자신의 응답에 우선순위를 매길 수 있다는 것은, 그것이 특별히 즐겁거나 속상했던 경험을 둘러싼 한 번뿐인 접촉이든 고객층 안에서 상당히 영향력 있는 개인과 맺는 더 장기적인 관계의 발전이든, 개별 고객과 더 깊이 관계를 맺게 해 준다."], ["2", "어떤 브랜드나 제품, 서비스에 대해 호의적인 댓글 — 사실 어떤 댓글이든 — 을 달아 본 적이 있다면, 그 결과로 예컨대 브랜드 담당자가 당신을 직접 알아봐 준다면 어떤 기분일지 생각해 보라."], ["3", "일반적으로 사람들은 할 말이 있어서 글을 올리며, 또한 그 말을 한 것에 대해 인정받고 싶어서 올린다."], ["4", "특히 사람들이 긍정적인 댓글을 올릴 때, 그것은 그 글을 쓰게 만든 경험에 대한 감사의 표현이다."], ["5", "옆에 서 있는 사람에게 건넨 칭찬은 보통 “고맙습니다” 같은 응답을 받지만, 안타깝게도 대부분의 브랜드 칭찬은 답을 받지 못한 채 남는다."], ["6", "이것은 무엇이 그 칭찬을 이끌어 냈는지 이해하고 그것을 바탕으로 탄탄한 팬층을 만들 수 있었던 기회를 놓쳐 버린 것이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "While a compliment to the person standing next to you is typically answered with a response like “Thank You,” the sad fact is that most brand compliments go unanswered."}, {"en": false, "h": "요지 문항은 <b>필자가 안타까워하는 지점</b>을 찾으면 된다. 5번 문장의 <b>the sad fact is that ~</b>이 바로 그 자리다. 사람 사이에서는 칭찬에 <b>고맙습니다</b>가 돌아오는데, 브랜드 칭찬은 <b>답을 받지 못한다</b>는 것이다. 그리고 6번 문장이 그것을 <b>lost opportunities</b>(놓쳐 버린 기회)라고 못박으며, 무엇이 칭찬을 이끌어 냈는지 이해하고 <b>탄탄한 팬층</b>을 만들 기회였다고 한다. 1번 문장의 <b>connect more deeply with individual customers</b>가 그 보상이다. 즉 <b>브랜드 칭찬에 응답하라</b>가 요지다."}], "opts": [{"n": "①", "t": "고객과의 관계 증진을 위해 고객의 브랜드 칭찬에 응답하는 것은 중요하다.", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>go unanswered</b>를 안타깝다고 하고, 6번 문장이 그것을 <b>기회 상실</b>로 규정한다. 1번 문장의 <b>connect more deeply</b>가 응답의 목적이다."}, {"n": "②", "t": "고객의 피드백을 면밀히 분석함으로써 브랜드의 성공 가능성을 높일 수 있다.", "a": false, "x": true, "trap": false, "e": "글에 <b>분석(analyze)</b>이라는 개념이 없다. 필자가 요구하는 것은 분석이 아니라 <b>응답</b>이다."}, {"n": "③", "t": "신속한 고객 응대를 통해서 고객의 긍정적인 반응을 이끌어 낼 수 있다.", "a": false, "x": true, "trap": true, "e": "<b>신속함(quick)</b>을 말한 문장이 없다. 문제는 응답이 <b>느린</b> 것이 아니라 <b>아예 없다</b>는 것이다."}, {"n": "④", "t": "브랜드 매니저에게는 고객의 부정적인 의견을 수용하는 태도가 요구된다.", "a": false, "x": true, "trap": false, "e": "2번 문장의 <b>upsetting experience</b>가 잠깐 나오지만, 글의 초점은 <b>favorable comment</b>와 <b>compliment</b>, 즉 <b>칭찬</b>이다."}, {"n": "⑤", "t": "고객의 의견을 경청하는 것은 브랜드의 새로운 이미지 창출에 도움이 된다.", "a": false, "x": true, "trap": false, "e": "<b>새로운 이미지 창출</b>은 글에 없는 말이다. 6번 문장이 말하는 결과물은 이미지가 아니라 <b>solid fan base</b>(탄탄한 팬층)다."}], "w": [["prioritize", "우선순위를 매기다"], ["one-off", "한 번뿐인, 일회성의"], ["interaction", "상호 작용, 접촉"], ["upsetting", "속상하게 하는"], ["influential", "영향력 있는"], ["customer base", "고객층"], ["favorable", "호의적인"], ["for that matter", "그 점에 관해서라면"], ["acknowledge", "인정하다, 알아주다"], ["appreciation", "감사, 고마움"], ["compliment", "칭찬"], ["go unanswered", "응답을 받지 못한 채로 있다"]]}, {"q": "04", "type": "어법", "src": "2016학년도 9월 28번", "ans": "③", "tr": [["1", "인터넷과 통신 기술은 선진 사회에 사는 젊은이들의 사회생활에서 점점 더 큰 역할을 한다."], ["2", "청소년들은 재빨리 기술에 빠져들었고, 대부분이 인터넷을 사용해 소통한다."], ["3", "젊은이들은 휴대전화를 삶의 필수품으로 여기며, 친구들과 소통할 때 흔히 문자 메시지 쓰기를 더 좋아한다."], ["4", "젊은이들은 또한 사회 관계망 웹사이트에 점점 더 많이 접속한다."], ["5", "기술과 인터넷이 젊은이들에게 친숙한 정보원이므로, 그들이 이 출처에서 도움을 구하려 하는 것은 당연하다."], ["6", "이는 젊은이들에게 치료 정보를 제공하는 웹사이트가 늘어난 것으로 나타났다."], ["7", "다수의 ‘청소년 친화적’ 정신 건강 웹사이트가 개발되어 왔다."], ["8", "제시되는 정보는 흔히 자주 묻는 질문(FAQ), 정보 요약지, 추천 링크의 형태를 띤다."], ["9", "그러므로 젊은이들에게 온라인 상담을 제공하는 것이 논리적으로 보일 것이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "As technology and the Internet are a familiar resource for young people, it is logical what they would seek assistance from this source."}, {"en": false, "h": "어법 문항은 <b>그 자리에 무엇이 필요한가</b>를 먼저 정하고 밑줄을 본다. 5번 문장의 주절은 <b>it is logical</b>인데, 이때 it은 <b>가주어</b>이고 진짜 주어는 뒤에 나와야 한다. 뒤를 보면 <b>they would seek assistance from this source</b>로 주어·동사·목적어가 <b>다 갖춰진 완전한 절</b>이다. 그런데 <b>what</b>은 뒤에 주어나 목적어가 <b>빠진 불완전한 절</b>을 데려오는 말이므로 여기에 올 수 없다. 완전한 절을 진주어로 이어 주는 말은 <b>that</b>이다. 따라서 <b>what → that</b>으로 고쳐야 한다."}], "opts": [{"n": "①", "t": "with most using the Internet to communicate", "a": false, "x": true, "trap": false, "e": "<b>with + 명사 + 분사</b> 구문으로 '~한 채로'를 뜻한다. most(대부분의 청소년)가 인터넷을 <b>사용하는</b> 쪽이므로 능동의 using이 옳다."}, {"n": "②", "t": "also increasingly access social networking websites", "a": false, "x": true, "trap": false, "e": "<b>increasingly</b>는 뒤의 동사 access를 꾸미는 <b>부사</b>다. 동사를 꾸미는 자리이므로 형용사 increasing이 아니라 부사가 맞다."}, {"n": "③", "t": "it is logical what they would seek assistance", "a": true, "x": false, "trap": false, "e": "가주어 it의 진주어 자리에 <b>완전한 절</b>이 왔으므로 불완전한 절을 이끄는 what을 쓸 수 없다. <b>that</b>으로 바꿔야 한다."}, {"n": "④", "t": "A number of ‘youth friendly’ mental health websites have been developed", "a": false, "x": true, "trap": true, "e": "<b>a number of + 복수명사</b>는 '많은 ~'이라는 뜻이라 <b>복수 취급</b>이 function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}

  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
</body>
</html>
