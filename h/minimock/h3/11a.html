3rd.</div><div class=\"k\">9월 3일 토요일에 벌어지는.</div></div><div class=\"rnat\">저는 9월 3일 토요일에 벌어지는 Yankees와의 시합을 위한 ‘Boston Red Sox 야구 여행’과 관련하여 편지를 쓰고 있습니다.</div><div class=\"rst\">“9월 3일 토요일 야구장 견학 캠프 때문에 연락드려요.” = 지문의 <b>야구 여행</b>(Baseball Trip)에 관한 편지라는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">Unfortunately,</div><div class=\"k\">불행하게도,</div></div><div class=\"rc\"><div class=\"e\">I have just become aware</div><div class=\"k\">저는 이제 막 알게 되었습니다</div></div><div class=\"rc ckc\"><div class=\"e\">that your company’s <span class=\"cw\">limit of 53 people for registration</span></div><div class=\"k\">귀사가 정한 <span class=\"cw\">53명의 등록 인원 한도가</span></div></div><div class=\"rc\"><div class=\"e\">has already been reached.</div><div class=\"k\">이미 다 찼다는 것을.</div></div><div class=\"rnat\">불행하게도, 저는 귀사가 정한 53명의 등록 인원 한도가 이미 다 찼다는 것을 이제 막 알게 되었습니다.</div><div class=\"rst\"><b>그런데 아쉽게도</b>(Unfortunately) 신청 인원 53명이 벌써 꽉 찼대요. 지문도 등록 한도가 이미 찼다는 문제 상황을 말해요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However</span>,</div><div class=\"k\"><span class=\"cw\">하지만</span>,</div></div><div class=\"rc\"><div class=\"e\">I would really appreciate it</div><div class=\"k\">저는 정말로 감사할 것입니다</div></div><div class=\"rc\"><div class=\"e\">if you could allow my son</div><div class=\"k\">만약 당신이 제 아들을 허락해 주신다면</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to register additionally</span>.</div><div class=\"k\"><span class=\"cw\">추가로 등록하도록</span>.</div></div><div class=\"rnat\">하지만, 제 아들을 추가로 등록하도록 허락해 주신다면 저는 정말로 감사할 것입니다.</div><div class=\"rst\"><b>하지만</b>(However) “우리 아이 한 명만 더 넣어 주시면 정말 감사하겠어요.” 지문의 <b>추가로 등록하도록</b>(register additionally)이 편지의 목적이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">He is a big fan of the Red Sox,</div><div class=\"k\">그는 (= 글쓴이의 아들) Red Sox의 열렬한 팬이고,</div></div><div class=\"rc\"><div class=\"e\">and this trip would make</div><div class=\"k\">그리고 이 여행은 ~이 될 것입니다</div></div><div class=\"rc\"><div class=\"e\">a great surprise gift for his birthday.</div><div class=\"k\">그의 생일을 위한 멋진 깜짝 선물이.</div></div><div class=\"rnat\">그 아이는 Red Sox의 열렬한 팬이고, 이 여행은 그 아이의 생일을 위한 멋진 깜짝 선물이 될 것입니다.</div><div class=\"rst\">“아이가 그 팀 왕팬이라 생일 깜짝 선물로 딱이에요.” 지문도 아들이 레드삭스(Red Sox) 팬이라며 부탁할 이유를 대요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">If there is any way</div><div class=\"k\">어떠한 방법이라도 있다면</div></div><div class=\"rc\"><div class=\"e\">that he is able to join the trip,</div><div class=\"k\">그가 (= 아들) 그 여행에 참여할 수 있는,</div></div><div class=\"rc\"><div class=\"e\">I would be very grateful.</div><div class=\"k\">저는 매우 감사할 것입니다.</div></div><div class=\"rnat\">그 아이가 그 여행에 참여할 수 있는 어떠한 방법이라도 있다면, 저는 매우 감사할 것입니다.</div><div class=\"rst\">“어떻게든 방법이 있으면 정말 고맙겠어요.” 지문도 아들이 참여할 방법이 있다면 매우 감사하겠다고 한 번 더 부탁해요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">I’m sure</div><div class=\"k\">저는 확신합니다</div></div><div class=\"rc\"><div class=\"e\">it would give him the perfect birthday.</div><div class=\"k\">그것이 (= 야구 여행) 그에게 (= 아들) 완벽한 생일을 만들어 줄 것이라고.</div></div><div class=\"rnat\">저는 그것(야구 여행)이 그 아이에게 완벽한 생일을 만들어 줄 것이라고 확신합니다.</div><div class=\"rst\">“분명 최고의 생일이 될 거예요.” 지문도 그 여행이 아들에게 완벽한 생일을 만들어 줄 거라고 확신해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">I look forward to hearing from you soon.</div><div class=\"k\">저는 곧 당신으로부터 답변을 듣기를 기대하겠습니다.</div></div><div class=\"rnat\">곧 답변 주시기를 기대하겠습니다.</div><div class=\"rst\">“답장 기다릴게요.” 지문도 곧 답변 듣기를 기대한다며 부탁을 마무리해요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">10번</span><div class=\"rc\"><div class=\"e\">Yours sincerely,</div><div class=\"k\">진심을 담아,</div></div><div class=\"rc\"><div class=\"e\">Cathy Cameron</div><div class=\"k\">Cathy Cameron 드림</div></div><div class=\"rnat\">진심을 담아, Cathy Cameron 드림</div><div class=\"rst\">문자 끝에 이름을 남기듯, 지문도 보낸 사람 캐시 캐머런(Cathy Cameron)의 이름으로 끝나요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"in regards to\" data-m=\"~와 관련하여\"><b>in regards to</b>~와 관련하여</button><button type=\"button\" class=\"wdb\" data-w=\"become aware that\" data-m=\"~을 알게 되다\"><b>become aware that</b>~을 알게 되다</button><button type=\"button\" class=\"wdb\" data-w=\"registration\" data-m=\"등록\"><b>registration</b>등록</button><button type=\"button\" class=\"wdb\" data-w=\"appreciate\" data-m=\"감사하다\"><b>appreciate</b>감사하다</button><button type=\"button\" class=\"wdb\" data-w=\"additionally\" data-m=\"추가로\"><b>additionally</b>추가로</button><button type=\"button\" class=\"wdb\" data-w=\"grateful\" data-m=\"감사하는\"><b>grateful</b>감사하는</button></div>", "02": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">인물 소개글은 선택지를 <b>지문 순서대로</b> 대조하세요. 지명이 두 개 나오면 <b>from there to(그곳에서 ~로)</b>처럼 <b>어디서 어디로</b> 갔는지 화살표를 그려 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ 2번</em>1915년에 이미(as early as 1915) 학파의 일원 → 같음</span><span><em>② ↔ 3번</em>one of the leaders(지도자 중 한 명) → 같음</span><span><em>④ ↔ 7번</em>bridge the gap(간극을 좁히다) → 같음</span><span><em>⑤ ↔ 8번</em>the father of modern structural linguistics(현대 구조 언어학의 아버지) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ③을 4번과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>③의 ‘스칸디나비아’가 4번에 나와요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 앞부분 · 첫 번째 이동</span><div class=\"en\">When Czechoslovakia was invaded by the Nazis, he was forced to <mark>flee to Scandinavia</mark>,</div><p class=\"ko\">체코슬로바키아가 나치의 침공을 받았을 때, 그는 어쩔 수 없이 <mark>스칸디나비아로 피신하게 되었다</mark>,</p></div><div class=\"ck-via\"><i>▼</i><span>there(그곳) = 스칸디나비아 → 출발지가 스칸디나비아, 도착지가 미국</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 뒷부분 · 결정적 단서</span><div class=\"en\">and went <mark>from there to the United States</mark> in 1941.</div><p class=\"ko\">그리고 1941년에 <mark>그곳에서 (= 스칸디나비아) 미국으로 갔다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">1941년에 미국에서 스칸디나비아로 이주했다.<small>4번: 스칸디나비아 → 미국이 맞아요. 선택지는 출발지와 도착지를 거꾸로 바꿨어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">1915년에 Russian Formalist 학파의 일원이었다.</span><span class=\"why\">2번 was a member of the Russian Formalist school(Russian Formalist 학파의 일원이었다), 1915년에 이미(as early as 1915)와 같아요. as early as(이르게는 ~에)를 보고 시점이 다르다고 착각하기 쉬워요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">Prague Linguistic Circle의 지도자 중 한 명이었다.</span><span class=\"why\">3번 one of the leaders of the influential Prague Linguistic Circle(영향력 있는 프라하 언어학회의 지도자 중 한 명)과 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">유럽과 미국 언어학 사이의 간극을 좁히는 데 기여했다.</span><span class=\"why\">7번 helped to bridge the gap between European and American linguistics(유럽과 미국 언어학 사이의 간극을 좁히는 데 기여했다)와 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">현대 구조 언어학의 아버지로 알려져 있다.</span><span class=\"why\">8번 Known as the father of modern structural linguistics(현대 구조 언어학의 아버지로 알려져 있는)와 같아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Roman Jakobson was one of the greatest linguists</div><div class=\"k\">Roman Jakobson은 가장 위대한 언어학자 중 한 명이었다</div></div><div class=\"rc\"><div class=\"e\">of the 20th century.</div><div class=\"k\">20세기의.</div></div><div class=\"rnat\">Roman Jakobson은 20세기의 가장 위대한 언어학자 중 한 명이었다.</div><div class=\"rst\">사회 수행평가로 위인 소개 카드를 만든다고 해 봐요. 첫 칸: 20세기 최고의 언어학자 야콥슨(Jakobson). 지문 1번 그대로예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">He was born in Russia</div><div class=\"k\">그는 러시아에서 태어났다</div></div><div class=\"rc\"><div class=\"e\">and was a member of the Russian Formalist school</div><div class=\"k\">그리고 Russian Formalist 학파의 일원이었다</div></div><div class=\"rc\"><div class=\"e\">as early as 1915.</div><div class=\"k\">1915년에 이미.</div></div><div class=\"rnat\">그는 러시아에서 태어났고 1915년에 이미 Russian Formalist 학파의 일원이었다.</div><div class=\"rst\">둘째 칸: 러시아 출생, <b>1915년에 이미</b> 한 학파의 멤버. 지문 2번이고 선택지 ①과 같아요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">Jakobson taught in Czechoslovakia</div><div class=\"k\">Jakobson은 체코슬로바키아에서 가르쳤다</div></div><div class=\"rc\"><div class=\"e\">between the two world wars,</div><div class=\"k\">두 세계 대전 사이에,</div></div><div class=\"rc\"><div class=\"e\">where he was one of the leaders</div><div class=\"k\">그리고 그곳에서 (= 체코슬로바키아) 그는 지도자 중 한 명이었다</div></div><div class=\"rc\"><div class=\"e\">of the influential Prague Linguistic Circle.</div><div class=\"k\">영향력이 있는 Prague Linguistic Circle의.</div></div><div class=\"rnat\">Jakobson은 두 세계 대전 사이에 체코슬로바키아에서 가르쳤고, 그곳에서 그는 영향력이 있는 Prague Linguistic Circle의 지도자 중 한 명이었다.</div><div class=\"rst\">셋째 칸: 두 세계 대전 사이 체코슬로바키아에서 가르치며 유명한 학회의 <b>지도자</b>였음. 지문 3번 = 선택지 ②예요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">When Czechoslovakia was invaded by the Nazis,</div><div class=\"k\">체코슬로바키아가 나치의 침공을 받았을 때,</div></div><div class=\"rc ckc\"><div class=\"e\">he was forced to <span class=\"cw\">flee to Scandinavia</span>,</div><div class=\"k\">그는 어쩔 수 없이 <span class=\"cw\">스칸디나비아로 피신하게 되었다</span>,</div></div><div class=\"rc ckc\"><div class=\"e\">and went <span class=\"cw\">from there to the United States</span></div><div class=\"k\">그리고 <span class=\"cw\">그곳에서 (= 스칸디나비아) 미국으로 갔다</span></div></div><div class=\"rc\"><div class=\"e\">in 1941.</div><div class=\"k\">1941년에.</div></div><div class=\"rnat\">체코슬로바키아가 나치의 침공을 받았을 때, 그는 어쩔 수 없이 스칸디나비아로 피신하게 되었고, 1941년에 그곳에서 미국으로 갔다.</div><div class=\"rst\">넷째 칸이 핵심! 나치를 피해 <b>스칸디나비아로</b> 갔다가, <b>그곳에서 미국으로</b>. 지문 4번 화살표가 선택지 ③과 반대예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">In 1943</div><div class=\"k\">1943년에</div></div><div class=\"rc\"><div class=\"e\">he became one of the founding members</div><div class=\"k\">그는 창립 멤버 중 한 명이 되었다</div></div><div class=\"rc\"><div class=\"e\">of the Linguistic Circle of New York</div><div class=\"k\">Linguistic Circle of New York의</div></div><div class=\"rc\"><div class=\"e\">and acted as its vice president until 1949.</div><div class=\"k\">그리고 1949년까지 그것의 (= Linguistic Circle of New York) 부회장으로 활동했다.</div></div><div class=\"rnat\">1943년에 그는 Linguistic Circle of New York의 창립 멤버 중 한 명이 되었고 1949년까지 부회장으로 활동했다.</div><div class=\"rst\">다섯째 칸: 1943년 뉴욕의 언어학회를 함께 세우고 1949년까지 부회장. 지문 5번 내용을 연도 그대로 적어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">He taught at numerous institutions</div><div class=\"k\">그는 수많은 기관에서 가르쳤다</div></div><div class=\"rc\"><div class=\"e\">from 1943 on,</div><div class=\"k\">1943년부터 계속,</div></div><div class=\"rc\"><div class=\"e\">including Harvard University and MIT.</div><div class=\"k\">하버드 대학교와 MIT를 포함한.</div></div><div class=\"rnat\">그는 1943년부터 계속 하버드 대학교와 MIT를 포함한 수많은 기관에서 가르쳤다.</div><div class=\"rst\">여섯째 칸: 1943년부터 하버드와 엠아이티(MIT) 같은 여러 학교에서 가르침. 지문 6번 그대로예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">Through his teaching in the United States,</div><div class=\"k\">미국에서의 그의 가르침을 통해,</div></div><div class=\"rc\"><div class=\"e\">Jakobson helped</div><div class=\"k\">Jakobson은 기여했다</div></div><div class=\"rc\"><div class=\"e\">to bridge the gap</div><div class=\"k\">간극을 좁히는 데에</div></div><div class=\"rc\"><div class=\"e\">between European and American linguistics.</div><div class=\"k\">유럽과 미국 언어학 사이의.</div></div><div class=\"rnat\">미국에서의 그의 가르침(교수 활동)을 통해, Jakobson은 유럽과 미국 언어학 사이의 간극을 좁히는 데에 기여했다.</div><div class=\"rst\">일곱째 칸: 미국에서 가르치며 유럽과 미국 언어학 사이를 <b>이어 줌</b>. 지문 7번 = 선택지 ④예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Known as the father of modern structural linguistics,</div><div class=\"k\">현대 구조 언어학의 아버지로 알려져 있는,</div></div><div class=\"rc\"><div class=\"e\">he elaborated sophisticated theories</div><div class=\"k\">그는 복잡한 이론들을 정교하게 만들어 냈다</div></div><div class=\"rc\"><div class=\"e\">of language and communication</div><div class=\"k\">언어와 의사소통의</div></div><div class=\"rc\"><div class=\"e\">that have had significant effects</div><div class=\"k\">상당한 영향을 미쳐 온</div></div><div class=\"rc\"><div class=\"e\">on such disciplines as anthropology, art criticism, and brain research.</div><div class=\"k\">인류학, 미술 비평, 그리고 뇌 연구와 같은 학문 분야에.</div></div><div class=\"rnat\">현대 구조 언어학의 아버지로 알려져 있는 그는 인류학, 미술 비평, 그리고 뇌 연구와 같은 학문 분야에 상당한 영향을 미쳐 온 언어와 의사소통의 복잡한 이론들을 정교하게 만들어 냈다.</div><div class=\"rst\">마지막 칸: <b>현대 구조 언어학의 아버지</b>로 불리고, 그 이론이 인류학·뇌 연구까지 영향을 줌. 지문 8번 = 선택지 ⑤예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"linguist\" data-m=\"언어학자\"><b>linguist</b>언어학자</button><button type=\"button\" class=\"wdb\" data-w=\"influential\" data-m=\"영향력 있는\"><b>influential</b>영향력 있는</button><button type=\"button\" class=\"wdb\" data-w=\"invade\" data-m=\"침공하다, 침략하다\"><b>invade</b>침공하다, 침략하다</button><button type=\"button\" class=\"wdb\" data-w=\"flee\" data-m=\"달아나다, 피신하다\"><b>flee</b>달아나다, 피신하다</button><button type=\"button\" class=\"wdb\" data-w=\"bridge the gap\" data-m=\"간극을 좁히다\"><b>bridge the gap</b>간극을 좁히다</button><button type=\"button\" class=\"wdb\" data-w=\"sophisticated\" data-m=\"정교한, 복잡한\"><b>sophisticated</b>정교한, 복잡한</button></div>", "03": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">밑줄 <b>make oneself public to oneself</b>(자신을 자신에게 공개적으로 만들다)는 역설적인 비유예요. 보여 주는 상대가 <b>남이 아니라 나 자신</b>이라는 점을 바로 뒤 7번의 <b>self-inspection(자기 점검)</b>으로 풀어 보세요.</p><div class=\"ck-step\"><span class=\"lab\">밑줄 문장 (6번)</span><div class=\"en\">Diaries were personal and private; <mark>one would write for oneself</mark>, or, in Habermas’s formulation, one would make oneself public to oneself.</div><p class=\"ko\">일기는 개인적이고 사적인 것이었다; <mark>사람들은 자신을 위해 쓰곤 했다</mark>, 혹은, Habermas의 명확한 표현에 따르면, 자신을 자신에게 공개적으로 만들곤 했다.</p></div><div class=\"ck-via\"><i>▼</i><span>3번에서 매일 자기 감정·생각을 쓰고, 4번에서 다시 읽으며 자신을 깨달아요</span></div><div class=\"ck-step\"><span class=\"lab\">4번 문장 · 다시 읽으며 깨달음</span><div class=\"en\">Over time and <mark>with rereading</mark>, … could be rendered into <mark>insights and narratives</mark> about the self,</div><p class=\"ko\">시간이 지남에 따라 그리고 <mark>다시 읽음으로써</mark>, … <mark>통찰력과 이야기</mark>로 만들어질 수 있었다 자아에 관한,</p></div><div class=\"ck-via\"><i>▼</i><span>밑줄을 바로 다음 문장이 그대로 풀어 줘요</span></div><div class=\"ck-step key\"><span class=\"lab\">7번 문장 · 결정적 단서</span><div class=\"en\">By making the self public in a private sphere, the self also became an object <mark>for self-inspection and self-critique</mark>.</div><p class=\"ko\">자아를 공적으로 만들면서 사적 영역에서, 자아는 또한 대상이 되었다 <mark>자기 점검과 자기 비판의</mark>.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>public</em>드러내 보이기 = 글로 써서 꺼내 놓기</span><span><em>to oneself</em>보는 사람은 남이 아니라 나 자신</span><span><em>결과</em>나를 점검하고 비판하는 대상으로 삼음</span></div><div class=\"ck-eq\">⇒ 밑줄의 속뜻 = 글을 자신을 되돌아보는 수단으로 쓰곤 했다 → ①</div></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">use writing as a means of reflecting on oneself 글을 자신을 되돌아보는 수단으로 사용하곤<small>자기 생각을 글로 꺼내 놓고 스스로 들여다본다는 뜻이라, 7번 self-inspection(자기 점검)과 같아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">create an alternate ego to present to others 다른 사람에게 제시하기 위한 대체 자아를 창조하곤</span><span class=\"why\">public(공개적인)을 글자 그대로 ‘남에게 보여 주기’로 읽은 함정이에요. 6번은 personal and private(개인적이고 사적인)이고 to oneself(자신에게)라서 보여 주는 상대는 남이 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">build one's identity by reading others' diaries 타인의 일기를 읽음으로써 자신의 정체성을 확립하곤</span><span class=\"why\">4번의 rereading(다시 읽기)은 자기 일기를 다시 읽는 거예요. 6번에서 write for oneself(자신을 위해 쓰다)라고 했으니 남의 일기를 읽는 게 아니에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">exchange feedback in the process of writing 글 쓰는 과정에서 의견을 교환하곤</span><span class=\"why\">의견을 주고받으려면 상대가 있어야 하는데, 6번은 일기가 private(사적인) 것이고 자신을 위해 썼다고 해요. 7번의 self-critique(자기 비판)도 스스로 하는 비판이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">develop topics for writing about selfhood 자아에 관한 글을 쓰기 위한 주제를 개발하곤</span><span class=\"why\">3번에서 일기는 그날의 행방·감정·생각을 쓰는 공간이에요. 글감을 따로 개발한다는 말은 없고, 7번의 핵심은 글 주제가 아니라 자기 점검이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Coming of age in the 18th and 19th centuries,</div><div class=\"k\">18세기와 19세기에 발달한 상태가 된,</div></div><div class=\"rc\"><div class=\"e\">the personal diary became a centerpiece</div><div class=\"k\">개인 일기는 중심물이 되었다</div></div><div class=\"rc\"><div class=\"e\">in the construction of a modern subjectivity,</div><div class=\"k\">근대적 주체성을 구축하는 데,</div></div><div class=\"rc\"><div class=\"e\">at the heart of which</div><div class=\"k\">그리고 그것의 중심에는</div></div><div class=\"rc\"><div class=\"e\">is the application of reason and critique</div><div class=\"k\">이성과 비판을 적용하는 것이 있었다</div></div><div class=\"rc\"><div class=\"e\">to the understanding of world and self,</div><div class=\"k\">세계와 자아에 대한 이해에,</div></div><div class=\"rc\"><div class=\"e\">which allowed the creation of a new kind of knowledge.</div><div class=\"k\">그리고 이는 새로운 종류의 지식을 창조할 수 있게 해 주었다.</div></div><div class=\"rnat\">18세기와 19세기에 발달한 상태가 된 개인 일기는 근대적 주체성을 구축하는 데 중심물이 되었는데, 그것의 중심에는 세계와 자아에 대한 이해에 이성과 비판을 적용하는 것이 있었고, 이는 새로운 종류의 지식을 창조할 수 있게 해 주었다.</div><div class=\"rst\">요즘 우리가 쓰는 감정일기를 떠올려 봐요. 지문 1번은 18~19세기에 개인 <b>일기</b>가 ‘나’를 세우는 중심이 됐다고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Diaries were central media</div><div class=\"k\">일기는 중심 매체였다</div></div><div class=\"rc\"><div class=\"e\">through which enlightened and free subjects</div><div class=\"k\">그것을 (= 일기) 통해 계몽되고 자유로운 주체가</div></div><div class=\"rc\"><div class=\"e\">could be constructed.</div><div class=\"k\">구성될 수 있는.</div></div><div class=\"rnat\">일기는 그것을 통해 계몽되고 자유로운 주체가 구성될 수 있는 중심 매체였다.</div><div class=\"rst\">일기장은 내가 스스로 생각하는 사람이 되게 도와주는 도구예요. = 지문 2번, 일기는 자유로운 주체를 만드는 중심 매체였다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">They provided a space</div><div class=\"k\">그것들은 (= 일기) 공간을 제공했다</div></div><div class=\"rc\"><div class=\"e\">where one could write daily</div><div class=\"k\">개인이 매일 쓸 수 있는</div></div><div class=\"rc\"><div class=\"e\">about her whereabouts, feelings, and thoughts.</div><div class=\"k\">자신의 행방, 감정, 그리고 생각에 대해.</div></div><div class=\"rnat\">그것(일기)은 개인이 자신의 행방, 감정, 생각에 대해 매일 쓸 수 있는 공간을 제공했다.</div><div class=\"rst\">오늘 어디 갔는지, 친구랑 다퉈서 속상했던 마음을 매일 적어요. 지문 3번도 일기는 행방·감정·생각을 쓰는 공간이래요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">Over time and <span class=\"cw\">with rereading</span>,</div><div class=\"k\">시간이 지남에 따라 그리고 <span class=\"cw\">다시 읽음으로써</span>,</div></div><div class=\"rc\"><div class=\"e\">disparate entries, events, and happenstances</div><div class=\"k\">이질적인 항목, 사건, 그리고 우연한 일들이</div></div><div class=\"rc\"><div class=\"e\">could be rendered into insights and narratives</div><div class=\"k\">통찰력과 이야기로 만들어질 수 있었다</div></div><div class=\"rc\"><div class=\"e\">about the self,</div><div class=\"k\">자아에 관한,</div></div><div class=\"rc\"><div class=\"e\">and allowed for the formation of subjectivity.</div><div class=\"k\">그리고 주체성의 형성을 가능하게 했다.</div></div><div class=\"rnat\">시간이 지남에 따라 그리고 다시 읽음으로써, 이질적인 항목, 사건 및 우연한 일들이 자아에 관한 통찰력과 이야기로 만들어질 수 있었으며, 이는 주체성의 형성을 가능하게 했다.</div><div class=\"rst\">한 달 뒤 <b>다시 읽어 보면</b> “나는 화나면 말을 안 하는구나” 하고 깨달아요. 지문 4번의 자아에 관한 통찰이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">It is in that context</div><div class=\"k\">바로 그러한 맥락에서다</div></div><div class=\"rc\"><div class=\"e\">that the idea of “the self [as] both made and explored with words”</div><div class=\"k\">‘말로 만들어지고 또한 탐구되는 (것으로서의) 자아’라는 개념이</div></div><div class=\"rc\"><div class=\"e\">emerges.</div><div class=\"k\">나타나는 것은.</div></div><div class=\"rnat\">‘말로 만들어지고 또한 탐구되는 (것으로서의) 자아’라는 개념이 나타나는 것은 바로 그러한 맥락에서다.</div><div class=\"rst\">그래서 ‘나’는 글로 만들어지고 글로 알아 가는 거예요. 지문 5번이 바로 그 생각이 나온 맥락이라고 해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Diaries were personal and private;</div><div class=\"k\">일기는 개인적이고 사적인 것이었다;</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">one would write for oneself</span>,</div><div class=\"k\"><span class=\"cw\">사람들은 자신을 위해 쓰곤 했다</span>,</div></div><div class=\"rc\"><div class=\"e\">or, in Habermas’s formulation,</div><div class=\"k\">혹은, Habermas의 명확한 표현에 따르면,</div></div><div class=\"rc\"><div class=\"e\">one would make oneself public to oneself.</div><div class=\"k\">자신을 자신에게 공개적으로 만들곤 했다.</div></div><div class=\"rnat\">일기는 개인적이고 사적인 것이어서, 사람들은 자신을 위해 쓰곤 했는데, Habermas의 명확한 표현에 따르면, &lt;b&gt;자신을 자신에게 공개적으로 만들곤&lt;/b&gt;(글을 자신을 되돌아보는 수단으로 사용하곤) 했다.</div><div class=\"rst\">일기는 자물쇠 잠긴 나만의 공책이에요. 그 안에서 <b>나를 나에게 보여 줘요</b>. 이게 지문 6번 밑줄의 뜻이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">By making the self public</div><div class=\"k\">자아를 공적으로 만들면서</div></div><div class=\"rc\"><div class=\"e\">in a private sphere,</div><div class=\"k\">사적 영역에서,</div></div><div class=\"rc\"><div class=\"e\">the self also became an object</div><div class=\"k\">자아는 또한 대상이 되었다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">for self-inspection and self-critique</span>.</div><div class=\"k\"><span class=\"cw\">자기 점검과 자기 비판의</span>.</div></div><div class=\"rnat\">자아를 사적 영역에서 공적으로 만들면서, 자아는 또한 자기 점검과 자기 비판의 대상이 되었다.</div><div class=\"rst\">나에게 보여 주니 나를 <b>점검하고 비판할</b> 수 있어요. 지문 7번이 밑줄을 풀어 줘서, 정답은 “글로 자신을 되돌아본다”(①)예요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"subjectivity\" data-m=\"주체성, 주관성\"><b>subjectivity</b>주체성, 주관성</button><button type=\"button\" class=\"wdb\" data-w=\"whereabouts\" data-m=\"행방, 소재\"><b>whereabouts</b>행방, 소재</button><button type=\"button\" class=\"wdb\" data-w=\"disparate\" data-m=\"이질적인, 서로 다른\"><b>disparate</b>이질적인, 서로 다른</button><button type=\"button\" class=\"wdb\" data-w=\"be rendered into\" data-m=\"~로 만들어지다\"><b>be rendered into</b>~로 만들어지다</button><button type=\"button\" class=\"wdb\" data-w=\"sphere\" data-m=\"영역\"><b>sphere</b>영역</button><button type=\"button\" class=\"wdb\" data-w=\"self-inspection\" data-m=\"자기 점검\"><b>self-inspection</b>자기 점검</button></div>", "04": "<p class=\"mtr\">마더텅 정답률 <b>60%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">일화형 제목은 <b>사건의 시작</b>과 <b>마지막 해결</b>을 한 줄로 묶어요. 5번에서 문제를 <b>만든 사람</b>과 9·10번에서 <b>해결한 사람</b>이 같은 Yates(예이츠)라는 점이 핵심이에요.</p><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 문제를 만든 사람</span><div class=\"en\">One night <mark>he climbed up and did the job</mark>; next morning the result was generally much admired.</div><p class=\"ko\">어느 날 밤 <mark>그는 기어올라서 그 일을 했다</mark>; 다음 날 아침 그 결과는 대체로 많은 칭찬을 받았다.</p></div><div class=\"ck-via\"><i>▼</i></div><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>6번</em>대학 당국은 못마땅해하며 가운을 벗길 방법을 찾음</span><span><em>7번</em>일반 사다리로는 닿지 않음</span><span><em>8번</em>갈고리 밧줄로 위에서 벗기려다 실패</span></div><div class=\"ck-eq\">⇒ 6~8번 = Yates(예이츠)가 만든 일이 대학의 골칫거리가 됨</div></div><div class=\"ck-via\"><i>▼</i><span>아무도 못 풀자, 문제를 만든 본인이 나서요</span></div><div class=\"ck-step key\"><span class=\"lab\">9번 문장 · 결정적 단서</span><div class=\"en\">No progress was being made and eventually <mark>Yates came forward</mark> and volunteered to climb up in the daylight and <mark>bring them down</mark>.</div><p class=\"ko\">아무런 진전도 이루어지지 않고 있었다 그리고 결국 <mark>Yates가 나섰다</mark> 그리고 대낮에 기어오르겠다고 자원했다 그리고 <mark>그것들을 (= 흰 가운) 갖고 내려오겠다고</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>자원한 일을 실제로 해내며 이야기가 닫혀요</span></div><div class=\"ck-step\"><span class=\"lab\">10번 문장 · 해결로 마무리</span><div class=\"en\"><mark>This he did</mark> to the admiration of the crowd that assembled.</div><p class=\"ko\"><mark>이것을 (= 가운을 갖고 내려오는 일) 그는 해냈다</mark> 모인 군중들이 감탄할 정도로.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">A Student Who Solved a Problem of His Own Making 자신이 만든 문제를 해결한 학생<small>5번에서 가운을 입힌 학생 Yates(예이츠)가 10번에서 직접 벗겨 내려와요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">A Smart Professor Who Identified a Criminal 범죄자를 찾은 똑똑한 교수</span><span class=\"why\">[지문에 없음] 2번에서 Yates(예이츠)는 교수가 아니라 student years(학생 시절)였어요. 범인을 찾는 사람도 없고, 오히려 일을 벌인 본인이 9번에서 나서요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">A Scary Legend About the Statues at St John's College St John's College에 있는 동상들에 대한 무서운 전설</span><span class=\"why\">[지문에 없음] 4번에 statues of saints(성인들의 동상)가 나오지만 무서운 전설은 없어요. 1번처럼 실제 인물 Yates(예이츠)에 대한 이야기예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Standards of Beauty Varying from Person to Person 사람마다 다른 미의 기준</span><span class=\"why\">[범위 좁음] 5번 칭찬과 6번 당국의 못마땅함만 따온 말이에요. 글의 끝은 미의 기준이 아니라 9·10번의 문제 해결이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">A Success Story of a Mysterious Architect 신비한 건축가의 성공 이야기</span><span class=\"why\">[지문에 없음] 1번에서 Yates(예이츠)는 statistician(통계학자)이에요. 4번의 탑은 장소일 뿐, 건축가 이야기는 없어요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">There is a story about F. Yates,</div><div class=\"k\">F. Yates에 대한 이야기가 있다,</div></div><div class=\"rc\"><div class=\"e\">a prominent UK statistician.</div><div class=\"k\">영국의 저명한 통계학자인.</div></div><div class=\"rnat\">영국의 저명한 통계학자인 F. Yates에 대한 이야기가 있다.</div><div class=\"rst\">학교에 전해 오는 졸업생 선배의 웃긴 일화를 떠올려 봐요. 지문 1번도 영국의 유명한 통계학자 예이츠(Yates) 이야기예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">During his student years</div><div class=\"k\">그의 학생 시절에</div></div><div class=\"rc\"><div class=\"e\">at St. John’s College, Cambridge,</div><div class=\"k\">Cambridge의 St. John’s College에서의,</div></div><div class=\"rc\"><div class=\"e\">Yates had been keen on a form of sport.</div><div class=\"k\">Yates는 스포츠의 한 형태에 매우 관심이 많았다.</div></div><div class=\"rnat\">Cambridge의 St. John’s College에서의 학생 시절에, Yates는 스포츠의 한 형태에 매우 관심이 많았다.</div><div class=\"rst\">그 선배는 학생 시절 특이한 놀이에 푹 빠졌었대요. 지문 2번도 예이츠가 대학 시절 한 스포츠에 관심이 많았다고 해요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It consisted of climbing about</div><div class=\"k\">그것은 (= 그 스포츠) 올라 다니는 것으로 구성되었다</div></div><div class=\"rc\"><div class=\"e\">the roofs and towers of the college buildings</div><div class=\"k\">대학 건물들의 지붕과 탑을</div></div><div class=\"rc\"><div class=\"e\">at night.</div><div class=\"k\">밤에.</div></div><div class=\"rnat\">그것은 밤에 대학 건물들의 지붕과 탑을 올라 다니는 것으로 구성되었다.</div><div class=\"rst\">그 놀이는 밤에 학교 건물 지붕과 탑을 타고 오르는 거였어요. 지문 3번 그대로예요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">In particular,</div><div class=\"k\">특히,</div></div><div class=\"rc\"><div class=\"e\">the chapel of St. John’s College has</div><div class=\"k\">St. John’s College 예배당에는 ~이 있다</div></div><div class=\"rc\"><div class=\"e\">a massive neo-Gothic tower</div><div class=\"k\">거대한 신고딕 양식의 탑이</div></div><div class=\"rc\"><div class=\"e\">adorned with statues of saints,</div><div class=\"k\">성인들의 동상으로 장식된,</div></div><div class=\"rc\"><div class=\"e\">and to Yates it appeared obvious</div><div class=\"k\">그리고 Yates에게는 분명해 보였다</div></div><div class=\"rc\"><div class=\"e\">that it would be more decorous</div><div class=\"k\">더 품위 있을 것이</div></div><div class=\"rc\"><div class=\"e\">if these saints were properly attired in surplices.</div><div class=\"k\">이 성인들이 적절하게 흰 가운으로 차려 입혀지면.</div></div><div class=\"rnat\">특히, St. John’s College 예배당에는 성인들의 동상으로 장식된 거대한 신고딕 양식의 탑이 있는데, Yates에게는 이 성인들이 적절하게 흰 가운으로 차려 입혀지면 더 품위 있을 것이 분명해 보였다.</div><div class=\"rst\">교정의 높은 탑에 성인 동상들이 서 있는데, 선배는 “흰 가운을 입히면 더 멋지겠다”고 생각했어요. 지문 4번의 생각이에요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc ckc\"><div class=\"e\">One night <span class=\"cw\">he climbed up and did the job</span>;</div><div class=\"k\">어느 날 밤 <span class=\"cw\">그는 기어올라서 그 일을 했다</span>;</div></div><div class=\"rc\"><div class=\"e\">next morning the result was generally much admired.</div><div class=\"k\">다음 날 아침 그 결과는 대체로 많은 칭찬을 받았다.</div></div><div class=\"rnat\">어느 날 밤 그는 기어올라서 그 일을 했으며, 다음 날 아침 그 결과는 대체로 많은 칭찬을 받았다.</div><div class=\"rst\">어느 밤 선배가 <b>몰래 올라가 가운을 입혔고</b>, 다음 날 다들 감탄했어요. 지문 5번, 이게 문제의 시작이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">But the College authorities were unappreciative</div><div class=\"k\">하지만 대학 당국은 인정하지 않았다</div></div><div class=\"rc\"><div class=\"e\">and began to consider means</div><div class=\"k\">그리고 방안을 고려하기 시작했다</div></div><div class=\"rc\"><div class=\"e\">of divesting the saints of their newly acquired garments.</div><div class=\"k\">그 성인들에게서 그들이 (= 성인들) 새롭게 얻은 의복을 벗기는.</div></div><div class=\"rnat\">하지만 대학 당국은 인정하지 않았으며 그 성인들에게서 그들이 새롭게 얻은 의복을 벗기는 방안에 대해 고려하기 시작했다.</div><div class=\"rst\"><b>그런데</b> 학교 측은 못마땅해서 가운을 벗길 방법을 고민해요. 지문 6번에서 이야기가 골칫거리로 바뀌어요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">This was not easy,</div><div class=\"k\">이것은 (= 가운을 벗기는 일) 쉽지 않았다,</div></div><div class=\"rc\"><div class=\"e\">since they were well out of reach</div><div class=\"k\">그것들은 (= 성인들의 동상) 도저히 닿지 않았기 때문에</div></div><div class=\"rc\"><div class=\"e\">of any ordinary ladder.</div><div class=\"k\">일반 사다리로는.</div></div><div class=\"rnat\">그것들은 일반 사다리로는 도저히 닿지 않았기 때문에, 이것은 쉽지 않았다.</div><div class=\"rst\">동상이 너무 높아 평범한 사다리로는 안 닿아요. 지문 7번, 벗기는 일이 쉽지 않았던 이유예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">An attempt to lift the surplices off from above,</div><div class=\"k\">위에서 흰 가운을 들어 올려 벗기려는 시도는,</div></div><div class=\"rc\"><div class=\"e\">using ropes with hooks attached,</div><div class=\"k\">갈고리가 부착된 밧줄을 사용하여,</div></div><div class=\"rc\"><div class=\"e\">was unsuccessful.</div><div class=\"k\">성공하지 못했다.</div></div><div class=\"rnat\">갈고리가 부착된 밧줄을 사용하여 위에서 흰 가운을 들어 올려 벗기려는 시도는 성공하지 못했다.</div><div class=\"rst\">갈고리 단 밧줄로 위에서 걷어 내려 해도 실패해요. 지문 8번, 학교가 또 한 번 막힌 거예요.</div></div><div class=\"rds key\" data-ord=\"9\"><span class=\"rn\">9번 · 단서</span><div class=\"rc\"><div class=\"e\">No progress was being made</div><div class=\"k\">아무런 진전도 이루어지지 않고 있었다</div></div><div class=\"rc ckc\"><div class=\"e\">and eventually <span class=\"cw\">Yates came forward</span></div><div class=\"k\">그리고 결국 <span class=\"cw\">Yates가 나섰다</span></div></div><div class=\"rc\"><div class=\"e\">and volunteered to climb up in the daylight</div><div class=\"k\">그리고 대낮에 기어오르겠다고 자원했다</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">bring them down</span>.</div><div class=\"k\">그리고 <span class=\"cw\">그것들을 (= 흰 가운) 갖고 내려오겠다고</span>.</div></div><div class=\"rnat\">아무런 진전도 이루어지지 않았으며 결국 Yates가 나서서 대낮에 기어올라 그것들을 갖고 내려오겠다고 자원했다.</div><div class=\"rst\">결국 그 선배가 <b>“제가 할게요”</b> 하고 나서서 대낮에 올라가 가운을 가져오겠대요. 지문 9번, 만든 사람이 직접 해결에 나서요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">10번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">This he did</span></div><div class=\"k\"><span class=\"cw\">이것을 (= 가운을 갖고 내려오는 일) 그는 해냈다</span></div></div><div class=\"rc\"><div class=\"e\">to the admiration of the crowd that assembled.</div><div class=\"k\">모인 군중들이 감탄할 정도로.</div></div><div class=\"rnat\">모인 군중들이 감탄할 정도로 그는 이것을 해냈다.</div><div class=\"rst\">그리고 진짜 <b>해냈고</b> 모인 사람들이 감탄했어요. 지문 10번이라, 제목은 “자신이 만든 문제를 해결한 학생”(②)이에요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"prominent\" data-m=\"저명한, 현저한\"><b>prominent</b>저명한, 현저한</button><button type=\"button\" class=\"wdb\" data-w=\"statistician\" data-m=\"통계학자\"><b>statistician</b>통계학자</button><button type=\"button\" class=\"wdb\" data-w=\"adorn\" data-m=\"장식하다, 꾸미다\"><b>adorn</b>장식하다, 꾸미다</button><button type=\"button\" class=\"wdb\" data-w=\"unappreciative\" data-m=\"인정하지 않는\"><b>unappreciative</b>인정하지 않는</button><button type=\"button\" class=\"wdb\" data-w=\"garment\" data-m=\"의복\"><b>garment</b>의복</button><button type=\"button\" class=\"wdb\" data-w=\"surplice\" data-m=\"흰 가운\"><b>surplice</b>흰 가운</button></div>", "05": "<p class=\"mtr\">마더텅 정답률 <b>40%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">관계사 자리는 해석보다 <b>뒤 절에 빠진 자리가 있는지</b>부터 세세요. 빠진 자리가 있으면 관계대명사 <b>which</b>(~하는), 주어·동사가 다 갖춰져 있으면 관계부사 <b>where</b>(그곳에서 ~하는)예요.</p><div class=\"ck-step\"><span class=\"lab\">문제지 ①번 자리 (1번)</span><div class=\"en\">… just performance showcases <u>① which</u> the best is recognized and the rest are overlooked.</div><p class=\"ko\">단지 기량을 보여 주는 공개 행사 ( ? ) 최고는 인정받고 나머지는 무시되는 — 앞은 장소 같은 명사, 뒤는 절 두 개</p></div><div class=\"ck-via\"><i>▼</i><span>뒤 절 두 개가 주어+동사로 다 갖춰져 있어요 → 빠진 자리 없음</span></div><div class=\"ck-step key\"><span class=\"lab\">1번 문장 · 결정적 단서</span><div class=\"en\"><mark>the best is recognized</mark> and <mark>the rest are overlooked</mark></div><p class=\"ko\"><mark>최고는 인정받는</mark> 그리고 <mark>나머지는 무시되는</mark></p></div><div class=\"ck-via\"><i>▼</i><span>showcases(공개 행사)는 기량을 보여 주는 ‘자리’라서 장소 관계부사가 와요</span></div><div class=\"ck-step\"><span class=\"lab\">1번 문장 · 선행사 확인</span><div class=\"en\">just performance showcases <mark>where</mark> the best is recognized</div><p class=\"ko\">단지 기량을 보여 주는 공개 행사 <mark>그곳에서 (= 공개 행사)</mark> 최고는 인정받는</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">관계대명사 which(~하는)와 관계부사 where(그곳에서 ~하는) 구별</p><p class=\"gr\">which(~하는) 뒤에는 주어나 목적어가 빠진 불완전한 절이 와요. where(그곳에서 ~하는) 뒤에는 주어·동사가 다 갖춰진 완전한 절이 오고, in which(그 안에서)로 바꿔 쓸 수 있어요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the park where we play soccer.</div><div class=\"ko\">여기는 우리가 축구를 하는 공원이야. (we play soccer가 완전하니 where)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>This is the park which we play soccer.</div><div class=\"ko\">뒤 절이 빠진 자리 없이 완전한데 which를 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>This is the park which I visited.</div><div class=\"ko\">여기는 내가 방문한 공원이야. (visited 뒤 목적어가 비었으니 which)</div></div><p class=\"gb\">지문 1번도 ① 뒤 the best is recognized(최고는 인정받는)와 the rest are overlooked(나머지는 무시되는)가 둘 다 완전한 절이에요. 그래서 which(~하는)가 아니라 where(그곳에서 ~하는)예요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">①</span><span class=\"t\">which → where (그곳에서 ~하는)<small>뒤가 완전한 절이고 선행사 showcases(공개 행사)가 장소 개념이라 where(그곳에서 ~하는) = in which(그 안에서)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">is ~이다</span><span class=\"why\">2번 주어는 The provision(제공하는 것)이에요. 그 뒤 constructive feedback(건설적인 피드백)과 participants(참가자들)는 꾸밈말 속 명사일 뿐이에요. 핵심 주어가 단수라 is(~이다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">주어-동사 수 일치: 꾸밈말 빼고 핵심 주어로 수를 정해요</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>The box of old toys is heavy.</div><div class=\"ko\">낡은 장난감이 든 상자는 무겁다. (핵심 주어 box 상자가 단수라 is가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>The box of old toys are heavy.</div><div class=\"ko\">바로 앞 toys(장난감들)에 끌려 are를 써서 틀려요. 주어는 box(상자)예요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>The pictures on the wall are pretty.</div><div class=\"ko\">벽에 걸린 그림들은 예쁘다. (핵심 주어 pictures 그림들이 복수라 are가 맞아요)</div></div><p class=\"gb\">지문 2번도 feedback(피드백)이나 participants(참가자들)가 아니라 The provision(제공하는 것)이 주어라서 is(~이다)가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">necessarily 반드시</span><span class=\"why\">5번 but not necessarily excellence(그러나 꼭 탁월함은 아닌)는 not(아닌)과 함께 ‘꼭 ~인 것은 아니다’라는 부분 부정이에요. not(아닌) 뒤에서 ‘꼭’이라는 뜻을 더하는 부사 자리라 necessarily(반드시)가 맞고, 형용사 necessary(필요한)는 못 와요.</span><div class=\"gm wx\"><p class=\"gt\">부분 부정: not(아닌) + necessarily(반드시) = 꼭 ~인 것은 아니다 (부사 자리)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>Expensive shoes are not necessarily good.</div><div class=\"ko\">비싼 신발이 꼭 좋은 것은 아니다. (not 뒤에서 ‘꼭’의 뜻을 더하는 부사 necessarily라서 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>Expensive shoes are not necessary good.</div><div class=\"ko\">형용사 necessary(필요한)는 형용사 good(좋은)을 꾸밀 수 없어서 틀려요.</div></div><p class=\"gb\">지문 5번도 not necessarily excellence(꼭 탁월함은 아닌)로 ‘우월함은 보여 주지만 꼭 탁월함은 아니다’라는 부분 부정이라 부사가 맞아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">fostering 조장하는 것</span><span class=\"why\">7번은 see A as B(A를 B로 간주하다) 구조예요. as(~으로)는 전치사라 뒤에 명사 역할이 와야 하고, 뒤에 목적어 a detrimental effect(유해한 효과)도 있으니 동명사 fostering(조장하는 것)이 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">전치사 as(~으로) 뒤 동명사: see A as(A를 ~으로 여기다) + 동명사(~하는 것)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I see reading as relaxing my mind.</div><div class=\"ko\">나는 독서를 마음을 쉬게 하는 것으로 여긴다. (as 뒤 동명사 relaxing이라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I see reading as relax my mind.</div><div class=\"ko\">전치사 as(~으로) 뒤에 동사원형 relax(쉬게 하다)를 바로 써서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She sees math as solving puzzles.</div><div class=\"ko\">그녀는 수학을 퍼즐을 푸는 것으로 여긴다. (as 뒤 동명사 solving이 목적어 puzzles를 받아서 맞아요)</div></div><p class=\"gb\">지문 7번도 what we typically see as(우리가 보통 ~으로 간주하는 것) 다음이라 동명사 fostering(조장하는 것)이 목적어 a detrimental effect(유해한 효과)를 받아요.</p></div></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">do (= win or place 우승 또는 입상하다)</span><span class=\"why\">9번 those who do(우승 또는 입상하는 사람들)의 do(하다)는 앞의 win or place(우승하거나 입상하다)를 대신하는 대동사예요. 일반동사를 대신하니 do(하다) 계열이고, 선행사 those(사람들)가 복수라 do(하다)가 맞아요.</span><div class=\"gm wx\"><p class=\"gt\">대동사 do(하다): 앞의 일반동사를 반복하지 않고 do(하다)로 대신해요 (수는 주어에 맞춤)</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like pizza, and my brothers do too.</div><div class=\"ko\">나는 피자를 좋아하고, 내 형들도 그렇다. (do = like, 주어 brothers 복수라 do가 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>I like pizza, and my brothers are too.</div><div class=\"ko\">like(좋아하다)는 일반동사라 be동사 are로 대신할 수 없어서 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>I like pizza, and my brother does too.</div><div class=\"ko\">주어 brother(형)가 단수라 does가 맞아요.</div></div><p class=\"gb\">지문 9번도 who(~하는 사람들) 앞 those(사람들)가 복수이고, 대신하는 말이 일반동사 win or place(우승하거나 입상하다)라서 do(하다)가 맞아요.</p></div></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds key\" data-ord=\"1\"><span class=\"rn\">1번 · 단서</span><div class=\"rc\"><div class=\"e\">Competitive activities can be more than</div><div class=\"k\">경쟁적인 활동은 ~ 그 이상일 수 있다</div></div><div class=\"rc\"><div class=\"e\">just performance showcases</div><div class=\"k\">단지 기량을 보여 주는 공개 행사</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">where</span> <span class=\"cw\">the best is recognized</span></div><div class=\"k\"><span class=\"cw\">그곳에서 (= 공개 행사)</span> <span class=\"cw\">최고는 인정받는</span> ※ 문제지엔 which로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\">and <span class=\"cw\">the rest are overlooked</span>.</div><div class=\"k\">그리고 <span class=\"cw\">나머지는 무시되는</span>.</div></div><div class=\"rnat\">경쟁적인 활동은 최고는 인정받고 나머지는 무시되는, 단지 기량을 보여 주는 공개 행사 그 이상일 수 있다.</div><div class=\"rst\">교내 영어 말하기 대회를 떠올려 봐요. 1등만 박수받고 나머지는 잊히는 <b>자리</b>로 끝나면 안 된대요. 뒤 절이 완전해서 <b>where</b>(그곳에서)예요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">The provision of timely, constructive feedback</div><div class=\"k\">시기적절하고 건설적인 피드백을 제공하는 것은</div></div><div class=\"rc\"><div class=\"e\">to participants on performance</div><div class=\"k\">참가자에게 기량에 대한</div></div><div class=\"rc\"><div class=\"e\">is an asset</div><div class=\"k\">자산이다</div></div><div class=\"rc\"><div class=\"e\">that some competitions and contests offer.</div><div class=\"k\">일부 대회와 경연이 주는.</div></div><div class=\"rnat\">참가자에게 기량에 대한 시기적절하고 건설적인 피드백을 제공하는 것은 일부 대회와 경연이 주는 자산이다.</div><div class=\"rst\">대회가 참가자에게 제때 좋은 피드백을 주면 그게 큰 자산이에요. 주어는 The provision(제공하는 것) 하나라 is(~이다)예요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">In a sense,</div><div class=\"k\">어떤 의미에서,</div></div><div class=\"rc\"><div class=\"e\">all competitions give feedback.</div><div class=\"k\">모든 대회는 피드백을 제공한다.</div></div><div class=\"rnat\">어떤 의미에서, 모든 대회는 피드백을 제공한다.</div><div class=\"rst\">사실 어떤 대회든 결과를 알려 주긴 해요. 지문 3번도 모든 대회는 피드백을 준다고 해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">For many,</div><div class=\"k\">많은 경우,</div></div><div class=\"rc\"><div class=\"e\">this is restricted to information</div><div class=\"k\">이것은 (= 대회가 주는 피드백) 정보로 제한된다</div></div><div class=\"rc\"><div class=\"e\">about whether the participant is</div><div class=\"k\">참가자가 ~인지에 관한</div></div><div class=\"rc\"><div class=\"e\">an award- or prizewinner.</div><div class=\"k\">입상자 또는 수상자.</div></div><div class=\"rnat\">많은 경우, 이것은 참가자가 입상자 또는 수상자인지에 관한 정보로 제한된다.</div><div class=\"rst\">그런데 대부분은 “너 상 받았어/못 받았어”만 알려 줘요. 지문 4번, 수상 여부 정보로만 제한된다는 말이에요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">The provision of that type of feedback</div><div class=\"k\">그런 유형의 피드백을 제공하는 것은</div></div><div class=\"rc\"><div class=\"e\">can be interpreted as</div><div class=\"k\">~으로 해석될 수 있다</div></div><div class=\"rc\"><div class=\"e\">shifting the emphasis</div><div class=\"k\">강조점을 옮기는 것으로</div></div><div class=\"rc\"><div class=\"e\">to demonstrating superior performance</div><div class=\"k\">우월한 기량을 보여 주는 것에</div></div><div class=\"rc\"><div class=\"e\">but not necessarily excellence.</div><div class=\"k\">그러나 꼭 탁월함을 보여 주는 것은 아닌.</div></div><div class=\"rnat\">그런 유형의 피드백을 제공하는 것은 꼭 탁월함을 보여 준다고는 할 수 없는 우월한 기량을 보여 주는 것에 강조점을 옮기는 것이라고 해석될 수 있다.</div><div class=\"rst\">그러면 ‘남보다 잘하기’만 강조되고 ‘진짜 잘하기’는 아닐 수 있어요. not necessarily(꼭 ~은 아닌)는 부분 부정이에요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">The best competitions promote excellence,</div><div class=\"k\">최고의 대회는 탁월함을 장려한다,</div></div><div class=\"rc\"><div class=\"e\">not just winning or “beating” others.</div><div class=\"k\">단지 우승하거나 다른 사람을 ‘패배시키는 것’이 아니라.</div></div><div class=\"rnat\">최고의 대회는 단지 우승하는 것, 혹은 다른 사람을 ‘패배시키는 것’이 아니라, 탁월함을 장려한다.</div><div class=\"rst\">좋은 대회는 친구를 이기는 것보다 실력 자체를 키워 줘요. 지문 6번, 최고의 대회는 탁월함을 장려한다는 말이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">The emphasis on superiority is</div><div class=\"k\">우월성에 대한 강조는 ~이다</div></div><div class=\"rc\"><div class=\"e\">what we typically see as</div><div class=\"k\">우리가 보통 ~으로 간주하는 것</div></div><div class=\"rc\"><div class=\"e\">fostering a detrimental effect of competition.</div><div class=\"k\">경쟁의 유해한 효과를 조장하는 것으로.</div></div><div class=\"rnat\">우월성에 대한 강조는 우리가 보통 경쟁의 유해한 효과를 조장하는 것으로 간주하는 것이다.</div><div class=\"rst\">“누가 더 잘했나”만 따지면 대회가 오히려 해로워져요. see A as B(A를 B로 여기다)의 전치사 뒤라 fostering(조장하는 것)이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">Performance feedback requires</div><div class=\"k\">기량에 대한 피드백은 요구한다</div></div><div class=\"rc\"><div class=\"e\">that the program go beyond</div><div class=\"k\">프로그램이 넘어설 것을</div></div><div class=\"rc\"><div class=\"e\">the “win, place, or show” level of feedback.</div><div class=\"k\">‘우승하거나, 입상하거나, 또는 3위 안에 드는’ 수준의 피드백을.</div></div><div class=\"rnat\">기량에 대한 피드백은 프로그램이 ‘우승하거나, 입상하거나, 또는 3위 안에 드는’ 수준의 피드백을 넘어설 것을 요구한다.</div><div class=\"rst\">그래서 “1등, 2등, 3등”만 말해 주는 수준을 넘어서야 해요. require that(~할 것을 요구하다) 뒤라 동사원형 go(가다)를 써요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Information about performance can be very helpful,</div><div class=\"k\">기량에 관한 정보는 아주 유익할 수 있다,</div></div><div class=\"rc\"><div class=\"e\">not only to the participant</div><div class=\"k\">참가자에게뿐만 아니라</div></div><div class=\"rc\"><div class=\"e\">who does not win or place</div><div class=\"k\">우승하거나 입상하지 못하는</div></div><div class=\"rc\"><div class=\"e\">but also to those who do.</div><div class=\"k\">우승 또는 입상하는 (do = win or place) 사람들에게도.</div></div><div class=\"rnat\">기량에 관한 정보는 우승하거나 입상하지 못하는 참가자뿐 아니라 우승 또는 입상하는 참가자에게도 아주 유익할 수 있다.</div><div class=\"rst\">상 못 받은 친구에게도, 상 받은 친구에게도 피드백은 다 도움이 돼요. those who do(입상하는 사람들)의 do(하다)는 앞 동사를 대신해요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"showcase\" data-m=\"공개 행사, 공개 무대\"><b>showcase</b>공개 행사, 공개 무대</button><button type=\"button\" class=\"wdb\" data-w=\"overlook\" data-m=\"무시하다, 간과하다\"><b>overlook</b>무시하다, 간과하다</button><button type=\"button\" class=\"wdb\" data-w=\"provision\" data-m=\"제공, 공급\"><b>provision</b>제공, 공급</button><button type=\"button\" class=\"wdb\" data-w=\"constructive\" data-m=\"건설적인\"><b>constructive</b>건설적인</button><button type=\"button\" class=\"wdb\" data-w=\"superiority\" data-m=\"우월성, 우세\"><b>superiority</b>우월성, 우세</button><button type=\"button\" class=\"wdb\" data-w=\"detrimental\" data-m=\"유해한, 해로운\"><b>detrimental</b>유해한, 해로운</button></div>", "06": "<p class=\"mtr\">마더텅 정답률 <b>55%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">5번 <b>can also have a negative impact(부정적인 영향도 미칠 수 있다)</b>에서 글의 방향이 좋은 점 → <b>나쁜 점</b>으로 꺾여요. 그 뒤 문장의 낱말이 나쁜 방향과 맞는지 확인하세요.</p><div class=\"ck-step\"><span class=\"lab\">5번 · 방향 전환</span><div class=\"en\">While most managers can only dream of having customers … the emotion triggered by sport can also have a <mark>negative impact</mark>.</div><p class=\"ko\">대부분의 관리자들이 ~을 그저 꿈꾸지만 … 스포츠로 인해 유발되는 감정은 또한 <mark>부정적인 영향</mark>을 미칠 수 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>어떤 나쁜 영향인지: 과거에 매달린다</span></div><div class=\"ck-step\"><span class=\"lab\">6번 · 부정적 영향의 내용</span><div class=\"en\">organisations have <mark>strong attachments to the past</mark> through nostalgia and club tradition.</div><p class=\"ko\">조직이 향수와 클럽 전통을 통해 <mark>과거에 대한 강한 애착</mark>을 보인다는 (뜻일 수 있다).</p></div><div class=\"ck-via\"><i>▼</i><span>As a result(결과적으로) 과거에 매달리면 효율·생산성을 높인다? 방향이 거꾸로예요</span></div><div class=\"ck-step key\"><span class=\"lab\">문제지 ④번 자리 (7번)</span><div class=\"en\">As a result, they may <u>④ increase</u> efficiency, productivity and the need to respond quickly to changing market conditions.</div><p class=\"ko\">결과적으로, 그것들은 (= 조직) 효율성, 생산성, 신속히 대응할 필요성을 ( 높일? ) 수도 있다 → 무시할 수도가 맞아요</p></div><div class=\"ck-via\"><i>▼</i><span>For example(예를 들어) 전통 때문에 새 제안이 막히는 장면</span></div><div class=\"ck-step\"><span class=\"lab\">8번 · 예시로 확인</span><div class=\"en\">a proposal to change club colours … <mark>may be defeated</mark> because it breaks a link with tradition.</div><p class=\"ko\">클럽 색깔을 바꾸자는 제안은 … <mark>무산될 수도 있다</mark> 그것이 (= 클럽 색깔을 바꾸는 것) 전통과의 연결고리를 끊는다는 이유로.</p></div><div class=\"ck-via\"><i>▼</i><span>문법 포인트</span></div><div class=\"gm\"><p class=\"gt\">increase(높이다) ↔ ignore(무시하다): 챙기기와 외면하기</p><p class=\"gr\">앞에서 나쁜 원인(과거에 매달림)이 나오면 결과도 나쁜 쪽이어야 해요. 효율·생산성을 increase(높이다)는 좋은 결과, ignore(무시하다)는 나쁜 결과예요.</p><div class=\"ge\"><div class=\"en\"><i>맞음</i>He only thinks about the past, so he ignores new ideas.</div><div class=\"ko\">그는 과거만 생각해서 새로운 아이디어를 무시한다. (나쁜 원인 → 나쁜 결과라 맞아요)</div></div><div class=\"ge no\"><div class=\"en\"><i>틀림</i>He only thinks about the past, so he increases new ideas.</div><div class=\"ko\">과거만 생각하는데 새 아이디어를 늘린다? 방향이 거꾸로라 틀려요.</div></div><div class=\"ge\"><div class=\"en\"><i>맞음</i>She practices every day, so her skills increase.</div><div class=\"ko\">그녀는 매일 연습해서 실력이 늘어난다. (좋은 원인 → 좋은 결과라 맞아요)</div></div><p class=\"gb\">지문 6번에서 조직이 strong attachments to the past(과거에 대한 강한 애착)를 보이니, 7번은 increase(높이다)가 아니라 ignore(무시하다)여야 해요.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">increase → ignore (무시하다)<small>과거에 매달린 결과라 효율·생산성을 높이는 게 아니라 무시하게 돼요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">failure 실패</span><span class=\"why\">4번은 중독 같은 애정이 팬을 팀에 묶어 둔다는 좋은 점이에요. even in the face of(~에도 불구하고) 뒤라서 팀이 ‘실패’해도 충성심이 유지된다는 말이 맞아요. success(성공)로 바꾸면 ‘불구하고’가 어색해져요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">identifying 동질감을 느끼는</span><span class=\"why\">2번은 so strongly(너무 강하게) 동질감을 느껴서 그 결과 문신까지 새긴다는 구조예요. 보험 회사 로고로 문신을 새길 정도라면 그 회사와 강하게 동질감을 느끼는 것이 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">passionate 열성적인</span><span class=\"why\">3번 뒤에 관심이 obsession(집착)에 가깝다는 결과가 나와요. 집착에 가까울 만큼이니 passionate(열성적인)가 방향에 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">defeated 무산되는</span><span class=\"why\">8번은 because it breaks a link with tradition(전통과의 연결고리를 끊기 때문에)이 이유예요. 6번처럼 전통에 매달리는 조직이니 색깔을 바꾸자는 제안은 무산되는 것이 맞아요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Sport can trigger an emotional response</div><div class=\"k\">스포츠는 정서적 반응을 유발할 수 있다</div></div><div class=\"rc\"><div class=\"e\">in its consumers</div><div class=\"k\">그것의 (= 스포츠) 소비자에게</div></div><div class=\"rc\"><div class=\"e\">of the kind</div><div class=\"k\">유형의</div></div><div class=\"rc\"><div class=\"e\">rarely brought forth by other products.</div><div class=\"k\">다른 제품이 좀처럼 일으키지 못하는.</div></div><div class=\"rnat\">스포츠는 그것의 소비자에게 다른 제품이 좀처럼 일으키지 못하는 유형의 정서적 반응을 유발할 수 있다.</div><div class=\"rst\">우리 학교 축구부를 응원하는 친구들을 떠올려 봐요. 스포츠는 다른 물건이 못 주는 <b>뜨거운 감정</b>을 준다는 게 지문 1번이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">Imagine bank customers buying memorabilia</div><div class=\"k\">은행 고객들이 기념품을 사는 것을 상상해 보라</div></div><div class=\"rc\"><div class=\"e\">to show loyalty to their bank,</div><div class=\"k\">그들의 은행에 충성심을 보여 주기 위해,</div></div><div class=\"rc\"><div class=\"e\">or consumers identifying so strongly</div><div class=\"k\">혹은 고객들이 너무도 강하게 동질감을 느껴</div></div><div class=\"rc\"><div class=\"e\">with their car insurance company</div><div class=\"k\">그들의 자동차 보험 회사에</div></div><div class=\"rc\"><div class=\"e\">that they get a tattoo with its logo.</div><div class=\"k\">그들이 그것의 (= 자동차 보험 회사) 로고로 문신을 새기는 것을.</div></div><div class=\"rnat\">은행 고객이 자신의 은행에 충성심을 보여 주기 위해 기념품을 사거나, 고객이 자신의 자동차 보험 회사에 너무도 강하게 동질감을 느낀 나머지 그 회사 로고로 문신을 새긴다고 상상해 보라.</div><div class=\"rst\">문구점 단골이라고 그 가게 로고 문신을 새기진 않죠. 지문 2번도 은행·보험 회사에 그렇게 <b>동질감을 느끼는</b> 손님은 상상하기 어렵다는 말이에요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">We know</div><div class=\"k\">우리는 안다</div></div><div class=\"rc\"><div class=\"e\">that some sport followers are so passionate</div><div class=\"k\">일부 스포츠 추종자들이 너무도 열성적이어서</div></div><div class=\"rc\"><div class=\"e\">about players, teams and the sport itself</div><div class=\"k\">선수, 팀, 그리고 그 스포츠 자체에</div></div><div class=\"rc\"><div class=\"e\">that their interest borders on obsession.</div><div class=\"k\">그들의 관심이 집착에 가깝다는 것을.</div></div><div class=\"rnat\">우리는 일부 스포츠 추종자들이 선수, 팀, 그리고 그 스포츠 자체에 너무도 열성적이어서 그들의 관심이 집착에 가깝다는 것을 안다.</div><div class=\"rst\">그런데 축구부 팬들은 선수 이름, 경기 기록을 다 외울 만큼 <b>열성적</b>이에요. 지문 3번, 관심이 집착에 가깝다는 말이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">This addiction provides the emotional glue</div><div class=\"k\">이러한 중독은 정서적 접착제를 제공한다</div></div><div class=\"rc\"><div class=\"e\">that binds fans to teams,</div><div class=\"k\">팬을 팀과 묶어 주는,</div></div><div class=\"rc\"><div class=\"e\">and maintains loyalty</div><div class=\"k\">그리고 충성심을 유지하게 한다</div></div><div class=\"rc\"><div class=\"e\">even in the face of on-field failure.</div><div class=\"k\">경기장에서의 실패에도 불구하고.</div></div><div class=\"rnat\">이러한 중독은 팬을 팀과 묶어 주는 정서적 접착제를 제공하고, 경기장에서의 실패에도 불구하고 충성심을 유지하게 한다.</div><div class=\"rst\">그래서 축구부가 경기에서 져도(<b>실패</b>) 팬들은 떠나지 않아요. 지문 4번, 이 중독이 팬을 팀에 붙여 두는 접착제래요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">5번</span><div class=\"rc\"><div class=\"e\">While most managers can only dream of</div><div class=\"k\">대부분의 관리자들이 ~을 그저 꿈꾸지만</div></div><div class=\"rc\"><div class=\"e\">having customers</div><div class=\"k\">고객을 가지기를</div></div><div class=\"rc\"><div class=\"e\">that are as passionate about their products</div><div class=\"k\">그들 제품에 대해 ~만큼이나 열성적인</div></div><div class=\"rc\"><div class=\"e\">as sport fans,</div><div class=\"k\">스포츠 팬만큼이나,</div></div><div class=\"rc\"><div class=\"e\">the emotion triggered by sport</div><div class=\"k\">스포츠로 인해 유발되는 감정은</div></div><div class=\"rc ckc\"><div class=\"e\">can also have a <span class=\"cw\">negative impact</span>.</div><div class=\"k\">또한 <span class=\"cw\">부정적인 영향</span>을 미칠 수 있다.</div></div><div class=\"rnat\">대부분의 관리자들이 그들 제품에 대해 스포츠 팬만큼이나 열성적인 고객을 가지기를 그저 꿈꾸지만, 스포츠로 인해 유발되는 감정은 또한 부정적인 영향을 미칠 수 있다.</div><div class=\"rst\">어느 가게 사장님이든 이런 팬 같은 손님을 꿈꿔요. <b>하지만</b> 그 감정엔 <b>부정적인 영향</b>도 있다고 지문 5번이 방향을 꺾어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">Sport’s emotional intensity can mean</div><div class=\"k\">스포츠의 정서적 격렬함은 ~라는 뜻일 수 있다</div></div><div class=\"rc ckc\"><div class=\"e\">that organisations have <span class=\"cw\">strong attachments to the past</span></div><div class=\"k\">조직이 <span class=\"cw\">과거에 대한 강한 애착</span>을 보인다는</div></div><div class=\"rc\"><div class=\"e\">through nostalgia and club tradition.</div><div class=\"k\">향수와 클럽 전통을 통해.</div></div><div class=\"rnat\">스포츠의 정서적 격렬함은 조직이 향수와 클럽 전통을 통해 과거에 대한 강한 애착을 보인다는 뜻일 수도 있다.</div><div class=\"rst\">축구부는 “우리 전통이 최고야!” 하며 옛날 방식에 <b>강하게 매달려요</b>. 지문 6번, 향수와 클럽 전통에 대한 애착이에요.</div></div><div class=\"rds key\" data-ord=\"7\"><span class=\"rn\">7번 · 단서</span><div class=\"rc\"><div class=\"e\">As a result,</div><div class=\"k\">결과적으로,</div></div><div class=\"rc ckc\"><div class=\"e\">they may <span class=\"cw\">ignore</span> efficiency, productivity</div><div class=\"k\">그것들은 (= 조직) 효율성, 생산성을 <span class=\"cw\">무시할 수도</span> 있다 ※ 문제지엔 increase로 되어 있음</div></div><div class=\"rc\"><div class=\"e\">and the need to respond quickly</div><div class=\"k\">그리고 신속하게 대응해야 할 필요성을</div></div><div class=\"rc\"><div class=\"e\">to changing market conditions.</div><div class=\"k\">변화하는 시장 상황에.</div></div><div class=\"rnat\">결과적으로, 그것(조직)은 효율성, 생산성, 그리고 변화하는 시장 상황에 신속하게 대응해야 할 필요성을 무시할 수도 있다.</div><div class=\"rst\"><b>결과적으로</b> 연습을 더 효율적으로 바꾸자는 말도 <b>무시해요</b>. 그래서 지문 7번은 increase(높이다)가 아니라 ignore(무시하다)예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">a proposal to change club colours</div><div class=\"k\">클럽 색깔을 바꾸자는 제안은</div></div><div class=\"rc\"><div class=\"e\">in order to project a more attractive image</div><div class=\"k\">더 매력적인 이미지를 투영하기 위해</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">may be defeated</span></div><div class=\"k\"><span class=\"cw\">무산될 수도 있다</span></div></div><div class=\"rc\"><div class=\"e\">because it breaks a link with tradition.</div><div class=\"k\">그것이 (= 클럽 색깔을 바꾸는 것) 전통과의 연결고리를 끊는다는 이유로.</div></div><div class=\"rnat\">예를 들어, 더 매력적인 이미지를 투영하기 위해 클럽 색깔을 바꾸자는 제안은 그것이 전통과의 연결고리를 끊는다는 이유로 무산될 수도 있다.</div><div class=\"rst\">예를 들어 유니폼 색을 멋지게 바꾸자는 제안도 “전통이 깨진다”며 <b>무산돼요</b>. 지문 8번이 7번의 나쁜 결과를 확인해 줘요.</div></div></div></details><div class=\"qh\">단어 <small style=\"font-weight:500;color:var(--sub)\">눌러서 오답노트에 담기</small></div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"trigger\" data-m=\"유발하다, 촉발하다\"><b>trigger</b>유발하다, 촉발하다</button><button type=\"button\" class=\"wdb\" data-w=\"identify with\" data-m=\"~와 동질감을 느끼다\"><b>identify with</b>~와 동질감을 느끼다</button><button type=\"button\" class=\"wdb\" data-w=\"obsession\" data-m=\"집착\"><b>obsession</b>집착</button><button type=\"button\" class=\"wdb\" data-w=\"in the face of\" data-m=\"~에도 불구하고\"><b>in the face of</b>~에도 불구하고</button><button type=\"button\" class=\"wdb\" data-w=\"attachment\" data-m=\"애착\"><b>attachment</b>애착</button><button type=\"button\" class=\"wdb\" data-w=\"nostalgia\" data-m=\"향수, 그리움\"><b>nostalgia</b>향수, 그리움</button></div>"};
document.addEventListener('click',function(e){
 var b=e.target.closest('.stbtn');
 if(b){var box=b.closest('.rdb'),on=!box.classList.contains('story');box.classList.toggle('story',on);
  var L=[].slice.call(box.querySelectorAll('.rds'));L.forEach(function(x){x.classList.remove('lastv');x.style.order='';});
  if(on){L.sort(function(a,c){return (+a.dataset.ord)-(+c.dataset.ord);});L.forEach(function(x,i){x.style.order=i+1;});L[L.length-1].classList.add('lastv');}
  b.textContent=on?'문장별로 보기':'이야기로 이어 읽기';return;}
 var w=e.target.closest('.wdb');
 if(w){var on2=!w.classList.contains('on');w.classList.toggle('on',on2);
  try{if(window.WN){if(on2)WN.add([{w:w.dataset.w,m:w.dataset.m,src:'미니모고',how:'별표',ask:true}]);else if(WN.del)WN.del(w.dataset.w,'미니모고');}}catch(err){}
  var t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=on2?'오답노트장에 담았어요':'오답노트장에서 뺐어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600);}
});

/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  if(EXP[cq.q]){h+=EXP[cq.q]+'<button class="toq" data-i="'+i+'">빠른 정답으로</button>';return h+'</div></details>';}
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
