<!doctype html>

<head>

<title>고3 미니모의고사 11회 01–06번</title>
<style>

header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}

.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}

.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}

.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();

e": "he <b>elaborated sophisticated<\/b> theories", "k": "그는 복잡한 이론들을 정교하게 만들어 냈다"}, {"e": "of language and communication", "k": "언어와 의사소통의"}, {"e": "that have had significant effects", "k": "상당한 영향을 미쳐 온"}, {"e": "on such <b>disciplines<\/b> as anthropology, art criticism, and brain research.", "k": "인류학, 미술 비평, 그리고 뇌 연구와 같은 학문 분야에."}], "link": "현대 구조 언어학의 아버지로 알려져 있는 그는 인류학, 미술 비평, 그리고 뇌 연구와 같은 학문 분야에 상당한 영향을 미쳐 온 언어와 의사소통의 복잡한 이론들을 정교하게 만들어 냈다.", "easy": "현대 구조 언어학의 아버지로 불리는 그는 언어와 의사소통에 관한 이론을 만들었고, 그 이론은 인류학·미술 비평·뇌 연구에까지 큰 영향을 줬어요.", "gist": "그의 별명과 이론의 영향력이에요. (⑤와 관련)"}]}, {"no": "03", "typ": "밑줄 의미", "src": "2023학년도 수능 21번", "evn": [1, 4, 7], "ev_en": "Coming of age in the 18th and 19th centuries, the personal diary became a centerpiece in the construction of a modern subjectivity, at the heart of which is the application of reason and critique to the understanding of world and self, which allowed the creation of a new kind of knowledge. / Over time and with rereading, disparate entries, events, and happenstances could be rendered into insights and narratives about the self, and allowed for the formation of subjectivity. / By making the self public in a private sphere, the self also became an object for self-inspection and self-critique.", "ev_ko": [[1, "18세기와 19세기에 발달한 상태가 된 개인 일기는 근대적 주체성을 구축하는 데 중심물이 되었는데, 그것의 중심에는 세계와 자아에 대한 이해에 이성과 비판을 적용하는 것이 있었고, 이는 새로운 종류의 지식을 창조할 수 있게 해 주었다."], [4, "시간이 지남에 따라 그리고 다시 읽음으로써, 이질적인 항목, 사건 및 우연한 일들이 자아에 관한 통찰력과 이야기로 만들어질 수 있었으며, 이는 주체성의 형성을 가능하게 했다."], [7, "자아를 사적 영역에서 공적으로 만들면서, 자아는 또한 자기 점검과 자기 비판의 대상이 되었다."]], "why": ["(1)에서 일기는 근대적 주체성을 세우는 중심이 되었고, 그 핵심에는 <b>세계와 자아를 이해하는 데 이성과 비판을 적용<\/b>하는 일이 있었다고 말합니다", "(4)에서는 일기를 <b>다시 읽으며<\/b> 자아에 관한 <b>통찰과 이야기<\/b>를 얻었다고 합니다", "밑줄 바로 다음인 (7)은 자아를 공개적으로 만든 결과 자아가 <b>self-inspection(자기 점검)<\/b>과 <b>self-critique(자기 비판)<\/b>의 <b>대상<\/b>이 되었다고 풀어 줍니다", "즉 밑줄은 남에게 보여 주는 것이 아니라, <b>글을 써서 자기 자신을 들여다보는 일<\/b>입니다", "따라서 정답은 ① '글을 자신을 되돌아보는 수단으로 사용하곤'입니다."], "ch": [{"n": "①", "t": "use writing as a means of reflecting on oneself", "g": "글쓰기를 자기 자신을 되돌아보는 수단으로 사용하다", "ok": true, "e": ["(7)의 <b>self-inspection and self-critique<\/b>(자기 점검과 자기 비판)와 뜻이 통합니다", "그 수단이 바로 일기 쓰기입니다."]}, {"n": "②", "t": "build one’s identity by reading others’ diaries", "g": "다른 사람의 일기를 읽음으로써 자신의 정체성을 확립하다", "ok": false, "e": ["(4)의 rereading은 <b>자기 일기를 다시 읽는 것<\/b>입니다", "<b>남의<\/b> 일기를 읽는다는 말은 없습니다."]}, {"n": "③", "t": "exchange feedback in the process of writing", "g": "글 쓰는 과정에서 의견을 교환하다", "ok": false, "e": ["(6)에서 일기는 <b>personal and private<\/b>(개인적이고 사적인) 것이라고 했습니다", "다른 사람과 의견을 주고받는 것과는 맞지 않습니다."]}, {"n": "④", "t": "create an alternate ego to present to others", "g": "다른 사람에게 보여 줄 대체 자아를 만들어 내다", "ok": false, "e": ["밑줄의 public은 남에게 보여 준다는 뜻이 아닙니다", "공개하는 대상은 <b>to oneself<\/b>, 곧 자기 자신입니다."]}, {"n": "⑤", "t": "develop topics for writing about selfhood", "g": "자아에 관한 글을 쓰기 위한 주제를 개발하다", "ok": false, "e": ["(7)에서 자아는 스스로 점검하고 비판하는 <b>대상<\/b>이 됩니다", "글감(주제)을 개발한다는 이야기는 나오지 않습니다."]}], "tr": ["18세기와 19세기에 발달한 상태가 된 개인 일기는 근대적 주체성을 구축하는 데 중심물이 되었는데, 그것의 중심에는 세계와 자아에 대한 이해에 이성과 비판을 적용하는 것이 있었고, 이는 새로운 종류의 지식을 창조할 수 있게 해 주었다.", "일기는 그것을 통해 계몽되고 자유로운 주체가 구성될 수 있는 중심 매체였다.", "그것(일기)은 개인이 자신의 행방, 감정, 생각에 대해 매일 쓸 수 있는 공간을 제공했다.", "시간이 지남에 따라 그리고 다시 읽음으로써, 이질적인 항목, 사건 및 우연한 일들이 자아에 관한 통찰력과 이야기로 만들어질 수 있었으며, 이는 주체성의 형성을 가능하게 했다.", "‘말로 만들어지고 또한 탐구되는 (것으로서의) 자아’라는 개념이 나타나는 것은 바로 그러한 맥락에서다.", "일기는 개인적이고 사적인 것이어서, 사람들은 자신을 위해 쓰곤 했는데, Habermas의 명확한 표현에 따르면, <b>자신을 자신에게 공개적으로 만들곤<\/b>(글을 자신을 되돌아보는 수단으로 사용하곤) 했다.", "자아를 사적 영역에서 공적으로 만들면서, 자아는 또한 자기 점검과 자기 비판의 대상이 되었다."], "ps": [{"n": 1, "ch": [{"e": "<b>Coming of age<\/b> in the 18th and 19th centuries,", "k": "18세기와 19세기에 발달한 상태가 된,"}, {"e": "the personal diary became a <b>centerpiece<\/b>", "k": "개인 일기는 중심물이 되었다"}, {"e": "in the construction of a modern <b>subjectivity<\/b>,", "k": "근대적 주체성을 구축하는 데,"}, {"e": "at the heart of which", "k": "그리고 그것의 중심에는"}, {"e": "is the <b>application<\/b> of reason and critique", "k": "이성과 비판을 적용하는 것 }
function noteList(){
  const out=[],ck=S.checks[WS.id]||{};
  WS.words.forEach((w,i)=>{
    const c=ck[i];if(!c)return;
    const parts=['m','s','a'].filter(p=>c[p]&&(p==='m'||w[p]));
    if(parts.length)out.push({i:i,w:w,parts:parts});
  });
  return out;
}

  else if(view==='submit')renderSubmit();
  else if(view==='exp')renderExp();
  window.scrollTo(0,0);
}

이야기), about the self (자아에 관한)"]}, {"t": "<b>and allowed for the formation of subjectivity</b>는 앞 동사와 and로 병렬된 동사이다. '그리고 ~을 가능하게 했다'.", "sub": ["allow for (~을 가능하게 하다. 한 덩어리 동사), the formation (형성) of subjectivity (주체성의)", "기준: could be rendered와 allowed for를 병렬 동사구로 본다."]}], "sum": "항목·사건이 시간이 지나 자아에 대한 통찰이 되고 주체성 형성을 도움"}, {"i": "05", "q": "04", "s": "4", "title": "S+V+O + 과거분사구 후치 + 가주어 it ~ that + 가정법 if절", "eng": "In particular, the chapel<sup>1</sup> of St. John's College has a massive neo-Gothic tower / adorned<sup>2</sup> with statues of saints<sup>3</sup>, / and to Yates it appeared obvious / that it would be more decorous<sup>4</sup> / if these saints were properly attired<sup>5</sup> in surplices<sup>6</sup>.", "notes": [["1", "chapel", "예배당"], ["2", "adorn", "장식하다, 꾸미다"], ["3", "saint", "성인"], ["4", "decorous", "품위 있는, 예의 바른"], ["5", "attire", "차려 입히다"], ["6", "surplice", "(성직자의) 흰 가운"]], "lit": "특히, St. John's College의 예배당에는 거대한 신고딕 양식의 탑이 있는데 / 성인들의 동상으로 장식된, / 그리고 Yates에게는 분명해 보였다 / 그것이 더 품위 있을 것이라는 점이 / 만약 이 성인들이 흰 가운으로 제대로 차려 입혀진다면.", "nat": "특히 St. John's College의 예배당에는 성인들의 동상으로 장식된 거대한 신고딕 양식의 탑이 있는데, Yates에게는 이 성인들이 흰 가운으로 제대로 차려 입혀진다면 더 품위 있으리라는 것이 분명해 보였다.", "ana": "<b>adorned</b>는 앞의 <b>tower</b>를 뒤에서 꾸미는 <b>과거분사</b>다. 탑이 '장식하는' 것이 아니라 '<b>장식된</b>' 것이므로 -ing가 아니라 -ed가 왔다. 분사가 명사를 뒤에서 꾸밀 때는 <b>능동이면 -ing, 수동이면 -ed</b>라는 기준만 세워 두면 흔들리지 않는다. and 뒤의 <b>it appeared obvious that ~</b>에서 앞의 it은 <b>가주어</b>이고 진짜 주어는 <b>that절</b>이다. 그런데 that절 안의 <b>it</b>은 가주어가 아니라 앞 상황을 받는 <b>대명사</b>라는 점이 함정이다. 마지막 <b>if these saints were ~</b>는 실제로는 그렇지 않은 상황을 가정하는 조건절이라 <b>과거형 were</b>가 쓰였고, 주절의 <b>would</b>와 짝을 이룬다.", "pe": "\u0001In particular\u0002, the chapel<sup>1</sup> \u0001of St. John's College\u0002 has a \u0001massive neo-Gothic\u0002 tower / \u0001adorned<sup>2</sup> with statues \u0001of saints<sup>3</sup>\u0002\u0002, / and \u0001to Yates\u0002 it appeared obvious / that it would be more decorous<sup>4</sup> / \u0001if these saints were properly attired<sup>5</sup> in surplices<sup>6</sup>\u0002.", "pk": "\u0001특히\u0002, \u0001St. John's College의\u0002 예배당에는 \u0001거대한 신고딕 양식의\u0002 탑이 있는데 / \u0001성인들의 동상으로 장식된\u0002, / 그리고 \u0001Yates에게는\u0002 분명해 보였다 / 그것이 더 품위 있을 것이라는 점이 / \u0001만약 이 성인들이 흰 가운으로 제대로 차려 입혀진다면\u0002.", "core": "예배당에는 탑이 있고, 그것이 더 품위 있으리라는 것이 분명해 보였다.", "tags": ["In particular = 부사구: 문장 전체를 꾸밈. 주어 chapel + 동사 has + 목적어 tower. of St. John's College = 형용사구: chapel. massive neo-Gothic = 형용사: tower", "adorned with ~ = 과거분사구(형용사적): tower를 꾸밈. of saints = 형용사구: statues를 꾸밈", "and: 주어 it(<b>가주어</b>) + 동사 appeared + 보어 obvious. to Yates = 전치사구(부사구): appeared를 꾸밈 (누구에게)", "that절 = <b>진주어</b>(명사절) = 뼈대. 안쪽: 주어 it + 동사 would be + 보어 more decorous", "if절 = 부사절(조건): would be more decorous를 꾸밈. be attired in = ~을 입고 있다(수동). properly = 부사: attired"], "steps": [{"t": "이 문장은 <b>두 절이 and로 연결</b>된 긴 문장이다. 뒤 절은 <b>가주어 it + 진주어 that절</b>이고, 그 안에 if절이 있다."}, {"t": "앞 절의 뼈대를 찾는다.", "sub": ["S: the chapel (예배당). of St. John's College (St. John's College의)는 chapel을 꾸미는 전치사구", "V: has (가지다)", "O: a massive neo-Gothic tower (거대한 신고딕 양식의 탑)", "In particular (특히)는 부사구", "뼈대 = <b>the chapel has a massive tower</b>"]}, {"t": "<b>adorned with statues of saints</b>는 <b>과거분사구(형용사적)</b>로 tower를 뒤에서 꾸민다. adorn A with B (A를 B로 장식하다). statues (동상들) of saints (성인들의)"}, {"t": "뒤 절의 뼈대를 찾는다.", "sub": ["S: it (가주어, 진짜 주어는 뒤의 that절)", "V: appeared (appear ~처럼 보이다의 과거형)", "C: obvious (분명한) → 2형식", "to Yates (Yates에게)는 appeared를 꾸미는 전치사구", "뼈대 = <b>it appeared obvious that ~</b>"]}, {"t": "진주어 <b>that절</b> 안을 본다.", "sub": ["S: it, V: would be, C: more decorous (더 품위 있는)", "<b>if these saints were properly attired in surplices</b>는 <b>부사절(조건)</b>이다. be attired in (~을 입다. 수동), properly (제대로), surplices (흰 가운)", "would ~ if ~ were 이므로 <b>가정법 과거</b>이다."]}], "sum": "탑의 성인상에 흰 가운을 제대로 입히면 더 품위 있겠다고 Yates는 생각"}, {"i": "06", "q": "04", "s": "8", "title": "긴 주어 + S+V+C", "eng": "An attempt<sup>1</sup> to lift the surplices off from above, / using ropes<sup>2</sup> with hooks attached<sup>3</sup>, / was unsuccessful<sup>4</sup>.", "notes": [["1", "attempt", "시도"], ["2", "use", "사용하다"], ["3", "with A attached", "A가 부착된 채로"], ["4", "unsuccessful", "성공하지 못한"]], "lit": "흰 가운을 위에서 들어 올려 벗기려는 시도는, / 갈고리가 부착된 밧줄을 사용하여, / 성공하지 못했다.", "nat": "갈고리가 부착된 밧줄을 사용하여 흰 가운을 위에서 들어 올려 벗기려던 시도는 성공하지 못했다.", "ana": "주어 <b>An attempt</b>와 동사 <b>was</b> 사이가 <b>두 덩어리나 벌어져 있다</b>. 이럴 때는 콤마와 콤마 사이를 통째로 괄호로 묶고 <b>An attempt was unsuccessful</b>이라는 뼈대부터 확정해야 한다. 주어 뒤의 <b>to lift</b>는 attempt를 꾸미는 <b>형용사적 용법</b>의 to부정사로 '<b>~하려는 시도</b>'가 된다. attempt·effort·ability·decision 같은 명사 뒤에는 이 형태가 자주 붙는다. 가운데 <b>using</b>은 <b>분사구문</b>으로 '~을 사용하여'라는 방법을 더해 준다. 그 안의 <b>with hooks attached</b>는 <b>with + 명사 + 과거분사</b> 구조로 '<b>갈고리가 부착된 채로</b>'라는 뜻이다. hooks가 스스로 붙이는 것이 아니라 붙여진 것이므로 attached가 왔다.", "pe": "An attempt<sup>1</sup> \u0001to lift the surplices off from above\u0002, / \u0001using ropes<sup>2</sup> \u0001with hooks attached<sup>3</sup>\u0002\u0002, / was unsuccessful<sup>4</sup>.", "pk": "\u0001흰 가운을 위에서 들어 올려 벗기려는\u0002 시도는, / \u0001\u0001갈고리가 부착된\u0002 밧줄을 사용하여\u0002, / 성공하지 못했다.", "core": "시도는 성공하지 못했다.", "tags": ["주어 An attempt. to lift ~ = to부정사(형용사적): attempt를 꾸밈. 동사 was가 나올 때까지 기다림", "using ~ = 분사구문(삽입, 부사적: 수단): lift를 꾸밈. with hooks attached = with + 명사 + 분사(수동): ropes를 꾸밈", "동사 was + 보어 unsuccessful(형용사)"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>인데 주어 덩어리가 길고 중간에 분사구문이 끼어 동사가 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: An attempt (시도)", "V: was", "C: unsuccessful (성공적이지 못한)", "뼈대 = <b>An attempt was unsuccessful</b>"]}, {"t": "<b>to lift the surplices off from above</b>는 <b>to부정사(형용사적 용법)</b>로 attempt를 꾸민다. '~하려는 시도'.", "sub": ["lift A off (A를 들어 올려 벗기다), the surplices (흰 가운), from above (위에서)"]}, {"t": "콤마 사이의 <b>using ropes with hooks attached</b>는 <b>분사구문(삽입)</b>이다. 들어 올리는 방법을 알려 준다. '밧줄을 사용하여'.", "sub": ["using (use 사용하다) + O: ropes (밧줄)", "<b>with hooks attached</b> = with + 명사 + 과거분사: 갈고리가 부착된 채로 (attach 붙이다). ropes를 꾸민다."]}, {"t": " ia. to show ~ = to부정사(부사적: 목적): buying을 꾸밈. to their bank: loyalty를 꾸밈", "or: 목적어+목적격보어 병렬. <b>identify with</b> = ~와 동일시하다. so strongly = 부사구: identifying 꾸밈. with ~ company = 거의 필수에 가까운 부사구", "that절 = 부사절(결과, <b>so ~ that</b>): identifying so strongly를 꾸밈. with its logo = 전치사구(부사구): get a tattoo를 꾸밈"], "steps": [{"t": "이 문장은 <b>명령문</b>이다. <b>Imagine A -ing</b> (A가 ~하는 것을 상상하다) 구조가 or로 병렬되어 길어졌다."}, {"t": "뼈대부터 찾는다.", "sub": ["명령문이라 주어(You)가 생략된다.", "V: Imagine (상상하다)", "O: bank customers (은행 고객들) / consumers (소비자들)", "C: buying ~ / identifying ~ (현재분사)", "뼈대 = <b>Imagine bank customers buying memorabilia</b>"]}, {"t": "첫 번째 덩어리를 본다.", "sub": ["buying memorabilia (기념품을 사는). memorabilia (기념품)", "<b>to show loyalty to their bank</b>는 to부정사(부사적 용법, 목적). '충성심을 보여 주려고'. their = bank customers"]}, {"t": "<b>or consumers identifying so strongly with their car insurance company</b>는 앞과 병렬되는 두 번째 덩어리이다.", "sub": ["identify with (~와 동일시하다). with ~는 거의 필수에 가까운 부사구라 수식어로 본다.", "so strongly (너무나 강하게). their = consumers"]}, {"t": "<b>that they get a tattoo with its logo</b>는 <b>so ~ that</b>의 결과절(부사절)이다. '너무 ~해서 …하다'.", "sub": ["S: they (= consumers), V: get (얻다), O: a tattoo (문신)", "with its logo (그 로고로). its = the car insurance company's"]}], "sum": "기념품을 사는 고객, 보험사 로고를 문신하는 소비자 상상"}], "qs": [{"q": "01", "type": "글의 목적", "src": "2017학년도 9월 18번", "ans": "⑤", "tr": [["1", "주최자님께,"], ["2", "제 이름은 Cathy Cameron입니다."], ["3", "저는 9월 3일 토요일에 열리는 Yankees와의 시합을 위한 ‘Boston Red Sox 야구 여행’과 관련하여 편지를 씁니다."], ["4", "안타깝게도 저는 귀사가 정한 53명의 등록 인원 한도가 이미 다 찼다는 것을 이제 막 알게 되었습니다."], ["5", "하지만 제 아들을 추가로 등록하도록 허락해 주신다면 정말 감사하겠습니다."], ["6", "그 아이는 Red Sox의 열렬한 팬이고, 이 여행은 그 아이의 생일을 위한 멋진 깜짝 선물이 될 것입니다."], ["7", "그 아이가 이 여행에 참여할 수 있는 방법이 조금이라도 있다면 저는 무척 감사할 것입니다."], ["8", "그것이 그 아이에게 완벽한 생일을 만들어 주리라 확신합니다."], ["9", "곧 답변 주시기를 기다리겠습니다."], ["10", "진심을 담아, Cathy Cameron 드림"]], "evh": "5번 문장", "ev": [{"en": true, "h": "However, I would really appreciate it if you could allow my son to register additionally."}, {"en": false, "h": "편지 유형은 <b>however·unfortunately·but</b> 같은 <b>전환 신호</b> 바로 뒤에 용건이 온다. 3번 문장까지는 어떤 여행에 관한 이야기인지 <b>배경</b>만 깔고, 4번 문장에서 <b>등록 한도가 이미 찼다</b>는 문제 상황을 말한다. 그리고 <b>However</b>로 방향을 틀어 5번 문장에서 <b>제 아들을 추가로 등록하게 해 달라</b>고 직접 부탁한다. <b>I would really appreciate it if you could ~</b>는 정중한 <b>요청</b> 표현이지 감사 인사가 아니다. 6~8번 문장은 그 부탁을 들어줘야 하는 <b>이유</b>를 덧붙일 뿐이다. 따라서 글의 목적은 여행에 아들을 추가로 등록해 달라는 부탁이다."}], "opts": [{"n": "①", "t": "야구와 관련된 새로운 사업을 제안하려고", "a": false, "x": true, "trap": false, "e": "사업(business)이나 제안(suggest)에 해당하는 내용이 글 어디에도 없다. 글쓴이는 <b>참가자의 어머니</b>이지 사업 상대가 아니다."}, {"n": "②", "t": "야구 경기 관람권 구매 대행을 요청하려고", "a": false, "x": true, "trap": false, "e": "부탁하는 것은 <b>여행 등록(registration)</b>이지 <b>관람권 구매 대행</b>이 아니다. 표를 대신 사 달라는 말은 나오지 않는다."}, {"n": "③", "t": "아들 생일 파티를 위한 장소 예약을 취소하려고", "a": false, "x": true, "trap": false, "e": "<b>birthday</b>가 나와서 그럴듯하지만, 생일은 여행이 좋은 선물이 되는 <b>이유</b>일 뿐이다. 취소(cancel)는 오히려 정반대다."}, {"n": "④", "t": "주말 가족 여행 일정 변경이 가능한지 문의하려고", "a": false, "x": true, "trap": true, "e": "토요일이라는 날짜가 나와 헷갈리지만, 바꿔 달라는 것은 <b>일정</b>이 아니라 <b>인원 한도</b>다. 문의가 아니라 <b>부탁</b>이다."}, {"n": "⑤", "t": "야구 경기 관람 여행에 아들의 추가 등록을 부탁하려고", "a": true, "x": false, "trap": false, "e": "5번 문장의 <b>allow my son to register additionally</b>를 그대로 옮겼다. However 뒤에 나온 유일한 요청이다."}], "w": [["organizer", "주최자, 조직자"], ["in regards to", "~와 관련하여"], ["take place", "열리다, 개최되다"], ["become aware that", "~을 알게 되다"], ["limit", "한도, 제한"], ["registration", "등록"], ["reach", "(수·양에) 도달하다"], ["appreciate", "감사하다"], ["allow A to V", "A가 ~하도록 허락하다"], ["additionally", "추가로"], ["grateful", "감사하는"], ["look forward to V-ing", "~을 기대하다"]]}, {"q": "02", "type": "내용 불일치", "src": "2020년 10월 26번", "ans": "③", "tr": [["1", "Roman Jakobson은 20세기의 가장 위대한 언어학자 중 한 명이었다."], ["2", "그는 러시아에서 태어났고 이르게는 1915년에 이미 Russian Formalist 학파의 일원이었다."], ["3", "Jakobson은 두 세계 대전 사이에 체코슬로바키아에서 가르쳤는데, 그곳에서 그는 영향력 있는 Prague Linguistic Circle의 지도자 중 한 명이었다."], ["4", "체코슬로바키아가 나치의 침공을 받았을 때 그는 어쩔 수 없이 스칸디나비아로 피신했고, 1941년에 그곳에서 미국으로 갔다."], ["5", "1943년에 그는 Linguistic Circle of New York의 창립 멤버 중 한 명이 되었고 1949년까지 부회장으로 활동했다."], ["6", "그는 1943년부터 하버드 대학교와 MIT를 포함한 수많은 기관에서 가르쳤다."], ["7", "미국에서의 가르침을 통해 Jakobson은 유럽과 미국 언어학 사이의 간극을 좁히는 데 기여했다."], ["8", "현대 구조 언어학의 아버지로 알려진 그는 인류학, 미술 비평, 뇌 연구와 같은 학문 분야에 상당한 영향을 미쳐 온 언어와 의사소통에 관한 정교한 이론들을 만들어 냈다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "When Czechoslovakia was invaded by the Nazis, he was forced to flee to Scandinavia, and went from there to the United States in 1941."}, {"en": false, "h": "내용 불일치 문항은 <b>방향이 뒤집힌 선지</b>가 정답인 경우가 압도적으로 많다. 4번 문장을 보면 그는 나치를 피해 <b>스칸디나비아로</b> 갔고(flee to Scandinavia), 그 다음 <b>from there to the United States</b>, 즉 <b>스칸디나비아에서 미국으로</b> 갔다. 그런데 ③은 <b>미국에서 스칸디나비아로</b> 이주했다고 써서 <b>출발지와 도착지를 바꿔 놓았다</b>. 연도 1941은 그대로 두고 방향만 뒤집는 것이 이 유형의 전형적인 함정이다. 지명이 두 개 이상 나오면 <b>화살표를 그려 두는</b> 습관이 안전하다."}], "opts": [{"n": "①", "t": "1915년에 Russian Formalist 학파의 일원이었다.", "a": false, "x": true, "trap": false, "e": "2번 문장 <b>was a member of the Russian Formalist school as early as 1915</b>. 연도와 소속이 그대로 일치한다."}, {"n": "②", "t": "Prague Linguistic Circle의 지도자 중 한 명이었다.", "a": false, "x": true, "trap": false, "e": "3번 문장 <b>he was one of the leaders of the influential Prague Linguistic Circle</b>. 그대로 나온다."}, {"n": "③", "t": "1941년에 미국에서 스칸디나비아로 이주했다.", "a": true, "x": false, "trap": false, "e": "4번 문장은 <b>스칸디나비아 → 미국</b> 순서다. 선지는 방향이 정반대로 뒤집혀 있다."}, {"n": "④", "t": "유럽과 미국 언어학 사이의 간극을 좁히는 데 기여했다.", "a": false, "x": true, "trap": true, "e": "7번 문장 <b>helped to bridge the gap between European and American linguistics</b>. 표현까지 거의 그대로다."}, {"n": "⑤", "t": "현대 구조 언어학의 아버지로 알려져 있다.", "a": false, "x": true, "trap": false, "e": "8번 문장 첫머리의 <b>Known as the father of modern structural linguistics</b>가 근거다."}], "w": [["linguist", "언어학자"], ["as early as", "이르게는 ~에"], ["influential", "영향력 있는"], ["invade", "침공하다, 침략하다"], ["be forced to V", "어쩔 수 없이 ~하게 되다"], ["flee", "달아나다, 피신하다"], ["founding member", "창립 멤버"], ["act as", "~로 활동하다"], ["numerous", "수많은"], ["bridge the gap", "간극을 좁히다"], ["sophisticated", "정교한, 복잡한"], ["such A as B", "B와 같은 A"]]}, {"q": "03", "type": "밑줄 의미", "src": "2023학년도 수능 21번", "ans": "①", "tr": [["1", "18세기와 19세기에 발달한 상태가 되면서 개인 일기는 근대적 주체성을 구축하는 데 중심이 되었는데, 그 중심에는 세계와 자아에 대한 이해에 이성과 비판을 적용하는 일이 있으며, 이것이 새로운 종류의 지식을 창조할 수 있게 해 주었다."], ["2", "일기는 계몽되고 자유로운 주체가 구성될 수 있는 중심 매체였다."], ["3", "일기는 자신의 행방, 감정, 생각에 대해 매일 쓸 수 있는 공간을 제공했다."], ["4", "시간이 지나고 다시 읽음으로써 이질적인 항목, 사건, 우연한 일들이 자아에 관한 통찰과 이야기로 만들어질 수 있었고, 이는 주체성의 형성을 가능하게 했다."], ["5", "‘말로 만들어지고 또한 말로 탐구되는 자아’라는 개념이 나타나는 것은 바로 그러한 맥락에서다."], ["6", "일기는 개인적이고 사적이었다. 사람은 자기 자신을 위해 썼고, 혹은 Habermas의 명확한 표현으로는 자신을 자신에게 공개적으로 만들곤 했다."], ["7", "사적 영역에서 자아를 공개적으로 만듦으로써 자아는 또한 자기 점검과 자기 비판의 대상이 되었다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "By making the self public in a private sphere, the self also became an object for self-inspection and self-critique."}, {"en": false, "h": "밑줄 의미 문항은 <b>밑줄 바로 다음 문장</b>이 그 표현을 풀어 주는 경우가 가장 많다. 7번 문장이 정확히 그렇다. 자아를 사적 영역에서 공개적으로 만든 결과 자아가 <b>self-inspection(자기 점검)</b>과 <b>self-critique(자기 비판)</b>의 <b>대상</b>이 되었다고 말한다. 즉 남에게 보여 주는 것이 아니라, <b>글을 써서 자기 자신을 들여다보는 일</b>이다. 3번 문장의 <b>write daily about her whereabouts, feelings, and thoughts</b>와 4번 문장의 <b>insights and narratives about the self</b>도 같은 방향을 가리킨다. 따라서 밑줄은 <b>글쓰기를 자기를 되돌아보는 수단으로 쓰는 것</b>을 뜻한다."}], "opts": [{"n": "①", "t": "use writing as a means of reflecting on oneself (글을 자신을 되돌아보는 수단으로 사용하곤)", "a": true, "x": false, "trap": false, "e": "7번 문장의 <b>self-inspection and self-critique</b>를 그대로 옮겼다. 글쓰기(diary)가 그 수단이다."}, {"n": "②", "t": "build one's identity by reading others' diaries (타인의 일기를 읽음으로써 자신의 정체성을 확립하곤)", "a": false, "x": true, "trap": false, "e": "글에 나온 rereading은 <b>자기 일기를 다시 읽는 것</b>이다. <b>남의</b> 일기를 읽는다는 말은 어디에도 없다."}, {"n": "③", "t": "exchange feedback in the process of writing (글 쓰는 과정에서 의견을 교환하곤)", "a": false, "x": true, "trap": false, "e": "6번 문장이 일기를 <b>personal and private</b>라고 못 박는다. 의견 교환은 이 성격과 정면으로 어긋난다."}, {"n": "④", "t": "create an alternate ego to present to others (다른 사람에게 제시하기 위한 대체 자아를 창조하곤)", "a": false, "x": true, "trap": true, "e": "<b>public</b>이라는 단어 때문에 남에게 보여 준다고 읽기 쉽지만, 공개 대상은 <b>to oneself</b>, 곧 자기 자신이다."}, {"n": "⑤", "t": "develop topics for writing about selfhood (자아에 관한 글을 쓰기 위한 주제를 개발하곤)", "a": false, "x": true, "trap": false, "e": "자아는 글의 <b>주제</b>가 아니라 점검과 비판의 <b>대상</b>이다. 주제 개발 이야기는 나오지 않는다."}], "w": [["come of age", "발달한 상태가 되다"], ["centerpiece", "중심물"], ["subjectivity", "주체성, 주관성"], ["application", "적용, 응용"], ["enlightened", "계몽된"], ["whereabouts", "행방, 소재"], ["disparate", "이질적인, 서로 다른"], ["happenstance", "우연한 일"], ["render A into B", "A를 B로 만들어 내다"], ["formulation", "명확한 표현"], ["sphere", "영역"], ["self-inspection", "자기 점검"]]}, {"q": "04", "type": "글의 제목", "src": "2021년 3월 24번", "ans": "②", "tr": [["1", "영국의 저명한 통계학자 F. Yates에 대한 이야기가 있다."], ["2", "Cambridge의 St. John's College에서의 학창 시절에 Yates는 어떤 형태의 스포츠에 매우 관심이 많았다."], ["3", "그것은 밤에 대학 건물의 지붕과 탑을 오르내리는 것으로 이루어져 있었다."], ["4", "특히 St. John's College의 예배당에는 성인들의 동상으로 장식된 거대한 신고딕 양식의 탑이 있는데, Yates에게는 이 성인들이 흰 가운으로 제대로 차려 입혀진다면 더 품위 있으리라는 것이 분명해 보였다."], ["5", "어느 날 밤 그는 기어올라가 그 일을 했고, 다음 날 아침 그 결과는 대체로 많은 칭찬을 받았다."], ["6", "하지만 대학 당국은 인정하지 않았고 그 성인들에게서 새로 얻은 의복을 벗기는 방법을 고민하기 시작했다."], ["7", "그것들이 일반 사다리로는 도저히 닿지 않는 곳에 있었기 때문에 이것은 쉽지 않았다."], ["8", "갈고리가 부착된 밧줄을 사용하여 흰 가운을 위에서 들어 올려 벗기려던 시도는 성공하지 못했다."], ["9", "아무런 진전도 이루어지지 않았고 결국 Yates가 나서서 대낮에 기어올라가 그것들을 가지고 내려오겠다고 자원했다."], ["10", "모인 군중이 감탄할 정도로 그는 이것을 해냈다."]], "evh": "9번 문장", "ev": [{"en": true, "h": "No progress was being made and eventually Yates came forward and volunteered to climb up in the daylight and bring them down."}, {"en": false, "h": "제목 문항은 <b>글의 흐름 전체</b>가 한 방향으로 모이는 지점을 찾는다. 이 글은 Yates가 밤에 탑에 올라 성인상에 <b>가운을 입혔고</b>(5번 문장), 대학 당국이 그것을 <b>벗기지 못해 애먹었으며</b>(6~8번 문장), 결국 <b>Yates 자신이 나서서 해결했다</b>(9~10번 문장)는 순서로 흘러간다. 문제를 만든 사람과 그 문제를 푼 사람이 <b>동일 인물</b>이라는 것이 이 일화의 핵심 재미다. 이것을 그대로 압축한 것이 ②의 <b>a Problem of His Own Making</b>, 곧 '<b>자신이 만든 문제</b>'다.     const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
