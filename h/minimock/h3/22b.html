<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

ue for business in the shape and form of cooperation between firms that involves an integration of value chains across multiple units.", "g": "이는 여러 부문에 걸친 가치 사슬의 통합을 수반하는, 기업 간 협력의 모습과 형태를 띤 사업에서 특히 그러하다.", "ok": false, "e": ["<b>This<\/b>가 (1)의 '정보 시스템이 사업 방식을 바꾸었다'를 받습니다", "그 변화가 특히 <b>기업 간 협력<\/b>에서 크다고 범위를 좁혀 줍니다."]}, {"n": "②", "t": "The resulting networks do not only cover the business units of a single firm but typically also include multiple units from different firms.", "g": "그 결과 생겨나는 연결망은 한 기업의 사업 부문만 아우르는 것이 아니라, 보통 여러 기업의 여러 부문까지 포함한다.", "ok": false, "e": ["<b>The resulting networks<\/b>가 앞의 기업 간 협력이 만든 연결망을 받습니다", "여러 기업의 여러 부문이 연결된다는 내용이 흐름에 맞습니다."]}, {"n": "③", "t": "As a consequence, firms do not only need to consider their internal organization in order to ensure sustainable business performance; they also need to take into account the entire ecosystem of units surrounding them.", "g": "그 결과 기업들은 지속 가능한 경영 성과를 보장하기 위해 내부 조직만 고려해야 하는 것이 아니라, 자신을 둘러싼 부문들의 생태계 전체도 고려해야 한다.", "ok": false, "e": ["<b>As a consequence<\/b>로 앞의 연결망 이야기를 받아, 기업이 주변 부문들의 생태계 전체를 고려해야 한다고 이어 갑니다."]}, {"n": "④", "t": "Many major companies are fundamentally changing their business models by focusing on profitable units and cutting off less profitable ones.", "g": "많은 대기업들은 수익성 있는 부문에 집중하고 수익성이 낮은 부문을 잘라 냄으로써 사업 모델을 근본적으로 바꾸고 있다.", "ok": true, "e": ["<b>units<\/b>라는 단어는 같지만, 수익성 낮은 부문을 <b>잘라 낸다<\/b>는 내용은 부문 간 <b>협력<\/b>이라는 흐름과 관계가 없습니다", "이 문장을 빼면 ③ 다음에 ⑤가 자연스럽게 이어집니다."]}, {"n": "⑤", "t": "In order to allow these different units to cooperate successfully, the existence of a common platform is crucial.", "g": "이렇게 서로 다른 부문들이 성공적으로 협력할 수 있게 하려면 공통의 플랫폼이 존재하는 것이 결정적으로 중요하다.", "ok": false, "e": ["<b>these different units<\/b>가 ③의 주변 부문들을 받습니다", "부문들의 <b>협력<\/b>에 공통 플랫폼이 중요하다는 결론으로 흐름에 맞습니다."]}], "tr": ["정보 시스템은 등장한 이래로 사업이 이루어지는 방식을 상당히 바꾸어 놓았다.", "이는 여러 부문에 걸친 가치 사슬의 통합을 수반하는, 기업 간 협력의 모습과 형태를 띤 사업에서 특히 그러하다.", "그 결과 생겨나는 연결망은 한 기업의 사업 부문만 아우르는 것이 아니라, 보통 여러 기업의 여러 부문까지 포함한다.", "그 en represented. / In fact, Gilden Seavey explains that if producers of historical fiction had strongly held the strict academic standards, many historical subjects would remain unexplored for lack of appropriate evidence. / Historical fiction should, therefore, not be seen as the opposite of professional history, but rather as a challenging representation of the past from which both public historians and popular audiences may learn.", "ev_ko": [[1, "역사 소설을 위한 조사는 기록이 부족한 평범한 사람들이나 사건, 장소에 초점을 맞출 수 있다."], [3, "역사 소설은 '역사가들이 밝혀낼 수 있는 앙상한 뼈대에 살을 붙이고, 그렇게 함으로써 반드시 사실은 아니더라도 과거의 사건과 정황, 문화를 더 또렷이 짐작하게 해 주는 서술을 제공한다.'"], [6, "소설은 사료가 없어서 한 번도 재현된 적 없는 과거의 일부를 이용자들이 볼 수 있게 해 준다."], [7, "실제로 Gilden Seavey는, 만약 역사 소설의 제작자들이 엄격한 학문적 기준을 굳게 지켰더라면 많은 역사적 주제가 적절한 증거가 없어서 탐구되지 않은 채 남았을 것이라고 설명한다."], [8, "따라서 역사 소설은 전문 역사학의 반대편에 있는 것이 아니라, 공공 역사가와 일반 독자 모두가 배울 수 있는 과거의 도전적인 재현으로 보아야 한다."]], "why": ["(A)는 역사 소설이 <b>어떤 증거<\/b>로 과거를 재구성하는지입니다", "(1)의 <b>under-documented<\/b>(기록이 부족한), (6)의 <b>for lack of archives<\/b>(사료가 없어서), (7)의 <b>for lack of appropriate evidence<\/b>(적절한 증거가 없어서)가 모두 증거가 부족하다는 말입니다", "그래서 (A)는 <b>insufficient<\/b>(불충분한)입니다", "(B)는 그 서술이 사람들의 이해에 <b>어떤 영향<\/b>을 주는지입니다", "(3)은 과거를 <b>더 또렷이 짐작하게<\/b> 해 준다고 하고, (8)은 역사가와 일반 독자 모두가 <b>배울 수 있다<\/b>고 합니다", "그래서 (B)는 <b>enrich<\/b>(풍부하게 하다)입니다."], "ch": [{"n": "①", "t": "insignificant …… delay", "g": "대수롭지 않은 …… 미루다", "ok": false, "e": ["(A) 지문은 증거가 <b>부족하다<\/b>고 하지, 대수롭지 않다고 하지 않습니다", "(B) 이해를 <b>미룬다<\/b>는 것은 (8)의 '배울 수 있다'와 반대입니다."]}, {"n": "②", "t": "insufficient …… enrich", "g": "불충분한 …… 풍부하게 하다", "ok": true, "e": ["(1)·(6)·(7)이 증거가 <b>부족하다<\/b>고 하므로 (A)는 insufficient입니다", "(3)·(8)이 이해를 <b>더해 준다<\/b>고 하므로 (B)는 enrich입니다."]}, {"n": "③", "t": "concrete …… enhance", "g": "구체적인 …… 향상시키다", "ok": false, "e": ["(B) enhance는 뜻이 통합니다", "하지만 (A) 역사 소설은 <b>구체적인<\/b> 증거가 아니라 <b>부족한<\/b> 증거를 다룹니다."]}, {"n": "④", "t": "outdated …… improve", "g": "시대에 뒤진 …… 개선하다", "ok": false, "e": ["(B) improve는 뜻이 통합니다", "하지만 (A) 지문은 증거가 <b>시대에 뒤졌다<\/b>가 아니라 <b>부족하다<\/b>고 말합니다."]}, {"n": "⑤", "t": "limited …… disturb", "g": "제한된 …… 방해하다", "ok": false, "e": ["(A) limited는 뜻이 통합니다", "하지만 (B) 이해를 <b>방해한다<\/b>는 것은 (8)의 '배울 수 있다'와 반대입니다."]}], "tr": ["역사 소설을 위한 조사는 기록이 부족한 평범한 사람들이나 사건, 장소에 초점을 맞출 수 있다.", "소설은 역사적 맥락을 되살려 주는 일상의 상황과 감정, 분위기를 그려 내는 데 도움이 된다.", "역사 소설은 '역사가들이 밝혀낼 수 있는 앙상한 뼈대에 살을 붙이고, 그렇게 함으로써 반드시 사실은 아니더라도 과거의 사건과 정황, 문화를 더 또렷이 짐작하게 해 주는 서술을 제공한다.'", "소설은 과거의 일부를 지어내는 만큼이나 과거에 색과 소리와 극적인 요소를 더한다.", "그리고 Robert Rosenstone은 지어냄이 영화의 약점이 아니라 오히려 강점이라고 주장한다.", "소설은 사료가 없어서 한 번도 재현된 적 없는 과거의 일부를 이용자들이 볼 수 있게 해 준다.", "실제로 Gilden Seavey는, 만약 역사 소설의 제작자들이 엄격한 학문적 기준을 굳게 지켰더라면 많은 역사적 주제가 적절한 증거가 없어서 탐구되지 않은 채 남았을 것이라고 설명한다.", "따라서 역사 소설은 전문 역사학의 반대편에 있는 것이 아니라, 공공 역사가와 일반 독자 모두가 배울 수 있는 과거의 도전적인 재현으로 보아야 한다.", "[요약문] 역사 소설은 불충분한 증거를 사용해 과거를 재구성하지만, 마음을 끄는 서술을 제공하며 그것은 역사적 사건에 대한 사람들의 이해를 풍부하게 할 수 있다."], "ps": [{"n": 1, "ch": [{"e": "Research for <b>historical fiction<\/b>", "k": "역사 소설을 위한 조사는"}, {"e": "may focus on", "k": "초점을 맞출 수 있다"}, {"e": "<b>under-documented<\/b> ordinary people, events, or sites.", "k": "기록이 부족한 평범한 사람들, 사건들, 또는 장소들에."}], "easy": "역사 소설을 쓰려고 조사할 때는 기록이 별로 없는 평범한 사람이나 사건, 장소를 다룰 수 있어요.", "gist": "역사 소설은 기록이 부족한 영역을 다뤄요 — (A)의 단서예요."}, {"n": 2, "ch": [{"e": "Fiction helps <b>portray<\/b>", "k": "소설은 그려 내는 데 도움이 된다"}, {"e": "everyday situations, feelings, and atmosphere", "k": "일상의 상황과 감정과 분위기를"}, {"e": "that <b>recreate<\/b> the historical context.", "k": "역사적 맥락을 되살려 주는."}], "link": "소설은 역사적 맥락을 되살려 주는 일상의 상황과 감정과 분위기를 그려 내는 데 도움이 된다.", "easy": "소설은 그 시대의 분위기를 살려 주는 일상의 모습과 감정을 그려 내는 데 도움이 돼요.", "gist": "소설이 하는 일 — 그 시대의 일상을 생생하게 보여 줘요."}, {"n": 3, "ch": [{"e": "Historical fiction adds “<b>flesh<\/b> to the <b>bare bones<\/b>", "k": "역사 소설은 ‘앙상한 뼈대에 살을 붙인다"}, {"e": "that historians are able to <b>uncover<\/b>", "k": "역사가들이 밝혀낼 수 있는"}, {"e": "and by doing so provides an <b>account<\/b>", "k": "그리고 그렇게 함으로써 서술을 제공한다"}, {"e": "that while <b>not necessarily<\/b> true", "k": "반드시 사실은 아니 p>\u0002.", "pk": "소설은 이용자들이 ~할 수 있게 해 준다 / \u0001과거의\u0002 부분들을 보도록 / \u0001결코 - \u0001사료가 없어서\u0002 - 재현된 적이 없는\u0002.", "core": "소설은 이용자들이 부분들을 보게 해 줄 수 있다.", "tags": ["주어 Fiction, 동사 can allow, 목적어 users. allow + 목적어 + to부정사 (5형식)", "목적격보어 <b>to see</b> parts. of the past = 전치사구(형용사구): parts 꾸밈", "that have never been represented = 관계절(형용사절): parts 꾸밈 (현재완료 수동태). 줄표 삽입 for lack of archives = 부사구: been represented 꾸밈 (이유)"], "steps": [{"t": "이 문장은 <b>S+V+O+C(5형식)</b>이다. 뒤에 관계절이 붙고 그 안에 줄표 삽입이 있어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Fiction (소설)", "V: can allow (allow 허락하다, 가능하게 하다)", "O: users (이용자들)", "C: to see parts (일부를 보도록, to부정사)", "뼈대 = <b>Fiction can allow users to see parts</b>", "allow + 목적어 + to V = ~가 V하도록 해 주다"]}, {"t": "<b>of the past</b> (과거의)는 parts를 꾸미는 전치사구(형용사구)이다. past = 과거"}, {"t": "<b>that have never been represented</b>는 <b>주격 관계절(형용사절)</b>로 parts를 꾸민다. '결코 재현된 적이 없는'. 현재완료 수동태이다.", "sub": ["represent = 재현하다, 나타내다"]}, {"t": "never와 been 사이의 줄표 안 <b>for lack of archives</b> (사료가 없어서)는 삽입된 이유 부사구이다. been represented를 꾸민다.", "sub": ["lack = 부족, archive = 기록 자료, 사료", "삽입을 빼고 have never been represented로 읽으면 쉽다."]}], "sum": "소설은 사료가 없어 재현된 적 없는 과거를 보게 해 줌"}, {"i": "06", "q": "10", "s": "A-2", "title": "S+V+C + 현재분사구", "eng": "The high school grounds<sup>1</sup> / were filled with<sup>2</sup> well-dressed<sup>3</sup> people, / posing<sup>4</sup> in fancy dresses and suits for cheerful<sup>5</sup> photographers.", "notes": [["1", "grounds", "(건물 주변의) 부지, 구내"], ["2", "be filled with", "~로 가득 차다"], ["3", "well-dressed", "잘 차려입은"], ["4", "pose", "자세를 취하다"], ["5", "cheerful", "쾌활한"]], "lit": "고등학교 교정은 / 잘 차려입은 사람들로 가득 차 있었다, / 화려한 드레스와 정장 차림으로 쾌활한 사진사들 앞에서 포즈를 취한 채.", "nat": "고등학교 교정은 화려한 드레스와 정장을 차려입고 신이 난 사진사들 앞에서 포즈를 취하는 사람들로 가득했다.", "ana": "<b>be filled with</b>는 '<b>~로 가득 차다</b>'로, 형태는 수동이지만 뜻은 상태를 나타낸다. <b>fill</b>이 '채우다'라는 타동사라서 <b>교정이 채워지는</b> 쪽이 되어 수동이 된 것이다. <b>with</b>가 <b>by</b>가 아니라는 점을 그대로 외워 두자. 콤마 뒤의 <b>posing</b>이 이 문장의 핵심이다. 이미 <b>were filled</b>라는 동사가 있으므로 <b>posing</b>은 또 하나의 동사가 될 수 없고, <b>접속사 없이 이어 붙인 분사구문</b>이다. 원래 문장은 <b>as they were posing ~</b>이고, 분사의 <b>의미상 주어는 people</b>이다. <b>사람들이 포즈를 취하는</b> 쪽이므로 현재분사 <b>posing</b>이 맞다. 앞에 있는 <b>grounds</b>는 '땅'이 아니라 '<b>건물 주변의 부지, 구내</b>'라는 뜻으로, 이 뜻일 때는 늘 복수형으로 쓴다.", "pe": "The high school grounds<sup>1</sup> / were filled \u0001with<sup>2</sup> \u0001well-dressed<sup>3</sup>\u0002 people\u0002, / \u0001posing<sup>4</sup> in fancy dresses and suits for cheerful<sup>5</sup> photographers\u0002.", "pk": "고등학교 교정은 / \u0001\u0001잘 차려입은\u0002 사람들로\u0002 가득 차 있었다, / \u0001화려한 드레스와 정장 차림으로 쾌활한 사진사들 앞에서 포즈를 취한 채\u0002.", "core": "고등학교 교정은 가득 차 있었다.", "tags": ["주어 The high school grounds", "동사 were filled(수동태). with well-dressed people = 전치사구(부사구): filled 꾸밈, <b>거의 필수에 가까운 부사구</b> (be filled with = ~로 가득 차다) [기준: 모양 규칙]", "posing ~ = <b>분사구문</b>(부사적: 부대상황): were filled 꾸밈. 의미상 주어는 people. in fancy dresses and suits = 부사구: posing 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) + 현재분사구</b>이다. 뒤에 현재분사구가 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: The high school grounds (고등학교 교정)", "V: were (be ~이었다)", "C: filled (fill 채우다에서 온 분사형 형용사, 가득 찬)", "뼈대 = <b>The high school grounds were filled</b>", "grounds = 교정, 운동장", "<b>with well-dressed people</b> (잘 차려입은 사람들로)는 be filled with 짝이라 거의 필수에 가까운 부사구이다. be + 분사형 형용사는 2형식으로 본다(문형 기준)."]}, {"t": "<b>well-dressed</b> (잘 차려입은)는 people을 꾸미는 형용사이다. dress = 옷을 입다"}, {"t": "끝의 <b>posing in fancy dresses and suits for cheerful photographers</b>는 <b>현재분사구</b>로 people을 뒤에서 꾸민다. '화려한 드레스와 정장 차림으로 쾌활한 사진사들 앞에서 포즈를 취한 채'.", "sub": ["pose = 포즈를 취하다, fancy = 화려한, suit = 정장, cheerful = 쾌활한, photographer = 사진사", "포즈를 취하는 주인은 주절 주어(교정)가 아니라 바로 앞의 people이다."]}], "sum": "교정은 화려하게 차려입고 사진 찍는 사람들로 가득"}, {"i": "07", "q": "10", "s": "C-6", "title": "독립분사구문 + S+V+O", "eng": "Her thoughts wandering<sup>1</sup>, / Hannah vaguely<sup>2</sup> heard her mother's voice.", "notes": [["1", "wander", "떠돌다, 흘러가다"], ["2", "vaguely", "어렴풋이"]], "lit": "생각이 딴 데로 흐른 채, / Hannah는 어머니의 목소리를 어렴풋이 들었다.", "nat": "생각이 이리저리 흘러가는 사이, Hannah는 어머니의 목소리를 어렴풋이 들었다.", "ana": "앞부분에 동사가 없는데 <b>Her thoughts</b>라는 명사가 <b>wandering</b> 앞에 그대로 놓여 있다. 이것이 <b>독립분사구문</b>이다. 보통 분사구문은 <b>주절의 주어와 분사의 주어가 같아서</b> 주어를 생략하지만, 여기서는 <b>생각이 흐르는</b> 주체가 <b>her thoughts</b>이고 <b>듣는</b> 주체는 <b>Hannah</b>라서 서로 다르다. 주어가 다르면 <b>분사 앞에 의미상 주어를 반드시 남겨 둔다</b>. 원래 문장은 <b>While her thoughts were wandering, ~</b>이고, 앞에 <b>With</b>를 붙여 <b>With her thoughts wandering</b>으로 써도 같은 뜻이다. <b>생각이 흘러가는</b> 능동 관계이므로 현재분사가 왔고, 만약 수동이었다면 과거분사가 왔을 것이다. 문장이 짧다고 넘기면 안 되는, 수능 단골 구조다.", "pe": "\u0001Her thoughts wandering<sup>1</sup>\u0002, / Hannah \u0001vaguely<sup>2</sup>\u0002 heard her mother's voice.", "pk": "\u0001생각이 딴 데로 흐른 채\u0002, / Hannah는 어머니의 목소리를 \u0001어렴풋이\u0002 들었다.", "core": "Hannah는 어머니의 목소리를 들었다.", "tags": ["<b>독립분사구문</b>(부사적: 부대상황): 주절 꾸밈. wandering의 의미상 주어는 Her thoughts (주절 주어 Hannah와 다름)", "주어 Hannah, 동사 heard, 목적어 her mother's voice. vaguely = 부사: heard 꾸밈"], "steps": [{"t": "이 문장은 <b>독립분사구문 + S+V+O(3형식)</b>이다. 앞의 분사구문이 자기 주어를 따로 가져 낯설어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Hannah (사람 이름)", "V: heard (hear 듣다의 과거형)", "O: her mother's voice (어머니의 목소리)", "뼈대 = <b>Hannah heard her mother's voice</b>", "vaguely (어렴풋이)는 heard를 꾸미는 부사이다. voice = 목소리"]}, {"t": "맨 앞 <b>Her thoughts wandering</b>은 <b>독립 분사구문</b>(부대상황)이다. '생각이 딴 데로 흐른 채'라는 뜻이다.", "sub": ["thought = 생각, wander = 딴 데로 흐르다, 헤매다", "wandering의 주어는 Her thoughts이다. 주절 주어 Hannah와 다르다."]}, {"t": "her thoughts의 her는 Hannah를 가리킨다. 주어가 다르므로 분사구문 앞에 주어를 그대로 남긴 것이다."}], "sum": "Hannah, 생각이 딴 데 간 채 엄마 목소리를 어렴풋이 들음"}, {"i": "08", "q": "10", "s": "D-1", "title": "S+V+C + as if 가정법 과거", "eng": "That day was unusually<sup>1</sup> foggy<sup>2</sup> / as if something mysterious<sup>3</sup> were ahead<sup>4</sup>.", "notes": [["1", "unusually", "유난히"], ["2", "foggy", "안개가 낀"], ["3", "mysterious", "알 수 없는, 신비로운"], ["4", "ahead", "앞에 놓인"]], "lit": "그날은 유난히 안개가 짙었다 / 마치 뭔가 알 수 없는 일이 앞에 놓여 있기라도 한 것처럼.", "nat": "그날은 마치 무언가 알 수 없는 일이 기다리고 있기라도 한 듯 유난히 안개가 짙었다.", "ana": "<b>as if</b>는 '<b>마치 ~인 것처럼</b>'이라는 뜻인데, 여기서 반드시 확인할 것은 <b>동사의 모양</b>이다. 주어가 <b>something</b>이라는 단수인데 동사가 <b>was</b>가 아니라 <b>were</b>다. 이것은 실수가 아니라 <b>가정법 과거</b>의 표시다. <b>as if + 주어 + 과거동사</b>는 <b>사실은 그렇지 않은데 그런 것처럼</b>이라는 뜻이며, be동사는 주어와 상관없이 <b>were</b>를 쓰는 것이 원칙이다. 즉 실제로 무언가 기다리고 있었던 것은 아니고, <b>그런 느낌이 들 만큼 안개가 짙었다</b>는 말이다. 만약 <b>as if something mysterious was ahead</b>였다면 실제로 그럴 수도 있다는 뉘앙스가 된다. <b>as if</b> 뒤에 <b>had p.p.</b>가 오면 주절보다 <b>더 앞선 때</b>를 가리킨다는 것도 함께 정리해 두자.", "pe": "That day was \u0001unusually<sup>1</sup>\u0002 foggy<sup>2</sup> / \u0001as if something mysterious<sup>3</sup> were ahead<sup>4</sup>\u0002.", "pk": "그날은 \u0001유난히\u0002 안개가 짙었다 / \u0001마치 뭔가 알 수 없는 일이 앞에 놓여 있기라도 한 것처럼\u0002.", "core": "그날은 안개가 짙었다.", "tags": ["주어 That day, 동사 was, 보어 foggy(SVC). unusually = 부사: foggy 꾸밈", "as if ~ = 부사절(양태): was foggy 꾸밈. <b>가정법 과거</b> were (사실과 반대의 가정). 안쪽: 주어 something mysterious"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식) + as if절</b>이다. 뒤에 가정법 절이 붙어 낯설어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: That day (그날)", "V: was (be ~이었다)", "C: foggy (안개가 짙은)", "뼈대 = <b>That day was foggy</b>", "unusually (유난히)는 foggy를 꾸미는 부사이다. fog = 안개"]}, {"t": "<b>as if something mysterious were ahead</b>는 <b>as if 부사절(양태)</b>이다. '마치 뭔가 알 수 없는 일이 앞에 놓여 있기라도 한 것처럼'이라는 뜻이다.", "sub": ["mysterious = 알 수 없는, 신비로운, ahead = 앞에", "절 안의 뼈대는 something mysterious (S) + were (V) 이다."]}, {"t": "주어가 3인칭 단수 something인데도 was가 아니라 <b>were</b>를 썼다. 이것이 <b>가정법 과거</b>(사실이 아님을 나타냄)의 모양이다. 실제로는 앞에 아무것도 없다는 느낌이다."}], "sum": "그날은 앞에 뭔가 있는 듯 유난히 안개 짙음"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2019년 3월 34번", "ans": "④", "tr": [["1", "개인주의의 핵심에는 개개인이 저마다 자기 세계의 중심이라는 믿음이 자리 잡고 있다."], ["2", "언뜻 보면 이것은 대부분의 사람들이 대놓고 받아들이려 하지는 않을 견해로 보인다."], ["3", "어쨌든 우리는 남을 살피고 남에게 마음을 쓰라는 말을 자주 듣는다."], ["4", "게다가 대놓고 자기중심적인 사람을 정말로 좋아하는 이는 아무도 없다."], ["5", "그러나 자기중심적인 삶으로 끌리는 힘이 강하다는 것은 우리 모두 인정해야 하며, 이 때문에 우리는 이타심의 언어를 써서 이기적인 의도를 감추고 싶어진다."], ["6", "솔직해진다면, 우리가 희생적으로 한다거나 그저 옳기 때문에 한다고 말하는 많은 일이 사실은 우리에게 개인적 이익을 가져다주는 바로 그 행동과 똑같다는 것을 인정하게 될 것이다."], ["7", "우리의 동기를 조금만 편견 없이 들여다보면, 우리가 개인적 이익 쪽으로 강하게 기울어 있다는 것을 부인하기 어렵다."], ["8", "따라서 우리가 그와 반대로 말하더라도, 우리가 스스로 인정하려는 것보다 더 자기중심적이라고 주장하기는 어렵지 않다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "With a bit of unbiased examination of our motives, it is hard to deny that we have a strong bias toward our individual interests."}, {"en": false, "h": "빈칸 문장은 <b>Thus</b>로 시작하는 <b>결론</b>이다. 결론이 빈칸이면 <b>바로 앞 문장</b>을 그대로 옮겨 놓으면 된다. 7번은 <b>편견 없이 동기를 들여다보면 우리가 개인적 이익 쪽으로 강하게 기울어 있다는 것을 부인하기 어렵다</b>고 못 박는다. 여기서 <b>a strong bias toward our individual interests</b>가 곧 <b>self-centered</b>다. 그리고 빈칸 문장 앞의 <b>despite what we may say to the contrary</b>(우리가 그와 반대로 말하더라도)가 결정적인 단서다. <b>말로는 아니라고 한다</b>는 뜻이므로, 빈칸에는 <b>말과 실제가 다르다</b>는 내용이 들어가야 한다. 이를 <b>than we are willing to admit</b>(우리가 기꺼이 인정하려는 것보다)로 표현한 ④가 정답이다. 2~4번의 <b>사람들은 대놓고 받아들이지 않는다 · 자기중심적인 사람을 싫어한다</b>도 모두 <b>말과 실제의 간극</b>을 깔아 두는 장치다."}], "opts": [{"n": "①", "t": "우리의 관심사는 우리가 매일 보는 것에서 비롯된다", "a": false, "x": true, "trap": false, "e": "<b>interests</b>라는 단어가 7번에 나오지만 그 뜻은 <b>이익</b>이지 <b>관심사</b>가 아니다. 게다가 <b>매일 보는 것</b>이라는 소재는 지문에 없다."}, {"n": "②", "t": "우리가 생각하는 것보다 남을 위하는 방법이 더 많다", "a": false, "x": true, "trap": false, "e": "3번의 <b>look out for and care about others</b>를 근거로 삼기 쉽지만, 그 문장은 <b>우리가 그렇게 하라는 말을 듣는다</b>는 사회적 요구일 뿐이다. 글의 결론은 정반대 방향이다."}, {"n": "③", "t": "이성과 본능의 경계가 불분명하다", "a": false, "x": true, "trap": false, "e": "<b>reason</b>이나 <b>instinct</b>라는 개념이 지문에 등장하지 않는다. 글이 대비시키는 것은 이성과 본능이 아니라 <b>겉으로 하는 말</b>과 <b>실제 동기</b>다."}, {"n": "④", "t": "우리는 우리가 기꺼이 인정하려는 것보다 더 자기중심적이다", "a": true, "x": false, "trap": false, "e": "7번의 <b>a strong bias toward our individual interests</b>와 빈칸 앞의 <b>despite what we may say to the contrary</b>가 그대로 대응한다."}, {"n": "⑤", "t": "우리는 사회 지향적 동기에 강하게 지배된다", "a": false, "x": true, "trap": true, "e": "3·4번만 읽으면 맞아 보인다. 그러나 5번의 <b>However</b>에서 글이 완전히 방향을 튼다. <b>However</b> 뒤가 필자의 진짜 주장이라는 점을 놓치면 안 된다."}], "w": [["at the heart of", "~의 핵심에"], ["individualism", "개인주의"], ["constitute", "구성하다, ~이 되다"], ["at first glance", "언뜻 보기에"], ["openly", "드러내 놓고"], ["embrace", "받아들이다"], ["after all", "어쨌든, 결국"], ["look out for", "~을 살피다, 돌보다"], ["self-centered", "자기중심적인"], ["tug", "이끌림"], ["tempt", "부추기다, 유혹하다"], ["selfish", "이기적인"], ["intention", "의도"], ["unselfishness", "이타심"], ["claim to V", "~한다고 주장하다"], ["sacrificially", "희생적으로"], ["unbiased", "편향되지 않은"], ["motive", "동기"], ["bias toward", "~에 대한 편향"], ["to the contrary", "그와 반대로"], ["make the case that", "~라고 주장하다"]]}, {"q": "08", "type": "무관한 문장", "src": "2022학년도 수능 35번", "ans": "④", "tr": [["1", "정보 시스템은 등장한 이래로 사업이 이루어지는 방식을 상당히 바꾸어 놓았다."], ["2", "이는 여러 부문에 걸친 가치 사슬의 통합을 수반하는, 기업 간 협력의 모습과 형태를 띤 사업에서 특히 그러하다."], ["3", "그 결과 생겨나는 연결망은 한 기업의 사업 부문만 아우르는 것이 아니라, 보통 여러 기업의 여러 부문까지 포함한다."], ["4", "그 결과 기업들은 지속 가능한 경영 성과를 위해 내부 조직만 살피면 되는 것이 아니라, 자신을 둘러싼 조직 전체의 생태계까지 고려해야 한다."], ["5", "많은 대기업들은 수익성 있는 부문에 집중하고 수익성이 낮은 부문을 잘라 냄으로써 사업 모델을 근본적으로 바꾸고 있다."], ["6", "이렇게 서로 다른 부문들이 성공적으로 협력할 수 있게 하려면 공통의 플랫폼이 존재하는 것이 결정적으로 중요하다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "In order to allow these different units to cooperate successfully, the existence of a common platform is crucial."}, {"en": false, "h": "무관한 문장 문항은 <b>글이 계속 붙들고 있는 핵심어</b>를 먼저 잡아야 한다. 이 글의 핵심어는 <b>cooperation</b>(협력)과 <b>units</b>(부문)다. 2번은 <b>기업 간 협력</b>, 3번은 <b>여러 기업의 여러 부문을 아우르는 연결망</b>, 4번은 <b>주변 생태계까지 고려해야 한다</b>, 그리고 마지막 6번은 <b>그 부문들이 협력하려면 공통 플랫폼이 필요하다</b>로 끝난다. 즉 글 전체가 <b>여러 부문이 어떻게 함께 일하는가</b> 한 방향으로 달린다. 그런데 ④(5번)는 <b>수익성 낮은 부문을 잘라 낸다</b>는 이야기다. <b>부문(units)</b>이라는 단어는 같지만 방향이 <b>협력이 아니라 정리·축소</b>로 정반대다. 게다가 6번의 <b>these different units</b>는 <b>3·4번에 나온 여러 부문</b>을 받는 말이라, 5번을 빼야 <b>4번 → 6번</b>이 자연스럽게 이어진다. 무관 문장은 이렇게 <b>앞뒤를 붙여 보면 오히려 매끄러워지는지</b>로 확인하는 것이 가장 확실하다."}], "opts": [{"n": "①", "t": "This is particularly true for business in the shape and form of cooperation between firms ~", "a": false, "x": true, "trap": false, "e": "1번의 <b>정보 시스템이 사업 방식을 바꾸었다</b>를 <b>특히 어떤 사업에서</b>로 좁혀 준다. <b>This</b>가 앞 문장을 그대로 받으므로 연결이 매끄럽다."}, {"n": "②", "t": "The resulting networks do not only cover the business units of a single firm ~", "a": false, "x": true, "trap": false, "e": "앞 문장의 <b>cooperation between firms</b>가 만들어 낸 결과를 <b>The resulting networks</b>로 이어받는다. <b>여러 기업의 여러 부문</b>이라는 이 글의 핵심 그림을 처음 제시하는 문장이다."}, {"n": "③", "t": "As a consequence, firms do not only need to consider their internal organization ~", "a": false, "x": true, "trap": false, "e": "<b>As a consequence</b>로 앞의 연결망 이야기에서 <b>그러면 기업은 무엇을 해야 하는가</b>로 자연스럽게 넘어간다. <b>entire ecosystem of units</b>도 핵심어를 그대로 잇는다."}, {"n": "④", "t": "Many major companies are fundamentally changing their business models by focusing on profitable units and cutting off less profitable ones.", "a": true, "x": false, "trap": false, "e": "<b>units</b>라는 단어는 겹치지만 내용은 <b>수익성에 따른 사업 정리</b>다. 글이 말하는 <b>부문 간 협력</b>과 방향이 반대이고, 이 문장을 빼야 ③과 ⑤가 바로 이어진다."}, {"n": "⑤", "t": "In order to allow these different units to cooperate successfully, the existence of a common platform is crucial.", "a": false, "x": true, "trap": true, "e": "<b>these different units</b>가 ②·③에서 말한 여러 부문을 받고, <b>cooperate</b>가 글의 핵심어를 그대로 되풀이한다. 글의 결론에 해당한다."}], "w": [["introduction", "도입, 등장"], ["substantially", "상당히"], ["conduct business", "사업을 운영하다"], ["in the shape and form of", "~의 모습과 형태로"], ["cooperation", "협력"], ["firm", "회사, 기업"], ["involve", "수반하다, 포함하다"], ["integration", "통합"], ["value chain", "가치 사슬"], ["multiple", "여러 개의"], ["unit", "단위, 부문"], ["resulting", "그 결과 생기는"], ["as a consequence", "그 결과"], ["internal organization", "내부 조직"], ["ensure", "보장하다"], ["sustainable", "지속 가능한"], ["take into account", "고려하다"], ["ecosystem", "생태계"], ["surround", "둘러싸다"], ["profitable", "수익성 있는"], ["cut off", "잘라 내다"], ["crucial", "결정적인, 매우 중요한"]]}, {"q": "09", "type": "요약문 완성", "src": "2024학년도 9월 40번", "ans": "②", "tr": [["1", "역사 소설을 위한 조사는 기록이 부족한 평범한 사람들이나 사건, 장소에 초점을 맞출 수 있다."], ["2", "소설은 역사적 맥락을 되살려 주는 일상의 상황과 감정, 분위기를 그려 내는 데 도움이 된다."], ["3", "역사 소설은 '역사가들이 밝혀낼 수 있는 앙상한 뼈대에 살을 붙이고, 그렇게 함으로써 반드시 사실은 아니더라도 과거의 사건과 정황, 문화를 더 또렷이 짐작하게 해 주는 서술을 제공한다.'"], ["4", "소설은 과거의 일부를 지어내는 만큼이나 과거에 색과 소리와 극적인 요소를 더한다."], ["5", "그리고 Robert Rosenstone은 지어냄이 영화의 약점이 아니라 오히려 강점이라고 주장한다."], ["6", "소설은 사료가 없어서 한 번도 재현된 적 없는 과거의 일부를 사람들이 볼 수 있게 해 준다."], ["7", "실제로 Gilden Seavey는, 만약 역사 소설의 제작자들이 엄격한 학문적 기준을 굳게 지켰더라면 많은 역사적 주제가 적절한 증거가 없어서 탐구되지 않은 채 남았을 것이라고 설명한다."], ["8", "따라서 역사 소설은 전문 역사학의 반대편에 있는 것이 아니라, 공공 역사가와 일반 독자 모두가 배울 수 있는 과거의 도전적인 재현으로 보아야 한다."], ["9", "[요약문] 역사 소설은 (A)한 증거를 사용해 과거를 재구성하지만, 사람의 마음을 끄는 서술을 제공하며 그것은 역사적 사건에 대한 사람들의 이해를 (B)할 수 있다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "In fact, Gilden Seavey explains that if producers of historical fiction had strongly held the strict academic standards, many historical subjects would remain unexplored for lack of appropriate evidence."}, {"en": false, "h": "요약문은 <b>빈칸 두 개를 따로 잡는다</b>. (A)는 <b>어떤 증거를 쓰는가</b>이다. 1번의 <b>under-documented</b>(기록이 부족한), 6번의 <b>for lack of archives</b>(사료가 없어서), 7번의 <b>for lack of appropriate evidence</b>(적절한 증거가 없어서)가 모두 같은 말을 세 번 반복한다. 즉 역사 소설이 다루는 영역은 <b>증거가 넉넉하지 않은</b> 곳이므로 (A)는 <b>insufficient</b>다. (B)는 <b>그 서술이 이해에 어떤 작용을 하는가</b>이다. 3번의 <b>provides a clearer indication of past events</b>(더 또렷이 짐작하게 해 준다), 4번의 <b>adds color, sound, drama</b>, 8번의 <b>both public historians and popular audiences may learn</b>이 모두 <b>보태 준다</b>는 긍정 방향이다. 따라서 (B)는 <b>enrich</b>가 된다. 두 빈칸이 <b>부정 → 긍정</b>으로 방향이 갈린다는 점이 이 문항의 핵심이다."}], "opts": [{"n": "①", "t": "insignificant (대수롭지 않은) …… delay (미루다)", "a": false, "x": true, "trap": false, "e": "(A)는 <b>증거가 부족하다</b>는 말이지 <b>대수롭지 않다</b>는 평가가 아니다. (B)의 <b>delay</b>도 이해를 <b>늦춘다</b>는 부정이라 8번의 <b>may learn</b>과 정반대다."}, {"n": "②", "t": "insufficient (불충분한) …… enrich (풍부하게 하다)", "a": true, "x": false, "trap": false, "e": "1번 <b>under-documented</b>, 6번 <b>for lack of archives</b>, 7번 <b>for lack of appropriate evidence</b>가 (A)를, 3·4·8번의 <b>더 또렷이 · 색과 소리를 더하다 · 배울 수 있다</b>가 (B)를 확정해 준다."}, {     const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
