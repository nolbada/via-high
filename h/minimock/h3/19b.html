<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();

 말이 알맞습니다", "정답은 ① <b>approximate idea<\/b>(대략적인 개념)입니다."], "ch": [{"n": "①", "t": "approximate idea", "g": "대략적인 개념", "ok": true, "e": ["(1)에서 모델은 정확한 복제가 아니라 표상이고, (5)에서 비유를 제공한다고 했습니다", "(7)에서 증거에 따라 변한다고도 했습니다", "그래서 모델이 전달하는 것은 <b>대략적인 개념<\/b>입니다."]}, {"n": "②", "t": "factual experience", "g": "사실에 기반을 둔 경험", "ok": false, "e": ["모델은 기억을 설명하는 <b>비유<\/b>이지 사실에 기반을 둔 경험이 아닙니다", "(1)의 정확한 복제가 아니라는 말과도 맞지 않습니다."]}, {"n": "③", "t": "invariable principle", "g": "불변의 원리", "ok": false, "e": ["(7)에서 모델은 증거가 변하면 함께 변하고 <b>불변의 고정물로 여겨져서는 안 된다<\/b>고 했습니다", "'불변의 원리'는 이와 반대입니다."]}, {"n": "④", "t": "digital representation", "g": "디지털 표상", "ok": false, "e": ["representation(표상)이라는 말은 글에 나오지만 <b>디지털<\/b>에 관한 내용은 글에 없습니다."]}, {"n": "⑤", "t": "undisputed interpretation", "g": "반박의 여지가 없는 해석", "ok": false, "e": ["(7)에서 모델은 증거에 따라 바뀐다고 했습니다", "바뀔 수 있는 것을 <b>반박의 여지가 없는 해석<\/b>이라고 할 수 없습니다."]}], "tr": ["심리학에서 어떤 것의 ‘모델’은 설명되고 있는 그것의 정확한 복제로 결코 간주되어서는 안 되고, 오히려 그것의 표상으로 간주되어야 한다.", "예를 들어, 런던 지하철 지도는 그것(지하철)이 어떻게 작동하고 어디로 가는지 우리가 이해하도록 도와주는 지하철 배치도의 표상이다.", "물론 방향, 축척 등은 그것(런던 지하철 지도) 모두가 그 페이지에 깔끔하게 들어맞도록 다소 왜곡되어야 한다.", "기억의 모델 또한 표상이다.", "이용 가능한 증거에 근거하여, 모델은 우리에게 기억이 어떻게 작동하는지에 대한 비유를 제공한다.", "‘저장소’ 또는 ‘단계’ 또는 ‘회로’라는 용어로 기억을 설명하는 것은 우리의 이해를 더욱 구체적으로 만들어주고, 어떤 특정한 심리학자가 이용 가능한 그 증거를 이해하고 설명하기 위해 어떻게 시도했는지에 대한 대략적인 개념을 독자에게 간단하게 전달한다.", "이러한 모델들은 이용 가능한 증거가 변화함에 따라 변화하고, 따라서 불변의 고정물들로 여겨져서는 안 된다."], "ps": [{"n": 1, "ch": [{"e": "In psychology,", "k": "심리학에서,"}, {"e": "a ‘model’ of something", "k": "어떤 것의 ‘모델’은"}, {"e": "should never be taken as an <b>exact copy<\/b>", "k": "정확한 복제로 결코 간주되어서는 안 된다"}, {"e": "of the thing being described,", "k": "설명되고 있는 그것의,"}, {"e": "but rather as a <b>representation<\/b> of it.", "k": "오히려 그것의 표상으로 (간주되어야 한다)."}], "link": "심리학에서 어떤 것의 ‘모델’은 설명되고 있는 그것의 정확한 복제로 결코 간주되어서는 안 되고, 오히려 그것의 표상으로 간주되어야 한다.", "easy": "심리학에서 말하는 '모델'은 설명하려는 대상을 똑같이 베낀 것이 아니라, 그 대상을 나타낸 것으로 봐야 해요.", "gist": "글의 주제 — 모델은 복제가 아니라 표상이에요."}, {"n": 2, "ch": [{"e": "A map of the Lond  증거를 이해하고 설명하기 위해."}], "link": "‘저장소’ 또는 ‘단계’ 또는 ‘회로’라는 용어로 기억을 설명하는 것은 우리의 이해를 더욱 구체적으로 만들어주고, 어떤 특정한 심리학자가 이용 가능한 그 증거를 이해하고 설명하기 위해 어떻게 시도했는지에 대한 대략적인 개념을 독자에게 간단하게 전달한다.", "easy": "기억을 '저장소', '단계', '회로' 같은 말로 설명하면 우리의 이해가 더 구체적이 돼요. 그리고 어떤 심리학자가 증거를 어떻게 이해하고 설명하려 했는지를 대략 알려 줘요.", "gist": "빈칸 문장 — 모델은 대략적인 개념을 전해 줘요."}, {"n": 7, "ch": [{"e": "These models change", "k": "이러한 모델들은 변화한다"}, {"e": "as the available evidence changes,", "k": "이용 가능한 증거가 변화함에 따라,"}, {"e": "so should not be seen", "k": "따라서 여겨져서는 안 된다"}, {"e": "as <b>permanent fixtures<\/b>.", "k": "불변의 고정물들로."}], "easy": "증거가 바뀌면 모델도 바뀌어요. 그래서 모델을 절대 안 바뀌는 고정된 것으로 보면 안 돼요.", "gist": "정답의 근거 — 모델은 바뀔 수 있어요."}]}, {"no": "09", "typ": "흐름과 무관한 문장", "src": "2018년 3월 35번", "evn": [1, 6, 7], "ev_en": "Reading is a technology for perspective-taking. / Reading is a good habit because it helps you to shape your character and boosts your confidence and personality. / It’s not a big leap to suppose that the habit of reading other people’s words could put one in the habit of entering other people’s minds, including their pleasures and pains.", "ev_ko": [[1, "독서는 조망 수용을 위한 기술이다."], [6, "독서는 좋은 습관인데, 왜냐하면 그것(독서)이 당신의 성격을 형성하는 것을 돕고, 당신의 자신감과 개성을 북돋우기 때문이다."], [7, "다른 사람의 말(글)들을 읽는 습관이 한 사람을 그들(다른 사람들)의 기쁨이나 아픔을 포함하여 다른 사람들의 마음에 들어가는 습관을 갖게 할 수 있다고 생각하는 것은 큰 비약이 아니다."]], "why": ["(1)에서 독서는 <b>조망 수용(perspective-taking)<\/b>, 즉 다른 사람의 관점에서 보는 일을 위한 기술이라고 합니다", "(2)~(5)는 모두 다른 사람의 관점과 마음속으로 들어가는 이야기입니다", "(7)도 다른 사람의 글을 읽는 습관이 <b>다른 사람들의 마음에 들어가는 습관<\/b>으로 이어질 수 있다고 마무리합니다", "그런데 (6)은 독서가 <b>당신의 성격<\/b>을 형성하고 <b>자신감과 개성<\/b>을 북돋운다는 내용입니다", "다른 사람의 관점이 아니라 독서가 나 자신에게 주는 좋은 점을 말하므로 흐름과 관계가 없습니다", "그래서 정답은 ④입니다."], "ch": [{"n": "①", "t": "Not only are you taking in sights and sounds that you could not experience firsthand, but you have stepped inside that person’s mind and are temporarily sharing his or her attitudes and reactions.", "g": "당신은 직접 경험할 수 없었던 광경이나 소리를 받아들이고 있을 뿐만 아니라, 그 사람의 마음속에 들어가 일시적으로 그 사람의 태도와 반응을 공유하고 있는 것이다.", "ok": false, "e": ["(2)의 '그 사람의 관점에서 세상을 관찰한다'를 이어받아, 그 사람의 마음속에 들어가 태도와 반응을 공유한다고 설명합니다", "흐름에 맞습니다."]}, {"n": "②", "t": "Empathy in the sense of adopting someone’s viewpoint is not the same as empathy in the sense of feeling compassion toward the person, but the first can lead to the second by a natural route.", "g": "다른 사람의 관점을 받아들인다는 의미의 ‘공감’은 그 사람에게 연민을 느낀다는 의미의 ‘공감’과 같지 않지만, 전자는 자연스럽게 후자로 이어질 수 있다.", "ok": false, "e": ["다른 사람의 관점을 받아들이는 공감이 연민을 느끼는 공감으로 이어질 수 있다고 합니다", "조망 수용에 관한 이야기라 흐름에 맞습니다."]}, {"n": "③", "t": "Stepping into someone else’s vantage point reminds you that the other fellow has a first-person, present-tense, ongoing stream of consciousness that is very much like your own but not the same as your own.", "g": "다른 누군가의 관점으로 들어가는 것은 그 사람에게도 당신 자신의 것과 매우 비슷하지만 똑같지는 않은, 1인칭의, 현재 시점의, 계속 진행 중인 의식의 흐름이 있다는 것을 상기시킨다.", "ok": false, "e": ["다른 사람의 관점으로 들어가면 그 사람에게도 나와 비슷한 의식의 흐름이 있다는 것을 깨닫는다고 합니다", "역시 조망 수용에 관한 이야기입니다."]}, {"n": "④", "t": "Reading is a good habit because it helps you to shape your character and boosts your confidence and personality.", "g": "독서는 좋은 습관인데, 그것이 당신의 성격을 형성하는 것을 돕고 당신의 자신감과 개성을 북돋우기 때문이다.", "ok": true, "e": ["글은 독서로 <b>다른 사람의 관점<\/b>에 들어가는 이야기인데, 이 문장만 독서가 <b>나 자신<\/b>의 성격·자신감·개성에 주는 도움을 말합니다", "흐름과 관계없는 문장입니다."]}, {"n": "⑤", "t": "It’s not a big leap to suppose that the habit of reading other people’s words could put one in the habit of entering other people’s minds, including their pleasures and pains.", "g": "다른 사람의 글을 읽는 습관이 그들의 기쁨과 아픔을 포함해 다른 사람들의 마음에 들어가는 습관을 갖게 할 수 있다고 생각하는 것은 큰 비약이 아니다.", "ok": false, "e": ["다른 사람의 글을 읽는 습관이 다른 사람의 마음에 들어가는 습관으로 이어질 수 있다고 합니다", "(1)의 '독서는 조망 수용을 위한 기술'과 연결되는 마무리 문장입니다."]}], "tr": ["독서는 조망 수용을 위한 기술이다.", "다른 누군가의 생각들이 당신의 머릿속에 있을 때, 당신은 그 사람의 관점에서 세상을 관찰하고 있는 것이다.", "당신은 당신이 직접 경험할 수 없었던 광경이나 소리를 받아들이고 있는 것일 뿐만 아니라, 당신이 그 사람의 마음속에 들어가 일시적으로(잠시라도) 그 혹은 그녀의 태도와 반응을 공유하고 있는 것이다.", "다른 사람의 관점을 취한다는(받아들이는) 의미에서의 ‘공감’은 그 사람을 향해 연민을 느낀다는 의미의 ‘공감’과 같지 않지만, 전자가 후자로 자연스러운 경로로(자연스럽게) 이어질 수 있다(관점을 받아들이는 공감은 연민을 느끼는 공감으로 이어질 수 있다).", "다른 누군가의 관점으로 들어가는 것은 그 다른 사람이 당신 자신의 것과 매우 비슷하지만 당신 자신의 것과 똑같지는 않은, 1인칭의, 현재 시점의, 계속 진행 중인 의식의 흐름을 갖고 있다는 것(사실)을 당신에게 상기시킨다.", "독서는 좋은 습관인데, 왜냐하면 그것(독서)이 당신의 성격을 형성하는 것을 돕고, 당신의 자신감과 개성을 북돋우기 때문이다.", "다른 사람의 말(글)들을 읽는 습관이 한 사람을 그들(다른 사람들)의 기쁨이나 아픔을 포함하여 다른 사람들의 마음에 들어가는 습관을 갖게 할 수 있다고 생각하는 것은 큰 비약이 아니다."], "ps": [{"n": 1, "ch": [{"e": "Reading is a technology", "k": "독서는 기술이다"}, {"e": "for <b>perspective-taking<\/b>.", "k": "조망 수용을 위한."}], "easy": "책 읽기는 다른 사람의 입장에서 생각해 보게 해 주는 도구예요.", "gist": "글의 주제 — 독서는 남의 관점에 서 보는 기술이에요."}, {"n": 2, "ch": [{"e": "When someone else’s thoughts are in your head,", "k": "다른 누군가의 생각들이 당신의 머릿속에 있을 때,"}, {"e": "you are observing the world", "k": "당신은 세상을 관찰하고 있는 것이다"}, {"e": "from that person’s <b>vantage point<\/b>.", "k": "그 사람의 관점에서."}], "easy": "책을 읽으며 다른 사람의 생각이 내 머릿속에 들어오면, 나는 그 사람의 눈으로 세상을 보고 있는 거예요.", "gist": "주제를 풀어 설명해요 — 남의 관점에서 세상을 봐요."}, {"n": 3, "ch": [{"e": "<b>Not only<\/b> are you <b>taking in<\/b> sights and sounds", "k": "당신은 광경과 소리를 받아들이고 있을 뿐만 아니라"}, {"e": "that you could not experience <b>firsthand<\/b>,", "k": "당신이 직접 경험할 수 없었던,"}, {"e": "<b>but<\/b> you have stepped inside that person’s mind", "k": "당신은 그 사람의 마음속으로 들어가"}, {"e": "and are <b>temporarily<\/b> sharing", "k": "일시적으로 공유하고 있는 것이다"}, {"e": "his or her attitudes and reactions.", "k": "그 혹은 그녀의 태도와 반응을."}], "link": "당신은 당신이 직접 경험할 수 없었던 광경이나 소리를 받아들이고 있는 것일 뿐만 아니라, 당신이 그 사람의 마음속에 들어가 일시적으로 그 혹은 그녀의 태도와 반응을 공유하고 있는 것이다.", "easy": "직접 겪을 수 없던 장면과 소리를 받아들일 뿐 아니라, 그 사람의 마음속에 들어가 잠시 그 사람의 태도와 반응을 함께 느끼는 거예요.", "gist": "①번 자리 — 남의 마음속에 들어가는 경험이에요."}, {"n": 4, "ch": [{"e": "<i>Empathy<\/i> in the sense of <b>adopting<\/b> someone’s viewpoint", "k": "누군가의 관점을 받아들인다는 의미에서의 ‘공감’은"}, {"e": "is not the same as <i>empathy<\/i>", "k": "‘공감’과 같지 않다"}, {"e": "in the sense of feeling <b>compassion<\/b> toward the person,", "k": "그 사람을 향해 연민을 느낀다는 의미에서의,"}, {"e": "but the first can lead to the second", "k": "하지만 전자<span class=\"r\">(= 관점을 받아들이는 공감)<\/span>는 후자<span class=\"r\">(= 연민을 느끼는 공감)<\/span>로 이어질 수 있다"}, {"e": "by a natural route.", "k": "자연스러운 경로로."}], "link": "누군가의 관점을 받아들인다는 의미에서의 ‘공감’은 그 사람을 향해 연민을 느낀다는 의미에서의 ‘공감’과 같지 않지만, 전자는 자연스러운 경로로 후자로 이어질 수 있다.", "easy": "남의 입장이 되어 보는 공감과 남을 불쌍히 여기는 공감은 다르지만, 앞의 공감이 자연스럽게 뒤의 공감으로 이어질 수 있어요.", "gist": "②번 자리 — 관점을 받아들이는 공감은 연민으로 이어질 수 있어요."}, {"n": 5, "ch": [{"e": "Stepping into someone else’s vantage point", "k": "다른 누군가의 관점으로 들어가는 것은"}, {"e": "reminds you", "k": "당신에게 상기시킨다"}, {"e": "that the other fellow has", "k": "그 다른 사람이 갖고 있다는 것을"}, {"e": "a first-person, present-tense, <b>ongoing<\/b> <b>stream of consciousness<\/b>", "k": "1인칭의, 현재 시점의, 계속 진행 중인 의식의 흐름을"}, {"e": "that is very much like your own", "k": "당신 자신의 것<span class=\"r\">(= 당신의 의식의 흐름)<\/span>과 매우 비슷한"}, {"e": "but not the same as your own.", "k": "하지만 당신 자신의 것과 똑같지는 않은."}], "link": "다른 누군가의 관점으로 들어가는 것은 그 다른 사람이 당신 자신의 것과 매우 비슷하지만 똑같지는 않은, 1인칭의, 현재 시점의, 계속 진행 중인 의식의 흐름을 갖고 있다는 것을 당신에게 상기시킨다.", "easy": "남의 입장에 서 보면, 그 사람에게도 나처럼 '지금 이 순간' 이어지는 생각의 흐름이 있다는 걸 다시 깨닫게 돼요. 나와 많이 비슷하지만 똑같지는 않죠.", "gist": "③번 자리 — 남에게도 나와 비슷한 의식의 흐름이 있어요."}, {"n": 6, "ch": [{"e": "Reading is a good habit", "k": "독서는 좋은 습관이다"}, {"e": "because it helps you to shape your character", "k": "왜냐하면 그것<span class=\"r\">(= 독서)<\/span>이 당신의 성격을 형성하는 것을 돕기 때문이다"}, {"e": "and <b>boosts<\/b> your confidence and personality.", "k": "그리고 당신의 자신감과 개성을 북돋우기 (때문이다)."}], "easy": "책 읽기는 성격을 만들어 주고 자신감과 개성을 키워 주니까 좋은 습관이라는 말이에요.", "gist": "④번 자리 — 남의 관점이 아니라 나 자신에게 주는 이득을 말해서 흐름에서 벗어나요(정답)."}, {"n": 7, "ch": [{"e": "It’s not a big <b>leap<\/b>", "k": "큰 비약이 아니다"}, {"e": "to suppose", "k": "생각하는 것은"}, {"e": "that the habit of reading other people’s words", "k": "다른 사람들의 말(글)을 읽는 습관이"}, {"e": "could put one in the habit", "k": "한 사람에게 습관을 갖게 할 수 있다고"}, {"e": "of entering other people’s minds,", "k": "다른 사람들의 마음에 들어가는,"}, {"e": "including their pleasures and pains.", "k": "그들<span class=\"r\">(= 다른 사람들)<\/span>의 기쁨과 아픔을 포함하여."}], "link": "다른 사람들의 말(글)을 읽는 습관이 한 사람을 그들의 기쁨과 아픔을 포함하여 다른 사람들의 마음에 들어가는 습관을 갖게 할 수 있다고 생각하는 것은 큰 비약이 아니다.", "easy": "남의 글을 읽는 습관이 있으면, 남의 기쁨과 아픔까지 포함해 남의 마음속에 들어가 보는 습관도 생길 수 있다고 보는 건 무리한 생각이 아니에요.", "gist": "⑤번 자리 — 독서가 남의 마음에 들어가는 습관으로 이어진다는 마무리예요."}]}, {"no": "10", "typ": "문장 삽입", "src": "2021년 3월 39번", "evn": [1, 4, 5], "ev_en": "Some organizations, however, are unbundling in favor of a more itemized approach sometimes called à la carte pricing. / Selling products as a package rather than individually also may result in cost savings, so bundle pricing is commonly used for banking and travel services, computers, and automobiles with option packages. / This provides customers with the opportunity to pick and choose the products they want without having to purchase bundles that may not be the right mix for their purposes.", "ev_ko": [[1, "[주어진 문장] 그러나 일부 조직은 때때로 ‘à la carte pricing(따로따로 책정하는 가격)’이라고 불리는 더 항목화된 접근법을 선호하여 개별적으로 가격을 매기고 있다."], [4, "제품을 개별적으로가 아니라 패키지로 판매하는 것은 또한 비용 절감이라는 결과를 낳을 수 있으므로, 묶음 가격은 은행 및 여행 서비스, 컴퓨터, 그리고 옵션 패키지가 있는 자동차에 흔히 사용된다."], [5, "이것은 고객에게 그들의 목적에 적절한 조합이 아닐지도 모르는 묶음을 구매할 필요 없이 그들이 원하는 제품을 고르고 선택할 기회를 제공한다."]], "why": ["주어진 문장 (1)은 <b>however<\/b>(그러나)가 들어 있고, 일부 조직이 <b>개별적으로 가격을 매기는(unbundling)<\/b> 방식을 선호한다고 합니다", "(2)~(4)는 묶음 가격의 뜻과 장점을 설명합니다", "(4)는 묶음 가격이 <b>비용 절감<\/b>으로 이어질 수 있어 여러 분야에서 흔히 쓰인다는 내용입니다", "(5)부터는 고객이 원하는 제품을 <b>고르고 선택할 기회<\/b>, 즉 개별 가격 책정의 장점으로 내용이 바뀝니다", "(5)의 <b>This<\/b>(이것)가 가리키는 것은 (4)의 묶음 가격이 아니라 주어진 문장의 <b>a more itemized approach<\/b>(더 항목화된 접근법)입니다", "그래서 주어진 문장은 (4)와 (5) 사이인 ③에 들어갑니다."], "ch": [{"n": "①", "t": "① 자리", "g": "", "ok": false, "e": ["①은 문장 (2)와 (3) 사이입니다", "(2)에서 묶음 가격을 정의한 뒤 (3)에서 그 장점을 설명하는 흐름이라, however로 내용을 바꿀 자리가 아닙니다."]}, {"n": "②", "t": "② 자리", "g": "", "ok": false, "e": ["②는 문장 (3)과 (4) 사이입니다", "(4)도 비용 절감이라는 묶음 가격의 장점을 이어서 말하므로 흐름이 끊기지 않습니다."]}, {"n": "③", "t": "③ 자리", "g": "", "ok": true, "e": ["③은 문장 (4)와 (5) 사이입니다", "묶음 가격의 장점이 끝난 뒤 however로 개별 가격 책정 이야기로 넘어가는 자리입니다", "(5)의 This가 주어진 문장의 a more itemized approach를 가리킵니다."]}, {"n": "④", "t": "④ 자리", "g": "", "ok": false, "e": ["④는 문장 (5)와 (6) 사이입니다", "(5)의 This가 가리키는 대상이 (5) 앞에 있어야 하므로, 주어진 문장은 (5)보다 앞에 와야 합니다."]}, {"n": "⑤", "t": "⑤ 자리", "g": "", "ok": false, "e": ["⑤는 문장 (6)과 (7) 사이입니다", "(7)은 Nevertheless(그럼에도 불구하고)로 다시 묶음 가격 이야기로 돌아오는 문장이라, 개별 가격 책정 이야기가 이미 앞에 나와 있어야 합니다."]}], "tr": ["[주어진 문장] 그러나 일부 조직은 때때로 ‘à la carte pricing(따로따로 책정하는 가격)’이라고 불리는 더 항목화된 접근법을 선호하여 개별적으로 가격을 매기고 있다.", "묶음 가격은 대개 보완적인 제품인 두 개 이상의 제품을 단일 가격에 판매되도록 함께 포장하는 것인데, 그것(묶음 제품의 단일 가격)은 대개 개별 제품 가격의 합계보다 상당히 더 적다(저렴하다).", "묶음 가격은 고객 만족을 촉진하고, 느리게 움직이는(잘 팔리지 않는) 제품이 더 높은 회전율을 가진 제품과 묶여질 때, 회사가 판매를 자극하고 수익을 증가시키는 것을 도울 수 있다.", "제품을 개별적으로가 아니라 패키지로 판매하는 것은 또한 비용 절감이라는 결과를 낳을 수 있으므로, 묶음 가격은 은행 및 여행 서비스, 컴퓨터, 그리고 옵션 패키지가 있는 자동차에 흔히 사용된다.", "이것은 고객에게 그들의 목적에 적절한 조합이 아닐지도 모르는 묶음을 구매할 필요 없이 그들이 원하는 제품을 고르고 선택할 기회를 제공한다.", "게다가 인터넷의 도움으로, 비교 쇼핑은 그 어느 때보다 더 편리해져서, 고객이 물건의 가격을 매기고 그들 자신의 조합을 만들 수 있게 했다.", "그럼에도 불구하고, 묶음 가격은 패키지의 편리함을 선호하는 고객들의 관심을 계속 끌고 있다."], "ps": [{"n": 1, "ch": [{"e": "Some organizations, <b>however<\/b>,", "k": "그러나 일부 조직은,"}, {"e": "are <b>unbundling<\/b>", "k": "개별적으로 가격을 매기고 있다(묶음을 풀고 있다)"}, {"e": "<b>in favor of<\/b> a more <b>itemized<\/b> approach", "k": "더 항목화된 접근법을 선호하여"}, {"e": "sometimes called <i>à la carte pricing<\/i>.", "k": "때때로 ‘à la carte pricing(따로따로 책정하는 가격)’이라고 불리는."}], "easy": "그런데 어떤 회사들은 묶음을 풀고, 제품마다 따로 가격을 매기는 방식을 더 좋아해요.", "gist": "주어진 문장 — however가 있어 앞의 내용(묶음 가격)과 반대되는 이야기가 시작돼요."}, {"n": 2, "ch": [{"e": "Bundle pricing is packaging together", "k": "묶음 가격은 함께 포장하는 것이다"}, {"e": "two or more products,", "k": "두 개 이상의 제품을,"}, {"e": "usually <b>complementary<\/b> ones,", "k": "대개 보완적인 것들<span class=\"r\">(= 제품들)<\/span>을,"}, {"e": "to be sold for a single price,", "k": "단일 가격에 판매되도록,"}, {"e": "which is usually <b>considerably<\/b> less", "k": "그런데 그것<span class=\"r\">(= 묶음의 단일 가격)<\/span>은 대개 상당히 더 적다"}, {"e": "than the sum of the prices of the individual products.", "k": "개별 제품 가격의 합계보다."}], "link": "묶음 가격은 대개 보완적인 제품인 두 개 이상의 제품을 단일 가격에 판매되도록 함께 포장하는 것인데, 그 가격은 대개 개별 제품 가격의 합계보다 상당히 더 적다.", "easy": "묶음 가격은 보통 서로 보완하는 제품 여러 개를 하나로 묶어 한 가격에 파는 거예요. 그 가격은 보통 따로 살 때 값을 다 더한 것보다 꽤 싸요.", "gist": "글의 화제 — 묶음 가격의 뜻이에요."}, {"n": 3, "ch": [{"e": "Bundle pricing <b>facilitates<\/b> customer satisfaction", "k": "묶음 가격은 고객 만족을 촉진한다"}, {"e": "and, when slow-moving products are bundled", "k": "그리고, 잘 팔리지 않는 제품이 묶일 때"}, {"e": "with products with higher <b>turnover<\/b>,", "k": "더 높은 회전율을 가진 제품과,"}, {"e": "can help a company", "k": "회사를 도울 수 있다"}, {"e": "<b>stimulate<\/b> sales and increase <b>revenues<\/b>.", "k": "판매를 자극하고 수익을 증가시키도록."}], "link": "묶음 가격은 고객 만족을 촉진하고, 잘 팔리지 않는 제품이 더 높은 회전율을 가진 제품과 묶일 때, 회사가 판매를 자극하고 수익을 증가시키도록 도울 수 있다.", "easy": "묶음 가격은 고객을 만족시키고, 잘 안 팔리는 제품을 잘 팔리는 제품과 묶으면 회사의 판매와 수익을 늘리는 데도 도움이 될 수 있어요.", "gist": "①번 자리 — 묶음 가격의 장점 1: 고객 만족과 매출 증가예요."}, {"n": 4, "ch": [{"e": "Selling products as a package", "k": "제품을 패키지로 판매하는 것은"}, {"e": "rather than individually", "k": "개별적으로가 아니라"}, {"e": "also may <b>result in<\/b> cost savings,", "k": "또한 비용 절감이라는 결과를 낳을 수 있다,"}, {"e": "so bundle pricing is commonly used", "k": "그래서 묶음 가격은 흔히 사용된다"}, {"e": "for banking and travel services, computers,", "k": "은행 및 여행 서비스, 컴퓨터에,"}, {"e": "and automobiles with option packages.", "k": "그리고 옵션 패키지가 있는 자동차에."}], "link": "제품을 개별적으로가 아니라 패키지로 판매하는 것은 또한 비용 절감이라는 결과를 낳을 수 있으므로, 묶음 가격은 은행 및 여행 서비스, 컴퓨터, 그리고 옵션 패키지가 있는 자동차에 흔히 사용된다.", "easy": "제품을 묶어서 팔면 비용도 아낄 수 있어요. 그래서 은행·여행 서비스, 컴퓨터, 옵션 패키지가 있는 자동차에 묶음 가격을 많이 써요.", "gist": "②번 자리 — 묶음 가격의 장점 2: 비용 절감이에요. 묶음 가격 이야기는 여기까지예요."}, {"n": 5, "ch": [{"e": "<b>This<\/b> provides customers with the opportunity", "k": "이것<span class=\"r\">(= 더 항목화된 접근법)<\/span>은 고객에게 기회를 제공한다"}, {"e": "to pick and choose the products they want", "k": "그들이 원하는 제품을 고르고 선택할"}, {"e": "without having to purchase bundles", "k": "묶음을 구매할 필요 없이"}, {"e": "that may not be the right mix", "k": "적절한 조합이 아닐지도 모르는"}, {"e": "for their purposes.", "k": "그들의 목적에."}], "link": "이것은 고객에게 그들의 목적에 적절한 조합이 아닐지도 모르는 묶음을 구매할 필요 없이 그들이 원하는 제품을 고르고 선택할 기회를 제공한다.", "easy": "따로 가격을 매기면, 고객은 자기에게 맞지 않을 수도 있는 묶음을 살 필요 없이 원하는 제품만 골라 살 수 있어요.", "gist": "③번 자리 — This가 주어진 문장의 '항목화된 접근법'을 가리켜요. 주어진 문장은 바로 이 앞에 와요."}, {"n": 6, "ch": [{"e": "Furthermore, with the help of the Internet,", "k": "게다가, 인터넷의 도움으로,"}, {"e": "comparison shopping has become more convenient than ever,", "k": "비교 쇼핑은 그 어느 때보다 더 편리해졌다,"}, {"e": "allowing customers to price items", "k": "고객이 물건의 가격을 매길 수 있게 하면서"}, {"e": "and create their own mixes.", "k": "그리고 그들 자신의 조합을 만들 수 있게."}], "link": "게다가 인터넷의 도움으로, 비교 쇼핑은 그 어느 때보다 더 편리해져서, 고객이 물건의 가격을 매기고 그들 자신의 조합을 만들 수 있게 했다.", "easy": "게다가 인터넷 덕분에 가격 비교가 아주 쉬워져서, 고객이 직접 가격을 따져 보고 자기만의 조합을 만들 수 있게 됐어요.", "gist": "④번 자리 — 따로 가격을 매기는 방식의 장점이 이어져요."}, {"n": 7, "ch": [{"e": "<b>Nevertheless<\/b>, bundle pricing continues", "k": "그럼에도 불구하고, 묶음 가격은 계속 ~하고 있다"}, {"e": "to <b>appeal to<\/b> customers", "k": "고객들의 관심을 끌고"}, {"e": "who prefer the <b>convenience<\/b> of a package.", "k": "패키지의 편리함을 선호하는."}], "easy": "그래도 묶음으로 사는 게 편한 고객들에게는 묶음 가격이 여전히 인기가 있어요.", "gist": "⑤번 자리 — 다시 묶음 가격으로 돌아와 마무리해요."}]}, {"no": "11", "typ": "장문 · 제목", "src": "2019년 10월 41번", "evn": [3, 7, 14], "ev_en": "So people expected that the egalitarian process would continue and even accelerate. / Globalization has certainly benefited large segments of humanity, but there are signs of growing inequality both between and within societies. / While up until now they have only been able to buy little more than status symbols, soon they might be able to buy life itself.", "ev_ko": [[3, "따라서 사람들은 인류 평등주의의 과정이 계속 이어지고 심지어 가속화될 것이라고 기대했다."], [7, "세계화는 인류의 커다란 부분에 분명 혜택을 주었지만, 사회들 간 그리고 사회들 내부 모두에서 증가하는 불평등의 조짐이 있다(불평등이 증가하고 있다는 조짐이 있다)."], [14, "그들은 지금까지는 고작 높은 사회적 지위를 상징하는 것에 불과한 것들만을 살 수 있었지만, 곧 생명 자체를 살 수 있을지도 모른다."]], "why": ["(1)~(5)에서 20세기에는 불평등이 줄었고, (3)에서 사람들은 이 <b>평등해지는 과정이 계속되고 더 빨라질 것<\/b>이라고 기대했다고 합니다", "그런데 (6)에서 이 약속은 이행되지 못할 수도 있다고 하고, (7)에서 사회들 간에도 사회 안에서도 <b>불평등이 커지는 조짐<\/b>이 있다고 합니다", "이어서 (11)~(15)에서 인공 지능과 생명 공학 때문에 불평등이 더 심해질 수 있다고 합니다", "(14)에서는 부자들이 곧 <b>생명 자체를 살 수 있을지도<\/b> 모른다고 하고, (15)에서는 인류가 <b>생물학적 카스트<\/b>로 나뉠 수도 있다고 합니다", "즉 이 글은 '우리가 더 평등한 사회로 가고 있는가?'를 따져 보는 글입니다", "그래서 제목은 ② <b>Are We Headed for a More Equal Society?<\/b>(우리는 더 평등한 사회로 향하고 있는가?)가 알맞습니다."], "ch": [{"n": "①", "t": "From Material Wealth to Spiritual Wealth", "g": "물질적 부에서 정신적 부로", "ok": false, "e": ["물질적 부에서 정신적 부로 옮겨 간다는 내용은 글에 없습니다", "(13)·(14)에서 부자들이 하게 될 '가치 있는 일'은 생명 자체를 사는 것입니다."]}, {"n": "②", "t": "Are We Headed for a More Equal Society?", "g": "우리는 더 평등한 사회로 향하고 있는가?", "ok": true, "e": ["(3)에서 사람들은 평등해지는 과정이 계속될 것이라고 기대했지만, (7)에서 불평등이 커지는 조짐이 있다고 합니다", "더 평등한 사회로 가고 있는지를 묻는 이 제목이 글 전체를 담고 있습니다."]}, {"n": "③", "t": "Globalization: A Step Toward an Equal Society", "g": "세계화: 평등한 사회로 가는 단계", "ok": false, "e": ["(4)에서 세계화가 번영을 퍼뜨릴 것이라는 기대가 나오지만, (7)·(8)에서 불평등이 커지고 일부 집단이 세계화의 결실을 독점한다고 합니다", "글의 내용과 반대입니다."]}, {"n": "④", "t": "Artificial Intelligence: Our Servant or Our Master?", "g": "인공 지능: 우리의 하인인가 우리의 주인인가?", "ok": false, "e": ["인공 지능은 (11)에서 상황을 더 나쁘게 할 수 있는 요인 중 하나로 나올 뿐입니다", "글 전체의 제목으로는 범위가 너무 좁습니다."]}, {"n": "⑤", "t": "How to Close the Gap Between the Rich and the Poor", "g": "부유층과 빈곤층의 격차를 좁히는 방법", "ok": false, "e": ["글은 불평등이 커질 수 있다고 말할 뿐, 격차를 <b>좁히는 방법<\/b>은 제시하지 않습니다."]}], "tr": ["20세기의 역사는 대체로 계급, 인종, 그리고 성별 간 불평등의 (a)감소를 중심으로 전개되었다.", "비록 2000년의 세계는 계급제의 일부를 여전히 가지고 있었지만(남아 있었지만), 그럼에도 불구하고 그것은 1900년의 세계보다 훨씬 더 평등한 곳이었다.", "따라서 사람들은 인류 평등주의의 과정이 계속 이어지고 심지어 가속화될 것이라고 기대했다.", "특히, 그들은 세계화가 경제적 번영을 세계 곳곳에 (b)확산시킬 것을, 그리고 결과적으로 인도와 이집트의 사람들이 핀란드와 캐나다의 사람들과 동일한 기회와 특권을 누리게 될 것을 희망했다.", "한 세대 전체가 이 약속 위에서(이 약속을 믿으며) 성장했다.", "이제 이 약속은 이행되지 못할 수도 있는 것처럼 보인다.", "세계화는 인류의 커다란 부분에 분명 혜택을 주었지만, 사회들 간 그리고 사회들 내부 모두에서 증가하는 불평등의 조짐이 있다(불평등이 증가하고 있다는 조짐이 있다).", "일부 집단은 점점 더 세계화의 결실을 (c)독점하고 있는 반면, 수십억 명의 사람들은 뒤처져 있다.", "오늘날, 가장 부유한(최상위 부유층) 1퍼센트가 세계 부의 절반을 소유하고 있다.", "이러한 상황은 훨씬 더 악화될 수 있다.", "인공 지능의 부상은 대다수 사람들의 경제적 가치와 정치적 힘을 소멸시킬 수도 있다.", "동시에, 생명 공학의 발전은 경제적 불평등을 생물학적 불평등으로 전환하는 것을 (d)불가능하게(→ 가능하게) 만들지도 모른다.", "엄청나게 부유한 사람들은 자신들의 막대한 부를 가지고(이용해서) 정말로 할 가치가 있는 무언가를 마침내 갖게 될 것이다.", "그들은 지금까지는 고작 높은 사회적 지위를 상징하는 것에 불과한 것들만을 살 수 있었지만, 곧 생명 자체를 살 수 있을지도 모른다.", "만약 생명을 연장하고 신체적, 인지적 능력을 향상시키기 위한 새로운 치료법이 (e)비용이 많이 드는 것으로 밝혀지면, 인류는 생물학적 카스트로 나뉘게 될지도 모른다."], "ps": [{"n": 1, "ch": [{"e": "The history of the twentieth century", "k": "20세기의 역사는"}, {"e": "<b>revolved<\/b> to a large extent <b>around<\/b>", "k": "대체로 ~을 중심으로 전개되었다"}, {"e": "the (a) <u>reduction<\/u> of <b>inequality<\/b>", "k": "불평등의 (a) 감소를"}, {"e": "between classes, races, and genders.", "k": "계급, 인종, 그리고 성별 간."}], "easy": "20세기 역사는 대체로 계급, 인종, 성별 사이의 불평등이 줄어드는 쪽으로 흘러갔어요.", "gist": "도입 — 20세기에는 불평등이 줄었어요."}, {"n": 2, "ch": [{"e": "Though the world of the year 2000", "k": "비록 2000년의 세계는"}, {"e": "still had its share of <b>hierarchies<\/b>,", "k": "계급제의 일부를 여전히 가지고 있었지만,"}, {"e": "it was nevertheless a far more equal place", "k": "그것<span class=\"r\">(= 2000년의 세계)<\/span>은 그럼에도 불구하고 훨씬 더 평등한 곳이었다"}, {"e": "than the world of 1900.", "k": "1900년의 세계보다."}], "link": "비록 2000년의 세계는 계급제의 일부를 여전히 가지고 있었지만, 그럼에도 불구하고 그것은 1900년의 세계보다 훨씬 더 평등한 곳이었다.", "easy": "2000년에도 계급 같은 위계는 여전히 남아 있었지만, 1900년과 비교하면 훨씬 평등한 세상이었어요.", "gist": "도입 — 1900년보다 2000년이 훨씬 평등했어요."}, {"n": 3, "ch": [{"e": "So people expected", "k": "따라서 사람들은 기대했다"}, {"e": "that the <b>egalitarian<\/b> process", "k": "인류 평등주의의 과정이"}, {"e": "would continue and even <b>accelerate<\/b>.", "k": "계속 이어지고 심지어 가속화될 것이라고."}], "easy": "그래서 사람들은 세상이 계속, 그리고 더 빠르게 평등해질 거라고 기대했어요.", "gist": "사람들의 기대 — 평등해지는 흐름이 계속될 것이라 믿었어요."}, {"n": 4, "ch": [{"e": "In particular, they hoped", "k": "특히, 그들<span class=\"r\">(= 사람들)<\/span>은 희망했다"}, {"e": "that globalization would (b) <u>spread<\/u> economic <b>prosperity<\/b>", "k": "세계화가 경제적 번영을 (b) 확산시킬 것을"}, {"e": "throughout the world,", "k": "세계 곳곳에,"}, {"e": "and that as a result people in India and Egypt", "k": "그리고 결과적으로 인도와 이집트의 사람들이"}, {"e 스트로 나뉠지도 모른다고 합니다", "경제적 불평등이 생물학적 불평등으로 바뀌는 것이 <b>가능해진다<\/b>는 흐름이므로, impossible이 아니라 possible이 와야 합니다."]}, {"n": "⑤", "t": "(e) expensive", "g": "(e) 비용이 많이 드는", "ok": false, "e": ["생명을 연장하고 능력을 향상시키는 치료법이 <b>비용이 많이 들어야<\/b> 부자들만 그것을 살 수 있습니다", "그래야 인류가 생물학적 카스트로 나뉜다는 결론이 이어지므로 알맞습니다."]}], "tr": ["20세기의 역사는 대체로 계급, 인종, 그리고 성별 간 불평등의 (a)감소를 중심으로 전개되었다.", "비록 2000년의 세계는 계급제의 일부를 여전히 가지고 있었지만(남아 있었지만), 그럼에도 불구하고 그것은 1900년의 세계보다 훨씬 더 평등한 곳이었다.", "따라서 사람들은 인류 평등주의의 과정이 계속 이어지고 심지어 가속화될 것이라고 기대했다.", "특히, 그들은 세계화가 경제적 번영을 세계 곳곳에 (b)확산시킬 것을, 그리고 결과적으로 인도와 이집트의 사람들이 핀란드와 캐나다의 사람들과 동일한 기회와 특권을 누리게 될 것을 희망했다.", "한 세대 전체가 이 약속 위에서(이 약속을 믿으며) 성장했다.", "이제 이 약속은 이행되지 못할 수도 있는 것처럼 보인다.", "세계화는 인류의 커다란 부분에 분명 혜택을 주었지만, 사회들 간 그리고 사회들 내부 모두에서 증가하는 불평등의 조짐이 있다(불평등이 증가하고 있다는 조짐이 있다).", "일부 집단은 점점 더 세계화의 결실을 (c)독점하고 있는 반면, 수십억 명의 사람들은 뒤처져 있다.", "오늘날, 가장 부유한(최상위 부유층) 1퍼센트가 세계 부의 절반을 소유하고 있다.", "이러한 상황은 훨씬 더 악화될 수 있다.", "인공 지능의 부상은 대다수 사람들의 경제적 가치와 정치적 힘을 소멸시킬 수도 있다.", "동시에, 생명 공학의 발전은 경제적 불평등을 생물학적 불평등으로 전환하는 것을 (d)불가능하게(→ 가능하게) 만들지도 모른다.", "엄청나게 부유한 사람들은 자신들의 막대한 부를 가지고(이용해서) 정말로 할 가치가 있는 무언가를 마침내 갖게 될 것이다.", "그들은 지금까지는 고작 높은 사회적 지위를 상징하는 것에 불과한 것들만을 살 수 있었지만, 곧 생명 자체를 살 수 있을지도 모른다.", "만약 생명을 연장하고 신체적, 인지적 능력을 향상시키기 위한 새로운 치료법이 (e)비용이 많이 드는 것으로 밝혀지면, 인류는 생물학적 카스트로 나뉘게 될지도 모른다."], "ps": [{"n": 1, "ch": [{"e": "The history of the twentieth century", "k": "20세기의 역사는"}, {"e": "<b>revolved<\/b> to a large extent <b>around<\/b>", "k": "대체로 ~을 중심으로 전개되었다"}, {"e": "the (a) <u>reduction<\/u> of <b>inequality<\/b>", "k": "불평등의 (a) 감소를"}, {"e": "between classes, races, and genders.", "k": "계급, 인종, 그리고 성별 간."}], "easy": "20세기 역사는 대체로 계급, 인종, 성별 사이의 불평등이 줄어드는 쪽으로 흘러갔어요.", "gist": "도입 — 20세기에는 불평등이 줄었어요."}, {"n": 2, "ch": [{"e": "Though the world of the year 2000", "k": "비록 2000년의 세계는"}, {"e": "still had its share of <b>hierarchies<\/b>,", "k": "계급제의 일부를 여전히 가지고 있었지만,"}, {"e": "it was nevertheless a far more equal place", "k": "그것<span class=\"r\">(= 2000년의 세계)<\/span>은 그럼에도 불구하고 훨씬 더 평등한 곳이었다"}, {"e 렬", "it = the Underground (런던 지하철)"]}], "sum": "런던 지하철 노선도, 지하철의 작동과 행선지를 파악하게 돕는 표상"}, {"i": "03", "q": "08", "s": "5", "title": "분사구문 + S+V+O + with 전치사구", "eng": "Based on<sup>1</sup> the evidence available<sup>2</sup>, / a model provides us with an analogy<sup>3</sup> of how memory works.", "notes": [["1", "be based on", "~에 근거하다"], ["2", "available", "이용 가능한"], ["3", "analogy", "비유, 유추"]], "lit": "이용 가능한 증거에 근거하여, / 모델은 우리에게 기억이 어떻게 작동하는지에 대한 비유를 제공한다.", "nat": "확보된 증거를 바탕으로, 모델은 기억이 어떻게 작동하는지에 대한 하나의 비유를 우리에게 제공한다.", "ana": "<b>Based on ~</b>은 '<b>~에 근거하여</b>'라는 뜻의 <b>분사구문</b>으로, 원래 <b>As it is based on ~</b>에서 접속사와 주어가 지워진 형태다. 관용적으로 굳어져 <b>Based on</b> 통째로 외워 두면 된다. 눈여겨볼 곳은 <b>the evidence available</b>이다. 형용사는 보통 명사 앞에 오는데, <b>available</b>·<b>present</b>·<b>concerned</b>·<b>involved</b> 같은 몇몇 형용사는 <b>명사 뒤에 놓여야</b> '<b>지금 구할 수 있는</b>'이라는 뜻이 된다. 실제로 <b>available evidence</b>와 <b>the evidence available</b>은 거의 같은 뜻이지만, 뒤에 놓이면 '<b>현재 확보되어 있는</b>'이라는 한정의 느낌이 강해진다. <b>provide A with B</b>는 '<b>A에게 B를 제공하다</b>'로 <b>with</b>를 빠뜨리지 않도록 주의하고, <b>of how memory works</b>는 전치사 뒤에 온 <b>간접의문문</b>이다.", "pe": "\u0001Based on<sup>1</sup> the evidence \u0001available<sup>2</sup>\u0002\u0002, / a model provides us \u0001with an analogy<sup>3</sup> \u0001of how memory works\u0002\u0002.", "pk": "\u0001\u0001이용 가능한\u0002 증거에 근거하여\u0002, / 모델은 우리에게 \u0001\u0001기억이 어떻게 작동하는지에 대한\u0002 비유를\u0002 제공한다.", "core": "모델은 우리에게 비유를 제공한다.", "tags": ["Based on ~ = <b>분사구문</b>(부사적: 근거): 주절 꾸밈. available = 형용사 후치: evidence 꾸밈", "주어 a model, 동사 provides, 목적어 us. with an analogy ~ = 전치사구(부사구): provides 꾸밈, <b>거의 필수에 가까운 부사구</b>. of how ~ = 형용사구: analogy 꾸밈"], "steps": [{"t": "이 문장은 <b>분사구문 + S+V+O(3형식)</b>이다. 앞에 분사구문이 붙는다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: a model (모델)", "V: provides (provide 제공하다의 3인칭 단수형)", "O: us (우리에게)", "뼈대 = <b>a model provides us</b>", "with an analogy (비유를)는 전치사구. provide A with B는 거의 필수에 가까운 부사구지만 수식어로 분류 (문형 기준)"]}, {"t": "앞의 <b>Based on the evidence available</b>은 <b>수동 분사구문(근거)</b>이다 (확보된 증거를 바탕으로, base 근거를 두다). 의미상 주어는 a model이다.", "sub": ["available (확보할 수 있는)은 evidence (증거)를 뒤에서 꾸미는 형용사"]}, {"t": "<b>of how memory works</b>는 analogy를 꾸미는 형용사구다 (기억이 어떻게 작동하는지에 대한). how memory works가 전치사 of의 목적어다."}], "sum": "확보된 증거에 근거해, 모델이 기억의 작동에 대한 비유를 제공"}, {"i": "04", "q": "09", "s": "3", "title": "Not only 도치 + but 절 (동사 병렬)", "eng": "Not only are you taking in<sup>1</sup> sights and sounds / that you could not experience firsthand<sup>2</sup>, / but you have stepped inside<sup>3</sup> that person's mind / and are temporarily<sup>4</sup> sharing his or her attitudes and reactions.", "notes": [["1", "take in", "받아들이다, 흡수하다"], ["2", "firsthand", "직접, 몸소"], ["3", "step inside", "~ 안으로 들어서다"], ["4", "temporarily", "일시적으로"]], "lit": "당신은 광경과 소리를 받아들이고 있을 뿐만 아니라 / 당신이 직접 경험할 수 없었던 (광경과 소리를), / 당신은 그 사람의 마음속으로 들어섰고 / 일시적으로 그 사람의 태도와 반응을 공유하고 있다.", "nat": "당신은 직접 경험할 수 없었던 광경과 소리를 받아들이는 데 그치지 않고, 그 사람의 마음속으로 들어가 잠시나마 그 사람의 태도와 반응을 함께 겪는다.", "ana": "문장이 <b>Not only</b>로 시작하면 그 뒤는 반드시 <b>의문문 어순으로 도치</b>된다. 그래서 <b>you are taking in</b>이 <b>are you taking in</b>이 되었다. 이 <b>are</b>를 보고 의문문이라고 착각하는 학생이 매년 나오는데, <b>문장 맨 앞의 부정어구(not only, never, little, hardly, no sooner 등)</b>가 도치의 방아쇠라는 것을 기억하면 된다. 도치는 <b>Not only가 이끄는 절에만</b> 일어나고, <b>but</b> 뒤의 절은 <b>you have stepped</b>처럼 <b>정상 어순</b>으로 돌아온다는 점도 중요하다. <b>not only A but (also) B</b>는 'A뿐만 아니라 B도'라는 뜻이고, 여기서 B에 해당하는 부분은 <b>have stepped</b>와 <b>are sharing</b> 두 동사가 다시 <b>and</b>로 묶여 있다. <b>that you could not experience firsthand</b>는 <b>sights and sounds</b>를 꾸미는 <b>목적격 관계대명사절</b>이다.", "pe": "Not only are you taking in<sup>1</sup> sights and sounds / \u0001that you could not experience firsthand<sup>2</sup>\u0002, / but you have stepped \u0001inside<sup>3</sup> that person's mind\u0002 / and are \u0001temporarily<sup>4</sup>\u0002 sharing his or her attitudes and reactions.", "pk": "당신은 광경과 소리를 받아들이고 있을 뿐만 아니라 / \u0001당신이 직접 경험할 수 없었던\u0002 (광경과 소리를), / 당신은 \u0001그 사람의 마음속으로\u0002 들어섰고 / \u0001일시적으로\u0002 그 사람의 태도와 반응을 공유하고 있다.", "core": "당신은 광경과 소리를 받아들일 뿐 아니라, 들어서서 태도와 반응을 공유하고 있다.", "tags": ["<b>Not only</b>가 앞으로 나와 <b>도치</b>(are you). 동사 are taking in, 목적어 sights and sounds", "that you could ~ = 관계절(형용사절): sights and sounds 꾸밈. firsthand = 부사: experience 꾸밈", "<b>not only A but B</b>의 B 절. 주어 you, 동사 have stepped. inside ~ mind = 전치사구(부사구): stepped 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "and로 병렬: 동사 are sharing, 목적어 attitudes and reactions. temporarily = 부사: sharing 꾸밈"], "steps": [{"t": "이 문장은 <b>Not only가 문두로 나온 도치</b>이고 뒤에 but 절이 이어진다. not only A but B 구조다."}, {"t": "앞 절(A)의 어순을 원래대로 돌려 뼈대를 찾는다.", "sub": ["S: you (당신)", "V: are taking in (받아들이고 있다, take in 받아들이다)", "O: sights and sounds (광경과 소리)", "뼈대 = <b>you are taking in sights and sounds</b>", "원래 어순: You are not only taking in ~. Not only 때문에 are가 you 앞으로 나온 도치"]}, {"t": "<b>that you could not experience firsthand</b>는 <b>관계절(형용사절)</b>이다. sights and sounds를 꾸민다 (직접 경험할 수 없었던, firsthand 직접).", "sub": ["that = sights and sounds (광경과 소리)"]}, {"t": "but 뒤 절(B)의 뼈대를 찾는다.", "sub": ["S: you (당신)", "V: have stepped (step 발을 들이다의 현재완료형)", "뼈대 = <b>you have stepped</b>", "inside that person's mind (그 사람의 마음속으로)는 전치사구. step inside는 거의 필수에 가까운 부사구지만 수식어로 분류 (문형 기준)"]}, {"t": "<b>and are temporarily sharing his or her attitudes and reactions</b>는 have stepped와 병렬되는 또 하나의 동사다 (그리고 잠시 그 사람의 태도와 반응을 함께 겪는다, share 함께하다, attitude 태도, reaction 반응)."}], "sum": "직접 못 겪을 광경·소리뿐 아니라 그 사람의 마음속 태도와 반응까지 함께 경험"}, {"i": "05", "q": "09", "s": "5", "title": "동명사 주어 + S+V+IO+DO(that절) + 관계절", "eng": "Stepping into<sup>1</sup> someone else's vantage point<sup>2</sup> / reminds you / that the other fellow<sup>3</sup> has a first-person, present-tense, ongoing stream of consciousness<sup>4</sup> / that is very much like your own but not the same as your own.", "notes": [["1", "step into", "~ 안으로 들어가다"], ["2", "vantage point", "관점, 유리한 위치"], ["3", "fellow", "사람, 동료"], ["4", "stream of consciousness", "의식의 흐름"]], "lit": "다른 누군가의 관점으로 들어가 보는 것은 / 당신에게 상기시킨다 / 그 다른 사람도 1인칭의, 현재 시제의, 계속 진행 중인 의식의 흐름을 가지고 있다는 것을 / 당신 자신의 것과 매우 비슷하지만 당신 자신의 것과 똑같지는 않은 (의식의 흐름을).", "nat": "다른 사람의 관점 안으로 들어가 보면, 그 사람에게도 당신의 것과 아주 비슷하되 똑같지는 않은, 1인칭의 현재진행형 의식의 흐름이 있다는 사실을 새삼 깨닫게 된다.", "ana": "문두의 <b>Stepping</b>을 분사구문으로 읽으면 뒤의 <b>reminds</b>가 갈 곳을 잃는다. 이것은 <b>동명사 주어</b>이고, 동사는 <b>reminds</b>다. 동명사 주어는 아무리 길어도 <b>단수 취급</b>하므로 <b>reminds</b>에 <b>-s</b>가 붙었다는 점이 어법 문제의 단골 포인트다. <b>remind + 사람 + that절</b>은 '<b>~에게 …을 상기시키다</b>'로, 사람 목적어 뒤에 that절이 통째로 온다. 이 that은 <b>접속사</b>인데(뒤가 완전한 문장), 바로 뒤에 또 나오는 <b>that is very much like ~</b>의 that은 <b>주격 관계대명사</b>다(뒤에 주어가 없음). <b>같은 문장 안의 두 that을 구별하는 기준은 오직 뒤 문장의 완전성</b>이다. 끝의 <b>like your own but not the same as your own</b>에서는 <b>like</b>(~와 비슷한)와 <b>the same as</b>(~와 똑같은)가 대비되고 있으며, <b>your own</b>은 <b>your own stream of consciousness</b>의 줄임이다.", "pe": "Stepping \u0001into<sup>1</sup> someone else's vantage point<sup>2</sup>\u0002 / reminds you / that the other fellow<sup>3</sup> has a \u0001first-person, present-tense, ongoing\u0002 stream \u0001of consciousness<sup>4</sup>\u0002 / \u0001that is very much like your own but not the same as your own\u0002.", "pk": "\u0001다른 누군가의 관점으로\u0002 들어가 보는 것은 / 당신에게 상기시킨다 / 그 다른 사람도 \u00011인칭의, 현재 시제의, 계속 진행 중인\u0002 의식의 흐름을 가지고 있다는 것을 / \u0001당신 자신의 것과 매우 비슷하지만 당신 자신의 것과 똑같지는 않은\u0002 (의식의 흐름을).", "core": "들어가 보는 것은 당신에게 다른 사람도 의식의 흐름을 가지고 있음을 상기시킨다.", "tags": ["<b>동명사구 주어</b> Stepping. into ~ vantage point = 전치사구(부사구): Stepping 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "동사 reminds, 목적어 you. remind + 사람 + <b>that절</b>: 동사 뒤 that절을 기다림", "that절 = 목적어(명사절). 주어 the other fellow, 동사 has, 목적어 stream. first-person ~ ongoing = 형용사, of consciousness = 형용사구: 모두 stream 꾸밈", "that is ~ = 관계절(형용사절): stream of consciousness 꾸밈. like ~ but not the same as ~ = 보어 2개 병렬"], "steps": [{"t": "이 문장은 <b>동명사구 주어 + S+V+O+O(4형식)</b>이다. 목적어인 that절 안에 관계절이 있어 아주 길어 보인다."}, {"t": "큰 뼈대부터 찾는다.", "sub": ["S: Stepping into someone else's vantage point (다른 사람의 관점 안으로 들어가는 것) - 동명사구", "V: reminds (remind 상기시키다의 3인칭 단수형)", "IO: you (당신에게)", "DO: that절 (명사절)", "뼈대 = <b>Stepping ~ reminds you that ~</b>", "into someone else's vantage point (다른 사람의 관점 안으로)는 Stepping을 꾸미는 전치사구. step into는 거의 필수에 가까운 부사구지만 수식어로 분류 (문형 기준)"]}, {"t": "that절 안의 뼈대를 찾는다.", "sub": ["S: the other fellow (상대방)", "V: has (가지고 있다)", "O: a first-person, present-tense, ongoing stream of consciousness (1인칭 현재형으로 계속 진행되는 의식의 흐름)", "뼈대 = <b>the other fellow has a ~ stream of consciousness</b>", "first-person (1인칭), present-tense (현재형), ongoing (계속되는)은 stream을 꾸미는 형용사, of consciousness (의식의)는 stream을 꾸미는 형용사구"]}, {"t": "끝의 <b>that is very much like your own but not the same as your own</b>은 <b>관계절(형용사절)</b>이다. stream of consciousness를 꾸민다 (당신의 것과 아주 비슷하지만 똑같지는 않은).", "sub": ["that = stream of consciousness (의식의 흐름)", "V: is, C: very much like your own (당신 것과 아주 비슷한)와 not the same as your own (당신 것과 같지 않은)이 but으로 병렬", "your own = your stream of consciousness (당신의 의식의 흐름)"]}], "sum": "남의 관점에 서 보면 상대에게도 나와 비슷하되 다른 의식의 흐름이 있음을 깨달음"}, {"i": "06", "q": "10", "s": "1", "title": "S+V+C(동명사) + 목적의 to부정사 + 계속적 which절", "eng": "Bundle pricing<sup>1</sup> is packaging<sup>2</sup> together two or more products, usually complementary<sup>3</sup> ones, / to be sold for a single price, / which is usually considerably<sup>4</sup> less than the sum of the prices of the individual products.", "notes": [["1", "bundle pricing", "묶음 가격 (책정)"], ["2", "package", "포장하다, 묶다"], ["3", "complementary", "보완적인"], ["4", "considerably", "상당히, 꽤"]], "lit": "묶음 가격 책정은 둘 이상의 제품, 보통은 서로 보완적인 제품들을 함께 묶는 것이다, / 단일 가격에 판매되도록, / 그런데 그 가격은 보통 개별 제품 가격의 합계보다 상당히 더 낮다.", "nat": "묶음 가격 책정이란 보통 서로 보완적인 둘 이상의 제품을 함께 묶어 하나의 가격에 파는 것인데, 그 가격은 대개 개별 제품 가격을 합한 것보다 상당히 낮다.", "ana": "<b>is packaging</b>을 <b>현재진행형</b>으로 읽으면 '묶는 중이다'가 되어 정의문이라는 성격과 맞지 않는다. 여기서 <b>packaging</b>은 <b>동명사 보어</b>이고, <b>A is B</b>(A란 B하는 것이다)라는 <b>정의</b>를 만든다. 주어가 <b>Bundle pricing</b>이라는 <b>개념</b>일 때는 진행형보다 <b>동명사 보어</b>를 먼저 의심하자. 중간의 <b>usually complementary ones</b>는 앞의 <b>two or more products</b>를 콤마로 받아 다시 말해 주는 <b>동격</b>이고, <b>ones</b>는 <b>products</b>를 대신하는 <b>부정대명사</b>다. <b>to be sold</b>는 '<b>판매되도록</b>'이라는 <b>목적의 to부정사</b>인데, 제품은 파는 쪽이 아니라 <b>팔리는 쪽</b>이므로 <b>to sell</b>이 아니라 <b>수동형 to be p.p.</b>가 쓰였다. 마지막 <b>which</b>는 콤마 뒤에 온 <b>계속적 용법</b>으로, 선행사 <b>a single price</b>를 받아 '<b>그런데 그 가격은</b>'으로 이어 읽는다. 계속적 용법에는 <b>that</b>을 쓸 수 없다.", "pe": "Bundle pricing<sup>1</sup> is packaging<sup>2</sup> \u0001together\u0002 two or more products, \u0001usually complementary<sup>3</sup> ones\u0002, / \u0001to be sold for a single price\u0002, / \u0001which is usually considerably<sup>4</sup> less than the sum of the prices of the individual products\u0002.", "pk": "묶음 가격 책정은 둘 이상의 제품, \u0001보통은 서로 보완적인 제품들을\u0002 \u0001함께\u0002 묶는 것이다, / \u0001단일 가격에 판매되도록\u0002, / \u0001그런데 그 가격은 보통 개별 제품 가격의 합계보다 상당히 더 낮다\u0002.", "core": "묶음 가격 책정은 둘 이상의 제품을 묶는 것이다.", "tags": ["주어 Bundle pricing, 동사 is, 보어 <b>동명사</b> packaging ~. together = 부사: packaging 꾸밈. usually complementary ones = 동격 어구: products 꾸밈", "to be sold ~ = to부정사(부사적: 목적): packaging 꾸밈. <b>수동 부정사</b> to be sold. for a single price = 전치사구(부사구): sold 꾸밈", "which is ~ = <b>계속적 용법</b> 관계절(형용사절): a single price를 받음 (그런데 그 가격은). considerably = 부사: less 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이고 보어가 동명사구다. 뒤에 to부정사와 계속적 관계절이 붙어 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Bundle pricing (묶음 가격 책정)", "V: is (be ~이다)", "C: packaging together two or more products (둘 이상의 제품을 함께 묶는 것) - 동명사구", "뼈대 = <b>Bundle pricing is packaging together two or more products</b>", "together (함께)는 packaging을 꾸미는 부사, usually complementary ones (대개 서로 보완적인 것들)는 products를 다시 설명하는 말 (complementary 보완적인)"]}, {"t": "<b>to be sold for a single price</b>는 <b>to부정사 부사적 용법(목적)</b>이다. packaging을 꾸민다 (하나의 가격에 팔리도록).", "sub": ["to be sold는 sell 팔다의 수동 부정사", "for a single price (하나의 가격으로)는 sold를 꾸미는 전치사구"]}, {"t": "콤마 뒤 <b>which is usually considerably less than the sum of the prices of the individual products</b>는 <b>계속적 관계절(형용사절)</b>이다. a single price를 받는다 (그 가격은 대개 개별 제품 가격의 합보다 상당히 낮다).", "sub": ["V: is, C: less than the sum (합보다 적은)", "considerably (상당히)는 less를 꾸미는 부사, sum 합, individual 개별의"]}], "sum": "묶음 가격 책정, 보완 제품을 하나의 낮은 가격에 묶어 판매"}, {"i": "07", "q": "11", "s": "A-2", "title": "Though절 + S+V+C (far + 비교급 than)", "eng": "Though the world of the year 2000 still had its share<sup>1</sup> of hierarchies<sup>2</sup>, / it was nevertheless<sup>3</sup> a far more equal place / than the world of 1900.", "notes": [["1", "one's share of", "나름의 몫의 ~"], ["2", "hierarchy", "계급제, 위계"], ["3", "nevertheless", "그럼에도 불구하고"]], "lit": "2000년의 세계가 여전히 나름의 위계를 가지고 있었지만, / 그럼에도 그것은 훨씬 더 평등한 곳이었다 / 1900년의 세계보다.", "nat": "2000년의 세계에도 여전히 나름의 위계는 있었지만, 그럼에도 그곳은 1900년의 세계보다 훨씬 더 평등한 곳이었다.", "ana": "<b>Though</b>가 이끄는 <b>양보절</b>이 앞에 오고 주절이 뒤에 오는 구조다. 양보절은 '<b>인정은 하지만</b>'이라는 뜻이므로, 필자가 정말 하고 싶은 말은 뒤의 <b>far more equal</b> 쪽이다. 주절에 다시 <b>nevertheless</b>(그럼에도 불구하고)가 들어가 대조를 한 번 더 못 박고 있다. 형태에서 놓치기 쉬운 것은 <b>far</b>다. 여기서 <b>far</b>는 '<b>멀리</b>'가 아니라 <b>비교급을 강조하는 부사</b>로 '<b>훨씬</b>'이라는 뜻이며, <b>much·even·still·a lot</b>과 같은 무리다. 반대로 <b>very</b>는 <b>비교급을 강조할 수 없다</b>는 점이 어법 문제의 단골이다. <b>its share of ~</b>는 '<b>나름의 몫의 ~, 그 나름대로 있을 것은 있는</b>'이라는 뜻의 관용 표현이다.", "pe": "\u0001Though the world of the year 2000 still had its share<sup>1</sup> of hierarchies<sup>2</sup>\u0002, / it was \u0001nevertheless<sup>3</sup>\u0002 a \u0001far\u0002 more equal place / \u0001than the world of 1900\u0002.", "pk": "\u00012000년의 세계가 여전히 나름의 위계를 가지고 있었지만\u0002, / \u0001그럼에도\u0002 그것은 \u0001훨씬\u0002 더 평등한 곳이었다 / \u00011900년의 세계보다\u0002.", "core": "그것은 더 평등한 곳이었다.", "tags": ["Though ~ = 부사절(양보): 주절 꾸밈. 안쪽: 주어 the world, 동사 had, 목적어 its share. of hierarchies = 전치사구(형용사구): share 꾸밈", "주어 it, 동사 was, 보어 place(SVC). nevertheless = 부사: was 꾸밈. far = 부사: 비교급 more equal 강조", "than the world of 1900 = 비교 부사구(than): more equal 꾸밈 (비교 대상)"], "steps": [{"t": "이 문장은 <b>Though 부사절 + S+V+C(2형식)</b>이다. 비교급 표현이 있어 길어 보인다."}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: it (= the world of the year 2000, 2000년의 세계)", "V: was (be ~이었다)", "C: a far more equal place (훨씬 더 평등한 곳)", "뼈대 = <b>it was a far more equal place</b>", "nevertheless (그럼에도)는 was를 꾸미는 부사, far (훨씬)는 비교급 more equal을 강조하는 부사"]}, {"t": "<b>Though the world of the year 2000 still had its share of hierarchies</b>는 <b>부사절(양보)</b>이다. 주절 전체를 꾸민다 (2000년의 세계에도 여전히 나름의 위계가 있었지만).", "sub": ["S: the world (세계), V: had (가졌다), O: its share (나름의 몫)", "of hierarchies (위계의)는 share를 꾸미는 형용사구, hierarchy 위계, share 몫"]}, {"t": "<b>than the world of 1900</b>은 <b>비교 부사구</b>다. more equal을 꾸민다 (1900년의 세계보다)."}], "sum": "2000년의 세계, 위계가 남아 있어도 1900년보다는 훨씬 평등"}, {"i": "08", "q": "11", "s": "B-9", "title": "While절 + S+V+O (little more than)", "eng": "While up until now<sup>1</sup> they have only been able to buy little more than<sup>2</sup> status symbols<sup>3</sup>, / soon they might be able to buy life itself.", "notes": [["1", "up until now", "지금까지"], ["2", "little more than", "~에 불과한"], ["3", "status symbol", "높은 사회적 지위에 대한 상징물"]], "lit": "지금까지 그들은 지위의 상징에 불과한 것들만 살 수 있었지만, / 곧 그들은 생명 자체를 살 수 있게 될지도 모른다.", "nat": "지금까지 그들이 살 수 있었던 것은 지위를 과시하는 물건 정도에 지나지 않았지만, 머지않아 생명 그 자체를 살 수 있게 될지도 모른다.", "ana": "<b>While</b>은 '~하는 동안'이 아니라 여기서는 '<b>~인 반면에, ~이지만</b>'이라는 <b>대조·양보</b>의 접속사다. 뒤에 <b>과거~현재</b>와 <b>soon</b>이라는 <b>시간 대비</b>가 뚜렷하게 놓여 있으므로 대조로 읽어야 한다. <b>have only been able to buy</b>는 <b>현재완료</b> 안에 <b>be able to</b>가 들어간 형태로, <b>can</b>은 완료형과 함께 쓸 수 없기 때문에 반드시 <b>be able to</b>를 빌려 쓴다. <b>little more than</b>은 '<b>~에 불과한, ~에 지나지 않는</b>'이라는 뜻으로, 형태는 비교급이지만 실제로는 <b>가치를 깎아내리는 표현</b>이다. 비슷한 <b>no more than</b>(겨우 ~밖에), <b>not more than</b>(기껏해야)과 헷갈리기 쉬우니 함께 정리해 두자. 마지막의 <b>life itself</b>에서 <b>itself</b>는 <b>강조 용법의 재귀대명사</b>로 '<b>생명 그 자체</b>'라는 뜻이며, 빼도 문장이 성립한다.", "pe": "\u0001While up until now<sup>1</sup> they have only been able to buy little more than<sup>2</sup> status symbols<sup>3</sup>\u0002, / \u0001soon\u0002 they might be able to buy life \u0001itself\u0002.", "pk": "\u0001지금까지 그들은 지위의 상징에 불과한 것들만 살 수 있었지만\u0002, / \u0001곧\u0002 그들은 생명 \u0001자체를\u0002 살 수 있게 될지도 모른다.", "core": "그들은 생명을 살 수 있게 될지도 모른다.", "tags": ["While ~ = 부사절(양보·대조): 주절 꾸밈. little more than = ~에 불과한 (only와 함께 한정)", "soon = 부사: might be able to buy 꾸밈. 주어 they, 동사 might be able to buy, 목적어 life. itself = 강조 재귀대명사: life 꾸밈"], "steps": [{"t": "이 문장은 <b>While 부사절 + S+V+O(3형식)</b>이다. 두 절 모두 조동사가 겹쳐 길어 보인다."}, {"t": "주절의 뼈대를 찾는다.", "sub": ["S: they (그들)", "V: might be able to buy (살 수 있을지도 모른다) - might be able to는 동사 덩어리 (= could)", "O: life itself (생명 그 자체)", "뼈대 = <b>they might be able to buy life itself</b>", "soon (머지않아)은 부사, itself (그 자체)는 life를 강조하는 말"]}, {"t": "<b>While up until now they have only been able to buy little more than status symbols</b>는 <b>부사절(양보·대조)</b>이다. 주절 전체를 꾸민다 (지금까지는 지위의 상징 정도밖에 살 수 없었지만).", "sub": ["S: they, V: have been able to buy (살 수 있었다) - 동사 덩어리", "O: little more than status symbols (지위의 상징에 불과한 것) - little more than = ~에 지나지 않는", "up until now (지금까지), only (겨우), status symbol (지위의 상징)"]}], "sum": "지금껏 지위 과시용 물건 정도만 샀지만, 머지않아 생명까지 살 수도 있음"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2023학년도 6월 32번", "ans": "④", "tr": [["1", "형식주의적 관점에서 문학에 관해 쓰려는 비평가는 무엇보다 먼저, 글의 모든 요소를 하나하나 검토하고 그것들이 어떻게 모여 예술 작품을 만들어 내는지를 묻는 면밀하고 주의 깊은 독자여야 한다."], ["2", "작품의 자율성을 존중하는 그러한 독자는 ______함으로써 작품에 대한 이해에 도달한다."], ["3", "예를 들어 그 사람은 역사상의 시대, 작가의 전기, 문학적 양식을 검토하는 대신, 글이 자족적인 실체라는 가정, 그리고 자신은 그 글이 스스로를 드러내게 해 주는 지배적 원칙을 찾고 있다는 가정을 가지고 글에 접근할 것이다."], ["4", "예를 들어 James Joyce의 단편 \"Araby\"의 등장인물들과 그가 개인적으로 알던 사람들 사이의 관련성은 흥미로울 수 있지만, 형식주의자에게 그것은 그 이야기가 스스로 담고 있는 다른 종류의 정보보다 이야기가 의미를 만들어 내는 방식을 이해하는 데 덜 관련되어 있다."]], "evh": "3번 문장", "ev": [{"en": true, "h": "Instead of examining historical periods, author biographies, or literary styles, for example, he or she will approach a text with the assumption that it is a self-contained entity and that he or she is looking for the governing principles that allow the text to reveal itself."}, {"en": false, "h": "빈칸 문항은 <b>빈칸 다음 문장</b>이 정답을 풀어 주는 경우가 가장 많다. 3번은 <b>Instead of</b>로 시작해 <b>무엇을 하지 않는지</b>부터 말한다. <b>historical periods, author biographies, literary styles</b>, 즉 <b>작품 바깥의 정보</b>는 보지 않는다는 것이다. 그 대신 <b>a self-contained entity</b>(자족적인 실체)라는 가정을 가지고 <b>글 안의 지배적 원칙</b>을 찾는다고 했다. 4번의 예시도 같은 말을 되풀이한다. 작가가 실제로 알던 사람과의 <b>관련성(바깥)</b>보다 <b>the story contains within itself(안)</b>가 더 중요하다는 것이다. 결국 빈칸은 <b>바깥이 아니라 안을 들여다본다</b>는 뜻이 되어야 하므로 ④가 정답이다. 1번의 <b>examines all the elements of a text</b>도 같은 방향을 가리킨다."}], "opts": [{"n": "①", "t": "자기 자신을 그것의 안과 밖 모두에 놓음", "a": false, "x": true, "trap": false, "e": "<b>both inside and outside</b>는 형식주의와 정반대다. 3번은 <b>바깥(historical periods, biographies)</b>을 명시적으로 배제한다."}, {"n": "②", "t": "그것과 세상 사이에서 타협점을 찾음", "a": false, "x": true, "trap": false, "e": "<b>middle ground</b>(타협점)라는 개념이 지문에 없다. 형식주의는 절충이 아니라 <b>작품 내부로의 한정</b>이다."}, {"n": "③", "t": "그 안에서 드러난 역사적인 사실을 찾아봄", "a": false, "x": true, "trap": true, "e": "<b>historical</b>이라는 단어가 3번에 나오지만, 그것은 <b>검토하지 않는 대상</b>으로 나온다. 지문의 단어를 그대로 옮겨 만든 대표적인 함정이다."}, {"n": "④", "t": "그것의 외부나 그것을 넘어서가 아니라 그것의 내부를 들여다봄", "a": true, "x": false, "trap": false, "e": "3번의 <b>self-contained entity</b>·<b>the governing principles</b>와 4번의 <b>within itself</b>가 모두 '<b>내부</b>'를 가리킨다. <b>not outside it or beyond it</b>은 3번의 <b>Instead of</b> 목록과 정확히 대응한다."}, {"n": "⑤", "t": "그것의 등장인물들의 문화적인 관련성을 탐구함", "a": false, "x": true, "trap": false, "e": "4번에 등장인물이 나오지만, 그 관련성은 형식주의자에게 <b>less relevant</b>, 즉 <b>덜 중요한 것</b>으로 제시된다. 방향이 반대다."}], "w": [["critic", "비평가"], ["formalist", "형식주의의; 형식주의자"], ["perspective", "관점"], ["element", "요소, 성분"], ["individually", "개별적으로"], ["come together", "결합되다"], ["autonomy", "자율성, 자치권"], ["achieve", "달성하다"], ["biography", "전기, 일대기"], ["assumption", "가정, 추정"], ["self-contained", "자족적인"], ["entity", "실체"], ["governing principle", "지배적 원칙"], ["reveal", "드러내다"], ["correspondence", "관련성, 유사점"], ["be relevant to", "~와 관련되어 있다"]]}, {"q": "08", "type": "빈칸 추론", "src": "2017년 4월 31번", "ans": "①", "tr": [["1", "심리학에서 어떤 것의 '모델'은 설명되고 있는 그것의 정확한 복제로 결코 간주되어서는 안 되고, 오히려 그것의 표상으로 간주되어야 한다."], ["2", "예를 들어 런던 지하철 노선도는, 지하철이 어떻게 움직이고 어디로 가는지를 우리가 파악하도록 도와주는 배치도의 표상이다."], ["3", "물론 방향, 축척 등은 그 모든 것이 지면에 깔끔하게 들어맞도록 다소 왜곡되어야 한다."], ["4", "기억의 모델 또한 표상이다."], ["5", "확보된 증거를 바탕으로, 모델은 기억이 어떻게 작동하는지에 대한 하나의 비유를 우리에게 제공한다."], ["6", "기억을 '저장소'나 '단계'나 '회로'라는 말로 설명하는 것은 우리의 이해를 더 구체적으로 만들어 주고, 특정 심리학자가 확보된 증거를 이해하고 설명하려 시도한 방식에 대한 ______을 독자에게 간단히 전달할 뿐이다."], ["7", "이러한 모델은 확보된 증거가 변함에 따라 변하므로 불변의 고정물로 여겨져서는 안 된다."]], "evh": "1번 문장", "ev": [{"en": true, "h": "In psychology, a 'model' of something should never be taken as an exact copy of the thing being described, but rather as a representation of it."}, {"en": false, "h": "빈칸의 성격을 결정하는 것은 <b>글 전체를 관통하는 대조</b>다. 1번이 <b>not an exact copy but a representation</b>이라는 축을 세운다. 즉 모델은 <b>정확한 복제가 아니라 대략적인 나타냄</b>이라는 것이다. 2·3번의 지하철 노선도 예시가 이를 뒷받침한다. 노선도는 실제 배치를 <b>distorted somewhat</b>(다소 왜곡)해서 보여 주는 것이지 실물 그대로가 아니다. 그리고 결정타는 7번이다. 모델은 <b>증거가 변하면 같이 변하므로 permanent fixtures로 봐서는 안 된다</b>고 했다. 확정적이지도 불변도 아닌 것, 그것이 바로 <b>approximate idea</b>(대략적인 개념)다. 6번의 <b>simply conveys</b>에서 <b>simply</b>(그저 ~할 뿐)라는 <b>한정</b>의 부사도 정답의 방향을 잡아 준다."}], "opts": [{"n": "①", "t": "대략적인 개념", "a": true, "x": false, "trap": false, "e": "1번의 <b>not an exact copy</b>, 3번의 <b>distorted somewhat</b>, 7번의 <b>should not be seen as permanent fixtures</b>가 모두 <b>정확하지도 고정적이지도 않음</b>을 가리킨다. <b>approximate</b>가 이 셋을 한 단어로 묶는다."}, {"n": "②", "t": "사실에 기반을 둔 경험", "a": false, "x": true, "trap": false, "e": "모델은 <b>경험</b>이 아니라 <b>설명 방식</b>이다. 게다가 <b>factual</b>(사실 그대로)은 1번의 <b>not an exact copy</b>와 정면으로 충돌한다."}, {"n": "③", "t": "불변의 원리", "a": false, "x": true, "trap": true, "e": "7번이 <b>These models change as the available evidence changes</b>라고 못 박았다. <b>invariable</b>은 정반대다."}, {"n": "④", "t": "디지털 표상", "a": false, "x": true, "trap": false, "e": "<b>representation</b>은 계속 나오지만 <b>digital</b>은 지문 어디에도 없다. 익숙한 단어를 붙여 만든 함정이다."}, {"n": "⑤", "t": "반박의 여지가 없는 해석", "a": false, "x": true, "trap": false, "e": "모델이 증거에 따라 바뀐다면 <b>반박의 여지가 없을</b> 수 없다. <b>undisputed</b>는 7번과 모순된다."}], "w": [["be taken as", "~로 간주되다"], ["exact copy", "정확한 복제"], ["representation", "표상, 나타냄"], ["layout", "배치(도)"], ["appreciate", "이해하다, 인식하다"], ["distort", "왜곡하다"], ["scale", "축척, 규모"], ["neatly", "깔끔하게"], ["analogy", "비유, 유추"], ["in terms of", "~라는 말로"], ["concrete", "구체적인"], ["convey", "전달하다"], ["particular", "특정한"], ["attempt to", "~하려고 시도하다"], ["permanent", "불변의, 영구적인"], ["fixture", "고정물"]]}, {"q": "09", "type": "흐름과 무관한 문장", "src": "2018년 3월 35번", "ans": "④", "tr": [["1", "독서는 조망 수용을 위한 기술이다."], ["2", "다른 누군가의 생각이 당신의 머릿속에 있을 때, 당신은 그 사람의 관점에서 세상을 관찰하고 있는 것이다."], ["3", "① 당신은 직접 경험할 수 없었던 광경과 소리를 받아들이는 데 그치지 않고, 그 사람의 마음속으로 들어가 잠시나마 그 사람의 태도와 반응을 함께 겪는다."], ["4", "② 다른 사람의 관점을 받아들인다는 의미에서의 공감은 그 사람을 향해 연민을 느낀다는 의미에서의 공감과 같지 않지만, 전자는 자연스러운 경로로 후자로 이어질 수 있다."], ["5", "③ 다른 사람의 관점 안으로 들어가 보면, 그 사람에게도 당신의 것과 아주 비슷하되 똑같지는 않은, 1인칭의 현재진행형 의식의 흐름이 있다는 사실을 새삼 깨닫게 된다."], ["6", "④ 독서는 좋은 습관인데, 그것이 당신의 성격을 형성하는 것을 돕고 자신감과 개성을 북돋우기 때문이다."], ["7", "⑤ 다른 사람의 글을 읽는 습관이 다른 사람의 즐거움과 고통을 포함해 그들의 마음속으로 들어가는 습관을 갖게 할 수 있다고 생각하는 것은 큰 비약이 아니다."]], "evh": "1번 문장", "ev": [{"en": true, "h": "Reading is a technology for perspective-taking."}, {"en": false, "h": "무관한 문장 문항은 <b>1번 문장이 정한 화제</b>에서 벗어난 것을 찾는 문제다. 1번이 <b>perspective-taking</b>(조망 수용), 즉 <b>남의 관점으로 들어가는 일</b>을 화제로 못 박는다. 2·3번은 <b>남의 관점에서 세상을 본다</b>, 4번은 <b>관점 수용으로서의 공감</b>, 5번은 <b>남의 의식의 흐름을 깨닫는다</b>, 7번은 <b>남의 마음속으로 들어가는 습관</b>으로 전부 <b>타인의 마음</b>을 향하고 있다. 그런데 6번만 <b>your character</b>, <b>your confidence and personality</b>, 즉 <b>독서가 자기 자신에게 주는 이득</b>을 말한다. 방향이 <b>타인 → 자신</b>으로 뒤집힌 것이다. <b>Reading is a good habit</b>이라는 일반적인 칭찬은 그럴듯해 보이지만 이 글의 논지와는 무관하다. 무관 문장은 이렇게 <b>주제어는 같은데 방향이 다른</b> 문장으로 만들어진다."}], "opts": [{"n": "①", "t": "직접 경험할 수 없는 것을 받아들이고 그 사람의 태도와 반응을 공유한다", "a": false, "x": true, "trap": false, "e": "2번의 <b>observing the world from that person's vantage point</b>를 <b>not only A but B</b>로 확장한 문장이다. 흐름에 function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}

  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
