<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }

A Theory of Adaptation》에서, Linda Hutcheon은 주장한다. “각색 작품은 흡혈귀 같지 않은데, 즉 그것은 그것의 원전으로부터 생명의 피를 빨아들이거나 그것을 죽어가게 하거나 죽은 채로 내버려 두지 않으며, 그것이 각색된 작품(원전)보다 더 창백하지도 않다.", "오히려 그것은 그 이전 작품을 살아 있게 유지할 수 있으며, 그렇지 않았다면 그것이 결코 갖지 못했을 사후의 삶을 그것에게 줄 수 있다.”", "각색 작품을 ‘흡혈귀 같다’라고 여기는 것에 대한 Hutcheon의 거부는 실제로 각색 작품을 작업하는 우리 같은 사람들에게 특히 고무적이다.", "텍스트의 ‘사후의 삶’, 즉 먼저 오는 것을 지금 오는 것에 대한 영감으로 여긴다는 생각은 바로 그것의 본질상 작품을 ‘살아 있게’ 유지하고 있다.", "특히 청소년들을 위한 각색 작품들은 청소년 독자를 그때와 지금, 과거와 현재 모두에 관여시키는, 즉 역사의 ‘기념비’이자 독자의 직접 경험의 ‘살’로서 기능하는 추가된 이점을 가지고 있다.", "비록 이것이 전반적으로 각색 작품들에 사실이기는 하지만, 그것은 청소년들을 염두에 두고 쓰인 각색 작품들에 특히 중요하다.", "그런 각색 작품들은 어린 독자들이 그러지 않았다면 구식이거나 무관하다는 인상을 줄 수도 있는 텍스트(원전)와 개인적인 관계를 만드는 것을 허락한다."], "ps": [{"n": 1, "ch": [{"e": "In <i>A Theory of Adaptation<\/i>,", "k": "《A Theory of Adaptation》에서,"}, {"e": "Linda Hutcheon argues that", "k": "Linda Hutcheon은 주장한다"}, {"e": "“An <b>adaptation<\/b> is not <b>vampiric<\/b>:", "k": "“각색 작품은 흡혈귀 같지 않다:"}, {"e": "it does not draw the <b>life-blood<\/b> from its source", "k": "그것은<span class=\"r\">(= 각색 작품)<\/span> 그것의 원전으로부터 생명의 피를 빨아들이지 않는다"}, {"e": "and leave it dying or dead,", "k": "그리고 그것을<span class=\"r\">(= 원전)<\/span> 죽어 가게 하거나 죽은 채로 내버려 두지 않는다,"}, {"e": "nor is it <b>paler<\/b> than the adapted work.", "k": "그것이<span class=\"r\">(= 각색 작품)<\/span> 각색된 작품(원전)보다 더 창백하지도 않다."}], "link": "《A Theory of Adaptation》에서 Linda Hutcheon은 이렇게 주장한다. “각색 작품은 흡혈귀 같지 않다. 그것은 원전에서 생명의 피를 빨아들여 원전을 죽어 가게 하거나 죽은 채로 내버려 두지 않으며, 원전보다 더 창백하지도 않다.", "easy": "Hutcheon은 각색 작품이 흡혈귀처럼 원작의 생명을 빨아먹어 원작을 죽게 만드는 게 아니고, 원작보다 힘없는 것도 아니라고 말해요.", "gist": "각색 작품이 원작을 망친다는 생각을 Hutcheon의 말로 부정하며 시작합니다."}, {"n": 2, "ch": [{"e": "It may, <b>on the contrary<\/b>,", "k": "그것은<span class=\"r\">(= 각색 작품)<\/span>, 오히려,"}, {"e": "keep that <b>prior<\/b> work alive,", "k": "그 이전 작품을 살아 있게 유지할 수 있다,"}, {"e": "giving it an <b>afterlife<\/b>", "k": "그것에게<span class=\"r\">(= 이전 작품)<\/span> 사후의 삶을 주면서"}, {"e": "it would never have had otherwise.”", "k": "그렇지 않았다면 그것이 결코 갖지 못했을.”"}], "link": "오히려 각색 작품은 이전 작품을 살아 있게 유지하여, 그렇지 않았다면 결코 갖지 못했을 사후의 삶을 그것에게 줄 수 있다.”", "easy": "오히려 각색 작품은 원작을 계속 살아 있게 해서, 각색이 없었다면 누리지 못했을 새 삶을 원작에게 줄 수 있어요.", "gist": "각색 작품이 오히려 원작을 살아 있게 한다는 Hutcheon의 생각이 나옵니다."}, {"n": 3, "ch": [{"e": "Hutcheon’s <b>refusal<\/b> to see adaptation as “vampiric”", "k": "각색 작품을 ‘흡혈귀 같다’라고 여기는 것에 대한 Hutcheon의 거부는"}, {"e": "is particularly <b>inspiring<\/b>", "k": "특히 고무적이다"}, {"e": "for those of us who do <b>work on<\/b> adaptations.", "k": "실제로 각색 작품을 작업하는 우리 같은 사람들에게."}], "easy": "각색을 흡혈귀처럼 보지 않는 Hutcheon의 생각은 각색 작업을 하는 사람들에게 큰 힘이 돼요.", "gist": "글쓴이도 각색을 하는 사람으로서 Hutcheon의 생각에 공감합니다."}, {"n": 4, "ch": [{"e": "The idea of an “afterlife” of texts,", "k": "텍스트의 ‘사후의 삶’이라는 생각,"}, {"e": "of seeing what comes before", "k": "즉 먼저 오는 것을 여긴다는 생각은"}, {"e": "as an <b>inspiration<\/b> for what comes now,", "k": "지금 오는 것에 대한 영감으로,"}, {"e": "is, <b>by its very definition<\/b>,", "k": "바로 그것의 본질상,"}, {"e": "keeping works “alive.”", "k": "작품을 ‘살아 있게’ 유지하고 있다."}], "link": "텍스트의 ‘사후의 삶’, 즉 먼저 온 것을 지금 오는 것의 영감으로 본다는 생각은 바로 그 본질상 작품을 ‘살아 있게’ 유지하는 것이다.", "easy": "옛 작품을 지금 작품의 영감으로 본다는 생각은, 그 자체로 옛 작품을 살아 있게 하는 일이에요.", "gist": "‘사후의 삶’이라는 생각이 곧 작품을 살리는 일이라고 정리합니다."}, {"n": 5, "ch": [{"e": "Adaptations for <b>young adults<\/b>, in particular,", "k": "특히 청소년들을 위한 각색 작품들은"}, {"e": "have the added benefit", "k": "추가된 이점을 가지고 있다"}, {"e": "of <b>engaging<\/b> the young adult reader <b>with<\/b> both then and now, past and present", "k": "청소년 독자를 그때와 지금, 과거와 현재 모두에 관여시키는"}, {"e": "— <b>functioning as<\/b> both “<b>monuments<\/b>” to history", "k": "즉 역사의 ‘기념비’로서"}, {"e": "and the “<b>flesh<\/b>” of the reader’s lived experience.", "k": "그리고 독자의 직접 경험의 ‘살’로서 둘 다 기능하는."}], "link": "특히 청소년을 위한 각색 작품들은 청소년 독자를 그때와 지금, 과거와 현재 모두에 관여시키는, 즉 역사의 ‘기념비’이자 독자가 직접 겪은 경험의 ‘살’로 기능하는 추가된 이점을 가지고 있다.", "easy": "특히 청소년용 각색 작품은 청소년 독자가 과거와 현재 모두와 만나게 해 줘요. 역사를 기억하게 하는 기념비이면서, 독자가 직접 겪는 삶의 일부도 되는 거예요.", "gist": "청소년용 각색 작품의 특별한 장점을 말하는 핵심 문장이에요."}, {"n": 6, "ch": [{"e": "While this is true for adaptations <b>in general<\/b>,", "k": "비록 이것이<span class=\"r\">(= 과거와 현재 모두에 관여시키는 이점)<\/span> 전반적으로 각색 작품들에 사실이기는 하지만,"}, {"e": "it is especially important", "k": "그것은 특히 중요하다"}, {"e": "for those written <b>with young adults in mind<\/b>.", "k": "청소년들을 염두에 두고 쓰인 것들<span class=\"r\">(= 각색 작품들)<\/span>에."}], "easy": "이 장점은 각색 작품 전반에 해당하지만, 청소년을 위해 쓴 각색 작품에서 특히 중요해요.", "gist": "청소년용 각색 작품에 초점을 맞춥니다."}, {"n": 7, "ch": [{"e": "Such adaptations", "k": "그런 각색 작품들은"}, {"e": "allow young readers to make personal connections with texts", "k": "어린 독자들이 텍스트와 개인적인 관계를 만드는 것을 허락한다 <span class=\"r\">※ 문제지엔 빈칸으로 되어 있음<\/span>"}, {"e": "that might otherwise <b>come across as<\/b> old-fashioned or <b>irrelevant<\/b>.", "k": "그러지 않았다면 구식이거나 무관하다는 인상을 줄 수도 있는."}], "link": "그런 각색 작품들은 어린 독자들이, 그러지 않았다면 구식이거나 무관하다는 인상을 줄 수도 있는 텍스트와 개인적인 관계를 만들 수 있게 해 준다.", "easy": "청소년용 각색 작품 덕분에, 그냥 두면 낡고 자기와 상관없어 보일 옛 작품을 어린 독자들이 자기 일처럼 가깝게 느낄 수 있어요.", "gist": "글의 결론. 각색 작품이 어린 독자와 옛 텍스트를 이어 준다고 말합니다."}]}, {"no": "09", "typ": "문장 삽입", "src": "2016년 10월 39번", "evn": [1, 6], "ev_en": "Positive rights reflect the vital interests that human beings have in receiving certain benefits. / They are rights to have others provide us with certain goods, services, or opportunities.", "ev_ko": [[1, "적극적 권리는 특정한 혜택을 받는 데 있어 인간이 가지는 필수적인 이익을 나타낸다."], [6, "그것들은 다른 사람들이 우리에게 특정한 물품, 서비스, 또는 기회를 제공하게 하는 권리이다."]], "why": ["(2)에서 권리를 <b>소극적 권리<\/b>와 <b>적극적 권리<\/b>로 나눈 뒤, 두 범주를 차례대로 설명합니다", "(3)~(5)는 소극적 권리 이야기입니다", "(6)은 <b>They<\/b>(그것들)로 시작하는데, 다른 사람들이 우리에게 무언가를 제공하게 하는 권리라고 하므로 They는 <b>적극적 권리<\/b>를 가리킵니다", "그런데 ③ 앞까지는 적극적 권리를 설명하는 문장이 없습니다", "그래서 적극적 권리를 처음 정의하는 주어진 문장 (1)이 ③에 들어가야 합니다."], "ch": [{"n": "①", "t": "(3)과 (4) 사이", "g": "", "ok": false, "e": ["(4)의 <b>this category<\/b>(이 범주)는 (3)의 소극적 권리를 가리킵니다", "여기에 적극적 권리 이야기가 끼어들면 이 연결이 끊깁니다."]}, {"n": "②", "t": "(4)와 (5) 사이", "g": "", "ok": false, "e": ["(5)의 <b>these<\/b>(이것들)는 소극적 권리를 가리킵니다", "사이에 적극적 권리 문장이 들어가면 these가 가리키는 대상이 어긋납니다."]}, {"n": "③", "t": "(5)와 ( uct systems.", "ev_ko": [[1, "한 남녀 커플이 관계를 형성하기 시작할 때, 그들은 그들 자신의 관계에 대해, 그리고 특히, 그들의 관계가 그들 부모들의 관계와 얼마나 비슷하거나 다른지에 대해 일련의 생각들을 발전시키는 것으로 보일 수 있다."], [2, "그 남녀 커플이 처음 터놓는 이야기들은 그들이 그들과 각자의 가족들 사이에 얼마나 많은 유사점이 있는지에 대한 생각들을 형성하는 것을 포함한다."], [4, "결과적으로, 그들(남녀 커플)이 서로에게 그들의 이미 편집된 이야기를 하기 때문에, 그들이 서로에게서 들은 것이 그들 각자의 원래 가족의 생각 체계 내에서 다시 (b)해석되는 두 번째 편집 과정이 있을 가능성이 있다."]], "why": ["(1)에서 커플은 관계를 시작하며 자신들의 관계에 대한 <b>생각들(constructs)<\/b>을 발전시킨다고 합니다", "(2)에서 커플이 처음 털어놓는 이야기는 서로의 <b>가족<\/b>과 얼마나 비슷한지에 대한 생각을 만드는 것이라고 합니다", "(4)에서는 서로에게서 들은 이야기가 각자의 원래 가족의 생각 체계 안에서 <b>다시 해석되는<\/b> 두 번째 편집 과정이 있다고 합니다", "즉 커플은 가족 이야기를 편집하고 다시 해석하면서, 곧 <b>재구성하면서<\/b> 커플이 되어 갑니다", "그래서 ② <b>Shaping a Couple: Reconstructing Family Stories<\/b>(커플이 되는 것: 가족 이야기를 재구성하는 것)가 제목으로 알맞습니다."], "ch": [{"n": "①", "t": "Family Stories Disclose a Couple’s True Faces", "g": "가족 이야기는 남녀 커플의 진정한 면모를 드러낸다", "ok": false, "e": ["(3)·(4)에서 가족 이야기는 선택되고 편집된다고 합니다", "(10)에서는 재구성된 기억 때문에 실제 일어난 일조차 헷갈릴 수 있다고 합니다", "그러니 가족 이야기가 커플의 <b>진정한 면모<\/b>를 드러낸다는 말은 맞지 않습니다."]}, {"n": "②", "t": "Shaping a Couple: Reconstructing Family Stories", "g": "커플이 되는 것: 가족 이야기를 재구성하는 것", "ok": true, "e": ["(1)·(2)·(4)에서 커플은 서로의 가족 이야기를 털어놓고, 편집하고, 다시 해석하며 생각 체계를 만들어 갑니다", "이 내용을 잘 담은 제목입니다."]}, {"n": "③", "t": "Reconstructing the Foundation of Family Reunion", "g": "가족 재회의 기반 복원하기", "ok": false, "e": ["가족 <b>재회<\/b>(reunion)에 대한 이야기는 글에 없습니다."]}, {"n": "④", "t": "Reconstruction of Love: Recalling Parents’ Episodes", "g": "사랑의 재구성: 부모의 일화 상기하기", "ok": false, "e": ["부모의 관계는 (1)에서 비교 대상으로 한 번 나올 뿐입니다", "글의 중심은 커플이 서로의 <b>가족 이야기<\/b>를 편집하고 재구성하는 과정입니다."]}, {"n": "⑤", "t": "Beyond Couples’ Problems: Reconstructing Harmony", "g": "남녀 커플들의 문제점을 넘어서: 화합 복원하기", "ok": false, "e": ["커플의 문제를 넘어 <b>화합<\/b>을 되찾는 방법은 글에 나오지 않습니다."]}], "tr": ["한 남녀 커플이 관계를 형성하기 시작할 때, 그들은 그들 자신의 관계에 대해, 그리고 특히, 그들의 관계가 그들 부모들의 관계와 얼마나 비슷하거나 다른지에 대해 일련의 생각들을 발전시키는 것으로 보일 수 있다.", "그 남녀 커플이 처음 터놓는 이야기들은 그들이 그들과 각자의 가족들 사이에 얼마나 많은 유사점이 있는지에 대한 생각들을 형성하는 것을 포함한다.", "그들 각자가 기억하게 될 것은 선택적이고 그들 가족의 생각 체계에 의해 (a)영향을 받는다.", "결과적으로, 그들(남녀 커플)이 서로에게 그들의 이미 편집된 이야기를 하기 때문에, 그들이 서로에게서 들은 것이 그들 각자의 원래 가족의 생각 체계 내에서 다시 (b)해석되는 두 번째 편집 과정이 있을 가능성이 있다.", "그들 가족에 관해 이야기하는 사람과 이 이야기에 대한 파트너의 편집된 버전이라는 두 세트의 기억이 그 남녀 커플의 새로운 생각 체계의 ‘요리용 냄비’로 들어간다.", "그 후, 한 파트너가 (c)무작위로(→ 체계적으로) 협상에서의 전술로서 상대방 이야기의 일부분을 회상할 수도 있다. 예를 들어, Harry는 Doris에게 그녀가 ‘그저 그녀의 어머니처럼 우두머리 행세를 하고’ 있다고 말할 수도 있다.", "이것은 아마 Doris가 Harry에게 했던 말을 바탕으로 하고 있기 때문에, 매우 강력한 전술이 될 가능성이 있다.", "그녀는 저항하거나 그녀의 이야기에 대한 이러한 견해를 정정하려고 시도할 수도 있고, 그렇게 함으로써 어쩌면 Harry가 이런(상대방의 이야기를 회상하여 말하는) 방식으로 이용할 수도 있을 추가적인 자료를 덧붙인다.", "이야기에 대한 이러한 대화는(이야기를 이렇게 주고받는 것은) 반드시 그런 악의적인 방식으로 (d)이용될 필요는 없다.", "이런 재구성된 기억들은 심지어 과거에 실제로 발생했던 일의 단순한 (e)사실적인 세부 사항들에 대해서조차 각각의 배우자가 혼란스러워 할 수 있을 정도로 매우 강력해질 수 있다."], "ps": [{"n": 1, "ch": [{"e": "As a couple start to form a relationship,", "k": "한 남녀 커플이 관계를 형성하기 시작할 때,"}, {"e": "they can be seen to develop a set of <b>constructs<\/b>", "k": "그들은 일련의 생각들을 발전시키는 것으로 보일 수 있다"}, {"e": "about their own relationship", "k": "그들 자신의 관계에 대해"}, {"e": "and, in particular,", "k": "그리고 특히,"}, {"e": "how it is similar or different", "k": "그것이<span class=\"r\">(= 그들의 관계)<\/span> 얼마나 비슷하거나 다른지에 대해"}, {"e": "to their parents’ relationship.", "k": "그들 부모들의 관계와."}], "link": "한 남녀 커플이 관계를 형성하기 시작할 때, 그들은 자신들의 관계에 대해, 그리고 특히 그 관계가 부모들의 관계와 얼마나 비슷하거나 다른지에 대해 일련의 생각들을 발전시키는 것으로 보일 수 있다.", "easy": "커플이 사귀기 시작하면, 자기들 관계가 어떤지, 특히 부모님의 관계와 얼마나 비슷하거나 다른지에 대한 생각들을 만들어 가요.", "gist": "글의 시작. 커플이 관계에 대한 생각(construct)을 만들어 간다고 소개합니다."}, {"n": 2, "ch": [{"e": "The couple’s initial <b>disclosures<\/b>", "k": "그 남녀 커플이 처음 터놓는 이야기들은"}, {"e": "involve them forming constructs", "k": "그들이 생각들을 형성하는 것을 포함한다"}, {"e": "about how much <b>similarity<\/b> there is", "k": "얼마나 많은 유사점이 있는지에 대한"}, {"e": "between them and each other’s families.", "k": "그들과 각자의 가족들 사이에."}], "link": "그 커플이 처음 터놓는 이야기들은 그들과 서로의 가족들 사이에 얼마나 많은 유사점이 있는지에 대한 생각들을 형성하는 것을 포함한다.", "easy": "커플이 처음 서로에게 털어놓는 이야기를 통해, 자기들과 서로의 가족이 얼마나 비슷한지에 대한 생각이 만들어져요.  other’s story", "k": "상대방 이야기의 일부분을"}, {"e": "as a <b>tactic<\/b> in <b>negotiations<\/b>:", "k": "협상에서의 전술로서:"}, {"e": "for example, Harry may say to Doris", "k": "예를 들어, Harry는 Doris에게 말할 수도 있다"}, {"e": "that she is being ‘<b>bossy<\/b> — just like her mother’.", "k": "그녀가 ‘그저 그녀의 어머니처럼 우두머리 행세를 하고’ 있다고."}], "link": "그 후, 한 파트너가 협상에서의 전술로서 상대방 이야기의 일부분을 체계적으로 회상할 수도 있다. 예를 들어, Harry는 Doris에게 그녀가 ‘그저 그녀의 어머니처럼 우두머리 행세를 하고’ 있다고 말할 수도 있다.", "easy": "그 뒤에 한쪽이 상대가 했던 이야기 중 일부를 골라 협상할 때 무기로 쓸 수 있어요. 예를 들어 Harry가 Doris에게 ‘너 꼭 너희 엄마처럼 이래라저래라 한다’고 말하는 거예요.", "gist": "상대의 이야기를 협상 전술로 쓰는 예를 보여 줍니다."}, {"n": 7, "ch": [{"e": "Since this is probably based on", "k": "이것이<span class=\"r\">(= Harry의 말)<\/span> 아마 바탕으로 하고 있기 때문에"}, {"e": "what Doris has told Harry,", "k": "Doris가 Harry에게 했던 말을,"}, {"e": "this is likely to be a very powerful tactic.", "k": "이것은<span class=\"r\">(= Harry의 말)<\/span> 매우 강력한 전술이 될 가능성이 있다."}], "easy": "Harry의 말은 Doris가 직접 해 준 이야기를 바탕으로 한 것이라서, 아주 강력한 무기가 될 수 있어요.", "gist": "상대가 직접 한 이야기라서 전술이 강력하다고 설명합니다."}, {"n": 8, "ch": [{"e": "She may <b>protest<\/b>", "k": "그녀는 저항할 수도 있다"}, {"e": "or attempt to rewrite this version of her story,", "k": "또는 그녀의 이야기의 이러한 버전을 고쳐 쓰려고 시도할 수도 있다,"}, {"e": "<b>thereby<\/b> possibly adding further material", "k": "그렇게 함으로써 어쩌면 추가적인 자료를 덧붙이게 된다"}, {"e": "that Harry could use in this way.", "k": "Harry가 이런 방식으로 이용할 수도 있을."}], "link": "그녀는 항의하거나 자기 이야기의 이 버전을 고쳐 쓰려 할 수도 있고, 그렇게 함으로써 어쩌면 Harry가 이런 방식으로 이용할 수 있는 자료를 더 보태게 된다.", "easy": "Doris가 반박하거나 그 이야기를 고치려 하면, 오히려 Harry가 써먹을 거리를 더 주게 될 수도 있어요.", "gist": "맞서려 하면 오히려 상대에게 더 많은 재료를 준다고 덧붙입니다."}, {"n": 9, "ch": [{"e": "These exchanges of stories", "k": "이러한 이야기의 주고받음은"}, {"e": "<b>need not<\/b> always be (d) <b>employed<\/b>", "k": "반드시 늘 (d) 이용될 필요는 없다"}, {"e": "in such <b>malevolent<\/b> ways.", "k": "그런 악의적인 방식으로."}], "easy": "그렇다고 이야기를 주고받는 게 늘 이렇게 나쁜 쪽으로 쓰이는 건 아니에요.", "gist": "악의적인 사용만 있는 것은 아니라고 한발 물러섭니다."}, {"n": 10, "ch": [{"e": "These <b>reconstructed<\/b> memories", function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed){const a=arr.slice();let s=hash(seed)||1;for(let i=a.length-1;i>0;i--){s=Math.imul(s^(s>>>15),2246822519)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

쩌면 추가 자료를 더해 주면서\u0002 / \u0001Harry가 \u0001이런 식으로\u0002 이용할 수 있는\u0002.", "core": "그녀는 항의하거나 이 버전을 고쳐 쓰려 시도할 수도 있다.", "tags": ["주어 She + 동사 may protest or attempt(병렬) + 목적어 to rewrite ~. attempt to V = V하려 시도하다. of her story = 형용사구: version 꾸밈", "adding ~ = 분사구문(부사적: 결과): 앞 절을 꾸밈. thereby = 부사: adding을 꾸밈", "that절 = 관계절(형용사절, 목적격): material을 꾸밈. in this way = 전치사구(부사구): use를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V 병렬 + 분사구문</b>이다. 동사 범위를 정확히 읽어야 한다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: She (그녀)", "V1: may protest (protest 항의하다 + may ~일 수도 있다), 1형식", "V2: (may) attempt (attempt 시도하다), 3형식. or로 병렬", "O2: to rewrite this version of her story (자기 이야기의 이 버전을 고쳐 쓰려는 것). rewrite 고쳐 쓰다", "뼈대 = <b>She may protest or attempt to rewrite ~</b>"]}, {"t": "함정: or는 protest와 attempt를 잇는다. to rewrite는 attempt의 목적어일 뿐 protest와는 이어지지 않는다."}, {"t": "<b>thereby possibly adding further material</b>은 동사가 아니라 <b>분사구문(결과)</b>이다. '그렇게 함으로써 어쩌면 추가 자료를 더하면서'라는 뜻이다. 의미상 주어는 She다.", "sub": ["thereby (그렇게 함으로써), possibly (어쩌면)", "O: further material (추가 자료)"]}, {"t": "<b>that Harry could use in this way</b>는 material을 꾸미는 목적격 관계절이다.", "sub": ["S: Harry (사람 이름), V: could use (use 이용하다 + could ~할 수 있다)", "use의 목적어 자리가 비어 있다 = material", "in this way (이런 식으로) = 전치사구"]}], "sum": "그녀의 항의나 고쳐 쓰기는 오히려 Harry가 활용할 자료를 더 보태 줄 수도 있음"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2016학년도 6월 32번", "ans": "③", "tr": [["1", "우리는 더 많은 시간을 얻는 방법이 속도를 올리는 것이라고 추정하는 경향이 있다."], ["2", "그러나 속도를 올리는 것은 실제로는 우리를 늦출 수 있다."], ["3", "집에서 급히 뛰어나갔다가 결국 열쇠와 지갑이 부엌 식탁에 놓여 있는 것을 깨달아 본 사람이라면 누구나 이것을 너무나 잘 안다."], ["4", "그리고 줄어드는 것은 단지 우리의 효율성만이 아니다."], ["5", "우리가 덜 의식하게 되고 덜 '유념하게' 되면서 경험의 질도 나빠진다."], ["6", "한 끼 식사 전체를 아무 맛도 느끼지 못한 채 먹어 본 적이 있는가?"], ["7", "서두르는 것은 우리에게 더 적은 시간을 주는 데 그치지 않고, 우리가 실제로 가진 시간에서 기쁨과 이익까지 빼앗아 갈 수 있다."], ["8", "많은 사람에게 서두름은 삶의 방식이다."], ["9", "우리 중 어떤 이들은 그것이 주는 짜릿함을 즐기는 반면, 다른 이들은 끊임없는 압박에 미칠 지경이 되고 자기 삶이 받아들일 수 없는 수준까지 속도를 내고 있다고 느낀다."], ["10", "어느 쪽이든, 조금 천천히 가는 행동으로 향상될 수 있는 우리 삶의 영역이 거의 틀림없이 존재한다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "Hurrying up doesn't just give us less time, it can also steal the pleasure and benefit from the time that we do have."}, {"en": false, "h": "빈칸 문항은 <b>빈칸이 들어 있는 문장의 접속 표현</b>부터 봐야 한다. 10번 문장은 <b>Either way</b>(어느 쪽이든)로 시작하므로, 9번에서 갈라진 두 부류를 <b>한데 묶는 결론</b>이 온다. 그렇다면 빈칸에는 앞서 반복된 '<b>서두름의 폐해</b>'를 뒤집는 처방이 들어가야 한다. 2번 문장의 <b>speeding up can actually slow us down</b>, 7번 문장의 <b>steal the pleasure and benefit</b>이 그 폐해다. 따라서 '<b>조금 천천히 가는 행동으로 향상될 수 있는</b>' 영역이 있다는 ③이 자연스럽다. 나머지 선지는 모두 서두름을 <b>옹호</b>하거나 글에 없는 개념을 끌어온다."}], "opts": [{"n": "①", "t": "affected by temporary sufferings (일시적인 고통에 의해 영향을 받을)", "a": false, "x": true, "trap": false, "e": "고통이 <b>일시적</b>이라는 언급이 없다. 오히려 9번 문장은 <b>constant pressure</b>, 즉 끊임없는 압박이라고 했다."}, {"n": "②", "t": "disturbed by inconsistent behaviors (일관성 없는 행동에 의해 방해받을)", "a": false, "x": true, "trap": false, "e": "글이 문제 삼는 것은 <b>일관성</b>이 아니라 <b>속도</b>다. inconsistent에 해당하는 근거 문장이 없다."}, {"n": "③", "t": "enhanced by a little go-slow behavior (조금 천천히 가는 행동으로 향상될)", "a": true, "x": false, "trap": false, "e": "2번 문장의 <b>speeding up can actually slow us down</b>을 뒤집으면 그대로 나오는 결론이다. 서두름이 빼앗은 것을 되찾는 방법이 '<b>조금 천천히</b>'다."}, {"n": "④", "t": "complicated by slow-but-steady actions (느리지만 꾸준한 행동으로 복잡해질)", "a": false, "x": true, "trap": true, "e": "'느림'이라는 단어가 겹쳐 그럴듯하지만, 글은 느림을 <b>해법</b>으로 제시한다. complicated(복잡해진다)는 정반대 평가다."}, {"n": "⑤", "t": "dominated by a little speedy decision making (조금 빠른 의사 결정에 의해 지배될)", "a": false, "x": true, "trap": false, "e": "글 전체가 <b>speed up</b>의 부작용을 말하는데 빠른 의사 결정을 권할 리 없다. 방향이 정면으로 반대다."}], "w": [["tend to V", "~하는 경향이 있다"], ["assume", "추정하다, 가정하다"], ["rush out of", "~에서 급히 뛰어나가다"], ["only to V", "(~했으나) 결국 ~하게 되다"], ["efficiency", "효율성"], ["mindful", "유념하는, 마음에 두는"], ["steal", "훔치다, 빼앗다"], ["thrill", "전율, 짜릿함"], ["constant", "끊임없는, 지속적인"], ["unacceptable", "받아들일 수 없는"], ["either way", "어느 쪽이든"], ["enhance", "향상시키다, 높이다"]]}, {"q": "08", "type": "빈칸 추론", "src": "2023년 3월 34번", "ans": "①", "tr": [["1", "『각색 이론』에서 Linda Hutcheon은 이렇게 주장한다. \"각색 작품은 흡혈귀 같지 않다. 즉 그것은 원전으로부터 생명의 피를 빨아내어 원전을 죽어 가게 하거나 죽은 채로 내버려 두지 않으며, 각색된 작품보다 더 창백하지도 않다.\""], ["2", "오히려 그것은 그 이전 작품을 살아 있게 유지해, 그 작품이 결코 갖지 못했을 사후의 삶을 그것에 줄 수도 있다."], ["3", "각색을 '흡혈귀 같은 것'으로 보기를 거부하는 Hutcheon의 태도는 실제로 각색 작업을 하는 우리 같은 사람들에게 특히 고무적이다."], ["4", "텍스트의 '사후의 삶'이라는 발상, 즉 이전에 있던 것을 지금 오는 것의 영감으로 본다는 발상은 그 본질상 작품을 '살아 있게' 유지하는 일이다."], ["5", "특히 청소년을 위한 각색 작품은 청소년 독자를 그때와 지금, 과거와 현재 모두에 관여시킨다는 이점을 더 가지는데, 이는 역사에 대한 '기념비'인 동시에 독자가 살아온 경험의 '살'로 기능한다는 뜻이다."], ["6", "이것은 각색 작품 전반에 해당하는 말이지만, 청소년을 염두에 두고 쓰인 작품에는 특히 중요하다."], ["7", "그런 각색 작품은 어린 독자들이, 그렇지 않았다면 구식이거나 자신과 무관하다는 인상을 주었을 텍스트와 개인적인 관계를 맺도록 해 준다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Adaptations for young adults, in particular, have the added benefit of engaging the young adult reader with both then and now, past and present."}, {"en": false, "h": "빈칸이 <b>마지막 문장</b>에 있을 때는 앞 문장들이 쌓아 온 흐름의 <b>도착점</b>을 찾으면 된다. 3번 문장은 각색이 원전을 <b>살아 있게</b> 한다고 했고, 5번 문장은 청소년 독자를 <b>과거와 현재 모두에 관여시킨다</b>는 이점을 덧붙였다. 그리고 빈칸 문장 끝의 <b>that might otherwise come across as old-fashioned or irrelevant</b>가 결정적이다. '<b>그렇지 않았다면</b> 낡고 무관하게 느껴졌을' 텍스트라면, 각색이 하는 일은 그 텍스트를 어린 독자에게 <b>가깝게</b> 만들어 주는 것이다. 그러므로 <b>개인적인 관계를 맺도록 해 준다</b>는 ①이 맞다."}], "opts": [{"n": "①", "t": "allow young readers to make personal connections with texts (어린 독자들이 텍스트와 개인적인 관계를 맺도록 해 준다)", "a": true, "x": false, "trap": false, "e": "빈칸 뒤의 <b>otherwise ~ old-fashioned or irrelevant</b>와 정확히 맞물린다. 무관하게 느껴졌을 작품을 <b>자기 일</b>로 만들어 준다는 뜻이다."}, {"n": "②", "t": "are nothing more than the combination of different styles (서로 다른 스타일의 조합에 지나지 않는다)", "a": false, "x": true, "trap": false, "e": "<b>nothing more than</b>은 '~에 불과하다'는 <b>깎아내리는</b> 표현이다. 글은 각색의 가치를 <b>높이는</b> 쪽이므로 방향이 반대다."}, {"n": "③", "t": "break familiar patterns of the ancient heroic stories (고대 영웅 이야기의 익숙한 양식을 깨뜨린다)", "a": false, "x": true, "trap": false, "e": "고대 영웅담이라는 특정 장르가 글에 등장하지 않는다. 텍스트를 <b>깨는</b> 것이 아니라 <b>살리는</b> 것이 글의 주장이다."}, {"n": "④", "t": "give a new spotlight to various literary theories (다양한 문학 이론에 새로운 주목을 준다)", "a": false, "x": true, "trap": true, "e": "살아나는 대상은 <b>이론</b>이 아니라 <b>작품</b>이다. 1번 문장의 A Theory of Adaptation이라는 책 제목만 보고 고르면 걸린다."}, {"n": "⑤", "t": "encourage young writers to make plots original (젊은 작가들이 줄거리를 독창적으로 만들도록 장려한다)", "a": false, "x": true, "trap": false, "e": "글의 주인공은 <b>독자</b>(young adult reader)이지 젊은 작가가 아니다. 대상이 바뀐 선지다."}], "w": [["adaptation", "각색 (작품), 적응"], ["vampiric", "흡혈귀와 같은"], ["life-blood", "생명의 피, 혈액"], ["pale", "창백한, 미약한"], ["afterlife", "사후의 삶, 내세"], ["refusal", "거부, 거절"], ["by its very definition", "본질상, 정의상"], ["engage A with B", "A를 B에 관여시키다"], ["function as", "~로 기능하다"], ["in general", "전반적으로, 대개"], ["come across as", "~라는 인상을 주다"], ["irrelevant", "무관한, 관계가 없는"]]}, {"q": "09", "type": "문장 삽입", "src": "2016년 10월 39번", "ans": "③", "tr": [["1", "권리, 특히 인권은 두 가지 넓은 범주, 즉 소극적 권리와 적극적 권리로 나눌 수 있다."], ["2", "소극적 권리는 외부의 방해로부터 자유로워지는 데 있어 인간이 가지는 필수적인 이익을 나타낸다."], ["3", "언론, 집회, 종교의 자유 등 권리 장전에 보장된 권리들은 이 범주에 속하며, 상해를 입지 않을 권리와 사생활의 권리도 마찬가지다."], ["4", "이러한 권리와 짝을 이루는 것은 이런 이익과 활동을 추구하는 남을 방해하지 않을, 우리 모두가 지는 의무이다."], ["5", "(주어진 문장) 적극적 권리는 인간이 특정한 혜택을 받는 데 있어 가지는 필수적인 이익을 나타낸다."], ["6", "그것은 남들이 우리에게 특정한 재화, 서비스, 기회를 제공하게 하는 권리이다."], ["7", "오늘날 적극적 권리는 흔히 교육, 의료, 균등한 취업 기회, 비슷한 수준의 보수 등에 대한 권리를 포함하는 것으로 여겨진다."], ["8", "이러한 권리와 짝을 이루는 것은 개인이 이런 이익을 추구하도록 적절한 당사자가 도와야 하는 적극적 의무이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "They are rights to have others provide us with certain goods, services, or opportunities."}, {"en": false, "h": "문장 삽입은 <b>대명사와 지시어가 가리킬 대상이 있는가</b>로 자리를 정한다. ③ 바로 뒤 문장이 <b>They are rights to ~</b>로 시작하는데, ③ 앞까지는 <b>소극적 권리</b> 이야기뿐이라 They가 가리킬 <b>적극적 권리</b>가 아직 등장하지 않는다. 주어진 문장 <b>Positive rights reflect the vital interests ~</b>를 ③에 넣으면 They가 곧바로 <b>Positive rights</b>를 받아 자연스러워진다. 또 1번 문장이 negative rights와 positive rights <b>둘</b>을 예고했는데 ③ 앞까지 negative만 설명되었다는 점, 주어진 문장이 2번 문장과 <b>reflect the vital interests</b>로 짝을 이루는 점도 결정적 근거다."}], "opts": [{"n": "①", "t": "Negative rights reflect ~ 바로 뒤", "a": false, "x": true, "trap": false, "e": "소극적 권리를 정의한 문장 <b>직후</b>다. 여기에 적극적 권리 정의를 끼우면 뒤이어 나오는 <b>The rights guaranteed in the Bill of Rights ~ fall within this category</b>의 this category가 가리킬 대상이 어긋난다."}, {"n": "②", "t": "~ freedom from injury and to privacy 뒤", "a": false, "x": true, "trap": false, "e": "바로 뒤 문장의 <b>Correlating with these</b>에서 these는 앞의 <b>소극적 권리들</b>을 받는다. 사이에 다른 권리 정의가 끼어들면 these의 지시가 흐려진다."}, {"n": "③", "t": "~ others' pursuit of these interests and activities 뒤", "a": true, "x": false, "trap": false, "e": "뒤 문장의 <b>They</b>가 받을 명사가 필요한 자리다. 주어진 문장을 넣으면 They = <b>Positive rights</b>로 딱 맞고, 소극적 권리 설명이 끝난 뒤 적극적 권리로 넘어가는 흐름도 자연스럽다."}, {"n": "④", "t": "They are rights to have others provide us ~ 뒤", "a": false, "x": true, "trap": true, "e": "They의 정체를 밝혀 주는 문장이 They <b>뒤에</b> 오게 되어 순서가 거꾸로다. 지시어는 항상 <b>앞</b>에서 받는다."}, {"n": "⑤", "t": "~ comparable pay, and so on 뒤", "a": false, "x": true, "trap": false, "e": "이미 6·7번 문장에서 적극적 권리를 한참 설명한 뒤다. 여기서 정의를 새삼 꺼내면 뒤늦은 정의가 되어 흐름이 끊긴다."}], "w": [["vital", "필수적인, 아주 중요한"], ["interference", "방해, 간섭"], ["guarantee", "보장하다"], ["assembly", "집회, 의회"], ["fall within", "~에 속하다"], ["correlate with", "~와 상호 관련이 있다"], ["interfere with", "~을 방해하다"], ["pursuit", "추구"], ["be taken to V", "~하는 것으로 여겨지다"], ["comparable", "비슷한, 비교할 만한"], ["appropriate", "적절한, 적당한"], ["assist", "돕다"]]}, {"q": "10", "type": "요약문 완성", "src": "2018년 4월 40번", "ans": "①", "tr": [["1", "2006년에 Missouri 대학의 연구자들은 28명의 학부생을 데려와, 단어 목록을 외운 뒤 나중에 그 단어들을 기억해 내도록 요청했다."], ["2", "집중을 방해하는 것이 암기 능력에 영향을 미치는지 알아보기 위해, 연구자들은 학생들에게 동시에 수행할 과제를 하나 더 주었다. 컴퓨터 자판을 눌러 색깔에 따라 일련의 글자를 순서대로 배열하는 일이었다."], ["3", "이 과제는 학생들이 단어 목록을 외우고 있을 때와 연구자들에게 그 목록을 기억해 내고 있을 때라는 두 가지 조건에서 주어졌다."], ["4", "Missouri의 과학자들은 동시에 진행되는 과제가 암기와 회상 모두에 영향을 미친다는 것을 발견했다."], ["5", "학생들이 이전에 외운 단어를 기억해 내려 할 때 자판 과제가 주어지자, 수행 능력이 9~26퍼센트 떨어졌다."], ["6", "동시 과제가 암기 도중에 일어나면 하락 폭은 더 컸는데, 그 경우 수행 능력은 46~59퍼센트나 떨어졌다."], ["7", "(요약문) 학부생 참가자들에게 그들을 (A)산만하게 만들 동시 과제를 수행하도록 요청했을 때, 그들은 단어를 외우고 기억해 내는 능력에서 (B)감소를 보였다."]], "evh": "2번 문장", "ev": [{"en": true, "h": "To test whether distraction affected their ability to memorize, the researchers asked the students to perform a simultaneous task."}, {"en": false, "h": "요약문 완성은 <b>요약문의 빈칸 자리에 대응하는 원문 단어</b>를 하나씩 짚어 가면 된다. (A) 자리는 '동시 과제가 학생들을 어떻게 만드는가'인데, 2번 문장에 <b>distraction</b>(집중을 방해하는 것)이라는 실험 목적이 그대로 나온다. 형용사로 바꾸면 <b>distracted</b>다. (B) 자리는 그 결과인데, 5번 문장의 <b>a 9 to 26 percent decline in their performance</b>와 6번 문장의 <b>decreased by 46 to 59 percent</b>가 모두 <b>하락</b>을 말한다. 명사로 바꾸면 <b>reduction</b>이다. 따라서 distracted – reduction 조합인 ①이 답이다."}], "opts": [{"n": "①", "t": "distracted …… reduction (산만하게 …… 감소)", "a": true, "x": false, "trap": false, "e": "(A)는 2번 문장의 <b>distraction</b>을, (B)는 5·6번 문장의 <b>decline·decreased</b>를 각각 형태만 바꾼 말이다. 원문 대응이 완벽하다."}, {"n": "②", "t": "distracted …… improvement (산만하게 …… 향상)", "a": false, "x": true, "trap": true, "e": "(A)는 맞지만 (B)가 정반대다. 5·6번 문장의 수치는 모두 <b>떨어졌다</b>고 말한다."}, {"n": "③", "t": "focused …… decline (집중하게 …… 하락)", "a": false, "x": true, "trap": false, "e": "동시 과제는 집중을 <b>흩뜨리는</b> 장치다. focused는 실험 설계 자체를 뒤집는다."}, {"n": "④", "t": "challenged …… increase (어려움을 겪게 …… 증가)", "a": false, "x": true, "trap": false, "e": "수행 능력은 증가한 것이 아니라 <b>46~59퍼센트</b>까지 떨어졌다. (B)가 사실과 반대다."}, {"n": "⑤", "t": "challenged …… stability (어려움을 겪게 …… 안정)", "a": false, "x": true, "trap": false, "e": "안정(stability)은 변화가 없다는 뜻인데, 실험 결과는 뚜렷한 <b>하락</b>이었다."}], "w": [["undergraduate", "학부생"], ["memorize", "외우다, 암기하다"], ["recall", "기억해 내다, 상기하다"], ["distraction", "집중을 방해하는 것"], ["simultaneous", "동시의, 동시에 일어나는"], ["a series of", "일련의"], ["concurrent", "동시에 일어나는"], ["decline", "하락, 감소"], ["performance", "수행 능력, 성과"], ["in which case", "그런 경우에"], ["reduction", "감소, 축소"], ["stability", "안정(성)"]]}, {"q": "11", "type": "장문 · 제목", "src": "2019학년도 9월 41번", "ans": "②", "tr": [["1", "한 남녀 커플이 관계를 맺기 시작할 때, 그들은 자신들의 관계에 대해, 특히 그 관계가 부모의 관계와 얼마나 비슷하   let h='<header><div class="wrap"><div class="row1"><h1>'+esc(TITLE)+'</h1><a class="link" href="index.html">목록</a></div></div></header><div class="wrap hcards">';
  cards.forEach(c=>{
    h+='<button class="hcard" data-v="'+c[0]+'" '+(c[5]?'disabled':'')+'><span class="bn">'+c[1]+'</span><span class="tx"><b>'+c[2]+'</b><small>'+c[3]+'</small></span>'+(c[4]?'<span class="chip '+c[4][0]+'">'+c[4][1]+'</span>':'')+'</button>';
  });
  h+='</div>';
  app.innerHTML=h;
}
function sHtmlP(s){
  let x='<div class="s"><div class="sn"><span class="lb">문장 '+s.n+'</span></div>';
  s.ch.forEach(c=>{x+='<div class="ch"><div class="ce">'+String(c.e).replace(/<\/?b>/g,'')+'</div><div class="ck">'+c.k+'</div></div>';});
  const lays=[];
  if(s.link)lays.push(['이어 읽으면',s.link]);
  if(s.easy)lays.push(['쉬운 말로',s.easy]);
  if(s.gist)lays.push(['결국 이 얘기',s.gist]);
  lays.forEach(l=>{x+='<div class="lay"><span class="lb">'+l[0]+'</span>'+l[1]+'</div>';});
  if(lays.length)x+='<button class="stg" data-names="'+lays.map(l=>l[0]).join('|')+'">'+lays[0][0]+'</button>';
  return x+'</div>';
}
function esc2(s){return String(s)}
function mdWrap(s){s=String(s);let o='',d=0,buf='',i=0;
const flush=()=>{if(buf){o+=(d===0&&/[A-Za-z0-9가-힣]/.test(buf))?'<span class="cr">'+buf+'</span>':buf;buf='';}};
while(i<s.length){const ch=s[i];
if(ch==='<'){const j=s.indexOf('>',i);buf+=s.slice(i,j+1);i=j+1;continue;}
if(ch==='\x01'){flush();if(d===0)o+='<span class="md">';o+='(';d++;i++;continue;}
if(ch==='\x02'){flush();o+=')';d--;if(d===0)o+='</span>';i++;continue;}
buf+=ch;i++;}
flush();return o;}
function chunkSplit(s){return String(s).split(' / ')}
function scHtml(c){
  const esc=String;
  const E=chunkSplit(c.pe||c.eng),K=chunkSplit(c.pk||c.lit);
  let x='<div class="sc"><div class="sc-h"><span class="no2">'+esc(c.q)+'</span><span class="at">'+esc(c.q)+'번 문제 · '+esc(c.s)+'번 문장</span><span class="tt">'+esc(c.title)+'</span><span class="chv"></span></div><div class="sc-b">';
  if(c.steps&&c.steps.length){x+='<div class="lay th"><div class="hd">이 문장 읽는 순서</div><ol>'+c.steps.map(p=>'<li>'+p.t+(p.sub||[]).map(u=>'<div class="sub">'+u+'</div>').join('')+'</li>').join('')+'</ol></div>';}
  for(let j=0;j<E.length;j++)x+='<div class="ch"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  if(c.notes.length){x+='<div class="nts">'+c.notes.map(n=>'<span class="nt"><sup>'+n[0]+'</sup> <b>'+esc(n[1])+'</b> '+esc(n[2])+'</span>').join('')+'</div>';}
  x+='<div class="lay nat"><span class="lb">자연스러운 해석</span>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm){x+='<div class="lay sum"><span class="lb">한 줄 정리</span>'+esc(sm)+'</div>';}
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px"><div class="tool"><button class="tbtn" data-all="1">전체 보이기</button><button class="tbtn" data-all="0">전체 가리기</button></div>';

/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<button class="btn pri" id="gonote">단어 오답노트 ${n}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    $('#gonote').textContent='단어 오답노트 '+noteList().length;
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
  $('#gonote').onclick=()=>{view='note';armed=null;render();};
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
