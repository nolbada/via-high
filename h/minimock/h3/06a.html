<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}

at은 imagine의 목적어절을 이끄는 <b>접속사</b>, 두 번째 that은 앞의 special glasses를 꾸미는 <b>주격 관계대명사</b>, 세 번째 that은 <b>the way</b>와 짝을 이루어 '~하는 방식대로'를 만든다. that이 나오면 <b>뒤 문장이 완전한지</b>부터 보는 것이 구분법이다. 뒤가 완전하면 접속사, 주어나 목적어가 비어 있으면 관계대명사다. <b>the power to see</b>의 to see는 power를 꾸미는 형용사적 용법이다.", "pe": "\u0001Just\u0002 imagine / that we have invented<sup>1</sup> \u0001special\u0002 glasses / \u0001that give us the power \u0001to see the \u0001odorous<sup>2</sup>\u0002 world\u0002\u0002 / \u0001the way \u0001that other organisms<sup>3</sup> perceive<sup>4</sup> it\u0002\u0002.", "pk": "\u0001그저\u0002 상상해 보라 / 우리가 \u0001특별한\u0002 안경을 발명했다고 / \u0001냄새로 가득한 세계를 볼 수 있는 힘을 우리에게 주는\u0002 / \u0001다른 생물들이 그것을 지각하는 방식대로\u0002.", "core": "우리가 안경을 발명했다고 상상해 보라.", "tags": ["명령문: 동사 imagine. Just = 부사: imagine 꾸밈", "<b>that절</b> = imagine의 목적어 (명사절). we have invented + glasses. special = 형용사: glasses 꾸밈", "<b>that절</b> = 관계절(형용사절): glasses 꾸밈. give A B (4형식). to see ~ = to부정사(형용사적): power 꾸밈", "the way ~ = 부사구(방식): see 꾸밈. that절 = 관계부사절: way 꾸밈 (뒤가 완전한 절)"], "steps": [{"t": "이 문장은 <b>명령문 + 목적어 that절</b>이다. 안에 관계절과 the way that 덩어리가 겹쳐 길어 보인다."}, {"t": "뼈대부터 찾는다. 명령문이라 주어(You)는 생략되어 있다.", "sub": ["V: imagine (상상하다)", "O: that절 (~라는 것)", "뼈대 = <b>Just imagine that ~</b>", "Just = 그냥, 한번 (부사)"]}, {"t": "that절의 뼈대는 3형식이다.", "sub": ["S: we (우리)", "V: have invented (invent 발명하다의 현재완료)", "O: special glasses (특별한 안경)", "that절 뼈대 = <b>we have invented special glasses</b>"]}, {"t": "<b>that give us the power to see the odorous world</b>는 glasses를 꾸미는 주격 관계절이다. give A B(4형식)가 쓰였다.", "sub": ["give us the power = 우리에게 능력을 주다 (us=A, the power=B)", "to see the odorous world = 냄새로 가득한 세계를 볼 수 있는 (to부정사 형용사적, power를 꾸밈). odorous 냄새가 나는"]}, {"t": "<b>the way that other organisms perceive it</b>는 see를 꾸미는 부사적 명사구이다. '다른 생물들이 그것을 지각하는 방식으로'라는 뜻이다. that은 방법의 관계부사이고 뒤가 완전한 절이다.", "sub": ["organism 생물, perceive 지각하다", "it = the odorous world (냄새로 가득한 세계)"]}], "sum": "냄새 세계를 다른 생물이 지각하는 방식대로 보게 해 주는 특수 안경을 발명했다고 상상하기"}, {"i": "05", "q": "03", "s": "3", "title": "As절 + S+V+O(3형식) + 형용사구 후치수식", "eng": "As the bright sunlight<sup>1</sup> hits our eyes, / we would encounter<sup>2</sup> a world / far different from what we would normally<sup>3</sup> expect.", "notes": [["1", "sunlight", "햇빛"], ["2", "encounter", "마주하다, 맞닥뜨리다"], ["3", "normally", "보통, 평소에"]], "lit": "밝은 햇빛이 우리 눈에 닿을 때, / 우리는 어떤 세계를 마주하게 될 것이다 / 우리가 보통 예상하는 것과는 크게 다른.", "nat": "밝은 햇빛이 눈에 들어오는 순간, 우리는 평소에 예상하던 것과는 전혀 다른 세계를 마주하게 될 것이다.", "ana": "문두의 <b>As</b>는 여기서 '~할 때'라는 <b>시간</b>의 접속사다. as는 시간·이유·비례·양태를 다 만들 수 있으므로 <b>뒤 절의 내용으로 판단</b>해야 한다. 주절의 핵심은 <b>a world</b>이고, 그 뒤의 <b>far different from ~</b>는 앞 명사를 뒤에서 꾸미는 <b>형용사구</b>다. far는 different를 강조해 '<b>훨씬, 크게</b>'라는 뜻이다. <b>what we would normally expect</b>는 '우리가 보통 예상하는 <b>것</b>'으로, 앞에 선행사가 없으므로 the thing which로 바꿔 읽을 수 있다.", "pe": "\u0001As the \u0001bright\u0002 sunlight<sup>1</sup> hits our eyes\u0002, / we would encounter<sup>2</sup> a world / \u0001far different from what we would normally<sup>3</sup> expect\u0002.", "pk": "\u0001밝은 햇빛이 우리 눈에 닿을 때\u0002, / 우리는 어떤 세계를 마주하게 될 것이다 / \u0001우리가 보통 예상하는 것과는 크게 다른\u0002.", "core": "우리는 어떤 세계를 마주하게 될 것이다.", "tags": ["<b>As절</b> = 부사절(시간): encounter 꾸밈. bright = 형용사: sunlight 꾸밈", "주어 we + 동사 would encounter + 목적어 a world (3형식)", "far different from ~ = 형용사구: a world 꾸밈. what we would normally expect = from의 목적어 명사절"], "steps": [{"t": "이 문장은 <b>As절 + S+V+O(3형식)</b>이다. 뒤에서 world를 꾸미는 형용사구가 길어 보인다."}, {"t": "주절의 뼈대부터 찾는다.", "sub": ["S: we (우리)", "V: would encounter (encounter 마주치다. would는 상상 속 가정의 결과)", "O: a world (세계)", "뼈대 = <b>we would encounter a world</b>"]}, {"t": "맨 앞 <b>As the bright sunlight hits our eyes</b>는 부사절(때)이다. '밝은 햇빛이 눈에 닿는 순간'이라는 뜻이다.", "sub": ["bright 밝은, sunlight 햇빛, hit 닿다, 부딪히다"]}, {"t": "<b>far different from what we would normally expect</b>는 형용사구 후치수식이다. a world를 뒤에서 꾸민다.", "sub": ["far different = 훨씬 다른 (far는 정도를 강조)", "from what we would normally expect = 우리가 평소에 예상하는 것과 (what절이 from의 목적어. normally 평소에, expect 예상하다)"]}], "sum": "밝은 햇빛이 눈에 닿는 순간, 평소 예상과 전혀 다른 세계를 마주함"}, {"i": "06", "q": "04", "s": "3", "title": "부정어 Rarely 도치 + S+V(1형식) + 동명사 병렬", "eng": "Rarely<sup>1</sup> do they talk / about scoring<sup>2</sup> a goal, a touchdown<sup>3</sup>, a home run, a point, / or achieving<sup>4</sup> a good shot.", "notes": [["1", "rarely", "좀처럼 ~하지 않다"], ["2", "score a goal", "골을 넣다"], ["3", "touchdown", "터치다운"], ["4", "achieve", "달성하다"]], "lit": "그들은 좀처럼 말하지 않는다 / 골, 터치다운, 홈런, 점수를 얻는 것에 대해서는, / 혹은 좋은 슛을 성공시키는 것에 대해서는.", "nat": "그들은 골이나 터치다운, 홈런, 점수를 얻는 것, 혹은 좋은 슛을 성공시키는 것에 대해서는 좀처럼 말하지 않는다.", "ana": "<b>Rarely</b>는 '좀처럼 ~않다'라는 <b>부정어</b>다. 부정어가 문장 맨 앞으로 나가면 그 뒤는 반드시 <b>의문문 어순</b>으로 뒤집힌다. 일반동사 문장이므로 <b>do they talk</b>처럼 do를 빌려 왔고, 이때 <b>진짜 주어는 they</b>다. 앞에 do가 있으니 뒤 동사는 원형 talk가 된다. 이런 문장에서는 <b>부정의 뜻을 놓치지 않는 것</b>이 가장 중요하다. 뒤의 about은 <b>scoring</b>과 <b>achieving</b> 두 동명사를 or로 묶어 함께 받는다.", "pe": "Rarely<sup>1</sup> do they talk / \u0001about scoring<sup>2</sup> a goal, a touchdown<sup>3</sup>, a home run, a point\u0002, / \u0001or achieving<sup>4</sup> a good shot\u0002.", "pk": "그들은 좀처럼 말하지 않는다 / \u0001골, 터치다운, 홈런, 점수를 얻는 것에 대해서는\u0002, / \u0001혹은 좋은 슛을 성공시키는 것에 대해서는\u0002.", "core": "그들은 좀처럼 말하지 않는다.", "tags": ["<b>Rarely 도치</b>: 부정어가 앞으로 나와 do + 주어 + 동사 어순", "주어 they + 동사 talk (1형식). about ~ = 전치사구(부사구): talk 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "or achieving ~ = about의 목적어 동명사 병렬 (위 about구에 이어짐)"], "steps": [{"t": "이 문장은 <b>Rarely가 앞에 나온 도치 문장(1형식)</b>이다. do가 주어 앞으로 나와서 낯설다."}, {"t": "뼈대부터 찾는다. 원래 어순으로 돌려 본다.", "sub": ["원래 어순: They rarely talk about ~", "S: they (그들)", "V: do talk (talk 말하다. do는 도치로 앞에 나온 조동사)", "뼈대 = <b>they do talk</b> (Rarely는 '좀처럼 ~않다')"]}, {"t": "<b>about scoring ~, or achieving a good shot</b>는 talk와 짝인 전치사구이다. 필수에 가까운 부사구이다. 전치사 about 뒤에 동명사가 병렬이다.", "sub": ["scoring a goal, a touchdown, a home run, a point = 골, 터치다운, 홈런, 점수를 얻는 것 (score 득점하다)", "or achieving a good shot = 혹은 좋은 슛을 성공시키는 것 (achieve 이루다, shot 슛)"]}, {"t": "함정: Rarely는 부정어라서 뒤가 do+주어+동사 순서로 바뀐다. 해석에서도 '좀처럼 ~않다'로 부정이다."}], "sum": "그들은 득점이나 좋은 슛 성공에 대해서는 좀처럼 말하지 않음"}, {"i": "07", "q": "05", "s": "3", "title": "S+V+C(2형식) too ~ to V + 양보 even though절", "eng": "For a time, however, / recorded music was too scratchy<sup>1</sup> to pose<sup>2</sup> a serious threat, / even though it played in commercial<sup>3</sup> places / and offered a few performers a way to supplement<sup>4</sup> their income<sup>5</sup>.", "notes": [["1", "scratchy", "지직거리는"], ["2", "pose a threat", "위협을 제기하다"], ["3", "commercial", "상업의"], ["4", "supplement", "보충하다"], ["5", "income", "수입"]], "lit": "그러나 한동안, / 녹음된 음악은 너무 지직거려서 심각한 위협을 제기하지 못했다, / 비록 그것이 상업 시설에서 재생되고 / 몇몇 연주자들에게 수입을 보충할 방법을 제공하기는 했지만.", "nat": "그러나 한동안 녹음 음악은 음질이 너무 지직거려서 심각한 위협이 되지 못했다. 상업 시설에서 틀어졌고 일부 연주자에게는 수입을 보충할 길을 열어 주기도 했지만 말이다.", "ana": "<b>too ~ to V</b>는 '너무 ~해서 …할 수 없다'로, 형태에는 부정어가 없는데 뜻은 <b>부정</b>이다. too scratchy to pose를 '위협을 제기하기에 너무 지직거렸다' → '<b>지직거려서 위협이 되지 못했다</b>'로 뒤집어 읽는다. <b>even though</b>는 '비록 ~일지라도'라는 양보로, 뒤에 완전한 문장이 온다. 그 안에서 <b>played</b>와 <b>offered</b>가 and로 묶인 <b>병렬</b>이며, offered는 <b>offer A B</b>(A에게 B를 주다) 4형식이다. a way와 to supplement 사이는 '보충할 방법'으로 붙여 읽는다.", "pe": "\u0001For a time\u0002, \u0001however\u0002, / \u0001recorded\u0002 music was \u0001too\u0002 scratchy<sup>1</sup> \u0001to pose<sup>2</sup> a \u0001serious\u0002 threat\u0002, / \u0001even though it played in commercial<sup>3</sup> places\u0002 / \u0001and offered a few performers a way \u0001to supplement<sup>4</sup> their income<sup>5</sup>\u0002\u0002.", "pk": "\u0001그러나\u0002 \u0001한동안\u0002, / \u0001녹음된\u0002 음악은 \u0001너무\u0002 지직거려서 \u0001심각한 위협을 제기하지 못했다\u0002, / \u0001비록 그것이 상업 시설에서 재생되고\u0002 / \u0001몇몇 연주자들에게 수입을 보충할 방법을 제공하기는 했지만\u0002.", "core": "음악은 지직거렸다.", "tags": ["For a time, however = 삽입 부사(구): 주절 꾸밈", "주어 music + 동사 was + 보어 scratchy (SVC). recorded = 형용사. too = 부사: scratchy 꾸밈. <b>too ~ to V</b> = to부정사(부사적: 정도 '~하기엔 너무')", "<b>even though절</b> = 양보 부사절: 앞 내용 꾸밈", "and offered = 위 양보절의 병렬 동사. offer A B (4형식). to supplement = to부정사(형용사적): way 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. too ~ to 구문과 even though절이 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: recorded music (녹음된 음악)", "V: was (be동사)", "C: too scratchy (너무 지직거리는)", "뼈대 = <b>recorded music was too scratchy</b>", "For a time, however = 그러나 한동안은 (부사구)"]}, {"t": "<b>to pose a serious threat</b>는 too ~ to V 구문의 to부정사이다. '심각한 위협이 되기에는 너무 ~한'이라는 뜻이다. (pose 제기하다, serious 심각한, threat 위협, scratchy 지직거리는)"}, {"t": "<b>even though it played in commercial places</b>는 양보 부사절이다. it은 recorded music이다.", "sub": ["play 재생되다의 과거형 played, commercial 상업적인"]}, {"t": "<b>and offered a few performers a way to supplement their income</b>은 양보절 안에서 played와 병렬되는 동사이다. offer A B(4형식)이다.", "sub": ["offered = offer 제공하다의 과거형. offered a few performers a way = 몇몇 연주자에게 방법을 제공했다 (A=performers, B=a way)", "to supplement their income = 수입을 보충할 (to부정사 형용사적, way를 꾸밈). supplement 보충하다, income 수입"]}], "sum": "녹음 음악, 상업 시설에서 틀리고 수입에도 보탬이 됐지만 한동안은 음질 탓에 위협은 못 됨"}, {"i": "08", "q": "06", "s": "8", "title": "Because of 전치사구 + 주절 S+V+O + when/after절", "eng": "Because of this, / when someone bangs<sup>1</sup> his fist<sup>2</sup> on our car's hood<sup>3</sup> / after we have irritated<sup>4</sup> him at a crosswalk, / we take it personally<sup>5</sup>.", "notes": [["1", "bang", "세게 치다"], ["2", "fist", "주먹"], ["3", "hood", "(자동차의) 보닛"], ["4", "irritate", "짜증나게 하다"], ["5", "take it personally", "개인적인 일로 받아들이다"]], "lit": "이것 때문에, / 누군가가 우리 차의 보닛을 주먹으로 내리칠 때 / 우리가 횡단보도에서 그를 짜증나게 한 뒤에, / 우리는 그것을 개인적인 일로 받아들인다.", "nat": "그렇기 때문에 횡단보도에서 우리가 화나게 만든 누군가가 우리 차의 보닛을 주먹으로 내리치면, 우리는 그것을 나에 대한 공격으로 받아들인다.", "ana": "<b>Because of</b>는 뒤에 <b>명사</b>가 오고, 접속사 because는 뒤에 <b>문장</b>이 온다. 여기서는 of this이므로 명사 쪽이다. 이어지는 <b>when절</b>과 <b>after절</b>이 연달아 나오면서 주절이 한참 뒤로 밀리는데, 이 문장의 <b>주절은 마지막의 we take it personally</b> 하나뿐이다. 부사절이 두 개 겹칠 때는 <b>콤마 뒤 주어+동사</b>를 먼저 찾는 습관이 필요하다. <b>have irritated</b>는 보닛을 치기 <b>이전에</b> 벌어진 일이라 완료 시제로 시간 차를 표시한 것이고, <b>take it personally</b>는 '그것을 개인적인 일로 받아들이다'라는 관용 표현이다.", "pe": "\u0001Because of this\u0002, / \u0001when someone bangs<sup>1</sup> his fist<sup>2</sup> \u0001on our car's hood<sup>3</sup>\u0002\u0002 / \u0001after we have irritated<sup>4</sup> him \u0001at a crosswalk\u0002\u0002, / we take it \u0001personally<sup>5</sup>\u0002.", "pk": "\u0001이것 때문에\u0002, / \u0001누군가가 우리 차의 보닛을 주먹으로 내리칠 때\u0002 / \u0001우리가 횡단보도에서 그를 짜증나게 한 뒤에\u0002, / 우리는 그것을 \u0001개인적인 일로\u0002 받아들인다.", "core": "우리는 그것을 받아들인다.", "tags": ["Because of + 명사 = 전치사구(부사구, 이유): 주절 꾸밈", "<b>when절</b> = 부사절(시간): take 꾸밈. on ~ hood = 부사구: bangs 꾸밈", "<b>after절</b> = 부사절(시간): bangs 꾸밈. have irritated는 더 앞선 일", "주어 we + 동사 take + 목적어 it. personally = 부사: take 꾸밈 (take it personally 관용)"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 앞에 Because of 덩어리, when절, after절이 겹쳐 진짜 주절이 맨 끝에 있다."}, {"t": "뼈대부터 찾는다. 맨 끝에 있다.", "sub": ["S: we (우리)", "V: take (take 받아들이다)", "O: it (그것. 누군가 보닛을 치는 일)", "뼈대 = <b>we take it personally</b>", "personally = 개인적으로. take it personally는 '자기에 대한 공격으로 받아들이다'라는 뜻"]}, {"t": "맨 앞 <b>Because of this</b>는 전치사구(부사구)이다. 이유를 말한다. Because of 뒤에는 명사(this)가 온다. 절이 아니다."}, {"t": "<b>when someone bangs his fist on our car's hood</b>는 부사절(때)이다.", "sub": ["bang 쾅 치다, fist 주먹, hood 보닛"]}, {"t": "<b>after we have irritated him at a crosswalk</b>는 after절이다. 현재완료로, 앞선 일을 말한다.", "sub": ["irritate 화나게 하다. him = someone", "crosswalk 횡단보도"]}], "sum": "우리가 화나게 한 사람이 차를 쾅 치면 우리는 그것을 나에 대한 공격으로 받아들임"}], "qs": [{"q": "01", "type": "필자 주장", "src": "2016학년도 수능 20번", "ans": "②", "tr": [["1", "자기주장을 분명히 하는 태도는 어떤 사람들에게는 상담사답지 않은 것처럼 보일지도 모른다."], ["2", "만약 여러분이 떠올리는 상담사의 모습이 결코 반대하지 않고, 늘 '맞춰 주고', 언제나 모든 것이 좋기를 바라며, 다른 사람이 원하는 것만 해 주는 사람이라면, 그것은 단호한 상담사의 모습이 아니다."], ["3", "단호하다는 것이 곧 무례하다는 뜻일 필요는 없다."], ["4", "상담사라는 것이, 누군가가 인종차별적인 농담을 할 때 그저 잠자코 있어야 한다는 뜻은 아니다."], ["5", "단호한 상담사라면 그 농담이 인종차별적이라는 사실에 그 사람의 주의를 환기시킬 방법을 찾아, 그것이 듣는 사람에게 어떻게 상처를 주었는지 설명하고, 비슷한 농담을 피할 수 있는 방법을 제안할 것이다."], ["6", "단호함은 고도로 발달한 기술이며, 상담사의 기법 목록에 잘 어울려야 마땅하다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "An assertive counselor would find a way to call that person's attention to the fact that the joke is racist, explaining how it offended the hearer, and suggesting ways similar jokes could be avoided."}, {"en": false, "h": "주장 문항은 <b>필자가 무엇을 하라고 말하는가</b>를 한 줄로 잡는다. 이 글은 1~2번 문장에서 '늘 맞춰 주기만 하는 사람'은 상담사의 상이 아니라고 못박고, 4번 문장에서 '<b>잠자코 있어야 하는 것은 아니다</b>'라고 뒤집는다. 그리고 5번 문장이 단호한 상담사의 구체적 행동, 즉 <b>문제를 짚고 설명하고 제안하는 것</b>을 그린다. 마지막 6번 문장은 그 태도가 상담사의 기법 목록에 들어가야 한다고 마무리한다. 결국 '<b>상담사도 자기 생각을 분명히 밝힐 줄 알아야 한다</b>'가 주장이다."}], "opts": [{"n": "①", "t": "상담사는 상대방의 감정을 해치는 농담을 하지 말아야 한다.", "a": false, "x": true, "trap": false, "e": "농담은 <b>상담사가 하는 것</b>이 아니라 다른 사람이 한 인종차별적 농담이다. 상담사에게 요구된 것은 농담을 삼가는 일이 아니라 <b>그 농담을 짚어 주는 일</b>이다."}, {"n": "②", "t": "상담사는 자기 생각을 분명하게 드러낼 줄도 알아야 한다.", "a": true, "x": false, "trap": false, "e": "assertive(단호한, 자기주장이 분명한)라는 핵심어를 그대로 옮긴 진술이다. 4~5번 문장의 '<b>침묵하지 말고 짚어라</b>'와 정확히 맞는다."}, {"n": "③", "t": "상담사는 항상 친절한 태도로 상담을 진행해야 한다.", "a": false, "x": true, "trap": true, "e": "글이 <b>비판하는 상</b>에 가깝다. 2번 문장의 '늘 좋기만을 바라는 사람'은 단호한 상담사가 아니라고 했다."}, {"n": "④", "t": "상담사는 정기적으로 상담 기술 교육을 받아야 한다.", "a": false, "x": true, "trap": false, "e": "skill, technique 같은 단어는 나오지만 <b>교육이나 훈련</b>은 어디에도 없다. 단어만 겹치는 선지다."}, {"n": "⑤", "t": "상담사는 상담 기록을 철저히 관리해야 한다.", "a": false, "x": true, "trap": false, "e": "기록(record)은 글에 등장하지 않는다."}], "w": [["assertiveness", "단호함, 자기주장"], ["uncharacteristic of", "~답지 않은"], ["counselor", "상담사"], ["go along", "맞춰 주다, 동조하다"], ["assertive", "단호한, 자기주장이 분명한"], ["disagreeable", "무례한, 무뚝뚝한"], ["racist", "인종차별적인"], ["call one's attention to", "~에 주의를 환기시키다"], ["offend", "감정을 상하게 하다"], ["hearer", "듣는 사람"], ["repertoire", "목록, 레퍼토리"], ["fit", "어울리다, 들어맞다"]]}, {"q": "02", "type": "심경 변화", "src": "2021학년도 6월 19번", "ans": "②", "tr": [["1", "Sharon은 친구에게서 곧 있을 탱고 콘서트 표를 받았다."], ["2", "인터넷을 검색하던 중 그녀는 그 콘서트에 관한 후기를 우연히 보게 되었다."], ["3", "그 평론가는 혹독했고, 그것을 '형편없는 공연'이라고 불렀다."], ["4", "그것은 갈 만한 가치가 있는지에 대한 의문을 Sharon의 마음속에 불러일으켰지만, 결국 그녀는 마지못해 콘서트에 참석하기로 했다."], ["5", "구시가지에 있는 그 공연장은 아주 오래되고 낡아 있었다."], ["6", "주위를 둘러보며 Sharon은 어떤 공연을 기대할 수 있을지 또다시 의구심을 품었다."], ["7", "그러나 탱고가 시작되자마자 모든 것이 달라졌다."], ["8", "피아노, 기타, 플루트, 바이올린이 마법처럼 조화를 이루며 날아올랐다."], ["9", "관객은 환호했다."], ["10", "\"세상에! 정말 환상적인 음악이야!\" Sharon은 소리쳤다."], ["11", "리듬과 박자가 너무나 활기차고 굉장해서 그녀의 몸과 영혼을 뒤흔들었다."], ["12", "그 콘서트는 그녀의 기대를 훨씬 뛰어넘었다."]], "evh": "7번 문장", "ev": [{"en": true, "h": "But as soon as the tango started, everything changed."}, {"en": false, "h": "심경 변화 문항은 <b>감정이 뒤집히는 지점</b>을 찾는 것이 전부다. 이 글의 경첩은 7번 문장의 <b>But ~ everything changed</b>다. 그 앞(2~6번)에는 harsh, awful, whether it was worthwhile, reluctantly, run-down, wondered가 줄지어 나온다 — 전부 '<b>가도 될까?</b>'라는 의심이다. 그 뒤(8~12번)에는 magically, cheered, fantastic, sensational, far beyond her expectations가 이어진다 — 전부 <b>놀라움과 감탄</b>이다. 따라서 doubtful → amazed."}], "opts": [{"n": "①", "t": "신이 난 → 지루해하는", "a": false, "x": true, "trap": false, "e": "시작부터 신나 있지 않았다. 2~6번 문장은 오히려 <b>가기 싫어하는</b> 마음이고, 마지막은 지루함이 아니라 감탄이다. 앞뒤가 <b>둘 다 반대</b>다."}, {"n": "②", "t": "의심스러운 → 놀란", "a": true, "x": false, "trap": false, "e": "reluctantly decided(마지못해 결정)와 again wondered(또다시 의구심)가 앞을, far beyond her expectations(기대를 훨씬 넘어섬)가 뒤를 확정한다."}, {"n": "③", "t": "차분한 → 화가 난", "a": false, "x": true, "trap": false, "e": "공연장이 낡았다는 5번 문장을 '불만'으로 읽으면 화가 난 쪽으로 기울 수 있지만, 마지막 문장이 <b>극찬</b>이므로 뒤가 성립하지 않는다."}, {"n": "④", "t": "부끄러운 → 감사하는", "a": false, "x": true, "trap": true, "e": "부끄러움을 나타내는 단어가 하나도 없다. 뒤의 '감사하는'만 감탄과 얼추 비슷해 보인다."}, {"n": "⑤", "t": "부러워하는 → 무관심한", "a": false, "x": true, "trap": false, "e": "부러움도 무관심도 글에 없다. 오히려 마지막은 <b>가장 뜨거운 몰입</b>이다."}], "w": [["upcoming", "다가오는, 곧 있을"], ["come across", "우연히 발견하다"], ["harsh", "가혹한, 혹독한"], ["awful", "끔찍한, 형편없는"], ["worthwhile", "가치 있는"], ["reluctantly", "마지못해"], ["ancient", "아주 오래된"], ["run-down", "황폐한, 쇠락한"], ["in harmony", "조화롭게"], ["sensational", "굉장한, 놀라운"], ["beyond", "~을 넘어서는"], ["expectation", "기대"]]}, {"q": "03", "type": "요지", "src": "2022년 3월 22번", "ans": "②", "tr": [["1", "다른 생물들이 지각하는 방식 그대로 냄새로 가득한 세계를 볼 수 있게 해 주는 특별한 안경을 우리가 발명했다고 한번 상상해 보라."], ["2", "그 안경을 쓰고 잠시 밖으로 나가 걸어 보라."], ["3", "밝은 햇빛이 눈에 들어오는 순간, 우리는 평소에 예상하던 것과는 전혀 다른 세계를 마주하게 될 것이다."], ["4", "공기는 산들바람에 실려 온 분자들로 가득하다."], ["5", "화학 신호가 우리 눈으로 밀려들 것이다, 칵테일파티에서 소리가 우리 귀를 압도하는 것만큼이나 확실하게."], ["6", "어떤 식물이든 응시해 보라, 그러면 잎과 나무껍질과 뿌리에서 화합물이 공기 중으로 방출되고 있는 것이 보일 것이다."], ["7", "나무 위의 다람쥐는 숨을 쉴 때마다 이산화탄소와 다른 화합물을 내뿜는다."], ["8", "그 갈색 몸을 훑어보라, 그러면 특정한 지점(냄새샘)들이 화학 신호를 천천히 방출하고 있는 것처럼 보인다는 것을 알아차리게 된다."], ["9", "이 신호들을 언어로 옮길 수 있다면, 우리는 가로채여 해석되기를 기다리는 구절, 문장, 진술, 노래, 그 밖의 메시지들을 보게 될 것이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Chemical signals would flood our eyes just as surely as sounds overwhelm our ears at a cocktail party."}, {"en": false, "h": "요지 문항은 <b>비유가 무엇을 대신하는가</b>를 되돌려 놓으면 풀린다. 이 글의 '특별한 안경'은 <b>인간이 못 보는 것을 보게 해 주는 장치</b>다. 그 안경으로 보이는 것이 무엇인지 5번 문장이 못박는다 — 소리가 귀를 채우는 것만큼이나 <b>화학 신호가 세상에 가득하다</b>는 것이다. 6~8번 문장은 식물과 다람쥐를 예로 들어 같은 말을 반복하고, 9번 문장은 그 신호가 사실은 <b>읽히기를 기다리는 언어</b>라고 마무리한다. 즉 세상은 우리가 지각하지 못하는 화학 신호로 가득 차 있다."}], "opts": [{"n": "①", "t": "인간이 보지 못하는 것을 볼 수 있는 유기체가 매우 많다.", "a": false, "x": true, "trap": true, "e": "글의 초점은 <b>다른 생물의 능력</b>이 아니라 <b>세상에 존재하는 신호</b> 쪽이다. 다른 생물은 그 신호를 보여 주기 위한 장치로만 쓰였다."}, {"n": "②", "t": "세상은 인간이 지각하지 못하는 화학 신호로 가득 차 있다.", "a": true, "x": false, "trap": false, "e": "4번 문장의 full of molecules, 5번의 flood our eyes, 9번의 messages waiting을 하나로 묶은 진술이다."}, {"n": "③", "t": "동물과 식물의 감각 기관은 외부 자극에 일정하게 반응한다.", "a": false, "x": true, "trap": false, "e": "감각 기관의 <b>반응</b>을 다루지 않는다. 글이 말하는 것은 그들이 <b>내보내는</b> 신호다."}, {"n": "④", "t": "동물과 식물은 화학 물질의 발산을 통해 스스로를 보호한다.", "a": false, "x": true, "trap": false, "e": "방출은 나오지만 <b>방어</b>라는 목적은 어디에도 없다. 목적을 임의로 덧붙인 선지다."}, {"n": "⑤", "t": "시각적 인식이 다른 모든 감각에 의한 인식보다 더 우선한다.", "a": false, "x": true, "trap": false, "e": "시각을 <b>우위</b>에 두는 글이 아니다. 오히려 시각으로는 놓치는 세계가 있다는 이야기다."}], "w": [["odorous", "냄새로 가득한"], ["organism", "유기체, 생물"], ["perceive", "지각하다"], ["encounter", "마주   for(let j=0;j<E.length;j++)x+='<div class="ch open"><div class="ce">'+mdWrap(E[j])+'</div><div class="ck">'+mdWrap(K[j]||'')+'</div></div>';
  x+='<div class="fin n1"><b>자연스러운 해석</b>'+esc(c.nat)+'</div>';
  const sm=c.sum||c.core;
  if(sm)x+='<div class="fin n2"><b>한 줄 정리</b>'+esc(sm)+'</div>';
  x+='</div></div>';
  return x;
}
function renderDk(){
  let h=hdr()+band(2)+'<div class="wrap"><div class="dkbody" style="padding:8px 0 12px">';
  CF.sn.forEach(c=>{h+=scHtml(c);});
  h+='</div></div>';
  app.innerHTML=h;
}
/* ---- 단어 확인 ---- */
function renderWord(){
  const ck=S.checks[WS.id]||{},locked=!!S.locked[WS.id],n=noteList().length;
  let h=hdr()+band(1)+`<div class="wrap ${locked?'locked':''}">`;
  WS.words.forEach((w,i)=>{
    const c=ck[i]||{};
    h+=`<div class="row"><div class="top"><span class="no">${i+1}</span><span class="word">${esc(w.w)}</span><span class="src">${esc(w.src)}번</span></div><div class="cells">`;
    h+=`<button class="cell m ${c.m?'bad':''}" data-i="${i}" data-p="m"><span class="tag">뜻</span><span>${esc(w.m)}</span></button>`;
    if(w.s)h+=`<button class="cell s ${c.s?'bad':''}" data-i="${i}" data-p="s"><span class="tag">유</span><span>${esc(w.s[0])}<span class="ko">${esc(w.s[1])}</span></span></button>`;
    if(w.a)h+=`<button class="cell a ${c.a?'bad':''}" data-i="${i}" data-p="a"><span class="tag">반</span><span>${esc(w.a[0])}<span class="ko">${esc(w.a[1])}</span></span></button>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="bar"><div class="wrap">`;
  h+=locked?`<button class="btn" disabled>확인 끝</button>`:`<button class="btn ${armed==='lock'?'arm':''}" id="lock">${armed==='lock'?'한 번 더 누르면 확인 끝':'확인 끝'}</button>`;
  h+=`<a class="btn pri" id="gonote" href="https://nolbada.github.io/via/wn/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">오답노트장 가기</a></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=b.dataset.p;
    S.checks[WS.id]=S.checks[WS.id]||{};
    const c=S.checks[WS.id][i]=S.checks[WS.id][i]||{};
    c[p]=c[p]?0:1;save();
    if(c[p]){const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0]&&x[1])WN.add([{w:x[0],m:x[1],src:'미니모고',how:'별표',ask:true}]);}
    b.classList.toggle('bad',!!c[p]);
    const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
