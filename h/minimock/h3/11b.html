(function(W){

  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}

ie: A Key to Success in a Zero-sum Game", "g": "고정된 파이: 제로섬 게임에서 성공의 열쇠", "ok": false, "e": ["글은 고정된 파이를 성공의 열쇠가 아니라 <b>허구<\/b>(mythical, 3번)이자 <b>오해<\/b>(misperception, 11번)로 봅니다."]}, {"n": "②", "t": "Fixed Pie Tells You How to Get the Biggest Salary", "g": "고정된 파이는 여러분에게 가장 많은 급여를 받는 방법을 알려 준다", "ok": false, "e": ["급여 예시(4·5번)는 급여만 보면 다른 협상거리를 놓친다는 것을 보여 줍니다", "가장 많은 급여를 받는 방법을 알려 주는 글이 아닙니다."]}, {"n": "③", "t": "Negotiators, Wake Up from the Myth of the Fixed Pie!", "g": "협상가들이여, 고정된 파이의 근거 없는 믿음에서 깨어나라!", "ok": true, "e": ["3번의 <b>mythical fixed pie<\/b>(허구의 고정된 파이)와 11번의 <b>this common misperception<\/b>(이러한 흔한 오해)이 이 제목과 이어집니다", "글 전체의 결론입니다."]}, {"n": "④", "t": "Want a Fairer Jail Sentence? Stick to the Fixed Pie", "g": "더 공정한 징역형을 원하는가? 고정된 파이를 고수하라", "ok": false, "e": ["징역형은 실험에 쓰인 소재일 뿐입니다(7·8번)", "또 고정된 파이를 고수하라는 말은 글의 주장과 반대입니다."]}, {"n": "⑤", "t": "What Alternatives Maximize Fixed-pie Effects?", "g": "어떤 대안이 고정된 파이 효과를 극대화하는가?", "ok": false, "e": ["글은 고정된 파이 효과를 키우는 방법을 다루지 않습니다", "고정된 파이라는 믿음이 오해라고 말합니다."]}], "tr": ["많은 협상가는 모든 협상이 고정된 파이를 수반한다고 가정한다.", "협상가들은 통합 협상의 기회를 자주 제로섬 상황이나 승패 교환으로 접근한다.", "허구의 고정된 파이를 믿는 사람들은 통합적인 합의와 상호 이익이 되는 절충의 가능성이 전혀 없이 당사자들의 이해관계가 대립한다고 가정하기 때문에, 그것을 찾으려는 노력을 (a) 억누른다.", "고용 협상에서 급여가 유일한 문제라고 생각하는 구직자는 고용주가 7만 달러를 제시할 때 7만 5천 달러를 요구할 수 있다.", "두 당사자가 가능성에 대해 더 깊이 논의할 때에만 그들은 이사 비용과 시작 날짜 또한 협상될 수 있다는 것을 발견하게 되는데, 이는 급여 문제의 해결을 (b) 방해할(→ 촉진할) 수 있을 것이다.", "협상을 고정된 파이 관점에서 보는 경향은 사람들이 주어진 갈등 상황의 본질을 어떻게 보는지에 따라 (c) 달라진다.", "이것은 검사와 피고측 변호사 간의 징역형에 대한 모의 협상을 포함하는 Harinck, de Dreu, Van Vianen의 기발한 실험에서 밝혀졌다.", "어떤 참가자들은 개인적 이득의 관점에서 목표를 보라고 들었고(예를 들어 특정 징역형을 정하는 것이 당신의 경력에 도움이 될 것이다), 다른 참가자들은 효과성의 관점에서 목표를 보라고 들었으며(특정 형은 상습적 범행을 방지할 가능성이 가장 크다), 또 다른 참가자들은 가치에 초점을 맞추라고 들었다(특정 징역형은 공정하고 정당하다).", "개인적 이득에 초점을 맞추는 협상가들은 고정된 파이에 대한 믿음의 영향을 받아 상황에 (d) 경쟁적으로 접근할 가능성이 가장 컸다.", "가치에 초점을 맞춘 협상가들은 문제를 고정된 파이 관점에서 볼 가능성이 가장 낮았고 상황에 협력적으로 접근하려는 경향이 더 컸다.", "시간 제약과 같은 스트레스가 많은 조건은 이러한 흔한 오해의 원인이 되며, 이것은 결국 (e) 덜 통합적인 합의로 이어질 수 있다."], "ps": [{"n": 1, "ch": [{"e": "Many <b>negotiators<\/b> <b>assume<\/b>", "k": "많은 협상가는 가정한다"}, {"e": "that all negotiations <b>involve<\/b> a <b>fixed pie<\/b>.", "k": "모든 협상이 고정된 파이를 수반한다고."}], "easy": "많은 협상가는 어떤 협상이든 나눌 몫(파이)의 크기가 정해져 있다고 생각해요.", "gist": "글이 비판할 생각, ‘고정된 파이’가 나와요."}, {"n": 2, "ch": [{"e": "Negotiators often approach", "k": "협상가들은 자주 접근한다"}, {"e": "<b>integrative<\/b> negotiation opportunities", "k": "통합 협상 기회에"}, {"e": "as <b>zero-sum<\/b> situations or win-lose exchanges.", "k": "제로섬 상황이나 승패 교환으로."}], "easy": "협상가들은 함께 이득을 볼 수 있는 협상 기회도 한쪽이 얻으면 다른 쪽이 잃는 게임처럼 여기곤 해요.", "gist": "고정된 파이 생각은 협상을 승패 싸움으로 만들어요."}, {"n": 3, "ch": [{"e": "Those who believe in the <b>mythical<\/b> fixed pie", "k": "허구의 고정된 파이를 믿는 사람들은"}, {"e": "assume that parties’ interests <b>stand in opposition<\/b>,", "k": "당사자들의 이해관계가 반대 입장에 있다고 가정한다,"}, {"e": "with no possibility for integrative <b>settlements<\/b>", "k": "통합적인 합의의 가능성이 없이"}, {"e": "and mutually beneficial <b>trade-offs<\/b>,", "k": "그리고 상호 이익이 되는 절충의 (가능성이 없이),"}, {"e": "so they (a) <b>suppress<\/b> efforts", "k": "그래서 그들<span class=\"r\">(= 고정된 파이를 믿는 사람들)<\/span>은 노력을 (a) 억누른다"}, {"e": "to search for them.", "k": "그것들<span class=\"r\">(= 통합적인 합의와 상호 이익이 되는 절충)<\/span>을 찾으려는."}], "link": "허구의 고정된 파이를 믿는 사람들은 통합적인 합의나 서로에게 이로운 절충의 가능성 없이 당사자들의 이해관계가 대립한다고 가정하기 때문에, 그것을 찾으려는 노력을 억누른다.", "easy": "파이가 정해져 있다고 믿는 사람은 서로의 이익이 맞설 뿐 함께 이득을 볼 방법은 없다고 여겨요. 그래서 그런 방법을 찾으려는 노력을 억눌러 버려요.", "gist": "고정된 파이는 ‘허구’예요. 그 믿음이 더 나은 합의를 찾지 못하게 해요."}, {"n": 4, "ch": [{"e": "In a hiring negotiation,", "k": "고용 협상에서,"}, {"e": "a <b>job applicant<\/b> who assumes that salary is the only issue", "k": "급여가 유일한 문제라고 생각하는 구직자는"}, {"e": "may <b>insist on<\/b> $75,000", "k": "7만 5천 달러를 요구할 수 있다"}, {"e": "when the employer is offering $70,000.", "k": "고용주가 7만 달러를 제시할 때."}], "link": "고용 협상에서 급여가 유일한 문제라고 생각하는 구직자는 고용주가 7만 달러를 제시할 때 7만 5천 달러를 고집할 수 있다.", "easy": "예를 들어 급여만 생각하는 구직자는 회사가 7만 달러를 제시해도 7만 5천 달러를 고집할 수 있어요.", "gist": "예시예요. 급여 하나만 놓고 맞서는 협상이에요."}, {"n": 5, "ch": [{"e": "<b>Only when<\/b> the two parties discuss the possibilities further", "k": "두 당사자가 가능성에 대해 더 깊이 논의할 때만"}, {"e": "<b>do they discover<\/b>", "k": "그들<span class=\"r\">(= 두 당사자)<\/span>은 발견하게 된다"}, {"e": "that moving expenses and starting date can also be negotiated,", "k": "이사 비용과 시작 날짜 또한 협상될 수 있다는 것을,"}, {"e": "which may (b) <b>facilitate<\/b> <b>resolution<\/b> of the salary issue.", "k": "그리고 이는<span class=\"r\">(= 이사 비용과 시작 날짜도 협상될 수 있다는 것)<\/span> 급여 문제의 해결을 (b) 촉진할 수 있을 것이다. <span class=\"r\">※ 문제지엔 block으로 되어 있음<\/span>"}], "link": "두 당사자가 가능성을 더 깊이 논의할 때에야 비로소 이사 비용과 시작 날짜도 협상될 수 있다는 것을 알게 되는데, 이는 급여 문제의 해결을 촉진할 수 있다.", "easy": "두 사람이 더 이야기를 나눠 봐야 이사 비용이나 출근 날짜도 협상할 수 있다는 걸 알게 되고, 그러면 급여 문제도 더 쉽게 풀릴 수 있어요.", "gist": "협상거리가 늘면 해결이 쉬워져요. 그래서 (b)는 block이 아니라 facilitate예요."}, {"n": 6, "ch": [{"e": "The <b>tendency<\/b> to see negotiation in fixed-pie terms", "k": "협상을 고정된 파이 관점에서 보는 경향은"}, {"e": "(c) <b>varies<\/b>", "k": "(c) 달라진다"}, {"e": "depending on how people view", "k": "사람들이 어떻게 보는지에 따라"}, {"e": "the nature of a given conflict situation.", "k": "주어진 갈등 상황의 본질을."}], "link": "협상을 고정된 파이 관점에서 보는 경향은 사람들이 주어진 갈등 상황의 본질을 어떻게 보느냐에 따라 달라진다.", "easy": "협상을 ‘정해진 파이 나누기’로 보느냐는, 사람들이 그 갈등 상황을 어떤 성격으로 보느냐에 따라 달라져요.", "gist": "새 화제예요. 고정된 파이 생각은 관점에 따라 달라져요."}, {"n": 7, "ch": [{"e": "This was shown in a clever experiment", "k": "이것<span class=\"r\">(= 고정된 파이 관점의 경향이 상황을 보는 방식에 따라 달라진다는 것)<\/span>은 기발한 실험에서 밝혀졌다"}, {"e": "by Harinck, de Dreu, and Van Vianen", "k": "Harinck, de Dreu와 Van Vianen의"}, {"e": "involving a <b>simulated<\/b> negotiation", "k": "모의 협상을 포함하는"}, {"e": "between <b>prosecutors<\/b> and defense lawyers over <b>jail sentences<\/b>.", "k": "징역형에 대한 검사와 피고측 변호인 간의."}], "link": "이것은 Harinck, de Dreu, Van Vianen이 검사와 피고측 변호인 사이의 징역형에 관한 모의 협상으로 진행한 기발한 실험에서 밝혀졌다.", "easy": "이것은 검사와 변호인이 징역형을 두고 협상하는 모의 실험에서 확인됐어요.", "gist": "근거가 되는 실험을 소개해요."}, {"n": 8, "ch": [{"e": "Some participants were told", "k": "어떤 참가자들은 들었다"}, {"e": "to view their goals <b>in terms of<\/b> personal gain", "k": "개인적 이득의 관점에서 그들의 목표를 보라고"}, {"e": "(e.g., arranging a particular jail sentence will help your career),", "k": "(예를 들어, 특정 징역형을 정하는 것이 당신의 경력에 도움이 될 것이다),"}, {"e": "others were told to view their goals in terms of effectiveness", "k": "다른 참가자들은 효과성의 관점에서 그들의 목표를 보라고 들었다"}, {"e": "(a particular sentence is most likely to prevent <b>recidivism<\/b>),", "k": "(특정 형은 상습적 범행을 방지할 가능성이 가장 크다),"}, {"e": "and still others were told to focus on values", "k": "그리고 또 다른 참가자들은 가치에 초점을 맞추라고 들었다"}, {"e": "(a particular jail sentence is fair and just).", "k": "(특정 징역형은 공정하고 정당하다)."}], "link": "어떤 참가자들은 개인적 이득의 관점에서, 다른 참가자들은 효과성의 관점에서 목표를 보라고 들었고, 또 다른 참가자들은 가치에 초점을 맞추라고 들었다(각각 괄호 안이 그 예이다).", "easy": "참가자들을 나눠, 각각 ‘개인적 이득’, ‘효과(재범 방지)’, ‘가치(공정함)’의 관점에서 목표를 보게 했어요.", "gist": "세 가지 관점이 나와요. 개인적 이득, 효과성, 가치예요."}, {"n": 9, "ch": [{"e": "Negotiators focusing on personal gain", "k": "개인적 이득에 초점을 맞춘 협상가들은"}, {"e": "were most likely to <b>come under the influence of<\/b> fixed-pie beliefs", "k": "고정된 파이에 대한 믿음의 영향을 받을 가능성이 가장 컸다"}, {"e": "and approach the situation (d) <b>competitively<\/b>.", "k": "그리고 상황에 (d) 경쟁적으로 접근할 (가능성이 가장 컸다)."}], "link": "개인적 이득에 초점을 맞춘 협상가들은 고정된 파이 믿음의 영향을 받아 상황에 경쟁적으로 접근할 가능성이 가장 컸다.", "easy": "자기 이득에 초점을 둔 사람들이 고정된 파이 생각에 가장 잘 빠졌고, 상황을 경쟁적으로 대할 가능성이 가장 컸어요.", "gist": "개인적 이득에 초점을 두면 고정된 파이 믿음에 빠져 경쟁적으로 접근해요."}, {"n": 10, "ch": [{"e": "Negotiators focusing on values", "k": "가치에 초점을 맞춘 협상가들은"}, {"e": "were least likely to see the problem in fixed-pie terms", "k": "문제를 고정된 파이 관점에서 볼 가능성이 가장 낮았다"}, {"e": "and more <b>inclined<\/b> to approach the situation <b>cooperatively<\/b>.", "k": "그리고 상황에 협력적으로 접근하려는 경향이 더 컸다."}], "link": "가치에 초점을 맞춘 협상가들은 문제를 고정된 파이 관점에서 볼 가능성이 가장 낮았고, 상황에 협력적으로 접근하려는 경향이 더 컸다.", "easy": "반대로 공정함 같은 가치에 초점을 둔 사람들은 고정된 파이 생각에 가장 덜 빠졌고, 더 협력적으로 접근했어요.", "gist": "가치에 초점을 두면 고정된 파이에서 벗어나 협력해요."}, {"n": 11, "ch": [{"e": "Stressful conditions such as time <b>constraints<\/b>", "k": "시간 제약과 같은 스트레스가 많은 조건은"}, {"e": "<b>contribute to<\/b> this common <b>misperception<\/b>,", "k": "이러한 흔한 오해<span class=\"r\">(= 고정된 파이에 대한 믿음)<\/span>의 원인이 된다,"}, {"e": "which <b>in turn<\/b> may lead to (e) <b>less<\/b> integrative agreements.", "k": "그리고 이는 결국 (e) 덜 통합적인 합의로 이어질 수 있다."}], "link": "시간 제약 같은 스트레스가 많은 조건은 이러한 흔한 오해를 부추기며, 이는 결국 덜 통합적인 합의로 이어질 수 있다.", "easy": "시간에 쫓기는 것 같은 스트레스 상황은 이런 오해를 키우고, 그 결과 모두에게 이로운 합의가 덜 나올 수 있어요.", "gist": "마무리예요. 고정된 파이는 흔한 오해이고, 좋은 합의를 방해해요."}]}, {"no": "12", "typ": "장문 · 어휘", "src": "2024학년도 6월 42번", "evn": [4, 5], "ev_en": "In a hiring negotiation, a job applicant who assumes that salary is the only issue may insist on $75,000 when the employer is offering $70,000. / Only when the two parties discuss the possibilities further do they discover that moving expenses and starting date can also be negotiated, which may (b) facilitate resolution of the salary issue.", "ev_ko": [[4, "고용 협상에서 급여가 유일한 문제라고 생각하는 구직자는 고용주가 7만 달러를 제시할 때 7만 5천 달러를 요구할 수 있다."], [5, "두 당사자가 가능성에 대해 더 깊이 논의할 때에만 그들은 이사 비용과 시작 날짜 또한 협상될 수 있다는 것을 발견하게 되는데, 이는 급여 문제의 해결을 (b) 방해할(→ 촉진할) 수 있을 것이다."]], "why": ["4번 문장에서 구직자는 급여가 유일한 문제라고 생각합니다", "5번 문장에서 두 당사자가 더 깊이 논의하자 <b>이사 비용과 시작 날짜도 협상될 수 있다<\/b>는 것을 발견합니다", "협상할 거리가 늘어나면 합의점을 찾기 쉬워지므로, 급여 문제의 해결에도 <b>도움<\/b>이 됩니다", "그런데 (b) <b>block<\/b>(방해하다)은 반대 방향입니다", "그래서 <b>facilitate<\/b>(촉진하다) 같은 말로 바꾸어야 합니다", "답은 ②입니다."], "ch": [{"n": "①", "t": "(a) suppress", "g": "억누르다", "ok": false, "e": ["(a)가 있는 3번 문장은 고정된 파이를 믿는 사람이 통합적 합의의 가능성이 없다고 가정한다는 내용입니다", "그러니 그것을 찾으려는 노력을 <b>억누른다<\/b>(suppress)는 말은 자연스럽습니다."]}, {"n": "②", "t": "(b) block", "g": "방해하다 → facilitate(촉진하다)가 알맞음", "ok": true, "e": ["협상할 거리가 늘어났다는 앞 내용과 반대 방향입니다", "급여 문제의 해결을 <b>돕는<\/b> 쪽이어야 하므로 facilitate(촉진하다)가 알맞습니다."]}, {"n": "③", "t": "(c) varies", "g": "달라지다", "ok": false, "e": ["(c)가 있는 6번 문장은 고정된 파이 관점으로 보는 경향이 상황을 어떻게 보느냐에 <b>따라<\/b>(depending on) 달라진다는 뜻입니다", "뒤의 실험(8~10번)도 관점에 따라 결과가 달랐다고 보여 줍니다."]}, {"n": "④", "t": "(d) competitively", "g": "경쟁적으로", "ok": false, "e": ["9번 문장에서 개인적 이득에 초점을 맞춘 협상가는 고정된 파이 믿음의 영향을 받습니다", "그래서 상황에 <b>경쟁적으로<\/b> 접근한다는 것은 자연스럽습니다", "10번의 가치 중심 협상가가 <b>협력적으로<\/b> 접근한 것과도 대비됩니다."]}, {"n": "⑤", "t": "(e) less", "g": "덜 (~한)", "ok": false, "e": ["11번 문장에서 스트레스 조건이 고정된 파이라는 <b>오해<\/b>를 키운다고 합니다", "오해가 커지면 통합적인 합의는 <b>덜<\/b> 나오므로 less가 알맞습니다."]}], "tr": ["많은 협상가는 모든 협상이 고정된 파이를 수반한다고 가정한다.", "협상가들은 통합 협상의 기회를 자주 제로섬 상황이나 승패 교환으로 접근한다.", "허구의 고정된 파이를 믿는 사람들은 통합적인 합의와 상호 이익이 되는 절충의 가능성이 전혀 없이 당사자들의 이해관계가 대립한다고 가정하기 때문에, 그것을 찾으려는 노력을 (a) 억누른다.", "고용 협상에서 급여가 유일한 문제라고 생각하는 구직자는 고용주가 7만 달러를 제시할 때 7만 5천 달러를 요구할 수 있다.", "두 당사자가 가능성에 대해 더 깊이 논의할 때에만 그들은 이사 비용과 시작 날짜 또한 협상될 수 있다는 것을 발견하게 되는데, 이는 급여 문제의 해결을 (b) 방해할(→ 촉진할) 수 있을 것이다.", "협상을 고정된 파이 관점에서 보는 경향은 사람들이 주어진 갈등 상황의 본질을 어떻게 보는지에 따라 (c) 달라진다.", "이것은 검사와 피고측 변호사 간의 징역형에 대한 모의 협상을 포함하는 Harinck, de Dreu, Van Vianen의 기발한 실험에서 밝혀졌다.", "어떤 참가자들은 개인적 이득의 관점에서 목표를 보라고 들었고(예를 들어 특정 징역형을 정하는 것이 당신의 경력에 도움이 될 것이다), 다른 참가자들은 효과성의 관점에서 목표를 보라고 들었으며(특정 형은 상습적 범행을 방지할 가능성이 가장 크다), 또 다른 참가자들은 가치에 초점을 맞추라고 들었다(특정 징역형은 공정하고 정당하다).", "개인적 이득에 초점을 맞추는 협상가들은 고정된 파이에 대한 믿음의 영향을 받아 상황에 (d) 경쟁적으로 접근할 가능성이 가장 컸다.", "가치에 초점을 맞춘 협상가들은 문제를 고정된 파이 관점에서 볼 가능성이 가장 낮았고 상황에 협력적으로 접근하려는 경향이 더 컸다.", "시간 제약과 같은 스트레스가 많은 조건은 이러한 흔한 오해의 원인이 되며, 이것은 결국 (e) 덜 통합적인 합의로 이어질 수 있다."], "ps": [{"n": 1, "ch": [{"e": "Many <b>negotiators<\/b> <b>assume<\/b>", "k": "많은 협상가는 가정한다"}, {"e": "that all negotiations <b>involve<\/b> a <b>fixed pie<\/b>.", "k": "모든 협상이 고정된 파이를 수반한다고."}], "easy": "많은 협상가는 어떤 협상이든 나눌 몫(파이)의 크기가 정해져 있다고 생각해요.", "gist": "글이 비판할 생각, ‘고정된 파이’가 나와요."}, {"n": 2, "ch": [{"e": "Negotiators often approach", "k": "협상가들은 자주 접근한다"}, {"e": "<b>integrative<\/b> negotiation opportunities", "k": "통합 협상 기회에"}, {"e": "as <b>zero-sum<\/b> situations or win-lose exchanges.", "k": "제로섬 상황이나 승패 교환으로."}], "easy": "협상가들은 함께 이득을 볼 수 있는 협상 기회도 한쪽이 얻으면 다른 쪽이 잃는 게임처럼 여기곤 해요.", "gist": "고정된 파이 생각은 협상을 승패 싸움으로 만들어요."}, {"n": 3, "ch": [{"e": "Those who believe in the <b>mythical<\/b> f 적 이득에 초점을 맞추는\u0002 협상가들은 / \u0001고정된 파이에 대한 믿음의 영향을 받을\u0002 가능성이 가장 컸고 / 그리고 \u0001그 상황에 \u0001경쟁적으로\u0002 접근할\u0002 가능성이 가장 컸다.", "core": "협상가들은 가능성이 가장 컸다.", "tags": ["주어 Negotiators. focusing on ~ = 현재분사구(형용사적): Negotiators를 꾸밈. focus on = ~에 집중하다", "동사 were + 보어 most likely. to come under ~ = to부정사(부사적): SVC 뒤 수식어 [기준: 문형 기준]. come under the influence of = ~의 영향을 받다", "and: (to) approach와 병렬된 to부정사. competitively = 부사: approach를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 주어를 꾸미는 분사구와 to부정사 병렬로 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Negotiators (협상가들, negotiator 협상가)", "V: were (be의 과거형)", "C: most likely (~할 가능성이 가장 큰, likely 가능성이 있는)", "뼈대 = <b>Negotiators were most likely</b>"]}, {"t": "주어 뒤 <b>focusing on personal gain</b>은 Negotiators를 뒤에서 꾸미는 <b>현재분사구</b>이다. '개인적 이득에 초점을 맞추는'(focus on ~에 초점을 맞추다, personal 개인적인, gain 이득)이다.", "sub": ["함정: focusing을 동사로 보면 were가 갈 곳이 없다."]}, {"t": "likely 뒤에는 <b>to부정사 2개</b>가 and로 병렬이며, likely를 꾸미는 수식어이므로 뼈대 밖에 둔다(문형 기준).", "sub": ["A: to come under the influence of fixed-pie beliefs (고정된 파이에 대한 믿음의 영향을 받다, come under ~의 영향 아래 놓이다, influence 영향, fixed 고정된, belief 믿음)", "B: (to) approach the situation competitively (그 상황에 경쟁적으로 접근하다, approach 접근하다, situation 상황, competitively 경쟁적으로)"]}], "sum": "개인 이득에 집중하는 협상가는 경쟁적 접근에 빠지기 쉬움"}, {"i": "08", "q": "11", "s": "B-6", "title": "S+V + 계속적 용법 which", "eng": "Stressful<sup>1</sup> conditions such as<sup>2</sup> time constraints<sup>3</sup> / contribute to<sup>4</sup> this common misperception<sup>5</sup>, / which in turn<sup>6</sup> may lead to less integrative agreements.", "notes": [["1", "stressful", "스트레스가 많은"], ["2", "such as", "~와 같은"], ["3", "constraint", "제약, 통제"], ["4", "contribute to", "~의 원인이 되다"], ["5", "misperception", "오해, 오인"], ["6", "in turn", "결국, 차례차례"]], "lit": "시간 제약과 같은 스트레스가 많은 조건은 / 이러한 흔한 오해의 원인이 되는데, / 이것은 결국 덜 통합적인 합의로 이어질 수 있다.", "nat": "시간 제약과 같은 스트레스가 많은 조건은 이러한 흔한 오해의 원인이 되며, 이는 결국 덜 통합적인 합의로 이어질 수 있다.", "ana": "<b>such as</b>는 앞의 명사를 <b>예로 들어 주는</b> 자리이므로, 뒤의 time constraints는 문장의 주어가 아니다. 진짜 주어는 맨 앞의 <b>Stressful conditions</b>이고 동사는 <b>contribute</b>다. such as·including·like가 보이면 그 뒤는 통째로 괄호로 묶고 지워 읽는 것이 안전하다. <b>contribute to</b>는 '기부하다'가 아니라 '<b>~의 원인이 되다·~에 기여하다</b>'이며, 좋은 일에도 나쁜 일에도 쓴다. 여기서는 <b>오해를 키운다</b>는 부정적인 뜻이다. 콤마 뒤의 <b>which</b>는 <b>계속적 용법</b>으로 앞 절 전체를 받아 '<b>그리고 이것은</b>'으로 읽고, <b>in turn</b>은 '<b>결국·그 결과 차례로</b>'라는 뜻이다.", "pe": "\u0001Stressful<sup>1</sup>\u0002 conditions \u0001such as<sup>2</sup> time constraints<sup>3</sup>\u0002 / contribute \u0001to<sup>4</sup> this \u0001common\u0002 misperception<sup>5</sup>\u0002, / \u0001which in turn<sup>6</sup> may lead to less integrative agreements\u0002.", "pk": "\u0001시간 제약과 같은\u0002 \u0001스트레스가 많은\u0002 조건은 / \u0001이러한 흔한 오해의\u0002 원인이 되는데, / \u0001이것은 결국 덜 통합적인 합의로 이어질 수 있다\u0002.", "core": "조건은 원인이 된다.", "tags": ["주어 conditions. Stressful = 형용사: conditions를 꾸밈. such as time constraints = 전치사구(형용사구): conditions를 꾸밈", "동사 contribute. to this ~ misperception = 전치사구: contribute to, 거의 필수에 가까운 부사구 [기준: 문형 기준]. common = 형용사: misperception", "which절 = 계속적 관계절(형용사절): misperception을 보충 설명. in turn = 부사구(삽입). lead to = ~로 이어지다"], "steps": [{"t": "이 문장은 <b>S+V(1형식)</b>이다. 문장 중간의 예시와 끝의 계속적 관계절 때문에 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Stressful conditions (스트레스가 많은 조건들, stressful 스트레스가 많은, condition 조건)", "V: contribute (contribute to ~의 원인이 되다)", "contribute to this common misperception = 이 흔한 오해의 원인이 되다 (common 흔한, misperception 오해, to 이하는 거의 필수에 가까운 부사구)", "뼈대 = <b>Stressful conditions contribute to this common misperception</b>"]}, {"t": "주어 뒤 <b>such as time constraints</b>는 conditions의 예시이다. '시간 제약과 같은'(such as ~와 같은, constraint 제약)이다. 이 예시 때문에 주어와 동사 사이가 벌어진다."}, {"t": "콤마 뒤 <b>which in turn may lead to less integrative agreements</b>는 <b>계속적 용법의 관계절</b>이다. which = 앞 내용(오해) 자체를 받는다.", "sub": ["in turn 결국/차례로, may lead to ~로 이어질 수 있다 (lead 이끌다), less integrative 덜 통합적인, agreement 합의", "'이것은 결국 ~로 이어진다'처럼 앞에서 뒤로 이어 읽는다"]}, {"t": "함정: time constraints는 주어가 아니다. such as 뒤는 예시이다."}], "sum": "스트레스 조건이 오해를 낳고, 이는 합의의 질 저하로 이어질 수 있음"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2016학년도 9월 32번", "ans": "②", "tr": [["1", "성격 유형으로 보았을 때 조사자는 과학, 절차, 학습에 높은 가치를 둔다."], ["2", "그들은 복잡한 문제를 극복하기 위해 논리와 자신의 감각을 통해 얻은 정보를 사용하면서 연구에 뛰어난 능력을 보인다."], ["3", "‘중대한 발견’보다 그들을 더 가슴 설레게 하는 것은 없다."], ["4", "지적이고, 자기 성찰적이며, 대단히 꼼꼼하기에, 조사자들은 자신이 가치 있다고 여기는 결과를 추구하기 위해 지적 능력을 사용하고 있을 때 가장 행복하다."], ["5", "그들은 자기 자신의 박자에 맞추어 나아가는 것을 선호하고, 도전에 대하여 한 가지 고정된 반응을 필요로 하는 지나치게 구조화된 환경을 싫어한다."], ["6", "조사자들은 리더십에 관심이 없으며, 협력을 촉진하는 데 필요한 대인 관계 기술을 발전시키는 일은 그들 중 다수에게 장애물이다."], ["7", "그들은 자기 분야에서 ‘따라가는’ 능력에 있어 불안함을 느낄 수도 있고, 흥미를 끌지 않는 일을 끝내기 위해 더 중요한 일을 보류하도록 강요받을 때 안 좋게 반응할 수도 있다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "Intellectual, introspective, and exceedingly detail-oriented, investigators are happiest when they're using their brain power to pursue what they deem as a worthy outcome."}, {"en": false, "h": "빈칸 문장은 <b>and로 두 부분이 묶여 있다</b>. 뒤쪽이 '<b>고정된 반응을 요구하는 지나치게 구조화된 환경을 싫어한다</b>'이므로, 앞쪽 빈칸에는 그와 <b>같은 방향</b>의 말이 들어가야 한다. 남이 정해 준 틀을 싫어한다면 <b>자기 방식대로 간다</b>는 뜻이다. 4번 문장도 같은 말을 한다. 그들은 <b>자신이 가치 있다고 여기는</b>(what they deem as a worthy outcome) 결과를 좇을 때 가장 행복하다. 판단 기준이 <b>바깥이 아니라 자기 안</b>에 있다는 것이다. 이 둘을 합치면 <b>march to their own beat</b>, 곧 자기 박자에 맞춰 나아간다가 답이다."}], "opts": [{"n": "①", "t": "attempt to go with the flow (대세를 따르려고 시도하고)", "a": false, "x": true, "trap": false, "e": "대세를 따른다면 <b>구조화된 환경을 싫어한다</b>는 뒤 내용과 정면으로 부딪힌다. 방향이 반대다."}, {"n": "②", "t": "prefer to march to their own beat (자기 자신의 박자에 맞추어 나아가는 것을 선호하고)", "a": true, "x": false, "trap": false, "e": "4번 문장의 <b>what they deem as a worthy outcome</b>과 같은 말이다. 판단 기준이 자기 안에 있다는 뜻이다."}, {"n": "③", "t": "dare to take the lead from the front (과감하게 앞에서 선두에 서고)", "a": false, "x": true, "trap": false, "e": "6번 문장이 <b>not interested in leadership</b>이라고 못 박는다. 선두에 선다는 말과 정반대다."}, {"n": "④", "t": "tend to work shoulder to shoulder (협력하여 일하는 경향이 있고)", "a": false, "x": true, "trap": fact that the intensity reflects the duration of the separation as well as the level of intimacy suggests that elephants have a sense of time as well."}, {"en": false, "h": "요약문 완성은 <b>빈칸 두 개에 각각 대응하는 문장</b>을 따로 찾는 것이 정석이다. (A)는 2번 문장이 근거다. 인사 행동의 형태가 <b>the strength of the social bond</b>, 곧 <b>사회적 유대의 강도</b>를 반영한다고 했으므로 '얼마나 사회적으로 ~한지'에는 <b>tied</b>(유대감을 갖는)가 들어간다. (B)는 5번 문장이 근거다. 인사의 강렬함이 <b>the duration of the separation</b>, 곧 <b>떨어져 있던 기간</b>을 반영한다고 했으므로 '얼마나 오래 ~해 있었는지'에는 <b>parted</b>(헤어져 있는)가 맞다. 따라서 답은 ⑤다."}], "opts": [{"n": "①", "t": "competitive …… disconnected (경쟁을 하는 …… 단절되어)", "a": false, "x": true, "trap": false, "e": "(A)가 틀렸다. 글에는 코끼리끼리 <b>경쟁</b>한다는 내용이 전혀 없다. 인사는 유대의 표현이다."}, {"n": "②", "t": "tied …… endangered (유대감을 갖는 …… 멸종 위기에 처해)", "a": false, "x": true, "trap": false, "e": "(A)는 맞지만 (B)가 틀렸다. <b>멸종 위기</b>는 글에 나오지 않는다. 반영되는 것은 떨어져 있던 <b>시간</b>이다."}, {"n": "③", "t": "responsible …… isolated (책임감이 있는 …… 고립되어)", "a": false, "x": true, "trap": false, "e": "(A)의 <b>책임감</b>은 근거가 없다. 2번 문장이 말하는 것은 <b>social bond의 강도</b>다."}, {"n": "④", "t": "competitive …… united (경쟁을 하는 …… 단결되어)", "a": false, "x": true, "trap": true, "e": "(A)도 (B)도 어긋난다. (B) 자리에는 <b>떨어져 있던</b> 상태가 들어가야 하는데 united는 정반대다."}, {"n": "⑤", "t": "tied …… parted (유대감을 갖는 …… 헤어져)", "a": true, "x": false, "trap": false, "e": "(A)는 2번 문장의 <b>social bond</b>, (B)는 5번 문장의 <b>duration of the separation</b>이 근거다. 둘 다 맞는 유일한 선지다."}], "w": [["reunite", "재결합하다, 재회하다"], ["availability", "이용 가능성"], ["primate", "영장류"], ["elaborate", "정교한, 공들인"], ["social bond", "사회적 유대"], ["acquaintance", "지인, 아는 사람"], ["trunk", "(코끼리의) 코"], ["peck", "가벼운 입맞춤"], ["theatrical", "극적인, 연극의"], ["intimacy", "친밀감"], ["strike a chord", "공감을 불러일으키다"], ["indicator", "지표, 척도"]]}, {"q": "10", "type": "문장 삽입", "src": "2019학년도 수능 39번", "ans": "③", "tr": [["1", "[주어진 문장] 그러므로 평야 위로 솟은 둥근 산은 지도에 일련의 동심원으로 나타날 것인데, 가장 큰 것은 밑부분에 있고 가장 작은 것은 꼭대기 근처에 있다."], ["2", "지도 제작자들의 주요한 과제는 집합적으로 ‘지형’이라고 불리는 산과 계곡, 경사지와 평지의 묘사이다."], ["3", "이것은 여러 가지 방법으로 행해질 수 있다."], ["4", "(①) 한 가지 방법은 지형의 주름이 번갈아 빛을 받고 그늘지도록 햇빛과 그림자의 이미지를 만들어, 땅의 모양을 시각적으로 표현해 내는 것이다."], ["5", "(②) 또 다른, 기술적으로 더 정확한 방법은 등고선을 그리는 것이다."], ["6", "(③) 등고선은 동일한 고도에 있는 모든 점들을 연결한다. ← 주어진 문장이 이 뒤에 들어간다"], ["7", "(④) 등고선들이 서로 가깝게 배치되면 산의 경사는 가파르고, 그것들이 더 멀리 떨어져 있으면 경사는 더 완만하다."], ["8", "(⑤) 등고선은 지역 지형의 가파른 비탈, 분지, 계곡을 표현할 수 있다."], ["9", "한눈에 그것들은 지도로 그려진 지역의 기복이 큰지 작은지를 드러낸다. 즉 ‘복잡한’ 등고선 지도는 많은 높은 기복을 의미한다."]], "evh": "6번 문장", "ev": [{"en": true, "h": "A contour line connects all points that lie at the same elevation."}, {"en": false, "h": "삽입 문항은 <b>주어진 문장의 연결어와 지시어</b>가 전부다. 주어진 문장에는 <b>therefore(그러므로)</b>가 들어 있으므로, 바로 앞에 그 결론을 끌어낼 <b>근거</b>가 있어야 한다. 또 <b>a set of concentric circles</b>(일련의 동심원)라는 말은 <b>등고선이 무엇인지</b>를 이미 알고 있어야 이해된다. 6번 문장이 정확히 그 근거다. <b>등고선은 같은 고도의 점들을 잇는다</b>는 정의가 나와야, '그러므로 둥근 산은 동심원으로 보인다'는 결론이 성립한다. 그리고 뒤의 7번 문장은 등고선의 <b>간격</b>으로 넘어가므로 정의와 결론 사이를 끊지 않는다. 따라서 ③이다."}], "opts": [{"n": "①", "t": "One is to create an image of sunlight and shadow ~ 앞", "a": false, "x": true, "trap": false, "e": "아직 <b>등고선</b>이라는 말 자체가 등장하지 않았다. 동심원 이야기를 꺼낼 수 없다."}, {"n": "②", "t": "Another, technically more accurate way ~ 앞", "a": false, "x": true, "trap": false, "e": "바로 뒤 문장이 <b>또 다른 방법</b>을 소개하려는 자리다. 그 사이를 끊으면 ‘한 가지 방법 – 또 다른 방법’ 연결이 깨진다."}, {"n": "③", "t": "A contour line connects all points ~ 뒤", "a": true, "x": false, "trap": false, "e": "등고선의 <b>정의</b>가 나온 직후다. 그 정의가 있어야 <b>therefore</b>로 동심원이라는 결론을 끌어낼 수 있다."}, {"n": "④", "t": "When the contour lines are positioned closely together ~ 뒤", "a": false, "x": true, "trap": true, "e": "이 문장은 이미 등고선의 <b>간격과 경사</b>로 화제를 옮긴 뒤다. 정의 바로 다음에 와야 할 결론이 한 칸 밀린다."}, {"n": "⑤", "t": "Contour lines can represent scarps, hollows ~ 뒤", "a": false, "x": true, "trap": false, "e": "등고선의 <b>활용</b>까지 다 말한 뒤라 너무 늦다. 뒤의 <b>At a glance</b> 문장과의 연결도 끊어진다."}], "w": [["depiction", "묘사, 서술"], ["collectively", "집합적으로, 일괄하여"], ["topography", "지형(학)"], ["alternately", "번갈아, 교대로"], ["representation", "표현, 묘사"], ["contour l ggest Salary (고정된 파이는 가장 많은 급여를 받는 방법을 알려 준다)", "a": false, "x": true, "trap": false, "e": "급여 예시는 <b>고정된 파이 사고의 한계</b>를 보여 주는 장치다. 급여를 많이 받는 방법을 알려 주는 글이 아니다."}, {"n": "③", "t": "Negotiators, Wake Up from the Myth of the Fixed Pie! (협상가들이여, 고정된 파이의 근거 없는 믿음에서 깨어나라!)", "a": true, "x": false, "trap": false, "e": "3번 문장의 <b>mythical fixed pie</b>와 11번 문장의 <b>this common misperception</b>이 그대로 이어진다. 글 전체의 결론이다."}, {"n": "④", "t": "Want a Fairer Jail Sentence? Stick to the Fixed Pie (더 공정한 징역형을 원하는가? 고정된 파이를 고수하라)", "a": false, "x": true, "trap": true, "e": "징역형은 <b>실험 소재</b>일 뿐 글의 주제가 아니다. 게다가 고정된 파이를 고수하라는 것은 글과 정반대다."}, {"n": "⑤", "t": "What Alternatives Maximize Fixed-pie Effects? (어떤 대안이 고정된 파이 효과를 극대화하는가?)", "a": false, "x": true, "trap": false, "e": "글은 고정된 파이 효과를 <b>극대화</b>하려는 것이 아니라 <b>없애려는</b> 방향이다."}], "w": [["negotiator", "협상가, 교섭자"], ["assume", "가정하다, 상정하다"], ["integrative", "통합적인, 통합하는"], ["zero-sum", "제로섬의"], ["mythical", "허구의, 가공의"], ["stand in opposition", "대립하다"], ["settlement", "합의, 해결"], ["trade-off", "균형, 절충안"], ["suppress", "억누르다, 억제하다"], ["job applicant", "구직자"], ["misperception", "오해, 오인"], ["in turn", "결국, 차례차례"]]}, {"q": "12", "type": "장문 · 어휘", "src": "2024학년도 6월 42번", "ans": "②", "tr": [["1", "(11번과 같은 지문)"], ["2", "(a) suppress — 이해관계가 대립한다고 가정하니 통합적 합의를 찾으려는 노력을 억누른다. 흐름에 맞는다."], ["3", "(b) block — 급여 외의 조건을 논의하면 급여 문제가 오히려 풀린다. 방해한다는 말은 정반대다. ← 정답 (→ facilitate)"], ["4", "(c) varies — 뒤에 depending on how people view ~가 이어진다. ‘달라진다’가 자연스럽다."], ["5", "(d) competitively — 개인적 이득에 초점을 맞추면 고정된 파이 믿음에 빠지므로 경쟁적으로 접근한다. 맞는다."], ["6", "(e) less — 스트레스가 많으면 오해가 커지므로 덜 통합적인 합의로 이어진다. 맞는다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "Only when the two parties discuss the possibilities further do they discover that moving expenses and starting date can also be negotiated, which may (b) block resolution of the salary issue."}, {"en": false, "h": "어휘 문항은 밑줄 단어 자리에 <b>앞 절이 요구하는 방향</b>을 먼저 정해 놓고 대조한다. 5번 문장의 앞 절은 두 당사자가 더 깊이 논의하자 <b>이사 비용과 시작 날짜도 협상될 수 있음     const tw=(m)=>{let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1600);};
    if(c[p])tw('오답노트장에 담았어요');
    else{const ww=WS.words[i],x=p==='m'?[ww.w,ww.m]:p==='s'?ww.s:ww.a;if(x&&x[0])WN.del(x[0],'미니모고').then(r=>{if(r&&r.removed===false&&r.reason==='late'){c[p]=1;save();b.classList.add('bad');tw('이미 쌓인 단어라 뺄 수 없어요')}else if(r&&r.removed)tw('오답노트장에서 뺐어요')});}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
