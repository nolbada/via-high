<style>

<body>
<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}

ot know you may think that you are aloof or that you think you are better than them.", "g": "내향적인 사람으로서 당신이 직면할 유일한 위험은, 당신을 모르는 사람들이 당신을 냉담하다고 생각하거나, 당신이 스스로를 그들보다 더 낫다고 믿는다고 생각할 수도 있다는 것이다.", "ok": false, "e": ["이점을 말한 뒤 <b>The only risk<\/b>(유일한 위험)로 단점을 꺼냅니다", "뒤에 나올 해결책으로 이어지는 문장입니다."]}, {"n": "③", "t": "If you learn how to open up just a little bit with your opinions and thoughts, you will be able to thrive in both worlds.", "g": "만약 당신이 당신의 의견과 생각에 관하여 조금만 마음을 터놓는 방법을 배운다면, 당신은 양쪽 세계 모두에서 성공할 수 있을 것이다.", "ok": false, "e": ["②의 위험(냉담하게 보일 수 있음)에 대한 해결책입니다", "생각을 조금만 털어놓으면 양쪽 세계 모두에서 성공할 수 있다고 합니다."]}, {"n": "④", "t": "An introvert may prefer online to in-person communication, as you do when feeling temporarily uncertain with your relationships.", "g": "내향적인 사람은, 당신이 인간관계에 대해 일시적으로 불확실하다고 느낄 때 그러는 것처럼, 직접적인 의사소통보다 온라인 의사소통을 선호할 수도 있다.", "ok": true, "e": ["온라인 소통과 직접 만나는 소통 중 무엇을 더 좋아하는지는 앞뒤 어디에서도 다루지 않는 새 화제입니다", "③의 해결책과 ⑤의 결과 사이를 끊어 놓습니다."]}, {"n": "⑤", "t": "You can then stay true to your personality without appearing to be antisocial.", "g": "그러면 당신은 비사교적인 것처럼 보이지 않으면서 당신의 개성에 계속 충실할 수 있다.", "ok": false, "e": ["<b>then<\/b>(그러면)이 ③의 '조금만 마음을 터놓으면'을 받습니다", "그 결과로 비사교적으로 보이지 않으면서 자기 개성에 충실할 수 있다는 내용이라 흐름에 맞습니다."]}], "tr": ["내향적인 사람이라는 것에는 그 자체의 도전이 따르지만, 그것은 이점 또한 분명히 가지고 있다.", "예를 들면, 내향적인 사람은 동의할 수 없는 의견을 가진 다른 사람을 무심코 모욕하는 것과 같은, 사회적 상황에서 실수를 할 가능성이 훨씬 더 적다.", "① 내향적인 사람은 그들(자신)의 생각을 되돌아보는 것을 즐길 것이고, 그렇기 때문에 외부 자극이 없어도 지루함에 고통받을 가능성이 훨씬 더 적을 것이다.", "② 내향적인 사람으로서 당신이 직면할 유일한 위험은, 당신을 모르는 사람들이 당신을 냉담하다고 생각하거나, 또는 당신이 당신(자신)을 그들보다 더 낫다고 믿는다고 생각할 수도 있다는 것이다.", "③ 만약 당신이 당신의 의견과 생각에 관하여 조금만 마음을 터놓는 방법을 배운다면, 당신은 양쪽 세계 모두에서 성공할 수 있을 것이다.", "④ 내향적인 사람은 당신이 당신의 (인간)관계에 대해 일시적으로 불확실하다고 느낄 때 하는 것처럼, 직접적인 의사소통보다 온라인을 (통한 의사소통을) 선호할 수도 있다.", "⑤ 그러면 당신은 비사교적인 것처럼 보이지 않으면서 당신의 개성에 계속 충실할 수 있다."], "ps": [{"n": 1, "ch": [{"e": "While being an <b>introvert<\/b>", "k": "내향적인 사람이라는 것에는"}, {"e": "<b>comes with<\/b> its challenges,", "k": "그 자체의 도전(어려움)이 따르지만,"}, {"e": "it def , "only (유일한)는 risk를 꾸미는 형용사이다."]}, {"t": "주어 뒤 <b>that you will face as an introvert</b>는 <b>목적격 관계절</b>로 risk를 꾸민다. '당신이 내향적인 사람으로서 마주하게 될'.", "sub": ["face = 마주하다, as an introvert = 내향적인 사람으로서 (자격)", "face의 목적어가 risk이다. 이 that은 보어절을 이끄는 that과 다르다."]}, {"t": "보어 that절의 뼈대는 <b>people may think (that) ~</b> (사람들이 ~라고 생각할지도 모른다)이다.", "sub": ["S: people, V: may think", "<b>who do not know you</b>는 people을 꾸미는 관계절이다. '당신을 모르는'"]}, {"t": "think의 목적어는 병렬이다. <b>that you are aloof</b> (당신이 냉담하다) <b>or that you think you are better than them</b> (또는 스스로를 그들보다 낫다고 여긴다)", "sub": ["aloof = 냉담한, 거리를 두는, better than = ~보다 나은", "you think 뒤 that이 생략되었다. than them (그들보다)은 better를 꾸미는 비교 부사구이다."]}], "sum": "유일한 위험은 사람들이 나를 냉담하거나 잘난 척한다고 여기는 것"}, {"i": "05", "q": "09", "s": "6", "title": "S+V+C(that절) + in which + 동사 병렬", "eng": "A fundamental<sup>1</sup> insight<sup>2</sup> of modern economics / is that the key to the creation of wealth is a division of labor<sup>3</sup>, / in which specialists learn to produce a commodity<sup>4</sup> with increasing cost-effectiveness<sup>5</sup> / and have the means<sup>6</sup> to exchange their specialized products efficiently.", "notes": [["1", "fundamental", "근본적인"], ["2", "insight", "통찰"], ["3", "division of labor", "분업"], ["4", "commodity", "상품, 물품"], ["5", "cost-effectiveness", "비용 효율성"], ["6", "means", "수단"]], "lit": "현대 경제학의 근본적인 통찰은 / 부의 창출의 핵심이 분업이라는 것이다, / 그 분업 안에서 전문가들은 점점 더 높은 비용 효율성으로 상품을 생산하는 법을 배우고 / 자신들의 특화된 상품을 효율적으로 교환할 수단을 갖게 된다.", "nat": "현대 경제학의 근본적인 통찰은 부의 창출의 핵심이 분업이라는 것인데, 그 분업 속에서 전문가들은 점점 더 높은 비용 효율성으로 상품을 생산하는 법을 배우고 자신들의 특화된 상품을 효율적으로 교환할 수단을 갖게 된다.", "ana": "동사 is 뒤에 온 <b>that절</b>은 주어를 설명하는 <b>보어</b>다. 그런데 그 that절 안에도 주어 <b>the key</b>와 동사 <b>is</b>가 또 들어 있어 <b>is가 두 번</b> 나온다. 어느 is가 주절의 동사인지 헷갈리면, <b>that 앞의 is</b>가 주절이라고 표시해 두고 읽는다. 콤마 뒤의 <b>in which</b>는 <b>전치사 + 관계대명사</b>로, 선행사 a division of labor를 받아 '<b>그 분업 안에서</b>'라는 뜻이 된다. in which 뒤에는 <b>완전한 문장</b>이 온다는 점이 which 단독과 갈리는 지점이다. 마지막으로 <b>learn</b>과 <b>have</b>는 in which절 안에서 주어 specialists를 공유하는 <b>동사 병렬</b>이다.", "pe": "A \u0001fundamental<sup>1</sup>\u0002 insight<sup>2</sup> \u0001of modern economics\u0002 / is that the key \u0001to the creation of wealth\u0002 is a division of labor<sup>3</sup>, / \u0001in which specialists learn to produce a commodity<sup>4</sup> with increasing cost-effectiveness<sup>5</sup>\u0002 / \u0001and have the means<sup>6</sup> to exchange their specialized products efficiently\u0002.", "pk": "\u0001현대 경제학의\u0002 \u0001근본적인\u0002 통찰은 / \u0001부의 창출의\u0002 핵심이 분업이라는 것이다, / \u0001그 분업 안에서 전문가들은 점점 더 높은 비용 효율성으로 상품을 생산하는 법을 배우고\u0002 / \u0001자신들의 특화된 상품을 효율적으로 교환할 수단을 갖게 된다\u0002.", "core": "통찰은 부의 창출의 핵심이 분업이라는 것이다.", "tags": ["주어 insight. fundamental = 형용사: insight를 꾸밈. of modern economics = 형용사구: insight를 꾸밈", "동사 is + 보어 that절(명사절) = 뼈대. 안쪽: key(주어) + is + a division of labor(보어). to the creation of wealth = 전치사구(형용사구): key 꾸밈", "in which절 = 관계절(형용사절): division of labor를 꾸밈. in which = 전치사 + 관계대명사. with increasing cost-effectiveness = 부사구: produce를 꾸밈", "and: 관계절 안 동사 병렬(learn / have). to exchange ~ = to부정사(형용사적): means를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+C(2형식)</b>이다. 보어 that절 안에 in which 관계절이 있고 동사가 병렬이라 아주 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: A fundamental insight of modern economics (현대 경제학의 근본적인 통찰)", "V: is (be ~이다)", "C: that절 (명사절, 통찰의 내용)", "뼈대 = <b>A fundamental insight is that ~</b>", "fundamental = 근본적인, insight = 통찰, economics = 경제학"]}, {"t": "that절의 뼈대는 <b>the key to the creation of wealth is a division of labor</b> (부의 창출의 핵심이 분업이다)이다.", "sub": ["S: the key, V: is, C: a division of labor (분업)", "to the creation of wealth는 key를 꾸미는 전치사구이다. creation = 창출, wealth = 부"]}, {"t": "<b>in which ~</b>는 <b>전치사 + 관계대명사 절(형용사절)</b>로 a division of labor를 꾸민다. 'in a division of labor' 뜻이라 in which이다."}, {"t": "그 관계절 안에 동사가 둘이다. <b>specialists learn to produce a commodity</b> (전문가들이 상품을 생산하는 법을 배운다) <b>and have the means</b> (그리고 수단을 갖는다)", "sub": ["specialist = 전문가, commodity = 상품, means = 수단", "with increasing cost-effectiveness (점점 높아지는 비용 효율성으로)는 produce를 꾸민다. cost-effectiveness = 비용 효율성"]}, {"t": "<b>to exchange their specialized products efficiently</b>는 means를 꾸미는 <b>to부정사(형용사적)</b>이다. '특화된 상품을 효율적으로 교환할'.", "sub": ["exchange = 교환하다, specialized = 특화된, efficiently = 효율적으로"]}], "sum": "현대 경제학의 통찰, 부의 핵심은 분업"}, {"i": "06", "q": "10", "s": "A-5", "title": "목적의 to부정사 + S+V(1형식) + ask if", "eng": "On his way to the classroom, / Steve's teacher came up to<sup>1</sup> him / to ask if he wanted to run for<sup>2</sup> student president<sup>3</sup>.", "notes": [["1", "come up to", "~에게 다가가다"], ["2", "run for", "~에 출마하다"], ["3", "student president", "학생회장"]], "lit": "교실로 가는 길에, / Steve의 선생님이 그에게 다가왔다 / 그가 학생회장에 출마하고 싶은지 묻기 위해.", "nat": "교실로 가는 길에 Steve의 선생님이 그에게 다가와 학생회장에 출마할 생각이 있는지 물었다.", "ana": "<b>to ask</b>는 앞의 came up to him이라는 완전한 절 뒤에 붙었으므로 '<b>~하기 위해</b>'라는 <b>목적</b>의 to부정사다. 이렇게 문장이 이미 완성된 뒤에 to V가 나오면 대개 목적으로 읽는다. ask 뒤의 <b>if</b>는 '만약'이 아니라 '<b>~인지 아닌지</b>'라는 뜻의 <b>명사절 접속사</b>로 whether와 바꿔 쓸 수 있다. 조건의 if와 구별하는 방법은 간단하다. <b>동사의 목적어 자리</b>에 있으면 '~인지'이고, 문장 앞이나 뒤에서 조건을 말하면 '만약'이다. <b>run for</b>는 '~를 향해 달리다'가 아니라 '<b>~에 출마하다</b>'라는 뜻이니 통째로 익혀 두자.", "pe": "\u0001On his way \u0001to the classroom\u0002\u0002, / Steve's teacher came up \u0001to<sup>1</sup> him\u0002 / \u0001to ask if he wanted to run \u0001for<sup>2</sup> student president<sup>3</sup>\u0002\u0002.", "pk": "\u0001\u0001교실로\u0002 가는 길에\u0002, / Steve의 선생님이 \u0001그에게\u0002 다가왔다 / \u0001그가 \u0001학생회장에\u0002 출마하고 싶은지 묻기 위해\u0002.", "core": "Steve의 선생님이 다가왔다.", "tags": ["On his way = 전치사구(부사구): came up to를 꾸밈 (때). to the classroom = 형용사구: way를 꾸밈", "주어 teacher + 동사 came up (구동사, 1형식). to him = 전치사구(부사구): came up 꾸밈, 거의 필수에 가까운 부사구 [기준: 모양 규칙]", "to ask ~ = to부정사(부사적: 목적): came up 꾸밈. if절 = 명사절(ask의 목적어). run for ~ = 전치사구(부사구): run 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V(1형식) + 목적의 to부정사</b>이다. 앞에 전치사구가 있고 뒤에 if절이 이어져 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Steve's teacher (Steve의 선생님)", "V: came up (come up 다가오다의 과거형)", "뼈대 = <b>Steve's teacher came up</b>", "<b>to him</b> (그에게)은 come up to 짝이라 거의 필수에 가까운 부사구이다. (문형 기준)", "him = Steve"]}, {"t": "맨 앞 <b>On his way to the classroom</b>은 <b>전치사구(부사구)</b>이다. '교실로 가는 길에'라는 뜻으로 때를 꾸민다.", "sub": ["way = 길, classroom = 교실", "to the classroom은 way를 꾸미는 형용사구이다."]}, {"t": "<b>to ask if he wanted to run for student president</b>는 <b>to부정사(부사적: 목적)</b>이다. '그가 학생회장에 출마하고 싶은지 묻기 위해'라는 뜻이다.", "sub": ["ask = 묻다, want = 원하다(wanted는 과거형), if = ~인지 아닌지, run for = ~에 출마하다, president = 회장", "if절은 ask의 목적어가 되는 명사절이다."]}], "sum": "선생님이 Steve에게 다가가 학생회장 출마 의사를 물음"}, {"i": "07", "q": "10", "s": "B-3", "title": "It was not until ~ that 강조구문", "eng": "It wasn't until later that evening, on the way home, / that Dave said apologetically<sup>1</sup>, / “I'm so sorry, Steve! This election<sup>2</sup> hasn't damaged<sup>3</sup> our friendship, has it?”", "notes": [["1", "apologetically", "미안해하며"], ["2", "election", "선거"], ["3", "damage", "손상시키다, 해치다"]], "lit": "그날 저녁 늦게, 집으로 가는 길이 되어서야 비로소 / Dave가 미안해하며 말했다, / “정말 미안해, Steve! 이번 선거가 우리 우정을 해친 건 아니지, 그렇지?”", "nat": "그날 저녁 늦게 집으로 돌아가는 길이 되어서야 비로소 Dave가 미안해하며 말했다. “정말 미안해, Steve! 이번 선거가 우리 우정을 해친 건 아니지, 그렇지?”", "ana": "<b>It is not until A that B</b>는 '<b>A가 되어서야 비로소 B하다</b>'라는 강조구문이다. 원래 문장은 Dave did not say ~ until later that evening인데, 강조하고 싶은 <b>until later that evening</b>을 It was와 that 사이로 끌어냈다. 이때 <b>that은 해석하지 않는다</b>. 가주어 구문과 헷갈리면 <b>It was와 that을 지워</b> 보라. 남은 말들로 문장이 성립하면 강조구문이다. 문장 끝의 <b>has it?</b>은 앞이 <b>hasn't damaged</b>라는 부정문이므로 <b>긍정</b>으로 되묻는 <b>부가의문문</b>이며, '<b>그렇지?</b>'처럼 확인을 구하는 말이다.", "pe": "It wasn't until later that evening, \u0001on the way home\u0002, / that Dave said \u0001apologetically<sup>1</sup>\u0002, / “I'm so sorry, Steve! This election<sup>2</sup> hasn't damaged<sup>3</sup> our friendship, has it?”", "pk": "그날 저녁 늦게, \u0001집으로 가는 길\u0002이 되어서야 비로소 / Dave가 \u0001미안해하며\u0002 말했다, / “정말 미안해, Steve! 이번 선거가 우리 우정을 해친 건 아니지, 그렇지?”", "core": "그날 저녁 늦게가 되어서야 비로소 Dave가 말했다.", "tags": ["<b>It was not until A that B</b> = A가 되어서야 비로소 B. on the way home = 전치사구(부사구, 삽입): later that evening을 보충", "that 이하 = 강조 구문의 나머지: 주어 Dave + 동사 said. apologetically = 부사: said를 꾸밈", "said의 목적어인 직접 인용문 = 뼈대. has it? = 부가의문문 (hasn't damaged에 맞춤)"], "steps": [{"t": "이 문장은 <b>It was not until A that B</b> 강조구문이다. 'A가 되어서야 비로소 B했다'라는 뜻이다. 앞 부분이 길어 보인다."}, {"t": "뼈대부터 찾는다. that 이하에서 It was not until을 빼고 읽는다.", "sub": ["S: Dave (사람 이름)", "V: said (say 말하다의 과거형)", "O: 따옴표 안 인용문", "뼈대 = <b>Dave said ~</b>", "apologetically (미안해하며)는 said를 꾸미는 부사이다. apologize = 사과하다"]}, {"t": "강조된 부분은 <b>later that evening</b> (그날 저녁 늦게)이다. 그리고 <b>on the way home</b> (집으로 가는 길에)은 그 시점을 보충하는 전치사구이다.", "sub": ["way = 길"]}, {"t": "said의 목적어인 인용문의 뼈대는 <b>This election hasn't damaged our friendship</b> (이번 선거가 우리 우정을 해친 건 아니다)이다.", "sub": ["election = 선거, damage = 해치다, friendship = 우정", "hasn't damaged는 현재완료 부정이다."]}, {"t": "끝의 <b>has it?</b>은 <b>부가의문문</b>이다. '그렇지?'라는 뜻이다. 앞이 부정문(hasn't)이라 긍정으로 묻는다."}], "sum": "저녁 늦게 집에 가는 길에야 Dave가 사과하며 우정 걱정 꺼냄"}, {"i": "08", "q": "10", "s": "D-2", "title": "Just as 시간절 + 삽입 관계절 + 목적의 to부정사", "eng": "Just as he reached<sup>1</sup> the end of the street, / Dave's dad, who was driving Dave to school, / pulled over<sup>2</sup> to give him a ride<sup>3</sup>.", "notes": [["1", "reach", "~에 이르다, 다다르다"], ["2", "pull over", "(차를) 길가에 세우다"], ["3", "give A a ride", "A를 태워 주다"]], "lit": "그가 그 거리의 끝에 막 다다랐을 때, / Dave를 학교에 태워다 주고 있던 Dave의 아버지가 / 차를 세워 그를 태워 주었다.", "nat": "그가 막 거리 끝에 다다랐을 때, Dave를 학교에 태워다 주던 Dave의 아버지가 차를 세워 그를 태워 주었다.", "ana": "여기서 <b>as</b>는 '~처럼'이 아니라 '<b>~할 때</b>'라는 <b>시간</b>의 접속사이고, 앞의 <b>Just</b>가 붙어 '<b>막 ~하던 바로 그때</b>'라는 뜻을 만든다. 주절로 넘어오면 주어 <b>Dave's dad</b> 바로 뒤에 <b>콤마 + who절 + 콤마</b>가 끼어들어 <b>주어와 동사가 갈라진다</b>. 이렇게 콤마 두 개 사이에 관계절이 들어오면 통째로 괄호로 묶고, <b>Dave's dad pulled over</b>라는 뼈대부터 확정해야 한다. <b>pull over</b>는 '<b>차를 길가에 세우다</b>'이고, 이어지는 <b>to give him a ride</b>는 목적의 to부정사로 '<b>태워 주려고</b>'라는 뜻이다.", "pe": "\u0001Just as he reached<sup>1</sup> the end of the street\u0002, / Dave's dad, \u0001who was driving Dave to school\u0002, / pulled over<sup>2</sup> \u0001to give him a ride<sup>3</sup>\u0002.", "pk": "\u0001그가 그 거리의 끝에 막 다다랐을 때\u0002, / \u0001Dave를 학교에 태워다 주고 있던\u0002 Dave의 아버지가 / 차를 세워 그를 태워 주었다.", "core": "Dave의 아버지가 차를 세웠다.", "tags": ["Just as절 = 부사절(때): pulled over를 꾸밈. just = 부사(바로 ~할 때)", "주어 Dave's dad. who절 = 계속적 관계절(형용사절): dad를 보충 설명. 콤마 사이에 끼어 있어 동사를 건너뛰고 찾기", "동사 pulled over(구동사 = 차를 세우다). to give ~ = to부정사(부사적: 목적): pulled over를 꾸밈. <b>give A B</b> 4형식"], "steps": [{"t": "이 문장은 <b>부사절 + S+V(1형식)</b>이다. 주어 뒤에 관계절이 끼어 동사가 늦게 나온다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Dave's dad (Dave의 아버지)", "V: pulled over (pull over 차를 세우다의 과거형)", "뼈대 = <b>Dave's dad pulled over</b>"]}, {"t": "주어 뒤 <b>who was driving Dave to school</b>은 <b>계속적 관계절(형용사절)</b>로 Dave's dad를 설명한다. '(그분은) Dave를 학교에 태워다 주던 중이었는데'.", "sub": ["drive A to B = A를 B까지 태워다 주다", "콤마 사이에 끼어 있으니 빼고 읽으면 주어 다음에 바로 동사 pulled over가 온다."]}, {"t": "맨 앞 <b>Just as he reached the end of the street</b>는 <b>시간 부사절</b>이다. '그가 그 거리의 끝에 막 다다랐을 때'라는 뜻이다.", "sub": ["just as = ~하는 바로 그 때, reach = 다다르다, end = 끝, street = 거리"]}, {"t": "<b>to give him a ride</b>는 <b>to부정사(부사적: 목적)</b>이다. '그를 태워 주려고'라는 뜻으로 pulled over를 꾸민다.", "sub": ["give A B = A에게 B를 주다 (4형식), ride = 타기, 태워 줌"]}], "sum": "Dave 아버지, 거리 끝에 선 그를 차 세워 태워 줌"}], "qs": [{"q": "07", "type": "밑줄 의미", "src": "2020학년도 9월 21번", "ans": "①", "tr": [["1", "오랫동안 관광은 토착민들의 영역을 침범해 그들을 현대 세계의 폐해에 접하게 하는 거대한 괴물로 여겨졌다."], ["2", "그러나 연구는 이것이 관광을 바라보는 올바른 방식이 아님을 보여 주었다."], ["3", "대부분의 지역에서 관광객은 환영받으며, 토착민들은 관광을 현대화와 경제 발전으로 가는 길로 여긴다."], ["4", "그러나 그런 발전은 언제나 양날의 검이다."], ["5", "관광은 발전을 뜻할 수 있지만, 대개는 전통과 문화적 고유성의 상실도 뜻한다."], ["6", "그리고 물론 ‘문화 오염’, ‘저속화’, ‘가짜 민속 문화’의 사례들도 있다."], ["7", "그런 특징들의 배경은 대개 다소 낭만적이며, 과거의 혹은 지금 널리 퍼져 있는 진정성에 대한 규범적 관념이다."], ["8", "(일부 사람들에게) 이상적으로는, 현대의 소비자들이 여행 중이나 휴가 중에 바라보거나 심지어 잠시 들어가 볼 수 있는 고대 문화가 존재해야 한다."], ["9", "이것이 바로 토착민이든 아니든 우리 모두가 같은 사회 구조의 일부인 전 지구적 세계에서는 옹호하기 어려운 ‘우리(cage) 모델’이다."]], "evh": "8번 문장", "ev": [{"en": true, "h": "Ideally (to some) there should exist ancient cultures for modern consumers to gaze at, or even step into for a while, while travelling or on holiday."}, {"en": false, "h": "밑줄 의미 문항은 <b>밑줄 바로 앞 문장</b>이 그 비유의 내용을 그대로 풀어 준다. 9번 문장의 <b>This</b>가 가리키는 것이 8번 문장이기 때문이다. 8번 문장을 보면 현대의 <b>소비자들</b>이 여행길에 <b>바라보고</b>(gaze at) <b>잠시 들어가 볼</b>(step into) 수 있도록 고대 문화가 <b>그대로 남아 있어야 한다</b>고 말한다. 즉 문화를 산 사람들의 삶이 아니라 <b>구경거리</b>로 묶어 두는 발상이다. 우리(cage)라는 말이 붙은 이유가 여기에 있다. 그러므로 밑줄은 <b>소비를 위해 과거 문화를 원래 형태 그대로 보존하는 것</b>을 뜻한다."}], "opts": [{"n": "①", "t": "preserving a past culture in its original form for consumption (소비를 위해 과거 문화를 원래 형태로 보존하는 것)", "a": true, "x": false, "trap": false, "e": "8번 문장의 <b>ancient cultures for modern consumers to gaze at</b>를 그대로 옮겼다. <b>consumers</b>가 consumption과 직접 이어진다."}, {"n": "②", "t": "restoring local cultural heritages that have long been neglected (오랫동안 방치된 지역 문화유산을 복원하는 것)", "a": false, "x": true, "trap": false, "e": "글에 <b>복원(restore)</b>이나 방치된 유산 이야기가 없다. 문제 삼는 것은 복원이 아니라 <b>그대로 가두어 두려는 태도</b>다."}, {"n": "③", "t": "limiting public access to prehistoric sites for conservation (보존을 위해 선사 유적지의 일반인 접근을 제한하는 것)", "a": false, "x": true, "trap": false, "e": "8번 문장은 오히려 관광객이 <b>들어가 볼 수 있어야 한다</b>고 말한다. 접근을 <b>막는</b> 것이 아니라 <b>열어 두는</b> 쪽이다."}, {"n": "④", "t": "confining tourism research to authentic cultural traditions (관광 연구를 진정한 문화 전통에 한정하는 것)", "a": false, "x": true, "trap": true, "e": "<b>authenticity</b>라는 단어가 7번 문장에 나와 그럴듯하지만, 갇히는 대상은 <b>연구</b>가 아니라 <b>문화 그 자체</b>다."}, {"n": "⑤", "t": "maintaining a budget for cultural policies and regulations (문화 정책과 규제를 위한 예산을 유지하는 것)", "a": false, "x": true, "trap": false, "e": "예산이나 정책·규제는 글에 등장하지 않는다. 경제 이야기는 3번 문장의 <b>economic development</b>가 전부다."}], "w": [["indigenous", "토착의, 원주민의"], ["invade", "침범하다, 침략하다"], ["perceive", "인식하다, 여기다"], ["modernity", "현대성, 근대"], ["two-edged sword", "양날의 검"], ["vulgarization", "상스럽게 만듦, 저속화"], ["phony", "가짜의"], ["normative", "규범적인"], ["prevailing", "널리 퍼져 있는, 지배적인"], ["authenticity", "진정성, 진짜임"], ["gaze at", "~을 바라보다"], ["social fabric", "사회 구조"]]}, {"q": "08", "type": "무관한 문장", "src": "2019학년도 6월 35번", "ans": "④", "tr": [["1", "내향적인 사람으로 사는 것에는 어려움이 따르지만, 분명 장점도 있다."], ["2", "예를 들어 내향적인 사람은, 의견이 마음에 들지 않는 상대를 무심코 모욕하는 것 같은, 사회적 상황에서의 실수를 저지를 가능성이 훨씬 더 낮다."], ["3", "① 내향적인 사람은 자기 생각을 곱씹는 것을 즐길 것이고, 그래서 외부 자극이 없어도 지루함에 시달릴 가능성이 훨씬 더 낮다."], ["4", "② 내향적인 사람으로서 당신이 마주할 유일한 위험은, 당신을 모르는 사람들이 당신을 냉담하다고 여기거나 당신이 스스로를 그들보다 낫다고 여긴다고 생각할지도 모른다는 점이다."], ["5", "③ 자신의 의견과 생각을 조금만 털어놓는 법을 배운다면, 당신은 두 세계 모두에서 잘 해낼 수 있을 것이다."], ["6", "④ 내향적인 사람은, 관계에 대해 일시적으로 확신이 서지 않을 때 당신이 그러하듯, 대면 소통보다 온라인 소통을 더 좋아할 수도 있다."], ["7", "⑤ 그러면 당신은 비사교적으로 보이지 않으면서도 자신의 성격에 충실할 수 있다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "If you learn how to open up just a little bit with your opinions and thoughts, you will be able to thrive in both worlds."}, {"en": false, "h": "무관한 문장 문항은 <b>바로 앞뒤 문장이 서로 이어지는지</b>를 확인하면 잡힌다. 이 글의 뼈대는 '<b>내향성에는 장점이 있다</b>'(1번)로 시작해, 3·4번 문장에서 장점과 그에 따르는 위험을 말하고, 5번 문장이 <b>조금만 털어놓으면 두 세계 모두에서 잘 해낼 수 있다</b>는 해법을 제시한다. 그리고 7번 문장의 <b>You can then ~</b>은 그 해법의 <b>결과</b>이므로 5번 문장에 곧바로 붙어야 자연스럽다. 그런데 6번 문장은 온라인 소통 선호라는 <b>새로운 화제</b>를 꺼내 5번과 7번 사이를 끊어 놓는다. 따라서 6번 문장이 무관한 문장이다."}], "opts": [{"n": "①", "t": "내향적인 사람은 자기 생각을 곱씹는 것을 즐길 것이다", "a": false, "x": true, "trap": false, "e": "1번 문장이 말한 <b>장점(advantages)</b>의 구체적인 예다. 2번 문장의 예와 나란히 놓인다."}, {"n": "②", "t": "내향적인 사람으로서 마주할 유일한 위험은 ~이다", "a": false, "x": true, "trap": false, "e": "장점을 말한 뒤 <b>The only risk</b>로 한 발 물러서는 자연스러운 전개다. 뒤의 해법을 꺼내기 위한 발판이다."}, {"n": "③", "t": "조금만 털어놓는 법을 배우면 두 세계 모두에서 잘 해낼 수 있다", "a": false, "x": true, "trap": false, "e": "바로 앞에서 말한 <b>위험</b>에 대한 해법이다. 그리고 마지막 문장의 <b>You can then ~</b>이 이 문장을 받는다."}, {"n": "④", "t": "내향적인 사람은 대면 소통보다 온라인 소통을 더 좋아할 수도 있다", "a": true, "x": false, "trap": false, "e": "<b>온라인 소통 선호</b>는 앞뒤 어디에서도 다루지 않는 새 화제다. 해법(③)과 그 결과(⑤) 사이를 끊어 놓는다."}, {"n": "⑤", "t": "비사교적으로 보이지 않으면서도 자신의 성격에 충실할 수 있다", "a": false, "x": true, "trap": true, "e": "<b>then</b>이 앞 문장의 조건을 받는다. ③의 '조금만 털어놓으면'에 이어지는 결과이므로 흐름에 꼭 맞는다."}], "w": [["introvert", "내향적인 사람"], ["come with", "~을 수반하다"], ["inadvertently", "무심코, 본의 아니게"], ["insult", "모욕하다"], ["agreeable", "마음에 드는"], ["reflect on", "~을 곰곰이 생각하다"], ["boredom", "지루함"], ["stimulation", "자극"], ["aloof", "냉담한, 무관심한"], ["open up", "(속마음을) 털어놓다"], ["thrive", "잘 해내다, 번영하다"], ["antisocial", "비사교적인"]]}, {"q": "09", "type": "글의 순서", "src": "2021년 3월 36번", "ans": "③", "tr": [["1", "경제생활에서 전형적인 포지티브섬 게임은 잉여물의 교환이다."], ["2", "(B) 농부가 자신이 먹을 수 있는 것보다 더 많은 곡식을 가지고 있고 목축업자가 자신이 마실 수 있는 것보다 더 많은 우유를 가지고 있다면, 밀 얼마와 우유 얼마를 교환할 경우 둘 다 이득을 본다."], ["3", "사람들이 말하듯, 모두가 이긴다."], ["4", "물론 한 시점에 이루어지는 교환은 분업이 있을 때만 이득이 된다."], ["5", "(C) 한 농부가 다른 농부에게 밀 1부셸을 주고 그 대가로 밀 1부셸을 받는 것은 아무런 의미가 없을 것이다."], ["6", "현대 경제학의 근본적인 통찰은 부의 창출의 핵심이 분업이라는 것인데, 그 분업 속에서 전문가들은 점점 더 높은 비용 효율성으로 상품을 생산하는 법을 배우고 자신들의 특화된 상품을 효율적으로 교환할 수단을 갖게 된다."], ["7", "(A) 효율적인 교환을 가능하게 하는 한 가지 기반은 운송인데, 이는 생산자들이 거리로 떨어져 있을 때에도 잉여물을 교환할 수 있게 해 준다."], ["8", "또 다른 기반은 돈, 이자, 중간 상인인데, 이것들은 생산자들이 여러 시점에 걸쳐 많은 다른 생산자들과 여러 종류의 잉여물을 교환할 수 있게 해 준다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "Of course, an exchange at a single moment in time only pays when there is a division of labor."}, {"en": false, "h": "순서 문항은 <b>새로 등장한 말을 다음 단락이 받아 주는지</b>로 잇는다. 주어진 글은 <b>trading of surpluses</b>(잉여물의 교환)를 화제로 던지고, (B)가 곡식과 우유라는 <b>구체적인 예</b>로 그것을 설명하므로 (B)가 먼저다. 그리고 (B)의 마지막 4번 문장이 <b>a division of labor</b>(분업)를 처음 꺼낸다. (C)의 첫 문장은 같은 밀끼리 바꾸는 것은 의미가 없다며 <b>왜 분업이 필요한지</b>를 이어서 설명하고, 6번 문장에서 분업을 정면으로 정의한다. 마지막으로 (A)는 그 교환을 가능하게 하는 <b>기반(infrastructure)</b>을 말하므로 맨 뒤다. 따라서 <b>(B) – (C) – (A)</b>."}], "opts": [{"n": "①", "t": "(A) – (C) – (B)", "a": false, "x": true, "trap": false, "e": "(A)의 <b>One infrastructure that allows efficient exchange</b>는 교환의 필요성이 이미 설명된 뒤에야 나올 수 있다. 첫머리에 올 수 없다."}, {"n": "②", "t": "(B) – (A) – (C)", "a": false, "x": true, "trap": false, "e": "(B) 끝에서 <b>division of labor</b>가 처음 나왔으므로, 그 말을 곧바로 풀어 주는 (C)가 와야 한다. (A)는 그 뒤다."}, {"n": "③", "t": "(B) – (C) – (A)", "a": true, "x": false, "trap": false, "e": "주어진 글의 잉여물 교환 → (B) 곡식·우유의 예와 분업 언급 → (C) 분업이 왜 필요한지 → (A) 교환을 가능하게 하는 기반. 화제가 한 칸씩 이어진다."}, {"n": "④", "t": "(C) – (A) – (B)", "a": false, "x": true, "trap": true, "e": "(C)의 첫 문장은 밀끼리 바꾸는 상황을 <b>이미 아는 것처럼</b> 시작한다. 그 상황을 만든 (B)가 앞에 있어야 한다."}, {"n": "⑤", "t": "(C) – (B) – (A)", "a": false, "x": true, "trap": false, "e": "(B)의 4번 문장이 분업을 <b>처음</b> 소개하는데, (C)는 이미 분업을 정의하고 있다. 순서가 뒤집혀 있다."}], "w": [["classic", "전형적인"], ["surplus", "잉여물, 여분"], ["infrastructure", "기반 시설"], ["make it possible for A to V", "A가 ~할 수 있게 하다"], ["middleman", "중간 상인"], ["herder", "목축업자"], ["come out ahead", "결국 이득을 보다"], ["pay", "이득이 되다"], ["division of labor", "분업"], ["bushel", "부셸(곡물의 부피 단위)"], ["commodity", "상품, 물품"], ["cost-effectiveness", "비용 효율성"]]}, {"q": "10", "type": "장문 · 글의 순서", "src": "2018학년도 수능 43번", "ans": "③", "tr": [["1", "(A) 새 학기 첫날이었다."], ["2", "Steve와 Dave는 다시 학교로 돌아온다는 사실에 들떠 있었다."], ["3", "그날 아침 그들은 늘 그랬듯 함께 자전거를 타고 학교에 갔다."], ["4", "Dave는 1층에서 수학 수업이 있었고, Steve는 2층에서 역사 수업이 있었다."], ["5", "교실로 가는 길에 Steve의 선생님이 그에게 다가와 (a)그가 학생회장에 출마할 생각이 있는지 물었다."], ["6", "Steve는 잠시 생각하더니 대답했다. “물론이죠, 좋은 경험이 될 거예요.”"], ["7", "(C) 수업이 끝난 뒤 Steve는 복도에서 Dave를 발견하고 신이 나서 달려갔다. “좋은 소식이 있어! 나 학생회장에 나가는데, 내 이름이 유일한 후보일 것 같아.”"], ["8", "Dave는 헛기침을 하더니 놀란 표정으로 대답했다. “실은 나도 방금 이름을 등록했어!”"], ["9", "(d)그는 날카롭게 말을 이었다. “그럼, 행운을 빌어! 하지만 네가 선거에서 이길 거라고는 생각하지 마, Steve.”"], ["10", "Dave는 빠르게 걸어가 버렸고, 그 순간부터 두 친구 사이에는 불편한 긴장감이 감돌았다."], ["11", "Steve는 Dave에게 다정하게 대하려 했지만, Dave는 전혀 신경 쓰지 않는 듯했다."], ["12", "(D) 선거일이 되었을 때, Steve는 자전거 타이어가 펑크 난 것을 알고 학교까지 뛰어가기 시작했다."], ["13", "그가 막 거리 끝에 다다랐을 때, Dave를 학교에 태워다 주던 Dave의 아버지가 차를 세워 그를 태워 주었다."], ["14", "차 안의 쥐 죽은 듯한 침묵이 그 길을 괴롭게 만들었다."], ["15", "좋지 않은 분위기를 알아차린 Dave의 아버지가 말했다. “있잖니, 너희 중 한 명만 이길 수 있단다. 너희는 태어날 때부터 서로를 알고 지냈어. 이번 선거가 너희 우정을 망치게 두지 마라. 서로를 위해 기뻐해 주려무나!”"], ["16", "그 말은 Dave에게 큰 충격을 주었다."], ["17", "Steve를     if(c[p]){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}t.textContent='오답노트장에 담았어요';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},1400);}
  });
  const lk=$('#lock');if(lk)lk.onclick=()=>{
    if(armed==='lock'){S.locked[WS.id]=1;armed=null;save();
      recSend({type:'word',marks:noteList().map(it=>({w:it.w.w,parts:it.parts}))});}
    else armed='lock';
    render();
  };
}
function renderNote(){
  const list=noteList();
  let h=`<header><div class="wrap hd2"><h1>단어 오답노트 <span class="meta">${list.length}개</span></h1><button class="link" id="back">확인표</button></div></header><div class="wrap">`;
  if(!list.length)h+=`<div class="empty">아직 표시한 단어가 없습니다</div>`;
  list.forEach(it=>{
    const w=it.w,r=(S.res[WS.id]||{})[it.i]||{};
    h+=`<div class="note-item"><span class="w">${esc(w.w)}</span><span class="meta">${esc(w.src)}번</span>`;
    const row=(p,tag,txt,ko)=>{
      const bad=it.parts.includes(p);
      const rs=r[p]===1?'<span class="res o">맞춤</span>':r[p]===0?'<span class="res x">틀림</span>':'';
      return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}
/* ---- 답 제출 ---- */
function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}
/* ---- 해설 ---- */
function qHtml(i,a){
  const esc=String;
  const d=D[i],ok=isRight(i,a);
  const cq=CF.qs.find(x=>x.q===d.no);
  if(!cq)return '';
  let h='<details class="qd" id="qd'+i+'" '+(ok?'':'open')+'><summary>'+esc(cq.q)+'번 · '+esc(cq.type)+'<small>'+esc(cq.src)+'</small><span class="res2 '+(ok?'o':'x')+'">'+(ok?'○ 정답':'✕ 오답')+'</span></summary><div class="qx">';
  h+='<p class="ansline"><b>정답 '+esc(cq.ans)+'</b>'+(ok?'':' &nbsp;<span style="color:var(--bad)">내 답 '+CIRC[a-1]+'</span>')+'</p>';
  h+='<details class="sub2"><summary>전문 해석</summary><ol class="trs" style="list-style:none">'+cq.tr.map(t=>'<li><span class="n">'+(t[0]==null?'':esc(t[0]))+'</span>'+t[1]+'</li>').join('')+'</ol></details>';
  h+='<div class="sec">답의 근거 · '+esc(cq.evh)+'</div><div class="evx">';
  cq.ev.forEach(p=>{h+=p.en?'<p class="en">'+p.h+'</p>':'<p>'+p.h+'</p>';});
  h+='</div><div class="sec">선택지 하나씩</div>';
  cq.opts.forEach(o=>{
    h+='<div class="opx '+(o.a?'a':'')+'"><div class="ot"><span class="mk">'+esc(o.n)+'</span>'+o.t+(o.a?'<span class="bd g">정답</span>':'')+(o.trap?'<span class="bd t">가장 많이 걸리는 오답</span>':'')+'</div>'+(o.e?'<p>'+(o.x?'<span class="xm">✕</span>':'')+o.e+'</p>':'')+'</div>';
  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
