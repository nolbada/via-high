 맞아요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(D) – (B) – (C)</span><span class=\"why\">(D)까지는 맞지만, 피아노 문제 바로 뒤에 연주가 시작돼요. (C)에서 키스가 차로 가 버렸다가 다시 걸어 나오는 장면이 연주보다 뒤로 밀려 시간순이 깨져요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(B) – (D) – (C)</span><span class=\"why\">주어진 글은 “밤에 연주할 것이었다”로 끝나는데, (B)가 바로 연주를 시작해요. 그다음 (D)의 그날 오후 피아노를 미리 보여 주는 장면으로 시간이 거꾸로 가요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">(C) – (B) – (D)</span><span class=\"why\">(C)의 Understandably(당연히) 공연하기 싫었다는 말 앞에 이유(나쁜 피아노)가 없어요. 이유는 (D)에 나와요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(C) – (D) – (B)</span><span class=\"why\">역시 (C)가 먼저 와서 Understandably(당연히)가 가리킬 이유가 없어요. 이유를 담은 (D)가 (C)보다 먼저예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">(A) A seventeen-year-old German boy</div><div class=\"k\">(A) 17살 된 독일 소년이</div></div><div class=\"rc\"><div class=\"e\">named Erik Brandes</div><div class=\"k\">Erik Brandes라는 이름의</div></div><div class=\"rc\"><div class=\"e\">stepped out onto the empty vast stage</div><div class=\"k\">비어 있는 거대한 무대 위로 나갔다</div></div><div class=\"rc\"><div class=\"e\">of the Cologne Opera House.</div><div class=\"k\">Cologne(쾰른) 오페라 하우스의.</div></div><div class=\"rnat\">(A)(1) Erik Brandes라는 이름의 17살 된 독일 소년은 Cologne(쾰른) 오페라 하우스의 비어 있는 거대한 무대 위로 나갔다.</div><div class=\"rst\">학생회장이 축제 무대를 직접 준비한 것처럼, 17살 에릭이 쾰른 오페라 하우스의 텅 빈 큰 무대에 올라섰어요. 지문 (A)의 시작이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">It was the most exciting day</div><div class=\"k\">가장 흥분된 날이었다</div></div><div class=\"rc\"><div class=\"e\">of Erik’s life.</div><div class=\"k\">Erik의 인생에서.</div></div><div class=\"rnat\">(A)(2) Erik의 인생에서 가장 흥분된 날이었다.</div><div class=\"rst\">축제 날 학생회장처럼 에릭에게도 인생에서 가장 신나는 날이었어요. = 지문의 가장 흥분된 날.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">(a) The youngest concert promoter in Germany</div><div class=\"k\">독일에서 (a) 가장 어린 그 콘서트 기획자(= Erik)는</div></div><div class=\"rc\"><div class=\"e\">had persuaded the Opera House</div><div class=\"k\">오페라 하우스를 설득했던 것이다</div></div><div class=\"rc\"><div class=\"e\">to host a late-night concert</div><div class=\"k\">심야 콘서트를 주최하도록</div></div><div class=\"rc\"><div class=\"e\">of improvised jazz</div><div class=\"k\">즉흥 재즈의</div></div><div class=\"rc\"><div class=\"e\">by the American pianist Keith Jarrett.</div><div class=\"k\">미국의 피아니스트인 Keith Jarrett의.</div></div><div class=\"rnat\">(A)(3) 독일에서 (a)가장 어린 그 콘서트 기획자(Erik)는 오페라 하우스가 미국의 피아니스트인 Keith Jarrett의 심야 즉흥 재즈 콘서트를 주최하도록 설득했던 것이다.</div><div class=\"rst\">에릭은 독일에서 가장 어린 공연 기획자예요. 미국 피아니스트 키스의 밤 재즈 공연을 열자고 오페라 하우스를 설득했어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><span class=\"ordc\">정답 순서 주어진 글</span><div class=\"rc\"><div class=\"e\">The concert was a sellout,</div><div class=\"k\">그 콘서트는 매진이었다,</div></div><div class=\"rc\"><div class=\"e\">and later that evening,</div><div class=\"k\">그리고 그날 늦은 밤,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Keith would sit down at the piano</span></div><div class=\"k\"><span class=\"cw\">Keith가 피아노 앞에 앉을 것이었다</span></div></div><div class=\"rc\"><div class=\"e\">and play.</div><div class=\"k\">그리고 연주할 (것이었다).</div></div><div class=\"rnat\">(A)(4) 그 콘서트는 매진이었고, 그날 늦은 밤, Keith가 피아노 앞에 앉아 연주할 것이었다.</div><div class=\"rst\">표는 다 팔렸고, 그날 밤 키스가 <b>피아노 앞에 앉아</b> 연주할 예정이었어요. 기대로 부푼 채 주어진 글이 끝나요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">(D)(1)번 · 단서</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(D) But when Erik introduced Keith</span></div><div class=\"k\"><span class=\"cw\">(D) 하지만 Erik이 Keith를 안내했을 때</span></div></div><div class=\"rc\"><div class=\"e\">and his producer Manfred</div><div class=\"k\">그리고 그(= Keith)의 제작자 Manfred를</div></div><div class=\"rc\"><div class=\"e\">to the piano on the stage</div><div class=\"k\">무대 위 피아노로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">that afternoon,</span></div><div class=\"k\"><span class=\"cw\">그날 오후,</span></div></div><div class=\"rc\"><div class=\"e\">it didn’t go well.</div><div class=\"k\">일이 틀어졌다.</div></div><div class=\"rnat\">(D)(1) 하지만 Erik이 그날 오후 Keith와 그의 제작자 Manfred를 무대 위 피아노로 안내했을 때, 일이 틀어졌다.</div><div class=\"rst\"><b>하지만</b>(But) <b>그날 오후</b>(that afternoon) 에릭이 키스를 무대 피아노로 안내해 미리 보여 주자 일이 틀어졌어요. 기대를 뒤집는 고리예요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(D)(2)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Keith and Manfred played a few notes.</div><div class=\"k\">Keith와 Manfred는 몇 개의 음을 연주했다.</div></div><div class=\"rnat\">(D)(2) Keith와 Manfred는 몇 개의 음을 연주했다.</div><div class=\"rst\">키스와 제작자 만프레드가 피아노 건반을 몇 개 눌러 봤어요. 지문의 몇 개의 음 연주예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(D)(3)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Then after a long silence,</div><div class=\"k\">그러고 나서 긴 침묵 후에,</div></div><div class=\"rc\"><div class=\"e\">Manfred came to (e) him and said,</div><div class=\"k\">Manfred는 (e) 그(= Erik)에게 와서 말했다,</div></div><div class=\"rc\"><div class=\"e\">“Erik, if you don’t get another piano,</div><div class=\"k\">“Erik, 만약 당신이 다른 피아노를 가져오지 않는다면,</div></div><div class=\"rc\"><div class=\"e\">Keith can’t play tonight.”</div><div class=\"k\">Keith는 오늘 밤에 연주할 수 없어요.”</div></div><div class=\"rnat\">(D)(3) 그러고 나서 긴 침묵 후에, Manfred는 (e)그(Erik)에게 와서 “Erik, 만약 당신이 다른 피아노를 가져오지 않는다면, Keith는 오늘 밤에 연주할 수 없어요.”라고 말했다.</div><div class=\"rst\">한참 조용하더니 만프레드가 “다른 피아노 없으면 오늘 밤 연주 못 해요”라고 해요. 축제 날 마이크가 고장 난 것 같은 위기예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(D)(4)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">Erik knew</div><div class=\"k\">Erik은 알고 있었다</div></div><div class=\"rc\"><div class=\"e\">that Keith had requested a specific instrument,</div><div class=\"k\">Keith가 특정 악기를 요청했다는 것을,</div></div><div class=\"rc\"><div class=\"e\">which the Opera House had agreed to provide.</div><div class=\"k\">그리고 그것(= 그 특정 악기)을 오페라 하우스가 제공하기로 동의했다는 것을.</div></div><div class=\"rnat\">(D)(4) Erik은 Keith가 특정 악기를 요청했고, 그것(특정 악기)을 오페라 하우스가 제공하기로 동의했다는 것을 알고 있었다.</div><div class=\"rst\">에릭은 키스가 특정 피아노를 부탁했고 오페라 하우스가 준비하기로 한 걸 알고 있었어요. = 지문 (D)(4).</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(D)(5)번</span><span class=\"ordc\">정답 순서 (D)</span><div class=\"rc\"><div class=\"e\">What he hadn’t realized was</div><div class=\"k\">그(= Erik)가 알아차리지 못했던 것은 ~이었다</div></div><div class=\"rc\"><div class=\"e\">that the administrative staff</div><div class=\"k\">관리 직원이</div></div><div class=\"rc\"><div class=\"e\">hadn’t been able to find</div><div class=\"k\">찾을 수 없었다는 것</div></div><div class=\"rc\"><div class=\"e\">the requested Bösendorfer piano,</div><div class=\"k\">요청된 Bösendorfer 피아노를,</div></div><div class=\"rc\"><div class=\"e\">and they had instead installed</div><div class=\"k\">그리고 그들(= 관리 직원)은 대신 설치했다는 것</div></div><div class=\"rc\"><div class=\"e\">a tiny little Bösendorfer</div><div class=\"k\">아주 작은 Bösendorfer (피아노)를</div></div><div class=\"rc\"><div class=\"e\">that was in poor condition.</div><div class=\"k\">상태가 좋지 않았던.</div></div><div class=\"rnat\">(D)(5) 그(Erik)가 알아차리지 못했던 것은 관리 직원이 요청된 Bösendorfer 피아노를 찾을 수 없어서, 그들은 그 대신 상태가 좋지 않았던 아주 작은 Bösendorfer (피아노)를 설치했다는 것이었다.</div><div class=\"rst\">그런데 직원들이 그 피아노를 못 찾고, 대신 <b>상태가 나쁜</b> 작은 피아노를 갖다 놓은 거예요. 이게 문제의 정체예요.</div></div><div class=\"rds key\" data-ord=\"10\"><span class=\"rn\">(C)(1)번 · 단서</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(C) Understandably,</span></div><div class=\"k\"><span class=\"cw\">(C) 당연히,</span></div></div><div class=\"rc\"><div class=\"e\">Keith didn’t want to perform.</div><div class=\"k\">Keith는 공연하기를 원하지 않았다.</div></div><div class=\"rnat\">(C)(1) 당연히, Keith는 공연하기를 원하지 않았다.</div><div class=\"rst\"><b>당연히</b>(Understandably) 키스는 공연하기 싫었어요. 앞에서 나쁜 피아노 얘기를 들었으니 “당연히”가 말이 돼요.</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(C)(2)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">He left and went to wait in his car,</div><div class=\"k\">그(= Keith)는 (자리를) 떠나 그의 차 안에서 기다리러 가 버렸다,</div></div><div class=\"rc\"><div class=\"e\">leaving Erik to anticipate</div><div class=\"k\">Erik이 예상하도록(걱정하도록) 내버려 둔 채</div></div><div class=\"rc\"><div class=\"e\">the arrival of soon-to-be furious concert-goers.</div><div class=\"k\">곧 분노할 콘서트 관객들의 도착을.</div></div><div class=\"rnat\">(C)(2) 그는 (자리를) 떠나 그의 차 안에서 기다리기 위해 가 버렸고, Erik이 곧 분노할 콘서트에 올 관객들의 도착을 걱정하도록 내버려두었다.</div><div class=\"rst\">키스는 차에 가서 기다려 버렸고, 에릭은 곧 화낼 관객들 걱정에 발만 동동 굴렀어요. = 지문 (C)(2).</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(C)(3)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">Desperate,</div><div class=\"k\">절박해서,</div></div><div class=\"rc\"><div class=\"e\">(c) the German teenager</div><div class=\"k\">(c) 그 독일인 십대(= Erik)는</div></div><div class=\"rc\"><div class=\"e\">caught up with Keith</div><div class=\"k\">Keith를 따라가</div></div><div class=\"rc\"><div class=\"e\">and begged the jazz pianist to play.</div><div class=\"k\">그 재즈 피아니스트(= Keith)에게 연주를 해 달라고 간청했다.</div></div><div class=\"rnat\">(C)(3) 절박해서(절박한 심정으로), (c)그 독일인 십대(Erik)는 Keith를 따라가 그 재즈 피아니스트에게 연주를 해달라고 간청했다.</div><div class=\"rst\">절박해진 에릭은 키스를 쫓아가 제발 연주해 달라고 빌었어요. 지문의 그 독일인 십대가 에릭이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(C)(4)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">The pianist looked out at him</div><div class=\"k\">그 피아니스트는 그(= Erik)를 내다보았다</div></div><div class=\"rc\"><div class=\"e\">standing in the rain,</div><div class=\"k\">빗속에 서 있는,</div></div><div class=\"rc\"><div class=\"e\">completely soaked,</div><div class=\"k\">완전히 젖은 채로,</div></div><div class=\"rc\"><div class=\"e\">and took pity on him.</div><div class=\"k\">그리고 그(= Erik)를 불쌍히 여겼다.</div></div><div class=\"rnat\">(C)(4) 그 피아니스트는 완전히 젖은 채로 빗속에 서있는 그(Erik)를 내다보았고, 그를 불쌍히 여겼다.</div><div class=\"rst\">키스는 비에 흠뻑 젖은 채 서 있는 에릭을 보고 불쌍히 여겼어요. = 지문의 불쌍히 여겼다.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(C)(5)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">“Never forget,” Keith said.</div><div class=\"k\">“절대 잊지 말아라.”라고 Keith가 말했다.</div></div><div class=\"rnat\">(C)(5) “절대 잊지 말아라.”라고 Keith가 말했다.</div><div class=\"rst\">키스가 말해요. “절대 잊지 마라.” 이제 연주해 주겠다는 뜻이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">(C)(6)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">“Only for (d) you.”</div><div class=\"k\">“오직 (d) 너(= Erik)를 위해서다.”</div></div><div class=\"rnat\">(C)(6) “오직 (d)너(Erik)를 위해서다.”</div><div class=\"rst\">“오직 너를 위해서야.” 키스가 에릭 한 사람을 위해 연주하겠다고 말해요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">(C)(7)번</span><span class=\"ordc\">정답 순서 (C)</span><div class=\"rc\"><div class=\"e\">A few hours later,</div><div class=\"k\">몇 시간 후,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Keith walked out to the unplayable piano</span></div><div class=\"k\"><span class=\"cw\">Keith는 연주할 수 없는 피아노로 걸어 나왔다</span></div></div><div class=\"rc\"><div class=\"e\">in front of a packed concert hall.</div><div class=\"k\">(관객들로) 꽉 찬 공연장 앞에서.</div></div><div class=\"rnat\">(C)(7) 몇 시간 후, Keith는 (관객들로) 꽉 찬 공연장 앞의 연주할 수 없는 피아노로 걸어 나왔다.</div><div class=\"rst\">몇 시간 뒤, 키스는 관객이 꽉 찬 공연장에서 <b>그 연주하기 힘든 피아노로 걸어 나왔어요</b>. 이제 연주가 시작될 차례예요.</div></div><div class=\"rds key\" data-ord=\"17\"><span class=\"rn\">(B)(1)번 · 단서</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(B) When Keith began to play,</span></div><div class=\"k\"><span class=\"cw\">(B) Keith가 연주하기 시작했을 때,</span></div></div><div class=\"rc\"><div class=\"e\">everybody immediately knew</div><div class=\"k\">모든 사람들은 즉시 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">this was magic.</div><div class=\"k\">이것(= Keith의 연주)이 마법이라는 것을.</div></div><div class=\"rnat\">(B)(1) Keith가 연주하기 시작했을 때, 모든 사람들은 즉시 이것(그의 연주)이 마법이라는 것을 알게 되었다.</div><div class=\"rst\">키스가 <b>연주를 시작하자</b>(When Keith began to play) 모두 바로 “마법이다!” 하고 느꼈어요. (C) 끝을 이어받는 고리예요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">(B)(2)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Erik too was deeply touched.</div><div class=\"k\">Erik 또한 깊이 감명받았다.</div></div><div class=\"rnat\">(B)(2) Erik 또한 깊이 감명 받았다.</div><div class=\"rst\">무대를 준비한 에릭도 깊이 감동했어요. 축제를 지켜 낸 학생회장 같은 마음이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">(B)(3)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Keith was unexpectedly producing</div><div class=\"k\">Keith는 뜻밖에 만들어 내고 있었다</div></div><div class=\"rc\"><div class=\"e\">the performance of a lifetime</div><div class=\"k\">생애 최고의 공연을</div></div><div class=\"rc\"><div class=\"e\">despite the shortcomings of the piano.</div><div class=\"k\">피아노의 단점에도 불구하고.</div></div><div class=\"rnat\">(B)(3) Keith는 피아노의 단점에도 불구하고 뜻밖에 생애 최고의 공연을 하고 있었다.</div><div class=\"rst\">피아노가 별로였는데도 키스는 뜻밖에 생애 최고의 공연을 해냈어요. = 지문의 피아노의 단점에도 불구하고.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">(B)(4)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">(b) His left hand produced</div><div class=\"k\">(b) 그(= Keith)의 왼손은 만들어 냈다</div></div><div class=\"rc\"><div class=\"e\">thundering, repetitive bass riffs</div><div class=\"k\">천둥소리 같은, 반복되는 저음 반복 악절을</div></div><div class=\"rc\"><div class=\"e\">as a way of covering up</div><div class=\"k\">감추기 위한 하나의 방법으로</div></div><div class=\"rc\"><div class=\"e\">the piano’s lack of resonance.</div><div class=\"k\">피아노의 소리 울림의 부족함을.</div></div><div class=\"rnat\">(B)(4) (b)그(Keith)의 왼손은 피아노의 소리 울림의 부족함을 감추기 위한 하나의 방법으로 천둥소리 같은, 반복되는 저음 반복 악절을 만들어 냈다.</div><div class=\"rst\">왼손으로 천둥 같은 저음을 반복해서, 피아노 소리가 잘 안 울리는 걸 감췄어요. = 지문 (B)(4).</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">(B)(5)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Keith really had to play that piano very hard</div><div class=\"k\">Keith는 정말로 그 피아노를 아주 세게 연주해야 했다</div></div><div class=\"rc\"><div class=\"e\">to get enough volume</div><div class=\"k\">충분한 음량을 내도록</div></div><div class=\"rc\"><div class=\"e\">to get to the balconies.</div><div class=\"k\">발코니석까지 닿을.</div></div><div class=\"rnat\">(B)(5) Keith는 발코니석까지 닿을 수 있는 충분한 음량을 내도록 정말로 그 피아노를 아주 세게 연주해야 했다.</div><div class=\"rst\">맨 위 발코니석까지 소리가 닿게 하려고 피아노를 아주 세게 쳐야 했어요. = 지문의 충분한 음량.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">(B)(6)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">Standing up and sitting down,</div><div class=\"k\">일어섰다 앉았다 하면서,</div></div><div class=\"rc\"><div class=\"e\">Keith played the unplayable piano</div><div class=\"k\">Keith는 그 연주할 수 없는 피아노를 연주했다</div></div><div class=\"rc\"><div class=\"e\">to produce something unique.</div><div class=\"k\">독특한 무언가를 만들어 내기 위해.</div></div><div class=\"rnat\">(B)(6) 일어섰다 앉았다 하면서, Keith는 독특한 무언가를 만들어 내기 위해 그 연주할 수 없는 피아노를 연주했다.</div><div class=\"rst\">일어섰다 앉았다 하며 그 피아노로 세상에 없던 독특한 연주를 만들어 냈어요. = 지문 (B)(6).</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">(B)(7)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">It wasn’t the music</div><div class=\"k\">그것(= Keith가 연주한 음악)은 음악이 아니었다</div></div><div class=\"rc\"><div class=\"e\">that he ever imagined playing.</div><div class=\"k\">그가 연주하리라고 상상해 본.</div></div><div class=\"rnat\">(B)(7) 그것은 그가 연주할 것이라고 결코 상상할 수 없었던 음악이었다.</div><div class=\"rst\">그건 키스가 평소에 상상해 본 음악이 아니었어요. 나쁜 피아노 덕분에 나온 새로운 음악이에요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">(B)(8)번</span><span class=\"ordc\">정답 순서 (B)</span><div class=\"rc\"><div class=\"e\">But faced with a challenge,</div><div class=\"k\">하지만 도전에 직면했을 때,</div></div><div class=\"rc\"><div class=\"e\">he accepted it and flew high.</div><div class=\"k\">그(= Keith)는 그것(= 도전)을 받아들였고 높이 날아올랐다.</div></div><div class=\"rnat\">(B)(8) 하지만 도전에 직면했을 때, 그는 그것을 받아들였고 높이 날아올랐다(성공했다).</div><div class=\"rst\">하지만 어려움을 피하지 않고 받아들여 높이 날아올랐어요. 위기를 기회로 바꾼, 이야기의 마무리예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"persuade\" data-m=\"설득하다\"><b>persuade</b>설득하다</button><button type=\"button\" class=\"wdb\" data-w=\"improvised\" data-m=\"즉흥으로 연주되는\"><b>improvised</b>즉흥으로 연주되는</button><button type=\"button\" class=\"wdb\" data-w=\"sellout\" data-m=\"매진\"><b>sellout</b>매진</button><button type=\"button\" class=\"wdb\" data-w=\"understandably\" data-m=\"당연하게도\"><b>understandably</b>당연하게도</button><button type=\"button\" class=\"wdb\" data-w=\"anticipate\" data-m=\"예상하다, (걱정하며) 기다리다\"><b>anticipate</b>예상하다, (걱정하며) 기다리다</button><button type=\"button\" class=\"wdb\" data-w=\"shortcoming\" data-m=\"단점, 결점\"><b>shortcoming</b>단점, 결점</button></div>", "11": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">지칭 문제는 밑줄마다 <b>그 문장 안의 단서</b>로 누구인지 확인하세요. 밤 공연에서 <b>피아노를 연주하는 사람</b>은 키스뿐이에요. (b)의 <b>His left hand</b>(그의 왼손)가 무엇을 하는지 보세요.</p><div class=\"ck-step\"><span class=\"lab\">(a) · (A)(3) 문장</span><div class=\"en\"><mark>(a) The youngest concert promoter in Germany</mark> had persuaded the Opera House to host a late-night concert …</div><p class=\"ko\"><mark>독일에서 (a) 가장 어린 그 콘서트 기획자(= Erik)는</mark> 오페라 하우스를 설득했던 것이다 … → 에릭</p></div><div class=\"ck-via\"><i>▼</i><span>만프레드가 말을 건 상대의 이름이 바로 대사에 나옴</span></div><div class=\"ck-step\"><span class=\"lab\">(e) · (D)(3) 문장</span><div class=\"en\">Manfred came to <mark>(e) him</mark> and said, “<mark>Erik</mark>, if you don’t get another piano, Keith can’t play tonight.”</div><p class=\"ko\">Manfred는 <mark>(e) 그(= Erik)에게</mark> 와서 말했다, “Erik, …” → 에릭</p></div><div class=\"ck-via\"><i>▼</i><span>17살 독일 소년 = (A)(1)의 에릭</span></div><div class=\"ck-step\"><span class=\"lab\">(c) · (C)(3) 문장</span><div class=\"en\">Desperate, <mark>(c) the German teenager</mark> caught up with Keith and begged the jazz pianist to play.</div><p class=\"ko\">절박해서, <mark>(c) 그 독일인 십대(= Erik)는</mark> Keith를 따라가 연주를 해 달라고 간청했다. → 에릭</p></div><div class=\"ck-via\"><i>▼</i><span>키스가 빗속에 서 있던 에릭에게 건넨 말</span></div><div class=\"ck-step\"><span class=\"lab\">(d) · (C)(6) 문장</span><div class=\"en\">“Only for <mark>(d) you</mark>.”</div><p class=\"ko\">“오직 <mark>(d) 너(= Erik)를 위해서다</mark>.” → 에릭</p></div><div class=\"ck-via\"><i>▼</i><span>왼손으로 피아노 저음을 치는 사람 = 연주자 키스</span></div><div class=\"ck-step key\"><span class=\"lab\">(b) · (B)(4) 문장 · 결정적 단서</span><div class=\"en\"><mark>(b) His left hand</mark> produced thundering, repetitive bass riffs as a way of covering up <mark>the piano’s lack of resonance</mark>.</div><p class=\"ko\"><mark>(b) 그(= Keith)의 왼손은</mark> <mark>피아노의 소리 울림의 부족함을</mark> 감추기 위해 천둥소리 같은 저음 반복 악절을 만들어 냈다. → 키스</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">(b) His 그의 = 키스<small>피아노를 치며 왼손으로 저음을 만든 사람이라 연주자 키스예요. 나머지는 모두 에릭이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">(e) him 그에게 = 에릭</span><span class=\"why\">(D)(3)에 만프레드와 키스가 함께 나와서 헷갈려요. 하지만 바로 뒤 대사가 “Erik(에릭), …”으로 시작해서 말을 건 상대는 에릭이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">(a) 가장 어린 콘서트 기획자 = 에릭</span><span class=\"why\">(A)(3)에서 오페라 하우스를 설득해 공연을 연 사람이에요. (A)(1)의 17살 소년 에릭이 바로 그 기획자예요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">(c) the German teenager 그 독일인 십대 = 에릭</span><span class=\"why\">(A)(1)에서 17살 독일 소년이라고 소개된 사람이 에릭이에요. 키스는 미국 피아니스트라 '독일인 십대'가 될 수 없어요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">(d) you 너 = 에릭</span><span class=\"why\">(C)(4)에서 키스가 빗속에 젖은 에릭을 보고 불쌍히 여긴 뒤 한 말이에요. 말하는 사람이 키스니 “너”는 에릭이에요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><div class=\"rc\"><div class=\"e\">(A) A seventeen-year-old German boy</div><div class=\"k\">(A) 17살 된 독일 소년이</div></div><div class=\"rc\"><div class=\"e\">named Erik Brandes</div><div class=\"k\">Erik Brandes라는 이름의</div></div><div class=\"rc\"><div class=\"e\">stepped out onto the empty vast stage</div><div class=\"k\">비어 있는 거대한 무대 위로 나갔다</div></div><div class=\"rc\"><div class=\"e\">of the Cologne Opera House.</div><div class=\"k\">Cologne(쾰른) 오페라 하우스의.</div></div><div class=\"rnat\">(A)(1) Erik Brandes라는 이름의 17살 된 독일 소년은 Cologne(쾰른) 오페라 하우스의 비어 있는 거대한 무대 위로 나갔다.</div><div class=\"rst\">학생회장이 축제 무대를 직접 준비한 것처럼, 17살 에릭이 쾰른 오페라 하우스의 텅 빈 큰 무대에 올라섰어요. 지문 (A)의 시작이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><div class=\"rc\"><div class=\"e\">It was the most exciting day</div><div class=\"k\">가장 흥분된 날이었다</div></div><div class=\"rc\"><div class=\"e\">of Erik’s life.</div><div class=\"k\">Erik의 인생에서.</div></div><div class=\"rnat\">(A)(2) Erik의 인생에서 가장 흥분된 날이었다.</div><div class=\"rst\">축제 날 학생회장처럼 에릭에게도 인생에서 가장 신나는 날이었어요. = 지문의 가장 흥분된 날.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(a) The youngest concert promoter in Germany</span></div><div class=\"k\"><span class=\"cw\">독일에서 (a) 가장 어린 그 콘서트 기획자(= Erik)는</span></div></div><div class=\"rc\"><div class=\"e\">had persuaded the Opera House</div><div class=\"k\">오페라 하우스를 설득했던 것이다</div></div><div class=\"rc\"><div class=\"e\">to host a late-night concert</div><div class=\"k\">심야 콘서트를 주최하도록</div></div><div class=\"rc\"><div class=\"e\">of improvised jazz</div><div class=\"k\">즉흥 재즈의</div></div><div class=\"rc\"><div class=\"e\">by the American pianist Keith Jarrett.</div><div class=\"k\">미국의 피아니스트인 Keith Jarrett의.</div></div><div class=\"rnat\">(A)(3) 독일에서 (a)가장 어린 그 콘서트 기획자(Erik)는 오페라 하우스가 미국의 피아니스트인 Keith Jarrett의 심야 즉흥 재즈 콘서트를 주최하도록 설득했던 것이다.</div><div class=\"rst\">에릭은 오페라 하우스를 설득해 키스의 밤 재즈 공연을 열었어요. 이 공연을 기획한 사람이 에릭이니 <b>(a) 가장 어린 기획자 = 에릭</b>이에요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><div class=\"rc\"><div class=\"e\">The concert was a sellout,</div><div class=\"k\">그 콘서트는 매진이었다,</div></div><div class=\"rc\"><div class=\"e\">and later that evening,</div><div class=\"k\">그리고 그날 늦은 밤,</div></div><div class=\"rc\"><div class=\"e\">Keith would sit down at the piano</div><div class=\"k\">Keith가 피아노 앞에 앉을 것이었다</div></div><div class=\"rc\"><div class=\"e\">and play.</div><div class=\"k\">그리고 연주할 (것이었다).</div></div><div class=\"rnat\">(A)(4) 그 콘서트는 매진이었고, 그날 늦은 밤, Keith가 피아노 앞에 앉아 연주할 것이었다.</div><div class=\"rst\">표는 다 팔렸고, 그날 밤 키스가 피아노 앞에 앉아 연주할 예정이었어요. 밤 공연에서 피아노를 칠 사람은 키스예요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(D)(1)번</span><div class=\"rc\"><div class=\"e\">(D) But when Erik introduced Keith</div><div class=\"k\">(D) 하지만 Erik이 Keith를 안내했을 때</div></div><div class=\"rc\"><div class=\"e\">and his producer Manfred</div><div class=\"k\">그리고 그(= Keith)의 제작자 Manfred를</div></div><div class=\"rc\"><div class=\"e\">to the piano on the stage</div><div class=\"k\">무대 위 피아노로</div></div><div class=\"rc\"><div class=\"e\">that afternoon,</div><div class=\"k\">그날 오후,</div></div><div class=\"rc\"><div class=\"e\">it didn’t go well.</div><div class=\"k\">일이 틀어졌다.</div></div><div class=\"rnat\">(D)(1) 하지만 Erik이 그날 오후 Keith와 그의 제작자 Manfred를 무대 위 피아노로 안내했을 때, 일이 틀어졌다.</div><div class=\"rst\"><b>하지만</b>(But) 그날 오후 에릭이 키스와 제작자 만프레드를 무대 피아노로 안내하자 일이 틀어졌어요. 등장인물 셋이 다 모였어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(D)(2)번</span><div class=\"rc\"><div class=\"e\">Keith and Manfred played a few notes.</div><div class=\"k\">Keith와 Manfred는 몇 개의 음을 연주했다.</div></div><div class=\"rnat\">(D)(2) Keith와 Manfred는 몇 개의 음을 연주했다.</div><div class=\"rst\">키스와 제작자 만프레드가 피아노 건반을 몇 개 눌러 봤어요. 지문의 몇 개의 음 연주예요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(D)(3)번</span><div class=\"rc\"><div class=\"e\">Then after a long silence,</div><div class=\"k\">그러고 나서 긴 침묵 후에,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Manfred came to (e) him and said,</span></div><div class=\"k\"><span class=\"cw\">Manfred는 (e) 그(= Erik)에게 와서 말했다,</span></div></div><div class=\"rc\"><div class=\"e\">“Erik, if you don’t get another piano,</div><div class=\"k\">“Erik, 만약 당신이 다른 피아노를 가져오지 않는다면,</div></div><div class=\"rc\"><div class=\"e\">Keith can’t play tonight.”</div><div class=\"k\">Keith는 오늘 밤에 연주할 수 없어요.”</div></div><div class=\"rnat\">(D)(3) 그러고 나서 긴 침묵 후에, Manfred는 (e)그(Erik)에게 와서 “Erik, 만약 당신이 다른 피아노를 가져오지 않는다면, Keith는 오늘 밤에 연주할 수 없어요.”라고 말했다.</div><div class=\"rst\">만프레드가 다가와 “에릭, 다른 피아노 없으면 키스는 못 쳐요.” 이름을 부른 상대라서 <b>(e) 그 = 에릭</b>이에요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(D)(4)번</span><div class=\"rc\"><div class=\"e\">Erik knew</div><div class=\"k\">Erik은 알고 있었다</div></div><div class=\"rc\"><div class=\"e\">that Keith had requested a specific instrument,</div><div class=\"k\">Keith가 특정 악기를 요청했다는 것을,</div></div><div class=\"rc\"><div class=\"e\">which the Opera House had agreed to provide.</div><div class=\"k\">그리고 그것(= 그 특정 악기)을 오페라 하우스가 제공하기로 동의했다는 것을.</div></div><div class=\"rnat\">(D)(4) Erik은 Keith가 특정 악기를 요청했고, 그것(특정 악기)을 오페라 하우스가 제공하기로 동의했다는 것을 알고 있었다.</div><div class=\"rst\">에릭은 키스가 특정 피아노를 부탁했고 오페라 하우스가 준비하기로 한 걸 알고 있었어요. = 지문 (D)(4).</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(D)(5)번</span><div class=\"rc\"><div class=\"e\">What he hadn’t realized was</div><div class=\"k\">그(= Erik)가 알아차리지 못했던 것은 ~이었다</div></div><div class=\"rc\"><div class=\"e\">that the administrative staff</div><div class=\"k\">관리 직원이</div></div><div class=\"rc\"><div class=\"e\">hadn’t been able to find</div><div class=\"k\">찾을 수 없었다는 것</div></div><div class=\"rc\"><div class=\"e\">the requested Bösendorfer piano,</div><div class=\"k\">요청된 Bösendorfer 피아노를,</div></div><div class=\"rc\"><div class=\"e\">and they had instead installed</div><div class=\"k\">그리고 그들(= 관리 직원)은 대신 설치했다는 것</div></div><div class=\"rc\"><div class=\"e\">a tiny little Bösendorfer</div><div class=\"k\">아주 작은 Bösendorfer (피아노)를</div></div><div class=\"rc\"><div class=\"e\">that was in poor condition.</div><div class=\"k\">상태가 좋지 않았던.</div></div><div class=\"rnat\">(D)(5) 그(Erik)가 알아차리지 못했던 것은 관리 직원이 요청된 Bösendorfer 피아노를 찾을 수 없어서, 그들은 그 대신 상태가 좋지 않았던 아주 작은 Bösendorfer (피아노)를 설치했다는 것이었다.</div><div class=\"rst\">그런데 직원들이 그 피아노를 못 찾고, 대신 <b>상태가 나쁜</b> 작은 피아노를 갖다 놓은 거예요. 이게 문제의 정체예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(C)(1)번</span><div class=\"rc\"><div class=\"e\">(C) Understandably,</div><div class=\"k\">(C) 당연히,</div></div><div class=\"rc\"><div class=\"e\">Keith didn’t want to perform.</div><div class=\"k\">Keith는 공연하기를 원하지 않았다.</div></div><div class=\"rnat\">(C)(1) 당연히, Keith는 공연하기를 원하지 않았다.</div><div class=\"rst\"><b>당연히</b>(Understandably) 키스는 공연하기 싫었어요. 나쁜 피아노를 직접 쳐 봤으니까요. = 지문 (C)(1).</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(C)(2)번</span><div class=\"rc\"><div class=\"e\">He left and went to wait in his car,</div><div class=\"k\">그(= Keith)는 (자리를) 떠나 그의 차 안에서 기다리러 가 버렸다,</div></div><div class=\"rc\"><div class=\"e\">leaving Erik to anticipate</div><div class=\"k\">Erik이 예상하도록(걱정하도록) 내버려 둔 채</div></div><div class=\"rc\"><div class=\"e\">the arrival of soon-to-be furious concert-goers.</div><div class=\"k\">곧 분노할 콘서트 관객들의 도착을.</div></div><div class=\"rnat\">(C)(2) 그는 (자리를) 떠나 그의 차 안에서 기다리기 위해 가 버렸고, Erik이 곧 분노할 콘서트에 올 관객들의 도착을 걱정하도록 내버려두었다.</div><div class=\"rst\">키스는 차에 가서 기다려 버렸고, 에릭은 곧 화낼 관객들 걱정에 발만 동동 굴렀어요. = 지문 (C)(2).</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(C)(3)번</span><div class=\"rc\"><div class=\"e\">Desperate,</div><div class=\"k\">절박해서,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(c) the German teenager</span></div><div class=\"k\"><span class=\"cw\">(c) 그 독일인 십대(= Erik)는</span></div></div><div class=\"rc\"><div class=\"e\">caught up with Keith</div><div class=\"k\">Keith를 따라가</div></div><div class=\"rc\"><div class=\"e\">and begged the jazz pianist to play.</div><div class=\"k\">그 재즈 피아니스트(= Keith)에게 연주를 해 달라고 간청했다.</div></div><div class=\"rnat\">(C)(3) 절박해서(절박한 심정으로), (c)그 독일인 십대(Erik)는 Keith를 따라가 그 재즈 피아니스트에게 연주를 해달라고 간청했다.</div><div class=\"rst\">절박해진 십대가 키스를 쫓아가 연주해 달라고 빌어요. 17살 독일 소년은 에릭이라 <b>(c) 그 독일인 십대 = 에릭</b>이에요.</div></div><div class=\"rds\" data-ord=\"13\"><span class=\"rn\">(C)(4)번</span><div class=\"rc\"><div class=\"e\">The pianist looked out at him</div><div class=\"k\">그 피아니스트는 그(= Erik)를 내다보았다</div></div><div class=\"rc\"><div class=\"e\">standing in the rain,</div><div class=\"k\">빗속에 서 있는,</div></div><div class=\"rc\"><div class=\"e\">completely soaked,</div><div class=\"k\">완전히 젖은 채로,</div></div><div class=\"rc\"><div class=\"e\">and took pity on him.</div><div class=\"k\">그리고 그(= Erik)를 불쌍히 여겼다.</div></div><div class=\"rnat\">(C)(4) 그 피아니스트는 완전히 젖은 채로 빗속에 서있는 그(Erik)를 내다보았고, 그를 불쌍히 여겼다.</div><div class=\"rst\">키스는 비에 흠뻑 젖은 채 서 있는 에릭을 보고 불쌍히 여겼어요. = 지문의 불쌍히 여겼다.</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(C)(5)번</span><div class=\"rc\"><div class=\"e\">“Never forget,” Keith said.</div><div class=\"k\">“절대 잊지 말아라.”라고 Keith가 말했다.</div></div><div class=\"rnat\">(C)(5) “절대 잊지 말아라.”라고 Keith가 말했다.</div><div class=\"rst\">키스가 말해요. “절대 잊지 마라.” 이제 연주해 주겠다는 뜻이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">(C)(6)번</span><div class=\"rc\"><div class=\"e\">“Only for (d) you.”</div><div class=\"k\">“오직 (d) 너(= Erik)를 위해서다.”</div></div><div class=\"rnat\">(C)(6) “오직 (d)너(Erik)를 위해서다.”</div><div class=\"rst\">“오직 너를 위해서야.” 빗속에 서 있던 에릭에게 한 말이라 <b>(d) 너 = 에릭</b>이에요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">(C)(7)번</span><div class=\"rc\"><div class=\"e\">A few hours later,</div><div class=\"k\">몇 시간 후,</div></div><div class=\"rc\"><div class=\"e\">Keith walked out to the unplayable piano</div><div class=\"k\">Keith는 연주할 수 없는 피아노로 걸어 나왔다</div></div><div class=\"rc\"><div class=\"e\">in front of a packed concert hall.</div><div class=\"k\">(관객들로) 꽉 찬 공연장 앞에서.</div></div><div class=\"rnat\">(C)(7) 몇 시간 후, Keith는 (관객들로) 꽉 찬 공연장 앞의 연주할 수 없는 피아노로 걸어 나왔다.</div><div class=\"rst\">몇 시간 뒤, 키스는 관객이 꽉 찬 공연장에서 그 연주하기 힘든 피아노로 걸어 나왔어요. = 지문 (C)(7).</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">(B)(1)번</span><div class=\"rc\"><div class=\"e\">(B) When Keith began to play,</div><div class=\"k\">(B) Keith가 연주하기 시작했을 때,</div></div><div class=\"rc\"><div class=\"e\">everybody immediately knew</div><div class=\"k\">모든 사람들은 즉시 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">this was magic.</div><div class=\"k\">이것(= Keith의 연주)이 마법이라는 것을.</div></div><div class=\"rnat\">(B)(1) Keith가 연주하기 시작했을 때, 모든 사람들은 즉시 이것(그의 연주)이 마법이라는 것을 알게 되었다.</div><div class=\"rst\">키스가 연주를 시작하자 모두 바로 “마법이다!” 하고 느꼈어요. = 지문의 이것이 마법이라는 것.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">(B)(2)번</span><div class=\"rc\"><div class=\"e\">Erik too was deeply touched.</div><div class=\"k\">Erik 또한 깊이 감명받았다.</div></div><div class=\"rnat\">(B)(2) Erik 또한 깊이 감명 받았다.</div><div class=\"rst\">무대를 준비한 에릭도 깊이 감동했어요. 축제를 지켜 낸 학생회장 같은 마음이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">(B)(3)번</span><div class=\"rc\"><div class=\"e\">Keith was unexpectedly producing</div><div class=\"k\">Keith는 뜻밖에 만들어 내고 있었다</div></div><div class=\"rc\"><div class=\"e\">the performance of a lifetime</div><div class=\"k\">생애 최고의 공연을</div></div><div class=\"rc\"><div class=\"e\">despite the shortcomings of the piano.</div><div class=\"k\">피아노의 단점에도 불구하고.</div></div><div class=\"rnat\">(B)(3) Keith는 피아노의 단점에도 불구하고 뜻밖에 생애 최고의 공연을 하고 있었다.</div><div class=\"rst\">피아노가 별로였는데도 <b>키스는</b> 뜻밖에 생애 최고의 공연을 해냈어요. 지금 연주하는 사람은 키스예요.</div></div><div class=\"rds key\" data-ord=\"20\"><span class=\"rn\">(B)(4)번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">(b) His left hand produced</span></div><div class=\"k\"><span class=\"cw\">(b) 그(= Keith)의 왼손은 만들어 냈다</span></div></div><div class=\"rc\"><div class=\"e\">thundering, repetitive bass riffs</div><div class=\"k\">천둥소리 같은, 반복되는 저음 반복 악절을</div></div><div class=\"rc\"><div class=\"e\">as a way of covering up</div><div class=\"k\">감추기 위한 하나의 방법으로</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the piano’s lack of resonance.</span></div><div class=\"k\"><span class=\"cw\">피아노의 소리 울림의 부족함을.</span></div></div><div class=\"rnat\">(B)(4) (b)그(Keith)의 왼손은 피아노의 소리 울림의 부족함을 감추기 위한 하나의 방법으로 천둥소리 같은, 반복되는 저음 반복 악절을 만들어 냈다.</div><div class=\"rst\"><b>(b) 그의 왼손</b>이 천둥 같은 저음을 반복해 피아노 소리 부족을 감췄어요. 피아노를 치는 손이니 <b>(b) = 키스</b>예요!</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">(B)(5)번</span><div class=\"rc\"><div class=\"e\">Keith really had to play that piano very hard</div><div class=\"k\">Keith는 정말로 그 피아노를 아주 세게 연주해야 했다</div></div><div class=\"rc\"><div class=\"e\">to get enough volume</div><div class=\"k\">충분한 음량을 내도록</div></div><div class=\"rc\"><div class=\"e\">to get to the balconies.</div><div class=\"k\">발코니석까지 닿을.</div></div><div class=\"rnat\">(B)(5) Keith는 발코니석까지 닿을 수 있는 충분한 음량을 내도록 정말로 그 피아노를 아주 세게 연주해야 했다.</div><div class=\"rst\">맨 위 발코니석까지 소리가 닿게 하려고 피아노를 아주 세게 쳐야 했어요. = 지문의 충분한 음량.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">(B)(6)번</span><div class=\"rc\"><div class=\"e\">Standing up and sitting down,</div><div class=\"k\">일어섰다 앉았다 하면서,</div></div><div class=\"rc\"><div class=\"e\">Keith played the unplayable piano</div><div class=\"k\">Keith는 그 연주할 수 없는 피아노를 연주했다</div></div><div class=\"rc\"><div class=\"e\">to produce something unique.</div><div class=\"k\">독특한 무언가를 만들어 내기 위해.</div></div><div class=\"rnat\">(B)(6) 일어섰다 앉았다 하면서, Keith는 독특한 무언가를 만들어 내기 위해 그 연주할 수 없는 피아노를 연주했다.</div><div class=\"rst\">일어섰다 앉았다 하며 그 피아노로 세상에 없던 독특한 연주를 만들어 냈어요. = 지문 (B)(6).</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">(B)(7)번</span><div class=\"rc\"><div class=\"e\">It wasn’t the music</div><div class=\"k\">그것(= Keith가 연주한 음악)은 음악이 아니었다</div></div><div class=\"rc\"><div class=\"e\">that he ever imagined playing.</div><div class=\"k\">그가 연주하리라고 상상해 본.</div></div><div class=\"rnat\">(B)(7) 그것은 그가 연주할 것이라고 결코 상상할 수 없었던 음악이었다.</div><div class=\"rst\">그건 키스가 평소에 상상해 본 음악이 아니었어요. 나쁜 피아노 덕분에 나온 새로운 음악이에요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">(B)(8)번</span><div class=\"rc\"><div class=\"e\">But faced with a challenge,</div><div class=\"k\">하지만 도전에 직면했을 때,</div></div><div class=\"rc\"><div class=\"e\">he accepted it and flew high.</div><div class=\"k\">그(= Keith)는 그것(= 도전)을 받아들였고 높이 날아올랐다.</div></div><div class=\"rnat\">(B)(8) 하지만 도전에 직면했을 때, 그는 그것을 받아들였고 높이 날아올랐다(성공했다).</div><div class=\"rst\">하지만 어려움을 피하지 않고 받아들여 높이 날아올랐어요. 위기를 기회로 바꾼, 이야기의 마무리예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"promoter\" data-m=\"기획자, 흥행주\"><b>promoter</b>기획자, 흥행주</button><button type=\"button\" class=\"wdb\" data-w=\"teenager\" data-m=\"십 대 청소년\"><b>teenager</b>십 대 청소년</button><button type=\"button\" class=\"wdb\" data-w=\"beg\" data-m=\"애원하다\"><b>beg</b>애원하다</button><button type=\"button\" class=\"wdb\" data-w=\"soaked\" data-m=\"흠뻑 젖은\"><b>soaked</b>흠뻑 젖은</button><button type=\"button\" class=\"wdb\" data-w=\"repetitive\" data-m=\"반복적인\"><b>repetitive</b>반복적인</button><button type=\"button\" class=\"wdb\" data-w=\"resonance\" data-m=\"울림, 공명\"><b>resonance</b>울림, 공명</button></div>", "12": "<p class=\"mtr\">마더텅 정답률 <b>90%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">불일치 문제는 선택지를 <b>이야기 순서대로</b> 하나씩 지문과 대조하세요. ④의 <b>‘외면했다’</b>처럼 행동을 반대로 바꾼 말이 지문의 <b>took pity on</b>(불쌍히 여겼다)과 부딪히는지 확인해요.</p><div class=\"ck-step\"><div class=\"ck-chips\"><span><em>① ↔ (A)(4)</em>a sellout(매진) → 같음</span><span><em>⑤ ↔ (D)(2)</em>played a few notes(몇 개의 음을 쳤다) → 같음</span><span><em>② ↔ (B)(1)</em>immediately knew this was magic(즉시 마법임을 알았다) → 같음</span><span><em>③ ↔ (B)(5)</em>play very hard to get enough volume(충분한 음량을 내려고 세게 쳤다) → 같음</span></div><div class=\"ck-eq\">⇒ 네 개는 지문과 그대로 같아요. 남은 ④를 (C)단락과 대조해요</div></div><div class=\"ck-via\"><i>▼</i><span>④의 ‘외면’처럼 보이는 장면이지만 에릭을 보기 전이에요</span></div><div class=\"ck-step\"><span class=\"lab\">(C)(2) 문장 · 헷갈리는 함정</span><div class=\"en\">He left and went to wait in his car …</div><p class=\"ko\">그는 (자리를) 떠나 그의 차 안에서 기다리러 가 버렸다 …</p></div><div class=\"ck-via\"><i>▼</i><span>빗속의 에릭을 본 뒤에는 마음을 바꿈 → ‘외면했다’와 정반대</span></div><div class=\"ck-step key\"><span class=\"lab\">(C)(4) 문장 · 결정적 단서</span><div class=\"en\">The pianist <mark>looked out at him</mark> standing in the rain, completely soaked, and <mark>took pity on him</mark>.</div><p class=\"ko\">그 피아니스트는 빗속에 완전히 젖은 채 서 있는 <mark>그(= Erik)를 내다보았다</mark> 그리고 <mark>그(= Erik)를 불쌍히 여겼다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">Keith는 빗속에 서 있는 Erik을 보고도 외면했다.<small>(C)(4): 외면한 게 아니라 took pity on him(그를 불쌍히 여겼다)이고, 결국 연주해 줬어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">연주가 시작되자마자 관객들은 감동을 받았다.</span><span class=\"why\">(B)(2)의 touched(감동받은)는 에릭 얘기라 관객은 아닌가 헷갈려요. 하지만 (B)(1)에서 everybody immediately(모두가 즉시) 마법임을 알았다고 했으니 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">연주회의 표가 매진되었다.</span><span class=\"why\">(A)(4) The concert was a sellout(그 콘서트는 매진이었다)과 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">Keith는 충분한 피아노 음량을 만들기 위해 노력했다.</span><span class=\"why\">(B)(5)에서 발코니석까지 닿을 enough volume(충분한 음량)을 내려고 very hard(아주 세게) 쳤다고 했으니 같아요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">Keith와 Manfred는 연주회장의 피아노를 쳐 보았다.</span><span class=\"why\">(D)(2) played a few notes(몇 개의 음을 연주했다)와 같아요. 무대 위 피아노를 쳐 본 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">(A)(1)번</span><div class=\"rc\"><div class=\"e\">(A) A seventeen-year-old German boy</div><div class=\"k\">(A) 17살 된 독일 소년이</div></div><div class=\"rc\"><div class=\"e\">named Erik Brandes</div><div class=\"k\">Erik Brandes라는 이름의</div></div><div class=\"rc\"><div class=\"e\">stepped out onto the empty vast stage</div><div class=\"k\">비어 있는 거대한 무대 위로 나갔다</div></div><div class=\"rc\"><div class=\"e\">of the Cologne Opera House.</div><div class=\"k\">Cologne(쾰른) 오페라 하우스의.</div></div><div class=\"rnat\">(A)(1) Erik Brandes라는 이름의 17살 된 독일 소년은 Cologne(쾰른) 오페라 하우스의 비어 있는 거대한 무대 위로 나갔다.</div><div class=\"rst\">학생회장이 축제 무대를 직접 준비한 것처럼, 17살 에릭이 쾰른 오페라 하우스의 텅 빈 큰 무대에 올라섰어요. 지문 (A)의 시작이에요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">(A)(2)번</span><div class=\"rc\"><div class=\"e\">It was the most exciting day</div><div class=\"k\">가장 흥분된 날이었다</div></div><div class=\"rc\"><div class=\"e\">of Erik’s life.</div><div class=\"k\">Erik의 인생에서.</div></div><div class=\"rnat\">(A)(2) Erik의 인생에서 가장 흥분된 날이었다.</div><div class=\"rst\">축제 날 학생회장처럼 에릭에게도 인생에서 가장 신나는 날이었어요. = 지문의 가장 흥분된 날.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">(A)(3)번</span><div class=\"rc\"><div class=\"e\">(a) The youngest concert promoter in Germany</div><div class=\"k\">독일에서 (a) 가장 어린 그 콘서트 기획자(= Erik)는</div></div><div class=\"rc\"><div class=\"e\">had persuaded the Opera House</div><div class=\"k\">오페라 하우스를 설득했던 것이다</div></div><div class=\"rc\"><div class=\"e\">to host a late-night concert</div><div class=\"k\">심야 콘서트를 주최하도록</div></div><div class=\"rc\"><div class=\"e\">of improvised jazz</div><div class=\"k\">즉흥 재즈의</div></div><div class=\"rc\"><div class=\"e\">by the American pianist Keith Jarrett.</div><div class=\"k\">미국의 피아니스트인 Keith Jarrett의.</div></div><div class=\"rnat\">(A)(3) 독일에서 (a)가장 어린 그 콘서트 기획자(Erik)는 오페라 하우스가 미국의 피아니스트인 Keith Jarrett의 심야 즉흥 재즈 콘서트를 주최하도록 설득했던 것이다.</div><div class=\"rst\">에릭은 독일에서 가장 어린 공연 기획자예요. 미국 피아니스트 키스의 밤 재즈 공연을 열자고 오페라 하우스를 설득했어요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">(A)(4)번</span><div class=\"rc\"><div class=\"e\">The concert was a sellout,</div><div class=\"k\">그 콘서트는 매진이었다,</div></div><div class=\"rc\"><div class=\"e\">and later that evening,</div><div class=\"k\">그리고 그날 늦은 밤,</div></div><div class=\"rc\"><div class=\"e\">Keith would sit down at the piano</div><div class=\"k\">Keith가 피아노 앞에 앉을 것이었다</div></div><div class=\"rc\"><div class=\"e\">and play.</div><div class=\"k\">그리고 연주할 (것이었다).</div></div><div class=\"rnat\">(A)(4) 그 콘서트는 매진이었고, 그날 늦은 밤, Keith가 피아노 앞에 앉아 연주할 것이었다.</div><div class=\"rst\">표는 <b>다 팔렸고</b>(sellout 매진), 그날 밤 키스가 연주할 예정이었어요. 선택지 ① “표가 매진되었다”와 같아요.</div></div><div class=\"rds\" data-ord=\"5\"><span class=\"rn\">(D)(1)번</span><div class=\"rc\"><div class=\"e\">(D) But when Erik introduced Keith</div><div class=\"k\">(D) 하지만 Erik이 Keith를 안내했을 때</div></div><div class=\"rc\"><div class=\"e\">and his producer Manfred</div><div class=\"k\">그리고 그(= Keith)의 제작자 Manfred를</div></div><div class=\"rc\"><div class=\"e\">to the piano on the stage</div><div class=\"k\">무대 위 피아노로</div></div><div class=\"rc\"><div class=\"e\">that afternoon,</div><div class=\"k\">그날 오후,</div></div><div class=\"rc\"><div class=\"e\">it didn’t go well.</div><div class=\"k\">일이 틀어졌다.</div></div><div class=\"rnat\">(D)(1) 하지만 Erik이 그날 오후 Keith와 그의 제작자 Manfred를 무대 위 피아노로 안내했을 때, 일이 틀어졌다.</div><div class=\"rst\"><b>하지만</b>(But) 그날 오후 에릭이 키스와 제작자 만프레드를 무대 피아노로 안내하자 일이 틀어졌어요. 등장인물 셋이 다 모였어요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">(D)(2)번</span><div class=\"rc\"><div class=\"e\">Keith and Manfred played a few notes.</div><div class=\"k\">Keith와 Manfred는 몇 개의 음을 연주했다.</div></div><div class=\"rnat\">(D)(2) Keith와 Manfred는 몇 개의 음을 연주했다.</div><div class=\"rst\">키스와 만프레드가 무대 피아노 건반을 <b>몇 개 쳐 봤어요</b>. 선택지 ⑤ “피아노를 쳐 보았다”와 같아요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">(D)(3)번</span><div class=\"rc\"><div class=\"e\">Then after a long silence,</div><div class=\"k\">그러고 나서 긴 침묵 후에,</div></div><div class=\"rc\"><div class=\"e\">Manfred came to (e) him and said,</div><div class=\"k\">Manfred는 (e) 그(= Erik)에게 와서 말했다,</div></div><div class=\"rc\"><div class=\"e\">“Erik, if you don’t get another piano,</div><div class=\"k\">“Erik, 만약 당신이 다른 피아노를 가져오지 않는다면,</div></div><div class=\"rc\"><div class=\"e\">Keith can’t play tonight.”</div><div class=\"k\">Keith는 오늘 밤에 연주할 수 없어요.”</div></div><div class=\"rnat\">(D)(3) 그러고 나서 긴 침묵 후에, Manfred는 (e)그(Erik)에게 와서 “Erik, 만약 당신이 다른 피아노를 가져오지 않는다면, Keith는 오늘 밤에 연주할 수 없어요.”라고 말했다.</div><div class=\"rst\">한참 조용하더니 만프레드가 “에릭, 다른 피아노 없으면 키스는 오늘 밤 못 쳐요.” 축제 날 마이크가 고장 난 것 같은 위기예요.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">(D)(4)번</span><div class=\"rc\"><div class=\"e\">Erik knew</div><div class=\"k\">Erik은 알고 있었다</div></div><div class=\"rc\"><div class=\"e\">that Keith had requested a specific instrument,</div><div class=\"k\">Keith가 특정 악기를 요청했다는 것을,</div></div><div class=\"rc\"><div class=\"e\">which the Opera House had agreed to provide.</div><div class=\"k\">그리고 그것(= 그 특정 악기)을 오페라 하우스가 제공하기로 동의했다는 것을.</div></div><div class=\"rnat\">(D)(4) Erik은 Keith가 특정 악기를 요청했고, 그것(특정 악기)을 오페라 하우스가 제공하기로 동의했다는 것을 알고 있었다.</div><div class=\"rst\">에릭은 키스가 특정 피아노를 부탁했고 오페라 하우스가 준비하기로 한 걸 알고 있었어요. = 지문 (D)(4).</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">(D)(5)번</span><div class=\"rc\"><div class=\"e\">What he hadn’t realized was</div><div class=\"k\">그(= Erik)가 알아차리지 못했던 것은 ~이었다</div></div><div class=\"rc\"><div class=\"e\">that the administrative staff</div><div class=\"k\">관리 직원이</div></div><div class=\"rc\"><div class=\"e\">hadn’t been able to find</div><div class=\"k\">찾을 수 없었다는 것</div></div><div class=\"rc\"><div class=\"e\">the requested Bösendorfer piano,</div><div class=\"k\">요청된 Bösendorfer 피아노를,</div></div><div class=\"rc\"><div class=\"e\">and they had instead installed</div><div class=\"k\">그리고 그들(= 관리 직원)은 대신 설치했다는 것</div></div><div class=\"rc\"><div class=\"e\">a tiny little Bösendorfer</div><div class=\"k\">아주 작은 Bösendorfer (피아노)를</div></div><div class=\"rc\"><div class=\"e\">that was in poor condition.</div><div class=\"k\">상태가 좋지 않았던.</div></div><div class=\"rnat\">(D)(5) 그(Erik)가 알아차리지 못했던 것은 관리 직원이 요청된 Bösendorfer 피아노를 찾을 수 없어서, 그들은 그 대신 상태가 좋지 않았던 아주 작은 Bösendorfer (피아노)를 설치했다는 것이었다.</div><div class=\"rst\">그런데 직원들이 그 피아노를 못 찾고, 대신 <b>상태가 나쁜</b> 작은 피아노를 갖다 놓은 거예요. 이게 문제의 정체예요.</div></div><div class=\"rds\" data-ord=\"10\"><span class=\"rn\">(C)(1)번</span><div class=\"rc\"><div class=\"e\">(C) Understandably,</div><div class=\"k\">(C) 당연히,</div></div><div class=\"rc\"><div class=\"e\">Keith didn’t want to perform.</div><div class=\"k\">Keith는 공연하기를 원하지 않았다.</div></div><div class=\"rnat\">(C)(1) 당연히, Keith는 공연하기를 원하지 않았다.</div><div class=\"rst\"><b>당연히</b>(Understandably) 키스는 공연하기 싫었어요. 나쁜 피아노를 직접 쳐 봤으니까요. = 지문 (C)(1).</div></div><div class=\"rds\" data-ord=\"11\"><span class=\"rn\">(C)(2)번</span><div class=\"rc\"><div class=\"e\">He left and went to wait in his car,</div><div class=\"k\">그(= Keith)는 (자리를) 떠나 그의 차 안에서 기다리러 가 버렸다,</div></div><div class=\"rc\"><div class=\"e\">leaving Erik to anticipate</div><div class=\"k\">Erik이 예상하도록(걱정하도록) 내버려 둔 채</div></div><div class=\"rc\"><div class=\"e\">the arrival of soon-to-be furious concert-goers.</div><div class=\"k\">곧 분노할 콘서트 관객들의 도착을.</div></div><div class=\"rnat\">(C)(2) 그는 (자리를) 떠나 그의 차 안에서 기다리기 위해 가 버렸고, Erik이 곧 분노할 콘서트에 올 관객들의 도착을 걱정하도록 내버려두었다.</div><div class=\"rst\">키스는 차에 가서 기다려 버렸어요. 여기까지만 보면 외면한 것 같지만, 이건 에릭을 빗속에서 <b>보기 전</b> 일이에요.</div></div><div class=\"rds\" data-ord=\"12\"><span class=\"rn\">(C)(3)번</span><div class=\"rc\"><div class=\"e\">Desperate,</div><div class=\"k\">절박해서,</div></div><div class=\"rc\"><div class=\"e\">(c) the German teenager</div><div class=\"k\">(c) 그 독일인 십대(= Erik)는</div></div><div class=\"rc\"><div class=\"e\">caught up with Keith</div><div class=\"k\">Keith를 따라가</div></div><div class=\"rc\"><div class=\"e\">and begged the jazz pianist to play.</div><div class=\"k\">그 재즈 피아니스트(= Keith)에게 연주를 해 달라고 간청했다.</div></div><div class=\"rnat\">(C)(3) 절박해서(절박한 심정으로), (c)그 독일인 십대(Erik)는 Keith를 따라가 그 재즈 피아니스트에게 연주를 해달라고 간청했다.</div><div class=\"rst\">절박해진 에릭은 키스를 쫓아가 제발 연주해 달라고 빌었어요. 지문의 그 독일인 십대가 에릭이에요.</div></div><div class=\"rds key\" data-ord=\"13\"><span class=\"rn\">(C)(4)번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">The pianist looked out at him</span></div><div class=\"k\"><span class=\"cw\">그 피아니스트는 그(= Erik)를 내다보았다</span></div></div><div class=\"rc\"><div class=\"e\">standing in the rain,</div><div class=\"k\">빗속에 서 있는,</div></div><div class=\"rc\"><div class=\"e\">completely soaked,</div><div class=\"k\">완전히 젖은 채로,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and took pity on him.</span></div><div class=\"k\"><span class=\"cw\">그리고 그(= Erik)를 불쌍히 여겼다.</span></div></div><div class=\"rnat\">(C)(4) 그 피아니스트는 완전히 젖은 채로 빗속에 서있는 그(Erik)를 내다보았고, 그를 불쌍히 여겼다.</div><div class=\"rst\">키스는 빗속에 흠뻑 젖은 에릭을 보고 <b>불쌍히 여겼어요</b>(took pity on). 선택지 ④ “외면했다”와 정반대예요!</div></div><div class=\"rds\" data-ord=\"14\"><span class=\"rn\">(C)(5)번</span><div class=\"rc\"><div class=\"e\">“Never forget,” Keith said.</div><div class=\"k\">“절대 잊지 말아라.”라고 Keith가 말했다.</div></div><div class=\"rnat\">(C)(5) “절대 잊지 말아라.”라고 Keith가 말했다.</div><div class=\"rst\">키스가 말해요. “절대 잊지 마라.” 이제 연주해 주겠다는 뜻이에요.</div></div><div class=\"rds\" data-ord=\"15\"><span class=\"rn\">(C)(6)번</span><div class=\"rc\"><div class=\"e\">“Only for (d) you.”</div><div class=\"k\">“오직 (d) 너(= Erik)를 위해서다.”</div></div><div class=\"rnat\">(C)(6) “오직 (d)너(Erik)를 위해서다.”</div><div class=\"rst\">“오직 너를 위해서야.” 키스가 에릭 한 사람을 위해 연주하겠다고 말해요.</div></div><div class=\"rds\" data-ord=\"16\"><span class=\"rn\">(C)(7)번</span><div class=\"rc\"><div class=\"e\">A few hours later,</div><div class=\"k\">몇 시간 후,</div></div><div class=\"rc\"><div class=\"e\">Keith walked out to the unplayable piano</div><div class=\"k\">Keith는 연주할 수 없는 피아노로 걸어 나왔다</div></div><div class=\"rc\"><div class=\"e\">in front of a packed concert hall.</div><div class=\"k\">(관객들로) 꽉 찬 공연장 앞에서.</div></div><div class=\"rnat\">(C)(7) 몇 시간 후, Keith는 (관객들로) 꽉 찬 공연장 앞의 연주할 수 없는 피아노로 걸어 나왔다.</div><div class=\"rst\">몇 시간 뒤, 키스는 관객이 꽉 찬 공연장에서 그 연주하기 힘든 피아노로 걸어 나왔어요. = 지문 (C)(7).</div></div><div class=\"rds\" data-ord=\"17\"><span class=\"rn\">(B)(1)번</span><div class=\"rc\"><div class=\"e\">(B) When Keith began to play,</div><div class=\"k\">(B) Keith가 연주하기 시작했을 때,</div></div><div class=\"rc\"><div class=\"e\">everybody immediately knew</div><div class=\"k\">모든 사람들은 즉시 알게 되었다</div></div><div class=\"rc\"><div class=\"e\">this was magic.</div><div class=\"k\">이것(= Keith의 연주)이 마법이라는 것을.</div></div><div class=\"rnat\">(B)(1) Keith가 연주하기 시작했을 때, 모든 사람들은 즉시 이것(그의 연주)이 마법이라는 것을 알게 되었다.</div><div class=\"rst\">연주가 시작되자 모두가 <b>바로</b>(immediately) “마법이다!” 하고 느꼈어요. 선택지 ② “시작되자마자 감동”과 같아요.</div></div><div class=\"rds\" data-ord=\"18\"><span class=\"rn\">(B)(2)번</span><div class=\"rc\"><div class=\"e\">Erik too was deeply touched.</div><div class=\"k\">Erik 또한 깊이 감명받았다.</div></div><div class=\"rnat\">(B)(2) Erik 또한 깊이 감명 받았다.</div><div class=\"rst\">무대를 준비한 에릭도 깊이 감동했어요. 축제를 지켜 낸 학생회장 같은 마음이에요.</div></div><div class=\"rds\" data-ord=\"19\"><span class=\"rn\">(B)(3)번</span><div class=\"rc\"><div class=\"e\">Keith was unexpectedly producing</div><div class=\"k\">Keith는 뜻밖에 만들어 내고 있었다</div></div><div class=\"rc\"><div class=\"e\">the performance of a lifetime</div><div class=\"k\">생애 최고의 공연을</div></div><div class=\"rc\"><div class=\"e\">despite the shortcomings of the piano.</div><div class=\"k\">피아노의 단점에도 불구하고.</div></div><div class=\"rnat\">(B)(3) Keith는 피아노의 단점에도 불구하고 뜻밖에 생애 최고의 공연을 하고 있었다.</div><div class=\"rst\">피아노가 별로였는데도 키스는 뜻밖에 생애 최고의 공연을 해냈어요. = 지문의 피아노의 단점에도 불구하고.</div></div><div class=\"rds\" data-ord=\"20\"><span class=\"rn\">(B)(4)번</span><div class=\"rc\"><div class=\"e\">(b) His left hand produced</div><div class=\"k\">(b) 그(= Keith)의 왼손은 만들어 냈다</div></div><div class=\"rc\"><div class=\"e\">thundering, repetitive bass riffs</div><div class=\"k\">천둥소리 같은, 반복되는 저음 반복 악절을</div></div><div class=\"rc\"><div class=\"e\">as a way of covering up</div><div class=\"k\">감추기 위한 하나의 방법으로</div></div><div class=\"rc\"><div class=\"e\">the piano’s lack of resonance.</div><div class=\"k\">피아노의 소리 울림의 부족함을.</div></div><div class=\"rnat\">(B)(4) (b)그(Keith)의 왼손은 피아노의 소리 울림의 부족함을 감추기 위한 하나의 방법으로 천둥소리 같은, 반복되는 저음 반복 악절을 만들어 냈다.</div><div class=\"rst\">왼손으로 천둥 같은 저음을 반복해서, 피아노 소리가 잘 안 울리는 걸 감췄어요. = 지문 (B)(4).</div></div><div class=\"rds\" data-ord=\"21\"><span class=\"rn\">(B)(5)번</span><div class=\"rc\"><div class=\"e\">Keith really had to play that piano very hard</div><div class=\"k\">Keith는 정말로 그 피아노를 아주 세게 연주해야 했다</div></div><div class=\"rc\"><div class=\"e\">to get enough volume</div><div class=\"k\">충분한 음량을 내도록</div></div><div class=\"rc\"><div class=\"e\">to get to the balconies.</div><div class=\"k\">발코니석까지 닿을.</div></div><div class=\"rnat\">(B)(5) Keith는 발코니석까지 닿을 수 있는 충분한 음량을 내도록 정말로 그 피아노를 아주 세게 연주해야 했다.</div><div class=\"rst\">맨 위 발코니석까지 소리가 닿게 하려고 피아노를 아주 <b>세게</b> 쳤어요. 선택지 ③ “충분한 음량을 위해 노력”과 같아요.</div></div><div class=\"rds\" data-ord=\"22\"><span class=\"rn\">(B)(6)번</span><div class=\"rc\"><div class=\"e\">Standing up and sitting down,</div><div class=\"k\">일어섰다 앉았다 하면서,</div></div><div class=\"rc\"><div class=\"e\">Keith played the unplayable piano</div><div class=\"k\">Keith는 그 연주할 수 없는 피아노를 연주했다</div></div><div class=\"rc\"><div class=\"e\">to produce something unique.</div><div class=\"k\">독특한 무언가를 만들어 내기 위해.</div></div><div class=\"rnat\">(B)(6) 일어섰다 앉았다 하면서, Keith는 독특한 무언가를 만들어 내기 위해 그 연주할 수 없는 피아노를 연주했다.</div><div class=\"rst\">일어섰다 앉았다 하며 그 피아노로 세상에 없던 독특한 연주를 만들어 냈어요. = 지문 (B)(6).</div></div><div class=\"rds\" data-ord=\"23\"><span class=\"rn\">(B)(7)번</span><div class=\"rc\"><div class=\"e\">It wasn’t the music</div><div class=\"k\">그것(= Keith가 연주한 음악)은 음악이 아니었다</div></div><div class=\"rc\"><div class=\"e\">that he ever imagined playing.</div><div class=\"k\">그가 연주하리라고 상상해 본.</div></div><div class=\"rnat\">(B)(7) 그것은 그가 연주할 것이라고 결코 상상할 수 없었던 음악이었다.</div><div class=\"rst\">그건 키스가 평소에 상상해 본 음악이 아니었어요. 나쁜 피아노 덕분에 나온 새로운 음악이에요.</div></div><div class=\"rds\" data-ord=\"24\"><span class=\"rn\">(B)(8)번</span><div class=\"rc\"><div class=\"e\">But faced with a challenge,</div><div class=\"k\">하지만 도전에 직면했을 때,</div></div><div class=\"rc\"><div class=\"e\">he accepted it and flew high.</div><div class=\"k\">그(= Keith)는 그것(= 도전)을 받아들였고 높이 날아올랐다.</div></div><div class=\"rnat\">(B)(8) 하지만 도전에 직면했을 때, 그는 그것을 받아들였고 높이 날아올랐다(성공했다).</div><div class=\"rst\">하지만 어려움을 피하지 않고 받아들여 높이 날아올랐어요. 위기를 기회로 바꾼, 이야기의 마무리예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"sellout\" data-m=\"매진\"><b>sellout</b>매진</button><button type=\"button\" class=\"wdb\" data-w=\"immediately\" data-m=\"즉시\"><b>immediately</b>즉시</button><button type=\"button\" class=\"wdb\" data-w=\"desperate\" data-m=\"절박한\"><b>desperate</b>절박한</button><button type=\"button\" class=\"wdb\" data-w=\"soaked\" data-m=\"흠뻑 젖은\"><b>soaked</b>흠뻑 젖은</button><button type=\"button\" class=\"wdb\" data-w=\"packed\" data-m=\"꽉 찬\"><b>packed</b>꽉 찬</button><button type=\"button\" class=\"wdb\" data-w=\"in poor condition\" data-m=\"상태가 나쁜\"><b>in poor condition</b>상태가 나쁜</button></div>"};

  });
  if(cq.w.length){h+='<div class="sec">단어</div><div class="wds">'+cq.w.map(w=>'<span><b>'+esc(w[0])+'</b>'+esc(w[1])+'</span>').join('')+'</div>';}
  h+='<button class="toq" data-i="'+i+'">빠른 정답으로</button>';
  return h+'</div></details>';
}
function renderExp(){
  const rec=S.sub;
  let h=hdr()+band(4)+'<div class="wrap">';
  h+='<div class="score">'+rec.s+' <small>/ '+N+'</small></div><h2 id="quick">빠른 정답</h2><div class="qc">';
  for(let i=0;i<N;i++){const ok=isRight(i,rec.a[i]);h+='<button class="qchip '+(ok?'o':'x')+'" data-i="'+i+'"><small>'+esc(D[i].no)+'번</small>'+ansText(i)+' '+(ok?'○':'✕')+'</button>';}
  h+='</div><h2>해설</h2>';
  for(let i=0;i<N;i++)h+=qHtml(i,rec.a[i]);
  h+='</div><div class="bar"><div class="wrap"><a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="index.html">목록</a>'+(NEXT?'<a class="btn pri" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+NEXT+'">다음 세트</a>':'')+'</div></div>';
  app.innerHTML=h;
}
/* 위임 이벤트 */
document.addEventListener('click',e=>{
  const qchip=e.target.closest('.qchip');
  if(qchip){const dd=document.getElementById('qd'+qchip.dataset.i);if(dd){dd.open=true;dd.scrollIntoView({block:'start'});}return;}
  const toq=e.target.closest('.toq');
  if(toq){const qq=document.getElementById('quick');if(qq)qq.scrollIntoView({block:'start'});return;}
  const tb=e.target.closest('.tab,.hcard,.gohome');
  if(tb&&!tb.disabled){view=tb.dataset.v;armed=null;render();return;}
  const ch=e.target.closest('.ch');
  const hd=e.target.closest('.sc-h');
  if(hd){const sc=hd.closest('.sc'),o=!sc.classList.contains('open');sc.classList.toggle('open',o);sc.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',o));sc.querySelectorAll('.lay').forEach(l=>l.classList.toggle('on',o));return;}
  const st=null;
  if(st){
    const s=st.closest('.s,.sc'),lays=[...s.querySelectorAll('.lay')],names=st.dataset.names.split('|');
    const shown=lays.filter(l=>l.classList.contains('on')).length;
    if(shown<lays.length){lays[shown].classList.add('on');st.textContent=shown+1<lays.length?names[shown+1]:'접기';}
    else{lays.forEach(l=>l.classList.remove('on'));st.textContent=names[0];}
    return;
  }
  const al=e.target.closest('.tbtn');
  if(al){
    const open=al.dataset.all==='1',body=al.closest('.dkbody');
    body.querySelectorAll('.ch').forEach(c=>c.classList.toggle('open',open));body.querySelectorAll('.sc').forEach(c=>c.classList.toggle('open',open));
    body.querySelectorAll('.s,.sc').forEach(s=>{
      const lays=s.querySelectorAll('.lay'),b=s.querySelector('.stg');
      lays.forEach(l=>l.classList.toggle('on',open));
      if(b){const names=b.dataset.names.split('|');b.textContent=open?'접기':names[0];}
    });
  }
});
render();
</script>
