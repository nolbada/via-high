<title>고3 미니모의고사 8회 07–12번</title>
<style>
:root{--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--bg:#ffffff;--soft:#f5f6f8;--accent:#23406b;--bad:#c2392b;--badbg:#fdeceb;--good:#1f7a4d;--goodbg:#e8f5ee;--hl:#fff3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .row1{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:11px 0;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.35}
.link{text-decoration:none;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px;font-family:inherit}
.hd2{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd2 h1{font-size:17px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.no{color:var(--sub);font-size:13px;min-width:20px}
.word{font-size:19px;font-weight:700}
.src{color:var(--sub);font-size:12px;margin-left:auto}
.cells{display:flex;flex-direction:column;gap:6px}
.cell{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:8px;background:var(--soft);border:1.5px solid transparent;font-size:16px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.cell .tag,.part .tag{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;background:#7a8594}
.cell.s .tag,.part.s .tag{background:#2d62a8}.cell.a .tag,.part.a .tag{background:#b4472f}
.ko{color:var(--sub);font-size:14px;margin-left:6px}
.cell.bad{background:var(--badbg);border-color:var(--bad)}
.cell.bad .tag{background:var(--bad)}
.locked .cell{pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-size:15px;line-height:1.25;font-weight:700;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4}
.note-item{padding:14px 0;border-bottom:1px solid var(--line)}
.note-item .w{font-size:19px;font-weight:700}
.meta{color:var(--sub);font-size:12px;margin-left:8px;font-weight:400}
.part{display:flex;gap:10px;align-items:baseline;padding:6px 0 0;font-size:16px}
.part .tag{align-self:center}
.part.bad{color:var(--bad);font-weight:700}
.part.bad .tag{background:var(--bad)}
.part .ko{font-weight:400}
.part .res{margin-left:auto;font-size:13px;font-weight:700}
.res.o{color:var(--good)}.res.x{color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:16px}
.q{padding:22px 0 8px}
.q .cnt{color:var(--sub);font-size:14px}
.q .ask{font-size:15px;color:var(--sub);margin-top:14px}
.q .target{font-size:28px;font-weight:700;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-family:inherit;color:var(--ink)}
.opt .ko{display:block;margin:2px 0 0}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.done .opt{pointer-events:none}
.score{font-size:34px;font-weight:700;text-align:center;margin:30px 0 6px}
.score small{font-size:18px;color:var(--sub);font-weight:400}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 8px}
/* submit */
.qrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qno{font-weight:800;font-size:20px;width:34px;flex:none}
.opts{display:flex;gap:8px;flex:1}
.opt2{flex:1;min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-family:inherit;color:var(--ink)}
.opt2.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2[disabled]{opacity:.55}
.opt2.on[disabled]{opacity:1}
/* explanation */
h2{font-size:17px;margin:26px 0 10px}
.quick div{padding:3px 0;font-size:17px}
.quick .o{color:var(--good)}.quick .x{color:var(--bad)}
.sub{color:var(--sub)}
details.qd{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg)}
details.qd>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.qd>summary::-webkit-details-marker{display:none}
details.qd>summary small{font-weight:400;color:var(--sub);font-size:13px}
.res2{margin-left:auto;font-size:14px}
.res2.o{color:var(--good)}.res2.x{color:var(--bad)}
.qx{padding:0 14px 14px}
.qx h4{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.qx p{margin:6px 0;line-height:1.75;font-size:16px}
.ansline b{font-size:17px}
.en{font-size:16px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:8px}
.kolist{list-style:none;margin:6px 0;padding:0}
.kolist li{font-size:15px;line-height:1.7}
.kolist .n{font-size:12px;color:var(--sub);margin-right:6px}
.why p{margin:4px 0;font-size:15px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c.ok{border-color:var(--good);background:var(--goodbg)}
.c .ct{font-weight:700;font-size:16px;line-height:1.5}
.c .tg{display:inline-block;font-size:12px;color:#fff;background:#7a8594;border-radius:4px;padding:1px 7px;margin-right:6px;font-weight:700}
.c.ok .tg{background:var(--good)}
.c p{margin:4px 0 0;font-size:15px}
.r{color:var(--sub);font-size:13px}
/* direct reading practice */
details.dk{margin:16px 0 4px;border:1px solid var(--line);border-radius:10px}
details.dk>summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;color:var(--accent);font-size:15px}
details.dk>summary::-webkit-details-marker{display:none}
.dkbody{padding:0 12px 12px}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tbtn{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:14px;font-weight:700;color:var(--accent)}
.s{padding:10px 0 12px;border-top:1px dashed var(--line)}
.s.ev{background:linear-gradient(90deg,#fffbe8,#fff);margin:0 -6px;padding-left:6px;padding-right:6px}
.sn{margin-bottom:6px}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--sub);margin-right:6px}
.lb.ev{background:var(--hl);color:#7a5b00}
.ch{padding:9px 11px;margin-bottom:6px;border-radius:8px;background:var(--soft);cursor:pointer;border-bottom:2px dotted #c9cfd6}
.ch .ce{font-size:16px;line-height:1.6}
.ch .ce b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ch .ck{display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--accent);font-size:15px;line-height:1.65}
.ch.open{background:#eef2f8;border-bottom-color:transparent}
.ch.open .ck{display:block}
.lay{display:none;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;line-height:1.7}
.lay.on{display:block}
.stg{width:100%;min-height:42px;margin-top:6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}

.tabs .tab{padding:7px 2px 6px;line-height:1.15;font-size:14px}
.tab .t2{display:block;font-size:10.5px;font-weight:400;margin-top:2px}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:11px;font-weight:700;margin-right:3px;text-align:center}
.tab.on .n{background:var(--accent);color:#fff}
.tab[disabled] .t2{color:var(--bad)}
.band{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#eef2f8}
.band .bn{flex:none;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:17px}
.band b{display:block;font-size:17px;line-height:1.3}
.band small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.hcards{padding:14px 0 30px;display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;text-align:left;color:var(--ink)}
.hcard .bn{flex:none;width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font-weight:800;font-size:20px}
.hcard .tx{flex:1;min-width:0}
.hcard .tx b{display:block;font-size:18px;line-height:1.3}
.hcard .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px}
.hcard .chip{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--sub)}
.hcard .chip.ok{background:var(--goodbg);color:var(--good)}
.hcard .chip.warn{background:var(--badbg);color:var(--bad)}
.hcard[disabled]{opacity:.55}
details.qd>summary::after{content:'\25BE';margin-left:auto;color:var(--sub)}
details.qd[open]>summary::after{content:'\25B4'}
.cell.s{padding:8px 12px;border:1.5px solid transparent;margin:0;background:var(--soft)}.cell.s.bad{background:var(--badbg);border-color:var(--bad)}


/* ---- 읽는 순서 ---- */
.sc .lay.th{background:#f4f8fd;border:1px solid #cfdcf0;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.th .hd{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:6px}
.th ol{list-style:none;margin:0;padding:0;counter-reset:n}
.th li{counter-increment:n;position:relative;padding:7px 0 7px 30px;font-size:15px;line-height:1.7;border-top:1px dashed #cfdcf0}
.th li:first-child{border-top:0}
.th li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:21px}
.th li b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.th .sub{margin:3px 0 0;color:#444;font-size:14.5px;line-height:1.7}
.sc .lay.sum{border-left:4px solid #2e7d32;background:#f1f8f1}
/* ---- 새 직독직해·해설 화면 ---- */
.sc{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:var(--bg)}
.sc-h{padding:11px 14px 10px;background:#eef2f8;border-bottom:1px solid var(--line)}
.sc-h .no2{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 7px;margin-right:8px}
.sc-h .at{font-size:13px;color:var(--sub)}
.sc-h .tt{display:block;margin-top:7px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.45}
.sc-b{padding:10px 12px 12px}
.sc .ch{margin-bottom:6px}
.sc .ce{font-size:17px}
.sc .ce sup,.nt sup{font-size:10px;font-weight:800;color:#b8651f;margin-left:1px}
.nts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.nt{font-size:13.5px;line-height:1.5;background:#fbf6ee;border:1px solid #f0e2cd;border-radius:8px;padding:5px 9px;color:#4a3a22}
.nt b{color:#33260f}
.sc .lay{border-radius:10px}
.sc .lay.nat{border-left:4px solid var(--accent);background:#f7f9fc}

.sc .lay.ana b,.why2 b,.opx b,.evx b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sc .lb{margin-bottom:4px}
.qc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.qchip{min-width:56px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;color:var(--ink);font-weight:700}
.qchip small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-bottom:1px}
.qchip.o{border-color:var(--good);background:var(--goodbg)}
.qchip.x{border-color:var(--bad);background:var(--badbg)}
.sec{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.trs{list-style:none;margin:0;padding:0;background:var(--soft);border-radius:10px;padding:8px 12px}
.trs li{font-size:15px;line-height:1.75;padding:2px 0}
.trs .n{display:inline-block;min-width:20px;font-size:12px;color:var(--sub);font-weight:700}
.evx{background:var(--goodbg);border:1px solid #bfe0cd;border-radius:10px;padding:10px 12px}

.opx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.opx.a{border-color:var(--good);background:var(--goodbg)}
.opx .ot{font-size:15.5px;font-weight:700;line-height:1.55}

.opx.a .mk{color:var(--good)}

.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds span{font-size:14px;background:var(--soft);border-radius:8px;padding:5px 9px;line-height:1.45}
.wds b{margin-right:5px}
.toq{display:block;width:100%;margin-top:14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px}
details.sub2{margin:12px 0 0}
details.sub2>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;padding:6px 0}
details.sub2>summary::-webkit-details-marker{display:none}

.cr{color:#A3102E;font-weight:700}
.sc .lay.core{border-left:4px solid #2e7d32;background:#f1f8f1}
.ct{display:none;margin:7px 0 2px;padding:6px 9px;border-left:3px solid #d9a21b;background:#fff8e6;border-radius:6px;font-size:13.5px;line-height:1.55;color:#4d3b05}

.rst{margin-top:8px;background:#fff8e1;border:1px solid #efe3b8;border-left:4px solid #d9a21b;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.7;word-break:keep-all}

    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  function DEL(w,src){var k=String(w||'').toLowerCase().trim(),hit=false;
    if(!busy){var Q=jq(QK).map(function(b){return b.filter(function(it){var m=String(it.w||'').toLowerCase().trim()===k&&it.src===src;if(m)hit=true;return!m})}).filter(function(b){return b.length});if(hit){s(QK,JSON.stringify(Q));return Promise.resolve({ok:true,removed:true})}}
    var n=name();if(!n)return Promise.resolve(null);
    function go(){return post({act:'del',name:n,pin:PIN,w:w,src:src})}
    return flush().then(go).then(function(r){if(r&&r.ok&&r.removed===false&&r.reason==='none')return new Promise(function(z){setTimeout(z,3000)}).then(go);return r}).catch(function(){return null})}
  W.WN={add:function(items){

    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },del:DEL,gate:gate,flush:flush,name:name};
  flush();
})(window);

 말이에요.", "gist": "선택지 ③이에요. 교사의 목소리 사용법이 아니라 학교 소음 문제 이야기라 흐름에서 벗어나요."}, {"n": 6, "ch": [{"e": "<b>However<\/b>, I would always advise", "k": "그러나 나는 항상 조언하고자 한다"}, {"e": "that you use your loudest voice", "k": "당신이 자신의 가장 큰 목소리를 사용해야 한다고"}, {"e": "incredibly <b>sparingly<\/b>", "k": "놀랍도록 드물게"}, {"e": "and avoid shouting", "k": "그리고 소리치는 것을 피해야 한다고"}, {"e": "as much as possible.", "k": "최대한."}], "link": "그러나 나는 당신이 자신의 가장 큰 목소리는 놀랍도록 드물게 사용하고 소리치는 것을 최대한 피해야 한다고 항상 조언하고자 한다.", "easy": "하지만 가장 큰 목소리는 아주 가끔만 쓰고, 소리 지르는 건 되도록 피하라고 조언해요.", "gist": "선택지 ④예요. 큰 목소리가 유용하다는 (4)와 대조를 이뤄요."}, {"n": 7, "ch": [{"e": "A quiet, <b>authoritative<\/b> and <b>measured<\/b> tone", "k": "조용하고 권위가 있으며 침착한 어조는"}, {"e": "has so much more impact", "k": "훨씬 더 큰 효과를 가진다"}, {"e": "than slightly <b>panicked<\/b> shouting.", "k": "약간 당황한 고함보다."}], "easy": "조용하고 침착하면서 권위 있는 말투가, 조금 당황해서 지르는 고함보다 훨씬 효과가 커요.", "gist": "선택지 ⑤예요. (6)의 조언에 이유를 붙여 마무리해요."}]}, {"no": "09", "typ": "요약문 완성", "src": "2014학년도 수능 B형 40번", "evn": [5, 8], "ev_en": "When the consumer agrees to purchase the product under the original terms, that behavior might be used by the consumer to infer his sincere interest in the product. / If the consumer were to withdraw from the deal after the ‘slight’ change in the terms of agreement, he might foster the rather undesirable impression of being an irresponsible consumer unaware of these necessary charges.", "ev_ko": [[5, "소비자가 원래의 계약 조건 하에서 제품을 구매하는데 동의했을 때, 그 행위는 제품에 대한 그(소비자)의 진정한 관심을 추론하는 데 소비자(자신)에 의해 사용될 수도 있다."], [8, "소비자가 합의 조건에 있어서 (제품 가격에) ‘약간의’ 변화가 있은 후에 그 거래를 철회하려 한다면, 그(소비자)는 이러한 불가피한 비용에 대해 알지 못하는 무책임한 소비자라는 다소 바람직하지 않은 인상을 조성할 수도 있다."]], "why": ["글은 low-balling이 효과가 있는 이유를 두 가지로 설명합니다", "첫째, (5)에서 소비자는 원래 조건으로 사기로 한 자기 행동을 보고 <b>자신이 그 제품에 진정한 관심이 있다<\/b>고 추론합니다", "그래서 늘어난 비용도 감당합니다", "이것은 자신의 구매 결정을 <b>justify<\/b>(정당화하다)하는 것입니다", "둘째, (8)에서 지금 거래를 철회하면 <b>무책임한 소비자라는 인상<\/b>을 줄 수 있습니다", "그런 인상을 피하려는 것은 <b>save face<\/b>(체면을 지키다)입니다", "그래서 정답은 ② justify …… face입니다."], "ch": [{"n": "①", "t": "justify …… time", "g": "정당화하다 …… 시간", "ok": false, "e": ["(A) justify는 맞습니다", "하지만 글은 시간을 아끼는 이야기를 하지 않습니다", "(8)에서 소비자가 피하려는 것은 무책임한 소비자라는 인상입니다."]}, {"n": "②", "t": "justify …… face", "g": "정당화하다 …… 체면", "ok": true, "e": ["(A)는 (5)의 자기 구매 행동을 근거로 진정한 관심을 추론하는 것, 곧 구매 결정을 정당화하는 것입니다", "(B)는 (8)의 무책임한 소비자라는 인상을 피하는 것, 곧 체면을 지키는 것입니다."]}, {"n": "③", "t": "cherish …… time", "g": "소중히 하다 …… 시간", "ok": false, "e": ["소비자는 구매 결정을 소중히 하는 것이 아니라 (5)처럼 진정한 관심을 추론해 결정을 정당화합니다", "(B) time도 글과 관계가 없습니다."]}, {"n": "④", "t": "modify …… face", "g": "변경하다 …… 체면", "ok": false, "e": ["(B) face는 맞습니다", "하지만 소비자는 거래를 철회하지 않으므로 구매 결정을 바꾸지(modify) 않습니다."]}, {"n": "⑤", "t": "modify …… trouble", "g": "변경하다 …… 고생", "ok": false, "e": ["소비자는 구매 결정을 바꾸지 않습니다", "또 (8)에서 피하려는 것은 고생이 아니라 무책임한 소비자라는 인상입니다."]}], "tr": ["low-balling(가격을 과소 산정하는 것)은 두 사람이 (가격에 관한) 합의를 한 다음, (그중) 한 명이 상대방에 의해 물려지게 되는(상대방이 물어야 하는) 비용을 늘리는 (판매)기술을 말하는 것이다.", "예를 들어, 소비자가 8천 달러를 주고 자동차를 구매하는데 동의한 후에, 판매자가 세금으로 100달러 그리고 타이어 가격으로 200달러를 추가하기 시작한다.", "이러한 추가 비용은 판매자가 소비자에게 던지는 비유적인 ‘낮은 공’과 같은 것으로 여겨질 수 있을 것이다.", "low-balling의 효과에 관한 한 가지 설명은 자기인식 이론에 관한 것이다.", "소비자가 원래의 계약 조건 하에서 제품을 구매하는데 동의했을 때, 그 행위는 제품에 대한 그(소비자)의 진정한 관심을 추론하는 데 소비자(자신)에 의해 사용될 수도 있다.", "이렇게 제품에 대해 추론된 진정한 관심은 그(소비자)가 늘어난 비용을 감당할 수 있게 할 것이다.", "또 다른 설명은 인상 관리 이론에 관한 것이다.", "소비자가 합의 조건에 있어서 (제품 가격에) ‘약간의’ 변화가 있은 후에 그 거래를 철회하려 한다면, 그(소비자)는 이러한 불가피한 비용에 대해 알지 못하는 무책임한 소비자라는 다소 바람직하지 않은 인상을 조성할 수도 있다.", "low-balling은 (제품) 판매 상황에서 효과적인데 왜냐하면 소비자가, 거래를 철회하지 않음으로써, 자신의 구매 결정을 (A)정당화하는 경향이 있거나 (B)체면을 지키려고 하기 때문이다."], "ps": [{"n": 1, "ch": [{"e": "<b>Low-balling<\/b> describes the technique", "k": "low-balling은 (판매) 기술을 말한다"}, {"e": "where two individuals arrive at an agreement", "k": "두 사람이 합의를 하고"}, {"e": "and then one increases the cost", "k": "그다음 (그중) 한 명이 비용을 늘리는"}, {"e": "to be <b>incurred<\/b> by the other.", "k": "상대방에 의해 물리게 되는."}], "link": "low-balling은 두 사람이 합의를 한 다음, 그중 한 명이 상대방이 물어야 하는 비용을 늘리는 기술을 말한다.", "easy": "low-balling은 function dwToast(m){let t=document.getElementById('wnt');if(!t){t=document.createElement('div');t.id='wnt';t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1800);}
function dwItem(q,k){const L=DW[q]||[];for(let i=0;i<L.length;i++)if(L[i][0]===k)return L[i];return null;}
function dwMark(head,on){document.querySelectorAll('.dw').forEach(function(x){const p=x.closest('[data-q]');const y=p&&dwItem(p.dataset.q,x.dataset.k);if(y&&(y[2]||y[0])===head)x.classList.toggle('on',on);});}
function dwWrap(){
  S.dw=S.dw||{};
  const roots=[];
  document.querySelectorAll('.sc[data-q]').forEach(function(sc){roots.push([sc.dataset.q,sc.querySelectorAll('.ce')]);});
  document.querySelectorAll('details.qd[data-q]').forEach(function(d){roots.push([d.dataset.q,d.querySelectorAll('.e,.en')]);});
  roots.forEach(function(r){
    const q=r[0],L=DW[q]||[];if(!L.length)return;
    const re=new RegExp("(^|[^A-Za-z])("+L.map(function(x){return x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['\u2019]")}).join('|')+")(?![A-Za-z])",'gi');
    r[1].forEach(function(el){
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
      nodes.forEach(function(nd){
        if(nd.parentNode.closest('.dw'))return;
        const s=nd.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
        while((m=re.exec(s))){
          const st=m.index+m[1].length,surf=m[2],key=surf.toLowerCase().replace(/\u2019/g,"'");
          const it=dwItem(q,key);if(!it)continue;
          if(!frag)frag=document.createDocumentFragment();
          if(st>last)frag.appendChild(document.createTextNode(s.slice(last,st)));
          const sp=document.createElement('span');sp.className='dw'+(S.dw[it[2]||it[0]]?' on':'');sp.dataset.k=key;sp.textContent=surf;frag.appendChild(sp);
          last=st+surf.length;
        }
        if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);}
      });
    });
  });
}
document.addEventListener('click',function(e){
  const el=e.target.closest&&e.target.closest('.dw');if(!el)return;
  e.stopPropagation();e.preventDefault();
  const p=el.closest('[data-q]');const it=p&&dwItem(p.dataset.q,el.dataset.k);if(!it)return;
  const head=it[2]||it[0],mean=it[1];S.dw=S.dw||{};const on=!S.dw[head];
  if(on)S.dw[head]=1;else delete S.dw[head];save();dwMark(head,on);
  if(on){try{WN.add([{w:head,m:mean,src:'미니모고',how:'별표',ask:true}]);}catch(err){}dwToast(head.replace(/\s+[AB](?=\s|$)/g,'').trim()+'  '+mean.replace(/\bA(?=[에를은는이가와과의도]|\s)|\bB(?=[에를은는이가와과의도]|\s)/g,'').replace(/\s+/g,' ').trim()+'  담음');}
  else{let pr=null;try{pr=WN.del(head,'미니모고');}catch(err){}
    if(pr&&pr.then)pr.then(function(r){if(r&&r.removed===false&&r.reason==='late'){S.dw[head]=1;save();dwMark(head,true);dwToast('이미 쌓인 단어라 뺄 수 없어요');}else if(r&&r.removed)dwToast(head+'  뺌');});
    else dwToast(head+'  뺌');}
},true);

th는 뜻밖에도 일생일대의 연주를 만들어 내고 있었다 / 그 피아노의 결점에도 불구하고.", "nat": "Keith는 그 피아노의 결점에도 불구하고 뜻밖에도 일생일대의 연주를 만들어 내고 있었다.", "ana": "<b>was producing</b>은 <b>과거진행</b>으로, 그 순간 눈앞에서 벌어지고 있던 일을 생생하게 그린다. 이야기 글에서 과거진행이 나오면 '<b>바로 그때 ~하고 있었다</b>'로 장면을 잡아 주면 된다. <b>despite</b>는 although와 뜻은 비슷하지만 <b>전치사</b>라서 뒤에 절이 아니라 <b>명사 덩어리</b>만 온다. despite the shortcomings처럼 곧바로 명사가 오는 것이 정상이고, despite that ~ 은 틀린 표현이다. <b>of the piano</b>는 앞의 shortcomings를 꾸미고, <b>of a lifetime</b>도 마찬가지로 performance를 꾸며 '일생일대의'라는 뜻을 만든다.", "pe": "Keith was \u0001unexpectedly<sup>1</sup>\u0002 producing the performance<sup>2</sup> \u0001of a lifetime\u0002 / \u0001despite<sup>3</sup> the shortcomings<sup>4</sup> \u0001of the piano\u0002\u0002.", "pk": "Keith는 \u0001뜻밖에도\u0002 \u0001일생일대의\u0002 연주를 만들어 내고 있었다 / \u0001\u0001그 피아노의\u0002 결점에도 불구하고\u0002.", "core": "Keith는 연주를 만들어 내고 있었다.", "tags": ["주어 Keith + 동사 was producing + 목적어 performance. unexpectedly = 부사: producing을 꾸밈. of a lifetime = 전치사구(형용사구): performance를 꾸밈", "despite ~ = 전치사구(부사구, 양보): was producing을 꾸밈. of the piano = 전치사구(형용사구): shortcomings를 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V+O(3형식)</b>이다. 과거진행 동사와 전치사구가 붙은 짧은 문장이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: Keith (사람 이름)", "V: was producing (produce 만들어 내다의 과거진행)", "O: the performance (연주, performance 연주·공연)", "뼈대 = <b>Keith was producing the performance</b>", "unexpectedly (뜻밖에도)는 producing을 꾸미는 부사"]}, {"t": "<b>of a lifetime</b>은 전치사구(형용사구)이다. performance를 꾸민다 (일생일대의). lifetime (일생)."}, {"t": "<b>despite the shortcomings of the piano</b>는 전치사구(부사구, 양보)이다. was producing을 꾸민다 (~에도 불구하고). despite는 전치사이다. shortcoming (결점), of the piano (그 피아노의)는 shortcomings를 꾸밈."}], "sum": "Keith, 피아노 결함에도 뜻밖의 일생일대 연주"}, {"i": "06", "q": "10", "s": "B-8", "title": "수동 분사구문 + S+V+O 병렬", "eng": "But faced with<sup>1</sup> a challenge<sup>2</sup>, / he accepted<sup>3</sup> it and flew high<sup>4</sup>.", "notes": [["1", "be faced with", "~에 직면하다"], ["2", "challenge", "난관, 도전"], ["3", "accept", "받아들이다"], ["4", "fly high", "날아오르다, 크게 해내다"]], "lit": "그러나 난관에 부딪히자, / 그는 그것을 받아들였고 높이 날아올랐다.", "nat": "그러나 난관에 부딪히자 그는 그것을 받아들였고, 높이 날아올랐다.", "ana": "<b>faced with ~</b>는 접속사와 주어가 사라진 <b>분사구문</b>인데, 시작이 <b>과거분사</b>라는 점이 핵심이다. 주어 he가 '<b>맞닥뜨려진</b>' 쪽이므로 facing이 아니라 <b>faced</b>가 온다. 분사구문의 주어는 언제나 <b>주절의 주어</b>이므로, 앞에 he가 없더라도 '그가 난관에 부딪히자'로 읽는다. <b>be faced with</b>(~에 직면하다)를 통째로 외워 두면 이 형태가 바로 보인다. 뒤쪽은 <b>accepted</b>와 <b>flew</b> 두 동사가 and로 묶인 <b>병렬</b>이고, flew high는 '(비행기가) 높이 날다'가 아니라 <b>크게 해냈다</b>는 비유다.", "pe": "But \u0001faced with<sup>1</sup> a challenge<sup>2</sup>\u0002, / he accepted<sup>3</sup> it and flew \u0001high<sup>4</sup>\u0002.", "pk": "그러나 \u0001난관에 부딪히자\u0002, / 그는 그것을 받아들였고 \u0001높이\u0002 날아올랐다.", "core": "그는 그것을 받아들였고 날아올랐다.", "tags": ["접속사 But. faced with ~ = 분사구문(부사적: 때·이유, 수동): 주절을 꾸밈. be faced with = ~에 직면하다", "주어 he + 동사 accepted + 목적어 it. and flew: 동사 병렬. high = 부사: flew를 꾸밈"], "steps": [{"t": "이 문장은 <b>수동 분사구문 + S+V 병렬</b>이다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: he (그)", "V①: accepted (accept 받아들이다의 과거형) + O: it (= a challenge, 난관)", "V②: flew (fly 날다의 과거형)", "뼈대 = <b>he accepted it and flew</b>", "high (높이)는 flew를 꾸미는 부사"]}, {"t": "<b>But faced with a challenge</b>는 수동 분사구문(부사적, 때·이유)이다. 주절을 꾸민다 (난관에 부딪히자). Being faced with에서 Being이 생략된 모양이다. be faced with (~에 직면하다), challenge (난관). But은 앞 내용과 대비하는 접속사이다."}], "sum": "난관을 마주하자, 받아들이고 높이 날아오름"}, {"i": "07", "q": "10", "s": "C-2", "title": "S+V 병렬 + 분사구문(leave A to V)", "eng": "He left and went to wait in his car, / leaving<sup>1</sup> Erik to anticipate<sup>2</sup> the arrival / of soon-to-be<sup>3</sup> furious<sup>4</sup> concert-goers<sup>5</sup>.", "notes": [["1", "leave A to V", "A가 ~하도록 남겨 두다"], ["2", "anticipate", "예상하다, 기다리다"], ["3", "soon-to-be", "곧 ~가 될"], ["4", "furious", "격분한"], ["5", "concert-goer", "공연 관람객"]], "lit": "그는 떠나서 자기 차에서 기다리러 갔고, / Erik이 도착을 예상하도록 남겨 둔 채 / 곧 격분하게 될 관객들의.", "nat": "그는 자리를 떠나 차 안에서 기다렸고, Erik은 곧 격분할 관객들이 몰려오리라는 것을 혼자 예상하며 남겨졌다.", "ana": "콤마 뒤의 <b>leaving ~</b>은 접속사와 주어가 사라진 <b>분사구문</b>이다. 앞 절의 주어 He가 그대로 leaving의 주인이며, 여기서는 '<b>그리고 ~한 채로</b>'라는 <b>결과·부대상황</b>으로 읽는다. <b>leave + 목적어 + to부정사</b>는 '~가 …하도록 (내버려) 두다'라는 5형식 짝이므로, Erik이 anticipate하는 주체다. <b>soon-to-be furious</b>처럼 하이픈으로 이어 붙인 덩어리는 통째로 <b>하나의 형용사</b>가 되어 뒤의 명사를 꾸민다. 하이픈이 보이면 그 안에서 문장 구조를 찾으려 하지 말고 한 단어로 취급하자.", "pe": "He left and went \u0001to wait \u0001in his car\u0002\u0002, / \u0001leaving<sup>1</sup> Erik to anticipate<sup>2</sup> the arrival\u0002 / \u0001of soon-to-be<sup>3</sup> furious<sup>4</sup> concert-goers<sup>5</sup>\u0002.", "pk": "그는 떠나서 \u0001\u0001자기 차에서\u0002 기다리러\u0002 갔고, / \u0001Erik이 도착을 예상하도록 남겨 둔 채\u0002 / \u0001곧 격분하게 될 관객들의\u0002.", "core": "그는 떠나서 갔다.", "tags": ["주어 He + 동사 left and went(병렬). to wait ~ = to부정사(부사적: 목적): went를 꾸밈. in his car = 전치사구(부사구): wait를 꾸밈", "leaving A to V = 분사구문(부사적: 결과): 주절을 꾸밈. leave A to V = A가 V하도록 남겨 두다", "of soon-to-be furious concert-goers = 전치사구(형용사구): arrival을 꾸밈"], "steps": [{"t": "이 문장은 <b>S+V 병렬(1형식)</b> + 분사구문이다. 분사구문 안이 leave A to V 모양이라 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: He (그)", "V①: left (leave 떠나다의 과거형)", "V②: went (go 가다의 과거형)", "뼈대 = <b>He left and went</b>"]}, {"t": "<b>to wait in his car</b>는 to부정사(부사적, 목적)이다. went를 꾸민다 (차 안에서 기다리러). wait (기다리다). in his car는 wait를 꾸미는 부사구이다."}, {"t": "<b>leaving Erik to anticipate the arrival ...</b>은 분사구문(부사적, 결과)이다. 주절을 꾸민다.", "sub": ["leave A to V = A가 V하도록 남겨 두다 (Erik이 예상하도록 남겨 둔 채)", "anticipate (예상하다), arrival (도착)"]}, {"t": "<b>of soon-to-be furious concert-goers</b>는 전치사구(형용사구)이다. arrival을 꾸민다 (곧 격분하게 될 관객들의). soon-to-be (곧 ~하게 될), furious (격분한), concert-goer (공연 관객)."}], "sum": "그는 차로 가 버리고, Erik은 곧 올 성난 관객들을 혼자 기다리게 됨"}, {"i": "08", "q": "10", "s": "D-5", "title": "What절 주어 + S+V+C(that절 병렬)", "eng": "What he hadn't realized<sup>1</sup> / was that the administrative<sup>2</sup> staff hadn't been able to find the requested<sup>3</sup> Bösendorfer piano, / and they had instead installed<sup>4</sup> a tiny little Bösendorfer / that was in poor condition<sup>5</sup>.", "notes": [["1", "realize", "깨닫다"], ["2", "administrative staff", "행정 직원"], ["3", "request", "요청하다"], ["4", "install", "설치하다"], ["5", "in poor condition", "상태가 나쁜"]], "lit": "그가 미처 깨닫지 못했던 것은 / 행정 직원들이 요청받은 뵈젠도르퍼 피아노를 찾아내지 못했다는 것, / 그리고 그들이 대신 아주 작은 뵈젠도르퍼를 설치해 두었다는 것이었다 / 상태가 나쁜.", "nat": "그가 미처 몰랐던 것은, 행정 직원들이 요청받은 그 뵈젠도르퍼 피아노를 구하지 못해 대신 상태가 형편없는 아주 작은 뵈젠도르퍼를 설치해 두었다는 사실이었다.", "ana": "문장 맨 앞의 <b>What ~</b>은 선행사를 품은 관계대명사절로, 통째로 <b>주어</b> 노릇을 한다. What으로 시작하는 문장을 만나면 <b>동사(여기서는 was)가 나올 때까지가 주어</b>라고 선을 그으면 된다. 보어 자리에는 <b>that절</b>이 왔고, 그 안이 다시 and로 이어진 두 절이다. 시제도 눈여겨보자. 주절이 과거(was)인데 that절이 <b>had not been able / had installed</b>라는 <b>과거완료</b>인 것은, 그 일이 '깨닫지 못한 시점보다 <b>더 먼저</b>' 일어났음을 보여 준다. 마지막 <b>that was in poor condition</b>은 앞의 피아노를 꾸미는 주격 관계대명사절이다.", "pe": "What he hadn't realized<sup>1</sup> / was that the \u0001administrative<sup>2</sup>\u0002 staff hadn't been able to find the \u0001requested<sup>3</sup>\u0002 Bösendorfer piano, / and they had \u0001instead\u0002 installed<sup>4</sup> a \u0001tiny little\u0002 Bösendorfer / \u0001that was in poor condition<sup>5</sup>\u0002.", "pk": "그가 미처 깨닫지 못했던 것은 / \u0001행정\u0002 직원들이 \u0001요청받은\u0002 뵈젠도르퍼 피아노를 찾아내지 못했다는 것, / 그리고 그들이 \u0001대신\u0002 \u0001아주 작은\u0002 뵈젠도르퍼를 설치해 두었다는 것이었다 / \u0001상태가 나쁜\u0002.", "core": "그가 미처 깨닫지 못했던 것은 직원들이 피아노를 찾지 못했고, 대신 뵈젠도르퍼를 설치했다는 것이었다.", "tags": ["주어: What절 = 명사절(주어). 동사 was가 나올 때까지 기다림", "동사 was + 보어: that절(명사절). 안쪽 주어 staff + hadn't been able to find + 목적어 piano. administrative, requested = 형용사: staff, piano 꾸밈", "and: 보어 that절 병렬. 주어 they + had installed + 목적어 Bösendorfer. instead = 부사: installed 꾸밈. tiny little = 형용사: Bösendorfer 꾸밈", "that절 = 관계절(형용사절): Bösendorfer를 꾸밈"], "steps": [{"t": "이 문장은 <b>What절 주어 + S+V+C(2형식)</b>이다. 주어도 보어도 절이라 길어 보인다."}, {"t": "뼈대부터 찾는다.", "sub": ["S: What he hadn't realized (그가 미처 깨닫지 못했던 것)", "V: was (be의 과거형, ~였다)", "C: that절 두 개 (~라는 것)", "뼈대 = <b>What he hadn't realized was that ...</b>", "what은 관계대명사 (~하는 것). realize (깨닫다), hadn't realized는 과거완료 부정"]}, {"t": "보어 ①: <b>that the administrative staff hadn't been able to find the requested Bösendorfer piano</b> (행정 직원들이 요청받은 뵈젠도르퍼 피아노를 찾지 못했다는 것)", "sub": ["administrative (행정의), staff (직원), be able to (~할 수 있다), find (찾다)", "requested (요청받은)는 piano를 꾸미는 과거분사. Bösendorfer는 피아노 브랜드 이름"]}, {"t": "보어 ②: <b>and they had instead installed a tiny little Bösendorfer</b> (그리고 그들이 대신 아주 작은 뵈젠도르퍼를 설치해 두었다는 것)", "sub": ["they = the administrative staff (행정 직원들)", "instead (대신), install (설치하다), tiny little (아주 작은)"]}, {"t": "<b>that was in poor condition</b>은 관계절(형용사절)이다. Bösendorfer를 꾸민다 (상태가 나쁜). condition (상태)."}], "sum": "그가 몰랐던 것: 직원들이 요청한 피아노를 못 구해 상태 나쁜 작은 피아노로 대체"}], "qs": [{"q": "07", "type": "빈칸 추론", "src": "2018학년도 9월 31번", "ans": "④", "tr": [["1", "창의성에 관한 암묵적인 진실 하나 — 그것은 대단한 재능에 관한 것이라기보다는 ______에 관한 것이다."], ["2", "잘 통하는 아이디어 몇 개를 찾으려면, 통하지 않는 것을 아주 많이 시도해 봐야 한다."], ["3", "그것은 순전한 확률 싸움이다."], ["4", "천재라고 해서 반드시 다른 창작자보다 성공률이 높은 것은 아니다. 그들은 그저 더 많이 할 뿐이고, 다양한 종류의 것들을 한다."], ["5", "그들은 성공도 더 많고 실패도 더 많다."], ["6", "팀과 회사도 마찬가지다."], ["7", "나쁜 아이디어를 많이 내지 않고서 좋은 아이디어를 많이 내는 것은 불가능하다."], ["8", "창의성의 핵심은, 처음에는 어떤 아이디어가 성공하고 어떤 것이 실패할지 알 수 없다는 점이다."], ["9", "그래서 할 수 있는 유일한 일은 더 빨리 실패해서 다음 아이디어로 넘어가는 것이다."]], "evh": "4번 문장", "ev": [{"en": true, "h": "Geniuses don't necessarily have a higher success rate than other creators; they simply do more — and they do a range of different things."}, {"en": false, "h": "빈칸 문장에 <b>not A so much as B</b>(A라기보다는 오히려 B) 구조가 있으므로, 빈칸에는 <b>wild talent와 대비되는 말</b>이 들어가야 한다. 글 전체가 그 대비를 반복한다. 2번 문장은 '많이 시도하라', 3번 문장은 '<b>순전한 확률 싸움</b>', 4번 문장은 '천재도 성공률이 높은 게 아니라 <b>그냥 더 많이 한다</b>', 5번 문장은 '성공도 실패도 많다'이다. 즉 창의성을 가르는 것은 재능의 <b>질</b>이 아니라 시도의 <b>양</b>이며, 이것을 한 단어로 옮기면 <b>productivity(생산성)</b>다. 이 글에서 '많이 만들어 낸다'는 말이 몇 번 반복되는지 세어 보면 답이 보인다."}], "opts": [{"n": "①", "t": "sensitivity (감수성)", "a": false, "x": true, "trap": false, "e": "섬세함이나 감정에 관한 언급이 전혀 없다. 창의성 하면 떠오르는 이미지로 고르면 걸린다."}, {"n": "②", "t": "superiority (우월성)", "a": false, "x": true, "trap": false, "e": "글은 오히려 천재가 남들보다 <b>우월하지 않다</b>(don't necessarily have a higher success rate)고 못박는다. 정반대 선지다."}, {"n": "③", "t": "imagination (상상력)", "a": false, "x": true, "trap": true, "e": "wild talent와 <b>같은 계열</b>의 말이다. 빈칸은 talent와 <b>대비되는</b> 자리이므로 들어갈 수 없다."}, {"n": "④", "t": "productivity (생산성)", "a": true, "x": false, "trap": false, "e": "4번 문장의 <b>they simply do more</b>, 2번 문장의 '많이 시도하라', 3번 문장의 numbers game을 한 단어로 압축한 말이다."}, {"n": "⑤", "t": "achievement (성취)", "a": false, "x": true, "trap": false, "e": "성취는 <b>결과</b>인데, 글은 결과가 아니라 <b>시도의 양</b>을 말한다. 오히려 실패를 많이 하라는 것이 요지다."}], "w": [["unspoken", "암묵적인, 말하지 않은"], ["so much as", "~라기보다는"], ["numbers game", "확률 싸움"], ["genius", "천재"], ["necessarily", "반드시"], ["success rate", "성공률"], ["a range of", "다양한"], ["generate", "만들어 내다"], ["at the outset", "처음에"], ["tell", "구별하다, 알아보다"], ["move onto", "~로 옮겨 가다"], ["productivity", "생산성"]]}, {"q": "08", "type": "무관한 문장", "src": "2023학년도 수능 35번", "ans": "③", "tr": [["1", "배우, 가수, 정치인을 비롯한 수많은 사람들은, 쓰인 단어를 단순히 해독하는 차원을 넘어서는 의사소통 수단으로서 인간 목소리가 지닌 힘을 알아본다."], ["2", "따라서 목소리를 통제하고 그것을 여러 목적에 맞게 쓰는 법을 배우는 것은, 교직 초년 교사로서 계발해야 할 가장 중요한 기술 중 하나다."], ["3", "① 자신 있게 지시할수록 학급이 긍정적으로 반응할 가능성이 높아진다."], ["4", "② 학교에서 일할 때 목소리를 크게 내보낼 수 있으면 아주 유용한 때가 있고, 시끄러운 교실이나 급식실, 운동장을 목소리로 뚫고 나갈 수 있다는 것은 대단한 능력이다."], ["5", "③ 학교의 심각한 소음 문제를 해결하기 위해서는 학생·학부모·교사가 함께 해결책을 찾아야 한다."], ["6", "④ 그러나 나는 언제나 가장 큰 목소리는 아주 아껴서 쓰고 고함은 가능한 한 피하라고 조언하겠다."], ["7", "⑤ 조용하고 권위 있으며 침착한 어조가 약간 당황한 고함보다 훨씬 더 큰 파급력을 지닌다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "③ In order to address serious noise issues in school, students, parents and teachers should search for a solution together."}, {"en": false, "h": "무관한 문장 문항은 <b>주제어가 그대로 있는데 주어가 바뀐 문장</b>을 찾는 것이 핵심이다. 이 글의 주어는 처음부터 끝까지 <b>교사 개인</b>이고, 주제는 '<b>교사가 자기 목소리를 어떻게 쓸 것인가</b>'다. ①은 교사의 지시, ②는 교사가 목소리를 크게 내는 것, ④·⑤는 교사가 목소리를 아껴 쓰는 것 — 모두 <b>교사의 목소리 사용법</b>이다. 그런데 ③만 주어가 <b>students, parents and teachers</b>로 바뀌고, 내용도 목소리 사용법이 아니라 <b>학교 소음 문제의 공동 해결</b>이다. noise라는 단어가 ②의 noisy classroom과 겹쳐 자연스러워 보이지만, <b>단어가 겹치는 것과 논지가 이어지는 것은 다르다</b>. 또 ③을 빼면 ②(크게 내라) → ④(However, 그러나 아껴 써라)의 대조가 곧바로 이어져 훨씬 매끄럽다."}], "opts": [{"n": "①", "t": "자신 있게 지시할수록 학급 반응이 좋아진다.", "a": false, "x": true, "trap": false, "e": "교사가 <b>어떻게 말하느냐</b>가 학급 반응을 좌우한다는 내용으로, 2번 문장의 주제를 그대로 잇는다."}, {"n": "②", "t": "목소리를 크게 낼 수 있으면 유용할 때가 있다.", "a": false, "x": true, "trap": false, "e": "목소리의 <b>용도(different purposes)</b> 중 하나를 구체적으로 든 것이다. ④의 However가 받을 앞 내용이기도 하다."}, {"n": "③", "t": "소음 문제 해결을 위해 학생·학부모·교사가 함께 해결책을 찾아야 한다.", "a": true, "x": false, "trap": false, "e": "주어가 교사에서 <b>학교 구성원 전체</b>로 바뀌고, 주제도 목소리 사용법이 아니라 <b>소음 문제 해결</b>로 옮겨 갔다. noise라는 단어만 겹칠 뿐이다."}, {"n": "④", "t": "가장 큰 목소리는 아껴 쓰고 고함은 피하라.", "a": false, "x": true, "trap": true, "e": "<b>However</b>로 ②와 대조를 이루며 글의 방향을 잡아 준다. ③을 빼야 이 However가 자연스러워진다."}, {"n": "⑤", "t": "조용하고 침착한 어조가 고함보다 파급력이 크다.", "a": false, "x": true, "trap": false, "e": "④의 조언에 <b>이유</b>를 붙여 글을 마무리하는 문장이다."}], "w": [["countless", "수많은"], ["recognise", "알아보다, 인식하다"], ["means", "수단"], ["decoding", "해독"], ["confidently", "자신 있게"], ["project", "(목소리를) 멀리 내보내다"], ["cut through", "~을 뚫고 나가다"], ["address", "(문제를) 다루다"], ["sparingly", "아껴서, 드물게"], ["authoritative", "권위 있는"], ["measured", "침착한, 신중한"], ["panicked", "당황한, 겁먹은"]]}, {"q": "09", "type": "요약문 완성", "src": "2014학년도 수능 B형 40번", "ans": "②", "tr": [["1", "로볼링은 두 사람이 합의에 이른 뒤 한 사람이 상대방이 부담할 비용을 올리는 기법을 가리킨다."], ["2", "예를 들어 소비자가 8,000달러에 차를 사기로 합의한 뒤에, 판매원이 세금 100달러와 타이어 값 200달러를 덧붙이기 시작한다."], ["3", "이 추가 비용은 판매원이 소비자에게 던지는 비유적인 '낮은 공'으로 여겨질 수 있다."], ["4", "로볼링이 효과를 내는 이유에 대한 한 가지 설명은 자기 인식 이론의 관점에서 나온다."], ["5", "소비자가 원래 조건으로 그 상품을 사기로 합의할 때, 그 행동은 소비자 자신이 그 상품에 진심으로 관심이 있다고 추론하는 근거로 쓰일 수 있다."], ["6", "이렇게 추론된 진심 어린 관심이 그가 늘어난 비용을 견디게 해 줄 수 있다."], ["7", "또 다른 설명은 인상 관리 이론의 관점에서 나온다."], ["8", "만약 소비자가 합의 조건의 '사소한' 변경 후에 거래에서 발을 뺀다면, 그는 이런 필요한 요금들을 알지 못했던 무책임한 소비자라는 다소 바람직하지 않은 인상을 스스로 만들어 낼지도 모른다."], ["9", "[요약문] 로볼링이 판매 상황에서 효과적인 이유는, 소비자가 거래에서 발을 빼지 않음으로써 자신의 구매 결정을 (A)정당화하려 하거나 (B)체면을 지키려 하기 때문이다."]], "evh": "5번 문장", "ev": [{"en": true, "h": "When the consumer agrees to purchase the product under the original terms, that behavior might be used by the consumer to infer his sincere interest in the product."}, {"en": false, "h": "요약문 완성은 <b>본문의 두 설명이 각각 (A)와 (B)에 하나씩 대응</b>하는 구조인 경우가 많다. 이 글에도 설명이 정확히 두 개다. 첫째, <b>자기 인식 이론</b>(4~6번 문장) — 소비자는 자기가 사기로 한 행동을 근거로 '내가 이 상품에 정말 관심이 있구나'라고 <b>스스로 납득</b>하고 늘어난 비용을 감수한다. 이것이 (A) <b>justify</b>(자기 결정을 정당화하다)다. 둘째, <b>인상 관리 이론</b>(7~8번 문장) — 지금 발을 빼면 <b>무책임한 소비자라는 인상</b>이 남으므로 그것을 피하려 한다. 이것이 (B) <b>face</b>(체면)다. save face는 '체면을 지키다'라는 관용 표현이다."}], "opts": [{"n": "①", "t": "justify …… time", "a": false, "x": true, "trap": false, "e": "(A) justify는 맞지만 (B) time이 틀렸다. 본문은 <b>시간</b>을 아끼는 이야기를 한 적이 없다. 실제로 추가된 것은 시간이 아니라 <b>돈</b>이다."}, {"n": "②", "t": "justify …… face", "a": true, "x": false, "trap": false, "e": "(A)는 5~6번 문장의 자기 인식 이론(스스로 진심 어린 관심을 추론해 비용을 견딤), (B)는 8번 문장의 인상 관리 이론(무책임한 소비자라는 인상을 피함)에 각각 대응한다."}, {"n": "③", "t": "cherish …… time", "a": false, "x": true, "trap": false, "e": "cherish는 '소중히 여기다'로, 구매 결정을 <b>합리화한다</b>는 본문의 논지와 결이 다르다. (B)도 틀렸다."}, {"n": "④", "t": "modify …… face", "a": false, "x": true, "trap": true, "e": "(B) face는 맞지만 (A) modify(수정하다)가 틀렸다. 소비자는 결정을 <b>바꾸지 않고 그대로 밀고 나간다</b>는 것이 핵심이다."}, {"n": "⑤", "t": "modify …… trouble", "a": false, "x": true, "trap": false, "e": "둘 다 틀렸다. 소비자가 피하려는 것은 번거로움이 아니라 <b>무책임하다는 인상</b>이다."}], "w": [["low-balling", "로볼링(뒤늦게 값을 올리는 기법)"], ["arrive at an agreement", "합의에 이르다"], ["incur", "(비용을) 부담하다, 초래하다"], ["metaphorical", "비유적인"], ["self-perception", "자기 인식"], ["original terms", "원래의 조건"], ["infer", "추론하다"], ["sincere", "진심 어린"], ["endure", "견디다, 참다"], ["withdraw", "철회하다, 손을 떼다"], ["foster", "조성하다, 키우다"], ["undesirable", "바람직하지 않은"]]}, {"q": "10", "type": "글의 순서", "src": "2017학년도 수능 43번", "ans": "⑤", "tr": [["1", "[주어진 글 (A)] Erik Brandes라는 이름의 열일곱 살 독일 소년이 쾰른 오페라 하우스의 텅 빈 광대한 무대로 걸어 나왔다. Erik의 인생에서 가장 흥분되는 날이었다. (a) 독일 최연소 공연 기획자였던 그는 미국 피아니스트 Keith Jarrett의 즉흥 재즈 심야 공연을 열도록 오페라 하우스를 설득해 냈다. 공연은 매진되었고, 그날 저녁 늦게 Keith가 피아노 앞에 앉아 연주할 예정이었다."], ["2", "(D) 그러나 그날 오후 Erik이 Keith와 그의 제작자 Manfred를 무대 위 피아노로 안내했을 때, 일이 잘 풀리지 않았다. Keith와 Manfred는 몇 음을 쳐 보았다. 그러고 나서 긴 침묵 끝에 Manfred가 (e) 그(Erik)에게 다가와 말했다. \"Erik, 다른 피아노를 구해 오지 않으면 Keith는 오늘 밤 연주할 수 없어요.\" Erik은 Keith가 특정 악기를 요청했고 오페라 하우스가 그것을 제공하기로 합의했다는 것을 알고 있었다. 그가 미처 몰랐던 것은, 행정 직원들이 요청받은 그 뵈젠도르퍼 피아노를 구하지 못해 대신 상태가 형편없는 아주 작은 뵈젠도르퍼를 설치해 두었다는 사실이었다."], ["3", "(C) 당연하게도 Keith는 연주하고 싶어 하지 않았다. 그는 자리를 떠나 차 안에서 기다렸고, Erik은 곧 격분할 관객들이 몰려오리라는 것을 혼자 예상하며 남겨졌다. 절박해진 (c) 그 독일 소년은 Keith를 따라잡아 그 재즈 피아니스트에게 연주해 달라고 애원했다. 피아니스트는 빗속에 흠뻑 젖은 채 서 있는 그를 내다보고는 그를 불쌍히 여겼다. \"절대 잊지 마세요.\" Keith가 말했다. \"오직 (d) 당신을 위해서입니다.\" 몇 시간 뒤 Keith는 꽉 찬 공연장 앞에서 그 연주할 수 없는 피아노를 향해 걸어 나갔다."], ["4", "(B) Keith가 연주를 시작하자, 모두가 곧바로 이것이 마법 같은 일임을 알아차렸다. Erik도 깊이 감동했다. Keith는 그 피아노의 결점에도 불구하고 뜻밖에도 일생일대의 연주를 만들어 내고 있었다. (b) 그의 왼손은 피아노의 울림 부족을 감추기 위한 방편으로 우레 같은 반복 저음 악절을 만들어 냈다. Keith는 2층 관람석까지 닿을 음량을 내기 위해 그 피아노를 정말 세게 쳐야만 했다. 일어섰다 앉았다 하며 Keith는 그 연주할 수 없는 피아노로 유일무이한 무언가를 만들어 냈다. 그가 연주하리라고 상상해 본 적 없는 음악이었다. 그러나 난관에 부딪히자 그는 그것을 받아들였고 높이 날아올랐다."]], "evh": "(D)", "ev": [{"en": true, "h": "But when Erik introduced Keith and his producer Manfred to the piano on the stage that afternoon, it didn't go well."}, {"en": false, "h": "순서 문항은 <b>연결어와 지시어가 무엇을 받는지</b>만 따라가면 된다. 주어진 글 (A)는 '<b>매진되었고 곧 연주할 예정이었다</b>'로 기대에 부풀어 끝난다. 이 흐름을 뒤집는 <b>But</b>으로 시작하고 <b>that afternoon</b>이라는 같은 날을 가리키는 <b>(D)</b>가 바로 뒤에 온다. (D)는 '피아노가 형편없다'는 문제를 드러내며 끝나고, <b>(C)</b>의 첫 문장 <b>Understandably, Keith didn't want to perform</b>은 그 문제를 이미 알아야만 '당연하게도'가 성립한다. 그러니 (D) → (C)다. (C)는 Keith가 마침내 무대로 걸어 나가는 장면으로 끝나고, <b>(B)</b>는 <b>When Keith began to play</b>로 연주 장면을 이어받는다. 따라서 <b>(D) – (C) – (B)</b>다."}], "opts": [{"n": "①", "t": "(B) – (D) – (C)", "a": false, "x": true, "trap": false, "e": "(B)의 첫 문장은 <b>Keith가 이미 연주를 시작한</b> 장면이다. 피아노 문제도 애원도 나오기 전에 연주가 시작될 수는 없다."}, {"n": "②", "t": "(C) – (B) – (D)", "a": false, "x       return `<div class="part ${p} ${bad?'bad':''}"><span class="tag">${tag}</span><span>${esc(txt)}${ko?`<span class="ko"> ${esc(ko)}</span>`:''}</span>${bad?rs:''}</div>`;
    };
    h+=row('m','뜻',w.m,'');
    if(w.s)h+=row('s','유',w.s[0],w.s[1]);
    if(w.a)h+=row('a','반',w.a[0],w.a[1]);
    h+=`</div>`;
  });
  h+=`</div><div class="bar"><div class="wrap"><button class="btn" id="back2">확인표</button><button class="btn pri" id="start" ${list.length?'':'disabled'}>복습 시작</button></div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='word';armed=null;render();};
  $('#back2').onclick=()=>{view='word';render();};
  $('#start').onclick=()=>{quiz={qs:buildQuestions(),n:0,right:0,done:false,shown:false};view='quiz';render();};
}
function buildQuestions(){
  const qs=[];
  noteList().forEach(it=>{
    const w=it.w;
    it.parts.forEach(p=>{
      let q={i:it.i,p:p,w:w.w};
      if(p==='m'){
        const toks=x=>x.split(/[,，]\s*/).map(t=>t.trim());
        const ct=toks(w.m);
        const pool=[...new Set(WS.words.filter(o=>o!==w).map(o=>o.m))].filter(m=>!toks(m).some(t=>ct.includes(t)));
        const wrong=shuffle(pool,WS.id+w.w+'m').slice(0,3);
        q.type='choice';q.ask='뜻을 고르세요';
        q.opts=shuffle([{t:w.m,ok:1}].concat(wrong.map(t=>({t:t,ok:0}))),WS.id+w.w+'mo');
      }else{
        const ans=w[p],d=WS.dist||[];
        q.ask=p==='s'?'유의어를 고르세요':'반의어를 고르세요';
        if(d.length>=3){
          q.type='choice';
          q.opts=shuffle([{t:ans[0],ko:ans[1],ok:1}].concat(shuffle(d,WS.id+w.w+p).slice(0,3).map(x=>({t:x[0],ko:x[1],ok:0}))),WS.id+w.w+p+'o');
        }else{q.type='flip';q.ans=ans;}
      }
      qs.push(q);
    });
  });
  return qs;
}
function recordRes(q,ok){S.res[WS.id]=S.res[WS.id]||{};const r=S.res[WS.id][q.i]=S.res[WS.id][q.i]||{};r[q.p]=ok?1:0;save();}
function renderQuiz(){
  const q=quiz.qs[quiz.n];
  let h=`<header><div class="wrap hd2"><h1>복습</h1><button class="link" id="back">오답노트</button></div></header><div class="wrap ${quiz.done?'done':''}"><div class="q"><div class="cnt">${quiz.n+1} / ${quiz.qs.length}</div><div class="ask">${q.ask}</div><div class="target">${esc(q.w)}</div>`;
  if(q.type==='choice'){
    q.opts.forEach((o,k)=>{
      let cls='';
      if(quiz.done){if(o.ok)cls='right';else if(k===quiz.pick)cls='wrong';}
      h+=`<button class="opt ${cls}" data-k="${k}">${esc(o.t)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`;
    });
  }else if(quiz.shown)h+=`<div class="opt right">${esc(q.ans[0])}<span class="ko">${esc(q.ans[1])}</span></div>`;
  h+=`</div></div><div class="bar"><div class="wrap">`;
  if(q.type==='flip'&&!quiz.shown)h+=`<button class="btn pri" id="show">정답 보기</button>`;
  else if(q.type==='flip')h+=`<button class="btn" id="no">몰랐음</button><button class="btn pri" id="yes">알았음</button>`;
  else h+=`<button class="btn pri" id="next" ${quiz.done?'':'disabled'}>${quiz.n+1===quiz.qs.length?'결과':'다음'}</button>`;
  h+=`</div></div>`;
  app.innerHTML=h;
  $('#back').onclick=()=>{view='note';render();};
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
    if(quiz.done)return;
    const k=+b.dataset.k;quiz.pick=k;quiz.done=true;
    const ok=q.opts[k].ok===1;if(ok)quiz.right++;recordRes(q,ok);render();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>advance();
  const sh=$('#show');if(sh)sh.onclick=()=>{quiz.shown=true;render();};
  const yes=$('#yes');if(yes)yes.onclick=()=>{quiz.right++;recordRes(q,true);advance();};
  const no=$('#no');if(no)no.onclick=()=>{recordRes(q,false);advance();};
}
function advance(){
  if(quiz.n+1>=quiz.qs.length){view='result';render();return;}
  quiz.n++;quiz.done=false;quiz.shown=false;quiz.pick=null;render();
}
function renderResult(){
  app.innerHTML=`<header><div class="wrap hd2"><h1>복습 결과</h1></div></header><div class="wrap"><div class="score">${quiz.right} <small>/ ${quiz.qs.length}</small></div></div><div class="bar"><div class="wrap"><button class="btn" id="a">오답노트</button><button class="btn pri" id="b">확인표</button></div></div>`;
  $('#a').onclick=()=>{view='note';render();};
  $('#b').onclick=()=>{view='word';render();};
}

function renderSubmit(){
  const done=!!S.sub;
  while(S.q.length<N)S.q.push(0);
  let h=hdr()+band(3)+'<div class="wrap">';
  for(let i=0;i<N;i++){
    const sel=done?S.sub.a[i]:S.q[i];
    h+=`<div class="qrow"><div class="qno">${esc(D[i].no)}</div><div class="opts">`;
    for(let k=1;k<=5;k++)h+=`<button class="opt2 ${sel===k?'on':''}" data-q="${i}" data-k="${k}" ${done?'disabled':''}>${CIRC[k-1]}</button>`;
    h+='</div></div>';
  }
  h+='</div><div class="bar"><div class="wrap">';
  if(done)h+='<button class="btn pri" id="toexp">해설 보기</button>';
  else h+=`<button class="btn pri" id="sub" ${S.q.every(v=>v>0)?'':'disabled'}>답안지 제출</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt2').forEach(b=>b.onclick=()=>{
    if(S.sub)return;
    const q=+b.dataset.q,k=+b.dataset.k;S.q[q]=k;save();
    b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    $('#sub').disabled=!S.q.every(v=>v>0);
  });
  const sb=$('#sub');if(sb)sb.onclick=()=>{
    let s=0;for(let i=0;i<N;i++)if(isRight(i,S.q[i]))s++;
    S.sub={t:Date.now(),a:S.q.slice(),s:s};save();
    recSend({type:'submit',a:S.sub.a,s:s,n:N});
    view='exp';render();
  };
  const te=$('#toexp');if(te)te.onclick=()=>{view='exp';render();};
}

var EXP={"07": "<p class=\"mtr\">마더텅 정답률 <b>45%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">빈칸은 <b>not A so much as B</b>(A라기보다는 B). A인 wild talent(유별난 재능)의 <b>반대편</b>이면서, 뒤에서 계속 되풀이되는 <b>“많이 한다”</b>를 한 단어로 묶는 말을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">빈칸 문장 (1번)</span><div class=\"en\">One unspoken truth about creativity — it isn’t about wild talent <mark>so much as</mark> it is about <span style=\"white-space:nowrap\"><span class=\"bl\">&nbsp;&nbsp;?&nbsp;&nbsp;</span>.</span></div><p class=\"ko\">창의성은 유별난 재능에 관한 것이라기보다는 ( ? )에 관한 것이다</p></div><div class=\"ck-via\"><i>▼</i><span>재능 대신 무엇이 필요한지 바로 말해 줌</span></div><div class=\"ck-step\"><span class=\"lab\">2번 문장 · 첫 번째 근거</span><div class=\"en\">To find a few ideas that work, <mark>you need to try a lot</mark> that don’t.</div><p class=\"ko\">효과가 있는 몇몇 아이디어를 발견하기 위해서, <mark>당신은 많은 것들을 시도할 필요가 있다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>천재도 재능(성공률)이 아니라 양으로 이긴다</span></div><div class=\"ck-step key\"><span class=\"lab\">4번 문장 · 결정적 단서</span><div class=\"en\">Geniuses don’t necessarily have a higher success rate than other creators; <mark>they simply do more</mark> …</div><p class=\"ko\">천재들이 반드시 다른 창조자들보다 성공률이 더 높은 것이 아니다; <mark>그들(= 천재들)은 그저 더 많이 한다</mark> …</p></div><div class=\"ck-via\"><i>▼</i><span>많이 하니까 성공도 실패도 둘 다 많아짐</span></div><div class=\"ck-step\"><span class=\"lab\">5번 문장 · 덧붙이는 근거</span><div class=\"en\">They have <mark>more successes and more failures</mark>.</div><p class=\"ko\">그들은 <mark>더 많이 성공한다 ‘그리고’ 더 많이 실패한다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">④</span><span class=\"t\">productivity 생산성<small>try a lot(많이 시도하다), do more(더 많이 하다)를 한 단어로 묶은 말이에요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">achievement 성취</span><span class=\"why\">5번에 successes(성공)가 나와서 끌려요. 하지만 지문은 성공만큼 failures(실패)도 많다고 했어요. 핵심은 결과가 아니라 많이 만들어 내는 양이에요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">sensitivity 감수성</span><span class=\"why\">예민하게 느끼는 능력은 wild talent(유별난 재능) 쪽에 가까워요. 2·4번은 타고난 능력이 아니라 “많이 한다”를 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">superiority 우월성</span><span class=\"why\">4번에서 천재가 다른 창조자보다 성공률이 반드시 더 높지는 않다고 했어요. 남보다 뛰어남은 오히려 부정된 말이에요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">imagination 상상력</span><span class=\"why\">창의성과 잘 어울리는 단어라 그럴듯하지만, 지문은 상상력 얘기가 없고 시도의 횟수(a pure numbers game 순전히 숫자 게임)만 말해요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">One unspoken truth about creativity —</div><div class=\"k\">창의성에 관한 한 가지 암묵적인 사실은 —</div></div><div class=\"rc\"><div class=\"e\">it isn’t about wild talent</div><div class=\"k\">그것(= 창의성)은 유별난 재능에 관한 것이 아니다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">so much as</span> it is about productivity.</div><div class=\"k\"><span class=\"cw\">~라기보다는</span> 생산성에 관한 것이다. ※ 문제지엔 productivity가 빈칸으로 되어 있음</div></div><div class=\"rnat\">창의성에 관한 한 가지 암묵적인 사실은, 그것이 유별난 재능에 관한 것이라기보다는 생산성에 관한 것(이라는 점)이다.</div><div class=\"rst\">유튜브 그림 채널 형을 보면 “타고났네” 싶죠? 지문은 창의성이 <b>재능보다 많이 만들어 내는 것</b>(productivity)이라고 해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc\"><div class=\"e\">To find a few ideas</div><div class=\"k\">몇몇 아이디어를 발견하기 위해서</div></div><div class=\"rc\"><div class=\"e\">that work,</div><div class=\"k\">효과가 있는,</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">you need to try a lot</span></div><div class=\"k\"><span class=\"cw\">당신은 많은 것들을 시도할 필요가 있다</span></div></div><div class=\"rc\"><div class=\"e\">that don’t.</div><div class=\"k\">그렇지 않은(= 효과가 없는).</div></div><div class=\"rnat\">효과가 있는 몇몇 아이디어를 발견하기 위해서, 당신은 그렇지 않은(효과가 없는) 많은 것들을 시도할 필요가 있다.</div><div class=\"rst\">형도 잘 된 그림 몇 장을 얻으려고 망한 그림을 엄청 많이 그렸어요. = 지문의 <b>많은 것을 시도해야 한다</b>.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">It’s</div><div class=\"k\">그것(= 많이 시도해서 효과 있는 아이디어를 찾는 일)은 ~이다</div></div><div class=\"rc\"><div class=\"e\">a pure numbers game.</div><div class=\"k\">순전히 숫자 게임.</div></div><div class=\"rnat\">그것은 순전히 숫자 게임이다.</div><div class=\"rst\">많이 그릴수록 잘 된 그림도 늘어나요. 그래서 지문은 창의성이 순전히 <b>숫자 게임</b>이라고 해요.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">Geniuses don’t necessarily have</div><div class=\"k\">천재들이 반드시 가지는 것은 아니다</div></div><div class=\"rc\"><div class=\"e\">a higher success rate</div><div class=\"k\">더 높은 성공률을</div></div><div class=\"rc\"><div class=\"e\">than other creators;</div><div class=\"k\">다른 창조자들보다;</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">they simply do more</span> —</div><div class=\"k\"><span class=\"cw\">그들(= 천재들)은 그저 더 많이 한다</span> —</div></div><div class=\"rc\"><div class=\"e\">and they do a range of different things.</div><div class=\"k\">그리고 그들은 여러 가지 다양한 것들을 한다.</div></div><div class=\"rnat\">천재들이 반드시 다른 창조자들보다 성공률이 더 높은 것이 아니다. 그들은 그저 더 많이 하고, 여러 가지 다양한 것들을 한다.</div><div class=\"rst\">형의 그림이 한 장 한 장 더 잘 되는 건 아니에요. 그냥 <b>더 많이</b>, 여러 종류를 그릴 뿐이에요. = 지문의 천재들.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">They have more successes</div><div class=\"k\">그들(= 천재들)은 더 많이 성공한다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">and more failures.</span></div><div class=\"k\"><span class=\"cw\">‘그리고’ 더 많이 실패한다.</span></div></div><div class=\"rnat\">그들은 더 많이 성공하며 ‘그리고’ 더 많이 실패한다.</div><div class=\"rst\">그래서 형은 칭찬받는 그림도 많고, 망한 그림도 친구들보다 훨씬 많아요. = 지문의 <b>성공도 실패도 더 많다</b>.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">That goes for</div><div class=\"k\">그것(= 성공도 실패도 많다는 것)은 ~에 해당된다</div></div><div class=\"rc\"><div class=\"e\">teams and companies too.</div><div class=\"k\">팀과 회사에도.</div></div><div class=\"rnat\">그것은 팀과 회사에도 해당된다.</div><div class=\"rst\">반 전체가 함께 만드는 축제 포스터도 똑같아요. 지문도 이게 팀과 회사에도 해당된다고 말해요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">It’s impossible</div><div class=\"k\">불가능하다</div></div><div class=\"rc\"><div class=\"e\">to generate a lot of good ideas</div><div class=\"k\">좋은 아이디어를 많이 만들어 내는 것은</div></div><div class=\"rc\"><div class=\"e\">without also generating a lot of bad ideas.</div><div class=\"k\">나쁜 아이디어도 많이 만들어 내지 않고서.</div></div><div class=\"rnat\">나쁜 아이디어를 많이 만들어 내지 않고서도 좋은 아이디어를 많이 만들어 내는 것은 불가능하다.</div><div class=\"rst\">망한 시안 없이 멋진 시안만 잔뜩 뽑는 건 불가능해요. = 지문의 나쁜 아이디어 없이 좋은 아이디어도 없다.</div></div><div class=\"rds\" data-ord=\"8\"><span class=\"rn\">8번</span><div class=\"rc\"><div class=\"e\">The thing about creativity is</div><div class=\"k\">창의성의 문제는 ~이다</div></div><div class=\"rc\"><div class=\"e\">that at the outset,</div><div class=\"k\">처음에</div></div><div class=\"rc\"><div class=\"e\">you can’t tell</div><div class=\"k\">당신은 알 수 없다는 것</div></div><div class=\"rc\"><div class=\"e\">which ideas will succeed</div><div class=\"k\">어떤 아이디어가 성공할지</div></div><div class=\"rc\"><div class=\"e\">and which will fail.</div><div class=\"k\">그리고 어떤 것이 실패할지.</div></div><div class=\"rnat\">창의성의 문제는, 처음에 당신이 어떤 아이디어가 성공하고 어떤 아이디어가 실패할 것인지를 알 수 없다는 것이다.</div><div class=\"rst\">그리기 전에는 어떤 그림이 잘 될지 아무도 몰라요. 지문도 처음엔 성공할지 실패할지 알 수 없다고 해요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">So the only thing you can do</div><div class=\"k\">그래서 당신이 할 수 있는 유일한 것은</div></div><div class=\"rc\"><div class=\"e\">is try to fail faster</div><div class=\"k\">더 빨리 실패하려고 하는 것이다</div></div><div class=\"rc\"><div class=\"e\">so that you can move onto the next idea.</div><div class=\"k\">다음 아이디어로 이동할 수 있도록.</div></div><div class=\"rnat\">그래서 당신이 할 수 있는 유일한 것은 다음 아이디어로 이동할 수 있도록 더 빨리 실패하려고 하는 것이다.</div><div class=\"rst\">그러니 망한 그림은 빨리 접고 다음 그림으로 가요. 지문의 결론도 <b>더 빨리 실패하고</b> 다음 아이디어로 가라는 거예요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"so much as\" data-m=\"~라기보다는\"><b>so much as</b>~라기보다는</button><button type=\"button\" class=\"wdb\" data-w=\"numbers game\" data-m=\"숫자(확률) 싸움\"><b>numbers game</b>숫자(확률) 싸움</button><button type=\"button\" class=\"wdb\" data-w=\"necessarily\" data-m=\"반드시\"><b>necessarily</b>반드시</button><button type=\"button\" class=\"wdb\" data-w=\"success rate\" data-m=\"성공률\"><b>success rate</b>성공률</button><button type=\"button\" class=\"wdb\" data-w=\"generate\" data-m=\"만들어 내다\"><b>generate</b>만들어 내다</button><button type=\"button\" class=\"wdb\" data-w=\"at the outset\" data-m=\"처음에\"><b>at the outset</b>처음에</button></div>", "08": "<p class=\"mtr\">마더텅 정답률 <b>80%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">무관한 문장은 <b>글 전체 화제</b>를 먼저 잡고 하나씩 대 보는 문제예요. 이 글의 화제는 <b>교사가 자기 목소리를 어떻게 쓰나</b>예요. noise(소음)라는 단어만 비슷하고 <b>주어와 화제가 바뀐</b> 문장을 찾으세요.</p><div class=\"ck-step\"><span class=\"lab\">2번 · 글 전체 화제</span><div class=\"en\"><mark>Learning to control your voice</mark> and use it for different purposes is, therefore, one of the most important skills to develop as an early career teacher.</div><p class=\"ko\"><mark>당신의 목소리를 통제하는 것을 배우는 것은</mark> 그러므로 경력 초기의 교사로서 개발해야 할 가장 중요한 기술 중 하나이다.</p></div><div class=\"ck-via\"><i>▼</i><span>목소리를 크게 내는 쓰임 = 2번의 ‘다양한 목적’ 중 하나</span></div><div class=\"ck-step\"><span class=\"lab\">②(4번) · 화제 이어 가기</span><div class=\"en\">There are times when being able to <mark>project your voice loudly</mark> will be very useful …</div><p class=\"ko\"><mark>당신의 목소리를 크게 내보낼 수 있는 것이</mark> 학교에서 일할 때 매우 유용할 경우가 있고 …</p></div><div class=\"ck-via\"><i>▼</i><span>주어가 교사 한 명 → 학생·학부모·교사로, 목소리 사용법 → 소음 문제 해결로 바뀜</span></div><div class=\"ck-step key\"><span class=\"lab\">③(5번) · 이탈 지점</span><div class=\"en\">In order to address <mark>serious noise issues</mark> in school, <mark>students, parents and teachers</mark> should search for a solution together.</div><p class=\"ko\">학교 내의 <mark>심각한 소음 문제에</mark> 대처하기 위해서는 <mark>학생들, 학부모들, 그리고 교사들이</mark> 함께 해결책을 찾아야 한다.</p></div><div class=\"ck-via\"><i>▼</i><span>③을 빼면 ②(크게 내라) → ④(However 그러나, 아껴 써라) 대조가 바로 이어짐</span></div><div class=\"ck-step\"><span class=\"lab\">④(6번) · 다시 제자리</span><div class=\"en\"><mark>However</mark>, I would always advise that you use your loudest voice incredibly sparingly …</div><p class=\"ko\"><mark>그러나 나는 항상 조언하고자 한다</mark> 당신이 자신의 가장 큰 목소리를 놀랍도록 드물게 사용해야 한다고 …</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">③</span><span class=\"t\">소음 문제 해결을 위해 학생·학부모·교사가 함께 해결책을 찾아야 한다.<small>교사의 목소리 사용법이 아니라 학교 소음 문제의 공동 해결 이야기라 튀어요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">②</span><span><span class=\"t\">목소리를 크게 낼 수 있으면 유용할 때가 있다.</span><span class=\"why\">noisy classroom(시끄러운 교실)이 ③의 noise(소음)와 겹쳐서 의심되지만, 내용은 교사가 목소리를 크게 내보내는 법이라 화제 그대로예요.</span></span></div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">자신 있게 지시할수록 학급 반응이 좋아진다.</span><span class=\"why\">2번의 “목소리를 통제해 다양한 목적에 쓰기”의 첫 예예요. 자신 있는 목소리로 지시하는 교사 이야기라 이어져요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">가장 큰 목소리는 아껴 쓰고 고함은 피하라.</span><span class=\"why\">However(그러나)로 ②의 “크게 내기”를 뒤집으며 다시 교사의 목소리 사용법을 말해요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">조용하고 침착한 어조가 고함보다 파급력이 크다.</span><span class=\"why\">④에서 고함을 피하라고 한 이유를 대 줘요. 조용한 어조와 고함을 비교하는, 역시 교사 목소리 이야기예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Actors, singers, politicians and countless others</div><div class=\"k\">배우, 가수, 정치가, 그리고 수많은 다른 사람들은</div></div><div class=\"rc\"><div class=\"e\">recognise the power of the human voice</div><div class=\"k\">인간 목소리의 힘을 인정한다</div></div><div class=\"rc\"><div class=\"e\">as a means of communication</div><div class=\"k\">의사소통 수단으로서의</div></div><div class=\"rc\"><div class=\"e\">beyond the simple decoding of the words</div><div class=\"k\">단어의 단순한 해독을 넘어서는</div></div><div class=\"rc\"><div class=\"e\">that are used.</div><div class=\"k\">사용된.</div></div><div class=\"rnat\">배우, 가수, 정치가, 그리고 수많은 다른 사람들은 사용된 단어의 단순한 해독을 넘어서 의사소통 수단으로서의 인간 목소리의 힘을 인정한다.</div><div class=\"rst\">가수나 배우는 같은 대사라도 목소리로 느낌을 확 바꿔요. 지문도 목소리가 말 이상의 <b>힘</b>을 가진다고 해요.</div></div><div class=\"rds key\" data-ord=\"2\"><span class=\"rn\">2번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">Learning to control your voice</span></div><div class=\"k\"><span class=\"cw\">당신의 목소리를 통제하는 것을 배우는 것은</span></div></div><div class=\"rc\"><div class=\"e\">and use it for different purposes</div><div class=\"k\">그리고 그것(= 당신의 목소리)을 다양한 목적을 위해 사용하는 것을</div></div><div class=\"rc\"><div class=\"e\">is, therefore,</div><div class=\"k\">그러므로 ~이다,</div></div><div class=\"rc\"><div class=\"e\">one of the most important skills</div><div class=\"k\">가장 중요한 기술 중 하나</div></div><div class=\"rc\"><div class=\"e\">to develop as an early career teacher.</div><div class=\"k\">경력 초기의 교사로서 개발해야 할.</div></div><div class=\"rnat\">그러므로 당신의 목소리를 통제하고 그것을 다양한 목적을 위해 사용하는 것을 배우는 것은 경력 초기의 교사로서 개발해야 할 가장 중요한 기술 중 하나이다.</div><div class=\"rst\">그래서 새로 온 담임쌤에게 제일 중요한 기술은 <b>목소리 다루기</b>예요. = 지문의 경력 초기 교사가 키울 기술.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">The more confidently you give instructions,</div><div class=\"k\">당신이 더 자신 있게 지시를 내릴수록,</div></div><div class=\"rc\"><div class=\"e\">the higher the chance</div><div class=\"k\">가능성이 더 높다</div></div><div class=\"rc\"><div class=\"e\">of a positive class response.</div><div class=\"k\">긍정적인 학급 반응이 나올.</div></div><div class=\"rnat\">당신이 더 자신 있게 지시를 내릴수록, 긍정적인 학급 반응이 나올 가능성이 더 높다.</div><div class=\"rst\">① 쌤이 “자, 교과서 펴세요!” 하고 자신 있게 말하면 반 애들이 더 잘 따라요. = 지문의 자신 있는 지시.</div></div><div class=\"rds key\" data-ord=\"4\"><span class=\"rn\">4번 · 단서</span><div class=\"rc\"><div class=\"e\">There are times</div><div class=\"k\">~한 경우가 있다</div></div><div class=\"rc\"><div class=\"e\">when being able to project your voice loudly</div><div class=\"k\">당신의 목소리를 크게 내보낼 수 있는 것이</div></div><div class=\"rc\"><div class=\"e\">will be very useful</div><div class=\"k\">매우 유용할</div></div><div class=\"rc\"><div class=\"e\">when working in school,</div><div class=\"k\">학교에서 일할 때,</div></div><div class=\"rc\"><div class=\"e\">and knowing</div><div class=\"k\">그리고 아는 것은</div></div><div class=\"rc\"><div class=\"e\">that you can cut through</div><div class=\"k\">당신이 (목소리로) 가를 수 있다는 것을</div></div><div class=\"rc\"><div class=\"e\">a noisy classroom, dinner hall or playground</div><div class=\"k\">시끄러운 교실, 구내식당 혹은 운동장을</div></div><div class=\"rc\"><div class=\"e\">is a great skill to have.</div><div class=\"k\">갖춰야 할 훌륭한 기술이다.</div></div><div class=\"rnat\">당신의 목소리를 크게 내보낼 수 있는 것이 학교에서 일할 때 매우 유용할 경우가 있고, 당신이 시끄러운 교실, 구내식당 혹은 운동장을 (목소리로) 가를 수 있다는 것을 아는 것은 갖춰야 할 훌륭한 기술이다.</div><div class=\"rst\">② 시끌벅적한 급식실이나 운동장에서는 쌤이 목소리를 <b>크게</b> 쭉 뻗을 줄 알아야 해요. = 지문 4번.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">In order to address</div><div class=\"k\">대처하기 위해서는</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">serious noise issues in school,</span></div><div class=\"k\"><span class=\"cw\">학교 내의 심각한 소음 문제에,</span></div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">students, parents and teachers</span></div><div class=\"k\"><span class=\"cw\">학생들, 학부모들, 그리고 교사들이</span></div></div><div class=\"rc\"><div class=\"e\">should search for a solution together.</div><div class=\"k\">함께 해결책을 찾아야 한다.</div></div><div class=\"rnat\">학교 내의 심각한 소음 문제에 대처하기 위해서는 학생들, 학부모들, 그리고 교사들이 함께 해결책을 찾아야 한다.</div><div class=\"rst\">③ 갑자기 “학교 소음은 학생·학부모·쌤이 같이 해결해요”라고 해요. 쌤 목소리 얘기가 아니라 <b>소음 문제 해결</b>이라 튀어요.</div></div><div class=\"rds key\" data-ord=\"6\"><span class=\"rn\">6번 · 단서</span><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">However, I would always advise</span></div><div class=\"k\"><span class=\"cw\">그러나 나는 항상 조언하고자 한다</span></div></div><div class=\"rc\"><div class=\"e\">that you use your loudest voice</div><div class=\"k\">당신이 자신의 가장 큰 목소리를 사용해야 한다고</div></div><div class=\"rc\"><div class=\"e\">incredibly sparingly</div><div class=\"k\">놀랍도록 드물게</div></div><div class=\"rc\"><div class=\"e\">and avoid shouting</div><div class=\"k\">그리고 소리치는 것을 피해야 한다고</div></div><div class=\"rc\"><div class=\"e\">as much as possible.</div><div class=\"k\">최대한.</div></div><div class=\"rnat\">그러나 나는 당신이 자신의 가장 큰 목소리는 놀랍도록 드물게 사용해야 하고 소리치는 것을 최대한 피해야 한다고 항상 조언하고자 한다.</div><div class=\"rst\">④ <b>그런데</b>(However) 제일 큰 목소리는 정말 가끔만 쓰고, 소리 지르는 건 최대한 피해요. 지문이 ②를 뒤집는 곳이에요.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">A quiet, authoritative and measured tone</div><div class=\"k\">조용하고 권위가 있으며 침착한 어조는</div></div><div class=\"rc\"><div class=\"e\">has so much more impact</div><div class=\"k\">훨씬 더 큰 효과를 가진다</div></div><div class=\"rc\"><div class=\"e\">than slightly panicked shouting.</div><div class=\"k\">약간 당황한 고함보다.</div></div><div class=\"rnat\">조용하고 권위가 있으며 침착한 어조는 약간 당황한 고함보다 훨씬 더 큰 효과를 가진다.</div><div class=\"rst\">⑤ 차분하고 단단한 목소리가 당황해서 지르는 고함보다 훨씬 잘 먹혀요. = 지문의 조용하고 침착한 어조.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"means\" data-m=\"수단\"><b>means</b>수단</button><button type=\"button\" class=\"wdb\" data-w=\"confidently\" data-m=\"자신 있게\"><b>confidently</b>자신 있게</button><button type=\"button\" class=\"wdb\" data-w=\"project\" data-m=\"(목소리를) 멀리 내보내다\"><b>project</b>(목소리를) 멀리 내보내다</button><button type=\"button\" class=\"wdb\" data-w=\"address\" data-m=\"(문제를) 다루다\"><b>address</b>(문제를) 다루다</button><button type=\"button\" class=\"wdb\" data-w=\"sparingly\" data-m=\"아껴서, 드물게\"><b>sparingly</b>아껴서, 드물게</button><button type=\"button\" class=\"wdb\" data-w=\"authoritative\" data-m=\"권위 있는\"><b>authoritative</b>권위 있는</button></div>", "09": "<p class=\"mtr\">마더텅 정답률 <b>65%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이 지문은 low-balling(나중에 값 올리기)이 통하는 <b>설명이 딱 두 개</b>예요. 첫째 설명(<b>자기인식</b>) → (A), 둘째 설명(<b>인상 관리</b>) → (B)로 한 칸씩 짝지으세요.</p><div class=\"ck-step key\"><span class=\"lab\">5번 문장 · 첫째 설명(자기인식)</span><div class=\"en\">When the consumer agrees to purchase the product under the original terms, that behavior might be used by the consumer <mark>to infer his sincere interest</mark> in the product.</div><p class=\"ko\">소비자가 원래의 계약 조건하에서 제품을 구매하는 데 동의했을 때, 그 행위는 <mark>제품에 대한 그(= 소비자)의 진정한 관심을 추론하는 데</mark> 사용될 수도 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>“내가 진짜 원했구나” 하고 스스로 납득 → 늘어난 값도 받아들임 = 자기 결정을 정당화</span></div><div class=\"ck-step\"><span class=\"lab\">6번 문장 · (A)로 가는 다리</span><div class=\"en\">This inferred sincere interest in the product may enable him <mark>to endure the increased cost</mark>.</div><p class=\"ko\">이렇게 제품에 대해 추론된 진정한 관심은 그가 <mark>늘어난 비용을 감당할</mark> 수 있게 할 수도 있다.</p></div><div class=\"ck-via\"><i>▼</i><span>발을 빼면 나쁜 인상이 남으니 피하려 함 = 체면 지키기</span></div><div class=\"ck-step key\"><span class=\"lab\">8번 문장 · 둘째 설명(인상 관리)</span><div class=\"en\">If the consumer were to withdraw from the deal … he might foster <mark>the rather undesirable impression</mark> of being an irresponsible consumer …</div><p class=\"ko\">만약 소비자가 그 거래를 철회하려 한다면 … <mark>다소 바람직하지 않은 인상을</mark> 조성할 수도 있다 …</p></div><div class=\"ck-via\"><i>▼</i><span>5·6번 = (A) justify(정당화하다), 8번 = (B) save face(체면을 지키다)</span></div><div class=\"ck-step\"><span class=\"lab\">요약문 (9번) · 짝 맞추기</span><div class=\"en\">… tends to <mark>justify</mark> his purchase decision or tries to save <mark>face</mark>.</div><p class=\"ko\">… 자신의 구매 결정을 (A) <mark>정당화하는</mark> 경향이 있다 또는 (B) <mark>체면을 지키려고</mark> 하기 때문이다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">②</span><span class=\"t\">justify 정당화하다 …… face 체면<small>5·6번의 스스로 납득하기 → justify(정당화하다), 8번의 나쁜 인상 피하기 → save face(체면을 지키다)예요</small></span></div><div class=\"xs\">이래서 오답</div><div class=\"xr\"><span class=\"n\">①</span><span><span class=\"t\">justify 정당화하다 …… time 시간</span><span class=\"why\">(A)는 맞지만 (B)가 틀려요. 8번은 시간을 아끼는 얘기가 아니라 무책임하다는 impression(인상)을 피하는 얘기라 save face(체면을 지키다)가 맞아요.</span></span></div><div class=\"xr\"><span class=\"n\">③</span><span><span class=\"t\">cherish 소중히 여기다 …… time 시간</span><span class=\"why\">둘 다 틀려요. 5번은 결정을 아끼는 게 아니라 “진짜 관심 있었다”고 스스로 납득하는 것이고, (B)도 시간이 아니라 인상 문제예요.</span></span></div><div class=\"xr\"><span class=\"n\">④</span><span><span class=\"t\">modify 수정하다 …… face 체면</span><span class=\"why\">(B)는 맞지만 (A)가 틀려요. 이 소비자는 거래를 철회하지 않아요(not withdrawing 철회하지 않음). 결정을 바꾸는 게 아니라 지키는 쪽이에요.</span></span></div><div class=\"xr\"><span class=\"n\">⑤</span><span><span class=\"t\">modify 수정하다 …… trouble 문제</span><span class=\"why\">둘 다 틀려요. 결정을 바꾸지 않고, 8번은 문제를 피하는 게 아니라 undesirable impression(바람직하지 않은 인상)을 피하는 거예요.</span></span></div></div></div><details class=\"rd\" open><summary>직독직해 + 자연스러운 해석 + 결국 이 얘기</summary><div class=\"rdb\"><button type=\"button\" class=\"stbtn\">이야기로 이어 읽기</button><div class=\"rds\" data-ord=\"1\"><span class=\"rn\">1번</span><div class=\"rc\"><div class=\"e\">Low-balling describes the technique</div><div class=\"k\">low-balling은 (판매) 기술을 말한다</div></div><div class=\"rc\"><div class=\"e\">where two individuals arrive at an agreement</div><div class=\"k\">두 사람이 합의를 하고</div></div><div class=\"rc\"><div class=\"e\">and then one increases the cost</div><div class=\"k\">그다음 (그중) 한 명이 비용을 늘리는</div></div><div class=\"rc\"><div class=\"e\">to be incurred by the other.</div><div class=\"k\">상대방에 의해 물리게 되는.</div></div><div class=\"rnat\">low-balling(가격을 과소 산정하는 것)은 두 사람이 (가격에 관한) 합의를 한 다음, (그중) 한 명이 상대방에 의해 물려지게 되는(상대방이 물어야 하는) 비용을 늘리는 (판매)기술을 말하는 것이다.</div><div class=\"rst\">게임 아이템을 5천 원에 사기로 하고 나니, 판매자가 슬쩍 값을 더 붙여요. 지문은 이걸 <b>low-balling</b>(나중에 값 올리기)이라고 해요.</div></div><div class=\"rds\" data-ord=\"2\"><span class=\"rn\">2번</span><div class=\"rc\"><div class=\"e\">For example,</div><div class=\"k\">예를 들어,</div></div><div class=\"rc\"><div class=\"e\">after the consumer has agreed</div><div class=\"k\">소비자가 동의한 후에</div></div><div class=\"rc\"><div class=\"e\">to purchase a car for $8,000,</div><div class=\"k\">8천 달러에 자동차를 구매하는 데,</div></div><div class=\"rc\"><div class=\"e\">the salesperson begins to add on</div><div class=\"k\">판매자가 추가하기 시작한다</div></div><div class=\"rc\"><div class=\"e\">$100 for tax and $200 for tires.</div><div class=\"k\">세금으로 100달러 그리고 타이어 가격으로 200달러를.</div></div><div class=\"rnat\">예를 들어, 소비자가 8천 달러를 주고 자동차를 구매하는데 동의한 후에, 판매자가 세금으로 100달러 그리고 타이어 가격으로 200달러를 추가하기 시작한다.</div><div class=\"rst\">“수수료 500원, 포장비 1000원 추가요~” 지문에서도 차를 8천 달러에 사기로 한 뒤 세금·타이어값이 붙어요.</div></div><div class=\"rds\" data-ord=\"3\"><span class=\"rn\">3번</span><div class=\"rc\"><div class=\"e\">These additional costs</div><div class=\"k\">이러한 추가 비용은</div></div><div class=\"rc\"><div class=\"e\">might be thought of as</div><div class=\"k\">~으로 여겨질 수 있을 것이다</div></div><div class=\"rc\"><div class=\"e\">a metaphorical ‘low ball’</div><div class=\"k\">비유적인 ‘낮은 공’</div></div><div class=\"rc\"><div class=\"e\">that the salesperson throws the consumer.</div><div class=\"k\">판매자가 소비자에게 던지는.</div></div><div class=\"rnat\">이러한 추가 비용은 판매자가 소비자에게 던지는 비유적인 ‘낮은 공’과 같은 것으로 여겨질 수 있을 것이다.</div><div class=\"rst\">처음엔 낮게 던져 놓고 나중에 슬쩍 더 얹는 거예요. 그래서 지문은 이 추가 비용을 <b>낮은 공</b>(low ball)에 비유해요.</div></div><div class=\"rds\" data-ord=\"4\"><span class=\"rn\">4번</span><div class=\"rc\"><div class=\"e\">One explanation</div><div class=\"k\">한 가지 설명은</div></div><div class=\"rc\"><div class=\"e\">for the effectiveness of low-balling</div><div class=\"k\">low-balling의 효과에 관한</div></div><div class=\"rc\"><div class=\"e\">is in terms of self-perception theory.</div><div class=\"k\">자기인식 이론에 관한 것이다.</div></div><div class=\"rnat\">low-balling의 효과에 관한 한 가지 설명은 자기인식 이론에 관한 것이다.</div><div class=\"rst\">그런데 왜 다들 그냥 사 버릴까요? 지문은 첫째 이유를 <b>자기인식 이론</b>으로 설명해요.</div></div><div class=\"rds key\" data-ord=\"5\"><span class=\"rn\">5번 · 단서</span><div class=\"rc\"><div class=\"e\">When the consumer agrees</div><div class=\"k\">소비자가 동의했을 때</div></div><div class=\"rc\"><div class=\"e\">to purchase the product under the original terms,</div><div class=\"k\">원래의 계약 조건하에서 제품을 구매하는 데,</div></div><div class=\"rc\"><div class=\"e\">that behavior might be used by the consumer</div><div class=\"k\">그 행위는 소비자 (자신)에 의해 사용될 수도 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">to infer his sincere interest in the product.</span></div><div class=\"k\"><span class=\"cw\">제품에 대한 그(= 소비자)의 진정한 관심을 추론하는 데.</span></div></div><div class=\"rnat\">소비자가 원래의 계약 조건 하에서 제품을 구매하는데 동의했을 때, 그 행위는 제품에 대한 그(소비자)의 진정한 관심을 추론하는 데 소비자(자신)에 의해 사용될 수도 있다.</div><div class=\"rst\">“내가 사겠다고 했으니, 난 이 아이템을 <b>진짜 원하나 봐</b>.” 지문처럼 내 행동을 보고 내 마음을 추론해요.</div></div><div class=\"rds\" data-ord=\"6\"><span class=\"rn\">6번</span><div class=\"rc\"><div class=\"e\">This inferred sincere interest in the product</div><div class=\"k\">이렇게 제품에 대해 추론된 진정한 관심은</div></div><div class=\"rc\"><div class=\"e\">may enable him</div><div class=\"k\">그(= 소비자)가 ~할 수 있게 할 수도 있다</div></div><div class=\"rc\"><div class=\"e\">to endure the increased cost.</div><div class=\"k\">늘어난 비용을 감당할.</div></div><div class=\"rnat\">이렇게 제품에 대해 추론된 진정한 관심은 그(소비자)가 늘어난 비용을 감당할 수 있게 할 것이다.</div><div class=\"rst\">진짜 원한다고 믿으니 1500원 더 내는 것도 참아요. 이게 내 결정을 <b>정당화하는</b>(justify) 거예요. = 지문 6번.</div></div><div class=\"rds\" data-ord=\"7\"><span class=\"rn\">7번</span><div class=\"rc\"><div class=\"e\">An alternative explanation</div><div class=\"k\">또 다른 설명은</div></div><div class=\"rc\"><div class=\"e\">is in terms of impression management theory.</div><div class=\"k\">인상 관리 이론에 관한 것이다.</div></div><div class=\"rnat\">또 다른 설명은 인상 관리 이론에 관한 것이다.</div><div class=\"rst\">둘째 이유도 있어요. 지문은 이걸 <b>인상 관리 이론</b>이라고 해요.</div></div><div class=\"rds key\" data-ord=\"8\"><span class=\"rn\">8번 · 단서</span><div class=\"rc\"><div class=\"e\">If the consumer were to withdraw from the deal</div><div class=\"k\">만약 소비자가 그 거래를 철회하려 한다면</div></div><div class=\"rc\"><div class=\"e\">after the ‘slight’ change</div><div class=\"k\">‘약간의’ 변화가 있은 후에</div></div><div class=\"rc\"><div class=\"e\">in the terms of agreement,</div><div class=\"k\">합의 조건에 있어서,</div></div><div class=\"rc\"><div class=\"e\">he might foster</div><div class=\"k\">그(= 소비자)는 조성할 수도 있다</div></div><div class=\"rc ckc\"><div class=\"e\"><span class=\"cw\">the rather undesirable impression</span></div><div class=\"k\"><span class=\"cw\">다소 바람직하지 않은 인상을</span></div></div><div class=\"rc\"><div class=\"e\">of being an irresponsible consumer</div><div class=\"k\">무책임한 소비자라는</div></div><div class=\"rc\"><div class=\"e\">unaware of these necessary charges.</div><div class=\"k\">이러한 불가피한 비용에 대해 알지 못하는.</div></div><div class=\"rnat\">소비자가 합의 조건에 있어서 (제품 가격에) ‘약간의’ 변화가 있은 후에 그 거래를 철회하려 한다면, 그(소비자)는 이러한 불가피한 비용에 대해 알지 못하는 무책임한 소비자라는 다소 바람직하지 않은 인상을 조성할 수도 있다.</div><div class=\"rst\">지금 “안 살래요” 하면 “수수료도 모르는 사람”으로 보일까 봐 겁나요. 지문의 <b>바람직하지 않은 인상</b>이에요.</div></div><div class=\"rds\" data-ord=\"9\"><span class=\"rn\">9번</span><div class=\"rc\"><div class=\"e\">Low-balling is effective in sales contexts</div><div class=\"k\">low-balling은 판매 상황에서 효과적이다</div></div><div class=\"rc\"><div class=\"e\">because the consumer,</div><div class=\"k\">왜냐하면 소비자가,</div></div><div class=\"rc\"><div class=\"e\">by not withdrawing from the deal,</div><div class=\"k\">거래를 철회하지 않음으로써,</div></div><div class=\"rc ckc\"><div class=\"e\">tends to <span class=\"cw\">justify his purchase decision</span></div><div class=\"k\"><span class=\"cw\">자신의 구매 결정을 정당화하는</span> 경향이 있다 ※ 문제지엔 justify가 빈칸 (A)로 되어 있음</div></div><div class=\"rc ckc\"><div class=\"e\">or <span class=\"cw\">tries to save face.</span></div><div class=\"k\">또는 <span class=\"cw\">체면을 지키려고</span> 하기 때문이다. ※ 문제지엔 face가 빈칸 (B)로 되어 있음</div></div><div class=\"rnat\">low-balling은 (제품) 판매 상황에서 효과적인데 왜냐하면 소비자가, 거래를 철회하지 않음으로써, 자신의 구매 결정을 (A)정당화하는 경향이 있거나 (B)체면을 지키려고 하기 때문이다.</div><div class=\"rst\">그래서 그냥 사요. 내 결정을 <b>정당화하거나</b>(justify) <b>체면을 지키려고</b>(save face)요. 5·6번과 8번을 한 줄로 묶은 요약이에요.</div></div></div></details><div class=\"qh\">단어 </div><div class=\"wds\"><button type=\"button\" class=\"wdb\" data-w=\"incur\" data-m=\"(비용을) 부담하다, 초래하다\"><b>incur</b>(비용을) 부담하다, 초래하다</button><button type=\"button\" class=\"wdb\" data-w=\"infer\" data-m=\"추론하다\"><b>infer</b>추론하다</button><button type=\"button\" class=\"wdb\" data-w=\"endure\" data-m=\"견디다, 참다\"><b>endure</b>견디다, 참다</button><button type=\"button\" class=\"wdb\" data-w=\"withdraw\" data-m=\"철회하다, 손을 떼다\"><b>withdraw</b>철회하다, 손을 떼다</button><button type=\"button\" class=\"wdb\" data-w=\"undesirable\" data-m=\"바람직하지 않은\"><b>undesirable</b>바람직하지 않은</button><button type=\"button\" class=\"wdb\" data-w=\"save face\" data-m=\"체면을 지키다\"><b>save face</b>체면을 지키다</button></div>", "10": "<p class=\"mtr\">마더텅 정답률 <b>70%</b></p><div class=\"ck\"><div class=\"ck-h\">결정적 단서</div><div class=\"ck-b\"><p class=\"ck-lead\">이야기 순서 문제는 <b>시간순 + 사건의 고리</b>를 따라가요. 기대(밤 공연 예정) → <b>But</b>(하지만) 문제 발생 → <b>Understandably</b>(당연히) 거절 → 무대로 나가 <b>연주 시작</b> 순으로 이어 붙이세요.</p><div class=\"ck-step\"><span class=\"lab\">주어진 글 (A) 끝</span><div class=\"en\">The concert was a sellout, and later that evening, <mark>Keith would sit down at the piano</mark> and play.</div><p class=\"ko\">그 콘서트는 매진이었고, 그날 늦은 밤, <mark>Keith가 피아노 앞에 앉을 것이었다</mark>.</p></div><div class=\"ck-via\"><i>▼</i><span>But(하지만)으로 들뜬 기대를 뒤집고, that afternoon(그날 오후) = 공연 당일 낮</span></div><div class=\"ck-step key\"><span class=\"lab\">(D) · 첫 번째 고리</span><div class=\"en\"><mark>But when Erik introduced Keith</mark> and his producer Manfred to the piano on the stage <mark>that afternoon</mark>, it didn’t go well.</div><p class=\"ko\"><mark>하지만</mark> <mark>그날 오후</mark> Erik이 Keith와 그의 제작자 Manfred를 무대 위 피아노로 <mark>안내했을 때</mark>, 일이 틀어졌다.</p></div><div class=\"ck-via\"><i>▼</i><span>일이 틀어진 이유 = 요청한 피아노 대신 낡은 작은 피아노</span></div><div class=\"ck-step\"><span class=\"lab\">(D) 끝 · 문제의 정체</span><div class=\"en\">… they had instead installed a tiny little Bösendorfer that was <mark>in poor condition</mark>.</div><p class=\"ko\">… 그들은 대신 <mark>상태가 좋지 않았던</mark> 아주 작은 Bösendorfer (피아노)를 설치했다.</p></div><div class=\"ck-via\"><i>▼</i><span>Understandably(당연히)는 앞에서 나쁜 피아노 얘기를 들어야만 말이 돼요</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) · 두 번째 고리</span><div class=\"en\"><mark>Understandably</mark>, Keith didn’t want to perform.</div><p class=\"ko\"><mark>당연히</mark>, Keith는 공연하기를 원하지 않았다.</p></div><div class=\"ck-via\"><i>▼</i><span>(C) 끝에서 키스가 피아노로 걸어 나옴 → (B)에서 연주를 시작함</span></div><div class=\"ck-step key\"><span class=\"lab\">(C) 끝 → (B) · 세 번째 고리</span><div class=\"en\"><mark>When Keith began to play</mark>, everybody immediately knew this was magic.</div><p class=\"ko\"><mark>Keith가 연주하기 시작했을 때</mark>, 모든 사람들은 즉시 이것이 마법이라는 것을 알게 되었다.</p></div><div class=\"ck-via\"><i>▼</i><span>그래서 정답</span></div><div class=\"ck-ans\"><span class=\"n\">⑤</span><span class=\"t\">(D) – (C) – (B)<small>But(하지만) 문제 → Understandably(당연히) 거절 → 연주 시작, 세 고리가 시간순으로
